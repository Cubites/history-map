name: Test geo

# 지형 테스트(npm run test:geo): 지점 정답표·도형 품질·사건 연결·선 기준선을 확인한다 (docs/DESIGN.md 지형 테스트 절).
# 배포(deploy.yml)와 따로 돌고 배포를 막지 않는다 - 처음 2주는 보고만 하고, 거짓 실패가 없으면 deploy를 이 결과에 묶을지 정한다.
# 계산 캐시(.cache)를 복원해 두 번째 실행부터 빠르다. 첫 실행은 캐시가 없어 20~30분 어림(16 논리 프로세서 PC 기준)이고, 호스트 러너(vCPU 2~4개)에서는 2~4배 걸릴 수 있어
# job 제한을 넉넉히(150분) 두었다. 처음 한 번은 workflow_dispatch로 돌려 시간을 재 둘 것. 로캘이 다른 로컬 캐시와는 공유되지 않는다.
# 캐시 저장은 실패한 실행에서도 되도록 actions/cache를 restore/save로 나누고 save를 `if: always()`로 둔다(actions/cache@v4 하나는 job이 성공해야 저장해, 새 실패가 있는 동안 매번 차가운 캐시가 됨).
# 그래서 느린 두 단계에는 단계별 제한이 있다: 단계가 제한에 걸려 실패해도 job은 취소되지 않아 저장 단계가 돈다.
# 배포(deploy.yml)도 이 캐시를 읽기만 하므로 path 목록·key를 바꿀 때는 deploy.yml도 함께 바꾼다.
# 보고서(.cache/test-geo/report.md·json)는 실행 요약(Step Summary)에 붙고 artifact로도 올라간다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-geo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-geo:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # 호스트 러너의 vCPU 수에 맞춤 (자르기·겹침 worker 수, scripts/build-data/cache.ts)
      HISTORY_MAP_WORKERS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: geo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/build-data
            .cache/geo-ops
            .cache/test-geo
            .cache/build-data-wars
          key: geo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            geo-${{ hashFiles('package-lock.json') }}-
      # 전쟁 보기 지점(places)은 public/data/wars*.json이 필요하다 (장면 캐시가 있으면 빠름)
      - run: npm run build:data
        timeout-minutes: 60
      - run: npm run test:geo -- --ci
        timeout-minutes: 70
      # 성공·실패·단계 제한 초과와 관계없이 캐시를 저장한다 (같은 key가 이미 있으면 저장하지 않고 넘어감)
      - if: always() && steps.geo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/build-data
            .cache/geo-ops
            .cache/test-geo
            .cache/build-data-wars
          key: geo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-geo-report
          path: |
            .cache/test-geo/report.md
            .cache/test-geo/report.json
          if-no-files-found: ignore
