name: Build and deploy

# 저장소가 비공개인 동안에는 빌드와 데이터 검증만 하고,
# 공개로 전환하면 같은 워크플로가 GitHub Pages 배포까지 한다 (DESIGN.md §13).
# 공개 전환 후 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해야 한다.
#
# 지형 테스트(npm run test:geo -- --ci)를 통과해야 빌드·배포한다 (운영자 결정 2026-10-26: 2주 동안 보고만 한 66번 실행이 모두 성공, 거짓 실패 0).
# 순서: test-geo → build → deploy. test-geo가 실패하거나 취소되면 build·deploy는 시작하지 않아 사이트는 앞 버전 그대로다.
# 비상구: 수동 실행(workflow_dispatch)에서 skip_test를 고르면 지형 테스트를 건너뛰고 빌드·배포한다(거짓 실패로 급한 배포가 막혔을 때만).
# 지형 테스트만 따로 돌리려면 test-geo.yml을 수동 실행한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_test:
        description: '지형 테스트를 건너뛰고 배포 (거짓 실패로 급한 배포가 막혔을 때만)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.event.repository.private == false && github.event_name != 'pull_request' }}

jobs:
  # 지형 테스트: test-geo.yml의 job과 같은 단계다(바꿀 때는 둘을 함께). 계산 캐시(.cache)를 복원해 두 번째 실행부터 빠르다.
  # 첫 실행·엔진 코드가 바뀐 커밋은 캐시를 다시 만들어 30~40분 걸린다(2026-10-13 36분, 10-21 33분). 평소 1~2분.
  # 캐시 저장은 실패한 실행에서도 되도록 restore/save로 나누고 save를 `if: always()`로 둔다.
  test-geo:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # 호스트 러너의 vCPU 수에 맞춤 (자르기·겹침 worker 수, scripts/build-data/cache.ts)
      HISTORY_MAP_WORKERS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: geo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/build-data
            .cache/geo-ops
            .cache/test-geo
            .cache/build-data-wars
          key: geo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            geo-${{ hashFiles('package-lock.json') }}-
      # 전쟁 보기 지점(places)은 public/data/wars*.json이 필요하다 (장면 캐시가 있으면 빠름)
      - run: npm run build:data
        timeout-minutes: 60
      - run: npm run test:geo -- --ci
        timeout-minutes: 70
      # 성공·실패·단계 제한 초과와 관계없이 캐시를 저장한다 (같은 key가 이미 있으면 저장하지 않고 넘어감)
      - if: always() && steps.geo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/build-data
            .cache/geo-ops
            .cache/test-geo
            .cache/build-data-wars
          key: geo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-geo-report
          path: |
            .cache/test-geo/report.md
            .cache/test-geo/report.json
          if-no-files-found: ignore

  build:
    needs: test-geo
    # 지형 테스트가 성공했거나, 수동 실행에서 일부러 건너뛴 때만 (실패·취소면 시작하지 않음)
    if: ${{ !cancelled() && (needs.test-geo.result == 'success' || needs.test-geo.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 앞 job(test-geo)이 방금 저장한 같은 커밋의 계산 캐시를 읽기만 한다. 캐시 없이 build:data를 하면 약 20분, 있으면 수 분.
      # 열쇠는 입력·코드 해시라(scripts/build-data/cache.ts) 앞 커밋의 캐시를 써도 바뀐 곳만 다시 계산한다.
      # path 목록은 test-geo job·test-geo.yml의 저장 단계와 같아야 한다(목록이 다르면 캐시 버전이 달라 복원되지 않음).
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/build-data
            .cache/geo-ops
            .cache/test-geo
            .cache/build-data-wars
          key: geo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            geo-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # 호스트 러너의 vCPU 수에 맞춤 (test-geo job과 같음)
          HISTORY_MAP_WORKERS: 4
      - if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 앞쪽 job을 건너뛴 실행(skip_test)에서도 배포되도록 상태를 직접 본다
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
