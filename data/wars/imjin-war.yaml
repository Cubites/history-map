        summary: 명과 일본이 강화 회담을 열면서 일본군이 한양에서 물러나 경상도 남해안에 왜성을 쌓고 머물렀습니다. 조선은 훈련도감을 설치해 군대를 정비했습니다. 회담은 3년 넘게 이어지다 결렬되었습니다.
        areas:
