      - date: 1593-01-08
        title: 평양성 탈환
        summary: 이여송이 이끄는 명군과 조선군이 평양성을 되찾았습니다. 일본군은 한양 쪽으로 물러났습니다.
        areas:
          - { faction: joseon, entities: [joseon, imjin-occupied] }
