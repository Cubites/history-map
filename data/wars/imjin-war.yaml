        title: 정유재란과 직산 전투
        summary: 강화 회담이 깨지자 일본군이 다시 쳐들어왔습니다(1597). 칠천량에서 조선 수군이 무너지고 남원·전주가 함락되었으나, 직산에서 조·명 연합군이 일본군의 북상을 막았습니다.
        areas:
