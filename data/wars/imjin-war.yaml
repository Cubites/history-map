# 임진왜란·정유재란 (DESIGN.md §4.5)
# 전역 하나(한반도). 스냅샷마다 조선 땅 전체(조선·일본군 점령지 영토)를 조선 진영으로 칠한 뒤,
# 일본군 점령 지역(imjin/*.geojson)을 그 위에 덮는다. 점령 지역은 교과서 전황도 수준의 대략적인 추정.
# 날짜는 우리 역사책이 흔히 쓰는 음력이다 (예: 부산 상륙 1592년 음력 4월 13일 = 양력 5월 23일).
# 운영자가 국방부 군사편찬연구소 『임진왜란사』 전황도를 기준으로 검수·보정할 것.

id: imjin-war
name: 임진왜란·정유재란 (날짜는 음력)
factions:
  - { id: joseon, name: 조선군·명군, entity: joseon }
  - { id: japan, name: 일본군, entity: japan }
participants:
  - { entity: joseon, faction: joseon }
  # 명의 첫 원군(조승훈)은 음력 7월, 이여송의 본군은 12월에 압록강을 건넜다
  - { entity: ming, faction: joseon, from: 1592-07-17 }
  - { entity: japan, faction: japan }
sources: ["국방부 군사편찬연구소 『임진왜란사』", "『선조실록』", "유성룡 『징비록』", "이순신 『난중일기』", "국사편찬위원회 『신편 한국사』 29"]

theaters:
  - id: korea
    name: 한반도
    replaces: [joseon, imjin-occupied]
    marker: [128.4, 35.6]
    bounds: [[124.0, 33.6], [131.2, 43.0]]
    routes:
      - name: 고니시 유키나가 (제1군)
        faction: japan
        points:
          - { at: [129.04, 35.1], date: 1592-04-14, label: 부산진 }
          - { at: [129.08, 35.2], date: 1592-04-15, label: 동래 }
          - { at: [128.6, 35.87], date: 1592-04-21, label: 대구 }
          - { at: [128.16, 36.41], date: 1592-04-25, label: 상주 }
