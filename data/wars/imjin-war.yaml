        title: 진주 대첩과 의병
        summary: 곽재우·고경명·조헌 등 의병과 승병이 곳곳에서 일어났고, 김시민이 진주성을 지켜 냈습니다(3대첩). 경상도 서부가 일본군의 손에서 벗어났습니다.
        areas:
