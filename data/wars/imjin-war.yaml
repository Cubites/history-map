          - { at: [126.98, 37.57], date: 1592-05-03, label: 한양 }
          - { at: [126.55, 37.97], date: 1592-05-29, label: 개성 }
          - { at: [125.75, 39.02], date: 1592-06-15, label: 평양 }
      - name: 가토 기요마사 (제2군)
        faction: japan
        points:
          - { at: [129.04, 35.1], date: 1592-04-18, label: 부산 }
          - { at: [129.22, 35.84], date: 1592-04-21, label: 경주 }
          - { at: [127.93, 36.99], date: 1592-04-28, label: 충주 }
          - { at: [126.98, 37.57], date: 1592-05-03, label: 한양 }
          - { at: [127.3, 39.0], date: 1592-06-17, label: 안변 }
          - { at: [127.53, 39.92], date: 1592-06-25, label: 함흥 }
