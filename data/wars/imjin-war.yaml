      - name: 명군 (이여송)
        faction: joseon
        points:
          - { at: [124.53, 40.2], date: 1592-12-25, label: 의주 (압록강) }
          - { at: [125.75, 39.02], date: 1593-01-08, label: 평양성 탈환 }
          - { at: [126.55, 37.97], date: 1593-01-19, label: 개성 }
          - { at: [126.87, 37.7], date: 1593-01-27, label: 벽제관 }
    battles:
      - { name: 부산진·동래성 전투, at: [129.06, 35.15], date: 1592-04-14, winner: japan, summary: 부산진 첨사 정발과 동래 부사 송상현이 끝까지 싸우다 전사했다. }
      - { name: 탄금대 전투, at: [127.9, 37.0], date: 1592-04-28, winner: japan, summary: 신립이 탄금대에 배수진을 쳤으나 일본군의 조총 부대에 크게 졌다. 사흘 뒤 선조가 한양을 떠나 피란했다. }
      - { name: 옥포 해전, at: [128.69, 34.9], date: 1592-05-07, winner: joseon, summary: 이순신의 첫 승리. 거제 옥포에서 일본 전선 26척을 격파했다. }
      - { name: 사천 해전, at: [128.06, 34.93], date: 1592-05-29, winner: joseon, summary: 거북선이 처음 출전한 해전. }
      - { name: 한산도 대첩, at: [128.45, 34.78], date: 1592-07-08, winner: joseon, summary: 이순신이 학익진으로 일본 수군을 크게 무찔렀다. 일본군의 서해 진출과 수륙 병진 작전이 막혀 전라도를 지킬 수 있었다. }
      - { name: 이치 전투, at: [127.35, 36.05], date: 1592-07-08, winner: joseon, summary: 권율이 금산에서 전주로 넘어가는 이치 고개에서 일본군을 막아 전라도를 지켰다. }
      - { name: 금산 전투, at: [127.49, 36.1], date: 1592-08-18, winner: japan, summary: 의병장 조헌과 승병장 영규가 이끈 700여 명이 일본군과 싸우다 모두 전사했다(칠백의총). }
      - { name: 진주 대첩, at: [128.08, 35.19], date: 1592-10-05, winner: joseon, summary: 진주 목사 김시민이 3,800여 명으로 2만 명의 일본군을 막아 냈다. 3대첩의 하나. }
      - { name: 평양성 전투, at: [125.75, 39.02], date: 1593-01-08, winner: joseon, summary: 조·명 연합군이 고니시의 일본군을 몰아내고 평양성을 되찾았다. }
      - { name: 벽제관 전투, at: [126.87, 37.7], date: 1593-01-27, winner: japan, summary: 한양으로 내려가던 명군이 벽제관에서 패해 평양으로 물러났다. }
      - { name: 행주 대첩, at: [126.82, 37.6], date: 1593-02-12, winner: joseon, summary: 권율이 행주산성에서 3만여 명의 일본군을 물리쳤다. 3대첩의 하나. }
      - { name: 제2차 진주성 전투, at: [128.1, 35.2], date: 1593-06-29, winner: japan, summary: 일본군이 전년의 패배를 갚으려 대군으로 진주성을 함락했다. 논개의 이야기가 전한다. }
      - { name: 칠천량 해전, at: [128.6, 34.97], date: 1597-07-16, winner: japan, summary: 이순신 대신 삼도 수군통제사가 된 원균의 조선 수군이 거의 전멸했다. }
      - { name: 남원성 전투, at: [127.39, 35.41], date: 1597-08-16, winner: japan, summary: 조·명 연합군이 지키던 남원성이 함락되었다. 일본군은 곧 전주까지 차지했다. }
      - { name: 직산 전투, at: [127.15, 36.88], date: 1597-09-07, winner: joseon, summary: 명군이 직산(천안)에서 북상하던 일본군을 막았다. 일본군은 이후 남해안으로 물러났다. }
      - { name: 명량 대첩, at: [126.3, 34.57], date: 1597-09-16, winner: joseon, summary: 다시 수군통제사가 된 이순신이 남은 배 13척으로 울돌목에서 일본 전선 133척을 물리쳤다. }
      - { name: 노량 해전, at: [127.87, 34.94], date: 1598-11-19, winner: joseon, summary: 도요토미 히데요시가 죽은 뒤 철수하던 일본군을 조·명 수군이 공격했다. 이순신이 전사했다. }
    snapshots:
      - date: 1592-04-15
        title: 부산 상륙
        summary: 음력 4월 13일 일본군이 부산에 상륙해 부산진(14일)과 동래성(15일)을 함락했습니다.
