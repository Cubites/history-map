      - date: 1592-07-08
        title: 한산도 대첩
        summary: 일본군이 함경도 끝 회령까지 올라갔지만, 이순신이 한산도에서 일본 수군을 크게 물리치고 권율이 이치에서 일본군을 막아 전라도를 지켰습니다.
        areas:
          - { faction: joseon, entities: [joseon, imjin-occupied] }
          - { faction: japan, geojson: imjin/1592-07-08.geojson }
        arrows:
