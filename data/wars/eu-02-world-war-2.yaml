      - date: 1942-11-19
        title: 스탈린그라드 반격
        summary: "1942년 여름 캅카스 유전과 스탈린그라드를 노린 독일군의 공세로 추축국의 점령지가 가장 넓어졌습니다. 11월 4일 영국군이 엘알라메인에서 이기고 8일 미국·영국군이 모로코·알제리에 상륙하자, 독일은 비시 프랑스 땅도 점령했습니다. 11월 19일 소련군은 스탈린그라드의 독일 제6군을 에워싸는 반격을 시작했습니다(천왕성 작전)."
