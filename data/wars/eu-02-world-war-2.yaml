  # ── 세계 개관 (overview) ──
  # 두 전역(유럽·북아프리카, 아시아·태평양)의 장면을 한 화면에 합친 거친 개관. 세밀한 전선은 앞의 두 전역에서 본다. 평소 지도에 전쟁 표시는 띄우지 않는다(hideMarker).
  # 장면마다 유럽 전역 장면은 이란 동쪽 국경(Natural Earth)에서 동경 61.3도 선을 따라 북극해까지 그은 이음매의 서쪽, 아시아·태평양 전역 장면은 그 동쪽만 가져와
  # 진영마다 한 덩어리(서로 겹치지 않음) geojson ww2-overview/<날짜>-<진영>.geojson 으로 만들었다(나라 영토 위에 geojson을 여러 겹 덮으면 빌드의 polyclip이 깨져서). 빌드가 해안선으로 자른다.
  # 사하라 이남 아프리카·아메리카는 칠하지 않는다(두 전역 밖). 1939-09-01 장면은 아시아·태평양 전역에 없는 영국·프랑스 식민지와 영연방 자치령(영국령 인도·버마·실론·말라야·싱가포르·북보르네오·홍콩,
  # 오스트레일리아·뉴질랜드 등, 프랑스령 인도차이나)을 연합국 색으로 더했다. 네덜란드·미국·포르투갈령은 아직 참전 전이라 칠하지 않는다.
  # 다시 만드는 법: npm run gen:wars (생성 스크립트는 저장소의 scripts/wars/world-war-2/overview/, 이 전역만 다시 만들려면 npm run gen:wars -- --only overview)
