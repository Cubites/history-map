  # ── 아시아·태평양 전역 (묶음 W3, 2026-10-12) ─────────────────────────
  # 기간: 1937년 7월 7일 루거우차오 사건(중일 전쟁)부터 1945년 9월 9일 조선 총독 항복(38도선 분할 점령 시작)까지. 날짜는 그레고리력.
  # 진영은 전쟁 머리의 allies(연합국)·soviet(소련)·japan(일본)·china(중국)를 쓴다. axis(추축국)는 이 전역에 나오지 않는다.
  # 이 전역에 필요한 참전국(전쟁 머리 participants에 W2 것과 합칠 것): japan·manchukuo(japan, 1937-07-07~1945-09-02), roc(china, 1937-07-07~1945-09-02),
  #   usa·uk(allies, 1941-12-08~), soviet-union(soviet, 대일 참전 1945-08-08~), mongolia(soviet, 1945-08-10~).
  # 칠하는 순서(뒤가 앞을 덮음): 연합국 식민지 바탕(ww2-asia/allied-colonies.geojson, 1941년 12월부터) → 미국 → 중화민국 → 소련 → 일본·조선·만주국·중국 점령지
  #   → 그날의 일본 점령 지역(ww2-asia/<날짜>-japan) → 아직 함락되지 않은 중국 땅(<날짜>-china) → 연합군이 되찾은 섬 등(<날짜>-allies) → 소련 점령지(<날짜>-soviet).
  # 동남아시아·태평양은 이 시기 나라 영토가 지도에 없어서 연합국 식민지·자치령(영국령 인도·버마·말라야, 네덜란드령 동인도, 미국령 필리핀, 오스트레일리아 등)을
  #   geojson으로 연합국 색으로 칠한다. 중립국 타이(1941.12.21 일본과 동맹 뒤로는 일본 진영)·포르투갈령 티모르·마카오·네팔·부탄은 칠하지 않는다.
  # 중국 점령지는 해마다 그해 말(1945년은 8월) 범위인 occupied-china 항목을 쓰고, 스냅샷 날짜와 다른 곳만 geojson으로 손본다.
  # 근거와 경유점은 결과 노트(W3) 참고. 운영자 검수 필요.
