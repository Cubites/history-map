      - date: 1944-06-06
        title: 노르망디 상륙 작전
        summary: "6월 6일 아이젠하워가 이끄는 미국·영국·캐나다군이 프랑스 노르망디 해안에 상륙했습니다(오버로드 작전). 이틀 전 이탈리아에서는 연합군이 로마를 해방했고, 동부 전선의 소련군은 우크라이나와 크림반도를 되찾아 루마니아 국경을 넘었습니다."
