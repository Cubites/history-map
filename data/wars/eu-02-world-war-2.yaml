      - date: 1943-09-08
        title: 이탈리아의 항복
        summary: "무솔리니가 실각한 뒤 이탈리아의 바돌리오 정부는 9월 3일 연합국과 비밀리에 휴전하고 8일 이를 발표했습니다. 독일군은 곧바로 로마와 이탈리아 중·북부를 차지했습니다. 동부 전선에서는 소련군이 하르키우를 되찾고(8월 23일) 이날 돈바스의 스탈리노를 해방하며 드네프르강으로 나아갔습니다."
