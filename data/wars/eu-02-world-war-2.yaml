        summary: "독일군은 레닌그라드를 에워싸고 우크라이나를 차지한 뒤 모스크바를 30km 앞에 두었으나, 추위와 소련군의 저항에 막혀 멈춰 섰습니다. 12월 5일 소련군이 모스크바 앞에서 반격을 시작했고, 이틀 뒤 일본의 진주만 공격으로 미국이 참전했습니다. 북아프리카에서는 영국군의 크루세이더 작전으로 토브루크 포위가 풀려 갔습니다."
