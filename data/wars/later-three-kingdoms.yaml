# 후삼국 통일 전쟁 (DESIGN.md §4.5)
# 전역 하나(한반도 남부). 고려·후백제·신라의 영토를 각 진영 색으로 칠한다.
# 날짜는 『고려사』·『삼국사기』를 따른 음력이며, 날·달이 전하지 않거나 기록마다 다르면 00으로 적는다. 위치는 교과서 수준의 대략적인 추정.

id: later-three-kingdoms
