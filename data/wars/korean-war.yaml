# 6·25 전쟁 (DESIGN.md §4.5)
# 전역 하나(한반도). 점령 지역은 선으로 가르기(split): 전역의 replaces 나라(대한민국·북한) 영토를 합친 범위를
# 선의 북·서쪽(north 진영)과 남·동쪽(south 진영)으로 나눈다. 선은 서쪽 바다에서 동쪽 바다까지 긋는다.
# 낙동강 방어선처럼 남해안에서 시작하는 선도 같은 규칙을 따른다 (선의 서쪽 = north).
# 위치는 교과서 전황도 수준의 대략적인 추정. 운영자가 『6·25 전쟁사』 전황도를 기준으로 검수·보정할 것.

id: korean-war
name: 6·25 전쟁
factions:
  - { id: north, name: 북한군·중국군, entity: dprk }
  - { id: south, name: 국군·유엔군, entity: rok }
# 참전국. 유엔군 참전국 중 지도에 있는 나라와 중국 (중국군은 1950년 10월 말 참전)
participants:
  - { entity: dprk, faction: north }
  - { entity: prc, faction: north, from: 1950-10-19 }
  - { entity: rok, faction: south }
  - { entity: usa, faction: south }
  - { entity: uk, faction: south }
  - { entity: france, faction: south }
sources: ["국방부 군사편찬연구소 『6·25 전쟁사』", "국사편찬위원회 『한국사』"]

theaters:
  - id: korea
    name: 한반도
    replaces: [rok, dprk]
    # 평소 지도의 전쟁 표시 위치 (38도선 부근)
    marker: [127.3, 38.0]
    snapshots:
      - date: 1950-06-25
        title: 북한군 남침
        summary: 북한군이 38도선 전역에서 기습 남침을 시작했습니다.
        split:
          line: [[123.6, 38.0], [124.9, 38.0], [126.2, 37.95], [127.0, 38.0], [128.0, 38.0], [128.6, 38.0], [130.5, 38.0]]
          north: north
