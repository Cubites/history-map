    snapshots:
      - date: 660-07-18
        title: 백제 멸망
        summary: 신라군이 황산벌에서 계백의 결사대를 물리치고 당군과 함께 사비성을 함락했습니다. 의자왕이 항복하고, 당은 옛 백제 땅에 웅진도독부를 두었습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [ungjin-dodokbu] }
          - { faction: goguryeo, entities: [goguryeo] }

      - date: 663-08-00
        title: 백제 부흥 운동과 백강 전투
        summary: 복신·도침은 부여풍을 왕으로 세워 주류성에서, 흑치상지는 임존성에서 백제를 되살리려 했습니다. 왜가 수군을 보냈으나 백강에서 크게 졌고, 주류성이 함락되었습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [ungjin-dodokbu] }
          - { faction: goguryeo, entities: [goguryeo] }
        holds:
