          - { name: 임존성, at: [126.8, 36.6], faction: baekje }
        arrows:
          - { faction: baekje, path: [[129.5, 34.2], [127.0, 34.4], [126.6, 35.9]], label: 왜의 수군 }

      - date: 668-09-21
        title: 고구려 멸망
        summary: 나당 연합군이 평양성을 함락해 고구려가 멸망했습니다. 당은 평양에 안동도호부를 두었고, 앞서 663년에는 신라를 계림대도독부로 삼아 한반도 전체를 지배하려 했습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [ungjin-dodokbu, andong-dohobu] }
        arrows:
          - { faction: silla, path: [[127.0, 37.6], [125.85, 38.9]], label: 신라군 }
          - { faction: tang, path: [[124.5, 40.3], [125.7, 39.1]], label: 당군 }

      - date: 670-03-00
        title: 나당 전쟁 시작
        summary: 신라의 설오유와 고구려 부흥군의 고연무가 압록강을 건너 당군을 먼저 쳤습니다. 검모잠은 안승을 왕으로 세워 고구려 부흥 운동을 일으켰고, 신라는 이들을 지원했습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [ungjin-dodokbu, andong-dohobu] }
        holds:
          - { name: 한성 (검모잠·안승), at: [125.6, 38.4], faction: goguryeo }
        arrows:
          - { faction: silla, path: [[125.5, 39.5], [124.6, 40.4]], label: 설오유·고연무 (오골성) }

      - date: 671-07-00
        title: 소부리주 설치
        summary: 신라가 웅진도독부가 있던 사비성을 차지하고 소부리주를 두어 옛 백제 땅을 되찾았습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [andong-dohobu] }
        arrows:
          - { faction: silla, path: [[127.8, 36.2], [126.95, 36.3]], label: 사비성 }

      - date: 675-09-29
        title: 매소성 전투
        summary: 신라군이 매소성에서 당의 20만 대군을 물리쳤습니다. 육지에서 당군의 남하가 막혔습니다.
        areas:
          - { faction: silla, entities: [silla] }
          - { faction: tang, entities: [andong-dohobu] }
        arrows:
          - { faction: tang, path: [[126.8, 38.6], [127.05, 38.05]], label: 이근행의 당군 }

      - date: 676-11-00
        title: 기벌포 전투와 삼국 통일
        summary: 신라 수군이 기벌포에서 당 수군을 물리쳤습니다. 당은 이에 앞서 676년 2월 안동도호부를 요동으로 옮겼고, 신라는 대동강에서 원산만에 이르는 이남 땅을 차지해 삼국 통일을 이루었습니다.
        areas:
