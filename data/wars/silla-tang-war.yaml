# 삼국 통일 전쟁: 백제·고구려 멸망과 나당 전쟁 (DESIGN.md §4.5)
# 영토가 해마다 바뀌는 전쟁이라 나라 영토를 그대로 진영 색으로 칠한다 (replaces 없음).
# 당이 차지한 옛 백제·고구려 땅은 웅진도독부·안동도호부 영토로 칠한다.
# 날짜는 『삼국사기』를 따른 음력이며, 날이 전하지 않으면 00으로 적는다. 위치는 교과서 수준의 대략적인 추정.

id: silla-tang-war
name: 삼국 통일 전쟁 (날짜는 음력)
factions:
  - { id: silla, name: 신라군, entity: silla }
  - { id: tang, name: 당군, entity: tang }
  - { id: baekje, name: 백제·부흥군·왜군, entity: baekje }
  - { id: goguryeo, name: 고구려·부흥군, entity: goguryeo }
participants:
  - { entity: silla, faction: silla }
  - { entity: tang, faction: tang }
  - { entity: baekje, faction: baekje, to: 660-07-18 }
  - { entity: wa, faction: baekje, from: 661-01-00, to: 663-09-00 }
  - { entity: goguryeo, faction: goguryeo, to: 668-09-21 }
sources: ["『삼국사기』 신라본기 태종 무열왕·문무왕", "『구당서』·『신당서』", "『일본서기』 덴지기", "국사편찬위원회 『신편 한국사』 9"]

theaters:
  - id: korea
    name: 한반도
