    battles:
      - { name: 황산벌 전투, at: [127.13, 36.2], date: 660-07-09, winner: silla, summary: "계백의 결사대 5천이 김유신의 신라군 5만을 맞아 네 번 이겼으나 관창 등 화랑의 희생으로 사기가 오른 신라군에 패했다." }
      - { name: 사비성 함락, at: [126.91, 36.28], date: 660-07-13, winner: tang, summary: 나당 연합군이 사비성을 함락했다. 웅진성으로 피했던 의자왕이 18일 항복했다. }
