# 제1차 세계 대전 (DESIGN.md §4.5). 2026-10-12 작업 W1
# 전역 하나(유럽): 서부·동부·이탈리아·발칸 전선과, 유럽 지도에 걸리는 만큼의 오스만 제국(갈리폴리·캅카스 전선).
# 스냅샷마다 진영별 본토를 나라 영토(entities)로 깔고, 남의 땅을 차지한 곳을 geojson(world-war-1/<날짜>-<진영>.geojson)으로 덮는다.
#   geojson은 전선 경유점(마을·강·고지, 위키데이터 좌표로 확인)으로 그은 선과 저장소의 그 해 나라 영토를 겹쳐 만든 것이다
#   (생성 방법·경유점·근거·어림 오차는 W1 결과 노트). 서부 전선은 2km 안, 동부·발칸 전선은 대부분 5~10km 안(1918년 우크라이나·캅카스는 대략)이다.
# 진영: 협상국(대표 프랑스)·동맹국(대표 독일 제국)·러시아 제국(협상국이지만 1917년 혁명과 1918년 강화로 전쟁에서 빠져 따로 둠).
#   1918년 강화 뒤의 소비에트 러시아와 핀란드는 칠하지 않아 평소 영토로 보인다(전쟁 밖). 1918년 캅카스는 오스만군이 차지한 것이 확실한 땅
#   (바투미·아르다한·카르스·알렉산드로폴·수르말루·나히체반)만 칠하고, 독일 보호 아래의 조지아와 아제르바이잔은 칠하지 않았다.
#   11월의 바쿠(9월 15일부터 오스만군 주둔, 11월 17일 영국군 진주)는 아제르바이잔 안의 한 도시라 이웃 칠과 이어 그릴 수 없어 칠하지 않고 거점(holds) 점 하나로 나타냈다.
# 참전 전의 중립 기간(이탈리아 1915.5, 불가리아 1915.10, 루마니아 1916.8, 그리스 1917.6 전)에는 그 나라를 칠하지 않아 평소 영토로 보인다.
#   그래서 replaces에는 1918년 판 영토가 전쟁 뒤 모습(바이마르 공화국·체코슬로바키아·유고슬라비아 등)인 나라만 넣었다.
#   1918년 3·7월 장면은 이 나라들의 이름표를 숨기고 그때 있던 독일 제국·오스트리아-헝가리 제국 이름표를 labelAs로 대신 단다
#   (11월 11일 장면은 독일 혁명과 합스부르크 제국 해체 뒤라 전쟁 뒤 나라 이름표 그대로).
# 1918년 판 영토는 전쟁 뒤 국경이다(이탈리아에 트렌티노·트리에스테, 루마니아에 트란실바니아·베사라비아). 그래서 1918년 스냅샷은
#   그 땅을 geojson으로 동맹국 색으로 덮는다(1917년 오스트리아-헝가리 영토와 겹친 곳).
# 운영자 검수 필요.

id: world-war-1
name: 제1차 세계 대전
calendar: gregorian
factions:
  - { id: entente, name: 협상국, entity: france, color: "#6d93c9" }
  - { id: central, name: 동맹국, entity: german-empire, color: "#c98b52" }
  # 러시아 진영은 색을 따로 정하지 않고 러시아 제국의 나라색을 쓴다(2026-10-28). 진영 칠은 유럽 쪽(동경 59° 무렵)까지라,
  # 따로 정한 색이면 그 동쪽의 평소 영토 색과 갈라져 보였다
  - { id: russia, name: 러시아 제국 (협상국), entity: russia }
# 참전국 (선전 포고·참전 날짜). 지도에 없는 나라(브라질·시암 등)는 뺐다
participants:
  - { entity: france, faction: entente }
  - { entity: uk, faction: entente }
  - { entity: belgium, faction: entente }
  - { entity: serbia, faction: entente }
  - { entity: montenegro, faction: entente }
  - { entity: russia, faction: russia, to: 1917-11-07 }
  # 10월 혁명 뒤 소비에트 정부가 12월 휴전, 1918년 3월 3일 강화
  - { entity: soviet-union, faction: russia, from: 1917-11-07, to: 1918-03-03 }
  - { entity: japan, faction: entente, from: 1914-08-23 }
  - { entity: italy, faction: entente, from: 1915-05-23 }
  - { entity: portugal, faction: entente, from: 1916-03-09 }
  # 루마니아는 1918년 5월 7일 부쿠레슈티 조약으로 빠졌다가 11월 10일 다시 참전
  - { entity: romania, faction: entente, from: 1916-08-27, to: 1918-05-07 }
  - { entity: romania, faction: entente, from: 1918-11-10 }
  - { entity: usa, faction: entente, from: 1917-04-06 }
  - { entity: greece, faction: entente, from: 1917-06-30 }
  - { entity: roc, faction: entente, from: 1917-08-14 }
  - { entity: german-empire, faction: central }
  - { entity: austria-hungary, faction: central }
  - { entity: ottoman, faction: central, from: 1914-10-29 }
  - { entity: bulgaria, faction: central, from: 1915-10-14 }
sources:
  - "미 육군사관학교(West Point) 전사 지도첩 1차 세계 대전 지도 (위키미디어 공용, 미국 정부 저작물)"
  - "존 키건, 『1차세계대전사』(청어람미디어, 2009)"
  - "「브레스트-리토프스크 조약」(1918)과 부속 지도"
  - "「콩피에뉴 휴전 협정」(1918)"
  - "위키백과 각 전투 문서와 위키데이터 마을 좌표"

theaters:
  - id: europe
    name: 유럽
    replaces: [weimar-republic, austria-republic, hungary, czechoslovakia, yugoslavia, poland, lithuania, latvia, estonia]
    # 평소 지도의 전쟁 표시 위치 (독일 서부, 서부 전선과 동부 전선 사이)
    marker: [8.0, 50.2]
    bounds: [[-6.0, 35.0], [46.0, 61.0]]
    battles:
      - { name: 리에주 전투, at: [5.57, 50.63], date: 1914-08-05, winner: central, summary: "독일군이 벨기에의 리에주 요새를 공격해 8월 16일 함락했습니다. 벨기에의 저항으로 독일군의 진격이 며칠 늦어졌습니다." }
      - { name: 체르 전투, at: [19.55, 44.6], date: 1914-08-16, winner: entente, summary: "세르비아군이 침공해 온 오스트리아-헝가리군을 체르산에서 물리쳤습니다. 연합국의 첫 승리로 꼽힙니다." }
      - { name: 탄넨베르크 전투, at: [20.2, 53.55], date: 1914-08-26, winner: central, summary: "힌덴부르크와 루덴도르프가 이끈 독일군이 동프로이센에 들어온 러시아 제2군을 포위해 무찔렀습니다." }
      - { name: 리비우(렘베르크) 점령, at: [24.03, 49.84], date: 1914-09-03, winner: russia, summary: "갈리치아 전투에서 러시아군이 오스트리아-헝가리군을 크게 이기고 리비우(렘베르크)를 차지했습니다." }
      - { name: 마른 전투, at: [3.38, 49.02], date: 1914-09-05, winner: entente, summary: "파리 앞까지 온 독일군을 프랑스군과 영국 원정군이 9월 12일까지 반격해 엔강까지 밀어냈습니다. 슐리펜 계획이 무너졌습니다." }
      - { name: 1차 이프르 전투, at: [2.88, 50.85], date: 1914-10-19, winner: entente, summary: "바다로 가는 경주 끝에 영국·프랑스·벨기에군이 이프르를 지켜 냈습니다. 이로써 북해에서 스위스까지 참호선이 이어졌습니다." }
      - { name: 콜루바라 전투, at: [20.05, 44.3], date: 1914-12-03, winner: entente, summary: "세르비아군이 반격해 오스트리아-헝가리군을 몰아내고 12월 15일 베오그라드를 되찾았습니다." }
      - { name: 사르카므쉬 전투, at: [42.58, 40.34], date: 1914-12-22, winner: russia, summary: "엔베르 파샤가 이끈 오스만군이 한겨울 산악에서 러시아군을 포위하려다 크게 졌습니다." }
      - { name: 2차 이프르 전투, at: [2.92, 50.88], date: 1915-04-22, winner: central, summary: "독일군이 처음으로 염소 가스를 대규모로 써 이프르 돌출부를 좁혔습니다." }
      - { name: 갈리폴리 상륙, at: [26.25, 40.1], date: 1915-04-25, winner: central, summary: "영국·프랑스·안작군이 갈리폴리반도에 상륙했으나 오스만군에 막혀 1916년 1월 물러났습니다." }
      - { name: 고를리체-타르누프 돌파, at: [21.16, 49.66], date: 1915-05-02, winner: central, summary: "마켄젠의 독일·오스트리아-헝가리군이 러시아군 전선을 뚫었습니다. 러시아군은 가을까지 폴란드·리투아니아에서 물러났습니다(대후퇴)." }
      - { name: 에르주룸 함락, at: [41.27, 39.9], date: 1916-02-16, winner: russia, summary: "러시아 캅카스군이 한겨울에 오스만 제국의 요새 에르주룸을 차지했습니다." }
      - { name: 베르됭 전투, at: [5.39, 49.2], date: 1916-02-21, winner: entente, summary: "독일군이 베르됭을 공격했으나 페탱의 프랑스군이 12월까지 버텼습니다. 양쪽 사상자가 70만 명을 넘었습니다." }
      - { name: 브루실로프 공세, at: [25.33, 50.75], date: 1916-06-04, winner: russia, summary: "브루실로프가 이끈 러시아군이 넓은 전선에서 동시에 공격해 루츠크와 부코비나를 되찾았습니다." }
      - { name: 솜 전투, at: [2.75, 50.0], date: 1916-07-01, summary: "영국·프랑스군이 솜강 일대에서 대공세를 폈습니다. 첫날 영국군 사상자만 5만 7천 명이었고, 9월에 처음으로 전차가 쓰였습니다." }
      - { name: 모나스티르 탈환, at: [21.33, 41.03], date: 1916-11-19, winner: entente, summary: "살로니카 전선의 프랑스·세르비아군이 비톨라(모나스티르)를 되찾았습니다." }
      - { name: 부쿠레슈티 함락, at: [26.1, 44.43], date: 1916-12-06, winner: central, summary: "8월에 참전한 루마니아를 독일·오스트리아-헝가리·불가리아군이 반격해 수도 부쿠레슈티를 차지했습니다." }
      - { name: 비미 능선·아라스 전투, at: [2.8, 50.37], date: 1917-04-09, winner: entente, summary: "캐나다군이 비미 능선을 차지하는 등 영국군이 아라스 일대에서 몇 km 나아갔습니다." }
      - { name: 슈맹 데 담 전투 (니벨 공세), at: [3.7, 49.44], date: 1917-04-16, winner: central, summary: "니벨의 프랑스군 대공세가 큰 희생만 내고 실패해 프랑스군 곳곳에서 항명 사태가 일어났습니다." }
      - { name: 3차 이프르 전투 (파스상달), at: [3.02, 50.9], date: 1917-07-31, summary: "영국군이 진흙탕 속에서 11월까지 공격해 파스상달 능선을 차지했으나 사상자가 수십만 명에 이르렀습니다." }
      - { name: 마러셰슈티 전투, at: [27.23, 45.88], date: 1917-08-06, winner: entente, summary: "루마니아군과 러시아군이 몰다비아로 들어오려는 독일군을 막아 냈습니다." }
      - { name: 리가 함락, at: [24.5, 56.83], date: 1917-09-01, winner: central, summary: "독일군이 다우가바강을 건너 9월 3일 리가를 차지했습니다." }
      - { name: 카포레토 전투, at: [13.58, 46.25], date: 1917-10-24, winner: central, summary: "독일·오스트리아-헝가리군이 이손초 전선을 뚫어 이탈리아군이 피아베강까지 100km 넘게 물러났습니다." }
      - { name: 캉브레 전투, at: [3.1, 50.13], date: 1917-11-20, summary: "영국군이 전차 수백 대로 힌덴부르크선을 뚫었으나 독일군의 반격으로 얻은 땅의 상당 부분을 되잃었습니다." }
      - { name: 미하엘 작전 (춘계 공세), at: [3.0, 49.85], date: 1918-03-21, winner: central, summary: "동부에서 옮겨 온 병력으로 독일군이 솜강 일대에서 대공세를 펴 60km 가까이 나아갔으나 아미앵 앞에서 멈췄습니다." }
      - { name: 2차 마른 전투, at: [3.6, 49.1], date: 1918-07-15, winner: entente, summary: "독일군의 마지막 공세가 랭스 양쪽에서 막혔고, 7월 18일 연합군이 반격에 나섰습니다." }
      - { name: 아미앵 전투, at: [2.5, 49.85], date: 1918-08-08, winner: entente, summary: "영국·오스트레일리아·캐나다·프랑스군이 전차를 앞세워 크게 이겼습니다. 루덴도르프는 이날을 독일군의 암흑의 날이라 불렀습니다(100일 공세의 시작)." }
