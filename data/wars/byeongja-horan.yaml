          - { name: 백마산성, at: [124.63, 40.13], faction: joseon }
          - { name: 안주성, at: [125.66, 39.62], faction: joseon }
        arrows:
          - { faction: qing, path: [[124.6, 40.1], [125.75, 39.1], [126.55, 38.0], [126.95, 37.62]], label: 한양 }

      - date: 1637-01-03
        title: 남한산성 포위와 근왕병
        summary: 청군이 남한산성을 에워쌌습니다. 각 도의 근왕병이 산성을 구하러 올라왔으나 쌍령 전투에서 크게 지는 등 포위를 풀지 못했습니다. 산성 안에서는 주화론(최명길)과 척화론(김상헌)이 맞섰습니다.
        areas:
