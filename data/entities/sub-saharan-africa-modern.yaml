    - 1977~1978년 오가덴 전쟁에서 소말리아군을 몰아냄
    - 1998~2000년 바드메를 둘러싸고 에리트레아와 전쟁을 벌임
    - 1995년부터 민족과 언어에 따라 나눈 주들로 된 연방 공화국
