# 연방 1910-05-31·웨스트민스터 헌장 1931-12·공화국 1961-05-31(위키백과 Union of South Africa), 홈랜드(위키백과 Bantustan). 1975~ ZAF 9(반투스탄 안 칠함 — 기본값 15)
