# 독립 1960-10-01(위키 en Nigeria). 1975~ NGA 37조각 통째. 바카시반도 665 km²는 카메룬 조각 CM-SW 안(알려진 근사)
- id: nigeria
  level: polity
  names: { ko: 나이지리아, en: Nigeria, native: Nigeria }
  from: 1960
  to: null
  color: "#b25a34"
  summary: 기니만 안쪽 니제르강 하류의 연방 공화국. 1914년 영국이 남나이지리아와 북나이지리아 보호령을 합쳐 지금 땅의 틀을 만들었고, 1960년 10월 1일 연방으로 독립했으며, 1961년 주민 투표로 영국령 카메룬 북부를 합쳤고 1963년 공화국이 됨. 1967~1970년 비아프라 전쟁을 겪었고 1999년 민정으로 돌아갈 때까지 군사 정권이 여러 차례 이어졌으며, 1991년 수도를 라고스에서 아부자로 옮김
  mapNote: 지도에는 1960년부터 지금 나이지리아 땅으로 표시함. 1960년에는 아직 영국령 카메룬이던 북카메룬 땅도 나이지리아 색으로 그렸는데, 독립 앞부터 나이지리아에 붙여 다스렸고 1961년 6월 1일 나이지리아에 합쳤기 때문임. 1967~1970년 동부의 비아프라는 승인한 나라가 다섯에 그치고 세 해 만에 무너진 분리라 나이지리아 색으로 그림. 2008년 카메룬에 넘길 때까지 나이지리아가 다스린 바카시반도(약 665 km²)는 처음부터 카메룬 색으로 그렸고, 북동부에서 보코 하람이 고을들을 장악했던 동안에도 나이지리아 색으로 칠함
  features:
    - 수도는 라고스, 1991년부터 아부자
    - 1961년 영국령 카메룬 북부가 합침(사르다우나주)
    - 1967~1970년 비아프라 전쟁
    - 1979~1983년 제2공화국, 1999년 민정 복귀
    - 2008년 바카시반도를 카메룬에 넘김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Nigeria", "나이지리아 독립법(1960)"]
    foundingNote: 영국에서 연방으로 독립한 1960년 10월 1일부터(1914년 남·북 보호령 합병은 글로)

