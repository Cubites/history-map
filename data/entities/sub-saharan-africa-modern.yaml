  from: 1270
  to: null
  color: "#3fa69c"
  summary: 아프리카의 뿔 고원에 자리한 오랜 나라로, 1270년 솔로몬 왕조가 연 에티오피아 제국을 이음. 하일레 셀라시에 황제가 1960년 12월 근위대의 쿠데타 시도를 눌렀고, 1962년 11월 15일 연방을 이루던 에리트레아를 병합하자 에리트레아 독립 전쟁이 커짐. 1974년 9월 12일 군사 정권 데르그가 하일레 셀라시에 황제를 몰아냈고, 1975년 3월 제정을 없애고 사회주의 국가를 선포함. 1977~1978년 오가덴 전쟁에서 쳐들어온 소말리아군을 쿠바·소련의 도움으로 몰아냈고, 1987년 멩기스투 하일레 마리암이 이끄는 에티오피아 인민민주공화국이 됨. 1991년 5월 에티오피아 인민혁명민주전선이 아디스아바바에 들어가 과도 정부를 세웠고, 1993년 에리트레아가 떨어져 나간 뒤 1995년 연방 민주공화국이 됨
  mapNote: 지도에는 1960년부터 표시함. 1960~1961년에는 지금 에티오피아 땅으로, 에리트레아를 병합한 1962~1992년에는 지금 에리트레아 땅까지 에티오피아 색으로 칠했고, 1993년부터 지금 에티오피아 땅으로 그림. 1960~1961년 에리트레아는 에티오피아에 딸린 에리트레아 연방으로 따로 그림. 1977~1978년 오가덴 전쟁 때 소말리아군이 차지한 땅은 이듬해 되찾아 따로 칠하지 않았고, 2020~2022년 티그라이 전쟁도 나라 땅을 바꾸지 않아 따로 그리지 않음
  features:
