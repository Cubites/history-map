# sub-saharan-africa modern 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/modern.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1975~현재: 포르투갈령 독립 뒤 나라들 (F1, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-modern' → 필터 단위 sub-saharan-africa).
# F1 뼈대(2026-11-11)가 새 항목 54개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f1/COMMON.md 4절 표, 표 원천 f1/skel/entities.tsv). 색은 뼈대가 이웃과 ΔE 48 넘게 골랐다(f1/skel/tools/df1.mjs).
#   지역 항목 셋(somaliland·rhodesia·aouzou-strip — level region)은 법적 주인 색 그대로(somalia·uk·chad — 결정 4·D1, COMMON P4).
#   이름은 위키백과 한국어판 표제로 확인했다(f1/skel/ko-titles*.txt — 표제가 없는 '아우주 띠'는 저장소 libya 글 꼴).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f1/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   이웃 권역 항목 mauritania(모리타니)는 이 파일에 없다 — 서아시아 data/entities/middle-east-modern.yaml 블록을 CE 칸이 그 자리에서 고친다(COMMON P3).

