# oceania modern 나라 (시대 파일 scripts/geo/areas/oceania/modern.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 1901~현재: 연방·자치령·위임 통치와 섬나라 독립 (M1)
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'oceania-modern' → 단위 oceania).
# 오세아니아 M1 뼈대(2026-11-17): 칸마다 머리 '# ══ M1 <칸> 항목 ══' 아래 블록 — id·level·이름(ko 확정)·from·to·색은 뼈대가 박음(칸은 id·색·ko 이름을 고치지 않음, from·to는 사료로 고칠 수 있음). 글·native·basis는 칸이 채움.
#   to는 칠한 마지막 해 + 1(저장소 꼴 — C-M1-5). 새 항목 startEvents·endEvents는 [] 그대로(사건 묶음 몫)

