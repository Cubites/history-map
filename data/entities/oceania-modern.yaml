- id: australia
  level: polity
  names: { ko: 오스트레일리아, en: Australia, native: Australia }
  from: 1901
  to: null
  color: "#65c7d2"
  summary: 오스트레일리아 대륙과 태즈메이니아를 아우르는 연방 나라. 1901년 1월 1일 영국의 여섯 식민지가 하나로 묶여 영국 제국 안의 자치령으로 출발함. 1911년 1월 1일 노던 준주와 새 수도를 둘 오스트레일리아 수도 준주가 연방 직할 땅이 되었고, 1927년 연방 의회가 멜버른에서 캔버라로 옮겨 옴. 1942년 웨스트민스터 헌장을 받아들여(1939년 9월 3일로 거슬러 적용) 입법에서 영국에서 벗어났고, 1986년 오스트레일리아 법으로 영국 의회와의 마지막 끈을 끊음
  mapNote: 지도에는 1901년부터 지금까지 오스트레일리아 본토와 태즈메이니아를 한 나라로 표시함. 1911년부터 노던 준주와 오스트레일리아 수도 준주가 연방 직할이 되었으나 같은 나라 땅이라 땅과 색을 그대로 그림
  features:
    - 수도는 캔버라(1927년까지 연방 의회는 멜버른)
    - 1901년 1월 1일 여섯 식민지가 연방을 이룸
    - 1911년 노던 준주·오스트레일리아 수도 준주를 연방 직할로
    - 1942년 웨스트민스터 헌장 채택, 1986년 오스트레일리아 법
  startEvents: []
  endEvents: []
