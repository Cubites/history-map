  summary: 영국의 식민지였던 뉴질랜드. 1840년 2월 6일 와이탕이 조약을 맺고 5월 21일 영국이 주권을 선포했으며, 1841년 5월 3일 오스트레일리아 쪽 식민지에서 떨어져 따로 식민지가 됨. 1856년 책임 정부가 섰고, 1865년 수도를 오클랜드에서 웰링턴으로 옮김. 1893년 세계에서 처음으로 여성에게 국회 선거권을 줌. 1901년 6월 11일 쿡 제도와 니우에를 넘겨받았고, 1907년 9월 26일 자치령이 되어 뉴질랜드로 이어짐
  mapNote: 지도에는 1901년부터 1906년까지 북섬·남섬과 채텀 제도 등 둘레 섬으로 표시함. 1901년 넘겨받은 쿡 제도와 니우에는 작은 섬이라 칠하지 않음. 1907년부터는 뉴질랜드로 이어짐
  endNote: 1907년 9월 26일 자치령 뉴질랜드가 되어 없어짐
  features:
    - 수도는 오클랜드였다가 1865년부터 웰링턴
    - 1840년 와이탕이 조약, 1841년 따로 식민지가 됨
    - 1856년 책임 정부
    - 1893년 여성 선거권
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Colony of New Zealand", "와이탕이 조약(1840)"]
    foundingNote: 와이탕이 조약을 맺고 영국이 주권을 선포한 1840년부터(1841년 5월 3일 따로 식민지가 됨)
