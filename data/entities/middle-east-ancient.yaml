  color: "#2f7f8a"
  summary: 지금 모로코 북부와 알제리 서부에 걸쳐 마우리인의 왕이 다스린 베르베르 왕국
  mapNote: 마우리인의 왕 바가가 사료에 나오는 기원전 225년 무렵을 시작으로 봄. 지도에는 기원전 225년부터 대서양 해안(릭수스·살라)에서 물루야강까지의 지금 모로코 북부를, 105년부터 보쿠스 1세가 유구르타 전쟁 뒤 얻은 서누미디아(물루야강~암프사가강)를 더해 표시. 보구드(서쪽)와 보쿠스 2세(동쪽)가 나눠 다스린 기원전 49~38년도 한 나라로 봄. 보쿠스 2세가 죽으며 왕국을 옥타비아누스에게 물려준 기원전 33년부터는 왕이 없어 로마 색으로 그리고, 아우구스투스가 유바 2세를 왕으로 세운 기원전 25년부터 42년까지는 같은 땅에 볼루빌리스 둘레를 더해 로마의 종속 왕국으로 그림. 볼루빌리스 둘레를 뺀 메크네스·타필랄트와 대서양 해안 남부, 남쪽 고원은 칠하지 않음
  endNote: 40년 칼리굴라가 프톨레마이오스 왕을 죽인 뒤 반란을 거쳐 42년 클라우디우스가 마우레타니아 팅기타나·카이사리엔시스 두 속주로 나눔
  features:
    - 장인 보쿠스 1세가 기원전 105년 유구르타를 술라에게 넘겨 유구르타 전쟁을 끝냄
    - 내전에서 보구드는 카이사르와 안토니우스 편, 보쿠스 2세는 옥타비아누스 편에 섬
    - 기원전 38년 보쿠스 2세가 보구드의 서쪽 땅을 차지해 왕국을 다시 하나로 묶음
    - 유바 2세는 클레오파트라 셀레네와 혼인하고 이올을 카이사레아로 고쳐 도읍으로 삼음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["살루스티우스, 『유구르타 전쟁』", "스트라본, 『지리지』 17권", "카시우스 디오, 『로마사』 48~49권"]
    foundingNote: 카르타고의 영향에서 벗어난 마우리인의 왕 바가가 사료에 나오는 기원전 225년 무렵부터

# ── 서아시아·북아프리카 A4c-⑧c (2026-11-01): 트리폴리타니아·페잔·튀니지·알제리·모로코 기원전 30년~631년 ──
- id: garamantes
  level: polity
  names: { ko: 가라만테스, en: Garamantes, native: Garamantes }
  from: 150
  to: 700
  color: "#b5893f"
  summary: 가라마(지금 리비아 젬)를 도읍으로 페잔의 오아시스를 다스린 사하라의 왕국
  mapNote: 헤로도토스가 기원전 5세기에 이름을 적었으나 큰 지역 세력으로 선 2세기 중엽(150년)을 시작으로 봄. 지도에는 150~631년 와디 알하야·세브하·샤티의 페잔 핵을 오아시스 사이 사막과 함께 표시하고, 남쪽 무르주크·가트는 칠하지 않음. 기원전 19년 발부스의 원정과 202년 세베루스의 가라마 점령은 그리지 않음
  endNote: 7세기 말 지하수가 줄어 쇠퇴한 가운데 아랍 이슬람 세력의 정복으로 끝남
  features:
    - 포가라(지하 수로)로 사막 밑 화석수를 끌어 오아시스 농업을 일으킴
    - 니제르강 굽이와 차드호 쪽으로 가는 사하라 대상로를 쥠
    - 타크파리나스의 반란을 돕고 로마의 해안 정착지를 약탈함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["헤로도토스, 『역사』 4권", "대 플리니우스, 『박물지』 5권", "타키투스, 『연대기』 4권"]
    foundingNote: 가라마를 중심으로 큰 지역 세력이 된 2세기 중엽(150년)부터

- id: mauro-roman-kingdom
  level: polity
  names: { ko: 마우로로마 왕국, en: Mauro-Roman Kingdom, native: Regnum Maurorum et Romanorum }
  from: 477
  to: 578
  color: "#3d8f6a"
  summary: 알타바를 도읍으로 옛 마우레타니아 카이사리엔시스(지금 알제리 서부·중부)를 다스린 무어인과 로마계 주민의 왕국
  mapNote: 가이세리크가 죽은 477년 무렵을 시작으로 봄(서로마의 군사 통제에서 벗어난 429년 무렵으로 보는 설도 있음). 지도에는 477~577년 틀렘센에서 티아레트·부이라까지의 지금 알제리 서부·중부 텔을 표시. 같은 시기 와르세니스·호드나 쪽 무어 왕국들과 시티피스 둘레는 그리지 않음. 578년부터는 알타바 왕국으로 이어 그림
  endNote: 577~578년 동로마 장군 겐나디우스의 원정으로 가르물 왕이 578년 죽으며 무너지고, 알타바 둘레의 작은 왕국으로 이어짐
  features:
    - 508년 알타바 비문에 마수나가 '무어인과 로마인의 왕'으로 새겨짐
    - 마수나는 반달 왕국에 맞서 동로마와 손잡음
    - 가르물이 560년대 말부터 동로마 아프리카를 여러 차례 침범함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알타바 마수나 비문(508년)", "프로코피오스, 『전쟁사』 반달 전쟁", "비클라룸의 요한네스, 『연대기』"]
    foundingNote: 가이세리크가 죽고 반달의 마우레타니아 지배가 풀린 477년 무렵부터

- id: altava-kingdom
  level: polity
  names: { ko: 알타바 왕국, en: Kingdom of Altava, native: Altava }
  from: 578
  to: 708
  color: "#3d8f6a"
  summary: 마우로로마 왕국이 무너진 뒤 알타바 둘레에 남아 지금 알제리 서부를 다스린 베르베르 왕국
  mapNote: 마우로로마 왕국의 가르물이 죽은 578년을 시작으로 봄. 지도에는 578~631년 앞 왕국과 같은 지금 알제리 서부·중부 텔을 표시(이 시기 왕 이름이 전하지 않아 땅은 앞 왕국 그대로 둔 어림)
  endNote: 690년 마지막 왕 쿠사일라가 맘마 싸움에서 우마이야군에 져 죽고, 708년 우마이야 칼리프국에 합쳐짐
  features:
    - 578년부터 670년대까지 왕 이름은 사료에 전하지 않음
    - 670년대 동로마 혈통이라는 세케르디드가 다스림
    - 쿠사일라가 아우라바 부족을 이끌고 우마이야의 마그레브 원정에 맞섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아브드 알하캄, 『이집트와 마그레브 정복기』", "이븐 할둔, 『베르베르인의 역사』"]
    foundingNote: 마우로로마 왕국의 가르물이 동로마군에 져 죽은 578년부터

- id: aures-kingdom
  level: polity
  names: { ko: 아우레스 왕국, en: Kingdom of the Aurès, native: Regnum Aurasium }
  from: 484
  to: 703
  color: "#c27a3a"
  summary: 아우레스 산지를 중심으로 지금 알제리 동부 내륙을 다스린 베르베르 왕국
  mapNote: 마스티스가 반달 왕 후네리크에 맞서 일어나 자립한 484년 무렵을 시작으로 봄. 지도에는 484~631년 아우레스 산지(바트나·켄셸라)와 남쪽 자브·호드나(비스크라·음실라)를 표시하고, 동로마가 차지한 539~543년은 동로마 땅으로 그림(544년 킬리움 싸움 뒤 다시 이 나라)
  endNote: 703년 여왕 디히야(알카히나)가 우마이야군에 져 죽으며 무너짐
  features:
    - 마스티스는 아리스 비문에서 스스로 '임페라토르'를 칭함
    - 이아브다스가 539년 동로마군에 져 마우레타니아로 달아남
    - 디히야는 35년 다스렸다고 전하며 아랍 원정군을 한때 물리침
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아리스 마스티스 비문", "프로코피오스, 『전쟁사』 반달 전쟁", "이븐 할둔, 『베르베르인의 역사』"]
    foundingNote: 마스티스가 반달에 맞서 일어나 후네리크가 죽은 484년 무렵 자립한 때부터
