    - 넥타네보 1세가 기원전 373년 페르시아군과 아테네 용병의 침공을 막아 냄
    - 넥타네보 2세는 토착 이집트인 마지막 파라오로 꼽힘
    - 제30왕조 때 필라이 섬 등 여러 곳에 신전을 지음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["디오도로스, 『역사 총서』 14~16권", "마네톤, 『이집트사』(발췌)"]
    foundingNote: 아미르타이오스가 페르시아를 몰아내고 파라오를 칭한 기원전 404년부터

- id: cyrenaica-kingdom
  level: polity
  names: { ko: 키레나이카 왕국, en: Kingdom of Cyrenaica, native: Κυρηναϊκή }
  from: -275
  to: -95
  color: "#3f8fc0"
  summary: 프톨레마이오스 왕가 사람이 이집트와 따로 왕으로 다스린 키레나이카
  mapNote: 키레네 총독 마가스가 왕을 칭한 기원전 276년 무렵을 시작으로 봄(283~274년 사이 여러 설이 있음). 같은 왕가가 세 번 따로 다스린 키레나이카를 한 항목으로 둠. 지도에는 기원전 276~247년(마가스와 그 뒤), 기원전 163~146년(프톨레마이오스 8세), 기원전 116~97년(프톨레마이오스 아피온) 키레나이카 해안을 표시하고, 기원전 246년(베레니케 2세의 혼인)·145년(8세의 이집트 즉위)부터는 다시 프톨레마이오스 왕국으로 그림. 아피온이 따로 다스린 때를 기원전 105~101년으로 보는 설도 있음
  endNote: 기원전 96년 프톨레마이오스 아피온이 죽으며 키레나이카를 로마에 물려줌
  features:
    - 마가스는 프톨레마이오스 1세의 의붓아들로 키레네 총독이었다가 왕을 칭함
    - 마가스는 셀레우코스 왕가와 손잡고 이집트를 서쪽에서 치려 했음
    - 프톨레마이오스 8세가 기원전 155년 키레나이카를 로마에 남긴다는 유언을 비문에 새김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["폴리비오스, 『역사』 31권", "프톨레마이오스 8세의 유언 비문(키레네, 기원전 155년)", "유스티누스, 『필리포스 역사 요약』 26권"]
    foundingNote: 키레네 총독 마가스가 왕을 칭한 기원전 276년 무렵부터

# ── 서아시아·북아프리카 A4c-⑧b (2026-11-01): 트리폴리타니아·튀니지·알제리·모로코 기원전 550년~31년 ──
- id: masaesyli
  level: polity
  names: { ko: 마사이실리 왕국, en: Masaesyli Kingdom, native: Masaesyli }
  from: -219
  to: -202
  color: "#5e9c48"
  summary: 시가를 도읍으로 지금 알제리 서부·중부의 텔 지대를 다스린 서누미디아 마사이실리인의 왕국
  mapNote: 시팍스가 마사이실리의 왕으로 사료에 나오는 기원전 220년 무렵을 시작으로 봄(재위 시작을 기원전 225년 무렵으로 보는 설도 있음). 지도에는 기원전 220년부터 기원전 203년까지 물루야강 동쪽(지금 모로코 동북부)부터 시티피스(세티프) 둘레까지의 텔 지대를 표시. 남쪽 고원과 사막 가장자리는 칠하지 않고, 시팍스가 동누미디아의 키르타를 차지한 기원전 206~203년의 몇 해도 칠하지 않음
  endNote: 기원전 203년 대평원 싸움에서 진 뒤 시팍스가 마시니사와 라일리우스에게 사로잡혀 로마로 끌려가고, 땅은 마시니사의 누미디아에 들어감
  features:
    - 시팍스는 기원전 213년 무렵 로마와 손잡고 카르타고에 맞섬
    - 기원전 206년 스키피오와 하스드루발 기스코를 함께 맞아 두 편 사이에서 저울질함
    - 하스드루발 기스코의 딸 소포니스바와 혼인한 뒤 카르타고 편으로 돌아섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["리비우스, 『로마 건국사』 24·28~30권", "폴리비오스, 『역사』 14권", "아피아노스, 『리비아 전쟁』"]
    foundingNote: 시팍스가 마사이실리의 왕으로 사료에 나오는 기원전 220년 무렵부터

- id: numidia
  level: polity
  names: { ko: 누미디아 왕국, en: Kingdom of Numidia, native: Numidia }
  from: -219
  to: -45
  color: "#d4a017"
  summary: 키르타를 도읍으로 지금 알제리 동부와 튀니지 서부를 다스린 누미디아인의 왕국
  mapNote: 동누미디아 마실리인의 왕 가이아가 사료에 나오는 기원전 220년 무렵을 시작으로 봄. 기원전 202년 마시니사가 서쪽 마사이실리를 합친 뒤를 같은 나라로 잇고, 유구르타와 아데르발이 나라를 나눠 다스린 때도 한 나라로 봄. 지도에는 기원전 220년부터 동누미디아(지금 알제리 동부의 텔과 아우레스 북쪽), 202년부터 서쪽 마사이실리 땅과 지금 튀니지 서부, 162년부터 카르타고에게서 빼앗은 엠포리아(지금 튀니지 남동부와 리비아 트리폴리타니아 해안)를 더해 표시하고, 105년부터는 서쪽(물루야강~암프사가강)을 마우레타니아에 넘긴 땅을 기원전 47년까지 그림. 남쪽 고원과 사하라 가장자리의 가이툴리 땅은 칠하지 않음. 마시니사는 로마의 동맹이었으나 종속국으로 그리지 않음
  endNote: 기원전 46년 탑수스 싸움에서 유바 1세가 카이사르에게 지고 스스로 목숨을 끊어, 동쪽은 아프리카 노바 속주가 되고 키르타 둘레는 시티우스에게 주어짐
  features:
    - 마시니사(기원전 202~148)가 자마 싸움에서 로마 편 기병을 이끌고 전 누미디아의 왕이 됨
    - 마시니사가 카르타고 땅을 잠식해 기원전 149년 제3차 포에니 전쟁의 빌미가 됨
    - 미킵사(기원전 148~118) 뒤 유구르타가 왕위를 다투다 기원전 112~105년 로마와 싸움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["폴리비오스, 『역사』", "살루스티우스, 『유구르타 전쟁』", "리비우스, 『로마 건국사』 29~30권", "아피아노스, 『리비아 전쟁』"]
    foundingNote: 동누미디아 마실리인의 왕 가이아가 사료에 나오는 기원전 220년 무렵부터

- id: mauretania
