  mapNote: 아미르타이오스가 파라오를 칭한 기원전 404년을 시작으로 봄. 제28왕조(사이스)·제29왕조(멘데스)·제30왕조(세벤니토스)는 같은 땅을 이은 토착 왕조라 한 나라로 봄. 지도에는 상이집트까지 페르시아의 지배가 끝난 기원전 400년부터 기원전 344년까지 지금 이집트 전체를 표시(시나이·사막과 아스완 남쪽은 지금 국경으로 그린 근사)
  endNote: 기원전 343년 아르타크세르크세스 3세가 펠루시움과 멤피스를 차지하자 넥타네보 2세가 남쪽으로 달아나 왕조가 끝남
  features:
