# middle-east ancient 나라 (시대 파일 scripts/geo/areas/middle-east/ancient.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 기원전 550~631: 아케메네스·헬레니즘 왕국·로마·파르티아·사산, 카르타고·누미디아, 이슬람 이전 아라비아
# 나라는 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-ancient').
# 기원전 550년 전에 시작한 나라는 from을 실제 해로 적고 도형은 기원전 550년(−549)부터. 기원전 31년(−30) 뒤에도 이어지는 나라는 to를 실제 끝 해로 적고 도형은 ⑦(A4b)이 이어 붙임.
# startEvents·endEvents는 사건 묶음 me-01·me-02가 채운다.
# ── 서아시아·북아프리카 A4a-⑥a (2026-10-31): 레반트·메소포타미아·이란 기원전 550~31년 ──
- id: neo-babylonian-empire
  level: polity
  names: { ko: 신바빌로니아 제국, en: Neo-Babylonian Empire, native: Bābili }
  from: -625
  to: -538
  color: "#3f6fb0"
  summary: 나보폴라사르가 아시리아에서 자립해 세운 바빌로니아의 마지막 토착 왕국
  mapNote: 지도에는 기원전 550년부터 표시. 기원전 550~540년 이라크 중부·남부와 쿠웨이트, 시리아·레바논·팔레스타인·요르단을 표시하고 539년부터 아케메네스. 하란·카르케미시 둘레(지금 튀르키예 남동)는 비어 있고, 나보니두스가 머문 아라비아의 타이마 오아시스는 칠하지 않음
  endNote: 기원전 539년 키루스 2세가 오피스에서 이기고 바빌론에 들어가 나라가 끝남
  features:
    - 기원전 612년 메디아와 함께 니네베를 무너뜨리고 아시리아 땅을 나눔
    - 네부카드네자르 2세가 기원전 587년 예루살렘을 무너뜨리고 유다 사람들을 바빌론으로 옮김
    - 나보니두스가 기원전 553~543년 무렵 아라비아의 타이마에 머물며 바빌론을 아들에게 맡김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『바빌로니아 연대기』", "헤로도토스, 『역사』 1권", "『나보니두스 연대기』"]
    foundingNote: 나보폴라사르가 바빌론에서 왕이 된 기원전 626년부터

- id: parthian-empire
  level: polity
  names: { ko: 파르티아 제국, en: Parthian Empire, native: اشکانیان }
  from: -246
  to: 224
  color: "#6b8e23"
  summary: 아르사케스 1세가 이란 북동부 파르티아에서 일으켜 이란 고원과 메소포타미아를 다스린 아르사케스 왕조의 나라
  mapNote: 아르사케스 1세의 즉위(기원전 247년, 파르티아력 원년)를 시작으로 봄. 지도에는 기원전 238년(안드라고라스를 없앤 해)부터 기원후 224년까지 표시. 기원전 238년 파르티아·히르카니아·셈난, 165년 마잔다란(마르디), 147년 메디아(엑바타나, 141년 설도 있음), 141년 바빌로니아·아시리아, 140년 엘리마이스와 이란 동부를 더함. 아트로파테네·페르시스·카라케네·아디아베네와 82년부터의 엘리마이스는 파르티아를 받든 종속 왕국으로 따로 그림. 발루치스탄과 시리아 자지라는 비움. 안티오코스 7세의 기원전 130~129년 반격과 기원전 40~39년 레반트 점령, 로마 트라야누스의 116~117년 메소포타미아 점령은 되돌려져 그리지 않음. 224년 아르타바누스 4세가 진 뒤 225년부터 이란 서·중부와 이라크는 사산 제국, 이란 동부는 239년까지 비움. 아나톨리아·캅카스와 지금 아프가니스탄·투르크메니스탄 땅은 그리지 않음
  endNote: 224년 아르다시르 1세가 아르타바누스 4세를 이겨 나라가 끝남
  features:
    - 도읍은 헤카톰필로스에서 기원전 1세기에 티그리스강 가의 크테시폰으로 옮겨 감
    - 미트리다테스 1세(기원전 171~132 무렵)가 메디아·바빌로니아를 얻어 대국이 됨
    - 기원전 96년 미트리다테스 2세의 사절이 술라와 만나 유프라테스강을 로마와의 경계로 삼음
    - 기원전 53년 크라수스가 이끈 로마군을 무찌름
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["유스티누스, 『필리포스사 요약』 41~42권", "스트라본, 『지리지』 11·16권", "플루타르코스, 『영웅전』 크라수스"]
    foundingNote: 아르사케스 1세가 파르티아에서 왕이 된 기원전 247년(파르티아력 원년)부터

- id: atropatene
  level: polity
  names: { ko: 아트로파테네 왕국, en: Atropatene, native: Ἀτροπατηνή }
  from: -322
  to: 226
  color: "#2f8f9d"
  summary: 알렉산드로스의 사트라프 아트로파테스가 메디아 북부에 세운 왕국
  mapNote: 지도에는 기원전 323년부터 기원후 225년까지 동·서아제르바이잔·아르다빌·잔잔을 표시. 셀레우코스(기원전 220년 무렵부터)와 파르티아(147년 무렵부터), 사산(224년부터)의 종속은 관계로만 적음. 캅카스 쪽(지금 아제르바이잔 공화국)은 그리지 않음
  endNote: 226년 무렵 사산의 아르다시르 1세에게 넘어감
  features:
    - 도읍은 간자크(지금 이란 서아제르바이잔주 타흐테솔레이만 가까이)
    - 기원전 36년 안토니우스의 프라아스파 포위를 버텨 냄
    - 아제르바이잔이라는 땅 이름이 이 나라 이름에서 나옴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 11.13", "폴리비오스, 『역사』 5.55", "플루타르코스, 『영웅전』 안토니우스"]
    foundingNote: 아트로파테스가 마케도니아의 지배를 받아들이지 않고 자립한 기원전 323년부터

- id: persis-kingdom
  level: polity
  names: { ko: 페르시스 왕국, en: Kingdom of Persis, native: Pārs }
  from: -199
  to: 224
  color: "#c0392b"
  summary: 페르세폴리스 둘레 파르스에서 프라타라카와 그 뒤의 왕들이 다스린 지방 왕국
  mapNote: 지도에는 기원전 200년부터 기원후 223년까지 파르스·부셰르를 표시(222~223년은 아르다시르가 차지한 카라케네 땅도). 기원전 140년까지 셀레우코스, 그 뒤 파르티아의 종속. 224년부터는 사산 제국
  endNote: 224년 이 땅의 아르다시르 1세가 파르티아를 무너뜨리고 사산 제국을 세움
  features:
    - 도읍은 페르세폴리스 가까이의 이스타크르
    - 왕들이 아람 문자 명문의 은화를 찍었음
    - 주화 뒷면에 조로아스터교의 불의 제단을 새김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 15.3", "페르시스 왕들의 주화 명문"]
    foundingNote: 프라타라카가 셀레우코스 아래 자립한 기원전 200년 무렵부터(3세기 말 설도 있음)

- id: elymais
  level: polity
  names: { ko: 엘리마이스 왕국, en: Elymais, native: Ἐλυμαΐς }
  from: -146
  to: 224
  color: "#7a5ac8"
  summary: 후제스탄과 자그로스산맥 남쪽 산지에서 캄나스키레스 왕조가 다스린 왕국
  mapNote: 지도에는 기원전 147~141년과 기원전 82년~기원후 223년 후제스탄·차하르마할바흐티아리·코길루예를 표시. 기원전 140~83년은 파르티아가 직접 다스려 파르티아. 82년부터 파르티아의 종속. 224년부터는 사산 제국
  endNote: 224년 무렵 사산의 아르다시르 1세가 정복함
  features:
    - 수사와 옛 엘람의 땅을 근거로 함
    - 기원전 187년 안티오코스 3세가 이 땅의 신전을 털다가 죽음
    - 왕들이 그리스 문자와 아람 문자 명문의 주화를 찍음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 16.1", "엘리마이스 왕들의 주화 명문"]
    foundingNote: 캄나스키레스 1세가 셀레우코스에서 자립한 기원전 147년부터

- id: characene
  level: polity
  names: { ko: 카라케네 왕국, en: Characene, native: Χαρακηνή }
  from: -126
  to: 222
  color: "#2e8b57"
  summary: 셀레우코스의 총독 히스파오시네스가 티그리스·유프라테스 하구에 세운 왕국
  mapNote: 지도에는 기원전 127년부터 기원후 221년까지 바스라·마이산·디카르와 쿠웨이트를 표시. 124년부터 파르티아의 종속. 222년부터 페르시스, 224년부터 사산 제국
  endNote: 222년 무렵 사산의 아르다시르 1세가 정복함
  features:
    - 도읍은 카락스 스파시누(지금 이라크 바스라 북쪽)
    - 페르시아만과 인도를 잇는 바다 장사로 부유했음
    - 팔미라 상인들이 이 나라 항구를 거쳐 무역함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["플리니우스, 『박물지』 6.31", "카라케네 왕들의 주화 명문"]
    foundingNote: 히스파오시네스가 셀레우코스에서 자립한 기원전 127년부터

- id: adiabene
  level: polity
  names: { ko: 아디아베네 왕국, en: Adiabene, native: Ḥdayab }
  from: -68
  to: 379
  color: "#d06090"
  summary: 대자브강과 소자브강 사이 아르벨라(지금 에르빌)를 도읍으로 한 왕국
  mapNote: 아디아베네 왕이 처음 기록된 기원전 69년을 시작으로 봄(기원전 164년 무렵 설도 있음). 지도에는 기원전 69년부터 기원후 378년까지 아르빌·술라이마니야·키르쿠크를 표시. 224년까지 파르티아, 그 뒤 사산의 종속
  endNote: 379년 무렵 사산 제국의 속주가 됨
  features:
    - 1세기 중엽 왕비 헬레나와 이자테스 2세가 유대교로 개종함
    - 2세기에 시리아 그리스도교가 일찍 퍼진 곳임
    - 대자브강·소자브강 사이의 비옥한 평야를 차지함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["요세푸스, 『유대 고대사』 20권", "플루타르코스, 『영웅전』 루쿨루스"]
    foundingNote: 아디아베네 왕이 처음 기록된 기원전 69년(티그라네스 2세와 루쿨루스의 전쟁)부터

- id: hasmonean-judea
  level: polity
  names: { ko: 하스몬 왕국, en: Hasmonean Kingdom, native: חשמונאים }
  from: -139
  to: -36
  color: "#4060c0"
  summary: 마카베오 봉기를 이끈 하스몬 가문이 유대에 세운 왕국
  mapNote: 지도에는 기원전 104년부터 유대·사마리아·갈릴래아와 해안·페레아·길르앗·골란을 표시(얀나이오스가 80년 무렵까지 얻은 땅을 한데 묶음, 근사). 기원전 140~105년의 유대는 1만 km²에 못 미쳐 셀레우코스 땅으로 둠. 기원전 63년 폼페이우스가 떼어 낸 해안·데카폴리스도 37년까지 함께 표시(근사). 63년부터 로마 공화정의 종속
  endNote: 기원전 37년 헤롯이 로마군과 함께 예루살렘을 차지하고 안티고노스 2세가 처형되어 끝남
  features:
    - 기원전 167년 마타티아스와 아들 유다 마카베오가 셀레우코스에 맞서 봉기함
    - 요한 히르카노스 1세가 이두메아를 정복하고 주민을 유대교로 개종시킴
    - 알렉산드로스 얀나이오스(기원전 103~76) 때 가장 넓어짐
    - 히르카노스 2세와 아리스토불로스 2세의 다툼에 폼페이우스가 끼어들어 예루살렘을 차지함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『마카베오기』 1·2권", "요세푸스, 『유대 고대사』 12~14권"]
    foundingNote: 시몬이 민회 결의로 대제사장·통치자가 된 기원전 140년부터(142/141년 설도 있음)

- id: herodian-judea
  level: polity
  names: { ko: 헤롯 왕국, en: Herodian Kingdom, native: Ἡρῴδης }
  from: -36
  to: 92
  color: "#2a6fa8"
  summary: 로마가 왕으로 세운 헤롯과 그 자손이 유대·갈릴래아를 다스린 종속 왕국
  mapNote: 헤롯이 예루살렘을 차지한 기원전 37년을 시작으로 봄(원로원이 왕으로 세운 40년 설도 있음). 지도에는 기원전 37년부터 유대·사마리아·갈릴래아와 해안·페레아·길르앗·골란을, 22년부터 바타나이아·트라코니티스·아우라니티스(하우란)를 더해 표시. 기원전 4년 뒤 세 아들의 나눔은 한 나라로 두고, 기원후 6년 아르켈라오스가 물러나 유대·사마리아와 해안이 로마 속주가 된 뒤로는 갈릴래아·페레아·골란·하우란을 91년까지 표시(아그리파 1세의 41~44년 재통일과 44~53년 로마 직할은 작아 그리지 않음, 근사). 로마의 종속
  endNote: 92년 무렵 아그리파 2세가 죽은 뒤 땅이 로마 시리아 속주에 합쳐짐
  features:
    - 헤롯이 예루살렘 성전을 크게 다시 지음
    - 지중해 해안에 항구 도시 카이사레아를 세움
    - 기원전 4년 헤롯이 죽은 뒤 아들 셋이 나눠 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["요세푸스, 『유대 고대사』 14~20권", "요세푸스, 『유대 전쟁사』 1~2권"]
    foundingNote: 헤롯이 로마군과 함께 예루살렘을 차지한 기원전 37년부터

- id: ituraea
  level: polity
  names: { ko: 이투라이아, en: Ituraea, native: Ἰτουραία }
  from: -84
  to: 49
  color: "#7cb342"
  summary: 이투라이아 아랍인의 왕들이 베카 골짜기와 레바논산맥을 다스린 나라
  mapNote: 프톨레마이오스 메나이오스가 처음 기록된 기원전 85년 무렵을 시작으로 봄. 지도에는 기원전 85년부터 기원후 46년까지 지금 레바논 땅을 표시(해안의 티레·시돈·베리토스 같은 자유 도시도 함께, 근사). 기원전 30~23년은 제노도로스가 빌려 다스린 바타나이아·트라코니티스·아우라니티스(하우란)도 표시. 시리아 속주에 합쳐진 49년보다 조금 앞서 끝냄(근사). 64년부터 로마의 종속
  endNote: 49년 소하이무스가 죽은 뒤 로마 시리아 속주에 합쳐짐
  features:
    - 도읍은 베카 골짜기의 칼키스(지금 안자르 둘레로 봄)
    - 헤르몬산과 안티레바논산맥의 산지 사람들을 거느림
    - 기원전 40년 리사니아스가 파르티아의 유대 침공을 도움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 16.2", "요세푸스, 『유대 고대사』 13~15권"]
    foundingNote: 프톨레마이오스 메나이오스가 처음 기록된 기원전 85년 무렵부터

- id: nabataean-kingdom
  level: polity
  names: { ko: 나바테아 왕국, en: Nabataean Kingdom, native: נבטו }
  from: -167
  to: 106
  color: "#a0522d"
  summary: 아랍계 나바테아인이 페트라를 도읍으로 향료 대상로를 쥐고 다스린 왕국
  mapNote: 아레타스 1세가 처음 기록된 기원전 168년 무렵을 시작으로 봄(나라가 기원전 3세기에 섰다는 설도 있음). 지도에는 기원전 168년부터 에돔·모압·아카바와 네게브를 표시(가자는 근사). 기원전 85~65년 다마스쿠스·하우란과 지금 요르단 북동부를 더함(72~69년 티그라네스 2세의 다마스쿠스 점령은 되돌려져 그리지 않음). 62년부터 로마의 종속. 기원전 24년 무렵부터 리히얀을 합친 히자즈 북부의 헤그라(알울라 골짜기)를 더하고, 타부크·타이마와 두마 쪽은 칠하지 않음. 레반트·요르단과 헤그라 모두 기원후 105년까지 표시(하우란 남부의 보스트라와 마프라크의 움엘지말 둘레는 작아 이웃 땅과 함께 둔 근사)
  endNote: 106년 트라야누스가 병합해 로마의 아라비아 페트라이아 속주가 됨
  features:
    - 도읍 페트라는 바위를 깎아 만든 무덤과 신전으로 이름남
    - 아라비아 남부의 유향·몰약을 지중해로 나르는 대상로를 쥠
    - 아레타스 4세(기원전 9~기원후 40) 때 가장 번성함
    - 나바테아 문자는 뒤에 아랍 문자의 바탕이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『마카베오기』 2권 5장", "스트라본, 『지리지』 16.4", "디오도로스, 『역사 총서』 19권"]
    foundingNote: 아레타스 1세가 처음 기록된 기원전 168년 무렵부터(『마카베오기』 2권)

- id: saba-kingdom
  level: polity
  names: { ko: 사바 왕국, en: Kingdom of Saba, native: 𐩪𐩨𐩱 }
  from: -799
  to: 275
  color: "#c79a2b"
  summary: 마리브를 도읍으로 남아라비아의 유향길을 처음 쥔 고대 왕국
  mapNote: 기원전 8세기 무렵(짧은 연대)을 시작으로 봄(기원전 1200년 무렵 설도 있음). 지도에는 기원전 550년부터 표시. 기원전 6세기 뒤 줄어든 마리브·시르와 둘레(지금 예멘 마리브주)를 표시하고, 와디 자우프의 마인은 칠하지 않음. 기원후 50년 무렵부터 둘째 도읍 사나 둘레 고지를 더하고(1세기 가운데 해는 흐림) 274년까지 표시
  endNote: 3세기 후반(275년 무렵) 힘야르에 합쳐짐
  features:
    - 마리브 댐이 오아시스 농사를 떠받쳤음
    - 처음 군주는 무카리브, 뒤에 왕(말리크)이라 불림
    - 기원전 7세기 카리브일 와타르가 남아라비아 대부분을 정복함
    - 남아랍 문자로 쓴 비문을 많이 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["사바 비문(카리브일 와타르의 승전비)", "스트라본, 『지리지』 16.4.2", "플리니우스, 『박물지』 6.32"]
    foundingNote: 사바의 무카리브가 비문에 나타나는 기원전 8세기 무렵부터

- id: qataban
  level: polity
  names: { ko: 카타반 왕국, en: Qataban, native: قتبان }
  from: -649
  to: 200
  color: "#7b4fa0"
  summary: 와디 바이한의 팀나를 도읍으로 몰약·유향 장사를 한 남아라비아 왕국
  mapNote: 기원전 7세기 말 무렵을 시작으로 봄. 기원전 6세기에는 사바를 받들다가 5세기에 자립(관계는 그리지 않음). 지도에는 기원전 550년부터 표시. 기원전 550년부터 와디 바이한·마르카(지금 샤브와주 서부)와 바이다, 250년 무렵부터 밥알만답까지의 남서 고지·아덴·아비얀을 표시하고 110년 힘야르가 떨어져 나간 뒤 바이한 둘레로 줄어듦. 기원후 199년까지 표시
  endNote: 2세기 말 무렵 하드라마우트와 힘야르가 땅을 나눠 가짐
  features:
    - 도읍 팀나(하자르 쿠흘란)는 유향길의 길목이었음
    - 팀나 시장의 장사 규칙을 새긴 비문이 남아 있음
    - 달신 암을 나라의 신으로 섬김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["카타반 비문(팀나)", "스트라본, 『지리지』 16.4.2", "플리니우스, 『박물지』 6.32"]
    foundingNote: 기원전 7세기 말~6세기 초 중앙집권 왕국으로 비문에 나타남

- id: hadramawt-kingdom
  level: polity
  names: { ko: 하드라마우트 왕국, en: Kingdom of Hadramawt, native: حضرموت }
  from: -999
  to: 290
  color: "#1f8f7a"
  summary: 샤브와를 도읍으로 와디 하드라마우트와 유향 산지를 다스린 남아라비아 동쪽 왕국
  mapNote: 기원전 1000년 무렵을 시작으로 봄(연대는 흐림). 기원전 6세기에는 사바를 받들다가 5세기에 자립(관계는 그리지 않음). 지도에는 기원전 550년부터 표시. 기원전 550년부터 와디 하드라마우트·마시라, 샤브와·카나(지금 샤브와주 동부)를 표시하고 250년 무렵부터 마흐라와 도파르 해안(수무람)을 더함. 기원후 200년 무렵 카타반의 바이한·바이다를 더하고 289년까지 표시
  endNote: 290년 무렵 힘야르의 샴마르 유하리시가 합침
  features:
    - 도파르에서 거둔 유향을 샤브와에 모아 북쪽으로 보냄
    - 바닷길 항구는 카나(지금 비르 알리)와 수무람(코르 로리)
    - 달신 시얀을 나라의 신으로 섬김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["하드라마우트 비문(샤브와)", "스트라본, 『지리지』 16.4.2", "플리니우스, 『박물지』 6.32"]
    foundingNote: 하드라마우트 왕이 비문에 나타나는 기원전 1천년기 초부터

- id: himyarite-kingdom
  level: polity
  names: { ko: 힘야르 왕국, en: Himyarite Kingdom, native: 𐩢𐩣𐩺𐩧 }
  from: -109
  to: 525
  color: "#b8456e"
  summary: 자파르를 도읍으로 일어나 남아라비아를 하나로 묶은 왕국
  mapNote: 카타반에서 떨어져 나온 기원전 110년 무렵을 시작으로 봄. 지도에는 기원전 110년부터 표시. 기원전 110년부터 자파르·다마르·이브·타이즈·라헤즈·아덴(지금 예멘 남서 고지와 아덴)을 표시. 기원후 275년 무렵 사바(마리브·사나), 290년 무렵 하드라마우트·카타반 땅과 북예멘 고지·티하마·자우프·아비얀·지잔을 더해 지금 예멘 전체를 524년까지 표시(사막 쪽까지 지금 주 경계로 그린 근사). 나지드·마아드 부족에 미친 힘과 나지란·아시르는 칠하지 않음
  endNote: 525년 악숨의 침공으로 두 누와스가 죽고 악숨이 예멘을 차지함
  features:
    - 도읍 자파르는 지금 야림 근처의 고원 도시
    - 홍해 입구의 항구로 인도양 장사를 이어받음
    - 힘야르 연호는 기원전 110년 무렵을 원년으로 셈
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["힘야르 비문(자파르)", "플리니우스, 『박물지』 6.32"]
    foundingNote: 기원전 110년 무렵 카타반에서 자립

- id: lihyan
  level: polity
  names: { ko: 리히얀 왕국, en: Kingdom of Lihyan, native: لحيان }
  from: -399
  to: -23
  color: "#8a6a4f"
  summary: 알울라 골짜기의 데단을 도읍으로 한 북서 아라비아의 오아시스 왕국
  mapNote: 기원전 400년 무렵(전통 연대, 6세기 중반~4세기 중반 사이에 섰다는 설들이 있음)을 시작으로 봄. 지도에는 기원전 400년부터 기원전 25년까지 알울라 골짜기(데단·헤그라 둘레)를 표시. 한때 다스린 타이마는 칠하지 않음
  endNote: 기원전 24년 무렵 나바테아에 합쳐짐(65년·9년 설도 있음)
  features:
    - 도읍 데단은 지금 알울라의 알쿠라이바 유적
    - 유향길 대상이 쉬어 가는 오아시스였음
    - 마인 상인들의 거류지가 데단에 있었음
    - 리히얀 문자로 쓴 비문과 바위 무덤을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["데단·리히얀 비문(알울라)"]
    foundingNote: 데단 왕들 뒤를 이은 리히얀 왕들이 비문에 나타나는 기원전 4세기 무렵부터

# ── 서아시아·북아프리카 A4b-⑦b (2026-10-31): 이라크·이란 기원전 30년~631년 ──
- id: lakhmid-kingdom
  level: polity
  names: { ko: 라흠 왕국, en: Lakhmids, native: اللخميون }
  from: 293
  to: 602
  color: "#5b7fc7"
  summary: 유프라테스강 서쪽 사막 가장자리의 알히라를 도읍으로 사산 제국을 받든 아랍 왕조의 나라
  mapNote: 지도에는 293년부터 601년까지 나자프·카르발라·카디시야·바빌을 표시(사막 쪽까지 지금 주 경계로 그린 근사). 531년 무렵부터 아라비아 동부 해안을 맡아 다스린 일과 아라비아 부족에 미친 힘은 그리지 않음
  endNote: 602년 사산의 호스로 2세가 누만 3세를 없애고 이 땅을 직접 다스림
  features:
    - 도읍 알히라는 지금 이라크 나자프 남동쪽, 뒷날 쿠파가 선 곳 가까이에 있었음
    - 사산 제국의 서쪽 사막 변경을 지키며 동로마 편의 가산 왕조와 맞섬
    - 알문디르 3세(505~554 무렵) 때 가장 강해 시리아까지 쳐들어감
    - 알히라는 동방 교회 그리스도교와 아랍어 시의 중심지였음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나르세의 파이쿨리 비문", "나마라 비문(328년)", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 사산의 나르세가 세운 파이쿨리 비문(293년)에 라흠 왕 아므르가 받드는 왕으로 적힌 해부터

# ── 서아시아·북아프리카 A4b-⑦c (2026-10-31): 아라비아 반도 기원전 30년~631년 ──
- id: aksumite-yemen
  level: polity
  names: { ko: 악숨령 예멘, en: Aksumite Yemen, native: اليمن الأكسومي }
  from: 525
  to: 570
  color: "#3e8a5c"
  summary: 악숨 왕국이 힘야르를 무너뜨린 뒤 총독과 아브라하가 사나를 도읍으로 다스린 예멘
  mapNote: 지도에는 525년부터 569년까지 힘야르 왕국이 마지막에 다스린 지금 예멘 전체를 표시(사막 쪽까지 지금 주 경계로 그린 근사). 악숨 왕을 명목상 받든 일은 관계로 걸지 않음. 552년 무렵 아브라하의 중부 아라비아 원정은 칠하지 않음
  endNote: 570년 사산의 와흐리즈가 사나를 차지하고 사이프 이븐 디 야잔을 세워 악숨 세력이 쫓겨남
  features:
    - 처음에는 악숨 왕이 보낸 총독 에시미파이오스가 다스림
    - 아브라하는 총독을 몰아내고 사바·두 라이단·하드라마우트의 왕을 칭함
    - 사나에 큰 교회 알칼리스를 세움
    - 548년 무렵 마리브 댐을 고친 비문을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아브라하의 마리브 댐 비문", "프로코피오스, 『전쟁사』 1.20", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 525년 악숨의 칼레브 왕이 두 누와스를 이기고 예멘을 차지한 해부터
