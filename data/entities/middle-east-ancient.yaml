  from: -663
  to: -524
  color: "#2a9d8f"
  summary: 나일 삼각주의 사이스를 도읍으로 이집트를 다시 하나로 묶은 토착 왕조
  mapNote: 프삼티크 1세가 왕이 된 기원전 664년을 시작으로 봄(상이집트를 아우른 656년을 드는 설도 있음). 지도에는 기원전 550년부터 기원전 526년까지 지금 이집트 전체를 표시(시나이·서부 사막의 오아시스·동부 사막과 아스완 남쪽은 지금 국경으로 그린 근사). 아마시스 2세의 키프로스 정복과 키레네와의 동맹은 칠하지 않음
  endNote: 기원전 525년 펠루시움 싸움에서 캄비세스 2세에게 져 프삼티크 3세가 사로잡히고, 이집트는 아케메네스 제국의 사트라페이아가 됨
  features:
    - 프삼티크 1세가 그리스·카리아 용병을 두고 아시리아의 지배에서 벗어남
    - 네코 2세가 나일강과 홍해를 잇는 운하를 파기 시작함
    - 아마시스 2세(기원전 570~526)가 삼각주의 나우크라티스를 그리스 상인 거류지로 줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["헤로도토스, 『역사』 2·3권", "디오도로스, 『역사 총서』 1권"]
    foundingNote: 프삼티크 1세가 사이스에서 왕이 된 기원전 664년부터

- id: cyrene-kingdom
  level: polity
  names: { ko: 키레네, en: Cyrene, native: Κυρήνη }
  from: -630
  to: -321
  color: "#6c8fd8"
  summary: 테라섬 사람들이 세운 그리스 도시 키레네를 중심으로 키레나이카 해안을 다스린 왕국과 공화정
  mapNote: 바토스 1세가 키레네를 세운 기원전 631년 무렵을 시작으로 봄(630년 설도 있음). 바토스 왕조가 끝난 기원전 5세기 중엽부터의 공화정도 한 나라로 봄. 지도에는 기원전 550년부터 기원전 323년까지 키레나이카 해안(키레네·바르카·아폴로니아·타우케이라·에우에스페리데스의 펜타폴리스)을 표시(남쪽 사막까지 지금 주 경계로 그린 근사). 기원전 525~401년은 아케메네스 제국을 받든 종속. 동쪽 마르마리카와 서쪽 시르테만 쪽은 칠하지 않음
  endNote: 기원전 324년 스파르타 용병대장 티브론의 침입과 내분 끝에 322년 프톨레마이오스 1세가 보낸 오펠라스가 차지함
  features:
    - 테라섬 사람들이 델포이 신탁을 받고 바다를 건너 세웠다고 전함
    - 약초 실피움을 팔아 부유했고 주화에 그 모습을 새김
    - 철학자 아리스티포스가 키레네 학파를 엶
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["헤로도토스, 『역사』 4권", "핀다로스, 『피티아 송가』 4·5", "디오도로스, 『역사 총서』 18권"]
    foundingNote: 바토스 1세가 테라섬 사람들을 이끌고 키레네를 세운 기원전 631년 무렵부터

- id: egypt-late-dynasties
  level: polity
  names: { ko: 이집트 후기 왕조 (제28~30왕조), en: Late Dynastic Egypt (28th–30th Dynasties), native: Kmt }
  from: -403
  to: -342
