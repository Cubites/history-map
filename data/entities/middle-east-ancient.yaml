    refs: ["나르세의 파이쿨리 비문", "나마라 비문(328년)", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 사산의 나르세가 세운 파이쿨리 비문(293년)에 라흠 왕 아므르가 받드는 왕으로 적힌 해부터

# ── 서아시아·북아프리카 A4b-⑦c (2026-10-31): 아라비아 반도 기원전 30년~631년 ──
- id: aksumite-yemen
  level: polity
  names: { ko: 악숨령 예멘, en: Aksumite Yemen, native: اليمن الأكسومي }
  from: 525
  to: 570
  color: "#3e8a5c"
  summary: 악숨 왕국이 힘야르를 무너뜨린 뒤 총독과 아브라하가 사나를 도읍으로 다스린 예멘
  mapNote: 지도에는 525년부터 569년까지 힘야르 왕국이 마지막에 다스린 지금 예멘 전체를 표시(사막 쪽까지 지금 주 경계로 그린 근사). 악숨 왕을 명목상 받든 일은 관계로 걸지 않음. 552년 무렵 아브라하의 중부 아라비아 원정은 칠하지 않음
  endNote: 570년 사산의 와흐리즈가 사나를 차지하고 사이프 이븐 디 야잔을 세워 악숨 세력이 쫓겨남
  features:
    - 처음에는 악숨 왕이 보낸 총독 에시미파이오스가 다스림
    - 아브라하는 총독을 몰아내고 사바·두 라이단·하드라마우트의 왕을 칭함
    - 사나에 큰 교회 알칼리스를 세움
    - 548년 무렵 마리브 댐을 고친 비문을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아브라하의 마리브 댐 비문", "프로코피오스, 『전쟁사』 1.20", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 525년 악숨의 칼레브 왕이 두 누와스를 이기고 예멘을 차지한 해부터

# ── 서아시아·북아프리카 A4c-⑧a (2026-11-01): 이집트·시나이·키레나이카 기원전 550년~631년 ──
- id: saite-egypt
  level: polity
