    - 1836~1839년 볼리비아와 페루-볼리비아 연합
    - 1879~1883년 남아메리카 태평양 전쟁에서 칠레에 져 남쪽 타라파카를 잃음
    - 1929년 리마 조약으로 타크나를 돌려받고 아리카는 칠레 땅으로 남김
    - 1942년 리우데자네이루 의정서로 에콰도르와 국경 마무리
