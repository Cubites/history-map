  summary: 남아메리카 가운데 안데스 고원과 동쪽 저지 평원에 걸친 공화국으로, 1825년 8월 6일 독립함. 1836~1839년 안드레스 데 산타크루스 대통령이 페루와 페루-볼리비아 연합을 이루었다가 칠레와의 전쟁 끝에 무너짐. 1879~1883년 남아메리카 태평양 전쟁에서 칠레에 태평양 기슭의 리토랄을 빼앗겼고, 1904년 칠레와 맺은 평화 우호 조약으로 이를 넘겨 바다 없는 나라가 됨. 1899~1903년 아크리 전쟁 끝에 1903년 11월 17일 페트로폴리스 조약으로 아크리를 브라질에 넘겼고, 1909년 페루와 국경 조약을 맺음. 1932~1935년 차코 전쟁에서 파라과이에 져 1938년 조약으로 차코 보레알 대부분을 잃음. 1952년 민족혁명운동의 혁명으로 광산 국유화와 농지 개혁을 했고, 2009년 새 헌법으로 다민족국이 됨
  mapNote: 지도에는 1825년부터 표시함. 아크리는 1825년부터 1902년까지 볼리비아 색으로 그리고, 페트로폴리스 조약을 맺은 1903년부터 브라질 색으로 그림. 1825년부터 1878년까지는 남위 24° 북쪽 태평양 해안 리토랄(안토파가스타·코비하·칼라마)과 푸나데아타카마(지금 아르헨티나 후후이·살타·카타마르카 서쪽과 칠레 쪽 고원)도 볼리비아 땅으로 그림. 1879년 남아메리카 태평양 전쟁으로 칠레가 차지한 뒤 해안은 칠레 색(1904년 조약으로 넘김)으로, 푸나데아타카마는 1899년 판정 앞까지 비움. 판도와 베니 북쪽은 1825년부터 볼리비아 색으로 그림. 차코 보레알은 1825년부터 1937년까지 파라과이와 다툰 땅이라 비우고, 1938년부터 파라과이 색으로 그림. 볼리비아 쪽 차코는 1900년부터 지금 국경대로 그림
