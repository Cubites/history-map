  summary: 남아메리카 남서쪽 태평양 기슭을 따라 길게 뻗은 공화국으로, 1818년 2월 12일 독립을 선언함. 1843년 마젤란 해협에 불네스 요새를 세웠고, 1861~1883년 비오비오강 남쪽 마푸체 땅을 점령함. 1879~1883년 남아메리카 태평양 전쟁에서 페루·볼리비아에 이겨 타라파카와 안토파가스타를 얻었고, 타크나와 아리카도 다스림. 1888년 이스터섬을 병합했고, 아르헨티나와의 남쪽 국경은 1902년 영국 왕 에드워드 7세의 판정으로 정해짐. 1929년 리마 조약으로 타크나를 페루에 돌려주고 아리카를 차지함. 1973년 9월 11일 쿠데타로 피노체트 군사 정권이 들어섰고, 1990년 민정으로 돌아감
  mapNote: 지도에는 1818년 독립 때부터 표시함. 1818년부터 비오비오강 북쪽 정착지와 발디비아·로스라고스·칠로에섬(1826년까지 스페인군이 지킴), 남위 24° 남쪽 아타카마 사막을 그리고, 1843년 마젤란 해협 둘레 마가야네스, 1870년 말레코강 북쪽까지의 마푸체 땅, 1879년 태평양 전쟁으로 차지한 남위 24° 북쪽 볼리비아 해안, 1881년 국경 조약에 따른 아이센, 1883년 말레코강 남쪽 아라우카니아와 안콘 조약으로 페루에게서 얻은 타라파카·아리카, 1899년 판정에 따른 푸나데아타카마 서쪽 몫을 차례로 더함. 1879년부터 1898년까지 세 나라가 다툰 푸나데아타카마 서쪽 몫은 비움. 1881년부터 1883년까지 칠레군이 리마를 차지한 것은 따로 칠하지 않음. 타크나는 1883년부터 1928년까지 칠레 색으로 그린 뒤 1929년부터 페루 색으로 그림. 아르헨티나와의 남쪽 국경은 1902년 판정에 따른 지금 선으로 그리고, 남부 파타고니아 빙원에서 두 나라가 아직 선을 긋지 않은 곳은 비움. 이스터섬(1888년 병합)은 발파라이소 땅과 함께 1818년부터 칠레 색으로 칠함
