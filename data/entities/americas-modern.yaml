  summary: 남아메리카 남동쪽 팜파스와 파타고니아에 걸친 연방 공화국으로, 1816년 7월 9일 투쿠만 의회가 독립을 선언함. 처음 이름은 리오데라플라타 합중국였고, 중앙 집권파와 연방파의 내전 끝에 1853년 헌법을 정함. 1852~1861년에는 부에노스아이레스국이 따로 떨어져 있다가 다시 합침. 그때까지 팜파스 남쪽과 파타고니아, 그란차코는 마푸체·테우엘체·토바 같은 원주민이 다스림. 1879년 '사막 정복'으로 리오네그로강까지 차지했고, 1881년 칠레와의 조약으로 파타고니아를, 1884년 차코 오스트랄을 얻음. 1899년 미국 공사 부캐넌의 판정으로 푸나데아타카마의 대부분을 얻었고, 칠레와의 남쪽 국경은 1902년 영국 왕의 판정으로 정해짐. 1930년 쿠데타 뒤 군사 정권과 민정이 번갈았고, 1946~1955년 페론이 대통령을 지냄. 1976~1983년 군사 정권 때인 1982년 4월 2일 포클랜드 제도를 차지했다가 6월 14일 영국군에 항복함. 1984년 칠레와 비글 해협 문제를 조약으로 매듭지음
  mapNote: 지도에는 1816년부터 표시함. 1878년까지는 알시나 참호선과 서쪽 요새선 안쪽의 정착 땅만 그리고 바깥 원주민 땅은 비움. 1879년부터 라팜파와 팜파스 남쪽, 1881년부터 파타고니아와 티에라델푸에고(처음 몇 해는 요새와 해안 정착지 몇 곳만 둔 명목 지배), 1884년부터 차코 오스트랄, 1899년부터 푸나데아타카마의 아르헨티나 몫을 더해 지금 아르헨티나 땅이 됨. 미시오네스는 1816년부터 지금 경계로 그림. 칠레와의 남쪽 국경은 1902년 판정에 따른 지금 선으로 그리고, 남부 파타고니아 빙원에서 두 나라가 아직 선을 긋지 않은 곳은 비움. 1982년 4월부터 6월까지 차지한 포클랜드 제도는 아르헨티나 색으로 칠하지 않음
  features:
    - 수도는 부에노스아이레스
