  summary: 북아메리카 북부의 연방 나라. 1867년 7월 1일 영국령 북아메리카의 식민지 셋이 합쳐 자치령으로 출발했고, 허드슨 베이 회사 땅과 브리티시컬럼비아를 더하며 서쪽으로 넓혀 1880년 영국에게서 북극 제도를 넘겨받음. 1931년 웨스트민스터 헌장으로 외교와 입법의 주권을 얻었고, 1949년 3월 31일 뉴펀들랜드가 열 번째 주로 들어옴. 1982년 헌법을 영국에게서 넘겨받았고, 1999년 동부 북극 지방에 원주민 이누이트 중심의 누나부트 준주가 생김
  mapNote: 지도에는 1867년 연방 때의 온타리오·퀘벡 남부와 노바스코샤·뉴브런즈윅부터 표시하고, 1870년 루퍼츠랜드와 북서부 영토, 1871년 브리티시컬럼비아와 프린스에드워드섬(1873년 가입), 1880년 북극 제도를 더해 지금 캐나다 땅이 됨. 1949년부터 뉴펀들랜드섬과 래브라도를 더함
