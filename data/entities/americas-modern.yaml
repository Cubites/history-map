  color: "#8cc5d4"
  summary: 북대서양과 북극해 사이에 있는 세계에서 가장 큰 섬. 1721년 노르웨이 선교사 한스 에게데가 서해안에 정착하며 덴마크-노르웨이의 식민지가 되었고, 1814년 킬 조약으로 노르웨이가 떨어져 나간 뒤에도 덴마크 땅으로 남음. 노르웨이가 1931년 7월 동해안 일부를 '에이리크 라우데의 땅'으로 차지한다고 선언했으나, 1933년 4월 5일 상설국제사법재판소가 섬 전체에 대한 덴마크의 주권을 인정함. 1953년 식민지에서 덴마크 본토와 같은 지위가 되었고, 1979년 자치권, 2009년 자치정부를 얻음
