  summary: 북아메리카 남부의 연방 공화국. 1821년 9월 스페인에서 독립해 아구스틴 데 이투르비데의 멕시코 제1제국으로 시작했고, 1823년 제국이 무너진 뒤 이듬해 연방 공화국이 됨. 1836년 텍사스가 떨어져 나갔고, 1848년 미국과의 전쟁에 져 북쪽 땅의 절반 가까이를 내주었으며 1853년 개즈던 매입으로 힐라강 남쪽 땅을 더 팖. 1864년부터 1867년까지 프랑스가 세운 막시밀리아노 1세의 멕시코 제2제국이 공화국 정부와 맞섬. 1910년에 일어난 멕시코 혁명이 1920년까지 이어지며 1917년 지금의 헌법을 만듦. 1929년부터 2000년까지 한 정당(뒤의 제도혁명당)이 내리 집권했고, 1994년 미국·캐나다와 북미 자유 무역 협정을 맺음
