# 위키 ko 표제는 '뉴펀들랜드 자치령'(1907~1949) — 식민지(1610~1906)·자치령(1907~1933)·위원회 정부(1934~1949)를 한 항목으로 묶어 가칭 '뉴펀들랜드'. from 1610(en Newfoundland Colony 정보 상자 — G5, M2·M3가 고칠 수 있음). 래브라도는 1900부터 CA-NL 통째(Q1 (B))
- id: newfoundland
  level: polity
  names: { ko: 뉴펀들랜드, en: Newfoundland, native: Newfoundland }
  from: 1610
  to: 1949
  color: "#8b9b4b"
  summary: 뉴펀들랜드섬과 래브라도 해안을 다스린 영국의 식민지이자 자치령. 1610년 잉글랜드 상인 회사의 정착 식민지로 시작했고, 1713년 위트레흐트 조약으로 프랑스가 플레장스를 내놓아 섬 전체가 영국 땅이 되었음. 1763년 국왕 선언으로 래브라도 해안 관할을 얻었다가 1774년 퀘벡 법으로 퀘벡에 넘겼고, 1809년 로어캐나다에게서 다시 넘겨받았음. 1907년 9월 26일 자치령이 되었으며 1926년 영국 본국과 대등한 자치령 지위를 얻음. 1927년 3월 1일 영국 추밀원 판결로 캐나다와 다투던 래브라도 내륙까지 경계가 정해짐. 대공황으로 재정이 무너지자 1934년 2월 16일 스스로 자치를 내려놓고 영국이 임명한 위원회 정부가 다스림. 1948년 두 차례 주민 투표 끝에 캐나다 합류를 골랐음
  mapNote: 지도에는 1610년부터 1948년까지 뉴펀들랜드섬을, 1763년부터 1773년까지와 1809년부터 1948년까지 래브라도를 표시함. 래브라도는 1774년 퀘벡 법부터 1808년까지 퀘벡 주와 로어캐나다 관할이라 그 색으로 그리고, 1809년 뉴펀들랜드 법으로 돌아온 때부터 뉴펀들랜드로 그림. 래브라도는 1927년 판결로 정해진 경계로 그림(퀘벡주는 이 경계를 인정하지 않음). 1906년까지의 식민지 때와 1934년부터의 위원회 정부 때 영국의 지배를 관계로 보임
  endNote: 1949년 3월 31일 캐나다의 열 번째 주가 되며 끝남
  features:
    - 수도는 세인트존스
    - 1907년 9월 26일 자치령, 1926년 본국과 대등한 자치령
    - 1927년 영국 추밀원 판결로 래브라도 경계 확정
    - 1934년부터 영국이 임명한 위원회 정부가 다스림
    - 1949년 3월 31일 캐나다 합류
  startEvents: [hudson-cupids-1609]
  endEvents: [newfoundland-confederation-1946]
  basis:
