# SC-M1 — 1821-07-28 독립 선언. 남쪽: 타크나 1929-06-03 리마 조약(1929-08-28 발효)·1909-09-17 볼리비아와의 폴로–산체스 부스타만테 조약(북쪽 마이나스·1942·레티시아 문장은 SA-N-M1 결과 노트 9절 → 합치기)
- id: peru
  level: polity
  names: { ko: 페루, en: Peru, native: Perú }
  from: 1821
  to: null
  color: "#3f3fa6"
  summary: 남아메리카 서쪽 안데스 산맥과 그 동쪽 열대 밀림에 걸친 공화국으로, 1821년 7월 28일 스페인에서 독립을 선언함. 1824년 12월 아야쿠초 전투로 독립을 굳혔고, 1828~1829년 마이나스와 과야킬을 두고 그란콜롬비아와 싸움. 1836~1839년에는 볼리비아와 페루-볼리비아 연합을 이루었다가 칠레와의 전쟁 끝에 다시 갈라짐. 1879~1883년 남아메리카 태평양 전쟁에서 칠레에 져 1883년 안콘 조약으로 타라파카를 넘겼고, 타크나와 아리카도 칠레가 다스리게 됨. 1909년 볼리비아와 국경 조약을 맺어 마드레데디오스·푸루스 유역을 페루 땅으로 정했고, 1929년 6월 3일 칠레와 맺은 리마 조약으로 타크나를 돌려받고 아리카는 칠레에 남김. 아마존 상류의 마이나스 땅은 1802년 7월 15일 스페인 왕의 칙령으로 누에바그라나다 부왕령에서 페루 부왕령으로 넘어왔고(칙령의 효력은 에콰도르와 오래 다툼), 1853년 로레토 정부를 둠. 1922년 살로몬–로사노 조약으로 푸투마요강 북쪽 땅과 아마존강 가의 레티시아를 콜롬비아에 넘겼고, 1932년 9월 페루 쪽 주민·군이 레티시아를 차지해 이듬해까지 콜롬비아와 싸운 뒤 1934년 리우 의정서로 조약을 다시 확인함. 1936년 7월 에콰도르와 리마에서 현상 유지선을 정했고, 1941년 7월 에콰도르와 싸워 이긴 뒤 1942년 1월 리우데자네이루 의정서로 아마존 쪽 국경을 마무리함. 1968년 군사 정부가 들어섰다가 1980년 민정으로 돌아갔고, 1980~1990년대에는 '빛나는 길'의 무장 투쟁이 이어짐
  mapNote: 지도에는 1821년 독립 선언 때부터 표시함. 1821년부터 1882년까지는 남쪽 타라파카·아리카·타크나도 그리고, 1883년 안콘 조약부터 칠레 색으로 그림. 타크나는 1928년까지 칠레 색이고, 리마 조약으로 돌려받은 1929년부터 페루 색으로 그림. 1908년까지는 볼리비아가 요구하던 마드레데디오스·푸루스 땅을 비우고, 1909년 볼리비아와의 국경 조약부터 페루 색으로 그림. 1922년 콜롬비아와의 조약 앞에 다투던 푸투마요강–카케타강 사이 땅은 1929년까지 페루 색으로 칠하지 않음. 마라뇬강 북쪽 마이나스 땅은 1821년부터 페루 색으로 그림. 1830년부터 1941년까지는 1936년 현상 유지선에 따라 파스타사강·티그레강·쿠라라이강 위쪽 띠를 에콰도르 땅으로 빼고 아과리코강 아래쪽 북동 띠를 페루 땅에 넣었으며, 1942년 리우데자네이루 의정서 뒤로는 지금 국경대로 그림. 1932년부터 1933년까지의 레티시아 점령은 땅을 바꾸지 않고 글로만 적음
  features:
