# americas modern 나라 (시대 파일 scripts/geo/areas/americas/modern.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1900~현재: 지금 나라와 20세기 국경 마무리 (M1 — docs/americas/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'americas-modern' → 필터 단위 americas).
# M1 뼈대(2026-11-15)가 1900~에 칠하는 새 항목 40개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 m1/COMMON.md 4절 표, 표 원천 m1/skel/entities.tsv).
#   색은 자기 색 — 뼈대가 같은 해 맞닿는 이웃·좁은 바다 건너·식민 단위의 본국(uk·france·netherlands·denmark)·usa·유럽 러시아 계열과 ΔE 26 넘게 골랐다(m1/skel/tools/dm1.mjs — 최소 51.1).
#   모두 level: polity. to는 끝난 해 = 칠한 마지막 해 + 1(미포함), 끝까지 이어지면 null. from은 성립 해(1900 앞이면 그 해 그대로 — 지도는 1900부터, M2가 같은 id로 앞을 이음).
#   이름은 위키백과 한국어판 표제로 확인했다(m1/skel/ko-titles.txt — 표제와 다른 가칭: 뉴펀들랜드(표제 '뉴펀들랜드 자치령')·네덜란드령 수리남(표제 '수리남 (네덜란드 식민지)')).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — m1/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 칸이 사료로 고칠 수 있다(P7 — 고치면 결과 노트 2절에 한 줄). id·색·이름·level은 고치지 않는다. usa 블록은 data/entities/west.yaml에서 글자 그대로 옮겼다(US-M1 머리 — 0단계 기본값 4).
#   유럽 항목 russia·soviet-union·russia-fed(늘림)는 data/entities/europe.yaml 그 자리 블록(파일 소유표 — US-M1, 땅 범위 구절이 어긋날 때만).

