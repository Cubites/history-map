  from: 1667
  to: 1975
  color: "#73b234"
  summary: 남아메리카 북동쪽 기슭에 있던 네덜란드 식민지. 1650년 무렵 잉글랜드 사람들이 세운 정착지를 1667년 2월 네덜란드 함대가 차지했고, 그해 브레다 조약으로 네덜란드가 뉴암스테르담을 잉글랜드에 넘기는 대신 수리남을 가졌음. 식민지는 해안과 강가의 사탕수수 농장만 다스렸고, 안쪽 숲에는 원주민과 농장에서 달아난 노예들의 마룬 공동체가 살았으며 18세기 중반 네덜란드가 마룬과 평화 조약을 맺음. 나폴레옹 전쟁 때 영국이 두 번 차지했다가 1816년 돌려주었고, 1863년 노예제를 없앤 뒤 인도와 자와섬에서 계약 노동자를 데려와 여러 겨레가 섞여 사는 땅이 됨. 1954년 네덜란드 왕국 헌장으로 본국·네덜란드령 안틸레스와 대등한 왕국의 구성국이 되어 안의 일을 스스로 다스렸고, 1975년 수리남으로 독립함
  mapNote: 지도에는 1667년부터 1974년까지 지금 수리남 땅으로 표시함. 안쪽 숲은 원주민과 마룬이 살아 식민지는 해안 농장만 다스린 명목 지배 땅이지만, 브레다 조약으로 넘겨받은 땅이라 함께 그림. 1667년 앞 잉글랜드 정착지는 작아 따로 칠하지 않음. 1799년부터 1802년까지, 1804년부터 1815년까지 영국군이 차지한 때도 네덜란드 주권이 남아 같은 색으로 그림. 1954년 네덜란드 왕국의 구성국이 된 것은 지위만 바뀐 것이라 땅은 그대로 그림. 1975년부터는 수리남으로 이어짐
  endNote: 1975년 11월 25일 수리남으로 독립해 없어짐
  features:
