  summary: 이스파니올라섬 서쪽의 공화국. 프랑스 식민지 생도맹그의 노예 반란 끝에 1804년 1월 1일 독립을 선언한, 라틴아메리카 첫 독립국이자 첫 흑인 공화국임. 1806년 황제 장자크 데살린이 죽임을 당한 뒤 1807년부터 1820년까지 북쪽 앙리 크리스토프의 나라와 남쪽 알렉상드르 페티옹의 공화국으로 갈라졌다가 장피에르 부아예가 다시 합침. 부아예는 1822년 2월 섬 동쪽까지 차지해 1844년까지 섬 전체를 다스렸고, 1825년 프랑스에 큰 배상금을 물기로 하고 독립을 인정받음. 정변과 외채가 거듭되자 1915년 7월 미국 해병대가 상륙해 1934년 8월까지 점령함. 1957년부터 1986년까지 뒤발리에 부자가 독재함
