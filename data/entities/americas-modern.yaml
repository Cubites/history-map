# SC-M1 — 1825-08-06 독립. 아크리 1903-11-17 페트로폴리스 조약·판도 1890 국가 대표부·1893 북서 대표부·1900-03-08 북서 식민 국가 준주(M-M1-6)·차코 1938-07-21 조약
