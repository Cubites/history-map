  color: "#c8936f"
  summary: 카코바우를 왕으로 세운 피지 제도의 통일 왕국. 1871년 6월 5일 바우의 큰 추장 카코바우를 왕으로 하는 입헌 정부가 서서 로투마섬을 뺀 피지 제도 전체를 다스린다고 내세웠으나, 비치레부섬 서쪽 산지 부족들은 끝내 따르게 하지 못했음. 빚과 안팎의 다툼으로 나라를 꾸리기 어려워지자 1874년 10월 10일 추장들이 영국에 땅을 넘겨 피지 식민지가 되었음
  mapNote: 지도에는 1871년부터 1873년까지 로투마섬을 뺀 피지 제도로 표시함. 비치레부섬 서쪽 산지까지 실제로 다스리지는 못했으나 왕국이 다스린다고 내세운 땅을 함께 그림. 1871년 앞은 여러 추장 세력이 갈려 있어 칠하지 않음
  endNote: 1874년 10월 10일 추장들이 영국에 땅을 넘겨 피지 식민지가 되며 없어짐
  features:
