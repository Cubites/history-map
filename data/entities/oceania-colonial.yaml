- id: maori
  level: region
  names: { ko: 마오리족, en: "Māori", native: "Māori" }
  from: 1250
  to: null
  color: "#51bda8"
  summary: 뉴질랜드에 사는 폴리네시아 사람들. 1250년 무렵부터 동폴리네시아에서 카누를 타고 와 자리 잡았고, 부족마다 땅과 우두머리를 따로 두고 살았음. 1840년 영국과 와이탕이 조약을 맺었으나, 그 뒤 땅을 둘러싸고 1845년부터 1872년까지 뉴질랜드 전쟁이 벌어져 많은 땅을 잃었음
  mapNote: 지도에는 땅을 그리지 않음. 여러 부족이 따로 다스려 하나의 경계로 묶을 수 없어 사건의 주체로만 둠. 뉴질랜드는 1840년부터 영국의 식민지로 그림
  features:
    - 1250년 무렵 카누를 타고 들어옴
    - 부족마다 우두머리가 다스림
    - 1840년 와이탕이 조약
    - 1845년부터 1872년까지 뉴질랜드 전쟁
  startEvents: [maori-1250]
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Māori people", "위키백과 마오리족"]
    foundingNote: 뉴질랜드에 사람이 처음 자리 잡은 1250년 무렵부터
# 글은 HPO-M2 칸이 채움 — 위키 ko 표제 '통가 제국'(가칭 '투이 통가'·'투이 통가 제국'은 표제·넘겨주기 없음 — 투이 통가는 왕 칭호라 글에 그대로 씀). 950~1865(G2-6 — 위키 en Tuʻi Tonga Empire)
- id: tui-tonga
  level: region
  names: { ko: 통가 제국, en: "Tuʻi Tonga Empire" }
  from: 950
  to: 1866
  color: "#816fc8"
  summary: 투이 통가 왕계가 통가타푸섬을 중심으로 다스린 해양 세력. 950년 무렵 첫 투이 통가가 나왔고, 1200년부터 1500년 무렵까지 가장 힘이 셌을 때는 둘레 섬들에 공물을 받으며 사모아와 피지 일부까지 영향을 미쳤다고 봄. 뒤에 실제 정치는 다른 칭호의 우두머리들이 맡고 투이 통가는 신성한 제사를 맡는 자리가 되었음. 1865년 마지막 투이 통가가 죽고 칭호가 없어지며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 섬들에 미친 힘이 바다를 건넌 영향과 공물로 이루어져 경계를 그을 수 없어 사건의 주체로만 둠
  endNote: 1865년 마지막 투이 통가가 죽고 칭호가 없어지며 끝남
  features:
    - 중심은 통가타푸섬
    - 큰 쌍동선으로 섬들을 오감
    - 1200년부터 1500년 무렵까지 가장 힘이 셈
    - 투이 통가는 신성한 왕으로 받들어짐
  startEvents: [tui-tonga-950]
  endEvents: [tupou-tonga-1845]
  basis:
    type: primary_source
    refs: ["위키백과 Tuʻi Tonga Empire", "위키백과 통가 제국"]
    foundingNote: 첫 투이 통가가 나온 950년 무렵부터
# 글은 HPO-M2 칸이 채움 — 위키 ko 표제 '고대 하와이'(가칭 '하와이 족장 사회'는 표제 없음 — 그 문서가 1795 왕국 앞 시대). from 1000(결정 값 — 위키 en Ancient Hawaii 옛 추정 400~1100 안, 2010 연구 1219~1266은 글), to 1795(왕국 성립)
- id: hawaiian-chiefdoms
  level: region
  names: { ko: 고대 하와이, en: "Ancient Hawaii" }
  from: 1000
  to: 1795
  color: "#dbc184"
  summary: 하와이 왕국이 세워지기 전 하와이 제도의 섬마다 족장이 다스리던 시대. 폴리네시아 항해자들이 마르키즈 제도나 소시에테 제도 쪽에서 와 자리 잡았는데, 그때를 400년부터 1100년 무렵 사이로 보는 옛 추정과 1219년부터 1266년 무렵으로 보는 2010년 연구가 갈림. 알리이라 부르는 족장 계층이 섬이나 섬의 일부를 다스렸고 카푸라는 금기로 질서를 지켰음. 1795년 카메하메하 1세가 섬들을 하나로 묶으며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 섬마다, 때로는 한 섬 안에서도 족장들이 나누어 다스려 경계를 알려 주는 자료가 적으므로 사건의 주체로만 둠
  endNote: 1795년 카메하메하 1세가 오아후섬을 손에 넣어 하와이 왕국을 세우며 끝남
  features:
    - 알리이라 부르는 족장 계층이 다스림
    - 카푸라는 금기로 질서를 지킴
    - 산에서 바다까지 땅을 길게 나누어 물과 농사를 다스림
    - 타로를 기르고 바닷가에 물고기 못을 만듦
  startEvents: [hawaii-settlement-1000]
  endEvents: [kamehameha-1782]
  basis:
    type: primary_source
    refs: ["위키백과 Ancient Hawaii", "위키백과 고대 하와이"]
    foundingNote: 옛 추정 정착 시기(400~1100년 무렵) 안의 1000년 무렵부터
# 글은 HPO-M2 칸이 채움 — 위키 ko 표제 없음(가칭 — '타히티인'도 없음). 300~1790(to 1791 — 타히티 왕국 성립, 2010 연구 소시에테 정착 1025~1120은 글)
- id: tahitian-chiefdoms
  level: region
  names: { ko: 타히티 족장 사회, en: "Tahitian chiefdoms" }
  from: 300
  to: 1791
  color: "#a7db84"
  summary: 타히티 왕국이 세워지기 전 타히티섬과 둘레 섬에서 족장들이 나누어 다스리던 사회. 소시에테 제도에 사람이 처음 자리 잡은 때를 300년 무렵으로 보는 옛 추정과 1025년부터 1120년 무렵으로 보는 2010년 연구가 갈림. 아리이라 부르는 족장들이 섬의 고장마다 따로 다스렸고, 마라에라는 돌 제단에서 제사를 지냈음. 1767년 영국 배가 처음 닿은 뒤 유럽의 총을 손에 넣은 포마레 1세가 1791년 무렵 섬들을 하나로 묶으며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 타히티섬은 넓이가 작고 족장들이 고장마다 나누어 다스려 경계를 그을 수 없으므로 사건의 주체로만 둠
  endNote: 포마레 1세가 1791년 무렵 타히티섬과 둘레 섬을 하나로 묶어 타히티 왕국을 세우며 끝남
  features:
    - 아리이라 부르는 족장들이 고장마다 다스림
    - 마라에라는 돌 제단에서 제사를 지냄
    - 1767년 영국 배가 처음 닿음
    - 1791년 무렵 포마레 1세가 섬들을 하나로 묶음
  startEvents: [east-polynesia-300]
  endEvents: [pomare-tahiti-1791]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Tahiti", "위키백과 Ancient Hawaii"]
    foundingNote: 소시에테 제도 정착 옛 추정인 300년 무렵부터
