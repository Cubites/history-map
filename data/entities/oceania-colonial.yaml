  from: 1825
  to: 1901
  color: "#c8816f"
  summary: 영국이 태즈메이니아섬에 둔 식민지. 1803년 뉴사우스웨일스가 이 섬에 정착지를 세웠고(이듬해 호바트로 옮김), 1825년 12월 3일 뉴사우스웨일스에서 떨어져 따로 식민지가 됨. 오랫동안 죄수 유형지로 쓰였고, 1820년대 끝 무렵부터 이어진 '검은 전쟁'으로 섬의 원주민이 크게 줄어듦. 1853년 죄수 이송을 멈추었고, 1856년 1월 1일 이름을 태즈메이니아로 바꿈. 1901년 1월 1일 오스트레일리아 연방에 들어감
  mapNote: 지도에는 1825년부터 1900년까지 태즈메이니아섬과 둘레 섬으로 그림. 1825년 앞에는 뉴사우스웨일스 식민지 땅으로 그림. 1856년 태즈메이니아로 이름을 바꾸었으나 같은 식민지라 땅과 색을 그대로 둠
  endNote: 1901년 1월 1일 오스트레일리아 연방의 태즈메이니아주가 되어 없어짐
  features:
    - 중심지는 호바트
