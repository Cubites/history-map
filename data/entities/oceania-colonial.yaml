# 글은 AUS-M2 칸이 채움 — 위키 ko 표제. 1788-01-26 시드니만 정착(1786-12 위임장 — 동경 135° 동쪽, K1). vassal_of uk 1788~1900(P2)
- id: new-south-wales
  level: polity
  names: { ko: 뉴사우스웨일스 식민지, en: "Colony of New South Wales", native: "Colony of New South Wales" }
  from: 1788
  to: 1901
  color: "#c7d265"
  summary: 영국이 오스트레일리아 동부에 세운 첫 식민지. 1787년 4월 25일 아서 필립 총독 위임장이 동경 135° 동쪽 대륙과 앞바다 섬들을 그 땅으로 정했고, 1788년 1월 26일 죄수를 실은 첫 선단이 시드니만에 닻을 내린 뒤 2월 7일 식민지를 선포함. 그 땅에는 이미 오스트레일리아 원주민이 살고 있었으나 영국은 주인 없는 땅으로 여김. 1825년 서쪽 경계를 동경 129°까지 넓혔고, 같은 해 반디먼즈랜드, 1836년 사우스오스트레일리아, 1851년 빅토리아, 1859년 퀸즐랜드가 차례로 갈라져 나감. 1846년 북쪽에 노스오스트레일리아를 세우려 했으나 이듬해 거두어들임. 1901년 1월 1일 오스트레일리아 연방에 들어감
  mapNote: 지도에는 1788년부터 1900년까지 그림. 1788년 동경 135° 동쪽 대륙과 태즈메이니아섬에서 시작해 1825년 동경 129°까지 넓어졌고, 그 뒤 여러 식민지가 갈라져 나가 1863년부터는 지금의 뉴사우스웨일스주와 오스트레일리아 수도 준주 땅만 남음. 1846~1847년의 노스오스트레일리아는 자리 잡지 못해 따로 칠하지 않음
  endNote: 1901년 1월 1일 오스트레일리아 연방의 한 주가 되어 없어짐
  features:
    - 중심지는 시드니
    - 1788년 1월 26일 첫 선단이 시드니만에 닿아 죄수 유형 식민지로 출발
    - 1825년 서쪽 경계를 동경 135°에서 129°로 옮김
    - 1851년 금이 발견되어 골드러시가 시작됨
  startEvents: [first-fleet-1788]
  endEvents: [federation-1901]
  basis:
    type: primary_source
    refs: ["위키백과 Territorial evolution of Australia", "위키백과 Colony of New South Wales", "위키백과 North Australia"]
