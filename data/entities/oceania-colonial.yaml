# oceania colonial 나라 (시대 파일 scripts/geo/areas/oceania/colonial.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 오세아니아 식민 시대(하한~1900, 도형 1788~)
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'oceania-colonial' → 단위 oceania).
# 오세아니아 M2 뼈대(2026-11-18): 칸마다 머리 '# ══ M2 <칸> 항목 ══' 아래 블록 — id·level·이름(ko 확정)·from·to·색은 뼈대가 박음(칸은 id·색·ko 이름을 고치지 않음, from·to는 사료로 고칠 수 있음). 글·native·basis는 칸이 채움.
#   to는 칠한 마지막 해 + 1(저장소 꼴 — M1 E1). 새 항목 startEvents·endEvents는 [] 그대로(사건 묶음 몫). 땅 없는 항목 17은 level: region·도형 0(versions 없음 — 아메리카 M3 muisca 꼴)
#   앞 잇는 M1 아홉(colony-of-new-zealand 등)의 블록은 oceania-modern.yaml에 그대로 있다(파일 소유표의 칸이 글만 고침)

