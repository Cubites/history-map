# 글은 SPC-M2 칸이 씀 — 위키 ko 표제 없음(칭호 규칙). 1791 포마레 1세 통일(G2-15 — PYF-4963 한 조각), 1842 프랑스 보호령(vassal_of france 1842~1879), 1880 병합 → french-polynesia. native는 비움(위키 en 정보 상자는 프랑스어 'Royaume de Tahiti'뿐 — 타히티어 이름 확인 못 함)
- id: kingdom-of-tahiti
  level: polity
  names: { ko: 타히티 왕국, en: "Kingdom of Tahiti" }
  from: 1791
  to: 1880
  color: "#b1665d"
  summary: 포마레 왕조가 타히티섬과 둘레 섬을 다스린 왕국. 1788년부터 1791년 무렵 포마레 1세가 타히티섬과 둘레 섬들을 하나로 묶었고, 포마레 2세 때 개신교를 받아들임. 1842년 9월 9일 프랑스가 포마레 4세 여왕의 나라를 보호령으로 삼았고, 1844년부터 1847년까지 타히티 사람들이 프랑스에 맞서 싸웠으나 보호령은 이어졌음. 1880년 6월 29일 포마레 5세가 나라를 프랑스에 넘겨 프랑스의 식민지가 되었음
  mapNote: 지도에는 1791년부터 1879년까지 타히티섬과 둘레 섬(윈드워드 제도)으로 표시함. 1842년부터는 프랑스의 보호령이었으나 왕국이 이어졌으므로 왕국 색으로 그림. 따로 왕국을 이룬 리워드 제도와 1842년부터 프랑스가 가진 마르키즈 제도는 작은 섬이라 칠하지 않음
  endNote: 1880년 6월 29일 포마레 5세가 나라를 프랑스에 넘겨 없어짐
  features:
    - 왕실은 포마레 왕조
    - 1791년 무렵 포마레 1세가 섬들을 하나로 묶음
    - 1842년 프랑스 보호령
    - 1844년부터 1847년까지 프랑스에 맞서 싸움
    - 1880년 포마레 5세가 나라를 프랑스에 넘김
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Tahiti"]
    foundingNote: 포마레 1세가 섬들을 하나로 묶은 1791년 무렵부터(위키백과 정보 상자는 1788년 또는 1791년)
  startEvents: [pomare-tahiti-1791]
  endEvents: [tahiti-annexation-1880]

