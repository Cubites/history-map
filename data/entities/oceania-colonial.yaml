# 글은 HPO-M2 칸이 채움 — 위키 ko 표제. 1795 오아후 정복(카우아이·니하우 1810 귀속은 1만 km² 미만 — G2-3), 1893-01-17 전복(G2-16), 관계 줄 없음(republic-of-hawaii successor_of만 — K7)
- id: hawaiian-kingdom
  level: polity
  names: { ko: 하와이 왕국, en: "Kingdom of Hawaii", native: "Ke Aupuni Hawaiʻi" }
  from: 1795
  to: 1893
  color: "#5d6eb1"
  summary: 하와이 제도를 하나로 묶은 폴리네시아 사람들의 왕국. 하와이섬의 족장 카메하메하 1세가 1795년 5월 오아후섬을 손에 넣으며 마우이섬·몰로카이섬·라나이섬까지 다스리게 되어 세웠고, 1810년 카우아이섬과 니하우섬의 왕이 그를 따르면서 제도 전체가 한 나라가 됨. 1840년 첫 헌법을 두었고 유럽 나라들과 미국에게 독립국으로 인정받았음. 19세기 중엽부터 미국 사람들이 사탕수수 농장을 크게 늘리며 힘을 키웠고, 1893년 1월 17일 이들이 릴리우오칼라니 여왕을 몰아내면서 끝남
  mapNote: 지도에는 1795년부터 1892년까지 하와이 제도로 표시함. 카우아이섬과 니하우섬은 1810년에야 왕국을 따랐으나 제도를 한 땅으로 그리므로 1795년부터 함께 칠함
  endNote: 1893년 1월 17일 미국계 주민과 사업가들이 릴리우오칼라니 여왕을 몰아내고 임시 정부를 세우며 끝남
  features:
    - 1795년 카메하메하 1세가 세움
    - 1810년 카우아이섬·니하우섬이 따르며 제도 전체를 다스림
    - 1840년 첫 헌법
    - 1845년부터 수도는 호놀룰루
    - 1893년 릴리우오칼라니 여왕이 쫓겨나며 끝남
  startEvents: [kamehameha-1782]
  endEvents: [hawaii-overthrow-1893]
  basis:
    type: primary_source
    refs: ["위키백과 Hawaiian Kingdom", "위키백과 하와이 왕국"]
    foundingNote: 카메하메하 1세가 오아후섬을 손에 넣은 1795년 5월부터
# 글은 HPO-M2 칸이 채움 — 위키 ko 표제. 1893 임시 정부·1894-07-04 공화국 선포는 글만(P7·H4), 1898-08-12 미국 이양 — 1898부터 usa(M1 extra, P3), successor_of hawaiian-kingdom 1893(K7)
- id: republic-of-hawaii
  level: polity
  names: { ko: 하와이 공화국, en: "Republic of Hawaii", native: "Lepupalika o Hawaiʻi" }
  from: 1893
  to: 1898
  color: "#db848d"
  summary: 하와이 왕국을 무너뜨린 미국계 주민들이 세운 공화국. 1893년 1월 17일 릴리우오칼라니 여왕을 몰아낸 이들이 임시 정부를 세우고 미국에 병합을 청했으나 곧바로 이루어지지 않자, 1894년 7월 4일 공화국을 선포함. 1895년 1월 왕정을 되살리려는 봉기를 누르고 여왕을 물러나게 했음. 1898년 7월 미국 의회의 병합 결의가 서명되고 8월 12일 미국에 주권을 넘기며 끝남
  mapNote: 지도에는 1893년부터 1897년까지 하와이 제도로 표시함. 1893년의 임시 정부와 1894년부터의 공화국은 같은 사람들이 이끈 한 정부로 보아 같은 색으로 그림. 1898년부터는 미국 땅으로 이어짐
  endNote: 1898년 미국 의회의 병합 결의에 따라 8월 12일 미국에 주권을 넘기며 끝남
  features:
    - 1893년 임시 정부, 1894년 7월 4일 공화국 선포
    - 정부는 호놀룰루에 둠
    - 1895년 왕정을 되살리려는 봉기를 누름
    - 1898년 미국에 병합되며 끝남
  startEvents: [hawaii-overthrow-1893]
  endEvents: [hawaii-annexation-1898]
  basis:
    type: primary_source
    refs: ["위키백과 Republic of Hawaii", "위키백과 하와이 공화국"]
    foundingNote: 여왕을 몰아낸 임시 정부가 들어선 1893년 1월 17일부터
