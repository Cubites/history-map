    - 1871년 6월 5일 입헌 정부를 세움
    - 비치레부섬 서쪽 산지는 끝내 따르게 하지 못함
    - 1874년 추장들이 영국에 땅을 넘김
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Fiji", "피지 할양 증서(1874)"]
    foundingNote: 카코바우를 왕으로 하는 입헌 정부가 선 1871년 6월 5일부터
