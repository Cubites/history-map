# central-asia early-medieval 나라 (시대 파일 scripts/geo/areas/central-asia/early-medieval.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 600~820: 서돌궐과 아랍 정복
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-early-medieval').
# 칸 나눔(C3 뼈대 2026-11-06, ca3/c3/COMMON.md 4·5·6절): 구현 칸 W1A·W1T·E1는 아래 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다(색은 C3 뼈대 skel/de.mjs로 이웃과 ΔE 26 넘게 고름).
#   from·to는 표의 값 — 끝·시작 해는 정의 칸이 사료로 한 번 확인한다(다르면 결과 노트 2절). 항목 to는 끝 해 포함, 지도는 칠하는 마지막 해까지. native는 정의 칸이 원어판 위키로 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis.foundingNote도 그 칸이 더함 — COMMON 6절 탭 칸, startEvents·endEvents는 사건 ca-02·ca-03 몫이라 빈 목록 그대로).
#   다른 칸이 칠하기만 하는 땅의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다(COMMON 5절).
# 늘린 나라(서아시아·남아시아·동아시아·내륙아시아·유럽 yaml)는 이 파일에 두지 않고 그 파일 블록에서 고친다(COMMON 5절 굵은 칸만, 그 나라 글만).

# ══ C3 W1A 항목 ══
# 글은 W1A 칸이 채움(2026-11-06) — from 600은 결정 Q3·맞춤 M22(지도 첫 해), 사료의 시작 해 625는 summary·foundingNote에
- id: tokhara-yabghus
  level: polity
  names: { ko: 토하리스탄 야브구국, en: Yabghus of Tokharistan, native: طخارستان }
  from: 600
  to: 758
  color: "#bf4084"
  summary: 서돌궐이 세운 토하리스탄의 야브구 정권. 지금 아프가니스탄 북부와 우즈베키스탄·타지키스탄 남부에 걸친 땅으로, 625년 무렵 서돌궐의 퉁 야브구 카간이 에프탈이 무너진 뒤 남은 이 지역 제후국들을 복속시키고 아들을 야브구(왕족 제후)로 세워 쿤두즈를 도읍으로 발흐·차가니얀·후탈·바다크샨의 토후들을 거느리게 함
  endNote: 705~710년 우마이야의 호라산 총독 쿠타이바 이븐 무슬림이 발흐 쪽 아래 토하리스탄을 되찾고 야브구를 다마스쿠스로 보낸 뒤 야브구 가문은 바다크샨 쪽에서 버텼고, 아바스 칼리프국이 들어선 뒤 758년 무렵 끝남
  mapNote: 지도에는 600년부터 758년까지(625년 앞은 에프탈 제후국들의 땅). 600~704년 발흐·주즈잔·파르얍·사망간과 쿤두즈·타하르·바글란, 아무다리야 북쪽 차가니얀(수르한다리야)·후탈(쿨랍) 쪽을 그리고, 705년부터 발흐 쪽 아래 토하리스탄은 우마이야 칼리프국으로 넘기고 바다크샨을 더함. 7세기 중엽 당이 둔 월지도독부는 이름뿐이라 나누지 않음. 경계는 지금 주 경계에 기댄 어림
  features:
    - 도읍은 쿤두즈
    - 625년 무렵부터 657년까지 서돌궐 카간을 종주로 받듦
    - 7세기 중엽 당의 책봉을 받아 월지도독부라는 이름을 얻었으나 실제 지배는 없었음
    - 718년 무렵에도 차가니얀·후탈·와한·바다크샨의 토후들이 야브구 아래에 있었음
  startEvents: [oasis-states-600]
  endEvents: [talas-aftermath-751]
  basis:
    type: primary_source
    refs: ["위키백과 Yabghus of Tokharistan", "위키백과 Tong Yabghu Qaghan"]
    foundingNote: 퉁 야브구 카간이 아들을 토하리스탄 야브구로 세운 625년 무렵을 시작으로 보나, 지도는 그 앞 에프탈 제후국들의 땅도 같은 땅으로 이어 600년부터 그림

# 글은 W1A 칸이 채움(2026-11-06) — 821~869년은 W2가 같은 땅으로 이어 칠함
- id: zunbils
  level: polity
  names: { ko: 자불리스탄의 준빌 왕조, en: Zunbils, native: زنبیل }
  from: 680
  to: 870
  color: "#8e8ec2"
  summary: 자불리스탄(지금 아프가니스탄 남부의 가즈니·자불·칸다하르와 헬만드강 위쪽)을 다스린 왕조. 680년 무렵 카불의 투르크 샤히 왕가에서 갈라져 헬만드강 위쪽 자민다와르를 중심으로 200년 가까이 시스탄의 아랍군을 막음
  endNote: 870년 사파르 왕조의 야쿠브 이븐 라이스가 자불리스탄에 쳐들어가 준빌 왕을 죽이고 땅을 차지함
  mapNote: 지도에는 680년부터 869년까지. 가즈니·자불과 우루즈간 남쪽(하자라자트는 비움), 헬만드강 위쪽 골짜기(보스트·기리슈크·자민다와르)와 아르간다브 골짜기의 칸다하르를 그림. 헬만드 둘레 사막(레지스탄·다시티마르고)은 비우고, 아랍군이 보스트를 잠시 쥔 때는 나누지 않음. 경계는 강 골짜기를 따라 그은 어림
  features:
    - 중심지는 헬만드강 위쪽의 자민다와르
    - 698년 우바이달라 이븐 아비 바크라가 이끈 아랍군을 크게 무찌름
    - 아랍 총독들에게 공물을 바치기도 하고 거부하기도 하며 버팀
    - 720년 무렵 당의 책봉을 받음
  startEvents: [zunbil-kabul-680]
  endEvents: [zunbil-kabul-680]
  basis:
    type: primary_source
    refs: ["위키백과 Zunbils", "위키백과 Turk Shahis"]
    foundingNote: 카불 투르크 샤히 왕의 형제가 680년 무렵 자불리스탄에서 따로 왕이 된 때부터. 시작 해는 어림

# 글은 W1A 칸이 채움(2026-11-06) — 821~994년은 W2가 같은 땅으로 이어 칠함(900~994 사만 왕조 vassal_of 줄도 W2)
- id: afrighid-dynasty
  level: polity
  names: { ko: 호라즘의 아프리그 왕조, en: Afrighid dynasty, native: آفریغیان }
  from: 305
  to: 995
  color: "#a640bf"
  summary: 아무다리야 하류 호라즘을 다스린 토착 왕조로, 아무다리야 오른쪽 기슭의 카트를 도읍으로 호라즘 샤 칭호를 씀. 305년 아프리그가 열었다고 전하며, 712년 아랍의 쿠타이바 이븐 무슬림에게 굴복한 뒤에도 이슬람을 받아들여 호라즘을 이어 다스림
  endNote: 995년 호라즘 북쪽 구르간지의 마문 가문 아미르가 카트를 쳐 마지막 호라즘 샤를 죽이고 호라즘 샤 칭호를 가져감
  mapNote: 지도에는 600년부터 994년까지(앞 시대는 아직 그리지 않음). 아무다리야 양쪽 기슭의 호라즘 오아시스(히바·구르간지 쪽과 카트 쪽)를 그리고, 712년 쿠타이바의 원정은 되돌려진 점령이라 나누지 않음. 우스튜르트 고원·키질쿰·카라쿰 쪽 사막은 비움. 경계는 근세 히바 칸국 땅에 기댄 어림이라 오아시스 둘레 사막도 조금 들어감
  features:
    - 도읍은 아무다리야 오른쪽 기슭의 카트
    - 712년 쿠타이바의 원정 뒤 아랍 칼리프국에 공물을 바침
    - 10세기 초부터 사만 왕조를 종주로 받듦
  startEvents: []
  endEvents: [khwarazm-mamunid-995]
  basis:
    type: primary_source
    refs: ["위키백과 Afrighid dynasty"]
    foundingNote: 시작 해 305년은 이 왕조의 역사를 적은 11세기 학자의 전승을 따른 것이라 전설에 가까움. 지도는 600년부터 그림

# ══ C3 W1T 항목 ══
# 소그드 도시 군주국 묶음 — from은 에프탈의 소그디아나 정복(479년 무렵, 도시 군주들이 동맹 관계로 다스림), 끝은 712년 사마르칸트 항복
- id: sogdian-city-states
  level: polity
  names: { ko: 소그디아나 도시 군주국들, en: Sogdian city-states, native: سغد }
  from: 479
  to: 712
  color: "#8b7e4b"
  summary: 자라프샨·카슈카다리야 골짜기 소그드 도시 군주들의 묶음. 사마르칸트·부하라·케슈·판자켄트 같은 오아시스 도시를 저마다의 군주가 다스렸고, 실크로드 장사로 이름난 소그드 상인의 고향
  endNote: 우마이야 칼리프국의 호라산 총독 쿠타이바 이븐 무슬림이 709년 부하라를, 712년 사마르칸트를 차지하면서 도시 군주들은 칼리프국 아래 조공하는 신하가 됨
  mapNote: 지도에는 600년부터 711년까지(부하라 오아시스는 708년까지). 자라프샨 골짜기(사마르칸트·부하라·나보이 쪽, 위 자라프샨의 판자켄트까지)와 카슈카다리야 오아시스(케슈·나사프)를 그리고, 북쪽 키질쿰 사막과 카르시 서쪽 초원·히사르 산지는 비움. 720~737년 소그드 반란과 투르기시의 침입으로 아랍이 잠시 잃은 땅은 다시 그리지 않음. 경계는 오아시스 둘레를 손으로 그은 어림
  features:
    - 사마르칸트의 이흐시드를 비롯해 도시마다 군주가 따로 있어 한 나라로 묶이지 않음
    - 6세기 말부터 서돌궐 카간을 섬기며 초원과 중국을 잇는 장사를 도맡음
    - 709년 부하라, 712년 사마르칸트가 우마이야 칼리프국에 항복함
    - 722년 판자켄트의 데와슈티치가 아랍에 맞서다 잡혀 죽음
  startEvents: []
  endEvents: [arab-transoxiana-705]
  basis:
    type: primary_source
    refs: ["위키백과 Sogdia", "위키백과 Muslim conquest of Transoxiana"]
    foundingNote: 에프탈이 소그디아나를 차지한 479년 무렵부터 도시 군주들이 동맹 관계로 다스렸다고 보아 그 해를 시작으로 둠(도시 군주국 자체는 그보다 오래됨)

# 페르가나 왕국 — 시작 해는 사료에 없어(712년 앞에 이미 있었음) 지도 첫 해 600, 끝은 818(창구 ③ 결정 Q-A — 819년 사만 가문 아흐마드가 페르가나 총독이 되며 이흐시드 왕가 끝)
- id: ferghana-kingdom
  level: polity
  names: { ko: 페르가나 왕국, en: Principality of Farghana, native: فرغانه }
  from: 600
  to: 818
  color: "#b77dd4"
  summary: 페르가나 분지(지금 우즈베키스탄 동부·키르기스스탄 남서부)의 토착 군주국. 군주는 이흐시드라 불렸고, 서돌궐·당·아랍 사이에서 자리를 지킴
  endNote: 819년 아바스 칼리프국이 사만 가문의 아흐마드를 페르가나 총독으로 세우면서 이흐시드 왕가의 다스림이 끝남
  mapNote: 지도에는 600년부터 818년까지. 페르가나 분지와 둘레 산(차트칼·페르가나·알라이 산줄기)을 그리고, 715년 쿠타이바가 이흐시드를 몰아내고 다스린 짧은 때는 곧 되돌려져 그리지 않음. 751년 탈라스 전투 뒤에도 8세기 말까지 아랍의 지배 밖에 있었으므로 이흐시드 왕가가 이어진 818년까지 이 나라로 그리고, 819년부터 아바스 칼리프국 땅으로 그림. 경계는 분지 둘레 산줄기에 기댄 어림
  features:
    - 분지 둘레의 산줄기에 막힌 기름진 땅으로, 한나라 때부터 좋은 말의 산지로 알려짐
    - 657년 서돌궐이 무너진 뒤 당의 안서도호부 아래 들어감
    - 715년 쿠타이바에게 군주를 잃었으나 당의 도움으로 곧 되찾음
    - 751년 탈라스 전투에서 당의 편에 섬
    - 819년 사만 가문의 아흐마드가 아바스 칼리프국의 페르가나 총독이 됨
  startEvents: []
  endEvents: [samanid-transoxiana-819]
  basis:
    type: primary_source
    refs: ["위키백과 Principality of Farghana", "위키백과 Muslim conquest of Transoxiana"]
    foundingNote: 712년 앞에 이미 있었다는 것만 알려져 시작 해를 정할 수 없어 지도의 첫 해인 600년으로 둠

# 우스루샤나의 아프신 왕조 — 시작 해는 사료에 없어(에프탈·서돌궐 때부터 아프신이 다스림) 지도 첫 해 600, 끝은 892~893년 마지막 군주
- id: ustrushana-afshins
  level: polity
  names: { ko: 우스루샤나의 아프신 왕조, en: Afshins of Ushrusana, native: اسروشنه }
  from: 600
  to: 892
  color: "#c28e9c"
  summary: 사마르칸트와 후잔드 사이 우스루샤나를 다스린 아프신 칭호의 토착 왕조. 도읍은 투르키스탄 산줄기 북쪽 기슭의 분지카트
  endNote: 892년 무렵 마지막 군주 사이르 이븐 압둘라를 끝으로 사만 왕조의 이스마일 사마니가 우스루샤나를 자기 주로 삼음
  mapNote: 지도에는 600년부터 891년까지. 투르키스탄 산줄기 북쪽 기슭의 이스타라브샨·자민 쪽을 그리고, 북쪽 후잔드 오아시스와 미르자출 초원, 서쪽 지작 오아시스는 비움. 경계는 산기슭과 강가 띠를 손으로 그은 어림
  features:
    - 에프탈과 서돌궐 아래서도 아프신이 땅을 직접 다스리며 자치를 지킴
    - 794년 아바스 칼리프국에 복속하고, 822년 칼리프 마문의 원정 뒤 완전히 굴복함
    - 하이다르(아프신)는 칼리프 알무타심의 장군이 되어 이름을 떨침
    - 892년 무렵 사만 왕조의 주가 됨
  startEvents: []
  endEvents: [samanid-transoxiana-819]
  basis:
    type: primary_source
    refs: ["위키백과 Ushrusana", "위키백과 Muslim conquest of Transoxiana"]
    foundingNote: 에프탈과 서돌궐 때부터 아프신이 다스렸다는 것만 알려져 시작 해를 정할 수 없어 지도의 첫 해인 600년으로 둠

# ══ C3 E1 항목 ══
- id: western-turkic-khaganate
  level: polity
  names: { ko: 서돌궐 카간국, en: Western Turkic Khaganate, native: On Oq Bodun }
  from: 603
  to: 657
  color: "#a6bf40"
  summary: 돌궐 제1 카간국에서 갈라진 서쪽 카간국. 열 부족(온 오크)을 거느리고 수야브(쇄엽)와 톈산 북쪽 여름 도읍을 중심으로 세미레치예·시르다리야 쪽을 다스렸으며, 소그디아나와 타림 분지 오아시스 나라들에게서 조공을 받음
  endNote: 657년 당의 소정방이 이르티시강 가에서 아시나하로 카간을 이기면서 무너졌고, 그 땅은 당의 기미부주(이름뿐인 복속)로 나뉨
  features:
    - 603년 무렵 동쪽 돌궐과 완전히 갈라져 따로 카간을 세움
    - 통엽호 카간(재위 618~630) 때 가장 넓어져 카스피해 북쪽에서 타림 분지까지 거느림
    - 630년 통엽호 카간이 죽은 뒤 열 부족이 두 무리로 갈라져 다툼
    - 657년 당의 소정방에게 지고 무너짐
  mapNote: 지도에는 603년부터 657년까지, 초원 중부·북부와 조공국 소그드는 그리지 않음. 세미레치예(추강·탈라스강·이시크쿨 쪽)와 이리 골짜기, 시르다리야 중류 도시 띠(투르키스탄·오트라르·크질오르다 쪽)를 넣은 대략적인 추정
  startEvents: [oasis-states-600]
  endEvents: [samarkand-afrasiab-650]
  basis:
    type: primary_source
    refs: ["위키백과 Western Turkic Khaganate"]
    foundingNote: 동쪽 돌궐과의 싸움(593~603) 끝에 완전히 갈라진 603년을 시작으로 봄

- id: turgesh-khaganate
  level: polity
  names: { ko: 투르기시 카간국, en: Turgesh Khaganate, native: Türgiş }
  from: 699
  to: 766
  color: "#3644a1"
  summary: 서돌궐 열 부족의 하나인 투르기시가 699년 세미레치예에 세운 카간국. 703년 수야브(쇄엽)를 도읍으로 삼았고, 트란스옥시아나로 들어오는 아랍군과 오래 맞섬
  endNote: 카간이 살해된 뒤 내분과 당의 개입으로 약해졌고, 766년 카를루크가 세미레치예를 차지하면서 사라짐
  features:
    - 699년 서돌궐 열 부족의 하나인 투르기시가 홀로 섬
    - 703년 수야브를 차지하고 도읍으로 삼음
    - 720~730년대 소그디아나의 반란을 도와 아랍군과 여러 차례 싸움
    - 737년 하리스탄에서 진 뒤 카간이 살해되어 내분에 빠짐
    - 766년 카를루크에게 세미레치예를 빼앗김
  mapNote: 지도에는 699년부터 765년까지. 세미레치예(추강·탈라스강·이시크쿨 쪽)와 이리 골짜기, 시르다리야 중류 도시 띠를 넣음. 728년 부하라 점령·731년 협곡 싸움 같은 트란스옥시아나 원정은 그리지 않음
  startEvents: [turgesh-khaganate-699]
  endEvents: [talas-aftermath-751]
  basis:
    type: primary_source
    refs: ["위키백과 Turgesh"]
    foundingNote: 투르기시 수령이 서돌궐 열 부족을 아울러 홀로 선 699년을 시작으로 봄

- id: karluk-yabgu-state
  level: polity
  names: { ko: 카를루크 야브구국, en: Karluk Yabgu State, native: Qarluq }
  from: 766
  to: 840
  color: "#409640"
  summary: 알타이·이르티시 쪽에서 옮겨 온 카를루크 부족이 766년 투르기시를 꺾고 세미레치예에 세운 나라. 우두머리는 야브구 칭호를 썼고, 840년 위구르 카간국이 무너진 뒤 카간을 칭하며 카라한 왕조로 이어짐
  endNote: 840년 위구르 카간국이 무너지자 카를루크 우두머리가 카간 칭호를 쓰기 시작했고, 이를 카라한 왕조의 시작으로 봄
  features:
    - 751년 탈라스 전투에서 아바스 쪽으로 돌아서 당군을 무너뜨림
    - 766년 투르기시를 꺾고 수야브를 차지함
    - 세미레치예와 이리 골짜기, 시르다리야 중류 도시 띠를 다스림
    - 840년 우두머리가 카간을 칭하며 카라한 왕조로 이어짐
  mapNote: 지도에는 766년부터 839년까지. 세미레치예(추강·탈라스강·이시크쿨 쪽)와 이리 골짜기, 시르다리야 중류 도시 띠를 넣은 대략적인 추정
  startEvents: [talas-aftermath-751]
  endEvents: [karakhanid-rise-840]
  basis:
    type: primary_source
    refs: ["위키백과 Karluk Yabgu State"]
    foundingNote: 투르기시를 꺾고 수야브를 차지한 766년을 시작으로 봄(야브구 칭호를 쓴 것은 742년 또는 756년부터라는 기록도 있음)

# 투루판 고창국(국씨 왕조) — 창구 ③ 결정 Q-B로 더함(반영 2026-11-06). from은 사료의 시작 해 501(맞춤 M22), 지도에는 600부터
- id: qu-gaochang
  level: polity
  names: { ko: 고창국, en: Gaochang, native: 高昌 }
  from: 501
  to: 639
  color: "#c85a8c"
  summary: 투루판 분지의 고창성을 도읍으로 한 한인 국씨 왕가의 오아시스 왕국. 실크로드 북도의 길목에서 서돌궐과 손잡고 중국 왕조들과도 사신을 주고받음
  endNote: 640년 당 태종이 보낸 후군집의 군대가 고창을 함락하고 그 땅에 서주를 두면서 끝남
  features:
    - 501년 무렵 국가가 왕위에 올라 국씨 왕조를 엶
    - 국백아와 국문태 때 서돌궐 카간과 혼인·동맹을 맺음
    - 630년 무렵 현장이 인도로 가는 길에 머물며 국문태의 후원을 받음
    - 640년 당의 후군집에게 함락됨
  mapNote: 지도에는 600년부터 639년까지. 투루판 분지와 그 서쪽 카라샤르 분지 북쪽까지를 넣고, 603년부터 서돌궐 카간국의 종속국으로 표시함. 경계는 분지 둘레 산줄기에 기댄 어림
  startEvents: []
  endEvents: [oasis-states-600]
  basis:
    type: primary_source
    refs: ["위키백과 Gaochang"]
    foundingNote: 국가가 고창 왕이 되어 국씨 왕조가 선 501년을 시작으로 봄(499년으로 적은 기록도 있음)
