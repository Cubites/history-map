  color: "#5aa0a0"
  summary: 1330년 무렵 카파야 나야카가 델리 술탄국을 몰아내고 와랑갈을 되찾아 세운 텔루구 나야카들의 나라
  mapNote: 지도에는 1330년부터 1367년까지 지금 텔랑가나주와 안드라 고다바리·크리슈나 삼각주 쪽을 어림해 표시함. 끝 해는 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Musunuri Nayakas"]

- id: reddi-kingdom
  level: polity
  names: { ko: 레디 왕국, en: Reddi Kingdom, native: రెడ్డి రాజ్యం }
  from: 1325
  to: 1446
  color: "#d070d0"
  summary: 1325년 프롤라야 베마 레디가 안드라 해안 콘다비두에 세운 왕국. 라자문드리 갈래도 있었음
  mapNote: 지도에는 1330년부터 1445년까지 군투르 쪽을, 1368년부터 고다바리·크리슈나 삼각주를 표시함. 1446년 가자파티의 정복에서 끝냄
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Reddi Kingdom"]

- id: chola-dynasty
  level: polity
  names: { ko: 촐라 왕조, en: Chola dynasty, native: சோழர் }
  from: 848
  to: 1279
  color: "#406898"
  summary: 9세기 중엽 비자얄라야가 탄자부르에서 다시 일으킨 타밀 왕조. 13세기에 판디아에게 밀려 1279년 무렵 끝남
  mapNote: 지도에는 1206년부터 1215년까지 지금 타밀나두주를 표시함. 1216년 판디아의 공격 뒤는 판디아 색으로 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Chola dynasty"]

- id: pandya-dynasty
  level: polity
  names: { ko: 판디아 왕조, en: Pandya dynasty, native: பாண்டியர் }
  from: 1190
  to: 1323
  color: "#50a060"
  summary: 마두라이를 도읍으로 한 타밀 왕조. 12세기 말 다시 일어나 13세기에 촐라를 누르고 남인도 동부를 다스림
  mapNote: 지도에는 1216년부터 1322년까지 지금 타밀나두주를 표시함. 케랄라 남부·실론 북부에 대한 원정과 공납은 칠하지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Pandya dynasty"]

- id: madurai-sultanate
  level: polity
  names: { ko: 마두라이 술탄국, en: Madurai Sultanate, native: மதுரை சுல்தானகம் }
  from: 1335
  to: 1378
  color: "#8a8a3a"
  summary: 1335년 델리 술탄국의 마바르 총독 잘랄 앗딘 아산 칸이 독립해 세운 술탄국. 1378년 비자야나가라에게 무너짐
  mapNote: 지도에는 1335년부터 1377년까지 지금 타밀나두주 중·남부를 표시함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Madurai Sultanate"]

- id: madurai-nayak
  level: polity
  names: { ko: 마두라이 나야크 왕조, en: Madurai Nayak dynasty, native: மதுரை நாயக்கர் }
  from: 1529
  to: 1736
  color: "#e890a8"
  summary: 비자야나가라가 1529년 마두라이에 보낸 나야크(총독) 비스바나타가 세운 왕조. 비자야나가라가 약해진 뒤 독립해 1736년까지 이어짐
  mapNote: 지도에는 1600년부터 1735년까지 지금 타밀나두주 중·남부를 표시함. 비자야나가라에서 떨어져 나온 해는 공납을 끊은 무렵인 1600년으로 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Madurai Nayak dynasty"]
    foundingNote: 1529년 비스바나타 나야크가 마두라이에 온 해부터

- id: gingee-nayak
  level: polity
  names: { ko: 진지 나야크 왕조, en: Gingee Nayaks, native: செஞ்சி நாயக்கர் }
  from: 1509
  to: 1649
  color: "#6a5aa0"
  summary: 비자야나가라가 진지에 둔 나야크 가문이 세운 왕조. 1649년 비자푸르 술탄국에게 진지를 잃음
  mapNote: 지도에는 1600년부터 1648년까지 톤다이만달람(지금 타밀나두주 북부)을 표시함. 팔라르강 북쪽(벨로르·칸치푸람)은 16세기 중반 아라비두 왕조에 잃어 1600~1645년 비자야나가라 땅으로 그림. 독립 해는 마두라이 나야크와 같이 1600년으로 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Gingee Nayaks"]
    foundingNote: 크리슈나데바 라야가 진지에 나야크를 둔 무렵(1509)부터

- id: sinhalese-kingdom
  level: polity
  names: { ko: 싱할라 왕국, en: Sinhalese kingdom, native: සිංහල රාජධානිය }
  from: 1070
  to: 1412
  color: "#d0a070"
  summary: 1070년 비자야바후 1세가 촐라를 몰아낸 뒤 폴론나루와를 도읍으로 한 싱할라 왕국. 13세기부터 담바데니야·얍파후와·쿠루네갈라·감폴라로 도읍을 옮김
  mapNote: 지도에는 1206년부터 1411년까지 표시함. 1215년 칼링가 마가가 북쪽 라자라타를 차지한 뒤로는 남서부·중부·동부만 그리고, 도읍을 옮긴 왕조는 한 나라로 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Polonnaruwa"]
    foundingNote: 1070년 비자야바후 1세의 폴론나루와 탈환부터

- id: magha-kingdom
  level: polity
  names: { ko: 마가 왕국, en: Kalinga Magha's kingdom, native: කාලිංග මාඝ රාජ්‍යය }
  from: 1215
  to: 1256
  color: "#7a5a4a"
  summary: 1215년 칼링가 마가가 폴론나루와를 빼앗아 실론 북부 라자라타에 세운 나라
  mapNote: 지도에는 1215년부터 1255년까지 실론 북부(지금 북중부·북부·트린코말리 지구)를 표시함. 끝 해는 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kalinga Magha"]

- id: kotte-kingdom
  level: polity
  names: { ko: 코테 왕국, en: Kingdom of Kotte, native: කෝට්ටේ රාජධානිය }
  from: 1412
  to: 1597
  color: "#4a9ab0"
  summary: 1412년 파라크라마바후 6세가 즉위해 1415년 코테로 도읍을 옮긴 싱할라 왕국. 1597년 다르마팔라가 포르투갈 왕에게 나라를 넘김
  mapNote: 지도에는 1412년부터 1596년까지 실론의 반니·자프나를 뺀 땅을 표시함. 칸디(1469~)는 1591년까지 1만 km² 미만이라 같은 색으로 그리고, 시타와카가 차지한 땅은 1565년부터 시타와카 색으로 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Kotte"]

- id: sitawaka-kingdom
  level: polity
  names: { ko: 시타와카 왕국, en: Kingdom of Sitawaka, native: සීතාවක රාජධානිය }
  from: 1521
  to: 1594
  color: "#d07090"
  summary: 1521년 코테 왕국이 셋으로 갈릴 때 마야두네가 세운 왕국. 라자싱하 1세 때 섬 대부분을 다스렸고 1593년 그가 죽은 뒤 무너짐
  mapNote: 지도에는 1565년부터 1593년까지 표시함. 1521~1564년 시타와카 땅은 1만 km² 미만이라 코테 색으로 그리고, 1565년 코테가 콜롬보로 물러난 뒤 내륙 저지(가마하·칼루타라·쿠루네갈라·사바라가무와)와 1582년 정복한 칸디 산지를 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Sitawaka"]

- id: portuguese-ceylon
  level: polity
  names: { ko: 포르투갈령 실론, en: Portuguese Ceylon, native: Ceilão Português }
  from: 1597
  to: 1658
  color: "#2a7a4a"
  summary: 1597년 코테 왕 다르마팔라가 포르투갈 왕에게 나라를 넘기며 생긴 실론 해안의 포르투갈 식민지. 1658년 네덜란드에게 넘어감
  mapNote: 지도에는 1597년부터 1657년까지 실론 서·남해안 지구를, 1619년부터 자프나를 더해 표시함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Portuguese Ceylon"]

