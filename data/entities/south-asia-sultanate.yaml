# south-asia sultanate 나라 (시대 파일 scripts/geo/areas/south-asia/sultanate.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 1206~1756: 델리 술탄국·데칸·비자야나가라·무굴
# 나라를 넣을 때 아래 []를 지우고 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'south-asia-sultanate').
# 1206년에 이미 있던 왕조(야다바·호이살라·카카티야 등)는 from을 실제 해로 적고 도형은 1206년부터(S4가 같은 id로 앞을 그림). 1757년에도 이어지는 S1·S2 항목(mewar-state·
# maratha-peshwa·bengal-nawabs·hyderabad-state·nepal 등)은 항목이 south-asia-colonial.yaml·south-asia-modern.yaml에 있으므로 여기 두지 않는다(두 항목 파일에 같은 id를 두지 않음 — from과 글만 그 파일에서 고침).
# 칸 나눔(S3 뼈대, <sp>/IMPL-SPLIT.md): 구현 S3-서는 '# ── S3 서 ──', S3-동은 '# ── S3 동 ──' 칸 아래에만 쓴다. 아래 '# ── S3 공통(뼈대) ──' 블록은 항목마다 '글은 ○ 칸이 채움'에 적힌 칸만 고친다.
#   공통 블록의 id·이름·색은 메인이 정한 값(IMPL-COMMON '여러 칸이 쓰는 항목 표')이라 바꾸지 않는다. summary·mapNote·basis는 뼈대의 자리 글이라 글을 쓰는 칸이 바꿔 쓴다(details·endNote·features·foundingNote도 그 칸이 더함).

# ── S3 공통(뼈대) ──
# 글은 서 칸이 채움
- id: delhi-sultanate
  level: polity
  names: { ko: 델리 술탄국, en: Delhi Sultanate, native: دہلی سلطنت }
  from: 1206
  to: 1526
  color: "#a03820"
  summary: 1206년 쿠트브 웃딘 아이바크가 세운 북인도의 이슬람 술탄국으로, 맘루크·할지·투글루크·사이이드·로디 다섯 왕조가 델리를 도읍으로 이어 다스림. 투글루크 왕조 때 데칸까지 넓혔으나 1398년 티무르의 델리 약탈 뒤 크게 줄어듦
  mapNote: 지도에는 1206년부터 1525년까지 델리·펀자브에서 시작해 1228년 물탄·신드 북부, 1304년 구자라트, 1317년 데칸 서부를 더하고 1347년 데칸을 잃은 모습으로 표시하며, 다섯 왕조를 같은 항목·같은 색으로 그림. 1398년부터 1413년까지는 티무르의 약탈 뒤 펀자브 서부가 여러 세력으로 갈려 델리 본령만 칠함. 동쪽은 1206~1393년 갠지스 평원, 1206~1337년 벵골, 1305~1400년 말와, 1323~1329년 텔랑가나·안드라, 1323~1334년 타밀 땅, 1479~1525년 오우드·비하르를 표시함
  endNote: 1526년 4월 파니파트 전투에서 이브라힘 로디가 바부르에게 져 죽으며 끝남
  features:
    - 도읍은 라호르, 1210년 무렵부터 델리(1327~1335년 데바기리로 옮김)
    - 알라웃딘 할지가 몽골 침입을 막고 구자라트·란탐보르·치토르를 정복함
    - 왕조 교체는 1290 할지·1320 투글루크·1414 사이이드·1451 로디
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Delhi Sultanate"]

# 글은 서 칸이 채움
- id: mughal-empire
  level: polity
  names: { ko: 무굴 제국, en: Mughal Empire, native: مغلیہ سلطنت }
  from: 1526
  to: 1857
  color: "#b02858"
  summary: 1526년 티무르의 후손 바부르가 파니파트 전투에서 이겨 세운 제국으로, 아크바르·자한기르·샤자한·아우랑제브 때 남아시아 대부분을 다스림. 1707년 아우랑제브가 죽은 뒤 지방 총독과 마라타·두라니에게 땅을 잃고 델리 둘레만 남음
  mapNote: 지도에는 1526년부터 1539년, 1555년부터 1756년까지 표시함(그 사이는 수르 왕조). 1573년 구자라트, 1586년 카슈미르, 1593년 신드, 1601년 칸데시, 1636년 아마드나가르, 1686년 비자푸르를 더하고 1724년 하이데라바드, 1752년 펀자브를 잃은 모습. 동쪽은 1526~1539·1555~1756년 갠지스 평원(아와드는 1722년 전까지), 1576년부터 벵골·비하르, 1592년부터 오리사, 1687~1723년 텔랑가나·안드라를 표시함. 1756년에는 델리·하리아나·시르힌드와 갠지스강 위쪽 도아브만 남기고 1757년부터는 그리지 않음(황제는 명목상 이어짐)
  endNote: 1857년 세포이 항쟁 때 반란군이 받든 마지막 황제 바하두르 샤 2세를 영국이 붙잡아 폐위함
  features:
    - 도읍은 아그라·파테푸르 시크리·라호르, 1648년부터 샤자하나바드(델리)
    - 아크바르가 만사브다르 제도와 라지푸트 혼인 동맹으로 나라를 굳힘
    - 1739년 나디르 샤의 델리 약탈로 공작 왕좌를 빼앗김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Mughal Empire"]

# 글은 동 칸이 채움
- id: sur-empire
  level: polity
  names: { ko: 수르 왕조, en: Sur Empire, native: سوری سلطنت }
  from: 1540
  to: 1556
  color: "#506040"
  summary: 1540년 셰르 샤 수르가 차우사·카나우지 전투에서 무굴의 후마윤을 몰아내고 세운 아프간 왕조. 화폐 루피야와 대간선 도로를 정비했고, 1555년 후마윤이 델리를 되찾은 뒤 무너짐
  mapNote: 지도에는 1540년부터 1554년(비하르는 1556년)까지 갠지스 평원·벵골·비하르를, 1542년부터 말와를 더해 표시함. 서쪽은 펀자브·델리·란탐보르 쪽을 1540년, 물탄을 1541년부터 1554년까지 그림. 벵골은 1554년 무함마드 칸 수르의 독립 뒤 벵골 술탄국 색으로, 비하르는 1557년 수라지가르 전투 뒤 벵골 술탄국 색으로 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Sur Empire"]

# 글은 서 칸이 채움
- id: bahmani-sultanate
  level: polity
  names: { ko: 바흐마니 술탄국, en: Bahmani Sultanate, native: بہمنی سلطنت }
  from: 1347
  to: 1527
  color: "#3a7d5a"
  summary: 1347년 데칸의 투글루크 장교들이 알라웃딘 바흐만 샤를 세워 델리 술탄국에서 떨어져 나온 술탄국. 비자야나가라 제국과 라이추르 도압을 두고 거듭 싸움
  mapNote: 지도에는 1347년부터 1491년까지 마하라슈트라·북 카르나타카·텔랑가나 서부를 표시하고, 1490년 아마드나가르·비자푸르·베라르가 떨어져 나간 뒤 1491년까지는 비다르 둘레만 그림. 1492년부터 형식상 남은 술탄은 재상의 꼭두각시라 비다르 술탄국 색으로 칠함. 텔랑가나는 1368년부터 쿠틉 울 물크가 독립하기 전인 1517년까지 이 색으로 그림
  endNote: 1527년 마지막 술탄 칼리물라가 비다르를 떠나며 끝남
  features:
    - 도읍은 굴바르가, 1429년부터 비다르
    - 15세기 후반 재상 마흐무드 가완이 고아와 콘칸을 얻어 가장 넓힘
    - 지방 총독들이 갈라져 데칸 술탄국 다섯이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Bahmani Sultanate"]

# 글은 서 칸이 채움
- id: bijapur-sultanate
  level: polity
  names: { ko: 비자푸르 술탄국, en: Bijapur Sultanate, native: بیجاپور سلطنت }
  from: 1490
  to: 1686
  color: "#2e6fa0"
  summary: 바흐마니 술탄국의 총독 유수프 아딜 칸이 1490년 자립해 세운 데칸 서남부의 술탄국(아딜 샤 왕조). 1565년 탈리코타 전투에서 비자야나가라를 꺾고 남쪽으로 넓혔으나 1686년 무굴에 병합됨
  mapNote: 지도에는 1490년부터 1685년까지 북 카르나타카·솔라푸르·남콘칸을 중심으로 표시하고(라이추르 도아브는 1520~1564년 비자야나가라), 1565년 벨라리 쪽과 라이추르 도아브, 1619년 비다르, 1636년 조약으로 얻은 푸네·북콘칸, 1646년 방갈루루·시라 쪽을 더함. 1659년부터 시바지에게 콘칸·푸네 쪽을 잃음. 동쪽은 1649년부터 1676년까지 북타밀(진지)을 표시함
  endNote: 1686년 9월 아우랑제브가 비자푸르를 함락해 시칸다르 아딜 샤가 항복하며 끝남
  features:
    - 도읍은 비자푸르
    - 골 굼바즈 같은 이슬람 건축과 데칸 회화가 꽃핌
    - 1510년 고아를 포르투갈에게 빼앗김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Bijapur Sultanate"]

# 글은 서 칸이 채움
- id: ahmadnagar-sultanate
  level: polity
  names: { ko: 아마드나가르 술탄국, en: Ahmadnagar Sultanate, native: احمدنگر سلطنت }
  from: 1490
  to: 1636
  color: "#c89080"
  summary: 바흐마니 술탄국의 총독 말리크 아마드가 1490년 자립해 세운 데칸 북서부의 술탄국(니잠 샤 왕조). 1574년 베라르를 병합했고, 1600년 도읍을 무굴에 잃은 뒤 말리크 암바르가 버팀
  mapNote: 지도에는 1490년부터 1635년까지 아마드나가르·나시크·아우랑가바드와 북콘칸을 표시하고, 1574년부터 1595년까지 베라르를 더함. 1600년 도읍 함락 뒤에도 말리크 암바르가 지킨 땅은 같은 모습으로 그림
  endNote: 1636년 샤자한과 비자푸르의 조약으로 남은 땅이 무굴과 비자푸르에 나뉘며 끝남
  features:
    - 도읍은 주나르, 1494년부터 아마드나가르
    - 찬드 비비가 무굴의 아마드나가르 포위를 한때 막아 냄
    - 말리크 암바르가 게릴라전과 토지세 제도로 이름남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Ahmadnagar Sultanate"]

# 글은 동 칸이 채움
- id: golconda-sultanate
  level: polity
  names: { ko: 골콘다 술탄국, en: Golconda Sultanate, native: گولکنڈہ سلطنت }
  from: 1518
  to: 1687
  color: "#488830"
  summary: 바흐마니 술탄국의 텔랑가나 총독 술탄 쿨리가 1518년 독립해 세운 쿠틉 샤 왕조의 데칸 술탄국. 골콘다 요새와 1591년 세운 하이데라바드를 도읍으로 다이아몬드 교역으로 번성했고, 1687년 아우랑제브에게 무너짐
  mapNote: 지도에는 1518년부터 1686년까지 텔랑가나를, 1550년 고다바리강 쪽 안드라 해안, 1571년 간잠, 1579년 군투르, 1646년 라야랄라시마·넬로르를 더해 표시함. 1636년 무굴에 공납한 뒤에도 실제로 다스린 나라로 그림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Golconda Sultanate"]

# 글은 동 칸이 채움
- id: vijayanagara-empire
  level: polity
  names: { ko: 비자야나가라 제국, en: Vijayanagara Empire, native: ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ }
  from: 1336
  to: 1646
  color: "#d8902c"
  summary: 1336년 하리하라와 부카 형제가 퉁가바드라강 가 비자야나가라(함피)에 세운 남인도의 힌두 제국. 크리슈나데바 라야(1509~1529) 때 가장 컸고, 1565년 탈리코타 전투에서 데칸 술탄국 연합에게 진 뒤 페누콘다·찬드라기리·벨로르로 도읍을 옮기며 1646년까지 이어짐
  mapNote: 지도에는 1336년부터 1645년까지 표시함. 서쪽은 1336년 벨라리 쪽, 1343년부터 1564년까지 카르나타카 남부를 그림. 1378년 마두라이 술탄국을 무너뜨린 뒤 타밀 땅 전부를 그리고, 1446~1469년 가자파티가 차지한 안드라 해안·북타밀은 가자파티 색으로 그림. 1520년부터 1564년까지 라이추르 도아브(크리슈나강–퉁가바드라강 사이)를 더함. 마두라이·진지 나야크가 공납을 끊은 무렵인 1600년부터는 라야랄라시마 쪽과 팔라르강 북쪽 톤다이만달람(벨로르·찬드라기리)만 남김(나야크의 독립 해는 어림)
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Vijayanagara Empire"]

# ── S3 공통(뼈대) 끝 ──

# ── S3 서 ──
- id: qubacha-multan
  level: polity
  names: { ko: 물탄 카바차 정권, en: Multan under Qabacha, native: قباچہ }
  from: 1206
  to: 1228
  color: "#40c8d0"
  summary: 구르 왕조의 맘루크 장군 나시르 웃딘 카바차가 물탄·우치를 근거로 신드 북부까지 다스린 정권. 델리의 아이바크·일투트미시와 겨룸
  mapNote: 지도에는 1206년부터 1227년까지 물탄·바하왈푸르와 신드 북부를 표시함
  endNote: 1228년 일투트미시에게 우치를 잃고 인더스강에 빠져 죽음
  features:
    - 도읍은 물탄과 우치
    - 몽골을 피해 온 호라즘의 잘랄 웃딘과도 싸움
    - 델리 술탄국과 같은 구르 왕조 장군 출신
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Nasir-ud-Din Qabacha"]

- id: soomra-dynasty
  level: polity
  names: { ko: 소마라 왕조, en: Soomra dynasty, native: سومرا }
  from: 1026
  to: 1351
  color: "#207020"
  summary: 하부 신드를 다스린 신드 토착 왕조로, 타타 둘레의 인더스강 삼각주를 근거로 함. 델리 술탄국에 이따금 공물을 바침
  mapNote: 지도에는 1206년부터 1350년까지 하부 신드(타타·하이데라바드·카라치 쪽)를 표시함
  endNote: 1351년 삼마 왕조가 자리를 이으며 끝남
  features:
    - 도읍은 타타 둘레
    - 델리의 종주는 명목에 그침
    - 시작 해는 11세기 전반으로 학설이 갈림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Soomra dynasty"]
    foundingNote: 11세기 전반(1026년 무렵)부터 봄. 시작 해는 학설이 갈림

- id: samma-dynasty
  level: polity
  names: { ko: 삼마 왕조, en: Samma dynasty, native: سمن }
  from: 1351
  to: 1520
  color: "#20d0c8"
  summary: 소마라 왕조를 이어 신드 전체를 다스린 왕조로, 잠 칭호의 군주가 타타를 도읍으로 함. 잠 니잠 웃딘 2세 때 가장 번성함
  mapNote: 지도에는 1351년부터 1519년까지 지금 신드주 땅 전체로 표시함
  endNote: 1520년 칸다하르의 샤 베그 아르군에게 져 끝남
  features:
    - 도읍은 타타
    - 마클리 언덕의 왕실 묘역을 남김
    - 델리 술탄국의 원정을 여러 번 물리침
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Samma dynasty"]

- id: arghun-dynasty
  level: polity
  names: { ko: 아르군 왕조, en: Arghun dynasty, native: ارغون }
  from: 1520
  to: 1593
  color: "#886078"
  summary: 칸다하르에서 내려온 몽골계 아르군 가문이 세운 신드의 왕조로, 1555년부터 갈래인 타르칸 가문이 이음. 무굴 제국의 명목 종주를 받음
  mapNote: 지도에는 1520년부터 1592년까지 지금 신드주 땅으로 표시하고, 1555년 타르칸 왕조로 바뀐 뒤도 같은 항목·같은 색으로 그림
  endNote: 1593년 아크바르의 장군 압두르 라힘에게 항복해 무굴에 병합됨
  features:
    - 도읍은 박카르, 뒤에 타타
    - 1528년 무렵 물탄의 랑가 왕조를 무너뜨림
    - 쫓겨난 후마윤이 신드에 머물 때 아크바르가 아마르코트에서 태어남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Arghun dynasty"]

- id: multan-sultanate
  level: polity
  names: { ko: 물탄 술탄국, en: Langah Sultanate, native: لنگاہ سلطنت }
  from: 1445
  to: 1528
  color: "#3070c8"
  summary: 1445년 랑가 부족의 라이 사흐라가 물탄에서 자립해 세운 술탄국. 델리의 로디 왕조와 맞서며 남펀자브를 다스림
  mapNote: 지도에는 1445년부터 1527년까지 물탄·바하왈푸르와 인더스 서안 데라 가지 칸 쪽을 표시함
  endNote: 1528년 신드의 샤 후사인 아르군이 물탄을 빼앗으며 끝남
  features:
    - 도읍은 물탄
    - 후사인 랑가 때 가장 넓음
    - 수피 성자들의 성지 물탄을 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Langah Sultanate"]

- id: lohara-dynasty
  level: polity
  names: { ko: 로하라 왕조, en: Lohara dynasty, native: लोहर }
  from: 1003
  to: 1339
  color: "#f070a0"
  summary: 카슈미르 골짜기를 다스린 힌두 왕조로, 1003년 무렵 디다 왕비의 친정 로하라 가문이 왕위를 이음. 14세기 초 라다크 출신 린첸과 카슈미르 장수들이 차례로 권력을 쥠
  mapNote: 지도에는 1206년부터 1338년까지 카슈미르 골짜기와 무자파라바드·라자우리 쪽을 표시하고, 1320년 뒤 린첸·우다야나데바·코타 라니 시기도 같은 항목으로 그림
  endNote: 1339년 샤 미르가 코타 라니를 물리치고 왕위에 오르며 끝남
  features:
    - 도읍은 스리나가르 둘레
    - 칼하나의 역사서 라자타랑기니가 이 시기에 쓰임
    - 1320년 몽골계 둘차의 침입으로 골짜기가 크게 무너짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Lohara dynasty"]

- id: kashmir-sultanate
  level: polity
  names: { ko: 카슈미르 술탄국, en: Kashmir Sultanate, native: سلطنت کشمیر }
  from: 1339
  to: 1586
  color: "#2070c8"
  summary: 1339년 샤 미르가 세운 카슈미르의 이슬람 술탄국으로, 1561년부터 차크 가문이 이음. 자인 울 아비딘 때 가장 번성함
  mapNote: 지도에는 1339년부터 1585년까지 카슈미르 골짜기와 무자파라바드·라자우리 쪽을 표시하고, 샤 미르 왕조와 차크 왕조를 같은 항목·같은 색으로 그림
  endNote: 1586년 아크바르의 군대가 유수프 샤 차크를 굴복시켜 무굴에 병합됨
  features:
    - 도읍은 스리나가르
    - 자인 울 아비딘이 종교 관용과 수공업 장려로 이름남
    - 라다크·발티스탄에 원정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kashmir Sultanate"]

- id: chaulukya-dynasty
  level: polity
  names: { ko: 찰루키아 왕조, en: Chaulukya dynasty, native: चौलुक्य }
  from: 942
  to: 1304
  color: "#f078b0"
  summary: 구자라트를 다스린 라지푸트 왕조로, 아나힐라파타카를 도읍으로 함. 1244년 무렵부터 갈래인 바겔라 가문이 이음
  mapNote: 지도에는 1206년부터 1303년까지 구자라트(쿠치 밖)를 표시하고, 바겔라 왕조로 바뀐 뒤도 같은 항목·같은 색으로 그림
  endNote: 1304년 바겔라 왕 카르나가 알라웃딘 할지의 군대에 쫓겨나며 끝남
  features:
    - 도읍은 아나힐라파타카(파탄)
    - 솔랑키라고도 부름
    - 모데라 태양 사원과 아부산 자이나교 사원을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Chaulukya dynasty"]
    foundingNote: 물라라자가 아나힐라파타카에서 즉위한 942년 무렵부터 봄

- id: chahamana-dynasty
  level: polity
  names: { ko: 란탐보르 차하마나 왕조, en: Chahamanas of Ranastambhapura, native: चाहमान }
  from: 1192
  to: 1301
  color: "#20d0a8"
  summary: 아지메르의 차하마나(차우한) 왕조가 1192년 무너진 뒤 갈래가 란탐보르 성에서 이어 간 라지푸트 왕조. 하미르데바 때 할지 왕조와 맞섬
  mapNote: 지도에는 1206년부터 1300년까지 란탐보르 둘레(바나스강·참발강 사이, 약 1.5만 km²)를 표시함. 1226년 일투트미시의 점령은 되돌려져 칠하지 않음
  endNote: 1301년 알라웃딘 할지가 란탐보르 성을 함락하고 하미르데바가 전사함
  features:
    - 도읍은 란탐보르 성
    - 하미르데바가 델리에서 도망친 몽골 장수들을 받아 줌
    - 차우한이라고도 부름
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Chahamanas of Ranastambhapura"]
    foundingNote: 프리트비라지 3세의 아들 고빈다라자가 란탐보르로 옮긴 1192년부터 봄

- id: yadava-dynasty
  level: polity
  names: { ko: 야다바 왕조, en: Seuna (Yadava) dynasty, native: सेउण यादव }
  from: 1187
  to: 1317
  color: "#20d0a0"
  summary: 데칸 서부를 다스린 힌두 왕조(세우나 왕조)로, 데바기리를 도읍으로 함. 싱가나 2세 때 가장 넓었고 1296년부터 델리에 공물을 바침
  mapNote: 지도에는 1206년부터 1316년까지 마하라슈트라 서·중부와 칸데시·베라르, 북 카르나타카를 표시함. 델리에 공물을 바친 기간도 야다바 땅으로 그림
  endNote: 1317년 무바라크 샤 할지가 하르팔데바를 죽이고 데바기리를 병합함
  features:
    - 도읍은 데바기리(뒤의 다울라타바드)
    - 마라티어 문학과 바크티 운동이 일어남
    - 1296년 알라웃딘 할지의 첫 데칸 원정에 굴복함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Seuna (Yadava) dynasty"]
    foundingNote: 빌라마 5세가 찰루키아에서 자립해 데바기리를 세운 1187년부터 봄

- id: hoysala-dynasty
  level: polity
  names: { ko: 호이살라 왕조, en: Hoysala Empire, native: ಹೊಯ್ಸಳ }
  from: 1187
  to: 1343
  color: "#6088e8"
  summary: 카르나타카 남부를 다스린 힌두 왕조로, 도라사무드라(할레비두)를 도읍으로 함. 1311년 말리크 카푸르의 약탈 뒤 델리에 공물을 바침
  mapNote: 지도에는 1206년부터 1342년까지 카르나타카 남부(마이소르·하산·시모가·방갈루루)를 표시하고, 타밀 쪽 땅은 그리지 않음
  endNote: 1343년 발랄라 3세가 마두라이 술탄국과 싸우다 전사한 뒤 비자야나가라가 땅을 이음
  features:
    - 도읍은 도라사무드라(할레비두)
    - 벨루르·할레비두의 정교한 석조 사원을 남김
    - 비라 발랄라 2세 때 독립 왕국이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Hoysala Empire"]
    foundingNote: 비라 발랄라 2세가 찰루키아 종주에서 벗어난 1187년부터 봄

- id: gujarat-sultanate
  level: polity
  names: { ko: 구자라트 술탄국, en: Gujarat Sultanate, native: سلطنت گجرات }
  from: 1398
  to: 1573
  color: "#f090d8"
  summary: 델리 술탄국의 구자라트 총독 자파르 칸(무자파르 샤 1세)이 자립해 세운 술탄국. 1411년 아마다바드를 세웠고 바하두르 샤 때 말와까지 넓힘
  mapNote: 지도에는 1398년부터 1572년까지 구자라트와 다만·디우를 표시하고 1531년부터 1536년까지 말와를 더함(디우는 1535년부터 포르투갈). 공식 즉위는 1407년이지만 1398년 티무르의 델리 약탈 뒤 총독이 실제로 홀로 다스렸으므로 그해부터 그림
  endNote: 1573년 아크바르가 구자라트를 정복함
  features:
    - 도읍은 아마다바드, 한때 참파네르
    - 1509년 디우 해전에서 맘루크와 함께 포르투갈에 짐
    - 아마다바드의 인도·이슬람 건축을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Gujarat Sultanate"]
    foundingNote: 티무르의 델리 약탈로 델리의 통제가 끊긴 1398년부터 봄

- id: khandesh-sultanate
  level: polity
  names: { ko: 칸데시 술탄국, en: Khandesh Sultanate, native: فاروقی سلطنت }
  from: 1382
  to: 1601
  color: "#8cc040"
  summary: 타프티강 골짜기 칸데시를 다스린 파루키 왕조의 술탄국으로, 1382년 말리크 라자가 세움. 구자라트·말와 사이에서 종주를 바꿔 가며 버팀
  mapNote: 지도에는 1382년부터 1600년까지 타프티 골짜기(잘가온·둘레·난두르바르 쪽, 약 2.9만 km²)를 표시하고, 부르한푸르 쪽은 그리지 않음
  endNote: 1601년 1월 아크바르가 아시르가르 성을 빼앗아 병합함
  features:
    - 도읍은 탈네르, 뒤에 부르한푸르
    - 난공불락으로 이름난 아시르가르 성을 가짐
    - 15세기에 구자라트 술탄국의 종주를 받음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khandesh Sultanate"]

- id: berar-sultanate
  level: polity
  names: { ko: 베라르 술탄국, en: Berar Sultanate, native: عماد شاہی }
  from: 1490
  to: 1574
  color: "#a098e8"
  summary: 바흐마니 술탄국의 총독 파트훌라 이마드 울 물크가 1490년 자립해 세운 데칸 북부의 술탄국(이마드 샤 왕조)
  mapNote: 지도에는 1490년부터 1573년까지 베라르(아마라바티·아콜라·엘리치푸르 쪽)를 표시함
  endNote: 1574년 아마드나가르 술탄국에 병합됨
  features:
    - 도읍은 엘리치푸르
    - 데칸 다섯 술탄국 가운데 가장 먼저 사라짐
    - 가윌가르·나르날라 산성을 가짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Berar Sultanate"]

- id: bidar-sultanate
  level: polity
  names: { ko: 비다르 술탄국, en: Bidar Sultanate, native: بیدر سلطنت }
  from: 1492
  to: 1619
  color: "#b03060"
  summary: 바흐마니 술탄국의 재상 카심 바리드가 실권을 쥐어 1492년부터 비다르 둘레를 다스린 데칸 술탄국(바리드 샤 왕조). 바흐마니 술탄이 떠난 뒤 왕호를 씀
  mapNote: 지도에는 1492년부터 1618년까지 비다르·우드기르·후남라바드 둘레(약 1.5만 km²)를 표시함
  endNote: 1619년 비자푸르 술탄국에 병합됨
  features:
    - 도읍은 비다르
    - 바흐마니 술탄을 꼭두각시로 두고 재상 가문이 다스림
    - 데칸 다섯 술탄국 가운데 가장 작음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Bidar Sultanate"]

# ── S3 서 끝 ──

# ── S3 동 ──
- id: bengal-sultanate
  level: polity
  names: { ko: 벵골 술탄국, en: Bengal Sultanate, native: সুলতানাত-ই-বাঙ্গালা }
  from: 1338
  to: 1592
  color: "#2f8a7a"
