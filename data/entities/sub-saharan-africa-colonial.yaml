  summary: 니제르강 삼각주와 기니만 기슭의 영국 보호령. 1884년 영국이 칼라바르와 삼각주의 해안 족장들과 보호 조약을 맺어 오일 리버스 보호령으로 세웠고, 1893년 니제르 코스트 보호령으로 이름을 바꾼 뒤 1897년 베닌 왕국을 정복함. 1900년 1월 1일 왕립 니제르 회사의 로코자 아래쪽 땅을 합쳐 남나이지리아 보호령이 되었고, 1906년 5월 1일 라고스 식민지를 더해 남나이지리아 식민지 및 보호령이 됨. 야자유 수출과 해안 항구가 살림을 받쳤고, 남는 세입으로 북쪽의 모자란 살림을 메우려 한 것이 1914년 남북을 합친 까닭이 됨
  mapNote: 지도에는 1885년부터 1913년까지 표시함. 1885~1896년에는 지금 나이지리아 동남부 해안 10개 주(칼라바르·니제르강 삼각주 쪽)만, 1897년부터 베닌 왕국 땅(에도주)을, 1906년부터 라고스 식민지 땅을 더해 지금 나이지리아 남부 17개 주 땅이 됨. 해안에서 먼 이그보 땅 등은 1900년대 초까지 명목상 다스림
  endNote: 1914년 1월 1일 북나이지리아 보호령과 합쳐 나이지리아 식민지 및 보호령의 남부 지방이 되며 끝남
  features:
    - 행정 중심은 칼라바르, 1906년부터 라고스
    - 1884년 오일 리버스 보호령으로 시작
    - 1906년 라고스 식민지와 합침
    - 야자유·야자씨 수출
    - 1912년부터 루가드가 북나이지리아와 함께 맡음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Southern Nigeria Protectorate", "위키백과 Niger Coast Protectorate", "위키백과 Colonial Nigeria"]
    foundingNote: 영국이 오일 리버스 보호령을 세운 1884년부터(1893년 니제르 코스트 보호령, 1900년 남나이지리아 보호령으로 이름이 바뀌었고, 1906년 라고스 식민지 합침은 글로)


