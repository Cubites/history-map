- id: german-kamerun
  level: polity
  names: { ko: 독일령 카메룬, en: Kamerun, native: Kamerun }
  from: 1884
  to: 1920
  color: "#b23440"
  summary: 기니만 안쪽 두알라에서 차드호까지 뻗은 독일 보호령. 1884년 독일이 두알라 둘레 족장들과 보호 조약을 맺어 세웠고, 내륙 원정과 농장 개발로 땅과 지배를 넓힘. 1894년 프랑스와 협정을 맺어 동쪽 경계를 정했고, 1901~1902년 아다마와 원정으로 북쪽 가루아·마루아와 차드호 쪽 디크와를 차지함. 1911년 모로코 위기를 매듭지은 독일·프랑스 협정으로 동쪽과 남쪽의 프랑스령 적도 아프리카 땅(노이카메룬)을 넘겨받아 대카메룬이 됨. 제1차 세계 대전 때 1914년 9월 두알라가 영국·프랑스군에 떨어졌고, 1916년 2월 북쪽 모라 요새가 항복하며 온 땅이 점령됨
  mapNote: 지도에는 1885년부터 1919년까지 표시함. 1885~1893년에는 지금 카메룬 서남부(두알라·부에아·야운데 쪽)만, 1894년부터 동부와 북부를 더함(1894~1901년 북부는 이름뿐인 지배였고 실제로는 아다마와 토후국이 다스림). 1902년부터 차드호 쪽 디크와와 나이지리아 동쪽 끝의 북카메룬 땅(지금 아다마와·타라바주 쪽은 1903년부터)을 더함. 1880~1890년대 해안에서 먼 내륙은 명목상 다스림. 1911년부터는 프랑스에게서 넘겨받은 노이카메룬을 더함. 1914~1916년 영국과 프랑스가 차지해 나누어 다스린 뒤에도 베르사유 조약이 발효하기 전까지는 따로 칠하지 않고 독일령 카메룬 색으로 그림. 1911년 프랑스에 넘긴 로곤강과 샤리강 사이의 좁은 땅(오리부리)은 지금 차드 땅이라 1910년에도 따로 칠하지 않고 우방기샤리 색으로 그림
  endNote: 1920년 1월 10일 베르사유 조약이 발효하며 독일이 권리를 잃고, 서쪽은 영국령 카메룬, 동쪽은 프랑스령 카메룬으로 나뉘어 끝남
  features:
