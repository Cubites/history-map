  summary: 잠베지강 북쪽을 영국 남아프리카 회사가 다스린 땅. 회사는 1890년 로흐너 양허와 1898년 롤리 양허로 로지 왕 레와니카에게서 이권을 얻었고, 조약과 이권으로 얻은 땅을 1899년 북서 로디지아, 1900년 북동 로디지아로 나눠 다스렸고, 1911년 둘을 합쳐 북로디지아로 삼아 리빙스턴을 도읍으로 둠. 제1차 세계 대전 때 북동쪽 국경에서 독일령 동아프리카군과 싸웠고, 독일군은 1918년 11월 25일 이곳에서 항복함. 1923년 9월 29일 회사와 영국 정부가 통치를 넘기기로 협정함
  endNote: 1924년 4월 1일 영국 정부가 직접 다스리는 보호령 북로디지아가 되며 회사 통치가 끝남
  mapNote: 지도에는 1899년부터 1923년까지 표시함. 1899년에는 로지 왕국 땅(바로체랜드)만, 1900년부터는 지금 잠비아 땅 전체로 그리고, 1923년까지 영국의 지배를 관계로 보임. 1911년 합치기 앞의 북서·북동 로디지아는 따로 나누지 않고 한 색으로 그림. 1924년부터 같은 땅은 북로디지아 색으로 그림
  features:
    - 도읍은 리빙스턴
    - 1899년 바로체랜드-북서 로디지아 추밀원령
    - 1900년 북동 로디지아 칙령
    - 1911년 북서·북동 로디지아를 합쳐 북로디지아
    - 1918년 11월 25일 독일군 항복
