# sub-saharan-africa colonial 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/colonial.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1910~1944: 남아프리카 연방부터 2차 대전 끝 앞까지 (F4, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-colonial' → 필터 단위 sub-saharan-africa).
# F4 뼈대(2026-11-12)가 1910~1944 안에 끝나는 새 식민지·보호령·술탄국·회사령 항목 14개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f4/COMMON.md 4절 표, 표 원천 f4/skel/entities.tsv).
#   색은 본국 색이 아니라 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라와 ΔE 43 넘게 골랐다(f4/skel/tools/df4.mjs, COMMON P4). 본국은 data/relations.yaml의 vassal_of·occupied_by(칸 머리 아래).
#   모두 level: polity(보호령·술탄국·회사령도 — F2·F3 식민지 꼴, 서아시아 kuwait 보호국 꼴). to는 끝난 해 = 칠한 마지막 해 + 1(독일령 넷 1920 — Q1·M-F4-6, 술탄국 둘 1927 — M-F4-7).
#   이름은 위키백과 한국어판 표제로 확인했다(f4/skel/ko-titles.txt·en-ko.txt — 표제가 없는 북·남나이지리아 보호령은 동아프리카 보호령 꼴, 와다이·마제르테인·호비오 술탄국은 다르푸르 술탄국 꼴,
#   회사령 둘은 동인도 회사령 인도 꼴, 독일 보호령 토고는 표제 '토골란드', 이탈리아령 소말리아는 표제 — f4/SKEL-NOTE.md 끝 공용 표기표).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f4/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(※ — 고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   앞 잇는 항목 53은 이 파일에 없다 — F3 항목 23은 data/entities/sub-saharan-africa-postwar.yaml, F2 항목 21은 sub-saharan-africa-decolonization.yaml, F1 항목 9는 sub-saharan-africa-modern.yaml
#   그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절). 서아시아 italian-libya·british-egypt·french-algeria와 유럽 블록은 고치지 않는다.

