# central-asia early-modern 나라 (시대 파일 scripts/geo/areas/central-asia/early-modern.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1500~1864: 칸국 시대
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-early-modern').
# 칸 나눔(C2 뼈대 2026-11-05, ca2/c2/COMMON.md 5절 '새 항목 표'): 구현 칸 A·W·EK·EX는 아래 네 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다.
#   from·to는 표의 값 — 끝·시작 해는 정의 칸이 사료로 한 번 확인한다(다르면 결과 노트 2절). 항목 to는 끝 해 포함, 지도는 칠하는 마지막 해까지. native는 정의 칸이 원어판 위키로 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features·basis.foundingNote도 그 칸이 더함, startEvents·endEvents는 사건 ca-04 몫이라 빈 목록 그대로).
#   다른 칸이 칠하기만 하는 땅(bukhara-khanate의 발흐·바다흐샨 = A, dzungar-khanate의 카자흐 꼬리 = EK)의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다.
# C1 항목(central-asia-modern.yaml — khiva-khanate·afghanistan = A, bukhara-emirate·kokand-khanate = W)과 늘린 나라(남아시아·서아시아 yaml = A, china.yaml qing = EX)는 이 파일에 두지 않고 그 파일 블록에서 고친다.

# ══ C2 A 항목 ══
- id: babur-kabul-kingdom
  level: polity
  names: { ko: 바부르의 카불 왕국, en: Kingdom of Kabul (Babur), native: کابل }
  from: 1504
  to: 1526
  color: "#5070b0"
  summary: 티무르 왕조의 후손 바부르가 1504년 카불을 차지해 세운 나라로, 1526년 파니파트 전투로 델리를 얻으며 무굴 제국이 됨
  mapNote: 지도에는 1504년부터 1525년까지 카불·가즈니 쪽을, 1522년부터 칸다하르를 더해 표시함. 하자라자트와 카피리스탄의 산지 부족 땅은 넣지 않고, 1511~1512년 사마르칸트 재점령과 동쪽 산지 원정은 칠하지 않음
  endNote: 1526년 4월 파니파트에서 로디 왕조를 꺾고 델리·아그라를 차지해 카불은 무굴 제국의 한 지방이 됨
  features:
    - 페르가나에서 쫓겨난 바부르가 1504년 10월 아르군 왕조의 무킴에게서 카불을 빼앗음
    - 1511~1512년 사파비 왕조의 도움으로 사마르칸트를 잠시 되찾았다가 우즈베크에 다시 잃음
    - 1522년 아르군 왕조에게서 칸다하르를 빼앗음
    - 1519년부터 인더스강 건너 펀자브로 원정을 거듭함
  startEvents: [babur-kabul-1504]
  endEvents: [babur-kabul-1504, first-panipat-1526]
  basis:
    type: primary_source
    refs: ["위키백과 Babur", "바부르나마"]
    foundingNote: 바부르가 카불을 차지한 1504년을 시작으로 봄(파디샤 칭호는 1507년)

- id: kandahar-principality
  level: polity
  names: { ko: 칸다하르 토후국, en: Principality of Kandahar, native: سرداری قندهار }
  from: 1818
  to: 1855
  color: "#d0a060"
  summary: 두라니 제국이 갈라진 뒤 바라크자이 형제들이 칸다하르에서 다스린 나라로, 칸다하르 사르다르라고도 함
  mapNote: 지도에는 1818년부터 1854년까지 칸다하르·자불·헬만드와 우루즈간 쪽을 표시함. 경계는 지금 아프가니스탄 주 경계에 기댄 어림이고, 공물을 바친 신드·발루치스탄과 시스탄 원정은 칠하지 않음. 1839~1842년 영국군 점령도 칠하지 않음
  endNote: 1855년 코한딜 칸이 죽은 뒤 후계 다툼을 틈타 카불의 도스트 무함마드 칸이 칸다하르를 차지함(1856년으로 적는 글도 있음)
  features:
    - 도읍은 칸다하르
    - 셰르딜 칸·푸르딜 칸·코한딜 칸 등 바라크자이 형제가 차례로 다스림
    - 형제가 땅을 서쪽(가름시르·자민다와르)·북쪽·동쪽(시비·피신)으로 나누어 맡음
  startEvents: [barakzai-1818]
  endEvents: [dost-mohammad-return-1842]
  basis:
    type: primary_source
    refs: ["위키백과 Principality of Qandahar", "위키백과 Emirate of Afghanistan"]
    foundingNote: 1818년 바라크자이 가문의 와지르 파테 칸이 죽임을 당한 뒤 그 형제들이 칸다하르를 차지한 해를 시작으로 봄

- id: herat-principality
  level: polity
  names: { ko: 헤라트 토후국, en: Principality of Herat, native: هرات }
  from: 1818
  to: 1863
  color: "#40b0a0"
  summary: 두라니 제국 사도자이 왕가의 마흐무드 샤와 아들 캄란 샤가 1818년부터 헤라트에서 이어 간 나라로, 1842년부터는 알리코자이 부족의 야르 무함마드 칸과 그 뒤 통치자들이 다스림
  mapNote: 지도에는 1818년부터 1862년까지 헤라트·바드기스·파라·고르와 시스탄(니므로즈)을 표시함. 시스탄은 공물을 바친 부족 땅이라 근거가 약하고, 경계는 지금 아프가니스탄 주 경계에 기댄 어림. 1856~1857년 카자르 왕조의 헤라트 점령은 되돌려져 칠하지 않음
  endNote: 1863년 5월 도스트 무함마드 칸의 군대가 헤라트를 차지해 카불의 아프가니스탄에 합쳐짐
  features:
    - 도읍은 헤라트
    - 1837~1838년 카자르 왕조의 포위를 버텨 냄
    - 1856년 카자르 왕조가 헤라트를 차지했다가 1857년 파리 조약으로 물러남
  startEvents: [barakzai-1818]
  endEvents: [dost-mohammad-return-1842]
  basis:
    type: primary_source
    refs: ["위키백과 Emirate of Herat", "파리 조약(1857)"]
    foundingNote: 두라니 제국의 왕위를 잃은 마흐무드 샤가 헤라트로 물러나 따로 다스리기 시작한 1818년을 시작으로 봄(1793년부터 헤라트를 따로 다스린 것으로 보는 글도 있음)

# ══ C2 W 항목 ══
- id: bukhara-khanate
  level: polity
  names: { ko: 부하라 칸국, en: Khanate of Bukhara, native: خانات بخارا }
  from: 1501
  to: 1785
  color: "#c08040"
  summary: 샤이반 왕조·잔 왕조의 우즈베크 칸국으로, 부하라를 도읍으로 트란스옥시아나를 다스림. 1500~1501년 무함마드 샤이바니가 티무르 왕조를 몰아내고 세웠고, 1599년 잔 왕조(아스트라한 왕조)로 이어진 뒤 1785년 망기트 왕조의 부하라 토후국이 됨
  endNote: 1747년부터 망기트 가문의 아탈릭(재상)이 실권을 쥐었고, 1785년 샤 무라드가 칸을 세우지 않고 에미르를 칭하면서 부하라 토후국으로 바뀜
  mapNote: 지도에는 1501년부터 1784년까지. 타슈켄트(1505~1598)·페르가나 분지(1505~1708)·동부 부하라(히사르·쿨롭·카라테긴·다르바즈와 샤흐리삽즈, 1505~1746)와 아프가니스탄 쪽 발흐·훌름·쿤두즈와 마이마나 쪽(1506~1736)·바다크샨(1584~1736)도 넣었고, 압둘라 칸 2세가 사파비에게서 빼앗은 헤라트·파라·시스탄 쪽은 1589~1597년 넣음. 아무다리야 강가의 차르주이·케르키 띠는 1762년부터. 1510~1511년 사파비·바부르, 1598~1601년 사파비, 1646~1647년 무굴의 발흐 점령은 되돌려져 칠하지 않음. 키질쿰 북쪽 사막·키르기스 산지·파미르는 비움. 경계는 지금 주 경계와 강·산줄기에 기댄 어림
  features:
    - 1500~1501년 무함마드 샤이바니가 부하라·사마르칸트를 차지해 세움
    - 압둘라 칸 2세(재위 1583~1598) 때 타슈켄트·페르가나·발흐·바다크샨까지 가장 넓었음
    - 1709년 무렵 페르가나 분지가 떨어져 나가 코칸트 칸국이 됨
    - 1740년 나디르 샤에게 굴복했다가 그가 죽은 1747년부터 망기트 가문이 실권을 잡음
  startEvents: [shaybani-transoxiana-1500, safavid-ismail-1501]
  endEvents: [manghit-bukhara-1747]
  basis:
    type: primary_source
    refs: ["위키백과 Khanate of Bukhara", "브리태니커 Bukhara"]
    foundingNote: 무함마드 샤이바니가 1500년 부하라와 사마르칸트를 차지했으나 사마르칸트는 그해 가을 바부르에게 다시 빼앗겼으므로, 바부르를 물리치고 되찾은 1501년을 시작으로 봄

# ══ C2 EK 항목 ══
- id: kazakh-khanate
  level: polity
  names: { ko: 카자흐 칸국, en: Kazakh Khanate, native: قازاق حاندىعى }
  from: 1465
  to: 1853
  color: "#40b8d8"
  summary: 15세기 중엽 자니베크와 케레이가 세운 카자흐 유목민의 칸국. 대·중·소 세 주즈로 나뉘어 카자흐 초원을 다스리다가 19세기에 러시아에 흡수됨
  endNote: 러시아가 1822년 중주즈, 1824년 소주즈의 칸 지위를 없앴고, 1837년부터 칸국을 되살리려 한 케네사리 카심울리의 봉기가 1847년 끝나며 칸국이 사라짐. 대주즈 땅은 1854년 베르니 요새를 세운 러시아가 차지함
  mapNote: 지도에는 1509년부터 1853년까지(1508년까지 세미레치예는 모굴리스탄 땅으로 그림). 1509년에는 세미레치예와 탈라스·추강 쪽만, 1511년부터 시르다리야강 유역 도시와 발하시호 북쪽 초원, 1700년부터 엠바강 서쪽 소주즈 땅까지 그림. 서카자흐스탄과 북쪽 요새선 등 러시아가 차지한 땅은 러시아 색, 1634~1758년 동쪽 끝(자이산·알라콜)은 준가르, 1810년부터 시르다리야강 쪽 띠는 코칸트로 그림. 경계는 엠바강·카라타우산맥 등에 기댄 어림
  features:
    - 1511~1518년 카심 칸 때 시르다리야강 유역 도시와 초원 대부분을 차지해 가장 넓어짐
    - 대·중·소 세 주즈로 나뉘어 저마다 칸과 술탄이 유목 부족을 이끎
    - 17세기 말 타우케 칸 때 투르키스탄이 칸국의 중심이 됨
    - 1723년 준가르의 큰 침입 뒤 1730년대부터 소주즈·중주즈가 러시아에 신속함
  startEvents: []
  endEvents: [kazakh-steppe-russia-1822, kenesary-1837, syr-darya-line-1847]
  basis:
    type: primary_source
    refs: ["위키백과 Kazakh Khanate", "위키백과 Kasym Khan", "위키백과 Kyzylorda"]
    foundingNote: 카자흐 사학이 꼽는 1465년, 자니베크와 케레이가 아부 알카이르 칸의 우즈베크 울루스에서 떨어져 나온 해를 시작으로 봄(러시아 사학은 1470년 무렵)

# ══ C2 EX 항목 ══
- id: dzungar-khanate
  level: polity
  names: { ko: 준가르 칸국, en: Dzungar Khanate, native: ᠵᠡᠭᠦᠨ ᠭᠠᠷ ᠤᠨ ᠬᠠᠭᠠᠨᠲᠣ ᠣᠯᠣᠰ }
  from: 1634
  to: 1758
  color: "#60a030"
  summary: 오이라트(서몽골) 준가르부가 세운 유목 제국. 1634년 에르데니 바투르 홍타이지가 톈산 북쪽 준가리아에 세웠고, 1678~1680년 갈단이 타림 분지와 투루판·하미를 손에 넣음. 1755~1758년 청에 무너짐
  endNote: 1745년 갈단 체렝이 죽은 뒤 후계 다툼이 이어지자 청이 1755년 이리를 쳤고, 아무르사나의 반란을 누른 1757~1758년 준가르 사람들이 학살과 천연두로 거의 사라지며 무너짐
  features:
    - 1634년 에르데니 바투르가 오이라트 부족들을 묶어 세우고 이리 골짜기를 중심으로 삼음
    - 1678~1680년 갈단이 야르칸드 칸국을 눌러 타림 분지를 속국으로 삼음
    - 1696년 자오모도 싸움에서 청 강희제에게 크게 짐
    - 1717년 티베트 라싸를 차지했다가 1720년 청군에 밀려남
    - 1723년 카자흐 초원을 쳐 카자흐 사람들이 남쪽으로 쫓겨 감
  mapNote: 지도에는 1634년부터 1758년까지. 1634년부터 톈산 북쪽(준가르 분지·이리·타르바가타이·알타이)과 카자흐스탄 동쪽 끝(자이산 호·알라콜 호 쪽)을, 1680년부터 타림 분지(코를라·율두스 포함, 롭노르 쪽 사막은 비움)·투루판·하미를 넣고, 1696년 청에 귀순한 하미는 뺌. 몽골 서부(호브드)는 청 쪽 지도에 따라 넣지 않음. 1717~1720년 티베트, 1723~1730년 카자흐 초원처럼 잠깐 차지한 땅은 넣지 않음. 경계는 톈산 능선과 지금의 지구 경계에 기댄 어림
  startEvents: [dzungar-founding-1634]
  endEvents: [qianlong-dzungar-1755, dzungar-succession-1747]
  basis:
    type: primary_source
    refs: ["위키백과 Dzungar Khanate"]
    foundingNote: 에르데니 바투르가 칸국을 세운 1634년을 시작으로 봄

- id: yarkand-khanate
  level: polity
  names: { ko: 야르칸드 칸국, en: Yarkent Khanate, native: یارکند سعیدیه خانلیغی }
  from: 1514
  to: 1705
  color: "#3a6ac0"
  summary: 차가타이 칸의 후손 사이드 칸이 1514년 타림 분지 서쪽에 세운 칸국. 야르칸드를 도읍으로 카슈가르·호탄·악수를 다스렸고, 1570년 투루판까지 아우름. 1680년부터 준가르에 눌림
  endNote: 1678~1680년 준가르의 갈단이 쳐들어와 칸을 몰아내고 아팍 호자를 세웠으며, 그 뒤 준가르를 섬기는 칸들이 이어지다 1705년 끊김
  features:
    - 1514년 사이드 칸이 두글라트부의 미르자 아부 바크르를 몰아내고 세움
    - 도읍은 야르칸드, 알티샤르(여섯 도시)를 중심으로 다스림
    - 1570년 호탄 총독 압두라힘이 투루판을 쳐 투루판 칸국을 아우름
    - 17세기에는 낙시반디 교단 호자들의 두 파 다툼으로 흔들림
  mapNote: 지도에는 1514년부터 1679년까지(1680년부터 준가르). 카슈가르·야르칸드·호탄·악수·우치투루판·쿠차와 코를라·부구르(룬타이)·율두스 초원을 넣고, 1570년부터 투루판 분지와 하미를 넣음. 콘치강 아래쪽 위리와 롭노르·체르첸·차클리크 쪽 사막은 비움. 경계는 지금의 지구 경계와 타클라마칸 사막 안을 가른 어림
  startEvents: [moghul-yarkand-1500]
  endEvents: [galdan-tarim-1680]
  basis:
    type: primary_source
    refs: ["위키백과 Yarkent Khanate"]
    foundingNote: 사이드 칸이 카슈가르·야르칸드·호탄을 차지한 1514년을 시작으로 봄

- id: turfan-khanate
  level: polity
  names: { ko: 투루판 칸국, en: Turpan Khanate, native: تۇرپان خانلىقى }
  from: 1487
  to: 1570
  color: "#e0b050"
  summary: 차가타이 칸의 후손 아흐마드 알라크가 1487년 형 마흐무드에게서 갈라져 투루판 분지에 세운 칸국. 동모굴리스탄이라고도 함. 1570년 야르칸드 칸국에 아울러짐
  endNote: 1570년 야르칸드 칸국의 호탄 총독 압두라힘이 쳐들어와 무함마드 칸을 사로잡으면서 야르칸드의 지배 아래 들어감
  features:
    - 1487년 아흐마드 알라크가 형 마흐무드 칸에게서 갈라져 투루판에 자리 잡음
    - 아들 만수르 칸이 1513년 카라델(하미 왕국)을 무너뜨리고 하미를 차지함
    - 하미와 간쑤 쪽 무역로를 두고 명과 여러 차례 싸움
    - 1570년 야르칸드 칸국의 침입으로 홀로서기를 잃음
  mapNote: 지도에는 1487년부터 1569년까지. 투루판 분지와 카라샤르(옌치) 분지를 넣고, 1487~1513년에는 코를라·부구르(룬타이)·율두스 초원을, 1513년부터 하미를 넣음. 경계는 톈산 능선과 쿠루크타그산 기슭에 기댄 어림
  startEvents: []
  endEvents: [moghul-yarkand-1500]
  basis:
    type: primary_source
    refs: ["위키백과 Turpan Khanate"]
    foundingNote: 아흐마드 알라크가 투루판에 자리 잡은 1487년을 시작으로 봄
