# 글은 SC-W-M2 칸이 채움 — 가칭(위키 ko 표제 '마푸체족'·'아라우카니아주'). 1641 킬린 회담(0단계 기본값 18), 1883 아라우카니아 점령 끝(G2-12 말레코 1870)
- id: mapuche-araucania
  level: polity
  names: { ko: 마푸체 아라우카니아, en: Mapuche Araucanía, native: Wallmapu }
  from: 1641
  to: 1883
  color: "#4594c9"
  summary: 비오비오강 남쪽에서 마푸체가 스스로 다스린 땅. 1641년 1월 6일 킬린 회담에서 스페인이 비오비오강을 경계로 마푸체의 자유를 인정했고, 1643년 펠리페 4세가 이를 비준함. 이 인정은 스페인과의 동맹을 전제로 한 것이라 온전한 국가 주권으로 보기는 어렵고, 여러 공동체의 수장이 회담을 열어 스페인·칠레와 관계를 맺는 느슨한 짜임이었음. 칠레는 1861년부터 남쪽으로 요새를 넓혀 1869년 말레코강까지 나아갔고, 1881년 카우틴강에 이른 뒤 1883년 1월 1일 비야리카를 다시 세우며 아라우카니아 점령을 마침
  mapNote: 지도에는 1776년부터 1882년까지 표시함. 1776년부터 1869년까지는 비오비오강 남쪽부터 지금 아라우카니아주까지를 그리고, 1870년부터 1882년까지는 말레코강 남쪽만 그림. 1883년부터는 칠레 색으로 그림. 발디비아 둘레는 스페인·칠레 요새가 지킨 땅이라 칠레 쪽 색으로 그리고, 안데스 동쪽 지금 아르헨티나 쪽 원주민 땅은 이 색으로 칠하지 않음
  endNote: 1883년 1월 1일 칠레군이 비야리카를 다시 세워 아라우카니아 점령을 마치며 끝남
  features:
    - 비오비오강을 북쪽 경계로 삼음
    - 1641년 킬린 회담에서 스페인이 자유를 인정함
    - 스페인·칠레와 회담을 열어 관계를 맺음
    - 1861~1883년 칠레의 아라우카니아 점령으로 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["킬린 회담(1641)", "위키백과 Parlamento de Quilín (1641)", "위키백과 Occupation of Araucanía"]
    foundingNote: 킬린 회담에서 스페인이 비오비오강 남쪽 마푸체의 자유를 인정한 1641년부터
# 글은 SC-W-M2 칸이 채움 — 가칭(위키 ko 표제 없음 — 지금 '포클랜드 제도'). 1767 프랑스에게서 넘겨받음, 1811 철수
- id: spanish-falkland-islands
  level: polity
  names: { ko: 스페인령 포클랜드 제도, en: Spanish Falkland Islands, native: Islas Malvinas }
  from: 1767
  to: 1811
  color: "#657bd2"
  summary: 스페인이 남대서양 포클랜드 제도에 둔 식민지. 1767년 프랑스에게서 동쪽 섬의 정착지를 넘겨받아 푸에르토솔레다드라 부르고 부에노스아이레스 쪽에서 다스림. 서쪽 섬의 영국 에그몬트 항 기지를 두고 1770년 위기를 겪은 뒤 이듬해 기지를 영국에 돌려주었고, 영국은 1770년대에 기지를 떠나며 표지만 남김. 1811년 남아메리카 독립 전쟁 속에 수비대를 몬테비데오로 거두며 섬을 떠남
  mapNote: 지도에는 1776년부터 1810년까지 포클랜드 제도 전체를 표시함. 1811년 스페인이 떠난 뒤 1832년까지는 주인이 굳지 않아 비움
  endNote: 1811년 스페인 수비대가 몬테비데오로 물러나며 끝남
  features:
