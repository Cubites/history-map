# 글은 CAM-M2 칸이 채움 — 가칭(위키 ko 표제 없음). from 1609(조사 노트 — 기억, M3가 닫음), 1821 독립 뒤 1822 멕시코 제1제국 합류
- id: guatemala-captaincy
  level: polity
  names: { ko: 과테말라 총사령부, en: Captaincy General of Guatemala, native: Capitanía General de Guatemala }
  from: 1609
  to: 1822
  color: "#65d2d2"
  summary: 스페인이 중앙아메리카에 둔 식민 단위로, 과테말라에서 다스림. 이름으로는 누에바에스파냐 부왕령에 딸렸으나 국왕이 보낸 총사령관이 지금 과테말라·엘살바도르·온두라스·니카라과·코스타리카와 치아파스를 따로 다스렸음. 1773년 지진으로 옛 수도가 무너져 1776년 새 수도 과테말라시티로 옮김. 카리브해 쪽 모스키토 해안은 미스키토족 왕과 영국인이 차지해 지배가 닿지 않았고, 벨리즈강 둘레에는 영국인 벌목 정착지가 있었음. 1821년 9월 15일 독립을 선언하고 1822년 1월 멕시코 제1제국에 합류하며 끝남
  mapNote: 지도에는 1776년부터 1821년까지 표시함. 지금 과테말라·엘살바도르·온두라스·니카라과·코스타리카와 멕시코 치아파스를 그리고, 1776년부터 1797년까지는 벨리즈 땅도 이 색으로 그림. 카리브해 쪽 모스키토 해안은 모스키토 왕국 색으로 그림
  endNote: 1821년 9월 15일 독립을 선언하고 1822년 1월 멕시코 제1제국에 합류하며 끝남
  features:
    - 행정 중심은 과테말라시티(1776년 새 수도로 옮김)
    - 다섯 주와 치아파스를 다스림
    - 모스키토 해안과 벨리즈 정착지에는 지배가 닿지 않음
    - 1821년 9월 15일 독립 선언
