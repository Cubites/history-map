  color: "#d265d2"
  summary: 스페인이 쿠바섬에 둔 식민 단위로, 아바나에서 다스림. 아바나 총독이 총사령관을 겸해 섬과 둘레 섬들을 다스렸고, 18세기 끝무렵부터 사탕수수 농장과 노예 노동으로 크게 자람. 스페인이 대륙 식민지를 잃은 뒤에도 푸에르토리코와 함께 남은 마지막 큰 식민지였음. 1868년부터 1878년까지 10년 전쟁을 치렀고, 1886년 노예제를 없앰. 1895년 호세 마르티 등이 쿠바 독립 전쟁을 일으켰고, 1898년 미국-스페인 전쟁 끝에 12월 10일 파리 조약으로 스페인이 쿠바를 내놓음
  mapNote: 지도에는 1776년부터 1898년까지 쿠바섬과 후벤투드섬 등 지금 쿠바 땅을 표시함. 미국 군정이 시작된 1899년은 주권자가 없어 비움
  endNote: 1898년 12월 10일 파리 조약으로 스페인이 쿠바를 내놓고 1899년 1월 1일 미국 군정에 넘기며 끝남
  features:
