  level: polity
  names: { ko: 밴쿠버섬 식민지, en: Colony of Vancouver Island, native: Colony of Vancouver Island }
  from: 1849
  to: 1866
  color: "#d27b65"
  summary: 밴쿠버섬과 둘레 섬을 다스린 영국의 식민지. 1846년 오리건 조약으로 북위 49° 북쪽과 밴쿠버섬 전체가 영국 땅으로 정해지자, 영국은 1849년 1월 13일 섬을 허드슨 베이 회사에 맡겨 식민지로 세움. 중심지는 회사가 1843년 세운 빅토리아 요새였고, 회사 관리 제임스 더글러스가 1851년부터 총독을 맡아 1856년 이 지역 첫 의회를 열었음. 섬의 원주민과는 1850년대 초 몇 곳에서만 땅 조약을 맺었고 나머지 땅은 원주민이 계속 차지함. 1858년 본토 금 열풍으로 빅토리아가 크게 붐볐으나 금 열풍이 식은 뒤 재정이 기울었음
  mapNote: 지도에는 1849년부터 1865년까지 밴쿠버섬과 그 동쪽 걸프 제도를 표시하고, 영국의 지배를 관계로 보임
  endNote: 1866년 본토의 브리티시컬럼비아 식민지와 합쳐지며 끝남
