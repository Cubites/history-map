- id: venezuela-captaincy-general
  level: polity
  names: { ko: 베네수엘라 총사령부, en: Captaincy General of Venezuela, native: Capitanía General de Venezuela }
  from: 1777
  to: 1819
  color: "#a63f5e"
  summary: 카라카스에서 다스린 스페인의 식민 단위. 1777년 9월 8일 카를로스 3세의 왕령으로 마라카이보·쿠마나·과야나·트리니다드·마르가리타 주를 카라카스 총사령관 아래 묶어 누에바그라나다 부왕령에서 떼어 냄. 1797년 트리니다드섬을 영국에 빼앗김. 1810년 4월 19일 카라카스에 자치 정부가 들어섰고 1811년 7월 5일 독립을 선언했으나, 두 차례 세운 공화국이 모두 스페인군에 무너짐. 1819년 그란콜롬비아에 들어갔고, 1821년 카라보보 전투와 1823년 마라카이보 항복으로 스페인 세력이 끝남. 오리노코강 남쪽 과야나 밀림은 원주민이 다스렸고 총사령부는 선교 마을 몇 곳만 둠
  mapNote: 지도에는 1777년부터 1818년까지 지금 베네수엘라 땅으로 표시함. 1810년부터 1818년까지 자치 정부·공화국과 스페인군이 번갈아 다스린 시기도 같은 색으로 그림. 오리노코강 남쪽 과야나 밀림은 선교 마을 몇 곳만 둔 명목 지배. 트리니다드섬은 따로 칠하지 않음
  endNote: 1819년 앙고스투라 의회가 그란콜롬비아를 선포하며 그 땅에 들어감(스페인군은 1823년까지 남음)
  features:
