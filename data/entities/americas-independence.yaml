  mapNote: 지도에는 1841년부터 1866년까지 지금 온타리오·퀘벡에서 허드슨만으로 흐르지 않는 남쪽 땅을 칠함
  endNote: 1867년 7월 1일 캐나다 연방에 들며 온타리오와 퀘벡으로 나뉘어 없어짐
  features:
