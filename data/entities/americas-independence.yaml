  color: "#4b6b9b"
  summary: 멕시코시티에서 북아메리카 남부와 서부를 다스린 스페인의 식민 단위. 1535년 첫 부왕이 부임해 아즈텍 제국 자리와 그 북쪽 땅을 다스렸고, 1776년 북쪽 변경 주들을 내륙 주 총사령부로 따로 묶음. 1810년 미겔 이달고 신부의 봉기로 독립 전쟁이 시작되었고, 1821년 9월 멕시코 제국이 독립을 선언하며 끝남. 1819년 애덤스-오니스 조약으로 미국과의 경계를 북위 42°까지 정했으나, 그레이트베이슨과 콜로라도고원·남부 대평원은 코만치족·아파치족·유트인 같은 원주민이 실제로 다스렸음
  mapNote: 지도에는 1776년부터 1820년까지 지금 멕시코(유카탄반도·치아파스 빼고)와 텍사스·뉴멕시코·애리조나 남부·캘리포니아로 표시함. 1819년 애덤스-오니스 조약 뒤로는 조약선 안의 그레이트베이슨·애리조나 북부와 콜로라도·와이오밍·캔자스·오클라호마의 서남쪽 땅도 더해 그렸으나 명목상의 땅이고, 실제 스페인 지배는 산타페·샌안토니오·투손의 요새와 캘리포니아 해안 선교 마을에 그침. 1535년부터 1775년까지의 모습은 그리지 않음
  endNote: 1821년 9월 28일 멕시코 제국의 독립 선언으로 없어짐
