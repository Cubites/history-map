- id: gran-colombia
  level: polity
  names: { ko: 그란콜롬비아, en: Gran Colombia, native: República de Colombia }
  from: 1819
  to: 1831
  color: "#849fdb"
  summary: 누에바그라나다·베네수엘라·키토를 묶은 남아메리카 북부의 공화국. 1819년 12월 17일 앙고스투라에 모인 의회가 기본법으로 콜롬비아 공화국을 선포했고, 1821년 쿠쿠타에 모인 의회가 헌법을 정함. 시몬 볼리바르가 대통령을 맡아 1821년 카라보보 전투로 베네수엘라를, 1822년 피친차 전투로 키토를 되찾았고, 1821년 11월 파나마가 합류함. 1828~1829년에는 마이나스와 과야킬을 두고 페루와 싸움. 연방파와 중앙 집권파의 다툼 속에 1830년 베네수엘라와 에콰도르가 갈라져 나갔고, 1831년 공식으로 해체되어 누에바그라나다 공화국이 남음
  mapNote: 지도에는 1819년부터 1830년까지 표시함. 1819년부터 1829년까지는 지금 베네수엘라·콜롬비아·파나마·에콰도르 땅을 그림(파나마는 1821년, 키토는 1822년까지 스페인군이 남았으나 같은 색). 1830년에는 베네수엘라와 에콰도르가 갈라진 뒤 지금 콜롬비아·파나마 땅만 그리고, 페루와 다투던 푸투마요강–카케타강 사이 땅은 비움. 페루 쪽 마이나스와 영국령 기아나 쪽 에세키보처럼 청구만 한 땅은 칠하지 않음
  endNote: 1831년 공식으로 해체되어 누에바그라나다 공화국·베네수엘라·에콰도르로 나뉨
  features:
    - 수도는 보고타
    - 1819년 앙고스투라 의회가 선포, 1821년 쿠쿠타 헌법
    - 시몬 볼리바르가 대통령을 맡음
    - 1828~1829년 페루와 싸움
    - 1830년 베네수엘라·에콰도르가 갈라져 나감
