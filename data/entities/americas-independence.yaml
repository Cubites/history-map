# 글은 AND-N-M2 칸이 채움 — 위키 ko 표제. 1542 설치, 끝 1825(알토페루 — G2-15), 마이나스 1802~(Q3)·키호스 1802~1818(창구 ③ Q-R3)
- id: peru-viceroyalty
  level: polity
  names: { ko: 페루 부왕령, en: Viceroyalty of Peru, native: Virreinato del Perú }
  from: 1542
  to: 1825
  color: "#c86fbf"
  summary: 리마에서 다스린 스페인의 부왕령. 1542년 11월 20일 카를로스 1세의 신법으로 세워 한때 스페인령 남아메리카 거의 전부를 다스렸으나, 1717년 누에바그라나다 부왕령, 1776년 리오데라플라타 부왕령이 갈라지며 줄어듦. 1780~1783년 투팍 아마루 2세의 봉기가 안데스 전체로 퍼졌음. 1789년 칠레가 총사령부로 떨어져 나갔고, 1802년 칙령으로 마이나스를 받았으며, 1810년 알토페루를 다시 붙여 남아메리카 왕당파의 근거지가 됨. 1821년 7월 28일 호세 데 산마르틴이 리마에서 페루 독립을 선언했고, 1824년 12월 9일 아야쿠초 전투에서 진 뒤 항복함. 알토페루의 왕당파는 1825년 4월까지 버팀. 아마존 쪽 밀림은 원주민이 다스렸고 부왕령은 선교 마을 몇 곳만 둠
  mapNote: 지도에는 1776년부터 1824년까지 표시함. 1820년까지는 지금 페루 땅을 그리되 볼리비아와 다투던 마드레데디오스·푸루스 유역은 비우고, 1802년부터 마라뇬강 북쪽 마이나스를, 1802년부터 1818년까지 지금 에콰도르 나포강 유역의 키호스를 더함. 1776년부터 1788년까지 지금 칠레 중부·발디비아·남위 24° 남쪽 아타카마(1789년 칠레 총사령부로 떨어짐), 1776년부터 1820년까지 타라파카·아리카도 그림. 1810년부터 1824년까지는 알토페루(지금 볼리비아와 아크리)와 남위 24° 북쪽 아타카마 해안, 아타카마 고원(지금 아르헨티나 북서쪽 푸나데아타카마)도 그림. 1821년부터 1824년까지는 독립을 선언한 페루 쪽을 빼고 알토페루 쪽만 남김. 아마존 쪽 밀림은 선교 마을 몇 곳만 둔 명목 지배
  endNote: 1824년 12월 아야쿠초 전투에서 져 항복했고, 1825년 4월 알토페루의 마지막 왕당파가 무너지며 끝남
  features:
    - 행정 중심은 리마
    - 1542년 카를로스 1세의 신법으로 세움
    - 1780~1783년 투팍 아마루 2세의 봉기
    - 1821년 호세 데 산마르틴의 페루 독립 선언
    - 1824년 아야쿠초 전투로 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Viceroyalty of Peru", "위키백과(스페인어) Comandancia general de Maynas"]
    foundingNote: 카를로스 1세가 신법으로 부왕령을 세운 1542년부터

