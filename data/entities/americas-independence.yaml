  summary: 러시아-아메리카 회사가 다스린 알래스카와 알류샨 열도의 러시아 식민지. 1799년 파벨 1세의 헌장으로 회사가 북위 55° 북쪽 아메리카 해안과 알류샨 열도의 독점권을 얻었고, 1804년 틀링깃족에게서 싯카를 되찾아 노보아르항겔스크라 이름 짓고 중심지로 삼음. 1824년 미국, 1825년 영국과 맺은 협약으로 남쪽 끝 북위 54°40′과 동쪽 경계 서경 141°가 정해짐. 회사의 실제 지배는 해안의 교역소와 요새 몇 곳에 그쳤고, 내륙과 남동부 해안 대부분은 알류트족·틀링깃족·유피크족 등 원주민이 다스림. 크림 전쟁 뒤 지키기 어렵다고 본 러시아는 1867년 알래스카를 미국에 720만 달러에 팔았음
  mapNote: 지도에는 1799년부터 1866년까지 표시함. 1799년부터 1824년까지는 회사 헌장이 가리킨 북위 55° 북쪽의 해안 지대와 알류샨·코디액·프리빌로프 등 섬을, 1825년부터는 협약으로 정해진 서경 141° 서쪽 전체를 명목으로 칠함(실제 지배는 싯카·코디액·케나이·세인트마이클 등 해안 교역소와 요새 몇 곳). 러시아 제국의 지배를 관계로 보임
