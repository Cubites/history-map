    refs: ["위키백과 Province of Canada"]
    foundingNote: 연합법이 선포된 1841년 2월 10일부터

# ══ M2 SC-W-M2 항목 (칠레·마푸체·포클랜드) ══
# 글은 SC-W-M2 칸이 채움 — 가칭(위키 ko 표제 없음). 1789 페루 부왕령에서 사실상 떨어짐(G2-16)
- id: chile-captaincy-general
  level: polity
  names: { ko: 칠레 총사령부, en: Captaincy General of Chile, native: Capitanía General de Chile }
  from: 1789
  to: 1818
  color: "#3fa687"
  summary: 스페인이 칠레에 둔 식민 단위로, 산티아고에서 다스림. 18세기 말 부르봉 개혁으로 페루 부왕령에서 사실상 떨어져 국왕이 보낸 사령관이 군사와 행정을 함께 맡았음. 비오비오강 남쪽은 마푸체가 다스려 실제 지배는 그 북쪽 정착지와 발디비아·칠로에섬 요새에 그침. 1810년 9월 18일 첫 정부 위원회가 섰으나 스페인 왕 이름으로 다스렸고, 1814년 10월 랑카과 싸움 뒤 스페인군이 다시 차지함. 1817년 차카부코 싸움에서 산마르틴과 오히긴스가 이긴 뒤 1818년 2월 12일 독립 선언으로 끝남
  mapNote: 지도에는 1789년부터 1817년까지 표시함. 그 앞 1776년부터 1788년까지는 페루 부왕령 색으로 그림. 비오비오강 북쪽 정착지와 발디비아·로스라고스·칠로에섬, 남위 24° 남쪽 아타카마 사막을 그리고, 비오비오강 남쪽 마푸체 땅과 아이센·마가야네스는 비움. 1810년부터 자치 정부도 스페인 왕 이름으로 다스린 시기라 같은 색으로 그림
  endNote: 1818년 2월 12일 오히긴스가 칠레의 독립을 선언해 끝남
  features:
    - 행정 중심은 산티아고
    - 18세기 말 페루 부왕령에서 사실상 떨어짐
    - 비오비오강을 사이에 두고 남쪽 마푸체 땅과 맞섬
    - 1810년 첫 정부 위원회, 1814년 스페인군이 다시 차지함
    - 1818년 독립 선언으로 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Captaincy General of Chile", "칠레 독립 선언(1818)"]
