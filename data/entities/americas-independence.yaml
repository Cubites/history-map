# 글은 CAM-M2 칸이 채움 — 위키 ko 표제(가칭 '중앙아메리카 연방'·'중앙아메리카 연방 공화국'이 넘겨줌 — 사전 avoid). 1823-07-01 독립, 1839 해체(G2-25)
- id: central-american-federation
  level: polity
  names: { ko: 중앙아메리카 연방공화국, en: Federal Republic of Central America, native: República Federal de Centroamérica }
  from: 1823
  to: 1839
  color: "#493fa6"
  summary: 옛 과테말라 총사령부의 다섯 주가 모여 세운 연방 공화국. 1823년 7월 1일 멕시코 제1제국에서 떨어져 나와 독립을 선언했고, 치아파스는 멕시코에 남음. 1824년 11월 22일 헌법을 정했으나 자유파와 보수파의 내전이 이어졌고, 1834년 수도를 과테말라시티에서 산살바도르로 옮김. 1838년 5월 의회가 각 주가 스스로 정부를 세울 수 있다고 정하자 니카라과·온두라스·코스타리카가 떠났고, 1839년 4월 라파엘 카레라가 이끄는 과테말라가 연방을 끝냄. 1838년부터 1840년까지 과테말라 서부에 로스알토스주가 따로 섰음
