  level: polity
  names: { ko: 퀘벡 주, en: Province of Quebec, native: Province of Quebec }
  from: 1763
  to: 1791
  color: "#65d265"
  summary: 1763년 영국이 세운 세인트로렌스강 둘레 식민지. 7년 전쟁 뒤 1763년 파리 조약으로 프랑스에게서 받은 누벨프랑스의 캐나다 땅에 세웠고, 1774년 퀘벡 법으로 프랑스 민법과 가톨릭 신앙을 인정하며 땅을 오대호 남쪽 오하이오강과 미시시피강 사이까지 넓혔음. 1775년 미국 대륙군이 몬트리올을 차지하고 퀘벡을 쳤으나 이듬해 물러났음. 1783년 파리 조약으로 오대호 남쪽 땅을 미국에 넘겼고, 미국에서 옮겨 온 왕당파가 늘자 1791년 헌법법으로 어퍼캐나다와 로어캐나다로 나뉨. 오대호 남쪽과 북쪽 내륙은 실제로 원주민이 다스렸음
  mapNote: 지도에는 1776년부터 1790년까지 지금 퀘벡·온타리오에서 허드슨만으로 흐르지 않는 남쪽 땅을 칠하고, 1776년부터 1782년까지는 퀘벡 법이 넣은 오대호 남쪽 오하이오강·미시시피강 사이 땅도 명목상 이 식민지 땅으로 함께 그림(실제 지배는 디트로이트 같은 요새 몇 곳). 1774년 퀘벡 법이 넣은 래브라도도 1776년부터 1790년까지 함께 그림(내륙은 명목상의 땅이고, 실제는 해안 어장과 교역소 몇 곳)
