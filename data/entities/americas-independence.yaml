# americas independence 나라 (시대 파일 scripts/geo/areas/americas/independence.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 아메리카 독립·확장 시대(1776~1899) (M2 — docs/americas/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'americas-independence' → 필터 단위 americas).
# M2 뼈대(2026-11-16)가 1776~1899에 칠하는 새 항목 34개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 m2/COMMON.md 4절 표, 표 원천 m2/skel/entities.tsv).
#   색은 자기 색 — 뼈대가 같은 해 맞닿는 이웃·좁은 바다 건너·식민 단위의 본국(spain·uk·france·portugal·dutch-republic·batavian-republic)·usa·유럽 russia·M1 항목과 ΔE 26 넘게,
#   앞뒤로 이어지는 단위끼리도 서로 다르게 골랐다(m2/skel/tools/dm2.mjs — 최소 36.9).
#   모두 level: polity(M1 british-guiana 꼴 — 스키마는 polity·region뿐). to는 끝난 해 = 칠한 마지막 해 + 1(미포함). from은 성립 해(1776 앞이면 그 해 그대로 — 지도는 1776부터, M3가 같은 id로 앞을 이음).
#   이름은 위키백과 한국어판 표제로 확인했다(m2/skel/ko-titles.txt·ko-titles2.txt — 표제가 없거나 다른 가칭은 블록 머리 주석).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — m2/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 칸이 사료로 고칠 수 있다(P7 — 고치면 결과 노트 2절에 한 줄). id·색·이름·level은 고치지 않는다.
#   앞 잇는 M1 항목 29는 data/entities/americas-modern.yaml, 유럽 russia는 data/entities/europe.yaml 그 자리 블록(파일 소유표 — m2/COMMON.md 5절).

# ══ M2 FL-M2 항목 (플로리다·루이지애나) ══
# 글은 FL-M2 칸이 채움 — 가칭(위키 ko 표제 없음 — '루이지애나 준주'는 1805~ 미국 단위). 1762 퐁텐블로 조약 땅 전체(M-M2-2), 1800~1802 프랑스 명목은 관계(G2-6)
- id: spanish-louisiana
  level: polity
  names: { ko: 스페인령 루이지애나, en: Spanish Louisiana, native: Luisiana }
  from: 1762
  to: 1803
  color: "#7f34b2"
  summary: 미시시피강 서쪽 루이지애나를 다스린 스페인 식민 단위. 1762년 11월 퐁텐블로 비밀 조약으로 프랑스가 뉴올리언스와 미시시피강 서쪽 루이지애나 전체를 스페인에 넘겼고, 뉴올리언스에 총독을 두어 다스림. 1800년 산일데폰소 조약으로 프랑스에 돌려주기로 했으나 스페인 관리가 1803년 11월까지 행정을 이었고, 그해 12월 미국이 루이지애나 매입으로 넘겨받음. 대평원과 미주리강 유역은 오세이지·코만치·수족 등 원주민이 실제로 다스렸고, 스페인은 강가의 요새·교역소만 지켰음
  mapNote: 지도에는 1776년부터 1802년까지 1762년 조약이 넘긴 루이지애나 전체(지금 루이지애나주 미시시피강 서쪽과 뉴올리언스 둘레, 아칸소·미주리와 대평원, 지금 콜로라도 동부·와이오밍·몬태나의 로키산맥 동쪽 사면과 지금 앨버타·서스캐처원 남쪽 끝 밀크강 물길까지)로 표시함. 대평원은 명목상의 땅이고, 실제 스페인 지배는 미시시피강 기슭과 뉴올리언스·세인트루이스, 몇몇 요새에 그침. 1800년부터 1802년까지는 프랑스에 돌려주기로 한 뒤에도 스페인이 다스린 모습. 1803년부터는 미국 땅으로 이어짐
  endNote: 1803년 11월 30일 프랑스를 거쳐 12월 20일 미국에 넘어가 없어짐(북쪽 루이지애나는 1804년 3월에 넘김)
  features:
    - 행정 중심은 뉴올리언스, 북쪽 루이지애나 중심은 세인트루이스
    - 1762년 퐁텐블로 조약으로 프랑스에게서 넘겨받음
    - 1779년 갈베스 총독이 영국령 서플로리다를 공격함
    - 1800년 산일데폰소 조약으로 프랑스에 돌려주기로 함
    - 1803년 루이지애나 매입으로 미국 땅이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Spanish Louisiana", "위키백과 Louisiana Purchase"]
    foundingNote: 1762년 11월 퐁텐블로 조약으로 프랑스가 루이지애나를 스페인에 넘긴 때부터
# 글은 FL-M2 칸이 채움 — 위키 ko 표제. from 1513(앞 시기 1513~1763은 M3), 1783 파리 조약으로 되찾음(G2-5 플로리다 1821·모빌 1813)
- id: spanish-florida
  level: polity
  names: { ko: 스페인령 플로리다, en: Spanish Florida, native: La Florida }
  from: 1513
  to: 1821
  color: "#bd515c"
  summary: 플로리다반도와 멕시코만 북쪽 기슭의 스페인 식민 단위. 1513년 폰세 데 레온이 이름을 붙인 뒤 세인트오거스틴을 중심으로 다스렸고, 1763년 영국에 넘겼다가 미국 독립 전쟁 중 서플로리다를 되찾아 1783년 파리 조약으로 동·서 플로리다를 모두 돌려받음. 1795년 핀크니 조약으로 북 경계를 북위 31°로 물렸고, 1810년 배턴루지 둘레와 1813년 모빌 둘레를 미국에 잃음. 내륙은 세미놀·크리크 사람들이 다스렸음. 1819년 애덤스-오니스 조약으로 남은 땅을 미국에 넘김
  mapNote: 지도에는 1783년부터 1820년까지 동플로리다(지금 플로리다반도)와 서플로리다(멕시코만 북쪽 기슭)로 표시함. 1783년부터 1795년까지 북위 31°와 32°28′ 사이 땅은 미국과 다투던 곳이라 비워 둠. 서쪽 끝 루이지애나 플로리다 교구는 1809년까지, 미시시피·앨라배마 기슭의 모빌 둘레는 1812년까지 그림. 1513년부터 1775년까지의 모습은 그리지 않음
  endNote: 1821년 7월 애덤스-오니스 조약에 따라 남은 동·서 플로리다를 미국에 넘겨 없어짐
  features:
    - 행정 중심은 세인트오거스틴(동), 펜서콜라(서)
    - 1763년 영국에 넘겼다가 1783년 파리 조약으로 되찾음
    - 1795년 핀크니 조약으로 북 경계를 북위 31°로 정함
    - 1810년 서플로리다 공화국 반란 뒤 배턴루지 둘레를 미국이 병합
    - 1819년 애덤스-오니스 조약, 1821년 미국에 넘김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Spanish Florida", "위키백과 West Florida", "위키백과 Adams–Onís Treaty"]
    foundingNote: 1513년 폰세 데 레온의 플로리다 도착과 이름 붙임부터(지도는 1783년 되찾은 뒤부터)
# 글은 FL-M2 칸이 채움 — 가칭(위키 ko 표제는 '영국령 서플로리다'·'동플로리다' 따로 — 둘을 한 항목). 북 경계 32°28′(C-M2-5)
- id: british-florida
  level: polity
  names: { ko: 영국령 플로리다, en: British Florida, native: East and West Florida }
  from: 1763
  to: 1783
  color: "#b27f34"
  summary: 1763년부터 1783년까지 영국이 다스린 동·서 플로리다. 1763년 파리 조약으로 스페인에게서 플로리다를 넘겨받아 세인트오거스틴의 동플로리다와 펜서콜라의 서플로리다 두 식민지로 나누었고, 서플로리다 북 경계는 곧 북위 32°28′까지 넓힘. 미국 독립 전쟁 때 13식민지에 끼지 않고 왕당파가 피난해 옴. 1779년부터 1781년까지 스페인 갈베스 총독이 배턴루지·나체즈·모빌·펜서콜라를 차례로 빼앗았고, 1783년 파리 조약으로 둘 다 스페인에 돌려줌. 내륙은 크리크·촉토·치카소 사람들이 다스렸음
  mapNote: 지도에는 1776년부터 1782년까지 동플로리다(지금 플로리다반도)와 북위 32°28′ 남쪽 서플로리다(미시시피강~채터후치강, 루이지애나 플로리다 교구 포함)로 표시함. 1779년부터 스페인이 점령한 서플로리다도 1783년 조약 앞까지는 영국령으로 그림
  endNote: 1783년 9월 파리 조약으로 스페인에 돌려주어 없어짐(동플로리다 인계는 1784년 7월)
  features:
    - 동플로리다는 세인트오거스틴, 서플로리다는 펜서콜라에서 다스림
    - 1763년 파리 조약으로 스페인에게서 넘겨받음
    - 서플로리다 북 경계를 북위 32°28′로 넓힘
    - 1779~1781년 스페인 갈베스 총독의 원정으로 서플로리다를 잃음
    - 1783년 파리 조약으로 스페인에 돌려줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 West Florida", "위키백과 East Florida", "위키백과 Spanish Florida"]
    foundingNote: 1763년 파리 조약으로 스페인에게서 플로리다를 넘겨받은 때부터

# ══ M2 BNA-W-M2 항목 (캐나다 서쪽·허드슨만) ══
# 글은 BNA-W-M2 칸이 채움 — 위키 ko 표제·사전(아메리카 첫판). 1670 헌장(Q1 A — 1776~ 안쪽 전부, 명목), 레드강 1776~1818(C-M2-3)
- id: ruperts-land
  level: polity
  names: { ko: 루퍼츠랜드, en: "Rupert's Land", native: "Rupert's Land" }
  from: 1670
  to: 1870
  color: "#bd5c51"
  summary: 허드슨 베이 회사가 국왕 헌장으로 받은 허드슨만 물길의 땅. 1670년 잉글랜드 국왕 찰스 2세가 허드슨만으로 흘러드는 모든 땅을 회사에 주었고, 회사는 요크팩토리·처칠 같은 바닷가 교역소와 강가 교역소에서 원주민과 모피를 사고팔며 다스렸음. 땅 대부분은 실제로 크리·아시니보인·블랙풋·데네·이누이트 같은 원주민과 메티스가 다스렸음. 1812년 레드강 식민지가 생겼고, 1818년 영국과 미국의 협약으로 레드강 유역의 북위 49도 남쪽이 미국 땅이 되었음. 1869년 11월 회사가 헌장 땅을 영국에 돌려주어 1870년 7월 15일 캐나다로 넘어감
  mapNote: 지도에는 1776년부터 1869년까지 허드슨만으로 흘러드는 땅 전부를 명목상 회사 땅으로 칠함(실제 지배는 바닷가와 강가의 교역소 몇십 곳). 지금 매니토바 전부와 서스캐처원·앨버타 남부(북위 49도까지 — 49도선 북쪽 미주리강 물길인 밀크강 둘레는 1819년부터, 그 앞은 루이지애나 땅으로 그림), 누나부트 본토 남부와 허드슨만의 섬, 온타리오·퀘벡 북부를 덮고, 1776년부터 1818년까지는 레드강 유역(수리스강 유역 포함)의 지금 미국 쪽 땅도, 1776년부터 1782년까지는 지금 미네소타 북부 레이니강·우즈호 유역도 함께 그림
  endNote: 1870년 7월 15일 캐나다로 넘어가 없어짐
  features:
    - 1670년 5월 2일 찰스 2세의 헌장으로 허드슨 베이 회사에 줌
    - 1713년 위트레흐트 조약으로 프랑스가 허드슨만을 영국 땅으로 인정
    - 1812년 레드강 식민지, 1818년 북위 49도 경계
    - 1869년 헌장 땅을 돌려주고 1870년 캐나다로 넘어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Rupert's Land", "위키백과 Hudson's Bay Company"]
    foundingNote: 허드슨 베이 회사가 국왕 헌장을 받은 1670년 5월 2일부터
# 글은 BNA-W-M2 칸이 채움 — 위키 ko 표제('북서 준주'가 넘겨줌 — 조사 가칭 '북서 지역'을 고침, 지금 '노스웨스트 준주'와 다름). 1821 독점 허가(Q1 A)
- id: north-western-territory
  level: polity
  names: { ko: 북서부 영토, en: North-Western Territory, native: North-Western Territory }
  from: 1821
  to: 1870
  color: "#65d27b"
  summary: 루퍼츠랜드 북서쪽의 허드슨 베이 회사 독점 교역 땅. 허드슨만으로 흐르지 않는 매켄지강·유콘강·북극해 물길에 걸친 영국령 북아메리카 땅으로, 1821년 허드슨 베이 회사가 노스웨스트 회사를 합치면서 영국 정부에게서 원주민과의 교역 독점 허가를 받아 맡았음. 회사의 다스림은 매켄지강과 애서배스카호 둘레의 교역소 몇 곳에 그쳤고, 땅은 실제로 데네·이누이트 같은 원주민이 다스렸음. 1870년 7월 15일 루퍼츠랜드와 함께 캐나다로 넘어가 노스웨스트 준주가 됨
  mapNote: 지도에는 1821년부터 1869년까지 허드슨만 물길 밖의 지금 유콘, 노스웨스트 준주 본토, 누나부트 본토 서북부, 앨버타·서스캐처원 북부를 명목상 회사 독점 교역 땅으로 칠함(실제 지배는 교역소 몇 곳). 1776년부터 1820년까지는 영국의 청구만 있어 비워 둠. 브리티시컬럼비아 쪽은 1821년부터 북위 54°40′ 북쪽, 1846년부터 그 남쪽 본토까지 칠하고, 1858년 브리티시컬럼비아 식민지가 선 뒤로는 나스강·핀레이강 북쪽과 로키산맥 동쪽 피스강 쪽만 1862년까지 그림
  endNote: 1870년 7월 15일 캐나다로 넘어가 없어짐
