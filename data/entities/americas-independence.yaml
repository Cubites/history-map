# 글은 CAM-M2 칸이 채움 — 가칭·사전(아메리카 첫판 — 위키 ko 표제는 '모스키토 해안'). 1740 영국 보호(0단계 기본값 19), 1860 줄어듦(G2-12), 1894 니카라과 병합
- id: mosquito-kingdom
  level: polity
  names: { ko: 모스키토 왕국, en: Mosquito Kingdom, native: Mosquito Kingdom }
  from: 1740
  to: 1894
  color: "#bd9251"
  summary: 카리브해 모스키토 해안에서 미스키토족 왕이 다스린 나라. 영국이 왕을 세워 감쌌고, 1740년 동맹을 맺은 뒤 영국 정착민과 함께 스페인에 맞섬. 1786년 영국이 스페인과의 협정으로 해안 정착민을 거두었으나 왕국은 남았고, 1844년 영국이 다시 보호를 선언함. 1859년 영국이 북쪽 해안을 온두라스에 넘겼고, 1860년 1월 28일 영국과 니카라과가 마나과에서 맺은 조약으로 블루필즈 둘레의 자치 보호구가 되어 니카라과의 주권 아래 들어감. 1894년 니카라과군이 블루필즈를 차지하고 11월 20일 병합함
  mapNote: 지도에는 1776년부터 1893년까지 표시함. 1776년부터 1859년까지는 지금 온두라스 그라시아스아디오스주와 니카라과 카리브 해안 북·남 자치 지역을 그리고, 1860년부터 1893년까지는 마나과 조약이 정한 보호구(남쪽 라마강에서 북쪽 와와강까지의 해안 지대)만 그림. 1860년 뒤 보호구가 실제로 다스린 땅은 블루필즈 둘레 해안이었음. 영국의 감쌈은 1844년부터 1859년까지 보호 선언 때만 관계로 보이고, 그 앞 동맹은 명목에 가까워 보이지 않음
  endNote: 1894년 11월 20일 니카라과에 병합되어 끝남
  features:
    - 중심지는 블루필즈
    - 1740년 영국과 동맹을 맺음
    - 1844년부터 1859년까지 영국 보호
    - 1860년 마나과 조약으로 니카라과 안 자치 보호구가 됨
    - 1894년 니카라과에 병합
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Mosquito Coast", "위키백과 Treaty of Managua", "위키백과 Battle of St. George's Caye"]
    foundingNote: 영국과 동맹을 맺은 1740년부터

