  level: polity
  names: { ko: 포르투갈령 브라질, en: Colonial Brazil, native: Estado do Brasil }
  from: 1549
  to: 1822
  color: "#c99445"
  summary: 포르투갈 왕이 보낸 총독이 다스린 남아메리카 식민지. 1549년 첫 총독이 사우바도르에 자리 잡았고 1763년 리우데자네이루로 다스리는 곳을 옮겼으며, 1775년 북쪽 그랑파라·마라냥 쪽 두 주를 합쳐 하나가 됨. 1777년 산일데폰소 조약으로 스페인과 남쪽·서쪽 국경을 정했음. 아마존 숲 대부분은 강가의 요새와 선교 마을 몇 곳 말고는 원주민이 다스렸음. 1808년 나폴레옹 군을 피해 포르투갈 왕실이 리우데자네이루로 옮겨 왔고, 1815년 12월 16일 포르투갈 브라질 알가르브 연합왕국의 한 왕국이 됨. 1817년 몬테비데오를 차지해 1821년 시스플라티나주로 합쳤고, 1821년 주앙 6세가 리스본으로 돌아간 뒤 1822년 왕세자 페드루가 독립을 선언함
