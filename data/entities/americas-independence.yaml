  color: "#a5b234"
  summary: 지금 브리티시컬럼비아주 땅을 다스린 영국의 식민지. 1858년 프레이저강에서 금이 나와 미국 쪽 채굴꾼이 몰려들자, 영국은 8월 2일 본토에 식민지를 세우고 밴쿠버섬 총독 제임스 더글러스에게 함께 맡김. 처음에는 나스강·핀레이강 남쪽과 로키산맥 서쪽만이었으나 1863년 7월 28일 북위 60°·서경 120°까지 넓어졌고, 1866년 밴쿠버섬 식민지와 합쳐 1868년 수도를 뉴웨스트민스터에서 빅토리아로 옮김. 내륙 대부분은 여전히 원주민이 다스렸고, 1864년 칠코틴족이 도로 공사에 맞서 싸우는 등 충돌이 있었음. 합친 뒤 빚이 늘자 대륙 횡단 철도를 약속받고 캐나다 합류를 골랐음
  mapNote: 지도에는 1858년부터 1870년까지 표시함. 1858년부터 1862년까지는 나스강·핀레이강 남쪽과 로키산맥 서쪽 본토를, 1863년부터는 북위 60°까지의 북부와 서경 120°까지의 피스강 쪽을 더하고, 1866년부터는 밴쿠버섬까지 그림. 영국의 지배를 관계로 보임
