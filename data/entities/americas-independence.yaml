  summary: 기아나 해안 서쪽 강가에 있던 네덜란드 식민지들. 1616년 무렵 에세키보강 가에 교역소를 세운 뒤 네덜란드 서인도 회사가 에세키보·데메라라와 버비스를 따로 개척했음. 사탕수수·커피 농장에서 아프리카 노예를 부렸고 1763년 버비스에서 큰 노예 반란이 일어났음. 식민지는 해안과 강 아래쪽 농장만 다스렸고 안쪽 숲과 사바나는 원주민이 살았음. 나폴레옹 전쟁 때 영국군이 1796년부터 1802년까지, 다시 1803년부터 차지했고 1814년 런던 조약으로 영국에 넘어감
  mapNote: 지도에는 1776년부터 1813년까지 지금 가이아나 땅으로 표시함. 1899년 파리 중재 재판으로 정해진 베네수엘라와의 국경을 처음부터 그려 에세키보강 서쪽 땅도 함께 그림. 1803년부터 1813년까지 영국군이 차지한 때도 네덜란드 주권이 남아 같은 색으로 그림
  endNote: 1814년 8월 13일 런던 조약으로 영국에 넘어가 영국령 기아나로 이어짐
