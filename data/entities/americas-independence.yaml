# 글은 AND-N-M2 칸이 채움 — 위키 ko 표제. from 1717(1739 다시 세움), 마이나스 1776~1801(Q3)·키호스 1776~1801(창구 ③ Q-R3)
- id: new-granada-viceroyalty
  level: polity
  names: { ko: 누에바그라나다 부왕령, en: Viceroyalty of New Granada, native: Virreinato de la Nueva Granada }
  from: 1717
  to: 1819
  color: "#3fa65e"
  summary: 보고타에서 다스린 스페인의 부왕령. 1717년 5월 27일 펠리페 5세가 페루 부왕령에서 갈라 세웠다가 1723년 거두었고, 1739년 다시 세우며 파나마를 붙임. 1777년 베네수엘라 쪽 주들이 베네수엘라 총사령부로 갈라졌고, 1802년 7월 15일 칙령으로 아마존 상류의 마이나스가 페루 부왕령으로 넘어감. 1810년 7월 20일 보고타에 자치 정부가 들어선 뒤 여러 주가 독립을 외쳤으나 1816년 스페인군이 다시 차지함. 1819년 8월 7일 보야카 전투에서 시몬 볼리바르에게 져 사실상 끝났고, 남은 왕당파는 1822년까지 버팀. 아마존 쪽 밀림은 원주민이 다스렸고 부왕령은 선교 마을 몇 곳만 둠
  mapNote: 지도에는 1776년부터 1818년까지 지금 콜롬비아·파나마·에콰도르 땅으로 표시함. 1776년에는 베네수엘라를, 1801년까지는 마라뇬강·아마존강 북쪽의 마이나스(지금 페루 로레토 북부)와 나포강 유역의 키호스(지금 에콰도르 아마존 북부)도 함께 그림. 1810년부터 1818년까지 자치 정부와 스페인군 재정복 시기도 같은 색으로 그림. 아마존 쪽 밀림은 선교 마을 몇 곳만 둔 명목 지배
  endNote: 1819년 8월 보야카 전투 뒤 그란콜롬비아에 들어가며 끝남(남은 왕당파는 1822년에 항복)
  features:
    - 행정 중심은 보고타
    - 1717년 세우고 1739년 다시 세움
    - 1777년 베네수엘라 총사령부가 갈라짐
    - 1802년 칙령으로 마이나스와 키호스가 페루 부왕령으로 넘어감
    - 1819년 보야카 전투로 사실상 끝남
