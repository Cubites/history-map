  from: 1527
  to: 1813
  color: "#b28834"
  summary: 자와 서쪽 끝과 수마트라 람풍의 후추 무역을 쥔 술탄국. 1527년 드막과 손잡은 세력이 순다 왕국의 반튼과 순다 칼라파를 빼앗았고, 하사누딘이 술탄국의 기틀을 닦았으며, 1579년 마울라나 유숩이 파자자란을 무너뜨림. 후추를 찾아온 유럽·중국·인도 상인으로 붐볐고 술탄 아궁 티르타야사(재위 1651~1683) 때 가장 번성했으나, 1680~1684년 아들 술탄 하지와의 내전에서 하지가 VOC를 끌어들여, 1684년 조약으로 술탄국이 VOC의 보호를 받게 됨
  endNote: 1752년 VOC의 봉토가 되었고, 1808년 다엔덜스의 공격과 1813년 영국의 폐지로 술탄국이 끝남
  mapNote: 지도에는 1527년부터 1751년까지 반튼과 수마트라 람풍을 표시함. 순다 칼라파(자야카르타)는 바타비아가 선 1619년 앞까지 함께 칠함. VOC의 봉토가 된 1752년부터는 회사 색으로 칠함
  features:
