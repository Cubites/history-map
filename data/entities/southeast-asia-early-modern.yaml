# E3 결정 10·기본값 B1·B2 — 직접 지배 땅만(동자와 + 발리), 끝 1527(드막, 1478 학설은 summary·endNote 병기). 발리 1343 정복은 1만 km² 미만이라 1293부터 근사
- id: majapahit
  level: polity
  names: { ko: 마자파힛 제국, en: Majapahit, native: Majapahit }
  from: 1293
  to: 1527
  color: "#b26634"
  summary: 동자와 트로울란을 도읍으로 군도 바다를 거느린 힌두·불교 왕국. 1293년 라덴 위자야가 원나라 원정군을 몰아내고 세웠고, 재상 가자 마다가 팔라파 서약(1336 무렵)으로 군도 통일을 맹세하며 발리(1343) 등을 쳤으며, 하얌 우룩 때(1350~1389) 전성기를 맞음. 1365년 프라판차가 지은 『나가라케르타가마』가 조공한 땅을 길게 적었으나 직접 다스린 곳은 동자와와 발리 정도였음. 15세기에 왕위 다툼과 북해안 이슬람 항구의 성장으로 기울었음
  endNote: 1478년 다하(케디리) 쪽 세력에게 트로울란을 잃었다고도 하며(마자파힛 끝을 이 해로 보는 학설), 1527년 무렵 드막 술탄국이 다하를 쳐 왕국이 끝남
  mapNote: 지도에는 1293년부터 1526년까지 왕실이 직접 다스린 동자와와 발리만 표시함(발리는 1343년 정복 전부터 함께 칠함). 『나가라케르타가마』에 적힌 수마트라·칼리만탄·말레이 반도의 조공 땅은 칠하지 않음
  features:
    - 도읍은 트로울란(동자와 브란타스강 유역)
    - 1336년 무렵 가자 마다의 팔라파 서약
    - 하얌 우룩(재위 1350~1389) 때 전성기
    - 1365년 궁정 시 『나가라케르타가마』
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 마자파힛 제국", "위키백과 영어판 Majapahit"]
    foundingNote: 라덴 위자야가 즉위한 1293년 11월부터

# R-B 2-3·기본값 B6 — 서자와·반튼·자카르타 세 조각 1293~1526, 1527 반튼 분리 뒤 서자와만, 1579 파자자란 함락. from 669·앞 669~1292는 E4 BI가 같은 id로(타루마나가라 successor_of, 932 건국설은 summary 병기 — E4 기본값 B3)
- id: sunda-kingdom
  level: polity
  names: { ko: 순다 왕국, en: Sunda Kingdom, native: Karajaan Sunda }
  from: 669
  to: 1579
  color: "#94cc9c"
  summary: 파자자란을 도읍으로 서자와를 다스린 순다인의 힌두 왕국. 669년 타루마나가라 왕위를 이은 타루스바와가 세웠다고 전하며(932년의 크본 코피 2 비문을 첫 기록으로 보아 이 해를 건국으로 보기도 함), 도읍 파쿠안 파자자란(지금 보고르)의 이름을 따 파자자란이라고도 부름. 순다 칼라파(지금 자카르타) 항구로 후추를 팔았고 1522년 포르투갈과 조약을 맺어 이슬람 세력에 맞섰으나, 1527년 드막과 손잡은 반튼 세력에게 순다 칼라파와 서쪽 바닷가를 잃음
  endNote: 1579년 반튼 술탄국의 마울라나 유숩이 파쿠안 파자자란을 무너뜨려 왕국이 끝남
  mapNote: 지도에는 669년부터 1578년까지 표시함. 1526년까지는 서자와 전체, 1527년부터는 반튼과 자카르타를 뺀 서자와만 칠함
  features:
    - 도읍은 파쿠안 파자자란(지금 보고르)
    - 순다 칼라파 항구의 후추 무역
    - 1522년 포르투갈과 조약
    - 1579년 반튼에 무너짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 순다 왕국", "위키백과 반튼 술탄국"]
