# R-B 2-3·기본값 B3 — 중자와 1478~, 1527 동자와(마자파힛 뒤), 1568 파장으로. 해 갈림 1475/1478/1481은 summary에. 표기 드막(위키 ko 본문·외래어 표기법 — 뼈대 '드마크'를 고침)
- id: demak-sultanate
  level: polity
  names: { ko: 드막 술탄국, en: Demak Sultanate, native: Kasultanan Dêmak }
  from: 1478
  to: 1568
  color: "#c894cc"
  summary: 자와 북쪽 바닷가에 선 자와 첫 이슬람 술탄국. 라덴 파타가 북해안 항구 드막을 근거로 1478년 무렵(1475·1481 설도 있음) 마자파힛에서 떨어져 나왔고, 트릉가나(재위 1521~1546) 때 1527년 다하를 쳐 마자파힛을 끝내고 동자와 항구들을 차지했으며, 서쪽으로는 반튼과 순다 칼라파에 세력을 보냄. 1546년 트릉가나가 동쪽 원정 중 죽자 왕위 다툼으로 흩어짐
  endNote: 1568년 무렵 내륙 파장의 하디위자야가 왕권을 쥐어 파장 술탄국으로 넘어감
  mapNote: 지도에는 1478년부터 1567년까지 표시함. 중자와는 1478년부터, 동자와는 마자파힛이 끝난 1527년부터 칠함. 처음 조공한 반자르 술탄국 땅은 칠하지 않음
  features:
    - 도읍은 북해안 드막
    - 자와 이슬람 전파의 중심(마스지드 아궁 드막)
    - 1527년 다하를 쳐 마자파힛을 끝냄
    - 1546년 트릉가나의 죽음 뒤 분열
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 영어판 Demak Sultanate", "위키백과 인도네시아의 역사"]
    foundingNote: 라덴 파타가 마자파힛에서 떨어져 나온 1478년 무렵부터(1475·1481 설은 summary)

# R-B 2-3·기본값 B4 — 드막과 같은 조각 1568~1585, 1586 마타람으로
- id: pajang-sultanate
