  to: 1431
  color: "#45c968"
  summary: 앙코르를 도읍으로 메콩강 아래쪽과 코랏 고원을 다스린 크메르인의 제국. 802년 자야바르만 2세가 스스로 전륜성왕으로 즉위하며 육진랍·수진랍을 합쳐 세움. 10세기 중엽 라젠드라바르만 2세 때 코랏 고원 남부로 넓혔고, 11세기 초 수리야바르만 1세가 서쪽 짜오프라야강 쪽으로 세력을 뻗었으며, 12세기 수리야바르만 2세가 앙코르 와트를, 자야바르만 7세가 앙코르 톰을 지으며 전성기를 누림. 13세기 뒤 수코타이·라보·아유타야 같은 타이족 왕국이 일어서며 서쪽 땅을 잃음
  endNote: 1352~1353년과 1393~1394년 두 번 아유타야에 앙코르를 빼앗겼고, 1431년 포냐 얏 왕이 지키기 어려운 앙코르를 버리고 남쪽 지금 프놈펜 쪽으로 옮기면서 캄보디아 왕국으로 이어짐
  mapNote: 지도에는 802년부터 1430년까지 표시함. 802년에는 지금 캄보디아 땅(라타나키리 빼고)과 지금 라오스 남부의 참파삭(왓푸), 지금 베트남 남부의 메콩 삼각주로 시작하고, 944년 라젠드라바르만 2세가 왕위에 올라 크메르의 지배가 코랏 고원으로 퍼진 때부터 지금 타이 동북부 이산 남부(나콘랏차시마·부리람·수린·시사껫·차이야품·콘깬과 우본·야소톤·암낫짜런·묵다한·로이엣·마하사라캄·깔라신)를 더해 1430년까지 같은 땅으로 그림. 이산 북부와 메콩강 왼쪽 기슭의 하라오·라타나키리는 크메르의 직접 지배를 말하는 근거가 없어 비움. 1177~1181년 참파가 앙코르를 차지한 일과 1352~1353년·1393~1394년 아유타야가 앙코르를 잠시 차지한 일은 되돌려진 점령이라 칠하지 않음. 짜오프라야강 아래쪽과 타이 동부 해안은 라보 왕국 땅으로 보아 이 색으로 칠하지 않았고, 크메르가 라보를 거느린 946~1052년·1181~1218년은 종주 관계로만 나타냄. 서쪽 경계는 지금 타이–캄보디아 국경에 기댄 어림
  features:
    - 도읍은 앙코르(야소다라푸라, 지금 시엠레아프 북쪽)
    - 12세기 수리야바르만 2세가 앙코르 와트를 지음
    - 12세기 말 자야바르만 7세가 앙코르 톰과 바욘을 짓고 길과 숙소를 닦음
    - 넓은 저수지(바라이)와 물길로 톤레사프 둘레의 벼농사를 받침
    - 1285년부터 원에 조공했고, 1296~1297년 원의 사신 주달관이 『진랍풍토기』를 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khmer Empire", "위키백과 Post-Angkor period", "주달관 『진랍풍토기』"]
    foundingNote: 802년 자야바르만 2세가 쿨렌산에서 자바로부터 독립한 전륜성왕으로 즉위한 해를 시작으로 봄. 1431년 앙코르를 버린 뒤는 캄보디아 왕국(따로 항목)

# E3 기본값 D8 — 1293~1350 한 버전(중부 평야·서부·동부, 근거 약함은 mapNote), 1351 아유타야가 합침. from 648(건국 전승) — 앞 버전은 E4가 같은 id로 칠할 수 있음
