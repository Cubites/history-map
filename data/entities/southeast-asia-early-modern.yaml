# 시대·범위: 1293~1766: 바간 끝·아바·항따와디·따웅우·므라우우·아유타야·란나·란쌍·대월(쩐·호·레·막·찐·응우옌)·참파·크메르·마자파힛·말라카·자와 술탄국·VOC 거점·스페인령 필리핀 (E3, docs/southeast-asia/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'southeast-asia-early-modern' → 필터 단위 southeast-asia).
# E3 뼈대(2026-11-09)가 새 항목 25개의 id·이름·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 e3/COMMON.md 4절 표). 색은 뼈대가 이웃과 ΔE 43 넘게 골랐다(e3/skel/tools/de3.mjs).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — e3/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 se-03·se-04 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(고치면 결과 노트 2절에 한 줄). id·색은 고치지 않는다.
#   E1·E2 항목(konbaung-dynasty·cambodia·voc·brunei 등)을 1766 앞으로 앞당겨 칠하는 칸은 그 블록(southeast-asia-modern.yaml·southeast-asia-colonial.yaml)을 고친다 — 이 파일에는 새 항목만.

# ══ E3 BM 항목 (버마) ══
# E3 기본값 D16 — 1293~1296 한 버전(상버마 사가잉·마궤·만달레이), 1297-12 마인사잉 삼형제가 왕을 폐위(핀야 왕국). from 1044(아노라타 즉위)·앞 버전 1044~1292는 E4 BI가 같은 id로 칠함(1044 상버마 · 1057 바고·하버마 · 1287 하버마를 잃음)
- id: pagan-empire
  level: polity
  names: { ko: 바간 왕국, en: Pagan Kingdom, native: ပုဂံပြည် }
  from: 1044
  to: 1297
  color: "#76a63f"
  summary: 이라와디강 가운데의 바간을 도읍으로 버마를 처음 하나로 묶은 왕국. 쀼 도시국가들의 뒤를 이어 1044년 아노라타 왕이 즉위했고, 1057년 따통(타톤)을 정복해 하버마의 몬족 땅까지 거느리며 상좌부 불교를 받아들였으며, 바간 평원에 불탑과 사원 수천 곳을 세웠음. 13세기 말 원나라 군대의 침입(1277~1287)으로 왕권이 무너지자 1287년 하버마가 와레루의 항따와디 왕국으로 갈라져 나갔고, 1297년 마인사잉의 세 형제가 마지막 왕을 폐위하며 끝남
  mapNote: 지도에는 1044년부터 1296년까지 표시함. 1044~1056년에는 쀼 도시국가들이 있던 상버마(지금 사가잉·마궤·만달레이 지방), 1057년부터 1286년까지는 따통 정복으로 얻은 바고 지방과 하버마(지금 양곤·에야와디 지방과 몬·카인주)를 더해 그림. 1287년부터는 하버마가 항따와디 왕국으로 갈라져 상버마와 프롬·따웅우 쪽(지금 바고 지방 북부)만 남김. 전성기에 조공을 받거나 원정한 샨 고원·테나세림·아라칸과 카친·친 구릉은 칠하지 않음
  endNote: 1297년 12월 마인사잉의 세 형제가 원나라에 기댄 왕을 폐위해 상버마의 실권이 핀야 왕국으로 넘어감
  features:
    - 도읍은 바간
    - 1044년 아노라타 왕이 즉위해 버마를 처음 하나로 묶음
    - 1057년 따통(타톤)을 정복해 하버마를 거느림
    - 상좌부 불교를 받아들이고 불탑과 사원 수천 곳을 세움
    - 1277~1287년 원나라 군대의 침입으로 쇠퇴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["바간 비문", "『유리궁 연대기』"]
    foundingNote: 1044년 아노라타 왕이 바간 왕위에 올라 이라와디강 유역을 하나로 묶기 시작한 때부터(연대기는 849년 바간에 성을 쌓았다고 전함)

# R-A 1-1 — 1297~1364 한 버전(마인사잉·핀야·사가잉을 한 항목으로 — 1315 사가잉 갈라짐은 글), 1364 샨의 사가잉·핀야 약탈, 1365 아바 왕국
- id: pinya-kingdom
  level: polity
  names: { ko: 핀야 왕국, en: Pinya Kingdom, native: ပင်းယ }
  from: 1297
  to: 1364
  color: "#c945af"
  summary: 바간이 무너진 뒤 상버마를 다스린 마인사잉·핀야의 왕실. 1297년 마인사잉의 세 형제가 바간 왕을 폐위하고 실권을 쥐었고, 1313년 막내가 핀야에 도읍을 세웠음. 1315년 사가잉에 따로 왕실이 서서 둘로 갈라졌으며, 1364년 북쪽 샨 소국의 군대가 사가잉과 핀야를 약탈하며 끝남
  mapNote: 지도에는 1297년부터 1364년까지 상버마(지금 사가잉·마궤·만달레이 지방)와 프롬·따웅우 쪽(지금 바고 지방 북부)으로 표시하고, 1315년 갈라진 사가잉 왕국도 같은 색으로 그림
  endNote: 1364년 샨 군대에 사가잉과 핀야가 함락된 뒤 사가잉 왕실의 왕자가 두 왕실을 합쳐 1365년 아바에 새 도읍을 세움
  features:
    - 도읍은 마인사잉·핀야, 1315년부터 사가잉에 따로 왕실
    - 상버마의 곡창 짜욱세를 근거로 일어섬
    - 1364년 샨 군대의 약탈로 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『유리궁 연대기』"]
    foundingNote: 1297년 12월 마인사잉의 세 형제가 바간 왕을 폐위하고 상버마의 실권을 쥔 때부터(핀야 도읍은 1313년)

# R-A 1-1 — 1365 · 1544(바간 위도선 남쪽을 따웅우에 잃음 — 칼선 BM_CUT_PAGAN), 1555-01 따웅우의 아바 정복. 1527 샨 연맹의 아바 점령은 땅 그대로
- id: ava-kingdom
  level: polity
  names: { ko: 아바 왕국, en: Ava Kingdom, native: အင်းဝ }
  from: 1365
  to: 1555
  color: "#516ebd"
  summary: 잉와(아바)를 도읍으로 약 200년 상버마를 다스린 왕국. 1365년 사가잉 왕실의 왕자가 핀야·사가잉을 합쳐 세웠고, 1385~1424년 하버마의 항따와디 왕국과 40년 전쟁을 벌였음. 15세기 말 프롬과 따웅우가 떨어져 나가고 북쪽 샨 소국들의 공격에 시달렸으며, 1527년 샨 소국 연합이 아바를 차지해 샨계 왕들이 다스렸음. 1544년 따웅우 왕조에 바간 남쪽의 중부 버마를 잃었고, 1555년 1월 바인나웅에게 아바가 함락되며 끝남
  mapNote: 지도에는 1365년부터 1554년까지 상버마(지금 사가잉·마궤·만달레이 지방)로 표시하고, 1509년까지는 프롬·따웅우 쪽(지금 바고 지방 북부)을 함께 그림. 1527년 샨 소국 연합이 아바를 차지한 뒤에도 같은 색으로 그리고, 1544년부터는 바간 북쪽(밍잔·짜욱세·사가잉 쪽)만 남김. 1482년 따로 선 프롬 왕국은 땅이 작아 1509년까지 이 왕국 색, 1510년부터 따웅우 왕조 색 안에 둠
  endNote: 1555년 1월 따웅우 왕조의 바인나웅이 아바를 함락해 상버마를 손에 넣음
  features:
    - 도읍은 잉와(아바)
    - 1385~1424년 항따와디 왕국과 40년 전쟁
    - 1527년부터 샨계 왕들이 다스림
    - 1555년 따웅우 왕조에 정복됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『유리궁 연대기』", "『마하 야자윈』"]
    foundingNote: 1364년 사가잉 왕실의 왕자가 사가잉·핀야를 되찾고 1365년 아바(잉와)에 도읍을 세운 때부터

# R-A 1-1·기본값 D15 — 1293~1538 하버마(바고·양곤·에야와디·몬·카인), 1539~1739 따웅우가 덮음, 1740 부활 · 1752 아바 점령(마궤·만달레이 더함) · 1753 · 끝 1757-05-06 페구 함락(마지막 버전 1756)
- id: hanthawaddy-kingdom
  level: polity
  names: { ko: 항따와디 왕국, en: Hanthawaddy Kingdom, native: ဟံသာဝတီ }
  from: 1287
  to: 1757
  color: "#34a9b2"
  summary: 버마 남부 몬족이 마르타반과 바고(페구)를 도읍으로 세운 왕국. 1287년 와레루가 바간에서 떨어져 나와 마르타반에서 일어섰고, 1369년 바고로 도읍을 옮겼음. 1385~1424년 아바 왕국과의 40년 전쟁을 버텼고, 15세기 후반 신소부 여왕과 담마제디 왕 때 바다 무역과 불교로 번영했음. 1538~1539년 따웅우 왕조에 페구를 잃어 끝났다가 1740년 몬족의 봉기로 다시 일어나 1752년 아바를 무너뜨렸으나, 1757년 5월 콘바웅 왕조에 페구가 함락되며 끝남
  mapNote: 지도에는 1287년부터 1538년까지와 1740년부터 1756년까지 하버마(지금 바고 지방 남부·양곤·에야와디 지방과 몬·카인주, 1740년부터는 바고 지방 전체)로 표시하고, 1752년에는 아바를 차지하며 얻은 상버마 남쪽(마궤·만달레이 지방)을 더함. 여러 나라가 다툰 테나세림은 칠하지 않음. 1755~1756년 콘바웅 왕조가 먼저 차지한 이라와디 삼각주와 다곤도 1756년까지 같은 색으로 남겨 둠
  endNote: 1757년 5월 6일 알라웅브야의 콘바웅 군대가 페구를 함락해 몬족 왕국은 끝나고 하버마는 콘바웅 왕조에 들어감
  features:
    - 도읍은 마르타반, 1369년부터 바고(페구)
    - 1385~1424년 아바 왕국과 40년 전쟁
    - 담마제디 왕 때 바다 무역과 상좌부 불교 개혁
    - 1740년 다시 일어나 1752년 아바를 함락
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『라자다릿 아예도봉』", "깔야니 비문(1479)"]
    foundingNote: 1287년 와레루가 바간 왕국에서 떨어져 나와 마르타반에서 왕을 칭한 때부터

# R-A 1-1·기본값 D7 — 1510 따웅우·프롬 쪽(바고 북부 18,911 km² — D6 전제 1만 미만이 틀려 칠함, 칼선 BM_CUT_PROME), 1539 하버마 · 1544 바간 남쪽 · 1555 상버마 · 1599 하버마 비움 · 1613 하버마 · 1740 하버마를 잃음, 1752-03 아바 함락으로 끝(마지막 버전 1751)
- id: toungoo-dynasty
  level: polity
  names: { ko: 따웅우 왕조, en: Toungoo dynasty, native: တောင်ငူခေတ် }
  from: 1510
  to: 1752
  color: "#34b234"
  summary: 따웅우에서 일어나 버마와 타이 북부까지 묶은 왕조. 1510년 따웅우의 영주가 아바 왕국에서 독립했고, 아들 다빙슈웨디가 1539년 페구, 1544년 바간까지 차지했음. 바인나웅 왕은 1555년 아바, 1557년 샨 소국들, 1558년 란나를 정복하고 1564년과 1569년 아유타야를 무릎 꿇려 동남아 대륙에서 가장 큰 나라를 세웠으나, 1599년 페구가 무너지며 흩어졌음. 왕실의 한 갈래가 아바에서 다시 일어나 1613년 하버마를 되찾았고, 1630년대 아바로 도읍을 옮긴 뒤 1752년 항따와디 왕국에 아바가 함락되며 끝남
  mapNote: 지도에는 1510년부터 1751년까지 표시함. 1510년 따웅우와 프롬 쪽(지금 바고 지방 북부)으로 시작해 1539년 하버마, 1544년 바간 남쪽의 중부 버마(마궤·만달레이 지방 남부), 1555년 상버마 전체를 더하고, 1599~1612년에는 하버마가 갈라져 아바 쪽 상버마만 남겼다가 1613년 다시 하버마를 더하며, 1740년 다시 일어선 항따와디 왕국에 하버마를 내줌. 샨 소국들과 란나는 이 왕조에 매인 나라로 따로 그리고, 아유타야(1564~1567·1569~1583)와 란쌍(1574~1597)의 종속은 관계로만 보임. 1542년에야 차지한 프롬 쪽은 땅이 작아 1510년부터 같은 색 안에 둠
  endNote: 1752년 3월 항따와디 군대가 아바를 함락해 마지막 왕이 페구로 끌려가며 끝났고, 상버마에서는 같은 해 알라웅브야가 콘바웅 왕조를 세움
  features:
    - 도읍은 따웅우·페구(바고), 1599년 뒤 아바
    - 바인나웅 왕 때 동남아 대륙에서 가장 큰 나라
    - 1599년 무너진 뒤 아바에서 다시 일어남
    - 1752년 항따와디 왕국에 아바가 함락되어 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『마하 야자윈』", "『유리궁 연대기』"]
    foundingNote: 1510년 따웅우의 영주가 아바 왕국에서 독립을 선언한 때부터


