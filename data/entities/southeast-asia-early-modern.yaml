# R-B 2-4·Q-1·기본값 B14 — 남·중칼리만탄 1526~(다야크 내륙은 명목 — mapNote), 1526-09-24 개종(위키 영어판 Banjar Sultanate). E2가 1767~1786을 비워 1767에 끊김(결과 노트 6절), 1860 네덜란드 병합은 글(to 1860 — 소멸 열쇠는 허용 줄)
- id: banjar-sultanate
  level: polity
  names: { ko: 반자르 술탄국, en: Banjar Sultanate, native: Kesultanan Banjar }
  from: 1526
  to: 1860
  color: "#aac86f"
  summary: 칼리만탄 남쪽 반자르마신을 도읍으로 한 술탄국. 느가라 다하의 왕위 다툼에서 밀려난 라덴 사무드라가 드막의 도움을 받아 1526년 9월 이슬람으로 개종하고 술탄 수리안샤로 즉위하며 세웠고, 처음에는 드막에 조공함. 17세기 초 후추 무역으로 번성해 칼리만탄 남부와 동부 해안 소국들에게서 조공을 받았으며, 1633년 VOC의 반자르마신 공격을 물리쳤으나 17세기 후반부터 내전과 VOC의 개입이 잦아짐
  endNote: 1787년 VOC의 보호국이 되었고, 1859년 반자르 전쟁이 일어나자 1860년 네덜란드가 술탄국을 없앰
  mapNote: 지도에는 1526년부터 1786년까지 칼리만탄 남부와 중부를 표시함. 중부의 다야크 사람들 땅은 술탄의 다스림이 명목에 그친 곳이며, 조공을 바친 동·서 칼리만탄 소국 땅은 칠하지 않음
  features:
