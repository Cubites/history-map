# R-B 2-2·2-3·기본값 B7 — 반튼 조각 1527~1751(람풍은 M1 칸이 같은 id로), 1752 VOC 봉토(voc 색), 1684 조약부터 종속은 관계, 1813 영국이 없앰은 글(to 1813 — 그 뒤 소멸 열쇠는 허용 줄)
- id: banten-sultanate
  level: polity
