  summary: 향신료 정향을 쥐고 말루쿠 북부를 다스린 술탄국. 1257년 트르나테섬에 왕국이 섰다고 전하며, 15세기 후반(1486 무렵) 이슬람을 받아들임. 1512년 포르투갈에 요새를 허락했다가 술탄 하이룬이 살해당하자 아들 바불라(재위 1570~1583)가 1575년 포르투갈을 몰아냈고, 술라웨시 북부에서 민다나오 남쪽까지 섬들을 조공국으로 거느림. 17세기 초 네덜란드와 손잡아 스페인·티도레에 맞섰으나 점점 VOC에 매임
  endNote: 1683년 VOC에 주권을 넘기는 조약을 맺어 VOC의 종속국이 됨(술탄 왕실은 그 뒤에도 이어짐)
  mapNote: 지도에는 1257년부터 1682년까지 지금 북말루쿠 땅 전체를 표시함. 맞수 티도레 술탄국의 섬과 할마헤라 남쪽 땅도 함께 칠했고, 술라웨시·뉴기니의 조공국 땅은 칠하지 않음. VOC에 매인 1683년부터는 회사 색으로 칠함
  features:
