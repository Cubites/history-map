# R-B 2-3·기본값 B5 — 중·동자와 1586~, 1620 서자와(프리앙안) 더함, 1680 서자와 잃음, 1743 동자와 잃음, 1755 기얀티 조약으로 갈라짐(토후국은 voc 색 — E2 기본값 7)
- id: mataram-sultanate
  level: polity
  names: { ko: 마타람 술탄국, en: Mataram Sultanate, native: Kasultanan Mataram }
  from: 1586
  to: 1755
  color: "#554b9b"
  summary: 술탄 아궁 때 자와 대부분을 묶은 내륙 이슬람 왕국. 1586년 무렵 파장에서 떨어져 나와 중자와 내륙 마타람(지금 욕야카르타 근처)을 도읍으로 삼았고, 술탄 아궁(재위 1613~1645)이 1620년대에 수라바야 등 동자와 항구와 마두라, 서자와 프리앙안을 차지했으나 1628~1629년 바타비아 공격은 실패함. 1670년대 트루노조요의 반란을 VOC의 도움으로 누른 뒤 왕실은 땅을 떼어 주기 시작해 1680년 서자와, 1743년 북해안과 동자와를 넘겼고, 1749년에는 파쿠부워노 2세가 죽기 전 왕국의 주권을 VOC에 넘김
  endNote: 1755년 기얀티 조약으로 수라카르타와 욕야카르타 두 왕국으로 갈라지며 끝남
  mapNote: 지도에는 1586년부터 1754년까지 표시함. 중자와와 동자와를 1586년부터, 서자와 프리앙안을 1620년부터 1679년까지 칠하고, 동자와는 VOC에 넘긴 1743년부터 뺌. 1586년부터 1625년까지 동자와 북해안은 실제로는 수라바야 등 독립 항구 국가의 땅이었음
  features:
