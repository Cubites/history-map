  endNote: 1767년 4월 7일 버마 콘바웅 왕조의 군대에 도읍이 함락되어 불탔고, 같은 해 말 딱신이 톤부리에서 시암을 다시 일으킴
  mapNote: 지도에는 1351년부터 1766년까지 지금 타이 중부 평야와 서부·동부 해안 땅으로 표시하고, 1431년 크메르 제국이 물러난 코랏 고원 서남(나콘랏차시마·부리람·수린·시사껫·차이야품·콘깬), 1438년 수코타이의 북중부 아홉 도, 1454년부터 남부 열한 도(나콘시탐마랏~송클라)를 더함. 코랏 쪽 연표는 1664년까지 그 땅을 란쌍 쪽으로 적기도 함. 1454년 앞의 남부는 나콘시탐마랏을 중심으로 한 조공국이라 비워 둠(나콘시탐마랏은 그 뒤에도 자기 왕가가 이어지다 16세기 말 나레수안 때 1등 므앙, 곧 직할 주가 됨). 1564~1567년과 1569~1583년 버마 따웅우 왕조의 속국이던 때도 같은 색으로 칠하고 종속 관계로만 나타냄. 테나세림 해안은 버마와 오래 다투던 땅이라 이 색으로 칠하지 않았고, 1767년 함락 뒤는 톤부리를 중심으로 한 타이 땅으로 이어짐
