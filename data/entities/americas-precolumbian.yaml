# americas precolumbian 나라 (시대 파일 scripts/geo/areas/americas/precolumbian.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 아메리카 콜럼버스 이전(1001~1491) (M4 — docs/americas/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'americas-precolumbian' → 필터 단위 americas).
# M4 뼈대(2026-11-18)가 1001~1491에 칠하는(또는 땅 없이 싣는) 새 항목 18개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 m4/COMMON.md 4절 표, 표 원천 m4/skel/entities.tsv).
#   칠하는 것은 chimu 하나(1375~1469 — 결정 Q3 A). 나머지 17은 땅 없는 항목(level region — 결정 Q1 A·C-M4-6, M3 muisca 꼴)이라 시대 파일 versions에 없다(mapNote '지도에는 땅을 그리지 않음').
#   앞 잇는 M3 항목 aztec·tarascan·inca의 1001~1491 버전은 시대 파일이 칠하고, 블록은 data/entities/americas-colonial.yaml 그 자리(파일 소유표 — aztec·tarascan은 MXC-M4, inca는 AND-M4).
#   색은 자기 색 — chimu는 같은 해 맞닿는 inca(1438~1469)·이어지는 inca(1470)와, 땅 없는 17은 관련 항목끼리 서로 다르게 골랐다(m4/skel/tools/dm4.mjs — 최소 ΔE 46.5).
#   level은 chimu만 polity(basis 필수 — 정의 칸 AND-M4가 씀, 뼈대 블록에는 없음: M2·M3와 같음), 나머지 17은 region.
#   to는 끝난 해 = 칠한 마지막 해 + 1(미포함 — G4-5), 끝 없음은 null(haudenosaunee·carib). from은 성립 해 — 1001 앞이어도 그 해 그대로(지도는 1001부터, 1000 이하는 M5 몫 — C-M4-16).
#   기원전 해는 천문 연도로 적는다(maya-civilization −1999 = 기원전 2000년, dorset-culture −499 = 기원전 500년 — COMMON 머리 '해 표기').
#   이름은 위키백과 한국어판 표제로 확인했다(m4/skel/ko-titles.txt·ko-titles2.txt — 표제가 없거나 다른 가칭은 블록 머리 주석, 공용 표기표는 m4/SKEL-NOTE.md 끝).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — m4/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 3묶음 몫이라 빈 목록 그대로).
#   from·to는 칸이 사료로 고칠 수 있다(P7 — 고치면 결과 노트 2절에 한 줄). id·색·이름·level은 고치지 않는다.

# ══ M4 MXC-M4 항목 (메소아메리카 — 땅 없는 넷) ══
# 글은 MXC-M4 칸이 채움 — 위키 ko 표제('톨텍 제국'도 따로 표제). 땅 없는 지역 항목(Q1 A·C-M4-6), 900~1150(ko 쪽 해 — en 950~1168은 글)
- id: toltec
  level: region
  names: { ko: 톨텍, en: Toltec, native: Tōltēcah }
  from: 900
  to: 1150
  color: "#4b5b9b"
  summary: 툴라를 중심으로 멕시코 중부에서 번성한 나우아 계통 사람들. 900년 무렵부터 지금 이달고주의 툴라가 멕시코 중부의 큰 도시로 자라 멕시코만과 태평양 쪽까지 교역을 넓혔고, 뒤의 아즈텍 사람들은 톨텍을 솜씨와 문명의 본보기로 높이 여김. 넓은 땅을 다스린 제국이었는지 툴라 둘레의 작은 나라였는지는 학설이 갈림. 12세기 중엽 툴라가 무너지고 버려지며 쇠퇴함
  endNote: 12세기 중엽 도읍 툴라가 무너지고 버려지며 끝남
  features:
    - 도읍은 툴라(지금 멕시코 이달고주)
    - 전사 모습의 큰 돌기둥 석상으로 알려짐
    - 아즈텍 사람들이 문명의 본보기로 여김
    - 제국이었는지 작은 나라였는지 학설이 갈림
  mapNote: 지도에는 땅을 그리지 않음. 다스린 땅의 범위가 전하지 않고 제국이었는지도 학설이 갈려 사건의 주체로만 둠
  startEvents: [toltec-900]
  endEvents: [toltec-900]
# 글은 MXC-M4 칸이 채움 — 위키 ko 표제('치첸 이차'가 넘겨줌 — 사전 avoid). 땅 없는 지역 항목(chichen-itza 등급은 a 노트 polity가 아니라 region — C-M4-6), 900~1200
- id: chichen-itza
  level: region
  names: { ko: 치첸이트사, en: Chichen Itza, native: "Chi'ch'èen Ìitsha'" }
  from: 900
  to: 1200
  color: "#c8786f"
  summary: 유카탄 반도 북부를 이끈 마야 도시. 900년 무렵부터 1050년 무렵까지 유카탄 북부와 중부의 중심 도시로 번성했고, 계단 피라미드 엘카스티요와 큰 공놀이 경기장, 제물을 바친 성스러운 샘(세노테)을 남김. 1100년 무렵부터 힘을 잃었고 13세기 초에 중심 도시의 자리를 잃으며 그 뒤를 마야판이 이음
  endNote: 13세기 초 유카탄 북부 중심 도시의 자리를 잃으며 끝남
  features:
    - 유카탄 반도 북부의 마야 도시
    - 계단 피라미드 엘카스티요로 알려짐
    - 큰 공놀이 경기장과 성스러운 샘(세노테)이 있음
    - 그 뒤 유카탄 북부의 중심은 마야판으로 옮겨 감
  mapNote: 지도에는 땅을 그리지 않음. 도시가 이끈 땅의 경계가 전하지 않아 사건의 주체로만 둠
  startEvents: [chichen-itza-900]
  endEvents: [chichen-itza-900]
# 글은 MXC-M4 칸이 채움 — 위키 ko 표제. 땅 없는 지역 항목, 1220~1441(1441 반란으로 버려짐 — to = 끝난 해)
- id: mayapan
  level: region
  names: { ko: 마야판, en: Mayapan, native: Mayapan }
  from: 1220
  to: 1441
  color: "#94bbcc"
  summary: 치첸이트사 뒤 유카탄 북부 마야 도시들을 이끈 도시. 1220년대부터 유카탄 북부의 수도 노릇을 하며 둘레 도시를 다스리던 가문들이 성벽 안에 모여 살았고, 코콤 가문이 앞장섬. 1441년 슈 가문이 일으킨 반란으로 도시가 무너졌고, 그 뒤 유카탄 북부는 여러 작은 나라로 나뉨
  endNote: 1441년 슈 가문이 일으킨 반란으로 도시가 무너지며 끝남
  features:
    - 도읍은 마야판(지금 메리다 남쪽)
    - 둘레 도시의 가문들이 성벽 안에 모여 삶
    - 1441년 슈 가문의 반란으로 무너짐
    - 그 뒤 유카탄 북부는 작은 나라들로 나뉨
  mapNote: 지도에는 땅을 그리지 않음. 도시 연맹이 다스린 땅의 범위가 전하지 않아 사건의 주체로만 두고, 유카탄 반도 북부는 비움
  startEvents: [mayapan-1220]
  endEvents: [mayapan-fall-1441]
# 글은 MXC-M4 칸이 채움 — '믹스텍'(00-scope 0단계 표기 — C-M4-11), 위키 ko 표제 '미슈텍인'(민족 이름 — 글에 병기, avoid 아님). 땅 없는 지역 항목, 900~1522(1522-03 투투테펙 정복)
- id: mixtec
  level: region
  names: { ko: 믹스텍, en: Mixtec, native: Ñuu Savi }
  from: 900
  to: 1522
  color: "#bd9d51"
  summary: 오악사카 서부 믹스테카의 소왕국들과 해안의 투투테펙을 일군 믹스텍(미슈텍인) 사람들. 고원의 도시 국가들이 혼인과 동맹으로 얽혀 지내며 그림 문서(코덱스)로 왕가의 역사를 남겼고, 1083년 무렵 8사슴이 해안의 투투테펙을 중심으로 넓은 땅을 묶음. 15세기 중엽부터 고원의 도시들은 아즈텍 삼각 동맹에 공물을 바쳤으나 투투테펙은 끝까지 독립을 지킴. 1522년 3월 스페인군이 투투테펙을 정복하며 끝남
  endNote: 1522년 3월 스페인군이 투투테펙을 정복하며 끝남
  features:
    - 오악사카 서부 믹스테카의 여러 소왕국
    - 그림 문서(코덱스)로 왕가의 역사를 남김
    - 1083년 무렵 8사슴이 투투테펙을 중심으로 넓은 땅을 묶음
    - 투투테펙은 아즈텍에 끝까지 굴복하지 않음
    - 1522년 3월 스페인군에 정복됨
  mapNote: 지도에는 땅을 그리지 않음. 여러 소왕국이 따로 다스려 하나의 경계로 묶을 수 없어 사건의 주체로만 둠. 아즈텍 삼각 동맹에 공물을 바친 고원 땅은 그 해에 맞춰 동맹의 색으로 그렸고, 투투테펙이 다스린 해안은 비움
  startEvents: [mixtec-900]
  endEvents: [oaxaca-mixteca-1521]

# ══ M4 AND-M4 항목 (안데스 — 치무와 땅 없는 둘) ══
# 글은 AND-M4 칸이 채움 — 위키 ko 표제 '치무'('치무 왕국'·'치무 문화'·'치모르'가 넘겨줌 — 글에 '치무 왕국'은 써도 됨, avoid 아님). from 900(칠함은 1375 시칸 정복부터 — G4-6·Q3 A), to 1470(잉카 정복 — 칠함 마지막 1469). polity라 basis는 AND-M4가 씀
- id: chimu
  level: polity
  names: { ko: 치무, en: Chimú, native: Chimor }
  from: 900
  to: 1470
  color: "#4b7b9b"
  summary: 찬찬을 도읍으로 페루 북부 해안을 다스린 나라. 900년 무렵 모체 골짜기에서 일어나 해안 골짜기들을 물길로 이었고, 1375년 무렵 북쪽 람바예케의 시칸 땅을 정복함. 마지막 왕 민찬카만 때 북쪽 툼베스에서 남쪽 카라바이요까지 약 1,000 km의 해안을 다스렸으나, 남쪽으로 넓힌 해는 학자마다 다름. 1470년 투팍 잉카 유팡키가 이끈 잉카군에게 정복됨
  endNote: 1470년 잉카군에게 정복되며 끝남. 그 땅은 잉카 제국에 들어감
  mapNote: 지도에는 1375년부터 1469년까지 표시함. 1375년 무렵 시칸 땅을 정복한 뒤 북쪽 툼베스 골짜기에서 남쪽 카라바이요(치욘강 아래쪽)까지 페루 북부 해안 골짜기와 안데스 서쪽 기슭을 그림. 1374년까지는 모체·치카마 골짜기의 처음 땅이 작고 남쪽으로 넓힌 해가 전하지 않아 비움. 1470년부터 그 땅은 잉카 제국 색으로 그림
  features:
    - 도읍은 찬찬(치모르)
    - 해안 골짜기를 물길로 이어 농사를 지음
    - 1375년 무렵 시칸 땅을 정복함
    - 마지막 왕은 민찬카만
    - 1470년 잉카군에게 정복됨
  startEvents: [chimu-chancay-900]
  endEvents: [tupac-inca-chimu-1463]
  basis:
    type: primary_source
    refs: ["위키백과 Chimú culture", "위키백과 Lambayeque culture"]
    foundingNote: 900년 무렵 모체 골짜기에서 나라가 일어난 때부터(지도는 1375년부터)
# 글은 AND-M4 칸이 채움 — 위키 ko 표제('람바예케 문화'는 표제 없음 — 글에 병기). 땅 없는 지역 항목, 750~1375(치무 정복)
- id: sican-culture
  level: region
  names: { ko: 시칸 문화, en: Sican culture, native: Sicán }
  from: 750
  to: 1375
  color: "#b2bd51"
  summary: 람바예케 골짜기에서 번성한 페루 북부 해안 문화. 람바예케 문화라고도 함. 750년 무렵 일어나 900년부터 1100년 무렵까지 바탄그란데를 중심으로 금속 공예와 큰 흙벽돌 신전을 남겼고, 1375년 무렵 치무 왕국에게 정복됨
  endNote: 1375년 무렵 치무 왕국에게 정복되며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 람바예케 둘레 골짜기들을 이끈 신정 국가였다고 하나 다스린 땅의 범위가 전하지 않아 사건의 주체로만 둠. 그 땅은 1375년부터 치무 색으로 그림
  features:
    - 람바예케 문화라고도 함
    - 중심지는 바탄그란데
    - 금속 공예로 이름남
    - 1375년 무렵 치무 왕국에게 정복됨
  startEvents: [sican-750]
  endEvents: [chimu-sican-1375]
# 글은 AND-M4 칸이 채움 — 가칭(위키 ko 표제 없음). 땅 없는 지역 항목, 1000~1470(en 인포박스 — b 노트 값)
- id: chancay-culture
  level: region
  names: { ko: 찬카이 문화, en: Chancay culture }
  from: 1000
  to: 1470
  color: "#bc65d2"
  summary: 리마 북쪽 찬카이·치욘 골짜기를 중심으로 번성한 페루 중부 해안 문화. 1000년 무렵부터 포르탈레사강에서 루린강까지의 골짜기에 퍼졌고, 흑백 토기와 직물로 이름남. 1400년대 초 남쪽 일부가 치무 왕국에 들어갔고, 1470년 무렵 잉카 제국에 들어가며 끝남(잉카가 들어온 해를 1450년 무렵으로 보는 설도 있음)
  endNote: 1470년 무렵 잉카 제국에 들어가며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 여러 골짜기에 걸친 작은 지역 나라였다고 하나 경계가 전하지 않아 사건의 주체로만 둠. 찬카이·치욘 골짜기는 1375년부터 1469년까지 치무 색, 1470년부터 잉카 제국 색으로 그림
  features:
    - 중심지는 찬카이·치욘 골짜기
    - 흑백 토기와 직물로 이름남
    - 1400년대 초 남쪽 일부가 치무 왕국에 들어감
    - 1470년 무렵 잉카 제국에 들어감
  startEvents: [chimu-chancay-900]
  endEvents: [tupac-inca-chimu-1463]

# ══ M4 NAC-M4 항목 (북미·그린란드·카리브·땅 없는 항목) ══
# 글은 NAC-M4 칸이 채움 — 가칭(위키 ko 표제 없음, '노르드인'은 표제). 땅 없는 지역 항목(G4-9 — norway-medieval 늘림 아님), 985~1450. 노르웨이 복속(1261)은 관계 줄 없이 글(C-M4-7)
- id: norse-greenland
  level: region
  names: { ko: 노르드인 그린란드 정착, en: Norse settlements in Greenland, native: Grænland }
  from: 985
  to: 1450
  color: "#6565d2"
  summary: 붉은 에이리크가 그린란드 남서쪽 피오르에 연 노르드인 정착지. 982년 아이슬란드에서 쫓겨나 이 땅을 둘러본 붉은 에이리크가 985년 무렵 이주민을 이끌고 와 남쪽의 동부 정착지와 북쪽의 서부 정착지를 세웠음. 1000년 무렵에는 이곳에서 배를 띄운 사람들이 빈란드라 부른 북아메리카 해안에 닿아 뉴펀들랜드 북쪽 끝 랑스 오 메도즈에 머물렀음. 1261년 노르웨이 왕의 다스림을 받아들였으나 서부 정착지는 1350년 무렵 비었고, 동부 정착지도 1408년 흐발세이 교회의 혼례 기록을 마지막으로 15세기 중반에 사람이 사라짐
  mapNote: 지도에는 땅을 그리지 않음. 사람이 산 곳이 그린란드 남서쪽 피오르 둘레의 좁은 풀밭뿐이고 경계를 알려 주는 자료가 없어 사건의 주체로만 두며, 그 땅은 덴마크-노르웨이가 다시 사람을 보내 그린란드를 다스리기 전까지 비워 둠
  endNote: 서부 정착지는 1350년 무렵 비었고, 동부 정착지도 1408년의 혼례 기록 뒤 15세기 중반에 사람이 사라지며 끝남
  features:
    - 남쪽의 동부 정착지(Eystribyggð)와 북쪽의 서부 정착지(Vestribyggð) 두 곳
    - 아이슬란드에서 온 이주민이 그린란드 노르드어라는 사투리를 씀
    - 1000년 무렵 빈란드(지금 뉴펀들랜드)까지 배를 보냄
    - 1261년 노르웨이 왕에게 복속함
    - 1408년 흐발세이 교회의 혼례가 마지막 기록
  startEvents: [norse-greenland-985]
  endEvents: [norse-greenland-end-1408]
  basis:
    type: primary_source
    refs: ["위키백과 Norse settlements in Greenland", "위키백과 Norse colonization of North America"]
    foundingNote: 붉은 에이리크가 이주민을 이끌고 온 985년 무렵부터
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제(사전 아메리카 첫판). 땅 없는 지역 항목, 800~1600(G4-13)
- id: mississippian-culture
  level: region
  names: { ko: 미시시피 문화, en: Mississippian culture }
  from: 800
  to: 1600
  color: "#a28cd4"
  summary: 카호키아를 비롯한 흙 둔덕 도시를 세운 북아메리카 동부의 옥수수 농경 문화. 미시시피강 유역과 지금 미국 남동부에 걸쳐 옥수수 중심의 농사로 큰 마을을 이루고, 꼭대기가 평평한 흙 둔덕을 쌓은 추장국들이 들어섰음. 1050년 무렵 세워진 카호키아는 1100년 무렵 인구 1만 5천에서 2만에 이르는 도시가 되었으나, 1150년부터 1200년까지 이어진 가뭄 뒤 쇠퇴해 1350년 무렵 비었음. 그 뒤에는 남쪽의 다른 둔덕 중심지와 넓은 땅을 거느린 큰 추장국들이 이어졌고, 1539년 에르난도 데 소토의 원정대가 지나간 뒤 전염병과 전쟁으로 무너짐
  mapNote: 지도에는 땅을 그리지 않음. 여러 추장국이 따로 다스려 하나의 경계로 묶을 수 없어 사건의 주체로만 둠
  endNote: 1539년 스페인 원정대가 지나간 뒤 전염병과 전쟁으로 추장국들이 무너지며 1600년 무렵 끝남
  features:
    - 옥수수 중심의 농사로 큰 마을을 이룸
    - 꼭대기가 평평한 흙 둔덕 위에 건물을 지음
    - 카호키아는 멕시코 북쪽에서 가장 큰 흙 둔덕 도시
    - 여러 추장국이 따로 다스림
  startEvents: [mississippian-800]
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Mississippian culture", "위키백과 Cahokia"]
    foundingNote: 옥수수 농사와 흙 둔덕 마을이 퍼지기 시작한 800년 무렵부터
# 글은 NAC-M4 칸이 채움 — 가칭(위키 ko 표제 없음 — '아나사지'도 없음, '푸에블로족'은 지금 '푸에블로 인디언'으로 넘겨줌). 땅 없는 지역 항목, 1~1300(G4-11)
- id: ancestral-puebloan-culture
  level: region
  names: { ko: 조상 푸에블로인, en: Ancestral Puebloans }
  from: 1
  to: 1300
  color: "#c6cc94"
  summary: 차코 캐니언과 메사버드에 큰 집 마을을 지은 북아메리카 남서부 문화. 지금 미국의 유타·애리조나·뉴멕시코·콜로라도 네 주가 만나는 콜로라도고원에서 구덩이 집에 살다가 여러 층의 돌·흙벽돌 집과 절벽 마을을 지었음. 차코 캐니언은 900년 무렵부터 1150년 무렵까지 큰 집과 길로 둘레 마을을 이은 중심지였으나, 1130년 무렵부터 가뭄이 이어지며 1140년 무렵 흩어졌음. 메사버드의 절벽 마을도 1276년부터 1299년까지 이어진 큰 가뭄 속에 1285년 무렵 비었고, 사람들은 남쪽으로 옮겨 지금의 푸에블로 사람들로 이어짐
  mapNote: 지도에는 땅을 그리지 않음. 마을과 길로 이어진 문화권일 뿐 하나의 나라로 다스린 땅이 아니어서 사건의 주체로만 둠
  endNote: 13세기 말 큰 가뭄 속에 메사버드를 비롯한 북쪽 마을이 비고, 사람들이 남쪽으로 옮겨 가며 1300년 무렵 끝남
  features:
    - 마을마다 의식을 치르는 둥근 방 키바를 둠
    - 차코 캐니언에 여러 층의 큰 집을 짓고 길로 둘레 마을을 이음
    - 메사버드에 절벽 마을을 지음
    - 후손은 지금의 푸에블로 사람들로 이어짐
  startEvents: [basketmaker-1]
  endEvents: [mesa-verde-1190]
  basis:
    type: primary_source
    refs: ["위키백과 Ancestral Puebloans", "위키백과 Chaco Culture National Historical Park", "위키백과 Mesa Verde National Park"]
    foundingNote: 바구니 만들기 시대 마을이 자리 잡은 기원 무렵부터
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제 '호호캄'('호호캄 문화'는 표제 없음 — 글에는 써도 됨). 땅 없는 지역 항목, 300~1450
- id: hohokam-culture
  level: region
  names: { ko: 호호캄, en: Hohokam }
  from: 300
  to: 1450
  color: "#bd6751"
  summary: 애리조나 남부에 물길을 파 농사지은 북아메리카 남서부 문화. 300년 무렵부터 지금 피닉스 둘레의 솔트강·길라강 유역에서 강물을 끌어 농사를 지었고, 그 물길은 콜럼버스 이전 아메리카에서 가장 복잡한 관개망이었음. 스네이크타운 같은 큰 마을에는 시장이 섰고 태평양 해안과 대평원까지 이어진 교역로 위에 있었음. 1350년 무렵부터 큰 마을이 비기 시작했고, 카사그란데도 1450년 무렵 버려짐
  mapNote: 지도에는 땅을 그리지 않음. 마을들이 정치로 묶였는지조차 학자들의 의견이 갈려 사건의 주체로만 둠
  endNote: 1350년 무렵부터 큰 마을이 비고, 카사그란데도 1450년 무렵 버려지며 끝남
  features:
    - 솔트강·길라강에서 물을 끌어 사막에서 농사지음
    - 피닉스 둘레의 옛 물길 일부는 지금도 물을 나름
    - 스네이크타운 같은 큰 마을에 시장이 섬
    - 아키멜 오오덤·토호노 오오덤의 조상이라는 구전이 있음
  startEvents: [hohokam-300]
  endEvents: [cahokia-hohokam-1350]
  basis:
    type: primary_source
    refs: ["위키백과 Hohokam", "위키백과 호호캄"]
    foundingNote: 물길 농사 마을이 자리 잡은 300년 무렵부터
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제 '툴레인'('툴레 문화'는 표제 없음). 땅 없는 지역 항목, 1000~1600
- id: thule-culture
  level: region
  names: { ko: 툴레인, en: Thule people }
  from: 1000
  to: 1600
  color: "#5ea63f"
  summary: 알래스카에서 그린란드까지 북극 해안으로 퍼진 이누이트의 조상. 1000년 무렵 알래스카 해안에서 고래잡이 문화를 이루었고, 11세기부터 캐나다 북극을 지나 동쪽으로 옮겨 13세기에는 그린란드에 닿았음. 가는 곳마다 앞서 살던 도싯 문화 사람들의 자리를 차지했고, 그린란드에서는 노르드인 정착지 사람들과도 만났음. 소빙기가 깊어지며 큰 마을이 흩어져 지금의 이누이트로 이어짐
  mapNote: 지도에는 땅을 그리지 않음. 북극 해안을 옮겨 다니며 산 사람들이라 다스린 땅의 경계가 없어 사건의 주체로만 둠
  endNote: 1600년 무렵 높은 북극의 마을을 버리고 소빙기 속에 흩어져 지금의 이누이트로 이어짐
  features:
    - 북극 바다에 맞는 고래잡이 기술을 지님
    - 13세기에 그린란드에 닿음
    - 이름은 북서 그린란드 툴레의 유적에서 따옴
    - 그린란드에서 노르드인과 만남
  startEvents: [thule-dorset-1000]
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Thule people"]
    foundingNote: 알래스카 해안에서 고래잡이 문화가 자리 잡은 1000년 무렵부터
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제('도싯인'이 넘겨줌, '도셋 문화'는 사전 avoid). 땅 없는 지역 항목, 기원전 500년(천문 −499)~1300
- id: dorset-culture
  level: region
  names: { ko: 도싯 문화, en: Dorset culture }
  from: -499
  to: 1300
  color: "#34a5b2"
  summary: 툴레인보다 앞서 캐나다 북극과 그린란드에 살던 고에스키모 문화. 기원전 500년 무렵부터 캐나다 북극의 섬들과 래브라도·뉴펀들랜드, 그린란드 해안에서 사냥하며 살았음. 세모꼴 작살 날과 활석 등잔을 썼고, 이름은 유물이 처음 나온 캐나다 누나부트의 케이프도싯에서 땄음. 11세기부터 알래스카에서 동쪽으로 퍼진 툴레인이 그 땅을 차지하며 1300년 무렵 거의 사라졌고, 이누이트 전설에는 키가 큰 옛사람 '투니트'로 남음
  mapNote: 지도에는 땅을 그리지 않음. 북극 해안을 옮겨 다니며 산 사람들이라 다스린 땅의 경계가 없어 사건의 주체로만 둠
  endNote: 11세기부터 툴레인이 동쪽으로 퍼지며 1300년 무렵 그 자리를 내주고 사라짐
  features:
    - 세모꼴 작살 날과 활석 등잔을 씀
    - 사냥 도구가 달라진 네 단계로 나뉨
    - 툴레인과 피나 문화가 섞인 흔적이 거의 없음
    - 이누이트 전설의 '투니트'로 남음
  startEvents: [dorset-500bc]
  endEvents: [thule-dorset-1000]
  basis:
    type: primary_source
    refs: ["위키백과 Dorset culture"]
    foundingNote: 도싯 문화가 나타난 기원전 500년 무렵부터
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제('이로쿼이족'이 넘겨줌, 원어 이름은 사건 am-03b 표기 '하우데노사우니'). 땅 없는 지역 항목, 1450~(끝 없음 — G4-12, 1142 설은 글)
- id: haudenosaunee
  level: region
  names: { ko: 이로쿼이 연맹, en: Haudenosaunee, native: Haudenosaunee }
  from: 1450
  to: null
  color: "#8cb234"
  summary: 모호크·오나이다·오논다가·카유가·세네카 다섯 부족이 맺은 연맹. 지금 미국 뉴욕주 북부에서 이로쿼이어를 쓰는 다섯 부족이 '평화의 대법'에 따라 함께 회의를 열었고, 스스로는 '긴 집을 짓는 사람들'이라는 뜻의 하우데노사우니로 부름. 맺은 해는 1142년의 일식에 맞추는 설부터 1660년까지 갈리나 많은 고고학자는 1450년 무렵으로 봄. 17세기 비버 전쟁으로 둘레 부족을 누르며 힘을 넓혔고, 1722년 투스카로라가 들어와 여섯 부족 연맹이 됨
  mapNote: 지도에는 땅을 그리지 않음. 부족마다 마을과 사냥터를 따로 두어 연맹 전체의 경계를 그릴 수 없어 사건의 주체로만 둠
  features:
    - 처음에는 다섯 부족, 1722년 투스카로라가 들어와 여섯 부족
    - 평화의 대법에 따라 부족 대표들이 함께 회의함
    - 이름은 '긴 집을 짓는 사람들'이라는 뜻
    - 프랑스와 영국 식민지 사이에서 오래 힘의 균형을 쥠
  startEvents: [haudenosaunee-1450]
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Iroquois", "위키백과 이로쿼이 연맹"]
    foundingNote: 많은 고고학자가 연맹을 맺었다고 보는 1450년 무렵부터(1142년 설도 있음)
# 글은 NAC-M4 칸이 채움 — 위키 ko 표제('타이노족'이 넘겨줌 — 사전 avoid). 땅 없는 지역 항목, 400~1550(G4-14 — 카시카스고는 비움)
- id: taino-culture
  level: region
  names: { ko: 타이노인, en: Taíno, native: Taíno }
  from: 400
  to: 1550
  color: "#d4a98c"
  summary: 대앤틸리스 제도와 바하마에 살던 아라와크어 계통 사람들. 400년 무렵부터 쿠바·자메이카·히스파니올라·푸에르토리코와 바하마에 퍼져 농사짓는 마을을 이루었고, 카시케라 부른 우두머리가 모계로 이어지며 마을을 다스렸고 제미라는 신령을 섬겼음. 히스파니올라는 마리엔·마과·마구아나·하라과·이구에이 다섯 카시카스고로 나뉘어 있었음. 1492년 콜럼버스가 처음 만난 아메리카 사람들이었으나 스페인의 강제 노동과 전염병으로 크게 줄어, 1550년 스페인 문서는 이들이 사라졌다고 적음
  mapNote: 지도에는 땅을 그리지 않음. 히스파니올라의 다섯 카시카스고를 비롯한 우두머리 땅의 경계를 알려 주는 자료가 적어 사건의 주체로만 둠
