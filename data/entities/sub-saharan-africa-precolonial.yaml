  color: "#a534b2"
  summary: 악숨이 무너진 뒤 에티오피아 북부 고원을 다스린 아가우 사람들의 기독교 왕조. 1137년 무렵 일어나 라스타 산지의 아데파(로하)를 도읍으로 삼았고, 12세기 말~13세기 초 게브레 메스켈 랄리벨라 왕이 바위를 통째로 깎아 만든 교회들을 이곳에 세워 뒤에 도읍 이름도 랄리벨라가 됨. 왕들은 악숨 왕실과 핏줄이 닿지 않는다는 이유로 뒤 왕조에게 정통성을 인정받지 못함
  endNote: 1270년 안사타 전투에서 예쿠노 암라크에게 마지막 왕이 져 끝났고, 예쿠노 암라크가 솔로몬 왕조를 염
  mapNote: 지도에는 1137년부터 1269년까지 지금 에티오피아의 티그라이·암하라 고원과 지금 에리트레아 고원(아스마라 둘레와 그 남쪽)으로 그림. 악숨이 끝난 960년 무렵부터 1136년까지 이 고원은 비워 둠
  features:
    - 도읍은 아데파(지금 랄리벨라)
    - 아가우 사람들의 기독교 왕조
    - 랄리벨라 왕 때 바위를 깎아 만든 교회 열한 채
    - 1270년 안사타 전투로 솔로몬 왕조에 넘어감
  startEvents: [zagwe-1137]
  endEvents: [solomonic-1270]
  basis:
    type: primary_source
    refs: ["위키백과 Zagwe dynasty", "위키백과 자그웨 왕조"]
    foundingNote: 자그웨 왕조가 고원을 다스리기 시작한 1137년 무렵부터(930년 무렵으로 보는 설도 있음)


# ══ F7 S-7 항목 (콩고 해안·앙골라·남부) ══
# 1390(0단계 기본값 20 — 정보 상자 c.1390)~1665(음브윌라 — Q3 (가), 사료 끝 1914는 endNote·장부). [1390, 1665) CD-BC 54,607 + AO-ZAI·AO-UIG 99,110 = 153,717(위키 1623 넓이 129,400과 차 24,317 — 알려진 근사), 관계 없음
- id: kongo-kingdom
  level: polity
  names: { ko: 콩고 왕국, en: Kingdom of Kongo, native: Kongo dya Ntotila }
  from: 1390
  to: 1665
  color: "#cc9494"
  summary: 콩고강 하류 남쪽 음반자콩구를 도읍으로 한 콩고 사람들의 왕국. 14세기 말 무렵 일어나 둘레 소국들을 아울렀고, 1483년 포르투갈 탐험가 디오구 캉이 해안에 닿은 뒤 왕실이 가톨릭을 받아들임. 1509년 왕위에 오른 아폰수 1세는 가톨릭을 나라의 종교로 삼고 돌로 교회와 왕궁을 지었으며, 도읍은 포르투갈 이름 상사우바도르로도 불림. 노예 무역과 남쪽 속국을 두고 포르투갈령 앙골라와 다투다가 1665년 음브윌라 전투에서 져 왕 안토니우 1세가 죽었고, 뒤를 이을 왕을 정하지 못해 왕국이 여러 세력으로 갈라짐
  mapNote: 지도에는 1390년부터 1664년까지 표시하고, 음반자콩구 둘레의 지금 앙골라 자이르주·우이게주와 콩고 민주 공화국 콩고중앙주 땅으로 그림. 1665년 갈라진 뒤의 땅은 그리지 않음
  endNote: 1665년 음브윌라 전투 뒤 왕위를 두고 내전이 이어져 1678년 상사우바도르가 약탈당했고, 1709년 페드루 4세가 다시 하나로 묶었으나 예전 힘을 되찾지 못했으며, 1914년 포르투갈이 명목뿐인 왕정을 없애며 끝남
  features:
    - 도읍은 음반자콩구(포르투갈 이름 상사우바도르)
    - 1483년 디오구 캉이 해안에 닿아 포르투갈과 처음 만남
    - 1509년 아폰수 1세가 왕위에 올라 가톨릭을 나라의 종교로 삼음
    - 1665년 음브윌라 전투에서 포르투갈령 앙골라군에 져 왕이 죽음
    - 1709년 페드루 4세가 내전으로 갈라진 왕국을 다시 묶음
  startEvents: [kongo-1390]
  endEvents: [mbwila-1665]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Kongo", "위키백과 Battle of Mbwila", "위키백과 Afonso I of Kongo"]
    foundingNote: 음반자콩구 둘레에서 왕국이 선 1390년 무렵부터(정확한 해는 전하지 않음)

# 1561(Q2 (A) — 가장 이른 문헌 c.1561, 정보 상자 c.1550)~1787(Q3 (가) — 사료 끝 1883 무렵은 endNote·장부). [1561, 1787) CG-5·CG-16·CG-9 42,043 + GA-5 19,844 = 61,886, 관계 없음
- id: loango-kingdom
  level: polity
  names: { ko: 로앙고 왕국, en: Loango Kingdom, native: Luango }
  from: 1561
  to: 1787
  color: "#84db96"
  summary: 콩고강 북쪽 대서양 기슭 부알리를 도읍으로 한 빌리 사람들의 왕국. 16세기 중엽 유럽 문헌에 처음 나오며, 해안을 따라 남쪽 콩고 왕국과 북쪽 가봉 쪽 사이를 다스림. 빌리 상인들이 내륙과 해안을 잇는 교역로를 쥐고 영국·네덜란드 상인과 거래했고, 17세기 뒤로는 노예 무역의 큰 항구가 됨. 1787년 왕 부아투가 죽은 뒤 새 왕을 뽑지 못해 힘을 잃음
  mapNote: 지도에는 1561년부터 1786년까지 표시하고, 지금 콩고 공화국의 쿠일루·푸앵트누아르·니아리와 가봉 냐응가 땅으로 그림
  endNote: 1787년 왕 부아투가 죽은 뒤 100년 넘게 새 왕을 뽑지 못하다가 1883년 무렵 해체됨
  features:
    - 도읍은 부알리(지금 콩고 공화국 디오소 둘레)
    - 바닷가 교역으로 살아간 빌리 사람들의 왕국
    - 1561년 무렵 유럽 문헌에 처음 나옴
    - 17~18세기 대서양 노예 무역의 큰 항구
    - 1787년 왕 부아투가 죽은 뒤 왕위가 오래 빔
  startEvents: [loango-1561]
  endEvents: [loango-slave-coast-1700]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Loango", "위키백과 Kingdom of Kongo"]
    foundingNote: 유럽 문헌에 처음 나오는 1561년 무렵부터(14세기 말 무렵 섰다고 보는 견해도 있음)

# 1430(0단계 기본값 20 — 15세기 무렵)~1629(포르투갈 속국 조약 — 관계 기간 0, 글). [1430, 1629) ZW-MC·ME·MW·MA·MV·HA 210,396 + MZ-Q·T·S 271,738 = 482,134(D7 — 위키 정보 상자 700,000 'dubious'와 차 217,866은 장부), 관계 없음(1629~ 잠베지 거점은 portuguese-mozambique)
- id: mutapa-empire
  level: polity
  names: { ko: 무타파 제국, en: Kingdom of Mutapa, native: Mwene Mutapa }
  from: 1430
  to: 1629
  color: "#639b4b"
  summary: 짐바브웨 고원 북쪽에서 쇼나 사람들이 세운 금 교역 제국. 15세기에 일어나 잠베지강 남쪽 고원에서 지금 모잠비크의 잠베지 계곡과 소팔라 해안 뒤쪽까지 세력을 뻗었고, 고원의 금과 상아를 인도양 해안의 스와힐리·아랍 상인과 사고팖. 16세기부터 포르투갈이 세나·테트에 교역지를 두고 금 무역에 끼어들었고, 1629년 포르투갈과 조약을 맺어 그 속국이 됨
  mapNote: 지도에는 1430년부터 1628년까지 표시하고, 지금 짐바브웨 북부·동부(마쇼날랜드)와 모잠비크 잠베지아주·테트주·소팔라주 땅으로 그림. 1629년 뒤 줄어든 땅과 고원 남쪽의 로즈위는 그리지 않음
  endNote: 1629년 포르투갈의 속국이 된 뒤 잠베지 계곡을 내주고 북쪽의 작은 나라로 줄어들었으며, 17세기 말부터 고원은 로즈위가 차지함
  features:
    - 왕의 칭호 음웨네 무타파에서 나라 이름이 나옴
    - 짐바브웨 고원의 금을 인도양 해안으로 내보낸 교역 국가
    - 16세기 포르투갈이 잠베지강 가 세나·테트에 교역지를 둠
    - 1629년 포르투갈과 조약을 맺어 그 속국이 됨
  startEvents: [mutapa-1430]
  endEvents: [mutapa-portuguese-1629]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Mutapa", "위키백과 Portuguese Mozambique"]
    foundingNote: 짐바브웨 고원 북쪽에서 쇼나 사람들이 나라를 세운 15세기(1430년 무렵)부터(정확한 해는 전하지 않음)
