# sub-saharan-africa precolonial 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/precolonial.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 기원전 2333~1799: 케르마·쿠시부터 아샨티·메리나까지 (F7 — 천문 −2332~1799, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-precolonial' → 필터 단위 sub-saharan-africa).
# F7 뼈대(2026-11-14)가 −2332~1799에 칠하는 새 토착 나라 항목 14개와 땅 없는 항목 하나(sub-saharan-iron-age — 0단계 기본값 10, GN-7 머리)의 id·이름·level·from·to·색을 정해
#   칸 머리 아래 자리 블록으로 두었다(지시문 f7/COMMON.md 4절 표, 표 원천 f7/skel/entities.tsv).
#   색은 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라·서아시아 이집트·남아라비아 왕조와 ΔE 45 넘게 골랐다(f7/skel/tools/df7.mjs, COMMON P4).
#   나라 14는 level: polity(F2~F6 꼴), 땅 없는 항목은 level: region(버전 0 — 동남아 E4 southeast-asia-bronze-age 선례). to는 끝난 해 = 칠한 마지막 해 + 1(미포함), from은 성립 해. 해는 천문 연도
#   (기원전 N년 = 천문 1−N — 예 kerma from −1749 = 기원전 1750년). 연도 막대 하한이 기원전 2333년(천문 −2332)이라 그 앞 해는 쓰지 않는다.
#   이름은 위키백과 한국어판 표제로 확인했다(f7/skel/ko-titles.txt·en-ko.txt — 표제를 쓴 것: 말리 제국·송가이 제국·쿠시 왕국·마쿠리아·악숨 왕국·자그웨 왕조·콩고 왕국·로앙고 왕국·무타파 제국,
#   표제가 없는 것은 가칭: 케르마 왕국·노바티아·알로디아·철기 시대 사하라 이남 아프리카, 표제와 다른 지시문 가칭을 둔 것: 가나 제국(표제 '와가두')·졸로프 제국(표제 '졸로프') — f7/SKEL-NOTE.md 끝 공용 표기표).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f7/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 2묶음 몫이라 빈 목록 그대로).
#   from·to는 지시문 '새 항목 표' 값이라 그대로 쓰고 ※만 칸이 사료로 닫는다(P7 — 고치면 결과 노트 2절에 한 줄). id·색·이름·level은 고치지 않는다.
#   앞 잇는 항목 21은 이 파일에 없다 — F6 항목 3은 data/entities/sub-saharan-africa-prepartition.yaml, F5 항목 8은 sub-saharan-africa-partition.yaml, F4 항목 3은 sub-saharan-africa-colonial.yaml,
#   F2 항목 5는 sub-saharan-africa-decolonization.yaml, F1 항목 2는 sub-saharan-africa-modern.yaml 그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절). 서아시아·유럽·동남아 블록은 고치지 않는다.

# ══ F7 WA-7 항목 (서아프리카 사헬·대서양) ══
# 글은 WA-7 칸이 채움 — 위키 ko 표제는 '와가두'('가나 제국'은 넘겨주기) — 지시문 가칭·00-scope 표기 그대로 두고 메인에게(SKEL-NOTE 5절, 지금 나라 '가나'·와가두구와 가름). 830(Q2 (A))~1076(기본값 20). [830, 1076) MR-01·02·03·09·10·04·05·ML-1·ML-2·SN-MT 673,475(D24), 관계 없음
- id: ghana-empire
  level: polity
  names: { ko: 가나 제국, en: Ghana Empire, native: Wagadu }
  from: 830
  to: 1076
  color: "#87c945"
  summary: 사헬 서쪽 와가두 땅에서 소닌케족이 세운 사하라 금 교역의 제국. 남쪽 금 산지의 금을 사하라 북쪽 상인의 소금과 바꾸는 교역 길을 쥐어 크게 떨쳤고, 8세기 말부터 아랍 사료에 '금의 나라'로 알려짐. 알바크리의 『여러 길과 나라의 책』(1068)은 이슬람 상인의 마을과 왕의 마을이 따로 있던 도읍을 그렸고, '가나'는 본래 왕을 부르던 칭호였음
  mapNote: 지도에는 830년부터 1075년까지 지금 모리타니 남동부(호드·아사바·타간트·고르골·브라크나)와 말리 서부(카예·쿨리코로), 세네갈 마탐 땅으로 그림
  endNote: 1076년 무렵 알모라비드가 도읍을 쳤다는 전승이 있으나 학계에서 다툼이 있음. 그 뒤 약해진 가나는 1203년 무렵 소소에게 도읍을 빼앗겼고, 13세기 중반 남은 땅이 말리 제국에 들어가며 끝남
  features:
    - 도읍은 쿰비살레(지금 모리타니 남동부 유적)로 봄
    - 사하라 너머로 금을 팔고 소금을 사들인 교역 제국
    - 아우다고스트·왈라타가 사하라 교역 길의 거점
    - 1068년 알바크리 『여러 길과 나라의 책』의 기록
    - 1076년 무렵 알모라비드 공격 전승, 1203년 무렵 소소가 도읍을 차지
  startEvents: [ghana-wagadu-830]
  endEvents: [almoravid-ghana-1054]
  basis:
    type: primary_source
    refs: ["위키백과 Ghana Empire"]
    foundingNote: 4세기 무렵 일어났다는 설도 있으나, 아랍 사료로 나라 모습이 드러나는 830년 무렵부터로 봄

# 글은 WA-7 칸이 채움 — 위키 ko 표제·사전. 1235(키리나 무렵)~1670(기본값 20). 일곱 단계 137,443 → 1324 1,145,687 → 1436 881,912 → 1464 707,186 → 1475 538,049 → 1502 414,219 → 1537 381,049 → 1599 137,443(Q1 (다)·Q5), 관계 없음
- id: mali-empire
  level: polity
  names: { ko: 말리 제국, en: Mali Empire, native: Manden }
  from: 1235
  to: 1670
  color: "#3f54a6"
  summary: 니제르강 상류의 만딩카 사람들이 세운 사헬의 이슬람 제국. 1235년 무렵 순디아타 케이타가 키리나 싸움에서 소소의 수망구루를 이기고 세웠고, 금 산지와 사하라 교역 길을 쥐어 14세기에 서아프리카에서 가장 큰 나라가 됨. 만사 무사가 1324년 메카로 가는 길에 카이로에서 금을 많이 써 이름을 떨쳤고, 팀북투·젠네가 이슬람 학문의 중심이 됨. 15세기부터 투아레그·송가이·모시에게 땅을 잃고 니제르강 상류로 줄어듦
  mapNote: 지도에는 1235년부터 1669년까지 그림. 1235~1323년에는 니제르강 상류(지금 말리 쿨리코로·바마코와 기니 북동부 시기리·칸칸 둘레), 1324~1435년에는 니제르강 굽이(팀북투·가오)와 세네갈강 상류·감비아강까지 넓혀 그림. 1436년부터 팀북투 둘레와 왈라타 쪽, 1464년 가오, 1475년 젠네와 와가두 쪽, 1502년 카예 쪽, 1537년 감비아강 쪽을 뺀 모습으로 줄였고, 1599년부터는 니제르강 상류 핵심만 그림
  endNote: 1599년 젠네 전투에서 팀북투의 모로코 세력에게 진 뒤 니제르강 상류의 작은 나라들로 갈라졌고, 1670년 무렵 끝난 것으로 봄(끝난 해는 문서에 따라 1610년·1645년으로도 봄)
  features:
    - 1235년 무렵 순디아타 케이타가 키리나 싸움에서 이김
    - 도읍은 니아니(자리는 학설이 갈림)
    - 1324년 만사 무사의 메카 순례
    - 1352~1353년 이븐 바투타가 다녀감
    - 1599년 젠네 전투에서 짐
  startEvents: [sundiata-1235]
  endEvents: [mali-end-1650]
  basis:
    type: primary_source
    refs: ["위키백과 Mali Empire"]
    foundingNote: 순디아타 케이타가 키리나 싸움에서 이겨 나라를 세운 1235년 무렵부터

# 글은 WA-7 칸이 채움 — 위키 ko 표제·사전. 1464~1591(톤디비 — 모로코 사아드 왕조 원정, 팀북투 파샬릭은 늘리지 않음). 267,629 → 1468 344,306 → 1475 426,866 → 1502 769,438, 관계 없음
- id: songhai-empire
  level: polity
  names: { ko: 송가이 제국, en: Songhai Empire }
  from: 1464
  to: 1591
  color: "#bd8751"
  summary: 니제르강 굽이의 가오를 도읍으로 한 송가이 사람들의 제국. 1464년 즉위한 손니 알리가 팀북투와 젠네를 차지하며 말리 제국의 동쪽 땅을 넘겨받았고, 1493년 왕위에 오른 아스키아 무함마드가 이슬람 법으로 나라를 다스리며 서쪽 세네갈강 상류부터 동쪽 하우사 땅까지 세력을 넓힘. 16세기 서아프리카 사헬에서 가장 큰 나라였음
  mapNote: 지도에는 1464년부터 1590년까지 그림. 처음에는 가오와 니제르강 가운데 줄기(지금 말리 가오주·니제르 티야베리주) 땅을, 1468년부터 팀북투 둘레, 1475년부터 젠네 둘레를 더했고, 1502년부터 서쪽 카예 쪽과 왈라타 쪽, 니제르 도소 쪽까지 그림. 1591년 뒤 모로코가 다스린 팀북투 둘레는 칠하지 않고 비워 둠
  endNote: 1591년 3월 톤디비 전투에서 화승총을 앞세운 모로코 사드 왕조 군대에게 져 무너짐. 남은 송가이 사람들은 남쪽 덴디로 물러나 나라를 이었고, 모로코는 팀북투에 파샤를 두어 니제르강 굽이를 다스림
  features:
    - 도읍은 가오
    - 1464년 손니 알리 즉위, 1468년 팀북투를 차지
    - 1493년 아스키아 무함마드가 왕위에 오름
    - 1591년 톤디비 전투에서 모로코 군대에게 짐
  startEvents: [sonni-ali-1464]
  endEvents: [tondibi-1591]
  basis:
    type: primary_source
    refs: ["위키백과 Songhai Empire"]
    foundingNote: 손니 알리가 즉위해 정복을 시작한 1464년부터(가오의 송가이 왕조는 그보다 오래됨)

# 글은 WA-7 칸이 채움 — 위키 ko 표제는 '졸로프'(en Jolof Empire 연결) — 1549 뒤 남은 졸로프 왕국과 가르려고 지시문 가칭 '졸로프 제국'을 두고 메인에게(SKEL-NOTE 5절). 1360~1549(카요르 독립 — 다나기 전투). 본국만(M-F7-1 — 기본 어림 SN-LG 25,368, WA-7이 닫음), 관계 없음
- id: jolof-empire
  level: polity
  names: { ko: 졸로프 제국, en: Jolof Empire }
  from: 1360
  to: 1549
  color: "#c9456d"
  summary: 세네갈강과 감비아강 사이에서 월로프 사람들이 세운 연합 제국. 부르바 졸로프라 부른 왕이 내륙의 졸로프 본국을 다스리고, 와알로·카요르·바올과 세레르 사람들의 시네·살룸 왕들에게서 조공을 받음. 15세기 중반부터 대서양 해안에서 포르투갈 상인과 교역했고, 16세기 초부터 구성 왕국들이 하나씩 떨어져 나감
  mapNote: 지도에는 1360년부터 1548년까지 졸로프 본국(지금 세네갈 루가주 린게르 둘레)만 칠함. 졸로프에 조공하며 왕을 뽑는 데 참여한 와알로·카요르·바올·시네·살룸은 졸로프 색으로 칠하지 않고 비워 둠
  endNote: 1549년 카요르가 싸움에서 부르바 졸로프를 꺾고 떨어져 나가며 제국이 무너짐. 와알로·바올도 곧 떨어져 나갔고, 졸로프는 내륙의 작은 왕국으로 1890년까지 이어짐
  features:
    - 왕의 칭호는 부르바 졸로프
    - 와알로·카요르·바올·시네·살룸이 조공하며 왕을 뽑는 데 참여
    - 15세기 중반부터 해안에서 포르투갈 상인과 교역
    - 1549년 카요르가 떨어져 나가며 무너짐
  startEvents: [jolof-1360]
  endEvents: [jolof-1360]
  basis:
    type: primary_source
    refs: ["위키백과 Jolof Empire"]
    foundingNote: 월로프 사람들의 나라들이 졸로프 아래 하나로 묶였다는 1360년 무렵부터(연대는 전승)


# ══ F7 GN-7 항목 (기니만·나이지리아·카메룬·보르누) ══
# 새 나라 항목 없음 — 땅 없는 항목 하나(글은 GN-7)와 앞 잇는 항목 블록(파일 소유표)
# 글은 GN-7 칸이 채움 — 0단계 기본값 10·M-F7-6 — 땅 없는 항목(region, 천문 −999~599 = 기원전 1000년~599년 — to는 E4 southeast-asia-bronze-age의 포함 꼴로 599, M-F7-22). 사건 글의 subjects용(한국 prehistory·남아시아 indus-civilization·동남아 southeast-asia-bronze-age 선례). 버전 0 — own 줄 없음. 이름은 E4 '청동기 시대 동남아' 꼴 가칭(표제 '철기 시대'), 글은 GN-7(반투 확산·노크 문화·젠네-제노 — 가라만테스는 사하라 북쪽 이웃으로만)
- id: sub-saharan-iron-age
  level: region
  names: { ko: 철기 시대 사하라 이남 아프리카, en: Iron Age sub-Saharan Africa }
  from: -999
  to: 599
  color: "#ccc694"
  summary: 철을 다루는 기술과 농경이 퍼져 나간 사하라 이남 아프리카의 문화권. 지금 나이지리아 중부의 노크 문화는 기원전 1천년기에 철을 녹이고 테라코타 인물상을 빚었으며, 니제르강 내륙 삼각주의 젠네-제노는 기원전 250년 무렵 사람이 자리 잡아 서아프리카에서 손꼽히게 이른 도시로 자람. 카메룬·나이지리아 접경 고원에서 나온 반투어 사람들은 숲 남쪽과 대호수 쪽으로 퍼지며 철기와 농경을 옮겼고, 사하라 북쪽 페잔에는 가라만테스가 이웃해 있었음
  mapNote: 지도에는 땅을 그리지 않음. 여러 문화가 유적과 출토물로만 알려져 있고 나라 경계를 그을 근거가 없어, 사건의 주체로만 둠
  endNote: 6세기 무렵 반투어 사람들이 남아프리카 림포포강 둘레까지 닿고, 사헬의 사하라 교역로를 따라 큰 나라들이 자라나며 나라 시대로 넘어감
  features:
    - 지금 나이지리아 중부의 노크 문화가 테라코타 인물상을 남김
