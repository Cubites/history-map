  endNote: 1786년 응우옌 후에의 떠이선 군이 찐 씨를 무너뜨렸고, 1789년 마지막 황제 레 찌에우 통이 청군과 함께 물러나 왕조가 끝남
  mapNote: 지도에는 1427년부터 1787년까지. 1527년부터 1532년까지는 막 왕조가 나라를 차지해 비어 있고, 1533년 타인호아·1543년 응에안·1554년 투언화와 꽝남·1592년 탕롱을 되찾은 모습으로 그림. 1600년부터 응우옌 주가 다스린 잔강 남쪽은 그 색으로 그림. 1775년부터 1785년까지 찐 씨가 차지한 투언화(푸쑤언)도 같은 색으로 그림. 1788년 말 청군의 탕롱 점령은 이듬해 초 쫓겨났으므로 칠하지 않음. 경계는 지금 성 경계와 잔강에 기댄 어림
