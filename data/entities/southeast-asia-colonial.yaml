# 관계 없음: 회사를 본국의 종속국으로 두지 않음(남아시아 company-india와 같음 — 네덜란드 공화국·바타비아 공화국은 글로만)
- id: voc
  level: polity
  names: { ko: 네덜란드 동인도 회사, en: Dutch East India Company (VOC), native: Vereenigde Oostindische Compagnie }
  from: 1602
  to: 1799
  color: "#b23434"
  summary: 자와와 말루쿠를 거점으로 군도를 다스린 네덜란드의 무역 회사. 1602년 네덜란드 공화국 의회의 특허로 세운 회사(정식 이름 동인도 연합 회사)로, 조약을 맺고 전쟁을 벌이고 요새를 지을 권한을 받음. 1619년 자카르타를 빼앗아 바타비아를 세워 아시아 본부로 삼았고, 향신료 독점을 위해 말루쿠를 손에 넣었으며, 1755년 기얀티 조약으로 마타람을 수라카르타와 욕야카르타로 나누어 자와 왕국들을 속국으로 묶음. 18세기 후반 빚과 부패로 기울었고, 1796년 바타비아 공화국이 회사 이사회를 국가 위원회로 바꿈
  endNote: 1799년 12월 31일 특허가 끝나 해산되었고, 빚과 영토는 네덜란드 국가가 넘겨받아 1800년 1월 1일부터 네덜란드령 동인도가 됨
  mapNote: 지도에는 1605년부터 1799년까지 회사가 다스리거나 속국으로 묶은 땅을 지금 주 단위로 표시함. 말루쿠(암본)를 1605년, 바타비아(자카르타)를 1619년, 말라카를 1641년, 동누사틍가라(쿠팡·플로레스·숨바·티모르 서부)를 1653년, 술라웨시 남부·서부와 고론탈로를 봉가야 조약의 1667년, 숨바와와 롬복을 1669년, 북술라웨시를 1679년, 서자와를 1680년, 북말루쿠를 1683년, 동자와를 1743년, 반튼과 람풍을 1752년, 중자와(수라카르타·욕야카르타 같은 속국 포함)를 기얀티 조약의 1755년부터 넣고, 서칼리만탄을 1779년, 남·중칼리만탄을 1787년부터 넣음. 내륙 대부분은 회사의 손이 닿지 않은 명목상의 땅이며, 그 밖의 섬은 토착 왕국의 땅이라 비워 둠
  features:
    - 아시아 본부는 바타비아(1619년부터)
    - 1605년 암본, 1641년 말라카를 포르투갈에게서 빼앗음
    - 말루쿠의 정향·육두구 독점과 자와의 쌀·커피·설탕으로 이익을 냄
    - 1755년 기얀티 조약, 1757년 살라티가 조약으로 마타람을 나눔
    - 1780~1784년 영국과의 전쟁으로 큰 손해를 입음
  startEvents: [dutch-east-india-company-1602]
  endEvents: [voc-dissolution-1795]
  basis:
    type: primary_source
    refs: ["위키백과 네덜란드 동인도 회사", "기얀티 조약(1755)"]
    foundingNote: 네덜란드 공화국 의회가 특허장을 준 1602년 3월 20일부터


