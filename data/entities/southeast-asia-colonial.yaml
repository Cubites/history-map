# E2 결정 Q1·Q2 — 1785 아라칸 병합, 1826·1852 땅을 잃음, 1885-11-29 영국 병합(1886 british-raj). 카친·친 구릉은 콘바웅 색(mapNote에 이름뿐인 지배), 아삼·마니푸르 1819~1825는 칠하지 않음(글만). from 1752는 E3가 앞을 칠함
- id: konbaung-dynasty
  level: polity
  names: { ko: 콘바웅 왕조, en: Konbaung dynasty, native: ကုန်းဘောင်မင်းဆက် }
  from: 1752
  to: 1885
  color: "#457ac9"
  summary: 이라와디강 유역을 중심으로 버마를 다시 하나로 묶은 마지막 왕조. 1752년 알라웅브야가 세웠고, 1754년 아바를 되찾고 1757년 항따와디 왕국의 페구를 함락해 버마를 다시 묶었음. 1767년 싱뷰싱 왕이 시암의 아유타야를 무너뜨렸으며, 1785년 보도퍼야 왕이 아라칸을 병합해 가장 넓은 땅을 가졌음. 1817~1826년 아삼·마니푸르를 점령했다가 제1차 영국-버마 전쟁에 져 1826년 얀다보 조약으로 그 땅과 아라칸·테나세림을 내주었고, 1852년 제2차 전쟁으로 하버마를 잃음. 민돈 왕이 1857년 만달레이로 도읍을 옮기고 개혁을 폈으나, 1885년 제3차 전쟁으로 띠버 왕이 폐위되어 끝남
  mapNote: 지도에는 1752년부터 1885년까지 왕이 직접 다스린 이라와디강 유역과 테나세림으로 표시하고, 사오파가 다스린 샨 국과 카레니 국은 따로 그림. 1752년에는 쉐보를 둘러싼 사가잉 쪽과 카친·친 구릉으로 시작해 1753년 아바 쪽 상버마, 1757년 하버마, 1765년 테나세림을 더함. 1763~1774년에는 총독을 두어 직접 다스린 란나 북서쪽(치앙마이·람푼·파야오·치앙라이·매홍손)을 함께 칠하고, 1785년 아라칸을 더하며, 1826년 아라칸·테나세림과 살윈강 동쪽 땅, 1852년 하버마를 뺌. 카친·친 구릉은 이름뿐인 지배였으나 같은 색으로 그렸고, 1852년 경계 남쪽의 마궤 끝자락(약 9,300 km²)은 끝까지 같은 색으로 남겨 둠. 1817~1826년 점령한 아삼·마니푸르는 칠하지 않음. 토착 군주가 남은 란나의 람빵·난·프래는 1763~1774년에도 란나 색으로 그리고 종속 관계로 나타냄
  endNote: 1885년 11월 29일 영국군이 만달레이에 들어가 띠버 왕을 인도로 보냈고, 1886년 1월 1일 상버마가 영국령 인도에 병합됨
  features:
    - 도읍은 쉐보·아바·아마라푸라를 거쳐 1857년부터 만달레이
    - 1757년 페구를 함락해 항따와디 왕국을 무너뜨림
    - 1767년 아유타야를 무너뜨림
    - 1785년 아라칸을 병합해 가장 넓은 땅을 가짐
    - 세 차례 영국-버마 전쟁(1824~1826·1852·1885)으로 무너짐
  startEvents: [alaungpaya-1752]
  endEvents: [third-anglo-burmese-war-1885]
  basis:
    type: primary_source
    refs: ["얀다보 조약(1826)", "『콘바웅 왕조 연대기』"]
    foundingNote: 1752년 알라웅브야가 목소보(쉐보)에서 왕을 칭하고 항따와디 왕국에 맞서 일어선 때부터

# 기본값 D3 — 1785-01-02 콘바웅 병합(마지막 버전 1784). from 1429·치타공 늘림은 E3 몫(00-scope 5절 후보). 표기는 위키 ko 표제를 칸이 다시 확인
- id: mrauk-u
  level: polity
  names: { ko: 므라우우 왕국, en: Kingdom of Mrauk U, native: မြောက်ဦး }
  from: 1430
  to: 1784
  color: "#ccc894"
  summary: 벵골만 동쪽 바닷가 아라칸의 왕국. 1430년 민소몬 왕이 므라우우에 도읍을 세웠고, 1459년부터 치타공까지 다스리며 바다 무역으로 번영했고, 1599년에는 따웅우 왕조의 페구를 약탈했음. 1666년 치타공을 무굴 제국에 잃은 뒤 왕권이 약해졌고, 1784년 말 콘바웅 왕조 군대가 쳐들어와 1785년 1월 2일 도읍이 함락되며 끝남
  mapNote: 지도에는 1430년부터 1784년까지 지금 라카인주 땅으로 표시하고, 1459~1665년에는 치타공(지금 방글라데시 치타공·콕스바자르와 앞바다의 산드위프·쿠투브디아·마헤시칼리 섬)을 더함. 1599~1603년 하버마 점령은 되돌려진 일이라 칠하지 않음
  endNote: 1785년 1월 2일 므라우우가 함락되어 아라칸은 콘바웅 왕조에 병합되었고, 마하무니 불상이 아마라푸라로 옮겨짐
  features:
    - 도읍은 므라우우
    - 1430년 민소몬 왕이 도읍을 세움
    - 1459~1665년 치타공을 다스리다 1666년 무굴 제국에 잃음
    - 1785년 콘바웅 왕조에 병합됨
  startEvents: [mrauk-u-1430]
  endEvents: [arakan-conquest-1784]
  basis:
    type: primary_source
    refs: ["『아라칸 연대기』"]
    foundingNote: 1430년 민소몬 왕이 므라우우에 도읍을 세운 때부터(앞서 1429년 벵골 술탄국의 도움으로 아라칸 왕위를 되찾음)


# ══ E2 SC 항목 (시암·캄보디아) ══
# 기본값 D7 + 창구 ③ Q-E1 — 1767~1774 북서쪽 다섯 도(치앙마이·람푼·파야오·치앙라이·매홍손)는 konbaung-dynasty 색, 람빵·난·프래만 란나(vassal_of 콘바웅), 1775~ 여덟 도(시암 vassal_of), 1899-12 몬톤 파얍 편입(1900 thailand). from 1292·1558~1774 버마 지배기는 E3 몫
- id: lan-na
  level: polity
  names: { ko: 란나 왕국, en: Lan Na, native: ล้านนา }
  from: 1292
  to: 1899
  color: "#2828bd"
  summary: 치앙마이를 도읍으로 한 타이 북부 타이유안인의 왕국. 1292년 멩라이가 하리푼차이를 정복해 세우고 1296년 치앙마이를 지었으며, 1558년부터 버마 따웅우 왕조의 지배를 받다가 1727년 치앙마이가 떨어져 나왔으나 1763년 콘바웅 왕조에 다시 정복됨. 1775년 람빵의 카윌라가 버마에 맞서 시암 편으로 돌아서며 시암의 속국이 됨. 카윌라 가문의 왕들이 치앙마이·람빵·람푼을 다스리고 난·프래는 따로 왕을 둠
  endNote: 1899년 쭐랄롱꼰의 지방 개혁으로 시암 직할의 몬톤 파얍이 되었고, 1939년 마지막 치앙마이 왕이 죽은 뒤 왕위가 끊김
  mapNote: 지도에는 1292년부터 1899년까지 지금 타이 북부 여덟 도(치앙마이·람푼·람빵·프래·난·파야오·치앙라이·매홍손) 땅으로 표시함. 1292년 멩라이가 하리푼차이 왕국(치앙마이·람푼)을 정복한 해부터 그리며, 그 앞 멩라이가 다스린 응언양(치앙센)·치앙라이 시기는 하나의 나라 경계를 알 수 없어 칠하지 않음. 15세기 중엽 란나에 들기 전 따로 왕을 둔 난·프래도 처음부터 같은 색으로 칠한 어림이고, 1558~1726년 버마 따웅우 왕조에 종속된 때도 이 색으로 칠하고 종속 관계로만 나타냄. 1763~1774년에는 버마 콘바웅 왕조의 총독이 직접 다스린 치앙마이·람푼·파야오·치앙라이·매홍손을 콘바웅 색으로 칠하고, 토착 군주가 남은 람빵·난·프래만 이 색으로 칠해 종주 관계로 나타냄. 치앙마이·람빵·난·프래 등 여러 므앙이 따로 왕을 둔 묶음을 한 색으로 칠한 어림이며, 1900년부터는 타이 땅으로 이어짐
  features:
    - 도읍은 치앙마이(1296년 멩라이가 세움, 1776~1796년에는 버려져 람빵·빠쌍이 중심)
    - 1558년 버마 따웅우 왕조에 정복되어 1727년까지 버마의 종속을 받음
    - 1775년 카윌라와 짜반이 시암의 딱신과 손잡고 버마군을 몰아냄
    - 버마의 침입을 막는 시암의 북쪽 울타리였고, 19세기 말 영국 목재 회사가 들어옴
    - 1899년 몬톤 파얍으로 시암에 편입
  startEvents: [mangrai-lan-na-1262]
  endEvents: [monthon-reform-1892]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Chiang Mai", "위키백과 Kawila"]
    foundingNote: 멩라이가 1292년 하리푼차이를 정복해 왕국을 세운 해를 시작으로 봄(치앙마이 건설은 1296년)

# E2 뼈대 기본값 K1(조사 R-A가 다루지 않은 땅, 1만 km² 넘고 5만 미만) — 1786 시암 정복 뒤 vassal_of thailand, 1808 일곱 무앙으로 나뉜 뒤도 이어진 1만 km² 넘는 묶음이라 같은 항목, 1902 직할(E1 1900~ thailand는 2년 어긋남 — 기준 안). 해·범위는 칸이 사료로 확인
- id: patani-sultanate
  level: polity
  names: { ko: 파타니 술탄국, en: Patani Sultanate, native: Kesultanan Patani }
  from: 1457
  to: 1902
  color: "#c97a45"
  summary: 말레이반도 북동쪽 바닷가의 말레이 술탄국. 15세기 중엽 왕이 이슬람으로 개종하며 술탄국이 되었고, 16~17세기에는 네 여왕 아래 남중국해 교역 항구로 번성함. 1786년 시암의 라마 1세에게 정복되어 시암의 속국이 됨
  endNote: 1808년 반란 뒤 시암이 일곱 므앙으로 나누어 다스렸고, 1902년 마지막 라자들이 물러나며 시암 직할이 됨. 1909년 영국–시암 조약으로 시암 땅에 남음
  mapNote: 지도에는 1457년부터 1899년까지 지금 타이 남부 빠따니·얄라·나라티왓 세 도 땅으로 표시함. 1457년 앞은 랑카수카 뒤의 작은 항구 나라들이라 비워 둠. 1786년 시암의 속국이 되고 1808년 일곱 므앙으로 나뉜 뒤에도 같은 색으로 칠함. 옛 파타니 땅이던 송클라 남쪽 일부(1만 km² 미만)는 시암 색으로 칠한 어림이고, 1902년 시암 직할이 되었으나 1900년부터 타이 땅으로 이어 칠함
  features:
    - 도읍은 파타니 항구(지금 빠따니 읍 둘레)
    - 1584~1688년 네 여왕의 치세에 중국·일본·유럽 상인이 드나든 교역 항구
    - 1786년 시암에 정복되어 큰 대포 파야타니를 방콕에 빼앗김
    - 1808년 반란 뒤 빠따니·농찍·야링·얄라·라만·라응애·사이부리 일곱 므앙으로 나뉨
  startEvents: [patani-1457]
  endEvents: [monthon-reform-1892]
  basis:
    type: primary_source
    refs: ["위키백과 Sultanate of Patani", "위키백과 Pattani Province"]
    foundingNote: 왕 인타라가 이슬람으로 개종해 술탄국이 된 15세기 중엽(1457년 무렵)을 시작으로 봄


