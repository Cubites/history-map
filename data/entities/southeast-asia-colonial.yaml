# 기본값 B5 — 법적 국경(술루·민다나오 포함, 실효 지배 밖은 mapNote), vassal_of spain, 1898 american-philippines. from 1565는 E3가 앞을 칠함
- id: spanish-philippines
  level: polity
  names: { ko: 스페인령 필리핀, en: Spanish Philippines, native: Capitanía General de Filipinas }
  from: 1565
  to: 1897
  color: "#ae65d2"
  summary: 스페인이 마닐라를 도읍으로 다스린 필리핀 제도의 식민지. 1565년 레가스피가 세부에 첫 정착지를 세우고 1571년 마닐라를 도읍으로 삼았으며, 마닐라와 멕시코 아카풀코를 잇는 갈레온 무역으로 아시아와 아메리카를 이었음. 1762~1764년 칠년 전쟁 때 영국군이 마닐라를 점령했다가 돌려주었고, 1872년 카비테 반란 뒤 민족 운동이 자라 1896년 필리핀 혁명이 일어남. 1898년 미국-스페인 전쟁에서 진 스페인이 파리 조약으로 이 땅을 미국에 넘김
  mapNote: 지도에는 1565년부터 1897년까지 표시함. 1565년 비사야, 1571년 루손 중·남부·비콜·민도로(이듬해 정복한 일로코스·팡가시난도 함께), 1583년 카가얀 골짜기, 1596년 민다나오 북동부 카라가를 정복한 해마다 넓혀 그렸고, 1767년부터 1898년 파리 조약이 정한 필리핀 땅 전체로 그림. 술루 군도와 민다나오의 술탄국 땅(지금 삼보앙가·라나오 남부·코타바토·다바오), 루손 북부 코르디예라 산지, 팔라완처럼 스페인의 다스림이 실제로 미치지 않던 곳은 1766년까지 비워 두었고, 1767년부터 조약상 주권에 따라 이 나라 색으로 칠함. 1762~1764년 영국의 마닐라 점령은 되돌려져 칠하지 않음
  endNote: 1898년 12월 10일 파리 조약으로 필리핀 제도를 미국에 넘겨 스페인의 다스림이 끝남
  features:
