  color: "#b29934"
  summary: 술루 군도의 홀로섬을 도읍으로 보르네오 동북 바닷가까지 거느린 이슬람 술탄국. 1578년 브루나이의 종주에서 벗어났고, 바다 무역과 노예 사냥으로 힘을 떨쳤으며, 17세기 브루나이 내전을 도운 대가로 보르네오 동북부를 받았다고 내세움. 스페인과 오래 싸우다 1851년 조약으로 스페인의 보호를 받아들였고, 1876년 스페인군이 홀로를 점령함. 1878년 1월 보르네오 땅을 오버벡에게 넘겨주었고, 같은 해 7월 의정서로 스페인의 주권을 인정함
  mapNote: 지도에는 1704년부터 1877년까지 보르네오 동북부(지금 사바주의 마루두만에서 타와우에 이르는 판다산강 동쪽)로 표시함. 술탄국은 1405년 무렵 섰으나 도읍 둘레 술루 군도가 1만 km²에 못 미쳐, 브루나이 술탄이 내전을 도운 보답으로 보르네오 동북부를 넘겼다고 적는 1704년부터 그림(1658년이나 1673년으로 적는 자료, 넘기지 않았다는 자료도 있음). 술루 군도는 1766년까지 비워 두었고 1767년부터는 스페인이 주권을 내세운 땅이라 스페인령 필리핀 색으로 칠했으며, 술탄이 그곳을 실제로 다스린 일은 글로만 보임. 1878년 양허 뒤 이 땅은 영국 북보르네오 회사 쪽으로 넘어감
  endNote: 1915년 미국과 맺은 카펜터 협정으로 술탄이 세속 권력을 내려놓아 술탄국의 다스림이 끝남
