# ── 유럽 나라의 남은 식민지 ──
- id: french-india
  level: polity
  names: { ko: 프랑스령 인도, en: French India, native: Inde française }
  from: 1674
  to: 1954
  color: "#5a70b0"
  summary: 인도 해안의 프랑스 상관 다섯 곳(퐁디셰리·카리칼·마헤·야남·샨데르나고르)을 묶은 식민지. 1950년 샨데르나고르를 인도에 넘겼고(1954년 서벵골 편입), 나머지 넷은 1954년 11월 1일 사실상 인도에 넘어감
  mapNote: 지도에는 1757년부터 1953년까지 지금 푸두체리 연방 직할지 땅으로 따로 표시함(1만 km² 미만이지만 다른 나라의 식민지라 따로 그림). 1761~1765년·1778~1783년·1793~1816년 영국 점령은 모두 돌려받아 프랑스 땅으로 그림. 샨데르나고르는 서벵골 땅에 묶여 그 땅의 색
  endNote: 1954년 11월 1일 사실상 인도에 넘어갔고, 1956년 이양 조약을 맺어 1962년 프랑스 의회가 비준함
  features:
    - 도읍은 퐁디셰리
    - 18세기 뒤플렉스 때 영국과 인도 남부를 다툰 거점
    - 1761년 영국군이 퐁디셰리를 무너뜨렸으나 1763년 파리 조약으로 돌려받음
  startEvents: []
  endEvents: [indian-enclaves-1954]
  basis:
    type: primary_source
    refs: ["인도·프랑스 이양 조약(1956)"]
    foundingNote: 프랑수아 마르탱이 퐁디셰리에 상관을 연 1674년부터

- id: portuguese-india
  level: polity
  names: { ko: 포르투갈령 인도, en: Portuguese India, native: Estado da Índia }
  from: 1510
  to: 1961
  color: "#6a9a5a"
  summary: 인도 서해안의 고아·다만·디우와 내륙의 다드라·나가르 하벨리를 묶은 포르투갈의 식민지. 1510년 고아 점령에서 시작해 인도양 무역의 중심이었으며, 인도 독립 뒤에도 포르투갈이 넘기기를 거부함. 1954년 다드라·나가르 하벨리가 떨어져 나감
  mapNote: 지도에는 1757년부터 1960년까지 지금 고아주와 다드라 나가르 하벨리 다만 디우 땅으로 따로 표시하고(1만 km² 미만이지만 다른 나라의 식민지라 따로 그림, 고아는 1763~1788년 신정복지까지 넣어 어림함, 다드라·나가르 하벨리는 1779년 조약 뒤 마라타에게서 얻었으나 1만 km² 미만이라 1757년부터 함께 그림), 다드라·나가르 하벨리는 1954년부터 1960년까지 비움
  endNote: 1961년 12월 18~19일 인도군이 고아·다만·디우에 들어가 포르투갈 총독이 항복했고, 1974년 포르투갈이 인도 주권을 인정함
  features:
    - 도읍은 1759년부터 판짐(노바고아), 그 전 옛 고아
    - 1763~1788년 폰다·산게·페르넹 등 신정복지를 얻어 고아 땅이 크게 늚
    - 1954년 다드라·나가르 하벨리는 주민 의용군이 차지해 1961년 인도에 편입됨
  startEvents: []
  endEvents: [indian-enclaves-1954]
  basis:
    type: primary_source
    refs: ["인도·포르투갈 조약(1974)"]
    foundingNote: 포르투갈이 고아를 점령한 1510년부터
