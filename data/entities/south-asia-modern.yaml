# south-asia modern 나라 (시대 파일 scripts/geo/areas/south-asia/modern.mjs의 짝 항목 파일)
# 시대·범위: 1947~현재: 분할 뒤 나라들
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'south-asia-modern').
# 남아시아 S1(2026-11-02): 인도·파키스탄은 이름만 바뀐 것(자치령 → 공화국)을 한 항목으로 잇는다. 식민지(실론 1947, 프랑스령·포르투갈령 인도)와 보호국(시킴)은 따로 항목(vassal_of 본국),
#   1947년 말 어느 쪽에도 가입하지 않은 토후국(하이데라바드 주, 칼라트 칸국과 카란·마크란·라스벨라)은 1947년 한 해 따로 항목(운영자 결정 2).
#   네팔·부탄·시킴·실론·하이데라바드 주·칼라트 무리의 1947년 앞 모습은 S2(1757~1946)가 같은 항목을 앞으로 늘려 그린다. startEvents·endEvents는 사건 묶음 sa-08이 채운다.

# ── 인도·파키스탄·방글라데시 ──
- id: india
  level: polity
  names: { ko: 인도, en: India, native: भारत }
  from: 1947
  to: null
  color: "#e0a040"
  summary: 영국령 인도의 분할로 1947년 8월 15일 독립한 남아시아의 연방 공화국. 자치령으로 출발해 1950년 1월 26일 헌법 시행과 함께 공화국이 되었고, 초대 총리 네루 아래 토후국 500여 곳을 통합함. 1948년 하이데라바드, 1954년 프랑스령 인도, 1961년 포르투갈령 고아, 1975년 시킴을 차례로 넣음. 카슈미르를 두고 파키스탄과 1947·1965·1999년에 싸웠고 1962년 중국과 국경 전쟁을 치름
  mapNote: 지도에는 1947년부터 지금 인도 땅으로 표시하고, 하이데라바드 주(1947), 프랑스령 인도(1947~1953), 포르투갈령 인도(1947~1960), 시킴(1947~1974)은 따로 그림. 잠무 카슈미르 주(토후국)는 1947년 10월 26일 인도 가입 문서에 서명했고, 1947~1948년 전쟁 뒤 1949년 1월 1일 휴전선(1972년 심라 협정 뒤 통제선)으로 인도와 파키스탄이 나누어 다스림. 지도는 이 실효 지배선대로 그리며, 인도·파키스탄 모두 옛 토후국 전체를 자기 땅으로 보고 중국은 악사이친을 다스림. 시아첸 빙하는 1984년 인도군 점거부터 인도 쪽에 넣음. 1947~1948년에는 지도의 중화민국 경계가 맥마흔선 남쪽(아루나찰 쪽 약 3.4만 km²)까지 덮어 그 땅을 인도에 넣지 않았고, 1949년부터 넣음. 주나가드(1947년 11월 인도 접수)는 1947년부터 인도 쪽
  features:
    - 도읍은 뉴델리
    - 1950년 헌법으로 연방 의회 민주주의와 주 정부를 둠
    - 1956년 주 재편법으로 언어에 따라 주 경계를 다시 그음
    - 1974년 첫 핵실험, 1998년 공개 핵실험
  startEvents: [partition-1947, india-constitution-1950]
  endEvents: []
  basis:
    type: primary_source
    refs: ["인도 독립법(1947)", "인도 헌법(1950)"]
    foundingNote: 인도 독립법에 따라 자치령 인도가 선 1947년 8월 15일부터

- id: pakistan
  level: polity
  names: { ko: 파키스탄, en: Pakistan, native: پاکستان }
  from: 1947
  to: null
  color: "#3f8f5a"
  summary: 영국령 인도의 무슬림 다수 지역이 나뉘어 1947년 8월 14일 독립한 나라. 진나가 이끈 무슬림 연맹의 요구로 서쪽(펀자브 서부·신드·북서 변경·발루치스탄)과 1,600 km 넘게 떨어진 동벵골로 출발함. 1956년 3월 23일 첫 헌법으로 이슬람 공화국이 되었고, 1971년 내전과 인도와의 전쟁 끝에 동쪽이 방글라데시로 독립함
  mapNote: 지도에는 1947년부터 서파키스탄과 동벵골(1955년부터 동파키스탄)을 함께 표시하고, 1971년부터 서쪽만 표시함. 칼라트 칸국과 카란·마크란·라스벨라는 1947년 한 해 따로 그리고 1948년 가입부터 넣음. 카슈미르는 1949년 휴전선(1972년 뒤 통제선) 서쪽의 아자드 카슈미르와 길기트·발티스탄을 1947년부터 넣음. 오만 땅이던 과다르(1958년 9월 파키스탄에 넘어감)는 1만 km² 미만이라 처음부터 파키스탄 쪽에 둠
  features:
    - 도읍은 카라치(1947~1959), 1967년부터 이슬라마바드
    - 1958년 아유브 칸의 쿠데타 뒤 여러 차례 군정이 이어짐
    - 1963년 중국과 국경 협정을 맺어 샥스감 골짜기 쪽을 중국에 넘김
    - 1998년 공개 핵실험
  startEvents: [partition-1947]
  endEvents: []
  basis:
    type: primary_source
    refs: ["인도 독립법(1947)", "파키스탄 헌법(1956)"]
    foundingNote: 인도 독립법에 따라 자치령 파키스탄이 선 1947년 8월 14일부터

- id: bangladesh
  level: polity
  names: { ko: 방글라데시, en: Bangladesh, native: বাংলাদেশ }
  from: 1971
  to: null
  color: "#2f8f86"
  summary: 동파키스탄이 1971년 독립 전쟁으로 파키스탄에서 떨어져 나와 세운 벵골어권 공화국. 1970년 총선에서 이긴 아와미 연맹의 셰이크 무지부르 라만이 체포된 뒤 3월 26일 독립이 선언되었고, 인도군이 들어온 뒤 12월 16일 다카의 파키스탄군이 항복함
  mapNote: 지도에는 파키스탄군이 항복한 1971년부터 지금 방글라데시 땅으로 표시함. 2015년 인도와의 월경지 교환은 1만 km² 미만이라 그리지 않음
  features:
    - 도읍은 다카
    - 1952년 벵골어를 국어로 인정하라는 언어 운동이 독립 운동의 뿌리가 됨
    - 1975년 무지부르 라만이 쿠데타로 살해됨
  startEvents: [bangladesh-liberation-1971]
  endEvents: []
  basis:
    type: primary_source
    refs: ["방글라데시 독립 선언(1971)", "방글라데시 헌법(1972)"]
    foundingNote: 파키스탄군이 다카에서 항복한 1971년 12월 16일부터(독립 선언은 3월 26일)

# ── 히말라야의 왕국들 ──
- id: nepal
  level: polity
  names: { ko: 네팔, en: Nepal, native: नेपाल }
  from: 1768
  to: null
  color: "#8a5fb0"
  summary: 히말라야 남쪽 기슭의 내륙 나라로, 고르카의 프리트비 나라얀 샤가 1768년 카트만두 골짜기를 차지해 세운 샤 왕조의 왕국에서 비롯함. 1790년까지 동서 산지의 소국들과 쿠마온을 아울렀으나 1814~1816년 앵글로-네팔 전쟁에서 져 수가울리 조약으로 쿠마온·가르왈과 서쪽 산지, 테라이 일부를 영국에 넘김. 1846년부터 재상 가문 라나가 실권을 쥐었으나 1951년 트리부반 왕의 복귀로 라나 정권이 끝남. 1996~2006년 마오주의 반군과의 내전 뒤 2008년 5월 28일 제헌 의회가 왕정을 없애고 연방 민주 공화국이 됨
  mapNote: 지도에는 1768년 카트만두 골짜기와 둘레, 1774년 동부, 1790년 서부와 쿠마온, 1803년 가르왈과 시르무르·심라 산지를 더해 그렸고, 1815년 앵글로-네팔 전쟁으로 서쪽 땅을 내준 뒤 지금 네팔 땅으로 표시함. 통일 전 산지 소국들의 땅은 비움. 1816~1860년 영국이 가졌던 서부 테라이(약 9,200 km²)는 네팔 땅에 둠. 북쪽 국경은 동아시아 지도의 중국 경계를 따르고 1961년 중국과의 국경 조약에 따른 변화는 그리지 않음
  features:
    - 도읍은 카트만두
    - 1792년 청과의 전쟁 뒤 5년마다 베이징에 사절을 보냄
    - 1923년 영국과의 조약으로 독립을 확인받음
    - 1950년 인도와 평화 우호 조약을 맺음
    - 2015년 새 헌법으로 일곱 주를 둔 연방제를 정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["수가울리 조약(1815)", "인도·네팔 평화 우호 조약(1950)", "네팔 헌법(2015)"]
    foundingNote: 샤 왕조의 프리트비 나라얀이 카트만두 골짜기를 차지한 1768년의 왕국을 이음

- id: bhutan
  level: polity
  names: { ko: 부탄, en: Bhutan, native: འབྲུག་ཡུལ་ }
  from: 1616
  to: null
  color: "#5f7fc8"
  summary: 동부 히말라야의 불교 왕국으로, 1616년 티베트에서 온 샤브드룽 응아왕 남걀이 둑파 카규파의 나라로 묶음. 1865년 두아르 전쟁에 져 신출라 조약으로 남쪽 산기슭 두아르와 칼림퐁을 영국에 넘김. 1907년 우겐 왕추크가 세습 왕위에 오른 왕추크 왕조가 다스림. 1949년 인도와 조약을 맺어 외교에 인도의 조언을 받기로 하고 데왕기리 땅을 돌려받았으며, 1971년 국제 연합에 가입함. 2008년 첫 총선과 헌법으로 입헌 군주국이 됨
  mapNote: 지도에는 1757년부터 1864년까지 지금 부탄 땅에 서벵골·아삼 쪽 두아르와 칼림퐁(약 1.2만 km²)을 더해 그렸고, 1865년부터 지금 부탄 땅으로 표시함. 아삼 두아르는 1841년 영국이 거뒀으나(1만 km² 미만) 1865년까지 부탄 쪽에 둠. 북쪽 국경은 동아시아 지도의 중국 경계를 따름
  features:
    - 도읍은 푸나카, 1955년부터 팀푸
    - 1910년 푸나카 조약으로 외교에 영국의 조언을 받기로 함
    - 티베트 불교 둑파 카규파가 나라의 종교
    - 1972년 즉위한 지그메 싱게 왕추크가 국민 총행복을 내세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["신출라 조약(1865)", "인도·부탄 우호 조약(1949)", "부탄 헌법(2008)"]
    foundingNote: 샤브드룽 응아왕 남걀이 부탄에 들어와 나라를 묶기 시작한 1616년부터

- id: sikkim
  level: polity
  names: { ko: 시킴 왕국, en: Kingdom of Sikkim, native: འབྲས་ལྗོངས་ }
  from: 1861
  to: 1975
  color: "#3f9a7a"
  summary: 네팔과 부탄 사이 히말라야의 작은 불교 왕국으로, 1642년부터 남걀 왕조(초걀)가 다스림. 1861년 툼롱 조약으로 영국의 간섭을 받게 되었고 1890년 영국·청 협약으로 영국의 보호국으로 정해짐. 1947년 영국이 떠난 뒤 1950년 12월 인도와 조약을 맺어 국방·외교를 인도에 맡기는 보호국이 됨
  mapNote: 지도에는 1861년부터 1974년까지 따로 표시함(1만 km² 미만이지만 조약으로 따로 다뤄진 보호국이라 지금 시킴주 땅 그대로 그림). 1861년 전에는 1만 km² 미만 독립 왕국이라 비움
  endNote: 1975년 4월 국민 투표로 왕정 폐지와 인도 편입이 정해지고, 5월 16일 인도의 22번째 주가 됨
  features:
    - 도읍은 툼롱, 1894년부터 강토크
    - 1950년 조약 뒤 인도가 국방·외교·교통을 맡음
    - 1973년 반왕정 시위 뒤 인도가 행정에 깊이 관여함
  startEvents: []
  endEvents: [sikkim-merger-1975]
  basis:
    type: primary_source
    refs: ["툼롱 조약(1861)", "인도·시킴 조약(1950)", "인도 헌법 제36차 개정(1975)"]
    foundingNote: 남걀 왕조의 첫 초걀이 즉위한 1642년의 왕국을 이음

# ── 실론·스리랑카 ──
- id: british-ceylon
  level: polity
  names: { ko: 영국령 실론, en: British Ceylon, native: ලංකාව }
  from: 1796
  to: 1948
  color: "#9a7ab8"
  summary: 인도양의 섬 실론을 영국이 다스린 직할 식민지. 1796년 네덜란드에게서 해안을 빼앗고 1815년 칸디 왕국을 무너뜨려 섬 전체를 다스렸으며, 차·고무 농장을 열고 남인도 타밀인 노동자를 데려옴. 1931년 도너모어 헌법으로 보통 선거를 들임
  mapNote: 지도에는 1796년부터 1814년까지 옛 네덜란드령 바닷가 지구를, 1815년부터 1947년까지 섬 전체를 표시함. 바닷가와 내륙 사이 경계는 지금 지구 경계로 어림함
  endNote: 1948년 2월 4일 영연방 안의 자치령 실론으로 독립함
  features:
    - 도읍은 콜롬보
    - 1802년 아미앵 조약으로 영국 땅이 되어 왕실 직할 식민지가 됨
    - 1946년 소울버리 헌법으로 내각제 자치 정부를 준비함
    - 차 수출이 식민지 경제의 중심
  startEvents: []
  endEvents: [ceylon-independence-1948]
  basis:
    type: primary_source
    refs: ["아미앵 조약(1802)", "칸디 협약(1815)", "실론 독립법(1947)"]
    foundingNote: 영국군이 네덜란드령 바닷가 땅을 차지한 1796년부터

- id: sri-lanka
  level: polity
  names: { ko: 스리랑카, en: Sri Lanka, native: ශ්‍රී ලංකාව }
  from: 1948
  to: null
  color: "#c8785a"
  summary: 인도 남동쪽 섬나라로, 1948년 2월 4일 자치령 실론으로 독립해 1972년 5월 22일 공화국 스리랑카가 됨. 1956년 싱할라어만을 공용어로 한 법 뒤 싱할라인과 타밀인의 갈등이 깊어졌고, 1983년부터 2009년까지 정부군과 타밀 일람 해방 호랑이의 내전이 이어짐
  mapNote: 지도에는 1948년부터 지금 스리랑카 땅으로 표시하고, 1972년 나라 이름이 바뀐 뒤에도 같은 색으로 그림
  features:
    - 도읍은 콜롬보, 1982년부터 의회는 스리자야와르데네푸라코테
    - 1960년 시리마보 반다라나이케가 세계 첫 여성 총리가 됨
    - 1978년 헌법으로 대통령 중심제를 둠
  startEvents: [ceylon-independence-1948]
  endEvents: []
  basis:
    type: primary_source
    refs: ["실론 독립법(1947)", "스리랑카 헌법(1972)"]
    foundingNote: 자치령 실론이 선 1948년 2월 4일부터

# ── 1947년 말 어느 쪽에도 가입하지 않은 토후국 ──
- id: hyderabad-state
  level: polity
  names: { ko: 하이데라바드 주, en: Hyderabad State, native: حیدرآباد }
  from: 1724
  to: 1948
  color: "#7a9a3a"
  summary: 데칸 고원의 가장 큰 토후국으로, 1724년 무굴의 데칸 태수 니잠 울물크(아사프 자 1세)가 자립해 세운 아사프 자 왕조의 니잠이 다스림. 1766년 북부 시르카르를 동인도 회사에 넘겼고, 1798년 보조 동맹으로 영국의 보호를 받아 1800년 양도 지구, 1853년 베라르를 내줌. 1947년 마지막 니잠 오스만 알리 칸이 인도·파키스탄 어느 쪽에도 가입하지 않고 독립을 바랐고, 11월 29일 인도와 1년 정지 협정을 맺음
  mapNote: 지도에는 1757년부터 텔랑가나·마라트와다·칼랴나 카르나타카를 표시하고, 1765년까지 북부 시르카르(지금 해안 안드라 북부와 오리사 남부 간잠·코라푸트 쪽), 1787년까지 구투르, 1852년까지 베라르(지금 아마라바티 구역)를 더함. 쿠르눌·카다파·아난타푸르·벨라리 쪽은 1778년까지 니잠 땅, 쿠르눌·카다파는 1792~1799년, 아난타푸르·벨라리는 1799년에 다시 니잠 땅으로 그림. 1947년에는 지금 텔랑가나주와 마하라슈트라주의 마라트와다, 카르나타카주의 북동부 다섯 지구를 어림한 선으로 그림(1941년 넓이 약 21.4만 km²)
  endNote: 1948년 9월 13~17일 인도군의 폴로 작전으로 니잠이 항복하고 인도에 병합됨
  features:
    - 도읍은 1763년까지 아우랑가바드, 그 뒤 하이데라바드
    - 주민 대부분은 힌두교도, 니잠과 지배층은 무슬림
    - 1798년 보조 동맹으로 프랑스 장교의 군대를 해산하고 영국군을 둠
    - 1946년부터 텔랑가나 농민 봉기와 라자카르 민병대의 충돌이 이어짐
  startEvents: []
  endEvents: [hyderabad-polo-1948]
  basis:
    type: primary_source
    refs: ["보조 동맹 조약(1798)", "인도·하이데라바드 정지 협정(1947)"]
    foundingNote: 니잠 울물크가 샤카르 케다 전투에서 이겨 데칸에서 자립한 1724년부터

- id: kalat
  level: polity
  names: { ko: 칼라트 칸국, en: Khanate of Kalat, native: قلات }
  from: 1666
  to: 1948
  color: "#8a6a4a"
  summary: 발루치스탄 중부의 브라후이·발루치 칸국으로, 17세기 말부터 아흐마드자이 가문의 칸이 다스림. 나시르 칸 1세(1749~1794) 때 가장 넓었고, 1854년 조약과 1876년 마스퉁 조약으로 영국 보호를 받으며 퀘타·볼란·누시키·나시라바드를 영국에 빌려줌. 1947년 8월 칸 아흐마드 야르 칸이 독립을 선언하고 파키스탄과 정지 협정을 맺었으며, 카란·마크란·라스벨라를 자기 속령으로 봄
  mapNote: 지도에는 1757년부터 1947년까지 칼라트·쿠즈다르·마스퉁·카치 쪽을 어림한 같은 선으로 표시함(1947년은 어느 쪽에도 가입하지 않은 해). 임차지 퀘타·볼란·누시키·나시라바드는 각각 1만 km² 미만이라 나누지 않음
  endNote: 1948년 3월 27일 칸이 파키스탄 가입 문서에 서명함
  features:
    - 도읍은 칼라트
    - 사라완·잘라완 두 부족 연합과 카치 평야를 다스림
    - 1952년 이웃 토후국들과 발루치스탄 연합을 이루었다가 1955년 서파키스탄에 합쳐짐
  startEvents: []
  endEvents: [princely-integration-1948]
  basis:
    type: primary_source
    refs: ["칼라트 독립 선언(1947)", "칼라트 가입 문서(1948)"]
    foundingNote: 1666년 미르 아흐마드 1세가 아흐마드자이 가문의 칸국을 연 해

- id: kharan
  level: polity
  names: { ko: 카란 주, en: Kharan State, native: خاران }
  from: 1697
  to: 1948
  color: "#d8c070"
  summary: 발루치스탄 서북부 사막의 토후국으로, 나우셰르와니 가문이 다스림. 영국과 보조 동맹을 맺은 나라였고 칼라트 칸은 자기 속령으로 봄
  mapNote: 지도에는 1757년부터 1947년까지 지금 카란·와슈크 지구를 어림한 같은 선으로 표시함(약 4.8만 km²)
  endNote: 1948년 3월 17일 칼라트와 따로 파키스탄 가입이 받아들여짐
  features:
    - 도읍은 카란
    - 이란과 맞닿은 마슈켈 쪽까지 사막이 넓음
  startEvents: []
  endEvents: [princely-integration-1948]
  basis:
    type: primary_source
    refs: ["카란 가입 문서(1948)"]
    foundingNote: 1697년 나우셰르와니 가문이 카란을 다스리기 시작한 해

- id: makran
  level: polity
  names: { ko: 마크란 주, en: Makran State, native: مکران }
  from: 1740
  to: 1948
  color: "#6aa040"
  summary: 아라비아해 기슭 발루치스탄 남서부의 토후국으로, 기치키 가문의 나와브가 다스림. 영국과 보조 동맹을 맺은 나라였고 칼라트 칸은 자기 속령으로 봄. 바닷가의 과다르는 1958년까지 오만 땅
  mapNote: 지도에는 1757년부터 1947년까지 지금 과다르·케치·판즈구르 지구를 어림한 같은 선으로 표시함(1951년 넓이 약 6만 km²). 오만 땅 과다르(1783년부터)는 1만 km² 미만이라 나누지 않음
  endNote: 1948년 3월 칼라트와 따로 파키스탄 가입을 알림
  features:
    - 도읍은 케치(투르바트)
    - 판즈구르·툼프에 기치키 가문의 갈래가 있었음
  startEvents: []
  endEvents: [princely-integration-1948]
  basis:
    type: primary_source
    refs: ["마크란 가입 문서(1948)"]
    foundingNote: 1740년대 기치키 가문의 물라 무라드가 케치 골짜기를 차지한 때부터 봄

- id: las-bela
