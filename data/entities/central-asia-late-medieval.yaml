# central-asia late-medieval 나라 (시대 파일 scripts/geo/areas/central-asia/late-medieval.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1220~1499: 몽골·차가타이·티무르
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-late-medieval').
# 칸 나눔(C3 뼈대 2026-11-06, ca3/c3/COMMON.md 4·5·6절): 구현 칸 W3·E3·J는 아래 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다(색은 C3 뼈대 skel/de.mjs로 이웃과 ΔE 26 넘게 고름).
#   from·to는 표의 값 — 끝·시작 해는 정의 칸이 사료로 한 번 확인한다(다르면 결과 노트 2절). 항목 to는 끝 해 포함, 지도는 칠하는 마지막 해까지. native는 정의 칸이 원어판 위키로 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis.foundingNote도 그 칸이 더함 — COMMON 6절 탭 칸, startEvents·endEvents는 사건 ca-02·ca-03 몫이라 빈 목록 그대로).
#   다른 칸이 칠하기만 하는 땅의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다(COMMON 5절).
# 늘린 나라(서아시아·남아시아·동아시아·내륙아시아·유럽 yaml)는 이 파일에 두지 않고 그 파일 블록에서 고친다(COMMON 5절 굵은 칸만, 그 나라 글만).

# ══ C3 W3 항목 ══
- id: chagatai-khanate
  level: polity
  names: { ko: 차가타이 칸국, en: Chagatai Khanate, native: چغتای خانلیغی }
  from: 1227
  to: 1370
  color: "#d4c040"
  summary: 칭기즈 칸의 둘째 아들 차가타이의 울루스에서 비롯한 몽골 칸국. 1227년 칭기즈 칸이 죽은 뒤 차가타이가 알말리크에서 아무다리야에 이르는 땅을 물려받았고, 트란스옥시아나와 세미레치예·타림 분지를 다스리다 1260년 알구 때부터 대칸에게서 사실상 떨어져 나옴
  endNote: 1347년 무렵 동쪽은 모굴리스탄으로 갈라졌고, 서쪽 트란스옥시아나는 카자간과 그 뒤를 이은 튀르크 아미르들이 실권을 쥠. 1370년 티무르가 발흐에서 권력을 잡은 뒤로 칸은 티무르가 세운 꼭두각시로만 남음
  mapNote: 지도에는 1227년부터 1369년까지. 서쪽은 트란스옥시아나(부하라·사마르칸트·카르시·후잔드·페르가나·타슈켄트·히사르)를 그리고 1264~1360년 호라즘 남쪽(히바 쪽)을 더함. 동쪽은 세미레치예·이리·톈산 안쪽·타림 서쪽(카슈가르·악수·호탄)을 1346년까지 그린 뒤, 1347년부터 모굴리스탄으로 넘김. 1227~1259년은 몽골 제국의 신하로 표시. 카이두의 오고타이 울루스는 따로 나누지 않고, 발흐·카불 쪽 카라우나스 군단 땅은 비움
  features:
    - 처음 본거지는 이리 골짜기의 알말리크
    - 1260~1264년 알구가 호라즘 남쪽과 트란스옥시아나를 굳게 쥠
    - 1269년 무렵부터 1301년까지 오고타이 가문의 카이두가 실권을 쥠
    - 1346년 카자간이 카잔 칸을 죽인 뒤 서쪽은 아미르들이 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Chagatai Khanate", "위키백과 Sufi dynasty"]
    foundingNote: 칭기즈 칸이 죽고 차가타이가 울루스를 물려받은 1227년부터

- id: kart-dynasty
  level: polity
  names: { ko: 헤라트의 카르트 왕조, en: Kart dynasty, native: آل کرت }
  from: 1245
  to: 1381
  color: "#6240bf"
  summary: 몽골의 신하로 헤라트를 다스린 타지크계 왕조. 1245년 무렵 샴스 앗딘 카르트가 헤라트를 맡은 뒤 몽골 대칸과 일 칸국을 종주로 받들며 헤라트·바드기스·고르와 시스탄 쪽을 다스림
  endNote: 1381년 4월 티무르가 헤라트를 차지했고, 마지막 군주 피르 알리는 1383년 반란 뒤 처형됨
  mapNote: 지도에는 1245년부터 1380년까지. 헤라트·바드기스·파라·니므로즈와 하자라 산지 밖 고르를 그리고, 1281년부터 칸다하르·자불·헬만드를 더함. 1245~1259년 몽골 제국, 1260~1334년 일 칸국, 1338~1348년 토가 테무르의 신하로 표시. 카불·가즈니 쪽 카라우나스 군단 땅은 그리지 않음. 경계는 지금 주 경계에 기댄 어림
  features:
    - 도읍은 헤라트
    - 1251년 몽케 칸이 헤라트·시스탄·카불 쪽 권한을 줌
    - 1342년 자바 싸움에서 사르바다르 왕조를 물리침
    - 1349년 무렵부터 누구에게도 조공하지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kart dynasty", "위키백과 Kandahar"]
    foundingNote: 샴스 앗딘 카르트가 헤라트를 맡은 1245년 무렵부터

- id: sufi-dynasty
  level: polity
  names: { ko: 호라즘의 수피 왕조, en: Sufi dynasty, native: صوفیان }
  from: 1361
  to: 1388
  color: "#96404c"
  summary: 호라즘을 다스린 쿵그라트 부족 가문의 왕조로, 이름의 '수피'는 신비주의 수피즘과 관계없는 가문 이름. 킵차크 칸국이 흔들린 1360년 무렵 후사인 수피가 우르겐치를 도읍으로 자립해 호라즘 북쪽과 남쪽을 하나로 다스림
  endNote: 1372년 남쪽 카트·히바를 티무르에게 넘기고 1379년 우르겐치가 함락된 뒤 티무르 아래 남았으나, 1387년 술레이만 수피가 반란을 일으키자 1388년 티무르가 우르겐치를 무너뜨려 끝남
  mapNote: 지도에는 1361년부터 1387년까지. 1361~1371년 아무다리야 왼쪽 기슭 오아시스 전부, 1372년부터 북쪽 우르겐치 쪽만 그림. 오른쪽 기슭 카트 쪽은 좁아 나누지 않음. 북쪽과 남쪽의 경계는 어림
  features:
    - 도읍은 우르겐치
    - 1361년 무렵 후사인 수피가 킵차크 칸국에서 자립함
    - 1372년 유수프 수피가 카트·히바를 티무르에게 넘김
    - 1379년 티무르가 우르겐치를 함락한 뒤로 티무르의 신하로 남음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Sufi dynasty", "위키백과 Khwarazm"]
    foundingNote: 후사인 수피가 킵차크 칸국에서 자립한 1361년부터

# ══ C3 E3 항목 ══
# 글은 E3 칸이 채움 — 1500~1513은 J 칸(C2 early-modern.mjs)
- id: moghulistan
  level: polity
  names: { ko: 모굴리스탄, en: Moghulistan, native: مغولستان }
  from: 1347
  to: 1513
  color: "#a1cb86"
  summary: 차가타이 칸국이 갈라진 뒤 동쪽 세미레치예·이리·타림 분지를 다스린 몽골계 칸국. 두글라트 아미르 가문이 칸을 세우고 타림 서쪽 도시를 맡아 다스렸으며, 명은 이 나라를 별실팔리(비슈발리크)라 불렀다
  endNote: 1487년 유누스 칸이 죽은 뒤 아흐마드 알라크가 투루판 쪽(동)을, 마흐무드 칸이 타슈켄트 쪽(서)을 차지해 갈라섰고, 1514년 사이드 칸이 두글라트 가문의 아부 바크르를 몰아내고 야르칸드 칸국을 세움
  features:
    - 1347년 두글라트 아미르가 투글루크 티무르를 칸으로 세워 차가타이 칸국 동쪽이 갈라섬
    - 1360·1361년 투글루크 티무르가 트란스옥시아나에 쳐들어갔으나 오래 쥐지 못함
    - 1389년 히지르 호자가 투루판을 정복하고 불교도 주민을 이슬람으로 개종시킴
    - 1462~1487년 유누스 칸이 칸국을 다시 묶고 1484년 타슈켄트를 얻음
    - 15세기 내내 북쪽 오이라트와 서쪽 티무르 왕조·우즈베크와 다툼
  mapNote: 지도에는 1347년부터 1513년까지(1500~1513 타림 서쪽은 두글라트 아미르가 칸의 이름으로). 세미레치예·이리·톈산 안쪽·타림 서쪽(카슈가르·악수·호탄)을 넣고, 1389년부터 1486년까지 투루판·코를라·우루무치 쪽 오아시스를, 1484년부터 1504년까지 타슈켄트를 더함. 1487년 칸국이 갈라진 뒤 투루판·코를라는 투루판 칸국으로 그리고, 톈산 안쪽·이리·우루무치 쪽은 키르기스·오이라트 유목지로 비움. 1509년부터 세미레치예는 카자흐 칸국
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Moghulistan", "위키백과 Yunus Khan", "위키백과 Turpan"]
    foundingNote: 두글라트 아미르 불라지가 투글루크 티무르를 칸으로 추대해 차가타이 칸국 동쪽이 따로 선 1347년을 시작으로 봄

# 글은 E3 칸이 채움 — 1500~1512는 J 칸(C2 early-modern.mjs)
- id: kara-del
  level: polity
  names: { ko: 카라델, en: Kara Del, native: Qara Del }
  from: 1389
  to: 1513
  color: "#4b8b87"
  summary: 하미 오아시스에서 차가타이 계통 왕족이 다스리며 명에 조공한 작은 왕국(하미 왕국). 명은 이곳에 하미위를 두고 서역으로 가는 길목을 지키게 했다
  endNote: 1513년 투루판 칸국의 만수르 칸이 하미를 정복함
  features:
    - 1389년 무렵 차가타이 계통 왕족 구나시리가 하미에서 왕을 칭함
    - 1404년 명이 하미위를 두고 왕을 충순왕으로 봉함
    - 1430년대 오이라트에 복속했다가 1467년 무렵 다시 명의 책봉을 받음
    - 1493년 투루판의 아흐마드 알라크에게 하미를 빼앗기는 등 투루판과 다툼이 이어짐
  mapNote: 지도에는 1389년부터 1512년까지(1513년 투루판 칸국에 넘어감). 하미 오아시스와 바르쿨·이우 쪽을 넣고 1404년부터 명의 종속국으로 표시함. 1430년대 오이라트 복속과 투루판의 짧은 점령은 칠하지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kara Del", "위키백과 Hami City", "위키백과 Turpan"]
    foundingNote: 차가타이 계통 왕족이 하미에서 따로 왕을 칭한 1389년을 시작으로 봄(명의 하미위는 1404년)

# ══ C3 J 항목 ══
# 글은 J 칸이 채움 — 1479~1499는 W3가 칠함, 1500~1521은 J 칸(C2 early-modern.mjs)
- id: arghun-kandahar
  level: polity
  names: { ko: 칸다하르의 아르군 왕조, en: Arghun dynasty (Kandahar), native: ارغونیان }
  from: 1479
  to: 1521
  color: "#854096"
  summary: 티무르 왕조 아래 칸다하르를 다스린 아르군 가문의 정권. 헤라트의 술탄 후사인 바이카라가 1479년 몽골계 아르군 가문의 둘눈 베그를 구르·자민다와르 쪽 총독으로 세운 데서 시작해, 칸다하르를 중심으로 헬만드강 유역을 다스림
  endNote: 1522년 카불의 바부르가 칸다하르를 빼앗음. 그보다 앞서 1520~1521년 샤 베그가 남쪽 신드로 옮겨 가 그곳에서 아르군 왕조를 이음(남아시아 쪽 아르군 왕조와 같은 가문)
  features:
    - 1479년 술탄 후사인 바이카라가 둘눈 베그를 구르·자민다와르 쪽에 세우고, 둘눈 베그가 칸다하르·파라 쪽으로 넓힘
    - 1501~1502년 둘눈 베그의 아들 무킴이 카불을 차지했다가 1504년 바부르에게 잃음
    - 1507년 둘눈 베그가 헤라트를 지키다 샤이바니의 우즈베크와 싸워 죽고 아들 샤 베그가 이음
    - 1520~1521년 샤 베그가 신드를 쳐 박카르를 얻고 그쪽으로 옮겨 감
  mapNote: 지도에는 1479년부터 1521년까지(1501~1503 카불 포함). 칸다하르·자불·헬만드와 우루즈간의 하자라자트 밖 몫을 넣고, 1501~1503년에는 카불·가즈니 쪽을 더함. 1506년까지는 헤라트의 티무르 왕조를 섬긴 정권으로 봄. 경계는 지금 아프가니스탄 주 경계에 기댄 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Arghun dynasty (Kandahar)", "위키백과 Arghun dynasty"]
    foundingNote: 술탄 후사인 바이카라가 둘눈 베그를 총독으로 세운 1479년을 시작으로 봄(칸다하르는 그 뒤 차지함)
