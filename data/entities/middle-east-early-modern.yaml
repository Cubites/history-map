# middle-east early-modern 나라 (시대 파일 scripts/geo/areas/middle-east/early-modern.mjs의 짝 항목 파일)
# 시대·범위: 1453~1917: 오스만·사파비 시대, 맘루크 끝, 마그레브 왕조와 섭정, 19세기 식민 점령
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-early-modern').
# 서아시아·북아프리카 A2a-1(2026-10-29): 이란·이라크. 오스만(europe.yaml)은 이 권역 땅으로 늘리고(권역 파일 EXTENDABLE), 카자르 왕조(qajar-iran)는 A1 항목(middle-east-modern.yaml)에 1918년 전 버전만 더한다.
# 1452년 전에 시작한 나라는 from을 실제 해로 적고 도형은 1453년부터. startEvents·endEvents는 사건 묶음 me-05~07이 채운다.

# ── 이란·이라크 (A2a-1) ──
- id: qara-qoyunlu
  level: polity
  names: { ko: 카라코윤루, en: Qara Qoyunlu, native: قره‌قویونلو }
  from: 1375
  to: 1468
  color: "#4d5d73"
  summary: 반 호수 북쪽에서 일어난 튀르크멘 부족 연합의 나라. 1410년 잘라이르 왕조를 무너뜨리고 타브리즈·바그다드를 차지했으며, 자한 샤 때 티무르 왕조에게서 이란 서·중부를 빼앗아 가장 넓어짐
  mapNote: 지도에는 1406년부터 표시. 1406년 아제르바이잔, 1410년 이라크 중·북부와 잔잔·카즈빈·코르데스탄, 1431년 힐라·와시트, 1452년 라이·이스파한·파르스·야즈드·하마단 쪽을 더함. 1435~1447년 티무르 왕조의 종주를 받아들인 동안도 이 나라로 그림. 지금 이란·이라크 땅만 그렸고, 반 호수 둘레·아르메니아 등 아나톨리아 동부와 캅카스는 유럽 권역 땅이라 칠하지 않음. 1458년 헤라트를 몇 달 차지했던 일은 칠하지 않음
  endNote: 1467년 자한 샤가 우준 하산과 싸우다 죽고, 1468년 아크코윤루가 이라크·아제르바이잔·이란 서부를 차지함
  features:
    - 도읍은 타브리즈
    - 이름은 '검은 양'이라는 뜻의 튀르크어
    - 1452~1453년 자한 샤가 이스파한·시라즈·야즈드를 차지함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1467년 차파크추르 전투"]
    foundingNote: 카라 유수프의 아버지 카라 무함마드가 타브리즈 둘레에서 자립한 1375년 무렵부터

- id: aq-qoyunlu
  level: polity
  names: { ko: 아크코윤루, en: Aq Qoyunlu, native: آق‌قویونلو }
  from: 1378
  to: 1508
  color: "#e3d6a4"
  summary: 디야르바크르를 근거지로 한 튀르크멘 부족 연합의 나라. 우준 하산이 1467년 카라코윤루를, 1469년 티무르 왕조의 아부 사이드를 꺾고 이란·이라크를 차지했으나, 1473년 오트루크벨리에서 오스만에 졌음
  mapNote: 지도에는 1468년부터 표시. 지금 이란·이라크 땅만 그렸고, 본거지 디야르바크르와 아나톨리아 동부·아르메니아는 유럽 권역 땅이라 칠하지 않음. 셈난은 다스린 근거가 뚜렷하지 않아 비워 둠
  endNote: 1503년 사파비 왕조의 이스마일 1세가 이란 중·남부를 빼앗고, 1508년 가을 바그다드와 메소포타미아마저 잃음
  features:
    - 이름은 '흰 양'이라는 뜻의 튀르크어
    - 우준 하산 때 도읍을 타브리즈로 옮김
    - 베네치아와 손잡고 오스만에 맞서려 함
    - 1478년 우준 하산이 죽은 뒤 왕위 다툼으로 약해짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1473년 오트루크벨리 전투", "1503년 하마단 전투"]
    foundingNote: 카라 오스만이 디야르바크르 둘레에서 부족 연합을 이끈 1378년 무렵부터

- id: timurid-empire
  level: polity
  names: { ko: 티무르 왕조, en: Timurid Empire, native: تیموریان }
  from: 1370
  to: 1507
  color: "#3f8f8a"
  summary: 티무르가 사마르칸트를 도읍으로 세운 튀르크·몽골계 왕조. 15세기 후반에는 헤라트를 중심으로 호라산을 다스리며 페르시아 문예가 꽃핌
  mapNote: 지도에는 1381년부터 지금 이란 땅 안쪽만 표시. 1381년 호라산, 1384년 라이·쿠미스·고르간·술타니예 쪽, 1386년 아제르바이잔, 1393년 파르스·야즈드·케르만·이스파한·하마단·후제스탄을 더하고, 1405년 후제스탄, 1406년 아제르바이잔, 1410년 술타니예 쪽을 잃음. 1393~1394년·1401~1405년 바그다드 점령은 그리지 않음. 1447년 샤 루흐가 죽은 뒤로는 호라산 서부(마슈하드·니샤푸르)와 아스타라바드만 표시. 헤라트·트란스옥시아나 등 중앙아시아·아프가니스탄 쪽은 아직 그리지 않음
  endNote: 1507년 우즈베크의 무함마드 샤이바니 칸이 헤라트를 차지함
  features:
    - 15세기 후반 도읍은 헤라트
    - 1469~1506년 후사인 바이카라가 헤라트에서 다스림
    - 시인 자미와 화가 비흐자드가 활동함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1507년 샤이바니 칸의 헤라트 점령"]
    foundingNote: 티무르가 발흐에서 권력을 잡은 1370년부터

- id: musha-sha
  level: polity
  names: { ko: 무샤샤 왕조, en: Musha'sha'iyyah, native: مشعشعیان }
  from: 1435
  to: 1508
  color: "#c9a227"
  summary: 무함마드 이븐 팔라흐가 후제스탄의 아랍 부족을 모아 세운 시아파 왕조. 호베이제를 중심으로 후제스탄 서부를 다스림
  mapNote: 지도에는 1441년부터 지금 후제스탄주 땅으로 표시. 1435~1440년 일어선 무렵은 그리지 않음. 이라크 남부로 뻗친 세력은 그리지 않음
  endNote: 1508년 사파비 왕조의 이스마일 1세가 호베이제를 차지해 독립을 끝냈고, 그 뒤 가문은 사파비 아래 총독으로 이어짐
  features:
    - 중심지는 호베이제
    - 1441년 호베이제를 차지함
    - 카라코윤루·아크코윤루와 겨루며 버팀
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1508년 이스마일 1세의 후제스탄 원정"]
    foundingNote: 무함마드 이븐 팔라흐가 아랍 부족 사이에서 세력을 일으킨 1435년부터

- id: safavid-iran
  level: polity
  names: { ko: 사파비 왕조, en: Safavid Iran, native: دولت صفوی }
  from: 1501
  to: 1736
  color: "#3d9c5c"
  summary: 사파비 교단의 이스마일 1세가 타브리즈에서 세운 이란의 왕조. 열두 이맘 시아파를 나라의 종교로 삼았고, 아바스 1세 때 이스파한을 도읍으로 크게 일어남
  mapNote: 지도에는 지금 이란·이라크 땅만 표시함. 캅카스(시르반·조지아·아르메니아)와 아나톨리아 동부는 유럽 권역 땅이라 칠하지 않고, 헤라트·칸다하르 등 아프가니스탄 쪽은 아직 그리지 않음. 1589~1597년 우즈베크가 차지한 호라산과 1722~1725년 말레크 마흐무드 시스타니가 다스린 호라산은 비워 둠. 1722~1728년 호타키 왕조가 쥔 이스파한 둘레와 오스만이 차지한 서부를 뺀 땅을 사파비 땅으로 그림. 러시아가 길란을 점령한 일(1723~1732)은 그리지 않음
  endNote: 1736년 3월 섭정 나디르가 어린 아바스 3세를 폐위하고 스스로 샤에 오름
  features:
    - 도읍은 타브리즈(1501~1555), 카즈빈(1555~1598), 이스파한(1598~1736)
    - 1514년 찰디란 전투에서 오스만에 졌음
    - 1622년 포르투갈에게서 호르무즈를 빼앗음
    - 1639년 주하브 조약으로 이라크를 오스만에 넘김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아마시아 조약(1555)", "콘스탄티노폴리스 조약(1590)", "주하브 조약(1639)"]
    foundingNote: 이스마일 1세가 타브리즈에서 샤로 즉위한 1501년부터

- id: hotak-dynasty
  level: polity
  names: { ko: 호타키 왕조, en: Hotak dynasty, native: هوتکیان }
  from: 1709
  to: 1738
  color: "#c0463a"
  summary: 칸다하르의 길자이 파슈툰 부족장 미르와이스가 사파비 왕조에 맞서 세운 왕조. 1722년 아들 마흐무드가 이스파한을 차지해 7년 남짓 이란 중부를 다스림
  mapNote: 지도에는 이란 안에서 다스린 이스파한·곰·마르카지·야즈드만 1722년부터 1728년까지 표시. 칸다하르 등 아프가니스탄 쪽 땅은 아직 그리지 않고, 다툼이 이어진 파르스·케르만은 사파비 땅으로 둠
  endNote: 1729년 나디르에게 져 이란에서 물러났고, 1738년 3월 나디르가 칸다하르를 차지해 끝남
  features:
    - 도읍은 칸다하르, 1722~1729년에는 이스파한
    - 1722년 굴나바드 전투 뒤 이스파한을 에워싸 술탄 후사인의 항복을 받음
    - 1727년 하마단 조약으로 오스만이 아슈라프를 샤로 인정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1722년 굴나바드 전투", "하마단 조약(1727)"]
    foundingNote: 미르와이스가 칸다하르의 사파비 총독을 죽이고 자립한 1709년부터

- id: afsharid-iran
  level: polity
  names: { ko: 아프샤르 왕조, en: Afsharid dynasty, native: افشاریان }
  from: 1736
  to: 1796
  color: "#5c7fc4"
  summary: 튀르크계 아프샤르 부족 출신 나디르 샤가 세운 이란의 왕조. 오스만·러시아에게서 잃은 땅을 되찾고 1739년 인도의 델리를 약탈함
  mapNote: 지도에는 1736년부터 1750년까지 지금 이란 땅 전체, 1751년부터 호라산만 표시. 캅카스는 유럽 권역 땅이라 칠하지 않고, 아프가니스탄·중앙아시아 쪽과 인도·오만 원정은 그리지 않음
  endNote: 1796년 아가 무함마드 칸이 마슈하드에 들어와 샤로흐 샤를 폐위함
  features:
    - 도읍은 마슈하드
    - 1747년 나디르 샤가 암살된 뒤 왕위 다툼으로 쪼개짐
    - 1750년부터 손자 샤로흐 샤가 호라산만 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1736년 무간 회의", "케르덴 조약(1746)"]
    foundingNote: 나디르가 무간 평원에서 샤로 추대된 1736년 3월부터

- id: zand-dynasty
  level: polity
  names: { ko: 잔드 왕조, en: Zand dynasty, native: زندیان }
  from: 1751
  to: 1794
  color: "#e8964a"
  summary: 루르계 잔드 부족 출신 카림 칸이 세운 이란의 왕조. 카림 칸은 샤를 칭하지 않고 '백성의 대리인'이라 일컬으며 시라즈에서 이란 대부분을 다스림
  mapNote: 지도에는 1751년부터 이란 중·남·서부, 1760년대부터 북부까지 표시. 1779년 카림 칸이 죽은 뒤 아가 무함마드 칸과 지역 칸들에게 넘어간 땅은 차례로 뺌. 1776~1779년 바스라 점령은 그리지 않음
  endNote: 1794년 로트프 알리 칸이 케르만에서 아가 무함마드 칸에게 사로잡혀 끝남
  features:
    - 도읍은 시라즈
    - 카림 칸은 '와킬 알라아야'(백성의 대리인)라는 칭호를 씀
    - 1779년 카림 칸이 죽은 뒤 왕위 다툼이 이어짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1794년 케르만 함락"]
    foundingNote: 카림 칸이 알리 마르단 칸과 갈라서 이란 중부의 실권을 잡은 1751년부터

# ── 레반트·아라비아 (A2a-2, 2026-10-29) ── 맘루크 술탄국·무함마드 알리 왕조의 이집트 땅은 북아프리카 구현(A2b)이 같은 항목에 더한다
- id: mamluk-sultanate
  level: polity
  names: { ko: 맘루크 술탄국, en: Mamluk Sultanate, native: سلطنة المماليك }
  from: 1250
  to: 1517
  color: "#9b5f8f"
  summary: 노예 출신 군인(맘루크)들이 카이로를 도읍으로 이집트·시리아를 다스린 술탄국. 1260년 아인 잘루트에서 몽골군을 막았고 메카·메디나의 보호자로 큰 권위를 누렸으나, 15세기 말부터 재정이 어려워지고 오스만 제국과 겨루며 약해짐
  mapNote: 지도에는 1250년부터 표시. 1250년 이집트(시나이반도·서부 사막 포함), 1253년 팔레스타인, 1260년 다마스쿠스·홈스·하마·레바논 내륙, 1261년 알레포, 1263년 카라크·라까와 순례길의 타부크 둘레, 1287년 라타키아, 1289년 트리폴리, 1291년 아크레 쪽 해안을 더해 1453년부터는 레반트(시리아·레바논·팔레스타인·요르단) 전체로 그림. 종주 아래의 히자즈는 메카 샤리프국으로 따로 그리고, 하마의 아이유브 갈래(1341년까지)는 나누지 않음. 유프라테스 중류의 데이르에조르·하사카는 다스린 범위가 뚜렷하지 않아 비워 둠. 1260년과 1299~1300년 몽골, 1400~1401년 티무르의 시리아 점령은 되돌려져 그리지 않음
  endNote: 1516년 8월 마르즈 다비크 전투에서 술탄 알구리가 죽고, 1517년 1월 카이로가 함락되어 오스만 제국에 병합됨
  features:
    - 도읍은 카이로, 시리아에는 다마스쿠스·알레포 등에 총독을 둠
    - 술탄은 세습보다 맘루크 군인들의 추대로 오르는 일이 많았음
    - 아바스 가문의 칼리프를 카이로에 두고 그 권위를 빌림
    - 1468~1496년 카이트바이가 다스리며 마지막으로 번성함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["마르즈 다비크 전투(1516)", "리다니야 전투(1517)"]
    foundingNote: 아이유브 왕조의 맘루크 군단이 술탄 투란 샤를 죽이고 권력을 잡은 1250년부터

- id: sharifate-of-mecca
  level: polity
  names: { ko: 메카 샤리프국, en: Sharifate of Mecca, native: شرافة مكة }
  from: 967
  to: 1916
  color: "#6fae8c"
  summary: 예언자 무함마드의 후손인 샤리프 가문이 메카·메디나와 홍해 연안 히자즈를 다스린 나라. 맘루크 술탄국, 1517년부터는 오스만 제국의 종주를 받아들였고, 두 성지와 순례를 지키는 일로 이슬람 세계에서 높은 지위를 누림
  mapNote: 지도에는 967년부터 메카·메디나 주와 바하 주로 표시. 1803~1812년은 제1차 사우디 국가, 1813~1840년은 무함마드 알리 왕조 이집트의 땅으로 그림. 타부크 둘레는 1263~1515년 맘루크 술탄국, 1516년부터 오스만 제국의 다마스쿠스 주로 둠
  endNote: 1916년 6월 샤리프 후세인이 오스만 제국에 맞선 아랍 반란을 일으키고 히자즈 왕을 칭해 히자즈 왕국이 됨
  features:
    - 도읍은 메카, 오스만 총독은 제다에 머묾
    - 1201년 무렵부터 카타다 가문이 대를 이어 샤리프 자리를 맡음
    - 1517년 샤리프 바라카트가 셀림 1세를 칼리프로 받들어 지위를 지킴
    - 오스만 시대에는 술탄이 가문 안에서 샤리프를 골라 임명함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1517년 샤리프 바라카트의 오스만 종주 수용"]
    foundingNote: 하산 가문의 샤리프가 메카의 통치자로 자리 잡은 967년 무렵부터

- id: muhammad-ali-egypt
  level: polity
  names: { ko: 이집트 (무함마드 알리 왕조), en: Egypt under the Muhammad Ali dynasty, native: مصر (الأسرة العلوية) }
  from: 1805
  to: 1914
  color: "#5f9fc8"
  summary: 오스만 제국의 총독 무함마드 알리와 그 후손이 대를 이어 다스린 이집트. 군대·산업·교육을 서양식으로 고쳐 강해졌고, 아들 이브라힘 파샤가 아라비아의 와하브파를 꺾고 시리아를 차지해 오스만 제국을 위협함. 1867년 헤디브 칭호를 받았으나 수에즈 운하 건설 등으로 빚이 늘어 1882년 영국에 점령됨
  mapNote: 지도에는 1805년부터 이집트 본토(시나이반도·서부 사막 포함)를 표시하고, 1882년부터는 영국의 점령지로 표시함. 동쪽 땅으로 히자즈(1813~1840년), 홍해 쪽 티하마·지잔(1833~1840년), 시리아·레바논·팔레스타인·요르단과 타부크(1833~1840년)를 그림. 네지드·알하사 점령은 칠하지 않음
  endNote: 1914년 12월 영국이 헤디브 아바스 2세를 폐위하고 보호국 이집트 술탄국을 세움
  features:
    - 도읍은 카이로
    - 1811년 성채에서 맘루크 지도자들을 없애고 권력을 굳힘
    - 1840년 런던 협약으로 시리아·히자즈를 내주고 이집트 세습 통치를 인정받음
    - 1869년 수에즈 운하가 열림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["퀴타히아 조약(1833)", "런던 협약(1840)"]
    foundingNote: 무함마드 알리가 오스만 술탄에게서 이집트 총독으로 임명된 1805년부터

- id: emirate-of-diriyah
  level: polity
  names: { ko: 디리야 토후국, en: Emirate of Diriyah, native: إمارة الدرعية }
  from: 1744
  to: 1818
  color: "#b5bf5a"
  summary: 디리야의 아미르 무함마드 빈 사우드가 종교 개혁가 무함마드 이븐 압둘와하브와 손잡고 세운 나라로, 제1차 사우디 국가라고도 함. 와하브파의 가르침을 앞세워 나지드를 통일하고 알하사·히자즈까지 넓혔으나, 오스만 제국의 명을 받은 이집트군에게 무너짐
  mapNote: 지도에는 1773년 리야드 합병부터 표시하고, 1792년 카심, 1795년 알하사, 1803~1812년 히자즈를 더함. 사막의 넓은 영향권과 이라크·오만·카타르 쪽 원정은 칠하지 않음
  endNote: 1818년 9월 이브라힘 파샤가 디리야를 함락하고 아미르 압둘라를 이스탄불로 보내 처형함
  features:
    - 도읍은 디리야
    - 1802년 카르발라를 약탈하고 1803년 메카에 들어감
    - 1811~1818년 오스만–와하브 전쟁에서 이집트군에 짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["디리야 맹약(1744)", "디리야 함락(1818)"]
    foundingNote: 무함마드 빈 사우드와 무함마드 이븐 압둘와하브가 손잡은 1744년부터

- id: emirate-of-nejd
  level: polity
  names: { ko: 네지드 토후국, en: Emirate of Nejd, native: إمارة نجد }
  from: 1824
  to: 1891
  color: "#d9c26e"
  summary: 디리야 함락 뒤 사우드 가문의 투르키 빈 압둘라가 리야드를 되찾아 세운 나라로, 제2차 사우디 국가라고도 함. 나지드와 동쪽 알하사를 다스리며 오스만 제국에 조공했으나, 1865년 파이살이 죽은 뒤 아들들이 다투며 자발 샴마르에 밀림
  mapNote: 지도에는 1824년부터 리야드 주·카심으로 표시하고, 1830~1870년 알하사를 더함. 1887년 리야드를 자발 샴마르에 빼앗긴 뒤 1890년까지 카심만 그림. 1838~1840년 이집트군 점령은 칠하지 않음
  endNote: 1891년 1월 물라이다 전투에서 라시드 가문에 져 사우드 가문이 쿠웨이트로 망명함
  features:
    - 도읍은 리야드
    - 파이살 빈 투르키(재위 1834~1838, 1843~1865) 때 가장 안정됨
    - 1871년 오스만 제국이 내분을 틈타 알하사를 차지함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["물라이다 전투(1891)"]
    foundingNote: 투르키 빈 압둘라가 리야드를 되찾은 1824년부터

- id: bani-khalid-emirate
  level: polity
  names: { ko: 바니 할리드 토후국, en: Bani Khalid Emirate, native: إمارة بني خالد }
  from: 1669
  to: 1830
  color: "#8a6fb0"
  summary: 베두인 부족 바니 할리드가 걸프 해안의 알하사·카티프를 다스린 나라. 1670년 오스만 수비대를 몰아내고 대상 무역과 진주 채취로 번성했으며, 쿠웨이트의 사바 가문도 한때 그 아래에 있었음
  mapNote: 지도에는 1670년부터 1794년까지, 그리고 1819년부터 1829년까지 알하사 오아시스와 카티프 해안으로 표시함. 그 사이는 제1차 사우디 국가의 땅
  endNote: 1795년 제1차 사우디 국가에 알하사를 빼앗겼고, 1819년 우라이르 가문이 다시 다스렸으나 1830년 제2차 사우디 국가에 져 끝남
  features:
    - 도읍은 알하사 오아시스의 호푸프
    - 우라이르 가문이 아미르를 맡음
    - 나지드의 사우디 세력과 오랫동안 다툼
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1670년 알하사 오스만 수비대 축출"]
    foundingNote: 바라크 빈 구라이르가 바니 할리드를 이끌고 알하사에서 일어선 1669년부터

- id: jabrid-emirate
  level: polity
  names: { ko: 자브르 토후국, en: Jabrid Emirate, native: الدولة الجبرية }
  from: 1417
  to: 1521
  color: "#5a8fa8"
  summary: 알하사 오아시스의 자브르 가문이 걸프 해안을 다스린 나라. 1417년 무렵 일어나 바레인과 카티프를 차지했고, 한창때는 오만 쪽까지 힘을 미침
  mapNote: 지도에는 1417년부터 1520년까지 알하사 오아시스와 카티프 해안으로 표시하고, 바레인섬은 작아 그리지 않음
  endNote: 1521년 아미르 미그린이 포르투갈과 호르무즈의 바레인 공격에 맞서다 죽은 뒤 무너짐
  features:
    - 도읍은 알하사 오아시스
    - 걸프의 진주 채취와 대상로를 쥐고 번성함
    - 1521년 포르투갈이 바레인을 차지하며 힘을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1521년 포르투갈의 바레인 공격"]
    foundingNote: 자브르 가문이 알하사에서 권력을 잡은 1417년 무렵부터

- id: tahirid-sultanate
  level: polity
  names: { ko: 타히르 왕조, en: Tahirid Sultanate, native: الدولة الطاهرية }
  from: 1454
  to: 1517
  color: "#b8607a"
  summary: 라술 왕조를 이어 예멘 남부와 홍해 연안 티하마를 다스린 술탄국. 아덴 항구의 무역으로 부유했고 1504년 사나를 차지했으나, 인도양에 들어온 포르투갈과 홍해로 원정 온 맘루크군 사이에서 무너짐
  mapNote: 지도에는 1454년부터 티하마·타이즈·이브·라헤즈·아덴·라다아 둘레로 표시하고, 1504년 사나를 더함
  endNote: 1517년 맘루크 원정군과 싸우다 마지막 술탄이 죽고, 남은 세력은 1538년 오스만 제국에 아덴을 잃음
  features:
    - 도읍은 라다아·주반, 겨울에는 자비드
    - 1513년 포르투갈의 아덴 공격을 막아 냄
    - 라다아의 아미리야 학교를 세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1513년 포르투갈의 아덴 공격"]
    foundingNote: 타히르 가문이 라술 왕조의 뒤를 이어 아덴을 차지한 1454년부터

- id: qasimid-state
  level: polity
  names: { ko: 카심 왕조, en: Qasimid State, native: الدولة القاسمية }
  from: 1597
  to: 1872
  color: "#7f9f5f"
  summary: 자이드파 이맘 알카심이 일으킨 반란에서 시작해 예멘 고지대를 다스린 이맘국. 아들들이 1628년 사나를 되찾고 1636년 오스만 군대를 예멘에서 몰아냈으며, 17세기 후반 커피 무역으로 번성했으나 18세기부터 남부와 해안을 잃으며 약해짐
  mapNote: 지도에는 1628년 사나 정복부터 표시하고, 1636년 티하마와 남부를 더함. 1728년 라헤즈·아덴, 1803~1817년과 1833년부터 티하마를 뺌. 하드라마우트·도파르 쪽 원정은 칠하지 않음
  endNote: 1849년 오스만 제국이 티하마를, 1872년 사나를 차지해 끝남
  features:
    - 도읍은 샤하라에서 사나로 옮김
    - 모카 항의 커피 수출로 부유해짐
    - 알무타와킬 이스마일 때 가장 넓었음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1636년 오스만 군대 철수"]
    foundingNote: 알만수르 알카심이 이맘을 선포하고 오스만 제국에 맞선 1597년부터

- id: zaydi-imamate-yahya
  level: polity
  names: { ko: 자이드파 이맘국 (야흐야), en: Zaidi Imamate of Yemen, native: الإمامة الزيدية }
  from: 1904
  to: 1918
  color: "#cc5a48"
  summary: 자이드파 이맘 야흐야 무함마드 하미드 앗딘이 오스만 제국에 맞서 예멘 고지대에서 이끈 이맘국. 1904년 이맘에 올라 반란을 이어 갔고, 1911년 다안 조약으로 자이드파 지역의 자치를 인정받음
  mapNote: 지도에는 1911년부터 사나·암란·하자·사다·마흐위트로 표시함. 1904~1910년 반란 중의 지배는 칠하지 않음
  endNote: 1918년 오스만 제국이 물러나자 10월 독립을 선언해 무타와킬 왕국이 됨
  features:
    - 도읍은 사나
    - 1905년 한때 사나를 차지했으나 오스만군에 다시 빼앗김
    - 1차 대전 동안 오스만 제국 편에 섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["다안 조약(1911)"]
    foundingNote: 야흐야가 아버지를 이어 자이드파 이맘에 오른 1904년부터

- id: lahej-sultanate
  level: polity
  names: { ko: 라헤즈 술탄국, en: Sultanate of Lahej, native: سلطنة لحج }
  from: 1728
  to: 1967
  color: "#d9a0b8"
  summary: 압달리 가문의 술탄이 아덴 북쪽 라헤즈를 다스린 나라. 1728년 자이드파 이맘국에서 자립하고 1740년 완전히 독립했으며, 1872년부터 영국의 보호국이 됨
  mapNote: 지도에는 1728년부터 1885년까지 라헤즈 주와 아덴으로 표시하고, 1886년부터는 아덴 보호령에 넣음. 영국령 아덴(약 194 km²)은 작아 따로 그리지 않음
  endNote: 1967년 남예멘 독립과 함께 술탄국이 없어짐
  features:
    - 도읍은 라헤즈의 하우타
    - 1839년 영국에 아덴을 빼앗김
    - 아덴 보호령에서 손꼽히는 큰 술탄국이었음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1839년 영국의 아덴 점령"]
    foundingNote: 압달리 가문이 이맘국에서 자립해 라헤즈를 다스린 1728년부터

- id: nabhani-dynasty
  level: polity
  names: { ko: 나브하니 왕조, en: Nabhani dynasty, native: النباهنة }
  from: 1154
  to: 1624
  color: "#9a7d5a"
  summary: 오만 내륙의 바흘라·니즈와를 근거지로 다스린 나브하니 가문의 왕조. 이바드파 이맘과 권력을 나누거나 다투었고, 해안은 호르무즈 왕국과 16세기 포르투갈의 거점이었음
  mapNote: 지도에는 1154년부터 내륙 다힐리야·자히라로 표시. 1406~1443년 이바드파 이맘이 다시 선 동안도 같은 땅으로 둠. 해안과 바티나는 호르무즈 왕국·포르투갈 거점과 부족 땅이라 비워 둠
  endNote: 1624년 이바드파 학자들이 나시르 빈 무르시드를 이맘으로 뽑아 야루바 왕조가 들어섬
  features:
    - 도읍은 바흘라
    - 바흘라 성은 세계 유산임
    - 이바드파 이맘국 전통과 왕조 지배가 엇갈림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1624년 나시르 빈 무르시드 이맘 선출"]
    foundingNote: 나브하니 가문이 오만 내륙의 왕으로 자리 잡은 1154년 무렵부터

- id: yaruba-dynasty
  level: polity
  names: { ko: 야루바 왕조, en: Yaruba dynasty, native: اليعاربة }
  from: 1624
  to: 1749
  color: "#c25b6b"
  summary: 1624년 이맘으로 뽑힌 나시르 빈 무르시드가 세운 오만의 이맘 왕조. 오만을 하나로 묶고 1650년 포르투갈을 무스카트에서 몰아냈으며, 해군을 키워 동아프리카 해안의 몸바사·잔지바르까지 진출함
  mapNote: 지도에는 1624년부터 내륙 다힐리야·자히라로 표시하고, 1650년 무스카트·바티나·샤르키야를 더함. 동아프리카 해안과 1717년 바레인 점령은 칠하지 않음
  endNote: 1718년부터 이어진 계승 내전과 페르시아의 개입 끝에 1749년 아흐마드 빈 사이드(부사이드 왕조)가 홀로 다스리게 됨
  features:
    - 도읍은 니즈와, 뒤에 루스타크
    - 1650년 무스카트에서 포르투갈을 몰아냄
    - 자브린 성 같은 요새와 물길을 많이 지음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["1650년 무스카트 탈환"]
    foundingNote: 나시르 빈 무르시드가 이바드파 이맘으로 뽑힌 1624년부터

- id: busaid-oman
  level: polity
  names: { ko: 오만 (부사이드 왕조), en: Oman under the Al Busaid, native: عمان (آل بوسعيد) }
  from: 1744
  to: 1856
  color: "#a8506e"
  summary: 아흐마드 빈 사이드가 페르시아군을 몰아내고 이맘으로 뽑혀 연 부사이드 왕조의 오만. 무스카트를 중심으로 인도양 무역과 동아프리카 잔지바르를 아울렀고, 19세기 초 사이드 빈 술탄 때 가장 번성함
  mapNote: 지도에는 1749년부터 오만 북부(다힐리야·자히라·바티나·무스카트·샤르키야·무산담)로 표시함. 잔지바르 등 동아프리카와 페르시아 쪽 반다르아바스, 도파르는 칠하지 않음
  endNote: 1856년 사이드 빈 술탄이 죽은 뒤 아들들이 오만과 잔지바르를 나누어 가져 무스카트 오만 술탄국이 됨
  features:
    - 도읍은 루스타크, 뒤에 무스카트
    - 1798년 영국과 조약을 맺음
    - 1840년 사이드 빈 술탄이 도읍을 잔지바르로 옮김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["영국–오만 조약(1798)"]
    foundingNote: 아흐마드 빈 사이드가 이맘으로 뽑힌 1744년부터

# ── 이집트·리비아 (A2b-1, 2026-10-30) ── 이집트는 맘루크·무함마드 알리 왕조 항목(위)과 A1 이집트 술탄국에 땅을 더함. 하프스 왕조의 튀니지·동알제리 버전은 마그레브 구현이 더함
- id: hafsid-sultanate
  level: polity
  names: { ko: 하프스 왕조, en: Hafsid dynasty, native: الدولة الحفصية }
  from: 1229
  to: 1574
  color: "#2f7f9a"
  summary: 튀니스를 도읍으로 이프리키야(지금의 튀니지·리비아 서부·알제리 동부)를 다스린 베르베르계 왕조. 알모하드 왕조의 총독 가문이 자립해 13세기 마그레브의 강국이 되었으나, 16세기에 스페인과 오스만 제국 사이에 끼어 약해짐
  mapNote: 지도에는 1229년부터 표시. 1229년 튀니지와 트리폴리타니아 해안, 1230년 알제리 동부(콘스탄틴·베자이아·비스크라, 호드나는 뺌), 1401년 트리폴리타니아 내륙을 그림. 튀니지 전체를 1573년까지, 알제리 동부(베자이아는 1510년 스페인 점령 전까지)를 1541년까지, 트리폴리타니아는 1510년 스페인의 트리폴리 점령 전까지 그림. 1235년 알제와 1410년 무렵 알제 둘레의 병합, 1242년 틀렘센 종주는 그리지 않음
  endNote: 1574년 오스만 제국이 튀니스를 다시 정복하고 마지막 술탄을 이스탄불로 데려가 왕조가 끝남
  features:
    - 도읍은 튀니스
    - 지중해 무역과 해적 활동으로 이탈리아·아라곤 도시들과 얽힘
    - 1510년 스페인에 트리폴리를 잃음
    - 1542년 알제의 오스만 정권에 콘스탄틴·비스크라 쪽을 잃음
    - 1535년 카를 5세가 튀니스를 차지하고 술탄을 속국 군주로 다시 앉힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["튀니스 정복(1535)", "튀니스 정복(1574)"]
    foundingNote: 알모하드 왕조의 이프리키야 총독 아부 자카리야 야히야가 자립한 1229년부터

- id: karamanli-tripolitania
  level: polity
  names: { ko: 트리폴리 (카라만리 왕조), en: Tripolitania under the Karamanli dynasty, native: طرابلس (الأسرة القرمانلية) }
  from: 1711
  to: 1835
  color: "#9a4f7a"
  summary: 오스만 기병 장교 아흐메트 카라만리가 세운 왕조가 대를 이어 다스린 트리폴리. 오스만 술탄의 종주권을 인정하고 조공을 바쳤으나 사실상 독립국처럼 움직였고, 지중해 해적질과 통행료로 부를 쌓아 미국·유럽 나라들과 다툼
  mapNote: 지도에는 트리폴리타니아·시르테·키레나이카 해안과 1813년부터 페잔을 그림. 주프라·아즈다비야·쿠프라의 사막 내륙은 비워 둠
  endNote: 1835년 오스만 제국이 내분을 틈타 함대를 보내 마지막 파샤 알리 2세를 물러나게 하고 트리폴리를 직접 다스림
  features:
    - 도읍은 트리폴리
    - 1793~1795년 알리 부르굴이 잠시 트리폴리를 빼앗음
    - 1801~1805년 미국과 제1차 바르바리 전쟁을 치름
    - 유수프 카라만리(1795~1832) 때 페잔을 점령해 직접 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["제1차 바르바리 전쟁(1801~1805)"]
    foundingNote: 아흐메트 카라만리가 오스만 총독을 몰아내고 파샤로 인정받은 1711년부터

- id: fezzan-sultanate
  level: polity
  names: { ko: 페잔 술탄국, en: Fezzan under the Awlad Muhammad, native: فزان (أولاد محمد) }
  from: 1550
  to: 1813
  color: "#6f9a3f"
  summary: 사하라 한가운데의 오아시스 도시 무르주크를 도읍으로 아울라드 무함마드 왕조가 다스린 나라. 지중해와 차드호를 잇는 대상로의 길목을 쥐고 교역으로 살았으며, 1574년부터 트리폴리의 오스만 정권에 조공을 바침
  mapNote: 지도에는 1550년부터 와디 알하야·사브하·무르주크·샤티 오아시스 일대를 표시. 사막 속이라 경계는 어림이며 주프라·가트는 넣지 않음
  endNote: 1811~1812년 트리폴리의 유수프 카라만리가 페잔을 점령하고 1813년부터 직접 다스림
  features:
    - 도읍은 무르주크
    - 16세기에 카넴·보르누 제국과 싸운 뒤 세워짐
    - 트리폴리의 오스만 군대가 여러 번 쳐들어와 조공을 받아 감
    - 사하라를 건너는 대상로의 교역에서 세금을 거둠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["트리폴리의 페잔 원정(1574)"]
    foundingNote: 아울라드 무함마드 가문이 무르주크에 왕조를 세운 1550년 무렵부터(정확한 해는 사료마다 다름)

# ── 마그레브 (A2b-2, 2026-10-30) ── 튀니지·알제리·모로코 1453~1917. 하프스 왕조(위)는 튀니지·동알제리 땅을 더함, 프랑스령 알제리·튀니지·모로코는 A1 항목에 1918년 전 버전을 더함
- id: husainid-tunisia
  level: polity
  names: { ko: 튀니스 (후사인 왕조), en: Beylik of Tunis under the Husainid dynasty, native: بايليك تونس (الدولة الحسينية) }
  from: 1705
  to: 1881
  color: "#9c3f2c"
  summary: 오스만 기병 장교 출신 후사인 1세가 세운 후사인 왕조의 베이들이 대를 이어 다스린 튀니스. 오스만 술탄의 종주권을 인정했으나 군대와 외교를 스스로 꾸렸고, 19세기에 노예제 폐지와 헌법 제정 같은 개혁을 폈으나 빚에 몰려 프랑스의 보호국이 됨
  mapNote: 지도에는 1705년부터 1880년까지 지금 튀니지 땅으로 표시함
  endNote: 1881년 5월 바르도 조약으로 프랑스의 보호국이 되어, 베이는 남았지만 나라의 실권이 프랑스로 넘어감
  features:
    - 도읍은 튀니스, 베이의 궁전은 바르도
    - 1756년 알제 섭정의 군대가 튀니스를 차지해 조공을 받아 감
    - 1846년 노예제를 없애고 1861년 아랍 세계 첫 헌법을 폄
    - 1869년 나라 빚을 갚지 못해 영국·프랑스·이탈리아의 재정 위원회가 생김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아비 디야프, 『이트하프 아흘 알자만』", "바르도 조약(1881)"]
    foundingNote: 후사인 1세가 튀니스의 권력을 잡고 베이가 된 1705년 7월부터

- id: zayyanid-kingdom
  level: polity
  names: { ko: 자이얀 왕조, en: Zayyanid Kingdom of Tlemcen, native: مملكة تلمسان (بنو زيان) }
  from: 1236
  to: 1554
  color: "#6a5a9a"
  summary: 틀렘센을 도읍으로 알제리 서부를 다스린 베르베르계 압드 알와드 부족의 왕조. 알모하드 왕조가 무너진 뒤 자립했고, 동쪽의 하프스 왕조와 서쪽의 마린 왕조 사이에서 여러 번 종주를 받아들이며 사하라 교역으로 살아남음
  mapNote: 지도에는 1236년부터 오랑·틀렘센에서 셸리프강 유역까지의 알제리 서부로 표시함. 1236~1273년은 오리엔탈(우지다)도 그림. 마린 왕조가 틀렘센을 점령한 1337~1347년과 1352~1358년은 마린 왕조 땅으로 그려 지도에서 빠짐. 알제(1313~)와 투아트 오아시스는 그리지 않음. 스페인의 오랑 요새(1509~)는 작아 이 나라 땅으로 둔 근사
  endNote: 1551년 알제의 오스만 군대가 틀렘센을 차지하고 1554년 오스만의 보호령이 된 뒤 왕조가 끝남
  features:
    - 도읍은 틀렘센
    - 1509년 스페인이 오랑을 빼앗고 왕들이 한때 스페인에 조공함
    - 1517~1518년 알제의 오스만 해적 세력과 스페인이 틀렘센을 두고 다툼
    - 사하라를 건너 오는 금 교역의 북쪽 끝 시장으로 번성함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『역사서(키타브 알이바르)』", "야흐야 이븐 할둔, 『부그야트 알루와드』"]
    foundingNote: 야그무라센 이븐 자이얀이 알모하드 왕조에서 자립한 1236년부터

- id: regency-of-algiers
  level: polity
  names: { ko: 알제 섭정, en: Regency of Algiers, native: إيالة الجزائر }
  from: 1659
  to: 1830
  color: "#d4a64a"
  summary: 알제를 도읍으로 알제리 북부를 다스린 오스만 제국의 섭정. 1659년 예니체리 혁명 뒤 군인 회의가 뽑은 아가와 데이가 다스리며 오스만 술탄의 종주만 인정했고, 지중해 사략선의 몸값과 공물로 부를 쌓음
  mapNote: 지도에는 1659년부터 1829년까지 텔과 고원(오랑·티테리·콘스탄틴 베일릭)을 표시하고, 조공만 바친 스텝 부족과 사하라 오아시스는 비움. 스페인의 오랑 요새(1509~1708, 1732~1792)는 작아 이 나라 땅으로 둔 근사
  endNote: 1830년 7월 프랑스군이 알제를 차지하고 데이 후세인이 항복해 섭정이 끝남
  features:
    - 도읍은 알제
    - 1671년부터 군인 회의가 뽑은 데이가 다스림
    - 1708년 스페인에게서 오랑을 빼앗고, 1732년 잃었다가 1792년 되찾음
    - 1816년 영국·네덜란드 함대가 알제를 포격해 기독교도 노예를 풀어 줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["디에고 데 아에도, 『알제의 지형과 역사』(1612)"]
    foundingNote: 예니체리 혁명으로 파샤의 실권이 군인 회의의 아가에게 넘어간 1659년부터

- id: abdelkader-emirate
  level: polity
  names: { ko: 압델카데르 토후국, en: Emirate of Abdelkader, native: إمارة عبد القادر }
  from: 1832
  to: 1847
  color: "#5f9a3a"
  summary: 종교 지도자 압델카데르가 알제리 서부 부족들의 추대로 세운 이슬람 국가. 프랑스와 조약을 맺어 알제리 땅의 3분의 2를 인정받고 군대·세금·행정을 갖췄으나, 프랑스의 전면 정복 전쟁에 밀려 무너짐
  mapNote: 지도에는 타프나 조약을 맺은 1837년부터 1842년까지(1843년 스말라를 잃기 전) 오랑 도 안쪽과 티테리를 표시함
  endNote: 1843년 이동 수도 스말라를 프랑스군에 빼앗긴 뒤 모로코로 물러나 싸우다가 1847년 12월 항복함
  features:
    - 도읍은 마스카라, 1835년부터 타그뎀트
    - 1834년 데스미셸 조약, 1837년 타프나 조약으로 프랑스가 땅을 인정함
    - 1839년 프랑스군의 철문 통과를 조약 위반으로 보고 전쟁을 다시 일으킴
    - 압델카데르는 뒤에 다마스쿠스로 망명해 1860년 기독교도 학살을 막음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타프나 조약(1837)", "데스미셸 조약(1834)"]
    foundingNote: 마스카라 둘레 부족들이 압델카데르를 아미르로 추대한 1832년 11월부터

- id: marinid-sultanate
  level: polity
  names: { ko: 마린 왕조, en: Marinid Sultanate, native: الدولة المرينية }
  from: 1244
  to: 1465
  color: "#b0503c"
  summary: 페스를 도읍으로 모로코를 다스린 베르베르계 제나타 부족의 왕조. 알모하드 왕조를 무너뜨리고 14세기에 마그레브 전체를 노렸으나, 15세기에는 와타스 가문 재상들에게 실권을 빼앗기고 포르투갈에 해안 도시들을 잃음
  mapNote: 지도에는 1248년부터 표시. 1248년 페스·메크네스·타자·라바트, 1269년 마라케시와 대서양 평야, 1274년 탕헤르·타필랄트·오리엔탈과 드라아 골짜기(1271년 복속), 1306년 수스를 그림. 1337~1347년과 1352~1358년에는 틀렘센 쪽 알제리 서부도 그림. 1359년 힌타타가 마라케시를 차지한 뒤로는 실제로 다스린 모로코 북부(탕헤르~타필랄트·우지다)만 그리고 남쪽은 비움. 1347~1349년·1357년 튀니스 원정과 1353~1358년 베자이아·콘스탄틴 점령은 그리지 않음
  endNote: 1465년 페스 반란으로 마지막 술탄 압드 알하크 2세가 죽어 왕조가 끝남
  features:
    - 도읍은 페스
    - 1415년 포르투갈에 세우타를 잃음
    - 1420년부터 와타스 가문 재상이 섭정으로 실권을 쥠
    - 페스에 학교(마드라사)를 많이 세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『역사서(키타브 알이바르)』"]
    foundingNote: 마린 부족이 알모하드 왕조를 밀어내고 메크네스·페스 둘레를 차지한 1244년부터

- id: wattasid-sultanate
  level: polity
  names: { ko: 와타스 왕조, en: Wattasid Sultanate, native: الدولة الوطاسية }
  from: 1472
  to: 1554
  color: "#d08a9a"
  summary: 마린 왕조의 재상 가문이 페스에서 세운 왕조. 모로코 북부만 다스렸고 남쪽은 지역 공국들로 쪼개졌으며, 포르투갈·스페인이 해안 도시들을 차지하는 사이 남쪽에서 일어난 사드 왕조에 밀려남
  mapNote: 지도에는 1472년부터 1548년까지 모로코 북부(탕헤르~타필랄트·우지다)를 표시함. 포르투갈·스페인의 해안 거점은 작아 넣지 않음
  endNote: 1549년 사드 왕조에 페스를 잃고, 1554년 오스만의 도움으로 잠시 돌아왔다가 같은 해 다시 쫓겨나 왕조가 끝남
  features:
    - 도읍은 페스
    - 무함마드 알셰이크가 1472년 페스를 차지해 왕조를 엶
    - 1527년 타들라 조약으로 사드 왕조와 모로코를 나눠 가짐
    - 레오 아프리카누스가 이 왕조 때의 페스를 글로 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["레오 아프리카누스, 『아프리카 묘사』(1550)"]
    foundingNote: 와타스 가문의 무함마드 알셰이크가 페스를 차지해 술탄이 된 1472년부터

- id: saadi-sultanate
  level: polity
  names: { ko: 사드 왕조, en: Saadi Sultanate, native: الدولة السعدية }
  from: 1510
  to: 1659
  color: "#1f7a6a"
  summary: 무함마드의 후손을 자처한 아랍계 샤리프 가문이 수스에서 일으켜 마라케시를 도읍으로 모로코 전체를 다스린 왕조. 포르투갈과 싸워 해안 도시들을 되찾고, 1578년 알카사르키비르 전투에서 포르투갈 왕을 무찔러 전성기를 맞음
  mapNote: 지도에는 1510년 수스, 1525년 마라케시와 대서양 평야, 1549년 페스와 북부를 더해 표시하고, 1641년부터는 마라케시 일대만 그림. 투아트 원정(1583)과 송가이 정복(1591)은 넣지 않음
  endNote: 1659년 마지막 술탄 아흐마드 알아바스가 죽임을 당해 왕조가 끝남
  features:
    - 도읍은 마라케시(1525~)
    - 1541년 포르투갈에게서 아가디르를 되찾음
    - 1578년 알카사르키비르 전투에서 포르투갈 왕 세바스티앙이 전사함
    - 아흐마드 알만수르가 1591년 송가이 제국을 무너뜨림
    - 1603년부터 아들들의 계승 전쟁으로 페스와 마라케시가 갈라짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알이프라니, 『누즈하트 알하디』"]
    foundingNote: 수스의 부족들이 무함마드 알카임을 지도자로 세운 1510년부터

- id: dila-zawiya
  level: polity
  names: { ko: 딜라 자위야, en: Zawiya of Dila, native: الزاوية الدلائية }
  from: 1641
  to: 1668
  color: "#8a6fb0"
  summary: 중부 아틀라스의 수피 교단 거점(자위야)이 사드 왕조가 약해진 틈에 세운 나라. 베르베르 부족의 지지를 받아 메크네스·페스·살레를 다스렸으나 알라위 왕조에 무너짐
  mapNote: 지도에는 1641년부터 1662년까지 페스·메크네스·라바트-살레와 탕헤르 쪽 모로코 북부를 표시함. 하이아틀라스 남쪽 타필랄트(알라위 가문의 근거지)와 1663년 뒤 산지로 물러난 땅은 넣지 않음
  endNote: 1668년 6월 알라위 왕조의 라시드가 딜라를 무너뜨림
  features:
    - 근거지는 중부 아틀라스의 딜라, 1641년부터 페스를 다스림
    - 해적 도시 살레 공화국을 한때 거느림
    - 1659년 지도자 무함마드 알하즈가 술탄을 칭함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알이프라니, 『누즈하트 알하디』"]
    foundingNote: 딜라의 무함마드 알하즈가 메크네스·페스·살레를 차지한 1641년부터

- id: alaouite-morocco
  level: polity
  names: { ko: 모로코 (알라위 왕조), en: Alaouite Sultanate of Morocco, native: الدولة العلوية }
  from: 1666
  to: 1912
  color: "#c23b3b"
  summary: 타필랄트의 샤리프 가문이 세워 지금까지 이어지는 알라위 왕조의 모로코 술탄국. 이스마일 때 흑인 노예 군대로 나라를 하나로 묶었고, 19세기에는 유럽 나라들의 압력 속에 개혁을 꾀했으나 빚과 내란 끝에 보호국이 됨
  mapNote: 지도에는 페스·마라케시를 모두 차지한 1668년부터 1911년까지 수스·드라 이북을 표시함. 명목상 종주만 받은 투아트와 굴밈 이남 해안은 비움
  endNote: 1912년 3월 페스 조약으로 프랑스의 보호국이 되고, 북부는 11월 스페인 보호령이 됨
  features:
    - 도읍은 페스, 이스마일 때(1672~1727) 메크네스
    - 1684년 영국이 떠난 탕헤르, 1769년 포르투갈의 마자간을 되찾음
    - 1844년 이슬리 전투에서 프랑스에 지고 1845년 랄라 마그니아 조약을 맺음
    - 1859~1860년 스페인과의 전쟁에서 져 테투안을 잠시 빼앗김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알나시리, 『키타브 알이스티크사』", "페스 조약(1912)"]
    foundingNote: 라시드가 페스를 차지하고 술탄이 된 1666년부터
