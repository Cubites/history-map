- id: mongol-empire
  level: polity
  names: { ko: 몽골 제국, en: Mongol Empire, hanja: "大蒙古國" }
  from: 1206
  to: 1270
  color: "#7d6b99"
  summary: 칭기즈 칸이 몽골 초원을 통일해 세운 나라. 30여 년 동안 고려를 침입함
  mapNote: 윈난과 대도하 남쪽 쓰촨 남부(건창, 지금의 량산·판즈화 쪽)의 대리국 땅은 쿠빌라이가 1253년 말 대리로 쳐들어가고 1256년 단흥지가 항복하기까지 차지한 땅으로, 지도에서는 1254년부터 넣음(서북쪽 끝 디칭은 빠짐). 지도에는 동아시아 쪽만 표시 (서방의 칸국들은 표시하지 않음)
  endNote: 몽골 제국은 1271년부터 원으로 이어짐
  features:
    - 서쪽으로 1236~1240년 루스를 원정해 키예프까지 이르렀고, 1241년 레그니차와 모히에서 폴란드·헝가리를 침공함
    - 몽케 칸이 남송을 남서쪽에서 에워싸려고 동생 쿠빌라이에게 대리를 치게 했고, 1253~1256년 몽골의 대리 정복이 이루어짐
    - 1231년 1차 침입을 시작으로 30여 년 동안 고려를 침입함
  startEvents: [genghis-1206]
  endEvents: [kubilai-ariq-boke-1260]
  basis:
    type: primary_source
    refs: ["『원사』 태조본기", "『몽골비사』", "『원사』 헌종본기"]
    foundingNote: 테무친이 몽골 초원의 부족들을 통일해 1206년 쿠릴타이에서 칭기즈 칸으로 추대된 해를 시작으로 봄

- id: dongxia
  level: polity
  names: { ko: 동진(동하), hanja: 東眞(東夏), en: Eastern Xia }
  from: 1215
  to: 1233
  color: "#a0845a"
  summary: 금의 요동 선무사 포선만노가 1215년 요동에서 자립해 세운 나라(대진). 1216년 몽골에 항복했다가 1217년 두만강 유역으로 옮겨 다시 자립하고 동하로 이름을 바꾸었다. 고려에서는 동진이라 불렀다. 함경도·간도·연해주 남부·목단강 유역을 다스렸고 남경(연변 성자산성)을 중심지로 삼았다. 1219년 몽골·고려와 함께 강동성의 거란 유민을 쳤으나, 뒤에는 고려 동북 변경을 자주 침범했다. 1233년 구유크가 이끈 몽골군에 남경이 함락되어 무너짐
  mapNote: 1215년 대진 건국을 시작으로 둠. 범위는 금의 갈라로·휼품로·호리개로를 바탕으로 한 대략적인 추정(서북쪽 상경까지 세력이 미쳤다는 견해도 있음). 1233년 뒤에도 몽골 아래서 명맥을 이었다는 견해가 있음. 1215~1216년 요동 시기는 몽골·동요(야율유가)와 뒤섞여 지도에 따로 그리지 않고, 두만강 유역으로 옮긴 1217년부터 영토를 표시함
  endNote: 오고타이 칸이 보낸 구유크의 몽골군이 1233년 남경(연변 성자산성)을 함락하고 포선만노를 사로잡아 만주 동부와 함경도의 여진 땅이 몽골의 지배 아래 들어감. 1233년 뒤에도 몽골 아래서 명맥을 이었다는 견해가 있음
  features:
    - 1216년 몽골에 항복했다가 1217년 두만강 유역으로 옮겨 다시 자립하고 동하로 이름을 바꿈
    - 고려에서는 동진이라 불렀음
    - 함경도·간도·연해주 남부·목단강 유역을 다스렸고 남경(연변 성자산성)을 중심지로 삼음
    - 1219년 몽골·고려와 함께 강동성의 거란 유민을 쳤으나, 뒤에는 고려 동북 변경을 자주 침범함
  startEvents: [dongxia-1215]
  endEvents: [dongxia-falls-1233]
  basis:
    type: primary_source
    refs: ["『원사』 태조본기 10년·11년", "『원사』 태종본기 5년", "『고려사』 세가 고종 5~6년"]
    foundingNote: 금의 요동 선무사 포선만노가 요동에서 자립해 대진을 세운 1215년을 시작으로 봄

- id: yuan
  level: polity
  names: { ko: 원, hanja: 元, en: Yuan }
  from: 1271
  to: 1368
  color: "#7d6b99"
  summary: 쿠빌라이가 몽골 제국의 국호를 바꿔 세운 왕조. 남송을 멸망시키고(1279) 중국 전체를 지배했으며 고려의 내정에 간섭함
  mapNote: 윈난(대도하 남쪽 건창 포함)은 1271년부터 오늘의 국경선으로 서부·남부까지 넣음. 1279년부터 그리는 티베트는 대략 선이라, 네팔·부탄·시킴과 라다크 동남부, 맥마흔선 남쪽(지금의 아루나찰프라데시, 몬율·타왕이 티베트 행정에 든 것은 17세기 뒤)은 넣지 않음. 베트남 북부(대월)는 넣지 않음
  endNote: 1368년 주원장이 명을 세우고 대도를 함락했고, 원 왕실은 몽골 초원으로 물러나 북원이 됨
  features:
    - 1272년 도읍인 중도(연경)의 이름을 대도(베이징)로 고침
    - 남송을 멸망시키고(1279) 중국 전체를 지배함
    - 마르코 폴로가 1275년 쿠빌라이의 여름 도읍 상도에 닿아 원 조정에서 17년쯤 일했다고 함
    - 고려의 내정에 간섭했고, 그 요구로 고려가 결혼도감(1274)을 두어 고려 여성을 원에 보냄
  startEvents: [yuan-1271]
  endEvents: [ming-founded-1368]
  basis:
    type: primary_source
    refs: ["『원사』 세조본기", "『원사』 지리지"]
    foundingNote: 쿠빌라이가 나라 이름을 대원(大元)으로 정한 1271년을 시작으로 봄

- id: northern-yuan
  level: polity
  names: { ko: 북원, hanja: 北元, en: Northern Yuan }
  from: 1368
  to: 1388
  color: "#9d8fb8"
  summary: 명에 쫓겨 몽골 초원으로 물러난 원 왕실. 고려 말 친원파와 친명파 대립의 배경이 됨
  mapNote: 원 왕실은 1388년 이후에도 몽골 초원에서 이어졌으나, 지도에서는 토구스 테무르가 죽은 1388년까지를 북원으로 봄
  endNote: 1388년 명의 장군 남옥이 부이르 호에서 북원의 칸 토구스 테무르를 무찔렀고, 토구스 테무르는 달아나다 아릭 부케 가문의 예수데르에게 죽음. 몽골 고원의 칸위는 쿠빌라이 가계를 떠났고 몽골이 이어짐
  features:
    - 고려 말 친원파와 친명파 대립의 배경이 됨
    - 만주는 북원 쪽 나하추(요양행성)의 영향 아래 있었고, 윈난은 원 황족 양왕(梁王) 바살라와르미가 북원에 충성하며 다스림
  startEvents: [ming-founded-1368]
  endEvents: [timur-tokhtamysh-1388]
  basis:
    type: primary_source
    refs: ["『명사』", "『고려사』"]
    foundingNote: 명이 대도를 함락한 뒤 원 왕실이 몽골 초원으로 물러난 1368년을 시작으로 봄

# ── 6번 묶음 (1592 ~ 1876) ──

- id: hugeum
  level: polity
  names: { ko: 후금, hanja: 後金, en: Later Jin }
  from: 1616
  to: 1636
  color: "#c49a3c"
  summary: 누르하치가 여진 부족을 통합해 세운 나라. 1621년 요동을 차지하고 1627년 조선을 침입함(정묘호란). 1636년 국호를 청으로 바꿈
  endNote: 후금이 내몽골을 복속시킨(1635) 뒤 1636년 국호를 청으로 바꾸어 청으로 이어짐
  features:
    - 1618년 명에 선전 포고하며 세력을 넓혔고 1621년 요동을 차지함
    - 1627년 정묘호란으로 조선을 침입해 형제 관계를 맺고 강화함
  startEvents: [hugeum-founded-1616]
  endEvents: [byeongja-horan-1636]
  basis:
    type: primary_source
    refs: ["『청태조실록』", "『광해군일기』"]
    foundingNote: 누르하치가 여진 부족을 통합하고 1615년 팔기 제도를 갖춘 뒤 후금을 세운 1616년을 시작으로 봄

# ── 북원 이후의 몽골 (2026-09-27 보충) ──

- id: mongols
  level: polity
  names: { ko: 몽골, hanja: 蒙古, en: Mongols }
  from: 1388
  to: 1723
  color: "#9d8fb8"
  summary: 북원이 무너진 뒤 몽골 초원과 요하 서쪽, 칭하이에 살던 몽골 부족들. 명은 동쪽의 달단(타타르)과 서쪽의 오이라트로 불렀고, 요하 서쪽에는 우량하·코르친 등이 있었음. 오이라트가 명 황제를 사로잡고(토목의 변, 1449), 알탄 칸이 명을 압박함. 1509년부터 몽골 세력이 칭하이호 일대로 들어갔고(1559년 알탄 칸), 1637년 무렵 오이라트의 호쇼트부(구시 칸)가 칭하이를 차지함. 내몽골은 후금·청에 복속되었고(1635~1636), 외몽골(할하)도 청에 들어감(1691). 칭하이의 호쇼트부는 1723~1724년 롭상 단진의 난이 진압된 뒤 청에 병합됨
  mapNote: 하나의 나라가 아니라 여러 부족이지만 한 항목으로 묶어 표시함. 외몽골이 청에 들어간 1691년 뒤로는 칭하이의 호쇼트부만 남음. 북원의 토구스 테무르가 죽은 1388년 이후부터 표시. 칭하이호·차이다무 일대는 몽골 세력이 들어간 1509년부터 청에 병합된 1724년 전까지 표시하며, 명(1644년부터 청)이 지킨 허시 회랑을 사이에 두고 초원과 떨어진 조각으로 나타남
  endNote: 외몽골(할하)이 1691년 청에 들어간 뒤, 1723~1724년 청이 칭하이의 호쇼트부 롭상 단진의 난을 진압하고 칭하이를 병합함
  features:
    - 명은 동쪽의 달단(타타르)과 서쪽의 오이라트로 불렀고, 요하 서쪽에는 우량하·코르친 등이 있었음
    - 오이라트가 명 황제를 사로잡고(토목의 변, 1449), 알탄 칸이 명을 압박함
    - 1509년부터 몽골 세력이 칭하이호 일대로 들어감(1559년 알탄 칸)
    - 1637년 무렵 오이라트의 호쇼트부(구시 칸)가 칭하이를 차지함
    - 내몽골은 후금·청에 복속됨(1635~1636)
  startEvents: [timur-tokhtamysh-1388]
  endEvents: [qing-inner-asia-1691]
  basis:
    type: primary_source
    refs: ["『명사』 달단전·와랄전", "『명사』 서역전 서번제위", "『청사고』 번부전 청해액로특", "『조선왕조실록』"]
    foundingNote: 북원의 토구스 테무르가 죽고 몽골 고원의 칸위가 쿠빌라이 가계를 떠난 1388년을 시작으로 봄
