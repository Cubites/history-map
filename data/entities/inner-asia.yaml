# 북방·내륙 아시아
# 3번 묶음(600~935). 운영자 검수 필요.

- id: eastern-turks
  level: polity
  names: { ko: 동돌궐, hanja: 東突厥, en: Eastern Turkic Khaganate }
  from: 583
  to: 630
  color: "#8f8a5a"
  summary: 몽골 초원의 유목 국가. 수·당과 대립하다 당 태종에게 멸망
  endNote: 630년 당 태종이 동돌궐을 무너뜨려 북방의 위협을 없앰. 이후 거란과 실위는 당 쪽으로 기울었고 초원은 설연타가 차지함
  features:
    - 552년 돌궐의 부민이 유연을 무너뜨린 뒤 갈라진 돌궐의 동쪽 갈래임
    - 수·당과 대립했고, 607년 수 양제가 계민 카간의 장막에서 고구려 사신을 보았다고 『수서』는 적음
  startEvents: [turks-avars-551]
  endEvents: [eastern-turks-fall-630]
  basis:
    type: primary_source
    refs: ["『수서』 돌궐전", "『구당서』 돌궐전"]
    foundingNote: 581년 수를 세운 양견이 돌궐 안의 다툼을 부추겨 돌궐이 동과 서로 갈라진 뒤, 583년부터 동돌궐로 봄

- id: tibet
  level: polity
  names: { ko: 토번, hanja: 吐蕃, en: Tibetan Empire }
  from: 618
  to: 842
  color: "#a0785a"
  summary: 티베트 고원의 왕국. 663년 토욕혼을 무너뜨려 칭하이 일대를 차지했고, 안사의 난 뒤에는 당의 허시·농우 지방까지 점령하며 당의 서쪽에서 세력을 겨룸. 9세기 중엽 왕실이 갈라지며 무너짐
  mapNote: 칭하이 북부(칭하이호·차이다무 분지)는 토욕혼을 무너뜨린 663년부터 토번 영토로 표시함. 안사의 난 뒤 점령한 허시·농우는 지도에 따로 표시하지 않음
  endNote: 842년 왕 랑다르마가 죽은 뒤 왕실이 갈라지면서 무너짐
  features:
    - 663년 토욕혼을 멸망시키고 칭하이 일대를 차지함
    - 670년 설인귀가 이끈 당군을 칭하이호 남쪽 대비천에서 크게 이기고 안서 4진도 빼앗음
    - 안사의 난 뒤에는 당의 허시·농우 지방까지 점령하며 당의 서쪽에서 세력을 겨룸
  startEvents: [tang-borders-618]
  endEvents: [uyghur-collapse-839]
  basis:
    type: primary_source
    refs: ["『구당서』 토번전", "『구당서』 서융전 토욕혼", "『신오대사』 사이부록 토번"]
    foundingNote: 송첸감포의 통일 시기(7세기 초)는 학설에 따라 차이가 있음

- id: tuyuhun
  level: polity
  names: { ko: 토욕혼, hanja: 吐谷渾, en: Tuyuhun }
  from: 329
  to: 662
  color: "#7e9a7a"
  summary: 선비 모용부에서 갈라져 나온 토욕혼의 무리가 칭하이호 일대의 강족 땅에 세운 나라. 칭하이호 주변과 차이다무 분지를 다스리며 서역으로 가는 길목을 쥐었음. 609년 수 양제의 원정으로 땅을 잃었다가 수가 무너질 무렵 되찾았고, 635년 당 태종에게 복속함. 수·당이 고구려 원정에 앞서 먼저 친 서쪽의 나라임. 663년 토번에 멸망함
  mapNote: 『구당서』는 서진 영가 연간(307~312) 말에 강족의 옛 땅에 나라를 세워 663년 토번에 멸망하기까지 350년 동안 이어졌다고 전함. 범위는 칭하이호와 차이다무 분지(동경 약 89.6° 동쪽)로 잡은 대략적인 추정. 지도에서는 손자 엽연이 할아버지 이름을 나라 이름으로 삼은 329년부터 표시함. 430~438년에는 서진(西秦)에게서 빼앗은 린샤·란저우·위중을 더함. 609~617년에는 수가 서해군·하원군 등을 두어 수 영토로, 663년부터는 토번 영토로 표시함
  endNote: 663년 토번이 토욕혼을 멸망시키고 칭하이 일대를 차지함
  features:
    - 『구당서』는 서진 영가 연간(307~312) 말에 강족의 옛 땅에 나라를 세워 350년 동안 이어졌다고 전함
    - 칭하이호 주변과 차이다무 분지를 다스리며 서역으로 가는 길목을 쥐었음
    - 609년 수 양제의 원정으로 땅을 잃었다가 수가 무너질 무렵 되찾음
    - 635년 당 태종에게 복속했고, 수·당은 고구려 원정에 앞서 이 서쪽 나라부터 침
  startEvents: [tuyuhun-329]
  endEvents: [tibet-tuyuhun-662]
  basis:
    type: primary_source
    refs: ["『구당서』 서융전 토욕혼", "『수서』 토욕혼전·지리지", "『삼국사기』 권44 을지문덕전(한국고대사료DB 주석)", "국사편찬위원회 우리역사넷 『한국사 연대기』 고구려·당 전쟁"]
    foundingNote: 토욕혼의 손자 엽연(재위 329~351)이 할아버지 이름 토욕혼을 씨(나라 이름)로 삼은 329년을 시작으로 봄

- id: liao
  level: polity
  names: { ko: 요(거란), hanja: 遼, en: Liao }
  from: 916
  to: 1125
  color: "#8a7f5a"
  summary: 야율아보기가 거란 부족을 통합해 세운 나라. 926년 발해를 멸망시킴
  endNote: 1115년 아구다가 금을 세워 요에 맞섰고, 1125년 금이 송과 손잡고 요를 공격해 멸망시킴
  features:
    - 916년 황제를 칭한 뒤 요서로 세력을 넓히며 초원의 조복(달단)과 실위 등을 복속함
    - 925년 말 발해를 쳐 이듬해 정월 상경 홀한성을 함락하고 옛 발해 땅에 동단국을 두었으며, 요동도 요의 땅이 됨
    - 936년 석경당의 후진 건국을 도와 938년 연운 16주를 넘겨받았고, 946년 후진을 멸망시킴
    - 국호는 거란이었다가 947년 요로 고침
  startEvents: [khitan-liao-907]
  endEvents: [liao-falls-1125]
  basis:
    type: primary_source
    refs: ["『요사』 태조본기"]
    foundingNote: 916년 야율아보기가 황제를 칭한 해를 건국으로 봄. 국호를 요로 정한 것은 그 뒤의 일

# ── 만주의 옛 민족 (2026-09-27 보충): 비어 있던 만주 서부·동부를 채운다. 범위는 대략적인 추정. 운영자 검수 필요 ──

- id: donghu
  level: polity
  names: { ko: 동호, hanja: 東胡, en: Donghu }
  from: -700
  to: -205
  color: "#9c8e6c"
  summary: 흉노의 동쪽, 지금의 내몽골 동부·요서 북쪽에 살던 유목 민족. 연과 맞섰으며, 기원전 206년 무렵 흉노의 묵돌 선우에게 무너졌다. 남은 무리가 오환과 선비가 되었다고 전한다
  endNote: 기원전 206년 무렵 흉노의 묵돌 선우가 동호를 습격해 왕을 죽이고 백성과 가축을 거둠. 남은 무리는 오환산과 선비산으로 옮겨 오환과 선비가 되었다고 전함
  features:
    - 춘추 시대의 일로 전하는 중국 문헌에 처음 이름이 보임(대부분 전국 시대 이후 엮여 연대는 분명하지 않음)
    - 연과 맞섰으며, 『사기』 흉노열전은 연의 북쪽에 동호와 산융이 있었다고 적음
    - 기원전 209년 묵돌이 선우에 오르자 동호가 그의 천리마와 아내, 변경의 땅을 차례로 요구함
  startEvents: [chunqiu-records-700]
  endEvents: [modun-donghu-209]
  basis:
    type: primary_source
    refs: ["『사기』 흉노열전", "『삼국지』 위서 오환선비동이전"]
    foundingNote: 기원전 7세기 무렵부터 기록에 보이는 것으로 보아 이때를 시작으로 둠

- id: sushen
  level: polity
  names: { ko: 숙신, hanja: 肅愼, en: Sushen }
  from: -700
  to: 0
  color: "#7f8f76"
  summary: 중국 고대 기록에 나오는 만주 동북부의 민족. 싸리나무 화살(호시)과 돌화살촉을 바쳤다고 전한다. 뒤의 읍루·물길·말갈·여진으로 이어지는 민족의 조상으로 본다
  mapNote: 기록에 나오는 시기가 분명하지 않아 동호와 같은 무렵부터 표시함
  endNote: 숙신은 읍루로 이어졌고, 『후한서』 동이열전은 읍루를 '옛 숙신의 나라'라 함. 이름이 바뀐 때는 분명하지 않음
  features:
    - 싸리나무 화살(호시)과 돌화살촉(석노)을 바쳤다고 전하며, 『국어』에는 주 무왕에게 바친 것으로 나옴
    - 『국어』는 공자가 진에 머물 때 궁정에 떨어져 죽은 매의 몸에 박힌 호시와 석노를 보고 숙신씨의 것이라 알아보았다고 전함
    - 뒤의 읍루·물길·말갈·여진으로 이어지는 민족의 조상으로 봄
  startEvents: [chunqiu-records-700]
  endEvents: [sushen-eupru-0]
  basis:
    type: primary_source
    refs: ["『국어』 노어", "『삼국지』 위서 동이전 읍루조"]
    foundingNote: 춘추 시대의 일로 전하는 중국 문헌에 처음 이름이 보이는 때를 시작으로 둠

- id: yemaek
  level: polity
  names: { ko: 예맥, hanja: 濊貊, en: Yemaek }
  from: -700
  to: 55
  color: "#a88f6a"
  summary: 만주 남부와 한반도 북부에 살던 사람들을 중국 기록이 부른 이름. 고조선·부여·고구려·옥저·동예가 모두 예맥 계통으로 여겨진다. 지린·창춘 일대의 서단산 문화가 이들의 청동기 문화로 꼽힌다
  mapNote: 범위는 부여 남쪽·고구려 북쪽의 빈 땅을 채운 추정. 지도에서는 부여·고구려가 차지하기 전의 쑹화강 상류·휘발하·혼강 유역을 나타낸다. 기원전 75년부터 서기 107년 무렵까지 혼하 상류·소자하 유역(신빈·청원)은 현도군(제2현도군)으로 따로 표시
  endNote: 고구려가 옥저를 정복하고 압록강 유역을 장악한 56년 앞까지를 예맥으로 봄
  features:
    - 고조선·부여·고구려·옥저·동예가 모두 예맥 계통으로 여겨짐
    - 지린·창춘 일대의 서단산 문화가 이들의 청동기 문화로 꼽힘
  startEvents: [chunqiu-records-700]
  endEvents: [sushen-eupru-0]
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『신편 한국사』 4 초기국가", "『삼국지』 위서 동이전"]
    foundingNote: 춘추 시대의 일로 전하는 중국 문헌에 처음 이름이 보이는 때를 시작으로 둠

- id: wuhuan
  level: polity
  names: { ko: 오환, hanja: 烏桓, en: Wuhuan }
  from: -205
  to: 206
  color: "#a08f6e"
  summary: 동호가 무너진 뒤 오환산으로 옮겨 간 무리. 요서 북쪽에 살며 한에 복속하기도 했다. 207년 조조가 백랑산에서 크게 무찔러 세력을 잃었다
  endNote: 207년 조조가 백랑산에서 답돈을 베고 오환을 무찔러, 항복한 무리를 중원으로 옮기고 오환 기병을 군대에 넣음
  features:
    - 요서 북쪽에 살며 한에 복속하기도 함
    - 후한 말 요서의 오환은 원소와 손잡았고, 원소가 죽자(202) 그 아들 원상·원희가 205년 오환의 답돈에게 몸을 의탁함
  startEvents: [modun-donghu-209]
  endEvents: [cao-cao-wuhuan-207]
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 오환선비동이전", "『후한서』 오환선비열전"]
    foundingNote: 묵돌 선우가 동호를 무너뜨린 기원전 206년 무렵을 시작으로 봄. 『후한서』는 남은 무리가 오환산으로 옮겨 오환이 되었다고 전함

- id: xianbei
  level: polity
  names: { ko: 선비, hanja: 鮮卑, en: Xianbei }
  from: -205
  to: 401
  color: "#8f8a5c"
  summary: 동호의 한 갈래로 선비산에 살던 유목 민족. 흉노가 약해진 1세기 말부터 몽골 초원 동부를 차지했고, 2세기 단석괴 때 크게 세력을 떨쳤다. 뒤에 모용씨(전연·후연)·탁발씨(북위) 등이 중국 북부에 나라를 세웠다
  endNote: 모용부(전연·후연)와 탁발부(북위)처럼 부별로 중원에 나라를 세우며 몽골 초원을 떠남. 초원은 402년 무렵 사륜이 세운 유연이 차지함
  features:
    - 흉노가 약해진 1세기 말부터 몽골 초원 동부를 차지했고, 2세기 단석괴 때 크게 세력을 떨침
    - 모용수가 384년 후연을, 탁발규가 386년 북위를 여는 등 모용씨·탁발씨가 중국 북부에 나라를 세움
  startEvents: [modun-donghu-209]
  endEvents: [steppe-rouran-388]
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 오환선비동이전", "『후한서』 오환선비열전", "『진서』 모용외재기"]
    foundingNote: 묵돌 선우가 동호를 무너뜨린 기원전 206년 무렵을 시작으로 봄. 『후한서』는 남은 무리가 선비산으로 옮겨 선비가 되었다고 전함

- id: khitan
  level: polity
  names: { ko: 거란(부족), hanja: 契丹, en: Khitan tribes }
  from: 388
  to: 915
  color: "#96885e"
  summary: 시라무렌강 유역에 살던 유목 민족. 선비 우문부 계통으로 보는 고막해와 같은 갈래(『위서』의 '이종동류')로 본다. 북위·고구려·당과 맞섰다. 8부족 연맹을 이루었고, 916년 야율아보기가 부족을 통합해 요를 세웠다
  mapNote: 『위서』 거란국전이 등국 연간(386~396)에 북위군이 거란을 크게 깨뜨렸다고 적어, 태조기의 388년(등국 3년) 고막해 정벌에 맞춰 388년부터 표시
  endNote: 907년 야율아보기가 거란 8부의 칸이 되어 부족을 통합했고, 916년 요를 세워 이어짐
  features:
    - 선비 우문부 계통으로 보는 고막해와 같은 갈래(『위서』의 '이종동류')로 봄
    - 8부족 연맹을 이루었고 북위·고구려·당과 맞섬
    - 479년 고구려가 유연과 몰래 짜고 지두우를 나누려 하자 부족장 하물우가 북위에 귀부해 백랑수 동쪽에 머묾
    - 돌궐의 지배 아래 있던 거란은 584년 막하불들을 이끌고 수를 찾아왔고 585년 부족 전체가 귀부함
    - 무덕 연간(618~626)부터 당에 사신을 보냈고, 630년 동돌궐이 무너지자 당 쪽으로 기울었음
  startEvents: [steppe-rouran-388]
  endEvents: [khitan-liao-907]
  basis:
    type: primary_source
    refs: ["『위서』 거란국전", "『요사』 영위지"]
    foundingNote: 『위서』 거란국전이 등국 연간(386~396)에 북위군에게 크게 깨진 거란이 고막해와 갈라졌다고 적어, 태조기의 고막해 정벌 해인 388년(등국 3년)을 시작으로 봄

- id: shiwei
  level: polity
  names: { ko: 실위, hanja: 室韋, en: Shiwei }
  from: 400
  to: 925
  color: "#8a9a78"
  summary: 눈강과 흑룡강 상류, 후룬베이얼 초원에 살던 민족. 『위서』 실위국전에 처음 나오며(첫 사신은 동위 때인 544년), 몽골족의 조상 가운데 하나(몽올실위)로 본다
  mapNote: 『위서』 실위국전에 처음 나오는데(첫 사신 544년), 지도는 400년 무렵으로 앞당겨 표시함. 719~818년 눈강 하류·송화강 합류부 서쪽은 『신당서』 동이전 유귀조의 달말루·달구 기사를 근거로 실위로 둔 추정
  endNote: 야율아보기의 요가 요서로 세력을 넓히며 초원의 조복(달단)과 실위 등을 복속함
  features:
    - 몽골족의 조상 가운데 하나(몽올실위)로 봄
    - 무덕 연간(618~626)부터 당에 사신을 보냈고(629년 공물), 630년 동돌궐이 무너지자 당 쪽으로 기울었음
  startEvents: [steppe-rouran-388]
  endEvents: [khitan-liao-907]
  basis:
    type: primary_source
    refs: ["『위서』 실위국전", "『구당서』 실위전"]
    foundingNote: 『위서』 실위국전에 처음 나오며(첫 사신은 동위 때인 544년), 시작은 그보다 앞당겨 400년 무렵으로 잡음

# ── 몽골 초원의 유목 국가 (2026-09-27 보충): 비어 있던 몽골 초원을 시대별로 채운다. 범위는 대략적인 추정. 운영자 검수 필요 ──

- id: xiongnu
  level: polity
  names: { ko: 흉노, hanja: 匈奴, en: Xiongnu }
  from: -317
  to: 90
  color: "#8c7b55"
  summary: 몽골 초원의 유목 국가. 묵돌 선우(기원전 209~174) 때 동호와 월지를 무너뜨리고 초원을 통일해 한을 위협했다. 1세기 중엽 남북으로 갈라졌고, 북흉노는 91년 한과 선비에 밀려 서쪽으로 옮겨 갔다
  endNote: 89년 후한의 대장군 두헌이 계락산에서 북흉노를 크게 무찔렀고, 91년 우교위 경기가 금미산에서 북선우를 쳐 북선우가 달아나 행방을 알 수 없게 되자(서쪽으로 옮겨 갔다고 봄) 선비가 그 땅으로 옮겨 옴
  features:
    - 기원전 209~174년 묵돌 선우 때 동호와 월지를 무너뜨리고 초원을 통일해 한을 위협함
    - 48년 남북으로 갈라졌고 남흉노는 후한에 붙음
    - 북흉노가 떠난 뒤 남은 흉노 10여만 락도 스스로 선비라 불렀다고 『후한서』가 적음
  startEvents: []
  endEvents: [xiongnu-north-91]
  basis:
    type: primary_source
    refs: ["『사기』 흉노열전", "『한서』 흉노전", "『후한서』 남흉노열전"]
    foundingNote: 기원전 318년 한·조·위 등과 함께 진을 친 기록을 처음 보이는 해로 둠

- id: rouran
  level: polity
  names: { ko: 유연, hanja: 柔然, en: Rouran Khaganate }
  from: 402
  to: 551
  color: "#86805a"
  summary: 선비가 떠난 몽골 초원을 차지한 유목 국가. 처음으로 가한(칸) 칭호를 썼으며 북위와 맞섰다. 고구려와도 교류해 지두우(흥안령 일대)를 나누어 가지려 했다는 기록이 있다. 552년 돌궐에 무너짐
  endNote: 552년 돌궐의 부민이 유연을 무너뜨렸고 유연 카간 아나괴는 자살함
  features:
    - 처음으로 가한(칸) 칭호를 쓰고 북위와 맞섬
    - 고구려와도 교류해 479년 몰래 짜고 지두우(흥안령 일대)를 나누어 가지려 했다는 기록이 있음
  startEvents: [steppe-rouran-388]
  endEvents: [turks-avars-551]
  basis:
    type: primary_source
    refs: ["『위서』 연연전", "『북사』 연연전"]
    foundingNote: 사륜이 가한을 칭한 402년을 시작으로 봄

- id: gokturk
  level: polity
  names: { ko: 돌궐, hanja: 突厥, en: Turkic Khaganate }
  from: 552
  to: 582
  color: "#8f8a5a"
  summary: 알타이 산맥의 튀르크계 부족이 유연을 무너뜨리고 세운 유목 제국. 몽골 초원부터 중앙아시아까지 차지했다. 583년 무렵 동돌궐과 서돌궐로 갈라졌다
  endNote: 581년 수를 세운 양견이 돌궐 안의 다툼을 부추겨 돌궐이 동과 서로 갈라짐. 583년 무렵부터 동돌궐과 서돌궐로 이어짐
  features:
    - 몽골 초원부터 중앙아시아까지 차지함
    - 부민의 아들 이식 카간(552~553)을 거쳐 목간 카간(553~572)이 유연의 남은 무리를 쫓아 초원의 주인이 됨
    - 부민의 동생 이스테미가 서쪽을 맡아 559년 무렵 사산과 손잡고 에프탈을 눌렀고, 568년 동로마와 동맹을 맺음
  startEvents: [turks-avars-551]
  endEvents: [turks-avars-551]
  basis:
    type: primary_source
    refs: ["『주서』 돌궐전", "『수서』 돌궐전"]
    foundingNote: 돌궐의 부민이 몽골 초원의 유연을 무너뜨려 유연 카간 아나괴가 자살한 552년을 성립으로 봄

- id: xueyantuo
  level: polity
  names: { ko: 설연타, hanja: 薛延陀, en: Xueyantuo }
  from: 630
  to: 645
  color: "#94865c"
  summary: 동돌궐이 당에 무너진 뒤 몽골 초원을 차지한 철륵계 유목 국가. 고구려의 연개소문이 당을 견제하려고 손잡으려 했다는 기록이 있다. 646년 당에 무너짐
  endNote: 645년 이남 가한이 죽은 뒤 이듬해(646) 당이 무너뜨리고, 철륵 부족들을 다스리려 연연도호부를 둠
  features:
    - 당의 책봉을 받음
    - 고구려의 연개소문이 당을 견제하려고 손잡으려 했다는 기록이 있으나(645) 설연타는 움직이지 않음
  startEvents: [xueyantuo-628]
  endEvents: [tang-borders-618]
  basis:
    type: primary_source
    refs: ["『구당서』 철륵전", "『신당서』 회흘전"]
    foundingNote: 동돌궐이 당에 무너진 630년을 시작으로 봄

- id: anbuk-dohobu
  level: region
  names: { ko: 안북도호부, hanja: 安北都護府, en: Protectorate General to Pacify the North }
  from: 646
  to: 681
  color: "#6f8fb0"
  summary: 당이 설연타를 무너뜨린 뒤 몽골 초원의 철륵 부족을 다스리려고 둔 기구(처음 이름은 연연도호부). 부족장에게 벼슬을 주어 간접으로 다스렸다. 682년 돌궐이 다시 일어나며 초원을 잃었다
  endNote: 682년 골돌록이 돌궐을 다시 세우자 후돌궐에 밀려 몽골 초원에서 물러남. 685년 치소를 간쑤 쪽으로 옮겨 이어졌음
  startEvents: [tang-borders-618]
  endEvents: [second-turks-679]
  basis:
    type: primary_source
    refs: ["『구당서』 지리지", "『신당서』 지리지"]
    foundingNote: 당이 설연타를 무너뜨리고 철륵 부족을 다스리려 연연도호부를 둔 646년부터(설치는 646~647년으로 자료에 따라 갈림)

- id: second-turks
  level: polity
  names: { ko: 돌궐(후돌궐), hanja: 後突厥, en: Second Turkic Khaganate }
  from: 682
  to: 743
  color: "#8f8a5a"
  summary: 당의 지배에서 벗어난 돌궐이 다시 세운 나라. 발해의 대조영이 나라를 세울 때 돌궐과 손잡았고, 오르혼강의 퀼 테긴 비문 등 돌궐 문자 기록을 남겼다. 744년 위구르에 무너짐
  endNote: 744년 위구르가 후돌궐을 무너뜨리고 몽골 초원을 차지함
  features:
    - 골돌록의 뒤는 동생 묵철(691~716)이 이음
    - 발해의 대조영이 나라를 세울 때 손잡았고, 『신당서』는 대조영이 돌궐에 사신을 보내 통교했다고 적음
    - 오르혼강의 퀼 테긴 비문 등 돌궐 문자 기록을 남김
  startEvents: [second-turks-679]
  endEvents: [turks-uyghur-743]
  basis:
    type: primary_source
    refs: ["『구당서』 돌궐전", "「퀼 테긴 비문」", "『신당서』 발해전"]
    foundingNote: 679년부터 돌궐 부족들이 당의 지배에 맞서 거듭 일어난 끝에 골돌록(일테리시 카간)이 돌궐을 다시 세운(후돌궐, 돌궐 제2제국) 682년을 시작으로 봄

- id: uyghur
  level: polity
  names: { ko: 위구르, hanja: 回紇, en: Uyghur Khaganate }
  from: 744
  to: 839
  color: "#7f8a5f"
  summary: 돌궐을 무너뜨리고 몽골 초원을 차지한 튀르크계 유목 국가. 안사의 난 때 당을 도와 반란군을 진압했고, 비단과 말을 바꾸는 무역으로 부유해졌다. 840년 키르기스의 공격으로 무너져 서쪽으로 흩어졌다
  endNote: 839년 큰 눈과 기근, 내분이 겹쳤고 840년 키르기스가 수도를 무너뜨려 위구르는 서쪽과 남쪽으로 흩어짐
  features:
    - 안사의 난 때 당을 도와 반란군을 진압함
    - 비단과 말을 바꾸는 무역으로 부유해짐
  startEvents: [turks-uyghur-743]
  endEvents: [uyghur-collapse-839]
  basis:
    type: primary_source
    refs: ["『구당서』 회흘전", "『신당서』 회흘전"]
    foundingNote: 위구르가 후돌궐을 무너뜨리고 몽골 초원을 차지한 744년을 시작으로 봄

- id: zubu
  level: polity
  names: { ko: 초원 부족(달단·조복), hanja: 韃靼·阻卜, en: Tatar and Zubu tribes }
  from: 840
  to: 935
  color: "#8a8260"
  summary: 위구르가 무너진 뒤 몽골 초원에 흩어져 살던 여러 부족. 중국 기록은 달단(타타르)·조복 등으로 불렀다. 10세기 전반 요(거란)가 초원까지 세력을 넓혔다
  mapNote: 요가 초원 전체를 다스리기 시작한 시기는 기록에 따라 차이가 있어, 지도에서는 936년부터 요의 땅으로 봄
  endNote: 10세기 전반 요(거란)가 초원까지 세력을 넓히며 조복(달단)과 실위 등을 복속함. 요가 초원 전체를 다스리기 시작한 시기는 기록에 따라 차이가 있음
  startEvents: [uyghur-collapse-839]
  endEvents: [khitan-liao-907]
  basis:
    type: primary_source
    refs: ["『요사』 부족표", "『신오대사』 사이부록"]
    foundingNote: 키르기스가 위구르의 수도를 무너뜨리고 초원에 달단(타타르) 등 여러 부족이 남은 840년을 시작으로 봄

- id: steppe-tribes
  level: polity
  names: { ko: 몽골 초원 부족, en: Mongolian steppe tribes }
  from: 1125
  to: 1205
  color: "#8b8058"
  summary: 요가 무너진 뒤 몽골 초원에서 케레이트·나이만·타타르·메르키트·몽골 등 여러 부족이 서로 다투던 시기. 1206년 테무친이 부족들을 통합하고 칭기즈 칸이 되었다
  endNote: 테무친이 케레이트(1203)·나이만(1204)을 무너뜨려 초원의 부족들을 통일하고 1206년 쿠릴타이에서 칭기즈 칸으로 추대됨
  startEvents: [liao-falls-1125]
  endEvents: [genghis-1206]
  basis:
    type: primary_source
    refs: ["『몽골비사』", "『원사』 태조본기"]
    foundingNote: 요가 무너지고 초원에서 케레이트·나이만·타타르·메르키트·몽골 등 여러 부족이 서로 다투게 된 1125년을 시작으로 봄

- id: mongolia
  level: polity
  names: { ko: 몽골, en: Mongolia, native: "Монгол Улс" }
  from: 1921
  to: null
  color: "#6f8c9c"
  summary: 청이 무너질 무렵 독립을 선언한(1911) 외몽골에서 1921년 혁명이 일어나 1924년 몽골 인민 공화국이 세워졌다. 소련의 영향 아래 있다가 1990년 민주화를 거쳐 1992년 새 헌법으로 국호를 몽골국으로 바꾸었다
  mapNote: 중국과의 경계는 1921년부터 오늘의 몽골·중국 국경으로 그림. 할하강과 노몬한 사이 지대는 1939년 노몬한 사건 때 일본(만주국)이 할하강을, 소련·몽골이 노몬한 부근을 국경으로 주장해 다툰 곳이나, 이듬해 거의 소련·몽골 주장대로 경계가 정해졌으므로 1932~1945년에도 몽골로 표시함
  features:
    - 1915년 캬흐타 조약으로 중국의 종주권 아래 자치를 얻었으나 중화민국이 군대를 보내 자치를 없앰(1919)
    - 소련의 영향 아래 있다가 1990년 민주화를 거쳐 1992년 새 헌법으로 국호를 몽골국으로 바꿈
  startEvents: [mongolia-revolution-1921]
  basis:
    type: national_institution
    refs: ["몽골 정부 누리집", "외교부 『몽골 개황』", "코토뱅크 『세계대백과사전』·『야마카와 세계사 소사전』 「노몬한 사건」"]
    foundingNote: 1921년 혁명으로 중화민국의 지배에서 벗어난 해를 시작으로 봄

# ── 5번 묶음 (1392 ~ 1592) ──

- id: jurchen
  level: polity
  names: { ko: 여진, hanja: 女眞, en: Jurchens }
  from: 926
  to: 1615
  color: "#a7925f"
  summary: 만주와 한반도 북부에 흩어져 살던 부족들. 고려 때는 동여진·서여진으로 불리며 고려와 교역·충돌했고(윤관의 동북 9성), 완옌부의 아구다가 금을 세웠다(1115). 조선 때는 건주·해서·야인 여진 등으로 나뉘었다. 조선은 회유(무역소·귀화 허용)와 토벌을 함께 썼고, 4군 6진 개척으로 압록강·두만강 남쪽에서 밀려남. 1616년 누르하치가 후금을 세움
  mapNote: 하나의 나라가 아니라 여러 부족이지만 한 항목으로 묶어 표시함. 발해 멸망(926) 뒤 고려 북쪽의 동여진·서여진부터 표시하며, 1115~1367년에는 금·원의 지배 아래에 있어 지도에서는 금·원 영토로 나타냄
  endNote: 누르하치가 여진 부족을 통합하고 1615년 팔기 제도를 갖춘 뒤 1616년 후금을 세워 이어짐
  features:
    - 고려 때는 동여진·서여진으로 불리며 고려와 교역·충돌함(윤관의 동북 9성)
    - 완옌부의 아구다가 금을 세움(1115)
    - 조선 때는 건주·해서·야인 여진 등으로 나뉨
    - 조선은 회유(무역소·귀화 허용)와 토벌을 함께 썼고, 4군 6진 개척으로 압록강·두만강 남쪽에서 밀려남
  startEvents: [khitan-liao-907]
  endEvents: [hugeum-founded-1616]
  basis:
    type: primary_source
    refs: ["『조선왕조실록』", "『명사』"]
    foundingNote: 발해가 요에 무너진 926년을 시작으로 봄. 발해에 속했던 말갈 계통 사람들이 점차 여진이라 불리게 됨

# ── 만주 동부의 옛 부족 (1·2·3번 묶음 보충, 2026-09-27) ──

- id: eupru
  level: polity
  names: { ko: 읍루, hanja: 挹婁, en: Yilou }
  from: 1
  to: 449
  color: "#8c8a6a"
  summary: 부여 동북쪽 천여 리, 연해주·흑룡강 하류 일대에 살던 부족. 움집(혈거) 생활을 하고 돼지를 길렀으며 독화살을 잘 썼다. 부여에 복속되었다가 벗어났다. 숙신의 후예로 여겨지며 물길로 이어짐
  mapNote: 1세기(후한) 기록부터 보이므로 지도에서는 1년부터 표시. 범위는 부여·고구려·옥저 바깥의 만주 동부로 대략 표시
  endNote: 449년까지로 보며, 읍루를 이은 세력(숙신의 후예)으로 보는 물길로 이어짐. 물길의 가장 이른 기록은 연흥 연간(471~476)임
  features:
    - 움집(혈거) 생활을 하고 돼지를 길렀으며 독화살을 잘 씀
    - 한이 일어난 뒤 부여에 복속했고, 부여가 조세를 무겁게 매기자 황초 연간(220~226)에 부여를 배반함
    - 숙신의 후예로 여겨지며 『진서』는 숙신씨를 '일명 읍루'라 함
  startEvents: [sushen-eupru-0]
  endEvents: [eupru-mulgil-449]
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 읍루", "『후한서』 동이열전 읍루"]
    foundingNote: 『후한서』 동이열전이 '옛 숙신의 나라'라 적은 읍루가 1세기(후한) 기록부터 보여 1년을 시작으로 봄

- id: mulgil
  level: polity
  names: { ko: 물길, hanja: 勿吉, en: Wuji }
  from: 450
  to: 559
  color: "#8c8a6a"
  summary: 읍루를 이어 만주 동부에 살던 부족으로 본다(『위서』는 '고구려 북쪽의 옛 숙신국'이라 함). 연흥 연간(471~476) 북위에 사신을 보내고 세력을 키워 부여를 공격했으며, 부여 왕실은 물길에 쫓겨 고구려에 항복했다(494). 말갈로 이어짐
  mapNote: 가장 이른 기록은 『위서』의 연흥 연간(471~476) 을력지 조공이나, 읍루(449년까지)에 잇대어 450년부터 앞당겨 표시
  endNote: 6세기 중엽부터 말갈이라는 이름으로 북제에 조공하며 말갈로 이어짐
  startEvents: [eupru-mulgil-449]
  endEvents: [northern-dynasties-534]
  basis:
    type: primary_source
    refs: ["『위서』 물길국전", "『삼국사기』 고구려본기 문자명왕 3년"]
    foundingNote: 가장 이른 기록은 『위서』의 연흥 연간(471~476) 사신 을력지의 북위 조공이나, 읍루를 이은 세력으로 보아 450년을 시작으로 봄

- id: malgal
  level: polity
  names: { ko: 말갈, hanja: 靺鞨, en: Mohe }
  from: 560
  to: 926
  color: "#8c8a6a"
  summary: 물길을 이어 만주 동부에 살던 속말·백산·흑수말갈 등 일곱 부족. 속말·백산말갈은 고구려에 속해 전쟁에 참여했고, 고구려 멸망 뒤 대조영이 고구려 유민과 말갈을 이끌고 발해를 세웠다(698). 발해에 들지 않은 흑수말갈은 당과 가까워 발해와 대립했다. 여진으로 이어짐
  mapNote: 6세기 중엽(북제에 조공, 563) 기록부터 보이므로 560년부터 표시. 고구려 멸망 뒤(676~) 발해가 차지하기 전까지 고구려 옛 땅도 말갈·고구려 유민 거주지로 함께 표시
  endNote: 요가 발해를 무너뜨린 926년 뒤 말갈 계통 사람들이 점차 여진이라 불리게 되어 여진으로 이어짐
  features:
    - 속말·백산말갈은 고구려에 속해 전쟁에 참여함
    - 고구려 멸망 뒤 대조영이 고구려 유민과 말갈을 이끌고 발해를 세움(698)
    - 발해에 들지 않은 흑수말갈은 당과 가까워 발해와 대립함
  startEvents: [northern-dynasties-534]
  endEvents: [khitan-liao-907]
  basis:
    type: primary_source
    refs: ["『수서』 말갈전", "『구당서』 말갈전", "『신당서』 흑수말갈전"]
    foundingNote: 6세기 중엽 북제에 조공한 563년 기록부터 보여 560년을 시작으로 봄

# ── 4번 묶음 (936 ~ 1392) ──

- id: xixia
  level: polity
  names: { ko: 서하, hanja: 西夏, en: Western Xia }
  from: 1038
  to: 1227
  color: "#9aa36a"
  summary: 탕구트족의 이원호가 세운 나라(1038). 닝샤·오르도스와 허시 회랑, 알라산(흑수성, 지금의 에지나 부근)까지 차지해 비단길을 쥐고 송·요·금과 맞섰음. 1227년 몽골에 멸망함
  mapNote: 『송사』 하국전의 12감군사 가운데 흑수진연군사(흑수성, 지금의 카라호토)를 근거로 에지나강 유역까지 서하 땅으로 보아 허란산 서쪽 알라산 전체를 서하 영토로 표시함. 범위는 대략적인 추정
  endNote: 1227년 몽골이 서하를 멸망시킴. 칭기즈 칸은 이 원정 중에 죽음
  features:
    - 닝샤·오르도스와 허시 회랑, 알라산(흑수성, 지금의 에지나 부근)까지 차지해 비단길을 쥐었음
    - 송과 싸워(1040~1042) 크게 이겼고, 1044년 경력화약으로 송이 해마다 비단·은·차를 주기로 하고 서하의 칭신을 받음
    - 송·요·서하가 맞서는 균형을 이루었고 금과도 맞섰음
  startEvents: [xixia-founded-1038]
  endEvents: [xixia-falls-1227]
  basis:
    type: primary_source
    refs: ["『송사』 하국전", "『원사』 태조본기", "내몽골 당사방지망 「아라산맹 건치 연혁」"]
    foundingNote: 탕구트족의 이원호가 황제를 칭하며 서하(대하)를 세운 1038년을 시작으로 봄

- id: jin
  level: polity
  names: { ko: 금, hanja: 金, en: Jin }
  from: 1115
  to: 1234
  color: "#b0885a"
  summary: 여진족 완옌부의 아구다가 세운 나라. 요를 무너뜨리고(1125) 북송의 화북을 차지했으며(1127), 고려에 사대를 요구함. 1211년 야호령 전투 뒤 연산 북쪽을 몽골에 빼앗겼고, 1214년 카이펑으로 천도했으나 1215년 중도(베이징)·북경(요서)마저 몽골에 함락됨
  endNote: 몽골이 남송과 연합해 1234년 금을 멸망시키고 화북을 차지함
  features:
    - 요를 무너뜨리고(1125) 북송의 화북을 차지함(1127)
    - 고려에 사대를 요구함
    - 1211년 야호령 전투 뒤 연산 북쪽을 몽골에 빼앗겼고, 1214년 카이펑으로 천도했으나 1215년 중도(베이징)·북경(요서)마저 몽골에 함락됨
  startEvents: [jin-founded-1115]
  endEvents: [jin-falls-1234]
  basis:
    type: primary_source
    refs: ["『금사』 태조본기"]
