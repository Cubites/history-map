# ── 북원 이후의 몽골 (2026-09-27 보충) ──

- id: mongols
  level: polity
  names: { ko: 몽골, hanja: 蒙古, en: Mongols }
  from: 1388
  to: 1723
  color: "#9d8fb8"
  summary: 북원이 무너진 뒤 몽골 초원과 요하 서쪽, 칭하이에 살던 몽골 부족들. 명은 동쪽의 달단(타타르)과 서쪽의 오이라트로 불렀고, 요하 서쪽에는 우량하·코르친 등이 있었음. 오이라트가 명 황제를 사로잡고(토목의 변, 1449), 알탄 칸이 명을 압박함. 1509년부터 몽골 세력이 칭하이호 일대로 들어갔고(1559년 알탄 칸), 1637년 무렵 오이라트의 호쇼트부(구시 칸)가 칭하이를 차지함. 내몽골은 후금·청에 복속되었고(1635~1636), 외몽골(할하)도 청에 들어감(1691). 칭하이의 호쇼트부는 1723~1724년 롭상 단진의 난이 진압된 뒤 청에 병합됨
  basis:
    type: primary_source
    refs: ["『명사』 달단전·와랄전", "『명사』 서역전 서번제위", "『청사고』 번부전 청해액로특", "『조선왕조실록』"]
    foundingNote: 하나의 나라가 아니라 여러 부족이지만 한 항목으로 묶어 표시함. 북원의 토구스 테무르가 죽은 1388년 이후부터 표시. 칭하이호·차이다무 일대는 몽골 세력이 들어간 1509년부터 청에 병합된 1724년 전까지 표시하며, 명(1644년부터 청)이 지킨 허시 회랑을 사이에 두고 초원과 떨어진 조각으로 나타남. 외몽골이 청에 들어간 1691년 뒤로는 칭하이의 호쇼트부만 남음
