# 북방·내륙 아시아
# 3번 묶음(600~935). 운영자 검수 필요.

- id: eastern-turks
  level: polity
  names: { ko: 동돌궐, hanja: 東突厥, en: Eastern Turkic Khaganate }
  from: 583
  to: 630
  color: "#8f8a5a"
  summary: 몽골 초원의 유목 국가. 수·당과 대립하다 당 태종에게 멸망
  basis:
    type: primary_source
    refs: ["『수서』 돌궐전", "『구당서』 돌궐전"]

- id: tibet
  level: polity
  names: { ko: 토번, hanja: 吐蕃, en: Tibetan Empire }
  from: 618
  to: 842
  color: "#a0785a"
  summary: 티베트 고원의 왕국. 당의 서쪽에서 세력을 겨룸
  basis:
    type: primary_source
    refs: ["『구당서』 토번전"]
    foundingNote: 송첸감포의 통일 시기(7세기 초)는 학설에 따라 차이가 있음

- id: liao
  level: polity
  names: { ko: 요(거란), hanja: 遼, en: Liao }
  from: 916
  to: 1125
  color: "#8a7f5a"
  summary: 야율아보기가 거란 부족을 통합해 세운 나라. 926년 발해를 멸망시킴
  basis:
    type: primary_source
    refs: ["『요사』 태조본기"]
    foundingNote: 916년 야율아보기가 황제를 칭한 해를 건국으로 봄. 국호를 요로 정한 것은 그 뒤의 일

# ── 만주의 옛 민족 (2026-09-27 보충): 비어 있던 만주 서부·동부를 채운다. 범위는 대략적인 추정. 운영자 검수 필요 ──

- id: donghu
  level: polity
  names: { ko: 동호, hanja: 東胡, en: Donghu }
  from: -700
  to: -207
  color: "#9c8e6c"
  summary: 흉노의 동쪽, 지금의 내몽골 동부·요서 북쪽에 살던 유목 민족. 연과 맞섰으며, 기원전 206년 무렵 흉노의 묵돌 선우에게 무너졌다. 남은 무리가 오환과 선비가 되었다고 전한다
  basis:
    type: primary_source
    refs: ["『사기』 흉노열전", "『삼국지』 위서 오환선비동이전"]
    foundingNote: 기원전 7세기 무렵부터 기록에 보이는 것으로 보아 이때를 시작으로 둠

- id: sushen
  level: polity
  names: { ko: 숙신, hanja: 肅愼, en: Sushen }
  from: -700
  to: 0
  color: "#7f8f76"
  summary: 중국 고대 기록에 나오는 만주 동북부의 민족. 싸리나무 화살(호시)과 돌화살촉을 바쳤다고 전한다. 뒤의 읍루·물길·말갈·여진으로 이어지는 민족의 조상으로 본다
  basis:
    type: primary_source
    refs: ["『국어』 노어", "『삼국지』 위서 동이전 읍루조"]
    foundingNote: 기록에 나오는 시기가 분명하지 않아 동호와 같은 무렵부터 표시함

- id: yemaek
  level: polity
  names: { ko: 예맥, hanja: 濊貊, en: Yemaek }
  from: -700
  to: 55
  color: "#a88f6a"
  summary: 만주 남부와 한반도 북부에 살던 사람들을 중국 기록이 부른 이름. 고조선·부여·고구려·옥저·동예가 모두 예맥 계통으로 여겨진다. 지린·창춘 일대의 서단산 문화가 이들의 청동기 문화로 꼽힌다. 지도에서는 부여·고구려가 차지하기 전의 쑹화강 상류·휘발하·혼강 유역을 나타낸다
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『신편 한국사』 4 초기국가", "『삼국지』 위서 동이전"]
    foundingNote: 범위는 부여 남쪽·고구려 북쪽의 빈 땅을 채운 추정. 기원전 75년부터 현도군이 이 일대(신빈·퉁화)로 옮겨 왔다는 점은 아직 반영하지 않음

- id: wuhuan
  level: polity
  names: { ko: 오환, hanja: 烏桓, en: Wuhuan }
  from: -206
  to: 206
  color: "#a08f6e"
  summary: 동호가 무너진 뒤 오환산으로 옮겨 간 무리. 요서 북쪽에 살며 한에 복속하기도 했다. 207년 조조가 백랑산에서 크게 무찔러 세력을 잃었다
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 오환선비동이전", "『후한서』 오환선비열전"]

- id: xianbei
  level: polity
  names: { ko: 선비, hanja: 鮮卑, en: Xianbei }
  from: -206
  to: 401
  color: "#8f8a5c"
  summary: 동호의 한 갈래로 선비산에 살던 유목 민족. 흉노가 약해진 1세기 말부터 몽골 초원 동부를 차지했고, 2세기 단석괴 때 크게 세력을 떨쳤다. 뒤에 모용씨(전연·후연)·탁발씨(북위) 등이 중국 북부에 나라를 세웠다
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 오환선비동이전", "『후한서』 오환선비열전", "『진서』 모용외재기"]

- id: khitan
  level: polity
  names: { ko: 거란(부족), hanja: 契丹, en: Khitan tribes }
  from: 388
  to: 915
  color: "#96885e"
  summary: 선비의 한 갈래인 우문부에서 나온 유목 민족. 시라무렌강 유역에 살며 북위·고구려·당과 맞섰다. 8부족 연맹을 이루었고, 916년 야율아보기가 부족을 통합해 요를 세웠다
  basis:
    type: primary_source
    refs: ["『위서』 거란전", "『요사』 영위지"]
    foundingNote: 388년 북위가 거란을 쳤다는 기록을 처음 보이는 해로 둠

- id: shiwei
  level: polity
  names: { ko: 실위, hanja: 室韋, en: Shiwei }
  from: 400
  to: 925
  color: "#8a9a78"
  summary: 눈강과 흑룡강 상류, 후룬베이얼 초원에 살던 민족. 북위 때부터 기록에 나오며, 몽골족의 조상 가운데 하나(몽올실위)로 본다
  basis:
    type: primary_source
    refs: ["『위서』 실위전", "『구당서』 실위전"]
    foundingNote: 북위(5세기) 기록에 처음 나오므로 400년 무렵부터 표시함. 719~818년 눈강 하류·송화강 합류부 서쪽은 『신당서』 동이전 유귀조의 달말루·달구 기사를 근거로 실위로 둔 추정

# ── 몽골 초원의 유목 국가 (2026-09-27 보충): 비어 있던 몽골 초원을 시대별로 채운다. 범위는 대략적인 추정. 운영자 검수 필요 ──

- id: xiongnu
  level: polity
  names: { ko: 흉노, hanja: 匈奴, en: Xiongnu }
  from: -318
  to: 90
  color: "#8c7b55"
  summary: 몽골 초원의 유목 국가. 묵돌 선우(기원전 209~174) 때 동호와 월지를 무너뜨리고 초원을 통일해 한을 위협했다. 1세기 중엽 남북으로 갈라졌고, 북흉노는 91년 한과 선비에 밀려 서쪽으로 옮겨 갔다
  basis:
    type: primary_source
    refs: ["『사기』 흉노열전", "『한서』 흉노전", "『후한서』 남흉노열전"]
    foundingNote: 기원전 318년 한·조·위 등과 함께 진을 친 기록을 처음 보이는 해로 둠

- id: rouran
  level: polity
  names: { ko: 유연, hanja: 柔然, en: Rouran Khaganate }
  from: 402
  to: 551
  color: "#86805a"
  summary: 선비가 떠난 몽골 초원을 차지한 유목 국가. 처음으로 가한(칸) 칭호를 썼으며 북위와 맞섰다. 고구려와도 교류해 지두우(흥안령 일대)를 나누어 가지려 했다는 기록이 있다. 552년 돌궐에 무너짐
  basis:
    type: primary_source
    refs: ["『위서』 연연전", "『북사』 연연전"]
    foundingNote: 사륜이 가한을 칭한 402년을 시작으로 봄

- id: gokturk
  level: polity
  names: { ko: 돌궐, hanja: 突厥, en: Turkic Khaganate }
  from: 552
  to: 582
  color: "#8f8a5a"
  summary: 알타이 산맥의 튀르크계 부족이 유연을 무너뜨리고 세운 유목 제국. 몽골 초원부터 중앙아시아까지 차지했다. 583년 무렵 동돌궐과 서돌궐로 갈라졌다
  basis:
    type: primary_source
    refs: ["『주서』 돌궐전", "『수서』 돌궐전"]

- id: xueyantuo
  level: polity
  names: { ko: 설연타, hanja: 薛延陀, en: Xueyantuo }
  from: 630
  to: 645
  color: "#94865c"
  summary: 동돌궐이 당에 무너진 뒤 몽골 초원을 차지한 철륵계 유목 국가. 고구려의 연개소문이 당을 견제하려고 손잡으려 했다는 기록이 있다. 646년 당에 무너짐
  basis:
    type: primary_source
    refs: ["『구당서』 철륵전", "『신당서』 회흘전"]

- id: anbuk-dohobu
  level: region
  names: { ko: 안북도호부, hanja: 安北都護府, en: Protectorate General to Pacify the North }
  from: 646
  to: 681
  color: "#6f8fb0"
  summary: 당이 설연타를 무너뜨린 뒤 몽골 초원의 철륵 부족을 다스리려고 둔 기구(처음 이름은 연연도호부). 부족장에게 벼슬을 주어 간접으로 다스렸다. 682년 돌궐이 다시 일어나며 초원을 잃었다
  basis:
    type: primary_source
    refs: ["『구당서』 지리지", "『신당서』 지리지"]

- id: second-turks
  level: polity
  names: { ko: 돌궐(후돌궐), hanja: 後突厥, en: Second Turkic Khaganate }
  from: 682
  to: 743
  color: "#8f8a5a"
  summary: 당의 지배에서 벗어난 돌궐이 다시 세운 나라. 발해의 대조영이 나라를 세울 때 돌궐과 손잡았고, 오르혼강의 퀼 테긴 비문 등 돌궐 문자 기록을 남겼다. 744년 위구르에 무너짐
  basis:
    type: primary_source
    refs: ["『구당서』 돌궐전", "「퀼 테긴 비문」", "『신당서』 발해전"]

- id: uyghur
  level: polity
  names: { ko: 위구르, hanja: 回紇, en: Uyghur Khaganate }
  from: 744
  to: 839
  color: "#7f8a5f"
  summary: 돌궐을 무너뜨리고 몽골 초원을 차지한 튀르크계 유목 국가. 안사의 난 때 당을 도와 반란군을 진압했고, 비단과 말을 바꾸는 무역으로 부유해졌다. 840년 키르기스의 공격으로 무너져 서쪽으로 흩어졌다
  basis:
    type: primary_source
    refs: ["『구당서』 회흘전", "『신당서』 회흘전"]

- id: zubu
  level: polity
  names: { ko: 초원 부족(달단·조복), hanja: 韃靼·阻卜, en: Tatar and Zubu tribes }
  from: 840
  to: 935
  color: "#8a8260"
  summary: 위구르가 무너진 뒤 몽골 초원에 흩어져 살던 여러 부족. 중국 기록은 달단(타타르)·조복 등으로 불렀다. 10세기 전반 요(거란)가 초원까지 세력을 넓혔다
  basis:
    type: primary_source
    refs: ["『요사』 부족표", "『신오대사』 사이부록"]
    foundingNote: 요가 초원 전체를 다스리기 시작한 시기는 기록에 따라 차이가 있어, 지도에서는 936년부터 요의 땅으로 봄

- id: steppe-tribes
  level: polity
  names: { ko: 몽골 초원 부족, en: Mongolian steppe tribes }
  from: 1125
  to: 1205
  color: "#8b8058"
  summary: 요가 무너진 뒤 몽골 초원에서 케레이트·나이만·타타르·메르키트·몽골 등 여러 부족이 서로 다투던 시기. 1206년 테무친이 부족들을 통합하고 칭기즈 칸이 되었다
  basis:
    type: primary_source
    refs: ["『몽골비사』", "『원사』 태조본기"]

- id: mongolia
  level: polity
  names: { ko: 몽골, en: Mongolia }
  from: 1921
  to: null
  color: "#6f8c9c"
  summary: 청이 무너질 무렵 독립을 선언한(1911) 외몽골에서 1921년 혁명이 일어나 1924년 몽골 인민 공화국이 세워졌다. 소련의 영향 아래 있다가 1992년 민주화로 몽골국이 되었다
  basis:
    type: national_institution
    refs: ["몽골 정부 누리집", "국립외교원 『몽골 개황』"]
    foundingNote: 1921년 혁명으로 중화민국의 지배에서 벗어난 해를 지도의 시작으로 봄

# ── 5번 묶음 (1392 ~ 1592) ──

- id: jurchen
  level: polity
  names: { ko: 여진, hanja: 女眞, en: Jurchens }
  from: 926
  to: 1615
  color: "#a7925f"
  summary: 만주와 한반도 북부에 흩어져 살던 부족들. 고려 때는 동여진·서여진으로 불리며 고려와 교역·충돌했고(윤관의 동북 9성), 완옌부의 아구다가 금을 세웠다(1115). 조선 때는 건주·해서·야인 여진 등으로 나뉘었다. 조선은 회유(무역소·귀화 허용)와 토벌을 함께 썼고, 4군 6진 개척으로 압록강·두만강 남쪽에서 밀려남. 1616년 누르하치가 후금을 세움
  basis:
    type: primary_source
    refs: ["『조선왕조실록』", "『명사』"]
    foundingNote: 하나의 나라가 아니라 여러 부족이지만 한 항목으로 묶어 표시함. 발해 멸망(926) 뒤 고려 북쪽의 동여진·서여진부터 표시하며, 1115~1367년에는 금·원의 지배 아래에 있어 지도에서는 금·원 영토로 나타냄

# ── 만주 동부의 옛 부족 (1·2·3번 묶음 보충, 2026-09-27) ──

- id: eupru
  level: polity
  names: { ko: 읍루, hanja: 挹婁, en: Yilou }
  from: 1
  to: 449
  color: "#8c8a6a"
  summary: 부여 동북쪽 천여 리, 연해주·흑룡강 하류 일대에 살던 부족. 움집(혈거) 생활을 하고 돼지를 길렀으며 독화살을 잘 썼다. 부여에 복속되었다가 벗어났다. 숙신의 후예로 여겨지며 물길로 이어짐
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 읍루", "『후한서』 동이열전 읍루"]
    foundingNote: 1세기(후한) 기록부터 보이므로 지도에서는 1년부터 표시. 범위는 부여·고구려·옥저 바깥의 만주 동부로 대략 표시

- id: mulgil
  level: polity
  names: { ko: 물길, hanja: 勿吉, en: Wuji }
  from: 450
  to: 559
  color: "#8c8a6a"
  summary: 읍루를 이어 만주 동부에 살던 부족. 북위에 사신을 보내고(475) 세력을 키워 부여를 공격했으며, 부여 왕실은 물길에 쫓겨 고구려에 항복했다(494). 말갈로 이어짐
  basis:
    type: primary_source
    refs: ["『위서』 물길전", "『삼국사기』 고구려본기 문자명왕 3년"]
    foundingNote: 5세기 중엽 무렵부터 기록에 보이므로 450년부터 표시

- id: malgal
  level: polity
  names: { ko: 말갈, hanja: 靺鞨, en: Mohe }
  from: 560
  to: 926
  color: "#8c8a6a"
  summary: 물길을 이어 만주 동부에 살던 속말·백산·흑수말갈 등 일곱 부족. 속말·백산말갈은 고구려에 속해 전쟁에 참여했고, 고구려 멸망 뒤 대조영이 고구려 유민과 말갈을 이끌고 발해를 세웠다(698). 발해에 들지 않은 흑수말갈은 당과 가까워 발해와 대립했다. 여진으로 이어짐
  basis:
    type: primary_source
    refs: ["『수서』 말갈전", "『구당서』 말갈전", "『신당서』 흑수말갈전"]
    foundingNote: 6세기 중엽(북제에 조공, 563) 기록부터 보이므로 560년부터 표시. 고구려 멸망 뒤(676~) 발해가 차지하기 전까지 고구려 옛 땅도 말갈·고구려 유민 거주지로 함께 표시

# ── 4번 묶음 (936 ~ 1392) ──

- id: xixia
  level: polity
  names: { ko: 서하, hanja: 西夏, en: Western Xia }
  from: 1038
  to: 1227
  color: "#9aa36a"
  summary: 탕구트족이 세운 나라. 비단길을 차지하고 송과 대립하다 몽골에 멸망
  basis:
    type: primary_source
    refs: ["『송사』 하국전", "『원사』 태조본기"]

- id: jin
  level: polity
  names: { ko: 금, hanja: 金, en: Jin }
  from: 1115
  to: 1234
  color: "#b0885a"
  summary: 여진족 완옌부의 아구다가 세운 나라. 요를 무너뜨리고(1125) 북송의 화북을 차지했으며(1127), 고려에 사대를 요구함. 1211년 야호령 전투 뒤 연산 북쪽을, 1215년 중도(베이징)·북경(요서)을 몽골에 빼앗기고 1214년 카이펑으로 천도함
  basis:
    type: primary_source
    refs: ["『금사』 태조본기"]

- id: mongol-empire
  level: polity
  names: { ko: 몽골 제국, en: Mongol Empire }
  from: 1206
  to: 1270
  color: "#7d6b99"
  summary: 칭기즈 칸이 몽골 초원을 통일해 세운 나라. 30여 년 동안 고려를 침입함. 지도에는 동아시아 쪽만 표시 (서방의 칸국들은 표시하지 않음)
  basis:
    type: primary_source
    refs: ["『원사』 태조본기", "『몽골비사』"]

- id: yuan
  level: polity
  names: { ko: 원, hanja: 元, en: Yuan }
  from: 1271
  to: 1368
  color: "#7d6b99"
  summary: 쿠빌라이가 몽골 제국의 국호를 바꿔 세운 왕조. 남송을 멸망시키고(1279) 중국 전체를 지배했으며 고려의 내정에 간섭함
  basis:
    type: primary_source
    refs: ["『원사』 세조본기"]

- id: northern-yuan
  level: polity
  names: { ko: 북원, hanja: 北元, en: Northern Yuan }
  from: 1368
  to: 1388
  color: "#9d8fb8"
  summary: 명에 쫓겨 몽골 초원으로 물러난 원 왕실. 고려 말 친원파와 친명파 대립의 배경이 됨
  basis:
    type: primary_source
    refs: ["『명사』", "『고려사』"]
    foundingNote: 원 왕실은 1388년 이후에도 몽골 초원에서 이어졌으나, 지도에서는 토구스 테무르가 죽은 1388년까지를 북원으로 봄

# ── 6번 묶음 (1592 ~ 1876) ──

- id: hugeum
  level: polity
  names: { ko: 후금, hanja: 後金, en: Later Jin }
  from: 1616
  to: 1636
  color: "#c49a3c"
  summary: 누르하치가 여진 부족을 통합해 세운 나라. 1621년 요동을 차지하고 1627년 조선을 침입함(정묘호란). 1636년 국호를 청으로 바꿈
  basis:
    type: primary_source
    refs: ["『청태조실록』", "『광해군일기』"]

# ── 북원 이후의 몽골 (2026-09-27 보충) ──

- id: mongols
  level: polity
  names: { ko: 몽골, hanja: 蒙古, en: Mongols }
  from: 1388
  to: 1690
  color: "#9d8fb8"
  summary: 북원이 무너진 뒤 몽골 초원과 요하 서쪽에 살던 몽골 부족들. 명은 동쪽의 달단(타타르)과 서쪽의 오이라트로 불렀고, 요하 서쪽에는 우량하·코르친 등이 있었다. 오이라트가 명 황제를 사로잡고(토목의 변, 1449), 알탄 칸이 명을 압박했다. 내몽골은 후금·청에 복속되었고(1635~1636), 외몽골(할하)도 청에 들어갔다(1691)
  basis:
    type: primary_source
    refs: ["『명사』 달단전·와랄전", "『조선왕조실록』"]
    foundingNote: 하나의 나라가 아니라 여러 부족이지만 한 항목으로 묶어 표시함. 북원의 토구스 테무르가 죽은 1388년 이후부터 표시
