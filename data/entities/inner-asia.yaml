# 북방·내륙 아시아
# 3번 묶음(600~935). 운영자 검수 필요.

- id: eastern-turks
  level: polity
  names: { ko: 동돌궐, hanja: 東突厥, en: Eastern Turkic Khaganate }
  from: 583
  to: 630
  color: "#8f8a5a"
  summary: 몽골 초원의 유목 국가. 수·당과 대립하다 당 태종에게 멸망
  basis:
    type: primary_source
    refs: ["『수서』 돌궐전", "『구당서』 돌궐전"]

- id: tibet
  level: polity
  names: { ko: 토번, hanja: 吐蕃, en: Tibetan Empire }
  from: 618
  to: 842
  color: "#a0785a"
  summary: 티베트 고원의 왕국. 당의 서쪽에서 세력을 겨룸
  basis:
    type: primary_source
    refs: ["『구당서』 토번전"]
    foundingNote: 송첸감포의 통일 시기(7세기 초)는 학설에 따라 차이가 있음

- id: liao
  level: polity
  names: { ko: 요(거란), hanja: 遼, en: Liao }
  from: 916
  to: 1125
  color: "#8a7f5a"
  summary: 야율아보기가 거란 부족을 통합해 세운 나라. 926년 발해를 멸망시킴
  basis:
    type: primary_source
    refs: ["『요사』 태조본기"]
    foundingNote: 916년 야율아보기가 황제를 칭한 해를 건국으로 봄. 국호를 요로 정한 것은 그 뒤의 일

# ── 5번 묶음 (1392 ~ 1592) ──

- id: jurchen
  level: polity
  names: { ko: 여진, hanja: 女眞, en: Jurchens }
  from: 1368
  to: 1615
  color: "#a7925f"
  summary: 만주와 한반도 북부에 흩어져 살던 건주·해서·야인 여진 등의 부족들. 조선은 회유(무역소·귀화 허용)와 토벌을 함께 썼고, 4군 6진 개척으로 압록강·두만강 남쪽에서 밀려남. 1616년 누르하치가 후금을 세움
  basis:
    type: primary_source
    refs: ["『조선왕조실록』", "『명사』"]
    foundingNote: 하나의 나라가 아니라 여러 부족이지만, 조선과의 관계를 보여 주려고 한 항목으로 묶어 표시함

# ── 4번 묶음 (936 ~ 1392) ──

- id: xixia
  level: polity
  names: { ko: 서하, hanja: 西夏, en: Western Xia }
  from: 1038
  to: 1227
  color: "#9aa36a"
  summary: 탕구트족이 세운 나라. 비단길을 차지하고 송과 대립하다 몽골에 멸망
  basis:
    type: primary_source
    refs: ["『송사』 하국전", "『원사』 태조본기"]

- id: jin
  level: polity
  names: { ko: 금, hanja: 金, en: Jin }
  from: 1115
  to: 1234
  color: "#b0885a"
  summary: 여진족 완옌부의 아구다가 세운 나라. 요를 무너뜨리고(1125) 북송의 화북을 차지했으며(1127), 고려에 사대를 요구함
  basis:
    type: primary_source
    refs: ["『금사』 태조본기"]

- id: mongol-empire
  level: polity
  names: { ko: 몽골 제국, en: Mongol Empire }
  from: 1206
  to: 1270
  color: "#7d6b99"
  summary: 칭기즈 칸이 몽골 초원을 통일해 세운 나라. 30여 년 동안 고려를 침입함. 지도에는 동아시아 쪽만 표시 (서방의 칸국들은 표시하지 않음)
  basis:
    type: primary_source
    refs: ["『원사』 태조본기", "『몽골비사』"]

- id: yuan
  level: polity
  names: { ko: 원, hanja: 元, en: Yuan }
  from: 1271
  to: 1368
  color: "#7d6b99"
  summary: 쿠빌라이가 몽골 제국의 국호를 바꿔 세운 왕조. 남송을 멸망시키고(1279) 중국 전체를 지배했으며 고려의 내정에 간섭함
  basis:
    type: primary_source
    refs: ["『원사』 세조본기"]

- id: northern-yuan
  level: polity
  names: { ko: 북원, hanja: 北元, en: Northern Yuan }
  from: 1368
  to: 1388
  color: "#9d8fb8"
  summary: 명에 쫓겨 몽골 초원으로 물러난 원 왕실. 고려 말 친원파와 친명파 대립의 배경이 됨
  basis:
    type: primary_source
    refs: ["『명사』", "『고려사』"]
    foundingNote: 원 왕실은 1388년 이후에도 몽골 초원에서 이어졌으나, 지도에서는 토구스 테무르가 죽은 1388년까지를 북원으로 봄
