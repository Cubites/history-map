# china warring-states 나라 (시대 파일 scripts/geo/areas/china/warring-states.mjs의 짝 항목 파일)
# 시대·범위: 전국(M2): 기원전 475년(천문 −474) ~ 기원전 221년(천문 −220). 동아시아 손그림 바깥 도형(shared.mjs의 CHINA 등) 안을 M1 칸(pre-qin.mjs의 PRE_QIN_CELLS)과 칼선으로 나눈다(docs/china/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'china-warring-states').
# 중국 M2(2026-10-21): 전국 시대에 새로 그리는 나라(한·조·위·월·중산·송). M1에서 이어지는 진(晉)·진(秦)·제·초·오·동주는 china-pre-qin.yaml, 연은 china-early.yaml.
# 1만 km² 미만 소국(노·위(衛)·정·주(邾) 등)은 그리지 않고 항목도 만들지 않는다. startEvents·endEvents는 중국 선진 시대 사건 묶음(cn-01)이 채운다.

- id: han-state
  level: polity
  names: { ko: 한(韓), hanja: 韓, en: Han (Warring States) }
  from: -452
  to: -229
  color: "#c9a227"
  summary: 진(晉)에서 갈라져 나온 전국 7웅 가운데 가장 작은 나라. 기원전 453년 조·위와 함께 지씨를 멸하고 진(晉) 땅을 나누어 가졌으며, 기원전 403년 주 위열왕에게 제후로 인정받았다. 도읍은 평양(지금 린펀)에서 기원전 400년 무렵 양적(지금 위저우)으로 옮겼고, 기원전 375년 정을 멸하고 신정으로 옮겼다. 소후 때 신불해를 재상으로 삼아 법으로 나라를 다스렸다. 서쪽으로 진(秦)과 맞닿아 땅을 자주 빼앗겼고, 기원전 230년 여섯 나라 가운데 가장 먼저 진(秦)에게 멸망했다
  mapNote: 지도에는 세 집안이 진(晉)을 나눈 기원전 453년부터 멸망할 때까지 표시하고, 정 병합(기원전 375년), 이양 상실(기원전 307년), 완을 가진 시기(기원전 301~291년), 장평 싸움 무렵의 상당·평양 상실(기원전 260년)을 반영함
  endNote: 기원전 230년 진(秦)에게 도읍 신정을 빼앗기고 왕 안이 사로잡혀 멸망함
  features:
    - 도읍은 평양(지금 린펀)·양적(지금 위저우)을 거쳐 기원전 375년 신정
    - 기원전 403년 주 위열왕에게 조·위와 함께 제후로 인정받음
    - 소후 때 신불해를 재상으로 삼아 법으로 나라를 다스림
    - 기원전 262년 진(秦)에게 길이 끊긴 상당을 조에 바쳐 장평 싸움의 불씨가 됨
    - 법가 사상을 모은 한비가 이 나라 공자였음
  startEvents: [jin-six-ministers-497bc, jin-partition-403bc]
  endEvents: [qin-han-zhao-230bc]
  basis:
    type: primary_source
    refs: ["『사기』 한세가", "『전국책』 한책"]
    foundingNote: 한·조·위가 지씨를 멸하고 진(晉) 땅을 실제로 나눈 기원전 453년을 시작으로 봄. 주 왕실이 제후로 인정한 기원전 403년을 시작으로 보기도 함

- id: zhao-state
  level: polity
  names: { ko: 조, hanja: 趙, en: Zhao }
  from: -452
  to: -227
  color: "#5b7fb0"
  summary: 산시성 중부와 허베이성 남부에 걸친 전국 7웅의 하나. 진(晉)의 경대부 조씨가 기원전 453년 한·위와 함께 지씨를 멸하고 진양(지금 타이위안)을 근거로 나라를 세웠으며, 기원전 403년 제후로 인정받았다. 기원전 386년 한단으로 도읍을 옮겼다. 무령왕이 기원전 307년 호복기사를 받아들여 기병을 키우고 임호·누번을 쳐 북쪽으로 넓혔으며, 기원전 296년 중산을 멸했다. 기원전 260년 장평 싸움에서 진(秦)에게 크게 졌고, 기원전 228년 도읍 한단이 함락되어 멸망했다
  mapNote: 지도에는 기원전 453년부터 한단이 함락될 때까지 표시하고, 무령왕 때 넓힌 안문·운중(기원전 300년 무렵), 중산 병합(기원전 296년), 상당 북부·태원군 상실(기원전 247년)을 반영함. 한단 함락 뒤 대(代)에 남은 정권은 칠하지 않음
  endNote: 기원전 228년 진(秦)에게 도읍 한단을 빼앗기고 왕 천이 사로잡혀 멸망함. 공자 가가 대(代)로 달아나 왕을 칭했으나 기원전 222년 진(秦)에게 무너짐
  features:
    - 도읍은 진양(지금 타이위안)에서 기원전 386년 한단으로 옮김
    - 무령왕이 기원전 307년 호복기사를 받아들여 기병을 키움
    - 임호·누번을 쳐서 안문·운중으로 넓히고 기원전 296년 중산을 멸함
    - 기원전 260년 장평 싸움에서 진(秦)에게 크게 짐
    - 인상여·염파·이목 같은 이름난 신하와 장수가 있었음
  startEvents: [jin-six-ministers-497bc, jin-partition-403bc]
  endEvents: [qin-han-zhao-230bc]
  basis:
    type: primary_source
    refs: ["『사기』 조세가", "『전국책』 조책"]
    foundingNote: 한·조·위가 지씨를 멸하고 진(晉) 땅을 실제로 나눈 기원전 453년을 시작으로 봄. 주 왕실이 제후로 인정한 기원전 403년을 시작으로 보기도 함

- id: wei-state
  level: polity
  names: { ko: 위, hanja: 魏, en: Wei (Warring States) }
  from: -452
  to: -224
  color: "#4f9a5f"
  summary: 황허강 중류 양쪽에 걸친 전국 7웅의 하나. 진(晉)의 경대부 위씨가 기원전 453년 한·조와 함께 지씨를 멸하고 안읍(지금 샤현)을 근거로 나라를 세웠으며, 기원전 403년 제후로 인정받았다. 문후가 이회를 써서 개혁하고 오기·서문표 같은 인재를 모아 전국 시대 초 가장 강한 나라가 되었고, 진(秦)에게서 하서를 빼앗았다. 기원전 361년 대량(지금 카이펑)으로 도읍을 옮겼으나, 계릉·마릉 싸움에서 제에게 지고 하서를 진(秦)에게 내주며 약해졌다. 기원전 225년 진(秦)이 황허강 물을 끌어 대량을 잠기게 해 멸망했다
  mapNote: 지도에는 기원전 453년부터 대량이 함락될 때까지 표시하고, 하서·상군을 가진 시기(기원전 409~328년), 중산을 다스린 시기(기원전 406~381년), 하동 상실(기원전 290년 무렵), 송 북쪽 땅 차지(기원전 286년 제가 송을 병합한 뒤, 284년 무렵), 동군 상실(기원전 242년)을 반영함
  endNote: 기원전 225년 진(秦)의 왕분이 황허강 물을 끌어 도읍 대량을 잠기게 하자 왕 가가 항복해 멸망함
  features:
    - 도읍은 안읍(지금 샤현)에서 기원전 361년 대량(지금 카이펑)으로 옮김
    - 문후가 이회를 써서 개혁하고 오기·서문표 같은 인재를 모음
    - 기원전 409년 진(秦)에게서 하서를 빼앗아 서하군을 둠
    - 기원전 406년 중산을 멸하고 태자를 봉해 25년 동안 다스림
    - 계릉(기원전 353)·마릉(기원전 342) 싸움에서 제에게 짐
  startEvents: [jin-six-ministers-497bc, jin-partition-403bc]
  endEvents: [qin-wei-chu-225bc]
  basis:
    type: primary_source
    refs: ["『사기』 위세가", "『전국책』 위책"]
    foundingNote: 한·조·위가 지씨를 멸하고 진(晉) 땅을 실제로 나눈 기원전 453년을 시작으로 봄. 주 왕실이 제후로 인정한 기원전 403년을 시작으로 보기도 함. 대량 천도는 『죽서기년』을 따른 기원전 361년(『사기』는 기원전 339년)

- id: yue-state
  level: polity
  names: { ko: 월, hanja: 越, en: Yue }
  from: -509
  to: -332
  color: "#8aa04a"
  summary: 저장성 북부 회계(지금 사오싱)를 중심으로 일어난 춘추 전국 시대의 나라. 윤상 때 오와 다투며 커졌고, 구천이 기원전 494년 오에게 졌다가 오랫동안 힘을 길러 기원전 473년 오를 멸했다. 그 뒤 낭야(지금 산둥성 남부 바닷가)로 도읍을 옮겨 패자로 불렸다. 기원전 333년 초 위왕에게 왕 무강이 죽고 옛 오 땅과 저장 북부를 잃었으며, 남은 왕족은 저장 남부와 푸젠에서 군장으로 흩어졌다
  mapNote: 지도에는 오를 멸한 기원전 473년부터 초에게 무너진 기원전 333년까지 옛 오 땅과 저장 북부·황산 둘레·포양호 둘레(번)를 표시. 그 전의 저장 북부와 낭야로 옮긴 뒤 산둥 바닷가에 미친 세력은 칠하지 않음
  endNote: 기원전 333년 초 위왕에게 왕 무강이 죽고 옛 오 땅과 저장 북부를 빼앗겨 무너짐(기원전 306년으로 보는 설도 있음). 남은 왕족은 저장 남부와 푸젠에서 군장으로 이어짐
  features:
    - 도읍은 회계(지금 사오싱), 오를 멸한 뒤 낭야로 옮김
    - 구천이 기원전 494년 오에게 진 뒤 힘을 길러 기원전 473년 오를 멸함
    - 범려·문종이 구천을 도움
    - 청동 칼을 잘 만들어 월왕 구천의 칼이 전함
  startEvents: [wu-baiju-515bc]
  endEvents: [chu-conquers-yue-333bc]
  basis:
    type: primary_source
    refs: ["『사기』 월왕구천세가", "『춘추좌씨전』"]
    foundingNote: 『춘추좌씨전』에 오와 처음 싸운 기록이 나오는 기원전 510년을 시작으로 봄. 하 왕조 소강의 아들 무여가 봉해졌다는 이야기는 전설로 전함

- id: zhongshan-state
  level: polity
  names: { ko: 중산, hanja: 中山, en: Zhongshan }
  from: -505
  to: -295
  color: "#a868a8"
  summary: 타이항산 동쪽 기슭(지금 허베이성 중부)에 백적 계통의 선우족(鮮虞)이 세운 나라. 기원전 506년 중인에서 일어났다고 전하며, 무공이 기원전 414년 고(지금 딩저우)에 도읍했다. 기원전 406년 위(魏)에게 멸망했다가 기원전 380년 무렵 다시 일어나 영수(지금 핑산)에 도읍했고, 기원전 323년 무렵 왕을 칭했다. 기원전 296년 조에게 멸망했다
  mapNote: 지도에는 기원전 475년부터 멸망할 때까지 표시하고, 위(魏)가 다스린 기원전 406~381년은 위의 땅으로 표시
  endNote: 기원전 296년 조 무령왕에게 멸망함
  features:
    - 도읍은 고(지금 딩저우), 다시 일어난 뒤 영수(지금 핑산)
    - 백적 계통 선우족(鮮虞)이 세운 나라로 화하 문화를 받아들임
    - 기원전 323년 무렵 한·조·위·연과 함께 왕을 칭함
    - 핑산의 중산왕 무덤에서 긴 글을 새긴 청동기가 나옴
  startEvents: [zhongshan-506bc]
  endEvents: [zhao-wuling-307bc]
  basis:
    type: primary_source
    refs: ["『사기』 조세가", "『전국책』 중산책"]
    foundingNote: 선우족이 중인(지금 탕현 서북쪽)에서 나라를 세웠다는 기원전 506년을 시작으로 봄. 무공이 고에 도읍한 기원전 414년을 시작으로 보기도 함

- id: song-state
  level: polity
  names: { ko: 송, hanja: 宋, en: Song (state) }
  from: -1041
  to: -285
  color: "#d08a5a"
  summary: 지금 허난성 상추에 도읍한 춘추 전국 시대의 제후국. 주 왕실이 상 왕족 미자 계를 봉해 상의 제사를 잇게 한 나라다. 춘추 시대에 양공이 패자를 꿈꾸었다가 기원전 638년 홍수 싸움에서 초에게 졌다. 기원전 328년 무렵 언(강왕)이 왕을 칭하고 둘레 나라를 쳤으나, 기원전 286년 제에게 병합되어 멸망했다
  mapNote: 지도에는 기원전 475년부터 멸망할 때까지 상추 둘레·허쩌 남부·화이베이·쉬저우를 표시. 춘추 시대의 송은 표시하지 않음
  endNote: 기원전 286년 제에게 병합되어 멸망함. 땅은 뒤에 위(魏)·초가 나누어 가짐
  features:
    - 도읍은 지금 허난성 상추
    - 주 왕실이 상 왕족 미자 계를 봉해 상의 제사를 잇게 함
    - 양공이 기원전 638년 홍수 싸움에서 초에게 짐
    - 기원전 328년 무렵 언(강왕)이 왕을 칭함
    - 장자가 이 나라 몽 사람으로 전함
  startEvents: [zhougong-fengjian-1042bc]
  endEvents: [qi-song-286bc]
  basis:
    type: primary_source
    refs: ["『사기』 송미자세가", "『춘추좌씨전』"]
    foundingNote: 주 성왕 때 미자 계를 송에 봉한 것을 시작으로 보되, 해가 전하지 않아 성왕이 즉위한 기원전 1042년으로 둠
