# south-asia colonial 나라 (시대 파일 scripts/geo/areas/south-asia/colonial.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 1757~1946: 동인도 회사와 영국령 인도, 토후국
# 나라를 넣을 때 아래 []를 지우고 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'south-asia-colonial').
# 1757년 전에 시작한 나라는 from을 실제 해로 적고 도형은 1757년부터. 1947년에도 이어지는 S1 항목(nepal·bhutan·sikkim·hyderabad-state·kalat·kharan·makran·las-bela·
# british-ceylon·french-india·portuguese-india)은 항목이 south-asia-modern.yaml에 있으므로 여기 두지 않는다(두 항목 파일에 같은 id를 두지 않음 — from과 글만 그 파일에서 고침).
# 칸 나눔(S2 뼈대, <sp>/IMPL-SPLIT.md): 구현 S2-서는 '# ── S2 서 ──', S2-동은 '# ── S2 동 ──', S2-남은 '# ── S2 남 ──' 칸 아래에만 쓴다. 맨 위 []는 나라를 넣는 쪽이 지운다(여럿이 같이 지워도 합칠 때 같은 고침).

# ── S2 서 ──
# 서 칸(파키스탄·카슈미르·펀자브·라지푸타나·구자라트): 1757년 전에 선 나라는 from을 실제 해로, 도형은 1757년부터. 1947년에 이어지는 토후국은 1946년까지(1947년부터 인도·파키스탄 땅)
- id: durrani-empire
  level: polity
  names: { ko: 두라니 제국, en: Durrani Empire, native: دولت درانی }
  from: 1747
  to: 1825
  color: "#3d6b2f"
  summary: 아흐마드 샤 두라니가 칸다하르에서 세운 아프간 제국으로, 1757년 델리를 약탈한 뒤 펀자브·시르힌드·카슈미르·물탄과 인더스강 건너 땅을 무굴에게서 넘겨받음. 1761년 3차 파니파트 전투에서 마라타를 꺾었으나 펀자브는 시크에게 차례로 잃음
  details: 1765년 시크가 라호르를 차지했고, 1818년 물탄, 1819년 카슈미르를 시크에 잃음. 1823년 페샤와르의 바라크자이 형제가 시크에 조공했고 1826년 무렵 바라크자이 가문이 카불을 쥐며 제국이 갈라짐
  mapNote: 지도에는 이 지역 안쪽(펀자브·카슈미르·물탄·카이베르 파크툰크와·발루치스탄 북부)만 1757년부터 1825년까지 표시함. 카불·칸다하르 쪽은 다른 지역 몫이라 그리지 않음. 1758~1759년 마라타의 라호르 점령은 되돌려져 칠하지 않음. 신드·칼라트는 공물을 바친 이웃으로 따로 그림
  endNote: 1818~1823년 물탄·카슈미르·페샤와르를 시크에 잃고, 1826년 무렵 바라크자이 가문이 카불을 차지하며 이 지역의 두라니 지배가 끝남
  features:
    - 도읍은 칸다하르, 1776년부터 카불
    - 겨울마다 인더스강을 건너 펀자브로 원정함
    - 아흐마드 샤는 1747~1767년 여덟 차례 넘게 인도로 군대를 보냄
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Durrani Empire"]
    foundingNote: 1747년 칸다하르의 부족 회의가 아흐마드 샤를 왕으로 세운 해

- id: sikh-empire
  level: polity
  names: { ko: 시크 제국, en: Sikh Empire, native: ਸਿੱਖ ਰਾਜ }
  from: 1765
  to: 1848
  color: "#e8c13a"
  summary: 펀자브를 중심으로 한 시크교도의 나라로, 1765년 시크 미슬(수장 연합)이 라호르를 차지한 뒤 1799년 란지트 싱이 라호르를 손에 넣어 왕국으로 묶음. 물탄·카슈미르·페샤와르를 차례로 더해 이 지역 서북부의 가장 큰 나라가 됨
  details: 1765~1798년은 열두 미슬이 사르바트 칼사 모임으로 함께 움직인 미슬 연합 시기. 1809년 암리차르 조약으로 수틀레지강을 동인도 회사와의 경계로 삼음. 1818년 물탄, 1819년 카슈미르, 1834년 페샤와르를 병합함. 1839년 란지트 싱이 죽은 뒤 혼란에 빠져 1845~1846년 제1차 시크 전쟁에서 지고 잘란다르 도아브·카슈미르를 내줌
  mapNote: 지도에는 1765년부터 1848년까지 표시하고, 1798년까지의 미슬 연합 시기도 같은 항목·같은 색으로 그림. 1846~1848년은 영국 보호 아래의 라호르 정부. 잠무 쪽 산지 소국은 1765년부터 시크 색으로 묶고, 1840년부터는 잠무 카슈미르 주로 따로 그림
  endNote: 1848~1849년 제2차 시크 전쟁에서 져 1849년 3월 29일 동인도 회사가 펀자브를 병합함
  features:
    - 도읍은 라호르, 미슬 시기의 중심은 암리차르
    - 란지트 싱은 유럽식 훈련을 받은 칼사 군대를 키움
    - 1809년 수틀레지강 남동쪽 시크 수장들은 영국 보호로 넘어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Sikh Empire", "암리차르 조약(1809)", "라호르 조약(1846)"]
    foundingNote: 1765년 미슬 연합이 라호르를 차지한 해부터 같은 나라로 봄(란지트 싱의 라호르 입성은 1799년 7월 7일)

- id: jammu-kashmir-state
  level: polity
  names: { ko: 잠무 카슈미르 주, en: Jammu and Kashmir, native: جموں و کشمیر }
  from: 1840
  to: 1946
  color: "#8a5fb0"
  summary: 도그라 가문의 굴랍 싱이 세운 토후국으로, 잠무·카슈미르·라다크·발티스탄·길기트를 아우른 이 지역 북쪽의 가장 큰 토후국. 굴랍 싱은 1822년 시크 제국 아래 잠무의 라자가 되었고, 그 장군 조라와르 싱이 1834~1840년 라다크·발티스탄을 정복함
  details: 1846년 3월 16일 암리차르 조약으로 굴랍 싱이 동인도 회사에 750만 루피를 내고 카슈미르 골짜기를 받아 영국 종주 아래 토후국이 됨. 길기트는 1842년 점령했다가 1852년 잃고 1860년 되찾음. 1935년 길기트 쪽을 영국에 60년 동안 빌려줌
  mapNote: 지도에는 1840년부터 1946년까지 표시함(1840년 잠무·라다크·발티스탄, 1846년 카슈미르 골짜기, 1860년 길기트 일대를 더함). 훈자·나가르 등 길기트의 작은 소국은 이 나라 색으로 묶음. 악사이친 쪽은 동아시아 지도의 청·중화민국 경계를 따름
  endNote: 1947년 10월 26일 마하라자 하리 싱이 인도 가입 문서에 서명함
  features:
    - 도읍은 여름 스리나가르, 겨울 잠무
    - 1842년 추슐 조약으로 티베트와 라다크 경계를 확인함
    - 1877년부터 영국 주재관이 길기트를 맡아 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Jammu and Kashmir (princely state)", "암리차르 조약(1846)"]
    foundingNote: 굴랍 싱의 군대가 라다크·발티스탄 정복을 마친 1840년부터 그림(잠무 라자 1822년, 조약상 성립 1846년)

- id: ladakh-kingdom
  level: polity
  names: { ko: 라다크 왕국, en: Kingdom of Ladakh, native: ལ་དྭགས་ }
  from: 1460
  to: 1839
  color: "#c9a27a"
  summary: 인더스강 위쪽 고원의 티베트 불교 왕국으로, 남걀 왕조가 다스림. 1684년 팅모스강 조약 뒤 티베트와 카슈미르 양쪽에 공물을 바치며 자기 왕을 이어 감
  mapNote: 지도에는 1757년부터 1839년까지 지금 라다크(레·카르길) 땅과 시아첸 쪽으로 표시함. 스피티는 1만 km² 미만이라 산지 토후국 쪽에 묶음
  endNote: 1834~1840년 잠무의 조라와르 싱에게 정복되어 잠무 카슈미르의 일부가 됨(남걀 왕가는 스톡의 영지만 받음)
  features:
    - 도읍은 레
    - 카슈미르의 파시미나 양모 교역로를 쥠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Sikh Empire", "팅모스강 조약(1684)"]
    foundingNote: 남걀 왕조가 선 15세기 중엽(1460년 무렵)부터 봄

- id: chitral-kingdom
  level: polity
  names: { ko: 치트랄 왕국, en: Chitral, native: چترال }
  from: 1660
  to: 1946
  color: "#5f8fb0"
  summary: 힌두쿠시 남쪽 치트랄 골짜기의 왕국으로, 메타르 칭호의 카토르 왕조가 다스림. 아만 울 물크(1857~1892) 때 가장 넓었고, 1891년 영국 종주 아래 들어감
  mapNote: 지도에는 1757년부터 1946년까지 지금 치트랄 지구 땅으로 표시함. 1893년 듀랜드선으로 아프가니스탄에 준 카피리스탄·쿠나르 쪽은 다른 지역 몫이라 그리지 않음
  endNote: 1947년 11월 6일 메타르가 파키스탄 가입 문서에 서명함(1969년 파키스탄의 지구가 됨)
  features:
    - 도읍은 치트랄
    - 1877년 잠무 카슈미르와 조약을 맺어 그 종주를 받아들임
    - 1895년 영국군이 치트랄 요새 포위를 풀어 줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Chitral (princely state)"]
    foundingNote: 1660년 상긴 알리 2세가 샤 마흐무드를 꺾어 카토르 왕조가 굳은 해

- id: bahawalpur-state
  level: polity
  names: { ko: 바하왈푸르 주, en: Bahawalpur State, native: ریاست بہاولپور }
  from: 1748
  to: 1946
  color: "#3fa07a"
  summary: 수틀레지강·판즈나드강 남쪽 촐리스탄 사막 가장자리의 토후국으로, 다우드포트라 가문의 아바시 나와브가 다스림. 1833년 동인도 회사와 조약을 맺어 보호를 받음
  mapNote: 지도에는 1757년부터 1946년까지 지금 바하왈푸르 관구 땅으로 표시함
  endNote: 1947년 10월 5일 파키스탄에 가입함(1955년 서파키스탄에 합쳐짐)
  features:
    - 도읍은 바하왈푸르
    - 1809년 암리차르 조약으로 시크와의 경계가 수틀레지강에 머묾
    - 20세기에 수틀레지 계곡 관개로 경작지가 크게 늚
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Bahawalpur (princely state)", "영국·바하왈푸르 조약(1833)"]
    foundingNote: 1748년 나와브 바하왈 칸 1세가 자립한 해

- id: talpur-sindh
  level: polity
  names: { ko: 신드 왕국, en: Sindh under the Kalhoras and Talpurs, native: سنڌ }
  from: 1701
  to: 1842
  color: "#c46a9e"
  summary: 인더스강 아래쪽 신드를 다스린 나라로, 1783년까지 칼호라 왕조, 그 뒤 발루치 탈푸르 가문의 미르들이 다스림. 두라니 제국에 공물을 바침
  details: 1783년 할라니 싸움으로 탈푸르 가문이 칼호라 왕조를 몰아냄. 하이데라바드·미르푸르 카스의 미르들이 함께 다스렸고, 하이르푸르 갈래는 따로 섬. 1795년 무렵 카라치를 칼라트에게서 얻음
  mapNote: 지도에는 1757년부터 1842년까지 지금 신드주 땅(1783년부터 하이르푸르를 뺌)으로 표시하고, 칼호라 시기와 탈푸르 시기를 같은 항목·같은 색으로 그림. 움에르코트·타르파르카르 쪽은 1779년부터 1812년까지 조드푸르 주 땅으로 그림
  endNote: 1843년 2월 17일 미아니, 3월 24일 두바 싸움에서 찰스 네이피어에게 져 동인도 회사에 병합됨
  features:
    - 도읍은 후다바드, 1768년부터 하이데라바드
    - 탈푸르 미르들은 땅을 갈래별로 나눠 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Talpur dynasty"]
    foundingNote: 칼호라 가문의 미안 야르 무함마드가 무굴에게서 신드 북부를 받은 1701년부터 봄

- id: khairpur-state
  level: polity
  names: { ko: 하이르푸르 주, en: Khairpur State, native: خیرپور }
  from: 1783
  to: 1946
  color: "#e6d35a"
  summary: 상부 신드의 토후국으로, 탈푸르 가문의 한 갈래인 소랍 칸이 1783년 자립해 세움. 1843년 신드 병합 때 영국 편에 서서 토후국으로 남음
  mapNote: 지도에는 1783년부터 1946년까지 지금 하이르푸르 지구와 나라 사막 쪽으로 표시함(1852년 알리 무라드의 땅 몰수는 1만 km² 미만이라 나누지 않음)
  endNote: 1947년 10월 3일 파키스탄에 가입함(1955년 서파키스탄에 합쳐짐)
  features:
    - 도읍은 하이르푸르
    - 미르 알리 무라드가 1843년 영국을 도와 지위를 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Talpur dynasty"]
    foundingNote: 1783년 할라니 싸움 뒤 미르 소랍 칸이 하이르푸르를 따로 다스린 해

- id: cutch-state
  level: polity
  names: { ko: 쿠치 주, en: Cutch State, native: કચ્છ }
  from: 1147
  to: 1946
  color: "#5a8fd0"
  summary: 큰·작은 란(소금 늪)에 둘러싸인 쿠치 반도의 나라로, 사마 부족의 자데자 왕조가 라오 칭호로 다스림. 1819년 영국 종주를 받아들임
  mapNote: 지도에는 1757년부터 1946년까지 지금 쿠치 지구 땅으로 표시함(란 포함)
  endNote: 1947년 인도에 가입했고 1948년 6월 1일 인도의 쿠치주가 됨
  features:
    - 도읍은 1549년부터 부즈
    - 1819년 지진으로 신드 쪽 란에 '알라의 둑'이 솟음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Cutch State"]
    foundingNote: 사마 부족의 라코 자다니가 나라를 세운 1147년 무렵부터 봄

- id: kathiawar-states
