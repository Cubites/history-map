- id: baroda-state
  level: polity
  names: { ko: 바로다 주, en: Baroda State, native: બરોડા }
  from: 1721
  to: 1946
  color: "#c8d860"
  summary: 마라타의 가이크와드 가문이 구자라트에 세운 토후국으로, 페슈와의 총독으로 시작해 바로다를 도읍으로 삼음. 1802년 동인도 회사와 보조 조약을 맺음
  details: 1817~1818년 페슈와 몫이던 아마다바드 등 구자라트 평원의 세입이 영국으로 넘어가 바로다는 카디·바로다·나브사리·암렐리 네 프란트로 줄어듦
  mapNote: 지도에는 1757년부터 1817년까지 구자라트 평원 전체(쿠치·카티아와르 밖)를 이 나라 색으로, 1818년부터 1946년까지 카디·바로다 프란트만 표시함. 나브사리·암렐리 프란트는 1만 km² 미만이라 나누지 않음
  endNote: 1949년 5월 1일 봄베이주에 합쳐짐(1948년 인도 가입)
  features:
    - 도읍은 바로다(지금 바도다라)
    - 사야지라오 3세(재위 1875~1939)가 학교·철도를 넓힘
    - 1802년부터 영국 주재관이 바로다에 머묾
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Baroda State"]
    foundingNote: 1721년 필라지 라오 가이크와드가 송가드를 차지한 해부터 봄(바로다 점령 1734년)

- id: punjab-states
  level: polity
