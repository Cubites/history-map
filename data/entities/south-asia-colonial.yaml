# 동인도 회사·영국령 인도(여러 칸이 칠함, 글은 동 칸). 1858년에 같은 땅의 주인이 회사에서 영국 왕실로 바뀐 것이라 두 항목을 successor_of로 잇는다
- id: company-india
  level: polity
  names: { ko: 동인도 회사령 인도, en: Company rule in India, native: कंपनी राज }
  from: 1757
  to: 1857
  color: "#b84a4a"
  summary: 영국 동인도 회사가 인도에서 다스린 땅. 1757년 플라시 전투로 벵골 나와브를 꺾고 1765년 알라하바드 조약으로 벵골·비하르·오리사의 디와니(세금 징수권)를 받아 영토 지배를 시작함. 1773년 규제법으로 콜카타에 총독을 두었고, 전쟁과 보조 동맹, 후사 없는 나라를 거두는 실권 원칙으로 인도 대부분을 직접 다스리거나 토후국으로 묶음. 1857년 세포이 항쟁이 북인도로 번진 뒤 이듬해 영국 왕실이 통치를 넘겨받음
  mapNote: 지도에는 1765년 디와니부터 회사가 다스린 땅으로 표시하고, 1757~1764년 벵골·비하르는 벵골 나와브로 그림. 회사의 보호를 받은 토후국 가운데 1만 km² 이상인 나라와 작은 토후국이 이어진 묶음은 따로 그리고, 홀로 1만 km² 미만인 토후국은 같은 색. 1801년 아와드가 넘긴 로힐칸드·도아브·고라크푸르, 1803년 상부 도아브·분델칸드·오리사 해안, 1815년 쿠마온·가르왈, 1826년 아삼, 1832년 카차르, 1835년 카시·자인티아 구릉, 1849년 삼발푸르, 1854년 차티스가르 평지, 1856년 아와드를 그해부터 넣음. 서쪽은 1803년 델리·하리아나, 1818년 아지메르와 라지푸타나의 작은 주들(분디·통크·시로히 등)·구자라트 평원, 1843년 신드와 타르, 1846년 잘란다르 도아브·캉그라·시스틀레지, 1849년 펀자브·카이베르 파크툰크와 평원을 더함. 데칸·남인도는 1766년 북부 시르카르, 1788년 구투르, 1792년 말라바르·바라마할·딘디굴, 1799년 카나라·코임바토르, 1800년 쿠르눌·카다파·아난타푸르·벨라리(양도 지구), 1801년 카르나타카(넬로르·치토르·타밀나두 대부분), 1818년 페슈와 땅(마하라슈트라 서부·북 카르나타카)과 나르마다 계곡·사가르, 1834년 쿠르그, 1849년 사타라, 1853년 베라르, 1854년 나그푸르를 더함. 경계는 지금 지구 경계를 어림한 선. 1857~1858년 항쟁 때 반군이 잠시 차지한 땅은 그리지 않음
  endNote: 1858년 8월 인도 통치법으로 회사의 통치권이 영국 왕실로 넘어가 11월 1일부터 영국령 인도가 됨
  features:
    - 총독 청은 콜카타(1773년부터)
    - 벵골·마드라스·봄베이 세 관구로 나누어 다스림
    - 1793년 영구 정액제로 벵골 지세를 자민다르에게 고정함
    - 군대 대부분이 인도인 병사 세포이였음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알라하바드 조약(1765)", "인도 통치법(1858)"]
    foundingNote: 플라시 전투(1757년 6월 23일) 뒤 회사가 벵골 나와브를 세운 1757년부터

- id: british-raj
  level: polity
  names: { ko: 영국령 인도, en: British Raj, native: ब्रिटिश राज }
  from: 1858
  to: 1946
  color: "#e28b96"
  summary: 1858년부터 1947년까지 영국 왕실이 다스린 인도. 런던의 인도 담당 장관과 인도 총독(부왕)이 직할 주를 다스리고, 500곳이 넘는 토후국은 종주권 아래 둠. 1877년 빅토리아 여왕이 인도 황제 칭호를 받았고, 1885년 생긴 인도 국민 회의가 독립운동을 이끎. 1911년 수도를 콜카타에서 델리로 옮겼고, 1935년 인도 통치법으로 주 자치를 넓힘
  mapNote: 지도에는 1858년부터 1946년까지 영국이 직접 다스린 주로 표시하고, 1만 km² 이상 토후국과 작은 토후국이 이어진 묶음은 따로, 홀로 1만 km² 미만인 토후국은 같은 색으로 그림. 1865년 부탄 두아르·칼림퐁, 1881년 나가 구릉, 1887년 영국령 발루치스탄, 1893년 듀랜드선 안쪽 부족 지역, 1895년 루샤이 구릉과 말라칸드 쪽, 1914년 아루나찰을 그해부터 넣었고, 1858년 레와 주에 돌려준 소하그푸르(샤돌 쪽)는 넣지 않았으며, 맥마흔선 남쪽 가운데 지도의 청·중화민국 경계가 덮는 땅(약 3.4만 km²)은 넣지 않음. 버마(1886~1937년 영국령 인도의 주)는 동남아 지도 몫이라 여기서 그리지 않음
  endNote: 1947년 인도 독립법에 따라 8월 14~15일 인도와 파키스탄 두 자치령으로 나뉘어 독립함
  features:
    - 수도는 콜카타, 1911년부터 델리(1931년 뉴델리 완공)
    - 1877년 빅토리아 여왕이 인도 황제 칭호를 받음
    - 1905년 벵골을 나누었다가 1911년 되돌림
    - 1919년 암리차르 학살, 1930년 간디의 소금 행진
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["인도 통치법(1858)", "인도 독립법(1947)"]
    foundingNote: 인도 통치법에 따라 영국 왕실이 통치를 넘겨받은 1858년 11월 1일부터

# ── 갠지스 평원: 벵골 나와브·아와드·로힐칸드 ──
- id: bengal-nawabs
  level: polity
  names: { ko: 벵골 나와브, en: Nawabs of Bengal, native: বাংলার নবাব }
  from: 1717
  to: 1764
  color: "#4a9e5c"
  summary: 무굴 제국의 벵골 수바(벵골·비하르·오리사)를 대물림으로 다스린 나와브 정권. 1717년 무르시드 쿨리 칸이 무르시다바드에 도읍해 사실상 자립했고, 1751년 오리사를 마라타에 넘김. 1757년 플라시 전투에서 시라지 웃다울라가 영국 동인도 회사에 지고, 회사가 세운 미르 자파르·미르 카심 때부터 회사의 간섭을 받음. 1764년 북사르 전투에서 미르 카심과 아와드·무굴 연합군이 짐
  mapNote: 지도에는 1757년부터 1764년까지 지금 서벵골주(두아르·칼림퐁 제외)·방글라데시·비하르주·자르칸드주와 아삼주 고알파라 쪽 땅으로 표시함. 1760년 회사에 넘긴 부르드완·미드나포르·치타공(약 2.6만 km²)은 1765년 디와니 때 함께 회사 땅으로 옮김
  endNote: 1765년 알라하바드 조약으로 무굴 황제가 회사에 디와니를 넘겨 나와브는 실권을 잃었고, 직함만 1880년까지 이어짐
  features:
    - 도읍은 무르시다바드
    - 1756년 시라지 웃다울라가 콜카타의 영국 요새를 빼앗음
    - 1760년 미르 카심이 부르드완·미드나포르·치타공을 회사에 넘김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알라하바드 조약(1765)"]
    foundingNote: 무르시드 쿨리 칸이 벵골 나와브가 된 1717년부터

- id: awadh
  level: polity
  names: { ko: 아와드, en: Awadh, native: اودھ }
  from: 1722
  to: 1855
  color: "#a8a030"
  summary: 갠지스강 중류의 무굴 제국 수바에서 자립한 나라로, 1722년 사아다트 알리 칸 1세가 나와브가 되어 대물림 왕조를 엶. 1764년 북사르 전투에서 영국 동인도 회사에 졌고, 1774년 로힐칸드를 차지했으나 1775년 바라나시, 1801년 로힐칸드·도아브·고라크푸르를 회사에 넘김. 1819년 가지 웃딘 하이다르가 왕(바드샤)을 칭함
  mapNote: 지도에는 1757년부터 1855년까지 표시하고, 1757~1800년은 오우드에 하부 도아브·고라크푸르(1774년까지는 바라나시 지부도, 1774년부터는 로힐칸드도)를 더한 땅, 1801년부터는 오우드(지금 러크나우·파이자바드 지부)만 그림. 경계는 지금 지구 경계를 어림한 선. 1765~1773년 무굴 황제 몫이던 알라하바드·코라(약 1만 km²)는 아와드 땅에 둠
  endNote: 1856년 2월 7일 회사가 실정을 이유로 병합해 오우드 주로 만들었고, 마지막 왕 와지드 알리 샤는 콜카타로 옮겨짐
  features:
    - 도읍은 파이자바드, 1775년부터 러크나우
    - 1801년 보조 조약으로 회사 군대를 두고 땅 절반을 넘김
    - 러크나우에서 시아파 이슬람 건축과 궁정 문화가 꽃핌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["바라나시 조약(1775)", "아와드 할양 조약(1801)"]
    foundingNote: 사아다트 알리 칸 1세가 아와드 수바다르가 된 1722년부터

- id: rohilkhand
  level: polity
  names: { ko: 로힐칸드, en: Rohilkhand, native: روہیل کھنڈ }
  from: 1721
  to: 1773
  color: "#d07050"
  summary: 갠지스강 북동쪽 바레일리 일대의 로힐라 아프간인 나라로, 알리 무함마드 칸이 1721년 무렵부터 땅을 넓혀 세움. 그가 죽은 뒤 하피즈 라흐마트 칸이 섭정으로 로힐라 수장들을 이끌었고, 1761년 파니파트 싸움에서 두라니 편에 섬. 1774년 아와드가 영국 동인도 회사 군대와 함께 쳐들어온 로힐라 전쟁에서 짐
  mapNote: 지도에는 1757년부터 1773년까지 지금 바레일리·모라다바드 지부(바레일리·바다운·샤자한푸르·필리비트·모라다바드·비즈노르 등)를 어림한 선으로 표시함. 람푸르(1만 km² 미만)는 같은 색
  endNote: 1774년 4월 하피즈 라흐마트 칸이 미란푸르 카트라에서 전사해 땅이 아와드에 넘어갔고, 람푸르만 로힐라 나와브 몫으로 남음
  features:
    - 도읍은 바레일리
    - 로힐라는 18세기에 들어온 파슈툰계 이주민과 그 후손
    - 수장들이 땅을 나눠 가진 느슨한 연합이었음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 로힐칸드 항목"]
    foundingNote: 알리 무함마드 칸이 로힐라 수장으로 자리 잡은 1721년부터

# ── 히말라야 서부: 쿠마온·가르왈·테흐리 가르왈 ──
- id: kumaon-kingdom
  level: polity
  names: { ko: 쿠마온 왕국, en: Kumaon Kingdom, native: कुमाऊँ }
  from: 700
  to: 1789
  color: "#5a9a4a"
  summary: 히말라야 서부 쿠마온 산지를 찬드 왕조가 다스린 왕국. 전승으로는 8세기에 솜 찬드가 참파와트에서 왕조를 열었고, 1563년 도읍을 알모라로 옮김. 18세기 중엽 로힐라의 침입과 궁정 다툼으로 약해짐
  mapNote: 지도에는 1757년부터 1789년까지 지금 우타라칸드주 쿠마온 지부를 어림한 선으로 표시함
  endNote: 1790년 고르카(네팔) 군대가 알모라를 차지해 네팔에 병합됨
  features:
    - 도읍은 참파와트, 1563년부터 알모라
    - 서쪽 이웃 가르왈 왕국과 자주 싸움
    - 1740년대 로힐라 군대가 알모라까지 쳐들어옴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 쿠마온 항목"]
    # 작업 메모: 알모라 함락은 위키 Unification of Nepal 1790, Kumaon Kingdom 1791 — 앞의 해를 따름
    foundingNote: 솜 찬드가 왕조를 열었다고 전하는 8세기(700년)부터

- id: garhwal-kingdom
  level: polity
  names: { ko: 가르왈 왕국, en: Garhwal Kingdom, native: गढ़वाल }
  from: 823
  to: 1802
  color: "#2f8f9f"
  summary: 히말라야 서부 가르왈 산지를 파르마르(판와르) 왕조가 다스린 왕국. 전승으로는 823년 카나크 팔이 세웠고, 뒤에 산지 요새(가르) 여러 곳을 아울러 가르왈이라 불림. 18세기 말 쿠마온·로힐라·시크와 다투며 약해짐
  mapNote: 지도에는 1757년부터 1802년까지 지금 우타라칸드주 가르왈 지부(데라둔·하리드와르 포함)를 어림한 선으로 표시함
  endNote: 1803년 고르카 군대가 스리나가르를 차지했고, 이듬해 1월 프라디윰나 샤가 데라둔 쿠르부라 싸움에서 전사해 네팔에 병합됨
  features:
    - 도읍은 스리나가르(가르왈)
    - 바드리나트·케다르나트 등 힌두교 성지가 있음
    - 1803년 큰 지진을 겪은 해에 고르카의 침공을 받음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 가르왈 항목"]
    foundingNote: 카나크 팔이 왕조를 열었다고 전하는 823년부터

- id: tehri-garhwal
  level: polity
  names: { ko: 테흐리 가르왈 주, en: Tehri Garhwal State, native: टिहरी गढ़वाल }
  from: 1815
  to: 1946
  color: "#4f8fbf"
  summary: 앵글로-네팔 전쟁 뒤 영국이 옛 가르왈 왕가에 돌려준 산지 토후국. 프라디윰나 샤의 아들 수다르샨 샤가 알라크난다강 서쪽 땅을 받아 테흐리에 도읍함. 1949년 인도에 합쳐질 때까지 왕가가 대를 이어 다스림
  mapNote: 지도에는 1815년부터 1946년까지 지금 테흐리 가르왈·우타르카시 지구를 어림한 선으로 표시함(1901년 약 1.1만 km²). 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1949년 8월 연합주(지금 우타르프라데시주)에 합쳐짐
  features:
    - 도읍은 테흐리, 20세기에 나렌드라나가르를 새로 세움
    - 갠지스강 수원 강고트리가 영토 안에 있음
    - 1930년 틸라리에서 숲 권리를 요구한 농민에게 총을 쏨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["수가울리 조약(1815)"]
    foundingNote: 수가울리 조약(1815) 뒤 수다르샨 샤가 라자로 인정받은 1815년부터

# ── 아삼과 북동 ──
- id: ahom-kingdom
  level: polity
  names: { ko: 아홈 왕국, en: Ahom kingdom, native: আহোম ৰাজ্য }
  from: 1228
  to: 1825
  color: "#d08a3a"
  summary: 브라마푸트라강 골짜기를 600년 가까이 다스린 왕국으로, 1228년 타이계 수카파가 세움. 1671년 사라이가트 싸움에서 무굴 제국의 침입을 막았음. 1769~1805년 모아모리아 반란으로 크게 약해졌고, 1817년부터 버마(콘바웅)가 쳐들어와 1819년부터 직접 다스림
  mapNote: 지도에는 1757년부터 1818년까지 마나스강 동쪽 브라마푸트라 골짜기(지금 아삼주 캄루프에서 틴수키아까지)를 어림한 선으로 표시하고, 버마가 다스린 1819~1825년은 비움. 1833~1838년 회사가 상부 아삼에 왕을 다시 세운 때(약 1.9만 km²)는 회사 땅으로 둠
  endNote: 제1차 영국-버마 전쟁 뒤 1826년 2월 24일 얀다보 조약으로 버마가 아삼을 영국 동인도 회사에 넘겨 끝남
  features:
    - 도읍은 가르가온·랑푸르, 1794년부터 조르하트
    - 성인 남자가 나라에 노역을 바치는 파이크 제도로 다스림
    - 부란지라는 연대기를 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["부란지(아홈 연대기)", "얀다보 조약(1826)"]
    foundingNote: 수카파가 브라마푸트라 골짜기에 들어와 나라를 세운 1228년부터

- id: manipur
  level: polity
  names: { ko: 마니푸르 왕국, en: Manipur Kingdom, native: মণিপুর }
  from: 1110
  to: 1946
  color: "#3f9f8f"
  summary: 인도 북동쪽 마니푸르 분지의 메이테이 왕국. 1110년 무렵 캉레이팍 왕국이 섰다고 봄. 18세기 가리브 니와즈 때 힌두교를 받아들이고 버마와 싸움. 1819~1825년 버마에 점령되었다가 1826년 얀다보 조약으로 감비르 싱이 왕위를 되찾았고, 1891년 영국-마니푸르 전쟁 뒤 영국의 토후국이 됨
  mapNote: 지도에는 1757년부터 1946년까지 지금 마니푸르주 땅으로 표시하고(1941년 약 2.2만 km²), 버마가 다스린 1819~1825년은 비움. 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1949년 10월 15일 인도에 합쳐짐
  features:
    - 도읍은 임팔(캉글라 궁성)
    - 메이테이 말과 고유 문자 메이테이 마예크를 씀
    - 1891년 전쟁 뒤 영국이 어린 추라찬드 싱을 왕으로 세움
    - 폴로 경기가 이곳에서 영국으로 퍼짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["얀다보 조약(1826)"]
    foundingNote: 캉레이팍 왕국이 섰다고 보는 1110년부터

- id: tripura
  level: polity
  names: { ko: 트리푸라 왕국, en: Twipra Kingdom, native: ত্রিপুরা }
  from: 1400
  to: 1946
  color: "#6a8ad0"
  summary: 인도 북동쪽 트리푸라 구릉의 왕국으로, 15세기 무렵 마하 마니키아가 마니키아 왕조를 열었다고 봄. 16세기 다냐 마니키아 때 벵골 평야까지 넓혔으나 17세기 무굴에 평야를 내줌. 영국 시대에는 구릉 땅은 왕이 다스리는 토후국이었고, 평야 땅 차클라 로샤나바드는 벵골의 자민다리로 왕이 가짐
  mapNote: 지도에는 1757년부터 1946년까지 지금 트리푸라주 땅으로 표시함(약 1만 km²). 평야의 차클라 로샤나바드(지금 방글라데시 코밀라 쪽)는 회사·영국령 인도 땅에 둠. 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1949년 10월 15일 인도에 합쳐짐
  features:
    - 도읍은 우다이푸르, 18세기 중엽 옛 아가르탈라, 1849년부터 아가르탈라
    - 왕실 연대기 『라즈말라』를 남김
    - 1871년부터 영국 정무관이 아가르탈라에 머묾
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『라즈말라』"]
    foundingNote: 마하 마니키아가 왕조를 열었다고 보는 1400년 무렵부터

# ── 오리사·차티스가르 토후국 ──
- id: orissa-states
  level: polity
  names: { ko: 오리사 토후국들, en: Orissa Tributary States, native: ଗଡ଼ଜାତ }
  from: 1757
  to: 1946
  color: "#c9a26b"
  summary: 오리사 해안 평야 뒤 산지에 있던 작은 토후국 20여 곳(가르자트)의 묶음. 18세기에는 나그푸르의 마라타에 공물을 바쳤고, 1803년 회사가 오리사 해안을 차지한 뒤 영국에 공물을 바치는 속국이 됨. 1905년 칼라한디·파트나·강푸르 등이 더해졌고, 1933년 동부 토후국 관구 아래 묶임
  mapNote: 지도에는 1757년부터 1946년까지 지금 오디샤주에서 해안 평야·남부·삼발푸르·마유르반즈 주를 뺀 내륙 땅(케온자르·덴카날·앙굴·볼랑기르·칼라한디·순다르가르 등)을 한 묶음으로 표시함. 1만 km² 미만 토후국들이 이어진 땅이라 묶었고, 삼발푸르는 1849년 병합 전까지 이 묶음에 넣음. 1847년 병합된 앙굴(1만 km² 미만)은 묶음 색. 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1948년 1월 1일 대부분이 오리사주에 합쳐짐
  features:
    - 큰 나라는 케온자르·칼라한디·파트나·덴카날
    - 각 라자가 내정을 다스리고 공물을 바침
    - 1930년대 주민 운동(프라자 만달)이 토후 통치에 맞섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 오리사 속국 항목"]
    foundingNote: 여러 소국은 중세부터 이어졌고, 이 묶음은 1757년 모습부터 다룸

- id: mayurbhanj-state
  level: polity
  names: { ko: 마유르반즈 주, en: Mayurbhanj State, native: ମୟୂରଭଞ୍ଜ }
  from: 1100
  to: 1946
  color: "#5a7fb0"
  summary: 오리사 북동쪽의 토후국으로, 12세기 무렵 아디 반자가 세웠다고 전하는 반자 왕조가 다스림. 18세기에는 마라타에 공물을 바쳤고, 1803년 회사가 오리사를 차지한 뒤 영국의 속국이 됨. 20세기 초 바리파다까지 철도를 놓는 등 근대 시설을 들임
  mapNote: 지도에는 1757년부터 1946년까지 지금 마유르반즈 지구를 어림한 선으로 표시함(1901년 약 1.1만 km²). 1947년부터는 인도 땅
  endNote: 1948년 인도 자치령에 가입했고 1949년 1월 1일 오리사주에 합쳐짐
  features:
    - 도읍은 바리파다
    - 시밀리팔 숲과 철광산이 있음
    - 주민 다수가 산탈·호 등 부족민
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 마유르반즈 항목"]
    foundingNote: 아디 반자가 왕조를 세웠다고 전하는 12세기(1100년 무렵)부터

- id: bastar-state
  level: polity
  names: { ko: 바스타르 주, en: Bastar State, native: बस्तर }
  from: 1324
  to: 1946
  color: "#b07ac0"
  summary: 차티스가르 남쪽 숲과 고원의 토후국으로, 1324년 카카티야 왕가의 안나마 데오가 세웠다고 전함. 1779년 무렵부터 나그푸르 본슬레에 공물을 바쳤고 1818년부터 영국의 보호를 받음. 주민 대부분이 곤드 등 부족민이며 1910년 붐칼 반란이 일어남
  mapNote: 지도에는 1757년부터 1946년까지 지금 바스타르 지부에서 칸케르 지구를 뺀 땅을 어림한 선으로 표시함(1901년 약 3.4만 km²). 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1948년 1월 1일 중앙 주와 베라르에 합쳐짐
  features:
    - 도읍은 자그달푸르
    - 단테와다의 단테슈와리 여신을 왕가 수호신으로 모심
    - 다세라 축제가 75일 동안 열림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 바스타르 항목"]
    foundingNote: 카카티야 왕가의 안나마 데오가 바스타르에 왕국을 세웠다고 전하는 1324년부터

- id: surguja-state
  level: polity
  names: { ko: 수르구자 주, en: Surguja State, native: सरगुजा }
  from: 1613
  to: 1946
  color: "#3f6fa0"
  summary: 차티스가르 북쪽 고원의 토후국. 18세기 말 나그푸르 본슬레에 공물을 바쳤고, 1818년 제3차 영국-마라타 전쟁 뒤 영국의 보호국이 됨. 1905년 초타나그푸르 속국들에서 차티스가르 쪽으로 옮겨짐
  mapNote: 지도에는 1757년부터 1946년까지 지금 수르구자·발람푸르·수라지푸르 지구를 어림한 선으로 표시함(1901년 약 1.6만 km²). 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1948년 1월 1일 중앙 주와 베라르에 합쳐짐
  features:
    - 도읍은 암비카푸르
    - 마인파트 고원과 숲이 넓게 차지함
    - 주민 다수가 곤드·오라온 등 부족민
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 수르구자 항목"]
    foundingNote: 위키백과가 나라가 섰다고 적은 1613년부터

- id: chhattisgarh-states
  level: polity
  names: { ko: 차티스가르 토후국들, en: Chhattisgarh Feudatory States, native: छत्तीसगढ़ }
  from: 1757
  to: 1946
  color: "#6a5040"
  summary: 차티스가르 북쪽과 동쪽의 작은 토후국들(코리아·창바카르·자슈푸르·우다이푸르·라이가르·삭티·사랑가르)의 묶음. 18세기에는 나그푸르 본슬레에 공물을 바쳤고 1818년부터 영국의 보호를 받음. 1933년 동부 토후국 관구 아래 묶임
  mapNote: 지도에는 1757년부터 1946년까지 지금 코리아·자슈푸르·라이가르 지구 일대를 한 묶음으로 어림해 표시함(1만 km² 미만 토후국들이 이어진 땅). 칸케르·난드가온 등 서부 토후국은 떨어져 있고 무리마다 1만 km² 미만이라 둘레와 같은 색. 1947년부터는 인도 땅
  endNote: 1947년 인도 자치령에 가입했고 1948년 1월 1일 중앙 주와 베라르에 합쳐짐
  features:
    - 큰 나라는 자슈푸르·코리아·라이가르
    - 각 라자가 내정을 다스리고 공물을 바침
    - 주민 다수가 곤드·오라온 등 부족민
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『Imperial Gazetteer of India』 차티스가르 속국 항목"]
    foundingNote: 여러 소국은 그 전부터 있었고, 이 묶음은 1757년 모습부터 다룸

# ── S2 동 끝 ──

# ── S2 남 ──
# 남아시아 S2 남(2026-11-03): 마라타 넷(페슈와·괄리오르·인도르·나그푸르, 바로다는 서), 데칸·남인도 왕국과 토후국, 중앙 인도 토후국과 묶음 둘, 실론의 칸디 왕국·네덜란드령 실론.
#   1757년 전에 선 나라는 from을 실제 해로 적고 지도는 1757년부터(그 앞은 S3). 1947년에 인도에 가입한 토후국은 to 1946(1947년부터 인도 땅).
- id: maratha-peshwa
  level: polity
  names: { ko: 마라타 제국, en: Maratha Empire, native: मराठा साम्राज्य }
  from: 1674
  to: 1818
  color: "#e8a838"
  summary: 시바지가 세운 데칸의 힌두 왕국이 18세기에 인도 대부분으로 세력을 넓힌 나라로, 1713년부터는 사타라의 왕 대신 푸네의 페슈와(재상)가 실권을 쥠. 신디아·홀카르·본슬레·가이크와드 같은 장군 가문이 말와·나그푸르·구자라트를 나눠 맡아 연합처럼 움직였고, 1761년 파니파트에서 두라니 군에 크게 졌음. 1775~1782년·1803~1805년·1817~1818년 세 번 영국 동인도 회사와 싸움
  mapNote: 지도에는 1757년부터 1817년까지 페슈와가 직접 다스린 땅(콘칸·데시·칸데시·북 카르나타카와 말와·사가르, 1802년까지 잔시·반다 쪽 분델칸드 약 3만 km²)을 표시하고, 신디아(괄리오르 주)·홀카르(인도르 주)·본슬레(나그푸르 왕국)·가이크와드(바로다 주) 땅은 따로 항목으로 그림. 말와 서부의 작은 군주 땅과 본슬레 분가의 콜하푸르(1만 km² 미만)도 1817년까지 이 색으로 어림함. 다르와드 쪽은 1779년부터 1791년까지 마이소르 땅
  endNote: 1817년 11월 푸네 근처 키르키에서 영국군에 지고 1818년 6월 페슈와 바지라오 2세가 항복해 땅이 동인도 회사에 넘어감
  features:
    - 도읍은 페슈와의 푸네, 왕은 사타라에 머묾
    - 땅마다 수확의 4분의 1을 거두는 차우트 세금으로 세력을 넓힘
    - 1782년 살바이 조약으로 1차 전쟁 전 모습으로 돌아감
    - 1802년 바세인 조약으로 페슈와가 영국의 보조 동맹을 받아들임
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["살바이 조약(1782)", "바세인 조약(1802)"]
    foundingNote: 시바지가 왕위에 오른 1674년부터

- id: gwalior-state
  level: polity
  names: { ko: 괄리오르 주, en: Gwalior State, native: ग्वालियर रियासत }
  from: 1731
  to: 1946
  color: "#6f7fc4"
  summary: 마라타 장군 신디아 가문이 말와에서 세운 나라로, 중앙 인도에서 가장 큰 토후국이 됨. 마하지 신디아(1761~1794) 때 괄리오르 요새를 얻고 델리의 무굴 황제를 보호하며 북인도 최강 세력이 되었으나, 1803년 영국에 져 델리·도아브를 잃음. 1810년 도읍을 우자인에서 괄리오르(라슈카르)로 옮김
  mapNote: 지도에는 1757년부터 우자인·만드소르·샤자푸르 쪽 말와 땅을, 1784년부터 괄리오르·구나·시브푸리 쪽 북부를 더해 표시하고, 1788년부터 1802년까지 델리·하리아나와 상부 도아브(합 약 7.4만 km²)를 더함. 비디샤·니마르 쪽 신디아 몫(하나하나 1만 km² 미만)은 이웃 색으로 어림함. 1818년 전 페슈와와의 관계는 명목 종속으로 적음
  endNote: 1947년 인도에 가입했고, 1948년 인도르 등과 합쳐 마디아 바라트주가 됨
  features:
    - 도읍은 1810년까지 우자인, 그 뒤 괄리오르(라슈카르)
    - 1817년 조약으로 영국의 보호를 받고 1818년부터 토후국이 됨
    - 1844년 마하라지푸르 전투에 진 뒤 영국 주재관의 감독을 받음
    - 1857년 항쟁 때 왕은 영국 편에 섰으나 군대 일부가 반란에 가담함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["괄리오르 조약(1817)", "Imperial Gazetteer of India: Gwalior State"]
    foundingNote: 라노지 신디아가 페슈와에게서 말와의 몫을 받은 1731년부터

- id: indore-state
  level: polity
  names: { ko: 인도르 주, en: Indore State, native: इंदौर रियासत }
  from: 1732
  to: 1946
  color: "#a8c25a"
  summary: 마라타 장군 홀카르 가문이 말와 남부에서 세운 나라로, 1818년부터 중앙 인도의 토후국이 됨. 아힐리아바이 홀카르(1767~1795)가 나르마다강 가의 마헤슈와르에서 다스리며 사원과 가트를 지었고, 야슈완트라오 홀카르는 1804~1805년 영국과 싸움. 1818년 1월 만드소르 조약으로 영국의 보호를 받음
  mapNote: 지도에는 1757년부터 인도르·마헤슈와르·카르곤 쪽 몸통을 표시하고, 람푸라-반푸라·메히드푸르·네마와르 등 흩어진 땅(합 약 1.4만 km², 하나하나 1만 km² 미만)은 이웃 색으로 어림함. 1818년 전 페슈와와의 관계는 명목 종속으로 적음
  endNote: 1947년 인도에 가입했고, 1948년 괄리오르 등과 합쳐 마디아 바라트주가 됨
  features:
    - 도읍은 1767~1818년 마헤슈와르, 1818년부터 인도르
    - 1817년 마히드푸르 전투에서 영국군에 짐
    - 1818년 만드소르 조약으로 라지푸타나 쪽 권리를 내놓음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["만드소르 조약(1818)", "Imperial Gazetteer of India: Indore State"]
    foundingNote: 말하르라오 홀카르가 페슈와에게서 말와의 몫을 받은 1732년부터

- id: nagpur-kingdom
  level: polity
  names: { ko: 나그푸르 왕국, en: Nagpur Kingdom, native: नागपूर राज्य }
  from: 1739
  to: 1853
  color: "#4f9e9a"
  summary: 마라타 장군 본슬레 가문이 인도 중부 나그푸르에서 세운 나라로, 곤드족 데오가르 왕국 땅을 차지하고 차티스가르·오리사로 세력을 넓힘. 1803년 데오가온 조약으로 오리사 해안과 베라르 몫을 잃고, 1817년 시타불디 전투에 진 뒤 나르마다 계곡을 영국에 넘김
  mapNote: 지도에는 1757년부터 1853년까지 나그푸르·찬드라푸르와 친드와라·발라가트 쪽(세오니·베툴은 1817년까지)을 표시하고, 1785년부터 1817년까지 나르마다 계곡(자발푸르·만들라·호샹가바드)을 더함. 오리사 해안(발라소르·쿠타크·푸리, 약 1.9만 km²)은 1802년까지, 차티스가르 평지(약 6.2만 km²)는 1853년까지 같은 색. 1818년 전 페슈와와의 관계는 명목 종속으로 적음
  endNote: 1853년 12월 라구지 3세가 아들 없이 죽자 영국이 실권 원칙을 들어 1854년 3월 병합함(1861년 중앙 주)
  features:
    - 도읍은 나그푸르
    - 1785년 페슈와와의 조약으로 만들라와 상부 나르마다를 얻음
    - 1818년 시타불디 패배 뒤 남은 땅을 영국 주재관이 감독함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["데오가온 조약(1803)", "Imperial Gazetteer of India: Nagpur"]
    foundingNote: 라구지 본슬레가 나그푸르를 근거로 자리 잡은 1739년부터

- id: mysore
  level: polity
  names: { ko: 마이소르 왕국, en: Kingdom of Mysore, native: ಮೈಸೂರು ಸಂಸ್ಥಾನ }
  from: 1399
  to: 1946
  color: "#a0508a"
  summary: 인도 남부 카르나타카 고원의 워디야르 왕가 왕국으로, 1761년 장군 하이데르 알리가 실권을 쥐고 아들 티푸 술탄과 함께 남인도 최강국으로 키움. 영국과 네 번 싸워 1792년 세링가파탐 조약으로 땅 절반을 잃었고, 1799년 티푸가 전사한 뒤 영국이 워디야르 왕가를 다시 세워 토후국으로 둠
  mapNote: 지도에는 1757년 마이소르·만디아·툼쿠루 쪽 옛 땅을 표시하고, 1763년 시라·비드누르·카나라, 1766년 말라바르와 코임바토르·살렘·딘디굴, 1779년 다르와드·벨라리·양도 지구를 더함. 1792년 말라바르·살렘·딘디굴과 다르와드·카다파·쿠르눌을 내주고, 1799년부터 지금 카르나타카 남부의 토후국 땅만 그림. 1831~1881년 영국 판무관이 직접 다스린 때도 토후국으로 같은 색
  endNote: 1947년 인도에 가입해 마이소르주가 되었고, 1956년 주 재편으로 지금 카르나타카주의 바탕이 됨
  features:
    - 도읍은 마이소르, 1761~1799년 스리랑가파트나
    - 하이데르 알리와 티푸 술탄은 로켓과 프랑스식 군대로 영국과 싸움
    - 1784년 망갈로르 조약으로 2차 전쟁을 서로 땅을 돌려주고 끝냄
    - 1831년 농민 봉기 뒤 영국이 50년 동안 직접 다스리고 1881년 왕에게 돌려줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["세링가파탐 조약(1792)", "마이소르 분할 조약(1799)"]
    foundingNote: 야두라야가 워디야르 왕가를 연 1399년부터

- id: carnatic-nawab
  level: polity
  names: { ko: 카르나타카 나와브, en: Carnatic Sultanate, native: نوابِ کرناٹک }
  from: 1692
  to: 1801
  color: "#58b8c8"
  summary: 무굴 제국의 카르나타카 태수가 자립한 동남 해안의 나와브국으로, 아르코트를 도읍으로 지금 타밀나두 대부분과 안드라프라데시 남부를 다스림. 1749~1754년 나와브 자리를 두고 영국과 프랑스가 각각 후보를 밀어 싸웠고(카르나타카 전쟁), 영국이 민 무함마드 알리 왈라자가 이김. 빚과 보조금에 묶여 동인도 회사의 영향 아래 놓임
  mapNote: 지도에는 1757년부터 1800년까지 나와브가 다스린 땅 전부를 표시함. 남쪽 마두라이·티루넬벨리는 팔라야카라(소영주)들의 힘이 세어 나와브의 실권이 약했고, 탄자부르·푸두코타이(1만 km² 미만)와 회사의 첸갈파투 땅도 같은 색. 코임바토르·살렘·딘디굴 쪽은 1766년부터 마이소르 땅
  endNote: 1801년 7월 카르나타카 조약으로 나와브가 영토 통치권을 동인도 회사에 넘겼고, 1855년 칭호도 없어짐
  features:
    - 도읍은 아르코트, 1768년부터 마드라스의 체파욱 궁전
    - 1765년 무굴 황제가 나와브의 자립을 인정함
    - 회사에 진 빚이 커져 땅의 세금을 회사가 직접 거둠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["카르나타카 조약(1801)"]
    foundingNote: 줄피카르 칸이 무굴의 카르나타카 태수로 자리 잡은 1692년부터

- id: travancore
  level: polity
  names: { ko: 트라방코르 왕국, en: Kingdom of Travancore, native: തിരുവിതാംകൂർ }
  from: 1729
  to: 1946
  color: "#3a8a62"
  summary: 인도 남서쪽 끝 말라바르 해안의 왕국으로, 마르탄다 바르마(1729~1758)가 1741년 콜라첼 전투에서 네덜란드를 꺾고 이웃 소왕국들을 합쳐 세움. 1789년 티푸 술탄의 침공을 막았고, 1795년 영국 동인도 회사와 보조 동맹을 맺어 토후국이 됨
  mapNote: 지도에는 1757년부터 지금 케랄라주 남부(코친 남쪽)와 타밀나두주 칸야쿠마리 땅을 표시함
  endNote: 1947년 인도에 가입했고, 1949년 7월 1일 코친과 합쳐 트라방코르-코친주가 됨
  features:
    - 도읍은 파드마나바푸람, 1795년부터 티루바난타푸람
    - 1750년 마르탄다 바르마가 나라를 파드마나바 신에게 바침
    - 1809년 재상 벨루 탐비가 영국에 맞서 봉기함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["트라방코르 조약(1805)"]
    foundingNote: 마르탄다 바르마가 왕위에 오른 1729년부터

- id: bhopal-state
  level: polity
  names: { ko: 보팔 주, en: Bhopal State, native: भोपाल रियासत }
  from: 1707
  to: 1946
  color: "#9a6a3a"
  summary: 아프간 출신 무굴 군인 도스트 무함마드 칸이 말와 동부에 세운 무슬림 왕국으로, 중앙 인도에서 하이데라바드 다음으로 큰 무슬림 토후국이 됨. 1737년 보팔 전투 뒤 마라타에 조공했고, 1818년 영국과 조약을 맺어 토후국이 됨. 1819~1926년 네 여성 군주(베굼)가 잇따라 다스림
  mapNote: 지도에는 1757년부터 보팔·세호르·라이센 쪽 땅을 표시함. 1818년 전 페슈와와의 관계는 조공에 따른 명목 종속으로 적음
  endNote: 1947년 인도에 가입했고 1949년 인도 중앙 정부가 직접 다스리는 보팔주가 됨
  features:
    - 도읍은 보팔(1728~1742년 이슬람나가르)
    - 쿠드시아·시칸다르·샤자한·술탄 자한 네 베굼이 다스림
    - 1857년 항쟁 때 영국 편에 섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["보팔 조약(1818)", "Imperial Gazetteer of India: Bhopal State"]
    foundingNote: 도스트 무함마드 칸이 베라시아 영지를 얻은 1707년부터

- id: rewa-state
  level: polity
  names: { ko: 레와 주, en: Rewa State, native: रीवा रियासत }
  from: 1617
  to: 1946
  color: "#c07ab0"
  summary: 바겔 라지푸트 왕가가 다스린 바겔칸드의 왕국으로, 중앙 인도 동부에서 가장 큰 토후국. 1812년 영국과 조약을 맺어 보호를 받았고, 1857년 항쟁 때 영국 편에 선 대가로 소하그푸르(샤돌)·아마르칸타크를 돌려받음
  mapNote: 지도에는 1757년부터 레와·사트나·시디 쪽 땅을 표시하고, 소하그푸르(지금 샤돌·우마리아·아누푸르)는 1818년부터 1857년까지 영국 땅으로 그림. 본슬레가 소하그푸르를 차지한 때(1818년 전)는 레와 땅으로 어림함
  endNote: 1947년 인도에 가입했고 1948년 빈디아 프라데시주로 합쳐짐
  features:
    - 도읍은 1618년부터 레와(그 전 반다브가르)
    - 1812년 영국과 맺은 조약으로 보호국이 됨
    - 판나·마이하르 등 바겔칸드의 작은 토후국들과 이웃함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["레와 조약(1812)", "Imperial Gazetteer of India: Rewa State"]
    foundingNote: 바겔 왕가가 반다브가르에서 레와로 도읍을 옮긴 1617년 무렵부터

- id: bundelkhand-states
  level: polity
  names: { ko: 분델칸드 토후국들, en: Bundelkhand States, native: बुंदेलखंड }
  from: 1731
  to: 1946
  color: "#8a8a3a"
  summary: 분델라 라지푸트 왕 차트라살이 1731년 죽은 뒤 나뉜 분델칸드의 작은 왕국들(오르차·다티아·판나·차타르푸르·비자와르·차르카리 등)을 묶어 부르는 이름. 차트라살 유산의 3분의 1이 페슈와에게 넘어가 마라타에 조공했고, 1802~1812년 조약들로 하나씩 영국의 보호를 받아 분델칸드 에이전시가 됨
  mapNote: 하나하나 1만 km² 미만인 토후국들을 묶어 한 색으로 그림. 지도에는 1757년부터 지금 마디아프라데시주 북부(다티아·티캄가르·차타르푸르·판나)를 표시하고, 1802년까지 페슈와와의 관계는 명목 종속으로 적음. 잔시·사가르 쪽 페슈와 땅은 넣지 않음
  endNote: 1947년 인도에 가입했고 1948년 빈디아 프라데시주로 합쳐짐
  features:
    - 오르차는 16세기부터 이어진 분델라 왕가의 본가
    - 판나는 다이아몬드 광산으로 이름남
    - 카주라호 사원은 차타르푸르 땅에 있었음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["Imperial Gazetteer of India: Bundelkhand Agency"]
    foundingNote: 차트라살의 왕국이 아들들과 페슈와에게 나뉜 1731년부터

- id: malwa-states
  level: polity
  names: { ko: 말와 토후국들, en: Malwa States, native: मालवा }
  from: 1818
  to: 1946
  color: "#c8b4dc"
  summary: 3차 앵글로-마라타 전쟁 뒤 영국의 보호를 받은 말와 서부의 작은 토후국들(다르·데와스·라틀람·자오라·잡후아·알리라지푸르·바르와니·라지가르·나르싱가르 등)을 묶어 부르는 이름. 마라타 장군 가문(다르의 파와르, 데와스의 두 파와르)과 라지푸트·무슬림 군주들이 다스렸고 말와 에이전시·보팔 에이전시의 감독을 받음
  mapNote: 하나하나 1만 km² 미만인 토후국들을 묶어 한 색으로 그림. 지도에는 1818년부터 지금 마디아프라데시주 서부(괄리오르·인도르·보팔 땅 밖)를 표시하고, 인도르의 람푸라-반푸라 떨어진 땅(약 4,000 km²)도 이 색으로 어림함
  endNote: 1947년 인도에 가입했고 1948년 마디아 바라트주로 합쳐짐
  features:
    - 다르와 데와스는 페슈와 시대의 마라타 장군 파와르 가문이 다스림
    - 자오라는 홀카르의 장군 아미르 칸 일가의 무슬림 토후국
    - 1925년 바호파와르 에이전시가 말와 에이전시에 합쳐짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["Imperial Gazetteer of India: Malwa Agency"]
    foundingNote: 3차 앵글로-마라타 전쟁이 끝나 영국과 보호 조약을 맺은 1818년부터

- id: kandy
  level: polity
  names: { ko: 칸디 왕국, en: Kingdom of Kandy, native: මහනුවර රාජධානිය }
  from: 1469
  to: 1815
  color: "#c0503a"
  summary: 실론 섬 가운데 산지의 싱할라 왕국으로, 포르투갈·네덜란드가 해안을 차지한 뒤에도 독립을 지킴. 1739년부터는 남인도 출신 나야카 왕가가 왕위를 이었고, 1803년 영국군의 첫 침공을 물리침
  mapNote: 지도에는 1757년부터 1814년까지 실론 내륙(지금 중부·북중부·우바·사바라가무와주와 반니 쪽)을 표시함. 바닷가 지구와 내륙 사이 경계는 지금 지구 경계로 어림함
  endNote: 1815년 2월 영국군이 칸디를 차지했고, 3월 2일 칸디 협약으로 싱할라 귀족들이 마지막 왕 스리 비크라마 라자신하를 폐위하고 영국 왕을 받아들임
  features:
    - 도읍은 칸디(마하누와라)
    - 부처의 치아 사리를 모신 달라다 말리가와 사원이 왕권의 상징
    - 1766년 네덜란드와의 조약으로 바닷가 전부를 네덜란드에 내줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["칸디 협약(1815)"]
    foundingNote: 센카담갈라(칸디)가 독립 왕국의 도읍이 된 1469년부터

- id: dutch-ceylon
  level: polity
  names: { ko: 네덜란드령 실론, en: Dutch Ceylon, native: Nederlands-Ceylon }
  from: 1658
  to: 1796
  color: "#e8c050"
  summary: 네덜란드 동인도 회사가 포르투갈을 몰아내고 다스린 실론 섬의 바닷가 땅으로, 계피 무역의 중심. 콜롬보·갈레·자프나·트링코말리를 거점으로 칸디 왕국을 내륙에 가둠
  mapNote: 지도에는 1757년부터 1795년까지 실론의 바닷가 지구(서·남·북·동해안 12지구)를 지금 지구 경계로 어림해 표시함
  endNote: 1795년 트링코말리, 1796년 2월 콜롬보를 영국군이 차지했고 1802년 아미앵 조약으로 영국 땅이 됨
  features:
    - 도읍은 콜롬보
    - 로마-네덜란드법과 토지 대장을 들임
    - 갈레 요새는 이때 지은 성벽이 남음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아미앵 조약(1802)"]
    foundingNote: 네덜란드가 자프나를 차지해 포르투갈을 섬에서 몰아낸 1658년부터

- id: deccan-states
  level: polity
  names: { ko: 데칸 토후국들, en: Deccan States, native: दख्खन संस्थाने }
  from: 1818
  to: 1946
  color: "#5a7fc0"
  summary: 마하라슈트라 남부의 콜하푸르·사완트와디 등 작은 토후국을 묶은 것으로, 모두 1만 km² 미만. 가장 큰 콜하푸르는 시바지의 후손인 본슬레 가문의 분가가 다스렸고, 1818년부터 1848년까지는 영국이 세운 사타라 왕국도 이 묶음에 듦
  mapNote: 지도에는 1818년부터 1946년까지 지금 콜하푸르 지구와 신두두르그 지구 남부(사완트와디)를, 1818년부터 1848년까지는 사타라 지구(사타라 왕국)를 더해 묶어 표시함(한 나라가 아님). 상글리·미라즈·잠칸디처럼 흩어진 작은 주는 1만 km² 미만이라 영국 색. 1817년까지 콜하푸르는 마라타 제국 색
  endNote: 1947년 인도에 가입했고 1949년 3월 봄베이주에 합쳐짐
  features:
    - 콜하푸르의 도읍은 콜하푸르
    - 사타라 왕국은 1848년 왕이 아들 없이 죽자 실권 원칙으로 거두어짐
    - 1933년 데칸 토후국 에이전시로 묶임
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Deccan States Agency", "위키백과 Satara State"]
    foundingNote: 1818년 페슈와가 항복한 뒤 영국이 사타라 왕을 세우고 남부 마라타 땅의 토후국들과 조약을 맺은 해부터 묶어 그림

# ── S2 남 끝 ──
