    - 1906년부터 남부 라지푸타나 토후국 에이전시가 감독함(그 전은 메와르 주재관)
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Rajputana Agency"]
    foundingNote: 이 지도의 시작 해(1757)부터 묶어 그림. 토후국들은 그보다 앞서 섰음

- id: palanpur-states
  level: polity
  names: { ko: 팔란푸르 토후국들, en: Palanpur Agency States, native: પાલનપુર }
  from: 1818
  to: 1946
  color: "#9b3fb5"
  summary: 구자라트 북부 바나스강 유역의 팔란푸르·라단푸르·타라드·와브 등 작은 토후국과 족장령을 묶은 것으로, 모두 1만 km² 미만. 팔란푸르는 로하니 가문, 라단푸르는 바비 가문의 무슬림 나와브가 다스렸고, 1817년 팔란푸르가 영국의 보호를 받은 뒤 팔란푸르 에이전시가 감독함
  mapNote: 지도에는 1818년부터 1946년까지 지금 바나스칸타 지구와 파탄 지구 서북쪽을 묶어 표시함(한 나라가 아님). 1817년까지는 구자라트 평원과 함께 바로다 주 색으로 그림
  endNote: 1947년 인도에 가입했고 1949년 봄베이주에 합쳐짐
  features:
    - 에이전시 본부는 팔란푸르
    - 작은 란(소금 늪) 동쪽 가장자리의 산탈푸르·사미도 이 묶음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Palanpur Agency"]
    foundingNote: 영국이 페슈와 몫의 구자라트 세입을 넘겨받은 1818년부터 묶어 그림(팔란푸르의 보호 조약은 1817년)

- id: mahi-kantha-states
  level: polity
  names: { ko: 마히칸타 토후국들, en: Mahi Kantha Agency States, native: મહીકાંઠા }
  from: 1818
  to: 1946
  color: "#4fa070"
  summary: 구자라트 동북 마히강 상류의 이다르를 비롯한 작은 토후국과 족장령을 묶은 것으로, 모두 1만 km² 미만. 가장 큰 이다르는 조드푸르 라토르 가문의 갈래가 다스렸고, 1820년 무렵 영국이 마히칸타 에이전시를 두어 가이크와드의 공물 걷기를 대신 맡음
  mapNote: 지도에는 1818년부터 1946년까지 지금 사바르칸타·아라발리 지구를 묶어 표시함(한 나라가 아님). 그 안의 영국령 프란티즈·모다사는 1만 km² 미만이라 함께 그림. 1817년까지는 바로다 주 색
  endNote: 1947년 인도에 가입했고 1949년 봄베이주에 합쳐짐
  features:
    - 이다르의 도읍은 이다르, 뒤에 히마트나가르
    - 에이전시 본부는 사드라
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Mahi Kantha"]
    foundingNote: 영국이 페슈와 몫의 구자라트 세입을 넘겨받은 1818년부터 묶어 그림(에이전시는 1820년 무렵)

- id: rewa-kantha-states
  level: polity
  names: { ko: 레와칸타 토후국들, en: Rewa Kantha Agency States, native: રેવાકાંઠા }
  from: 1818
  to: 1946
  color: "#5f6fb0"
  summary: 구자라트 동부 나르마다강(레와)과 마히강 사이의 라지플라·초타우다이푸르·바리아·루나와다·발라시노르 등 작은 토후국을 묶은 것으로, 모두 1만 km² 미만. 대부분 라지푸트 군주가 다스렸고(발라시노르는 바비 가문의 나와브), 1820년대부터 레와칸타 에이전시가 감독함
  mapNote: 지도에는 1818년부터 1946년까지 지금 나르마다·초타우다이푸르 지구와 데브가드 바리아 쪽, 북쪽의 마히사가르 지구를 묶어 표시함(한 나라가 아님). 영국령 판치마할(고드라·다호드)을 사이에 두고 두 덩어리로 떨어져 있음. 1817년까지는 바로다 주 색
  endNote: 1947년 인도에 가입했고 1949년 봄베이주에 합쳐짐
  features:
