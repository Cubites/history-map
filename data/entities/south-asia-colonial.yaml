  from: 1757
  to: 1946
  color: "#d9915a"
  summary: 구자라트 서쪽 카티아와르 반도의 작은 토후국 190여 개를 묶은 것으로, 주나가드·나와나가르·바브나가르·포르반다르·곤달 등이 컸으나 모두 1만 km² 미만. 1807년 워커 협정으로 영국이 바로다와 함께 공물을 정리했고, 1822년 카티아와르 에이전시가 섬
  mapNote: 지도에는 1757년부터 1946년까지 반도의 토후국들을 하나로 묶어 표시함(한 나라가 아님). 암렐리 등 바로다 땅과 영국령 단두카는 1만 km² 미만이라 나누지 않음
  endNote: 1948년 2월 15일 사우라슈트라 연합주로 합쳐짐(주나가드는 1947년 11월 인도 접수)
