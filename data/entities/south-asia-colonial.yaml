  mapNote: 지도에는 1757년부터 1946년까지 지금 히마찰프라데시 땅을 묶어 표시함(한 나라가 아님). 캉그라·쿨루 쪽은 1808년까지만, 수틀레지 남동쪽은 1803~1814년(구르카 점령)을 빼고 그림
  endNote: 1948년 4월 15일 히마찰프라데시 주로 합쳐짐
