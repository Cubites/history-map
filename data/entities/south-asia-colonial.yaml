  mapNote: 지도에는 1809년부터 1845년까지 수틀레지 남동쪽 수장령 전체를, 1846년부터 1946년까지 파티알라·나바·진드 몸통 띠만 묶어 표시함(한 나라가 아님). 흩어진 파티알라의 나르나울 등은 1만 km² 미만이라 나누지 않음
  endNote: 1948년 7월 15일 파티알라 동펀자브 연합주로 합쳐짐
  features:
