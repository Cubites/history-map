# 위키 ko 표제 없음(en Barotseland → Lozi kingdom도 ko 연결 없음) — 지시문 가칭 그대로. 위키 en Barotseland: 17세기 성립(→ from 1600, ※ 닫음), 1840 무렵~1864 콜롤로 지배(F6은 en Makololo의 1845를 씀 — 1845~1863 kololo-kingdom), 레와니카 1878~1884·1885~1916, 1890 로흐너·1898 롤리 양허, 19세기 말 약 390,000 km².
#   en North-Western Rhodesia: 1899-11-28 바로체랜드-북서 로디지아 추밀원령(bsac-northern-rhodesia — M-F5-9 ㉯). 1800~1844·1864~1898 ZM-01·ZM-06·ZM-07 341,936(F6 1800~1884·F5 1885~), 관계 없음
