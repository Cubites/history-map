# sub-saharan-africa partition 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/partition.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1885~1909: 베를린 회의 뒤 분할부터 남아프리카 연방 앞까지 (F5, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-partition' → 필터 단위 sub-saharan-africa).
# F5 뼈대(2026-11-13)가 1885~1909에 칠하는 새 토착 나라·식민지·보호령·회사령 항목 27개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f5/COMMON.md 4절 표, 표 원천 f5/skel/entities.tsv).
#   색은 본국 색이 아니라 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라와 ΔE 36 넘게 골랐다(f5/skel/tools/df5.mjs, COMMON P4). 본국은 data/relations.yaml의 vassal_of·occupied_by(칸 머리 아래).
#   모두 level: polity(토착 나라·보호령·회사령도 — F2~F4 꼴). to는 끝난 해 = 칠한 마지막 해 + 1(남아프리카 넷 1910 — 1910-05-31 남아프리카 연방). kanem-bornu는 1893~1899가 빈 기간(라바 국가).
#   이름은 위키백과 한국어판 표제로 확인했다(f5/skel/ko-titles*.txt·en-ko.txt — 저장소에 이미 쓰인 표기가 있으면 그것을 따름: 마흐디 국가·콩고 자유국·베닌 왕국·부간다 왕국,
#   표제를 쓴 것: 트란스발 공화국·오라녀 자유국, 사전 규칙을 따른 것: 소코토 칼리프국(칼리프), 표제가 없는 것은 지시문 가칭 — f5/SKEL-NOTE.md 끝 공용 표기표).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f5/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(※ — 고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   앞 잇는 항목 53은 이 파일에 없다 — F4 항목 14는 data/entities/sub-saharan-africa-colonial.yaml, F3 항목 16은 sub-saharan-africa-postwar.yaml, F2 항목 17은 sub-saharan-africa-decolonization.yaml,
#   F1 항목 6은 sub-saharan-africa-modern.yaml 그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절). 서아시아 muhammad-ali-egypt 쪽과 유럽 블록은 고치지 않는다.

