# 메리나 왕국 — 위키 ko 표제 '메리나 왕국'. from 1540(위키 en Merina Kingdom 정보 상자 'c. 1540–1897'), 1897-02 여왕 폐위 뒤 french-madagascar. 1885~1896 마다가스카르 22 − 남서 3 약 465,630(기본값 34), 관계 없음(1885 조약의 외교권·1896 보호는 글)
- id: merina-kingdom
  level: polity
  names: { ko: 메리나 왕국, en: Merina Kingdom, native: "Fanjakan'i Madagasikara" }
  from: 1540
  to: 1897
  color: "#84b0db"
  summary: 마다가스카르 중앙 고원에서 일어나 섬 대부분을 다스린 메리나족의 왕국. 16세기 무렵 이메리나 고원의 작은 나라로 시작했고, 18세기 말 안드리아남포이니메리나가 고원을 하나로 묶어 안타나나리보를 도읍으로 삼음. 19세기 라다마 1세 때부터 서양식 군대로 동부 해안과 북부를 차지해 서양 나라들이 마다가스카르 왕국으로 대함. 라다마 1세는 1817년 영국과 조약을 맺어 노예 수출을 끊기로 했고, 같은 해 동해안 토아마시나, 1824년 서해안 마하장가와 북쪽 끝 디에고수아레스에 군 주둔지를 둠. 뒤를 이은 라나발로나 1세(1828~1861년 재위)는 기독교를 금하고 유럽인을 멀리함. 1883년 프랑스와 전쟁이 났고, 1885년 12월 17일 조약으로 디에고수아레스를 내주고 외교를 프랑스에 맡김. 1894년 다시 전쟁이 나 이듬해 프랑스군이 마하장가에 내려 10월 1일 안타나나리보에 들어왔고, 1896년 왕국은 프랑스 보호 아래 놓인 뒤 병합됨
  endNote: 1897년 2월 프랑스가 여왕 라나발로나 3세를 폐위하고 왕정을 없애며 끝남
  mapNote: 지도에는 1800년부터 1896년까지 표시함. 1816년까지는 중앙 고원의 이메리나, 1817년부터 남쪽 고원 베칠레오와 동해안을 더한 땅, 1824년부터는 마다가스카르섬에서 남서부를 뺀 땅으로 그림. 정복과 주둔지 설치는 해안마다 몇 해씩 달라 1823년과 1825년에야 닿은 북동·남동 해안도 앞 해부터 같은 색으로 그렸고, 끝까지 복속하지 않은 서해안 암봉고 같은 사칼라바 땅도 같은 색으로 그림. 왕국에 들지 않은 남서부의 사칼라바족·안드로이 등 여러 정치체 땅은 비워 둠. 그 앞부터 프랑스 땅이던 노지베섬·생트마리섬과 1885년 내준 디에고수아레스 같은 작은 땅도 따로 칠하지 않고 메리나 왕국 색으로 그림
  features:
    - 수도는 안타나나리보
    - 18세기 말 안드리아남포이니메리나의 고원 통일
    - 1883~1885년, 1894~1895년 프랑스와 두 차례 전쟁
    - 1817년 영국과 조약, 1824년 마하장가 차지
    - 1897년 왕정 폐지, 여왕은 레위니옹을 거쳐 알제리로 유배
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 메리나 왕국", "위키백과 Merina Kingdom", "위키백과 Franco-Hova Wars", "위키백과 마다가스카르의 역사"]
