  summary: 기니 고원 푸타잘롱에 선 풀라인의 이슬람 이맘국. 1725년 풀라인 무슬림의 지하드로 세워져 팀보를 수도로 삼았고, 1845년 무렵부터 알파야·소리야 두 가문이 2년마다 알마미 자리를 번갈아 맡음. 1881년 프랑스와 맺은 조약을 두 쪽이 서로 달리 풀이했으나, 1889년 영국이 이 땅을 프랑스 세력권으로 인정함
