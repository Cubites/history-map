    - 1849년 리브르빌의 가봉 기슭 식민지에서 시작해 1880년 브라자의 조약으로 넓힘
    - 1891년 가봉 기슭 식민지를 정식으로 합침
    - 1894년 오트우방기, 1903년 우방기샤리로 떨어짐
    - 이권 회사의 고무 수탈
