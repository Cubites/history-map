- id: south-african-republic
  level: polity
  names: { ko: 트란스발 공화국, en: South African Republic, native: Zuid-Afrikaansche Republiek }
  from: 1852
  to: 1902
  color: "#a63f3f"
  summary: 발강 북쪽에 보어인이 세운 공화국으로, 흔히 트란스발이라 부름. 1830년대 말부터 케이프 식민지를 떠난 보어인 이주민이 포체프스트롬·오리흐스타트·사우트판스베르흐 등에 흩어져 정착했고, 1852년 1월 17일 영국이 샌드리버 협약으로 독립을 인정했으며 1860년 프리토리아를 수도로 삼음. 1877년 영국에 병합되었다가 1880~1881년 제1차 보어 전쟁으로 다시 섰으며 1884년 2월 27일 런던 협약으로 옛 나라 이름을 되찾음. 1886년 비트바테르스란트에서 금광이 발견되어 요하네스버그가 생기고 외국인 광부가 몰려들었으며, 폴 크뤼거 대통령 아래 1895~1896년 영국 쪽의 제임슨 습격을 물리침. 1899년 10월 오라녀 자유국과 함께 영국과 제2차 보어 전쟁을 벌였으나, 1900년 6월 5일 영국군이 수도 프리토리아에 들어왔고 그 뒤 보어인 부대가 유격전으로 버팀
  mapNote: 지도에는 1852~1876년과 1881년부터 1901년까지 지금 남아프리카 하우텡·음푸말랑가·림포포주와 노스웨스트주 동쪽 땅(약 276,000 km²)으로 표시하고, 1884년부터는 콰줄루나탈주 북쪽 끝 땅을 더해(약 290,000 km²) 그림. 1877~1880년 영국 병합 때는 영국령 트란스발로 따로 그리고, 1881~1883년 영국의 종주권은 영국과의 관계로 보임. 북쪽·동쪽 페디 왕국 등 아프리카 사람들의 땅도 따로 칠하지 않고 이 색으로 그림. 1884년 줄루 왕국 북서쪽에 선 뉴 리퍼블릭(약 14,000 km²)도 따로 칠하지 않고 이 색으로 둔 근사임. 1900~1901년 영국군 점령은 따로 칠하지 않고 트란스발 공화국 색으로 그림
  endNote: 1902년 5월 31일 베르니이헝 조약으로 보어인 부대가 항복해 영국의 트란스발 식민지가 되며 끝남
  features:
    - 수도는 프리토리아(1860년부터)
    - 1852년 1월 17일 샌드리버 협약으로 독립 인정
    - 1877~1880년 영국 병합, 1881년 프리토리아 협약으로 자치 회복
    - 1886년 비트바테르스란트 금광 발견, 요하네스버그가 생김
    - 1899~1902년 제2차 보어 전쟁
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 South African Republic", "위키백과 Second Boer War", "위키백과 Treaty of Vereeniging"]
