    - 1725년 풀라인 무슬림의 지하드로 세워짐
    - 알파야·소리야 두 가문이 2년마다 알마미를 번갈아 맡음
    - 1881년 프랑스와 조약, 1889년 영국이 프랑스 세력권으로 인정
    - 1896년 11월 프랑스 보호령이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Imamate of Futa Jallon", "위키백과 Rivières du Sud"]
