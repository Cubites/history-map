# ══ F5 GW-5 항목 (기니만 서쪽·사헬 가운데) ══
# 위키 ko 표제 '아샨티 제국'. 1701(위키 en Ashanti Empire), 1896 영국의 쿠마시 점령·보호령, 1900 황금 의자 전쟁, 1901-09-26 병합 칙령(1902-01-01 발효 — 기본값 14, 1901부터 골드코스트 색).
#   1885~1900 GH-AH·GH-BA 65,112(조각 통째 근사), 관계 없음
- id: asante
  level: polity
  names: { ko: 아샨티 제국, en: Asante Empire, native: Asanteman }
  from: 1701
  to: 1901
  color: "#c96d45"
  summary: 골드코스트 안쪽 숲 지대에서 쿠마시를 도읍으로 한 아칸족 제국. 1701년 무렵 오세이 투투가 여러 아칸 왕국을 묶어 세웠고, 금과 노예 무역으로 해안까지 힘을 뻗음. 19세기 내내 해안의 판테 사람들과 영국과 싸웠고, 1824년 영국 총독 매카시의 군대를 무찔렀으나 1826년 아크라 북쪽에서 영국과 해안 연합군에게 졌으며, 1874년 영국군이 쿠마시를 불태운 뒤 세력이 꺾임. 1896년 영국군이 쿠마시를 차지하고 왕을 유배해 보호령으로 삼았고, 1900년 황금 의자를 내놓으라는 요구에 맞서 마지막으로 일어섰으나 진압됨
  mapNote: 지도에는 1800년부터 1900년까지 지금 가나 아샨티주·브롱아하포주 땅으로 표시함. 조공을 바친 북쪽 나라들과 남쪽 판테 해안은 비워 둠. 1896년 영국이 보호령으로 삼은 뒤에도 병합 앞까지는 아샨티 제국 색으로 그림
  endNote: 1901년 9월 26일 영국이 병합해 골드코스트에 딸린 식민지가 되며 끝남(1902년 1월 1일 발효)
  features:
    - 도읍은 쿠마시
    - 1701년 무렵 오세이 투투가 세움
    - 1874년 영국군이 쿠마시를 불태움
    - 1896년 영국군의 쿠마시 점령, 왕 유배
    - 1900년 황금 의자 전쟁
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Ashanti Empire", "위키백과 War of the Golden Stool", "위키백과 Gold Coast (British colony)"]
    foundingNote: 오세이 투투가 아칸 왕국들을 묶어 제국을 세운 1701년 무렵부터

# 위키 ko 표제 '다호메이 왕국'. 1600 무렵(위키 en Kingdom of Dahomey 정보 상자 'c. 1600' — 기본값 20), 1890·1892~1894 프랑스와 전쟁, 1894 항복·프랑스 보호령(french-dahomey — 1894-06-22 식민지 칙령).
#   1885~1893 베냉 남부 7조각 17,297(위키 1만 — 기본값 10 근사), 관계 없음
- id: dahomey
  level: polity
  names: { ko: 다호메이 왕국, en: Kingdom of Dahomey, native: Danhɔmɛ }
  from: 1600
  to: 1894
  color: "#dbca84"
  summary: 기니만 기슭 안쪽에서 아보메를 도읍으로 한 폰족 왕국. 1600년 무렵 아보메 고원에서 일어나 18세기에 우이다를 비롯한 해안 항구를 차지했고, 노예 무역과 뒤의 야자유 무역으로 부를 쌓음. 오랫동안 오요 제국에 조공을 바쳤으나 1818년 왕위에 오른 게조가 1823년 무렵 조공을 끊음. 여성 군인 부대로 이름났고, 1890년과 1892~1894년 두 번 프랑스와 싸운 끝에 1894년 마지막 왕이 항복함
  mapNote: 지도에는 1800년부터 1893년까지 지금 베냉 남부(아틀랑티크·주·쿠포·모노·플라토·우에메·리토랄) 땅으로 표시함. 프랑스가 1882년부터 보호한 포르토노보 왕국 땅도 이 색으로 그림
  endNote: 1894년 마지막 왕이 항복해 프랑스 보호령이 되며 끝남. 1904년 프랑스령 다호메이에 완전히 합쳐짐
  features:
    - 도읍은 아보메
    - 18세기 우이다 등 해안 항구 차지
    - 노예 무역·야자유 무역
    - 여성 군인 부대
    - 1890년·1892~1894년 프랑스와 전쟁
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Dahomey", "위키백과 French Dahomey"]
    foundingNote: 아보메 고원에서 왕국이 일어난 1600년 무렵부터(지도에는 1800년부터)


# ══ F5 CE-N-5 항목 (나이지리아·카메룬·기니만 섬·보르누) ══
# 사전 기존 규칙 '칼리프'(표준국어대사전 — 칼리파는 막는 표기, 위키 ko 표제 '소코토 칼리파국'과 다름 — 기존 표기 우선, id는 M-F5-7). 1804(위키 en Sokoto Caliphate — 우스만 단 포디오의 지하드),
#   1903-03-13 소코토 함락·1903 부르미에서 칼리프 전사(northern-nigeria-protectorate — M-F5-2). 1885~1902 하우사 핵심 11(346.1k — 기본값 1, 북카메룬 띠 안 NG-AD 몫 13,635 포함 — 1903부터 독일령 카메룬), 관계 없음.
#   F6(2026-11-13): 1809~1884 핵심 + 아다마와 동쪽, 타라바 1817~·일로린 1823~·누페 1835~(1835~ 643.6k — 창구 ② Q2 (B′)·M-F6-6·창구 ③ Q-E2), F5 1885도 같은 땅 → 1886 누페·일로린·타라바 회사·1894 아다마와 동쪽 독일령
- id: sokoto-caliphate
  level: polity
  names: { ko: 소코토 칼리프국, en: Sokoto Caliphate, native: Daular Usmaniyya }
  from: 1804
  to: 1903
  color: "#5da0b1"
  summary: 하우사 땅의 여러 토후국을 거느린 풀라니족 이슬람 칼리프국. 1804년 이슬람 학자 우스만 단 포디오가 고비르 왕에게 맞서 지하드를 일으켜 세웠고, 1808년 고비르 도읍 알칼라와를 무너뜨린 뒤 1809년 아들 무함마드 벨로가 소코토를 세웠으며, 카노·자리아·카치나 같은 하우사 나라와 동쪽 아다마와, 남쪽 누페·일로린까지 에미르가 다스리는 토후국들이 소코토의 칼리프를 받드는 연합을 이룸. 19세기 말 영국·프랑스·독일이 경계를 나누어 가졌고, 1903년 2월 카노, 3월 소코토가 루가드의 북나이지리아군에게 떨어짐
  mapNote: 지도에는 1809년부터 1902년까지 지금 나이지리아 북서부와 북중부의 하우사 땅(소코토·케비·잠파라·카치나·카노·지가와·카두나·바우치·곰베·아다마와·플래토주)으로 표시함. 1885년까지는 지금 카메룬 아다마와·북부주의 아다마와 에미르국 동부를 더하고, 무리 에미르국이 선 타라바주는 1817년부터, 일로린 에미르국(크와라주)은 1823년부터, 누페 에미르국(니제르주)은 첫 에미르 우스만 자키가 선 1835년부터 더함. 누페 땅에는 1810년대부터 풀라니 학자 말람 덴도 일가가 들어가 1830년 무렵 실권을 쥐었음. 1886년부터 누페·일로린·타라바 쪽은 왕립 니제르 회사 색으로, 카메룬 쪽 아다마와 동부는 1894년부터 독일령 카메룬 색으로 그림. 자치가 컸던 아다마와 에미르국도 따로 칠하지 않고 소코토 칼리프국 색으로 그림.
  endNote: 1903년 영국군이 카노와 소코토를 차지하고, 동쪽으로 물러나던 칼리프 아타히루 1세가 부르미 전투에서 죽으며 끝남. 그 땅은 북나이지리아 보호령이 되었고 술탄 자리는 영국 아래에서 이어짐
  features:
    - 1809년 세운 소코토가 도읍
    - 1804년 우스만 단 포디오의 지하드로 일어남
    - 에미르들이 다스리는 토후국 연합
    - 카노는 사하라 횡단 무역과 염색 천으로 이름남
    - 1903년 부르미 전투로 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Sokoto Caliphate", "위키백과 Adamawa Emirate"]
    foundingNote: 우스만 단 포디오가 고비르 왕에게 맞서 지하드를 일으킨 1804년부터(지도에는 소코토를 세운 1809년부터)

