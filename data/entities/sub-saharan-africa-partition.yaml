  mapNote: 지도에는 1800~1844년, 1864년부터 1898년까지 지금 잠비아 서부 땅으로 표시함. 1845~1863년 같은 땅은 콜롤로 왕국 색으로, 1899년부터는 영국 남아프리카 회사령 북로디지아 색으로 그림
