  summary: 오고우에강과 콩고강 오른쪽 기슭의 프랑스 식민지. 1838·1841년 가봉강 하구 추장들과 맺은 보호 조약에 이어 1849년 해방 노예를 정착시킨 리브르빌을 중심으로 가봉 기슭 식민지가 섰고, 1880년 탐험가 피에르 사보르냥 드 브라자가 테케족 왕과 맺은 보호 조약으로 안쪽까지 넓혀 1882년 11월 30일 프랑스령 콩고로 세워졌으며, 「베를린 회의」(1884~1885)에서 인정받음. 1891년 가봉 기슭 식민지를 정식으로 합쳤고, 1894년 우방기강 북쪽 오트우방기를 더함. 땅 대부분을 이권 회사들에 나눠 주어 고무와 상아를 거두게 하면서 강제 노동이 심했음. 1903년 오트우방기와 오트샤리가 우방기샤리로 떨어져 나감
  mapNote: 지도에는 1849년부터 1905년까지 표시함. 1849~1881년에는 리브르빌 둘레 가봉 기슭 식민지를 지금 가봉의 에스튀에르주·오고웨마리팀주 땅으로, 1882년부터 지금 가봉·콩고 공화국 땅으로 그림. 1891년 정식으로 합치기 전의 가봉 기슭 식민지도 이 색으로, 1894~1902년에는 지금 중앙아프리카 공화국 땅(오트우방기)까지 이 색으로 그림. 안쪽 숲은 강가 거점만 다스린 명목 지배였음
  endNote: 1906년 가봉과 중앙콩고 두 식민지로 나뉘며 끝남. 1910년 두 식민지는 우방기샤리-차드와 함께 프랑스령 적도 아프리카로 묶임
  features:
