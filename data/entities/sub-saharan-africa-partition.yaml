# 위키 ko 표제 없음(en Gaza Empire도 ko 연결 없음) — 지시문 가칭 그대로. 위키 en Gaza Empire: 1824 소샹가네, 응궁구냐네 1884~1895, 1895 패배. en Gungunhana: 1895-12-28 차이미테에서 붙잡힘, 1906-12-23 아조레스에서 죽음. 1895 포르투갈 정복(portuguese-mozambique — 기본값 31). 1827~1894 MZ-G·MZ-I·MZ-B·MOZ-1927·MOZ-5854 236,365(F6 1827~1884 — 림포포강 하류로 옮긴 해, 기본값 31·F5 1885~), 관계 없음
