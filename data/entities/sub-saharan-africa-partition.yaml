  summary: 투겔라강과 퐁골라강 사이에 있던 줄루족의 왕국. 1816년 무렵 샤카가 줄루의 우두머리가 된 뒤 이웃 부족을 아울러 투겔라강 남쪽까지 큰 나라를 이룸. 1828년 샤카를 죽이고 왕이 된 딩가네는 1838년 12월 16일 블러드강 전투에서 보어인 이주민에게 져 투겔라강 남쪽 땅을 잃었고, 1840년 보어인과 손잡은 이복동생 음판데가 딩가네를 몰아내고 왕이 됨. 1872년 왕위를 이은 케치와요가 1879년 줄루 전쟁에서 영국군에 졌고, 나라는 영국이 세운 열세 족장령으로 쪼개짐. 1884년 왕위를 이은 디누줄루가 보어인의 도움을 받는 대가로 북서쪽 땅을 내주어 뉴 리퍼블릭이 섰고, 1887년 영국이 남은 땅을 합쳐 줄루란드로 다스림
  mapNote: 지도에는 1816년부터 1896년까지 지금 남아프리카의 콰줄루나탈주 땅으로 표시함. 1838년까지는 콰줄루나탈주 전부, 1839년부터는 투겔라강 북쪽 땅, 1884년부터는 북서쪽 뉴 리퍼블릭 땅을 뺀 북동부로 그리고, 1887년부터 1896년까지 영국에 종속된 땅으로 보임. 1879~1883년 열세 족장령 시기도 따로 나누지 않고 줄루 왕국 색으로 그림. 1859년 트란스발 공화국에 든 북서쪽 위트레흐트 둘레(약 3,600 km²)와 1895년에 줄루란드에 든 북동쪽 끝 통가 사람들의 땅(약 3,000 km²)도 이 색으로 둔 근사임
