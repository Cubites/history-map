# 투쿨로르 제국 — 위키 ko 표제 없음(지시문 가칭). 성립 1852(알하지 우마르의 지하드 — 1849 딩기라예 근거지 설도 foundingNote에 병기), 1893-04 반디아가라 함락으로 끝.
#   1885~1892 ML-1·ML-2·ML-4·ML-5·ML-BKO 361,074 조각 통째(기본값 2 — 사막 몫·카예 쪽 프랑스 요새 줄은 근사), 관계 없음(정복 — successor_of 없음)
- id: tukulor-empire
  level: polity
  names: { ko: 투쿨로르 제국, en: Toucouleur Empire, native: Empire toucouleur }
  from: 1852
  to: 1893
  color: "#b2345a"
  summary: 니제르강 상류와 세네갈강 상류 사이에 선 투쿨로르인의 이슬람 제국. 알하지 우마르 탈이 1852년 지하드를 일으켜 1855년 카르타의 니오로, 1861년 세구의 밤바라 왕국, 1862년 마시나를 정복했고, 1864년 그가 죽은 뒤 아들 아마두가 세구를 중심으로 다스림. 1880년대 세네갈강 상류에서 동쪽으로 밀고 들어온 프랑스군에 1890년 세구, 1891년 니오로를 내줌
  mapNote: 지도에는 1855년부터 1892년까지 표시함. 1855년 지금 말리의 카예 지방, 1861년 쿨리코로·세구 지방과 바마코, 1862년 모프티 지방 땅이 차례로 더해짐. 제국이 실제로 다스린 땅은 북쪽 사막 쪽으로 이보다 좁았고, 카예 둘레에 줄지어 선 프랑스 요새들은 따로 칠하지 않고 이 색으로 그림
  endNote: 1893년 4월 프랑스군이 반디아가라를 차지하고 아마두가 동쪽 소코토 쪽으로 달아나며 끝남
  features:
    - 중심은 세구, 1890년 뒤로는 니오로와 반디아가라
    - 1852년 알하지 우마르 탈의 지하드
    - 1855년 니오로, 1861년 세구, 1862년 마시나 정복
    - 1864년 우마르가 죽은 뒤 아들 아마두가 다스림
    - 1890~1893년 프랑스군에 세구·니오로·반디아가라를 차례로 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Toucouleur Empire", "위키백과 Umar Tall"]
    foundingNote: 알하지 우마르 탈이 지하드를 일으킨 1852년부터(그가 딩기라예에 근거지를 세운 1849년으로 보기도 함)

# 푸타잘롱 이맘국 — 위키 ko 표제 없음(고원 표제 '푸타 잘롱'·저장소 '푸타잘롱 고원' 표기, 가칭 '푸타잘론'은 막음 — 기본값 15). 성립 1725(위키 en Imamate of Futa Jallon — 조사 '1727쯤'을 닫음),
