# E4 창구 ② Q4 — 땅 없는 항목(독립 군주들의 도시 모임, 하나의 나라 아님). from 천문 −199(기원전 200년 무렵)·to 1050 무렵(위키백과 영어판 Pyu city-states '기원전 2세기 무렵~11세기 중엽'). 1044부터 그 땅은 pagan-empire
- id: pyu-city-states
  level: region
  names: { ko: 쀼 도시국가, en: Pyu city-states, native: ပျူ }
  from: -199
  to: 1050
  color: "#a64d3f"
  summary: 이라와디강 유역에 쀼 사람이 세운 성곽 도시들. 기원전 2세기 무렵부터 베익타노·할린·스리크세트라 같은 벽돌 성곽 도시가 섰고, 인도와 중국을 잇는 길목에서 불교를 받아들였음. 도시마다 따로 왕이 있어 하나의 나라로 묶인 적은 없으며, 832년 남조의 군대가 할린을 약탈한 뒤 기울어 11세기 중엽 바간 왕국에 흡수됨
  mapNote: 지도에는 땅을 그리지 않음. 도시마다 따로 선 왕들의 모임이라 한 나라의 영역으로 칠할 수 없어, 그 땅(지금 사가잉·마궤·만달레이 지방과 바고 지방 북부)은 1044년(바고 지방은 1057년)부터 바간 왕국 색으로 그림
  endNote: 11세기 중엽 쀼 사람들이 바간 왕국의 버마 사람들 속에 섞여 들며 도시국가 시대가 끝남
  features:
    - 대표 도시는 스리크세트라·베익타노·할린
    - 벽돌 성곽과 원통 모양 불탑을 남김
    - 832년 남조의 군대가 할린을 약탈
    - 2014년 '쀼 고대 도시'로 유네스코 세계유산에 오름
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 영어판 Pyu city-states", "『신당서』 표국전"]
    foundingNote: 베익타노 같은 성곽 도시가 나타나는 기원전 2세기 무렵부터

# E4 기본값 DA7(첫 해는 합치기가 메인 메모 1로 788 → 370) — 370~1429 라카인 MM-16(1293~1429는 E3 early-modern.mjs BM 칸 비움 줄을 지우고 같은 id로 이음 — F4), 1430 므라우우 왕국(successor_of). 이름은 위키 ko 표제 없음 — 저장소 '아라칸' 꼴.
#   첫 해 370은 위키백과 영어판 Waithali(웨탈리 370~818, 찬드라 왕조 첫 왕 370 — 전승 연대). 레므로 시대 818~1406은 History of Rakhine
- id: arakan-kingdom
  level: polity
  names: { ko: 아라칸 왕국, en: Arakan kingdoms, native: ရခိုင် }
  from: 370
  to: 1430
  color: "#cc94b9"
  summary: 벵골만 동쪽 라카인 해안에서 도읍을 옮겨 가며 이어진 아라칸 사람의 왕국. 전설의 다냐와디 왕국 뒤 웨탈리에서 찬드라 왕조가 인도 문화의 왕국을 이루었고, 10세기 무렵부터 레므로강 골짜기의 네 도시(삥사·첫째 파레인·둘째 파레인·렝옛)로 도읍을 옮겼음. 11~13세기에는 바간 왕국에 조공했고, 1406년 아바 왕국의 침입으로 왕 민소몬이 벵골로 피한 뒤 아바와 항따와디가 이 땅을 번갈아 다투었음
  endNote: 1429년 민소몬이 벵골 술탄국의 도움으로 왕위를 되찾고 1430년 므라우우에 새 도읍을 세워 므라우우 왕국으로 이어짐
  mapNote: 지도에는 370년부터 1429년까지 지금 라카인주 땅으로 표시함. 웨탈리에 찬드라 왕조가 섰다고 전하는 370년부터 칠했고, 그 앞 전설의 다냐와디 시대는 칠하지 않음. 바간 왕국에 조공한 동안과 1406~1429년 왕이 벵골로 피한 동안에도 같은 색으로 그림
  features:
    - 도읍은 웨탈리, 10세기 무렵부터 레므로강 골짜기(삥사·파레인·렝옛)
    - 웨탈리의 찬드라 왕조가 남긴 동전과 아난다찬드라 비문
    - 11~13세기 바간 왕국에 조공
    - 1406~1429년 왕이 벵골로 피함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아난다찬드라 비문", "『아라칸 연대기』"]
    foundingNote: 웨탈리에 찬드라 왕조가 섰다고 전하는 370년부터(아라칸 연대기의 연대 — 비문의 연대 환산은 학자마다 다름)

# R-B B2 — 358~668 서자와 ID-BT·JK·JB(순다 669와 같은 조각), 669 순다 왕국(successor_of). 358~669 위키백과 영어판 Tarumanagara
