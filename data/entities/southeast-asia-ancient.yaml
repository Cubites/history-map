# E4 창구 ② Q5 — 550~626 북·중부 캄보디아 15조각 + 스퉁트렝·참파삭, 627~705 부남 땅 더함, 706 무렵 육진랍·수진랍으로 나뉨. 관계: 550~626 부남의 속국(『수서』)
- id: chenla
  level: polity
  names: { ko: 첸라, hanja: 眞臘, en: Chenla, native: ចេនឡា }
  from: 550
  to: 706
  color: "#79beb0"
  summary: 부남에 딸렸다가 일어나 부남을 아우른 크메르인의 나라. 6세기 중엽 바바바르만 1세가 메콩강 가운데 유역에서 일어섰고, 이샤나바르만 1세가 이샤나푸라(지금 삼보르 프레이 쿡)를 도읍으로 삼아 627년 무렵 부남 땅을 아울렀음. 중국 사서는 진랍(眞臘)이라 불렀고, 8세기 초 북쪽 육진랍과 남쪽 수진랍으로 나뉨
  endNote: 706년 무렵 북쪽 내륙의 육진랍과 남쪽 물가의 수진랍으로 나뉨(『신당서』 진랍전)
  mapNote: 지도에는 550년부터 705년까지 표시함. 550~626년에는 지금 캄보디아 북·중부(라타나키리 빼고)와 지금 라오스 남부의 참파삭(왓푸) 땅으로, 627년부터는 부남 땅이던 지금 베트남 남부의 메콩 삼각주와 지금 캄보디아 남부까지 더해 그림. 550~626년에는 부남에 딸린 나라였으므로 종속 관계로도 나타냄. 첸라가 한 왕권 아래 하나로 묶인 나라였는지 의심하는 학설도 있어 여러 왕가의 땅을 한 색으로 묶은 어림이고, 꺼꽁·몬돌끼리 같은 변두리도 같은 색으로 칠함
  features:
    - 도읍은 이샤나푸라(지금 캄보디아 껌퐁톰의 삼보르 프레이 쿡)
    - 『수서』 진랍전은 본디 부남의 속국이었다고 적음
    - 왓푸(지금 라오스 참파삭)의 산을 왕실의 성지로 받듦
    - 627년 무렵 부남을 아우르고, 706년 무렵 둘로 나뉨
  startEvents: []
  endEvents: []
