  mapNote: 지도에는 358년부터 668년까지 지금 반튼·자카르타·서자와 땅으로 표시함. 비문은 치타룸강과 보고르 둘레에 몰려 있어 동쪽 끝과 남쪽 산지는 명목임
  features:
