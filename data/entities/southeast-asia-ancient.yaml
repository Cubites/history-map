  to: 1293
  color: "#9b4b6b"
  summary: 스리비자야(스리위자야)는 수마트라 남부 팔렘방을 중심으로 말라카 해협의 바다 교역을 쥔 해상 왕국. 682년 다푸나 향 스리 자야나사가 군대를 이끌고 나라를 세운 일을 크둑 부킷 비문에 남겼고, 7세기 말까지 방카·람풍과 잠비의 말라유, 말레이 반도의 크다를 거느렸음. 당나라 승려 의정이 머문 대승 불교의 중심지였고, 1025년 인도 촐라 왕조의 습격으로 크게 약해진 뒤 중심이 잠비 쪽으로 옮겨 갔으며, 13세기 말 자와 싱하사리 왕국의 말라유 원정으로 바다 패권을 잃었음
  endNote: 1288년 무렵 싱하사리의 원정 뒤 팔렘방과 잠비의 중심이 사라졌다고 보며, 끝을 1025년 촐라의 습격으로 보는 학설과 1377년 마자파힛의 팔렘방 정복으로 보는 학설이 갈림
  mapNote: 지도에는 682년부터 1292년까지 표시함. 비문이 나온 땅만 칠해 682년 팔렘방(지금 남수마트라주)과 방카섬, 685년 크다(지금 크다·프를리스주와 페낭), 692년 잠비와 람풍을 더하고, 크다는 1136년부터 크다 술탄국 색으로 그림. 강가 거점에서 먼 내륙은 명목이며, 조공을 바친 말레이 반도·자와 서부의 소국은 칠하지 않음
  features:
    - 도읍은 팔렘방, 11세기부터 잠비 쪽
    - 682년 크둑 부킷 비문
    - 의정이 머문 대승 불교의 중심지
    - 1025년 촐라 왕조의 습격
