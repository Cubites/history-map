  mapNote: 지도에는 750년부터 1291년까지 지금 타이 북부 치앙마이·람푼 땅으로 표시함. 나라가 선 해는 629·661년 전승과 10세기 뒤라는 학설이 갈려 750년 무렵을 골랐고, 치앙마이의 넓은 서쪽 산지까지 같은 색으로 칠한 어림. 1292년부터 이 땅은 란나 왕국 색으로 이어짐
  features:
    - 도읍은 하리푼차이(지금 람푼)
    - 라보에서 온 짜마테위 여왕이 세웠다는 전승이 있음
    - 왓 프라탓 하리푼차이 같은 몬 불교 사원을 남김
    - 1292년 멩라이에게 정복됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Hariphunchai", "위키백과 Lan Na"]
    foundingNote: 나라가 섰다는 여러 해(629·661년 전승, 750년 무렵 학설) 가운데 750년 무렵을 시작으로 봄. 1292년 멩라이의 정복을 끝으로 봄


