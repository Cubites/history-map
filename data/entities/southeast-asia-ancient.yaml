# southeast-asia ancient 나라 (시대 파일 scripts/geo/areas/southeast-asia/ancient.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1292 이전: 남월·교지 독립기(응오·딘·전 레·리·쩐)·임읍·참파·부남·첸라·크메르·바간·라보·수코타이·란나·스리비자야·마타람·케디리·싱하사리 (E4, docs/southeast-asia/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'southeast-asia-ancient' → 필터 단위 southeast-asia).
# E4 뼈대(2026-11-09)가 새 항목 21개의 id·이름·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 e4/COMMON.md 4절 표). 색은 뼈대가 이웃과 ΔE 55 넘게 골랐다(e4/skel/tools/de4.mjs).
#   이름은 위키백과 한국어판 표제로 확인했다(e4/skel/ko-titles*.txt — 표제가 없는 하리푼차이 왕국·아라칸 왕국·타루마나가라 왕국은 저장소·위키 본문 꼴, 스리비자야는 표기 사전 꼴).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — e4/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 se-01·se-02 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(고치면 결과 노트 2절에 한 줄). id·색은 고치지 않는다.
#   E1~E3 항목(pagan-empire·khmer-empire·tran-dynasty·champa·lan-na·kedah-perlis 등)을 1292 앞으로 이어 칠하는 칸은 그 블록(southeast-asia-early-modern.yaml·southeast-asia-colonial.yaml·southeast-asia-modern.yaml)을 고친다 — 이 파일에는 새 항목만.

# ══ E4 VC 항목 (베트남 북·중부·참파) ══
# 0단계 기본값 23 — 땅 없는 항목(region, 천문 −1999~−1 = 기원전 2000~2년). 사건 글의 subjects용(한국 prehistory·남아시아 indus-civilization 선례). 연도 막대 하한 −2332
- id: southeast-asia-bronze-age
  level: region
  names: { ko: 청동기 시대 동남아, en: Bronze Age Southeast Asia }
  from: -1999
  to: -1
  color: "#5745c9"
  summary: 홍강 유역과 타이 동북부를 중심으로 청동을 다루며 벼농사 마을을 이룬 동남아의 문화권. 풍응우옌 문화에서 동선 문화로 이어진 북베트남, 반 치앙 유적의 타이 동북부, 바닷가의 사후인 문화가 대표적이다
  mapNote: 지도에는 땅을 그리지 않음. 여러 문화가 유적과 출토물로만 알려져 있고 나라 경계를 그을 근거가 없어, 사건의 주체로만 둠
  endNote: 기원전 3세기 무렵 철기가 퍼지고 남월 같은 나라와 인도·중국과의 교역 항구가 나타나면서 철기 시대로 넘어감
  features:
    - 북베트남에서 풍응우옌 문화가 동선 문화로 이어지며 청동 북을 만듦
    - 동선 문화의 청동 북은 남중국에서 인도네시아까지 퍼짐
    - 타이 동북부 반 치앙 유적에서 청동기와 무늬 토기가 나옴
    - 베트남 중·남부 바닷가의 사후인 문화는 독무덤과 옥 귀걸이를 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Đông Sơn culture", "위키백과 Phùng Nguyên culture", "위키백과 Ban Chiang", "위키백과 Sa Huỳnh culture"]
    foundingNote: 북베트남과 타이 동북부에서 청동기가 나타나는 기원전 2000년 무렵부터로 봄(연대는 유적마다 갈림)

# E4 창구 ② Q1 — 천문 −203~−111(기원전 204~112년), 버전 둘(−203 광둥·광시, −178 베트남 쪽 더함 — 창구 ③ R-Q1 기원전 179년 어우락 병합): 베트남 쪽은 중국 쪽 서한 −110 선 안(VC_JIAO_HAN), 광둥·광시는 권역 밖 땅(VC_OUTSIDE — VC_NANYUE_CN), 하이난 비움. to −110(기원전 111년 한의 정복)
- id: nanyue
  level: polity
  names: { ko: 남월, hanja: 南越, en: Nanyue, native: 南越 }
  from: -203
  to: -110
  color: "#79be79"
  summary: 진의 장수 조타(찌에우다)가 판위(번우)를 도읍으로 세운 왕국. 지금의 광둥·광시와 베트남 북부를 다스리며 한과 맞서기도 하고 신하를 칭하기도 했다
  endNote: 기원전 112년 재상 여가가 한에 기울던 왕과 태후를 죽이자 한 무제가 군대를 보내, 기원전 111년 판위가 함락되어 끝남. 그 땅에는 교지·구진·일남 등 아홉 군이 놓임
  mapNote: 지도에는 기원전 204년부터 기원전 112년까지. 지금의 광둥·광시와 베트남 북부(홍강 유역과 타인호아 바닷가 — 뒤에 한이 교지·구진 두 군을 둔 땅)를 그리고, 그 남쪽 응에안·하띤은 그리지 않음. 하이난섬은 남월이 다스린 근거가 약해 비움. 한의 책봉을 받았으나 나라는 따로 그림. 홍강 유역은 어우락을 아우른 기원전 179년부터 그림(그 앞 어우락은 전설과 섞인 나라라 땅을 그리지 않음). 경계는 어림
  features:
    - 기원전 204년 조타가 진이 무너진 틈에 남해·계림·상군을 묶어 즉위함
    - 기원전 196년 한 고조의 책봉을 받았으나 여후 때는 스스로 황제를 칭함
    - 기원전 179년 홍강 유역의 어우락을 아울러 교지·구진 두 군을 두었다고 전함
    - 판위의 왕궁 터와 둘째 왕 조말의 무덤이 지금 광저우에 남아 있음
    - 기원전 111년 한 무제의 원정으로 무너짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Nanyue", "위키백과 Zhao Tuo", "위키백과 Han conquest of Nanyue", "『사기』 남월열전"]
    foundingNote: 기원전 204년 조타가 남월 무왕을 칭한 해를 시작으로 봄(기원전 203년 설도 있음)

# E4 창구 ② Q2 — 땅 없는 항목(같은 해 중국 쪽 양·진·수 도형이 홍강 유역을 칠함 — 결정 9 그대로). 544 리비 즉위·548~571 찌에우꽝푹·571~602 후 리, 602 수에 항복
- id: early-ly-dynasty
  level: polity
  names: { ko: 전 리 왕조, hanja: 前李朝, en: Early Lý dynasty, native: Nhà Tiền Lý }
  from: 544
  to: 602
  color: "#cb65d2"
  summary: 리남데(리비)가 양의 교주 지배에 맞서 일어나 세운 나라. 나라 이름을 만춘(萬春)이라 하고 황제를 칭했다
  endNote: 602년 수의 군대가 쳐들어오자 후 리 남데가 항복해 끝나고, 홍강 유역은 다시 수의 교주가 됨
  mapNote: 지도에는 땅을 그리지 않음. 같은 때 중국 쪽 양·진·수의 교주로 그린 땅과 겹치고, 545년 이후 리남데가 쫓겨나 찌에우꽝푹·후 리 남데가 늪지와 일부 고을에서 버틴 시기가 길어 경계를 그리지 않고 사건의 주체로만 둠
  features:
    - 544년 리남데가 황제를 칭하고 나라 이름을 만춘이라 함
    - 545년 양의 반격에 밀려 산지로 물러났고 548년 죽음
    - 찌에우꽝푹이 늪지에서 버티다 550년 교주의 중심지를 되찾음
    - 571년 리펏뜨(후 리 남데)가 찌에우꽝푹을 꺾고 왕위를 이음
    - 602년 수에 항복해 끝남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Early Lý dynasty", "위키백과 Lý Nam Đế", "위키백과 Triệu Quang Phục", "『대월사기전서』"]
    foundingNote: 544년 리남데가 황제를 칭하고 만춘을 세운 해를 시작으로 봄

# E4 창구 ② Q3 — 907~937 한 버전(중국 쪽 당이 비운 땅 = 중국 쪽 선 안, 930~931 남한 점령은 칠하지 않음, 즈엉딘응에·끼에우꽁띠엔 시기도 이 항목). from 906(당이 절도사로 인정)·to 938(박당강 전투)
- id: khuc-clan
  level: polity
  names: { ko: 쿡씨, hanja: 曲氏, en: Khúc family, native: Họ Khúc }
  from: 906
  to: 938
  color: "#b234a9"
  summary: 당이 무너질 무렵 정해군 절도사 자리를 차지해 홍강 유역을 스스로 다스린 집안과 그 뒤를 이은 토착 세력. 쿡트어주·쿡하오·쿡트어미가 3대를 이었다
  endNote: 937년 끼에우꽁띠엔이 즈엉딘응에를 죽이고 남한에 도움을 청하자, 938년 응오꾸옌이 끼에우꽁띠엔을 치고 박당강에서 남한군을 물리쳐 끝남
  mapNote: 지도에는 907년부터 937년까지. 쿡씨는 당·후량·남한의 절도사를 자처했을 뿐 독립을 선언하지 않았으나, 중국 왕조가 이 땅을 실제로 다스리지 못해 따로 그림. 930~931년 남한의 점령은 한 해 만에 되돌려져 그리지 않고, 931년 이후 즈엉딘응에·끼에우꽁띠엔 시기도 같은 색으로 그림. 서북 산지는 직접 다스린 근거가 약해 비움. 경계는 어림
  features:
    - 905년 쿡트어주가 정해군 절도사를 자처하고 이듬해 당의 인정을 받음
    - 쿡하오가 고을을 새로 나누고 세금과 부역을 고쳐 다스림을 다짐
    - 930년 남한이 쳐들어와 쿡트어미를 붙잡아 감
    - 931년 즈엉딘응에가 남한군을 몰아내고 절도사가 됨
    - 937년 끼에우꽁띠엔이 즈엉딘응에를 죽이고 자리를 빼앗음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khúc family", "위키백과 Khúc Thừa Dụ", "위키백과 Dương Đình Nghệ", "『대월사기전서』"]
    foundingNote: 906년 당이 쿡트어주를 정해군 절도사로 인정한 해를 시작으로 봄(905년 자립설도 있음). 지도는 당이 무너진 907년부터

# E4 기본값 DA13 — 938(그해 말 박당강 승리, 939 즉위는 foundingNote)~967 한 버전(중국 쪽 선 안), 965~967 십이사군은 같은 땅 같은 색
- id: ngo-dynasty
  level: polity
  names: { ko: 응오 왕조, hanja: 吳朝, en: Ngô dynasty, native: Nhà Ngô }
  from: 938
  to: 968
  color: "#d27365"
  summary: 박당강 전투에서 남한을 물리친 응오꾸옌이 꼬로아를 도읍으로 세운 베트남 왕조. 천 년 가까운 중국 지배를 끝낸 첫 독립 왕조로 꼽힌다
  endNote: 944년 응오꾸옌이 죽은 뒤 외척이 왕위를 빼앗는 등 흔들렸고, 965년 응오꾸옌의 아들이 싸움터에서 죽자 열두 군벌이 나뉘어 다투다 968년 딘보린이 통일해 끝남
  mapNote: 지도에는 938년부터 967년까지. 965~967년 십이사군이 다투던 시기도 같은 땅을 같은 색으로 그림. 서북 산지는 직접 다스린 근거가 약해 비움. 경계는 어림
  features:
    - 938년 박당강 바닥에 말뚝을 박아 남한 수군을 무찌름
    - 939년 응오꾸옌이 왕을 칭하고 꼬로아에 도읍함
    - 944년 응오꾸옌이 죽자 외척 즈엉 씨가 왕위를 빼앗음
    - 950년 응오꾸옌의 두 아들이 왕위를 되찾아 함께 다스림
    - 965년 뒤 열두 군벌이 갈라선 십이사군 시기로 넘어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Ngô dynasty", "위키백과 Ngô Quyền", "위키백과 Battle of Bạch Đằng (938)", "『대월사기전서』"]
    foundingNote: 938년 말 박당강 전투의 승리로 남한의 지배를 끊은 해를 시작으로 봄(왕을 칭한 것은 939년)

# R-A 1-1 — 968~979 한 버전(중국 쪽 선 안 — 응오와 같은 땅)
- id: dinh-dynasty
  level: polity
  names: { ko: 딘 왕조, hanja: 丁朝, en: Đinh dynasty, native: Nhà Đinh }
  from: 968
  to: 980
  color: "#9934b2"
  summary: 딘보린이 십이사군을 아우르고 황제를 칭해 세운 베트남 왕조. 나라 이름을 다이꼬비엣(大瞿越), 도읍을 호아루로 정했다
  endNote: 979년 딘보린과 맏아들이 살해되고 여섯 살 난 아들이 즉위했으나, 980년 송이 쳐들어오려 하자 장군 레호안이 왕위를 넘겨받아 끝남
  mapNote: 지도에는 968년부터 979년까지. 응오 왕조와 같은 땅으로 그리고, 서북 산지는 비움. 송의 책봉을 받았으나 나라는 따로 그림. 경계는 어림
  features:
    - 968년 딘보린이 열두 군벌을 꺾고 황제를 칭함
    - 나라 이름을 다이꼬비엣, 도읍을 산으로 둘러싸인 호아루로 정함
    - 973년 송의 책봉을 받아 교지군왕이 됨
    - 979년 딘보린이 궁에서 살해됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Đinh dynasty", "위키백과 Đinh Bộ Lĩnh", "『대월사기전서』"]
    foundingNote: 968년 딘보린이 황제를 칭하고 다이꼬비엣을 세운 해를 시작으로 봄

# R-A 1-1 — 980~1008 한 버전(중국 쪽 선 안 — 응오와 같은 땅)
- id: early-le-dynasty
  level: polity
  names: { ko: 전 레 왕조, hanja: 前黎朝, en: Early Lê dynasty, native: Nhà Tiền Lê }
  from: 980
  to: 1009
  color: "#34b288"
  summary: 딘 왕조의 장군 레호안이 왕위를 넘겨받아 세운 베트남 왕조. 981년 송의 침입을 물리치고 이듬해 참파를 쳤다
  endNote: 1005년 레호안이 죽은 뒤 아들들이 왕위를 다투었고, 1009년 마지막 왕이 죽자 신하들이 리꽁우언(리 태조)을 세워 끝남
  mapNote: 지도에는 980년부터 1008년까지. 응오·딘 왕조와 같은 땅으로 그리고, 서북 산지는 비움. 982년 참파 원정은 도읍을 약탈하고 돌아와 그리지 않음. 경계는 어림
  features:
