    - 5세기 푸르나와르만 왕의 비문 일곱 개
    - 투구 비문에 운하를 판 일을 적음
    - 669년 순다 왕국으로 이어졌다고 전함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["투구 비문", "치아루테운 비문", "위키백과 영어판 Tarumanagara"]
