  mapNote: 지도에는 1789년부터 지금 이란 땅 안에서 다스린 곳을 표시함(1789년 북부·중부, 1791년 아제르바이잔, 1792년 파르스, 1794년 케르만과 서부, 1796년 호라산부터 1924년까지 지금 이란 땅 전체). 캅카스는 유럽 권역 땅이라 칠하지 않음. 1920~1921년 길란 소비에트 공화국은 그리지 않음
  endNote: 1925년 10월 31일 의회가 아흐마드 샤를 폐위하고 12월 레자 칸을 샤로 세움
  features:
    - 도읍은 테헤란
    - 1907년 영국·러시아 협상으로 북쪽은 러시아, 남동쪽은 영국의 세력권이 됨
    - 1908년 마스지드 술레이만에서 석유가 터져 나옴
