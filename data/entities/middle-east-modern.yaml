    foundingNote: 나라 이름을 이집트 아랍 공화국으로 바꾼 1971년 9월 2일부터

- id: sinai-israeli-occupation
  level: region
  names: { ko: 시나이반도 (이스라엘 점령), en: Sinai (Israeli occupation), native: سيناء }
