    - 트리폴리와 벵가지에 영국군 기지가 남음
    - 1949년 유엔 총회 결의 289호가 1952년 1월 1일 전 독립을 정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이탈리아 평화 조약(1947)", "유엔 총회 결의 289호(1949)"]
