# ── 서아시아·북아프리카 A1b(2026-10-29): 이집트·리비아·튀니지·알제리·모로코·서사하라 1918~현재 ──
# 보호국·식민지는 본국과 따로 나라 항목(vassal_of 본국), 이탈리아령 리비아의 1943~1951 군정과 1967~1982 시나이는 점령 지역 항목(occupied_by), 서사하라는 귀속 논쟁 지역 항목(claimed_by).
# 사하라 아랍 민주 공화국과 모리타니(지도 범위 밖 나라)는 영토 없는 나라 항목(이름·관계용, 유럽 코소보 꼴). 지도는 모두 1918년부터.

