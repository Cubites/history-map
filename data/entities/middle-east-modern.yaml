    refs: ["이라크 공화국 임시 헌법(1958)", "이라크 헌법(2005)"]
    foundingNote: 군사 혁명으로 왕정이 무너진 1958년 7월 14일부터

- id: kuwait
  level: polity
  names: { ko: 쿠웨이트, en: Kuwait, native: الكويت }
  from: 1899
  to: null
  color: "#c46a8a"
  summary: 페르시아만 북쪽 끝의 사바 가문 토후국. 1899년 1월 23일 무바라크가 영국과 비밀 협정을 맺어 외교를 영국에 맡기고 보호를 받았고, 1922년 우카이르 의정서로 사우디와의 경계와 중립 지대를 정함. 1938년 석유가 발견되었고 1961년 6월 19일 보호 관계를 끝내고 독립함
  mapNote: 지도에는 1899년부터 지금 쿠웨이트 땅으로 표시하고(1871~1898년은 오스만 제국의 바스라 주), 사우디아라비아와의 중립 지대(약 5,770 km²)는 나누지 않음. 이라크의 점령(1990~1991)은 그리지 않음
  features:
    - 도읍은 쿠웨이트 시
    - 1920년 자흐라 전투에서 네지드의 이흐완 군을 막아 냄
    - 1990년 8월 이라크에 점령되었다가 1991년 2월 걸프 전쟁으로 되찾음
    - 1962년 헌법으로 국민 의회를 둠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["영국-쿠웨이트 협정(1899)", "우카이르 의정서(1922)", "쿠웨이트 헌법(1962)"]
    foundingNote: 무바라크가 영국과 보호 협정을 맺은 1899년 1월 23일부터

# ── 아라비아 반도: 히자즈·네지드·사우디아라비아·샴마르·아시르 ──
- id: hejaz-kingdom
  level: polity
  names: { ko: 히자즈 왕국, en: Kingdom of Hejaz, native: المملكة الحجازية }
  from: 1916
  to: 1925
  color: "#5fa37a"
  summary: 메카의 샤리프 후세인이 홍해 연안 히자즈에 세운 하심 가문의 왕국. 1916년 6월 오스만 제국에 맞선 아랍 반란을 일으키고 왕을 칭했으며, 1차 대전 뒤 위임 통치 체제를 받아들이지 않아 영국과 멀어짐. 1924년 칼리프를 칭한 뒤 네지드의 공격을 받음
  mapNote: 지도에는 1916년부터 메카 주, 1917년 홍해 해안 띠(얀부·웨지)와 아카바를 더해 표시하고, 1918년부터 1924년까지 메카·메디나·타부크와 하클 둘레, 마안·아카바를 넣어 표시함
  endNote: 1924년 10월 후세인이 아들 알리에게 왕위를 넘기고 메카·타이프를 잃었으며, 1925년 12월 메디나와 제다가 항복해 네지드에 병합됨
  features:
    - 도읍은 메카, 1924년 10월부터는 제다
    - 아랍 반란에서 아들 파이살과 압둘라가 군을 이끎
    - 메디나의 오스만 수비대는 1919년 1월에야 항복함
    - 메카 순례 관리와 히자즈 철도가 나라의 큰 일이었음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["후세인-맥마흔 서한(1915~1916)", "베르사유 조약(1919)"]
    foundingNote: 샤리프 후세인이 아랍 반란을 일으킨 1916년 6월 10일부터

- id: nejd
  level: polity
  names: { ko: 네지드, en: Emirate and Sultanate of Nejd, native: سلطنة نجد }
  from: 1902
  to: 1925
  color: "#ecd08a"
  summary: 사우드 가문의 압둘아지즈(이븐 사우드)가 아라비아 중부 네지드에 다시 세운 나라. 1902년 리야드를 되찾고 1913년 동쪽 하사를 오스만 제국에게서 빼앗았으며, 이흐완 군을 앞세워 1921년 하일의 자발 샴마르를 병합하고 술탄을 칭함. 1924~1925년 히자즈를 정복함
  mapNote: 지도에는 1902년부터 1925년까지 지금 사우디아라비아의 주 경계로 표시하고(1902년 리야드 주, 1904년 카심, 1913년 알하사 오아시스), 룹알할리 사막은 1918년부터 지금 국경까지 넣음. 1920년 아시르 고원, 1921년 하일, 1922년 자우프와 북부 국경 지대, 1925년 히자즈를 더함
  endNote: 1926년 1월 8일 압둘아지즈가 히자즈 왕에 올라 히자즈·네지드 왕국을 이룸
  features:
    - 도읍은 리야드
    - 와하브파 이흐완 정착촌의 부족 군대가 정복을 이끎
    - 1915년 다린 조약으로 영국의 보호를 받아들임
    - 1922년 우카이르 의정서로 이라크·쿠웨이트와 경계와 중립 지대를 정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["다린 조약(1915)", "우카이르 의정서(1922)"]
    foundingNote: 압둘아지즈가 리야드를 되찾은 1902년 1월 13일부터

- id: saudi-arabia
  level: polity
  names: { ko: 사우디아라비아, en: Saudi Arabia, native: المملكة العربية السعودية }
  from: 1926
  to: null
  color: "#2f8f5f"
  summary: 사우드 가문이 다스리는 아라비아 반도 대부분의 왕국. 1926년 압둘아지즈가 히자즈 왕에 올라 히자즈·네지드 왕국을 이루었고, 1932년 9월 23일 사우디아라비아 왕국으로 나라 이름을 바꿈. 1934년 예멘과의 전쟁 뒤 타이프 조약으로 지잔·나지란을 얻고 아시르의 귀속을 확정했으며, 1938년 동부에서 석유가 발견됨
  mapNote: 지도에는 1926년부터 지금 사우디아라비아의 주 경계로 표시하고, 1934년 지잔·나지란을 더함. 예멘과의 내륙 경계(2000년 지다 조약으로 확정)와 아랍에미리트와의 경계(1974년 지다 조약)는 앞 시기에도 지금 국경으로 그림
  features:
    - 도읍은 리야드, 이슬람 두 성지 메카와 메디나를 지킴
    - 1927년 지다 조약으로 영국이 완전한 독립을 인정함
    - 1926년 메카 조약으로 이드리스 가의 아시르를 보호국으로 삼고 1930년 편입함
    - 1960년 석유 수출국 기구(OPEC) 창립에 참여함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["지다 조약(1927)", "왕국 통합 칙령(1932)", "타이프 조약(1934)"]
    foundingNote: 압둘아지즈가 히자즈 왕에 오른 1926년 1월 8일부터

- id: jabal-shammar
  level: polity
  names: { ko: 자발 샴마르, en: Emirate of Jabal Shammar, native: إمارة جبل شمر }
  from: 1836
  to: 1921
  color: "#a0705a"
  summary: 샴마르 부족의 라시드 가문이 하일을 중심으로 다스린 아라비아 북부의 아미르국. 19세기 말에는 사우드 가문을 몰아내고 네지드를 차지했으나, 1902년부터 이븐 사우드에게 밀리며 오스만 제국에 기대었음. 1차 대전 뒤 영국과 손잡은 네지드에 둘러싸임
  mapNote: 지도에는 1836년부터 1920년까지 하일 주로 표시하고, 1869~1908년 자우프, 1887~1901년 리야드 주, 1891~1903년 카심을 더함
  endNote: 1921년 11월 2일 하일이 네지드에 항복해 병합됨
  features:
    - 도읍은 하일
    - 메카 순례길과 대상로를 지키며 세력을 키움
    - 1891년 물라이다 전투에서 사우드 가문을 이겨 리야드를 차지함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["하일 항복(1921)"]
    foundingNote: 라시드 가문의 압둘라가 하일의 아미르가 된 1836년부터

- id: idrisid-emirate
  level: polity
  names: { ko: 아시르 에미르국 (이드리스 가), en: Idrisid Emirate of Asir, native: الإمارة الإدريسية }
  from: 1907
  to: 1934
  color: "#8f7fc4"
  summary: 무함마드 알이드리스가 홍해 연안 아시르 티하마에 세운 나라. 1909년 정부를 세우고 1차 대전 때 영국과 손잡아 오스만 제국과 싸웠으며, 1921년 영국에게서 호데이다를 넘겨받아 가장 넓어짐. 1924~1925년 예멘과의 전쟁에서 호데이다를 잃음
  mapNote: 지도에는 1909년부터 1933년까지 지잔 주(1918~1924년은 하자 주 해안 평야도)로 표시하고, 1921년부터 1924년까지 호데이다 주를 더함. 아시르 주의 해안 평야(약 7,500 km²)는 아시르 주와 함께 사우디 쪽에 둠
  endNote: 1926년 메카 조약으로 사우디 종주권을 받아들이고 1930년 히자즈·네지드 왕국에 편입되었으며, 1932~1933년 반란이 진압된 뒤 1934년 타이프 조약으로 귀속이 굳어짐
  features:
    - 도읍은 사비야
    - 수피 교단을 이끈 이드리스 가문이 다스림
    - 1915년 영국과 조약을 맺어 오스만 제국에 맞섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["영국-이드리스 조약(1915)", "타이프 조약(1934)"]
    foundingNote: 무함마드 알이드리스가 아시르에서 세력을 일으킨 1907년부터

# ── 예멘·아덴 ──
- id: yemen-kingdom
  level: polity
  names: { ko: 예멘 무타와킬 왕국, en: Mutawakkilite Kingdom of Yemen, native: المملكة المتوكلية اليمنية }
  from: 1918
  to: 1962
  color: "#d06a50"
  summary: 자이드파 이맘 야흐야가 오스만 제국 철수 뒤 예멘 북부에 세운 왕국. 1918년 10월 30일 독립했고, 1925년 이드리스 가에게서 호데이다를 빼앗아 티하마를 얻었으며, 1934년 사우디아라비아와의 전쟁에 지고 타이프 조약을 맺음. 같은 해 영국과 조약을 맺어 아덴 보호령과의 경계를 그대로 둠
  mapNote: 지도에는 1918년부터 1961년까지 옛 북예멘 땅(지금 예멘의 북부·서부 주)으로 표시하고, 1925년 호데이다를 더함
  endNote: 1962년 9월 26일 군사 혁명으로 공화국이 선포되었고, 왕당파와의 내전은 1970년까지 이어짐
  features:
    - 도읍은 사나, 1948년부터는 타이즈
    - 1948년 이맘 야흐야가 암살되고 아들 아흐마드가 뒤를 이음
    - 바깥 세계와 거의 교류하지 않는 고립 정책을 폄
    - 1958년 아랍 연합 공화국과 느슨한 아랍 국가 연합을 맺음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무드로스 휴전 협정(1918)", "타이프 조약(1934)", "사나 조약(1934)"]
    foundingNote: 이맘 야흐야가 독립을 선언한 1918년 10월 30일부터

- id: yemen-arab-republic
  level: polity
  names: { ko: 예멘 아랍 공화국, en: Yemen Arab Republic, native: الجمهورية العربية اليمنية }
  from: 1962
  to: 1990
  color: "#d8665a"
  summary: 1962년 혁명으로 무타와킬 왕국을 무너뜨리고 세운 예멘 북부의 공화국. 이집트가 공화파를, 사우디아라비아가 왕당파를 도운 내전이 1970년까지 이어졌고, 1978년 알리 압둘라 살레가 대통령이 됨. 남예멘과 두 차례(1972·1979) 국경 전쟁을 치름
  mapNote: 지도에는 1962년부터 1989년까지 옛 북예멘 땅으로 표시하고, 내전 중의 지배 구역은 그리지 않음
  endNote: 1990년 5월 22일 남예멘과 합쳐 예멘 공화국이 됨
  features:
    - 도읍은 사나
    - 북예멘이라고도 불림
    - 1984년 마리브 둘레에서 석유가 발견됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["예멘 아랍 공화국 선포(1962)", "예멘 통일 협정(1990)"]
    foundingNote: 군사 혁명으로 공화국을 선포한 1962년 9월 26일부터

- id: aden-protectorate
  level: polity
  names: { ko: 아덴 보호령, en: Aden Protectorate, native: محمية عدن }
  from: 1886
  to: 1967
  color: "#9d8fd0"
  summary: 영국이 아덴 항구 둘레의 남아라비아 술탄국·아미르국들과 보호 조약을 맺어 이룬 보호령. 처음에는 영국령 인도가 맡았고, 1937년 아덴이 직할 식민지가 된 뒤 1940년 서·동 보호령으로 나뉨. 1959년 서쪽 나라들이 남아라비아 연방을 이루었고 1963년 아덴이 합류함
  mapNote: 지도에는 1886년부터 1966년까지 옛 남예멘 땅으로 표시하고, 서·동 보호령과 남아라비아 연방을 나누지 않음. 아덴 식민지(약 194 km²)와 소코트라섬도 넣음
  endNote: 1967년 11월 30일 영국군이 철수하고 남예멘 인민 공화국이 독립함
  features:
    - 동쪽 하드라마우트의 쿠아이티·카시리 술탄국이 가장 컸음
    - 1937년부터 라헤즈(서)·무칼라(동)에 영국 정치관이 머묾
    - 1963년부터 독립 세력의 무장 투쟁(아덴 비상 사태)이 이어짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["남아라비아 보호 조약들(1886~1914)", "남아라비아 연방 헌장(1959)"]
    foundingNote: 첫 정식 보호 조약(마흐라 술탄국)을 맺은 1886년부터

- id: south-yemen
  level: polity
  names: { ko: 남예멘, en: South Yemen, native: اليمن الجنوبية }
  from: 1967
  to: 1990
  color: "#5f8fc0"
  summary: 영국의 아덴 보호령이 독립해 세운 아라비아 반도 남부의 나라. 1967년 11월 30일 남예멘 인민 공화국으로 독립했고, 1970년 예멘 인민 민주 공화국으로 이름을 바꿔 아랍 세계 유일의 마르크스주의 국가가 됨. 1986년 집권당 안의 내전을 겪음
  mapNote: 지도에는 1967년부터 1989년까지 옛 남예멘 땅으로 표시함
  endNote: 1990년 5월 22일 예멘 아랍 공화국과 합쳐 예멘 공화국이 됨
  features:
    - 도읍은 아덴
    - 소련과 가까웠고 예멘 사회당이 나라를 이끎
    - 1970년대 오만 도파르의 반란 세력을 도움
  startEvents: []
  endEvents: []
