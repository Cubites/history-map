  mapNote: 지도에는 1837년부터 표시. 1837년 알제·오랑·콘스탄틴 둘레, 1843년 압델카데르의 옛 땅(오랑 도 안쪽·티테리), 1847년 비스크라, 1855년 카빌리와 라구아트·젤파·엘바야드 초원, 1882년 음자브·우아르글라·수프와 나아마, 1901년 투아트·구라라·사우라, 1905년 호가르·타실리를 더하고, 1918년부터 1961년까지 지금 알제리 땅(남부 영토·틴두프·베샤르 포함) 한 모양으로 표시함. 1830~1836년 해안 거점과 1917년까지의 틴두프는 넣지 않음
