- id: french-morocco
  level: polity
  names: { ko: 모로코 (프랑스 보호령), en: French protectorate in Morocco, native: الحماية الفرنسية في المغرب }
  from: 1912
  to: 1956
  color: "#4a6aa8"
  summary: 프랑스의 보호를 받은 알라위 왕조의 모로코 술탄국. 1912년 3월 30일 페스 조약으로 보호국이 되고 리요테 총주재관이 라바트에 도읍을 둠. 아틀라스 산지와 사하라 가장자리의 부족은 1934년에야 평정됨
  mapNote: 지도에는 1912년부터 1955년까지 보호 조약 범위 전체(북부 스페인 구역·타르파야 띠·서사하라 빼고, 이프니 넣음)로 표시함
  endNote: 1956년 3월 2일 프랑스가 독립을 인정함
  features:
    - 도읍은 라바트
    - 1925~1926년 리프 전쟁에서 스페인과 함께 압드 엘크림을 누름
    - 1953년 프랑스가 술탄 무함마드 5세를 마다가스카르로 내쫓았다가 1955년 돌려보냄
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["페스 조약(1912)", "프랑스-모로코 공동 선언(1956)"]
    foundingNote: 술탄이 페스 조약에 서명한 1912년 3월 30일부터

- id: spanish-morocco
  level: polity
  names: { ko: 모로코 북부 (스페인 보호령), en: Spanish protectorate in Morocco, native: الحماية الإسبانية في المغرب }
  from: 1912
  to: 1956
  color: "#d9702e"
  summary: 프랑스-스페인 조약으로 스페인이 맡은 모로코 북부(리프·지발라). 술탄의 대리인이 테투안에 머물고 스페인 고등 판무관이 실권을 쥠. 1921년 아누알 전투에서 스페인군이 크게 짐
  mapNote: 지도에는 1912년부터 1955년까지 북부 구역(테투안·라라슈·셰프샤우엔·알호세이마·나도르 둘레)으로 표시하고, 탕헤르 국제 지대는 이 구역에 넣음. 남부 구역(타르파야 띠)과 이프니는 넣지 않음
  endNote: 1956년 4월 7일 스페인이 모로코의 독립을 인정해 북부 구역이 모로코에 들어감
  features:
    - 도읍은 테투안
    - 1921~1926년 압드 엘크림의 리프 공화국이 스페인 지배에 맞섬
    - 1936년 프랑코가 이곳의 아프리카군을 이끌고 스페인 내전을 일으킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["프랑스-스페인 조약(1912)"]
    foundingNote: 프랑스-스페인 조약이 맺어진 1912년 11월 27일부터

- id: morocco
  level: polity
  names: { ko: 모로코, en: Morocco, native: المغرب }
  from: 1956
  to: null
  color: "#b8404a"
  summary: 북아프리카 서쪽 끝의 알라위 왕조 왕국. 1956년 프랑스·스페인 보호령에서 독립해 1957년 8월 술탄 무함마드 5세가 왕의 칭호를 씀. 1961년 하산 2세, 1999년 무함마드 6세가 왕위를 이음
  mapNote: 지도에는 1956년부터 지금 모로코 땅(1958년 반환된 타르파야 띠와 1969년 반환된 이프니 포함)으로 표시함. 1976년 뒤의 서사하라는 귀속 논쟁 지역으로 따로 그림
  features:
    - 도읍은 라바트
    - 1963년 알제리와 모래 전쟁을 치름
    - 1975년 녹색 행진으로 스페인령 사하라에 들어감
    - 1980~1987년 서사하라에 모로코 장벽을 쌓음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["프랑스-모로코 공동 선언(1956)", "앙그라 데 신트라 조약(1958)"]
    foundingNote: 프랑스가 독립을 인정한 1956년 3월 2일부터

- id: spanish-sahara
  level: polity
  names: { ko: 스페인령 사하라, en: Spanish Sahara, native: Sáhara Español }
  from: 1884
  to: 1976
  color: "#e3c98f"
  summary: 스페인이 다스린 서사하라(사기아엘함라·리오데오로). 1884년 보호령을 선포하고 이듬해 빌라시스네로스를 세웠으나 오래 해안 거점만 지배했고, 1934년 내륙의 스마라를 차지함. 1958년 스페인의 사하라 주가 됨
  mapNote: 지도에는 내륙을 차지한 1934년부터 1975년까지 서사하라 전체로 표시함. 1933년까지는 비움
  endNote: 1975년 11월 마드리드 협정으로 모로코·모리타니에 행정을 넘기기로 하고 1976년 2월 26일 철수함
  features:
    - 도읍은 1958년부터 엘아이운
    - 1957~1958년 이프니 전쟁에서 모로코 해방군과 싸움
    - 부크라의 인광석 광산이 큰 수입원이 됨
    - 1973년 폴리사리오 전선이 독립 투쟁을 시작함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["프랑스-스페인 협약(1900)", "마드리드 협정(1975)"]
    foundingNote: 스페인이 서아프리카 해안의 보호령을 선포한 1884년부터

- id: western-sahara-disputed
  level: region
  names: { ko: 서사하라 (귀속 논쟁), en: Western Sahara (disputed), native: الصحراء الغربية }
  from: 1976
  to: null
  color: "#d8c08a"
  summary: 스페인이 물러난 뒤 귀속이 정해지지 않은 서사하라. 1976년 모로코가 북쪽 3분의 2, 모리타니가 남쪽 3분의 1을 차지했고 같은 해 폴리사리오 전선이 사하라 아랍 민주 공화국을 선포함. 1979년 8월 모리타니가 물러난 뒤 모로코가 그 몫도 차지했고 1991년 유엔 중재로 휴전함
  mapNote: 지도는 1976년부터 전체를, 1987년부터 모로코 장벽 서쪽을 귀속 논쟁 지역으로 표시하고 모로코·사하라 아랍 민주 공화국(1978년까지 모리타니도)을 귀속 후보로 그림. 1976~1979년 모로코·모리타니 몫은 나누지 않음
  features:
    - 유엔은 비자치 지역으로 보고 주민 투표를 약속했으나 열리지 않음
    - 1975년 국제 사법 재판소는 모로코·모리타니와의 옛 유대가 영토 주권은 아니라고 권고함
    - 2020년 미국이 모로코의 주권을 인정함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["마드리드 협정(1975)", "국제 사법 재판소 서사하라 권고 의견(1975)", "유엔 안전 보장 이사회 결의 690호(1991)"]
    foundingNote: 스페인이 철수한 1976년 2월부터

- id: western-sahara-free-zone
  level: region
  names: { ko: 서사하라 (폴리사리오 전선 관할), en: Western Sahara (Polisario-held zone), native: الصحراء الغربية }
  from: 1987
  to: null
  color: "#d8c08a"
  summary: 서사하라 가운데 모로코 장벽의 동쪽, 폴리사리오 전선이 다스리는 내륙 사막. 모로코가 1980년부터 쌓은 모래 둑이 1987년 4월 완성되며 서사하라가 장벽 서쪽과 동쪽으로 갈림
  mapNote: 지도는 1987년부터 모로코 장벽 동쪽을 따로 귀속 논쟁 지역으로 표시하고 사하라 아랍 민주 공화국과 모로코를 귀속 후보로 그림
  features:
    - 1991년 휴전 뒤 유엔 서사하라 주민 투표 지원단이 장벽 양쪽을 감시함
    - 비르라흘루·티파리티가 중심지
    - 2020년 11월 휴전이 깨져 장벽을 사이에 둔 싸움이 다시 일어남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["유엔 안전 보장 이사회 결의 690호(1991)"]
    foundingNote: 모로코 장벽이 완성된 1987년 4월부터

- id: sahrawi-republic
  level: polity
  names: { ko: 사하라 아랍 민주 공화국, en: Sahrawi Arab Democratic Republic, native: الجمهورية العربية الصحراوية الديمقراطية }
  from: 1976
  to: null
  color: "#4f9aa8"
  summary: 1976년 2월 27일 폴리사리오 전선이 서사하라에 선포한 나라. 정부는 알제리 틴두프의 난민촌에 있고, 아프리카 연합 회원국이나 유엔 회원국은 아님
  mapNote: 지도에서는 땅을 '서사하라 (귀속 논쟁)'·'서사하라 (폴리사리오 전선 관할)' 지역 항목으로 그리고 이 나라를 귀속 후보로 둠(이 항목에는 따로 영토가 없음)
  features:
    - 1984년 아프리카 단결 기구에 가입해 모로코가 탈퇴함(2017년 모로코 복귀)
    - 승인한 나라의 수는 늘고 줄기를 되풀이함
    - 엘아이운을 수도로 내세우고 티파리티를 임시 수도로 둠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["사하라 아랍 민주 공화국 선포(1976)"]
    foundingNote: 폴리사리오 전선이 비르라흘루에서 선포한 1976년 2월 27일부터

- id: mauritania
  level: polity
  names: { ko: 모리타니, en: Mauritania, native: موريتانيا }
  from: 1960
  to: null
  color: "#8f7a4a"
  summary: 사하라 서쪽 끝 대서양 기슭의 이슬람 공화국. 1960년 11월 28일 프랑스에서 독립했고 1976~1979년 서사하라 남부(티리스알가르비야)를 차지함
  mapNote: 지도 범위 밖이라 땅을 그리지 않고, 1976~1978년 서사하라의 귀속 후보로만 둠(이 항목에는 따로 영토가 없음)
  features:
    - 도읍은 누악쇼트
    - 1979년 8월 폴리사리오 전선과 평화 협정을 맺고 서사하라에서 물러남
    - 1981년 노예제를 법으로 없앰
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["모리타니 독립 선언(1960)", "알제 평화 협정(1979)"]
    foundingNote: 프랑스에서 독립한 1960년 11월 28일부터
