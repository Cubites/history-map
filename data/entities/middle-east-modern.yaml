  mapNote: 지도는 1943년부터 1950년까지 가다메스를 뺀 트리폴리타니아와 키레나이카(쿠프라 포함)를 영국 점령지로 표시함
  endNote: 1951년 12월 24일 리비아 연합 왕국으로 독립함
