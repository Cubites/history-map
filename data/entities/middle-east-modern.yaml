  to: 1958
  color: "#c9606a"
  summary: 1922년 영국의 일방 독립 선언으로 선 이집트 왕국과 그 뒤를 이은 공화국. 영국은 수에즈 운하·국방 등 네 가지를 유보하고 군대를 두었고, 1936년 영국-이집트 조약으로 영국군이 운하 지대로 물러남. 1952년 7월 23일 자유 장교단의 혁명으로 파루크 왕이 물러나고 1953년 6월 18일 공화국이 됨
  mapNote: 지도에는 1922년부터 1957년까지 지금 이집트 땅(시나이반도·할라이브 포함)으로 표시함. 1935년까지 영국의 간섭을 받은 나라로 그림
  endNote: 1958년 2월 1일 시리아와 합쳐 아랍 연합 공화국이 됨
  features:
    - 도읍은 카이로
    - 1948~1949년 이스라엘과 싸운 뒤 휴전선으로 가자 지구를 다스림
    - 1954년 영국군의 운하 지대 철수 협정을 맺음
    - 1956년 나세르가 수에즈 운하를 국유화해 영국·프랑스·이스라엘과 싸움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["영국의 이집트 독립 선언(1922)", "영국-이집트 조약(1936)"]
    foundingNote: 영국이 이집트의 독립을 일방적으로 선언한 1922년 2월 28일부터

- id: arab-republic-of-egypt
  level: polity
  names: { ko: 이집트, en: Arab Republic of Egypt, native: جمهورية مصر العربية }
  from: 1971
  to: null
  color: "#c9606a"
  summary: 1971년 9월 아랍 연합 공화국에서 나라 이름을 바꾼 이집트 아랍 공화국. 1973년 10월 전쟁 뒤 사다트가 1979년 이스라엘과 평화 조약을 맺어 시나이반도를 되찾았고, 1981년부터 무바라크가 다스리다 2011년 혁명으로 물러남
  mapNote: 지도에는 1971년부터 지금 이집트 땅으로 표시하되, 이스라엘이 점령한 시나이반도는 1979년까지 전부, 1980~1981년 동쪽만 따로 점령 지역으로 그리고 1982년부터 다시 넣음. 할라이브는 북위 22도선대로 넣음
  features:
