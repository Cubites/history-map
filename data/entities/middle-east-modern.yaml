  mapNote: 지도에는 1925년부터 1978년까지 지금 이란 땅으로 표시함. 영국·소련의 점령(1941~1946)과 아제르바이잔 인민 정부·마하바드 공화국(1945~1946)은 그리지 않음
  endNote: 1979년 1월 샤가 나라를 떠나고 2월 11일 이슬람 혁명으로 왕정이 무너짐
