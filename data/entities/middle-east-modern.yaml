  mapNote: 지도는 1967년부터 1979년까지 수에즈 운하 동쪽 반도 전체, 1980~1981년 엘아리시와 라스무함마드를 잇는 선 동쪽을 이집트 땅 위의 이스라엘 점령지로 표시함. 1973년 전쟁 뒤 이집트가 되찾은 운하 동쪽 띠는 따로 나누지 않음
  endNote: 1982년 4월 25일 이스라엘이 마지막으로 철수해 반도 전체가 이집트에 돌아감(타바는 1989년)
  features:
