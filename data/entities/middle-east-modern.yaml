# middle-east modern 나라 (시대 파일 scripts/geo/areas/middle-east/modern.mjs의 짝 항목 파일)
# 시대·범위: 1918~현재: 위임 통치령·보호국·식민지와 독립 나라
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-modern').
# 서아시아·북아프리카 A1a-1(2026-10-29): 레반트·이라크·쿠웨이트, A1a-2(같은 날): 아라비아 반도·이란, A1b(같은 날): 이집트·마그레브·서사하라(파일 끝 절). 점령지 행정 셋·영국 점령 메소포타미아는 옛 오스만 땅의 점령 지역 항목(occupied_by),
#   위임 통치령·보호국은 따로 나라 항목(vassal_of 본국), 서안·가자는 지역 항목(occupied_by·claimed_by), 팔레스타인(국)은 영토 없는 나라 항목(유럽 코소보 꼴).
# 5년 미만이거나 1만 km² 미만인 나라(파이살의 시리아 아랍 왕국, 알라위·드루즈·다마스쿠스·알레포 국, 1958 아랍 연방)는 항목을 만들지 않는다. startEvents·endEvents는 사건 묶음 me-08이 채운다.

# ── 1918~1920 점령지 행정 ──
- id: oeta-south
  level: region
  names: { ko: 점령지 행정 남부 (영국 점령), en: Occupied Enemy Territory Administration South, native: OETA South }
  from: 1918
  to: 1920
  color: "#b5845a"
  summary: 1차 대전 끝 무렵 영국군이 오스만 제국에게서 빼앗은 팔레스타인을 다스린 군정. 1918년 10월 23일 점령지 행정이 남·서·동·북으로 나뉘어 섰고, 남부는 예루살렘·야파·마즈달·베르셰바 4구를 영국 군정관이 맡음. 오스만의 법적 주권은 로잔 조약(1923년 서명, 1924년 발효)까지 남음
  mapNote: 지도에는 1918년부터 1919년까지 오스만 땅 위의 영국 점령지로 표시함. 골란은 동부 쪽에 둠
  endNote: 1920년 4월 산레모 회의가 팔레스타인 위임 통치를 영국에 맡기고, 7월 1일 허버트 새뮤얼 고등 판무관의 민간 행정으로 바뀜
  features:
    - 영국군 사령관 앨런비가 이끈 이집트 원정군이 1917년 12월 예루살렘에 들어감
    - 군정관이 오스만 법과 행정 체계를 대체로 그대로 두고 다스림
    - 1919년 파리 강화 회의에서 팔레스타인의 장래가 다투어짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무드로스 휴전 협정(1918)", "산레모 회의 결의(1920)"]
    foundingNote: 점령지 행정이 남·서·동·북으로 나뉘어 선 1918년 10월 23일부터

- id: oeta-west
  level: region
  names: { ko: 점령지 행정 서부 (프랑스 점령), en: Occupied Enemy Territory Administration West, native: OETA West }
  from: 1918
  to: 1920
  color: "#b5845a"
  summary: 1차 대전 끝 무렵 연합군이 차지한 레바논·시리아 해안을 프랑스 군정관이 다스린 점령지 행정. 1918년 10월 23일 베이루트 주와 레바논 산 자치구, 라타키아 쪽 해안을 맡아 섰음. 오스만의 법적 주권은 로잔 조약(1923년 서명, 1924년 발효)까지 남음
  mapNote: 지도에는 1918년부터 1919년까지 오스만 땅 위의 프랑스 점령지로 표시함. 1919년 11월 영국군이 철수하며 베카 골짜기가 프랑스 쪽으로 넘어간 일은 1만 km² 미만이라 1918년 모습 하나로 그림
  endNote: 1920년 8월 31일 구로 장군의 칙령으로 대레바논이 9월 1일 선포되고, 해안의 알라위 땅은 프랑스 위임 통치령 시리아의 한 국가가 됨
  features:
    - 프랑스 고등 판무관이 베이루트에서 행정을 맡음
    - 1916년 사이크스-피코 협정에서 프랑스 직접 통치 구역으로 정한 해안이 중심
    - 레바논 산의 마론파 지도층은 프랑스 아래 대레바논을 바람
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["사이크스-피코 협정(1916)", "산레모 회의 결의(1920)"]
    foundingNote: 점령지 행정이 남·서·동·북으로 나뉘어 선 1918년 10월 23일부터

- id: oeta-east
  level: region
  names: { ko: 점령지 행정 동부 (영국 점령), en: Occupied Enemy Territory Administration East, native: OETA East }
  from: 1918
  to: 1920
  color: "#b5845a"
  summary: 1차 대전 끝 무렵 아랍 반란군과 영국군이 차지한 시리아 내륙과 요르단강 동쪽을 영국군 최고 지휘 아래 파이살의 아랍 정부가 다스린 점령지 행정. 1918년 10월 4일 파이살이 다마스쿠스에 들어갔고 알리 리다 알리카비가 군정관을 맡음. 1919년 11월 영국군이 철수한 뒤 파이살은 1920년 3월 8일 시리아 아랍 왕국을 선포함
  mapNote: 지도에는 1918년부터 1919년까지 오스만 땅 위의 영국 점령지로 표시하고, 다마스쿠스·알레포 내륙과 요르단강 동쪽(마안·아카바 빼고), 골란, 베카 골짜기를 넣음. 시리아 아랍 왕국(1920)은 5년 미만이라 따로 그리지 않음
  endNote: 1920년 7월 24일 마이살룬 전투에서 프랑스군이 파이살 군을 깨뜨리고 다마스쿠스를 차지함
  features:
    - 파이살이 1918년 10월 4일 다마스쿠스에 들어감
    - 1919년 9월 영국·프랑스 합의로 영국군이 내륙에서 철수함
    - 1920년 3월 시리아 국민 회의가 파이살을 왕으로 추대함
    - 동쪽 데이르에조르와 남쪽 마안 쪽 경계는 정해지지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무드로스 휴전 협정(1918)", "산레모 회의 결의(1920)"]
    foundingNote: 점령지 행정이 남·서·동·북으로 나뉘어 선 1918년 10월 23일부터

# ── 프랑스 위임 통치령 시리아·레바논과 독립국 ──
- id: french-mandate-syria
  level: polity
  names: { ko: 프랑스 위임 통치령 시리아, en: French Mandate for Syria, native: الانتداب الفرنسي على سوريا }
  from: 1920
  to: 1946
  color: "#7f95c8"
  summary: 국제 연맹이 프랑스에 맡긴 시리아 위임 통치령. 1920년 4월 산레모 회의에서 프랑스에 배정되고 7월 마이살룬 전투 뒤 프랑스가 다마스쿠스를 차지함. 1920년 다마스쿠스·알레포·알라위 국, 1921~1922년 자발 드루즈 국을 나눠 세웠고, 1925년 시리아 국으로 합친 뒤 1930년 시리아 공화국 헌법을 둠. 1925~1927년 시리아 대반란이 일어남
  mapNote: 지도에는 1920년부터 1945년까지 지금 시리아 땅(골란 포함)으로 표시하고, 위임 통치 안의 국가들은 묶어 그림. 알렉산드레타(하타이)는 비움
  endNote: 1946년 4월 17일 프랑스군이 모두 물러나 시리아 공화국이 사실상 독립함
  features:
    - 도읍은 다마스쿠스
    - 1925~1927년 자발 드루즈에서 시작한 시리아 대반란을 프랑스군이 진압함
    - 1936년 프랑스-시리아 조약이 맺어졌으나 프랑스 의회가 비준하지 않음
    - 1938년 알렉산드레타가 하타이 국이 되고 1939년 튀르키예에 넘어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["산레모 회의 결의(1920)", "국제 연맹 시리아·레바논 위임 통치 규약(1922)"]
    foundingNote: 산레모 회의로 위임 통치가 정해지고 마이살룬 전투 뒤 프랑스가 다마스쿠스를 차지한 1920년부터

- id: greater-lebanon
  level: polity
  names: { ko: 대레바논, en: State of Greater Lebanon, native: دولة لبنان الكبير }
  from: 1920
  to: 1943
  color: "#5fae8f"
  summary: 프랑스 위임 통치 아래 레바논 산 자치구에 베이루트·트리폴리(레바논)·시돈·티레와 베카 골짜기를 더해 세운 나라. 1920년 9월 1일 구로 장군이 선포했고, 1926년 5월 23일 헌법을 두며 레바논 공화국이 됨
  mapNote: 지도에는 1920년부터 1942년까지 지금 레바논 땅으로 표시함. 레바논 공화국(1926)은 이름만 바뀌어 같은 항목으로 그림
  endNote: 1943년 11월 22일 프랑스가 가두었던 정부 인사들을 풀어 주고 독립을 받아들여 레바논 공화국이 독립함
  features:
    - 도읍은 베이루트
    - 마론파·수니파·시아파·드루즈 등 여러 종파가 함께 사는 땅으로 넓힘
    - 1932년 인구 조사가 뒤의 종파별 권력 나눔의 바탕이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["구로 장군 칙령 318호(1920)", "레바논 헌법(1926)"]
    foundingNote: 구로 장군이 대레바논을 선포한 1920년 9월 1일부터

- id: lebanon
  level: polity
  names: { ko: 레바논, en: Lebanon, native: لبنان }
  from: 1943
  to: null
  color: "#4fa88a"
  summary: 지중해 동쪽 끝의 공화국. 1943년 11월 프랑스 위임 통치에서 독립했고, 종파별로 대통령(마론파)·총리(수니파)·국회 의장(시아파)을 나누는 국민 협약을 바탕으로 함. 1975~1990년 내전을 겪었고 1990년 타이프 협정으로 끝남
  mapNote: 지도에는 1943년부터 지금 레바논 땅으로 표시함. 내전 중의 실효 지배 구역과 이스라엘의 남부 점령(1982~2000), 시리아군 주둔(1976~2005)은 그리지 않음
  features:
    - 도읍은 베이루트
    - 1945년 아랍 연맹과 유엔 창설에 참여함
    - 1975~1990년 내전 동안 이스라엘과 시리아가 군대를 들여보냄
    - 2005년 하리리 전 총리가 암살된 뒤 시리아군이 물러남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["레바논 국민 협약(1943)", "타이프 협정(1989)"]
    foundingNote: 프랑스 위임 통치에서 독립한 1943년 11월 22일부터

- id: syria-republic
  level: polity
  names: { ko: 시리아 공화국, en: Syrian Republic, native: الجمهورية السورية }
  from: 1946
  to: 1958
  color: "#6e8cc4"
  summary: 프랑스군이 물러난 뒤의 시리아 공화국. 1944년 독립을 선포하고 1945년 10월 유엔에 가입했으며 1946년 4월 17일 프랑스군 철수로 사실상 주권 국가가 됨. 1949년 세 차례 쿠데타를 겪는 등 정치가 불안했음
  mapNote: 지도에는 1946년부터 1957년까지 지금 시리아 땅(골란 포함)으로 표시함
  endNote: 1958년 2월 1일 이집트와 합쳐 아랍 연합 공화국이 됨
  features:
    - 도읍은 다마스쿠스
    - 1948년 아랍-이스라엘 전쟁에 참전하고 1949년 7월 이스라엘과 휴전 협정을 맺음
    - 1949년 후스니 알자임 등의 쿠데타가 잇따름
    - 바트당이 힘을 키워 이집트와의 통합을 이끎
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이스라엘-시리아 휴전 협정(1949)"]
    foundingNote: 프랑스군이 모두 물러나 사실상 주권 국가가 된 1946년 4월 17일부터

- id: united-arab-republic
  level: polity
  names: { ko: 아랍 연합 공화국, en: United Arab Republic, native: الجمهورية العربية المتحدة }
  from: 1958
  to: 1971
  color: "#c9606a"
  summary: 1958년 2월 1일 이집트와 시리아가 합쳐 세운 나라. 이집트의 나세르가 대통령을 맡고 도읍은 카이로였음. 1961년 9월 28일 시리아 다마스쿠스의 쿠데타로 시리아가 떨어져 나간 뒤에도 이집트는 1971년까지 이 이름을 씀
  mapNote: 지도에는 1958년부터 1960년까지 이집트 땅과 시리아 땅을, 1961년부터 1970년까지 이집트 땅을 넣음. 1967년 6일 전쟁부터 이스라엘이 점령한 시나이반도는 따로 점령 지역으로 그림
  endNote: 1971년 9월 이집트가 나라 이름을 이집트 아랍 공화국으로 바꿈
  features:
    - 도읍은 카이로
    - 나세르가 대통령을 맡아 시리아의 정당을 해산함
    - 1958년 예멘 무타와킬 왕국과 느슨한 아랍 국가 연합을 맺음
    - 시리아 쪽 불만이 쌓여 1961년 군부가 이탈을 선언함
    - 1970년 이집트에서 아스완 하이 댐이 완공됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아랍 연합 공화국 임시 헌법(1958)"]
    # 작업 메모: A1b가 이집트 땅 버전(1958~1970)과 mapNote·features 끝 줄을 더함
    foundingNote: 이집트·시리아가 합친 1958년 2월 1일부터

- id: syria
  level: polity
  names: { ko: 시리아, en: Syria, native: سوريا }
  from: 1961
  to: null
  color: "#7d93cf"
  summary: 레반트 북부의 공화국(시리아 아랍 공화국). 1961년 9월 아랍 연합 공화국에서 떨어져 나왔고 1963년 바트당이 정권을 잡음. 1970년부터 하페즈 알아사드, 2000년부터 바샤르 알아사드가 다스렸고 2011년 내전이 일어났으며, 2024년 12월 아사드 정권이 무너짐
  mapNote: 지도에는 1961년부터 지금 시리아 땅으로 표시하고, 1967년부터 이스라엘이 다스리는 골란 고원도 법적 국경대로 넣음. 2011년부터 내전 중의 실효 지배 구역은 그리지 않음
  features:
    - 도읍은 다마스쿠스
    - 1967년 6일 전쟁에서 골란 고원을 이스라엘에 빼앗김
    - 1981년 이스라엘의 골란 병합 선언을 유엔 안보리 결의 497호가 무효라고 함
