    refs: ["유엔 안전 보장 이사회 결의 242호(1967)", "이집트-이스라엘 평화 조약(1979)"]
    foundingNote: 6일 전쟁에서 이스라엘이 반도를 차지한 1967년 6월부터

# ── 리비아 ──
- id: italian-libya
  level: polity
  names: { ko: 이탈리아령 리비아, en: Italian Libya, native: Libia italiana }
  from: 1912
  to: 1943
  color: "#7fb87a"
  summary: 이탈리아가 오스만에게서 빼앗은 북아프리카 식민지. 1912년 로잔 조약으로 오스만이 물러났으나 이탈리아는 오래 해안 도시만 지배했고, 1922년부터 재정복에 나서 1932년 평정을 선언함. 트리폴리타니아와 키레나이카 두 식민지를 1934년 1월 1일 리비아로 합침
  mapNote: 지도에는 실제로 다스린 땅만 그려 1922년 트리폴리타니아 북부·나푸사 산지, 1928년 시르테·가다메스·키레나이카, 1930년 페잔, 1931년 쿠프라를 더함. 1921년까지는 비움
  endNote: 1943년 초 연합군이 트리폴리와 페잔을 차지해 이탈리아의 지배가 끝나고, 1947년 평화 조약으로 이탈리아가 권리를 버림
  features:
    - 도읍은 트리폴리
    - 1923~1931년 오마르 무크타르가 키레나이카에서 사누시 저항을 이끎
    - 1930년부터 키레나이카 유목민을 수용소에 가둠
    - 1937년 해안을 잇는 발보 도로가 개통됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["로잔(우시) 조약(1912)", "이탈리아 평화 조약(1947)"]
    foundingNote: 로잔 조약으로 오스만이 트리폴리타니아·키레나이카에서 물러난 1912년부터

- id: libya-british-admin
