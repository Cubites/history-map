- id: oyo-empire
  level: polity
  names: { ko: 오요 제국, en: Oyo Empire, native: Ilé Ọ̀yọ́ }
  from: 1300
  to: 1836
  color: "#b165d2"
  summary: 요루바 땅 북쪽 사바나에서 오요일레를 도읍으로 한 요루바족 제국. 알라핀이라 부르는 왕이 기병을 앞세워 17~18세기 남쪽 요루바 나라들과 서쪽 다호메이에게서 조공을 받았고, 해안으로 가는 노예 무역 길을 쥐어 크게 떨침. 18세기 말부터 왕과 귀족 회의 오요메시가 다투며 약해졌고, 1817년 일로린의 장군 아폰자가 반란을 일으킨 뒤 일로린은 1823년 무렵 풀라니 에미르국이 되어 소코토 칼리프국에 붙었으며, 같은 무렵 다호메이도 조공을 끊음
  mapNote: 지도에는 1800년부터 1835년까지 지금 나이지리아 오요·오순·오군·온도·에키티주 땅으로, 1816년까지는 지금 크와라주 일로린 쪽을 더해 표시함. 조공을 바친 다호메이 왕국은 따로 그림
  endNote: 1835년 일로린 군대에게 도읍 오요일레가 무너져 끝남. 알라핀은 남쪽으로 옮겨 지금 오요 도시에서 작은 나라로 이어졌고, 요루바 땅은 이바단·아베오쿠타 등이 다투는 여러 나라로 갈라짐
  features:
    - 도읍은 오요일레, 왕은 알라핀
    - 기병을 앞세운 군대
    - 다호메이에게서 조공을 받음
    - 1817년 일로린 아폰자의 반란
    - 1835년 도읍 오요일레가 무너짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Oyo Empire"]
    foundingNote: 오요가 나라를 이루었다고 보는 1300년 무렵부터(전통 설로 연대는 추정 — 지도에는 1800년부터)


# ══ F6 H-6 항목 (수단·에티오피아·뿔·차드·적도 아프리카) ══
# 위키 ko 표제 없음(en Turkiyya도 ko 연결 없음) — 가칭 그대로(기본값 11, 글에서는 '이집트령 수단'도 씀). 위키 en Turco-Egyptian Sudan — 1821-06-14 센나르 항복·코르도판 1821, 1840 카살라·타카, 1865 오스만이 홍해 연안을 넘김, 1874 가을 다르푸르,
#   en Ethiopian–Egyptian War 케렌 수비대 1872, en Equatoria 1870 베이커, en Al-Zubayr Rahma Mansur 1873 바르엘가잘 총독, en History of Eritrea 1865 마사와. 1885-01-26 하르툼 함락(mahdist-state).
#   1821~1884 여덟 단계(1821 수단 중북부·코르도판 → 1840 카살라 → 1861 상나일 → 1865 홍해·에리트레아 북홍해 ER-DU → 1870 적도주·늪지 안쪽 → 1872 에리트레아 안세바 ER-SK → 1873 바르엘가잘 → 1874 다르푸르 — 가시바르카 ER-GB는 비움, 기본값 12. 에리트레아 조각 이름표는 실제 주와 어긋나 땅 이름대로 고름), vassal_of muhammad-ali-egypt 1821~1884
- id: egyptian-sudan
  level: polity
  names: { ko: 투르코-이집트 수단, en: Turco-Egyptian Sudan, native: التركية }
  from: 1821
  to: 1885
  color: "#3f49a6"
  summary: 이집트 총독 무함마드 알리의 군대가 정복해 다스린 나일강 가운데 유역의 땅. 1820년 셋째 아들 이스마일 카밀 파샤가 이끈 원정군이 나일강을 거슬러 올라가 1821년 6월 14일 센나르의 푼지 술탄국을 항복시키고 다르푸르에게서 코르도판을 빼앗았으며, 하르툼을 행정 중심으로 키움. 1840년 동쪽 카살라 둘레 타카를 더했고, 1865년 오스만 제국에게서 수아킨·마사와 같은 홍해 항구를 넘겨받았고, 1872년 마사와에서 고원 쪽 케렌으로 올라가 수비대를 둠. 이집트 총독 이스마일 파샤 때 영국인 새뮤얼 베이커를 앞세워 1870년 남쪽 적도주를 세웠고, 1873년 바르엘가잘의 노예 상인 주바이르를 그 땅의 총독으로 인정했으며, 1874년 다르푸르 술탄국을 무너뜨림. 1877년부터 총독을 맡은 찰스 고든이 노예 무역을 막으려 했으나, 1881년 무함마드 아흐마드가 마흐디를 자처하며 봉기해 1883년 엘오베이드를 빼앗고 샤이칸에서 이집트군을 쳐부숨
  mapNote: 지도에는 1821년부터 1884년까지 지금 수단과 남수단 땅으로 표시하고, 이집트에 딸린 땅으로 나타냄. 1821년에는 나일강 둘레와 코르도판으로 그리고, 1840년 카살라, 1861년 상나일, 1865년 홍해 기슭과 마사와 둘레, 1870년 적도주, 1872년 에리트레아의 케렌 둘레, 1873년 바르엘가잘, 1874년 다르푸르를 더함. 남수단 늪지 안쪽은 강가 수비대 거점만 둔 명목 지배였음. 1883~1884년 마흐디군이 차지한 코르도판·다르푸르·바르엘가잘은 마흐디 국가가 하르툼을 함락하기 전이라 따로 칠하지 않고 이 색으로 그림. 지금 에리트레아 서쪽 낮은 땅(가시바르카)은 이집트 지배가 어디까지 미쳤는지 분명하지 않아 비움. 1875~1884년 이집트가 차지한 하라르와 아덴만 기슭 항구는 좁아 그리지 않음
  endNote: 1885년 1월 26일 마흐디군이 하르툼을 함락하고 총독 고든이 죽으면서 끝남. 이집트는 1884년 수단을 버리기로 하고 고든을 보내 수비대를 물리려 했음
  features:
    - 행정 중심은 하르툼
    - 1821년 6월 14일 센나르의 푼지 술탄국이 항복함
    - 1865년 오스만 제국에게서 홍해 항구를 넘겨받음
    - 1870년 적도주를 세우고 1874년 다르푸르 술탄국을 무너뜨림
    - 1881년 마흐디 봉기로 흔들림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Turco-Egyptian Sudan", "위키백과 Equatoria", "위키백과 Al-Zubayr Rahma Mansur"]
    foundingNote: 센나르가 항복해 정복을 마친 1821년부터(1820년 원정을 떠난 일은 글로)

