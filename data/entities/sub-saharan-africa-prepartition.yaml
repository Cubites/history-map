# sub-saharan-africa prepartition 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/prepartition.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1800~1884: 소코토 지하드부터 베를린 회의 앞까지 (F6, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-prepartition' → 필터 단위 sub-saharan-africa).
# F6 뼈대(2026-11-13)가 1800~1884에 칠하는 새 토착 나라·식민지·보호령·보어 공화국 항목 10개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f6/COMMON.md 4절 표, 표 원천 f6/skel/entities.tsv).
#   색은 본국 색이 아니라 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라와 ΔE 39 넘게 골랐다(f6/skel/tools/df6.mjs, COMMON P4). 본국은 data/relations.yaml의 vassal_of·occupied_by(칸 머리 아래).
#   모두 level: polity(토착 나라·식민지·보어 공화국도 — F2~F5 꼴). to는 끝난 해 = 칠한 마지막 해 + 1. from은 성립 해(1800 앞이면 그 해 그대로 — 지도 버전만 1800부터, P7).
#   이름은 위키백과 한국어판 표제로 확인했다(f6/skel/ko-titles.txt·en-ko.txt — 표제를 쓴 것: 오요 제국·푼지 술탄국·나탈리아 공화국, 저장소 꼴: 콜롤로 왕국·오렌지강 주권령,
#   표제가 없는 것은 지시문 가칭: 투르코-이집트 수단·영국령 카프라리아·그리콸란드 웨스트·영국령 트란스발·프랑스령 모리셔스 — f6/SKEL-NOTE.md 끝 공용 표기표).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f6/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(※ — 고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   앞 잇는 항목 45는 이 파일에 없다 — F5 항목 19는 data/entities/sub-saharan-africa-partition.yaml, F4 항목 4는 sub-saharan-africa-colonial.yaml, F3 항목 4는 sub-saharan-africa-postwar.yaml,
#   F2 항목 12는 sub-saharan-africa-decolonization.yaml, F1 항목 6은 sub-saharan-africa-modern.yaml 그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절). 서아시아·유럽 블록은 고치지 않는다.

