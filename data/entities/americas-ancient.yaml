# americas ancient 나라 (시대 파일 scripts/geo/areas/americas/ancient.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 아메리카 고대(기원전 2333년~기원후 1000년, 천문 −2332~1000) (M5 — docs/americas/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'americas-ancient' → 필터 단위 americas).
# M5 뼈대(2026-11-18)가 새 항목 14개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 m5/COMMON.md 4절 표, 표 원천 m5/skel/entities.tsv).
#   칠하는 것은 0(결정 Q1 A·Q2 A, 결정 9). 14개 모두 땅 없는 항목(level region — M4 toltec·maya-civilization 꼴)이라 시대 파일 versions에 없다(mapNote '지도에는 땅을 그리지 않음').
#   앞 잇는 항목은 없다 — M4 항목(maya-civilization·toltec·mixtec·sican-culture·chimu·dorset-culture·taino-culture 등) 블록은 그 자리 그대로(P3·G5-8).
#   색은 자기 색 — 땅이 없어 맞닿음 검사 대상은 아니나 관련 항목(이 파일 안·M4 항목)과 서로 다르게 골랐다(m5/skel/tools/dm5.mjs — 최소 ΔE 45.4).
#   to는 끝난 해(G5-4), 끝 없음(null)은 없다. from은 성립 해 — norte-chico·valdivia는 연도 막대 하한(기원전 2333년)보다 앞인 기원전 3500년(천문 −3499) 그대로(G5-3, 남아시아 indus-civilization 꼴 —
#   성립 열쇠는 허용 줄 '-3499 norte-chico 성립'·'-3499 valdivia 성립'이 필수, AND-M5가 넣음).
#   기원전 해는 천문 연도로 적는다(olmec-culture −1199 = 기원전 1200년, monte-alban −499 = 기원전 500년 — COMMON 머리 '해 표기').
#   이름은 위키백과 한국어판 표제로 확인했다(m5/skel/ko-titles.txt — 표제가 없거나 다른 가칭은 블록 머리 주석, 공용 표기표는 m5/SKEL-NOTE.md 끝).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native도 그 칸이 — m5/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 3묶음 몫이라 빈 목록 그대로).
#   이 단계는 칸이 from·to를 고치지 않는다(P5·C-M5-4 — 결정·기본값이 닫은 값이고 허용 열쇠 해). id·색·이름·level도 고치지 않는다.

# ══ M5 MXN-M5 항목 ══
# 글은 MXN-M5 칸이 채움 — 가칭(위키 ko 표제 없음 — '사포텍 문명'·'사포텍인'은 표제). 오아하카 계곡의 사포텍 도읍. 땅 없는 지역 항목(Q1 A — 7,241 km²는 계곡 지역 넓이), 기원전 500년~750
- id: monte-alban
  level: region
  names: { ko: 몬테알반, en: Monte Albán, native: Dani Báa }
  from: -499
  to: 750
  color: "#6fc8c8"
  summary: 오아하카 계곡 가운데 산 위에 사포텍 사람들이 세운 도읍과 그 정치 세력. 기원전 500년 무렵 계곡의 세 갈래가 만나는 산등성이를 깎아 도시를 세웠고, 기원전 100년 무렵부터 200년 무렵까지는 오아하카 고원 여러 곳을 아우르는 큰 정치 세력의 중심이 되어 북쪽의 테오티우아칸과도 오갔음. 후기 고전기 끝인 750년 무렵 계곡의 정치 중심 자리를 잃었고(문서에 따라 700년·850년·1000년으로도 봄), 그 뒤 900~1000년 무렵 대부분 버려짐
  mapNote: 지도에는 땅을 그리지 않음. 다스린 땅의 범위가 문서에 전하지 않아 사건의 주체로만 둠
  endNote: 750년 무렵 오아하카 계곡의 정치 중심 자리를 잃으며 끝났고, 도시는 그 뒤 대부분 버려짐
  features:
    - 오아하카 계곡 바닥에서 400미터 솟은 산등성이를 깎아 세운 도시
    - 메소아메리카에서 가장 이른 도시 가운데 하나
    - 천 년 가까이 사포텍 사람들의 정치·경제 중심
    - 돌판 부조와 이른 문자 기록을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Monte Albán"]
    foundingNote: 산등성이에 도시를 세운 기원전 500년 무렵부터
# 글은 MXN-M5 칸이 채움 — 위키 ko 표제(사전 아메리카 첫판 — avoid '테오티와칸'). 땅 없는 지역 항목(결정 9), 기원전 100년~650(결정 — 550 불탐·750 버려짐은 글)
- id: teotihuacan
  level: region
  names: { ko: 테오티우아칸, en: Teotihuacan, native: Teōtīhuacān }
  from: -99
  to: 650
  color: "#b16e5d"
  summary: 멕시코 분지 북동쪽에서 번성한 아메리카 고대의 큰 도시와 그 문명. 기원전 100년 무렵 세워져 250년 무렵까지 태양의 피라미드와 달의 피라미드, 죽은 자의 길을 지었고, 전성기에는 인구 10만 안팎으로 아메리카에서 가장 큰 도시였음. 흑요석 도구를 메소아메리카 곳곳에 내보냈고, 378년에는 마야 도시 티칼의 왕위 교체에 끼어들 만큼 멀리 힘이 미쳤음. 550년 무렵 중심부 건물이 약탈당하고 불탄 뒤 650년 무렵 쇠퇴해 끝났고, 750년 무렵 버려짐
  mapNote: 지도에는 땅을 그리지 않음. 도시의 힘이 미친 범위가 전하지 않고 제국이었는지도 학설이 갈려 사건의 주체로만 둠
  endNote: 550년 무렵 중심부가 불탄 뒤 650년 무렵 쇠퇴해 끝났고, 750년 무렵 도시가 버려짐
  features:
    - 지금 멕시코시티 북동쪽 40킬로미터, 멕시코 분지의 도시
    - 태양의 피라미드·달의 피라미드와 죽은 자의 길로 알려짐
    - 전성기 인구 10만 안팎으로 아메리카에서 가장 큰 도시
    - 흑요석 도구를 메소아메리카 곳곳에 내보냄
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Teotihuacan"]
    foundingNote: 도시가 세워진 기원전 100년 무렵부터
# 글은 MXN-M5 칸이 채움 — 위키 ko 표제(사전 아메리카 첫판 — avoid '올메크'). 국가가 아닌 고고 문화, 기원전 1200년~기원전 400년(G5-16)
- id: olmec-culture
  level: region
  names: { ko: 올멕, en: Olmecs }
  from: -1199
  to: -399
  color: "#5cbd51"
  summary: 멕시코만 남쪽 해안 저지대에서 꽃핀 메소아메리카의 이른 문명. 지금의 베라크루스주 남부와 타바스코주에서 기원전 1200년 무렵 산로렌소를 중심으로 일어났고, 기원전 10세기에 산로렌소가 기울자 라벤타로 중심을 옮겼음. 큰 돌머리 석상과 옥 공예를 남겼고, 공놀이 경기와 피 흘림 의식처럼 뒤의 메소아메리카 사회가 두루 이어받은 것을 처음 보였음. 기원전 400년 무렵 큰 중심지들이 버려지며 쇠퇴했고, 그 전통은 트레스사포테스의 에피올멕 문화와 이사파 같은 뒤 사회로 이어짐
  mapNote: 지도에는 땅을 그리지 않음. 하나의 나라가 아니라 여러 중심지가 나눈 문화라 경계로 묶을 수 없어 사건의 주체로만 둠
  endNote: 기원전 400년 무렵 라벤타 같은 큰 중심지들이 버려지고 해안 저지대 인구가 크게 줄며 끝남
  features:
    - 메소아메리카 문명의 요람 가운데 하나로 꼽힘
    - 큰 돌머리 석상으로 알려짐
    - 중심지가 산로렌소에서 라벤타로 옮겨 감
    - 공놀이 경기와 피 흘림 의식을 뒤 사회가 이어받음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Olmecs", "위키백과 올멕"]
    foundingNote: 산로렌소가 중심지로 자란 기원전 1200년 무렵부터
# 글은 MXN-M5 칸이 채움 — 가칭(위키 ko 표제 없음 — 사전 M5 공통, avoid '파버티포인트'·'포벌티 포인트'). 국가가 아닌 고고 문화, 기원전 1700년~기원전 1100년(G5-18)
- id: poverty-point-culture
  level: region
  names: { ko: 포버티 포인트 문화, en: Poverty Point culture }
  from: -1699
  to: -1099
  color: "#79be80"
  summary: 미시시피강 하류 루이지애나 북동부에 큰 흙 둑 유적을 남긴 고고 문화. 북아메리카 후기 아르카익 시대인 기원전 1700년 무렵부터 기원전 1100년 무렵까지 수렵채집 사람들이 동심 반원 꼴로 겹친 흙 둑과 큰 흙 둔덕을 쌓았음. 이 시대 북아메리카에서 가장 크고 짜임이 복잡한 흙 쌓기 유적이며, 멀리서 들여온 돌과 구리가 모인 교역의 중심이었음. 기원전 1100년 무렵 흙 둑 쌓기가 그치며 쇠퇴했고, 이 땅은 우드랜드 시대로 넘어감
  mapNote: 지도에는 땅을 그리지 않음. 나라가 아닌 고고 문화라 다스린 땅의 경계가 없어 사건의 주체로만 둠
  endNote: 기원전 1100년 무렵 흙 둑 쌓기가 그치며 끝났고, 이 땅은 우드랜드 시대로 넘어감
  features:
    - 동심 반원 꼴로 겹친 흙 둑과 큰 흙 둔덕이 있음
    - 농사 없이 수렵채집으로 산 사람들이 쌓음
    - 멀리서 들여온 돌과 구리가 모인 교역 중심
    - 유네스코 세계유산으로 지정됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Poverty Point"]
    foundingNote: 흙 둑을 쌓기 시작한 기원전 1700년 무렵부터
# 글은 MXN-M5 칸이 채움 — 가칭(위키 ko 표제 없음). 국가가 아닌 고고 문화, 기원전 500년~100년(G5-18 — 사건 초안 '기원전 800년'은 3묶음이 옮김)
- id: adena-culture
  level: region
  names: { ko: 아데나 문화, en: Adena culture }
  from: -499
  to: 100
  color: "#9b634b"
  summary: 오하이오강 유역에서 무덤 둔덕을 쌓은 북아메리카 동부의 고고 문화. 우드랜드 시대 초기인 기원전 500년 무렵부터 100년 무렵까지 지금의 오하이오주를 중심으로 켄터키·웨스트버지니아·인디애나 둘레에 퍼진 여러 사회가 같은 장례와 의례를 나누었음. 이름 높은 사람을 묻은 자리 위에 흙을 거듭 쌓은 큰 원뿔꼴 둔덕을 남겼고, 웨스트버지니아의 그레이브크리크 마운드가 대표임. 100년 무렵 더 넓은 교류를 이룬 호프웰 문화로 이어지며 끝남
  mapNote: 지도에는 땅을 그리지 않음. 나라가 아닌 고고 문화라 다스린 땅의 경계가 없어 사건의 주체로만 둠
  endNote: 100년 무렵 오하이오강 유역의 장례 전통이 호프웰 문화로 이어지며 끝남
  features:
    - 오하이오주를 중심으로 둘레 여러 주에 퍼짐
    - 무덤 위에 흙을 거듭 쌓은 원뿔꼴 둔덕을 남김
    - 그레이브크리크 마운드가 대표 유적
    - 하나의 사회가 아니라 장례와 의례를 나눈 여러 사회
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Adena culture"]
    foundingNote: 오하이오강 유역에 무덤 둔덕 문화가 자리 잡은 기원전 500년 무렵부터
# 글은 MXN-M5 칸이 채움 — 가칭(위키 ko 표제 없음, en 'Hopewell tradition' — 교류권은 글). 국가가 아닌 고고 문화, 기원전 200년~500년(G5-18 — infobox 기원전 100년은 글에 병기)
- id: hopewell-culture
  level: region
  names: { ko: 호프웰 문화, en: Hopewell tradition }
  from: -199
  to: 500
  color: "#3f92a6"
  summary: 북아메리카 동부 강 유역의 여러 사회를 이은 교류권과 그 토루 문화. 우드랜드 시대 중기인 기원전 200년 무렵부터 500년 무렵까지(문서에 따라 기원전 100년부터) 오하이오주와 일리노이주를 중심으로 강가 마을들이 같은 의례와 교역망을 나누었음. 하나의 사회가 아니라 온타리오호 북쪽 기슭에서 플로리다까지 이어진 교역로로 묶인 여러 집단이었고, 멀리서 들여온 흑요석·구리·조개로 공예품을 만들었음. 칠리코시 둘레의 무덤 둔덕과 뉴어크 토루 같은 기하학 꼴 흙 울타리를 남겼고, 500년 무렵 교역망이 줄며 쇠퇴함
  mapNote: 지도에는 땅을 그리지 않음. 하나의 나라가 아니라 교역으로 이어진 여러 사회라 경계로 묶을 수 없어 사건의 주체로만 둠
  endNote: 500년 무렵 먼 곳을 잇던 교역망과 큰 토루 쌓기가 줄며 끝남
  features:
    - 오하이오주·일리노이주 강 유역이 중심
    - 온타리오호에서 플로리다까지 이어진 교역망
    - 흑요석·구리·조개 같은 먼 곳 물자로 공예품을 만듦
    - 뉴어크 토루 같은 기하학 꼴 흙 울타리를 쌓음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Hopewell tradition"]
    foundingNote: 오하이오·일리노이 강 유역에 교류권이 자리 잡은 기원전 200년 무렵부터

