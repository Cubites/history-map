# middle-east medieval 나라 (시대 파일 scripts/geo/areas/middle-east/medieval.mjs의 짝 항목 파일)
# 시대·범위: 632~1452: 칼리프 시대, 이란·이집트 왕조, 십자군 국가, 몽골과 일 칸국, 마그레브 왕조
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-medieval').
# 632년 전에 시작한 나라는 from을 실제 해로 적고 도형은 632년부터. 1000년 넘어 이어지는 나라는 to를 실제 끝 해로 적고 도형은 999년까지(1000년부터는 A3b가 이어 붙임).
# startEvents·endEvents는 사건 묶음 me-02~05가 채운다.

# ── 서아시아·북아프리카 A3a-1 (2026-10-30): 레반트·이라크·아라비아·이란 632~999 ──
- id: rashidun-caliphate
  level: polity
  names: { ko: 정통 칼리프국, en: Rashidun Caliphate, native: الخلافة الراشدة }
  from: 632
  to: 661
  color: "#7fae4e"
  summary: 무함마드가 죽은 뒤 아부 바크르·우마르·우스만·알리 네 칼리프가 메디나와 쿠파에서 다스린 첫 칼리프국. 리다 전쟁으로 아라비아를 하나로 묶고 동로마의 시리아와 사산 제국을 정복함
  mapNote: 지도에는 632년부터 660년까지 표시. 632년 아라비아 정주 지대(내륙 사막은 비움), 637년 레반트·이라크, 639년 시리아 자지라, 642년 후제스탄·지발·이라크 북부와 이집트·키레나이카 해안, 644년 아제르바이잔, 647년 트리폴리타니아 해안, 650년 파르스, 651년 케르만·시스탄·호라산을 더함. 656~661년 내전 동안 무아위야가 쥔 시리아는 나누지 않음
  endNote: 661년 알리가 쿠파에서 암살되고 아들 하산이 물러나 무아위야의 우마이야 칼리프국이 섬
  features:
    - 도읍은 메디나, 656년부터 쿠파
    - 636년 야르무크 전투와 카디시야 전투에서 동로마·사산 군대를 이김
    - 우마르 때 군영 도시 바스라·쿠파를 세움
    - 우스만 때 쿠란을 한 책으로 엮음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "발라두리, 『여러 나라의 정복』"]
    foundingNote: 632년 6월 무함마드가 죽고 아부 바크르가 첫 칼리프로 뽑힌 때부터

- id: sasanian-empire
  level: polity
  names: { ko: 사산 제국, en: Sasanian Empire, native: ایرانشهر }
  from: 224
  to: 651
  color: "#b5523b"
  summary: 아르다시르 1세가 파르티아를 무너뜨리고 세운 페르시아 제국. 크테시폰을 도읍으로 이라크와 이란 고원을 다스렸으나 628년 뒤 내분으로 약해져 아랍 정복을 막지 못함
  mapNote: 지도에는 632년부터 650년까지 표시. 632년 이라크와 이란 고원, 637년 이라크를 잃음, 642년 후제스탄·지발과 카스피해 쪽(다부이 왕조)을 잃음, 644년 아제르바이잔, 650년 파르스를 잃음. 발루치스탄은 비움
  endNote: 651년 야즈데게르드 3세가 메르브 가까이에서 죽어 제국이 끝남
  features:
    - 도읍은 크테시폰
    - 조로아스터교를 국교로 받듦
    - 602~628년 동로마와 마지막 큰 전쟁을 치름
    - 636년 카디시야, 642년 니하반드에서 아랍군에 짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "낙시 로스탐의 샤푸르 1세 비문"]
    foundingNote: 아르다시르 1세가 파르티아 왕 아르타바누스 4세를 이긴 224년부터

- id: dabuyid-dynasty
  level: polity
  names: { ko: 다부이 왕조, en: Dabuyid dynasty, native: دابویگان }
  from: 642
  to: 760
  color: "#b8a8d0"
  summary: 사산 제국이 무너진 뒤 길 가브바라 가문이 카스피해 남쪽 길란·타바리스탄을 다스린 왕조. 이스파바드 칭호를 이어 쓰며 우마이야에 조공하고 자립을 지킴
  mapNote: 지도에는 642년부터 759년까지 길란·마잔다란·골레스탄 땅으로 표시. 716년 우마이야의 고르간 침공 뒤 바뀐 땅은 나누지 않음
  endNote: 760년 아바스 칼리프국 군대가 타바리스탄을 정복하고 마지막 이스파바드 쿠르시드가 죽음
  features:
    - 도읍은 길란의 푸만
    - 716년 야지드 이븐 알무할라브의 침공을 파루칸이 막아 냄
    - 바반드·카린 가문 같은 산지 영주들을 거느림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』"]
    foundingNote: 니하반드 전투 뒤 길 가브바라가 길란·다일람을 차지한 642년 무렵부터

- id: abbasid-caliphate
  level: polity
  names: { ko: 아바스 칼리프국, en: Abbasid Caliphate, native: الخلافة العباسية }
  from: 750
  to: 1258
  color: "#3a3a44"
  summary: 무함마드의 숙부 아바스의 후손이 우마이야를 무너뜨리고 세운 칼리프국. 바그다드를 세워 이슬람 세계의 중심으로 삼았으나 9세기부터 지방 왕조가 갈라져 나가고 945년 부와이 왕조에 실권을 빼앗김
  mapNote: 지도에는 750년부터 944년까지와 1152년부터 직접 다스린 땅을 표시. 이집트·키레나이카 해안은 750~867년과 905~934년, 이프리키야는 762~799년 그림. 지방 왕조(타히르·사파르·사만·툴룬 등)의 땅은 그 왕조로 그림. 945~1151년 칼리프는 부와이 왕조와 셀주크 아래 이름만 남아 땅이 없음. 1152년 알무크타피가 바그다드·와시트·힐라 둘레 등 이라크 중부를 되찾고 1194년 바스라 쪽, 1232년 아르빌을 더해 1257년까지 그림
  endNote: 1258년 훌라구의 몽골군이 바그다드를 함락하고 칼리프 알무스타심을 죽여 바그다드의 칼리프국이 끝남
  features:
    - 도읍은 쿠파·안바르, 762년부터 바그다드, 836~892년 사마라
    - 하룬 알라시드와 알마문 때 '지혜의 집'에서 그리스 학문을 아랍어로 옮김
    - 861년 뒤 투르크 군인들이 칼리프를 갈아치우는 혼란을 겪음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "야쿠비, 『여러 나라의 책』"]
    foundingNote: 750년 1월 자브 전투에서 우마이야 군을 이기고 아부 알아바스 앗사파흐가 칼리프에 오른 때부터

- id: tahirid-dynasty
  level: polity
  names: { ko: 타히르 왕조, en: Tahirid dynasty, native: طاهریان }
  from: 821
  to: 873
  color: "#c9a14a"
  summary: 알마문의 장군 타히르 이븐 후사인의 가문이 대를 이어 호라산을 다스린 왕조. 아바스 칼리프를 받들면서 바그다드 경찰장 자리도 맡음
  mapNote: 지도에는 821년부터 872년까지 지금 이란의 호라산·셈난(쿠미스) 땅만 표시. 메르브·헤라트 등 중앙아시아·아프가니스탄 쪽은 그리지 않음
  endNote: 873년 사파르 왕조의 야쿠브 이븐 알라이스가 니샤푸르를 차지해 타히르 왕조가 끝남
  features:
    - 도읍은 메르브, 뒤에 니샤푸르
    - 아바스 칼리프의 총독으로서 칼리프 이름으로 금요 예배를 올림
    - 압둘라 이븐 타히르 때 농민을 보호하는 정책으로 이름남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["가르디지, 『자인 알아흐바르』"]
    foundingNote: 칼리프 알마문이 타히르 이븐 후사인을 호라산 총독으로 임명한 821년부터

- id: dulafid-dynasty
  level: polity
  names: { ko: 둘라프 왕조, en: Dulafid dynasty, native: دلفیان }
  from: 861
  to: 896
  color: "#a87a9a"
  summary: 아부 둘라프 가문이 이란 서부 지발의 카라지와 이스파한을 대를 이어 다스린 왕조. 사마라의 혼란 동안 사실상 자립했으나 아바스 칼리프를 받듦
  mapNote: 지도에는 861년부터 895년까지 이스파한·마르카지·곰 둘레로 표시. 884년 무렵 파르스·케르만을 맡았던 일은 사파르 왕조가 실제로 다스려 칠하지 않음
  endNote: 896년 칼리프 알무타디드가 둘라프 가문의 땅을 거두어 아바스 직할로 돌림
  features:
    - 도읍은 카라지
    - 9세기 초 아부 둘라프가 칼리프에게서 영지를 받아 가문의 기반을 닦음
    - 아부 둘라프는 시인·학자로도 이름남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 사마라의 혼란(861) 뒤 카라지 둘레를 대를 이어 다스리며 사실상 자립한 때부터

- id: saffarid-dynasty
  level: polity
  names: { ko: 사파르 왕조, en: Saffarid dynasty, native: صفاریان }
  from: 861
  to: 1003
  color: "#d46a4a"
  summary: 구리 장인(사파르) 출신 야쿠브 이븐 알라이스가 시스탄에서 세운 왕조. 파르스·케르만·호라산까지 넓혔으나 900년 사만 왕조에 지고 시스탄으로 줄어듦
  mapNote: 지도에는 861년부터 999년까지 지금 이란 땅만 표시. 시스탄(북위 29° 북쪽), 867년 케르만, 870년 파르스, 873년 호라산을 더하고, 900년 호라산, 908년 파르스·케르만을 잃음. 912~922년 시스탄은 사만 왕조 땅으로 그림. 도읍 자란즈는 지금 아프가니스탄이라 그리지 않음
  endNote: 1003년 가즈니 왕조의 마흐무드가 시스탄을 차지하고 마지막 군주 칼라프 이븐 아흐마드를 폐위함
  features:
    - 도읍은 자란즈, 870~908년 파르스의 시라즈도 함께 씀
    - 876년 바그다드로 진군했으나 다이르 알아쿨에서 칼리프 군에 짐
    - 페르시아어 궁정 시를 처음 후원한 왕조로 꼽힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『타리히 시스탄』(시스탄사)"]
    foundingNote: 야쿠브 이븐 알라이스가 시스탄의 아미르가 된 861년부터

- id: alid-tabaristan
  level: polity
  names: { ko: 타바리스탄 알리 가문 토후국, en: Alid emirate of Tabaristan, native: علویان طبرستان }
  from: 864
  to: 928
  color: "#6aa86a"
  summary: 무함마드의 사위 알리의 후손인 자이드파 이맘들이 카스피해 남쪽 타바리스탄·길란을 다스린 나라. 타히르 왕조에 맞선 봉기로 섰고 다일람 사람들을 이슬람으로 이끔
  mapNote: 지도에는 864년부터 899년까지와 914년부터 927년까지 길란·마잔다란·골레스탄으로 표시. 900~913년은 사만 왕조가 타바리스탄을 차지한 때라 길란은 비움
  endNote: 928년 사만 왕조가 타바리스탄을 다시 차지하고 알리 가문의 통치가 끝남
  features:
    - 도읍은 아물
    - 864년 하산 이븐 자이드가 타히르 총독에 맞서 봉기함
    - 914년 하산 알우트루시가 다일람·길란 사람들을 모아 다시 일으킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』"]
    foundingNote: 하산 이븐 자이드가 아물에서 이맘으로 추대된 864년부터

- id: sajid-dynasty
  level: polity
  names: { ko: 사지 왕조, en: Sajid dynasty, native: ساجیان }
  from: 889
  to: 929
  color: "#8a7ac0"
  summary: 아바스 칼리프가 보낸 장수 무함마드 이븐 아비 앗사지의 가문이 아제르바이잔을 대를 이어 다스린 왕조. 칼리프에게 조공하며 아르메니아까지 세력을 뻗침
  mapNote: 지도에는 901년부터 928년까지 지금 이란의 아제르바이잔·잔잔으로 표시. 889~900년 마라가 둘레 총독 시절과 아르메니아·아란 등 캅카스 쪽은 그리지 않음
  endNote: 929년 마지막 군주 파트 이븐 무함마드가 아르다빌에서 독살되고 왕조가 끝남
  features:
    - 도읍은 마라가, 901년부터 아르다빌
    - 유수프 이븐 아비 앗사지가 아르메니아의 바그라투니 왕국과 싸움
    - 912년 칼리프에게 바치던 조공을 끊음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 무함마드 이븐 아비 앗사지가 아제르바이잔 총독이 된 889년 무렵부터

- id: samanid-empire
  level: polity
  names: { ko: 사만 왕조, en: Samanid Empire, native: سامانیان }
  from: 819
  to: 999
  color: "#4f8fbf"
  summary: 부하라를 도읍으로 중앙아시아와 호라산을 다스린 페르시아계 왕조. 아바스 칼리프를 받들면서 페르시아어 문예를 꽃피움
  mapNote: 지도에는 900년부터 999년까지 지금 이란 땅 안쪽만 표시(호라산, 900~913년·928~930년 타바리스탄, 912~922년 시스탄). 도읍 부하라 등 중앙아시아 쪽은 그리지 않음
  endNote: 999년 카라한 왕조가 부하라를 차지하고 가즈니 왕조가 호라산을 가져가 사만 왕조가 무너짐
  features:
    - 도읍은 부하라
    - 900년 이스마일 이븐 아흐마드가 발흐에서 사파르 왕조의 아므르를 사로잡음
    - 시인 루다키와 학자 이븐 시나가 이 왕조의 궁정에서 활동함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나르샤히, 『부하라사』"]
    foundingNote: 사만 가문의 네 형제가 칼리프 알마문에게서 사마르칸트·페르가나 등을 맡은 819년 무렵부터

- id: ilyasid-dynasty
  level: polity
  names: { ko: 일리아스 왕조, en: Ilyasid dynasty, native: الیاسیان }
  from: 932
  to: 968
  color: "#c7b07a"
  summary: 사만 왕조의 장수 무함마드 이븐 일리아스가 케르만에 세운 왕조. 사만·부와이 사이에서 자립을 지킴
  mapNote: 지도에는 932년부터 967년까지 지금 이란의 케르만·호르모즈간 주로 표시. 남쪽 산지의 쿠프스·발루치 부족 땅을 나누지 않은 어림
  endNote: 968년 부와이 왕조의 아두드 앗다울라가 도읍 바르다시르를 차지해 왕조가 끝남
  features:
    - 도읍은 바르다시르(지금의 케르만 시)
    - 무함마드 이븐 일리아스가 30여 년 다스림
    - 사만 왕조와 부와이 왕조 사이에서 자립을 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 무함마드 이븐 일리아스가 케르만을 차지한 932년부터

- id: ziyarid-dynasty
  level: polity
  names: { ko: 지야르 왕조, en: Ziyarid dynasty, native: زیاریان }
  from: 931
  to: 1090
  color: "#7ac0b0"
  summary: 길란 출신 마르다비즈 이븐 지야르가 세운 왕조. 한때 이란 서·중부를 차지했으나 곧 부와이에 밀려 카스피해 남쪽 고르간·타바리스탄을 다스림
  mapNote: 지도에는 931년부터 1089년까지 표시(980~997년은 부와이 왕조 땅). 931년 타바리스탄·고르간·쿠미스와 라이·하마단·이스파한, 935년 이스파한·하마단을 잃음, 943년 라이를 잃음. 1040년 쿠미스를 셀주크에 내주고 마잔다란·고르간만 남음
  endNote: 1090년 마지막 군주 길란샤가 죽고 니자르 이스마일파가 땅을 차지함
  features:
    - 도읍은 이스파한, 935년부터 라이, 943년부터 고르간
    - 카부스 이븐 부시무르기르는 학자이자 시인으로 이름남
    - 980년 카부스가 부와이에 쫓겨났다가 998년 돌아옴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』", "카부스 나마"]
    foundingNote: 마르다비즈 이븐 지야르가 타바리스탄·고르간을 차지하고 자립한 931년부터

- id: buyid-dynasty
  level: polity
  names: { ko: 부와이 왕조, en: Buyid dynasty, native: آل بویه }
  from: 934
  to: 1062
  color: "#9a4f6f"
  summary: 다일람 출신 부야의 세 아들이 세운 시아파 왕조. 945년 바그다드에 들어가 아바스 칼리프를 허수아비로 두고 이라크와 이란 서·남부를 다스림
  mapNote: 지도에는 934년부터 1061년까지 표시. 934년 파르스, 935년 후제스탄·이스파한·하마단, 943년 라이, 945년 이라크, 967년 오만, 968년 케르만, 979년 모술, 980년 타바리스탄을 더함. 1000년부터 오만·호르모즈간·쿠웨이트는 비우고, 1008년 이스파한, 1012년 힐라 둘레, 1023년 하마단, 1029년 라이, 1041년 케르만, 1051년 코르데스탄, 1055년 이라크·후제스탄을 잃어 1061년까지 파르스만 남음. 983년 뒤 형제 가문으로 갈라진 지방 정권도 한 나라로 그림
  endNote: 1055년 셀주크의 투그릴이 바그다드를 차지했고 1062년 마지막 파르스 정권이 무너짐
  features:
    - 도읍은 시라즈·라이·바그다드(형제가 나누어 다스림)
    - 칼리프에게서 '앗다울라' 칭호를 받고 대아미르로 실권을 쥠
    - 아두드 앗다울라 때 가장 넓어져 '샤한샤' 칭호를 씀
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["미스카와이흐, 『여러 민족의 경험』"]
    foundingNote: 알리 이븐 부야가 파르스를 차지하고 시라즈를 도읍으로 삼은 934년부터

- id: sallarid-dynasty
  level: polity
  names: { ko: 살라르 왕조, en: Sallarid dynasty, native: سالاریان }
  from: 919
  to: 1062
  color: "#4f7fc0"
  summary: 다일람의 무사피르 가문이 타롬에서 일어나 아제르바이잔을 다스린 왕조. 부와이 왕조와 혼인으로 이어짐
  mapNote: 지도에는 941년부터 1061년까지 표시. 941년 아제르바이잔·잔잔, 984년 아제르바이잔을 라와드 왕조에 잃고 잔잔(타롬)만 남음. 아란·아르메니아 등 캅카스 쪽은 그리지 않음
  endNote: 1062년 무렵 셀주크의 투그릴에게 타롬이 넘어가 왕조가 끝남
  features:
    - 도읍은 타롬의 사미란 성
    - 941년 마르주반 이븐 무함마드가 다이삼에게서 아제르바이잔을 빼앗음
    - 마르주반은 948년 부와이 왕조와 싸우다 사로잡힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["미스카와이흐, 『여러 민족의 경험』"]
    foundingNote: 무함마드 이븐 무사피르가 타롬 둘레에서 자립한 919년 무렵부터

- id: rawadid-dynasty
  level: polity
  names: { ko: 라와드 왕조, en: Rawadid dynasty, native: روادیان }
  from: 955
  to: 1054
  color: "#c8a0d8"
  summary: 아랍계 라와드 가문이 쿠르드화하여 타브리즈를 중심으로 아제르바이잔을 다스린 왕조
  mapNote: 지도에는 984년부터 1053년까지 동아제르바이잔·아르다빌 주로 표시. 서아제르바이잔은 비움
  endNote: 1054년 셀주크의 투그릴이 아제르바이잔에 들어와 와흐수단의 항복을 받음
  features:
    - 도읍은 타브리즈
    - 984년 무렵 살라르 왕조의 아제르바이잔 땅을 차지함
    - 아랍계 가문이 쿠르드 사회에 섞여 쿠르드 왕조가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 라와드 가문이 타브리즈 둘레의 영주로 자리 잡은 955년 무렵부터

- id: hasanwayhid-dynasty
  level: polity
  names: { ko: 하산와이 왕조, en: Hasanwayhid dynasty, native: حسنویه }
  from: 959
  to: 1015
  color: "#d8c070"
  summary: 쿠르드인 하산와이 이븐 후사인이 이란 서부 자그로스 산지에 세운 왕조. 부와이 왕조에 공납하며 자치를 누림
  mapNote: 지도에는 959년부터 1014년까지 케르만샤·로레스탄 주로 표시. 훌완·샤흐리조르를 가졌던 때는 나누지 않음
  endNote: 1014년 바드르 이븐 하산와이가 죽고 1015년 안나즈 왕조가 자발 서부를 차지함
  features:
    - 도읍은 디나바르
    - 바드르 이븐 하산와이가 1000년 무렵까지 30여 년 다스림
    - 부와이 왕조에 공납을 바치며 자그로스 산지의 자치를 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 하산와이 이븐 후사인이 디나바르 둘레의 쿠르드 부족을 이끌고 자립한 959년부터

- id: hamdanid-dynasty
  level: polity
  names: { ko: 함단 왕조, en: Hamdanid dynasty, native: الحمدانيون }
  from: 890
  to: 1004
  color: "#d09060"
  summary: 아랍 타글리브 부족의 함단 가문이 모술과 알레포에 세운 두 갈래 왕조. 알레포의 사이프 앗다울라가 동로마와 싸우며 시인 무타납비를 후원함
  mapNote: 지도에는 929년부터 1003년까지 표시. 929년 모술 둘레와 자지라, 944년 알레포·홈스 북쪽·시리아 해안, 979년 모술 쪽을 부와이 왕조에 잃음. 1000년부터는 알레포·이들리브만 그림. 969년 뒤 알레포가 동로마에 조공한 것은 따로 그리지 않음
  endNote: 1004년 알레포의 마지막 함단 군주가 폐위되고 가신 루울루 가문이 정권을 쥠
  features:
    - 도읍은 모술과 알레포
    - 사이프 앗다울라가 945~967년 알레포를 다스리며 동로마와 해마다 싸움
    - 962년 동로마의 니케포로스 포카스가 알레포를 약탈함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무타납비의 사이프 앗다울라 찬가", "이븐 알아디무, 『알레포사』"]
    # 작업 메모: 항목은 함단 이븐 함둔의 봉기(890), 도형은 나시르 앗다울라의 모술 총독(929)부터
    foundingNote: 함단 이븐 함둔이 모술 둘레에서 세력을 이룬 890년부터

- id: uqaylid-dynasty
  level: polity
  names: { ko: 우카일 왕조, en: Uqaylid dynasty, native: العقيليون }
  from: 990
  to: 1096
  color: "#7a8a9a"
  summary: 아랍 우카일 부족이 모술을 도읍으로 자지라와 이라크 북부를 다스린 시아파 왕조
  mapNote: 지도에는 990년부터 1095년까지 모술·두호크와 시리아 하사카·데이르에조르로 표시하고, 1080~1085년 알레포·이들리브를 더함
  endNote: 1096년 셀주크 장수 케르보가가 모술을 차지해 왕조가 끝남
  features:
    - 도읍은 모술
    - 996년 알무칼라드가 부와이 총독을 몰아내고 모술을 손에 넣음
    - 시아파를 받든 아랍 부족 왕조
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 무함마드 이븐 알무사이야브가 디야르 라비아를 차지하고 모술을 도읍으로 삼은 990년 무렵부터

- id: qarmatian-state
  level: polity
  names: { ko: 카르마트 국가, en: Qarmatian state, native: القرامطة }
  from: 899
  to: 1077
  color: "#e0a0a0"
  summary: 이스마일파에서 갈라진 카르마트파가 아라비아 동부 바레인 지방에 세운 나라. 930년 메카를 약탈하고 검은 돌을 가져가 이슬람 세계를 흔듦
  mapNote: 지도에는 899년부터 1076년까지 알하사 오아시스와 카티프 해안으로 표시. 바레인섬·카타르와 오만 해안(931~934년)은 칠하지 않음
  endNote: 1077년 아랍 부족장 압둘라 알우윤이 셀주크의 도움으로 카르마트를 무너뜨림
  features:
    - 도읍은 알아사(지금의 알후푸프)
    - 930년 메카를 약탈해 검은 돌을 가져갔다가 951년 돌려줌
    - 지도자 회의가 다스리는 공동체 체제로 알려짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나시르 후스라우, 『여행기』"]
    foundingNote: 아부 사이드 알잔나비가 바레인 지방을 차지한 899년부터

- id: ziyadid-dynasty
  level: polity
  names: { ko: 지야드 왕조, en: Ziyadid dynasty, native: بنو زياد }
  from: 819
  to: 1018
  color: "#5fa0d0"
  summary: 칼리프 알마문이 보낸 무함마드 이븐 지야드가 예멘의 홍해 쪽 티하마에 세운 왕조. 자비드를 도읍으로 아바스 칼리프를 받듦
  mapNote: 지도에는 819년부터 1018년까지 티하마·지잔과 아덴·라헤즈·타이즈·아비얀 해안으로 표시. 하드라마우트까지 다스렸다는 기록은 근거가 약해 칠하지 않음
  endNote: 1018년 노예 출신 재상 나자흐 가문에게 실권이 넘어가 왕조가 끝남
  features:
    - 도읍은 자비드
    - 981년 뒤 노예 출신 재상들이 실권을 쥠
    - 아바스 칼리프를 명목상 받듦
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 무함마드 이븐 지야드가 티하마를 평정하고 자비드를 세운 819년부터

- id: yufirid-dynasty
  level: polity
  names: { ko: 유피르 왕조, en: Yufirid dynasty, native: اليعفريون }
  from: 847
  to: 997
  color: "#c0a050"
  summary: 힘야르 계통 유피르 가문이 예멘 고지의 사나를 다스린 왕조. 아바스 칼리프를 받듦
  mapNote: 지도에는 847년부터 996년까지 사나·다마르·이브 둘레 고지로 표시. 사다·암란은 896년까지만 칠함. 904~916년 카르마트의 사나 점령은 칠하지 않음
  endNote: 997년 무렵 가문의 다툼 끝에 유피르 왕조의 권위가 사라짐
  features:
    - 도읍은 샤밤 카우카반, 뒤에 사나
    - 916년 카르마트에게서 사나를 되찾음
    - 힘야르 계통 가문으로 아바스 칼리프를 받듦
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["함다니, 『이클릴』"]
    foundingNote: 유피르 이븐 아브드 앗라흐만이 사나를 차지한 847년부터

- id: zaydi-imamate
  level: polity
  names: { ko: 자이드파 이맘국 (사다), en: Zaydi Imamate of Sa'dah, native: الإمامة الزيدية }
  from: 897
  to: 1597
  color: "#6a9a80"
  summary: 알리의 후손 알하디 야흐야가 예멘 북부 사다에 세운 자이드파 이맘국. 부족들의 지지로 이맘이 대를 이어 섬
  mapNote: 지도에는 897년부터 1452년까지 사다·암란 주로 표시. 1198~1217년 이맘 압둘라 이븐 함자의 사나·다마르 점령과 1324년 뒤 사나를 둘러싼 다툼은 되풀이해 바뀌어 칠하지 않음
  endNote: 1597년 카심 이븐 무함마드가 이맘을 칭해 카심 왕조의 이맘국이 이어받음
  features:
    - 도읍은 사다
    - 897년 알하디 야흐야 이븐 알후사인이 사다에 들어와 이맘이 됨
    - 이맘은 학식과 혈통을 갖춘 알리의 후손 가운데서 섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『알하디 야흐야 전기』"]
    foundingNote: 알하디 야흐야가 사다 부족들의 초청으로 이맘이 된 897년부터

- id: ibadi-imamate-of-oman
  level: polity
  names: { ko: 오만 이바드 이맘국, en: Ibadi Imamate of Oman, native: إمامة عُمان الإباضية }
  from: 793
  to: 1164
  color: "#e8a8c8"
  summary: 이바드파 이맘이 오만 내륙의 니즈와를 중심으로 다스린 8~12세기의 이맘국. 793년 아바스 칼리프의 총독 지배에서 벗어나 둘째 이맘국을 세웠고, 893년 아바스 장수 무함마드 이븐 누르에게 정복되었다가 897년 셋째 이맘국으로 되살아남. 931~934년에는 카르마트가 오만을 지배함
  mapNote: 지도에는 793년부터 892년까지와 897년부터 944년까지 오만 내륙·바티나·무스카트와 아랍에미리트 땅으로, 넷째 이맘국은 1016년부터 1153년까지 내륙 다힐리야·자히라로 표시. 893년부터 896년까지는 아바스 칼리프국 땅으로 그리고, 931~934년 카르마트의 지배는 그리지 않음. 1154년부터 내륙은 나브하니 왕조 땅으로 그림. 1920년부터의 근대 이맘국은 따로 항목
  endNote: 1154년 무렵 나브하니 가문이 오만 내륙을 쥐고 넷째 이맘국은 1164년 무렵 끊김(940년대 셋째 이맘국이 무너진 뒤 1016년 다시 섬)
  features:
    - 도읍은 니즈와
    - 이맘국에 앞서 752~793년 줄란다 가문이 아바스 칼리프의 총독으로 다스림
    - 893년 아바스 장수 무함마드 이븐 누르의 정복으로 둘째 이맘국이 끊김
    - 931~934년 걸프의 카르마트가 오만을 지배함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["살릴 이븐 라지크, 『오만 이맘과 사이드들의 역사』"]
    # 작업 메모: A3a 반영에서 A1 근대 이맘국(oman-imamate, 1920~1959)과 따로 둔 항목. 넷째 이맘국(1016~1164, 위키 Imamate of Oman)은 A3b-3이 같은 id로 이음. 셋째 이맘국 끝 945는 'Third Imamate (897–940s)'의 어림
    foundingNote: 이바드파가 둘째 이맘국을 세운 793년부터. 749~751년의 첫 이맘국은 넣지 않음

# ── 서아시아·북아프리카 A3a-2 (2026-10-30): 이집트·리비아·마그레브 632~999 (이집트 왕조의 시리아·히자즈 땅 포함) ──
- id: fihrid-emirate
  level: polity
  names: { ko: 피흐르 토후국, en: Fihrid Emirate, native: الفهريون }
  from: 745
  to: 757
  color: "#a0784a"
  summary: 정복자 우크바 이븐 나피의 후손 압드 알라흐만 이븐 하비브 알피흐리가 카이라완에서 세운 이프리키야의 토후국. 우마이야 칼리프국이 흔들리는 틈에 자립해 750년 뒤 아바스 칼리프국을 받들지 않았으나 집안 다툼과 카리지파 베르베르의 봉기로 무너짐
  mapNote: 지도에는 745년부터 756년까지 튀니지·알제리 동부·트리폴리타니아 해안을 표시
  endNote: 757년 카리지파 베르베르가 카이라완을 차지해 피흐르 가문의 통치가 끝남
  features:
    - 도읍은 카이라완
    - 이프리키야를 정복한 우크바 이븐 나피의 집안
    - 750년 뒤 아바스 칼리프국의 권위를 받아들이지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 압드 알하캄, 『이집트와 마그리브 정복사』", "이븐 이다리, 『알바얀 알무그리브』"]
    foundingNote: 745년 압드 알라흐만 이븐 하비브가 카이라완에서 우마이야 총독을 몰아내고 자립한 때부터

- id: aghlabid-dynasty
  level: polity
  names: { ko: 아글라브 왕조, en: Aghlabid dynasty, native: الأغالبة }
  from: 800
  to: 909
  color: "#c08a3e"
  summary: 아바스 칼리프 하룬 알라시드가 이브라힘 이븐 알아글라브를 세습 아미르로 삼아 이프리키야를 맡긴 아랍 왕조. 칼리프를 명목으로 받들며 카이라완을 중심으로 시칠리아를 정복했으나 쿠타마 베르베르를 이끈 이스마일파 운동에 무너짐
  mapNote: 지도에는 800년부터 908년까지 튀니지·알제리 동부·트리폴리타니아 해안을 표시. 827년부터 정복한 시칠리아·몰타는 시칠리아 토후국으로 그림
  endNote: 909년 아부 압둘라 알시이가 이끈 쿠타마 군에게 라카다를 잃고 마지막 아미르 지야다트 알라흐 3세가 동쪽으로 달아나 왕조가 끝남
  features:
    - 도읍은 카이라완, 궁성은 아바시야(800~876)와 라카다(876~)
    - 827년부터 시칠리아를 정복함
    - 카이라완 대모스크를 다시 짓고 해안에 요새(리바트)를 둠
    - 902~907년 쿠타마 베르베르에게 밀라·세티프·바가야를 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이다리, 『알바얀 알무그리브』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 800년 하룬 알라시드가 이브라힘 1세 이븐 알아글라브를 이프리키야의 세습 아미르로 임명한 때부터

- id: rustamid-imamate
  level: polity
  names: { ko: 루스탐 이맘국, en: Rustamid Imamate, native: الدولة الرستمية }
  from: 777
  to: 909
  color: "#6a8fb8"
  summary: 페르시아계 압드 알라흐만 이븐 루스탐이 타헤르트(지금 알제리 티아렛)에서 이맘으로 뽑혀 세운 이바드파 이맘국. 마그레브 중부의 베르베르 부족과 사하라 대상 무역을 묶었으나 9세기 말 타헤르트 둘레로 줄어들고 파티마 칼리프국에 무너짐
  mapNote: 지도에는 777년부터 908년까지 표시. 884년까지 타헤르트 둘레와 셸리프·고원 지대(티아렛·사이다·마스카라·렐리잔·젤파·라구아트), 885년부터 타헤르트 둘레만 그림. 자발 나푸사·남튀니지 이바드파에 미친 종교 권위는 땅으로 그리지 않음
  endNote: 909년 파티마 군이 타헤르트를 차지해 이맘국이 끝나고 이바드파 공동체는 우아르글라 쪽으로 옮겨 감
  features:
    - 도읍은 타헤르트
    - 공동체가 이맘을 뽑는 이바드파 원칙을 따름
    - 사하라 남쪽과 잇는 대상 무역으로 번영함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 사기르, 『루스탐 이맘들의 연대기』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 777년 무렵 압드 알라흐만 이븐 루스탐이 타헤르트에서 이맘으로 뽑힌 때부터(타헤르트 건설은 761년 무렵)

- id: idrisid-dynasty
  level: polity
  names: { ko: 이드리스 왕조, en: Idrisid dynasty, native: الأدارسة }
  from: 788
  to: 974
  color: "#b85a5a"
  summary: 예언자 무함마드의 후손 이드리스 1세가 아바스의 박해를 피해 와 베르베르 아우라바족의 지지로 모로코 북부에 세운 왕조. 페스를 세워 모로코 이슬람화의 중심으로 삼았으나 형제들 사이에 땅이 나뉘고 파티마·코르도바 사이에서 약해짐
  mapNote: 지도에는 790년부터 973년까지 표시. 920년까지 탕헤르에서 오리엔탈까지의 모로코 북부와 틀렘센, 921년부터 리프(탕헤르·테투안과 타자·알호세이마)만 그림. 대서양 평야의 바르가와타와 타필랄트의 미드라르 왕조는 따로 그림
  endNote: 974년 코르도바 칼리프국의 장군 갈리브가 하산 2세를 항복시키고 이드리스 가문을 코르도바로 데려가 왕조가 끝남(985년 복귀 시도는 실패)
  features:
    - 도읍은 왈릴리(볼루빌리스), 809년부터 페스
    - 789년 무렵 이드리스 1세가 페스를 세우고 이드리스 2세가 넓힘
    - 828년 이드리스 2세가 죽은 뒤 아들들이 땅을 나누어 다스림
    - 917~921년 파티마의 원정 뒤 그 가신이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아비 자르, 『라우드 알키르타스』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 788년 이드리스 1세가 왈릴리에 자리 잡고 아우라바족의 이맘으로 추대된 때부터

- id: midrarid-dynasty
  level: polity
  names: { ko: 미드라르 왕조, en: Midrarid dynasty, native: بنو مدرار }
  from: 758
  to: 976
  color: "#8a6fb0"
  summary: 수프리파 카리지 베르베르(미크나사족)가 사하라 대상로의 북쪽 끝 시질마사에 세운 왕조. 금과 소금 무역으로 번영했으며 10세기에는 파티마 칼리프국을 받들었음
  mapNote: 지도에는 758년부터 975년까지 타필랄트 오아시스(지즈강 유역의 시질마사 둘레)를 표시. 909~910년 파티마 군의 짧은 점령은 나누지 않음
  endNote: 976년 무렵 마그라와의 하즈룬 이븐 풀풀이 시질마사를 차지해 왕조가 끝남
  features:
    - 도읍은 시질마사(지금 리사니 둘레)
    - 사하라 남쪽 가나와 잇는 금 무역의 북쪽 관문
    - 909년 파티마의 알마흐디가 이곳에 갇혀 있다 풀려남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알바크리, 『길과 나라들의 책』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 757~758년 무렵 수프리파 베르베르가 시질마사를 세우고 미드라르 가문이 이끈 때부터(823년 무렵으로 보는 설도 있음)

- id: barghawata-confederacy
  level: polity
  names: { ko: 바르가와타 연합, en: Barghawata Confederacy, native: برغواطة }
  from: 744
  to: 1059
  color: "#9cb85c"
  summary: 모로코 대서양 평야(타메스나)의 베르베르 부족들이 이룬 연합. 베르베르 반란에 가담한 타리프의 집안이 이끌었고 그 아들 살리흐 이븐 타리프가 베르베르어 경전을 내세운 독자 종교를 폈음
  mapNote: 지도에는 744년부터 1059년까지 라바트·살레에서 사피 쪽까지의 대서양 평야를 표시
  endNote: 1058~1059년 알모라비드 운동과 싸워 그 지도자 압둘라 이븐 야신을 죽였으나 1060년 무렵 아부 바크르 이븐 우마르에게 정복됨
  features:
    - 중심은 타메스나 평야(지금 카사블랑카·라바트 둘레)
    - 살리흐 이븐 타리프가 예언자를 칭하고 베르베르어 경전을 내놓음
    - 코르도바와 사절을 주고받았으나 10세기 말 사이가 틀어짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알바크리, 『길과 나라들의 책』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 744년 타리프의 아들 살리흐가 바르가와타 부족을 이끌고 독자 종교를 선포한 때부터

- id: maghrawa-dynasty
  level: polity
  names: { ko: 마그라와 왕조, en: Maghrawa dynasty, native: مغراوة }
  from: 976
  to: 1080
  color: "#c26b4a"
  summary: 제나타 베르베르 마그라와족의 가문들이 코르도바 칼리프국을 받들며 시질마사와 모로코 북부를 다스린 왕조. 지리 이븐 아티야가 페스를 도읍으로 삼아 마그레브 서부의 강자가 되었으나 알모라비드 왕조에 밀려남
  mapNote: 지도에는 976년부터 1080년까지 표시. 976년 시질마사(타필랄트), 987년 페스 둘레(가르브·타자·페스·오리엔탈)를 그림. 1056년 시질마사, 1070년 페스·타자·가르브를 알모라비드 왕조에 잃어 1080년까지 오리엔탈(우지다)만 남음. 989~991년 자브에서 수스까지 미친 영향력과 아그마트·수스 쪽 땅, 틀렘센의 마그라와·이프란 가문 땅은 그리지 않음
  endNote: 1070년 무렵 알모라비드 왕조가 페스를 차지하고 1080~1081년 우지다·틀렘센까지 정복해 끝남
  features:
    - 도읍은 시질마사, 987년 무렵부터 페스
    - 987년 지리 이븐 아티야가 알만수르에게 마그레브 아미르로 임명됨
    - 994년 우지다를 세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아비 자르, 『라우드 알키르타스』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 976~977년 하즈룬 이븐 풀풀이 미드라르 왕조의 시질마사를 차지한 때부터

- id: tulunid-dynasty
  level: polity
  names: { ko: 툴룬 왕조, en: Tulunid dynasty, native: الطولونيون }
  from: 868
  to: 905
  color: "#b0673a"
  summary: 투르크계 군인 아흐마드 이븐 툴룬이 아바스 칼리프국의 이집트 총독으로 와서 세운 왕조. 칼리프를 명목으로 받들며 이집트와 시리아를 다스려 이집트가 바그다드에서 갈라져 나간 첫 왕조가 됨
  mapNote: 지도에는 868년부터 904년까지 표시. 이집트와 키레나이카 해안, 878년 시리아 남부(다마스쿠스·팔레스타인·요르단), 886년 시리아 북부를 더하고 898년 알레포·킨나스린을 칼리프에게 돌려줌. 자지라·킬리키아(지금 튀르키예 쪽)는 비움
  endNote: 905년 1월 아바스 장군 무함마드 이븐 술라이만이 푸스타트에 들어와 툴룬 가문을 끌고 가 이집트가 다시 칼리프 직할이 됨
  features:
    - 도읍은 푸스타트 곁에 새로 지은 알카타이
    - 아흐마드 이븐 툴룬 모스크를 지음
    - 886년 조약으로 칼리프가 이집트·시리아를 30년 동안 맡김
    - 893년 후마라와이흐의 딸이 칼리프 알무타디드와 혼인함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알킨디, 『이집트 총독들의 책』", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 868년 9월 아흐마드 이븐 툴룬이 이집트 부총독으로 푸스타트에 들어온 때부터(칼리프의 정식 임명은 873년 무렵)

- id: ikhshidid-dynasty
  level: polity
  names: { ko: 이흐시드 왕조, en: Ikhshidid dynasty, native: الإخشيديون }
  from: 935
  to: 969
  color: "#7f9a3a"
  summary: 투르크계 무함마드 이븐 투그즈가 이집트 총독으로 와서 세운 왕조. 칼리프에게 '이흐시드' 칭호를 받아 명목으로 받들며 이집트·시리아 남부·히자즈를 다스렸고 그가 죽은 뒤 환관 카푸르가 실권을 쥠
  mapNote: 지도에는 935년부터 969년까지 표시. 이집트와 키레나이카 해안, 945년 시리아 남부(홈스 남쪽의 다마스쿠스·팔레스타인·요르단)와 히자즈·타부크·아시르(966년까지)를 더함. 이집트는 968년까지, 시리아 남부는 969년까지 그림
  endNote: 969년 파티마 장군 자우하르가 이집트를 정복하고 970년 시리아의 이흐시드 가문 총독이 라믈라에서 져 끝남
  features:
    - 도읍은 푸스타트
    - 939년 칼리프에게 소그드 왕호 '이흐시드'를 받음
    - 946~968년 환관 카푸르가 섭정하다 966년 스스로 다스림
    - 947년 함단 왕조의 사이프 앗다울라와 시리아를 나눔
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알킨디, 『이집트 총독들의 책』", "알마크리지, 『히타트』"]
    foundingNote: 935년 8월 무함마드 이븐 투그즈가 이집트 총독으로 푸스타트에 들어온 때부터

- id: fatimid-caliphate
  level: polity
  names: { ko: 파티마 칼리프국, en: Fatimid Caliphate, native: الدولة الفاطمية }
  from: 909
  to: 1171
  color: "#1f7a4d"
  summary: 무함마드의 딸 파티마의 후손을 칭한 이스마일파 이맘들이 이프리키야에서 세운 칼리프국. 쿠타마 베르베르의 힘으로 아글라브 왕조를 무너뜨리고 969년 이집트를 정복해 카이로를 세웠으며 아바스에 맞선 시아파 칼리프로 지중해 남쪽을 다스림
  mapNote: 지도에는 909년부터 1170년까지 표시. 909년 이프리키야·타헤르트, 921~931년 모로코 북부(페스)·서알제리, 969년 이집트·키레나이카 해안(키레나이카는 1051년까지), 979년 팔레스타인·요르단, 983년 다마스쿠스·레바논, 1000년 홈스·하마·타르투스, 1017~1024년 알레포를 그림. 1076년 다마스쿠스·팔레스타인 내륙·요르단을 시리아 셀주크 왕조에 잃고 해안 도시만 남았다가 1099~1110년 십자군에게, 1153년 아스칼론·가자를 잃어 이집트만 남음. 972년부터 이프리키야는 지리 왕조로, 트리폴리타니아 해안은 977년까지 직할로 그림. 히자즈는 메카 샤리프국으로 따로 그림. 1038~1041년 알레포 직할은 짧아 그리지 않음
  endNote: 1171년 살라딘이 금요 예배에서 마지막 칼리프 알아디드의 이름을 빼고 아바스 칼리프를 받들어 칼리프국이 끝남
  features:
    - 도읍은 라카다, 921년 마흐디야, 948년 만수리야, 973년 카이로
    - 910년 1월 알마흐디가 라카다에서 칼리프를 선포함
    - 969년 장군 자우하르가 이집트를 정복하고 카이로를 세움
    - 970~972년 카이로에 알아즈하르 모스크를 지음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["카디 알누만, 『포교의 시작』", "알마크리지, 『이티아즈 알후나파』"]
    foundingNote: 909년 3월 아부 압둘라 알시이의 쿠타마 군이 아글라브 왕조의 라카다에 들어간 때부터(910년 1월 알마흐디의 칼리프 선포를 시작으로 보기도 함)

- id: zirid-dynasty
  level: polity
  names: { ko: 지리 왕조, en: Zirid dynasty, native: الزيريون }
  from: 972
  to: 1148
  color: "#d07a8a"
  summary: 산하자 베르베르의 지리 이븐 마나드 가문이 파티마 칼리프국의 이프리키야 총독으로 세운 세습 왕조. 파티마가 이집트로 옮긴 뒤 카이라완을 중심으로 이프리키야를 다스렸고 11세기 중엽 파티마와 갈라섬
  mapNote: 지도에는 972년부터 1147년까지 표시. 972년 튀니지·알제리 동부와 아시르·알제 둘레, 978년 트리폴리타니아 해안을 그림. 1001년 트리폴리타니아 해안을 하즈룬 왕조에, 1015년 아시르·알제 둘레와 호드나·자브·아우레스를 함마드 왕조에 내주고, 1057년 바누 힐랄에 밀려 튀니지 내륙을 잃은 뒤 1062년 누미디아 텔(콘스탄틴 쪽)도 함마드 왕조에 넘겨 사헬·스팍스·가베스 해안만 남음. 979~985년 부룩킨의 모로코 원정 땅, 1062~1100년 무렵 스팍스·가베스 토후의 자립은 그리지 않음
  endNote: 1148년 시칠리아 왕국의 노르만 함대가 마흐디야를 차지해 왕조가 끝남
  features:
    - 도읍은 카이라완 곁의 사브라 알만수리야, 1057년부터 마흐디야
    - 아버지 지리 이븐 마나드가 아시르를 세우고 부룩킨이 알제를 다시 세움
    - 1015년 함마드 가문이 알제리 쪽에서 갈라져 나감
    - 1050년대 바누 힐랄의 침입으로 내륙을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이다리, 『알바얀 알무그리브』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 972년 파티마 칼리프 알무이즈가 이집트로 떠나며 부룩킨 이븐 지리를 이프리키야 총독으로 세운 때부터

# ── 서아시아·북아프리카 A3b-3 (2026-10-30): 이집트·레반트·아라비아 1000~1452 (칼리프·술탄을 명목으로 받든 세습 지방 왕조는 따로 항목, 십자군 해안은 운영자 결정 예외로 그림) ──
- id: luluids-of-aleppo
  level: polity
  names: { ko: 루울루 가문 (알레포), en: "Lu'lu'ids of Aleppo", native: آل لؤلؤ }
  from: 1004
  to: 1016
  color: "#8fb0d8"
  summary: 함단 왕조의 가신 루울루와 아들 만수르가 알레포를 다스린 정권. 동로마에 공납하면서 파티마 칼리프를 받듦
  mapNote: 지도에는 1004년부터 1016년까지 알레포·이들리브 둘레로 표시
  endNote: 1016년 무렵 민중 봉기로 만수르가 동로마 땅으로 달아나고 알레포는 파티마 총독에게 넘어감
  features:
    - 도읍은 알레포
    - 루울루는 991년부터 함단 군주 사이드 앗다울라의 섭정으로 실권을 쥠
    - 1003~1004년 함단 가문의 아들들을 이집트로 내보내고 홀로 다스림
    - 1008~1009년 루울루가 죽고 아들 만수르가 뒤를 이음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아디무, 『알레포사』"]
    foundingNote: 루울루가 함단 가문의 마지막 군주들을 내보내고 알레포를 홀로 다스린 1004년부터

- id: mirdasid-dynasty
  level: polity
  names: { ko: 미르다스 왕조, en: Mirdasid dynasty, native: المرداسيون }
  from: 1014
  to: 1080
  color: "#a0b040"
  summary: 아랍 킬랍 부족의 미르다스 가문이 알레포를 도읍으로 북시리아를 다스린 왕조. 파티마 칼리프와 동로마 사이에서 신하 관계를 오감
  mapNote: 지도에는 1025년부터 1079년까지 알레포·이들리브로 표시하고, 1025~1037년은 라까를 더함. 1014~1024년 라흐바 둘레와 1038~1041년 파티마의 알레포 직할은 작거나 짧아 그리지 않음
  endNote: 1080년 알레포가 우카일 왕조의 무슬림 이븐 쿠라이시에게 넘어가 왕조가 끝남
  features:
    - 도읍은 알레포, 그 전에는 유프라테스 강가의 라흐바
    - 1022년 라까·라피카를 손에 넣음
    - 1029년 우크후와나 전투에서 살리흐 이븐 미르다스가 파티마 군에 전사함
    - 1048~1050년 무렵 티말이 동로마의 신하가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아디무, 『알레포사』"]
    foundingNote: 살리흐 이븐 미르다스가 라흐바를 근거로 세력을 이룬 1014년 무렵부터(알레포는 1025년 초)

- id: seljuks-of-syria
  level: polity
  names: { ko: 시리아 셀주크 왕조, en: Seljuks of Syria, native: سلاجقة الشام }
  from: 1076
  to: 1117
  color: "#5b7fc0"
  summary: 셀주크 술탄 말리크샤의 동생 투투시와 그 아들들이 다마스쿠스와 알레포를 다스린 셀주크 갈래 왕조. 1095년 두카크의 다마스쿠스와 리드완의 알레포로 갈라짐
  mapNote: 지도에는 1076년부터 표시. 1076년 다마스쿠스·팔레스타인 내륙·요르단·홈스·하마, 1086년 알레포·라타키아를 더함. 1099년 팔레스타인을 예루살렘 왕국에, 1104년 다마스쿠스 쪽을 부리 왕조에 넘기고 1117년까지 알레포 둘레만 그림
  endNote: 1117년 무렵 리드완의 아들 술탄샤 때 실권이 무너지고 이듬해 알레포가 아르투크 왕조의 일가지에게 넘어감
  features:
    - 도읍은 다마스쿠스, 1095년부터 리드완 쪽은 알레포
    - 1079년 투투시가 다마스쿠스의 아트시즈를 처형하고 그 땅을 넘겨받음
    - 1092년 말리크샤가 죽자 투투시가 술탄을 칭하다 1095년 전사함
    - 두카크와 리드완이 다투는 사이 제1차 십자군이 시리아 해안을 지나감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알칼라니시, 『다마스쿠스 연대기 속편』"]
    foundingNote: 셀주크 술탄을 받든 아트시즈가 다마스쿠스를 차지한 1076년부터(1079년 투투시가 넘겨받음)

- id: burid-dynasty
  level: polity
  names: { ko: 부리 왕조, en: Burid dynasty, native: البوريون }
  from: 1104
  to: 1154
  color: "#50a0a8"
  summary: 두카크의 아타베그 투그테긴과 그 아들 부리의 가문이 다마스쿠스를 다스린 튀르크계 왕조. 셀주크 술탄의 이름을 동전에 새김
  mapNote: 지도에는 1104년부터 1153년까지 다마스쿠스·베카·하우란과 요르단 북·동부로 표시. 1104~1137년 홈스·하마, 1104~1117년 요르단 남부를 더함
  endNote: 1154년 알레포의 누르 앗딘이 다마스쿠스를 차지해 왕조가 끝남
  features:
    - 도읍은 다마스쿠스
    - 투그테긴은 예루살렘 왕국과 싸우기도 하고 휴전하기도 함
    - 1148년 제2차 십자군의 다마스쿠스 포위를 막아 냄
    - 1138년 무렵 홈스·하마를 장기에게 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알칼라니시, 『다마스쿠스 연대기 속편』"]
    foundingNote: 두카크가 죽은 뒤 아타베그 투그테긴이 다마스쿠스를 쥔 1104년부터

- id: artuqid-dynasty
  level: polity
  names: { ko: 아르투크 왕조, en: Artuqid dynasty, native: الأرتقيون }
  from: 1101
  to: 1409
  color: "#b07890"
  summary: 튀르크멘 장수 아르투크의 후손이 디야르바크르·마르딘·히슨 카이파를 다스린 왕조. 일가지와 발라크가 한때 알레포를 차지함
  mapNote: 지도에는 1118년부터 1127년까지 알레포·이들리브로만 표시. 본토인 아나톨리아 남동부(마르딘·히슨 카이파)는 그리지 않음
  endNote: 1409년 마르딘 갈래가 카라코윤루에게 넘어가 왕조가 끝남
  features:
    - 마르딘 갈래와 히슨 카이파 갈래로 나뉨
    - 1119년 일가지가 '피의 들판' 전투에서 안티오키아 군을 무찌름
    - 1123년 발라크가 예루살렘 왕 보두앵 2세를 사로잡음
    - 알레포는 1128년 장기에게 넘어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아즈라크 알파리키, 『마야파리킨과 아미드의 역사』"]
    foundingNote: 아르투크의 아들 소크멘이 히슨 카이파를 차지한 1101년 무렵부터

- id: jerusalem-kingdom
  level: polity
  names: { ko: 예루살렘 왕국, en: Kingdom of Jerusalem, native: مملكة بيت المقدس }
  from: 1099
  to: 1291
  color: "#d84848"
  summary: 제1차 십자군이 예루살렘을 점령하고 세운 라틴 그리스도교 왕국. 1187년 하틴에서 진 뒤 아크레를 도읍으로 해안 도시들만 지킴
  mapNote: 지도에는 1099년부터 1290년까지 표시. 1099년 예루살렘·야파·갈릴리, 1110년 베이루트·시돈, 1118년 요르단 건너편의 오트르조르댕, 1153년 아스칼론·가자와 네게브를 그림. 1187년 하틴 뒤 땅을 잃고, 1192년 라믈라 조약부터는 야파~티레~베이루트 해안 띠로 그림. 1229~1244년 예루살렘 회랑과 1239~1247년 갈릴리 회복은 작거나 짧아 그리지 않음
  endNote: 1291년 5월 맘루크 술탄국이 아크레를 함락해 왕국이 끝남
  features:
    - 도읍은 예루살렘, 1191년부터 아크레
    - 1100년 보두앵 1세가 첫 왕을 칭함
    - 트리폴리 백국·안티오키아 공국의 명목상 종주국
    - 1187년 10월 살라딘에게 예루살렘을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["티레의 기욤, 『바다 건너에서 이루어진 일들의 역사』", "샤르트르의 풀셰, 『예루살렘 순례자들의 역사』"]
    foundingNote: 1099년 7월 15일 제1차 십자군이 예루살렘을 점령한 때부터

- id: tripoli-county
  level: polity
  names: { ko: 트리폴리 백국, en: County of Tripoli, native: كونتية طرابلس }
  from: 1102
  to: 1289
  color: "#e8b4e0"
  summary: 툴루즈 백작 레몽의 가문이 레바논 북부 해안의 트리폴리를 중심으로 세운 십자군 국가. 예루살렘 왕국을 명목상 받듦
  mapNote: 지도에는 1109년부터 1288년까지 타르투스·트리폴리와 나흐르 이브라힘 북쪽 해안으로 표시. 1만 km²보다 작지만 십자군 해안을 보이려고 그림. 크라크 데 슈발리에 둘레 내륙은 나누지 않음
  endNote: 1289년 4월 맘루크 술탄 칼라운이 트리폴리를 함락해 백국이 끝남
  features:
    - 도읍은 트리폴리
    - 1102년 레몽이 트리폴리 앞 '순례자의 산'에 성을 쌓고 포위를 시작함
    - 1187년 뒤 안티오키아 공국과 같은 군주를 받듦
    - 1271년 맘루크가 크라크 데 슈발리에를 빼앗음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["티레의 기욤, 『바다 건너에서 이루어진 일들의 역사』"]
    foundingNote: 레몽이 트리폴리 포위를 시작한 1102년부터(트리폴리 함락은 1109년)

- id: zengid-dynasty
  level: polity
  names: { ko: 장기 왕조, en: Zengid dynasty, native: الزنكيون }
  from: 1127
  to: 1234
  color: "#7a5ab0"
  summary: 셀주크의 모술 아타베그 이마드 앗딘 장기가 세운 튀르크계 왕조. 누르 앗딘 때 알레포·다마스쿠스를 아울러 십자군에 맞섬
  mapNote: 지도에는 1127년부터 1233년까지 표시. 1127년 모술·두호크, 1128년 알레포, 1138년 홈스·하마, 1144년 라까, 1154년 다마스쿠스를 그림. 1174년 다마스쿠스·홈스·하마를, 1183년 알레포·라까를 살라딘에게 잃고 모술 쪽만 남음. 에데사·아나톨리아 남동부와 시리아의 하사카·데이르에조르는 칠하지 않음
  endNote: 1234년 모술의 맘루크 바드르 앗딘 루울루가 마지막 장기 군주를 없애고 정권을 쥠
  features:
    - 도읍은 모술, 누르 앗딘 갈래는 알레포와 다마스쿠스
    - 1144년 12월 장기가 에데사 백국의 도읍 에데사를 함락함
    - 1146년 장기가 죽자 아들들이 모술과 알레포로 나눠 다스림
    - 1169년 장수 시르쿠가 이집트에 들어가 파티마의 재상이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『아타베그 왕조의 빛나는 역사』"]
    foundingNote: 셀주크 술탄이 장기를 모술 아타베그로 세운 1127년부터

- id: ayyubid-dynasty
  level: polity
  names: { ko: 아이유브 왕조, en: Ayyubid dynasty, native: الأيوبيون }
  from: 1171
  to: 1260
  color: "#c89030"
  summary: 쿠르드계 살라딘이 파티마 칼리프국을 끝내고 세운 수니파 왕조. 이집트·시리아를 아울러 십자군에게서 예루살렘을 되찾음
  mapNote: 지도에는 1171년부터 1259년까지 표시. 1171년 이집트, 1174년 다마스쿠스·홈스·하마, 1183년 알레포·라까, 1187~1189년 팔레스타인·요르단을 그림. 1192년부터 십자군 해안 띠는 예루살렘 왕국, 1250년부터 이집트, 1253년부터 팔레스타인은 맘루크 술탄국으로 그림. 카라크·하마 등 집안 갈래는 나누지 않고 예멘의 아이유브 왕조는 따로 항목
  endNote: 1260년 몽골이 알레포·다마스쿠스를 차지하고 아인 잘루트 뒤 시리아가 맘루크 술탄국에 넘어가 왕조가 끝남(하마 갈래는 1341년까지 맘루크 아래 남음)
  features:
    - 도읍은 카이로, 1174~1218년은 다마스쿠스, 1250년부터 알레포
    - 1187년 7월 하틴 전투에서 이기고 10월 예루살렘에 들어감
    - 1193년 살라딘이 죽은 뒤 아들들과 동생 알아딜이 땅을 다툼
    - 1229년 야파 조약으로 예루살렘을 프리드리히 2세에게 내줌
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["바하 앗딘 이븐 샤다드, 『술탄 살라딘 전기』", "알마크리지, 『왕조들을 아는 길』"]
    foundingNote: 1171년 살라딘이 금요 예배에서 파티마 칼리프의 이름을 빼고 이집트를 손에 넣은 때부터

- id: najahid-dynasty
  level: polity
  names: { ko: 나자흐 왕조, en: Najahid dynasty, native: النجاحيون }
  from: 1022
  to: 1158
  color: "#d07f5f"
  summary: 지야드 왕조의 노예 출신 재상 나자흐가 예멘 홍해 쪽 티하마에 세운 왕조. 자비드를 도읍으로 아바스 칼리프를 받듦
  mapNote: 지도에는 1022년부터 1059년까지와 1089년부터 1158년까지 티하마(후다이다·하자)로 표시. 1060~1088년은 술라이흐 왕조 땅으로 그림
  endNote: 1158년 마지막 군주가 알리 이븐 마흐디에게 자비드를 잃어 왕조가 끝남
  features:
    - 도읍은 자비드
    - 아비시니아 출신 노예 군인 집안
    - 1060년 무렵 나자흐가 술라이흐 왕조에게 독살당했다고 전함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 나자흐가 지야드 왕조의 실권을 넘겨받아 자비드를 다스린 1022년부터

- id: sulayhid-dynasty
  level: polity
  names: { ko: 술라이흐 왕조, en: Sulayhid dynasty, native: الصليحيون }
  from: 1047
  to: 1138
  color: "#4a6fb0"
  summary: 이스마일파 포교사 알리 알술라이히가 예멘 하라즈 산지에서 일으킨 왕조. 파티마 칼리프를 받들고 예멘 대부분을 아우름
  mapNote: 지도에는 1060년 티하마, 1063년부터 사나·아덴·남부 고지까지(사다·암란 빼고) 표시. 1083년 아덴 쪽을 주라이 왕조에, 1089년 티하마를 나자흐 왕조에, 1098년 사나를 함단 술탄국에 넘기고 1137년까지 지블라 둘레 고지로 그림. 하드라마우트 등 내륙은 칠하지 않음
  endNote: 1138년 아르와 여왕이 죽어 왕조가 끝남
  features:
    - 도읍은 사나, 1087년부터 지블라
    - 1062년 알리 알술라이히가 메카에 들어가 샤리프를 세움
    - 아르와 여왕이 1086년부터 50년 넘게 실권을 쥠
    - 1132년 파티마 칼리프의 계승 문제로 카이로와 갈라짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』", "이드리스 이마드 앗딘, 『소식의 샘』"]
    foundingNote: 알리 알술라이히가 하라즈 산지에서 병력을 일으킨 1047년부터

- id: zurayid-dynasty
  level: polity
  names: { ko: 주라이 왕조, en: Zurayid dynasty, native: الزريعيون }
  from: 1083
  to: 1174
  color: "#c0c060"
  summary: 함단 부족 계통 주라이 가문이 술라이흐 왕조의 조공 신하로 아덴을 다스린 이스마일파 왕조. 1110년 무렵 독립함
  mapNote: 지도에는 1083년부터 1173년까지 아덴·라헤즈·아비얀·달리로 표시. 1138년 뒤 타이즈~도파르의 영향권은 칠하지 않음
  endNote: 1174년 6월 아이유브 왕조의 투란샤가 아덴을 정복해 왕조가 끝남
  features:
    - 도읍은 아덴
    - 인도양 무역항 아덴의 관세로 부를 쌓음
    - 처음에는 알아바스와 알마스우드 형제가 함께 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 술라이흐 왕조가 아덴을 주라이 가문의 형제에게 맡긴 1083년부터

- id: hamdanid-sultanate-of-sanaa
  level: polity
  names: { ko: 사나 함단 술탄국, en: "Hamdanid Sultanate of Sana'a", native: سلاطين همدان في صنعاء }
  from: 1098
  to: 1189
  color: "#e09ab0"
  summary: 예멘 함단 부족의 가문들이 술라이흐 왕조에서 떨어져 나와 사나를 다스린 정권. 처음에는 이스마일파를 받듦
  mapNote: 지도에는 1098년부터 1188년까지 사나 둘레로 표시
  endNote: 1189년 아이유브 왕조가 사나를 굳게 차지해 정권이 끝남
  features:
    - 도읍은 사나
    - 1173년 주라이 왕조와 함께 마흐디 왕조를 막아 냄
    - 1175년 뒤 아이유브 군에 맞서 사나를 지키다 물러남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 술라이흐 왕조의 사바 이븐 아흐마드가 죽은 뒤 함단 부족이 사나를 쥔 1098년 무렵부터

- id: mahdid-dynasty
  level: polity
  names: { ko: 마흐디 왕조, en: Mahdid dynasty, native: بنو مهدي }
  from: 1159
  to: 1174
  color: "#b06838"
  summary: 알리 이븐 마흐디가 나자흐 왕조를 무너뜨리고 티하마에 세운 엄격한 개혁파 왕조
  mapNote: 지도에는 1159년부터 1173년까지 티하마(후다이다·하자)로 표시
  endNote: 1174년 5월 아이유브 왕조의 투란샤가 자비드를 차지해 왕조가 끝남
  features:
    - 도읍은 자비드
    - 1164년 아덴을 에워쌌으나 빼앗지 못함
    - 1173년 주라이 왕조와 사나 함단 술탄국에 짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 알리 이븐 마흐디가 나자흐 왕조의 자비드를 차지한 1159년부터

- id: ayyubid-yemen
  level: polity
  names: { ko: 아이유브 왕조 (예멘), en: Ayyubid Yemen, native: الأيوبيون في اليمن }
  from: 1174
  to: 1229
  color: "#d8b060"
  summary: 살라딘의 형 투란샤가 정복한 뒤 아이유브 가문 사람들이 다스린 예멘. 카이로의 아이유브 술탄을 받듦
  mapNote: 지도에는 1174년부터 1228년까지 티하마·아덴·남부 고지로 표시하고, 1189년 사나를 더함. 사다·암란의 자이드파 이맘국과 하드라마우트 등 내륙은 칠하지 않음
  endNote: 1229년 무렵 마지막 아이유브 통치자가 시리아로 떠나고 대리인 라술 가문의 우마르가 독립함
  features:
    - 도읍은 자비드, 뒤에 타이즈
    - 1174년 5월 자비드, 6월 아덴을 차지함
    - 1219년 자이드파 이맘과 휴전함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알하즈라지, 『라술 왕조의 진주 목걸이』"]
    foundingNote: 1174년 투란샤가 자비드와 아덴을 정복한 때부터

- id: rasulid-dynasty
  level: polity
  names: { ko: 라술 왕조, en: Rasulid dynasty, native: الدولة الرسولية }
  from: 1229
  to: 1454
  color: "#a04060"
  summary: 아이유브 왕조의 대리인 우마르 이븐 알리가 독립해 세운 예멘 왕조. 홍해·인도양 무역으로 번영하고 학문을 후원함
  mapNote: 지도에는 1229년부터 1452년까지 티하마·아덴·타이즈 둘레 고지와 사나(1323년까지)로 표시. 1324년부터 사나는 자이드파와 다투는 땅이라 비우고, 도파르까지의 남부 해안 영향권과 하드라마우트는 칠하지 않음
  endNote: 1454년 알마스우드가 타히르 왕조의 알자피르 아미르에게 자리를 넘겨 왕조가 끝남
  features:
    - 도읍은 타이즈, 겨울에는 자비드
    - 1235년 아바스 칼리프의 승인을 받음
    - 앗무자파르 유수프 1세(1249~1295년) 때 가장 번성함
    - 1350년 알무자히드 알리가 메카에서 맘루크에게 붙잡힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알하즈라지, 『라술 왕조의 진주 목걸이』"]
    foundingNote: 1229년 무렵 우마르 이븐 알리가 아이유브 왕조에서 떨어져 나온 때부터

- id: uyunid-dynasty
  level: polity
  names: { ko: 우윤 왕조, en: Uyunid dynasty, native: العيونيون }
  from: 1077
  to: 1253
  color: "#8a6ac0"
  summary: 압둘라 이븐 알리 알우윤이 셀주크의 도움으로 카르마트를 무너뜨리고 아라비아 동부에 세운 아랍 왕조
  mapNote: 지도에는 1077년부터 1252년까지 알하사 오아시스와 카티프 해안으로 표시. 나지드·카타르로 넓힌 영향권과 바레인섬은 칠하지 않음
  endNote: 1253년 우스푸르 가문에게 실권이 넘어가 왕조가 끝남
  features:
    - 도읍은 알하사, 1119년 무렵부터 카티프
    - 아랍 압둘 카이스 부족 계통 가문
    - 시인 이븐 알무카르랍이 왕조의 일을 노래함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알무카르랍, 『시집』"]
    foundingNote: 압둘라 이븐 알리 알우윤이 카르마트를 이긴 1077년부터

- id: usfurid-dynasty
  level: polity
  names: { ko: 우스푸르 왕조, en: Usfurid dynasty, native: العصفوريون }
  from: 1253
  to: 1320
  color: "#c08850"
  summary: 아랍 우카일 부족 계통의 우스푸르 가문이 아라비아 동부 알하사를 다스린 왕조
  mapNote: 지도에는 1253년부터 1319년까지 알하사 오아시스와 카티프 해안으로 표시
  endNote: 1320년 무렵 자르완 가문에게 실권이 넘어가 왕조가 끝남
  features:
    - 도읍은 알하사
    - 걸프 건너 호르무즈 왕국과 해상 무역을 다툼
    - 유목 부족의 힘을 바탕으로 오아시스를 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『이바르의 책』"]
    foundingNote: 우스푸르 가문이 우윤 왕조의 땅을 넘겨받은 1253년 무렵부터

- id: jarwanid-dynasty
  level: polity
  names: { ko: 자르완 왕조, en: Jarwanid dynasty, native: الجروانيون }
  from: 1320
  to: 1417
  color: "#4f8f6f"
  summary: 시아파 자르완 가문이 카티프를 도읍으로 아라비아 동부를 다스린 왕조. 호르무즈 왕국을 명목상 받듦
  mapNote: 지도에는 1320년부터 1416년까지 알하사 오아시스와 카티프 해안으로 표시. 바레인섬은 작아 그리지 않음
  endNote: 1417년 자브르 가문에게 알하사가 넘어가 왕조가 끝남
  features:
    - 도읍은 카티프
    - 1331년 무렵 이븐 바투타가 카티프를 지나며 시아파 주민을 적음
    - 진주 채취와 걸프 무역으로 수입을 얻음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 바투타, 『여행기』"]
    foundingNote: 자르완 가문이 우스푸르 가문 뒤 카티프를 다스린 1320년 무렵부터

# ── 서아시아·북아프리카 A3b-4a (2026-10-30): 이라크·이란 1000~1220 (중앙아시아 중심 왕조는 지금 이란 땅 안쪽만, 1221년 뒤로 이어지는 항목의 끝 문장은 A3b-4b가 씀) ──
- id: ghaznavid-empire
  level: polity
  names: { ko: 가즈니 왕조, en: Ghaznavid Empire, native: غزنویان }
  from: 977
  to: 1186
  color: "#c86f3c"
  summary: 사만 왕조의 튀르크 맘루크 출신 사부크티긴이 가즈니에 세운 왕조. 마흐무드 때 호라산에서 북인도까지 다스림
  mapNote: 지도에는 1000년부터 1039년까지 지금 이란 땅 안쪽만 표시(호라산, 1029년부터 라이·곰·카즈빈). 도읍 가즈니 등 아프가니스탄·중앙아시아·인도 쪽은 그리지 않음
  endNote: 1186년 구르 왕조의 무함마드가 라호르를 차지해 왕조가 끝남
  features:
    - 도읍은 가즈니, 1163년부터 라호르
    - 마흐무드가 1000년 무렵부터 북인도로 여러 차례 원정함
    - 시인 피르다우시가 『샤나메』를 마흐무드에게 바침
    - 1040년 단다나칸 전투에서 셀주크에 져 호라산을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["바이하키, 『마수드사』"]
    foundingNote: 사부크티긴이 가즈니의 아미르가 된 977년부터

- id: kakuyid-dynasty
  level: polity
  names: { ko: 카쿠이 왕조, en: Kakuyids, native: کاکویان }
  from: 1008
  to: 1141
  color: "#9ac060"
  summary: 부와이 왕실의 외척인 다일람인 알라 앗다울라 무함마드가 이스파한에 세운 왕조
  mapNote: 지도에는 1008년부터 1140년까지 표시. 1008년 이스파한·차하르마할, 1023년 하마단·마르카지를 더하고, 1051년 셀주크에 이스파한·하마단을 내준 뒤 야즈드만 그림
  endNote: 1141년 카트완 전투에서 마지막 군주 가르샤습 2세가 전사해 왕조가 끝남
  features:
    - 도읍은 이스파한, 1051년부터 야즈드
    - 철학자 이븐 시나가 알라 앗다울라의 궁정에서 일함
    - 1051년 뒤 셀주크 술탄 가문과 혼인하고 그 봉신이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 부와이 왕조가 알라 앗다울라를 이스파한 총독으로 세운 1008년부터(1003년 무렵 이미 이스파한을 장악)

- id: annazid-dynasty
  level: polity
  names: { ko: 안나즈 왕조, en: Annazids, native: بنو عناز }
  from: 990
  to: 1117
  color: "#e0a070"
  summary: 쿠르드 샤디간 부족의 아부 알파트 이븐 안나즈가 자그로스 서부 훌완 둘레에 세운 왕조
  mapNote: 지도에는 1015년부터 1054년까지 케르만샤 주로 표시. 도읍 훌완 둘레(지금 이라크 디얄라 주 동부)는 바그다드 쪽 땅과 나누지 않았고, 990~1014년과 1055년 뒤 남은 영지는 작아 그리지 않음
  endNote: 1117년 무렵 셀주크 아래 남은 마지막 영지를 잃고 왕조가 사라짐
  features:
    - 도읍은 훌완(지금 이란·이라크 국경의 사르폴자하브 둘레)
    - 1015년 하산와이 왕조가 무너진 뒤 디나바르·케르만샤를 차지함
    - 1040년대 서쪽으로 온 셀주크 군대와 싸우다 그 아래로 들어감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 아부 알파트 이븐 안나즈가 훌완 둘레에서 자립한 990년 무렵부터

- id: mazyadid-dynasty
  level: polity
  names: { ko: 마즈야드 왕조, en: Mazyadid dynasty, native: بنو مزيد }
  from: 961
  to: 1163
  color: "#40b0b0"
  summary: 아랍 아사드 부족의 마즈야드 가문이 유프라테스 중류 힐라를 도읍으로 다스린 시아파 왕조
  mapNote: 지도에는 1012년부터 1151년까지 이라크의 바빌·카르발라·나자프·카디시야 주로 표시. 1152년 칼리프가 힐라를 차지한 뒤 1163년까지 남은 일가의 땅은 그리지 않음
  endNote: 1163년 칼리프 알무스탄지드의 군대가 마즈야드 가문을 힐라에서 몰아냄
  features:
    - 1012년 알리 1세가 힐라를 세워 도읍으로 삼음
    - 사다카 1세(1086~1108)가 힐라에 성벽을 쌓고 가장 강성해짐
    - 1108년 사다카가 셀주크 술탄 무함마드 1세와 싸우다 전사함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 아사드 부족장 마즈야드 가문이 부와이 왕조에게서 칭호와 봉토를 받은 961년 무렵부터

- id: bavandid-dynasty
  level: polity
  names: { ko: 바반드 왕조, en: Bavand dynasty, native: باوندیان }
  from: 651
  to: 1349
  color: "#d89aa0"
  summary: 사산 왕가의 피를 내세운 바반드 가문이 타바리스탄 산지를 다스린 이란계 왕조
  mapNote: 지도에는 1090년부터 1209년까지와 1238년부터 1348년까지(킨흐와리야 갈래, 몽골·일 칸국의 가신) 마잔다란 주로 표시. 1210~1237년은 호라즘·지방 영주 땅으로 둠. 651~1089년의 산지 영지는 작거나 다부이·지야르·부와이 등 이웃 땅에 들어 그리지 않음
  endNote: 1349년 마지막 군주 하산 2세가 살해되어 왕조가 끝남
  features:
    - 이스파바디야 갈래의 도읍은 사리
    - 군주는 옛 이란의 '이스파흐바드' 칭호를 씀
    - 1210년 루스탐 5세가 살해되고 호라즘이 땅을 차지함
    - 1238년 킨흐와리야 갈래가 아몰에서 다시 일어남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』"]
    foundingNote: 바브가 타바리스탄 산지에서 자립했다고 전하는 651년부터

- id: seljuk-empire
  level: polity
  names: { ko: 셀주크 제국, en: Seljuk Empire, native: سلجوقیان }
  from: 1037
  to: 1194
  color: "#1d3a66"
  summary: 오구즈 튀르크 셀주크 가문의 투그릴과 차그리가 세운 제국. 바그다드에 들어가 칼리프에게서 술탄 칭호를 받고 이란·이라크·아나톨리아를 다스림
  mapNote: 지도에는 1040년부터 1156년까지 지금 이란·이라크 땅 안쪽만 표시. 1040년 호라산·쿠미스·라이, 1051년 이스파한·하마단, 1054년 아제르바이잔, 1055년 이라크, 1062년 파르스, 1090년 고르간, 1096년 모술을 더함. 1118년부터 서쪽은 이라크 셀주크 술탄국으로 그리고 산자르의 호라산·쿠미스·고르간만 남김. 시리아·케르만의 셀주크 갈래는 따로 그리고, 투르크메니스탄·아프가니스탄·아나톨리아·캅카스는 그리지 않음
  endNote: 1157년 산자르가 죽어 대셀주크가 흩어졌고, 1194년 이라크 셀주크의 토그릴 3세가 호라즘에 져 이란의 셀주크가 끝남
  features:
    - 도읍은 니샤푸르·라이·이스파한, 1118년부터 산자르는 메르브
    - 1071년 알프 아르슬란이 만지케르트에서 동로마 황제를 사로잡음
    - 재상 니잠 알물크가 바그다드 등에 니자미야 학원을 세움
    - 1153년 산자르가 오구즈에게 사로잡혔다가 1156년 풀려남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["라완디, 『가슴의 휴식』", "이븐 알아시르, 『완전한 역사』"]
    foundingNote: 투그릴이 니샤푸르에 들어가 술탄을 칭한 1037년부터

- id: kirman-seljuk-sultanate
  level: polity
  names: { ko: 케르만 셀주크 술탄국, en: Kerman Seljuk Sultanate, native: سلجوقیان کرمان }
  from: 1041
  to: 1187
  color: "#8a6fc0"
  summary: 차그리 베그의 아들 카부르트가 부와이 왕조에게서 케르만을 빼앗아 세운 셀주크 갈래 왕조
  mapNote: 지도에는 1041년부터 1186년까지 케르만 주로 표시. 마크란(발루치스탄)·호르모즈간과 1053~1154년 무렵의 오만은 그리지 않음
  endNote: 1187년 무렵 오구즈의 말리크 디나르가 케르만을 차지해 왕조가 끝남
  features:
    - 도읍은 바르다시르(지금의 케르만 시)
    - 1073년 카부르트가 말리크샤에게 맞섰다가 져 죽음
    - 바다 건너 오만을 한동안 다스림
    - 12세기 후반 왕자들의 다툼으로 쇠약해짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무함마드 이브라힘, 『케르만 셀주크사』"]
    foundingNote: 카부르트가 케르만을 차지한 1041년부터

- id: iraq-seljuk-sultanate
  level: polity
  names: { ko: 이라크 셀주크 술탄국, en: Seljuk Sultanate of Iraq, native: سلاجقه عراق }
  from: 1118
  to: 1194
  color: "#7fb0e0"
  summary: 셀주크 술탄 무함마드 1세의 아들 마흐무드 2세가 산자르를 종주로 받들며 이란 서부와 이라크를 다스린 셀주크 갈래 정권
  mapNote: 지도에는 1118년부터 1193년까지 표시. 1118년 이란 서부·이라크, 1136년 아제르바이잔을 엘디구즈 왕조에, 1148년 파르스·로레스탄을 살구르·하자라스프 왕조에, 1152년 이라크 중부를 칼리프에게 잃음. 1160년부터 아타베그가 실권을 쥔 하마단·라이·이스파한 쪽은 엘디구즈 왕조로 그리고, 1175~1193년은 후제스탄과 바스라 쪽만 그림
  endNote: 1194년 마지막 술탄 토그릴 3세가 라이 근처에서 호라즘의 테키시에게 져 전사함
  features:
    - 도읍은 하마단
    - 아타베그(술탄의 후견인)들이 어린 술탄을 세우고 실권을 다툼
    - 1157년 술탄 무함마드 2세가 바그다드를 에워쌌으나 함락하지 못함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["라완디, 『가슴의 휴식』"]
    foundingNote: 무함마드 1세가 죽고 마흐무드 2세가 서쪽 술탄 자리를 이은 1118년부터

- id: eldiguzid-dynasty
  level: polity
  names: { ko: 엘디구즈 왕조, en: Eldiguzids, native: ایلدگزیان }
  from: 1136
  to: 1225
  color: "#b05a5a"
  summary: 킵차크 출신 맘루크 엘디구즈가 이라크 셀주크 술탄의 아타베그로서 아제르바이잔과 이란 서부를 다스린 왕조
  mapNote: 지도에는 1136년부터 1224년까지 표시. 1136년 아제르바이잔, 1160년 잔잔·카즈빈·코르데스탄·하마단·케르만샤, 1169년 라이, 1175년 이스파한·야즈드를 더함. 1194년 하마단·라이·이스파한 쪽을 호라즘에 잃고, 1204~1216년 맘루크 아이두그미시·멩글리가 다시 다스린 그 땅도 이 왕조로 그림. 아란·나히체반 등 캅카스 쪽은 그리지 않음
  endNote: 1225년 호라즘의 잘랄 앗딘이 타브리즈를 차지하고 우즈베크를 몰아내 왕조가 끝남
  features:
    - 도읍은 나히체반·하마단, 1174년부터 타브리즈
    - 엘디구즈가 술탄 토그릴 2세의 과부와 혼인해 아르슬란샤를 술탄으로 세움
    - 무함마드 자한 파흘라반(1175~1186) 때 가장 강성함
    - 시인 니자미 간자비가 이 왕조 군주들에게 작품을 바침
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["라완디, 『가슴의 휴식』"]
    foundingNote: 술탄 마수드가 엘디구즈에게 아란을 봉토로 준 1136년 무렵부터

- id: salghurid-dynasty
  level: polity
  names: { ko: 살구르 왕조, en: Salghurids, native: سلغریان }
  from: 1148
  to: 1282
  color: "#d8a040"
  summary: 오구즈 튀르크 살구르 부족의 순쿠르가 파르스에 세운 아타베그 왕조
  mapNote: 지도에는 1148년부터 1281년까지 파르스·부셰르·코길루예 주로 표시. 1235년 바레인 점령은 섬이 작아 그리지 않음
  endNote: 1282년 무렵 압이슈 하툰이 일 칸국 왕자 멩구 티무르와 혼인한 뒤 파르스가 일 칸국 직할이 되어 왕조가 끝남
  features:
    - 도읍은 시라즈
    - 사드 1세가 호라즘 샤에게 사로잡혀 그 종주를 받아들임
    - 아부 바크르 때 시인 사디가 『과수원』·『장미원』을 지어 바침
    - 몽골이 오자 일찍 항복해 파르스를 전란에서 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["와사프, 『와사프의 역사』"]
    foundingNote: 순쿠르가 셀주크 총독을 몰아내고 시라즈를 차지한 1148년부터

- id: hazaraspid-dynasty
  level: polity
  names: { ko: 하자라스프 왕조, en: Hazaraspids, native: هزاراسپیان }
  from: 1115
  to: 1424
  color: "#8a7a50"
  summary: 쿠르드계 파들루야 가문이 루르 산지 남부(대 루르)를 다스린 아타베그 왕조
  mapNote: 지도에는 1148년부터 1423년까지 로레스탄·일람 주로 표시. 도읍 이다즈(후제스탄 북부)와 루르 산지를 주 단위로 어림했고, 왕조가 일어난 1115년부터 1147년까지는 그리지 않음
  endNote: 1424년 티무르 왕조의 샤 루흐가 마지막 군주 기야스 앗딘을 몰아내 왕조가 끝남
  features:
    - 도읍은 이다즈(지금의 이제)
    - 유수프 샤 1세가 후제스탄 북부를 더함
    - 1296년 아프라시얍 1세가 일 칸 가잔에게 처형됨
    - 일 칸국과 티무르 왕조의 종주를 받아들임
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["함달라 무스타우피, 『선별 역사』"]
    foundingNote: 파들루야 가문의 아부 타히르가 대 루르를 다스리기 시작한 1115년 무렵부터

- id: khwarazmian-empire
  level: polity
  names: { ko: 호라즘 제국, en: Khwarazmian Empire, native: خوارزمشاهیان }
  from: 1077
  to: 1231
  color: "#3c9a5a"
  summary: 셀주크의 맘루크 아누슈티긴이 호라즘 총독이 된 뒤 그 후손이 자립해 중앙아시아와 이란을 아우른 제국
  mapNote: 지도에는 1194년부터 지금 이란 땅 안쪽만 표시. 1194년 라이·하마단·이스파한·야즈드·쿠미스, 1198년 호라산을 더하고, 1200~1216년 페르시아 이라크(라이·하마단·이스파한)는 잃은 땅으로 그림. 1210년 마잔다란·고르간, 1214년 오구즈에게서 빼앗은 케르만, 1217년 페르시아 이라크를 다시 차지함. 1221년 호라산·쿠미스·고르간을 몽골에, 1222년 케르만을 쿠틀루그 칸 왕조에 잃고, 1225년 잘랄 앗딘이 아제르바이잔을 더해 1230년까지 그림. 도읍 구르간지 등 중앙아시아·아프가니스탄 쪽은 그리지 않음
  endNote: 1231년 마지막 술탄 잘랄 앗딘이 몽골에 쫓기다 쿠르드 산지에서 살해됨
  features:
    - 도읍은 구르간지, 1212년부터 사마르칸트
    - 1194년 테키시가 라이에서 마지막 이라크 셀주크 술탄을 무찌름
    - 1218년 오트라르에서 몽골 상단을 죽여 칭기즈 칸의 침공을 부름
    - 1225년 잘랄 앗딘이 타브리즈를 도읍으로 삼음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["주와이니, 『세계 정복자의 역사』", "나사위, 『잘랄 앗딘 전기』"]
    foundingNote: 셀주크의 맘루크 아누슈티긴이 호라즘 총독이 된 1077년부터

# ── 서아시아·북아프리카 A3b-4b (2026-10-30): 이라크·이란 1221~1452 (몽골 늘림 뒤 일 칸국과 그 뒤 왕조, 티무르·카라코윤루·무샤샤 앞쪽은 A2 항목 파일) ──
- id: qutlugh-khanid-dynasty
  level: polity
  names: { ko: 쿠틀루그 칸 왕조, en: Qutlugh-Khanids, native: قتلغخانیان }
  from: 1222
  to: 1306
  color: "#5fb8a0"
  summary: 카라 키타이 출신 장수 바라크 하지브가 케르만에 세운 왕조
  mapNote: 지도에는 1222년부터 1305년까지 케르만주로 표시. 호르모즈간 해안 쪽은 그리지 않음
  endNote: 1306년 일 칸 울제이투가 공물을 바치지 않은 마지막 군주를 물러나게 하고 총독을 보내 왕조가 끝남
  features:
    - 도읍은 케르만(바르다시르)
    - 바라크 하지브가 아들을 오고데이 궁정에 보내 몽골에 항복함
    - 쿠틀루그 투르칸 하툰이 1257~1282년 다스리며 나라를 안정시킴
    - 파디샤 하툰이 일 칸 아바카와 게이하투의 왕비가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나시르 앗딘 문시 키르마니, 『시므트 알울라』"]
    foundingNote: 바라크 하지브가 호라즘의 총독을 몰아내고 1222년 케르만을 차지한 해부터

- id: lulu-dynasty
  level: polity
  names: { ko: 루울루 정권, en: Lu'lu'id dynasty, native: آل لؤلؤ }
  from: 1234
  to: 1262
  color: "#9c6644"
  summary: 장기 왕조의 맘루크였던 바드르 앗딘 루울루가 모술에서 세운 정권
  mapNote: 지도에는 1234년부터 1261년까지 모술·두호크주로 표시. 신자르·자지라트 이븐 우마르·하부르강 쪽(지금 시리아·튀르키예 땅)은 그리지 않음
  endNote: 1262년 훌라구의 몽골군이 반란을 일으킨 아들 알살리흐 이스마일의 모술을 함락함
  features:
    - 도읍은 모술
    - 루울루가 장기 왕조의 섭정으로 실권을 쥔 뒤 1234년 자기 이름으로 동전을 찍음
    - 1243년 쾨세다그 전투 뒤 몽골의 종주를 받아들임
    - 1258년 훌라구의 바그다드 원정을 도움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["바르 헤브라에우스, 『연대기』"]
    foundingNote: 루울루가 마지막 장기 군주를 없애고 1234년 자기 이름으로 동전을 찍은 해부터

- id: ilkhanate
  level: polity
  names: { ko: 일 칸국, en: Ilkhanate, native: ایلخانان }
  from: 1256
  to: 1335
  color: "#2e6b8f"
  summary: 칭기즈 칸의 손자 훌라구가 이란·이라크에 세운 몽골 칸국
  mapNote: 지도에는 1260년부터 1334년까지 지금 이란·이라크 땅만 표시(1256~1259년 훌라구의 원정 땅은 몽골 제국으로 그림). 1262년 모술, 1282년 파르스, 1306년 케르만을 직할로 더함. 가신 왕조(바반드·하자라스프·무자파르 등)의 땅은 그 왕조로 그림. 아나톨리아·캅카스(룸·조지아·아르메니아)와 호라산 동부·아프가니스탄 쪽은 그리지 않음
  endNote: 1335년 아부 사이드가 후계자 없이 죽은 뒤 칸 자리를 둘러싼 다툼 속에 나라가 갈라짐
  features:
    - 도읍은 마라게, 1265년 타브리즈, 1306년 술타니예
    - 1260년 아인 잘루트에서 맘루크에게 져 시리아로 나아가지 못함
    - 1295년 가잔 칸이 이슬람으로 개종하고 세제·역참을 고침
    - 재상 라시드 앗딘이 세계사 『집사』를 엮음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["라시드 앗딘, 『집사』", "주와이니, 『세계 정복자의 역사』"]
    foundingNote: 훌라구가 서방 원정에서 1256년 이스마일파의 알라무트를 무너뜨린 해부터(독립 칸국의 지도는 1260년부터)

- id: jalayirid-sultanate
  level: polity
  names: { ko: 잘라이르 술탄국, en: Jalayirid Sultanate, native: جلایریان }
  from: 1335
  to: 1432
  color: "#b84a62"
  summary: 몽골 잘라이르 부족의 하산 부주르그가 일 칸국이 무너진 뒤 바그다드를 중심으로 세운 왕조
  mapNote: 지도에는 1335년부터 1431년까지 표시. 1335~1337년 이라크와 이란 서부, 1338년 이란 서부를 초바니 왕조에 잃고 이라크만, 1358년 아제르바이잔과 술타니예 쪽을 더함. 1371년 라이(테헤란 둘레)를 더함. 1384년 술타니예·라이 쪽, 1386년 아제르바이잔을 티무르에게 잃고, 1410년부터는 힐라·와시트·바스라 쪽만 남음(1431년 힐라·와시트를 잃음). 1393~1405년 티무르의 바그다드 점령은 그리지 않고 이 왕조로 둠. 모술·아르빌 등 이라크 북부도 이 왕조로 그림
  endNote: 1431년 마지막 술탄 후사인 2세가 카라코윤루에게 죽어 왕조가 끝남
  features:
    - 도읍은 바그다드, 1358년부터 타브리즈, 1386년 뒤 다시 바그다드
    - 셰이크 우와이스가 1360년 아제르바이잔을 되찾아 가장 넓어짐
    - 술탄 아흐마드가 티무르에게 쫓겨 맘루크·오스만으로 몸을 피함
    - 1410년 카라 유수프에게 져 아흐마드가 처형됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아부 바크르 알쿠트비 알아하리, 『셰이크 우와이스의 역사』"]
    foundingNote: 아부 사이드가 죽은 1335년 하산 부주르그가 바그다드에서 실권을 쥔 해부터

- id: chobanid-dynasty
  level: polity
  names: { ko: 초바니 왕조, en: Chobanids, native: چوپانیان }
  from: 1338
  to: 1357
  color: "#6a9a3a"
  summary: 일 칸국의 장군 초반의 후손이 타브리즈를 중심으로 이란 북서부를 다스린 왕조
  mapNote: 지도에는 1338년부터 1356년까지 아제르바이잔·잔잔·카즈빈·코르데스탄·라이·하마단·케르만샤로 표시하고, 1338~1342년 이스파한, 1339~1342년 파르스를 더함. 다스린 페르시아 이라크의 경계는 주 단위로 어림했고, 아란·아나톨리아 동부 쪽은 그리지 않음
  endNote: 1357년 황금 군단의 자니 베그가 타브리즈를 차지하고 말레크 아슈라프를 죽여 왕조가 끝남
  features:
    - 하산 쿠첵이 1338년 잘라이르 군을 무찌르고 꼭두각시 칸을 세움
    - 피르 후사인이 1339~1342년 시라즈와 이스파한을 다스림
    - 1347년 바그다드를 치려 했으나 잘라이르에게 막힘
    - 말레크 아슈라프의 가혹한 정치에 학자·상인이 타브리즈를 떠남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["하피즈 아브루, 『집사 속편』"]
    foundingNote: 하산 쿠첵이 잘라이르의 하산 부주르그를 몰아내고 타브리즈를 차지한 1338년부터

- id: injuid-dynasty
  level: polity
  names: { ko: 인주 왕조, en: Injuids, native: آل اینجو }
  from: 1335
  to: 1357
  color: "#e07850"
  summary: 일 칸국의 파르스 직할지(인주)를 맡던 샤라프 앗딘 마흐무드 샤의 가문이 시라즈에서 자립한 왕조
  mapNote: 지도에는 1335년부터 1356년까지 표시. 1335년 파르스·부셰르·코길루예, 1343년 이스파한·차하르마할을 더함. 1339~1342년 초바니 왕조의 피르 후사인이 시라즈를 차지한 동안은 땅을 그리지 않고, 1353년 파르스를 무자파르 왕조에 잃은 뒤에는 이스파한 쪽만 그림
  endNote: 1357년 무자파르 왕조의 무바리즈 앗딘이 이스파한을 차지하고 아부 이스하크를 처형함
  features:
    - 도읍은 시라즈
    - 아부 이스하크가 1343년 시라즈를 되찾아 가장 넓어짐
    - 이븐 바투타가 여행기에 아부 이스하크의 시라즈를 적음
    - 시인 하피즈가 젊은 시절 아부 이스하크를 기림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 바투타, 『여행기』"]
    foundingNote: 아부 사이드가 죽은 1335년 일 칸국에서 자립한 해부터(가문은 1304년부터 파르스의 직할지를 맡음)

- id: muzaffarid-dynasty
  level: polity
  names: { ko: 무자파르 왕조, en: Muzaffarids, native: آل مظفر }
  from: 1314
  to: 1393
  color: "#7a4fa0"
  summary: 아랍계 무자파르 가문이 야즈드를 바탕으로 이란 중남부를 다스린 왕조
  mapNote: 지도에는 1319년부터 1392년까지 표시. 1319년 야즈드(1334년까지 일 칸국 아래 총독령), 1340년 케르만, 1353년 파르스·부셰르·코길루예, 1357년 이스파한·차하르마할을 더함. 1387~1392년 티무르가 다시 앉힌 왕자들의 땅도 이 왕조로 그림. 후제스탄·호르모즈간 쪽은 그리지 않음
  endNote: 1393년 티무르가 시라즈 둘레에서 샤 만수르를 죽이고 왕자들을 처형해 왕조가 끝남
  features:
    - 도읍은 야즈드·케르만, 1353년부터 시라즈
    - 무바리즈 앗딘이 1358년 아들 샤 슈자에게 눈이 멀고 쫓겨남
    - 샤 슈자 때 시인 하피즈가 시라즈에서 활동함
    - 왕자들 사이 다툼으로 1364~1366년 시라즈 주인이 바뀜
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무인 앗딘 야즈디, 『신의 선물』"]
    foundingNote: 무바리즈 앗딘 무함마드가 아버지를 이어 일 칸국의 마이부드 총독이 된 1314년부터(지도는 야즈드를 차지한 1319년부터)

- id: sarbadar-dynasty
  level: polity
  names: { ko: 사르바다르 왕조, en: Sarbadars, native: سربداران }
  from: 1337
  to: 1381
  color: "#c0b040"
  summary: 몽골 지배에 맞서 호라산 서부 바이하크(세브제바르)에서 일어난 봉기 세력이 세운 정권
  mapNote: 지도에는 1337년부터 1380년까지 호라산 서부(북호라산과 라자비 호라산의 동경 59° 서쪽)로 표시. 1340년 무렵 담간·셈난·고르간, 1353년 뒤 투스·아스타라바드 쪽으로 뻗었다 물러난 땅은 그리지 않음
  endNote: 1381년 마지막 지배자 호자 알리 무아이야드가 티무르에게 항복함
  features:
    - 도읍은 세브제바르
    - 데르비시 교단과 지방 귀족이 다투며 지배자가 자주 바뀜
    - 1353년 일 칸 후보 토가 테무르를 죽임
    - 1376년 무렵 니샤푸르를 카르트 왕조에 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["압둘 라자크 사마르칸디, 『두 길성이 떠오르는 곳』"]
    foundingNote: 압둘 라자크가 바슈틴 마을의 봉기를 이끌고 1337년 세브제바르를 차지한 해부터

# ── 서아시아·북아프리카 A3 질문 창구 ③ 고침 (2026-10-31): 고르간(아스타라바드) 1344~1383 새 항목 둘 ──
- id: togha-temur-domain
  level: polity
  names: { ko: 토가 테무르 정권, en: Togha Temür's realm, native: طغاتیمور }
  from: 1338
  to: 1353
  color: "#6a7fc8"
  summary: 칭기즈 칸의 아우 카사르의 후손 토가 테무르가 일 칸을 자처하며 고르간·마잔다란을 근거지로 삼은 정권
  mapNote: 지도에는 1344년부터 1352년까지 고르간(아스타라바드, 지금의 골레스탄주)만 표시. 1338~1343년의 땅과 마잔다란·호라산 쪽 땅은 그리지 않음
  endNote: 1353년 말 사르바다르의 야히야 카라위가 진영으로 찾아와 토가 테무르를 죽이고 그 일족과 군대를 없앰
  features:
    - 1337년 봄 서이란 원정에 나섰으나 1340년 무렵 일 칸국을 다시 묶으려는 뜻이 꺾임
    - 1339~1340년 잘라이르의 하산 부주르그가 한때 일 칸으로 인정함
    - 1344년 바반드 왕조의 도움으로 사르바다르에게 잃은 땅을 되찾음
    - 1351~1352년 사르바다르의 야히야 카라위가 그의 이름으로 동전을 찍고 공물을 바침
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["압둘 라자크 사마르칸디, 『두 길성이 떠오르는 곳』"]
    foundingNote: 아부 사이드가 죽은 뒤 호라산의 아미르들이 토가 테무르를 일 칸으로 내세운 1338년 무렵부터

- id: amir-vali-astarabad
  level: polity
  names: { ko: 아미르 왈리 정권, en: Amir Vali of Astarabad, native: امیر ولی }
  from: 1356
  to: 1384
  color: "#b8743c"
  summary: 토가 테무르의 아스타라바드 총독 셰이크 알리 힌두의 아들 아미르 왈리가 아스타라바드를 근거지로 세운 정권
  mapNote: 지도에는 1356년부터 1364년까지와 1374년부터 1383년까지 고르간(아스타라바드, 지금의 골레스탄주)만 표시. 1365~1373년은 사르바다르의 재점령과 회복 사이로 비우고, 마잔다란 일부와 비스탐·담간·셈난 쪽 땅은 그리지 않음
  endNote: 1384년 티무르에게 아스타라바드를 잃고 잘라이르 왕조로 달아남
  features:
    - 처음에는 토가 테무르의 아들 루크만을 내세웠다가 자기 이름으로 다스림
    - 1360년 무렵 사르바다르에게서 비스탐과 담간을 빼앗음
    - 라이 쪽으로 나아갔다가 잘라이르의 셰이크 우와이스에게 막힘
    - 1381년 티무르에게 신하의 예를 바치기를 거부함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["압둘 라자크 사마르칸디, 『두 길성이 떠오르는 곳』"]
    foundingNote: 아미르 왈리가 사르바다르가 보낸 군대를 물리치고 아스타라바드를 차지한 1356년부터

# ── 서아시아·북아프리카 A3c-5 (2026-10-31): 리비아·마그레브 1000~1452 (지리 왕조에서 갈라진 세습 왕조, 알모라비드·알모하드는 유럽 항목을 늘리고 하프스·자이얀·마린 앞쪽은 A2 항목 파일) ──
- id: hammadid-dynasty
  level: polity
  names: { ko: 함마드 왕조, en: Hammadid dynasty, native: الحماديون }
  from: 1015
  to: 1152
  color: "#c8a03c"
  summary: 지리 왕조의 일족 함마드 이븐 불루긴이 알제리 중·동부에서 세운 산하자 베르베르 왕조. 칼아 베니 함마드를 도읍으로 마그레브 중부를 다스렸고 바누 힐랄에 밀려 1090년 해안의 베자이아로 옮김
  mapNote: 지도에는 1015년부터 1151년까지 표시. 1015년 아시르·알제 둘레와 호드나·자브·아우레스, 1062년 누미디아 텔(콘스탄틴·안나바 쪽)과 켄셸라를 그림. 1082년 알제·셸리프 쪽을 알모라비드 왕조에, 1090년 호드나·비스크라를 바누 힐랄에 내줌. 틀렘센(1103~1104)·카이라완(1066) 원정과 튀니스의 종주는 땅으로 그리지 않음
  endNote: 1152년 알모하드의 압드 알무민이 알제와 베자이아를 차지하고 마지막 군주 야히야가 항복해 끝남
  features:
    - 도읍은 1007년 무렵 세운 칼아 베니 함마드, 1090년부터 베자이아
    - 1017년 지리 왕조의 알무이즈와 싸운 뒤 화평을 맺어 자립을 굳힘
    - 알나시르(재위 1062~1088) 때 가장 넓었고 1067년 무렵 베자이아를 세움
    - 아바스와 파티마 칼리프 사이에서 받드는 쪽을 여러 번 바꿈
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『이바르의 책』", "이븐 이다리, 『알바얀 알무그리브』"]
    foundingNote: 1015년 함마드 이븐 불루긴이 지리 왕조에서 떨어져 나와 독립을 선언한 때부터(1014년으로 보기도 함)

- id: khazrunid-dynasty
  level: polity
  names: { ko: 하즈룬 왕조, en: Banu Khazrun, native: بنو خزرون }
  from: 1001
  to: 1146
  color: "#8a70b8"
  summary: 제나타 베르베르 마그라와족의 하즈룬 가문이 트리폴리를 중심으로 트리폴리타니아 해안을 다스린 왕조. 지리 왕조에서 떨어져 나와 파티마 칼리프국을 명목으로 받들며 자립을 지킴
  mapNote: 지도에는 1001년부터 1145년까지 트리폴리 둘레의 트리폴리타니아 해안 평야(지파라)를 표시. 내륙(미스라타·미즈다)은 비움
  endNote: 1146년 굶주림 속에 트리폴리 주민이 가문을 몰아냈고, 같은 해 시칠리아 왕국의 노르만 함대가 트리폴리를 차지해 끝남
  features:
    - 1009년 풀풀이 죽은 뒤 지리 왕조가 트리폴리를 잠시 되찾았으나 1022년 넘겨줌
    - 1026~1027년 파티마 칼리프 알자히르에게서 트리폴리 총독 지위를 인정받음
    - 1051~1052년 바누 힐랄이 쳐들어올 때 지리 왕조를 도우면서도 트리폴리를 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『이바르의 책』", "이븐 이다리, 『알바얀 알무그리브』"]
    foundingNote: 1001년 풀풀 이븐 사이드 이븐 하즈룬이 지리 왕조에서 떨어져 나와 트리폴리를 차지한 때부터(지리 왕조가 트리폴리를 정식으로 넘긴 1022년을 시작으로 보기도 함)
