# middle-east medieval 나라 (시대 파일 scripts/geo/areas/middle-east/medieval.mjs의 짝 항목 파일)
# 시대·범위: 632~1452: 칼리프 시대, 이란·이집트 왕조, 십자군 국가, 몽골과 일 칸국, 마그레브 왕조
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-medieval').
# 632년 전에 시작한 나라는 from을 실제 해로 적고 도형은 632년부터. 1000년 넘어 이어지는 나라는 to를 실제 끝 해로 적고 도형은 999년까지(1000년부터는 A3b가 이어 붙임).
# startEvents·endEvents는 사건 묶음 me-02~05가 채운다.

# ── 서아시아·북아프리카 A3a-1 (2026-10-30): 레반트·이라크·아라비아·이란 632~999 ──
- id: rashidun-caliphate
  level: polity
  names: { ko: 정통 칼리프국, en: Rashidun Caliphate, native: الخلافة الراشدة }
  from: 632
  to: 661
  color: "#7fae4e"
  summary: 무함마드가 죽은 뒤 아부 바크르·우마르·우스만·알리 네 칼리프가 메디나와 쿠파에서 다스린 첫 칼리프국. 리다 전쟁으로 아라비아를 하나로 묶고 동로마의 시리아와 사산 제국을 정복함
  mapNote: 지도에는 632년부터 660년까지 표시. 632년 아라비아 정주 지대(내륙 사막은 비움), 637년 레반트·이라크, 639년 시리아 자지라, 642년 후제스탄·지발·이라크 북부와 이집트·키레나이카 해안, 644년 아제르바이잔, 647년 트리폴리타니아 해안, 650년 파르스, 651년 케르만·시스탄·호라산을 더함. 656~661년 내전 동안 무아위야가 쥔 시리아는 나누지 않음
  endNote: 661년 알리가 쿠파에서 암살되고 아들 하산이 물러나 무아위야의 우마이야 칼리프국이 섬
  features:
    - 도읍은 메디나, 656년부터 쿠파
    - 636년 야르무크 전투와 카디시야 전투에서 동로마·사산 군대를 이김
    - 우마르 때 군영 도시 바스라·쿠파를 세움
    - 우스만 때 쿠란을 한 책으로 엮음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "발라두리, 『여러 나라의 정복』"]
    foundingNote: 632년 6월 무함마드가 죽고 아부 바크르가 첫 칼리프로 뽑힌 때부터

- id: sasanian-empire
  level: polity
  names: { ko: 사산 제국, en: Sasanian Empire, native: ایرانشهر }
  from: 224
  to: 651
  color: "#b5523b"
  summary: 아르다시르 1세가 파르티아를 무너뜨리고 세운 페르시아 제국. 크테시폰을 도읍으로 이라크와 이란 고원을 다스렸으나 628년 뒤 내분으로 약해져 아랍 정복을 막지 못함
  mapNote: 지도에는 632년부터 650년까지 표시. 632년 이라크와 이란 고원, 637년 이라크를 잃음, 642년 후제스탄·지발과 카스피해 쪽(다부이 왕조)을 잃음, 644년 아제르바이잔, 650년 파르스를 잃음. 발루치스탄은 비움
  endNote: 651년 야즈데게르드 3세가 메르브 가까이에서 죽어 제국이 끝남
  features:
    - 도읍은 크테시폰
    - 조로아스터교를 국교로 받듦
    - 602~628년 동로마와 마지막 큰 전쟁을 치름
    - 636년 카디시야, 642년 니하반드에서 아랍군에 짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "낙시 로스탐의 샤푸르 1세 비문"]
    foundingNote: 아르다시르 1세가 파르티아 왕 아르타바누스 4세를 이긴 224년부터

- id: dabuyid-dynasty
  level: polity
  names: { ko: 다부이 왕조, en: Dabuyid dynasty, native: دابویگان }
  from: 642
  to: 760
  color: "#b8a8d0"
  summary: 사산 제국이 무너진 뒤 길 가브바라 가문이 카스피해 남쪽 길란·타바리스탄을 다스린 왕조. 이스파바드 칭호를 이어 쓰며 우마이야에 조공하고 자립을 지킴
  mapNote: 지도에는 642년부터 759년까지 길란·마잔다란·골레스탄 땅으로 표시. 716년 우마이야의 고르간 침공 뒤 바뀐 땅은 나누지 않음
  endNote: 760년 아바스 칼리프국 군대가 타바리스탄을 정복하고 마지막 이스파바드 쿠르시드가 죽음
  features:
    - 도읍은 길란의 푸만
    - 716년 야지드 이븐 알무할라브의 침공을 파루칸이 막아 냄
    - 바반드·카린 가문 같은 산지 영주들을 거느림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』"]
    foundingNote: 니하반드 전투 뒤 길 가브바라가 길란·다일람을 차지한 642년 무렵부터

- id: abbasid-caliphate
  level: polity
  names: { ko: 아바스 칼리프국, en: Abbasid Caliphate, native: الخلافة العباسية }
  from: 750
  to: 1258
  color: "#55556b"
  summary: 무함마드의 숙부 아바스의 후손이 우마이야를 무너뜨리고 세운 칼리프국. 바그다드를 세워 이슬람 세계의 중심으로 삼았으나 9세기부터 지방 왕조가 갈라져 나가고 945년 부와이 왕조에 실권을 빼앗김
  mapNote: 지도에는 750년부터 944년까지 직접 다스린 땅을 표시. 이집트·키레나이카 해안은 750~867년과 905~934년, 이프리키야는 762~799년 그림. 지방 왕조(타히르·사파르·사만·툴룬 등)의 땅은 그 왕조로 그림. 945년부터 칼리프는 부와이 왕조 아래 이름만 남아 땅이 없음
  endNote: 1258년 훌라구의 몽골군이 바그다드를 함락하고 칼리프 알무스타심을 죽여 바그다드의 칼리프국이 끝남
  features:
    - 도읍은 쿠파·안바르, 762년부터 바그다드, 836~892년 사마라
    - 하룬 알라시드와 알마문 때 '지혜의 집'에서 그리스 학문을 아랍어로 옮김
    - 861년 뒤 투르크 군인들이 칼리프를 갈아치우는 혼란을 겪음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』", "야쿠비, 『여러 나라의 책』"]
    foundingNote: 750년 1월 자브 전투에서 우마이야 군을 이기고 아부 알아바스 앗사파흐가 칼리프에 오른 때부터

- id: tahirid-dynasty
  level: polity
  names: { ko: 타히르 왕조, en: Tahirid dynasty, native: طاهریان }
  from: 821
  to: 873
  color: "#c9a14a"
  summary: 알마문의 장군 타히르 이븐 후사인의 가문이 대를 이어 호라산을 다스린 왕조. 아바스 칼리프를 받들면서 바그다드 경찰장 자리도 맡음
  mapNote: 지도에는 821년부터 872년까지 지금 이란의 호라산·셈난(쿠미스) 땅만 표시. 메르브·헤라트 등 중앙아시아·아프가니스탄 쪽은 그리지 않음
  endNote: 873년 사파르 왕조의 야쿠브 이븐 알라이스가 니샤푸르를 차지해 타히르 왕조가 끝남
  features:
    - 도읍은 메르브, 뒤에 니샤푸르
    - 아바스 칼리프의 총독으로서 칼리프 이름으로 금요 예배를 올림
    - 압둘라 이븐 타히르 때 농민을 보호하는 정책으로 이름남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["가르디지, 『자인 알아흐바르』"]
    foundingNote: 칼리프 알마문이 타히르 이븐 후사인을 호라산 총독으로 임명한 821년부터

- id: dulafid-dynasty
  level: polity
  names: { ko: 둘라프 왕조, en: Dulafid dynasty, native: دلفیان }
  from: 861
  to: 896
  color: "#a87a9a"
  summary: 아부 둘라프 가문이 이란 서부 지발의 카라지와 이스파한을 대를 이어 다스린 왕조. 사마라의 혼란 동안 사실상 자립했으나 아바스 칼리프를 받듦
  mapNote: 지도에는 861년부터 895년까지 이스파한·마르카지·곰 둘레로 표시. 884년 무렵 파르스·케르만을 맡았던 일은 사파르 왕조가 실제로 다스려 칠하지 않음
  endNote: 896년 칼리프 알무타디드가 둘라프 가문의 땅을 거두어 아바스 직할로 돌림
  features:
    - 도읍은 카라지
    - 9세기 초 아부 둘라프가 칼리프에게서 영지를 받아 가문의 기반을 닦음
    - 아부 둘라프는 시인·학자로도 이름남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 사마라의 혼란(861) 뒤 카라지 둘레를 대를 이어 다스리며 사실상 자립한 때부터

- id: saffarid-dynasty
  level: polity
  names: { ko: 사파르 왕조, en: Saffarid dynasty, native: صفاریان }
  from: 861
  to: 1003
  color: "#d46a4a"
  summary: 구리 장인(사파르) 출신 야쿠브 이븐 알라이스가 시스탄에서 세운 왕조. 파르스·케르만·호라산까지 넓혔으나 900년 사만 왕조에 지고 시스탄으로 줄어듦
  mapNote: 지도에는 861년부터 999년까지 지금 이란 땅만 표시. 시스탄(북위 29° 북쪽), 867년 케르만, 870년 파르스, 873년 호라산을 더하고, 900년 호라산, 908년 파르스·케르만을 잃음. 912~922년 시스탄은 사만 왕조 땅으로 그림. 도읍 자란즈는 지금 아프가니스탄이라 그리지 않음
  endNote: 1003년 가즈니 왕조의 마흐무드가 시스탄을 차지하고 마지막 군주 칼라프 이븐 아흐마드를 폐위함
  features:
    - 도읍은 자란즈, 870~908년 파르스의 시라즈도 함께 씀
    - 876년 바그다드로 진군했으나 다이르 알아쿨에서 칼리프 군에 짐
    - 페르시아어 궁정 시를 처음 후원한 왕조로 꼽힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『타리히 시스탄』(시스탄사)"]
    foundingNote: 야쿠브 이븐 알라이스가 시스탄의 아미르가 된 861년부터

- id: alid-tabaristan
  level: polity
  names: { ko: 타바리스탄 알리 가문 토후국, en: Alid emirate of Tabaristan, native: علویان طبرستان }
  from: 864
  to: 928
  color: "#6aa86a"
  summary: 무함마드의 사위 알리의 후손인 자이드파 이맘들이 카스피해 남쪽 타바리스탄·길란을 다스린 나라. 타히르 왕조에 맞선 봉기로 섰고 다일람 사람들을 이슬람으로 이끔
  mapNote: 지도에는 864년부터 899년까지와 914년부터 927년까지 길란·마잔다란·골레스탄으로 표시. 900~913년은 사만 왕조가 타바리스탄을 차지한 때라 길란은 비움
  endNote: 928년 사만 왕조가 타바리스탄을 다시 차지하고 알리 가문의 통치가 끝남
  features:
    - 도읍은 아물
    - 864년 하산 이븐 자이드가 타히르 총독에 맞서 봉기함
    - 914년 하산 알우트루시가 다일람·길란 사람들을 모아 다시 일으킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』"]
    foundingNote: 하산 이븐 자이드가 아물에서 이맘으로 추대된 864년부터

- id: sajid-dynasty
  level: polity
  names: { ko: 사지 왕조, en: Sajid dynasty, native: ساجیان }
  from: 889
  to: 929
  color: "#8a7ac0"
  summary: 아바스 칼리프가 보낸 장수 무함마드 이븐 아비 앗사지의 가문이 아제르바이잔을 대를 이어 다스린 왕조. 칼리프에게 조공하며 아르메니아까지 세력을 뻗침
  mapNote: 지도에는 901년부터 928년까지 지금 이란의 아제르바이잔·잔잔으로 표시. 889~900년 마라가 둘레 총독 시절과 아르메니아·아란 등 캅카스 쪽은 그리지 않음
  endNote: 929년 마지막 군주 파트 이븐 무함마드가 아르다빌에서 독살되고 왕조가 끝남
  features:
    - 도읍은 마라가, 901년부터 아르다빌
    - 유수프 이븐 아비 앗사지가 아르메니아의 바그라투니 왕국과 싸움
    - 912년 칼리프에게 바치던 조공을 끊음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 무함마드 이븐 아비 앗사지가 아제르바이잔 총독이 된 889년 무렵부터

- id: samanid-empire
  level: polity
  names: { ko: 사만 왕조, en: Samanid Empire, native: سامانیان }
  from: 819
  to: 999
  color: "#4f8fbf"
  summary: 부하라를 도읍으로 중앙아시아와 호라산을 다스린 페르시아계 왕조. 아바스 칼리프를 받들면서 페르시아어 문예를 꽃피움
  mapNote: 지도에는 900년부터 999년까지 지금 이란 땅 안쪽만 표시(호라산, 900~913년·928~930년 타바리스탄, 912~922년 시스탄). 도읍 부하라 등 중앙아시아 쪽은 그리지 않음
  endNote: 999년 카라한 왕조가 부하라를 차지하고 가즈니 왕조가 호라산을 가져가 사만 왕조가 무너짐
  features:
    - 도읍은 부하라
    - 900년 이스마일 이븐 아흐마드가 발흐에서 사파르 왕조의 아므르를 사로잡음
    - 시인 루다키와 학자 이븐 시나가 이 왕조의 궁정에서 활동함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나르샤히, 『부하라사』"]
    foundingNote: 사만 가문의 네 형제가 칼리프 알마문에게서 사마르칸트·페르가나 등을 맡은 819년 무렵부터

- id: ilyasid-dynasty
  level: polity
  names: { ko: 일리아스 왕조, en: Ilyasid dynasty, native: الیاسیان }
  from: 932
  to: 968
  color: "#c7b07a"
  summary: 사만 왕조의 장수 무함마드 이븐 일리아스가 케르만에 세운 왕조. 사만·부와이 사이에서 자립을 지킴
  mapNote: 지도에는 932년부터 967년까지 지금 이란의 케르만·호르모즈간 주로 표시. 남쪽 산지의 쿠프스·발루치 부족 땅을 나누지 않은 어림
  endNote: 968년 부와이 왕조의 아두드 앗다울라가 도읍 바르다시르를 차지해 왕조가 끝남
  features:
    - 도읍은 바르다시르(지금의 케르만 시)
    - 무함마드 이븐 일리아스가 30여 년 다스림
    - 사만 왕조와 부와이 왕조 사이에서 자립을 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 무함마드 이븐 일리아스가 케르만을 차지한 932년부터

- id: ziyarid-dynasty
  level: polity
  names: { ko: 지야르 왕조, en: Ziyarid dynasty, native: زیاریان }
  from: 931
  to: 1090
  color: "#7ac0b0"
  summary: 길란 출신 마르다비즈 이븐 지야르가 세운 왕조. 한때 이란 서·중부를 차지했으나 곧 부와이에 밀려 카스피해 남쪽 고르간·타바리스탄을 다스림
  mapNote: 지도에는 931년부터 999년까지 표시(980~997년은 부와이 왕조 땅). 931년 타바리스탄·고르간·쿠미스와 라이·하마단·이스파한, 935년 이스파한·하마단을 잃음, 943년 라이를 잃음
  endNote: 1090년 마지막 군주 길란샤가 죽고 니자르 이스마일파가 땅을 차지함
  features:
    - 도읍은 이스파한, 935년부터 라이, 943년부터 고르간
    - 카부스 이븐 부시무르기르는 학자이자 시인으로 이름남
    - 980년 카부스가 부와이에 쫓겨났다가 998년 돌아옴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이스판디야르, 『타바리스탄사』", "카부스 나마"]
    foundingNote: 마르다비즈 이븐 지야르가 타바리스탄·고르간을 차지하고 자립한 931년부터

- id: buyid-dynasty
  level: polity
  names: { ko: 부와이 왕조, en: Buyid dynasty, native: آل بویه }
  from: 934
  to: 1062
  color: "#9a4f6f"
  summary: 다일람 출신 부야의 세 아들이 세운 시아파 왕조. 945년 바그다드에 들어가 아바스 칼리프를 허수아비로 두고 이라크와 이란 서·남부를 다스림
  mapNote: 지도에는 934년부터 999년까지 표시. 934년 파르스, 935년 후제스탄·이스파한·하마단, 943년 라이, 945년 이라크, 967년 오만, 968년 케르만, 979년 모술, 980년 타바리스탄을 더함. 983년 뒤 형제 가문으로 갈라진 지방 정권도 한 나라로 그림
  endNote: 1055년 셀주크의 투그릴이 바그다드를 차지했고 1062년 마지막 파르스 정권이 무너짐
  features:
    - 도읍은 시라즈·라이·바그다드(형제가 나누어 다스림)
    - 칼리프에게서 '앗다울라' 칭호를 받고 대아미르로 실권을 쥠
    - 아두드 앗다울라 때 가장 넓어져 '샤한샤' 칭호를 씀
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["미스카와이흐, 『여러 민족의 경험』"]
    foundingNote: 알리 이븐 부야가 파르스를 차지하고 시라즈를 도읍으로 삼은 934년부터

- id: sallarid-dynasty
  level: polity
  names: { ko: 살라르 왕조, en: Sallarid dynasty, native: سالاریان }
  from: 919
  to: 1062
  color: "#4f7fc0"
  summary: 다일람의 무사피르 가문이 타롬에서 일어나 아제르바이잔을 다스린 왕조. 부와이 왕조와 혼인으로 이어짐
  mapNote: 지도에는 941년부터 999년까지 표시. 941년 아제르바이잔·잔잔, 984년 아제르바이잔을 라와드 왕조에 잃고 잔잔(타롬)만 남음. 아란·아르메니아 등 캅카스 쪽은 그리지 않음
  endNote: 1062년 무렵 셀주크의 투그릴에게 타롬이 넘어가 왕조가 끝남
  features:
    - 도읍은 타롬의 사미란 성
    - 941년 마르주반 이븐 무함마드가 다이삼에게서 아제르바이잔을 빼앗음
    - 마르주반은 948년 부와이 왕조와 싸우다 사로잡힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["미스카와이흐, 『여러 민족의 경험』"]
    foundingNote: 무함마드 이븐 무사피르가 타롬 둘레에서 자립한 919년 무렵부터

- id: rawadid-dynasty
  level: polity
  names: { ko: 라와드 왕조, en: Rawadid dynasty, native: روادیان }
  from: 955
  to: 1054
  color: "#c8a0d8"
  summary: 아랍계 라와드 가문이 쿠르드화하여 타브리즈를 중심으로 아제르바이잔을 다스린 왕조
  mapNote: 지도에는 984년부터 999년까지 동아제르바이잔·아르다빌 주로 표시. 서아제르바이잔은 비움
  endNote: 1054년 셀주크의 투그릴이 아제르바이잔에 들어와 와흐수단의 항복을 받음
  features:
    - 도읍은 타브리즈
    - 984년 무렵 살라르 왕조의 아제르바이잔 땅을 차지함
    - 아랍계 가문이 쿠르드 사회에 섞여 쿠르드 왕조가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 라와드 가문이 타브리즈 둘레의 영주로 자리 잡은 955년 무렵부터

- id: hasanwayhid-dynasty
  level: polity
  names: { ko: 하산와이 왕조, en: Hasanwayhid dynasty, native: حسنویه }
  from: 959
  to: 1015
  color: "#d8c070"
  summary: 쿠르드인 하산와이 이븐 후사인이 이란 서부 자그로스 산지에 세운 왕조. 부와이 왕조에 공납하며 자치를 누림
  mapNote: 지도에는 959년부터 999년까지 케르만샤·로레스탄 주로 표시. 훌완·샤흐리조르를 가졌던 때는 나누지 않음
  endNote: 1014년 바드르 이븐 하산와이가 죽고 1015년 안나즈 왕조가 자발 서부를 차지함
  features:
    - 도읍은 디나바르
    - 바드르 이븐 하산와이가 1000년 무렵까지 30여 년 다스림
    - 부와이 왕조에 공납을 바치며 자그로스 산지의 자치를 지킴
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 하산와이 이븐 후사인이 디나바르 둘레의 쿠르드 부족을 이끌고 자립한 959년부터

- id: hamdanid-dynasty
  level: polity
  names: { ko: 함단 왕조, en: Hamdanid dynasty, native: الحمدانيون }
  from: 890
  to: 1004
  color: "#d09060"
  summary: 아랍 타글리브 부족의 함단 가문이 모술과 알레포에 세운 두 갈래 왕조. 알레포의 사이프 앗다울라가 동로마와 싸우며 시인 무타납비를 후원함
  mapNote: 지도에는 929년부터 999년까지 표시. 929년 모술 둘레와 자지라, 944년 알레포·홈스 북쪽·시리아 해안, 979년 모술 쪽을 부와이 왕조에 잃음. 969년 뒤 알레포가 동로마에 조공한 것은 따로 그리지 않음
  endNote: 1004년 알레포의 마지막 함단 군주가 폐위되고 가신 루울루 가문이 정권을 쥠
  features:
    - 도읍은 모술과 알레포
    - 사이프 앗다울라가 945~967년 알레포를 다스리며 동로마와 해마다 싸움
    - 962년 동로마의 니케포로스 포카스가 알레포를 약탈함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["무타납비의 사이프 앗다울라 찬가", "이븐 알아디무, 『알레포사』"]
    # 작업 메모: 항목은 함단 이븐 함둔의 봉기(890), 도형은 나시르 앗다울라의 모술 총독(929)부터
    foundingNote: 함단 이븐 함둔이 모술 둘레에서 세력을 이룬 890년부터

- id: uqaylid-dynasty
  level: polity
  names: { ko: 우카일 왕조, en: Uqaylid dynasty, native: العقيليون }
  from: 990
  to: 1096
  color: "#6f8f4f"
  summary: 아랍 우카일 부족이 모술을 도읍으로 자지라와 이라크 북부를 다스린 시아파 왕조
  mapNote: 지도에는 990년부터 999년까지 모술·두호크와 시리아 하사카·데이르에조르로 표시
  endNote: 1096년 셀주크 장수 케르보가가 모술을 차지해 왕조가 끝남
  features:
    - 도읍은 모술
    - 996년 알무칼라드가 부와이 총독을 몰아내고 모술을 손에 넣음
    - 시아파를 받든 아랍 부족 왕조
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완전한 역사』"]
    foundingNote: 무함마드 이븐 알무사이야브가 디야르 라비아를 차지하고 모술을 도읍으로 삼은 990년 무렵부터

- id: qarmatian-state
  level: polity
  names: { ko: 카르마트 국가, en: Qarmatian state, native: القرامطة }
  from: 899
  to: 1077
  color: "#e0a0a0"
  summary: 이스마일파에서 갈라진 카르마트파가 아라비아 동부 바레인 지방에 세운 나라. 930년 메카를 약탈하고 검은 돌을 가져가 이슬람 세계를 흔듦
  mapNote: 지도에는 899년부터 999년까지 알하사 오아시스와 카티프 해안으로 표시. 바레인섬·카타르와 오만 해안(931~934년)은 칠하지 않음
  endNote: 1077년 아랍 부족장 압둘라 알우윤이 셀주크의 도움으로 카르마트를 무너뜨림
  features:
    - 도읍은 알아사(지금의 알후푸프)
    - 930년 메카를 약탈해 검은 돌을 가져갔다가 951년 돌려줌
    - 지도자 회의가 다스리는 공동체 체제로 알려짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["나시르 후스라우, 『여행기』"]
    foundingNote: 아부 사이드 알잔나비가 바레인 지방을 차지한 899년부터

- id: ziyadid-dynasty
  level: polity
  names: { ko: 지야드 왕조, en: Ziyadid dynasty, native: بنو زياد }
  from: 819
  to: 1018
  color: "#5fa0d0"
  summary: 칼리프 알마문이 보낸 무함마드 이븐 지야드가 예멘의 홍해 쪽 티하마에 세운 왕조. 자비드를 도읍으로 아바스 칼리프를 받듦
  mapNote: 지도에는 819년부터 999년까지 티하마·지잔과 아덴·라헤즈·타이즈·아비얀 해안으로 표시. 하드라마우트까지 다스렸다는 기록은 근거가 약해 칠하지 않음
  endNote: 1018년 노예 출신 재상 나자흐 가문에게 실권이 넘어가 왕조가 끝남
  features:
    - 도읍은 자비드
    - 981년 뒤 노예 출신 재상들이 실권을 쥠
    - 아바스 칼리프를 명목상 받듦
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우마라 알야마니, 『예멘사』"]
    foundingNote: 무함마드 이븐 지야드가 티하마를 평정하고 자비드를 세운 819년부터

- id: yufirid-dynasty
  level: polity
  names: { ko: 유피르 왕조, en: Yufirid dynasty, native: اليعفريون }
  from: 847
  to: 997
  color: "#c0a050"
  summary: 힘야르 계통 유피르 가문이 예멘 고지의 사나를 다스린 왕조. 아바스 칼리프를 받듦
  mapNote: 지도에는 847년부터 996년까지 사나·다마르·이브 둘레 고지로 표시. 사다·암란은 896년까지만 칠함. 904~916년 카르마트의 사나 점령은 칠하지 않음
  endNote: 997년 무렵 가문의 다툼 끝에 유피르 왕조의 권위가 사라짐
  features:
    - 도읍은 샤밤 카우카반, 뒤에 사나
    - 916년 카르마트에게서 사나를 되찾음
    - 힘야르 계통 가문으로 아바스 칼리프를 받듦
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["함다니, 『이클릴』"]
    foundingNote: 유피르 이븐 아브드 앗라흐만이 사나를 차지한 847년부터

- id: zaydi-imamate
  level: polity
  names: { ko: 자이드파 이맘국 (사다), en: Zaydi Imamate of Sa'dah, native: الإمامة الزيدية }
  from: 897
  to: 1597
  color: "#6a9a80"
  summary: 알리의 후손 알하디 야흐야가 예멘 북부 사다에 세운 자이드파 이맘국. 부족들의 지지로 이맘이 대를 이어 섬
  mapNote: 지도에는 897년부터 999년까지 사다·암란 주로 표시
  endNote: 1597년 카심 이븐 무함마드가 이맘을 칭해 카심 왕조의 이맘국이 이어받음
  features:
    - 도읍은 사다
    - 897년 알하디 야흐야 이븐 알후사인이 사다에 들어와 이맘이 됨
    - 이맘은 학식과 혈통을 갖춘 알리의 후손 가운데서 섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『알하디 야흐야 전기』"]
    foundingNote: 알하디 야흐야가 사다 부족들의 초청으로 이맘이 된 897년부터

- id: ibadi-imamate-of-oman
  level: polity
  names: { ko: 오만 이바드 이맘국, en: Ibadi Imamate of Oman, native: إمامة عُمان الإباضية }
  from: 793
  to: 945
  color: "#e8a8c8"
  summary: 이바드파 이맘이 오만 내륙의 니즈와를 중심으로 다스린 8~10세기의 이맘국. 793년 아바스 칼리프의 총독 지배에서 벗어나 둘째 이맘국을 세웠고, 893년 아바스 장수 무함마드 이븐 누르에게 정복되었다가 897년 셋째 이맘국으로 되살아남. 931~934년에는 카르마트가 오만을 지배함
  mapNote: 지도에는 793년부터 892년까지와 897년부터 944년까지 오만 내륙·바티나·무스카트와 아랍에미리트 땅으로 표시. 893년부터 896년까지는 아바스 칼리프국 땅으로 그리고, 931~934년 카르마트의 지배는 그리지 않음. 1920년부터의 근대 이맘국은 따로 항목
  endNote: 940년대에 셋째 이맘국이 무너지고 오만은 지방 세력과 카르마트 사이에 놓였다가 967년 부와이 왕조에 넘어감
  features:
    - 도읍은 니즈와
    - 이맘국에 앞서 752~793년 줄란다 가문이 아바스 칼리프의 총독으로 다스림
    - 893년 아바스 장수 무함마드 이븐 누르의 정복으로 둘째 이맘국이 끊김
    - 931~934년 걸프의 카르마트가 오만을 지배함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["살릴 이븐 라지크, 『오만 이맘과 사이드들의 역사』"]
    # 작업 메모: A3a 반영에서 A1 근대 이맘국(oman-imamate, 1920~1959)과 따로 둔 항목. 넷째 이맘국(1016~)은 A3b가 같은 id로 이을 수 있음. 끝 해 945는 'Third Imamate (897–940s)'의 어림
    foundingNote: 이바드파가 둘째 이맘국을 세운 793년부터. 749~751년의 첫 이맘국은 넣지 않음

# ── 서아시아·북아프리카 A3a-2 (2026-10-30): 이집트·리비아·마그레브 632~999 (이집트 왕조의 시리아·히자즈 땅 포함) ──
- id: fihrid-emirate
  level: polity
  names: { ko: 피흐르 토후국, en: Fihrid Emirate, native: الفهريون }
  from: 745
  to: 757
  color: "#a0784a"
  summary: 정복자 우크바 이븐 나피의 후손 압드 알라흐만 이븐 하비브 알피흐리가 카이라완에서 세운 이프리키야의 토후국. 우마이야 칼리프국이 흔들리는 틈에 자립해 750년 뒤 아바스 칼리프국을 받들지 않았으나 집안 다툼과 카리지파 베르베르의 봉기로 무너짐
  mapNote: 지도에는 745년부터 756년까지 튀니지·알제리 동부·트리폴리타니아 해안을 표시
  endNote: 757년 카리지파 베르베르가 카이라완을 차지해 피흐르 가문의 통치가 끝남
  features:
    - 도읍은 카이라완
    - 이프리키야를 정복한 우크바 이븐 나피의 집안
    - 750년 뒤 아바스 칼리프국의 권위를 받아들이지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 압드 알하캄, 『이집트와 마그리브 정복사』", "이븐 이다리, 『알바얀 알무그리브』"]
    foundingNote: 745년 압드 알라흐만 이븐 하비브가 카이라완에서 우마이야 총독을 몰아내고 자립한 때부터

- id: aghlabid-dynasty
  level: polity
  names: { ko: 아글라브 왕조, en: Aghlabid dynasty, native: الأغالبة }
  from: 800
  to: 909
  color: "#c08a3e"
  summary: 아바스 칼리프 하룬 알라시드가 이브라힘 이븐 알아글라브를 세습 아미르로 삼아 이프리키야를 맡긴 아랍 왕조. 칼리프를 명목으로 받들며 카이라완을 중심으로 시칠리아를 정복했으나 쿠타마 베르베르를 이끈 이스마일파 운동에 무너짐
  mapNote: 지도에는 800년부터 908년까지 튀니지·알제리 동부·트리폴리타니아 해안을 표시. 827년부터 정복한 시칠리아·몰타는 시칠리아 토후국으로 그림
  endNote: 909년 아부 압둘라 알시이가 이끈 쿠타마 군에게 라카다를 잃고 마지막 아미르 지야다트 알라흐 3세가 동쪽으로 달아나 왕조가 끝남
  features:
    - 도읍은 카이라완, 궁성은 아바시야(800~876)와 라카다(876~)
    - 827년부터 시칠리아를 정복함
    - 카이라완 대모스크를 다시 짓고 해안에 요새(리바트)를 둠
    - 902~907년 쿠타마 베르베르에게 밀라·세티프·바가야를 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이다리, 『알바얀 알무그리브』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 800년 하룬 알라시드가 이브라힘 1세 이븐 알아글라브를 이프리키야의 세습 아미르로 임명한 때부터

- id: rustamid-imamate
  level: polity
  names: { ko: 루스탐 이맘국, en: Rustamid Imamate, native: الدولة الرستمية }
  from: 777
  to: 909
  color: "#6a8fb8"
  summary: 페르시아계 압드 알라흐만 이븐 루스탐이 타헤르트(지금 알제리 티아렛)에서 이맘으로 뽑혀 세운 이바드파 이맘국. 마그레브 중부의 베르베르 부족과 사하라 대상 무역을 묶었으나 9세기 말 타헤르트 둘레로 줄어들고 파티마 칼리프국에 무너짐
  mapNote: 지도에는 777년부터 908년까지 표시. 884년까지 타헤르트 둘레와 셸리프·고원 지대(티아렛·사이다·마스카라·렐리잔·젤파·라구아트), 885년부터 타헤르트 둘레만 그림. 자발 나푸사·남튀니지 이바드파에 미친 종교 권위는 땅으로 그리지 않음
  endNote: 909년 파티마 군이 타헤르트를 차지해 이맘국이 끝나고 이바드파 공동체는 우아르글라 쪽으로 옮겨 감
  features:
    - 도읍은 타헤르트
    - 공동체가 이맘을 뽑는 이바드파 원칙을 따름
    - 사하라 남쪽과 잇는 대상 무역으로 번영함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 사기르, 『루스탐 이맘들의 연대기』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 777년 무렵 압드 알라흐만 이븐 루스탐이 타헤르트에서 이맘으로 뽑힌 때부터(타헤르트 건설은 761년 무렵)

- id: idrisid-dynasty
  level: polity
  names: { ko: 이드리스 왕조, en: Idrisid dynasty, native: الأدارسة }
  from: 788
  to: 974
  color: "#b85a5a"
  summary: 예언자 무함마드의 후손 이드리스 1세가 아바스의 박해를 피해 와 베르베르 아우라바족의 지지로 모로코 북부에 세운 왕조. 페스를 세워 모로코 이슬람화의 중심으로 삼았으나 형제들 사이에 땅이 나뉘고 파티마·코르도바 사이에서 약해짐
  mapNote: 지도에는 790년부터 973년까지 표시. 920년까지 탕헤르에서 오리엔탈까지의 모로코 북부와 틀렘센, 921년부터 리프(탕헤르·테투안과 타자·알호세이마)만 그림. 대서양 평야의 바르가와타와 타필랄트의 미드라르 왕조는 따로 그림
  endNote: 974년 코르도바 칼리프국의 장군 갈리브가 하산 2세를 항복시키고 이드리스 가문을 코르도바로 데려가 왕조가 끝남(985년 복귀 시도는 실패)
  features:
    - 도읍은 왈릴리(볼루빌리스), 809년부터 페스
    - 789년 무렵 이드리스 1세가 페스를 세우고 이드리스 2세가 넓힘
    - 828년 이드리스 2세가 죽은 뒤 아들들이 땅을 나누어 다스림
    - 917~921년 파티마의 원정 뒤 그 가신이 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아비 자르, 『라우드 알키르타스』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 788년 이드리스 1세가 왈릴리에 자리 잡고 아우라바족의 이맘으로 추대된 때부터

- id: midrarid-dynasty
  level: polity
  names: { ko: 미드라르 왕조, en: Midrarid dynasty, native: بنو مدرار }
  from: 758
  to: 976
  color: "#8a6fb0"
  summary: 수프리파 카리지 베르베르(미크나사족)가 사하라 대상로의 북쪽 끝 시질마사에 세운 왕조. 금과 소금 무역으로 번영했으며 10세기에는 파티마 칼리프국을 받들었음
  mapNote: 지도에는 758년부터 975년까지 타필랄트 오아시스(지즈강 유역의 시질마사 둘레)를 표시. 909~910년 파티마 군의 짧은 점령은 나누지 않음
  endNote: 976년 무렵 마그라와의 하즈룬 이븐 풀풀이 시질마사를 차지해 왕조가 끝남
  features:
    - 도읍은 시질마사(지금 리사니 둘레)
    - 사하라 남쪽 가나와 잇는 금 무역의 북쪽 관문
    - 909년 파티마의 알마흐디가 이곳에 갇혀 있다 풀려남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알바크리, 『길과 나라들의 책』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 757~758년 무렵 수프리파 베르베르가 시질마사를 세우고 미드라르 가문이 이끈 때부터(823년 무렵으로 보는 설도 있음)

- id: barghawata-confederacy
  level: polity
  names: { ko: 바르가와타 연합, en: Barghawata Confederacy, native: برغواطة }
  from: 744
  to: 1059
  color: "#6f9fcf"
  summary: 모로코 대서양 평야(타메스나)의 베르베르 부족들이 이룬 연합. 베르베르 반란에 가담한 타리프의 집안이 이끌었고 그 아들 살리흐 이븐 타리프가 베르베르어 경전을 내세운 독자 종교를 폈음
  mapNote: 지도에는 744년부터 999년까지 라바트·살레에서 사피 쪽까지의 대서양 평야를 표시
  endNote: 1058~1059년 알모라비드 운동과 싸워 그 지도자 압둘라 이븐 야신을 죽였으나 1060년 무렵 아부 바크르 이븐 우마르에게 정복됨
  features:
    - 중심은 타메스나 평야(지금 카사블랑카·라바트 둘레)
    - 살리흐 이븐 타리프가 예언자를 칭하고 베르베르어 경전을 내놓음
    - 코르도바와 사절을 주고받았으나 10세기 말 사이가 틀어짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알바크리, 『길과 나라들의 책』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 744년 타리프의 아들 살리흐가 바르가와타 부족을 이끌고 독자 종교를 선포한 때부터

- id: maghrawa-dynasty
  level: polity
  names: { ko: 마그라와 왕조, en: Maghrawa dynasty, native: مغراوة }
  from: 976
  to: 1080
  color: "#c26b4a"
  summary: 제나타 베르베르 마그라와족의 가문들이 코르도바 칼리프국을 받들며 시질마사와 모로코 북부를 다스린 왕조. 지리 이븐 아티야가 페스를 도읍으로 삼아 마그레브 서부의 강자가 되었으나 알모라비드 왕조에 밀려남
  mapNote: 지도에는 976년부터 999년까지 표시. 976년 시질마사(타필랄트), 987년 페스 둘레(가르브·타자·페스·오리엔탈)를 그림. 989~991년 자브에서 수스까지 미친 영향력은 땅으로 그리지 않음
  endNote: 1070년 무렵 알모라비드 왕조가 페스를 차지하고 1080~1081년 우지다·틀렘센까지 정복해 끝남
  features:
    - 도읍은 시질마사, 987년 무렵부터 페스
    - 987년 지리 이븐 아티야가 알만수르에게 마그레브 아미르로 임명됨
    - 994년 우지다를 세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 아비 자르, 『라우드 알키르타스』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 976~977년 하즈룬 이븐 풀풀이 미드라르 왕조의 시질마사를 차지한 때부터

- id: tulunid-dynasty
  level: polity
  names: { ko: 툴룬 왕조, en: Tulunid dynasty, native: الطولونيون }
  from: 868
  to: 905
  color: "#b0673a"
  summary: 투르크계 군인 아흐마드 이븐 툴룬이 아바스 칼리프국의 이집트 총독으로 와서 세운 왕조. 칼리프를 명목으로 받들며 이집트와 시리아를 다스려 이집트가 바그다드에서 갈라져 나간 첫 왕조가 됨
  mapNote: 지도에는 868년부터 904년까지 표시. 이집트와 키레나이카 해안, 878년 시리아 남부(다마스쿠스·팔레스타인·요르단), 886년 시리아 북부를 더하고 898년 알레포·킨나스린을 칼리프에게 돌려줌. 자지라·킬리키아(지금 튀르키예 쪽)는 비움
  endNote: 905년 1월 아바스 장군 무함마드 이븐 술라이만이 푸스타트에 들어와 툴룬 가문을 끌고 가 이집트가 다시 칼리프 직할이 됨
  features:
    - 도읍은 푸스타트 곁에 새로 지은 알카타이
    - 아흐마드 이븐 툴룬 모스크를 지음
    - 886년 조약으로 칼리프가 이집트·시리아를 30년 동안 맡김
    - 893년 후마라와이흐의 딸이 칼리프 알무타디드와 혼인함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알킨디, 『이집트 총독들의 책』", "타바리, 『예언자들과 왕들의 역사』"]
    foundingNote: 868년 9월 아흐마드 이븐 툴룬이 이집트 부총독으로 푸스타트에 들어온 때부터(칼리프의 정식 임명은 873년 무렵)

- id: ikhshidid-dynasty
  level: polity
  names: { ko: 이흐시드 왕조, en: Ikhshidid dynasty, native: الإخشيديون }
  from: 935
  to: 969
  color: "#7f9a3a"
  summary: 투르크계 무함마드 이븐 투그즈가 이집트 총독으로 와서 세운 왕조. 칼리프에게 '이흐시드' 칭호를 받아 명목으로 받들며 이집트·시리아 남부·히자즈를 다스렸고 그가 죽은 뒤 환관 카푸르가 실권을 쥠
  mapNote: 지도에는 935년부터 969년까지 표시. 이집트와 키레나이카 해안, 945년 시리아 남부(홈스 남쪽의 다마스쿠스·팔레스타인·요르단)와 히자즈·타부크·아시르(966년까지)를 더함. 이집트는 968년까지, 시리아 남부는 969년까지 그림
  endNote: 969년 파티마 장군 자우하르가 이집트를 정복하고 970년 시리아의 이흐시드 가문 총독이 라믈라에서 져 끝남
  features:
    - 도읍은 푸스타트
    - 939년 칼리프에게 소그드 왕호 '이흐시드'를 받음
    - 946~968년 환관 카푸르가 섭정하다 966년 스스로 다스림
    - 947년 함단 왕조의 사이프 앗다울라와 시리아를 나눔
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["알킨디, 『이집트 총독들의 책』", "알마크리지, 『히타트』"]
    foundingNote: 935년 8월 무함마드 이븐 투그즈가 이집트 총독으로 푸스타트에 들어온 때부터

- id: fatimid-caliphate
  level: polity
  names: { ko: 파티마 칼리프국, en: Fatimid Caliphate, native: الدولة الفاطمية }
  from: 909
  to: 1171
  color: "#1f7a4d"
  summary: 무함마드의 딸 파티마의 후손을 칭한 이스마일파 이맘들이 이프리키야에서 세운 칼리프국. 쿠타마 베르베르의 힘으로 아글라브 왕조를 무너뜨리고 969년 이집트를 정복해 카이로를 세웠으며 아바스에 맞선 시아파 칼리프로 지중해 남쪽을 다스림
  mapNote: 지도에는 909년부터 999년까지 표시. 909년 이프리키야·타헤르트, 921~931년 모로코 북부(페스)·서알제리, 969년 이집트·키레나이카 해안, 979년 팔레스타인·요르단, 983년 다마스쿠스·레바논을 그림. 972년부터 이프리키야는 지리 왕조로, 트리폴리타니아 해안은 977년까지 직할로 그림. 히자즈는 메카 샤리프국으로 따로 그림
  endNote: 1171년 살라딘이 금요 예배에서 마지막 칼리프 알아디드의 이름을 빼고 아바스 칼리프를 받들어 칼리프국이 끝남
  features:
    - 도읍은 라카다, 921년 마흐디야, 948년 만수리야, 973년 카이로
    - 910년 1월 알마흐디가 라카다에서 칼리프를 선포함
    - 969년 장군 자우하르가 이집트를 정복하고 카이로를 세움
    - 970~972년 카이로에 알아즈하르 모스크를 지음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["카디 알누만, 『포교의 시작』", "알마크리지, 『이티아즈 알후나파』"]
    foundingNote: 909년 3월 아부 압둘라 알시이의 쿠타마 군이 아글라브 왕조의 라카다에 들어간 때부터(910년 1월 알마흐디의 칼리프 선포를 시작으로 보기도 함)

- id: zirid-dynasty
  level: polity
  names: { ko: 지리 왕조, en: Zirid dynasty, native: الزيريون }
  from: 972
  to: 1148
  color: "#d07a8a"
  summary: 산하자 베르베르의 지리 이븐 마나드 가문이 파티마 칼리프국의 이프리키야 총독으로 세운 세습 왕조. 파티마가 이집트로 옮긴 뒤 카이라완을 중심으로 이프리키야를 다스렸고 11세기 중엽 파티마와 갈라섬
  mapNote: 지도에는 972년부터 999년까지 표시. 972년 튀니지·알제리 동부와 아시르·알제 둘레, 978년 트리폴리타니아 해안을 그림. 979~985년 부룩킨의 모로코 원정 땅은 그리지 않음
  endNote: 1148년 시칠리아 왕국의 노르만 함대가 마흐디야를 차지해 왕조가 끝남
  features:
    - 도읍은 카이라완 곁의 사브라 알만수리야, 1057년부터 마흐디야
    - 아버지 지리 이븐 마나드가 아시르를 세우고 부룩킨이 알제를 다시 세움
    - 1015년 하마드 가문이 알제리 쪽에서 갈라져 나감
    - 1050년대 바누 힐랄의 침입으로 내륙을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["이븐 이다리, 『알바얀 알무그리브』", "이븐 할둔, 『이바르의 책』"]
    foundingNote: 972년 파티마 칼리프 알무이즈가 이집트로 떠나며 부룩킨 이븐 지리를 이프리키야 총독으로 세운 때부터
