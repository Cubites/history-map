  mapNote: 지도에는 기원전 800년부터 741년까지 알레포·이들리브 둘레를 표시하고 740년부터 아시리아. 지금 튀르키예 쪽 북쪽 땅은 그리지 않음
  endNote: 기원전 740년 티글라트필레세르 3세가 3년 포위 끝에 아르파드를 무너뜨려 아시리아 속주로 삼음
