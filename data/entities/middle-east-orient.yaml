# middle-east orient 나라 (시대 파일 scripts/geo/areas/middle-east/orient.mjs의 짝 항목 파일, npm run new:area가 만든 빈 틀)
# 시대·범위: 기원전 800~551: 신아시리아·신바빌로니아·메디아 핵심·엘람·레반트 왕국, 이집트 25·26왕조·키레네·카르타고
# 나라를 넣을 때 아래 []를 지우고 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'middle-east-orient').
# 기원전 800년 전에 시작한 나라는 from을 실제 해로 적고 도형은 기원전 800년(−799)부터. 기원전 551년(−550) 뒤에도 이어지는 나라(neo-babylonian-empire·saite-egypt·cyrene-kingdom)는
# 항목이 middle-east-ancient.yaml에 있으므로 여기 두지 않는다(두 항목 파일에 같은 id를 두지 않음).
# 칸 나눔(a5-plan 3절): 구현 A5a(동)는 '# ── A5a 동 ──' 칸, A5b(서)는 '# ── A5b 서 ──' 칸 아래에만 쓴다. 맨 위 []는 나라를 넣는 쪽이 지운다(두 쪽이 같이 지워도 합칠 때 같은 고침).

# ── A5a 동 (신아시리아·신바빌로니아 앞쪽 제외·메디아 핵심·엘람·이스라엘·유다·다마스쿠스 등) ──
# ── A5a-1 메소포타미아·이란 (2026-11-02): 신아시리아(본토·자지라·바빌로니아 글)·바빌로니아 왕국·메디아·신엘람·안샨 ──
- id: neo-assyrian-empire
  level: polity
  names: { ko: 신아시리아 제국, en: Neo-Assyrian Empire, native: Māt Aššur }
  from: -910
  to: -608
  color: "#9c3d54"
  summary: 티그리스강 중류의 아슈르·니네베를 중심으로 메소포타미아와 레반트를 다스리고 한때 이집트까지 차지한 아시리아의 마지막 제국
  mapNote: 아다드니라리 2세가 왕이 된 기원전 911년을 시작으로 봄. 지도에는 기원전 800년부터 표시. 메소포타미아 쪽은 기원전 800년부터 이라크 북부(니네베·아슈르·아르빌·키르쿠크·술라이마니야)와 시리아 자지라(하부르강·발리크강·중간 유프라테스)를 표시하고, 아시리아 왕이나 그가 세운 왕이 바빌론을 다스린 729~722년과 710~627년에는 이라크 중부(바빌론)도 표시. 615년부터 키르쿠크(아라파)는 메디아, 612년 니네베가 무너진 뒤 이라크 북부는 메디아·아슈르는 신바빌로니아로 그리고, 남은 시리아 자지라도 609년 하란이 무너져 신바빌로니아로 넘어감. 레반트는 기원전 740년 아르파드(알레포·이들리브), 732년 다마스쿠스·하우란·베카·시리아 해안·갈릴리·해안 평야·길르앗과 공물을 바친 페니키아·필리스티아·암몬·모압·에돔 북부, 722년 사마리아, 720년 하맛과 홈스·팔미라 사막을 더함. 이스라엘(722년까지)·유다·하맛(720년까지)은 아시리아를 받든 속국으로 따로 그림. 609년부터 시리아·레바논·팔레스타인·요르단은 비움(네코 2세의 시리아 지배는 5년 미만이라 칠하지 않음). 네게브·요르단 남부 사막과 아라비아의 아랍 부족 땅은 칠하지 않음. 이집트에서는 에사르하돈이 멤피스를 얻은 기원전 671~670년과 아슈르바니팔이 타하르카를 몰아낸 667~665년에 하이집트(삼각주와 멤피스·파이윰·헤라클레오폴리스)를 표시하고, 타하르카가 되찾은 669~668년은 쿠시 왕조로 표시. 기원전 664년부터 657년까지 사이스 왕조는 아시리아를 받든 종속 왕국으로 따로 그림. 기원전 663년 테베 약탈과 상이집트·서부 사막은 칠하지 않음. 자그로스의 속주(파르수아·비트함반·하르하르)와 칼데아 부족이 쥔 이라크 남쪽 바닷가는 경계가 기록에 없어 칠하지 않음. 지금 튀르키예 남동부(하란·카르케미시 둘레)와 아나톨리아는 칠하지 않음
  endNote: 기원전 612년 메디아와 신바빌로니아에 니네베가 함락되고, 하란으로 옮긴 아슈르우발리트 2세가 609년 하란을 되찾지 못해 나라가 끝남
  features:
    - 칼후(님루드)·두르샤루킨·니네베로 도읍을 옮기며 궁전 부조와 왕 비문을 남김
    - 해마다 연명관(림무) 이름을 붙인 목록이 남아 기원전 763년 일식이 연대의 기준이 됨
    - 티글라트필레세르 3세(기원전 745~727)가 정복지를 속주로 나누고 주민을 대규모로 옮김
    - 아슈르바니팔(기원전 669~631)이 니네베 궁전에 쐐기문자 서판을 모음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아시리아 연명관(림무) 목록", "아시리아 왕 비문(연대기)", "『바빌로니아 연대기』"]
    foundingNote: 아다드니라리 2세가 왕이 되어 아시리아가 다시 넓어지기 시작한 기원전 911년부터

- id: babylonia-kingdom
  level: polity
  names: { ko: 바빌로니아 왕국, en: Kingdom of Babylon, native: Bābili }
  from: -973
  to: -709
  color: "#d4b13a"
  summary: 바빌론을 도읍으로 이라크 중부를 다스린 바빌로니아의 토착 왕국
  mapNote: 지도에는 기원전 800년부터 표시. 기원전 800~730년과 721~711년 이라크 중부(바빌론·바그다드·디얄라·와시트와 서쪽 사막)를 표시하고, 아시리아 왕이나 그가 세운 왕이 바빌론을 다스린 729~722년과 710년부터는 신아시리아 제국으로 그림. 칼데아 부족이 쥔 남쪽 바닷가(바스라·마이산·디카르)는 경계가 기록에 없어 칠하지 않음
  endNote: 기원전 710년 사르곤 2세가 바빌론에 들어가 마르두크아플라이딘나 2세를 몰아냄. 그 뒤 바빌론 왕위는 아시리아 왕이나 그가 세운 사람이 이음
  features:
    - 나보나사르(기원전 747~734) 때부터 『바빌로니아 연대기』가 해마다 일을 적기 시작함
    - 칼데아 부족 비트야킨 출신 마르두크아플라이딘나 2세가 엘람과 손잡고 아시리아에 맞섬
    - 기원전 720년 엘람 군대가 데르에서 사르곤 2세를 막아 바빌론의 자립이 10년 넘게 이어짐
    - 기원전 8세기에는 칼데아·아람 부족이 바빌로니아 시골을 나눠 쥠
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『바빌로니아 연대기』", "바빌로니아 왕 목록", "아시리아 왕 비문(연대기)"]
    foundingNote: 바빌론의 8왕조(E 왕조)가 시작된 기원전 974년 무렵부터

- id: media-kingdom
  level: polity
  names: { ko: 메디아 왕국, en: Media, native: Māda }
  from: -614
  to: -549
  color: "#8bab3a"
  summary: 이란 서부 자그로스산맥의 엑바타나(지금 하마단)를 중심으로 한 메디아인의 왕국
  mapNote: 『바빌로니아 연대기』에 메디아 군대가 아라파(키르쿠크) 둘레에 나타난 기원전 615년을 시작으로 봄. 지도에는 기원전 615년부터 하마단·마르카지·케르만샤·쿠르디스탄·로레스탄·일람과 키르쿠크를, 612년부터 니네베·두호크·아르빌·술라이마니야를 더해 표시하고 550년부터 아케메네스 제국으로 그림. 헤로도토스가 전하는 넓은 메디아 제국(이란 중부·북부·아제르바이잔)은 당대 기록이 없어 칠하지 않고, 이 땅은 기원전 550년부터 아케메네스 제국으로 그림. 기원전 585년 리디아와 할리스강을 경계로 삼은 아나톨리아 쪽도 칠하지 않음
  endNote: 기원전 550년 안샨 왕 키루스 2세가 아스티아게스를 사로잡고 엑바타나를 차지함
  features:
    - 기원전 614년 아슈르를 무너뜨린 뒤 바빌로니아의 나보폴라사르와 손잡음
    - 키악사레스의 군대가 기원전 612년 바빌로니아군과 함께 니네베를 함락함
    - 고딘 테페·누시잔·바바잔 같은 자그로스 고원의 요새 마을 유적이 남음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『바빌로니아 연대기』", "『나보니두스 연대기』", "헤로도토스, 『역사』 1권"]
    foundingNote: 『바빌로니아 연대기』가 메디아 군대를 처음 적은 기원전 615년부터

- id: elam-neo-elamite
  level: polity
  names: { ko: 신엘람 왕국, en: Neo-Elamite kingdom, native: Haltamti }
  from: -759
  to: -549
  color: "#2a9d8f"
  summary: 후제스탄 평야의 수사를 중심으로 한 엘람의 마지막 왕국
  mapNote: 지도에는 기원전 760년부터 551년까지 후제스탄(수사·마다크투)을 표시하고 550년부터 아케메네스 제국으로 그림. 아슈르바니팔이 기원전 647~646년 수사를 약탈한 뒤에도 엘람 왕이 이어져 아시리아 땅으로 칠하지 않음. 안샨 쪽 고지(바흐티아리·코길루예)는 경계가 기록에 없어 칠하지 않음
  endNote: 기원전 646년 무렵 아슈르바니팔에게 수사가 약탈된 뒤 약해졌고, 기원전 6세기 중엽 키루스 2세의 아케메네스 제국에 들어감(수사의 아케메네스 지배는 540년 무렵 확인됨)
  features:
    - 기원전 720년 훔반니카시 1세가 데르에서 사르곤 2세와 싸워 바빌로니아를 도움
    - 기원전 653년 울라이강 싸움에서 테움만이 아슈르바니팔에게 져 죽음
    - 엘람어 쐐기문자로 왕 비문과 행정 서판을 남기고 수사의 인슈시나크 신을 섬김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["아시리아 왕 비문(아슈르바니팔 연대기)", "『바빌로니아 연대기』"]
    foundingNote: 바빌로니아 기록에 이름이 나오는 첫 신엘람 왕 훔반타흐라가 다스린 기원전 760년 무렵부터

- id: anshan-kingdom
  level: polity
  names: { ko: 안샨 왕국, en: Kingdom of Anshan, native: Anšan }
  from: -558
  to: -549
  color: "#b0703a"
  summary: 파르스 지방의 안샨(지금 탈레 말리얀)을 도읍으로 한 테이스페스 왕조의 페르시아 왕국
  mapNote: 키루스 2세가 왕이 된 기원전 559년을 시작으로 봄. 앞 왕 테이스페스·키루스 1세·캄비세스 1세의 해와 땅은 당대 기록이 없어 칠하지 않음. 지도에는 기원전 559년부터 파르스·부셰르를 표시하고 550년부터 아케메네스 제국으로 그림. 메디아의 종속이었다는 이야기는 헤로도토스에만 있어 따로 잇지 않음
  endNote: 기원전 550년 키루스 2세가 메디아의 아스티아게스를 이기고 엑바타나를 차지해 아케메네스 제국으로 이어짐
  features:
    - 『나보니두스 연대기』와 키루스 원통이 키루스를 ‘안샨 왕’으로 부름
    - 키루스 원통이 테이스페스·키루스 1세·캄비세스 1세를 키루스 2세의 조상으로 적음
    - 도읍 안샨은 옛 엘람의 고지 도시로 지금 시라즈 북쪽 탈레 말리얀 유적
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『나보니두스 연대기』", "키루스 원통"]
    foundingNote: 키루스 2세가 안샨 왕이 된 기원전 559년부터
# ── A5a-1 끝 ──

# ── A5a-2 레반트 (아람 다마스쿠스·이스라엘·유다·하맛·아르파드) ──
- id: aram-damascus
  level: polity
  names: { ko: 아람 다마스쿠스, en: Aram-Damascus, native: ארם דמשק }
  from: -852
  to: -731
  color: "#c2547e"
  summary: 다마스쿠스를 도읍으로 시리아 남부를 다스린 아람인의 왕국
  mapNote: 아시리아 기록에 처음 나오는 기원전 853년(카르카르 싸움)을 시작으로 봄. 지도에는 기원전 800년부터 733년까지 다마스쿠스와 둘레 사막·하우란·골란을 표시하고 732년부터 아시리아. 하자엘 때 넓힌 요르단강 동쪽과 베카는 당대 문서로 경계를 잡을 수 없어 비움
  endNote: 기원전 732년 티글라트필레세르 3세가 다마스쿠스를 무너뜨리고 르신을 죽여 아시리아 속주로 삼음
  features:
    - 하자엘(기원전 842~796 무렵)이 이스라엘을 눌러 레반트 남부의 맹주가 됨
    - 기원전 796년 아다드니라리 3세가 다마스쿠스를 쳐 공물을 받음
    - 벤하닷 3세가 하즈락에서 하맛 왕 자쿠르를 에워쌌으나 물러남
    - 르신이 기원전 738년 아시리아에 공물을 바쳤다가 이스라엘과 손잡고 맞섬
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["샬마네세르 3세의 쿠르흐 비문", "자쿠르 비문", "티글라트필레세르 3세 연대기"]
    foundingNote: 다마스쿠스 왕 하다드에제르가 아시리아에 맞선 연합을 이끈 기원전 853년부터(아시리아 기록에 처음 나옴)

- id: israel-kingdom
  level: polity
  names: { ko: 이스라엘 왕국 (북왕국), en: Kingdom of Israel (Samaria), native: מַמְלֶכֶת יִשְׂרָאֵל }
  from: -852
  to: -721
  color: "#d9a521"
  summary: 사마리아를 도읍으로 한 이스라엘 사람들의 북쪽 왕국
  mapNote: 성서 연대의 나라 시작(기원전 930년 무렵) 대신 아시리아 기록에 아합이 처음 나오는 기원전 853년을 시작으로 봄. 지도에는 기원전 800년부터 723년까지 표시. 기원전 800~733년 갈릴리·이스르엘 골짜기·해안 평야·사마리아 구릉과 요르단강 동쪽 길르앗, 732년 갈릴리·해안·길르앗이 아시리아 속주가 된 뒤 사마리아 구릉만 표시하고 722년부터 아시리아(사르곤 2세가 내세운 720년 설도 있음). 길르앗은 여로보암 2세 때 되찾은 모습을 앞당긴 어림이고, 『열왕기』의 '하맛 어귀부터 아라바 바다까지'는 후대 서술이라 칠하지 않음
  endNote: 기원전 722년 아시리아가 3년 포위 끝에 사마리아를 무너뜨리고 주민을 옮겨 속주로 삼음
  features:
    - 예후가 샬마네세르 3세에게 엎드려 공물을 바치는 모습이 검은 오벨리스크에 새겨짐
    - 사마리아 왕궁 터의 항아리 조각 글에 여로보암 2세 때 기름·포도주 납부 기록이 남음
    - 므나헴이 기원전 738년 티글라트필레세르 3세에게 공물을 바쳐 아시리아를 받듦
    - 베가가 다마스쿠스와 손잡고 맞서다 기원전 732년 갈릴리·길르앗을 잃음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["샬마네세르 3세의 쿠르흐 비문·검은 오벨리스크", "사마리아 오스트라카", "티글라트필레세르 3세 연대기", "『열왕기』 하권"]
    foundingNote: 아합이 카르카르 싸움에 군사를 보낸 기원전 853년부터(아시리아 기록에 처음 나옴)

- id: judah-kingdom
  level: polity
  names: { ko: 유다 왕국, en: Kingdom of Judah, native: מַמְלֶכֶת יְהוּדָה }
  from: -839
  to: -586
  color: "#7d4fa3"
  summary: 예루살렘을 도읍으로 다윗 왕가가 다스린 이스라엘 사람들의 남쪽 왕국
  mapNote: 성서 연대의 나라 시작(기원전 930년 무렵) 대신 텔 단 비문에 '다윗의 집'이 나오는 기원전 840년 무렵을 시작으로 봄. 지도에는 기원전 800년부터 588년까지 유다 구릉·베냐민·쉐펠라 남부·브엘세바 골짜기를 표시하고 587년부터 신바빌로니아(586년 설도 있음). 701년 센나케리브에게 쉐펠라 일부를 잃은 것과 요시야의 북쪽 확장(성서 서술뿐)은 그리지 않고, 남쪽 네게브 사막은 비움
  endNote: 기원전 587년 네부카드네자르 2세가 예루살렘을 무너뜨리고 시드기야를 사로잡아 나라가 끝남
  features:
    - 아하스가 기원전 734년 티글라트필레세르 3세에게 공물을 바쳐 아시리아 속국이 됨
    - 히스기야가 기원전 701년 센나케리브의 원정에 라기스를 잃고 예루살렘에서 버팀
    - 요시야가 기원전 609년 므깃도에서 이집트 왕 네코 2세에게 져 죽음
    - 기원전 597년 예루살렘이 처음 함락되고 왕이 바뀐 일이 바빌로니아 연대기에 적힘
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["텔 단 비문", "센나케리브 연대기", "바빌로니아 연대기", "라기스 문서", "『열왕기』 하권"]
    foundingNote: 아람 왕의 텔 단 비문에 '다윗의 집'이 나오는 기원전 840년 무렵부터

- id: hamath-kingdom
  level: polity
  names: { ko: 하맛 왕국, en: Kingdom of Hamath, native: חמת }
  from: -852
  to: -719
  color: "#5f9a48"
  summary: 오론테스강 가의 하마를 도읍으로 한 시리아 중부의 왕국
  mapNote: 아시리아 기록에 처음 나오는 기원전 853년(카르카르 싸움)을 시작으로 봄. 지도에는 기원전 800년부터 721년까지 하마 둘레를 표시하고 720년부터 아시리아. 738년 티글라트필레세르 3세가 북쪽·해안 고을을 속주로 떼어 간 뒤에는 아시리아를 받든 속국. 홈스 쪽 오론테스 상류와 팔미라 사막은 하맛 땅으로 적은 당대 문서가 없어 비움
  endNote: 기원전 720년 사르곤 2세가 카르카르에서 하맛 왕 야우비디의 반란을 누르고 하맛을 속주로 삼음
  features:
    - 도읍 하마의 성채 언덕(텔 하마)에서 철기 시대 왕궁과 성문 터가 발굴됨
    - 자쿠르 비문에 하맛과 루아시의 왕 자쿠르가 하즈락에서 포위를 견딘 일이 새겨짐
    - 앞선 왕들은 루위어 상형문자 비문을, 자쿠르는 아람어 비문을 남김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["샬마네세르 3세의 쿠르흐 비문", "자쿠르 비문", "사르곤 2세 연대기"]
    foundingNote: 하맛 왕 이르훌레니가 카르카르 싸움에 나오는 기원전 853년부터(아시리아 기록에 처음 나옴)

