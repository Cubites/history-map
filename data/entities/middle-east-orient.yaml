# ── A5b 서 (이집트 25왕조 등·키레네 앞쪽 제외·카르타고 제외) ──
- id: kushite-egypt
  level: polity
  names: { ko: 이집트 제25왕조 (쿠시 왕조), en: Twenty-fifth Dynasty of Egypt, native: Kmt }
  from: -746
  to: -656
  color: "#9c6b30"
  summary: 나일강 상류 누비아의 쿠시 왕들이 북쪽으로 내려와 이집트를 다스린 왕조
  mapNote: 카슈타가 엘레판티네에서 테베까지 권위를 넓힌 기원전 747년 무렵을 시작으로 봄(754년·744년으로 보는 설도 있음). 지도에는 기원전 747년부터 테바이스(아스완~소하그), 728년(피예의 원정)부터 헤라클레오폴리스까지의 상이집트, 714년(쿠시의 삼각주 장악 — 새 연대로는 샤바타카, 옛 연대로는 샤바카의 일이며 712년으로 보는 설도 있음)부터 시나이를 뺀 지금 이집트(서부 사막의 오아시스·동부 사막은 지금 국경으로 그린 근사)를 표시. 아시리아가 하이집트를 차지한 기원전 671~670년·667~665년과 사이스 왕조가 하이집트를 다스린 664~657년에는 상이집트만 표시. 기원전 800~715년의 삼각주는 여러 군주가 나눠 다스린 분열기라 칠하지 않음. 쿠시 왕국 본토(나파타, 지금 수단)는 지도 범위 밖
  endNote: 기원전 656년 프삼티크 1세가 딸 니토크리스를 테베의 아몬 신의 아내 후계로 입양시켜 상이집트를 얻고, 타누타문은 누비아로 물러남
  features:
    - 카슈타가 딸 아메니르디스 1세를 테베의 아몬 신의 아내 후계로 세움
    - 피예가 하이집트까지 쳐내려가 삼각주 군주들의 항복을 받고 승전비를 세움
    - 타하르카가 멤피스에서 왕관을 받고 테베와 누비아에 신전을 크게 지음
    - 기원전 671년 에사르하돈, 667년 아슈르바니팔의 아시리아군에게 하이집트를 빼앗김
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["피예 승전비", "타누타문 꿈 석비", "에사르하돈·아슈르바니팔 연대기", "헤로도토스, 『역사』 2권"]
    foundingNote: 쿠시 왕 카슈타가 엘레판티네와 테베에 권위를 세운 기원전 747년 무렵부터

