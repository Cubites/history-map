    foundingNote: 독립을 선언한 1991년 9월 9일을 시작으로 봄

# ── C1 E ──
- id: yettishar
  level: polity
  names: { ko: 예티샤르, en: Yettishar, native: يەتتە شەھەر }
  from: 1865
  to: 1878
  color: "#2a8aa0"
  summary: 야쿱 벡이 카슈가르를 중심으로 타림 분지와 투루판에 세운 나라. 1878년 청에 무너짐
  endNote: 1877년 5월 야쿱 벡이 죽은 뒤 청군이 12월 카슈가르·야르칸드를, 1878년 1월 호탄을 되찾아 무너짐
  features:
    - 코칸트 칸국의 장군 야쿱 벡이 1865년 카슈가르에 들어와 세움
    - 1867년 호탄·악수·쿠차, 1870년 투루판·우루무치까지 넓힘
    - 1873년 오스만 술탄의 종주를 받아들여 에미르 칭호를 받음
    - 러시아(1872)·영국(1874)과 통상 조약을 맺음
    - 1876~1877년 좌종당이 이끈 청군에게 우루무치·투루판을 잃음
