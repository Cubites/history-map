# central-asia modern 나라 (시대 파일 scripts/geo/areas/central-asia/modern.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1865~현재: 러시아 정복 뒤 나라들
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-modern').
# 칸 나눔(C1 뼈대 2026-11-05, c1/COMMON.md '새 항목 표'): 구현 C1-A는 '# ── C1 A ──', C1-W는 '# ── C1 W ──', C1-E는 '# ── C1 E ──' 머리 아래 자기 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml 중앙아시아 첫판과 같음)이라 바꾸지 않는다(색은 --only colors 새 실패가 나면 정의 칸이 그 색만).
#   from·to는 표의 어림 — 정의 칸이 사료로 고친다(항목 from은 성립 해, 지도 첫 버전은 1865 — 결정 맞춤 10). native는 정의 칸이 원어판 위키로 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features·basis.foundingNote·startEvents·endEvents도 그 칸이 더함).
#   다른 칸이 칠하기만 하는 항목(uzbekistan의 UZ-XO·UZ-QR 등)의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다.
# 기존 나라(europe.yaml russia·soviet-union = W 칸, china.yaml qing·roc·prc = E 칸)는 이 파일에 두지 않고 그 파일 블록에서 고친다.

# ── C1 A ──
- id: afghanistan
  level: polity
  names: { ko: 아프가니스탄, en: Afghanistan, native: افغانستان }
  from: 1823
  to: null
  color: "#1f4a5a"
  summary: 카불을 도읍으로 한 나라로, 바라크자이 왕조의 토후국에서 왕국·공화국·이슬람 토후국으로 이어짐. 1880~1919년 영국이 외교를 맡음
  mapNote: 지도에는 1865년부터 표시함. 북부 칸국(1873)·바다크샨과 와한 회랑(1883)·하자라자트(1893)·카피리스탄(1896)을 차례로 더했고, 경계는 1873년 영러 협정·1893년 듀랜드선 협정·1895년 파미르 협정에 기댄 어림(하자라자트·카피리스탄 경계는 지구 이름에 기댄 어림). 1883~1894년에는 판지강 건너 슈그난·로샨·와한 오른쪽 기슭도 차지했으나 1895년 파미르 협정으로 러시아 쪽에 넘김. 1879~1880년 영국군 점령과 1979~1989년 소련군 주둔은 칠하지 않음. 1996~2001년 탈레반 정권이 대부분을 차지했고 북부 동맹이 북동부(약 6.5만 km²)를 지켰으나 지도에는 한 나라로 칠함
  features:
    - 1863년 도스트 무함마드 칸이 헤라트를 차지해 카불·칸다하르·헤라트·발흐를 한 나라로 묶음
    - 1873년 영러 협정으로 아무다리야강·판지강 남쪽 땅이 아프가니스탄 몫으로 인정됨
    - 압두르 라흐만 칸(1880~1901)이 바다크샨·하자라자트·카피리스탄을 정복하고 1893년 듀랜드선을 정함
    - 1919년 라왈핀디 조약으로 외교권을 되찾고 1926년 아만알라가 왕을 칭함
    - 1973년 공화국, 1978년 민주 공화국, 1992년 이슬람 국가, 1996년·2021년 탈레반의 아프가니스탄 이슬람 토후국
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Emirate of Afghanistan", "영러 협정(1873)", "간다마크 조약(1879)", "듀랜드선 협정(1893)", "라왈핀디 조약(1919)"]
    foundingNote: 바라크자이 가문이 카불을 차지해 나라를 세운 1823년(위키백과 정보 상자의 성립 해)을 시작으로 봄. 1834년부터 에미르(토후) 칭호

- id: khiva-khanate
  level: polity
  names: { ko: 히바 칸국, en: Khanate of Khiva, native: خیوه خانلیگی }
  from: 1511
  to: 1924
  color: "#5a6ab0"
  summary: 아무다리야강 하류 호라즘 오아시스의 칸국으로, 도읍은 히바. 1873년 러시아의 보호국이 됨
  mapNote: 지도에는 1865년부터 1923년까지 표시함(1920~1923년 호라즘 인민 소비에트 공화국 포함). 1872년까지는 아무다리야강 양쪽, 1873년부터 왼쪽 기슭의 오아시스와 다쇼구즈 쪽. 경계는 아무다리야강·우스튜르트 고원 가장자리·옛 아랄해 기슭에 기댄 어림이고, 남쪽 카라쿰의 투르크멘 부족 땅은 넣지 않음
  endNote: 1920년 2월 칸이 물러나 호라즘 인민 소비에트 공화국이 되었고, 1924년 10월 민족 경계 획정으로 우즈베크·투르크멘 소비에트 공화국과 카라칼파크 자치주에 나뉘어 들어감
  features:
    - 1511년 일바르스가 세운 칸국으로, 1804년부터 쿵그라트 왕조가 다스림
    - 1873년 러시아군이 히바를 점령하고 겐데미안 조약으로 아무다리야강 오른쪽 기슭을 내줌
    - 1918~1920년 투르크멘 지도자 주나이드 칸이 실권을 쥠
    - 1920~1924년 호라즘 인민 소비에트 공화국
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khanate of Khiva", "겐데미안 조약(1873)"]
    foundingNote: 일바르스가 호라즘에 칸국을 세운 1511년을 시작으로 봄

- id: turkmenistan
  level: polity
  names: { ko: 투르크메니스탄, en: Turkmenistan, native: Türkmenistan }
  from: 1991
  to: null
  color: "#a0503a"
  summary: 1991년 10월 소련에서 독립한 나라로, 도읍은 아시가바트. 1995년 유엔 총회가 영세 중립국 지위를 인정함
  mapNote: 1991년 지도는 소련으로 그리고 영토는 1992년부터
  features:
    - 1924년 민족 경계 획정으로 투르크멘 소비에트 사회주의 공화국이 세워짐
    - 1991년 10월 국민 투표 뒤 독립을 선언함
    - 1995년 12월 유엔 총회가 영세 중립국 지위를 인정함
    - 사파르무라트 니야조프(1990~2006)가 종신 대통령으로 다스림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["투르크메니스탄 독립 선언(1991)", "유엔 총회 결의 50/80 A(1995)"]
    foundingNote: 독립을 선언한 1991년 10월 27일을 시작으로 봄

# ── C1 W ──
- id: bukhara-emirate
  level: polity
  names: { ko: 부하라 토후국, en: Emirate of Bukhara, native: امارت بخارا }
  from: 1785
  to: 1924
  color: "#b0703a"
  summary: 부하라를 도읍으로 망기트 왕조의 에미르가 다스린 토후국(에미르국). 1868년 사마르칸트를 러시아에 내주고 보호국이 됨
  endNote: 1920년 9월 붉은 군대가 부하라를 차지해 마지막 에미르 알림 칸이 달아나고 부하라 인민 소비에트 공화국이 세워졌으며, 1924년 소련의 민족 경계 획정으로 우즈베크·투르크멘·타지크 공화국에 나뉘어 들어감
  mapNote: 지도에는 1865년부터. 동부 부하라(히사르·쿨롭·카라테긴·다르바즈)와 샤흐리삽즈는 1870~1878년 무렵 차례로 병합했으나 1868년부터 한꺼번에 넣었고, 1920~1923년 부하라 인민 소비에트 공화국도 같은 색으로 그림. 경계는 지금 주 경계와 강·산줄기에 기댄 어림
  features:
    - 1785년 샤 무라드가 에미르를 칭해 망기트 왕조의 토후국이 됨
    - 1866년 후잔드·우라튜베·지작을 러시아에 빼앗기고 1868년 사마르칸트·카타쿠르간을 내줌
    - 1868년 러시아의 보호국이 된 뒤 샤흐리삽즈(1870)·다르바즈(1878 무렵) 등 동쪽 벡국들을 병합함
    - 1920년 부하라 인민 소비에트 공화국으로 바뀌었다가 1924년 소련의 민족 경계 획정으로 사라짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Emirate of Bukhara", "러시아–부하라 강화 조약(1868)"]
    foundingNote: 망기트 가문이 실권을 잡은 1747년 등 여러 해가 있으나 샤 무라드가 에미르를 칭한 1785년을 시작으로 봄

- id: kokand-khanate
  level: polity
  names: { ko: 코칸트 칸국, en: Khanate of Kokand, native: خوقند خانليغى }
  from: 1709
  to: 1876
  color: "#d8c060"
  summary: 페르가나 분지의 코칸트를 도읍으로 한 칸국. 1865년 타슈켄트를 러시아에 잃고 1876년 병합됨
  endNote: 1875년 반란으로 후다야르 칸이 쫓겨나고 뒤를 이은 나스르 앗딘 칸이 러시아에 맞서자, 러시아가 1876년 2월 칸국을 없애고 페르가나주로 삼음
  mapNote: 지도에는 1865년부터. 1865년 후잔드는 부하라 토후국이 차지하고 있어 넣지 않았고, 나린 등 톈산 안쪽의 키르기스 땅은 내전으로 떨어져 나가 비움. 경계는 페르가나 분지 둘레 산줄기에 기댄 어림
  features:
    - 1709년 무렵 샤 루흐 비가 페르가나 분지에 세운 우즈베크 정권에서 시작함
    - 19세기 초 타슈켄트와 시르다리야강 쪽 초원까지 넓혔으나 1865년 러시아에 타슈켄트를 잃음
    - 1868년 러시아와 통상 조약을 맺고 사실상 보호국이 됨
    - 1876년 러시아에 병합되어 페르가나주가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khanate of Kokand", "러시아–코칸트 통상 조약(1868)"]
    foundingNote: 샤 루흐 비가 코칸트 쪽에서 부하라로부터 떨어져 나와 다스리기 시작한 1709년 무렵을 시작으로 봄

- id: uzbekistan
  level: polity
  names: { ko: 우즈베키스탄, en: Uzbekistan, native: Oʻzbekiston }
  from: 1991
  to: null
  color: "#5aa860"
  summary: 1991년 8월 31일 소련에서 독립을 선언한 중앙아시아의 나라. 도읍은 타슈켄트
  mapNote: 1991년 지도는 소련으로 그리고 영토는 1992년부터
  features:
    - 1924년 소련의 민족 경계 획정으로 우즈베크 소비에트 사회주의 공화국이 세워짐
    - 1936년 카라칼파크 자치 공화국을 넣어 지금의 국경 모양을 거의 갖춤
    - 1991년 8월 31일 독립을 선언하고 12월 독립 국가 연합에 들어감
    - 2005년 안디잔에서 일어난 시위를 군대가 진압해 많은 사람이 죽음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["우즈베키스탄 독립 선언(1991)", "알마아타 의정서(1991)"]
    foundingNote: 독립을 선언한 1991년 8월 31일을 시작으로 봄

- id: kyrgyzstan
  level: polity
  names: { ko: 키르기스스탄, en: Kyrgyzstan, native: Кыргызстан }
  from: 1991
  to: null
  color: "#e08a2a"
  summary: 1991년 8월 31일 소련에서 독립을 선언한 중앙아시아의 나라. 도읍은 비슈케크
  mapNote: 1991년 지도는 소련으로 그리고 영토는 1992년부터
  features:
