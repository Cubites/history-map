    - 1991년 8월 31일 독립을 선언하고 12월 독립 국가 연합에 들어감
    - 2005년 튤립 혁명으로 아카예프 대통령이 물러남
    - 2010년 정변으로 바키예프 대통령이 물러나고 남부 오시에서 민족 충돌이 일어남
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["키르기스스탄 독립 선언(1991)", "알마아타 의정서(1991)"]
    foundingNote: 독립을 선언한 1991년 8월 31일을 시작으로 봄

- id: tajikistan
  level: polity
  names: { ko: 타지키스탄, en: Tajikistan, native: Тоҷикистон }
  from: 1991
  to: null
  color: "#9a6ab8"
  summary: 1991년 9월 9일 소련에서 독립을 선언한 중앙아시아의 나라. 도읍은 두샨베
  mapNote: 1991년 지도는 소련으로 그리고 영토는 1992년부터
  features:
