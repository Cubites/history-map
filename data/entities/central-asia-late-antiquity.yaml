# central-asia late-antiquity 나라 (시대 파일 scripts/geo/areas/central-asia/late-antiquity.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1~599: 쿠샨·사산·에프탈·이스테미 야브구국·타림 오아시스
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-late-antiquity').
# 칸 나눔(C4 뼈대 2026-11-07, ca4/c4/COMMON.md 4·5·6절): 구현 칸 SW·W·N·E는 아래 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다. from·to는 C4 결정 표의 값 — 정의 칸이 사료로 한 번 확인(다르면 결과 노트 2절).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis.foundingNote도 — COMMON 6절, startEvents·endEvents는 사건 ca-01 몫이라 빈 목록 그대로).
# 늘린 나라와 C3 항목은 이 파일에 두지 않고 그 파일 블록에서 고친다(COMMON 5절).

# ══ C4 SW 항목 ══
# from 450(B9), 지도는 키다라가 무너진 467년부터 박트리아 북쪽, 484~564 아리아·메르브·시스탄(Q4). 600년부터는 같은 땅을 C3 tokhara-yabghus가 이어 그림(S6)
- id: hephthalites
  level: polity
  names: { ko: 에프탈, en: Hephthalites, native: ηβοδαλο }
  from: 450
  to: 599
  color: "#4084bf"
  summary: 박트리아(토하리스탄)를 근거지로 중앙아시아 남부를 다스린 유목 왕조. 5세기 중엽 일어나 467년 무렵 키다라 왕국을 밀어내고 발흐를 차지했고, 484년 사산 제국의 페로즈 1세를 싸움에서 죽인 뒤 헤라트·메르브·시스탄까지 넓혀 사산에게서 공물을 받음
  endNote: 560년 무렵 돌궐과 사산 제국의 호스로 1세에게 양쪽에서 공격당해 크게 진 뒤 나라가 무너지고, 아무다리야 남쪽 토하리스탄에는 에프탈 계열의 작은 제후국들이 돌궐을 받들며 남음
  mapNote: 지도에는 467년부터 599년까지 박트리아(지금 아프가니스탄 북부와 수르한다리야·타지키스탄 남부)를 그리고, 484~564년 헤라트·바드기스와 시스탄, 메르브 오아시스·코페트다그 북쪽 기슭·아무다리야 왼쪽 기슭을 더함. 560년 무렵 나라가 무너진 뒤 토하리스탄의 제후국들도 같은 색으로 이어 그리고(568년부터 이스테미 야브구국을 받듦), 600년부터 같은 땅을 토하리스탄 야브구국으로 그림. 소그디아나와 타림 분지 서쪽에 미친 힘은 칠하지 않음. 경계는 지금 주 경계에 기댄 어림
  features:
    - 484년 사산 제국의 페로즈 1세를 무찌르고 죽임
    - 498년 무렵 사산의 카바드 1세가 에프탈의 도움으로 왕위를 되찾음
    - 박트리아어를 그리스 문자로 적은 문서와 주화를 남김
    - 간다라의 알촌 훈족과는 따로 셈
  startEvents: [hephthalite-rise-450]
  endEvents: [hephthalite-tokharistan-484, istami-western-turks-553]
  basis:
    type: primary_source
    refs: ["위키백과 Hephthalites", "위키백과 Peroz I"]
    foundingNote: 5세기 중엽(450년 무렵) 박트리아 쪽에서 일어난 것으로 보며, 키다라 왕국을 밀어내고 발흐를 차지한 467년 무렵부터 땅을 그림

