# ══ C4 N 항목 ══
# 돌궐 제1 카간국의 서쪽 야브구 정권(Q6): from 553, 지도 555~602(600~602는 C3 early-medieval.mjs E1 머리 줄을 N 칸이 고쳐 칠함), 603년부터 C3 western-turkic-khaganate
#   vassal_of gokturk 553~582(relations.yaml N 머리 — gokturk 항목 끝 582)
- id: istami-yabghu-state
  level: polity
  names: { ko: 이스테미 야브구국, en: Yabghu state of Istämi, native: Istämi }
  from: 553
  to: 602
  color: "#40bf73"
  summary: 돌궐 제1 카간국의 서쪽을 맡은 이스테미와 그 아들 타르두의 야브구 정권. 부민 카간의 동생 이스테미가 서쪽 원정을 맡아 세미레치예와 시르다리야 쪽을 차지하고, 사산과 손잡고 에프탈을 무너뜨림
  endNote: 타르두가 동쪽 카간들과 다투다 599년 스스로 카간을 칭했으나 603년 무렵 사라졌고, 그 서쪽 땅은 603년 동쪽과 완전히 갈라진 서돌궐 카간국으로 이어짐
  features:
    - 553년 무렵 이스테미가 야브구로서 돌궐 서쪽을 맡음
    - 560년 무렵 사산과 손잡고 에프탈을 쳐 소그디아나·토하리스탄 쪽을 거느림
    - 568년 소그드 상인 마니아크를 동로마에 보내 동맹을 맺음
    - 575년 무렵 이스테미가 죽고 아들 타르두가 뒤를 이음
  mapNote: 지도에는 555년부터 602년까지, 세미레치예와 일리 골짜기, 시르다리야 중류 도시 띠(투르키스탄·오트라르·크질오르다 쪽)를 그림(뒤의 서돌궐 카간국과 같은 땅). 소그디아나·에프탈 쪽은 조공을 받은 나라라 따로 그리고 종속으로 표시함. 582년까지 돌궐 제1 카간국의 종속으로 표시함. 경계는 카라타우 산줄기와 지금 주 경계에 기댄 어림
  startEvents: [istami-western-turks-553]
  endEvents: [istami-western-turks-553]
  basis:
    type: primary_source
    refs: ["『수서』 서돌궐전", "위키백과 Istämi", "위키백과 Tardu", "위키백과 Western Turkic Khaganate"]
    foundingNote: 이스테미가 야브구로서 서쪽을 맡은 553년 무렵을 시작으로 보고, 지도는 세미레치예를 차지한 555년부터 그림

