# 글은 NEC-M3 칸이 채움 — 위키 ko 표제('신네덜란드'는 사전 avoid). from 1614(거래소), 칠함 1624~1663(G3-25), 1673~1674 재점령은 글(G3-15)
- id: new-netherland
  level: polity
  names: { ko: 뉴네덜란드, en: New Netherland, native: Nieuw-Nederland }
  from: 1614
  to: 1664
  color: "#66b234"
  summary: 허드슨강 둘레의 네덜란드 식민지. 1614년 네덜란드 연방의회가 이 땅의 교역 특허를 내주며 이름이 생겼고, 1621년 서인도 회사가 세워진 뒤 1624년 네덜란드 공화국의 속주가 되어 이주민을 보냄. 맨해튼섬 남쪽 끝의 뉴암스테르담과 허드슨강 위쪽 교역소(지금 올버니)에서 레나페·모호크 사람들과 모피를 사고팔았음. 1655년 페터르 스타위베산트 총독이 델라웨어강의 스웨덴 식민지를 차지함. 1664년 8월 27일 잉글랜드 함대에 항복해 뉴욕과 뉴저지가 되었고, 1673년 8월 네덜란드가 다시 차지했으나 1674년 웨스트민스터 조약으로 잉글랜드에 돌려줌
  mapNote: 지도에는 1624년부터 1663년까지 지금 뉴욕·뉴저지·델라웨어를 칠함(1638년부터 1655년까지 델라웨어강 하류의 스웨덴 식민지 땅도 함께 칠함). 1673년 8월부터 1674년 11월까지 다시 차지한 때는 뉴욕 식민지 땅으로 그림
  endNote: 1664년 8월 27일 잉글랜드에 항복해 뉴욕·뉴저지 식민지가 되어 없어짐
  features:
    - 1614년 교역 특허로 이름이 생김
    - 1624년 네덜란드 공화국의 속주가 됨
    - 1655년 델라웨어강의 스웨덴 식민지를 차지함
    - 1664년 잉글랜드 함대에 항복
    - 1673년부터 1674년까지 네덜란드가 잠깐 되찾음
  startEvents: [hudson-cupids-1609]
  endEvents: [breda-1664]
  basis:
    type: primary_source
    refs: ["위키백과 New Netherland", "위키백과 Delaware Colony"]
    foundingNote: 1614년 네덜란드 연방의회가 뉴네덜란드 교역 특허를 낸 때부터(속주는 1624년)
# 글은 NEC-M3 칸이 채움 — 위키 ko 표제. 1664 뉴네덜란드 항복, 버몬트 1763(G3-29)
- id: province-of-new-york
  level: polity
  names: { ko: 뉴욕 식민지, en: Province of New York, native: Province of New York }
  from: 1664
  to: 1776
  color: "#a63f68"
  summary: 1664년 뉴네덜란드를 차지해 세운 잉글랜드 식민지. 찰스 2세가 동생 요크 공작 제임스에게 이 땅을 주었고, 1664년 8월 잉글랜드 함대가 뉴암스테르담을 받아 뉴욕으로 이름을 고침. 1685년 제임스가 왕위에 오르며 왕령 식민지가 되었고, 1688년부터 1689년까지 뉴잉글랜드 자치령에 묶임. 모호크강 둘레의 이로쿼이 연맹과 손잡고 모피 무역과 누벨프랑스와의 싸움을 꾸렸고, 1764년 국왕 판정으로 코네티컷강 서쪽(지금 버몬트)을 얻음. 1776년 독립을 선언함
  mapNote: 지도에는 1664년부터 1775년까지 지금 뉴욕을 칠함(1673년 8월부터 1674년 11월까지 네덜란드가 다시 차지한 때도 뉴욕 식민지로 그림). 1664년부터 1681년까지는 지금 델라웨어를, 1763년부터 1775년까지는 지금 버몬트를 함께 그림. 서쪽 내륙은 실제로 이로쿼이 연맹이 다스린 땅
  endNote: 1776년 독립 선언으로 미국의 한 주가 되어 없어짐
  features:
    - 1664년 요크 공작이 뉴네덜란드를 차지해 세움
    - 1685년 제임스 2세 즉위로 왕령 식민지가 됨
    - 이로쿼이 연맹과 손잡고 모피 무역을 꾸림
    - 1764년 국왕 판정으로 지금 버몬트 땅을 얻음
  startEvents: [breda-1664]
  endEvents: [boston-tea-party-1773]
  basis:
