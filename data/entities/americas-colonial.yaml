  summary: 세인트로렌스강 둘레에 프랑스가 세운 식민지. 1534년 자크 카르티에가 세인트로렌스만을 탐험했고, 1608년 사뮈엘 드 샹플랭이 퀘벡을 세워 모피 교역 식민지로 자랐음. 1663년 국왕 직할 식민지가 되었고, 1701년 디트로이트를 세우고 같은 해 몬트리올 대평화로 오대호 둘레 원주민과 화친해 오대호까지, 1753년 오하이오강으로 가는 요새들을 세워 오하이오 영토까지 넓혔음. 7년 전쟁 중 1759년 퀘벡, 1760년 몬트리올이 영국군에 항복했고 1763년 파리 조약으로 영국에 넘어감. 오대호와 오하이오 땅은 실제로 휴런·오타와·마이애미 같은 원주민이 다스렸음
  mapNote: 지도에는 1608년부터 1762년까지 세인트로렌스강 물길(지금 퀘벡 남부)을 칠하고, 1701년부터 오대호 둘레(지금 온타리오 남부·미시간·위스콘신·미네소타 동부)를, 1753년부터 오하이오 영토(지금 오하이오·인디애나)를 명목상 이 식민지 땅으로 함께 그림(실제 지배는 디트로이트 같은 요새와 교역소 몇 곳)
  endNote: 1763년 2월 10일 파리 조약으로 영국에 넘어가 없어짐
