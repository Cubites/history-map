  mapNote: 지도에는 1630년부터 1653년까지 표시함. 1630년 페르남부쿠, 1635년부터 파라이바·히우그란지두노르치·알라고아스·세르지피·세아라까지, 1641년부터 1643년까지 마라냥을 더해 그리고, 1644년부터는 페르남부쿠·파라이바·히우그란지두노르치만 그림. 1624년부터 1625년까지 바이아를 차지한 것은 1년이 못 되어 따로 칠하지 않음
