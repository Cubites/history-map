  summary: 매사추세츠 북쪽 피스캐터쿼강 둘레의 잉글랜드 왕령 식민지. 1629년 존 메이슨이 이 땅을 받아 뉴햄프셔라 이름 지었고, 1641년부터 바닷가 마을들이 매사추세츠만 식민지의 다스림을 받음. 1679년 찰스 2세의 헌장으로 따로 왕령 식민지가 되어 1680년 1월 첫 의장이 일을 맡음. 1686년부터 1689년까지 뉴잉글랜드 자치령에 묶였고, 1691년 다시 따로 섬. 내륙은 아베나키 사람들의 땅이었고, 1749년부터 코네티컷강 서쪽에 땅 특허를 내주다 1764년 국왕 판정으로 뉴욕에 넘김. 1776년 독립을 선언함
