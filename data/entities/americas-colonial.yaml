# americas colonial 나라 (시대 파일 scripts/geo/areas/americas/colonial.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 아메리카 식민 시대(1492~1775) (M3 — docs/americas/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'americas-colonial' → 필터 단위 americas).
# M3 뼈대(2026-11-17)가 1492~1775에 칠하는(또는 땅 없이 싣는) 새 항목 25개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 m3/COMMON.md 4절 표, 표 원천 m3/skel/entities.tsv).
#   색은 자기 색 — 뼈대가 같은 해 맞닿는 이웃·식민 단위의 본국(spain·england·uk·france·portugal·dutch-republic)·usa·앞 잇는 M2·M1 항목과 ΔE 26 넘게,
#   앞뒤로 이어지는 단위끼리도 서로 다르게 골랐다(m3/skel/tools/dm3.mjs — 최소 33.9).
#   level은 polity, indian-reserve(땅 있는 지역)·muisca(땅 없는 지역)만 region(스키마는 polity·region뿐 — polity는 basis 필수라 정의 칸이 씀).
#   to는 끝난 해 = 칠한 마지막 해 + 1(미포함). from은 성립 해(1492 앞이면 그 해 그대로 — 지도는 1492부터, 1491 앞은 M4). 첫 버전 해가 from보다 늦어도 됨(P7).
#   땅 없는 둘(muisca·neo-inca-state)은 시대 파일 versions에 없다(결정 Q4 A — mapNote '지도에는 땅을 그리지 않음').
#   이름은 위키백과 한국어판 표제로 확인했다(m3/skel/ko-titles.txt — 표제가 없거나 다른 가칭은 블록 머리 주석).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — m3/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 2묶음 몫이라 빈 목록 그대로).
#   from·to는 칸이 사료로 고칠 수 있다(P7 — 고치면 결과 노트 2절에 한 줄). id·색·이름·level은 고치지 않는다.
#   앞 잇는 M2 항목 19는 data/entities/americas-independence.yaml, M1 항목 6은 data/entities/americas-modern.yaml 그 자리 블록(파일 소유표 — m3/COMMON.md 5절).

# ══ M3 NEC-M3 항목 (뉴잉글랜드·중부) ══
# 글은 NEC-M3 칸이 채움 — 위키 ko 표제('매사추세츠 베이 식민지'는 사전 avoid). 1629 헌장, 1691 왕령 헌장(플리머스 합침)은 글
- id: massachusetts-bay
  level: polity
  names: { ko: 매사추세츠만 식민지, en: Massachusetts Bay Colony, native: Massachusetts Bay Colony }
  from: 1629
  to: 1776
  color: "#dba784"
  summary: 보스턴을 중심으로 한 잉글랜드의 뉴잉글랜드 식민지. 1629년 3월 찰스 1세가 매사추세츠만 회사에 헌장을 주었고, 이듬해 존 윈스럽이 이끈 청교도 이주민이 와서 보스턴에 자리 잡음. 1641년부터 1679년까지 북쪽 뉴햄프셔 마을들을 함께 다스렸고, 1686년부터 1689년까지는 뉴잉글랜드 자치령에 묶임. 1691년 10월 윌리엄 3세와 메리 2세의 새 왕령 헌장으로 플리머스 식민지와 메인을 합쳐 왕령 매사추세츠만 식민지가 됨. 땅은 본디 왐파노아그·매사추세트·아베나키 사람들의 땅이었고, 1675년부터 1676년까지 필립 왕 전쟁으로 남부 뉴잉글랜드 원주민의 힘이 꺾임. 1775년 렉싱턴과 콩코드에서 싸움이 터졌고 1776년 독립을 선언함
  mapNote: 지도에는 1629년부터 1775년까지 지금 매사추세츠를 칠함(지금 로드아일랜드 땅도 함께 칠함). 1641년부터 1678년까지는 지금 뉴햄프셔를, 1691년부터 1775년까지는 지금 메인을 함께 그림(메인 내륙은 실제로 아베나키 사람들의 땅)
  endNote: 1776년 7월 독립 선언으로 미국의 한 주가 되어 없어짐
  features:
    - 1629년 3월 찰스 1세의 헌장으로 매사추세츠만 회사가 세움
    - 1630년 청교도 이주민이 보스턴에 자리 잡음
    - 1641년부터 1679년까지 뉴햄프셔 마을들을 다스림
    - 1691년 왕령 헌장으로 플리머스 식민지와 메인을 합침
  startEvents: [new-england-1629]
  endEvents: [boston-tea-party-1773]
  basis:
    type: primary_source
    refs: ["위키백과 Massachusetts Bay Colony", "위키백과 Province of Massachusetts Bay", "위키백과 Thirteen Colonies"]
    foundingNote: 1629년 3월 4일 찰스 1세가 매사추세츠만 회사에 헌장을 준 때부터
# 글은 NEC-M3 칸이 채움 — 위키 ko 표제. 1636 건설·1662 헌장
- id: connecticut-colony
  level: polity
  names: { ko: 코네티컷 식민지, en: Connecticut Colony, native: Connecticut Colony }
  from: 1636
  to: 1776
  color: "#b251bd"
  summary: 코네티컷강 둘레의 잉글랜드 식민지. 1636년 토머스 후커 등이 매사추세츠에서 옮겨 와 하트퍼드·윈저·웨더스필드에 자리 잡았고, 이듬해 피쿼트 전쟁으로 피쿼트 사람들을 꺾음. 1662년 찰스 2세의 헌장으로 자치를 인정받으며 남쪽 바닷가의 뉴헤이븐 식민지를 합침. 총독을 스스로 뽑는 자치 식민지로 1776년까지 이어졌고, 그해 독립을 선언함
  mapNote: 지도에는 1636년부터 1775년까지 지금 코네티컷을 칠함
  endNote: 1776년 독립 선언으로 미국의 한 주가 되어 없어짐
  features:
    - 1636년 하트퍼드·윈저·웨더스필드에 자리 잡음
    - 1637년 피쿼트 전쟁으로 피쿼트 사람들을 꺾음
    - 1662년 찰스 2세의 헌장으로 뉴헤이븐 식민지를 합침
