  summary: 친춘찬을 도읍으로 지금 미초아칸 땅을 다스린 원주민 나라. 1300년 무렵 미초아칸 고원의 파츠쿠아로 호숫가에서 타리아쿠리가 푸레페차 사람들을 묶었고, 뒤를 이은 히리판과 탕가쑤안이 파츠쿠아로·친춘찬·이우아치오 세 도읍을 두고 둘레를 정복함. 1435년 무렵 쿠이트세오 호수 둘레로 넓혔고, 1450년 무렵 레르마강과 발사스강 사이 약 7만 5천 km²를 차지한 뒤 1460년 발사스강 하구에서 태평양 해안에 닿음. 1479년 무렵 아즈텍 삼각 동맹의 침공을 물리쳐 메소아메리카에서 둘째로 큰 나라로 남았고, 동쪽 국경에 요새를 두고 아즈텍과 맞섬. 1522년 마지막 왕이 스페인에 복속을 약속했으나 1530년 2월 스페인 정복자에게 처형되며 끝남
  mapNote: 지도에는 1435년부터 1529년까지 그림. 1435년부터 1449년까지는 파츠쿠아로·쿠이트세오 두 호수 분지와 그 서쪽 고원을, 1450년부터는 지금 미초아칸주 대부분과 과나후아토주 남쪽, 게레로주 북서쪽 발사스강 유역과 그 하구의 태평양 해안을 그림(1460년에 닿은 해안도 1450년부터 함께 그림). 1480년부터 1510년까지 초석 광산을 두고 싸우다 물러난 할리스코·콜리마 땅은 그리지 않음
  endNote: 1530년 2월 마지막 왕이 스페인 정복자에게 처형되며 끝남
  features:
