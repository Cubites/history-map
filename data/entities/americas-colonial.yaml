  level: polity
  names: { ko: 아즈텍 삼각 동맹, en: Aztec Triple Alliance, native: Ēxcān Tlahtōlōyān }
  from: 1428
  to: 1521
  color: "#3fa673"
  summary: 테노치티틀란·텍스코코·틀라코판 세 도시의 동맹이 멕시코 중부를 다스린 나라. 1428년 세 도시가 아스카포찰코를 중심으로 멕시코 분지를 누르던 테파넥을 함께 물리치고 동맹을 맺었고, 이츠코아틀이 분지 남쪽 도시들과 1439년 쿠아우나와크(지금 쿠에르나바카)를 정복함. 몬테수마 1세(1440~1469) 때 동쪽 멕시코만 중부와 남쪽 믹스테카 알타로, 악사야카틀 때 톨루카 계곡으로, 아우이소틀(1486~1502) 때 오악사카 계곡과 게레로 태평양 해안까지 넓혀 정복한 지방마다 공물을 거두는 방식으로 다스렸고, 군주 틀라토아니가 테노치티틀란에서 동맹을 이끎. 틀락스칼라 같은 이웃 나라는 끝까지 굴복하지 않았고, 1479년 무렵 서쪽 타라스코 왕국에 크게 진 뒤로는 국경 요새를 두고 맞섬. 1519년 에르난 코르테스가 이끈 스페인군이 상륙해 틀락스칼라와 손잡았고, 1521년 8월 13일 테노치티틀란이 함락되며 끝남
  mapNote: 지도에는 1440년부터 1520년까지 삼각 동맹이 공물을 받던 땅을 그림. 1440년부터 1468년까지는 멕시코 분지와 모렐로스, 1469년부터 1485년까지는 톨루카 계곡과 동쪽 멕시코만 중부, 남쪽 믹스테카 알타 북쪽과 게레로 북부까지, 1486년부터는 오악사카 계곡과 게레로 태평양 해안, 북쪽 우아스테카 남부까지 넓힌 땅을 그림. 그 안에 끝까지 독립을 지킨 틀락스칼라 같은 작은 나라 땅도 같은 색으로 그렸고, 1500년 무렵 정복한 남쪽 태평양 해안의 외딴 지방(지금 치아파스 남쪽 끝)은 그리지 않음
  endNote: 1521년 8월 13일 테노치티틀란이 스페인군과 원주민 동맹군에 함락되어 끝남
