    foundingNote: 1300년 무렵 미초아칸 고원에서 나라가 일어난 때부터(지도는 1435년부터)

# ══ M3 AND-M3 항목 (안데스·라플라타·1492 잉카) ══
# 글은 AND-M3 칸이 채움 — 위키 ko 표제·사전(아메리카 첫판 — '타완틴수유'는 넘겨주기). from 1438, 칠함 1492~1532(C-M3-12), 손 도형 AND3_CUT_INCA
- id: inca
  level: polity
  names: { ko: 잉카 제국, en: Inca Empire, native: Tawantinsuyu }
  from: 1438
  to: 1533
  color: "#a6543f"
  summary: 쿠스코를 도읍으로 안데스를 다스린 나라. 1438년 찬카를 물리치고 즉위한 파차쿠티가 쿠스코 둘레의 나라를 타완틴수유로 넓히기 시작했고, 1463년부터 아들 투팍 잉카 유팡키가 군대를 이끌어 북쪽으로 나아가 1470년까지 치무 왕국과 키토를 정복함. 투팍 잉카 유팡키는 1471년 왕위에 올라 다스리는 동안 남쪽 칠레 마울레강까지 정복함. 우아이나 카팍이 지금 에콰도르 북쪽에 땅을 조금 더했고, 그가 죽은 뒤 우아스카르와 아타우알파 형제가 왕위를 두고 싸움. 1532년 11월 프란시스코 피사로가 카하마르카에서 아타우알파를 사로잡아 이듬해 8월 처형했고, 1533년 11월 쿠스코에 들어가 제국을 무너뜨림. 길과 역참으로 넓은 땅을 이어 다스렸음
  endNote: 1533년 11월 스페인군이 쿠스코에 들어가며 끝남. 망코 잉카 유팡키가 1537년 빌카밤바로 물러나 세운 신잉카국이 1572년까지 이어짐
  mapNote: 지도에는 1438년부터 1532년까지 표시함. 1438년부터 1462년까지 쿠스코 분지·우루밤바·아푸리막강 일대와 찬카 땅(아야쿠초·우안카벨리카), 1463년부터 1469년까지 북쪽 카하마르카에서 남쪽 티티카카호·포오포호 호수까지의 안데스와 친차에서 타라파카까지의 해안, 1470년부터 1480년까지 여기에 치무 왕국이 다스리던 북부 해안과 리마 계곡, 키토까지의 에콰도르 고원을 더해 그림. 1481년부터는 투팍 잉카 유팡키가 다스리던 땅(키토에서 칠레 마울레강까지의 안데스 고원과 태평양 해안, 볼리비아 고원, 아르헨티나 북서쪽)을 그리는데, 남쪽과 동쪽을 정복한 해가 전하지 않아 그의 치세 가운데 해인 1481년부터 그리며, 안데스 동쪽 아마존 저지와 에콰도르 서쪽 해안 저지는 비움. 우아이나 카팍이 북쪽에 더한 땅은 더한 해가 분명하지 않아 그리지 않음. 1533년부터는 그 땅을 스페인이 차지한 해에 따라(페루·에콰도르 고원 1533년, 볼리비아 서쪽 1538년, 칠레 북중부 1541년, 아르헨티나 북서쪽 1559년) 누에바카스티야 총독부(1542년부터 페루 부왕령) 색으로 그림
  features:
    - 도읍은 쿠스코
    - 1438년 파차쿠티가 넓히기 시작함
    - 1470년 치무 왕국을 정복함
    - 1532년 카하마르카에서 아타우알파가 사로잡힘
    - 1533년 스페인군이 쿠스코에 들어감
  startEvents: []
  endEvents: [inca-conquest-1529]
  basis:
    type: primary_source
    refs: ["위키백과 Inca Empire", "위키백과 Spanish conquest of the Inca Empire"]
    foundingNote: 파차쿠티가 타완틴수유를 세운 1438년부터
