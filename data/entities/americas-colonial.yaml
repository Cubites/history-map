    - 1450년 무렵 레르마강과 발사스강 사이 땅을 묶음
    - 1479년 무렵 아즈텍의 침공을 물리침
    - 구리와 청동을 다루는 금속 기술이 뛰어남
    - 1530년 스페인에 정복됨
  startEvents: []
  endEvents: [nuno-guzman-1529]
  basis:
    type: primary_source
