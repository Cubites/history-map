  summary: 만주 사변(1931) 뒤 일제가 청의 마지막 황제 푸이를 내세워 세운 괴뢰 국가. 1933년 열하 작전으로 러허성을 편입했고, 탕구 정전 협정(1933)으로 만리장성이 중화민국과의 사실상 경계가 됨
  mapNote: 후룬베이얼(싱안베이성)은 일본군이 1932년 12월 5·6일 하이라르·만저우리를 점령한 뒤의 모습으로 1932년부터 표시함. 지도에는 일본에 종속된 나라로 표시 (일본 색 테두리). 몽골과의 경계는 노몬한 사건(1939) 이듬해 거의 소련·몽골 주장대로 정해진 오늘의 몽골·중국 국경으로 그려, 할하강과 노몬한 사이 지대는 몽골로 표시함
  endNote: 1945년 8월 소련군이 만주국을 무너뜨리고 일본이 항복함
  features:
