# 중국 왕조
# 3번 묶음(600~935): 한국사와 관계된 왕조만. 운영자 검수 필요.

- id: sui
  level: polity
  names: { ko: 수, hanja: 隋, en: Sui }
  from: 581
  to: 618
  color: "#6f8fb3"
  summary: 남북조를 통일한 왕조. 고구려 원정에 거듭 실패하고 멸망
  basis:
    type: primary_source
    refs: ["『수서』"]

- id: tang
  level: polity
  names: { ko: 당, hanja: 唐, en: Tang }
  from: 618
  to: 907
  color: "#5b7fa8"
  summary: 수를 이은 왕조. 신라와 연합해 백제·고구려를 무너뜨렸으나 나당 전쟁에서 물러남
  basis:
    type: primary_source
    refs: ["『구당서』", "『신당서』"]

# 당이 점령지를 다스리려고 둔 기구. 옛 나라의 색 위에 당의 색으로 빗금을 친다 (relations.yaml의 occupied_by).
# 나라가 아니므로 level: region으로 둔다.

- id: ungjin-dodokbu
  level: region
  names: { ko: 웅진도독부, hanja: 熊津都督府, en: Ungjin Commandery }
  from: 660
  to: 676
  color: "#7d9b5b"
  summary: 당이 백제를 멸망시킨 뒤 옛 백제 땅을 다스리려고 둔 기구. 664년 의자왕의 아들 부여융을 도독으로 삼음(663년이라는 기록도 있음). 671년 신라가 사비 일대를 차지하고 소부리주를 두면서 힘을 잃었고, 676년 요동의 건안성으로 옮겨짐
  basis:
    type: primary_source
    refs: ["『삼국사기』 백제본기 의자왕 20년", "『구당서』 백제전"]

- id: andong-dohobu
  level: region
  names: { ko: 안동도호부, hanja: 安東都護府, en: Protectorate General to Pacify the East }
  from: 668
  to: 756
  color: "#c8745a"
  summary: 당이 고구려를 멸망시킨 뒤 평양에 둔 기구. 나당 전쟁으로 676년 요동으로 물러났고, 8세기 중엽 안사의 난 무렵 사실상 없어짐
  basis:
    type: primary_source
    refs: ["『삼국사기』 고구려본기 보장왕 27년", "『구당서』 지리지"]
    foundingNote: 요동으로 옮긴 뒤 폐지된 시기는 기록에 따라 차이가 있어, 지도에서는 756년(안사의 난 직후)까지로 봄

- id: later-liang
  level: polity
  names: { ko: 후량, hanja: 後梁, en: Later Liang }
  from: 907
  to: 923
  color: "#7e93ad"
  summary: 당을 무너뜨리고 화북에 세워진 5대 첫 왕조. 지도에는 화북만 표시 (남쪽의 10국은 표시하지 않음)
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]

- id: later-tang
  level: polity
  names: { ko: 후당, hanja: 後唐, en: Later Tang }
  from: 923
  to: 936
  color: "#6a86a6"
  summary: 후량을 이은 5대 두 번째 왕조. 지도에는 화북만 표시 (남쪽의 10국은 표시하지 않음)
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]

# ── 4번 묶음 (936 ~ 1392) ──

- id: later-jin
  level: polity
  names: { ko: 후진, hanja: 後晉, en: Later Jin }
  from: 936
  to: 946
  color: "#7e93ad"
  summary: 거란의 도움으로 세운 5대 세 번째 왕조. 그 대가로 연운 16주를 거란에 넘김 (938)
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]

- id: later-han
  level: polity
  names: { ko: 후한, hanja: 後漢, en: Later Han }
  from: 947
  to: 950
  color: "#6a86a6"
  summary: 5대 네 번째 왕조
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]

- id: later-zhou
  level: polity
  names: { ko: 후주, hanja: 後周, en: Later Zhou }
  from: 951
  to: 959
  color: "#7e93ad"
  summary: 5대 마지막 왕조. 후주 사람 쌍기가 고려에 귀화해 과거제 실시를 건의함
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]

- id: song
  level: polity
  names: { ko: 송, hanja: 宋, en: Song }
  from: 960
  to: 1279
  color: "#5f86b5"
  summary: 조광윤이 세운 왕조. 문치주의로 국방력이 약해 요·서하·금에 시달렸고, 1127년 금에 화북을 빼앗긴 뒤 강남에서 남송으로 이어짐. 고려와 활발히 교류
  basis:
    type: primary_source
    refs: ["『송사』"]
    foundingNote: 지도에서는 960년부터 강남까지 표시하지만, 남쪽 나라들을 모두 통합한 것은 978년(오월 귀순)이고, 북한을 멸망시켜 10국 통합을 마친 것은 979년

- id: ming
  level: polity
  names: { ko: 명, hanja: 明, en: Ming }
  from: 1368
  to: 1644
  color: "#b5564a"
  summary: 주원장이 원을 몰아내고 세운 한족 왕조. 1387년 요동을 차지하고 고려에 철령 이북 땅을 요구함
  basis:
    type: primary_source
    refs: ["『명사』"]

# ── 6번 묶음 (1592 ~ 1876) ──

- id: qing
  level: polity
  names: { ko: 청, hanja: 淸, en: Qing }
  from: 1636
  to: 1912
  color: "#c49a3c"
  summary: 홍타이지가 후금의 국호를 바꿔 세운 왕조. 병자호란으로 조선과 군신 관계를 맺고, 1644년 베이징에 들어가 중국을 지배함. 1860년 베이징 조약으로 연해주를 러시아에 넘김
  basis:
    type: primary_source
    refs: ["『청사고』", "『인조실록』"]

# ── 7번 묶음 (1876 ~ 1945) ──

- id: roc
  level: polity
  names: { ko: 중화민국, hanja: 中華民國, en: Republic of China }
  from: 1912
  to: null
  color: "#b8504a"
  summary: 신해혁명(1911)으로 청이 무너지고 세워진 공화국. 대한민국 임시정부와 한국광복군을 지원함. 1949년 국공 내전에서 져 타이완으로 옮김
  basis:
    type: primary_source
    refs: ["『중화민국 임시약법』", "국사편찬위원회 『한국독립운동사』"]
    foundingNote: 외몽골은 1921년 독립한 뒤 지도에서 비워 둠

- id: manchukuo
  level: polity
  names: { ko: 만주국, hanja: 滿洲國, en: Manchukuo }
  from: 1932
  to: 1945
  color: "#a58b5c"
  summary: 만주 사변(1931) 뒤 일제가 청의 마지막 황제 푸이를 내세워 세운 괴뢰 국가. 지도에는 일본에 종속된 나라로 표시 (일본 색 테두리). 1933년 열하 작전으로 러허성을 편입했고, 탕구 정전 협정(1933)으로 만리장성이 중화민국과의 사실상 경계가 됨
  basis:
    type: primary_source
    refs: ["『리턴 조사단 보고서』"]

- id: occupied-china
  level: region
  names: { ko: 중일 전쟁 일본군 점령지, en: Japanese-occupied China }
  from: 1937
  to: 1945
  color: "#b8504a"
  summary: 중일 전쟁 때 일본군이 차지한 중국 땅. 1937년 말에는 화북·내몽골 남부(베이핑·톈진·장자커우·바오터우·타이위안·지난)와 상하이~난징~항저우 일대가 쉬저우 일대를 사이에 두고 따로 떨어져 있었음. 1938년 5월 쉬저우를 점령해 두 지역을 이었고, 10월에는 우한과 광저우까지 넓힘. 중화민국 정부는 충칭으로 옮겨 저항함. 실제 점령은 점과 선 위주였으며 지도는 대략적인 범위
  basis:
    type: primary_source
    refs: ["국사편찬위원회 우리역사넷 『한국사 연대기』 중일전쟁", "일본 방위청 방위연수소 전사실, 『전사총서』 지나사변 육군작전 1·2", "『중화민국사』"]
    foundingNote: 1937년 지도는 그해 말(난징 12월 13일, 항저우 12월 24일, 지난 12월 27일, 타이안 12월 31일 함락 뒤)의 범위임. 베이핑은 7월 29일(입성식 8월 8일), 톈진은 7월 30일, 상하이는 11월 12일에 점령됨. 충밍섬(1938년 3월 18일)과 칭다오(1938년 1월 10일)는 1938년에 점령되어 1937년 지도에서 뺌. 1938년 지도는 그해 10월 우한·광저우 점령 뒤의 범위임

# ── 8번 묶음 (1945 ~ 현재) ──

- id: prc
  level: polity
  names: { ko: 중화인민공화국, hanja: 中華人民共和國, en: People's Republic of China }
  from: 1949
  to: null
  color: "#c9433a"
  summary: 국공 내전에서 이긴 중국 공산당이 세운 나라. 6·25 전쟁에 군대를 보냈고(1950), 1992년 대한민국과 수교함
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『한국사』"]

# ── 귀속 논쟁 지역 (2026-09-27): 후보 나라들의 색을 번갈아 빗금으로 칠한다 (relations.yaml의 claimed_by) ──

- id: liaodong-disputed
  level: region
  names: { ko: 요동 (귀속 논쟁), en: Liaodong (disputed) }
  from: 756
  to: 925
  color: "#b7ae9c"
  summary: 안동도호부가 요서로 물러나 없어진 뒤 요동의 귀속은 학설이 갈린다. 발해가 선왕 때(9세기 전반) 요동까지 차지했다는 견해, 당의 영향력이 남았거나 고구려 유민 세력(이른바 소고구려)이 있었다는 견해가 있고, 10세기 초에는 거란이 진출했다. 926년 발해를 멸망시킨 요의 땅이 됨
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『신편 한국사』 10 발해", "『신당서』 발해전", "『요사』 지리지"]
