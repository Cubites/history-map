- id: occupied-china
  level: region
  names: { ko: 중일 전쟁 일본군 점령지, en: Japanese-occupied China }
  from: 1937
  to: 1945
  color: "#b8504a"
  summary: 중일 전쟁 때 일본군이 차지한 중국 땅. 1937년 말에는 화북·내몽골 남부와 상하이~난징~항저우 일대를 차지했고, 1938년 5월 쉬저우를 점령해 두 지역을 이었으며 10월에는 우한과 광저우까지 넓힘. 1944년 이치고 작전으로 허난·후난·광시를 차지해 화북에서 광저우까지 이었으나 1945년 8월 항복함. 중화민국 정부는 충칭으로 옮겨 저항함
  details: 1937년 말에는 화북·내몽골 남부(베이핑·톈진·장자커우·바오터우·타이위안·지난)와 상하이~난징~항저우 일대가 쉬저우 일대를 사이에 두고 따로 떨어져 있었음. 1938년 5월 쉬저우를 점령해 두 지역을 이었고, 10월에는 우한과 광저우까지 넓힘. 그 뒤 하이난섬·난창·산터우(1939), 이창(1940), 닝보·사오싱·중탸오산과 홍콩(1941), 진화(1942), 레이저우반도(1943)를 더했고, 1944년 이치고 작전(대륙 타통 작전)으로 허난·후난·광시를 차지해 화북에서 광저우까지 이음. 1945년 5~7월 광시 대부분과 푸젠·저장 남부 해안에서 물러났고, 8월 항복함. 중화민국 정부는 충칭으로 옮겨 저항함
  mapNote: 1937년 지도는 그해 말(난징 12월 13일, 항저우 12월 24일, 지난 12월 27일, 타이안 12월 31일 함락 뒤)의 범위임. 베이핑은 7월 29일(입성식 8월 8일), 톈진은 7월 30일, 상하이는 11월 12일에 점령됨. 윈청·린펀(2~3월)과 샤먼(5월 13일)·진먼은 넣고, 황허 범람 지대(6월) 서쪽의 정저우·뤄양, 4월 일본군이 물러난 산시 남동부(창즈·진청), 1941년 5월까지 중국군이 지킨 중탸오산 남쪽 황허 북안과 허난 지위안·멍현, 뤼량산(산시 서부), 다볘산, 첸탕강 남쪽(사오싱·닝보), 영국령 홍콩과 포르투갈령 마카오는 뺌. 4월 21일~9월 3일 점령한 푸저우, 9월 말 잠깐 들어간 창사, 10월 4~31일 점령한 정저우는 그해 안에 물러나 넣지 않음. 12월 잠깐 들어간 두산과 난닝에서 프랑스령 인도차이나로 잇는 길은 넣지 않음. 광시 우저우(8월 16일 수복)·취안저우(8월 17일 수복), 후난 링링(8월 21일 수복), 광둥 자오칭은 남김. 실제 점령은 점과 선 위주였으며 지도는 해마다 그해 말(1945년은 8월 항복 무렵)의 대략적인 범위. 충밍섬(1938년 3월 18일)과 칭다오(1938년 1월 10일)는 1938년에 점령되어 1937년 지도에서 뺌. 1938년 지도는 그해 말(광저우 10월 21일, 우한 10월 26~27일, 웨양 11월 11일 함락 뒤)의 범위임. 전선 뒤의 유격 근거지와 1939년 3월까지 중국 쪽 장쑤성 정부가 지킨 장쑤 북부(화이인·옌청)는 면으로 칠함. 1939년 지도는 하이난섬(2월), 난창(3월), 중샹·징산, 산터우(6월 21일)·차오저우(6월 27일), 저우산(6월 23일), 창즈(8월), 친저우~난닝(11월 24일)을 더함. 진청은 1939년 8월 21일 물러났다가 1940년 4월 20일 다시 점령했으나 1939년부터 칠함. 1940년 지도는 샤오산(1월 22일), 이창(6월 12일)·사스·징먼을 더하고, 10월 말 물러난 난닝·친저우를 뺌. 1941년 지도는 사오싱·닝보(4월), 중탸오산·지위안(5월), 홍콩(12월 25일)을 더함. 1942년 지도는 저장·장시 작전(5~8월) 뒤에도 남긴 진화·란시·이우·둥양·우이 일대를 더하고, 8월에 물러난 취저우·리수이는 넣지 않음. 1943년 지도는 2월 점령한 레이저우반도(광저우만 포함)를 더하고, 12월 잠깐 들어간 창더는 넣지 않음. 1944년 지도는 이치고 작전으로 차지한 정저우(4월)·뤄양(5월 25일)과 핑한 철도, 창사(6월 18일)·헝양(8월 8일)·사오양(10월 2일)·링링, 구이린·류저우(11월 10~11일)·난닝(11월 24일), 시장 강 유역(우저우·자오칭 9월), 원저우(9월 9일)·푸저우(10월 4일)를 더함. 1945년 지도는 8월 항복 무렵의 범위로, 웨한 철도 남부(1월, 천저우·사오관)와 난양·라오허커우(3~4월)를 더하고, 중국군이 되찾은 광시 서부·중부(난닝 5월 27일, 류저우 6월 30일, 구이린 7월 28일)와 푸저우(5월 18일)·원저우(5~6월), 7월에 물러난 간저우를 뺌. 주장 강 삼각주(광둥 점령지)는 1938~1945년 모두 같은 네모꼴로 칠해서, 1939년 3월 함락된 장먼, 1940년 3월 함락된 중산, 1938년 12월 되찾은 후이저우도 1938년부터 점령지로 보임
  endNote: 1945년 5~7월 광시 대부분과 푸젠·저장 남부 해안에서 물러났고, 8월 일본이 항복하면서 점령지가 모두 사라짐
  features:
    - 1937년 말 화북·내몽골 남부와 상하이~난징~항저우 일대를 차지함
    - 1938년 5월 쉬저우를 점령해 두 지역을 이었고, 10월에는 우한과 광저우까지 넓힘
    - 점령지에 괴뢰 정권을 세움(1940, 왕징웨이의 난징 정부)
    - 1944년 이치고 작전으로 허난·후난·광시를 차지해 화북에서 광저우까지 이음
    - 중화민국 정부는 충칭으로 옮겨 저항함
  startEvents: [sino-japanese-occupation-1937]
  endEvents: [sino-japanese-occupation-1937]
  basis:
    type: primary_source
    refs: ["국사편찬위원회 우리역사넷 『한국사 연대기』 중일전쟁", "일본 방위청 방위연수소 전사실, 『전사총서』 지나사변 육군작전 1·2", "『중화민국사』"]
    foundingNote: 루거우차오 사건으로 중일 전쟁이 시작되고 일본군이 12월 난징을 함락한 1937년부터

