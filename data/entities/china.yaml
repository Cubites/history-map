# ── 6번 묶음 (1592 ~ 1876) ──

- id: qing
  level: polity
  names: { ko: 청, hanja: 淸, en: Qing }
  from: 1636
  to: 1912
  color: "#c49a3c"
  summary: 홍타이지가 후금의 국호를 바꿔 세운 왕조. 병자호란으로 조선과 군신 관계를 맺고, 1644년 베이징에 들어가 중국을 지배함. 1691년 외몽골(할하), 1720년 티베트, 1724년 칭하이(호쇼트부)를 차례로 복속함. 1860년 베이징 조약으로 연해주를 러시아에 넘김
  mapNote: 알라산의 호쇼트부는 1686년 허란산 서쪽을 목지로 받고 1697년 기(旗)로 편성되었으나, 지도에서는 외몽골과 함께 1691년부터 청 영토로 표시함. 에지나의 토르구트 기는 1753년에 설치됨. 조공국 베트남(통킹)은 넣지 않음. 1720년부터 티베트를 넣되(티베트 서쪽 끝 악사이친은 지금의 실효 지배선까지. 사람이 거의 살지 않는 고원으로, 영국이 1899년 매카트니-맥도널드 선으로 대부분을 청 쪽으로 제안했으나 청은 답하지 않음) 조공국 네팔·부탄과 시킴은 넣지 않고, 1684년 팅모스강 조약으로 라다크에 남은 라다크 동남부(한레·뎀촉 쪽)도 넣지 않음. 영국령 홍콩은 홍콩섬을 1842년, 주룽을 1860년, 신계를 1898년부터, 포르투갈령 마카오는 1887년부터 넣지 않음. 외몽골 서쪽 끝(호브드·알타이)은 18세기 중엽까지 준가르와 다툰 땅이지만 1691년부터 청으로 표시함. 신장은 지도 자료 범위 밖이라 칠하지 않음. 서남쪽은 오늘의 국경선으로 그려, 윈난 서부·남부(텅충·바오산·시솽반나)를 1644년부터 넣음(남명이 1659년 초까지, 삼번의 난 때 오삼계가 1673~1681년 윈난을 차지한 것은 따로 표시하지 않음). 티베트 남쪽(지금의 아루나찰프라데시 북부)은 대략 선으로 그림
  endNote: 1911년 우창 봉기로 시작된 혁명이 번져 1912년 1월 쑨원이 난징에서 임시 대총통에 올라 중화민국이 세워짐. 2월 선통제가 물러나 청이 무너졌고 위안스카이가 임시 대총통이 됨
  features:
    - 병자호란에서 조선 인조가 삼전도에서 항복해 군신 관계를 맺음
    - 1644년 이자성의 반란군이 베이징을 함락해 명이 망하자 청이 산해관을 넘어 베이징에 도읍하고 중국을 지배함
    - 1673~1683년 삼번의 난을 겪고 타이완을 정복함. 1691년 외몽골(할하), 1720년 티베트, 1724년 칭하이를 복속함
    - 1840~1842년 아편 전쟁과 난징 조약을 겪고 1860년 베이징 조약으로 연해주를 러시아에 넘김
    - 청일 전쟁(1894~1895)에 져 타이완을 일본에 넘겼고, 1899~1901년 의화단 운동 때 8개국 연합군이 베이징을 점령함
  startEvents: [byeongja-horan-1636]
  endEvents: [xinhai-1911]
  basis:
    type: primary_source
    refs: ["『청사고』", "『청사고』 번부전 청해액로특", "『인조실록』", "내몽골 당사방지망 「아라산맹 건치 연혁」", "난징 조약(1842)", "베이징 조약(1860)", "중국-포르투갈 베이징 조약(1887)", "홍콩 경계 확장 협약(1898)", "라다크-티베트 팅모스강 조약(1684)"]
    foundingNote: 홍타이지가 후금의 국호를 청으로 바꾼 1636년을 시작으로 봄

# ── 7번 묶음 (1876 ~ 1945) ──

- id: roc
  level: polity
  names: { ko: 중화민국, hanja: 中華民國, en: Republic of China }
  from: 1912
  to: null
  color: "#b8504a"
  summary: 신해혁명(1911)으로 청이 무너지고 세워진 공화국. 대한민국 임시정부와 한국광복군을 지원함. 1949년 국공 내전에서 져 타이완으로 옮김
  mapNote: 외몽골은 1921년 독립한 뒤 몽골로 따로 표시함. 알라산·에지나는 닝샤성, 칭하이호·차이다무는 칭하이성(두 성 모두 1928년 설치 결정, 1929년 설치)에 속함. 버마와의 국경은 1894·1897년 영국-청 협약으로 남쪽 절반이 정해지고 와 주 구간은 1941년에 합의되었으며 북쪽 구간은 끝내 정해지지 않았으나, 1960년 국경 조약으로 조금 바뀐 오늘의 선으로 대신함. 영국령 홍콩과 포르투갈령 마카오(1887년 베이징 조약으로 영구 점유 인정)는 넣지 않음. 라다크 동남부(한레·뎀촉 쪽)는 라다크 땅이라 넣지 않음. 악사이친은 청과 같이 지금의 실효 지배선까지 넣음(실제로 다스리지는 않았고, 1917~1933년 중화민국 우편 지도는 악사이친을 카슈미르 쪽에 둔 존슨 선을 따름). 1914년 영국령 인도와 티베트가 정한 맥마흔선은 인정하지 않았음. 신장은 지도 자료 범위 밖이라 칠하지 않음. 서남쪽은 오늘의 국경선으로 그려 윈난 서부·남부(텅충·바오산·더훙·시솽반나)를 넣고, 1885년 톈진 조약으로 프랑스 보호령이 된 통킹과 네팔·시킴·부탄은 넣지 않음. 티베트 남쪽(지금의 아루나찰프라데시 북부)은 대략 선으로 그려, 1944년 무렵부터 영국령 인도가 직접 다스린 동쪽 일부(수반시리·시앙·로힛 쪽)가 들고 1951년까지 티베트가 다스린 타왕 지역은 들지 않음
  features:
    - 1912년 2월 선통제가 물러나 청이 무너지고 위안스카이가 3월 임시 대총통이 됨
    - 1915년 1월 일본이 위안스카이 정부에 21개조 요구를 내밀었고, 정부는 5월 9일 이를 받아들임
    - 중일 전쟁 때 중화민국 정부는 충칭으로 옮겨 항전함
    - 대한민국 임시정부와 한국광복군을 지원함
    - 국공 내전에서 져 1949년 12월 타이베이로 옮김
  startEvents: [xinhai-1911]
  basis:
    type: primary_source
    refs: ["『중화민국 임시약법』", "국사편찬위원회 『한국독립운동사』", "청-프랑스 톈진 조약(1885)", "중국-포르투갈 베이징 조약(1887)"]
    foundingNote: 쑨원이 난징에서 임시 대총통에 올라 중화민국이 세워진 1912년을 시작으로 봄

- id: manchukuo
