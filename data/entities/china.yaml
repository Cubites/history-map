# 중국 왕조
# 3번 묶음(600~935): 한국사와 관계된 왕조만. 운영자 검수 필요.

- id: sui
  level: polity
  names: { ko: 수, hanja: 隋, en: Sui }
  from: 581
  to: 618
  color: "#6f8fb3"
  summary: 남북조를 통일한 왕조. 609년 토욕혼을 쳐 칭하이에 서해군·하원군을 두었으나, 고구려 원정에 거듭 실패하고 멸망함
  endNote: 고구려 원정 실패와 무리한 토목 공사로 수가 무너지고, 이연이 당을 세운 618년에 끝남
  features:
    - 양견이 돌궐 안의 다툼을 부추겨 돌궐이 동과 서로 갈라지게 함
    - 돌궐의 지배 아래 있던 동북의 거란이 584년 막하불들을 이끌고 수를 찾아왔고 585년 부족 전체가 귀부함
    - 589년 남조의 진을 무너뜨려 약 300년 만에 중국을 통일함
    - 609년 토욕혼을 쳐 칭하이에 서해군·하원군을 둠
    - 고구려 원정에 거듭 실패했고, 612년 살수에서 양제의 별동대가 을지문덕에게 크게 무너짐
  startEvents: [northern-zhou-sui-577]
  endEvents: [tang-founded-618]
  basis:
    type: primary_source
    refs: ["『수서』"]
    foundingNote: 양견이 어린 정제를 대신해 실권을 잡은 뒤 선양을 받아 수를 세운 581년을 시작으로 봄

- id: tang
  level: polity
  names: { ko: 당, hanja: 唐, en: Tang }
  from: 618
  to: 907
  color: "#5b7fa8"
  summary: 수를 이은 왕조. 신라와 연합해 백제·고구려를 무너뜨렸으나 나당 전쟁에서 물러남
  mapNote: 윈난은 남조가 750~754년 천보 전쟁으로 당과 갈라서 토번 편에 선 뒤 독립 왕국이었으므로 751년부터 넣지 않음(남조는 따로 그리지 않음)
  endNote: 907년 주전충이 당 애제의 선양을 받아 후량을 세우면서 당이 망함. 이로써 5대 10국 시대가 열림
  features:
    - 630년 당 태종이 동돌궐을 무너뜨려 북방의 위협을 없앰. 646년에는 설연타를 무너뜨림
    - 634년 토번이 처음 사신을 보냈고 635년 토욕혼이 당에 복속함. 641년 문성공주가 토번에 시집감
    - 648년 신라와 군사 동맹을 맺고 660년 백제, 668년 고구려를 무너뜨렸으나 670~676년 나당 전쟁에서 물러남
    - 750~754년 남조와 천보 전쟁을 치렀고, 755~763년 안녹산과 사사명의 반란(안사의 난)으로 크게 약해짐
  startEvents: [tang-founded-618]
  endEvents: [tang-fall-907]
  basis:
    type: primary_source
    refs: ["『구당서』", "『신당서』"]
    foundingNote: 고구려 원정 실패와 무리한 토목 공사로 수가 무너지고 이연이 당을 세운 618년을 시작으로 봄

# 당이 점령지를 다스리려고 둔 기구. 옛 나라의 색 위에 당의 색으로 빗금을 친다 (relations.yaml의 occupied_by).
# 나라가 아니므로 level: region으로 둔다.

- id: ungjin-dodokbu
  level: region
  names: { ko: 웅진도독부, hanja: 熊津都督府, en: Ungjin Commandery }
  from: 660
  to: 676
  color: "#7d9b5b"
  summary: 당이 백제를 멸망시킨 뒤 옛 백제 땅을 다스리려고 둔 기구. 664년 의자왕의 아들 부여융을 도독으로 삼음(663년이라는 기록도 있음). 671년 신라가 사비 일대를 차지하고 소부리주를 두면서 힘을 잃었고, 676년 요동의 건안성으로 옮겨짐
  endNote: 671년 신라가 사비 일대를 차지하고 소부리주를 두면서 힘을 잃었고, 676년 요동의 건안성으로 옮겨짐
  features:
    - 664년 의자왕의 아들 부여융을 도독으로 삼음(663년이라는 기록도 있음)
    - 665년 당이 취리산에서 부여융과 신라 문무왕에게 서로 침범하지 않기로 맹세하게 함
  startEvents: [baekje-falls-660]
  endEvents: [gibeolpo-676]
  basis:
    type: primary_source
    refs: ["『삼국사기』 백제본기 의자왕 20년", "『구당서』 백제전"]
    foundingNote: 당이 백제를 멸망시키고 옛 백제 땅에 웅진도독부를 둔 660년부터

- id: andong-dohobu
  level: region
  names: { ko: 안동도호부, hanja: 安東都護府, en: Protectorate General to Pacify the East }
  from: 668
  to: 756
  color: "#c8745a"
  summary: 당이 고구려를 멸망시킨 뒤 평양에 둔 기구. 나당 전쟁으로 676년 요동으로 물러났고, 8세기 중엽 안사의 난 무렵 사실상 없어짐
  mapNote: 요동으로 옮긴 뒤 폐지된 시기는 기록에 따라 차이가 있어, 지도에서는 756년(안사의 난 직후)까지로 봄
  endNote: 안사의 난 속에서 756~761년 사이에 사실상 없어져 당의 요동 지배가 끝남(연도는 설이 갈림)
  features:
    - 나당 전쟁(670~676) 끝에 676년 2월 평양에서 요동으로 옮겨짐
    - 신라와 안동도호부 밖의 옛 고구려 땅은 말갈과 고구려 유민이 사는 땅으로 남았고, 뒤에 이곳에서 발해가 일어남
  startEvents: [goguryeo-falls-668]
  endEvents: [an-lushan-755]
  basis:
    type: primary_source
    refs: ["『삼국사기』 고구려본기 보장왕 27년", "『구당서』 지리지"]
    foundingNote: 고구려가 멸망하고 당이 평양에 안동도호부를 둔 668년부터

- id: later-liang
  level: polity
  names: { ko: 후량, hanja: 後梁, en: Later Liang }
  from: 907
  to: 923
  color: "#7e93ad"
  summary: 당을 무너뜨리고 화북에 세워진 5대 첫 왕조
  mapNote: 지도에는 화북만 표시하되, 하동의 진(晉)·봉상의 기(岐)·유주의 연(燕, 913년까지)·성덕군과 의무군(910~922년)·전촉의 한중(915년부터 진·봉·성·계 4주도) 땅은 그 나라로 그림. 정난군(오르도스·샨베이 북부)은 후량 땅으로 둠. 후베이 중·북부(샹양·중샹·안루·신양·톈먼·스옌·팡현 둘레)도 후량 땅으로 그림. 유관 동쪽 요서 해안(907~915년)은 주인이 분명하지 않아 화북 도형 그대로 둠
  endNote: 923년 이존욱(장종)이 후량을 무너뜨리고 후당을 세움
  startEvents: [tang-fall-907]
  endEvents: [tang-fall-907]
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]
    foundingNote: 주전충이 당 애제의 선양을 받아 후량을 세운 907년을 시작으로 봄

- id: later-tang
  level: polity
  names: { ko: 후당, hanja: 後唐, en: Later Tang }
  from: 923
  to: 936
  color: "#6a86a6"
  summary: 후량을 이은 5대 두 번째 왕조
  mapNote: 지도에는 화북을 표시하고, 925~933년에는 전촉을 멸하고 가진 쓰촨·충칭도 넣음. 923~924년 한중과 진·봉·성·계 4주는 전촉 땅으로, 934~935년 한중은 후촉 땅으로 그림(4주는 후당 땅). 924년 신복한 봉상(기)은 923년부터 후당 땅. 후베이 중·북부(샹양·중샹·안루·신양·톈먼·스옌·팡현 둘레)도 후당 땅으로 그림
  endNote: 936년 석경당이 거란 태종의 도움으로 후당을 무너뜨리고 후진을 세움
  startEvents: [tang-fall-907]
  endEvents: [liao-jin-936]
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]
    foundingNote: 이존욱(장종)이 후량을 무너뜨리고 후당을 세운 923년을 시작으로 봄

# ── 4번 묶음 (936 ~ 1392) ──

- id: later-jin
  level: polity
  names: { ko: 후진, hanja: 後晉, en: Later Jin }
  from: 936
  to: 946
  color: "#7e93ad"
  summary: 거란의 도움으로 세운 5대 세 번째 왕조. 그 대가로 연운 16주를 거란에 넘김 (938)
  mapNote: 지도에는 화북(938년부터 연운 16주를 뺌)을 표시하고, 한중은 후촉 땅으로 그림(진·봉·성·계 4주는 후진 땅). 후베이 중·북부(샹양·중샹·안루·신양·톈먼·스옌·팡현 둘레)도 후진 땅으로 그림
  endNote: 946년 거란이 후진을 멸망시킴
  startEvents: [liao-jin-936]
  endEvents: [liao-jin-936]
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]
    foundingNote: 후당의 석경당이 거란 태종의 도움으로 후당을 무너뜨리고 후진을 세운 936년을 시작으로 봄

- id: later-han
  level: polity
  names: { ko: 후한, hanja: 後漢, en: Later Han }
  from: 947
  to: 950
  color: "#6a86a6"
  summary: 후진이 거란에 무너진 뒤 화북에 세워진 5대 네 번째 왕조. 4년 만에 후주로 바뀜
  mapNote: 지도에는 연운 16주를 뺀 화북을 표시하고, 한중과 947년 귀순한 진·봉·성·계 4주는 후촉 땅으로 그림. 후베이 중·북부(샹양·중샹·안루·신양·톈먼·스옌·팡현 둘레)도 후한 땅으로 그림
  endNote: 4년 만에 후주로 바뀌어 951년 중원에 후주가 섬
  startEvents: [liao-jin-936]
  endEvents: [liao-jin-936]
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]
    foundingNote: 947년 중원에서 후한이 섬

- id: later-zhou
  level: polity
  names: { ko: 후주, hanja: 後周, en: Later Zhou }
  from: 951
  to: 959
  color: "#7e93ad"
  summary: 5대 마지막 왕조. 후주 사람 쌍기가 고려에 귀화해 과거제 실시를 건의함
  mapNote: 지도에는 연운 16주를 뺀 화북을 표시하고, 산시 중·북부의 북한(北漢)과 후촉의 한중(954년까지는 진·봉·성·계 4주도)은 그 나라로 그림. 958년 화의로 남당에게서 얻은 창장강 북쪽 14주(회남과 광주·황주·기주)는 958년부터 더하고, 956~957년의 일시 점령은 그리지 않음. 후베이 중·북부(샹양·중샹·안루·신양·톈먼·스옌·팡현 둘레)도 후주 땅으로 그림
  endNote: 조광윤이 후주 공제의 선양을 받아 송을 세우면서 끝남
  startEvents: [liao-jin-936]
  endEvents: [zhou-shizong-954]
  basis:
    type: primary_source
    refs: ["『구오대사』", "『신오대사』"]
    foundingNote: 951년 중원에서 후주가 섬

- id: song
  level: polity
  names: { ko: 송, hanja: 宋, en: Song }
  from: 960
  to: 1279
  color: "#5f86b5"
  summary: 조광윤이 세운 왕조. 문치주의로 국방력이 약해 요·서하·금에 시달렸고, 1127년 금에 화북을 빼앗긴 뒤 강남에서 남송으로 이어짐. 고려와 활발히 교류
  mapNote: 지도에서는 960년부터 표시하되, 형남·무평군(후난)은 963년, 후촉(쓰촨·충칭·한중)은 965년, 남한(南漢, 광둥·광시·하이난)은 971년, 남당(창장강 남쪽·장시·푸젠 북서부)은 975년, 오월(저장·푸저우)·청원군(취안저우·장저우)은 978년, 북한(北漢, 산시 중·북부)은 979년부터 넣음. 남쪽 나라들을 모두 통합한 것은 978년(오월 귀순)이고, 북한을 멸망시켜 10국 통합을 마친 것은 979년. 베트남 북부(통킹)는 968년 딩 왕조가 선 뒤 독립국(뒤의 대월)이고, 윈난은 대리국(937~1253) 땅이라 넣지 않음. 송 태조가 대도하 남쪽을 대리 땅으로 인정했으므로, 대도하 남쪽의 쓰촨 남부(지금의 량산·판즈화 쪽, 대리국의 건창)도 넣지 않음
  endNote: 1127년 금에 화북을 빼앗긴 뒤 강남에서 남송으로 이어졌고, 1279년에 끝남
  features:
    - 문치주의로 나라를 다스렸으나 국방력이 약해 요·서하·금에 시달림
    - 978년 오월의 귀순으로 남쪽 나라들을 모두 합쳤고, 979년 북한(北漢)을 정복해 십국을 모두 합침
    - 고려와 활발히 교류했고, 광종은 962년 사신을 보낸 뒤 이듬해 책봉을 받고 송의 연호를 씀
  startEvents: [song-founded-960]
  endEvents: [lin-an-yashan-1279]
  basis:
    type: primary_source
    refs: ["『송사』"]
    foundingNote: 조광윤이 후주 공제의 선양을 받아 송을 세운 960년을 시작으로 봄

- id: ming
  level: polity
  names: { ko: 명, hanja: 明, en: Ming }
  from: 1368
  to: 1644
  color: "#b5564a"
  summary: 주원장이 원을 몰아내고 세운 한족 왕조. 1387년 요동을 차지하고 고려에 철령 이북 땅을 요구함
  mapNote: 윈난은 원의 양왕(梁王) 바살라와르미가 북원에 충성하며 1382년 1월까지 다스려 1368~1381년에는 윈난과 그 북쪽 대도하 남쪽의 건창(원의 건창로, 운남행성 소속)을 넣지 않고, 1382년부터(건창은 그해 3월 건창부·건창위를 둠) 오늘의 국경선으로 윈난 서부·남부(텅충·바오산·시솽반나)까지 넣음(서북쪽 끝 디칭은 티베트 대략 선 밖이라 빠짐). 베트남은 1407년 호 왕조를 무너뜨리고 교지(交趾)를 둔 뒤 1427년 12월 동관 맹약으로 물러나기까지만 지금 베트남의 북부·북중부(하이반 고개 북쪽)로 넣고, 그 밖의 해에는 조공국이라 넣지 않음
  endNote: 1644년 이자성의 반란군이 베이징을 함락해 명이 망하고, 청이 산해관을 넘어 베이징에 도읍함
  features:
    - 1381~1383년 원의 양왕 바살라와르미가 다스리던 윈난을 평정함
    - 1387년 북원 쪽 나하추가 명에 항복하면서 만주의 여진 부족들에 대한 명의 지배가 굳어짐
    - 1387년 요동을 차지하고 고려에 철령 이북 땅을 요구함
    - 1407년 호 왕조를 무너뜨리고 교지(交趾)를 두었다가 1427년 12월 동관 맹약으로 물러남
  startEvents: [ming-founded-1368]
  endEvents: [qing-conquest-1644]
  basis:
    type: primary_source
    refs: ["『명사』"]
