# china ten-kingdoms 나라 (시대 파일 scripts/geo/areas/china/ten-kingdoms.mjs의 짝 항목 파일)
# 시대·범위: 5대 10국(M4): 907 ~ 979
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'china-ten-kingdoms').
# 중국 M4a(2026-10-24): 5대 10국 북부·서부에 새로 그리는 나라(진(晉, 하동)·기(岐)·연(燕, 유수광)·성덕군(조)·의무군·전촉·후촉·형남·북한(北漢)·귀의군·감주 위구르).
# 중국 M4b(2026-10-25): 남부·동남의 나라(오(吳, 양씨)·건주(虔州)·남당·오월·민(閩)·청원군·남한(南漢)·초(楚, 마씨)·무평군).
# 5대 왕조(후량·후당·후진·후한·후주)와 송은 china.yaml. 은(殷, 943~945)·이인달의 복주(945~947)는 5년 미만이라 항목을 만들지 않는다.
# 5년 미만이거나 1만 km² 미만인 나라(정난군은 5대 왕조 도형 안이라 그리지 않음)는 항목을 만들지 않는다. startEvents·endEvents는 송·요·금 사건 묶음(cn-05)이 채운다.

- id: jin-hedong
  level: polity
  names: { ko: "진(晉, 하동)", hanja: 晉, en: Jin (Hedong) }
  from: 907
  to: 923
  color: "#b0614a"
  summary: 사타 출신 이극용이 하동에 세운 정권. 당 말 하동 절도사로 진왕에 봉해진 이극용은 907년 후량이 당을 잇자 당 연호를 쓰며 맞섰고, 908년 아들 이존욱이 뒤를 이었다. 이존욱은 913년 연(燕)을 멸하고 915~916년 위박을 얻어 황허강 북쪽을 거의 차지했으며, 921~922년 성덕군을 합쳤다. 923년 위주에서 황제를 칭해 후당을 세우고 같은 해 후량을 멸했다
  mapNote: 지도에는 907년부터 923년까지 표시하고, 907년 하동(산시 중·북부와 노주·운중), 913년 연의 노룡·의창, 916년 위박과 형·명·자주, 922년 성덕군 차지를 반영함. 유관 동쪽 요서 해안은 넣지 않음. 후당(923~)은 따로 그림
  endNote: 923년 이존욱이 위주에서 황제를 칭해 후당을 세우고, 같은 해 카이펑을 함락해 후량을 멸함
  features:
    - 도읍은 태원부(지금 타이위안)
    - 908년 이존욱이 노주를 에워싼 후량군을 깨뜨림
    - 911년 백향 싸움에서 성덕·의무와 함께 후량군을 크게 깨뜨림
    - 913년 유주를 함락해 연의 유수광을 사로잡음
    - 923년 후당으로 이어짐
  startEvents: [zhu-wen-later-liang-907]
  endEvents: [li-cunxu-later-tang-923]
  basis:
    type: primary_source
    refs: ["『구오대사』 당서 무황기·장종기", "『신오대사』", "『자치통감』"]
    foundingNote: 후량이 당을 이은 907년을 지도의 시작으로 봄. 이극용은 883년 하동 절도사가 되었고 895년 진왕에 봉해짐

- id: qi-fengxiang
  level: polity
  names: { ko: "기(岐)", hanja: 岐, en: Qi (Fengxiang) }
  from: 907
  to: 924
  color: "#c9a03c"
  summary: 당 말 봉상 절도사 이무정이 세운 정권. 901년 기왕에 봉해진 이무정은 907년 당이 망한 뒤에도 후량을 인정하지 않고 봉상을 중심으로 관중 서부와 룽둥을 다스렸다. 915년 정난군(靜難軍)을 후량에, 천웅군(진·봉·성·계주)을 전촉에 잃고 봉상 둘레만 남았다. 924년 후당에 신복해 진왕(秦王)에 봉해지고 그해 죽었다
  mapNote: 지도에는 907년부터 923년까지 표시하고, 907년 봉상·농주·빈주·경주(涇州)·원주·핑량·칭양과 천웅군 4주, 915년 봉상·농주만 남은 모습을 반영함. 908년 후량에 넘어간 옌안·푸현은 넣지 않고, 924년 신복 전 1년은 후당 땅으로 그림
  endNote: 924년 이무정이 후당에 신복해 진왕(秦王)에 봉해지고 그해 죽어, 봉상은 후당의 절도사 땅이 됨
  features:
    - 도읍은 봉상부(지금 바오지시 펑샹구)
    - 당 연호를 쓰며 후량을 인정하지 않음
    - 915년 천웅군 4주를 전촉에, 정난군(빈주)을 후량에 잃음
    - 918~920년 전촉의 봉상 공격을 막아 냄
  startEvents: [zhu-wen-later-liang-907]
  endEvents: [wang-jian-former-shu-907]
  basis:
    type: primary_source
    refs: ["『구오대사』 이무정전", "『신오대사』 이무정전", "『자치통감』"]
    foundingNote: 당이 망한 907년을 지도의 시작으로 봄. 이무정은 887년 봉상 절도사가 되었고 901년 기왕에 봉해짐

- id: yan-liu
  level: polity
  names: { ko: "연(燕, 유수광)", hanja: 燕, en: Yan (Liu Shouguang) }
  from: 907
  to: 913
  color: "#4f9a7a"
  summary: 노룡 절도사 유수광이 유주에 세운 정권. 907년 아버지 유인공을 가두고 유주를 차지했고, 909년 형 유수문을 사로잡아 의창군(창저우)을 합쳤다. 911년 대연 황제를 칭했으나 같은 해 의무군을 치다 진(晉)의 반격을 불렀고, 913년 말 진의 주덕위에게 유주가 함락되었다
  mapNote: 지도에는 907년부터 913년까지 표시하고, 907년 노룡군(베이징·톈진 북쪽·허젠·청더 남부·친황다오와 장자커우 동쪽), 909년 의창군(창저우·더저우) 차지를 반영함. 장성 선 밖과 유관 동쪽 요서 해안은 노룡군이 다스리지 않아 넣지 않음(지도는 거란 땅으로 그림)
  endNote: 913년 말 진(晉)의 주덕위가 유주를 함락하고, 유수광은 사로잡혀 이듬해 태원에서 처형됨
  features:
    - 도읍은 유주(지금 베이징 서남쪽)
    - 908년 후량에게서 연왕에 봉해짐
    - 911년 대연 황제를 칭하고 연호를 응천이라 함
    - 913년 진에게 멸망
  startEvents: [yan-liu-baixiang-907]
  endEvents: [yan-liu-baixiang-907]
  basis:
    type: primary_source
    refs: ["『구오대사』 유수광전", "『신오대사』 유수광전", "『자치통감』"]
    foundingNote: 유수광이 유주를 차지한 907년을 시작으로 봄. 대연 황제를 칭한 911년을 시작으로 보기도 함

- id: chengde
  level: polity
  names: { ko: "성덕군(조)", hanja: 成德軍, en: Chengde (Zhao) }
  from: 910
  to: 921
  color: "#8d5fb0"
  summary: 왕씨가 대를 이어 다스린 하북의 번진. 진주(지금 정딩)를 치소로 진·기·심·조 4주를 가졌고, 왕용은 후량에게서 조왕에 봉해졌다. 910년 후량이 땅을 빼앗으려 하자 의무군과 함께 진(晉)과 손잡았고, 911년 백향 싸움에서 후량군을 크게 깨뜨렸다. 921년 장문례가 왕용을 죽였고 922년 진이 진주를 함락했다
  mapNote: 지도에는 910년부터 921년까지 표시함(스자좡·자오현·헝수이·선저우). 910년 전 후량에 신속하던 때는 후량 땅으로 그림
  endNote: 921년 양자 장문례가 왕용을 죽이고, 922년 진(晉)이 진주를 함락해 성덕군을 합침
  features:
    - 치소는 진주(지금 정딩)
    - 왕용이 후량에게서 조왕에 봉해짐
    - 911년 백향 싸움에서 진과 함께 후량군을 깨뜨림
  startEvents: [yan-liu-baixiang-907]
  endEvents: [li-cunxu-later-tang-923]
  basis:
    type: primary_source
    refs: ["『구오대사』 왕용전", "『신오대사』", "『자치통감』"]
    foundingNote: 후량과 끊고 진과 손잡은 910년을 지도의 시작으로 봄. 왕씨의 성덕군은 820년대부터 이어짐

- id: yiwu
  level: polity
  names: { ko: 의무군, hanja: 義武軍, en: Yiwu }
  from: 910
  to: 922
  color: "#d2849c"
  summary: 왕처직이 다스린 하북의 번진. 정주(지금 딩저우)를 치소로 정·역·기주를 가졌고, 북평왕을 칭했다. 910년 성덕군과 함께 진(晉)과 손잡아 후량에 맞섰고, 911년 연의 유수광이 쳐들어왔을 때 진의 도움으로 막아 냈다. 921년 양자 왕도가 왕처직을 가두고 진(뒤의 후당)에 붙었다
  mapNote: 지도에는 910년부터 922년까지 표시함(딩저우·바오딩 서쪽·이현·안궈). 910년 전은 후량 땅, 923년부터는 후당 땅으로 그림
  endNote: 921년 양자 왕도가 왕처직을 가두고 진(晉)에 붙었고, 923년 후당이 서며 그 번진이 됨
  features:
    - 치소는 정주(지금 딩저우)
    - 왕처직이 북평왕을 칭함
    - 911년 연의 침공을 진의 도움으로 막아 냄
  startEvents: [yan-liu-baixiang-907]
  endEvents: [li-cunxu-later-tang-923]
  basis:
    type: primary_source
    refs: ["『구오대사』 왕처직전", "『신오대사』", "『자치통감』"]
    foundingNote: 후량과 끊고 진과 손잡은 910년을 지도의 시작으로 봄. 왕처직은 900년 의무군 절도사가 됨

- id: former-shu
  level: polity
  names: { ko: 전촉, hanja: 前蜀, en: Former Shu }
  from: 907
  to: 925
  color: "#5e9a5c"
  summary: 왕건이 당 말 쓰촨에서 일으킨 나라. 서천 절도사 왕건은 902년 한중을 얻고 903년 촉왕에 봉해졌으며, 907년 당이 망하자 성도에서 황제를 칭했다. 915년 기(岐)의 천웅군(진·봉·성·계주)을 얻었다. 918년 왕연이 뒤를 이었고, 925년 후당의 곽숭도·이계급에게 70일 만에 멸망했다
  mapNote: 지도에는 907년부터 925년까지 표시하고, 쓰촨 분지와 둘레·충칭·언스·즈구이·이창(귀·협주)·한중과 915년 천웅군 4주(톈수이·룽난·펑현)를 반영함. 대도하 남쪽(대리의 건창)과 쑹판 둘레 고원은 넣지 않음
  endNote: 925년 후당의 곽숭도가 청두에 들어와 왕연이 항복해 멸망함
  features:
    - 도읍은 성도(지금 청두)
    - 917년 국호를 한(漢)으로 바꾸었다가 이듬해 촉으로 되돌림
    - 915년 기의 천웅군 4주를 얻음
    - 925년 후당에게 70일 만에 멸망
  startEvents: [wang-jian-former-shu-907]
  endEvents: [later-tang-conquers-shu-925]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 전촉세가", "『십국춘추』"]
    foundingNote: 왕건이 황제를 칭한 907년을 시작으로 봄. 촉왕에 봉해진 903년을 시작으로 보기도 함

- id: later-shu
  level: polity
  names: { ko: 후촉, hanja: 後蜀, en: Later Shu }
  from: 934
  to: 965
  color: "#3f8f6a"
  summary: 맹지상이 후당의 쓰촨 절도사에서 일어나 세운 나라. 925년 후당이 전촉을 멸한 뒤 서천 절도사로 간 맹지상은 932년 동천을 합치고 934년 성도에서 황제를 칭했으며, 같은 해 한중의 산남서도·무정군이 귀순했다. 947년 후진의 웅무군 절도사 하중건이 진·계·성주를 바치고 이어 봉주도 귀순했으나, 맹창 때인 955년 이 4주를 후주에게 잃었고, 965년 정월 송의 왕전빈에게 항복했다
  mapNote: 지도에는 934년부터 965년까지 표시하고, 쓰촨 분지와 둘레·충칭·언스·한중, 947년 얻은 4주(톈수이·룽난·펑현), 955년 4주를 후주에게 잃은 모습을 반영함. 934~946년 4주는 후당·후진 땅이라 넣지 않음. 귀·협주는 형남 땅이고, 대도하 남쪽(대리의 건창)은 넣지 않음
  endNote: 965년 정월 송의 왕전빈이 청두에 이르자 맹창이 항복해 멸망함
  features:
    - 도읍은 성도(지금 청두)
    - 934년 맹지상이 칭제한 뒤 같은 해 맹창이 이음
    - 947년 진·봉·성·계 4주가 귀순함
    - 955년 4주를 후주에게 잃음
    - 965년 송에 항복
  startEvents: [meng-zhixiang-later-shu-934]
  endEvents: [song-conquers-shu-965]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 후촉세가", "『십국춘추』"]
    foundingNote: 맹지상이 성도에서 황제를 칭한 934년을 시작으로 봄. 서천 절도사로 사실상 자립한 926년 무렵을 시작으로 보기도 함

- id: jingnan
  level: polity
  names: { ko: 형남, hanja: 荊南, en: Jingnan (Nanping) }
  from: 924
  to: 963
  color: "#d9a441"
  summary: 고계흥이 강릉을 근거로 삼은 작은 나라. 907년 후량이 형남 절도사로 보낸 고계흥은 이웃에 땅을 빼앗겨 강릉 한 성만 지키다 924년 후당에게서 남평왕에 봉해졌다. 925년 후당이 전촉을 멸한 뒤 귀·협주를 얻었다. 5대 왕조와 남쪽 나라들 사이에서 칭신하며 버텼고, 963년 송에게 땅을 바쳤다
  mapNote: 지도에는 925년부터 963년까지 표시함(징저우·궁안·이창·즈구이). 강릉 한 성뿐이던 907~924년은 넓이가 작아 그리지 않음
  endNote: 963년 송군이 형남을 지나 무평군을 치러 가는 길에 강릉에 들어오자 고계충이 땅을 바쳐 끝남
  features:
    - 도읍은 강릉부(지금 징저우)
    - 924년 고계흥이 후당에게서 남평왕에 봉해짐
    - 925년 전촉이 망한 뒤 귀·협주를 얻음
    - 963년 송에 땅을 바침
  startEvents: [later-tang-conquers-shu-925]
  endEvents: [song-conquers-jingnan-chu-963]
  basis:
    type: primary_source
    refs: ["『구오대사』 세습열전", "『신오대사』 남평세가", "『십국춘추』"]
    foundingNote: 고계흥이 남평왕에 봉해진 924년을 시작으로 봄. 형남 절도사가 된 907년을 시작으로 보기도 함

- id: northern-han
  level: polity
  names: { ko: "북한(北漢)", hanja: 北漢, en: Northern Han }
  from: 951
  to: 979
  color: "#c0603f"
  summary: 후한의 유숭이 태원에서 세운 나라. 951년 곽위가 후한을 무너뜨리고 후주를 세우자 하동 절도사 유숭이 태원에서 황제를 칭했다. 병·분·흔·대주 등 산시 중·북부 10여 주를 가지고 거란(요)에 의지해 후주·송과 맞섰다. 979년 송 태종이 태원을 에워싸자 유계원이 항복해 10국이 모두 끝났다
  mapNote: 지도에는 951년부터 979년까지 표시함(타이위안·펀양·신저우·다이현·란현·리스·친위안·쭤취안). 954년 고평 싸움 뒤 후주의 일시 점령과 963~964년 요주·낙평 상실은 넣지 않음
  endNote: 979년 송 태종이 태원을 함락해 유계원이 항복하고, 송은 태원성을 허물었음
  features:
    - 도읍은 태원부(진양, 지금 타이위안 진위안구)
    - 거란(요)에 의지해 후주·송과 맞섬
    - 954년 고평 싸움에서 후주 세종에게 크게 짐
    - 979년 송에 항복해 10국 시대가 끝남
  startEvents: [later-han-later-zhou-951]
  endEvents: [song-conquers-northern-han-979]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 동한세가", "『십국춘추』"]
    foundingNote: 유숭이 태원에서 황제를 칭한 951년을 시작으로 봄

- id: guiyi
  level: polity
  names: { ko: 귀의군, hanja: 歸義軍, en: Guiyi Circuit }
  from: 907
  to: 1036
  color: "#c98a3a"
  summary: 허시 회랑 서쪽 끝 사주(둔황)·과주를 다스린 한인 정권. 848년 장의조가 토번을 몰아내고 세웠고, 914년 조의금이 뒤를 이은 뒤로 조씨가 대를 이어 다스렸다. 5대 왕조와 송에 사신을 보내 절도사·왕의 칭호를 받았고, 감주 위구르·우전과 혼인으로 맺었다. 1036년 무렵 서하에게 합쳐졌다
  mapNote: 지도에는 907년부터 1036년까지 사주·과주(둔황·과저우와 그 서쪽 띠)로 표시함. 9세기에 한때 다스린 허시 11주와 907년 전은 넣지 않음
  endNote: 1036년 무렵 서하가 사주·과주를 차지해 끝남
  features:
    - 치소는 사주(지금 둔황)
    - 914년부터 조씨 가문이 다스림
    - 둔황 막고굴의 벽화와 문서를 많이 남김
  startEvents: [hexi-guiyi-ganzhou-848]
  endEvents: [xixia-conquers-hexi-1028]
  basis:
    type: primary_source
    refs: ["『신오대사』 사이부록", "『송사』 외국전", "둔황 문서"]
    foundingNote: 지도는 5대 10국이 시작하는 907년부터 그림. 장의조가 사주를 되찾은 848년(851년 귀의군 절도사)이 세운 해

- id: ganzhou-uyghur
  level: polity
  names: { ko: 감주 위구르, hanja: 甘州回鶻, en: Ganzhou Uyghur Kingdom }
  from: 907
  to: 1028
  color: "#7f62b5"
  summary: 위구르 칸국이 무너진 뒤 허시 회랑으로 옮겨 온 위구르가 감주(장예)에 세운 나라. 894년 무렵 감주에 자리 잡고 숙주까지 다스렸다. 925년 귀의군의 조의금에게 졌으나 이후 혼인으로 맺었고, 5대 왕조와 송에 조공하며 비단길 무역을 이었다. 1028년 서하의 이원호에게 감주를 빼앗겼다
  mapNote: 지도에는 907년부터 1028년까지 감주·숙주(장예·주취안)로 표시함. 양주(우웨이)는 토번계 육곡부 땅이라 넣지 않음
  endNote: 1028년 서하의 이원호가 감주를 함락해 끝남
  features:
    - 도읍은 감주(지금 장예)
    - 비단길 무역으로 5대 왕조·송·요와 교류
    - 925년 귀의군에게 진 뒤 혼인으로 맺음
  startEvents: [hexi-guiyi-ganzhou-848]
  endEvents: [xixia-conquers-hexi-1028]
  basis:
    type: primary_source
    refs: ["『신오대사』 사이부록", "『송사』 외국전"]
    foundingNote: 지도는 5대 10국이 시작하는 907년부터 그림. 감주에 자리 잡은 것은 894년 무렵

# ── 중국 M4b(2026-10-25): 5대 10국 남부·동남 ──
- id: yang-wu
  level: polity
  names: { ko: "오(吳, 양씨)", hanja: 吳, en: Wu (Yang Wu) }
  from: 907
  to: 937
  color: "#c75d5d"
  summary: 양행밀이 회남에 세운 정권. 당 말 회남 절도사로 902년 오왕에 봉해진 양행밀은 광릉(지금 양저우)을 근거로 회남 일대를 차지했고, 907년 후량이 당을 잇자 당 연호를 쓰며 맞섰다. 909년 장시 중·남부, 918년 건주(虔州)를 얻어 장시를 모두 가졌으나 실권은 서온과 그 양아들 서지고에게 넘어갔다. 919년 양융연이 오국왕, 927년 양부가 황제를 칭했고 937년 양부가 서지고에게 선양했다
  mapNote: 지도에는 907년부터 937년까지 표시하고, 907년 회남·진해군(난징·전장·창저우·우시)·선·흡·지주·후베이 동부(악·황·기주)·광주(光州)·장시 북부(홍·강주), 909년 장시 중·남부(무·신·원·길·요주), 918년 건주(虔州) 병합을 반영함. 회남 가운데 화이안·벙부 둘레 북쪽(초·사·해·호·수주 북부)은 5대 왕조 땅으로 그림. 남당(937~)은 따로 그림
  endNote: 937년 양부가 서지고에게 선양해 제(齊, 939년 당으로 고침)가 서고, 오의 땅은 남당으로 이어짐
  features:
    - 도읍은 강도부(지금 양저우), 실권자 서온은 금릉(지금 난징)에 머묾
    - 902년 양행밀이 당에서 오왕에 봉해짐
    - 909년 위전풍을 깨고 장시 중·남부를 얻음
    - 919년 무석 싸움에서 오월군을 깨뜨림
    - 931년 서지고가 금릉으로 옮기고 937년 선양받아 남당을 세움
  startEvents: [yang-wu-902]
  endEvents: [xu-zhigao-southern-tang-937]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 오세가", "『자치통감』"]
    foundingNote: 당이 망한 907년을 지도의 시작으로 봄. 양행밀은 892년 회남 절도사가 되었고 902년 오왕에 봉해짐. 919년 오국왕, 927년 칭제

- id: qianzhou-baisheng
  level: polity
  names: { ko: "건주(虔州)", hanja: 虔州, en: Qianzhou }
  from: 907
  to: 918
  color: "#7d68b0"
  summary: 노광조와 담전파가 건주(虔州, 지금 장시성 간저우)를 근거로 다스린 지방 정권. 885년 건주를 차지한 노광조는 902년 소주(지금 사오관)까지 얻었고, 907년 후량에게서 백승군 방어사로 인정받았으며 909년 오에도 명목상 귀부했다. 노광조가 죽은 뒤 담전파가 이어받았으나 소주를 남한에게 잃었고, 918년 오의 공격에 건주가 함락되었다
  mapNote: 지도에는 907년부터 918년까지 표시하고, 907년 건주(虔州)와 소주(광둥 북부), 912년 소주를 남한에게 잃은 모습을 반영함
  endNote: 918년 말 오군에게 건주(虔州)가 함락되고 담전파가 사로잡혀 오에 합쳐짐
  features:
    - 도읍은 건주(虔州, 지금 간저우)
    - 후량의 백승군으로 인정받고 오에도 명목상 귀부함
    - 911~912년 소주를 남한에게 잃음
    - 918년 오에 병합됨
  startEvents: [yang-wu-902]
  endEvents: [yang-wu-902]
  basis:
    type: primary_source
    refs: ["『자치통감』", "『구오대사』", "『십국춘추』"]
    foundingNote: 후량이 노광조를 백승군 방어사로 인정한 907년을 지도의 시작으로 봄. 노광조는 885년 건주(虔州)를 차지함. 이 건주(虔州)는 푸젠의 건주(建州, 지금 젠어우)와 다른 곳

- id: southern-tang
  level: polity
  names: { ko: 남당, hanja: 南唐, en: Southern Tang }
  from: 937
  to: 975
  color: "#b0507a"
  summary: 서지고(이변)가 금릉에서 세운 나라. 오의 실권자 서지고는 937년 양부에게서 선양받아 제(齊)를 세우고 939년 당으로 고쳤으며 이씨 성을 되찾아 이변이라 했다. 이경 때인 945년 민을 멸해 푸젠 북서부를 얻고 951년 초를 멸했으나 이듬해 후난을 잃었다. 955~958년 후주의 공격으로 창장강 북쪽 14주를 넘기고 칭신했으며, 이욱 때인 975년 송군에게 금릉을 잃고 망했다
  mapNote: 지도에는 937년부터 975년까지 표시하고, 937년 오의 땅, 945년 민의 건주(建州)·정주·천주·장주 차지, 949년 천주·장주가 청원군으로 갈라진 것, 958년 창장강 북쪽 14주를 후주에 넘긴 모습을 반영함. 945~946년 복주는 이인달이 버텨 비우고, 951~952년 후난 점령은 1년이라 그리지 않음. 회남 가운데 화이안·벙부 둘레 북쪽(초·사·해·호·수주 북부)은 5대 왕조 땅으로 그림
  endNote: 975년 11월(음력) 송군이 금릉을 함락하고 이욱이 항복함(양력으로는 976년 1월 초)
  features:
    - 도읍은 금릉(강녕부, 지금 난징)
    - 945년 민을 멸해 건주(建州)·정주를 얻음
    - 958년 강북 14주를 후주에 넘기고 칭신함
    - 971년 국호를 강남으로 낮춤
    - 마지막 임금 이욱은 사(詞)의 대가로 이름남
  startEvents: [xu-zhigao-southern-tang-937]
  endEvents: [song-conquers-southern-tang-975]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 남당세가", "『자치통감』", "『송사』 세가"]
    foundingNote: 서지고가 선양받은 937년을 시작으로 봄. 국호는 937년 제(齊), 939년 당(唐)

- id: wuyue
  level: polity
  names: { ko: 오월, hanja: 吳越, en: Wuyue }
  from: 907
  to: 978
  color: "#4f9e8c"
  summary: 전류가 항저우를 도읍으로 세운 나라. 당 말 진해·진동군 절도사로 저장을 차지한 전류는 907년 후량에게서 오월왕에 봉해졌고, 5대 왕조와 뒤의 송을 섬기며 오·남당과 맞섰다. 947년 이인달이 바친 복주(지금 푸저우)를 얻었고, 978년 전홍숙이 송에 13주 1군의 땅을 바쳐 나라를 마쳤다
  mapNote: 지도에는 907년부터 978년까지 표시하고, 907년 저장 전부와 쑤저우·상하이, 947년 복주(푸저우·닝더) 차지를 반영함. 975년 송의 남당 공격 때 상주·윤주를 친 것은 그리지 않음
  endNote: 978년 전홍숙이 카이펑에 들어가 송에 13주 1군을 바침
  features:
    - 도읍은 서부(지금 항저우)
    - 5대 왕조와 송에 조공하며 오·남당과 맞섬
    - 첸탕강 제방을 쌓고 바다 무역으로 부를 쌓음
    - 947년 이인달이 바친 복주를 얻음
    - 978년 송에 땅을 바침
  startEvents: [wuyue-qian-liu-907]
  endEvents: [wuyue-qingyuan-submit-978]
  basis:
    type: primary_source
    refs: ["『구오대사』 세습열전", "『신오대사』 오월세가", "『자치통감』"]
    foundingNote: 후량이 전류를 오월왕에 봉한 907년을 시작으로 봄. 전류는 893년 진해군 절도사가 되었고 923년 오월국왕에 봉해짐

- id: min-kingdom
  level: polity
  names: { ko: "민(閩)", hanja: 閩, en: Min }
  from: 907
  to: 945
  color: "#d68a3a"
  summary: 왕심지가 푸젠에 세운 나라. 893년 형 왕조와 함께 복주를 차지한 왕심지는 909년 후량에게서 민왕에 봉해졌고, 아들 왕연균이 933년 황제를 칭했다. 왕씨 형제의 다툼으로 943년 왕연정이 건주(建州)에서 은(殷)을 세워 갈라섰고, 945년 남당이 건주를 함락해 망했다
  mapNote: 지도에는 907년부터 945년까지 표시하고, 907년 푸젠 전부(복주·건주(建州)·천주·장주·정주)를 반영함. 943~945년 은(殷)의 분열은 3년이라 민으로 그림
  endNote: 945년 남당군이 건주(建州)를 함락하고 왕연정이 항복해 망함. 복주는 이인달이 버티다 947년 오월에 넘어감
  features:
    - 도읍은 장락부(복주, 지금 푸저우)
    - 909년 후량이 왕심지를 민왕에 봉함
    - 933년 왕연균이 황제를 칭함
    - 943년 왕연정이 건주(建州)에서 은(殷)을 세움
    - 945년 남당에 망함
  startEvents: [min-wang-shenzhi-907]
  endEvents: [min-fall-945]
  basis:
    type: primary_source
    refs: ["『구오대사』 세습열전", "『신오대사』 민세가", "『자치통감』"]
    foundingNote: 왕심지가 실제로 푸젠을 다스린 907년부터 지도에 그림. 893년 왕조가 복주를 차지했고 909년 후량이 왕심지를 민왕에 봉함

- id: qingyuan-jun
  level: polity
  names: { ko: 청원군, hanja: 淸源軍, en: Qingyuan Circuit }
  from: 949
  to: 978
  color: "#8a63b0"
  summary: 유종효가 천주와 장주를 근거로 세운 번진. 민이 망한 뒤 남당을 섬기던 유종효는 947년 천주의 남당군을 쫓아내고 949년 장주까지 얻어 청원군 절도사가 되었다. 962년 진홍진이 실권을 잡고 송에 귀부했으며(964년 평해군), 978년 땅을 송에 바쳤다
  mapNote: 지도에는 949년부터 978년까지 표시하고, 천주·장주(취안저우·푸톈·샤먼·장저우·룽옌 동부)를 반영함. 945~948년 두 주는 남당 땅으로 그림
  endNote: 978년 진홍진이 천주·장주 두 주를 송에 바침
  features:
    - 치소는 천주(지금 취안저우)
    - 남당의 절도사로 명목상 신하였음
    - 964년 송이 평해군으로 이름을 고침
    - 바다 무역 항구 천주를 다스림
  startEvents: [min-fall-945]
  endEvents: [wuyue-qingyuan-submit-978]
  basis:
    type: primary_source
    refs: ["『송사』 세가", "『십국춘추』", "『자치통감』"]
    foundingNote: 유종효가 장주를 얻고 청원군 절도사가 된 949년을 시작으로 봄. 947년 천주를 차지함

- id: southern-han
  level: polity
  names: { ko: "남한(南漢)", hanja: 南漢, en: Southern Han }
  from: 907
  to: 971
  color: "#5a9d4e"
  summary: 유은·유엄 형제가 광저우를 근거로 세운 나라. 905년 청해군 절도사가 된 유은은 909년 남평왕에 이어 남해왕에 봉해졌으나 911년 죽었다. 뒤를 이은 아우 유엄이 광시 남부의 용관·옹관을 얻고 917년 황제를 칭해 대월이라 했다가 이듬해 한으로 고쳤다. 951년 초의 내분 틈에 계주(지금 구이린) 등 광시 북부를 얻었으나 971년 송에 항복했다
  mapNote: 지도에는 907년부터 971년까지 표시하고, 907년 광둥·하이난, 911년 광시 남부(용관·옹관), 912년 소주, 951년 초에게서 얻은 광시 북부·천저우·롄저우를 반영함. 930~931년의 교주(베트남 북부) 점령은 그리지 않음
  endNote: 971년 2월(음력) 송군이 광저우에 다가오자 유창이 항복함
  features:
    - 도읍은 흥왕부(지금 광저우)
    - 917년 유엄이 황제를 칭함(918년 국호 한)
    - 938년 교주(베트남 북부) 원정이 실패함
    - 951년 초의 내분 틈에 광시 북부를 얻음
    - 971년 송에 항복함
  startEvents: [southern-han-liu-yin-905]
  endEvents: [song-conquers-southern-han-971]
  basis:
    type: primary_source
    refs: ["『구오대사』 참위열전", "『신오대사』 남한세가", "『자치통감』"]
    foundingNote: 유은이 청해군 절도사로 광둥을 다스린 907년부터 지도에 그림. 905년 청해군 절도사, 917년 유엄이 칭제

- id: ma-chu
  level: polity
  names: { ko: "초(楚, 마씨)", hanja: 楚, en: Chu (Ma Chu) }
  from: 907
  to: 951
  color: "#a0703c"
  summary: 마은이 담주(지금 창사)를 근거로 후난에 세운 나라. 896년 무안군을 차지한 마은은 907년 후량에게서 초왕에 봉해졌고, 광시 북부의 계주 등과 연주까지 다스렸다. 927년 후당이 초국왕에 봉했다. 마은이 죽은 뒤 아들들의 다툼이 이어져 951년 남당이 장사를 접수해 망했고, 광시 북부는 남한이 가졌다
  mapNote: 지도에는 907년부터 951년까지 표시하고, 907년 후난과 광시 북·동부(정강군)·용관·연주, 911년 용관을 남한에게 잃은 모습을 반영함. 구이저우 동부의 토착 수령 땅은 넣지 않음
  endNote: 951년 남당이 장사를 접수하고 마희숭이 항복해 망함. 이듬해 유언이 남당군을 몰아내고 무평군을 세움
  features:
    - 도읍은 장사부(담주, 지금 창사)
    - 차 무역과 납·쇠 돈으로 재정을 꾸림
    - 911년 용관을 남한에게 잃음
    - 947년부터 마씨 형제의 다툼이 이어짐
    - 951년 남당에 망함
  startEvents: [ma-chu-ma-yin-907]
  endEvents: [ma-chu-fall-wuping-951]
  basis:
    type: primary_source
    refs: ["『구오대사』 세습열전", "『신오대사』 초세가", "『자치통감』"]
    foundingNote: 후량이 마은을 초왕에 봉한 907년을 시작으로 봄. 마은은 896년 담주를 차지해 무안군 절도사가 되었고 927년 초국왕에 봉해짐

- id: wuping-jun
  level: polity
  names: { ko: 무평군, hanja: 武平軍, en: Wuping Circuit }
  from: 952
  to: 963
  color: "#9a7b4f"
  summary: 초가 망한 뒤 유언이 낭주(지금 창더)에서 일으켜 후난을 다스린 번진. 952년 남당군을 몰아낸 유언이 무평군 절도사가 되었고, 왕규를 거쳐 956년 주행봉이 이어받아 후난을 모두 다스렸다. 962년 주행봉이 죽고 어린 주보권이 잇자 장문표가 반란을 일으켰고, 963년 송이 이를 구실로 군대를 보내 평정했다
  mapNote: 지도에는 952년부터 963년까지 표시하고, 남한이 가진 천저우 둘레를 뺀 후난을 반영함
  endNote: 963년 3월(음력) 송군이 낭주를 함락하고 주보권을 사로잡음
  features:
    - 치소는 낭주(지금 창더), 주행봉 때부터 담주도 다스림
    - 후주와 송에 칭신함
    - 963년 송의 형호 출병으로 평정됨
  startEvents: [ma-chu-fall-wuping-951]
  endEvents: [song-conquers-jingnan-chu-963]
  basis:
    type: primary_source
    refs: ["『송사』 세가", "『자치통감』", "『십국춘추』"]
    foundingNote: 유언이 남당군을 몰아낸 952년을 시작으로 봄. 무평군은 낭주에 둔 절도사 이름
