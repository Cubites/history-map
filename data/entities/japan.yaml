# 일본 열도
# 3번 묶음(600~935). 운영자 검수 필요.

- id: wa
  level: polity
  names: { ko: 왜, hanja: 倭, en: Wa }
  from: 57
  to: 700
  color: "#b86b8a"
  summary: 고대 일본 열도의 사람들과 나라를 중국·한국 기록이 부른 이름. 백제와 가까웠고, 백제 부흥운동을 도우려 백강에 수군을 보냄
  endNote: 701년 다이호 율령이 완성되어 일본이라는 이름을 쓰는 중앙 집권 국가의 틀이 갖추어졌고, 당에 간 사신이 새 국호를 알림. 국호를 바꾼 시기는 7세기 후반으로 학설이 갈리며 『삼국사기』는 670년으로 적음
  features:
    - 『후한서』는 무제가 조선을 멸망시킨 뒤 한과 사신을 주고받은 왜의 나라가 30여 곳이라고 적음
    - 107년에는 왜국왕 수승 등이 생구(노비) 160명을 바치고 알현을 청함
    - 백제와 가까웠음. 552년 백제의 불교가 일본에 전해짐
    - 663년 백강 전투에서 백제 부흥 운동을 돕다 졌고, 이후 백제 유민을 받아들이며 율령 국가로 나아감
  startEvents: [wa-gold-seal-57]
  endEvents: [wa-japan-700]
  basis:
    type: primary_source
    refs: ["『후한서』 동이열전 왜", "『수서』 왜국전", "『일본서기』"]
    foundingNote: 57년 왜의 노국이 후한에 사신을 보내 조공하자 광무제가 인수(도장과 끈)를 내림

- id: japan
  level: polity
  names: { ko: 일본, hanja: 日本, en: Japan }
  from: 701
  to: null
  color: "#b86b8a"
  summary: 왜가 국호를 일본으로 바꾼 뒤의 나라. 신라·발해와 사신을 주고받음
  mapNote: 지도에서는 대보율령(701)을 기준으로 함
  features:
    - 701년 다이호 율령이 완성되어 일본이라는 이름을 쓰는 중앙 집권 국가의 틀이 갖추어짐
    - 당에 간 사신은 새 국호를 알렸고, 신라·발해와 사신을 주고받음
  startEvents: [wa-japan-700]
  basis:
    type: primary_source
    refs: ["『속일본기』", "『신당서』 일본전"]
    foundingNote: 국호를 일본으로 바꾼 시기는 7세기 후반으로 학설에 따라 차이가 있음

# ── 8번 묶음 (1945 ~ 현재) ──

- id: ryukyu-us
  level: region
  names: { ko: 미국 통치하의 오키나와, en: Okinawa under US administration }
  from: 1945
  to: 1972
  color: "#b86b8a"
  summary: 제2차 세계 대전 뒤 미국이 통치한 류큐 제도(오키나와). 북쪽의 아마미 제도는 1953년 12월, 오키나와는 1972년 일본에 반환됨
  mapNote: 지도는 1946년(연합군 최고 사령관 각서 제677호)부터 류큐 제도(북위 29° 남쪽을 네모꼴로 묶음)를 그리고, 아마미 제도(북위 약 26.95° 북쪽)는 1953년 12월 25일 반환에 따라 1953년부터 일본 땅으로 그린다. 도카라 열도(1952년 2월 반환)는 그 네모꼴 밖이라 그리지 않음
  endNote: 1972년 5월 15일 미국 통치하의 오키나와가 일본에 돌아감. 북쪽의 아마미 제도는 1953년 12월에 먼저 돌아왔고 미군 기지는 대부분 남음
  features:
    - 오키나와 전투에서 많은 주민이 희생되었고, 끌려온 조선인도 이 전장에서 죽거나 고통을 겪음
    - 1946년 연합군 최고 사령부가 류큐 제도를 일본의 행정에서 떼어 냈고, 미국은 이곳을 군사 기지로 삼음
    - 샌프란시스코 강화 조약 제3조가 북위 29도 남쪽의 난세이 제도(아마미 제도와 류큐 제도 등)를 미국의 시정 아래 둠
    - 1969년 11월 닉슨과 사토가 1972년 반환에 합의했고, 1971년 6월 반환 협정을 맺음
  startEvents: [okinawa-1945]
  endEvents: [okinawa-reversion-1969]
  basis:
    type: primary_source
    refs: ["「샌프란시스코 강화 조약」 제3조", "「아마미 군도에 관한 일본국과 미합중국 간의 협정」(1953)"]
    # 작업 메모: (세션 I에서 고침, 전에는 1972년까지 미국 통치)
    foundingNote: 미군이 오키나와섬에 상륙해 오키나와 전투를 치르고 군정을 둔 1945년부터
