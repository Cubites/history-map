# 일본 열도
# 3번 묶음(600~935). 운영자 검수 필요.

- id: wa
  level: polity
  names: { ko: 왜, hanja: 倭, en: Wa }
  from: 57
  to: 700
  color: "#b86b8a"
  summary: 백제와 가까웠고, 백제 부흥운동을 도우려 백강에 수군을 보냄
  basis:
    type: primary_source
    refs: ["『후한서』 동이열전 왜", "『수서』 왜국전", "『일본서기』"]

- id: japan
  level: polity
  names: { ko: 일본, hanja: 日本, en: Japan }
  from: 701
  to: null
  color: "#b86b8a"
  summary: 왜가 국호를 일본으로 바꾼 뒤의 나라. 신라·발해와 사신을 주고받음
  basis:
    type: primary_source
    refs: ["『속일본기』", "『신당서』 일본전"]
    foundingNote: 국호를 일본으로 바꾼 시기는 7세기 후반으로 학설에 따라 차이가 있음. 지도에서는 대보율령(701)을 기준으로 함

# ── 8번 묶음 (1945 ~ 현재) ──

- id: ryukyu-us
  level: region
  names: { ko: 미국 통치하의 오키나와, en: Okinawa under US administration }
  from: 1945
  to: 1972
  color: "#b86b8a"
  summary: 제2차 세계 대전 뒤 미국이 통치한 류큐 제도(오키나와). 북쪽의 아마미 제도는 1953년 12월, 오키나와는 1972년 일본에 반환됨
  basis:
    type: primary_source
    refs: ["「샌프란시스코 강화 조약」 제3조", "「아마미 군도에 관한 일본국과 미합중국 간의 협정」(1953)"]
    foundingNote: 지도는 1946년(연합군 최고 사령관 각서 제677호)부터 류큐 제도 상자(북위 29° 남쪽)를 그리고, 아마미 제도(북위 약 26.95° 북쪽)는 1953년 12월 25일 반환에 따라 1953년부터 일본 땅으로 그린다(세션 I에서 고침, 전에는 1972년까지 미국 통치). 도카라 열도(1952년 2월 반환)는 상자 밖이라 그리지 않음
