# 위키 en Basutoland: 1868 영국 보호·1871 케이프 식민지 관할·1884 영국 직할 식민지(고등 판무관 아래 주재관)·1910부터 남아프리카에 둘러싸임·1966-10-04 레소토 왕국으로 독립. 1960~1965 LSO 10, vassal_of uk 1884~1965
