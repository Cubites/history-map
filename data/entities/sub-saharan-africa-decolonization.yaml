  color: "#4d34b2"
  summary: 서아프리카 대서양 기슭의 포르투갈 식민지. 1588년 카셰우에 포르투갈 거점이 서며 시작되었고, 1879년 카보베르데에서 떨어져 따로 식민지가 되었으며 1951년 해외 주가 됨. 1956년 아밀카르 카브랄 등이 세운 기니·카보베르데 아프리카 독립당(PAIGC)이 1963년부터 독립 전쟁을 벌여 내륙 대부분을 쥐었고, 1973년 1월 카브랄이 암살된 뒤 9월 24일 독립을 선언함
  mapNote: 지도에는 1945년부터 1973년까지 지금 기니비사우 땅(바다 쪽 비자고스 제도 포함)으로 표시함. 독립당이 1960년대 후반부터 내륙 대부분을 다스렸으나 포르투갈이 독립을 인정하기 앞까지는 포르투갈령으로 칠함. 1973년까지 포르투갈의 식민지였음은 포르투갈과의 관계로 나타냄
  endNote: 1974년 4월 카네이션 혁명 뒤 포르투갈 새 정부가 9월 10일 기니비사우의 독립을 인정하며 끝남
  features:
