- id: swaziland-protectorate
  level: polity
  names: { ko: 영국령 스와질란드, en: Swaziland Protectorate, native: Swaziland }
  from: 1780
  to: 1968
  color: "#348cb2"
  summary: 남아프리카와 모잠비크 사이의 보호국으로, 1903년부터 영국이 다스림. 그 앞은 스와지 왕국으로, 1780년 은드붕구니예가 왕이 되었고 그 아들 소부자 1세(1815~1836년)가 남쪽 은드완드웨의 압박을 피해 왕궁을 지금 나라 가운데로 옮기며 나라를 키웠으며, 음스와티 2세(1840~1868년) 때 땅이 가장 넓어지고 그 이름에서 '스와지'가 나옴. 1881년과 1884년 협약으로 독립을 인정받은 스와지 왕국은 1894년 12월 협약으로 트란스발 공화국의 보호국이 되었고, 1899년 10월 보어 전쟁이 터져 트란스발 관리가 물러날 때까지 그 다스림을 받음(트란스발의 보호가 법으로는 1902년 공화국이 없어질 때까지 남았다고도 봄). 1903년 보어 전쟁에서 이긴 영국이 따로 보호령을 선포하지 않고 다스리기 시작했고, 1906년부터 남아프리카 고등 판무관이 맡음. 왕실은 국왕 소부자 2세 아래 그대로 이어짐. 1909년 남아프리카법은 고등 판무관이 맡은 세 땅을 뒷날 연방에 넘길 수 있게 했으나, 영국은 주민 뜻을 들어 넘기지 않음
  mapNote: 지도에는 1800~1884년과 1894년부터 1967년까지 지금 에스와티니 땅으로 표시하고, 1893년까지는 스와지 왕국, 1894년부터는 스와질란드로 그림. 1894~1899년에는 트란스발 공화국에, 1903~1967년에는 영국에 종속된 땅으로 보임. 1885~1893년 독립 스와지 왕국 땅은 비워 둠. 음스와티 2세 때 지금 땅 밖 북쪽 바버턴 둘레까지 미친 땅은 따로 칠하지 않음
  endNote: 1968년 9월 6일 국왕 소부자 2세 아래 스와질란드 왕국으로 독립함
