# 위키 en Portuguese Angola: 1575 루안다 건설·1951 해외 주·1961 무장 투쟁 시작(1961-03-15 북부 침투)·1972-11 앙골라국(1973-01-01 시행)·1974-04-25 카네이션 혁명, 위키 en Cabinda Province: 1885 시물람부쿠 조약 보호령, 독립 1975-11-11. 1960~1974 AGO 18(카빈다 포함), vassal_of portugal 1575~1974(이음 1975 angola)
- id: portuguese-angola
  level: polity
  names: { ko: 포르투갈령 앙골라, en: Portuguese Angola, native: Província de Angola }
  from: 1575
  to: 1975
  color: "#8745c9"
  summary: 아프리카 남서부 대서양 기슭의 포르투갈 식민지. 1575년 해안에 루안다를, 1617년 남쪽에 벵겔라를 세운 뒤 오래 해안과 그 뒤쪽만 다스렸고, 1838년부터 내륙 원정을 보냈으나 20세기 초에야 지금 국경 안 땅 전부를 손에 넣음. 베를린 회의 뒤 1886년 프랑스·독일, 1891년 영국·콩고 자유국과 조약을 맺어 내륙 경계를 그었고, 바로체랜드 쪽 동쪽 경계는 1905년 이탈리아 왕의 중재로 정해짐. 1910년 본국 왕정이 무너져 포르투갈 공화국의 식민지가 되었고, 1930년 식민지법과 1933년 이스타두 노부 헌법으로 본국에 더 단단히 묶임. 1951년 포르투갈의 해외 주가 되었고, 1961년 봉기와 북부 침투로 앙골라 독립 전쟁이 시작되어 1974년까지 이어짐. 1973년부터 앙골라국이라 불림
  mapNote: 지도에는 1800년부터 1974년까지 표시하고, 1974년까지 포르투갈에 종속된 땅으로 보임. 1884년까지는 루안다·벵겔라 둘레 해안과 그 뒤쪽 땅만 그리고, 1885년부터 지금 앙골라 땅(북쪽에 떨어진 카빈다 포함)으로 그림. 남부 쿠네네강 둘레와 동부 쿠안도쿠방고·모시코·룬다 같은 내륙은 20세기 초까지 포르투갈이 거의 들어가지 못한 명목 지배 땅이나, 조약으로 정한 경계를 따라 이 색으로 그림
  endNote: 1974년 4월 25일 리스본의 카네이션 혁명 뒤 포르투갈이 전쟁을 멈추었고, 1975년 1월 알보르 협정을 거쳐 1975년 11월 11일 앙골라로 독립함
