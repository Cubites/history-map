  summary: 나이지리아 동쪽에 붙은 영국의 위임·신탁 통치령. 제1차 세계 대전 때 영국과 프랑스가 독일령 카메룬을 차지해 나누었고, 1922년 국제 연맹이 나이지리아와 맞닿은 서쪽의 좁고 긴 땅을 영국에 맡김. 1946년 유엔 신탁 통치령이 되었으며 내내 나이지리아에 붙여 다스림. 북부와 남부 두 지역으로 나뉘어 있었고, 1954년 남부는 나이지리아 연방 안의 준자치 지역인 남카메룬이 되었으며 북부는 나이지리아 북부 지역이 함께 다스림. 1959년 북부의 첫 주민 투표는 결정을 미룸
  mapNote: 지도에는 1945년부터 1960년까지 남부(지금 카메룬 북서·남서 지방)와 북부(지금 나이지리아 보르노·아다마와·타라바주의 동쪽 끝)를 함께 표시함. 북부는 베누에강 가의 욜라 둘레를 사이에 두고 두 덩어리로 떨어져 있었음. 1961년 주민 투표에 따라 북부는 나이지리아에, 남부는 카메룬에 합침
  endNote: 1961년 2월 11일 유엔 주민 투표로 북부는 6월 1일 나이지리아에, 남부는 10월 1일 카메룬 연방 공화국에 합쳐 없어짐
