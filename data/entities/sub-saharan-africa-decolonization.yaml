# 위키 ko·en 1588~1974-09-10(카셰우 거점 — 1879 카보베르데에서 떨어진 따로 된 식민지는 글), 1951~1972 해외 주·1972~1974 기니 국(위키 en), 독립 전쟁 1963~1974·선언 1973-09-24·포르투갈 승인 1974-09-10(기본값 1). 1960~1973 GNB 9(1910~1959는 F4·F3 시대 파일이 같은 id로 이음), vassal_of portugal 1588~1973
- id: portuguese-guinea
  level: polity
  names: { ko: 포르투갈령 기니, en: Portuguese Guinea, native: Guiné Portuguesa }
  from: 1588
  to: 1974
  color: "#4d34b2"
  summary: 서아프리카 대서양 기슭의 포르투갈 식민지. 1588년 카셰우에 포르투갈 거점이 서며 시작되었고, 1879년 카보베르데에서 떨어져 따로 식민지가 되었고, 1886년 프랑스와 맺은 협약으로 카자망스를 내주고 지금 경계가 정해짐. 1913~1915년 포르투갈군이 오두막세에 맞선 내륙 저항을 눌렀음. 중심은 1941년 볼라마에서 비사우로 옮겨졌고, 이 식민지는 1951년 해외 주가 됨. 1956년 아밀카르 카브랄 등이 세운 기니·카보베르데 아프리카 독립당(PAIGC)이 1963년부터 독립 전쟁을 벌여 내륙 대부분을 쥐었고, 1973년 1월 카브랄이 암살된 뒤 9월 24일 독립을 선언함
  mapNote: 지도에는 1879년부터 1973년까지 지금 기니비사우 땅(바다 쪽 비자고스 제도 포함)으로 표시함. 1915년 무렵까지 포르투갈의 내륙 지배는 명목에 그쳤으나 그동안도 포르투갈령 색으로 그림. 독립당이 1960년대 후반부터 내륙 대부분을 다스렸으나 포르투갈이 독립을 인정하기 앞까지는 포르투갈령으로 칠함. 1973년까지 포르투갈의 식민지였음은 포르투갈과의 관계로 나타냄
  endNote: 1974년 4월 카네이션 혁명 뒤 포르투갈 새 정부가 9월 10일 기니비사우의 독립을 인정하며 끝남
  features:
    - 1879년 카보베르데에서 떨어져 따로 식민지가 됨
    - 1941년 중심을 볼라마에서 비사우로 옮김
    - 1963~1974년 독립 전쟁
    - 1973년 1월 아밀카르 카브랄 암살, 9월 독립 선언
    - 1974년 9월 10일 포르투갈이 독립을 인정
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Portuguese Guinea", "위키백과 Guinea-Bissau War of Independence"]
