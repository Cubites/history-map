  color: "#84dbdb"
  summary: 칼라하리 사막을 낀 영국 보호령. 1885년 3월 31일 영국이 남위 22° 남쪽 츠와나족 땅에 보호령을 세웠고, 1890년 6월 30일 북쪽 응가미랜드까지 넓힘. 바수톨란드·스와질란드와 함께 남아프리카 고등 판무관이 맡아 다스렸고, 1895년 영국 남아프리카 회사에 넘기려 하자 카마 3세 등 츠와나 족장 셋이 런던에 가서 막음. 1910년 남아프리카 연방이 생길 때에도 연방에 넘기지 않고 영국 보호령으로 남김. 행정 중심은 보호령 밖 남아프리카 땅의 마페킹(지금 마피켕)에 두었음. 1948년 츠와나족 족장 후계자 세레체 카마가 영국 유학 중 백인 여성 루스 윌리엄스와 결혼하자 영국은 그를 보호령 밖으로 내보냈다가 뒤에 돌아오게 했고, 독립을 앞두고 1960년 세레체 카마가 베추아날란드 민주당을 세움
  mapNote: 지도에는 1885년부터 1965년까지 지금 보츠와나 땅으로 표시하되, 1889년까지는 남위 22° 남쪽만 그림. 1965년까지 영국에 종속된 땅으로 보임. 행정 중심 마페킹은 보호령 밖 영국령 베추아날란드(1895년부터 케이프 식민지, 1910년부터 남아프리카 연방, 1961년부터 공화국) 땅이라 그 나라 색에 듦. 북동쪽 타티 땅(약 5,200 km²)은 1911년에야 보호령에 정식으로 들어왔으나 1890년부터 이 색으로 둔 근사임
  endNote: 1966년 9월 30일 보츠와나 공화국으로 독립했고, 세레체 카마가 초대 대통령이 됨
