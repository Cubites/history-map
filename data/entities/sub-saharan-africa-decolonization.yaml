# 위키 ko·en 1588~1974-09-10(카셰우 거점 — 1879 카보베르데에서 떨어진 따로 된 식민지는 글), 1951~1972 해외 주·1972~1974 기니 국(위키 en), 독립 전쟁 1963~1974·선언 1973-09-24·포르투갈 승인 1974-09-10(기본값 1). 1960~1973 GNB 9, vassal_of portugal 1588~1973
