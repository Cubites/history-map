# 위키 en Bechuanaland Protectorate: 1885-03-31 보호령·1966-09-30 보츠와나 공화국으로 독립(세레체 카마의 베추아날란드 민주당). 행정 중심 마페킹은 보호령 밖(남아프리카 땅). 1960~1965 BWA 15, vassal_of uk 1885~1965
