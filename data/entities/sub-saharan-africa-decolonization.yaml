# sub-saharan-africa decolonization 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/decolonization.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1960~1974: 아프리카의 해부터 포르투갈령 독립 앞까지 (F2, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-decolonization' → 필터 단위 sub-saharan-africa).
# F2 뼈대(2026-11-11)가 새 식민지·구성 단위 항목 22개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f2/COMMON.md 4절 표, 표 원천 f2/skel/entities.tsv).
#   색은 본국 색이 아니라 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라와 ΔE 40 넘게 골랐다(f2/skel/tools/df2.mjs, COMMON P4). 본국은 data/relations.yaml의 vassal_of(칸 머리 아래).
#   이름은 위키백과 한국어판 표제로 확인했다(f2/skel/ko-titles*.txt — 표제가 없는 영국령 탕가니카·영국령 모리셔스·프랑스령 코모로·영국령 스와질란드는 영국령 감비아·영국령 카메룬·프랑스령 소말릴란드 꼴).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f2/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   앞 잇는 F1 항목 44는 이 파일에 없다 — data/entities/sub-saharan-africa-modern.yaml 그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절), 이웃 권역 항목 mauritania는 서아시아 middle-east-modern.yaml 블록(SH 칸).

