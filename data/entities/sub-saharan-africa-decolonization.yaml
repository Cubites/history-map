  from: 1498
  to: 1975
  color: "#3440b2"
  summary: 인도양 기슭 남동아프리카의 포르투갈 식민지. 1498년 바스쿠 다가마가 닿은 뒤 해안과 잠베지강 유역에 거점을 늘렸고, 강 계곡은 왕실이 땅을 내준 프라주 영주들이 다스렸으나 19세기 중엽에는 많이 쇠퇴함. 1875년 프랑스 대통령 마크 마옹의 중재로 로렌수마르케스가 있는 남쪽 만을 영국에 맞서 지켰고, 1895년 가자 제국을 정복해 그해 12월 28일 응궁구냐네 왕을 붙잡았으며, 1918년 무렵 내륙 대부분을 차지함. 1919년 독일령 동아프리카 남쪽 끝 키옹가 삼각지대를 넘겨받음. 1891년 특허 회사에 맡긴 땅 가운데 니아사 회사 몫은 1929년, 모잠비크 회사 몫은 1942년 되찾아 한 식민지로 다스렸고, 1951년 포르투갈의 해외 주가 되어 살라자르 정권은 본국과 하나인 땅이라고 내세움. 1962년 모잠비크 해방전선(FRELIMO)이 생겨 1964년 9월 25일 무장 투쟁을 시작함
  mapNote: 지도에는 1800년부터 1974년까지 표시하고, 1974년까지 포르투갈의 지배를 관계로 보임. 1884년까지는 잠베지강 아래쪽 계곡과 켈리마느 둘레의 프라주 땅만 그리고, 모잠비크섬·소팔라 같은 해안 거점은 작아 비워 둠. 1885년부터는 지금 모잠비크 땅으로 그리되, 1827~1894년 남쪽 가자 제국 땅은 가자 제국 색으로 그림. 북부 내륙은 오래 명목 지배에 그쳤으나 따로 칠하지 않고 포르투갈령 색으로 그림. 모잠비크 회사(1891~1942년)와 니아사 회사(1891~1929년)가 다스린 땅도 따로 칠하지 않고 포르투갈령 모잠비크 색으로 그림. 1919년 넘겨받은 키옹가 삼각지대도 1885년부터 이 색으로 그림. 해방 전선이 북부에서 차지한 땅도 따로 칠하지 않고 포르투갈령 색으로 그림
  endNote: 1974년 4월 리스본의 카네이션 혁명 뒤 9월 7일 루사카 협정으로 독립이 정해져, 1975년 6월 25일 모잠비크로 독립함
  features:
