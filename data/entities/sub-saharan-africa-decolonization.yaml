  summary: 남아프리카와 모잠비크 사이의 영국 보호령. 스와지 왕국은 1894년 트란스발 공화국의 보호 아래 들었다가, 1903년 보어 전쟁에서 영국이 이긴 뒤 영국 보호령이 됨. 1906년부터 남아프리카 고등 판무관이 맡아 다스렸고, 왕실은 국왕 소부자 2세 아래 그대로 이어짐
