# 위키 ko·en 포르투갈령 모잠비크 — 1498 바스쿠 다가마 도착 뒤 해안 거점, 1918 내륙 대부분 장악, 1942 모잠비크 회사 땅 되찾음. 모잠비크 독립 전쟁 1964-09-25~1974-09-08(위키 en Mozambican War of Independence), 루사카 협정 1974-09-07, 독립 1975-06-25. 1960~1974 MOZ 11, vassal_of portugal 1498~1974(이음 1975 mozambique)
