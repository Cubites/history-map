    foundingNote: 토착 세력(이맥)의 공격을 받아 현도군이 옥저 땅에서 고구려 서북쪽의 혼하 상류로 옮겨 간 기원전 75년부터(제2현도군)

- id: daehan-jeguk
  level: polity
  names: { ko: 대한제국, hanja: 大韓帝國, en: Korean Empire }
  from: 1897
  to: 1910
  color: "#3b6fb0"
  summary: 고종이 아관파천에서 돌아와 국호를 대한, 연호를 광무로 정하고 황제로 즉위해 세운 나라. 구본신참의 광무개혁을 추진했으나 을사늑약(1905)으로 외교권을 빼앗기고 1910년 일제에 국권을 강탈당함
  endNote: 1910년 일본이 이른바 '한국 병합 조약'을 강요해 국권을 빼앗고 조선 총독부를 설치함. 조약은 총리대신 이완용과 통감 데라우치 사이에 맺어져 8월 22일 조인되고 29일 공포됨
  features:
    - 1899년 황제가 군대 통수권과 입법·사법·행정권을 모두 가진다는 대한국 국제를 반포함
    - 구본신참을 내세워 원수부를 두고 양전 사업으로 지계를 발급하는 광무개혁을 추진함
    - 1900년 대한제국 칙령 제41호로 울도군을 설치함
    - 1905년 을사늑약으로 외교권을, 1909년 기유각서로 사법권을 빼앗김
  startEvents: [daehan-jeguk-1897]
  endEvents: [annexation-1910]
  basis:
    type: primary_source
    refs: ["『고종실록』 고종 34년", "「대한국 국제」"]
    foundingNote: 고종이 아관파천에서 돌아와 국호를 대한, 연호를 광무로 정하고 황제로 즉위한 1897년을 시작으로 봄

# 일제 강점기. 대한제국 땅 위에 일본 색으로 빗금 (DESIGN.md D8)
- id: occupied-korea
  level: region
  names: { ko: 일제 강점기의 한국, en: Korea under Japanese rule, hanja: "日帝強占期" }
  from: 1910
  to: 1945
  color: "#3e8ab8"
  summary: 1910년 국권 피탈부터 1945년 광복까지 일제가 조선 총독부를 두고 불법으로 지배한 시기. 무단 통치(1910년대), 이른바 문화 통치(1920년대), 민족 말살 통치(1930년대 후반~)로 이어졌으며, 국내외에서 독립운동이 끊이지 않음
  mapNote: 대한민국 임시정부(1919~)의 활동도 여기에 표시
  endNote: 1945년 미국의 원자 폭탄 투하와 소련의 참전 뒤 일본이 무조건 항복해 한국이 광복을 맞음
  features:
    - 1910년대 무단 통치에서는 헌병 경찰이 즉결 처분권을 갖고 조선 태형령(1912)으로 한국인만 매로 다스림
    - 토지 조사 사업을 벌이고 회사령(허가제)으로 한국인의 기업 설립을 막음
    - 1911년 제1차 조선 교육령으로 한국인 보통학교의 수업 연한을 4년으로 하여 일본인 학교보다 짧게 함
    - 1919년 3·1 운동이 일어나는 등 국내외에서 독립운동이 끊이지 않음
    - 1920년대 이른바 문화 통치를 거쳐 1930년대 후반부터 민족 말살 통치로 이어짐
  startEvents: [annexation-1910]
  endEvents: [liberation-1945]
  basis:
