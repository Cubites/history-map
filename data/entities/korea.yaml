  summary: 문자 기록이 없는 시대. 약 70만 년 전부터 사람이 살기 시작한 구석기 시대와, 기원전 8000년 무렵부터 토기와 간석기를 쓰며 정착한 신석기 시대로 나눈다. 청동기 시대(기원전 2000~1500년 무렵부터)에 고조선이 나타났다
  endNote: 기원전 2334년에 선사 시대가 끝남
  features:
    - 약 70만 년 전부터 사람이 살기 시작한 구석기 시대는 뗀석기를 쓰며 사냥과 채집으로 먹을 것을 구함
    - 구석기 시대에는 무리를 이루어 살았고 지도자는 있었으나 계급이 없는 평등 사회였음
    - 기원전 8000년 무렵부터 토기와 간석기를 쓰며 정착한 신석기 시대로 이어짐
    - 고조선은 청동기 시대(기원전 2000~1500년 무렵부터)에 나타남
  startEvents: [paleolithic]
  endEvents: []
