# ── 임진왜란 일본군 점령지 (6번 묶음). 조선 색 위에 일본 색으로 빗금 ──

- id: imjin-occupied
  level: region
  names: { ko: 임진왜란 일본군 점령지, en: Japanese-occupied Joseon (Imjin War) }
  from: 1592
  to: 1598
  color: "#3e8ab8"
  summary: 1592년 일본군이 부산~대구~상주~충주~한양 축과 경상좌도, 평양·함경도까지 차지한 지역. 전라도와 충청 서부, 낙동강 서쪽 경상우도는 관군과 의병이 지켜 점령되지 않았음. 1593년 평양성 탈환 뒤 경상도 남해안의 왜성 일대로 물러났고, 1597년 정유재란 때 다시 전라도로 들어와 순천에 왜성을 쌓았다가 1598년 철수함
  details: 전라도(1592년 6~9월 일본군이 잠시 차지한 동북쪽 금산·무주 일대 제외)와 충청 서부(공주·홍주·서산), 낙동강 서쪽 경상우도(진주·의령·합천·거창·함양)는 관군과 곽재우·김면·정인홍·조헌·영규 등의 의병이 지켜 점령되지 않았고(1592년 10월 진주 대첩), 황해도 연안성처럼 점령지 안에서 버틴 거점도 있었음. 1593년 평양성 탈환 뒤 경상도 남해안의 왜성 일대로 물러났다가 1598년 철수함. 강화 회담 시기(1593~1597)에는 서생포~부산~김해~웅천·거제의 왜성 띠에만 머물렀고, 1597년 정유재란 때 다시 전라도로 들어와 순천에 왜성을 쌓음
  endNote: 1598년 히데요시가 죽자 일본군이 물러나 철수함
  features:
    - 전라도(금산·무주 일대 제외)와 충청 서부(공주·홍주·서산)는 관군과 의병이 지켜 점령되지 않음
    - 낙동강 서쪽 경상우도(진주·의령·합천·거창·함양)도 곽재우·김면·정인홍 등의 의병이 지켜 점령되지 않음
    - 1593년 평양성 탈환 뒤 경상도 남해안의 왜성 일대로 물러남
    - 강화 회담 시기(1593~1597)에는 서생포~부산~김해~웅천·거제의 왜성 띠에만 머묾
    - 1597년 정유재란 때 다시 전라도로 들어와 순천에 왜성을 쌓음
  startEvents: [imjin-war-1592]
  endEvents: [jeongyu-war-1597]
  basis:
    type: primary_source
    refs: ["『선조실록』", "『선조수정실록』", "유성룡, 『징비록』"]
    foundingNote: 일본군이 부산진과 동래성을 함락하고 한양과 평양, 함경도까지 차지한 1592년부터

# ── 1번 묶음 (기원전 2333 ~ 기원전 1세기): 고조선과 진국 ──

- id: gojoseon
  level: polity
