- id: rok
  level: polity
  names: { ko: 대한민국, hanja: 大韓民國, en: Republic of Korea }
  from: 1948
  to: null
  color: "#3e8ab8"
  summary: 1948년 5·10 총선거로 구성된 제헌 국회가 헌법을 만들고 8월 15일 정부를 수립함. 제헌 헌법 전문은 기미 3·1 운동으로 대한민국을 건립한 독립 정신을 잇는다고 밝혔고, 현행 헌법 전문은 3·1 운동으로 세워진 대한민국 임시정부의 법통을 잇는다고 명시함. 유엔 총회에서 한반도의 유일한 합법 정부로 승인됨(1948.12)
  mapNote: 1953년 정전 협정 이후 경계는 군사 분계선(휴전선)
  features:
    - 제헌 헌법 전문은 기미 3·1 운동으로 대한민국을 건립한 독립 정신을 잇는다고 밝힘
    - 제헌 국회가 반민족 행위 처벌법을 만들고 반민 특위를 두었으나 친일 청산은 제대로 이루어지지 못함
    - 1948년 12월 유엔 총회에서 한반도의 유일한 합법 정부로 승인받음
    - 1960년 3·15 부정 선거에 맞선 4·19 혁명 뒤 이승만이 물러남
    - 1987년 6월 민주 항쟁 뒤 5년 단임 대통령 직선제의 현행 헌법(9차 개헌)이 만들어졌고, 전문은 임시정부의 법통을 잇는다고 명시함
  startEvents: [rok-founded-1948]
  basis:
    type: national_institution
    refs: ["「대한민국 헌법」", "국사편찬위원회 『한국사』"]
    foundingNote: 5·10 총선거로 구성된 제헌 국회가 헌법을 만들고 8월 15일 정부를 수립한 1948년을 시작으로 봄

