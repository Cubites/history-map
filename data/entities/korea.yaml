- id: hyeondo
  level: region
  names: { ko: 현도군, hanja: 玄菟郡, en: Xuantu Commandery }
  from: -74
  to: 106
  color: "#9e8468"
  summary: 한 무제가 고조선을 멸망시킨 이듬해(기원전 107) 옥저 땅에 둔 군현. 토착 세력(이맥)의 공격을 받아 기원전 75년 고구려 서북쪽의 혼하 상류(신빈 영릉진 일대)로 옮겼다(제2현도군). 고구려현·상은태현·서개마현을 거느렸고, 고구려는 한동안 이 군에서 조복과 의책을 받아 가다가 뒤에는 군의 동쪽 경계에 쌓은 책구루에서 받아 갔다. 고구려의 압박으로 서기 107년 무렵 다시 무순 방면으로 물러났다(제3현도군)
  mapNote: 지도에서는 제2현도군(기원전 75 ~ 서기 107 무렵)만 따로 표시. 제1현도군(기원전 107~75)은 범위가 불분명해 옥저로 두고, 제3현도군(무순)은 요동 안이라 중국 왕조 영토에 포함. 제3현도군으로 옮긴 연대도 기록에 뚜렷하지 않아 107년 무렵으로 봄. 치소 고구려현은 신빈 영릉진 고성으로 보는 것이 통설이고, 상은태·서개마현의 위치는 학설이 갈려(통화 적백송 고성설, 압록강 중류설 등) 실제 지배가 미친 혼하 상류·소자하 유역만 그림
  endNote: 고구려의 압박이 거세지자 107년 무렵 한이 현도군을 신빈 일대에서 서쪽 무순 방면으로 물림(제3현도군). 요동군의 고현·후성·요양현을 떼어 현도군에 붙임
  features:
