- id: gando-disputed
  level: region
  names: { ko: 간도 (귀속 논쟁), en: Gando (disputed) }
  from: 1883
  to: 1908
  color: "#b7ae9c"
  summary: 1712년 세운 백두산정계비의 '서쪽은 압록, 동쪽은 토문'이라는 문구에서 토문강을 조선은 쑹화강 지류로, 청은 두만강으로 해석했다. 조선인이 많이 옮겨 가 살자 1883년 어윤중을 보내 조사하고 감계 회담(1885·1887)을 열었으나 결론이 나지 않았다. 대한제국은 이범윤을 간도 관리사로 보냈으나(1903), 1909년 일본이 청과 간도 협약을 맺어 청의 땅으로 넘겼다
  endNote: 1909년 일본이 청과 간도 협약을 맺어 남만주 철도 부설권을 얻는 대가로 간도를 청의 영토로 인정함
  features:
    - 1712년 세운 백두산정계비의 '서쪽은 압록, 동쪽은 토문' 문구에서 토문강을 조선은 쑹화강 지류로, 청은 두만강으로 해석함
    - 19세기 중엽부터 조선 사람이 간도로 건너가 살았고 1881년 청이 봉금을 풀고 이주를 장려하자 더 늘었음
    - 1885·1887년 두 차례 감계 회담(조선 대표 이중하)을 열었으나 결론이 나지 않음
    - 대한제국이 1902년 이범윤을 간도에 보내 실태를 살피게 하고 이듬해 간도 관리사로 임명해 한인을 보호하고 세금을 걷게 함
  startEvents: [gando-gamgye-1883]
  endEvents: [gando-convention-1909]
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『신편 한국사』 39 제국주의의 침투와 동학농민전쟁", "동북아역사재단 『간도 문제』"]
    foundingNote: 조선이 어윤중을 보내 백두산정계비의 '토문'이 어느 강인지 조사하고 청에 국경 확정을 요구한 1883년부터

