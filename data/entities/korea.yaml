  endEvents: [han-invasion-109]
  basis:
    type: national_institution
    refs: ["『삼국유사』 기이 고조선", "『사기』 조선열전", "『한서』 지리지", "국사편찬위원회 『한국사』"]
    foundingNote: 건국 연대(기원전 2333년)는 『삼국유사』·『동국통감』의 기록에 따른 것이다

- id: jin-guk
