# 한국사 나라
# 연도는 천문 연도: 기원전 1년 = 0, 기원전 57년 = -56. from/to는 존속 첫해와 마지막 해(포함).
# 3번 묶음(600~935) 조사: 중고등학교 한국사 교과서 수준. 운영자 검수 필요.

- id: goguryeo
  level: polity
  names: { ko: 고구려, hanja: 高句麗, en: Goguryeo }
  from: -36
  to: 668
  color: "#c8745a"
  summary: 수·당의 침입을 막아 내며 만주와 한반도 북부를 차지한 삼국 중 가장 넓은 나라
  basis:
    type: primary_source
    refs: ["『삼국사기』 고구려본기"]
    foundingNote: 건국 연대(기원전 37년)는 『삼국사기』의 기록에 따름

- id: baekje
  level: polity
  names: { ko: 백제, hanja: 百濟, en: Baekje }
  from: -17
  to: 660
  color: "#7d9b5b"
  summary: 한반도 서남부를 차지하고 중국 남조·왜와 활발히 교류한 나라
  basis:
    type: primary_source
    refs: ["『삼국사기』 백제본기"]
    foundingNote: 건국 연대(기원전 18년)는 『삼국사기』의 기록에 따름

- id: silla
  level: polity
  names: { ko: 신라, hanja: 新羅, en: Silla }
  from: -56
  to: 935
  color: "#d4a93f"
  summary: 당과 연합해 백제·고구려를 무너뜨리고 나당 전쟁에서 이겨 삼국을 통일한 나라 (676년 이후 통일 신라)
  basis:
    type: primary_source
    refs: ["『삼국사기』 신라본기"]
    foundingNote: 건국 연대(기원전 57년)는 『삼국사기』의 기록에 따름

- id: balhae
  level: polity
  names: { ko: 발해, hanja: 渤海, en: Balhae }
  from: 698
  to: 926
  color: "#9a6fb0"
  summary: 고구려 장수 출신 대조영이 세운 고구려 계승 국가. 전성기에 해동성국이라 불림
  basis:
    type: primary_source
    refs: ["『구당서』 발해말갈전", "『신당서』 발해전"]

- id: hubaekje
  level: polity
  names: { ko: 후백제, hanja: 後百濟, en: Later Baekje }
  from: 900
  to: 936
  color: "#8fae6a"
  summary: 견훤이 완산주(전주)를 도읍으로 세운 나라. 백제 계승을 내세움
  basis:
    type: primary_source
    refs: ["『삼국사기』 권50 열전 견훤"]
    foundingNote: 견훤은 892년 무진주를 차지하고 900년 완산주에서 후백제를 세움

- id: hugoguryeo
  level: polity
  names: { ko: 후고구려, hanja: 後高句麗, en: Taebong }
  from: 901
  to: 918
  color: "#d98b6b"
  summary: 궁예가 송악(개성)을 도읍으로 세운 나라. 국호를 마진(904), 태봉(911)으로 바꿈
  basis:
    type: primary_source
    refs: ["『삼국사기』 권50 열전 궁예"]

- id: goryeo
  level: polity
  names: { ko: 고려, hanja: 高麗, en: Goryeo }
  from: 918
  to: 1392
  color: "#4f8f8a"
  summary: 왕건이 궁예를 몰아내고 세운 나라. 신라의 귀부(935)와 후백제 정복(936)으로 후삼국을 통일
  basis:
    type: primary_source
    refs: ["『고려사』 세가"]

- id: joseon
  level: polity
  names: { ko: 조선, hanja: 朝鮮, en: Joseon }
  from: 1392
  to: 1897
  color: "#3e8ab8"
  summary: 이성계와 신진 사대부가 세운 나라. 한양에 도읍하고 성리학을 통치 이념으로 삼았으며, 세종 때 4군 6진을 개척해 압록강~두만강 국경을 확정함
  basis:
    type: primary_source
    refs: ["『조선왕조실록』"]
    foundingNote: 1897년 국호를 대한제국으로 바꿈

# ── 원이 고려 땅에 둔 점령 기구 (4번 묶음). 고려 색 위에 원의 색으로 빗금 ──

- id: ssangseong
  level: region
  names: { ko: 쌍성총관부, hanja: 雙城摠管府, en: Ssangseong Prefecture }
  from: 1258
  to: 1356
  color: "#4f8f8a"
  summary: 몽골이 화주(영흥) 이북의 동북면을 차지하고 둔 기구. 1356년 공민왕이 무력으로 되찾음
  basis:
    type: primary_source
    refs: ["『고려사』 세가 고종 45년", "『고려사』 세가 공민왕 5년"]

- id: dongnyeong
  level: region
  names: { ko: 동녕부, hanja: 東寧府, en: Dongnyeong Prefecture }
  from: 1270
  to: 1290
  color: "#4f8f8a"
  summary: 원이 자비령 이북의 서북면을 차지하고 서경(평양)에 둔 기구. 1290년 고려에 돌려줌
  basis:
    type: primary_source
    refs: ["『고려사』 세가 원종 11년", "『고려사』 세가 충렬왕 16년"]

- id: tamna-chonggwanbu
  level: region
  names: { ko: 탐라총관부, hanja: 耽羅摠管府, en: Tamna Prefecture }
  from: 1273
  to: 1294
  color: "#4f8f8a"
  summary: 삼별초를 진압한 원이 제주에 둔 기구. 말을 기르는 목장을 운영함. 1294년 고려에 돌려줌
  basis:
    type: primary_source
    refs: ["『고려사』 세가 원종 14년", "『고려사』 세가 충렬왕 20년"]

# ── 임진왜란 일본군 점령지 (6번 묶음). 조선 색 위에 일본 색으로 빗금 ──

- id: imjin-occupied
  level: region
  names: { ko: 임진왜란 일본군 점령지, en: Japanese-occupied Joseon (Imjin War) }
  from: 1592
  to: 1598
  color: "#3e8ab8"
  summary: 1592년 일본군이 한양·평양과 함경도까지 차지한 지역. 1593년 평양성 탈환 뒤 경상도 남해안의 왜성 일대로 물러났다가 1598년 철수함
  basis:
    type: primary_source
    refs: ["『선조실록』", "유성룡, 『징비록』"]

# ── 1번 묶음 (기원전 2333 ~ 기원전 1세기): 고조선과 진국 ──

- id: gojoseon
  level: polity
  names: { ko: 고조선, hanja: 古朝鮮, en: Gojoseon }
  from: -2332
  to: -107
  color: "#9c6b3f"
  summary: 우리 역사 최초의 국가. 단군왕검이 아사달에 도읍해 세웠다고 전한다. 요령 지방과 한반도 서북부에서 청동기 문화를 바탕으로 성장했고, 기원전 3세기 무렵 부왕·준왕이 왕위를 세습했다. 위만이 집권한(기원전 194) 뒤 철기 문화를 본격적으로 받아들이고 중계 무역으로 번성했으나, 한 무제의 침입으로 기원전 108년 왕검성이 함락되었다. 사회 질서를 지키는 8조법이 있었다(3개 조항이 전함)
  basis:
    type: national_institution
    refs: ["『삼국유사』 기이 고조선", "『사기』 조선열전", "『한서』 지리지", "국사편찬위원회 『한국사』"]
    foundingNote: 건국 연대(기원전 2333년)는 『삼국유사』·『동국통감』의 기록에 따른 것이다. 청동기 문화가 성립한 뒤 국가가 형성되었다고 보는 견해가 일반적이며, 초기 세력 범위는 비파형 동검·고인돌·미송리식 토기의 분포를 바탕으로 한 추정이라 지도에서 "논쟁 중"으로 표시함. 위만 조선도 고조선을 이은 것으로 보아 한 나라로 표시

- id: jin-guk
  level: polity
  names: { ko: 진국, hanja: 辰國, en: Jin }
  from: -199
  to: -107
  color: "#a7a07c"
  summary: 고조선 남쪽, 한강 이남에 있던 나라. 위만에게 쫓긴 준왕이 남쪽으로 내려와 스스로 한왕이라 했다고 전한다. 고조선이 한과 진국 사이의 직접 교역을 막고 중계 무역을 했다. 뒤에 마한·진한·변한의 삼한으로 이어짐
  basis:
    type: primary_source
    refs: ["『사기』 조선열전", "『삼국지』 위서 동이전 한"]
    foundingNote: 성립 시기와 정확한 범위는 알 수 없어, 지도에서는 기원전 2세기부터 고조선 멸망(기원전 108)까지 한강 이남 전체로 표시

# ── 2번 묶음 (기원전 57 ~ 600): 여러 나라와 가야 ──

- id: buyeo
  level: polity
  names: { ko: 부여, hanja: 夫餘, en: Buyeo }
  from: -199
  to: 494
  color: "#b39a6b"
  summary: 쑹화강 유역의 평야에 자리 잡은 연맹 왕국. 왕 아래 마가·우가·저가·구가가 사출도를 다스림. 12월에 영고라는 제천 행사를 열고, 1책 12법과 순장 풍습이 있었음. 494년 고구려에 항복
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 부여", "『삼국사기』 고구려본기"]
    foundingNote: 기원전 2세기 이전에 성립한 것으로 보나 정확한 시기는 알 수 없음. 지도에서는 기원전 2세기(기원전 200년)부터 표시

- id: okjeo
  level: polity
  names: { ko: 옥저, hanja: 沃沮, en: Okjeo }
  from: -107
  to: 56
  color: "#a88d7a"
  summary: 함경도 해안 지역의 군장 국가. 읍군·삼로가 다스렸고 민며느리제와 가족 공동 무덤(골장제)이 있었음. 고구려에 공물을 바치다 태조왕 때 정복됨
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 동옥저", "『삼국사기』 고구려본기 태조대왕 4년"]
    foundingNote: 그 이전에는 고조선(위만 조선)의 영향 아래에 있었던 것으로 보아, 지도에서는 고조선이 멸망한 기원전 108년 무렵부터 표시

- id: dongye
  level: polity
  names: { ko: 동예, hanja: 東濊, en: Dongye }
  from: -107
  to: 313
  color: "#9c8f7c"
  summary: 강원도 북부 해안의 군장 국가. 10월에 무천을 열고, 다른 부족의 영역을 침범하면 노비·소·말로 갚는 책화와 족외혼이 있었음. 단궁·과하마·반어피가 특산물
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 예"]
    foundingNote: 고조선이 멸망한 기원전 108년 무렵부터 표시. 멸망 시기가 분명하지 않아, 지도에서는 고구려가 낙랑군을 몰아낸 313년 무렵 고구려에 흡수된 것으로 표시

- id: mahan
  level: polity
  names: { ko: 마한, hanja: 馬韓, en: Mahan }
  from: -107
  to: 369
  color: "#8fa478"
  summary: 삼한 가운데 가장 큰 연맹체로 54개 소국으로 이루어짐. 목지국의 지배자가 삼한을 주도함. 제사장인 천군이 신성 지역인 소도를 다스리는 제정 분리 사회였고, 5월 수릿날과 10월 계절제를 지냄. 백제가 성장하며 흡수함
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 한"]
    foundingNote: 진국을 이어 고조선 멸망(기원전 108) 무렵부터, 근초고왕이 마한을 정복한 369년까지 표시

- id: jinhan
  level: polity
  names: { ko: 진한, hanja: 辰韓, en: Jinhan }
  from: -107
  to: 356
  color: "#c9b27a"
  summary: 낙동강 동쪽의 12개 소국 연맹체. 그 가운데 사로국이 성장해 신라가 됨
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 한"]
    foundingNote: 진국을 이어 고조선 멸망(기원전 108) 무렵부터, 내물 마립간이 진한 지역을 대부분 차지한 356년 무렵까지 표시

- id: byeonhan
  level: polity
  names: { ko: 변한, hanja: 弁韓, en: Byeonhan }
  from: -107
  to: 42
  color: "#a3a37a"
  summary: 낙동강 서쪽의 12개 소국 연맹체. 철이 많이 나서 낙랑과 왜에 수출하고 화폐처럼 사용함. 가야 연맹으로 이어짐
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 변진"]
    foundingNote: 진국을 이어 고조선 멸망(기원전 108) 무렵부터, 금관가야가 세워진 42년에 가야로 이어진 것으로 표시

- id: gaya
  level: polity
  names: { ko: 가야, hanja: 伽倻, en: Gaya }
  from: 42
  to: 562
  color: "#b98a5e"
  summary: 낙동강 하류의 소국들이 이룬 연맹. 전기에는 김해의 금관가야, 5세기 이후에는 고령의 대가야가 중심. 철이 풍부해 덩이쇠를 화폐처럼 쓰고 낙랑·왜와 교역함. 중앙 집권 국가로 성장하지 못하고 신라에 병합됨
  basis:
    type: primary_source
    refs: ["『삼국유사』 가락국기", "『삼국사기』 신라본기"]
    foundingNote: 건국 연도(42년)는 『삼국유사』 가락국기의 김수로왕 건국 기록에 따름. 지도에서는 여러 가야를 하나의 연맹으로 묶어 표시

- id: tamna
  level: polity
  names: { ko: 탐라, hanja: 耽羅, en: Tamna }
  from: 200
  to: 1104
  color: "#6f9a8c"
  summary: 제주도에 있던 나라. 고을나·양을나·부을나의 삼성 신화가 전한다. 백제에 방물을 바치고(476) 동성왕 때 복속했으며(498), 백제가 망한 뒤 신라(662), 고려(938)에 차례로 조공했다. 1105년 고려의 탐라군이 되었다
  basis:
    type: primary_source
    refs: ["『삼국지』 위서 동이전 한 (주호)", "『삼국사기』 백제본기 문주왕 2년·동성왕 20년", "『고려사』 세가"]
    foundingNote: 『삼국지』 동이전에 마한 서쪽 바다의 큰 섬 "주호(州胡)"로 처음 보이므로, 지도에서는 3세기(200년)부터 표시

# ── 한 군현 (2번 묶음). 옛 고조선 땅에 한이 둔 군현. 중국 왕조의 색으로 빗금 ──

- id: nangnang
  level: region
  names: { ko: 낙랑군, hanja: 樂浪郡, en: Lelang Commandery }
  from: -107
  to: 313
  color: "#9b8a70"
  summary: 한 무제가 고조선을 멸망시키고 대동강 유역에 둔 군현. 3세기 초 공손씨가 남쪽에 대방군을 나누어 설치함(지도에서는 함께 표시). 313년 고구려 미천왕에게 쫓겨남
  basis:
    type: primary_source
    refs: ["『한서』 지리지", "『삼국사기』 고구려본기 미천왕 14년"]

# ── 7번 묶음 (1876 ~ 1945) ──

- id: daehan-jeguk
  level: polity
  names: { ko: 대한제국, hanja: 大韓帝國, en: Korean Empire }
  from: 1897
  to: 1910
  color: "#3b6fb0"
