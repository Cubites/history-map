  from: -2332
  to: -107
  color: "#9c6b3f"
  summary: 우리 역사 최초의 국가. 단군왕검이 아사달에 도읍해 세웠다고 전한다. 요령 지방과 한반도 서북부에서 청동기 문화를 바탕으로 성장했고, 기원전 3세기 무렵 부왕·준왕이 왕위를 세습했다. 위만이 집권한(기원전 194) 뒤 철기 문화를 본격적으로 받아들이고 중계 무역으로 번성했으나, 한 무제의 침입으로 기원전 108년 왕검성이 함락되었다. 사회 질서를 지키는 8조법이 있었다(3개 조항이 전함)
  mapNote: 청동기 문화가 성립한 뒤 국가가 형성되었다고 보는 견해가 일반적이며, 초기 세력 범위는 비파형 동검·고인돌·미송리식 토기의 분포를 바탕으로 한 추정이라 지도에서 "논쟁 중"으로 표시함. 위만 조선도 고조선을 이은 것으로 보아 한 나라로 표시
  endNote: 한 무제의 침입을 1년 가까이 버텼으나 지배층이 분열해 우거왕이 살해되었고, 대신 성기가 끝까지 싸웠지만 기원전 108년 왕검성이 함락되어 멸망함. 한은 그 땅에 낙랑·진번·임둔군을 둠
  features:
