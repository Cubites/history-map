# ── 8번 묶음 (1945 ~ 현재) ──
# 미·소 군정: 한국 땅 위에 점령국 색으로 빗금

- id: usamgik
  level: region
  names: { ko: 미군정기 남한, en: US Army Military Government in Korea, hanja: "在朝鮮美國陸軍司令部軍政廳" }
  from: 1945
  to: 1948
  color: "#3e8ab8"
  summary: 광복 뒤 북위 38도선 이남을 미군이 점령하고 군정을 실시한 시기(1945.9~1948.8). 조선 총독부 관리를 그대로 쓰고, 조선 인민 공화국과 대한민국 임시정부를 인정하지 않음
  endNote: 1948년 5·10 총선거로 제헌 국회가 구성되고 8월 15일 대한민국 정부가 수립됨
  features:
    - 조선 총독부의 관리와 경찰을 그대로 쓰는 직접 통치를 폄
    - 조선 인민 공화국과 대한민국 임시정부를 인정하지 않음
    - 신탁 통치 논쟁에서 우익은 반탁 운동을 벌였고 좌익은 결정을 지지하는 쪽으로 돌아서 좌우 대립이 심해짐
    - 쌀의 자유 거래를 허용했다가 쌀값이 폭등하자 미곡 수집령(1946)으로 다시 쌀을 거둠
    - 신한공사(1946)를 세워 동양 척식 주식회사 등 일본인이 가졌던 토지를 관리하게 함
  startEvents: [division-1945, us-military-government-1945]
  endEvents: [rok-founded-1948]
  basis:
    type: primary_source
    refs: ["「맥아더 포고 제1호」", "국사편찬위원회 『한국사』"]
    foundingNote: 미군이 태평양 미국 육군 총사령관 포고 제1호(1945.9)에 따라 38도선 이남에 군정을 실시하고 서울에 미군정청을 둔 1945년부터

- id: soviet-north
  level: region
  names: { ko: 소련군정기 북한, en: Soviet Civil Administration in North Korea, hanja: "蘇聯民政廳" }
  from: 1945
  to: 1948
  color: "#3e8ab8"
  summary: 광복 뒤 북위 38도선 이북을 소련군이 점령한 시기. 각 지역 인민 위원회를 통해 간접 통치했고, 북조선 임시 인민 위원회(1946)가 토지 개혁 등을 추진함
  endNote: 1948년 북쪽에서 최고 인민 회의 선거를 거쳐 9월 9일 김일성을 수상으로 조선 민주주의 인민 공화국 정부가 세워짐
  features:
    - 치스차코프가 이끄는 제25군이 8월 하순 평양에 들어옴
    - 남쪽의 미군정과 달리 각지의 인민 위원회를 인정하고 그 뒤에서 통치함
    - 1946년 김일성을 위원장으로 북조선 임시 인민 위원회가 세워짐
    - 무상 몰수·무상 분배 방식의 토지 개혁과 주요 산업 국유화를 추진함
  startEvents: [division-1945, soviet-north-korea-1945]
  endEvents: [dprk-founded-1948]
  basis:
    type: primary_source
    refs: ["국사편찬위원회 『한국사』"]
