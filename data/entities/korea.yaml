# 한국사 나라
# 연도는 천문 연도: 기원전 1년 = 0, 기원전 57년 = -56. from/to는 존속 첫해와 마지막 해(포함).
# 3번 묶음(600~935) 조사: 중고등학교 한국사 교과서 수준. 운영자 검수 필요.

- id: goguryeo
  level: polity
  names: { ko: 고구려, hanja: 高句麗, en: Goguryeo }
  from: -36
  to: 668
  color: "#c8745a"
  summary: 수·당의 침입을 막아 내며 만주와 한반도 북부를 차지한 삼국 중 가장 넓은 나라
  mapNote: 건국 연대(기원전 37년)는 『삼국사기』의 기록에 따름. 기원전 37년~서기 56년 영역은 졸본·국내성과 혼강 하류·압록강 중하류 북안(관전 동남부)을 대략 나타낸 추정
  endNote: 연개소문이 죽은 뒤 아들들 사이에 권력 다툼이 벌어져 약해진 가운데, 668년 나당 연합군이 평양성을 함락해 멸망함. 당은 평양에 안동도호부를 둠
  features:
    - 예맥 계통으로 여겨지며, 중국 기록은 부여의 별종이라 하고 압록강 가의 소수맥을 한 갈래로 적음
    - 산간 지역이라 식량이 부족해 주변 지역을 정복하며 성장함
    - 태조왕 때 계루부 고씨가 왕위를 독점 세습하며 중앙 집권 국가의 기틀을 마련함
    - 313년 미천왕이 낙랑군을 몰아내 대동강 유역을 차지함
    - 402년 광개토대왕이 후연과 싸워 요동 지역을 차지함
  startEvents: [goguryeo-founded]
  endEvents: [goguryeo-falls-668]
  basis:
    type: primary_source
    refs: ["『삼국사기』 고구려본기"]
    foundingNote: 건국 연대(기원전 37년)는 『삼국사기』의 기록에 따름

- id: baekje
  level: polity
  names: { ko: 백제, hanja: 百濟, en: Baekje }
  from: -17
  to: 660
  color: "#7d9b5b"
  summary: 한반도 서남부를 차지하고 중국 남조·왜와 활발히 교류한 나라
  mapNote: 건국 연대(기원전 18년)는 『삼국사기』의 기록에 따름. 369~396년 북쪽 경계는 예성강 서쪽 연안·배천까지를 백제로, 해주만 서쪽 옹진·강령 반도를 고구려로 둔 추정(369년 치양 전투, 386년 청목령에서 서해에 이르는 관방 기사 참고)
  endNote: 660년 김유신의 신라군이 황산벌에서 계백의 결사대를 물리치고, 바다를 건너온 당군과 함께 사비성을 함락해 멸망함. 당은 옛 백제 땅에 웅진도독부를 둠
  features:
    - 한성 도읍기의 왕성으로 서울 송파의 풍납동 토성과 몽촌토성이 여겨짐
    - 369년 근초고왕이 마한을 정복하고, 371년 평양성을 공격해 고구려 고국원왕이 전사함
    - 384년 불교를 받아들이고 552년 일본에 불교를 전함. 서산 마애 여래 삼존상은 '백제의 미소'로 불림
    - 475년 한성이 함락되어 웅진으로 도읍을 옮겼고, 521년 무령왕이 양과 교류하며 22담로를 둠. 538년 사비로 옮김
  startEvents: [baekje-founded]
  endEvents: [baekje-falls-660]
  basis:
    type: primary_source
    refs: ["『삼국사기』 백제본기"]
    foundingNote: 『삼국사기』의 기록에 따라 온조가 한강 유역의 위례성에서 백제를 세운 기원전 18년을 시작으로 봄

- id: silla
  level: polity
  names: { ko: 신라, hanja: 新羅, en: Silla }
  from: -56
  to: 935
  color: "#d4a93f"
  summary: 당과 연합해 백제·고구려를 무너뜨리고 나당 전쟁에서 이겨 삼국을 통일한 나라 (676년 이후 통일 신라)
  mapNote: 건국 연대(기원전 57년)는 『삼국사기』의 기록에 따름. 기원전 57년~356년 영역은 사로국(경주 분지와 포항·감포·호미곶 해안)을 대략 나타낸 추정. 영일을 진한 소국 근기국으로 보는 견해도 있음
  endNote: 927년 견훤이 경주에 쳐들어가 경애왕을 죽게 했고, 935년 경순왕이 나라를 고려에 넘겨 멸망함
  features:
    - 초기에는 박·석·김의 세 성씨가 번갈아 왕위를 이었고, 왕의 칭호는 거서간·차차웅·이사금으로 바뀜
    - 356년 내물 마립간이 즉위해 김씨가 왕위를 독점 세습하고 대군장을 뜻하는 마립간이라는 칭호를 씀
    - 531년 법흥왕이 상대등을 두었고, 귀족들은 화백 회의에서 나라의 중요한 일을 만장일치로 결정함
    - 진흥왕이 이사부와 사다함을 보내 대가야를 정복해 낙동강 유역 전체를 차지함
    - 680년 9서당 10정, 685년 9주 5소경을 정비함
  startEvents: [silla-founded]
  endEvents: [silla-falls-935]
  basis:
    type: primary_source
    refs: ["『삼국사기』 신라본기"]
    foundingNote: 건국 연대(기원전 57년)는 『삼국사기』의 기록에 따름

- id: balhae
  level: polity
  names: { ko: 발해, hanja: 渤海, en: Balhae }
  from: 698
  to: 926
  color: "#9a6fb0"
  summary: 고구려 장수 출신 대조영이 세운 고구려 계승 국가. 전성기에 해동성국이라 불림
  endNote: 925년 말 거란(요)의 야율아보기가 발해를 쳐 이듬해 정월 상경 홀한성을 함락해 멸망시킴. 거란은 옛 발해 땅에 동단국을 두었고 세자 대광현 등 많은 유민이 고려로 넘어옴
  features:
    - 713년 당이 대조영을 발해군왕으로 책봉했고 762년 발해국으로 인정함
    - 719~726년 무왕이 흑수말갈 정벌을 추진함
    - 756년 문왕이 체제를 정비함
    - 선왕 무렵 지방을 5경 15부 62주로 나누어 다스렸고, 유학 교육 기관으로 주자감을 둠
    - 선왕 때 영토가 가장 넓어졌고, 전성기에는 해동성국이라 불림
  startEvents: [second-turks-679, balhae-founded-698]
  endEvents: [khitan-liao-907, balhae-falls-926]
  basis:
    type: primary_source
    refs: ["『구당서』 발해말갈전", "『신당서』 발해전"]
    foundingNote: 고구려 장수 출신 대조영이 고구려 유민과 말갈인을 이끌고 동모산에서 발해를 세운 698년을 시작으로 봄

- id: hubaekje
  level: polity
  names: { ko: 후백제, hanja: 後百濟, en: Later Baekje }
  from: 900
  to: 936
  color: "#8fae6a"
  summary: 견훤이 완산주(전주)를 도읍으로 세운 나라. 백제 계승을 내세움
  endNote: 935년 견훤이 아들 신검에게 쫓겨나 고려에 투항했고, 936년 고려가 일리천 전투에서 후백제군을 크게 물리쳐 후백제를 멸망시키고 후삼국을 통일함
  features:
    - 백제 계승을 내세움
    - 견훤은 상주 가은현(문경) 출신으로 서남해 방비를 맡은 군인이었음
    - 오월과 후당에 사신을 보내 외교 관계를 맺었고 925년 후당에서 백제왕으로 책봉됨
    - 927년 견훤이 경주에 쳐들어가 경애왕을 죽게 했고, 공산에서 왕건의 고려군을 크게 이김
  startEvents: [hubaekje-founded-900]
  endEvents: [unification-936]
  basis:
    type: primary_source
    refs: ["『삼국사기』 권50 열전 견훤"]
    foundingNote: 견훤은 892년 무진주를 차지하고 900년 완산주에서 후백제를 세움

- id: hugoguryeo
  level: polity
  names: { ko: 후고구려, hanja: 後高句麗, en: Taebong }
  from: 901
  to: 918
  color: "#d98b6b"
  summary: 궁예가 송악(개성)을 도읍으로 세운 나라. 국호를 마진(904), 태봉(911)으로 바꿈. 903년 왕건이 수군으로 후백제 뒤쪽의 나주 일대를 차지함
  endNote: 궁예가 미륵불을 자처하며 폭정을 일삼아 신하들의 반발을 샀고, 918년 신하들이 궁예를 몰아내고 왕건을 왕으로 세워 고려로 이어짐
  features:
    - 903년 궁예의 장수 왕건이 수군으로 후백제 뒤쪽의 나주 일대를 차지함
    - 904년 국호를 마진으로 바꾸고 최고 정무 기구인 광평성을 두었으며, 이듬해 도읍을 철원으로 옮김
    - 911년 국호를 태봉으로 고침
  startEvents: [hugoguryeo-founded-901]
  endEvents: [goryeo-founded-918]
  basis:
    type: primary_source
    refs: ["『삼국사기』 권50 열전 궁예"]
    foundingNote: 신라 왕족 출신이라 전해지는 궁예가 송악(개성)에 도읍하고 후고구려를 세운 901년을 시작으로 봄

- id: goryeo
  level: polity
  names: { ko: 고려, hanja: 高麗, en: Goryeo }
  from: 918
  to: 1392
  color: "#4f8f8a"
  summary: 왕건이 궁예를 몰아내고 세운 나라. 신라의 귀부(935)와 후백제 정복(936)으로 후삼국을 통일
  endNote: 정몽주 등 고려를 지키려던 세력이 제거된 뒤 1392년 이성계가 공양왕을 물러나게 하고 왕위에 올라 멸망함. 이듬해 국호를 조선으로 정함
  features:
    - 935년 신라가 귀부하고 936년 후백제를 정복해 후삼국을 통일함
    - 태조 왕건은 호족의 딸을 왕비로 맞고 왕씨 성을 내렸으며(사성 정책) 서경(평양)을 북진 정책의 기지로 중시함
    - 958년 광종이 과거제를 실시하고, 성종 때 유교 정치를 펴 995년 2성 6부의 중앙 정치 조직을 갖춤
    - 1170년 무신 정변, 1232년 강화도 천도, 1270년 개경 환도 뒤 원의 간섭을 받았고 1356년 공민왕이 반원 개혁을 벌임
    - 1145년 『삼국사기』, 1281년 『삼국유사』를 편찬함. 1377년 청주 흥덕사에서 『직지심체요절』을 금속 활자로 찍음
  startEvents: [goryeo-founded-918]
  endEvents: [goryeo-falls-1392]
  basis:
    type: primary_source
    refs: ["『고려사』 세가"]
    foundingNote: 신하들이 폭정을 일삼던 궁예를 몰아내고 왕건을 왕으로 세운 918년을 시작으로 봄

- id: joseon
  level: polity
  names: { ko: 조선, hanja: 朝鮮, en: Joseon }
  from: 1392
  to: 1897
  color: "#3e8ab8"
  summary: 이성계와 신진 사대부가 세운 나라. 한양에 도읍하고 성리학을 통치 이념으로 삼았으며, 세종 때 4군 6진을 개척해 압록강~두만강 국경을 확정함
  endNote: 아관파천으로 러시아 공사관에 거처를 옮겼던 고종이 1897년 경운궁(덕수궁)으로 돌아와 연호를 '광무'로 고치고 환구단에서 황제 즉위식을 올린 뒤 국호를 '대한'으로 정함. 이로써 대한제국으로 이어짐
  features:
    - 1394년 태조가 도읍을 개경에서 한양으로 옮기고 정도전이 경복궁과 종묘·사직의 위치를 정함
    - 성리학을 통치 이념으로 삼고 『경국대전』으로 통치 조직을 완성함. 의정부 3정승과 6조가 나랏일을 맡음
    - 세종 때 4군 6진을 개척해 압록강~두만강 국경을 확정함
    - 태종이 주자소를 두고 계미자(1403)를 만들었고, 세종 때 경자자(1420)와 갑인자(1434)로 인쇄 속도를 높임
    - 1608년 경기도에서 대동법, 1750년 균역법을 실시함. 1876년 강화도 조약 뒤 갑오개혁(1894~1895)이 이어짐
  startEvents: [goryeo-falls-1392]
  endEvents: [daehan-jeguk-1897]
  basis:
    type: primary_source
    refs: ["『조선왕조실록』"]
    foundingNote: 이성계가 공양왕을 물러나게 하고 왕위에 오른 1392년을 시작으로 봄. 이듬해 국호를 조선으로 정함

# ── 원이 고려 땅에 둔 점령 기구 (4번 묶음). 고려 색 위에 원의 색으로 빗금 ──

- id: ssangseong
  level: region
  names: { ko: 쌍성총관부, hanja: 雙城摠管府, en: Ssangseong Prefecture }
  from: 1258
  to: 1356
  color: "#4f8f8a"
  summary: 몽골이 화주(영흥) 이북의 동북면을 차지하고 둔 기구. 1356년 공민왕이 무력으로 되찾음
  endNote: 1356년 공민왕이 쌍성총관부를 공격해 철령 이북의 땅을 되찾음
  features:
    - 몽골이 철령 이북을 직접 다스림
    - 같은 해 고려에서는 최의가 살해되어 최씨 정권이 무너지고 몽골군이 쳐들어옴
  startEvents: [ssangseong-1258]
  endEvents: [gongmin-reform-1356]
  basis:
    type: primary_source
    refs: ["『고려사』 세가 고종 45년", "『고려사』 세가 공민왕 5년"]
    foundingNote: 동북면의 조휘와 탁청이 몽골에 투항하자 몽골이 화주(영흥)에 쌍성총관부를 둔 1258년부터

- id: dongnyeong
  level: region
  names: { ko: 동녕부, hanja: 東寧府, en: Dongnyeong Prefecture }
  from: 1270
  to: 1290
  color: "#4f8f8a"
  summary: 원이 자비령 이북의 서북면을 차지하고 서경(평양)에 둔 기구. 1290년 고려에 돌려줌
  endNote: 1290년 원이 고려의 거듭된 요청을 받아들여 동녕부를 없애고 서북면을 돌려줌
  startEvents: [return-gaegyeong-1270]
  endEvents: [dongnyeong-returned-1290]
  basis:
    type: primary_source
    refs: ["『고려사』 세가 원종 11년", "『고려사』 세가 충렬왕 16년"]
    foundingNote: 1269년 서북면의 최탄 등이 반란을 일으켜 몽골에 투항하자 몽골이 서경에 동녕부를 둔 1270년부터

- id: tamna-chonggwanbu
  level: region
  names: { ko: 탐라총관부, hanja: 耽羅摠管府, en: Tamna Prefecture }
  from: 1273
  to: 1294
  color: "#4f8f8a"
