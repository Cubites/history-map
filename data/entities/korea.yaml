  summary: 연의 장수 진개가 고조선 서쪽 땅 2천여 리를 빼앗고 만번한을 경계로 삼았다. 만번한의 위치를 요동의 천산산맥 부근으로 보면 이곳은 고조선 땅이고, 청천강 부근으로 보면 연(뒤에 진·한)의 땅이 된다. 한 초에는 패수를 경계로 삼았는데 패수의 위치(압록강·청천강 등)도 학설이 갈린다
  endNote: 기원전 195년 연왕 노관이 한을 배반하고 흉노로 달아남. 이어 연 지역에서 온 위만이 준왕에게서 서쪽 변경을 맡았다가 기원전 194년 왕이 됨
