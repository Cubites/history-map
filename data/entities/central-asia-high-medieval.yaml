# central-asia high-medieval 나라 (시대 파일 scripts/geo/areas/central-asia/high-medieval.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 821~1219: 사만·카라한·가즈니·서요
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-high-medieval').
# 칸 나눔(C3 뼈대 2026-11-06, ca3/c3/COMMON.md 4·5·6절): 구현 칸 W2·E2는 아래 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다(색은 C3 뼈대 skel/de.mjs로 이웃과 ΔE 26 넘게 고름).
#   from·to는 표의 값 — 끝·시작 해는 정의 칸이 사료로 한 번 확인한다(다르면 결과 노트 2절). 항목 to는 끝 해 포함, 지도는 칠하는 마지막 해까지. native는 정의 칸이 원어판 위키로 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis.foundingNote도 그 칸이 더함 — COMMON 6절 탭 칸, startEvents·endEvents는 사건 ca-02·ca-03 몫이라 빈 목록 그대로).
#   다른 칸이 칠하기만 하는 땅의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다(COMMON 5절).
# 늘린 나라(서아시아·남아시아·동아시아·내륙아시아·유럽 yaml)는 이 파일에 두지 않고 그 파일 블록에서 고친다(COMMON 5절 굵은 칸만, 그 나라 글만).

# ══ C3 W2 항목 ══
- id: mamunid-dynasty
  level: polity
  names: { ko: 호라즘의 마문 왕조, en: Mamunids, native: مأمونیان }
  from: 995
  to: 1017
  color: "#859640"
  summary: 호라즘 북쪽 구르간지에서 일어나 995년 카트의 아프리그 왕조를 무너뜨리고 호라즘 샤 칭호를 이은 왕조. 아무다리야 하류의 호라즘 오아시스를 하나로 묶었고, 비루니·이븐 시나 같은 학자가 궁정에 머문 것으로 이름남
  endNote: 1017년 군대 반란으로 마문 2세가 죽자 가즈니 왕조의 마흐무드가 호라즘을 쳐 자기 땅으로 삼고 장군 알툰타시를 총독으로 둠
  mapNote: 지도에는 995년부터 1016년까지. 구르간지·히바 쪽 아무다리야 왼쪽 기슭의 호라즘 오아시스를 그리고, 오른쪽 기슭의 카트 둘레 강가 띠와 우스튜르트·키질쿰·카라쿰 사막은 비움. 경계는 근세 히바 칸국 땅에 기댄 어림
  features:
    - 도읍은 아무다리야 왼쪽 기슭의 구르간지(지금 쿠냐우르겐치)
    - 995년 아프리그 왕조를 무너뜨리고 호라즘 샤 칭호를 가져옴
    - 사만 왕조가 무너진 뒤 가즈니 왕조와 카라한 왕조 사이에서 버팀
    - 비루니·이븐 시나 같은 학자가 궁정에 머묾
  startEvents: [khwarazm-mamunid-995]
  endEvents: [khwarazm-mamunid-995]
  basis:
    type: primary_source
    refs: ["위키백과 Mamunids"]
    foundingNote: 시작 해는 마문 이븐 무함마드가 카트를 차지해 호라즘을 하나로 묶은 995년. 그 앞에도 구르간지의 아미르로 있었음

- id: western-karakhanid
  level: polity
  names: { ko: 서카라한 왕조, en: Western Karakhanid Khanate, native: قراخانیان غربی }
  from: 1041
  to: 1212
  color: "#c9b45e"
  summary: 카라한 왕조가 나뉜 서쪽 칸국. 1041년 무렵 왕실이 동서로 갈라진 뒤 사마르칸트를 도읍으로 트란스옥시아나를 다스렸고, 1089년부터 셀주크, 1141년 카트완 싸움 뒤로는 서요(카라 키타이)를 종주로 받듦
  endNote: 1212년 사마르칸트에서 반란을 일으킨 마지막 칸 오스만을 호라즘 샤 무함마드 2세가 죽이고 그 땅을 호라즘 제국에 합침
  mapNote: 지도에는 1041년부터 1209년까지. 부하라·사마르칸트·카슈카다리야와 페르가나 분지·샤시(타슈켄트)·후잔드·지작, 아무다리야 북쪽의 테르메즈·차가니얀·후탈을 그리고 북쪽 키질쿰 사막은 비움. 1210년부터는 사마르칸트를 차지한 호라즘 제국 땅으로 그림(1212년 끝까지의 두 해는 나누지 않음). 동카라한 쪽과의 경계는 시르다리야 북쪽 조각 경계에 기댄 어림
  features:
    - 도읍은 사마르칸트
    - 1089년 셀주크 술탄 말리크샤의 원정 뒤 셀주크를 종주로 받듦
    - 1141년 카트완 싸움 뒤 서요의 속국이 됨
    - 1212년 호라즘 제국에 합쳐져 끝남
  startEvents: [karakhanid-split-1041]
  endEvents: [kuchlug-otrar-1208]
  basis:
    type: primary_source
    refs: ["위키백과 Kara-Khanid Khanate"]
    foundingNote: 카라한 왕실이 동서 두 칸국으로 갈라진 1041년 무렵부터(사료마다 1040~1042년)

# ══ C3 E2 항목 ══
# 글: E2 칸(2026-11-06). 이름·색은 뼈대 값 그대로(표기 사전 — '카라한 왕조'·'서요')
- id: karakhanid-dynasty
  level: polity
  names: { ko: 카라한 왕조, en: Kara-Khanid Khanate, native: قراخانیان }
  from: 840
  to: 1041
  color: "#40bfa6"
  summary: 카를루크 등 튀르크 부족이 세미레치예의 발라사군과 카슈가르를 중심으로 세운 왕조. 처음으로 이슬람을 받아들인 튀르크 왕조로, 999년 사만 왕조를 무너뜨리고 트란스옥시아나까지 다스림
  endNote: 1041년 왕가가 동·서로 갈라져 발라사군·카슈가르 쪽은 동카라한 왕조, 사마르칸트·부하라 쪽은 서카라한 왕조가 됨
  features:
    - 840년 위구르 카간국이 무너지자 카를루크의 우두머리가 카간을 칭함
    - 사툭 부그라 칸이 이슬람으로 개종하고 934년 무렵 카슈가르를 차지함
    - 980년 이스피자브, 999년 부하라를 빼앗아 사만 왕조를 끝냄
    - 1006년 불교 왕국 호탄을 정복함
    - 튀르크어 문학 『쿠타드구 빌리그』가 이 왕조 아래에서 나옴
  mapNote: 지도에는 840년부터 1040년까지. 세미레치예·이리 골짜기·시르다리야 도시 띠와 934년부터 카슈가르, 980년부터 이스피자브·타라즈, 1006년부터 호탄을 넣음. 999년부터 1040년까지는 트란스옥시아나(부하라·사마르칸트·페르가나·샤시)와 아무다리야 북쪽(테르메즈·차가니얀)도 넣음. 카자흐 초원은 칠하지 않음
  startEvents: [karakhanid-rise-840]
  endEvents: [karakhanid-split-1041]
  basis:
    type: primary_source
    refs: ["위키백과 Kara-Khanid Khanate", "위키백과 Isfijab"]
    foundingNote: 카를루크의 우두머리가 카간 칭호를 쓴 840년을 시작으로 봄

- id: eastern-karakhanid
  level: polity
  names: { ko: 동카라한 왕조, en: Eastern Karakhanid Khanate, native: قراخانیان شرقی }
  from: 1041
  to: 1211
  color: "#4095bf"
  summary: 카라한 왕조가 1041년 동서로 갈라진 뒤 발라사군·카슈가르를 중심으로 세미레치예와 타림 분지 서쪽을 다스린 쪽
  endNote: 1211년 마지막 왕자가 카슈가르에서 죽임을 당하고, 서요를 빼앗은 나이만의 쿠출루크가 카슈가르·호탄을 차지함
  features:
    - 1096년 고창 위구르에게서 악수·쿠차를 빼앗음
    - 1134년 발라사군을 서요에 내주고 카슈가르로 중심을 옮김
    - 서요가 서쪽으로 넓어진 뒤에도 카슈가르·호탄을 지킴
  mapNote: 지도에는 1041년부터 1211년까지. 1133년까지는 세미레치예·이리 골짜기·시르다리야 도시 띠를 넣고, 1134년부터는 카슈가르·악수·호탄만 넣음. 서요에 대한 종속은 사료가 갈려 따로 표시하지 않음
  startEvents: [karakhanid-split-1041]
  endEvents: [kuchlug-otrar-1208]
  basis:
    type: primary_source
    refs: ["위키백과 Kara-Khanid Khanate"]
    foundingNote: 왕가가 동·서로 갈라진 1041년을 시작으로 봄

# 끝 해 1388은 창구 ③ 결정 Q-F(1389 히지르 호자의 투루판 정복 — 위키백과 Turpan). 1220부터 몽골 제국·원에 vassal_of(M13)
- id: qocho-uyghur-kingdom
  level: polity
  names: { ko: 고창 위구르 왕국, en: Kingdom of Qocho, native: قوچو ئۇيغۇر خانلىقى }
  from: 866
  to: 1388
  color: "#40bf40"
  summary: 위구르 카간국이 무너진 뒤 남쪽으로 옮긴 위구르인이 투루판 분지의 고창과 북정(비슈발리크)을 중심으로 세운 왕국. 왕은 이디쿠트라 불림
  endNote: 1389년 모굴리스탄의 히지르 호자가 투루판을 정복하고 주민을 이슬람으로 개종시키면서 끝났고, 하미 쪽은 칭기즈 칸 집안 왕족의 카라델로 이어짐
  features:
    - 866년 푸구 쥔이 고창을 차지하고 이디쿠트가 됨
    - 876년 하미(이주)를 얻고 톈산 남북의 오아시스를 다스림
    - 마니교와 불교가 함께 번성하고 위구르 문자로 많은 경전을 남김
    - 1096년 악수·쿠차를 카라한 왕조에 잃음
    - 1128년 서요, 1209년 몽골 제국에 스스로 복속함
  mapNote: 지도에는 866년부터 1388년까지. 투루판 분지·카라샤르·코를라와 우루무치 쪽 오아시스 띠(북정), 876년부터 하미, 1095년까지 악수·쿠차를 넣음. 1128년부터 서요, 1209년부터 몽골 제국, 1271년부터 1368년까지 원의 종속국으로 표시함
  startEvents: [qocho-uyghur-866]
  endEvents: [khizr-khoja-turfan-1389]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Qocho"]
    foundingNote: 푸구 쥔이 고창을 차지해 왕국이 자리 잡은 866년을 시작으로 봄(843년 위구르 난민이 카라샤르·쿠차를 차지한 때는 넣지 않음)

- id: khotan-kingdom
  level: polity
  names: { ko: 호탄 왕국, en: Kingdom of Khotan, native: Hvatana }
  from: -223 # C4 뼈대(2026-11-07)가 851에서 바꿈 — C4 Q9 우전(기원전 224, 맞춤 M22). 지도 −175~647·851~1005, mapNote·foundingNote는 C4 E 칸
  to: 1006
  color: "#8b4b76"
  summary: 타림 분지 남쪽 호탄 오아시스의 불교 왕국. 기원전부터 실크로드 남도의 길목을 지켰고, 당과 토번의 지배를 거쳐 851년 다시 선 뒤 1006년 카라한 왕조에 정복됨
  endNote: 1006년 카라한 왕조의 유수프 카디르 칸이 오랜 싸움 끝에 호탄을 정복함
  features:
    - 61년 이웃 사차를 아울렀다가 86년 무렵 다시 잃음
    - 851년 토번이 물러난 뒤 다시 홀로 섬
    - 둔황의 귀의군과 혼인으로 이어지고 중국 왕조와 사신을 주고받음
    - 불교를 지키며 이슬람으로 개종한 카라한 왕조와 오래 싸움
  mapNote: 지도에는 기원전 176년부터 647년까지와 851년부터 1005년까지. 앞 시기는 호탄·케리야·니야의 오아시스 띠(61년부터 85년까지 사차를 더함), 뒤 시기는 호탄 오아시스와 곤륜산 북쪽 기슭, 타클라마칸 남쪽 절반을 함께 넣은 어림. 648년부터 850년까지는 당과 토번의 땅
  startEvents: [tibet-tarim-790]
  endEvents: [karakhanid-bukhara-999]
  basis:
    type: primary_source
    refs: ["위키백과 Kingdom of Khotan"]
    foundingNote: 쿠스타나가 호탄에 나라를 세웠다는 전설의 기원전 224년을 시작으로 봄(첫 기록은 기원전 176년 무렵으로 지도는 그해부터). 당과 토번의 지배를 거쳐 851년 다시 섬

- id: qara-khitai
  level: polity
  names: { ko: 서요, en: Qara Khitai, native: قراختاییان }
  from: 1124
  to: 1218
  color: "#bf4040"
  summary: 요가 망한 뒤 거란의 야율대석이 서쪽으로 옮겨 세운 나라(카라 키타이). 발라사군을 도읍으로 삼고 1141년 카트완 싸움에서 셀주크를 이겨 중앙아시아를 아울렀음
  endNote: 1211년 나이만의 쿠출루크가 왕위를 빼앗았고, 1218년 몽골 제국의 제베가 쿠출루크를 죽이면서 끝남
  features:
    - 1124년 야율대석이 요를 떠나 서쪽으로 옮김
    - 1132년 구르칸에 오르고 1134년 발라사군을 도읍으로 삼음
    - 1141년 카트완 싸움에서 셀주크의 산자르를 크게 이김
    - 서카라한 왕조·호라즘·고창 위구르를 종속국으로 거느림
    - 1211년 쿠출루크가 빼앗은 뒤 이슬람 신자를 박해해 민심을 잃음
  mapNote: 지도에는 1134년부터 1217년까지. 세미레치예·이리 골짜기·시르다리야 도시 띠(1209년까지 — 1210년부터 호라즘)를 넣고, 1212년부터 카슈가르·악수·호탄을 넣음. 서카라한 왕조·호라즘·고창 위구르는 종속국이라 따로 칠함
  startEvents: [qara-khitai-1124]
  endEvents: [kuchlug-otrar-1208]
  basis:
    type: primary_source
    refs: ["위키백과 Qara Khitai", "위키백과 Kuchlug"]
    foundingNote: 야율대석이 구르칸에 오른 1132년 앞의 1124년 이동을 시작으로 봄. 지도는 발라사군을 얻은 1134년부터
