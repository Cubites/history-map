    - 1908년 11월 15일 벨기에 식민지, 1910년 라도 구역을 수단에 넘김
    - 국가·선교회·회사가 함께 다스림
    - 카탕가의 구리 광산
    - 1960년 6월 30일 독립
  startEvents: [belgian-congo-1908]
  endEvents: [congo-crisis-1960]
  basis:
    type: primary_source
    refs: ["위키백과 벨기에령 콩고", "위키백과 Belgian Congo", "위키백과 Congo belge"]
