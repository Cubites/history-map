  summary: 나일강 가운데 유역을 영국과 이집트가 함께 다스린 땅. 1896~1898년 영국-이집트군이 마흐디 국가에게서 수단을 되찾은 뒤, 1899년 1월 협정으로 영국이 추천한 총독을 이집트가 임명하는 공동 통치가 섰으나, 실제로는 하르툼의 영국 관리들이 다스림. 1910년 벨기에령 콩고에서 라도 구역을 넘겨받고 1914년 서나일을 우간다에 넘겼으며, 1916년 다르푸르 술탄국을 정복해 이듬해 합침. 1924년 총독이 카이로에서 암살되자 영국이 이집트군을 수단에서 내보냈고, 1940년 이탈리아군이 카살라와 갈라바트를 잠시 차지했다가 이듬해 물러남. 1946년 남부를 따로 다스리던 정책을 거두고 남북 행정을 합치기 시작했고, 1953년 2월 12일 영국·이집트 협정으로 자치를 얻어 1954년 1월 이스마일 알아즈하리의 수단인 정부가 섬. 1955년 8월 토리트 반란으로 남부의 저항이 커졌고, 같은 해 12월 19일 의회가 만장일치로 독립을 선언함
  mapNote: 지도에는 1899년부터 1955년까지 표시함. 1899~1915년에는 다르푸르 술탄국을 뺀 지금 수단과 남수단 땅으로 그렸고, 1910년부터 벨기에령 콩고에서 넘겨받은 라도 구역과 1913년까지 우간다에 넘기기 전의 서나일 땅을 더했으며, 1916년부터는 정복한 다르푸르를 더해 지금 수단과 남수단 땅으로 그림. 1899년 마흐디 국가의 칼리프가 코르도판에서 끝까지 버틴 동안도 공동 통치 땅으로 그림. 1896~1898년 영국-이집트군이 먼저 되찾아 군정을 편 땅은 공동 통치 전이라 따로 칠하지 않고 비움. 1934년 이탈리아령 리비아에 넘긴 사라 삼각지대는 실제로 다스린 적이 없어 이 색으로 그리지 않았고, 1940년 이탈리아군이 잠시 차지한 카살라와 갈라바트는 이듬해 되찾아 따로 칠하지 않음. 영국과 이집트가 함께 다스려 어느 한 나라에 딸린 땅으로 나타내지 않음
  endNote: 1956년 1월 1일 수단 공화국으로 독립하며 끝남
  features:
    - 수도는 하르툼
    - 1899년 1월 영국·이집트 공동 통치 협정
    - 1916년 다르푸르 술탄국을 정복해 이듬해 합침
    - 청나일과 백나일 사이 땅에 관개 목화 농장을 일으킴
    - 1953년 2월 영국·이집트 협정으로 자치, 1955년 12월 19일 의회가 독립 선언
  startEvents: [omdurman-fashoda-1896]
  endEvents: [sudan-independence-1953]
