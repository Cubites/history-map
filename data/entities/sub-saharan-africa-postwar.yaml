# 위키 ko 프랑스령 마다가스카르('1897년부터 1958년까지')·en French Madagascar('between 1897 and 1958')·fr Colonie de Madagascar et dépendances('de 1897 à 1946, avant de devenir un territoire d'outre-mer') — 뼈대 from 1896 → 1897, 1947 봉기(위키 en Malagasy Uprising 1947-03-29~1949-02 — 따로 칠하지 않음, 기본값 11)·1958-10-14 말라가시 공화국은 글, 독립 1960-06-26. 1945~1959 MDG 22(코모로 COM은 french-comoros), vassal_of france 1897~1959(이음 1960 madagascar)
- id: french-madagascar
  level: polity
  names: { ko: 프랑스령 마다가스카르, en: French Madagascar, native: Colonie de Madagascar et dépendances }
  from: 1897
  to: 1960
  color: "#bcc945"
  summary: 인도양 서쪽 큰 섬 마다가스카르를 다스린 프랑스 식민지. 1895년 프랑스군이 메리나 왕국을 눌러 섬을 장악했고, 1897년 여왕 라나발로나 3세를 폐위하고 식민지로 삼아 코모로 제도 등을 딸린 땅으로 둠. 1896년 총독으로 온 조제프 갈리에니가 1905년 무렵까지 고원의 봉기와 남서부 사칼라바족 등의 저항을 무력으로 눌렀음. 1940년부터 비시 정부를 따르다가 1942년 5월 5일 영국군이 상륙해 11월 6일 섬 전체를 장악했고, 12월 자유 프랑스가 다스림을 넘겨받음. 1946년 프랑스 연합의 해외 영토가 되었고, 1947년 3월 29일 동부에서 일어난 민족주의 봉기가 1949년 2월까지 이어졌으나 프랑스군이 많은 주민을 죽이며 눌렀음. 1958년 10월 14일 프랑스 공동체 안의 말라가시 공화국이 됨
  mapNote: 지도에는 1897년부터 1959년까지 지금 마다가스카르 땅으로 표시하고, 1959년까지 프랑스의 지배를 관계로 보임. 1905년 무렵까지 프랑스 지배가 이름뿐이던 남서부와 1942년 영국군이 차지한 동안과 1947~1949년 봉기군이 차지한 땅도 따로 칠하지 않고 프랑스령 마다가스카르 색으로 그림. 1912~1946년 이 식민지에 딸렸던 코모로 세 섬은 따로 프랑스령 코모로 색으로 둠
  endNote: 1960년 6월 26일 말라가시 공화국으로 독립하며 끝남
  features:
    - 수도는 타나나리브(지금 안타나나리보)
    - 1897년 여왕 폐위와 식민지 행정
    - 1942년 5~11월 마다가스카르 전투, 자유 프랑스에 넘김
    - 1947~1949년 민족주의 봉기
    - 1958년 10월 14일 말라가시 공화국
  startEvents: [madagascar-1895]
  endEvents: [madagascar-independence-1947]
  basis:
