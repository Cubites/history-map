  to: 1958
  color: "#347fb2"
  summary: 푸타잘롱 고원과 대서양 기슭을 아우른 프랑스 식민지. 1882년 세네갈에 딸린 남쪽 해안 거점들이 리비에르뒤쉬드로 묶였고, 1891년 따로 식민지가 되어 1894년 프랑스령 기니라는 이름을 얻었으며, 1895년 프랑스령 서아프리카에 듦. 1896년 푸타잘롱 이맘국을 보호령으로 삼았고, 1899년 10월 프랑스령 수단이 맡던 칸칸 쪽 동쪽 고지를 넘겨받음. 1910년대 들어 야생 고무 수출이 무너졌고, 1920~1930년대 해안 쪽에 바나나 농장이 늘어남. 1946년 프랑스 연합의 해외 영토가 되었고, 아메드 세쿠 투레가 이끈 정당 아래 1958년 9월 28일 국민 투표에서 주민들이 프랑스 공동체 가입을 거부함
