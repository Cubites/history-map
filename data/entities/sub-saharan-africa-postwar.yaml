# 위키 ko 표제 — 1891 성립(위키 en French Guinea — 1894 프랑스령 기니 이름·1895 프랑스령 서아프리카), 1958-09-28 프랑스 공동체 국민 투표 반대·1958-10-02 독립. 1910~1957 GIN 34(1910~1944 F4), vassal_of france 1891~1957(이음 1958 guinea)
