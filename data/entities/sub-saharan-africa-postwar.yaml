# sub-saharan-africa postwar 나라 (시대 파일 scripts/geo/areas/sub-saharan-africa/postwar.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 1945~1959: 2차 대전 뒤부터 아프리카의 해 앞까지 (F3, docs/sub-saharan-africa/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'sub-saharan-africa-postwar' → 필터 단위 sub-saharan-africa).
# F3 뼈대(2026-11-12)가 새 식민지·신탁 통치·군정 항목 24개의 id·이름·level·from·to·색을 정해 칸 머리 아래 자리 블록으로 두었다(지시문 f3/COMMON.md 4절 표, 표 원천 f3/skel/entities.tsv).
#   색은 본국 색이 아니라 자기 색 — 뼈대가 같은 해 맞닿는 이웃·같은 땅 앞뒤 나라와 ΔE 40 넘게 골랐다(f3/skel/tools/df3.mjs, COMMON P4). 본국은 data/relations.yaml의 vassal_of·occupied_by(칸 머리 아래).
#   군정 항목 둘(에리트레아 (영국 군정)·이탈리아령 소말리아 (영국 군정))은 서아시아 리비아 (영국 군정) 꼴 — level: region·from 군정 시작 해 1941(칠하는 해는 1945부터).
#   이름은 위키백과 한국어판 표제로 확인했다(f3/skel/ko-titles*.txt·en-ko.txt — 표제가 없는 프랑스령 세네갈·프랑스령 모리타니·프랑스령 코트디부아르·프랑스령 니제르·프랑스령 차드·
#   프랑스령 가봉·프랑스령 중앙콩고는 프랑스령 기니·프랑스령 수단 꼴, 군정 둘은 리비아 (영국 군정) 꼴, 소말리아 신탁 통치령은 저장소 기존 띄어쓰기).
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis·native 확인도 그 칸이 — f3/COMMON.md 5절 탭 칸, startEvents·endEvents는 사건 1묶음 몫이라 빈 목록 그대로).
#   from·to는 뼈대 어림이라 칸이 사료로 확인해 고칠 수 있다(고치면 결과 노트 2절에 한 줄). id·색·이름은 고치지 않는다.
#   앞 잇는 항목 34는 이 파일에 없다 — F2 항목 22는 data/entities/sub-saharan-africa-decolonization.yaml, F1 항목 12는 sub-saharan-africa-modern.yaml 그 자리 블록을 칸이 고친다(파일 소유표 — COMMON 5절).
#   서아시아 mauritania 블록(middle-east-modern.yaml)은 고치지 않는다(1945~1959 모리타니는 새 항목 french-mauritania — 기본값 8).

