  summary: 사하라 서쪽 끝 대서양 기슭의 프랑스 식민지. 1904년 프랑스가 세네갈강 북쪽 무어인 땅을 세네갈에서 떼어 민정 영토로 삼았고(1902~1903년 트라르자·브라크나 토후국 보호), 1905년 타간트에서 지휘관 코폴라니가 피살된 뒤 1909년 아드라르를 정복함. 1920년 12월 4일 프랑스령 서아프리카의 식민지가 되었으나 오랫동안 세네갈 땅인 생루이에서 다스려짐. 1912~1934년 북쪽 사막 유목민의 습격과 프랑스 보안군의 진압이 이어짐. 1946년 프랑스 연합의 해외 영토가 되었고, 1957년 첫 정부가 누악쇼트를 새 수도로 골랐으며 1958년 11월 28일 모리타니 이슬람 공화국이 됨
  mapNote: 지도에는 1904년부터 1959년까지 표시함. 1908년까지는 세네갈강 쪽 남부만, 1909년 아드라르를 정복한 뒤로는 지금 모리타니 땅을 그림. 1959년까지 프랑스의 식민지였음은 프랑스와의 관계로 나타냄
  endNote: 1960년 11월 28일 모리타니 이슬람 공화국이 프랑스에서 독립하며 끝남
  features:
