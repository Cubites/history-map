# 위키 ko 표제 없음(넘겨주기 → 세네갈의 역사) — 프랑스령 기니·프랑스령 수단 꼴. 1659 생루이 상관(위키 fr Colonie du Sénégal — 1626 강어귀 상관·1895 프랑스령 서아프리카 구성 식민지는 결과 노트 2절), 1946 해외 영토·1958-11-25 자치 공화국·1959-04-04 말리 연방은 글, 1960-06-20 말리 연방 독립·08-20 이탈. 1910~1959 SEN 14(1910~1944 F4), vassal_of france 1659~1959(이음 1960 senegal)
- id: french-senegal
  level: polity
  names: { ko: 프랑스령 세네갈, en: French Senegal, native: Sénégal }
  from: 1659
  to: 1960
  color: "#45c9c9"
  summary: 대서양 기슭 세네갈강 하류와 다카르 일대의 프랑스 식민지. 1659년 세네갈강 어귀의 섬에 생루이 상관이 서며 시작되었고, 1854년 말 총독이 된 루이 페데르브가 1855년 세네갈강 하류의 와알로 왕국을 정복하고 1857년 다카르를 세우며 내륙으로 넓혔으며, 1886년 카요르의 다멜 라트 디오르가 프랑스군과 싸우다 죽은 뒤 내륙 왕국들을 차례로 병합했고, 1895년 프랑스령 서아프리카의 한 식민지가 되었으며 1902년부터 다카르가 그 연방의 수도였음. 1914년 블레즈 디아뉴가 아프리카 흑인으로는 처음 프랑스 하원 의원에 뽑힘. 1940년 9월 비시 프랑스 쪽 총독부가 다카르 앞바다에서 영국·자유 프랑스군의 상륙 시도를 물리쳤고, 프랑스령 서아프리카는 1942년 말에야 연합국 편으로 돌아섬. 1946년 프랑스 연합의 해외 영토가 되었고 1958년 11월 25일 프랑스 공동체 안 자치 공화국이 되었으며, 1959년 4월 4일 이 공화국이 프랑스령 수단과 함께 말리 연방을 이룸
  mapNote: 지도에는 1855년부터 1959년까지 표시함. 1884년까지는 세네갈강 하류의 와알로와 다카르 둘레(지금 생루이·다카르 지방)만, 1885년부터 지금 세네갈 땅을 그림. 그 앞 생루이·고레의 작은 거점들은 따로 그리지 않음. 1940~1942년 비시 프랑스를 따른 동안도 같은 색으로 그림. 1959년 4월부터 프랑스령 수단과 이룬 말리 연방은 따로 칠하지 않고 세네갈 색으로 그림. 1959년까지 프랑스의 식민지였음은 프랑스와의 관계로 나타냄
  endNote: 1960년 6월 20일 말리 연방으로 독립한 뒤 8월 20일 세네갈이 연방에서 떨어져 나와 세네갈 공화국이 되며 끝남
  features:
    - 1659년 세네갈강 어귀에 생루이 상관, 1855년 와알로 정복
    - 1902년부터 프랑스령 서아프리카의 수도 다카르
    - 1914년 블레즈 디아뉴가 아프리카 흑인 첫 프랑스 하원 의원
    - 1940년 9월 영국·자유 프랑스군의 다카르 상륙 시도를 물리침
    - 1959년 4월 4일 프랑스령 수단과 말리 연방
  startEvents: [saint-louis-1659]
  endEvents: [mali-federation-1959]
  basis:
    type: primary_source
    refs: ["위키백과 Colonie du Sénégal", "위키백과 French West Africa"]
    foundingNote: 세네갈강 어귀의 섬에 생루이 상관이 선 1659년부터

# 위키 ko 표제 — 1890 프랑스령 수단 이름(위키 en French Sudan — 1899~1920 상세네갈·니제르 등 다른 이름, 1921 다시 프랑스령 수단), 1958-11-24 수단 공화국·1959-04-04 말리 연방은 글, 1960-09-22 말리 공화국. 1910~1959 MLI 9(1910~1944 F4) — BFA 몫(1910~1918 전부·1932~1946 와이구야 쪽)은 F4·F3 GW 칸 own 줄, vassal_of france 1890~1959(이음 1960 mali)
- id: french-sudan
  level: polity
  names: { ko: 프랑스령 수단, en: French Sudan, native: Soudan français }
  from: 1880
  to: 1960
  color: "#6dc945"
  summary: 니제르강 가운데 유역을 차지한 프랑스 식민지. 1880년 세네갈강 상류에 상류 강(오세네갈) 군사 구역을 두고 동쪽으로 정복해 들어간 땅이 1890년 8월 18일 프랑스령 수단이라는 이름을 얻었고, 1891년 사모리 투레에게서 칸칸 쪽 고지, 1893년 투쿨로르 제국, 1894년 팀북투, 1898년 케네두구 왕국의 시카소를 차지함. 1899년 10월 칸칸 쪽 고지를 비롯한 일부 땅이 이웃 식민지로 나뉘었고 1902년 세네감비아-니제르로 묶였다가, 1904~1920년에는 오트세네갈-니제르라고 불리다가 1921년 다시 프랑스령 수단이 됨. 1919년 남동쪽 땅이 오트볼타로 떨어져 나갔고, 1932~1947년에는 오트볼타가 나뉘면서 그 북서쪽 와이구야 일대를 이 식민지가 맡음. 2차 대전 뒤 모디보 케이타가 이끈 정당이 독립 운동의 중심이 되었고, 1958년 11월 24일 수단 공화국이 된 이 땅은 1959년 4월 4일 세네갈과 함께 말리 연방을 이룸
  mapNote: 지도에는 1891년부터 1959년까지 표시함. 1891~1898년에는 지금 기니 동쪽의 칸칸 쪽 고지를 함께 그리고, 1893년 세구·바마코·카예 쪽, 1894년 팀북투, 1898년 시카소, 1900년 가오, 1908년 키달이 더해져 지금 말리 땅이 되며, 1900~1918년에는 지금 부르키나파소 땅을, 1932~1946년에는 그 북서쪽 와이구야 일대를 함께 그림. 1910년 6월부터 한 해 동안 동쪽 가오 일대가 니제르 군사 영토에 딸렸던 일은 따로 칠하지 않고 이 색으로 그림. 1959년 4월부터 세네갈과 이룬 말리 연방은 따로 칠하지 않고 이 색으로 그림. 1892년까지 카예 둘레에 줄지어 선 프랑스 요새들은 따로 칠하지 않고 투쿨로르 제국 색으로 그림. 1959년까지 프랑스의 식민지였음은 프랑스와의 관계로 나타냄
  endNote: 1960년 6월 20일 말리 연방으로 독립하고 8월 20일 세네갈이 떨어져 나간 뒤 9월 22일 말리 공화국이 되며 끝남
  features:
    - 중심은 바마코
    - 1880년 상류 강(오세네갈), 1890년 프랑스령 수단, 1904~1920년 오트세네갈-니제르
    - 1919년 오트볼타가 떨어져 나감
    - 1932~1947년 오트볼타의 북서쪽 와이구야 일대를 맡음
    - 1959년 4월 4일 세네갈과 말리 연방
  startEvents: [umar-tal-1852]
  endEvents: [mali-federation-1959]
  basis:
    type: primary_source
    refs: ["위키백과 French Sudan", "위키백과 French West Africa"]
    foundingNote: 세네갈강 상류에 상류 강(오세네갈) 군사 구역을 둔 1880년부터(프랑스령 수단이라는 이름은 1890년 8월 18일)

# 위키 ko 표제 없음 — 프랑스령 기니 꼴. 1904 세네갈에서 떨어진 민정 영토(위키 en Colonial Mauritania — 1920-12-04 식민지로 프랑스령 서아프리카에 듦, 행정은 세네갈 생루이, 1957-05 첫 정부가 누악쇼트를 수도로), 1958-11-28 이슬람 공화국은 글, 1960-11-28 독립. 1910~1959 MRT 13(1910~1944 F4), vassal_of france 1904~1959(이음 1960 서아시아 mauritania — 기본값 8)
