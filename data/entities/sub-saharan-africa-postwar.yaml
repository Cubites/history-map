#   사하라 이남 F5(E-5): 1908~1909 COD 11 + 라도 SS-EC(H-5 줄)·서나일 8구(E-5 줄 — M-F5-8), successor_of congo-free-state 1908
- id: belgian-congo
  level: polity
  names: { ko: 벨기에령 콩고, en: Belgian Congo, native: Congo belge / Belgisch-Congo }
  from: 1908
  to: 1960
  color: "#45c9bc"
  summary: 콩고강 유역 적도 숲과 카탕가 광산 지대를 아우른 벨기에 식민지. 벨기에 왕이 개인 땅으로 다스린 콩고에서 주민을 짓밟은 착취가 알려져 국제 압력이 커지자, 1908년 11월 15일 벨기에 나라가 이 땅을 넘겨받아 식민지로 삼음. 1910년 북동쪽 나일강 기슭의 라도 구역을 영국-이집트령 수단에 넘겼고, 제1차 세계 대전 때 콩고 군대가 독일령 동아프리카의 르완다·부룬디와 타보라를 차지함. 국가·가톨릭 선교회·회사가 함께 다스렸고, 1940~1950년대에는 도시가 빠르게 커지며 유럽식 교육을 받은 아프리카인 중간층이 생겼으며 임금 노동자가 다른 어느 아프리카 식민지보다 많았음. 1950년대 말 독립 운동이 거세짐
  mapNote: 지도에는 1908년부터 1959년까지 지금 콩고 민주 공화국 땅으로 표시하고, 1959년까지 벨기에의 지배를 관계로 보임. 1908~1909년에는 콩고 자유국에게서 이어받은 라도 구역(지금 남수단 남서쪽과 우간다 서나일)도 함께 그리고, 1910년 6월 수단에 넘긴 이 땅은 그때부터 이 색에 들지 않음
  endNote: 1960년 6월 30일 파트리스 루뭄바를 총리, 조제프 카사부부를 대통령으로 하여 콩고 공화국으로 독립하며 끝남
  features:
