# 기본값 3 — vassal_of uk(1888 주재관~), 말레이 연합주. from 1881은 완 아마드가 술탄을 칭한 해(옛 파항 술탄국 1470~1623과 이을지는 E3 판단)
- id: pahang-sultanate
  level: polity
  names: { ko: 파항 술탄국, en: Pahang Sultanate, native: Kesultanan Pahang }
