# 기본값 26 — 시암→타이 1939(같은 항목·같은 색), from 1767(E2 SC — 기본값 D6: 톤부리 1767~1781·라따나꼬신 1782~ 같은 항목, 1767~1899는 colonial.mjs). CL 칸이 라오스·캄보디아 조각에 1904·1907 앞·1941~1945를, 글은 W
- id: thailand
  level: polity
  names: { ko: 타이, en: Thailand, native: ประเทศไทย }
  from: 1767
  to: null
  color: "#4b9b8b"
  summary: 1767년 딱신이 톤부리에서 다시 세우고 1782년 라마 1세가 방콕에 도읍한 짜끄리 왕조의 나라로, 1939년까지 이름은 시암. 버마에 무너진 아유타야를 이어 1770년 갈라선 지방 정권들을 다시 묶었고, 라오의 왕국들·란나·캄보디아·말레이 술탄국들을 속국으로 거느림. 쭐랄롱꼰(라마 5세) 때 근대 개혁을 하며 프랑스·영국에 변경 땅을 넘기고 독립을 지킴. 1932년 쁘라짜티뽁(라마 7세) 때 입헌 혁명으로 절대 왕정이 끝났고, 1939년 나라 이름을 타이로 바꿈. 2차 대전 때 일본의 동맹국이 되었다가 전쟁 뒤 연합국과 화해함
  mapNote: 지도에는 1767년부터 표시함. 1767~1769년에는 딱신이 쥔 짜오프라야강 하류·동부 해안과 서부만 칠하고, 피사눌록·팡·나콘시탐마랏 등 갈라선 지방 정권의 땅과 피마이 정권이 쥔 코랏 고원 서남(나콘랏차시마·부리람·수린·시사껫·차이야품·콘깬)은 1770년 다시 묶을 때까지 비움. 1792년 우본이 방콕 직속 무앙이 된 뒤 문강 아래쪽(우본·야소톤·로이엣 등)을, 1794년부터 캄보디아 서북(바탐방·시엠레아프·시소폰)과 코콩을, 1814년부터 프레아비히어 북부 믈루프레이를 넣고, 1828년 아누웡의 반란을 꺾고 비엔티안 왕국을 없앤 뒤 메콩강 양쪽 기슭(비엔티안 평야·캄무안·시앙쿠앙·후아판 포함)을 넣으며, 1893년 프랑스–시암 조약으로 메콩강 왼쪽 기슭을 프랑스에 넘김(오른쪽 기슭의 사야부리와 참파삭 쪽 바싹·톤레레포는 1904년 파리 조약 때까지 시암 땅으로 두고, 오른쪽 기슭 25 km 비무장 띠는 그리지 않음). 속국이던 란나 왕국·파타니 술탄국·라오의 왕국들은 따로 그리고, 1899년 몬톤 파얍으로 편입한 란나와 1902년 직할로 삼은 파타니는 1900년부터 넣음. 1900~1903년에는 사야부리·참파삭의 메콩강 오른쪽 기슭과 믈루프레이·톤레레포·코콩(약 4.8만 km²), 1900~1906년에는 바탐방·시엠레아프·시소폰·오다르민체이(약 3.75만 km²)도 넣고, 1904년 파리 조약과 1907년 방콕 조약으로 프랑스에 넘김. 시암에 조공하던 말레이 네 주(크다·프를리스·클란탄·트렝가누 — 1909년 영국 종주로 넘어감)는 따로 그림. 1941~1945년에는 프랑스–타이 전쟁 뒤 도쿄 평화 조약으로 받은 캄보디아 서북부(시엠레아프 읍·앙코르 유적 제외)와 라오스 두 곳(사야부리·참파삭 오른쪽 기슭) 약 6.7만 km²를 넣고(1946년 프랑스에 돌려줌), 1943년 일본이 넘긴 샨 두 주와 말레이 네 주는 넣지 않음. 1904~1907년 프랑스가 쥔 뜨랏(1만 km² 미만)은 타이 땅 그대로 두고, 루앙프라방 맞은편 메콩강 오른쪽 기슭(약 2,500 km²)은 라오스 색으로 칠한 어림
  features:
    - 도읍은 톤부리(1767~1782), 1782년부터 방콕
    - 1767년 딱신의 톤부리 왕국, 1782년 라마 1세의 짜끄리 왕조(라따나꼬신 왕국)
    - 쭐랄롱꼰(재위 1868~1910)의 근대 개혁 속에 1893~1909년 조약들로 변경 땅과 말레이 네 주 종주권을 넘김
    - 1932년 입헌 혁명, 1939년 시암에서 타이로 국호를 바꿈
    - 1941년 일본과 동맹, 도쿄 조약으로 얻은 캄보디아 서북부·라오스 두 곳을 1946년 돌려줌
  startEvents: [thonburi-1767]
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Thonburi Kingdom", "위키백과 Rattanakosin Kingdom", "방콕 조약(1909)", "도쿄 평화 조약(1941)"]
    foundingNote: 딱신이 톤부리 왕국을 세운 1767년부터(1782년 라마 1세가 방콕으로 도읍을 옮겨 라따나꼬신 왕국)


