# 기본값 6 — 1만 km² 미만이나 식민지라 따로 항목(본국 영국은 넓히지 않음 — 메인 확인 거리 M5), vassal_of uk, 라부안 1907~1945(SB 칸이 칠함)
- id: straits-settlements
  level: polity
  names: { ko: 해협 식민지, en: Straits Settlements, native: Negeri-Negeri Selat }
  from: 1786
  to: 1946
  color: "#c9af45"
  summary: 페낭·말라카·싱가포르를 묶은 영국의 식민지. 1786년 영국 동인도 회사가 크다 술탄에게서 페낭을 얻었고, 1819년 싱가포르, 1824년 영국·네덜란드 조약으로 말라카를 더해 1826년 세 곳을 한 행정 단위로 묶음. 1867년 영국 정부가 직접 다스리는 직할 식민지가 됨. 1832년부터 싱가포르가 중심지였고, 해협 식민지 총독이 말레이반도의 영국 보호국들을 맡는 고등 판무관을 겸함
  endNote: 1942년 2월 싱가포르가 일본군에 함락되어 1945년까지 점령되었고, 1946년 4월 1일 해체되어 페낭·말라카는 말라야 연합에, 싱가포르는 따로 직할 식민지가 됨
  mapNote: 지도에는 1786년부터 1945년까지 영국이 차지한 해협의 땅으로 표시함. 페낭(웰즐리 주 포함)은 1786년, 싱가포르는 1819년, 말라카는 넘겨받은 1825년부터 넣고, 세 곳을 묶어 해협 식민지라 부르기 시작한 1826년 앞도 같은 색으로 그림. 1907년부터 1945년까지 보르네오 앞바다의 라부안섬(약 92 km²)도 이 색으로 그림. 1874~1934년 해협 식민지였던 페락 해안의 딘딩은 1만 km²가 안 되어 페락 술탄국 색으로 그림. 1942~1945년 일본 점령은 영토를 바꾸지 않고 점령 관계로만 나타냄
  features:
    - 1786년 페낭, 1819년 싱가포르, 1824년 말라카를 영국이 차지함
    - 1826년 세 곳을 묶어 동인도 회사의 한 행정 단위가 됨
    - 1867년 인도 정부에서 떨어져 런던 식민부가 다스리는 직할 식민지가 됨
    - 1907년 라부안을 더하고 1946년 해체됨
  startEvents: [penang-1786]
  endEvents: [malayan-union-1946]
  basis:
    type: primary_source
    refs: ["위키백과 Straits Settlements", "위키백과 Federated Malay States"]
    foundingNote: 영국 동인도 회사가 페낭을 얻은 1786년부터(세 곳을 한 행정 단위로 묶은 것은 1826년, 직할 식민지는 1867년)

# 기본값 3 — vassal_of uk(1874 팡코르 조약~), 말레이 연합주 1895~1946, 1946부터 땅은 malaysia
