  summary: 프놈펜을 도읍으로 한 크메르인의 왕국으로, 1431년 앙코르를 떠난 뒤 시암과 베트남 사이에서 두 나라에 조공하다가 1863년 프랑스 보호령이 되어 1953년 독립함. 1970~1993년 크메르 공화국·민주 캄푸치아·캄푸치아 인민 공화국을 거쳐 왕국으로 돌아옴
  mapNote: 지도에는 1767년부터 표시함. 1767~1793년에는 바탐방·시엠레아프·시소폰과 코콩까지 칠하고 1794년 앙 엥 왕이 즉위할 때 이 땅을 시암 직할로 내줌. 1835~1840년 베트남 응우옌 왕조가 트란떠이 성으로 병합해 관리를 둔 시기도 캄보디아 색으로 칠하고 점령으로만 나타냄(1841년 베트남군이 물러나고 1848년 앙두옹 왕 아래 시암·베트남 두 나라에 조공함). 1863년 8월 11일 노로돔 왕이 프랑스의 보호를 받아들임. 1814년에는 시암이 가져간 프레아비히어 북부 믈루프레이를 뺌. 1900~1903년에는 톤레사프 호수 동남쪽의 보호령 본토를 칠하고, 1904년 파리 조약으로 코콩·믈루프레이(프레아비히어 북부)·톤레레포(스퉁트렝의 메콩강 서쪽)를 시암에게서 받으면서 스퉁트렝 동쪽·라타나키리를 라오스에서 넘겨받았으며, 1907년 방콕 조약으로 바탐방·시엠레아프·시소폰을 더함. 1941~1945년에는 도쿄 조약으로 바탐방·파일린·반테아이민체이·오다르민체이와 시엠레아프 서북부·프레아비히어 북부·스퉁트렝 메콩강 서쪽을 타이에 내줬다가(시엠레아프 읍과 앙코르 유적은 프랑스 쪽에 남음) 1946년 되찾음. 보호령 시기 왕은 명목상 군주였고 실권은 프랑스 관리가 쥠. 1945년 3~8월 일본 점령과 1979~1989년 베트남군 주둔은 점령으로만 표시함. 1955~1975년 남베트남과 겹치는 동쪽 국경 가장자리(약 6천 km²)는 남베트남 색. 1941년 도쿄 조약선·1904년 믈루프레이 경계·메콩강 선은 손으로 그은 어림
  features:
    - 1431년 앙코르를 떠나 롱벡·우동을 거쳐 1866년 프놈펜에 도읍
    - 1794년 바탐방·시엠레아프를 시암에 내주고, 1835~1840년 베트남에 병합됨
    - 1863년 노로돔 왕이 프랑스 보호를 받아들이고, 1907년 방콕 조약으로 서북을 되찾음
    - 1953년 11월 9일 노로돔 시아누크 왕 아래 완전 독립
    - 1970년 크메르 공화국·1975년 민주 캄푸치아·1979년 캄푸치아 인민 공화국, 1993년 왕국으로
