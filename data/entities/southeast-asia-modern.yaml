# 결정 5·6, 기본값 7·8 — vassal_of netherlands 1900~1948, 서뉴기니 주장 전체(141도선), 아체 1904부터, 일본 점령 occupied_by japan 1942~1945
- id: dutch-east-indies
  level: polity
  names: { ko: 네덜란드령 동인도, en: Dutch East Indies, native: Nederlands-Indië }
  from: 1800
  to: 1949
  color: "#a63f84"
  summary: 1800년 1월 1일 네덜란드 동인도 회사(VOC)가 해산되며 그 영토를 네덜란드 국가가 넘겨받아 이룬 식민지. 바타비아의 총독이 자와를 직접 다스리고, 바깥섬에는 계약을 맺은 자치 토후국을 두었음. 1830년부터 강제 재배 제도로 자와 농민에게 수출 작물을 기르게 했고, 1901년 윤리 정책으로 교육·관개·이주를 넓힘. 아체 전쟁과 발리·술라웨시 원정으로 20세기 초 군도 전체를 손에 넣었으나, 1942년 3월 9일 네덜란드군이 항복해 1945년까지 일본이 점령함. 1945년 8월 17일 인도네시아가 독립을 선포한 뒤 4년 동안 독립 전쟁이 이어짐
  mapNote: 지도에는 1800년부터 1948년까지 표시함. 1800~1899년에는 섬마다 네덜란드가 첫 조약·보호·병합을 맺은 해부터 넣음. 자와·람풍·말루쿠·술라웨시 남부·서부·북부·누사틍가라와 서·남·중칼리만탄은 동인도 회사 땅을 넘겨받은 1800년, 방카 1816년, 서수마트라 1821년, 남수마트라 1823년, 리아우 제도·중술라웨시 1824년, 벵쿨루 1825년, 잠비 1833년, 동칼리만탄·발리 1844년, 서뉴기니 1848년, 리아우 본토·동남술라웨시 1858년, 북수마트라 1862년부터이고, 그 앞은 토착 왕국 땅이라 비워 둠. 남·중칼리만탄은 1809년 네덜란드가 물러난 뒤 1817년 1월 반자르 술탄국과 새 협정을 맺기까지 비움. 이 섬들의 내륙 대부분은 20세기 초까지 명목상의 지배였음. 말라카는 1800~1824년 이 색이고, 1811~1816년 영국의 자와 점령은 칠하지 않음. 1825~1830년 자와 전쟁과 1873~1904년 아체 전쟁은 글로만 적음. 1900년부터는 지금 인도네시아 땅(1903년까지는 아체를 뺌)과 서뉴기니를 141° 자오선까지 주장 경계 전체로 표시함. 자와의 수라카르타·욕야카르타 왕국과 바깥섬 자치 토후국도 네덜란드령 색으로 칠하고, 1906~1908년에 정복한 발리도 1900년부터 넣음. 서뉴기니 내륙은 1950년대에야 행정이 닿았음. 1942~1945년 일본 점령은 관계로만 보이고, 1945~1949년 공화국이 자와·수마트라 시골을 실제로 다스린 땅은 칠하지 않고 법적 국경을 따름
  endNote: 1949년 12월 27일 헤이그 원탁 회의 합의에 따라 서뉴기니를 뺀 주권을 인도네시아 연방 공화국에 넘김
  features:
    - 도읍은 바타비아(1942년 자카르타로 이름을 바꿈)
    - 1825~1830년 자와 전쟁, 1830년 강제 재배 제도, 1901년 윤리 정책
    - 1873~1904년 아체 전쟁, 1906~1908년 발리 정복
    - 1942~1945년 일본 점령
    - 1945~1949년 인도네시아 독립 전쟁
  startEvents: [voc-dissolution-1795]
  endEvents: [round-table-1949]
  basis:
    type: primary_source
    refs: ["1824년 영국–네덜란드 조약", "1949년 헤이그 원탁 회의 합의"]
    foundingNote: 동인도 회사가 해산되고 그 영토가 네덜란드 국가 소유가 된 1800년 1월 1일부터

# 기본값 8 — 1904 네덜란드령 동인도에 포함(1903 술탄 항복, 1912 무렵까지 저항은 사건 글). 관계 없음(1903까지 독립 술탄국 — 짧은 선언은 점령지 수장들이 낸 것)
