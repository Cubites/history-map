  mapNote: 지도에는 1767년부터 1945년까지 지금 페락주로 그림. 1874년 팡코르 조약으로 영국 주재관을 받아들인 뒤에도 땅은 술탄국 그대로 이 색. 1874~1934년 해협 식민지였던 해안의 딘딩도 이 색에 넣음(1만 km² 미만). 1942~1945년 일본 점령은 영토를 바꾸지 않고 점령 관계로만 나타냄
  features:
