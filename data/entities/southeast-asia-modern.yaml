  summary: 티모르섬 동쪽 절반과 서쪽 해안의 오에쿠시를 다스린 포르투갈의 식민지. 1702년 리파우에 총독을 둔 뒤 1769년 딜리로 도읍을 옮겼고, 1859년 리스본 조약과 1914년 상설 중재 재판소 판정으로 네덜란드령 티모르와의 경계가 정해짐. 2차 대전 때 포르투갈은 중립이었으나 1941년 12월 연합군이 상륙했고 1942년 2월 일본군이 들어와 1945년까지 점령함. 1974년 포르투갈 카네이션 혁명 뒤 탈식민이 시작되어 정당들이 내전을 벌였고, 1975년 11월 28일 프레틸린이 독립을 선포했으나 12월 7일 인도네시아가 침공함
  mapNote: 지도에는 1767년부터 1975년까지 지금 동티모르 땅(오에쿠시 포함)으로 표시함. 19세기 말까지 내륙의 여러 왕국은 스스로 다스렸으나 포르투갈의 주권 아래로 보아 같은 색이고, 1859년 리스본 조약과 1914년 경계 판정으로 바뀐 땅은 1만 km²에 못 미쳐 지금 국경 그대로 둠. 1942~1945년 일본 점령은 관계로만 보임. 1975년 12월 인도네시아 침공은 그해 말까지 칠하지 않고 1976년부터 인도네시아로 둠
  endNote: 1976년 7월 17일 인도네시아가 27번째 주로 병합을 선언했으나, 유엔은 포르투갈을 이 땅의 시정국으로 계속 인정함
  features:
