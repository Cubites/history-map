  endNote: 1946년 4월 1일 말라야 연합에 들어가 독립한 나라로서는 끝나고, 지금은 말레이시아의 파항주이며 술탄 왕가가 이어짐
  mapNote: 지도에는 1853년부터 1945년까지 지금 파항주로 그림. 1767~1852년 븐다하라 영지였던 때는 조호르 술탄국 색이고, 1861년 조호르와의 경계 조약과 1881년 술탄 칭호는 땅을 바꾸지 않아 글로만 적음. 1942~1945년 일본 점령은 영토를 바꾸지 않고 점령 관계로만 나타냄
  features:
    - 넓이 약 3.6만 km²로 말레이반도에서 가장 넓으나 숲과 산지가 대부분임
    - 1857~1863년 툰 알리의 두 아들이 다툰 내전 끝에 완 아마드가 다스림
    - 1887년 영국 관리 클리퍼드를 받아들이고 1888년 첫 주재관을 둠
    - 1891~1895년 영국 지배에 맞선 족장들의 파항 봉기가 일어남
    - 1895년 말레이 연합주에 들어감
  startEvents: [johor-pahang-1853]
  endEvents: [malayan-union-1946]
  basis:
    type: primary_source
    refs: ["위키백과 Pahang", "위키백과 Federated Malay States"]
    foundingNote: 븐다하라 툰 알리가 조호르 술탄에게서 벗어나 파항을 따로 다스린 1853년부터(술탄 칭호는 1881년, 정보상자는 1882년). 15~17세기의 옛 파항 술탄국과는 따로 봄

