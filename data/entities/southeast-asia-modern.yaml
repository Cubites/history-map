  summary: 15세기 말 수마트라 북쪽 끝 반다아체(옛 쿠타라자)에 선 이슬람 술탄국. 16~17세기 후추 무역과 말라카 해협의 패권을 두고 포르투갈령 말라카·조호르와 겨루었고, 이스칸다르 무다(재위 1607~1636) 때 가장 컸음. 1871년 수마트라 조약으로 영국이 아체를 네덜란드 몫으로 인정하자 1873년 아체 전쟁이 일어남. 1874년 도읍을 잃은 뒤에도 울라마와 귀족이 게릴라전을 이어 갔으나, 1898년부터 네덜란드의 공세에 밀려 1903년 술탄이 항복함
  mapNote: 지도에는 1767년부터 1903년까지 지금 아체주 땅으로 표시함. 1874년 뒤 네덜란드가 쥔 도읍 둘레와 해안 거점은 넓이가 1만 km²에 못 미쳐 술탄국 땅에 넣음. 1904년부터는 네덜란드령 동인도로 칠하고, 1912년 무렵까지 이어진 저항은 글로만 적음
  endNote: 1903년 마지막 술탄이 항복했고, 1904년 네덜란드군이 내륙 가요·알라스 고원까지 손에 넣음. 산발적인 저항은 1912년 무렵, 일부는 1942년까지 이어짐
  features:
