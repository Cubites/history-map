# 1937-04-01 인도에서 분리(기본값 2), 1948-01-04 독립 — vassal_of uk 1937~1947, 일본 점령 occupied_by japan 1942~1945(결정 3)
- id: british-burma
  level: polity
  names: { ko: 영국령 버마, en: British Burma, native: ဗြိတိသျှ မြန်မာ }
  from: 1937
  to: 1947
  color: "#3466b2"
  summary: 1935년 버마 통치법에 따라 1937년 4월 1일 영국령 인도에서 갈라져 나온 영국의 직할 식민지. 영국인 총독 아래 버마인 총리와 내각이 내정 일부를 맡았고, 샨 국·카레니 국 같은 변경은 총독이 따로 다스림. 1942년 일본군이 랑군(지금 양곤)을 차지해 1945년까지 점령했고, 1943년에는 바 모를 앞세운 버마국을 세움. 1945년 아웅 산의 버마 국민군이 일본에 맞서 일어섰고, 1947년 영국과의 협정으로 독립이 정해짐
  mapNote: 지도에는 1937년부터 1947년까지 지금 미얀마 땅에서 샨주·카야주를 뺀 곳(아라칸·테나세림·하버마·상버마와 카친·친 구릉)으로 표시함. 1942~1945년 일본 점령 때도 영국령 그대로 칠하고 점령은 관계로만 보임. 1943년 일본이 타이에 넘긴 샨 두 주는 샨 국 땅 그대로 둠
  endNote: 1948년 1월 4일 버마 연방으로 독립했고 영국 연방에는 들지 않음
  features:
    - 도읍은 랑군
    - 1937년 바 모가 첫 총리가 됨
    - 1942~1945년 일본 점령, 1943년 바 모의 버마국
    - 1947년 아웅 산과 영국 정부의 협정으로 독립이 정해짐
  startEvents: [saya-san-1930]
  endEvents: [burma-independence-1947]
  basis:
    type: primary_source
    refs: ["버마 통치법(1935)", "버마 독립법(1947)"]
    foundingNote: 1935년 버마 통치법이 시행되어 버마가 인도에서 갈라진 1937년 4월 1일부터

# 기본값 4 — vassal_of british-raj 1886~1936·british-burma 1937~1947(대부분 1887~1890 복속, 종주는 1886 상버마 병합부터)
- id: shan-states
  level: polity
  names: { ko: 샨 국, en: Shan States, native: ရှမ်းပြည် }
  from: 1767
  to: 1947
  color: "#c945c0"
  summary: 버마 동부 샨 고원에서 사오파(세습 군주)들이 다스린 샨족 소국들. 콘바웅 왕조에 조공하며 왕실에 딸과 공물을 바쳤으나 왕이 직접 다스리지는 않았고, 1886년 영국이 상버마를 병합한 뒤 1887~1890년 차례로 영국 보호 아래 들어감. 1922년 10월 10일 카레니 국과 함께 연방 샨 국으로 묶여 타웅지의 영국인 감독관이 감독했고, 1947년 팡롱 협정으로 버마 연방에 들기로 함
  mapNote: 지도에는 1767년부터 1947년까지 지금 샨주 땅으로 표시하고, 연방 샨 국 감독관이 함께 맡은 와 주를 넣음. 1885년까지는 콘바웅 왕조에 조공한 소국들이고, 그때 어느 쪽에도 매이지 않았던 와 구릉도 같은 색으로 그림. 사가잉 쪽 작은 샨 소국은 버마 본토 쪽에, 1952년 카야주로 옮긴 몽파이는 카레니 국 쪽에 둠(두 곳 모두 1만 km² 미만 어림). 1943년 일본이 타이에 넘긴 켕퉁·몽판은 칠하지 않고, 1942~1945년 일본 점령은 관계로만 보임
  endNote: 1948년 1월 4일 버마 연방의 샨주가 되었고, 사오파들은 1959년 권한을 내놓음
  features:
    - 중심 도시는 타웅지
    - 켕퉁 등 30곳 남짓한 소국으로 이루어짐
    - 1885년까지 콘바웅 왕조에 조공
    - 1922년 연방 샨 국으로 묶임
    - 1947년 팡롱 협정에 서명
  startEvents: []
  endEvents: [burma-independence-1947]
  basis:
    type: primary_source
    refs: ["팡롱 협정(1947)"]
    foundingNote: 소국마다 선 때가 달라(13세기 몽까응·몽나이 등) 한 해로 정할 수 없어, 콘바웅 왕조의 종주 아래 소국 묶음으로 지도에 처음 나오는 1767년부터. 1886년 영국이 상버마를 병합해 종주국이 되었고 소국 대부분은 1887~1890년 복속

# 기본값 4 — 1875-06-21 영국·버마 독립 인정, 1892 영국에 종속(vassal_of british-raj 1892~1936·british-burma 1937~1947)
- id: karenni-states
  level: polity
  names: { ko: 카레니 국, en: Karenni States, native: ကရင်နီ }
  from: 1767
  to: 1947
  color: "#8cc945"
  summary: 샨 고원 남쪽 카레니(카야)족의 작은 나라들로, 동쪽 칸타라와디와 서쪽 네 나라로 이루어짐. 18세기에 독립한 앞 나라가 19세기에 다섯으로 나뉘었고, 콘바웅 왕조가 제 땅이라 주장했으나 다스리지는 못했음. 1875년 6월 21일 영국과 버마 민돈 왕이 서쪽 네 나라의 독립을 인정했고, 1892년 군주들이 영국의 수당을 받으며 영국에 종속됨. 1922년부터 연방 샨 국과 함께 다스려짐
  mapNote: 지도에는 1767년부터 1947년까지 지금 카야주 땅으로 표시함. 지금 카야주는 1952년 샨 소국 몽파이를 더한 땅이라 1901년 넓이(약 8,100 km²)보다 넓게 그려짐. 1942~1945년 일본 점령은 관계로만 보임
  endNote: 1948년 버마 연방의 카레니주가 되었고 1952년 카야주로 이름을 바꿈
  features:
    - 중심지는 로이코
    - 콘바웅 왕조가 다스리지 못한 산간 소국
    - 1875년 영국과 버마가 독립을 인정
    - 1892년 영국에 종속
  startEvents: []
  endEvents: [burma-independence-1947]
  basis:
    type: primary_source
    refs: ["영국·버마 협정(1875)"]
    foundingNote: 18세기에 카레니의 앞 나라가 독립했으나 해가 전하지 않아, 지도에 처음 나오는 1767년부터. 서쪽 네 나라의 독립은 1875년 6월 21일 영국과 버마가 인정함

