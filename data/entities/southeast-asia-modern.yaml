    foundingNote: 1431년 아유타야에 밀려 앙코르를 버리고 도읍을 남쪽으로 옮긴 뒤의 캄보디아 왕국을 시작으로 봄(그 앞은 크메르 제국). 1863년 노로돔 왕이 프랑스와 보호 조약을 맺은 뒤도 같은 나라


