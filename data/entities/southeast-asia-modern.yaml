# 결정 2 — vassal_of france 1863~1953(1953-11-09 독립), 크메르 공화국·민주 캄푸치아·캄푸치아 인민 공화국도 같은 항목(00-scope 6절). from 1431(E2 SC — P7: 1863 보호령 앞 왕국과 같은 항목, 1767~1899는 colonial.mjs, 1431~1766은 E3)
- id: cambodia
  level: polity
