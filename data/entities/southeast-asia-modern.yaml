  mapNote: 지도에는 1898년부터 1945년까지 지금 필리핀 땅으로 표시하고, 1935년 자치령이 된 뒤에도 같은 색으로 그림. 1898~1899년 아기날도의 혁명 정부와 1899년 1월 선 말롤로스 공화국이 루손 대부분을 쥐었던 동안과 1902년까지의 필리핀–미국 전쟁과 1913년까지 이어진 남부 모로족의 저항 동안에도 조약에 따라 미국령으로 칠함. 1942~1945년 일본 점령은 관계로만 보임
  endNote: 1946년 7월 4일 마닐라 조약으로 필리핀 공화국이 독립함
