    - 1385년 잔갈레아초가 숙부 베르나보를 몰아낸 뒤 베로나·비첸차(1387)·파도바(1388~1390)를 차지함
  startEvents: [guelph-ghibelline-1250]
  endEvents: [visconti-milan-1385]
