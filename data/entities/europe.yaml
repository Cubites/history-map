  summary: 리보니아 기사단과 리가 대주교령·타르투·외셀비크·쿠를란트 주교령이 지금의 에스토니아·라트비아를 나눠 다스린 느슨한 연맹(묶음). 1558년 러시아의 침공으로 리보니아 전쟁이 일어나 1559년 외셀을 덴마크에 팔고, 1561년 북에스토니아는 스웨덴에, 나머지는 빌뉴스 조약으로 리투아니아에 신속해 무너짐(기사단장 케틀러는 쿠를란트 공)
  mapNote: 지도에는 1422~1560년만 한 색으로 표시(1558~1582년 러시아의 점령은 그리지 않음)
