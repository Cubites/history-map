  mapNote: 서베를린은 연합국 관리 구역으로 따로 표시함. 1990년 통일 뒤는 독일 항목(같은 나라가 이어짐, 소련·러시아 연방처럼 화면 이름을 위해 항목을 나눔)
  endNote: 1990년 10월 3일 동독이 서독 기본법에 따라 서독에 가입하는 방식으로 통일되어 통일 독일(독일 항목)이 됨
  features:
    - 에르하르트 경제 장관의 사회적 시장 경제 아래 1950년대에 빠르게 성장함('라인강의 기적')
    - 1952년 유럽 석탄 철강 공동체(ECSC) 출범에 참여했고 1957년 유럽 경제 공동체 창설에도 참여함
    - 1955년 파리 조약 발효로 주권을 되찾아 NATO에 가입함
    - 1957년 자를란트를 되찾음
    - 1970년대 동방 정책으로 동독·동유럽과 관계를 풀었음
  startEvents: [two-germanies-1949]
  endEvents: [fall-of-berlin-wall-1989]
  basis:
    type: primary_source
    refs: ["독일 연방 공화국 기본법(1949)", "파리 조약(1954)", "자르 조약(1956)", "동서독 기본 조약(1972)"]
    foundingNote: 기본법을 공포한 1949년 5월 23일을 시작으로 봄. 바이마르 공화국·나치 독일과 1945~1949년 점령 지구는 따로 다룸

- id: germany
  level: polity
  names: { ko: 독일, en: Germany, native: Deutschland }
  from: 1990
  to: null
  color: "#5f6f8f"
  summary: 1990년 10월 3일 동독(5개 주와 동베를린)이 서독에 가입하고 서베를린이 합쳐져 이룬 통일 독일(정식 국호는 독일 연방 공화국, 수도 베를린). 2+4 조약으로 4대 강국의 권리가 끝나고 오데르-나이세선 국경이 확정됨
  mapNote: 법적으로는 동독이 기본법 23조에 따라 서독(독일 연방 공화국)에 가입한 것이라 서독과 같은 나라가 이어지지만, 화면 이름(서독·독일)을 위해 항목을 나눔(소련·러시아 연방과 같은 방식)
  features:
    - 1990년 9월 12일 동서독과 미국·영국·프랑스·소련이 2+4 조약을 맺어 4개국의 권리를 끝내고 오데르-나이세선을 동쪽 국경으로 확정함
    - 2+4 조약은 통일 독일의 나토 잔류와 병력 상한도 정했고, 11월 통일 독일은 폴란드와 국경 조약을 맺음
    - 통일 뒤 동독 지역에서는 공장이 무더기로 문을 닫아 실업이 크게 늘었고 서독 지역은 막대한 통일 비용을 떠안음
    - 1992년 2월 7일 유럽 공동체 12개국과 함께 마스트리흐트에서 유럽 연합 조약을 맺음
  startEvents: [fall-of-berlin-wall-1989]
  basis:
    type: primary_source
    refs: ["독일 통일 조약(1990)", "독일 관련 최종 해결 조약(1990)", "독일-폴란드 국경 조약(1990)"]
    foundingNote: 통일한 1990년 10월 3일을 시작으로 봄

- id: east-germany
  level: polity
  names: { ko: 동독, en: East Germany, native: Deutsche Demokratische Republik }
  from: 1949
  to: 1990
  color: "#a0826a"
  summary: 1949년 10월 소련 점령 지구에 세운 독일 민주 공화국(수도 동베를린). 사회주의 통일당(SED)의 일당 체제로 바르샤바 조약 기구에 속했고 1961년 베를린 장벽을 쌓음. 1989년 11월 장벽이 열린 뒤 1990년 10월 3일 서독에 가입하며 사라짐
  mapNote: 지도에는 동베를린을 1949년부터 동독 영토로 그림(미국·영국·프랑스는 베를린 전체를 4개국 관리 지역으로 보아 인정하지 않음)
  endNote: 1989년 11월 베를린 장벽이 열린 뒤, 1990년 10월 3일 동독이 서독 기본법에 따라 서독에 가입하는 방식으로 사라짐
  features:
    - 피크가 대통령, 그로테볼이 총리가 되었으나 실권은 사회주의 통일당(SED) 울브리히트가 쥔 일당 체제임
    - 토지 개혁과 산업 국유화로 소련식 계획 경제가 자리 잡음
    - 1953년 6월 17일 생산 할당량 인상에 반발한 노동자들이 베를린 등 각지에서 봉기했으나 소련군 전차에 진압됨
    - 1955년 5월 14일 소련·폴란드·체코슬로바키아 등과 바르샤바 조약을 맺어 바르샤바 조약 기구에 속함
    - 1961년 베를린 장벽을 쌓음
  startEvents: [two-germanies-1949]
  endEvents: [fall-of-berlin-wall-1989]
  basis:
    type: primary_source
    refs: ["독일 민주 공화국 헌법(1949)", "동서독 기본 조약(1972)", "독일 통일 조약(1990)"]
    foundingNote: 헌법이 발효한 1949년 10월 7일을 시작으로 봄

- id: saar-protectorate
  level: polity
  names: { ko: 자르 보호령, en: Saar Protectorate, native: Saarland }
  from: 1947
  to: 1956
  color: "#93a0b8"
  summary: 2차 대전 뒤 프랑스가 자기 점령 지구에서 떼어 내 경제·관세 동맹을 맺고 외교·국방을 맡은 자르 지방(1947년 헌법, 호프만 정부). 1955년 10월 주민 투표에서 '유럽화'(자르 규약)가 부결되자 1956년 자르 조약으로 1957년 1월 1일 서독의 주가 됨
  mapNote: 지도는 지금의 자를란트주로 대략 그림
  endNote: 1955년 10월 23일 주민 투표에서 '유럽화'(자르 규약)가 부결되자, 독일과 프랑스가 1956년 10월 27일 자르 조약을 맺어 1957년 1월 1일 서독의 주(자를란트)가 됨
  features:
    - 요하네스 호프만이 이끈 정부는 프랑스와 관세·화폐 동맹을 맺었고 탄광은 프랑스가 이용함
    - 친독일 정당은 한동안 선거에 나서지 못함
    - 1954년 파리 협정은 자르를 서유럽 연합(WEU)의 감독 아래 '유럽화'하는 방안을 담음
  startEvents: [saar-protectorate-1947]
  endEvents: [saar-protectorate-1947, warsaw-pact-1955]
  basis:
    type: primary_source
    refs: ["자를란트 헌법(1947)", "자르 규약 주민 투표(1955)", "자르 조약(1956)"]
    foundingNote: 자를란트 헌법이 발효한 1947년 12월을 시작으로 봄. 1920~1935년 국제 연맹 관리 자르 지역은 따로 다룸

# 트리에스테 자유 지역
