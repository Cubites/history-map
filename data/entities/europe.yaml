- id: achaemenid-empire
  level: polity
  names: { ko: 아케메네스 제국, en: Achaemenid Empire, native: Xšāça }
  from: -549
  to: -328
  color: "#8b3a62"
  summary: 키루스 2세가 550년 메디아를 무너뜨리고 세운 페르시아 제국. 547 리디아, 539 바빌론을 얻고 다레이오스 1세(522~486)가 사트라페이아로 나눔. 지도 범위 안에서는 아나톨리아(547~334)·아르메니아·시리아 북부와 513~479년 트라키아 해안을 다스리고 마케도니아(512~479)·킬리키아(545~401)를 종속 왕국으로 둠. 334~331년 알렉산드로스에게 무너짐(330 다레이오스 3세의 죽음)
  mapNote: 지도 범위 안 땅만 그림. 지도에는 기원전 550년부터 아르메니아·카파도키아·폰토스·티그리스강 위쪽, 547년부터 리디아·프리기아·미시아·비티니아·파플라고니아·트로아스, 545년부터 이오니아·카리아·리키아·팜필리아, 539년부터 시리아 북부·메소포타미아 북부, 513~480년 트라키아 해안(도리스코스·케르소네소스·비잔티온·네스토스강~스트리몬강), 401~400년부터 킬리키아를 표시. 479~388년 이오니아·아이올리스 해안은 그리스 도시국가, 리카오니아·피시디아(크세노폰 1.2.19·3.2.23)·카르두키는 복속하지 않아 비움(401년 뒤 둘러싸여도 비움)
  endNote: 기원전 334년 그라니코스·333년 이소스·331년 가우가멜라에서 알렉산드로스에게 졌고, 330년 다레이오스 3세가 베소스에게 살해된 뒤 왕을 칭한 베소스도 329년 잡힘
  features:
    - 기원전 547년 리디아, 539년 바빌론을 얻음
