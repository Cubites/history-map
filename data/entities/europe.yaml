- id: flanders
  level: polity
  names: { ko: 플랑드르 백국, en: County of Flanders, native: Graafschap Vlaanderen }
  from: 862
  to: 1384
  color: "#e0b040"
  summary: 프랑스 왕의 봉토이면서 외교·전쟁을 따로 한 북해 쪽 백국(헨트·브뤼허·이프르의 모직물 도시). 1297~1302년 필리프 4세에게 병합되었다가 1302년 쿠르트레(황금 박차) 전투로 되찾고 1305년 아티스쉬르오르주 조약으로 강화, 1312년 릴·두에·오르시를 프랑스에 넘김(1369 되돌려 받음). 1338~1345 야코프 판 아르테벨더의 반란. 1384년 루이 드 말이 죽어 사위인 부르고뉴 공 필리프 대담공이 이음
  mapNote: 프랑스 왕국과 따로 그림. 지도에는 888~1383년 플랑드르(서·동플랑드르와 제일란트 플랑드르·노르도, 왈롱 플랑드르의 1312~1368 프랑스 시기는 근사)를 표시. 888년부터는 서프랑크의 큰 봉토로 그림
  endNote: 1384년 루이 드 말이 죽어 사위인 부르고뉴 공 필리프 대담공이 아내를 통해 플랑드르·아르투아·부르고뉴 백작령을 물려받아 이음
  features:
    - 보두앵 1세 철완은 861년 말 왕의 딸 주디트를 데리고 달아났다가 863년 왕과 화해하고 혼인함
    - 아들 보두앵 2세(재위 879~918)가 아르투아까지 넓힘
    - 1297~1302년 필리프 4세에게 병합되었다가 1302년 쿠르트레(황금 박차) 전투로 되찾고 1305년 아티스쉬르오르주 조약으로 강화함
    - 1312년 릴·두에·오르시를 프랑스에 넘김(1369년 되돌려 받음)
    - 1338~1345년 야코프 판 아르테벨더의 반란이 있었음
  startEvents: [west-francia-principalities-843]
  endEvents: [burgundy-flanders-1363]
  basis:
