  color: "#8db1d6"
  summary: 모하치 전투(1526) 뒤 헝가리 귀족 다수가 왕으로 뽑은 서포여이 야노시와 그 아들 야노시 지그몬드의 왕국. 페르디난트 1세와 왕위를 다투다 오스만의 종주를 받았고(1529), 너지바러드 조약(1538)으로 헝가리를 나눔. 1541년 술레이만 1세가 부다를 직할령으로 하고 티서강 동쪽과 트란실바니아를 야노시 지그몬드에게 줌. 1570년 슈파이어 조약으로 왕 칭호를 내놓고 트란실바니아 공국이 됨
  details: 페르디난트 1세와 왕위를 다투다 오스만의 종주를 받았고(1529), 너지바러드 조약(1538)으로 헝가리를 나눔. 1541년 술레이만 1세가 부다를 직할령으로 하고 티서강 동쪽과 트란실바니아를 야노시 지그몬드에게 줌(페르디난트는 1547년 아드리아노플 휴전으로 인정). 바이센부르크 조약(1551)으로 왕국을 페르디난트에게 넘겼으나, 그의 군대가 지키던 테메슈바르·리포바·솔노크를 1552년 오스만에 빼앗기고(1562년 콘스탄티노폴리스 조약으로 인정) 1556년 야노시 지그몬드가 돌아옴. 1570년 슈파이어 조약으로 왕 칭호를 내놓고 트란실바니아 공국이 됨
  mapNote: 지도에는 1526~1569년만 표시하고 1570년부터는 트란실바니아 공국 항목(같은 색). 1526~1540년은 너지바러드 조약의 나눔으로 그린 군 단위 근사이고, 1551~1556년 페르디난트의 지배는 그리지 않음. 부다 쪽은 1547년, 테메슈바르·리포바·솔노크는 1562년(조약 해)에 오스만 땅으로 그림
  endNote: 1570년 슈파이어 조약으로 야노시 지그몬드가 헝가리 왕 칭호를 내놓고 트란실바니아 공이 되어 트란실바니아 공국이 됨
  features:
    - 페르디난트 1세와 왕위를 다투다 오스만의 종주를 받았고(1529), 너지바러드 조약(1538)으로 헝가리를 나눔
    - 1541년 술레이만 1세가 부다를 직할령으로 삼고 티서강 동쪽과 트란실바니아를 야노시 지그몬드에게 줌
    - 바이센부르크 조약(1551)으로 왕국을 페르디난트에게 넘김
    - 페르디난트의 군대가 지키던 테메슈바르·리포바·솔노크를 1552년 오스만에 빼앗기고 1562년 조약으로 인정됨
    - 1556년 야노시 지그몬드가 돌아옴
  startEvents: [mohacs-1526]
  endEvents: [szigetvar-speyer-1566]
