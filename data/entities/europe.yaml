    refs: ["우라르투 왕의 비문(메누아의 팔루 비문, 아르기슈티 1세의 호르호르 연대기·에레부니 비문)", "사르곤 2세의 여덟째 원정 편지", "헤로도토스, 『역사』 1.103~106"]
