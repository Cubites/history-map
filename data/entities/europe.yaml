  summary: 헬레니즘 왕국과 연방에 들지 않은 그리스 도시와 작은 동맹(아테네·스파르타(192까지)·보이오티아 동맹·테살리아 동맹(196~)·크레타의 도시들·키클라데스와 북에게해 섬들)과 흑해·아드리아해의 식민 도시(비잔티온·시노페(183까지)·헤라클레이아 폰티케(70까지)·케르소네소스·아폴로니아·에피담노스·아폴로니아(일리리아))를 묶은 항목. 그리스 본토는 기원전 146년 로마의 다스림 아래 들었음
  mapNote: "여러 도시국가를 묶어 그림. 시라쿠사(405)·로도스(408)·아이톨리아 동맹(358)·아카이아 동맹(280)은 따로, 테살리아(344)·칼키디케(348)는 마케도니아. 마살리아는 기원전 44년부터, 카타나는 260년부터 로마. 지도에 그린 첫 해(기원전 800년)를 시작으로 둠. 지도에는 기원전 800~28년 표시: 기원전 800년부터 그리스 본토·에게해 섬·크레타·키프로스(왕국들, 312년까지)·이오니아와 아이올리스 해안(561년까지와 479~388년)과 식민 도시(734~729 시칠리아 동부·쿠마이·칼키디케, 720~706 마그나 그라이키아, 688 겔라, 685 칼케돈, 680 타소스, 667 비잔티온, 631 시노페와 흑해 남안, 627 에피담노스, 625 암브라키아, 600 마살리아·포세이도니아·판티카파이온, 588 아폴로니아, 580 아크라가스, 560 헤라클레이아, 422 케르소네소스), 기원전 264~147년 아티카·보이오티아·스파르타(191년까지)·에게해 섬들(북에게해는 130년까지), 크레타(기원전 68년까지), 테살리아(196~147), 기원전 264~28년 비잔티온·아폴로니아(트라키아), 시노페와 그 식민 도시(184년까지), 헤라클레이아(68년까지), 케르소네소스(109년까지·63~28), 기원전 264~45년 마살리아(부슈뒤론도), 264~261년 카타나(263년 항복), 133~103년 팜필리아·피시디아의 자유 도시, 167~130년 카리아의 자유 도시. 흑해 남안(오르두·기레순·트라브존도)은 해안 도시 띠만 그림(내륙의 폰토스 산맥 부족 땅은 비움). 1만 km² 미만 식민 도시(올비아·히스트리아·토미스·칼라티스·오데소스 등)는 둘레 부족·나라로 근사"
  endNote: 기원전 146년 그리스 본토가 로마의 다스림 아래 들었고, 기원전 27년 아우구스투스의 원수정 때 마케도니아에서 갈라낸 아카이아 속주가 됨. 아테네 같은 옛 도시는 자유시의 지위를 이음
  features:
    - 폴리스는 신전과 광장(아고라)을 갖추고 시민이 직접 모여 일을 정하는 작은 공동체였고 중장보병이 시민군을 이룸
    - 모겐스 한센은 고전기까지 지중해와 흑해에 폴리스가 1,000곳 남짓 있었다고 셈
    - 폴리스끼리 자주 싸웠지만 같은 말과 신을 나누었고 올림피아의 제우스 제전이 그 구심이었음
  startEvents: [polis-olympia-homer-800bc]
  endEvents: [augustus-principate-27bc]
  basis:
    type: primary_source
    refs: ["폴리비오스, 『역사』", "스트라본, 『지리지』 7·8·10·12권", "멤논, 『헤라클레이아사』"]
