    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 962년부터로 넓힘 / 동프랑크의 renames, 같은 색 / 작업 M2
    foundingNote: 오토 1세가 황제 대관을 받은 962년을 시작으로 봄. 동프랑크가 이름만 바뀌어 이어짐

