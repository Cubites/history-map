  mapNote: 베르됭 조약(843)을 시작으로 봄. 888년부터 플랑드르·아키텐·가스코뉴·툴루즈·바르셀로나는 따로, 911~924년 로타링기아는 서프랑크. 지도에는 843~986년 표시하고 987년부터 프랑스(이름만 바뀌어 이어짐, 같은 색)
