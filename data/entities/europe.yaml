- id: serbia-medieval
  level: polity
  names: { ko: 세르비아 왕국, en: Kingdom of Serbia, native: Српско краљевство }
  from: 1217
  to: 1346
  color: "#9f4fd0"
  summary: 스테판 네마니치가 왕으로 대관한(1217) 세르비아 왕국. 밀루틴(1282~1321)이 북마케도니아(스코피에)를 얻고 형 드라구틴은 헝가리 왕에게서 마치바·베오그라드를 받았으며, 스테판 데찬스키가 1330년 벨부즈드 전투에서 불가리아를 이김. 스테판 두샨(1331~1355)이 1334년 오흐리드·프릴레프, 1343~1345년 알바니아·마케도니아(세레스)를 차지하고 1346년 스코피에에서 황제로 대관해 세르비아 제국이 됨
  mapNote: 지도에는 1217~1345년 표시하고 1346년부터는 세르비아 제국 항목(칭호가 바뀐 나라, 같은 색)
  endNote: 1346년 스테판 두샨이 스코피에에서 황제로 대관해 세르비아 제국이 됨
  features:
    - 스테판 네마니치의 동생 사바가 1219년 니케아에서 세르비아 교회의 자치 대주교로 서임되어 지차 수도원에 자리 잡음
    - 우로시 1세(재위 1243~1276)가 헝가리와 독일 쪽에서 온 광부(작센인)를 들여 은 광산을 열고 상업 도시를 키움
    - 밀루틴(1282~1321)이 북마케도니아(스코피에)를 얻었고, 형 드라구틴은 헝가리 왕에게서 마치바·베오그라드를 받음
    - 스테판 데찬스키가 1330년 벨부즈드 전투에서 불가리아를 이김
    - 스테판 두샨(1331~1355)이 1334년 오흐리드·프릴레프, 1343~1345년 알바니아·마케도니아(세레스)를 차지함
  startEvents: [serbia-nemanjic-1217]
  endEvents: [dusan-empire-1330]
  basis:
    type: primary_source
    refs: ["다닐로 2세, 『세르비아 왕과 대주교들의 생애』", "밀루틴과 안드로니코스 2세의 조약(1299)"]
    # 작업 메모: 작업 M3에서 1217년부터로 넓힘 / 정할 점 M-⑧·M2-⑨ / 작업 M2 검토 반영 / renames
    foundingNote: 스테판 네마니치가 대관한 1217년을 시작으로 봄

- id: serbian-empire
  level: polity
  names: { ko: 세르비아 제국, en: Serbian Empire, native: Српско царство }
  from: 1346
  to: 1371
  color: "#9f4fd0"
  summary: 스테판 두샨이 1346년 스코피에에서 '세르비아인과 그리스인의 황제'로 대관해 세운 제국. 1348년 테살리아·에피루스를 더해 발칸 서부·남부를 다스렸고 1349·1354년 두샨 법전을 냄. 1355년 두샨이 죽은 뒤 우로시 5세 아래 영주들(부카신·우글레샤·라자르·알토마노비치·브란코비치·발시치)이 갈라섰고, 이복형 시메온 우로시는 테살리아·에피루스에서 따로 황제를 칭함. 1371년 마리차 전투에서 부카신·우글레샤가 죽고 그해 12월 우로시 5세도 죽어 끝남
  mapNote: 세르비아 왕국에서 칭호만 바뀐 나라라 이어서 같은 색으로 그림. 지도에는 1346~1370년 표시. 1355~1370년 우로시 5세 아래 영주들의 땅과 1359~1370년 테살리아의 시메온 우로시도 이 나라로 그림(근사)
  endNote: 1371년 마리차 전투에서 부카신·우글레샤가 죽고 그해 12월 우로시 5세도 죽어 끝남. 이후 모라바 세르비아·브란코비치 영지·세르비아 영주국들(묶음)·알바니아·제타 영주국들로 나뉨
  features:
    - 1347~1348년 에피루스와 테살리아를 차지하고 이복형 시메온 우로시를 그곳 통치자로 앉힘
    - 1349년 스코피에에서 반포하고 1354년 세레스에서 늘린 『두샨 법전』이 귀족과 교회, 농민의 지위, 재판을 정함
    - 동로마 총대주교청은 세르비아 총대주교 승격을 인정하지 않았고 칼리스토스 1세가 1350년대 초 두샨을 파문함
    - 1355년 두샨이 죽은 뒤 우로시 5세 아래 부카신·우글레샤·라자르 같은 영주들이 갈라섬
    - 두샨이 죽은 뒤 시메온 우로시는 테살리아·에피루스에서 따로 황제를 칭함
