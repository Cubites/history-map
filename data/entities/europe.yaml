  to: 1795
  color: "#d98c8c"
  summary: 폴란드 왕국과 리투아니아 대공국이 루블린 연합(1569)으로 합친 귀족 공화정의 나라. 흐멜니츠키 봉기(1648)와 스웨덴의 침공을 겪어 안드루소보 휴전(1667)으로 스몰렌스크·키이우 등을 러시아에 넘김. 얀 3세 소비에스키가 빈 포위(1683)를 푼 뒤 카를로비츠 조약(1699)으로 포딜리아를 되찾음. 1791년 5월 3일 헌법을 만들었으나 1795년 3차 분할로 사라짐
  details: 리보니아 전쟁 끝에 얌자폴스키 휴전(1582)으로 리보니아를 지키고 벨리시를 얻음. 러시아 혼란 시대에 개입해 데울리노 휴전(1618)으로 스몰렌스크·세베르스크를 얻었으나 알트마르크 휴전(1629)으로 리보니아를 스웨덴에 넘겼고, 흐멜니츠키 봉기(1648)와 스웨덴의 침공(대홍수, 1655~1660)을 겪어 안드루소보 휴전(1667)으로 스몰렌스크·드니프로강 왼쪽 우크라이나·키이우를 러시아에 넘김. 부차치 조약(1672)으로 포딜리아를 오스만에 내줬다가 얀 3세 소비에스키가 빈 포위(1683)를 푼 뒤 카를로비츠 조약(1699)으로 되찾음. 18세기 초 대북방 전쟁의 싸움터가 되었고 작센 선제후를 겸한 아우구스트 2세·3세 때 러시아의 간섭이 커짐. 1772년 1차 분할 뒤 개혁을 꾀해 1791년 5월 3일 헌법을 만들었으나 러시아·프로이센의 2차 분할(1793)과 코시치우슈코 봉기(1794) 진압 뒤 러시아·프로이센·오스트리아의 3차 분할(1795)로 사라짐
  mapNote: 지도에는 1569년부터 표시(그전은 폴란드 왕국·리투아니아 대공국 항목)
  endNote: 1794년 코시치우슈코 봉기가 진압된 뒤 1795년 러시아·프로이센·오스트리아가 남은 땅을 모두 나눠 가진 3차 분할로 사라짐
  features:
