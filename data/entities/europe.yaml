- id: syracuse
  level: polity
  names: { ko: 시라쿠사, en: Syracuse, native: Συράκουσαι }
  from: -732
  to: -211
  color: "#e8c030"
  summary: 코린토스인이 세운 시칠리아 동부의 그리스 도시(전승 기원전 733년). 기원전 270년 무렵 히에론 2세가 왕이 되었고, 263년 로마와 조약을 맺어 시라쿠사·아크라이·레온티노이·메가라·헬로로스·네에톤·타우로메니온을 다스리는 로마의 동맹 왕국으로 남음. 215년 히에론이 죽은 뒤 손자 히에로니모스가 카르타고 편에 섰고, 212년 마르켈루스가 2년의 포위(아르키메데스의 방어) 끝에 도시를 함락함
