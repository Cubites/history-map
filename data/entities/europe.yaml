# 오스만 제국과 발칸
- id: ottoman
  level: polity
  names: { ko: 오스만 제국, en: Ottoman Empire, native: Devlet-i Âliye-i Osmâniyye }
  from: 1299
  to: 1922
  color: "#b5845a"
  summary: 아나톨리아·발칸·아랍 지역을 다스린 이슬람 제국. 러시아에 져 야시 조약(1792)으로 흑해 북쪽 기슭(예디산)을, 부쿠레슈티 조약(1812)으로 베사라비아를 넘김. 19세기에 그리스(1830)·세르비아·루마니아·몬테네그로(1878)·불가리아(1908)가 떨어져 나가 '유럽의 병자'로 불림. 탄지마트 개혁(1839~1876)과 청년 튀르크 혁명(1908)을 겪었고 발칸 전쟁(1912~1913)으로 유럽 땅을 대부분 잃음. 법적 주권은 남았지만 다른 나라가 점령·통치한 보스니아(1878~)·키프로스(1878~)·도데카니사(1912~)는 오스만 색의 점령지로 따로 표시함. 지도에는 유럽 권역 안(발칸·아나톨리아·키프로스·캅카스 일부)만 표시하고 중동·북아프리카는 아직 그리지 않음. 1차 대전에 동맹국으로 참전해 1918년 무드로스 휴전으로 항복함. 1920년 세브르 조약으로 분할될 처지에 놓였으나 무스타파 케말의 앙카라 정부가 그리스군을 몰아냈고 1922년 11월 술탄제가 폐지되어 무너짐(1923년 튀르키예). 지도의 1920~1922년은 앙카라 정부가 다스린 땅을 이 항목으로 표시
  basis:
    type: primary_source
    refs: ["야시 조약(1792)", "부쿠레슈티 조약(1812)", "베를린 조약(1878)", "런던 조약(1913)", "콘스탄티노폴리스 조약(1913)", "무드로스 휴전 협정(1918)", "세브르 조약(1920)"]
    foundingNote: 오스만 1세가 나라를 세운 1299년을 시작으로 봄

- id: greece
