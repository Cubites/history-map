- id: moldavia
  level: polity
  names: { ko: 몰다비아 공국, en: Principality of Moldavia, native: Principatul Moldovei }
  from: 1346
  to: 1859
  color: "#b9a7d1"
  summary: 오스만의 종주권 아래 있던 루마니아계 공국. 슈테판 대공(1457~1504) 때 오스만에 맞섰으나 킬리아·아케르만을 빼앗겼고(1484, 1486년 바예지트 2세와의 강화로 확인) 1538년 술레이만 1세의 원정 뒤 종주가 굳어짐. 1775년 북쪽의 부코비나를 오스트리아에 넘김. 1812년 부쿠레슈티 조약으로 프루트강 동쪽(베사라비아)을 러시아에 넘김. 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음. 크림 전쟁 뒤 파리 조약(1856)으로 남베사라비아를 얻었고, 1859년 왈라키아와 같은 공(쿠자)을 뽑아 합쳐짐
  mapNote: 공국이 선 1346년 무렵을 시작으로 봄. 오스만의 종속은 공물을 다시 바친 1486년 강화부터 그대로. 킬리아·아케르만(부자크 남쪽 해안)은 지도에서 1483년까지 몰다비아, 함락한 1484년부터 오스만
  endNote: 1859년 몰다비아와 왈라키아가 같은 공(쿠자)을 뽑아 합쳐짐
  features:
    - 슈테판 대공(1457~1504) 때 오스만에 맞섰으나 킬리아·아케르만을 빼앗김(1484, 1486년 바예지트 2세와의 강화로 확인)
    - 1538년 술레이만 1세의 원정 뒤 오스만의 종주가 굳어짐
    - 1775년 북쪽의 부코비나를 오스트리아에, 1812년 부쿠레슈티 조약으로 프루트강 동쪽(베사라비아)을 러시아에 넘김
    - 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음
    - 크림 전쟁 뒤 파리 조약(1856)으로 남베사라비아를 얻음
  startEvents: [louis-great-1342]
  endEvents: [romania-union-1859]
  basis:
    type: primary_source
    refs: ["부쿠레슈티 조약(1812)", "아드리아노플 조약(1829)", "파리 조약(1856)"]
    # 작업 메모: (세션 I에서 1484로, 전에는 1486년 강화부터) / relations.yaml
    foundingNote: 공국이 선 1346년 무렵을 시작으로 봄

- id: wallachia
  level: polity
  names: { ko: 왈라키아 공국, en: Principality of Wallachia, native: Țara Românească }
  from: 1310
  to: 1859
  color: "#9fc4ae"
  summary: 오스만의 종주권 아래 있던 루마니아계 공국으로 수도는 부쿠레슈티. 1600년 미하이 용감공이 트란실바니아·몰다비아를 잠시 함께 다스렸으나 그해 무너짐. 1718~1739년 올트강 서쪽의 올테니아(소왈라키아)를 오스트리아에 빼앗김. 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음. 1859년 몰다비아와 같은 공(쿠자)을 뽑아 연합 공국이 됨
  mapNote: 도브루자는 1388~1394·1404~1419년 왈라키아(미르체아 1세)로 표시하고 1420년(메흐메트 1세의 결정적 정복)부터 오스만
  endNote: 1859년 몰다비아와 같은 공(쿠자)을 뽑아 연합 공국이 됨
  features:
    - 1600년 미하이 용감공이 트란실바니아·몰다비아를 잠시 함께 다스렸으나 그해 무너짐
    - 1718~1739년 올트강 서쪽의 올테니아(소왈라키아)를 오스트리아에 빼앗김
    - 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음
  startEvents: [charles-robert-1308]
  endEvents: [romania-union-1859]
  basis:
    type: primary_source
    refs: ["아드리아노플 조약(1829)", "파리 조약(1856)"]
    # 작업 메모: 정할 점 J1-③ / (세션 J에서 1417 → 1420)
    foundingNote: 바사라브 1세가 공국을 세운 1310년 무렵을 시작으로 봄

- id: romania
  level: polity
  names: { ko: 루마니아, en: Romania, native: România }
  from: 1859
  to: null
  color: "#a5b8db"
  summary: 1859년 몰다비아·왈라키아가 쿠자를 함께 공으로 뽑아 연합 공국이 되며 시작된 나라. 1878년 베를린 조약으로 독립하고 1881년 왕국이 됨. 1916년 협상국 편으로 1차 대전에 참전해 1918년 베사라비아·부코비나·트란실바니아를 합친 대루마니아가 됨. 1944년 8월 편을 바꿨고 1947년 말 인민 공화국이 되었다가 1989년 12월 혁명으로 공산 정권이 무너짐
  details: 1878년 베를린 조약으로 독립해 북도브루자를 얻는 대신 남베사라비아를 러시아에 넘김. 1881년 왕국이 되고 2차 발칸 전쟁(1913)으로 남도브루자를 얻음. 1916년 협상국 편으로 참전해 1918년 베사라비아·부코비나·트란실바니아를 합친 대루마니아가 됨(트리아농 조약, 1920). 1940년 베사라비아·북부코비나(소련)·북트란실바니아(헝가리)·남도브루자(불가리아)를 잃고 추축국으로 독소 전쟁에 참전해 베사라비아를 되찾고 오데사 일대를 점령했으나, 1944년 8월 편을 바꿔 북트란실바니아를 되찾음. 1947년 파리 강화 조약으로 북트란실바니아를 되찾은 국경이 확정되고 그해 말 인민 공화국이 됨. 1989년 12월 혁명으로 공산 정권이 무너짐
  features:
    - 1878년 베를린 조약으로 독립해 북도브루자를 얻는 대신 남베사라비아를 러시아에 넘기고 1881년 왕국이 됨
    - 2차 발칸 전쟁(1913)으로 남도브루자를 얻고 1916년 협상국 편으로 참전함
    - 1918년 베사라비아·부코비나·트란실바니아를 합친 대루마니아가 됨(트리아농 조약, 1920)
    - 1940년 베사라비아·북부코비나·북트란실바니아·남도브루자를 잃고 추축국으로 독소 전쟁에 참전했다가 1944년 8월 편을 바꿈
    - 1947년 말 인민 공화국이 되었다가 1989년 12월 혁명으로 공산 정권이 무너짐
  startEvents: [romania-union-1859]
  basis:
    type: primary_source
    refs: ["파리 협약(1858)", "베를린 조약(1878)", "부쿠레슈티 조약(1913)", "트리아농 조약(1920)", "2차 빈 중재(1940)", "크라이오바 조약(1940)", "파리 강화 조약(1947)"]
    foundingNote: 두 공국이 같은 공을 뽑은 1859년을 시작으로 봄

- id: bulgaria
  level: polity
  names: { ko: 불가리아, en: Bulgaria, native: България }
  from: 1878
  to: null
  color: "#8aa86a"
  summary: 1878년 베를린 조약으로 도나우강과 발칸산맥 사이의 자치 공국이 되며 시작된 나라. 1885년 동루멜리아를 합치고 1908년 독립 왕국을 선포함. 1913년 2차 발칸 전쟁에 졌고 1차 대전에 동맹국으로 참전해 1919년 뇌이 조약으로 서트라키아를 잃음. 1941년 추축국에 가담했으나 1944년 9월 소련군이 들어왔고, 1946년 인민 공화국이 되었다가 1989년 공산 일당 체제가 끝남
  details: 러시아-튀르크 전쟁(1877~1878) 뒤 산스테파노 조약으로 대불가리아가 정해졌으나 베를린 조약(1878)으로 도나우강과 발칸산맥 사이의 자치 공국으로 줄어듦. 1885년 동루멜리아를 합치고 1908년 독립 왕국을 선포함. 1913년 2차 발칸 전쟁에 져 남도브루자를 루마니아에 넘겼으나 서트라키아를 얻어 에게해에 닿음. 1차 대전에 동맹국으로 참전해 1919년 뇌이 조약으로 서트라키아·스트루미차를 잃음. 1940년 크라이오바 조약으로 남도브루자를 되찾고 1941년 추축국에 가담해 마케도니아·서트라키아를 차지했으나 1944년 9월 소련군이 들어오며 내놓음. 1946년 왕정을 폐지하고 인민 공화국이 되었으며 1947년 파리 강화 조약으로 남도브루자를 지킴. 1989년 공산 일당 체제가 끝남
  features:
