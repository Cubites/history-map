    - 870년 메르센 조약으로 로타링기아 서쪽을 얻었다가 880년 리베몽 조약으로 내줌
    - 888년부터 로베르 가문(오도·로베르 1세·라울)과 카롤링거 가문이 번갈아 왕위에 오름
    - 911년 샤를 단순왕이 롤로에게 루앙 일대를 맡겨 노르망디 공국이 섬
