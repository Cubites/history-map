  from: 1292
  to: 1461
  color: "#a3b86f"
  summary: 흑해 남쪽 기슭 카스타모누·시노프의 튀르크 베이국. 1461년 트레비존드 원정 길에 메흐메트 2세가 시노프를 넘겨받아 오스만에 합침
  mapNote: 지도에는 1292~1460년(1292~1308년은 사프란볼루·바르튼·종굴다크만, 카스타모누·찬크르는 1309년 쉬레이만 파샤가 차반 가문에게서 차지한 뒤. 1300~1391년은 카스타모누·찬크르·사프란볼루와 1324년부터 시노프) 카스타모누·시노프만 표시(1400~1401년은 바예지트 1세에게 카스타모누를 잃어 시노프만, 1402~1416년 찬크르 포함)
  endNote: 1461년 트레비존드 원정 길에 메흐메트 2세가 시노프를 넘겨받아 오스만에 합침
  features:
    - 쉬레이만 파샤가 1309년 차반 가문에게서 카스타모누·찬크르를 차지함
    - 1324년부터 시노프도 다스림
    - 1400~1401년 바예지트 1세에게 카스타모누를 잃어 시노프만 남음
  startEvents: []
  endEvents: [ottoman-balkans-1456]
  basis:
    type: primary_source
    refs: ["1461년 메흐메트 2세의 시노프 접수"]
