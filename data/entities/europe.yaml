- id: serbian-despotate
  level: polity
  names: { ko: 세르비아 전제공국, en: Serbian Despotate, native: Српска деспотовина }
  from: 1402
  to: 1459
  color: "#a06ab0"
  summary: 브란코비치 가문의 세르비아(수도 스메데레보, 노보브르도의 은광). 오스만과 헝가리 사이에서 공물을 바쳤고, 1455년 노보브르도와 남부를 잃어 1456년 초 강화로 넘겼으며 1459년 6월 스메데레보가 함락되어 무너짐
  mapNote: 스테판 라자레비치가 비잔티움 황제에게 전제공 칭호를 받은 1402년을 시작으로 봄. 1403~1427년 베오그라드, 1412년부터 브란코비치 땅, 1423년부터 제타(1421 유언)를 더하고, 1439년 스메데레보·1441년 노보브르도 함락으로 1443년까지 오스만, 1444년 되살아남. 지도에는 1402~1458년만 표시(남부·코소보는 1455년까지)
  endNote: 오스만과 헝가리 사이에서 공물을 바쳤고, 1455년 노보브르도와 남부를 잃어 1456년 초 강화로 넘겼으며 1459년 6월 스메데레보가 함락되어 무너짐
  features:
    - 1403~1404년 헝가리 왕 지기스문트에게 신서해 베오그라드와 마치바를 봉토로 받고 베오그라드를 새 수도로 삼음
    - 노보브르도 같은 광산의 은 수입이 나라의 밑천이었음
    - 스테판은 시와 글을 쓴 학자 군주이기도 했음
    - 1427년 스테판이 죽자 베오그라드를 헝가리에 돌려주고 주라지 브란코비치가 전제공이 되어 새 수도 스메데레보를 쌓음
    - 1439년 스메데레보, 1441년 노보브르도 함락으로 1443년까지 오스만 아래 있다가 1444년 되살아남
  startEvents: [serbian-despotate-1402]
  endEvents: [ottoman-balkans-1456]
  basis:
    type: primary_source
    refs: ["1456년 오스만과의 강화"]
    # 작업 메모: 작업 M1
    foundingNote: 스테판 라자레비치가 비잔티움 황제에게 전제공 칭호를 받은 1402년을 시작으로 봄

- id: bosnia-kingdom
  level: polity
  names: { ko: 보스니아 왕국, en: Kingdom of Bosnia, native: Kraljevina Bosna }
  from: 1377
  to: 1463
  color: "#a0a0f0"
  summary: 코트로마니치 가문의 왕국. 헝가리와 오스만 사이에서 공물을 바치다 1463년 메흐메트 2세에게 정복되고 마지막 왕 스테판 토마셰비치가 처형됨. 같은 해 말 헝가리의 마티아스가 야이체를 되찾아 야이체·스레브레니크 바나트를 둠
  mapNote: 지도에는 1377~1462년만(그전은 보스니아 바나트 항목, 1390~1393년 달마티아 포함) 표시(1447년까지 코사차 가문의 훔(헤르체고비나)을 포함)
  endNote: 1463년 메흐메트 2세에게 정복되고 마지막 왕 스테판 토마셰비치가 처형됨. 같은 해 말 헝가리의 마티아스가 야이체를 되찾아 야이체·스레브레니크 바나트를 둠
  features:
    - 트브르트코 1세 때인 14세기 말 가장 넓어짐
    - 1388년 8월 빌레차에서 블라트코 부코비치가 오스만군을 무찌름
    - 15세기 전반 귀족 가문이 힘을 키워 왕권이 약해짐
    - 헝가리와 오스만 사이에서 공물을 바침
  startEvents: [louis-great-1342]
  endEvents: [ottoman-balkans-1456]
  basis:
    type: primary_source
    refs: ["1463년 오스만의 보스니아 원정"]
    # 작업 메모: 작업 M2 / 작업 M1
    foundingNote: 트브르트코 1세가 왕으로 대관한 1377년을 시작으로 봄

- id: herzegovina
  level: polity
  names: { ko: 헤르체고비나 공국, en: Duchy of Saint Sava (Herzegovina), native: Херцеговина }
  from: 1448
  to: 1482
  color: "#6fa0a0"
  summary: 스테판 부크치치 코사차가 '성 사바의 헤르체그(공작)'를 칭한 훔 땅의 공국(블라가이·모스타르·트레비녜·헤르체그노비). 1465~1466년 오스만이 블라가이 등 대부분을 차지하고 1470년 헤르체고비나 산자크를 두었으며, 아들 블라트코가 지키던 헤르체그노비가 1482년 함락되어 끝남
  mapNote: 지도에는 1448~1465년만 표시(1466~1482년 헤르체그노비 쪽 남은 땅은 작아 오스만으로 그린 근사)
  endNote: 1465~1466년 오스만이 블라가이 등 대부분을 차지하고 1470년 헤르체고비나 산자크를 두었으며, 아들 블라트코가 지키던 헤르체그노비가 1482년 함락되어 끝남
  features:
    - 스테판 부크치치 코사차는 보스니아 대공이자 훔 땅의 영주로 아드리아해 연안에 이르는 영지를 키움
    - 헤르체그 칭호를 쓴 이듬해부터 성 사바의 유골을 모신 밀레셰바 수도원을 내세워 '성 사바의 헤르체그'라 칭함(해는 자료마다 조금 다름)
    - 이 칭호(독일어 헤르초크에서 유래)에서 헤르체고비나라는 이름이 나옴
    - 형식으로는 보스니아 왕의 신하였으나 자주 독립에 가까웠고 오스만과 가톨릭 군주들 사이에서 줄타기를 함
  startEvents: [herzegovina-1448]
  endEvents: [rhodes-otranto-1480]
  basis:
    type: primary_source
    refs: ["헤르체고비나 산자크 설치(1470)"]
    foundingNote: 스테판이 헤르체그 칭호를 쓴 1448년을 시작으로 봄

- id: albanian-league
  level: polity
  names: { ko: 레저 동맹 (스칸데르베그의 알바니아), en: League of Lezhë, native: Lidhja e Lezhës }
  from: 1444
  to: 1479
  color: "#5a7fb0"
  summary: 스칸데르베그(게르기 카스트리오티)가 이끈 알바니아 귀족들의 동맹(크루여·디바르·마트). 오스만의 여러 차례 크루여 포위를 물리쳤으나 1468년 그가 죽은 뒤 크루여는 베네치아 수비대가 지켰고, 1478년 함락되어 1479년 콘스탄티노폴리스 조약으로 베네치아의 슈코드라와 함께 오스만 땅이 됨
  mapNote: 지도에는 1444~1478년 알바니아 중북부(크루여가 있는 두러스주·디바르·쿠커스·엘바산·레저)로 대략 표시(베네치아의 두러스·레즈허 시가지는 근사)
  endNote: 1468년 스칸데르베그가 죽은 뒤 베네치아 수비대에 기대다 1478년 크루여를 잃고, 1479년 콘스탄티노폴리스 조약으로 베네치아의 슈코드라와 함께 오스만 땅이 됨
  features:
    - 오스만의 장군이던 스칸데르베그가 1443년 11월 니시 근처에서 군대를 이탈해 크루여 성을 얻고 가톨릭으로 돌아감
    - 오스만군을 여러 번 물리쳤고(1444년 6월 토르비올 등) 1450년 무라드 2세가 이끈 크루여 포위도 막아 냄
    - 알바니아 영주들은 서로 의심하고 다투는 일이 잦았음
    - 1451년 가에타 조약으로 나폴리 왕 알폰소 5세의 신하로서 원조를 받기로 함
  startEvents: [skanderbeg-1443]
  endEvents: [venice-ottoman-war-1463]
  basis:
    type: primary_source
    refs: ["레저 회의(1444)", "콘스탄티노폴리스 조약(1479)"]
    foundingNote: 레저 회의가 열린 1444년을 시작으로 봄

- id: karaman-beylik
  level: polity
  names: { ko: 카라만 베이국, en: Karamanid Beylik, native: Karamanoğulları Beyliği }
  from: 1250
  to: 1487
  color: "#7fa37f"
  summary: 아나톨리아 중남부(코니아·카라만·악사라이·니데·이첼)의 튀르크 베이국으로 오스만과 오래 다툼. 1468년 메흐메트 2세가 코니아·카라만을 차지하고 1474년 이첼의 실리프케가 함락되었으며 남은 세력은 1487년 끝남
  mapNote: 지도에는 1251~1397년(1308년부터 코니아, 1359년부터 메르신)과 1402~1467년(이첼은 1473년)까지 표시(1398~1401년은 바예지트 1세의 병합, 1402년 앙카라 전투 뒤 되살아남)
  endNote: 1468년 메흐메트 2세가 코니아·카라만을 차지하고 1474년 이첼의 실리프케가 함락된 뒤 남은 세력이 1487년 끝나, 오스만이 그 땅에 카라만 에얄레트를 둠
  features:
    - 1277년 맘루크가 몽골·룸 군을 이긴 틈에 메흐메트 베이가 코니아를 잠시 차지하고 투르크어를 공식 언어로 삼았다고 전함
    - 바예지트 1세에게 병합되었다가(1398~1401년) 1402년 앙카라 전투 뒤 되살아남
    - 카라만 가문의 후손들은 맘루크의 보호를 받으며 킬리키아 쪽에서 버팀
  startEvents: [rum-sultanate-1204]
  endEvents: [ottoman-mamluk-1485]
  basis:
    type: primary_source
    refs: ["1468년 메흐메트 2세의 카라만 원정"]
    # 작업 메모: 작업 M3에서 1251년부터로 넓힘 / 작업 M2 / 작업 M1
    foundingNote: 카라만 베이가 자리 잡은 1250년 무렵을 시작으로 봄

- id: candar-beylik
