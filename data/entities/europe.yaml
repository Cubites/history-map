    - 하밀카르 바르카(기원전 237~229)·하스드루발(229~221)·한니발(221~)이 히스파니아 남부·동부를 차지함(카르타고 노바 227)
    - 기원전 218~201년 한니발이 이탈리아로 쳐들어간 제2차 포에니 전쟁에서 져 히스파니아(206)를 잃음
