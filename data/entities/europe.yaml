  endNote: 1268년 5월 18일 맘루크의 술탄 바이바르스가 안티오크를 함락해 끝남. 바이바르스는 주민이 대부분 죽거나 포로가 되었다고 자랑했으나 숫자는 선전의 과장으로 봄
  features:
