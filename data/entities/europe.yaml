- id: duchy-of-athens
  level: polity
  names: { ko: 아테네 공국, en: Duchy of Athens, native: Ducatus Athenarum }
  from: 1205
  to: 1458
  color: "#90d0e0"
  summary: 제4차 십자군 뒤 드 라 로슈 가문이 세운 라틴 공국(아티카·보이오티아). 1205년 오통 드 라 로슈가 영주가 되며 시작됨. 1311년 할미로스 전투에서 카탈루냐 용병단이 고티에 5세를 죽이고 차지했고, 1388년 피렌체 출신 네리오 아차이우올리가 차지함. 1394년 바예지트 1세가 살로나·네오파트라스를 빼앗았고, 1456년 오스만이 아테네를, 1458년 아크로폴리스를 차지해 무너짐
  details: 1311년 할미로스(케피소스) 전투에서 카탈루냐 용병단이 브리엔의 고티에 5세를 죽이고 차지해 시칠리아 왕의 아들들(1312~1355)·시칠리아 왕(1355~1377)·아라곤 왕(1379~1388)을 공작으로 받들었고 1319년 네오파트라스 공국을 더함. 1388년 피렌체 출신 네리오 아차이우올리가 차지했고, 1394년 바예지트 1세가 살로나·네오파트라스를 빼앗고, 네리오의 유언으로 테베·리바디아는 서자 안토니오 1세가, 아테네는 1395~1402년 베네치아가 다스림. 안토니오가 1402~1403년 아테네를 되찾아 1405년 베네치아의 인정을 받았고 오스만에 공물을 바침. 1456년 오스만이 아테네를, 1458년 아크로폴리스를 차지(테베는 1460년까지 프랑코 아차이우올리가 술탄에게 받아 다스림)
  mapNote: 오통 드 라 로슈가 영주가 된 1205년을 시작으로 봄. 1456년 아테네 함락으로 공국이 무너진 뒤는 오스만(테베의 프랑코는 술탄의 봉신이라 오스만 땅). 왕이 공작을 겸한 시기(1355~1388)도 동군 연합처럼 따로 그림. 지도에는 1205~1393년 중부 그리스(보이오티아·포키스·프티오티스, 에우보이아는 근사)와 1300~1394년 아티카를 표시. 1394~1455년 보이오티아(테베·리바디아)와 1405~1455년 아티카도 표시(1395~1404년 아티카는 베네치아)
  endNote: 1456년 오스만이 아테네를, 1458년 아크로폴리스를 차지해 공국이 무너짐. 테베는 1460년까지 프랑코 아차이우올리가 술탄에게 받아 다스림
  features:
