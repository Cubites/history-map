- id: imereti
  level: polity
  names: { ko: 이메레티 왕국과 서조지아 공국들 (묶음), en: Imereti and the western Georgian principalities (grouped), native: იმერეთის სამეფო }
  from: 1490
  to: 1810
  color: "#c06fe0"
  summary: 1490년 조지아 왕국이 나뉠 때 쿠타이시를 중심으로 선 이메레티 왕국과, 그 아래에서 사실상 따로 다스린 메그렐리아(오디시, 다디아니 가문)·구리아(구리엘리 가문)·압하지야(샤르바시제 가문)·스바네티 공국을 묶은 항목. 1555년 아마시아 조약으로 오스만의 세력권이 되어 공물을 바침. 메그렐리아(1803)·이메레티(1804 보호국, 1810 병합)·구리아(1810 보호국)·압하지야(1810 보호국)가 차례로 러시아에 들어감
  mapNote: 1490년 왕실 회의의 분할을 시작으로 봄. 삼츠헤는 1490~1589년 비우고 아자리아와 함께 1590년부터 오스만. 지도에는 1490~1809년 이메레티·라차-레치후미·메그렐리아·구리아·압하지야(1490~1589년 구리아의 아자리아 포함)를 표시하고 1810년(이메레티 병합, 1803~1810년 보호국·병합을 묶음)부터 러시아 땅
  endNote: 1810년 러시아가 솔로몬 2세를 폐위하고 이메레티를 병합했고, 구리아와 압하지야도 러시아의 보호 아래 들어감
  features:
    - 1555년 아마시아 조약으로 오스만의 세력권이 되어 공물을 바침
    - 러시아는 1803년 메그렐리아를 보호 아래 두고 1804년 엘라즈나우리 조약으로 이메레티 왕 솔로몬 2세를 신하로 삼음
  startEvents: [georgia-split-1463]
  endEvents: [russian-georgia-1800]
