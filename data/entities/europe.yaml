- id: macedonia-republic
  level: polity
  names: { ko: 마케도니아 공화국, en: Republic of Macedonia, native: Република Македонија }
  from: 1991
  to: 2019
  color: "#e3b06b"
  summary: 1991년 9월 국민 투표로 유고슬라비아에서 독립함(유고슬라비아군은 1992년 3월 싸우지 않고 물러남). 나라 이름을 두고 그리스와 다퉈 1993년 '마케도니아 구 유고슬라비아 공화국'이라는 이름으로 유엔에 가입함. 2001년 알바니아계와의 무력 충돌 뒤 오흐리드 협정을 맺음. 2019년 프레스파 협정으로 북마케도니아로 이름을 바꿈
  mapNote: 국민 투표를 한 1991년 9월 8일을 시작으로 봄. 영토는 1992년부터(1991년 지도는 유고슬라비아)
  endNote: 2019년 2월 프레스파 협정이 발효되어 나라 이름을 북마케도니아로 바꿈
  features:
    - 나라 이름을 두고 그리스와 다퉈 1993년 '마케도니아 구 유고슬라비아 공화국'이라는 이름으로 유엔에 가입함
    - 2001년 알바니아계와의 무력 충돌 뒤 오흐리드 협정을 맺음
    - 그리스의 반대로 나토 가입(2008)과 유럽 연합 가입 협상이 막힘
  startEvents: [yugoslav-wars-1991]
  endEvents: [prespa-agreement-2019]
  basis:
    type: primary_source
    refs: ["마케도니아 독립 국민 투표(1991)", "유엔 안전 보장 이사회 결의 817호(1993)", "오흐리드 협정(2001)", "프레스파 협정(2018)"]
    foundingNote: 국민 투표를 한 1991년 9월 8일을 시작으로 봄

- id: north-macedonia
  level: polity
  names: { ko: 북마케도니아, en: North Macedonia, native: Северна Македонија }
  from: 2019
  to: null
  color: "#e3b06b"
  summary: 2019년 2월 프레스파 협정이 발효되어 마케도니아 공화국이 바꾼 이름. 그리스의 반대가 풀려 2020년 북대서양 조약 기구(NATO)에 가입함
  features:
    - 그리스의 반대가 풀려 2020년 3월 북대서양 조약 기구(NATO)에 가입함
    - 유럽 연합 가입 협상은 2022년 시작되었으나 불가리아의 요구로 붙은 개헌 조건 때문에 본격적인 협상 분야가 열리지 않음
  startEvents: [prespa-agreement-2019]
  basis:
    type: primary_source
    refs: ["프레스파 협정(2018)"]
    foundingNote: 마케도니아 공화국이 2019년 이름만 바꾼 같은 나라임

- id: fr-yugoslavia
  level: polity
  names: { ko: 유고슬라비아 연방 공화국, en: Federal Republic of Yugoslavia, native: Савезна Република Југославија }
  from: 1992
  to: 2003
  color: "#b8706d"
  summary: 1992년 4월 세르비아와 몬테네그로가 세운 나라. 옛 유고슬라비아를 이어받았다고 주장했으나 인정받지 못하고 보스니아 내전 개입으로 유엔 제재를 받음. 밀로셰비치 정권 아래 1998~1999년 코소보 전쟁을 벌였고 나토 공습 뒤 1999년 6월부터 코소보는 유엔이 다스림(지도는 따로 표시). 2000년 밀로셰비치가 물러났고 2003년 세르비아 몬테네그로로 바뀜
  endNote: 2003년 2월 4일 헌법 헌장이 발효되어 유고슬라비아 연방 공화국이 사라지고 국가 연합 '세르비아 몬테네그로'가 됨
  features:
    - 옛 유고슬라비아를 이어받았다고 주장했으나 인정받지 못하고 보스니아 내전 개입으로 유엔 제재를 받음
    - 밀로셰비치 정권 아래 1998~1999년 코소보 전쟁을 벌였고 나토가 1999년 3월 24일부터 78일 동안 공습함
    - 나토 공습 뒤 1999년 6월부터 코소보는 유엔이 다스림
    - 2000년 선거에 진 밀로셰비치가 물러남
  startEvents: [yugoslav-wars-1991]
  endEvents: [montenegro-independence-2006]
  basis:
    type: primary_source
    refs: ["유고슬라비아 연방 공화국 헌법(1992)", "유엔 안전 보장 이사회 결의 757호(1992)", "유엔 안전 보장 이사회 결의 1244호(1999)"]
    foundingNote: 헌법을 채택한 1992년 4월 27일을 시작으로 봄

- id: serbia-montenegro
  level: polity
  names: { ko: 세르비아 몬테네그로, en: Serbia and Montenegro, native: Србија и Црна Гора }
  from: 2003
  to: 2006
  color: "#b8706d"
  summary: 2003년 2월 유고슬라비아 연방 공화국이 헌법 헌장으로 바꾼 느슨한 국가 연합. 2006년 5월 몬테네그로가 국민 투표로 독립해 해체되었고 세르비아가 법적 지위를 이어 감
  endNote: 2006년 5월 21일 몬테네그로 국민 투표에서 독립 찬성이 55.5%로 나왔고 6월 3일 몬테네그로 의회가 독립을 선언해 해체됨. 세르비아는 6월 5일 국가 연합의 국제법상 지위를 이어받는다고 밝힘
  features:
    - 유럽 연합의 중재로 2002년 맺은 베오그라드 합의에서 나옴
    - 두 공화국이 통화(몬테네그로는 독일 마르크에 이어 유로, 세르비아는 디나르)와 경제 정책을 따로 운영함
    - 공동 시장과 관세·무역 정책의 조화가 목표였으나 실제로는 더뎠음
    - 3년이 지나면 어느 한쪽이 국민 투표로 떠날 수 있게 함
  startEvents: [montenegro-independence-2006]
  endEvents: [montenegro-independence-2006]
  basis:
    type: primary_source
    refs: ["세르비아 몬테네그로 헌법 헌장(2003)", "몬테네그로 독립 국민 투표(2006)"]
    foundingNote: 유고슬라비아 연방 공화국이 이름과 체제를 바꾼 같은 나라

- id: serbia-republic
  level: polity
  names: { ko: 세르비아, en: Serbia, native: Србија }
  from: 2006
  to: null
  color: "#b8706d"
  summary: 2006년 6월 몬테네그로가 독립하자 세르비아 몬테네그로의 법적 지위를 이어받은 공화국(1817~1918년의 세르비아 공국·왕국과는 다른 항목). 2008년 코소보의 독립 선언을 인정하지 않음(지도는 코소보를 귀속 논쟁 지역으로 표시)
  features:
    - 2006년 6월 몬테네그로와 서로를 승인함
    - 2008년 2월 17일 코소보 의회가 독립을 선언했으나 세르비아는 자기 영토의 일부라며 인정하지 않음
    - 2013년 4월 유럽 연합의 중재로 코소보와 브뤼셀 합의를 맺었으나 서로의 지위에 대한 입장은 바뀌지 않음
  startEvents: [montenegro-independence-2006]
  basis:
    type: primary_source
    refs: ["세르비아 헌법(2006)", "유엔 안전 보장 이사회 결의 1244호(1999)"]
    foundingNote: 몬테네그로의 독립 선언(2006년 6월 3일) 뒤 세르비아 몬테네그로를 이어받은 2006년 6월 5일을 시작으로 봄

- id: montenegro-republic
  level: polity
  names: { ko: 몬테네그로, en: Montenegro, native: Црна Гора }
  from: 2006
  to: null
  color: "#8b6f9c"
  summary: 2006년 5월 국민 투표(찬성 55.5%)로 세르비아 몬테네그로에서 독립함. 1918년 세르비아에 합쳐진 몬테네그로 왕국(별도 항목) 뒤 88년 만의 독립. 2017년 북대서양 조약 기구(NATO)에 가입함
  features:
    - 1918년 세르비아에 합쳐진 몬테네그로 왕국(별도 항목) 뒤 88년 만의 독립임
    - 국민 투표의 독립 찬성은 유럽 연합이 정한 기준(찬성 55%)을 조금 넘음
    - 세르비아와 서로를 승인했고 6월 유엔에 가입함
    - 2017년 북대서양 조약 기구(NATO)에 가입함
