  to: 1946
  color: "#78a67e"
  summary: 1861년 사르데냐 왕 비토리오 에마누엘레 2세를 왕으로 선포한 통일 국가. 1866년 베네치아, 1870년 로마를 합쳐 통일을 마무리했으나 트렌티노·트리에스테('미회수 이탈리아')는 오스트리아-헝가리에 남음. 1912년 이탈리아-튀르크 전쟁으로 리비아를 얻고 도데카니사 제도를 점령함(도데카니사는 1923년 로잔 조약으로 이탈리아 영토). 1915년 협상국 편으로 1차 대전에 참전해 남티롤·트렌티노·트리에스테·이스트리아를 얻음(생제르맹 조약, 라팔로 조약). 1922년 무솔리니의 파시스트 정권이 들어서 1924년 피우메를 병합하고 1929년 라테란 조약을 맺었으며 1936년 에티오피아를 정복하고 1939년 알바니아를 병합함. 1940년 독일 편으로 2차 대전에 참전해 1941년 류블랴나를 병합했으나 1943년 9월 항복해 북부는 독일에 점령됨. 1946년 국민 투표로 공화국이 됨(이탈리아 공화국 항목)
  basis:
    type: primary_source
