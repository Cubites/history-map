    refs: ["헤로도토스, 『역사』 1.94·4.99·7.170", "투키디데스, 『펠로폰네소스 전쟁사』 6.2", "리비우스, 『로마 건국사』 4~10권", "폴리비오스, 『역사』 1.7~8"]
