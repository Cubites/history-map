    type: primary_source
    refs: ["2차 폴란드 분할 조약(1793)", "틸지트 조약(1807)", "빈 회의 최종 의정서(1815)", "프라하 조약(1866)"]
    foundingNote: 프리드리히 1세가 왕위에 오른 1701년을 왕국의 시작으로 봄

- id: german-states
  level: polity
  names: { ko: 독일 연방 국가들 (묶음), en: States of the German Confederation (grouped) }
  from: 1814
  to: 1866
  color: "#a8b48e"
  summary: 빈 회의(1815)로 만든 독일 연방(39개국) 가운데 프로이센·오스트리아·덴마크령 홀슈타인·라우엔부르크·룩셈부르크를 뺀 나라들을 묶은 항목. 바이에른·작센·하노버·뷔르템베르크·바덴·헤센 등 왕국·공국과 함부르크·브레멘·프랑크푸르트 같은 자유시가 들어 있음. 1866년 프로이센-오스트리아 전쟁으로 독일 연방이 해체되며 북독일 연방과 남독일 국가들로 나뉨
  mapNote: 1814년(라인 동맹이 무너진 뒤 빈 회의 전)의 독일 나라들도 이 항목으로 표시
  endNote: 1866년 프로이센-오스트리아 전쟁으로 독일 연방이 해체되며 북독일 연방과 남독일 국가들로 나뉨
  features:
    - 바이에른·작센·하노버·뷔르템베르크·바덴·헤센 등 왕국·공국이 들어 있음
    - 함부르크·브레멘·프랑크푸르트 같은 자유시도 들어 있음
  startEvents: [congress-of-vienna-1814]
  endEvents: [prussia-wars-1864]
  basis:
    type: primary_source
    refs: ["파리 조약(1814)", "빈 회의 최종 의정서(1815)", "독일 연방 규약(1815)"]
    foundingNote: 라인 동맹이 무너진 뒤 9월 빈 회의가 열린 1814년부터

- id: north-german-confederation
  level: polity
  names: { ko: 북독일 연방, en: North German Confederation, native: Norddeutscher Bund }
  from: 1866
  to: 1870
  color: "#5f6f8f"
  summary: 프로이센-오스트리아 전쟁(1866) 뒤 하노버·헤센카셀·나사우·프랑크푸르트·슐레스비히홀슈타인을 합친 프로이센이 마인강 북쪽 나라들과 만든 연방 국가. 1867년 헌법을 시행했고 1871년 남독일 국가들이 합류해 독일 제국이 됨
  endNote: 프로이센-프랑스 전쟁 중 1870년 11월 남독일 네 나라가 북독일 연방과 조약을 맺어 합류했고, 이듬해 1월 18일 베르사유 궁전에서 독일 제국이 선포됨
  features:
    - 연방의 우두머리는 프로이센 왕 빌헬름 1세, 연방 재상은 비스마르크였음
    - 각 나라 대표로 이루어진 연방 참의원과 보통 선거로 뽑는 연방 의회(라이히스타크)를 둠
    - 마인강 남쪽의 바이에른·뷔르템베르크·바덴·헤센 대공국 남부는 독립을 지켰으나 프로이센과 비밀 군사 동맹을 맺음
    - 나폴레옹 3세가 룩셈부르크를 사들이려 해 프랑스와 전쟁 직전까지 갔고(1867), 런던 조약으로 룩셈부르크는 영세 중립국이 됨
  startEvents: [prussia-wars-1864, north-german-confederation-1867]
  endEvents: [franco-prussian-war-1870]
  basis:
    type: primary_source
    refs: ["프라하 조약(1866)", "북독일 연방 헌법(1867)"]
    foundingNote: 1866년 8월 동맹 조약을 시작으로 봄. 연방 헌법은 1867년 7월에 시행됨

- id: south-german-states
  level: polity
  names: { ko: 남독일 국가들 (묶음), en: South German states (grouped) }
  from: 1866
  to: 1870
  color: "#a8b48e"
  summary: 1866년 북독일 연방에 들지 않은 마인강 남쪽의 바이에른·뷔르템베르크·바덴·헤센 대공국 남부를 묶은 항목. 프로이센과 비밀 군사 동맹을 맺었고 프로이센-프랑스 전쟁 중 1871년 독일 제국에 합류함
  endNote: 프로이센-프랑스 전쟁 중 1870년 11월 북독일 연방과 조약을 맺고 1871년 1월 독일 제국이 선포되며 그 안에 들어감
  features:
    - 1866년 프로이센과 비밀 군사 동맹을 맺음
    - 관세 동맹 의회(1868)로 경제적으로도 묶임
    - 프로이센-프랑스 전쟁(1870)에서 프로이센 편에 섬
  startEvents: [north-german-confederation-1867]
  endEvents: [franco-prussian-war-1870]
  basis:
    type: primary_source
    refs: ["프라하 조약(1866)"]
    foundingNote: 독일 연방이 해체되며 북독일 연방에 들지 않은 마인강 남쪽 나라들로 남은 1866년부터

- id: german-empire
  level: polity
  names: { ko: 독일 제국, en: German Empire, native: Deutsches Kaiserreich }
  from: 1871
  to: 1918
  color: "#5f6f8f"
  summary: 프로이센-프랑스 전쟁 중 1871년 1월 베르사유 궁전에서 선포된 제국. 프랑크푸르트 조약으로 알자스와 로렌 북부를 얻음. 프로이센 왕이 황제를 겸하고 비스마르크가 동맹 체제를 짰으나 빌헬름 2세의 세계 정책으로 영국과 맞섬. 1차 대전에서 져 1918년 제정이 무너짐
  endNote: 1차 대전에서 진 끝에 1918년 11월 혁명으로 제정이 무너짐. 11월 9일 막스 폰 바덴 총리가 황제의 퇴위를 발표하고 에베르트에게 정부를 넘겼으며 샤이데만이 공화국을 선포했고, 빌헬름 2세는 11월 28일 퇴위서에 서명함
  features:
    - 프로이센 왕이 황제를 겸했고, 제국 의회는 남성 보통 선거로 뽑았으나 실권은 황제와 재상에게 있었음
    - 프랑크푸르트 조약(1871년 5월)으로 프랑스에게서 알자스와 로렌 북부를 얻고 배상금 50억 프랑을 물림
    - 재상 비스마르크는 가톨릭 세력을 누르는 문화 투쟁을 벌이고 사회주의자 탄압법(1878)으로 사회 민주당을 억누름
    - 노동자를 끌어안으려 질병·재해·노령 보험(1883~1889)을 처음으로 만듦
    - 비스마르크가 동맹 체제를 짰으나 빌헬름 2세의 세계 정책으로 영국과 맞섬
  startEvents: [franco-prussian-war-1870, german-empire-1871]
  endEvents: [armistice-1918]
  basis:
    type: primary_source
    refs: ["독일 제국 헌법(1871)", "프랑크푸르트 조약(1871)"]
    foundingNote: 프로이센 왕 빌헬름 1세가 베르사유 궁전에서 독일 황제로 즉위해 제국이 세워진 1871년을 시작으로 봄

# 오스트리아
- id: austria
  level: polity
  names: { ko: 오스트리아 제국, en: Austrian Empire, native: Kaisertum Österreich }
  from: 1804
  to: 1867
  color: "#d6bd6e"
  summary: 합스부르크 왕가가 1804년 세운 제국. 프레스부르크 조약(1805)으로 베네치아·티롤을, 쇤브룬 조약(1809)으로 일리리아·잘츠부르크·서갈리치아를 잃었다가 1813~1814년 대부분 되찾음. 메테르니히가 빈 회의(1815)를 이끌고 롬바르디아·베네치아를 얻어 직접 지배하며 중부 이탈리아 공국들에도 영향력을 미침. 1848년 혁명을 누르고 1859년 롬바르디아, 1866년 베네치아를 잃었으며 프로이센에 져 독일 연방에서 밀려남. 1867년 헝가리와 타협해 오스트리아-헝가리 제국이 됨
  mapNote: 1864~1866년 홀슈타인은 가슈타인 협약에 따라 오스트리아가 관리한 땅으로 표시
  endNote: 이탈리아(1859)와 프로이센(1866)에 잇달아 진 끝에 1867년 헝가리와 대타협을 맺어, 황제 프란츠 요제프가 헝가리 왕을 겸하는 오스트리아-헝가리 제국이 됨
  features:
    - 프레스부르크 조약(1805)으로 베네치아·티롤을, 쇤브룬 조약(1809)으로 잘츠부르크 등을 잃었다가 1813~1814년 대부분 되찾음
    - 메테르니히가 빈 회의(1815)를 이끌고 롬바르디아·베네치아를 얻어 직접 지배하며 중부 이탈리아 공국들에도 영향력을 미침
    - 1848년 혁명을 누르고, 1859년 롬바르디아와 1866년 베네치아를 잃음
    - 1866년 프로이센에 져 독일 연방에서 밀려남
  startEvents: [napoleon-consulate-1799]
  endEvents: [ausgleich-1867]
  basis:
    type: primary_source
    refs: ["프레스부르크 조약(1805)", "쇤브룬 조약(1809)", "빈 회의 최종 의정서(1815)", "취리히 조약(1859)", "프라하 조약(1866)"]
    foundingNote: 프란츠 2세가 오스트리아 황제를 칭한 1804년을 시작으로 봄

- id: austria-hungary
  level: polity
  names: { ko: 오스트리아-헝가리 제국, en: Austria-Hungary, native: Österreich-Ungarn }
  from: 1867
  to: 1918
  color: "#d6bd6e"
  summary: 1867년 대타협으로 오스트리아 황제가 헝가리 왕을 겸한 이중 제국. 베를린 조약(1878)으로 보스니아 헤르체고비나를 점령하고 1908년 병합해 세르비아와 갈등이 커짐. 1914년 사라예보 사건이 1차 대전으로 이어졌고 1918년 해체됨
  endNote: 1918년 패전이 다가오자 안의 민족들이 잇달아 독립을 선언해 해체됨. 10월 28일 체코슬로바키아가 독립을 선언했고, 11월 11일 황제 카를 1세가 국정에서 물러난 이튿날 오스트리아 공화국이 선포되었으며 헝가리도 따로 공화국이 됨
  features:
    - 헝가리는 안드라시를 총리로 한 자기 정부와 의회를 갖고, 외교·군사와 그 재정만 공동 부처가 맡음
    - 관세와 분담금 같은 경제 조건은 10년마다 다시 협상했고, 오스트리아 쪽은 12월 헌법으로 기본권과 의회 제도를 갖춤
    - 독일인과 마자르인이 나머지 민족을 다스리는 틀이어서 체코인이 반발했고, 크로아티아는 1868년 헝가리와 따로 타협해 제한된 자치를 얻음
    - 베를린 조약(1878)으로 보스니아 헤르체고비나를 점령하고 1908년 병합해 세르비아와 갈등이 커짐
    - 1914년 사라예보 사건으로 황위 계승자 프란츠 페르디난트 부부가 암살된 뒤 세르비아에 선전 포고해(7월 28일) 1차 대전으로 이어짐
  startEvents: [ausgleich-1867]
  endEvents: [austria-hungary-dissolution-1918]
  basis:
    type: primary_source
    refs: ["오스트리아-헝가리 대타협(1867)", "베를린 조약(1878)"]
    foundingNote: 오스트리아와 헝가리가 대타협(아우스글라이히)을 맺은 1867년을 시작으로 봄

- id: bosnia-occupied
  level: region
  names: { ko: 보스니아 헤르체고비나 (오스트리아-헝가리 점령지), en: Bosnia and Herzegovina (Austro-Hungarian occupation) }
  from: 1878
  to: 1908
  color: "#b5845a"
  summary: 베를린 조약(1878)으로 오스트리아-헝가리가 점령해 다스린 오스만 제국의 땅. 주권은 오스만에 남았으나 1908년 10월 오스트리아-헝가리가 병합해 보스니아 위기를 일으킴
  endNote: 1908년 10월 오스트리아-헝가리가 30년 동안 점령·통치해 온 이 땅을 병합해 보스니아 위기를 일으킴. 같은 해 7월 오스만 제국에서 청년 튀르크당이 혁명을 일으킨 혼란을 틈탄 것이었음
  startEvents: [congress-of-berlin-1878]
  endEvents: [bosnian-crisis-1908]
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)"]
    foundingNote: 베를린 조약으로 오스트리아-헝가리가 점령·통치할 권리를 얻은 1878년부터

- id: krakow
  level: polity
  names: { ko: 크라쿠프 자유시, en: Free City of Kraków, native: Wolne Miasto Kraków }
  from: 1815
  to: 1846
  color: "#b39ad0"
  summary: 빈 회의(1815)로 러시아·프로이센·오스트리아의 보호 아래 세운 작은 공화국. 1846년 크라쿠프 봉기 뒤 오스트리아에 병합됨
  endNote: 1846년 크라쿠프 봉기가 진압된 뒤 오스트리아가 이를 구실로 11월 러시아·프로이센의 동의를 얻어 병합해 갈리치아 왕국에 넣음
  features:
    - 분할된 폴란드 땅 가운데 폴란드인이 자치 의회와 대학을 지킬 수 있던 곳이었음
    - 1830~1831년 폴란드 봉기가 꺾인 뒤에도 폴란드 독립 운동가들의 거점이 됨
  startEvents: [congress-of-vienna-1814]
  endEvents: [krakow-uprising-1846]
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)"]
    foundingNote: 빈 회의가 크라쿠프를 러시아·프로이센·오스트리아의 보호를 받는 자유시로 정한 1815년을 시작으로 봄

# 이탈리아
- id: sardinia
  level: polity
  names: { ko: 사르데냐 왕국, en: Kingdom of Sardinia, native: Regno di Sardegna }
  from: 1720
  to: 1860
  color: "#58a070"
  summary: 사보이아 왕가가 피에몬테·사보이아·니스·제노바와 사르데냐섬을 다스린 왕국. 1792~1793년 사보이아·니스를, 1798~1801년 피에몬테를 프랑스에 빼앗겨 1814년까지 사르데냐섬만 다스렸고 1815년 빈 회의로 제노바를 얻음. 카보우르가 크림 전쟁에 참전하고 프랑스와 손잡아 1859년 오스트리아를 이겨 롬바르디아를 얻음. 1860년 사보이아·니스를 프랑스에 넘기는 대신 중부 이탈리아를 합치고 가리발디가 정복한 남부를 받아들임. 1861년 이탈리아 왕국이 됨
  endNote: 1860년 사보이아·니스를 프랑스에 넘기는 대신 중부 이탈리아를 합치고 가리발디가 정복한 남부를 받아들였으며, 이듬해 1861년 이탈리아 왕국이 됨
  features:
