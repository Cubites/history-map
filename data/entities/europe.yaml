  mapNote: 부레비스타의 즉위(기원전 82년)를 시작으로 봄. 기원후 89~105년 로마의 종속, 102~105년 로마군의 주둔은 그리지 않음. 지도에는 기원전 82~기원후 105년 트란실바니아·올테니아·바나트 산지를 표시하고, 기원전 60~45년 부레비스타가 넓힌 무테니아·몰다비아·도브루자·불가리아 북동부·크리샤나·마라무레시도 그림(기원전 44년 그가 죽은 뒤 나뉨). 기원전 27년부터는 요르다네스가 적은 왕의 계보(데케네우스·코모시쿠스·코릴루스·두라스·데케발루스)를 따라 한 왕국으로 그림(트라키아 묶음 대신 따로, 마라무레시 빼고)
  endNote: 데케발루스가 101~102·105~106년 트라야누스에게 져 106년 다키아 속주가 됨
