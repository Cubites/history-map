# 북유럽
- id: denmark-norway
  level: polity
  names: { ko: 덴마크-노르웨이, en: Denmark–Norway, native: Danmark-Norge }
  from: 1524
  to: 1814
  color: "#c4685c"
  summary: 덴마크 왕이 노르웨이 왕을 겸하고 아이슬란드·페로 제도와 슐레스비히·홀슈타인 공국을 함께 다스린 연합 왕국. 브룀세브로 조약(1645)으로 고틀란드·외셀·옘틀란드·헤리에달렌·할란드를, 로스킬레 조약(1658)으로 스코네·블레킹에·보후슬렌을 스웨덴에 넘김(트뢴델라그·보른홀름은 1660년 코펜하겐 조약으로 되찾음). 1807년 영국에 코펜하겐을 포격당하고 함대를 빼앗긴 뒤 프랑스와 동맹함. 1814년 1월 킬 조약으로 노르웨이를 스웨덴에 넘김
  basis:
    type: primary_source
    refs: ["킬 조약(1814)"]
    foundingNote: 칼마르 동맹에서 스웨덴이 떨어져 나간 뒤 덴마크 왕이 노르웨이를 계속 다스린 1524년을 시작으로 봄. 지도에는 1524년 이후만 표시하고(1453~1523년은 칼마르 동맹 항목, 같은 색) 1814년부터는 덴마크·스웨덴-노르웨이 항목

- id: sweden-kingdom
  level: polity
  names: { ko: 스웨덴 왕국, en: Kingdom of Sweden, native: Konungariket Sverige }
  from: 1523
  to: 1814
  color: "#6f96c4"
  summary: 스웨덴 본토와 핀란드, 독일 북부의 스웨덴령 포메른을 다스린 왕국. 스톨보보 조약(1617)으로 잉그리아·케크스홀름을, 알트마르크 휴전(1629)으로 리보니아를, 브룀세브로 조약(1645)으로 고틀란드·외셀·옘틀란드·할란드를, 베스트팔렌 조약(1648)으로 포메른·브레멘-페르덴을, 로스킬레 조약(1658)으로 스코네·블레킹에·보후슬렌을 얻어 발트해의 강국이 됨(구스타브 2세 아돌프는 30년 전쟁에 개입함). 카를 12세가 대북방 전쟁(1700~1721)에서 러시아에 져(1709년 폴타바 전투) 스톡홀름 조약(1719·1720)으로 브레멘-페르덴·슈테틴을, 뉘스타드 조약(1721)으로 리보니아·에스토니아·잉그리아·카렐리야 일부를 잃었고, 오보 조약(1743)으로 핀란드 동남부를 러시아에 넘김. 1808~1809년 러시아와의 전쟁에 져 프레드릭스함 조약(1809)으로 핀란드를 잃었고, 1810년 프랑스 원수 베르나도트를 왕위 계승자로 맞음. 1814년 킬 조약으로 노르웨이를 얻어 스웨덴-노르웨이 연합 왕국이 됨
  basis:
