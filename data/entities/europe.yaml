  summary: 호엔촐레른 왕가의 왕국. 프리드리히 빌헬름 1세가 군대를 키우고, 프리드리히 2세(대왕)가 오스트리아 왕위 계승 전쟁으로 슐레지엔을 차지해(1742) 7년 전쟁(1756~1763)에서 지켜 냄. 폴란드 분할(1772·1793·1795)로 바르샤바까지 차지했으나 1806년 예나 전투에 져 틸지트 조약(1807)으로 엘베강 서쪽과 폴란드 분할 땅을 잃음. 빈 회의(1815)로 라인란트·베스트팔렌을 얻어 영토가 동서로 나뉨. 1834년 관세 동맹을 이끌고, 비스마르크의 철혈 정책으로 덴마크(1864)·오스트리아(1866)를 이겨 북독일 연방을 만들고 1871년 독일 제국을 세움
  mapNote: 지도에는 1866년까지만 따로 표시하고 그 뒤는 북독일 연방·독일 제국에 포함
  endNote: 1918년 11월 혁명으로 호엔촐레른 왕가의 프로이센 군주정이 무너져 왕국은 자유 주로 바뀌었고, 11월 28일 빌헬름 2세가 황제와 왕의 자리를 모두 내놓는 퇴위서에 서명함. 프로이센은 바이마르 공화국 안에서 가장 큰 주로 남음
