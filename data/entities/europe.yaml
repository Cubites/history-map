  summary: 서유럽의 나라로, 왕국에서 공화국과 제국을 거쳐 지금의 프랑스 공화국에 이름. 987년 카페 왕조가 시작된 뒤 백년 전쟁 끝에 기옌(1453)을 얻었고, 나폴레옹 전쟁 중 1810~1812년 가장 넓었다가 1814년 1차 파리 조약으로 1792년 국경으로 돌아감. 2차 대전 중 1940년 6월 독일에 항복했다가 1944년 해방됨
  details: 백년 전쟁 끝에 칼레 밖의 기옌(1453)을 얻고 프로방스(1481), 아라스 조약(1482)으로 부르고뉴 공작령·피카르디를 얻음(아르투아·프랑슈콩테는 1493년 상리스 조약으로 돌려줌). 이탈리아 전쟁 중 나폴리 북부(1501~1503)·밀라노(1504 리옹·블루아 조약~1525)를 얻음. 브르타뉴(1532 합병)·메스·툴·베르됭(1552)·칼레(1558, 지도는 파드칼레 단위로 그려 차이가 보이지 않음)를 얻음. 리옹 조약(1601)으로 브레스, 베스트팔렌 조약(1648)으로 오버엘자스, 피레네 조약(1659)으로 루시용·아르투아, 네이메헌 조약(1678)으로 프랑슈콩테를 얻고 1681년 스트라스부르를 합쳤으며 1684~1697년에는 룩셈부르크를 가짐. 1766년 로렌 공국, 1768년 코르시카를 합침. 혁명 전쟁과 나폴레옹 전쟁으로 벨기에·라인강 왼쪽·피에몬테·네덜란드·북해 연안·로마·일리리아를 합쳐 1810~1812년 가장 넓었다가 1814년 1차 파리 조약으로 1792년 국경으로 돌아감. 1866년 천주교 박해(병인박해)를 구실로 강화도를 침공함(병인양요). 1919년 베르사유 조약으로 알자스-로렌을 되찾음. 2차 대전 중 1940년 6월 독일에 항복해 북부와 대서양 해안은 독일 점령 지구가 되고 남부는 페탱의 비시 정부가 다스렸으며(1942년 11월 남부도 점령) 1944년 해방됨. 1947년 파리 강화 조약으로 탕드·라브리그를 얻음. 6·25 전쟁 때 유엔군으로 참전함
  mapNote: 카페 왕조가 시작된 987년을 프랑스 왕국의 시작으로 봄. 서프랑크가 이름만 바뀌어 이어짐(같은 색). 1536~1559년 사부아·브레스·피에몬테를 점령했으나 1544년 크레피 화약으로 돌려주기로 해 지도에는 그리지 않음. 왕국(~1792)·제1공화국(1792~1804)·제1제국(1804~1814)·복고 왕정(1814~1830)·7월 왕정(1830~1848) 등 정체가 바뀌어도 지도에서는 한 나라로 이어 그림. 지도에는 987년부터 표시하고 1200년부터 필리프 2세의 왕령과 봉토(노르망디·앙주 1204, 푸아투 1224, 랑그도크 1229, 툴루즈 1271, 샹파뉴 1285, 기옌 1294)를 더함. 샹파뉴·툴루즈·브르타뉴·플랑드르는 따로 항목
  features:
