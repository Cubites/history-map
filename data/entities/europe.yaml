- id: thessaly
  level: polity
  names: { ko: 테살리아 (두카스 가문), en: Thessaly (Doukai), native: Θεσσαλία }
  from: 1268
  to: 1333
  color: "#e0a0f0"
  summary: 에피루스의 미하일 2세가 죽은 뒤 아들 요안니스 1세 두카스가 자립한 테살리아(네오파트라스). 1318년 요안니스 2세가 죽어 대가 끊기자 남부(네오파트라스·라미아)는 카탈루냐 용병단의 아테네 공국, 북부는 스테파노스 가브리엘로풀로스 등 영주들과 베네치아가 나눠 가졌고, 1333년 동로마의 안드로니코스 3세가 차지함
  mapNote: 요안니스 1세가 자립한 1268년 무렵을 시작으로 봄. 1359~1393년 시메온 우로시·알렉시오스 앙겔로스의 테살리아는 세르비아 제국·동로마 색(근사). 지도에는 1268~1332년 테살리아 지방을 표시(1318~1332년 영주들의 할거도 이 나라로 그린 근사)
  endNote: 1318년 요안니스 2세가 죽어 대가 끊기자 남부는 카탈루냐 용병단의 아테네 공국이, 북부는 스테파노스 가브리엘로풀로스 등 영주들과 베네치아가 나눠 가짐. 1333년 동로마의 안드로니코스 3세가 차지함
  startEvents: []
  endEvents: [osman-orhan-1302]
