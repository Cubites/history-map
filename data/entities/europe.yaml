- id: taifas-third
  level: polity
  names: { ko: 제3차 타이파 (묶음), en: Third Taifa kingdoms (grouped), native: ملوك الطوائف }
  from: 1228
  to: 1266
  color: "#a0d0f0"
  summary: 알모하드가 물러난 뒤의 알안달루스 군소 왕국들을 묶은 항목. 이븐 후드(무르시아, 1228~1238)가 한때 대부분을 다스렸고, 자이얀 이븐 마르다니시의 발렌시아(1238 아라곤), 이븐 마푸즈의 니에블라(1234~1262), 후드 가문의 무르시아(1243 알카라스 조약으로 카스티야의 봉신, 1266 병합) 등
  mapNote: 여러 타이파 왕국을 묶어 그림. 나스르 왕조의 그라나다(1238)는 따로 항목. 지도에는 1228~1265년 카스티야·아라곤·포르투갈·그라나다에 들기 전의 땅을 표시
  endNote: 후드 가문의 무르시아가 1266년 카스티야에 병합되어 끝남
