# 북유럽
- id: denmark
  level: polity
  names: { ko: 덴마크, en: Denmark, native: Danmark }
  from: 936
  to: null
  color: "#c4685c"
  summary: 1814년 킬 조약으로 노르웨이를 스웨덴에 넘김. 왕이 겸해 다스리던 슐레스비히·홀슈타인·라우엔부르크 공국을 두고 독일과 다투다 1864년 프로이센·오스트리아와의 전쟁에 져 세 공국을 잃음. 지도에는 페로 제도와 1917년까지의 아이슬란드(1918년 동군연합 왕국으로 분리, 아이슬란드 항목)를 포함. 1920년 주민 투표로 북슐레스비히를 되찾음. 1940~1945년 독일이 점령함
  basis:
