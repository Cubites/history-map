    - 스테판 보이슬라브가 1042년 바르 전투에서 동로마를 이겨 자립함
    - 미하일로가 1077년 교황에게 왕관을 받음
    - 보딘(1081~1101) 때 라슈카·보스니아까지 다스렸으나 뒤에 기울어짐
  startEvents: [basil-ii-1000]
  endEvents: [balkan-independence-1166]
  basis:
    type: primary_source
    refs: ["『두클랴 사제의 연대기』", "케카우메노스, 『전략론』"]
    # 작업 메모: (작업 M4) / 불가리아·동로마의 종주는 relations.yaml
    foundingNote: 요반 블라디미르가 다스린 1000년 무렵을 시작으로 봄. 불가리아·동로마의 종주를 받음

- id: raska
  level: polity
  names: { ko: 라슈카 (세르비아 대주판국), en: Raška (Serbian Grand Principality), native: Рашка }
  from: 1091
  to: 1166
  color: "#9f4fd0"
  summary: 라스(노비파자르 둘레)를 중심으로 한 세르비아의 대주판국. 두클랴 왕 보딘이 세운 부칸이 1090년대 동로마에 맞서 자립했고, 그 뒤 브카노비치 가문의 대주판들이 헝가리·동로마 사이에서 버팀(1150 타라강 전투 뒤 마누일 1세의 종주). 1166년 스테판 네마냐가 대주판이 되어 네마니치 왕조의 세르비아가 됨
  mapNote: 지도에는 1091~1165년 라슈카·즐라티보르·슈마디야를 표시하고 1166년부터 세르비아 대공국(이름만 바뀌어 이어짐, 같은 색). 1018~1090년은 동로마 땅으로 그림
  endNote: 1166년 무렵 스테판 네마냐가 형제들을 누르고 대주판이 되어 네마니치 왕조의 세르비아가 됨
  features:
    - 두클랴 왕 보딘이 세운 부칸이 1090년 무렵부터 코소보 일대를 습격하다 1093~1094년 동로마와 화약을 맺음
    - 브카노비치 가문의 대주판들이 헝가리·동로마 사이에서 버팀
    - 1150년 타라강 전투 뒤 마누일 1세의 종주를 받음
  startEvents: []
  endEvents: [balkan-independence-1166]
  basis:
    type: primary_source
