- id: lorraine
  level: polity
  names: { ko: 로렌 공국, en: Duchy of Lorraine, native: Duché de Lorraine }
  from: 959
  to: 1766
  color: "#d0a37a"
  summary: 프랑스와 신성 로마 제국 사이의 공국(바르 공국 포함). 30년 전쟁 중(1634~1661)과 1670~1697년 프랑스에 점령됨(지도에서는 공국으로 표시). 1697년 레이스베이크 조약으로 레오폴트 공작이 되찾았으나 에스파냐 왕위 계승 전쟁 중(1702~1714) 프랑스군이 점령함. 폴란드 왕위 계승 전쟁 뒤 빈 조약(1738)으로 공작 프란츠 슈테판은 토스카나를 받고, 로렌은 루이 15세의 장인 스타니스와프 레슈친스키가 평생 다스린 뒤 1766년 프랑스에 합쳐짐
  mapNote: 지도에는 959년 이후만 표시(1475~1476년 부르고뉴의 점령은 그리지 않음)하고 지금의 뫼르트에모젤·뫼즈·모젤·보주 4개 도로 그림(안의 프랑스령 메스·툴·베르됭 세 주교령(1552)과 티옹빌·몽메디(1659)는 대략적인 네모꼴로 떼어 프랑스로 그림)
  endNote: 1766년 스타니스와프 레슈친스키가 죽자 그의 사위인 프랑스 왕 루이 15세가 로렌과 바르를 이어 프랑스에 합쳐짐
  features:
    - 30년 전쟁 중(1634~1661)과 1670~1697년 프랑스에 점령됨
    - 1697년 레이스베이크 조약으로 레오폴트 공작이 되찾았으나 에스파냐 왕위 계승 전쟁 중(1702~1714) 프랑스군이 점령함
    - 빈 조약(1738)으로 공작 프란츠 슈테판은 토스카나를 받고 로렌은 스타니스와프 레슈친스키가 평생 다스림
  startEvents: [otto-i-empire-936]
  endEvents: [lorraine-corsica-1766]
  basis:
    type: primary_source
    refs: ["레이스베이크 조약(1697)", "빈 조약(1738)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 959년부터로 넓힘 / (상로렌 공국)
    foundingNote: 상로렌 공국이 선 959년을 시작으로 봄

- id: russia-tsardom
  level: polity
  names: { ko: 러시아 차르국, en: Tsardom of Russia, native: Русское царство }
  from: 1547
  to: 1721
  color: "#6f8f6f"
  summary: 모스크바 대공 이반 4세가 차르를 칭하며 시작된 나라. 1547년 대관 뒤 카잔(1552)·아스트라한(1556) 칸국을 합치고 시베리아로 나아감. 혼란 시대(1598~1613) 뒤 로마노프 왕조가 섰고, 표트르 1세가 대북방 전쟁(1700~1721)에서 스웨덴을 이겨 발트해 연안을 얻음. 1721년 표트르가 황제를 칭해 러시아 제국이 됨
  details: 카잔(1552)·아스트라한(1556) 칸국을 합치고 노가이·바시키르를 신속시켰으며 1558년 스트로가노프 가문에 카마강 유역(페름 지방 남부) 개척 특허를 줌. 리보니아 전쟁(1558~1583)에서는 얻은 땅을 내놓음. 예르마크의 원정(1582) 뒤 튜멘(1586)·토볼스크(1587)를 세워 시베리아로 나아감. 혼란 시대(1598~1613) 뒤 로마노프 왕조가 서고 스톨보보 조약(1617)으로 잉그리아·케크스홀름을 스웨덴에, 데울리노 휴전(1618)으로 스몰렌스크·세베르스크를 폴란드에 넘겼으나, 페레야슬라우 회의(1654)로 코사크 헤트만국을 보호 아래 두고 안드루소보 휴전(1667)으로 스몰렌스크·드니프로강 왼쪽 우크라이나·키이우를 얻음. 표트르 1세(재위 1682~1725)가 서유럽식 개혁을 펼치고 대북방 전쟁(1700~1721)에서 스웨덴을 이겨 1703년 상트페테르부르크를 세우고(1712년 수도) 발트해 연안을 얻음. 1721년 뉘스타드 조약 뒤 표트르가 황제를 칭해 러시아 제국이 됨. 시베리아로 나아가 네르친스크 조약(1689)으로 청과 국경을 정했고, 그 앞서 청의 요청으로 조선 조총군이 흑룡강에서 러시아군과 싸움(나선 정벌, 1654·1658)
  mapNote: 이반 4세가 차르로 대관한 1547년을 시작으로 봄. 유럽 밖(시베리아)은 요새를 세운 해에 따라 단계로 넓힌 손 도형의 대략적인 추정(1689년 전 아무르강 유역과 카자흐 초원·중앙아시아는 칠하지 않음). 지도에는 1547년 이후만 표시하고(그전은 모스크바 대공국 항목, 같은 색) 1721년부터는 러시아 제국 항목. 돈 코사크의 땅(로스토프주의 돈강 쪽·도네츠크주 북부·루한스크주와 볼고그라드주 서쪽의 호표르강·메드베디차강·돈강 굽이)은 돈 코사크가 처음 충성 서약한 1671년부터 표시하고 그전은 비움(1570년 이반 4세의 칙서는 봉사 요청으로 봄)
  endNote: 1721년 9월 뉘스타드 조약으로 스웨덴에게서 땅을 얻은 뒤 표트르 1세가 황제를 칭해 러시아 제국이 됨
  features:
    - 카잔(1552)·아스트라한(1556) 칸국을 합치고 노가이·바시키르를 신속시켜 시베리아로 나아감
    - 혼란 시대(1598~1613) 뒤 로마노프 왕조가 섬
    - 안드루소보 휴전(1667)으로 스몰렌스크·드니프로강 왼쪽 우크라이나·키이우를 얻음
    - 네르친스크 조약(1689)으로 청과 국경을 정함
    - 표트르 1세(재위 1682~1725)가 서유럽식 개혁을 펼치고 대북방 전쟁(1700~1721)에서 스웨덴을 이겨 발트해 연안을 얻음
  startEvents: [ivan4-tsar-1547]
  endEvents: [nystad-1721]
  basis:
    type: primary_source
    refs: ["네르친스크 조약(1689)", "뉘스타드 조약(1721)", "『효종실록』"]
    # 작업 메모: 정할 점 J1-① / 세션 J에서 1570 → 1671
    foundingNote: 이반 4세가 차르로 대관한 1547년을 시작으로 봄

- id: crimean-khanate
  level: polity
  names: { ko: 크림 칸국, en: Crimean Khanate, native: Qırım Hanlığı }
  from: 1441
  to: 1783
  color: "#d8b86a"
  summary: 킵차크 칸국에서 갈라져 나온 기레이 왕조의 나라로 1478년부터 오스만 제국의 종주권 아래 크림반도와 흑해 북쪽 노가이 초원(쿠반 포함)을 다스림. 프루트 조약(1711)·아드리아노플 조약(1713)으로 러시아 국경이 사마라강까지 물러난 뒤 1739년 베오그라드 조약까지는 드니프로강 양쪽의 자포로자 코사크 땅(시치는 1711~1734년 칸국 보호 아래 올레시키로 옮김)도 칸국 쪽이었음. 러시아-튀르크 전쟁 뒤 퀴췩카이나르자 조약(1774)으로 오스만에게서 독립했으나 러시아의 간섭을 받았고, 1783년 예카테리나 2세가 병합함
  mapNote: 지도에는 1441년 이후만 표시하고(1475년까지 크림반도 남동 기슭은 제노바의 가자리아, 1484년부터 예디산은 오스만, 1492년부터 부크강 동쪽(오차키우) 들판, 1502년 대오르다가 무너진 뒤 쿠반·스타브로폴 초원), 본토의 노가이 초원은 자포리자주 남부·헤르손주·쿠반강 북쪽·스타브로폴 지방으로 대략 그림
  endNote: 1774년 퀴췩카이나르자 조약으로 오스만에게서 독립했으나 러시아의 간섭을 받다가, 1783년 예카테리나 2세가 병합을 선언해 러시아에 합쳐짐
  features:
    - 1502년 멩글리 기레이가 대오르다의 수도 사라이를 약탈해 대오르다를 무너뜨림
    - 프루트 조약(1711) 뒤 베오그라드 조약(1739)까지 드니프로강 양쪽의 자포로자 코사크 땅도 칸국 쪽이었음
  startEvents: [golden-horde-breakup-1437]
  endEvents: [crimea-annexation-1783]
  basis:
    type: primary_source
    refs: ["퀴췩카이나르자 조약(1774)", "예카테리나 2세의 크림 병합 선언(1783)"]
    # 작업 메모: (세션 I에서 1486 → 1484)
    foundingNote: 하지 1세 기레이가 칸을 칭한 1441년을 시작으로 봄

