- id: thracian-tribes
  level: polity
  names: { ko: 트라키아 부족 (묶음), en: Thracian tribes, native: Thraces }
  from: -429
  to: -10
  color: "#609078"
  summary: 오드리사이 왕국 밖의 트라키아계 부족(로도페산맥의 베시·사파이오이, 소피아 분지의 세르디, 스트리몬강 상류의 마이디, 도나우강 남쪽의 트리발리·모이시)을 묶은 항목. 기원전 72~71년 루쿨루스가 베시를 쳤고, 29~28년 크라수스가 모이시를 정복함
  mapNote: "트라키아의 여러 부족을 묶어 나타냄(게타이는 다키아 부족 묶음). 끝은 로이메탈케스 1세가 트라키아를 묶은 기원전 11년으로 봄. 지도에 그린 첫 해(기원전 430년 무렵 헤로도토스)를 시작으로 둠. 지도에는 기원전 430~12년 표시: 기원전 430~265년 로도페(헤로도토스 7.111의 사트라이·베시)·세르디·트리발리, 430~359년 파이오니아·아그리아네스, 279년부터 서트라키아, 기원전 264~12년 로도페산맥·서트라키아·세르디카 쪽, 264~29년 모이시아(불가리아 북서부·세르비아 동부)"
  endNote: 기원전 11년 로이메탈케스 1세가 트라키아를 묶음
  features:
    - 헤로도토스는 트라키아 사람들이 인도인 다음으로 큰 민족인데 한 사람의 지배 아래 뭉치면 당할 이가 없었을 것이라 적음(5.3)
    - 기원전 72~71년 루쿨루스가 베시를 쳤음
    - 기원전 29~28년 크라수스가 모이시를 정복함
  startEvents: [herodotus-peoples-430bc]
  endEvents: [pannonia-illyricum-12bc]
  basis:
    type: primary_source
    refs: ["리비우스, 『로마 건국사』 39.53·42.19", "카시우스 디오, 『로마사』 51.23~27", "스트라본, 『지리지』 7권 단편"]
    # 작업 메모: AN-⑧, 운영자 승인 2026-10-09 / 정할 점 AN4-① / (작업 AN3) / 작업 FIX5b(FIX 후보 ⑧)에서 고침 / 작업 AN4에서 기원전 430~265년 로도페(헤로도토스 7.111의 사트라이·베시)·세르디·트리발리, 430~359년 파이오니아·아그리아네스를 표시하고 279년(−278)부터 서트라키아를 더함 / 작업 FIX5b(FIX 후보 ⑧)에서 기원전 27~12년 로도페·서트라키아·세르디카 쪽을 더 그리고 끝을 로이메탈케스 1세가 트라키아를 묶은 기원전 11년(−10, 정할 점 FIX5b-①)으로 늦춤 / 부족 채우기 묶음 항목(AN-⑧, 운영자 승인 2026-10-09, '트라키아'. 게타이는 작업 AN2의 다키아 부족 묶음) / 기원전 27년 표는 이 땅을 트라키아 왕국으로 그려 기원전 28→27년에 바뀌어 보였으나 / 묶음 항목 / 천문 연도 −429 / (−278) / (−10)
    foundingNote: 기원전 430년 무렵 헤로도토스가 『역사』에 트라키아 부족을 적음

- id: scythian-tribes
  level: polity
  names: { ko: 스키타이 부족 (묶음), en: Scythian tribes, native: Σκύθαι }
  from: -429
  to: -149
  color: "#c09048"
  summary: 기원전 3세기 사르마티아인에게 밀리기 전 흑해 북쪽 초원(드니스테르강~돈강)과 크림의 스키타이인(올비아의 프로토게네스 비문(기원전 200 무렵)의 사이오이 왕 사이타파르네스)을 묶은 항목. 2세기 초 초원은 사르마티아인(록솔라니)에게 넘어가고 크림과 드니프로강 하류의 스키타이인은 스킬루로스의 왕국(크림 스키타이)이 됨
  mapNote: 기원전 7~3세기 초원의 스키타이 부족을 묶어 나타냄. 지도에 그린 첫 해(기원전 430년 무렵 헤로도토스)를 시작으로 둠. 지도에는 기원전 430~281년 숲초원(키이우·체르카시·폴타바·빈니차·하르키우·벨고로드와 보로네시주의 돈강 오른쪽, 헤로도토스 4.17~18·4.108의 농경 스키타이·겔로노스), 280년부터 스키타이 왕국이 무너진 초원·크림, 기원전 264~180년 드니스테르강~돈강 초원(폴리비오스 25.2의 사르마티아 왕 가탈로스가 나오는 179년부터 사르마티아), 기원전 264~151년 크림 초원을 표시
  endNote: 기원전 2세기 초 초원이 사르마티아인(록솔라니)에게 넘어갔고, 크림과 드니프로강 하류의 스키타이인은 스킬루로스의 왕국(크림 스키타이)이 됨(스킬루로스의 재위 연대는 불확실함)
  features:
    - 올비아의 프로토게네스 비문(기원전 200년 무렵)은 사이오이 같은 스키타이 계통 집단과 갈라타이·스키로이가 올비아를 위협했다고 전함
    - 폴리비오스는 기원전 179년 무렵 사르마티아 왕 가탈로스를 적음(25.2)
  startEvents: [herodotus-peoples-430bc]
  endEvents: [scythia-sarmatia-crimea-200bc]
  basis:
    type: primary_source
    refs: ["올비아의 프로토게네스 기리는 비문(IOSPE I² 32)", "디오도로스, 『역사 총서』 2.43", "스트라본, 『지리지』 7.4"]
    # 작업 메모: 정할 점 AN4-① / 지도에는 기원전 264~180년 드니스테르강~돈강 초원(폴리비오스 25.2의 사르마티아 왕 가탈로스가 나오는 179년부터 사르마티아), 기원전 264~151년 크림 초원을 표시(작업 AN3, 정할 점 AN3-⑭. 작업 AN4에서 기원전 430~281년 숲초원(키이우·체르카시·폴타바·빈니차·하르키우·벨고로드와 보로네시주의 돈강 오른쪽, 헤로도토스 4.17~18·4.108의 농경 스키타이·겔로노스), 280년(−279)부터 스키타이 왕국이 무너진 초원·크림을 표시(정할 점 AN4-⑥) / 부족 채우기 묶음 항목(AN-⑧, 운영자 승인 2026-10-09, '스키타이(기원전 7~3세기 초원)') / 묶음 항목 / 천문 연도 −429 / (−279)
    foundingNote: 기원전 430년 무렵 헤로도토스가 『역사』에 곡식을 가꾸는 농경 스키타이를 적음(4.17~21)

- id: lesser-armenia
  level: polity
  names: { ko: 소아르메니아, en: Lesser Armenia, native: Փոքր Հայք }
  from: -330
  to: -111
  color: "#307890"
  summary: 유프라테스강 상류 서쪽의 아르메니아계 왕국. 기원전 331년 무렵 자립해 기원전 3세기에는 아리아케스 1세 같은 왕이 다스렸고, 기원전 2세기 끝에는 시시스와 아들 안티파트로스가 다스림. 안티파트로스가 기원전 112년 무렵 폰토스의 미트리다테스 6세를 후계로 삼아 폰토스에 들었고, 폼페이우스의 정리 뒤 갈라티아의 데이오타로스 등이 차례로 받음
  details: 유프라테스강 상류 서쪽(니코폴리스·아실리세네 서쪽 고지)의 아르메니아계 왕국. 기원전 331년 무렵 자립해 3세기에는 아리아케스 1세·오로마네스·아리아케스 2세 같은 왕이 다스렸고(두 언어 비문), 3세기 끝 셀레우코스의 태수령이 되었다는 견해도 있으나 근거가 약함(스트라본 11.14.5의 아르탁시아스·자리아드리스는 대아르메니아·소페네를 맡은 장군). 2세기 끝 시시스와 아들 안티파트로스가 다스렸고, 자식이 없던 안티파트로스가 112년 무렵 폰토스의 미트리다테스 6세를 후계로 삼아 폰토스에 듦. 폼페이우스(66 니코폴리스)의 정리 뒤 갈라티아의 데이오타로스, 47~44 카파도키아의 아리오바르자네스 3세, 33 폰토스의 폴레몬 1세, 30~20 메디아 아트로파테네의 아르타바스데스가 차례로 받음
  mapNote: 자립(기원전 331년 무렵)을 시작으로 봄. 도읍 아니-카마흐(케마, 에르진잔도)는 대아르메니아째(근사). 지도에는 기원전 331~113년 줄곧 시바스도의 동경 37.3° 동쪽(수셰히르·자라·이므란르·디브리이·코윌히사르, 1.49만 km²)을 표시. 기원전 112년 무렵부터 폰토스, 63년부터 갈라티아(데이오타로스), 33년부터 폰토스 왕국(폴레몬 왕조)으로 그리고, 47~44년 아리오바르자네스 3세와 30~20년 아르타바스데스는 근사
  endNote: 기원전 2세기 끝 시시스와 아들 안티파트로스가 다스렸고, 자식이 없던 안티파트로스가 112년 무렵 폰토스의 미트리다테스 6세를 후계로 삼아 폰토스에 듦. 폼페이우스의 정리 뒤 갈라티아의 데이오타로스 등이 차례로 받음
  features:
    - 기원전 3세기에 아리아케스 1세·오로마네스·아리아케스 2세 같은 왕이 다스렸음(두 언어 비문)
    - 기원전 3세기 끝 셀레우코스의 태수령이 되었다는 견해도 있으나 근거가 약함
  startEvents: []
  endEvents: [pontus-rise-183bc]
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 12.3.28", "아피아노스, 『미트리다테스 전쟁』 105·114", "카시우스 디오, 『로마사』 49.33·44"]
    # 작업 메모: (작업 AN3 검토 반영) / (정할 점 AN3-⑪) / 도읍 아니-카마흐(케마, 에르진잔도)는 대아르메니아째(근사)). 작업 AN4에서 기원전 331년(−330)부터 표시. 작업 FIX5b(운영자 결정 2026-10-10, FIX 후보 ⑰)에서 기원전 200~190년 셀레우코스 시기를 빼고 기원전 331년부터 113년까지 줄곧 소아르메니아로 그림 / 천문 연도 −330 / (−330)
    foundingNote: 자립(기원전 331년 무렵)을 시작으로 봄

# ── 작업 AN4 (2026-10-09): 기원전 800~265년 ──
- id: roman-kingdom
  level: polity
  names: { ko: 로마 왕국, en: Roman Kingdom, native: Regnum Romanum }
  from: -752
  to: -508
  color: "#c04050"
  summary: 전승으로 기원전 753년 로물루스가 세운 로마의 왕정. 일곱 왕 가운데 뒤의 셋(타르퀴니우스 프리스쿠스 616~578, 세르비우스 툴리우스, 타르퀴니우스 수페르부스 534~509)은 에트루리아계로, 이때 로마는 도시의 모습(포룸·카피톨리움의 유피테르 신전)을 갖추고 라티움의 맹주가 됨(509 로마-카르타고 조약의 아르데아·안티움·키르케이이·타라키나). 기원전 509년 수페르부스를 몰아내고 공화정이 됨
  mapNote: 지도에는 기원전 616~510년(타르퀴니우스 프리스쿠스부터) 로마도의 테베레강 동쪽·남쪽(라티움. 실제 왕정 말기 영역은 약 800km²라 근사)을 표시하고 기원전 509년부터 로마 공화정으로 이름만 바뀜(같은 색)
  endNote: 기원전 509년 수페르부스를 몰아내고 공화정이 됨
  features:
    - 일곱 왕 중 뒤의 셋(타르퀴니우스 프리스쿠스 기원전 616~578, 세르비우스 툴리우스, 타르퀴니우스 수페르부스 534~509)은 에트루리아계임
    - 포룸 정비, 카피톨리움의 유피테르 신전, 큰 하수도, 세르비우스의 개혁으로 도시의 틀을 갖췄다고 함
    - 라티움의 맹주가 됨(기원전 509 로마-카르타고 조약의 아르데아·안티움·키르케이이·타라키나)
  startEvents: [rome-kings-753bc]
  endEvents: [rome-republic-509bc]
  basis:
    type: primary_source
    refs: ["리비우스, 『로마 건국사』 1권", "할리카르나소스의 디오니시오스, 『로마 고대사』 1~4권", "폴리비오스, 『역사』 3.22"]
    # 작업 메모: 정할 점 AN4-② / AN-⑩·⑫, 작업 AN4 / 지도에는 기원전 616~510년(타르퀴니우스 프리스쿠스부터, 정할 점 AN4-②) 로마도의 테베레강 동쪽·남쪽(라티움, 새 선. 실제 왕정 말기 영역은 약 800km²라 근사)을 표시하고 기원전 509년(−508)부터 로마 공화정으로 이름만 바뀜(renames, 같은 색, AN-⑩·⑫, 작업 AN4) / 천문 연도 −752 / (−508)
    foundingNote: 건국 전승(기원전 753년)을 시작으로 봄

- id: etruscan-city-states
  level: polity
  names: { ko: 에트루리아 도시국가 (묶음), en: Etruscan city-states, native: Rasenna }
  from: -799
  to: -263
  color: "#2f6fb0"
  summary: 이탈리아 중부(토스카나·라치오 북부·움브리아 서부)의 에트루리아인 도시(타르퀴니이·카이레·베이이·불키·볼시니이·클루시움·페루시아·아레티움 등 열두 도시 동맹)를 묶은 항목. 6세기에 캄파니아(카푸아)와 포강 유역(펠시나·스피나·만투아)으로 넓혔고 535년 무렵 알랄리아 해전 뒤 코르시카에서 공물을 받았으나, 474 쿠마이 해전·424 삼니움인의 카푸아·396 베이이와 켈트인의 포강 유역으로 줄고 280년까지 로마의 동맹시가 됨(265~264 볼시니이)
  mapNote: 여러 도시국가를 묶어 그림. 빌라노바 문화의 원도시가 도시국가가 된 8세기를 시작 해(기원전 800년)로 둠. 지도에는 기원전 800~281년 토스카나·비테르보·페루자도, 800~397년 로마도의 테베레강 서쪽(베이이·카이레), 600~425년 카세르타도(카푸아), 535~397년 포강 유역(볼로냐·모데나·레조·파르마·페라라·라벤나·포를리·만토바), 535~265년 코르시카, 800~266년 테르니도(볼시니이)를 표시하고 그 뒤 로마
  endNote: 기원전 280년까지 로마의 동맹시가 되었고, 마지막 볼시니는 264년 로마에 함락되어 에트루리아 도시들의 독립이 끝남
  features:
    - 엘바섬과 토스카나의 금속, 그리스·페니키아와의 교역으로 기원전 7세기부터 카이레·타르퀴니이·베이이 같은 도시가 부유해짐
    - 그리스 알파벳을 바꾼 문자를 쓰며 화려한 무덤을 남김
    - 기원전 6세기에 캄파니아(카푸아)와 포강 유역(펠시나·스피나·만투아)으로 넓혔고 535년 무렵 알랄리아 해전 뒤 코르시카에서 공물을 받음
    - 기원전 474년 쿠마이 해전, 424년 삼니움인의 카푸아, 396년 베이이와 켈트인의 포강 유역으로 땅이 줄어듦
  startEvents: [etruscan-cities-800bc]
  endEvents: [first-punic-war-264bc]
  basis:
    type: primary_source
    refs: ["헤로도토스, 『역사』 1.94·1.166", "리비우스, 『로마 건국사』 1·5·9~10권", "디오도로스, 『역사 총서』 5.13·5.40", "폴리비오스, 『역사』 2.17"]
