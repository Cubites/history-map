    - 그리스인이 사는 땅을 모두 되찾자는 '위대한 이상(메갈리 이데아)'이 이후 대외 정책을 이끎
    - 1864년 영국에게서 이오니아 제도를, 1881년 테살리아를 얻고 발칸 전쟁(1912~1913)으로 마케도니아 남부·크레타 등을 얻음
    - 소아시아에 출병했으나 그리스-튀르키예 전쟁에 져 1923년 로잔 조약으로 튀르키예와 주민을 교환함
    - 2차 대전 때 점령되고 1946~1949년 내전을 겪었으며 1947년 도데카니사 제도를 얻음
  startEvents: [greek-independence-1821, greece-kingdom-1830]
  basis:
    type: primary_source
    refs: ["런던 의정서(1830)", "콘스탄티노폴리스 조약(1832)", "부쿠레슈티 조약(1913)", "뇌이 조약(1919)", "로잔 조약(1923)", "파리 강화 조약(1947)"]
    foundingNote: 독립을 인정받은 1830년을 시작으로 봄(1822년 임시 정부, 1832년 왕국)

