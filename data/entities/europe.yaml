  color: "#5f6f8f"
  summary: 호엔촐레른 가문의 브란덴부르크 선제후가 프로이센 공국(1657년 벨라우 조약으로 폴란드의 봉토에서 벗어남)과 라인강 쪽 클레베·마르크(1614년 크산텐 조약), 포메른·민덴·할버슈타트(1648년 베스트팔렌 조약)·마그데부르크(1680)를 함께 다스린 나라. 1701년 1월 프리드리히 3세가 쾨니히스베르크에서 '프로이센에서의 왕(König in Preußen)' 프리드리히 1세로 즉위해 프로이센 왕국이 됨
  mapNote: 지도에는 1618~1700년을 표시하고(그전 브란덴부르크 선제후령은 신성 로마 제국 묶음, 프로이센 공국은 따로 항목) 1701년부터는 프로이센 왕국 항목
  endNote: 1701년 1월 프리드리히 3세가 쾨니히스베르크에서 '프로이센에서의 왕' 프리드리히 1세로 즉위해 프로이센 왕국이 됨
  features:
    - 요한 지기스문트는 1613년 칼뱅파로 바꾸었으나 루터파 신민에게 개종을 강요하지 않음
    - 라인강에서 네만강까지 흩어진 땅을 한 군주가 다스림
    - 대선제후 프리드리히 빌헬름(재위 1640~1688)이 상비군과 관료제를 키움
  startEvents: [brandenburg-prussia-1618]
  endEvents: [prussia-kingdom-1701]
  basis:
    type: primary_source
    refs: ["벨라우 조약(1657)", "베스트팔렌 조약(1648)"]
    foundingNote: 브란덴부르크 선제후가 프로이센 공국을 이어받은 1618년을 시작으로 봄

- id: savoy
  level: polity
  names: { ko: 사보이아 공국, en: Duchy of Savoy, native: Ducato di Savoia }
  from: 1416
  to: 1720
  color: "#58a070"
  summary: 알프스 양쪽의 사보이아·니스·피에몬테를 다스린 공국. 1601년 리옹 조약으로 브레스·뷔제·젝스를 프랑스에 넘기고 살루초를 얻음. 에스파냐 왕위 계승 전쟁에서 반프랑스 동맹 편에 서서 위트레흐트 조약(1713)으로 시칠리아 왕국과 밀라노 서부(알레산드리아·발렌차)를 얻음. 1718~1720년 4국 동맹 전쟁 뒤 헤이그 조약(1720)으로 시칠리아를 오스트리아에 넘기고 사르데냐를 받아 사르데냐 왕국이 됨
  mapNote: 지도에는 1416년 이후만 표시하고(1536~1559년 프랑스의 사부아·피에몬테 점령은 그리지 않음) 1720년부터는 사르데냐 왕국 항목
  endNote: 4국 동맹 전쟁(1718~1720) 뒤 1720년 헤이그 조약으로 시칠리아를 오스트리아에 넘기고 사르데냐를 받아 사르데냐 왕국이 됨
  features:
    - 1601년 리옹 조약으로 브레스·뷔제·젝스를 프랑스에 넘기고 살루초를 얻음
    - 에스파냐 왕위 계승 전쟁에서 반프랑스 동맹 편에 서서 위트레흐트 조약(1713)으로 시칠리아 왕국과 밀라노 서부를 얻고 시칠리아 왕을 겸함
  startEvents: [constance-1414]
  endEvents: [sardinia-kingdom-1718]
