  mapNote: 스킬루로스 시대(기원전 150년 무렵)를 시작으로 봄(그전 스키타이 부족 묶음). 기원전 110~107년 디오판토스에게 진 뒤의 폰토스 공납은 그리지 않음. 지도 범위 안의 주권 왕국이라 그림. 지도에는 기원전 150~기원후 255년 크림 초원과 남쪽 해안(타우리인, 근사)을 표시하고 256년 무렵 고트·보라니(게르만 부족)
  endNote: 3세기 중엽 고트족·알란이 들어오며 네아폴리스가 무너짐(256년 무렵 고트족과 보라니의 습격으로 불탄 것으로 봄)
