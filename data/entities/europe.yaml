    - 475년 군사령관 오레스테스가 반란을 일으켜 네포스가 달마티아로 달아났고 오레스테스는 아들 로물루스 아우구스툴루스를 황제로 세움
  startEvents: [theodosius-i-379]
  endEvents: [western-empire-end-476]
  basis:
    type: primary_source
    refs: ["말쿠스, 『역사』 단편", "『익명의 발레시아누스』", "마르켈리누스 코메스, 『연대기』(480)"]
    # 작업 메모: (작업 M6, 정할 점 M6-①) / 작업 AN1에서 395년부터로 넓힘(395~475년 이탈리아·갈리아·히스파니아·라이티아·노리쿰·달마티아와 판노니아(432년까지)·브리타니아(409년까지), 406 라인 도하 뒤 이동기 왕국(411 히스파니아 제비뽑기·418 아키타니아·443 사파우디아·461 수아송 등)에 잃은 땅은 그 해부터 뺌, 정할 점 AN-⑤·AN1)
    foundingNote: 395년 제국의 분할을 시작으로 봄

- id: odoacer-italy
  level: polity
  names: { ko: 오도아케르의 이탈리아 왕국, en: Kingdom of Odoacer, native: Regnum Italiae }
  from: 476
  to: 493
  color: "#e0c050"
  summary: 476년 로물루스 아우구스툴루스를 폐위한 게르만 장군 오도아케르가 동로마 황제의 이름 아래 다스린 이탈리아. 477년 반달 왕 가이세리크에게 공납하고 시칠리아를 받았고 481~482년 달마티아를 차지했으며, 487~488년 루기인을 쳤다가 489년부터 테오도리쿠스의 동고트에 밀려 493년 라벤나에서 살해됨
  mapNote: 지도에는 476~492년 이탈리아·라이티아·노리쿰과 477년부터 시칠리아, 481년부터 달마티아를 표시
  endNote: 489년부터 테오도리쿠스의 동고트에 밀려 493년 2월 협정을 맺은 뒤 3월 15일 연회에서 테오도리쿠스에게 살해되어 동고트 왕국으로 이어짐
  features:
    - 원로원과 로마의 관직을 그대로 두고 다스렸고 제논은 오도아케르에게 파트리키오스 칭호를 줌
    - 477년 반달 왕에게 공납하는 조건으로 시칠리아를 넘겨받음
    - 480년 네포스가 달마티아에서 부하에게 살해되자 481~482년 달마티아를 차지함
    - 487~488년 도나우강 북안의 루기인 같은 게르만 부족을 쳐서 노리쿰의 로마 주민을 이탈리아로 옮김
  startEvents: [western-empire-end-476]
  endEvents: [theodoric-ostrogoths-489]
  basis:
    type: primary_source
    refs: ["『익명의 발레시아누스』", "카시오도루스, 『연대기』", "에우기피우스, 『세베리누스의 생애』", "비타의 빅토르, 『반달 박해사』(시칠리아)"]
    # 작업 메모: (작업 M6)
    foundingNote: 476년 로물루스 아우구스툴루스의 폐위를 시작으로 봄

- id: ostrogothic-kingdom
  level: polity
  names: { ko: 동고트 왕국, en: Ostrogothic Kingdom, native: Gutþiuda }
  from: 493
  to: 554
  color: "#e08040"
  summary: 테오도리쿠스 대왕이 493년 오도아케르를 죽이고 세운 이탈리아의 고트 왕국. 이탈리아·시칠리아·달마티아·라이티아·노리쿰과 504년 시르미움, 508년 프로방스를 다스렸고 서고트의 섭정(511~526)도 맡음. 535년부터 유스티니아노스의 고트 전쟁으로 시칠리아·달마티아(535)·라벤나(540)를 잃고, 토틸라의 회복(541~552) 뒤 552년 부스타 갈로룸·몬스 락타리우스 전투에서 무너짐
  mapNote: 493년 라벤나 입성을 시작으로 봄. 541~552년 토틸라가 되찾은 땅은 동로마의 정복이 굳지 않은 것이라 동고트째, 552년 중부·남부, 554년 북부가 동로마. 지도에는 493~553년 표시. 562년 베로나·브레시아의 마지막 수비대는 근사
  endNote: 552년 부스타 갈로룸에서 토틸라가 죽고 몬스 락타리우스에서 마지막 고트 왕 테이아가 전사해 무너졌고 554년 유스티니아노스가 『국사 조칙』으로 이탈리아의 행정을 정함
  features:
    - 고트인에게는 군역과 아리우스파 신앙을, 로마인에게는 민정과 가톨릭 신앙을 맡기는 이중 체제로 다스림
    - 504년 시르미움을 게피드에게서 얻었고 508년 프랑크와 부르군트의 아를 포위를 풀어 프로방스를 얻음
    - 511년부터 외손자 아말라리크의 섭정으로 서고트도 맡음
    - 535년 시칠리아·달마티아, 540년 라벤나를 동로마에 잃었으나 541년 토틸라가 왕이 되어 이탈리아 대부분을 되찾음
  startEvents: [theodoric-ostrogoths-489]
  endEvents: [gothic-war-535]
  basis:
    type: primary_source
    refs: ["카시오도루스, 『잡문집』", "프로코피우스, 『전쟁사』(고트 전쟁)", "요르다네스, 『고트족의 기원과 행적』"]
    # 작업 메모: (작업 M6) / (M-①(나))
    foundingNote: 493년 라벤나 입성을 시작으로 봄

- id: visigothic-kingdom
  level: polity
  names: { ko: 서고트 왕국, en: Visigothic Kingdom, native: Regnum Visigothorum }
  from: 418
  to: 721
  color: "#8c4a3c"
  summary: 418년 아키타니아에 정착한 서고트인의 왕국. 에우리크(466~484)가 갈리아 남부와 히스파니아 대부분을 차지했으나 507년 부예 전투에서 클로비스에게 져 셉티마니아만 남기고 갈리아를 잃었고, 레오비길드(568~586)가 톨레도를 도읍으로 수에비 왕국(585)을 병합했으며 수인틸라가 624년 동로마의 스파니아를 마저 차지함. 711년 과달레테 전투에서 로데리크가 죽어 무너지고 아길라 2세·아르도의 타라코넨시스·셉티마니아가 720년까지 남음
  mapNote: 지도에는 418~720년 표시(418 아키타니아 2주와 톨로사, 457 루시타니아·바이티카, 462 나르본·노벰포풀라니아 남부, 471 아키타니아 1주·님, 473 투르·타라코넨시스 내륙·카르타기넨시스, 475 아르베르니·타라코 해안). 바스크 땅과 아스투리아스(574년까지)는 비움
  endNote: 711년 과달레테 전투에서 로데리크가 죽어 무너졌고 아길라 2세·아르도의 타라코넨시스·셉티마니아가 720년까지 남다가 나르본에서 마지막 조각이 사라짐
  features:
    - 테오도리쿠스 2세가 456년 10월 5일 오르비고강에서 수에비 왕 레키아르를 꺾어 히스파니아 서쪽을 휩쓺
    - 에우리크(466~484)가 갈리아 남부와 히스파니아 대부분을 차지함
    - 507년 부예 전투에서 클로비스에게 져 셉티마니아만 남기고 갈리아를 잃음
    - 레오비길드(568~586)가 톨레도를 도읍으로 삼고 585년 수에비 왕국을 병합함
    - 수인틸라가 624년 동로마의 스파니아를 마저 차지함
  startEvents: [alaric-stilicho-395]
  endEvents: [muslim-iberia-asturias-711]
  basis:
    type: primary_source
    refs: ["투르의 그레고리우스, 『프랑크인의 역사』", "비클라로의 요안네스, 『연대기』", "세비야의 이시도루스, 『고트인의 역사』", "『754년 연대기』"]
    # 작업 메모: (작업 M6) / 작업 AN1에서 418년부터로 넓힘(418 아키타니아 2주와 톨로사, 457 루시타니아·바이티카, 462 나르본·노벰포풀라니아 남부, 471 아키타니아 1주·님, 473 투르·타라코넨시스 내륙·카르타기넨시스, 475 아르베르니·타라코 해안) / 지도에는 476~720년 표시
    foundingNote: 418년 아키타니아 정착을 시작으로 봄

- id: suebi-kingdom
  level: polity
  names: { ko: 수에비 왕국, en: Kingdom of the Suebi, native: Regnum Suevorum }
  from: 409
  to: 585
  color: "#6fb0c8"
  summary: 409년 히스파니아에 들어온 수에비인이 갈라이키아(브라가)에 세운 왕국. 5세기 중엽 루시타니아까지 넓혔다가 서고트에 밀렸고, 550년대 가톨릭으로 개종(브라가의 마르티누스)했으며 585년 레오비길드에게 병합됨
  mapNote: 지도에는 411~584년 표시(411 제비뽑기의 갈라이키아 서쪽, 420 하스딩이 떠난 갈라이키아 전체, 439 메리다와 루시타니아, 441 바이티카·카르타기넨시스(453 카르타기넨시스 반환), 457 오르비고강 전투 뒤 갈라이키아로 줄어듦, 468 코님브리가, 476~584년 갈리시아·포르투갈 북부와 중부(코임브라)·레온)
  endNote: 585년 서고트 왕 레오비길드가 수에비 왕국을 병합해 갈리시아를 차지함
  features:
    - 레킬라(438~448)가 439년 메리다, 441년 바이티카와 카르타기넨시스의 세비야 일대를 차지해 히스파니아에서 가장 강한 세력이 됨
    - 448년 즉위한 레키아르가 456년 오르비고강 가에서 서고트 왕 테오도리쿠스 2세에게 져 그해 12월 처형됨
    - 550년대 가톨릭으로 개종함(브라가의 마르티누스)
  startEvents: [rhine-crossing-406, suebi-hispania-409]
  endEvents: [toledo-kingdom-552]
  basis:
    type: primary_source
    refs: ["히다티우스, 『연대기』", "비클라로의 요안네스, 『연대기』(585)", "세비야의 이시도루스, 『수에비인의 역사』"]
    # 작업 메모: (작업 M6) / 작업 AN1에서 411년부터로 넓힘(411 제비뽑기의 갈라이키아 서쪽, 420 하스딩이 떠난 갈라이키아 전체, 439 메리다와 루시타니아, 441 바이티카·카르타기넨시스(453 카르타기넨시스 반환), 457 오르비고강 전투 뒤 갈라이키아로 줄어듦, 468 코님브리가) / 지도에는 476~584년
    foundingNote: 409년 히스파니아 정착을 시작으로 봄

- id: vandal-kingdom
  level: polity
  names: { ko: 반달 왕국, en: Vandal Kingdom, native: Regnum Vandalorum et Alanorum }
  from: 409
  to: 534
  color: "#a080c0"
  summary: 406년 라인강을 건너 409년 히스파니아에 들어온 반달인(하스딩·실링)의 왕국. 411년 제비뽑기로 갈라이키아 동쪽과 바이티카를 얻었고 429년 가이세리크가 아프리카로 건너가 439년 카르타고를 차지해 반달·알란인의 왕국을 세움. 사르데냐·코르시카·발레아레스와 시칠리아(477년 오도아케르에게 넘기고 릴리바이움은 491년까지)를 다스렸으나 533~534년 벨리사리우스에게 정복됨
  mapNote: 409년 히스파니아 진입을 시작으로 봄. 429~455년은 아프리카(지도 범위 밖)라 지도 범위 안에 땅 없음. 북아프리카 본토는 지도 범위 밖. 지도에는 지도 범위 안 부분만 411~428년과 456~533년 표시(411~419년 하스딩 반달의 갈라이키아 동쪽, 411~417년 실링 반달의 바이티카, 420~428년 하스딩의 바이티카와 425~428년 카르타고 노바 쪽, 456년부터 사르데냐·코르시카·발레아레스, 468~476년 시칠리아)
  endNote: 533년 벨리사리우스가 상륙한 끝에 534년 3월 반달 왕 겔리메르가 항복하며 동로마에 정복됨
  features:
    - 411년 제비뽑기로 하스딩 반달은 갈라이키아 동쪽, 실링 반달은 바이티카를 얻음
    - 416~418년 서고트에게 실링 반달이 무너지고 남은 알란은 하스딩 반달 왕 군데리크를 따름
    - 429년 가이세리크가 아프리카로 건너가 439년 카르타고를 차지해 반달·알란인의 왕국을 세움
    - 사르데냐·코르시카·발레아레스와 시칠리아를 다스렸고 477년 시칠리아를 오도아케르에게 넘김(릴리바이움은 491년까지)
  startEvents: [rhine-crossing-406]
  endEvents: [vandal-africa-533]
  basis:
    type: primary_source
    refs: ["비타의 빅토르, 『반달 박해사』", "프로코피우스, 『전쟁사』(반달 전쟁)"]
    # 작업 메모: (작업 AN1에서 435년 히포 조약에서 앞당김) / (작업 M6) / 작업 AN1에서 411년부터로 넓힘(411~419년 하스딩 반달의 갈라이키아 동쪽, 411~417년 실링 반달의 바이티카, 420~428년 하스딩의 바이티카와 425~428년 카르타고 노바 쪽, 429~455년은 아프리카(권역 밖)라 권역 안 땅 없음, 456 사르데냐·코르시카·발레아레스, 468 시칠리아. 정할 점 AN1-②)
    foundingNote: 409년 히스파니아 진입을 시작으로 봄

- id: burgundian-kingdom
  level: polity
  names: { ko: 부르군트 왕국 (부르군트족), en: Kingdom of the Burgundians, native: Regnum Burgundionum }
  from: 411
  to: 534
  color: "#d080b0"
  summary: 413년 라인강 왼쪽(보름스)에 동맹자로 정착했다가 436년 아이티우스가 부른 훈족에게 군다하르와 함께 무너지고, 443년 사파우디아(사보이아)에 다시 정착한 부르군트인의 왕국. 군도바드(480년 무렵~516)의 리옹·비엔·제네바를 중심으로 손강·론강 유역을 다스렸고 부르군트 법전을 펴냄. 523년 프랑크의 침공과 동고트의 남부 병합을 겪고 532년 오툉 전투 뒤 534년 프랑크 왕들에게 나뉨
