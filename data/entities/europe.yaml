    - 1456~1464년에는 이반 3세가 어린 대공의 후견인으로 다스림
  startEvents: []
  endEvents: [vasily3-1510]
  basis:
    type: primary_source
    refs: ["모스크바-랴잔 조약(1483)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1129년부터로 넓힘 / 작업 M2·FIX2 / D3-⑨
    foundingNote: 체르니고프 공국에서 갈라진 1129년 무렵을 시작으로 봄

- id: vyatka
  level: polity
  names: { ko: 뱌트카 땅, en: Vyatka Land, native: Вятская земля }
  from: 1181
  to: 1489
  color: "#7fb0c8"
  summary: 뱌트카강 유역(흘리노프)에 노브고로드 이주민이 세운 자치 땅. 1459년 모스크바의 원정으로 종주를 인정했으나 카잔·노브고로드 사이에서 모스크바에 맞섰고, 1489년 이반 3세의 군대가 흘리노프를 차지해 아르스크 땅과 함께 합침
  mapNote: 지도에는 1181~1488년 키로프주만 표시
  endNote: 1489년 이반 3세의 군대가 흘리노프를 차지해 아르스크 땅과 함께 모스크바 대공국에 합침
  features:
    - 1459년 모스크바의 원정으로 모스크바의 종주를 인정함
    - 카잔·노브고로드 사이에서 모스크바에 맞섬
  startEvents: [andrei-bogolyubsky-1157]
  endEvents: [ivan3-unification-1478]
  basis:
    type: primary_source
    refs: ["뱌트카 연대기"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1181년부터로 넓힘
    foundingNote: 연대기가 전하는 이주(1181)를 시작으로 봄

- id: golden-horde
  level: polity
  names: { ko: 킵차크 칸국 (대오르다), en: Golden Horde (Great Horde), native: Ulug Ulus }
  from: 1242
  to: 1502
  color: "#8f6fa8"
  summary: 바투가 세운 몽골의 킵차크 칸국. 15세기에 카잔(1438)·크림(1441)·아스트라한(1466 무렵) 칸국이 갈라져 나가고 볼가강·돈강 사이의 대오르다만 남음. 1480년 우그라강 대치로 모스크바가 종주에서 벗어났고, 1502년 크림 칸 멩글리 기레이가 샤이흐 아흐마드를 쳐서 무너뜨림
  mapNote: 지도에는 1242~1501년 대오르다의 유목지(볼가·돈 초원과 북캅카스 초원)만 대략 표시하고 1242~1299년에는 킵차크 초원·볼가 불가르 땅·바시키르와 루스 남쪽 땅(페레야슬라우·포딜리아, 1259년까지 몽골 제국의 종속)을 더함. 1502년부터 볼가·돈 초원은 비움. 1400~1452년에는 갈라지기 전의 범위(카잔 1438·노가이 땅 1440·크림 1441년까지)를 표시
  endNote: 1480년 우그라강 대치로 모스크바가 종주에서 벗어났고, 1502년 크림 칸 멩글리 기레이가 샤이흐 아흐마드를 쳐서 무너뜨림
  features:
    - 몽골은 루스를 직접 다스리지 않고 공후들이 사라이에서 칸의 허락장(야를릭)을 받아 대공 자리를 얻게 하고 공납을 바치게 함
    - 바투의 동생 베르케(재위 1257~1266)가 이슬람으로 개종했고, 칸국은 1260년대에 사실상 대칸에서 독립함
    - 1359~1382년 대혼란과 쿨리코보 전투, 토크타미시의 모스크바 약탈이 이어짐
    - 15세기에 카잔(1438)·크림(1441)·아스트라한(1466 무렵) 칸국이 갈라져 나가고 볼가강·돈강 사이의 대오르다만 남음
  startEvents: [golden-horde-1242]
  endEvents: [great-horde-1466]
  basis:
    type: primary_source
    refs: ["러시아 연대기의 우그라강 대치(1480)"]
    # 작업 메모: 작업 M3에서 1242년부터로 넓힘 / M-④ / 작업 M1 / 정할 점 M1-⑪ / (들판 기준 D3-⑨) / 1526년 표처럼 비움(표현 바꿈)
    foundingNote: 바투가 볼가강 하류에 자리 잡은 1242년을 시작으로 봄

- id: kalmar-union
  level: polity
  names: { ko: 칼마르 동맹 (덴마크·노르웨이), en: Kalmar Union (Denmark–Norway), native: Kalmarunionen }
  from: 1448
  to: 1523
  color: "#c4685c"
  summary: 덴마크·노르웨이·스웨덴이 한 왕을 받든 동맹(1397 칼마르). 스웨덴은 1448년부터 거의 늘 따로 왕이나 섭정(스투레 가문)을 두었고 연합 왕(크리스티안 1세·한스·크리스티안 2세)이 다스린 것은 1457~1464·1497~1501·1520~1521년뿐. 1460년 리베 조약으로 슐레스비히·홀슈타인을 더했고 오크니·셰틀랜드는 1468~1469년 스코틀랜드에 저당 잡힘. 1523년 구스타브 바사가 스웨덴 왕이 되며 끝나 덴마크-노르웨이로 이어짐
  mapNote: 동맹은 1397년에 시작했으나 덴마크·노르웨이만의 동맹은 스웨덴이 떨어져 나간 1448년부터(1397~1447년은 칼마르 동맹 (덴마크·노르웨이·스웨덴) 항목, 이름만 바뀌어 이어짐·같은 색). 1448년 카를 크누트손이 스웨덴 왕이 된 뒤 1523년까지 덴마크·노르웨이(1460년부터 홀슈타인 포함)만 표시. 1524년부터는 덴마크-노르웨이 항목(같은 색)
  endNote: 1523년 구스타브 바사가 스웨덴 왕으로 뽑히고 덴마크에서도 크리스티안 2세가 쫓겨나 프레데리크 1세가 왕이 되며 덴마크-노르웨이로 이어짐
  features:
    - 스웨덴은 거의 늘 따로 왕이나 섭정(스투레 가문)을 두었고 연합 왕이 다스린 것은 1457~1464·1497~1501·1520~1521년뿐
    - 1450년 크리스티안 1세가 노르웨이 왕이 되어 덴마크-노르웨이의 연합이 이어짐
    - 1460년 리베 조약으로 슐레스비히·홀슈타인을 더함
    - 오크니·셰틀랜드는 1468~1469년 스코틀랜드에 저당 잡힘
  startEvents: [kalmar-breakup-1439]
  endEvents: [stockholm-bloodbath-1520]
  basis:
    type: primary_source
    refs: ["칼마르 동맹 문서(1397)", "리베 조약(1460)", "칼마르 협약(1483)"]
    # 작업 메모: 작업 FIX2 / 정할 점 FIX2-⑨ / 정할 점 D4-④ / renames
    foundingNote: 스웨덴이 떨어져 나가 덴마크·노르웨이만의 동맹이 된 1448년을 시작으로 봄

- id: sweden-medieval
  level: polity
  names: { ko: 스웨덴 왕국 (중세), en: Kingdom of Sweden (medieval), native: Konungariket Sverige }
  from: 1164
  to: 1523
  color: "#6f96c4"
  summary: 핀란드를 아우른 스웨덴 왕국. 칼마르 동맹에 들었으나 카를 크누트손(1448~1470, 세 차례)이 따로 왕이 되었고 스텐 스투레 등 섭정이 다스리며 연합 왕과 다툼. 1520년 크리스티안 2세의 스톡홀름 피바다 뒤 구스타브 바사가 들고일어나 1523년 6월 왕으로 뽑힘
  mapNote: 웁살라 대주교구가 선 1164년을 시작으로 봄. 화면 이름은 1300~1396년에도 보이므로 '스웨덴 왕국 (중세)'. 지도에는 1164~1396년과 1448~1522년만 표시하고(1397~1447년은 칼마르 동맹 색. 1332~1359년 스코네, 1360년까지 고틀란드 포함. 핀란드 남서부 1217, 하메 1249, 비보르크·카렐리아 1293) 1523년부터는 스웨덴 왕국 항목(같은 색). 핀란드 북부·동부와 노를란드 북부는 실효 지배가 굳은 해부터 그림(1314 베스테르보텐 해안, 1323 뇌테보리 조약으로 남·중부 오스트로보트니아·남사보, 1335 노르보텐 해안, 1375 오울루 카스텔리 성의 북오스트로보트니아와 케미·토르니오 해안, 1553 라프마르크(라플란드와 노를란드 북부의 내륙 사미 땅), 1595 카이누·북사보·북오스트로보트니아 동쪽 내륙. 그전은 사미·카렐리아 사람 땅이라 비움)
  endNote: 1520년 크리스티안 2세의 스톡홀름 피바다 뒤 구스타브 바사가 뤼베크의 도움으로 덴마크군을 몰아내 1523년 6월 왕(구스타브 1세)으로 뽑혀 스웨덴 왕국으로 이어짐
  features:
    - 스베르케르 가문과 에리크 가문이 번갈아 왕위를 차지함
    - 크누트 에릭손(재위 1167~1196)이 1173년 무렵부터 스웨덴 전체를 다스렸다고 하나 핀란드 쪽은 노브고로드와 스웨덴이 다툼
    - 칼마르 동맹에 들었으나 카를 크누트손(1448~1470, 세 차례)이 따로 왕이 됨
    - 크리스티안 1세는 1457년에야 스웨덴 왕이 됨(1464년까지)
    - 스텐 스투레 등 섭정이 다스리며 연합 왕과 다툼
  startEvents: [scandinavia-1130]
  endEvents: [stockholm-bloodbath-1520]
  basis:
    type: primary_source
    refs: ["스트렝네스 의회(1523)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1164년부터로 넓힘 / 정할 점 M1-③ / 작업 M2 / 작업 FIX2b / 정할 점 FIX3-①② / (전에는 '칼마르 동맹 시기') / 작업 FIX3에서 핀란드 북부·동부와 노를란드 북부를 실효 지배가 굳은 해부터로 고침
    foundingNote: 웁살라 대주교구가 선 1164년을 시작으로 봄

- id: cyprus-kingdom
  level: polity
  names: { ko: 키프로스 왕국, en: Kingdom of Cyprus, native: Royaume de Chypre }
  from: 1192
  to: 1489
  color: "#c9b0d8"
  summary: 십자군의 뤼지냥 가문이 다스린 섬 왕국(1426년부터 맘루크 술탄국에 공물). 1464년 자크 2세가 베네치아의 도움으로 왕위를 차지하고 베네치아 귀족 카테리나 코르나로와 혼인했으며, 그가 죽은 뒤 1489년 여왕 카테리나가 물러나 베네치아의 땅이 됨
  mapNote: 지도에는 1192~1488년만 표시
  endNote: 1489년 2월 여왕 카테리나가 권리를 베네치아 공화국의 도제에게 넘기고 3월 섬을 떠나 베네치아의 땅이 됨
  features:
    - 1197년 기 드 뤼지냥의 동생 아모리(에메리)가 왕관을 받아 영주령이 왕국이 됨
    - 1458년 요한 2세가 죽자 딸 샤를로트와 서자 자크 2세가 왕위를 다투었고 1464년 자크 2세가 왕위를 차지함
    - 자크 2세가 1468년 7월 베네치아 귀족의 딸 카테리나 코르나로와 대리 혼인함
    - 1473년 자크 2세가 죽고 1474년 아들 자크 3세도 죽자 카테리나가 여왕이 되었으나 실권은 베네치아의 감독관들이 쥠
  startEvents: [saladin-third-crusade-1187]
  endEvents: [cyprus-venice-1473]
  basis:
    type: primary_source
    refs: ["카테리나 코르나로의 퇴위(1489)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1192년부터로 넓힘
    foundingNote: 기 드 뤼지냥이 섬을 산 1192년을 시작으로 봄

- id: knights-hospitaller
  level: polity
  names: { ko: 로도스 기사단국, en: Knights Hospitaller of Rhodes, native: Ordo Hospitalis Sancti Johannis }
  from: 1310
  to: 1522
  color: "#d8665f"
  summary: 성 요한 기사단이 로도스섬과 도데카니사(코스 등), 소아시아의 보드룸 성을 다스린 수도회 국가. 1480년 메흐메트 2세의 포위를 물리쳤으나 1522년 술레이만 1세의 포위 끝에 12월 항복 협약을 맺고 섬을 떠남(1530년 몰타로)
  mapNote: 지도에는 1310~1521년 도데카니사 쪽만 표시
  endNote: 1522년 술레이만 1세가 여섯 달 가까이 포위하자 12월 항복 협약을 맺고 섬을 떠남. 기사단은 1530년 몰타에 자리 잡음
  features:
    - 1312년 교황이 템플 기사단을 폐지하고 그 재산을 병원 기사단에 넘기라고 명함
    - 1480년 메흐메트 2세가 로도스를 석 달 가까이 에워쌌으나 물러남
    - 1482년 왕위 다툼에 진 젬이 기사단에 몸을 맡기자 기사단과 교황청은 바예지트 2세에게서 해마다 돈을 받음
  startEvents: [templars-1307]
  endEvents: [ottoman-selim-1514]
  basis:
    type: primary_source
    refs: ["로도스 항복 협약(1522)"]
    foundingNote: 기사단이 로도스를 차지한 1310년을 시작으로 봄

- id: morea-despotate
  level: polity
  names: { ko: 모레아 전제공국, en: Despotate of the Morea, native: Δεσποτάτο του Μορέως }
  from: 1349
  to: 1460
  color: "#8e5fa8"
  summary: 비잔티움 황족(팔라이올로고스 가문)이 펠로폰네소스(미스트라스)를 다스린 전제공국. 1453년 콘스탄티노폴리스 함락 뒤 형제 토마스·데메트리오스가 오스만에 공물을 바치며 다투다 1460년 메흐메트 2세가 정복함. 메토니·코로니·나우플리오 등 항구는 베네치아 땅이었음
  mapNote: 지도에는 1453~1459년 펠로폰네소스 전체로 표시(베네치아 항구는 근사). 1452년까지는 황제의 아들·형제가 다스린 동로마 제국 안의 자치 단위라 동로마 제국 땅으로 그림
  endNote: 1453년 콘스탄티노폴리스 함락 뒤 형제 토마스·데메트리오스가 오스만에 공물을 바치며 다투다 1460년 메흐메트 2세가 정복함
  features:
    - 1452년까지는 황제의 아들·형제가 다스린 동로마 제국 안의 자치 단위였음
    - 메토니·코로니·나우플리오 등 항구는 베네치아 땅이었음
  startEvents: [byzantine-civil-war-1341]
