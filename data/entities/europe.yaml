- id: rurikid-rus
  level: polity
  names: { ko: 루스 (노브고로드의 류리크), en: Rus' of Novgorod (Rurik), native: Русь }
  from: 862
  to: 882
  color: "#806040"
  summary: 원초 연대기에 따르면 862년 일멘 슬로베네·크리비치·추드·메랴가 바랴그인 류리크를 불러 노브고로드(라도가)에 세운 나라. 류리크의 형제들이 벨로오제로·이즈보르스크를, 그 부하들이 폴로츠크·로스토프·무롬을 맡았고, 882년 올레그가 키예프로 옮겨 키예프 루스가 됨
  mapNote: 지도에는 862~881년 노브고로드·프스코프·로스토프·벨로오제로·무롬과 라도가·잉그리아를 표시(폴로츠크는 같은 조각의 라디미치 땅과 함께 885, 카렐리야는 부족째)하고 882년부터 키예프 루스(이름만 바뀌어 이어짐, 같은 색)
  endNote: 882년 올레그가 키예프를 차지하고 아스콜드와 디르를 죽여 키예프 루스가 됨
  features:
    - 류리크의 형제들이 벨로오제로·이즈보르스크를, 그 부하들이 폴로츠크·로스토프·무롬을 맡음
    - 『원초 연대기』(12세기 초 편찬)의 이야기는 설화적이며 연도는 연대기가 맞춘 것임
    - 9세기 중엽 이후 스칸디나비아에서 라도가와 볼가강을 따라 이어진 교역로로 루스 상인이 바그다드까지 감
    - 이븐 후르다드베의 『도로와 왕국 총람』은 루스를 '슬라브의 한 갈래'로 적고 상인이 비버·검은 여우 가죽을 팔았다고 함
  startEvents: [rus-formation-862]
  endEvents: [rus-formation-862]
  basis:
    type: primary_source
    refs: ["『원초 연대기』(862·882)", "『노브고로드 제1연대기』"]
    # 작업 메모: 작업 M5
    foundingNote: 바랴그인을 부른 해(862)를 시작으로 봄

