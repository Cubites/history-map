    foundingNote: 다비드 6세 나린이 서조지아 왕이 된 1259년을 시작으로 봄

- id: kartli
  level: polity
  names: { ko: 카르틀리 왕국, en: Kingdom of Kartli, native: ქართლის სამეფო }
  from: 1490
  to: 1762
  color: "#a05070"
  summary: 1490년 조지아 왕국이 나뉠 때 트빌리시를 중심으로 선 동조지아의 왕국. 1555년 아마시아 조약으로 페르시아의 세력권이 되어 사파비 왕조의 종주를 받았고(1578~1612 오스만 종주(트빌리시·고리에 오스만 수비대, 1590 콘스탄티노폴리스 조약), 1723~1735 오스만 점령), 1747년 나디르 샤가 죽은 뒤 카헤티와 함께 사실상 독립. 1762년 카헤티 왕 헤라클리우스 2세가 아버지 테무라즈 2세를 이어 카르틀리 왕이 되며 카르틀리-카헤티 왕국으로 합쳐짐
  mapNote: 지도에는 1490~1761년 크베모·시다 카르틀리·므츠헤타-므티아네티·트빌리시를 표시하고(1724~1734년은 오스만, 1735~1743년은 페르시아의 직접 지배라 비움), 1762년부터 카르틀리-카헤티 왕국(이름만 바뀌어 이어짐, 같은 색). 페르시아의 종주는 이 지도에 없는 나라라 종속 관계로 두지 않음. 1590~1611년(콘스탄티노폴리스 조약·나수흐 파샤 조약)의 오스만 종주는 땅을 왕국으로 둔 채 종속 관계로 표시
  endNote: 1762년 카헤티 왕 헤라클리우스 2세가 아버지 테무라즈 2세를 이어 카르틀리 왕이 되며 카르틀리-카헤티 왕국으로 합쳐짐
  features:
    - 1555년 아마시아 조약으로 페르시아의 세력권이 되어 사파비 왕조의 종주를 받음
    - 1578~1612년 오스만의 종주 아래 트빌리시·고리에 오스만 수비대가 있었고 1590년 콘스탄티노폴리스 조약이 맺어짐
    - 1723~1735년 오스만에 점령되었고, 카르틀리 왕 바흐탕 6세는 1724년 러시아로 떠남
    - 1735년 나디르가 오스만군을 몰아냈고, 1744년 테무라즈 2세를 카르틀리 왕에 앉힘
    - 1747년 나디르 샤가 죽은 뒤 카헤티와 함께 사실상 독립함
  startEvents: [georgia-split-1463]
  endEvents: [georgia-kartli-kakheti-1723]
  basis:
    type: primary_source
    refs: ["바후슈티 바그라티오니, 『조지아 왕국의 기술』(1745)"]
    # 작업 메모: (정할 점 ⑨) / (FIX2_KARTLI_1735) / (작업 FIX2·FIX2b, 정할 점 FIX2-⑥) / (vassal_of) / (세션 J에서 오스만 땅 → 왕국, 정할 점 J1-④)
    foundingNote: 1490년 왕실 회의의 분할을 시작으로 봄

- id: kakheti
  level: polity
  names: { ko: 카헤티 왕국, en: Kingdom of Kakheti, native: კახეთის სამეფო }
  from: 1465
  to: 1762
  color: "#e86070"
  summary: 1465년 게오르기 8세가 카헤티로 옮겨 따로 다스리기 시작한 동쪽의 왕국(1490년 분할로 인정). 사파비 왕조의 종주를 받았고(1578~1605년 알렉산드레 2세는 오스만의 종주를 받아들임) 1614~1617년 아바스 1세의 침공으로 크게 무너짐. 1762년 헤라클리우스 2세가 카르틀리를 이어받아 카르틀리-카헤티 왕국으로 합쳐짐
  mapNote: 지도에는 1490~1761년 카헤티를 표시하고(1489년까지는 조지아 왕국, 1724~1734년은 오스만), 1762년부터 카르틀리-카헤티 왕국(이름만 바뀌어 이어짐). 1590~1611년(콘스탄티노폴리스 조약·나수흐 파샤 조약)의 오스만 종주는 종속 관계로 표시
  endNote: 1762년 헤라클리우스 2세가 카르틀리를 이어받아 카르틀리-카헤티 왕국으로 합쳐짐
  features:
    - 게오르기 8세는 1476년 죽을 때까지 카헤티를 다스림
    - 사파비 왕조의 종주를 받았고 1578~1605년 알렉산드레 2세는 오스만의 종주를 받아들임
    - 1614~1617년 아바스 1세의 침공으로 크게 무너짐
    - 순니파로 개종한 콘스탄티누스 2세는 오스만의 속국 왕으로 있다가(1725~1732) 살해됨
    - 1744년 나디르 샤가 헤라클리우스 2세를 카헤티 왕에 앉혔고 1747년 나디르 암살 뒤 사실상 독립함
  startEvents: [georgia-split-1463]
  endEvents: [georgia-kartli-kakheti-1723]
  basis:
    type: primary_source
    refs: ["바후슈티 바그라티오니, 『조지아 왕국의 기술』(1745)"]
    # 작업 메모: 작업 FIX2, 정할 점 FIX2-⑥ / (vassal_of) / (세션 J에서 오스만 땅 → 왕국, 정할 점 J1-④)
    foundingNote: 게오르기 8세가 카헤티에 자리 잡은 1465년을 시작으로 봄

- id: kartli-kakheti
  level: polity
  names: { ko: 카르틀리-카헤티 왕국, en: Kingdom of Kartli-Kakheti, native: ქართლ-კახეთის სამეფო }
  from: 1762
  to: 1801
  color: "#a05070"
  summary: 1762년 헤라클리우스 2세가 카르틀리와 카헤티를 합친 왕국. 1783년 게오르기옙스크 조약으로 러시아의 보호국이 되었고, 1795년 아가 무함마드 칸의 트빌리시 약탈을 겪은 뒤 1801년 러시아 제국에 병합됨
  mapNote: 지도에는 1762~1800년 동조지아와 로리·카자흐 쪽(아르메니아 북부의 조각)을 표시하고 1801년부터 러시아 땅
  endNote: 1800년 12월 러시아 황제 파벨 1세가 왕국을 러시아에 합친다고 선포했고, 1801년 알렉산드르 1세가 왕조를 없애는 선언으로 확정해 러시아 제국에 병합됨
  features:
    - 헤라클리우스 2세가 오스만과 이란의 압박 속에서 1783년 게오르기옙스크 조약으로 러시아의 보호를 받아들임
    - 러시아는 1787년 군대를 빼 갔고 1795년 아가 무함마드 칸이 트빌리시를 약탈해 불태웠을 때도 돕지 않음
    - 1798년 헤라클리우스 2세가 죽고 아들 게오르기 12세가 뒤를 이음
