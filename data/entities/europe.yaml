  from: 2008
  to: null
  color: "#b8706d"
  summary: 2008년 2월 코소보 의회가 독립을 선언함(코소보 공화국). 미국과 대부분의 유럽 연합 나라 등 유엔 회원국 약 절반이 승인했으나(한국은 2008년 3월 승인) 세르비아·러시아·중국 등은 인정하지 않음. 국제 사법 재판소는 2010년 독립 선언이 국제법을 어기지 않았다는 권고 의견을 냄(지도는 세르비아와 코소보 공화국의 귀속 논쟁 지역으로 표시)
  basis:
    type: primary_source
    refs: ["코소보 독립 선언(2008)", "국제 사법 재판소 권고 의견(2010)", "브뤼셀 협정(2013)"]

- id: kosovo
  level: polity
