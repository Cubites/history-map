- id: lordship-of-ireland
  level: polity
  names: { ko: 아일랜드 영주령, en: Lordship of Ireland, native: Tiarnas na hÉireann }
  from: 1171
  to: 1542
  color: "#7fae7f"
  summary: 헨리 2세의 침공(1171) 뒤 잉글랜드 왕이 영주로 다스린 아일랜드. 실제로는 더블린 둘레의 페일 밖을 게일계 영주들과 킬데어 백작 같은 앵글로노르만 귀족이 다스렸고, 헨리 8세가 1541년 아일랜드 왕국법으로 왕을 칭함
  mapNote: 지도에는 1171~1541년 왕의 땅인 페일(더블린·킬데어·미스·라우스)·웨스트미스와 앵글로노르만 백작령(오먼드·데즈먼드)·워터퍼드·웩스퍼드를 표시하고(1332년까지 얼스터 백작령과 코노트, 1368년까지 미들랜즈·칼로, 1317년까지 클레어 포함), 게일 영주들의 땅은 아일랜드 게일 영주들(묶음) 항목. 1542년부터는 아일랜드 왕국 항목(같은 색, 섬 전체)
  endNote: 1541년 헨리 8세가 아일랜드 의회에서 아일랜드 왕국법을 통과시켜 영주 대신 아일랜드 왕을 칭하면서 아일랜드 왕국으로 이어짐
  features:
    - 1177년 헨리 2세가 아들 존에게 '아일랜드 영주' 칭호를 줌
    - 1185년 존이 직접 건너왔으나 현지 영주들을 거스르고 돌아감
    - 실제로는 더블린 둘레의 페일 밖을 게일계 영주들과 킬데어 백작 같은 앵글로노르만 귀족이 다스림
    - 헨리 8세는 게일계 영주들에게 땅을 왕에게 바쳤다가 다시 받게 하는 '항복과 재수여' 정책으로 지배를 넓힘
