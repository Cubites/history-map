- id: bulgaria-second
  level: polity
  names: { ko: 불가리아 제2제국 (터르노보), en: Second Bulgarian Empire, native: Второ българско царство }
  from: 1185
  to: 1393
  color: "#e0a050"
  summary: 아센·페타르 형제가 동로마에 맞서 세운 불가리아 제2제국(수도 터르노보). 1300년 테오도르 스베토슬라프가 타타르의 영향에서 벗어나 1304년 흑해 항구들을 얻음. 1330년 벨부즈드 전투에서 세르비아에 졌고, 이반 알렉산다르(1331~1371) 때 1344년 필리포폴리스를 얻었으나 1356년 비딘(이반 스라치미르)이 갈라짐. 1371년 마리차 전투 뒤 이반 시시만이 오스만의 봉신이 되었고 1393년 7월 터르노보가 함락됨(1395년 니코폴에서 시시만 처형)
  mapNote: 지도에는 1185~1392년 표시. 비딘 차르국(1356~1396)과 도브루자 전제공국(1346~1388)은 따로 항목, 1300~1355년 비딘 공국(시시만 가문)은 분봉이라 이 나라로 그림
  endNote: 1393년 7월 바예지트 1세가 도읍 터르노보를 세 달 포위해 차지함. 마지막 황제 이반 시시만은 1395년 무렵 죽어 불가리아는 오스만에 흡수됨
  features:
    - 이사키오스 2세는 1187년 로베치 휴전으로 사실상 불가리아를 인정했고, 아센·페타르는 1190년 쿠만의 도움으로 동로마군을 꺾음
    - 1195년 이후에도 소피아와 자고라 쪽으로 넓어졌고, 1197년 막내 동생 칼로얀이 이음
    - 1300년 테오도르 스베토슬라프가 타타르의 영향에서 벗어나 1304년 흑해 항구들을 얻음
    - 1330년 벨부즈드 전투에서 세르비아에 졌고, 이반 알렉산다르(1331~1371) 때 1344년 필리포폴리스를 얻음
    - 1356년 비딘(이반 스라치미르)이 갈라졌고, 1371년 마리차 전투 뒤 이반 시시만이 오스만의 봉신이 됨
