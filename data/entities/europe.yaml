    - 877년 데인인이 머시아를 나눠 동쪽을 차지함
    - 878년 웨드모어와 886년 무렵 앨프레드-구트럼 조약으로 경계(와틀링가도)가 정해짐
    - 917~918년 에드워드 장형왕이 남부를, 927년 애설스탠이 요크를 얻음
