  from: 1371
  to: 1395
  color: "#a0c060"
  summary: 1371년 마리차 전투 뒤 오스만의 봉신이 된 마케도니아의 세르비아 영주들을 묶은 항목. 부카신의 아들 마르코 므르냐브체비치(프릴레프·오흐리드)와 데야노비치 형제(콘스탄틴 드라가시 — 벨부즈드·쿠마노보·슈티프·스트루미차·브라녜) 등. 1395년 로비네 전투에서 마르코와 드라가시가 오스만 편으로 싸우다 죽은 뒤 바예지트 1세가 땅을 합침
  mapNote: 영주마다 1만 km² 안팎이라 여러 영주국을 묶어 그림. 지도에는 1371~1394년 북마케도니아·벨부즈드(큐스텐딜)·멜니크·서마케도니아(1386년까지)를 표시하고 1371~1391년 부크 브란코비치의 스코피에도 근사로 함께 그림
  endNote: 1395년 로비네 전투에서 마르코와 드라가시가 오스만 편으로 싸우다 죽은 뒤 바예지트 1세가 땅을 합침
  features:
