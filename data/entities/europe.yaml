  mapNote: 지도에는 1112~1245년 표시하고 1246년부터 프로방스 백국(앙주 가문, 이름만 바뀌어 이어짐, 같은 색)
  endNote: 1209년 포르칼키에 백국을 합침. 1245년 라몬 베렝게르 4세가 죽자 막내딸 베아트리스가 상속해 1246년 앙주의 샤를(루이 9세의 동생)과 혼인하면서 바르셀로나 가문의 프로방스 백국은 끝남
