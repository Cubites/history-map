- id: dauphine
  level: polity
  names: { ko: 도피네 (비엔누아), en: Dauphiné of Viennois, native: Dauphiné de Viennois }
  from: 1029
  to: 1349
  color: "#b98ad0"
  summary: 알봉 백작 가문이 다스린 부르군트(아를) 왕국(신성 로마 제국) 안의 영방. 그르노블·비엔·브리앙송을 중심으로 했고 1317년 바로니를 더함. 1349년 로망 조약으로 앙베르 2세가 프랑스 왕 필리프 6세의 손자 샤를에게 넘겨, 그 뒤 프랑스 왕세자가 '도팽'이라 불림
  mapNote: 부르군트 왕국 안의 실제 정치 단위를 따로 그림. 지도에는 1033~1348년 이제르·드롬·오트잘프(발랑티누아·디우아 백작령은 근사)를 표시
  endNote: 1349년 로망 조약으로 앙베르 2세가 영지를 프랑스 왕 필리프 6세의 손자 샤를에게 넘김. 그 뒤 프랑스 왕세자를 '도팽'이라 부르게 됨
  features:
    - 부르군트 왕의 힘이 약해 영주들을 누르지 못하는 가운데 알봉의 백작 기그 1세가 땅을 모음
    - 1033년 콘라트 2세가 부르군트 왕으로 대관한 뒤 실제 정치는 도피네 같은 지방 단위로 돌아감
    - 그르노블·비엔·브리앙송을 중심으로 했고 1317년 바로니를 더함
  startEvents: [arles-burgundy-1003]
  endEvents: [hundred-years-war-1337]
