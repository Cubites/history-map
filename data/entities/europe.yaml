  details: 디오클레티아누스(284~305)가 3세기 위기를 끝내고 사두정치와 속주 개편을 했고, 콘스탄티누스 1세(306~337)가 그리스도교를 공인하고 콘스탄티노폴리스(330)를 세움. 363년 요비아누스가 페르시아에 티그리스강 건너 땅을 넘겼고, 376년 도나우강을 건넌 고트족에게 378년 아드리아노폴리스에서 발렌스가 전사함. 앞 시기에는 아우구스투스가 칸타브리아(기원전 19)·알프스와 노리쿰(기원전 16~15)·판노니아(기원전 9)를 더했고, 9년 토이토부르크에서 바루스의 세 군단을 잃은 뒤 라인강·도나우강이 국경이 됨. 클라우디우스의 브리타니아(43)·트라키아(46), 트라야누스의 다키아(106)와 아르메니아·메소포타미아(114~117)로 가장 넓어졌고, 3세기 위기에 아그리 데쿠마테스(260)·다키아(271)를 버림
  mapNote: 원수정의 시작(기원전 27년)을 시작으로 봄. 사두정치와 형제 황제의 분담은 그리지 않고, 395년부터 서로마 제국·동로마 제국이 잇는다(계승). 색은 서로마 제국과 같음. 기원전 509~28년은 로마 공화정이 앞서고 기원전 27년부터 이 나라. 지도에는 기원전 27~기원후 394년 표시(종속 왕국은 병합 해부터, 260~273년 갈리아·브리타니아와 260~268년 히스파니아는 갈리아 제국)
  endNote: 378년 아드리아노폴리스에서 발렌스가 전사한 뒤 395년 테오도시우스 1세가 죽어 서쪽 호노리우스·동쪽 아르카디우스에게 나뉘며 서로마 제국과 동로마 제국으로 이어짐
