    - 브르타뉴(1532 합병), 메스·툴·베르됭(1552)과 오버엘자스(1648 베스트팔렌 조약)를 얻음
    - 네이메헌 조약(1678)으로 프랑슈콩테를 얻고 1766년 로렌 공국, 1768년 코르시카를 합침
