    - 1319년 네오파트라스 공국을 더했고, 1388년 피렌체 출신 네리오 아차이우올리가 차지함
    - 1394년 바예지트 1세가 살로나·네오파트라스를 빼앗음
    - 네리오의 유언으로 테베·리바디아는 서자 안토니오 1세가, 아테네는 1395~1402년 베네치아가 다스림
