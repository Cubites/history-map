  mapNote: 같은 나라를 이은 두 왕조를 한 나라로 그림(1만 km²를 크게 넘어 아나톨리아 베이국들 묶음과 따로). 지도에는 1335~1397년 아나톨리아 중부(시바스·토카트·카이세리·아크사라이·니으데·네브셰히르·크르셰히르·요즈가트와 1353년까지 앙카라, 1391년까지 아마스야·초룸)를 대략 표시
  endNote: 1398년 카디 부르하네딘이 아크코윤루와 싸우다 죽은 뒤 바예지트 1세가 시바스·토카트·카이세리를 차지함
  features:
