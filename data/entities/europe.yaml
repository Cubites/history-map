# 오스만 제국과 발칸
- id: ottoman
  level: polity
  names: { ko: 오스만 제국, en: Ottoman Empire, native: Devlet-i Âliye-i Osmâniyye }
  from: 1299
  to: 1922
  color: "#b5845a"
  summary: 아나톨리아·발칸·아랍 지역을 다스린 이슬람 제국. 메흐메트 2세가 콘스탄티노폴리스(1453)를 정복하고 세르비아(1459)·모레아(1460)·트레비존드(1461)·보스니아(1463)·카라만(1468)·알바니아(1479 조약)를 합치고 크림 칸국을 종속국으로 삼음(1475 카파 정복, 1478). 바예지트 2세가 몰다비아의 킬리아·아케르만을 빼앗음(1484, 1486 강화로 확인). 셀림 1세가 찰디란 전투(1514) 뒤 동아나톨리아와 맘루크 술탄국(1516~1517)을 정복함. 술레이만 1세가 로도스(1522)를 얻고 모하치 전투(1526) 뒤 부다(1541, 1547년 휴전으로 인정)·테메슈바르(1552, 1562년 조약)·시게트바르(1566, 1568년 조약)를 차지해 헝가리 가운데를 다스렸으며, 벤데르·부자크(1538)를 직할령으로 하고 아마시아 조약(1555)으로 반을, 1573년 조약으로 키프로스를 얻음. 콘스탄티노폴리스 조약(1590)으로 얻은 캅카스를 나수흐 파샤 조약(1612)으로 페르시아에 돌려주고, 칸디아 전쟁 끝에 크레타를 얻고(1669) 부차치 조약(1672)으로 포딜리아를 얻었으나, 빈 포위(1683)에 실패한 뒤 대튀르크 전쟁에 져 카를로비츠 조약(1699)으로 헝가리·트란실바니아·포딜리아·모레아를 잃고 프루트 조약(1711)으로 아조프를 되찾았으며(1739년 베오그라드 조약으로 러시아), 파사로비츠 조약(1718)으로 바나트·북세르비아를 넘겼으나 모레아를 되찾았고, 베오그라드 조약(1739)으로 북세르비아를 되찾음. 1724~1735년 페르시아의 캅카스(동조지아·아르메니아·아제르바이잔)를 차지함. 러시아에 져 퀴췩카이나르자 조약(1774)으로 크림 칸국의 종주권을 잃고 야시 조약(1792)으로 흑해 북쪽 기슭(예디산)을, 부쿠레슈티 조약(1812)으로 베사라비아를 넘김. 19세기에 그리스(1830)·세르비아·루마니아·몬테네그로(1878)·불가리아(1908)가 떨어져 나가 '유럽의 병자'로 불림. 탄지마트 개혁(1839~1876)과 청년 튀르크 혁명(1908)을 겪었고 발칸 전쟁(1912~1913)으로 유럽 땅을 대부분 잃음. 법적 주권은 남았지만 다른 나라가 점령·통치한 보스니아(1878~)·키프로스(1878~)·도데카니사(1912~)는 오스만 색의 점령지로 따로 표시함. 지도에는 유럽 권역 안(발칸·아나톨리아·키프로스·캅카스 일부)만 표시하고 중동·북아프리카는 아직 그리지 않음. 1차 대전에 동맹국으로 참전해 1918년 무드로스 휴전으로 항복함. 1920년 세브르 조약으로 분할될 처지에 놓였으나 무스타파 케말의 앙카라 정부가 그리스군을 몰아냈고 1922년 11월 술탄제가 폐지되어 무너짐(1923년 튀르키예). 지도의 1920~1922년은 앙카라 정부가 다스린 땅을 이 항목으로 표시
  basis:
    type: primary_source
    refs: ["야시 조약(1792)", "부쿠레슈티 조약(1812)", "베를린 조약(1878)", "런던 조약(1913)", "콘스탄티노폴리스 조약(1913)", "무드로스 휴전 협정(1918)", "세브르 조약(1920)"]
    foundingNote: 오스만 1세가 나라를 세운 1299년을 시작으로 봄

- id: greece
  level: polity
  names: { ko: 그리스, en: Greece, native: Ελλάδα }
  from: 1830
  to: null
  color: "#6fa3cc"
  summary: 1821년 독립 전쟁을 일으켜 1830년 런던 의정서로 독립을 인정받고 1832년 왕국이 됨. 1864년 영국에게서 이오니아 제도, 1881년 테살리아를 얻고, 발칸 전쟁(1912~1913)으로 마케도니아 남부·에피루스 남부·크레타·에게해 섬들을 얻음. 1919년 뇌이 조약으로 서트라키아를 얻고 소아시아에 출병했으나 그리스-튀르키예 전쟁에 져 1923년 로잔 조약으로 튀르키예와 주민을 교환함. 1941~1944년 독일·이탈리아·불가리아에 점령됨(지도에서는 그리스 영토 위의 점령으로 표시하고 불가리아가 병합한 동마케도니아·서트라키아는 불가리아로 그림). 1946~1949년 내전을 겪었고 1947년 파리 강화 조약으로 도데카니사 제도를 얻음. 1967~1974년 군사 정권이 다스림
  basis:
    type: primary_source
    refs: ["런던 의정서(1830)", "콘스탄티노폴리스 조약(1832)", "부쿠레슈티 조약(1913)", "뇌이 조약(1919)", "로잔 조약(1923)", "파리 강화 조약(1947)"]
    foundingNote: 독립을 인정받은 1830년을 시작으로 봄(1822년 임시 정부, 1832년 왕국). 지도의 1830년 경계는 1832년에 확정된 아르타-볼로스선을 씀

