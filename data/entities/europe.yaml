- id: brittonic-kingdoms
  level: polity
  names: { ko: 브리튼인 왕국들 (묶음), en: Brittonic kingdoms, native: Brythoniaid }
  from: 410
  to: 800
  color: "#98805c"
  summary: 로마가 브리타니아에서 물러난(410) 뒤 브리튼인이 세운 왕국들을 묶은 항목. 덤노니아(데번·콘월)·레게드(컴브리아)·엘멧·고도딘(로디언)과 잉글랜드 중·서부의 소왕국들, 브리튼인이 옮겨 가 세운 아르모리카(브르타뉴)의 돔노네·코르누아유·브로 와로크. 앵글로색슨의 확장(6~8세기)과 799년 프랑크의 브르타뉴 정복으로 줄어듦
  mapNote: 여러 왕국을 묶어 그림. 지도에는 410~799년 표시(410 브리타니아 포기 뒤 잉글랜드와 고도딘(로디언), 410~449년 알트 클루트, 461 아르모리카 서쪽. 앵글로색슨의 몫은 450년부터). 웨일스 왕국들·스트래스클라이드는 따로, 콘월은 800년부터 웨식스 땅으로 둔 근사라 800년에 바뀌어 보임
  endNote: 6~8세기 앵글로색슨의 확장과 799년 프랑크의 브르타뉴 정복으로 줄어듦
  features:
    - 덤노니아(데번·콘월)·레게드(컴브리아)·엘멧·고도딘(로디언)과 잉글랜드 중·서부의 소왕국들이 있었음
    - 5~7세기 브리튼인이 아르모리카로 옮겨 가 돔노네·코르누아유·브로 와로크를 세움
    - 578년 와로크 2세가 프랑크 왕 킬페리크 1세의 군대와 싸운 끝에 벤느에 대한 프랑크의 주권을 인정함
  startEvents: [britain-end-407]
  endEvents: [brittany-578]
  basis:
