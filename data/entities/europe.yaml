  summary: 그레이트브리튼섬과 아일랜드(1922년 뒤로는 북아일랜드)를 아우르는 왕국. 1801년 1월 연합법으로 아일랜드 왕국을 합치기 전은 그레이트브리튼 왕국. 러시아의 남하를 막는다며 거문도를 불법 점령하고(1885~1887), 영일 동맹(1902·1905)으로 일본의 한국 지배를 인정함. 6·25 전쟁 때 유엔군으로 참전함. 유럽의 식민지 가운데 키프로스(1960)·몰타(1964)가 독립함(지브롤터와 키프로스의 영국 주권 기지 지역은 지금도 영국령)
