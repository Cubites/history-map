    - 러요시 1세가 1353년 스테판 2세 코트로마니치의 딸 엘리자베타와 혼인해 보스니아와 가까워짐
    - 트브르트코 1세(1353~1391)가 1373년 폴림리예·위쪽 드리나를 얻음
