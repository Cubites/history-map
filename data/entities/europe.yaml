  details: 스톨보보 조약(1617)으로 잉그리아·케크스홀름을, 알트마르크 휴전(1629)으로 리보니아를, 브룀세브로 조약(1645)으로 고틀란드·외셀·옘틀란드·할란드를, 베스트팔렌 조약(1648)으로 포메른·브레멘-페르덴을, 로스킬레 조약(1658)으로 스코네·블레킹에·보후슬렌을 얻어 발트해의 강국이 됨(구스타브 2세 아돌프는 30년 전쟁에 개입함). 카를 12세가 대북방 전쟁(1700~1721)에서 러시아에 져(1709년 폴타바 전투) 스톡홀름 조약(1719·1720)으로 브레멘-페르덴·슈테틴을, 뉘스타드 조약(1721)으로 리보니아·에스토니아·잉그리아·카렐리야 일부를 잃었고, 오보 조약(1743)으로 핀란드 동남부를 러시아에 넘김. 1808~1809년 러시아와의 전쟁에 져 프레드릭스함 조약(1809)으로 핀란드를 잃었고, 1810년 프랑스 원수 베르나도트를 왕위 계승자로 맞음. 1814년 킬 조약으로 노르웨이를 얻어 스웨덴-노르웨이 연합 왕국이 됨
  mapNote: 지도에는 1523년 이후만 표시하고(1522년까지는 스웨덴 왕국 (중세) 항목, 같은 색. 라플란드·노를란드 북부의 라프마르크는 1553년, 카이누·북사보·북오스트로보트니아 동쪽 내륙은 1595년부터 칠함), 1814~1905년은 스웨덴-노르웨이, 1905년부터는 스웨덴 항목
  endNote: 1814년 킬 조약으로 노르웨이를 얻어 스웨덴-노르웨이 연합 왕국이 됨
  features:
