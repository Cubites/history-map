- id: polish-duchies
  level: polity
  names: { ko: 폴란드 공국들 (묶음), en: Polish duchies (grouped), native: Księstwa polskie }
  from: 1138
  to: 1351
  color: "#f0c0c0"
  summary: 볼레스와프 3세의 유언(1138)으로 나뉜 뒤의 피아스트 공국들을 묶은 항목(소폴란드·대폴란드·쿠야비·시에라츠·웽치차·마조프셰·슐레지엔·포메렐리아). 1300~1305년 보헤미아 왕 바츨라프 2세가 폴란드 왕을 겸했고, 1320년 브와디스와프 1세(우쿠타)가 왕으로 대관해 폴란드 왕국으로 다시 합침. 슐레지엔 공국들은 1327·1329년 보헤미아 왕에게 신서하고, 마조프셰는 1351년 폴란드 왕의 봉신이 됨. 포메렐리아는 1308~1309년 튜턴 기사단이 차지
  mapNote: 지도에는 1138~1350년만 표시 — 1300~1319년 소폴란드·대폴란드·쿠야비(바츨라프 2세의 왕국(1300~1305)과 글로구프 공의 대폴란드(1306~1314)를 묶음), 1328년까지 슐레지엔, 1308년까지 포메렐리아, 1350년까지 마조프셰
  endNote: 1320년 브와디스와프 1세(우쿠타)가 왕으로 대관해 폴란드 왕국으로 다시 합침. 1351년 마조프셰 공들이 폴란드 왕의 봉신이 됨
  features:
    - 맏아들 브와디스와프 2세는 슐레지엔과 크라쿠프 중심 대공령을, 나머지 아들들은 마조프셰·대폴란드·산도미에시 몫을 받음
    - 1300~1305년 보헤미아 왕 바츨라프 2세가 폴란드 왕을 겸함
    - 1308년 11월 그단스크가 불러들인 튜턴 기사단에 넘어가 포메렐리아와 발트해 출구를 잃음
    - 슐레지엔 공국들은 1327·1329년 보헤미아 왕에게 신서함
  startEvents: [boleslaw-iii-1102]
  endEvents: [poland-reunification-1320]
