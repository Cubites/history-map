    foundingNote: 894~895년 마자르가 동로마의 청으로 불가리아를 친 사이 페체네그가 시메온과 손잡고 에텔쾨즈를 차지함

- id: croatia-kingdom
  level: polity
  names: { ko: 크로아티아 왕국, en: Kingdom of Croatia, native: Kraljevstvo Hrvatska }
  from: 925
  to: 1102
  color: "#d06090"
  summary: 토미슬라브(925) 이래 트르피미로비치 가문이 다스린 왕국(달마티아 배후지·리카·슬라보니아). 페타르 크레시미르 4세(1058~1074)가 달마티아 도시들을 얻었고, 즈보니미르가 죽은 뒤 헝가리의 라슬로 1세가 1091년 슬라보니아를 차지. 1097년 그보즈드 전투에서 마지막 왕 페타르 스나치치가 죽고 1102년 헝가리 왕 칼만이 크로아티아 왕으로 대관함(헝가리와 동군)
  mapNote: 토미슬라브의 대관(925)을 시작으로 봄(크로아티아 공국에서 이름만 바뀌어 이어짐). 1102년부터는 1200년 지도처럼 헝가리 색(동군이지만 헝가리 왕관의 땅). 지도에는 925~1101년(슬라보니아는 925~1090년, 보스니아는 960년부터) 표시
  endNote: 1097년 그보즈드 전투에서 헝가리군이 마지막 왕 페타르 스나치치를 꺾었고, 1102년 헝가리 왕 칼만이 크로아티아 왕으로 대관해 헝가리와 같은 왕이 다스리는 동군 연합을 이룸
  features:
    - 925년 교황 요한 10세의 편지가 토미슬라브를 '크로아티아인의 왕'으로 불렀고 925·928년 스플리트에서 교회 회의가 열림
    - 토미슬라브가 926년 무렵 시메온의 불가리아군을 동보스니아 쪽에서 무너뜨렸다고 전함
    - 『두클랴 사제 연대기』의 전승은 960년 무렵 차슬라프가 죽자 보스니아가 크로아티아로 넘어갔다고 전함
    - 페타르 크레시미르 4세(1058~1074)가 달마티아 도시들을 얻음
    - 즈보니미르가 죽은 뒤 헝가리의 라슬로 1세가 1091년 슬라보니아를 차지함
