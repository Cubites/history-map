    - 수도는 처음 쾰른, 271년부터 트리어였고 로마와 같은 원로원과 집정관을 두었음
    - 269년 포스투무스가 제 군대에 살해되고 마리우스를 거쳐 빅토리누스(269~271)·테트리쿠스 1세(271~274)가 이음
