  from: 1919
  to: 1922
  color: "#b5845a"
  summary: 1919년 5월 그리스군이 이즈미르(스미르나)에 상륙해 차지한 오스만 제국의 땅. 1920년 세브르 조약이 스미르나 지역의 그리스 관리와 동트라키아의 그리스 귀속을 정했고, 그리스군은 1921년 앙카라 가까이까지 나아갔으나 사카리아 전투에 져 1922년 9월 쫓겨남. 1923년 로잔 조약으로 튀르키예 영토로 확정되고 두 나라가 주민을 교환함. 지도는 해마다 그해 말 그리스군 점령 범위를 도 단위로 대략 그림
  basis:
    type: primary_source
    refs: ["세브르 조약(1920)", "무다냐 휴전 협정(1922)", "로잔 조약(1923)"]

# 2차 대전 점령지
