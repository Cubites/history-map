  mapNote: 여러 세력을 묶어 그림. 지도에는 867~953년 요크·동앵글리아(869~916)·에식스(880~916)·다섯 버러(877~917, 940~941)를 표시
  endNote: 954년 노르웨이의 에이리크 피도끼왕이 쫓겨나 죽으면서 요크 왕국이 끝나고 노섬브리아는 잉글랜드 왕의 땅이 됨
  features:
