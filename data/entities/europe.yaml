  from: 1000
  to: 1186
  color: "#60b0b0"
  summary: 지금의 몬테네그로·알바니아 북부(슈코드라)·헤르체고비나에 있던 세르비아계 공국·왕국. 요반 블라디미르(사무일의 봉신)를 거쳐 스테판 보이슬라브가 1042년 바르 전투에서 동로마를 이겨 자립했고, 미하일로가 1077년 교황에게 왕관을 받음. 보딘(1081~1101) 때 라슈카·보스니아까지 다스렸으나 뒤에 기울어 1186년 라슈카의 스테판 네마냐가 차지함(제타)
  mapNote: 지도에는 1000~1185년 몬테네그로·슈코드라·트라부니아·자훔리예(헤르체고비나)를 표시하고 1186년부터 세르비아 대공국
  endNote: 1186년 무렵 라슈카의 스테판 네마냐가 두클랴(제타)를 차지해 세르비아 대공국으로 이어짐
  features:
