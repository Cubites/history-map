    foundingNote: 이슈트반 1세가 대관한 1000년을 시작으로 봄

- id: bohemia-kingdom
  level: polity
  names: { ko: 보헤미아 왕국, en: Kingdom of Bohemia, native: České království }
  from: 1198
  to: 1526
  color: "#9b7cb6"
  summary: 보헤미아·모라비아·슐레지엔·라우지츠로 이루어진 보헤미아 왕관령. 후스 전쟁 뒤 이르지 포데브라디(1458~1471)가 다스렸고, 헝가리의 마티아스 코르비누스와 왕위를 다퉈 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 그에게 넘겼다가 그가 죽은 1490년 되찾음. 1471년부터 야기에우워 가문의 블라디슬라프 2세가 왕이었고 1490년 헝가리 왕을 겸함. 1526년 러요시 2세가 죽어 합스부르크 가문의 페르디난트 1세가 왕이 됨
  mapNote: 지도에는 1198~1525년만(오타카르 2세의 오스트리아 1251·슈타이어마르크 1261·케른텐과 크라인 1269~1275, 슐레지엔은 1329년, 오버라우지츠는 1320년, 니더라우지츠는 1369년부터) 표시하고 1526년부터는 합스부르크 군주국 땅. 신성 로마 제국에 속했으나 따로 그림
  endNote: 1526년 모하치 전투에서 러요시 2세가 죽고, 합스부르크 가문의 페르디난트 1세가 보헤미아 왕이 됨
  features:
    - 1212년 프리드리히 2세의 시칠리아 금인칙서로 오타카르 1세의 왕 칭호가 세습으로 굳어짐
    - 후스 전쟁 뒤 이르지 포데브라디(1458~1471)가 다스림
    - 1471년부터 야기에우워 가문의 블라디슬라프 2세가 왕이었고 1490년 헝가리 왕을 겸함
    - 마티아스 코르비누스와 왕위를 다퉈 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 그에게 넘겼다가 1490년 되찾음
  startEvents: [bohemia-kingdom-1085]
  endEvents: [mohacs-1526]
