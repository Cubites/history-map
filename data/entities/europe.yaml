  to: 1230
  color: "#b070d0"
  summary: 아스투리아스 왕국이 수도를 레온으로 옮겨 이어진 왕국(갈리시아·아스투리아스·레온·사모라·살라망카). 알폰소 9세(1188~1230)가 1229년 카세레스, 1230년 메리다·바다호스를 얻었고, 1230년 그가 죽자 아들 카스티야 왕 페르난도 3세가 이어 카스티야와 하나가 됨
  mapNote: 지도에는 910~1229년 표시(아스투리아스 왕국에서 이름만 바뀌어 이어짐, 같은 색)하고 1230년부터 카스티야 왕국(이름만 바뀌어 이어짐)
  endNote: 1230년 알폰소 9세가 죽자 아들 카스티야 왕 페르난도 3세가 이어 카스티야와 하나가 되었고 이후 다시 갈라지지 않음
  features:
