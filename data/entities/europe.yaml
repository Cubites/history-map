  mapNote: 오토 1세가 황제 대관을 받은 962년을 시작으로 봄. 동프랑크가 이름만 바뀌어 이어짐(같은 색). 지도에는 합스부르크 세습령·프로이센 땅·덴마크 왕의 홀슈타인·스웨덴령 포메른과 브레멘-페르덴·로렌을 뺀 영방(바이에른·작센·하노버·뷔르템베르크·팔츠·마인츠·쾰른·트리어 등)을 하나로 묶어 표시함. 지도에는 962년 이후만 묶음으로 표시(1200~1299년 호엔슈타우펜·대공위 시대의 영방 묶음(오스트리아는 1250년까지·1276~1281년, 홀슈타인은 1201~1224년 덴마크), 1300~1399년에는 리옹 1319년까지·케른텐 1334년까지·티롤 1362년까지·프랑슈콩테 1383년까지 포함)(1525년까지 합스부르크 세습령·보헤미아 왕관령·튜턴 기사단국은 따로)
  endNote: 1803년 제국 대표자 회의 주요 결의로 교회령·자유시 대부분이 정리된 뒤, 1806년 라인 동맹이 생기자 프란츠 2세가 제위를 내놓아 해체됨
  features:
    - 1273~1291년 루돌프 1세 때 합스부르크의 오스트리아가 자리 잡고 스위스 서약(1291)이 맺어짐
    - 1517~1521년 루터의 95개조 반박문으로 종교 개혁이 시작되었고, 1546~1556년 슈말칼덴 전쟁을 거쳐 카를 5세가 퇴위함
    - 30년 전쟁 뒤 베스트팔렌 조약(1648)으로 영방의 주권이 넓어지고 스위스·네덜란드의 독립을 인정함
    - 같은 조약으로 포메른·브레멘-페르덴을 스웨덴에, 오버엘자스를 프랑스에 넘김
    - 1797~1801년 라인강 왼쪽을 프랑스에 넘기고, 땅을 잃은 제후들은 제국 안의 다른 땅으로 보상받기로 함
