  mapNote: 지도에는 1259~1329년 이메레티·라차·메그렐리아·구리아·압하지야·아자리아를 표시
  endNote: 다비드 6세 나린의 아들 콘스탄티네 1세·미하일 등이 이었음. 1329~1330년 동조지아의 게오르기 5세가 쿠타이시를 차지해 조지아 왕국에 다시 합침
