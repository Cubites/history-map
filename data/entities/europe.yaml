# 지중해의 섬나라
- id: cyprus
  level: polity
  names: { ko: 키프로스, en: Republic of Cyprus, native: Κυπριακή Δημοκρατία }
  from: 1960
  to: null
  color: "#d9a66b"
  summary: 1878년부터 영국이 다스리고 1925년 직할 식민지가 된 섬에서 그리스계 주민의 무장 투쟁(EOKA, 1955~1959) 끝에 1959년 취리히·런던 협정을 맺어 1960년 8월 독립한 공화국(마카리오스 대통령). 그리스계·튀르키예계 주민이 권력을 나누는 헌법이 1963년 충돌로 무너져 1964년 유엔 평화 유지군이 들어옴. 1974년 7월 그리스 군사 정권이 꾀한 쿠데타 뒤 튀르키예군이 북부를 차지해 섬이 나뉨(북키프로스 항목). 영국은 아크로티리·데켈리아 주권 기지 지역을 지금도 가짐(지도에는 영국 땅으로 그림)
  mapNote: 1878~1914년은 영국 관리 키프로스 항목, 1914~1959년 영국 식민지 시기는 지도에 그리지 않음
  features:
    - 헌법은 대통령·부통령의 거부권과 공직·의석의 70대 30 배분 등으로 그리스계와 튀르키예계가 권력을 나누게 함
    - 영국·그리스·튀르키예는 보장 조약으로 이 질서를 보장하며 필요하면 행동할 권리를 가짐
    - 영국은 아크로티리·데켈리아 기지를 주권 지역으로 남겨 지금도 가짐
    - 1963년 12월 헌법 갈등 끝에 두 공동체의 충돌이 번졌고 1964년 3월 유엔 키프로스 평화 유지군이 들어옴
    - 1974년 7월 그리스 군사 정권이 꾀한 쿠데타 뒤 튀르키예군이 북부를 차지해 섬이 나뉨(북키프로스 항목)
  startEvents: [cyprus-independence-1960]
  basis:
    type: primary_source
    refs: ["취리히·런던 협정(1959)", "키프로스 설립 조약(1960)", "유엔 안전 보장 이사회 결의 186호(1964)"]
    foundingNote: 독립한 1960년 8월 16일을 시작으로 봄

