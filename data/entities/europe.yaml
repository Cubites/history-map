- id: first-bulgarian-empire
  level: polity
  names: { ko: 불가리아 제1제국, en: First Bulgarian Empire, native: Първо българско царство }
  from: 681
  to: 1018
  color: "#e0a050"
  summary: 아스파루흐의 불가르인이 681년 다뉴브강 남쪽에 세운 나라. 시메온 1세 때 가장 넓었고, 971년 동부를 동로마에 잃은 뒤 사무일(997~1014 차르)이 오흐리드·프레스파를 중심으로 서부를 지킴. 1014년 클레이디온 전투 뒤 바실리오스 2세(불가르인 학살자)가 1018년까지 정복함
  mapNote: 지도에는 681~1017년 표시(681 아스파루흐의 모이시아·도브루자·부자크·왈라키아, 705~762 자고라, 809 세르디카, 816 자고라, 836 필리포폴리스, 842 마케도니아, 904 중앙 마케도니아(피에리아는 986 사무일의 테살리아와 함께), 971 동부를 잃음, 986 사무일, 1000~1017년 사무일의 땅(마케도니아·알바니아·서불가리아·라슈카·스렘, 1002년까지 비딘)). 중앙 마케도니아(베로이아·보데나, 피에리아 포함)는 1000년까지(1001 바실리오스 2세), 1001년 세르비아(서마케도니아)·1004년 스코페·1005년 디라키온은 1018년에 묶은 근사
  endNote: 1014년 클레이디온 전투에서 바실리오스 2세에게 크게 진 뒤, 1018년 이반 블라디슬라프가 디라키온을 포위하다 전사하자 귀족들이 항복해 동로마가 정복을 마침
  features:
    - 소수의 불가르 지배층 아래 일곱 슬라브 부족과 세베리가 있었다고 테오파네스는 적음
    - 보리스 1세가 864년 무렵 세례를 받았고 프레슬라프 회의가 슬라브어를 교회어로 정함
    - 시메온 1세(재위 893~927) 때 가장 넓었고 917년 '불가르인과 로마인의 차르'를 칭함
    - 927년 시메온이 죽자 아들 페타르 1세가 동로마와 화해해 차르 칭호와 총대주교구를 인정받음
    - 971년 동부를 동로마에 잃은 뒤 사무일(997~1014 차르)이 오흐리드·프레스파를 중심으로 서부를 지킴
  startEvents: [kubrat-asparukh-632]
  endEvents: [basil-ii-1000]
  basis:
    type: primary_source
    refs: ["요안니스 스킬리치스, 『역사 개요』", "『두클랴 사제의 연대기』"]
    # 작업 메모: (작업 M4) / 작업 FIX4 / 앞 시기는 / 작업 M5에서 넓힘 / 작업 M5에서 800년부터로 넓힘(809 세르디카, 816 자고라, 836 필리포폴리스, 842 마케도니아, 904 중앙 마케도니아(피에리아는 986 사무일의 테살리아와 함께, 작업 FIX4), 971 동부를 잃음, 986 사무일) / 작업 M6에서 681년부터로 넓힘(681 아스파루흐의 모이시아·도브루자·부자크·왈라키아, 705~762 자고라, 정할 점 M6-⑰)
    foundingNote: 아스파루흐의 정착(681)을 시작으로 봄

- id: duklja
  level: polity
