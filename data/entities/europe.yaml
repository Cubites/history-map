- id: carthage
  level: polity
  names: { ko: 카르타고, en: Carthage, native: Qart-ḥadašt }
  from: -813
  to: -145
  color: "#7a4fa0"
  summary: 티로스의 페니키아인이 북아프리카에 세운 도시(전승 기원전 814년)로 서지중해의 해상 세력이 됨. 제1차 포에니 전쟁(264~241)으로 시칠리아를, 용병 전쟁 뒤 사르데냐·코르시카(238)를 로마에 잃었고, 하밀카르 바르카(237~229)·하스드루발(229~221)·한니발(221~)이 히스파니아 남부·동부를 차지함(카르타고 노바 227). 한니발이 이탈리아로 쳐들어간 제2차 포에니 전쟁(218~201)에서 져 히스파니아(206)를 잃었고, 기원전 146년 스키피오 아이밀리아누스가 도시를 무너뜨림
  mapNote: "도시 건설(기원전 814년, 전승)을 시작으로 봄. 기원전 237년 전 가데스·말라카 같은 페니키아 도시는 1만 km² 미만이라 그리지 않음(근사). 기원전 146년부터 로마. 지도 범위 안 땅만 그림. 지도에는 기원전 650~147년 표시: 기원전 650년(654 에부수스)부터 147년까지 이비사·포르멘테라, 509년(첫 로마-카르타고 조약)부터 사르데냐·시칠리아 서부·몰타, 405~393년과 272년(276 피로스가 떠난 뒤)부터 시칠리아 남부(아크라가스·겔라·카마리나·헨나), 기원전 264~242년 시칠리아 서부, 264~239년 사르데냐·코르시카, 264~219년 몰타, 237~207년 히스파니아 남부(237 투르데타니아, 228 오레타니·바스테타니·콘테스타니와 카르타고 노바, 220 올카데스·카르페타니, 219 사군툼, 209 카르타고 노바를 잃음)"
  endNote: 기원전 146년 스키피오 아이밀리아누스가 도시에 쳐들어가 엿새 시가전 끝에 불태워 무너뜨림. 땅은 아프리카 속주가 됨
  features:
