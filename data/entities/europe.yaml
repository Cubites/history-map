    foundingNote: 잔다르 베이가 카스타모누를 받은 1292년 무렵을 시작으로 봄

- id: dulkadir-beylik
  level: polity
  names: { ko: 둘카디르 베이국, en: Dulkadirid Beylik, native: Dulkadiroğulları Beyliği }
  from: 1337
  to: 1522
  color: "#8fa7c9"
