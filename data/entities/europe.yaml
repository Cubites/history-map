  from: 1912
  to: 1922
  color: "#b5845a"
  summary: 이탈리아-튀르크 전쟁(1911~1912) 중 이탈리아가 점령한 오스만 제국의 섬들(로도스·코스 등). 우시 조약(1912)은 반환을 약속했으나 점령이 이어졌고 1923년 로잔 조약으로 이탈리아 영토가 됨
  basis:
    type: primary_source
    refs: ["우시 조약(1912)", "로잔 조약(1923)"]

# ── 1789~1814년 유럽 뼈대 (작업 E3, 영토는 scripts/geo/areas/europe.mjs의 '1789~1814 조각 소유표') ──
# 항목 나누는 법: 이름·정체만 바뀌고 같은 나라가 이어지면 한 항목에 설명을 붙이고(프랑스 왕국·공화국·제국, 스위스·헬베티아 공화국, 영국의 그레이트브리튼 시기),
# 다른 나라가 들어서면(위성국·연합) 새 항목으로 나눈다. 한 항목의 영토는 끊기지 않게 한다: 나라는 이어졌는데 그 사이를 다른 항목(연합 왕국 등)으로 그렸으면
# 앞 시기를 따로 항목으로 떼어 낸다(스웨덴 왕국 1523~1814 / 스웨덴-노르웨이 1814~1905 / 스웨덴 1905~). 실제로 나라가 없어졌다 돌아온 경우(교황령 1809~1813)는 같은 항목에 두고 '영토 없음' 경고를 남긴다

# 영국·아일랜드
- id: ireland-kingdom
  level: polity
  names: { ko: 아일랜드 왕국, en: Kingdom of Ireland, native: Ríocht na hÉireann }
  from: 1542
  to: 1800
  color: "#7fae7f"
  summary: 잉글랜드(1707년부터 그레이트브리튼) 왕이 왕을 겸하고 더블린에 따로 의회를 둔 나라. 1798년 아일랜드 연합파 봉기를 겪은 뒤 1800년 연합법으로 그레이트브리튼과 합쳐 1801년 1월 연합 왕국(영국)이 됨
  basis:
    type: primary_source
    refs: ["아일랜드 왕위법(1542)", "연합법(1800)"]
    foundingNote: 헨리 8세가 아일랜드 왕을 칭한 1542년을 시작으로 봄. 지도에는 1789년 이후만 표시

# 네덜란드
- id: dutch-republic
  level: polity
  names: { ko: 네덜란드 공화국, en: Dutch Republic, native: Republiek der Zeven Verenigde Nederlanden }
  from: 1581
  to: 1795
  color: "#e0994f"
  summary: 에스파냐에서 독립한 일곱 주의 연합 공화국으로 총독(오라녜 가문)과 주 의회가 함께 다스림. 1795년 1월 프랑스 혁명군과 애국파가 총독을 몰아내고 바타비아 공화국을 세움
  basis:
    type: primary_source
    refs: ["위트레흐트 동맹(1579)", "철회령(1581)", "베스트팔렌 조약(1648)"]
    foundingNote: 펠리페 2세를 군주로 인정하지 않기로 한 철회령(1581)을 시작으로 봄. 지도에는 1789년 이후만 표시

- id: batavian-republic
  level: polity
  names: { ko: 바타비아 공화국, en: Batavian Republic, native: Bataafse Republiek }
  from: 1795
  to: 1806
  color: "#e4ab70"
  summary: 1795년 프랑스 혁명군의 지원으로 네덜란드 공화국을 대신해 세운 자매 공화국. 헤이그 조약(1795)으로 젤란트 플랑드르·마스트리흐트·펜로를 프랑스에 넘기고 동맹을 맺음. 1806년 나폴레옹의 동생 루이를 왕으로 맞아 홀란트 왕국이 됨
  basis:
    type: primary_source
    refs: ["헤이그 조약(1795)"]
    foundingNote: 1801년부터 바타비아 연방(Bataafs Gemenebest)으로 이름이 바뀐 시기도 이 항목으로 표시

- id: kingdom-of-holland
  level: polity
  names: { ko: 홀란트 왕국, en: Kingdom of Holland, native: Koninkrijk Holland }
  from: 1806
  to: 1810
  color: "#e0994f"
  summary: 나폴레옹이 동생 루이 보나파르트를 왕으로 세운 나라. 루이가 대륙 봉쇄령을 엄격히 지키지 않자 1810년 7월 프랑스에 병합됨
  basis:
    type: primary_source
    refs: ["파리 조약(1806, 프랑스-바타비아)", "랑부예 칙령(1810)"]

# 신성 로마 제국과 독일
- id: holy-roman-empire
  level: polity
  names: { ko: 신성 로마 제국 (영방 묶음), en: Holy Roman Empire (estates grouped), native: Heiliges Römisches Reich }
  from: 962
  to: 1806
  color: "#a8b48e"
  summary: 황제 아래 수백 개의 영방(제후국·교회령·제국 자유시)이 모인 나라. 지도에는 합스부르크 세습령·프로이센 땅·덴마크 왕의 홀슈타인·스웨덴령 포메른을 뺀 영방(바이에른·작센·하노버·뷔르템베르크·팔츠·마인츠·쾰른·트리어 등)을 하나로 묶어 표시함. 1797~1801년 라인강 왼쪽을 프랑스에 넘기고 1803년 제국 대표자 회의 주요 결의로 교회령·자유시 대부분이 정리되었으며, 1806년 라인 동맹이 생기자 프란츠 2세가 제위를 내놓아 해체됨
  basis:
    type: primary_source
    refs: ["베스트팔렌 조약(1648)", "뤼네빌 조약(1801)", "제국 대표자 회의 주요 결의(1803)", "프란츠 2세의 제위 포기 선언(1806)"]
    foundingNote: 오토 1세가 황제 대관을 받은 962년을 시작으로 봄. 지도에는 1789년 이후만 묶음으로 표시

- id: confederation-of-the-rhine
  level: polity
  names: { ko: 라인 동맹 (묶음), en: Confederation of the Rhine (grouped), native: Rheinbund }
  from: 1806
  to: 1813
  color: "#9fae86"
  summary: 1806년 나폴레옹을 보호자로 삼아 바이에른·뷔르템베르크·바덴 등 16개국이 만든 동맹. 틸지트 조약(1807) 뒤 작센·베스트팔렌 왕국 등이 들어와 프로이센·오스트리아를 뺀 독일 대부분이 가입함. 1813년 라이프치히 전투 뒤 무너짐. 지도에는 1806년 말 아직 가입하지 않았거나 프랑스군이 점령한 독일 나라(하노버·헤센카셀·메클렌부르크 등)도 함께 묶어 표시
  basis:
    type: primary_source
    refs: ["라인 동맹 규약(1806)", "틸지트 조약(1807)"]

- id: hanseatic-cities
  level: polity
  names: { ko: 한자 자유시들 (묶음), en: Hanseatic free cities (grouped), native: Freie Hansestädte }
  from: 1806
  to: 1810
