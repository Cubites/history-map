    - 1740년 마리아 테레지아가 뒤를 이은 뒤 슐레지엔을 프로이센에 빼앗겼고(1742) 폴란드 분할(1772·1795)에 참여함
    - 프랑스 혁명 전쟁에서 벨기에·롬바르디아를 잃는 대신 베네치아·이스트리아·달마티아를 얻음(캄포포르미오 조약, 1797)
