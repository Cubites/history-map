    - 『에다』를 쓴 스노리 스투를루손은 1241년 9월 23일 호콘 4세의 뜻을 받든 기수르 토르발드손 일행에게 살해됨
  startEvents: [norway-atlantic-872]
  endEvents: [norway-iceland-1220]
