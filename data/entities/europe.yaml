  names: { ko: 리키아 동맹, en: Lycian League, native: Λυκιακὸν κοινόν }
  from: -167
  to: 43
  color: "#38b0e0"
  summary: 크산토스·파타라·피나라·올림포스·미라·틀로스 등 리키아 도시들의 연방(스트라본이 대표 수를 도시 크기에 따라 나눈 연방으로 기록). 기원전 168년 로마가 로도스에서 풀어 준 뒤 로마의 '자유 동맹국'이었고, 43년 내분 끝에 클라우디우스가 자유를 거두고 속주로 삼음(뒤에 팜필리아와 합쳐 리키아-팜필리아)
  mapNote: 로마의 동맹 연방이라 따로 그림. 지도에는 기원전 167~기원후 42년 안탈리아도 서쪽(카시·엘말르·피니케·뎀레·케메르)을 표시(그전 프톨레마이오스·셀레우코스·로도스)하고 무글라도 동부(텔메소스·크산토스 계곡)는 근사로 아시아 속주째
  endNote: 로마의 '자유 동맹국'이던 리키아는 43년 내분 끝에 클라우디우스가 자유를 거두고 속주로 삼음. 뒤에 팜필리아와 합쳐 리키아-팜필리아가 됨
  startEvents: [third-macedonian-war-171bc]
  endEvents: [clients-annexed-38-72]
  basis:
    type: primary_source
    refs: ["스트라본, 『지리지』 14.3", "수에토니우스, 『클라우디우스』 25", "카시우스 디오, 『로마사』 60.17"]
    # 작업 메모: (AN-④) / (작업 AN2) / 작업 AN3에서 기원전 167년(−166, 로도스에서 풀려남)부터 표시(그전 프톨레마이오스·셀레우코스·로도스) / (relations.yaml) / 천문 연도 −167 / (−166, 로도스에서 풀려남)
    foundingNote: 로마가 리키아를 로도스에서 풀어 준 해(기원전 168년)를 시작으로 봄. 기원전 167년부터 로마의 동맹

- id: odrysian-kingdom
  level: polity
  names: { ko: 트라키아 왕국 (오드리사이), en: Odrysian Kingdom of Thrace, native: Ὀδρυσῶν βασιλεία }
  from: -479
  to: 46
  color: "#9a6a3a"
  summary: 테레스 1세가 기원전 5세기에 세운 트라키아인(오드리사이)의 왕국. 기원전 1세기부터 사파이오이 왕가(로이메탈케스 1세·코티스 8세·로이메탈케스 2·3세)가 로마의 종속 왕으로 하이모스산맥 남북과 도나우강 하류 기슭(오비디우스의 토미스)을 다스림. 12년 레스쿠포리스 2세와 코티스 8세로 나뉘었다가, 46년 로이메탈케스 3세가 살해된 뒤 클라우디우스가 트라키아 속주로 삼음
  mapNote: "테레스 1세의 왕국(기원전 480년 무렵)을 시작으로 봄(왕가가 바뀌어도 한 나라로 봄). 모이시아 서부는 로마. 로마의 종속 왕국이라 따로 그림. 지도에는 기원전 479~343년과 기원전 323~기원후 45년 표시: 기원전 479년(페르시아가 물러난 뒤)부터 헤브로스강 골짜기와 티니 땅, 431~401년 시탈케스의 서트라키아와 하이모스산맥 북쪽 게타이 땅, 400~343년 헤브로스강 골짜기·서트라키아(342~324년은 마케도니아(필리포스 2세)·리시마코스), 323~280년 세우테스 3세의 세우토폴리스(313~281 리시마코스의 종속), 279년부터 헤브로스강 골짜기(플로브디프·파자르지크·스타라자고라·하스코보·얌볼·슬리벤·에디르네도와 부르가스도 내륙), 212년부터 트라키아 동부(티리스를 무너뜨린 뒤 아스타이). 기원전 27~12년은 헤브로스강 골짜기만 그리고, 기원전 11년(로이메탈케스 1세, 카시우스 디오 54.34)부터 기원후 45년까지 불가리아의 하이모스산맥 남쪽·북동부(바르나·루세·벨리코 터르노보)·소피아, 도브루자, 튀르키예의 에디르네·크르클라렐리·테키르다으, 그리스의 서트라키아(로도페·세르디카 포함)를 표시"
  endNote: 46년 로이메탈케스 3세가 살해된 뒤 클라우디우스가 트라키아 속주로 삼음
  features:
    - 기원전 431~424년 재위한 테레스의 아들 시탈케스가 아테네와 동맹을 맺고 기원전 429/428년 겨울 마케도니아를 침공함
    - 기원전 1세기부터 사파이오이 왕가(로이메탈케스 1세·코티스 8세 등)가 로마의 종속 왕으로 하이모스산맥 남북과 도나우강 하류를 다스림
    - 12년 레스쿠포리스 2세와 코티스 8세로 나뉨
  startEvents: [odrysian-kingdom-480bc]
  endEvents: [clients-annexed-38-72]
  basis:
    type: primary_source
    refs: ["투키디데스, 『역사』 2.96~97", "타키투스, 『연대기』 2.64~67·4.46~51", "오비디우스, 『흑해에서 보낸 편지』 2.9"]
    # 작업 메모: AN-⑩ / (AN-④) / (작업 AN2) / (정할 점 AN2-②) / 앞 시기는 작업 AN3·AN4 / 작업 AN3에서 기원전 264년부터 헤브로스강 골짜기(플로브디프·파자르지크·스타라자고라·하스코보·얌볼·슬리벤·에디르네도와 부르가스도 내륙), 212년부터 트라키아 동부(티리스를 무너뜨린 뒤 아스타이)를 표시(정할 점 AN3-⑫·⑬) / (정할 점 AN3-⑯) / 작업 AN4에서 기원전 479년(−478, 페르시아가 물러난 뒤)부터 헤브로스강 골짜기와 티니 땅, 431~401년 시탈케스의 서트라키아와 하이모스산맥 북쪽 게타이 땅(정할 점 AN4-⑤), 400~343년 헤브로스강 골짜기·서트라키아를 표시 / 작업 FIX5b(FIX 후보 ⑧, 정할 점 FIX5b-①)에서 기원전 27~12년은 헤브로스강 골짜기만 그리고, 기원전 11년(−10, 로이메탈케스 1세, 카시우스 디오 54.34)부터 로도페·서트라키아·세르디카와 하이모스산맥 북쪽 동부·도브루자를 더함(기원전 28→27년의 바뀜이 없어짐) / 천문 연도 −479 / 한 항목 / 27년 표 / (−478, 페르시아가 물러난 뒤) / (−278) / (−10, 로이메탈케스 1세, 카시우스 디오 54.34)
    foundingNote: 테레스 1세의 왕국(기원전 480년 무렵, 투키디데스가 적은 '큰 오드리사이 왕국')을 시작으로 봄(왕가가 바뀌어도 한 나라로 봄)

- id: noricum-kingdom
  level: polity
  names: { ko: 노리쿰 왕국, en: Kingdom of Noricum, native: Regnum Noricum }
  from: -169
  to: -15
  color: "#6a7ad8"
  summary: 동알프스(지금의 오스트리아·슬로베니아)의 켈트계 부족 연합 왕국(노리키·타우리스키). 철(노리쿰 철)과 소금으로 로마와 오래 교역하며 '친구'였고, 노레이아와 막달렌스베르크가 중심. 기원전 16년 싸움 없이 로마에 편입되어 뒤에 노리쿰 속주가 됨
  mapNote: 리비우스가 적은 왕 킨키빌루스의 사절(기원전 170년)을 시작으로 봄. 기원전 16년부터 로마. 로마의 우호 왕국이라 따로 그림(기원전 170년부터 로마의 친구). 지도에는 기원전 170~17년 케른텐·슈타이어마르크·잘츠부르크·오버외스터라이히·슬로베니아 북부를 표시(리비우스 43.5의 킨키빌루스 왕)하고, 기원전 27년부터 니더외스터라이히·빈도 그림(그전은 켈트 부족. 카르눈툼은 벨레이우스가 '노리쿰 왕국의 땅'이라 적음)
  endNote: 기원전 16년 싸움 없이(경위는 사료가 적고 평화적 병합이라는 견해가 많음) 로마에 편입되어 뒤에 노리쿰 속주가 됨
  features:
    - 철(노리쿰 철)과 소금으로 로마와 오래 교역하며 '친구'였음
    - 노레이아와 막달렌스베르크가 중심이었음
  startEvents: [cisalpine-ligurian-reconquest-200bc]
  endEvents: [alpine-conquest-25bc]
  basis:
    type: primary_source
    refs: ["리비우스, 『로마사』 43.5(기원전 170 킨키빌루스 왕)", "스트라본, 『지리지』 4.6.9", "카시우스 디오, 『로마사』 54.20"]
    # 작업 메모: (AN-④) / 작업 AN2 / 작업 AN3에서 기원전 170년(−169, 킨키빌루스 왕, 리비우스 43.5)부터 케른텐·슈타이어마르크·잘츠부르크·오버외스터라이히·슬로베니아 북부를 표시(니더외스터라이히·빈은 기원전 28년까지 켈트 부족, 검토 반영, 정할 점 AN3-⑯) / (relations.yaml) / 천문 연도 −169 / (−15) / (−169, 킨키빌루스 왕, 리비우스 43.5)
    foundingNote: 리비우스가 적은 왕 킨키빌루스의 사절(기원전 170년)을 시작으로 봄

- id: cottian-alps
  level: polity
  names: { ko: 코티우스 왕국 (코티우스 알프스), en: Kingdom of Cottius, native: Alpes Cottiae }
  from: -57
  to: 64
  color: "#50c0a0"
  summary: 서알프스 몽주네브르 고개 양쪽(세구시오·브리간티오·에브로두눔)의 리구리아·켈트계 부족 왕국. 카이사르 시대의 왕 돈누스의 아들 코티우스가 기원전 13년 아우구스투스의 속주장관(praefectus)이 되어 수사에 개선문을 세웠고, 클라우디우스가 왕호를 돌려줌. 63년 코티우스 2세가 죽자 네로가 코티우스 알프스 속주로 삼음
  mapNote: 로마의 종속 왕국이라 따로 그림(1만 km² 미만이지만 조각(오트잘프도)이 맞아 그림). 지도에는 기원전 58~기원후 63년 오트잘프도를 표시(그전 켈트 부족, 수사 계곡은 근사로 로마째)하고 64년부터 로마(1만 km² 미만이라 64년에 묶음)
  endNote: 63년 코티우스 2세가 죽자 네로가 코티우스 알프스 속주로 삼음
  features:
    - 돈누스의 아들 코티우스가 기원전 13년 아우구스투스의 속주장관(praefectus)이 되었고 수사에 개선문을 세움
    - 클라우디우스가 왕호를 돌려줌
  startEvents: [gallic-war-58bc]
  endEvents: [clients-annexed-38-72]
  basis:
    type: primary_source
    refs: ["수사 개선문 비문(기원전 9~8년)", "암미아누스 마르켈리누스, 『역사』 15.10", "수에토니우스, 『네로』 18"]
    # 작업 메모: 작업 AN2 / 작업 AN3에서 기원전 58년(−57)부터 오트잘프를 표시(그전 켈트 부족) / 로마의 종속 왕국이라 따로 그림(AN-④, 1만 km² 미만이지만 조각(오트잘프도)이 맞아 그림, AN-⑬) / 천문 연도 −57 / 64년 버전 / 다음 버전 해 / (−57)
    foundingNote: 카이사르 시대의 왕 돈누스(기원전 58년 무렵)를 시작으로 봄

- id: british-client-kingdoms
  level: polity
  names: { ko: 브리타니아의 종속 왕국들 (묶음), en: British client kingdoms, native: Iceni, Regni, Brigantes }
  from: 43
  to: 78
  color: "#d08850"
  summary: 클라우디우스의 침공(43) 뒤 로마의 종속 왕으로 남은 브리타니아의 부족 왕국들을 묶은 항목. 이케니(프라수타구스, 60년에 죽고 61년 부디카의 반란 뒤 병합), 레그니(코기둡누스 '브리타니아의 대왕', 타키투스가 '우리 시대까지 충성'이라 적음), 브리간테스(카르티만두아, 51년 카라타쿠스를 넘김, 69년 베누티우스에게 쫓겨남)
  mapNote: 로마의 종속 왕국이라 따로 그리되 1만 km² 미만인 이케니·레그니가 있어 여러 왕국을 묶어 그림. 지도에는 43~63년 노퍽(이케니, 61년 병합은 1만 km² 미만이라 64년에 묶음), 43~77년 서식스(레그니, 끝 해가 분명하지 않아 78년에 묶음), 43~68년 험버강·머지강 북쪽(브리간테스와 파리시)을 표시
  endNote: 이케니는 61년 부디카의 반란 뒤 병합되었고, 브리간테스는 69년 카르티만두아가 베누티우스에게 쫓겨난 뒤 71년 총독 케리알리스에게 정복됨. 레그니는 끝 해가 분명하지 않아 아그리콜라가 부임한 78년 무렵(77년설도 있음)까지로 봄
  features:
    - 레그니의 코기둡누스는 '브리타니아의 대왕'이었고, 타키투스가 '우리 시대까지 충성'이라 적음
    - 브리간테스의 카르티만두아가 51년 카라타쿠스를 로마에 넘김
    - 이케니의 프라수타구스가 60년에 죽음
  startEvents: [claudian-conquest-britain-43]
  endEvents: [flavian-britain-69]
  basis:
    type: primary_source
    refs: ["타키투스, 『연대기』 12.31~40·14.31", "타키투스, 『역사』 3.45", "타키투스, 『아그리콜라』 14", "치체스터의 코기둡누스 비문"]
    # 작업 메모: (AN-④) / (AN-⑬) / (작업 AN2) / 묶음 항목 / 64년 버전 / 78년 버전
    foundingNote: 클라우디우스의 침공(43)을 시작으로 봄

- id: dacian-kingdom
  level: polity
  names: { ko: 다키아 왕국, en: Dacian Kingdom, native: Dacia }
  from: -81
  to: 106
  color: "#5f8f3f"
