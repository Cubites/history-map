- id: byzantine-empire
  level: polity
  names: { ko: 동로마 제국, en: Byzantine Empire, native: Βασιλεία τῶν Ῥωμαίων }
  from: 395
  to: 1453
  color: "#7b3f8f"
  summary: 로마 제국이 동서로 나뉜 뒤(395) 콘스탄티노폴리스를 수도로 이어진 동쪽 로마 제국(비잔티움 제국). 1402년 앙카라 전투 뒤 1403년 갈리폴리 조약으로 테살로니키와 트라키아·마케도니아·테살리아 해안을 되찾았으나 1423년 테살로니키를 베네치아에 넘기고 1424년 오스만에 공물을 바치기로 함. 황족이 다스린 모레아 전제공국(펠로폰네소스)이 마지막까지 남았고, 1453년 5월 29일 메흐메트 2세에게 콘스탄티노폴리스가 함락되어 무너짐
  mapNote: 지도에는 395년부터 표시하며 395~475년 다키아·마케도니아 관구와 트라키아·아나톨리아·키프로스(441 싱기두눔을 훈족에, 447~453 아나톨리우스의 조약 띠는 훈 제국, 454 게피드의 싱기두눔, 크림 고티아는 476년부터), 476년부터 유스티니아노스의 재정복 534·535·540·552·554, 롬바르드·슬라브·아바르에 잃은 땅 568~615, 591 아르메니아, 637·639·653 아랍 변경, 681 불가리아, 703 킬리키아, 751 라벤나, 783 스타우라키오스의 그리스 등, 800년부터 시칠리아 상실(831~878), 크레타 961, 동쪽 변경 934·949·958·962·965·966·969, 동불가리아 971, 테살리아 986·997, 1000~1399년 트라키아·마케도니아와 비티니아(1336년까지)·펠로폰네소스(1320년부터)·테살리아(1333~1347, 1371~1392 근사)·에피루스(1340~1347)의 줄어드는 땅(1200~1203년 앙겔로스 왕조의 제국(트라키아·마케도니아·그리스·아나톨리아 서부·폰토스), 1204~1260년은 라틴 제국·니케아 제국(1261년 이름만 바뀌어 이어짐)·에피루스·트레비존드 등으로 나뉘어 영토 없음, 1261~1299년 콘스탄티노폴리스를 되찾은 뒤의 땅), 1400~1452년 콘스탄티노폴리스(이스탄불주의 보스포루스 서쪽, 아시아 쪽은 오스만)와 모레아 전제공국(황제의 아들·형제가 다스린 자치 단위라 동로마 땅, 1430년부터 아카이아 포함), 1403~1423년 갈리폴리 조약 땅(테살로니키·할키디키는 1422년까지, 트라키아 해안·마그네시아·북스포라데스)을 표시. 1424년 뒤 남은 메셈브리아·안키알로스·셀림브리아는 작아 오스만으로 둔 근사
  endNote: 1403년 갈리폴리 조약으로 테살로니키와 트라키아·마케도니아·테살리아 해안을 되찾았으나 1423년 테살로니키를 베네치아에 넘기고 1424년 오스만에 공물을 바치기로 함. 1453년 5월 29일 메흐메트 2세에게 콘스탄티노폴리스가 함락되어 무너짐
  features:
