    # 작업 메모: (작업 AN3) / (roman-empire) / (AN-⑩·⑫) / (AN-⑨, 정할 점 AN3-①~⑩) / (AN-⑤) / 작업 AN4에서 기원전 509년(−508, 로마 왕국에서 이름만 바뀜, renames)부터 로마도의 라티움(새 선), 396 베이이, 338 라틴 동맹 해체와 볼스키·캄파니아, 326 네아폴리스, 317 아풀리아, 304~290 삼니움·사비니·아브루초·피케눔, 283~280 아게르 갈리쿠스·에트루리아, 272 타렌툼·루카니아·브루티움, 265 볼시니이·메사피이를 표시(동맹시는 로마 색) / 작업 FIX5b(FIX 후보 ⑪)에서 카타나를 기원전 260년 버전부터(263년 항복, 1만 km² 미만), 에부수스를 146년부터, 마살리아를 기원전 44년 버전부터 로마로 고침 / 지도에는 기원전 264~28년 표시 / 천문 연도 −508 / (−26) / (−508, 로마 왕국에서 이름만 바뀌어 이어짐) / 260년 버전 / 44년 버전
