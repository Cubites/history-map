# 유럽 나라
# 짝 생성기 권역 파일: scripts/geo/areas/europe.mjs (유럽 쪽 영토는 행정구역 조각으로 만든 근사, DESIGN.md §5.2)
# 2026-10-01 west.yaml에서 옮김(id 그대로). 2026-10-02(작업 E2) 1815~1914년 유럽 뼈대의 나라를 더함(영토는 1815년부터). 같은 날(작업 E3) 1789~1814년 뼈대를 더함(영토는 1789년부터). 운영자 검수 필요.
# 이름의 native는 원어 표기. '(묶음)'은 여러 나라를 한 항목으로 묶은 것(나라별 심화 때 나눔, docs/EUROPE_DRAFT.md)

- id: france
  level: polity
  names: { ko: 프랑스, en: France, native: France }
  from: 987
  to: null
  color: "#6d7fb8"
  summary: 1866년 천주교 박해(병인박해)를 구실로 강화도를 침공함(병인양요). 지도에는 1789년 프랑스 혁명 이후 영토만 표시하며, 왕국(~1792)·제1공화국(1792~1804)·제1제국(1804~1814)·복고 왕정(1814~1830)·7월 왕정(1830~1848) 등 정체가 바뀌어도 한 항목으로 둠. 혁명 전쟁과 나폴레옹 전쟁으로 벨기에·라인강 왼쪽·피에몬테·네덜란드·북해 연안·로마·일리리아를 합쳐 1810~1812년 가장 넓었다가 1814년 1차 파리 조약으로 1792년 국경으로 돌아감
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "캄포포르미오 조약(1797)", "뤼네빌 조약(1801)", "파리 조약(1814)"]
    foundingNote: 카페 왕조가 시작된 987년을 프랑스 왕국의 시작으로 봄

- id: uk
  level: polity
  names: { ko: 영국, en: United Kingdom, native: United Kingdom of Great Britain and Ireland }
  from: 1707
  to: null
  color: "#7a6fa8"
  summary: 러시아의 남하를 막는다며 거문도를 불법 점령하고(1885~1887), 영일 동맹(1902·1905)으로 일본의 한국 지배를 인정함. 지도에는 1789년 이후 영토만 표시하고(식민지 제외), 1801년 1월 연합법으로 아일랜드 왕국을 합치기 전은 그레이트브리튼 왕국의 영토
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "연합법(1800)"]
    foundingNote: 잉글랜드와 스코틀랜드가 합친 1707년(그레이트브리튼 왕국)을 시작으로 봄. 1801년 아일랜드를 합쳐 연합 왕국이 되고 1922년 아일랜드 자유국이 떨어져 나감

- id: russia
  level: polity
  names: { ko: 러시아 제국, en: Russian Empire, native: Российская империя }
  from: 1721
  to: 1917
  color: "#6f8f6f"
  summary: 폴란드 분할(1772·1793·1795)로 리투아니아·벨라루스·우크라이나 우안·쿠를란트를, 야시 조약(1792)으로 흑해 북쪽 기슭을 얻고 1801~1813년 캅카스 남쪽, 1809년 핀란드, 1812년 베사라비아를 차지함. 빈 회의(1815)로 폴란드 왕국을 얻고 크림 전쟁(1853~1856)에 졌으나 러시아-튀르크 전쟁(1877~1878)으로 발칸에 세력을 넓힘. 베이징 조약(1860)으로 연해주를 차지해 조선과 국경을 맞댐. 삼국 간섭과 아관파천으로 한반도에 영향력을 넓혔으나 러일 전쟁(1904~1905)에서 짐. 지도에는 1789년 이후 영토만 대략 표시. 두만강 하구 북쪽 하산 지역은 1860년 베이징 조약 경계를 따름. 조선 땅이던 녹둔도도 이때 러시아 쪽에 들어가 조선이 반환을 요구함
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "야시 조약(1792)", "3차 폴란드 분할 조약(1795)", "프레드릭스함 조약(1809)", "부쿠레슈티 조약(1812)", "빈 회의 최종 의정서(1815)", "파리 조약(1856)", "베를린 조약(1878)"]

- id: soviet-union
  level: polity
  names: { ko: 소련, en: Soviet Union }
  from: 1917
  to: 1991
  color: "#7c8c63"
  summary: 러시아 혁명(1917)으로 세워진 사회주의 국가(1922년 소비에트 사회주의 공화국 연방 결성). 1937년 연해주의 한인을 중앙아시아로 강제 이주시킴
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『한국독립운동사』"]
    foundingNote: 1917년 10월 혁명부터 1922년 연방 결성 이전까지의 소비에트 러시아를 포함

- id: russia-fed
  level: polity
  names: { ko: 러시아 연방, en: Russian Federation }
  from: 1991
  to: null
  color: "#6f8f6f"
  summary: 소련이 해체된 뒤(1991) 그 지위를 이어받은 나라. 북핵 문제를 다룬 6자 회담에 참여함
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『한국사』"]

# ── 1815~1914년 유럽 뼈대 (작업 E2, 영토는 scripts/geo/areas/europe.mjs의 '1815~1914 조각 소유표') ──

# 서유럽
- id: netherlands
  level: polity
  names: { ko: 네덜란드, en: Netherlands, native: Koninkrijk der Nederlanden }
  from: 1813
  to: null
  color: "#e0994f"
  summary: 빈 회의(1815)로 옛 오스트리아령 네덜란드(지금의 벨기에)를 합친 네덜란드 연합 왕국이 됨. 1830년 벨기에가 독립해 떨어져 나갔고 1839년 런던 조약으로 이를 인정함. 1890년까지 왕이 룩셈부르크 대공을 겸함. 지도에는 유럽 본토만 표시 (식민지 제외)
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "런던 조약(1839)"]
    foundingNote: 프랑스가 물러난 1813년 12월 빌럼 1세가 주권 군주가 된 때(1815년 왕)를 시작으로 봄. 지도는 1814년부터 표시하며 1814년은 빌럼이 총독으로 다스린 벨기에를 포함. 그전의 네덜란드 공화국·바타비아 공화국·홀란트 왕국은 따로 다룸

- id: belgium
  level: polity
  names: { ko: 벨기에, en: Belgium, native: "Belgique / België" }
  from: 1830
  to: null
  color: "#d4bf5e"
  summary: 1830년 혁명으로 네덜란드 연합 왕국에서 독립하고 1831년 레오폴드 1세를 왕으로 맞음. 1839년 런던 조약으로 영세 중립국이 되고 룩셈부르크 서부를 얻음. 1914년 독일이 중립을 어기고 침공함
  basis:
    type: primary_source
    refs: ["런던 조약(1839)"]
    foundingNote: 독립을 선언한 1830년을 시작으로 봄. 1830~1839년 지도는 법적 경계(룩셈부르크 서부는 룩셈부르크)를 따름

- id: luxembourg
  level: polity
  names: { ko: 룩셈부르크, en: Luxembourg, native: Lëtzebuerg }
  from: 1814
  to: null
  color: "#a58fc4"
  summary: 빈 회의(1815)로 대공국이 되어 네덜란드 왕이 대공을 겸하고 독일 연방에 속함. 1839년 런던 조약으로 서부(지금의 벨기에 뤽상부르주)를 벨기에에 넘기고, 1867년 런던 조약으로 영세 중립국이 됨
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "런던 조약(1839)", "런던 조약(1867)"]
    foundingNote: 대공국이 된 1815년을 시작으로 보되, 프랑스에서 떨어져 나와 연합국의 임시 행정을 받은 1814년부터 표시함(1795~1813년 프랑스, 그전은 합스부르크 군주국)

- id: switzerland
  level: polity
  names: { ko: 스위스, en: Switzerland, native: Confoederatio Helvetica }
  from: 1291
  to: null
  color: "#cf6f6f"
  summary: 1798년 프랑스가 옛 연방을 무너뜨리고 통일 국가인 헬베티아 공화국을 세웠다가 1803년 나폴레옹의 중재 헌법으로 다시 연방이 됨(지도에서는 이 시기들도 스위스 한 항목으로 표시하고, 제네바는 1798~1813년·발레는 1810~1813년 프랑스). 빈 회의(1815)로 제네바·발레·뇌샤텔이 더해져 22개 주가 되고 영세 중립을 인정받음. 1847년 분리 동맹 전쟁 뒤 1848년 헌법으로 연방 국가가 됨
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "스위스 연방 헌법(1848)"]
    foundingNote: 우리·슈비츠·운터발덴이 동맹을 맺은 1291년을 기원으로 봄

- id: liechtenstein
  level: polity
  names: { ko: 리히텐슈타인, en: Liechtenstein, native: Fürstentum Liechtenstein }
  from: 1719
  to: null
  color: "#8fa0c4"
  summary: 오스트리아와 스위스 사이의 작은 공국. 1806년 주권국이 되고 1815~1866년 독일 연방에 속함
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)"]
    foundingNote: 신성 로마 제국의 공국이 된 1719년을 시작으로 봄

- id: spain
  level: polity
  names: { ko: 에스파냐, en: Spain, native: España }
  from: 1479
  to: null
  color: "#d8b04c"
  summary: 나폴레옹 전쟁 뒤 부르봉 왕가가 돌아왔으나 19세기 내내 혁명과 내전(카를로스 전쟁)이 이어짐. 1810~1820년대 아메리카 식민지 대부분이 독립하고 1898년 미국-에스파냐 전쟁으로 쿠바·필리핀 등을 잃음. 지도에는 유럽 본토와 카나리아 제도·세우타·멜리야만 표시
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "파리 조약(1898)"]
    foundingNote: 카스티야와 아라곤이 합친 1479년을 시작으로 봄

- id: portugal
  level: polity
  names: { ko: 포르투갈, en: Portugal, native: Portugal }
  from: 1139
  to: null
  color: "#7da36b"
  summary: 1822년 브라질이 독립한 뒤 아프리카 식민지를 넓힘. 1910년 혁명으로 공화국이 됨. 지도에는 유럽 본토와 아소르스·마데이라 제도만 표시
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)"]
    foundingNote: 아폰수 1세가 왕을 칭한 1139년을 시작으로 봄

- id: andorra
  level: polity
  names: { ko: 안도라, en: Andorra, native: Principat d'Andorra }
  from: 1278
  to: null
  color: "#c99a78"
  summary: 피레네산맥의 작은 공국. 프랑스 국가원수와 에스파냐 우르헬 주교가 함께 군주를 맡음
  basis:
    type: primary_source
    refs: ["파레아주 협약(1278)"]
    foundingNote: 푸아 백작과 우르헬 주교가 공동 영주 협약을 맺은 1278년을 시작으로 봄

- id: monaco
  level: polity
  names: { ko: 모나코, en: Monaco, native: Principauté de Monaco }
  from: 1297
  to: null
  color: "#d47f8f"
  summary: 지중해 연안의 작은 공국. 1815년 파리 조약으로 사르데냐의 보호를 받음. 1848년 떨어져 나간 망통·로크브륀을 1861년 프랑스에 팔아 지금 크기가 됨 (지도에는 1860년까지 사르데냐 니스, 그 뒤 프랑스로 단순화). 1793~1814년 프랑스에 병합되었고, 지도에는 그전(프랑스의 보호국)도 프랑스로 단순화해 1814년부터 표시
  basis:
    type: primary_source
    refs: ["파리 조약(1815)", "프랑스-모나코 조약(1861)"]
    foundingNote: 그리말디 가문이 모나코를 차지한 1297년을 시작으로 봄

# 북유럽
- id: denmark
  level: polity
  names: { ko: 덴마크, en: Denmark, native: Danmark }
  from: 936
  to: null
  color: "#c4685c"
  summary: 1814년 킬 조약으로 노르웨이를 스웨덴에 넘김. 왕이 겸해 다스리던 슐레스비히·홀슈타인·라우엔부르크 공국을 두고 독일과 다투다 1864년 프로이센·오스트리아와의 전쟁에 져 세 공국을 잃음. 지도에는 아이슬란드(1918년 동군연합 왕국으로 분리)·페로 제도를 포함
  basis:
    type: primary_source
    refs: ["킬 조약(1814)", "빈 조약(1864)"]
    foundingNote: 고름 왕이 나라를 통일한 10세기(936년 무렵)를 시작으로 봄. 1814년 전은 덴마크-노르웨이 항목으로 표시

- id: sweden-norway
  level: polity
  names: { ko: 스웨덴-노르웨이, en: Sweden-Norway (United Kingdoms of Sweden and Norway), native: Sverige-Norge }
