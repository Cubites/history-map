  mapNote: 지도에는 930~1261년 표시하고 1262년부터 노르웨이 왕국
  endNote: 스투를룽 시대(1220~1262)의 내전 끝에 1262~1264년 족장들이 '옛 서약'으로 노르웨이 왕 호콘 4세에게 신서해 노르웨이 왕국에 들어감
  features:
