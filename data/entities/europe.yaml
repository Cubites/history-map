- id: england
  level: polity
  names: { ko: 잉글랜드 왕국, en: Kingdom of England, native: Kingdom of England }
  from: 927
  to: 1707
  color: "#e0503c"
  summary: 그레이트브리튼섬 남부(웨일스 포함)의 왕국. 1603년부터 스코틀랜드와 같은 왕을 모시는 동군연합이었고, 내전(1642~1651) 뒤 찰스 1세를 처형하고 공화국(1649~1653)·크롬웰의 보호국(1653~1659)을 거쳐 1660년 왕정이 돌아옴(이 시기 스코틀랜드·아일랜드를 합쳤으나 경계가 같아 지도에서는 항목을 나누지 않음). 명예혁명(1688)과 권리 장전(1689)으로 의회가 왕권을 제한하는 입헌 군주정의 기틀을 마련함. 에스파냐 왕위 계승 전쟁 중인 1707년 5월 연합법으로 스코틀랜드와 합쳐 그레이트브리튼 왕국(영국)이 됨
  mapNote: 애설스탠이 잉글랜드를 하나로 모은 927년을 시작으로 봄. 중세 프랑스 안에서 프랑스와 맞닿아 영국과 다른 색으로 둠. 웨식스가 이름만 바뀌어 이어짐(같은 색). 지도에는 927년 이후만 표시(1200~1203년 앙주 제국의 대륙 땅(노르망디·멘·앙주·투렌·푸아투·아키텐), 1204·1205·1224년의 상실 뒤 가스코뉴, 1280~1293년 아그네, 웨일스 1277·1283, 939~954년 요크와 940~941년 다섯 버러는 데인로, 기옌은 1303 파리 조약부터, 1360~1376년 브레티니 조약의 아키텐. 칼레는 파드칼레도째라 그림에는 안 보임)하고 1707년부터는 영국 항목. 맨섬·채널 제도는 잉글랜드 왕의 영지라 함께 표시. 1400~1452년에는 잉글랜드령 기옌(보르들레 1452년까지·랑드 1450년까지)과 트루아 조약(1420)에 따른 랭커스터 이중 왕국이 실제로 다스린 땅(노르망디 1449·1450년까지, 파리·일드프랑스 1435년까지, 샹파뉴·우아즈 1428년까지, 멘 1425~1447년, 솜강 쪽 1435년까지)도 표시
  endNote: 에스파냐 왕위 계승 전쟁 중인 1707년 5월 연합법으로 스코틀랜드와 합쳐 그레이트브리튼 왕국(영국)이 됨
  features:
    - 1603년부터 스코틀랜드와 같은 왕을 모시는 동군연합이었음
    - 내전(1642~1651) 뒤 찰스 1세를 처형하고 공화국(1649~1653)·크롬웰의 보호국(1653~1659)을 거쳐 1660년 왕정이 돌아옴
    - 공화국·보호국 시기에 스코틀랜드·아일랜드를 합쳤음
    - 명예혁명(1688)과 권리 장전(1689)으로 의회가 왕권을 제한하는 입헌 군주정의 기틀을 마련함
  startEvents: [england-unification-899]
  endEvents: [acts-of-union-1707]
  basis:
    type: primary_source
    refs: ["권리 장전(1689)", "연합법(1707)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 927년부터로 넓힘 / 웨식스의 renames, 같은 색 / 작업 M2 / 작업 M1 / 정할 점 M1-① / (M-⑫)
    foundingNote: 애설스탠이 잉글랜드를 하나로 모은 927년을 시작으로 봄

