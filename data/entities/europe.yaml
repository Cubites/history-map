    - 1993년 슬로바키아와 연방 재산·군대·화폐를 나누고 1월 19일 함께 유엔에 가입함
    - 분리에 반대해 물러났던 하벨이 1993년 1월 체코 대통령으로 뽑힘
    - 1999년 북대서양 조약 기구(NATO), 2004년 유럽 연합에 가입함
  startEvents: [czech-slovak-split-1993]
  basis:
    type: primary_source
    refs: ["체코 공화국 헌법(1992)", "체코슬로바키아 연방 해체법(1992)"]
    foundingNote: 체코슬로바키아가 평화롭게 나뉜 1993년 1월 1일을 시작으로 봄

