  color: "#d4b040"
  summary: 843년 베르됭 조약으로 황제 로타르 1세가 받은 북해에서 이탈리아까지의 가운데 왕국(프리슬란트·저지대·라인강 왼쪽·알자스·부르군트·프로방스·이탈리아). 855년 프륌 조약으로 로타르 2세(로타링기아)·루도비코 2세(이탈리아)·샤를(프로방스)에게 나뉘었고, 869년 로타르 2세가 죽은 뒤 870년 메르센 조약으로 서·동프랑크가 나눠 가짐
  mapNote: 지도에는 843~854년 로타르 1세의 왕국 전체(이탈리아 포함), 855~869년 로타르 2세의 로타링기아(859년 트란스유라를 루도비코 2세에게 넘김, 863년 리옹·비엔을 얻음)를 표시
  endNote: 869년 로타르 2세가 후계자 없이 죽은 뒤 870년 8월 메르센 조약으로 샤를 대머리왕과 독일인 루트비히가 서쪽과 동쪽을 나눠 가짐
  features:
    - 855년 프륌 조약으로 루도비코 2세는 이탈리아와 황제 칭호를, 로타르 2세는 로타링기아를, 샤를은 프로방스를 받음
    - 859년 로타르 2세가 제네바·로잔·시옹의 트란스유라를 루도비코 2세에게 넘김
    - 863년 샤를이 죽어 프로방스는 루도비코 2세에게, 리옹·비엔은 로타르 2세에게 감
    - 로타르 2세는 아내 테우트베르가와 이혼하려다 교황과 맞섬
  startEvents: [louis-pious-verdun-814]
  endEvents: [middle-francia-meerssen-855]
  basis:
    type: primary_source
    refs: ["베르됭 조약(843)", "프륌 조약(855)", "메르센 조약(870)", "『생베르탱 연대기』"]
    # 작업 메모: (작업 M5)
    foundingNote: 베르됭 조약(843)을 시작으로 봄

- id: italy-carolingian
  level: polity
  names: { ko: 이탈리아 왕국 (중세 초), en: Kingdom of Italy (early medieval), native: Regnum Italiae }
  from: 855
  to: 962
  color: "#4a8a5a"
  summary: 옛 롬바르드 왕국 땅(파비아)의 왕국. 855년 프륌 조약으로 루도비코 2세가 다스렸고, 875년부터 카롤링거 왕들(샤를 대머리왕·카를만·뚱보 샤를)과 888년부터 베렌가리오 1세·스폴레토의 귀도와 람베르토·루이 맹인왕·루돌프 2세·아를의 위그·베렌가리오 2세가 다툼. 951~952년 오토 1세가 이탈리아 왕이 되어 베렌가리오 2세를 봉신으로 삼았고 962년 오토 1세의 황제 대관 뒤 신성 로마 제국의 구성 왕국이 됨
  mapNote: 프륌 조약(855)을 시작으로 봄(843~854년은 로타르 1세의 중프랑크). 962년부터 이탈리아 소국들(1000년 지도와 이어짐). 875~887년 서·동프랑크 왕과의 동군 연합은 따로. 지도에는 855~961년 롬바르디아·토스카나·스폴레토·프리울리와 863~878년 프로방스, 859~887년 트란스유라를 표시
  endNote: 951~952년 오토 1세가 이탈리아 왕이 되어 베렌가리오 2세를 봉신으로 삼았고 962년 오토 1세의 황제 대관 뒤 신성 로마 제국의 구성 왕국이 됨
  features:
    - 루도비코 2세는 859년 트란스유라를, 863년 프로방스를 넘겨받음
    - 871년 2월 황제 루도비코 2세가 바리를 함락했고 동로마와 공을 두고 다툼
    - 875년부터 카롤링거 왕들(샤를 대머리왕·카를만·뚱보 샤를)이 이어짐
    - 888년부터 베렌가리오 1세·스폴레토의 귀도와 람베르토·루이 맹인왕·루돌프 2세·아를의 위그·베렌가리오 2세가 다툼
    - 899년 마자르가 브렌타강에서 베렌가리오 1세를 꺾고 이탈리아를 약탈함
  startEvents: [middle-francia-meerssen-855]
  endEvents: [otto-i-empire-936]
  basis:
    type: primary_source
    refs: ["프륌 조약(855)", "크레모나의 리우트프란드, 『보복』", "『베렌가리오의 업적』"]
    # 작업 메모: (작업 M5) / M-②(다) / (M-②(라)) / 1000년 표
    foundingNote: 프륌 조약(855)을 시작으로 봄(843~854년은 로타르 1세의 중프랑크)

- id: provence-kingdom
  level: polity
  names: { ko: 프로방스 왕국 (하부르군트), en: Kingdom of Provence (Lower Burgundy), native: Regnum Provinciae }
  from: 855
  to: 933
  color: "#c87850"
  summary: 론강 하류의 왕국. 855년 프륌 조약으로 로타르 1세의 막내 샤를(863 죽음)이 프로방스·리옹·비엔을 받았고, 879년 만텔 회의에서 보소가 왕으로 뽑혀 다시 섰으며(하부르군트), 890년 그 아들 루이 맹인왕(901 황제)과 섭정 아를의 위그로 이어지다 933년 위그가 상부르군트의 루돌프 2세에게 넘겨 부르군트(아를) 왕국이 됨
  mapNote: 프륌 조약(855)을 시작으로 봄. 863~878년은 이탈리아·로타링기아·서프랑크 땅이라 영토가 없음. 882년 비엔 함락·887~889년 공위는 그리지 않음. 지도에는 855~862년(프로방스의 샤를)과 879~932년(보소·루이 맹인왕)을 표시
  endNote: 933년 아를의 위그가 프로방스를 상부르군트의 루돌프 2세에게 넘겨 부르군트(아를) 왕국이 됨
  features:
    - 863년 샤를이 죽어 프로방스는 루도비코 2세에게, 리옹·비엔은 로타르 2세에게 감
    - 879년 만텔 회의에서 보소가 왕으로 뽑혀 다시 섬(하부르군트)
    - 890년 보소의 아들 루이 맹인왕(901 황제)과 섭정 아를의 위그로 이어짐
  startEvents: [middle-francia-meerssen-855]
  endEvents: [west-francia-capetian-888]
  basis:
    type: primary_source
    refs: ["프륌 조약(855)", "만텔 회의 문서(879)", "레기노, 『연대기』"]
    # 작업 메모: (작업 M5) / (check:data 경고)
    foundingNote: 프륌 조약(855)을 시작으로 봄

- id: brittany-kingdom
  level: polity
  names: { ko: 브르타뉴 왕국, en: Kingdom of Brittany, native: Rouantelezh Breizh }
  from: 851
  to: 939
  color: "#9fb08a"
  summary: 노미노에(845 발롱 전투)의 아들 에리스포에가 851년 앙제 조약으로 왕 칭호와 렌·낭트·레츠를 얻은 브르타뉴인의 왕국. 살로몽(857~874)이 863년 앙트람 조약·867년 콩피에뉴 조약으로 앙주 서부와 코탕탱·아브랑섕을 얻었고 알랭 대왕(888~907) 뒤 바이킹의 침입(919~936)으로 무너졌다가 939년 알랭 2세가 트랑스라포레에서 이겨 공국으로 이어짐
  mapNote: 지도에는 851~938년 브르타뉴 다섯 도와 867~932년 코탕탱·아브랑섕을 표시하고 939년부터 브르타뉴 공국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 907년 알랭이 죽은 뒤 919~936년 바이킹의 침입으로 무너졌다가 939년 알랭 2세가 트랑스라포레에서 이겨 브르타뉴 공국으로 이어짐
  features:
    - 857년 사촌 살로몽이 에리스포에를 죽이고 왕이 됨
    - 살로몽이 863년 앙트람 조약으로 앙주 서부를, 867년 콩피에뉴 조약으로 코탕탱과 아브랑섕을 얻음
    - 874년 살로몽이 살해된 뒤 내분이 이어졌고 알랭 대왕(888~907)이 다시 묶음
    - 933년 코탕탱과 아브랑섕이 노르망디로 넘어감
    - 이 시기 서프랑크 왕의 힘은 브르타뉴에 거의 미치지 못함
  startEvents: [brittany-nominoe-845]
  endEvents: [brittany-nominoe-845]
  basis:
    type: primary_source
    refs: ["앙제 조약(851)", "콩피에뉴 조약(867)", "『생베르탱 연대기』", "『낭트 연대기』"]
    # 작업 메모: 작업 M5 / 919~936년 바이킹 점령은 정할 점 M5-④
    foundingNote: 앙제 조약(851)을 시작으로 봄

- id: asturias
  level: polity
  names: { ko: 아스투리아스 왕국, en: Kingdom of Asturias, native: Reinu d'Asturies }
  from: 718
  to: 910
  color: "#b070d0"
  summary: 펠라요(718 코바동가)가 세운 이베리아 북부의 기독교 왕국. 알폰소 2세(791~842)가 오비에도를 도읍으로 삼았고 오르도뇨 1세(레온 856)·알폰소 3세 대왕(포르투 868·코임브라 878·사모라 893·시망카스 899)이 두에로강까지 넓힘. 910년 가르시아 1세가 레온으로 도읍을 옮겨 레온 왕국으로 이어짐
  mapNote: 지도에는 718~909년 표시(718 아스투리아스, 741 베르베르인이 떠난 뒤 갈리시아·레온·칸타브리아)하고 910년부터 레온 왕국(이름만 바뀌어 이어짐, 같은 색). 두에로강 북쪽 빈 땅은 재정주 기사 해(포르투갈 북부 868·사모라 893·시망카스 899·살라망카 940)까지 비움
  endNote: 910년 알폰소 3세가 아들들에게 밀려나자 왕국이 셋으로 나뉘었고 가르시아 1세가 도읍을 레온으로 옮겨 레온 왕국이 됨
  features:
    - 펠라요의 사위 알폰소 1세(739~757)가 갈리시아·레온·칸타브리아를 차례로 아우름(740년대~750년대에 걸친 일)
    - 알폰소 2세(791~842)가 오비에도를 도읍으로 삼고 산티아고 무덤 발견 전승(9세기 초)을 후원함
    - 오르도뇨 1세(850~866)가 854년 아스토르가, 856년 레온을 다시 채움(재정주)
    - 알폰소 3세 대왕(866~910)이 868년 포르투, 878년 코임브라, 893년 사모라, 899년 시망카스를 재정주함
    - 코르도바 아미르국이 880~928년 무왈라드와 호족의 반란으로 흔들려 이를 막지 못함
  startEvents: [muslim-iberia-asturias-711]
  endEvents: [asturias-leon-800]
  basis:
    type: primary_source
    refs: ["『알폰소 3세 연대기』", "『알벨덴세 연대기』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M5 / (M-①(마)) / 작업 M6에서 718년부터로 넓힘(718 아스투리아스, 741 베르베르인이 떠난 뒤 갈리시아·레온·칸타브리아, 정할 점 M6-⑥) / 지도에는 800~909년 표시 / 지도에는 718년부터 표시
    foundingNote: 펠라요의 코바동가 전투(718)를 시작으로 봄

- id: cordoba-emirate
  level: polity
  names: { ko: 코르도바 아미르국 (후우마이야), en: Emirate of Córdoba, native: إمارة قرطبة }
  from: 756
  to: 929
  color: "#3f8f6f"
  summary: 아바스 혁명을 피한 우마이야 가문의 압드 알라흐만 1세가 756년 세운 알안달루스의 아미르국. 하캄 1세·압드 알라흐만 2세·무함마드 1세 때 프랑크(801 바르셀로나)·아스투리아스와 다퉜고, 880~928년 이븐 하프순 등 무왈라드의 반란을 압드 알라흐만 3세가 누른 뒤 929년 칼리프를 칭함
  mapNote: 지도에는 756~928년 표시(756 압드 알라흐만 1세, 759 나르본을 잃음, 785 지로나, 799 팜플로나)하고 929년부터 후우마이야 칼리프국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 928년 압드 알라흐만 3세가 이븐 하프순의 아들 하프스의 항복으로 반란을 끝내고 929년 1월 16일 칼리프를 칭해 후우마이야 칼리프국이 됨
  features:
    - 아바스 칼리프를 인정하지 않았고 763년 아바스가 보낸 원정군을 무찌름
    - 788년 압드 알라흐만 1세가 죽은 뒤 히샴 1세(788~796)가 793년 셉티마니아로 쳐들어감
    - 하캄 1세·압드 알라흐만 2세·무함마드 1세 때 프랑크(801 바르셀로나)·아스투리아스와 다툼
    - 880년 무렵부터 보바스트로의 이븐 하프순을 비롯한 무왈라드와 호족의 반란에 시달림
  startEvents: [cordoba-emirate-756]
  endEvents: [caliphate-almanzor-880]
  basis:
    type: primary_source
    refs: ["이븐 하이얀, 『무크타바스』", "『아크바르 마즈무아』"]
    # 작업 메모: 정할 점 M-⑦·M-⑧, 작업 M5 / 작업 M6에서 756년부터로 넓힘(756 압드 알라흐만 1세, 759 나르본을 잃음, 785 지로나, 799 팜플로나) / 무왈라드 영주들의 자립(바다호스·보바스트로·세비야)은 정할 점 M5-⑨ / 지도에는 800~928년 표시 / 지도에는 756년부터 표시
    foundingNote: 압드 알라흐만 1세의 즉위(756)를 시작으로 봄

- id: wessex
  level: polity
  names: { ko: 웨식스 왕국, en: Kingdom of Wessex, native: Westseaxna rīce }
  from: 519
  to: 927
  color: "#e0503c"
  summary: 잉글랜드 남서부의 서색슨 왕국. 에그버트가 825년 엘렌던 전투로 켄트·서식스·에식스를 얻고 829년 머시아를 한때 정복함. 앨프레드 대왕(871~899)이 878년 에딩턴 전투로 데인인을 막고 886년 런던을 얻었으며, 에드워드 장형왕(899~924)이 917~918년 데인로 남부를 되찾고, 애설스탠이 927년 요크를 얻어 잉글랜드 왕국이 됨
