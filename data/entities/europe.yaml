  from: 1299
  to: 1922
  color: "#b5845a"
  summary: 아나톨리아·발칸·아랍 지역을 다스린 이슬람 제국. 19세기에 그리스(1830)·세르비아·루마니아·몬테네그로(1878)·불가리아(1908)가 떨어져 나가 '유럽의 병자'로 불림. 탄지마트 개혁(1839~1876)과 청년 튀르크 혁명(1908)을 겪었고 발칸 전쟁(1912~1913)으로 유럽 땅을 대부분 잃음. 법적 주권은 남았지만 다른 나라가 점령·통치한 보스니아(1878~)·키프로스(1878~)·도데카니사(1912~)는 오스만 색의 점령지로 따로 표시함. 지도에는 유럽 권역 안(발칸·아나톨리아·키프로스·캅카스 일부)만 표시하고 중동·북아프리카는 아직 그리지 않음
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)", "런던 조약(1913)", "콘스탄티노폴리스 조약(1913)"]
