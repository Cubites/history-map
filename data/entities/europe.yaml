  basis:
    type: primary_source
    refs: ["베르사유 조약(1919)", "메멜 협약(1924)"]

- id: saar-territory
  level: region
  names: { ko: 자르 지역 (국제 연맹 관리), en: Territory of the Saar Basin, native: Saargebiet }
