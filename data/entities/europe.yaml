    foundingNote: 오타카르 1세가 세습 왕위를 받은 1198년을 시작으로 봄

- id: habsburg-austria
  level: polity
  names: { ko: 오스트리아 (합스부르크 세습령), en: Habsburg hereditary lands (Austria), native: Habsburgische Erblande }
  from: 1282
  to: 1526
  color: "#d6bd6e"
  summary: 합스부르크 가문이 다스린 오스트리아 대공국·슈타이어마르크·케른텐·크라인·티롤·포어아를베르크와 트리에스테·고리치아(1500). 15세기에는 알브레히트계(라디슬라프, 1457년 끊김)와 레오폴트계(프리드리히 3세·티롤의 지기스문트)가 나눠 가졌고, 1482~1490년 헝가리의 마티아스 코르비누스가 빈과 니더외스터라이히를 차지함. 막시밀리안 1세(1493~1519)가 모두 합치고 1521~1522년 페르디난트 1세가 물려받아 1526년 보헤미아·헝가리 왕위를 더해 합스부르크 군주국이 됨
  mapNote: 지도에는 1282~1525년만(케른텐 1335, 티롤 1363, 포어아를베르크 1375) 표시하고 1526년부터는 합스부르크 군주국 항목(같은 색). 앞오스트리아(슈바벤·엘자스)는 신성 로마 제국 묶음으로 그린 근사
  endNote: 1521~1522년 페르디난트 1세가 물려받아 1526년 보헤미아·헝가리 왕위를 더해 합스부르크 군주국이 됨
  features:
    - 루돌프 1세가 1276년 빈 조약으로 오타카르 2세에게 오스트리아·슈타이어마르크·케른텐·크라인을 내놓게 함
    - 15세기에는 알브레히트계(라디슬라프, 1457년 끊김)와 레오폴트계(프리드리히 3세·티롤의 지기스문트)가 나눠 가짐
    - 1482~1490년 헝가리의 마티아스 코르비누스가 빈과 니더외스터라이히를 차지함
    - 막시밀리안 1세(1493~1519)가 모두 합침
  startEvents: [rudolf-habsburg-1273]
  endEvents: [mohacs-1526]
  basis:
    type: primary_source
