  summary: 합스부르크 왕가가 오스트리아·보헤미아·헝가리 등 여러 나라의 군주를 겸해 다스린 나라로 신성 로마 황제를 냄. 모하치 전투(1526) 뒤 페르디난트 1세가 보헤미아와 헝가리 서부·북부를 얻어 시작되었고, 카를로비츠 조약(1699)으로 헝가리·트란실바니아를 얻음. 에스파냐 왕위 계승 전쟁 뒤 벨기에·밀라노·나폴리 등을 얻었으나 슐레지엔을 프로이센에 빼앗김(1742). 1804년 프란츠 2세가 오스트리아 황제를 칭함
  details: 모하치 전투(1526) 뒤 페르디난트 1세가 보헤미아 왕관령과 헝가리 서부·북부(왕령 헝가리)·크로아티아를 얻고 동헝가리 왕국·오스만과 헝가리를 나눔(1538 너지바러드, 1547·1568 아드리아노플 조약). 1556년 카를 5세가 물러나며 에스파냐계와 갈라짐. 30년 전쟁 때 보헤미아 반란(1618~1620)을 누르고 프라하 평화 조약(1635)으로 라우지츠를 작센에 넘김. 17세기에는 헝가리 서부·북부(왕령 헝가리)만 다스렸으나 빈 포위(1683)를 물리친 대튀르크 전쟁 끝에 카를로비츠 조약(1699)으로 헝가리·트란실바니아·슬라보니아를 얻음. 에스파냐 왕위 계승 전쟁 뒤 위트레흐트·라슈타트 조약(1713~1714)으로 오스트리아령 네덜란드(벨기에)·밀라노·나폴리·사르데냐(1720년 시칠리아와 바꿈, 나폴리·시칠리아는 1735년 부르봉에 넘김)를 얻었고, 파사로비츠 조약(1718)으로 바나트를 얻음. 1740년 마리아 테레지아가 뒤를 이은 뒤 오스트리아 왕위 계승 전쟁으로 슐레지엔을 프로이센에 빼앗겼고(1742) 폴란드 분할(1772·1795)에 참여함. 프랑스 혁명 전쟁에서 벨기에·롬바르디아를 잃는 대신 베네치아·이스트리아·달마티아를 얻음(캄포포르미오 조약, 1797). 1804년 프란츠 2세가 오스트리아 황제를 칭함
