- id: lydia
  level: polity
  names: { ko: 리디아, en: Lydia, native: Śfarda }
  from: -679
  to: -546
  color: "#d4a017"
  summary: 아나톨리아 서부의 왕국(도읍 사르데이스). 메름나다이 왕조의 기게스(680 무렵~644)가 세우고, 알리아테스(600 무렵~560)가 메디아와 싸운 뒤 585년 일식 전투 끝에 할리스강을 경계로 정했으며(헤로도토스 1.74), 크로이소스(560~547)가 이오니아·아이올리스·도리스의 그리스 도시와 할리스강 서쪽의 민족(킬리키아·리키아 밖)을 다스림. 547년 키루스 2세에게 사르데이스가 함락됨
  mapNote: 지도에는 기원전 680~586년 마니사·우샤크도, 585년(할리스강 조약)부터 프리기아·미시아·빌레지크·부르사·데니즐리, 560년(크로이소스)부터 이오니아·아이올리스·카리아·트로아스·비티니아·파플라고니아·팜필리아를 표시하고 547년 사르데이스 함락 뒤 아케메네스. 리카오니아·피시디아는 헤로도토스 1.28의 목록에 없어 비움
  endNote: 기원전 547년 키루스 2세에게 사르데이스가 함락되어 끝남
  features:
    - 기게스(기원전 680 무렵~644)가 메름나다이 왕조를 열었고 킴메르인과 싸우다 죽음
    - 알리아테스(기원전 600 무렵~560)가 킴메르인을 몰아내고 이오니아 도시들을 압박함
    - 알리아테스가 메디아와 싸운 뒤 기원전 585년 일식 전투 끝에 할리스강을 경계로 정함(헤로도토스 1.74)
    - 크로이소스(기원전 560~547)가 이오니아·아이올리스·도리스의 그리스 도시와 할리스강 서쪽의 민족(킬리키아·리키아 밖)을 다스림
    - 호박금(일렉트론) 동전을 처음 찍은 나라로 알려졌고 크로이소스가 금화와 은화를 따로 만들었다고 함
