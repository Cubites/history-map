  endNote: 1104~1105년 조지아 왕 다비트 4세 건설왕이 에르초 전투 뒤 카헤티-헤레티를 합쳐 조지아 왕국에 들어감
  features:
    - 아브하지아 왕국이 904~908년 무렵 카르틀리를 얻은 뒤에도 코레피스코포스 공국으로 따로 남음
    - 1010~1014년 바그라트 3세에게 점령됨
  startEvents: [caucasus-580]
  endEvents: [georgia-david-1089]
  basis:
    type: primary_source
    refs: ["『카르틀리스 츠호브레바』(조지아 연대기)"]
    # 작업 메모: (작업 M4) / 작업 M5에서 800년부터로 넓힘 / 작업 M6에서 787년부터로 넓힘 / 지도에는 1000~
    foundingNote: 그리골의 카헤티 공국(787년 무렵)을 시작으로 봄

- id: danishmendids
  level: polity
  names: { ko: 다니슈멘드 베이국, en: Danishmendids, native: Dânişmendliler }
  from: 1071
  to: 1178
  color: "#90b060"
  summary: 만지케르트 전투(1071) 뒤 다니슈멘드 가지가 시바스·토카트·아마시아·카이세리를 차지해 세운 튀르크 베이국. 제1차 십자군 무렵 가장 강했고(1100 안티오크의 보에몽을 사로잡음, 1102 말라티아), 1174~1175년 룸 술탄 클르츠 아르슬란 2세가 본가를 병합했으며 말라티아의 갈래도 1178년 끝남
  mapNote: 지도에는 1071~1174년 시바스·토카트·아마시아·카이세리·요즈가트·초룸·강그라·카스타모누·삼순과 1103~1177년 말라티아를 표시
  endNote: 1174~1175년 룸 술탄 클르츠 아르슬란 2세가 본가를 병합했고, 말라티아의 갈래도 1178년 끝나 룸 술탄국으로 합쳐짐
  features:
    - 다니슈멘드 가지는 1071~1075년 무렵 등장했고 1075~1084년 시바스·토카트·아마시아를 다스림
    - 제1차 십자군 무렵 가장 강해 1100년 안티오크의 보에몽을 사로잡고 1101년 새 십자군을 룸과 함께 꺾었으며 1102년 말라티아를 차지함
  startEvents: [manzikert-1064]
  endEvents: [rum-sultanate-1077]
  basis:
    type: primary_source
    refs: ["『다니슈멘드나메』", "시리아인 미카엘, 『연대기』"]
    # 작업 메모: (작업 M4) / 카스타모누의 콤네노스 회복(1130년대)은 정할 점 M4-⑬
    foundingNote: 만지케르트 전투 뒤의 정착(1071)을 시작으로 봄

- id: edessa-county
  level: polity
  names: { ko: 에데사 백국, en: County of Edessa, native: Comté d'Édesse }
  from: 1098
  to: 1150
  color: "#f0c090"
  summary: 제1차 십자군의 불로뉴의 보두앵이 1098년 에데사를 차지해 세운 첫 십자군 국가(유프라테스강 양쪽). 1144년 12월 장기가 에데사를 함락했고, 서쪽의 투르베셀(텔바시르) 쪽 남은 땅은 1150년 백작 부인 베아트리스가 동로마에 팔았으나 이듬해 누르 앗딘과 룸에 넘어감
  mapNote: 지도 범위 안의 우르파(1143년까지)·아드야만·가지안테프·킬리스와 1104~1148년 마라시(영주령)를 표시
  endNote: 1150년 조슬랭 2세가 사로잡히자 백작 부인 베아트리스가 서쪽 투르베셀(텔바시르) 쪽 남은 땅을 동로마에 팔아 백국이 끝남. 그 땅은 이듬해 누르 앗딘과 룸에 넘어감
  features:
    - 주민은 아르메니아·시리아 정교도와 무슬림이 다수였고 라틴 지배층은 소수였음
    - 보두앵 2세가 1104년 5월 하란 전투에서 셀주크 연합군에게 크게 지고 사로잡혀 1108년 풀려남
    - 1144년 12월 24일 장기가 약 4주 포위 끝에 에데사를 점령했고 이는 제2차 십자군의 계기가 됨
    - 1146년 조슬랭 2세가 에데사를 기습으로 되찾으려 했으나 누르 앗딘의 군대가 곧 도시를 되찾음
  startEvents: [first-crusade-1095, crusader-states-1098]
  endEvents: [crusader-states-1098]
  basis:
    type: primary_source
    refs: ["샤르트르의 풀셰, 『예루살렘 원정사』", "에데사의 마태오, 『연대기』"]
    # 작업 메모: (정할 점 M-⑥, 작업 M4)
    foundingNote: 보두앵의 에데사(1098)를 시작으로 봄

- id: cilicia-principality
  level: polity
  names: { ko: 킬리키아 아르메니아 공국, en: Armenian Principality of Cilicia, native: Կիլիկիոյ Հայկական Իշխանութիւն }
  from: 1080
  to: 1198
  color: "#50d0d0"
  summary: 루벤 1세(1080)가 타우루스산맥의 킬리키아 산지에 세운 아르메니아 공국(루벤 가문). 동로마·안티오크와 평야를 다투다 1137년 요안니스 2세에게 한때 무너졌고, 토로스 2세가 되살렸으며 믈레흐(1173)가 평야를 차지함. 1198년 레본 2세가 황제 하인리히 6세와 교황의 승인으로 왕관을 받아 왕국이 됨
  mapNote: 지도에는 1080~1197년 시스 쪽 산지와 1173년부터 평야(아다나·메르신·오스마니예)를 표시하고 1198년부터 킬리키아 아르메니아 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1198년 1월 6일 레본 2세가 타르수스에서 황제 하인리히 6세와 교황의 승인으로 마인츠 대주교 콘라트의 손에서 왕관을 받아 킬리키아 아르메니아 왕국이 됨
  features:
    - 레본 1세가 1132년 평야를 얻었으나 1137년 동로마 황제 요안니스 2세가 킬리키아를 점령해 레본을 끌고 감
    - 아들 토로스 2세가 1143년 무렵 탈출해 산지를 되찾았고 1151~1152년 평야까지 돌려받음
    - 토로스의 동생 믈레흐가 1170년 누르 앗딘의 도움으로 권력을 잡아 1173년 평야를 차지함
    - 루벤 3세(1175~1187)를 거쳐 레본 2세가 1187년부터 공으로 다스림
  startEvents: [cilicia-armenia-1080]
  endEvents: [cilicia-armenia-1080]
  basis:
    type: primary_source
    refs: ["대원수 셈바트, 『연대기』", "에데사의 마태오, 『연대기』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M4 / 1097~1137년 십자군·동로마의 평야 지배와 1137~1144년 동로마의 산지 정복은 정할 점 M4-⑮
    foundingNote: 루벤 1세(1080)를 시작으로 봄

- id: sicily-emirate
  level: polity
  names: { ko: 시칠리아 토후국, en: Emirate of Sicily, native: إمارة صقلية }
  from: 831
  to: 1091
  color: "#50a050"
  summary: 아글라브 왕조가 827년부터 정복한 시칠리아에 선 이슬람 토후국(831 팔레르모, 965 정복 마침). 칼브 왕조(948~1053)가 다스리다 군소 카이드들로 갈라졌고, 1061년 메시나부터 로제르 1세의 노르만이 정복해 1072년 팔레르모, 1091년 노토가 떨어짐
  mapNote: 지도 범위 안의 시칠리아만 지도에 831~1090년 표시(831 팔레르모, 843 메시나, 859 엔나, 878 시라쿠사)
  endNote: 1091년 2월 노토가 떨어져 로제르 1세의 노르만이 시칠리아 정복을 마침
  features:
    - 878년 5월 시라쿠사가 아홉 달 포위 끝에 떨어졌고 965년 로메타를 끝으로 섬 전체가 이슬람 땅이 됨
    - 정복은 약탈과 포로 노예 무역을 낳았고, 시라쿠사 함락을 겪은 수사 테오도시오스의 편지가 학살과 끌려간 포로를 적음
    - 아글라브 왕조가 909년 파티마 왕조에 무너진 뒤에도 토후국은 이어짐
    - 칼브 왕조(948~1053)가 다스리다 군소 카이드들로 갈라짐
    - 1061년 메시나부터 로제르 1세의 노르만이 정복해 1072년 팔레르모를 차지함
  startEvents: [sicily-conquest-827]
  endEvents: [normans-south-italy-1017]
  basis:
    type: primary_source
    refs: ["이븐 알아시르, 『완사』", "말라테라의 고프레도, 『로제르 백작 행적』"]
    # 작업 메모: (작업 M4) / 앞 시기는 / 작업 M5에서 넓힘 / 작업 M5에서 831년부터로 넓힘(831 팔레르모, 843 메시나, 859 엔나, 878 시라쿠사)
    foundingNote: 팔레르모를 차지한 831년을 시작으로 봄

- id: sicily-county
  level: polity
  names: { ko: 시칠리아 백국, en: County of Sicily, native: Contea di Sicilia }
  from: 1071
  to: 1130
  color: "#9fc06f"
  summary: 오트빌 가문의 로제르 1세가 형 로베르 기스카르와 함께 시칠리아를 정복해 세운 백국(1071 카타니아, 1072 팔레르모, 1091 노토). 아들 로제르 2세가 1127년 아풀리아 공국을 물려받고 1128년 교황의 봉토 수여를 받았으며, 1130년 시칠리아 왕으로 대관함
  mapNote: 지도에는 1071~1129년(1128년부터 아풀리아 공국 땅 포함) 표시하고 1130년부터 시칠리아 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1130년 12월 25일 로제르 2세가 대립교황 아나클레투스 2세가 준 왕관으로 팔레르모에서 시칠리아 왕으로 대관함
  features:
    - 로제르 1세는 1086년 시라쿠사, 1087년 아그리젠토를 거쳐 1091년 2월 노토에서 섬 정복을 마침
    - 로제르 1세는 아랍 관리를 쓰고 그리스·라틴 교회를 함께 두는 통치를 했으나 이슬람 주민 일부는 섬을 떠남
    - 로제르 2세가 1127년 아풀리아 공국을 물려받고 1128년 교황의 봉토 수여를 받음
  startEvents: [normans-south-italy-1017]
  endEvents: [sicily-kingdom-1127]
  basis:
    type: primary_source
    refs: ["말라테라의 고프레도, 『로제르 백작 행적』", "텔레세의 알렉산데르, 『로제르 왕 행적』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M4 / 1085년까지 아풀리아 공작의 봉신이던 관계는 정할 점 M4-⑨
    foundingNote: 카타니아를 차지하고 백국을 세운 1071년을 시작으로 봄

- id: apulia-duchy
  level: polity
  names: { ko: 아풀리아·칼라브리아 공국, en: Duchy of Apulia and Calabria, native: Ducato di Puglia e Calabria }
  from: 1042
  to: 1128
  color: "#6fb0e0"
  summary: 노르만 기사들이 1042년 멜피에서 세운 아풀리아 백국(굴리엘모 철팔)이 로베르 기스카르 때 1059년 멜피 조약으로 교황의 봉신인 공국이 됨. 1060년 칼라브리아, 1071년 바리를 차지해 동로마의 이탈리아 지배를 끝냈고 1077년 살레르노를 얻음. 1127년 공작 굴리엘모가 대를 잇지 못하고 죽어 시칠리아의 로제르 2세에게 넘어감
  mapNote: 지도에는 1042~1127년 표시하고 1128년부터 시칠리아 백국
  endNote: 1127년 공작 굴리엘모가 대를 잇지 못하고 죽어 시칠리아의 로제르 2세에게 넘어갔고, 로제르는 1128년 교황의 봉토 수여를 받음
  features:
    - 1053년 6월 18일 치비타테에서 로베르 기스카르 등 노르만군이 교황 레오 9세의 군대를 크게 이겨 교황을 사로잡음
    - 1060년 칼라브리아, 1071년 4월 바리(동로마의 마지막 거점, 3년 포위), 1077년 살레르노를 차지함
    - 1081년 로베르가 디라키온 앞에서 알렉시오스 1세를 크게 이겼고 1085년 죽을 때까지 발칸을 노림
  startEvents: [normans-south-italy-1017]
  endEvents: [sicily-kingdom-1127]
  basis:
    type: primary_source
    refs: ["아풀리아의 굴리엘모, 『로베르 기스카르 행적』", "몬테카시노의 아마투스, 『노르만사』"]
    # 작업 메모: (작업 M4) / (M-②(마)) / 교황의 봉신 관계는 relations.yaml(M-②(마))
    foundingNote: 멜피의 노르만 백국(1042)을 시작으로 봄. 교황의 봉신

- id: lombard-principalities
  level: polity
  names: { ko: 롬바르드·캄파니아 공국들 (묶음), en: Lombard and Campanian principalities (grouped), native: Principati longobardi }
  from: 774
  to: 1140
  color: "#d0a0a0"
  summary: 남이탈리아의 롬바르드 공국들(베네벤토·살레르노·카푸아)과 동로마를 섬기던 해안 공국들(나폴리·아말피·가에타·소렌토)을 묶은 항목. 노르만이 차례로 차지해 1058년 카푸아(드렝고 가문), 1073년 아말피, 1077년 살레르노가 넘어갔고, 1139년 미냐노 조약과 1140년 나폴리 병합으로 시칠리아 왕국에 들어감
  mapNote: 여러 공국을 묶어 그림. 지도에는 774~1139년 표시(774 베네벤토 공국과 동로마의 나폴리 공국·가에타, 886년까지 아풀리아·루카니아·코센차, 1000~1139년 캄파니아·몰리세와 라치오 남부(가에타)). 노르만의 카푸아 공국(1058~1135)과 베네벤토의 교황령(1051)은 이 묶음에 넣은 근사
  endNote: 로제르 2세가 1139년 미냐노 조약으로 왕위를 인정받고 1140년까지 나폴리·카푸아와 아브루초를 차지하면서 롬바르드 공국들이 시칠리아 왕국에 들어가 끝남
  features:
    - 롬바르드·캄파니아 공국들(베네벤토·살레르노·나폴리 등)은 서로 싸우며 무슬림 용병을 쓰기도 함
    - 1030년 노르만의 아베르사 백작령이 섬
    - 노르만이 차례로 차지해 1058년 카푸아(드렝고 가문), 1073년 아말피, 1077년 살레르노가 넘어감
  startEvents: [charlemagne-lombards-768]
  endEvents: [sicily-kingdom-1127]
  basis:
    type: primary_source
