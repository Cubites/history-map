- id: pergamon-kingdom
  level: polity
  names: { ko: 페르가몬 왕국 (아탈로스 왕조), en: Attalid Kingdom of Pergamon, native: Πέργαμον }
  from: -281
  to: -132
  color: "#2e8b57"
  summary: 리시마코스의 재무관 필레타이로스가 기원전 282년 페르가몬의 보물과 함께 셀레우코스 편에 서며 세운 아탈로스 왕조의 나라. 아탈로스 1세(241~197)가 갈라타이를 이기고 왕을 칭했고 로마의 동맹이 되었으며, 에우메네스 2세(197~159)는 188년 아파메아 조약으로 리디아·프리기아·미시아·리카오니아와 트라키아 케르소네소스를 얻어 아나톨리아 서부의 대국이 됨. 아탈로스 3세가 기원전 133년 죽으며 나라를 로마에 물려줌(아리스토니코스의 반란 133~129)
  mapNote: 필레타이로스의 자립(기원전 282년)을 시작으로 봄. 기원전 133년(유증)부터 로마. 228~223년 아탈로스 1세가 잠시 차지한 셀레우코스 땅은 되돌려져 그리지 않음. 지도에는 기원전 281~134년 페르가몬(이즈미르도 북부)을 표시(282년의 자립은 281년에 묶음, 281~264년은 셀레우코스의 종속)하고 기원전 218년부터 미시아·트로아스(아탈로스 1세의 원정), 188년부터 아파메아 조약의 땅을 더함
  endNote: 아탈로스 3세가 기원전 133년 죽으며 나라를 로마에 물려줌(아리스토니코스의 반란 133~129)
  features:
    - 아탈로스 1세(기원전 241~197)가 갈라타이를 이기고 왕을 칭했으며 로마의 동맹이 됨
    - 에우메네스 2세(기원전 197~159)가 기원전 188년 아파메아 조약으로 리디아·프리기아·미시아 등을 얻어 아나톨리아 서부의 대국이 됨
  startEvents: [anatolian-kingdoms-331bc, diadochi-corupedium-297bc]
  endEvents: [pergamon-bequest-133bc]
  basis:
    type: primary_source
    refs: ["폴리비오스, 『역사』 4·5·21권", "리비우스, 『로마 건국사』 37~38권", "스트라본, 『지리지』 13.4"]
    # 작업 메모: (작업 AN3) / (정할 점 AN3-⑨) / 작업 AN4에서 기원전 281년(−280) 버전부터 페르가몬(282 필레타이로스의 자립을 묶음)을 표시하고 281~264년은 셀레우코스의 종속(relations.yaml) / 천문 연도 −281 / (−132, 유증) / (−280)
    foundingNote: 리시마코스의 재무관 필레타이로스가 셀레우코스 편에 선 해(기원전 282년)를 시작으로 봄

- id: bithynia-kingdom
  level: polity
  names: { ko: 비티니아 왕국, en: Kingdom of Bithynia, native: Βιθυνία }
  from: -333
  to: -73
  color: "#7b68ee"
  summary: 트라키아계 비티니아인의 왕 지포이테스가 기원전 297년 왕을 칭하며 세운 아나톨리아 북서부의 왕국(니코메디아). 니코메데스 1세가 갈라타이를 아나톨리아로 불러들였고, 프루시아스 1세(228~182)가 키오스·미르레이아를 얻어 프루사를 세움(한니발이 그의 궁정에 숨음). 니코메데스 3세·4세는 폰토스의 미트리다테스 6세와 다퉜고, 니코메데스 4세가 기원전 74년 죽으며 나라를 로마에 물려줌
  mapNote: "바스가 알렉산드로스의 장군 칼라스를 물리치고 자립한 해(기원전 334년. 297 지포이테스의 왕호)를 시작으로 봄. 기원전 74년(유증)부터 로마. 지도에는 기원전 334~75년 표시: 기원전 334년부터 코자엘리·사카리아·볼루·뒤즈제·얄로바도, 281년부터 빌레지크·부르사도·칼케돈까지. 기원전 108년 무렵 파플라고니아 서부의 몫은 근사로 폰토스째"
  endNote: 니코메데스 4세가 기원전 74년 죽으며 나라를 로마에 물려주었고 로마 공화정이 속주로 삼음
  features:
    - 니코메데스 1세가 갈라타이를 아나톨리아로 불러들였음
    - 프루시아스 1세(기원전 228~182)가 키오스·미르레이아를 얻어 프루사를 세움(한니발이 그의 궁정에 숨음)
    - 니코메데스 3세·4세는 폰토스의 미트리다테스 6세와 다툼
  startEvents: [alexander-granicus-issus-334bc, anatolian-kingdoms-331bc]
  endEvents: [bithynia-third-mithridatic-74bc]
  basis:
    type: primary_source
    refs: ["멤논, 『헤라클레이아사』", "폴리비오스, 『역사』 4.50~52", "아피아노스, 『미트리다테스 전쟁』 7·71"]
    # 작업 메모: 작업 AN4에서 −296에서 앞당김 / (정할 점 AN3-⑪) / (작업 AN3) / 작업 AN4에서 기원전 334~282년 코자엘리·사카리아·볼루·뒤즈제·얄로바도, 281년(−280)부터 빌레지크·부르사도·칼케돈을 더해 표시 / 천문 연도 −333 / (−73, 유증) / (−280)
    foundingNote: 바스가 알렉산드로스의 장군 칼라스를 물리치고 자립한 해(기원전 334년. 기원전 297년은 지포이테스의 왕호)를 시작으로 봄

- id: pontus-kingdom
  level: polity
  names: { ko: 폰토스 왕국 (미트리다테스 왕조), en: Kingdom of Pontus, native: Πόντος }
  from: -280
  to: -62
  color: "#787830"
  summary: 페르시아 귀족 가문의 미트리다테스 1세 크티스테스가 기원전 281년 무렵 아마세이아를 중심으로 세운 흑해 남쪽의 왕국. 파르나케스 1세가 기원전 183년 시노페를 차지해 도읍으로 삼았고, 미트리다테스 6세 에우파토르(120~63)가 보스포로스·크림(디오판토스, 110~107)·콜키스·소아르메니아를 더하고 파플라고니아·카파도키아를 노려 로마와 세 번 싸움(88~85·83~81·73~63). 88년 아시아의 로마인을 학살하고 그리스까지 나아갔으나 술라에게 져 다르다노스 조약(85)으로 물러났고, 루쿨루스와 폼페이우스에게 지고 63년 판티카파이온에서 죽음
  mapNote: "미트리다테스 1세의 자립(기원전 281년 무렵)을 시작으로 봄. 기원전 63년 폼페이우스의 정리로 끝남. 88~85년 아시아·비티니아·카파도키아 점령과 67~66년의 일시 회복은 되돌려져 그리지 않음. 지도에는 기원전 281~64년 표시: 기원전 281년부터 아마세이아·토카트·삼순·초룸, 264~64년 아마세이아·아미소스·코마나, 183년부터 시노페와 트라페주스까지의 해안 도시 띠, 112년 무렵(스트라본 12.3.28)부터 소아르메니아와 오르두·기레순·트라브존도의 내륙(폰토스 산맥의 부족 땅), 108년부터 보스포로스·케르소네소스·콜키스·파플라고니아(96년까지)"
  endNote: 루쿨루스와 폼페이우스에게 진 미트리다테스 6세가 기원전 63년 판티카파이온에서 죽음. 폼페이우스의 동방 정리로 왕국이 끝남
  features:
    - 기원전 183년 파르나케스 1세가 시노페를 차지해 도읍으로 삼음
    - 미트리다테스 6세 에우파토르(기원전 120~63)가 보스포로스·크림(디오판토스, 110~107)·콜키스·소아르메니아를 더함
    - 기원전 88~63년 파플라고니아·카파도키아를 노리며 로마와 세 번 싸움(88~85·83~81·73~63)
    - 기원전 88년 아시아의 로마인을 학살하고 그리스까지 나아갔으나 술라에게 져 다르다노스 조약(85)으로 물러남
  startEvents: [anatolian-kingdoms-331bc]
  endEvents: [pompey-east-66bc]
  basis:
    type: primary_source
    refs: ["아피아노스, 『미트리다테스 전쟁』", "스트라본, 『지리지』 7.4·12.3", "멤논, 『헤라클레이아사』", "플루타르코스, 『루쿨루스』·『폼페이우스』"]
    # 작업 메모: (작업 AN3, 정할 점 AN3-⑩) / (정할 점 AN3-⑨) / 작업 AN4에서 기원전 281년(−280)부터 아마세이아·토카트·삼순·초룸을 표시(302/301 키미아타부터의 땅은 정할 점 AN4-⑦) / 작업 FIX5b(FIX 후보 ⑬)에서 오르두·기레순·트라브존도의 내륙(폰토스 산맥의 부족 땅)은 소아르메니아와 함께 기원전 112년(−111, 스트라본 12.3.28)부터 그림(183년부터는 해안 도시 띠만) / 천문 연도 −280 / (−111) / (−107) / (−62) / (−280) / (−111, 스트라본 12.3.28)
    foundingNote: 미트리다테스 1세의 자립(기원전 281년 무렵)을 시작으로 봄

- id: ptolemaic-kingdom
  level: polity
  names: { ko: 프톨레마이오스 왕국, en: Ptolemaic Kingdom, native: Πτολεμαϊκὴ βασιλεία }
  from: -322
  to: -29
  color: "#f0d060"
  summary: 알렉산드로스의 장군 프톨레마이오스 1세가 기원전 305년 왕을 칭하며 세운 이집트의 헬레니즘 왕국. 3세기에는 키프로스·리키아·카리아와 킬리키아 해안·에게해 섬들·트라키아 해안을 다스렸으나 197년 안티오코스 3세에게 아나톨리아 해안을 잃음. 키프로스는 58년 로마가 빼앗았다가 47년 카이사르가 돌려주었고, 36년 안토니우스가 클레오파트라 7세에게 킬리키아 해안도 줌. 기원전 30년 옥타비아누스가 알렉산드리아를 차지해 끝남
  mapNote: 지도 범위 안 땅만 그림. 지도에는 기원전 311~59년과 기원전 44~31년 키프로스(306~295 데메트리오스는 근사, 47년 카이사르의 반환은 44년에 묶음), 기원전 301~197년 리키아, 기원전 37~31년 킬리키아 트라케이아를 표시. 3세기의 카리아·팜필리아·킬리키아 해안 도시와 사모스·에페소스(246~197)·트라키아 해안은 조각이 맞지 않아 근사
  endNote: 기원전 30년 옥타비아누스가 알렉산드리아에 들어오자 안토니우스가 자결하고 클레오파트라도 곧 죽음. 왕국이 끝나고 이집트는 옥타비아누스의 사적인 속주가 됨
  features:
    - 기원전 3세기에는 키프로스·리키아·카리아와 킬리키아 해안·에게해 섬들·트라키아 해안을 다스림
    - 기원전 197년 안티오코스 3세에게 아나톨리아 해안을 잃음
    - 키프로스는 기원전 58년 로마가 빼앗았다가 47년 카이사르가 돌려줌
    - 기원전 36년 안토니우스가 클레오파트라 7세에게 킬리키아 해안도 줌
  startEvents: [diadochi-babylon-323bc]
  endEvents: [antony-cleopatra-actium-41bc]
  basis:
    type: primary_source
    refs: ["폴리비오스, 『역사』 5.34", "스트라본, 『지리지』 14.5~6", "카시우스 디오, 『로마사』 42·49·51권"]
    # 작업 메모: 작업 AN4에서 앞당김 / (AN-②) / (작업 AN3) / (정할 점 AN3-⑪) / 작업 AN4에서 기원전 311년(−310)부터 키프로스(306~295 데메트리오스는 근사), 301년(−300)부터 리키아를 표시 / 천문 연도 −322 / 44년 버전 / (−310) / (−300)
    foundingNote: 프톨레마이오스 1세가 이집트 사트라프가 된 바빌론 분할(기원전 323년. 305 왕호)을 시작으로 봄

- id: rhodes
  level: polity
  names: { ko: 로도스, en: Rhodes, native: Ῥόδος }
  from: -407
  to: -26
  color: "#20b0b0"
  summary: 로도스섬의 세 도시가 기원전 408년 합쳐 세운 해상 국가. 3~2세기 에게해 교역과 해적 소탕의 중심이었고(305~304 데메트리오스의 포위, 거상), 로마의 동맹으로 기원전 188년 아파메아 조약에서 리키아와 마이안드로스강 남쪽 카리아를 얻었으나 페르세우스 전쟁 때의 처신으로 167년 그 땅을 잃고 델로스 자유항에 교역을 빼앗김. 그 뒤에도 로마의 동맹 자유국으로 남았고 기원전 43년 카시우스가 도시를 약탈함
  mapNote: 세 도시의 합병(기원전 408년)을 시작으로 봄. 기원전 27년부터 로마. 지도에는 기원전 405~28년 도데카니사(로도스·코스 등, 코스는 근사)를 표시(408 합병은 405년에 묶음)하고 기원전 188~168년 카리아(무글라도)·리키아도 표시. 본토의 '페라이아'는 1만 km² 미만이라 무글라도째 근사
  endNote: 기원전 43년 카시우스가 도시를 약탈함. 기원전 27년 원수정이 서며 그리스가 아카이아 속주가 된 뒤로는 로마로 봄(로도스는 아테네처럼 자유시의 지위를 이음)
  features:
    - 기원전 3~2세기 에게해 교역과 해적 소탕의 중심이었음(기원전 305~304년 데메트리오스의 포위, 거상)
    - 로마의 동맹으로 기원전 188년 아파메아 조약에서 리키아와 마이안드로스강 남쪽 카리아를 얻음
    - 페르세우스 전쟁 때의 처신으로 기원전 167년 그 땅을 잃고 델로스 자유항에 교역을 빼앗김
  startEvents: [peloponnesian-war-431bc]
  endEvents: [augustus-principate-27bc]
  basis:
