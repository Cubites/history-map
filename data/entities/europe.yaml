    - 폴란드 분할(1772·1793·1795)로 리투아니아·벨라루스·우크라이나 우안·쿠를란트를 얻음
    - 1809년 핀란드, 1812년 베사라비아를 차지하고 캅카스 전쟁(1817~1864) 끝에 체첸까지 차지함
    - 베이징 조약(1860)으로 연해주를 차지해 조선과 국경을 맞댐
    - 카자흐 초원과 중앙아시아(타슈켄트 1865, 코칸트 1876 병합 등)를 차지했으나 러일 전쟁(1904~1905)에서 짐
