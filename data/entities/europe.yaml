  to: 1864
  color: "#9cbfd4"
  summary: 케르키라(코르푸)·케팔로니아·자킨토스 등 이오니아해의 일곱 섬으로 된 나라. 1815년 파리 조약으로 영국의 보호국이 되었고 1864년 그리스에 넘겨짐. 1809~1814년 영국이 섬들을 차례로 점령해 1814년 6월 코르푸까지 넘겨받은 때부터 표시
  basis:
    type: primary_source
    refs: ["파리 조약(1815)", "런던 조약(1864)"]

- id: cretan-state
  level: polity
  names: { ko: 크레타 자치국, en: Cretan State, native: Κρητική Πολιτεία }
  from: 1898
  to: 1913
  color: "#86b4c4"
  summary: 1897~1898년 봉기 뒤 열강의 보호 아래 오스만 종주권을 둔 자치국이 됨. 그리스 왕자 게오르기오스가 고등 판무관을 맡았고, 1908년 그리스와의 통합을 선언해 1913년 그리스에 합쳐짐
  basis:
    type: primary_source
    refs: ["런던 조약(1913)"]
    foundingNote: 열강이 자치를 정하고 오스만군이 물러난 1898년을 시작으로 봄

- id: serbia
  level: polity
  names: { ko: 세르비아, en: Serbia, native: Србија }
  from: 1817
  to: 1918
  color: "#b8706d"
  summary: 두 차례 봉기(1804·1815) 끝에 1817년 밀로시 오브레노비치가 공이 되어 자치를 얻고 1830년 오스만이 자치 공국으로 인정함. 베를린 조약(1878)으로 독립해 니시·피로트를 얻고 1882년 왕국이 됨. 발칸 전쟁(1912~1913)으로 코소보·마케도니아를 얻었고, 1914년 사라예보 사건으로 오스트리아-헝가리의 공격을 받음. 1918년 세르브·크로아트·슬로베네 왕국이 됨
  basis:
    type: primary_source
    refs: ["오스만 칙령(1830)", "베를린 조약(1878)", "부쿠레슈티 조약(1913)"]
    foundingNote: 밀로시 오브레노비치가 세습 공으로 추대된 1817년을 자치 공국의 시작으로 봄(오스만의 공식 인정은 1830년)

- id: montenegro
  level: polity
  names: { ko: 몬테네그로, en: Montenegro, native: Црна Гора }
  from: 1696
  to: 1918
  color: "#8b6f9c"
  summary: 산악 지대의 정교회 나라로 오스만의 지배를 사실상 받지 않음. 1852년 주교공국에서 세속 공국이 되고 1878년 베를린 조약으로 독립을 인정받아 니크시치·포드고리차·바르를 얻음(울치니는 1880년). 1910년 왕국이 되고 발칸 전쟁으로 영토를 넓혔으나 1918년 세르비아에 합쳐짐
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)", "런던 조약(1913)"]
    foundingNote: 페트로비치-네고시 가문이 주교공 자리를 세습하기 시작한 1696년을 시작으로 봄

- id: moldavia
  level: polity
  names: { ko: 몰다비아 공국, en: Principality of Moldavia, native: Principatul Moldovei }
  from: 1346
  to: 1859
  color: "#b9a7d1"
  summary: 오스만의 종주권 아래 있던 루마니아계 공국. 슈테판 대공(1457~1504) 때 오스만에 맞섰으나 킬리아·아케르만을 빼앗겼고(1484, 1486년 바예지트 2세와의 강화로 확인) 1538년 술레이만 1세의 원정 뒤 종주가 굳어짐. 1775년 북쪽의 부코비나를 오스트리아에 넘김. 1812년 부쿠레슈티 조약으로 프루트강 동쪽(베사라비아)을 러시아에 넘김. 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음. 크림 전쟁 뒤 파리 조약(1856)으로 남베사라비아를 얻었고, 1859년 왈라키아와 같은 공(쿠자)을 뽑아 합쳐짐
  basis:
    type: primary_source
    refs: ["부쿠레슈티 조약(1812)", "아드리아노플 조약(1829)", "파리 조약(1856)"]
    foundingNote: 공국이 선 1346년 무렵을 시작으로 봄

- id: wallachia
  level: polity
  names: { ko: 왈라키아 공국, en: Principality of Wallachia, native: Țara Românească }
  from: 1310
  to: 1859
  color: "#9fc4ae"
  summary: 오스만의 종주권 아래 있던 루마니아계 공국으로 수도는 부쿠레슈티. 1600년 미하이 용감공이 트란실바니아·몰다비아를 잠시 함께 다스렸으나 그해 무너짐. 1718~1739년 올트강 서쪽의 올테니아(소왈라키아)를 오스트리아에 빼앗김. 1829년 아드리아노플 조약 뒤 러시아의 보호도 받음. 1859년 몰다비아와 같은 공(쿠자)을 뽑아 연합 공국이 됨
  basis:
    type: primary_source
    refs: ["아드리아노플 조약(1829)", "파리 조약(1856)"]
    foundingNote: 바사라브 1세가 공국을 세운 1310년 무렵을 시작으로 봄

- id: romania
  level: polity
  names: { ko: 루마니아, en: Romania, native: România }
  from: 1859
  to: null
  color: "#a5b8db"
  summary: 1859년 몰다비아·왈라키아가 쿠자를 함께 공으로 뽑아 연합 공국이 되고 1862년 하나로 합쳐 1866년부터 루마니아라 부름. 1878년 베를린 조약으로 독립해 북도브루자를 얻는 대신 남베사라비아를 러시아에 넘김. 1881년 왕국이 되고 2차 발칸 전쟁(1913)으로 남도브루자를 얻음. 1916년 협상국 편으로 참전해 1918년 베사라비아·부코비나·트란실바니아를 합친 대루마니아가 됨(트리아농 조약, 1920). 1940년 베사라비아·북부코비나(소련)·북트란실바니아(헝가리)·남도브루자(불가리아)를 잃고 추축국으로 독소 전쟁에 참전해 베사라비아를 되찾고 오데사 일대를 점령했으나, 1944년 8월 편을 바꿔 북트란실바니아를 되찾음. 1947년 파리 강화 조약으로 북트란실바니아를 되찾은 국경이 확정되고 그해 말 인민 공화국이 됨. 1989년 12월 혁명으로 공산 정권이 무너짐
  basis:
    type: primary_source
    refs: ["파리 협약(1858)", "베를린 조약(1878)", "부쿠레슈티 조약(1913)", "트리아농 조약(1920)", "2차 빈 중재(1940)", "크라이오바 조약(1940)", "파리 강화 조약(1947)"]
    foundingNote: 두 공국이 같은 공을 뽑은 1859년을 시작으로 봄

- id: bulgaria
  level: polity
  names: { ko: 불가리아, en: Bulgaria, native: България }
  from: 1878
  to: null
  color: "#8aa86a"
  summary: 러시아-튀르크 전쟁(1877~1878) 뒤 산스테파노 조약으로 대불가리아가 정해졌으나 베를린 조약(1878)으로 도나우강과 발칸산맥 사이의 자치 공국으로 줄어듦. 1885년 동루멜리아를 합치고 1908년 독립 왕국을 선포함. 1913년 2차 발칸 전쟁에 져 남도브루자를 루마니아에 넘겼으나 서트라키아를 얻어 에게해에 닿음. 1차 대전에 동맹국으로 참전해 1919년 뇌이 조약으로 서트라키아·스트루미차를 잃음. 1940년 크라이오바 조약으로 남도브루자를 되찾고 1941년 추축국에 가담해 마케도니아·서트라키아를 차지했으나 1944년 9월 소련군이 들어오며 내놓음. 1946년 왕정을 폐지하고 인민 공화국이 되었으며 1947년 파리 강화 조약으로 남도브루자를 지킴. 1989년 공산 일당 체제가 끝남
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)", "부쿠레슈티 조약(1913)", "뇌이 조약(1919)", "크라이오바 조약(1940)", "파리 강화 조약(1947)"]
    foundingNote: 베를린 조약으로 자치 공국이 된 1878년을 시작으로 봄. 중세 불가리아 제국은 따로 다룸

- id: eastern-rumelia
  level: polity
  names: { ko: 동루멜리아, en: Eastern Rumelia, native: Източна Румелия }
  from: 1878
  to: 1885
  color: "#a9c4a0"
  summary: 베를린 조약(1878)으로 발칸산맥 남쪽에 세운 오스만 제국의 자치주. 기독교도 총독이 다스렸고 1885년 플로브디프의 봉기로 불가리아에 합쳐짐(1886년 톱하네 협정으로 사실상 인정)
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)", "톱하네 협정(1886)"]

- id: albania
  level: polity
  names: { ko: 알바니아, en: Albania, native: Shqipëria }
  from: 1912
  to: null
  color: "#7f9f9a"
  summary: 1912년 1차 발칸 전쟁 중 블로러에서 독립을 선언하고 1913년 런던 대사 회의에서 열강의 인정을 받음. 1914년 독일 귀족 빌헬름 추 비트를 공으로 맞았으나 1차 대전으로 곧 혼란에 빠짐. 1차 대전 중 여러 나라에 점령되었다가 1920년 루슈녜 회의로 독립을 되찾음(1921년 대사 회의가 국경을 다시 확인). 1928년 조구 1세가 왕이 되었고 1939년 4월 이탈리아에 병합되었으며(1941~1943 코소보·서마케도니아를 더함) 1943~1944년 독일이 점령함. 1944년 11월 공산 파르티잔이 해방함. 1946년 인민 공화국이 되었고 소련(1961)·중국(1978)과 차례로 갈라서며 고립 노선을 걸음. 1991년 다당제를 받아들임
  basis:
    type: primary_source
    refs: ["블로러 독립 선언(1912)", "런던 대사 회의 결정(1913)", "피렌체 의정서(1913)", "대사 회의 결정(1921)"]
    foundingNote: 독립을 선언한 1912년 11월을 시작으로 봄. 지도에는 국경이 정해진 1913년부터 표시

- id: cyprus-british
  level: region
  names: { ko: 키프로스 (영국 관리지), en: Cyprus (British administration) }
  from: 1878
  to: 1914
  color: "#b5845a"
  summary: 1878년 키프로스 협약으로 영국이 점령해 다스린 오스만 제국의 섬. 러시아를 막는 대가로 영국이 관리했고 주권은 오스만에 남았으나, 1914년 11월 오스만이 1차 대전에 참전하자 영국이 합병함
  basis:
    type: primary_source
    refs: ["키프로스 협약(1878)"]

- id: dodecanese-occupied
