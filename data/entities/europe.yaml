  summary: 호엔촐레른 왕가의 왕국. 프리드리히 빌헬름 1세가 군대를 키우고, 프리드리히 2세(대왕)가 오스트리아 왕위 계승 전쟁으로 슐레지엔을 차지해(1742) 7년 전쟁(1756~1763)에서 지켜 냄. 폴란드 분할(1772·1793·1795)로 바르샤바까지 차지했으나 1806년 예나 전투에 져 틸지트 조약(1807)으로 엘베강 서쪽과 폴란드 분할 땅을 잃음. 빈 회의(1815)로 라인란트·베스트팔렌을 얻어 영토가 동서로 나뉨. 1834년 관세 동맹을 이끌고, 비스마르크의 철혈 정책으로 덴마크(1864)·오스트리아(1866)를 이겨 북독일 연방을 만들고 1871년 독일 제국을 세움. 지도에는 1866년까지만 따로 표시하고 그 뒤는 북독일 연방·독일 제국에 포함
  basis:
