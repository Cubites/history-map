- id: nicaea
  level: polity
  names: { ko: 니케아 제국, en: Empire of Nicaea, native: Βασιλεία τῶν Ῥωμαίων }
  from: 1204
  to: 1261
  color: "#7b3f8f"
  summary: 콘스탄티노폴리스가 함락된 뒤 테오도로스 1세 라스카리스가 비티니아의 니카이아에 세운 비잔티움 망명 국가. 요안니스 3세 바타치스(1222~1254) 때 1225년 라틴의 아시아 땅과 섬들, 1246년 테살로니키와 마케도니아를 얻었고, 1259년 펠라고니아 전투에서 에피루스·아카이아·시칠리아 연합군을 이김. 1261년 7월 미하일 8세 팔라이올로고스가 콘스탄티노폴리스를 되찾아 동로마 제국으로 이어짐
  mapNote: 지도에는 1204~1260년 표시하고 1261년부터 동로마 제국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1261년 7월 미하일 8세 팔라이올로고스가 콘스탄티노폴리스를 되찾아 동로마 제국으로 이어짐. 8월 15일 미하일 8세가 도시에 정식으로 입성해 대관식을 올림
  features:
    - 요안니스 3세 바타치스(1222~1254) 때 1225년 라틴의 아시아 땅과 섬들, 1246년 테살로니키와 마케도니아를 얻음
    - 1259년 미하일 8세의 동생 요한 팔라이올로고스가 펠라고니아에서 에피루스·아카이아·시칠리아 연합군을 이김
    - 1261년 3월 미하일 8세가 제노바와 님파이온 조약을 맺어 제노바가 함대로 도와 주는 대신 무역 특권을 얻게 함
