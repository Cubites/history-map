  mapNote: 아라곤 왕국과 바르셀로나 백국이 합쳐진 1164년을 시작으로 봄. 루시용·세르다뉴의 저당·점령은 그리지 않음. 지도에는 1164~1478년만(1308 알리칸테, 1324 사르데냐 남부, 1344 마요르카 왕국) 표시하고 1479년부터는 에스파냐 항목
  endNote: 1479년 후안 2세의 아들 페르난도 2세가 이어 카스티야와 같은 왕 아래(에스파냐) 놓임
  features:
