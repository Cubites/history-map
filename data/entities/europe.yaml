    - 카를 5세가 프리슬란트(1524)·위트레흐트·오버레이설(1528)·흐로닝언(1536)·헬데른(1543)을 더해 17주를 이룸
    - 부르고뉴 관구(1548)·국사 조칙(1549)으로 한 덩어리로 묶음
