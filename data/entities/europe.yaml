  mapNote: 지도에는 기원전 800~696년 앙카라·에스키셰히르·아피온·퀴타히아·크르크칼레도를 표시하고 695년 무렵 무너진 뒤 비움, 585년부터 리디아
  endNote: 기원전 695년 무렵(에우세비오스의 연대) 킴메리아인에게 고르디온이 무너짐(전승의 미다스의 자결). 그 뒤 프리기아인의 땅은 기원전 6세기 초 리디아가 차지함
  features:
    - 기원전 8세기 끝의 미다스 왕(아시리아 기록의 무시키의 미타, 717~709)이 가장 강했음
    - 미다스는 기원전 709년 무렵 아시리아의 사르곤 2세와 화해함
    - 만지는 것이 금이 되는 이야기는 그리스 쪽 전설임
