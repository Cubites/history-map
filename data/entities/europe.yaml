- id: teutonic-order
  level: polity
  names: { ko: 튜턴 기사단국, en: State of the Teutonic Order, native: Deutschordensstaat }
  from: 1230
  to: 1525
  color: "#7d8aa6"
  summary: 튜턴 기사단이 프로이센과 포메렐리아(단치히)를 다스린 수도회 국가. 1454년 프로이센 연합이 들고일어나 폴란드 왕에게 의탁하면서 13년 전쟁이 일어났고, 1466년 제2차 토룬 조약으로 포메렐리아·헤움노 땅·말보르크·엘블롱크·바르미아(왕령 프로이센)를 폴란드에 넘기고 나머지는 폴란드 왕의 봉토가 됨. 1525년 크라쿠프 조약으로 기사단장 알브레히트가 루터파로 바꾸고 세속 프로이센 공국이 됨
  mapNote: 지도에는 1230~1524년만(1230년 헤움노 땅, 1236 포메사니아, 1240 바르미아·포게사니아, 1255 삼비아, 포메렐리아 1309, 메멜 1329, 사모기티아 1398) 표시하고 1525년부터는 프로이센 공국 항목(같은 색). 1400~1410년 사모기티아(1398 살리나스 조약·1411 제1차 토룬 조약), 1400~1407년 고틀란드, 1402~1454년 노이마르크(1402 지기스문트가 저당으로 팖·1429 완전 소유, 1454 쾰른 조약·1455 메베 조약으로 브란덴부르크)도 표시
  endNote: 1525년 크라쿠프 조약으로 단장 알브레히트가 루터파로 바꾸고 기사단국을 세속 공국으로 바꿔 스스로 세습 공작이 되어 폴란드 왕에게서 봉토로 받음
  features:
    - 1231년 토룬, 1233년 마리엔베르더 등 성을 쌓으며 프로이센 부족들을 하나씩 정복함
    - 1249년 크리스트부르크 화약으로 프로이센인이 세례를 받으면 자유를 인정받는 대신 기사단의 지배를 받아들임
    - 1260~1274년 '대프로이센 반란'을 진압하고 1283년 수도비아 정복을 마친 것으로 봄
    - 1454년 프로이센 연합이 폴란드 왕에게 의탁해 13년 전쟁이 일어났고 1466년 제2차 토룬 조약을 맺음
    - 조약으로 포메렐리아·헤움노 땅·말보르크·엘블롱크·바르미아를 폴란드에 넘기고 나머지는 폴란드 왕의 봉토가 됨
  startEvents: [teutonic-prussia-1230]
  endEvents: [ducal-prussia-1525]
  basis:
    type: primary_source
    refs: ["제2차 토룬 조약(1466)", "크라쿠프 조약(1525)"]
    # 작업 메모: 작업 M3에서 1230년부터로 넓힘 / 작업 M2 / 작업 M1·FIX2
    foundingNote: 콘라트 공작의 초청으로 헤움노 땅에 자리 잡은 1230년을 시작으로 봄

- id: burgundy
  level: polity
  names: { ko: 부르고뉴 공국, en: Burgundian State, native: État bourguignon }
  from: 1363
  to: 1482
  color: "#a35d86"
  summary: 발루아 부르고뉴 가문(선량공 필리프·대담공 샤를·마리)이 다스린 부르고뉴 공작령·프랑슈콩테와 저지대(플랑드르·아르투아·브라반트·홀란트·제일란트·에노·나뮈르·룩셈부르크)와 솜강 도시들. 1477년 1월 샤를이 낭시에서 죽자 루이 11세가 공작령·피카르디·아르투아·프랑슈콩테를 차지했고, 딸 마리가 막시밀리안과 혼인해 전쟁이 이어지다 1482년 아라스 조약으로 공작령·피카르디는 프랑스, 저지대는 그 아들 필리프(합스부르크)에게 감
  mapNote: 지도에는 1363~1481년만 표시(1363~1383년은 부르고뉴 공작령, 1384년 플랑드르·아르투아·프랑슈콩테 상속. 1400~1452년 저지대 획득은 1428 에노·홀란트·제일란트(델프트 조약으로 섭정·상속인, 1433 실제 승계), 1429 나뮈르, 1430 브라반트, 1436 솜강 도시(1435 아라스 조약), 1444 룩셈부르크(1443). 1477~1481년 프랑스의 점령은 조약 전이라 그리지 않음). 1482년부터 저지대는 합스부르크령 네덜란드 항목
  endNote: 1477년 1월 샤를이 낭시에서 죽자 루이 11세가 공작령·피카르디·아르투아·프랑슈콩테를 차지함. 딸 마리가 막시밀리안과 혼인해 전쟁이 이어지다 1482년 12월 아라스 조약으로 공작령·피카르디는 프랑스에 남고 저지대는 마리의 아들 필리프(합스부르크)가 이어받음
  features:
    - 필리프 2세(르 아르디)가 1369년 6월 헨트에서 플랑드르 상속녀 마르그리트와 혼인함
    - 1384년 1월 필리프가 아내를 통해 플랑드르·아르투아·부르고뉴 백작령(프랑슈콩테)을 물려받음
    - 선량공 필리프가 나뮈르(1429)·브라반트(1430)·에노·홀란트·제일란트(1433)·룩셈부르크(1443)를 차례로 얻음
    - 대담공 샤를이 1476년 그랑송(3월)과 무르텐(6월) 전투에서 스위스군에 크게 짐
  startEvents: [burgundy-flanders-1363]
  endEvents: [burgundian-wars-1474]
  basis:
    type: primary_source
    refs: ["아라스 조약(1435)", "콩플랑 조약(1465)", "아라스 조약(1482)", "상리스 조약(1493)"]
    # 작업 메모: 작업 M2 / 작업 M1 / 정할 점 ⑦
    foundingNote: 장 2세가 아들 필리프에게 부르고뉴 공작령을 준 1363년을 시작으로 봄

- id: provence
  level: polity
  names: { ko: 프로방스 백국, en: County of Provence, native: Comté de Provence }
  from: 1246
  to: 1481
  color: "#e08a6a"
  summary: 앙주 가문이 다스린 신성 로마 제국의 백국(엑스·마르세유·툴롱·그라스). 르네 왕(앙주 공·나폴리 왕 칭호)이 1480년 죽고 조카 샤를 4세가 1481년 12월 죽으며 루이 11세에게 물려줘 프랑스 왕령이 됨(1486년 프로방스 신분회가 합병을 확인)
  mapNote: 지도에는 1246~1480년만 표시
  endNote: 1480년 르네 왕이 죽고 조카 샤를 4세가 1481년 12월 죽으며 루이 11세에게 물려줘 프랑스 왕령이 됨. 1486년 프로방스 신분회가 합병을 확인함
  features:
    - 앙주의 샤를이 교황의 제안을 받아들여 1266년 시칠리아 왕이 됨
