  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "스위스 연방 헌법(1848)"]
    foundingNote: 우리·슈비츠·운터발덴이 동맹을 맺은 1291년을 기원으로 봄. 1300~1525년은 가입 해대로 그림(작업 M2·FIX2). 8주(1291~1353)에 더해 동맹국은 정회원 여러 곳과 영구 동맹을 맺은 해(아펜첼 1411·고지 발레 1417·장크트갈렌 1451·샤프하우젠 1454·뇌샤텔 1481·그라우뷘덴 1498), 정회원(프리부르·졸로투른 1481, 바젤 1501), 속령·공동 통치령은 조약 해(아르가우 1415·레벤티나 1441·투르가우 1461·저지 발레 1477·벨린초나 1503·티치노 남부와 발텔리나 1516·제네바 1526·보 1564). 정할 점 FIX2-①(EUROPE_DRAFT.md 8.12)

