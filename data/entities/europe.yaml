    - 939년 시망카스에서 라미로 2세와 페르난 곤살레스, 나바라 왕 가르시아 산체스 1세가 칼리프국군을 꺾고 940년 살라망카를 다시 채움
    - 알폰소 9세(1188~1230)가 1229년 카세레스, 1230년 메리다·바다호스를 얻음
  startEvents: [asturias-leon-800]
  endEvents: [fernando-iii-1230]
  basis:
    type: primary_source
    refs: ["루카스 데 투이, 『세계 연대기』", "베나벤테 협약(1230)"]
    # 작업 메모: 정할 점 M-⑧, 작업 M3 / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 910년부터로 넓힘(아스투리아스 왕국의 renames, 같은 색) / 지도에는 1000~1229년 표시 / 지도에는 910년부터 표시
    foundingNote: 가르시아 1세가 레온에서 다스린 910년을 시작으로 봄

- id: castile-early
  level: polity
  names: { ko: 카스티야 왕국 (레온과 합치기 전), en: Kingdom of Castile (before 1230), native: Reino de Castilla }
  from: 1065
  to: 1230
  color: "#d8b04c"
  summary: 산초 2세(1065)부터 이어진 카스티야 왕국(부르고스·톨레도·쿠엥카). 알폰소 8세(1158~1214)가 1200년 알라바·기푸스코아를 얻고 1212년 라스나바스데톨로사에서 알모하드를 크게 이김. 1217년 페르난도 3세가 이었고 1230년 레온 왕국을 물려받아 카스티야 왕관(카스티야 왕국)이 됨
  mapNote: 지도에는 1065~1229년 표시하고 1230년부터 카스티야 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1217년 페르난도 3세가 이었고 1230년 레온 왕국을 물려받아 카스티야 왕관(카스티야 왕국)이 됨
  features:
    - 산초 2세가 1072년 암살되자 알폰소 6세가 레온·카스티야·갈리시아를 모두 이어받음
    - 알폰소 6세는 1076년 리오하와 비스카야를, 1085년 5월 톨레도를 차지했고 톨레도는 이후 카스티야의 중심이 됨
    - 알폰소 8세(1158~1214)가 1200년 알라바·기푸스코아를 얻음
    - 1212년 라스나바스데톨로사에서 아라곤 왕·나바라 왕과 손잡은 알폰소 8세가 알모하드를 크게 이김
  startEvents: [iberia-sancho-ferdinand-1035]
  endEvents: [fernando-iii-1230]
  basis:
    type: primary_source
    refs: ["로드리고 히메네스 데 라다, 『스페인사』", "『라틴 카스티야 연대기』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M3 / 작업 M4에서 1065년부터로 넓힘 / 기존 항목 castile의 from은 그대로
    foundingNote: 산초 2세가 왕이 된 1065년을 시작으로 봄

- id: almohads
  level: polity
  names: { ko: 알모하드 칼리프국 (이베리아), en: Almohad Caliphate (Iberia), native: الموحدون }
  from: 1147
  to: 1228
  color: "#40a0a0"
  summary: 이븐 투마르트의 운동에서 일어나 마그레브와 알안달루스를 다스린 베르베르계 칼리프국(수도 마라케시, 이베리아는 세비야). 1195년 알라르코스에서 카스티야를 이겼으나 1212년 라스나바스데톨로사에서 크게 졌고, 1224년 유수프 2세가 죽은 뒤 내분으로 1228년 알마문이 이베리아를 떠나 알안달루스는 다시 여러 타이파로 나뉨
  mapNote: 지도 범위 안의 이베리아 쪽만 지도에 1147~1228년 표시. 1200~1202년 마요르카의 바누 가니야는 근사
  endNote: 1224년 유수프 2세가 죽은 뒤 내분으로 1228년 알마문이 이베리아를 떠나 알안달루스는 다시 여러 타이파로 나뉨
  features:
    - 압드 알무민이 1147년 마라케시를 차지해 알모라비드가 무너짐
    - 이베리아에서는 1147년 세비야를 얻고 1157년 알메리아까지 차례로 차지함
    - 딤미(유대인·기독교인)에게 개종하거나 떠나라고 요구해 많은 유대인이 달아남
    - 아부 야쿠브 유수프(재위 1163~1184)는 세비야 대모스크의 미나레트(훗날의 히랄다 탑)를 시작함
    - 1195년 알라르코스에서 카스티야를 이겼으나 1212년 라스나바스데톨로사에서 크게 짐
  startEvents: [almohads-1145]
  endEvents: [las-navas-1212]
  basis:
    type: primary_source
    refs: ["이븐 이다리, 『바얀 알무그리브』", "이븐 아비 자르, 『라우드 알키르타스』"]
    # 작업 메모: (정할 점 M-⑦) / (작업 M3) / 작업 M4에서 1147년부터로 넓힘
