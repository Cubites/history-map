    - 602년 아바르가 안테스를 쳐서 사료에서 안테스가 사라짐(테오필락투스)
    - 남쪽 부족은 하자르에 공납했고 『원초 연대기』는 폴랴네·세베랴네·뱌티치의 공납을 859년 항목에 적음
    - 862년 일멘 슬로베네·크리비치 등이 바랴그인 류리크를 불렀다고 『원초 연대기』는 전함
    - 883년 드레블랴네·884년 세베랴네·885년 라디미치·966년 뱌티치가 차례로 루스에 공납함
  startEvents: [slavs-sclaveni-527]
  endEvents: [vladimir-baptism-977]
