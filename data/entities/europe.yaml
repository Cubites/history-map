  from: 1139
  to: null
  color: "#7da36b"
  summary: 1580~1640년 에스파냐 왕이 왕을 겸한 동군연합이었다가(지도에서는 따로 표시) 1640년 브라간사 왕조가 독립을 되찾고 1668년 리스본 조약으로 인정받음. 1822년 브라질이 독립한 뒤 아프리카 식민지를 넓힘. 1910년 혁명으로 공화국이 됨. 지도에는 유럽 본토와 아소르스·마데이라 제도만 표시. 1932년부터 살라자르의 독재(이스타두 노부)가 이어졌고 2차 대전에서는 중립을 지킴. 1974년 카네이션 혁명으로 독재가 무너짐
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)"]
    foundingNote: 아폰수 1세가 왕을 칭한 1139년을 시작으로 봄

