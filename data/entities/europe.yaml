    refs: ["몬테네그로 독립 국민 투표(2006)", "몬테네그로 독립 선언(2006)"]
    foundingNote: 독립을 선언한 2006년 6월 3일을 시작으로 봄

- id: kosovo-un
  level: region
  names: { ko: 코소보 (유엔 관리), en: Kosovo (UN administration), native: Kosova / Kosovo }
  from: 1999
  to: 2008
  color: "#b8706d"
  summary: 알바니아계가 대부분인 세르비아의 자치주. 1998~1999년 코소보 전쟁과 나토 공습 뒤 1999년 6월 유엔 안보리 결의 1244호에 따라 유엔 코소보 임시 행정단(UNMIK)과 나토 주도의 코소보 평화 유지군(KFOR)이 다스림. 법적으로는 유고슬라비아 연방 공화국(뒤에 세르비아) 땅으로 남음
  endNote: 유엔 특사 아티사리의 '국제 사회의 감독을 받는 독립'안(2007)이 합의되지 못한 채, 2008년 2월 17일 코소보 의회가 세르비아로부터의 독립을 선언함
  features:
    - 유엔 안보리 결의 1244호에 따라 유엔 코소보 임시 행정단(UNMIK)과 나토 주도 평화 유지군(KFOR)이 다스림
    - 법적으로는 유고슬라비아 연방 공화국(뒤에 세르비아) 땅으로 남음
    - 전쟁 뒤 세르비아계와 로마(롬인) 주민 다수가 알바니아계의 살해·납치와 보복을 피해 떠남
  startEvents: [kosovo-war-1998]
  endEvents: [kosovo-independence-2008]
  basis:
    type: primary_source
    refs: ["유엔 안전 보장 이사회 결의 1244호(1999)", "쿠마노보 군사 기술 협정(1999)"]
    foundingNote: 나토 공습 뒤 유고슬라비아 연방 공화국이 군대를 빼기로 한 1999년 6월부터

- id: kosovo-disputed
  level: region
  names: { ko: 코소보 (귀속 논쟁), en: Kosovo (disputed), native: Kosova / Kosovo }
  from: 2008
  to: null
  color: "#b8706d"
  summary: 2008년 2월 코소보 의회가 독립을 선언함(코소보 공화국). 미국과 대부분의 유럽 연합 나라 등 유엔 회원국 약 절반이 승인했으나(한국은 2008년 3월 승인) 세르비아·러시아·중국 등은 인정하지 않음. 국제 사법 재판소는 2010년 독립 선언이 국제법을 어기지 않았다는 권고 의견을 냄(지도는 세르비아와 코소보 공화국의 귀속 논쟁 지역으로 표시)
  features:
    - 미국과 대부분의 유럽 연합 나라 등 유엔 회원국 약 절반이 승인함(한국은 2008년 3월 승인)
    - 세르비아·러시아·중국과 유럽 연합 회원국 가운데 에스파냐·그리스 등은 인정하지 않음
    - 국제 사법 재판소는 2010년 독립 선언이 국제법을 어기지 않았다는 권고 의견을 냄
  startEvents: [kosovo-independence-2008]
  basis:
    type: primary_source
    refs: ["코소보 독립 선언(2008)", "국제 사법 재판소 권고 의견(2010)", "브뤼셀 협정(2013)"]
    foundingNote: 코소보 의회가 세르비아로부터의 독립을 선언한 2008년부터

- id: kosovo
  level: polity
  names: { ko: 코소보 공화국, en: Republic of Kosovo, native: Republika e Kosovës / Република Косово }
  from: 2008
  to: null
  color: "#6f8fc9"
  summary: 2008년 2월 17일 코소보 의회가 독립을 선언해 세운 나라. 유엔 회원국 약 절반이 승인했으나 세르비아는 자기 나라의 자치주로 봄
  mapNote: 지도에서는 땅을 '코소보 (귀속 논쟁)' 지역 항목으로 그리고 세르비아와 이 나라를 귀속 후보로 둠(이 항목에는 따로 영토가 없음). 영토는 귀속 논쟁 지역 항목
  features:
    - 유엔 회원국의 절반 안팎이 승인했으나 승인을 철회했다는 나라도 있어 그 수부터 다투어짐
    - 세르비아는 자기 나라의 자치주로 보며, 러시아·중국도 승인하지 않음
    - 2010년 7월 22일 국제 사법 재판소가 독립 선언이 일반 국제법이나 안보리 결의 1244호를 어기지 않았다는 권고적 의견을 냄
    - 유엔에 가입하지 못했고, 세르비아계가 많이 사는 북부에서는 세르비아의 영향력이 이어짐
  startEvents: [kosovo-independence-2008]
  basis:
    type: primary_source
    refs: ["코소보 독립 선언(2008)", "코소보 공화국 헌법(2008)", "국제 사법 재판소 권고 의견(2010)"]
    # 작업 메모: (kosovo-disputed)
    foundingNote: 독립을 선언한 2008년 2월 17일을 시작으로 봄

# 체코·슬로바키아
- id: czechia
  level: polity
  names: { ko: 체코, en: Czech Republic, native: Česko }
  from: 1993
  to: null
  color: "#8fa6d1"
  summary: 1993년 1월 1일 체코슬로바키아가 평화롭게 나뉘며(벨벳 이혼) 세운 나라(체코 공화국). 1999년 북대서양 조약 기구(NATO), 2004년 유럽 연합에 가입함
  features:
