- id: france
  level: polity
  names: { ko: 프랑스, en: France, native: France }
  from: 987
  to: null
  color: "#6d7fb8"
  summary: 1866년 천주교 박해(병인박해)를 구실로 강화도를 침공함(병인양요). 지도에는 1453년 이후 영토만 표시하며(백년 전쟁 끝에 칼레 밖의 기옌(1453), 프로방스(1481), 아라스 조약(1482)으로 부르고뉴 공작령·피카르디(아르투아·프랑슈콩테는 1493년 상리스 조약으로 돌려줌), 이탈리아 전쟁 중 나폴리 북부(1501~1503)·밀라노(1504 리옹·블루아 조약~1525)를 얻음. 브르타뉴(1532 합병)·메스·툴·베르됭(1552)·칼레(1558, 파드칼레도째라 그림에는 안 보임)를 얻음. 1536~1559년 사부아·브레스·피에몬테를 점령했으나 1544년 크레피 화약으로 돌려주기로 해 그리지 않음. 리옹 조약(1601)으로 브레스, 베스트팔렌 조약(1648)으로 오버엘자스, 피레네 조약(1659)으로 루시용·아르투아, 네이메헌 조약(1678)으로 프랑슈콩테를 얻고 1681년 스트라스부르를 합쳤으며 1684~1697년에는 룩셈부르크를 가짐. 1766년 로렌 공국, 1768년 코르시카를 합침), 왕국(~1792)·제1공화국(1792~1804)·제1제국(1804~1814)·복고 왕정(1814~1830)·7월 왕정(1830~1848) 등 정체가 바뀌어도 한 항목으로 둠. 혁명 전쟁과 나폴레옹 전쟁으로 벨기에·라인강 왼쪽·피에몬테·네덜란드·북해 연안·로마·일리리아를 합쳐 1810~1812년 가장 넓었다가 1814년 1차 파리 조약으로 1792년 국경으로 돌아감. 1919년 베르사유 조약으로 알자스-로렌을 되찾음. 2차 대전 중 1940년 6월 독일에 항복해 북부와 대서양 해안은 독일 점령 지구가 되고 남부는 페탱의 비시 정부가 다스렸으며(1942년 11월 남부도 점령) 1944년 해방됨. 1947년 파리 강화 조약으로 탕드·라브리그를 얻음. 6·25 전쟁 때 유엔군으로 참전함
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "캄포포르미오 조약(1797)", "뤼네빌 조약(1801)", "파리 조약(1814)", "베르사유 조약(1919)", "콩피에뉴 휴전 협정(1940)", "파리 강화 조약(1947)"]
    foundingNote: 카페 왕조가 시작된 987년을 프랑스 왕국의 시작으로 봄

- id: uk
  level: polity
  names: { ko: 영국, en: United Kingdom, native: United Kingdom of Great Britain and Ireland }
  from: 1707
  to: null
  color: "#7a6fa8"
  summary: 러시아의 남하를 막는다며 거문도를 불법 점령하고(1885~1887), 영일 동맹(1902·1905)으로 일본의 한국 지배를 인정함. 지도에는 1707년 이후 유럽 안의 영토만 표시하고(1700~1706년은 잉글랜드·스코틀랜드 항목, 지브롤터, 1800~1964년 몰타, 1915~1960년 키프로스와 1960년부터의 키프로스 주권 기지 지역 같은 유럽의 식민지 포함), 1801년 1월 연합법으로 아일랜드 왕국을 합치기 전은 그레이트브리튼 왕국의 영토. 6·25 전쟁 때 유엔군으로 참전함. 유럽의 식민지 가운데 키프로스(1960)·몰타(1964)가 독립함(지브롤터와 키프로스의 영국 주권 기지 지역은 지금도 영국령)
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "연합법(1800)"]
    foundingNote: 잉글랜드와 스코틀랜드가 합친 1707년(그레이트브리튼 왕국)을 시작으로 봄. 1801년 아일랜드를 합쳐 연합 왕국이 되고 1922년 아일랜드 자유국이 떨어져 나감

- id: russia
  level: polity
  names: { ko: 러시아 제국, en: Russian Empire, native: Российская империя }
  from: 1721
  to: 1917
  color: "#6f8f6f"
  summary: 폴란드 분할(1772·1793·1795)로 리투아니아·벨라루스·우크라이나 우안·쿠를란트를, 야시 조약(1792)으로 흑해 북쪽 기슭을 얻고 1801~1813년 캅카스 남쪽, 1809년 핀란드, 1812년 베사라비아를 차지함. 빈 회의(1815)로 폴란드 왕국을 얻고 크림 전쟁(1853~1856)에 졌으나 러시아-튀르크 전쟁(1877~1878)으로 발칸에 세력을 넓힘. 아이훈 조약(1858)으로 흑룡강 왼쪽을, 베이징 조약(1860)으로 연해주를 차지해 조선과 국경을 맞댐. 카자흐 초원(중주즈 1822·소주즈 1824·대주즈 1847~1854)과 중앙아시아(타슈켄트 1865, 부하라 1868·히바 1873 보호국, 코칸트 1876 병합, 투르크멘 1881~1885, 파미르 1895)를 차지하고 1875년 상트페테르부르크 조약으로 사할린 전체를 얻었으며(1905년 남부를 일본에), 1914년 우랑하이(투바)를 보호령으로 삼음(지도의 시베리아·중앙아시아는 단계별 대략적인 추정). 삼국 간섭과 아관파천으로 한반도에 영향력을 넓혔으나 러일 전쟁(1904~1905)에서 짐. 표트르 1세가 황제를 칭한 1721년에 러시아 차르국에서 이름이 바뀜. 뉘스타드 조약(1721)으로 발트해 연안을, 오보 조약(1743)으로 핀란드 동남부를, 퀴췩카이나르자 조약(1774)으로 흑해 북쪽 기슭 일부와 카바르다를 얻고 1783년 크림 칸국을 병합함. 북캅카스 산지는 오세티야(1774)·인구시(1810)의 서약을 거쳐 캅카스 전쟁(1817~1864) 끝에 1859년 샤밀이 항복하며 체첸까지 차지함. 지도에는 1721년 이후 영토만 대략 표시(그전은 러시아 차르국 항목). 두만강 하구 북쪽 하산 지역은 1860년 베이징 조약 경계를 따름. 조선 땅이던 녹둔도도 이때 러시아 쪽에 들어가 조선이 반환을 요구함
  basis:
    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "야시 조약(1792)", "3차 폴란드 분할 조약(1795)", "프레드릭스함 조약(1809)", "부쿠레슈티 조약(1812)", "빈 회의 최종 의정서(1815)", "파리 조약(1856)", "베를린 조약(1878)"]

- id: soviet-union
  level: polity
  names: { ko: 소련, en: Soviet Union }
  from: 1917
  to: 1991
  color: "#7c8c63"
  summary: 러시아 혁명(1917)으로 세워진 사회주의 국가(1922년 소비에트 사회주의 공화국 연방 결성). 1937년 연해주의 한인을 중앙아시아로 강제 이주시킴. 1939년 독소 불가침 조약으로 폴란드 동부를, 1940년 핀란드 동남부·발트 3국·베사라비아·북부코비나를 차지함. 1941년 독일의 침공(독소 전쟁)으로 서부를 점령당했으나 스탈린그라드 전투(1942~1943) 뒤 반격해 1944년 되찾고 1945년 베를린을 점령함. 지도의 1918~1921년 내전기에는 우크라이나·캅카스의 나라들도 소련에 넣고, 1941~1944년 독일 점령지는 따로 표시함. 1945년 8월 대일 참전으로 한반도 북부에 진주함. 2차 대전 뒤 동유럽에 공산 정권을 세워 미국과 냉전을 벌였고(1955년 바르샤바 조약 기구) 1990년 한국과 수교함. 1991년 9월 발트 3국의 독립을 인정하고 12월 해체됨(지도는 1991년까지 소련으로 그리고 발트 3국만 1991년부터 따로 표시)
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『한국독립운동사』", "리가 조약(1921)", "독소 불가침 조약(1939)", "포츠담 협정(1945)", "파리 강화 조약(1947)", "알마아타 의정서(1991)"]
    foundingNote: 1917년 10월 혁명부터 1922년 연방 결성 이전까지의 소비에트 러시아를 포함

- id: russia-fed
  level: polity
  names: { ko: 러시아 연방, en: Russian Federation }
  from: 1991
  to: null
  color: "#6f8f6f"
  summary: 소련이 해체된 뒤(1991) 그 지위를 이어받은 나라. 북핵 문제를 다룬 6자 회담에 참여함. 체첸 분리 세력과 두 차례 전쟁(1994~1996, 1999~2009)을 벌임. 2008년 조지아와의 전쟁 뒤 압하지야·남오세티야의 독립을 승인하고 군대를 둠. 2014년 크림 병합을 선언했고(국제적으로 인정받지 못함) 2022년 우크라이나를 전면 침공해 4개 주의 병합을 선언함(지도는 크림과 점령 지역을 귀속 논쟁 지역으로, 트란스니스트리아·압하지야·남오세티야를 러시아 연방의 점령지로 따로 표시)
  basis:
    type: national_institution
    refs: ["국사편찬위원회 『한국사』", "알마아타 의정서(1991)", "유엔 총회 결의 68/262(2014)", "유엔 총회 결의 ES-11/4(2022)"]

