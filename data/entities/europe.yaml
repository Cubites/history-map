    foundingNote: 부르군트 왕국이 신성 로마 제국에 들어간 1033년을 시작으로 봄(그전은 부르군트 왕국 안의 백령)

- id: burgundy-kingdom
  level: polity
  names: { ko: 부르군트 왕국 (아를 왕국), en: Kingdom of Burgundy (Arles), native: Regnum Burgundiae }
  from: 888
  to: 1033
  color: "#f0d0e0"
  summary: 웰프 가문의 루돌프 1세(888)가 세운 상(上)부르군트 왕국이 933년 하(下)부르군트(프로방스)와 합쳐진 왕국(론강·손강 유역·쥐라·알프스 서부). 마지막 왕 루돌프 3세가 1032년 9월 죽은 뒤 1033년 2월 황제 콘라트 2세가 파이에른에서 부르군트 왕으로 대관해 신성 로마 제국의 세 왕국 가운데 하나가 됨
  mapNote: 지도에는 888~1032년 표시하고(888 상부르군트, 933 프로방스 왕국을 합침) 1000년부터는 프랑슈콩테·리옹·사보이아·도피네·프로방스·브레스와 스위스 서부(제네바·보·발레·뇌샤텔·프리부르·베른·졸로투른·쥐라)·아오스타를 그림
  endNote: 1032년 9월 마지막 왕 루돌프 3세가 죽은 뒤 1033년 2월 황제 콘라트 2세가 파이에른에서 부르군트 왕으로 대관해 신성 로마 제국의 세 왕국 가운데 하나가 됨. 그 뒤 실제 정치는 프로방스 백국·도피네·사보이아 같은 지방 단위로 돌아감
  features:
    - 루돌프 3세(재위 993~1032)는 힘이 약해 지방 영주들을 누르지 못함
    - 사보이아의 움베르토 1세, 비엔누아(도피네)의 귀그 1세, 프로방스의 보소 가문이 땅을 모으거나 후작령을 다스림
    - 자식이 없던 루돌프 3세가 조카인 독일 왕 하인리히 2세를 후계자로 삼음(1006년 바젤 회견)
  startEvents: [middle-francia-meerssen-855]
  endEvents: [arles-burgundy-1003]
  basis:
    type: primary_source
    refs: ["비포, 『콘라트 2세 행적』", "라울 글라베르, 『역사』"]
    # 작업 메모: (작업 M4) / (M-②(다)) / 앞 시기는 / 작업 M5에서 넓힘 / 작업 M5에서 888년부터로 넓힘(888 상부르군트, 933 프로방스 왕국을 합침)
    foundingNote: 루돌프 1세가 왕이 된 888년을 시작으로 봄

- id: normandy-duchy
  level: polity
  names: { ko: 노르망디 공국, en: Duchy of Normandy, native: Duché de Normandie }
  from: 911
  to: 1154
  color: "#b85050"
  summary: 바이킹 롤로가 911년 생클레르쉬레프트 조약으로 받은 땅에서 일어난 공국. 윌리엄(기욤 2세)이 1066년 잉글랜드를 정복해 왕이 된 뒤 잉글랜드 왕의 땅이 되었다가, 1087~1106년 맏아들 로베르 쿠르퇴즈, 1144~1153년 앙주 백작 조프루아와 아들 헨리가 공작으로 따로 다스림. 1154년 헨리 2세가 잉글랜드 왕이 되어 앙주 제국에 들어감(1204 필리프 2세의 정복)
  mapNote: 롤로가 땅을 받은 911년을 시작으로 봄. 1066~1086·1106~1143·1154년부터는 잉글랜드 왕의 땅이라 잉글랜드 색이라 그 사이 영토 없음. 지도에는 911~1065년(멘은 1063~), 1087~1105년, 1144~1153년 표시(911 루앙, 924 베생·이에무아, 933 코탕탱·아브랑섕)
  endNote: 1154년 공작 헨리가 헨리 2세로 잉글랜드 왕이 되어 앙주 제국에 들어감. 뒤에 1204년 필리프 2세가 정복함
  features:
    - 924년 라울이 베생과 이에무아를, 933년 롤로의 아들 기욤 장검공이 코탕탱과 아브랑섕을 받음
    - 카페 왕 앙리 1세가 1047년 발레스뒤느에서 젊은 공작 윌리엄을 도와 반란을 눌렀으나 곧 사이가 틀어짐
    - 윌리엄(기욤 2세)이 1066년 잉글랜드를 정복해 왕이 된 뒤 노르망디는 잉글랜드 왕의 땅이 됨
    - 1087~1106년 맏아들 로베르 쿠르퇴즈가 공작으로 따로 다스림
    - 1144년 앙주의 조프루아가 노르망디를 차지해 공작이 되었고, 1150년 아들 헨리가 공작이 됨
  startEvents: [vikings-francia-845]
  endEvents: [anarchy-1135]
  basis:
    type: primary_source
    refs: ["생캉탱의 뒤동, 『노르망디 초대 공작들의 관습과 행적』", "오르데리쿠스 비탈리스, 『교회사』"]
    # 작업 메모: 작업 M4 / (M-②(가)) / 작업 M5에서 911년부터로 넓힘(911 루앙, 924 베생·이에무아, 933 코탕탱·아브랑섕) / 지도에는 1000~1065년(멘은 1063~), 1087~1105년, 1144~1153년 표시(M-②(나)의 '1066 전 노르망디', 작업 M4) / 지도에는 1000~1065년 표시 / 지도에는 911년부터 표시
    foundingNote: 바이킹 롤로가 생클레르쉬레프트 조약으로 땅을 받은 911년을 시작으로 봄

- id: anjou
  level: polity
  names: { ko: 앙주 백국, en: County of Anjou, native: Comté d'Anjou }
  from: 870
  to: 1154
  color: "#a0c060"
  summary: 루아르강 아래쪽 앙제를 중심으로 한 백국(풀크 네라·조프루아 마르텔). 1044년 투르(투렌), 1110년 혼인으로 멘을 얻었고, 조프루아 플랜태저넷(1129~1151)은 헨리 1세의 딸 마틸다와 혼인해 1144년 노르망디를 정복함. 아들 헨리가 1154년 잉글랜드 왕(헨리 2세)이 되어 앙주 제국의 중심이 됨
  mapNote: 지도에는 붉은 풀크 때인 930년부터 1153년까지 앙주(1044 투렌, 1110 멘)를 표시
  endNote: 1154년 조프루아의 아들 헨리가 잉글랜드 왕 헨리 2세가 되어 앙주 제국의 중심이 되었고, 앙주는 잉글랜드 왕의 땅이 됨
  features:
    - 929년 무렵 붉은 풀크가 백작이 됨
    - 1044년 투르(투렌), 1110년 혼인으로 멘을 얻음
    - 조프루아 플랜태저넷(1129~1151)이 헨리 1세의 딸 마틸다와 혼인해 1144년 노르망디를 정복함
    - 아들 헨리가 1151년 앙주 백작이 되었고 1152년 엘레오노르와 혼인해 아키텐 공작이 됨
  startEvents: [west-francia-principalities-843]
  endEvents: [anarchy-1135]
  basis:
    type: primary_source
    refs: ["『앙주 백작 행적』", "투르의 장, 『조프루아 공작사』"]
    # 작업 메모: (M-②(나), 작업 M4) / (M-②(가)) / 작업 M5에서 930년부터로 넓힘(붉은 풀크, 1만 km² 미만이라 930년 버전) / 1만 km² 미만이라 930년 버전
    foundingNote: 잉겔제르가 앙주 백작이 된 870년 무렵을 시작으로 봄

- id: aquitaine
  level: polity
  names: { ko: 아키텐 공국, en: Duchy of Aquitaine, native: Duché d'Aquitaine }
  from: 860
  to: 1154
  color: "#d09060"
  summary: 푸아티에 백작 가문(라무눌프 가문)이 공작을 칭한 프랑스 왕국 남서부의 큰 공국(푸아투·생통주·리무쟁·페리고르, 1063년부터 가스코뉴). 기욤 9세(트루바두르 시인)·기욤 10세를 거쳐 1137년 상속녀 엘레오노르가 루이 7세와 혼인해 프랑스 왕의 땅이 되었다가, 1152년 이혼하고 헨리와 재혼해 1154년 앙주 제국에 들어감
  mapNote: 라무눌프 1세(860년 무렵)를 시작으로 봄. 1137~1151년은 프랑스 왕 루이 7세의 땅이라 프랑스 색, 1154년부터 잉글랜드 왕의 땅이라 그 사이 영토 없음. 지도에는 888~1136년(888년부터 푸아티에의 라눌프 2세, 가스코뉴는 1063~)과 1152~1153년 표시
  endNote: 1152년 엘레오노르가 루이 7세와 이혼하고 헨리와 재혼했고, 1154년 앙주 제국에 들어감
  features:
    - 라눌프 2세가 888년 아키텐 왕을 칭했고 경건공 기욤(893~918)이 공작이 됨
    - 1063년 아키텐 공작 기조프루아(기욤 8세)가 가스코뉴 공국을 합침
    - 기욤 9세(트루바두르 시인)·기욤 10세를 거쳐 1137년 상속녀 엘레오노르가 루이 7세와 혼인해 프랑스 왕의 땅이 됨
  startEvents: [west-francia-principalities-843]
  endEvents: [capetian-france-1031]
  basis:
    type: primary_source
    refs: ["샤반의 아데마르, 『연대기』", "생메상 연대기"]
    # 작업 메모: (M-②(나), 작업 M4) / (M-②(가)) / 작업 M5에서 888년부터로 넓힘(푸아티에의 라눌프 2세, 정할 점 M5-①) / 지도에는 1000~1136년 표시 / 지도에는 888년부터 표시
    foundingNote: 라무눌프 1세(860년 무렵)를 시작으로 봄

- id: irish-kingdoms
  level: polity
  names: { ko: 아일랜드 왕국들 (묶음), en: Irish kingdoms (grouped), native: Ríochtaí na hÉireann }
  from: 98
  to: 1171
  color: "#d0b060"
  summary: 노르만이 오기 전 아일랜드의 게일 왕국들(대왕 브리안 보루(1002~1014)·오코너의 코노트·맥로클린의 아일레흐·맥머로의 렌스터·오브라이언의 먼스터)과 더블린·워터퍼드·웩스퍼드·리머릭의 노르드-게일 도시 왕국들을 묶은 항목. 1169년 렌스터 왕 더모트 맥머로가 부른 노르만 기사들이 상륙했고 1171년 헨리 2세가 와서 영주권을 세움
  mapNote: 여러 왕국을 묶어 그림. 지도에는 98~1170년 표시(98년부터 타키투스 『아그리콜라』 24의 아일랜드 소왕, 284년부터 프톨레마이오스가 적은 부족과 5세기 왕국들, 1000~1170년 섬 전체)하고 1171년부터 아일랜드 영주령과 게일 영주들(묶음)
  endNote: 1169년 렌스터 왕 더모트 맥머로가 부른 노르만 기사들이 상륙했고, 1171년 헨리 2세가 와서 아일랜드 왕과 영주 대부분의 신종을 받아 영주권을 세움
  features:
    - 브리안 보루가 1002~1014년 아일랜드 대왕으로 있었음
    - 1166년 렌스터 왕 더모트 맥머로가 대왕 루아이드리 우아 콘호바이르 등에게 쫓겨나 잉글랜드 왕 헨리 2세에게 도움을 청함
  startEvents: [tacitus-germania-98]
  endEvents: [ireland-normans-1166]
  basis:
    type: primary_source
    refs: ["『얼스터 연대기』", "『이니스팰런 연대기』"]
    # 작업 메모: (정할 점 M-③) / (작업 M4) / 앞 시기는 / 작업 M5에서 넓힘 / 작업 M5에서 800년부터로 넓힘 / 작업 M6에서 476년부터로 넓히고 시작 해를 476으로 앞당김 / 작업 AN1에서 284년부터로 넓히고 시작 해를 284로 앞당김(프톨레마이오스가 적은 부족과 5세기 왕국들, AN-⑧) / 작업 AN2에서 98년부터로 넓히고 시작 해를 98(타키투스 『아그리콜라』 24의 아일랜드 소왕)로 앞당김(정할 점 AN2-⑥) / 묶음 항목
    foundingNote: 타키투스의 『아그리콜라』가 아일랜드의 '소왕'을 적은 98년을 시작으로 봄

- id: sweden-early
  level: polity
  names: { ko: 스웨덴 왕국 (초기), en: Kingdom of Sweden (early), native: Sverige }
  from: 829
  to: 1164
  color: "#6f96c4"
  summary: 스베아인과 예트인을 함께 다스린 초기 스웨덴 왕국(올로프 쇠트코눙(995년 무렵~1022)·아눈드 야코브·스텐킬 가문·스베르케르 가문·에리크 가문). 왕위가 두 가문 사이를 오갔고, 1164년 웁살라 대주교구가 세워져 교회 조직이 갖춰짐
  mapNote: 지도에는 829~1163년 표시(스베알란드·고틀란드는 829년부터, 예탈란드·노를란드 남부는 970년부터)하고 1164년부터 스웨덴 왕국(중세)(이름만 바뀌어 이어짐, 같은 색). 고틀란드(자치 농민 공화국)는 근사
  endNote: 1164년 웁살라에 대주교구가 세워져 교회가 독립했고, 나라는 스웨덴 왕국(중세)으로 이어짐
  features:
    - 839년 『생베르탱 연대기』는 동로마 사절과 함께 온 '로스' 사람들이 스웨덴 사람임을 적음
    - 970년 무렵 승리왕 에리크가 예탈란드까지 다스렸고 아들 올로프 쇠트코눙(995년 무렵~1022)이 이음
    - 스베르케르 가문과 에리크 가문이 번갈아 왕위를 차지함
  startEvents: [scandinavia-denmark-sweden-804]
  endEvents: [scandinavia-1130]
  basis:
    type: primary_source
    refs: ["브레멘의 아담, 『함부르크 대주교 행적』", "『베스트예타 법』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M4 / 작업 M5에서 829년부터로 넓힘(시작 해를 『안스가르 전기』의 비르카 비에른 왕(829)으로 앞당기고 스베알란드·고틀란드를 829년부터, 예탈란드·노를란드 남부를 970년부터 그림, 정할 점 M5-③, 독립 검토 반영) / 지도에는 1000~1163년
    foundingNote: 『안스가르 전기』의 비르카 비에른 왕(829)을 시작으로 봄(에리크 승리왕은 970년 무렵)

- id: bohemia-duchy
  level: polity
  names: { ko: 보헤미아 공국, en: Duchy of Bohemia, native: České knížectví }
  from: 870
  to: 1198
  color: "#9b7cb6"
  summary: 프르제미슬 가문의 공국(볼레슬라프 2세·오들드르지흐·브제티슬라프 1세). 1029년 무렵 모라비아를 되찾고 1039년 폴란드를 쳐 슐레지엔을 1054년까지 가짐. 브라티슬라프 2세(1085)와 블라디슬라프 2세(1158)가 개인으로 왕 칭호를 받았고, 1198년 오타카르 1세가 세습 왕국을 얻음(1212 시칠리아 금인 칙서)
  mapNote: 보르지보이 1세(870년 무렵)를 시작으로 봄. 신성 로마 제국의 제후국이지만 따로. 1003~1004년 폴란드 볼레스와프 1세의 프라하 점령은 그리지 않음. 지도에는 870~1197년 표시(955~989년 슐레지엔, 955~998년 모라비아·크라쿠프)하고 1198년부터 보헤미아 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1198년 오타카르 1세가 슈바벤의 필리프 편에 서서 왕의 칭호를 받아 보헤미아 왕국으로 이어졌고, 1212년 황제 프리드리히 2세의 시칠리아 금인칙서로 이 칭호가 세습으로 굳어짐
  features:
    - 보르지보이 1세가 875~880년 무렵 프라하 성으로 근거를 옮겼고 대모라비아의 스바토플루크의 신하였음
    - 바츨라프(재위 921~935 무렵)는 동생 볼레슬라프 1세에게 살해된 뒤 곧 성인으로 기려져 체코의 수호성인이 됨
    - 973년 프라하에 주교구가 서 신성 로마 제국의 마인츠 대주교구에 속함
    - 1029년 무렵 모라비아를 되찾고 1039년 폴란드를 쳐 슐레지엔을 1054년까지 가짐
    - 브라티슬라프 2세가 1085년, 블라디슬라프 2세가 1158년 황제에게서 본인 한 대의 왕 칭호를 받음
  startEvents: [bohemia-premyslids-870]
  endEvents: [bohemia-kingdom-1085]
  basis:
    type: primary_source
    refs: ["프라하의 코스마스, 『보헤미아 연대기』"]
    # 작업 메모: 정할 점 M-⑧, 작업 M4 / (M-②(다)) / 작업 M5에서 870년부터로 넓힘(955~989년 슐레지엔, 955~998년 모라비아·크라쿠프, 정할 점 M5-⑫) / 지도에는 1000~1197년 표시 / 지도에는 870년부터 표시
    foundingNote: 보르지보이 1세(870년 무렵)를 시작으로 봄

- id: piast-poland
  level: polity
  names: { ko: 폴란드 (피아스트 공국·왕국), en: Piast Poland, native: Polska }
  from: 960
  to: 1138
  color: "#d98c8c"
  summary: 미에슈코 1세(960년 무렵~992)가 세운 피아스트 왕조의 나라. 볼레스와프 1세 용감공이 1000년 그니에즈노 회의를 열고 1025년 왕관을 썼으며, 1030년대 위기(이교 반동·보헤미아의 침입) 뒤 카지미에시 1세가 되살림. 볼레스와프 2세(1076 대관)와 볼레스와프 3세 비뚤입을 거쳐 1138년 그의 유언으로 아들들이 나눠 가져 공국들로 갈라짐
  mapNote: 지도에는 966~1137년 표시(공국·왕국을 한 나라로, 990 슐레지엔·포메렐리아, 999 크라쿠프·모라비아)하고 1138년부터 폴란드 공국들(묶음). 1025년부터의 폴란드 왕국은 1320년 재통일부터 그리므로 같은 색을 씀
  endNote: 1138년 볼레스와프 3세 비뚤입이 죽으면서 나라를 아들들에게 나누는 유언을 남겨 폴란드가 공국들로 갈라짐
  features:
    - 미에슈코 1세가 965년 보헤미아 공의 딸 도브라바와 혼인했고 966년 세례를 받음
    - 991년 무렵 '다고메 이우덱스' 문서로 자기 나라를 성 베드로(교황)에게 바쳐 보호를 청함
    - 볼레스와프 1세 용감공이 1000년 그니에즈노 회의를 열고 1025년 왕관을 씀
    - 1030년대 위기 뒤 카지미에시 1세가 되살렸고 볼레스와프 2세가 1076년 대관함
    - 볼레스와프 3세가 1116~1119년 포메렐리아, 1121년 슈체친을 차지하고 포메른 공 바르티스와프 1세를 신하로 삼음
  startEvents: [piast-mieszko-960]
  endEvents: [boleslaw-iii-1102]
  basis:
    type: primary_source
    refs: ["메르제부르크의 티트마르, 『연대기』", "갈루스 아노니무스, 『폴란드 군주 행적』"]
    # 작업 메모: 작업 M4 / (poland-kingdom) / 작업 M5에서 966년부터로 넓힘(990 슐레지엔·포메렐리아, 999 크라쿠프·모라비아) / 1037~1047년 마조프셰의 미에츠와프는 정할 점 M4-⑥ / 지도에는 1000~1137년 표시 / 지도에는 966년부터 표시 / 한 항목
    foundingNote: 미에슈코 1세(960년 무렵)를 시작으로 봄

- id: slavic-tribes
  level: polity
  names: { ko: 서슬라브 부족 (묶음), en: West Slavic tribes (grouped), native: Wenden }
  from: 527
  to: 1181
  color: "#b0d0e8"
  summary: 엘베강 동쪽의 폴라브 슬라브(오보드리트·류티치 연맹·헤벨리·라니)와 포메른 사람들(그 뒤 포메른 공국)을 묶은 항목. 983년 대봉기로 제국의 북쪽 변경령을 몰아냈으나, 1147년 벤드 십자군 뒤 1157 브란덴부르크(알브레히트 곰공)·1160 메클렌부르크(사자공 하인리히)·1168 뤼겐(덴마크)이 정복되고, 포메른 공국은 1121~1138년 폴란드의 종주를 거쳐 1181년 제국 공국이 됨
  mapNote: 여러 부족을 묶어 나타냄. 지도에는 527~1180년 표시(527 폴란드, 568 엘베강 동쪽·보헤미아·모라비아·슬로바키아·포모제, 623~658 사모 왕국, 800년부터 엘베강 동쪽·보헤미아(870)·모라비아와 니트라(833)·폴란드(966·990·999), 1000~1180년 메클렌부르크(1159년까지)·브란덴부르크(1156년까지)·포메른(1180년까지)과 1039~1115년 포메렐리아)
  endNote: 1157년 브란덴부르크(알브레히트 곰공), 1160년 메클렌부르크(사자공 하인리히), 1168년 뤼겐(덴마크)이 정복됨. 1181년 포메른 공이 제국 공작이 되어 제국 공국으로 이어짐
  features:
    - 983년 대봉기로 제국의 북쪽 변경령을 몰아냄
    - 포메른 공국은 1121~1138년 폴란드의 종주를 받음
    - 슬라브 해적도 덴마크와 작센 해안을 약탈함
    - 1147년 벤드 십자군이 오보드리트의 도빈과 포메른의 데민을 포위했으나 슬라브인은 이름뿐인 세례를 받고 십자군은 큰 성과 없이 물러남
  startEvents: [slavs-sclaveni-527]
  endEvents: [wendish-crusade-1147]
  basis:
    type: primary_source
    refs: ["보사우의 헬몰트, 『슬라브 연대기』", "브레멘의 아담, 『함부르크 대주교 행적』"]
    # 작업 메모: (정할 점 M-③) / (작업 M4) / 앞 시기와 동슬라브 쪽은 / 작업 M5에서 넓힘 / 작업 M5에서 800년부터로 넓히고 시작 해를 800으로 앞당김(엘베강 동쪽·보헤미아(870)·모라비아와 니트라(833)·폴란드(966·990·999)) / 작업 M6에서 527년부터로 넓히고 시작 해를 527로 앞당김(527 폴란드, 568 엘베강 동쪽·보헤미아·모라비아·슬로바키아·포모제, 623~658 사모 왕국, 정할 점 M6-⑬) / 묶음 항목
    foundingNote: 6세기 사료가 도나우강 북쪽에 '스클라베니'와 '안테스'가 나타났다고 적음

- id: kievan-rus
  level: polity
  names: { ko: 키예프 루스, en: Kievan Rus', native: Русь }
  from: 882
  to: 1132
  color: "#806040"
  summary: 올레그가 882년 키예프를 차지해 세운 루스(동슬라브) 나라. 블라디미르 1세(988 세례)·야로슬라프 현공(1019~1054)·블라디미르 모노마흐(1113~1125)·므스티슬라프 대공(1125~1132) 때 가장 강했고, 1132년 므스티슬라프가 죽은 뒤 여러 공국으로 갈라짐(키예프 대공 자리는 1240년까지 다툼)
  mapNote: 지도에는 882~1131년(부족 땅은 원초 연대기의 해부터, 스몰렌스크는 1126년, 랴잔은 1128년까지) 표시하고 1132년부터 루스 공국들(묶음)·스몰렌스크·랴잔·노브고로드(1136) 등
  endNote: 1132년 므스티슬라프 대공이 죽은 뒤 여러 공국으로 갈라져 루스 공국들로 이어짐. 키예프 대공 자리는 1240년까지 다툼이 이어짐
  features:
    - 스뱌토슬라프의 원정으로 하자르 칸국이 몰락했고(965~969), 불가리아 원정(968~971)을 벌임
    - 블라디미르 1세 때 980~992년 영토를 넓혔고 988년 세례를 받음
    - 1097년 류베치 회의에서 공들이 '각자 제 땅을 지킨다'고 합의했으나 다툼은 그치지 않음
    - 블라디미르 모노마흐가 쿠만을 거듭 원정으로 몰아냈고(1103·1111년 등) 1113년 키예프 시민의 부름으로 대공이 됨
    - 블라디미르 1세·야로슬라프 현공·블라디미르 모노마흐(1113~1125)·므스티슬라프 대공(1125~1132) 때 가장 강했음
  startEvents: [rus-formation-862]
  endEvents: [monomakh-kievan-fall-1113]
  basis:
    type: primary_source
    refs: ["『원초 연대기』(지난 세월 이야기)", "『루스카야 프라브다』"]
    # 작업 메모: (작업 M4) / (M-②(바)) / 작업 M5에서 882년부터로 넓힘(노브고로드의 루스의 renames, 부족마다 원초 연대기의 해) / 키예프를 1240년까지 따로 두는 안은 정할 점 M4-⑪ / 지도에는 1000~1131년
    foundingNote: 올레그의 키예프(882)를 시작으로 봄(노브고로드의 루스에서 이름만 바뀌어 이어짐). 1054 야로슬라프의 유언과 1097 류베치 회의의 분봉은 한 나라 안의 분봉

- id: pecheneg-tribes
  level: polity
  names: { ko: 페체네그 부족 (묶음), en: Pechenegs (grouped), native: Peçenek }
  from: 890
  to: 1091
  color: "#e8d0b0"
  summary: 9세기 말 볼가강 쪽에서 흑해 북쪽 초원으로 들어온 튀르크계 유목 부족 연합. 루스·비잔티움·헝가리와 싸우고 동맹했으며, 1036년 키예프에서 야로슬라프에게 크게 진 뒤 쿠만에 밀려 다뉴브강 쪽으로 옮겨 갔고, 1091년 레보우니온에서 알렉시오스 1세와 쿠만의 연합군에게 무너짐
  mapNote: 여러 부족을 묶어 초원을 채움. 1055년부터 드니프로강 동쪽, 1091년부터 서쪽은 쿠만 부족(묶음). 지도에는 895~1090년 표시(895 흑해 북쪽 초원, 965 돈강, 969 볼가강 하류, 1054년까지 흑해 북쪽 초원 전체, 1090년까지 드니프로강 서쪽(몰다비아·왈라키아·부자크)). 오구즈(토르크)는 근사
  endNote: 1091년 4월 29일 레보우니온에서 알렉시오스 1세와 쿠만 동맹군에게 거의 몰살당함
  features:
    - 루스·비잔티움·헝가리와 싸우기도 하고 동맹하기도 함
    - 1036년 키예프에서 야로슬라프에게 크게 진 뒤 쿠만에 밀려 다뉴브강 쪽으로 옮겨 감
    - 1087년부터 다뉴브강 북쪽에서 트라키아를 휩쓸었음
  startEvents: [magyars-838]
  endEvents: [alexios-komnenos-1081]
  basis:
    type: primary_source
    refs: ["콘스탄티노스 7세, 『제국 통치론』", "안나 콤니니, 『알렉시아스』"]
