  from: 1866
  to: 1870
  color: "#a8b48e"
  summary: 1866년 북독일 연방에 들지 않은 마인강 남쪽의 바이에른·뷔르템베르크·바덴·헤센 대공국 남부를 묶은 항목. 프로이센과 비밀 군사 동맹을 맺었고 프로이센-프랑스 전쟁 중 1871년 독일 제국에 합류함
  basis:
    type: primary_source
