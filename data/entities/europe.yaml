  basis:
    type: primary_source
    refs: ["마케도니아 독립 국민 투표(1991)", "유엔 안전 보장 이사회 결의 817호(1993)", "오흐리드 협정(2001)", "프레스파 협정(2018)"]
    foundingNote: 국민 투표를 한 1991년 9월 8일을 시작으로 봄. 영토는 1992년부터(1991년 지도는 유고슬라비아)

- id: north-macedonia
