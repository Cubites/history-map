  mapNote: 5년 넘게 따로 다스린 분리 제국이라 따로 그림. 지도에는 286~295년 브리타니아(하드리아누스 방벽까지)를 표시하고 293년까지의 불로뉴는 그리지 않음(근사)
  endNote: 293년 재무관 알렉투스가 카라우시우스를 죽이고 뒤를 이었고, 296년 콘스탄티우스와 아스클레피오도투스가 알렉투스를 쓰러뜨려 브리타니아가 로마에 돌아감
  features:
