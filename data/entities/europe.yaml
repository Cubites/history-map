# ── 작업 M4 (2026-10-07): 1000~1199년 조각 소유표의 새 항목 33개 ──

- id: cordoba-caliphate
  level: polity
  names: { ko: 후우마이야 칼리프국 (코르도바), en: Caliphate of Córdoba, native: خلافة قرطبة }
  from: 929
  to: 1031
  color: "#3f8f6f"
  summary: 압드 알라흐만 3세가 929년 칼리프를 칭한 알안달루스의 우마이야 왕조(수도 코르도바). 히샴 2세 아래 시종 알만수르(976~1002)가 기독교 왕국들을 거듭 쳤으나, 1009년부터 칼리프 자리를 둘러싼 내란(피트나)으로 나라가 갈라졌고 1031년 코르도바 사람들이 마지막 칼리프 히샴 3세를 내쫓아 끝남
  mapNote: 압드 알라흐만 3세가 칼리프를 칭한 929년을 시작으로 봄(그전 코르도바 아미르국에서 이름만 바뀌어 이어짐, 같은 색). 1009~1031년 내란 중에 생긴 타이파는 그리지 않고 1031년에 제1차 타이파(묶음)로 바꿈. 지도에는 929~1030년 표시하고 1000년부터는 이베리아의 무슬림 땅(두에로강 남쪽 변경·톨레도·사라고사·발렌시아·안달루시아·포르투갈 남부)을 그림
  endNote: 1031년 코르도바 사람들이 마지막 칼리프 히샴 3세를 내쫓아 끝남. 이베리아는 세비야의 아바드 가문 등 제1차 타이파로 갈라짐
  features:
    - 936년부터 코르도바 교외에 궁성 메디나 아자하라를 지음
    - 하캄 2세(재위 961~976) 때 학문이 꽃핌
    - 히샴 2세 아래 시종 알만수르(976~1002)가 기독교 왕국들을 거듭 침
    - 산추엘로가 1009년 쿠데타로 쓰러지면서 내란(피트나)이 시작됨
  startEvents: [caliphate-almanzor-880]
  endEvents: [caliphate-fall-1002]
  basis:
    type: primary_source
    refs: ["이븐 하이얀, 『무크타비스』", "이븐 이다리, 『바얀 알무그리브』"]
    # 작업 메모: (작업 M4, 정할 점 M-⑦) / 앞 시기는 / 작업 M5에서 넓힘(929년 전은 코르도바 아미르국, renames) / 작업 M5에서 929년부터로 넓힘(코르도바 아미르국의 renames, 같은 색)
    foundingNote: 압드 알라흐만 3세가 칼리프를 칭한 929년을 시작으로 봄

- id: taifas-first
  level: polity
  names: { ko: 제1차 타이파 (묶음), en: First Taifa kingdoms (grouped), native: ملوك الطوائف }
  from: 1031
  to: 1116
  color: "#9cc8e8"
  summary: 후우마이야 칼리프국이 무너진 뒤 알안달루스에 선 군소 왕국들(세비야의 아바드 가문·톨레도의 줄눈 가문·사라고사의 후드 가문·바다호스의 아프타스 가문·그라나다의 지리 가문·발렌시아·데니아·알메리아·알바라신 등)을 묶은 항목. 카스티야·레온에 공물(파리아스)을 바쳤고, 1085년 톨레도를 잃은 뒤 알모라비드를 불러들였다가 1090~1094년 대부분 병합됨. 사라고사는 1110년, 마요르카는 1115년까지 이어짐
  mapNote: 여러 타이파 왕국을 묶어 그림. 지도에는 1031~1115년 알모라비드·기독교 왕국에 들기 전의 땅을 표시
  endNote: 알모라비드가 1090년 그라나다와 말라가, 1091년 세비야·코르도바·알메리아·무르시아, 1094년 바다호스를 차례로 폐위해 대부분 병합함. 사라고사는 1110년, 마요르카는 1115년까지 이어짐
  features:
    - 카스티야·레온에 공물(파리아스)을 바쳤고 페르난도 1세는 사라고사·톨레도·세비야·바다호스의 타이파들에게 공물을 받음
    - 알폰소 6세가 1085년 5월 톨레도를 차지함
    - 유수프 이븐 타슈핀이 타이파 왕들의 부름으로 건너와 1086년 사그라하스에서 알폰소 6세를 물리침
  startEvents: [caliphate-fall-1002]
  endEvents: [almoravids-1086]
  basis:
    type: primary_source
    refs: ["압달라 이븐 불루긴, 『회고록』(그라나다 지리 왕조)", "이븐 바삼, 『다키라』"]
    # 작업 메모: (정할 점 M-⑦) / (작업 M4) / 엘 시드의 발렌시아(1094~1101)는 정할 점 M4-⑩
    foundingNote: 1031년 코르도바 사람들이 마지막 칼리프 히샴 3세를 내쫓음

- id: almoravids
  level: polity
  names: { ko: 알모라비드 왕조 (이베리아), en: Almoravid dynasty (Iberia), native: المرابطون }
  from: 1040
  to: 1155
  color: "#5f7fa0"
  summary: 사하라의 산하자 베르베르인 개혁 운동에서 일어나 마라케시를 세우고 마그레브를 다스린 왕조. 유수프 이븐 타슈핀이 타이파 왕들의 요청으로 건너와 1086년 살라카(사그라하스)에서 알폰소 6세를 이기고, 1090~1094년 타이파를 병합해 알안달루스를 다스림(발렌시아 1102·사라고사 1110). 1144~1145년의 반란(제2차 타이파)과 알모하드에게 1147년 마라케시를 잃어 무너졌고, 그라나다의 수비대는 1155년까지 버팀
  mapNote: 지도 범위 안의 이베리아 쪽만 지도에 표시, 1091~1154년. 1086~1090년 타이파 왕들의 종주는 그리지 않음, 발레아레스의 바누 가니야(1126~1203)는 1147년부터 제2차 타이파·1172년부터 알모하드로 근사
  endNote: 1144~1145년의 반란(제2차 타이파)과 알모하드에게 1147년 마라케시를 잃어 무너졌고, 그라나다의 수비대는 1155년까지 버팀
  features:
    - 유수프 이븐 타슈핀이 타이파 왕들의 요청으로 건너와 1086년 살라카(사그라하스)에서 알폰소 6세를 이김
    - 타이파 왕들의 무거운 세금을 비판하는 이슬람 법학자들의 지지를 얻어 1090~1094년 타이파를 병합하고 알안달루스를 다스림
    - 발렌시아는 1102년, 사라고사는 1110년에 얻음
  startEvents: [iberia-sancho-ferdinand-1035]
  endEvents: [almohads-1145]
  basis:
    type: primary_source
    refs: ["이븐 아비 자르, 『라우드 알키르타스』", "『알훌랄 알마우시야』"]
    # 작업 메모: (정할 점 M-⑦) / (작업 M4)
    foundingNote: 압달라 이븐 야신의 운동(1040년 무렵)을 시작으로 봄

- id: taifas-second
  level: polity
  names: { ko: 제2차 타이파 (묶음), en: Second Taifa kingdoms (grouped), native: ملوك الطوائف }
  from: 1145
  to: 1172
  color: "#b0e0c0"
  summary: 알모라비드의 지배가 흔들린 1144~1145년 알안달루스 곳곳에서 선 군소 정권을 묶은 항목(메르톨라의 이븐 카시, 코르도바의 이븐 함딘, 말라가, 발렌시아·무르시아의 이븐 마르다니시 '늑대왕' 등). 대부분 알모하드에 차례로 넘어갔고, 가장 오래 버틴 이븐 마르다니시의 무르시아·발렌시아도 1172년 그가 죽은 뒤 알모하드에 들어감
  mapNote: 여러 타이파 왕국을 묶어 그림. 지도에는 1145~1171년 알모하드·기독교 왕국에 들기 전의 땅을 표시. 발레아레스의 바누 가니야(알모라비드 잔존 세력, 1147~1171)는 함께 묶은 근사
  endNote: 가장 오래 버틴 이븐 마르다니시의 무르시아·발렌시아도 1172년 그가 죽은 뒤 알모하드에 들어감
  features:
    - 이븐 마르다니시는 '늑대왕'으로 불렸고 발렌시아·무르시아를 1147~1172년 다스림
    - 알모하드가 1147년 세비야를 시작으로 1157년 알메리아까지 차지해 군소 정권 대부분이 차례로 넘어감
    - 이븐 마르다니시는 카스티야·아라곤과 손잡고 버팀
  startEvents: [almoravids-1086, almohads-1145]
  endEvents: [almohads-1145]
  basis:
    type: primary_source
    refs: ["이븐 사히브 알살라, 『알만 빌이마마』", "이븐 할둔, 『이바르』"]
    # 작업 메모: (정할 점 M-⑦) / (작업 M4)
    foundingNote: 알모라비드의 지배가 흔들린 1144~1145년 알안달루스 곳곳에 군소 정권이 선 1145년을 시작으로 봄

- id: castile-county
  level: polity
  names: { ko: 카스티야 백국, en: County of Castile, native: Condado de Castilla }
  from: 931
  to: 1065
  color: "#d8b04c"
  summary: 레온 왕국의 동쪽 변경(부르고스)에서 페르난 곤살레스(931~970) 때부터 사실상 따로 움직인 백국. 1029년 가르시아 산체스가 살해된 뒤 나바라의 산초 3세 아래 아들 페르난도가 백작이 되었고, 페르난도 1세는 1037년 레온 왕위도 얻음. 1065년 그가 죽은 뒤 아들 산초 2세가 카스티야 왕이 됨
  mapNote: 페르난 곤살레스가 카스티야 백작을 칭한 931년 무렵을 시작으로 봄. 1037~1065년 레온과 한 왕 아래 있던 시기는 동군 연합처럼 따로. 지도에는 931~1064년 부르고스·칸타브리아·소리아(와 1200년 지도처럼 카나리아 제도·멜리야의 근사)를 표시하고 1065년부터 카스티야 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1065년 12월 페르난도 1세가 죽은 뒤 아들 산초 2세가 카스티야 왕이 됨
  features:
    - 939년 시망카스에서 페르난 곤살레스가 레온 왕 라미로 2세, 나바라 왕 가르시아 산체스 1세와 함께 후우마이야 칼리프국군을 꺾음
    - 1029년 가르시아 산체스가 살해된 뒤 나바라의 산초 3세 아래 아들 페르난도가 백작이 되었고 1035년 산초 3세가 죽자 카스티야를 받음
    - 페르난도 1세는 1037년 9월 타마론 전투에서 처남인 레온 왕 베르무도 3세를 죽이고 레온 왕까지 됨
    - 페르난도 1세는 1057~1064년 라메구·비제우·코임브라를 차지하고 타이파들에게 공물을 받음
  startEvents: [asturias-leon-800, navarre-castile-barcelona-824]
  endEvents: [iberia-sancho-ferdinand-1035]
  basis:
    type: primary_source
    refs: ["『나혜라 연대기』", "로드리고 히메네스 데 라다, 『스페인사』"]
    # 작업 메모: castile-early, 정할 점 M-⑧, 작업 M4 / (정할 점 M4-①) / 작업 M5에서 931년부터로 넓힘(정할 점 M5-⑧) / 지도에는 1000~
    foundingNote: 페르난 곤살레스가 카스티야 백작을 칭한 931년 무렵을 시작으로 봄

- id: aragon-early
  level: polity
  names: { ko: 아라곤 왕국 (연합 왕국 전), en: Kingdom of Aragon (before 1164), native: Reino de Aragón }
  from: 1035
  to: 1164
  color: "#c45a5a"
  summary: 나바라의 산초 3세가 죽은 1035년 아들 라미로 1세가 아라곤 백령을 이어 세운 왕국. 1076~1134년 나바라와 한 왕 아래 있었고, 알폰소 1세 전투왕(1104~1134)이 1118년 사라고사를 얻음. 1137년 페트로닐라와 바르셀로나 백작 라몬 베렝게르 4세의 약혼으로 카탈루냐와 합쳐 1164년 아들 알폰스 2세 때 아라곤 연합 왕국이 됨
  mapNote: 지도에는 1035~1163년(1137년부터 바르셀로나 백국 땅 포함) 표시하고 1164년부터 아라곤 연합 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1137년 페트로닐라와 바르셀로나 백작 라몬 베렝게르 4세의 약혼으로 카탈루냐와 합쳐 1164년 아들 알폰스 2세 때 아라곤 연합 왕국이 됨
  features:
    - 1063년 라미로 1세가 그라우스에서 죽자 아라곤은 산초 라미레스가 이음
    - 1076~1134년 나바라와 한 왕 아래 있었음
    - 알폰소 1세 전투왕(1104~1134)이 1118년 12월 십자군 지원병을 얻어 사라고사를 함락해 도읍으로 삼고 1119년 투델라도 차지함
    - 1134년 알폰소가 죽자 나바라는 가르시아 라미레스가 다시 일으켜 갈라섰고, 아라곤은 동생 수도사 라미로 2세(재위 1134~1137)가 이음
  startEvents: [iberia-sancho-ferdinand-1035]
  endEvents: [aragon-barcelona-1112]
  basis:
    type: primary_source
    refs: ["『산후안 데 라페냐 연대기』", "바르바스트로 약혼 문서(1137)"]
    # 작업 메모: 정할 점 M4-⑫ / aragon, 정할 점 M-⑧, 작업 M4
    foundingNote: 라미로 1세가 왕을 칭한 1035년을 시작으로 봄

- id: barcelona-county
  level: polity
  names: { ko: 바르셀로나 백국, en: County of Barcelona, native: Comtat de Barcelona }
  from: 878
  to: 1137
  color: "#e8d878"
  summary: 카롤루스 왕조의 히스파니아 변경에서 일어나 카탈루냐 백령들을 이끈 백국(라몬 보렐·라몬 베렝게르 1세(1068 『관습법(우사트예스)』)·라몬 베렝게르 3세(1112 프로방스)). 1137년 라몬 베렝게르 4세가 아라곤 상속녀 페트로닐라와 약혼해 아라곤의 '군주'가 되면서 아라곤과 한 나라로 합쳐짐
  mapNote: 지도에는 888~1136년 서프랑크의 큰 봉토로 표시하고 1000년부터는 바르셀로나·지로나·레리다(우르헬·팔랴르스)·루시용·안도라를 그림. 우르헬·팔랴르스·루시용 백령과 이슬람 쪽 레리다(1149)는 근사, 1137년부터 아라곤
  endNote: 1137년 라몬 베렝게르 4세가 아라곤 상속녀 페트로닐라와 약혼해 아라곤의 '군주'가 되면서 아라곤과 한 나라로 합쳐짐
  features:
    - 보렐 2세가 987~988년 위그 카페에게 새로 충성을 서약하지 않은 일이 카탈루냐 백령이 프랑크 왕관에서 떨어져 나간 일로 흔히 꼽힘
    - 라몬 보렐이 1010년 우르헬 백작 에르멩골과 한 파를 도와 코르도바를 약탈함
    - 라몬 베렝게르 3세는 1112년 프로방스의 상속녀 두스와 혼인하면서 프로방스 계승권을 얻음
  startEvents: [navarre-castile-barcelona-824]
  endEvents: [aragon-barcelona-1112]
  basis:
    type: primary_source
    refs: ["『리폴 연대기』(게스타 코미툼 바르키노넨시움)", "『우사트예스』"]
    # 작업 메모: (작업 M4) / (정할 점 M4-⑫) / 작업 M5에서 888년부터로 넓힘(서프랑크의 큰 봉토, 정할 점 M5-①)
    foundingNote: 기프레 1세(털보)가 바르셀로나 백작이 된 878년을 시작으로 봄

- id: portugal-county
  level: polity
  names: { ko: 포르투갈 백국, en: County of Portugal, native: Condado Portucalense }
  from: 1096
  to: 1139
  color: "#7da36b"
  summary: 레온의 알폰소 6세가 1096년 사위 부르고뉴의 엔히크에게 준 포르투갈·코임브라 백국. 엔히크가 죽은 뒤 테레자가 다스리다가 1128년 아들 아폰수 엔히케스가 상마메드 전투에서 어머니를 이기고 권력을 잡았고, 1139년 오리크 전투 뒤 왕을 칭함(1143 사모라 조약)
  mapNote: 지도에는 1096~1138년 표시하고 1139년부터 포르투갈 왕국(이름만 바뀌어 이어짐, 같은 색). 레온 왕의 봉신이었으나 외교·전쟁을 따로 한 큰 봉토라 따로 그림
  endNote: 1139년 오리크 전투 뒤 아폰수 엔히케스가 왕을 칭함. 레온·카스티야 왕 알폰소 7세는 이를 인정하지 않다가 1143년 사모라 조약에서 아폰수를 왕으로 대접하기로 함
  features:
    - 엔히크가 1112년 죽은 뒤 아내 테레자가 다스림
    - 1128년 6월 24일 아들 아폰수 엔히케스가 상마메드 전투에서 어머니와 갈리시아 귀족 세력을 꺾고 백작령을 쥠
  startEvents: [portugal-1139]
  endEvents: [portugal-1139]
  basis:
    type: primary_source
    refs: ["『고트족 연대기』(크로니콘 고토룸)", "사모라 조약(1143)"]
