# 공물을 바치거나 종주권을 인정한 나라도 따로 왕·대공·칸·정부를 두었으면 따로 그린다(정할 점 D4-③). 근거와 정할 점은 docs/EUROPE_DRAFT.md의 '작업 D 계획' 7.9
- id: hungary-kingdom
  level: polity
  names: { ko: 헝가리 왕국, en: Kingdom of Hungary, native: Magyar Királyság }
  from: 1000
  to: 1526
  color: "#5f93c0"
  summary: 크로아티아-슬라보니아·트란실바니아·버나트를 아우른 왕국. 마티아스 코르비누스(1458~1490)가 오스만에 맞서 야이체·스레브레니크 바나트를 되찾고(1463~1464), 보헤미아 왕위를 다퉈 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 얻었으며 1485년 빈을 차지함(강화 없이 1490년 그가 죽은 뒤 막시밀리안 1세가 되찾음). 야기에우워 가문의 블라디슬라프 2세·러요시 2세 때 오스만에 베오그라드(1521)를 잃고, 1526년 모하치 전투에서 왕이 죽어 페르디난트 1세와 서포여이 야노시가 왕위를 다툼
  mapNote: 이슈트반 1세가 대관한 1000년을 시작으로 봄. 1482~1490년 오스트리아 점령은 강화 없이 끝나 그리지 않음. 지도에는 1000~1525년만 표시(1200년부터 할리치나 1214~1220(스피시 조약의 칼만), 슈타이어마르크 1254~1260, 세베린 바나트 1235, 우소라·솔리 1254)하고 1526년부터는 합스부르크 군주국·동헝가리 왕국·오스만 제국 땅
  endNote: 1526년 모하치 전투에서 오스만에 지고 왕 러요시 2세가 죽음. 헝가리 귀족 다수는 서포여이 야노시를 왕으로 뽑았고 합스부르크 가문의 페르디난트 1세도 왕으로 뽑혀 왕위를 다툼
  features:
    - 라슬로 1세가 1091년 슬라보니아를 얻고 칼만이 1102년 크로아티아 왕으로 대관해 동군 연합을 이룸
    - 마티아스 코르비누스(1458~1490)가 오스만에 맞서 야이체·스레브레니크 바나트를 되찾음(1463~1464)
    - 마티아스가 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 얻음
    - 1485년 빈을 차지했으나 강화 없이 1490년 그가 죽은 뒤 막시밀리안 1세가 되찾음
    - 야기에우워 가문의 블라디슬라프 2세·러요시 2세 때 오스만에 베오그라드(1521)를 잃음
  startEvents: [stephen-hungary-1000]
  endEvents: [mohacs-1526]
  basis:
