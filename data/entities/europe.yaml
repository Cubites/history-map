    - 1580~1640년 포르투갈 왕을 겸함
    - 뮌스터 조약(1648)으로 네덜란드 공화국의 독립을 인정하고, 위트레흐트·라슈타트 조약(1713~1714)으로 밀라노·나폴리 등을 내놓음
    - 1810~1820년대 아메리카 식민지 대부분이 독립하고 1898년 미국-에스파냐 전쟁으로 쿠바·필리핀 등을 잃음
    - 1936~1939년 내전 끝에 프랑코의 독재가 세워졌다가 1975년 뒤 입헌 군주제로 민주화함
  startEvents: [spain-union-1479]
