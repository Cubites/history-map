  from: 1154
  to: 1377
  color: "#a0a0f0"
  summary: 헝가리 왕의 종주 아래 반(ban)이 다스린 보스니아. 1299~1322년 크로아티아의 슈비치 가문이 반을 맡았고, 스테판 2세 코트로마니치(1322~1353)가 1324년 우소라·솔리, 1326년 훔(자훔리예)·돈니크라이·자브르슈예를 얻어 크게 넓힘. 트브르트코 1세(1353~1391)가 1373년 폴림리예·위쪽 드리나를 얻고 1377년 밀레셰보에서 왕으로 대관함
  mapNote: 헝가리의 봉신이라 따로 그림. 지도에는 1154~1376년 표시하고 1377년부터 보스니아 왕국(이름만 바뀐 나라, 같은 색)
  endNote: 1377년 트브르트코 1세가 밀레셰보에서 왕으로 대관해 보스니아 왕국이 됨
  features:
