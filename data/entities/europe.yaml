  basis:
    type: primary_source
    refs: ["우시 조약(1912)", "로잔 조약(1923)"]

# ── 1789~1814년 유럽 뼈대 (작업 E3, 영토는 scripts/geo/areas/europe.mjs의 '1789~1814 조각 소유표') ──
# 항목 나누는 법: 이름·정체만 바뀌고 같은 나라가 이어지면 한 항목에 설명을 붙이고(프랑스 왕국·공화국·제국, 스위스·헬베티아 공화국, 영국의 그레이트브리튼 시기),
# 다른 나라가 들어서면(위성국·연합) 새 항목으로 나눈다. 한 항목의 영토는 끊기지 않게 한다: 나라는 이어졌는데 그 사이를 다른 항목(연합 왕국 등)으로 그렸으면
# 앞 시기를 따로 항목으로 떼어 낸다(스웨덴 왕국 1523~1814 / 스웨덴-노르웨이 1814~1905 / 스웨덴 1905~). 실제로 나라가 없어졌다 돌아온 경우(교황령 1809~1813)는 같은 항목에 두고 '영토 없음' 경고를 남긴다

# 영국·아일랜드
- id: ireland-kingdom
  level: polity
  names: { ko: 아일랜드 왕국, en: Kingdom of Ireland, native: Ríocht na hÉireann }
  from: 1542
  to: 1800
  color: "#7fae7f"
  summary: 잉글랜드(1707년부터 그레이트브리튼) 왕이 왕을 겸하고 더블린에 따로 의회를 둔 나라. 1641년 봉기 뒤 크롬웰이 정복해(1649~1653) 1653~1660년에는 잉글랜드 공화국에 합쳐짐(경계가 같아 지도에서는 따로 표시). 1798년 아일랜드 연합파 봉기를 겪은 뒤 1800년 연합법으로 그레이트브리튼과 합쳐 1801년 1월 연합 왕국(영국)이 됨
  basis:
    type: primary_source
    refs: ["아일랜드 왕위법(1542)", "연합법(1800)"]
    foundingNote: 헨리 8세가 아일랜드 왕을 칭한 1542년을 시작으로 봄. 지도에는 1542년 이후만 표시(1453~1541년은 아일랜드 영주령 항목, 같은 색)

# 네덜란드
- id: dutch-republic
  level: polity
  names: { ko: 네덜란드 공화국, en: Dutch Republic, native: Republiek der Zeven Verenigde Nederlanden }
  from: 1581
  to: 1795
  color: "#e0994f"
  summary: 에스파냐에서 독립한 일곱 주의 연합 공화국으로 총독(오라녜 가문)과 주 의회가 함께 다스림. 80년 전쟁(1568~1648) 끝에 1648년 뮌스터 조약으로 독립을 인정받고 북브라반트·림뷔르흐·젤란트 플랑드르(헤네랄리테이트 땅)를 얻음. 1795년 1월 프랑스 혁명군과 애국파가 총독을 몰아내고 바타비아 공화국을 세움
  basis:
    type: primary_source
    refs: ["위트레흐트 동맹(1579)", "철회령(1581)", "베스트팔렌 조약(1648)"]
    foundingNote: 펠리페 2세를 군주로 인정하지 않기로 한 철회령(1581)을 시작으로 봄. 지도에는 1581년 이후만 표시하고, 1581~1599년도 1600년(1609년 휴전·1648년 뮌스터 조약의 땅)과 같은 경계로 그림(실효 지배는 해마다 달랐음, EUROPE_DRAFT.md 7.8 D3-⑥)

- id: batavian-republic
  level: polity
  names: { ko: 바타비아 공화국, en: Batavian Republic, native: Bataafse Republiek }
  from: 1795
