- id: lombard-kingdom
  level: polity
  names: { ko: 롬바르드 왕국, en: Kingdom of the Lombards, native: Regnum Langobardorum }
  from: 489
  to: 774
  color: "#d0a0a0"
  summary: 489년 무렵 루길란트(도나우강 북쪽 니더외스터라이히)에 들어온 롬바르드인의 왕국. 547년 판노니아를 받았고, 568년 알보인이 이탈리아로 옮겨 파비아를 도읍으로 북부 이탈리아와 스폴레토·베네벤토 공국을 다스림. 리우트프란드(712~744)·아이스툴프(749~756)가 라벤나 총독령을 차지했으나 774년 카롤루스 대제가 파비아를 함락해 무너짐
  mapNote: 루길란트 정착(489년 무렵)을 시작으로 봄. 스폴레토·베네벤토 공국은 왕국 땅, 774년부터 베네벤토는 롬바르드·캄파니아 공국들(같은 색). 지도에는 489~567년 니더외스터라이히(547년부터 판노니아·카란타니아)와 568~773년 이탈리아를 표시
  endNote: 774년 카롤루스가 파비아를 함락시켜 데시데리우스를 코르비 수도원으로 보내고 '프랑크와 롬바르드의 왕'을 칭하며 왕국이 사라짐
  features:
    - 547년 판노니아를 받음
    - 567년 아바르와 손잡고 게피드 왕국을 무너뜨림
    - 568년 알보인이 이탈리아로 옮겨 파비아를 도읍으로 북부 이탈리아와 스폴레토·베네벤토 공국을 다스림
    - 리우트프란드(712~744)·아이스툴프(749~756)가 라벤나 총독령을 차지함
  startEvents: []
  endEvents: [charlemagne-lombards-768]
  basis:
    type: primary_source
    refs: ["파울루스 디아코누스, 『롬바르드인의 역사』", "『롬바르드인의 기원』", "프로코피우스, 『전쟁사』"]
    # 작업 메모: (작업 M6) / (M-②(바), 정할 점 M6-⑤)
    foundingNote: 루길란트 정착(489년 무렵)을 시작으로 봄

- id: gepid-kingdom
  level: polity
  names: { ko: 게피드 왕국, en: Kingdom of the Gepids, native: Gepidae }
  from: 454
  to: 567
  color: "#a0a0e0"
  summary: 아르다리크가 454년 네다오 전투에서 훈족을 물리친 뒤 티서강 동쪽과 트란실바니아에 세운 게피드인의 왕국. 시르미움을 두고 동고트·동로마와 다투다가 567년 롬바르드와 아바르의 연합군에게 멸망함
  mapNote: 지도에는 454~566년 티서강 평원·바나트·바치카·트란실바니아와 시르미움(503년까지, 537~566년)을 표시(454~475년은 티서강 평원·바나트·트란실바니아·시르미움과 싱기두눔)
  endNote: 567년 아바르가 롬바르드와 손잡고 게피드 왕국을 무너뜨림
