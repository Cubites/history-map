  mapNote: 아리아라테스 1세의 자립(기원전 331년)을 시작으로 봄. 기원전 264~109년 시바스도 서부(동부는 소아르메니아), 기원전 129~65년 리카오니아(아리아라테스 6세의 아들들에게). 미트리다테스 6세의 아들 아리아라테스 9세(101~96)와 88~85·67~66년 폰토스·아르메니아의 점령은 그리지 않음. 기원전 95년(아리오바르자네스 1세)부터 로마의 종주. 소아르메니아는 조각이 맞지 않아 그리지 않음. 로마의 종속 왕국이라 따로 그림. 지도에는 기원전 331~323년(아리아라테스 1세)과 기원전 301~기원후 37년(301 아리아라테스 2세의 회복부터) 카이세리·니이데·악사라이·네브셰히르·크르셰히르·말라티아·시바스 서부, 요즈가트(279년까지)와 폰토스 내륙(282년까지)을 표시하고 322년은 페르디카스, 320~302년은 안티고노스 1세. 기원전 27~기원후 16년 카이세리·니이데·악사라이·네브셰히르·크르셰히르도와 말라티아(멜리테네)를 표시하고 17년부터 로마, 기원전 25~기원후 37년 킬리키아 트라케이아(메르신도 서부·알라니아, 17~37년은 아르켈라오스 2세)를 표시
