- id: norway
  level: polity
  names: { ko: 노르웨이, en: Norway, native: Norge }
  from: 1905
  to: null
  color: "#c07a6a"
  summary: 1905년 국민 투표로 스웨덴과의 연합을 끝내고 덴마크 왕자를 호콘 7세로 맞아 독립 왕국이 됨. 지도에는 1925년 편입한 스발바르를 넣지 않음
  basis:
    type: primary_source
    refs: ["카를스타드 협약(1905)"]
    foundingNote: 연합을 끝내고 완전한 독립 왕국이 된 1905년을 시작으로 봄. 중세 노르웨이 왕국과 1814~1905년 연합 왕국 시기는 따로 다룸

# 독일
- id: prussia
  level: polity
  names: { ko: 프로이센 왕국, en: Kingdom of Prussia, native: Königreich Preußen }
  from: 1701
  to: 1918
  color: "#5f6f8f"
