  mapNote: 지도에는 1204~1460년 트라브존·리제·귀뮈샤네와 라지스탄(아르트빈 서부)으로 대략 표시
  endNote: 1456년부터 오스만에 공물을 바쳤고 아크코윤루의 우준 하산과 손잡았으나 1461년 메흐메트 2세에게 항복함
  features:
