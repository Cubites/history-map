    foundingNote: 피우수트스키가 권력을 넘겨받은 1918년 11월 11일을 시작으로 봄. 1569~1795년 폴란드-리투아니아 연방과 1807~1815년 바르샤바 공국은 따로 다룸. 1939~1943년은 영토가 없음(총독부 항목). 지도의 1918~1920년 동쪽 국경은 1921년 리가 조약 선을 앞당겨 씀

# 독일과 국제 관리 지역
- id: weimar-republic
  level: polity
  names: { ko: 바이마르 공화국, en: Weimar Republic, native: Deutsches Reich }
  from: 1918
  to: 1933
  color: "#5f6f8f"
  summary: 1918년 11월 혁명으로 황제가 물러난 뒤 세운 독일의 민주 공화국(1919년 바이마르 헌법, 국호는 독일국). 베르사유 조약(1919)으로 알자스-로렌·포젠·서프로이센·북슐레스비히·오이펜-말메디를 잃고 단치히·메멜·자르는 국제 관리 아래 놓였으며 군비 제한과 배상금을 떠안음. 1923년 루르 점령과 초인플레이션, 1929년 세계 대공황을 겪고 1933년 1월 히틀러가 총리가 되며 무너짐
  basis:
    type: primary_source
    refs: ["바이마르 헌법(1919)", "베르사유 조약(1919)", "로카르노 조약(1925)"]
    foundingNote: 공화국을 선포한 1918년 11월 9일을 시작으로 봄. 1871~1918년은 독일 제국 항목. 1918년 지도는 법적 국경(1914년 국경)을 따르고, 베르사유 조약의 국경 변화는 1919년(서명)과 1920년(단치히·메멜·자르·북슐레스비히·오이펜-말메디)으로 나눔

- id: nazi-germany
  level: polity
  names: { ko: 나치 독일, en: Nazi Germany, native: Deutsches Reich }
  from: 1933
  to: 1945
  color: "#4f5d78"
  summary: 1933년 히틀러의 나치당이 정권을 잡고 수권법으로 일당 독재를 세운 독일(제3제국). 베르사유 체제를 깨뜨려 1935년 자르를 되찾고 재군비를 선언했으며 1936년 라인란트에 진주하고 1938년 오스트리아와 주데텐란트, 1939년 3월 체코와 메멜을 차지함. 1939년 9월 폴란드를 침공해 2차 대전을 일으켰고 1940~1941년 유럽 대부분을 점령했으나 독소 전쟁에서 밀려 1945년 5월 무조건 항복함. 유대인 학살(홀로코스트)을 저지름. 법령이나 민정장관으로 병합한 곳(오스트리아·주데텐·폴란드 서부·알자스-로렌·룩셈부르크·북슬로베니아 등)은 영토로, 나머지 점령지는 점령 항목으로 표시함
  basis:
    type: primary_source
    refs: ["수권법(1933)", "뮌헨 협정(1938)", "독소 불가침 조약(1939)", "독일 항복 문서(1945)"]
    foundingNote: 히틀러가 총리가 된 1933년 1월을 시작으로 봄. 국호는 바이마르 공화국과 같은 독일국이지만 정체가 바뀐 것을 교과서 서술에 따라 따로 표시함. 1945년 지도는 연합국 점령 지구로 표시

- id: free-city-danzig
  level: polity
  names: { ko: 단치히 자유시, en: Free City of Danzig, native: Freie Stadt Danzig }
