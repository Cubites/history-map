    foundingNote: 앙주의 샤를이 프로방스 백작의 상속녀와 혼인한 1246년을 시작으로 봄

- id: castile
  level: polity
  names: { ko: 카스티야 왕국, en: Crown of Castile, native: Corona de Castilla }
  from: 1230
  to: 1479
  color: "#d8b04c"
  summary: 카스티야·레온·갈리시아·안달루시아·무르시아와 바스크를 아우른 왕국(1462년 지브롤터, 카나리아 제도). 엔리케 4세가 죽은 뒤 이사벨 1세와 후아나가 왕위를 다툰 계승 전쟁(1475~1479)을 알카소바스 조약으로 끝냈고, 남편 페르난도가 1479년 아라곤 왕이 되어 두 왕관이 같은 왕 아래(에스파냐) 놓임
  mapNote: 지도에는 1230~1478년만 표시하고(1229년까지는 카스티야 왕국 (레온과 합치기 전)·레온 왕국 항목. 코르도바 1236·하엔 1246·세비야 1248·니에블라와 카디스 1262·무르시아 1266) 1479년부터는 에스파냐 항목(같은 색)
  endNote: 엔리케 4세가 죽은 뒤 이사벨 1세와 후아나가 왕위를 다툰 계승 전쟁(1475~1479)을 알카소바스 조약으로 끝냄. 1479년 남편 페르난도가 아라곤 왕이 되어 두 왕관이 같은 왕 아래(에스파냐) 놓임
  features:
    - 페르난도 3세가 알모하드가 무너진 틈에 남쪽으로 나가 1236년 6월 코르도바가 항복함
    - 1243년 알카라스 조약으로 무르시아의 소국이 카스티야의 보호 아래 들어옴
    - 1246년 하엔이 항복하면서 그라나다의 무함마드 1세가 카스티야의 신하가 되어 해마다 공물을 바침
    - 1248년 11월 세비야가 항복했고 칸타브리아 함대가 과달키비르강의 배다리를 끊은 것이 결정적이었음
  startEvents: [fernando-iii-1230]
  endEvents: [spain-union-1479]
  basis:
    type: primary_source
    refs: ["알카소바스 조약(1479)"]
    # 작업 메모: 작업 M3에서 1230년부터로 넓힘 / castile-early·leon 항목, renames / 정할 점 ⑩
    foundingNote: 카스티야와 레온이 마지막으로 합쳐진 1230년을 시작으로 봄

- id: aragon
  level: polity
  names: { ko: 아라곤 연합 왕국, en: Crown of Aragon, native: Corona de Aragón }
  from: 1164
  to: 1479
  color: "#c45a5a"
