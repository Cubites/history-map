  summary: 1545년 파르마 공국이 서기 전의 북중부 이탈리아 작은 나라들을 묶은 항목. 에스테 가문의 페라라·모데나·레조 공국(모데나는 1527년까지 교황령)과 루카 공화국
  mapNote: 1545년 전 이탈리아의 여러 소국을 묶어 그림. 1545년부터는 파르마·모데나·루카 묶음 항목. 지도에는 752~1544년만 표시(사르데냐의 아르콘·판관은 752년부터, 북·중부 이탈리아는 962년 오토 1세의 황제 대관부터, 1200~1299년에는 롬바르디아·베네토·에밀리아·토스카나의 코무네(밀라노는 1276년까지, 로마냐·볼로냐와 피에몬테의 토리노·쿠네오는 1279년까지)와 코르시카(피사, 1283년까지)·사르데냐의 칼리아리·토레스·갈루라 판관국도 묶음. 1300~1399년에는 스칼리제리의 베로나·카라라의 파도바·곤차가의 만토바·피사(사르데냐 땅 1323년까지)·루카·아레초와 비스콘티에 들기 전의 롬바르디아 코무네들도 묶음. 1400~1404년 카라라 가문의 파도바, 1400~1404년 마사·카라라 포함. 폴레시네(로비고, 1484 바뇰로 조약으로 베네치아)는 근사)
  endNote: 1545년 교황 바오로 3세가 교황령의 파르마·피아첸차를 떼어 아들 피에르 루이지 파르네세에게 공국으로 주면서 파르마·모데나·루카 묶음으로 이어짐
