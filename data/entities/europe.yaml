  to: 1487
  color: "#7fa37f"
  summary: 아나톨리아 중남부(코니아·카라만·악사라이·니데·이첼)의 튀르크 베이국으로 오스만과 오래 다툼. 1468년 메흐메트 2세가 코니아·카라만을 차지하고 1474년 이첼의 실리프케가 함락되었으며 남은 세력은 1487년 끝남
  basis:
    type: primary_source
    refs: ["1468년 메흐메트 2세의 카라만 원정"]
    foundingNote: 카라만 베이가 자리 잡은 1250년 무렵을 시작으로 봄. 지도에는 1300~1397년(1308년부터 코니아, 1359년부터 메르신, 작업 M2)과 1402~1467년(이첼은 1473년)까지 표시(1398~1401년은 바예지트 1세의 병합, 1402년 앙카라 전투 뒤 되살아남, 작업 M1)

- id: candar-beylik
  level: polity
  names: { ko: 잔다르 베이국 (이스펜디야르), en: Candarid Beylik (Isfendiyarids), native: Candaroğulları Beyliği }
