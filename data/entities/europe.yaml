  mapNote: 지도에는 1371~1401년만 표시하고 1402년부터는 세르비아 전제공국 항목(같은 색). 브란코비치 땅(코소보)은 1411년까지 따로 항목
  endNote: 1402년 술탄 바예지트 곁에서 싸운 앙카라 전투에서 진 뒤 스테판 라자레비치가 콘스탄티노폴리스에서 동로마 황제 요한네스 7세에게 전제공(데스포트) 칭호를 받아 세르비아 전제공국이 됨
