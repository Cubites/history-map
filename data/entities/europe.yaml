  mapNote: 여러 왕국을 묶어 그림. 지도에는 7왕국 시기(5~8세기)를 포함해 450~926년 표시(449 무렵 헹기스트와 호르사의 도래(베다) 뒤 켄트·에식스·미들섹스·동앵글리아·린지·중앙 앵글인, 앵글로색슨 연대기의 해로 491 서식스·547 버니시아·560 데이라·585 머시아·616~617 체스터와 엘멧·638 고도딘·레게드·661 템스강 상류 등)
  endNote: 927년 애설스탠이 요크를 얻고 밤버러의 이얼드레드 등의 신종을 받아 통일하면서 끝남
  features:
