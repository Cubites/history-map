- id: kalmar-union-three-kingdoms
  level: polity
  names: { ko: 칼마르 동맹 (덴마크·노르웨이·스웨덴), en: Kalmar Union (Denmark–Norway–Sweden), native: Kalmarunionen }
  from: 1397
  to: 1447
  color: "#c4685c"
  summary: 마르그레테 1세의 주도로 덴마크·노르웨이·스웨덴(핀란드 포함)이 한 왕을 받든 동맹. 1397년 칼마르에서 에리크 7세(포메른의 에리크)가 세 나라 왕으로 대관했고, 1434~1436년 엥엘브렉트 봉기 뒤 1439~1440년 세 나라가 에리크를 폐위하고 크리스토페르(바이에른의 크리스토페르)를 왕으로 세움. 1448년 크리스토페르가 죽은 뒤 스웨덴은 카를 크누트손을 왕으로 뽑아 갈라짐
  mapNote: 에리크 7세가 세 나라 왕으로 대관한 1397년을 시작으로 봄. 홀슈타인은 1460년 리베 조약 전이라 들지 않음(신성 로마 제국). 지도에는 1397~1447년 덴마크·노르웨이·스웨덴(핀란드 포함)을 표시하고, 1448년부터는 칼마르 동맹 (덴마크·노르웨이) 항목(같은 색)
  endNote: 1448년 크리스토페르가 후사 없이 죽자 스웨덴은 카를 크누트손을, 덴마크는 크리스티안 1세를 왕으로 뽑아 동맹이 갈라짐. 노르웨이는 1450년 크리스티안이 왕이 되어 덴마크-노르웨이 연합이 이어짐
