  summary: 이반 알렉산다르의 아들 이반 스라치미르가 다스린 불가리아 서북부의 차르국(1356년 무렵 터르노보와 갈라짐). 1365년 헝가리 왕 러요시 1세가 비딘을 차지해 비딘 바나트를 두었으나 1369년 스라치미르가 헝가리의 봉신으로 돌아옴. 1388년 무렵부터 오스만의 봉신이었고 1396년 니코폴리스 전투 뒤 바예지트 1세가 합침
  mapNote: 지도에는 1356~1395년 비딘·몬타나·브라차·자이차르·보르(1383년까지) 쪽을 대략 표시하고 1365~1368년은 헝가리
  endNote: 1396년 니코폴리스 전투 뒤 바예지트 1세가 비딘을 합쳐 차르국이 사라짐
  features:
