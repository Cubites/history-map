- id: cuman-tribes
  level: polity
  names: { ko: 쿠만(킵차크) 부족 (묶음), en: Cumans and Kipchaks (grouped), native: Qıpçaq }
  from: 1055
  to: 1241
  color: "#e0c0e0"
  summary: 11세기부터 드네스트르강에서 볼가강 너머까지 흑해 북쪽 초원(데슈티 킵차크)을 차지한 튀르크계 유목 부족들(루스는 폴로베츠라 부름)을 묶은 항목. 1223년 루스와 함께 칼카강에서 몽골군에 졌고, 1237~1239년 몽골의 원정 뒤 쾨텐이 이끈 무리는 헝가리로 달아났으며 남은 무리는 킵차크 칸국에 흡수됨
  mapNote: 흑해 북쪽 초원의 쿠만(킵차크) 부족들을 묶어 그림. 지도에는 1055~1241년 흑해 북쪽 초원(몰다비아·왈라키아·우크라이나 남부·도네츠강·돈강·볼가강 하류·크림 북부·쿠반)을 표시하고 1242년부터 킵차크 칸국
  endNote: 1237~1239년 몽골의 원정 뒤 쾨텐이 이끈 무리는 헝가리로 달아났고 남은 무리는 킵차크 칸국에 흡수됨. 쾨텐은 1241년 3월 페슈트에서 헝가리 귀족에게 살해됨
  features:
    - 쿠만은 페체네그를 대신해 흑해 북쪽 초원의 주인이 됨
    - 1223년 루스와 함께 칼카강에서 몽골군에 짐
  startEvents: [yaroslav-wise-1015]
  endEvents: [mongol-rus-1236, mongol-central-europe-1241]
  basis:
    type: primary_source
    refs: ["『이파티예프 연대기』", "카르피니, 『몽골인의 역사』"]
