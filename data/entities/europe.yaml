# 서유럽
- id: netherlands
  level: polity
  names: { ko: 네덜란드, en: Netherlands, native: Koninkrijk der Nederlanden }
  from: 1813
  to: null
  color: "#e0994f"
  summary: 빈 회의(1815)로 옛 오스트리아령 네덜란드(지금의 벨기에)를 합친 네덜란드 연합 왕국이 됨. 1830년 벨기에가 독립해 떨어져 나갔고 1839년 런던 조약으로 이를 인정함. 1890년까지 왕이 룩셈부르크 대공을 겸함. 지도에는 유럽 본토만 표시 (식민지 제외). 1차 대전에서는 중립을 지켰고 1940~1945년 독일에 점령됨(1944년 가을 남부 해방)
  basis:
