- id: russia
  level: polity
  names: { ko: 러시아 제국, en: Russian Empire, native: Российская империя }
  from: 1721
  to: 1917
  color: "#6f8f6f"
  summary: 동유럽에서 시베리아·중앙아시아까지 다스린 제국. 1721년 표트르 1세가 황제를 칭하며 러시아 차르국에서 이름이 바뀜. 폴란드 분할과 캅카스·중앙아시아 정복으로 넓어졌고, 베이징 조약(1860)으로 연해주를 차지함. 러일 전쟁(1904~1905)에서 지고 1917년 혁명으로 제정이 무너짐
  details: 표트르 1세가 황제를 칭한 1721년에 러시아 차르국에서 이름이 바뀜. 뉘스타드 조약(1721)으로 발트해 연안을, 오보 조약(1743)으로 핀란드 동남부를, 퀴췩카이나르자 조약(1774)으로 흑해 북쪽 기슭 일부와 카바르다를 얻고 1783년 크림 칸국을 병합함. 폴란드 분할(1772·1793·1795)로 리투아니아·벨라루스·우크라이나 우안·쿠를란트를, 야시 조약(1792)으로 흑해 북쪽 기슭을 얻고 1801~1813년 캅카스 남쪽, 1809년 핀란드, 1812년 베사라비아를 차지함. 빈 회의(1815)로 폴란드 왕국을 얻음. 북캅카스 산지는 오세티야(1774)·인구시(1810)의 서약을 거쳐 캅카스 전쟁(1817~1864) 끝에 1859년 샤밀이 항복하며 체첸까지 차지함. 크림 전쟁(1853~1856)에 졌으나 러시아-튀르크 전쟁(1877~1878)으로 발칸에 세력을 넓힘. 아이훈 조약(1858)으로 흑룡강 왼쪽을, 베이징 조약(1860)으로 연해주를 차지해 조선과 국경을 맞댐. 조선 땅이던 녹둔도도 이때 러시아 쪽에 들어가 조선이 반환을 요구함. 카자흐 초원(중주즈 1822·소주즈 1824·대주즈 1847~1854)과 중앙아시아(타슈켄트 1865, 부하라 1868·히바 1873 보호국, 코칸트 1876 병합, 투르크멘 1881~1885, 파미르 1895)를 차지하고 1875년 상트페테르부르크 조약으로 사할린 전체를 얻었으며(1905년 남부를 일본에), 1914년 우랑하이(투바)를 보호령으로 삼음. 삼국 간섭과 아관파천으로 한반도에 영향력을 넓혔으나 러일 전쟁(1904~1905)에서 짐. 1917년 혁명으로 제정이 무너짐. 시베리아·중앙아시아는 단계별 대략적인 추정이고, 카스피해에서 파미르까지의 남쪽 끝은 지금의 이란·아프가니스탄·중국 국경을, 두만강 하구 북쪽 하산 지역은 1860년 베이징 조약 경계를 따름
  mapNote: 지도에는 1721년 이후 영토만 대략 표시함(그전은 러시아 차르국으로 따로 그림)
  endNote: 1917년 3월 15일(구력 3월 2일) 니콜라이 2세가 물러나 300년 넘게 이어진 로마노프 왕조가 끝났고, 11월 7일(구력 10월 25일) 10월 혁명으로 권력이 소비에트로 넘어옴
