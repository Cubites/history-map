- id: denmark-early
  level: polity
  names: { ko: 덴마크 왕국 (초기), en: Kingdom of Denmark (early), native: Danmǫrk }
  from: 700
  to: 958
  color: "#c4685c"
  summary: 유틀란트·덴마크 섬들·스코네의 데인인 왕국. 구드프레드(804~810)가 헤데비를 세우고 다네비르케를 쌓았으며 811년 아이더강을 프랑크와의 경계로 정함. 호리크 1세(854 죽음) 뒤 왕위 다툼으로 나뉘었다가 고름(936 무렵)과 하랄 블로탄(958)이 다시 묶음
  mapNote: 8세기 데인인 왕의 첫 기록을 시작으로 봄. 854~936년 분열은 한 나라. 지도에는 700~957년 표시(700 옹겐두스부터, 그전 데인인·유트인은 게르만 부족(묶음). 800~957년 덴마크·슐레스비히·스코네·할란드·블레킹에(근사))하고 958년부터 덴마크 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 고름(936 무렵)과 하랄 블로탄(958)이 나뉜 덴마크를 다시 묶어 덴마크 왕국으로 이어짐
  features:
    - 구드프레드(804~810)가 808년 교역도시 레리크를 부수고 헤데비를 세웠으며 다네비르케를 쌓음
    - 구드프레드는 810년 프리슬란트를 약탈한 뒤 암살되었고 811년 헤밍이 아이더강을 프랑크와의 경계로 정함
    - 826년 하랄 클라크가 루트비히 경건왕 앞에서 세례를 받고 안스가르가 선교에 나섰으나 이교는 오래 남음
    - 854년 호리크 1세가 죽은 뒤 왕위 다툼이 이어졌고 10세기 초 헤데비는 올라프 가문이 다스림
