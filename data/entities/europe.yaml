  names: { ko: 오스트리아 공화국, en: Republic of Austria, native: Republik Österreich }
  from: 1918
  to: null
  color: "#d6bd6e"
  summary: 오스트리아-헝가리가 무너진 뒤 1918년 11월 독일계 지역에 세운 공화국(독일-오스트리아). 생제르맹 조약(1919)으로 독일과의 합병을 금지당하고 남티롤을 이탈리아에 넘겼으며 1921년 부르겐란트를 얻음. 1934년 권위주의 체제를 거쳐 1938년 3월 나치 독일에 병합되었다가 1945년 4월 다시 세워졌고 1955년 국가 조약까지 미국·영국·프랑스·소련이 나눠 점령함(지도에는 점령 지구를 나누지 않고 점령 관계만 표시)
  mapNote: 독일-오스트리아 공화국을 선포한 1918년 11월 12일을 시작으로 봄. 1938~1944년 병합 기간은 영토가 없음
  features:
    - 생제르맹 조약(1919)으로 독일과의 합병을 금지당하고 남티롤을 이탈리아에 넘겼으며 1921년 부르겐란트를 얻음
    - 1934년 권위주의 체제를 거쳐 1938년 3월 나치 독일에 병합됨
    - 1945년 4월 다시 세워졌고 1955년 국가 조약까지 미국·영국·프랑스·소련이 나눠 점령함
  startEvents: [austria-hungary-dissolution-1918]
  basis:
    type: primary_source
    refs: ["생제르맹 조약(1919)", "오스트리아 연방 헌법(1920)", "모스크바 선언(1943)", "오스트리아 국가 조약(1955)"]
    foundingNote: 독일-오스트리아 공화국을 선포한 1918년 11월 12일을 시작으로 봄

- id: hungary
  level: polity
  names: { ko: 헝가리, en: Hungary, native: Magyarország }
  from: 1918
  to: null
  color: "#a8c47f"
  summary: 1918년 오스트리아-헝가리가 무너지며 독립한 공화국. 1919년 소비에트 공화국을 거쳐 1920년 호르티가 섭정하는 왕국이 되었고 트리아농 조약으로 영토의 3분의 2를 잃음. 독일·이탈리아와 손잡고 빈 중재(1938·1940)로 슬로바키아 남부·카르파티아 루스·북트란실바니아를, 1941년 유고슬라비아 북부를 얻어 추축국으로 독소 전쟁에 참전함. 1944년 3월 독일에 점령되고 1945년 소련군에 져 트리아농 국경으로 돌아감. 1949년 공산당 일당 체제의 인민 공화국이 되었고 1956년 반소 봉기가 소련군에 진압됨. 1989년 10월 공화국을 선포함
  mapNote: 그전의 헝가리 왕국은 오스트리아 제국·오스트리아-헝가리 항목에 포함. 지도의 1918~1919년 국경은 1920년 트리아농 조약 선을 앞당겨 씀(부르겐란트는 1921년 오스트리아)
  features:
    - 1919년 소비에트 공화국을 거쳐 1920년 호르티가 섭정하는 왕국이 되었고 트리아농 조약으로 영토의 3분의 2를 잃음
    - 독일·이탈리아와 손잡고 빈 중재(1938·1940)로 슬로바키아 남부·카르파티아 루스·북트란실바니아를 얻음
    - 1941년 유고슬라비아 북부를 얻어 추축국으로 독소 전쟁에 참전함
    - 1944년 3월 독일에 점령되고 1945년 소련군에 져 트리아농 국경으로 돌아감
    - 1949년 공산당 일당 체제의 인민 공화국이 되었고 1956년 반소 봉기는 소련군에 진압되었으며 1989년 10월 공화국을 선포함
  startEvents: [austria-hungary-dissolution-1918]
  basis:
    type: primary_source
    refs: ["트리아농 조약(1920)", "1차 빈 중재(1938)", "2차 빈 중재(1940)", "파리 강화 조약(1947)"]
    foundingNote: 독립 공화국을 선포한 1918년 11월 16일을 시작으로 봄

- id: czechoslovakia
  level: polity
  names: { ko: 체코슬로바키아, en: Czechoslovakia, native: Československo }
  from: 1918
  to: 1992
  color: "#8fa6d1"
  summary: 1918년 10월 체코와 슬로바키아가 합쳐 세운 공화국으로 마사리크가 대통령이 됨. 생제르맹·트리아농 조약으로 카르파티아 루스를 얻었고 독일계가 많은 주데텐란트를 포함함. 1938년 뮌헨 협정으로 주데텐란트를 독일에, 1차 빈 중재로 남부를 헝가리에 넘기고 1939년 3월 해체됨(보헤미아-모라비아 보호령·슬로바키아). 1945년 다시 세워졌으나 카르파티아 루스는 소련에 넘김. 1948년 공산당이 권력을 잡았고 1968년 개혁(프라하의 봄)이 바르샤바 조약군에 꺾임. 1989년 공산 정권이 무너지고 1993년 1월 체코와 슬로바키아로 나뉨
  mapNote: 독립을 선언한 1918년 10월 28일을 시작으로 봄. 1939~1944년은 영토가 없음(보헤미아-모라비아 보호령·슬로바키아 항목)
  endNote: 1992년 7월 슬로바키아 의회가 주권 선언을 채택하고 11월 25일 연방 의회가 연방 해체에 관한 헌법률을 통과시켜, 1993년 1월 1일 체코 공화국과 슬로바키아 공화국으로 평화롭게 갈라섬
  features:
    - 생제르맹·트리아농 조약으로 카르파티아 루스를 얻었고 독일계가 많은 주데텐란트를 포함함
    - 1938년 뮌헨 협정으로 주데텐란트를 독일에, 1차 빈 중재로 남부를 헝가리에 넘기고 1939년 3월 해체됨
    - 1945년 다시 세워졌으나 카르파티아 루스는 소련에 넘김
    - 1948년 공산당이 권력을 잡았고 1968년 개혁(프라하의 봄)이 바르샤바 조약군에 꺾임
    - 1989년 공산 정권이 무너짐
  startEvents: [austria-hungary-dissolution-1918]
  endEvents: [czech-slovak-split-1993]
  basis:
    type: primary_source
    refs: ["체코슬로바키아 독립 선언(1918)", "생제르맹 조약(1919)", "뮌헨 협정(1938)", "체코슬로바키아-소련 조약(1945)", "파리 강화 조약(1947)"]
    foundingNote: 독립을 선언한 1918년 10월 28일을 시작으로 봄

- id: bohemia-moravia
  level: region
  names: { ko: 보헤미아-모라비아 보호령, en: Protectorate of Bohemia and Moravia, native: Protektorat Böhmen und Mähren }
  from: 1939
  to: 1945
  color: "#8fa6d1"
  summary: 1939년 3월 독일이 체코슬로바키아를 해체하며 점령한 체코 땅(뮌헨 협정 뒤 남은 보헤미아·모라비아). 독일이 보호령으로 다스렸으며 1945년 5월 해방되어 체코슬로바키아에 돌아감
  endNote: 1945년 5월 5일 프라하 시민이 봉기했고 9일 소련군이 들어와 보호령이 끝났으며, 슬로바키아와 함께 체코슬로바키아가 되살아남
  features:
    - 하하 대통령의 자치 정부는 형식뿐이고 실권은 독일의 제국 보호관이 쥐었으며 군수 공장은 독일 전쟁 경제에 동원됨
    - 1939년 11월 학생 시위가 일어나자 독일은 체코의 대학을 모두 닫고 학생 지도자 9명을 처형함
    - 1942년 5월 런던의 망명 정부가 보낸 낙하산 대원들이 프라하에서 보호관 대리 하이드리히를 습격해 숨지게 함
    - 독일은 보복으로 리디체 마을을 없애고 레자키 마을의 어른들도 모두 죽임
    - 테레진에는 유대인 게토가 세워졌음
  startEvents: [anschluss-munich-1938, bohemia-moravia-1939]
  endEvents: [bohemia-moravia-1939]
  basis:
    type: primary_source
    refs: ["보헤미아-모라비아 보호령 설치 포고(1939)"]
    foundingNote: 독일군이 프라하에 들어가고 이튿날 히틀러의 포고로 체코 지역이 보호령이 된 1939년 3월부터

- id: slovakia
  level: polity
  names: { ko: 슬로바키아 공화국, en: Slovak Republic (1939–1945), native: Slovenská republika }
  from: 1939
  to: 1945
  color: "#a6b8e0"
  summary: 1939년 3월 독일의 압력으로 체코슬로바키아에서 떨어져 나온 독일의 위성국(티소 정권). 독일과 함께 폴란드·소련 침공에 참전했고 1944년 8월 슬로바키아 민족 봉기 뒤 독일군에 점령됨. 1945년 체코슬로바키아에 돌아감
  endNote: 1945년 4월 소련군이 브라티슬라바에 들어간 뒤 체코슬로바키아에 돌아감
  features:
    - 독일과 함께 폴란드·소련 침공에 참전했고 1940년 11월 삼국 동맹에 들어옴
    - 1944년 8월 29일 티소 정권과 독일에 맞선 민족 봉기가 일어났으나 독일군이 들어와 10월 말 진압하고 점령함
  startEvents: [bohemia-moravia-1939]
  endEvents: [bohemia-moravia-1939]
  basis:
    type: primary_source
    refs: ["슬로바키아 독립 선언(1939)", "독일-슬로바키아 보호 조약(1939)"]
    foundingNote: 티소가 이끄는 슬로바키아가 독일의 압력 속에 독립을 선언한 1939년 3월 14일을 시작으로 봄

# 발칸
- id: yugoslavia
  level: polity
  names: { ko: 유고슬라비아, en: Yugoslavia, native: Jugoslavija }
  from: 1918
  to: 1992
  color: "#b8706d"
  summary: 1918년 12월 세르비아·몬테네그로와 오스트리아-헝가리의 남슬라브 땅이 합쳐 세운 세르브-크로아트-슬로벤 왕국으로, 1929년 유고슬라비아 왕국으로 이름을 바꿈. 1941년 4월 추축국의 침공으로 분할되었으나 티토의 파르티잔이 되찾아 1945년 11월 연방 인민 공화국을 선포함. 1948년 소련과 갈라선 뒤 비동맹 노선을 걸었고 1991년 6월 슬로베니아·크로아티아의 독립 선언으로 해체가 시작됨
  details: 1941년 4월 추축국의 침공으로 분할되어 크로아티아 독립국이 세워지고 나머지는 독일·이탈리아·헝가리·불가리아·알바니아가 나눠 차지함. 티토의 파르티잔이 1944~1945년 나라를 되찾고 1945년 11월 연방 인민 공화국을 선포함. 1963년 사회주의 연방 공화국으로 이름을 바꿈. 1947년 파리 강화 조약으로 이스트라·리예카·율리안 마치 대부분을, 1954년 런던 양해 각서로 트리에스테 자유 지역 B 구역을 얻음. 1948년 소련과 갈라선 뒤 비동맹 노선을 걸었고 1991년 6월 슬로베니아·크로아티아의 독립 선언으로 해체가 시작됨(지도는 국제 승인 전인 1991년까지 한 나라로 그림)
  mapNote: 세르브-크로아트-슬로벤 왕국을 선포한 1918년 12월 1일을 시작으로 봄. 1941~1943년은 영토가 없음(분할 점령)
  endNote: 1991년 6월 슬로베니아·크로아티아의 독립 선언으로 해체가 시작되었고, 1992년 4월 세르비아와 몬테네그로가 유고슬라비아 연방 공화국을 세움
  features:
    - 1941년 4월 추축국의 침공으로 분할되었으나 티토의 파르티잔이 되찾아 1945년 11월 연방 인민 공화국을 선포함
    - 1948년 소련과 갈라선 뒤 비동맹 노선을 걸음
    - 1947년 파리 강화 조약으로 이스트라·리예카·율리안 마치 대부분을, 1954년 런던 양해 각서로 트리에스테 자유 지역 B 구역을 얻음
    - 1963년 사회주의 연방 공화국으로 이름을 바꿈
  startEvents: [austria-hungary-dissolution-1918]
  endEvents: [yugoslav-wars-1991]
  basis:
    type: primary_source
    refs: ["코르푸 선언(1917)", "뇌이 조약(1919)", "라팔로 조약(1920)", "트리아농 조약(1920)", "파리 강화 조약(1947)", "런던 양해 각서(1954)"]
    foundingNote: 세르브-크로아트-슬로벤 왕국을 선포한 1918년 12월 1일을 시작으로 봄

- id: croatia-ndh
  level: polity
