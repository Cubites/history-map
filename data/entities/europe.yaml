  basis:
    type: primary_source
    refs: ["2차 폴란드 분할 조약(1793)", "틸지트 조약(1807)", "빈 회의 최종 의정서(1815)", "프라하 조약(1866)"]
    foundingNote: 프리드리히 1세가 왕위에 오른 1701년을 왕국의 시작으로 봄

- id: german-states
  level: polity
  names: { ko: 독일 연방 국가들 (묶음), en: States of the German Confederation (grouped) }
  from: 1814
  to: 1866
  color: "#a8b48e"
  summary: 빈 회의(1815)로 만든 독일 연방(39개국) 가운데 프로이센·오스트리아·덴마크령 홀슈타인·라우엔부르크·룩셈부르크를 뺀 나라들을 묶은 항목. 바이에른·작센·하노버·뷔르템베르크·바덴·헤센 등 왕국·공국과 함부르크·브레멘·프랑크푸르트 같은 자유시가 들어 있음. 1866년 프로이센-오스트리아 전쟁으로 독일 연방이 해체되며 북독일 연방과 남독일 국가들로 나뉨. 1814년(라인 동맹이 무너진 뒤 빈 회의 전)의 독일 나라들도 이 항목으로 표시
  basis:
    type: primary_source
    refs: ["파리 조약(1814)", "빈 회의 최종 의정서(1815)", "독일 연방 규약(1815)"]

- id: north-german-confederation
  level: polity
  names: { ko: 북독일 연방, en: North German Confederation, native: Norddeutscher Bund }
  from: 1866
  to: 1870
  color: "#5f6f8f"
  summary: 프로이센-오스트리아 전쟁(1866) 뒤 하노버·헤센카셀·나사우·프랑크푸르트·슐레스비히홀슈타인을 합친 프로이센이 마인강 북쪽 나라들과 만든 연방 국가. 1867년 헌법을 시행했고 1871년 남독일 국가들이 합류해 독일 제국이 됨
  basis:
    type: primary_source
    refs: ["프라하 조약(1866)", "북독일 연방 헌법(1867)"]
    foundingNote: 1866년 8월 동맹 조약을 시작으로 봄. 연방 헌법은 1867년 7월에 시행됨

- id: south-german-states
  level: polity
