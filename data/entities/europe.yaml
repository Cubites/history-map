- id: roman-republic
  level: polity
  names: { ko: 로마 공화정, en: Roman Republic, native: Res publica Romana }
  from: -508
  to: -26
  color: "#c04050"
  summary: 기원전 509년 타르퀴니우스 수페르부스를 몰아낸 뒤 두 콘술과 원로원이 다스린 로마. 기원전 272년 타렌툼으로 이탈리아 반도를 묶었고, 포에니 전쟁으로 시칠리아·사르데냐와 코르시카·히스파니아를 얻고 카르타고를 무너뜨림. 마케도니아 전쟁과 코린토스 파괴로 그리스를, 페르가몬의 유증으로 아시아를 얻음. 카이사르가 갈리아를 정복한 뒤 내전을 거쳐 기원전 27년 옥타비아누스가 아우구스투스가 되며 로마 제국으로 이어짐
  details: 기원전 272년 타렌툼으로 이탈리아 반도를 묶었고, 포에니 전쟁(264~241·218~201·149~146)으로 시칠리아(241)·사르데냐와 코르시카(238)·히스파니아(206)를 얻고 카르타고를 무너뜨림(146). 마케도니아 전쟁(197 키노스케팔라이·168 피드나·148 속주)과 코린토스 파괴(146)로 그리스를, 페르가몬의 유증(133)으로 아시아를 얻었고, 갈리아 트란살피나(121)·킬리키아(102·67)·비티니아(74)·크레타(67)·시리아(64)·폰토스(63)·키프로스(58)를 더함. 카이사르가 갈리아(58~51)를 정복한 뒤 내전을 거쳐 기원전 27년 옥타비아누스가 아우구스투스가 되며 로마 제국으로 이어짐
  mapNote: "공화정의 시작(기원전 509년, 전승)을 시작으로 봄(로마 왕국에서 이름만 바뀌어 이어짐). 넘김 해는 조약·유증·실효 지배가 굳은 해. 내전기의 군벌 지배(술라·세르토리우스·삼두정치)는 그리지 않음. 기원전 27년 아우구스투스의 원수정부터 로마 제국이 잇고 색이 같음. 지도에는 기원전 509~28년 표시: 기원전 509년 로마도의 라티움, 396 베이이, 338 라틴 동맹 해체와 볼스키·캄파니아, 326 네아폴리스, 317 아풀리아, 304~290 삼니움·사비니·아브루초·피케눔, 283~280 아게르 갈리쿠스·에트루리아, 272 타렌툼·루카니아·브루티움, 265 볼시니이·메사피이(동맹시는 로마 색). 카타나는 기원전 260년부터(263년 항복, 1만 km² 미만), 에부수스는 146년부터, 마살리아는 기원전 44년부터 로마로 그림"
  endNote: 기원전 27년 옥타비아누스가 아우구스투스가 되며 로마 제국으로 이어짐
  features:
