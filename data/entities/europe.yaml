- id: albania
  level: polity
  names: { ko: 알바니아, en: Albania, native: Shqipëria }
  from: 1912
  to: null
  color: "#7f9f9a"
  summary: 1912년 1차 발칸 전쟁 중 블로러에서 독립을 선언하고 1913년 런던 대사 회의에서 열강의 인정을 받은 나라. 1914년 빌헬름 추 비트를 공으로 맞았으나 1차 대전으로 혼란에 빠졌다가 1920년 루슈녜 회의로 독립을 되찾음. 1928년 조구 1세가 왕이 되었고 1939년 4월 이탈리아에 병합됨. 1944년 11월 공산 파르티잔이 해방했고 1946년 인민 공화국이 되었으며 1991년 다당제를 받아들임
  details: 1914년 독일 귀족 빌헬름 추 비트를 공으로 맞았으나 1차 대전으로 곧 혼란에 빠짐. 1차 대전 중 여러 나라에 점령되었다가 1920년 루슈녜 회의로 독립을 되찾음(1921년 대사 회의가 국경을 다시 확인). 1928년 조구 1세가 왕이 되었고 1939년 4월 이탈리아에 병합되었으며(1941~1943 코소보·서마케도니아를 더함) 1943~1944년 독일이 점령함. 1944년 11월 공산 파르티잔이 해방함. 1946년 인민 공화국이 되었고 소련(1961)·중국(1978)과 차례로 갈라서며 고립 노선을 걸음. 1991년 다당제를 받아들임
  mapNote: 지도에는 국경이 정해진 1913년부터 표시
