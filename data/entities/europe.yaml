- id: ducal-prussia
  level: polity
  names: { ko: 프로이센 공국, en: Duchy of Prussia, native: Herzogtum Preußen }
  from: 1525
  to: 1618
  color: "#7d8aa6"
  summary: 튜턴 기사단 단장 알브레히트가 루터파로 바꾸며 기사단국을 세속 공국으로 만든 나라로 폴란드 왕의 봉토였음(수도 쾨니히스베르크). 1618년 브란덴부르크 선제후 요한 지기스문트가 공작 자리를 이어받아 브란덴부르크-프로이센이 되었고, 1657년 벨라우 조약으로 폴란드의 봉토에서 벗어남
  mapNote: 지도에는 1525~1617년만 표시하고(1453~1524년은 튜턴 기사단국 항목, 같은 색)(동프로이센, 지금의 칼리닌그라드주와 바르미아마주리주 대부분·클라이페다 남부) 1618년부터는 브란덴부르크-프로이센 항목
  endNote: 1618년 브란덴부르크 선제후 요한 지기스문트가 공작 자리를 이어받아 브란덴부르크-프로이센이 되었고, 1657년 벨라우 조약으로 폴란드의 봉토에서 벗어남
  features:
    - 지그문트 1세의 조카인 알브레히트가 크라쿠프 광장에서 그에게 신하의 예를 올림(프로이센의 신종)
    - 루터파를 공식 종교로 삼은 첫 나라가 됨
  startEvents: [ducal-prussia-1525]
  endEvents: [brandenburg-prussia-1618]
  basis:
    type: primary_source
    refs: ["크라쿠프 조약(1525)", "벨라우 조약(1657)"]
    foundingNote: 크라쿠프 조약으로 공국이 선 1525년을 시작으로 봄

- id: transylvania
  level: polity
  names: { ko: 트란실바니아 공국, en: Principality of Transylvania, native: Erdélyi Fejedelemség }
  from: 1570
  to: 1711
  color: "#8db1d6"
  summary: 모하치 전투(1526) 뒤 헝가리 동부에 선 공국으로 오스만의 종주권 아래 자치를 누림. 1570년 슈파이어 조약으로 야노시 지그몬드가 헝가리 왕 칭호를 내놓고 트란실바니아 공이 되며 시작됨. 대튀르크 전쟁 중 블라지 조약(1687)으로 합스부르크군이 들어왔고 카를로비츠 조약(1699)으로 합스부르크 땅이 됨. 라코치 페렌츠 2세의 독립 전쟁(1703~1711)이 실패한 뒤 대공국으로 합스부르크에 남음
  details: 트란실바니아 본토와 헝가리 동부의 파르티움(비하르·마러머로시 등)을 다스렸고, 베틀렌 가보르(니콜스부르크 조약 1622)와 라코치 죄르지 1세(린츠 조약 1645)는 헝가리 북동부 7개 주를 평생 받음. 라코치 죄르지 2세의 폴란드 원정(1657)이 실패한 뒤 오스만에 버러드(오라데아, 1660)를 빼앗김(버슈바르 조약 1664). 대튀르크 전쟁 중 블라지 조약(1687)으로 합스부르크군이 들어오고 레오폴트 칙서(1691)로 합스부르크의 다스림을 받았으며, 카를로비츠 조약(1699)으로 합스부르크 땅이 됨. 라코치 페렌츠 2세의 독립 전쟁(1703~1711)이 실패한 뒤 대공국으로 합스부르크에 남음
  mapNote: 지도에는 1570~1698년만 표시하고(1526~1569년은 동헝가리 왕국 항목, 같은 색) 1699년부터는 합스부르크 군주국의 땅으로 그림. 1598·1602년 지그몬드 바토리가 공국을 루돌프 2세에게 넘긴 것은 의회가 받아들이지 않았고 1606년 빈 조약이 공국을 인정해 처음부터 공국으로 그림
  endNote: 카를로비츠 조약(1699)으로 합스부르크 땅이 되었고, 라코치 페렌츠 2세의 독립 전쟁(1703~1711)이 실패한 뒤 대공국으로 합스부르크에 남음
  features:
    - 1568년 토르더 의회가 설교자가 믿음을 자유롭게 전할 수 있게 해 유럽에서 이른 종교 관용의 예로 꼽힘
    - 트란실바니아 본토와 헝가리 동부의 파르티움(비하르·마러머로시 등)을 다스림
    - 베틀렌 가보르(1622)와 라코치 죄르지 1세(1645)는 헝가리 북동부 7개 주를 평생 받음
    - 라코치 죄르지 2세의 폴란드 원정(1657)이 실패한 뒤 오스만에 버러드(오라데아, 1660)를 빼앗김
    - 대튀르크 전쟁 중 블라지 조약(1687)으로 합스부르크군이 들어오고 레오폴트 칙서(1691)로 합스부르크의 다스림을 받음
  startEvents: [szigetvar-speyer-1566]
  endEvents: [rakoczi-1703]
  basis:
    type: primary_source
    refs: ["슈파이어 조약(1570)", "니콜스부르크 조약(1622)", "린츠 조약(1645)", "버슈바르 조약(1664)", "레오폴트 칙서(1691)", "카를로비츠 조약(1699)"]
    foundingNote: 야노시 지그몬드가 헝가리 왕 칭호를 내놓고 트란실바니아 공이 된 슈파이어 조약(1570)을 시작으로 봄

- id: cossack-hetmanate
  level: polity
  names: { ko: 코사크 헤트만국, en: Cossack Hetmanate, native: Гетьманщина }
  from: 1649
  to: 1764
  color: "#4f86b0"
  summary: 보흐단 흐멜니츠키가 이끈 코사크 봉기(1648) 뒤 즈보리우 조약(1649)으로 키이우·브라츨라우·체르니히우 주에 선 자포로자 군단의 나라. 1654년 페레야슬라우 회의로 러시아 차르의 보호를 받았고, 하디아치 조약(1658)·슬로보디셰 조약(1660)을 거쳐 드니프로강 오른쪽 기슭은 폴란드로 돌아감(오른쪽 기슭 헤트만 도로셴코는 1669년 오스만의 보호를 받음). 1667년 안드루소보 휴전으로 왼쪽 기슭과 키이우는 러시아 땅이 되었고, 헤트만국은 러시아 안의 자치 지역으로 남았다가 1764년 예카테리나 2세가 헤트만 자리를 없앰
  mapNote: 지도에는 독립기 1649~1653년만 따로 표시하고(키이우·브라츨라우·체르니히우 주와 자포로자 땅), 1654년 페레야슬라우 회의부터는 종속국 땅은 종주국 땅으로 보는 원칙대로 러시아 땅으로 그림(러시아 종속 관계는 1666년까지, 1660년부터 오른쪽 기슭은 폴란드)
  endNote: 1764년 예카테리나 2세가 헤트만 자리를 없애 자치를 줄임
  features:
    - 1654년 페레야슬라우 회의로 러시아 차르의 보호를 받음
    - 하디아치 조약(1658)·슬로보디셰 조약(1660)을 거쳐 드니프로강 오른쪽 기슭은 폴란드로 돌아감
    - 1667년 안드루소보 휴전으로 왼쪽 기슭과 키이우는 러시아 땅이 되었고 헤트만국은 러시아 안의 자치 지역으로 남음
    - 오른쪽 기슭 헤트만 도로셴코는 1669년 오스만의 보호를 받음
  startEvents: [khmelnytsky-1648]
  endEvents: [catherine-ii-1762]
  basis:
    type: primary_source
    refs: ["즈보리우 조약(1649)", "페레야슬라우 회의(1654)", "안드루소보 휴전(1667)", "영원한 평화 조약(1686)"]
    # 작업 메모: 정할 점(EUROPE_DRAFT.md 7.3-⑧)
    foundingNote: 즈보리우 조약으로 헤트만국이 선 1649년을 시작으로 봄

# ── 1526~1599년 유럽 뼈대 (작업 D3, 영토는 scripts/geo/areas/europe.mjs의 '1526~1599 조각 소유표') ──
# 1600~1699년 항목 가운데 이 시기에도 있던 나라는 영토를 1526년부터로 넓혔다(쿠를란트 1561·네덜란드 공화국 1581·폴란드-리투아니아 1569·트란실바니아 1570·토스카나 1569·파르마·모데나·루카 1545·아일랜드 왕국 1542·러시아 차르국 1547년부터).
# 이름만 바뀐 나라는 1700~1788·1600~1699년처럼 항목을 나눈다(소유표 renames, 정할 점 ⑩)
- id: grand-duchy-of-moscow
  level: polity
  names: { ko: 모스크바 대공국, en: Grand Duchy of Moscow, native: Великое княжество Московское }
  from: 1283
  to: 1547
  color: "#6f8f6f"
  summary: 모스크바를 중심으로 루스의 공국들을 모은 나라. 이반 3세가 노브고로드(1478)·트베리(1485)를 합치고 킵차크 칸국의 지배에서 벗어났으며(1480), 이반 3세가 대페름(1472 원정)을, 바실리 3세가 프스코프(1510)·스몰렌스크(1514)·랴잔(1521)을 합침. 1503년 휴전으로 리투아니아에게서 세베르스크 땅(체르니히우·노우호로드시베르스키·스타로두프·브랸스크)을 얻음. 1547년 이반 4세가 차르로 대관해 러시아 차르국이 됨
  mapNote: 지도에는 1283~1546년만 표시하고(블라디미르 대공위 땅은 1363년, 니즈니노브고로드는 1392년부터) 1547년부터는 러시아 차르국 항목(이름만 바뀜). 1503·1521년 병합의 명목 경계 밖 남쪽 들판(보로네시·벨고로드)과 모르드바 땅(1552년부터. 니즈니노브고로드주 남부 아르자마스 쪽 모르드바 땅도 같음), 노가이 오르다의 땅(1556년부터)은 칠하지 않음
  endNote: 1547년 이반 4세가 차르로 대관해 러시아 차르국이 됨
  features:
    - 이반 3세가 대페름(1472 원정)·노브고로드(1478)·트베리(1485)를 합침
    - 이반 3세는 1472년 소피아와 혼인하고 쌍두 독수리 문장을 쓰며 '전 루스의 군주'를 칭함
    - 1480년 우그라강 대치로 킵차크 칸국의 지배에서 벗어남
    - 1503년 휴전으로 리투아니아에게서 세베르스크 땅(체르니히우·노우호로드시베르스키·스타로두프·브랸스크)을 얻음
    - 바실리 3세가 프스코프(1510)·스몰렌스크(1514)·랴잔(1521)을 합침
  startEvents: [golden-horde-1242]
  endEvents: [ivan4-tsar-1547]
  basis:
    type: primary_source
    refs: ["1503년 모스크바-리투아니아 휴전", "1522년 휴전(스몰렌스크)", "1537년 모스크바 휴전(세베시)"]
    # 작업 메모: 작업 M3에서 1283년부터로 넓힘 / 정할 점 M2-④ / 작업 M2 / EUROPE_DRAFT.md 7.8 D3-⑨ / 작업 FIX3부터
    foundingNote: 다닐 알렉산드로비치가 모스크바 공이 된 1283년 무렵을 시작으로 봄

- id: kazan-khanate
  level: polity
  names: { ko: 카잔 칸국, en: Khanate of Kazan, native: Казан ханлыгы }
  from: 1438
  to: 1552
  color: "#b9a46a"
  summary: 킵차크 칸국에서 갈라져 나와 볼가강 가운데의 카잔을 중심으로 볼가 타타르·추바시·마리·우드무르트를 다스린 칸국. 모스크바와 크림 칸국이 칸의 자리를 두고 다투었고, 1552년 이반 4세가 카잔을 점령해 러시아에 합쳐짐
  mapNote: 지도에는 1438~1551년만 지금의 타타르스탄·추바시·마리엘·우드무르트·울랴노우스크주로 대략 표시(바시키르 서부는 칠하지 않음)
  endNote: 1552년 10월 이반 4세가 카잔을 함락해 러시아에 합쳐짐
  features:
    - 1487년 이반 3세가 카잔 칸국을 쳐 자기 편 칸을 세움
    - 모스크바와 크림 칸국이 칸의 자리를 두고 다툼
  startEvents: [golden-horde-breakup-1437]
  endEvents: [ivan4-tsar-1547]
  basis:
    type: primary_source
    refs: ["카잔 점령(1552)"]
    foundingNote: 울루그 무함마드가 카잔에 자리 잡은 1438년 무렵을 시작으로 봄

- id: astrakhan-khanate
  level: polity
  names: { ko: 아스트라한 칸국, en: Khanate of Astrakhan, native: Әстерхан ханлыгы }
  from: 1466
  to: 1556
  color: "#c7a678"
  summary: 볼가강 하구의 아스트라한(하지타르한)을 중심으로 한 칸국으로 킵차크 칸국(대오르다)의 뒤를 이음. 노가이 오르다·크림 칸국의 영향을 받다가 1556년 러시아에 합쳐짐
  mapNote: 지도에는 1466~1555년만(1453~1465년은 대오르다 땅) 지금의 아스트라한주와 칼미크 공화국(볼가강 서쪽 초원)으로 대략 표시
  endNote: 1556년 이반 4세가 아스트라한 칸국을 합쳐 러시아에 속하게 되었고, 러시아는 볼가강 전체를 차지하고 카스피해로 가는 길을 열음
  features:
    - 칸국을 세운 이는 마흐무드 또는 그의 아들 카심이라고 함
    - 1502년 대오르다가 사라진 뒤 그 땅은 크림 칸국과 노가이 오르다, 아스트라한 칸국이 나누어 차지해 감
    - 노가이 오르다·크림 칸국의 영향을 받음
  startEvents: [great-horde-1466]
  endEvents: [ivan4-tsar-1547]
  basis:
    type: primary_source
    refs: ["아스트라한 점령(1556)"]
    foundingNote: 칸국이 선 1466년 무렵을 시작으로 봄

- id: poland-kingdom
  level: polity
  names: { ko: 폴란드 왕국, en: Crown of the Kingdom of Poland, native: Korona Królestwa Polskiego }
  from: 1025
  to: 1569
  color: "#d98c8c"
  summary: 야기에우워 왕가의 왕이 리투아니아 대공을 겸한 왕국(왕관령). 대·소폴란드와 마조프셰(1526년 마지막 공작이 죽어 합쳐짐), 토룬 조약(1466)으로 얻은 왕령 프로이센, 르비우·포딜리아를 다스리고 프로이센 공국을 봉토로 둠. 1569년 루블린 연합으로 리투아니아 대공국과 합쳐 폴란드-리투아니아가 됨
  mapNote: 지도에는 1320~1568년만 표시하고(1320 재통일, 마조프셰는 1351년부터, 붉은 루스는 1349~1371·1387년부터. 왕령 프로이센은 1466년부터, 서포딜리아는 1430년부터) 1569년부터는 폴란드-리투아니아 항목(같은 색)
  endNote: 1569년 7월 루블린 연합으로 리투아니아 대공국과 합쳐 한 왕과 한 의회를 둔 폴란드-리투아니아 연방이 됨
  features:
    - 대·소폴란드와 마조프셰를 다스렸고 마조프셰는 1526년 마지막 공작이 죽어 합쳐짐
    - 토룬 조약(1466)으로 얻은 왕령 프로이센, 르비우·포딜리아도 다스림
    - 1525년 크라쿠프 조약으로 알브레히트가 폴란드 왕에게서 프로이센 공국을 봉토로 받음
