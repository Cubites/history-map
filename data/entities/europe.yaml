    foundingNote: 신성 로마 제국이 해체된 1806년부터 표시. 그전은 신성 로마 제국 묶음, 1814년부터는 독일 연방 국가들 묶음에 들어감

# 오스트리아(합스부르크)
- id: habsburg-monarchy
  level: polity
  names: { ko: 합스부르크 군주국, en: Habsburg Monarchy, native: Habsburgermonarchie }
  from: 1526
  to: 1804
  color: "#d6bd6e"
  summary: 합스부르크 왕가가 오스트리아·보헤미아·헝가리 등 여러 나라의 군주를 겸해 다스린 나라로 신성 로마 황제를 냄. 모하치 전투(1526) 뒤 페르디난트 1세가 보헤미아 왕관령과 헝가리 서부·북부(왕령 헝가리)·크로아티아를 얻고 동헝가리 왕국·오스만과 헝가리를 나눔(1538 너지바러드, 1547·1568 아드리아노플 조약). 1556년 카를 5세가 물러나며 에스파냐계와 갈라짐. 30년 전쟁 때 보헤미아 반란(1618~1620)을 누르고 프라하 평화 조약(1635)으로 라우지츠를 작센에 넘김. 17세기에는 헝가리 서부·북부(왕령 헝가리)만 다스렸으나 빈 포위(1683)를 물리친 대튀르크 전쟁 끝에 카를로비츠 조약(1699)으로 헝가리·트란실바니아·슬라보니아를 얻음. 에스파냐 왕위 계승 전쟁 뒤 위트레흐트·라슈타트 조약(1713~1714)으로 오스트리아령 네덜란드(벨기에)·밀라노·나폴리·사르데냐(1720년 시칠리아와 바꿈, 나폴리·시칠리아는 1735년 부르봉에 넘김)를 얻었고, 파사로비츠 조약(1718)으로 바나트를 얻음. 1740년 마리아 테레지아가 뒤를 이은 뒤 오스트리아 왕위 계승 전쟁으로 슐레지엔을 프로이센에 빼앗겼고(1742) 폴란드 분할(1772·1795)에 참여함. 프랑스 혁명 전쟁에서 벨기에·롬바르디아를 잃는 대신 베네치아·이스트리아·달마티아를 얻음(캄포포르미오 조약, 1797). 1804년 프란츠 2세가 오스트리아 황제를 칭함
  basis:
    type: primary_source
    refs: ["3차 폴란드 분할 조약(1795)", "캄포포르미오 조약(1797)", "뤼네빌 조약(1801)"]
    foundingNote: 페르디난트 1세가 보헤미아·헝가리 왕위를 얻은 1526년을 시작으로 봄. 지도에는 1526~1803년만 표시하고 1804년부터는 오스트리아 제국 항목

# 폴란드·발트
- id: polish-lithuanian-commonwealth
  level: polity
  names: { ko: 폴란드-리투아니아 연방, en: Polish–Lithuanian Commonwealth, native: Rzeczpospolita Obojga Narodów }
  from: 1569
  to: 1795
  color: "#d98c8c"
  summary: 폴란드 왕국과 리투아니아 대공국이 루블린 연합(1569)으로 합친 귀족 공화정의 나라. 리보니아 전쟁 끝에 얌자폴스키 휴전(1582)으로 리보니아를 지키고 벨리시를 얻음. 러시아 혼란 시대에 개입해 데울리노 휴전(1618)으로 스몰렌스크·세베르스크를 얻었으나 알트마르크 휴전(1629)으로 리보니아를 스웨덴에 넘겼고, 흐멜니츠키 봉기(1648)와 스웨덴의 침공(대홍수, 1655~1660)을 겪어 안드루소보 휴전(1667)으로 스몰렌스크·드니프로강 왼쪽 우크라이나·키이우를 러시아에 넘김. 부차치 조약(1672)으로 포딜리아를 오스만에 내줬다가 얀 3세 소비에스키가 빈 포위(1683)를 푼 뒤 카를로비츠 조약(1699)으로 되찾음. 18세기 초 대북방 전쟁의 싸움터가 되었고 작센 선제후를 겸한 아우구스트 2세·3세 때 러시아의 간섭이 커짐. 1772년 1차 분할 뒤 개혁을 꾀해 1791년 5월 3일 헌법을 만들었으나 러시아·프로이센의 2차 분할(1793)과 코시치우슈코 봉기(1794) 진압 뒤 러시아·프로이센·오스트리아의 3차 분할(1795)로 사라짐
  basis:
    type: primary_source
    refs: ["루블린 연합(1569)", "5월 3일 헌법(1791)", "2차 폴란드 분할 조약(1793)", "3차 폴란드 분할 조약(1795)"]
    foundingNote: 루블린 연합(1569)을 시작으로 봄. 지도에는 1569년부터 표시(그전은 폴란드 왕국·리투아니아 대공국 항목)

- id: courland
