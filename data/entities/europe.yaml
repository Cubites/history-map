    - 1572년 야기에우워 왕조가 끝나자 귀족이 모두 모여 왕을 뽑는 선거 왕정이 시작됨
    - 흐멜니츠키 봉기(1648)와 스웨덴의 침공을 겪어 안드루소보 휴전(1667)으로 스몰렌스크·키이우 등을 러시아에 넘김
    - 얀 3세 소비에스키가 빈 포위(1683)를 푼 뒤 카를로비츠 조약(1699)으로 포딜리아를 되찾음
    - 1772년 1차 분할 뒤 개혁을 꾀해 1791년 5월 3일 헌법을 만들었는데 유럽에서 처음 성문화된 근대 헌법으로 흔히 꼽힘
  startEvents: [lublin-union-1569]
