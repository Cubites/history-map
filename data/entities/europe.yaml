  endNote: 알레만인(506)·튀링겐 왕국(531)·프리지아인(689·719·734·785)이 차례로 프랑크 왕국에 들었고, 798년 프랑크 편에 선 오보드리트가 보른회베드에서 노르달빙기아의 작센인을 이김(작센인과의 싸움은 804년까지 이어졌으나 지도는 798년에서 끝냄). 덴마크 쪽은 덴마크 왕국(초기)으로 이어짐
  features:
