    type: national_institution
    refs: ["『고종실록』", "국사편찬위원회 『신편 한국사』", "야시 조약(1792)", "3차 폴란드 분할 조약(1795)", "프레드릭스함 조약(1809)", "부쿠레슈티 조약(1812)", "빈 회의 최종 의정서(1815)", "파리 조약(1856)", "베를린 조약(1878)", "아할 조약(1881)", "영러 아프가니스탄 국경 의정서(1887)"]
    foundingNote: 러시아 원로원이 표트르 1세에게 '전 러시아의 황제' 칭호를 바쳐 러시아 차르국이 제국이 된 1721년을 시작으로 봄

- id: soviet-union
  level: polity
  names: { ko: 소련, en: Soviet Union }
  from: 1917
  to: 1991
