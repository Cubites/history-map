  mapNote: 이탈리아의 여러 부족을 묶어 나타냄. 지도에 그린 첫 해(기원전 430년 무렵 헤로도토스)를 시작으로 둠. 지도에는 기원전 430~339년 라티나·프로시노네도(볼스키·헤르니키), 430~291년 사비니·삼니움·아브루초·피케눔, 430~318년 아풀리아, 430~273년 루카니아·브루티움(356 브루티이), 430~266년 메사피이, 430~397년 아게르 갈리쿠스(움브리아인), 424~339년 카푸아, 400~273년 포세이도니아(루카니아인), 시켈로이(헨나), 288~265년 마메르티니(메사나)를 표시
  endNote: 기원전 272년 타렌툼, 266년 메사피이가 로마의 동맹시가 되었고, 264년 로마가 남이탈리아까지 아울러 반도 대부분을 다스림
  features:
    - 리비우스는 삼니움인이 기원전 424년 무렵 카푸아를, 421년 무렵 쿠마이를 차지했다고 적음(4.37, 4.44)
    - 삼니움 전쟁(기원전 343~290)과 피로스 전쟁(280~275)을 치름
  startEvents: [herodotus-peoples-430bc]
  endEvents: [pyrrhic-war-280bc, first-punic-war-264bc]
  basis:
