# 독일과 국제 관리 지역
- id: weimar-republic
  level: polity
  names: { ko: 바이마르 공화국, en: Weimar Republic, native: Deutsches Reich }
  from: 1918
  to: 1933
  color: "#5f6f8f"
  summary: 1918년 11월 혁명으로 황제가 물러난 뒤 세운 독일의 민주 공화국(1919년 바이마르 헌법, 국호는 독일국). 베르사유 조약(1919)으로 알자스-로렌·포젠·서프로이센·북슐레스비히·오이펜-말메디를 잃고 단치히·메멜·자르는 국제 관리 아래 놓였으며 군비 제한과 배상금을 떠안음. 1923년 루르 점령과 초인플레이션, 1929년 세계 대공황을 겪고 1933년 1월 히틀러가 총리가 되며 무너짐
  mapNote: 1871~1918년은 독일 제국 항목. 1918년 지도는 법적 국경(1914년 국경)을 따르고, 베르사유 조약의 국경 변화는 1919년(서명)과 1920년(단치히·메멜·자르·북슐레스비히·오이펜-말메디)으로 나눔
  endNote: 대통령 긴급 명령에 기대는 내각이 이어지던 가운데 1933년 1월 힌덴부르크 대통령이 히틀러를 총리로 임명하면서 무너짐
  features:
    - 에베르트의 사회 민주당 정부가 군부와 손잡고 질서를 잡으며 1919년 1월 스파르타쿠스단의 봉기를 진압함
    - 바이마르 헌법은 국민 주권과 남녀 보통 선거, 사회권을 담았으나 대통령에게 긴급 명령권(48조)을 주는 약점도 있었음
    - 베르사유 조약(1919)으로 알자스-로렌·포젠·서프로이센·북슐레스비히·오이펜-말메디를 잃음
    - 단치히·메멜·자르는 국제 관리 아래 놓였고 군비 제한과 배상금을 떠안음
    - 1923년 루르 점령과 초인플레이션, 1929년 세계 대공황을 겪음
  startEvents: [armistice-1918, weimar-1919]
  endEvents: [nazi-seizure-1933]
  basis:
    type: primary_source
    refs: ["바이마르 헌법(1919)", "베르사유 조약(1919)", "로카르노 조약(1925)"]
    foundingNote: 공화국을 선포한 1918년 11월 9일을 시작으로 봄

- id: nazi-germany
