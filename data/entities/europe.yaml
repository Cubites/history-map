  mapNote: 지도에는 800~842년 표시. 그전 프랑크 왕국(481~799)도 지도에 그림
  endNote: 경건왕 루트비히가 죽은(840년) 뒤 아들들의 내전 끝에 843년 베르됭 조약으로 서프랑크·중프랑크·동프랑크로 나뉨
  features:
