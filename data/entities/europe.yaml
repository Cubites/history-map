- id: arsacid-armenia
  level: polity
  names: { ko: 아르메니아 왕국, en: Kingdom of Armenia, native: Մեծ Հայք }
  from: -330
  to: 428
  color: "#e0a040"
  summary: 오론테스·아르탁시아스·아르사케스 왕조가 차례로 다스린 대아르메니아 왕국. 기원전 189년 아르탁시아스 1세의 자립을 시작으로 보며, 티그라네스 2세 때 대왕을 칭했으나 로마에 항복함. 66년 티리다테스 1세가 로마에서 네로에게 왕관을 받았고 301년 무렵 그리스도교를 국교로 삼음. 387년 로마와 페르시아가 나눈 뒤 428년 폐위되어 페르시아의 마르즈판령이 됨
  details: 아르탁시아스 왕조(기원전 189~기원후 1 무렵)·로마와 파르티아가 세운 여러 왕(1~52)·파르티아 아르사케스 왕가의 방계(52/66~428)가 다스린 대아르메니아 왕국. 기원전 20년 티베리우스가 티그라네스 3세를 세운 뒤 로마와 파르티아가 왕위를 다퉜고, 63년 란데이아의 타협으로 아르사케스 왕가의 티리다테스 1세가 66년 로마에서 네로에게 왕관을 받음. 114~117년 트라야누스의 속주, 252년 무렵 샤푸르 1세가 차지함. 287년 티리다테스 3세가 디오클레티아누스의 도움으로 돌아와 301년 무렵 그리스도교를 국교로 삼았고, 298년 니시비스 조약으로 로마의 종주를 받음. 363년 요비아누스의 조약 뒤 페르시아와 로마 사이에서 흔들리다가 387년 테오도시우스 1세와 샤푸르 3세가 나눠 서쪽(카린)은 로마, 동쪽은 페르시아 종주 아래 왕국으로 남았고, 428년 아르탁세스 4세가 폐위되어 페르시아의 마르즈판령이 됨. 앞 시기에는 오론테스 왕조(기원전 331 무렵~200)가 셀레우코스의 종주 아래 다스렸고, 200년 안티오코스 3세가 장군 아르탁시아스·자리아드리스를 보냈다가 마그네시아(190) 뒤 둘이 왕을 칭함. 티그라네스 2세(95~55)가 소페네(95)·시리아와 킬리키아(83)를 차지해 대왕을 칭했으나 69년 티그라노케르타에서 루쿨루스에게 지고 66년 폼페이우스에게 항복함
  mapNote: 아르탁시아스 1세의 자립(기원전 189년)을 시작으로 봄(왕조가 바뀌어도 한 나라로 보아 앞선 오론테스 왕조부터 그림). 기원전 66~34년 로마의 종주. 지도에는 기원전 331~201년, 기원전 189~기원후 113년, 117~251년, 287~427년 표시. 기원전 331년(오론테스 2세의 자립)부터 201년까지 대아르메니아·소페네·티그리스강 위쪽(오론테스 왕조, 200~190년은 셀레우코스), 기원전 189~28년 대아르메니아와 189년부터 쿠라강 남쪽, 95년부터 소페네, 83~70년 시리아·킬리키아 평야·미그도니아(티그라네스 2세, 지도 범위 안 부분)를 표시. 기원전 27~기원후 251년 대아르메니아·소페네·아르자네네와 쿠라강 남쪽(우티크·아르차흐), 194년까지 아미다를 표시(114~116년은 로마 속주라 땅 없음, 252~286년은 사산의 아르메니아 왕이라 비움, 284~286년은 나르세). 287년 티리다테스 3세의 복위부터 387년까지 대아르메니아와 아르차흐·우티크·파이타카란(298~362년 남쪽 사트라피아는 로마), 387년 뒤 동쪽(페르시아 종주 아래)만 표시
