- id: spain
  level: polity
  names: { ko: 에스파냐, en: Spain, native: España }
  from: 1479
  to: null
  color: "#d8b04c"
  summary: 1479년 카스티야와 아라곤이 같은 왕(이사벨 1세·페르난도 2세) 아래 놓인 뒤 그라나다(1492)·나폴리(1501년 남부, 1504 리옹 조약)·나바라 남부(1512)를 얻음. 카를 5세(카를로스 1세)가 1535년 밀라노를 얻고 1556년 물러나며 아들 펠리페 2세가 에스파냐·이탈리아 땅과 네덜란드·프랑슈콩테(지도에서 1555년까지는 합스부르크령 네덜란드 항목)를 이음. 1580~1640년 포르투갈 왕을 겸함(동군연합, 지도에서는 따로 표시). 80년 전쟁 끝에 뮌스터 조약(1648)으로 네덜란드 공화국의 독립을 인정하고 피레네 조약(1659)으로 루시용·아르투아를, 네이메헌 조약(1678)으로 프랑슈콩테를 프랑스에 넘김. 에스파냐 왕위 계승 전쟁(1701~1714) 끝에 부르봉 왕가가 왕위를 잇는 대신 위트레흐트·라슈타트 조약(1713~1714)으로 네덜란드·밀라노·나폴리·시칠리아·사르데냐를 내놓고 지브롤터·메노르카를 영국에 넘김. 나폴레옹 전쟁 뒤 부르봉 왕가가 돌아왔으나 19세기 내내 혁명과 내전(카를로스 전쟁)이 이어짐. 1810~1820년대 아메리카 식민지 대부분이 독립하고 1898년 미국-에스파냐 전쟁으로 쿠바·필리핀 등을 잃음. 지도에는 유럽 본토와 카나리아 제도·세우타·멜리야만 표시. 1931년 제2공화국이 들어섰으나 1936~1939년 내전 끝에 프랑코의 독재가 세워짐(내전기 진영은 지도에 나누지 않음). 2차 대전에서는 중립을 지킴. 1975년 프랑코가 죽은 뒤 입헌 군주제로 민주화함
  basis:
    type: primary_source
    refs: ["빈 회의 최종 의정서(1815)", "파리 조약(1898)"]
    foundingNote: 카스티야와 아라곤이 합친 1479년을 시작으로 봄. 1453~1478년은 카스티야 왕국·아라곤 연합 왕국 항목(카스티야와 같은 색)

- id: portugal
