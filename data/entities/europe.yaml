- id: great-perm
  level: polity
  names: { ko: 대페름, en: Great Perm, native: Великая Пермь }
  from: 1324
  to: 1472
  color: "#a88fc4"
  summary: 카마강 위쪽(체르딘·솔리캄스크·포크차)의 코미-페르먀크 공국. 1471년까지 노브고로드에 형식상 종속되었고 1451년 모스크바의 바실리 2세가 미하일 예르몰라예비치를 공으로 세움. 1472년 이반 3세가 보낸 표도르 팔레츠키의 원정으로 모스크바 땅이 되었고(미하일 공은 대공의 신하로 남음), 1505년 모스크바가 바실리 코브로프를 총독으로 보냄. 그 남쪽 카마강·추소바야강 유역(페름·쿵구르·오사)은 1558년 이반 4세가 스트로가노프 가문에 개척 특허를 준 뒤 러시아 땅이 됨
  basis:
    type: primary_source
    refs: ["노브고로드 연대기(1324)", "1472년 대페름 원정 기록"]
    foundingNote: 노브고로드 연대기에 처음 나오는 1324년을 시작으로 봄. 1472년 원정 뒤는 모스크바 대공의 신하가 다스린 자치 단위라 정할 점 D4-③대로 모스크바 땅으로 봄. 지도에는 1324~1471년만 페름 지방 북부(쿠딤카르·솔리캄스크·체르딘)로 표시(작업 FIX1)

- id: north-caucasus-highlanders
  level: polity
  names: { ko: 북캅카스 산지 공동체 (묶음), en: North Caucasian highland communities (grouped), native: Горские общества Северного Кавказа }
  from: 1774
  to: 1859
  color: "#c4909c"
  summary: 1774년 퀴췩카이나르자 조약으로 카바르다가, 같은 해 오세티야 장로들의 합의로 북오세티야가 러시아에 넘어간 뒤에도 러시아에 들지 않은 체첸·인구시의 산지 공동체를 묶은 항목. 인구시는 1810년 일부 씨족이 러시아에 서약하고 나즈란 요새가 서며 러시아 땅이 됨(1858년 나즈란 봉기). 체첸은 1818년 그로즈니 요새가 섰으나 캅카스 전쟁(1817~1864) 동안 1840년부터 샤밀의 캅카스 이맘국(1828~1859)에 들었고, 1859년 샤밀이 항복해 러시아 땅이 됨
  basis:
    type: primary_source
    refs: ["퀴췩카이나르자 조약(1774)", "인구시 씨족의 서약 문서(1810)", "샤밀의 항복(1859)"]
    foundingNote: 지도에 나타나는 1774년을 시작으로 봄(그전 북캅카스 산지는 카바르다와 함께 비워 둠). 지도에는 1774~1809년 체첸(테레크강 남쪽)·인구시, 1810~1858년 체첸의 테레크강 남쪽만 표시(작업 FIX1, EUROPE_DRAFT.md 6절). 비워 두면 둘레가 러시아 땅이 된 1806년부터 생성기의 틈새 구멍 메우기가 러시아로 메우므로 묶음 항목을 둠

# ── 1918~1945년 유럽 뼈대 (작업 B1, 영토는 scripts/geo/areas/europe.mjs의 '1918~1945 조각 소유표') ──
# 1차 대전 뒤의 신생국, 전간기 국제 관리 지역, 2차 대전의 위성국·점령지(level: region, 색은 원래 나라의 색, relations.yaml의 occupied_by), 1945년 독일 점령 지구.
