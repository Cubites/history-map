  from: 922
  to: 1241
  color: "#b0c050"
  summary: 볼가강·카마강이 만나는 곳에 불가르인이 세운 이슬람 나라(수도 빌랴르·불가르). 모피와 은을 잇는 교역으로 번영했고, 1223년 칼카강 전투에서 돌아가던 몽골군을 쳤으나 1236년 가을 바투의 원정으로 빌랴르가 무너짐. 그 땅은 1242년부터 킵차크 칸국의 중심부가 됨
  mapNote: 아바스 왕조의 사절 이븐 파들란이 찾아와 이슬람을 받아들인 922년을 시작으로 봄(922~964년 하자르 칸국에 공납). 1236년 빌랴르가 무너진 뒤에도 몽골의 서방 원정은 그리지 않으므로 1241년까지 이 나라로 그리고, 1242년부터 킵차크 칸국. 지도에는 922~1241년 표시하고 1000년부터는 타타르스탄·추바시·울랴놉스크·사마라와 공납하던 마리·우드무르트를 대략 그림
  endNote: 1236년 가을 바투의 원정으로 빌랴르가 무너졌고, 그 땅은 1242년부터 킵차크 칸국의 중심부가 됨
