  mapNote: 여러 왕국을 묶어 그리되 주권 왕조는 종주를 받아도 따로 그림. 지도에는 885~1170년 표시(타론은 966년 동로마, 1021년까지 바스푸라칸(반·아으르), 1053년까지 아니·시라크(1045년 동로마 병합은 1054년에 묶은 근사), 1064년까지 카르스, 1117년까지 로리·타보시, 1170년까지 시우니크). 드빈 토후국 쪽(아라라트 평야)은 비움(근사)
  endNote: 1170년 시우니크 왕국이 셀주크 계열 세력에게 바게베르드 성을 잃고 끝남. 앞서 로리는 1118년 조지아에 합쳐짐
