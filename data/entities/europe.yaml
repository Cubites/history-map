    - 왕이 죽으면 말과 측근을 함께 묻은 큰 쿠르간을 쌓았고 짐승 모양의 금 장식(동물 양식)이 동쪽 초원까지 비슷하게 나타남
    - 기원전 513년 다레이오스 1세의 원정을 물리침(헤로도토스 4권, 이단티르소스 왕)
    - 기원전 4세기 아테아스가 도나우강 남쪽 도브루자까지 넓혔으나 339년 필리포스 2세에게 죽음
