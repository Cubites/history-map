    - 1913년 2차 발칸 전쟁에 져 남도브루자를 루마니아에 넘겼으나 서트라키아를 얻어 에게해에 닿음
    - 1차 대전에 동맹국으로 참전해 1919년 뇌이 조약으로 서트라키아·스트루미차를 잃음
    - 1940년 남도브루자를 되찾고 1941년 추축국에 가담해 마케도니아·서트라키아를 차지했으나 1944년 9월 소련군이 들어오며 내놓음
    - 1946년 왕정을 폐지하고 인민 공화국이 되었으며 1989년 공산 일당 체제가 끝남
  startEvents: [congress-of-berlin-1878]
  basis:
    type: primary_source
    refs: ["베를린 조약(1878)", "부쿠레슈티 조약(1913)", "뇌이 조약(1919)", "크라이오바 조약(1940)", "파리 강화 조약(1947)"]
    foundingNote: 베를린 조약으로 자치 공국이 된 1878년을 시작으로 봄. 중세 불가리아 제국은 따로 다룸

