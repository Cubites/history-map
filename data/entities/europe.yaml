  color: "#5fc0a0"
  summary: 제4차 십자군 뒤 미하일 1세 콤니노스 두카스가 아르타에 세운 그리스계 나라. 15세기에는 이탈리아계 토코 가문(카를로 1세)이 이오아니나(1411)·아르타(1416)를 다스렸고, 1430년 이오아니나가 오스만에 항복, 1449년 아르타를 잃은 뒤 아카르나니아(앙겔로카스트로 1460·보니차 1479)와 이오니아해 섬들(레프카다·케팔로니아·자킨토스)이 남았다가 1479년 무너짐
  mapNote: 지도에는 1205~1339년과 1356~1448년(1340~1347 동로마, 1348~1355 세르비아) 이피로스 지역(이오아니나 1429년까지, 아르타 1448년까지)만 표시. 아이톨리아·아카르나니아와 레프카다는 1405년(카를로 1세 토코의 본토 성들)부터 1459년(앙겔로카스트론 1460)·1478년(레프카다 1479)까지 이 나라로 그림(1411년 전 토코 가문은 케팔로니아 백작이라 근사)
  endNote: 1430년 이오아니나, 1449년 아르타를 오스만에 잃어 섬들과 몇몇 요새만 남았다가, 1479년 오스만 해군이 레프카다·케팔로니아·자킨토스를 다스리던 토코 가문의 레오나르도 3세를 몰아내 끝남
  features:
    - 에피루스의 테오도로스가 1224년 테살로니키를 빼앗아 테살로니키 왕국을 없앰
    - 15세기에는 이탈리아계 토코 가문(카를로 1세)이 이오아니나(1411)·아르타(1416)를 다스림
    - 1427년 에키나데스 해전에서 카를로 1세 토코가 모레아의 콘스탄티노스에게 졌고, 펠로폰네소스의 땅은 1428년 혼인 지참금으로 넘어감
  startEvents: [latin-greek-states-1204]
  endEvents: [venice-ottoman-war-1463]
  basis:
    type: primary_source
    refs: ["토코 연대기", "이오아니나의 시난 파샤 칙령(1430)"]
    # 작업 메모: 작업 M3에서 1205년부터로 넓힘 / 작업 M2 / 작업 FIX2 / 정할 점 FIX2-⑩
    foundingNote: 미하일 1세가 아르타에서 자립한 1205년을 시작으로 봄

- id: achaea
  level: polity
  names: { ko: 아카이아 공국, en: Principality of Achaea, native: Principauté d'Achaïe }
  from: 1205
  to: 1432
  color: "#d8c070"
  summary: 제4차 십자군 뒤 프랑스 기사들이 펠로폰네소스 북서부에 세운 라틴 공국. 1404년부터 제노바계 첸투리오네 2세 차카리아가 다스렸으나 모레아 전제공국에 땅을 잃어, 1429~1430년 파트라스·글라렌차가 넘어가고 1432년 그가 죽어 끝남
  mapNote: 지도에는 1205~1319년 펠로폰네소스 대부분, 1320~1429년 아하이아·일리아만 표시하고(메시니아의 성들은 모레아째 근사) 1430년부터 동로마 제국(모레아 전제공국) 땅
  endNote: 모레아 전제공국에 땅을 잃어 1429~1430년 파트라스·글라렌차가 넘어갔고, 1432년 첸투리오네 2세 차카리아가 죽어 끝남
  features:
    - 기욤 드 샹플리트와 빌라르두앵의 조프루아가 모레아를 정복함(1205~1209년 무렵)
    - 1404년부터 제노바계 첸투리오네 2세 차카리아가 다스림
  startEvents: [latin-greek-states-1204]
  endEvents: [morea-despotate-1427]
  basis:
    type: primary_source
    refs: ["모레아 연대기", "스프란체스, 『연대기』"]
    # 작업 메모: 작업 M3에서 1205년부터로 넓힘 / 작업 M2 / 작업 M1
    foundingNote: 기욤 드 샹플리트가 펠로폰네소스를 정복한 1205년을 시작으로 봄

- id: anatolian-beyliks
  level: polity
  names: { ko: 아나톨리아 베이국들 (묶음), en: Anatolian beyliks (grouped), native: Anadolu beylikleri }
  from: 1277
  to: 1429
  color: "#c49ac8"
  summary: 룸 셀주크가 약해진 뒤 아나톨리아 서부에 선 튀르크 베이국들(게르미얀·아이든·사루한·멘테셰·테케·하미드 등)을 묶은 항목. 1390년대 바예지트 1세가 병합했으나 1402년 앙카라 전투 뒤 티무르가 되살렸고, 오스만이 사루한(1410)·테케와 하미드(1423)·멘테셰(1424)·아이든(1425)·게르미얀(1429)을 다시 합침
  mapNote: 카라만·잔다르는 따로 항목. 지도에는 1277~1299년 아나톨리아 서부·남서부와 흑해 쪽 시노프·삼순·오르두(1282 카리아의 멘테셰, 1285 아이든주의 트랄레스, 1292 카스타모누·찬크르·볼루의 차반 가문(1309년까지, 그 뒤 잔다르), 1299 카레시), 1300~1397년(1304 에페소스의 이즈미르주·1313 마니사주의 이오니아·리디아는 그전 동로마. 1309년 카스타모누·찬크르·볼루는 잔다르로. 1345 카레시, 1390 서아나톨리아 베이국들, 1398 카니크가 오스만)과 1402~1428년만 표시
  endNote: 오스만이 사루한(1410)·테케와 하미드(1423)·멘테셰(1424)·아이든(1425)을 다시 합치고, 1429년 게르미얀이 마지막 베이 야쿱 2세의 유언으로 오스만에 들어옴
  features:
    - 몽골의 군정과 압박을 피한 투르크멘 유목민이 서쪽 변경으로 밀려들어 동로마 땅 쪽에 자리 잡음
    - 14세기 초 멘테셰·아이든·사루한·게르미얀·카라시 같은 베이국이 에게해 연안과 마이안드로스 골짜기까지 이름(이름과 성립 연도는 자료마다 다름)
    - 1390년대 바예지트 1세가 병합했으나 1402년 앙카라 전투 뒤 티무르가 되살림
  startEvents: [rum-sultanate-1204]
  endEvents: [murad2-anatolia-1421]
  basis:
    type: primary_source
    refs: ["아시크파샤자데, 『오스만 왕가사』", "이븐 바투타, 『여행기』"]
    # 작업 메모: 작업 M3 / 작업 FIX3 / 작업 M3·FIX3 / 작업 FIX3 / 작업 M2 / 작업 M1 / 정할 점 M1-⑤ / (전에는 1300년 무렵)
    foundingNote: 1277년 맘루크 바이바르스의 원정과 지므리의 난 뒤 서부 변경 베이국들(게르미얀·사히브 아타·이난즈·하미드·페르바네)이 자립한 해를 시작으로 봄

- id: albanian-principalities
  level: polity
  names: { ko: 알바니아·제타 영주국들 (묶음), en: Albanian and Zetan principalities (grouped), native: Principatat shqiptare }
  from: 1355
  to: 1444
  color: "#6f8fc0"
  summary: 세르비아 제국이 무너진 뒤 알바니아와 제타(몬테네그로)에 선 영주국들(발시치의 제타, 토피아·카스트리오티·두카기니·아리아니티·제네비시 등)을 묶은 항목. 많은 영주가 오스만에 공물을 바쳤고 1415년 크루여, 1417~1419년 남부가 오스만의 알바니아 산자크가 됨. 제타는 1421년 발샤 3세의 유언으로 세르비아 전제공국에, 중북부는 1444년 스칸데르베그의 레저 동맹으로 이어짐
  mapNote: 지도에는 1356~1443년만 표시(크루여·티라나는 1414년까지, 남부는 1416년까지, 제타는 1422년까지(1421 유언), 코토르·바르 해안은 1419년까지). 베네치아의 두러스는 두러스주째 둔 근사
  endNote: 제타는 1421년 발샤 3세의 유언으로 세르비아 전제공국에 넘어갔고, 중북부는 1444년 3월 알바니아 귀족들이 레저에서 스칸데르베그를 지도자로 세운 레저 동맹으로 이어짐
  features:
    - 1359년 에피루스의 니케포로스 2세 오르시니가 알바니아인과 싸우다 죽은 뒤 에피루스가 알바니아 영주들(로샤·부아 가문)과 시메온에게 갈라짐
    - 많은 영주가 오스만에 공물을 바쳤고 1415년 크루여, 1417~1419년 남부가 오스만의 알바니아 산자크가 됨
    - 카스트리오티 가문의 게르기는 오스만 궁정에 인질로 보내져 이스칸데르 베이(스칸데르베그)라는 이름의 오스만 장군이 됨
  startEvents: [dusan-empire-1330]
  endEvents: [skanderbeg-1443]
  basis:
    type: primary_source
    refs: ["베네치아 원로원 기록(『알바니아 문서집』)", "오스만 알바니아 산자크 조세 대장(1431~1432)"]
    # 작업 메모: 작업 M1 / 정할 점 M1-⑧ / 지도에는 1355~
    foundingNote: 세르비아의 스테판 두샨이 죽은 1355년을 시작으로 봄

- id: terra-mariana
  level: polity
  names: { ko: 테라 마리아나 (리보니아 묶음), en: Terra Mariana (Livonia grouped), native: Terra Mariana }
  from: 1207
  to: 1422
  color: "#c8c8d8"
  summary: 북방 십자군이 세운 리보니아의 교회령과 기사단령(리보니아 기사단·리가 대주교령·도르파트·외셀비크·쿠를란트 주교령)을 묶은 항목. 1346년 덴마크령 에스토니아를 튜턴 기사단이 사들임. 1422년 발크 의회부터 리보니아 연맹으로 이어짐
  mapNote: 지도에는 1207~1421년만(1207년 리보니아, 1214 라트갈레, 1224 남에스토니아, 1227~1237 북에스토니아, 1254 메멜, 1267 쿠를란트, 1290 젬갈레, 1346년부터 덴마크령 에스토니아 포함) 표시하고 1422년부터는 리보니아 연맹 항목(같은 색)
  endNote: 기사단·주교·도시가 15세기 초부터 발크에서 신분 의회를 열었고, 1422년 발크 의회부터 리보니아 연맹으로 이어짐
  features:
    - 1202년 알베르트 주교를 돕는 검의 형제 기사단이 생겨 리보니아인·라트갈레인·셈갈레인을 정복하고 개종시킴
    - 1236년 사울레 전투에서 검의 형제 기사단이 리투아니아·셈갈레 연합군에게 크게 졌고, 이듬해 튜턴 기사단의 리보니아 지부로 합쳐짐
    - 1238년 슈텐스뷔 조약으로 에스토니아 북부는 덴마크가, 나머지는 기사단이 갖기로 함
    - 1346년 덴마크령 에스토니아를 튜턴 기사단이 사들임
  startEvents: [baltic-crusade-1202]
  endEvents: [melno-1422]
  basis:
    type: primary_source
    refs: ["리보니아 운문 연대기", "헨리크의 리보니아 연대기"]
    # 작업 메모: 작업 M3에서 1207년부터로 넓힘 / 작업 M2 / 정할 점 M1-⑱
    foundingNote: 교황이 리보니아를 성모의 땅(테라 마리아나)으로 정한 1207년을 시작으로 봄

- id: savoy-county
  level: polity
  names: { ko: 사보이아 백국, en: County of Savoy, native: Comté de Savoie }
  from: 1003
  to: 1416
  color: "#58a070"
  summary: 알프스 양쪽(사부아·피에몬테·보·니스)을 아우른 사보이아 가문의 백국. 1388년 니스 백작령, 1401년 제네바 백작령을 더했고 1416년 지기스문트 황제가 아메데오 8세를 공작으로 올려 사보이아 공국이 됨
  mapNote: 지도에는 1033~1415년만(1388 니스) 표시하고 1416년부터는 사보이아 공국 항목(같은 색)
  endNote: 1416년 2월 지기스문트가 샹베리에서 사보이아 백작 아메데오 8세를 공작으로 올려 사보이아 공국이 됨
  features:
    - 움베르토 1세 비앙카마노가 모리엔·샤블레를 모음
    - 1033년 콘라트 2세가 부르군트 왕으로 대관한 뒤 아를 왕국은 이름만 남고 실제 정치는 사보이아 같은 지방 단위로 돌아감
    - 1388년 니스 백작령, 1401년 제네바 백작령을 더함
  startEvents: [arles-burgundy-1003]
  endEvents: [constance-1414]
  basis:
    type: primary_source
    refs: ["지기스문트 황제의 공국 승격 문서(1416)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1033년부터로 넓힘 / 작업 M2 / 정할 점 M1-⑱
    foundingNote: 움베르토 1세가 처음 기록에 나오는 1003년을 시작으로 봄

- id: brankovic-lands
  level: polity
  names: { ko: 브란코비치 영지 (부크의 땅), en: Branković lands (District of Branković), native: Област Бранковића }
  from: 1371
  to: 1412
  color: "#d9a0c0"
  summary: 세르비아 제국이 무너진 뒤 부크 브란코비치가 코소보(프리슈티나·부치트른·노보브르도)와 시에니차·노비파자르 쪽을 다스린 영지. 1392년부터 오스만의 봉신이었고, 부크가 죽은(1397) 뒤 아들 주라지·그르구르가 이었으나 라자레비치의 스테판과 다투다가 1412년 주라지가 스테판과 화해해 세르비아 전제공국 편이 되었고 1427년 주라지가 전제공을 이음
  mapNote: 지도에는 1371~1411년만 표시하고 1412년부터는 세르비아 전제공국과 같은 색
  endNote: 1412년 주라지가 라자레비치의 스테판과 화해해 영지가 세르비아 전제공국 편이 됨. 1427년 주라지가 전제공을 이음
  features:
    - 라자르의 사위 부크 브란코비치는 1389년 코소보 전투에서 라자르 쪽에 있었음
    - 코소보 전투 뒤 한동안 버티던 부크는 오스만의 신하가 되었고 1392년부터 봉신이었음
    - 1397년 부크가 죽은 뒤 아들 주라지·그르구르가 이었으나 라자레비치의 스테판과 다툼
  startEvents: [ottoman-rumelia-1354]
  endEvents: [serbian-despotate-1402]
