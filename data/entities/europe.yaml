  basis:
    type: primary_source
    refs: ["1461년 메흐메트 2세의 시노프 접수"]
    foundingNote: 잔다르 베이가 카스타모누를 받은 1292년 무렵을 시작으로 봄. 지도에는 1300~1460년(1300~1391년은 카스타모누·찬크르·사프란볼루와 1324년부터 시노프, 작업 M2) 카스타모누·시노프만 표시(1400~1401년은 바예지트 1세에게 카스타모누를 잃어 시노프만, 1402~1416년 찬크르 포함, 작업 M1)

- id: dulkadir-beylik
  level: polity
  names: { ko: 둘카디르 베이국, en: Dulkadirid Beylik, native: Dulkadiroğulları Beyliği }
  from: 1337
  to: 1522
  color: "#8fa7c9"
  summary: 아나톨리아 남동부 마라시·엘비스탄의 튀르크멘 베이국으로 오랫동안 맘루크 술탄국의 종주를 받으며 오스만과 다툼. 1515년 투르나다으 전투에서 셀림 1세가 알라위데블레 베이를 죽이고 알리 베이를 세워 오스만의 종주 아래 두었고, 1522년 알리 베이가 처형된 뒤 오스만에 합쳐짐
  basis:
    type: primary_source
    refs: ["1515년 셀림 1세의 둘카디르 원정 기록"]
    foundingNote: 카라자 베이가 엘비스탄에 자리 잡은 1337년을 시작으로 봄. 지도에는 오스만 종주 아래 있던 1515~1521년만 카라만마라시주로 표시(맘루크 종속기는 종주국을 그리지 않아 비움, EUROPE_DRAFT.md 7.9 D4-③·⑪)

