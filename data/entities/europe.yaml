  basis:
    type: primary_source
    refs: ["몬테네그로 독립 국민 투표(2006)", "몬테네그로 독립 선언(2006)"]
    foundingNote: 독립을 선언한 2006년 6월 3일을 시작으로 봄

- id: kosovo-un
