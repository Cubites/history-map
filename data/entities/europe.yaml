- id: finnic-tribes
  level: polity
  names: { ko: 핀우그르 부족 (묶음), en: Finnic tribes (grouped) }
  from: 98
  to: 1248
  color: "#c8a8e8"
  summary: 나라를 이루지 않은 핀계 부족들(에스토니아인과 핀란드의 하메(타바스티아)인·사보인, 오스트로보트니아·라플란드의 사미인)을 묶은 항목. 에스토니아는 1208~1227년 검의 형제 기사단과 덴마크에, 핀란드는 1249년(하메)과 1293년(카렐리아) 스웨덴의 원정으로 정복됨
  mapNote: 타키투스 『게르마니아』(98)에 나오는 펜니를 시작으로 봄. 핀란드 남서부는 1216년부터 스웨덴. 여러 핀우그르 부족을 묶어 그림. 지도에는 98~1248년 표시(284~475년은 476년과 같은 땅, 노브고로드·랴잔 쪽은 700년까지, 메랴·무로마·베스는 862년까지, 카렐리야·라도가호 동쪽(카렐리아인·베프스인)은 1135년까지(1136 노브고로드), 에스토니아는 1226년까지, 핀란드 하메는 1248년까지). 오스트로보트니아·사보·카이누·라플란드와 스웨덴 노를란드 북부(베스테르보텐·노르보텐의 사미·크벤 땅)는 부족으로 채우지 않고 비움
  endNote: 1249년 스웨덴의 원정(연대기에 따르면 비르예르 야를의 십자군, 연도는 불확실)으로 핀란드의 하메가 정복되며 끝남. 카렐리아는 1293년 정복됨
  features:
    - 에스토니아는 1208~1227년 검의 형제 기사단과 덴마크에 정복되었고 덴마크는 1219년 린다니세(오늘의 탈린)에 상륙함
    - 에스토니아인이 1223년 크게 일어났으나 진압됨
  startEvents: [tacitus-germania-98]
  endEvents: [baltic-crusade-1202, sweden-finland-1248]
  basis:
    type: primary_source
    refs: ["리보니아의 하인리히, 『리보니아 연대기』", "『에리크 연대기』"]
    # 작업 메모: (정할 점 M-③) / (작업 M3) / (M3_OPT.finlandSW) / 작업 FIX3(운영자 결정 2026-10-07, M-③)에서 오스트로보트니아·사보·카이누·라플란드와 스웨덴 노를란드 북부(베스테르보텐·노르보텐의 사미·크벤 땅)는 부족으로 채우지 않고 비움(전에는 사보·오스트로보트니아·카이누·라플란드를 1292년까지, 노를란드 북부를 1276년까지 표시) / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 800년부터로 넓히고 시작 해를 800으로 앞당김(메랴·무로마·베스는 862년까지, 카렐리야·라도가호 동쪽은 999년까지) / 작업 M6에서 476년부터로 넓히고 시작 해를 476으로 앞당김(노브고로드·랴잔 쪽은 700년까지, 정할 점 M6-⑭) / 작업 FIX4에서 카렐리야·라도가호 동쪽(카렐리아인·베프스인)을 1135년까지로 늘림(1136 노브고로드, 전에는 999년까지) / 작업 AN1에서 284년부터로 넓히고 시작 해를 284로 앞당김(타키투스의 펜니, AN-⑧, 476년 표와 같은 땅) / 작업 AN2에서 98년부터로 넓히고 시작 해를 98(타키투스 『게르마니아』의 펜니)로 앞당김(AN-⑧)
    foundingNote: 타키투스 『게르마니아』(98)에 나오는 펜니를 시작으로 봄

- id: welsh-principalities
  level: polity
  names: { ko: 웨일스 공국들 (묶음), en: Welsh principalities (grouped), native: Tywysogaeth Cymru }
  from: 410
  to: 1283
  color: "#3fa060"
  summary: 잉글랜드에 정복되기 전 웨일스 사람 군주들의 공국(귀네드·포이스·데헤우바르스)을 묶은 항목. 귀네드의 대(大)르웰린(1195~1240)이 웨일스 대부분을 이끌었고, 손자 르웰린 압 그루피드가 1267년 몽고메리 조약으로 '웨일스 대공'으로 인정받았으나 1277년 아베르콘위 조약으로 땅을 잃고, 1282년 12월 전사한 뒤 1283년 동생 다피드가 잡혀 에드워드 1세에게 정복됨(1284 러들란 법령)
  mapNote: 로마가 떠난 410년을 시작으로 봄. 남웨일스의 변경 영주 땅(펨브룩·글러모건·그웬트)은 잉글랜드. 잉글랜드 왕에게 신서함. 웨일스의 여러 공국을 묶어 그림. 지도에는 410~1282년 표시(맨섬은 872년까지 포함, 800년부터 웨일스 왕국들, 1000년부터 앵글시·귀네드·콘위·포이스·렉섬·케레디기온·카마던과 1276년까지 덴비·플린트)
  endNote: 1282년 12월 르웰린이 전사하고 1283년 동생 다피드가 잡혀 에드워드 1세에게 정복됨. 1284년 러들란 법령으로 웨일스 북서부에 주가 설치되어 잉글랜드법이 적용됨
  features:
    - 귀네드의 대(大)르웰린(1195~1240)이 웨일스 대부분을 이끎
    - 손자 르웰린 압 그루피드가 1267년 몽고메리 조약으로 헨리 3세에게 '웨일스 대공'으로 인정받음
    - 에드워드 1세가 1277년 군대를 보내 르웰린을 귀네드 서북부로 몰아넣고 아베르콘위 조약으로 땅을 잃게 함
  startEvents: [britain-end-407]
  endEvents: [wales-1277]
  basis:
    type: primary_source
    refs: ["『브뤼트 이 티위소기온』(웨일스 군주 연대기)", "몽고메리 조약(1267)", "아베르콘위 조약(1277)"]
    # 작업 메모: (정할 점 M-③) / (작업 M3) / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 800년부터로 넓히고 시작 해를 800으로 앞당김(웨일스 왕국들과 맨섬(872년까지)) / 작업 M6에서 476년부터로 넓히고 시작 해를 476으로 앞당김(맨섬 포함) / 작업 AN1에서 410년부터로 넓히고 시작 해를 410(로마가 떠난 해)으로 앞당김(맨섬 포함) / 잉글랜드 왕에게 신서한 관계는 relations.yaml
    foundingNote: 로마가 떠난 410년을 시작으로 봄

