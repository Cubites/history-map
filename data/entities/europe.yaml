  to: 1701
  color: "#5f6f8f"
  summary: 호엔촐레른 가문의 브란덴부르크 선제후가 프로이센 공국(1657년 벨라우 조약으로 폴란드의 봉토에서 벗어남)과 라인강 쪽 클레베·마르크(1614년 크산텐 조약), 포메른·민덴·할버슈타트(1648년 베스트팔렌 조약)·마그데부르크(1680)를 함께 다스린 나라. 1701년 1월 프리드리히 3세가 쾨니히스베르크에서 '프로이센에서의 왕(König in Preußen)' 프리드리히 1세로 즉위해 프로이센 왕국이 됨
  basis:
    type: primary_source
    refs: ["벨라우 조약(1657)", "베스트팔렌 조약(1648)"]
    foundingNote: 브란덴부르크 선제후가 프로이센 공국을 이어받은 1618년을 시작으로 봄. 지도에는 1618~1700년을 표시하고(그전 브란덴부르크 선제후령은 신성 로마 제국 묶음, 프로이센 공국은 따로 항목) 1701년부터는 프로이센 왕국 항목

- id: savoy
  level: polity
  names: { ko: 사보이아 공국, en: Duchy of Savoy, native: Ducato di Savoia }
  from: 1416
  to: 1720
  color: "#78a67e"
  summary: 알프스 양쪽의 사보이아·니스·피에몬테를 다스린 공국. 1601년 리옹 조약으로 브레스·뷔제·젝스를 프랑스에 넘기고 살루초를 얻음. 에스파냐 왕위 계승 전쟁에서 반프랑스 동맹 편에 서서 위트레흐트 조약(1713)으로 시칠리아 왕국과 밀라노 서부(알레산드리아·발렌차)를 얻음. 1718~1720년 4국 동맹 전쟁 뒤 헤이그 조약(1720)으로 시칠리아를 오스트리아에 넘기고 사르데냐를 받아 사르데냐 왕국이 됨
  basis:
    type: primary_source
    refs: ["위트레흐트 조약(1713)", "헤이그 조약(1720)"]
    foundingNote: 신성 로마 황제가 사보이아 백작을 공작으로 올린 1416년을 시작으로 봄. 1713~1720년 비토리오 아메데오 2세는 시칠리아 왕을 겸함. 지도에는 1416년 이후만 표시하고(1536~1559년 프랑스의 사부아·피에몬테 점령은 그리지 않음) 1720년부터는 사르데냐 왕국 항목

- id: lorraine
  level: polity
  names: { ko: 로렌 공국, en: Duchy of Lorraine, native: Duché de Lorraine }
  from: 959
  to: 1766
  color: "#d0a37a"
  summary: 프랑스와 신성 로마 제국 사이의 공국(바르 공국 포함). 30년 전쟁 중(1634~1661)과 1670~1697년 프랑스에 점령됨(지도에서는 공국으로 표시). 1697년 레이스베이크 조약으로 레오폴트 공작이 되찾았으나 에스파냐 왕위 계승 전쟁 중(1702~1714) 프랑스군이 점령함. 폴란드 왕위 계승 전쟁 뒤 빈 조약(1738)으로 공작 프란츠 슈테판은 토스카나를 받고, 로렌은 루이 15세의 장인 스타니스와프 레슈친스키가 평생 다스린 뒤 1766년 프랑스에 합쳐짐
  basis:
    type: primary_source
    refs: ["레이스베이크 조약(1697)", "빈 조약(1738)"]
    foundingNote: 상로렌 공국이 선 959년을 시작으로 봄. 지도에는 1300년 이후만 표시(1475~1476년 부르고뉴의 점령은 그리지 않음)하고 지금의 뫼르트에모젤·뫼즈·모젤·보주 4개 도로 그림(안의 프랑스령 메스·툴·베르됭 세 주교령(1552)과 티옹빌·몽메디(1659)는 대략 상자로 떼어 프랑스로 그림)

- id: russia-tsardom
  level: polity
  names: { ko: 러시아 차르국, en: Tsardom of Russia, native: Русское царство }
  from: 1547
  to: 1721
  color: "#6f8f6f"
  summary: 모스크바 대공 이반 4세가 차르를 칭하며 시작된 나라. 카잔(1552)·아스트라한(1556) 칸국을 합치고 노가이·바시키르를 신속시켰으며 1558년 스트로가노프 가문에 카마강 유역(페름 지방 남부) 개척 특허를 줌. 리보니아 전쟁(1558~1583)에서는 얻은 땅을 내놓음. 예르마크의 원정(1582) 뒤 튜멘(1586)·토볼스크(1587)를 세워 시베리아로 나아감. 혼란 시대(1598~1613) 뒤 로마노프 왕조가 서고 스톨보보 조약(1617)으로 잉그리아·케크스홀름을 스웨덴에, 데울리노 휴전(1618)으로 스몰렌스크·세베르스크를 폴란드에 넘겼으나, 페레야슬라우 회의(1654)로 코사크 헤트만국을 보호 아래 두고 안드루소보 휴전(1667)으로 스몰렌스크·드니프로강 왼쪽 우크라이나·키이우를 얻음. 표트르 1세(재위 1682~1725)가 서유럽식 개혁을 펼치고 대북방 전쟁(1700~1721)에서 스웨덴을 이겨 1703년 상트페테르부르크를 세우고(1712년 수도) 발트해 연안을 얻음. 1721년 뉘스타드 조약 뒤 표트르가 황제를 칭해 러시아 제국이 됨. 시베리아로 나아가 네르친스크 조약(1689)으로 청과 국경을 정했고, 그 앞서 청의 요청으로 조선 조총군이 흑룡강에서 러시아군과 싸움(나선 정벌, 1654·1658)
  basis:
    type: primary_source
    refs: ["네르친스크 조약(1689)", "뉘스타드 조약(1721)", "『효종실록』"]
    foundingNote: 이반 4세가 차르로 대관한 1547년을 시작으로 봄. 지도에는 1547년 이후만 표시하고(그전은 모스크바 대공국 항목, 같은 색) 1721년부터는 러시아 제국 항목. 유럽 밖(시베리아)은 요새를 세운 해에 따라 단계로 넓힌 손 도형의 대략적인 추정(1689년 전 아무르강 유역과 카자흐 초원·중앙아시아는 칠하지 않음)

- id: crimean-khanate
  level: polity
  names: { ko: 크림 칸국, en: Crimean Khanate, native: Qırım Hanlığı }
  from: 1441
  to: 1783
  color: "#d8b86a"
  summary: 킵차크 칸국에서 갈라져 나온 기레이 왕조의 나라로 1478년부터 오스만 제국의 종주권 아래 크림반도와 흑해 북쪽 노가이 초원(쿠반 포함)을 다스림. 프루트 조약(1711)·아드리아노플 조약(1713)으로 러시아 국경이 사마라강까지 물러난 뒤 1739년 베오그라드 조약까지는 드니프로강 양쪽의 자포로자 코사크 땅(시치는 1711~1734년 칸국 보호 아래 올레시키로 옮김)도 칸국 쪽이었음. 러시아-튀르크 전쟁 뒤 퀴췩카이나르자 조약(1774)으로 오스만에게서 독립했으나 러시아의 간섭을 받았고, 1783년 예카테리나 2세가 병합함
  basis:
    type: primary_source
    refs: ["퀴췩카이나르자 조약(1774)", "예카테리나 2세의 크림 병합 선언(1783)"]
    foundingNote: 하지 1세 기레이가 칸을 칭한 1441년을 시작으로 봄. 지도에는 1441년 이후만 표시하고(1475년까지 크림반도 남동 기슭은 제노바의 가자리아, 1486년부터 예디산은 오스만, 1492년부터 부크강 동쪽(오차키우) 들판, 1502년 대오르다가 무너진 뒤 쿠반·스타브로폴 초원), 본토의 노가이 초원은 자포리자주 남부·헤르손주·쿠반강 북쪽·스타브로폴 지방으로 대략 그림

# ── 1600~1699년 유럽 뼈대 (작업 D2, 영토는 scripts/geo/areas/europe.mjs의 '1600~1699 조각 소유표') ──
# 1700~1788년 항목 가운데 이 시기에도 있던 나라는 영토를 1600년부터로 넓혔다(브란덴부르크-프로이센은 1618년부터, 몬테네그로는 1696년부터).
# 프로이센 공국·트란실바니아 공국·코사크 헤트만국은 새 항목. 근거와 정할 점은 docs/EUROPE_DRAFT.md의 '작업 D 계획'(운영자 승인 2026-10-06: 추천안)
- id: ducal-prussia
  level: polity
  names: { ko: 프로이센 공국, en: Duchy of Prussia, native: Herzogtum Preußen }
  from: 1525
  to: 1618
  color: "#7d8aa6"
  summary: 튜턴 기사단 단장 알브레히트가 루터파로 바꾸며 기사단국을 세속 공국으로 만든 나라로 폴란드 왕의 봉토였음(수도 쾨니히스베르크). 1618년 브란덴부르크 선제후 요한 지기스문트가 공작 자리를 이어받아 브란덴부르크-프로이센이 되었고, 1657년 벨라우 조약으로 폴란드의 봉토에서 벗어남
  basis:
    type: primary_source
    refs: ["크라쿠프 조약(1525)", "벨라우 조약(1657)"]
    foundingNote: 크라쿠프 조약으로 공국이 선 1525년을 시작으로 봄. 지도에는 1525~1617년만 표시하고(1453~1524년은 튜턴 기사단국 항목, 같은 색)(동프로이센, 지금의 칼리닌그라드주와 바르미아마주리주 대부분·클라이페다 남부) 1618년부터는 브란덴부르크-프로이센 항목

- id: transylvania
  level: polity
  names: { ko: 트란실바니아 공국, en: Principality of Transylvania, native: Erdélyi Fejedelemség }
  from: 1570
  to: 1711
  color: "#8db1d6"
  summary: 모하치 전투(1526) 뒤 헝가리 동부에 선 공국으로 오스만의 종주권 아래 자치를 누림. 트란실바니아 본토와 헝가리 동부의 파르티움(비하르·마러머로시 등)을 다스렸고, 베틀렌 가보르(니콜스부르크 조약 1622)와 라코치 죄르지 1세(린츠 조약 1645)는 헝가리 북동부 7개 주를 평생 받음. 라코치 죄르지 2세의 폴란드 원정(1657)이 실패한 뒤 오스만에 버러드(오라데아, 1660)를 빼앗김(버슈바르 조약 1664). 대튀르크 전쟁 중 블라지 조약(1687)으로 합스부르크군이 들어오고 레오폴트 칙서(1691)로 합스부르크의 다스림을 받았으며, 카를로비츠 조약(1699)으로 합스부르크 땅이 됨. 라코치 페렌츠 2세의 독립 전쟁(1703~1711)이 실패한 뒤 대공국으로 합스부르크에 남음
  basis:
    type: primary_source
    refs: ["슈파이어 조약(1570)", "니콜스부르크 조약(1622)", "린츠 조약(1645)", "버슈바르 조약(1664)", "레오폴트 칙서(1691)", "카를로비츠 조약(1699)"]
    foundingNote: 야노시 지그몬드가 헝가리 왕 칭호를 내놓고 트란실바니아 공이 된 슈파이어 조약(1570)을 시작으로 봄. 지도에는 1570~1698년만 표시하고(1526~1569년은 동헝가리 왕국 항목, 같은 색) 1699년부터는 합스부르크 군주국의 땅으로 그림. 1598·1602년 지그몬드 바토리가 공국을 루돌프 2세에게 넘긴 것은 의회가 받아들이지 않았고 1606년 빈 조약이 공국을 인정해 처음부터 공국으로 그림

- id: cossack-hetmanate
  level: polity
  names: { ko: 코사크 헤트만국, en: Cossack Hetmanate, native: Гетьманщина }
  from: 1649
  to: 1764
  color: "#4f86b0"
  summary: 보흐단 흐멜니츠키가 이끈 코사크 봉기(1648) 뒤 즈보리우 조약(1649)으로 키이우·브라츨라우·체르니히우 주에 선 자포로자 군단의 나라. 1654년 페레야슬라우 회의로 러시아 차르의 보호를 받았고, 하디아치 조약(1658)·슬로보디셰 조약(1660)을 거쳐 드니프로강 오른쪽 기슭은 폴란드로 돌아감(오른쪽 기슭 헤트만 도로셴코는 1669년 오스만의 보호를 받음). 1667년 안드루소보 휴전으로 왼쪽 기슭과 키이우는 러시아 땅이 되었고, 헤트만국은 러시아 안의 자치 지역으로 남았다가 1764년 예카테리나 2세가 헤트만 자리를 없앰
  basis:
    type: primary_source
    refs: ["즈보리우 조약(1649)", "페레야슬라우 회의(1654)", "안드루소보 휴전(1667)", "영원한 평화 조약(1686)"]
    foundingNote: 즈보리우 조약으로 헤트만국이 선 1649년을 시작으로 봄. 지도에는 독립기 1649~1653년만 따로 표시하고(키이우·브라츨라우·체르니히우 주와 자포로자 땅), 1654년 페레야슬라우 회의부터는 정할 점(EUROPE_DRAFT.md 7.3-⑧, 종속국 땅은 종주국 땅)대로 러시아 땅으로 그림(러시아 종속 관계는 1666년까지, 1660년부터 오른쪽 기슭은 폴란드)

# ── 1526~1599년 유럽 뼈대 (작업 D3, 영토는 scripts/geo/areas/europe.mjs의 '1526~1599 조각 소유표') ──
# 1600~1699년 항목 가운데 이 시기에도 있던 나라는 영토를 1526년부터로 넓혔다(쿠를란트 1561·네덜란드 공화국 1581·폴란드-리투아니아 1569·트란실바니아 1570·토스카나 1569·파르마·모데나·루카 1545·아일랜드 왕국 1542·러시아 차르국 1547년부터).
# 이름만 바뀐 나라는 1700~1788·1600~1699년처럼 항목을 나눈다(소유표 renames, 정할 점 ⑩)
- id: grand-duchy-of-moscow
  level: polity
  names: { ko: 모스크바 대공국, en: Grand Duchy of Moscow, native: Великое княжество Московское }
  from: 1283
  to: 1547
  color: "#6f8f6f"
  summary: 모스크바를 중심으로 루스의 공국들을 모은 나라. 이반 3세가 노브고로드(1478)·트베리(1485)를 합치고 킵차크 칸국의 지배에서 벗어났으며(1480), 이반 3세가 대페름(1472 원정)을, 바실리 3세가 프스코프(1510)·스몰렌스크(1514)·랴잔(1521)을 합침. 1503년 휴전으로 리투아니아에게서 세베르스크 땅(체르니히우·노우호로드시베르스키·스타로두프·브랸스크)을 얻음. 1547년 이반 4세가 차르로 대관해 러시아 차르국이 됨
  basis:
    type: primary_source
    refs: ["1503년 모스크바-리투아니아 휴전", "1522년 휴전(스몰렌스크)", "1537년 모스크바 휴전(세베시)"]
    foundingNote: 다닐 알렉산드로비치가 모스크바 공이 된 1283년 무렵을 시작으로 봄. 지도에는 1300~1546년만 표시하고(블라디미르 대공위 땅은 1363년, 니즈니노브고로드는 1392년부터, 정할 점 M2-④, 작업 M2) 1547년부터는 러시아 차르국 항목(이름만 바뀜). 1503·1521년 병합의 명목 경계 밖 남쪽 들판(보로네시·벨고로드)과 모르드바 땅(1552년부터), 노가이 오르다의 땅(1556년부터)은 칠하지 않음(EUROPE_DRAFT.md 7.8 D3-⑨)

- id: kazan-khanate
  level: polity
  names: { ko: 카잔 칸국, en: Khanate of Kazan, native: Казан ханлыгы }
  from: 1438
  to: 1552
  color: "#b9a46a"
  summary: 킵차크 칸국에서 갈라져 나와 볼가강 가운데의 카잔을 중심으로 볼가 타타르·추바시·마리·우드무르트를 다스린 칸국. 모스크바와 크림 칸국이 칸의 자리를 두고 다투었고, 1552년 이반 4세가 카잔을 점령해 러시아에 합쳐짐
  basis:
    type: primary_source
    refs: ["카잔 점령(1552)"]
    foundingNote: 울루그 무함마드가 카잔에 자리 잡은 1438년 무렵을 시작으로 봄. 지도에는 1438~1551년만 지금의 타타르스탄·추바시·마리엘·우드무르트·울랴노우스크주로 대략 표시(바시키르 서부는 칠하지 않음)

- id: astrakhan-khanate
  level: polity
  names: { ko: 아스트라한 칸국, en: Khanate of Astrakhan, native: Әстерхан ханлыгы }
  from: 1466
  to: 1556
  color: "#c7a678"
  summary: 볼가강 하구의 아스트라한(하지타르한)을 중심으로 한 칸국으로 킵차크 칸국(대오르다)의 뒤를 이음. 노가이 오르다·크림 칸국의 영향을 받다가 1556년 러시아에 합쳐짐
  basis:
    type: primary_source
    refs: ["아스트라한 점령(1556)"]
    foundingNote: 칸국이 선 1466년 무렵을 시작으로 봄. 지도에는 1466~1555년만(1453~1465년은 대오르다 땅) 지금의 아스트라한주와 칼미크 공화국(볼가강 서쪽 초원)으로 대략 표시

- id: poland-kingdom
  level: polity
  names: { ko: 폴란드 왕국, en: Crown of the Kingdom of Poland, native: Korona Królestwa Polskiego }
  from: 1025
  to: 1569
  color: "#d98c8c"
  summary: 야기에우워 왕가의 왕이 리투아니아 대공을 겸한 왕국(왕관령). 대·소폴란드와 마조프셰(1526년 마지막 공작이 죽어 합쳐짐), 토룬 조약(1466)으로 얻은 왕령 프로이센, 르비우·포딜리아를 다스리고 프로이센 공국을 봉토로 둠. 1569년 루블린 연합으로 리투아니아 대공국과 합쳐 폴란드-리투아니아가 됨
  basis:
    type: primary_source
    refs: ["토룬 조약(1466)", "크라쿠프 조약(1525)", "루블린 연합(1569)"]
    foundingNote: 볼레스와프 1세가 왕으로 대관한 1025년을 시작으로 봄. 지도에는 1320~1568년만 표시하고(1320 재통일, 마조프셰는 1351년부터, 붉은 루스는 1349~1371·1387년부터, 작업 M2. 왕령 프로이센은 1466년부터, 서포딜리아는 1430년부터) 1569년부터는 폴란드-리투아니아 항목(같은 색)

- id: lithuania-grand-duchy
  level: polity
  names: { ko: 리투아니아 대공국, en: Grand Duchy of Lithuania, native: Lietuvos Didžioji Kunigaikštystė }
  from: 1236
  to: 1569
  color: "#5aa39b"
  summary: 리투아니아·벨라루스와 우크라이나 대부분(볼히니아·키이우·브라츨라우)을 다스린 대공국으로 폴란드 왕이 대공을 겸함. 모스크바와의 전쟁으로 세베르스크(1503)·스몰렌스크(1514)를 잃음. 리보니아 전쟁(1558~1583) 중 빌뉴스 조약(1561)으로 리보니아를 보호 아래 두었고, 1569년 루블린 연합으로 포들라시에·볼히니아·키이우 주를 폴란드 왕관령에 넘기고 폴란드-리투아니아의 한 부분이 됨(1795년까지 따로 정부와 군대를 둠)
  basis:
    type: primary_source
    refs: ["빌뉴스 조약(1561)", "루블린 연합(1569)"]
    foundingNote: 민다우가스가 리투아니아를 하나로 모은 1236년 무렵을 시작으로 봄. 지도에는 1300~1568년만 따로 표시하고(1320 비텝스크·폴로츠크·투로우-핀스크·베레스테, 1340 볼히니아, 1356 브랸스크, 1362 키이우·포딜리아·체르니히우, 1395 스몰렌스크, 1398 흑해 쪽 들판, 작업 M2. 1494·1503·1522년 모스크바에 땅을 내준 해에 바뀜) 1569년부터는 폴란드-리투아니아 항목. 1400~1452년에는 1411년 사모기티아, 1401~1403년 스몰렌스크 공국 복위, 1430년 서포딜리아(폴란드)가 바뀜(작업 M1)

- id: livonian-confederation
  level: polity
  names: { ko: 리보니아 연맹 (묶음), en: Livonian Confederation, native: Livländische Konföderation }
  from: 1422
  to: 1561
  color: "#a9b4c9"
  summary: 리보니아 기사단과 리가 대주교령·타르투·외셀비크·쿠를란트 주교령이 지금의 에스토니아·라트비아를 나눠 다스린 느슨한 연맹(묶음). 1558년 러시아의 침공으로 리보니아 전쟁이 일어나 1559년 외셀을 덴마크에 팔고, 1561년 북에스토니아는 스웨덴에, 나머지는 빌뉴스 조약으로 리투아니아에 신속해 무너짐(기사단장 케틀러는 쿠를란트 공)
  basis:
    type: primary_source
    refs: ["빌뉴스 조약(1561)"]
    foundingNote: 발크 의회(1422)로 연맹이 짜인 때를 시작으로 봄. 지도에는 1422~1560년만 한 색으로 표시(1558~1582년 러시아의 점령은 그리지 않음)

- id: eastern-hungarian-kingdom
  level: polity
  names: { ko: 동헝가리 왕국, en: Eastern Hungarian Kingdom, native: Keleti Magyar Királyság }
  from: 1526
  to: 1570
  color: "#8db1d6"
  summary: 모하치 전투(1526) 뒤 헝가리 귀족 다수가 왕으로 뽑은 서포여이 야노시와 그 아들 야노시 지그몬드의 왕국. 페르디난트 1세와 왕위를 다투다 오스만의 종주를 받았고(1529), 너지바러드 조약(1538)으로 헝가리를 나눔. 1541년 술레이만 1세가 부다를 직할령으로 하고 티서강 동쪽과 트란실바니아를 야노시 지그몬드에게 줌(페르디난트는 1547년 아드리아노플 휴전으로 인정). 바이센부르크 조약(1551)으로 왕국을 페르디난트에게 넘겼으나, 그의 군대가 지키던 테메슈바르·리포바·솔노크를 1552년 오스만에 빼앗기고(1562년 콘스탄티노폴리스 조약으로 인정) 1556년 야노시 지그몬드가 돌아옴. 1570년 슈파이어 조약으로 왕 칭호를 내놓고 트란실바니아 공국이 됨
  basis:
    type: primary_source
    refs: ["너지바러드 조약(1538)", "바이센부르크 조약(1551)", "슈파이어 조약(1570)"]
    foundingNote: 서포여이 야노시가 왕으로 대관한 1526년 11월을 시작으로 봄. 지도에는 1526~1569년만 표시하고 1570년부터는 트란실바니아 공국 항목(같은 색). 1526~1540년은 너지바러드 조약의 나눔으로 그린 군 단위 근사이고, 1551~1556년 페르디난트의 지배는 그리지 않음. 부다 쪽은 1547년, 테메슈바르·리포바·솔노크는 1562년(조약 해)에 오스만 땅으로 그림(EUROPE_DRAFT.md 7.8 D3-①②③)

- id: habsburg-netherlands
  level: polity
  names: { ko: 합스부르크령 네덜란드, en: Habsburg Netherlands, native: Habsburgse Nederlanden }
  from: 1482
  to: 1556
  color: "#d8b04c"
  summary: 부르고뉴 공작 가문의 유산으로 합스부르크 가문이 이은 저지대(플랑드르·브라반트·홀란트·에노·룩셈부르크 등)와 프랑슈콩테. 카를 5세가 프리슬란트(1524)·위트레흐트·오버레이설(1528)·흐로닝언(1536)·헬데른(1543)을 더해 17주를 이루고 부르고뉴 관구(1548)·국사 조칙(1549)으로 한 덩어리로 묶음. 1555~1556년 카를 5세가 물러나며 아들 펠리페 2세(에스파냐 왕)가 이음
  basis:
    type: primary_source
    refs: ["벤로 조약(1543)", "아우크스부르크 협약(1548)", "국사 조칙(1549)"]
    foundingNote: 마리 드 부르고뉴가 죽어 막시밀리안 1세와 아들 필리프가 이은 1482년을 시작으로 봄. 지도에는 1482~1555년만 표시하고(아르투아·프랑슈콩테는 1482~1492년 프랑스, 1493년 상리스 조약부터. 1481년까지는 부르고뉴 공국 항목) 1556년부터는 에스파냐 항목(같은 색, EUROPE_DRAFT.md 7.8 D3-⑤)

- id: brittany
  level: polity
  names: { ko: 브르타뉴 공국, en: Duchy of Brittany, native: Dugelezh Breizh }
  from: 939
  to: 1532
  color: "#9fb08a"
  summary: 프랑스 서북쪽 반도의 공국. 안 드 브르타뉴가 샤를 8세·루이 12세와 결혼해 프랑스 왕가와 이어졌고, 1532년 반 칙령(합병 칙령)으로 프랑스 왕국에 합쳐짐
  basis:
    type: primary_source
    refs: ["합병 칙령(1532)"]
    foundingNote: 알랭 2세가 바이킹을 몰아낸 939년을 시작으로 봄. 지도에는 1300~1531년만 지금의 브르타뉴 4개 도와 루아르아틀랑티크도로 표시

- id: milan
  level: polity
  names: { ko: 밀라노 공국, en: Duchy of Milan, native: Ducato di Milano }
  from: 1395
  to: 1535
  color: "#5fa0c8"
  summary: 비스콘티·스포르차 가문의 공국. 1450년 프란체스코 스포르차가 공작이 되고 로디 화약(1454)으로 이탈리아의 세력 균형을 이룸. 1499년 루이 12세가 정복해 1504~1505년 리옹·블루아 조약과 황제의 서임으로 프랑스 땅이 되었고, 1512~1515년 마시밀리아노 스포르차가 잠시 돌아왔다가 마리냐노 전투(1515)로 다시 프랑스 땅. 이탈리아 전쟁 동안 프랑스와 카를 5세가 다투었고, 캉브레 화약(1529)·볼로냐 화의(1530)로 프란체스코 2세 스포르차가 돌아왔으나 1535년 그가 후사 없이 죽자 카를 5세가 차지해 아들 펠리페에게 봉토로 줌(에스파냐령 밀라노)
  basis:
    type: primary_source
    refs: ["캉브레 화약(1529)", "볼로냐 화의(1530)"]
    foundingNote: 잔 갈레아초 비스콘티가 공작이 된 1395년을 시작으로 봄. 지도에는 1395~1503년과 1526~1534년만 표시하고(1400~1404년 베로나·비첸차·피사·시에나·페루자, 1402년 볼로냐를 가진 잔갈레아초 비스콘티의 판도, 작업 M1. 1504~1525년은 리옹·블루아 조약으로 프랑스 땅, 1499~1503년의 점령과 1512~1515·1521~1525년의 스포르차 복위는 조약 해 기준으로 그리지 않음, EUROPE_DRAFT.md 7.9)(정할 점 ②대로 만토바·몬페라토의 알레산드리아주 쪽 함께) 1535년부터는 에스파냐 땅

- id: florence
  level: polity
  names: { ko: 피렌체 공화국·공국, en: Republic and Duchy of Florence, native: Repubblica e Ducato di Firenze }
  from: 1115
  to: 1569
  color: "#b6a0c8"
  summary: 메디치 가문이 이끈 피렌체(피사·피스토이아·아레초 포함). 1527년 로마 약탈 뒤 메디치를 몰아낸 마지막 공화국을 1530년 카를 5세와 교황 클레멘스 7세가 무너뜨리고 1532년 알레산드로 데 메디치가 공작이 됨. 코시모 1세가 1555년 시에나를 정복하고 1557년 펠리페 2세에게서 봉토로 받아, 1569년 교황이 토스카나 대공으로 올림
  basis:
    type: primary_source
    refs: ["피렌체 포위(1529~1530)", "펠리페 2세의 시에나 봉토 수여(1557)"]
    foundingNote: 자치 도시가 된 1115년을 시작으로 봄(공국은 1532년부터, 경계가 같아 한 항목). 지도에는 1300~1568년만 표시하고 1569년부터는 토스카나 대공국 항목(같은 색)

- id: siena
  level: polity
  names: { ko: 시에나 공화국, en: Republic of Siena, native: Repubblica di Siena }
  from: 1125
  to: 1557
  color: "#c9b48e"
  summary: 토스카나 남부(시에나·그로세토)의 공화국. 프랑스와 손잡고 카를 5세에 맞섰다가 피렌체·제국군에 포위되어 1555년 항복했고(망명 공화국은 몬탈치노에서 1559년까지), 1557년 펠리페 2세가 코시모 1세에게 봉토로 줌(해안의 프레시디 국가는 에스파냐가 가짐)
  basis:
    type: primary_source
    refs: ["시에나 항복(1555)", "펠리페 2세의 봉토 수여(1557)", "카토캉브레지 조약(1559)"]
    foundingNote: 자치 도시가 된 1125년 무렵을 시작으로 봄. 지도에는 1300~1398년과 1404~1556년만 표시하고(1399~1403 밀라노, 작업 M2) 1557년부터는 피렌체 땅(조약 해 기준, EUROPE_DRAFT.md 7.8 D3-⑬)

- id: italian-minor-states
  level: polity
  names: { ko: 이탈리아 소국들 (묶음), en: Italian minor states (grouped), native: Stati minori italiani }
  from: 1300
  to: 1545
  color: "#8fb8a8"
  summary: 1545년 파르마 공국이 서기 전의 북중부 이탈리아 작은 나라들을 묶은 항목. 에스테 가문의 페라라·모데나·레조 공국(모데나는 1527년까지 교황령)과 루카 공화국. 1545년부터는 파르마·모데나·루카 묶음 항목
  basis:
    type: primary_source
    refs: ["카를 5세의 중재(1531, 모데나·레조를 에스테 가문에)"]
    foundingNote: 정할 점(EUROPE_DRAFT.md 7.3-②)대로 1545년 전 소국을 묶은 항목. 지도에는 1300~1544년만 표시(작업 D4에서 1453년, 작업 M1에서 1400년, 작업 M2에서 1300년부터로 넓힘. 1300~1399년에는 스칼리제리의 베로나·카라라의 파도바·곤차가의 만토바·피사(사르데냐 땅 1323년까지)·루카·아레초와 비스콘티에 들기 전의 롬바르디아 코무네들도 묶음. 1400~1404년 카라라 가문의 파도바, 1400~1404년 마사·카라라 포함. 폴레시네(로비고, 1484 바뇰로 조약으로 베네치아)는 근사)

- id: lordship-of-ireland
  level: polity
  names: { ko: 아일랜드 영주령, en: Lordship of Ireland, native: Tiarnas na hÉireann }
  from: 1171
  to: 1542
  color: "#7fae7f"
  summary: 헨리 2세의 침공(1171) 뒤 잉글랜드 왕이 영주로 다스린 아일랜드. 실제로는 더블린 둘레의 페일 밖을 게일계 영주들과 킬데어 백작 같은 앵글로노르만 귀족이 다스렸고, 헨리 8세가 1541년 아일랜드 왕국법으로 왕을 칭함
  basis:
    type: primary_source
    refs: ["아일랜드 왕국법(1541)"]
    foundingNote: 헨리 2세가 아일랜드에 건너온 1171년을 시작으로 봄. 지도에는 1300~1541년 왕의 땅인 페일(더블린·킬데어·미스·라우스)·웨스트미스와 앵글로노르만 백작령(오먼드·데즈먼드)·워터퍼드·웩스퍼드를 표시하고(1332년까지 얼스터 백작령과 코노트, 1368년까지 미들랜즈·칼로, 1317년까지 클레어 포함), 게일 영주들의 땅은 아일랜드 게일 영주들(묶음) 항목(작업 FIX2, 정할 점 FIX2-⑤). 1542년부터는 아일랜드 왕국 항목(같은 색, 섬 전체)

# ── 1453~1525년 유럽 뼈대 (작업 D4, 영토는 scripts/geo/areas/europe.mjs의 '1453~1525 조각 소유표') ──
# 1526~1599년 항목 가운데 이 시기에도 있던 나라는 영토를 1453년부터로 넓혔다(아스트라한 칸국 1466, 합스부르크령 네덜란드 1482, 에스파냐 1479, 프로이센 공국 1525, 스웨덴 왕국 1523, 덴마크-노르웨이 1524).
# 이름만 바뀌어 이어지는 나라(카스티야·아라곤 → 에스파냐, 튜턴 기사단국 → 프로이센 공국, 칼마르 동맹 → 덴마크-노르웨이, 중세 스웨덴 왕국 → 스웨덴 왕국)는 다음 항목과 같은 색.
# 공물을 바치거나 종주권을 인정한 나라도 따로 왕·대공·칸·정부를 두었으면 따로 그린다(정할 점 D4-③). 근거와 정할 점은 docs/EUROPE_DRAFT.md의 '작업 D 계획' 7.9
- id: hungary-kingdom
  level: polity
  names: { ko: 헝가리 왕국, en: Kingdom of Hungary, native: Magyar Királyság }
  from: 1000
  to: 1526
  color: "#5f93c0"
  summary: 크로아티아-슬라보니아·트란실바니아·버나트를 아우른 왕국. 마티아스 코르비누스(1458~1490)가 오스만에 맞서 야이체·스레브레니크 바나트를 되찾고(1463~1464), 보헤미아 왕위를 다퉈 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 얻었으며 1485년 빈을 차지함(강화 없이 1490년 그가 죽은 뒤 막시밀리안 1세가 되찾음). 야기에우워 가문의 블라디슬라프 2세·러요시 2세 때 오스만에 베오그라드(1521)를 잃고, 1526년 모하치 전투에서 왕이 죽어 페르디난트 1세와 서포여이 야노시가 왕위를 다툼
  basis:
    type: primary_source
    refs: ["올로모우츠 조약(1479)", "포조니 조약(1491)"]
    foundingNote: 이슈트반 1세가 대관한 1000년을 시작으로 봄. 지도에는 1300~1525년만 표시하고 1526년부터는 합스부르크 군주국·동헝가리 왕국·오스만 제국 땅. 1482~1490년 오스트리아 점령은 강화 없이 끝나 그리지 않음(EUROPE_DRAFT.md 7.9)

- id: bohemia-kingdom
  level: polity
  names: { ko: 보헤미아 왕국, en: Kingdom of Bohemia, native: České království }
  from: 1198
  to: 1526
  color: "#9b7cb6"
  summary: 보헤미아·모라비아·슐레지엔·라우지츠로 이루어진 보헤미아 왕관령. 후스 전쟁 뒤 이르지 포데브라디(1458~1471)가 다스렸고, 헝가리의 마티아스 코르비누스와 왕위를 다퉈 올로모우츠 조약(1479)으로 모라비아·슐레지엔·라우지츠를 그에게 넘겼다가 그가 죽은 1490년 되찾음. 1471년부터 야기에우워 가문의 블라디슬라프 2세가 왕이었고 1490년 헝가리 왕을 겸함. 1526년 러요시 2세가 죽어 합스부르크 가문의 페르디난트 1세가 왕이 됨
  basis:
    type: primary_source
    refs: ["올로모우츠 조약(1479)"]
    foundingNote: 오타카르 1세가 세습 왕위를 받은 1198년을 시작으로 봄. 지도에는 1300~1525년만(슐레지엔은 1329년, 오버라우지츠는 1320년, 니더라우지츠는 1369년부터, 작업 M2) 표시하고 1526년부터는 합스부르크 군주국 땅. 신성 로마 제국에 속했으나 정할 점 ①대로 따로 그림

- id: habsburg-austria
  level: polity
  names: { ko: 오스트리아 (합스부르크 세습령), en: Habsburg hereditary lands (Austria), native: Habsburgische Erblande }
  from: 1282
  to: 1526
  color: "#d6bd6e"
  summary: 합스부르크 가문이 다스린 오스트리아 대공국·슈타이어마르크·케른텐·크라인·티롤·포어아를베르크와 트리에스테·고리치아(1500). 15세기에는 알브레히트계(라디슬라프, 1457년 끊김)와 레오폴트계(프리드리히 3세·티롤의 지기스문트)가 나눠 가졌고, 1482~1490년 헝가리의 마티아스 코르비누스가 빈과 니더외스터라이히를 차지함. 막시밀리안 1세(1493~1519)가 모두 합치고 1521~1522년 페르디난트 1세가 물려받아 1526년 보헤미아·헝가리 왕위를 더해 합스부르크 군주국이 됨
  basis:
    type: primary_source
    refs: ["포조니 조약(1491)", "보름스 협약(1521)", "브뤼셀 협약(1522)"]
    foundingNote: 루돌프 1세가 아들들에게 오스트리아를 준 1282년을 시작으로 봄. 지도에는 1300~1525년만(케른텐 1335, 티롤 1363, 포어아를베르크 1375, 작업 M2) 표시하고 1526년부터는 합스부르크 군주국 항목(같은 색). 앞오스트리아(슈바벤·엘자스)는 신성 로마 제국 묶음으로 그린 근사(D1~D3와 같음)

- id: teutonic-order
  level: polity
  names: { ko: 튜턴 기사단국, en: State of the Teutonic Order, native: Deutschordensstaat }
  from: 1230
  to: 1525
  color: "#7d8aa6"
  summary: 튜턴 기사단이 프로이센과 포메렐리아(단치히)를 다스린 수도회 국가. 1454년 프로이센 연합이 들고일어나 폴란드 왕에게 의탁하면서 13년 전쟁이 일어났고, 1466년 제2차 토룬 조약으로 포메렐리아·헤움노 땅·말보르크·엘블롱크·바르미아(왕령 프로이센)를 폴란드에 넘기고 나머지는 폴란드 왕의 봉토가 됨. 1525년 크라쿠프 조약으로 기사단장 알브레히트가 루터파로 바꾸고 세속 프로이센 공국이 됨
  basis:
    type: primary_source
    refs: ["제2차 토룬 조약(1466)", "크라쿠프 조약(1525)"]
    foundingNote: 콘라트 공작의 초청으로 헤움노 땅에 자리 잡은 1230년을 시작으로 봄. 지도에는 1300~1524년만(포메렐리아 1309, 메멜 1329, 사모기티아 1398, 작업 M2) 표시하고 1525년부터는 프로이센 공국 항목(같은 색). 1400~1410년 사모기티아(1398 살리나스 조약·1411 제1차 토룬 조약), 1400~1407년 고틀란드, 1402~1454년 노이마르크(1402 지기스문트가 저당으로 팖·1429 완전 소유, 1454 쾰른 조약·1455 메베 조약으로 브란덴부르크, 작업 M1·FIX2)도 표시

- id: burgundy
  level: polity
  names: { ko: 부르고뉴 공국, en: Burgundian State, native: État bourguignon }
  from: 1363
  to: 1482
  color: "#a35d86"
  summary: 발루아 부르고뉴 가문(선량공 필리프·대담공 샤를·마리)이 다스린 부르고뉴 공작령·프랑슈콩테와 저지대(플랑드르·아르투아·브라반트·홀란트·제일란트·에노·나뮈르·룩셈부르크)와 솜강 도시들. 1477년 1월 샤를이 낭시에서 죽자 루이 11세가 공작령·피카르디·아르투아·프랑슈콩테를 차지했고, 딸 마리가 막시밀리안과 혼인해 전쟁이 이어지다 1482년 아라스 조약으로 공작령·피카르디는 프랑스, 저지대는 그 아들 필리프(합스부르크)에게 감
  basis:
    type: primary_source
    refs: ["아라스 조약(1435)", "콩플랑 조약(1465)", "아라스 조약(1482)", "상리스 조약(1493)"]
    foundingNote: 장 2세가 아들 필리프에게 부르고뉴 공작령을 준 1363년을 시작으로 봄. 지도에는 1363~1481년만 표시(1363~1383년은 부르고뉴 공작령, 1384년 플랑드르·아르투아·프랑슈콩테 상속, 작업 M2. 1400~1452년 저지대 획득은 1428 에노·홀란트·제일란트(델프트 조약으로 섭정·상속인, 1433 실제 승계), 1429 나뮈르, 1430 브라반트, 1436 솜강 도시(1435 아라스 조약), 1444 룩셈부르크(1443), 작업 M1. 1477~1481년 프랑스의 점령은 조약 전이라 그리지 않음, 정할 점 ⑦). 1482년부터 저지대는 합스부르크령 네덜란드 항목

- id: provence
  level: polity
  names: { ko: 프로방스 백국, en: County of Provence, native: Comté de Provence }
  from: 1246
  to: 1481
  color: "#e08a6a"
  summary: 앙주 가문이 다스린 신성 로마 제국의 백국(엑스·마르세유·툴롱·그라스). 르네 왕(앙주 공·나폴리 왕 칭호)이 1480년 죽고 조카 샤를 4세가 1481년 12월 죽으며 루이 11세에게 물려줘 프랑스 왕령이 됨(1486년 프로방스 신분회가 합병을 확인)
  basis:
    type: primary_source
    refs: ["샤를 4세 뒤 멘의 유언(1481)"]
    foundingNote: 앙주의 샤를이 프로방스 백작의 상속녀와 혼인한 1246년을 시작으로 봄. 지도에는 1300~1480년만 표시

- id: castile
  level: polity
  names: { ko: 카스티야 왕국, en: Crown of Castile, native: Corona de Castilla }
  from: 1230
  to: 1479
  color: "#d8b04c"
  summary: 카스티야·레온·갈리시아·안달루시아·무르시아와 바스크를 아우른 왕국(1462년 지브롤터, 카나리아 제도). 엔리케 4세가 죽은 뒤 이사벨 1세와 후아나가 왕위를 다툰 계승 전쟁(1475~1479)을 알카소바스 조약으로 끝냈고, 남편 페르난도가 1479년 아라곤 왕이 되어 두 왕관이 같은 왕 아래(에스파냐) 놓임
  basis:
    type: primary_source
    refs: ["알카소바스 조약(1479)"]
    foundingNote: 카스티야와 레온이 마지막으로 합쳐진 1230년을 시작으로 봄. 지도에는 1300~1478년만 표시하고 1479년부터는 에스파냐 항목(같은 색, 정할 점 ⑩)

- id: aragon
  level: polity
  names: { ko: 아라곤 연합 왕국, en: Crown of Aragon, native: Corona de Aragón }
  from: 1164
  to: 1479
  color: "#c45a5a"
  summary: 아라곤·카탈루냐·발렌시아·마요르카와 시칠리아·사르데냐, 루시용·세르다뉴를 아우른 연합 왕국. 알폰소 5세가 나폴리도 얻었으나(1442) 죽으며 나폴리는 서자 페란테에게 따로 넘김(1458). 후안 2세는 카탈루냐 내전(1462~1472) 중 루시용·세르다뉴를 프랑스에 저당 잡혔고(1462~1493), 1479년 아들 페르난도 2세가 이어 카스티야와 같은 왕 아래(에스파냐) 놓임
  basis:
    type: primary_source
    refs: ["바욘 조약(1462)", "바르셀로나 조약(1493)"]
    foundingNote: 아라곤 왕국과 바르셀로나 백국이 합쳐진 1164년을 시작으로 봄. 지도에는 1300~1478년만(1308 알리칸테, 1324 사르데냐 남부, 1344 마요르카 왕국, 작업 M2) 표시하고 1479년부터는 에스파냐 항목. 루시용·세르다뉴의 저당·점령은 그리지 않음(정할 점 D2 기준)

- id: navarre
  level: polity
  names: { ko: 나바라 왕국, en: Kingdom of Navarre, native: Reino de Navarra }
  from: 824
  to: 1512
  color: "#8fbf6f"
  summary: 피레네산맥 양쪽의 왕국. 15세기에는 아라곤의 후안 2세와 아들 비아나 공 카를로스가 다툰 내전(아그라몬테·보몬테 파)에 시달렸고 푸아·알브레 가문으로 이어짐. 1512년 페르난도 2세가 산맥 남쪽(오트나바라)을 정복해 나바라 왕을 칭하고 1515년 카스티야 왕관에 합침. 북쪽(바스나바르)은 알브레 가문에 남음
  basis:
    type: primary_source
    refs: ["부르고스 코르테스의 합병(1515)"]
    foundingNote: 팜플로나 왕국이 선 824년 무렵을 시작으로 봄. 지도에는 1300~1511년 남쪽(지금의 나바라 자치 지방)만 표시. 바스나바르·베아른은 프랑스로 그린 근사(D3와 같음). 조약 없이 넘어간 땅이라 정복 해에 바꿈(정할 점 D4-①)

- id: granada
  level: polity
  names: { ko: 그라나다 에미르국, en: Emirate of Granada, native: إمارة غرناطة }
  from: 1238
  to: 1492
  color: "#5f9e7f"
  summary: 이베리아반도의 마지막 이슬람 왕조인 나스르 왕조의 에미르국(그라나다·말라가·알메리아). 1482년부터 그라나다 전쟁으로 론다(1485)·말라가(1487)·바사·알메리아(1489)를 잃고, 1491년 11월 그라나다 조약에 따라 1492년 1월 2일 무함마드 12세(보압딜)가 도시를 넘김
  basis:
    type: primary_source
    refs: ["그라나다 조약(1491)"]
    foundingNote: 무함마드 1세가 그라나다에 자리 잡은 1238년을 시작으로 봄. 지도에는 1300~1491년만 표시. 그라나다 전쟁 중의 정복(1485~1489)은 그리지 않음(정할 점 ⑦)

- id: naples-kingdom
  level: polity
  names: { ko: 나폴리 왕국, en: Kingdom of Naples, native: Regno di Napoli }
  from: 1282
  to: 1501
  color: "#d79a6a"
  summary: 이탈리아 남부의 왕국. 아라곤의 알폰소 5세가 정복(1442)한 뒤 서자 페란테(1458~1494)와 그 자손이 다스림. 1495년 프랑스의 샤를 8세가 잠시 차지했고(이탈리아 전쟁의 시작), 1500년 그라나다 조약으로 프랑스·아라곤이 나누기로 해 1501년 페데리코가 물러남. 두 나라가 다툰 끝에 1504년 리옹 조약으로 모두 페르난도 2세(에스파냐)의 땅이 됨
  basis:
    type: primary_source
    refs: ["그라나다 조약(1500)", "리옹 조약(1504)"]
    foundingNote: 시칠리아 만종 사건으로 시칠리아와 갈라진 1282년을 시작으로 봄. 지도에는 1300~1500년만(1368년까지 알바니아의 두러스·크루여, 1386년까지 코르푸, 작업 M2) 표시(1495년 샤를 8세의 점령은 그리지 않음). 1501~1503년 북부는 프랑스, 남부는 에스파냐

- id: novgorod-republic
  level: polity
  names: { ko: 노브고로드 공화국, en: Novgorod Republic, native: Новгородская республика }
  from: 1136
  to: 1478
  color: "#8a6a3a"
  summary: 민회(베체)가 다스린 러시아 북부의 상업 공화국. 노브고로드·잉그리아·카렐리야와 백해·페초라까지의 드비나 땅(자볼로치예)을 다스림. 리투아니아에 기댔다가 1471년 셸론강 전투에 지고 코로스틴 조약으로 모스크바의 종주를 인정했으며, 1478년 1월 이반 3세에게 항복해 민회의 종을 빼앗기고 모스크바에 합쳐짐
  basis:
    type: primary_source
    refs: ["코로스틴 조약(1471)"]
    foundingNote: 공을 내쫓고 민회가 다스리기 시작한 1136년을 시작으로 봄. 지도에는 1300~1477년만(프스코프는 1347년까지, 비체그다 페름은 1383년까지, 작업 M2) 표시. 페초라 볼로스트는 공납지이나 노브고로드 땅으로 그림(코미 북부·네네츠, 정할 점 D4-⑥)

- id: tver
  level: polity
  names: { ko: 트베리 대공국, en: Grand Duchy of Tver, native: Великое княжество Тверское }
  from: 1247
  to: 1485
  color: "#d4b85a"
  summary: 모스크바와 북동 루스의 패권을 다툰 대공국. 보리스 대공(1425~1461) 때 리투아니아와 모스크바 사이에서 힘을 지켰으나, 미하일 대공이 리투아니아와 손잡으려 하자 1485년 9월 이반 3세가 도시를 에워싸 합침
  basis:
    type: primary_source
    refs: ["모스크바-트베리 조약(1484)"]
    foundingNote: 야로슬라프 야로슬라비치가 트베리 공이 된 1247년 무렵을 시작으로 봄. 지도에는 1300~1484년만 표시

- id: pskov-republic
  level: polity
  names: { ko: 프스코프 공화국, en: Pskov Republic, native: Псковская республика }
  from: 1348
  to: 1510
  color: "#9a6fb0"
  summary: 노브고로드에서 갈라져 나온 민회의 공화국. 리보니아 기사단과 맞서며 모스크바 대공이 보낸 공을 받아들였고, 1510년 바실리 3세가 민회의 종을 떼어 가고 모스크바에 합침
  basis:
    type: primary_source
    refs: ["볼로토보 조약(1348)"]
    foundingNote: 볼로토보 조약으로 노브고로드에서 독립한 1348년을 시작으로 봄. 지도에는 1348~1509년만 표시. 모스크바 대공을 군주로 받든 종속 관계는 relations.yaml에 둠

- id: ryazan
  level: polity
  names: { ko: 랴잔 대공국, en: Grand Duchy of Ryazan, native: Великое княжество Рязанское }
  from: 1129
  to: 1521
  color: "#cf8f6f"
  summary: 오카강 남쪽 랴잔 땅의 대공국. 15세기 중엽부터 모스크바 대공의 '아우'로 종주를 받았고(1456~1464년에는 이반 3세가 어린 대공의 후견인으로 다스림), 마지막 대공 이반 5세가 크림 칸국과 손잡으려 하자 1521년 바실리 3세가 합침
  basis:
    type: primary_source
    refs: ["모스크바-랴잔 조약(1483)"]
    foundingNote: 체르니고프 공국에서 갈라진 1129년 무렵을 시작으로 봄. 지도에는 1300~1520년만 표시(옐레츠 쪽 명목 경계 포함, D3-⑨). 툴라는 1503년 모스크바에 합쳐질 때까지 랴잔 땅으로 그림(작업 M2·FIX2)

- id: vyatka
  level: polity
  names: { ko: 뱌트카 땅, en: Vyatka Land, native: Вятская земля }
  from: 1181
  to: 1489
  color: "#7fb0c8"
  summary: 뱌트카강 유역(흘리노프)에 노브고로드 이주민이 세운 자치 땅. 1459년 모스크바의 원정으로 종주를 인정했으나 카잔·노브고로드 사이에서 모스크바에 맞섰고, 1489년 이반 3세의 군대가 흘리노프를 차지해 아르스크 땅과 함께 합침
  basis:
    type: primary_source
    refs: ["뱌트카 연대기"]
    foundingNote: 연대기가 전하는 이주(1181)를 시작으로 봄. 지도에는 1300~1488년 키로프주만 표시

- id: golden-horde
  level: polity
  names: { ko: 킵차크 칸국 (대오르다), en: Golden Horde (Great Horde), native: Ulug Ulus }
  from: 1242
  to: 1502
  color: "#8f6fa8"
  summary: 바투가 세운 몽골의 킵차크 칸국. 15세기에 카잔(1438)·크림(1441)·아스트라한(1466 무렵) 칸국이 갈라져 나가고 볼가강·돈강 사이의 대오르다만 남음. 1480년 우그라강 대치로 모스크바가 종주에서 벗어났고, 1502년 크림 칸 멩글리 기레이가 샤이흐 아흐마드를 쳐서 무너뜨림
  basis:
    type: primary_source
    refs: ["러시아 연대기의 우그라강 대치(1480)"]
    foundingNote: 바투가 볼가강 하류에 자리 잡은 1242년을 시작으로 봄. 지도에는 1300~1501년 대오르다의 유목지(볼가·돈 초원과 북캅카스 초원)만 대략 표시. 그 뒤 볼가·돈 초원은 1526년 표처럼 비움(들판 기준 D3-⑨) 1400~1452년에는 갈라지기 전의 범위(카잔 1438·노가이 땅 1440·크림 1441년까지)를 표시(작업 M1, 정할 점 M1-⑪)

- id: kalmar-union
  level: polity
  names: { ko: 칼마르 동맹 (덴마크·노르웨이), en: Kalmar Union (Denmark–Norway), native: Kalmarunionen }
  from: 1448
  to: 1523
  color: "#c4685c"
  summary: 덴마크·노르웨이·스웨덴이 한 왕을 받든 동맹(1397 칼마르). 스웨덴은 1448년부터 거의 늘 따로 왕이나 섭정(스투레 가문)을 두었고 연합 왕(크리스티안 1세·한스·크리스티안 2세)이 다스린 것은 1457~1464·1497~1501·1520~1521년뿐. 1460년 리베 조약으로 슐레스비히·홀슈타인을 더했고 오크니·셰틀랜드는 1468~1469년 스코틀랜드에 저당 잡힘. 1523년 구스타브 바사가 스웨덴 왕이 되며 끝나 덴마크-노르웨이로 이어짐
  basis:
    type: primary_source
    refs: ["칼마르 동맹 문서(1397)", "리베 조약(1460)", "칼마르 협약(1483)"]
    foundingNote: 동맹은 1397년에 시작했으나 이 항목은 스웨덴이 떨어져 나간 1448년부터(1397~1447년은 칼마르 동맹 (덴마크·노르웨이·스웨덴) 항목, renames·같은 색. 작업 FIX2, 정할 점 FIX2-⑨). 1448년 카를 크누트손이 스웨덴 왕이 된 뒤 1523년까지 덴마크·노르웨이(1460년부터 홀슈타인 포함)만 표시(정할 점 D4-④). 1524년부터는 덴마크-노르웨이 항목(같은 색)

- id: sweden-medieval
  level: polity
  names: { ko: 스웨덴 왕국 (칼마르 동맹 시기), en: Kingdom of Sweden (Kalmar Union era), native: Konungariket Sverige }
  from: 1164
  to: 1523
  color: "#6f96c4"
  summary: 핀란드를 아우른 스웨덴 왕국. 칼마르 동맹에 들었으나 카를 크누트손(1448~1470, 세 차례)이 따로 왕이 되었고 스텐 스투레 등 섭정이 다스리며 연합 왕과 다툼. 1520년 크리스티안 2세의 스톡홀름 피바다 뒤 구스타브 바사가 들고일어나 1523년 6월 왕으로 뽑힘
  basis:
    type: primary_source
    refs: ["스트렝네스 의회(1523)"]
    foundingNote: 웁살라 대주교구가 선 1164년을 시작으로 봄. 지도에는 1300~1396년과 1448~1522년만 표시하고(1397~1447년은 칼마르 동맹 색, 정할 점 M1-③. 1332~1359년 스코네, 1360년까지 고틀란드 포함, 작업 M2) 1523년부터는 스웨덴 왕국 항목(같은 색)

- id: cyprus-kingdom
  level: polity
  names: { ko: 키프로스 왕국, en: Kingdom of Cyprus, native: Royaume de Chypre }
  from: 1192
  to: 1489
  color: "#c9b0d8"
  summary: 십자군의 뤼지냥 가문이 다스린 섬 왕국(1426년부터 맘루크 술탄국에 공물). 1464년 자크 2세가 베네치아의 도움으로 왕위를 차지하고 베네치아 귀족 카테리나 코르나로와 혼인했으며, 그가 죽은 뒤 1489년 여왕 카테리나가 물러나 베네치아의 땅이 됨
  basis:
    type: primary_source
    refs: ["카테리나 코르나로의 퇴위(1489)"]
    foundingNote: 기 드 뤼지냥이 섬을 산 1192년을 시작으로 봄. 지도에는 1300~1488년만 표시

- id: knights-hospitaller
  level: polity
  names: { ko: 로도스 기사단국, en: Knights Hospitaller of Rhodes, native: Ordo Hospitalis Sancti Johannis }
  from: 1310
  to: 1522
  color: "#d8665f"
  summary: 성 요한 기사단이 로도스섬과 도데카니사(코스 등), 소아시아의 보드룸 성을 다스린 수도회 국가. 1480년 메흐메트 2세의 포위를 물리쳤으나 1522년 술레이만 1세의 포위 끝에 12월 항복 협약을 맺고 섬을 떠남(1530년 몰타로)
  basis:
    type: primary_source
    refs: ["로도스 항복 협약(1522)"]
    foundingNote: 기사단이 로도스를 차지한 1310년을 시작으로 봄. 지도에는 1310~1521년 도데카니사 쪽만 표시

- id: morea-despotate
  level: polity
  names: { ko: 모레아 전제공국, en: Despotate of the Morea, native: Δεσποτάτο του Μορέως }
  from: 1349
  to: 1460
  color: "#8e5fa8"
  summary: 비잔티움 황족(팔라이올로고스 가문)이 펠로폰네소스(미스트라스)를 다스린 전제공국. 1453년 콘스탄티노폴리스 함락 뒤 형제 토마스·데메트리오스가 오스만에 공물을 바치며 다투다 1460년 메흐메트 2세가 정복함. 메토니·코로니·나우플리오 등 항구는 베네치아 땅이었음
  basis:
    type: primary_source
    refs: ["크리토불로스, 메흐메트 2세의 역사"]
    foundingNote: 마누엘 칸타쿠제노스가 전제공이 된 1349년을 시작으로 봄. 지도에는 1453~1459년 펠로폰네소스 전체로 표시(베네치아 항구는 근사). 1452년까지는 황제의 아들·형제가 다스린 동로마 제국 안의 자치 단위라 동로마 제국 땅으로 그림(M-②(바), 작업 M1)

- id: trebizond
  level: polity
  names: { ko: 트레비존드 제국, en: Empire of Trebizond, native: Βασιλεία τῆς Τραπεζοῦντος }
  from: 1204
  to: 1461
  color: "#9b6fb5"
  summary: 콤네노스 가문이 흑해 남동 기슭(트라브존·리제·케라수스)을 다스린 비잔티움 계승 국가. 1456년부터 오스만에 공물을 바쳤고 아크코윤루의 우준 하산과 손잡았으나 1461년 메흐메트 2세에게 항복함
  basis:
    type: primary_source
    refs: ["크리토불로스, 메흐메트 2세의 역사"]
    foundingNote: 알렉시오스 1세가 트라브존을 차지한 1204년을 시작으로 봄. 지도에는 1300~1460년 트라브존·리제·귀뮈샤네와 라지스탄(아르트빈 서부)으로 대략 표시

- id: serbian-despotate
  level: polity
  names: { ko: 세르비아 전제공국, en: Serbian Despotate, native: Српска деспотовина }
  from: 1402
  to: 1459
  color: "#a06ab0"
  summary: 브랑코비치 가문의 세르비아(수도 스메데레보, 노보브르도의 은광). 오스만과 헝가리 사이에서 공물을 바쳤고, 1455년 노보브르도와 남부를 잃어 1456년 초 강화로 넘겼으며 1459년 6월 스메데레보가 함락되어 무너짐
  basis:
    type: primary_source
    refs: ["1456년 오스만과의 강화"]
    foundingNote: 스테판 라자레비치가 비잔티움 황제에게 전제공 칭호를 받은 1402년을 시작으로 봄. 지도에는 1402~1458년만 표시(남부·코소보는 1455년까지). 1403~1427년 베오그라드, 1412년부터 브란코비치 땅, 1423년부터 제타(1421 유언)를 더하고, 1439년 스메데레보·1441년 노보브르도 함락으로 1443년까지 오스만, 1444년 되살아남(작업 M1)

- id: bosnia-kingdom
  level: polity
  names: { ko: 보스니아 왕국, en: Kingdom of Bosnia, native: Kraljevina Bosna }
  from: 1377
  to: 1463
  color: "#a0a0f0"
  summary: 코트로마니치 가문의 왕국. 헝가리와 오스만 사이에서 공물을 바치다 1463년 메흐메트 2세에게 정복되고 마지막 왕 스테판 토마셰비치가 처형됨. 같은 해 말 헝가리의 마티아스가 야이체를 되찾아 야이체·스레브레니크 바나트를 둠
  basis:
    type: primary_source
    refs: ["1463년 오스만의 보스니아 원정"]
    foundingNote: 트브르트코 1세가 왕으로 대관한 1377년을 시작으로 봄. 지도에는 1377~1462년만(그전은 보스니아 바나트 항목, 1390~1393년 달마티아 포함, 작업 M2) 표시(1447년까지 코사차 가문의 훔(헤르체고비나)을 포함, 작업 M1)

- id: herzegovina
  level: polity
  names: { ko: 헤르체고비나 공국, en: Duchy of Saint Sava (Herzegovina), native: Херцеговина }
  from: 1448
  to: 1482
  color: "#6fa0a0"
  summary: 스테판 부크치치 코사차가 '성 사바의 헤르체그(공작)'를 칭한 훔 땅의 공국(블라가이·모스타르·트레비녜·헤르체그노비). 1465~1466년 오스만이 블라가이 등 대부분을 차지하고 1470년 헤르체고비나 산자크를 두었으며, 아들 블라트코가 지키던 헤르체그노비가 1482년 함락되어 끝남
  basis:
    type: primary_source
    refs: ["헤르체고비나 산자크 설치(1470)"]
    foundingNote: 스테판이 헤르체그 칭호를 쓴 1448년을 시작으로 봄. 지도에는 1448~1465년만 표시(1466~1482년 헤르체그노비 쪽 남은 땅은 작아 오스만으로 그린 근사)

- id: albanian-league
  level: polity
  names: { ko: 레저 동맹 (스칸데르베그의 알바니아), en: League of Lezhë, native: Lidhja e Lezhës }
  from: 1444
  to: 1479
  color: "#5a7fb0"
  summary: 스칸데르베그(게르기 카스트리오티)가 이끈 알바니아 귀족들의 동맹(크루여·디바르·마트). 오스만의 여러 차례 크루여 포위를 물리쳤으나 1468년 그가 죽은 뒤 크루여는 베네치아 수비대가 지켰고, 1478년 함락되어 1479년 콘스탄티노폴리스 조약으로 베네치아의 슈코드라와 함께 오스만 땅이 됨
  basis:
    type: primary_source
    refs: ["레저 회의(1444)", "콘스탄티노폴리스 조약(1479)"]
    foundingNote: 레저 회의가 열린 1444년을 시작으로 봄. 지도에는 1444~1478년 알바니아 중북부(크루여가 있는 두러스주·디바르·쿠커스·엘바산·레저)로 대략 표시(베네치아의 두러스·레즈허 시가지는 근사)

- id: karaman-beylik
  level: polity
  names: { ko: 카라만 베이국, en: Karamanid Beylik, native: Karamanoğulları Beyliği }
