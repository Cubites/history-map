- id: gaelic-irish-lordships
  level: polity
  names: { ko: 아일랜드 게일 영주들 (묶음), en: Gaelic Irish lordships (grouped), native: Tiarnais Ghaelacha }
  from: 1171
  to: 1603
  color: "#d0b060"
  summary: 잉글랜드 왕의 아일랜드 영주령 밖에서 스스로 다스린 게일 왕·영주들(티르 에오가인의 오닐, 티르 코나일의 오도널, 토먼드의 오브라이언, 브레프니의 오라일리·오루크, 렌스터의 맥머로 캐버나 등)과 게일화한 앵글로노르만 가문(코노트의 버크 가문)을 묶은 항목. 14세기에 브루스의 침공(1315~1318)·얼스터 백작의 살해(1333)·흑사병을 거치며 넓어졌고, 15세기 말 왕의 실제 지배는 더블린 둘레의 페일까지 줄어듦. 헨리 8세의 항복과 재수여(1541~1543)로 큰 영주들이 백작이 되었고, 9년 전쟁(1594~1603) 끝에 1603년 멜리폰트 조약으로 튜더의 정복이 끝남
  mapNote: 헨리 2세의 침공(1171) 뒤의 게일 영주들을 묶어 그림(그전은 아일랜드 왕국들 묶음). 1542년부터는 항복과 재수여로 왕의 봉신이 된 것으로 보아 아일랜드 왕국(9년 전쟁 중의 땅은 그리지 않음). 지도에는 1171~1541년 얼스터 서부·브레프니·오리엘·위클로(1300~), 클레어(1318~), 얼스터 백작령과 코노트(1333~), 미들랜즈와 칼로(1369~)를 군 단위로 대략 표시
  endNote: 9년 전쟁(1594~1603) 끝에 1603년 티론 백작 휴 오닐이 멜리폰트 조약으로 항복하며 튜더의 정복이 끝남
  features:
    - 14세기에 브루스의 침공(1315~1318)·얼스터 백작의 살해(1333)·흑사병을 거치며 넓어짐
    - 15세기 말 왕의 실제 지배는 더블린 둘레의 페일까지 줄어듦
    - 헨리 8세의 항복과 재수여(1541~1543)로 큰 영주들이 백작이 됨
  startEvents: [ireland-normans-1166]
  endEvents: [irish-nine-years-war-1601]
  basis:
    type: primary_source
    refs: ["킬케니 법령(1366)", "아일랜드 왕국법(1541)", "멜리폰트 조약(1603)"]
    # 작업 메모: (작업 FIX2, 정할 점 FIX2-⑤) / 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1171년부터로 넓힘 / 헨리 2세의 침공(1171) 뒤의 게일 영주들을 이 항목으로 봄(그전은 작업 M5의 아일랜드 왕국들 묶음) / ⑦대로
    foundingNote: 헨리 2세의 침공이 있었던 1171년을 시작으로 봄

- id: nogai-horde
  level: polity
  names: { ko: 노가이 오르다, en: Nogai Horde, native: Ногай Ордасы }
  from: 1440
  to: 1634
  color: "#e0a0a0"
  summary: 에디게이의 망기트 부족이 킵차크 칸국(대오르다)에서 떨어져 나와 볼가강과 우랄강(야이크강) 사이 초원에 세운 유목 연합(중심지 사라이치크). 칸을 두지 않고 비(beg)·미르자가 다스렸으며 바시키르에게서 공물을 받음. 1555~1557년 이스마일이 모스크바에 신속하고 1557년 카지 미르자가 볼가강을 건너 쿠반 쪽에 소노가이를 세우며 갈라졌고, 1630년대 칼미크에게 밀려 무너짐
  mapNote: 지도에는 1440~1555년 지도 범위 안의 사마라·바시키르·오렌부르크 서부와 1523~1555년(1523년 무렵 카자흐에게서 땅을 되찾고 그해 봄 아스트라한에 들어온 크림 칸을 그해 죽여 볼가강 아래쪽을 쥔 해부터) 볼고그라드주의 볼가강 쪽과 사라토프를 표시(볼고그라드주 서쪽의 돈강 쪽 초원은 비움). 1556년부터는 대노가이의 신속으로 러시아 땅, 우랄강 동쪽(지도 범위 밖)은 칠하지 않음
  endNote: 1630년대 칼미크에게 거듭 패해 1634년 무렵 무너짐. 많은 노가이가 남쪽 쿠반 쪽이나 크림 칸국이 종주로 있는 흑해 북쪽 초원으로 옮겨 감
  features:
    - 칸을 두지 않고 비(beg)·미르자가 다스림
    - 바시키르에게서 공물을 받음
    - 1555~1557년 이스마일이 모스크바에 신속하고 1557년 카지 미르자가 쿠반 쪽에 소노가이를 세우며 갈라짐
  startEvents: [golden-horde-breakup-1437]
  endEvents: [kalmyk-nogai-1630]
  basis:
    type: primary_source
    refs: ["모스크바 대사청 문서(노가이 관계 문서)", "지기스문트 폰 헤르베르슈타인, 『모스크바 사정』(1549)"]
    # 작업 메모: (정할 점 M1-⑪) / (작업 FIX2, 정할 점 FIX2-⑦. 세션 J에서 1521 → 1523, 정할 점 J1-②) / (D3-⑨)
    foundingNote: 망기트가 대오르다에서 떨어져 나온 1440년 무렵을 시작으로 봄

- id: georgia-kingdom
  level: polity
  names: { ko: 조지아 왕국, en: Kingdom of Georgia, native: საქართველოს სამეფო }
  from: 1008
  to: 1490
  color: "#a05070"
  summary: 바그라트 3세가 아브하지아 왕국과 카르틀리를 합쳐 세운 바그라티온 왕조의 왕국. 다비드 4세·타마르 때 전성기를 맞았고, 몽골의 침입 뒤 1259년 서쪽이 따로 왕국(이메레티)이 되었다가 1329~1330년 게오르기 5세 '빛나는 왕'이 다시 합침. 1386~1403년 티무르의 침공으로 무너졌고 알렉산드레 1세(1412~1442) 뒤 아들들 사이에 나뉘어, 1490년 왕실 회의가 카르틀리·카헤티·이메레티 세 왕국으로의 분할을 받아들임
  mapNote: 지도에는 1008~1489년 지금의 조지아(1300~1329년 서조지아는 서조지아 왕국 항목, 로리·타오 같은 옛 땅은 비움)를 표시. 삼츠헤 아타베그국(14~15세기 반쯤 따로)은 1489년까지 이 나라로 그림. 1200~1239년에는 타마르 시대의 남쪽 땅(자카리드 가문의 로리·시라크·아니·아라가초트른·코타이크, 타오·아르다한, 1206년부터 카르스)도 왕국 안의 봉토로 그리고, 1236~1239 몽골 정복 뒤 1240년부터 비움
  endNote: 1490년 왕실 회의가 카르틀리·카헤티·이메레티 세 왕국으로의 분할을 받아들여 끝남(자료마다 1490~1493년)
  features:
    - 다비드 4세·타마르 때 전성기를 맞음
    - 1220~1222년 수부타이·제베가 쳐들어왔고 루수단 여왕은 1226년 트빌리시를 약탈당해 쿠타이시로 옮긴 뒤 1243년 몽골에 복속함
    - 1259년 서쪽이 따로 왕국(이메레티)이 되었다가 1329~1330년 게오르기 5세 '빛나는 왕'이 다시 합침
    - 게오르기 5세는 1330년대 중반 일 칸국이 무너지자 공물을 끊고 몽골 세력을 몰아냄
    - 1386~1403년 티무르의 침공으로 무너졌고 알렉산드레 1세(1412~1442) 뒤 아들들 사이에 나뉨
  startEvents: [basil-ii-1000]
  endEvents: [georgia-split-1463]
  basis:
    type: primary_source
    refs: ["『카르틀리스 츠호브레바』(조지아 연대기)", "1490년 왕실 회의(다르바지)"]
    # 작업 메모: (작업 FIX2·FIX2b, 정할 점 FIX2-⑥) / 작업 M3에서 1200년부터로 넓힘 1200~1239년에는 타마르 시대의 남쪽 땅(자카리드 가문의 로리·시라크·아니·아라가초트른·코타이크, 타오·아르다한, 1206년부터 카르스)도 왕국 안의 봉토로 그리고(운영자 승인 FIX2-⑥의 범위, M-②(바)), 1236~1239 몽골 정복 뒤 1240년부터 비움(작업 M3 검토 반영, 정할 점 M3-⑤) / 작업 M4에서 1008년부터로 넓힘 / 지도에는 1200년부터 표시하고,
    foundingNote: 바그라트 3세가 통일 왕이 된 1008년을 시작으로 봄

- id: west-georgia-kingdom
  level: polity
  names: { ko: 서조지아 왕국 (이메레티), en: Kingdom of Western Georgia (Imereti), native: იმერეთის სამეფო }
  from: 1259
