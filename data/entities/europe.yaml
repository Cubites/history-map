  basis:
    type: primary_source
    refs: ["코소보 독립 선언(2008)", "코소보 공화국 헌법(2008)", "국제 사법 재판소 권고 의견(2010)"]
    foundingNote: 독립을 선언한 2008년 2월 17일을 시작으로 봄. 영토는 귀속 논쟁 지역 항목(kosovo-disputed)

# 체코·슬로바키아
