  from: 1276
  to: 1344
  color: "#e0c040"
  summary: 아라곤 왕 하이메 1세의 유언으로 둘째 아들 하이메 2세가 받은 왕국(발레아레스 제도·루시용·세르다냐·몽펠리에, 1276). 1279년 페르피냥 조약으로 아라곤 왕의 봉신이 되었고 1285~1298년 아라곤에 빼앗겼다가 아나니 조약으로 되찾음. 1343년 아라곤 왕 페드로 4세가 마요르카 섬을, 1344년 루시용을 차지해 합침(하이메 3세는 1349년 마요르카를 되찾으려다 죽음)
  mapNote: 아라곤의 봉신이지만 따로 왕을 둔 나라라 따로 그림. 지도에는 1276~1343년 발레아레스 제도와 루시용·세르다냐(피레네조리앙탈도)를 표시하고 몽펠리에(1349 프랑스에 팖)는 근사
  endNote: 1343년 아라곤 왕 페드로 4세가 발레아레스 제도를, 1344년 루시용과 세르다냐까지 차지해 합침. 하이메 3세는 1349년 마요르카를 되찾으려다 죽음
  features:
    - 1279년 페르피냥 조약으로 아라곤 왕의 봉신이 됨
    - 1285년 프랑스 왕 필리프 3세가 마요르카 왕이 열어 준 길로 카탈루냐에 쳐들어감
    - 1285~1298년 아라곤에 빼앗겼다가 아나니 조약으로 되찾음
