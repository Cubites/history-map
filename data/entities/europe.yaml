    - 베르사유 체제를 깨뜨려 1935년 자르를 되찾고 재군비를 선언했으며 1936년 라인란트에 진주함
    - 1935년 뉘른베르크법으로 유대인의 시민권을 빼앗았고, 뒤에 유대인 학살(홀로코스트)을 저지름
    - 1938년 오스트리아와 주데텐란트, 1939년 3월 체코와 메멜을 차지함
    - 1939년 9월 폴란드를 침공해 2차 대전을 일으켰고 1940~1941년 유럽 대부분을 점령함
