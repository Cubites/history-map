    - 카이쿠바드 1세(재위 1220~1237)가 지중해 항구 알라냐(1221)를 얻고 1230년 야시차멘에서 호라즘의 잘랄 앗딘을 물리침
    - 코니아에는 몽골을 피한 학자와 신비가가 모였고 시인 잘랄 앗딘 루미도 1228년 무렵 정착함
    - 1243년 쾨세다그 전투로 몽골에 진 뒤 일한국의 종속국이 되었고 13세기 말에는 일한국 총독이 실제로 다스림
