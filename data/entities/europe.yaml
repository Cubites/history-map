    - 800년 무렵 머시아의 코엔울프가 남동부를 다스렸으나 825년 엘렌던 전투로 남동부가 웨식스로 넘어감
    - 바이킹의 정복(867 요크·869 동앵글리아·877 동머시아)과 앨프레드의 머시아(886)를 거침
