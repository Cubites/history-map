    - 1992년 7월 17일 슬로바키아 의회가 주권 선언을 채택하고 9월 슬로바키아 헌법이 채택됨
    - 1993년 1월 19일 체코와 함께 유엔에 가입함
    - 2004년 북대서양 조약 기구(NATO)와 유럽 연합에 가입함
    - 2008년 코소보의 독립을 승인하지 않은 유럽 연합 회원국의 하나임
  startEvents: [czech-slovak-split-1993]
