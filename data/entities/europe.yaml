  mapNote: 지도에는 1166~1216년 라슈카·제타·코소보·훔을 표시하고 1217년부터 세르비아 왕국(이름만 바뀌어 이어짐, 같은 색)
  endNote: 1217년 스테판이 교황 호노리우스 3세가 보낸 왕관으로 대관해 세르비아 왕국이 됨
