- id: galicia-volhynia
  level: polity
  names: { ko: 갈리치아-볼히니아 왕국, en: Kingdom of Galicia–Volhynia, native: Королівство Руське / Regnum Russiae }
  from: 1199
  to: 1349
  color: "#8fc0d8"
  summary: 로만 므스치슬라비치가 할리치와 볼로디미르를 합쳐 세운 루스의 왕국(1253 다닐로의 대관, '루스 왕국'). 킵차크 칸국에 공납함. 1340년 볼레스와프-유리 2세가 독살된 뒤 볼히니아는 리투아니아의 류바르트, 할리치나는 보야르 드미트로 데드코가 차지했고 1349년 폴란드 왕 카지미에시 3세가 할리치나(르비우)를 차지해 폴란드와 리투아니아가 나눔(1340~1392 갈리치아-볼히니아 전쟁)
  mapNote: 할리치와 볼로디미르가 합쳐진 1199년을 시작으로 봄. 1214~1220년 할리치나는 스피시 조약(1214)에 따른 헝가리 왕자 칼만의 갈리치아 왕국이라 헝가리 색. 지도에는 1199~1348년만 표시(볼히니아는 1339년까지). 1340~1348년 데드코의 할리치나도 이 나라로 그림(근사)
  endNote: 1340년 볼레스와프-유리 2세가 독살된 뒤 볼히니아는 리투아니아의 류바르트가, 할리치나는 보야르 드미트로 데드코가 차지함. 1349년 폴란드 왕 카지미에시 3세가 할리치나(르비우)를 차지해 폴란드와 리투아니아가 나눔
  features:
    - 1205년 로만이 폴란드에서 전사해 어린 두 아들만 남았고, 헝가리 왕 언드라시 2세와 폴란드의 레셰크가 땅을 노림
    - 1214년 스피슈 협정으로 헝가리 왕자 콜로만이 갈리치아의 왕으로 나섰다가 1219년 므스티슬라프에게 쫓겨남
    - 다닐로는 1229년 볼히니아, 1238년 갈리치아를 되찾았으나 1240~1241년 몽골의 침공으로 볼로디미르와 할리치가 크게 부서짐
    - 1245년 야로슬라우 전투에서 경쟁자 로스티슬라프를 물리쳤고, 같은 해 무렵 바투를 찾아가 신종했으며 킵차크 칸국에 공납함
    - 1256년 무렵 다닐로가 아들 레프의 이름을 딴 리비우를 세움
  startEvents: [igor-galicia-1185, galicia-volhynia-1205]
  endEvents: [poland-reunification-1320, lithuania-gediminas-1316]
  basis:
    type: primary_source
    refs: ["갈리치아-볼히니아 연대기", "카지미에시 3세와 류바르트의 조약(1352·1366)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1199년부터로 넓힘 / 정할 점 M3-⑨ / 작업 M2
    foundingNote: 할리치와 볼로디미르가 합쳐진 1199년을 시작으로 봄

- id: rus-principalities
  level: polity
  names: { ko: 루스 공국들 (묶음), en: Rus' principalities (grouped), native: Русские княжества }
  from: 1132
  to: 1392
  color: "#c8c890"
  summary: 키예프 대공 므스티슬라프가 죽은 1132년 키예프 루스가 갈라진 뒤, 따로 서지 않은 루스 공국들. 1300~1391년에는 블라디미르 대공위의 땅과 그 분봉 공국, 폴로츠크·키이우 등이 있었고 모두 킵차크 칸국에 공납함. 블라디미르 대공위는 트베리·모스크바·수즈달이 다투다 1363년 드미트리 돈스코이가 되찾은 뒤 모스크바 땅이 됨. 수즈달-니즈니노브고로드 대공국은 1392년 바실리 1세가 합침
  details: 키예프 루스가 갈라진 뒤(1132) 따로 서지 않은 루스 공국들을 묶은 항목. 1300~1391년에는 블라디미르 대공위의 땅과 그 분봉 공국(로스토프·야로슬라블·코스트로마·갈리치·우글리치·벨로오제로·수즈달-니즈니노브고로드), 폴로츠크·비텝스크·투로우-핀스크(1320 리투아니아), 키이우·체르니히우-세베르스크와 위쪽 오카강 공국들(1362 리투아니아)로, 모두 킵차크 칸국에 공납함. 블라디미르 대공위는 트베리(1304~1318·1322~1327)·모스크바(1318~1322·1328~)·수즈달(1360~1362)이 야를릭을 다투었고, 1363년 드미트리 돈스코이가 되찾은 뒤 모스크바 땅이 됨. 수즈달-니즈니노브고로드 대공국은 1392년 바실리 1세가 합침
  mapNote: 키예프 대공 므스티슬라프가 죽은 1132년을 시작으로 봄. 로스토프·야로슬라블(1463·1474 모스크바)은 1363년부터 모스크바째. 브랸스크(1310년까지 체르니히우 방계)와 민스크(1326년까지)는 포함하고 니즈니노브고로드주 남부의 모르드바 땅(1552년까지 비움)은 뺌. 모스크바·트베리·랴잔·노브고로드·프스코프·스몰렌스크처럼 1만 km²를 넘고 따로 움직인 공국은 따로 항목. 지도에는 1132~1391년만 표시(블라디미르 대공위 땅을 모스크바로 그리는 해는 1363년)
  endNote: 1392년 바실리 1세가 수즈달-니즈니노브고로드 대공국을 합침
  features:
    - 올고비치 가문(체르니히우)과 모노마호비치 가문이 대공 자리를 두고 오래 다툼
    - 1300~1391년에는 블라디미르 대공위의 땅과 그 분봉 공국, 폴로츠크·키이우 등이 있었고 모두 킵차크 칸국에 공납함
    - 블라디미르 대공위는 트베리·모스크바·수즈달이 다투다 1363년 드미트리 돈스코이가 되찾은 뒤 모스크바 땅이 됨
    - 투로우-핀스크(1320)와 키이우·체르니히우-세베르스크 등(1362)은 리투아니아 땅이 됨
  startEvents: [monomakh-kievan-fall-1113]
  endEvents: [timur-tokhtamysh-1388]
  basis:
    type: primary_source
    refs: ["라브렌티 연대기", "트로이차 연대기", "드미트리 돈스코이의 유언장(1389)"]
    # 작업 메모: 작업 M2 / 정할 점 M2-④, 기본값 / 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1132년부터로 넓힘 / 정할 점 M-③ / (M1과 같은 근사) / 작업 FIX3에서 브랸스크…를 더하고 …모르드바 땅…을 뺌
    foundingNote: 키예프 대공 므스티슬라프가 죽은 1132년을 시작으로 봄

- id: denmark-medieval
  level: polity
  names: { ko: 덴마크 왕국, en: Kingdom of Denmark, native: Danmarks rige }
  from: 958
  to: 1397
  color: "#c4685c"
  summary: 고름 노왕·하랄 푸른이빨 이래의 덴마크 왕국. 1332~1340년 크리스토페르 2세가 죽은 뒤 왕이 없이 홀슈타인 백작들이 나라를 저당 잡았고, 발데마르 4세(1340~1375)가 되찾아 1346년 에스토니아를 튜턴 기사단에 팔고 1360년 스코네, 1361년 고틀란드를 차지함. 1370년 슈트랄준트 조약으로 한자 동맹과 화해. 1375년 마르그레테의 아들 올라프가 왕이 되어 1380년 노르웨이와 동군, 1397년 칼마르 동맹
  mapNote: 하랄 푸른이빨이 왕이 된 958년 무렵을 시작으로 봄(그전 덴마크 왕국 (초기)에서 이름만 바뀌어 이어짐, 같은 색). 1397년부터 칼마르 동맹(이름만 바뀌어 이어짐, 같은 색). 지도에는 958~1396년 덴마크(슐레스비히 포함, 홀슈타인은 1460년 전 제국 봉토라 신성 로마 제국)·스코네(1332~1359 스웨덴)·덴마크령 에스토니아(1345년까지)·고틀란드(1361~1397)·홀슈타인·뤼베크(1201~1224)·북에스토니아(1220~1226, 1238년부터)를 표시
  endNote: 1397년 칼마르에서 에리크가 덴마크·노르웨이·스웨덴 세 나라의 왕으로 대관되어 칼마르 동맹으로 이름이 바뀌어 이어짐. 앞서 1380년 올라프가 노르웨이와 동군을 이루었음
  features:
    - 하랄 푸른이빨은 옐링에 룬석비를 세워 '덴마크 전체와 노르웨이를 얻고 덴마크인을 그리스도교인으로 만들었다'고 새김
    - 974년 신성 로마 제국의 오토 2세가 다네비르케를 빼앗았으나 983년 슬라브 반란 때 하랄이 되찾음
    - 1332~1340년 크리스토페르 2세가 죽은 뒤 왕이 없이 홀슈타인 백작들이 나라를 저당 잡음
    - 발데마르 4세(1340~1375)가 되찾아 1346년 에스토니아를 튜턴 기사단에 팔고 1360년 스코네, 1361년 고틀란드를 차지함
    - 1370년 슈트랄준트 조약으로 한자 동맹과 화해함
  startEvents: [scandinavia-denmark-sweden-804]
  endEvents: [kalmar-1397]
  basis:
    type: primary_source
    refs: ["슈트랄준트 조약(1370)", "칼마르 동맹 문서(1397)"]
    # 작업 메모: 작업 M3에서 1200년부터로 넓힘 / 작업 M4에서 1000년부터로 넓힘 / 작업 M5에서 958년부터로 넓힘 / 덴마크 왕국(초기)의 renames, 같은 색 / 작업 M2 / renames
    foundingNote: 하랄 푸른이빨이 왕이 된 958년 무렵을 시작으로 봄

- id: norway-medieval
  level: polity
  names: { ko: 노르웨이 왕국, en: Kingdom of Norway, native: Noregsveldi }
  from: 872
  to: 1397
  color: "#4f9a8a"
  summary: 하랄 미발왕이 통일한 노르웨이 왕국. 1262~1264년 아이슬란드·그린란드가 복속함. 1319년 망누스 에릭손이 스웨덴 왕과 겸하고(1343년 아들 호콘 6세에게 넘김), 1380년 올라프가 덴마크 왕과 겸해 마르그레테가 다스림. 1349년 흑사병으로 인구가 크게 줆. 1397년 칼마르 동맹
  mapNote: 하랄 미발왕의 하프르스피오르 전투(872 무렵)를 시작으로 봄. 1397년부터 칼마르 동맹(이름만 바뀌어 이어짐). 지도에는 872~1396년 노르웨이·보후슬렌·옘틀란드·아이슬란드·페로 제도를 표시(헤브리디스·맨섬 1265년까지, 아이슬란드 1262). 동군 연합(1319~1343 스웨덴, 1380~1396 덴마크)은 따로 그림. 핀마르크(사미 땅)는 바르되후스 성을 지은 1307년부터 그림(그전 비움, 트롬스는 처음부터)
  endNote: 1397년 칼마르에서 에리크가 세 나라의 왕으로 대관되어 칼마르 동맹에 들어감. 앞서 1380년 올라프가 덴마크 왕을 겸해 마르그레테가 다스렸음
  features:
    - 하랄에 반발한 족장 일부가 아이슬란드, 오크니, 헤브리디스, 맨섬, 아일랜드로 옮겨 갔다고 전함
    - 하랄의 아들 에이리크 피도끼왕이 934년 이복동생 호콘 선량왕에게 쫓겨나 잉글랜드에서 요크의 왕이 됨
