- id: umayyad-caliphate
  level: polity
  names: { ko: 우마이야 칼리프국 (알안달루스), en: Umayyad Caliphate (al-Andalus), native: al-Khilāfa al-Umawiyya }
  from: 661
  to: 756
  color: "#3f8f6f"
  summary: 다마스쿠스의 우마이야 칼리프국. 711년 타리크 이븐 지야드가 과달레테 전투에서 서고트를 무너뜨리고 무사 이븐 누사이르와 함께 이베리아를 정복했으며(알안달루스), 720년 나르본을 차지해 셉티마니아까지 다스림. 750년 아바스 혁명 뒤에도 유수프 알피흐리 등 총독이 756년 압드 알라흐만 1세의 아미르국이 설 때까지 알안달루스를 다스림
  mapNote: 지도에는 지도 범위 안 부분만 711~755년 이베리아와 720~755년 셉티마니아를 표시. 아나톨리아·캅카스의 칼리프국 변경은 중동 나라라 비움
  endNote: 750년 아바스 혁명 뒤에도 총독들이 알안달루스를 다스리다 756년 압드 알라흐만 1세가 유수프 알피흐리를 꺾고 아미르를 칭해 코르도바 아미르국이 섬
  features:
