- id: scythian-kingdom
  level: polity
  names: { ko: 스키타이 왕국 (왕족 스키타이), en: Scythian kingdom (Royal Scythians), native: Skudat }
  from: -649
  to: -279
  color: "#a04828"
  summary: 흑해 북쪽 초원(이스트로스강~타나이스강)과 크림을 다스린 왕족 스키타이의 왕국. 7세기 서아시아 원정(마디에스)을 거쳐 초원의 주인이 되었고 513년 다레이오스 1세의 원정을 물리침(헤로도토스 4권, 이단티르소스 왕). 4세기 아테아스가 도나우강 남쪽 도브루자까지 넓혔으나 339년 필리포스 2세에게 죽고, 3세기 초 사르마티아인의 압박으로 큰 스키티아가 무너짐
  mapNote: 지도에는 기원전 650~281년 드니스테르강~돈강 초원(루한스크와 로스토프주의 돈강 오른쪽 포함)과 크림, 350 무렵~339년 도브루자(아테아스)를 표시하고 3세기 초(280 무렵)부터 스키타이 부족 묶음. 올비아·티라스·케르소네소스(422~)·보스포로스의 그리스 도시는 따로 그리거나 1만 km² 미만이라 근사
  endNote: 기원전 3세기 초 사르마티아 계통 유목민에게 초원을 내주며 큰 스키티아가 무너짐
  features:
