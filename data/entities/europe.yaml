    foundingNote: 1055년 연대기에 쿠만(폴로베츠)이 루스 국경에 처음 나타남

- id: baltic-tribes
  level: polity
  names: { ko: 발트 부족 (묶음), en: Baltic tribes (grouped) }
  from: 98
  to: 1289
  color: "#d0e070"
  summary: 나라를 이루지 않은 발트어계 부족들(프로이센인·리투아니아인·사모기티아인·쿠로니아인·젬갈레인·라트갈레인·셀로니아인)을 묶은 항목. 13세기에 리보니아의 검의 형제 기사단(1202)과 프로이센의 튜턴 기사단(1230)에게 차례로 정복되었고, 리투아니아인은 1236년 무렵 민다우가스 아래 대공국을 세움
  mapNote: 여러 발트 부족을 묶어 그림. 지도에는 98~1289년 표시(284~475년은 476년과 같은 땅, 드니프로강 상류·오카강 상류의 발트인은 700년까지, 야트빙기아는 983년까지). 1000년부터는 정복되기 전의 땅만 표시 — 리보니아(리가 둘레) 1206년까지, 라트갈레·셀로니아 1213년까지, 리투아니아·포메사니아 1235년까지, 바르미아·포게사니아 1239년까지, 메멜 1253년까지, 삼비아 1254년까지, 쿠를란트 1266년까지, 젬갈레 1289년까지
  endNote: 13세기에 리보니아의 검의 형제 기사단(1202)과 프로이센의 튜턴 기사단(1230)에게 차례로 정복됨. 튜턴 기사단은 1283년 수도비아 정복을 마친 것으로 보며, 리보니아의 기사단이 1290년 셈갈리아를 점령함
  features:
    - 1202년 검의 형제 기사단이 생겨 리보니아인·라트갈레인·셈갈레인을 정복하고 개종시키는 십자군이 이어짐
    - 튜턴 기사단은 1230년 마조프셰 공 콘라트 1세와 협약을 맺어 쿨머란트를 얻고 프로이센 부족들을 하나씩 정복해 감
    - 리투아니아인은 1236년 무렵 민다우가스 아래 대공국을 세움
  startEvents: [tacitus-germania-98]
  endEvents: [teutonic-prussia-1230]
  basis:
    type: primary_source
    refs: ["리보니아의 하인리히, 『리보니아 연대기』", "두스부르크의 페터, 『프로이센 연대기』"]
