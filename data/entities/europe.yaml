# ── 유럽 중세 3단계 1200~1299 (작업 M3, 2026-10-07, 영토는 scripts/geo/areas/europe.mjs의 '1200~1299 조각 소유표', 정할 점은 EUROPE_DRAFT.md 8.15) ──
- id: latin-empire
  level: polity
  names: { ko: 라틴 제국, en: Latin Empire, native: Imperium Romaniae }
  from: 1204
  to: 1261
  color: "#4a8fd8"
  summary: 제4차 십자군이 1204년 4월 콘스탄티노폴리스를 함락한 뒤 플랑드르 백작 보두앵 1세를 황제로 세운 라틴(서유럽) 제국. 1205년 아드리아노플 전투에서 불가리아의 칼로얀에게 지고, 1225년 니케아에 아시아 쪽 땅 대부분과 섬들을, 1230~1240년대 트라키아를 잃어 1247년 무렵 콘스탄티노폴리스 둘레만 남음. 1261년 7월 니케아의 장군 알렉시오스 스트라테고풀로스가 도시를 되찾아 끝남
  mapNote: 지도에는 1204~1260년 콘스탄티노폴리스·트라키아(1224·1246년까지)·갈리폴리반도(1234년까지)·니코메디아 쪽 비티니아 해안(1241년까지)·북에게해 섬들(1224년까지)을 표시. 아카이아·테살로니키 왕국은 봉신이라 따로 항목
  endNote: 1261년 7월 니케아의 장군 알렉시오스 스트라테고풀로스가 소수의 군사로 콘스탄티노폴리스에 들어가 되찾으면서 끝남. 황제 보두앵 2세는 서둘러 달아남
  features:
    - 제국을 황제가 4분의 1, 베네치아와 십자군 제후가 각각 8분의 3씩 나누기로 했으나 실제로 지배한 땅은 좁음
    - 1205년 아드리아노플 전투에서 불가리아의 칼로얀에게 져 보두앵 1세가 사로잡혔고 동생 앙리가 1206년부터 황제로 지킴
    - 앙리는 1211년 린다코스에서 니케아를 꺾고 1214년 님파이온 조약으로 소아시아 북서부를 얻었으나 1216년 죽은 뒤 제국이 약해짐
    - 1225년 니케아에 아시아 쪽 땅 대부분과 섬들, 1230~1240년대 트라키아를 잃어 1247년 무렵 콘스탄티노폴리스 둘레만 남음
  startEvents: [fourth-crusade-1202, latin-greek-states-1204]
  endEvents: [byzantine-restoration-1261]
  basis:
    type: primary_source
    refs: ["분할 조약(파르티티오 로마니에, 1204)", "조프루아 드 빌아르두앵, 『콘스탄티노폴리스 정복기』", "니키타스 호니아티스, 『역사』"]
