# 신성 로마 제국과 독일
- id: holy-roman-empire
  level: polity
  names: { ko: 신성 로마 제국 (영방 묶음), en: Holy Roman Empire (estates grouped), native: Heiliges Römisches Reich }
  from: 962
  to: 1806
  color: "#a8b48e"
  summary: 황제 아래 수백 개의 영방(제후국·교회령·제국 자유시)이 모인 나라. 지도에는 합스부르크 세습령·프로이센 땅·덴마크 왕의 홀슈타인·스웨덴령 포메른과 브레멘-페르덴·로렌을 뺀 영방(바이에른·작센·하노버·뷔르템베르크·팔츠·마인츠·쾰른·트리어 등)을 하나로 묶어 표시함. 30년 전쟁(1618~1648) 뒤 베스트팔렌 조약으로 영방의 주권이 넓어지고 포메른·브레멘-페르덴을 스웨덴에, 오버엘자스를 프랑스에 넘겼으며 스위스·네덜란드의 독립을 인정함. 1797~1801년 라인강 왼쪽을 프랑스에 넘기고 1803년 제국 대표자 회의 주요 결의로 교회령·자유시 대부분이 정리되었으며, 1806년 라인 동맹이 생기자 프란츠 2세가 제위를 내놓아 해체됨
  basis:
    type: primary_source
    refs: ["베스트팔렌 조약(1648)", "뤼네빌 조약(1801)", "제국 대표자 회의 주요 결의(1803)", "프란츠 2세의 제위 포기 선언(1806)"]
    foundingNote: 오토 1세가 황제 대관을 받은 962년을 시작으로 봄. 지도에는 1300년 이후만 묶음으로 표시(1300~1399년에는 리옹 1319년까지·케른텐 1334년까지·티롤 1362년까지·프랑슈콩테 1383년까지 포함, 작업 M2)(1525년까지 합스부르크 세습령·보헤미아 왕관령·튜턴 기사단국은 따로)

- id: confederation-of-the-rhine
  level: polity
  names: { ko: 라인 동맹 (묶음), en: Confederation of the Rhine (grouped), native: Rheinbund }
  from: 1806
  to: 1813
