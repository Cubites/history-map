    - 자이얀 이븐 마르다니시의 발렌시아는 1238년 아라곤의 하이메 1세에게 들어감
    - 이븐 마푸즈의 니에블라는 1234~1262년 이어짐
    - 후드 가문의 무르시아는 1243년 알카라스 조약으로 카스티야의 봉신이 됨
  startEvents: [las-navas-1212]
  endEvents: [alfonso-x-1252]
  basis:
    type: primary_source
    refs: ["이븐 할둔, 『이바르』", "알카라스 조약(1243)"]
    # 작업 메모: (정할 점 M-⑦) / (작업 M3)
    foundingNote: 이븐 후드가 무르시아에서 독립하는 등 이베리아의 무슬림 땅이 여러 소국으로 갈라진 1228년부터

- id: iceland-commonwealth
