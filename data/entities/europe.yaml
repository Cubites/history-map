  color: "#c2a6c9"
  summary: 다우가바강 남쪽(지금의 라트비아 서부·남부)의 공국으로 1561년 빌뉴스 조약 때 리보니아 기사단장 케틀러가 세움. 폴란드-리투아니아의 봉토였으나 러시아의 영향을 크게 받았고, 3차 폴란드 분할 때인 1795년 러시아에 합쳐짐
  basis:
