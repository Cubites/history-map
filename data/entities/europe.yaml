  basis:
    type: primary_source
    refs: ["독일 제국 헌법(1871)", "프랑크푸르트 조약(1871)"]

# 오스트리아
- id: austria
  level: polity
  names: { ko: 오스트리아 제국, en: Austrian Empire, native: Kaisertum Österreich }
  from: 1804
  to: 1867
  color: "#d6bd6e"
  summary: 합스부르크 왕가가 1804년 세운 제국. 프레스부르크 조약(1805)으로 베네치아·티롤을, 쇤브룬 조약(1809)으로 일리리아·잘츠부르크·서갈리치아를 잃었다가 1813~1814년 대부분 되찾음. 메테르니히가 빈 회의(1815)를 이끌고 롬바르디아·베네치아를 얻어 직접 지배하며 중부 이탈리아 공국들에도 영향력을 미침. 1848년 혁명을 누르고 1859년 롬바르디아, 1866년 베네치아를 잃었으며 프로이센에 져 독일 연방에서 밀려남. 1867년 헝가리와 타협해 오스트리아-헝가리 제국이 됨. 1864~1866년 홀슈타인은 가슈타인 협약에 따라 오스트리아가 관리한 땅으로 표시
  basis:
    type: primary_source
    refs: ["프레스부르크 조약(1805)", "쇤브룬 조약(1809)", "빈 회의 최종 의정서(1815)", "취리히 조약(1859)", "프라하 조약(1866)"]
    foundingNote: 프란츠 2세가 오스트리아 황제를 칭한 1804년을 시작으로 봄

- id: austria-hungary
  level: polity
  names: { ko: 오스트리아-헝가리 제국, en: Austria-Hungary, native: Österreich-Ungarn }
