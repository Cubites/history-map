    - 1450년 프란체스코 스포르차가 공작이 되고 로디 화약(1454)으로 이탈리아의 세력 균형을 이룸
    - 1499년 루이 12세가 정복해 1504~1505년 리옹·블루아 조약과 황제의 서임으로 프랑스 땅이 됨
    - 1512~1515년 마시밀리아노 스포르차가 잠시 돌아왔다가 마리냐노 전투(1515)로 다시 프랑스 땅이 됨
    - 캉브레 화약(1529)·볼로냐 화의(1530)로 프란체스코 2세 스포르차가 돌아옴
  startEvents: [visconti-milan-1385]
