    # 작업 메모: 작업 M5 / (정할 점 M5-③) / 작업 M6에서 700년부터로 넓힘(옹겐두스, 그전 데인인·유트인은 게르만 부족(묶음), 정할 점 M6-⑪, 독립 검토 반영)
    foundingNote: 8세기 데인인 왕의 첫 기록을 시작으로 봄

- id: croatia-duchy
  level: polity
  names: { ko: 크로아티아 공국, en: Duchy of Croatia, native: Kneževina Hrvatska }
  from: 800
  to: 925
  color: "#d06090"
  summary: 달마티아 내륙(닌·클리스)의 크로아티아인 공국. 비셰슬라브·보르나 때 프랑크의 종주(812 아헨 조약)를 받았고 트르피미르(845~864)·도마고이·브라니미르(879 교황 요한 8세의 인정)가 자립했으며, 토미슬라브(910~928)가 판노니아 크로아티아를 합쳐 925년 왕이 됨
  mapNote: 지도에는 800~924년 달마티아 크로아티아·리카·크바르네르·서보스니아를 표시하고 925년부터 크로아티아 왕국(이름만 바뀌어 이어짐, 같은 색). 동로마의 달마티아 도시들은 근사
  endNote: 토미슬라브가 판노니아 크로아티아를 합쳐 925년 왕이 되어 크로아티아 왕국으로 이어짐
  features:
    - 비셰슬라브·보르나(810 무렵~821) 때 카롤루스 제국의 종주(812 아헨 조약)를 받아들임
    - 자다르·스플리트·트로기르·라구사 같은 해안 도시는 동로마 땅으로 남음
    - 트르피미르(845~864)가 트르피미로비치 가문을 열었고 도마고이·즈데슬라브·브라니미르가 이음
    - 879년 교황 요한 8세가 브라니미르를 공으로 인정한 편지는 자립의 증거로 꼽힘
  startEvents: [croatia-serbia-800]
  endEvents: [croatia-serbia-800]
  basis:
    type: primary_source
    refs: ["트르피미르 헌장(852)", "교황 요한 8세의 서한(879)", "콘스탄티노스 7세, 『제국 통치론』"]
    # 작업 메모: 작업 M5
    foundingNote: 비셰슬라브(800 무렵)를 시작으로 봄

- id: south-slavic-principalities
  level: polity
  names: { ko: 남슬라브 공국들 (묶음), en: South Slavic principalities (grouped), native: Србија · Дукља · Травунија · Захумље · Паганија }
  from: 527
  to: 1000
  color: "#60b0b0"
  summary: 동로마의 종주 아래 있던 세르비아(블라스티미로비치 가문)·두클랴·트라부니아·자훔리예·파가니아(네레트바)와 보스니아를 묶은 항목. 924년 불가리아의 시메온이 세르비아를 정복했으나 933년 무렵 차슬라프가 동로마의 도움으로 되살렸고, 차슬라프가 죽은 뒤(960 무렵) 보스니아는 크로아티아, 라스는 동로마(971)·사무일(976)에게 넘어감
  mapNote: 왈라키아의 스클라베니(527)를 시작으로 봄(세르비아 공 비셰슬라브는 8세기 말). 1000년부터 두클랴(요반 블라디미르)로 이어짐(같은 색). 여러 공국을 묶어 그림. 지도에는 527~999년 표시(527 왈라키아의 스클라베니, 568 카란타니아, 587 펠로폰네소스, 615 발칸 내륙의 스클라비니아, 783 그리스는 동로마, 800 크로아티아 공국). 800~999년 두클랴·트라부니아·자훔리예·파가니아·슈코드라, 923년까지와 933~970년 라슈카, 959년까지 보스니아, 841년까지 북마케도니아·코소보·남모라바의 스클라비니아를 표시하고, 알바니아 내륙·서마케도니아·블라고에브그라드(800~841)와 소피아주·페르니크·큐스텐딜·티모크·브라니체보·피로트(800~808, 세르디카 시는 동로마)도 스클라비니아로 그림
  endNote: 960년 무렵 차슬라프가 죽은 뒤 보스니아는 크로아티아, 라스는 동로마(971)·사무일(976)에게 넘어갔고 1000년부터 두클랴(요반 블라디미르)로 이어짐
  features:
    - 블라스티미르(830년대~850 무렵)가 불가리아 제1제국의 프레시안을 막음(839~842)
    - 887년 베네치아 도제 피에트로 칸디아노 1세가 네레트바 해적과 싸우다 죽음
    - 924년 불가리아의 시메온이 세르비아를 정복했으나 933년 무렵 차슬라프가 동로마의 도움으로 되살림
    - 콘스탄티노스 7세의 『제국 통치론』은 차슬라프의 세르비아가 트라부니아·자훔리예·네레트바와 보스니아에 미쳤다고 적음
  startEvents: [slavs-sclaveni-527]
  endEvents: [basil-ii-1000]
  basis:
    type: primary_source
    refs: ["콘스탄티노스 7세, 『제국 통치론』", "『두클랴 사제의 연대기』"]
    # 작업 메모: (M-③) / (검토 반영) / (작업 M5) / 작업 M6에서 527년부터로 넓히고 시작 해를 527로 앞당김(527 왈라키아의 스클라베니, 568 카란타니아, 587 펠로폰네소스, 615 발칸 내륙의 스클라비니아, 783 그리스는 동로마, 800 크로아티아 공국, 정할 점 M6-⑧·⑨·⑩) / 작업 FIX4에서 알바니아 내륙·서마케도니아·블라고에브그라드(800~841)와 소피아주·페르니크·큐스텐딜·티모크·브라니체보·피로트(800~808, 세르디카 시는 동로마)도 스클라비니아로 그림(전에는 800년 표가 동로마 근사) / 묶음 항목
    foundingNote: 왈라키아의 스클라베니(527)를 시작으로 봄(세르비아 공 비셰슬라브는 8세기 말)

- id: great-moravia
  level: polity
  names: { ko: 대모라비아, en: Great Moravia, native: Veľká Morava }
  from: 833
  to: 907
  color: "#d07040"
  summary: 모이미르 1세가 833년 니트라의 프리비나를 쫓아내고 모라비아와 합친 서슬라브인의 나라. 라스티슬라프가 키릴로스와 메토디오스를 맞았고(863), 스바토플루크 1세(870~894) 때 판노니아(884 툴른)·보헤미아(890~894 종주)·비슬라니에까지 넓혔으나, 그가 죽은 뒤 마자르의 공격으로 902~907년 무너짐
  mapNote: 지도에는 833~906년 모라비아·슬로바키아와 884~893년 판노니아를 표시
  endNote: 894년 스바토플루크가 죽은 뒤 아들들이 다투었고 아르눌프가 끌어들인 마자르가 침입해 902~906년 무너뜨림. 907년 7월 프레스부르크 전투에서 마자르가 바이에른군을 크게 이김
  features:
    - 라스티슬라프(846~870)가 동프랑크의 간섭에서 벗어나려 862년 동로마 황제에게 슬라브어로 가르칠 사람을 청함
    - 863년 키릴로스와 메토디오스 형제가 글라골 문자와 슬라브어 전례를 가져옴
    - 스바토플루크 1세(870~894)가 874년 포르히하임 화약으로 공물을 바치는 조건 아래 사실상 독립을 지킴
    - 판노니아(884 툴른)·보헤미아(890~894 종주)·비슬라니에까지 넓힘
    - 885년 메토디오스가 죽고 교황 스테파노 5세가 슬라브어 전례를 금하자 제자들이 불가리아 제1제국으로 감
  startEvents: [great-moravia-833]
  endEvents: [great-moravia-833, magyars-838]
  basis:
    type: primary_source
    refs: ["『풀다 연대기』", "『메토디오스의 생애』", "콘스탄티노스 7세, 『제국 통치론』"]
    # 작업 메모: (정할 점 M5-⑪) / (작업 M5) / 875 무렵 비슬라니에(크라쿠프) 정복은 정할 점 M5-⑫
    foundingNote: 니트라 병합(833)을 시작으로 봄

- id: magyars
  level: polity
  names: { ko: 마자르 공국, en: Principality of the Hungarians, native: Magyar Fejedelemség }
  from: 838
  to: 1000
  color: "#5f93c0"
  summary: 하자르 칸국의 서쪽 초원(레베디아·에텔쾨즈)에 살던 마자르 부족 연합. 895년 불가리아·페체네그와 싸운 뒤 아르파드의 지휘로 카르파티아 분지에 정착했고(900 판노니아, 907 프레스부르크 전투), 955년 레히펠트 전투에서 진 뒤 게저(972)와 이슈트반 1세가 왕국으로 이음
  mapNote: 에텔쾨즈의 마자르가 다뉴브강 하류에 처음 기록된 해(838 무렵)를 시작으로 봄. 1000년부터 헝가리 왕국(같은 색). 지도에는 838~894년 에텔쾨즈, 895~999년 카르파티아 분지(트란실바니아는 1000년 지도처럼 비움)와 907~975년 동쪽 변경, 907~954년 모라비아를 표시
  endNote: 955년 레히펠트 전투에서 진 뒤 게저(972)가 정착과 개종을 이끌었고, 아들 이슈트반이 1000년 크리스마스(또는 1001년 1월 1일) 교황이 보낸 왕관으로 대관해 헝가리 왕국이 됨
  features:
    - 862년 『생베르탱 연대기』는 동프랑크에 처음 쳐들어온 '운그리'를 전함
    - 894~895년 마자르가 동로마의 청으로 불가리아를 친 사이 시메온과 손잡은 페체네그가 에텔쾨즈를 차지함
    - 아르파드가 이끄는 일곱 부족이 카바르 세 부족과 함께 베레츠케 고개를 넘어 카르파티아 분지로 들어옴
    - 899년 브렌타강에서 베렌가리오 1세를 꺾은 뒤 이탈리아·작센·바이에른·부르군트·프로방스까지 나아가 약탈함
    - 900년 판노니아, 902~906년 대모라비아를 차지했고 907년 프레스부르크에서 바이에른군을 이김
  startEvents: [magyars-838]
  endEvents: [stephen-hungary-1000]
  basis:
    type: primary_source
    refs: ["콘스탄티노스 7세, 『제국 통치론』", "『풀다 연대기』", "레기노, 『연대기』"]
    # 작업 메모: (정할 점 M5-⑬) / (작업 M5) / 1000년 표
    foundingNote: 에텔쾨즈의 마자르가 다뉴브강 하류에 처음 기록된 해(838 무렵)를 시작으로 봄

- id: khazar-khaganate
  level: polity
  names: { ko: 하자르 칸국, en: Khazar Khaganate, native: Xazar Xaqanlığı }
  from: 650
  to: 969
  color: "#b04848"
  summary: 볼가강 하류의 이틸을 도읍으로 한 튀르크계 유목 국가. 북캅카스(세멘데르)·돈강(830년대 사르켈)·크림 동부와 흑해 북쪽 초원을 다스리고 볼가 불가르·마자르·동슬라브 부족에게서 공납을 받았으며, 9세기 지배층이 유대교를 받아들임. 889~895년 페체네그가 서쪽 초원을 차지했고 965년 스뱌토슬라프가 사르켈을, 968~969년 이틸을 무너뜨림
  mapNote: 지도에는 지도 범위 안 부분만 650~968년 표시(650 볼가강 하류·다게스탄 북쪽, 668 대불가리아의 초원, 787 크림 고티아. 드니프로강 동쪽 초원과 크림은 894년, 돈강은 964년까지, 다게스탄은 북위 43.25° 북쪽의 저지대만). 지도 범위 밖(볼가강 동쪽)은 칠하지 않음
  endNote: 스뱌토슬라프가 965년 무렵 사르켈을, 968~969년 이틸을 무너뜨려 중심이 사라짐. 스뱌토슬라프가 소멸의 유일한 원인이었는지는 학자마다 달리 봄
  features:
    - 북캅카스(세멘데르)·돈강(830년대 사르켈)·크림 동부와 흑해 북쪽 초원을 다스림
    - 볼가 불가르·마자르·동슬라브 부족에게서 공납을 받음
    - 652년 발란자르에서 아랍군이 크게 졌고 737년 마르완 이븐 무함마드가 도읍 가까이 이르러 카간의 이슬람 수용 약속을 받음
    - 지배층이 9세기에 유대교를 받아들였다고 하나 연대는 갈림
    - 889~895년 페체네그가 서쪽 초원을 차지함
  startEvents: [khazars-650]
  endEvents: [svyatoslav-khazars-bulgaria-964]
  basis:
    type: primary_source
    refs: ["『원초 연대기』(965)", "이븐 하우칼, 『땅의 모습』", "하자르 서한(요셉 왕의 답장)"]
    # 작업 메모: (작업 M5) / 작업 M6에서 650년부터로 넓힘(650 볼가강 하류·다게스탄 북쪽, 668 대불가리아의 초원, 787 크림 고티아) / 지도에는 권역 안 부분만 800~
    foundingNote: 서돌궐에서 갈라진 650년 무렵을 시작으로 봄

- id: east-slavic-tribes
  level: polity
  names: { ko: 동슬라브 부족 (묶음), en: East Slavic tribes (grouped), native: Восточные славяне }
  from: 527
  to: 992
  color: "#c0d8a0"
  summary: 키예프 루스에 들기 전 동슬라브 부족들(일멘 슬로베네·크리비치·폴랴네·드레블랴네·세베랴네·라디미치·뱌티치·드레고비치·볼히냐네·울리치·티베르치·하얀 크로아티아인)을 묶은 항목. 남쪽 부족은 하자르에 공납했고, 862년 류리크의 노브고로드부터 992년 블라디미르의 크로아티아인 원정까지 원초 연대기가 적은 해에 루스로 들어감
  mapNote: 여러 부족을 묶어 나타냄. 지도에는 527~991년 부족마다 루스에 든 해(862·882·883·884·885·907·940·966·981·992) 전까지 표시(키이우·프라하-코르차크·펜코우카 문화, 527~601 안테스, 700 숲 지대). 476~526년 우크라이나 숲초원·키이우 문화 숲·볼히니아·갈리치아는 비움
  endNote: 992년 블라디미르의 크로아티아인 원정까지 부족들이 『원초 연대기』가 적은 해에 차례로 루스로 들어가 키예프 루스로 이어짐
  features:
