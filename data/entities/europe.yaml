- id: gallic-empire
  level: polity
  names: { ko: 갈리아 제국, en: Gallic Empire, native: Imperium Galliarum }
  from: 260
  to: 274
  color: "#e8902a"
  summary: 갈리에누스의 아들 살로니누스를 쾰른에서 죽이고 260년 스스로 황제가 된 포스투무스가 세운 분리 제국. 갈리아·게르마니아 두 속주·브리타니아와 히스파니아(269년까지)를 다스렸고, 빅토리누스·테트리쿠스가 이었으나 274년 샬롱 전투에서 테트리쿠스가 아우렐리아누스에게 항복함
  mapNote: 5년 넘게 따로 다스린 분리 제국이라 따로 그림. 지도에는 260~273년 갈리아·게르마니아 두 속주·헬베티아·브리타니아, 260~268년 히스파니아를 표시(260년 라이티아와 269년 플라키디아누스의 나르보넨시스 동부는 그리지 않음)
  endNote: 274년 샬롱 전투에서 테트리쿠스가 아우렐리아누스에게 항복함
  features:
