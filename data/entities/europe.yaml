    foundingNote: 엔히크에게 백국을 준 1096년을 시작으로 봄

- id: provence-early
  level: polity
  names: { ko: 프로방스 백국 (보소 가문), en: County of Provence (Bosonid), native: Comtat de Provença }
  from: 1033
  to: 1112
  color: "#e08a6a"
  summary: 사라센을 몰아낸 기욤 해방자(972) 이후 보소 가문이 다스린 프로방스 백국. 1032년 부르군트 왕 루돌프 3세가 죽고 신성 로마 황제가 부르군트(아를) 왕위를 이은 뒤에도 백작들이 실제로 다스림. 1112년 상속녀 두스가 바르셀로나 백작 라몬 베렝게르 3세와 혼인해 바르셀로나 가문으로 넘어감
  mapNote: 지도에는 1033~1111년 표시하고 1112년부터 프로방스 백국(바르셀로나 가문, 이름만 바뀌어 이어짐, 같은 색)
  endNote: 1112년 상속녀 두스가 바르셀로나 백작 라몬 베렝게르 3세와 혼인해 프로방스 계승권이 바르셀로나 가문으로 넘어감
  startEvents: [arles-burgundy-1003]
  endEvents: [aragon-barcelona-1112]
