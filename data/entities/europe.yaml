- id: urartu
  level: polity
  names: { ko: 우라르투, en: Urartu, native: Biainili }
  from: -859
  to: -589
  color: "#b05a2a"
  summary: 반호 둘레의 왕국(도읍 투슈파). 사르두리 1세(기원전 840년 무렵)가 세우고 메누아(810~786)·아르기슈티 1세(786~764)·사르두리 2세(764~735)가 아라라트 평야(782 에레부니)·세반호·유프라테스강 상류로 넓힘. 743·735 티글라트필레세르 3세, 714 사르곤 2세의 원정에 졌으나 이어졌고 7세기 루사 2세의 테이셰바이니를 거쳐 590년 무렵 메디아인에게 무너짐
  mapNote: 사르두리 1세의 왕국(기원전 860년 무렵)을 시작으로 봄. 우르미아호 쪽(이란)은 지도 범위 밖. 지도에는 기원전 800~783년 반·비틀리스·무시·아으르·으드르·하카리·엘라즈·빙굘(메누아), 782~591년 아라라트 평야·세반호·시라크·나흐치반·카르스·에르주룸·에르진잔·바이부르트·툰젤리(아르기슈티 1세)를 더해 표시하고 590년 무렵 무너진 뒤 비움(메디아는 이 지도에 없음)
  endNote: 기원전 590년 무렵 메디아인에게 무너짐(키루스가 547년 끝냈다는 설도 있음)
  features:
    - 기원전 9세기 중엽 아시리아 비문에 ‘우루아트리’로 나타남
    - 메누아(기원전 810~786)·아르기슈티 1세(786~764)가 아라라트 평야(782 에레부니)·세반호·유프라테스강 상류로 넓힘
    - 사르두리 2세(기원전 764~735) 때 가장 강했음
    - 기원전 743·735년 티글라트필레세르 3세와 714년 사르곤 2세의 원정에 졌으나 이어졌고 기원전 7세기에 루사 2세의 테이셰바이니를 거침
  startEvents: []
  endEvents: [urartu-phrygia-800bc]
  basis:
