# ── 유럽 중세 1단계 1400~1452 (작업 M1, 2026-10-07) ──
- id: byzantine-empire
  level: polity
  names: { ko: 동로마 제국, en: Byzantine Empire, native: Βασιλεία τῶν Ῥωμαίων }
  from: 395
  to: 1453
  color: "#7b3f8f"
  summary: 로마 제국이 동서로 나뉜 뒤(395) 콘스탄티노폴리스를 수도로 이어진 동쪽 로마 제국(비잔티움 제국). 1402년 앙카라 전투 뒤 1403년 갈리폴리 조약으로 테살로니키와 트라키아·마케도니아·테살리아 해안을 되찾았으나 1423년 테살로니키를 베네치아에 넘기고 1424년 오스만에 공물을 바치기로 함. 황족이 다스린 모레아 전제공국(펠로폰네소스)이 마지막까지 남았고, 1453년 5월 29일 메흐메트 2세에게 콘스탄티노폴리스가 함락되어 무너짐
  basis:
    type: primary_source
    refs: ["두카스, 『비잔티움사』", "스프란체스, 『연대기』", "갈리폴리 조약(1403)"]
    foundingNote: 테오도시우스 1세가 죽어 제국이 동서로 나뉜 395년을 시작으로 봄. 지도에는 1300~1399년 트라키아·마케도니아와 비티니아(1336년까지)·펠로폰네소스(1320년부터)·테살리아(1333~1347, 1371~1392 근사)·에피루스(1340~1347)의 줄어드는 땅(작업 M2), 1400~1452년 콘스탄티노폴리스(이스탄불주의 보스포루스 서쪽, 아시아 쪽은 오스만)와 모레아 전제공국(황제의 아들·형제가 다스린 자치 단위라 M-②(바)대로 동로마 땅, 1430년부터 아카이아 포함), 1403~1423년 갈리폴리 조약 땅(테살로니키·할키디키는 1422년까지, 트라키아 해안·마그네시아·북스포라데스)을 표시. 1424년 뒤 남은 메셈브리아·안키알로스·셀림브리아는 작아 오스만으로 둔 근사(작업 M1, EUROPE_DRAFT.md 8절)

- id: moravian-serbia
  level: polity
  names: { ko: 모라바 세르비아, en: Moravian Serbia, native: Моравска Србија }
  from: 1371
  to: 1402
  color: "#a06ab0"
  summary: 세르비아 제국이 무너진 뒤 라자르 흐레벨랴노비치가 모라바강 유역(크루셰바츠)에 세운 공국. 1389년 코소보 전투 뒤 아들 슈테판 라자레비치가 오스만의 봉신으로 다스렸고, 1402년 앙카라 전투 뒤 비잔티움 황제에게 전제공(데스포트) 칭호를 받아 세르비아 전제공국이 됨
  basis:
    type: primary_source
    refs: ["콘스탄틴 코스테네치, 『데스포트 슈테판 라자레비치 전기』"]
    foundingNote: 마리차 전투 뒤 라자르가 자립한 1371년을 시작으로 봄. 지도에는 1371~1401년만 표시하고 1402년부터는 세르비아 전제공국 항목(같은 색, 정할 점 M1-⑱). 브란코비치 땅(코소보)은 1411년까지 따로 항목(정할 점 M1-⑦)

- id: smolensk-principality
  level: polity
  names: { ko: 스몰렌스크 공국, en: Principality of Smolensk, native: Смоленское княжество }
  from: 1127
  to: 1404
  color: "#c47f9a"
  summary: 드네프르강 위쪽의 루스 공국. 1395년 리투아니아의 비타우타스가 차지했으나 1401년 유리 스뱌토슬라비치가 랴잔의 도움으로 되찾았고, 1404년 6월 비타우타스가 다시 차지해 리투아니아 대공국에 합침(뱌지마는 1403년)
  basis:
    type: primary_source
    refs: ["노브고로드 제1연대기", "니콘 연대기"]
    foundingNote: 므스티슬라프 대공이 죽고 로스티슬라프가 스몰렌스크를 물려받은 1127년을 시작으로 봄. 지도에는 1300~1394년(브랸스크는 1355년까지, 토로페츠·벨리는 1361년까지, 작업 M2)과 1401~1403년 스몰렌스크주(뱌지마 포함)만 표시(작업 M1, 정할 점 M1-⑰)

- id: sicily-kingdom
  level: polity
  names: { ko: 시칠리아 왕국, en: Kingdom of Sicily, native: Regnum Siciliae }
  from: 1130
  to: 1409
  color: "#9fc06f"
  summary: 1130년 루제루 2세가 세운 노르만 왕국. 1282년 시칠리아 만종 사건 뒤 섬은 아라곤 왕가가, 반도는 앙주 가문(나폴리 왕국)이 나눠 가졌음. 1409년 7월 마르티노 1세(소)가 죽어 아버지 아라곤 왕 마르티노 1세에게 넘어가 아라곤 왕관령이 됨(왕국 이름은 1816년까지 이어짐)
  basis:
    type: primary_source
    refs: ["카스페 협약(1412)", "시칠리아 의회 기록"]
    foundingNote: 루제루 2세가 왕으로 대관한 1130년을 시작으로 봄. 지도에는 1300~1408년 시칠리아섬만 표시하고 1409년부터는 아라곤 연합 왕국 땅(작업 M1, 정할 점 M1-⑮)

- id: arborea
  level: polity
  names: { ko: 아르보레아 판관국, en: Judicate of Arborea, native: Giudicato di Arborea }
  from: 1070
  to: 1420
  color: "#d9b45a"
  summary: 사르데냐 서부 오리스타노를 중심으로 한 판관국. 14세기 후반 엘레오노라 판관 시대에 아라곤과 싸워 섬 대부분을 차지했으나 1409년 산루리 전투에서 지고 1410년 오리스타노가 항복해 아라곤의 봉신인 오리스타노 후작령이 됨. 북부(사사리)는 나르본 자작 기욤 3세가 1420년 알폰소 5세에게 팖
  basis:
    type: primary_source
    refs: ["엘레오노라 판관의 『카르타 데 로구』(1392)", "산루리 전투(1409) 기록"]
    foundingNote: 판관 이름이 처음 확인되는 1070년 무렵을 시작으로 봄. 지도에는 1300~1399년 사르데냐 중부·서부(1369~1387·1392년부터 북부 포함, 작업 M2), 1400~1409년 사르데냐 북부·중부·서부, 1410~1419년 사사리·올비아 쪽만 표시(작업 M1, 정할 점 M1-⑭)

- id: epirus-despotate
  level: polity
  names: { ko: 에피루스 전제공국, en: Despotate of Epirus, native: Δεσποτάτο της Ηπείρου }
  from: 1205
  to: 1479
  color: "#5fc0a0"
  summary: 제4차 십자군 뒤 미하일 1세 콤니노스 두카스가 아르타에 세운 그리스계 나라. 15세기에는 이탈리아계 토코 가문(카를로 1세)이 이오아니나(1411)·아르타(1416)를 다스렸고, 1430년 이오아니나가 오스만에 항복, 1449년 아르타를 잃은 뒤 아카르나니아(앙겔로카스트로 1460·보니차 1479)와 이오니아해 섬들(레프카다·케팔로니아·자킨토스)이 남았다가 1479년 무너짐
  basis:
    type: primary_source
    refs: ["토코 연대기", "이오아니나의 시난 파샤 칙령(1430)"]
    foundingNote: 미하일 1세가 아르타에서 자립한 1205년을 시작으로 봄. 지도에는 1300~1339년과 1356~1448년(1340~1347 동로마, 1348~1355 세르비아, 작업 M2) 이피로스 지역(이오아니나 1429년까지, 아르타 1448년까지)만 표시. 아이톨리아·아카르나니아와 레프카다는 1405년(카를로 1세 토코의 본토 성들)부터 1459년(앙겔로카스트론 1460)·1478년(레프카다 1479)까지 이 항목으로 그림(작업 FIX2, 정할 점 FIX2-⑩. 1411년 전 토코 가문은 케팔로니아 백작이라 근사)

- id: achaea
  level: polity
  names: { ko: 아카이아 공국, en: Principality of Achaea, native: Principauté d'Achaïe }
  from: 1205
  to: 1432
  color: "#d8c070"
  summary: 제4차 십자군 뒤 프랑스 기사들이 펠로폰네소스 북서부에 세운 라틴 공국. 1404년부터 제노바계 첸투리오네 2세 차카리아가 다스렸으나 모레아 전제공국에 땅을 잃어, 1429~1430년 파트라스·글라렌차가 넘어가고 1432년 그가 죽어 끝남
  basis:
    type: primary_source
    refs: ["모레아 연대기", "스프란체스, 『연대기』"]
    foundingNote: 기욤 드 샹플리트가 펠로폰네소스를 정복한 1205년을 시작으로 봄. 지도에는 1300~1319년 펠로폰네소스 대부분(작업 M2), 1320~1429년 아하이아·일리아만 표시하고(메시니아의 성들은 모레아째 근사) 1430년부터 동로마 제국(모레아 전제공국) 땅(작업 M1)

- id: anatolian-beyliks
  level: polity
  names: { ko: 아나톨리아 베이국들 (묶음), en: Anatolian beyliks (grouped), native: Anadolu beylikleri }
  from: 1300
  to: 1429
  color: "#c49ac8"
  summary: 룸 셀주크가 약해진 뒤 아나톨리아 서부에 선 튀르크 베이국들(게르미얀·아이든·사루한·멘테셰·테케·하미드 등)을 묶은 항목. 1390년대 바예지트 1세가 병합했으나 1402년 앙카라 전투 뒤 티무르가 되살렸고, 오스만이 사루한(1410)·테케와 하미드(1423)·멘테셰(1424)·아이든(1425)·게르미얀(1429)을 다시 합침. 카라만·잔다르는 따로 항목
  basis:
    type: primary_source
    refs: ["아시크파샤자데, 『오스만 왕가사』", "이븐 바투타, 『여행기』"]
    foundingNote: 베이국들이 자립한 1300년 무렵을 시작으로 봄. 지도에는 1300~1397년(1345 카레시, 1390 서아나톨리아 베이국들, 1398 카니크가 오스만, 작업 M2)과 1402~1428년만 표시(작업 M1, 정할 점 M1-⑤)

- id: albanian-principalities
  level: polity
  names: { ko: 알바니아·제타 영주국들 (묶음), en: Albanian and Zetan principalities (grouped), native: Principatat shqiptare }
  from: 1355
  to: 1444
  color: "#6f8fc0"
  summary: 세르비아 제국이 무너진 뒤 알바니아와 제타(몬테네그로)에 선 영주국들(발시치의 제타, 토피아·카스트리오티·두카기니·아리아니티·제네비시 등)을 묶은 항목. 많은 영주가 오스만에 공물을 바쳤고 1415년 크루여, 1417~1419년 남부가 오스만의 알바니아 산자크가 됨. 제타는 1421년 발샤 3세의 유언으로 세르비아 전제공국에, 중북부는 1444년 스칸데르베그의 레저 동맹으로 이어짐
  basis:
    type: primary_source
    refs: ["베네치아 원로원 기록(『알바니아 문서집』)", "오스만 알바니아 산자크 조세 대장(1431~1432)"]
    foundingNote: 세르비아의 스테판 두샨이 죽은 1355년을 시작으로 봄. 지도에는 1355~1443년만 표시(크루여·티라나는 1414년까지, 남부는 1416년까지, 제타는 1422년까지(1421 유언), 코토르·바르 해안은 1419년까지). 베네치아의 두러스는 두러스주째 둔 근사(작업 M1, 정할 점 M1-⑧)

- id: terra-mariana
  level: polity
  names: { ko: 테라 마리아나 (리보니아 묶음), en: Terra Mariana (Livonia grouped), native: Terra Mariana }
  from: 1207
  to: 1422
  color: "#a9b4c9"
  summary: 북방 십자군이 세운 리보니아의 교회령과 기사단령(리보니아 기사단·리가 대주교령·도르파트·외셀비크·쿠를란트 주교령)을 묶은 항목. 1346년 덴마크령 에스토니아를 튜턴 기사단이 사들임. 1422년 발크 의회부터 리보니아 연맹으로 이어짐
  basis:
    type: primary_source
    refs: ["리보니아 운문 연대기", "헨리크의 리보니아 연대기"]
    foundingNote: 교황이 리보니아를 성모의 땅(테라 마리아나)으로 정한 1207년을 시작으로 봄. 지도에는 1300~1421년만(1346년부터 덴마크령 에스토니아 포함, 작업 M2) 표시하고 1422년부터는 리보니아 연맹 항목(같은 색, 정할 점 M1-⑱)

- id: savoy-county
  level: polity
  names: { ko: 사보이아 백국, en: County of Savoy, native: Comté de Savoie }
  from: 1003
  to: 1416
  color: "#78a67e"
  summary: 알프스 양쪽(사부아·피에몬테·보·니스)을 아우른 사보이아 가문의 백국. 1388년 니스 백작령, 1401년 제네바 백작령을 더했고 1416년 지기스문트 황제가 아메데오 8세를 공작으로 올려 사보이아 공국이 됨
  basis:
    type: primary_source
    refs: ["지기스문트 황제의 공국 승격 문서(1416)"]
    foundingNote: 움베르토 1세가 처음 기록에 나오는 1003년을 시작으로 봄. 지도에는 1300~1415년만(1388 니스, 작업 M2) 표시하고 1416년부터는 사보이아 공국 항목(같은 색, 정할 점 M1-⑱)

- id: brankovic-lands
  level: polity
  names: { ko: 브란코비치 영지 (부크의 땅), en: Branković lands (District of Branković), native: Област Бранковића }
  from: 1371
  to: 1412
  color: "#d9a0c0"
  summary: 세르비아 제국이 무너진 뒤 부크 브란코비치가 코소보(프리슈티나·부치트른·노보브르도)와 시에니차·노비파자르 쪽을 다스린 영지. 1392년부터 오스만의 봉신이었고, 부크가 죽은(1397) 뒤 아들 주라지·그르구르가 이었으나 라자레비치의 슈테판과 다투다가 1412년 주라지가 슈테판과 화해해 세르비아 전제공국 편이 되었고 1427년 주라지가 전제공을 이음
  basis:
    type: primary_source
    refs: ["콘스탄틴 코스테네치, 『데스포트 슈테판 라자레비치 전기』", "라구사 문서고의 브란코비치 서한"]
    foundingNote: 마리차 전투 뒤 부크가 자립한 1371년 무렵을 시작으로 봄. 지도에는 1371~1411년만 표시하고 1412년부터는 세르비아 전제공국과 같은 색(작업 M1 검토 반영, 정할 점 M1-⑦)

# ── 유럽 중세 2단계 1300~1399 (작업 M2, 2026-10-07) ──
- id: polish-duchies
  level: polity
  names: { ko: 폴란드 공국들 (묶음), en: Polish duchies (grouped), native: Księstwa polskie }
  from: 1138
  to: 1351
  color: "#f0c0c0"
  summary: 볼레스와프 3세의 유언(1138)으로 나뉜 뒤의 피아스트 공국들을 묶은 항목(소폴란드·대폴란드·쿠야비·시에라츠·웽치차·마조프셰·슐레지엔·포메렐리아). 1300~1305년 보헤미아 왕 바츨라프 2세가 폴란드 왕을 겸했고, 1320년 브와디스와프 1세(우쿠타)가 왕으로 대관해 폴란드 왕국으로 다시 합침. 슐레지엔 공국들은 1327·1329년 보헤미아 왕에게 신서하고, 마조프셰는 1351년 폴란드 왕의 봉신이 됨. 포메렐리아는 1308~1309년 튜턴 기사단이 차지
  basis:
    type: primary_source
    refs: ["볼레스와프 3세의 유언(1138)", "트렌친·비셰그라드 조약(1335)", "칼리슈 조약(1343)"]
    foundingNote: 볼레스와프 3세가 죽은 1138년을 시작으로 봄. 지도에는 1300~1350년만 표시(작업 M2) — 1300~1319년 소폴란드·대폴란드·쿠야비(바츨라프 2세의 왕국(1300~1305)과 글로구프 공의 대폴란드(1306~1314)를 묶음), 1328년까지 슐레지엔, 1308년까지 포메렐리아, 1350년까지 마조프셰

- id: galicia-volhynia
  level: polity
  names: { ko: 갈리치아-볼히니아 왕국, en: Kingdom of Galicia–Volhynia, native: Королівство Руське / Regnum Russiae }
  from: 1199
  to: 1349
  color: "#8fc0d8"
  summary: 로만 므스치슬라비치가 할리치와 볼로디미르를 합쳐 세운 루스의 왕국(1253 다닐로의 대관, '루스 왕국'). 킵차크 칸국에 공납함. 1340년 볼레스와프-유리 2세가 독살된 뒤 볼히니아는 리투아니아의 류바르트, 할리치나는 보야르 드미트로 데드코가 차지했고 1349년 폴란드 왕 카지미에시 3세가 할리치나(르비우)를 차지해 폴란드와 리투아니아가 나눔(1340~1392 갈리치아-볼히니아 전쟁)
  basis:
    type: primary_source
    refs: ["갈리치아-볼히니아 연대기", "카지미에시 3세와 류바르트의 조약(1352·1366)"]
    foundingNote: 할리치와 볼로디미르가 합쳐진 1199년을 시작으로 봄. 지도에는 1300~1348년만 표시(볼히니아는 1339년까지, 작업 M2). 1340~1348년 데드코의 할리치나도 이 항목(근사)

- id: rus-principalities
  level: polity
  names: { ko: 루스 공국들 (묶음), en: Rus' principalities (grouped), native: Русские княжества }
  from: 1132
  to: 1392
  color: "#c8c890"
  summary: 키예프 루스가 갈라진 뒤(1132) 따로 서지 않은 루스 공국들을 묶은 항목. 1300~1391년에는 블라디미르 대공위의 땅과 그 분봉 공국(로스토프·야로슬라블·코스트로마·갈리치·우글리치·벨로오제로·수즈달-니즈니노브고로드), 폴로츠크·비텝스크·투로우-핀스크(1320 리투아니아), 키이우·체르니히우-세베르스크와 위쪽 오카강 공국들(1362 리투아니아)로, 모두 킵차크 칸국에 공납함. 블라디미르 대공위는 트베리(1304~1318·1322~1327)·모스크바(1318~1322·1328~)·수즈달(1360~1362)이 야를릭을 다투었고, 1363년 드미트리 돈스코이가 되찾은 뒤 모스크바 땅이 됨. 수즈달-니즈니노브고로드 대공국은 1392년 바실리 1세가 합침
  basis:
    type: primary_source
    refs: ["라브렌티 연대기", "트로이차 연대기", "드미트리 돈스코이의 유언장(1389)"]
    foundingNote: 키예프 대공 므스티슬라프가 죽은 1132년을 시작으로 봄. 모스크바·트베리·랴잔·노브고로드·프스코프·스몰렌스크처럼 1만 km²를 넘고 따로 움직인 공국은 따로 항목(정할 점 M-③). 지도에는 1300~1391년만 표시(작업 M2, 블라디미르 대공위 땅을 모스크바로 그리는 해는 정할 점 M2-④, 기본값 1363). 로스토프·야로슬라블(1463·1474 모스크바)은 1363년부터 모스크바째(M1과 같은 근사)

- id: denmark-medieval
  level: polity
  names: { ko: 덴마크 왕국, en: Kingdom of Denmark, native: Danmarks rige }
  from: 958
  to: 1397
  color: "#c4685c"
  summary: 고름 노왕·하랄 푸른이빨 이래의 덴마크 왕국. 1332~1340년 크리스토페르 2세가 죽은 뒤 왕이 없이 홀슈타인 백작들이 나라를 저당 잡았고, 발데마르 4세(1340~1375)가 되찾아 1346년 에스토니아를 튜턴 기사단에 팔고 1360년 스코네, 1361년 고틀란드를 차지함. 1370년 슈트랄준트 조약으로 한자 동맹과 화해. 1375년 마르그레테의 아들 올라프가 왕이 되어 1380년 노르웨이와 동군, 1397년 칼마르 동맹
  basis:
    type: primary_source
    refs: ["슈트랄준트 조약(1370)", "칼마르 동맹 문서(1397)"]
    foundingNote: 하랄 푸른이빨이 왕이 된 958년 무렵을 시작으로 봄. 지도에는 1300~1396년 덴마크(슐레스비히 포함, 홀슈타인은 1460년 전 제국 봉토라 신성 로마 제국)·스코네(1332~1359 스웨덴)·덴마크령 에스토니아(1345년까지)·고틀란드(1361~1397)를 표시(작업 M2). 1397년부터 칼마르 동맹(같은 색, renames)

- id: norway-medieval
  level: polity
  names: { ko: 노르웨이 왕국, en: Kingdom of Norway, native: Noregsveldi }
  from: 872
  to: 1397
  color: "#4f9a8a"
  summary: 하랄 미발왕이 통일한 노르웨이 왕국. 1262~1264년 아이슬란드·그린란드가 복속함. 1319년 망누스 에릭손이 스웨덴 왕과 겸하고(1343년 아들 하콘 6세에게 넘김), 1380년 올라프가 덴마크 왕과 겸해 마르그레테가 다스림. 1349년 흑사병으로 인구가 크게 줆. 1397년 칼마르 동맹
  basis:
    type: primary_source
    refs: ["노르웨이 왕실 문서(1319 스웨덴과의 동군)", "칼마르 동맹 문서(1397)"]
    foundingNote: 하랄 미발왕의 하프르스피오르 전투(872 무렵)를 시작으로 봄. 지도에는 1300~1396년 노르웨이·보후슬렌·옘틀란드·아이슬란드·페로 제도를 표시(작업 M2). 동군 연합(1319~1343 스웨덴, 1380~1396 덴마크)은 따로 그림(정할 점 M-②(라)). 1397년부터 칼마르 동맹(renames)

- id: flanders
  level: polity
  names: { ko: 플랑드르 백국, en: County of Flanders, native: Graafschap Vlaanderen }
  from: 862
  to: 1384
  color: "#e0b040"
  summary: 프랑스 왕의 봉토이면서 외교·전쟁을 따로 한 북해 쪽 백국(헨트·브뤼허·이프르의 모직물 도시). 1297~1302년 필리프 4세에게 병합되었다가 1302년 쿠르트레(황금 박차) 전투로 되찾고 1305년 아티스쉬르오르주 조약으로 강화, 1312년 릴·두에·오르시를 프랑스에 넘김(1369 되돌려 받음). 1338~1345 야코프 판 아르테벨더의 반란. 1384년 루이 드 말이 죽어 사위인 부르고뉴 공 필리프 대담공이 이음
  basis:
    type: primary_source
    refs: ["아티스쉬르오르주 조약(1305)", "퐁투아즈 조약(1312)", "루이 드 말의 상속(1384)"]
    foundingNote: 보두앵 1세가 백작이 된 862년 무렵을 시작으로 봄. 정할 점 M-②(나)대로 프랑스 왕국과 따로 그림. 지도에는 1300~1383년 플랑드르(서·동플랑드르와 제일란트 플랑드르·노르도, 왈롱 플랑드르의 1312~1368 프랑스 시기는 근사)를 표시(작업 M2)

- id: dauphine
  level: polity
  names: { ko: 도피네 (비엔누아), en: Dauphiné of Viennois, native: Dauphiné de Viennois }
  from: 1029
  to: 1349
  color: "#b98ad0"
  summary: 알봉 백작 가문이 다스린 부르군트(아를) 왕국(신성 로마 제국) 안의 영방. 그르노블·비엔·브리앙송을 중심으로 했고 1317년 바로니를 더함. 1349년 로망 조약으로 앙베르 2세가 프랑스 왕 필리프 6세의 손자 샤를에게 넘겨, 그 뒤 프랑스 왕세자가 '도팽'이라 불림
  basis:
    type: primary_source
    refs: ["로망 조약(1349)"]
    foundingNote: 기그 1세가 그르노블 백작이 된 1029년 무렵을 시작으로 봄. 정할 점 M-②(다)대로 부르군트 왕국 안의 실제 정치 단위를 따로 그림. 지도에는 1300~1348년 이제르·드롬·오트잘프(발랑티누아·디우아 백작령은 근사)를 표시(작업 M2)

- id: majorca-kingdom
  level: polity
  names: { ko: 마요르카 왕국, en: Kingdom of Majorca, native: Regne de Mallorca }
  from: 1276
  to: 1344
  color: "#e0c040"
  summary: 아라곤 왕 하이메 1세의 유언으로 둘째 아들 하이메 2세가 받은 왕국(발레아레스 제도·루시용·세르다냐·몽펠리에, 1276). 1279년 페르피냥 조약으로 아라곤 왕의 봉신이 되었고 1285~1298년 아라곤에 빼앗겼다가 아나니 조약으로 되찾음. 1343년 아라곤 왕 페드로 4세가 마요르카 섬을, 1344년 루시용을 차지해 합침(하이메 3세는 1349년 마요르카를 되찾으려다 죽음)
  basis:
    type: primary_source
    refs: ["하이메 1세의 유언(1262·1272)", "페르피냥 조약(1279)", "페드로 4세의 연대기"]
    foundingNote: 하이메 2세가 왕위에 오른 1276년을 시작으로 봄. 아라곤의 봉신이지만 따로 왕을 둔 나라라 따로 그림(정할 점 M-②(마)). 지도에는 1300~1343년 발레아레스 제도와 루시용·세르다냐(피레네조리앙탈도)를 표시하고 몽펠리에(1349 프랑스에 팖)는 근사(작업 M2)

- id: milan-signoria
  level: polity
  names: { ko: 밀라노 (비스콘티 시뇨리아), en: Lordship of Milan (Visconti), native: Signoria di Milano }
  from: 1277
  to: 1395
  color: "#5fa0c8"
  summary: 오토네 비스콘티 대주교가 델라 토레 가문을 이긴(1277) 뒤 비스콘티 가문이 다스린 밀라노 코무네의 시뇨리아. 1302~1311년 델라 토레가 되찾았으나 마테오 비스콘티가 하인리히 7세의 황제 대리로 돌아옴. 아초네·루키노·조반니 대주교·베르나보·갈레아초 2세가 롬바르디아(베르가모 1332·크레모나 1334·코모 1335·브레시아 1337·파르마 1346·파비아 1359)와 볼로냐(1350~1360)·제노바(1353~1356)로 넓혔고, 1385년 잔갈레아초가 숙부 베르나보를 몰아낸 뒤 베로나·비첸차(1387)·파도바(1388~1390)를 차지하고 1395년 황제 벤첼에게 공작 칭호를 삼
  basis:
    type: primary_source
    refs: ["황제 하인리히 7세의 대리 임명(1311)", "벤첼의 공작 서임장(1395)"]
    foundingNote: 데시오 전투에서 오토네 비스콘티가 이긴 1277년을 시작으로 봄. 지도에는 1300~1394년 표시하고(1302~1311 델라 토레 시기도 같은 항목, 근사), 1395년부터는 밀라노 공국(이름만 바뀐 나라, renames, 같은 색, 작업 M2)

- id: serbia-medieval
  level: polity
  names: { ko: 세르비아 왕국, en: Kingdom of Serbia, native: Српско краљевство }
  from: 1217
  to: 1346
  color: "#9f4fd0"
  summary: 스테판 네마니치가 왕으로 대관한(1217) 세르비아 왕국. 밀루틴(1282~1321)이 북마케도니아(스코피에)를 얻고 형 드라구틴은 헝가리 왕에게서 마치바·베오그라드를 받았으며, 스테판 데찬스키가 1330년 벨부즈드 전투에서 불가리아를 이김. 스테판 두샨(1331~1355)이 1334년 오흐리드·프릴레프, 1343~1345년 알바니아·마케도니아(세레스)를 차지하고 1346년 스코피에에서 황제로 대관해 세르비아 제국이 됨
  basis:
    type: primary_source
    refs: ["다닐로 2세, 『세르비아 왕과 대주교들의 생애』", "밀루틴과 안드로니코스 2세의 조약(1299)"]
    foundingNote: 스테판 네마니치가 대관한 1217년을 시작으로 봄. 지도에는 1300~1345년 표시하고 1346년부터는 세르비아 제국 항목(칭호가 바뀐 나라, 정할 점 M-⑧·M2-⑨, renames, 같은 색, 작업 M2 검토 반영)

- id: serbian-empire
  level: polity
  names: { ko: 세르비아 제국, en: Serbian Empire, native: Српско царство }
  from: 1346
  to: 1371
  color: "#9f4fd0"
  summary: 스테판 두샨이 1346년 스코피에에서 '세르비아인과 그리스인의 황제'로 대관해 세운 제국. 1348년 테살리아·에피루스를 더해 발칸 서부·남부를 다스렸고 1349·1354년 두샨 법전을 냄. 1355년 두샨이 죽은 뒤 우로시 5세 아래 영주들(부카신·우글레샤·라자르·알토마노비치·브란코비치·발시치)이 갈라섰고, 이복형 시메온 우로시는 테살리아·에피루스에서 따로 황제를 칭함. 1371년 마리차 전투에서 부카신·우글레샤가 죽고 그해 12월 우로시 5세도 죽어 끝남
  basis:
    type: primary_source
    refs: ["두샨 법전(1349·1354)", "요안니스 칸타쿠제노스, 『역사』"]
    foundingNote: 두샨이 황제로 대관한 1346년을 시작으로 봄. 세르비아 왕국에서 칭호만 바뀐 나라라 renames로 잇고 같은 색(M-⑧). 지도에는 1346~1370년 표시(작업 M2 검토 반영). 1355~1370년 우로시 5세 아래 영주들의 땅과 1359~1370년 테살리아의 시메온 우로시도 이 항목(근사, 정할 점 M2-⑨). 1371년부터 모라바 세르비아·브란코비치 영지·세르비아 영주국들(묶음)·알바니아·제타 영주국들로 나뉨

- id: serbian-magnates
  level: polity
  names: { ko: 세르비아 영주국들 (묶음), en: Serbian magnates (grouped), native: Српски обласни господари }
  from: 1371
  to: 1395
  color: "#a0c060"
  summary: 1371년 마리차 전투 뒤 오스만의 봉신이 된 마케도니아의 세르비아 영주들을 묶은 항목. 부카신의 아들 마르코 므르냐브체비치(프릴레프·오흐리드)와 데야노비치 형제(콘스탄틴 드라가시 — 벨부즈드·쿠마노보·슈티프·스트루미차·브라녜) 등. 1395년 로비네 전투에서 마르코와 드라가시가 오스만 편으로 싸우다 죽은 뒤 바예지트 1세가 땅을 합침
  basis:
    type: primary_source
    refs: ["콘스탄틴 코스테네치, 『데스포트 슈테판 라자레비치 전기』", "라구사 문서고의 서한"]
    foundingNote: 마리차 전투(1371)를 시작으로 봄. 영주마다 1만 km² 안팎이라 묶음(정할 점 M-③). 지도에는 1371~1394년 북마케도니아·벨부즈드(큐스텐딜)·멜니크·서마케도니아(1386년까지)를 표시하고 1371~1391년 부크 브란코비치의 스코피에도 근사로 이 항목(작업 M2)

- id: bulgaria-second
  level: polity
  names: { ko: 불가리아 제2제국 (터르노보), en: Second Bulgarian Empire, native: Второ българско царство }
  from: 1185
  to: 1393
  color: "#e0a050"
  summary: 아센·페타르 형제가 동로마에 맞서 세운 불가리아 제2제국(수도 터르노보). 1300년 테오도르 스베토슬라프가 타타르의 영향에서 벗어나 1304년 흑해 항구들을 얻음. 1330년 벨부즈드 전투에서 세르비아에 졌고, 이반 알렉산다르(1331~1371) 때 1344년 필리포폴리스를 얻었으나 1356년 비딘(이반 스라치미르)이 갈라짐. 1371년 마리차 전투 뒤 이반 시시만이 오스만의 봉신이 되었고 1393년 7월 터르노보가 함락됨(1395년 니코폴에서 시시만 처형)
  basis:
    type: primary_source
    refs: ["보릴 시노디콘", "이반 알렉산다르 복음서(1355)", "그리고리 참블라크, 『예프티미 총대주교 찬사』"]
    foundingNote: 아센·페타르의 봉기(1185)를 시작으로 봄. 지도에는 1300~1392년 표시(작업 M2). 비딘 차르국(1356~1396)과 도브루자 전제공국(1346~1388)은 따로 항목, 1300~1355년 비딘 공국(시시만 가문)은 이 항목(분봉, M-②(바))

- id: vidin-tsardom
  level: polity
  names: { ko: 비딘 차르국, en: Tsardom of Vidin, native: Видинско царство }
  from: 1356
  to: 1396
  color: "#c8d070"
  summary: 이반 알렉산다르의 아들 이반 스라치미르가 다스린 불가리아 서북부의 차르국(1356년 무렵 터르노보와 갈라짐). 1365년 헝가리 왕 러요시 1세가 비딘을 차지해 비딘 바나트를 두었으나 1369년 스라치미르가 헝가리의 봉신으로 돌아옴. 1388년 무렵부터 오스만의 봉신이었고 1396년 니코폴리스 전투 뒤 바예지트 1세가 합침
  basis:
    type: primary_source
    refs: ["헝가리 왕 러요시 1세의 비딘 원정 기록(1365)", "요한 실트베르거, 『여행기』(1396)"]
    foundingNote: 이반 스라치미르가 차르를 칭한 1356년을 시작으로 봄. 지도에는 1356~1395년 비딘·몬타나·브라차·자이차르·보르(1383년까지) 쪽을 대략 표시하고 1365~1368년은 헝가리(정할 점 M2-⑥, 작업 M2)

- id: dobruja-despotate
  level: polity
  names: { ko: 도브루자 전제공국, en: Despotate of Dobruja, native: Добруджанско деспотство }
  from: 1346
  to: 1388
  color: "#f080a0"
  summary: 흑해 서북 기슭(카르부나·칼리아크라)에 선 불가리아계 영주국. 발리크(1346 무렵)·도브로티차(1354~1386, 1366 바르나·아메데오 6세와 다툼)·이반코(1386~1388)가 다스렸고 제노바·동로마와 다툼. 1388년 알리 파샤의 원정 때 이반코가 오스만에 굴복하고 북도브루자는 왈라키아의 미르체아 대공이 차지함
  basis:
    type: primary_source
    refs: ["제노바 페라 정청 문서", "이반코와 제노바의 조약(1387)"]
    foundingNote: 발리크가 자립한 1346년 무렵을 시작으로 봄. 지도에는 1346~1387년 도브리치·바르나·콘스탄차·툴체아주를 대략 표시(작업 M2)

- id: bosnian-banate
  level: polity
  names: { ko: 보스니아 바나트, en: Banate of Bosnia, native: Banovina Bosna }
  from: 1154
  to: 1377
  color: "#a0a0f0"
  summary: 헝가리 왕의 종주 아래 반(ban)이 다스린 보스니아. 1299~1322년 크로아티아의 슈비치 가문이 반을 맡았고, 스테판 2세 코트로마니치(1322~1353)가 1324년 우소라·솔리, 1326년 훔(자훔리예)·돈니크라이·자브르슈예를 얻어 크게 넓힘. 트브르트코 1세(1353~1391)가 1373년 폴림리예·위쪽 드리나를 얻고 1377년 밀레셰보에서 왕으로 대관함
  basis:
    type: primary_source
    refs: ["쿨린 반의 헌장(1189)", "트브르트코 1세의 헌장(1378)"]
    foundingNote: 반 보리치가 처음 기록에 나오는 1154년을 시작으로 봄. 헝가리의 봉신이라 따로 그리고 relations.yaml에 종속(정할 점 M-②(마)). 지도에는 1300~1376년 표시하고 1377년부터 보스니아 왕국(이름만 바뀐 나라, renames, 같은 색, 작업 M2)

- id: thessaly
  level: polity
  names: { ko: 테살리아 (두카스 가문), en: Thessaly (Doukai), native: Θεσσαλία }
  from: 1268
  to: 1333
  color: "#e0a0f0"
  summary: 에피루스의 미하일 2세가 죽은 뒤 아들 요안니스 1세 두카스가 자립한 테살리아(네오파트라스). 1318년 요안니스 2세가 죽어 대가 끊기자 남부(네오파트라스·라미아)는 카탈루냐 용병단의 아테네 공국, 북부는 스테파노스 가브리엘로풀로스 등 영주들과 베네치아가 나눠 가졌고, 1333년 동로마의 안드로니코스 3세가 차지함
  basis:
    type: primary_source
    refs: ["니키포로스 그리고라스, 『로마사』", "요안니스 칸타쿠제노스, 『역사』"]
    foundingNote: 요안니스 1세가 자립한 1268년 무렵을 시작으로 봄. 지도에는 1300~1332년 테살리아 지방을 표시(1318~1332년 영주들의 할거도 이 항목, 근사, 작업 M2). 1359~1393년 시메온 우로시·알렉시오스 앙겔로스의 테살리아는 세르비아 제국·동로마 색(근사)

- id: duchy-of-athens
  level: polity
  names: { ko: 아테네 공국, en: Duchy of Athens, native: Ducatus Athenarum }
  from: 1205
  to: 1458
  color: "#90d0e0"
  summary: 제4차 십자군 뒤 드 라 로슈 가문이 세운 라틴 공국(아티카·보이오티아, 아카이아 공의 봉신). 1311년 할미로스(케피소스) 전투에서 카탈루냐 용병단이 브리엔의 고티에 5세를 죽이고 차지해 시칠리아 왕의 아들들(1312~1355)·시칠리아 왕(1355~1377)·아라곤 왕(1379~1388)을 공작으로 받들었고 1319년 네오파트라스 공국을 더함. 1388년 피렌체 출신 네리오 아차이우올리가 차지했고, 1394년 바예지트 1세가 살로나·네오파트라스를 빼앗고, 네리오의 유언으로 테베·리바디아는 서자 안토니오 1세가, 아테네는 1395~1402년 베네치아가 다스림. 안토니오가 1402~1403년 아테네를 되찾아 1405년 베네치아의 인정을 받았고 오스만에 공물을 바침. 1456년 오스만이 아테네를, 1458년 아크로폴리스를 차지(테베는 1460년까지 프랑코 아차이우올리가 술탄에게 받아 다스림)
  basis:
    type: primary_source
    refs: ["라몬 문타네르, 『연대기』", "아라곤 왕실 문서(1380 아테네·네오파트라스 공국)"]
    foundingNote: 오통 드 라 로슈가 영주가 된 1205년을 시작으로 봄. 왕이 공작을 겸한 시기(1355~1388)도 동군 연합처럼 따로 그림(정할 점 M2-⑩). 지도에는 1300~1393년 중부 그리스(보이오티아·포키스·프티오티스, 에우보이아는 근사)와 1300~1394년 아티카를 표시(작업 M2). 1394~1455년 보이오티아(테베·리바디아)와 1405~1455년 아티카도 표시(1395~1404년 아티카는 베네치아, 작업 FIX2, 정할 점 FIX2-⑧). 1456년 아테네 함락으로 공국이 무너진 뒤는 오스만(테베의 프랑코는 술탄의 봉신이라 오스만 땅)

- id: rum-sultanate
  level: polity
  names: { ko: 룸 술탄국, en: Sultanate of Rum, native: سلجوقيان روم }
  from: 1077
  to: 1308
  color: "#c87878"
  summary: 셀주크 왕가의 쉴레이만이 아나톨리아에 세운 술탄국(수도 코니아). 1243년 쾨세다그 전투로 몽골에 진 뒤 일한국의 종속국이 되었고 13세기 말에는 일한국 총독이 실제로 다스림. 마지막 술탄 메수드 2세가 1308년 무렵 죽어 끝났고 아나톨리아 중부·동부는 일한국의 직할(1335년 아부 사이드가 죽은 뒤 에레트나)이 됨
  basis:
    type: primary_source
    refs: ["이븐 비비, 『셀주크사』", "아크사라이, 『무사마라트 알아흐바르』"]
    foundingNote: 쉴레이만 이븐 쿠탈미시가 술탄을 칭한 1077년을 시작으로 봄. 지도에는 1300~1307년 아나톨리아 중부(일한국 총독이 다스린 땅)를 표시(작업 M2, 정할 점 M-④). 앞 시기는 작업 M3·M4에서 넓힘

- id: eretnids
  level: polity
  names: { ko: 에레트나 왕조·카디 부르하네딘, en: Eretnids and Kadi Burhan al-Din, native: Eretnaoğulları }
  from: 1335
  to: 1398
  color: "#50a0f0"
  summary: 일한국의 아나톨리아 총독 티무르타시의 부관이던 위구르 출신 에레트나가 아부 사이드가 죽은(1335) 뒤 시바스·카이세리를 중심으로 자립한 나라(1343 술탄 칭호). 앙카라(1354 오스만)·아마스야(1360년대 하즈 샤드겔디) 등을 잃으며 줄었고, 1381년 재상 카디 부르하네딘이 왕조를 이어 술탄이 됨. 1398년 카디 부르하네딘이 아크코윤루와 싸우다 죽은 뒤 바예지트 1세가 시바스·토카트·카이세리를 차지
  basis:
    type: primary_source
    refs: ["아지즈 이븐 아르다시르 아스타라바디, 『바잠 우 바잠』", "이븐 바투타, 『여행기』"]
    foundingNote: 에레트나가 일한국에서 떨어져 나온 1335년을 시작으로 봄. 같은 나라를 이은 두 왕조를 한 항목으로(1만 km²를 크게 넘어 아나톨리아 베이국들 묶음과 따로, 정할 점 M2-⑪). 지도에는 1335~1397년 아나톨리아 중부(시바스·토카트·카이세리·아크사라이·니으데·네브셰히르·크르셰히르·요즈가트와 1353년까지 앙카라, 1391년까지 아마스야·초룸)를 대략 표시(작업 M2)

- id: cilician-armenia
  level: polity
  names: { ko: 킬리키아 아르메니아 왕국, en: Armenian Kingdom of Cilicia, native: Կիլիկիոյ Հայոց Թագաւորութիւն }
  from: 1198
  to: 1375
  color: "#50d0d0"
  summary: 루벤 왕조의 레보 1세가 왕으로 대관해 세운 킬리키아의 아르메니아 왕국(수도 시스). 십자군·몽골(일한국)과 손잡았으나 맘루크의 공격으로 1337년 아야스와 제이한강 동쪽, 1359년 아다나·타르수스를 잃고, 1375년 4월 시스가 함락되어 레보 5세가 사로잡히며 끝남
  basis:
    type: primary_source
    refs: ["스므바트 연대기", "장 다르델, 『아르메니아 연대기』"]
    foundingNote: 레보 1세가 대관한 1198년을 시작으로 봄. 지도에는 1300~1374년 권역 안의 아다나·오스마니예와 1358년까지 메르신을 표시(작업 M2, 정할 점 M-⑥처럼 권역 안만)

# ── 작업 FIX2 (2026-10-07): 칼마르 동맹의 앞 시기·아일랜드 게일 영주들·노가이 오르다 (영토는 scripts/geo/areas/europe.mjs, 정할 점은 EUROPE_DRAFT.md 8.12) ──
- id: kalmar-union-three-kingdoms
  level: polity
  names: { ko: 칼마르 동맹 (덴마크·노르웨이·스웨덴), en: Kalmar Union (Denmark–Norway–Sweden), native: Kalmarunionen }
  from: 1397
  to: 1447
  color: "#c4685c"
  summary: 마르그레테 1세의 주도로 덴마크·노르웨이·스웨덴(핀란드 포함)이 한 왕을 받든 동맹. 1397년 칼마르에서 에리크 7세(포메른의 에리크)가 세 나라 왕으로 대관했고, 1434~1436년 엥엘브렉트 봉기 뒤 1439~1440년 세 나라가 에리크를 폐위하고 크리스토페르(바이에른의 크리스토페르)를 왕으로 세움. 1448년 크리스토페르가 죽은 뒤 스웨덴은 카를 크누트손을 왕으로 뽑아 갈라짐
  basis:
    type: primary_source
    refs: ["칼마르 동맹 문서(1397)", "칼마르 대관 문서(1397)"]
    foundingNote: 에리크 7세가 세 나라 왕으로 대관한 1397년을 시작으로 봄. 지도에는 1397~1447년 덴마크·노르웨이·스웨덴(핀란드 포함, 정할 점 M1-③)을 표시하고, 1448년부터는 칼마르 동맹 (덴마크·노르웨이) 항목(같은 색, 작업 FIX2, 정할 점 FIX2-⑨). 홀슈타인은 1460년 리베 조약 전이라 들지 않음(신성 로마 제국)

- id: gaelic-irish-lordships
  level: polity
  names: { ko: 아일랜드 게일 영주들 (묶음), en: Gaelic Irish lordships (grouped), native: Tiarnais Ghaelacha }
  from: 1171
  to: 1603
  color: "#d0b060"
  summary: 잉글랜드 왕의 아일랜드 영주령 밖에서 스스로 다스린 게일 왕·영주들(티르 에오가인의 오닐, 티르 코나일의 오도널, 토먼드의 오브라이언, 브레프니의 오라일리·오루크, 렌스터의 맥머로 캐버나 등)과 게일화한 앵글로노르만 가문(코노트의 버크 가문)을 묶은 항목. 14세기에 브루스의 침공(1315~1318)·얼스터 백작의 살해(1333)·흑사병을 거치며 넓어졌고, 15세기 말 왕의 실제 지배는 더블린 둘레의 페일까지 줄어듦. 헨리 8세의 항복과 재수여(1541~1543)로 큰 영주들이 백작이 되었고, 9년 전쟁(1594~1603) 끝에 1603년 멜리폰트 조약으로 튜더의 정복이 끝남
  basis:
    type: primary_source
    refs: ["킬케니 법령(1366)", "아일랜드 왕국법(1541)", "멜리폰트 조약(1603)"]
    foundingNote: 헨리 2세의 침공(1171) 뒤의 게일 영주들을 이 항목으로 봄(그전은 작업 M5의 아일랜드 왕국들 묶음). 지도에는 1300~1541년 얼스터 서부·브레프니·오리엘·위클로(1300~), 클레어(1318~), 얼스터 백작령과 코노트(1333~), 미들랜즈와 칼로(1369~)를 군 단위로 대략 표시(작업 FIX2, 정할 점 FIX2-⑤). 1542년부터는 항복과 재수여로 왕의 봉신이 된 것으로 보아 아일랜드 왕국(9년 전쟁 중의 땅은 ⑦대로 그리지 않음)

- id: nogai-horde
  level: polity
  names: { ko: 노가이 오르다, en: Nogai Horde, native: Ногай Ордасы }
  from: 1440
  to: 1634
  color: "#e0a0a0"
  summary: 에디게이의 망기트 부족이 킵차크 칸국(대오르다)에서 떨어져 나와 볼가강과 우랄강(야이크강) 사이 초원에 세운 유목 연합(중심지 사라이치크). 칸을 두지 않고 비(beg)·미르자가 다스렸으며 바시키르에게서 공물을 받음. 1555~1557년 이스마일이 모스크바에 신속하고 1557년 카지 미르자가 볼가강을 건너 쿠반 쪽에 소노가이를 세우며 갈라졌고, 1630년대 칼미크에게 밀려 무너짐
  basis:
    type: primary_source
    refs: ["모스크바 대사청 문서(노가이 관계 문서)", "지기스문트 폰 헤르베르슈타인, 『모스크바 사정』(1549)"]
    foundingNote: 망기트가 대오르다에서 떨어져 나온 1440년 무렵(정할 점 M1-⑪)을 시작으로 봄. 지도에는 1440~1555년 권역 안의 사마라·바시키르·오렌부르크 서부와 1521~1555년(카자흐에 밀린 노가이가 볼가강을 건넌 해부터) 볼고그라드·사라토프를 표시(작업 FIX2, 정할 점 FIX2-⑦). 1556년부터는 대노가이의 신속으로 러시아 땅(D3-⑨), 우랄강 동쪽(권역 밖)은 칠하지 않음
