# china pre-qin 나라 (시대 파일 scripts/geo/areas/china/pre-qin.mjs의 짝 항목 파일)
# 시대·범위: 상·서주·춘추(M1): 기원전 1600년 무렵(천문 −1599) ~ 기원전 476년(천문 −475). 동아시아 손그림 바깥 도형(shared.mjs의 CHINA 등) 안을 Natural Earth admin-1 조각(loadFragments('china'))과 칼선으로 나눈다(docs/china/00-scope.md 2절)
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'china-pre-qin').
# 중국 M1(2026-10-21): 상·서주·동주 왕실과 춘추의 큰 제후국(진(晉)·제·초·진(秦)·오). 영토는 기원전 476년까지만 그리고 전국 시대는 M2가 잇는다(항목 to는 실제 끝 해).
# 상·서주의 해는 하상주 단대공정 연표(00-scope 3절). 월은 기원전 476년 전 땅이 5만 km² 미만이라 M2에서 항목을 만든다. 연(yan-state)은 china-early.yaml.
# startEvents·endEvents는 중국 선진 시대 사건 묶음(cn-01)이 채운다.

- id: shang
  level: polity
  names: { ko: 상, hanja: 商, en: Shang }
  from: -1599
  to: -1045
  color: "#a0843c"
  summary: 황허강 중하류에 있던 중국 청동기 시대의 왕조(은). 탕이 하를 무너뜨리고 세웠다고 전하며, 앞 시기에는 정저우 상성 둘레에 중심을 두었다. 반경이 은(지금 허난성 안양의 은허)으로 도읍을 옮긴 뒤 거북 껍데기와 소뼈에 점친 내용을 새긴 갑골문과 청동 제기·무기를 만드는 청동기 문화가 꽃피었다. 왕이 점을 쳐 나라 일을 정하는 신권 정치를 폈다. 기원전 1046년 주 무왕에게 목야에서 패해 무너졌다
  mapNote: 지도에는 왕이 직접 다스린 땅을 중심으로 앞 시기(정저우 상성 시기)와 뒤 시기(은허 시기) 두 모습으로 근사해 표시. 영향권(외복)과 멀리 떨어진 거점은 칠하지 않음
  endNote: 기원전 1046년 주 무왕에게 목야에서 패해 무너짐
  features:
    - 앞 시기에는 정저우 상성 둘레, 반경이 도읍을 옮긴 뒤에는 은(은허)이 중심
    - 거북 껍데기와 소뼈에 점친 내용을 새긴 갑골문을 남김
    - 청동 제기와 무기를 만드는 청동기 문화가 꽃핌
    - 왕이 점을 쳐 나라 일을 정하는 신권 정치를 폄
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 은본기", "하상주 단대공정 연표(2000)"]
    foundingNote: 하상주 단대공정 연표를 따라 기원전 1600년 무렵을 시작으로 봄. 한나라 유흠은 기원전 1766년, 『죽서기년』 옛 글은 기원전 1523년 무렵으로 봄

- id: western-zhou
  level: polity
  names: { ko: 서주, hanja: 西周, en: Western Zhou }
  from: -1045
  to: -770
  color: "#4f6f8f"
  summary: 웨이허강 분지의 호경에 도읍한 주 왕조의 앞 시기. 무왕이 상을 무너뜨리고 세웠으며, 하늘의 명이 덕 있는 이에게 옮겨 간다는 천명 사상으로 상을 이은 것을 내세웠다. 왕족과 공신을 각지의 제후로 봉해 다스리는 봉건 제도를 폈고, 주공이 동쪽의 반란을 누르고 낙읍(성주, 지금 뤄양)을 세웠다. 기원전 771년 견융이 호경을 함락하고 유왕을 죽여 무너졌다
  mapNote: 지도에는 왕이 직접 다스린 땅과 제후국(연·제·노·진(晉)·위·송 등)의 땅을 한 나라로 묶어 표시. 서쪽 융과 남쪽 초·회이의 땅은 비움
  endNote: 기원전 771년 견융이 호경을 함락하고 유왕을 죽여 무너짐. 이듬해 평왕이 낙읍으로 옮겨 동주가 이어짐
  features:
    - 도읍은 호경(지금 시안 서남쪽), 동쪽 도읍으로 낙읍(성주)을 둠
    - 왕족과 공신을 제후로 봉해 다스리는 봉건 제도를 폄
    - 하늘의 명이 덕 있는 이에게 옮겨 간다는 천명 사상을 내세움
    - 주공이 동쪽의 반란을 누르고 낙읍을 세움
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 주본기", "하상주 단대공정 연표(2000)"]
    foundingNote: 하상주 단대공정 연표를 따라 무왕이 상을 무너뜨린 기원전 1046년을 시작으로 봄. 기원전 1122년(유흠)이나 기원전 1027년(『죽서기년』 옛 글)으로 보는 설도 있음

- id: eastern-zhou
  level: polity
  names: { ko: 동주, hanja: 東周, en: Eastern Zhou }
  from: -769
  to: -255
  color: "#7a5f9a"
  summary: 평왕이 낙읍(성주, 지금 뤄양)으로 도읍을 옮긴 뒤의 주 왕조. 왕은 천하의 주인으로 받들어졌으나 다스린 땅은 뤄양 둘레의 좁은 왕기뿐이었다. 춘추 시대에는 제 환공·진(晉) 문공 같은 패자가 왕을 받든다는 명분으로 제후를 이끌었고, 전국 시대에는 제후들이 왕을 칭해 이름만 남았다. 기원전 256년 진(秦)에게 무너졌다
  mapNote: 지도에는 춘추 시대(기원전 476년까지)의 뤄양 둘레 왕기만 표시
  endNote: 기원전 256년 진(秦)에게 무너짐
  features:
    - 도읍은 낙읍(성주, 지금 뤄양)
    - 다스린 땅은 뤄양 둘레의 좁은 왕기뿐임
    - 춘추 시대에는 패자가 왕을 받든다는 명분으로 제후를 이끎
    - 전국 시대에는 제후들이 왕을 칭해 이름만 남음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 주본기", "『춘추좌씨전』"]
    foundingNote: 평왕이 낙읍으로 도읍을 옮긴 기원전 770년을 시작으로 봄

- id: jin-chunqiu
  level: polity
  names: { ko: 진(晉), hanja: 晉, en: Jin (Spring and Autumn) }
  from: -1041
  to: -375
  color: "#5f8a4a"
  summary: 산시성 남부 펀허강 유역에 있던 춘추 시대의 큰 제후국. 주 성왕이 아우 숙우를 당에 봉한 데서 비롯했고, 도읍은 익(翼)에서 강(絳)을 거쳐 기원전 585년 신전(지금 허우마)으로 옮겼다. 헌공이 둘레 소국을 병합하고 기원전 655년 괵·우를 멸했으며, 문공이 기원전 632년 성복 전투에서 초를 깨고 패자가 되었다. 기원전 594년 적적의 노씨를 멸해 상당으로 넓혔다. 뒤에 경대부의 힘이 커져 기원전 403년 한·조·위 세 집안이 제후로 인정받았고, 기원전 376년 세 나라가 남은 땅을 나누어 없어졌다
  mapNote: 지도에는 춘추 시대(기원전 770년)부터 기원전 476년까지 표시하고, 헌공(기원전 655년)과 경공(기원전 594년) 때 넓어진 땅을 반영함
  endNote: 기원전 403년 한·조·위가 제후로 인정받았고, 기원전 376년 세 나라가 남은 땅을 나누어 없어짐(기원전 369년으로 보는 설도 있음)
  features:
    - 도읍은 익·강을 거쳐 기원전 585년부터 신전(지금 허우마)
    - 헌공이 둘레 소국을 병합하고 기원전 655년 괵·우를 멸함
    - 문공이 기원전 632년 성복 전투에서 초를 깨고 패자가 됨
    - 기원전 594년 적적의 노씨를 멸해 상당으로 넓힘
    - 경대부의 힘이 커져 한·조·위 세 집안이 나라를 나눔
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 진세가", "『춘추좌씨전』"]
    foundingNote: 주 성왕(재위 기원전 1042~1021, 하상주 단대공정)이 숙우를 당에 봉한 것을 시작으로 보되, 해가 전하지 않아 성왕이 즉위한 기원전 1042년으로 둠

- id: qi-state
  level: polity
  names: { ko: 제, hanja: 齊, en: Qi }
  from: -1045
  to: -220
  color: "#2f7f86"
  summary: 산둥성 북부 임치(지금 쯔보)에 도읍한 춘추 전국 시대의 제후국. 주 무왕이 상을 무너뜨린 뒤 공신 태공망(여상)을 봉한 데서 비롯했다. 소금과 철, 바닷가 물산으로 부유했고, 환공이 관중을 재상으로 삼아 나라를 키워 춘추 시대 첫 패자가 되었다. 기원전 386년 전씨가 강씨를 대신해 제후가 되었고, 전국 7웅의 하나로 이어지다가 기원전 221년 진(秦)에게 멸망했다
  mapNote: 지도에는 춘추 시대(기원전 770년)부터 기원전 476년까지 표시. 환공 때 넓힌 땅은 처음부터 넣고, 기원전 567년에 병합한 래(자오둥 반도)는 비움
  endNote: 기원전 221년 진(秦)에게 항복해 멸망함
  features:
    - 도읍은 임치(지금 쯔보)
    - 소금과 철, 바닷가 물산으로 부유함
    - 환공이 관중을 재상으로 삼아 춘추 시대 첫 패자가 됨
    - 기원전 386년 전씨가 강씨를 대신해 제후가 됨
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 제태공세가", "『사기』 전경중완세가"]
    foundingNote: 주 무왕이 태공망을 봉한 기원전 1046년 무렵을 시작으로 봄

- id: chu-state
  level: polity
  names: { ko: 초, hanja: 楚, en: Chu }
  from: -1029
  to: -222
  color: "#a8607a"
  summary: 창장강 중류 한수이강 유역에서 일어난 춘추 전국 시대의 큰 나라. 주 성왕이 웅역을 봉한 데서 비롯했다고 전하며, 무왕(웅통)이 기원전 704년 무렵 스스로 왕을 칭했다. 도읍을 단양에서 영(지금 후베이성 징저우)으로 옮기고 한수이강·화이허강 유역의 소국을 차례로 병합했으며, 장왕이 기원전 597년 필 전투에서 진(晉)을 깨고 패자가 되었다. 기원전 506년 오의 침입으로 도읍 영을 빼앗기기도 했다. 기원전 223년 진(秦)에게 도읍 수춘을 빼앗기고 왕 부추가 사로잡혀 멸망했다
  mapNote: 지도에는 신(난양 분지)을 병합한 기원전 688년 무렵부터 기원전 476년까지 표시하고, 기원전 600년 무렵 한수이강 동쪽과 화이허강 상류로 넓어진 땅을 반영함. 남쪽 백월·묘만의 땅은 비움
  endNote: 기원전 223년 진(秦)에게 도읍 수춘을 빼앗기고 왕 부추가 사로잡혀 멸망함
  features:
    - 도읍은 단양을 거쳐 영(지금 징저우)
    - 무왕(웅통)이 기원전 704년 무렵 스스로 왕을 칭함
    - 한수이강·화이허강 유역의 소국을 차례로 병합함
    - 장왕이 기원전 597년 필 전투에서 진(晉)을 깨고 패자가 됨
    - 기원전 506년 오의 침입으로 도읍 영을 빼앗기기도 함
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 초세가", "『춘추좌씨전』"]
    foundingNote: 주 성왕이 웅역을 초에 봉한 기원전 1030년 무렵을 시작으로 봄(해는 어림)

- id: qin-state
  level: polity
  names: { ko: 진, hanja: 秦, en: Qin }
  from: -769
  to: -221
  color: "#8c5a4a"
  summary: 웨이허강 상류와 관중에 있던 춘추 전국 시대의 제후국. 비자가 주 효왕에게서 진 땅을 받은 데서 비롯했고, 기원전 770년 양공이 평왕을 호위한 공으로 제후가 되었다. 무공이 기원전 688~687년 톈수이와 관중 동부에 처음 현을 두었고, 기원전 677년부터 옹(지금 펑샹)에 도읍했으며, 목공이 서융을 제압해 패자로 불렸다. 전국 시대에 상앙의 개혁으로 강해져 여섯 나라를 무너뜨리고 기원전 221년 중국을 통일해 진 제국이 되었다
  mapNote: 지도에는 관중과 톈수이 분지에 현을 둔 기원전 687년부터 기원전 476년까지 표시하고 서융의 땅은 비움. 통일 뒤 진 제국과 같은 색
  endNote: 기원전 221년 여섯 나라를 모두 무너뜨리고 중국을 통일해 진 제국으로 이어짐
  features:
    - 도읍은 기원전 677년부터 옹(지금 펑샹)
    - 무공이 톈수이와 관중 동부에 처음 현을 둠(기원전 688~687)
    - 목공이 서융을 제압해 패자로 불림
    - 전국 시대 상앙의 개혁으로 강해짐
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 진본기"]
    foundingNote: 양공이 제후가 된 기원전 770년을 시작으로 봄. 비자가 진 땅을 받은 기원전 9세기를 시작으로 보기도 함

- id: wu-state
  level: polity
  names: { ko: 오, hanja: 吳, en: Wu }
  from: -584
  to: -472
  color: "#c08a3a"
  summary: 창장강 하류 타이후호 둘레에 있던 춘추 시대의 나라. 주 태왕의 아들 태백이 세웠다고 전하며, 기원전 585년 수몽이 왕을 칭하면서 중원과 교류하며 커졌다. 도읍은 고소(지금 쑤저우)였다. 합려가 오자서·손무의 도움으로 기원전 506년 백거 전투에서 초를 깨고 도읍 영을 점령했고, 부차는 월을 굴복시키고 기원전 482년 황지에서 제후와 회맹했다. 기원전 473년 월왕 구천에게 멸망했다
  mapNote: 지도에는 합려가 초를 깬 기원전 506년부터 기원전 476년까지 표시. 그 전의 오와 월의 땅은 비움
  endNote: 기원전 473년 월왕 구천에게 멸망함
  features:
    - 도읍은 고소(지금 쑤저우)
    - 기원전 585년 수몽이 왕을 칭하며 중원과 교류함
    - 합려가 기원전 506년 백거 전투에서 초를 깨고 도읍 영을 점령함
    - 부차가 월을 굴복시키고 기원전 482년 황지에서 회맹함
