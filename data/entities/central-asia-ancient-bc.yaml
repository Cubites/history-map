# central-asia ancient-bc 나라 (시대 파일 scripts/geo/areas/central-asia/ancient-bc.mjs의 짝 항목 파일, npm run new:area가 만든 틀)
# 시대·범위: 기원전 799~1: 아케메네스·그리스-박트리아·월지·오손·강거·차사
# 나라를 넣을 때 - id: …로 적는다(docs/DATA_GUIDE.md). 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'central-asia-ancient-bc').
# 칸 나눔(C4 뼈대 2026-11-07, ca4/c4/COMMON.md 4·5·6절): 구현 칸 SW·W·N·E는 아래 머리 줄(겹선 꼴, 칸 이름 + '항목') 가운데 자기 머리 아래 정의 항목만 고친다.
#   id·이름(ko)·색은 메인이 정한 값(표기 사전 data/tests/spelling.yaml이 먼저 정했으면 사전이 이김)이라 바꾸지 않는다(색은 C4 뼈대 skel/de.mjs로 이웃과 ΔE 26 넘게 고름).
#   from·to는 C4 결정 표의 값(천문 연도 — 기원전 N년 = 1−N) — 정의 칸이 사료로 한 번 확인한다(다르면 결과 노트 2절). 항목 to는 끝 해 포함, 지도는 칠하는 마지막 해까지. native는 정의 칸이 확인.
#   summary·mapNote는 뼈대의 자리 글이라 정의 칸이 바꿔 쓴다(endNote·features 3~5줄·basis.foundingNote도 그 칸이 더함 — COMMON 6절 탭 칸, startEvents·endEvents는 사건 ca-01 몫이라 빈 목록 그대로).
#   다른 칸이 칠하기만 하는 땅의 '지도에는 …' 문장은 그 칸 결과 노트 9절 문안을 정의 칸·합치기가 넣는다(COMMON 5절).
# 늘린 나라(서아시아·남아시아·유럽 yaml)와 C3 항목(central-asia-early-medieval·high-medieval yaml)은 이 파일에 두지 않고 그 파일 블록에서 고친다(COMMON 5절 굵은 칸만, 그 나라 글만).

# ══ C4 SW 항목 ══
# from은 B4(기원전 250 무렵 독립, 높은·낮은 연표의 가운데), 끝은 월지가 박트리아 북쪽을 차지한 기원전 130년 무렵(B5)
- id: greco-bactrian-kingdom
  level: polity
  names: { ko: 그리스-박트리아 왕국, en: Greco-Bactrian Kingdom, native: Βασιλεία τῆς Βακτριανῆς }
  from: -249
  to: -130
  color: "#36a19a"
  summary: 셀레우코스 제국에서 떨어져 나온 박트리아의 그리스인 왕국. 지금 아프가니스탄 북부와 우즈베키스탄·타지키스탄 남부의 박트리아를 중심으로, 기원전 250년 무렵 태수 디오도토스 1세가 독립해 세웠고 에우티데모스 1세 때 소그디아나·페르가나까지 넓힘
  endNote: 기원전 145년 무렵 북쪽 유목민 사카가 아이하눔을 무너뜨리고, 기원전 130년 무렵 월지가 아무다리야를 건너 박트리아를 차지하며 끝남. 힌두쿠시 남쪽으로 내려간 그리스인 왕들은 인도-그리스 왕국으로 이어짐
  mapNote: 지도에는 기원전 250년부터 기원전 131년까지 박트리아(지금 아프가니스탄 북부와 수르한다리야·타지키스탄 남부)를 그리고, 아리아(헤라트)·마르기아나(메르브)·아무다리야 왼쪽 기슭은 기원전 248~156년, 소그디아나·페르가나는 기원전 229~146년 그림. 힌두쿠시 남쪽 카불·아라코시아는 인도-그리스 왕국으로 따로 그리고, 바다흐샨·파미르는 비움. 경계는 지금 주 경계에 기댄 어림
  features:
    - 도읍은 박트라(지금 발흐)
    - 아무다리야 가의 아이하눔에 그리스식 극장과 체육관을 갖춘 도시를 둠
    - 기원전 208~206년 안티오코스 3세에게 박트라를 포위당했으나 화의로 왕위를 지킴
    - 기원전 180년 무렵 데메트리오스 1세가 힌두쿠시 남쪽으로 내려감
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Greco-Bactrian Kingdom", "위키백과 Diodotus I"]
    foundingNote: 디오도토스 1세가 셀레우코스 제국에서 떨어져 나온 해는 기원전 255년(높은 연표)·250년·245년(낮은 연표)으로 갈리며, 셀레우코스 제국 쪽 지도와 맞춰 기원전 250년을 시작으로 봄

# from은 흉노에게 밀려 서쪽으로 옮기기 시작한 기원전 176년(B6·M22), 지도는 박트리아 북쪽에 자리 잡은 기원전 130년부터 쿠샨 통일 앞까지
- id: yuezhi
  level: polity
  names: { ko: 월지, en: Yuezhi, native: 月氏 }
  from: -175
  to: 29
  color: "#8b5c4b"
  summary: 흉노에게 밀려 서쪽으로 옮겨 간 유목 집단과 그들이 박트리아에 세운 다섯 흡후의 땅. 본래 지금 중국 간쑤의 하서회랑에 살다가 기원전 176년 무렵 흉노에게 크게 져 일리 골짜기로 옮겼고, 기원전 132년 무렵 오손에게 다시 밀려 아무다리야 쪽으로 내려와 그리스-박트리아 왕국을 무너뜨림
  endNote: 기원후 1세기 초 다섯 흡후 가운데 하나인 쿠샨의 쿠줄라 카드피세스가 나머지 넷을 묶어 쿠샨 제국을 세우며 끝남
  mapNote: 지도에는 기원전 130년부터 기원후 29년까지 박트리아(지금 아프가니스탄 북부와 수르한다리야·타지키스탄 남부)를 그림. 하서회랑·일리 골짜기에서 떠돌던 기원전 176~131년은 땅을 칠하지 않고, 장건이 본 아무다리야 북쪽 왕정과 남쪽 박트리아를 한 땅으로 묶음. 경계는 지금 주 경계에 기댄 어림
  features:
    - 한의 장건이 기원전 128년 무렵 찾아와 흉노를 함께 치자고 했으나 거절함
    - 박트리아를 다섯 흡후(제후)가 나누어 다스림
    - 간쑤에 남은 무리는 소월지로 불림
    - 그리스-박트리아의 주화를 본뜬 주화를 찍음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Yuezhi", "위키백과 Zhang Qian"]
    foundingNote: 흉노의 묵돌 선우에게 크게 져 서쪽으로 옮기기 시작한 기원전 176년 무렵을 시작으로 봄(앞선 하서회랑 시기는 기록이 적음)

# ══ C4 W 항목 ══
# from은 다레이오스 3세 때 이미 독립 왕국이던 기원전 336년(B15), to는 아프리그 왕조(C3 afrighid-dynasty, 305~) 앞 해
- id: khwarazm-kingdom
  level: polity
  names: { ko: 호라즘 왕국, en: Kingdom of Khwarazm, native: Xwārizm }
  from: -335
  to: 304
  color: "#404c96"
  summary: 아무다리야 하류 호라즘 오아시스의 고대 왕국. 아케메네스 제국의 사트라피였다가 다리우스 3세 때인 기원전 4세기 중엽에는 이미 독립한 왕국이었고, 삼각주의 수로로 넓힌 오아시스에 성벽 도시를 쌓음
  endNote: 11세기 학자 알비루니의 전승에 따르면 305년 아프리그가 새 왕가를 열고 도읍을 카트로 옮겼으며, 그 뒤는 호라즘의 아프리그 왕조로 이어짐
  mapNote: 지도에는 기원전 336년부터 기원후 304년까지 아무다리야 양쪽 기슭의 호라즘 오아시스(지금 히바·우르겐치 쪽과 카라칼파크스탄 남부)를 그림. 알렉산드로스에게는 우호만 청했으므로 마케도니아 땅으로 그리지 않고, 쿠샨 제국·사산 제국과의 관계도 다스림의 근거가 약해 나누지 않음. 둘레의 우스튜르트 고원·키질쿰·카라쿰 사막은 비움. 경계는 근세 히바 칸국 땅에 기댄 어림이라 오아시스 둘레 사막도 조금 들어감
  features:
    - 기원전 329~328년 호라즘 왕 파라스마네스가 알렉산드로스에게 사절을 보내 우호를 청함
    - 기원후 1~2세기 아르타브 왕 때 세운 토프락칼라가 2~3세기의 도읍
    - 쿠샨 제국의 주화에 호라즘 글자를 덧찍어 썼으나 쿠샨의 다스림을 받았다는 근거는 없음
    - 아랄해로 흐르는 아무다리야 삼각주의 수로로 농사를 지음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["위키백과 Khwarazm", "위키백과 Toprak-Kala", "위키백과 Afrighids"]
    foundingNote: 다리우스 3세(기원전 336년 즉위) 때 이미 독립 왕국이었다는 서술에 기대어 기원전 336년을 시작으로 둠(더 이른 독립 해는 사료로 잡히지 않음). 그 뒤 305년까지 한 왕가가 이어졌다는 서술은 없고, 끝 해 305년도 알비루니 한 사람의 전승이라 약함

# ══ C4 N 항목 ══
# from은 감숙 시절의 첫 기록 기원전 160년 무렵(B14·M22), 지도는 일리·세미레치예로 옮긴 기원전 132년부터, 끝은 마지막 중국 기록 436년
- id: wusun
  level: polity
  names: { ko: 오손, en: Wusun, native: 烏孫 }
  from: -159
  to: 436
  color: "#bf4040"
  summary: 일리 골짜기와 세미레치예의 유목 왕국. 감숙 서쪽에서 월지와 이웃해 살다가 흉노의 도움으로 일리 쪽으로 옮겨 가, 군주 곤미가 이시크쿨 곁의 적곡성을 도읍으로 삼고 톈산 북쪽 초원을 다스림
  endNote: 5세기에 유연에게 밀려 파미르 쪽으로 옮겨 갔다고 전하며, 436년 북위에 사신을 보낸 것이 마지막 중국 기록
  features:
    - 기원전 133~132년 무렵 일리 골짜기에서 월지를 몰아내고 자리 잡음
    - 군주를 곤미라 부르고 도읍은 이시크쿨 곁의 적곡성
    - 기원전 110~105년 무렵 한의 공주를 왕비로 맞아 한과 손잡고 흉노를 견제함
    - 기원전 60년대 대곤미와 소곤미로 갈려 한이 둘 다 책봉함
  mapNote: 지도에는 기원전 132년부터 436년까지, 세미레치예와 일리 골짜기를 통째로 그림. 도성 적곡성의 자리는 확인되지 않아 경계는 지금 주 경계에 기댄 어림. 대·소곤미로 갈린 뒤에도 한 나라로 그리고, 한과는 동맹이라 종속으로 표시하지 않음
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『한서』 서역전 오손국", "위키백과 Wusun"]
    foundingNote: 감숙 서쪽에서 월지와 이웃해 살던 첫 기록 기원전 160년 무렵을 시작으로 보고, 지도는 일리로 옮겨 자리 잡은 기원전 132년부터 그림

# 장건이 다녀간 기원전 128년 무렵부터 크시오네스에게 복속된 270년 무렵까지(B13). 타슈켄트 쪽 세 조각은 W 칸이 같은 id로 칠함
- id: kangju
  level: polity
  names: { ko: 강거, en: Kangju, native: 康居 }
  from: -127
  to: 270
  color: "#40bf40"
  summary: 시르다리야 중류와 타슈켄트 쪽의 유목·정주 왕국. 기원전 128년 무렵 장건이 대완에서 대월지로 가는 길에 지나며 처음 기록했고, 활 쏘는 군사가 8~9만이라 할 만큼 큰 세력이었음
  endNote: 270년 무렵 북쪽에서 내려온 크시오네스에게 복속되며 기록에서 사라짐
  features:
    - 도읍은 비천(타슈켄트 쪽으로 봄), 핵심은 시르다리야 중류의 오트라르~타슈켄트 사이
    - 『한서』는 소그디아나의 다섯 소왕이 강거에 딸렸다고 적음
    - 기원전 101년 한의 대완 원정 때 대완을 도우려 함
    - 기원전 36년 이 땅에 들어온 흉노의 질지 선우가 한군에게 패해 죽음
  mapNote: 지도에는 기원전 128년부터 270년까지, 시르다리야 중류 띠(투르키스탄·오트라르·침켄트 쪽)와 타슈켄트·미르자출 초원(시르다리야주) 쪽을 그림. 소그디아나의 다섯 소왕은 이름뿐인 종속이라 그리지 않고, 시르다리야 하류(크질오르다 쪽)와 북쪽 초원도 비움. 경계는 카라타우 산줄기와 지금 주 경계에 기댄 어림
  startEvents: []
  endEvents: []
  basis:
    type: primary_source
    refs: ["『사기』 대완열전", "『한서』 서역전 강거국", "위키백과 Kangju"]
    foundingNote: 장건이 다녀가 처음 기록한 기원전 128년 무렵을 시작으로 봄

# ══ C4 E 항목 ══
# 투루판 분지의 차사(고사) 왕국 기원전 108년~441년(Q8, 442년부터는 C3 qu-gaochang이 이어 그림), vassal_of 서한 −59~8 한 줄(B21)
- id: jushi-kingdom
  level: polity
  names: { ko: 차사국, en: Jushi Kingdom, native: 車師 }
  from: -107
  to: 441
  color: "#95bf40"
  summary: 투루판 분지의 교하성을 도읍으로 한 오아시스 왕국(옛 이름 고사). 흉노와 한 사이에서 실크로드 북도의 길목을 두고 오래 시달림
  endNote: 442년 북량의 잔여 세력이 고창으로 옮겨 와 분지 동쪽을 차지하고, 450년 교하성마저 빼앗으면서 끝남
  features:
    - 기원전 108년 한의 조파노가 누란과 고사를 친 뒤 기록에 자주 나옴
    - 기원전 60년 무렵 교하 쪽 전부와 보그다산 북쪽 후부로 갈림
    - 한과 흉노가 이 땅의 둔전과 왕위를 두고 여러 번 다툼
    - 450년 북량 잔여 세력에게 교하성을 잃음
