# china sixteen-kingdoms 나라 (시대 파일 scripts/geo/areas/china/sixteen-kingdoms.mjs의 짝 항목 파일)
# 시대·범위: 5호 16국(M3): 304 ~ 439
# 권역 값은 파일 이름에서 정해진다(src/schema/regions.ts REGION_FILTER_OF의 'china-sixteen-kingdoms').
# 중국 M3a(2026-10-21): 5호 16국 앞쪽(304~383)에 새로 그리는 나라(한/전조·성한·후조·전량·대). 전연·전진·후연·북위·동진·서진은 china-early.yaml.
# 5년 미만이거나 1만 km² 미만인 나라(염위·단제·구지 등)는 그리지 않고 항목도 만들지 않는다. startEvents·endEvents는 위진 남북조 사건 묶음(cn-03)이 채운다.

- id: han-zhao
  level: polity
  names: { ko: 전조, hanja: 前趙, en: Han-Zhao }
  from: 304
  to: 329
  color: "#5f7fae"
  summary: 흉노 유연이 세운 5호 16국의 첫 나라. 304년 좌국성(지금 리스 서쪽)에서 한왕을 칭하며 국호를 한(漢)이라 했고, 308년 황제가 되어 이듬해 평양(지금 린펀)으로 도읍을 옮겼다. 311년 뤄양을 함락해 서진 회제를 사로잡고 316년 장안을 함락해 서진을 무너뜨렸다. 318년 근준의 난 뒤 유요가 즉위해 이듬해 장안으로 도읍을 옮기고 국호를 조(趙)로 바꾸었으나, 같은 해 석륵이 따로 서며 동쪽 땅을 잃었다. 329년 후조에게 멸망했다
  mapNote: 지도에는 304년부터 329년까지 표시하고, 304년 시허·리스 둘레, 308년 평양·하동·상당, 316년 관중·샨베이, 318년 평양 동쪽 상실, 323년 룽유(톈수이·핑량) 차지를 반영함. 311년 뤄양 함락과 그 뒤의 노략은 칠하지 않음
  endNote: 328년 뤄양 싸움에서 유요가 후조의 석륵에게 사로잡히고, 329년 상규가 함락되어 멸망함
  features:
    - 도읍은 좌국성에서 여정·포자·평양(지금 린펀)을 거쳐 319년 장안
    - 한(漢) 왕실을 잇는다며 국호를 한이라 했다가 319년 조로 바꿈
    - 311년 뤄양을 함락하고 서진 회제를 사로잡음(영가의 난)
    - 316년 장안을 함락해 서진 민제의 항복을 받음
    - 323년 진안을 깨고 룽유(톈수이·핑량)를 차지함
  startEvents: [han-zhao-304]
  endEvents: [later-zhao-319]
  basis:
    type: primary_source
    refs: ["『진서』 유원해재기·유요재기", "『자치통감』"]
    foundingNote: 304년 유연이 좌국성에서 한왕을 칭한 해를 시작으로 봄. 황제를 칭한 308년을 시작으로 보기도 함

- id: cheng-han
  level: polity
  names: { ko: 성한, hanja: 成漢, en: Cheng-Han }
  from: 304
  to: 347
  color: "#5e9a5c"
  summary: 파저(巴氐) 출신 이씨가 쓰촨에 세운 나라. 이특의 아들 이웅이 304년 청두를 차지해 성도왕을 칭했고, 306년 황제가 되어 국호를 대성이라 했다. 311년 무렵 파군, 314년 한중을 차지하고, 333년 닝주 자사 윤봉의 항복으로 남중(윈난·구이저우)까지 넓혔다. 338년 이수가 국호를 한(漢)으로 바꾸었다. 347년 동진의 환온에게 멸망했다
  mapNote: 지도에는 304년부터 347년까지 표시하고, 304년 청두 평원, 311년 파군·재동, 314년 한중·부릉·한자(쓰촨 서부 고원과 인핑 포함), 320년 월수(량산), 330년 파동, 333년 닝주(윈난·구이저우 서부)를 반영함
  endNote: 347년 동진의 환온이 청두에 이르자 이세가 항복해 멸망함
  features:
    - 도읍은 청두(옛 이름 성도)
    - 306년 이웅이 황제를 칭하고 국호를 대성이라 함
    - 333년 닝주 자사 윤봉이 항복해 남중을 차지함
    - 338년 이수가 이기를 몰아내고 국호를 한으로 바꿈
  startEvents: [cheng-han-304]
  endEvents: [cheng-han-304, huan-wen-347]
  basis:
    type: primary_source
    refs: ["『진서』 이특재기·이웅재기", "『화양국지』"]
    foundingNote: 304년 이웅이 청두에서 성도왕을 칭한 해를 시작으로 봄. 아버지 이특이 연호를 쓴 303년이나 황제를 칭한 306년을 시작으로 보기도 함

- id: later-zhao
  level: polity
  names: { ko: 후조, hanja: 後趙, en: Later Zhao }
  from: 319
  to: 351
  color: "#9a62a8"
  summary: 갈족 석륵이 화북 동부에 세운 나라. 한(전조)의 장수로 허베이·산시를 평정한 석륵이 319년 양국(지금 싱타이)에서 조왕을 칭해 따로 섰다. 323년 산둥을 차지하고 회수 북쪽까지 넓힌 뒤, 329년 전조를 멸해 랴오둥·허시를 뺀 화북을 다스렸으며 330년 황제를 칭했다. 335년 석호가 업으로 도읍을 옮겼다. 349년 석호가 죽은 뒤 내란과 염민의 난으로 무너져 351년 멸망했다
  mapNote: 지도에는 319년부터 351년까지 표시하고, 323년 산둥과 허난 황허강 남쪽·화이베이(325년 무렵 회수까지), 329년 관중·룽유·하동을 반영함. 350~351년 염위·전연에 떨어져 나간 땅은 그리지 않고, 351년 전진이 차지한 관중만 뺌
  endNote: 349년 석호가 죽은 뒤 아들들이 다투고 350년 염민이 업을 차지해 염위를 세웠으며, 351년 양국에서 버티던 석지가 죽어 멸망함
  features:
    - 도읍은 양국(지금 싱타이)에서 335년 업으로 옮김
    - 319년 조왕을 칭하고 330년 황제를 칭함
    - 328년 뤄양 싸움에서 전조의 유요를 사로잡음
    - 서역 승려 불도징을 받들어 불교가 화북에 퍼짐
  startEvents: [later-zhao-319]
  endEvents: [later-zhao-shi-hu-333]
  basis:
    type: primary_source
    refs: ["『진서』 석륵재기·석계룡재기", "『자치통감』"]
    foundingNote: 319년 석륵이 양국에서 조왕을 칭해 전조와 갈라선 해를 시작으로 봄. 황제를 칭한 330년을 시작으로 보기도 함

- id: former-liang
  level: polity
  names: { ko: 전량, hanja: 前涼, en: Former Liang }
  from: 317
  to: 376
  color: "#1f9fb0"
  summary: 한인 장씨가 허시 회랑에 세운 나라. 301년 양주 자사가 된 장궤 이래 장씨가 고장(지금 우웨이)을 근거로 다스렸고, 서진이 무너진 뒤에도 진(晉)의 연호를 쓰며 따로 섰다. 중원의 난리를 피해 온 사람들을 받아들여 학문이 이어졌다. 376년 전진에게 멸망했다
  mapNote: 지도에는 317년부터 376년까지 허시 회랑·란저우·시닝 둘레를 한 모습으로 표시함. 서역 쪽 땅은 그리지 않음
  endNote: 376년 전진의 부견이 군대를 보내 장천석이 항복하면서 멸망함
  features:
    - 도읍은 고장(지금 우웨이)
    - 서진이 무너진 뒤에도 민제의 연호 건흥을 이어 씀
    - 중원에서 피난 온 사람들을 받아들여 학문이 이어짐
  startEvents: [former-liang-301]
  endEvents: [former-liang-301]
  basis:
    type: primary_source
    refs: ["『진서』 장궤전", "『자치통감』"]
    foundingNote: 서진이 무너진 뒤 진의 연호를 이어 쓰며 따로 선 317년을 시작으로 봄. 장궤가 양주 자사가 된 301년, 장식이 뒤를 이은 314년, 장준이 가량왕(假涼王)을 칭한 345년을 시작으로 보기도 함

- id: tuoba-dai
  level: polity
  names: { ko: 대(代), hanja: 代, en: Dai (Tuoba) }
  from: 310
  to: 376
  color: "#c8873a"
  summary: 선비족 탁발부가 네이멍구 남부와 산시 북부에 세운 나라. 탁발의로가 310년 서진의 유곤을 도와 대공에 봉해지고, 313년 성락을 북도로, 평성(지금 다퉁)을 남도로 삼았으며 315년 대왕이 되었다. 탁발십익건 때 제도를 갖추었으나 376년 전진에게 멸망했다. 손자 탁발규가 386년 다시 세운 나라가 북위다
  mapNote: 지도에는 310년부터 376년까지 표시함. 310년 운중(후허하오터·바오터우)·삭주·평성(다퉁)과 장자커우 북쪽, 317년 대군(링추·위현)을 더하고, 352년부터는 다퉁·장자커우 쪽을 전연 땅으로 그려 운중·삭주만 남김
  endNote: 376년 전진의 공격을 받아 멸망함. 386년 탁발규가 나라를 다시 세움(북위)
  features:
    - 도읍은 성락(지금 후허하오터 남쪽 허린거얼)
    - 310년 서진의 유곤을 도와 대공에 봉해지고 315년 대왕이 됨
    - 313년 평성(지금 다퉁)을 남도로 삼음
  startEvents: [tuoba-dai-310]
  endEvents: [tuoba-dai-310]
  basis:
    type: primary_source
    refs: ["『위서』 서기", "『진서』 유곤전"]
    foundingNote: 탁발의로가 서진의 유곤을 도와 대공에 봉해지고 땅을 받은 310년을 시작으로 봄. 대왕이 된 315년을 시작으로 보기도 함

# 중국 M3b(2026-10-21): 5호 16국 뒤쪽(384~439)에 새로 그리는 나라(후진·서진(西秦)·후량(後涼)·남량·북량·서량·남연·하·서연·서촉). 적위·구지·철불부는 그리지 않는다.

- id: later-qin
  level: polity
  names: { ko: 후진(後秦), hanja: 後秦, en: Later Qin }
  from: 384
  to: 417
  color: "#5b7fc4"
  summary: 강족 요장이 관중에 세운 나라. 384년 전진에서 떨어져 나와 만년진왕을 칭하고, 385년 부견을 죽인 뒤 386년 장안에서 황제가 되었다. 요흥 때 전진의 남은 세력을 없애고 뤄양을 얻었으며, 서진(西秦)·후량(後涼)과 허시의 나라들을 굴복시켜 가장 넓었다. 407년 혁련발발이 하(夏)를 세워 북쪽 땅을 잃고, 417년 동진의 유유에게 장안을 빼앗겨 멸망했다
  mapNote: 지도에는 386년부터 417년까지 표시하고, 386년 관중 동·중부·샨베이, 394년 관중 서부·핑량·톈수이·하동, 399년 뤄양, 400년 서진(西秦) 땅을 반영함. 408년 샨베이를 하에게, 409·412년 서진(西秦)이 되찾은 땅을, 413년 핑량·칭양을, 416년 뤄양을 차례로 뺌. 403~406년 고장(우웨이)과 405년 동진에 돌려준 한수 북쪽 12군은 그리지 않음
  endNote: 416년 동진의 유유가 북벌해 뤄양을 빼앗고, 417년 장안이 함락되어 요홍이 항복하며 멸망함
  features:
    - 도읍은 장안(지금 시안). 384~386년에는 북지(지금 야오현 둘레)에 머묾
    - 394년 부등을 꺾어 전진의 남은 땅을 차지함
    - 399년 뤄양을, 400년 서진(西秦)을 차지하고 403년 후량(後涼)의 항복을 받음
    - 요흥이 구마라집을 장안에 맞아 불경 번역을 도움
  startEvents: [later-qin-yao-chang-384]
  endEvents: [liu-yu-later-qin-416]
  basis:
    type: primary_source
    refs: ["『진서』 요장재기·요흥재기", "『자치통감』"]
    foundingNote: 요장이 북지에서 만년진왕을 칭한 384년을 시작으로 봄. 장안에서 황제를 칭한 386년을 시작으로 보기도 함

- id: western-qin
  level: polity
  names: { ko: 서진(西秦), hanja: 西秦, en: Western Qin }
  from: 385
  to: 431
  color: "#86b04a"
  summary: 선비족 걸복부가 간쑤 중부에 세운 나라. 385년 걸복국인이 용사천(지금 위중)에서 일어나 전진에게서 원천왕에 봉해졌고, 동생 걸복건귀가 금성(지금 란저우 서쪽)으로 옮겼다. 400년 후진에게 망했다가 409년 다시 섰고, 걸복치반이 포한(지금 린샤)으로 옮겨 414년 남량을 멸했다. 431년 하(夏)에게 멸망했다
  mapNote: 지도에는 385년부터 431년까지 표시하되 후진에 속했던 400~408년은 비움. 385년 위중·란저우·린샤, 394년 룽시·남안을 더하고, 409년 위중·란저우에서 다시 서서 412년 린샤·룽시, 414년 시닝·하이둥을 반영함. 429년 서평(시닝)·하이둥을 북량에게, 430년 서쪽 옛 땅(린샤·란저우·위중)을 토욕혼에게 잃어 남안 둘레만 남김
  endNote: 430년 토욕혼에게 서쪽 땅 대부분을 빼앗기고 남안으로 옮겼으나, 431년 하(夏)의 혁련정에게 걸복모말이 항복해 멸망함
  features:
    - 도읍은 용사천·금성·서성·원천을 거쳐 412년 포한(지금 린샤)
    - 400년 후진에게 항복해 나라가 끊겼다가 409년 다시 세움
    - 414년 남량을 멸하고 시닝·하이둥을 차지함
  startEvents: [western-qin-385]
  endEvents: [western-qin-385]
  basis:
    type: primary_source
    refs: ["『진서』 걸복국인재기·걸복건귀재기", "『자치통감』"]
    foundingNote: 385년 걸복국인이 용사천에서 대선우를 칭한 해를 시작으로 봄. 400~409년은 후진에 속했으나 같은 나라로 봄

- id: later-liang-lu
  level: polity
  names: { ko: 후량(後涼), hanja: 後涼, en: Later Liang (Sixteen Kingdoms) }
  from: 386
  to: 403
  color: "#d07a8c"
  summary: 저족 여광이 허시 회랑에 세운 나라. 전진의 장수로 서역을 치고 돌아오던 여광이 386년 고장(지금 우웨이)에 들어가 량주를 차지했고, 389년 삼하왕, 396년 천왕을 칭했다. 397년 남량·북량이 갈라져 나가 고장 둘레만 남았고, 403년 여륭이 후진에게 항복해 끝났다
  mapNote: 지도에는 386년부터 403년까지 표시하고, 386년 허시 회랑 전체(둔황~우웨이)와 시닝, 397년 남량·북량이 떨어져 나간 뒤 우웨이 분지만을 반영함
  endNote: 남량·북량의 압박을 받던 여륭이 403년 후진에게 항복하고 땅을 넘겨 멸망함
  features:
    - 도읍은 고장(지금 우웨이)
    - 여광은 전진의 명으로 쿠차(구자)를 치고 구마라집을 데려옴
    - 397년 독발오고(남량)와 단업(북량)이 갈라져 나감
  startEvents: [later-liang-lu-382]
  endEvents: [later-liang-lu-382]
  basis:
    type: primary_source
    refs: ["『진서』 여광재기", "『자치통감』"]
    foundingNote: 여광이 386년 고장에 들어가 량주를 차지한 해를 시작으로 봄. 삼하왕을 칭한 389년이나 천왕을 칭한 396년을 시작으로 보기도 함

- id: southern-liang
  level: polity
  names: { ko: 남량, hanja: 南涼, en: Southern Liang }
  from: 397
  to: 414
  color: "#d9a441"
  summary: 선비족 독발부가 칭하이 동부에 세운 나라. 397년 독발오고가 후량(後涼)에서 떨어져 나와 서평왕을 칭했고, 낙도(지금 하이둥 러두)와 서평(지금 시닝)에 도읍했다. 독발녹단 때 후진에게서 고장을 받았으나 410년 북량에 밀려 낙도로 돌아왔고, 414년 서진(西秦)에게 멸망했다
  mapNote: 지도에는 397년부터 414년까지 표시하고, 시닝·하이둥(토욕혼 땅을 뺀 손그림 중국 안)과 406~409년의 고장(우웨이 분지)을 반영함
  endNote: 414년 서진(西秦)의 걸복치반이 낙도를 함락해 독발녹단이 항복하며 멸망함
  features:
    - 도읍은 낙도·서평(지금 시닝)·고장을 거쳐 410년 다시 낙도
    - 404년 후진에 칭신했다가 408년 다시 왕을 칭함
    - 406년 후진에게서 고장을 받았으나 410년 북량에 밀려 떠남
  startEvents: [three-liang-397]
  endEvents: [three-liang-397, western-qin-385]
  basis:
    type: primary_source
    refs: ["『진서』 독발오고재기·독발녹단재기", "『자치통감』"]
    foundingNote: 독발오고가 397년 대선우·서평왕을 칭한 해를 시작으로 봄

- id: northern-liang
  level: polity
  names: { ko: 북량, hanja: 北涼, en: Northern Liang }
  from: 397
  to: 439
  color: "#2f86b8"
  summary: 노수호 저거씨가 허시 회랑에 세운 나라. 397년 저거남성이 건강(지금 가오타이 둘레)에서 단업을 량주목으로 세웠고, 401년 저거몽손이 단업을 죽이고 왕이 되었다. 411년 고장을 얻어 이듬해 도읍을 옮기고, 421년 서량을 멸해 허시 회랑을 모두 차지했다. 439년 북위의 태무제에게 고장이 함락되어 멸망했다
  mapNote: 지도에는 397년부터 439년까지 표시하고, 397년 장예·주취안·둔황, 400·401년 둔황·주취안을 서량에게 잃은 모습, 411년 고장(우웨이), 420년 주취안, 421년 둔황, 429년 서진(西秦)에게서 빼앗은 서평(시닝)·낙도(하이둥)를 반영함. 439년 뒤 고창(투루판)으로 옮긴 잔존 세력은 그리지 않음
  endNote: 439년 북위가 고장을 포위하자 저거목건이 항복해 멸망함. 남은 무리는 고창으로 옮겨 460년까지 이어짐
  features:
    - 도읍은 건강·장액(지금 장예)을 거쳐 412년 고장(지금 우웨이)
    - 401년 저거몽손이 단업을 죽이고 나라를 이음
    - 421년 서량을 멸해 허시 회랑을 통일함
    - 불교를 크게 받들어 담무참이 불경을 번역함
  startEvents: [three-liang-397]
  endEvents: [juqu-mengxun-401, northern-wei-unification-424]
  basis:
    type: primary_source
    refs: ["『진서』 저거몽손재기", "『송서』 저거몽손전", "『자치통감』"]
    foundingNote: 397년 단업이 건강에서 량주목을 칭한 해를 시작으로 봄. 저거몽손이 즉위한 401년을 시작으로 보기도 함

- id: western-liang
  level: polity
  names: { ko: 서량, hanja: 西涼, en: Western Liang }
  from: 400
  to: 421
  color: "#8f72c9"
  summary: 한족 이고가 둔황에 세운 나라. 북량의 둔황 태수였던 이고가 400년 자립해 양공을 칭했고, 405년 주천(지금 주취안)으로 도읍을 옮겼다. 420년 이흠이 북량과 싸우다 죽어 주천을 잃었고, 421년 둔황이 함락되어 멸망했다
  mapNote: 지도에는 400년부터 421년까지 표시하고, 400년 둔황(옥문 서쪽), 401년 주취안, 420년 주취안을 잃은 모습을 반영함
  endNote: 420년 이흠이 북량의 저거몽손에게 패해 죽고, 421년 둔황에서 이순이 자결하며 멸망함
  features:
    - 도읍은 돈황(지금 둔황)에서 405년 주천(지금 주취안)
    - 이고는 당 왕실이 조상으로 받든 사람임
    - 동진에 사신을 보내 진의 신하를 자처함
  startEvents: [three-liang-397]
  endEvents: [three-liang-397]
  basis:
    type: primary_source
    refs: ["『진서』 양무소왕전", "『자치통감』"]
    foundingNote: 이고가 400년 둔황에서 자립해 양공을 칭한 해를 시작으로 봄. 멸망은 이순이 죽은 421년으로 봄(420년으로 보기도 함)

- id: southern-yan
  level: polity
  names: { ko: 남연, hanja: 南燕, en: Southern Yan }
  from: 398
  to: 410
  color: "#4a9fb5"
  summary: 선비족 모용덕이 산둥에 세운 나라. 후연이 북위에 밀리자 모용덕이 398년 활대(지금 화현)에서 연왕을 칭했고, 활대를 잃은 뒤 399년 동진의 청주를 빼앗아 광고(지금 칭저우)에 자리 잡고 400년 황제가 되었다. 410년 동진의 유유에게 광고가 함락되어 멸망했다
  mapNote: 지도에는 399년부터 410년까지 산둥 동·중부(동쪽 바다, 남쪽 사수, 서쪽 거야택, 북쪽 황허강)를 표시함. 398~399년의 활대 시기는 그리지 않음
  endNote: 409년 동진의 유유가 북벌해 이듬해 410년 광고를 함락하고 모용초를 사로잡아 멸망함
  features:
    - 도읍은 활대에서 399년 광고(지금 칭저우)
    - 모용덕은 전연을 세운 모용황의 아들로 후연 모용수의 아우
    - 모용초가 동진의 회수 북쪽을 노략해 유유의 북벌을 부름
  startEvents: [southern-yan-398]
  endEvents: [southern-yan-398]
  basis:
    type: primary_source
    refs: ["『진서』 모용덕재기·모용초재기", "『자치통감』"]
    foundingNote: 모용덕이 398년 활대에서 연왕을 칭한 해를 시작으로 봄. 영토는 청주를 차지한 399년부터 그림

- id: helian-xia
  level: polity
  names: { ko: 하(夏), hanja: 夏, en: Xia (Helian) }
  from: 407
  to: 431
  color: "#c0609c"
  summary: 흉노 철불부의 혁련발발이 오르도스에 세운 나라로 대하라고도 함. 407년 후진에서 떨어져 나와 대하천왕을 칭하고, 413년 통만성(지금 위린 징볜 북쪽)을 쌓았으며, 418년 동진에게서 장안을 빼앗아 황제가 되었다. 427년 북위가 통만성을 함락하고 430년 관중을 잃었으며, 431년 서진(西秦)을 멸한 혁련정이 토욕혼에게 사로잡혀 멸망했다
  mapNote: 지도에는 407년부터 431년까지 표시하고, 407년 오르도스·닝샤 북부, 408년 샨베이·고평, 413년 핑량·칭양, 418년 관중·톈수이·하동을 반영함. 427년 통만성 함락으로 오르도스·샨베이를, 430년 관중을 북위에게 뺌. 426~427년 북위의 장안 점령(428년 하가 되찾음)은 그리지 않음
  endNote: 431년 혁련정이 북량을 치러 서쪽으로 가다 황허강을 건너던 중 토욕혼에게 사로잡혀 멸망함
  features:
    - 도읍은 통만성. 427년 통만성을 잃은 뒤 상규(지금 톈수이)·핑량으로 옮김
    - 407년 혁련발발이 장인 몰혁간을 치고 그 무리를 빼앗아 섬
    - 418년 동진에게서 장안을 빼앗고 파상에서 황제를 칭함
  startEvents: [helian-xia-407]
  endEvents: [helian-xia-407, northern-wei-unification-424]
  basis:
    type: primary_source
    refs: ["『진서』 혁련발발재기", "『위서』 철불유호전", "『자치통감』"]
    foundingNote: 혁련발발이 407년 대하천왕을 칭한 해를 시작으로 봄

- id: western-yan
  level: polity
  names: { ko: 서연, hanja: 西燕, en: Western Yan }
  from: 384
  to: 394
  color: "#5aa58a"
  summary: 선비족 모용홍이 384년 관중에서 일으킨 나라. 모용충이 385년 장안을 차지했으나 이듬해 동쪽으로 옮겼고, 모용영이 386년 장자(지금 창즈)에 도읍해 산시 중남부를 다스렸다. 394년 후연의 모용수에게 멸망했다
  mapNote: 지도에는 386년부터 394년까지 장자 둘레 산시 중남부(평양·상당 서쪽·하동)를 표시함. 385~386년의 장안은 그리지 않고, 타이위안 둘레와 타이항산 동쪽은 북위·후연 땅으로 그려 비켜 감
  endNote: 394년 후연의 모용수가 장자를 함락하고 모용영을 죽여 멸망함
  features:
    - 도읍은 장안을 거쳐 386년 장자(지금 창즈)
    - 384~386년 사이 왕이 여러 번 바뀐 끝에 모용영이 즉위함
    - 394년 같은 모용씨의 후연에게 멸망함
  startEvents: [western-yan-384]
  endEvents: [western-yan-384]
  basis:
    type: primary_source
    refs: ["『진서』 모용충재기", "『자치통감』"]
    foundingNote: 모용홍이 384년 관중에서 군사를 일으켜 제북왕을 칭한 해를 시작으로 봄

- id: western-shu
  level: polity
  names: { ko: 서촉, hanja: 西蜀, en: Western Shu (Qiao Zong) }
  from: 405
  to: 413
  color: "#8a6bbf"
  summary: 동진의 장수 초종이 쓰촨에 세운 나라로 초촉(譙蜀)이라고도 함. 405년 익주에서 군사들이 반란을 일으켜 초종을 성도왕으로 세웠고, 후진에 칭신했다. 410년 무렵 파동까지 넓혔으나 413년 동진의 주령석에게 청두가 함락되어 멸망했다
  mapNote: 지도에는 405년부터 413년까지 표시하고, 405년 쓰촨 분지와 충칭 서부, 410년 충칭 동부를 반영함
  endNote: 413년 동진의 주령석이 청두를 함락하자 초종이 자결해 멸망함
  features:
    - 도읍은 청두
    - 405년 동진 익주의 군사 반란으로 초종이 성도왕에 오름
    - 후진에 칭신해 도움을 받음
  startEvents: [western-shu-405]
  endEvents: [western-shu-405]
  basis:
    type: primary_source
    refs: ["『진서』 초종전", "『자치통감』"]
    foundingNote: 405년 초종이 청두에서 성도왕을 칭한 해를 시작으로 봄
