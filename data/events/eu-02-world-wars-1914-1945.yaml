# ── 전체주의와 2차 대전으로 가는 길 (1933 ~ 1939) ─────

- id: nazi-seizure-1933
  year: 1933
  endYear: 1934
  title:
    ko: 나치 독일의 성립과 수권법
  summary:
    ko: "대공황으로 실업자가 넘치고 의회가 다수파를 만들지 못하자 바이마르 공화국에서는 대통령 긴급 명령에 기대는 내각이 이어졌다. 베르사유 체제 타파와 반유대주의, 반공주의를 내건 히틀러의 국가 사회주의 독일 노동자당(나치당)은 1930년 총선에서 18%를 얻어 크게 늘었고, 1932년 7월 총선에서 37%를 얻어 제1당이 되었다. 그를 이용할 수 있다고 여긴 보수 정치인들의 주선으로 힌덴부르크 대통령은 1933년 1월 30일 히틀러를 총리로 임명했다. 2월 27일 국회 의사당 화재가 나자 이를 공산당의 소행으로 몰아 이튿날 기본권을 정지하는 긴급 명령을 내렸고, 3월 23일 국회는 정부가 의회 없이 법률을 만들 수 있게 하는 수권법을 통과시켰다(사회 민주당만 반대, 공산당 의원들은 체포되거나 숨어 참석하지 못함). 7월에는 나치당 말고 모든 정당이 금지되었고, 10월 독일은 국제 연맹과 군축 회의에서 탈퇴했다. 1934년 6월 말 '긴 칼의 밤'에 돌격대(SA) 지도부 등 정적을 살해했고, 8월 힌덴부르크가 죽자 히틀러는 대통령직을 합친 총통(퓌러)이 되었다. 비밀경찰 게슈타포와 친위대(SS)가 사회를 감시하고, 선전부 장관 괴벨스가 언론과 문화를 통제했다."
  subjects: [nazi-germany, weimar-republic]
  tags: [politics]
  sources: ["「민족과 제국의 곤경을 제거하기 위한 법률(수권법)」(1933)", "이언 커쇼, 『히틀러』(교양인, 2010)"]

- id: nuremberg-laws-1935
  year: 1935
  endYear: 1938
  title:
    ko: 뉘른베르크법과 수정의 밤
  summary:
    ko: "나치는 1933년 4월 유대인 상점 불매 운동과 유대인 공무원 해임으로 박해를 시작했다. 1935년 9월 15일 뉘른베르크 당 대회 때 만든 뉘른베르크법은 '독일인 또는 그와 같은 계통의 혈통'만 제국 시민으로 인정해 유대인의 시민권을 빼앗고, 유대인과 독일인의 결혼과 성관계를 금지했다. 11월 시행령은 조부모 가운데 유대인이 몇 명인지로 유대인을 가렸고, 같은 차별이 로마(집시)와 흑인에게도 적용되었다. 박해를 피해 많은 유대인이 나라를 떠났다. 1938년 11월 9~10일에는 파리에서 독일 외교관이 유대인 청년에게 살해된 일을 구실로 나치가 전국에서 유대교 회당과 유대인 상점을 부수고 불태웠으며(수정의 밤), 유대인 남성 약 3만 명을 강제 수용소로 끌고 갔다. 정부는 그 피해를 오히려 유대인 공동체에 10억 라이히스마르크의 벌금으로 물렸다."
  subjects: [nazi-germany]
  tags: [politics, society]
  sources: ["「제국 시민법」·「독일인의 혈통과 명예를 보호하기 위한 법률」(1935)", "라울 힐베르크, 『홀로코스트 유럽유대인의 파괴』(개마고원, 2008)"]

- id: rearmament-1935
  year: 1935
  endYear: 1937
  title:
    ko: 독일의 재군비와 에티오피아 침공, 추축의 형성
  summary:
    ko: "1935년 1월 주민 투표(90% 넘는 찬성)로 자르 지역의 독일 반환이 결정되자(실제 반환은 3월 1일), 히틀러는 3월 징병제를 되살리고 공군을 공개해 베르사유 조약의 군비 제한을 깨뜨렸다. 영국·프랑스·이탈리아는 4월 스트레사에서 이를 규탄했지만, 영국은 6월 독일 해군을 영국의 35%까지 허용하는 영독 해군 협정을 따로 맺었다. 10월 이탈리아는 에티오피아를 침공해 독가스까지 쓰며 이듬해 5월 수도 아디스아바바를 점령하고 합병했다. 국제 연맹은 이탈리아에 경제 제재를 내렸으나 석유를 빼놓아 효과가 없었다. 영국·프랑스가 에티오피아 문제에 매달린 틈에 히틀러는 1936년 3월 7일 비무장 지대인 라인란트에 군대를 들여보내 로카르노 조약까지 깨뜨렸지만, 총선을 앞둔 프랑스와 전쟁을 꺼린 영국은 맞서지 않았다. 고립된 이탈리아는 독일과 가까워져 1936년 10월 협정을 맺었고, 무솔리니는 '베를린-로마 추축'을 선언했다. 11월에는 독일과 일본이 공산주의에 맞선다는 방공 협정을 맺었고, 1937년 11월 이탈리아가 가세한 뒤 12월 국제 연맹을 탈퇴했다. 그 사이 일본은 1937년 7월 중일 전쟁을 일으켜 중국 침략을 넓혔다."
