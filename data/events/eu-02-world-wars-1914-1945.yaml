- id: holocaust-1941
  year: 1941
  endYear: 1945
  title:
    ko: 홀로코스트
  summary:
    ko: "나치 독일은 인종주의에 따라 유럽의 유대인을 없애려 했다. 폴란드를 점령한 뒤 유대인을 바르샤바 등의 게토에 몰아넣었고, 1941년 6월 소련 침공과 함께 친위대 특수 기동대(아인자츠그루펜)가 점령지의 유대인을 대량으로 총살했다(9월 키이우 근처 바비야르에서만 3만 3천여 명). 1942년 1월 베를린 교외의 반제 회의에서는 하이드리히의 주재로 유럽 유대인을 모두 죽이는 '최종 해결'의 실행을 조율했다. 독일은 점령한 폴란드 땅에 트레블링카·소비보르·베우제츠 등 절멸 수용소를 세우고, 독일에 병합한 땅의 아우슈비츠-비르케나우 수용소 등에서 유럽 각지에서 화물 열차로 실어 온 사람들을 가스실에서 죽였다. 바르샤바 게토의 유대인들은 1943년 4월 무장 봉기를 일으켰으나 진압되었다. 1944년에는 독일이 점령한 헝가리에서도 헝가리 당국의 협력 아래 40만 명 넘는 유대인이 아우슈비츠로 끌려갔다. 이렇게 약 600만 명, 유럽 유대인의 3분의 2가 희생되었고, 로마(집시)·장애인·폴란드인·소련군 포로 등도 대량으로 학살되었다. 1945년 1월 27일 소련군이 아우슈비츠를 해방했다. 전후 뉘른베르크 국제 군사 재판(1945~1946)은 나치 지도자들을 '인도에 반한 죄' 등으로 처벌했다."
