- id: austria-hungary-dissolution-1918
  year: 1918
  endYear: 1920
  title:
    ko: 오스트리아-헝가리의 해체와 생제르맹·트리아농 조약
  summary:
    ko: "패전이 다가오자 오스트리아-헝가리 안의 민족들이 잇달아 독립을 선언했다. 1918년 10월 28일 체코슬로바키아가 독립을 선언했고, 이튿날 남슬라브인들이 세운 국가는 12월 1일 세르비아와 합쳐 세르브·크로아트·슬로베니아 왕국(뒤의 유고슬라비아)이 되었다. 몬테네그로에서는 11월 포드고리차 의회가 니콜라 1세를 폐위하고 세르비아와의 통합을 결의해 함께 들어갔으나, 이에 반대한 세력이 1919년 1월 봉기했다(크리스마스 봉기). 옛 러시아·독일·오스트리아에 나뉘어 있던 땅에서는 폴란드가 11월 독립을 선포했다. 황제 카를 1세가 11월 11일 국정에서 물러나자 이튿날 독일계 오스트리아 공화국이 선포되었고, 헝가리도 따로 공화국이 되었다. 연합국은 오스트리아와 생제르맹 조약(1919년 9월 10일)을 맺어 보헤미아·모라비아를 체코슬로바키아에, 남티롤·트리에스테·이스트리아를 이탈리아에 넘기게 하고 독일과의 합병을 금지했다. 헝가리는 트리아농 조약(1920년 6월 4일)으로 옛 헝가리 왕국 땅의 70% 남짓을 루마니아(트란실바니아)·체코슬로바키아·세르브·크로아트·슬로베니아 왕국·오스트리아에 넘겨, 300만 명이 넘는 헝가리인이 나라 밖에 남게 되었다. 불가리아도 뇌이 조약(1919년 11월)으로 에게해 쪽 서트라키아 등을 잃었다. 민족 자결을 내세웠지만 새 국경 안팎에 많은 소수 민족이 남아 뒤의 분쟁의 씨앗이 되었다."
