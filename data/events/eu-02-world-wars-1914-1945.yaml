- id: barbarossa-1941
  year: 1941
  endYear: 1942
  title:
    ko: 독소 전쟁의 시작
  summary:
    ko: "히틀러는 동쪽에 독일 민족의 '생존 공간'을 마련하고 공산주의를 무너뜨리려 1941년 6월 22일 불가침 조약을 깨고 소련을 침공했다(바르바로사 작전). 루마니아·핀란드·헝가리·이탈리아 등이 함께한 약 380만 명의 추축군이 북쪽(레닌그라드), 가운데(모스크바), 남쪽(우크라이나)의 세 갈래로 나아갔다. 핀란드는 겨울 전쟁에서 잃은 땅을 되찾으려 독일 편에서 다시 싸워(계속 전쟁) 옛 국경을 넘어 동카렐리야까지 점령했다. 소련군은 개전 초 크게 무너져 9월 키이우 포위전에서만 약 60만 명이 포로가 되었고, 레닌그라드는 9월부터 1944년 1월까지 900일 가까이 포위되어 굶주림으로 수많은 시민이 죽었다. 소련은 공장을 우랄산맥 동쪽으로 옮기고 물러나며 시설을 불태웠다. 10월 독일군은 모스크바로 진격했으나 진창과 혹한에 발이 묶였고, 일본이 남쪽으로 나아가리라는 판단에 따라 극동에서 옮겨 온 병력까지 더한 소련군의 반격(12월 5일)에 밀려났다. 독일은 12월 11일 미국에도 선전 포고했다. 독일은 침공 전부터 소련 점령지의 식량을 빼앗아 주민을 굶주리게 할 계획(기아 계획)을 세웠고, 사로잡은 소련군 포로 약 570만 명 가운데 300만 명 넘게 굶주림과 학대로 죽었다."
