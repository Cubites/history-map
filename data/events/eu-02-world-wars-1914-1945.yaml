- id: fall-of-france-1940
  year: 1940
  title:
    ko: 프랑스의 항복과 비시 정부
  summary:
    ko: "1940년 4월 9일 독일은 덴마크를 점령하고 노르웨이를 침공했다. 영국·프랑스는 노르웨이 북부 나르비크 등에 군대를 보냈으나 6월 초 물러났다. 5월 10일 독일군이 네덜란드·벨기에·룩셈부르크로 쳐들어가 서부 공세를 시작했고, 같은 날 영국에서는 처칠이 총리가 되었다. 연합군 주력이 벨기에로 나아간 사이 독일 기갑 부대가 전차가 지나기 어렵다고 여겨지던 아르덴 숲을 지나 스당에서 뫼즈강을 건넜고(5월 13~15일), 영국 해협까지 내달려 연합군을 둘로 갈랐다. 네덜란드(5월 15일)와 벨기에(5월 28일)가 항복했고, 포위된 영국·프랑스군 약 33만 8천 명은 됭케르크에서 배로 철수했다(5월 26일~6월 4일). 6월 10일 이탈리아가 참전했고 14일 독일군이 파리에 들어갔다. 6월 16일 총리가 된 페탱이 휴전을 청했고, 6월 22일 콩피에뉴의 1918년 휴전 협정을 맺었던 바로 그 열차 안에서 프랑스 대표 욍치제르 장군이 휴전 협정에 서명했다. 프랑스 북부와 대서양 해안은 독일 점령 지구가 되었고, 남부에서는 휴양 도시 비시에 자리 잡은 페탱 정부가 7월 의회에서 전권을 넘겨받아 독일에 협력했다. 런던으로 건너간 드골은 6월 18일 라디오로 항전을 호소하며 자유 프랑스를 이끌었다."
