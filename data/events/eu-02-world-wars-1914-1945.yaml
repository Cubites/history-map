- id: tripartite-pact-1940
  year: 1940
  endYear: 1941
  title:
    ko: 삼국 동맹과 일소 중립 조약
  summary:
    ko: "1940년 9월 27일 독일·이탈리아·일본은 베를린에서 삼국 동맹을 맺어 유럽과 동아시아의 '새 질서'에서 서로의 지도적 지위를 인정하고, 아직 전쟁에 들지 않은 나라(사실상 미국)에게 공격받으면 함께 싸우기로 했다. 같은 달 일본은 프랑스령 인도차이나 북부에 군대를 들여보냈다. 헝가리·루마니아·슬로바키아(1940년 11월)와 불가리아(1941년 3월)도 동맹에 들어왔다. 이탈리아는 1940년 10월 그리스를 침공했다가 고전했고, 유고슬라비아에서 동맹 가입(1941년 3월 25일)에 반대하는 쿠데타가 일어나자 독일은 4월 유고슬라비아와 그리스를 침공해 점령했다. 앞서 1939년 노몬한(할힌골)에서 소련군에 크게 진 일본은 북쪽을 안정시키려고 1941년 4월 13일 모스크바에서 소련과 5년 기한의 일소 중립 조약을 맺었고, 소련도 독일의 침공에 대비해 동쪽의 부담을 덜었다. 7월 일본이 인도차이나 남부까지 나아가자 미국은 일본 자산을 동결하고 석유 수출을 막았고, 일본은 12월 진주만을 기습해 태평양 전쟁을 일으켰다. 일본은 전쟁을 이어 가려고 국가 총동원법(1938)에 따라 조선에서 인력과 물자를 더욱 가혹하게 빼앗았다."
