- id: siberian-intervention-1918
  year: 1918
  endYear: 1922
  title:
    ko: 시베리아 출병과 연해주의 한인
  summary:
    ko: "러시아가 전쟁에서 빠지자 연합국은 시베리아에 고립된 체코슬로바키아 군단을 구한다는 명분으로 1918년 8월 블라디보스토크 등에 군대를 보냈다. 미국은 일본에 7천 명 정도의 파병을 요청했으나 일본은 7만 명이 넘는 병력을 보내 바이칼호 동쪽까지 나아갔다. 출병을 앞두고 쌀 사재기 등으로 쌀값이 치솟아 일본 전국에서 쌀 소동(1918년 7~9월)이 일어났고 데라우치 내각이 물러났다. 일본은 그 뒤 식민지 조선에서 쌀을 더 가져가려고 산미 증식 계획(1920~)을 세웠다. 연해주의 한인들은 혁명 세력과 손잡고 독립운동을 펼쳤는데, 1918년 하바롭스크에서 이동휘 등이 한인 사회당을 만들었다. 미군이 철수한 직후인 1920년 4월 초 일본군은 블라디보스토크의 신한촌 등 연해주 곳곳을 습격해 한인과 러시아인을 학살하고 최재형 등 지도자를 처형했다(4월 참변). 같은 해 일본은 니콜라옙스크에서 빨치산과 싸우던 일본군과 거류민 수백 명이 죽은 사건(니항 사건)을 구실로 북사할린을 점령했다. 한편 시베리아에서 철수하던 체코 군단의 무기 일부는 북간도 독립군이 사들여 그해 10월 청산리 전투 등에 쓴 것으로 알려져 있다. 일본군은 안팎의 비판 속에 1922년 10월 연해주에서, 1925년 북사할린에서 물러났다."
  subjects: [japan, soviet-union, usa, occupied-korea]
