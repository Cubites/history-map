- id: twenty-one-demands-1915
  year: 1915
  title:
    ko: 일본의 21개조 요구
  summary:
    ko: "영일 동맹을 내세워 참전한 일본은 1914년 11월 독일의 조차지 칭다오를 점령하고 산둥반도의 독일 철도와 이권을 손에 넣었다. 유럽 열강이 전쟁에 묶인 틈을 타 오쿠마 내각은 1915년 1월 위안스카이 정부에 21개조 요구를 내밀었다. 산둥의 독일 권익을 넘겨받고, 뤼순·다롄과 남만주 철도의 조차 기한을 99년으로 늘리며, 중국 정부에 일본인 고문을 두게 하는 내용 등이었다. 요구가 알려져 중국 안팎에서 반발이 거세자 일본은 고문 조항 등 제5호를 미루고 나머지를 최후통첩(5월 7일)으로 들이밀었고, 위안스카이 정부는 5월 9일 이를 받아들였다(5월 25일 조약 체결). 중국에서는 이날(또는 최후통첩을 받은 5월 7일)을 국치일로 기억하며 일본 상품 배척 운동을 벌였고, 이 반감은 5·4 운동(1919)으로 이어졌다. 앞서 1914년 대전이 터지자 일본과 같은 협상국 편이 된 러시아는 연해주의 한인 단체 권업회를 해산시키는 등 한인의 독립운동을 단속했다."
  subjects: [japan, roc, russia, occupied-korea]
  links:
    - { from: japan, to: roc, note: "21개조 요구, 산둥 권익 장악" }
