  tags: [diplomacy, war]
  sources: ["「브레스트-리토프스크 조약」(1918)", "쉴라 피츠패트릭, 『러시아혁명 1917-1938』(사계절, 2017)"]

- id: baltic-independence-1918
  year: 1918
  endYear: 1920
  title:
    ko: 발트 3국의 독립과 독립 전쟁
  summary:
    ko: "러시아 제국의 발트 지역은 1차 대전 중 독일군에 점령되었다. 리투아니아 평의회는 1918년 2월 16일, 에스토니아 구제 위원회는 독일군이 탈린에 들어오기 직전인 2월 24일 독립을 선언했으나, 독일 점령 아래 실제 정부를 세우지 못했다. 브레스트-리토프스크 조약으로 소비에트 러시아가 이 지역에서 손을 떼자 독일은 발트 독일인 귀족 중심의 위성 국가를 꾸리려 했다. 11월 독일이 항복한 뒤 라트비아도 11월 18일 독립을 선언했고, 물러나는 독일군의 자리를 노린 적군(붉은 군대)이 서쪽으로 쳐들어와 세 나라는 독립 전쟁을 치렀다. 에스토니아는 영국 함대와 핀란드 의용병의 도움을 받아 적군을 몰아냈다. 라트비아에서는 발트 독일인 민병대(란데스베어)와 독일 의용군(철사단 등)까지 끼어들었다. 이들은 1919년 5월 22일 적군이 차지했던 리가를 되찾은 뒤 볼셰비키 지지자로 몬 사람들을 처형했는데, 희생자는 174명(1924년 리가 헌병대장)에서 3천~5천 명까지 추산 차이가 크다. 6월에는 에스토니아군과 라트비아군이 체시스 전투에서 란데스베어와 독일 의용군을 꺾었다. 리투아니아는 적군과 독일 쪽 의용군, 그리고 빌뉴스를 두고 폴란드와 싸웠다. 소비에트 러시아는 1920년 타르투 조약(2월, 에스토니아)·모스크바 조약(7월, 리투아니아)·리가 조약(8월, 라트비아)으로 세 나라의 독립을 인정했다. 그러나 10월 폴란드의 젤리고프스키 장군 부대가 빌뉴스를 차지해(1922년 폴란드에 병합) 리투아니아는 카우나스를 임시 수도로 삼았고, 두 나라의 관계는 오래 얼어붙었다. 세 나라는 1940년 소련에 병합되었다가 1991년 독립을 되찾았고, 한국은 그해 10월 세 나라와 수교했다."
  subjects: [estonia, latvia, lithuania, soviet-union, german-empire, poland]
