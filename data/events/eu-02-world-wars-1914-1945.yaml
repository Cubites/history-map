- id: turkey-republic-1923
  year: 1923
  endYear: 1934
  title:
    ko: 로잔 조약과 튀르키예 공화국
  summary:
    ko: "앙카라 정부는 연합국과 로잔 조약(1923년 7월 24일)을 맺어 세브르 조약을 대신했다. 아나톨리아와 동트라키아를 튀르키예 땅으로 인정받고 외국인의 영사 재판권 같은 특권을 없앴으며, 해협은 비무장으로 열어 두기로 했다. 이에 앞서 1월 그리스와 맺은 협약에 따라 튀르키예의 그리스 정교도 약 120만 명과 그리스의 무슬림 약 40만 명이 서로 강제로 옮겨 갔다. 앙카라를 수도로 삼은 대국민 의회는 10월 29일 공화국을 선포했고 무스타파 케말이 대통령이 되었다. 그는 칼리프 제도를 없애고(1924) 이슬람을 국교에서 빼는 등(1928) 정치와 종교를 떼어 놓았으며, 스위스 민법을 본뜬 민법(1926)으로 일부다처제를 금지하고, 아랍 문자 대신 라틴 문자를 쓰게 했다(1928). 여성은 1934년 국회 의원 선거권을 얻었고, 같은 해 성씨법에 따라 케말은 '튀르크인의 아버지'라는 뜻의 아타튀르크라는 성을 받았다. 개혁은 위에서 강하게 밀어붙인 것이어서, 공화 인민당 일당 체제 아래 쿠르드인의 반란(1925) 등 반대는 무력으로 억눌렸다."
  subjects: [turkey, greece, uk, france, italy]
