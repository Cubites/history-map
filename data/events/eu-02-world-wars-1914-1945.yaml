- id: verdun-somme-1916
  year: 1916
  title:
    ko: 베르됭 전투와 솜 전투
  summary:
    ko: "독일군 참모 총장 팔켄하인은 프랑스군을 소모시켜 무너뜨리려고 1916년 2월 21일 요새 도시 베르됭을 공격했다. 페탱이 지휘한 프랑스군은 바르르뒤크에서 이어지는 도로(성스러운 길)로 병력과 물자를 쉴 새 없이 실어 날라 버텼고, 12월까지 이어진 싸움에서 양쪽 합쳐 70만 명 넘는 사상자가 났다. 베르됭의 부담을 덜려고 헤이그가 이끄는 영국군과 프랑스군은 7월 1일 솜강 일대에서 대공세를 폈는데, 영국군은 첫날에만 약 5만 7천 명의 사상자를 냈다. 9월에는 영국군이 처음으로 전차를 썼으나, 11월까지 10km 안팎을 나아가는 데 그친 채 양쪽 사상자가 100만 명을 넘었다. 같은 해 동부에서는 러시아의 브루실로프 공세(6월~)가 오스트리아-헝가리군에 큰 타격을 주었고, 이를 본 루마니아가 8월 협상국 편으로 참전했으나 12월 수도 부쿠레슈티를 빼앗겼다(독일·오스트리아-헝가리·불가리아군의 반격). 전쟁이 길어지자 교전국들은 징병과 배급제를 실시하고 산업을 전쟁에 동원했으며, 남성이 떠난 공장과 일터를 여성이 메웠다(총력전)."
