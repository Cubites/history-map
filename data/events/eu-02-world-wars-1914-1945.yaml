- id: brest-litovsk-1918
  year: 1918
  title:
    ko: 브레스트-리토프스크 조약
  summary:
    ko: "평화를 내건 소비에트 정부는 1917년 12월 동맹국과 휴전하고 브레스트-리토프스크에서 강화 협상을 벌였다. 외무 인민 위원 트로츠키가 '전쟁도 평화도 아니다'를 내세워 협상을 끌자 독일군이 1918년 2월 다시 진격했고, 레닌의 주장에 따라 소비에트 정부는 3월 3일 조약에 서명했다. 러시아는 폴란드와 발트 지역에서 손을 떼고 핀란드와 우크라이나에서 군대를 물렸으며, 캅카스의 카르스·아르다한·바투미를 오스만 제국에 넘겼다. 옛 제국 인구의 약 3분의 1과 탄광 대부분을 잃는 가혹한 조건이었다. 동부 전선을 정리한 독일은 병력을 서부로 돌렸다. 조약은 독일이 진 뒤 11월 휴전 협정과 소비에트 정부의 폐기 선언으로 무효가 되었다."
  subjects: [soviet-union, german-empire, austria-hungary, ottoman, bulgaria]
  links:
