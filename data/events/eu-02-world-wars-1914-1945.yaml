- id: october-revolution-1917
  year: 1917
  endYear: 1918
  title:
    ko: 러시아 10월 혁명
  summary:
    ko: "1917년 11월 7일(구력 10월 25일) 트로츠키가 주도한 페트로그라드 소비에트 군사 혁명 위원회가 수도의 요지를 장악하고, 이튿날 새벽 임시 정부가 있던 겨울 궁전을 점령했다. 때마침 열린 2차 전 러시아 소비에트 대회는 권력이 소비에트로 넘어왔다고 선언했고, 레닌을 의장으로 하는 인민 위원 평의회가 들어섰다. 새 정부는 곧바로 모든 교전국에 강화를 제안하는 '평화에 관한 포고'와 지주의 땅을 몰수해 농민에게 맡기는 '토지에 관한 포고'를 내렸고, 12월에는 은행을 국유화하고 비밀경찰 체카를 만들었다. 앞서 11월에 치른 헌법 제정 의회 선거에서 볼셰비키가 4분의 1가량을 얻는 데 그쳐 사회혁명당에 크게 뒤지자, 볼셰비키는 1918년 1월 의회가 처음 모인 이튿날 이를 강제로 해산해 일당 독재로 나아갔다. 볼셰비키는 1918년 3월 당 이름을 공산당으로 바꾸고 수도를 모스크바로 옮겼다. 세계 최초의 사회주의 정권은 각국의 노동 운동과 식민지 민족 운동에 큰 영향을 주었다."
  subjects: [soviet-union, russia]
  tags: [politics, society]
  sources: ["「평화에 관한 포고」(1917)", "「토지에 관한 포고」(1917)", "쉴라 피츠패트릭, 『러시아혁명 1917-1938』(사계절, 2017)"]

- id: finland-independence-1917
  year: 1917
  endYear: 1920
  title:
    ko: 핀란드의 독립과 내전
  summary:
    ko: "러시아 제국 안의 자치 대공국이던 핀란드는 10월 혁명 뒤인 1917년 12월 6일 의회가 독립을 선언했고, 레닌의 소비에트 정부는 12월 31일 이를 인정했다. 그러나 1918년 1월 사회 민주당 계열의 적위대(노동자 민병대)와 정부 쪽 백군 사이에 내전이 일어났다. 적위대는 헬싱키와 남부 공업 지대를, 만네르헤임이 이끈 백군은 북부와 농촌을 차지했다. 백군은 3~4월 탐페레를 함락했고, 4월 핀란드 정부의 요청으로 상륙한 독일군이 헬싱키를 차지해 내전은 5월 백군의 승리로 끝났다. 전투로 약 1만 명이 죽었고, 적위대의 살해(적색 테러)로 1,400~1,650명, 백군의 처형(백색 테러)으로 약 7천~1만 명이 죽었으며, 백군 정부가 세운 포로 수용소에서 붙잡힌 적위대 쪽 사람 약 1만 2천 명(1만 1,600~1만 2,500명으로 추산)이 굶주림과 병으로 죽었다. 내전 뒤 의회는 독일 왕족을 왕으로 뽑았으나(1918년 10월) 독일이 지면서 없던 일이 되었고, 1919년 7월 공화국 헌법을 만들어 스톨베리가 초대 대통령이 되었다. 1920년 10월 소련과 맺은 타르투 조약으로 국경이 정해지고 북극해의 페차모를 얻었다. 한국과는 1973년 수교했다."
  subjects: [finland, soviet-union, german-empire]
  links:
