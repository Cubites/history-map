  sources: ["「영국-아일랜드 조약」(1921)", "「밸푸어 보고서」(1926)", "「웨스트민스터 헌장」(1931)"]

- id: march-on-rome-1922
  year: 1922
  endYear: 1929
  title:
    ko: 이탈리아 파시즘과 로마 진군
  summary:
    ko: "이탈리아는 승전국이 되었으나 런던 조약에서 약속받은 달마티아 등을 얻지 못해 민족주의자들은 '훼손된 승리'라며 불만을 터뜨렸고, 시인 단눈치오는 의용병을 이끌고 피우메(리예카)를 점령했다(1919~1920). 이 일 뒤 라팔로 조약(1920)으로 세워진 피우메 자유국은 1924년 이탈리아에 병합되었다. 전후 불황 속에 노동자들이 공장을 점거하고 농민들이 땅을 차지하는 등 사회주의 운동이 거세지자, 무솔리니가 1919년 만든 파시스트 조직의 검은 셔츠단이 사회주의자와 노동조합을 폭력으로 공격하며 지주와 자본가의 지지를 얻었다(1921년 국가 파시스트당). 1922년 10월 말 파시스트들이 로마로 행진하자(로마 진군) 국왕 비토리오 에마누엘레 3세는 계엄령에 서명하지 않고 무솔리니를 총리로 임명했다. 무솔리니는 선거법을 바꾸고(1923) 반대파 의원 마테오티의 살해(1924)로 거세진 반발을 넘긴 뒤, 1925~1926년 다른 정당과 비판 언론을 없애 일당 독재 체제를 세웠다. 1929년에는 교황청과 라테란 조약을 맺어 바티칸 시국을 독립국으로 인정하고 이탈리아 통일 때부터 이어진 교회와의 갈등을 매듭지었다. 국가가 개인보다 앞선다며 의회 민주주의와 공산주의를 모두 거부한 파시즘은 다른 나라 극우 운동의 본보기가 되었다."
  subjects: [italy, fiume, vatican]
  tags: [politics]
  sources: ["「아체르보법」(1923)", "「라테란 조약」(1929)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: stalin-five-year-plans-1928
  year: 1928
  endYear: 1938
  title:
    ko: 스탈린의 5개년 계획과 대숙청
  summary:
    ko: "권력을 굳힌 스탈린은 신경제 정책을 끝내고 1928년 10월 제1차 5개년 계획을 시작해 중공업과 군수 공업에 힘을 쏟았다. 마그니토고르스크 같은 공업 도시가 새로 생겼고, 소련 정부는 계획을 4년 3개월 만에 마쳤다고 선전했다. 대공황을 겪지 않은 소련의 공업 생산은 1930년대에 크게 늘었다. 그러나 농민의 땅과 가축을 집단 농장(콜호스)과 국영 농장(소프호스)에 강제로 넣는 농업 집단화에 반발이 컸고, 부농(쿨라크)으로 몰린 수많은 농민이 수용소나 오지로 끌려갔다. 곡물을 무리하게 걷어 간 탓에 1932~1933년 우크라이나와 카자흐스탄 등에서 수백만 명이 굶어 죽었다(우크라이나에서는 홀로도모르라 부른다). 1934년 12월 레닌그라드 당 책임자 키로프가 암살된 것을 계기로 반대파 숙청이 시작되어, 1936~1938년 모스크바 재판에서 지노비예프·카메네프·부하린 등 혁명 동지들이 처형되고 투하쳅스키 등 군 지휘관도 대거 숙청되었다. 이 대숙청으로 공식 기록에만 약 68만 명이 처형되고 훨씬 많은 사람이 강제 노동 수용소(굴라크)로 보내졌다. 소수 민족도 '믿을 수 없는 민족'으로 몰려 강제로 옮겨졌는데, 1937년 연해주의 한인 약 17만 명이 일본의 첩자가 될 수 있다는 이유로 중앙아시아로 강제 이주되었다."
  subjects: [soviet-union]
  tags: [economy, politics, society]
  sources: ["「제1차 5개년 계획」(1928)", "쉴라 피츠패트릭, 『러시아혁명 1917-1938』(사계절, 2017)", "국사편찬위원회 『한국사』"]

- id: great-depression-1929
  year: 1929
  endYear: 1933
  title:
    ko: 대공황
  summary:
    ko: "1920년대 호황을 누리던 미국에서 1929년 10월 24일(검은 목요일)과 29일(검은 화요일) 뉴욕 증권 거래소의 주가가 폭락했다. 과잉 생산과 투기의 거품이 꺼지면서 은행과 기업이 잇달아 쓰러졌고, 1933년 미국의 실업률은 25%에 이르렀다. 미국 자본이 유럽에서 빠져나가고 미국이 관세를 크게 올리면서(스무트-홀리 관세법, 1930) 공황은 세계로 번졌다. 1931년 5월 오스트리아 최대 은행 크레디트안슈탈트가 무너진 것이 독일의 금융 위기로 이어졌고, 독일의 실업자는 1932년 600만 명에 이르렀다. 영국은 금 본위제를 떠나고(1931년 9월) 오타와 회의(1932)에서 자치령·식민지와 특혜 관세를 맺어 블록 경제를 만들었으며, 프랑스도 식민지와 함께 경제 블록을 꾸렸다. 미국에서는 1933년 대통령이 된 프랭클린 루스벨트가 뉴딜 정책을 펴 정부가 경제에 적극 개입했다. 독일과 일본에서는 전체주의 세력이 커져, 이미 파시스트 독재 아래 있던 이탈리아와 함께 대외 팽창으로 위기를 넘으려 했다. 일본은 만주 사변(1931)을 일으켰고, 식민지 조선을 대륙 침략의 병참 기지로 삼는 한편 농촌 진흥 운동(1932~)으로 농촌을 통제했다."
