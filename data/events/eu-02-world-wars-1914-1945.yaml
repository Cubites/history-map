- id: washington-1921
  year: 1921
  endYear: 1922
  title:
    ko: 워싱턴 회의
  summary:
    ko: "미국 하딩 대통령의 제안으로 1921년 11월부터 이듬해 2월까지 워싱턴에서 태평양과 동아시아 문제를 다루는 회의가 열렸다. 미국·영국·일본·프랑스는 4개국 조약(1921년 12월)으로 태평양 섬들에 대한 서로의 권리를 존중하기로 했고, 이에 따라 영일 동맹은 폐기되었다. 5개국 해군 군축 조약(1922년 2월)은 미국·영국·일본·프랑스·이탈리아의 주력함 총톤수를 5:5:3:1.67:1.67의 비율로 제한하고(52만 5천 톤·31만 5천 톤·17만 5천 톤) 10년 동안 새 주력함을 짓지 않기로 했다. 9개국 조약으로 중국의 주권 존중과 문호 개방을 약속했고, 따로 맺은 협정에 따라 일본은 산둥반도의 옛 독일 권익을 중국에 돌려주었다. 베르사유 체제와 함께 1920년대 국제 질서를 이룬 이 워싱턴 체제는 동아시아에서 일본의 팽창을 묶어 두는 성격이 있었다. 대한민국 임시정부는 이승만·서재필 등으로 대표단을 꾸려 회의에 독립 청원서를 내고 국내외에서 후원 운동을 벌였으나, 한국은 초청받지 못했고 한국 문제는 의제에 오르지 못했다. 외교로 독립을 얻으려던 기대가 꺾이면서, 이승만의 위임 통치 청원 문제와 함께 임시정부의 진로를 둘러싼 논쟁이 커져 국민 대표 회의(1923)로 이어졌다."
  subjects: [usa, uk, japan, france, italy, roc, occupied-korea]
  links:
