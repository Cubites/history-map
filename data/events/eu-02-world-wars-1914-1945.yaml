- id: yalta-1945
  year: 1945
  title:
    ko: 얄타 회담
  summary:
    ko: "1945년 2월 4~11일 크림반도의 얄타에서 루스벨트·처칠·스탈린이 전후 처리를 논의했다. 독일은 무장 해제하고 미국·영국·소련에 프랑스를 더한 4개국이 나눠 점령하며, 배상 문제를 따로 다루기로 했다. 폴란드의 동쪽 국경은 대체로 커즌선으로 하되 서쪽에서 독일 땅으로 보상하고, 소련이 세운 임시 정부에 망명 정부 쪽 인사를 더해 자유선거를 치르기로 했으며, 해방된 유럽 나라들이 자유선거로 정부를 세우도록 돕는다는 선언도 냈다. 4월 샌프란시스코에서 국제 연합 창립 회의를 열고 안전 보장 이사회 상임 이사국에 거부권을 주기로 했다. 비밀 협정에서 스탈린은 독일이 항복한 뒤 2~3개월 안에 일본과의 전쟁에 참여하기로 하고, 그 대가로 남사할린과 쿠릴 열도, 그리고 중국과 상의 없이 뤼순 조차권과 다롄·만주 철도에 대한 권익을 약속받았다. 2월 8일 루스벨트는 스탈린에게 한국을 미국·소련·중국이 20~30년 동안 신탁 통치하자는 구상을 꺼냈고 스탈린은 기간이 짧을수록 좋다고 답했으나, 한국 문제는 더 논의되지 않았다. 소련의 대일 참전 약속은 뒤에 소련군이 한반도 북부에 들어오는 배경이 되었다."
