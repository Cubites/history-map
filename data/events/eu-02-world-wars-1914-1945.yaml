- id: gallipoli-1915
  year: 1914
  endYear: 1917
  title:
    ko: 전쟁의 확대와 갈리폴리 전투
  summary:
    ko: "독일과 손잡은 오스만 제국은 1914년 10월 말 흑해의 러시아 항구를 포격해 동맹국 편으로 참전했다. 영국은 이를 이유로 11월 5일, 1878년부터 관리해 오던 키프로스를 합병했다. 영국 해군 장관 처칠의 주도로 영국·프랑스는 다르다넬스 해협을 뚫어 러시아와의 바닷길을 열고 이스탄불을 치려 했다. 1915년 2~3월 해군 공격이 실패하자 4월 25일 오스트레일리아·뉴질랜드 군단(안작) 등을 갈리폴리반도에 상륙시켰으나, 독일인 장군 리만 폰 잔더스가 총지휘하고 무스타파 케말 등이 사단을 이끈 오스만군의 방어에 막혀 양쪽 모두 수십만 명의 사상자를 낸 끝에 1916년 1월 철수했다. 이 무렵(1915~) 오스만 정부는 동부 아나톨리아의 아르메니아인을 강제로 이주시키며 대규모로 학살했다. 한편 삼국 동맹의 이탈리아는 트렌티노·트리에스테 등을 약속받는 런던 비밀 조약(1915년 4월)을 맺고 5월 오스트리아-헝가리에 선전 포고해 협상국 편에 섰다. 이탈리아군은 이손초강 일대에서 열한 차례 공세를 폈으나 큰 진전이 없었고, 1917년 10월 카포레토에서 독일·오스트리아-헝가리군에 크게 져 피아베강까지 물러났다. 발칸에서는 불가리아가 1915년 10월 동맹국 편으로 참전해 독일·오스트리아-헝가리와 함께 세르비아를 점령했다."
