- id: armistice-1918
  year: 1918
  title:
    ko: 독일 11월 혁명과 휴전
  summary:
    ko: "동부에서 풀려난 병력으로 독일은 1918년 3월 21일부터 서부에서 대공세(춘계 공세)를 펴 마른강까지 다시 나아갔으나 막혔다. 미군이 속속 도착하는 가운데 연합국은 7월 2차 마른 전투와 8월 8일 아미앵 전투를 시작으로 반격에 나섰다(100일 공세). 독일의 동맹국들이 차례로 손을 드는 가운데(9월 29일 불가리아, 10월 30일 오스만 제국의 무드로스 휴전, 11월 3일 오스트리아-헝가리의 빌라 주스티 휴전), 독일에서도 10월 말 해군 지휘부의 출격 명령을 수병들이 거부했고, 11월 초 킬 군항의 수병 반란을 계기로 노동자·병사 평의회가 전국에 생겨났다(11월 혁명). 11월 9일 막스 폰 바덴 총리가 황제의 퇴위를 발표하고 사회 민주당의 에베르트에게 정부를 넘겼으며, 같은 날 샤이데만이 공화국을 선포했다. 빌헬름 2세는 이튿날 네덜란드로 망명했다. 11월 11일 콩피에뉴 숲의 열차 안에서 독일 대표 에르츠베르거 등과 연합군 총사령관 포슈가 휴전 협정에 서명해 4년 넘게 이어진 전쟁이 끝났다. 군인만 900만 명 넘게 죽은 것으로 추산된다."
