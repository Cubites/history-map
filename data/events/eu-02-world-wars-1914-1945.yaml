- id: spanish-civil-war-1936
  year: 1936
  endYear: 1939
  title:
    ko: 에스파냐 내전
  summary:
    ko: "왕정이 무너지고 공화정이 들어선(1931) 에스파냐에서는 토지 개혁과 교회 문제를 두고 좌우의 대립이 깊었다. 1936년 2월 총선에서 좌파 연합인 인민 전선이 이기자 7월 17~18일 에스파냐령 모로코 주둔군을 시작으로 군부가 반란을 일으켜 내전이 시작되었고, 카나리아 제도에 있던 프랑코 장군이 모로코로 건너가 반란군의 주력을 이끌었다. 독일은 콘도르 군단을, 이탈리아는 대규모 병력을 보내 프랑코의 반란군을 도왔고, 소련은 공화국 정부에 무기와 군사 고문을 보냈다. 세계 각지에서 모인 수만 명의 의용병이 국제 여단을 이뤄 공화국 편에서 싸웠다. 영국 작가 오웰은 마르크스주의 통일 노동자당(POUM) 민병대에서 싸웠고, 헤밍웨이는 종군 기자로 전쟁을 취재했다. 영국과 프랑스(블룸의 인민 전선 정부)는 전쟁이 번질 것을 걱정해 불간섭 정책을 취했다. 1937년 4월 26일 독일 공군이 바스크 지방의 작은 도시 게르니카를 폭격해 많은 시민이 죽었고, 피카소는 그림 「게르니카」로 이를 고발했다. 내부 분열에 시달린 공화국 진영은 1939년 1월 바르셀로나를, 3월 말 마드리드를 잃었고 4월 1일 프랑코가 승리를 선언했다. 독일과 이탈리아가 새 무기와 전술을 시험한 이 내전 뒤 프랑코의 독재는 1975년까지 이어졌다."
