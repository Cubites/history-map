- id: normandy-1944
  year: 1944
  endYear: 1945
  title:
    ko: 노르망디 상륙 작전과 독일의 후퇴
  summary:
    ko: "1944년 6월 6일 아이젠하워가 이끄는 연합군이 프랑스 북부 노르망디 해안 다섯 곳에 상륙해 첫날에만 15만 명 넘게 땅을 밟았다(오버로드 작전). 같은 달 22일 소련군은 벨라루스에서 대공세(바그라티온 작전)를 펴 독일 중부 집단군을 무너뜨렸다. 7월 20일 독일 장교들이 히틀러 암살을 꾀했으나 실패했다. 소련군이 비스와강에 다가오자 폴란드 국내군이 8월 1일 바르샤바에서 봉기했으나 소련군은 강 건너에 멈춰 섰고, 두 달 만에 봉기를 진압한 독일군은 도시를 거의 파괴했다. 8월 15일 연합군이 프랑스 남부에도 상륙했고, 파리는 레지스탕스의 봉기 속에 8월 25일 해방되어 드골이 임시 정부를 이끌었다. 루마니아(8월)·불가리아(9월)·핀란드(9월)가 차례로 추축국에서 떨어져 나왔다(핀란드는 6~8월 소련군의 공세로 동카렐리야에서 밀려난 뒤 9월 휴전 협정으로 1940년 국경을 받아들이고 페차모까지 내주었다). 12월 16일 독일군은 아르덴에서 마지막 반격(벌지 전투)을 폈으나 1945년 1월 말 밀려났다. 동쪽에서는 1945년 1월 소련군이 비스와-오데르 공세로 바르샤바(17일)와 크라쿠프(19일)를 해방해 총독부 지역에서 독일군을 몰아냈다."
