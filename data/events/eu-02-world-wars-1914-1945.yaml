- id: us-entry-1917
  year: 1915
  endYear: 1917
  title:
    ko: 유틀란트 해전과 미국의 참전
  summary:
    ko: "영국 해군은 개전 직후부터 독일로 가는 바닷길을 막았다(해상 봉쇄). 독일은 잠수함(U보트)으로 영국으로 가는 배를 공격해 맞섰는데, 1915년 5월 영국 여객선 루시타니아호가 격침되어 미국인 128명이 숨지자 미국의 항의로 공격을 한때 줄였다. 1916년 5월 31일~6월 1일에는 북해의 유틀란트반도 앞바다에서 젤리코가 이끄는 영국 대함대와 셰어가 이끄는 독일 대양 함대가 맞붙었다. 영국이 군함과 병력을 더 많이 잃었지만 독일 함대는 그 뒤 큰 해전을 피해 항구에 머물렀고 봉쇄는 풀리지 않았다. 영국을 굶겨 전쟁을 빨리 끝내려고 독일은 1917년 2월 1일부터 중립국 배까지 경고 없이 공격하는 무제한 잠수함 작전에 나섰다. 미국은 독일과 국교를 끊었고, 독일이 멕시코에 미국을 상대로 한 동맹을 제안한 치머만 전보가 3월에 공개되자 4월 6일 독일에 선전 포고했다. 윌슨 대통령은 민주주의를 지키기 위한 전쟁이라며 참전을 호소했다."
  subjects: [uk, german-empire, usa]
