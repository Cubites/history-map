- id: potsdam-1945
  year: 1945
  title:
    ko: 포츠담 회담과 포츠담 선언
  summary:
    ko: "1945년 7월 17일~8월 2일 베를린 근교 포츠담에서 미국의 트루먼, 소련의 스탈린, 영국의 처칠(총선 결과에 따라 7월 28일부터 애틀리)이 독일 처리를 논의했다. 독일은 비군사화·비나치화·민주화·분권화를 원칙으로 4개국이 점령하고 연합국 관리 위원회가 독일 전체의 문제를 다루며, 배상은 각 점령 지구에서 받기로 했다. 오데르-나이세선 동쪽의 독일 땅은 평화 조약 때까지 폴란드가 관리하고, 동프로이센 북부(쾨니히스베르크)는 소련에 넘기며, 폴란드·체코슬로바키아·헝가리의 독일인은 '질서 있고 인도적으로' 옮기기로 했다. 그러나 전쟁 말기의 피란과 전후 추방으로 1,200만 명이 넘는 독일인이 동유럽에서 쫓겨나는 과정에서 많은 사람이 죽었다. 회담 중이던 7월 26일 미국·영국·중국은 포츠담 선언을 발표해 일본에 무조건 항복을 요구하고, 카이로 선언의 조항을 이행한다고 밝혀(8항) 한국 독립 약속을 다시 확인했다. 일본이 이를 묵살하자 미국은 8월 6일 히로시마에 원자 폭탄을 떨어뜨렸고, 8일 소련이 일본에 선전 포고하며 선언에 참여했으며, 9일에는 나가사키에도 원자 폭탄이 떨어졌다. 일본은 8월 14일 선언을 받아들이고 15일 항복을 발표해 한국은 광복을 맞았다."
