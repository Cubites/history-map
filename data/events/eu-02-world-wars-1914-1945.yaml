- id: iceland-1918
  year: 1918
  title:
    ko: 아이슬란드의 주권 회복과 공화국 수립
  summary:
    ko: "덴마크의 지배를 받던 아이슬란드에서는 19세기부터 자치 운동이 커져 1874년 헌법, 1904년 자치 정부를 얻었다. 1918년 덴마크와 맺은 연합법이 10월 국민 투표(찬성 92.6%)를 거쳐 12월 1일 발효되어, 아이슬란드는 덴마크 왕을 함께 섬기는 주권 국가(아이슬란드 왕국)가 되었다. 외교와 방위는 덴마크가 맡아 주었고, 연합법은 1940년 뒤 다시 협상해 3년 안에 합의하지 못하면 어느 쪽이든 끝낼 수 있게 했다. 2차 대전 중 1940년 4월 독일이 덴마크를 점령하자 아이슬란드 의회가 국왕의 권한과 외교를 넘겨받았고, 5월 영국군이 섬에 들어온 데 이어 1941년 7월부터는 미군이 방위를 맡았다. 1944년 5월 국민 투표에서 99%가 넘는 찬성으로 연합을 끝내기로 해 6월 17일 싱벨리르에서 공화국을 선포했다. 아이슬란드는 1949년 북대서양 조약 기구의 창설 회원국이 되었고, 한국과는 1962년 수교했다."
  subjects: [iceland, denmark]
  links:
