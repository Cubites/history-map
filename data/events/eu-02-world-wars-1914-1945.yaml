- id: stalingrad-1942
  year: 1942
  endYear: 1943
  title:
    ko: 스탈린그라드 전투와 전세의 역전
  summary:
    ko: "1942년 여름 독일군은 캅카스의 유전을 노려 남쪽으로 나아가며 볼가강 가의 공업 도시 스탈린그라드를 공격했다(8월 하순 시가전 시작). 소련군은 무너진 건물 사이에서 버티다 11월 19일 독일군 양옆을 지키던 루마니아군을 뚫고 반격해(천왕성 작전) 파울루스의 독일 제6군을 에워쌌다. 포위된 독일군은 굶주림과 추위 속에 1943년 2월 초 항복했고 9만여 명이 포로가 되었다. 양쪽 사상자가 100만~200만 명으로 추산되는 이 싸움을 고비로 소련군이 공세로 돌아섰고, 7월 쿠르스크 전투에서 독일의 마지막 대공세를 꺾었다. 북아프리카에서는 영국군이 1942년 10~11월 엘알라메인에서 롬멜의 독일·이탈리아군을 물리쳤고, 11월 미국·영국군이 모로코·알제리에 상륙하자(횃불 작전) 독일과 이탈리아는 비시 정부가 다스리던 프랑스 남부를 점령했으며(이탈리아는 대체로 론강 동쪽의 남동부와 코르시카), 1943년 5월 튀니지의 추축군이 항복했다. 대서양에서도 1943년 봄부터 연합군이 독일 잠수함과의 싸움에서 우위를 잡았다."
