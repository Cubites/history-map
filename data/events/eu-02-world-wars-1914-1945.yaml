- id: anschluss-munich-1938
  year: 1938
  endYear: 1939
  title:
    ko: 오스트리아 병합과 뮌헨 협정
  summary:
    ko: "히틀러는 독일 민족을 한 나라로 모은다는 명분으로 1938년 3월 12일 군대를 오스트리아에 들여보내 이튿날 병합을 선언했다(4월 국민 투표로 추인). 이어 체코슬로바키아의 독일계 주민 약 300만 명이 사는 주데텐란트를 내놓으라며 전쟁을 위협했다. 영국 총리 체임벌린과 프랑스 총리 달라디에는 전쟁을 피하려 유화 정책을 택해, 9월 29~30일 뮌헨에서 히틀러·무솔리니와 회담하고 주데텐란트를 독일에 넘기기로 합의했다. 당사국 체코슬로바키아와 소련은 회담에 부르지 않았다. 체임벌린은 '우리 시대의 평화'를 가져왔다고 했으나, 10~11월 폴란드는 1919년부터 체코슬로바키아와 다투던 테신(자올지에) 지역을, 헝가리는 독일·이탈리아의 중재(1차 빈 중재)로 슬로바키아 남부 등을 차지했다. 1939년 3월 14일 슬로바키아가 독일의 보호 아래 독립을 선언했고, 이튿날 히틀러는 뮌헨의 약속을 깨고 프라하에 들어가 체코 지역을 보헤미아-모라비아 보호령으로 삼았다. 이어 독일은 3월 하순 리투아니아에서 메멜을 넘겨받았다. 그제야 영국은 3월 31일 프랑스와 함께 폴란드의 독립을 보장해 유화 정책을 접었고, 4월 이탈리아가 알바니아를 점령하자 그리스·루마니아에도 보장을 넓혔다."
