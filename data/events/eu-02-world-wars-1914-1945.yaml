- id: yugoslavia-partition-1941
  year: 1941
  endYear: 1945
  title:
    ko: 유고슬라비아의 분할과 파르티잔 전쟁
  summary:
    ko: "1941년 4월 6일 독일·이탈리아·헝가리가 유고슬라비아를 침공해 열하루 만인 17일 항복 문서에 서명을 받아 냈고(18일 발효), 불가리아군도 뒤이어 들어왔다. 추축국은 나라를 나눠, 독일은 슬로베니아 북부를 사실상 병합해 민정으로 다스리고 세르비아에 군정을 두어 네디치의 괴뢰 정부를 세웠으며, 이탈리아는 슬로베니아 남부와 달마티아 해안을 합치고 몬테네그로를 점령했다. 헝가리는 북부의 바치카 등을, 불가리아는 마케도니아 대부분을 차지했다. 크로아티아와 보스니아 헤르체고비나에는 극우 민족주의 단체 우스타샤의 파벨리치가 이끄는 크로아티아 독립국이 세워졌다. 우스타샤 정권은 세르비아인·유대인·로마(집시)를 학살했는데, 세르비아인만 30만 명 넘게 죽었고 야세노바츠 수용소에서만 7만 7천~9만 9천 명이 숨진 것으로 추산된다(미국 홀로코스트 기념관). 이에 맞서 미하일로비치의 왕당파 체트니크와 티토가 이끄는 공산당의 파르티잔이 저항했으나 두 세력은 곧 서로 싸웠고, 체트니크는 이탈리아·독일과 손잡거나 무슬림과 크로아트 주민을 학살하기도 했다. 독일군은 저항에 맞서 세르비아에서 인질을 대량 처형했다(1941년 10월 크라구예바츠에서만 약 2,800명). 1943년 9월 이탈리아가 항복하자 독일이 몬테네그로를 넘겨받았고, 연합국은 파르티잔을 지원했다. 1944년 10월 파르티잔과 소련군이 베오그라드를 해방했고, 1945년 5월 크로아티아 독립국이 무너지면서 유고슬라비아는 티토의 공산당이 이끄는 연방 국가로 다시 섰다. 전쟁 끝 무렵 파르티잔은 블라이부르크 등에서 영국군이 넘긴 크로아티아 독립국 군인과 피란민, 체트니크 등 수만 명(추산 3만~10만 명으로 연구마다 차이가 큼)을 처형했다. 전쟁 동안 유고슬라비아에서는 약 100만 명이 숨졌다."
