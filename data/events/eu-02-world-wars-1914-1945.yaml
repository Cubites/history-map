- id: italy-surrender-1943
  year: 1943
  endYear: 1944
  title:
    ko: 이탈리아의 항복과 카이로·테헤란 회담
  summary:
    ko: "1943년 7월 10일 미국·영국군이 시칠리아에 상륙하자 7월 25일 파시스트 대평의회가 무솔리니를 불신임했고, 국왕은 그를 해임해 가두고 바돌리오를 총리로 세웠다. 새 정부는 9월 3일 연합군과 비밀리에 휴전 협정을 맺고 8일 발표했다. 이튿날 연합군이 살레르노에 상륙했으나, 독일군은 곧바로 로마와 중·북부 이탈리아, 이탈리아가 점령하던 프랑스 남동부를 차지했고(코르시카는 10월 자유 프랑스군·레지스탕스와 연합국 편으로 돌아선 이탈리아군이 해방) 구출한 무솔리니를 내세워 북부에 이탈리아 사회 공화국(살로 공화국)을 세웠다. 바돌리오 정부는 10월 독일에 선전 포고했다. 11월 하순 루스벨트와 처칠은 카이로에서 장제스와 만나 일본이 빼앗은 땅의 반환과 '적당한 시기에' 한국을 독립시키겠다는 카이로 선언을 마련했고(12월 1일 발표), 곧이어 테헤란에서 스탈린과 처음 함께 모여(11월 28일~12월 1일) 1944년 5월까지 프랑스에 제2 전선을 열기로 했으며, 스탈린은 독일이 진 뒤 일본과의 전쟁에 참여할 뜻을 밝혔다. 이탈리아의 연합군은 몬테카시노 등에서 독일군의 방어선에 막혀 1944년 6월 4일에야 로마에 들어갔고, 북부에서는 파르티잔의 저항이 이어졌다."
