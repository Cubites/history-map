- id: korea-paris-1919
  year: 1918
  endYear: 1919
  title:
    ko: 민족 자결주의와 파리의 한국 대표
  summary:
    ko: "미국 대통령 윌슨은 1918년 1월 비밀 외교 폐지, 군비 축소, 식민지 문제의 공정한 조정, 국제기구 창설 등을 담은 14개조 평화 원칙을 내놓았다. 이 원칙은 민족 자결주의로 받아들여져 식민지와 약소민족에게 큰 기대를 불러일으켰으나, 실제로는 패전국이 다스리던 민족에게만 적용되었다. 1918년 11월 상하이에서 여운형 등이 만든 신한 청년당은 윌슨과 강화 회의에 보낼 독립 청원서를 마련하고, 영어에 능한 김규식을 대표로 정해 1919년 1월 말 파리로 보냈다. 또 국내와 일본, 만주·연해주에 사람을 보내 국제 정세를 알려 2·8 독립 선언과 3·1 운동을 준비하는 데 자극을 주었다. 3월 파리에 도착한 김규식은 대한민국 임시정부가 세워진 뒤 외무총장 겸 파리 위원부 대표로서 5월 강화 회의에 독립 청원서를 내고 각국 대표를 만났다. 그러나 승전국 일본의 방해와 열강의 외면으로 한국 문제는 회의에서 다뤄지지 않았다."
