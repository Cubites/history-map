- id: league-of-nations-1920
  year: 1920
  title:
    ko: 국제 연맹
  summary:
    ko: "윌슨의 제안으로 베르사유 조약 첫머리에 실린 규약에 따라 1920년 1월 10일 국제 연맹이 출범했다(본부 제네바). 처음 42개국이 참여했고 영국·프랑스·이탈리아·일본이 상임 이사국이 되었다. 국제 분쟁을 평화적으로 풀고 군비를 줄이며, 옛 독일 식민지와 오스만 제국의 아랍 지역을 위임 통치령으로 감독하고, 국제 노동 기구(ILO) 등과 함께 노동·보건 문제에 힘썼다. 그러나 미국은 상원의 반대로 가입하지 않았고, 패전국 독일은 1926년, 소련은 1934년에야 들어왔다. 결정은 만장일치로 해야 했고 침략국을 막을 군대가 없어 경제 제재 말고는 손쓸 방법이 없었다. 1930년대 일본의 만주 침략(1931)과 이탈리아의 에티오피아 침공(1935)을 막지 못했고, 일본(1933)·독일(1933)·이탈리아(1937)가 잇달아 탈퇴하면서 힘을 잃었다."
  subjects: [uk, france, italy, japan, usa]
  tags: [diplomacy]
  sources: ["「국제 연맹 규약」(1919)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: versailles-territories-1920
  year: 1920
  endYear: 1935
  title:
    ko: 국제 관리 지역과 자유시 (자르·단치히·메멜·피우메)
  summary:
    ko: "파리 강화 회의는 민족 구성이 섞였거나 강대국의 이해가 엇갈린 몇몇 땅을 어느 한 나라에 주지 않고 국제 관리 아래 두었다. 1920년 1월 베르사유 조약이 발효되면서 독일 서쪽의 자르 지역은 15년 동안 국제 연맹이 다스리고 탄광은 프랑스가 갖게 되었다. 독일인이 대부분인 항구 단치히(그단스크)는 11월 국제 연맹의 보호 아래 폴란드와 관세 동맹을 맺은 자유시가 되었고, 동프로이센 북쪽 끝의 메멜(클라이페다) 지역은 연합국이 맡아 프랑스군이 관리했다. 이탈리아와 신생 유고슬라비아가 다툰 항구 도시 피우메(리예카)는 시인 단눈치오의 의용병이 점령했다가(1919~1920) 1920년 11월 두 나라가 맺은 라팔로 조약으로 자유국이 되었다. 그러나 이 땅들은 오래가지 못했다. 1923년 1월 리투아니아가 메멜에서 봉기를 일으켜 이 지역을 차지했고, 연합국은 1924년 메멜 협약으로 리투아니아 안의 자치 지역으로 인정했다. 피우메는 1922년 파시스트의 쿠데타를 거쳐 1924년 이탈리아와 유고슬라비아의 로마 조약으로 이탈리아에 병합되었다. 자르는 1935년 1월 주민 투표에서 90% 넘게 독일 귀속을 택해 나치 독일에 돌아갔고, 히틀러는 1939년 메멜을 되찾고 단치히 문제를 폴란드 침공의 구실로 삼았다."
