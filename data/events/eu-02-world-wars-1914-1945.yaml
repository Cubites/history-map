# 유럽 2번 묶음: 두 차례 세계 대전과 전간기 (1914 ~ 1945)
# 범위: 프랑스·영국·러시아/소련·독일(독일 제국 → 바이마르 공화국 → 나치 독일)을 중심으로, 이들과 얽히는 오스트리아-헝가리·이탈리아·오스만/튀르키예·폴란드·미국·일본 등까지.
# 깊이: 고등학교 세계사 교과서 본문 수준에 한국사와 닿는 사건(21개조 요구와 권업회 해산, 시베리아 출병과 4월 참변, 파리 강화 회의의 한국 대표,
#   워싱턴 회의, 얄타의 신탁 통치 구상과 소련의 대일 참전 약속, 포츠담 선언 등)을 더함 (docs/REGION_GUIDE.md §5).
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본 제목). 운영자 검수 필요.
# 1차 대전의 발발(사라예보 사건, 각국의 선전 포고, 일본의 칭다오 점령)은 앞 묶음 eu-01의 sarajevo-1914에 있다. 이 파일은 그 뒤부터.
# 한국사 묶음(07·08번)에 이미 있는 사건은 다시 만들지 않았다: 2·8 독립 선언·3·1 운동·임시정부(1919), 자유시 참변(1921), 국민 대표 회의(1923),
#   만주 사변(1931), 연해주 한인 강제 이주·중일 전쟁(1937), 국가 총동원법(1938), 태평양 전쟁(1941), 카이로 회담(1943), 8·15 광복·38도선 분할(1945) 등.
# 날짜는 양력(그레고리력). 1918년 2월 전의 러시아 국내 사건은 필요하면 구력을 함께 적는다.
# 나라 id는 그해에 있는 항목을 쓴다: 1917년까지 러시아 제국 → 1917년부터 소련(소비에트 러시아 포함), 1918년까지 독일 제국 → 1918~1933 바이마르 공화국 → 1933~1945 나치 독일,
#   1922년까지 오스만 제국 → 1923년부터 튀르키예, 1918년까지 오스트리아-헝가리 → 오스트리아 공화국·헝가리·체코슬로바키아 등. 한국은 일제 강점기의 한국(occupied-korea).
# 2차 대전 점령지는 B1의 점령 항목(france-occupied·general-government·soviet-occupied·italy-occupied 등)과 relations.yaml의 점령·종속 관계를 따른다.
# data/wars에 1914~1945년 유럽 전쟁의 전쟁 보기가 없어서, 싸운 곳은 places로 적었다.
# 2026-10-05(작업 EV4): 지도에 있으나 사건이 없던 나라·지역 항목을 채우려 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.
# 2026-10-05(작업 EV5): 항목마다 그 나라가 생기고 끝난 내력을 다룬 사건이 있는지 다시 점검해, 빠진 곳에 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.

# ── 1차 세계 대전 (1914 ~ 1918) ─────────────────────

- id: marne-1914
  year: 1914
  endYear: 1915
  title:
    ko: 마른 전투와 참호전
  summary:
    ko: "독일은 러시아가 병력을 다 모으기 전에 프랑스를 먼저 꺾으려고 중립국 벨기에를 지나 파리 쪽으로 크게 돌아 들어가는 작전(슐리펜 계획)을 폈다. 그런데 러시아군이 예상보다 빨리 동프로이센으로 들어오자 독일은 힌덴부르크와 루덴도르프를 보내 8월 말 탄넨베르크에서 러시아 제2군을 포위해 무찔렀다. 서쪽에서는 9월 5~12일 마른강 일대에서 조프르가 이끄는 프랑스군과 영국 원정군이 반격해 독일군을 엔강까지 밀어냈다(마른 전투). 이어 양쪽이 서로의 북쪽 끝을 돌아 들어가려 다투다 전선이 북해 해안까지 이어졌고(1차 이프르 전투), 스위스 국경에서 북해까지 참호가 늘어선 서부 전선이 굳어졌다. 기관총과 철조망, 대포 앞에서 공격은 큰 희생만 낳았고, 1915년 4월 독일군은 이프르에서 독가스를 대규모로 썼다. 몇 달이면 끝나리라던 전쟁은 길고 소모적인 싸움이 되었다."
  subjects: [german-empire, france, uk, belgium, russia]
