- id: battle-of-britain-1940
  year: 1940
  endYear: 1941
  title:
    ko: 영국 본토 항공전과 대서양 헌장
  summary:
    ko: "프랑스가 항복한 뒤에도 처칠의 영국은 강화를 거부했다. 히틀러는 영국 상륙(바다사자 작전)을 준비하며 1940년 7월부터 공군(루프트바페)으로 영국 공군과 비행장, 항구를 공격했다. 영국 공군은 레이더망과 전투기로 맞서 9월 15일 큰 공습을 물리쳤고, 제공권을 얻지 못한 독일은 9월 중순 상륙 계획을 미뤘다(영국은 10월 말까지를 영국 본토 항공전으로 본다). 독일은 9월부터 이듬해 5월까지 런던 등 도시를 밤마다 폭격했으나(블리츠), 4만 명 넘는 시민이 죽는 가운데서도 영국은 버텼다. 중립을 지키던 미국은 1941년 3월 무기 대여법을 만들어 영국에, 6월 독소 전쟁이 터진 뒤에는 소련에도 무기와 물자를 보냈다. 8월 루스벨트와 처칠은 뉴펀들랜드 앞바다의 군함에서 만나 영토 확장 반대, 민족 자결, 무역과 항해의 자유 등 전후 질서의 원칙을 밝힌 대서양 헌장을 발표했고, 1942년 1월 26개국이 연합국 공동 선언으로 이 원칙에 동의했다. 그러나 처칠은 민족 자결이 영국의 식민지에는 해당하지 않는다고 보았다."
