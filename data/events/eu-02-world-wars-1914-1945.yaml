- id: bohemia-moravia-1939
  year: 1939
  endYear: 1945
  title:
    ko: 보헤미아-모라비아 보호령과 체코의 저항
  summary:
    ko: "1939년 3월 14일 티소가 이끄는 슬로바키아가 독일의 압력 속에 독립을 선언해 독일의 보호를 받는 위성국이 되었다. 15일 프라하에 들어간 독일군은 이튿날 히틀러의 포고로 체코 지역을 보헤미아-모라비아 보호령으로 삼았다. 하하 대통령의 자치 정부를 형식상 두었으나 실권은 독일의 제국 보호관이 쥐었고, 공업이 발달한 체코의 군수 공장은 독일 전쟁 경제에 동원되었다. 1939년 11월 학생 시위가 일어나자 독일은 체코의 대학을 모두 닫고 학생 지도자 9명을 처형했으며 학생 1천여 명을 강제 수용소로 보냈다(11월 17일은 뒤에 국제 학생의 날이 됨). 1941년 9월 보호관 대리가 된 친위대 간부 하이드리히가 저항 운동을 짓밟자, 런던의 체코슬로바키아 망명 정부(대통령 베네시)가 영국의 도움으로 보낸 낙하산 대원들이 1942년 5월 27일 프라하에서 그를 습격해 숨지게 했다. 독일은 보복으로 리디체 마을의 남자들을 총살하고 여자와 아이들을 수용소로 보내(아이 대부분이 살해됨) 마을을 없앴고, 레자키 마을의 어른들도 모두 죽였다. 이때 즉결 재판으로 처형된 사람만 1,300명이 넘는다(넓게는 약 5천 명이 희생된 것으로 추산). 테레진(테레지엔슈타트)에는 유대인 게토가 세워져 그곳에서 3만 4천여 명이 죽고 8만 8천여 명이 동쪽의 절멸 수용소 등으로 보내졌다. 슬로바키아에서는 1944년 8월 29일 티소 정권과 독일에 맞선 민족 봉기가 일어났으나 독일군이 들어와 10월 말 진압했고, 1945년 4월 소련군이 브라티슬라바에 들어갔다. 1945년 5월 5일 프라하 시민이 봉기했고 9일 소련군이 들어와 보호령은 끝났으며, 슬로바키아와 함께 체코슬로바키아가 되살아났다. 전후 체코슬로바키아는 베네시 법령 등에 따라 독일계 주민 약 300만 명을 내쫓았는데, 이 과정에서 체코인의 보복 폭력과 수용소 생활로 많은 독일계 주민이 죽었다(체코·독일 역사가 위원회 추산 1만 5천~3만 명)."
