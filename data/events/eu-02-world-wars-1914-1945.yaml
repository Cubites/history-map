# ── 전간기의 유럽 (1919 ~ 1933) ──────────────────────

- id: weimar-1919
  year: 1919
  endYear: 1920
  title:
    ko: 바이마르 공화국의 출범
  summary:
    ko: "11월 혁명 뒤 에베르트가 이끄는 사회 민주당 정부는 군부와 손잡고 질서를 잡으려 했다. 1919년 1월 소비에트식 혁명을 꿈꾸던 스파르타쿠스단(갓 만든 독일 공산당의 중심)이 베를린에서 봉기하자, 정부는 의용군(자유 군단)을 동원해 진압했고 지도자 로자 룩셈부르크와 카를 리프크네히트가 살해되었다. 같은 달 여성도 처음 투표한 선거로 뽑힌 국민 의회는 혼란한 베를린을 피해 바이마르에서 열려 에베르트를 대통령으로 뽑았다. 국민 의회가 7월 말 의결한 바이마르 헌법(8월 11일 서명, 14일 시행)은 국민 주권과 남녀 보통 선거, 노동자의 단결권과 인간다운 생활을 누릴 권리(사회권)를 담았으나, 대통령에게 긴급 명령권(48조)을 주는 약점도 있었다. 새 공화국은 베르사유 조약 서명의 책임을 떠안았고, 군부와 우익은 '군대는 지지 않았는데 후방이 등을 찔렀다'는 배후 중상설을 퍼뜨렸다. 1920년 3월 우익 의용군이 베를린을 점령한 카프 폭동은 노동자들의 총파업으로 실패했다."
  subjects: [weimar-republic]
  tags: [politics]
  sources: ["「바이마르 헌법」(1919)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: ruhr-1923
  year: 1921
  endYear: 1924
  title:
    ko: 루르 점령과 초인플레이션
  summary:
    ko: "연합국은 1921년 런던 지불 계획으로 독일의 배상금을 1,320억 금마르크로 정했다. 독일이 석탄·목재 현물 배상을 거듭 채우지 못하자, 프랑스(푸앵카레 총리)와 벨기에는 1923년 1월 11일 독일 최대의 공업 지대인 루르를 군대로 점령했다. 쿠노 내각은 소극적 저항을 호소하고 일손을 놓은 노동자들의 생계를 돈을 찍어 대 주었고, 이미 가파르던 물가 상승은 걷잡을 수 없게 되었다. 저축과 연금이 휴지가 되면서 중산층이 무너졌다. 8월 총리가 된 슈트레제만은 9월 소극적 저항을 끝냈다. 환율이 1달러에 4조 2천억 마르크까지 치솟은 11월, 히틀러가 이끄는 나치당이 뮌헨에서 무장 봉기(맥주홀 폭동)를 일으켰다가 실패했고, 히틀러는 갇혀 있는 동안 『나의 투쟁』을 썼다. 정부는 11월 중순 새 화폐 렌텐마르크를 내놓아 물가를 잡았다. 1924년 미국의 도스가 이끈 전문가 위원회의 안(도스안)에 따라 배상금 지불 방식을 고치고 미국 자본이 들어오면서 독일 경제가 살아나기 시작했고, 프랑스·벨기에군은 1925년 루르에서 물러났다."
  subjects: [weimar-republic, france, belgium, usa]
  links:
