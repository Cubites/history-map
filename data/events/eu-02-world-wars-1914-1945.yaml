- id: nep-ussr-1921
  year: 1921
  endYear: 1924
  title:
    ko: 신경제 정책과 소련의 수립
  summary:
    ko: "내전과 전시 공산주의로 경제가 무너지고 농민 봉기가 잇따르는 가운데, 1921년 3월 혁명의 보루였던 크론시타트 해군 기지의 수병들까지 공산당의 독재에 반대하며 반란을 일으켰다(진압됨). 레닌은 같은 달 당 대회에서 곡물 강제 징발을 현물세로 바꾸고, 세금을 낸 뒤 남은 곡물을 시장에 팔거나 작은 기업을 개인이 운영하는 것을 허용하는 신경제 정책(네프)을 채택했다. 대기업·은행·대외 무역은 국가가 계속 쥐었다. 1921~1922년 볼가강 유역 등에 큰 기근이 들었으나, 그 뒤 농업과 상업이 되살아났다. 1922년 12월 30일 러시아·우크라이나·벨라루스·자캅카스의 4개 소비에트 공화국이 연방 조약을 맺어 소비에트 사회주의 공화국 연방(소련)이 세워졌다. 1924년 1월 레닌이 죽자 당 서기장 스탈린과 트로츠키 사이에 권력 다툼이 벌어졌고, '일국 사회주의'를 내세운 스탈린이 이겨 트로츠키를 당에서 내쫓았다(1927, 1929년 국외 추방)."
  subjects: [soviet-union]
  tags: [economy, politics]
  sources: ["「소비에트 사회주의 공화국 연방 수립 조약」(1922)", "쉴라 피츠패트릭, 『러시아혁명 1917-1938』(사계절, 2017)"]

- id: uk-suffrage-1918
  year: 1918
  endYear: 1928
  title:
    ko: 영국의 선거권 확대와 노동당 내각
  summary:
    ko: "전쟁 중 여성들이 공장과 군수 산업 등에서 일하면서 여성 참정권 운동이 힘을 얻었다. 1918년 2월 국민 대표법으로 21세 이상 모든 남성과 일정한 재산 요건을 갖춘 30세 이상 여성이 선거권을 얻어, 유권자가 전쟁 전 약 770만 명에서 2,100만 명 남짓으로 늘었다. 같은 해 11월에는 여성도 하원 의원에 출마할 수 있게 되었다. 노동자의 정치 세력이 커져 노동당이 자유당을 제치고 보수당과 맞서는 양대 정당이 되었고, 1924년 1월 램지 맥도널드가 첫 노동당 내각을 이끌었다(자유당의 지지에 기댄 소수 내각으로 그해 11월 물러남). 1926년 5월 탄광 노동자의 임금 삭감에 맞선 총파업이 벌어졌으나 9일 만에 끝났다. 1928년 평등 선거권법으로 여성도 남성과 똑같이 21세부터 투표하게 되었다."
  subjects: [uk]
  tags: [politics, society]
  sources: ["「1918년 국민 대표법(Representation of the People Act 1918)」", "「1928년 평등 선거권법(Equal Franchise Act 1928)」"]

- id: irish-free-state-1922
  year: 1922
  endYear: 1931
  title:
    ko: 아일랜드 자유국과 웨스트민스터 헌장
  summary:
    ko: "1916년 더블린의 부활절 봉기가 진압되고 주동자들이 처형되자 아일랜드에서는 완전한 독립을 바라는 신페인당이 힘을 얻었다. 1918년 총선에서 크게 이긴 신페인 의원들은 1919년 1월 더블린에서 따로 의회를 열고 독립을 선언했고, 아일랜드 공화국군(IRA)과 영국군 사이의 독립 전쟁이 1921년 7월 휴전까지 이어졌다. 그해 12월 영국-아일랜드 조약이 맺어졌고, 조약을 받아들일지를 두고 1922년 6월 아일랜드에서 내전이 일어난 가운데 12월 6일 남부 26개 주가 영국 연방 안의 자치령인 아일랜드 자유국이 되었다(내전은 1923년 5월 끝남). 개신교도가 많은 북동부의 북아일랜드는 영국에 남았다. 영국은 1926년 제국 회의에서 자치령들이 본국과 동등한 지위로 국왕에 대한 충성으로 묶인 공동체라고 밝혔고(밸푸어 보고서), 1931년 웨스트민스터 헌장으로 캐나다·오스트레일리아·뉴질랜드·남아프리카 연방·아일랜드 자유국·뉴펀들랜드의 입법 자주권을 법으로 정해 영국 연방(커먼웰스)의 틀을 만들었다(오스트레일리아와 뉴질랜드는 1940년대에야 헌장을 받아들였다). 아일랜드는 1937년 새 헌법으로 나라 이름을 에이레(아일랜드)로 바꾸었다."
  subjects: [uk, ireland]
  links:
    - { from: uk, to: ireland, note: "자치령 지위 인정 (영국-아일랜드 조약)" }
