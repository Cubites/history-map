- id: german-surrender-1945
  year: 1945
  title:
    ko: 베를린 함락과 독일의 항복
  summary:
    ko: "1945년 봄 서쪽에서는 미국·영국·프랑스군이 라인강을 건너고, 동쪽에서는 소련군이 오데르강을 넘어 4월 16일 베를린 공격에 나섰다. 4월 25일 미군과 소련군이 엘베강 가의 토르가우에서 만났다. 북이탈리아에서는 4월 파르티잔 봉기와 연합군의 진격 속에 무솔리니가 달아나다 파르티잔에게 붙잡혀 28일 처형되었으며, 독일군이 4월 29일 카세르타에서 항복 문서에 서명했다(5월 2일 발효). 히틀러는 4월 30일 베를린의 지하 벙커에서 자살했다. 5월 2일 베를린 수비대가 항복했고, 독일군은 5월 7일 프랑스 랭스에서, 8일 밤 베를린 카를스호르스트에서 무조건 항복 문서에 서명해 유럽의 전쟁이 끝났다(서방은 5월 8일, 소련은 시차로 5월 9일을 승전일로 기념한다). 6월 5일 미국·영국·소련·프랑스는 베를린 선언으로 독일의 최고 권력을 넘겨받고, 4개 점령 지구와 베를린의 공동 관리를 시작했다(베를린도 네 나라가 구역을 나눠 맡아, 여름에 서방 3국 군대가 서쪽 구역에 들어왔다). 오스트리아도 다시 독일에서 떨어져 4개국의 점령을 받았다. 유럽의 전쟁으로 군인과 민간인 수천만 명이 죽었고, 그 가운데 소련의 희생이 가장 컸다."
