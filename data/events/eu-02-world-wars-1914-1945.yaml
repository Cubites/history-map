# ── 러시아 내전과 시베리아 출병 (1918 ~ 1922) ─────────

- id: russian-civil-war-1918
  year: 1918
  endYear: 1921
  title:
    ko: 러시아 내전과 전시 공산주의
  summary:
    ko: "10월 혁명과 브레스트-리토프스크 조약에 반대하는 옛 장교·자유주의자·사회혁명당 등이 백군을 이뤄 각지에서 일어났고, 1918년 5월 시베리아 철도를 따라 이동하던 체코슬로바키아 군단이 봉기하면서 내전이 본격화했다. 영국·프랑스·미국·일본 등은 북러시아의 무르만스크·아르한겔스크, 남러시아, 시베리아에 군대를 보내 백군을 도왔다. 트로츠키는 징병제를 되살리고 옛 제국 장교를 써서 적군(붉은 군대)을 키웠고, 볼셰비키 정부는 곡물을 강제로 징발하고 산업을 국유화하는 전시 공산주의를 펴며 체카를 앞세워 반대파를 탄압했다(붉은 테러). 니콜라이 2세 일가는 1918년 7월 예카테린부르크에서 처형되었다. 1919년 3월에는 세계 혁명을 이끌 국제 조직 코민테른(공산주의 인터내셔널)이 모스크바에서 만들어졌다. 시베리아의 콜차크, 남부의 데니킨, 페트로그라드를 노린 유데니치의 백군은 서로 협력하지 못하고 농민의 지지도 얻지 못해 1919~1920년 차례로 무너졌고, 1920년 11월 브랑겔의 백군이 크림반도에서 철수했다. 1919년부터 국경을 두고 폴란드와 싸우던 적군은 1920년 8월 바르샤바 앞까지 나아갔다가 피우수트스키가 이끄는 폴란드군의 반격에 졌고, 리가 조약(1921년 3월)으로 국경이 정해졌다. 내전과 기근으로 수백만 명이 죽었다."
