- id: invasion-of-poland-1939
  year: 1939
  endYear: 1940
  title:
    ko: 독소 불가침 조약과 폴란드 침공
  summary:
    ko: "뮌헨 회담에서 따돌림받은 소련은 1939년 여름 영국·프랑스와의 군사 협상이 지지부진하자 방향을 바꿔, 8월 23일 모스크바에서 독일과 불가침 조약을 맺었다(리벤트로프·몰로토프). 비밀 의정서에서는 폴란드를 나눠 갖고, 핀란드·에스토니아·라트비아와 루마니아가 다스리던 베사라비아를 소련의 세력권으로 하기로 했다(리투아니아는 9월 소련 쪽으로 바꿈. 소련은 1989년에야 의정서를 인정했다). 반공을 내걸던 독일이 소련과 손잡았다는 소식에, 독일과 방공 협정을 맺은 일본에서는 히라누마 내각이 유럽 정세를 알 수 없다며 물러났다. 9월 1일 새벽 독일군이 단치히의 베스테르플라테 포격과 함께 폴란드를 침공했고, 9월 3일 영국과 프랑스가 독일에 선전 포고해 2차 세계 대전이 시작되었다. 전차와 항공기를 앞세운 독일군의 기습(전격전)에 폴란드군이 밀리는 가운데 9월 17일 소련군이 동쪽에서 쳐들어왔고, 바르샤바는 9월 말 항복했다. 독일은 단치히 자유시(9월 1일 병합 선언)와 폴란드 서부를 병합하고 나머지에 총독부를 두었으며, 1939~1940년 폴란드의 지식인·성직자·정치인 수만 명을 처형하고 유대인을 게토로 몰아넣었다. 소련은 동부를 합친 뒤 1940년 봄 카틴 숲 등에서 폴란드 장교와 지식인 약 2만 2천 명을 학살했다(소련은 1990년에야 인정). 폴란드 정부는 국외에 망명 정부를 세웠다. 소련은 11월 30일 핀란드를 침공해(겨울 전쟁) 국제 연맹에서 제명되었고, 핀란드군의 거센 저항 끝에 1940년 3월 카렐리야 지협 등을 얻었다. 1940년 6~8월에는 발트 3국과 루마니아가 다스리던 베사라비아, 북부코비나를 합쳤다. 그사이 서부에서는 영국·프랑스가 본격적인 공격에 나서지 않아 '가짜 전쟁'이라 불린 대치가 이어졌다."
