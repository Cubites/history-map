- id: february-revolution-1917
  year: 1917
  title:
    ko: 러시아 2월 혁명
  summary:
    ko: "전쟁이 길어지며 패전과 식량·연료 부족이 겹치자, 1917년 3월 8일(구력 2월 23일) 수도 페트로그라드에서 빵을 요구하는 여성 노동자들의 시위가 총파업으로 번졌고 진압에 나선 군대까지 시위대 편에 섰다. 두마(국회) 의원들은 르보프 공을 총리로 하는 임시 정부를 세웠고, 노동자·병사들은 페트로그라드 소비에트를 만들었다. 3월 15일(구력 3월 2일) 니콜라이 2세가 물러나 300년 넘게 이어진 로마노프 왕조가 끝났다. 임시 정부는 언론·집회의 자유를 보장했으나 전쟁을 이어 갔고 토지 개혁은 헌법 제정 의회로 미뤘다. 4월 독일이 내준 열차로 망명지 스위스에서 돌아온 볼셰비키 지도자 레닌은 '모든 권력을 소비에트로'를 내걸고 임시 정부를 거부했다(4월 테제). 7월 공세가 실패한 뒤 케렌스키가 총리가 되었으나, 9월 코르닐로프 장군의 반란을 막는 과정에서 무장한 노동자들을 거느린 볼셰비키의 힘이 커졌다."
  subjects: [russia, german-empire]
