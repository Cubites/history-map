- id: versailles-1919
  year: 1919
  endYear: 1920
  title:
    ko: 파리 강화 회의와 베르사유 조약
  summary:
    ko: "1919년 1월 18일 파리에서 승전국 대표들이 강화 회의를 열었다. 패전국과 소비에트 러시아는 부르지 않았고, 미국의 윌슨, 영국의 로이드 조지, 프랑스의 클레망소, 이탈리아의 오를란도가 주요 결정을 내렸다. 6월 28일 베르사유 궁전 거울의 방에서 독일과 맺은 베르사유 조약(1920년 1월 10일 발효)으로 독일은 알자스-로렌을 프랑스에 돌려주고 오이펜-말메디를 벨기에에 넘겼으며, 포즈난과 서프로이센 대부분을 폴란드에 넘겨 폴란드가 바다로 나가는 길(폴란드 회랑)이 생겼다. 북슐레스비히는 주민 투표를 거쳐 덴마크로 갔고, 단치히는 국제 연맹 보호 아래 자유시가 되었으며, 자르 지역은 15년 동안 국제 연맹이 관리하게 되었다. 해외 식민지는 모두 잃어 국제 연맹의 위임 통치령으로 승전국에 나뉘었다. 군대는 10만 명으로 줄이고 공군과 잠수함을 가질 수 없었으며, 라인란트는 비무장 지대로 삼아 라인강 왼쪽을 연합군이 최대 15년 동안 점령하기로 했다. 전쟁 책임 조항(231조)을 바탕으로 막대한 배상을 지게 되었는데, 액수는 1921년 1,320억 금마르크로 정해졌다. 독일은 '강요된 평화'라며 크게 반발했다. 산둥반도의 독일 권익을 일본에 넘기기로 한 결정이 알려지자 중국에서는 5·4 운동(1919년 5월)이 일어났고, 중국 대표단은 끝내 조약 서명을 거부했다. 미국은 상원이 비준을 거부해 이 조약에 참여하지 않았다."
  subjects: [weimar-republic, france, uk, usa, italy, japan, poland, belgium, denmark, roc, saar-territory]
