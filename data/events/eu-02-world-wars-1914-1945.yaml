- id: united-nations-1945
  year: 1944
  endYear: 1945
  title:
    ko: 국제 연합의 창설
  summary:
    ko: "국제 연맹의 실패를 교훈 삼아 연합국은 전쟁 중에 새 국제기구를 준비했다. 1944년 8~10월 미국·영국·소련·중국 대표가 워싱턴의 덤버턴오크스에서 초안을 만들었고, 얄타 회담에서 안전 보장 이사회의 표결 방식을 정했다. 1945년 4월 25일~6월 26일 샌프란시스코 회의에서 50개국이 국제 연합 헌장에 서명했고(폴란드가 뒤에 서명해 51개 원회원국), 헌장은 10월 24일 효력을 얻었다. 미국·영국·소련·중국·프랑스가 거부권을 가진 안전 보장 이사회 상임 이사국이 되었고, 국제 연맹과 달리 침략국에 군사적 제재를 할 수 있게 했다. 본부는 뒤에 뉴욕으로 정해졌다. 국제 연합은 1947년 한국 문제를 넘겨받아 5·10 총선거(1948)를 감시했고, 6·25 전쟁 때 유엔군을 보냈다."
  subjects: [usa, uk, soviet-union, roc, france]
  tags: [diplomacy]
  sources: ["「덤버턴오크스 제안」(1944)", "「국제 연합 헌장」(1945)"]
