- id: lateran-treaty-1929
  year: 1929
  title:
    ko: 라테란 조약과 바티칸 시국
  summary:
    ko: "1870년 이탈리아 왕국이 로마를 점령해 교황령이 사라진 뒤, 교황은 스스로를 '바티칸의 포로'라 부르며 이탈리아 국가를 인정하지 않았고(로마 문제), 한동안 가톨릭 신자에게 이탈리아 총선거에 참여하지 말라고 했다. 가톨릭교회의 지지를 얻으려던 무솔리니 정부는 1929년 2월 11일 교황청과 라테란 조약을 맺었다. 이탈리아는 로마 안의 약 0.44km²(자료에 따라 0.49km²) 땅에 교황이 다스리는 주권 국가 바티칸 시국을 인정하고 옛 교황령을 잃은 데 대한 보상금을 주었으며, 교황청은 로마를 수도로 한 이탈리아 왕국을 인정했다. 함께 맺은 정교 협약으로 가톨릭은 이탈리아의 국교가 되고 학교에서 종교 교육이 이루어졌다(국교 조항은 1984년 개정 협정으로 없어짐). 세계에서 가장 작은 독립국인 바티칸 시국은 2차 대전 중 중립을 지켰다. 교황청은 1963년 한국과 수교했고, 교황 요한 바오로 2세는 1984년 서울에서 한국 순교자 103위를 성인으로 선포했다."
  subjects: [vatican, italy]
