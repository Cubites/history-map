  tags: [economy, politics]
  sources: ["「런던 지불 계획」(1921)", "「도스안」(1924)", "이언 커쇼, 『히틀러』(교양인, 2010)"]

- id: locarno-1925
  year: 1925
  endYear: 1928
  title:
    ko: 로카르노 조약과 부전 조약
  summary:
    ko: "독일 외무 장관 슈트레제만과 프랑스 외무 장관 브리앙이 화해 외교에 나서 1925년 10월 스위스 로카르노에서 여러 조약이 합의되었다(12월 런던에서 서명). 독일·프랑스·벨기에는 베르사유 조약이 정한 서로의 국경과 라인란트 비무장을 지키기로 하고 영국과 이탈리아가 이를 보장했다. 그러나 독일의 동쪽 국경은 보장하지 않아 폴란드·체코슬로바키아의 불안이 남았다. 독일은 1926년 9월 국제 연맹에 가입해 상임 이사국이 되었고, 슈트레제만과 브리앙은 노벨 평화상을 받았다. 1928년 8월에는 브리앙과 미국 국무 장관 켈로그의 제안으로 15개국이 파리에서 국가 정책의 수단으로 전쟁을 쓰지 않겠다는 부전 조약(켈로그-브리앙 조약)을 맺었고 일본도 서명했다. 그러나 어기는 나라를 제재할 방법이 없었고, 이 화해 분위기는 대공황으로 무너졌다."
  subjects: [weimar-republic, france, belgium, uk, italy, poland, czechoslovakia, usa, japan]
