- id: sevres-1920
  year: 1919
  endYear: 1922
  title:
    ko: 세브르 조약과 튀르키예 독립 전쟁
  summary:
    ko: "무드로스 휴전(1918년 10월) 뒤 연합군이 이스탄불을 점령했고, 1919년 5월 15일 그리스군이 이즈미르(스미르나)에 상륙해 서아나톨리아로 나아갔다. 갈리폴리 전투로 이름을 얻은 무스타파 케말은 5월 19일 흑해 연안의 삼순에 건너가 저항 운동을 조직했고, 1920년 4월 앙카라에 대국민 의회를 열어 이스탄불의 술탄 정부와 다른 정부를 세웠다. 술탄 정부가 서명한 세브르 조약(1920년 8월 10일)은 아랍 지역을 떼어 영국·프랑스의 위임 통치령으로 돌리고, 동트라키아를 그리스에 넘기며, 이즈미르 일대는 그리스가 관리하다 주민 투표로 귀속을 정하게 하고, 해협을 국제 관리 아래 두며 동부에 아르메니아 국가를 세우게 하는 등 오스만 제국을 쪼개는 내용이었다. 이탈리아가 1912년부터 점령한 도데카니사 제도도 이 조약으로 오스만이 이탈리아에 넘겼는데, 이탈리아는 그리스와 따로 맺은 협정으로 로도스를 뺀 섬들을 그리스에 주기로 했다가 지키지 않았다(1923년 로잔 조약으로 이탈리아 영토가 됨). 앙카라 정부는 조약을 거부하고 싸웠다. 1921년 8~9월 사카리아강 전투에서 그리스군을 막아 내고, 1922년 8월 대공세로 9월 9일 이즈미르에 들어갔으며(이어 그리스·아르메니아인 주민이 학살되고 큰불로 그 구역이 불탔다), 10월 무단야 휴전을 맺었다. 대국민 의회는 11월 1일 술탄제를 폐지해 600년 넘게 이어진 오스만 왕조의 지배가 끝났다."
  subjects: [ottoman, ottoman-greek-occupation, greece, uk, france, italy, dodecanese-occupied]
