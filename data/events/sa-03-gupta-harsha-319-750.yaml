# 남아시아 사건 3차 묶음(sa-03): 굽타에서 하르샤·찰루키아·팔라바와 아랍의 신드 정복까지 (320 ~ 749년)
# 범위: 굽타 제국의 성립·사무드라굽타의 정복·찬드라굽타 2세의 서 크샤트라파 정복·쿠마라굽타 1세와 스칸다굽타·훈족·굽타의 끝과 문화·사회,
#   키다라와 알촌 훈족(토라마나·미히라쿨라)·야쇼다르만, 마우카리·후기 굽타·가우다(샤샹카)·하르샤 바르다나와 그 뒤의 카나우지,
#   바다미 찰루키아(풀라케신 2세)와 팔라바(마헨드라바르만·나라심하바르만)·카담바·바카타카와 아잔타·비슈누쿤딘·살란카야나·서 강가·마이트라카,
#   카마루파·리차비의 네팔·카르코타의 카슈미르·투르크 샤히·토번의 서쪽 진출과 서 히말라야, 신드의 라이와 차치 왕조·무함마드 이븐 카심의 신드 정복,
#   프라티하라의 시작과 아랍을 막은 서인도·메와르와 토마라의 성립 전승·바우마카라, 스리랑카 아누라다푸라.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 같은 때 일어난 작은 일은 큰 사건 안 한 문장으로 합쳤다.
# 날짜: 모두 그레고리력이다. 5~7세기 비문은 굽타력·샤카력 해를 환산해 해가 한두 해 갈리는 일이 많아 연대가 갈리는 일과 확실하지 않은 날짜는 '무렵'으로 적었다. 군주 재위는 위키백과 영어판 왕조 문서의 군주 목록을 따랐다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 왕조 이름은 '○○ 왕조'를 기본으로 하되 지도 항목 이름(굽타 제국·바르다나 왕조 등)을 그대로 쓴 곳도 있다.
#   사원 파괴·불교 박해·정복 같은 민감한 일(미히라쿨라, 샤샹카의 보리수 전승, 아랍의 신드 정복)은 어느 쪽 시각도 따르지 않고 일어난 일과 주어, 사료(누가 언제 적었나)만 적었고, 숫자나 평가가 갈리면 범위나 두 학설을 함께 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(법현·현장·혜초의 여행, 구마라집, 송첸감포와 토번, 당의 서역 진출, 아랍의 정복, 고선지의 탈라스 전투 등).

- id: gupta-founding-320
  year: 320
  endYear: 335
  title:
    ko: "찬드라굽타 1세와 굽타 제국의 성립(320~335)"
  summary:
    ko: "굽타 가문은 3세기 후반 마가다(지금의 비하르)와 갠지스 중류 일대의 작은 지방 세력으로 보이며, 이름이 알려진 시조는 굽타(슈리굽타)와 그 아들 가토트카차다. 3세기 데칸 쪽의 사정은 「사타바하나 뒤의 데칸: 이크슈바쿠·아비라·추투·바카타카·팔라바(225~275년 무렵)」(앞의 사건)가 다룬다. 가토트카차의 아들 찬드라굽타 1세는 마가다 서쪽의 오랜 씨족 공화국 리차비의 공주 쿠마라데비와 혼인했는데, 이 혼인은 아들 사무드라굽타의 비문과 두 사람의 얼굴을 새긴 금화가 기념한다. 푸라나의 한 구절은 굽타가 프라야가(지금의 알라하바드)·사케타·마가다를 다스렸다고 전하며, 이것이 초기 굽타가 쥔 땅의 가장 앞선 윤곽이다. 찬드라굽타 1세는 '마하라자디라자(왕 중의 왕)'를 칭했고, 훗날 굽타력(Gupta era)은 그의 즉위 320년(2월)을 첫 해로 삼는다. 다만 굽타력이 정말 이 즉위에서 시작하는지는 학자들이 완전히 확정하지는 못했다. 그의 재위는 319 또는 320년부터 335년 무렵으로 본다. 그 뒤 카차라는 이름의 군주가 동전에만 보이는데, 사무드라굽타와 같은 사람의 다른 이름이라는 설과 형제라는 설이 갈려 정체가 분명하지 않다. 굽타가 파탈리푸트라를 도읍으로 삼은 때도 사료마다 갈린다. 이 시기에 굽타는 아직 마가다 주변의 지방 왕국이었고, 갠지스 평원 전체를 아우르는 제국이 된 것은 다음 군주 사무드라굽타의 정복(「사무드라굽타의 정복과 알라하바드 기둥 비문(335~375)」, 뒤의 사건)을 거쳐서다. 이 혼인의 무게는 금화에서도 보인다. 앞면에 왕과 왕비 두 사람, 뒷면에 사자를 탄 여신과 '리차비들'이라는 명문을 새긴 금화가 알려져 있어 학자들은 이를 혼인 기념 화폐로 읽는다. 리차비의 위신과 바이샬리 일대의 땅이 굽타에 보태졌다는 해석이 많지만 비문이 직접 그렇게 말하지는 않는다."
  subjects: [gupta-empire]
  tags: [politics]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: salankayana-pallava-320
  year: 320
  endYear: 340
  title:
    ko: "이크슈바쿠의 끝과 살란카야나·팔라바(320~340 무렵)"
  summary:
    ko: "크리슈나강 하류의 안드라 이크슈바쿠 왕조는 3세기 중엽 사타바하나의 뒤를 이어 나가르주나콘다에 불교 대탑을 세웠으나(「사타바하나 뒤의 데칸: 이크슈바쿠·아비라·추투·바카타카·팔라바(225~275년 무렵)」, 앞의 사건), 4세기 초에 힘을 잃어 325년 무렵 사라진다. 그 자리의 동해안 델타(벵기)에는 살란카야나 왕조가 들어선다. 이 왕조는 동판 몇 장으로만 알려지며, 이름은 샬랑카라는 부족 이름 또는 가문 이름에서 왔다고 한다. 알려진 왕으로는 데바바르만과 하스티바르만이 있고, 하스티바르만은 사무드라굽타의 알라하바드 비문에 벵기의 군주로 나온다. 한편 남쪽 칸치푸람의 팔라바는 3세기 후반 심하바르만 1세 무렵(군주표에는 275~300년으로 적힌다)부터 이름이 보이며, 4세기 초에는 시바스칸다바르만 등이 프라크리트어 동판을 남겼다. 이 초기 팔라바 왕들의 순서와 연대는 동판의 해가 흩어져 있어 학설이 갈린다. 팔라바는 이어서 사무드라굽타가 350년 무렵 남쪽으로 내려왔을 때 칸치의 비슈누고파라는 이름이 비문에 나오는 것으로 다시 확인된다. 이 시기 안드라와 타밀 북부를 두 왕조가 나눠 다스렸다는 점이 이 사건의 요지이며, 두 왕조 모두 뒷날 벵기와 칸치를 두고 바다미 찰루키아와 다투게 된다(「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」, 뒤의 사건). 이크슈바쿠의 왕으로는 바시슈티푸트라 샨타물라와 그 아들 비라푸루샤닷타, 에후발라 샨타물라가 비문에 나오고, 샨타물라의 누이 샨티스리 같은 왕실 여성들이 나가르주나콘다 불교 유적의 주요 시주자였다. 이 시기 팔라바와 살란카야나의 동판은 문서 언어가 프라크리트에서 산스크리트로 바뀌는 과도기를 보여 준다. 벵기는 고다바리강과 크리슈나강 사이의 비옥한 삼각주다."
  subjects: [salankayana-dynasty, andhra-ikshvaku-dynasty, pallava-dynasty]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: samudragupta-335
  year: 335
  endYear: 375
  title:
    ko: "사무드라굽타의 정복과 알라하바드 기둥 비문(335~375)"
  summary:
    ko: "찬드라굽타 1세의 아들 사무드라굽타는 335년 무렵부터 375년 무렵까지 재위했다(카차라는 군주가 사이에 있었다는 설은 앞 사건에서 적었다). 그의 업적은 궁정 시인 하리세나가 산스크리트로 지은 「알라하바드 기둥 비문」(350년 무렵)이 가장 자세히 전한다. 이 비문은 정복을 네 종류로 구분한다. 첫째, 북쪽 아리아바르타의 왕 아홉 안팎을 '뿌리째 뽑아' 땅을 굽타에 병합했다. 둘째, 데칸과 동해안의 열두 왕을 사로잡았다가 풀어 주고 복위시켰다고 하며 칸치 팔라바 왕가의 비슈누고파, 벵기 살란카야나 왕가의 하스티바르만이 들어 있다. 이 남쪽 왕들은 공물을 바치는 관계였을 뿐 굽타가 직접 다스렸다고 보기는 어렵다. 셋째, 변경의 사마타타·다바카·카마루파·네팔라·카르트리푸라와 서북의 부족 공화국들은 조공과 복종을 맹세했다. 넷째, 다이바푸트라 샤히 샤하누샤히(쿠샨계)·샤카·스리랑카의 메가바르나 같은 먼 군주들은 사절을 보내 호의를 구했고, 메가바르나는 보드가야에 승원을 짓게 해 달라고 청했다고 한다. 비문은 그에게 아슈바메다(말 희생제)를 올린 왕이라는 칭호도 준다. 비문 주장이 모두 사실인지는 학자들이 논쟁하지만, 갠지스 평원 대부분이 그의 재위 때 굽타의 직접 지배에 들어갔다는 점은 널리 받아들여진다. 그는 시와 음악에도 능했다고 하며 금화 가운데 비나(현악기)를 타는 모습이 있다. 그의 뒤를 이은 군주를 둘러싼 이야기(라마굽타)는 「찬드라굽타 2세와 서 크샤트라파의 정복(380~415)」에서 다룬다. 그의 금화는 활을 쏘는 왕, 비나를 타는 왕, 말 희생제 말, 전투 도끼를 든 왕 등 여러 도안으로 발행되어 선전 수단이기도 했다. 알라하바드 기둥은 본래 아소카의 칙령이 새겨진 기둥이었고, 하리세나의 비문은 그 위에 덧붙여 새긴 것이다."
  subjects: [gupta-empire, pallava-dynasty, salankayana-dynasty]
  tags: [politics, war]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "D. C. Sircar, Select Inscriptions Bearing on Indian History and Civilization, vol. 1 (University of Calcutta, 1942)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)"]

- id: abhira-chutu-ganga-335
  year: 335
  endYear: 350
  title:
    ko: "아비라·추투의 끝과 서 강가의 성립(335~350 무렵)"
  summary:
    ko: "데칸 서부와 카르나타카에서는 4세기 중엽에 사타바하나 뒤의 질서가 바뀌었다. 나식 일대의 아비라 왕국은 사타바하나가 무너진 뒤 이어진 왕조인데(「사타바하나 뒤의 데칸: 이크슈바쿠·아비라·추투·바카타카·팔라바(225~275년 무렵)」, 앞의 사건), 335년 무렵 바카타카와 이웃 세력에 밀려 힘을 잃는 것으로 본다. 북부 카르나타카의 바나바시를 다스린 추투 왕국(사타바하나의 방계라는 설)은 344년 무렵 끝나고 그 땅은 카담바가 이어받는다(「카담바 왕조의 성립과 쇠퇴(345~540 무렵)」). 이와 거의 같은 때 남쪽 카베리강 상류 코라르 일대에서는 서 강가 왕조가 일어난다. 서 강가는 전승상 콩가니바르만(350년 무렵)을 시조로 삼고 처음 도읍은 코랄라(지금 콜라르), 뒤에 탈라카드(탈라카도)로 옮겼으며 1004년 촐라의 라자라자 1세에게 무너질 때까지 이어진다. 초기 서 강가 왕들의 동판은 몇 장 남아 있지 않고 후대의 위조 판도 섞여 있어, 시조 이후 여러 왕의 순서가 분명하지 않다. 서 강가는 이웃 카담바·팔라바 사이에서 힘을 키웠고, 뒤에 바다미 찰루키아와 라슈트라쿠타에 복속하면서도 11세기 초까지 같은 왕계를 유지했다. 세 왕조는 모두 지방 호족의 땅 하사 문서(동판)를 통해서만 알려지는 소국이어서, 연대를 몇 해 단위로 확정하기는 어렵다. 아비라는 3세기 중엽 이슈바라세나가 열었다고 나식 동굴 비문이 전하고, 사무드라굽타의 비문에도 서쪽 변경의 아비라가 나온다. 서 강가는 동쪽 칼링가의 동부 강가와 구별하려고 붙인 이름이며 자이나교 후원이 두드러진다. 서 강가는 시조가 동쪽 칼링가 쪽에서 내려왔다는 전승을 지니지만 증거는 약하다. 이들의 일은 비문이 적어 연대를 한두 세대 단위로만 짐작할 수 있다."
  subjects: [abhira-kingdom, chutu-kingdom, western-ganga-dynasty, kadamba-dynasty]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: kadamba-345
  year: 345
  endYear: 540
  title:
    ko: "카담바 왕조의 성립과 쇠퇴(345~540 무렵)"
  summary:
    ko: "카담바 왕조는 바나바시(지금 카르나타카 북카나라)를 도읍으로 345년 무렵부터 540년 무렵까지 이어졌다. 시조 마유라샤르마(재위 345~365 무렵)는 본래 브라만 학생이었는데, 칸치푸람에서 팔라바 관리와 다투고 무기를 들어 바나바시 일대를 차지했고 왕이 되었다고 한다(추투 왕국의 끝은 「아비라·추투의 끝과 서 강가의 성립(335~350 무렵)」). 뒤를 이은 캉가바르만 때 바카타카의 압박이 있었고, 바기라타를 거쳐 라구는 팔라바와 싸우다 죽었다. 5세기 전반 카쿠스타바르만(435~455 무렵)은 굽타 왕가와 혼인을 맺고 왕조의 전성기를 이끌었으며, 탈라군다의 프라네슈바라 사원 비문이 그 시대를 전한다. 그의 아들 산티바르만 무렵 나라가 둘로 나뉘어(트리파르바타 계통 크리슈나바르만 1세의 재위가 겹쳐 적혀 시기가 분명하지 않다) 아우 크리슈나바르만이 남쪽 트리파르바타 계통을 열었다. 이후 시바만다트루바르만(460~475 무렵)을 거쳐 므리게샤바르만, 라비바르만(5세기 말~519년 무렵), 하리바르만으로 이어졌고 하리바르만 때 두 계통의 다툼으로 힘이 떨어졌다. 카담바는 카르나타카에서 처음으로 카나다어를 행정에 쓴 왕조로, 할미디 비문(450년 무렵)이 그 가장 앞선 보기다. 540년 무렵 바다미 찰루키아가 세력을 넓히면서 카담바는 속국이 되었고(「바다미 찰루키아의 성립과 데칸 서부(543~610)」), 그 방계가 고아·할라시 등에서 남았다. 왕들의 재위는 사료마다 몇 해씩 갈린다. 탈라군다 비문은 카쿠스타바르만이 딸들을 굽타를 비롯한 이웃 왕가에 시집보냈다고 자랑하고, 자이나교 사원에 땅을 내려 준 동판도 알려져 있다. 카담바는 연꽃 무늬 금화로도 알려져 있다. 카담바 비문은 산스크리트와 카나다어를 함께 썼다. 이 왕조의 연대는 비문마다 몇십 년씩 갈린다."
  subjects: [kadamba-dynasty, pallava-dynasty, gupta-empire]
  tags: [politics, culture]
  sources: ["George M. Moraes, The Kadamba Kula: A History of Ancient and Mediaeval Karnataka (B. X. Furtado and Sons, 1931)", "K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)"]

- id: kidarite-360
  year: 360
  endYear: 375
  title:
    ko: "쿠샨샤르의 끝과 키다라 왕국, 쿠샨의 마지막(360~375 무렵)"
  summary:
    ko: "3세기 중엽 사산 제국이 쿠샨 서부(박트리아)를 차지하고 그 땅에 사산 왕자가 '쿠샨샤(쿠샨의 왕)' 칭호로 다스리는 쿠샨샤르 왕국을 세웠다(「카니슈카와 쿠샨의 전성(127~150년 무렵)」, 앞의 사건이 다룬 쿠샨의 전성이 가고 난 뒤다). 쿠샨샤르는 간다라(페샤와르 골짜기·스와트·탁실라)까지 손을 뻗쳤으나 360년 무렵 키다라에게 박트리아(발흐 일대)를 잃는다. 키다라는 박트리아에서 일어난 '훈 계통' 유목 집단의 왕조로, 이름은 군주 키다라(활동 350~385년 무렵)에서 왔다. 키다라는 처음에는 사산 샤푸르 2세의 동맹으로 싸웠으나 360~370년 무렵 쿠샨샤르를 밀어내고 박트리아를 차지했고, 390~410년 무렵 간다라와 펀자브 북부·카슈미르로 퍼졌다. 이들은 동전에 쿠샨 금화의 도안을 따랐고 '쿠샨'이라는 칭호를 이어 썼으며 불교를 후원해 간다라 불교 미술이 이어졌다. 375년 무렵 펀자브에 남아 있던 쿠샨의 마지막 왕계가 끊어지면서 쿠샨 제국도 사라진다. 사무드라굽타의 비문에 나오는 다이바푸트라 샤히 샤하누샤히는 쿠샨계로 읽히고, 5세기 중엽 스칸다굽타가 막은 훈의 침입(「스칸다굽타와 굽타의 동요(455~477)」)을 키다라 계통으로 보는 설도 있다. 키다라는 466~467년 사산의 페로즈 1세에게 지고(알촌 훈족의 도움), 5세기 후반 알촌에게 땅을 잃는다(「알촌 훈족의 성립과 키다라의 끝(460~470)」). 로마 사료인 암미아누스 마르켈리누스는 359년 아미다 포위전에 동방의 '키오니타이' 왕 그룸바테스가 샤푸르 2세를 도왔다고 적는데, 키다라 계통과 이 키오니타이를 같은 집단으로 읽는 학자가 많다. 키다라의 동전에는 '키다라 쿠샨샤'라는 칭호가 새겨졌다."
  subjects: [kushan-empire, kushano-sasanian-kingdom, kidarite-kingdom, sasanian-empire]
  tags: [politics, war]
  sources: ["Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: chandragupta-ii-380
  year: 380
  endYear: 415
  title:
    ko: "찬드라굽타 2세와 서 크샤트라파의 정복(380~415)"
  summary:
    ko: "사무드라굽타의 뒤를 누가 이었는지는 사료가 갈린다. 후대 희곡 『데비찬드라굽탐』은 맏아들 라마굽타가 샤카 왕에게 왕비를 내주려 하자 동생 찬드라굽타가 그를 꺾고 왕이 되었다고 하지만, 라마굽타의 실재는 동전으로만 확인될 뿐 이야기의 사실성은 논쟁이다. 찬드라굽타 2세는 375 또는 380년 무렵부터 415년 무렵까지 재위했고, 산치 비문(굽타력 93년, 412~413년)이 그의 마지막 해 기록이다. 그는 딸 프라바바티굽타를 바카타카 루드라세나 2세에게 시집보냈고, 남편이 390년 무렵 죽자 그녀가 20년 가까이 어린 아들들의 섭정을 맡아 데칸 중부 바카타카가 굽타의 영향권에 놓였다. 그의 가장 큰 일은 서 크샤트라파 정복이다. 루드라다만의 후손인 서 크샤트라파는 「루드라다만과 주나가드 비문(150년 무렵)」(앞의 사건)에서 보듯 3세기까지 말와·구자라트·카티아와르를 쥐고 있었다. 마지막 크샤트라파 동전(루드라심하 3세)은 388 또는 397년 해로 읽히고, 찬드라굽타 2세의 정복은 397~409년 사이로 잡는다. 409년 해의 굽타 동전은 크샤트라파 은화를 본뜨되 불교 상징 대신 가루다를 넣었다. 우다야기리 동굴 비문과 델리의 철 기둥 비문(찬드라 왕으로 읽힘)은 그의 승리를 서술하는데, 철 기둥은 동쪽의 방가(벵골)와 인더스 건너 발히카 정벌도 말한다. 그는 '비크라마디티야'라는 칭호를 썼다고 하며, 중국 승려 법현(「법현의 천축 순례(399~412)」, 뒤의 사건)이 이 무렵 굽타 영토를 6년 가까이 보고 평화롭고 풍요롭다고 적었다. 서쪽 바다(구자라트 항구)를 얻은 굽타는 로마·페르시아와의 해상 교역에 닿았다. 정복 뒤 우자인이 서부 거점이 되었다는 설이 있으나 확증은 없다. 그는 '파라마바가바타(비슈누의 지극한 신자)'를 칭했고, 서 크샤트라파 은화의 전통을 이어 은화도 발행했다."
  subjects: [gupta-empire, western-satraps, vakataka-dynasty]
  links:
    - { from: gupta-empire, to: western-satraps, note: "찬드라굽타 2세가 말와·구자라트의 서 크샤트라파를 정복 (397~409 사이)" }
  tags: [politics, war, diplomacy]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Hans T. Bakker, The Vākāṭakas: An Essay in Hindu Iconology (Egbert Forsten, 1997)"]

- id: licchavi-400
  year: 400
  endYear: 464
  title:
    ko: "카트만두 분지의 리차비 왕국(400 무렵~464)"
  summary:
    ko: "네팔의 리차비 왕국은 카트만두 분지를 근거로 400년 무렵부터 879년까지 이어졌다. 이름은 갠지스 평원의 오랜 씨족 공화국 리차비(밧지 연맹의 한 씨족)에서 왔고, 이 가문의 한 갈래가 분지에 들어와 앞선 지배 가문과 혼인해 왕이 되었다고 전한다(굽타 왕가도 리차비와 혼인했다는 점이 겹쳐 관계 있어 보이나 증명되지는 않는다). 가장 앞선 확실한 기록은 464년 마나데바의 창구 나라얀 기둥 비문으로, 이 비문이 앞선 세 왕의 이름을 적어 왕조가 4세기 말에 시작했음을 보인다. 앞서 사무드라굽타의 비문은 변경의 '네팔라'가 조공을 바쳤다고 말한다(「사무드라굽타의 정복과 알라하바드 기둥 비문(335~375)」). 마하라자가 다스리고 총리가 군사와 대신을 거느렸으며, 사만타라는 귀족이 자기 영지와 군을 갖고 궁정에 영향을 주었다. 비문은 굽타 문자와 쿠틸라 문자로 쓰였고 궁정 언어는 산스크리트, 일상 언어는 네와르어였다. 쌀농사와 히말라야 산길 교역이 기반이었고, 불교와 시바·비슈누 신앙이 함께 후원받았다. 이후 암슈바르만(605~641 무렵)과 토번의 관계는 「토번의 서쪽 진출과 서 히말라야(650~750 무렵)」에서 다룬다. 마나데바(464~505 무렵) 때부터 비슈누 신앙과 파슈파티나트의 시바 신앙이 분지에서 자리 잡았고, 마나데바의 이름을 딴 '마난카' 동전이 널리 쓰였다고 전한다. 이 시기 리차비 사원 건축은 지금도 카트만두 분지의 창구 나라얀과 파슈파티나트 터에 남아 있다. 분지 안 도시 정착의 바탕이 이 시대에 놓였다고 본다. 이 왕국에 관한 기록은 대부분 돌 비문이어서 왕의 이름과 순서는 비문이 나온 만큼만 알 수 있다."
  subjects: [licchavi-kingdom, gupta-empire]
  tags: [politics, society]
  sources: ["Mary S. Slusser, Nepal Mandala: A Cultural Study of the Kathmandu Valley (Princeton University Press, 1982)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: gupta-religion-society-400
  year: 400
  endYear: 550
  title:
    ko: "굽타 시대의 종교와 사회: 힌두교의 부흥, 토지 하사, 불교 승원(400~550 무렵)"
  summary:
    ko: "굽타 왕들은 대부분 비슈누 신자를 자처했다(찬드라굽타 2세의 철 기둥은 비슈누에게 바쳐졌다). 사무드라굽타의 아슈바메다 같은 베다 희생제를 되살렸고, 불교와 자이나교 승원과 시바·비슈누·태양신 사원도 함께 후원했다. 푸라나(고대 설화 모음)가 이 시기에 지금의 꼴로 엮이고 『마누법전』 같은 법전이 정리되면서 힌두교 신앙이 사원 중심 예배로 자리 잡았다. 데오가르의 다샤바타라 사원과 비타르가온 벽돌 사원이 이른 보기다. 이와 함께 왕과 부호가 브라만과 사원에 땅을 세금 면제로 내려 주는 동판 문서가 늘어, 5세기 이후 지방 사회가 토지 하사로 얽혀 가는 흐름을 학자들은 '봉건화'라 부르는데, R. S. 샤르마의 이 설명에는 반론이 많다. 사회 질서는 바르나(브라만·크샤트리아·바이샤·수드라)라는 사료에 적힌 제도로 서술되고, 법전은 이를 법적 구분으로 삼았으나 실제 사회가 이와 같았는지는 따로 논쟁이다. 불가촉민이 '찬달라'로 불리며 도시 밖에 산다는 서술은 순례승의 기록에 나온다. 상업은 로마와의 해상 교역이 줄고 동남아 교역이 늘어나는 쪽으로 옮겨 갔고, 굽타 금화는 5세기 중엽부터 금 함량이 줄었다. 불교는 승원 대학(날란다 등)과 마투라·사르나트 미술로 이어졌다. 이 모든 변화의 뒤는 「굽타 제국의 끝과 마우카리·후기 굽타(543~606)」에서 이어진다. 에란에서 나온 510년 비문은 바누굽타의 장군 고파라자가 전사하자 그의 아내가 불에 몸을 던졌다고 적는데, 순장(사티)을 말하는 가장 이른 비문으로 꼽힌다. 파탈리푸트라에는 귀족이 세운 무료 시약소가 있었다고 순례승의 기록이 전한다. 산스크리트가 궁정과 비문의 공용 문어로 자리 잡은 것도 이 시기다."
  subjects: [gupta-empire]
  tags: [religion, society, economy]
  sources: ["R. S. Sharma, Indian Feudalism: c. A.D. 300–1200 (University of Calcutta, 1965)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "James Legge, trans., A Record of Buddhistic Kingdoms (Clarendon Press, 1886)"]

- id: gupta-culture-400
  year: 400
  endYear: 550
  title:
    ko: "굽타 시대의 학문과 미술: 칼리다사·아리아바타와 사르나트·아잔타(400~550 무렵)"
  summary:
    ko: "굽타 시대는 흔히 산스크리트 문학과 과학의 '고전기'로 불린다. 궁정 시인 칼리다사는 『샤쿤탈라』·『구름 사자』 같은 작품을 남겼는데 살았던 때가 분명하지 않아 찬드라굽타 2세 때라는 설이 있을 뿐이다. 수학자 아리아바타는 476년에 태어나 『아리아바티야』(499년)를 지어 지구의 자전과 원주율의 근삿값, 0을 포함한 위치 기수법의 쓰임을 다뤘고, 6세기에는 바라하미히라가 천문학을 정리했다. 10진 위치 기수법이 이 무렵 인도에서 다듬어졌다는 설명이 널리 받아들여지지만, 정확히 언제 어디서 시작했는지는 논쟁이다. 철학에서는 상키야·요가·니야야 같은 정통 학파의 체계가 문헌으로 정리되었다. 미술은 사르나트의 설법하는 붓다상이 대표로, 마투라 양식과 간다라 영향이 합쳐진 부드러운 선의 불상이 만들어졌다. 델리의 철 기둥은 4~5세기에 만든 금속 기술의 보기다. 데칸 바카타카 후원으로 이루어진 아잔타 석굴(5세기 후반)은 「바카타카의 하리세나와 아잔타(475~510)」에서 따로 다룬다. 이 번영의 뒷받침이 된 사회·종교의 변화는 「굽타 시대의 종교와 사회: 힌두교의 부흥, 토지 하사, 불교 승원(400~550 무렵)」가 다룬다. 이 시대 천문·수학 지식은 뒷날 아랍 세계로 건너가 번역되었다(「바그다드의 번역 운동과 지혜의 집(754~850)」, 뒤의 사건). 『카마수트라』와 『판차탄트라』 같은 책을 이 무렵의 문헌으로 읽는 설도 있으나 연대는 분명하지 않다. 6세기 바라하미히라의 『판차싯단티카』는 수리아·로마카 등 다섯 싯단타(천문 체계)를 정리한 책이다. 산스크리트가 궁정 문학과 비문의 공용어로 굳은 것도 이 시대다. 비문 대부분이 산스크리트 시문으로 쓰였다."
  subjects: [gupta-empire]
  tags: [culture]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kumaragupta-415
  year: 415
  endYear: 455
  title:
    ko: "쿠마라굽타 1세의 오랜 평화와 날란다(415~455)"
  summary:
    ko: "찬드라굽타 2세의 아들 쿠마라굽타 1세는 415년 무렵부터 455년 무렵까지 약 40년을 다스렸고, 이 시기는 굽타 왕조의 가장 평온한 때로 꼽힌다. 그가 남긴 비문과 금화는 북인도 전역에 퍼져 있어 영토가 거의 줄지 않았음을 보여 주며, 아슈바메다를 올렸다는 기념 금화도 있다. 436년의 만다소르 비문은 실크 직조 조합이 쿠마라굽타 1세와 그 아래 다샤푸라(지금 만다소르)를 맡은 반두바르만의 치세에 태양 사원을 세웠다고 적는다. 반두바르만이 속한 아울리카라 가문은 굽타에 딸린 말와 서부의 호족이었고, 440년 무렵부터는 자기 이름으로 이 땅을 다스리며 점차 자립해 간다. 중국 순례승 현장은 7세기에 쓴 기록에서 날란다 승원을 일으킨 왕을 '샤크라디티야'라 하는데 쿠마라굽타 1세로 읽는 학자가 많으며, 455년 무렵 창건으로 적는 개설서도 있다. 날란다는 뒤에 파탈리푸트라 남동쪽 마가다의 국제 불교 대학으로 커져 7세기에 현장과 의정이 머물렀다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」). 이 시기 굽타 금화는 도안이 가장 다양했고, 왕은 '마헨드라디티야' 같은 칭호를 썼다. 그의 치세 마지막 해(455년 무렵)에 훈이 국경을 넘어 오면서 평화가 깨지기 시작한다(「스칸다굽타와 굽타의 동요(455~477)」). 살란카야나·비슈누쿤딘 같은 데칸 동부 소국의 일은 「비슈누쿤딘의 성립과 팔라바·살란카야나(420~441 무렵)」에서 다룬다. 북벵골 푼드라바르다나에서 나온 다모다르푸르 동판들(443~448년 등)은 굽타 아래 도시 단위 행정과 땅 매매의 절차를 자세히 보여 준다. 그의 금화 가운데 공작에 올라탄 왕의 도안은 대표적인 것으로 꼽힌다."
  subjects: [gupta-empire, aulikara-dynasty]
  tags: [politics, religion]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: vishnukundin-pallava-420
  year: 420
  endYear: 441
  title:
    ko: "비슈누쿤딘의 성립과 팔라바·살란카야나(420~441 무렵)"
  summary:
    ko: "5세기 전반 데칸 동부에서는 살란카야나·팔라바·카담바가 얽혀 있었다. 크리슈나강 하류의 비슈누쿤딘 왕조는 420년 무렵 텔랑가나 동남부 아마라바티·카라미 일대에서 일어났고, 처음 왕으로 보이는 인드라바르만(5세기 전반이며 개설서마다 첫 왕이 갈린다) 이후 동판으로 이어진다. 한편 칸치푸람의 팔라바는 4세기에서 5세기 사이 시바스칸다바르만 계통에서 비슈누고파 계통으로 이어졌으며, 420년 무렵과 436년 무렵의 동판에 그 이름이 나온다. 살란카야나는 5세기 중엽 마지막 왕들의 동판을 끝으로 440년 무렵 사라지고, 벵기는 비슈누쿤딘의 영토에 들어간 것으로 본다. 어떤 싸움으로 바뀌었는지는 동판이 말하지 않는다. 같은 시기 카담바의 카쿠스타바르만은 435년 무렵 굽타를 비롯한 이웃 왕가와 혼인을 맺었다고 비문에 자랑한다(「카담바 왕조의 성립과 쇠퇴(345~540 무렵)」). 비슈누쿤딘은 '마헤슈와라' 신(시바)을 섬기고 아홉 이름의 비슈누 신앙도 보이지만 불교 대탑 보호를 이어 갔다. 이 왕조의 순서(인드라바르만 이후 마다바바르만 1세·고빈다바르만·마다바바르만 2세·비크라멘드라바르만에 이어 6세기의 여러 왕을 거쳐 마다바바르만 4세(573~621 무렵)까지)는 모두 동판에서 복원한 것이라 연대가 몇십 년씩 갈린다. 벵기를 두고 이들이 겨루는 구도는 624년 바다미 찰루키아가 개입해 정리한다(「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」). 비슈누쿤딘 가문의 마다바바르만 2세는 여러 차례 희생제를 올렸다고 동판이 자랑하고, 이 왕조는 강 하구 아마라바티 일대의 불교 유적과 힌두 사원을 함께 후원했다. 이 시기 데칸 동부의 왕조들은 모두 동판으로만 알려져 순서와 연대가 몇십 년씩 어긋난다. 비슈누쿤딘이라는 이름은 '비슈누의 연못'에서 왔다는 설명이 있으나 뜻은 분명하지 않다."
  subjects: [vishnukundin-dynasty, salankayana-dynasty, pallava-dynasty, kadamba-dynasty]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: skandagupta-455
  year: 455
  endYear: 477
  title:
    ko: "스칸다굽타와 굽타의 동요(455~477)"
  summary:
    ko: "쿠마라굽타 1세가 죽자(455년 무렵) 스칸다굽타가 굽타력 136년에 왕위에 올랐다. 비타르 기둥 비문은 그가 '훈'(후나)을 맞아 이겼다고 자랑하며 어머니에게 소식을 알리는 모습으로 끝난다. 주나가드 비문(굽타력 138년, 457~458년 무렵)도 '믈레차'(외국인) 격퇴를 말하는데 훈일 가능성이 크다. 같은 비문은 스칸다굽타가 카티아와르 총독 파르나닷타를 세웠고, 그의 아들 치크라팔리타가 홍수로 무너진 수다르샤나 호수의 둑을 456~457년 무렵 고쳐 쌓았다고 적는다. 이 훈은 곧 뒤에 알촌으로 불리게 되는 중앙아시아 유목 집단의 앞 세력으로 읽히나(「알촌 훈족의 성립과 키다라의 끝(460~470)」) 키다라 계통이라는 설도 있다. 금화의 변화도 나타난다. 스칸다굽타는 금화를 적게 발행했고 일부는 금 함량이 낮은데, 이를 전쟁 비용 때문이라고 보는 설명이 많지만 무게 기준을 바꾼 것(수바르나 기준 약 9.2g)으로 보는 해석도 있다. 그의 마지막 해는 굽타력 148년(467~468년)으로 읽힌다. 뒤는 이복형제 푸루굽타(467~473 무렵)가 이었다는 설이 가장 널리 받아들여지고, 이어 쿠마라굽타 2세(473~476)·부다굽타(476~495)가 나왔다. 사르나트 비문(굽타력 157년, 476년)은 부다굽타의 가장 이른 기록이다. 한편 군인 바타르카가 서쪽 카티아와르에서 독립해 마이트라카를 연다(「발라비의 마이트라카 왕조(475~650 무렵)」). 이렇게 5세기 후반 굽타는 서쪽 땅을 잃으며 약해졌다. 푸루굽타 이후 왕들의 재위는 군주표 기준이며 사료마다 몇 해씩 갈린다. 수다르샤나 호수는 서 크샤트라파 루드라다만 때에도 둑을 고쳤던 호수여서(「루드라다만과 주나가드 비문(150년 무렵)」, 앞의 사건) 두 비문은 같은 시설의 오랜 관리 이력을 보여 준다."
  subjects: [gupta-empire, maitraka-dynasty, kidarite-kingdom]
  tags: [politics, war]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "D. C. Sircar, Select Inscriptions Bearing on Indian History and Civilization, vol. 1 (University of Calcutta, 1942)", "Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)"]

- id: alchon-460
  year: 460
  endYear: 470
  title:
    ko: "알촌 훈족의 성립과 키다라의 끝(460~470)"
  summary:
    ko: "알촌 훈족은 박트리아에서 일어난 훈 계통 유목 집단으로, 동전에 박트리아 문자로 새긴 'αλχονο'라는 이름에서 알촌이라 부른다. 가장 앞선 군주로 알려진 이름은 킹길라(430년 무렵 동전)와 메하마(재위 461~493년으로 적힌다)이며, 메하마는 사산의 페로즈 1세 밑에서 총독을 지내기도 했다. 알촌은 466~467년 무렵 페로즈 1세와 손잡고 키다라를 공격해 박트리아를 차지했고, 460년 무렵부터 키다라가 쥐고 있던 간다라와 펀자브 쪽으로 밀려들어 470년 무렵 그 땅의 주인이 되었다(「쿠샨샤르의 끝과 키다라 왕국, 쿠샨의 마지막(360~375 무렵)」에서 이어짐). 알촌의 성립은 460년 무렵, 키다라의 끝은 470년 무렵으로 본다. 키다라의 작은 후계 세력은 카슈미르 등에 남았다. 알촌은 한때 사산에 종속된 상태에서 일어났으나 곧 대등한 세력이 되어 페로즈 1세가 484년 알촌과 싸우다 죽었다는 이야기가 전해지고, 이 전투의 정확한 해는 사료마다 갈린다. 492~493년의 탈라간 동판 두루마리는 킹길라·토라마나·자부카·메하마를 한 불탑에 시주한 이름으로 새겨 이들의 정치적 관계와 불교 후원을 알려 준다. 알촌 군주들이 박트리아에서 곧바로 인도 안쪽으로 들어온 것은 토라마나 때다(「토라마나의 인도 진출과 에란 전투(500~515)」). 알촌과 에프탈(헵탈리테스)이 같은 집단인지 다른 집단인지는 학자들이 논쟁한다. 알촌의 동전은 사산 은화의 양식을 본떴고 왕의 칭호로 '샤히'를 썼다. 알촌 군주들의 목록은 동전과 소수의 비문에만 기대어 킹길라·메하마 등의 재위 해를 학자마다 수십 년씩 다르게 잡는다. 동전의 글자는 박트리아 문자라서 읽는 법에도 논쟁이 남아 있다."
  subjects: [alchon-huns, kidarite-kingdom, sasanian-empire]
  tags: [politics, war]
  sources: ["Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: maitraka-475
  year: 475
  endYear: 650
  title:
    ko: "발라비의 마이트라카 왕조(475~650 무렵)"
  summary:
    ko: "마이트라카 왕조는 카티아와르 반도의 발라비(밸러비)를 도읍으로 475년 무렵부터 8세기 후반까지 이어졌다. 시조 바타르카는 굽타 왕조의 군사 총독(세나파티)이었다가 5세기 후반 굽타의 힘이 약해지자 독립한 인물로 보이며(「스칸다굽타와 굽타의 동요(455~477)」), 처음에는 '세나파티'만 칭했다. 이어 다라세나 1세, 드로나심하(이때 '마하라자' 칭호), 드루바세나 1세(비슈누 신자), 다라파타, 구하세나, 다라세나 2세로 이어졌고 7세기 전반 실라디티야 1세(다르마디티야)가 현장이 '행정에 뛰어난 군주'로 적은 왕이다. 카라그라하 1세와 다라세나 3세를 거쳐 드루바세나 2세(바라디티야, 7세기 전반)는 바르다나 왕조 하르샤의 사위가 되어 하르샤에게 종속된 동맹으로 지내다 하르샤 죽음(647) 뒤 독립을 되찾았고 현장도 640년 무렵 이 나라를 보았다(「하르샤 바르다나와 카나우지의 제국(606~647)」). 발라비 대학은 불교 대학으로 날란다에 비견되었고, 자이나교 결집이 열린 곳으로도 전해진다. 이 왕조는 대부분 시바 신자였으나 불교·자이나교를 함께 후원했고, 카티아와르 해안에 백여 개의 사원 흔적이 있다. 8세기 아랍의 해상 습격이 이어지다(「무함마드 이븐 카심의 신드 정복과 차치 왕조의 끝(711~714)」 이후) 마이트라카는 8세기 후반 사라지는데 그 끝을 직접 적은 사료가 없고 아랍 침입과 이어 붙이는 후대 전설만 있다. 끝 해는 767·776·783년 등으로 갈린다. 가문 이름 마이트라카는 '미트라(태양신)를 섬기는 이들'에서 왔다는 설이 있고, 발라비 동판은 땅 하사 기록이 풍부해 이 왕조의 행정을 복원하는 중요한 사료다. 카티아와르 해안의 항구는 서아시아·아프리카와의 교역로이기도 했다."
  subjects: [maitraka-dynasty, gupta-empire, vardhana-dynasty]
  tags: [politics, culture, religion]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)"]

- id: vakataka-harishena-475
  year: 475
  endYear: 510
  title:
    ko: "바카타카의 하리세나와 아잔타(475~510)"
  summary:
    ko: "바카타카 왕조는 빈디야샥티(250년 무렵)가 일으킨 데칸 왕조로, 그의 아들 프라바라세나 1세(270~330 무렵)가 영토를 크게 넓히고 유일하게 '삼라트(황제)'를 칭했다. 그 뒤 왕가는 프라바라푸라-난디바르다나 계통과 바트사굴마(지금 와심) 계통으로 갈라졌다. 앞서 프라바바티굽타가 바카타카 루드라세나 2세의 왕비로서 아들들의 섭정을 맡은 일은 「찬드라굽타 2세와 서 크샤트라파의 정복(380~415)」에서 다뤘다. 마지막 큰 군주 하리세나(475년 무렵~500년 무렵)는 바트사굴마 계통의 왕으로, 아잔타 비문에 따르면 사방의 왕을 꺾었다고 하지만 이 넓은 정복은 범위가 불확실해 사료의 과장으로 보는 학자가 많다. 하리세나 시대에 그의 신하들이 후원해 아잔타(지금 마하라슈트라 아우랑가바드 근처)의 석굴 16·17·19·26번 같은 불교 사원과 승원이 이루어졌고, 아잔타 벽화는 불교 설화(본생담)를 그린 인도 회화의 대표작이다. 하리세나 뒤 두 명의 왕이 이어졌으나 이름이 분명하지 않고, 바카타카는 510년 무렵 끝난다. 끝은 『다샤쿠마라차리타』가 전하는 궁정 쇠락과 이웃 침입으로 설명되는데, 519년 카담바의 비문이 바카타카 패배를 암시하는 것으로 읽는다. 바카타카 동전은 하나도 알려지지 않았다. 아잔타는 기원전 2~1세기의 초기 석굴군과 5세기 후반의 후기 석굴군으로 나뉘며, 후기 석굴 공사가 480년대에 갑자기 멈췄다는 월터 스핑크의 설도 있어 바카타카 후원의 시기에 대해서는 학자마다 견해가 다르다. 바카타카의 동판은 대부분 땅 하사 문서로 산스크리트와 프라크리트가 섞여 있다. 하리세나 이후 두 왕의 이름은 알려지지 않았다."
  subjects: [vakataka-dynasty, kadamba-dynasty]
  tags: [culture, religion, politics]
  sources: ["Hans T. Bakker, The Vākāṭakas: An Essay in Hindu Iconology (Egbert Forsten, 1997)", "Walter M. Spink, Ajanta: History and Development (Brill, 2005–2009)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: rai-chach-489
  year: 489
  endYear: 632
  title:
    ko: "신드의 라이 왕조와 차치의 찬탈(489~632 무렵)"
  summary:
    ko: "인더스강 하류와 마크란 해안의 신드는 5세기 말부터 7세기 초까지 라이 왕조가 다스렸다고 전한다. 그러나 이 왕조에 관한 서술은 13세기 페르시아어 책 『차치나마』에 거의 전부 기대고 있고, 이 책은 잃어버린 아랍어 원본을 옮겼다고 주장하나 사실성은 논쟁이다. 비문이나 고고학 증거도 거의 없어 이 왕조 연대는 어림이다. 『차치나마』가 전하는 왕 순서는 라이 디와지(489년 무렵), 라이 사히라스 1세, 라이 사하시 1세, 라이 사히라스 2세, 라이 사하시 2세다. 사히라스 2세는 사산 제국의 키르만 총독이 이끈 침공에 맞서다 죽고 마크란을 잃었다고 하며. 마지막 왕 사하시 2세 때 브라만 출신 서기관 차치가 왕비 소흐만 데비와 가까워져 왕이 죽은 뒤 그 사실을 감추고 정적을 없애며 왕위를 이었다. 치토르의 마히라트가 사하시의 동생을 자처하며 쳤으나 차치가 일대일 싸움으로 죽였다고 전한다. 차치가 왕이 된 해는 632년 무렵(644년경 설도 있음)이다. 차치 왕조는 차치 뒤 그의 아우 찬다르·아들 다히르로 이어져 711년 아랍의 정복을 맞는다(「무함마드 이븐 카심의 신드 정복과 차치 왕조의 끝(711~714)」). 7세기 현장은 신드 왕을 수드라 출신으로 적어 『차치나마』와 사료가 다르다. 이 시기 신드는 불교·힌두교 세력이 함께 있었고 인더스강 교역로의 요충이었다. 『차치나마』는 차치가 왕이 된 뒤 마크란·카슈미르 변경까지 원정했다고 쓰고 도읍을 알로르로 적으나, 이 서술도 후대의 것이어서 땅의 범위를 확정하기는 어렵다. 13세기 알리 쿠피가 아랍어 원본을 페르시아어로 옮겼다고 서문에 적은 것이 『차치나마』의 유일한 완본이다."
  subjects: [rai-dynasty, chach-dynasty, sasanian-empire]
  tags: [politics]
  sources: ["Mirza Kalichbeg Fredunbeg, trans., The Chachnamah, an Ancient History of Sind (Commissioner's Press, 1900)", "Manan Ahmed Asif, A Book of Conquest: The Chachnama and Muslim Origins in South Asia (Harvard University Press, 2016)", "André Wink, Al-Hind: The Making of the Indo-Islamic World, vol. 1 (Brill, 1990)"]

- id: toramana-500
  year: 500
  endYear: 515
  title:
    ko: "토라마나의 인도 진출과 에란 전투(500~515)"
  summary:
    ko: "알촌 훈족은 박트리아와 간다라에서 인도 안쪽으로 들어왔고, 그 중심에 토라마나가 있다. 알촌의 '제1차 훈족 전쟁'은 496~515년으로 적히기도 한다. 그의 이름은 펀자브의 동전과 소금 산지(솔트 레인지)의 쿠라 비문에 보이고, 이어 말와 동부 에란(지금 마디아프라데시 사가르)의 멧돼지 상 비문이 '즉위 첫 해'를 적어 말와가 그의 손에 들어갔음을 보여 준다. 굽타 쪽에서는 비문이 바누굽타의 이름으로 510년에 에란에서 '큰 싸움'이 있었다고 적는다. 이 싸움에서 굽타 쪽이 졌을 것으로 보지만 비문이 결과를 분명히 쓰지는 않는다. 같은 시기 굽타는 푸루굽타 이후 부다굽타(476~495)·나라심하굽타(495~530 무렵)·바이냐굽타(507 무렵)로 이어졌고 군주 표시가 비문마다 갈려, 이 시기 굽타의 중앙 권력은 약해져 갔다(「스칸다굽타와 굽타의 동요(455~477)」). 515년 무렵에는 아울리카라의 프라카샤다르만이 토라마나를 이겼다고 리스탈 비문이 자랑한다. 이렇게 알촌의 진출은 한 번의 큰 정복이라기보다 변경을 흔드는 침입에 가까웠고, 그 아들 미히라쿨라 때 더 심해진다(「야쇼다르만과 미히라쿨라의 패배(528~540)」). 이 시기 중국 순례승 송윤이 520년 무렵 젤룸강 가에서 진을 친 미히라쿨라를 보고 적은 기록이 남아 있다. 그의 이름이 새겨진 동전에는 '샤히 자우블라' 같은 칭호가 보이고, 에란의 멧돼지(비슈누의 바라하) 상 비문은 그의 치세 첫해에 다냐비슈누가 사원을 바쳤다고 적는다. 이 비문들이 알촌의 중부 인도 진출을 보여 주는 가장 앞선 증거다. 토라마나가 인도 안으로 처음 들어온 알촌 군주인지는 확실하지 않아, 아버지 대의 침입이 앞섰을 가능성도 있다."
  subjects: [alchon-huns, gupta-empire, aulikara-dynasty]
  tags: [war, politics]
  sources: ["Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "D. C. Sircar, Select Inscriptions Bearing on Indian History and Civilization, vol. 1 (University of Calcutta, 1942)"]

- id: yashodharman-528
  year: 528
  endYear: 540
  title:
    ko: "야쇼다르만과 미히라쿨라의 패배(528~540)"
  summary:
    ko: "토라마나의 아들 미히라쿨라는 사칼라(지금 시알코트)를 도읍으로 삼은 알촌 훈족의 군주로, 인도 사료와 순례기가 가장 모질게 그리는 훈 왕이다. 중국 순례승 송윤은 520년 무렵 그를 만났고, 현장은 100여 년 뒤 그가 불교를 박해했다고 전하며 12세기 카슈미르의 연대기 『라자타랑기니』도 그의 잔혹함을 적는데, 이 서술들은 모두 한참 뒤의 기록이고 쓴 이의 입장이 들어가 있다. 괄리오르(지금 마디아프라데시)의 비문은 그를 '대지의 주인'으로 부른다. 528년 무렵(532년 무렵으로 보는 설도 있다) 말와의 야쇼다르만은 만다소르 근처 손다니에서 미히라쿨라를 꺾었다고 손다니 기둥 비문에 새겼고, 이 비문은 야쇼다르만의 영토가 갠지스와 인도양, 히말라야와 마헨드라산 사이에 미쳤다고 주장한다. 마가다의 '발라디티야'(나라심하굽타로 읽힘)도 미히라쿨라를 이겼다고 현장은 전한다. 이 싸움 뒤 미히라쿨라는 카슈미르로 물러났고, 알촌의 인도 쪽 점유는 줄어 542년 무렵에는 펀자브를 잃었다(「알촌 훈족의 쇠퇴와 사산·돌궐(542~565)」). 야쇼다르만은 아울리카라 계통으로 보이는데 그 이름은 손다니 비문과 몇 개의 비문에만 남아 있으며, 540년 무렵 아울리카라는 기록에서 사라진다. 야쇼다르만의 이름은 이후 비문에 보이지 않아 그의 패권은 한 세대를 넘기지 못한 것으로 읽는다. 굽타 땅의 뒷일은 「굽타 제국의 끝과 마우카리·후기 굽타(543~606)」가 다룬다. 손다니 비문은 그가 굽타 왕들도 누리지 못한 땅을 누렸고 훈의 미히라쿨라도 그에게 절했다고 자랑하나, 이는 승자 쪽 선전이므로 싸움의 규모를 이 비문만으로 재기는 어렵다. 손다니 비문과 만다소르 기둥 비문의 해를 환산하면 4년쯤 차이가 나서 학자마다 해가 갈린다. 야쇼다르만의 비문은 산스크리트 시문으로도 높이 평가된다."
  subjects: [alchon-huns, aulikara-dynasty, gupta-empire]
  tags: [war, politics]
  sources: ["Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Aurel Stein, trans., Kalhana's Rajatarangini: A Chronicle of the Kings of Kashmir (Constable, 1900)"]

- id: alchon-end-542
  year: 542
  endYear: 565
  title:
    ko: "알촌 훈족의 쇠퇴와 사산·돌궐(542~565)"
  summary:
    ko: "미히라쿨라가 손다니에서 진 뒤(528년 무렵) 알촌의 인도 쪽 땅은 줄어 542년까지 펀자브와 북인도 점유를 잃었다고 적는다. 12세기 카슈미르 연대기는 미히라쿨라를 카슈미르의 왕으로 적는다. 이어 인도 쪽에 남은 알촌은 간다라와 카슈미르에서 스리 프라바라세나(530~590년 무렵으로 적히는 인물, 토라마나의 아들이라는 설이 있다)를 거쳐 이름이 남는다. 이 시기 북쪽 박트리아에서는 큰 일이 일어났다. 557~565년 무렵 사산의 호스로 1세와 서돌궐 카간국(이스테미)이 손잡고 헵탈(에프탈, 알촌의 상위 세력)을 무너뜨려 아무다리야강 일대를 나눠 가졌다. 알촌이 이 싸움으로 곧바로 사라졌다고 하기는 어렵고, 565년 무렵을 끝으로 본다. 간다라와 카슈미르에는 알촌 계통의 소왕이 남아 625년 무렵 서돌궐이 카불·간다라를 차지할 때까지 이어진 것으로 전해진다(카불·간다라의 투르크계 정권은 「투르크 샤히와 아랍의 동진(665~745 무렵)」에서 이어짐). 훈이 지나간 자리에서 굽타와 지방 왕조가 약해지고 서북 인도에서는 사원·승원이 파괴되었다는 서술도 있는데, 이는 대부분 후대 불교 문헌이 전하며 얼마나 믿을 수 있는지는 학자들이 따로 논한다. 6세기 중엽 그리스 상인 코스마스 인디코플레우스테스는 인도 북부의 '흰 훈'(골라스)이 코끼리를 이천 마리나 거느린다고 적었는데 골라스를 미히라쿨라로 읽는 학자가 많다. 518~522년 무렵 간다라를 지난 중국 순례승은 이미 훈계 왕을 만났다고 적었다. 이 시기 간다라 불교 유적의 훼손과 방치를 훈의 침입과 연결하는 설명이 있으나 고고학 증거는 일정하지 않다. 이 장면은 사료가 적어 연대 폭이 크다."
  subjects: [alchon-huns, sasanian-empire]
  tags: [war, politics]
  sources: ["Hans T. Bakker, The Alkhan: A Hunnic People in South Asia (Barkhuis, 2020)", "Aurel Stein, trans., Kalhana's Rajatarangini (Constable, 1900)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: gupta-end-543
  year: 543
  endYear: 606
  title:
    ko: "굽타 제국의 끝과 마우카리·후기 굽타(543~606)"
  summary:
    ko: "굽타의 마지막 기록은 비슈누굽타의 다모다르푸르 동판(굽타력 224년, 542~543년)이다. 군주표를 따르면 나라심하굽타(495~530 무렵), 쿠마라굽타 3세(530~540 무렵), 비슈누굽타(540~550 무렵)로 이어지며 바누굽타·바이냐굽타 같은 군주는 계보상 자리를 두고 학자들이 갈린다(「토라마나의 인도 진출과 에란 전투(500~515)」). 이 중앙 계통이 끊긴 뒤 그 땅은 여럿으로 나뉘었다. 마가다 쪽에는 후기 굽타 왕조(크리슈나굽타·하르샤굽타·지비타굽타 1세·쿠마라굽타·다모다라굽타·마하세나굽타·마다바굽타 순으로 전해진다)가 있어 아프사드 비문의 아디티야세나(7세기 후반)까지 이어졌다. 갠지스 중류에서는 마우카리 왕조가 하리바르만(487년 비문)·아디티야바르만·이슈바라바르만을 거쳐 이샤나바르만(550~574 무렵으로 적히나 재위 끝을 560년 무렵으로 보기도 한다)에 이르러 '마하라자디라자'를 칭했다. 하라하 비문(554년)은 이샤나바르만이 안드라와 수리카를 이기고 가우다를 막았다고 적는다. 이 무렵 알촌 훈족은 펀자브를 잃고 물러나고 있었다(「알촌 훈족의 쇠퇴와 사산·돌궐(542~565)」). 이어 사르바바르만(574~586 무렵), 아반티바르만(서쪽 타네사르부터 동쪽 날란다까지 이름이 나옴), 마지막 군주 그라하바르만(600~605 무렵)으로 이어졌다. 마우카리와 후기 굽타는 서로 경쟁해 아프사드 비문이 후기 굽타의 승리를 전한다. 그라하바르만은 타네사르 푸샤부티 가문의 공주(하르샤의 누이)와 혼인해 동맹을 맺었으나 말와의 데바굽타에게 죽었다(606년 무렵). 그 뒤 마우카리 땅은 하르샤에게 넘어간다(「하르샤 바르다나와 카나우지의 제국(606~647)」). 마우카리의 아디티야바르만은 후기 굽타 하르샤굽타의 누이와 혼인해 한때 두 가문이 손잡았으나 곧 경쟁으로 돌아섰다."
  subjects: [gupta-empire, later-gupta-dynasty, maukhari-dynasty, alchon-huns]
  tags: [politics]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "D. C. Sircar, Select Inscriptions Bearing on Indian History and Civilization, vol. 1 (University of Calcutta, 1942)"]

- id: badami-chalukya-543
  year: 543
  endYear: 610
  title:
    ko: "바다미 찰루키아의 성립과 데칸 서부(543~610)"
  summary:
    ko: "바다미(바타피) 찰루키아는 카르나타카 북부 바다미를 도읍으로 543년 무렵 풀라케신 1세가 연 왕조다. 학자 다수는 이 가문이 카르나타카 토착이라고 보며 후대 비문이 말하는 아요디아 기원은 의심한다. 풀라케신 1세는 바타피 요새를 쌓았다. 아들 키르티바르만 1세(566~597 무렵)는 카담바의 바나바시, 콩카나의 마우리아, 알루파를 공격해 데칸 서부를 넓혔다. 카담바가 바다미 찰루키아에 눌려 지배권을 잃은 때는 540년 무렵으로 적거나 키르티바르만 1세 때로 적는 등 사료마다 갈린다(「카담바 왕조의 성립과 쇠퇴(345~540 무렵)」). 마히슈마티(나르마다강 가의 도시)의 칼추리 왕조는 550년 무렵 크리슈나라자가 일으켰고 아들 샹카라가나, 붓다라자로 이어졌는데, 붓다라자가 키르티바르만의 아우 망갈레샤 또는 풀라케신 2세에게 밀려 610년 무렵 이후 힘을 잃는다. 망갈레샤(597~609 무렵)는 형의 아들 풀라케신(2세)이 어린 틈에 왕위를 이었으나 조카와 싸우다 죽었다(609 또는 610~611년). 이 조카가 풀라케신 2세다(「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」). 이 시기 찰루키아는 힌두교·자이나교·불교를 모두 후원했고 아이홀레·바다미·파타다칼에서 석굴과 사원이 만들어지기 시작한다. 비문은 카나다어와 산스크리트어로 썼다. 바다미 절벽의 풀라케신 1세 비문(사카력 465년, 543년)이 이 가문의 가장 앞선 기록이고, 비슈누에게 바친 바다미 3호 석굴은 망갈레샤 때인 578년에 봉헌되었다고 한다. 도읍 바다미는 붉은 사암 절벽 사이에 자리해 요새로 삼기 좋았고, 이후 아이홀레·파타다칼과 함께 찰루키아의 세 중심지를 이룬다."
  subjects: [badami-chalukya-dynasty, kalachuri-mahishmati]
  tags: [politics, war, culture]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: pallava-simhavishnu-575
  year: 575
  endYear: 642
  title:
    ko: "팔라바의 부흥: 심하비슈누에서 나라심하바르만 1세까지(575~642)"
  summary:
    ko: "5~6세기 팔라바는 동판이 드문 어두운 시기이고, 같은 때 타밀 남부는 칼라브라가 흔들었다고 전한다. 6세기 후반 심하비슈누(575~600)가 칼라브라를 꺾고 칼리강 부근까지 영토를 넓혀 팔라바를 일으켰다. 그의 아들 마헨드라바르만 1세(600~630)는 바위를 파서 사원을 만든 '지붕이 없는 사원'을 처음 도입했고, 희곡 『마타빌라사프라하사나』를 쓴 것으로 전해진다. 이 시기 북쪽에서 바다미 찰루키아의 풀라케신 2세가 팔라바를 공격해 칸치 근처 풀랄루르 전투가 승부 없이 끝났고 벵기를 잃었다(「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」). 마헨드라바르만의 아들 나라심하바르만 1세(630~668)는 풀라케신 2세를 몇 번 이겨 642년 무렵 바다미(바타피)를 점령했는데, 일시 점령이었고 풀라케신이 이 싸움에서 죽은 것으로 보인다. 나라심하바르만 1세는 이를 기념해 '바타피콘다'(바타피의 정복자)라 불렸다고 한다. 그는 마말라푸람(지금 마하발리푸람)의 바위 사원과 해안 석조 건축의 기초를 닦았고 스리랑카(아누라다푸라 왕국) 왕자 마나바르만을 도와 섬에 군을 보냈다고 전한다. 이 사이 군주는 심하비슈누, 마헨드라바르만 1세, 나라심하바르만 1세로 이어졌고 이어 마헨드라바르만 2세(668~670)·파라메슈바라바르만 1세(670~695)로 간다(「팔라바와 찰루키아의 다툼(655~746)」). 군주표 기준이고 학자마다 재위 해가 10~20년씩 다르다. 마헨드라바르만 1세는 처음 자이나교를 믿다가 시바파 성자 아파르(티루나부카라수)에게 감화되어 시바 신자가 되었다는 전승이 있고, 이 무렵부터 타밀 지방에서 신애(박티) 시가 퍼진다."
  subjects: [pallava-dynasty, badami-chalukya-dynasty, anuradhapura-kingdom]
  tags: [politics, war, culture]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: gauda-shashanka-600
  year: 600
  endYear: 637
  title:
    ko: "샤샹카와 가우다 왕국(600~637 무렵)"
  summary:
    ko: "샤샹카는 후기 굽타 왕 마하세나굽타 밑의 '마하사만타'(대신 영주)로 로타스가르의 도장에 이름이 남아 있으며 카르나수바르나(지금 서벵골 무르시다바드)를 도읍으로 삼아 가우다를 세웠다. 재위는 590~625·593~636·600~636년 등으로 갈린다. 영토는 방가에서 오리사 북부까지로 전해지며 이웃 마우카리·카마루파와 부딪쳤다. 『하르샤차리타』는 바나가 타네사르의 라지야바르다나를 속임수로 죽인 '가우다의 왕'을 말하는데 샤샹카를 가리키는 것으로 읽지만 직접 이름을 드러내지는 않는다(「하르샤 바르다나와 카나우지의 제국(606~647)」). 현장은 샤샹카가 보드가야의 보리수를 베어 불태우고 불교를 박해했다고 적고 12세기 문헌도 이를 말하지만, 모두 한참 뒤에 불교 쪽에서 쓴 글이어서 R. C. 마줌다르 같은 학자는 이 서술의 신빙성을 의심한다. 그의 이름이 오늘의 벵골력 시작과 관련있다는 전승은 있으나 확증은 없다. 샤샹카는 토지를 브라만에게 하사하는 굽타 관행을 이었고 힌두교를 후원했으며 동전도 발행했다. 637년 무렵 죽은 뒤 아들 마나바가 짧게 다스렸고 그 영토는 하르샤와 카마루파의 바스카라바르만이 나눠 가졌다. 샤샹카는 벵골 사람들 사이에서 벵골 통합을 시도한 첫 군주로 기억되기도 한다. 샤샹카의 금화에는 소 위에 앉은 시바와 락슈미가 새겨져 있고, 현장도 그의 도읍 카르나수바르나를 다녀갔다고 한다. 샤샹카를 가장 자세히 서술하는 『하르샤차리타』와 현장은 모두 그의 적수 쪽 사료이며, 그가 직접 남긴 글은 도장과 동전, 몇 장의 동판뿐이어서 평가는 조심스럽다. 죽은 해도 625·636·637년 등으로 갈린다."
  subjects: [gauda-kingdom, later-gupta-dynasty, maukhari-dynasty, kamarupa-kingdom]
  tags: [politics, war]
  sources: ["R. C. Majumdar (ed.), The History of Bengal, vol. 1 (University of Dacca, 1943)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: harsha-606
  year: 606
  endYear: 647
  title:
    ko: "하르샤 바르다나와 카나우지의 제국(606~647)"
  summary:
    ko: "하르샤(하르샤바르다나)는 타네사르(지금 하리아나)의 푸샤부티(바르다나) 가문 출신으로, 아버지 프라바카라바르다나가 죽고 형 라지야바르다나가 왕위를 이었으나 마우카리 그라하바르만(누이 라지야슈리의 남편)이 말와의 데바굽타에게 죽자(606년 무렵) 라지야바르다나가 원정에 나섰다가 가우다 왕에게 죽었다. 16세 무렵의 하르샤가 606년 왕위에 올라 누이를 구해 내고 마우카리 땅을 아울렀다(「굽타 제국의 끝과 마우카리·후기 굽타(543~606)」). 도읍은 카냐쿠브자(카나우지)로 옮겼다. 궁정 시인 바나바타는 전기 『하르샤차리타』를 지었고 하르샤 자신도 희곡 『라트나발리』·『나가난다』·『프리야다르시카』를 쓴 것으로 전하나 작자가 따로 있다는 설도 있다. 그의 판도는 북인도 대부분에서 나르마다강을 남쪽 끝으로 삼았다. 그는 남쪽으로 진출하려다 바다미 찰루키아의 풀라케신 2세에게 막혔고(612년 또는 618~619년 무렵, 「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」), 나르마다가 경계로 굳어졌다. 샤샹카가 죽은 뒤 가우다의 땅 일부를 얻었고(「샤샹카와 가우다 왕국(600~637 무렵)」), 동쪽에서는 카마루파 바스카라바르만과 동맹했다. 현장은 하르샤 궁정에 머물렀다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」). 하르샤는 시바 신자이면서 불교를 후원했고 카나우지와 프라야가에서 큰 법회를 열어 시주를 나눴다고 현장이 적는다(법회의 해는 사료마다 갈린다). 하르샤는 647년 죽었고 아들이 없어 대신 아루나슈바(아르주나)가 왕위를 잡으며 제국은 곧 흩어졌다(「하르샤 이후의 카나우지(647~740 무렵)」). 그의 제국은 중앙 집권이라기보다 여러 속왕이 하르샤에게 충성을 바치는 느슨한 연합이었다는 평가가 많다."
  subjects: [vardhana-dynasty, maukhari-dynasty, gauda-kingdom, kamarupa-kingdom, badami-chalukya-dynasty]
  tags: [politics, war, religion]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: pulakeshin-ii-610
  year: 610
  endYear: 642
  title:
    ko: "풀라케신 2세와 찰루키아의 데칸 제패(610~642)"
  summary:
    ko: "풀라케신 2세는 키르티바르만 1세의 아들로, 삼촌 망갈레샤가 왕위를 가로챈 뒤 싸움 끝에 609 또는 610~611년에 왕이 되었다(「바다미 찰루키아의 성립과 데칸 서부(543~610)」). 그는 반란을 꺾고 카담바의 바나바시를 끝냈으며 알루파·서 강가를 복속시켰고 콩카나 마우리아의 도읍 푸리를 차지했다. 가장 이름난 업적은 하르샤를 막은 것으로, 612년 또는 618~619년 무렵으로 읽는 학자들이 갈린다(「하르샤 바르다나와 카나우지의 제국(606~647)」). 현장도 하르샤가 찰루키아를 정복하지 못했다고 적었다. 동쪽으로는 칼링가와 다크시나 코살라를 누르고 비슈누쿤딘을 이겨 624년 무렵 아우 쿠브자 비슈누바르다나에게 벵기를 맡겼는데, 이 아우가 동 찰루키아의 시조다(「비슈누쿤딘의 성립과 팔라바·살란카야나(420~441 무렵)」). 이로써 벵기에서 비슈누쿤딘이 사라졌다. 남쪽으로는 팔라바 마헨드라바르만 1세와 풀랄루르에서 싸워 승부가 나지 않았다. 634년 라비키르티의 아이홀레 비문은 풀라케신 2세의 공적을 칭송하는 핵심 사료다. 알타바리는 그가 625년 무렵 사산의 호스로 2세에게 사절과 선물을 보냈다고 적는다. 현장은 641~642년 이 나라를 보고 군대와 전투 코끼리가 많은 강한 나라로 적었다. 642년 무렵 팔라바 나라심하바르만 1세가 바타피를 점령했고 풀라케신 2세는 이 싸움에서 죽은 것으로 보인다(「팔라바의 부흥: 심하비슈누에서 나라심하바르만 1세까지(575~642)」). 바다미 점령은 풀라케신의 손자 비크라마디티야 1세가 655년 무렵 되찾을 때까지 이어졌다고 전한다(「팔라바와 찰루키아의 다툼(655~746)」)."
  subjects: [badami-chalukya-dynasty, vishnukundin-dynasty, eastern-chalukya-dynasty, pallava-dynasty, vardhana-dynasty, sasanian-empire]
  links:
    - { from: badami-chalukya-dynasty, to: vishnukundin-dynasty, note: "풀라케신 2세가 벵기를 빼앗고 아우에게 맡김 (624 무렵)" }
  tags: [politics, war, diplomacy]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역", "C. E. Bosworth, trans., The History of al-Ṭabarī, vol. 5: The Sāsānids, the Byzantines, the Lakhmids, and Yemen (State University of New York Press, 1999)"]

- id: kamarupa-350
  year: 350
  endYear: 650
  title:
    ko: "카마루파의 바르만 왕조: 푸시야바르만에서 바스카라바르만까지(350~650 무렵)"
  summary:
    ko: "카마루파는 브라마푸트라강 유역의 아삼에서 처음 나타난 역사 시대 왕국이다. 이름은 사무드라굽타의 「알라하바드 기둥 비문」에서 조공을 바치는 변경 왕국으로 처음 나온다(「사무드라굽타의 정복과 알라하바드 기둥 비문(335~375)」). 바르만 왕조는 350년 무렵 푸시야바르만이 열었다고 하며, 이어 사무드라바르만·발라바르만·칼리야나바르만·가나파티바르만·마헨드라바르만·나라야나바르만을 거쳐 6세기에 부티바르만(마하부타바르만)·찬드라무카바르만·스티티바르만·수스티티바르만·수프라티슈티타바르만에 이르렀다고 후대 동판이 계보로 적는다. 도읍은 프라그조티시푸라(지금 구와하티 근처)였고 영토는 때에 따라 북벵골·부탄·방글라데시 일부까지 넓어졌다고 하나 전통적 경계는 후대 문헌에 기댄 것이어서 학자들이 조심스럽게 본다. 가장 이름난 왕 바스카라바르만(600~650 무렵)은 이웃 가우다의 샤샹카에 맞서 바르다나 왕조의 하르샤와 동맹했고(「샤샹카와 가우다 왕국(600~637 무렵)」, 「하르샤 바르다나와 카나우지의 제국(606~647)」), 니단푸르 동판에 가계를 새겼다. 현장은 643년 무렵 이 나라를 찾아 바스카라바르만을 만났다고 적는다. 바스카라바르만이 죽은 뒤 650년 무렵 바르만 계통이 끊기고 믈레차(살라스탐바 가문) 왕조가 이어받았는데, 이 왕조는 바르만과 혈연이 없는 것으로 읽힌다. 카마루파는 이후 10~11세기 팔라 계통을 거쳐 12세기에 작은 나라들로 나뉜다. 니단푸르 동판(지금 방글라데시 실헷)은 바스카라바르만이 미틸라 지방에서 온 많은 브라만에게 땅을 내려 준 일을 적어 이 시기 땅 하사로 이뤄진 이주를 보여 준다. 카마루파는 아삼의 오랜 토착 전통이 산스크리트 문화와 만난 첫 왕국으로 설명된다."
  subjects: [kamarupa-kingdom, gupta-empire, gauda-kingdom, vardhana-dynasty]
  tags: [politics]
  sources: ["Edward Gait, A History of Assam (Thacker, Spink & Co., 1906)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역", "Samuel Beal, Si-Yu-Ki: Buddhist Records of the Western World, vol. 2 (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: karkota-625
  year: 625
  endYear: 750
  title:
    ko: "카슈미르의 카르코타 왕조: 두를라바바르다나에서 랄리타디티야까지(625~750 무렵)"
  summary:
    ko: "카르코타 왕조는 카슈미르 골짜기에서 625년 무렵부터 855년까지 이어졌다. 12세기 칼하나가 지은 연대기 『라자타랑기니』가 주 사료로, 초기 연대는 믿기 어렵고 뒤로 갈수록 중국 사료와 맞는 점이 늘어난다. 전승상 시조는 두를라바바르다나(625년 무렵)이며 아들 두를라바카(프라타파디티야 2세)를 거쳐 찬드라피다(712~720)·타라피다(720~724 무렵)로 이어졌다. 현장은 630년 무렵 이 땅을 지나며(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」) 불교 승원이 많다고 적었다. 찬드라피다는 713년 우마이야 칼리프국의 침입에 맞서 당에 원조를 청했고 720년 당에서 '카슈미르 왕' 칭호를 받았다(「무함마드 이븐 카심의 신드 정복과 차치 왕조의 끝(711~714)」과 같은 때). 그의 아우 랄리타디티야 묵타피다(724~760)가 가장 이름난 왕이다. 『라자타랑기니』는 그가 카나우지의 야쇼바르만을 이기고 동쪽 벵골·남쪽 데칸까지 이르렀으며 토번과 서북 튀르크를 눌렀다고 서술하는데 얼마나 사실인지는 학자들이 갈린다. 혜초가 727년 무렵 카슈미르를 지났고(「혜초의 『왕오천축국전』」), 토번과의 관계는 「토번의 서쪽 진출과 서 히말라야(650~750 무렵)」에서 이어진다. 랄리타디티야는 마르탄드 태양 사원과 파리하스푸라 도시를 세운 것으로 전한다. 그의 사후 왕위 다툼으로 꼭두각시 왕이 이어지다 855년 무렵 아반티바르만이 우트팔라 왕조를 연다. 당 사료는 733년 카슈미르 왕 '무투오피'가 토번을 함께 치겠다며 사절을 보냈다고 적는데, 이를 랄리타디티야 묵타피다로 읽는 학자가 많다. 카르코타라는 이름은 뱀신(나가)의 이름에서 왔고 카슈미르의 나가 신앙과 이어진다."
  subjects: [karkota-dynasty, tibet, umayyad-caliphate, tang]
  tags: [politics, diplomacy]
  sources: ["Aurel Stein, trans., Kalhana's Rajatarangini: A Chronicle of the Kings of Kashmir (Constable, 1900)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역", "Samuel Beal, Si-Yu-Ki: Buddhist Records of the Western World, vol. 1 (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: turk-shahi-665
  year: 665
  endYear: 745
  title:
    ko: "투르크 샤히와 아랍의 동진(665~745 무렵)"
  summary:
    ko: "카불 골짜기와 간다라를 다스린 투르크 샤히는 알촌 훈족 뒤 이 땅을 이어받은 왕조다(「알촌 훈족의 쇠퇴와 사산·돌궐(542~565)」). 현장은 630년 무렵 이 땅을 지나며 불교가 쇠퇴했다고 적었다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」). 바르하 테긴(665~680)이 네작 훈 군인에서 올라 아랍 군을 아라코시아와 칸다하르까지 밀어냈다고 적는다. 이 왕조의 시작 해는 학설이 갈려 665년은 하나를 고른 것이다. 7세기 중엽부터 시스탄의 아랍 총독들(661년 뒤에는 우마이야 칼리프국의 총독들)이 카불과 자불리스탄을 거듭 공격했다. 673년 무렵 맺은 평화 조약이 투르크 샤히와 남쪽 자불(준빌) 왕조의 자리를 인정했고, 683년 아랍은 카불을 차지하지 못했으며, 698년의 큰 원정도 공물과 인질로 끝났다. 이어 테긴 샤(680~739)가 719~720년 무렵 당의 책봉을 받았다. 당이 이 지역을 658년부터 이름만 종주로 삼았던 일은 「당의 서역 진출: 고창 멸망과 안서도호부, 구자 정복과 안서 4진(640~649)」, 아랍 쪽 사정은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」이 다룬다. 프로모 케사로(739~745)는 아랍·사산 동전에 겹쳐 찍은 동전이 있어 아랍을 이겼다는 해석을 받는다. 당의 영향은 760년 무렵부터 줄었다. 아랍의 압박은 이후에도 이어지다 9세기 초에 투르크 샤히는 아바스 칼리프 마문의 군에 패배해 개종과 공물을 약속했고(814~815년), 822년 무렵 브라만 재상 칼라르가 왕위를 가져가 힌두 샤히가 시작된다고 알비루니가 적는다. 이 왕조의 동전에는 사산 양식의 왕관과 인도식 문양이 함께 보인다."
  subjects: [turk-shahi, umayyad-caliphate, tang]
  tags: [politics, war, diplomacy]
  sources: ["André Wink, Al-Hind: The Making of the Indo-Islamic World, vol. 1 (Brill, 1990)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Edward C. Sachau, trans., Alberuni's India (Trübner, 1888)", "Samuel Beal, trans., Si-Yu-Ki: Buddhist Records of the Western World (Trübner, 1884), 현장의 『대당서역기』 영역", "Samuel Beal, Si-Yu-Ki: Buddhist Records of the Western World, vol. 1 (Trübner, 1884), 현장의 『대당서역기』 영역"]

- id: tibet-west-650
  year: 650
  endYear: 750
  title:
    ko: "토번의 서쪽 진출과 서 히말라야(650~750 무렵)"
  summary:
    ko: "송첸감포가 토번을 세운 뒤(「송첸감포와 토번의 통일, 문성공주의 혼인(629~650)」) 토번은 7세기 중엽부터 서쪽으로 나아갔다. 먼저 서부 티베트의 장장(象雄)을 병합했고, 이어 발률로 불린 길기트·발티스탄 일대를 놓고 당과 다퉜다. 발률은 대발률(발티스탄)과 소발률(길기트)로 나뉘었고 토번이 7세기 후반부터 8세기 전반에 걸쳐 영향력을 넓힌 곳은 오늘의 라다크·발티스탄 쪽이다. 같은 때 카슈미르의 카르코타 왕 랄리타디티야도 서북 산악 지대에서 토번과 부딪쳤다고 『라자타랑기니』가 서술하며(「카슈미르의 카르코타 왕조: 두를라바바르다나에서 랄리타디티야까지(625~750 무렵)」), 당은 안서도호부와 소발률 원정으로 대응했다(「당과 토번의 화친과 전쟁: 금성공주의 혼인에서 장경 회맹까지(710~822)」, 「고선지의 서역 원정과 탈라스 전투(747~755)」). 남쪽 카트만두 분지에서는 리차비의 암슈바르만(605~641 무렵) 이후 토번이 네팔에 종주권을 행사했다는 전승이 있고, 송첸감포의 왕비로 네팔 공주 브리쿠티가 전해지나 사료는 후대의 티베트 문헌이다. 647~648년 당 사절 왕현책이 인도에서 곤경에 빠졌을 때 토번·네팔 병력이 도왔다고 중국 사료가 적는다(「하르샤 이후의 카나우지(647~740 무렵)」). 서 히말라야 남쪽 기슭의 쿠마온에는 700년 무렵 시작하는 왕가의 전승이 있으나 동판은 8세기 이후에야 확인된다. 토번의 서쪽 지배는 842년 무렵 분열로 끝나고(「랑다르마와 토번의 분열, 장의조의 사주 수복(838~851)」, 뒤의 사건) 그 자리에서 라다크 왕국이 일어난다. 라다크 일대에는 이 시기 티베트어 바위 비문과 암각화가 일부 남아 있다고 보고되어 토번이 이 땅에 오래 머문 흔적으로 읽힌다."
  subjects: [tibet, kumaon-kingdom, licchavi-kingdom, karkota-dynasty, tang]
  tags: [politics, war]
  sources: ["Christopher I. Beckwith, The Tibetan Empire in Central Asia (Princeton University Press, 1987)", "Mary S. Slusser, Nepal Mandala (Princeton University Press, 1982)", "Aurel Stein, trans., Kalhana's Rajatarangini (Constable, 1900)"]

- id: post-harsha-647
  year: 647
  endYear: 740
  title:
    ko: "하르샤 이후의 카나우지(647~740 무렵)"
  summary:
    ko: "하르샤가 647년 아들 없이 죽자 신하 아루나슈바(아르주나)가 왕위를 잡았다(「하르샤 바르다나와 카나우지의 제국(606~647)」). 이때 당의 사절 왕현책이 인도에 와 있었는데 아루나슈바가 사절단을 공격하자 왕현책이 토번과 네팔의 군대를 빌려 그를 사로잡아 장안으로 보냈다고 『신당서』 등 중국 사료가 적는다(648년 무렵; 토번 쪽은 「토번의 서쪽 진출과 서 히말라야(650~750 무렵)」). 이 일 뒤 바르다나 가문은 이어지지 못하고 카나우지는 한동안 주인이 불분명해진다. 마가다에서는 후기 굽타가 되살아나 아디티야세나(7세기 후반)가 '마하라자디라자'를 칭하고 아프사드 비문으로 가문의 계보를 새겼으며, 이어 데바굽타 2세·비슈누굽타·지비타굽타 2세로 이어졌다고 하나 연대는 학설에 따라 몇십 년 갈린다. 8세기 초 카나우지에는 야쇼바르만(700~740 무렵)이 일어나 731년 당에 사절을 보냈고, 궁정 시인 바크파티(『가우다바하』)와 바바부티(희곡)를 거느렸다. 카슈미르 카르코타 왕조의 랄리타디티야에게 졌다고 『라자타랑기니』가 적는다(「카슈미르의 카르코타 왕조: 두를라바바르다나에서 랄리타디티야까지(625~750 무렵)」). 이 시기를 흔히 하르샤 이후 북인도가 여러 지방 왕조로 흩어진 때로 보며, 그 뒤 카나우지를 놓고 팔라·프라티하라·라슈트라쿠타가 다투는 삼파전이 이어진다(「고팔라의 추대와 팔라 제국의 성립(750~770 무렵)」, 뒤의 사건). 혜초는 727년 무렵 카나우지를 지나며 중천축 왕이 코끼리 900마리를 거느렸다고 적었다(「혜초의 『왕오천축국전』」). 아디티야세나 때 새긴 아프사드 비문은 선대의 왕이 마우카리를 이겼다고 적어 앞 시기 두 가문의 다툼이 이어졌음을 보인다."
  subjects: [vardhana-dynasty, later-gupta-dynasty, karkota-dynasty, tibet]
  tags: [politics, diplomacy]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)", "Aurel Stein, trans., Kalhana's Rajatarangini (Constable, 1900)", "Han Sung Yang et al., The Hye Ch'o Diary: Memoir of the Pilgrimage to the Five Regions of India (Asian Humanities Press, 1984), 혜초의 『왕오천축국전』 영역"]

- id: pallava-chalukya-655
  year: 655
  endYear: 746
  title:
    ko: "팔라바와 찰루키아의 다툼(655~746)"
  summary:
    ko: "바다미를 팔라바에 빼앗긴 찰루키아(「풀라케신 2세와 찰루키아의 데칸 제패(610~642)」)는 풀라케신 2세의 아들 비크라마디티야 1세(655~680)가 되찾았다. 팔라바에서는 마헨드라바르만 2세(668~670)를 거쳐 파라메슈바라바르만 1세(670~695)가 이었는데 두 나라는 페루발라누르 등에서 싸웠고 양쪽 비문이 서로 승리를 자랑한다. 이어 찰루키아의 비나야디티야(681~696)·비자야디티야(696~733), 팔라바의 나라심하바르만 2세(695~728)로 이어졌다. 나라심하바르만 2세는 마말라푸람의 해안 사원(샤워 사원)과 칸치의 카일라사나타 사원을 지은 군주로 이름나 있다. 비크라마디티야 2세(733~746)는 740년 무렵 칸치를 차지했으나 사원을 해치지 않고 금품만 거두었으며 오히려 카일라사나타 사원에 선물을 바쳤다고 전한다. 이를 기념해 그의 왕비 로카마하데비가 파타다칼에 비루팍샤 사원을 세웠다. 팔라바는 파라메슈바라바르만 2세(728~731) 뒤 후계가 끊겨 난디바르만 2세(731~795)가 방계 카다바 가문에서 왕위에 올랐다. 이 사이 아랍을 막은 일은 「나가바타 1세와 프라티하라의 시작, 아랍 군을 막은 서인도(730 무렵)」에서 다룬다. 찰루키아의 마지막 왕 키르티바르만 2세(746~753)는 라슈트라쿠타의 단티두르가에게 지고(「단티두르가와 라슈트라쿠타 왕조의 성립, 바다미 찰루키아의 끝(753~774)」, 뒤의 사건), 팔라바는 9세기 말 촐라에게 무너진다. 이 두 나라의 다툼은 카나다 지방과 타밀 지방의 오랜 경쟁이 군사 대결로 나타난 모습이다. 비자야디티야는 파타다칼에 상가메슈와라 사원을 지었고, 이 지역의 사원들은 북인도식과 남인도식 건축이 어우러진 모습으로 지금 세계유산이다."
  subjects: [badami-chalukya-dynasty, pallava-dynasty, eastern-chalukya-dynasty]
  tags: [war, politics, culture]
  sources: ["K. A. Nilakanta Sastri, A History of South India (Oxford University Press, 1955)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: arab-sindh-711
  year: 711
  endYear: 714
  title:
    ko: "무함마드 이븐 카심의 신드 정복과 차치 왕조의 끝(711~714)"
  summary:
    ko: "아랍 군의 인도 접근은 636~637년 무렵 해안 습격에서 시작했고, 644년 라실 전투에서 신드 군이 아랍 군을 물리쳤으나 칼리프 우마르가 인더스강 건너기를 허락하지 않았다(「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」). 우마이야 칼리프국의 이라크 총독 알하자즈는 711년 무렵 사촌이자 사위인 청년 무함마드 이븐 카심을 신드로 보냈다. 계기를 『차치나마』는 데발 항구의 해적이 아랍 여성들을 잡아간 일로 서술하지만 이 서술은 13세기 책에 기댄 것이어서 사실성은 논쟁이다. 신드의 왕은 차치의 아들 다히르였다(「신드의 라이 왕조와 차치의 찬탈(489~632 무렵)」). 아랍 군은 먼저 마크란을 거쳐 데발을 포위해 함락했고, 712년 인더스강 가의 라와르(아로르 근처) 전투에서 다히르가 죽었다고 전한다. 이어 브라흐마나바드·알로르를 거쳐 713년 무렵 물탄까지 올랐고 아랍 사료(발라두리)와 『차치나마』가 이 과정을 서술한다. 정복 뒤 아랍 총독은 도시 주민에게 지즈야를 거두는 대신 불교·힌두 사원과 종교 생활을 보호하는 협약을 맺었다고 『차치나마』와 발라두리 계통의 사료가 전하며, 강제 개종과 사원 훼손 서술은 사료마다 갈려 한쪽 입장만으로 일반화하기 어렵다. 714~715년 알하자즈와 칼리프 알왈리드 1세가 죽고 새 칼리프 술라이만이 이븐 카심을 소환해 그는 돌아가는 길에 죽었다. 신드는 우마이야 총독이 이어 다스렸으나 동쪽으로의 확장은 곧 막혔다(「나가바타 1세와 프라티하라의 시작, 아랍 군을 막은 서인도(730 무렵)」). 아랍 사료는 정복한 지역을 '알힌드' 가운데 '신드'로 부르며, 뒤에 만수라 같은 새 도시가 신드의 중심이 된다."
  subjects: [chach-dynasty, umayyad-caliphate]
  links:
    - { from: umayyad-caliphate, to: chach-dynasty, note: "무함마드 이븐 카심이 신드를 정복 (711~713)" }
  tags: [war, politics, religion]
  sources: ["Mirza Kalichbeg Fredunbeg, trans., The Chachnamah, an Ancient History of Sind (Commissioner's Press, 1900)", "André Wink, Al-Hind: The Making of the Indo-Islamic World, vol. 1 (Brill, 1990)", "Manan Ahmed Asif, A Book of Conquest: The Chachnama and Muslim Origins in South Asia (Harvard University Press, 2016)"]

- id: pratihara-arabs-730
  year: 730
  endYear: 740
  title:
    ko: "나가바타 1세와 프라티하라의 시작, 아랍 군을 막은 서인도(730 무렵)"
  summary:
    ko: "신드를 차지한 우마이야 칼리프국은 총독 주나이드(723~726)가 구자라트·라자스탄·말와 쪽으로 원정을 보냈으나 725년 무렵 아반티(우자인 일대) 원정은 나가바타 1세에게 막혔다고 전한다. 주나이드의 성과는 후임 타밈(726~731) 때 잃었고, 알하캄(731~740)이 일부를 되찾았다. 735~736년 아랍은 마이트라카의 도읍 발라비와 난디푸리·바루치(브로치)를 습격했고(「발라비의 마이트라카 왕조(475~650 무렵)」), 738~739년에는 라타 찰루키아의 아바니자나슈라야 풀라케신이 나브사리에서 아랍 군을 크게 이겼다고 동판이 적는다. 740년 알하캄이 사우라슈트라 북부의 메드족과 싸우다 죽으면서 신드 동쪽에서 아랍의 진출이 끝났고, 743년까지 라자스탄과 구자라트의 정복지를 모두 잃었다. 이 방어에서 중심에 선 인물로 나가바타 1세(730년 무렵 ~ 760년 무렵)가 있다. 후대 괄리오르 비문은 그가 '믈레차(아랍)의 큰 군대'를 부쉈다고 자랑하며 프라티하라의 시작으로 본다. 프라티하라는 구르자라라고도 불렸으나 출신이 구르자라 부족인지 구자라트인지, 아니면 관직 이름에서 온 것인지는 학자들이 논쟁한다. 나가바타 1세는 아반티(우자인)를 거점으로 삼았다고 전하는데 일부는 비나말(라자스탄)을 처음 도읍으로 본다. 프라티하라는 이후 카나우지를 두고 팔라·라슈트라쿠타와 다투게 된다(「고팔라의 추대와 팔라 제국의 성립(750~770 무렵)」, 뒤의 사건). 전승상 메와르의 바파 라와르도 이 방어에 가담했다고 하나 사료는 후대의 구전이다(「메와르와 토마라의 성립 전승(734~736)」). 프라티하라라는 이름은 '문지기'를 뜻하며 가문이 라마의 아우 락슈마나의 후손이라는 신화와 이어진다."
  subjects: [gurjara-pratihara-dynasty, badami-chalukya-dynasty, maitraka-dynasty, umayyad-caliphate]
  tags: [war, politics]
  sources: ["André Wink, Al-Hind: The Making of the Indo-Islamic World, vol. 1 (Brill, 1990)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "R. C. Majumdar (ed.), The Classical Age (Bharatiya Vidya Bhavan, 1954)"]

- id: mewar-tomara-734
  year: 734
  endYear: 736
  title:
    ko: "메와르와 토마라의 성립 전승(734~736)"
  summary:
    ko: "라자스탄의 구힐라(구힐로트) 가문은 후대 전승에서 바파 라와르(카라보자)가 734년 무렵 모리 왕조의 치토르를 차지해 메와르의 시조가 되었다고 한다. 이 전승은 16~17세기 연대기와 구전에 기대고 있고, 구힐라 가문의 앞선 비문은 7세기 중엽 사몰리 비문과 10세기 아이트푸르 비문(977년)으로 이어지며 '바파'가 시조인지는 학자들이 의심한다. 전승은 바파가 8세기 전반 아랍 침입을 막은 일(「나가바타 1세와 프라티하라의 시작, 아랍 군을 막은 서인도(730 무렵)」)에 가담했다고도 한다. 토마라 가문은 하리아나 일대의 가문으로, 전승은 736년 무렵 아낭팔 토마르가 델리(딜리카)를 세웠다고 한다. 그러나 이 연대는 12세기 이후의 음유시인 서사시에 기대고 있어 믿기 어렵고, 토마라의 가장 앞선 기록은 9세기 후반 프라티하라 치세의 피호와 비문이다. 두 가문은 모두 프라티하라의 종주 아래 있었거나 지방 호족이었고(「나가바타 1세와 프라티하라의 시작, 아랍 군을 막은 서인도(730 무렵)」), 힘을 키워 큰 나라가 되는 것은 10~12세기다(뒤의 사건이 다룬다). 오늘날 라지푸트 가문의 기원 전승은 대개 이 8세기 무렵의 전란을 시조 이야기로 묶었다는 점에서 후대 가문 정체성이 만든 이야기가 섞여 있다고 보는 시각이 강하다. 라지푸트라는 이름은 '왕의 아들'(산스크리트 라자풋라)에서 왔고 이 이름이 하나의 사회 집단을 부르게 된 것은 대개 8~12세기 이후다. 가문 이야기가 불의 제단에서 태어난 시조(아그니쿨라) 신화를 타고 정리된 것은 중세 연대기 때다. 두 이야기 모두 8세기 전반의 군사 활동을 가문의 시작으로 잇는 서술 방식이 같다."
  subjects: [mewar-state, tomara-dynasty, gurjara-pratihara-dynasty]
  tags: [society, politics]
  sources: ["Rima Hooja, A History of Rajasthan (Rupa, 2006)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)"]

- id: bhauma-kara-736
  year: 736
  endYear: 750
  title:
    ko: "오리사 해안의 바우마카라 왕조(736 무렵)"
  summary:
    ko: "오리사(고대 오드라·우트칼라) 해안은 6~7세기 샤일로드바바 왕조가 칼링가 북부를 다스렸고 샤샹카에게 복속했다가 독립했다(「샤샹카와 가우다 왕국(600~637 무렵)」). 8세기에 그 자리를 이은 것이 바우마카라(카라) 왕조다. 이 왕조의 시작은 736년 무렵으로 전해지며, 이름 앞의 '바우마'(대지의 아들)는 가문의 칭호다. 동판에 이름이 남은 초기 왕으로 크셰만카라, 시바카라 1세, 수바카라 1세가 있고 여러 왕을 거쳐 9세기 중엽부터는 트리부바나마하데비 같은 왕비들이 직접 통치한 시기도 있어(단디마하데비는 10세기 초) 여성 군주가 기록되는 드문 왕조다. 영토는 지금의 쿠타크·푸리·발라소르·간잠 일대로 보며 도읍은 구헤슈와라파타카 등으로 전한다. 이 왕조는 불교를 깊이 후원해 라트나기리·우다야기리·랄리트기리의 대형 승원을 키웠고, 7세기 전반 현장은 오드라의 불교 승원을 적었다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」). 불교는 8~9세기 바우마카라 때 오리사에서 밀교(탄트라)와 섞여 번성했고 산스크리트 필사본과 청동 불상이 널리 만들어졌다. 왕조의 끝은 940년 무렵이며 소마바시가 오리사를 이어받는다. 이 왕조의 연대는 왕이 쓴 '카라력'이라는 독자 기년에 기대고 있어 서력으로 환산할 때 약 100년까지 어긋날 수 있다. 8세기 말 오리사 왕(시바카라 1세 또는 그 아들 수바카라 1세로 갈린다)이 당 덕종에게 『화엄경』의 마지막 장 「입법계품」 사본을 보냈고 795~798년 반야삼장이 이를 번역했다고 전한다(「당의 불교: 화엄·선·정토·밀교, 의정의 구법(650~845)」). 카라력의 기점은 736년으로 보는 설과 831년으로 보는 설(더 낫게 보는 학자도 있다)이 갈리며, 시작 해는 736년으로 적는다. 이 왕조의 불상과 필사본은 동남아와 티베트의 불교 미술에도 영향을 주었다고 본다."
  subjects: [bhauma-kara-dynasty]
  tags: [politics, religion, culture]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India (Pearson Education, 2008)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)"]

- id: anuradhapura-300
  year: 300
  endYear: 600
  title:
    ko: "아누라다푸라 왕국의 불교 전성과 『마하밤사』(300~600 무렵)"
  summary:
    ko: "스리랑카의 아누라다푸라 왕국은 기원전 4세기부터 이어진 싱할라 왕조의 도읍이다. 4세기 초 마하세나는 마하비하라파(대사파)와 맞선 아바야기리파를 도운 왕으로 전해지며 큰 저수지를 지었다. 그의 뒤를 이은 키르티 슈리 메가바르나(4세기)는 부처의 치아 사리가 인도 칼링가에서 건너온 때의 왕이라고 『마하밤사』는 적고, 사무드라굽타의 「알라하바드 기둥 비문」이 말하는 메가바르나가 이 왕과 같다고 읽는다(「사무드라굽타의 정복과 알라하바드 기둥 비문(335~375)」). 법현은 5세기 초 섬을 찾아 2년 가까이 머물며 아바야기리파의 승원과 치아 사리 행렬을 적었다(「법현의 천축 순례(399~412)」). 5세기 후반 다투세나(455~473 무렵)는 『마하밤사』 이야기가 전하는 왕으로 관개 시설을 정비했다고 하며, 아들 카샤파 1세(473~491 무렵이며 군주표에는 479~497로 적힌다)는 아버지를 죽이고 왕위를 가로챈 뒤 시기리야 바위산에 궁전을 지었다. 동생 모갈라나 1세가 돌아와 그를 꺾었다는 전승이 이어진다. 이에 앞서 328~455년 사이에는 붓다다사와 마하나마 같은 왕들이 이었고 429~455년 무렵에는 남인도에서 온 여섯 명이 차례로 왕위를 이었다고 하며, 팔라바 나라심하바르만 1세가 7세기 중엽 섬의 왕자 마나바르만을 도와 군을 보냈다는 전승도 있다(「팔라바의 부흥: 심하비슈누에서 나라심하바르만 1세까지(575~642)」). 5~6세기에 승려 마하나마가 정리한 『마하밤사』는 섬의 불교 역사를 담은 팔리어 시 연대기이며, 이 책의 서술은 마하비하라 쪽 입장이 강하다는 지적이 있다. 이 왕국은 촐라에게 점령되는 11세기까지 이어진다. 마하세나는 마하비하라파와 경쟁하는 아바야기리파를 도왔다고 『마하밤사』가 비판적으로 적고, 제타바나 승원도 그가 세웠다고 한다."
  subjects: [anuradhapura-kingdom, gupta-empire, pallava-dynasty]
  tags: [politics, religion]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Wilhelm Geiger, trans., The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "James Legge, trans., A Record of Buddhistic Kingdoms (Clarendon Press, 1886)"]
