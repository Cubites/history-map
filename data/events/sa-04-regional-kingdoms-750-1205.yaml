# 남아시아 사건 4차 묶음(sa-04): 지역 왕조들의 시대 — 팔라·프라티하라·라슈트라쿠타의 카나우지 다툼에서 구르 왕조의 북인도 진출까지 (750 ~ 1205년)
# 범위: 팔라 제국과 카나우지 삼파전, 라슈트라쿠타의 성립·전성·쇠퇴와 서 찰루키아, 프라티하라, 힌두 샤히와 가즈니 마흐무드의 원정, 신드·물탄의 에미르국, 카슈미르(우트팔라·로하라),
#   촐라의 부흥과 라자라자 1세·라젠드라 1세·쿨로퉁가 1세, 스리랑카의 촐라 점령, 파라마라·찰루키아·찬델라·토마라·차하마나·가하다발라, 세나·동부 강가·소마바시,
#   호이살라·야다바·카카티야·칼추리, 히마찰과 라다크·네팔 서부·마니푸르·쿠치·자이살메르·마유르반즈의 성립 전승, 타라인·찬다와르 전투와 바크티야르 할지의 동진, 아디 샹카라와 사원 건축.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다. 사료가 후대 전승뿐인 작은 나라의 성립은 '전승'임을 밝히고 한 사건 안에 합쳤다.
# 날짜: 모두 그레고리력이다. 연대기마다 해가 갈리는 일과 확실하지 않은 날짜는 '무렵'으로 적었다. 군주 재위는 위키백과 영어판 왕조 문서의 군주 목록을 따랐다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 차하마나는 '차하마나 왕조', 구자라트의 찰루키아는 '찰루키아 왕조'로 적어 데칸의 서·동 찰루키아와 구별했다.
#   사원 파괴·약탈·종교 시설의 일은 어느 쪽 시각도 따르지 않고 일어난 일과 주어, 사료의 성격, 숫자만 적었고, 숫자나 평가가 갈리면 범위나 두 학설을 함께 적었다. 원정과 약탈은 병합과 구별해 썼다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(랑다르마와 토번의 분열, 야쿠브 이븐 알라이스, 가즈니 왕조의 성립과 마흐무드, 카트완 전투와 가즈니 왕조의 끝, 델리 술탄국의 성립, 벵골의 라크나우티).

- id: pala-founding-750
  year: 750
  endYear: 770
  title:
    ko: "고팔라의 추대와 팔라 제국의 성립(750~770 무렵)"
  summary:
    ko: "8세기 중엽 벵골은 샤샹카 이후 오랜 혼란 속에서 군소 세력이 서로 다투는 마츠야니아야(물고기의 법칙, 큰 물고기가 작은 물고기를 잡아먹는 상태)에 놓여 있었다고 팔라 왕조의 동판 문서가 전한다. 이 문서에 따르면 750년 무렵 지역 수장들이 고팔라를 왕으로 추대했고, 이것이 팔라 제국의 시작이다. 고팔라 1세의 재위는 750~770년 무렵으로 적히나(750~783년으로 보는 설도 있다), 그의 출신이 군인 집안이라는 것 말고는 알려진 것이 적다. 뒤를 이은 다르마팔라(770~810 무렵)는 비하르와 벵골 서부를 굳히고 카나우지까지 세력을 뻗었다. 같은 때 서쪽에서는 나가바타 1세의 프라티하라 왕조가 말와와 라자스탄 일대를 차지하고 있었고, 남쪽에서는 곧 라슈트라쿠타 왕조가 일어나 팔라와 프라티하라를 모두 상대하게 된다. 한편 마가다에서 굽타 가문의 후손으로 이어진 후기 굽타 왕조는 8세기 중엽 뒤 사료에서 사라진다. 팔라는 불교를 후원한 왕조여서 다르마팔라가 비크라마실라 사원과 소마푸라 대사원을 세웠다고 전해지며, 날란다 사원과 함께 동인도 불교 학문의 중심이 되었다. 이 사원들에서 활동한 학승 가운데는 뒷날 티베트로 건너간 인물들이 있어 팔라 시대는 밀교 계통 불교가 티베트에 퍼지는 통로였다. 팔라의 연대는 학자마다 몇 해씩 다르며 재위는 마줌다르의 연표를 따른다. 고팔라가 어떻게 추대되었는지는 팔라 왕가의 동판 문서 말고는 전하는 것이 없고, 이 문서는 왕가가 스스로의 정통성을 알리려고 쓴 것이므로 혼란상이 과장되었을 수 있다는 지적이 있다. 같은 문서에 따르면 고팔라는 비하르와 벵골에 평화를 되찾아 주었다. 17세기 티베트 승려 타라나타만 고팔라가 오단타푸리 사원을 세웠다고 전한다. 팔라의 영역은 처음에는 벵골 일부와 비하르 동부에 그쳤다."
  subjects: [pala-empire, later-gupta-dynasty, gurjara-pratihara-dynasty]
  tags: [politics, religion]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "R. C. Majumdar (ed.), The History of Bengal, vol. 1: Hindu Period (University of Dacca, 1943)", "R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)"]

- id: rashtrakuta-753
  year: 753
  endYear: 774
  title:
    ko: "단티두르가와 라슈트라쿠타 왕조의 성립, 바다미 찰루키아의 끝(753~774)"
  summary:
    ko: "데칸 고원에서는 543년 풀라케신 1세가 바타피(지금 바다미)에 도읍을 정한 이래 바다미 찰루키아 왕조가 있었으나, 8세기 중엽에는 키르티바르만 2세 아래에서 약해져 있었다. 이 왕조의 봉신이던 라슈트라쿠타 가문의 단티두르가(재위 753~756)가 753년 무렵 키르티바르만 2세를 몰아내고 바다미 찰루키아 왕조를 끝냈으며, 이것이 라슈트라쿠타 왕조의 시작이다. 단티두르가는 말와의 우자인 쪽으로 세력을 넓히며 북쪽의 프라티하라 왕조의 나가바타 1세와도 부딪혔다고 전해지는데, 이 부분은 비문의 표현이 시적이어서 정확한 전과를 따지기 어렵다. 단티두르가는 후계 없이 죽었고, 큰아버지 크리슈나 1세(재위 756~774)가 뒤를 이었다. 크리슈나 1세는 남은 찰루키아 잔여 세력과 동 찰루키아를 누르고 데칸 서부의 주인이 되었으며, 엘로라에서 산을 위에서 아래로 깎아 내려가며 만든 거대한 카일라사나타 사원을 이때 짓기 시작했다고 전해진다. 이 사원은 힌두교 석굴 건축의 걸작으로 꼽히며 완성에는 여러 대에 걸친 시간이 걸렸다. 이어 고빈다 2세(774~780)가 즉위했으나 동생 드루바가 그를 몰아내고 왕위에 올랐다(780). 라슈트라쿠타는 이후 두 세기 가까이 데칸에서 북인도의 카나우지까지 군대를 보내는 큰 나라로 자랐고, 아랍 상인들은 이 왕조를 발하라라 부르며 세계에서 가장 큰 왕의 하나로 적었다. 라슈트라쿠타라는 이름은 지방 관리를 뜻하는 말에서 나왔다고 보며, 가문의 고향이 카르나타카 북부인지 마하라슈트라인지는 학자마다 의견이 갈린다. 이 왕조는 카나다어와 산스크리트어를 함께 공용어로 썼고, 도읍은 뒷날 마니야케타로 옮겨 간다."
  subjects: [rashtrakuta-dynasty, badami-chalukya-dynasty, gurjara-pratihara-dynasty, eastern-chalukya-dynasty]
  tags: [politics, war]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "A. S. Altekar, The Rashtrakutas and Their Times (Oriental Book Agency, 1934)"]

- id: tripartite-struggle-770
  year: 770
  endYear: 816
  title:
    ko: "카나우지를 둘러싼 팔라·프라티하라·라슈트라쿠타의 삼파전(770~816 무렵)"
  summary:
    ko: "굽타 왕조 이후 북인도의 중심이던 카나우지는 하르샤 이후 힘센 주인이 없었고, 8세기 후반에는 팔라 제국, 프라티하라 왕조, 라슈트라쿠타 왕조가 이 도시를 차지하려 거듭 싸웠다. 이를 삼파전이라 부른다. 프라티하라의 바트사라자(재위 780~800 무렵)는 벵골의 다르마팔라를 꺾었으나, 곧 라슈트라쿠타의 드루바(재위 780~793)가 북쪽으로 올라와 두 사람을 모두 물리치고 돌아갔다. 드루바가 물러난 뒤 다르마팔라(770~810 무렵)는 카나우지의 왕 인드라유다를 몰아내고 자기가 고른 차크라유다를 세웠다. 그러자 바트사라자의 아들 나가바타 2세(재위 800~833)가 차크라유다를 몰아내고 카나우지를 차지했으며, 문게르 부근에서 다르마팔라를 꺾었다고 비문이 전한다. 이어 라슈트라쿠타의 고빈다 3세(793~814)가 다시 내려와 나가바타 2세를 누르고 히말라야 기슭까지 이르렀으나 오래 머물지는 못했다. 비문들은 승리를 과장하고 패배를 적지 않으므로 어느 쪽이 얼마나 이겼는지 가늠하기 어렵다. 결국 816년 무렵 카나우지는 프라티하라 왕조의 도읍이 되었고, 이것이 이 싸움의 사실상 끝이다. 같은 무렵 서인도에서는 800년 무렵 라슈트라쿠타의 봉신으로 말와에 자리 잡은 우펜드라 크리슈나라자의 가문이 뒷날 파라마라 왕조라 불리게 되며, 구자라트 사우라슈트라의 발라비를 도읍으로 삼던 마이트라카 왕조는 8세기 후반(776년 무렵)에 쇠퇴하여 끊긴다. 마이트라카의 끝을 아랍의 침입 탓으로 돌리는 설이 있으나 사료로 확인되지 않는다. 삼파전의 승패는 비문마다 달리 적혀 있어, 이 싸움을 몇 번의 큰 전투로 읽기보다 한 세기 가까이 이어진 원정과 반격의 연속으로 보는 편이 맞다. 카나우지를 쥔 나라가 갠지스 평원의 교역로를 장악할 수 있다는 점이 싸움의 동기였다고 한다."
  subjects: [pala-empire, gurjara-pratihara-dynasty, rashtrakuta-dynasty, maitraka-dynasty, paramara-dynasty]
  tags: [politics, war]
  sources: ["R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: adi-shankara-800
  year: 800
  endYear: 820
  title:
    ko: "아디 샹카라와 아드바이타 베단타, 케랄라의 체라 왕조(800 무렵)"
  summary:
    ko: "아디 샹카라는 케랄라 칼라디에서 태어났다고 전해지는 학승으로, 788~820년 설은 19~20세기 초에 널리 쓰였으나 지금 학계는 8세기 전반 무렵에 활동했다고 본다. 그는 우파니샤드와 『브라마수트라』, 『바가바드 기타』에 주석을 달아 브라만과 아트만이 하나라는 불이일원론(아드바이타 베단타)을 체계화했다. 세상은 마야, 곧 무지에 가려진 겉모습이고 참된 실재는 하나뿐이라는 것이 핵심이며, 이 입장은 뒷날 힌두 철학의 중요한 줄기가 되었다. 샹카라는 인도를 두루 다니며 불교 학승과 미맘사 학자들과 토론했다고 하고, 인도 사방에 승원(마트)을 세웠다는 전승은 그의 이름 아래 모인 교단이 전국적으로 자리를 굳혔음을 보여 준다. 같은 시기 인도 서남쪽 케랄라에서는 800년 무렵 마코타이(지금 코둥갈루르 부근 마호다야푸람)를 도읍으로 한 체라 왕조의 페루말들이 나라를 열었다고 전한다. 비문으로 확인되는 첫 왕은 스타누 라비 쿨라세카라(844~870)이다. 체라는 아소카 비문에 케랄라푸트라로 나오는 오랜 이름이지만 중세 체라 왕조는 쿨라세카라를 시조로 삼는 새로운 계보로 이해된다. 이 시기 체라는 아랍과 중국을 잇는 향신료 교역으로 번성했고, 항구에는 유대인과 시리아 기독교인, 아랍 상인의 공동체가 자리를 잡았다. 샹카라의 생몰 연대와 체라 건국 연대는 사료가 드물어 학자마다 크게 갈리므로 무렵으로 적는다. 샹카라의 이름으로 전하는 저작 가운데 어느 것이 그의 손에서 나왔는지는 문헌학자들 사이에 논의가 이어지고 있다. 그가 세웠다고 전하는 승원은 동쪽 푸리, 서쪽 드와라카, 남쪽 슈링게리, 북쪽 조티르마트에 있으며, 이 승원들은 뒷날 샹카라 계통 수도 교단의 조직 틀이 되었다. 케랄라의 체라는 같은 시기 타밀 땅의 판디아, 촐라와 이웃하면서 말라얄람어 문화의 바탕을 키웠다."
  subjects: [chera-dynasty]
  tags: [religion, society]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: hindu-shahi-822
  year: 822
  endYear: 878
  title:
    ko: "투르크 샤히에서 힌두 샤히로: 칼라르의 즉위와 사파르 왕조의 카불 점령(822~878 무렵)"
  summary:
    ko: "카불 골짜기와 간다라를 다스린 투르크 샤히는 665년 무렵부터 이어졌다고 하나 시작 해는 학설이 갈린다. 아랍 역사가들과 『라자타랑기니』는 822년 무렵 이 왕조의 마지막 왕을 브라만 재상 칼라르(칼라르팔라)가 몰아냈다고 전한다. 이렇게 시작된 왕조를 힌두 샤히라 부르며, 칼라르는 재위가 870년 무렵까지 이어진 것으로 본다. 뒤를 이은 사만타데바(870~902 무렵) 때에 이르러 사파르 왕조의 야쿠브 이븐 알라이스가 870년 카불을 차지하면서 샤히 왕가는 동쪽 간다라의 우디바하나푸라(지금 훈드)로 도읍을 옮겼다. 이 일은 「야쿠브 이븐 알라이스와 사파르 왕조(861~902)」(뒤의 사건)와 이어서 읽을 수 있다. 878년 무렵에는 랄리야가 카불 골짜기의 일부를 되찾았다고 하나 이 기록은 알비루니가 전하는 후대 전승이라 해석이 갈린다. 랄리야 뒤에는 카말라바르만(902 무렵~), 비마데바(921~964 무렵)가 이어 사이 군주로 적혀 있으나 이 글이 다루는 기간 밖이다. 힌두 샤히의 이름은 '힌두'를 믿는 왕조라는 뜻이 아니라 후대 무슬림 사료가 붙인 이름이며, 왕실은 힌두교와 불교를 함께 후원했다. 이 왕조의 영역은 훗날 파키스탄 서북부와 아프가니스탄 동부에 걸쳐 있어 중앙아시아에서 인도 평원으로 들어가는 관문 노릇을 했다. 샤히라는 말은 이란 계통의 군주 칭호 샤에서 왔으며 카불 샤히라고도 부른다. 이 지역은 불교가 번성하던 곳이어서 바미얀과 카불 일대에 불교 유적이 많았고, 샤히 왕실이 시바와 비슈누 신앙을 후원한 흔적은 은화와 조각, 사원 터에서 확인된다. 이들의 은화는 한 면에 말 탄 기사, 다른 면에 소를 새긴 모양이 널리 퍼졌다."
  subjects: [turk-shahi, hindu-shahi, saffarid-dynasty]
  tags: [politics, war]
  sources: ["Al-Biruni, Alberuni's India, trans. Edward C. Sachau (Trübner, 1888)", "Kalhana, Rajatarangini: A Chronicle of the Kings of Kashmir, trans. M. A. Stein (Archibald Constable, 1900)", "C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)"]

- id: pratihara-bhoja-831
  year: 831
  endYear: 885
  title:
    ko: "나가바타 2세 말년, 미히라 보자의 프라티하라와 아모가바르샤의 라슈트라쿠타(831~885)"
  summary:
    ko: "프라티하라 왕조의 나가바타 2세(재위 800~833) 때인 831년 무렵 난누카가 젝자카부크티(지금 분델칸드)에서 찬델라 왕조의 첫 왕이 되었는데, 찬델라는 처음에 프라티하라의 봉신이었다. 나가바타 2세와 그 아들 라마바드라(833~836)를 거쳐 836년 무렵 즉위한 미히라 보자(재위 836~885)는 이 왕조의 가장 강한 왕으로 꼽힌다. 괄리오르에서 나온 비문은 보자가 카나우지를 도읍으로 삼아 서쪽의 라자스탄과 구자라트, 동쪽의 비하르 경계까지 세력을 넓혔다고 적고, 팔라의 나라야나팔라(854~908)는 이 시기 마가다(비하르 쪽)를 잃었다고 한다. 보자는 비슈누 신앙을 후원하여 아디바라하(비슈누의 멧돼지 화신)라는 칭호를 썼으며 그의 은화에도 이 칭호가 새겨졌다. 아랍 상인 술라이만은 9세기 중엽 보고서에서 이 나라를 군대가 강한 왕국으로 소개하고 그 왕이 아랍을 적대한다고 적었다. 남쪽에서는 라슈트라쿠타의 아모가바르샤 1세(814~878)가 64년이라는 긴 재위 동안 나라를 이끌었다. 그는 왕궁을 마니야케타(지금 말케드)에 새로 짓고 카나다어 시학서 『카비라자마르가』의 저자로 이름이 붙어 있으며, 자이나교를 후원하여 학승 지나세나를 곁에 두었다고 전한다. 동 찰루키아와 서 강가를 통제하려는 싸움도 이어졌다. 보자 아래 프라티하라는 라슈트라쿠타와 팔라 양쪽을 막아 냈으나 그의 아들 마헨드라팔라 1세(885~910) 때부터 변경의 봉신들이 서서히 자립하기 시작했다. 프라티하라를 구르자라라 부르는 이유로는 이 왕조가 구자라트와 라자스탄 서부(구르자라트라)에서 일어났기 때문이라는 견해가 있으며, 같은 이름의 구르자르 집단과의 관계는 학자들이 논쟁해 왔다. 보자 시대 카나우지는 동서 교역로의 중심에 있는 큰 도시였다. 보자의 영역은 서쪽으로 신드의 아랍 세력과 맞닿았고, 아랍 쪽 사료는 그를 이슬람 세력의 가장 큰 적으로 여겼다고 한다. 보자의 통치 말년에는 팔라의 반격과 라슈트라쿠타의 압박이 겹쳤다."
  subjects: [gurjara-pratihara-dynasty, rashtrakuta-dynasty, pala-empire, chandela-dynasty]
  tags: [politics, culture]
  sources: ["R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "A. S. Altekar, The Rashtrakutas and Their Times (Oriental Book Agency, 1934)"]

- id: habbarid-multan-854
  year: 854
  endYear: 855
  title:
    ko: "아바스 칼리프국의 신드와 물탄: 하바리 에미르국과 물탄 에미르국의 자립(854~855 무렵)"
  summary:
    ko: "711년 이후 신드와 물탄은 우마이야 칼리프국에 이어 750년부터 아바스 칼리프국의 속주였다. 총독은 칼리프가 보냈으나 9세기 중엽이 되면 칼리프의 권위가 약해져 총독들이 세습에 가까운 자치를 누렸다. 854년 칼리프가 우마르 이븐 압둘아지즈 알하바리를 신드 총독으로 임명했고, 그는 861년 이후 사실상 자립하여 만수라를 도읍으로 한 하바리 에미르국을 이루었다(만수라는 883년 도읍으로 정해진다). 이듬해인 855년 무렵에는 바누 문아비 가문이 물탄의 에미르가 되었고 861년 이후 자립하여 물탄 에미르국을 이루었다. 두 나라는 이름만 칼리프의 종주를 인정하는 지방 정권이었으며 이슬람 상인과 학자의 활동지였다. 이 시대의 신드와 물탄은 사료가 아랍 지리학자와 여행가의 기록에 크게 기대고 있다. 이븐 하우칼과 알마수디 등은 10세기에 물탄의 태양 신전과 거대한 금빛 신상을 이야기하는데, 이 신전은 물탄 에미르국의 수입원 노릇을 했다고 한다. 두 에미르국의 정확한 건국 연도와 왕통은 사료가 적어 확실하지 않다. 이후 물탄은 959~965년 무렵 파티마 칼리프국 계통 이스마일파의 지배 아래 들어갔고(태양 신전의 파괴는 10세기 말), 1010년 1010년 가즈니 왕조의 마흐무드에게 병합되며, 하바리는 1026년 무렵 마흐무드의 만수라 원정 뒤 소마라 왕조에 자리를 내준다. 두 나라의 뒷이야기는 「마흐무드의 인도 원정과 힌두 샤히의 끝(1005~1027 무렵)」에서 이어진다. 아바스 칼리프 알무타와킬(재위 847~861)의 시기였으므로 바그다드에서 멀리 떨어진 인더스 하류의 총독 임명은 실질적으로 어려웠다. 만수라는 아랍 지리학자들이 인더스 하부의 큰 도시로 소개한 곳이고, 물탄은 신드와 펀자브를 잇는 요충이자 순례와 교역의 도시였다. 9세기 중엽 이슬람 세계에서는 칼리프의 통제가 약해지며 지방 정권이 여럿 일어났는데, 이 두 에미르국은 그 가운데 인더스 유역에서 자립한 사례이다. 아랍 지리학자들의 기록 말고는 두 나라의 내부 사정을 알려 주는 자료가 거의 없다."
  subjects: [habbarid-emirate, multan-emirate, abbasid-caliphate]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kashmir-utpala-855
  year: 855
  endYear: 883
  title:
    ko: "카르코타 왕조에서 우트팔라 왕조로: 아반티바르만과 수야의 치수(855~883 무렵)"
  summary:
    ko: "카슈미르 골짜기는 625년 무렵 두를라바바르다나가 연 카르코타 왕조가 8세기에 랄리타디티야(재위 724~760 무렵) 아래 서쪽과 북쪽으로 원정군을 보낼 만큼 컸다. 그러나 9세기에는 왕위를 둘러싼 폭력적 다툼 끝에 힘이 빠졌고, 855년 무렵 재상 수라의 도움을 받은 아반티바르만이 왕위에 올라 우트팔라 왕조를 열었다. 카르코타가 끝나고 우트팔라가 시작된 것이다. 아반티바르만(재위 855~883)은 대외 원정이 거의 없었다고 전해지며, 대신 기술자 수야에게 일을 맡겨 제방과 수로를 고쳐 골짜기의 홍수와 흉작을 줄였다. 칼하나의 『라자타랑기니』는 수야가 젤룸강의 흐름을 바꾸어 습지를 농지로 만들고 쌀값이 크게 떨어졌다고 적고 있어, 중세 카슈미르 농업 기반이 이때 놓였음을 보여 준다. 그의 아들 샹카라바르만(883~902)은 군사적으로는 구르자라 땅(펀자브 서북쪽)까지 원정했으나 무거운 세금과 약탈로 평판이 나빴고, 외국 원정길에서 죽었다. 그 뒤 902~939년 사이에는 짧은 재위와 어린 왕, 궁정 쿠데타가 이어져 틴트린이라 불린 근위병과 재상들이 왕을 갈아 치웠다. 우트팔라 왕조의 왕들은 이 때문에 사이 군주가 많고 재위가 짧으며, 이어지는 디다 여왕과 로하라 왕조의 이야기는 「디다 여왕과 로하라 왕조의 성립(980~1003)」에서 이어진다. 아반티바르만의 궁정에서는 시학자 아난다바르다나와 시인 라트나카라가 활동했다고 전하며, 카슈미르에서는 이 무렵 샤이바 철학과 시학이 자랐다. 이는 카슈미르가 산스크리트 학문의 중심으로 떠오르는 출발이 되었다. 골짜기의 쌀 수확이 늘면서 세금 수입이 커졌고, 아반티바르만은 자기 이름을 딴 도시 아반티푸라를 세웠다고 전한다. 수야의 제방과 수로가 이런 도시 건설의 바탕이 되었다고 본다."
  subjects: [karkota-dynasty, utpala-dynasty]
  tags: [politics, economy]
  sources: ["Kalhana, Rajatarangini: A Chronicle of the Kings of Kashmir, trans. M. A. Stein (Archibald Constable, 1900)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)"]

- id: licchavi-end-879
  year: 879
  endYear: 880
  title:
    ko: "리차비 왕국의 끝과 네팔 력의 시작(879 무렵)"
  summary:
    ko: "카트만두 골짜기를 다스린 리차비 왕국은 464년의 첫 비문 이후 마나데바와 암슈바르만 같은 왕들의 시대를 거치며 인도 북부와 티베트를 잇는 교역로의 요충이었다. 7세기 암슈바르만(605~641 무렵)은 리차비 왕 대신 실권을 쥐고 자기 이름으로 비문을 새겼으며 당과 티베트의 사신이 이 골짜기를 거쳐 오갔다. 그러나 8세기 후반부터 리차비 왕의 힘이 약해지고 귀족들이 실권을 쥐었으며, 879년 무렵 리차비 왕국은 끝나고 타쿠리 가문이 골짜기를 이어받았다. 같은 해(879/880) 10월부터 네팔 력(네팔 삼밧)이라는 새 달력이 쓰이기 시작했다. 이 달력은 오늘날에도 네와르 사람들이 쓰는 달력으로 그 기원 해에 대해서는 전통상 한 상인이 빚을 갚고 만든 달력이라는 이야기가 전하나 사료로 확인되지 않는다. 타쿠리 왕조의 라가바데바가 이 달력을 열었다는 설도 있다. 리차비가 끝난 뒤의 네팔은 비문이 적어 왕들의 이름을 이어 가기 어려운 시기이며, 골짜기 바깥의 산악과 테라이 평원에는 서로 다른 소국과 부족이 있었다. 리차비 왕국의 사료는 대부분 돌 비문이다. 창구 나라야나 사원의 464년 마나데바 비문이 날짜가 적힌 가장 이른 것으로 알려져 있고, 7세기 초에는 재상 암슈바르만이 실권을 쥐었다. 이 시기 네팔 공주 브리쿠티가 토번의 송첸감포에게 시집갔다는 전승이 있고, 불교가 티베트로 전해지는 길목이 되었다. 파슈파티나트와 창구 나라야나 사원의 뿌리도 이 시대에 있다. 9세기로 갈수록 왕의 이름 말고는 비문이 급격히 줄어드는데, 이것이 왕조의 쇠퇴를 보여 준다. 리차비 시기의 불교 사원과 힌두 사원, 석조 조각은 후대 네와르 예술의 바탕이 되었으며, 13세기에는 네와르 장인이 티베트와 중국에서 활동한 기록도 있다."
  subjects: [licchavi-kingdom]
  tags: [politics, society]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Mary Slusser, Nepal Mandala: A Cultural Study of the Kathmandu Valley (Princeton University Press, 1982)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: aditya-i-chola-871
  year: 871
  endYear: 910
  title:
    ko: "아디티야 1세와 촐라 왕조의 부흥, 팔라바 왕조의 끝(871~910 무렵)"
  summary:
    ko: "촐라 왕조는 상감 시대 이후 오랫동안 사료에서 사라졌다가 9세기 중엽 비자얄라야(재위 850~871 무렵)가 탄자부르를 차지하면서 다시 나타난다. 그의 아들 아디티야 1세(재위 871~907)는 당시 타밀 땅을 나눠 가진 두 세력인 팔라바 왕조와 판디아 왕조 사이에서 힘을 키웠다. 아디티야는 처음에 팔라바의 아파라지타 왕을 도와 판디아와 싸웠으나, 897년 무렵 아파라지타를 직접 꺾고 톤다이만달람(지금 칸치푸람 일대)을 차지했다. 이로써 3세기 말 이래 이어진 팔라바 왕조는 끝났다. 아디티야는 서쪽의 콩구 지역도 판디아에게서 빼앗았다고 비문이 전한다. 이어 아들 파란타카 1세(재위 907~955)가 즉위했고, 910년 무렵 판디아의 수도 마두라이를 차지하여 마두란타카(마두라이를 무찌른 자)라는 칭호를 얻었다. 판디아 왕 라자심하 2세는 스리랑카로 달아났고, 촐라는 판디아 왕이 도움을 청해 온 스리랑카 군과도 싸웠다고 한다. 이후 판디아 땅은 한동안 촐라의 총독 아래에 놓여 이름만 남은 시기가 오래 이어진다. 판디아의 쇠퇴와 촐라의 부상은 이 시대 남인도 정치의 큰 흐름이며, 촐라는 곧이어 북쪽의 라슈트라쿠타와 맞서게 된다. 이 시기의 촐라는 관개 시설과 마을 회의 같은 지방 자치 제도를 갖춘 정착 농업 국가의 모습을 서서히 띠기 시작했다. 촐라가 중세 남인도의 큰 나라로 자라난 바탕에는 카베리강 삼각주의 풍부한 쌀농사가 있었다. 아디티야는 카베리강 가에 시바 사원을 많이 지었다고 하며, 이는 촐라 왕이 사원을 후원하는 오랜 전통의 시작으로 꼽힌다. 이 무렵 촐라가 지배한 영역은 카베리강 하류와 칸치푸람 일대로, 오늘날 타밀나두 중북부에 해당한다. 판디아는 마두라이를 중심으로 남쪽을 쥐고 있었다."
  subjects: [chola-dynasty, pallava-dynasty, pandya-dynasty]
  tags: [politics, war]
  sources: ["K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: indra-iii-kannauj-915
  year: 915
  endYear: 925
  title:
    ko: "인드라 3세의 카나우지 원정과 찬델라의 칼린자르(915~925 무렵)"
  summary:
    ko: "라슈트라쿠타 왕조의 인드라 3세(재위 914~929)는 즉위 직후 북쪽으로 대군을 보냈다. 당시 기록은 그가 915년 무렵 야무나강을 건너 프라티하라 왕조의 마히팔라 1세(재위 913~944)의 도읍 카나우지를 짓밟았다고 적는다. 마히팔라는 달아났고 카나우지는 한동안 약탈을 당했다. 그러나 라슈트라쿠타 군은 915~916년 무렵 카나우지를 짓밟고 한동안 머물렀을 뿐 이 도시를 다스린 흔적은 없고 곧 남쪽으로 돌아갔다. 마히팔라는 돌아와 카나우지를 되찾았으며, 비문은 여기에 봉신들, 특히 찬델라 왕조의 도움이 있었다고 말한다. 같은 해 무렵 바그다드 태생으로 말년에 이집트에 산 아랍 역사가 알마수디가 인도 서해안과 신드, 물탄을 둘러보고 프라티하라를 병력이 많은 나라, 라슈트라쿠타의 왕을 바다 건너까지 알려진 큰 나라의 왕으로 적었다. 이 사건 뒤 프라티하라는 변경 봉신들을 점차 통제하지 못하게 되었다. 925년 무렵에는 찬델라 왕조의 야쇼바르만(재위 925~950)이 칼린자르 요새를 차지했다고 보는 설이 있다. 야쇼바르만은 라슈트라쿠타의 습격으로 약해진 프라티하라 아래에서 사실상 자립에 가까운 위치를 얻었으며 카주라호의 락슈마나 사원(930~950 무렵)을 짓게 했다. 카나우지를 사이에 둔 팔라 제국, 프라티하라, 라슈트라쿠타의 세력 다툼은 9세기의 삼파전에 이은 한 장면이다. 알마수디의 『황금 초원』은 인도 왕국들을 소개하며 물탄과 만수라의 아랍 통치자들이 인도 왕들과 맺은 관계도 이야기한다. 인드라 3세가 북인도까지 올라간 일은 라슈트라쿠타의 힘을 보여 주었으나, 그가 죽은 뒤 왕위 다툼이 이어지며 힘을 잃어 갔다. 마히팔라 1세 아래 프라티하라는 카나우지를 되찾았지만 옛 영광으로는 돌아가지 못했다."
  subjects: [rashtrakuta-dynasty, gurjara-pratihara-dynasty, chandela-dynasty]
  tags: [war, politics]
  sources: ["R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)", "A. S. Altekar, The Rashtrakutas and Their Times (Oriental Book Agency, 1934)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: hill-kingdoms-920
  year: 920
  endYear: 930
  title:
    ko: "히마찰의 산지 왕국들과 라다크 왕국의 성립 전승(920~930 무렵)"
  summary:
    ko: "히말라야 서부 산악에는 평원의 큰 왕조와 떨어져 작은 왕국들이 골짜기마다 자리 잡고 있었다. 지금의 히마찰프라데시와 잠무 일대의 이런 나라들을 펀자브 산지 토후국들이라 묶어 부른다. 가운데 하나인 참바의 왕가는 전승에서 6~7세기 무렵 바르모르(브라흐마푸라)를 도읍으로 삼았다고 하는데, 920년 무렵 사힐 바르만이 도읍을 라비강 가의 지금 참바로 옮겼다고 전한다. 캉그라, 쿨루, 수켓 등 다른 소국들도 저마다 왕조 전승을 지녔으나 그 시작 연대는 후대 족보와 동판 기록에 의존하여 확실하지 않다. 이 산지 왕국들은 평원의 세력 변화에 따라 프라티하라, 가즈니, 델리 술탄국에 형식상 복속하거나 조공을 바치면서도 산악이라는 지형 덕에 내부 자치를 오래 유지했다. 같은 무렵 더 북서쪽에서는 토번 제국이 838년 무렵부터 분열한 뒤 그 왕가의 후손이라 하는 인물이 서쪽의 마르율(라다크)로 옮겨 왔다. 라다크 연대기는 니마곤이 서쪽으로 옮겨 왔고 그의 아들 팔기곤이 930년 무렵 마르율 왕국(라다크 왕조)을 세웠다고 전하며, 이 일은 「랑다르마와 토번의 분열, 장의조의 사주 수복(838~851)」(앞의 사건)과 이어서 읽을 수 있다. 니마곤 이후 라다크 왕가는 셰이와 틱세 등 인더스 상류 골짜기를 거점으로 삼았고, 이 왕국은 19세기 잠무 군에 정복될 때까지 이어졌다. 라다크의 초기 왕통은 후대 연대기에 기댄 것이어서 건국 연대는 학자마다 한두 세대씩 어긋난다. 산지 왕국들의 연대기 가운데 비교적 잘 보존된 것은 참바의 동판과 비문이며, 칼하나의 『라자타랑기니』도 이 산악 왕국들의 왕을 이따금 언급한다. 평원의 대왕조가 직접 다스리기 어려운 이 지대는 훗날 델리 술탄국과 무굴 제국에도 부분적으로만 복속되었다."
  subjects: [punjab-hill-states, ladakh-kingdom]
  tags: [politics]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Luciano Petech, The Kingdom of Ladakh, c. 950–1842 A.D. (Istituto Italiano per il Medio ed Estremo Oriente, 1977)", "J. Hutchison·J. Ph. Vogel, History of the Panjab Hill States (Government Printing, Lahore, 1933)"]

- id: somavamshi-940
  year: 940
  endYear: 950
  title:
    ko: "바우마카라 왕조의 끝과 소마바시 왕조의 오리사(940 무렵)"
  summary:
    ko: "오리사 해안의 토살리를 중심으로 한 바우마카라 왕조는 8세기부터 동판 문서에 나타나며, 불교와 시바 신앙을 함께 후원하고 여왕이 여러 차례 왕위에 올랐다는 점으로 이름이 높다. 이 왕조는 10세기 중엽 서쪽에서 내려온 소마바시 왕조에게 해안 지대를 내주고 사라졌다. 소마바시는 서오리사와 다크시나 코살라(지금 차티스가르)를 거점으로 삼아 일찍부터 성장하다가 940년 무렵 오리사 해안까지 세력을 넓혔다. 소마바시의 시작 해는 학자에 따라 9세기 말까지 거슬러 올라가기도 하며, 940년 무렵은 오리사 해안을 다스리게 된 때로 읽는다. 소마바시의 왕들은 시바 신앙을 후원하여 부바네슈와르에 많은 사원을 지었는데, 이 사원 건축은 오리사 양식의 완성으로 평가된다. 이들은 늘 동쪽의 동 강가, 남쪽의 촐라, 서쪽의 칼추리와 경쟁했으며, 11세기에는 촐라 라젠드라 1세가 북쪽으로 올라갈 때 이 지역을 지나갔다고 한다. 소마바시는 결국 12세기 초 동부 강가 왕조의 아난타바르만 초다강가에게 오리사 북부(우트칼라)를 내주었다. 이 일은 「동부 강가 왕조의 성장과 오리사 북부의 병합(1078~1135)」에서 이어진다. 바우마카라와 소마바시 사이 왕통의 사이 군주는 동판 문서가 드물어 완전히 복원되지 않았다. 바우마카라 왕조에서는 여성이 여러 대 왕위에 올랐다는 점이 이례적으로 평가된다. 동판 문서에 따르면 이들은 불교와 시바 신앙을 가리지 않고 후원했으며, 오리사 해안의 랄리타기리와 라트나기리 같은 불교 유적이 이 시기에 번성했다. 소마바시 왕조의 왕들은 코살라와 우트칼라 두 땅의 왕을 자처했고, 도읍을 야야티나가라(지금 비니카)에서 뒤에 오리사 해안 방면으로 옮겼다고 전한다."
  subjects: [bhauma-kara-dynasty, somavamshi-dynasty]
  tags: [politics, religion]
  sources: ["Hermann Kulke, Kings and Cults: State Formation and Legitimation in India and Southeast Asia (Manohar, 1993)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: mularaja-chaulukya-942
  year: 942
  endYear: 996
  title:
    ko: "물라라자와 찰루키아 왕조의 구자라트(942~996 무렵)"
  summary:
    ko: "구자라트 북부의 아나힐라파타카(지금 파탄)에서 942년 무렵 물라라자가 즉위하여 구자라트 찰루키아 왕조(솔란키 왕조라고도 한다)를 열었다. 그의 재위를 940~995년으로 적는 연표도 있다. 전승은 물라라자가 외삼촌 족속인 차프 가문의 왕을 몰아내고 즉위했다고 하며, 이 이야기는 후대 자이나교 연대기가 전하는 것이어서 세부는 확실하지 않다. 물라라자 이전에 이 지역은 프라티하라 왕조의 일부였고 구자라트 서쪽에는 라슈트라쿠타의 가지가 봉신으로 다스렸다. 프라티하라는 마히팔라 1세(913~944) 이후 급속히 약해져 마헨드라팔라 2세(944~948), 데바팔라(948~954), 비나야카팔라(954~955), 마히팔라 2세(955~956), 비자야팔라 2세(956~960)가 짧은 재위로 이어지며, 960년 무렵부터는 서쪽 가지와 라자스탄의 소국들이 자립하여 왕조는 카나우지 일대만 가진 작은 나라가 되었다. 물라라자는 이 틈에 북구자라트와 사우라슈트라 일부로 세력을 넓혔고 종교적으로 시바 신앙과 자이나교를 모두 후원했다. 그의 아들 차문다라자(재위 996~1008)가 뒤를 이었고 찰루키아는 11세기에 구자라트의 가장 큰 왕조가 된다. 구자라트 찰루키아는 사료 면에서 메루퉁가의 『프라반다친타마니』(1304년) 같은 후대 자이나교 문헌에 많이 기대어 있어, 물라라자의 즉위 과정과 외삼촌 살해 이야기는 설화적이다. 비문으로 확인되는 것은 그가 아나힐라파타카를 거점으로 북구자라트를 다스렸다는 정도이다. 한편 라자스탄 남부와 구자라트 사이 산악은 이 시기 소국과 호족으로 나뉘어 있었고, 사우라슈트라 반도에서는 해안 항구를 통한 교역이 이어졌다."
  subjects: [chaulukya-dynasty, gurjara-pratihara-dynasty, rashtrakuta-dynasty]
  tags: [politics]
  sources: ["Asoke Kumar Majumdar, Chaulukyas of Gujarat (Bharatiya Vidya Bhavan, 1956)", "R. C. Majumdar (ed.), The Age of Imperial Kanauj (Bharatiya Vidya Bhavan, 1955)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: rashtrakuta-decline-949
  year: 949
  endYear: 973
  title:
    ko: "타콜람 전투에서 라슈트라쿠타의 끝과 서 찰루키아의 자립(949~973)"
  summary:
    ko: "라슈트라쿠타 왕조의 크리슈나 3세(재위 939~967)는 이 왕조의 마지막 강한 왕이었다. 그는 남쪽의 촐라와 맞서 949년 타콜람에서 촐라의 왕자 라자디티야를 꺾었고(라자디티야는 코끼리 위에서 전사했다고 전한다) 촐라의 북쪽 땅 톤다이만달람을 차지했고 비문은 남쪽 라메슈와람까지 갔다고 주장한다. 그러나 촐라는 파란타카 2세와 그의 아들 아디티야 2세 아래에서 966년 무렵 북쪽 땅을 되찾았다. 크리슈나 3세가 죽고 코티가(967~972)가 즉위하자 라슈트라쿠타는 흔들렸다. 972년 말와의 파라마라 왕조 시야카 2세가 라슈트라쿠타의 도읍 마니야케타를 습격하여 약탈했다. 시야카는 이 일로 파라마라를 라슈트라쿠타의 봉신에서 독립 세력으로 올려놓았으나 말와 쪽에서는 나라를 차지하여 다스린 것이 아니었다. 마니야케타가 약탈된 뒤 즉위한 카르카 2세(972~973)는 봉신이던 타일라파 2세에게 밀렸고, 타일라파는 973년 무렵 자립하여 칼랴니를 도읍으로 서 찰루키아 왕조를 열었다. 군주표에는 그 뒤 인드라 4세(973~982)가 이름만 이은 것으로 오르나, 라슈트라쿠타의 실권은 973년 무렵 끝난 것으로 본다. 서 찰루키아의 타일라파 2세는 957년부터 재위한 것으로 적는 군주표가 있는데, 이는 봉신 시절을 포함한 연대로 보이며 종주권에서 벗어난 해는 973년 무렵이다. 파라마라 쪽에서는 시야카 2세(940~972)의 뒤를 이은 문자(972~990)가 칼랴니의 타일라파와 여러 차례 싸웠다. 라슈트라쿠타는 아랍 상인과의 교역에도 열려 있었고 서해안 항구로 통하는 길목을 쥔 나라였다. 두 세기 가까이 이어진 이 왕조가 사라진 뒤 그 영역은 서 찰루키아를 중심으로 이어지거나 여러 지방 세력으로 나뉘었다."
  subjects: [rashtrakuta-dynasty, chola-dynasty, paramara-dynasty, western-chalukya-dynasty]
  tags: [war, politics]
  sources: ["A. S. Altekar, The Rashtrakutas and Their Times (Oriental Book Agency, 1934)", "K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: chandela-dhanga-950
  year: 950
  endYear: 1002
  title:
    ko: "당가 시대 찬델라 왕조와 카주라호 사원, 중부 인도의 칼추리와 소마바시(950~1002 무렵)"
  summary:
    ko: "찬델라 왕조는 831년 무렵 난누카가 젝자카부크티(지금 분델칸드)에서 연 가문으로, 프라티하라 왕조의 봉신으로 출발했다. 야쇼바르만(재위 925~950)은 칼린자르 요새를 차지하고 락슈마나 사원을 짓게 했으며, 그의 아들 당가(재위 950~999)는 프라티하라가 약해진 틈에 스스로 왕의 칭호를 쓰며 사실상 독립을 선언했다. 괄리오르에서는 977년 카치흐파가타 가문의 바즈라다만이 프라티하라에게서 요새를 빼앗았는데, 이 가문은 당가와 비디아다라의 봉신이었다고 한다. 찬델라의 영향은 이 봉신 관계로 1035년 비디아다라가 죽을 때까지 미쳤고, 영향권에 든 시기는 950년 무렵부터 1000년 무렵까지 학설이 갈린다. 카주라호의 비슈바나타 사원은 당가 말년인 999년 무렵 봉헌되고 간다 때인 1002년 무렵 비문이 새겨졌으며, 이 일대 사원군은 나가라 양식 힌두 건축의 대표작으로 유명하다. 당가의 아들 간다(999~1002) 다음에는 비디아다라(1003~1035)가 이어 가즈니의 마흐무드와도 맞섰다. 같은 시기 중부 인도의 동쪽에서는 칼추리 왕가의 한 가지가 1000년 무렵 칼링가라자의 이끌림으로 라탄푸르에 터를 잡아 라탄푸르 왕국의 시작이 되었고, 다크시나 코살라의 소마바시 왕조는 오리사 쪽으로 중심을 옮기며 지방 세력으로 남았다. 프라티하라는 라자팔라(960~1018) 때에 이르러 분델칸드를 사실상 잃었고 괄리오르는 977년 카치흐파가타에게 넘어갔다. 이 시대의 사원 조각은 일부가 관능적인 장면으로 알려져 있으나 전체 조각 가운데 비중은 작고 대부분 신과 일상을 담는다. 칸다리야 마하데바 사원은 1030년 무렵 비디아다라 때의 것으로 꼽히는 큰 탑형 사원으로 수많은 조각이 새겨져 있다. 카주라호 사원군은 1986년 유네스코 세계유산에 올랐다. 찬델라 왕들은 시바 신앙과 비슈누 신앙을 함께 후원했으며, 카주라호에는 자이나교 사원도 있어 서로 다른 종교의 건축이 한 지역에 공존한다."
  subjects: [chandela-dynasty, gurjara-pratihara-dynasty, ratanpur-kingdom, somavamshi-dynasty]
  tags: [politics, culture]
  sources: ["Krishna Deva, Temples of Khajuraho in Central India (Ancient India 15, Archaeological Survey of India, 1959)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: didda-lohara-980
  year: 980
  endYear: 1003
  title:
    ko: "디다 여왕과 로하라 왕조의 성립(980~1003)"
  summary:
    ko: "카슈미르의 우트팔라 왕조는 10세기 초부터 어린 왕과 정변으로 약해졌고, 939년 수라바르만 2세가 몇 날 만에 쫓겨나며 왕통이 바뀌었다. 이 뒤 여러 왕이 짧게 이어진 끝에 크셰마굽타(재위 950 무렵~958)가 왕위에 올랐고 그의 왕비 디다가 실권을 쥐었다. 디다는 로하라 가문 출신으로, 남편이 죽은 뒤 아들 아비마뉴 2세(958~972)와 손자들의 섭정을 맡다가 980년 무렵부터 직접 왕으로서 카슈미르를 다스렸다. 칼하나의 『라자타랑기니』는 그녀를 권모술수에 능한 군주로 그리지만, 이 글은 12세기 중엽 궁정에서 적힌 것이어서 여성 지배자에 대한 편견이 섞였을 수 있다. 디다는 1003년 무렵 죽으며 조카 상그라마라자를 후계자로 세웠고, 이것으로 우트팔라 왕조는 끝나고 상그라마라자(재위 1003~1028)가 연 로하라 왕조가 시작되었다. 이 시기 카슈미르는 가즈니의 마흐무드에게서 침입을 받았으나 1015년과 1021년 두 차례 모두 로하라 요새 앞에서 저지되었다. 『라자타랑기니』는 1148년 무렵 칼하나가 산스크리트로 적은 연대기로 카슈미르 왕들의 계보를 전설 시대부터 12세기까지 이어 적었으며, 인도 사학사에서 연대기의 모습을 가장 잘 갖춘 중세 사료로 평가받는다. 로하라 왕조는 1339년 샤 미르가 왕위를 차지할 때까지 이어진다. 디다의 정치는 군사 지도자와 재상 사이의 균형 위에 있었고, 칼하나는 그녀가 손자들을 차례로 왕위에서 제거했다고 적었으나 이는 한 사람의 시각이다. 『라자타랑기니』에는 디다가 사원과 승원을 세운 일이 여러 차례 나온다. 이 같은 정변은 카슈미르 궁정이 근위병과 재상, 귀족 가문에 휘둘리던 구조를 잘 보여 준다. 로하라 왕조는 이후 14세기까지 이어진다."
  subjects: [utpala-dynasty, lohara-dynasty]
  tags: [politics, culture]
  sources: ["Kalhana, Rajatarangini: A Chronicle of the Kings of Kashmir, trans. M. A. Stein (Archibald Constable, 1900)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)"]

- id: jayapala-sabuktigin-986
  year: 986
  endYear: 1002
  title:
    ko: "자야팔라의 힌두 샤히와 가즈니의 사북티긴·마흐무드, 페샤와르 전투(986~1002)"
  summary:
    ko: "힌두 샤히 왕조의 자야팔라(재위 964 무렵~1001)는 간다라와 카불 골짜기의 동쪽, 곧 인더스강 서쪽에서 펀자브까지 걸친 나라를 이어받았다. 가즈니를 도읍으로 힘을 키운 튀르크 계통의 사북티긴(재위 977~997)이 동쪽으로 눈을 돌리자 두 세력이 부딪쳤다. 986~987년 자야팔라가 구자크 부근에서 사북티긴과 싸웠으나 연대기에 따르면 폭풍으로 형세가 샤히 쪽에 불리해졌고, 자야팔라는 강화를 청하며 배상금(100만 디르함과 전투 코끼리 50마리)과 변경 요새 일부의 양도를 약속했다. 그러나 약속이 지켜지지 않아 싸움이 되풀이되었으며, 자야팔라는 다른 라자들의 지원도 얻었다고 후대 연대기가 전하나 결국 라그만 일대를 가즈니에게 내주었다. 998년 사북티긴의 아들 마흐무드가 즉위했고, 자야팔라는 998~999년 무렵 라호르를 병합하여 펀자브 평원 쪽에서 세력을 지키고 있었다. 마흐무드는 1001년 가을(자료에 따라 9월 또는 11월) 페샤와르에서 자야팔라를 꺾고 포로로 잡았으며, 풀려난 경위는 몸값(25만 디나르와 코끼리 50마리라는 말도 있다)을 냈다거나 노예로 팔렸다는 말로 사료마다 갈린다. 인더스강 서쪽의 샤히 땅은 이로써 가즈니의 차지가 되었다. 자야팔라는 이 패배 뒤 왕위를 아들 아난다팔라에게 넘기고 죽었다고 하며, 이 같은 일을 겪은 왕은 불로 몸을 던졌다는 후대 전승도 있다. 가즈니 왕조의 형성은 「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(977년, 앞의 사건)에서, 이후 마흐무드의 인도 침공은 「마흐무드의 인도 원정과 힌두 샤히의 끝(1005~1027 무렵)」에서 다룬다. 힌두 샤히와 가즈니의 싸움은 종교 전쟁이라기보다 인더스강 서쪽 고원과 펀자브 평원을 놓고 이웃 나라 사이에 벌어진 영토 다툼의 성격이 강했다. 가즈니 군이 튀르크 노예 병사(굴람)에 크게 의지한 것과 달리 힌두 샤히는 코끼리 부대에 기대었다고 한다."
  subjects: [hindu-shahi, ghaznavid-empire]
  tags: [war, politics]
  sources: ["C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)", "Al-Biruni, Alberuni's India, trans. Edward C. Sachau (Trübner, 1888)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: rajaraja-985
  year: 985
  endYear: 1014
  title:
    ko: "라자라자 1세의 촐라 왕조 확장과 브리하디슈와라 사원(985~1014)"
  summary:
    ko: "촐라 왕조의 라자라자 1세(재위 985~1014)는 우타마 뒤를 이어 985년에 즉위한 것으로 보는데, 군주표에는 우타마의 재위가 987년까지로 적혀 즉위를 987년으로 읽을 수 있는 겹치는 표기도 있어 해를 하나로 못 박기는 어렵다. 그는 즉위 직후부터 남쪽과 서쪽으로 사방 원정을 벌였다. 케랄라의 체라 왕 바스카라 라비 바르만의 항구 칸달루르를 985년 무렵 공격했다고 전해지며 이것으로 체라는 촐라와 맞서는 처지에 놓였다. 판디아 왕조 쪽도 눌렀고, 서 강가 왕조의 강가바디(지금 남카르나타카)로 군대를 보내 1004년 무렵 도읍 탈라카드를 점령하여 이 왕조는 끝났다. 동쪽에서는 벵기의 동 찰루키아 왕가와 혼인 관계를 맺어 영향력을 넓혔고, 해군으로 말라바르 해안과 몰디브까지 갔다고 비문이 주장한다. 스리랑카 원정은 「촐라의 스리랑카 점령과 비자야바후 1세의 회복(993~1070)」에서 따로 다룬다. 라자라자는 정복한 땅을 촐라 본토와 같은 마을 단위 행정으로 묶었고, 토지를 조사하여 세금을 고정하는 일에도 힘썼다. 1010년 무렵에는 탄자부르에 시바에게 바치는 브리하디슈와라 사원이 완성되었다. 높은 탑 모양의 비마나와 벽의 비문으로 이름난 이 사원은 드라비다 양식 건축의 대표작으로 오늘날 유네스코 세계유산이다. 사원 비문은 라자라자의 정복과 사원에 바친 재물, 사원에서 일한 악사와 무희의 명단까지 적어 이 시대 사회사 사료로도 가치가 크다. 라자라자 1세의 이름이 새겨진 사원 비문과 헌납 명단은 촐라 국가가 중앙에서 마을까지 문서와 토지 측량으로 움직인 관료적 체제였음을 보여 준다. 그의 치세에 만든 주화는 스리랑카에서도 출토된다."
  subjects: [chola-dynasty, chera-dynasty, pandya-dynasty, western-ganga-dynasty, eastern-chalukya-dynasty]
  tags: [politics, culture]
  sources: ["K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "Burton Stein, A History of India (Blackwell, 1998)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)"]

- id: chola-lanka-993
  year: 993
  endYear: 1070
  title:
    ko: "촐라의 스리랑카 점령과 비자야바후 1세의 회복(993~1070)"
  summary:
    ko: "스리랑카의 북부 아누라다푸라 왕국은 기원전 4세기 이래 이어진 도읍을 갖고 있었으나 10세기 말에는 판디아의 침입과 내부 다툼으로 약해져 있었다. 촐라의 라자라자 1세는 992~993년 무렵 아누라다푸라를 차지하여 섬 북부를 촐라의 한 주로 삼고 폴론나루와를 새 중심으로 세웠다. 이 일은 영토를 합병한 것으로 읽힌다. 마힌다 5세는 섬 남부 루후나로 물러나 한동안 버텼으나 1017년 라자라자의 아들 라젠드라 1세가 루후나까지 군대를 보내 마힌다를 사로잡아 인도로 데려갔다. 이로써 아누라다푸라 왕국은 끝났고 섬 전체가 촐라의 지배를 받았다. 이 점령은 불교 사원의 재산에 큰 타격을 주었다는 연대기의 평가가 있으나 촐라 측 비문은 시바 사원을 세운 기록을 강조하여 두 사료의 관점이 크게 다르다. 1055년 루후나의 귀족 카시아파가 비자야바후라는 이름으로 왕위에 올라 촐라에 맞서 일어났고 1058년 무렵 남부를 굳혔다. 1066년 폴론나루와를 한 차례 차지했다가 물러난 뒤, 촐라에서 아디라젠드라가 암살되고 쿨로퉁가 1세가 즉위하는 혼란을 틈타 1070년 7개월간의 포위 끝에 폴론나루와를 되찾았다. 비자야바후 1세(재위 1055~1110)는 1072~1073년 무렵 아누라다푸라에서 대관식을 올리고 폴론나루와를 도읍으로 정했으며, 77년 만에 섬을 다시 하나로 묶었다. 이 나라는 뒷날 싱할라 왕국으로 이어진다. 촐라 점령기의 스리랑카 북부에서는 폴론나루와가 촐라 총독의 중심이 되었고 시바 사원이 세워졌다. 비자야바후는 승리 뒤 불교 교단의 비구 수계를 되살리기 위해 미얀마의 승려를 불러왔다고 『출라왕사』가 전한다. 촐라의 점령은 993년부터 1070년까지 77년 동안 이어졌다."
  subjects: [anuradhapura-kingdom, sinhalese-kingdom, chola-dynasty]
  tags: [war, politics]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "Culavamsa, trans. Wilhelm Geiger (Pali Text Society, 1929)"]

- id: mahmud-india-1005
  year: 1005
  endYear: 1027
  title:
    ko: "마흐무드의 인도 원정과 힌두 샤히의 끝(1005~1027 무렵)"
  summary:
    ko: "가즈니 왕조의 마흐무드(재위 998~1030)는 매해에 가깝게 인도를 쳤다고 전하지만, 원정과 약탈, 병합은 구별해야 한다. 1005~1006년에 이스마일파 아래의 물탄을 쳐서 이를 복속시켰고, 1008년 12월 31일 차치 전투에서 힌두 샤히의 아난다팔라가 이끄는 연합군을 꺾었다. 1010년 10월 마흐무드는 물탄을 가즈니에 병합하여 물탄 에미르국은 끝났다. 1014년에는 힌두 샤히의 트릴로차나팔라를 타우시강 부근에서 꺾었고, 이 왕조는 마지막 왕 비마팔라(1021~1026)에 이르러 1026년 가즈니에 병합되었다. 1018년 12월 20일 마흐무드는 마투라를 거쳐 카나우지에 이르러 프라티하라의 라자팔라가 달아난 도시를 약탈했고, 이 일로 프라티하라는 급속히 약해져 1036년 무렵 끊겼다. 1021년 라호르를 차지하여 가즈니의 총독이 다스리는 펀자브 지배가 시작되었다. 1025~1026년 마흐무드는 구자라트의 솜나트 사원을 습격했는데, 가즈니 측 기록은 사원의 우상을 부수고 재물을 가져갔다고 적고, 인도 쪽 사료와 근대 역사가들은 그 규모와 의미를 두고 해석이 갈린다. 이 습격은 지역을 병합한 것이 아니라 약탈이며, 같은 시기 구자라트의 왕 비마 1세는 이후 사원을 다시 짓게 했다. 1026년 마흐무드는 신드의 만수라를 쳐서 하바리 에미르국의 시대가 끝났고 소마라 왕조가 하부 신드를 이어받았다. 마흐무드의 궁정에서 일하던 학자 알비루니는 이 시대 인도에서 산스크리트를 배워 1030년 무렵 인도의 철학과 과학, 풍습을 기록한 책을 썼다. 인도의 도시와 사원이 재물을 모아 두었기에 약탈 목표가 되었다는 설명이 흔하며, 마흐무드의 원정이 가즈니의 자금과 군대 유지를 위한 면이 컸다는 해석도 있다."
  subjects: [ghaznavid-empire, hindu-shahi, multan-emirate, habbarid-emirate, soomra-dynasty, gurjara-pratihara-dynasty]
  tags: [war, politics]
  sources: ["C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)", "Al-Biruni, Alberuni's India, trans. Edward C. Sachau (Trübner, 1888)", "Romila Thapar, Somanatha: The Many Voices of a History (Penguin Books India, 2004)"]

- id: rajendra-1014
  year: 1014
  endYear: 1044
  title:
    ko: "라젠드라 1세의 갠지스 원정과 스리비자야 습격(1014~1044)"
  summary:
    ko: "라자라자 1세의 아들 라젠드라 1세(재위 1012~1044)는 아버지와 함께 다스리다가 1014년 홀로 왕위에 올랐다. 그는 먼저 남쪽으로 눈을 돌려 1017년 스리랑카 루후나까지 군대를 보내 섬 전체를 촐라의 지배 아래 두었고, 판디아와 체라를 눌러 남인도 끝까지 이르렀다. 이어 1020년대 초에는 군대를 북쪽으로 올려 오리사 해안을 거쳐 갠지스강에 이르러 벵골의 팔라 왕조 마히팔라 1세를 꺾었다고 비문이 주장한다. 이 원정은 갠지스 강물을 가져와 새 도읍의 우물에 붓기 위한 행사의 성격이 강했고, 라젠드라는 이를 기념해 강가이콘다촐라푸람(갠지스를 얻은 촐라의 도시)을 새 도읍으로 삼았다. 이 원정으로 땅을 병합해 다스린 흔적은 없다. 1025년 무렵에는 함대를 보내 말레이 반도와 수마트라의 스리비자야 여러 항구를 습격했다. 이 해양 원정도 영구 통치가 목적이 아니었으며, 원정의 이유로는 중국으로 가는 교역로 주도권 다툼이 자주 꼽힌다. 촐라 사료는 케다 왕을 포로로 잡았다고 적는다. 라젠드라의 아들 라자디라자(재위 1018~1054)는 아버지와 함께 다스리다가 서 찰루키아의 자야심하 2세, 소메슈바라 1세와 벵기 지배권을 두고 싸웠고, 1054년 코필 전투에서 전사한 것으로 전해진다. 이 시기 촐라는 서 찰루키아, 판디아 반란, 스리랑카의 저항이라는 여러 전선을 동시에 상대했다. 라젠드라 시대 촐라 해군의 원정은 동남아시아 교역과 얽혀 있었다. 강가이콘다촐라푸람의 큰 시바 사원은 1030년대에 지어진 것으로 전해지며 오늘날 유네스코 세계유산에 포함된다. 라젠드라의 비문은 그가 사로잡은 왕들과 빼앗은 보물의 목록을 길게 적었으나, 이런 기록은 왕이 스스로의 공적을 높이는 글이라 실제 규모는 가늠하기 어렵다."
  subjects: [chola-dynasty, pala-empire, western-chalukya-dynasty, srivijaya]
  tags: [war, politics]
  sources: ["K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)", "Hermann Kulke·K. Kesavapany·Vijay Sakhuja (eds.), Nagapattinam to Suvarnadwipa: Reflections on the Chola Naval Expeditions to Southeast Asia (Institute of Southeast Asian Studies, 2009)"]

- id: bhoja-paramara-1010
  year: 1010
  endYear: 1055
  title:
    ko: "보자 파라마라의 말와와 찰루키아·칼추리와의 다툼(1010~1055)"
  summary:
    ko: "파라마라 왕조는 문자(재위 972~990)와 신두라자(990~1010)를 거쳐 보자(재위 1010~1055)의 시대에 말와의 전성기를 맞았다. 보자는 다라(지금 다르)를 도읍으로 삼아 학문과 건축을 후원했다. 그는 시학서 『사라스와티칸타바라나』와 건축서 『사마랑가나수트라다라』를 지은 인물로 전해지고, 보자푸르의 큰 호수와 사원을 만들었다는 전승이 있으나 이들 작품이 모두 그의 손으로 나왔는지는 학자들이 의문을 제기한다. 서쪽에서는 구자라트 찰루키아 왕조의 비마 1세(재위 1022~1064)가 두를라바라자를 이어 즉위해 강한 이웃으로 자랐다. 1025~1026년 마흐무드가 솜나트를 약탈할 때 비마는 쿠치 쪽으로 피했다가 돌아와 사원을 다시 세웠고, 그의 시대에 마운트 아부의 딜와라 자이나 사원(1031)과 모데라의 태양 사원(1026~1027)이 지어졌다. 동쪽에서는 칼추리 왕조(트리푸리)의 강게야데바(1015 무렵~)가 다할라에서 일어나 북인도에서 칭호를 쓸 만큼 강해져 보자와 다투었다. 보자 말년이나 직후 비마 1세와 칼추리의 카르나가 협공하여 말와를 침입했고, 이 와중에 보자가 죽었다고 한다. 이어 자야심하 1세(1055~1070)와 우다야디티야(1070~1086)가 파라마라를 이었다. 한편 프라티하라 왕조는 1018년 카나우지를 잃은 뒤 쇠약해져 1036년 무렵 끊겼다. 북인도의 질서가 이렇게 흔들리는 사이 중부와 서부 인도는 찰루키아, 파라마라, 칼추리, 찬델라가 맞서는 구도로 짜였다. 보자의 이름은 오늘날 마디아프라데시의 도시 보팔(보자팔)과 보자푸르 지명에 남아 있다고 전해진다. 파라마라는 라슈트라쿠타의 봉신에서 벗어난 뒤 문자와 보자 시기에 영토가 가장 넓어졌다."
  subjects: [paramara-dynasty, chaulukya-dynasty, kalachuri-tripuri, gurjara-pratihara-dynasty]
  tags: [politics, culture]
  sources: ["Asoke Kumar Majumdar, Chaulukyas of Gujarat (Bharatiya Vidya Bhavan, 1956)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: kulottunga-1070
  year: 1070
  endYear: 1118
  title:
    ko: "쿨로퉁가 1세의 즉위와 동 찰루키아의 끝, 체라의 끝(1070~1118)"
  summary:
    ko: "1070년 촐라 왕 아디라젠드라(재위 1067~1070)가 암살되자 벵기의 동 찰루키아 왕가 출신 라젠드라가 쿨로퉁가 1세(재위 1070~1120)로 촐라 왕위에 올랐다. 그는 어머니가 라젠드라 1세의 딸인 촐라 외손이었다. 이때 동 찰루키아 왕조의 벵기는 촐라 왕에게 합쳐져 별도 왕조로서는 끝났다. 같은 해 스리랑카 쪽에서는 비자야바후가 촐라 군을 몰아냈고, 쿨로퉁가는 섬을 되찾지 못했다. 쿨로퉁가는 칼링가로 두 차례 군대를 보냈고, 서쪽에서는 서 찰루키아의 비크라마디티야 6세와 대립했으며, 남쪽의 케랄라에서는 12세기 초 체라 왕조가 마지막 왕 라마 쿨라세카라(1089~1122)의 시대에 촐라와 거듭 싸우다 베나드와 코친 같은 작은 나라들로 갈라졌다(왕국의 끝은 1102년 무렵으로도, 1124년 무렵으로도 적힌다). 1103년 무렵 촐라는 케랄라 일대의 직접 통제를 잃었다. 호이살라의 비슈누바르다나가 1116년 서 강가의 옛 땅 탈라카드를 촐라에게서 빼앗았고, 서 찰루키아는 1118년 무렵 벵기를 차지했다. 이처럼 쿨로퉁가 말년에는 라젠드라 1세 시대에 얻은 영토의 많은 부분이 떨어져 나갔으나 촐라는 타밀 본토를 지켰다. 쿨로퉁가의 시대에는 상인 조합이 타밀 땅 안팎에서 활동하며 상업이 번성했다. 쿨로퉁가는 토지를 새로 조사했다고 전하며 그의 비문에는 통행세를 없앴다는 뜻의 칭호가 따라붙는다. 쿨로퉁가 1세는 촐라와 동 찰루키아 두 왕가의 피를 이어 즉위가 정당한가를 둘러싼 논란이 있었고, 그의 집권으로 촐라 왕가는 후기 촐라라 부르는 새 계보로 이어졌다. 쿨로퉁가의 즉위로 이어진 촐라의 계승 다툼에는 판디아와 체라, 스리랑카의 저항이 겹쳤고, 그가 촐라 본토의 질서를 세우는 데는 여러 해가 걸렸다고 한다."
  subjects: [chola-dynasty, eastern-chalukya-dynasty, chera-dynasty, western-chalukya-dynasty, hoysala-dynasty]
  tags: [politics, war]
  sources: ["K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: pala-ramapala-1070
  year: 1070
  endYear: 1097
  title:
    ko: "카이바르타 반란과 라마팔라의 팔라 제국 회복, 세나·카르나타의 등장(1070~1097)"
  summary:
    ko: "팔라 제국의 비그라하팔라 3세(재위 1054~1072)는 서 찰루키아와 소마바시의 침입을 받고 동벵골에서 바르만 왕조가 일어나는 것을 막지 못했다. 마히팔라 2세(1072~1075)는 형제들을 가두고 억압하다가 북벵골 바렌드라의 카이바르타(어민 계통) 우두머리 디비아가 일으킨 반란에서 죽었다. 반란을 일으킨 디비아가 바렌드라를 차지했고 슈라팔라 2세(1075~1077)는 짧은 재위 끝에 죽었다. 이어 1077년 즉위한 라마팔라(재위 1077~1130)는 봉신 연합을 모아 바렌드라를 되찾고 라마바티를 새 도읍으로 삼았으며, 산디야카르 난디가 『라마차리타』를 써서 이 사건을 기렸다. 팔라는 이 회복으로 한 세대 더 지탱했지만 변경 봉신들은 이미 떨어져 나가고 있었다. 1070년 무렵 카르나타카 출신 사만타 세나가 서벵골 라르에 터를 잡아 세나 왕조의 뿌리를 놓았고, 1090년 무렵 가하다발라의 찬드라데바가 서쪽의 카나우지를 차지하면서 비하르 서부가 팔라의 손을 벗어났다. 1097년에는 미틸라(북비하르)의 카르나타 왕조가 난예데바 아래 시므라운가르를 도읍으로 삼고 일어나 팔라와 가하다발라 사이에 세력을 만들었다. 이후 팔라의 통치는 벵골 중부와 비하르 동부로 줄어들었고 라마팔라의 시기는 마지막 번영이었다. 『라마차리타』는 한 구절이 라마 신의 이야기와 라마팔라의 이야기를 동시에 뜻하는 이중 의미 시구로 쓴 산스크리트 작품으로, 팔라 후기의 사료 가운데 드물게 잘 보존된 것이다. 같은 시기 팔라 치하의 사원들, 특히 비크라마실라는 티베트와 교류하며 많은 학승을 길러 냈다. 라마팔라의 새 도읍 라마바티는 바렌드라 지방에 있었고, 이 지역은 뒷날 벵골의 이슬람 정권 중심 가운데 하나인 가우르와 가깝다."
  subjects: [pala-empire, sena-dynasty, karnat-dynasty, gahadavala-dynasty]
  tags: [politics, war]
  sources: ["R. C. Majumdar (ed.), The History of Bengal, vol. 1: Hindu Period (University of Dacca, 1943)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: tomara-delhi-1060
  year: 1060
  title:
    ko: "토마라 왕조의 델리(1060 무렵)"
  summary:
    ko: "델리와 하리아나 일대를 다스린 토마라 왕조는 전승으로 736년 무렵 시작한다고 하나 이 왕조를 가장 먼저 보여 주는 것은 9세기 말 프라티하라 시대의 페호와 비문이다. 이 비문은 토마라 가문의 고가를 프라티하라의 봉신으로 적고 있다. 프라티하라가 약해진 뒤 토마라는 10세기 무렵 델리 일대에서 독립된 소국이 되었다. 바르드(음유 시인)의 전승은 아낭가팔라 2세가 1052년 델리를 세웠다고 하며, 인근의 랄코트 요새도 아낭가팔라가 지었다고 전한다. 그러나 이 연대는 후대 전승이어서 델리 건설을 11세기 중엽 토마라의 사업으로 볼 수는 있어도 연도는 확실하지 않다. 토마라는 가즈니의 마흐무드가 펀자브를 병합한 뒤(1021) 가장 가까운 인도 쪽 이웃이 되었고, 서쪽의 차하마나 왕조와 동쪽의 가하다발라와 거듭 다투었다. 이 지역에는 프라티하라가 카나우지를 잃은 뒤 소국들이 나뉘어 있었고, 토마라는 11세기 중엽 델리 일대의 소국 가운데 하나였고, 이 무렵의 사정을 전하는 사료는 드물다. 12세기 중엽에는 차하마나의 비그라하라자 4세가 델리와 한시를 빼앗았고, 토마라 왕조는 이 무렵 끝난 것으로 본다. 토마라 가문에 관한 이야기는 델리의 이름 유래와 12세기 말 프리트비라자 3세 시기의 서사시에 많이 기대어 있다. 델리의 철기둥을 아낭가팔라 토마라가 지금 자리에 옮겨 세웠다는 전승이 있으나, 철기둥은 굽타 시대(4~5세기)의 것으로 보며 누가 언제 옮겼는지는 확실하지 않다. 랄코트의 성벽은 훗날 쿠트브 미나르 가까이에 남았다. 델리 일대의 이 시기 사료는 주화와 소수의 비문에 한정되며, 토마라가 어느 정도로 독립적이었는지는 학자마다 다르게 본다."
  subjects: [tomara-dynasty]
  tags: [politics]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "R. C. Majumdar (ed.), The Struggle for Empire (Bharatiya Vidya Bhavan, 1957)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)"]

- id: chahamana-ajmer-1100
  year: 1100
  endYear: 1164
  title:
    ko: "아지메르의 차하마나 왕조와 비그라하라자 4세의 델리(1100~1164 무렵)"
  summary:
    ko: "차하마나(차우한) 왕조는 삼바르 호숫가의 샤캄바리에서 일어난 가문으로, 12세기 초 프리트비라자 1세(1105~1110) 등 앞선 왕들을 거쳐 즉위한 아자야라자 2세(재위 1110~1135)가 도읍을 아자야메루(지금 아지메르)로 옮기면서 세력을 키웠다. 이 왕조가 아지메르를 근거지로 삼은 해는 연대기에 따라 몇 해 차이가 있다. 그의 뒤를 이은 아르노라자(1135~1150)는 토마라 영토를 침략하고 투르크 계통의 군대(가즈니의 바흐람 샤 군으로 보는 설이 있다)를 아지메르 부근에서 꺾었으나, 구자라트의 찰루키아에게는 패했다. 아르노라자는 아들 자가데바(1150)에게 살해되었다고 하며, 곧이어 비그라하라자 4세(재위 1150~1164)가 왕이 되어 이 왕조의 영토를 가장 넓혔다. 그는 델리와 한시를 토마라에게서 빼앗았다고 비조리아 비문이 전하지만 정확한 연도는 알 수 없고 1151년 무렵으로 보는 설이 있다. 이 왕은 학문도 후원하여 직접 희곡 『하리켈리 나타카』를 썼다고 하며, 아지메르의 옛 건물이 그가 세운 산스크리트 학교였다는 전승이 있다. 1164년 무렵에는 란탐보르 방면도 차하마나의 영역에 들었다고 본다. 아파라간게야(1164~1165)와 프리트비라자 2세(1165~1169), 소메슈바라(1169~1178)로 이어지는 사이 군주들은 짧은 재위로 알려졌고, 프리트비라자 3세(1177~1192)가 12세기 후반을 이끈다. 이 시기 차하마나는 서쪽으로 구자라트의 찰루키아, 동쪽으로 가하다발라, 남쪽으로 찬델라와 닿아 있었다. 차하마나 영역은 사막 가장자리의 소금 호수에서 나는 소금으로도 이익을 얻었고, 아지메르는 라자스탄의 주요 교통로에 있었다. 차하마나는 라지푸트 가문 가운데 가장 이름이 알려진 집안으로, 12세기 후반 프리트비라자 3세 때의 서사시가 후대에 큰 인기를 얻는다."
  subjects: [chahamana-dynasty, tomara-dynasty, chaulukya-dynasty]
  tags: [politics, culture]
  sources: ["Dasharatha Sharma (ed.), Early Chauhān Dynasties (S. Chand, 1959)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Rima Hooja, A History of Rajasthan (Rupa, 2006)"]

- id: vikramaditya-vi-1076
  year: 1076
  endYear: 1126
  title:
    ko: "비크라마디티야 6세 시대의 서 찰루키아 왕조와 『미탁샤라』(1076~1126)"
  summary:
    ko: "서 찰루키아 왕조는 973년 타일라파 2세가 칼랴니를 도읍으로 연 이래 자야심하 2세(1015~1042)와 소메슈바라 1세(1042~1068)를 거치며 촐라와 오래 싸웠다. 소메슈바라 2세(1068~1076)가 즉위한 뒤 동생 비크라마디티야 6세가 형을 몰아내고 1076년 왕위에 올랐다. 그의 재위 1076~1126은 반세기에 달하고 서 찰루키아의 전성기로 꼽힌다. 비크라마디티야는 스스로 찰루키아 비크라마 력(1076년을 첫해로 삼은 새 달력)을 만들어 쓰게 했다. 그의 궁정에서는 카슈미르 출신 시인 빌하나가 산스크리트 서사시 『비크라마앙카데바 차리타』를 썼고, 법학자 비즈냐네슈와라는 『야즈냐발키아 법전』의 주석 『미탁샤라』를 완성했는데 이 책은 뒷날 영국 식민지의 힌두 상속법에서도 널리 인용되었다. 정치적으로는 촐라의 쿨로퉁가 1세와 벵기·강가바디를 두고 싸웠고, 1118년 무렵 벵기를 차지했으며, 남쪽에서는 호이살라 왕조의 비슈누바르다나가 봉신으로 있으면서 자라나 1116년 탈라카드를 촐라에게서 빼앗았다. 비크라마디티야의 뒤는 소메슈바라 3세(1126~1138), 자가데카말라 2세(1138~1151)로 이어졌고, 소메슈바라 3세는 백과사전 『마나솔라사』로 이름이 있다. 이 시대에 카나다어와 텔루구어 문학이 궁정에서 자랐으며, 서 찰루키아 양식이라 부르는 사원 건축은 호이살라 사원으로 이어진다. 서 찰루키아의 칼랴니 궁정은 카나다어 문학의 후원처이기도 했으며, 이 왕조 시대에 서양 학자들이 찰루키아 양식이라 부르는 사원이 카르나타카 북부 곳곳에 세워졌다. 이타기의 마하데바 사원이 그 예로 꼽힌다. 서 찰루키아의 영토는 카르나타카 북부와 마하라슈트라 일부에 걸쳐 있었다."
  subjects: [western-chalukya-dynasty, chola-dynasty, hoysala-dynasty]
  tags: [politics, culture]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: eastern-ganga-1078
  year: 1078
  endYear: 1135
  title:
    ko: "동부 강가 왕조의 성장과 오리사 북부의 병합(1078~1135)"
  summary:
    ko: "동부 강가 왕조는 칼링가(지금 오리사 남부와 안드라 북부)에서 서 강가 왕조와 같은 뿌리라고 전하는 가문으로, 아난타바르만 초다강가(재위 1077 또는 1078~1150)가 아버지를 이어 1078년 왕위에 올랐다. 초다강가는 촐라와 동 찰루키아 계통의 피를 이었고, 칼링가에서 점차 북쪽으로 세력을 넓혔다. 1110년 무렵 그는 오리사 북부의 우트칼라를 소마바시 왕조에게서 차지했고, 이것으로 소마바시 왕조가 끝났다고 본다. 그 연도는 비문에 직접 적혀 있지 않아 12세기 초라는 폭으로 보는 학자도 있다. 같은 시대 오리사 북동부 마유르반즈에서는 1100년 무렵 아디 반자라는 인물이 왕조를 열었다고 전하는데, 이 전승은 후대 족보에 의존하여 확실하지 않다. 초다강가는 1135년 무렵 서벵골의 미드나포르 일대까지 세력을 뻗었다고 하며, 도읍을 칼링가나가라에서 카타카(지금 쿠타크)로 옮긴 것도 이 무렵으로 보는 설이 있으나 문헌이 연도를 적지 않아 확실하지 않다. 초다강가의 재위 동안 푸리의 자간나타 사원이 지어졌다고 하며 오늘날 이 사원은 오리사 건축과 신앙의 중심이다. 이 시기의 오리사는 동쪽의 세나, 북쪽의 팔라, 서쪽의 칼추리, 남쪽의 촐라 사이에 끼어 있었으나 해안과 내륙을 합쳐 큰 왕국을 이룬 것이 동부 강가의 성취다. 초다강가의 뒤는 카마르나바(1150~1156), 라가바(1156~1170), 라자라자 2세(1170~1190)로 이어졌다. 푸리의 자간나타 사원은 12세기 이후 오리사에서 비슈누 신앙이 자리를 굳히는 중심이 되었고, 해마다 열리는 수레 축제 라타 야트라는 오늘날까지 이어진다. 초다강가는 오래 재위했고 많은 비문을 남겼다."
  subjects: [eastern-ganga-dynasty, somavamshi-dynasty, mayurbhanj-state, sena-dynasty]
  tags: [politics, religion]
  sources: ["Hermann Kulke, Kings and Cults: State Formation and Legitimation in India and Southeast Asia (Manohar, 1993)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: gahadavala-kannauj-1090
  year: 1090
  endYear: 1114
  title:
    ko: "가하다발라 왕조의 성립과 카나우지(1090~1114 무렵)"
  summary:
    ko: "프라티하라 왕조가 1018년 카나우지를 잃고 1036년 무렵 끊긴 뒤 카나우지 일대는 한 세기 가까이 힘센 주인이 없었다. 1090년 무렵 찬드라데바가 카나우지를 차지하고 가하다발라(가하르와르) 왕조를 열었다. 찬드라데바는 카나우지와 바라나시(카시), 아요디아를 아우르는 갠지스 평원 중부를 거점으로 삼았고, 비문은 그가 투루슈카(튀르크계 무슬림)에게서 나라를 지켰다고 적는다. 이 왕조는 투루슈카 단다라 불린 세금을 거두어 가즈니 쪽 위협에 대비했다고 한다. 이 동판 기록들의 해석은 학자마다 달라 이 세금이 가즈니에 바치는 공물이었는지 방위 비용이었는지 확실하지 않다. 찬드라데바 뒤로 마다나팔라(1104~1114 무렵), 고빈다찬드라(1114~1155 무렵)가 이어졌다고 하나 이 부분의 재위 연대는 비문마다 조금씩 다르다. 가하다발라의 서진은 서쪽의 토마라와 차하마나, 남쪽의 칼추리, 동쪽의 팔라와 부딪쳤고 1090년 무렵 팔라는 비하르 서부를 가하다발라에게 내주었다. 이 왕조의 마지막 대왕 자야찬드라는 1194년 찬다와르에서 무함마드 구리에게 패했고, 이 일은 「찬다와르 전투와 가하다발라 왕조의 끝, 아지메르·바야나·괄리오르·안힐와라(1194~1197)」에서 이어진다. 찬드라데바 이후 가하다발라의 비문은 카시와 아요디아, 프라야가 같은 성지에서 베푼 시주를 많이 기록한다. 북인도 성지 순례의 중심지를 쥔 일은 이 왕조의 정당성과 재원을 떠받쳤다. 비하르 서부 샤르키 지역은 팔라가 잃은 뒤 가하다발라와 소국들이 나누어 가졌다. 이 왕조의 왕들은 스스로를 카나우지의 주인으로 칭했고 여러 대에 걸쳐 갠지스 평원 중부의 정치를 이끌었다."
  subjects: [gahadavala-dynasty, pala-empire]
  tags: [politics]
  sources: ["R. C. Majumdar (ed.), The Struggle for Empire (Bharatiya Vidya Bhavan, 1957)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)"]

- id: hoysala-1116
  year: 1116
  endYear: 1152
  title:
    ko: "비슈누바르다나와 호이살라 왕조의 부상, 탈라카드와 벨루르(1116~1152)"
  summary:
    ko: "호이살라 왕조는 카르나타카 서부 산악의 수령 가문으로 시작하여 서 찰루키아의 봉신으로 컸다. 비슈누바르다나(재위 1108~1152)는 아버지 에레양가(1098~1102)와 형 발랄라 1세(1102~1108)를 이어 왕위에 올랐다. 그는 1116년 무렵 탈라카드(강가바디의 옛 중심)에서 촐라 군을 꺾었고 이로써 남카르나타카를 촐라에게서 빼앗았다. 서 강가 왕조가 1004년 끝난 뒤 이 땅은 촐라가 차지하고 있었으며, 이 승리로 호이살라는 촐라와의 오랜 다툼에서 앞서게 되었다. 승리를 기념해 1117년 벨루르에 체나케샤바 사원을 세웠고, 이어 할레비두에 호이살레슈와라 사원이 세워졌다. 이 사원들은 활석(비누석)에 새긴 정교한 조각이 특징인 호이살라 양식으로 알려졌으며 2023년 유네스코 세계유산에 올랐다. 비슈누바르다나는 자이나교를 믿다가 비슈누 신앙으로 돌아섰다는 전승이 있지만 이 이야기는 후대 문헌에 의존하며 학자들 사이에 견해가 갈린다. 그의 뒤를 이은 나라심하 1세(1152~1173)는 서 찰루키아의 쇠퇴 속에서 나라를 유지했고, 발랄라 2세(1173~1220)에 이르러 완전히 독립한 왕국이 된다. 호이살라가 서 찰루키아에서 완전히 벗어난 해는 사료마다 1187년에서 1193년까지 갈린다. 촐라 쪽 사정은 「비크라마 촐라의 벵기 회복과 후기 촐라의 영토(1118~1135)」(뒤의 사건)에서 이어진다. 호이살라 사원은 규모보다 정교한 조각으로 알려져 있다. 벨루르의 체나케샤바 사원은 승리 기념이면서 이 지역에서 비슈누 신앙을 알리는 구실을 했다. 호이살라가 자라난 배경에는 서해안 항구와 내륙 고원을 잇는 교역로가 있었다. 호이살라는 카나다어와 산스크리트어 문학을 후원했고, 이 시대에 카나다 문학이 궁정에서 자라 훗날의 시인들로 이어졌다."
  subjects: [hoysala-dynasty, chola-dynasty, western-chalukya-dynasty]
  tags: [politics, culture]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: vikrama-chola-1118
  year: 1118
  endYear: 1135
  title:
    ko: "비크라마 촐라의 벵기 회복과 후기 촐라의 영토(1118~1135)"
  summary:
    ko: "비크라마 촐라(재위 1118~1135)는 쿨로퉁가 1세의 아들로 벵기 총독을 지냈다. 군주표는 그의 재위를 1118년부터 적으나 아버지 쿨로퉁가가 1120년까지 산 것으로 적혀 있어 두 사람의 통치 기간이 겹친다. 1118년 무렵 서 찰루키아의 비크라마디티야 6세는 벵기를 차지했고, 촐라는 서쪽 강가바디를 호이살라에게 이미 빼앗긴 상태였다. 비크라마는 서 찰루키아가 약해지자 벵기를 되찾았다고 알려졌으나 그 해는 학설마다 갈린다. 찰루키아의 쇠퇴를 틈탄 이 회복은 비크라마의 군사적 성과이며, 벵기와 강가바디 가운데 어느 범위를 얼마나 오래 되찾았는지는 학설이 갈린다. 촐라의 영토는 이 무렵부터 타밀 본토, 벵기와 안드라 남부 해안, 칼링가 남부 일부로 줄었고 그 바깥은 서 찰루키아와 호이살라, 판디아의 몫이 되었다. 오래 촐라의 총독 아래 이름만 남았던 판디아는 12세기 말 무렵 힘을 되찾았다. 한편 이 시기 안드라 해안에서는 텔루구 초다 계통 집안들이 촐라의 봉신으로 있으면서 점차 독립성을 키웠다. 비크라마 촐라는 치담바람의 나타라자 사원 등 촐라 사원을 후원했다고 전하며, 그 뒤의 쿨로퉁가 2세, 라자라자 2세로 이어지는 시기에 촐라는 점차 영토 대신 경제력과 신앙의 중심으로서 남았다. 1135년 무렵 비크라마가 죽었을 때 촐라는 여전히 남인도 동해안의 큰 나라였지만, 라자라자 1세와 라젠드라 1세 때의 영토 팽창은 이미 지난 일이 되어 있었다. 비크라마 촐라의 비문은 그가 흉년에 세금을 줄여 주었다고 자랑한다. 그의 치세에 치담바람의 나타라자 사원에는 새로운 탑과 회랑이 더해졌다고 하며, 아들 쿨로퉁가 2세가 같은 사원을 더 크게 지었다. 비크라마 촐라의 사후에는 쿨로퉁가 2세가 촐라 왕위를 이었다."
  subjects: [chola-dynasty, western-chalukya-dynasty, hoysala-dynasty]
  tags: [politics, war]
  sources: ["K. A. Nilakanta Sastri, The Cōḷas (2판, University of Madras, 1955)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: sena-vijayasena-1096
  year: 1096
  endYear: 1140
  title:
    ko: "비자야 세나의 세나 왕조와 팔라의 쇠퇴, 카마루파의 끝(1096~1140 무렵)"
  summary:
    ko: "세나 왕조는 카르나타카에서 온 브라만 계통의 무사 가문으로 라르(서벵골)에서 사만타 세나(재위 1070~1095)가 터를 잡았다고 한다. 그의 뒤를 이은 헤만타 세나(1095~1096)는 짧게 다스렸고, 이어 비자야 세나(재위 1096~1159)가 즉위했다. 그는 팔라가 라마팔라(1077~1130) 이후 약해진 틈에 동벵골의 방가까지 세력을 넓혔고 재위 말년의 영역은 방가와 바렌드라 일부였다고 한다. 같은 시기 아삼의 카마루파 왕국은 팔라 왕조의 라마팔라가 군대를 보내 12세기 초 팔라의 영향권에 넣으면서 흔들렸다. 라마팔라의 뒤를 쿠마라팔라(1130~1140)가 이었을 때 카마루파에서는 총독 바이댜데바가 독립적으로 행동했는데, 그가 이 땅에서 마지막으로 기록되는 통치자(1126~1140)이다. 그 뒤 땅은 여러 소국으로 갈렸고 13세기에 카마타 왕국이 서쪽을 이었다. 같은 때 벵골 남동부와 동벵골에는 바르만 왕조 같은 작은 왕가도 있었다. 이 시기 벵골의 정치는 사료가 동판 문서와 후대 족보뿐이어서 군주의 재위가 학자에 따라 몇 해씩 어긋난다. 세나는 비자야 세나의 긴 재위를 거쳐 1159년 발랄라 세나에게 이어진다. 세나 가문은 비문에서 스스로를 카르나타카의 브라만 출신 무사 집단으로 소개했다. 비자야 세나는 라즈샤히의 데오파라에 프라듐네슈와라 사원을 세우고 그 사실을 비문에 새겼다. 팔라가 불교를 후원한 것과 달리 세나는 시바와 비슈누 신앙을 후원했고, 이들이 벵골에서 힌두 정통 의례와 카스트 질서를 강화했다는 평가가 있다. 세나 시대에는 산스크리트 시문학이 번성했고, 뒷날 락슈마나 세나의 궁정에서 활동하는 시인들의 바탕이 이때 놓였다."
  subjects: [sena-dynasty, pala-empire, kamarupa-kingdom]
  tags: [politics]
  sources: ["R. C. Majumdar (ed.), The History of Bengal, vol. 1: Hindu Period (University of Dacca, 1943)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)"]

- id: cutch-jaisalmer-1147
  year: 1147
  endYear: 1156
  title:
    ko: "서인도 변경의 쿠치 주와 자이살메르 주 성립 전승(1147~1156)"
  summary:
    ko: "쿠치(카치)는 카티아와르 반도 북쪽, 소금 늪(란)에 둘러싸인 반도형 땅이고 자이살메르는 타르 사막 서쪽 끝의 요새 도시이다. 두 땅은 12세기 중엽 비슷한 때에 각각 라지푸트 계통 가문의 나라로 이어지는 시작을 맞았다. 쿠치에서는 신드에서 내려온 사마 부족의 자디차 가문의 라코 자다니(전승의 인물)가 1147년 무렵 동부 쿠치에 왕국을 세웠다고 전해진다. 쿠치 전역이 하나로 합쳐진 것은 16세기 켄가르지 1세 때의 일이다. 자이살메르에서는 바티 가문의 라왈 자이살이 1156년 새 도읍으로 자이살메르를 세웠고, 이 도시의 이름도 그에게서 나왔다고 한다. 두 나라 모두 사료는 후대의 구전과 족보에 기대어 있어 시작 연도는 확실하지 않다. 쿠치 일부는 찰루키아와 다른 집단이 나누어 다스렸고, 신드는 소마라 왕조가 다스렸다. 사막과 소금 늪이 나라를 가르는 이 땅은 낙타 대상과 바닷길 교역에서 이익을 얻었고, 자이살메르는 인도와 중앙아시아·서아시아를 잇는 대상로의 한 거점으로 컸다. 쿠치 주와 자이살메르 주는 20세기 중엽 인도에 합쳐질 때까지 토후국으로 남는다. 쿠치는 대륙과 바다의 경계에 있어 인더스 삼각주의 항구들과 구자라트, 아라비아 해안을 잇는 항해의 중간 기착지였다. 자이살메르는 인도에서 중앙아시아와 서아시아로 가는 길목의 요새 도시로, 황금빛 사암으로 지은 건물이 많아 황금의 도시라 불린다. 두 나라 모두 사료는 구전과 족보뿐이므로 건국자의 이름과 해는 후대 정리의 결과이다. 사마 부족은 신드의 소마라 왕조와도 관계가 깊었고, 쿠치와 신드는 인더스 삼각주의 물길이 바뀔 때마다 서로 영향을 주고받았다. 바티 가문은 펀자브에서 라자스탄 서쪽으로 내려온 집단으로 전해지며, 이들의 이동 경로는 연대기마다 다르다."
  subjects: [cutch-state, jaisalmer-state, chaulukya-dynasty, soomra-dynasty]
  tags: [politics]
  sources: ["Rima Hooja, A History of Rajasthan (Rupa, 2006)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Asoke Kumar Majumdar, Chaulukyas of Gujarat (Bharatiya Vidya Bhavan, 1956)"]

- id: siddharaja-chaulukya-1094
  year: 1094
  endYear: 1142
  title:
    ko: "자야심하 시다라자의 구자라트 찰루키아 왕조와 말와 정복(1094~1142)"
  summary:
    ko: "찰루키아 왕조의 카르나(재위 1064~1092)가 죽은 뒤 어린 자야심하가 왕위에 올랐다. 그가 시다라자(싯다의 왕)라 불린 자야심하(재위 1092~1142)로, 성인이 되어 직접 다스리면서 찰루키아를 서인도의 가장 큰 나라로 키웠다. 자야심하의 치세에 남라자스탄 쪽까지 찰루키아의 영향이 미쳤다고 한다. 가장 큰 사건은 말와 정복이다. 파라마라 왕조의 나라바르만(재위 1094~1133)과 오래 싸웠고, 그 아들 야쇼바르만(1133~1142) 때인 1135년 무렵 도읍 다라를 점령하여 파라마라의 왕을 사로잡았다고 비문이 전한다. 말와는 이후 찰루키아의 속주가 되었다. 사우라슈트라에서는 케가르 계통의 호족을 제압했다고 하며, 아나힐라파타카에는 사하스라링가 호수와 루드라말라 사원 같은 큰 공사가 이어졌다. 시다라자는 시바 신앙을 가졌으나 자이나교 학자들도 후원했고, 궁정의 자이나 학승 헤마찬드라는 문법서 『시다헤마』를 그에게 바쳤다. 시다라자는 후계자 없이 죽었고, 파라마라 쪽에서는 자야바르만 1세(1142~1143)가 이어 뒤에 발랄라라는 찬탈자가 나타나는 혼란이 이어졌다. 이 혼란을 틈타 쿠마라팔라가 왕위를 이었다. 시다라자 시대 아나힐라파타카 주변에는 상인과 장인의 조합이 번성했고, 서해안 항구 캄바트를 통한 해외 교역이 나라의 큰 수입원이었다. 시다라자의 치세에 헤마찬드라가 어린 쿠마라팔라를 그에게서 숨겨 주었다는 이야기가 자이나교 연대기에 나오지만, 이는 쿠마라팔라의 정당성을 위해 윤색한 전승일 가능성이 있다. 말와를 얻은 뒤 시다라자는 아반티나타(말와의 주인)라는 칭호를 썼다고 한다. 이 시기 찰루키아의 영향은 서쪽 바다에서 동쪽 말와 고원, 북쪽 라자스탄 남부까지 미쳤고, 구자라트 역사에서 가장 넓은 판도였다."
  subjects: [chaulukya-dynasty, paramara-dynasty]
  tags: [politics, war]
  sources: ["Asoke Kumar Majumdar, Chaulukyas of Gujarat (Bharatiya Vidya Bhavan, 1956)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: kumarapala-chaulukya-1143
  year: 1143
  endYear: 1178
  title:
    ko: "쿠마라팔라와 헤마찬드라, 파라마라의 회복과 카사흐라다 전투(1143~1178)"
  summary:
    ko: "시다라자의 뒤를 이어 쿠마라팔라(재위 1142~1171)가 구자라트 찰루키아의 왕이 되었다. 그는 파라마라의 찬탈자 발랄라를 꺾어 말와를 다시 찰루키아의 속주로 삼았다. 쿠마라팔라는 자이나교 학승 헤마찬드라의 영향으로 자이나교를 받아들였다고 전하며, 구자라트 전역에서 동물 도살 금지령을 내렸다고 한다. 그러면서도 솜나트 사원을 돌로 다시 짓게 한 것으로 전해져 시바 신앙도 후원했음을 알 수 있다. 쿠마라팔라의 뒤는 아자야팔라(1171~1175)와 물라라자 2세(1175~1178)로 이어졌는데 두 왕은 재위가 짧았다. 1175년 무렵 파라마라의 빈디야바르만(재위 1175~1194)이 물라라자 2세를 꺾고 말와의 주권을 되찾아 이 땅은 찰루키아에서 떨어져 나갔다. 같은 시기 구르 왕조의 무함마드 구리가 인더스강을 따라 올라오며 물탄과 우치를 차지했고(1175년), 1178년 구자라트로 군대를 보내 아부산 기슭 카사흐라다에서 물라라자 2세가 이끈 라지푸트 연합군에게 패했다. 이 싸움은 무함마드 구리가 인도에서 맛본 첫 큰 패배로 기록되며, 구르는 이후 구자라트 방면을 접고 펀자브 쪽으로 돌아섰다. 승리 당시 실제 지휘는 어린 왕 대신 왕모 나이키데비가 맡았다는 후대 전승도 있다. 1178년 즉위한 비마 2세(1178~1240)는 오랫동안 재위했지만 1197년 쿠트브 웃딘 아이바크의 공격을 받아 안힐와라가 타격을 입지만 1201년 이 땅을 되찾는다. 쿠마라팔라의 즉위 경위, 곧 시다라자의 후계 문제와 쿠마라팔라가 왕위에 오르기까지의 다툼은 자이나교 연대기가 헤마찬드라의 영향을 강조해 전하는 만큼 해석에 주의가 필요하다. 비마 2세의 긴 재위는 찰루키아의 쇠퇴기이기도 했다."
  subjects: [chaulukya-dynasty, paramara-dynasty, ghurid-dynasty]
  tags: [politics, war, religion]
  sources: ["Asoke Kumar Majumdar, Chaulukyas of Gujarat (Bharatiya Vidya Bhavan, 1956)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: pala-end-1144
  year: 1144
  endYear: 1162
  title:
    ko: "마다나팔라의 팔라 제국과 발랄라 세나의 가우다, 팔라의 끝(1144~1162)"
  summary:
    ko: "라마팔라(재위 1077~1130)의 아들 쿠마라팔라(1130~1140)와 손자 고팔라 4세(1140~1144)가 짧게 이은 뒤 팔라 제국의 왕위는 어린 고팔라 4세의 섭정이던 마다나팔라(재위 1144~1162)에게 넘어갔다. 마다나팔라의 시대에 팔라는 이미 여러 지방을 잃고 있었다. 1144년 무렵 비하르 동쪽의 자르칸드 일대가 팔라의 손을 떠났고, 동벵골은 바르만 왕조와 동부 강가 왕조의 압박을 받았으며, 서쪽으로는 가하다발라 왕조가 비하르 서부를 쥐었다. 세나 왕조의 비자야 세나(재위 1096~1159)는 오래전부터 방가와 라르에서 힘을 키웠고, 그의 아들 발랄라 세나(재위 1159~1179)는 1159년 무렵 팔라의 옛 땅 가우다와 바렌드라를 차지했다. 팔라의 마지막으로 이름이 알려진 고빈다팔라는 1158~1162년 무렵 재위하며 가야 일대에서 버텼다고 하며, 그의 재위를 기록한 비문들이 가야에 남아 있다. 이로써 팔라 제국은 1161년 무렵 끊긴 것으로 본다. 학자에 따라서는 팔라 이름의 군주가 1200년 무렵까지 비하르에서 이어졌다고 보기도 하지만, 그들은 벵골의 큰 나라가 아니었다. 팔라가 사라진 뒤 벵골은 세나 왕조가 차지했고, 비하르는 여러 소국과 가하다발라, 이어 구르 군의 침공 앞에 놓였다. 400년에 가까운 팔라의 시대는 벵골의 불교 학문과 미술, 티베트와의 교류를 남겼다. 팔라가 사라진 시기 벵골의 정치 지형은 사료가 동판 문서뿐이어서 불확실한 점이 많다. 팔라가 오래 후원한 불교는 세나 시대에 힘을 잃기 시작했고, 불교 학문의 중심은 티베트와 동남아시아로 옮겨 갔다고 평가한다. 팔라 이름이 전하는 마지막 비문은 비하르의 가야에 남아 있다."
  subjects: [pala-empire, sena-dynasty, gahadavala-dynasty, eastern-ganga-dynasty]
  tags: [politics]
  sources: ["R. C. Majumdar (ed.), The History of Bengal, vol. 1: Hindu Period (University of Dacca, 1943)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)"]

- id: bijjala-kalachuri-1157
  year: 1157
  endYear: 1184
  title:
    ko: "칼추리 비잘라의 칼랴니 차지와 바사바의 비라샤이바 운동(1157~1184)"
  summary:
    ko: "서 찰루키아 왕조의 타일라파 3세(재위 1151~1162)가 다스리던 시기, 봉신인 칼추리 가문의 비잘라 2세가 1157년(1162년으로 적는 문서도 있다) 도읍 칼랴니를 차지했다. 이때부터 칼추리 왕조(칼랴니)가 칼랴니를 다스렸다. 비잘라 2세(재위 1130~1167)가 1167년 무렵 죽은 뒤에는 그의 아들들인 소비데바(1168~1176), 상카마(1176~1180), 아하바말라(1180~1183), 싱가나(1183~1184)가 차례로 이었고, 찰루키아의 자가데카말라 3세(1163~1183)는 이름만 남은 왕 노릇을 했다. 비잘라의 궁정에는 바사바(바사바나)라는 재상이 있었고, 그는 12세기 카르나타카에서 카스트 구분과 우상 숭배를 거부하고 시바 신앙을 사람들의 삶에 가까이 가져온 비라샤이바(링가야트) 운동의 지도자로 알려졌다. 바사바와 동료들은 카나다어 산문시 바차나를 지어 '일이 곧 예배'라는 가르침을 퍼뜨렸는데, 이 운동은 이후 카르나타카 사회에 오래 영향을 남겼다. 비잘라와 바사바의 관계가 어떻게 끝났는지, 비잘라의 최후가 어떠했는지는 후대 전승마다 다르며 확실하지 않다. 1183년 소메슈바라 4세가 칼랴니를 되찾으려 시도했고, 1184년 그가 찰루키아의 왕위를 회복하면서 칼추리 지배는 끝났다. 그러나 서 찰루키아는 곧 호이살라와 야다바의 압박을 받아 1189년 무렵 소메슈바라 4세가 바나바시로 달아났다. 이 이야기는 「데바기리의 야다바 왕조와 서 찰루키아의 끝(1187~1189)」에서 이어진다. 비라샤이바의 사상은 사원 중심의 숭배 대신 개인이 목에 거는 링가를 중시하여 힌두교 안에서도 독특한 전통으로 남았다. 이 시기 카르나타카에서는 자이나교와 시바 신앙, 비슈누 신앙이 공존했고 링가야트 운동은 교단 안팎에서 논쟁을 일으켰다. 바사바가 세웠다고 전하는 아누바바 만타파(체험의 집)는 여러 계층의 사람이 모여 토론하는 자리였다고 한다."
  subjects: [kalachuri-kalyani, western-chalukya-dynasty]
  tags: [politics, religion]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)"]

- id: kakatiya-1163
  year: 1163
  endYear: 1199
  title:
    ko: "카카티야 왕조의 자립과 와랑갈(1163~1199)"
  summary:
    ko: "카카티야 가문은 서 찰루키아의 봉신으로 텔랑가나에서 베타 1세와 프롤라 1세, 베타 2세를 거치며 하나마콘다를 봉토로 받았다. 프롤라 2세(재위 1116~1157)는 동쪽으로 세력을 넓히다 벨라나티의 곤카 2세와 싸우다 전사했다고 한다. 그의 아들 루드라데바(재위 1158 또는 1163~1195)는 1163년의 하나마콘다 비문에서 찰루키아의 종주권을 벗어났음을 선언했다. 이 선언을 카카티야 왕조의 사실상 성립으로 본다. 루드라데바는 1195년 도읍을 오루갈루(와랑갈)로 옮겼다. 그의 뒤를 이은 마하데바(1195~1199)는 짧게 다스렸고, 1199년 가나파티데바(재위 1199~1262)가 즉위했다. 이 무렵 데칸 북쪽의 야다바 왕조 자이투기 1세(1191~)는 1194년 무렵 카카티야를 침입하여 종주권을 받아 냈다고 전해지는데, 이 일은 마하데바의 죽음과 맞물려 있다고 보는 설도 있다. 가나파티는 재위 동안 안드라 해안 평원을 점차 차지했는데, 그 대부분은 1230년대의 일이고 그 전까지 이 땅에는 촐라 왕조 아래에서 독립성을 키운 텔루구 초다 가문들이 있었다. 카카티야의 시대에는 호수와 저수지를 짓는 사업이 이어졌고, 와랑갈의 사원에는 정교한 조각이 남아 이 지방 문화의 한 줄기를 이루었다. 하나마콘다의 천 기둥 사원은 루드라데바 때인 1163년에 세워진 것으로 알려졌으며 시바, 비슈누, 수르야 세 신을 함께 모셨다. 카카티야의 영역은 오늘날 텔랑가나 중심이었고, 북쪽의 야다바와 남쪽의 촐라 계통 소국, 동쪽의 동부 강가와 이웃했다. 카카티야가 서 찰루키아에서 벗어난 시기는 칼랴니가 칼추리에게 넘어간 1157년 뒤의 혼란과 겹친다."
  subjects: [kakatiya-dynasty, western-chalukya-dynasty, yadava-dynasty, chola-dynasty]
  tags: [politics]
  sources: ["P. V. Parabrahma Sastry, The Kakatiyas of Warangal (Government of Andhra Pradesh, 1978)", "Burton Stein, A History of India (Blackwell, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: yadava-devagiri-1187
  year: 1187
  endYear: 1189
  title:
    ko: "데바기리의 야다바 왕조와 서 찰루키아의 끝(1187~1189)"
  summary:
    ko: "서 찰루키아 왕조의 봉신이던 야다바(세우나) 가문의 빌라마 5세는 1175년 무렵부터 찰루키아 휘하에서 세력을 키웠다. 1187년 무렵 빌라마 5세는 옛 찰루키아의 도읍 칼랴니를 차지한 뒤 독립을 선언하고 새 도읍 데바기리(지금 다울라타바드)를 세웠다. 이로써 야다바 왕조의 성립을 1187년으로 본다. 서 찰루키아의 소메슈바라 4세는 이 무렵 왕위를 되찾아 있었으나 힘이 없었다. 남쪽에서는 호이살라 왕조의 발랄라 2세가 칼랴니로 군대를 보내 소메슈바라 4세를 쫓아냈고, 소메슈바라는 1189년 바나바시로 달아났다. 이 일로 서 찰루키아 왕조는 끝난다. 이어 빌라마가 발랄라를 몰아냈다고 전하는 한편, 1180년대 말에는 소라투르에서 발랄라의 호이살라 군이 빌라마의 야다바 군을 크게 이겨 야다바를 말라프라바강과 크리슈나강 북쪽으로 물리쳤다고 한다. 두 이야기 모두 후대 비문에 의존하여 어느 쪽이 먼저인지 확실하지 않다. 결국 칼랴니를 중심으로 하던 옛 서 찰루키아의 땅은 북쪽의 야다바와 남쪽의 호이살라가 나누어 갖는 형세가 되었다. 빌라마의 아들 자이투기 1세(1191~)는 1194년 무렵 카카티야 쪽으로 군대를 보내며 야다바의 세력을 넓혔다. 1189년의 야다바 영역은 오늘날 마하라슈트라 일대 북데칸이었다. 야다바의 데바기리 요새는 높은 바위산 위에 지은 요새 도시로 훗날 델리 술탄국의 목표가 된다. 13세기에는 야다바 영역에서 마라티어 성자 문학이 일어나기 시작한다. 야다바 가문은 데칸 북부의 무사 집단으로 알려졌고, 서 찰루키아가 약해진 틈에 가장 먼저 북쪽 자리를 굳혔다. 13세기 초 시마나 2세 때 이 나라는 가장 넓어진다."
  subjects: [yadava-dynasty, western-chalukya-dynasty, hoysala-dynasty]
  tags: [war, politics]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: ghurid-multan-1175
  year: 1175
  endYear: 1186
  title:
    ko: "구르 왕조 무함마드 구리의 인도 진출: 물탄에서 라호르까지(1175~1186)"
  summary:
    ko: "아프가니스탄 중부 구르 산악의 구르 왕조는 형 기야스 웃딘 무함마드(1203년 사망)와 아우 무함마드 구리(무이즈 웃딘)가 함께 나라를 다스렸고, 형이 서쪽 호라산을, 아우가 동쪽 인도 방면을 맡았다. 무함마드 구리는 1175년 물탄을 카르마트파(이스마일파의 한 갈래) 지배자에게서 빼앗았고 이 무렵 우치도 차지했다. 이 해를 구르가 인도에 처음 발판을 얻은 해로 본다. 신드 하부는 계속 소마라 왕조가 다스렸다. 1178년 그는 구자라트로 군대를 보냈으나 아부산 기슭 카사흐라다에서 찰루키아 왕조의 물라라자 2세가 이끈 연합군에게 크게 패했는데, 이 싸움은 「쿠마라팔라와 헤마찬드라, 파라마라의 회복과 카사흐라다 전투(1143~1178)」에서 다룬다. 이에 방향을 바꾸어 북쪽으로 올라가 1179년 페샤와르를 차지했고, 이로써 가즈니 왕조의 마지막 왕 호스로 말리크의 영역을 서쪽과 남쪽에서 에워쌌다. 1186년 무함마드 구리는 라호르를 차지하여 호스로 말리크를 사로잡고 가즈니 왕조의 인도 영토와 왕조 자체를 끝냈다. 가즈니 왕조의 마지막은 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」에서 이어진다. 구르의 인도 진출 초기는 상대의 약한 곳을 골라 치는 방식이었으며, 이후 델리·갠지스 평원 공략이 이어진다. 구르 왕조는 본래 불교와 이슬람이 교차하던 산악 지대의 지방 세력이었다가 12세기에 가즈니를 차지하면서 중앙아시아 정치에 들어섰다. 무함마드 구리가 인도로 눈을 돌린 까닭으로는 호라즘·셀주크와의 경쟁 속에 서쪽 팽창이 막혔다는 점이 자주 거론된다. 1175년 물탄 점령은 구르가 인도 평원에 얻은 첫 거점이었다."
  subjects: [ghurid-dynasty, ghaznavid-empire, soomra-dynasty, chaulukya-dynasty]
  tags: [war, politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "R. C. Majumdar (ed.), The Delhi Sultanate (Bharatiya Vidya Bhavan, 1960)"]

- id: tarain-1191
  year: 1191
  endYear: 1193
  title:
    ko: "타라인 전투와 차하마나 왕조의 패배, 델리 함락(1191~1193)"
  summary:
    ko: "라호르를 얻은 무함마드 구리는 이어 동쪽 라지푸트 세력을 상대하게 되었다. 아지메르와 델리를 다스리던 차하마나 왕조의 프리트비라자 3세(재위 1177~1192)가 1191년 타라인(타라오리)에서 구르 군을 꺾고 무함마드를 물러나게 했다. 이것이 제1차 타라인 전투다. 이듬해인 1192년 무함마드는 군대를 다시 모아 같은 곳에서 프리트비라자를 꺾었다. 이것이 제2차 타라인 전투이다. 프리트비라자는 전투 뒤에 사로잡혔고 얼마 뒤 처형된 것으로 전해지는데, 이 부분은 『프리트비라지 라소』 같은 후대 음유 시인의 서사시와 페르시아 연대기의 기록이 서로 다르다. 구르는 프리트비라자의 아들 고빈다라자 4세를 봉신으로 앉혔으나 그는 얼마 뒤 란탐보르로 물러나 새로운 차하마나 갈래를 열었다. 1193년 무함마드 구리의 장군 쿠트브 웃딘 아이바크이 델리를 차지했고, 토마라 이래 이어진 이 도시는 구르의 인도 지배 거점이 되었다. 타라인 전투로 차하마나 왕조의 아지메르 본가는 힘을 잃고 1194년 하리라자가 반란을 일으켰다가 진압되었다. 이 일은 「쿠트브 웃딘 아이바크와 델리 술탄국의 성립(1206~1210)」(뒤의 사건)으로 이어지는 시작이다. 제1차 타라인에서 무함마드 구리는 부상으로 말에서 떨어졌다가 부하의 도움으로 목숨을 건졌다고 페르시아 연대기가 전한다. 제2차 때에는 구르 군이 기병의 속도와 거짓 후퇴를 이용했다고 『타바카트이 나시리』가 이야기하나 연대기 속 라지푸트 군의 수는 크게 부풀려 있어 믿기 어렵다. 타라인은 델리 북쪽 평원에 있어, 이 일대는 이후에도 여러 번 큰 전투가 벌어지는 요충이 된다. 두 번의 싸움 모두 날짜를 연대기마다 조금씩 다르게 적어 1191년과 1192년이라는 해만 확실하다."
  subjects: [chahamana-dynasty, ghurid-dynasty]
  tags: [war, politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Dasharatha Sharma (ed.), Early Chauhān Dynasties (S. Chand, 1959)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)"]

- id: chandawar-1194
  year: 1194
  endYear: 1197
  title:
    ko: "찬다와르 전투와 가하다발라 왕조의 끝, 아지메르·바야나·괄리오르·안힐와라(1194~1197)"
  summary:
    ko: "델리를 차지한 구르 군은 1194년 갠지스 평원 중부로 군대를 보냈다. 무함마드 구리는 카나우지와 바라나시를 다스린 가하다발라 왕조의 자야찬드라를 찬다와르(지금 피로자바드 부근)에서 꺾었다. 자야찬드라는 이 싸움에서 죽었다고 전해지며, 구르 군은 바라나시를 약탈했다. 약탈의 규모와 신전 파괴는 구르 쪽 연대기가 승리를 기리는 어조로 적은 것이어서 그 서술을 그대로 받아들이기 어렵다. 가하다발라의 남은 왕들의 기록은 1237년까지 이어지지만 이 왕조의 자야찬드라까지를 큰 나라의 끝으로 본다. 같은 해 아지메르에서는 차하마나 하리라자의 반란이 진압되었고, 아지메르 일대는 1194~1195년 무렵(자료에 따라 갈린다) 구르 총독 아이바크의 손에 넘어갔다. 1195~1196년에는 바야나(비아나)와 괄리오르 요새가 구르 쪽에 떨어졌다. 괄리오르 요새는 1035년 뒤 찬델라에 대한 충성을 버린 카치흐파가타 가문이 지키다 1196년 구르 쪽에 넘어갔다. 1197년 아이바크은 구자라트의 안힐와라(지금 파탄)를 공격했으나 구르 군은 곧 물러났고 1201년 찰루키아가 이 땅을 되찾았다. 아이바크은 1202~1203년 찬델라의 파라마르디를 압박하기도 했다. 이처럼 1194~1197년에 구르 군의 지배는 델리에서 하리아나·도아브·남라자스탄 쪽으로 넓어졌으나, 구자라트와 분델칸드는 얼마 지나지 않아 현지 왕조의 손에 돌아갔다. 찬다와르 전투에서 구르 군은 활을 쏘는 기병이 중심이었고 가하다발라 군은 코끼리 부대를 앞세웠다고 연대기가 적는다. 이 전투 뒤 카나우지는 구르 쪽에 들어갔으나 가하다발라의 남은 왕들은 지방 소국으로 이어졌다. 찬다와르는 아그라 가까운 야무나강 가의 지역이다."
  subjects: [gahadavala-dynasty, chahamana-dynasty, chandela-dynasty, chaulukya-dynasty, ghurid-dynasty]
  tags: [war, politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)", "H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 2 (Trübner, 1869)"]

- id: bakhtiyar-khalji-1200
  year: 1200
  endYear: 1206
  title:
    ko: "바크티야르 할지의 비하르와 벵골 진출과 칼추리 트리푸리(1200~1206)"
  summary:
    ko: "구르 왕조 휘하의 투르크 계통 장군 바크티야르 할지는 아이바크의 직접 명령보다는 독자적으로 동쪽 비하르와 벵골로 진출했다. 1197~1200년 무렵 그는 비하르 남부의 요새를 급습해 큰 재물과 도서를 얻었다고 한다. 『타바카트이 나시리』는 이때 요새에서 머리를 민 사람들을 베었고 약탈 뒤에야 그곳이 학원임을 알았다고 적는데, 그곳을 오단타푸리 사원으로 보는 해석이 있으며 오단타푸리에서 학살이 있었다는 서술은 17세기 티베트 승려 타라나타에게서 나온다. 날란다와 비크라마실라도 이 무렵 쇠퇴했는데, 이 과정을 전적으로 이 침공 탓으로 돌리는 견해와 오랜 쇠퇴의 마지막 단계로 보는 견해가 갈리며 사료도 후대의 것이다. 1203~1204년에는 나디아를 급습하여 세나 왕조의 락슈마나 세나가 동쪽으로 물러났다. 락슈마나 세나의 궁정에서는 『기타 고빈다』를 쓴 시인 자야데바가 활동했다. 바크티야르는 1205년 무렵 가우르 가까이 라크나우티를 거점으로 삼고, 1204년부터 이 땅의 주화는 무함마드 구리의 이름으로 만들어졌다. 이후의 일은 「바크티야르 할지 이후의 벵골: 라크나우티와 세나 왕조의 끝(1206~1245)」(뒤의 사건)에서 이어진다. 1206년 3월 무함마드 구리는 인더스강 가에서 암살되었고(범인은 코카르 부족이나 이스마일파로 기록이 갈린다) 구르의 인도 영토는 총독들이 나눠 가졌는데, 이 일은 「쿠트브 웃딘 아이바크와 델리 술탄국의 성립(1206~1210)」(뒤의 사건)으로 이어진다. 중부 인도에서는 칼추리 왕조(트리푸리)가 12세기 말부터 쇠퇴했다. 마지막으로 기록되는 왕은 트라일로키아말라이며 1212년 무렵까지 확인되고, 왕조가 어떻게 끝났는지는 알려지지 않았다. 나디아 급습 때 바크티야르는 말 장수로 꾸민 18명의 기병만으로 성문을 뚫었다는 『타바카트이 나시리』의 이야기가 유명하지만 이것이 문자 그대로 사실인지는 학자들이 의문을 제기한다. 이 급습이 세나 왕조의 힘 자체를 꺾지는 못해 락슈마나 세나는 동벵골에서 이어서 다스렸다."
  subjects: [ghurid-dynasty, sena-dynasty, kalachuri-tripuri]
  tags: [war, religion]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)"]

- id: khasa-manipur-1100
  year: 1100
  endYear: 1110
  title:
    ko: "히말라야 서부의 카사 말라 왕국과 동북부의 마니푸르 왕국의 성립 전승(1100~1110 무렵)"
  summary:
    ko: "12세기 초 인도 변경의 두 산악·분지 지대에서 훗날 이름난 왕국들의 시작이 전승으로 전해진다. 하나는 네팔 서부 카르날리강 유역의 카사 말라 왕국이다. 카사는 히말라야 중서부에 살던 목축·농경 집단으로, 후대에 말라 가문이라 불린 왕가의 첫 왕으로 전해지는 나가라자가 11세기 말~12세기 초 무렵 시냐를 중심으로 힘을 모았다고 한다(연대가 확인되는 가장 이른 동판은 1223년 크라찰라의 것이다). 이 왕국은 서쪽으로 쿠마온과 가르왈, 동쪽으로 네팔 서부에 걸쳐 있었고 티베트와 인도를 잇는 소금 교역에서 이익을 얻었다. 다른 하나는 인도 동북쪽 마니푸르 분지의 캉레이팍 왕국이다. 마니푸르 연대기 『체이타롤 쿰바바』는 파칸바가 왕위에 오른 해를 기원후 33년으로 적지만 그 연대는 학자들이 의심하며, 믿을 만한 왕통은 11~12세기 이후 로이윰바 왕의 시대에 두드러진다. 로이윰바(재위 11세기 말~12세기 초)가 사회 제도를 정비하고 『로이윰바 실옌』이라 불리는 규범을 만들었다고 한다. 두 경우 모두 건국 연대는 후대 연대기에 의존하며, 확실하게 말할 수 있는 것은 이 무렵 두 지역에 독자의 세력이 자라고 있었다는 정도다. 인도 평원의 정치가 가즈니와 구르의 침입으로 흔들리던 때 이 산악과 분지는 상대적으로 독립적인 질서를 이어 갔다. 마니푸르 분지는 임팔강 유역의 평야 둘레를 나가족과 쿠키족 등이 사는 산악이 에워싸고, 분지의 메이테이 사람들이 중심 민족이었다. 카사 말라 왕국의 흔적은 네팔 서부 자믈라의 시냐 유적과 비문, 티베트 문서에 남아 있다. 두 지역 모두 힌두교와 불교, 토착 신앙이 섞인 환경에서 왕국이 자랐고, 이 분지의 연대기 이전 왕통이 어떻게 이어졌는지는 확실하지 않다. 두 지역 모두 평원의 정치와는 거리를 두며 독자적인 관습을 지켰다."
  subjects: [khasa-malla-kingdom, manipur]
  tags: [politics, society]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Burton Stein, A History of India (Blackwell, 1998)", "Gangmumei Kamei, History of Manipur: Pre-Colonial Period (Reliance Publishing House, 1991)"]
