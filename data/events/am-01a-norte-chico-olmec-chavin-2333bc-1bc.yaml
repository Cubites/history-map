- id: caral-2333bc
  year: -2332
  endYear: -1799
  title:
    ko: "카랄과 수페 계곡의 노르테 치코 문명(기원전 2333~기원전 1800)"
  summary:
    ko: "페루 중부 해안의 포르탈레사·파티빌카·수페 계곡에서는 기원전 3500년 무렵(문서에 따라 기원전 3000년 무렵)부터 정착지가 늘었고, 기원전 2600년 무렵부터 기원전 2000년 무렵 사이에 수페 계곡 안쪽의 카랄이 도시로 번성했다. 이 사회를 노르테 치코 문명이라 하며 카랄수페 문명이라고도 부른다. 카랄은 60헥타르가 넘는 중심부에 단을 쌓은 신전 피라미드와 둥글게 판 광장을 두었고, 가장 큰 신전은 길이 150미터, 너비 110미터, 높이 28미터에 이른다. 갈대와 돌을 담아 나른 짠 자루에서 얻은 방사성 탄소 연대는 기원전 2627년까지 올라가며, 이 사회가 토기를 쓰지 않았다는 점이 특징이다. 카랄에는 3천 명 안팎이, 같은 계곡의 다른 유적을 더하면 최대 2만 명까지 살았다는 추산이 있다. 카랄에서 나온 피리는 기원전 2170년 무렵의 것으로 측정되었다. 엘리트의 식생활에는 바다사자 고기도 올랐다. 바다의 멸치 같은 물고기와 내륙의 면화·작물이 오갔고, 먼 지역과도 물건이 교환되었다고 본다. 이 유적은 1905년 막스 울레가 알렸고 1948년 폴 코속이 연구했으며, 루스 샤디가 이끈 발굴(1990년대 중반부터)이 연대를 크게 끌어올렸다. 발굴자들은 카랄에서 나온 매듭 묶은 실 뭉치를 안데스 기록 도구 키푸의 선조로 보지만 학자들 의견이 갈린다. 카랄 도시는 기원전 2000년 무렵 버려졌다고 보고 노르테 치코 문명 전체의 쇠퇴는 기원전 1800년 무렵으로 잡으며, 가뭄·지진·엘니뇨 같은 기후 변화가 원인으로 거론되나 하나로 정해지지 않았고, 이후 중심은 다른 계곡과 해안으로 옮겨 갔다. 2016년에는 가까운 해안 유적 아스페로에서 기원전 2500년 무렵의 것으로 보는 지체 높은 여성의 유해가 알려졌다. 카랄은 2009년 유네스코 세계유산이 되었다."
  subjects: [norte-chico]
  tags: [society, culture]
  sources: ["Jonathan Haas, Winifred Creamer, Alvaro Ruiz, 'Dating the Late Archaic occupation of the Norte Chico region in Peru', Nature 432 (2004)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: valdivia-2300bc
  year: -2299
  endYear: -1499
  title:
    ko: "발디비아 문화와 안데스 해안의 어업·면화 경제(기원전 2300~기원전 1500)"
  summary:
    ko: "에콰도르 서부 산타엘레나 반도 해안에서는 기원전 3500년 무렵(위키백과 정보 상자는 기원전 3800년 무렵)부터 기원전 1500년 무렵까지 발디비아 문화가 이어졌다. 기원전 2300년 무렵의 발디비아 사람들은 이미 천 년 가까이 정착 생활을 해 온 바닷가 사회였다. 이 문화는 1956년 에콰도르 고고학자 에밀리오 에스트라다가 유적을 알렸고, 1960년대 초 클리포드 에번스와 베티 메거스가 발굴에 함께하면서 알려졌다. 이른 토기는 기원전 2700년 무렵으로 잡고(가장 이른 단계를 기원전 3000~2700년 무렵으로 적은 문서도 있다) 시간이 갈수록 손이 많이 가는 꼴로 바뀌었다. 이 문화는 에콰도르 해안의 오래된 문화 가운데 하나로, 앞에는 라스베가스 문화가 천 년쯤 앞서 있었고 뒤에는 마찰리야와 코토콜라오 문화가 이어졌다. 가장 이름난 것은 두 가닥의 점토를 이어 만든 작은 여인 토우로 '발디비아의 비너스'라고도 불리며, 하나하나 다르게 빚어 특정한 사람을 나타냈을 수 있다고 본다. 사람들은 주로 고기잡이로 먹고살았고, 사슴 사냥을 보태며 옥수수·강낭콩·호박·마니옥·고추를 길렀고 면화를 자아 옷을 짰다. 남쪽 페루 해안의 「카랄과 수페 계곡의 노르테 치코 문명(기원전 2333~기원전 1800)」(앞의 사건)도 어업과 면화로 살았지만 토기 없는 사회였던 반면, 발디비아에서는 일찍부터 토기를 썼다. 큰 마을 가운데 하나인 레알알토에는 광장 둘과 의례용 둔덕 둘이 있었고 기원전 2500년 무렵 인구를 약 1,250명으로 어림한다. 발굴자인 에번스와 메거스는 한때 이 토기가 일본 조몬 토기에서 건너왔다고 주장했으나 지금은 널리 받아들여지지 않는다. 기원전 1500년 무렵 마찰리야 문화가 이 해안의 뒤를 이었다."
  subjects: [valdivia]
  tags: [society, economy]
  sources: ["Betty J. Meggers, Clifford Evans, Emilio Estrada, Early Formative Period of Coastal Ecuador: The Valdivia and Machalilla Phases (Smithsonian Institution Press, 1965)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: maize-maya-2000bc
  year: -1999
  endYear: -999
  title:
    ko: "옥수수 농경의 정착과 마야 문명의 첫 마을(기원전 2000~기원전 1000)"
  summary:
    ko: "옥수수는 멕시코 남서부에서 야생 풀 테오신테를 길들여 얻은 작물로, 기원전 2000년 무렵에는 옥수수·콩·호박을 심는 정착 마을이 메소아메리카 여러 곳에 자리 잡았다. 마야 문명이라 부르는 사회는 유카탄 반도와 과테말라 고지대, 태평양 쪽 해안 평야에서 이어졌는데, 그 가운데 태평양 해안 소코누스코의 이른 토기와 마을은 기원전 1900~1700년 무렵(바라 단계)의 것으로, 이곳 사람들은 마야어가 아니라 믹세소케어를 썼다고 추정한다. 마야 저지대에서는 기원전 3000년 무렵부터 농사짓는 사람이 있었다고 보지만, 영구 마을은 천천히 늘었고 식생활에서 사냥과 채집의 몫이 컸다. 간단한 토기가 나타났는데 겉면에 고운 흙물을 입힌 그릇도 있고, 옥수수의 비중은 시간이 가며 커졌다. 마야 저지대의 선고전기는 기원전 1000년 앞의 이른 시기, 기원전 1000~400년의 중기, 기원전 400년~기원후 250년의 후기로 나누며, 중기에는 마을마다 광장과 흙 둔덕, 돌에 새긴 비석이 생겼다. 기원전 1000년 무렵에 이르면 오늘날 멕시코 타바스코주의 아과다 페닉스처럼 큰 흙 건축이 마야 저지대에서 세워졌고, 이를 마야 도시 국가의 시작과 잇는 연구자가 있다. 이 시기에 어떤 사람들이 마야 문명의 직접 조상인지는 학설이 갈리며, 마야어족이 과테말라 고지대에서 쓰이던 공통 조상말에서 나왔고 기원전 2200년 무렵 와스테카어가 먼저 갈라져 나갔다는 캠벨과 카우프먼의 언어학 설도 있다. 같은 때 멕시코만 연안에서는 올멕이 일어나 이웃 사회와 교류했으며 그 일은 「올멕의 산로렌소와 거대 두상(기원전 1200~기원전 900)」(뒤의 사건)이 다룬다. 이 마을들은 기원전 1000년 무렵부터 시작되는 선고전기 중기의 더 큰 건축으로 이어졌다."
  subjects: [maya-civilization]
  tags: [society, economy]
  sources: ["Michael D. Coe, The Maya (Thames & Hudson)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: poverty-point-1700bc
  year: -1699
  endYear: -1099
  title:
    ko: "포버티 포인트 문화의 둔덕과 교역망(기원전 1700~기원전 1100)"
  summary:
    ko: "미시시피강 하류 지금의 루이지애나주 북동부에서는 기원전 1700년 무렵부터 기원전 1100년 무렵까지 포버티 포인트 문화 사람들이 흙으로 큰 구조물을 쌓았다. 방사성 탄소 연대는 공사가 기원전 1800년 무렵 시작되어 기원전 1200년 무렵 끝났다는 값도 주며, 여섯 겹 둑의 대부분은 기원전 1600~1300년 무렵에 만들어진 것으로 본다. 이 사람들은 농사를 짓지 않은 후기 아르카익 시대의 수렵·어로·채집 사회였는데도, 바깥 지름 약 1.2킬로미터의 C자 꼴 둑 여섯 겹과 안쪽 광장(약 15헥타르), 높이 약 22미터의 새 둔덕(버드 마운드)을 만들었다. 가장 먼저 쌓은 둔덕 B는 높이 약 6미터이고, 둔덕 D는 뒷날 콜스크릭 문화가 덧쌓은 것이며, 2013년에는 둔덕 F가 새로 확인되었다. 새 둔덕은 부피가 동부 북아메리카에서 카호키아의 몽크스 마운드 다음으로 크다. 이곳에는 자연 돌이 없어 먼 곳에서 들여왔다. 화살촉 돌은 아칸소의 우아치타·오자크산지와 오하이오·테네시강 유역에서, 활석은 앨라배마·조지아의 남부 애팔래치아에서, 방연석은 미주리·아이오와에서 왔고, 구리는 오대호 산이라 여겼으나 남부 애팔래치아 산이라는 분석이 나왔다. 구운 황토 덩어리인 '포버티 포인트 물건'은 흙 가마 요리에 쓴 것으로 본다. 사람들이 이곳에 늘 살았는지, 교역과 의례의 중심이었는지는 논의가 이어지고 있으며, 기후 변화로 강 범람이 늘어난 것이 떠난 까닭으로 거론된다. 1830년대 납을 찾던 제이컵 월터의 글이 가장 이른 기록이고 1873년 새뮤얼 로킷이 처음 공식 기록을 냈으며 1950년대 제임스 포드와 클래런스 웹이 발굴했으며, 1962년 미국의 국가 역사 유적으로 지정되고 1988년 국가 기념물이 되었으며 2014년 유네스코 세계유산이 되었다."
  subjects: [poverty-point-culture]
  tags: [society, economy]
  sources: ["Jon L. Gibson, The Ancient Mounds of Poverty Point: Place of Rings (University Press of Florida, 2000)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "Brian M. Fagan, Ancient North America (Thames & Hudson)"]

- id: san-lorenzo-1200bc
  year: -1199
  endYear: -899
  title:
    ko: "올멕의 산로렌소와 거대 두상(기원전 1200~기원전 900)"
  summary:
    ko: "멕시코만 남쪽 해안 저지대인 지금의 베라크루스주 남부에서는 기원전 1200년 무렵 산로렌소가 메소아메리카에서 가장 큰 중심지로 자랐고, 이 사회를 올멕이라 한다. 올멕은 아즈텍 말로 고무 나라 사람을 뜻하는 낱말에서 온 이름으로 이들이 자신을 부른 이름은 아니다. 산로렌소의 전성기는 기원전 1400~1000년 무렵의 산로렌소 단계에 해당하며, 그 앞에는 오조치(기원전 1750~1550년 무렵), 바히오(기원전 1550~1450년 무렵), 치차라스(기원전 1450~1400년 무렵) 단계가 이어졌다. 이 도시를 알린 것은 1938년 답사 뒤 발굴한 매튜 스털링이고, 1966~1968년 마이클 코와 리처드 디엘이 이끈 예일 대학 조사가 큰 틀을 세웠다. 중심부는 강가 고원을 사람이 다듬은 터 위에 있었다는 해석이 있다. 가장 눈에 띄는 것은 거대한 돌 두상으로, 큰 것은 높이 3미터, 무게 28톤이 넘으며 투스틀라 산맥의 현무암을 멀리서 옮겨 깎았다. 올멕 지역에서 나온 두상 열일곱 점 가운데 열 점이 산로렌소에서 나왔다고 하며, 이 일대에서 돌 조각이 모두 124점까지 확인된다는 문서가 있다. 이곳의 두상은 모두 헬멧 같은 머리 장식을 썼고 두상마다 얼굴이 달라 특정한 통치자를 나타냈다는 해석이 널리 퍼져 있다. 디엘은 조각이 부서진 흔적을 적을 짓밟은 파괴로 보지 않고 돌을 다시 깎아 다시 썼다고 해석한다. 올멕을 메소아메리카 모든 문명의 '어머니 문화'로 보는 설과 이웃 사회들이 서로 영향을 주고받았다는 설이 맞서 있다. 기원전 900년 무렵 라벤타가 중심 자리를 넘겨받았고, 기원전 800년 무렵에는 산로렌소에 사람이 거의 남지 않았다. 까닭은 알려지지 않았다."
  subjects: [olmec-culture]
  tags: [society, culture]
  sources: ["Richard A. Diehl, The Olmecs: America's First Civilization (Thames & Hudson, 2004)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: la-venta-900bc
  year: -899
  endYear: -399
  title:
    ko: "라벤타와 올멕의 쇠퇴(기원전 900~기원전 400)"
  summary:
    ko: "산로렌소가 기울던 기원전 900년 무렵부터 지금의 타바스코주 라벤타가 올멕의 가장 큰 중심지가 되었다. 늪 가운데 섬에 자리 잡은 이 도시는 기원전 1200년 무렵부터 지어지기 시작했으나 번성은 기원전 900년 뒤이고, 높이 약 34미터에 흙 10만 세제곱미터가 든 복합구 C의 큰 피라미드가 가장 눈에 띈다. 도시의 건물들은 북쪽에서 서쪽으로 조금 틀어진 한 축을 따라 놓였다. 이 피라미드는 지금까지 발굴되지 않았다. 복합구 A에서는 옥을 담은 것을 포함해 묻은 공물 꾸러미가 50개 넘게 나왔고, 사문석 덩어리를 쌓은 다섯 곳의 '대규모 공물' 가운데 셋째는 무게가 약 50톤으로 어림된다. 사문석 블록 485개로 짠 모자이크 바닥은 넓이가 4.5×6미터쯤인 것이 셋으로, 완성 직후 흙으로 덮었다. 거대한 돌 두상은 이곳에서 네 점이 나왔다. 옥과 사문석은 이 땅에서 나지 않아 먼 곳에서 들여온 것으로 본다. 라벤타를 처음 자세히 적은 사람은 1925년 툴레인 대학 조사대의 프란스 블롬과 올리버 라파지이고, 1940~1943년 매튜 스털링과 필립 드러커가 발굴했다. 이 도시를 지탱하려면 적어도 1만 8천 명이 필요했다는 어림이 있다. 기원전 400년 무렵 라벤타는 거의 버려졌고 해안 저지대의 인구도 크게 줄었다. 이것을 올멕 문화의 끝으로 보지만 올멕의 전통은 완전히 사라지지 않고, 에피올멕이라 불리는 문화(기원전 300년~기원후 250년 무렵, 트레스사포테스와 라모하라가 알려졌다)가 베라크루스 중부에서 문자와 달력을 이어 갔다. 산로렌소 쪽 이야기는 「올멕의 산로렌소와 거대 두상(기원전 1200~기원전 900)」(앞의 사건)에 있다."
  subjects: [olmec-culture]
  tags: [society, culture]
  sources: ["Richard A. Diehl, The Olmecs: America's First Civilization (Thames & Hudson, 2004)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)", "Rebecca B. González Lauck, 'La Venta: An Olmec Capital', in Olmec Art of Ancient Mexico (National Gallery of Art, 1996)"]

- id: chavin-900bc
  year: -899
  endYear: -249
  title:
    ko: "차빈 데 완타르와 차빈 문화(기원전 900~기원전 250)"
  summary:
    ko: "페루 북부 안데스 고지대의 모스나강 골짜기, 해발 3,180미터에 자리한 차빈 데 완타르는 기원전 900년 무렵부터 신전 도시로 자랐고 차빈 문화의 중심이 되었다. 위치는 지금 앙카시 지방, 리마에서 북쪽으로 약 434킬로미터이다. 신전은 옛 신전(기원전 900~500년 무렵)과 새 신전(기원전 500~200년 무렵)으로 나뉘며, 차빈 데 완타르 문서는 건설이 기원전 1200년 앞부터 시작되었다고 적어 연대가 문서마다 갈린다. 옛 신전의 회랑 안쪽에는 고양잇과 짐승의 머리에 사람 몸을 한 란손 석상이 서 있고, 지름 약 20미터의 원형 광장과 돌에 새긴 부조가 있었다. 차빈 데 완타르 문서는 이곳이 기원전 500년 무렵까지 의례 중심지로 쓰였고 주된 종교 기능은 기원전 400년 앞에 끝났다고도 적어, 새 신전 연대와 맞지 않는 서술이 함께 있다. 회랑 사이에는 물길과 환기 구멍이 이어져 있어 소리와 빛으로 의례 분위기를 꾸민 것이라 해석하는 연구가 있다. 신전은 순례하고 예언을 구하는 의례 중심지였으며, 신분이 높은 사람이 더 좋은 음식과 물건을 얻은 흔적이 있어 이미 불평등이 있었다. 이 신전의 양식, 곧 고양이·뱀·새 무늬는 안데스 고지대와 해안 여러 곳의 유물에서 보이는데, 이것이 정치적 지배의 확장인지 종교와 위신품의 교류인지는 학설이 갈린다. 페루 고고학자 훌리오 텔로는 이곳을 남아메리카 문화의 요람이라 불렀고, 2018년에는 로봇 탐사로 지하에서 터널 서른 개와 무덤 몇 기가 더 확인되었다. 기원전 500~300년 무렵에는 사회가 불안해지고 신전의 영향이 줄었으며, 기원전 250년 무렵 차빈 문화가 끝났다. 원형 광장 터에는 뒤에 마을이 들어섰고 그 마을은 이어져 1940년대까지 사람이 살았다. 이 신전은 1985년 유네스코 세계유산이 되었다."
  subjects: [chavin-culture]
  tags: [religion, culture]
  sources: ["Richard L. Burger, Chavín and the Origins of Andean Civilization (Thames & Hudson, 1992)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)", "John W. Rick, 'The Evolution of Authority and Power at Chavín de Huántar, Peru', in Kevin J. Vaughn, Dennis Ogburn, Christina A. Conlee (eds.), Foundations of Power in the Prehispanic Andes, Archeological Papers of the American Anthropological Association 14 (2005)"]

- id: paracas-800bc
  year: -799
  endYear: -99
  title:
    ko: "파라카스 문화의 무덤과 직물(기원전 800~기원전 100)"
  summary:
    ko: "페루 남부 이카 지방 해안의 파라카스 문화는 기원전 800년 무렵부터 기원전 100년 무렵까지 이어졌다. 사람들은 남쪽 해안의 친차·피스코·이카 계곡에 퍼져 살았다. 이 문화는 파라카스 반도의 유적에서 가장 잘 알려졌는데, 1920년대 훌리오 텔로가 처음 본격 조사했다. 도기 양식은 이른 시기(기원전 840~500년 무렵), 중기(기원전 500~380년 무렵), 늦은 시기(기원전 380~260년 무렵)로 나뉘며, 늦은 시기에는 색이 덜 화려해졌다. 무덤은 두 곳이 대표적이다. 세로콜로라도의 '카베르나스'는 구덩이 무덤으로 여러 세기에 걸쳐 거듭 썼고, '네크로폴리스'로 불리는 와리 카얀에서는 천으로 싼 채 앉힌 시신이 약 420구 나왔으며 기원전 300~200년 무렵의 것이 많고 매장은 기원후 250년 무렵까지 이어졌다. 무덤에서 나온 직물과 자수는 안데스에서 손꼽히게 정교하며, 목화와 낙타과 짐승의 털을 쓰고 고도가 다른 곳에서 들여온 염료로 여러 빛깔을 냈다. 카베르나스 무덤 두개골은 대부분 머리 모양을 바꿔 놓았는데 주로 위로 길게 세운 꼴과 두 갈래로 눌린 꼴이고 두 갈래 꼴은 여성에게 더 많았다. 두개골에 구멍을 뚫는 수술 흔적도 남았는데 환자의 약 39퍼센트가 수술 중이나 직후에 죽은 것으로 추산된다. 친차 계곡 등에서는 물을 끌어 대는 시설을 크게 갖췄다. 헬레인 실버먼 같은 학자들은 나스카 문화가 파라카스에서 이어졌다고 보며, 그 마지막을 기원전 150년 무렵 토파라 사람들의 침입으로 설명하던 견해는 최근 연대 분석으로 도전받고 있다. 이어지는 이야기는 「나스카 문화와 지상화(기원전 200~기원후 500)」(뒤의 사건)에 있다."
  subjects: [paracas-culture]
  tags: [culture, society]
  sources: ["Anne Paul (ed.), Paracas Art and Architecture: Object and Context in South Coastal Peru (University of Iowa Press, 1991)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)", "Helaine Silverman, Donald A. Proulx, The Nasca (Blackwell, 2002)"]

- id: nakbe-600bc
  year: -599
  endYear: -299
  title:
    ko: "나크베와 마야 저지대의 첫 큰 건축(기원전 600~기원전 300)"
  summary:
    ko: "과테말라 북부 페텐의 미라도르 분지에 있는 나크베는 엘 미라도르에서 남쪽으로 12~13킬로미터 떨어진 곳에 자리한 마야 문명의 이른 큰 중심지이다. 이곳에는 기원전 1400년 무렵부터 사람이 살았다고 하며, 마을은 선고전기 중기(기원전 1000~400년 무렵)를 지나며 큰 건축을 올리는 도시로 자랐다. 큰 건축은 기원전 8세기에 시작되었고 높이 약 18미터의 단이 쌓였으며, 가장 큰 피라미드인 구조물 1은 앞면 양쪽을 큰 회반죽 가면 둘로 꾸미고 꼭대기에 지붕 얹은 건물 셋을 올렸다. 건물들은 둑길로 서로 이어졌고 한 둑길은 엘 미라도르까지 닿았다. 중앙 지구에서는 조개·옥·흑요석 같은 먼 곳 물자가 나와 사회가 점점 복잡해졌음을 보여 준다는 것이 발굴을 이끈 리처드 한센의 해석이다. 이 시기 마야 저지대는 올멕의 영향을 받았다고 보는데, 이는 「라벤타와 올멕의 쇠퇴(기원전 900~기원전 400)」(앞의 사건)과 이어서 볼 수 있다. 엘 미라도르에서는 석회 반죽을 만드느라 나무를 많이 태워 숲이 줄고 흙이 쓸려 내렸다는 연구가 있어, 이 분지의 큰 건축은 환경에 큰 부담을 주었다. 나크베 유적은 1930년 항공 사진으로 처음 알려졌고, 1962년 이언 그레이엄이 첫 발굴을 했으며 한센이 이끄는 조사단이 훨씬 큰 규모로 조사했다. 선고전기 후기 앞머리를 지나면서 중심은 엘 미라도르로 옮겨 갔고, 나크베는 큰 중심으로서는 쇠퇴해 천 년 가까이 거의 버려졌다. 문서마다 이곳의 끝을 서기 100~200년 무렵으로도 적는다. 이어지는 이야기는 「엘 미라도르와 산바르톨로 벽화(기원전 300~기원전 100)」(뒤의 사건)에 있다."
  subjects: [maya-civilization]
  tags: [society, culture]
  sources: ["Richard D. Hansen, 'Continuity and Disjunction: The Pre-Classic Antecedents of Classic Maya Architecture', in Function and Meaning in Classic Maya Architecture (Dumbarton Oaks, 1998)", "Michael D. Coe, The Maya (Thames & Hudson)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: monte-alban-500bc
  year: -499
  endYear: -99
  title:
    ko: "몬테알반 건설과 사포텍의 오아하카 계곡(기원전 500~기원전 100)"
  summary:
    ko: "멕시코 남부 오아하카 계곡 한가운데의 산등성이에 기원전 500년 무렵 사포텍 사람들이 몬테알반을 세웠다. 이 능선은 북쪽의 에틀라, 동쪽의 틀라콜룰라, 남쪽 두 갈래 계곡이 만나는 자리로, 중심부는 해발 약 1,940미터이고 계곡 바닥에서 약 400미터 솟아 있다. 새 도읍이 서기 전에는 산호세 모고테가 계곡의 큰 중심지였는데, 몬테알반이 자라면서 산호세 모고테의 인구가 크게 줄어 이곳 지배층이 새 도읍을 세우는 데 함께했다는 해석이 있다. 몬테알반 1단계(기원전 500~300년 무렵)에 새긴 돌판 '단산테'는 300점 넘게 기록되었다. 19세기에는 춤추는 사람으로 읽었으나 지금은 제물이 된 포로를 나타낸 것으로 본다. 어떤 돌판에는 달력 표기와 글자 같은 기호가 있어 사포텍이 일찍 문자를 썼다는 증거로 거론되지만, 얼마나 이른 문자인지는 학자마다 평가가 갈린다. 기원전 100년 무렵부터 기원후 200년 무렵의 2단계가 시작될 때 인구가 약 1만 7,200명으로 어림되어 당시 메소아메리카에서 손꼽히는 도시였다. 근처의 아손파와 엘 가요 언덕도 옛 도시 일부로 본다. 몬테알반이 서기 전인 기원전 500년 무렵 앞에는 이 언덕에 사람이 살지 않았고, 뒤 시대의 교류는 「테오티우아칸의 전성과 메소아메리카 교류(300~550)」(뒤의 사건)에서 다룬다. 이 도시는 1931년 알폰소 카소가 이끈 큰 발굴로 알려졌고 그 발굴은 18년 동안 이어졌다. 계곡의 여러 마을이 새 도읍 하나로 모인 이 일을 마커스와 플래너리는 '시노이키즘'이라 부른다. 몬테알반이 정치 중심 자리를 잃는 때는 기원후 750년 무렵으로 보며 그 이야기는 「몬테알반의 버려짐과 마야 남부 저지대의 붕괴(750~900)」(뒤의 사건)에 있다."
  subjects: [monte-alban]
  tags: [politics, society]
  sources: ["Joyce Marcus, Kent V. Flannery, Zapotec Civilization: How Urban Society Evolved in Mexico's Oaxaca Valley (Thames & Hudson, 1996)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)", "Richard E. Blanton, Monte Albán: Settlement Patterns at the Ancient Zapotec Capital (Academic Press, 1978)"]

- id: adena-500bc
  year: -499
  endYear: 100
  title:
    ko: "아데나 문화의 무덤 둔덕(기원전 500~기원후 100)"
  summary:
    ko: "아데나 문화는 우드랜드 시대 초기(기원전 1000~200년 무렵)에 속하며 기원전 500년 무렵부터 기원후 100년 무렵까지 오하이오주를 중심으로 켄터키·웨스트버지니아·인디애나·일리노이와 위스콘신 남부, 펜실베이니아 서쪽 끝에 퍼졌다. 이름은 오하이오주 칠리코시 가까이에서 토머스 워딩턴의 땅에 있던 큰 둔덕에서 따왔다. 아데나 사람들은 지름 6미터에서 90미터쯤에 이르는 원뿔꼴 둔덕을 쌓았고, 둔덕은 흙과 불탄 무덤 건물을 번갈아 덮어 올린 것이다. 둔덕은 무덤이자 의례 장소이며 사람들이 모이는 자리였다고 보는데, 오늘 남은 것은 많지 않다. 웨스트버지니아주 문즈빌의 그레이브크리크 마운드는 높이 약 19미터, 지름 약 73미터로 1838년 전문가가 아닌 사람들이 굴을 파 안쪽 증거를 많이 잃었다. 한 곳에 사는 사람이 많지 않아 사람들은 한두 채씩의 집으로 이루어진 작은 마을에 흩어져 살며 사슴·엘크·곰·칠면조를 사냥하고 씨앗·풀·견과를 모으는 한편 호박·박·해바라기·명아주·마디풀 같은 토종 작물을 길렀다. 오대호의 구리가 거래되어 팔찌·고리·구슬·실패꼴 장식으로 두드려 만들었다. 오하이오 서펀트 마운드는 아데나가 만들었다고 말해 왔으나 결정적 증거가 없고, 연대는 기원전 300년 무렵이라는 설과 기원후 1070년 무렵 뒤의 문화라는 설이 갈린다. 아데나라는 이름은 고고학자들이 붙인 것이라 이들이 스스로 부른 이름은 알 수 없다. 아데나는 호프웰 문화의 앞선 전통으로 여겨지며, 호프웰을 아데나가 크게 다듬어진 모습으로 보기도 한다. 그 이야기는 「호프웰 문화의 교류권(기원전 200~기원후 500)」(뒤의 사건)에 있다. 이 문화는 단일한 사회라기보다 장례와 의례를 나눈 여러 사회였다."
  subjects: [adena-culture]
  tags: [culture, society]
  sources: ["Brian M. Fagan, Ancient North America: The Archaeology of a Continent (Thames & Hudson)", "Bradley T. Lepper, Ohio Archaeology: An Illustrated Chronicle of Ohio's Ancient American Indian Cultures (Orange Frazer Press, 2005)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: dorset-500bc
  year: -499
  endYear: 500
  title:
    ko: "도싯 문화와 북극 해안의 사람들(기원전 500~기원후 500)"
  summary:
    ko: "도싯 문화는 기원전 500년 무렵부터 캐나다 북극과 그린란드 해안, 래브라도·뉴펀들랜드에서 살았던 북극 사람들의 문화로, 끝나는 해는 1000년에서 1500년 사이로 문서마다 갈린다. 이름은 학술용으로 누나부트의 케이프도싯(킹가이트)에서 따왔는데, 1925년 다이아몬드 제너스가 이곳 유물로 이 문화를 알아보았다. 그린란드 북부의 인디펜던스 I(기원전 2400~1300년 무렵)도 앞선 문화로 거론된다. 프리도싯은 기원전 3200~850년 무렵(보정 연대) 동캐나다 북극에, 사카크 문화는 기원전 2500~800년 무렵 서그린란드에 있었고, 초기 도싯이 어느 쪽에서 나왔는지는 갈린다. 사람들은 이 둘 가운데 하나에서 갈라져 나왔다고 보지만, 앞 문화가 쓰던 활과 송곳을 도싯 사람들이 쓰지 않은 까닭으로는 바다 사냥으로의 쏠림과 기술을 아는 사람의 상실이 거론된다. 주로 바다 포유류를 사냥했고, 바다얼음 숨구멍에서 기다렸다가 물범을 잡았으며 때로 바다코끼리와 일각고래도 잡았다. 육지 짐승은 드물게만 사냥했고 개를 키웠다는 증거도 없다. 도구로는 작살용 세모꼴 돌날과 조각용 정, 활석을 깎아 만든 기름 등잔(쿨리크)이 대표적이다. 남은 집터는 해안에 모인 작은 마을을 보여 주며, 겨울에는 바다얼음 위에서 물범을 잡고 여름에는 해안을 따라 옮겨 다닌 것으로 본다. 이들은 아주 작은 조각상과 가면을 만들었으며 이는 샤머니즘 전통을 암시한다. 문화는 초기(기원전 500~기원후 1년 무렵), 중기(1~500년 무렵), 후기(500~1000년 무렵)로 나눈다. 이누이트 구전에는 투니트라는 겁 많고 활이 없는 사람들이 전하는데, 도싯과 이어지는지는 학자들이 따져 왔다. 후기 도싯의 끝과 툴레인의 이동은 「툴레인의 동쪽 이동과 도싯 문화의 끝(1000~1300)」(뒤의 사건)에 있다."
  subjects: [dorset-culture]
  tags: [culture, society]
  sources: ["Robert McGhee, Ancient People of the Arctic (UBC Press, 1996)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "Brian M. Fagan, Ancient North America: The Archaeology of a Continent (Thames & Hudson)"]

- id: el-mirador-300bc
  year: -299
  endYear: -99
  title:
    ko: "엘 미라도르와 산바르톨로 벽화(기원전 300~기원전 100)"
  summary:
    ko: "과테말라 북부 페텐의 엘 미라도르는 기원전 6세기부터 서기 1세기에 걸쳐 번성했고, 기원전 3세기부터 마야 문명의 선고전기 도시 가운데 가장 번창한 곳이다. 도시 중심은 약 26제곱킬로미터에 수천 채의 건물이 모인 구역이며, 세 큰 건축군 가운데 라단타는 높이 약 72미터, 부피 약 280만 세제곱미터로 세계에서 가장 큰 피라미드에 드는 것으로 꼽힌다. 엘 티그레 복합구는 높이 약 55미터이고, 물을 모으는 수로 둑은 회반죽 부조로 꾸몄다. 이 분지 일대가 기원전 3세기에 칸 왕국이라는 이른 국가였다는 학설이 있으며, 같은 때 고지대에서는 카미날후유가 비슷한 국가였다고 본다. 지배자를 가리키는 아하우라는 직함의 가장 이른 흔적은 홀물 가까운 코 유적의 기원전 350~300년 무렵 무덤에서 나왔다는 해석이 있고, 산바르톨로에서는 기원전 300~200년 무렵의 것이 나왔다는 연구도 있다. 엘 미라도르는 1962년 이언 그레이엄이 처음 지도를 만들었고 뒤이어 브루스 달린과 레이 매시니가 조사했으며 리처드 한센이 본격적인 조사와 보존 사업을 이끌었다. 한편 가까운 산바르톨로에서는 2001년 윌리엄 새턴이 이끈 조사대가 피라미드 속의 방에서 벽화를 찾았고, 방사성 탄소로 기원전 100년 무렵의 것으로 측정된 이 벽화는 당시 가장 이른 마야 벽화로 알려졌다. 벽화에는 옥수수 신의 삶과 창조 신화가 그려져 있어 마야에 이미 왕권이 있었다고 보게 만든다. 산바르톨로에서 나온 기원전 300년 무렵 돌 블록의 글은 가장 이른 마야 문자의 하나이다. 이 일은 「나크베와 마야 저지대의 첫 큰 건축(기원전 600~기원전 300)」(앞의 사건)에서 이어진다. 서기 100~150년 무렵 엘 미라도르는 거의 버려졌고 그 까닭은 논의가 이어지며, 같은 때 고지대에서는 비석 새기기가 그쳤다. 이 터는 고전기 후기에 작게 다시 쓰이다가 9세기 끝 무렵 완전히 버려졌다."
  subjects: [maya-civilization]
  tags: [society, culture]
  sources: ["Richard D. Hansen, 'Continuity and Disjunction: The Pre-Classic Antecedents of Classic Maya Architecture', in Function and Meaning in Classic Maya Architecture (Dumbarton Oaks, 1998)", "Michael D. Coe, The Maya (Thames & Hudson)", "William A. Saturno, David Stuart, Boris Beltrán, 'Early Maya Writing at San Bartolo, Guatemala', Science 311 (2006)"]

- id: hopewell-200bc
  year: -199
  endYear: 500
  title:
    ko: "호프웰 문화의 교류권(기원전 200~기원후 500)"
  summary:
    ko: "호프웰 문화는 기원전 200년 무렵(위키백과 정보 상자는 기원전 100년 무렵)부터 기원후 500년 무렵까지 북아메리카 동부 숲 지대 곳곳의 여러 사회를 이은 교류권과 그 의례 문화를 가리킨다. 댄시의 글은 호프웰의 기원을 두고 오하이오 호프웰 사람들이 뉴욕 서부에서 남쪽으로 옮겨 왔다는 설과 일리노이 서부에서 퍼졌다는 설을 든다. 교역은 온타리오호 북안에서 플로리다 크리스털강 둔덕까지 닿았다. 구리·운모·흑요석·회색곰 이빨·민물 진주·바닷조개·소량의 은이 장신구와 의례 물품으로 만들어졌고, 오하이오의 호프웰 사람들은 흑요석을 얻으러 와이오밍 옐로스톤의 흑요석 절벽까지 순례했을 수 있으며 마운드 시티의 무덤 부장품 가운데 그 흑요석이 있다. 활석 담뱃대는 멀리까지 퍼졌고 마운드 시티의 '담뱃대 둔덕'에서는 돌 담뱃대가 200개 넘게 나왔다. 오하이오 스키오토강 유역의 칠리코시 일대에 의례 시설이 가장 빽빽했고 마운드 시티·호프턴·세이프·하이뱅크스 같은 유적이 있으며, 뉴어크의 팔각형 토루는 50에이커(약 20헥타르) 넘고 달 관측소였다는 설이 있다. 포츠머스 토루는 기원전 100년부터 기원후 500년 사이에 만들어졌다. 사람들은 강가의 한두 가구 임시 마을에서 사냥·채집과 원예로 살았고 지도자는 군대가 아니라 설득과 주고받음으로 영향력을 얻은 '빅맨'이었다고 본다. 이 이름은 1891~1892년 워런 무어헤드가 오하이오 로스 카운티의 호프웰 마운드 군을 조사하면서 퍼졌다. 앞 시대의 무덤 둔덕 전통은 「아데나 문화의 무덤 둔덕(기원전 500~기원후 100)」(앞의 사건)에 있다. 기원후 500년 무렵 교환망이 끊기고 토루 쌓기가 멈췄고 그 까닭으로 전쟁·추운 기후·활과 화살의 도입·교역 감소·본격적인 농업으로의 전환이 거론되나 하나로 확정되지 않았다. 호프웰 의례 토루군은 유네스코 세계유산(2023년)이 되었다."
  subjects: [hopewell-culture]
  tags: [culture, economy]
  sources: ["Bradley T. Lepper, Ohio Archaeology: An Illustrated Chronicle of Ohio's Ancient American Indian Cultures (Orange Frazer Press, 2005)", "Mark Lynott, Hopewell Ceremonial Landscapes of Ohio: More Than Mounds and Geometric Earthworks (Oxbow Books, 2014)", "Brian M. Fagan, Ancient North America: The Archaeology of a Continent (Thames & Hudson)"]

- id: nasca-200bc
  year: -199
  endYear: 500
  title:
    ko: "나스카 문화와 지상화(기원전 200~기원후 500)"
  summary:
    ko: "페루 남부의 건조한 해안, 나스카강 골짜기와 이카 골짜기에서는 기원전 200년 무렵(문서에 따라 기원전 100년 무렵)부터 나스카 문화가 번성했고, 그 앞에는 파라카스 문화가 있었다. 직물과 종교 전통 가운데 많은 것이 파라카스에서 이어졌다고 본다. 나스카는 1기(프로토 나스카), 2~4기(이른 나스카), 5기(중기 나스카), 6~7기(늦은 나스카)로 나뉘며 이른 나스카는 대략 1~450년으로 잡는다. 사람들이 의례를 하고 잔치를 벌인 곳은 카와치로, 도시가 아니라 둔덕과 광장이 모인 의례 중심지였고 나스카 3단계 끝이나 4단계 앞머리에 그 쓰임이 멈췄다. 나스카를 국가가 아니라 같은 문화를 나눈 여러 수장 사회로 보는 연구자가 많다. 사막에는 붉은 자갈을 걷어 밝은 흙을 드러내는 방식으로 새·동물·기하 무늬의 지상화를 그렸다. 일부 그림은 축구장만 하고, 쓰임을 두고는 어느 설도 결정적 증거가 없다. 이 지상화가 포함된 '나스카와 팔파의 지상화'는 1994년 유네스코 세계유산이 되었다. 중기 나스카에는 지하 수로인 푸키오를 파서 지하수를 끌어 썼고, 지금도 수십 개가 쓰인다. 토기는 모든 사회 계층에 널리 퍼졌고 12가지가 넘는 색으로 칠했으며 아홉 단계에 걸쳐 사실적인 그림에서 복잡한 추상 무늬로 양식이 바뀌었다. 잘라 말린 머리를 의례에 쓴 모습이 토기 그림에 나타나고 100개 넘는 머리가 미라로 남았다. 쇠퇴는 기원후 500년 무렵 시작되어 750년 무렵(정보 상자는 800년)까지 이어졌다. 카와치의 쓰임이 멈춘 것을 안데스 전역의 가뭄과 잇는 연구자들이 있다. 앞 문화는 「파라카스 문화의 무덤과 직물(기원전 800~기원전 100)」(앞의 사건), 끝은 「모체 문화와 나스카 문화의 끝(600~800)」(뒤의 사건)에 있다."
  subjects: [nasca-culture]
  tags: [culture, society]
  sources: ["Helaine Silverman, Donald A. Proulx, The Nasca (Blackwell, 2002)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)", "Anne Paul (ed.), Paracas Art and Architecture: Object and Context in South Coastal Peru (University of Iowa Press, 1991)"]

- id: teotihuacan-100bc
  year: -99
  endYear: 250
  title:
    ko: "테오티우아칸의 성립과 태양의 피라미드(기원전 100~기원후 250)"
  summary:
    ko: "멕시코 분지 북동쪽에 기원전 600년 무렵부터 마을이 있었고, 도시 테오티우아칸은 기원전 100년 무렵에 성립했으며 큰 기념 건축은 기원후 250년 무렵까지 지어졌다. 분지 남쪽 쿠이쿠일코가 시틀레 화산의 분출로 힘을 잃고 그 주민이 이 도시로 옮겨 왔다는 설명이 있는데, 분출이 기원전 100년 무렵이라는 설과 기원후 3세기라는 설로 연대가 갈린다. 태양의 피라미드는 높이 약 65미터, 밑면 약 219×232미터로 기원후 100년 무렵까지 얼개가 갖춰졌고(다른 글은 200년 무렵으로 적는다) 뒤로도 덧쌓았다. 달의 피라미드는 죽은 자의 길 북쪽 끝에 있으며, 이 길은 길이가 문서에 따라 2~4킬로미터이고 너비는 40~45미터이다. 아즈텍이 붙인 이름 테오티우아칸은 '신들이 태어난 곳'쯤으로 풀이되는데 도시가 무너진 지 오랜 뒤의 이름이다. 깃털 달린 뱀 신전은 시우다델라 가운데에 있으며 기원후 200년 무렵(미코틀리 단계)에 봉헌되었다고 본다. 인구는 최대 10만 명 안팎이라는 추산과 450년 무렵 15만~25만 명이라는 추산이 갈리고, 도시 넓이도 30제곱킬로미터 넘는 것부터 약 83제곱킬로미터까지 문서마다 다르다. 사람들은 한 단지에 60~100명이 사는 2천여 곳의 공동 주거 단지에서 살았고, 파추카 광산의 흑요석을 가공해 메소아메리카 곳곳에 파는 일이 도시의 가장 큰 산업이자 부의 원천이었다. 이 도시가 제국이었는지는 학자들이 다툰다. 1905년 레오폴도 바트레스가 큰 발굴과 복원을 시작했고 1910년 독립 100주년에 맞춰 태양의 피라미드가 복원되었다. 1987년 유네스코 세계유산이 되었다. 도시의 끝은 「테오티우아칸 중심부의 화재와 버려짐(550~650)」(뒤의 사건)에 있다."
  subjects: [teotihuacan]
  tags: [society, economy]
  sources: ["René Millon, Urbanization at Teotihuacán, Mexico (University of Texas Press, 1973)", "George L. Cowgill, Ancient Teotihuacan (Cambridge University Press, 2015)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)"]
