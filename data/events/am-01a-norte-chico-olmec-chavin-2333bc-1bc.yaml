# 아메리카 사건 3묶음 갈래 01a: 안데스 해안 문명에서 올멕·차빈·테오티우아칸의 성립까지 (기원전 2333년 ~ 기원전 1년)
# 범위: 노르테 치코 문명·발디비아 문화, 마야 문명의 첫 마을과 선고전기 큰 건축(나크베·엘 미라도르·산바르톨로), 올멕(산로렌소·라벤타), 차빈 문화·파라카스 문화·나스카 문화, 몬테알반, 북아메리카의 포버티 포인트·아데나·호프웰 문화, 북극의 도싯 문화, 테오티우아칸의 성립(기원전 2333년~기원후 250년 시작 사건).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: year는 천문 연도(기원전 N년 = 1−N), 글에는 '기원전 N년', id 끝은 -Nbc. 고고 문화의 연대는 방사성 탄소 연대라 '무렵'을 붙이고 문서마다 갈리는 해는 한 구절로 밝혔다. 노르테 치코 문명·발디비아 문화는 성립(기원전 3500년 무렵)이 연도 막대의 하한(기원전 2333년)보다 앞서므로 그 뒤 해에 이미 번성하던 모습으로 썼다.
# 달력: 이 시기에는 날짜(일)를 쓰지 않았고 연대는 모두 연 단위의 근사값이다.
# 이름 규칙: 항목 이름(노르테 치코 문명·발디비아 문화·마야 문명·포버티 포인트 문화·올멕·차빈 문화·파라카스 문화·몬테알반·아데나 문화·도싯 문화·호프웰 문화·나스카 문화·테오티우아칸)을 글자 그대로 썼다. 그 밖의 유적·인물 이름은 위키백과 한국어판 표제, 없으면 저장소 표기 사전과 외래어 표기법을 따랐다.
# 지도 결정과의 관계: 이 시기 항목은 모두 땅을 그리지 않는 항목이라 subjects에만 두고 links는 쓰지 않았다. 항목 기간과 사건 기간이 다른 경우는 글에 문서마다 다른 해를 한 구절로 적었다.
