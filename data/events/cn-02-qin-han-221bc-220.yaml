# 중국 사건 2차 묶음: 진의 통일에서 한(전한·신·후한)의 쇠퇴와 적벽 대전까지 (기원전 221 ~ 220, 작업 cn-02)
# 범위: 진의 통일 제국(황제 칭호·군현제·문자·도량형·화폐), 몽염의 흉노 공격과 장성, 영남 정복과 영거, 분서갱유, 진승·오광의 난과 진의 멸망, 홍문의 연회와 항우의 18왕 분봉, 초한 전쟁(해하),
#   한 고조의 건국과 군국제, 백등산 포위와 화친, 묵돌 선우의 흉노 국가, 여후, 문경지치, 오초 7국의 난, 한 무제(중앙집권·유교 국교화·장건·흉노 전쟁·허시 회랑·염철 전매·사마천과 『사기』),
#   무고의 난과 곽광, 염철 논쟁, 선제와 서역도호부, 흉노의 분열과 호한야 선우·왕소군, 전한 말의 외척 정치, 왕망의 찬탈과 신의 개혁, 녹림·적미와 신의 멸망, 광무제의 후한 건국과 통치,
#   남흉노의 입새, 불교의 전래, 반초의 서역 경영, 외척과 환관, 강족 전쟁, 단석괴의 선비 연맹, 채륜의 종이와 후한의 학술, 당고의 금, 황건적의 난, 동탁, 조조의 화북 평정과 관도 전투, 적벽 대전, 서기 2년의 호적.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 기원전 221~서기 220년 지도에서 생기거나 끝난 항목(진·전한·신·후한, 동호·오환·선비·흉노)과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 진의 흉노 공격과 백등산 포위 사건에서 묵돌 선우의 동호 격파(`modun-donghu-209`), 진의 영남 정복에서 한 무제의 남월 정복(`han-south-conquest-112`),
#   신의 개혁에서 고구려현 습격(`goguryeo-hyeondo-14`, 고구려를 subjects로), 광무제의 통치에서 왜의 금인(`wa-gold-seal-57`, 왜를 subjects로), 사마천 사건에서 『사기』 조선열전(고조선을 subjects로),
#   남흉노·선비 사건에서 북흉노의 이동(`xiongnu-north-91`, 선비 사건은 부여를 subjects로), 조조 사건에서 오환 정벌(`cao-cao-wuhuan-207`), 반초 사건에서 이미 있는 유럽 쪽 「로마와 한」 사건을 한두 문장으로 가리켰다.
#   한국사 01·02번 파일의 사건(위만 조선·고조선 멸망·군현 설치 등)은 다시 만들지 않았다. 사건 글에서는 「제목」으로 가리킨다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 221년 = −220)로 넣고 본문에는 '기원전 221년'처럼 적었다.
# 달력: 1912년 앞 중국의 날짜는 음력이라 달만 적은 것도 음력 달이다. 진 시대에는 해가 음력 10월에 시작해 사서의 해와 율리우스력 해가 한 해 어긋나는 달이 있어 달 이름은 최소로만 적었다.
# 이름 규칙: 신해혁명(1911) 앞 인물은 한자음(시황제·유방·한신·왕망), 옛 지명은 한자음(장안·함양), 지금도 쓰는 지명은 중국어 표기(뤄양·청두), 흉노 선우는 굳은 표기(묵돌·호한야·질지). 한(漢)의 두 시기는 전한·후한으로 구분하되 제목에서는 필요할 때만 쓴다.
# places: 전투가 있는 사건도 위치가 학설로 갈리는 곳(백등산·해하·적벽 등)은 달지 않았다.
# 서술은 새로 작성. 출처는 사료(『사기』 『한서』 『후한서』 등)와 표준 개설서. 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: qin-empire-221bc
  year: -220
  endYear: -209
  title:
    ko: "진 시황제의 통일 제국: 황제 칭호와 군현제, 문자·도량형·화폐의 통일(기원전 221~210)"
  summary:
    ko: "기원전 221년 진의 왕 정(政)은 마지막 남은 제를 항복시켜 전국 시대를 끝냈다. 그는 ‘삼황’과 ‘오제’를 아우르는 뜻으로 ‘황제’라는 칭호를 만들어 스스로 시황제라 했고, 죽은 왕의 업적을 신하가 평가하는 시호 제도는 없앴다. 승상 왕관은 먼 땅에 왕자들을 봉하자고 했으나 정위 이사가 주 왕실의 봉건이 오랜 싸움을 낳았다며 반대하자, 시황제는 군현제를 택해 천하를 처음 36군으로 나누고 군마다 군수·군위·군감을 중앙에서 보냈다. 이어 법령과 도량형, 수레바퀴 사이의 폭(거동궤), 문자를 하나로 맞추어 나라마다 다르던 글자꼴을 소전(小篆) 중심으로 정리하게 했고, 둥근 동전에 네모난 구멍을 낸 반량전을 화폐로 삼았다. 천하의 무기를 거두어 녹이고 부호 12만 호를 도읍 함양으로 옮겼으며, 함양에서 사방으로 뻗는 큰길(치도)을 놓았다. 1975년 후베이성 윈멍 수호지의 진나라 무덤에서 나온 대나무 조각 글(수호지 진간)은 진의 법과 관리 행정이 얼마나 촘촘했는지를 보여 준다. 이 정책은 상앙 이래 진이 다듬어 온 제도를 천하로 넓힌 것이었다. 도량형은 진 본래의 기준에 맞추었고, 옛 여섯 나라의 성곽을 헐어 반란의 거점이 될 곳을 없앴다. 군과 현에는 중앙에서 보낸 관리가 문서로 일을 처리했고, 법을 어긴 사람은 형벌 외에 성벽 쌓기나 능 공사 같은 노역(성단 따위)으로 보내졌다. 화폐는 황금을 상등, 반량 동전을 하등으로 삼고 구슬·옥·은·주석 따위는 장식과 보물로만 쓰게 했다. 시황제는 기원전 220년부터 모두 다섯 차례 전국을 순행했고 기원전 210년 순행 길에 사구(지금의 허베이성)에서 죽었다. 무거운 부역과 형벌이라는 대가가 따랐지만, 이때 갖춘 제도의 틀은 한을 거쳐 뒤 왕조들에 이어졌다."
  subjects: [qin, qi-state]
  tags: [politics]
  sources: ["『사기』 진시황본기", "『사기』 이사열전", "『한서』 예문지", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: qin-lingnan-219bc
  year: -218
  endYear: -213
  title:
    ko: "진의 영남 정복과 영거(기원전 219~214)"
  summary:
    ko: "진은 중원을 통일한 뒤 오령(五嶺) 남쪽 ‘영남’의 월(越) 여러 집단으로 눈을 돌렸다. 기원전 219년 도위 도수가 이끄는 군대가 다섯 갈래로 남쪽으로 내려갔다. 『회남자』는 그 수를 50만이라 하나 과장일 가능성이 크다. 병력과 곡식을 나르기 위해 감(監) 록(祿)이 샹창장강과 리창장강을 잇는 운하 영거(靈渠, 지금의 광시성 싱안)를 팠다. 서구 지역의 군장 역우송이 죽은 뒤에도 월 사람들은 숲속에 숨어 오래 저항했고, 도수 자신도 싸움 중에 죽었다고 전한다. 기원전 214년 진은 마침내 이 땅에 계림·남해·상(象)의 3군을 두고 죄를 지은 사람들과 가난한 사람들을 옮겨 월 사람들과 섞여 살게 했다. 남해군의 중심은 번우(지금의 광저우)였고, 용천현 현령이던 조타가 뒤에 남해군 일을 맡았다. 당시 영남에는 문자 기록을 남기지 않은 여러 월(越) 집단이 흩어져 살았고, 한자 문헌은 이들을 두루 ‘백월’이라 부르며 자세한 사정은 적지 않았다. 『회남자』는 진의 군대가 보급이 어려워 3년 가까이 갑옷을 벗지 못하고 활시위를 풀지 못했다고 전한다. 『사기』 진시황본기는 도망자·데릴사위·상인을 보내 이 땅을 채웠다고 적는다. 상군의 위치는 광시 서남에서 베트남 북부까지 학설이 갈린다. 진의 실제 지배는 번우·계림 같은 거점과 교통로에 한정되었고 산간 지역에는 월 사람들의 집단이 남아 있었다고 본다. 영거 덕분에 중원의 곡식과 병력이 후난을 거쳐 광시로 내려갈 수 있었고, 이 물길의 일부는 지금도 남아 있다. 영거는 창장강 물줄기와 주창장강 물줄기를 이어 남북 교통의 길을 열었다. 진이 무너지자 조타는 계림·상군을 합쳐 기원전 204년 남월의 왕(무왕)을 칭했고, 이 나라는 기원전 111년 한 무제에게 멸망했다(「한 무제의 남월·민월·서남이 정복」(뒤의 사건))."
  subjects: [qin]
  tags: [war, politics]
  sources: ["『사기』 진시황본기", "『사기』 남월열전", "『회남자』 인간훈", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: qin-xiongnu-wall-215bc
  year: -214
  endYear: -209
  title:
    ko: "몽염의 흉노 공격과 진의 장성(기원전 215~210)"
  summary:
    ko: "기원전 3세기 말 흉노는 황허강이 크게 굽는 오르도스(하남) 일대까지 내려와 있었다. 기원전 215년 시황제는 방사가 바친 예언서의 ‘진을 망하게 할 것은 호(胡)’라는 글귀를 흉노를 가리킨다고 보고, 장군 몽염에게 군사 30만(『사기』의 수)을 주어 북쪽을 치게 했다. 몽염은 황허강 남쪽을 되찾고, 이듬해 황허강을 따라 34개 현(흉노열전은 44현이라 적는다)을 두어 죄인들을 이주시켰다. 진은 이미 있던 진·조·연의 북쪽 성벽을 고치고 이어, 서쪽 임조(지금의 간쑤성 민현)에서 동쪽 요동에 이르는 성벽을 세웠다고 『사기』는 전한다. 기원전 212년에는 구원(지금의 내몽골 바오터우 부근)에서 운양(산시성)까지 곧게 이어진 군사 도로(직도)를 놓기 시작했다. 이때 쌓은 성벽은 흙을 다진 것이 많았고 지금 남아 있는 벽돌 성벽은 대부분 명 때의 것이라 서로 다르다. 장성과 도로 공사에는 수십만 명이 동원되었다고 하나 정확한 수는 알 수 없다. 이 일대의 구원·운중은 일찍이 조 무령왕이 기병 전술을 받아들여 넓힌 땅과 이어져 있었다. 공사에는 죄인과 평민이 징발되었고, 새로 둔 현으로 옮겨진 사람들의 부담도 컸다. 이런 부담이 뒤의 진승·오광의 난의 불씨가 되었다고 본다. 시황제가 죽은 뒤 몽염은 부소와 함께 조고와 이사가 고친 조서로 죽임을 당했다. 가의는 「과진론」에서 흉노가 감히 남쪽으로 내려와 말을 먹이지 못했다고 썼다(과장일 수 있다). 오르도스에는 군현이 들어서 목축민이 쓰던 풀밭이 농경민에게 넘어갔다. 흉노의 두만 선우는 북쪽으로 물러났지만, 기원전 210년 시황제가 죽고 진이 내란에 빠지자 몽염이 죽고 그 군대가 빠져나가 흉노는 오르도스를 되찾았다(『사기』 흉노열전). 이 무렵 두만의 아들 묵돌이 선우가 되어 흉노를 하나로 묶었다(앞뒤 사정은 「흉노 묵돌 선우의 동호 격파와 오환·선비」(뒤의 사건))."
  subjects: [qin, xiongnu]
  links:
    - { from: qin, to: xiongnu, note: "오르도스(하남) 땅 획득과 장성 축조(기원전 215~214)" }
  tags: [war, politics]
  sources: ["『사기』 몽염열전", "『사기』 진시황본기", "『사기』 흉노열전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: books-scholars-213bc
  year: -212
  endYear: -211
  title:
    ko: "분서(기원전 213)와 갱유(기원전 212)"
  summary:
    ko: "기원전 213년 함양궁의 잔치에서 박사 순우월이 옛 주나라처럼 자제들을 제후로 봉해야 한다고 말했다. 승상 이사는 옛것을 내세워 지금을 비난하는 일이 나라의 법령을 흔든다며 반박했고, 시황제는 이사의 건의를 받아들여 책을 거두어 불태우라는 명령을 내렸다. 진의 역사 기록이 아닌 사관의 기록과, 박사관이 맡은 것이 아닌 『시』·『서』와 제자백가의 책은 군수에게 내어 불태우게 했다. 감히 『시』·『서』를 놓고 논하면 저잣거리에서 처형하고, 옛것으로 지금을 비난하면 일족을 죽이며, 명령 뒤 30일 안에 태우지 않으면 이마에 먹물을 새겨 장성 쌓기에 보내기로 했다. 의약·점치기·농사 책은 제외했고, 법을 배우려는 사람은 관리를 스승으로 삼게 했다. 이듬해 불사약을 구해 준다던 방사 노생과 후생이 시황제의 독단을 비판하며 달아나자, 시황제는 함양의 방사와 유생들을 조사해 서로 고발하게 한 끝에 460여 명을 구덩이에 묻어 죽였다(갱유). 맏아들 부소가 간언하자 시황제는 그를 북쪽의 몽염 군대 감독으로 보냈다. 이사는 사사로운 학문이 법령을 비판하고 백성을 미혹한다고 보았다. 민간에 숨겨진 책 가운데 일부는 한이 서고 나서 다시 찾아 복원되었는데, 복생이 『상서』를 외워 전했다는 이야기가 대표적이다. 시황제가 책을 불사르게 한 데는 옛 여섯 나라의 역사 기록이 진을 헐뜯는 것을 막으려는 뜻도 있었다. 『사기』 육국연표 서문은 제후국의 역사서가 이때 특히 많이 불타 진의 기록만 남았다고 한탄한다. 이 사건은 뒷날 유학자들이 진을 비판하는 근거가 되었으나, 갱유에서 죽은 사람이 유생이었는지 방사였는지, 그 수가 얼마나 사실인지는 학자마다 평가가 다르다. 불탄 것은 민간의 책이었고 박사관에 둔 책은 남았지만 뒤에 항우가 함양을 불태울 때 사라졌다고 한다."
  subjects: [qin]
  tags: [politics, culture]
  sources: ["『사기』 진시황본기", "『사기』 이사열전", "『사기』 유림열전", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: chen-sheng-wu-guang-209bc
  year: -208
  endYear: -207
  title:
    ko: "진승·오광의 난과 진의 내란(기원전 209~208)"
  summary:
    ko: "기원전 210년 시황제가 순행 도중 죽자 환관 조고와 승상 이사는 유조를 고쳐 맏아들 부소를 자결하게 하고 막내아들 호해를 세웠다(2세 황제). 호해는 아방궁과 시황제의 무덤 공사를 이어 가며 부역을 더 늘렸다. 기원전 209년 음력 7월 어양의 변경을 지키러 가던 둔수병 900명이 큰비로 길이 막혀 대택향(지금의 안후이성 쑤저우 부근)에서 기한을 넘기자, 법대로라면 모두 처형될 처지였다. 둔장 진승(陳勝)과 오광(吳廣)이 ‘왕후장상의 씨가 따로 있겠느냐’며 봉기를 이끌었다. 이들은 진(陳, 지금의 허난성 화이양)을 차지하고 진승이 왕에 올라 나라 이름을 ‘장초’라 했다. 제·연·조·위 등 옛 여섯 나라의 후손과 호걸이 곳곳에서 일어났고, 진승이 보낸 주문은 수십만 대군을 모아 함곡관을 넘어 희수까지 들어갔으나 장한의 군대에 밀려났다. 진승은 왕을 칭한 지 여섯 달 만에 마부 장가에게 살해되었다. 그 뒤에도 회계에서 일어난 항량·항우 숙질과 패현의 유방이 이어 일어났다. 기원전 208년 이사는 조고의 모함으로 함양에서 허리가 잘려 죽었다. 진승은 품팔이 농사꾼 출신이었고, 두 사람은 물고기 뱃속에 ‘진승왕’이라 쓴 비단을 넣어 두거나 밤에 여우 울음소리를 내는 등 신비한 조작으로 사람들의 믿음을 얻으려 했다. 이들은 부소와 초의 장군 항연의 이름을 내세웠고, 곳곳에서 옛 제·조·위·연의 후손이 왕을 칭했다. 진승은 젊어서 “제비나 참새가 어찌 기러기와 고니의 뜻을 알겠는가”라고 말했다는 일화로 유명하다. 사마천은 그를 제후의 위치로 높여 세가에 실었다. 진의 가혹한 형벌과 부역에 쌓인 불만이 도화선에 불이 붙은 셈이다."
  subjects: [qin]
  tags: [politics, war, society]
  sources: ["『사기』 진섭세가", "『사기』 진시황본기", "『사기』 항우본기", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: xiongnu-empire-209bc
  year: -208
  endYear: -160
  title:
    ko: "묵돌 선우의 흉노 제국: 좌우 현왕 체제와 월지의 서쪽 이동(기원전 209~161)"
  summary:
    ko: "『사기』는 두만 선우의 맏아들 묵돌이 기원전 209년 아버지를 죽이고 선우에 올라 흉노를 하나의 군사 국가로 묶었다고 적는다. 묵돌이 동호를 무너뜨린 일은 「흉노 묵돌 선우의 동호 격파와 오환·선비」(앞의 사건)에 있다. 묵돌은 소리 나는 화살(명적)로 부하들을 훈련시켜 복종을 다졌고 군대를 10·100·1000·10000 단위로 나누어 이끌었다. 선우 아래에 좌현왕과 우현왕을 두어 좌현왕이 동쪽, 우현왕이 서쪽을 맡게 했고, 그 아래 ‘만기’라 불리는 24명의 장수가 큰 자는 1만, 작은 자는 수천 기병을 거느렸다. 선우 자리는 대체로 선우의 일족 가운데서 이어졌다. 묵돌은 동호를 무너뜨린 뒤 서쪽의 월지를 쳐서 몰아내고 남쪽으로는 누번왕·백양왕을 몰아내고 진의 몽염이 빼앗았던 오르도스를 되찾았다. 기원전 176년 그는 한 문제에게 보낸 글에서 우현왕이 월지를 몰아내고 오손·누란·호게와 그 곁의 26개 나라를 평정했다고 알리며 ‘활 쏘는 나라가 하나가 되었다’고 자랑했다. 묵돌이 죽고(기원전 174) 아들 노상 선우(재위 기원전 174~161)가 뒤를 이었을 때 월지 왕을 죽여 그 두개골로 술잔을 만들었고, 월지는 서쪽의 일리강 유역으로 옮겼다가 뒤에 대하(박트리아) 땅으로 내려갔다. 흉노는 한과 맺은 화친으로 해마다 비단·술·곡식을 받았고, 남쪽 변경을 약탈하며 한을 압박했다. 선우가 직접 다스린 중앙 외에 좌방은 상곡 동쪽, 우방은 상군 서쪽을 맡았다. 해마다 정월에는 선우정에서 작은 모임, 5월에는 농성에서 조상과 하늘·땅에 제사 지내는 큰 모임, 가을 말이 살찔 때는 대림에서 사람과 가축의 수를 헤아리는 모임을 열었다. 흉노는 가축을 따라 옮겨 다니는 목축이 중심이었고, 곡식과 직물은 한에서 얻거나 변경 약탈과 교역으로 채웠다. 흉노는 문자 기록을 남기지 않아 이 모든 이야기는 한의 사료에 의존하며, 사마천이 적은 풍속과 제도에는 한의 시각이 섞였을 수 있다. 초원에 나타난 최초의 유목 제국이라는 평가가 많다."
  subjects: [xiongnu, western-han]
  tags: [politics, war]
  sources: ["『사기』 흉노열전", "『한서』 흉노전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: qin-fall-207bc
  year: -206
  endYear: -205
  title:
    ko: "진의 멸망: 거록 전투와 자영의 항복(기원전 207~206)"
  summary:
    ko: "기원전 208년 정도에서 항량을 죽인 진의 장군 장한은 조(趙)를 쳐서 거록을 포위했다. 항량이 죽은 뒤 초군을 이끈 항우는 기원전 207년 상장군 송의를 죽이고 군사를 이끌어 강을 건너 배를 가라앉히고 솥을 깨뜨렸다(파부침주). 항우의 군대는 아홉 번 싸워 왕리를 사로잡았고 거록을 구했다. 장한은 조고에게 의심받자 항우에게 항복했다. 조고가 사슴을 말이라 우겨 신하들의 충성을 시험했다는 ‘지록위마’ 이야기는 기원전 207년 8월의 일로 전한다. 함양에서는 조고가 호해를 압박해 자살하게 한 뒤 호해 형의 아들(시황제의 아우라는 설도 있다) 자영을 세웠다. 자영은 황제 칭호를 버리고 진왕을 칭했으며 곧 조고를 죽였으나, 유방의 군대가 무관을 넘어 오자 즉위 46일 만에 흰 수레와 흰말로 지도(軹道)에서 옥새를 바치고 항복했다. 사서가 한 원년(기원전 206년)의 일로 적는 이 항복은 진 역법으로 해가 시작되는 음력 10월의 일이라 율리우스력으로는 기원전 207년 말에 해당한다. 유방은 궁궐 약탈을 금지하고 살인·상해·도둑질만 벌한다는 약법삼장을 선포해 민심을 샀다. 뒤늦게 들어온 항우는 자영과 진 종실을 죽이고 궁궐에 불을 질렀다고 한다. 장한은 앞서 여산 무덤 공사장의 죄수를 풀어 군대를 만들어 진승군을 무찔렀던 장수였다. 항우의 군대는 항복한 진 병사 20여만 명(사서의 수)을 신안에서 구덩이에 묻어 죽였다고도 전한다. 진의 마지막 두 해 동안 지방의 군수와 현령이 앞다투어 반란군에 붙어 군현제가 곳곳에서 허물어졌다. 호해는 즉위 뒤 형제와 공신을 숙청해 믿을 사람이 줄어 있었다. 진의 멸망 이유로 사마천은 가혹한 형벌과 부역, 대규모 토목 공사를 들었다. 한의 가의는 「과진론」에서 진이 천하를 얻은 뒤에는 지키는 방법이 달라야 했는데 인의를 베풀지 않았다고 평했다. 시황제가 천하를 통일한 지 15년 만이었다. 진이 무너진 뒤 항우가 제후를 나누어 봉한 일은 다음 사건에서 이어진다."
  subjects: [qin]
  tags: [war, politics]
  sources: ["『사기』 항우본기", "『사기』 진시황본기", "『사기』 고조본기", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: hongmen-partition-206bc
  year: -205
  endYear: -204
  title:
    ko: "홍문의 연회와 항우의 18왕 분봉(기원전 206~205)"
  summary:
    ko: "항우는 사서가 40만이라 적는 대군을 이끌고 함곡관을 넘어 홍문(지금의 시안 린퉁)에 머물며 먼저 함양에 들어간 유방을 치려 했다. 숙부 항백이 유방의 편에 서서 알리자 유방은 홍문으로 와 사죄했고, 연회에서 범증의 뜻에 따라 항장이 칼춤으로 유방을 죽이려 했으나 항백이 맞받아 춤추고 번쾌가 뛰어들어 유방은 빠져나왔다(홍문의 연회). 항우는 함양을 불태운 뒤 초 회왕을 의제로 높이고 스스로 서초 패왕이 되어 팽성(지금의 쉬저우)을 도읍으로 정했다. 옛 여섯 나라 후손과 공신 18명을 왕으로 봉하면서 유방은 파·촉·한중의 한왕으로 보냈고, 관중은 진의 항복한 장수 장한·사마흔·동예 세 사람에게 나누어 맡겼다(삼진). 봉토에 불만을 품은 전영이 제에서, 팽월이 양에서 일어났고 의제는 강남으로 쫓겨 가다 죽임을 당했다(기원전 206). 항우는 이 분봉에서 영포를 구강왕, 오예를 형산왕, 장이를 상산왕, 장도를 연왕으로 삼는 등 공을 세운 장수들을 왕으로 높였으나, 기준이 공정하지 않다고 여긴 사람이 많았다. 전영은 제 땅을 병합하고 스스로 제왕에 올랐다. 유방이 함양에 들어갔을 때 소하는 진의 승상부 문서와 호구 장부를 먼저 거두어, 뒤의 한이 천하의 땅과 인구를 아는 바탕이 되었다. 항우는 관중이 기름지고 막기 좋다는 권유를 물리치고 “부귀하고도 고향에 가지 않으면 비단옷을 입고 밤길을 가는 것과 같다”며 팽성으로 돌아갔다. 한왕 유방은 잔도를 불태워 동쪽으로 나갈 뜻이 없음을 보이고, 한신을 대장군으로 삼아 기원전 206년 가을 진창으로 몰래 나와 삼진을 평정했다. 기원전 205년 음력 4월 유방은 제후군 56만(사서의 수로 과장일 수 있다)을 모아 팽성을 차지했으나, 항우가 정예 기병 3만을 이끌고 돌아와 수수 근처에서 크게 이겼고 유방은 가족을 잃고 겨우 달아났다."
  subjects: [qin]
  tags: [war, politics]
  sources: ["『사기』 항우본기", "『사기』 고조본기", "『사기』 회음후열전", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: chu-han-war-204bc
  year: -203
  endYear: -201
  title:
    ko: "초한 전쟁: 형양 대치에서 해하 전투까지(기원전 204~202)"
  summary:
    ko: "수수에서 패한 한왕 유방은 형양(지금의 허난성 싱양)과 성고에서 항우의 초군을 막으며 기원전 204년 이후 오래 맞섰다. 그 앞뒤로 한신은 위·대·조를 차례로 쳐서 무너뜨렸고 기원전 205년 음력 10월 정형 전투에서는 강을 뒤에 두고 진을 치는 배수진으로 조의 대군을 이겼다. 이어 한신은 연을 항복시키고 제를 쳐서(기원전 203) 제왕에 올랐다. 팽월은 양 땅에서 초의 보급선을 끊었고, 항우의 장수였던 영포는 한에 귀순해 회남왕이 되었다. 소하는 관중에서 병력과 곡식을 끊임없이 형양으로 보내 전선을 떠받쳤다. 광무산 대치 때 항우가 포로가 된 유방의 아버지를 삶겠다고 위협하자 유방은 “내 아버지가 곧 네 아버지이니 삶거든 국 한 그릇을 나눠 달라”고 받아쳤다고 『사기』는 전한다. 항우는 자결하기 전 군사를 일으킨 지 8년, 70여 번 싸워 진 적이 없다고 말했다고 『사기』는 전한다. 기원전 203년 두 나라는 홍구(鴻溝, 지금의 허난성 카이펑 부근의 운하)를 경계로 천하를 반으로 나누고 유방의 아버지와 아내를 돌려보내기로 했다. 그러나 항우가 군대를 이끌고 동쪽으로 물러나자 한은 장량과 진평의 말을 따라 약속을 깨고 뒤쫓았다. 처음에는 한신과 팽월이 약속한 대로 오지 않아 한이 고릉에서 패했으나, 땅을 더 주겠다고 약속하자 합류했다. 기원전 202년 한·제·양·회남의 군대가 해하(지금의 안후이성 링비 부근으로 보지만 장소는 학설이 갈린다)에서 초군을 에워쌌다. ‘사방에서 초나라 노래가 들린다’는 사면초가 이야기가 이때의 일이다. 항우는 800여 기병을 이끌고 포위를 뚫었으나 오강에서 자결했다. 이로써 4년의 싸움이 끝나고 유방이 황제에 올랐다. 승부는 한신 같은 인재를 쓴 유방의 용인과 보급을 맡은 소하의 관중 경영에서 갈렸다고 『사기』는 평한다."
  subjects: [western-han]
  tags: [war, politics]
  sources: ["『사기』 항우본기", "『사기』 고조본기", "『사기』 회음후열전", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: gaozu-founding-202bc
  year: -201
  endYear: -194
  title:
    ko: "한 고조 유방의 즉위와 군국제(기원전 202~195)"
  summary:
    ko: "기원전 202년 2월 유방은 제후왕들의 추대를 받아 범수 북쪽에서 황제에 올랐다(고조). 처음에는 뤄양에 머물렀으나 유경의 건의로 관중의 장안으로 도읍을 옮기기로 했고, 소하가 장락궁과 미앙궁을 지었다(기원전 200 무렵). 고조는 진의 가혹한 법을 줄이고 소하가 정리한 율령을 바탕으로 통치했으나, 진의 제도를 상당 부분 물려받았다. 그는 도읍 주변과 서쪽은 군현으로 직접 다스리고 동쪽에는 공신과 종실을 제후왕으로 봉하는 군국제를 폈다. 처음에 봉한 이성(異姓) 제후왕은 초왕 한신, 양왕 팽월, 회남왕 영포, 연왕 장도(뒤에 노관), 한왕(韓王) 신, 조왕 장이(뒤에 아들 장오), 장사왕 오예의 일곱이었는데 고조는 장사왕을 뺀 나머지를 차례로 의심하고 없앴다. 한신은 초왕에서 회음후로 낮아졌다가(기원전 201) 모반 혐의로 죽었고(기원전 196), 한왕(韓王) 신은 기원전 201년 흉노에 투항했으며, 팽월은 기원전 196년에 처형되었다. 영포는 반란을 일으켰다가 죽었고(기원전 195), 연왕 노관은 흉노로 달아났다. 즉위 직후 고조는 군사를 풀어 고향으로 돌려보내고 전쟁 통에 노비가 된 사람들을 평민으로 되돌리는 조서를 내렸다. 장락궁은 진의 흥락궁을 고쳐 지은 것이었다. 상인에게는 비단옷을 입거나 수레를 타지 못하게 하는 등 신분 제한을 두어 농업을 중시했다. 유경은 도읍을 옮기는 일과 함께 제·초의 옛 귀족 10여만 명을 관중으로 옮겨 동쪽의 반란 세력을 누르자고 건의했다. 이후 고조는 유씨가 아니면 왕이 될 수 없다는 맹약을 세웠다. 고조는 영포를 치다 화살을 맞아 기원전 195년 장락궁에서 죽었다. 종실 제후국이 크다는 문제는 뒤의 오초 7국의 난으로 터져 나오게 된다. 흉노와의 관계는 「백등산 포위(기원전 200)와 화친(기원전 198)」(뒤의 사건)에서 이어진다."
  subjects: [western-han, xiongnu]
  tags: [politics]
  sources: ["『사기』 고조본기", "『사기』 소상국세가", "『사기』 회음후열전", "『한서』 고제기", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: baideng-200bc
  year: -199
  endYear: -197
  title:
    ko: "백등산 포위(기원전 200)와 화친(기원전 198)"
  summary:
    ko: "한왕(韓王) 신은 기원전 201년 마읍에서 흉노에게 항복하고 흉노의 길잡이가 되어 태원 방면으로 쳐들어왔다. 기원전 200년 겨울 고조는 사서가 32만이라 적는 군대를 이끌고 직접 나섰으나 추위로 병사들이 동상에 걸렸고, 보병이 뒤처진 사이 고조는 선발대와 평성(지금의 산시성 다퉁)에 이르렀다. 묵돌 선우는 약한 군대를 앞에 내보내 유인한 뒤 정예 기병(사서는 40만이라 하나 과장일 수 있다)으로 백등산에서 고조를 이레 동안 포위했다. 식량이 떨어진 고조는 진평의 계책으로 겨우 포위를 풀고 빠져나왔다(진평의 계책이 무엇이었는지는 사서가 밝히지 않는다). 이 패전 뒤 유경의 건의로 한은 기원전 198년 흉노와 화친을 맺었다. 종실의 딸을 공주로 삼아 선우에게 시집보내고 해마다 비단·솜·술·쌀을 일정한 양만큼 보내며, 두 나라는 형제로 부르고 장성을 경계로 삼았다고 전한다. 이는 한이 흉노를 대등한 나라로 인정하고 물자를 보내는 대신 변경의 평화를 사려는 정책이었다. 그러나 흉노의 약탈은 그치지 않았다. 묵돌은 고조가 죽은 뒤 여후에게 모욕적인 글을 보내기도 했으나 한은 참고 화친을 이어 갔다. 한왕 신은 본래 전국 시대 한(韓)의 왕족이었다. 고조는 앞서 형 유중을 대왕으로 세웠으나(기원전 201) 유중이 흉노가 쳐들어오자 달아나 폐위되었다. 화친의 ‘공주’는 실제로는 종실의 딸에게 붙인 이름이었다. 백등산은 평성 가까운 산으로 지금의 다퉁 부근으로 보지만 정확한 지점은 학설이 갈린다. 이 정책은 한 무제가 전쟁에 나설 때까지 약 70년 동안 이어졌다. 묵돌이 동호를 무너뜨린 일은 「흉노 묵돌 선우의 동호 격파와 오환·선비」(앞의 사건)에 있다."
  subjects: [western-han, xiongnu]
  links:
    - { from: xiongnu, to: western-han, note: "백등산 포위(기원전 200)" }
    - { from: western-han, to: xiongnu, note: "화친: 공주를 보내고 해마다 비단·술·곡식을 보냄(기원전 198)" }
  tags: [war, diplomacy]
  sources: ["『사기』 흉노열전", "『사기』 유경숙손통열전", "『한서』 흉노전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: empress-lu-195bc
  year: -194
  endYear: -179
  title:
    ko: "혜제와 여후의 시대(기원전 195~180)"
  summary:
    ko: "기원전 195년 고조가 죽자 아들 혜제(유영, 재위 기원전 195~188)가 올랐으나 실권은 어머니 여후(여치)가 쥐었다. 여후는 고조의 총애를 받던 척부인과 그 아들 조왕 여의를 죽여 정적을 없앴다. 혜제가 죽은 뒤(기원전 188) 여후는 어린 황제를 차례로 세워(전소제 유공 188~184, 후소제 유홍 184~180) 임조칭제로 8년 동안 조정을 이끌었다. 한 초의 법을 완화하여 기원전 191년 책을 간직하는 일을 죄로 삼은 협서율을 없애고 기원전 187년 일가족을 함께 죽이는 족형과 요언령을 폐지했다. 한편 여후는 고조가 ‘유씨가 아니면 왕이 될 수 없다’고 한 맹약을 어기고 조카 여산·여록 등 여씨 일족을 왕과 후로 봉했다. 대외로는 흉노 묵돌이 여후에게 모욕적인 글을 보냈을 때 군사를 일으키자는 주장이 있었으나 화친을 유지했다. 남쪽에서는 기원전 183년 무렵 철 수출을 막자 조타가 남월의 무제(武帝)를 칭하며 장사국을 공격했고 한은 이를 누르지 못했다. 기원전 180년 여후가 죽자 주발·진평 등 공신이 여씨 일족을 몰아내고 후소제를 폐위한 뒤, 고조의 아들 가운데 어진 이로 알려진 대왕 유항을 맞아 황제(문제)로 세웠다. 혜제는 어머니의 잔혹함에 충격을 받아 술에 빠졌다고 전한다. 이 무렵 승상 소하(기원전 193년 죽음)와 조참은 고조 때의 법도를 그대로 따르는 ‘소규조수’로 백성을 쉬게 했다. 여씨를 왕으로 봉하는 일에 우승상 왕릉은 고조의 맹약을 들어 반대했으나 진평과 주발은 맞서지 않았다. 사마천은 이 시기에 형벌이 드물게 쓰여 죄인이 거의 없었다고 평했다. 여후는 여록·여산에게 장안의 북군과 남군을 맡겼는데, 여후가 죽자 주발이 여록의 병권을 넘겨받아 여씨를 제압했다. 여후 정권은 혼란했으나 법을 줄이고 백성을 쉬게 하는 정책 덕분에 한이 안정을 찾았다는 평가도 있다."
  subjects: [western-han, xiongnu]
  tags: [politics]
  sources: ["『사기』 여태후본기", "『한서』 고후기", "『사기』 남월열전", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: wen-jing-180bc
  year: -179
  endYear: -140
  title:
    ko: "문경지치: 문제와 경제의 통치(기원전 180~141)"
  summary:
    ko: "기원전 180년 대왕에서 황제로 오른 문제(재위 기원전 180~157)는 검소하기로 이름났다. 사서는 그가 노대(누각)를 지으려다 열 가구 재산에 해당하는 비용을 듣고 그만두었다고 적는다. 문제는 백성의 세금을 낮추어 기원전 167년에는 농지에 매기는 세금인 전조를 면제했고, 제영이라는 소녀가 아버지를 대신해 벌을 받겠다고 글을 올리자 몸을 상하게 하는 육형(肉刑)을 없애고 태형으로 바꾸었다. 그러나 흉노의 압박은 이어져 기원전 166년 노상 선우의 기병 14만(사서의 수)이 소관을 넘어 감천궁 가까이까지 들어오자 문제는 반격하여 몰아냈다. 경제(재위 기원전 157~141)는 전조를 수확의 30분의 1로 정해 가벼운 세금 제도를 이었다. 문제 때 가의는 제후국을 쪼개 힘을 줄이자고 건의했고, 경제 때 어사대부 조조(晁錯)가 이를 이어받아 삭번을 추진했다(「조조(晁錯)의 삭번과 오초 7국의 난(기원전 154)」(뒤의 사건)). 두 황제 시대에 인구가 늘고 창고에 곡식이 썩어 넘치고 동전을 꿴 끈이 썩었다고 『사기』는 전한다. 문제는 어머니 박씨와 함께 대 땅에서 자란 제후 출신이었고, 원년(기원전 179)에 죄가 있는 사람의 가족까지 벌하는 연좌제를 없앴다. 몸소 농사를 장려하는 의식을 치르기도 했다. 문제는 죽을 때 장례를 간소히 하라고 유언했고 능묘(패릉)도 검소하게 지었다. 경제 때도 흉노와의 화친을 이어 가며 변경에 관시를 열어 교역하게 했다. 가의 같은 신하는 흉노에 대한 화친이 굴욕적이라고 비판했다. 정치는 도가의 황로 사상에 가까운 ‘무위’를 앞세워 백성을 쉬게 하는 쪽이었다. 이 40여 년의 안정을 ‘문경지치’라 부르고, 이 곳간이 뒤의 무제가 대외 전쟁을 치를 수 있는 바탕이 되었다."
  subjects: [western-han, xiongnu]
  tags: [politics, economy]
  sources: ["『사기』 효문본기", "『사기』 효경본기", "『사기』 평준서", "『한서』 식화지", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: seven-states-154bc
  year: -153
  title:
    ko: "조조(晁錯)의 삭번과 오초 7국의 난(기원전 154)"
  summary:
    ko: "고조가 동쪽에 봉한 종실 제후국은 한 초에 이미 한의 절반 가까운 땅을 차지했다. 특히 오왕 유비(劉濞, 고조의 형 유중의 아들)는 구리와 소금이 나는 땅을 갖고 있어 재물이 넘쳤고, 젊은 날 경제(당시 태자)와 육박(六博) 놀이를 하다가 다투어 아들이 죽은 일로 조정에 앙심이 깊었다고 한다. 경제의 신임을 받은 어사대부 조조(晁錯)는 제후국의 힘이 너무 커졌다며 땅을 깎는 삭번을 건의했다. 기원전 154년 초의 동해군을 깎고 오의 군 둘(『사기』는 회계·예장이라 적으나 장군(鄣郡)의 잘못이라는 설이 있다)을 깎으려 하자 오왕이 앞장서 초·조·교서·교동·치천·제남의 6국을 모아 기원전 154년 정월 ‘군측의 악인 조조를 벤다’는 명분으로 거병했다(오초 7국의 난). 경제는 조조를 허리를 베어 죽여 반란군을 달래려 했으나 오왕은 물러서지 않았다. 태위 주아부는 정면 승부를 피하고 오·초의 보급로를 끊는 한편 양 효왕이 도읍을 지키게 해 버티게 했다. 반란군은 석 달 만에 무너졌고 오왕은 동월로 달아났다가 살해되었다. 오는 바닷물을 끓여 소금을 만들고 구리를 캐 돈을 만들어 부를 쌓았고, 백성의 부역을 돈으로 대신해 주어 인심을 얻었다. 주아부는 양을 구하라는 경제의 뜻을 따르지 않고 오·초군의 보급로를 끊는 데 집중하다 양 효왕과 사이가 틀어졌다. 난이 끝나자 제후국의 승상은 격을 낮춰 ‘상’이라 부르게 했다(기원전 145). 반란에 가담한 조왕 유수는 흉노와 손잡으려 했으나 한군에 포위되어 자살했다. 교서·교동·치천·제남의 왕은 한군에 포위되어 처형되거나 자살했다. 이후 제후왕은 땅의 세금만 받을 뿐 관리를 임명하지 못하게 되었고(한에서 승상과 관리를 보냈다), 제후국의 정치 권력은 크게 줄었다. 무제의 추은령(기원전 127)이 그 마무리였다(「무제의 즉위와 중앙집권: 추은령과 연호(기원전 141~127)」(뒤의 사건))."
  subjects: [western-han]
  tags: [war, politics]
  sources: ["『사기』 오왕비열전", "『사기』 원앙조조열전", "『한서』 경제기", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: wudi-centralization-141bc
  year: -140
  endYear: -126
  title:
    ko: "무제의 즉위와 중앙집권: 추은령과 연호(기원전 141~127)"
  summary:
    ko: "기원전 141년 경제가 죽고 열여섯 살(만 15세)의 무제가 즉위했다. 처음에는 할머니 두태후가 도가 사상을 앞세워 유학자 등용을 막았고, 기원전 135년 두태후가 죽은 뒤에야 무제는 친정에 나서 뜻대로 인재를 썼다. 무제는 궁궐 안의 측근을 중심으로 한 ‘중조’(내조)를 키워 승상이 이끄는 외조의 권한을 줄였다. 기원전 127년 주보언의 건의로 추은령을 내려 제후왕이 자기 땅을 여러 아들에게 나누어 줄 수 있게 했는데, 제후국은 그때마다 작아져 힘이 약해졌다. 기원전 112년에는 종묘에 바치는 제물을 구실로 제후와 열후 106명의 작위를 빼앗았다. 기원전 106년에는 천하를 13개 구역(주)으로 나누어 자사를 보내 군수와 호족을 감찰하게 했다. 무제는 연호를 처음 쓴 황제로 알려져 있으며, ‘건원’이라는 첫 연호는 기원전 110년대에 소급해 정한 것으로 보나 시기는 학설이 갈린다. 즉위 초 무제가 추진한 조관·왕장의 유학자 중용 정책(기원전 140~139)은 두태후의 반대로 좌절해 두 사람이 자살했다. 승상은 한 초에는 대개 공신과 열후 출신이었으나 무제는 평민 출신 공손홍을 승상에 앉혔다(기원전 124). 가혹하게 법을 집행하는 혹리 장탕 같은 인물도 이때 두각을 나타냈다. 무제는 호족과 부호를 황제의 능 근처 고을(능읍)으로 옮겨 살게 하는 정책도 이어 갔다. 이런 정치는 문경지치가 쌓아 둔 곳간 위에서 가능했다. 무제의 재위(기원전 141~87)는 54년으로 한의 황제 가운데 가장 길었다. 이런 개혁으로 황제를 정점으로 하는 중앙집권 체제가 자리 잡았으나, 한편으로는 대외 전쟁에 쓸 재정이 필요해지면서 법을 엄하게 쓰는 혹리들이 힘을 얻었다. 한 초 군국제의 균형이 군현제 쪽으로 기운 결정적 시기이다."
  subjects: [western-han]
  tags: [politics]
  sources: ["『사기』 효무본기", "『한서』 무제기", "『사기』 평진후주보열전", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: zhang-qian-139bc
  year: -138
  endYear: -125
  title:
    ko: "장건의 서역 사행(기원전 139~126)과 비단길"
  summary:
    ko: "무제는 흉노에게 쫓겨 서쪽으로 달아난 월지와 손잡고 흉노를 양쪽에서 치려 했다. 기원전 139년(138년으로 보는 설도 있다) 낭(郞) 장건은 흉노 출신 감보 등 100여 명과 함께 장안을 떠났으나 허시에서 흉노에게 붙잡혀 10여 년 동안 억류되었다. 그는 그곳에서 흉노 여자와 혼인해 아들을 두면서도 한의 부절을 지켰다. 탈출한 장건은 대완(페르가나)과 강거를 거쳐 월지에 이르렀지만, 월지는 이미 비옥한 대하 땅에 자리 잡아 흉노에 복수할 뜻이 없었다. 장건은 돌아오는 길에 다시 흉노에게 붙잡혔다가 1년 남짓 만에 탈출해 기원전 126년 장안으로 돌아왔는데, 출발할 때의 100여 명 가운데 남은 사람은 장건과 감보 둘뿐이었다. 그는 대완·강거·대하·안식 등 서역의 땅과 풍속, 특산물을 보고했고, 대하에서 촉(쓰촨)의 포와 공(邛)의 대나무 지팡이를 보았다고 해 신독(인도)을 거치는 남쪽 길에 대한 정보도 전했다. 기원전 119년 장건은 두 번째로 오손에 사절 300명을 이끌고 가 말과 소와 양, 비단을 선물로 전했고 그의 부사들은 주변 여러 나라를 찾아갔다. 장건은 기원전 114년에 죽었다. 『사기』 대완열전은 한의 사신이 대완의 포도와 거여목 씨를 가져와 궁궐 근처에 심었다고 적는다. 무제는 대완의 한혈마(천마)를 얻으려고 이광리를 보내 원정(기원전 104~101)하기도 했다. 서역에는 오아시스 도시 36국이 흩어져 있었다. 장건은 쓰촨에서 인도로 이어지는 서남쪽 길을 열자고 건의했으나 현지 부족에 막혀 이루지 못했다. 장건은 귀국 뒤 태중대부를 거쳐 박망후에 봉해졌다. 이 정보는 『사기』 대완열전에 실려 서역 교통과 비단길 교역의 첫걸음이 되었다. 이 행로는 허시 회랑 확보와 함께 이어진다(「허시 회랑의 확보와 하서 4군(기원전 121~111)」(뒤의 사건))."
  subjects: [western-han, xiongnu]
  tags: [diplomacy, economy]
  sources: ["『사기』 대완열전", "『한서』 장건이광리전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: confucian-orthodoxy-136bc
  year: -135
  endYear: -123
  title:
    ko: "유학의 국교화: 오경박사(기원전 136)·동중서·태학(기원전 124)"
  summary:
    ko: "한 초에는 도가의 황로 사상과 법가의 제도가 정치의 바탕이었다. 무제는 중앙집권을 뒷받침할 이념으로 유학을 택했다. 기원전 136년 『시』·『서』·『예』·『역』·『춘추』의 오경에 박사를 두어 관리 교육의 바탕이 되게 했다. 『춘추』 공양학을 하는 동중서는 현량대책에서 하늘이 군주의 정치를 살펴 재앙과 상서로 뜻을 나타낸다는 천인감응과, 군주·아버지·남편을 중심으로 삼는 질서(삼강)와 오륜을 내세웠다. 그는 기원전 134년 무렵 오경 밖의 학문을 끊고 유학만 높이자는 뜻으로 건의했다고 하며, 반고는 『한서』에서 무제가 ‘백가를 물리치고 육경을 드러냈다’고 평했다. 기원전 134년 군국마다 해마다 효성스럽고 청렴한 이(효렴)를 추천하게 하는 찰거제가 시작되었고, 기원전 124년에는 수도 장안에 태학을 세워 박사 아래 제자 50명을 두었다. 이후 유가 경전을 아는 사람이 관리가 되는 길이 열려 유학은 관료 선발과 지배 이념으로 굳어졌다. 승상 공손홍의 건의로 만든 이 태학에서는 시험에 합격한 제자를 관리로 뽑았다. 동중서는 군주를 ‘하늘의 아들’로 높여 권위를 세웠지만, 재앙이 하늘의 경고라는 논리로 군주를 견제하는 길도 열어 두었다. 이후 선제 때 석거각 회의(기원전 51)에서 오경 해석을 조정했다. 선제는 한 왕실의 제도는 본래 패도와 왕도를 섞은 것이라고 말했다고 한다. 박사 제자의 정원은 뒤에 점점 늘어 전한 말에는 수천 명에 이르렀다. 후한에 이르면 경학이 관학으로 완전히 자리 잡아 태학과 군국의 학교가 늘었다. 그러나 실제 정치는 법가의 엄한 법과 형벌도 함께 써서 ‘겉은 유학, 속은 법가’라는 평이 따른다. 학자들은 무제 때의 변화가 한 번에 이루어진 것이 아니라 점차 자리 잡았다고 본다."
  subjects: [western-han]
  tags: [culture, politics]
  sources: ["『한서』 무제기", "『한서』 동중서전", "『한서』 유림전", "Mark Edward Lewis, The Early Chinese Empires: Qin and Han (Harvard University Press, 2007)"]

- id: han-xiongnu-war-133bc
  year: -132
  endYear: -118
  title:
    ko: "한과 흉노의 전쟁: 마읍의 계략(기원전 133)에서 막북 전투(기원전 119)까지"
  summary:
    ko: "60여 년에 걸친 화친 끝에 무제는 기원전 133년 마읍(지금의 산시성 숴저우)에서 흉노 군신 선우를 유인해 잡으려 했다. 마읍의 부호 섭일이 성을 바치겠다고 거짓으로 알리고 한 군대가 숨어 기다렸으나, 선우가 낌새를 알아채고 물러나 계략이 실패했다. 이후 한과 흉노는 전면전에 들어갔다. 기원전 129년 위청이 용성(흉노의 제사 장소)에서 첫 승리를 거두었고, 기원전 127년에는 오르도스(하남)를 되찾아 삭방군과 오원군을 두고 10만 명을 이주시켰다. 기원전 121년에는 곽거병이 허시 회랑을 확보했다(「허시 회랑의 확보와 하서 4군(기원전 121~111)」(뒤의 사건)). 기원전 119년 위청과 곽거병은 각각 5만 기병과 수십만의 보급 부대를 이끌고 사막 북쪽(막북)으로 나아갔다. 이치사 선우는 위청의 군대와 부딪혀 달아났고, 곽거병은 낭거서산에서 하늘에 제사를 올리고 한해(바이칼호 또는 몽골 북부의 호수로 보는 학설이 있다)에 이르렀다. 흉노는 큰 타격을 받아 사막 북쪽으로 물러났지만 한도 이 싸움에서 군마 10만 필 남짓을 잃었고(추산) 이후 대규모 원정이 어려워졌다. 장군 이광은 길을 잃은 책임을 지고 자결했고 곽거병은 기원전 117년 20대 초반의 나이로 죽었다. 이 시기 한의 군대는 황후 위자부의 동생 위청과 그 조카 곽거병 같은 외척이 지휘했다는 특징이 있다. 흉노는 이후에도 변경을 침입했으나 한은 서쪽의 오손과 동맹을 맺으려 두 번째 사행을 보내는 등 서쪽으로 눈을 돌렸다. 위청은 이 전쟁의 공으로 대장군 대사마까지 올랐다. 이 전쟁으로 한은 허시와 오르도스를 확보했고 서역으로 가는 길을 열었다. 전쟁 비용은 재정 개혁으로 이어졌다(「무제의 재정 정책: 염철 전매와 균수·평준(기원전 119~110)」(뒤의 사건))."
  subjects: [western-han, xiongnu]
  links:
    - { from: western-han, to: xiongnu, note: "오르도스(하남) 탈환과 삭방군 설치(기원전 127)" }
  tags: [war]
  sources: ["『사기』 흉노열전", "『사기』 위장군표기열전", "『한서』 흉노전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: hexi-corridor-121bc
  year: -120
  endYear: -110
  title:
    ko: "허시 회랑의 확보와 하서 4군(기원전 121~111)"
  summary:
    ko: "허시 회랑은 치롄산맥(옛 기련산) 북쪽 기슭을 따라 간쑤성 서부를 가로지르는 좁고 긴 오아시스 길로, 중원에서 서역으로 가는 통로였다. 이곳은 한 초부터 흉노의 혼야왕과 휴도왕이 다스렸다. 기원전 121년 봄 곽거병은 기병 1만을 이끌고 허시로 나아가 언지산 방면에서 흉노를 크게 무찔렀고, 여름에는 기련산 쪽으로 돌아 다시 큰 승리를 거두었다. 이 싸움에서 흉노가 잃은 사람은 봄 싸움에서 9천 명 가까이, 여름 싸움에서 3만 명 넘게라고 사서는 전한다(사서의 수). 흉노는 ‘우리 기련산을 잃어 가축을 기를 수 없고, 언지산을 잃어 아낙의 얼굴이 빛을 잃는다’고 노래했다고 한다. 혼야왕은 선우의 문책이 두려워 한에 항복하려 했는데, 휴도왕이 망설이자 그를 죽이고 그 무리를 거느려 4만 명(『사기』의 수)과 함께 한에 투항했고, 한은 이들을 변경의 5개 속국에 나누어 살게 했다. 한은 허시를 지키기 위해 주천(기원전 121 무렵)에 이어 장액·돈황(기원전 111 무렵), 무위(기원전 121~101 무렵으로 학설이 갈린다)까지 4군을 설치하고 둔전병과 이민을 보냈으며, 장성을 서쪽 옥문관·양관까지 연장했다. 4군의 설치 연대는 학설마다 조금 다르다. 곽거병은 무제가 저택을 지어 주려 하자 “흉노가 아직 없어지지 않았는데 집이 무슨 소용입니까”라고 사양했다고 전한다. 무위와 주천이라는 이름은 흉노를 위엄으로 누르고 곽거병이 샘에 술을 부어 병사들과 나눈 고사에서 왔다고 전해진다. 하서 4군이 설치되며 흉노 우현왕의 지배가 약해지고 서역으로 가는 통로가 넓어졌고, 한은 서역 여러 나라에 사절을 더 자주 보내 교역과 외교 거점을 넓혔다. 이로써 한은 흉노와 서쪽의 강(羌)을 갈라놓았고 장건이 연 서역 교통을 안정시켰다. 이 길을 따라 비단과 서역 물산이 오갔다. 장건의 사행은 「장건의 서역 사행(기원전 139~126)과 비단길」(앞의 사건)에 있다."
  subjects: [western-han, xiongnu]
  links:
    - { from: western-han, to: xiongnu, note: "허시 회랑 획득과 하서 4군 설치(기원전 121~111)" }
  tags: [war, politics]
  sources: ["『사기』 흉노열전", "『사기』 위장군표기열전", "『한서』 지리지", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: salt-iron-monopoly-119bc
  year: -118
  endYear: -109
  title:
    ko: "무제의 재정 정책: 염철 전매와 균수·평준(기원전 119~110)"
  summary:
    ko: "대규모 흉노 전쟁과 허시·남방의 군현 설치로 한의 재정은 문경지치가 쌓은 곳간도 바닥을 드러냈다. 무제는 대상인 출신의 동곽함양(소금)과 공근(철), 뤄양 상인 집안의 상홍양 같은 재정 전문가를 등용했다. 기원전 119년 무렵부터 소금과 철의 생산과 판매를 나라가 맡는 전매 제도를 시작해 군국에 염관과 철관을 두었다. 상인의 재산에 따라 세금을 매기는 산민령과, 이를 숨기면 신고한 사람에게 몰수한 재산의 절반을 주는 고민령이 뒤따라 많은 상인이 몰락했다. 기원전 118년에는 질이 일정한 오수전을 만들어 화폐를 통일하고 사사로이 동전을 만드는 일을 막았다. 기원전 115년 무렵에는 군국이 바치는 공물을 현지 특산물에서 시세가 높은 곳에 팔 상품으로 바꾸어 운송하는 균수법을, 기원전 110년에는 나라가 물건을 사고팔아 물가를 누르는 평준법을 시행했다. 이 정책으로 국가 재정이 크게 늘었고 대상인의 힘은 눌렸으나, 관영 철기의 질이 나쁘고 값이 비싸다는 불만과 농민 부담 문제가 뒤에 염철 논쟁으로 터졌다. 같은 무렵인 기원전 119년에는 흰 사슴 가죽으로 만든 피폐와 은·주석 합금의 백금 화폐를 내어 상인과 제후의 재산을 거두려 했다. 이 정책들은 고조 이래 상인의 이익을 누르려던 방향을 극단까지 밀고 간 것이었다. 이 정책 덕분에 무제는 대외 전쟁을 이어 갔지만, 기원전 99~98년 무렵 산둥 등에서 도적과 유민의 봉기가 이어지는 등 백성의 부담도 컸다. 산민령은 상인은 재산 2천 전마다, 직접 만들어 파는 수공업자는 4천 전마다 120전의 세를 매기는 방식이었고, 『사기』 평준서는 중간 이상의 상인 집안이 대부분 이 법에 걸려 재산을 잃었다고 전한다. 상홍양이 이 정책을 주도했다. 오수전은 당 초기까지 700년 넘게 화폐의 기본이 되었다."
  subjects: [western-han]
  tags: [economy, politics]
  sources: ["『사기』 평준서", "『한서』 식화지", "『염철론』", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: shiji-108bc
  year: -107
  endYear: -90
  title:
    ko: "사마천과 『사기』(기원전 108~91 무렵)"
  summary:
    ko: "사마천은 태사령이던 아버지 사마담의 뜻을 이어 기원전 108년 태사령이 되었고, 궁궐 서고의 기록을 읽으며 역사서를 쓰기 시작했다. 기원전 104년에는 해의 시작을 정월로 하는 태초력 제정에 참여했다. 기원전 99년 이릉이 5천 보병으로 흉노의 주력과 싸우다 힘이 다해 항복하자, 사마천이 이릉을 변호했다가 무제의 노여움을 사 궁형(생식기를 베는 형)을 받았다. 그는 수치를 참고 환관 벼슬인 중서령을 지내며 책을 이어 썼다. 기원전 91년 무렵 또는 그 앞에 완성된 『사기』는 황제의 정치를 적은 본기 12, 연표 10, 제도를 적은 서 8, 제후와 명문가를 적은 세가 30, 사람 이야기를 적은 열전 70으로 이루어진 130편으로, 약 52만 6천5백 자라고 한다. 이렇게 사건 하나가 아닌 인물 중심의 기전체를 처음 만든 책이다. 사마천은 황제도 풍자할 수 있는 역사가의 독립적 시선을 지키려 했고, 협객·상인·자객 등 지배층이 아닌 사람들의 이야기도 실었다. 흉노·대완·남월·조선 등 주변 민족과 나라를 다룬 열전이 있어, 한국사에서는 고조선의 마지막 시기인 위만 조선에 관한 가장 이른 자세한 기록으로 쓰인다. 사마천은 스무 살 무렵부터 회계·구의·곡부 등 천하를 두루 다니며 현지의 전승을 모았고, 각 편의 끝에는 ‘태사공은 말한다’로 시작하는 자기 평가를 붙였다. 사마천은 천하를 다스린 황제만 본기에 싣지 않아 한 번도 황제가 되지 못한 항우를 본기에 올렸고, 황제의 어머니 여후의 시대도 본기로 적었다. 앞부분 본기는 전설상의 오제부터 한 무제까지를 다루어 중국 고대사 전체를 한 줄기로 엮었다. 『사기』는 뒤의 정사 편찬의 모범이 되어 『한서』 이후 역대 정사가 기전체를 따랐다. 사료의 연대와 해석에는 한계가 있지만 중국 고대사 연구의 가장 중요한 바탕이다."
  subjects: [western-han, xiongnu, gojoseon]
  tags: [culture]
  sources: ["『사기』 태사공자서", "『한서』 사마천전(보임안서 포함)", "Burton Watson, Records of the Grand Historian (Columbia University Press, 개정판 1993)", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: wugu-huoguang-91bc
  year: -90
  endYear: -86
  title:
    ko: "무고의 난(기원전 91)·윤대의 조서(기원전 89)와 곽광의 보정"
  summary:
    ko: "무제는 만년에 불로장생을 바라는 마음과 의심이 깊어졌다. 기원전 91년 궁중에서 저주(무고)를 행한다는 소문이 번지자 총신 강충은 황후 위자부와 태자 유거를 모함했다. 위기를 느낀 태자가 군사를 일으켜 장안에서 닷새 동안 싸웠으나 패했고, 태자와 위황후는 자결했으며 수만 명이 죽었다. 훗날 무제는 태자가 억울하다는 것을 알고 후회했다(사자궁). 기원전 90년에는 총희 이부인의 오빠 이광리가 흉노 원정에 나섰다가 집안이 연루되어 군대와 함께 흉노에 항복했다. 기원전 89년 무제는 윤대(지금의 신장 룬타이)의 둔전 건의를 물리치는 조서를 내려, 과거의 원정을 ‘백성을 괴롭힌 후회할 일’이라 스스로 비판하고 앞으로는 농업을 장려하겠다고 선언했다(윤대의 조서). 농업에서는 조과가 대전법을 보급했다. 기원전 87년 무제는 어린 막내아들 불릉(소제)을 후계자로 삼고 곽광·김일제·상관걸 등에게 보좌를 부탁한 뒤 죽었다. 김일제는 흉노 휴도왕의 아들로 한에 잡혀 온 사람이었다. 이 사건에는 승상 공손하와 무제의 딸 양석공주 같은 사람들도 연루되었다. 강충은 평소 태자와 사이가 나빠 후환을 걱정했다고 한다. 소제 때 곽광과 상관걸 사이에 권력 다툼이 벌어져 상관걸과 상홍양이 처형되었다(기원전 80). 무제는 후계자를 정하며 어린 황제의 어머니 구익부인을 처형하게 했는데, 외척이 어린 황제를 등에 업고 전권을 휘두를 것을 염려했기 때문이라고 전한다. 고침랑 전천추가 태자의 억울함을 호소하는 글을 올리자 무제는 깨닫고 강충 일가를 없앴으며 전천추를 대홍려로 삼았다가 뒤에 승상에 올렸다고 한다. 소제 때 곽광은 집정하며 무제의 무리한 정책을 되돌리기 시작했고 이는 몇 해 뒤의 염철 논쟁으로 이어졌다. 50여 년의 통치에서 영토와 제도의 확대는 컸으나 백성은 큰 부담을 졌다는 평이 따른다."
  subjects: [western-han, xiongnu]
  tags: [politics]
  sources: ["『한서』 무제기", "『한서』 곽광김일제전", "『자치통감』 한기", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: salt-iron-debate-81bc
  year: -80
  title:
    ko: "염철 논쟁(기원전 81)과 『염철론』"
  summary:
    ko: "기원전 81년 2월 소제가 곽광을 앞세워 민간의 고통을 묻는다며 지방의 현량과 문학(유학을 공부한 선비) 60여 명을 장안으로 불러 모았다. 이들은 무제 때 시작된 소금·철 전매와 균수·평준, 술 전매와 흉노 원정 정책을 놓고 어사대부 상홍양 등 정부 쪽 관리들과 토론했다. 문학들은 나라가 이익을 다투면 백성이 이익만 좇는 풍조가 퍼진다며 덕으로 다스리는 정치와 농업을 근본으로 삼는 정책(본업)을 내세워 전매를 폐지하자고 했다. 상홍양은 국가 전매가 변경 방어에 쓰는 군사비를 마련하는 길이며 상인의 독점을 막는다고 반박했고, 흉노와 화친하는 것은 변경을 오히려 위험하게 한다고 맞섰다. 토론은 소금·철 전매의 이로움과 해로움뿐 아니라 군국 지배와 외교의 방향을 둘러싼 것이었다. 결과적으로 전매는 대부분 유지되고 술 전매(각고, 榷酤)와 관내(관중) 지역의 철관만 폐지되었다(기원전 81). 곧 상홍양은 곽광과 대립하던 상관걸 일파로 몰려 기원전 80년에 처형되었다. 문학들은 변경 정책에서도 경전의 가르침대로 덕으로 먼 나라를 따르게 해야 한다고 했고, 상홍양은 흉노를 쳐야 백성이 쉬고 변경이 안전해진다고 맞섰다. 『염철론』은 대화체로 쓰여 실제 토론을 그대로 옮겼다기보다 편찬자가 다듬었을 가능성이 크다. 문학들은 한 초 문제·경제 때처럼 세금을 가볍게 하고 백성을 쉬게 하자고 주장했다. 일부 학자는 곽광이 이 회의를 상홍양 세력을 견제하는 수단으로 삼았다고 해석한다. 선제 때 환관(桓寬)이 토론 내용을 정리해 엮은 『염철론』 60편은 무제에서 소제 때의 사상 대립과 경제 정책을 보여 주는 귀중한 자료이다. 유학자와 재정 관료의 입장은 서로 달랐고 이후 중국 왕조에서도 비슷한 논쟁이 되풀이되었다."
  subjects: [western-han, xiongnu]
  tags: [economy, politics]
  sources: ["『염철론』", "『한서』 소제기", "『한서』 식화지", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: western-regions-71bc
  year: -70
  endYear: -59
  title:
    ko: "한과 오손의 흉노 협공(기원전 71)과 서역도호부 설치(기원전 60)"
  summary:
    ko: "곽광이 죽은 뒤(기원전 68) 친정에 나선 선제는 민간에서 자란 무제의 증손으로, 백성의 사정을 알고 관리를 엄하게 가려 뽑았다. 이 시기 흉노는 서역의 소국과 오손을 압박했다. 기원전 71년 오손의 곤미(왕)와 한 공주 해우공주가 한에 구원을 청하자, 한은 다섯 장군이 이끄는 기병 15만(사서의 수)을 내고 오손도 5만 기병을 내어 동서에서 흉노를 쳤다. 한군이 직접 만난 적은 적었지만 오손군이 흉노의 서쪽 땅에서 포로 4만 가까이와 가축 70만 마리(사서의 수)를 얻었다고 한다. 그해 겨울 흉노가 반격하다 폭설로 큰 피해를 보았고, 정령·오환 등도 흉노를 공격하면서 흉노의 힘이 크게 약해졌다. 한은 서역의 거사(車師)를 둘러싸고 흉노와 다툰 끝에 기원전 67년 이후 둔전을 두고 거점을 마련했다. 기원전 60년 흉노의 일축왕 선현탄이 내분 끝에 한에 투항하자, 둔전을 맡던 정길이 이를 받아들였고 선제는 정길을 서역도호로 삼았다. 정길은 오루성(지금의 신장 룬타이 부근)에 도호부를 세워 천산 남북의 여러 나라를 관할했다. 흉노가 서역에 두었던 동복도위는 폐지되었다. 서역에는 오아시스 도시를 중심으로 한 소국이 천산 남북에 흩어져 있었고, 도호부는 이들에게 세금을 거두기보다 군사와 외교로 관리했다. 정길은 그 공으로 안원후에 봉해졌고, 오손은 이후 한의 공주를 받으며 한과 가까워졌다. 둔전에서는 병사가 직접 농사를 지어 군량을 마련했다. 한은 기원전 105년 오손왕에게 종실의 딸 세군을 공주로 보내 혼인 동맹을 맺었는데, 해우공주도 이 혼인 관계의 이어짐이었다. 한이 서역을 군사적으로 다스리는 체제가 처음 갖춰진 것이다. 이후 서역도호부는 전한 말 신 시기에 끊겼다가 후한 때 반초가 다시 열었다(「반초의 서역 경영(73~102)과 감영의 사행(97)」(뒤의 사건))."
  subjects: [western-han, xiongnu]
  links:
    - { from: western-han, to: xiongnu, note: "일축왕의 투항과 서역도호부 설치(기원전 60)" }
  tags: [war, politics, diplomacy]
  sources: ["『한서』 선제기", "『한서』 서역전", "『한서』 흉노전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: huhanye-51bc
  year: -59
  endYear: -32
  title:
    ko: "흉노의 분열과 호한야 선우의 입조(기원전 51), 질지 선우의 죽음(기원전 36)과 왕소군(기원전 33)"
  summary:
    ko: "기원전 60년 허려권거 선우가 죽자 흉노는 후계를 둘러싸고 여러 선우가 맞서는 내전에 빠졌다. 기원전 58년 악연구제 선우를 꺾고 선우에 오른 호한야는 기원전 54년 무렵 형 질지 선우에게 밀려 남쪽으로 내려갔고, 한에 복속할지를 두고 논의한 끝에 기원전 53년 아들을 인질로 보냈다. 기원전 51년 정월 호한야는 직접 입조해 선제를 알현했다. 한은 선우를 제후왕보다 높은 자리에 앉히고 금인과 옥새·의복·안장·말·비단 등을 내렸으며(번신으로 삼았다), 군사를 보내 호한야가 북쪽 옛 땅으로 돌아가는 것을 도왔다. 질지 선우는 서쪽으로 달아나 강거 땅의 탈라스강 부근에서 세력을 키우고 한의 사절을 죽였다. 기원전 36년 서역도호 감연수와 부교위 진탕이 황제의 조서를 위조해 서역 연합군 4만(추산)을 이끌고 질지의 성을 공격해 질지를 죽였다. 진탕은 멀리 있어도 한을 거스르면 반드시 벤다고 글을 올렸다. 기원전 33년 호한야가 다시 장안에 와 한의 사위가 되기를 청하자, 원제는 궁녀 왕장(王嬙, 왕소군)을 선우에게 보냈다. 왕소군은 아들을 낳았고, 호한야가 죽은 뒤에는 흉노의 풍속에 따라 그의 아들 복주루 선우와 혼인했다고 한다. ‘소군이 변새를 나선다’고 하는 왕소군 이야기는 사서에는 간략히 나오고, 후한 이후 문학에서 크게 부풀려졌다. 질지의 머리는 장안 거리에 내걸렸고, 질지가 죽자 호한야가 다시 막북 전체의 선우가 되어 흉노가 한 번 통일되었다. 한은 호한야의 귀환을 돕기 위해 곡식 수만 곡을 보냈다. 호한야 선우를 신하의 예로 대할지를 두고 조정에서 논란이 있었으나, 선제는 신하로 칭하되 이름은 부르지 않는 예우를 택했다. 이 시기 이후 약 30년 동안 한과 흉노의 관계는 비교적 평온했으며, 왕소군 이야기는 뒷날 시와 희곡의 소재가 되었다."
  subjects: [xiongnu, western-han]
  links:
    - { from: western-han, to: xiongnu, note: "호한야 선우를 번신으로 받아들임(기원전 51)" }
  tags: [diplomacy, war]
  sources: ["『한서』 흉노전", "『한서』 원제기", "『한서』 진탕전", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: late-western-han-33bc
  year: -32
  endYear: 5
  title:
    ko: "전한 말의 외척 정치와 사회 위기(기원전 33~서기 5)"
  summary:
    ko: "원제가 죽고 성제가 즉위한 기원전 33년부터 한은 황후와 모후의 친정인 외척 가문이 권력을 쥐는 시대로 접어들었다. 성제의 어머니 왕정군의 오빠 왕봉이 대사마대장군이 된 뒤 왕씨 일가가 줄지어 대사마와 높은 관직을 차지했다. 기원전 27년에는 왕씨 다섯 사람이 같은 날 후에 봉해져 ‘다섯 후’라 불렸다. 한편 대토지를 가진 호족과 상인은 땅을 넓혔고 소농은 세금과 부채를 지다 땅을 잃어 유민과 노비가 되었다. 황허강의 범람과 기근이 잇따랐고, 기원전 22년 철관(철 생산 관청)에서 일하던 사람들의 봉기와 기원전 3년 전국에서 서왕모의 신앙이 번져 사람들이 서쪽으로 몰려든 소동은 사회 불안을 보여 준다. 애제(재위 기원전 7~1)는 기원전 7년 사단과 공광의 건의로 한전(限田)과 한노(限奴)를 추진해 관리와 귀족이 가질 수 있는 땅과 노비의 수에 상한을 두려 했으나 외척과 권력자의 반발로 시행하지 못했다. 평제(재위 기원전 1~서기 6)가 어린 나이로 즉위하자 왕정군의 조카 왕망이 대사마로서 실권을 쥐었다. 앞서 원제 때는 환관 석현이 권력을 휘둘렀고, 성제는 정치를 왕씨에게 맡긴 채 총애하는 조비연 자매에게 빠져 있었다고 한다. 『한서』 식화지는 동중서의 말을 빌려 부자의 밭은 두둑이 이어졌고 가난한 사람은 송곳 꽂을 땅도 없다고 적는다. 외척 정치만으로 한이 무너졌다고 보기는 어렵고, 호족의 대토지가 커지고 소농이 몰락하는데도 나라가 이를 풀 의지와 수단이 부족했다는 평가가 많다. 토지와 노비 문제는 해결되지 못한 채 왕망에게 넘어가는 숙제였다. 서기 2년의 호적상 인구는 약 5천9백만 명에 이르렀다(「서기 2년의 호적과 전한의 농촌 사회」(뒤의 사건)). 외척 정치가 길어지면서 한 황실의 권위는 빠르게 떨어졌다. 이 모순이 왕망의 찬탈로 이어졌다."
  subjects: [western-han]
  tags: [politics, society]
  sources: ["『한서』 성제기", "『한서』 외척전", "『한서』 식화지", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: wang-mang-xin-9
  year: 0
  endYear: 9
  title:
    ko: "왕망의 섭정과 신의 건국(기원전 1~서기 9)"
  summary:
    ko: "왕망(기원전 45~서기 23)은 외척 가문 출신이면서도 검소하고 학문을 좋아한다는 평으로 선비들의 지지를 얻었다. 기원전 1년 평제가 즉위하자 대사마로 복귀했고 서기 1년 안한공에 봉해졌으며, 딸을 평제의 황후로 들이고(서기 4) ‘재형’이라는 특별한 직위를 받아 정권을 장악했다. 평제가 5년 말 병으로 죽자(독살설이 있다) 왕망은 어린 유영을 황태자(유자)로 세우고 6년 ‘섭황제’(황제를 대신하는 사람)를 칭했다. 이에 종실 안중후 유숭(6)과 적의(7)가 거병했으나 평정되었다. 왕망은 하늘이 내렸다는 부명(符命)을 내세워 8년 말 스스로 진짜 황제에 올라 국호를 ‘신’(新)이라 하고, 이듬해를 시건국 원년(9)으로 삼았다. 이는 요순의 선양을 본뜬 형식이었다. 그가 따른 모범은 유학자들이 이상 정치로 내세우던 『주례』였다. 황실의 유영은 정안공으로 강등되었다. 왕망은 외척 중에서도 검소하고 어머니와 형의 아들을 정성껏 돌보는 사람으로 알려졌다. 아들 왕획이 노비를 죽이자 자결하게 했다는 이야기도 전한다. 평제 즉위 때는 태황태후 왕정군이 정사를 맡았으나 실제 권력은 왕망이 쥐었다. 서기 5년에는 ‘구석’이라는 최고의 예우를 받았는데, 이 방식은 뒷날 다른 찬탈에서도 되풀이되었다. 왕망은 학교를 늘리고 『좌전』 같은 고문 경전을 가르치는 학관도 세워 고문경학이 관학에 들어가는 계기를 만들었다. 서기 4년에는 그의 공덕을 칭송하는 글을 올린 관리와 백성이 48만 명이 넘었다고 『한서』는 적는다(과장일 수 있다). 이렇게 약 210년 이어진 전한이 끝났다. 왕망이 평화적 선양의 모양새를 꾸몄지만 한 황실의 정통성을 중시하는 사람들이 많았기 때문에 곧 반발에 부딪혔다. 이후 그의 개혁은 이상과 현실의 괴리 속에 흔들렸다."
  subjects: [western-han, xin]
  tags: [politics]
  sources: ["『한서』 왕망전", "『한서』 평제기", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)", "Hans Bielenstein, The Restoration of the Han Dynasty (Bulletin of the Museum of Far Eastern Antiquities 26·31·39·51호, 1954~1979)"]

- id: han-census-2
  year: 2
  title:
    ko: "서기 2년의 호적과 전한의 농촌 사회"
  summary:
    ko: "『한서』 지리지는 평제 원시 2년(서기 2년)의 호적에 기초해 한의 인구를 약 1,223만 호, 약 5,959만 명으로 적는다. 중국 왕조가 남긴 가장 오래된 전국 호구 통계로, 후한의 140년 통계는 약 970만 호, 4,915만 명으로 줄었다고 하지만 호족이 호적에서 숨긴 사람이 많아 실제 감소인지는 불확실하다. 전한의 농민은 5인 가족이 100무쯤의 농지를 경작하는 소농이 중심이었다. 농민은 수확의 30분의 1 안팎의 전조에 더해 15~56세에 성인 1명당 120전의 인두세(산부)와 어린이에 따로 매기는 구부(口賦)를 냈고, 장정은 일 년에 한 달 노역(경졸)과 1년 정규 복무(정졸), 변경 수비(수졸)에 나가야 했다. 부역은 돈으로 대신하는 길도 있었다. 철제 농기구와 소를 이용한 쟁기질(우경)이 퍼지고 조과가 보급한 대전법과 파종기 같은 기술이 생산을 늘렸다. 그러나 흉년이나 부채로 농지를 팔고 호족의 소작인이 되는 농민이 늘었다. 왕망이 땅 매매를 금한 것은 이 문제 때문이었다(「왕망의 섭정과 신의 건국(기원전 1~서기 9)」(뒤의 사건)). 농촌은 약 100호가 한 리를 이루고 10리가 한 정, 10정이 한 향이 되는 틀로 짜였다. 『한서』 지리지는 군국 103곳의 호구와 지리를 모두 적었다. 수도 장안은 약 8만 가구, 24만 6천 명으로 적혔다. 호구 조사는 해마다 8월에 현·향에서 사람 수와 재산을 파악해 위로 올리는 방식이었고, 호족에 의탁해 호적에서 빠진 사람과 장부의 누락 때문에 수치를 그대로 믿기는 어렵다. 인구는 황허강 중하류의 하남·산둥 평원에 몰려 있어 경제의 중심이 화북 평원에 있었음을 보여 준다. 내몽골 어지나 일대의 거연한간 같은 출토 문서도 변경 수비병의 생활과 관청 문서를 보여 주는 귀중한 자료이다."
  subjects: [western-han]
  tags: [society, economy]
  sources: ["『한서』 지리지", "『한서』 식화지", "『후한서』 군국지(속한서 군국지)", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: xin-reforms-9
  year: 9
  endYear: 14
  title:
    ko: "신의 개혁: 왕전제와 화폐 개혁, 오균·육관, 대외 정책(9~14)"
  summary:
    ko: "왕망은 『주례』를 모범으로 삼아 제도를 크게 바꾸었다. 9년 천하의 토지를 ‘왕전’이라 부르며 매매를 금지하고, 한 가구에서 남자 8명이 안 되는데 토지가 1정(900무)을 넘으면 넘는 땅을 일가와 이웃에게 나눠 주게 했다. 노비는 ‘사속’이라 하여 사고팔 수 없게 했다. 이 정책은 호족의 반발과 현실적 어려움으로 12년에 철회되었다. 화폐는 금·은·거북·조개·동전을 합쳐 28종의 화폐를 만들었다가 14년에 두 종으로 정리하는 등 여러 번 바꿔 시장이 혼란에 빠졌다. 10년에는 소금·술·철·화폐 주조·산림과 연못의 산물·국가 대출을 나라가 맡는 ‘육관’과, 시장 가격을 조절하는 ‘오균’을 두었다. 11년 무렵에는 황허강이 크게 범람해 하도가 바뀌고 큰 기근이 들었다. 대외로는 흉노 선우의 인장을 낮춘 이름(‘항노복우’)으로 바꾸어 외교 관계를 악화시켰고, 12년 고구려 군사를 흉노 원정에 동원하려다 반발을 샀다(「유리왕의 양맥 정벌과 고구려현 습격」(뒤의 사건)). 서역과의 관계도 끊겨 서역도호부는 힘을 잃었다. 관직과 지명도 『주례』에 맞춰 고쳐, 태수를 ‘대윤’, 도위를 ‘태위’, 현령을 ‘재’, 장안을 ‘상안’으로 불렀다. 법이 복잡해 관리도 이해하기 어려웠고 법에 걸리는 사람이 늘었다. 육관을 맡은 관리 가운데는 부유한 상인 출신이 많아 오히려 시장이 혼란스러워졌다고 『한서』는 비판한다. 개혁의 취지는 호족의 대토지와 노비 문제를 풀고 상인의 독점을 막으려는 것이었으나, 실행 과정에서 법령이 자주 바뀌고 부정한 관리가 늘어 백성이 오히려 고통받았다. 개혁은 이상을 앞세워 현실을 고려하지 못했고, 관직과 지명을 자주 바꾸는 것도 혼란을 키웠다. 개혁이 빈민을 구하려 했다는 점을 높이 사는 학자도 있다."
  subjects: [xin, xiongnu, goguryeo]
  tags: [politics, economy]
  sources: ["『한서』 왕망전", "『한서』 식화지", "『한서』 흉노전", "The Cambridge History of China, vol. 1: The Ch'in and Han Empires, 221 B.C.–A.D. 220 (Denis Twitchett·Michael Loewe 편, Cambridge University Press, 1986)"]

- id: xin-fall-17
  year: 17
  endYear: 23
  title:
    ko: "녹림·적미의 봉기와 신의 멸망(17~23)"
  summary:
    ko: "왕망의 개혁이 혼란을 낳고 황허강 범람과 기근이 이어지면서 17년 형주 신시의 왕광·왕봉이 굶주린 사람들을 이끌고 녹림산에서 일어났다(녹림군). 18년 낭야에서는 번숭이 봉기하며 신의 군대와 구별하려고 눈썹을 붉게 칠해 ‘적미군’이라 불렸다. 두 봉기군은 수만에서 수십만으로 늘어 신의 관군을 여러 번 무찔렀다. 22년 녹림군은 전염병으로 흩어졌고, 그중 일부는 남양 지방의 한 종실 유연·유수 형제의 세력과 합쳐졌다. 23년 2월 유현이 ‘경시제’로 즉위해 한의 부흥을 내세웠다. 23년 6월 곤양에서 유수가 이끈 수천의 결사대가 왕심·왕읍의 대군(사서는 40만 이상이라 하나 과장일 수 있다)을 무찔러 신의 군대가 무너졌다. 같은 해 가을 장안의 백성이 궁성에 들어가자, 왕망은 음력 10월 궁궐 안에서 상인 두오에게 살해되었다. 경시제의 군대가 들어선 장안은 곧 적미군에게 점령되었고 경시제도 죽었다(25). 경시제의 조정은 장안에 들어간 뒤 방탕과 파벌 다툼으로 인심을 잃었다고 한다. 적미군은 한 종실의 소년 유분자를 황제로 세워(25) 장안을 차지했다. 녹림·적미 봉기는 기근과 황허강 홍수로 먹을 것을 잃은 농민이 무리를 이룬 것이며, 처음에는 정치적 목표가 뚜렷하지 않았다고 보는 학자가 많다. 신의 관군은 징발된 병사가 많아 사기가 낮았고 지휘관들 사이에도 불화가 있었다. 왕망은 마지막까지 “하늘이 나에게 덕을 내렸으니 한의 군사가 나를 어쩌겠는가”라며 천명을 말했다고 『한서』는 전한다. 신은 15년 만에 무너졌고 중국은 다시 군웅의 시대로 접어들었다. 왕망이 시대에 맞지 않는 제도를 강행해 반란을 불렀다는 평가가 일반적이지만, 한 부흥 세력의 입장에서 쓴 사서가 그를 부정적으로 다루었다는 점도 고려해야 한다."
  subjects: [xin]
  tags: [war, society]
  sources: ["『한서』 왕망전", "『후한서』 유현유분자열전", "『후한서』 광무제기", "Hans Bielenstein, The Restoration of the Han Dynasty (Bulletin of the Museum of Far Eastern Antiquities 26·31·39·51호, 1954~1979)"]

- id: guangwu-founding-25
  year: 23
  endYear: 36
  title:
    ko: "광무제의 후한 건국과 통일(23~36)"
  summary:
    ko: "유수(광무제)는 전한 경제의 후손으로 남양의 호족 출신이다. 장안에서 학문을 익힌 그는 22년 형 유연과 함께 거병했고, 23년 곤양 전투에서 신의 군대를 꺾어 명성을 얻었다. 경시제(유현)가 형 유연을 죽였으나 유수는 속내를 숨기고 하북을 평정하러 나갔다. 24년 한단의 왕랑을 무너뜨린 뒤 호족과 흩어진 병력을 모았고 25년 6월 호(鄗)에서 황제에 올라 ‘건무’라는 연호를 썼다. 그는 뤄양에 도읍을 정했다(후한). 적미군이 유분자를 황제로 세워 장안을 점령하고 경시제를 죽인(25) 뒤 식량이 떨어져 동쪽으로 향하자 광무제는 27년 이양(宜陽)에서 이들의 항복을 받았다. 이어 서쪽 농서의 외효와 촉의 공손술 등 군웅을 평정했다. 공손술은 25년 촉(지금의 쓰촨)에서 황제를 칭했으나 36년 그의 도읍 청두가 함락되면서 멸망했다. 이로써 광무제가 중국을 다시 통일했다. 광무제는 하북에서 동마 같은 농민군을 항복시켜 병력을 불렸고, 즉위 뒤에는 공신을 후에 봉하되 관직은 맡기지 않아 권력 다툼의 싹을 줄였다. 곤양 전투에서 유수는 결사대 3천을 직접 이끌고 신군 본진을 찔렀고, 마침 폭풍우와 홍수가 신군에 불리하게 작용했다고 『후한서』는 적는다. 이 소식이 퍼지자 각지에서 신에 반기를 드는 일이 이어졌다. 장안이 있는 관중은 적미군의 약탈로 황폐해졌고, 광무제는 뤄양에 도읍을 두어 이 왕조를 뒤에 동한이라 부르게 되었다. 후한은 남양과 하북 호족 연합을 기반으로 세워졌기 때문에 호족의 힘이 컸고, 이것이 후한 사회의 특징이 되었다. 한의 재건이라는 이유로 국호를 그대로 쓰되 전한(서한)·후한(동한)으로 나누어 부른다. 후한 초기에는 서북 변경에서 흉노와 강족이 다시 활동하기 시작했다."
  subjects: [eastern-han, xin]
  tags: [war, politics]
  sources: ["『후한서』 광무제기", "『후한서』 외효공손술열전", "Hans Bielenstein, The Restoration of the Han Dynasty (Bulletin of the Museum of Far Eastern Antiquities 26·31·39·51호, 1954~1979)", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: guangwu-rule-30
  year: 30
  endYear: 57
  title:
    ko: "광무제의 통치: 세금 경감과 도전 검사, 교지의 징 자매 반란(30~57)"
  summary:
    ko: "광무제는 내전을 끝낸 뒤 ‘유도(柔道)’라 부르는 온건한 방식으로 나라를 다스렸다. 건무 6년(30) 전쟁 때문에 높였던 세금을 수확의 30분의 1로 되돌렸고 이듬해에는 병력을 줄였으며, 400여 개 현을 합쳐 관리 수를 줄였다. 전쟁 중에 노비가 된 사람을 풀어 주는 노비 해방령을 여러 차례 내렸다. 건무 15년(39)에는 전국의 토지와 호구를 조사하는 도전(度田) 검사를 벌였는데, 호족과 관리가 결탁해 땅과 호구를 숨겼다. 이듬해(40) 음력 9월 하남윤 장급과 여러 군 태수 십여 명이 도전을 사실대로 하지 않았다는 죄로 옥에서 죽었고, 그 뒤 호족이 청주·서주·유주·기주에서 무장 반란을 일으켰다가 곧 진압되었다. 그러나 호족의 반발이 커서 검사는 철저히 이루어지지 못했고, 이 일은 후한 정권이 호족과 맞서기 어려웠음을 보여 준다. 40년 남쪽 교지(지금의 베트남 북부)에서 징측·징이 자매가 토착 지배자들과 함께 한의 관리 소정(蘇定)의 가혹한 통치에 반기를 들고 60여 성을 차지하자, 광무제는 41년 복파장군 마원을 보내 43년 진압했다. 이후 한은 이 지역을 직접 지배하는 체제를 굳혔고, 베트남에서는 두 자매를 민족 영웅으로 기린다. 광무제는 57년 60대 초반의 나이로 죽었다. 같은 해에 일본 규슈의 왜 노국왕에게 금인을 내렸다고 전한다(「후한 광무제가 왜의 노국왕에게 금인을 내림」(뒤의 사건)). 중앙에서는 정치 실무를 보는 상서대의 힘을 키워 삼공의 권한을 줄였고, 뤄양에 태학을 세워 유학을 장려했다. 광무제가 죽던 57년의 호적은 약 428만 호, 2,100만 명으로 전한 말의 3분의 1 남짓이었다(『속한서』 군국지 주). 전란으로 줄고 호족이 숨긴 사람이 많은 탓이다. 광무제는 외척을 정치에 앉히지 않는다는 원칙도 세웠으나 이 원칙은 뒤에 깨졌다. 광무제 때 안정을 되찾은 후한은 명제·장제까지 번영했고 ‘명장지치’라 불린다."
  subjects: [eastern-han, wa]
  tags: [politics, society]
  sources: ["『후한서』 광무제기", "『후한서』 마원열전", "『후한서』 남만서남이열전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: southern-xiongnu-48
  year: 48
  endYear: 50
  title:
    ko: "흉노의 남북 분열과 남흉노의 입새(48~50)"
  summary:
    ko: "신의 시기에 한과 갈라선 흉노는 후한 초에 다시 힘을 얻어 북쪽 변경을 약탈했다. 46년 호도이시 선우가 죽은 뒤 그 아들 오달제후가 올랐다가 곧 죽고 아우 포노가 이었으나 후계를 둘러싼 갈등이 일었고, 연이은 가뭄과 메뚜기 떼로 가축이 큰 피해를 입어 내부가 흔들렸다. 48년 남쪽 8부의 대인들이 오주류 선우의 맏아들로 일축왕이던 비(比)를 선우로 추대하자, 비는 한에 신하를 칭하고 한과 손잡아 북쪽의 선우를 막겠다고 청했다(남흉노). 광무제는 이를 받아들였고 50년 남선우의 도읍을 서하군의 미직(지금의 내몽골 오르도스 동쪽)에 정했다. 흉노의 8부는 북쪽 변경의 군에 나누어 살게 되었고, 한은 이들을 감독할 사흉노중랑장을 두었으며 곡식을 지원했다. 비는 한의 질서에 들어오겠다며 ‘호한야 선우’라는 이름을 다시 썼다. 한은 남흉노를 시켜 북흉노와 오환·선비를 견제하는 방식으로 변경을 지켰다. 남선우는 해마다 사절을 보냈고 한은 선우정 곁에 중랑장 막부를 두어 감독했다. 89년 남흉노는 두헌의 한군과 함께 북흉노를 쳤다. 이 정책은 전한 때 호한야 선우를 받아들인 선례를 되풀이한 것이었고, 흉노를 변경 안으로 들이는 일이 훗날 화근이 될 것이라 걱정한 사람도 있었다. 남흉노는 한의 변방 방어 병력으로 북흉노와 선비를 막는 데 쓰였다. 한은 북흉노가 화친을 청했을 때 남흉노를 의식해 선물을 주되 받아들이지 않는 방식으로 균형을 잡았다. 이후 남흉노는 후한의 변경 안에서 살면서 점차 한화되어 갔다. 흉노가 갈라진 뒤 북흉노는 선비와 한의 압박으로 쇠퇴해 89~91년의 싸움 뒤 서쪽으로 사라졌다(「북흉노의 서쪽 이동과 선비의 초원 장악」(뒤의 사건)). 남흉노 선우의 후예를 자처한 유연은 304년 산시 일대에서 한(뒤의 전조)을 세워 5호 16국 시대의 문을 열었다."
  subjects: [xiongnu, eastern-han]
  links:
    - { from: eastern-han, to: xiongnu, note: "남흉노 선우를 번속으로 받아 서하 미직에 정착시킴(50)" }
  tags: [diplomacy, politics]
  sources: ["『후한서』 남흉노열전", "『후한서』 광무제기", "Nicola Di Cosmo, Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History (Cambridge University Press, 2002)"]

- id: buddhism-han-65
  year: 65
  endYear: 170
  title:
    ko: "불교의 전래와 초기 번역(65~170 무렵)"
  summary:
    ko: "불교는 서역을 거쳐 후한 때 중국에 들어왔다. 확실한 기록으로는 65년 명제의 이복형제 초왕 유영이 ‘황로(도가)의 미묘한 말을 외우고 부처의 사당(浮屠仁祠)에 재계하고 제사한다’는 조서를 받은 일이 있다. 『후한서』 서역전은 명제가 꿈에 금빛 사람을 보고 사신을 서쪽으로 보내 구법하게 했다고 적으며, 사신이 백마에 경전과 불상을 싣고 돌아와 뤄양에 백마사를 세웠다는 이야기는 훨씬 뒤의 전승이다. 불교는 처음에는 도가의 신선 사상과 비슷한 방술의 하나로 받아들여졌다. 2세기 중엽 안식 출신 승려 안세고가 148년 무렵 뤄양에 와서 소승 경전을 한문으로 옮겼고, 월지 출신 지루가참은 168년 무렵부터 『반야경』 같은 대승 경전을 옮겼다. 번역은 도가 용어를 빌려 불교 개념을 설명하는 방식(격의)이 많았다. 166년 환제는 궁중에서 노자와 부처에게 함께 제사를 지냈다고 『후한서』는 전한다. 후한 말 서주의 착융은 큰 불당을 세우고 불상에 금을 입혀 수천 명을 모아 법회를 열었다고 『삼국지』는 전한다. 초왕 영은 70년 모반 혐의로 지위를 잃고 이듬해 자결했다. 쓰촨의 한대 무덤에서는 불상이 새겨진 유물이 나와 중원 밖에서도 불교가 일찍 퍼졌음을 보여 준다고 한다. 초기 불교의 관심은 금욕과 명상, 업보와 윤회였으나 중국 전통 사상과 달라 처음에는 낯선 외래 신앙으로 여겨졌다. 승려는 서역 출신이 대부분이었고 한인의 출가는 한참 뒤에야 허락되었다고 전한다. 그때까지 불교는 주로 외국 상인과 승려, 일부 귀족과 지식인 사이에 퍼진 작은 신앙이었으며 아직 교단으로 자리 잡지는 못했다. 이후 위진 남북조에 큰 종교가 되어 한반도에도 전해졌다."
  subjects: [eastern-han]
  tags: [religion, culture]
  sources: ["『후한서』 광무십왕열전 초왕영", "『후한서』 서역전", "Erik Zürcher, The Buddhist Conquest of China (Brill, 1959)", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: ban-chao-73
  year: 73
  endYear: 102
  title:
    ko: "반초의 서역 경영(73~102)과 감영의 사행(97)"
  summary:
    ko: "전한 말 신의 혼란기에 서역 여러 나라는 다시 흉노에 복속했다. 73년 후한의 두고가 북흉노를 치러 가자 말단 관리였던 반초는 사자로 서역에 파견되었다. 반초는 선선에서 흉노 사절이 온 날 밤 36명의 부하와 함께 이들을 급습해 선선왕을 한 편으로 끌어들였고, 우전·소륵 등도 한에 붙었다. 74년 도호부가 다시 설치되었으나 75년 서역도호 진목이 언기·쿠차 사람들에게 살해되었고, 그해 명제가 죽어 장제가 서자 조정이 서역에서 손을 떼려 하면서 반초도 소환되었으나 소륵과 우전 사람들이 반초를 붙잡아 머물게 했다. 반초는 서역 내부의 갈등을 이용하고 현지 군사를 쓰는 방식으로 90년까지 쿠차, 고묵 등을 눌렀다. 90년 쿠샨(월지)의 군대를 물리친 뒤 91년 서역도호에 올랐고, 94년에는 언기를 쳐서 서역 50여 국을 모두 한에 복속시켰다고 한다. 97년 그는 부하 감영을 대진(로마)으로 보냈다. 감영은 페르시아만 가까운 조지에서, 바닷길이 순풍이면 석 달이고 아니면 2년이 걸린다는 안식(파르티아) 뱃사람의 말을 듣고 되돌아왔지만, 서역 소식을 상세히 전했다(「로마와 한: 비단길의 교역과 감영(97)·대진왕 안돈의 사절(166)」(앞의 사건)). 반초의 군대는 한군보다 서역 나라들의 병력이 주였다. 94년 언기 원정에는 서역 여러 나라 군사 7만여 명(사서의 수)이 동원되었다고 한다. 반초의 아들 반용은 123년 서역 장사로 돌아와 서역 경략을 다시 이끌었다. 반초는 귀국을 청하는 글에서 살아서 옥문관에 들어가기만을 바란다고 썼다고 『후한서』는 전한다. 서역 경영에 드는 비용이 커서 조정에서는 서역을 포기하자는 의견도 자주 나왔다. 70세 안팎이던 반초는 고국이 그리워 귀국을 청해 102년 뤄양으로 돌아와 한 달 남짓 만에 죽었다. 그가 떠난 뒤 서역은 다시 불안해졌고 107년 안제가 서역도호부를 철폐했다. 한의 서역 경영은 북흉노를 고립시키고 비단길을 열었다는 점에서 의미가 크다."
  subjects: [eastern-han, xiongnu]
  tags: [war, diplomacy]
  sources: ["『후한서』 반초열전", "『후한서』 서역전", "『한서』 서역전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: consorts-eunuchs-92
  year: 92
  endYear: 159
  title:
    ko: "외척과 환관의 정치: 두헌의 제거(92)에서 양기의 몰락(159)까지"
  summary:
    ko: "후한은 어린 황제가 잇따라 즉위하는 일이 잦았다. 어린 황제가 즉위하면 황태후가 대신 정사를 맡고 그 친정 외척이 대장군으로 실권을 쥐었으며, 황제가 자라면 가까이 있는 환관과 손잡고 외척을 제거했다. 환관은 그 공으로 후에 봉해지고 권력을 얻었고, 다음에 또 어린 황제가 서면 같은 일이 되풀이되었다. 화제는 어린 나이로 즉위(88)한 뒤 두태후의 오빠 두헌이 대장군이 되어 북흉노를 쳐서 공을 세웠으나(89), 92년 화제가 환관 정중과 손잡고 두헌을 몰아내 자살하게 했다. 105년 화제가 죽자 등태후가 생후 100일 남짓의 상제를 세웠고 이듬해 상제가 죽자 안제를 세워 121년까지 정사를 맡았고, 그 죽음 뒤 안제는 환관과 황후 염씨 일족에 기대어 힘을 얻었다. 125년 안제가 죽고 염씨가 세운 북향후 유의가 곧 죽자 환관 손정 등 19명이 순제를 세웠고(125) 모두 후에 봉해졌다. 135년에는 환관이 양자를 들여 작위를 물려줄 수 있게 되었다. 순제의 황후 양씨의 오빠 양기는 141~159년 대장군으로 일했다. 순제가 죽고 갓난아이에 가까운 충제가 즉위(144)했으나 이듬해 죽자 어린 질제를 세웠는데, 146년 질제가 양기를 ‘발호 장군’이라 부르자 양기가 독을 먹여 죽였다고 전한다. 이후 양기는 환제를 세워 권세를 누렸으나, 159년 환제가 환관 선초 등 다섯 사람과 손잡고 양기 일가를 없앴고 이 다섯 환관은 모두 후가 되었다. 후한에서는 황제가 궁중에서 문서를 환관을 거쳐 처리하는 일이 많아 이들이 황제와 바깥 관료 사이를 가로막기 쉬웠다. 외척은 유학 소양을 지닌 가문이 많아 사대부와 이어지는 경우도 있었다. 이 구조는 전한 말의 외척 정치를 되풀이하면서 환관이라는 새 요소가 더해진 것이었다. 이후 환관이 정치를 쥐고 사대부와 갈등하는 시대가 열렸다(「당고의 금(166·169)과 후한 사대부」(뒤의 사건))."
  subjects: [eastern-han]
  tags: [politics]
  sources: ["『후한서』 황후기", "『후한서』 환자열전", "『후한서』 양통열전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: cai-lun-105
  year: 100
  endYear: 132
  title:
    ko: "채륜의 종이(105)와 후한의 학술·기술(100~132)"
  summary:
    ko: "후한은 학문과 기술이 크게 발전한 시대였다. 반고는 『사기』를 이어 전한 한 왕조만을 다룬 『한서』를 쓰기 시작했고, 92년 그가 죽은 뒤 누이 반소가 이를 완성했다. 허신은 100년 『설문해자』를 완성해(121년 아들이 황제에게 올렸다) 9,353자의 한자를 540개 부수로 나누고 글자의 뜻과 구성 원리를 설명했다. 경전 해석은 새 글자로 쓴 금문경학과 옛 글자 판본에 근거한 고문경학이 맞서다가, 후한 말 정현이 두 학풍을 아울러 주석을 달았다. 환관 상방령 채륜은 105년 화제에게 나무껍질·삼베·헝겊·낡은 어망 등으로 종이를 만드는 방법을 올렸다. 전한의 무덤에서도 종이 조각이 나와 채륜이 처음 종이를 만든 것은 아니고 방법을 개량했다고 보지만, 이후 값싼 종이가 점차 비단과 죽간을 대신했다. 천문학자 장형은 천체의 움직임을 보여 주는 혼천의를 만들었고 132년에는 지진이 일어난 방향을 알려 주는 기계(지동의)를 만들었다고 한다. 한 대의 철기와 비단, 옻칠 기술과 약재를 쓴 의학도 발전했다. 후한의 종이 제조법은 8세기 탈라스 전투 뒤 이슬람 세계로 전해졌고 유럽에는 훨씬 뒤 전해졌다고 알려져 있다. 역법도 발전해 85년에는 사분력이 시행되었다. 채륜은 안제 때인 121년 정치 싸움에 얽혀 스스로 목숨을 끊었다. 후한 말 장중경은 전염병을 다룬 『상한잡병론』을 지었다. 건무 7년(31) 남양 태수 두시는 물의 힘으로 풀무를 움직이는 수배를 만들어 철 생산을 늘렸다. 후한 시대에도 비단과 죽간·목간이 오래 함께 쓰였고, 종이의 보급은 3~4세기 이후에 본격화한다. 이렇게 학문을 쌓은 사대부는 정치에 맞서는 힘을 키웠고 그 갈등은 「당고의 금(166·169)과 후한 사대부」(뒤의 사건)에서 드러났다."
  subjects: [eastern-han]
  tags: [culture]
  sources: ["『후한서』 환자열전 채륜", "『후한서』 장형열전", "『후한서』 유림열전", "허신, 『설문해자』 서문", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: qiang-wars-107
  year: 107
  endYear: 169
  title:
    ko: "서북 강족의 반란과 후한의 변경(107~169)"
  summary:
    ko: "강(羌)은 지금의 칭하이·간쑤·쓰촨 서부에 살던 여러 부족의 이름으로, 가축을 기르면서 농사도 지었다. 후한은 이들 일부를 농서 등 서북 변경 군에 옮겨 살게 했으나 관리와 호족의 수탈로 불만이 쌓였다. 107년 서역도호부 철수를 위해 군대를 모으면서 강 사람들을 징발하자 이들이 도망치다 봉기했고(영초 원년), 강은 농서·한중과 서부의 군현에 침입해 118년까지 싸움이 이어졌다. 이 싸움에서 등태후의 오빠 등즐 등이 서북 군을 포기하자는 의견까지 냈고, 비용이 240억 전에 이른다고 『후한서』는 적는다(추산). 140~145년에는 순제 때 다시 강이 봉기해 병주·량주 일대를 어지럽혔다. 159~169년에는 환제·영제 때 세 번째 대규모 반란이 일었는데, 황보규·장환·단경(‘량주삼명’)이 맞서 싸웠다. 단경은 168~169년 강의 근거지를 거듭 공격해 수만 명을 죽였다고 전하며 이는 강족 측에 큰 인명 피해를 낸 가혹한 진압이었다. 강 사람들 가운데는 한군에 편입되어 싸운 이도 있었다. 조정은 남흉노·오환·선비 병력을 불러 강을 막기도 했다. 한은 호강교위를 두어 강을 관리했으나 관리의 부정과 토지 침탈이 겹쳐 반란이 되풀이되었다. 영초 연간에 서북 군을 포기하자는 의견이 나오자 우후가 서북을 잃으면 관중이 위험해진다고 반대해 방어가 유지되었다. 『후한서』 서강전은 강 사람들이 한 관리의 수탈과 토지 침탈, 노비처럼 부려지는 처우에 반발했다고 지적한다. 한 번 진압된 뒤에도 불만이 풀리지 않아 같은 지역에서 반란이 되풀이되었다. 이 전쟁들로 서북의 한인과 강, 흉노, 선비가 뒤섞이고 변경 군현의 인구가 줄었으며, 군사를 거느린 장수들이 사병을 거느리는 지방 세력으로 커졌다. 훗날 서북 출신 군대를 이끌고 뤄양에 들어온 동탁이 그런 인물이다(「하진의 환관 제거와 동탁의 전횡(189~192)」(뒤의 사건))."
  subjects: [eastern-han]
  tags: [war, society]
  sources: ["『후한서』 서강전", "『후한서』 단경열전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: tanshihuai-xianbei-156
  year: 156
  endYear: 181
  title:
    ko: "단석괴의 선비 연맹(156~181)"
  summary:
    ko: "북흉노가 서쪽으로 사라진 뒤(91) 남은 흉노 10여만 락이 스스로를 선비라 불렀고, 선비는 몽골 초원으로 퍼져 나갔다(「북흉노의 서쪽 이동과 선비의 초원 장악」(앞의 사건)). 2세기 중엽 선비의 한 부 출신 단석괴는 156년 운중군을 습격하며 두각을 드러냈고 곧 선비를 하나로 묶었다. 『후한서』는 그가 용맹하고 지혜로웠으며 법을 엄하게 세워 여러 부가 따랐다고 적는다. 그는 고류(지금의 산시성 양가오 부근)에서 300여 리 북쪽 탄한산(彈汗山) 근처 철구수(歠仇水) 가에 아정(근거지)을 세웠다. 영토는 동·중·서 세 부로 나누었는데, 동부는 우북평에서 요동까지 20여 읍, 중부는 우북평에서 상곡까지 10여 읍, 서부는 상곡 이서에서 돈황까지 20여 읍이었고 각각 대인을 두었다. 단석괴는 한의 변경을 자주 침략했고 177년 한이 3로로 3만여 기병을 보내 쳤을 때는 한군이 열에 일고여덟을 잃고 크게 패했다. 한이 사자를 보내 그를 왕으로 봉하고 화친을 청했으나 단석괴는 거절했다고 한다. 181년 그가 죽은 뒤 연맹은 분열되었고 아들 화련이 뒤를 이었으나 189년 무렵 죽었고 조카 괴두와 보도근이 이어받는 사이 연맹은 여러 부로 갈라졌으며 가비능 등이 따로 세력을 이루었다. 『후한서』는 단석괴의 어머니가 우박을 삼키고 그를 낳았다는 전설을 적는다. 또 그가 동쪽으로 부여를 물리치고 서쪽으로 오손을 쳤으며 북쪽으로 정령을 막았다고 전한다. 『후한서』는 그가 동쪽으로 왜인의 나라를 쳐서 천여 가를 포로로 잡아 진수 가에 옮겨 고기잡이를 시켜 식량을 보탰다고 적는다(『삼국지』 주석이 인용한 『위서』는 한인(汗人)으로 적으며 요동 번한현 사람으로 보는 설이 있다). 단석괴의 연맹은 강한 한 사람의 지도력에 의존해서 그가 죽자 곧 갈라졌다. 선비는 이 시기에 흉노의 옛 땅을 차지했고, 뒤에 모용부·탁발부·우문부가 갈라져 중원으로 진출하는 바탕이 되었다."
  subjects: [xianbei, eastern-han, buyeo]
  tags: [politics, war]
  sources: ["『후한서』 오환선비열전", "『삼국지』 위서 오환선비동이전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: partisan-prohibitions-166
  year: 166
  endYear: 184
  title:
    ko: "당고의 금(166·169)과 후한 사대부"
  summary:
    ko: "환관이 권력을 쥐면서 관직 매매와 부패가 늘자 유학을 익힌 관료와 태학생은 환관을 비판하는 ‘청류’를 이루었다. 환제 때 사예교위 이응이 방사 장성이 사람을 죽이고도 사면령으로 풀려난 일에 분노해 그를 처형하자 환관은 이응 등이 무리를 지어 조정을 비방한다고 모함했다. 166년 이응을 비롯한 청류 인사 200여 명이 ‘당인(黨人)’으로 몰려 붙잡혔고, 이듬해 두무가 상서를 올려 풀려났으나 평생 관직에 나갈 수 없게 되었다(당고의 금). 168년 영제가 즉위하자 외척 두무와 태부 진번이 환관을 없애려다 계획이 새어 나가 환관 조절·왕보에게 오히려 죽임을 당했다. 169년 환관이 다시 청류를 크게 탄압해 이응·두밀·범방 등 100여 명이 옥에서 죽었고, 이들과 가까운 사람들까지 벼슬길이 막혔다(2차 당고). 176년에는 금고 대상이 가까운 일가까지 넓어졌다. 사대부들은 서로 ‘삼군’이나 ‘팔준’ 같은 호칭을 붙여 평가하며 공론을 만들었고, 환제 때 태학생은 3만 명을 넘었다고 한다. 범방이 어머니에게 작별하자 어머니가 이응·두밀과 이름을 나란히 했으니 죽어도 한이 없다고 말했다는 이야기가 전하며, 이들의 ‘청의’는 뒤 시대 사대부의 정치 의식에 큰 영향을 미쳤다. 당고를 겪은 뒤 사대부 사회에서 세상에서 물러나 학문과 담론을 즐기는 흐름이 생겼고, 이를 위진 시대 청담의 배경 가운데 하나로 보기도 한다. 이 금지는 184년 황건적의 난이 일어나자 당인이 황건에 가담할까 두려워 풀렸다. 당고의 금은 정직한 사대부의 힘을 꺾고 정치에 대한 신뢰를 무너뜨렸다. 그 뒤 영제는 관직을 돈을 받고 파는 등 부패가 더 심해졌다. 이는 지방의 반란과 군웅 할거로 이어졌다(「태평도와 황건적의 난(184)」(뒤의 사건))."
  subjects: [eastern-han]
  tags: [politics, society]
  sources: ["『후한서』 당고열전", "『후한서』 환자열전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: yellow-turban-184
  year: 184
  endYear: 185
  title:
    ko: "태평도와 황건적의 난(184)"
  summary:
    ko: "후한 말 외척과 환관의 싸움, 호족의 토지 겸병, 흉년과 전염병이 겹쳐 농민의 삶이 무너지자 거록 출신 장각이 병을 고치고 죄를 뉘우치게 하는 태평도를 퍼뜨렸다. 장각은 ‘대현량사’를 칭하며 수십만 신도를 모았고, 기주·청주·서주·유주·형주·양주·연주·예주의 8주에 36방(方)이라는 조직을 두어 큰 방은 1만 명, 작은 방은 6~7천 명이 대표를 따르게 했다. ‘푸른 하늘은 이미 죽었고 누런 하늘이 곧 서리라, 갑자년(184)에 세상이 크게 길하리라’는 말을 내걸었다. 뤄양의 환관을 내응하게 하며 거사를 계획했으나 제자 당주의 밀고로 마원의가 뤄양에서 처형되자 장각은 184년 음력 2월 서둘러 봉기했다. 황건을 쓴 무리가 여러 군을 습격하자 조정은 하진을 대장군으로 삼아 뤄양 방어를 맡기고 황보숭·주준·노식 등을 보냈다. 장각은 음력 10월 광쭝 싸움에 앞서 병으로 죽었고, 황보숭이 광쭝에서 승리해 장량을 죽였고 음력 11월 하곡양에서 장보를 죽였다. 조조도 이 싸움에서 공을 세웠다. 장각은 신도에게 잘못을 뉘우치게 하고 부적을 태운 물을 마시게 해 병을 고친다고 가르쳤다. 봉기는 지금의 허베이·허난·산둥·후베이 일대에 퍼졌고, 같은 해 서북 량주에서도 북궁백옥·이문후 등 강·월지 출신 병사가 변장·한수를 끌어들여 반란을 일으켰다. 4년 뒤(188) 영제는 서원에 팔교위라는 직속 군을 두었고, 그 비용은 관직을 팔아 마련했다. 황건 봉기에 참가한 이들은 주로 가난한 농민이었고, 종교 조직인 방(方) 체제로 신도를 동원했다. 이 난은 중국사에서 종교 결사가 일으킨 대규모 반란의 선구로 꼽힌다. 황건의 난은 한 해 만에 평정되었으나 그 잔당이 흑산적 등으로 각지에서 이어졌고, 조정은 진압을 위해 주목과 군벌에게 군사권을 주어야 했다(188년 주목 제도). 이는 지방 군벌이 힘을 키워 후한이 사실상 무너지는 길이 되었다."
  subjects: [eastern-han]
  tags: [religion, war, society]
  sources: ["『후한서』 황보숭주준열전", "『후한서』 영제기", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: dong-zhuo-189
  year: 189
  endYear: 192
  title:
    ko: "하진의 환관 제거와 동탁의 전횡(189~192)"
  summary:
    ko: "189년 영제가 죽고 하황후의 아들 소제가 즉위하자 황후의 오빠 대장군 하진은 환관 십상시를 없애려 했다. 하황후가 반대하자 하진은 원소의 건의로 지방의 장수들을 뤄양 주변으로 불러 압박하려 했고, 서북 변경 출신으로 하동에 주둔하던 동탁도 소환되었다. 8월 하진이 입궁했다가 환관 장양 등에게 살해되자 원소·원술이 궁궐에 들어가 환관 2천여 명을 죽였다. 장양 등은 소제와 진류왕을 데리고 달아났고 동탁이 이들을 만나 뤄양을 장악했다. 9월 동탁은 소제를 폐위하고 진류왕 유협(헌제)을 세웠으며 스스로 상국이 되어 조정을 휘둘렀다. 190년 원소를 맹주로 하는 반동탁 연합군이 일어나자 동탁은 뤄양을 불태우고 헌제를 끌고 장안으로 천도했으며 화폐를 새로 만들어 물가를 흔들었다. 그의 잔혹한 행실이 사대부의 반감을 샀고 192년 4월 사도 왕윤과 부하 여포가 그를 죽였다. 동탁의 옛 부하 이각·곽사는 곧 장안을 공격해 왕윤을 죽이고 정권을 차지했으나 서로 다투었다. 동탁은 농서 출신으로 강족·한인 기병을 거느린 서북 변경의 장수였다. 폐위된 소제와 하태후는 곧 죽임을 당했다. 반동탁 연합군은 서로 눈치만 보다 흩어졌고, 손견이 뤄양에 먼저 들어가 옥새를 얻었다는 이야기가 전한다(190~191년 무렵). 장안으로 옮긴 뒤 동탁은 미오에 성을 쌓아 곡식을 쌓아 두고 스스로 태사를 칭했다. 동탁이 죽은 뒤 장안에서는 이각·곽사의 약탈로 사람들이 굶주려 서로 잡아먹는 일이 있었다고 『후한서』는 전한다. 이로써 후한 조정은 힘을 잃고 천하는 군웅이 땅을 나누어 가지는 시대가 되었다. 서북의 강족 전쟁이 만든 군사 세력이 정치를 직접 좌우한 사건이었다(「서북 강족의 반란과 후한의 변경(107~169)」(앞의 사건))."
  subjects: [eastern-han]
  tags: [politics, war]
  sources: ["『후한서』 동탁열전", "『후한서』 하진열전", "『삼국지』 위서 동탁전", "Rafe de Crespigny, Fire over Luoyang: A History of the Later Han Dynasty 23–220 AD (Brill, 2017)"]

- id: cao-cao-196
  year: 196
  endYear: 207
  title:
    ko: "조조의 화북 평정: 헌제 영접(196)과 관도 전투(200)"
  summary:
    ko: "조조는 환관의 양손자 집안 출신으로, 황건적을 진압하고 반동탁 연합에 참여했으며 192년 연주를 장악해 청주 황건군 수십만을 항복시켜 정예를 가려 ‘청주병’을 만들었다. 195년 이각·곽사의 다툼으로 헌제가 장안을 탈출해 뤄양으로 돌아오자 조조는 196년 헌제를 맞이해 도읍을 허(지금의 허난성 쉬창 부근)로 옮기고 황제의 이름으로 명령을 내리며(협천자) 군웅 위에 서기 시작했다. 같은 해 유랑민을 모아 농사짓게 하는 둔전제를 시작해 군량을 마련했다. 198년 여포를 무너뜨린 조조는 하북의 원소와 맞섰다. 200년 관도에서 조조군(1만여~수만으로 추산)은 훨씬 큰 원소군(사서는 10만 이상이라 하나 추산)과 몇 달 동안 대치했다. 10월 원소 진영에서 투항한 허유가 알려 준 군량 기지 오소를 습격해 불사르자 원소군은 무너졌다. 원소는 202년 병으로 죽었고 조조는 204년 업을 점령했다. 원소의 아들 원상·원희가 오환으로 달아나자 조조는 207년 오환을 쳐서 하북을 평정했다(「조조의 오환 정벌과 선비, 요동의 공손씨」(뒤의 사건)). 조조는 능력만 보고 사람을 쓰겠다는 방침(뒤에 구현령으로 이어졌다)을 내세워 집안 배경과 상관없이 인재를 모았다. 병력의 바탕은 청주병과 둔전, 지방 호족과의 연합이었다. 원소는 4주의 땅과 많은 병력을 가졌으나 참모들이 서로 다투어 정책이 갈렸고, 조조는 순욱·곽가 같은 참모의 의견을 받아들였다. 조조는 『손자』에 주를 달고 시를 짓는 등 문무를 겸한 인물이기도 했다. 조조는 업을 근거지로 삼아 하북의 호족과 지식인을 받아들였고, 208년에는 남쪽 형주를 넘보았다(「형주 쟁탈과 적벽 대전(208)」(뒤의 사건)). 이로써 조조는 화북의 대부분을 차지했다. 208년 그는 삼공 제도를 폐지하고 스스로 승상이 되었다."
  subjects: [eastern-han, wuhuan]
  tags: [war, politics]
  sources: ["『삼국지』 위서 무제기", "『삼국지』 위서 원소전", "『후한서』 헌제기", "Rafe de Crespigny, Imperial Warlord: A Biography of Cao Cao 155–220 AD (Brill, 2010)"]

- id: chibi-208
  year: 208
  endYear: 209
  title:
    ko: "형주 쟁탈과 적벽 대전(208)"
  summary:
    ko: "208년 화북을 거의 평정한 조조는 형주의 유표를 치려 남쪽으로 내려갔다. 그해 8월 유표가 죽고 아들 유종이 9월에 항복하자 조조는 형주를 얻었다. 유표에 의지하던 유비는 강릉을 향해 달아나다 장판에서 조조의 정예 기병에게 쫓겨 크게 패했다. 유비의 사자 제갈량이 강동의 손권을 설득했고 손권은 주유·정보에게 수군 3만을 주어 유비와 손잡고 맞서게 했다. 조조는 창장강을 따라 내려오며 수군을 거느렸으나 북방 병사가 배와 전염병에 약했다. 그해 겨울(음력 11~12월 무렵) 창장강의 적벽에서 손권의 장수 황개가 거짓 항복을 청하며 불붙인 배를 보내 조조의 배들을 불태우자(화공) 조조는 북쪽으로 물러났다. 조조의 군대는 사서가 80만이라 일컬으나 실제로는 15~24만 안팎, 손권·유비 연합군은 3~5만 안팎으로 추산한다. 이후 조인이 남군을 지키다가 209년 주유에게 밀려 물러났고, 유비는 형주 남부 네 군을 차지했다. 적벽의 위치는 지금의 후베이성 츠비시 창장강 가로 전하지만 학설이 갈린다. 손권 진영에서는 항복하자는 장소 등의 주장과 싸우자는 주유·노숙의 주장이 맞섰다. 황개는 조조의 배들이 뱃머리와 꼬리를 이어 놓은 것을 보고 불로 공격하자고 건의했다고 『삼국지』 주유전은 전한다. 이 패배가 조조의 세력 전체를 무너뜨린 것은 아니고 첫 창장강 원정이 실패한 것이라는 견해도 있다. 『삼국지연의』에 나오는 제갈량이 동남풍을 빌렸다는 이야기와 달리 사서에는 황개의 거짓 항복과 화공이 간단히 적혀 있다. 이 싸움으로 조조의 천하 통일은 가로막혔고 조조·유비·손권이 천하를 나누는 형세(삼국)의 바탕이 마련되었다. 조조는 220년 정월 뤄양에서 죽었고, 아들 조비가 같은 해 음력 10월 헌제에게서 선양을 받아 위를 세우면서 후한은 막을 내렸다(삼국 시대 사건은 다음 묶음에서 다룬다)."
  subjects: [eastern-han]
  tags: [war]
  sources: ["『삼국지』 오서 주유전", "『삼국지』 위서 무제기", "『삼국지』 촉서 제갈량전", "Rafe de Crespigny, Imperial Warlord: A Biography of Cao Cao 155–220 AD (Brill, 2010)"]
