# 오세아니아 사건: 식민지와 와이탕이 조약, 골드러시와 병합 (1788 ~ 1899년)
# 범위: (1788년~1850년) 1788년 제1함대의 시드니 코브 상륙부터 1850년 오스트레일리아 식민지 정부법까지(오스트레일리아 식민지 넷의 성립과 경계, 원주민과의 충돌, 와이탕이 조약과 뉴질랜드 식민지, 마오리 사회의 전쟁, 타히티 왕국과 프랑스 보호령, 하와이 왕국의 통일 이후·카푸 폐지·마헤레, 통가 왕국의 성립). (1851년~1899년) 1851년 빅토리아 식민지 분리와 골드러시부터 1899년 사모아 삼국 협정까지(오스트레일리아 식민지의 분리·경계·책임 정부·연방 헌법 회의, 뉴질랜드 헌법과 전쟁·여성 참정권, 프랑스의 누벨칼레도니·타히티 병합, 블랙버딩, 피지의 영국 할양, 뉴기니·마셜 제도·솔로몬 제도·쿡 제도의 분할과 보호령, 하와이 왕국의 호혜 조약·총검 헌법·전복·병합, 사모아 위기와 삼국 협정).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 해: (1788년~1850년) 항목 해와 사건 해가 다른 곳은 글에서 '무렵'과 다른 문서의 해를 함께 밝혔다(타히티 왕국 1791년 무렵 — 위키백과 정보 상자는 1788년 또는 1791년, 머스킷 전쟁 끝 해 1837년~1845년, 카메하메하 1세의 카우아이 침공 1796년과 1803년·1804년). 반디먼즈랜드 1825년 12월 3일·사우스오스트레일리아 1836년(특허장 2월 19일, 선포 12월 28일)·웨스턴오스트레일리아 1829년·뉴질랜드 식민지 1840년(조약 2월 6일, 주권 선포 5월 21일, 별도 식민지 1841년 5월 3일)·통가 왕국 1845년. (1851년~1899년) 항목 해와 사건 해가 다른 곳은 글에서 '무렵'과 다른 문서의 해를 함께 밝혔다(하와이 공화국 1893년 임시 정부와 1894년 7월 4일 공화국 선포, 피지 왕국 1871년 6월 카코바우 정부, 타히티 왕국의 끝 1880년 양도 문서와 12월 30일 법, 영국령 솔로몬 제도 1893년 보호령 선포, 사모아 왕국 1889년 협정과 1900년 독일령). 조약·법은 서명·비준·시행·선포를 나눠 적었다(피지 할양 증서 1874-10-10, 베를린 협정 1889-06-14, 삼국 협정 1899-12-02 서명, 하와이 병합 1898-07-07 의회 공동 결의와 08-12 이양, 연방 헌법법 1900-07-09 왕실 재가).
# 날짜: (1788년~1850년) 1582년 이후이므로 모두 그레고리력. 날짜변경선 양쪽의 같은 날을 겹쳐 쓰지 않았고 날짜는 현지 날짜. (1851년~1899년) 1582년 이후이므로 모두 그레고리력. 피지·사모아·하와이처럼 날짜변경선 가까운 곳의 날짜는 현지 날짜로 적었다.
# 이름 규칙: (1788년~1850년) 항목 이름(뉴사우스웨일스 식민지·반디먼즈랜드·웨스턴오스트레일리아 식민지·사우스오스트레일리아 식민지·뉴질랜드 식민지·타히티 왕국·타히티 족장 사회·하와이 왕국·통가 왕국·통가 제국·오스트레일리아 원주민·마오리족)을 글자 그대로 썼다. 사건 글은 '웨스턴오스트레일리아 식민지'라는 항목 이름으로 썼다. (1851년~1899년) 항목 이름(빅토리아 식민지·뉴사우스웨일스 식민지·퀸즐랜드 식민지·사우스오스트레일리아 식민지·반디먼즈랜드·뉴질랜드 식민지·마오리족·누벨칼레도니·멜라네시아인·피지 왕국·피지 식민지·타히티 왕국·프랑스령 폴리네시아·영국령 뉴기니·독일령 뉴기니·파푸아인·영국령 솔로몬 제도·사모아 왕국·독일령 사모아·하와이 왕국·하와이 공화국)을 글자 그대로 썼다.
# 지도 결정과의 관계: (1788년~1850년) 원주민 사회는 땅 없는 항목이라 links 없이 subjects만 썼고, 식민지 사이 경계가 바뀐 해(1825·1836)는 갈라져 나간 뉴사우스웨일스 식민지를 subjects에 함께 두었다. 통가 제국은 학자들이 투이 통가의 영향권을 부르는 말임을 글에 밝혔다. (1851년~1899년) 원주민 사회는 땅 없는 항목이라 links 없이 subjects만 썼다. 하와이 왕국의 전복·병합은 분쟁·민감한 일이라 실효 지배와 사실만 적었다. 오스트레일리아 연방은 영국 제국 안의 자치령으로 성립하기 전 단계(헌법 회의)까지만 썼다.
# 한국사와 닿는 점: 하와이 병합 사건에서 「하와이 이민의 시작」을 한 구절로 가리킨다.
# 가리킨 기존 사건: (1788년~1850년) 「영국의 보타니만 식민 결정과 제1함대 출항(1786~1787)」, 「제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)」, 「카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)」, 「마오리족의 아오테아로아 정착과 모아 사냥(1250~1500)」, 「아호에이투와 통가 제국의 시작(950~1300)」, 「와이탕이 조약과 뉴질랜드 식민지(1840~1841)」, 「프랑스의 타히티 보호령과 포마레 4세(1842~1847)」, 「빅토리아 식민지 분리와 골드러시(1851~1853)」. (1851년~1899년) 「오스트레일리아 식민지 정부법(1850)」, 「프랑스의 타히티 보호령과 포마레 4세(1842~1847)」, 「와이탕이 조약과 뉴질랜드 식민지(1840~1841)」, 「오스트레일리아 연방과 이민 제한법(1901)」, 「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」, 「알래스카·하와이의 주 편입(1959)」.

- id: first-fleet-1788
  year: 1788
  endYear: 1792
  title:
    ko: "제1함대와 뉴사우스웨일스 식민지(1788~1792)"
  summary:
    ko: "제1함대 열한 척은 8개월 가까운 항해에서 48명을 잃었고(길런 집계로 3퍼센트 남짓), 출항 사정은 「영국의 보타니만 식민 결정과 제1함대 출항(1786~1787)」(앞의 사건)이 다룬다. 배들은 1788년 1월 18일부터 20일 사이 보타니만에 닿았으나 물과 땅이 마땅치 않아 아서 필립 총독은 북쪽 포트잭슨으로 옮겨 1월 26일 시드니 코브에 상륙했다. 그 사이 1월 24일 프랑스의 라페루즈 함대(아스트롤라브호와 부솔호)가 보타니만 앞바다에 나타나 3월 10일까지 머물렀다. 1788년 2월 7일 식민지가 공식으로 선포되어 뉴사우스웨일스 식민지가 시작되었다. 첫 몇 해는 굶주림의 시간이었다. 농사가 잘 되지 않아 배급이 줄었고, 1790년 6월 3일 제2함대의 첫 배 레이디 줄리아나호가 닿으면서 숨통이 트였다. 필립은 1789년 말 에오라 사람 베넬롱을 붙잡아 영어와 이 땅의 말을 서로 익히게 했고, 베넬롱은 식민지와 원주민 사이의 중재자 노릇을 하다가 1792년 말 필립과 함께 영국으로 갔다. 필립이 병으로 돌아간 1792년 12월 뒤에는 군 장교 프랜시스 그로스와 윌리엄 패터슨이 총독 일을 대행했고 1795년 존 헌터가 이었다. 이 땅에는 오스트레일리아 원주민이 아주 오래전부터 살았다. 1월 26일은 오늘날 오스트레일리아의 날이지만 많은 원주민에게는 침략의 날 또는 생존의 날로 기억되어 날짜를 옮기자는 논쟁이 이어진다. 시드니 코브에 오른 사람은 모두 1,373명으로 죄수는 남자 543명, 여자 189명, 아이 11명이었고 항해 중 태어난 아이도 11명이었다(선원까지 치면 약 1,483명이라는 집계도 있다)."
  subjects: [new-south-wales, aboriginal-australians]
  tags: [politics, society]
  sources: ["위키백과 영어판 First Fleet", "위키백과 영어판 Arthur Phillip", "위키백과 영어판 Colony of New South Wales", "위키백과 한국어판 제1함대 (오스트레일리아)"]

- id: frontier-1789
  year: 1789
  endYear: 1802
  title:
    ko: "시드니 일대의 천연두와 펨루이의 저항(1789~1802)"
  summary:
    ko: "제1함대가 닿은 이듬해(「제1함대와 뉴사우스웨일스 식민지(1788~1792)」(앞의 사건)) 1789년 4월 시드니 항 주변 오스트레일리아 원주민 사이에 천연두가 번져 많은 사람이 숨졌다. 사망 규모는 정확히 알 수 없고 시드니 일대 집단의 상당수, 절반 안팎까지 죽었다는 서술이 있으나 확정된 숫자는 없다. 병이 어디서 왔는지도 갈린다. 제1함대 쪽에서 옮았다는 설과 북쪽 해안과 닿은 바깥 사람들에게서 왔다는 설이 맞선다. 이 병으로 시드니 일대 원주민 사회가 약해진 것이 뒤의 충돌에서 뉴사우스웨일스 식민지 정착민의 힘을 키웠다는 지적도 있다. 1790년 12월 9일 보타니만 쪽으로 사냥을 나간 식민지 사냥 감독관 존 매킨타이어가 비자이갈 사람 펨루이의 일행이 던진 창에 중상을 입었고, 필립 총독은 12월 14일부터 17일까지 팀을 보내 비자이갈을 찾게 했으나 사흘 동안 찾지 못했다. 펨루이는 1750년 무렵 보타니만 근처에서 태어난 것으로 전해지며, 1792년부터 파라마타·조지스강·프로스펙트·호크스베리강 일대 농장을 되풀이해 습격했다. 1795년 12월 보타니만 작업반을 습격했을 때 죄수 존 시저가 그의 두개골을 쳐 다쳤으나 살아남았다. 1797년 3월 파라마타 전투에서 총에 일곱 번 맞아 크게 다쳤으나 살아남았고, 이 달 습격에서 정착민 둘이 죽었다. 1801년 11월 22일 총독 필립 기들리 킹이 그를 산 채든 죽은 채든 붙잡으라고 명령했다. 펨루이는 1802년 6월 2일 무렵 총에 맞아 죽었는데, 누가 쏘았는지는 레이디 넬슨호의 일등항해사 헨리 해킹이라는 서술이 있으나 분명하지 않다. 이 12년의 유격전은 뒤에 대륙 곳곳으로 번진 프런티어 전쟁의 시작으로 흔히 꼽히며, 이어지는 충돌은 뒤의 프런티어 사건들에서 이어진다."
  subjects: [aboriginal-australians, new-south-wales]
  tags: [war, society]
  sources: ["위키백과 영어판 Pemulwuy", "위키백과 영어판 First Fleet", "위키백과 영어판 Colony of New South Wales"]

- id: pomare-tahiti-1791
  year: 1791
  endYear: 1815
  title:
    ko: "포마레 왕조의 타히티 왕국(1791~1815)"
  summary:
    ko: "타히티 족장 사회에서는 섬이 여러 부족 영역으로 나뉘어 있었고 1767년 영국 배가 처음 닿은 뒤(제임스 쿡의 항해는 「제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)」(앞의 사건)) 서양 배가 잇달아 들렀다. 1788년 10월 바운티호가 빵나무 묘목을 구하러 닿았고 1789년 4월 항해 중 반란이 일어난 뒤 일부 반란자가 타히티로 돌아와 머물렀다. 족장 투, 곧 뒷날 포마레 1세는 서양 무기와 이런 외국인의 도움으로 경쟁 족장들을 눌렀다. 위키백과 영어판 포마레 왕조 문서는 그가 섬들을 하나로 묶은 해를 1788년으로, 통치를 1791년부터로 적고 정보 상자도 1788년 또는 1791년을 든다. 그래서 타히티 왕국의 시작은 1791년 무렵으로 둔다. 위키 목록은 포마레 1세를 1791~1803년, 2세를 1803~1815년으로 적지만 위키백과 영어판 포마레 2세 문서는 1791년 아들이 즉위하고 아버지가 1803년까지 섭정했다고 적어 문서마다 다르다. 1797년에는 런던 선교회의 선교사들이 닿았고, 포마레 2세는 1815년 11월 테 페이피 전투에서 반대 세력을 꺾어 주도권을 굳힌 뒤 기독교를 받아들여 1819년 세례를 받았다. 이 통일로 부족마다 따로 움직이던 타히티 족장 사회의 틀은 끝났고, 포마레 집안의 왕국이 이어졌다. 포마레 2세가 1821년 죽은 뒤 어린 포마레 3세(1821~1827)가 이었고 1827년부터는 여왕 포마레 4세가 다스렸으며 그 시대는 「프랑스의 타히티 보호령과 포마레 4세(1842~1847)」(뒤의 사건)가 이어서 다룬다. 위키백과에 따르면 포마레 집안의 영향력은 소시에테 제도 대부분과 오스트랄 제도 일부, 투아모투 제도까지 뻗었다."
  subjects: [kingdom-of-tahiti, tahitian-chiefdoms]
  links: []
  tags: [politics, religion]
  sources: ["위키백과 영어판 Pōmare dynasty", "위키백과 영어판 Kingdom of Tahiti", "위키백과 영어판 Pōmare II", "위키백과 영어판 Mutiny on the Bounty"]

- id: van-diemens-land-1803
  year: 1803
  endYear: 1831
  title:
    ko: "반디먼즈랜드 정착과 블랙 워(1803~1831)"
  summary:
    ko: "1803년 9월 뉴사우스웨일스 식민지에서 보낸 부대가 더웬트강 동쪽 리스던 코브에 작은 기지를 세웠고 1804년 호바트가 세워지면서 오늘날 태즈메이니아섬의 영국인 정착이 시작되었다. 1804년 5월 3일 리스던 코브에서 원주민과 병사가 맞닥뜨려 총격으로 원주민이 죽는 일이 있었다(사망자 수는 문서마다 다르다). 처음에는 뉴사우스웨일스 식민지 안의 정착지였으나 1825년 12월 3일 따로 떨어져 나가 반디먼즈랜드라는 이름의 식민지가 되었고, 같은 해 뉴사우스웨일스 식민지의 서쪽 경계가 동경 135도에서 129도로 옮겨졌다. 1820년대 양 목장이 넓어지며 오스트레일리아 원주민과의 충돌이 커졌고 1820년대 중반부터 1831년 무렵까지의 싸움을 블랙 워라 부른다. 1828년 11월 1일 계엄령이 내려졌고 1830년 10월 7일부터 11월 26일까지 병사와 죄수, 자원자들이 줄지어 섬 남동부 원주민을 몰아 가두려 한 블랙 라인은 실패로 끝났다. 정착민 쪽 사망은 기록상 약 200명(219명이라는 집계가 있다)이다. 원주민 사망은 학자마다 추산이 달라 400~1,000명, 기록으로 이은 878명 등으로 갈리며, 1803년 원주민 수는 3,000~7,000명으로 갈리고 존슨과 맥팔레인은 4,500~5,000명을 합의값으로 든다. 조지 오거스터스 로빈슨은 1830년 1월부터 9월까지 '우호 사절'로 사람들을 설득했고 1832~1835년 사이 남은 사람들을 플린더스섬으로 옮겨 1833년 2월 와이발레나라 이름 붙은 정착지에 살게 했다. 이곳 사람은 1833년 약 220명이었다가 1847년 46명으로 줄었다. 계엄령은 1832년 1월에 풀렸다."
  subjects: [van-diemens-land, new-south-wales, aboriginal-australians]
  tags: [war, society, politics]
  sources: ["위키백과 영어판 Black War", "위키백과 영어판 Van Diemen's Land", "위키백과 영어판 Territorial evolution of Australia"]

- id: musket-wars-1807
  year: 1807
  endYear: 1837
  title:
    ko: "머스킷 전쟁(1807~1837)"
  summary:
    ko: "마오리족이 아오테아로아에 자리 잡은 일은 「마오리족의 아오테아로아 정착과 모아 사냥(1250~1500)」(앞의 사건)이 다룬다. 머스킷 전쟁은 마오리 이위(부족)들 사이에서 총이 쓰이면서 일어난 싸움으로, 1807년 모레모누이 전투 무렵부터 1830년대에 가장 거셌고, 끝나는 해는 1837년에서 1845년까지 달리 잡는다(위키백과 영어판은 1806~1845년으로 적는다). 처음에는 총이 곧바로 이기는 무기가 아니었다. 1807년(홍이 히카 문서는 1808년) 모레모누이에서 총을 든 응아푸히 병사들은 총알을 다시 채우는 사이 곤봉과 칼날을 쓴 상대에게 졌다. 그러나 응아푸히의 지도자 홍이 히카는 1818년 무렵부터 총으로 약탈 원정을 벌였고, 1820년 선교사 토머스 켄들과 영국에 갔다가 1821년 돌아오는 길 시드니에서 받은 선물로 총 300~500자루(홍이 히카 문서는 수백 자루)를 마련했다고 한다. 1769년 이후 들어온 감자는 고구마보다 가꾸고 저장하기 쉬워 남자들이 오래 원정을 떠나게 했고, 어떤 역사가는 그래서 '감자 전쟁'이라는 이름이 더 맞다고 했다. 붙잡힌 사람들은 아마를 가꾸고 다듬는 일에 부려졌고 아마는 다시 총과 바뀌었다. 테 라우파라하는 1821년 와이카토 쪽에 밀려 카위아에서 쫓겨난 뒤 카피티 해안으로 옮겨 1830년까지 남섬 일부까지 세력을 넓혔다. 1835년 채텀 제도에서 모리오리 약 300명이 죽고 1,700명이 노예가 되었다(위키백과 영어판 정보 상자 값, 본문은 모리오리의 약 10퍼센트가 죽었다고 적는다). 전쟁의 사망자는 2만~4만 명으로 서술되나 누구의 집계인지는 정해져 있지 않다. 이 싸움이 부족 경계를 다시 그어 놓아 1840년 와이탕이 조약 뒤 땅 거래를 복잡하게 만들었다. 1825년에는 응아푸히가 카이파라에서 큰 승리를 거두고 와이카토 쪽까지 쫓아 들어갔고, 1845년 테 이후푸쿠 요새에서 대치한 끝에 마지막 총이 하늘로 쏘아졌다. 일부 역사가는 1843년 와이라우 충돌과 「뉴질랜드 북부 전쟁: 깃대 전쟁(1845~1846)」(뒤의 사건)을 이 전쟁의 연장으로 본다."
  subjects: [maori]
  tags: [war, society]
  sources: ["위키백과 영어판 Musket Wars", "위키백과 영어판 Hongi Hika", "위키백과 영어판 Te Rauparaha"]

- id: kamehameha-unification-1810
  year: 1810
  endYear: 1819
  title:
    ko: "카메하메하 1세의 하와이 통일과 카우무알리이(1810~1819)"
  summary:
    ko: "카메하메하 1세가 하와이섬을 장악해 하와이 왕국의 틀을 세운 일은 「카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)」(앞의 사건)가 다룬다. 그에게 남은 큰 섬은 카우아이섬과 니하우섬이었고, 이곳의 족장 카우무알리이는 1794년 어머니 카마카헬레이가 죽자 열여섯 살 안팎으로 자리를 이었다. 카메하메하는 1796년 카우아이 원정이 실패한 뒤 1803~1804년 두 번째 원정을 준비했으나 전염병이 군대를 덮쳐 접었다(위키백과 영어판 카우무알리이 문서는 1803년으로 적는다). 결국 1810년 4월 호놀룰루에서 카우무알리이가 카메하메하를 최고 통치자로 받아들이고 카우아이와 니하우를 조공을 바치는 땅으로 두되 계속 다스렸다. 이로써 하와이 제도 전체가 한 왕 아래 묶였다. 1810년대에는 중국에 파는 백단향 무역이 왕실의 큰 수입이 되었고 외국 상인과 배가 호놀룰루와 하와이 곳곳에 드나들었다. 1816~1817년 카우무알리이는 러시아 아메리카 회사 사람들이 카우아이에 요새를 짓도록 허락했다가 1817년 그들을 내쫓았다. 1819년 5월 카메하메하 1세가 죽은 뒤(「카푸 폐지와 선교사의 도착(1819~1825)」(뒤의 사건)) 1821년 카우무알리이는 배에 유인되어 호놀룰루로 옮겨진 뒤 사실상 연금되어 카아후마누와 혼인해야 했다. 그는 1824년 죽었고, 그의 아들 훔에훔에가 카우아이의 독립을 되찾으려 했으나 붙잡혀 호놀룰루에서 죽었다. 이렇게 하와이 왕국은 한 왕가가 모든 섬을 아우르는 나라로 굳어졌다. 위키백과 영어판은 카우무알리이를 1778년 무렵 태어나 1794년부터 1810년까지 카우아이와 니하우를 다스린 마지막 독립 통치자로 소개한다."
  subjects: [hawaiian-kingdom]
  tags: [politics]
  sources: ["위키백과 영어판 Kaumualiʻi", "위키백과 영어판 Kamehameha I", "위키백과 영어판 Kingdom of Hawaii"]

- id: kapu-1819
  year: 1819
  endYear: 1825
  title:
    ko: "카푸 폐지와 선교사의 도착(1819~1825)"
  summary:
    ko: "1819년 5월 카메하메하 1세가 죽고 아들 리홀리호가 카메하메하 2세로 올랐으나 나이가 어려 미망인 카아후마누가 쿠히나 누이, 곧 공동 통치자로 정치를 쥐었다. 즉위 반년 뒤인 1819년 11월 리홀리호는 어머니 케오푸올라니와 카아후마누와 함께 남녀가 같은 자리에서 먹는 잔치를 열어 카푸 규범을 깨뜨렸다(아이 노아). 왕이 스스로 신앙의 금기를 어긴 이 일로 사제 계급이 힘을 잃고 신전과 신상이 부서졌으며, 카푸를 지키려던 사촌 케카우오칼라니 편은 쿠아모오 전투에서 졌다. 몇 달 뒤인 1820년 봄 미국 보스턴을 떠난 개신교 선교단(하이럼 빙엄 등)이 닿아 빈 자리에 기독교가 들어왔고, 선교사들은 하와이어를 글자로 적고 학교를 세웠다. 이 무렵 하와이 왕국의 라하이나와 호놀룰루는 태평양 포경선이 쉬어 가는 항구가 되어 선원과 선교사 사이의 충돌도 잦았다. 1823~1824년 리홀리호는 왕비 카마말루와 영국을 찾았으나 면역이 없던 두 사람이 홍역에 걸려 카마말루가 1824년 7월 8일, 리홀리호가 엿새 뒤 런던에서 죽었다. 동생 카우이케아올리가 카메하메하 3세로 이었고(1825년) 어린 왕을 대신해 카아후마누가 쿠히나 누이로서 정치를 이끌었다. 이 시기 선교사의 영향이 커지면서 법에 교회의 도덕이 들어왔고, 하와이 왕국은 옛 신앙의 틀 대신 새 종교와 외국과의 교역이라는 두 힘 사이에서 나아가게 되었다. 리홀리호는 1820년 왕실 요트 클레오파트라의 바지선을 사들였고, 그의 군대는 칼라니모쿠가 이끌었으며, 그는 끝내 정식으로 개종하지는 않았다. 선교단은 먼저 하와이섬 서쪽 해안 카일루아에 닿아 왕의 허락을 받고 머물렀다. 카아후마누는 카메하메하 1세의 가장 높은 부인이었다."
  subjects: [hawaiian-kingdom]
  tags: [religion, society]
  sources: ["위키백과 영어판 Liholiho", "위키백과 영어판 Kaʻahumanu", "위키백과 영어판 ʻAi Noa", "위키백과 영어판 Hiram Bingham I"]

- id: swan-river-1829
  year: 1829
  endYear: 1834
  title:
    ko: "스완강 식민지와 웨스턴오스트레일리아(1829~1834)"
  summary:
    ko: "1826년 말 뉴사우스웨일스 식민지가 서쪽 킹조지사운드(올버니)에 군 기지를 세웠고, 1827년 제임스 스털링이 HMS 석세스호로 스완강 일대를 살핀 뒤 영국에 돌아가 자유 이민 식민지를 세우자고 설득했다. 1829년 5월 2일 찰스 프리맨틀 함장이 스완강 일대를 영국 땅으로 선언했고, 스털링 일행을 실은 파멜라호가 닿았으며(위키백과 영어판은 5월 31일 또는 6월 2일로 달리 적는다) 6월 17일 라우스 헤드에서 야영을 시작했다. 이 정착은 죄수를 받는 곳이 아니라 자유 이민자가 땅을 받는 식민지로 기획되어 스완강 식민지라 불렸고 퍼스와 프리맨틀이 세워졌다. 땅은 자본을 가져온 사람에게 크게 나뉘었다. 토머스 페일은 정착민 400명을 데려온다는 조건으로 20만 헥타르를 약속받고 300명만 데려왔는데도 10만 헥타르를 받았다. 그런데 땅을 갈 일손이 모자라 농사는 어려웠고, 에드워드 기번 웨이크필드는 이 땅 나눔이 임금 노동자 계층을 만들지 못한다고 비판했다. 스털링은 1829년부터 부총독으로 다스렸고, 1832년 2월 6일 식민지 이름이 웨스턴오스트레일리아 식민지로 바뀌었으며 총독 임명은 1831년 3월 4일과 1832년 2월 6일로 달리 적힌다. 이주민은 1832년 약 1,500명이었고 남서부 오스트레일리아 원주민 누가르 사람은 약 1만 5천 명으로 추산된다. 땅을 둘러싼 충돌은 1834년 10월 28일 핀자라에서 스털링이 이끈 병사와 경찰이 원주민 야영지를 덮치는 일로 이어졌고, 사망자 수는 문서마다 달라 분명하지 않다. 이 식민지가 죄수를 받는 일은 1850년에 이르러서야 시작되며 그 이야기는 「죄수 이송의 끝(1840~1853)」(뒤의 사건)에 이어진다. 1829년 12월의 훈령은 땅을 왕실과 교회와 교육 몫으로 따로 두고 물가 땅은 배급하듯 나누게 했다. 1831년에는 프레더릭 타운이 뉴사우스웨일스에서 이관되어 올버니로 이름이 바뀌었고, 이주민은 1850년 5,886명으로 늘었다."
  subjects: [western-australia, aboriginal-australians]
  tags: [politics, society]
  sources: ["위키백과 영어판 Swan River Colony", "위키백과 영어판 James Stirling (Royal Navy officer)", "위키백과 영어판 Pinjarra massacre"]

- id: port-phillip-1835
  year: 1835
  endYear: 1839
  title:
    ko: "배트먼 조약과 포트필립 지구(1835~1839)"
  summary:
    ko: "1835년 6월 6일 반디먼즈랜드의 목양업자 존 배트먼은 포트필립 협회를 대표해 우룬제리와 분워룽 원로들과 증서를 맺었다고 한다. 배트먼은 담요와 손도끼와 밀가루 같은 물건을 주고 약 60만 에이커를 얻는다고 적었다. 이는 유럽인이 원주민과 직접 협상해 땅을 차지하려 한 유일하게 기록된 일로 꼽히지만, 증서의 서명이 원로들의 것인지, 원로들이 땅을 넘긴 것이 아니라 잠시 땅을 쓰게 하는 탄데룸 의식으로 이해했는지는 논란이다. 1835년 8월 26일 뉴사우스웨일스 식민지 총독 리처드 버크는 왕실이 아닌 사람이 원주민에게서 얻은 땅은 무효라고 선포했고 영국 식민성이 10월 10일 승인했다. 영국 법은 이 땅을 왕실의 땅으로 보았기 때문이다(주인 없는 땅이라는 테라 눌리우스 개념의 해석은 「영국의 보타니만 식민 결정과 제1함대 출항(1786~1787)」(앞의 사건)이 다룬다). 그래도 배트먼이 마을 터를 적은 기록은 멜버른 건설의 출발로 흔히 인용되고, 1836년 존 헬더 웨지가 첫 멜버른 지도를 그렸다. 포트필립 지구는 뉴사우스웨일스 식민지의 한 지구로서 양 목장이 빠르게 번졌고 오스트레일리아 원주민은 땅을 잃었다. 1838년 원주민 보호관 제도가 만들어져 조지 오거스터스 로빈슨이 1839년 초 이 지구에 보호관으로 닿았으나 보호는 이름에 그쳤다. 1844~1849년에는 죄수 약 1,750명이 이 지구로 보내졌다. 이 지구가 뉴사우스웨일스에서 갈라져 나오는 일은 「빅토리아 식민지 분리와 골드러시(1851~1853)」(뒤의 사건)가 다룬다. 만남 장소는 오늘날 노스코트의 메리 크릭 가까이로 짐작되나 분명하지 않다. 배트먼은 1839년 죽을 때까지 증서가 유효하다고 주장했고, 훗날 원로 윌리엄 바락이 어린 시절 서명 의식을 보았다고 했다는 서술이 있으나 출처가 분명하지 않다."
  subjects: [new-south-wales, aboriginal-australians]
  tags: [politics, society]
  sources: ["위키백과 영어판 Batman's Treaty", "위키백과 영어판 John Batman", "위키백과 영어판 Port Phillip District", "위키백과 영어판 Terra nullius"]

- id: south-australia-1836
  year: 1836
  endYear: 1842
  title:
    ko: "사우스오스트레일리아 식민지와 자유 정착(1836~1842)"
  summary:
    ko: "에드워드 기번 웨이크필드는 땅을 일부러 비싸게 팔아 그 돈으로 노동자를 이주시키는 '체계적 식민' 구상을 내놓았고, 1834년 8월 15일 영국 의회가 통과시킨 사우스오스트레일리아 법이 왕의 재가를 얻어 이 방식의 식민지를 열었다. 식민지는 동경 132도에서 141도 사이, 남쪽 바다에서 남위 26도까지의 땅이었다. 법은 이 땅을 비어 있다고 적었으나 1836년 2월 19일 윌리엄 4세가 서명한 특허장은 원주민의 권리와 점유를 인정하는 말로 고쳐 쓰였다. 이 땅은 본래 뉴사우스웨일스 식민지 안에 있었으나 1836년 갈라져 나왔다. 초대 총독 존 헌드마시는 1836년 12월 28일 글레넬그에서 식민지를 선포했고 윌리엄 라이트 대령이 이듬해 애들레이드의 터를 정했다. 이 법은 죄수를 보내는 것을 막아 죄수 없는 식민지라는 점이 큰 특징이었다. 그러나 땅을 판 돈으로 모든 일을 치르려는 계획은 어긋나 1840~1841년 식민지는 재정 위기에 빠졌고 영국 정부가 구제에 나섰다. 1842년 새 법이 1834년 법을 폐기하고 사우스오스트레일리아 식민지를 왕령 식민지로 바꾸어 영국 정부가 직접 다스리게 했다. 앞서 1835년 포트필립 지구에서는 원주민과의 증서가 무효가 되었으나(「배트먼 조약과 포트필립 지구(1835~1839)」(앞의 사건)) 이곳 특허장은 원주민의 권리를 인정했다. 그래도 오스트레일리아 원주민 사회는 특허장이 인정한 권리에도 불구하고 목장과 농장이 늘면서 땅을 잃어 갔다. 이렇게 이 식민지는 자유 이민자의 땅으로 자리 잡았으나 계획했던 자치와 재정 독립의 꿈은 첫 몇 해에 꺾였다. 첫 이주선들은 1836년 7월부터 캥거루섬에 닿았다. 라이트는 정사각 격자 길과 둘레 공원 띠를 가진 도시 터를 설계했고 1837년 3월 11일 도시 측량을 끝냈다."
  subjects: [south-australia, new-south-wales, aboriginal-australians]
  tags: [politics, economy]
  sources: ["위키백과 영어판 South Australia Act 1834", "위키백과 영어판 History of South Australia", "위키백과 영어판 Edward Gibbon Wakefield"]

- id: waitangi-1840
  year: 1840
  endYear: 1841
  title:
    ko: "와이탕이 조약과 뉴질랜드 식민지(1840~1841)"
  summary:
    ko: "1835년 북부 족장들이 『독립 선언』(He Whakaputanga)을 내고 마오리의 자치를 내세웠다. 1840년 2월 6일 해군 대령 윌리엄 홉슨은 베이오브아일랜즈의 와이탕이에서 북섬 족장들과 조약에 서명했다. 문안은 2월 4~5일 제임스 버스비 등의 도움으로 짜였고 헨리 윌리엄스가 마오리어로 옮겼다. 영어본은 '주권의 모든 권리와 권력'을 넘긴다고 쓰지만 마오리어본(테 티리티)은 영국 여왕에게 카와나탕아, 곧 통치권을 주고 족장들에게 티노 랑아티라탕아, 곧 온전한 족장권을 인정한다고 적어, 영국은 주권 양도로 보고 많은 족장은 권한을 나누는 약속으로 이해했을 수 있다. 서명자는 마오리어본에 530~540명 안팎이고 영어본에 39명이며, 그 뒤 9월까지 약 50곳의 모임에서 사본을 돌려 500명 가까이가 더 서명했다. 포타타우 테 훼로훼로 같은 일부는 서명을 거부했다. 1840년 5월 21일 홉슨은 북섬은 조약에 의한 양도로, 남섬과 스튜어트섬은 발견으로 영국 주권이 미친다고 선포했다. 뉴질랜드는 1840년 11월 16일 왕실 칙허장으로 뉴사우스웨일스 식민지에서 떨어져 나와 별도의 식민지가 되었고 효력은 1841년 5월 3일에 생겼다. 이렇게 뉴질랜드 식민지가 성립했으나 땅을 사는 권리를 왕실이 독점하는 제도는 뒤에 땅 분쟁의 씨앗이 되었고, 마오리족의 많은 이위는 오늘날에도 조약이 무엇을 약속했는지를 두고 다툰다. 서명된 사본은 아홉 부가 남아 있다. 1877년 한 법원 판결은 조약을 효력 없는 문서로 보았으나 1975년 와이탕이 조약법이 와이탕이 심판소를 세워 조약 위반을 가리게 했다. 2월 6일 와이탕이의 서명판에만 240명이 서명했고 마오리어본 서명자 가운데 여성도 적어도 13명이었다."
  subjects: [colony-of-new-zealand, maori]
  tags: [politics, diplomacy]
  sources: ["위키백과 영어판 Treaty of Waitangi", "위키백과 영어판 Colony of New Zealand", "위키백과 영어판 William Hobson"]

- id: transportation-1840
  year: 1840
  endYear: 1853
  title:
    ko: "죄수 이송의 끝(1840~1853)"
  summary:
    ko: "뉴사우스웨일스 식민지는 1788년 이래 영국 죄수를 받아 왔지만 자유 이민자와 자유 노동 시장이 커지면서 이송에 반대하는 목소리가 높아졌고, 1840년 5월 22일 추밀원령으로 이송이 임시로 멈췄다. 그 뒤에도 1850년까지 약 1,400명이 더 닿았고 이송은 1850년 10월 1일 공식으로 폐지되었다. 반디먼즈랜드는 이송을 계속 받았는데 죄수 노동이 이 식민지의 경제를 떠받쳤기 때문이다. 그러나 반이송 운동이 커져 1850년 반이송 연맹이 만들어졌고 1849년 하시미호 사건 같은 항의가 일어났다. 반디먼즈랜드의 마지막 죄수선 세인트빈센트호는 1853년에 닿았고 이것이 영국에서 온 마지막 배였다. 웨스턴오스트레일리아 식민지는 일손 부족을 메우려 1850년부터 1868년까지 죄수를 받았고 모두 43척, 9,668명이 닿았으며 마지막 배 휴고몬트호는 1868년 1월 10일 닿았다. 1788~1868년 오스트레일리아로 보내진 죄수는 약 162,000~164,000명이고(위키백과 영어판은 162,000명을 1784~1868년 값으로, 164,000명과 806척을 이송 종료 절에 적는다) 806척 배에 실려 왔다. 그 가운데 여성은 1788년부터 1852년까지 약 24,000명, 일곱에 하나 꼴이었다. 죄수 노동은 도로와 건물을 짓는 일에 쓰였고 형기를 마치거나 풀려난 사람들은 자유 이민자와 함께 식민지 사회의 큰 부분이 되었다. 이송이 끝나면서 오스트레일리아 식민지들은 자유 이민 사회로 바뀌어 갔고 그 흐름은 다음 시기 골드러시와 책임 정부로 이어졌다. 반디먼즈랜드는 1853년 8월 10일 이송 종료를 기리는 축제(주빌리)를 열었다."
  subjects: [new-south-wales, van-diemens-land]
  tags: [society, politics]
  sources: ["위키백과 영어판 Convicts in Australia", "위키백과 영어판 Penal transportation", "위키백과 영어판 Convict era of Western Australia"]

- id: tahiti-protectorate-1842
  year: 1842
  endYear: 1847
  title:
    ko: "프랑스의 타히티 보호령과 포마레 4세(1842~1847)"
  summary:
    ko: "포마레 4세(1827~1877년 재위)가 1836년 프랑스 가톨릭 선교사 둘을 내쫓은 일은 프랑스가 모욕으로 받아들였다. 1842년 해군 제독 아벨 오베르 뒤프티투아르가 군함을 앞세워 여왕과 족장들에게 프랑스의 보호를 청하게 해 타히티 왕국은 보호령이 되었다. 1843년 11월 뒤프티투아르는 여왕을 폐하고 섬을 합병한다고 선언했으며 여왕은 라이아테아로 피했다. 영국 선교사이자 영국 영사인 조지 프리처드는 1844년 추방되었고, 이 프리처드 사건으로 영국과 프랑스는 한동안 외교 갈등을 겪었다. 1844년 3월 13일 무장 저항이 시작되었고 4월 17일 마하에나 전투에서 프랑스군 441명이 더 많은 타히티 군을 꺾었으며 싸움은 섬 안쪽 산지의 게릴라전으로 바뀌었다. 1846년 5월 푸나우루 전투와 12월 17일 파우타우아 요새 함락으로 저항이 꺾였다. 라이아테아·후아히네·보라보라로 프랑스가 손을 뻗으려 했으나 후아히네 군이 마에바에서 프랑스군을 꺾는 등 맞섰다. 1847년 2월 포마레 4세가 돌아와 프랑스 보호령을 받아들였다. 같은 해 영국과 프랑스는 자르낙 협약으로 이웃 섬들의 독립을 서로 존중하기로 약속했다. 보호령 아래에서도 타히티 왕국은 이름과 여왕의 자리를 지녔고 왕국이 사라지는 것은 1880년대의 일이다. 포마레 왕조는 런던 선교회의 뒷받침을 받는 개신교 왕조였고, 프랑스 본국 정부는 뒤프티투아르의 합병 선언을 받아들이지 않고 보호령 상태로 되돌렸다고 서술된다. 1846년 마에바(후아히네섬) 싸움은 위키백과 영어판이 여왕 테리이타리아 2세의 군대가 프랑스군을 꺾은 것으로 적는다. 후아히네는 영국 선교사와 가까운 여왕 테리이타리아 2세가 다스렸다."
  subjects: [kingdom-of-tahiti]
  tags: [war, diplomacy]
  sources: ["위키백과 영어판 Franco-Tahitian War", "위키백과 영어판 Pōmare IV", "위키백과 영어판 George Pritchard (missionary)"]

- id: paulet-1843
  year: 1843
  endYear: 1843
  title:
    ko: "폴릿 사건과 하와이 독립 승인(1843)"
  summary:
    ko: "1842년 12월 미국 대통령 존 타일러는 하와이 왕국의 독립을 존중한다는 취지의 교서를 의회에 보냈다(타일러 독트린). 이듬해 1843년 2월 영국 군함 캐리스포트호의 함장 조지 폴릿이 호놀룰루에 닿아 영국 영사 리처드 찰튼의 불만을 앞세워 카메하메하 3세에게 요구서를 냈다. 왕은 힘에 밀려 1843년 2월 25일 하와이를 폴릿에게 잠정으로 넘긴다고 밝혔다. 하와이 사절은 런던에서 영국 정부에 호소했고 1843년 4월 1일 영국 외무장관 에이버딘이 하와이의 독립을 인정하겠다고 약속했다. 영국 해군 소장 리처드 다턴 토머스가 호놀룰루에 와서 폴릿의 조치를 풀고 1843년 7월 31일 카메하메하 3세에게 주권을 돌려주었다. 이날 왕이 '땅의 생명은 올바름으로 이어진다'는 뜻의 말을 했다고 전하며, 7월 31일은 라 호이호이 에아, 곧 주권 회복의 날로 기려졌다. 점령은 약 다섯 달 이어졌다(위키백과는 여섯 달이라고도 적는다). 같은 해 11월 28일 영국과 프랑스는 런던에서 하와이 왕국의 독립을 인정하는 공동 선언을 발표했다. 이 선언으로 하와이는 열강이 독립을 서로 보장하는 나라가 되었고, 이후 하와이 왕국은 외교 면에서 한동안 영국과 프랑스, 미국 사이의 균형 위에 섰다. 이 사건은 하와이가 작은 나라이면서도 국제법상 독립국으로 받아들여진 대표적인 사례로 자주 이야기된다. 카메하메하 3세는 힘에 밀려 넘기면서도 항의의 뜻을 문서에 남겼고, 점령 동안 호놀룰루에는 영국 해병이 머물며 영국 깃발이 걸렸다. 주권 회복의 날은 한동안 하와이의 국경일로 지켜졌다. 폴릿은 2월 25일 하와이 정부를 대신할 위원회를 세웠고 6월 30일 하와이 사절 제임스 마셜이 런던에 닿아 미국 대사 에드워드 에버렛을 만났다."
  subjects: [hawaiian-kingdom]
  tags: [diplomacy, politics]
  sources: ["위키백과 영어판 Paulet Affair", "위키백과 영어판 Kamehameha III", "위키백과 영어판 Kingdom of Hawaii"]

- id: flagstaff-war-1845
  year: 1845
  endYear: 1846
  title:
    ko: "뉴질랜드 북부 전쟁: 깃대 전쟁(1845~1846)"
  summary:
    ko: "코로라레카(러셀)는 베이오브아일랜즈의 항구 도시로, 이곳에 영국 깃발을 단 깃대가 섰다(와이탕이 조약은 「와이탕이 조약과 뉴질랜드 식민지(1840~1841)」(앞의 사건)). 응아푸히 족장 호네 헤케는 조약을 두고 품은 불만에, 수도가 오클랜드로 옮겨 가고 관세가 생겨 항구 교역이 줄어 응아푸히의 수입이 준 데 화가 나 깃대를 영국 지배의 상징으로 삼았다. 깃대는 네 번 베어졌다. 1844년 7월 8일 테 하라투아가 처음 베었고, 1845년 1월 10일 헤케가 다시 베었으며, 1월 18일 철을 씌워 세운 새 깃대는 19일 아침 베어졌고, 네 번째는 3월 11일 코로라레카를 공격할 때였다. 1845년 3월 11일 헤케와 테 루키 카위티의 병사들이 코로라레카를 공격해 도시 북쪽 대부분을 불태웠고 영국인들은 만 안의 배로 피했다. 영국군은 6월 23일부터 페네 타우이의 오헤에와이 요새를 포위했고 7월 1일 정면 공격이 큰 사상자를 내며 실패했으며 방어자들은 7월 8일 스스로 요새를 비웠다. 12월 27일부터 영국군은 카위티의 루아페카페카 요새를 포격해 1846년 1월 11일 차지했으나 카위티 쪽은 이미 대부분 빠져나간 뒤였다. 사상자는 자료마다 다르다. 정보 상자는 영국 쪽 사망 137명·부상 199명, 마오리 쪽 사망 69명·부상 55~148명으로 적고 본문은 영국 쪽 사망 82명·부상 164명으로 적는다. 이 싸움은 마오리족과 영국 사이 뉴질랜드 전쟁의 첫 싸움들 가운데 하나로 꼽히며(1843년 와이라우 충돌이 앞선다), 뒤의 뉴질랜드 식민지 땅 분쟁의 앞소리 구실을 했다. 1844년 7월 헤케의 옛 노예 코티로가 모욕한 일이 헤케가 움직이는 구실이 되었다는 서술도 있다. 영국 쪽에 선 마오리 동맹군의 사상자는 알려져 있지 않다."
  subjects: [colony-of-new-zealand, maori]
  tags: [war, politics]
  sources: ["위키백과 영어판 Flagstaff War", "위키백과 영어판 Hōne Heke", "위키백과 영어판 Te Ruki Kawiti"]

- id: tupou-tonga-1845
  year: 1845
  endYear: 1875
  title:
    ko: "조지 투포우 1세의 통가 통일과 1875년 헌법(1845~1875)"
  summary:
    ko: "오래전부터 투이 통가라는 신성한 왕이 통가의 으뜸이었고(「아호에이투와 통가 제국의 시작(950~1300)」(앞의 사건)) 학자들은 투이 통가의 영향권을 통가 제국이라 부른다. 시간이 가면서 실권은 투이 카노쿠폴루 계보로 넘어갔다. 1797년 12월 4일 태어난 타우파아하우는 삼촌 알레아모투아가 죽은 1845년 투이 카노쿠폴루 칭호를 얻고 같은 해 12월 4일부터 조지 투포우 1세로서 왕이 되었다. 그는 섬들을 하나로 묶어 통가 왕국을 열었고, 감리교 선교사들과 손잡았으며 1852년 신성한 칭호와 세속 칭호를 하나로 합치고 통가 자유 교회의 수장이 되었다. 1862년에는 법전이 발표되어 평민이 족장에게 매이던 의무를 줄이는 개혁이 이루어졌다고 흔히 서술한다. 투이 통가 칭호는 1827년 칭호를 얻은 라우피리통가가 1865년 죽은 뒤 투포우가 가져가 사실상 끝났고, 통가 제국의 끝은 이 무렵(1865~1866년)으로 본다. 1875년 헌법이 공포되어 통가는 입헌 군주국이 되었으며 그해 11월 4일 대관식이 열렸다. 이 헌법은 왕과 귀족과 평민의 자리를 정하고 국민의 권리를 적었다. 조지 투포우 1세는 1893년 2월 18일 95세로 죽었다. 이렇게 통가는 유럽 열강의 식민지가 되지 않은 채 근대 국가의 틀을 먼저 갖춘 나라로 이야기되나, 1900년에는 영국의 보호국이 되었다. 투포우 1세는 투포우토아와 호아모팔레오노 사이에서 태어났고, 1859년부터 족장 회의를 소집했으며 이 회의가 법전을 만들었다. 라우피리통가는 1827년 이후 38년 가까이 칭호를 지녔고, 투포우 1세는 말라에쿨라에 묻혔다. 대관식 날짜 11월 4일은 위키백과 정보 상자의 값이다."
  subjects: [kingdom-of-tonga, tui-tonga]
  tags: [politics, religion]
  sources: ["위키백과 영어판 George Tupou I", "위키백과 영어판 Tuʻi Tonga Empire", "위키백과 영어판 Laufilitonga", "위키백과 영어판 Constitution of Tonga"]

- id: mahele-1848
  year: 1848
  endYear: 1850
  title:
    ko: "하와이의 마헤레(토지 분배)(1848~1850)"
  summary:
    ko: "옛 하와이에서는 왕이 땅을 맡아 족장에게 나누고 평민이 땅을 부치며 살았다. 1840년 헌법이 나온 데 이어 1845년 토지 위원회가 세워져 땅 권리를 가렸고, 1848년 3월 7일 카메하메하 3세 아래 대(大)마헤레가 시행되었다. 위키백과 영어판은 땅이 왕, 족장과 관리인, 평민 셋으로 갈렸다고 쓰지만 실제로 평민 몫은 따로 신청해야만 받았다. 1850년 7월 10일 의회가 외국인 토지 소유를 허용하는 법을 통과시켜 미국인 자본의 길을 열었고, 1850년 8월 6일 쿨레아나 법이 평민의 땅 신청을 받았다. 평민이 신청해 받은 땅은 모두 합쳐 2만 8,658에이커 정도였고, 이는 하와이 땅의 1퍼센트에 못 미쳤다. 당시 원주민 수는 약 8만 2천 명이었다. 신청 기한은 2년이었고, 글자와 절차에 익숙하지 않은 평민 가운데 신청하지 못한 사람이 많았다는 지적이 있다. 땅은 대부분 왕과 족장 몫이거나 정부 몫이어서 외국인에게 팔리거나 사탕수수 농장 같은 큰 땅으로 모였고, 이 흐름은 뒤에 하와이 왕국의 경제와 정치를 미국 자본 쪽으로 기울게 했다. 하와이 노동력이 모자라 외국인 노동자가 들어오는 일(훗날 이 사탕수수 농장에서 일한 한국인 이민은 「하와이 이민의 시작」(뒤의 사건)이 다룬다)과도 이어진다. 쿨레아나는 하와이말로 책임과 권리를 뜻하며 평민이 땅에서 지는 몫과 누리는 몫을 함께 가리킨다. 위키백과 영어판은 마헤레 뒤 땅 대부분을 하와이 공화국 정부가 미국 본토에서 온 정착민에게 팔았거나 이른바 큰 다섯 회사에 경매했다고 적는다. 위키백과 영어판은 평민이 신청한 땅을 약 1만 8천 필지로 적는데 3에이커 안팎이면 5만 에이커가 넘어 2만 8,658에이커라는 면적과 맞지 않으므로 값이 분명하지 않다. 카메하메하 3세는 1825년부터 1854년까지 30년 가까이 왕이었다."
  subjects: [hawaiian-kingdom]
  tags: [economy, society]
  sources: ["위키백과 영어판 Great Māhele", "위키백과 영어판 Kuleana Act of 1850 (Hawaii)", "위키백과 영어판 Kamehameha III"]

- id: colonial-government-act-1850
  year: 1850
  endYear: 1850
  title:
    ko: "오스트레일리아 식민지 정부법(1850)"
  summary:
    ko: "1850년 8월 5일 영국 의회가 통과시키고 왕이 재가한 오스트레일리아 식민지 정부법(영어로 Australian Colonies Government Act)은 1851년 7월 1일 시행되었다. 이 법의 가장 눈에 띄는 대목은 뉴사우스웨일스 식민지 남쪽의 포트필립 지구를 떼어 내 새 식민지 빅토리아를 만든 일로, 분리와 골드러시는 「빅토리아 식민지 분리와 골드러시(1851~1853)」(뒤의 사건)가 다룬다. 이 법은 또 식민지마다 입법 의회를 두고, 그 의회가 스스로 헌법을 짤 길을 열었다. 새 식민지 빅토리아에는 선거로 뽑은 20명과 부총독이 임명한 10명으로 이뤄진 입법 의회를 두었고, 반디먼즈랜드와 사우스오스트레일리아 식민지에도 비슷한 제도를 열 길을 마련했다. 뉴사우스웨일스 식민지는 선거권을 고치고 입법 의회가 총독과 함께 양원제 의회를 세울 수 있게 했다. 웨스턴오스트레일리아 식민지는 죄수를 받는 식민지여서 시민의 정치 참여를 제한하는 특별 규정이 붙었다. 책임 정부, 곧 의회 다수당이 정부를 이끄는 제도는 이 법에 아직 들어 있지 않았고 1855~1856년 각 식민지의 헌법법이 이 법을 대체하며 그리로 나아갔다. 영국 의회가 식민지들에 스스로 헌법을 짤 권한을 준 이 법은 식민지마다 따로 서로 다른 정치 제도를 쌓아 가는 출발점이 되었고, 그 정치 경험은 뒤에 연방을 논의할 때 바탕이 되었다. 영국 의회 문서 번호는 13 & 14 Vict. c. 59이고 위키백과 영어판은 이 법이 1986년 오스트레일리아 법 제11조 3항으로 폐지되었다고 적는다. 법이 만들어질 때 식민지는 뉴사우스웨일스·반디먼즈랜드·웨스턴오스트레일리아·사우스오스트레일리아 넷이었다."
  subjects: [new-south-wales, van-diemens-land, south-australia, western-australia]
  tags: [politics]
  sources: ["위키백과 영어판 Australian Colonies Government Act 1850", "위키백과 영어판 Colony of Victoria", "위키백과 영어판 Colony of New South Wales"]

- id: victoria-gold-1851
  year: 1851
  endYear: 1853
  title:
    ko: "빅토리아 식민지 분리와 골드러시(1851~1853)"
  summary:
    ko: "1851년 7월 1일 「오스트레일리아 식민지 정부법(1850)」(앞의 사건)이 시행되면서 뉴사우스웨일스 식민지 남쪽의 포트필립 지구가 떨어져 나와 빅토리아 식민지가 되었다. 경계는 머리강과 그 발원지에서 케이프하우까지 이은 선이었다. 그 여름 금이 잇달아 나왔다. 위키백과 영어판은 1851년 7월 1일 클루네스에서 제임스 에스먼드가 찾은 금을 처음 팔 만한 금광으로 꼽고, 7월 20일 마운트알렉산더의 토머스 피터스와 8월 8일 부니농의 토머스 히스콕의 발견을 든다. 멜버른의 신문 아르거스가 9월 8일 마운트알렉산더 소식을 실으면서 소문이 퍼졌고 밸러랫과 벤디고에서도 금광이 열렸다. 사람들이 일자리를 버리고 몰려 인구가 치솟았다. 빅토리아 식민지의 인구는 위키백과 본문 집계로 1851년 7만 7천여 명, 1861년 53만 8천여 명이다(문서 첫머리에는 약 7만 5천 명에서 50만 명으로도 적힌다). 멜버른은 1851년 약 2만 9천 명에서 1854년 약 12만 3천 명으로 커졌다. 오스트레일리아 전체 인구도 1851년 43만 8천 명 남짓에서 1861년 115만 명 남짓으로 늘었다. 금 생산은 1856년에 정점을 이루어 3백만 트로이온스(약 95톤)를 넘었고, 1851~1896년 합계는 6천백만 온스에 가깝다. 중국인 광부도 몰려 1855년 말 1만 9천 명 넘게 추산되었고 1858년에는 약 3만 3천 명으로 광부의 5분의 1쯤이었다. 식민지 정부는 1855년 6월 배 10톤당 중국인 승객 한 명으로 제한하고 한 사람당 10파운드를 물리는 법을 만들었다. 1851년 9월 1일 시작된 한 달 30실링 채굴 면허는 곧 광부들의 불만이 되어 「유레카 봉기와 책임 정부(1854~1856)」(뒤의 사건)로 이어진다."
  subjects: [victoria, new-south-wales]
  tags: [politics, economy]
  sources: ["위키백과 영어판 Victorian gold rush", "위키백과 영어판 Territorial evolution of Australia", "위키백과 영어판 Eureka Rebellion"]

- id: nz-constitution-1852
  year: 1852
  endYear: 1867
  title:
    ko: "뉴질랜드 헌법법과 마오리 의석(1852~1867)"
  summary:
    ko: "영국 의회가 정한 뉴질랜드 헌법법은 1852년 6월 30일 왕실 재가를 받았고, 1853년 1월 17일 조지 그레이 총독이 뉴질랜드에서 선포하며 효력이 생겼다. 「와이탕이 조약과 뉴질랜드 식민지(1840~1841)」(앞의 사건)로 시작된 뉴질랜드 식민지에 오클랜드·뉴플리머스·웰링턴·넬슨·캔터베리·오타고 여섯 주와 주 의회, 그리고 전국 총회를 두는 틀이었다. 투표권은 21세 넘은 남자로서 자유 보유 재산이 있고 연 수입이 50파운드 이상인 사람에게만 주어졌다. 마오리족의 땅은 개인 문서가 아니라 공동으로 가졌기 때문에 대부분의 마오리족 남자는 재산 자격을 채우지 못해 투표할 수 없었다. 정착민 수가 마오리족을 앞선 것은 1850년대 후반으로 알려져 있다. 총회 선거는 1853년 7월 14일부터 10월 1일까지 치러졌고 첫 의회는 1854년 5월 오클랜드에서 열렸다. 1856년에는 내각이 의회에 책임을 지는 책임 정부가 시작되어 헨리 슈얼이 첫 내각을 꾸렸다. 이 무렵 정착민 의회는 마오리족의 땅 매입과 군사 문제를 두고 총독과 다투었고 마오리족은 제 몫의 정치 자리를 요구했다. 1862년과 1865년의 원주민 토지법은 마오리족의 공동 땅을 개인 소유로 바꿀 길을 열고 원주민 토지 법원을 두었다. 1867년 마오리 대표법은 마오리족 남자에게 재산과 상관없이 투표권을 주면서 남북섬에 네 개 의석을 따로 배정했다. 처음에는 5년 동안만 두는 임시 제도로 만들어졌다. 수도는 1865년 오클랜드에서 웰링턴으로 옮겨졌고, 주 의회는 1876년에 없어졌다. 이 시기 마오리족과 정착민의 무력 충돌은 「뉴질랜드 전쟁: 타라나키와 와이카토(1860~1872)」(뒤의 사건)가 다룬다."
  subjects: [colony-of-new-zealand, maori]
  tags: [politics, law]
  sources: ["위키백과 영어판 New Zealand Constitution Act 1852", "위키백과 영어판 Māori electorates", "위키백과 영어판 Native Land Court"]

- id: new-caledonia-1853
  year: 1853
  endYear: 1878
  title:
    ko: "프랑스의 누벨칼레도니 병합과 1878년 카나크 봉기(1853~1878)"
  summary:
    ko: "섬 이름은 1774년 제임스 쿡이 스코틀랜드를 닮았다며 붙인 것이다. 1853년 9월 24일 프랑스의 해군 제독 데스프앵트가 나폴레옹 3세의 명령에 따라 누벨칼레도니를 프랑스 땅으로 선포했다. 프랑스는 이 섬을 영국보다 먼저 차지해 유형지와 해군 기지로 삼으려 했다. 이 섬에는 멜라네시아인인 카나크(하와이말로 사람을 뜻하는 낱말에서 온 이름)가 여러 족장 사회로 나뉘어 오래전부터 살았다. 1854년 6월 25일 타르디 드 몽트라벨이 포르드프랑스(오늘의 누메아)를 세웠다. 1864년 섬은 죄수 유형지가 되었고 같은 해 디아오강 둔치에서 니켈이 발견되었다. 위키백과 영어판은 1860년대부터 1897년까지 약 2만 2천 명의 범죄자와 정치범이 보내졌다고 적는다. 파리 코뮌 유형자는 1872년부터 1880년 사면 때까지 약 4,250명이 들어왔고 남은 사람은 마흔 가구가 채 못 된다는 서술이 있다(문서마다 숫자가 다르다). 1870년대 중반 채굴이 시작되었고 1880년 니켈 회사 르니켈이 세워져 본격화되었다(위키백과 영어판 누벨칼레도니 역사 문서는 설립을 1876년으로 적는다). 1888년 5월 1일 섬에는 죄수 10,428명이 있었고 그 가운데 2,329명은 형기를 마친 뒤였다. 정착민의 소 떼가 카나크의 얌 밭을 짓밟고 땅이 보호 구역으로 줄어들면서 갈등이 쌓였다. 1878년 라포아의 대족장 아타이가 이끈 봉기에서 프랑스인 200명쯤과 카나크 1,000명쯤이 죽었다고 전한다(문서마다 숫자가 다르다). 봉기가 진압된 뒤 땅은 더 줄었고 카나크 인구는 1878년 약 6만 명에서 1921년 약 2만 7천 명으로 줄었다. 니켈 광산이 커지면서 1890년대부터는 일본과 베트남에서 계약 노동자도 들어왔고, 이 땅과 사람의 문제는 20세기 독립 투표에서 다시 불거진다."
  subjects: [new-caledonia, melanesian-societies]
  tags: [politics, war, society]
  sources: ["위키백과 영어판 History of New Caledonia", "위키백과 영어판 New Caledonia", "위키백과 한국어판 누벨칼레도니"]

- id: eureka-1854
  year: 1854
  endYear: 1856
  title:
    ko: "유레카 봉기와 책임 정부(1854~1856)"
  summary:
    ko: "골드러시 때 광부들은 금을 찾았는지와 상관없이 달마다 면허료를 내야 했다. 1851년 시작된 한 달 30실링의 채굴 면허(「빅토리아 식민지 분리와 골드러시(1851~1853)」(앞의 사건))는 광부들의 분노를 샀고, 1853년 12월 1일 금광법이 왕실 재가를 받아 석 달 40실링으로 낮추었지만 불만은 가라앉지 않았다. 1854년 11월 29일 밸러랫의 베이커리힐에 약 1만 명이 모여 유레카 깃발 아래 뭉치기를 다짐했고, 광부들은 유레카 광구에 통나무 울타리 방책을 쌓았다. 1854년 12월 3일 새벽 병사와 경찰이 방책을 덮쳤다. 방책에 있던 사람은 120~150명으로 어림되고, 공식 기록으로 죽은 사람은 27명 안팎이며 대부분 광부 쪽이었다. 앞서 1851년 12월 15일 포리스트크리크의 큰 집회에는 많게는 2만 명이 모였다는 추산이 있고, 식민지 인구는 1851년 약 7만 7천 명에서 1853년 약 19만 8천 명으로 늘어 있었다. 반란 혐의를 받은 13명이 멜버른에서 반역죄로 재판을 받았으나 모두 풀려났고 광부들의 개혁 요구는 이어졌다. 광부들은 대표 없이는 세금도 없다는 구호로 투표권도 요구했다. 방책의 지도자 피터 래러는 싸움 중 왼팔을 잃었고 1855년 11월 빅토리아 식민지 입법 의회 밸러랫 선거구 의원으로 뽑혔다. 「오스트레일리아 식민지 정부법(1850)」(앞의 사건)이 열어 둔 길로 식민지들은 1855~1856년 책임 정부로 넘어갔다. 반디먼즈랜드는 이때 1856년 태즈메이니아로 이름을 바꾸었다. 비밀 투표는 1856년 태즈메이니아·빅토리아 식민지·사우스오스트레일리아 식민지에서 처음 채택되었고 1858년 뉴사우스웨일스 식민지가 뒤따랐다."
  subjects: [victoria, van-diemens-land]
  tags: [politics, war, law]
  sources: ["위키백과 영어판 Eureka Rebellion", "위키백과 영어판 History of Australia (1851–1900)", "위키백과 영어판 Victorian gold rush"]

- id: queensland-1859
  year: 1859
  endYear: 1863
  title:
    ko: "퀸즐랜드 분리와 식민지 경계 다시 긋기(1859~1863)"
  summary:
    ko: "1859년 6월 6일 뉴사우스웨일스 식민지 북부의 모턴베이 지구가 동경 141도 동쪽, 남위 29도 북쪽 땅과 함께 떨어져 나와 퀸즐랜드 식민지가 되었고 브리즈번이 중심이 되었다. 이 지구는 1842년 자유 이민에 열린 뒤 정착민이 늘면서 분리를 요구해 왔다. 위키백과 영어판 오스트레일리아 영토 변천 문서는 이 분리를 시작으로 5년 동안 이어진 경계 조정을 날짜와 함께 적는다. 1861년 10월 10일 특허장은 사우스오스트레일리아 식민지의 서쪽 경계를 동경 132도에서 웨스턴오스트레일리아 식민지와 맞닿는 동경 129도까지 넓혀, 뉴사우스웨일스 식민지 몫이던 서쪽 땅을 사우스오스트레일리아 식민지에 붙였다(영국 의회 법은 1861년 7월 22일 통과). 1862년 3월 13일에는 사우스오스트레일리아 식민지 북쪽, 동경 138도 동쪽의 땅이 뉴사우스웨일스 식민지에서 퀸즐랜드 식민지로 넘어가 카펀테리아만 일대가 퀸즐랜드의 서쪽 끝이 되었다. 1863년 7월 6일에는 사우스오스트레일리아 식민지 북쪽의 넓은 땅이 뉴사우스웨일스 식민지에서 사우스오스트레일리아 식민지로 옮겨졌고 이것이 노던 준주의 시작이다. 사우스오스트레일리아 식민지는 북쪽 해안의 항구와 땅을 얻으려는 뜻에서 이 땅을 맡았다. 노던 준주는 1911년 1월 1일 연방 정부로 넘어갈 때까지 사우스오스트레일리아 식민지가 맡았다. 그 사이 뉴사우스웨일스 식민지는 1859·1861·1862·1863년에 해마다 땅을 잃었다. 퀸즐랜드 식민지는 분리 때 뉴사우스웨일스 식민지의 헌법과 법을 받아들였다. 이 땅에는 오스트레일리아 원주민이 오래 살아 왔고, 경계선은 그들과 상관없이 영국 왕실의 특허장과 영국 의회 법으로 그어졌다."
  subjects: [queensland, new-south-wales, south-australia]
  tags: [politics, law]
  sources: ["위키백과 영어판 Territorial evolution of Australia", "위키백과 영어판 History of Australia (1851–1900)", "위키백과 영어판 Queensland"]

- id: nz-wars-1860
  year: 1860
  endYear: 1872
  title:
    ko: "뉴질랜드 전쟁: 타라나키와 와이카토(1860~1872)"
  summary:
    ko: "1860년 3월 17일 타라나키의 와이타라 땅 매매를 둘러싼 충돌이 뉴질랜드 식민지 정부와 마오리족 사이의 큰 전쟁이 되었다. 위키백과 영어판은 1860~1861년의 첫 타라나키 전쟁에서 영국군·의용군·민병대 238명쯤과 마오리족 200명쯤이 죽거나 다쳤다고 적는다. 1850년대 포타타우 테 훼로훼로를 왕으로 세운 킹잉아(마오리 왕 운동)는 땅을 더 팔지 않고 마오리족의 권위를 지키려는 움직임이었다. 1863년 7월 9일 그레이 총독이 오클랜드와 와이카토 사이 마오리족에게 최후통첩을 보냈고 거부당하자 7월 와이카토 침공이 시작되었다. 와이카토 작전에서는 영국군과 식민지군 700명쯤, 마오리족 1,000명쯤이 죽었다. 1864년 3~4월 오라카우에서는 포위된 마오리족이 사흘 동안 버텼다. 1863년 뉴질랜드 정착법은 반란 지역의 땅을 몰수할 길을 열었고, 타라나키·와이카토·타우랑가·베이오브플렌티에서 약 1만 6천 km²(마오리족 관습 땅의 15퍼센트, 150만 헥타르로도 적음)가 빼앗겼다는 서술이 있다. 1868~1869년에는 티토코와루가 타라나키에서, 1868~1872년에는 테 쿠티가 동해안과 내륙에서 싸웠다. 영국 정규군은 1860년대 중반부터 줄어 1870년에 모두 떠났다. 와이카토의 마오리족은 1864년 뒤 왕의 땅으로 불린 내륙으로 물러났고, 테 쿠티는 1868년 7월 유배지 채텀 제도에서 배를 빼앗아 탈출하면서 싸움을 시작했다. 위키백과 영어판 정보 상자는 모든 전쟁 동안 식민지·영국 쪽 사망을 약 745명, 마오리족 사망을 약 2,154명으로 적는다. 앞서 정치 제도는 「뉴질랜드 헌법법과 마오리 의석(1852~1867)」(앞의 사건)이 다룬다."
  subjects: [colony-of-new-zealand, maori]
  tags: [war, politics]
  sources: ["위키백과 영어판 New Zealand Wars", "위키백과 영어판 New Zealand Settlements Act 1863", "위키백과 영어판 Kīngitanga"]

- id: blackbirding-1863
  year: 1863
  endYear: 1904
  title:
    ko: "블랙버딩과 태평양 노동 이주(1863~1904)"
  summary:
    ko: "블랙버딩은 태평양 섬 사람을 속이거나 납치해 사탕수수 농장 같은 곳의 노동자로 데려간 모집 방식을 이르는 당시 말이다. 당시 미국 남북 전쟁으로 면화 값이 올라 퀸즐랜드에서 면화와 사탕수수 농장이 번졌으나 일손이 모자랐다. 1863년 8월 17일 로버트 타운스의 돈후안호가 퀸즐랜드 식민지 브리즈번에 섬 주민 67명을 데려오면서 퀸즐랜드의 노동 이주가 시작되었다. 위키백과 영어판은 1863~1908년 오스트레일리아로 온 섬 주민을 5만 5천~6만 2천 5백 명으로 어림하고 대부분이 멜라네시아인, 곧 솔로몬 제도 주민과 니바누아투였다고 적는다. 모집선 선원이 선교사로 꾸미거나 선물을 주어 유인했고 노동 약정의 뜻을 모르고 배를 탄 사람이 적지 않았다고 전한다. 1871년 영국 성공회 선교사 존 콜리지 패터슨이 누카푸에서 죽은 일은 모집선의 납치에 대한 보복이었다는 해석이 따랐다. 퀸즐랜드 식민지는 1868년 폴리네시아 노동자법으로, 영국 의회는 1872년 태평양 섬 주민 보호법으로 배에 면허를 내고 단속했으나 효과가 크지 않았다. 퀸즐랜드 식민지는 1890년 이 무역을 끝내는 법을 만들었으나 단속이 느슨했고 1892년 다시 열렸다. 같은 노동 모집은 피지·사모아·누벨칼레도니의 농장으로도 이어졌다. 1901년 태평양 섬 노동자법은 1904년 3월 뒤의 신규 도입을 금지하고 1906년부터 남은 사람의 추방을 정했다. 1906~1908년 4,000~7,500명이 돌려보내졌고 약 1,600명이 남았다는 어림이 있다. 일꾼 계약은 보통 3년이었고, 농장에서 풀려난 뒤 퀸즐랜드에 남은 사람들의 후손이 지금도 태평양 섬 주민 공동체를 이룬다."
  subjects: [queensland, melanesian-societies, solomon-islanders, ni-vanuatu]
  tags: [society, economy]
  sources: ["위키백과 영어판 Blackbirding", "위키백과 영어판 South Sea Islanders", "위키백과 영어판 Pacific Islanders Protection Act 1872"]

- id: cakobau-fiji-1871
  year: 1871
  endYear: 1874
  title:
    ko: "카코바우 정부와 피지의 영국 할양(1871~1874)"
  summary:
    ko: "1871년 6월 5일 영국 영사 존 베이츠 서스턴이 족장들을 설득해 세루 에페니사 카코바우를 왕으로 하는 입헌 군주제의 피지 왕국이 세워졌다(카코바우 정부). 같은 해 11월 오바라우섬의 레부카에서 입법 의회가 처음 열렸다. 정착민이 몰려 땅 문제와 빚이 얽혔고, 통가 출신의 마아푸가 라우 제도를 쥐고 있어 족장 사이 힘의 균형도 불안했다. 카코바우의 요청으로 서스턴이 1872년 영국에 할양을 제안했으나 거절되었고, 카코바우가 1874년 3월 21일 낸 마지막 제안을 영국이 받아들였다. 1874년 9월 23일 허큘리스 로빈슨이 군함 디도호로 닿아 21발 예포로 카코바우를 맞았고, 1874년 10월 10일 카코바우와 마아푸와 주요 족장들이 할양 증서 두 부에 서명하면서 피지 식민지가 시작되어 피지 왕국은 끝났다(현지 날짜. 서명과 영국 쪽 수락·선포는 날짜가 따로다). 레부카는 왕국과 식민지 초기의 중심지였다. 카코바우 정부의 내각은 정착민 출신이 이끌었고, 서스턴은 뒤에 피지 식민지 총독(1888~1897)을 지냈다. 카코바우는 1883년에 죽었다. 로빈슨은 1875년 6월까지 임시 총독으로 일했고 같은 달 아서 고든이 이어받아 족장 중심의 간접 통치를 폈다. 1875년에는 홍역이 번져 인구의 상당수가 죽었다고 흔히 말한다(비율은 문서마다 다르다). 피지의 수도는 레부카에서 수바로 옮겨졌다(위키백과는 1877년과 1882년을 함께 적는다). 1879년 5월 14일 인도 계약 노동자 463명을 태운 배가 처음 닿았고 1916년까지 약 6만 1천 명이 뒤따랐다. 블랙버딩과 노동 이주는 「블랙버딩과 태평양 노동 이주(1863~1904)」(앞의 사건)와 이어진다."
  subjects: [kingdom-of-fiji, fiji-colony]
  tags: [politics, law]
  sources: ["위키백과 영어판 Kingdom of Fiji", "위키백과 영어판 Colony of Fiji", "위키백과 영어판 Hercules Robinson, 1st Baron Rosmead"]

- id: hawaii-reciprocity-1875
  year: 1875
  endYear: 1887
  title:
    ko: "하와이–미국 호혜 조약과 사탕수수(1875~1887)"
  summary:
    ko: "1874년 루날릴로가 죽은 뒤 의회가 칼라카우아를 왕으로 뽑았고, 그는 이듬해 미국과 호혜 조약을 맺는 데 힘을 쏟았고, 협상은 1874~1875년 그의 미국 국빈 방문과 맞물려 있었다. 미국 설탕에는 관세가 붙던 때라 하와이 설탕은 관세가 없어지자 값 경쟁에서 앞서게 되었다. 조약은 1875년 1월 30일 서명되었고 하와이 왕국은 4월 17일, 미국은 5월 31일 비준했으며, 1876년 9월 첫 설탕 선적이 샌프란시스코에 닿으면서 효력이 생겼고 그 뒤 설탕 농장이 빠르게 늘었다. 하와이의 설탕과 쌀 같은 물건이 7년 동안 관세 없이 미국에 들어가고, 그 대신 하와이 왕국은 미국 물건에 세금을 물리지 않기로 했다. 위키백과 영어판은 하와이의 설탕 수출이 1874년 약 2,457만 파운드에서 1890년 약 3억 3,082만 파운드로 늘고, 수출 총액이 183만 달러에서 1,328만 달러(약 7.2배)로 늘었다고 적는다. 농장이 커지자 일손이 모자라 중국인과 포르투갈인 노동자가 들어왔고, 1885년에는 일본 정부와 맺은 관약 이민의 첫 배가 닿았다. 칼라카우아는 1881년 세계를 한 바퀴 도는 여행을 해 왕으로서는 처음 지구를 돈 사람으로 알려졌다. 조약은 1884년 12월 6일 7년 더 늘리기로 합의되었고, 1887년 12월 9일 비준서를 주고받으며 진주만을 미국 배가 독점해 쓰는 조항이 들어갔다. 이 조약은 하와이 경제를 미국 시장에 묶어 설탕 농장주 집단의 힘을 키웠고 그 힘이 「하와이의 총검 헌법(1887~1891)」(뒤의 사건)의 바탕이 되었다. 뒷날 한국인의 하와이 이민(「하와이 이민의 시작」)이 일할 곳이 된 것도 이 설탕 농장이다."
  subjects: [hawaiian-kingdom]
  tags: [economy, politics]
  sources: ["위키백과 영어판 Reciprocity Treaty of 1875", "위키백과 영어판 Kalākaua", "위키백과 영어판 Sugar plantations in Hawaii"]

- id: tahiti-annexation-1880
  year: 1880
  endYear: 1888
  title:
    ko: "포마레 5세의 양도와 프랑스령 폴리네시아의 시작(1880~1888)"
  summary:
    ko: "1827년부터 다스린 포마레 4세가 1877년 죽자 아들 포마레 5세가 1877년 9월 17일 이어받았고 9월 24일 파페에테에서 왕관을 썼다(포마레 4세와 프랑스 보호령은 「프랑스의 타히티 보호령과 포마레 4세(1842~1847)」(앞의 사건)). 1839년 11월 3일 태어난 그는 형이 1855년 5월 죽어 왕세자가 되었고, 보호령 아래서 안의 일을 맡아 오다가 1880년 6월 29일 만 40세로 타히티와 그 속령을 프랑스에 모두 넘겼다. 위키백과 영어판은 그 대가로 프랑스 정부의 연금과 레지옹 도뇌르 훈장 명예 직위, 농업 공로 훈장을 받았다고 적는다. 프랑스 의회는 같은 해 12월 30일 법으로 이 양도를 받아들였다. 이때부터 타히티 왕국은 사라지고 프랑스령 오세아니아 시설이라 불린 식민지가 되었고, 이 이름은 1957년 프랑스령 폴리네시아로 바뀌었다. 포마레 5세는 양도 뒤에도 파페에테 왕궁에서 살다가 1891년 6월 12일 거기서 죽었다. 그는 1875년 마라우 살몽과 혼인했다가 1887년 헤어졌다. 프랑스는 1880년 무렵 투아모투 제도를 속령으로 묶고 1881년 감비에 제도를 더했으며, 1888년에는 소시에테 제도 서쪽의 리워드 제도도 병합했다. 리워드 제도는 포마레 집안의 양도에 들어 있지 않던 독립 왕국들이었다. 라이아테아의 족장 테라우포오가 이끈 저항은 1897년까지 이어졌다. 마르키즈 제도는 이미 1842년 프랑스가 차지한 땅이었다. 양도로 타히티 왕국은 포마레 왕조 아래 약 90년 동안 이어진 끝을 맞았다(그 시작은 「포마레 왕조의 타히티 왕국(1791~1815)」이 1791년 무렵으로 본다)."
  subjects: [kingdom-of-tahiti, french-polynesia]
  tags: [politics, law]
  sources: ["위키백과 영어판 Pōmare V", "위키백과 영어판 Pōmare dynasty", "위키백과 영어판 French Polynesia", "위키백과 영어판 History of French Polynesia"]

- id: new-guinea-partition-1884
  year: 1884
  endYear: 1886
  title:
    ko: "뉴기니 분할: 독일령 뉴기니와 영국령 뉴기니(1884~1886)"
  summary:
    ko: "뉴기니섬은 서쪽 절반을 네덜란드가 1828년부터 자기 땅으로 주장했고, 동쪽 절반에는 파푸아인이 오래 살았다. 1883년 퀸즐랜드 식민지 정부가 동쪽 남부를 병합한다고 선언했으나 영국 정부가 인정하지 않았다. 그러자 독일이 움직였다. 1884년 11월 3일 독일 깃발이 올라 북동부 해안의 독일 황제 빌헬름 1세의 이름을 딴 카이저빌헬름슬란트가 보호령이 되었고 1885년 비스마르크 제도와 북솔로몬이 이어졌으며, 땅은 1885년 5월 제국의 허가를 받은 뉴기니 회사가 다스렸다. 영국은 1884년 11월 6일 포트모르즈비에서 어스킨 제독이 선포식을 열어 남동부 해안 일대를 보호령으로 삼았다(현지 임시 행정관 휴 로밀리의 첫 선포는 10월 21일). 영국령 뉴기니가 이렇게 시작되었고 1888년에는 정식 병합으로 바뀌었다. 위키백과 영어판은 독일령 뉴기니의 중심지가 핀슈하펜에서 프리드리히빌헬름스하펜, 헤르베르츠회에, 심프슨하펜 순으로 옮겨졌다고 적는다. 1885년 4월 영국과 독일이 서로의 경계를 선언해 동경 141도 서쪽 네덜란드 땅을 뺀 동쪽 절반이 독일 북쪽과 영국 남쪽으로 나뉘었다(1885년 선언의 날짜는 문서마다 다르다). 두 나라는 이어 1886년 서태평양 선언으로 영향권을 갈랐다(「독일의 마셜 제도 보호령과 영독 서태평양 분할(1885~1886)」(뒤의 사건)). 독일령에서는 해마다 일정한 노동을 하게 하는 의무와 현금 인두세가 농장 일손을 모으는 수단이 되었다. 영국은 피터 스크래칠리를 특별 판무관으로 보냈으나 그는 1885년 8월 닿아 12월에 죽었고, 1886년 전 퀸즐랜드 총리 존 더글러스가 이어받았으며, 1888년 병합 뒤에는 윌리엄 맥그리거가 첫 행정관이 되었다. 이렇게 네덜란드·영국·독일이 섬을 세 몫으로 나누었다. 독일령 뉴기니는 1914년 오스트레일리아군이 점령할 때까지 이어졌다."
  subjects: [british-new-guinea, german-new-guinea, papuans]
  tags: [politics, law]
  sources: ["위키백과 영어판 German New Guinea", "위키백과 영어판 Territory of Papua", "위키백과 영어판 Territorial evolution of Australia"]

- id: marshall-1885
  year: 1885
  endYear: 1886
  title:
    ko: "독일의 마셜 제도 보호령과 영독 서태평양 분할(1885~1886)"
  summary:
    ko: "마셜 제도는 29개 환초와 5개 섬으로 이루어졌다. 1526년 스페인의 알론소 데 살라사르가 한 환초를 본 것이 유럽 기록의 처음이고 이름은 1788년 이곳을 지난 영국 선장 존 마셜에서 왔다. 1857년 미국 선교사가 에본에 교회와 학교를 세웠고 1873년 독일 상사 카펠 회사가 코프라를 사려고 잘루이트에 본부를 옮기면서 독일의 관심이 깊어졌다. 1878년 11월 29일 독일 해군 대위 바르톨로메우스 폰 베르너가 잘루이트의 카부아를 비롯한 라리크 열도 이로이지, 곧 족장들과 조약을 맺어 석탄 보급소를 얻었다. 1885년 8월 29일 비스마르크가 보호령 선포를 허락했고 10월 15일 이로이지들이 독일과 보호 조약에 서명했다. 같은 해 독일이 야프에 깃발을 올리자 카롤리나 제도가 자기 몫이라 주장한 스페인과 부딪히는 카롤리나 위기가 일어났다. 교황 레오 13세가 중재해 스페인의 주권을 인정하고 독일에 통상의 자유를 주는 쪽으로 풀렸다. 1886년 영국과 독일은 서태평양 선언으로 영향권을 나눠 마셜 제도와 독일 쪽 땅을 독일에 인정했고 길버트 제도는 영국 쪽으로 남았다. 1888년 무렵부터는 잘루이트 회사가 이 무역과 행정을 이어받았다. 마셜 제도에서 이로이지는 땅에 대한 권위를 가진 족장으로 미크로네시아인 사회의 짜임을 이룬다. 1888년 나우루도 독일 보호령에 들었고, 1906년 3월 31일 독일은 이 섬들을 독일령 뉴기니 아래로 직접 넣었다. 독일은 1899년 스페인에게서 카롤리나 제도와 팔라우를 사들였다. 뉴기니 쪽 분할은 「뉴기니 분할: 독일령 뉴기니와 영국령 뉴기니(1884~1886)」(앞의 사건)가 다룬다."
  subjects: [micronesian-culture]
  tags: [politics, economy]
  sources: ["위키백과 영어판 Marshall Islands", "위키백과 영어판 German New Guinea", "위키백과 영어판 Jaluit Company"]

- id: bayonet-constitution-1887
  year: 1887
  endYear: 1891
  title:
    ko: "하와이의 총검 헌법(1887~1891)"
  summary:
    ko: "1887년 6월 30일 호놀룰루 소총대와 하와이 연맹이 모인 집회가 칼라카우아 왕에게 총리 월터 깁슨이 이끄는 내각을 물리라고 요구했다. 다음 날 소총대는 무기 선적이 발견되자 권력을 잡았고 깁슨은 샌프란시스코로 쫓겨났다. 왕은 외국 대표에게 도움을 청했으나 그들은 따르라고 조언했다. 로린 서스턴과 샌퍼드 돌을 비롯한 법률가들이 일주일 안에 새 헌법을 써서, 칼라카우아는 폐위의 위협 아래 7월 6일 서명했고 7월 7일 선포되었다(입법부의 비준은 없었다). 로린 서스턴은 새 체제에서 내무 장관이 되어 큰 힘을 쥐었다. 위키백과 영어판에 따르면 왕의 절대 거부권은 입법부 3분의 2가 뒤집을 수 있는 것으로 바뀌었고, 왕은 내각의 동의 없이 일할 수 없게 되었으며, 귀족원은 임명이 아니라 높은 재산과 소득을 요구하는 선거로 뽑게 되었다. 하와이에 사는 유럽과 미국 출신 외국인에게도 투표권이 주어졌으나 아시아계 주민은 막혔고, 재산 조건을 채우지 못한 하와이인도 귀족원 선거에서 밀려났다. 왕권을 줄이고 설탕 농장주 집단의 힘을 키운 이 헌법을 사람들은 총검 헌법이라 불렀고, 1893년 릴리우오칼라니가 새 헌법을 시도할 때까지 이어졌다. 하와이 원주민들은 헌법을 없애 달라는 청원을 냈고, 1889년에는 로버트 윌콕스가 이끈 봉기가 있었으나 진압되었다. 칼라카우아는 1891년 1월 20일 샌프란시스코에서 54세로 죽었고 누이 릴리우오칼라니가 이었다. 돌은 뒤에 임시 정부의 수장이 된다(「하와이 왕국 전복과 하와이 공화국(1893~1894)」(뒤의 사건)). 호혜 조약은 「하와이–미국 호혜 조약과 사탕수수(1875~1887)」(앞의 사건)이 다룬다."
  subjects: [hawaiian-kingdom]
  tags: [politics, law]
  sources: ["위키백과 영어판 1887 Constitution of the Kingdom of Hawaii", "위키백과 영어판 Kalākaua", "위키백과 영어판 Liliʻuokalani"]

- id: new-hebrides-solomons-1887
  year: 1887
  endYear: 1893
  title:
    ko: "뉴헤브리디스 합동 해군 위원회와 영국령 솔로몬 제도(1887~1893)"
  summary:
    ko: "1880년대 뉴헤브리디스 곳곳에는 영국과 프랑스 정착민, 선교사, 노동 모집선이 몰려 있었고 원주민 니바누아투와 외국인 사이의 다툼이 잦았다. 1887년 영국과 프랑스는 합동 해군 위원회를 두어 두 나라 시민을 보호하기로 했다. 정착민은 처음에는 영국 쪽이 많았으나 프랑스인이 늘어 몇십 년 안에 영국인의 두 배쯤이 되었다. 이 위원회는 1906년 「파푸아 법과 뉴헤브리디스 공동 통치(1906~1907)」(뒤의 사건)의 공동 통치로 이어질 때까지 섬들을 감독했다. 영국의 서태평양 고등판무관은 피지에 자리를 두고 이런 섬들을 맡았다. 독일이 1885년 북솔로몬을 차지한 것도 영국이 움직인 한 까닭으로 읽힌다. 영국령 솔로몬 제도는 1893년 6월 영국 군함 큐라소호의 허버트 깁슨 함장이 남쪽 솔로몬 제도를 보호령으로 선포하며 시작되었다. 1897년 벨로나·렌널·시카이아나가, 1898년 산타크루스 제도와 리프·더프 제도가 더해졌다. 1899년 사모아 삼국 협정으로 영국은 부갱빌 동쪽과 남동쪽의 독일 이익을 받았고, 1900년 10월 선포로 산타이사벨섬 등 북쪽 섬들이 보호령에 들었다. 박물학자이기도 했던 찰스 모리스 우드퍼드는 1896년 4월 임시 부판무관으로 일하다가 1897년 2월 첫 주재 판무관이 되었다. 툴라기가 수도로 쓰였다. 솔로몬 제도 주민 사이에서는 머리 사냥이 이어졌고 영국 군함과 경찰의 징벌 원정이 1902년 무렵까지 서쪽 섬들의 싸움을 눌렀다. 이 섬들의 일꾼이 퀸즐랜드와 피지로 간 일은 「블랙버딩과 태평양 노동 이주(1863~1904)」(앞의 사건)가 다룬다. 보호령이 독일과 나눈 선은 「사모아 삼국 협정과 독일령 사모아(1899~1900)」(뒤의 사건)에서 확정된다."
  subjects: [ni-vanuatu, solomon-islanders, british-solomon-islands]
  tags: [politics, society]
  sources: ["위키백과 영어판 British Solomon Islands", "위키백과 영어판 New Hebrides", "위키백과 영어판 Charles Morris Woodford"]

- id: cook-islands-1888
  year: 1888
  endYear: 1901
  title:
    ko: "쿡 제도의 영국 보호령과 뉴질랜드 편입(1888~1901)"
  summary:
    ko: "쿡 제도에는 타히티 쪽에서 건너온 폴리네시아인이 오래전부터 살았고, 라로통가에서는 여러 아리키, 곧 족장이 땅을 나눠 다스렸다. 쿡 제도라는 이름은 쿡이 허비 제도라 부른 섬들을 러시아 제독 크루젠슈테른이 1820년대 지도에서 쿡 제도로 고쳐 부르면서 퍼졌다. 1823년 런던 선교회가 라로통가에 닿아 기독교가 퍼졌다. 1880년 타히티가 프랑스에 넘어가자(「포마레 5세의 양도와 프랑스령 폴리네시아의 시작(1880~1888)」(앞의 사건)) 프랑스가 쿡 제도로 올 것이라는 걱정이 커졌다. 라로통가의 여족장 마케아 타카우는 1885년 뉴질랜드의 원주민부 장관 존 밸런스를 만나 뉴질랜드와의 합치를 의논했고, 1888년 5월에는 프랑스의 침략을 걱정해 영국에 보호를 청했다. 다른 아리키들은 이 청원을 허락한 적이 없었으나 영국 식민부는 받아들였다. 1888년 9월 27일 영국 임시 부영사 리처드 엑섬이 남쪽 쿡 제도에 보호령을 선포했고 약 4주 뒤 군함 히아신스호의 에드먼드 버크 함장이 다시 선포했다. 1893~1906년 총리를 지낸 리처드 세던은 1890년대 말 태평양 섬들을 뉴질랜드에 붙이는 데 적극적이었다. 위키백과 영어판의 연표는 같은 해 연방 의회가 서는 것으로 적는다. 영국은 1891년 라로통가에 주재관을 두었고 뉴질랜드 정부는 1890년대 말 주재관을 보내 행정을 맡았다. 1901년 6월 11일 영국 왕의 추밀원령으로 쿡 제도는 뉴질랜드 식민지의 경계 안에 들었고 같은 해 니우에도 같은 길을 갔다고 전한다. 영국 보호령 시기는 13년이었고, 뉴질랜드는 1907년 자치령이 되었다(「뉴질랜드 자치령(1907)」(뒤의 사건)). 쿡 제도는 1965년 뉴질랜드와 자유 연합을 맺은 자치 정부가 되어 앨버트 헨리가 첫 총리를 맡았다."
  subjects: [colony-of-new-zealand, polynesian-culture]
  tags: [politics, law]
  sources: ["위키백과 영어판 History of the Cook Islands", "위키백과 영어판 Makea Takau", "위키백과 영어판 Cook Islands"]

- id: samoa-crisis-1889
  year: 1889
  endYear: 1894
  title:
    ko: "사모아 위기와 베를린 협정(1889~1894)"
  summary:
    ko: "사모아는 사바이섬·우폴루섬·투투일라 같은 섬으로 이루어졌다. 1878년 미국이 팡오팡오에 연료 보급 기지를 얻고 독일이 아피아에서 땅을 넓히면서 세 나라의 다툼이 시작되었다. 독일 상사가 코프라 무역과 농장의 큰 몫을 쥐고 있었다. 말리에토아 라우페파는 1881년 영국·미국·독일 영사의 인정을 받아 홀로 왕이 되었으나 1887년 8월 독일이 밀던 타마세세 티티마에아의 군대에 쫓겼다. 독일의 오이겐 브란데이스 대령은 그해 9월 15일 라우페파에게 타마세세를 왕으로 인정하게 했고 9월 17일 그를 유배했다(독일 군함이 오스트레일리아를 거쳐 카메룬으로 데려갔다). 미국 군함 셋과 독일 군함 셋이 몇 달 동안 아피아 항에서 맞섰고 영국 순양함 칼리오페호가 지켜보았다. 1889년 3월 15~16일 태풍이 여섯 척을 모두 부수었고 칼리오페호만 항구를 빠져나갔다. 위키백과 영어판 정보 상자는 죽은 사람을 미국 쪽 62명, 독일 쪽 73명쯤으로 적는다. 1889년 6월 14일 독일·영국·미국은 베를린 일반 협정에 서명해 세 나라의 감독 아래 사모아 왕국을 두고 라우페파를 왕으로 선언했다(이 날짜는 서명일이고 비준은 그 뒤에 이루어졌다). 라우페파는 11월 8일 돌아왔고 12월 4일 레페아의 회의에서 왕으로 선포되었다. 마타아파 이오세포는 1891년 5월 31일 말리에를 차지하고 맞섰고 1893년 7월 전쟁이 라우페파의 승리로 끝나 7월 26일 마셜 제도의 잘루이트로 추방되었다. 1887년 라우페파가 하와이 왕국과 맺은 연방 조약에서 하와이의 도움은 끝내 오지 않았다. 영국 영사 우드퍼드는 1895년 라우페파와 타마세세 레알로피의 화해 모임을 주선했다. 라우페파는 1898년 8월 22일 사바이섬에서 죽었다."
  subjects: [samoa-kingdom]
  tags: [politics, war]
  sources: ["위키백과 영어판 Samoan crisis", "위키백과 영어판 Malietoa Laupepa", "위키백과 영어판 Treaty of Berlin (1889)"]

- id: federation-convention-1891
  year: 1891
  endYear: 1900
  title:
    ko: "연방 헌법 회의와 오스트레일리아 연방 헌법(1891~1900)"
  summary:
    ko: "1889년 10월 24일 뉴사우스웨일스 식민지의 헨리 파크스가 텐터필드에서 한 연설이 식민지들의 연방 논의를 다시 불붙였다. 1891년 시드니에서 열린 전 오스트레일리아 회의에서 새뮤얼 그리피스가 앤드루 잉글리스 클라크의 초안을 퀸즐랜드 증기 요트 루시나호 위에서 부활절 주말에 다듬었으나, 식민지 의회들이 이를 받아들이지 않아 일이 한동안 멈추었다. 이번에는 뉴사우스웨일스·빅토리아·사우스오스트레일리아·태즈메이니아가 1897년 3월 주민 선거로, 웨스턴오스트레일리아가 의회 투표로 열 명씩 대표를 뽑았고(퀸즐랜드는 대표를 보내지 않았다) 연방 회의가 1897~1898년 애들레이드·시드니·멜버른에서 이어졌고 1898년 3월 17일 해산했다. 헌법안은 식민지마다 주민 투표에 부쳐졌다. 1898년 6월 3~4일의 첫 투표에서 태즈메이니아(1856년까지 반디먼즈랜드)와 빅토리아 식민지, 사우스오스트레일리아 식민지는 큰 차로 찬성했으나 뉴사우스웨일스 식민지는 찬성 71,595표, 반대 66,228표로 법이 정한 찬성 8만 표에 못 미쳤다. 헌법안을 고친 뒤 1899년 4월 29일 사우스오스트레일리아 식민지를 시작으로 6월 20일 뉴사우스웨일스 식민지(찬성 56.49퍼센트), 7월 27일 태즈메이니아와 빅토리아 식민지, 9월 2일 퀸즐랜드 식민지(찬성 55.39퍼센트)가 승인했다. 웨스턴오스트레일리아 식민지는 1900년 7월 31일 찬성 69.47퍼센트로 마지막에 가담했다. 영국 의회는 오스트레일리아 연방 헌법법을 1900년 7월 5일 통과시켰고 7월 9일 왕실 재가가 났다. 영국 왕을 나라의 머리로 두는 자치 연방의 틀이었고, 1901년 1월 1일의 시행과 선포를 포함한 연방의 성립은 「오스트레일리아 연방과 이민 제한법(1901)」(뒤의 사건)이 다룬다."
  subjects: [new-south-wales, victoria, queensland, south-australia, western-australia, van-diemens-land]
  tags: [politics, law]
  sources: ["위키백과 영어판 Federation of Australia", "위키백과 영어판 Henry Parkes", "위키백과 영어판 Samuel Griffith", "위키백과 영어판 Commonwealth of Australia Constitution Act 1900"]

- id: hawaii-overthrow-1893
  year: 1893
  endYear: 1894
  title:
    ko: "하와이 왕국 전복과 하와이 공화국(1893~1894)"
  summary:
    ko: "1891년 오빠 칼라카우아가 죽어 왕위에 오른 릴리우오칼라니 여왕은 1893년 1월 14일 총검 헌법(「하와이의 총검 헌법(1887~1891)」(앞의 사건))을 대신할 새 헌법을 선포하려 했으나 각료들이 거부했다. 이 시도는 왕권을 되찾으려는 것으로 받아들여져 외국 출신 주민이 중심이 된 안전 위원회가 일어났고, 위원회는 군대가 없는 왕국을 지키겠다며 미국 공사 존 스티븐스에게 도움을 청했다. 1월 16일 미국 군함 보스턴호에서 선원과 해병 약 162명이 호놀룰루에 상륙해 정부 청사 가까이에 자리 잡았고, 1월 17일 안전 위원회가 샌퍼드 돌을 앞세운 임시 정부를 선포했고 스티븐스는 이를 곧바로 승인했다. 여왕은 피를 흘리지 않으려고 '미국의 우월한 힘'에 항의하며 권한을 넘긴다고 밝혔다. 위키백과 영어판에 따르면 클리블랜드 대통령이 보낸 블런트 조사는 미국 외교관과 군대가 권한을 남용했다고 보고했으나 미국 상원의 모건 보고서는 뒤에 그들의 잘못이 없다고 결론지었고, 클리블랜드는 결국 공화국을 인정했다. 임시 정부는 1894년 7월 4일 공화국 헌법을 선포하며 하와이 공화국이 되었고 돌이 대통령이 되었다. 임시 정부가 보낸 대표단은 1893년 2월 14일 미국과 병합 조약을 맺었으나 비준 전에 클리블랜드 대통령이 3월 이를 거두어들였다. 1895년 1월 왕정을 되살리려는 봉기가 실패했고 여왕은 1895년 1월 24일 퇴위 문서에 서명했다. 미국 의회는 1993년 사과 결의로 미국의 관여를 인정했다. 이 일의 정당성을 두고는 지금도 평가가 갈린다. 병합은 「미국의 하와이 병합(1898~1900)」(뒤의 사건)이 다룬다."
  subjects: [hawaiian-kingdom, republic-of-hawaii]
  tags: [politics, war]
  sources: ["위키백과 영어판 Overthrow of the Hawaiian Kingdom", "위키백과 영어판 Liliʻuokalani", "위키백과 영어판 Republic of Hawaii", "위키백과 영어판 Blount Report"]

- id: nz-suffrage-1893
  year: 1893
  endYear: 1893
  title:
    ko: "뉴질랜드의 여성 참정권(1893)"
  summary:
    ko: "1893년 9월 19일 총독 글래스고 경이 선거법에 왕실 재가를 내리면서 뉴질랜드 식민지는 모든 여성에게 국회 선거권을 준 세계 첫 나라가 되었다. 유럽계 남성의 재산 자격은 1879년 이미 없어져 있었다. 운동에는 기독교 여성 금주 연합의 도움이 컸다. 케이트 셰퍼드가 이끈 운동은 20년쯤 이어졌고, 청원 서명은 1891년 9,000명 넘게, 1892년 2만 명 가까이, 1893년 3만 2천 명 가까이로 늘었는데 이는 성인 유럽계 여성의 4분의 1쯤이었다. 상원은 1893년 9월 8일 법안을 20 대 18로 통과시켰는데, 평의원 두 사람이 표를 바꾼 뒤였고 재가는 열하루 뒤에 났다. 여성이 처음 투표한 선거는 1893년 11월 28일에 치러졌고, 마오리 선거구의 선거는 12월 20일에 따로 열렸다. 이 선거에는 마오리 여성도 참여했다. 당시 정부는 세던이 이끄는 자유당 내각이었고, 셰퍼드의 얼굴은 지금 뉴질랜드 10달러 지폐에 들어 있다. 같은 해 엘리자베스 예이츠가 오네훈가의 시장이 되어 영국 제국에서 첫 여성 시장으로 꼽힌다. 그러나 여성이 하원에 설 권리는 1919년에야 생겼고, 1933년 엘리자베스 매콤스가 첫 여성 의원이 되었다. 같은 권리는 1894년 사우스오스트레일리아 식민지가 이어받았고 1902년 오스트레일리아 연방 선거법이 이었다고 흔히 말한다. 남성 중심의 재산 자격으로 마오리족의 투표가 막혔던 앞 시기의 일은 「뉴질랜드 헌법법과 마오리 의석(1852~1867)」(앞의 사건)이 다룬다. 이 법은 영국 제국 안에서 식민지가 먼저 걸은 길이었고, 영국 여성은 1918년(만 30세 이상)에야 제한된 선거권을 얻었다."
  subjects: [colony-of-new-zealand]
  tags: [politics, society, law]
  sources: ["위키백과 영어판 Women's suffrage in New Zealand", "위키백과 영어판 Kate Sheppard", "위키백과 영어판 Electoral Act 1893"]

- id: hawaii-annexation-1898
  year: 1898
  endYear: 1900
  title:
    ko: "미국의 하와이 병합(1898~1900)"
  summary:
    ko: "하와이 공화국은 처음부터 미국과의 합병을 바랐고 1897년 미국과 병합 조약을 맺었으나 미국 상원에서 필요한 3분의 2 지지를 얻지 못했다. 하와이 원주민들은 병합에 반대해 1897년 쿠 이 청원을 모아 서명 21,269명을 얻었고 릴리우오칼라니도 미국 의회에 항의했다. 미국에서는 반제국주의 연맹이 병합에 반대했다. 1898년 4월 스페인과 전쟁이 시작되자 호놀룰루는 필리핀으로 가는 미국 군대의 기항지가 되었다. 미국–스페인 전쟁(「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」)에서 하와이가 군사 기지로 값어치를 드러내자 사정이 바뀌었다. 조약 대신 상하원 과반수만 필요한 의회 공동 결의안이 쓰였는데, 프랜시스 뉴랜즈 의원이 쓴 이 뉴랜즈 결의는 하원에서 209 대 91, 상원에서 42 대 21로 통과되어 1898년 7월 7일 매킨리 대통령이 서명했다(조약이 아니라 의회 공동 결의이다). 공식 이양 의식은 1898년 8월 12일 이올라니 궁에서 열려 하와이 공화국이 미국 땅이 되었다(위키백과 영어판의 한 사진 설명은 8월 23일로 적는다). 미국은 하와이 공화국의 빚 약 400만 달러를 떠안았다. 5인 위원회가 하와이에 맞는 법을 살폈고 미국 의회는 1년 넘게 준주 정부를 논의한 끝에 1900년 하와이 준주를 두는 조직법을 만들었다. 이 법은 하와이 공화국 시민에게 미국 시민권을 주었고 샌퍼드 돌이 첫 준주 총독을 맡았다. 한국인의 하와이 이민(「하와이 이민의 시작」)은 이 준주 시기인 1903년 1월 첫 이민단이 닿으면서 시작되었고, 하와이는 1959년 주가 되었다(「알래스카·하와이의 주 편입(1959)」(뒤의 사건))."
  subjects: [republic-of-hawaii, usa]
  tags: [politics, law]
  sources: ["위키백과 영어판 Newlands Resolution", "위키백과 영어판 Annexation of Hawaii", "위키백과 영어판 Republic of Hawaii", "위키백과 영어판 Hawaiian Organic Act"]

- id: samoa-tripartite-1899
  year: 1899
  endYear: 1900
  title:
    ko: "사모아 삼국 협정과 독일령 사모아(1899~1900)"
  summary:
    ko: "1898년 말리에토아 라우페파가 죽은 뒤 사모아는 다시 둘로 갈렸다(「사모아 위기와 베를린 협정(1889~1894)」(앞의 사건)). 망명에서 돌아온 마타아파 이오세포를 추장 회의가 왕으로 뽑았으나 영국과 미국은 라우페파의 아들 말리에토아 타누마필리 1세를 지지했고 독일은 마타아파를 편들었다. 영국·미국 군대가 아피아에 상륙해 타누마필리 편에서 싸웠고 아피아 포위가 이어졌으며 1899년 4월 1일 바일렐레에서 영국·미국 원정대가 졌다. 이 싸움은 사모아 왕국을 둘러싼 세 나라의 경쟁을 더는 끌 수 없다는 것을 보여 주었다. 1899년 12월 2일 워싱턴에서 사모아 삼국 협정이 서명되어 서쪽 섬들은 독일에, 동쪽 투투일라섬 등은 미국에 돌아갔다. 영국은 사모아에 대한 요구를 거두는 대신 통가에 대한 독일의 요구 철회와 부갱빌 동쪽과 남동쪽 솔로몬 제도의 독일 이익을 받았다(「뉴헤브리디스 합동 해군 위원회와 영국령 솔로몬 제도(1887~1893)」(앞의 사건)). 비준서는 1900년 2월 16일 교환되었고 1900년 3월 1일 독일 깃발이 올라 독일령 사모아가 시작되었으며 빌헬름 졸프가 첫 총독이 되었다. 독일령의 경제는 코프라 농장이 중심이었다. 마타아파는 독일 아래 최고 추장이 되었다. 동서의 경계는 서경 171도 선으로 그어졌고, 미국은 팡오팡오 항구를 쓰게 되어 해군 연료 기지를 지켰다. 위키백과 영어판에 따르면 1912년 독일령 사모아는 넓이 약 2,831 km², 주민 약 3만 3,500명이었다. 이 땅을 1914년 뉴질랜드가 점령하는 일은 「오스트레일리아·뉴질랜드의 독일령 점령(1914~1919)」(뒤의 사건)이 다룬다."
  subjects: [samoa-kingdom, german-samoa]
  tags: [politics, law, war]
  sources: ["위키백과 영어판 German Samoa", "위키백과 영어판 Second Samoan Civil War", "위키백과 영어판 Tripartite Convention", "위키백과 영어판 Wilhelm Solf"]
