# 동남아 사건 2묶음 갈래 02(se-02): 스리비자야·앙코르·바간의 시대와 대월의 독립 (600 ~ 1292년)
# 범위: 드바라바티·라보와 하리푼차이·첸라의 분열과 이샤나바르만·스리비자야의 성립·마타람과 샤일렌드라·크메르 제국의 시작과 앙코르·참파의 환왕과 인드라푸라 왕조·쿡씨의 자치와 박당강 전투·딘·전 레·리·쩐 왕조·케디리와 싱하사리·바간의 아노라타와 몽골 침공·수코타이와 란나·트르나테·크다 술탄국.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 학설이 갈리는 해는 본문 해를 하나 두고 다른 해를 괄호로 함께 적었다. 땅이 없는 항목(드바라바티·쀼 도시국가)은 사건의 주체로만 두었고 점령·원정은 사건 글과 화살표로만 나타냈다.
# 달력: 율리우스력이다. 중국·베트남 사서의 날짜는 음력이라 밝혔고, 사카력 연대는 필요한 곳에만 괄호로 적었다. 확실하지 않은 날짜는 무렵으로 적었다.
# 이름 규칙: 표기 사전을 따라 스리비자야·참파·첸라·쀼·크메르 제국·바간·쿡씨·란나 왕국·응오꾸옌·딘보린·레호안으로 적었고 베트남 인명은 성조 없이 썼다. 민족·분쟁 문제는 일어난 일과 범위로만 적었다.
# 한국사와 닿는 점: 몽골의 대월 침입과 같은 때 고려도 몽골과 싸웠다는 점만 한 구절로 적었다.
# 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(당의 불교, 남조의 성장, 유은·유엄의 남한 건국, 라젠드라 1세의 원정, 몽골의 대리 정복, 원의 일본·베트남·자와 원정, 한 무제의 남월 정복).

- id: dvaravati-600
  year: 600
  endYear: 1100
  title:
    ko: "드바라바티: 짜오프라야강 유역의 몬 도시들(600~1100)"
  summary:
    ko: "드바라바티는 7세기부터 11세기 무렵까지 지금의 타이 중부, 짜오프라야강 유역에서 몬어를 쓴 사람들이 이룬 도시들과 그 문화를 가리킨다. 중심은 해자와 흙벽을 두른 도시들로, 가장 이른 터가 우텅이고 나콘빠톰과 수판부리가 뒤를 이었으며 불교와 힌두교가 함께 퍼졌다. 이름은 '스리 드바라바티'라고 새긴 은화와 동전에서 따왔다. 7세기 중엽 중국 구법승의 기록에는 이샤나푸라(첸라)와 스리크세트라(쀼) 사이에 불교 나라가 있다고 적혀 있어, 이웃한 첸라(「첸라의 성립: 바바바르만 1세와 마헨드라바르만(550~616)」(앞의 사건))와 쀼 도시국가(「쀼 도시국가의 등장: 베익타노와 할린(기원전 200~기원후 400)」(앞의 사건))와 이어져 있었음을 보여 준다. 이 도시들이 하나의 왕국이었는지, 느슨하게 얽힌 여러 족장 사회였는지는 학설이 갈리며 지금은 후자로 보는 쪽이 많다. 그 가운데 라보(롭부리)는 648년부터 이름이 보이고(「라보와 하리푼차이: 몬 왕국과 짜마테위 전승(648~1050)」(뒤의 사건)), 법륜과 사슴 조각 같은 불교 미술과 몬어 비문이 이 문화권의 표지로 꼽힌다. 도시들의 터는 4~5세기의 원(原)드바라바티 단계까지 거슬러 올라간다고 본다. 11세기부터 크메르 제국의 힘이 중부 평야로 뻗으면서 도시들은 차츰 크메르 문화권에 들어갔고, 보통 11세기 말을 드바라바티 시대의 끝으로 본다. 몬 말과 불교 전통은 북쪽의 하리푼차이로 이어졌다. 나콘빠톰에서는 석조 법륜이 여러 개 나왔고 몬어와 팔리어 글귀를 새긴 비문도 함께 나와 이 문화의 불교가 상좌부 계통이었음을 짐작하게 한다. 보통 7~9세기를 전성기로 본다."
  subjects: [dvaravati, chenla, pyu-city-states, lavo-kingdom, khmer-empire]
  tags: [culture, religion, society]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)"]

- id: sui-linyi-605
  year: 605
  title:
    ko: "수의 임읍 원정과 유방(605)"
  summary:
    ko: "임읍(뒤에 참파로 불린다)은 192년 후한의 일남군 상림현에서 구련이 일으킨 반란으로 생긴 나라로(「구련의 임읍 건국과 참파의 시작(192~280)」(앞의 사건)), 4세기 말 바드라바르만 때부터 산스크리트 비문을 새기며 인도 문화를 받아들였다. 수는 589년 중국을 다시 통일한 뒤 남쪽 끝에서도 힘을 보였다. 602년에는 교지의 후 리 남데의 항복을 받아 전 리 왕조 이래 독립기를 끝냈고(「리남데의 만춘과 전 리 왕조(544~602)」(앞의 사건)), 이 일에 공을 세운 장수 유방(劉方)이 곧 임읍으로 향했다. 『수서』는 임읍이 조공을 거르고 일남군 일대의 재물을 노린다는 이유를 든다. 605년 양제의 명을 받은 유방은 임읍군과 여러 차례 싸운 끝에 도읍(지금의 꽝남성 짜끼에우 일대로 보는 터)을 함락했다. 『수서』에는 임읍 왕 범지(梵志)가 바다로 달아났고 유방이 사당에서 선왕들을 모신 금 신주 열여덟 개를 얻어 돌아왔다고 적혀 있는데, 이 임읍 왕은 비문의 삼부바르만과 같은 인물로 본다. 유방의 군대는 돌아오는 길에 병으로 많이 죽고 유방 자신도 숨졌다고 한다. 임읍 왕은 수에 다시 조공을 이어 가며 나라를 유지했다. 수는 이 무렵 대운하 공사와 북방 원정을 함께 벌이고 있었고, 임읍 원정은 남쪽으로 보낸 가장 먼 원정이었다. 남아 있는 임읍 쪽 기록이 적어 이 서술은 대부분 『수서』에 기대고 있다. 수는 618년 무너졌고, 임읍은 뒤이은 당에도 사신을 보냈다. 『수서』는 임읍군이 코끼리를 앞세웠으나 유방이 함정을 파고 쇠뇌로 쏘아 코끼리가 돌아서면서 임읍군이 무너졌다고 전한다. 이 나라는 후한 말부터 중국 기록에 임읍이라는 이름으로 올랐다."
  subjects: [champa, sui]
  links:
    - { from: sui, to: champa, note: "유방의 원정군이 임읍의 도읍을 함락함 (605)" }
  tags: [war, diplomacy]
  sources: ["『수서』 열전 유방전·남만전 임읍", "Georges Maspero, Le royaume de Champa (G. Van Oest, 1928)", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)"]

- id: isanavarman-funan-616
  year: 616
  endYear: 637
  title:
    ko: "이샤나바르만 1세와 첸라의 부남 병합(616~637)"
  summary:
    ko: "첸라는 550년 무렵 부남의 속국으로 시작해 메콩강 중류의 북쪽 땅을 차지한 나라이며, 6세기 말 바바바르만 1세와 마헨드라바르만(치트라세나)이 부남을 압박했다(「첸라의 성립: 바바바르만 1세와 마헨드라바르만(550~616)」(앞의 사건)). 마헨드라바르만의 아들 이샤나바르만 1세는 616년 무렵 왕위에 올라 삼보르 프레이 쿡에 도읍 이샤나푸라를 세웠고, 616~617년 수에 사신을 보냈다. 목록은 그의 재위를 616~635년으로 적고, 비문 가운데는 627년에 새긴 것이 있어 이 무렵 그의 통치를 보여 준다. 이웃한 부남은 이때 이미 힘이 크게 약해져 있었다. 마지막으로 이름이 알려진 부남 왕은 루드라바르만(514~550 무렵 재위)이고 그 뒤 왕통은 기록이 흐리다. 중국 사서는 부남이 첸라에 병합되었다고 적지만 시기는 627년 앞뒤에서 649년까지로 갈리며, 여기서는 627년을 병합의 해로 본다. 부남의 핵심이던 메콩 삼각주와 옥에오 같은 항구는 이로써 첸라의 손에 들어갔다. 이샤나바르만 1세가 죽은 635년 뒤 바바바르만 2세가 639년 즉위할 때까지(재위 639~657) 네 해 안팎은 기록이 비어 있다. 이샤나푸라의 사원 터는 지금도 삼보르 프레이 쿡에 남아 있다. 같은 무렵 서쪽 평야에서는 드바라바티가 자라고 있었다(「드바라바티: 짜오프라야강 유역의 몬 도시들(600~1100)」(앞의 사건)). 6세기 중엽 이후 부남의 힘이 삼각주 쪽으로 몰리는 동안 첸라는 메콩강 중류와 톤레삽 호수 둘레의 쌀농사 평야를 쥐게 되었고, 이것이 이 병합의 바탕이었다고 본다. 삼보르 프레이 쿡에는 벽돌로 쌓은 탑 사원이 100여 기 남아 있다."
  subjects: [chenla, funan]
  links:
    - { from: chenla, to: funan, note: "부남을 병합함 (627 무렵)" }
  tags: [war, politics]
  places: [{ name: 이샤나푸라 (삼보르 프레이 쿡), at: [105.04, 12.87], year: 627 }]
  sources: ["Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia: The 7th–8th Centuries (Centre for East Asian Cultural Studies for UNESCO, 1998)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "『신당서』 진랍전", "『수서』 진랍전"]

- id: lavo-hariphunchai-648
  year: 648
  endYear: 1050
  title:
    ko: "라보와 하리푼차이: 몬 왕국과 짜마테위 전승(648~1050)"
  summary:
    ko: "라보(지금의 롭부리)는 짜오프라야강 유역 드바라바티 도시들(「드바라바티: 짜오프라야강 유역의 몬 도시들(600~1100)」(앞의 사건)) 가운데 가장 이름이 높은 곳으로, 전승은 648년 칼라바르나디샤라자가 중심을 라바푸라(롭부리)로 옮겨 세웠다고 한다. 라보의 몬 왕은 북쪽 람푼에 도시를 세울 왕비를 보냈다는 전승이 있다. 『짜마테위왕사』와 『지나깔라말리』 같은 연대기에 따르면 은자 넷이 도시를 세우고 라보 왕의 딸 짜마테위(짜마데비)를 첫 여왕으로 모셨으며, 연대기 목록은 그 재위를 662~669년으로 적는다. 이 연대기는 훨씬 뒤에 쓰였고 학계는 이 연대가 너무 이르다고 보아, 하리푼차이의 실제 시작을 750년 무렵으로 잡는다. 10~12세기나 11~12세기로 늦춰 보는 학설도 있다. 하리푼차이는 지금의 람푼을 중심으로 한 몬 왕국으로, 드바라바티 양식을 이은 탑(왓 짜마테위, 왓 프라탓 하리푼차이)을 남겼다. 라보는 10세기 중엽부터 크메르 제국의 종주권 아래 들어가 있었다는 설명이 있으며, 연대기는 하리푼차이의 아디탸라자가 1052년 라보를 병합해 동생을 왕으로 앉히고 메남 유역에서 크메르 영향을 끝냈다고 전한다(영어판 위키백과는 같은 일을 수판나품 왕자가 하리푼차이의 왕이 되어 1052년 라보를 쳤다고 적는다). 이 사건은 그 1052년 바로 앞에서 끝나며, 하리푼차이 자체는 1292년 란나에 흡수될 때까지 이어진다(「멩라이와 란나 왕국: 치앙라이에서 치앙마이로(1262~1296)」(뒤의 사건)). 라보는 12~13세기에 크메르 양식의 탑(프랑 쌈욧)이 세워질 만큼 크메르 영향이 짙었고, 북쪽 하리푼차이는 몬의 불교 전통을 더 오래 지켰다. 연대기가 전하는 짜마테위의 이야기는 몬 불교가 남쪽 라보에서 북쪽 람푼으로 전해졌다는 기억을 담고 있어, 두 도시가 같은 문화권이었다는 점은 받아들여진다."
  subjects: [lavo-kingdom, hariphunchai, dvaravati, khmer-empire]
  links:
    - { from: khmer-empire, to: lavo-kingdom, note: "라보에 종주권을 행사함 (10세기 중엽~1052 무렵)" }
  tags: [politics, culture, religion]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "『짜마테위왕사』", "『지나깔라말리』"]

- id: sunda-kingdom-669
  year: 669
  endYear: 723
  title:
    ko: "타루마나가라에서 순다 왕국으로(669~723)"
  summary:
    ko: "타루마나가라는 서부 자와에서 5세기 뿌르나와르만 때 산스크리트 비문(찌아루뜬·뚜구 비문)을 새긴 나라로(「쿠타이와 타루마나가라: 섬 동남아의 첫 산스크리트 비문(358~450)」(앞의 사건)), 보고르·자카르타·반튼 일대가 중심이었다. 이 나라의 끝과 순다 왕국의 시작을 알려 주는 자료는 대부분 17세기에 정리된 지방 문헌이어서, 이 이야기의 연대는 학계에서 신뢰성을 둘러싼 논쟁이 있다. 그 전승에 따르면 타루마나가라의 마지막 왕은 링가와르만(재위 666~669)이었고, 아들이 없어 사위 타루스바와가 669년 왕위를 이었다. 타루스바와는 도읍을 지금의 보고르 쪽 순다 사피로 옮기고 나라 이름을 순다 왕국으로 바꾸었으며, 723년까지 다스렸다고 한다. 이와 달리 영어판 위키백과 같은 서술은 순다 왕국의 성립을 932년으로 적는다. 여기서는 669년을 시작으로 보되 두 설이 있다. 타루스바와 때 동쪽에는 612년 무렵 시작했다는 갈루 왕국(지금의 찌아미스 일대)이 따로 있어 서부 자와는 둘로 나뉘어 있었다고 전한다. 갈루와 순다는 뒤에 하나의 왕통 아래 합쳐졌다고 하나, 연도는 자료마다 크게 다르다. 순다 왕국은 1579년 반튼 술탄국에 무너질 때까지 이어진다. 서부 자와는 순다 해협과 자와해를 잇는 길목이라 바다와 산지의 물산이 모였다고 본다. 이 시기 자료는 비문이 아니라 후대에 필사한 문헌이 대부분이어서, 연대와 계보는 비문이 남은 타루마나가라 때보다 훨씬 불확실하다. 서부 자와의 순다어와 순다 사람의 문화는 이 왕국에서 이어져 오늘날까지 지방의 바탕이 된다. 순다 왕국의 항구로는 반튼과 순다 클라파(지금의 자카르타 일대)가 알려져 있다."
  subjects: [tarumanagara, sunda-kingdom]
  links:
    - { from: sunda-kingdom, to: tarumanagara, note: "타루마나가라의 왕통을 이어받음 (669)" }
  tags: [politics]
  sources: ["Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "『카리타 파라히양안』"]

- id: tang-annan-679
  year: 679
  endYear: 723
  title:
    ko: "당의 안남도호부와 마이툭로안의 봉기(679~723)"
  summary:
    ko: "당은 679년 교주 도호부의 이름을 안남 도호부로 바꾸었고, 이때부터 '안남'이 지금 베트남 북부를 가리키는 이름이 되었다. 도호부의 중심은 지금의 하노이 일대(송평)였다. 그곳은 기원전 111년 한이 남월을 무너뜨린 뒤 교지군이 된 땅으로(「한 무제의 남월·민월·서남이 정복」(앞의 사건)), 당이 이어받아 군현과 도호부로 다스렸다. 722년 환주·애주(지금의 응에안·타인호아 일대) 사람 마이툭로안이 봉기해 스스로 피부색을 딴 '검은 황제'(마이 학데)라 일컬었다. 베트남 사서는 그가 참파, 진랍(이 무렵은 육진랍과 수진랍으로 갈라진 때이다) 같은 이웃과 손잡았다고 적는다. 당은 환관 출신 장수 양사욱(楊思勖)이 광둥에서 십만 명 가까운 군사를 이끌고 갑작스럽게 쳐서 723년 봉기를 눌렀다. 마이툭로안은 723년 9월 숨졌고 중국군은 봉기군의 시신을 쌓은 언덕을 경고로 남겼다고 전한다. 당의 안남 지배는 이후 8세기 후반 풍흥 같은 토착 지도자의 반란과 9세기 중엽 남조의 침공(「남조의 성장: 피라각의 통일에서 정매사의 찬탈까지(738~902)」(뒤의 사건))을 거치며 흔들렸고, 906년 쿡씨 가문이 절도사 자리를 잇는 자치기로 넘어간다(「쿡씨의 정해군 자치(906~937)」(뒤의 사건)). 중국·베트남 사서의 날짜는 음력이다. 안남 도호부 아래에는 여러 주가 있었고 토착 수령들이 당의 관직을 받아 고을을 다스렸다. 중국 쪽 관리와 토착 수령이 함께 있는 이 이중 구조가 뒤에 독립 정권이 나타나는 바탕이 되었다는 설명이 있다. 도호부 관내에는 중국 사람과 토착 사람, 참파 사람이 섞여 살았고 광저우에서 오는 바닷길의 첫 기항지라 상업도 활발했다."
  subjects: [tang, champa, land-chenla, water-chenla]
  tags: [politics, war]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『신당서』 지리지·양사욱전", "『대월사기전서』 외기"]

- id: srivijaya-682
  year: 682
  endYear: 695
  title:
    ko: "스리비자야의 성립과 팔렘방(682~695)"
  summary:
    ko: "당의 승려 의정(義淨)은 671년 광저우에서 배를 타고 스리비자야(室利佛逝)에 들러 여섯 달 동안 산스크리트를 익힌 뒤 인도로 갔고, 687년 돌아오는 길에 다시 이곳에 머물러 695년까지 불전을 번역했다(「당의 불교: 화엄·선·정토·밀교, 의정의 구법(650~845)」(앞의 사건)). 스리비자야의 성립을 알리는 가장 이른 사료는 팔렘방 부근에서 나온 크두칸 부킷 비문으로, 사카력 605년(683년, 일부 읽기는 682년)에 다풍타 히양이 군사 2만여 명을 이끌고 승리를 위한 항해를 떠났다고 옛 말레이어로 새겼다. 684년의 탈랑 투오 비문은 그가 공원을 만들어 백성에게 베푼다고 적었고, 686년의 코타 카푸르 비문(방카섬)은 맹세를 어기는 자에게 저주를 내리며 자와를 치려는 뜻을 밝혔다. 이 비문들은 스리비자야가 말레이어를 쓰는 항구 세력으로 팔렘방과 방카를 쥔 모습을 보여 준다. 이후 685년 무렵 크다(말레이 반도 서북부)를, 692년 무렵 잠비와 람풍을 아울렀다고 본다. 잠비의 말라유 왕국은 의정이 671년에는 따로 있는 나라로 보았다가 뒤에 스리비자야에 속한다고 적었다. 위치를 팔렘방으로 보는 설이 가장 널리 받아들여지나 캄파르강 유역이나 코메링강 상류로 보는 연구도 있고, 비문의 연대와 해석은 아직 다듬어지는 중이다. 스리비자야의 이름은 산스크리트로 '빛나는 승리'를 뜻한다. 팔렘방은 무시강 어귀에서 가까운 항구여서 말라카 해협과 순다 해협을 오가는 배를 상대로 세력을 키울 수 있었다고 본다. 의정은 이곳에서 천 명이 넘는 승려가 불교를 공부한다고 적었다. 비문은 모두 옛 말레이어로 쓰였고 인도 남부 팔라바 계통의 글자를 본뜬 서체를 썼다."
  subjects: [srivijaya, tang]
  tags: [politics, religion, culture]
  places: [{ name: 크두칸 부킷 비문 (팔렘방), at: [104.76, -2.98], year: 682 }]
  sources: ["O. W. Wolters, Early Indonesian Commerce: A Study of the Origins of Srivijaya (Cornell University Press, 1967)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "「크두칸 부킷 비문」", "「코타 카푸르 비문」", "의정(義淨), 『남해기귀내법전』"]

- id: chenla-split-706
  year: 706
  endYear: 790
  title:
    ko: "첸라의 분열: 육진랍과 수진랍(706~790)"
  summary:
    ko: "첸라는 이샤나바르만 1세 뒤 바바바르만 2세(재위 639~657)와 자야바르만 1세(재위 657~681 무렵)가 이어 다스렸고, 자야바르만 1세가 죽은 뒤 어지러워졌다. 목록에는 그의 딸로 전하는 여왕 자야데비(681 무렵~713)가 뒤를 이었다고 나온다. 『신당서』는 '신룡 연간(705~707) 이후' 진랍이 둘로 갈라졌다고 적는다. 북쪽은 산이 많아 '육진랍', 남쪽은 바다와 호수가 가까워 '수진랍'이라 부르며, 이 해를 706년 무렵으로 본다. 육진랍은 지금의 라오스 남부와 캄보디아 북부, 수진랍은 메콩 삼각주와 남부 캄보디아에 걸쳤다고 본다. 이 분열을 중국이 한 나라처럼 전하던 진랍이 사실은 여러 세력의 느슨한 연합이었음을 보여 주는 대목으로 읽는 연구자가 많다. 8세기에는 여러 소국이 갈려 나가 푸슈카락샤(713~730 무렵)와 삼부바르만(730~760 무렵) 같은 이름이 수진랍 쪽 목록에 오르나, 목록 연대는 근사다. 774년과 787년에는 자와 또는 '쿤룬'의 배들이 참파 남부를 쳤다(「환왕: 남쪽 왕가의 참파와 자와의 습격(758~875)」(뒤의 사건)). 수진랍도 790년 자와 세력에 눌렸다는 서술이 있으나 사료가 부족하다. 802년 자야바르만 2세가 두 첸라를 하나로 합쳐 크메르 제국을 세우면서 이 분열기는 끝난다(「자야바르만 2세와 크메르 제국의 시작(802~850)」(뒤의 사건)). 두 나라의 중심 고장은 달랐지만 같은 크메르어를 쓰고 비슷한 신앙을 따랐고, 분열기에도 시바와 비슈누를 모시는 사원을 이어 지었다. 분열기의 비문은 지방 군주들이 저마다 사원에 땅을 바치는 형식으로 권위를 보였음을 보여 준다."
  subjects: [chenla, land-chenla, water-chenla, champa]
  tags: [politics]
  sources: ["Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia: The 7th–8th Centuries (Centre for East Asian Cultural Studies for UNESCO, 1998)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "『신당서』 진랍전"]

- id: sanjaya-mataram-732
  year: 732
  endYear: 760
  title:
    ko: "산자야와 마타람 왕국의 성립(732~760)"
  summary:
    ko: "자와 중부에서 가장 이른 기록은 허링(訶陵, 칼링가)이라는 나라를 전한다. 당의 사서 『신당서』는 허링이 640년 무렵부터 사신을 보낸다고 적고, 의정은 664년 승려 회녕(會寧)이 허링에 세 해 머물며 불전을 번역했다고 기록했으며, 674년에는 '시마'라는 여왕이 엄하게 법을 지켜 이름이 높았다고 전한다. 허링의 도읍은 페칼롱안과 제파라 사이 어디쯤으로 추정할 뿐 정확히 알 수 없다. 732년의 캉갈 비문(사카력 654년)은 산스크리트로 쓴 것으로, 산자야 왕이 시바 링가를 세운 일과 전임 왕 산나가 죽은 뒤 혼란을 산자야가 바로잡았다고 새겨, 마타람 왕국의 성립을 알리는 가장 이른 사료다. 산자야의 재위는 716~746년으로 적는 자료도 있다. 후대 문헌 『카리타 파라히양안』은 그를 시마 여왕의 증손으로 적지만 이 계보는 출처가 분명하지 않다. 산자야 뒤 파낭카란(재위를 746~784년으로 적는 목록과 760~780년으로 적는 서술이 갈린다)이 즉위하면서 비문에 샤일렌드라 가문이 나타나고, 불교와 힌두교가 한 땅에 함께 자리 잡는다(「샤일렌드라 왕조와 보로부두르(760~856)」(뒤의 사건)). 742~755년 사이 중심이 디엥 고원에서 동쪽 평야로 옮겨 갔다는 서술도 있으나 연대는 확실하지 않다. 캉갈 비문은 자와를 쌀과 금이 많은 섬으로 칭송하고 산스크리트 시를 쓰는 궁정 문화가 이미 자리 잡았음을 보여 준다. 허링과 마타람 사이의 이어짐은 학계에서 아직 논쟁 중이다. 비문의 연대 732년은 사카력 654년을 율리우스력으로 옮긴 값이다. 산자야 이전의 계보는 후대 문헌에 기대고 있어, 산자야가 새 왕통을 연 것인지 기존 왕통을 이은 것인지도 논쟁 중이다."
  subjects: [mataram-kingdom, tang]
  tags: [politics, religion]
  places: [{ name: 캉갈 비문 (구눙 우키르), at: [110.2968, -7.6343], year: 732 }]
  sources: ["Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "「캉갈 비문」", "『신당서』 가릉전"]

- id: huanwang-champa-758
  year: 758
  endYear: 875
  title:
    ko: "환왕: 남쪽 왕가의 참파와 자와의 습격(758~875)"
  summary:
    ko: "8세기 중엽 당의 사서는 이 나라를 '임읍' 대신 '환왕(環王)'이라 적기 시작하며 그 시기를 758년 무렵으로 본다. 참파는 8세기 중반 힘의 중심이 북쪽(지금의 꽝남)에서 남쪽 카우타라(냐짱)와 판두랑가(판랑) 쪽으로 옮겨 갔고, 이때부터 푸옌·카인호아·닌투언·빈투언 일대가 참파의 새 중심이 된다. 이 남쪽 왕가 시기 참파는 바다에서 큰 습격을 두 번 겪었다. 774년 자와 또는 '쿤룬'으로 불린 바다 사람들의 배가 냐짱의 포나가르 사원을 약탈했고, 787년 판랑 일대의 사원이 불탔다. 포나가르 비문은 왕이 사원을 다시 세워 링가를 안치했다고 새겼다. 이후 인드라바르만 1세가 799년 이 침입자들을 막아 냈다고 전한다. 이 시기 왕들의 재위 연대는 비문과 목록이 갈려 근사로만 알려져 있다. 722년 마이툭로안의 봉기 때 참파는 봉기군 편에 섰다는 서술이 있다(「당의 안남도호부와 마이툭로안의 봉기(679~723)」(앞의 사건)). 875년 인드라바르만 2세가 북쪽 꽝남에 인드라푸라를 세우면서 중심이 다시 북으로 올라가고 중국 쪽 이름도 '점성(占城)'으로 바뀐다(「인드라푸라 왕조와 동즈엉 불교 사원(875~982)」(뒤의 사건)). 바다의 습격이 자와의 어느 세력이었는지는 확정되지 않았다. 참파의 남쪽 땅은 바다에 면한 건조한 해안이어서 항구와 교역에 기대는 정도가 북쪽보다 컸다. 포나가르 사원은 여신 포 이누 나가르를 모셨으며 지금도 참족과 베트남 사람이 찾는 곳으로 남아 있다. 참파는 북쪽의 인드라푸라·아마라바티, 중부의 비자야, 남쪽의 카우타라·판두랑가 같은 지방으로 나뉘어 각기 다른 가문을 기반으로 했다고 보는 연구가 많다."
  subjects: [champa, tang]
  tags: [war, politics]
  places: [{ name: 포나가르 사원 (냐짱), at: [109.19, 12.26], year: 774 }]
  sources: ["Georges Maspero, Le royaume de Champa (G. Van Oest, 1928)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "『신당서』 환왕전", "「포나가르 비문」"]

- id: sailendra-borobudur-760
  year: 760
  endYear: 856
  title:
    ko: "샤일렌드라 왕조와 보로부두르(760~856)"
  summary:
    ko: "샤일렌드라('산의 왕')는 8세기 중반 마타람 왕국의 중심 지역인 자와 중부 케두 평야에서 대승불교를 후원한 왕가로, 778년의 칼라산 비문이 이 가문 이름을 새긴 가장 이른 사료다. 칼라산 비문은 파낭카란 왕이 타라 여신을 모신 사원을 세웠다고 적었고, 792년의 만주스리그리하(세우) 비문은 그 사원 단지의 완성을 알린다. 목록은 780년부터 800년까지 다라닌드라, 800~819년 사마라그라위라, 819~838년 사마라퉁가를 샤일렌드라 왕으로 두고, 사마라퉁가 때인 825년 무렵 보로부두르가 완성되었다고 본다. 보로부두르는 층층이 쌓은 석조 만다라를 이루는 불교 유적이다. 샤일렌드라가 산자야 왕가(「산자야와 마타람 왕국의 성립(732~760)」(앞의 사건))와 같은 왕가인지 다른 가문인지는 학설이 갈린다. 사마라퉁가의 딸 프라모다와르다니는 산자야 계통의 라카이 피카탄과 혼인했고, 피카탄의 856년 시바그리하 비문은 시바 사원(프람바난으로 보는 설)을 다룬다. 사마라퉁가 가문의 왕자 발라푸트라가 피카탄에게 패해 스리비자야로 달아나 그곳의 왕이 되었다는 서술이 있으나 그 해를 852년, 856년으로 적는 자료가 갈린다. 860년 무렵 날란다 비문은 발라푸트라데와를 '수바르나드비파(수마트라)의 왕'으로 새겼다. 샤일렌드라와 스리비자야의 관계, 혼인 동맹과 지배의 순서는 아직 정리되지 않았다. 이 시기 케두 평야에는 보로부두르 말고도 멘둣과 세우 같은 불교 사원이 세워졌고, 같은 평야 동쪽에는 프람바난의 힌두 사원 단지가 들어섰다. 칼라산 비문은 왕이 마을을 승가에 바친 일을 새겼다. 보로부두르는 뒤에 화산재와 숲에 덮였다가 1814년 래플스 총독 아래 조사에서 다시 알려졌다."
  subjects: [mataram-kingdom, srivijaya]
  tags: [religion, culture, politics]
  places: [{ name: 보로부두르, at: [110.2038, -7.6079], year: 825 }]
  sources: ["Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "John N. Miksic, Borobudur: Golden Tales of the Buddhas (Periplus Editions, 1990)", "「칼라산 비문」", "「날란다 비문」"]

- id: jayavarman-ii-802
  year: 802
  endYear: 850
  title:
    ko: "자야바르만 2세와 크메르 제국의 시작(802~850)"
  summary:
    ko: "크메르 제국의 시작은 802년 자야바르만 2세가 프놈 쿨렌에서 스스로를 온 세상의 왕(차크라바르틴)으로 선포한 일로 잡는다. 이 사실을 전하는 사료는 1052년 스독 콕 톰 비문으로, 250여 년 뒤의 기록이라는 점을 감안해야 한다. 비문에 따르면 자야바르만 2세는 '자와'에서 돌아와 왕이 되었다고 하는데, 이 자와가 섬 자와인지 참파를 가리키는지는 학설이 갈린다. 그는 한 곳에 머무르지 않고 인드라푸라, 하리하랄라야(지금의 롤루오스), 마헨드라파르바타(프놈 쿨렌), 아마렌드라푸라를 옮겨 다니며 여러 첸라 세력을 하나로 묶었다. 이 합침으로 육진랍과 수진랍(「첸라의 분열: 육진랍과 수진랍(706~790)」(앞의 사건))은 사라졌다. 왕과 신을 이어 주는 의례(데바라자)를 브라만이 맡게 한 것도 이 시기로 전한다. 850년 하리하랄라야에서 숨져 '파라메슈바라'라는 이름으로 모셔졌고, 아들 자야바르만 3세(재위 850~877)가 이었다. 이 제국은 1431년 앙코르가 함락될 때까지 6세기 가까이 이어진다(「앙코르의 함락과 크메르 도읍의 남쪽 이동(1431~1434)」(뒤의 사건)). 802년 이 선포가 실제로 한 나라의 통일을 뜻했는지, 연대기가 뒤에 덧붙인 시작점인지는 아직 논의 중이다. 이 시기 크메르어 비문에는 왕과 귀족이 사원에 땅과 사람을 바친 기록이 많아 초기 앙코르 사회를 살피는 기본 자료가 된다. 다만 연대는 대부분 후대에 정리되어 802년이라는 해도 근사값으로 쓴다. 롤루오스(하리하랄라야)에는 뒤에 인드라바르만 1세가 프레아 코와 바콩을 세웠다(「야소바르만 1세와 야소다라푸라(889~944)」(뒤의 사건))."
  subjects: [khmer-empire, land-chenla, water-chenla]
  links:
    - { from: khmer-empire, to: land-chenla, note: "육진랍을 하나로 합침 (802)" }
    - { from: khmer-empire, to: water-chenla, note: "수진랍을 하나로 합침 (802)" }
  tags: [politics, religion]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "「스독 콕 톰 비문」"]

- id: indrapura-champa-875
  year: 875
  endYear: 982
  title:
    ko: "인드라푸라 왕조와 동즈엉 불교 사원(875~982)"
  summary:
    ko: "875년 인드라바르만 2세는 북쪽 꽝남에 새 도읍 인드라푸라를 세우고 동즈엉에 대승불교 사원을 짓고 비문을 새겼다. 비문은 이 사원이 로케슈바라를 모신 수도원이라고 적는다. 그동안 남쪽에 있던 중심(「환왕: 남쪽 왕가의 참파와 자와의 습격(758~875)」(앞의 사건))이 다시 북으로 올라온 셈이고, 중국 쪽 이름도 이 무렵 '환왕'에서 '점성(占城)'으로 바뀐다. 인드라푸라 왕조는 10세기 말까지 이어졌는데, 목록은 이 사이에 자야 심하바르만 1세(898~903), 삭티바르만(904~905), 바드라바르만 3세(905~917)를 두며 재위 연대는 자료마다 근사로 갈린다. 인드라바르만 3세(918~959 무렵)는 냐짱의 포나가르 탑을 새로 짓게 한 왕으로 전한다. 그의 재위 중 950년 무렵 크메르의 라젠드라바르만 2세가 카우타라(냐짱)를 쳐서 포나가르의 금 신상을 가져갔다고 비문이 전한다(「라젠드라바르만 2세와 코랏 고원의 크메르(944~968)」(뒤의 사건)). 인드라바르만 3세의 뒤를 자야 인드라바르만 1세(재위 959~965)가 이었고, 그 뒤가 파라메슈바라바르만 1세(재위 965~982, 968년 또는 972년 즉위로 적는 서술도 있다)이다. 북쪽 교지에서는 독립한 대월이 힘을 키웠고, 982년 전 레 왕조의 레호안이 참파를 쳐서 인드라푸라를 약탈하고 이 왕을 죽였다(「전 레 왕조와 송의 침공(980~1005)」(뒤의 사건)). 뒤이은 인드라바르만 4세(재위 982~986)는 남쪽으로 물러났다. 983년 대월 출신 류계종이 북쪽 땅을 차지했고, 989년 하리바르만 2세가 즉위해 그를 몰아냈다고 한다. 이런 일을 거치며 참파의 힘은 차츰 남쪽 비자야(지금의 빈딘) 쪽으로 기울었다고 본다. 동즈엉의 건물은 오래 전에 사라졌지만 터의 조각들은 참파 조각의 한 양식('동즈엉 양식')으로 불린다. 참파는 10세기에도 송에 조공을 이어 갔다. 인드라푸라와 가까운 미선 성지에서는 같은 시기에도 힌두 사원들이 계속 보수되었다. 이 왕조 때의 비문은 산스크리트와 옛 참어로 함께 새겨졌다."
  subjects: [champa, early-le-dynasty, khmer-empire]
  links:
    - { from: early-le-dynasty, to: champa, note: "참파를 쳐서 인드라푸라를 약탈하고 왕을 죽임 (982)" }
    - { from: khmer-empire, to: champa, note: "카우타라의 포나가르를 약탈함 (950 무렵)" }
  tags: [religion, culture, war]
  sources: ["Georges Maspero, Le royaume de Champa (G. Van Oest, 1928)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)"]

- id: yasovarman-angkor-889
  year: 889
  endYear: 944
  title:
    ko: "야소바르만 1세와 야소다라푸라(889~944)"
  summary:
    ko: "자야바르만 2세 뒤 크메르 왕위는 자야바르만 3세(850~877)와 인드라바르만 1세(877~889)로 이어졌다. 인드라바르만 1세는 롤루오스에서 프레아 코(879)와 바콩(881)을 세우고 저수지(인드라타타카)를 만들어 물을 다스렸다. 889년 즉위한 야소바르만 1세(재위 889~910)는 도읍을 앙코르 안 프놈 바켕 언덕을 중심으로 한 야소다라푸라로 옮기고 동바라이라는 큰 저수지를 팠다. 그의 이름을 딴 도시는 이후 몇 세기 크메르 도읍의 터가 되었다. 비문들은 그가 여러 곳에 수도원(아슈라마)을 세워 브라만과 스승을 지원했다고 전한다. 그의 두 아들이 하르샤바르만 1세(910~923)와 이샤나바르만 2세(923~928)로 이어 앉았다. 그 뒤 자야바르만 4세(928~941)가 코께르(릉가푸라)에 도읍을 세웠다. 코께르 천도를 921년으로 적는 연구와 즉위를 928년으로 적는 목록이 갈린다. 그의 아들 하르샤바르만 2세(941~944)까지 코께르가 도읍이었다. 944년 라젠드라바르만 2세가 야소다라푸라로 돌아오면서 이 시기는 끝난다(「라젠드라바르만 2세와 코랏 고원의 크메르(944~968)」(뒤의 사건)). 이 시기 크메르는 물을 모아 쌀농사를 늘리는 큰 저수지와 수로에 힘을 쏟았고, 이것이 앙코르 도시의 바탕이 되었다. 야소바르만 1세의 비문은 산스크리트와 크메르어로 같은 글을 나란히 새긴 경우가 많고 북인도에서 온 문자를 본뜬 서체를 쓰기도 해, 이 시기 궁정이 문학에 열심이었음을 보여 준다. 동바라이는 길이 7km가 넘는 큰 저수지로 앙코르 동쪽에 지금도 터가 남았다. 야소바르만 1세는 수도원마다 학자와 브라만이 지킬 규칙을 비문에 새기게 했다고 전한다."
  subjects: [khmer-empire]
  tags: [politics, culture, economy]
  places: [{ name: 프놈 바켕 (야소다라푸라), at: [103.8584, 13.4333], year: 889 }]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael D. Coe, Angkor and the Khmer Civilization (Thames & Hudson, 2003)"]

- id: khuc-autonomy-906
  year: 906
  endYear: 937
  title:
    ko: "쿡씨의 정해군 자치(906~937)"
  summary:
    ko: "당 말에 혼란이 퍼진 가운데 905년 토착 호족 쿡트어주가 교지의 중심 다이라성(대라성)을 차지했고, 당은 이듬해인 906년 그에게 정해군 절도사 직함을 주어 현실을 받아들였다. 쿡트어주는 907년 숨졌다. 쿡하오(재위 907~917)가 아버지의 뒤를 이어 지방 제도를 개혁했다. 쿡하오 뒤 쿡트어미(재위 917~930)는 신흥 남한을 인정하지 않고 후량의 직함을 받아 두었다(「주전충의 후량 건국과 번진의 분립(904~913)」(앞의 사건), 「유은·유엄의 남한 건국(905~938)」(앞의 사건)). 이 직함들은 독립 선언이 아닌 '명목상 절도사'로 읽는다. 930년 남한이 군대를 보내 교지를 점령하고 쿡트어미를 사로잡았다. 남한은 이 땅에 직접 다스리는 자를 두려 했으나 931년 쿡씨의 옛 장수 즈엉딘응에가 남한의 관리를 몰아내고 스스로 절도사를 일컬었다. 즈엉딘응에는 937년 부하 끼에우꽁띠엔에게 살해되었고, 끼에우꽁띠엔은 남한에 도움을 청했다. 이 요청이 938년 박당강 전투로 이어진다(「박당강 전투와 응오 왕조(938~944)」(뒤의 사건)). 중국 사서와 베트남 사서의 날짜는 음력이다. 쿡씨 세 대는 독립 왕조라기보다 중국 왕조의 직함 아래 있으면서 실제로는 스스로 다스린 정권이다. 당의 절도사는 군정과 민정을 함께 맡아 중국 안에서도 사실상 독립적인 지방 정권이 많았다. 쿡씨는 이 제도를 이용해, 직함으로는 중국에 속하면서 실제로는 스스로 다스린 첫 베트남 정권으로 읽힌다. 쿡하오는 지방을 로·푸·쩌우·쟙·싸의 단계로 나누어 관리를 두고 호구를 새로 조사했으며 세금을 고르게 매겼다고 『대월사기전서』는 전한다. 쿡씨의 근거지는 지금의 하이즈엉 일대 홍주로 전한다. 쿡씨 세 대 모두 직함을 받는 절차로 중국 조정과의 연결을 유지했다."
  subjects: [khuc-clan, tang, southern-han, later-liang]
  links:
    - { from: southern-han, to: khuc-clan, note: "교지를 점령하고 쿡트어미를 사로잡음 (930~931)" }
  tags: [politics, war]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『대월사기전서』 외기", "『자치통감』"]

- id: mpu-sindok-929
  year: 929
  endYear: 1016
  title:
    ko: "음푸 신독의 동부 자와 천도와 이샤나 왕가(929~1016)"
  summary:
    ko: "마타람 왕국의 중심은 8~9세기 자와 중부 케두·프람바난 평야에 있었으나(「샤일렌드라 왕조와 보로부두르(760~856)」(앞의 사건)), 929년 무렵 음푸 신독이 도읍을 동부 자와로 옮겼다. 앞서 와와(924~929)가 이미 동쪽으로 옮겨 간 흔적이 있고, 신독이 이를 굳혔다. 신독은 929년부터 947년까지 다스리며(944년 무렵으로 적는 목록도 있다) '이샤나' 왕가를 열었다. 천도의 까닭으로는 므라피 화산의 분화, 스리비자야와의 다툼, 동부 브란타스강 유역의 쌀과 무역에 대한 이끌림 같은 설명이 있으나 정설은 없다. 신독 뒤 신독의 딸 이샤나퉁가위자야와 사위 로카팔라, 그 아들 마쿠타방사와르다나를 거쳐 다르마왕사 테구(990년대~1016)에 이른다고 전하며 재위 연대는 근사이다. 다르마왕사는 『마하바라타』의 고대 자와어 번역을 후원했고, 990년 무렵 스리비자야를 공격했고 992년 송에 사신을 보낸 스리비자야가 자와의 공격을 호소했다고 전한다. 1016년(1017년으로 적는 자료도 있다) 와라와리의 침입으로 다르마왕사가 죽고 왕궁이 무너졌다. 이 일을 '프랄라야(파괴)'라 부른다(「아이를랑가와 케디리 왕국(1016~1049)」(뒤의 사건)). 동부 자와는 이후 케디리와 싱하사리를 거쳐 마자파힛으로 이어지는 중심이 된다. 신독 때부터 동부 자와의 비문은 고대 자와어를 쓰는 비중이 커진다. 브란타스강으로 바다와 이어지는 동부 자와의 쌀 평야는 뒤에 케디리·싱하사리·마자파힛의 터전이 되었다. '음푸'는 학자와 장인을 부르는 자와의 존칭으로, 신독 이후 시인과 승려의 이름 앞에 널리 붙었다. 신독이 세운 비문은 대부분 마을에 면세 땅을 내리고 저수지를 관리하게 한 일을 적었다."
  subjects: [mataram-kingdom, srivijaya]
  tags: [politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)"]

- id: bach-dang-938
  year: 938
  endYear: 944
  title:
    ko: "박당강 전투와 응오 왕조(938~944)"
  summary:
    ko: "930~931년 남한이 쿡씨를 무너뜨린 뒤 즈엉딘응에가 교지를 되찾았으나(「쿡씨의 정해군 자치(906~937)」(앞의 사건)), 937년 부하 끼에우꽁띠엔에게 살해되었다. 사위이자 장수인 응오꾸옌은 군대를 일으켜 끼에우꽁띠엔을 쳤고, 끼에우꽁띠엔은 남한에 도움을 청했다. 남한의 유엄(劉龑)은 아들 유홍조(劉弘操)를 보내 수군을 이끌게 했다. 응오꾸옌은 938년 말 박당강 어귀에 쇠를 씌운 말뚝을 강바닥에 박아 두고 밀물에 가려진 말뚝 위로 남한 배를 끌어들인 뒤 썰물 때 공격하는 계략으로 승리했다. 유홍조는 이 전투에서 죽고 남한군은 절반이 죽었다고 전해지며, 유엄은 광저우로 물러났다. 응오꾸옌은 939년 봄 왕을 일컫고 고대의 도읍 꼬로아에 도읍을 정했다. 중국 쪽에서는 이 해를 교지의 사실상 독립으로 본다. 전투 날짜는 음력이다. 응오꾸옌은 944년 숨졌고 처남 즈엉땀꺼(즈엉딘응에의 아들)가 어린 후계자 대신 944년 왕위를 빼앗아 950년까지 다스렸다. 응오꾸옌의 아들 응오쑤엉응압과 응오쑤엉반이 즈엉땀꺼를 몰아내, 응오쑤엉반은 950년부터 965년까지, 응오쑤엉응압은 951~954년 함께 다스렸다. 같은 방법의 말뚝 계략이 1288년 박당강에서 몽골의 수군을 상대로 되풀이되었다(「몽골·원의 대월 침입과 쩐 흥 다오(1257~1288)」(뒤의 사건)). 응오꾸옌의 이 승리는 이후 베트남 사서가 첫 독립 왕조의 출발로 삼는 사건이다. 전투의 기록은 『대월사기전서』와 『자치통감』이 조금씩 달라, 중국 쪽은 유홍조가 죽었다고만 적고 베트남 사서는 군사의 절반이 죽었다고 적는다. 박당강은 지금의 꽝닌과 하이퐁 사이 해안으로 흐르는 강으로 본다."
  subjects: [khuc-clan, ngo-dynasty, southern-han]
  links:
    - { from: ngo-dynasty, to: southern-han, note: "박당강에서 남한의 수군을 무찌름 (938)" }
  tags: [war, politics]
  places: [{ name: 박당강 전투, at: [106.8, 20.95], year: 938 }]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『대월사기전서』 외기", "『자치통감』"]

- id: rajendravarman-944
  year: 944
  endYear: 968
  title:
    ko: "라젠드라바르만 2세와 코랏 고원의 크메르(944~968)"
  summary:
    ko: "944년 라젠드라바르만 2세는 코께르에서 도읍을 야소다라푸라로 되돌렸다(「야소바르만 1세와 야소다라푸라(889~944)」(앞의 사건)). 하르샤바르만 2세(941~944)를 이은 그의 재위는 944년부터 968년까지로 전한다. 이 시기의 비문과 사원은 지금의 앙코르 일대뿐 아니라 코랏 고원 남쪽 가장자리(피마이와 파놈룽 일대)에서도 이어져, 크메르의 지배가 앙코르에서 고원 남부로 넓어진 때로 본다. 사원 가운데 앞선 동메본(952)과 프레룹(961)은 그의 시기에 지었다. 반띠아이 스레이(967)는 왕의 스승이던 야즈냐바라하가 세운 사원이고, 사원 이름은 '여인의 성채'라는 뜻이다. 950년 무렵에는 군대를 보내 참파의 카우타라(냐짱)를 쳐 포나가르의 금 신상을 가져왔다고 참파 비문이 전한다(「인드라푸라 왕조와 동즈엉 불교 사원(875~982)」(앞의 사건)). 라젠드라바르만은 968년 숨졌고 아들 자야바르만 5세(재위 968~1001)가 어린 나이에 즉위했다. 목록의 이름과 재위가 자료마다 한두 해씩 갈린다. 사원 건축과 비문의 연대를 바탕으로 한 서술이어서 정확한 영토 경계는 알기 어렵다. 이 무렵부터 비문의 산스크리트 시문이 길어져 왕의 업적과 신하의 공을 자세히 적는다. 동메본 사원은 동바라이 한가운데 섬에 세워졌고, 프레룹은 왕의 화장터로 쓰였다는 설이 있다. 앙코르의 큰 저수지 체계도 이 시기에 크게 늘었다. 이 시기에는 힌두 신 시바와 비슈누 숭배에 더해 불교 승려도 비문에 이름을 올려, 왕실의 후원이 한쪽으로 쏠리지 않았다. 비문은 크메르어와 산스크리트가 섞여 있다. 이 왕의 기록은 비문에 의존하며 사원 이름은 뒤 시대에 붙은 것이 많다."
  subjects: [khmer-empire, champa]
  links:
    - { from: khmer-empire, to: champa, note: "카우타라의 포나가르를 약탈함 (950 무렵)" }
  tags: [politics, culture, war]
  places: [{ name: 프레룹, at: [103.9, 13.4], year: 961 }]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael D. Coe, Angkor and the Khmer Civilization (Thames & Hudson, 2003)"]

- id: dinh-bo-linh-965
  year: 965
  endYear: 979
  title:
    ko: "십이사군과 딘 왕조의 통일(965~979)"
  summary:
    ko: "응오 왕조는 965년 응오쑤엉반이 전투에서 죽은 뒤 무너졌고, 지방 호족 열두 명이 각자 땅을 차지해 싸우는 시기(십이사군)로 들어갔다(「박당강 전투와 응오 왕조(938~944)」(앞의 사건)). 호아르(화려, 지금의 닌빈) 출신 딘보린은 아들 딘리엔과 함께 사군들을 하나씩 굴복시켜 968년 스스로 황제(대승명황제)가 되어 나라 이름을 대구월(다이꼬비엣)이라 했고, 호아르에 도읍했다. 970년에는 태평이라는 독자 연호를 쓰기 시작했다. 중국에서는 960년 건국한 송이 972~973년 무렵 교지군왕 칭호를 내려 이 정권을 인정했다(위키백과는 딘보린에게, 사서는 아들 딘리엔 책봉으로 전한다). 딘 왕조는 송이 준 직함과 스스로 정한 황제 칭호를 함께 썼다. 979년 환관 도티크가 딘보린과 딘리엔을 죽였고, 어린 딘또안(재위 979~980)이 즉위했다. 도티크는 곧 처형되었다. 군을 맡은 레호안이 섭정이 되었고, 송의 위협이 겹친 가운데 왕위가 그에게 넘어간다(「전 레 왕조와 송의 침공(980~1005)」(뒤의 사건)). 사군을 굴복시킨 시기는 968년 앞뒤 서너 해에 걸친다고 보며, 베트남 사서의 연대는 자료마다 한두 해 어긋난다. 중국·베트남 사서의 날짜는 음력이다. 호아르에는 지금도 딘 왕조와 전 레 왕조가 불경 구절을 새겨 세운 돌기둥이 남아 있다. 딘보린은 군을 열 개의 도로 나누어 편성했고, 이것이 뒤에 레호안이 이끈 십도군의 바탕이 된다. 딘 왕조는 송 건국(960년) 직후 베트남 북부에 선 첫 중앙 정권이어서 송도 책봉의 형식으로 이를 받아들였다. 딘보린이 관제와 궁궐을 갖췄다는 기록은 후대 사서에 기대고 있다. 호아르는 지금의 닌빈성에 있어 홍강 평야 남쪽 끝의 산악 요지로 꼽힌다."
  subjects: [ngo-dynasty, dinh-dynasty, song]
  tags: [politics, war]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『대월사기전서』 외기", "『송사』 교지전"]

- id: le-hoan-980
  year: 980
  endYear: 1005
  title:
    ko: "전 레 왕조와 송의 침공(980~1005)"
  summary:
    ko: "딘 왕조의 딘보린이 979년 죽자 십도군을 이끌던 레호안은 어린 딘또안을 대신해 섭정이 되었고, 이듬해 980년 딘또안의 어머니 즈엉번응아의 지지를 얻어 즉위했다(「십이사군과 딘 왕조의 통일(965~979)」(앞의 사건)). 레호안의 즉위 해를 980년 또는 981년으로 적는 자료가 갈린다. 송은 이 틈을 노려 981년 후인보(侯仁寶)와 손전흥을 보내 침공했으나 박당강과 찌랑에서 대월에 패하고 후인보가 죽었다. 레호안은 982년 참파를 쳐서 도읍 인드라푸라를 약탈하고 파라메슈바라바르만 1세를 죽였다(「인드라푸라 왕조와 동즈엉 불교 사원(875~982)」(앞의 사건)). 송과의 관계는 곧 풀려 1004년 아들을 송 조정에 보냈다. 레호안은 영토를 넓히고 학교를 세우며 반란을 눌렀다고 하는데, 이 시기 제도를 다룬 사료가 적다. 1005년 레호안이 죽자 아들들의 왕위 다툼이 일어났다. 레롱비엣(레쭝똥)은 사흘 만에 동생에게 죽었고, 레롱딘이 1005년부터 1009년까지 다스리다가 병으로 누운 채로 정사를 돌봐 '와조(臥朝)'라 불렸다. 그가 죽자 궁중 호위를 맡던 리꽁우언이 추대되어 리 왕조가 열렸다(「리 왕조의 성립과 탕롱 천도(1009~1028)」(뒤의 사건)). 중국·베트남 사서의 날짜는 음력이다. 송은 981년의 패전 뒤 협상을 거쳐 레호안을 교지군왕에 책봉하는 형식으로 관계를 정리했다. 전 레 왕조의 도읍도 호아르에 있었다. 레호안은 승려 법순(法順)을 외교 고문으로 두었고, 송 사신을 맞는 자리에서 법순이 시로 응대했다고 전한다. 레호안은 즉위 뒤 정치를 안정시키려 군을 직접 이끌고 남북으로 원정했고, 대월의 영토는 이 시기 남쪽으로 더 넓어졌다고 전한다. 다만 그 범위는 분명하지 않다."
  subjects: [dinh-dynasty, early-le-dynasty, song, champa]
  links:
    - { from: early-le-dynasty, to: song, note: "박당강에서 송군을 물리침 (981)" }
    - { from: early-le-dynasty, to: champa, note: "참파를 쳐서 인드라푸라를 약탈함 (982)" }
  tags: [war, politics]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『대월사기전서』 외기", "『송사』 교지전"]

- id: ly-dynasty-1009
  year: 1009
  endYear: 1028
  title:
    ko: "리 왕조의 성립과 탕롱 천도(1009~1028)"
  summary:
    ko: "1009년 전 레 왕조의 레롱딘이 죽자 궁중 호위대를 지휘하던 리꽁우언이 승려와 신하들의 추대를 받아 왕위에 올라 리 왕조를 열었다(「전 레 왕조와 송의 침공(980~1005)」(앞의 사건)). 그는 어릴 때부터 선승 리카인반 밑에서 자랐다고 하며, 불교계의 지지를 받았다. 사후 이름은 리 태조이다. 1010년 그는 호아르의 좁은 산골 도읍을 버리고 평야의 옛 대라성으로 도읍을 옮기고 이름을 탕롱('올라가는 용')이라 고쳤다. 이때 내린 「천도조」는 주와 상의 옛 천도를 예로 들며 평야의 중심이 사방에서 모이기 좋다고 밝혔다. 탕롱은 오늘의 하노이 일대이며 이후 후대 왕조도 이곳을 중심으로 삼았다. 그는 사원을 크게 일으키고 불교 승려를 우대했으며 북쪽 송과는 조공으로 관계를 이었다. 1028년 숨진 뒤 아들 리 태종(재위 1028~1054)이 즉위하기 전에 세 왕자가 반란을 일으켰다고 전한다. 리 왕조는 이후 1054년 나라 이름을 대월로 바꾸고 1069년 참파를 쳐서 세 지방을 얻었으며(「리트엉끼엣의 송 공격과 여웅강 전투(1075~1077)」(뒤의 사건)), 아홉 왕을 거쳐 1225년까지 이어진다. 리 왕조 초기를 다루는 베트남 사서의 연대는 일부가 15세기에 정리되었다. 리 왕조는 이후 두 세기 동안 불교를 나라의 중심 신앙으로 삼고 사원과 탑을 지어 왕권의 바탕으로 삼았다. 홍강 제방 공사에 대한 기록은 11세기 후반(1077년)부터 나타난다. 탕롱은 홍강과 또강이 만나는 평야에 있어 물길과 육로가 모이는 곳이었고, 용이 오르는 땅이라는 풍수 전승이 이름에 얽혀 있다. 리 태조의 즉위 해는 1009년이지만 연호를 쓰기 시작한 것은 이듬해(순천 원년, 1010)라고 적는 목록도 있다."
  subjects: [early-le-dynasty, ly-dynasty, song]
  tags: [politics, religion]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『대월사기전서』 본기", "「천도조」"]

- id: airlangga-1016
  year: 1016
  endYear: 1049
  title:
    ko: "아이를랑가와 케디리 왕국(1016~1049)"
  summary:
    ko: "다르마왕사 테구가 다스리던 동부 자와의 마타람 왕국(「음푸 신독의 동부 자와 천도와 이샤나 왕가(929~1016)」(앞의 사건))은 1016년(1017년으로 적는 자료도 있다) 와라와리의 습격으로 무너졌다. 이 일은 딸의 혼례 잔치 때 벌어졌다고 전한다. 이 혼례의 신랑이 발리 왕 우다야나와 마헨드라닷타(다르마왕사의 누이) 사이에서 난 아이를랑가였다. 아이를랑가는 도망쳐 와나기리의 숲속에서 몇 해를 지낸 뒤 신하와 백성의 추대로 1019년 왕위에 올랐고 카후리판을 도읍으로 삼았다. 이때를 마타람이 끝나고 케디리 왕국이 시작한 때로 본다. 1041년 푸캉안 비문은 와라와리 등을 눌러 나라를 다시 세웠다고 새겼으며 이 비문에서는 와라와리의 배후에 스리비자야가 있다는 견해도 있다(「라젠드라 1세의 갠지스 원정과 스리비자야 습격(1014~1044)」(앞의 사건)). 아이를랑가는 1042년 무렵 왕국을 두 아들에게 나누어 주고 은둔한 뒤 7년 뒤인 1049년 숨졌다고 한다. 나뉜 두 왕국은 자와 동부의 장갈라(아래쪽)와 판잘루(케디리)이다. 분할 해를 1042년으로 적는 자료도 있고 1045년으로 적는 자료도 있다. 판잘루 쪽 이름이 뒤에 케디리로 불려 이 나라의 이름이 되었다. 케디리는 1135~1159년 자야바야 때 전성기를 맞는다. 아이를랑가 시대에 『아르주나위와하』 같은 고대 자와어 문학이 자랐다. 아르주나위와하는 음푸 칸와가 지었고 아이를랑가를 아르주나에 빗댄 시로 읽혀, 고대 자와어 궁정 문학의 대표작으로 꼽힌다. 아이를랑가의 어머니 마헨드라닷타는 발리 왕 우다야나의 왕비로 발리에서 살았다. 그가 쓴 칭호 가운데 '안안타위크라모퉁가데와'가 비문에 남았다."
  subjects: [mataram-kingdom, kediri-kingdom, srivijaya]
  tags: [politics, culture]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "「푸캉안 비문」"]

- id: anawrahta-pagan-1044
  year: 1044
  endYear: 1077
  title:
    ko: "아노라타의 바간 통일과 따통 정복(1044~1077)"
  summary:
    ko: "아노라타는 1044년 8월 소케를 죽이고 바간의 왕이 되어 12월에 즉위식을 올렸다. 이후 이라와디강 중부의 곡창 지대를 단단히 쥐고, 1056년 몬 승려 신 아라한을 만나 상좌부 불교로 바꾸었다. 바간은 쀼 도시국가 땅 위에서 자란 나라이다. 쀼의 중심 도시 할린은 832년 남조의 침입으로 약 3천 명이 잡혀갔다고 중국 사서가 적고(「남조의 성장: 피라각의 통일에서 정매사의 찬탈까지(738~902)」(앞의 사건)), 9세기에 쀼 도시들이 쇠락해 11세기 중엽 쀼 도시국가가 사라진다. 바간의 버마인은 폭력 정복이 아니라 쀼 사회에 차차 스며들며 이끌었다는 서술이 힘을 얻고 있다. 1057년 5월에는 남쪽 따통(타톤)을 정복하고 몬의 학자와 삼장 경전, 장인을 바간으로 데려왔다. 정복에 앞서 바고(페구)의 지배자가 항복했다는 서술이 있으나 연대는 알려지지 않았다. 따통 정복 전에 아노라타가 프롬 일대를 쥐고 있었는지는 사료로 확인되지 않는다. 몬 문자를 바탕으로 버마 문자를 만들었다는 연대도 1058년 무렵이라 하나 최근 연구는 1035년 앞부터 쓰였다고 본다. 1059년 쉐지곤 파고다 공사가 시작되었고, 1061년에는 샨 구릉에 성채 43곳을 두라는 명령이 내려졌다. 1069년 실론(스리랑카)의 비자야바후 1세가 촐라에 맞설 도움을 청했고 1071년 승려와 경전을 보냈다. 아노라타는 1077년 4월 숨졌다. 타톤 정복이 실제로 어떤 규모였는지는 사료의 한계로 논쟁이 있다. 아노라타는 이 시기 이라와디강 중부 관개 지대의 수로와 저수지를 개발해 바간의 쌀 생산을 늘렸다고 전한다. 상좌부 불교를 후원했으나 정령 신앙(낫) 숭배도 막지 않았다."
  subjects: [pagan-empire, pyu-city-states]
  tags: [politics, religion]
  sources: ["Michael Aung-Thwin, Pagan: The Origins of Modern Burma (University of Hawaii Press, 1985)", "Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: ly-thuong-kiet-1075
  year: 1075
  endYear: 1077
  title:
    ko: "리트엉끼엣의 송 공격과 여웅강 전투(1075~1077)"
  summary:
    ko: "리 왕조의 리 태종과 리 성종은 북쪽 송과 조공 관계를 이으면서도 남쪽으로 참파를 눌러 세력을 키웠다. 1069년 리 성종은 조공을 끊은 참파를 쳐서 왕을 사로잡았고, 풀려난 왕은 지금의 꽝빈·꽝찌 북부 세 지방을 내놓았다. 송은 신종 때 왕안석의 개혁을 추진하며 남방에도 대비를 높였다. 리 인종(재위 1072~1127)은 어린 왕이었고, 장수 리트엉끼엣이 군을 이끌었다. 1075년 말 리트엉끼엣은 송이 쳐들어올 것을 먼저 막으려고 송의 옹주·흠주·염주를 선제공격했다. 옹주(지금의 난닝)는 42일 만에 무너졌고 성을 지킨 소감(蘇緘)이 죽었다고 전한다. 중국 쪽 기록은 세 주에서 수만 명이 죽었다고 적으나 숫자는 크게 갈린다. 1076년 송은 곽규를 앞세운 대군을 보냈고 리트엉끼엣은 지금의 박닌 근처 여웅강(여월강)에 방어선을 쳐 1077년 초 송군을 막았다. 이 싸움 즈음 「남국산하」라는 시가 울려 퍼져 대월의 독립을 알렸다고 전한다. 송군은 전염병과 보급난으로 물러났고 양쪽은 화의했다. 양쪽은 포로와 국경 땅을 돌려주는 교섭을 1080년대까지 이어 갔다. 이후에도 대월은 형식상 송에 조공을 이어 갔다. 날짜는 음력이다. 이 선제공격은 옹주 등 세 주의 군량과 장비를 없애 송의 침공 준비를 꺾으려는 데 목적이 있었다고 읽는 서술이 많은 반면, 중국 쪽 기록은 이를 침략으로 적었다. 「남국산하」의 작자는 리트엉끼엣으로 전하나 확정되지 않았다. 송은 이 무렵 서하와 요 때문에 군사를 북쪽에 둔 터라 남쪽 방어가 느슨했다는 설명이 있다. 곽규의 원정군은 수전에 약한 북방 병사가 많아 전염병으로 상당수를 잃었다고 한다."
  subjects: [ly-dynasty, song, champa]
  links:
    - { from: ly-dynasty, to: song, note: "옹주·흠주·염주를 선제공격함 (1075~1076)" }
  tags: [war, diplomacy]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』 본기", "「남국산하」"]

- id: kyansittha-1084
  year: 1084
  endYear: 1167
  title:
    ko: "짠싯따와 바간의 전성(1084~1167)"
  summary:
    ko: "아노라타를 이은 소루(재위 1077~1084)는 1084년 반란으로 죽었고, 장군 짠싯따가 같은 해 4월 왕위에 올랐다(「아노라타의 바간 통일과 따통 정복(1044~1077)」(앞의 사건)). 짠싯따는 몬 학자와 장인을 후원했고, 자신의 계보를 쀼의 옛 도시 스리크세트라에 이어 쀼 사람의 지지를 얻으려 했으며, 상좌부 불교를 떠받치면서 다른 신앙도 받아들였다. 아난다 사원은 1105년 앞뒤에 세워졌다. 짠싯따는 1112년(또는 1113년) 숨졌고, 그의 아들 라자쿠마르가 1113년 먀제디 비문을 새겨 아버지를 위한 시주를 기록했다. 이 비문은 쀼어, 몬어, 옛 버마어, 팔리어 네 말로 같은 글을 적어 언어를 읽는 열쇠가 되었다. 왕위는 짠싯따의 손자 알라웅시뚜(시투 1세, 재위 1112/13~1167)가 이었다. 그는 영토를 넓히고 먼 나라까지 순행했다고 한다. 1167년 알라웅시뚜가 죽은 뒤 어린 민신소가 잠깐 이름만 앉았고, 곧 나라투가 왕위를 빼앗았다(1167~1171). 나라투는 1171년 암살당했고 나라테인카(1171~1174)를 거쳐 시투 2세(1174~1211)가 이어 바간은 최대 판도에 이른다. 알라웅시뚜 때 이미 평원에 수많은 사원과 탑이 세워졌고 1만 기 넘는 건축 가운데 지금 2천여 기가 남았다고 전한다. 사원 건축에는 왕과 귀족이 땅과 사람을 시주해 사원 소유가 커졌다는 점이 이후 왕실 재정의 문제로 이어진다. 짠싯따가 몬어를 궁정 비문에 널리 쓴 점은 정복당한 쪽의 문화가 바간에 이어졌음을 보여 준다. 이 시기 바간에서는 사원과 탑 외에 벽돌 건물과 벽화, 청동 불상, 유약 도기가 함께 늘어 도시가 번성했다."
  subjects: [pagan-empire]
  tags: [politics, religion, culture]
  places: [{ name: 아난다 사원, at: [94.8678, 21.1713], year: 1105 }]
  sources: ["Michael Aung-Thwin, Pagan: The Origins of Modern Burma (University of Hawaii Press, 1985)", "Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "「먀제디 비문」"]

- id: suryavarman-ii-1113
  year: 1113
  endYear: 1150
  title:
    ko: "수리야바르만 2세와 앙코르 와트(1113~1150)"
  summary:
    ko: "11세기 말 크메르 왕위는 자야바르만 6세(재위 1080~1107)와 그의 형 다라닌드라바르만 1세(1107~1113)로 이어졌고, 1113년 수리야바르만 2세가 왕위를 차지했다. 그는 군사 원정으로 이름을 얻었다. 베트남 사서는 1128년 크메르군이 리 왕조 땅인 지금의 응에안을 공격했고 1132년과 1138년에는 참파와 손잡고 다시 쳤다고 적는다. 1145년에는 참파의 도읍 비자야를 점령했으나 자야하리바르만 1세가 1149년 안팎에 이들을 몰아냈다(「참파의 앙코르 약탈과 크메르의 참파 정복(1177~1203)」(뒤의 사건)). 1116년 송에 사신을 보냈다는 중국 기록도 있다. 수리야바르만 2세는 비슈누를 모시는 국가 사원 앙코르 와트를 지었으며, 건축 기간을 1113~1150년으로 적는 서술도 있고 1122년에 공사가 시작되었다고 적는 서술도 있다. 이 사원은 동쪽이 아닌 서쪽을 바라보는 구조이고, 회랑 벽에 라마야나와 쿠루크셰트라 전투, 왕의 행렬과 천국·지옥 장면이 새겨져 있다. 건축 때문에 사원을 왕의 무덤으로 만들었다는 설이 있다. 수리야바르만 2세 뒤 다라닌드라바르만 2세(1150~1156), 야소바르만 2세(1156~1165), 트리부바나디탸바르만(1165~1177)이 이었다. 야소바르만 2세는 반란으로 죽었고 트리부바나디탸바르만이 왕위를 찬탈했다고 전한다. 앙코르 와트는 12~13세기를 거치며 차츰 불교 사원으로 쓰였고, 지금도 불교 성지로 남아 있다. 앙코르 와트의 사암 블록은 프놈 쿨렌 산지에서 운하로 옮겼다고 본다. 회랑 부조에는 수리야바르만 2세의 궁정 행렬이 새겨져 있고 그 속에 시암 군대라 적힌 병사도 보여 당대 사회를 알려 준다."
  subjects: [khmer-empire, champa, ly-dynasty, song]
  links:
    - { from: khmer-empire, to: champa, note: "비자야를 점령함 (1145~1149)" }
    - { from: khmer-empire, to: ly-dynasty, note: "응에안을 공격함 (1128~1138)" }
  tags: [politics, culture, religion, war]
  places: [{ name: 앙코르 와트, at: [103.867, 13.4125], year: 1150 }]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael D. Coe, Angkor and the Khmer Civilization (Thames & Hudson, 2003)", "『대월사기전서』 본기"]

- id: kedah-islam-1136
  year: 1136
  title:
    ko: "크다의 이슬람 개종과 크다 술탄국(1136)"
  summary:
    ko: "말레이 반도 서북쪽 크다는 일찍부터 인도와 중국을 잇는 바닷길의 항구였다. 부장 계곡에는 일찍부터 힌두·불교 유적이 남아 있고, 중국 승려들은 이곳을 '갈다(羯荼)'로 적었으며, 인도 남부 촐라는 1025년 크다(카다람)를 쳤다(「라젠드라 1세의 갠지스 원정과 스리비자야 습격(1014~1044)」(앞의 사건)). 스리비자야는 이 항구를 685년 무렵부터 쥐고 있었다고 알려져 있다(「스리비자야의 성립과 팔렘방(682~695)」(앞의 사건)). 크다 술탄국의 시작은 18세기에 정리된 『크다 연대기』가 전한다. 이 연대기에 따르면 1136년 크다의 왕이 예멘에서 온 설교자 셰이크 압둘라의 설득으로 이슬람으로 개종하고 '술탄 무자파르 샤'라는 이름을 얻었다. 이 연대기는 신뢰하기 어려운 후대 기록으로 보며, 1136년은 전승의 해이다. 이 해 크다를 스리비자야가 아직 다스렸다는 점과도 어긋난다. 아체 쪽 기록은 크다의 이슬람화를 1474년으로 적고, 크다가 15세기까지 힌두·불교의 성격을 이었을 수도 있다는 서술도 있다. 무자파르 샤 1세의 재위를 1136~1179년으로 적는 목록이 있다. 크다 술탄국은 이후 1909년 영국 보호령이 될 때까지 이어진다. 크다는 중국 쪽 기록(갈다)과 인도 쪽 기록(카다람)에 모두 오르는 항구였다. 반도에서 이슬람 연대가 새겨진 가장 이른 비문은 14세기의 트렝가누 석비로 보며 그 연대는 1303년과 1387년으로 갈린다. 크다 연대기는 왕통을 페르시아와 인도의 영웅에 이어 붙이는 전설이 많아, 실제 정치사로 읽을 때는 비문과 중국 사서에 견주어야 한다. 연대기 속 개종 이야기는 이슬람이 바닷길 상인을 따라 들어왔다는 기억을 담고 있다."
  subjects: [kedah-perlis, srivijaya]
  links:
    - { from: kedah-perlis, to: srivijaya, note: "스리비자야의 지배에서 벗어나 술탄국을 세움 (전승 1136)" }
  tags: [religion, politics]
  sources: ["Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "O. W. Wolters, Early Indonesian Commerce: A Study of the Origins of Srivijaya (Cornell University Press, 1967)", "『크다 연대기』"]

- id: champa-angkor-1177
  year: 1177
  endYear: 1203
  title:
    ko: "참파의 앙코르 약탈과 크메르의 참파 정복(1177~1203)"
  summary:
    ko: "크메르는 수리야바르만 2세 때 참파 북부를 점령했으나(「수리야바르만 2세와 앙코르 와트(1113~1150)」(앞의 사건)), 참파의 자야하리바르만 1세(재위 1147~1166 무렵)가 이를 몰아냈다. 참파는 그 뒤 크메르에 복수할 기회를 노렸다. 1177년 참파의 왕 자야인드라바르만 4세는 해군을 보내 메콩강을 거슬러 올라가 톤레삽 호수를 지나 야소다라푸라(앙코르)를 약탈했다. 당시 크메르 왕 트리부바나디탸바르만은 이 때 죽었다고 전한다. 일부 서술은 약탈을 1178년으로 적는다. 참파군은 4년간 크메르 땅을 점령했다. 1181년 자야바르만 7세가 참파군을 몰아내고 즉위했고, 호수의 해전은 바이욘의 부조에 새겨졌다(「자야바르만 7세의 앙코르 톰과 바이욘(1181~1218)」(뒤의 사건)). 크메르는 곧 반격에 나섰다. 1190년 자야바르만 7세는 참파의 왕자 비디야난다나와 함께 비자야를 쳐서 자야인드라바르만 4세를 사로잡았고, 참파는 크메르의 종속국이 되었다. 크메르 쪽은 1203년 무렵 참파 땅 대부분을 다스렸다. 1220년 앞뒤로 크메르가 물러나면서 참파는 다시 자립했고, 1226년 자야 파라메슈바라바르만 2세가 참파의 왕으로 이름을 알린다. 1190년부터 1220년까지가 크메르 종속기이다. 바이욘 회랑에는 호수 위에서 크메르 군선과 참파 군선이 맞붙는 장면이 새겨져 있어 이 전쟁이 크메르 쪽 기억에서 얼마나 큰 일이었는지 보여 준다. 참파 쪽 기록은 비문과 중국 사서에 단편으로만 전한다. 중국 남부 관리 주거비가 쓴 『영외대답』(1178년)이 참파의 크메르 공격 소식을 단편으로 전한다. 참파군이 쓴 배는 수십 척이었다고 하나 정확한 규모는 알려져 있지 않다."
  subjects: [champa, khmer-empire]
  links:
    - { from: champa, to: khmer-empire, note: "앙코르를 약탈하고 4년간 점령함 (1177~1181)" }
    - { from: khmer-empire, to: champa, note: "비자야를 점령해 종속시킴 (1190~1220)" }
  tags: [war, politics]
  sources: ["Georges Maspero, Le royaume de Champa (G. Van Oest, 1928)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)"]

- id: jayavarman-vii-1181
  year: 1181
  endYear: 1218
  title:
    ko: "자야바르만 7세의 앙코르 톰과 바이욘(1181~1218)"
  summary:
    ko: "참파의 앙코르 점령(1177~1181)을 끝내고 즉위한 자야바르만 7세(재위 1181~1218)는 나이가 쉰 중반이었다고 한다(「참파의 앙코르 약탈과 크메르의 참파 정복(1177~1203)」(앞의 사건)). 그는 대승불교를 믿어 크메르의 전통적인 힌두 신앙 위에 불교를 앉혔다. 해자와 성벽을 두른 앙코르 톰을 짓고 그 중앙에 사면상(관세음보살의 얼굴로 보는 설이 많다)을 새긴 바이욘을 세웠다. 어머니를 위한 타 프롬(1186년 비문)과 아버지를 위한 프레아 칸(1191년 비문)도 지었다. 타 프롬 비문은 병원 102곳, 프레아 칸 비문은 길 위의 숙소 121곳을 두었다고 새겨 복지 정책을 전한다. 비문 숫자는 왕의 업적을 과시하는 글이어서 실제 운영과는 차이가 있을 수 있다. 크메르의 도로망도 늘어 앙코르에서 참파와 피마이 쪽으로 뻗는 길이 정비되었다고 한다. 군사로는 참파를 눌렀고(「참파의 앙코르 약탈과 크메르의 참파 정복(1177~1203)」(앞의 사건)), 라보를 비롯한 짜오프라야강 유역에도 종주권을 행사했다. 이 때문에 크메르의 영토는 가장 넓어졌다고 보나 직접 다스린 지역과 종주권 범위는 구분해야 한다. 그의 뒤를 인드라바르만 2세(1218~1243)가 이었다. 건축 규모가 커서 부역과 재정 부담이 컸으며 이후 쇠퇴의 원인으로 거론되기도 한다. 비문에는 그의 어머니 자야라자추다마니와 왕비 자야라자데비, 인드라데비의 이름이 올라 불교 교육에 관여했다고 전한다. 그가 어린 시절 참파에 머물렀다는 서술도 있다. 바이욘의 얼굴 조각을 왕 자신의 얼굴로 읽는 견해도 있다. 병원과 숙소는 사원에 딸린 기관으로 운영되어 시주와 사원 재산이 그 재원이었다고 본다."
  subjects: [khmer-empire, champa, lavo-kingdom]
  links:
    - { from: khmer-empire, to: lavo-kingdom, note: "라보에 종주권을 행사함 (1181~1218)" }
  tags: [politics, culture, religion]
  places: [{ name: 바이욘 (앙코르 톰), at: [103.859, 13.4412], year: 1190 }]
  sources: ["Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael D. Coe, Angkor and the Khmer Civilization (Thames & Hudson, 2003)"]

- id: ken-arok-singhasari-1222
  year: 1222
  endYear: 1268
  title:
    ko: "켄 아록과 싱하사리 왕국(1222~1268)"
  summary:
    ko: "케디리의 마지막 왕 케르타자야(재위 1194~1222)는 브라만을 억누르다가 그들이 투마펠의 켄 아록에게 몸을 맡기는 일을 겪었다(「아이를랑가와 케디리 왕국(1016~1049)」(앞의 사건)). 켄 아록은 『파라라톤』에 따르면 평민으로 출신해 투마펠 지방관 툰궁 아메퉁을 죽이고 그의 아내 켄 데데스를 취했다. 1222년 켄 아록의 군대는 간테르 전투에서 케디리 군을 무너뜨렸고, 케디리는 싱하사리의 속국이 되어 케르타자야의 아들 자야사바가 섭정으로 앉았다. 이 이야기는 15세기 이후 쓰인 『파라라톤』과 1365년 『나가라케르타가마』에 담겨 있어 전설의 색채가 짙다. 『파라라톤』은 켄 아록이 1227년 켄 데데스의 아들 아누사파티에게 죽었다고 하며, 아누사파티는 1248년 켄 아록의 아들 토히자야에게 죽었다. 토히자야는 곧 아누사파티의 아들 랑가와니(위스누와르다나)에게 쫓겨났고, 위스누와르다나는 1248년부터 1268년까지 사촌 마히사 참파카와 함께 다스렸다고 전한다. 이 시기 싱하사리는 자와 동부 브란타스강 유역을 근거로 한 농업 국가로 자랐으며, 1268년 위스누와르다나의 아들 크르타나가라가 이었다(「크르타나가라의 말라유 원정과 싱하사리의 끝(1275~1293)」(뒤의 사건)). 왕위 계승이 암살로 이어졌다는 이야기는 학계에서 전승으로 다룬다. 사원 비문에 남은 연대는 이 전승과 몇 해씩 어긋난다. 싱하사리의 중심 투마펠은 지금의 말랑 일대로 보며 사원 터와 비문이 이 일대에 흩어져 있다. 켄 아록의 이야기는 평민 출신 영웅 전설의 틀을 따라 쓰여, 어디까지가 사실인지는 학계가 가려내는 중이다. 켄 아록 왕통은 뒤에 마자파힛 왕가로 이어진다."
  subjects: [kediri-kingdom, singhasari]
  links:
    - { from: singhasari, to: kediri-kingdom, note: "간테르 전투에서 케디리를 무너뜨림 (1222)" }
  tags: [politics, war]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "『파라라톤』", "『나가라케르타가마』"]

- id: tran-dynasty-1225
  year: 1225
  endYear: 1258
  title:
    ko: "쩐 왕조의 성립(1225~1258)"
  summary:
    ko: "리 왕조는 13세기 초 왕권이 약해졌고 1210년 리 까오 똥이 죽은 뒤 외척과 호족의 다툼이 이어졌다(「리 왕조의 성립과 탕롱 천도(1009~1028)」(앞의 사건)). 리 혜종(재위 1211~1224)은 병이 들어 1224년 딸 리 소황에게 왕위를 넘겼다. 이때 궁중 권력을 쥔 쩐 투 도는 친족인 쩐 까잉을 리 소황의 남편으로 들였고, 1225년 리 소황은 남편에게 양위했다. 쩐 까잉이 쩐 타이 똥(재위 1225~1258)이다. 음력 1225년 12월의 일이어서 양력으로는 1226년 1월 무렵이라는 설명이 있다. 쩐 투 도는 리 왕가를 정리했고 혜종은 1226년 죽었다고 한다. 쩐 왕조는 왕이 일찍 아들에게 자리를 넘기고 상왕이 되어 나라를 돌보는 방식을 만들었다. 쩐 타이 똥은 1258년 아들 쩐 타인 똥에게 자리를 넘기고 상왕이 되었다. 같은 해 몽골의 침공이 이어졌다(「몽골·원의 대월 침입과 쩐 흥 다오(1257~1288)」(뒤의 사건)). 쩐 왕조 초기에는 홍강 하구의 제방을 정비하고 법을 세우는 일도 있었다. 이 왕조는 1400년 호꾸이리의 찬탈로 끝난다(「호꾸이리의 찬탈과 호 왕조(1400~1407)」(뒤의 사건)). 사서는 쩐 왕가가 복건에서 건너온 어부 출신이라는 전승을 전하나 확인되지 않았다. 쩐 왕조 때 대월은 1230년 법을 정하고 1242년 행정 구역을 정비한 것으로 전한다. 이 시기 학자들은 유교 경전과 불교, 도교를 함께 익히는 분위기에서 자랐다. 쩐 투 도는 리 왕가의 사람들을 정리하는 한편 쩐 씨 안에서 혼인을 이어 가는 정책을 폈다고 한다. 쩐 왕조의 도읍도 탕롱이었다. 쩐 가문은 홍강 하구에서 힘을 키운 집안으로 전한다."
  subjects: [ly-dynasty, tran-dynasty]
  links:
    - { from: ly-dynasty, to: tran-dynasty, note: "리 소황이 쩐 까잉(쩐 타이 똥)에게 양위함 (1225)" }
  tags: [politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』 본기", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: sukhothai-founding-1238
  year: 1238
  endYear: 1279
  title:
    ko: "수코타이 왕국의 건국(1238~1279)"
  summary:
    ko: "수코타이는 짜오프라야강 상류 북중부 평야의 도시로, 13세기 초에는 라보를 거쳐 크메르 제국의 영향을 받는 곳이었다(「라보와 하리푼차이: 몬 왕국과 짜마테위 전승(648~1050)」(앞의 사건)). 1238년 무렵 타이계 수령 시인트라팃(폿쿤 방클랑하오)과 파므앙이 힘을 합쳐 이곳의 크메르 쪽 관리를 몰아내고 시인트라팃이 수코타이의 첫 왕에 올랐다. 이 일로 프라루앙 왕조가 열렸다고 한다. 이 일의 해와 세부는 후대 기록에 의존해 학계가 다듬는 중이다. 시인트라팃 뒤 아들 반므앙이 이었고(1270 무렵~1279 무렵), 그의 동생 람캄행이 1279년 왕위에 오른다(「람캄행과 수코타이의 전성, 타이 문자(1279~1298)」(뒤의 사건)). 수코타이는 이웃한 시사차날라이와 함께 불교와 상업 교통로를 중심으로 한 도시들의 연합에 가까운 구조였다. 이 시기 수코타이는 아직 크메르를 대신할 큰 나라가 아니었다. 시인트라팃·반므앙의 정확한 재위 연도는 자료마다 갈리며 위 연대는 목록의 근사값이다. 크메르 세력이 후퇴한 자리에서 타이계 도시들이 세운 첫 독립 정권이라는 점에서 이후 아유타야로 이어지는 타이 역사의 한 갈래로 읽힌다(「우통과 아유타야 왕국의 건국(1351~1369)」(뒤의 사건)). 수코타이 평야는 야행산과 욤강 사이 건조한 땅이어서 저수지와 수로로 물을 모아 논을 가꾸었다. 시사차날라이에서 구운 도자기(상칼록)는 뒤에 중국과 동남아 곳곳으로 수출되었다. 시인트라팃의 출신은 연대기마다 달라, 크메르 지방관의 반란을 이끌었다는 서술과 지역 족장이었다는 서술이 갈린다. 수코타이라는 이름은 산스크리트로 '행복의 새벽'을 뜻한다고 설명한다."
  subjects: [sukhothai-kingdom, khmer-empire, lavo-kingdom]
  links:
    - { from: sukhothai-kingdom, to: khmer-empire, note: "크메르 쪽 관리를 몰아내고 자립함 (1238 무렵)" }
  tags: [politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "「람캄행 비문」"]

- id: mongol-dai-viet-1257
  year: 1257
  endYear: 1288
  title:
    ko: "몽골·원의 대월 침입과 쩐 흥 다오(1257~1288)"
  summary:
    ko: "몽골은 1253년 대리를 무너뜨린 뒤(「몽골의 대리 정복」(앞의 사건)) 남송을 남쪽에서 압박하려 대월에 길을 내달라고 요구했다. 1257년 가을 우리양카다이가 보낸 사신을 쩐 타이 똥이 가두자, 1258년 1월 몽골군이 쳐들어와 아흐레 동안 탕롱을 점령하고 주민을 학살했다. 몽골군은 곧 물러났고 쩐 타이 똥은 1258년 3월 아들에게 왕위를 넘겼다. 고려는 1231년부터 몽골과 싸우다 1259년 강화했는데, 같은 시기 동아시아 두 끝에서 몽골과의 항쟁이 이어진 셈이다. 원은 1282년 소게투의 군대를 참파로 보내 이듬해(1283) 도읍 비자야를 차지했고(「원의 일본·베트남·자와 원정(1275~1293)」(뒤의 사건)), 1285년 1월 말 쿠빌라이의 아들 토곤이 참파 쪽과 북쪽 두 길로 쳐들어왔다. 쩐 년 똥(쩐 타인 똥의 아들)과 상왕 쩐 타인 똥, 장군 쩐 흥 다오 등이 이끈 대월군은 1285년 5월 말 함뜨에서 원군을 이기고 6월 9일 탕롱에서 원군을 물러나게 했으며, 소게투는 6월 쯔엉즈엉 전투에서 죽었다. 원은 1287년 10월 오마르 등과 함께 다시 쳐들어와 1288년 2월 탕롱을 약탈했으나 식량이 모자라 3월 물러났다. 1288년 4월 박당강에서 쩐 흥 다오가 강바닥에 말뚝을 박아 오마르의 수군을 무너뜨렸다(「박당강 전투와 응오 왕조(938~944)」(앞의 사건)). 이후 쩐 왕조는 원에 조공을 바치는 형식으로 관계를 정리했다. 날짜는 음력이다. 쩐 흥 다오는 『병서요략』을 지어 군을 가르친 인물로 전하며 지금도 베트남에서 민족 영웅으로 기려진다. 침공 동안 대월군은 쩐 흥 다오의 지휘로 지형과 강, 여름 습기를 이용한 지구전과 게릴라전을 폈다."
  subjects: [tran-dynasty, champa, mongol-empire, yuan, goryeo]
  links:
    - { from: mongol-empire, to: tran-dynasty, note: "탕롱을 점령했다가 물러남 (1258)" }
    - { from: yuan, to: champa, note: "도읍 비자야를 점령함 (1283)" }
    - { from: tran-dynasty, to: yuan, note: "박당강에서 원의 수군을 무찌름 (1288)" }
  tags: [war, diplomacy]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』 본기", "『원사』 외이전 안남"]

- id: ternate-1257
  year: 1257
  endYear: 1300
  title:
    ko: "트르나테와 말루쿠의 정향 무역(1257~1300)"
  summary:
    ko: "트르나테는 말루쿠(향신료 제도)의 작은 화산섬으로, 세계에서 정향이 나는 몇 안 되는 곳이었다. 정향은 오래전부터 중국과 인도, 지중해로 팔렸고 한나라 때에는 입에 물고 황제 앞에 나갔다고 전한다. 전승에 따르면 트르나테는 1257년 모몰레 치코(바브 마슈르 말라모)가 첫 '콜라노'(왕)로 추대되며 시작되었다. 이 연대는 전승이어서 학계는 확인되지 않은 해로 본다. 말루쿠에는 트르나테, 티도레, 자일롤로, 바칸의 네 왕국(키에 라하)이 있었고 각 가문의 연합으로 움직였다. 이 시기 정향은 자와와 말레이 상인의 손을 거쳐 말라카 해협 너머 인도·서아시아로 퍼졌다고 본다. 왕가가 이슬람으로 개종한 것은 마르훔(재위 1465~1486) 때이고, 아들 자이날 아비딘(1486~1500)이 이슬람법을 도입하고 '콜라노' 칭호를 '술탄'으로 바꾸었다. 따라서 1257~1300년의 트르나테는 술탄국이 아니라 힌두·토착 신앙을 따르는 족장 왕국이었다. 트르나테는 15세기 말 이슬람화한 뒤 포르투갈과 네덜란드의 향신료 쟁탈전 중심에 서게 되고, 1683년까지 술탄국으로 이어진다(「반튼 내전과 트르나테의 종속(1680~1684)」(뒤의 사건)). 1365년 자와의 『나가라케르타가마』는 말루쿠를 속령 목록에 올린다. 1257~1300년 사이 트르나테에 대한 문자 기록은 거의 없어 이 시기 이야기는 후대 구전과 포르투갈·네덜란드 기록에 기대고 있다. 트르나테는 가까운 티도레와 한 쌍으로 불리며 정향 산지를 나누어 다스렸다. 정향은 꽃봉오리를 따서 말리면 보관이 쉬워 먼 곳까지 실어 나르기 좋았다. 트르나테섬에는 지금도 가마라마 화산 둘레로 옛 향신료 숲과 왕궁 터가 남아 있다."
  subjects: [ternate-sultanate]
  tags: [economy, politics]
  sources: ["Leonard Y. Andaya, The World of Maluku: Eastern Indonesia in the Early Modern Period (University of Hawaii Press, 1993)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)"]

- id: mangrai-lan-na-1262
  year: 1262
  endYear: 1296
  title:
    ko: "멩라이와 란나 왕국: 치앙라이에서 치앙마이로(1262~1296)"
  summary:
    ko: "멩라이는 1238년(1239년으로 적는 곳도 있다)에 태어났고, 북부 타이의 응언양(조난)을 다스리던 아버지의 뒤를 1261년(1259년으로 적는 서술도 있다) 이었다. 이듬해인 1262년 치앙라이를 세워 도읍으로 삼았다. 이어 주변의 타이계 소국들을 하나씩 병합했고, 1287년에는 파야오의 응암무앙, 수코타이의 람캄행과 삼왕 동맹을 맺었다고 전한다. 이 동맹을 몽골의 바간 침공(1287)과 맞물린 북방 위협에 대한 대응으로 읽는 연구도 있다(「몽골의 바간 침공과 와레루의 마르타반(1277~1287)」(뒤의 사건)). 1291년(1292년으로 적는 연구도 있다)에는 몬 왕국 하리푼차이를 쳐서 왕 이바가 남쪽 람빵으로 달아났고, 하리푼차이는 란나에 흡수되었다. 여기서는 1292년을 란나의 시작으로 본다. 멩라이는 1294년 핑강 동쪽에 비앙 쿰깜을 세웠다가 홍수 때문에 버리고, 1296년 치앙마이('새 도시') 건설을 시작해 새 도읍으로 삼았다. 란나는 '백만 개의 논'이라는 뜻이다. 멩라이는 1311년(1317년이라는 서술도 있다) 치앙마이에서 번개에 맞아 죽었다고 전한다. 이후 란나는 1558년 버마에 복속될 때까지 북부 타이의 중심으로 이어진다. 응언양에서 치앙라이까지 멩라이의 지배 범위는 사료가 적어 경계를 알 수 없다. 란나의 쌀농사 평야는 핑강, 왕강, 욤강, 난강 유역으로 이어졌고 치앙마이는 핑강 유역 인구의 중심으로 자랐다. 응언양은 지금의 치앙센 일대이며, 멩라이가 세운 치앙라이는 그보다 남쪽 콕강 가에 있다. 멩라이는 1287년의 삼왕 동맹으로 수코타이·파야오와의 다툼을 줄이고 남쪽 팽창에 집중했다."
  subjects: [lan-na, hariphunchai, sukhothai-kingdom]
  links:
    - { from: lan-na, to: hariphunchai, note: "하리푼차이를 정복해 흡수함 (1292)" }
  tags: [politics, war]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "David K. Wyatt and Aroonrut Wichienkeeo, The Chiang Mai Chronicle (Silkworm Books, 1998)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)"]

- id: kertanagara-pamalayu-1275
  year: 1275
  endYear: 1293
  title:
    ko: "크르타나가라의 말라유 원정과 싱하사리의 끝(1275~1293)"
  summary:
    ko: "싱하사리의 마지막 왕 크르타나가라(재위 1268~1292)는 바다 건너로 눈을 돌렸다(「켄 아록과 싱하사리 왕국(1222~1268)」(앞의 사건)). 『파라라톤』은 1275년 '파말라유'(말라유 원정) 군대를 보냈다고 적었고, 1286년 파당 로코 비문은 크르타나가라가 불상(아모가파사)을 다르마스라야(잠비 상류)로 보냈다고 새겼다. 1284년에는 발리를 눌렀다. 이 원정으로 스리비자야의 옛 중심이던 잠비·말라유 일대가 압박을 받았다. 스리비자야는 1025년 촐라의 습격 뒤 중심이 팔렘방에서 잠비로 옮겨 가 13세기 초 중국 『제번지』가 삼불제로 소개했으나, 13세기 후반에는 다르마스라야 쪽 세력으로 남아 있었다. 같은 때 수마트라 북쪽 해안에는 1267년 무렵 메라 실루가 세운 사무데라 파사이가 있었고, 마르코 폴로는 1292년 이 일대에 들렀다. 쿠빌라이는 1280년, 1281년, 1289년 크르타나가라에게 복속을 요구했는데(「원의 일본·베트남·자와 원정(1275~1293)」(뒤의 사건)) 그는 거절하고 사신 멍기의 얼굴에 상처를 냈다(시기를 1289년으로 보는 서술과 1292년 초로 보는 서술이 갈린다). 1292년 케디리의 자야카트왕이 북쪽과 남쪽에서 공격해 왕궁을 불사르고 크르타나가라를 죽였다. 이 원정과 뒤이은 마자파힛의 성립을 거치며 스리비자야는 13세기 말에 옛 중심을 잃고 역사에서 사라져 간다. 이듬해 원 함대가 도착했고 사위 라덴 위자야가 마자파힛을 세운다(「라덴 위자야와 마자파힛의 성립(1293~1309)」(뒤의 사건)). 말라유 원정은 점령이 아니라 영향력을 넓히는 원정이었다. 크르타나가라의 원정은 말라카 해협 교역로를 쥐고 몽골에 맞설 동맹을 만들려는 뜻을 함께 가졌다고 읽는다. 다르마스라야에 보낸 불상은 그곳 왕에게 바친 선물로 읽힌다."
  subjects: [singhasari, srivijaya, yuan]
  links:
    - { from: singhasari, to: srivijaya, note: "말라유 원정으로 잠비·다르마스라야를 압박함 (1275~1288)" }
  tags: [war, politics, diplomacy]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "『파라라톤』", "『나가라케르타가마』", "「파당 로코 비문」"]

- id: mongol-pagan-1277
  year: 1277
  endYear: 1287
  title:
    ko: "몽골의 바간 침공과 와레루의 마르타반(1277~1287)"
  summary:
    ko: "바간의 마지막 이름난 왕 나라티하파테(재위 1256~1287)는 쿠빌라이의 조공 요구를 거절했다. 몽골은 대리를 정복한 뒤 윈난에서 바간으로 압박해 왔다(「몽골의 대리 정복」(앞의 사건)). 1277년 윈난 주둔 원군이 응아사웅잔에서 바간 군대를 무찔렀다. 1283년 12월 응아사웅잔과 카웅신을 차지한 원군은 1284년 2월 타가웅까지 올랐다가 물러났고, 1285년 1월 한린(할린) 부근에서 버마군을 무찔러 이라와디강 상류를 쥐었다. 나라티하파테는 방어하지 않고 하(下)버마로 달아났고, 이 일로 '중국군에게서 도망친 왕'이라 불렸다고 전한다. 1287년 나라티하파테는 사신을 베이징에 보내 원의 종주권을 받아들였으나, 돌아와 바간으로 가던 중 프롬 총독이던 아들 티하투에게 사로잡혀 7월 1일 독을 마시게 되었다. 같은 해 원군이 다시 내려왔는데, 옛 서술은 이들이 바간을 차지했다고 적고 최근 연구는 바간 북쪽 160킬로미터쯤에서 멈추었다고 본다. 그에 앞서 1287년 1월 30일 몬어를 쓰는 지역의 지도자 와레루는 마르타반에서 독립을 선언했다. 와레루는 하(下)버마의 몬족 지역을 합쳐 항따와디 왕국의 기초를 세웠다. 바간에는 1287~1289년 왕이 없는 기간이 이어졌고, 1289년 5월 짜스와가 즉위했으나 바간 둘레만 다스렸다. 실제 힘은 마인사잉의 세 형제에게 있었다(「바간 왕국의 끝과 핀야 왕국(1297~1313)」(뒤의 사건)).  바간의 몰락을 몽골 침공 탓으로 보는 전통 서술과 달리, 사원에 땅을 바친 시주로 왕실 재정이 약해진 것이 더 큰 원인이라는 견해도 있다. 마르코 폴로가 전하는 코끼리 부대 이야기는 그가 현장에 없었던 터라 옮겨 들은 이야기로 본다. 원군이 지나간 이라와디 상류의 카웅신 일대는 이 무렵 바간의 북쪽 변방 요새로 쓰였다. 원은 1287년 뒤 바간 둘레에 군을 눌러 두지 않고 윈난으로 물러났다. 바간의 왕권은 이후 마인사잉 형제 쪽으로 기울었다."
  subjects: [pagan-empire, hanthawaddy-kingdom, yuan]
  links:
    - { from: yuan, to: pagan-empire, note: "응아사웅잔에서 이기고 이라와디강 상류를 차지함 (1277~1287)" }
  tags: [war, politics]
  sources: ["Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Michael Aung-Thwin, Pagan: The Origins of Modern Burma (University of Hawaii Press, 1985)", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: ram-khamhaeng-1279
  year: 1279
  endYear: 1298
  title:
    ko: "람캄행과 수코타이의 전성, 타이 문자(1279~1298)"
  summary:
    ko: "람캄행은 시인트라팃의 아들이자 반므앙의 동생으로, 1279년 형을 이어 수코타이의 왕이 되었다(「수코타이 왕국의 건국(1238~1279)」(앞의 사건)). 그의 재위는 1279년부터 1298년까지로 전한다. 『람캄행 비문』(1292년 새김으로 전함)은 그가 남쪽과 동쪽, 북쪽의 많은 나라에게서 조공을 받았다고 적는다. 그러나 비문 속 영토는 직접 지배보다 조공 관계에 가까워 학계는 이를 그대로 믿지 않는다. 비문에는 1283년 람캄행이 타이 문자를 만들었다는 대목이 있어 타이 문자의 기원으로 널리 알려졌다. 비문의 진위와 연대를 두고는 1980년대부터 위작설이 제기되어 논쟁이 있다. 비문은 수코타이를 아버지가 자식을 돌보듯 다스리는 나라로 묘사하며 장사와 소송의 자유, 왕궁 앞 종 같은 제도를 적었다. 상좌부 불교를 들여왔다는 서술도 있으나 논쟁이 있다. 원 조정과 사신이 오갔다는 기록이 1280년대부터 보인다. 1287년에는 란나의 멩라이, 파야오의 응암무앙과 동맹을 맺었다(「멩라이와 란나 왕국: 치앙라이에서 치앙마이로(1262~1296)」(앞의 사건)). 람캄행이 죽은 뒤 속국이 갈라져 나가며 수코타이는 쇠퇴했다. 아유타야는 건국(1351) 무렵 수코타이를 눌러 조공국으로 삼았고(1349년에 이미 조공하게 되었다고 전하지만 해는 분명하지 않다), 1438년 흡수했다(「아유타야의 수코타이 흡수(1438)」(뒤의 사건)). 비문은 수코타이에서 타이어를 적는 문자가 쓰였고 불교 승려와 상인이 함께 모이는 시장이 열렸다고 전한다. 비문은 람캄행이 열아홉 살에 아버지를 따라 싸움에 나서 공을 세웠다고 자랑한다. 그의 이름은 '강한 람'이라는 뜻으로 전한다. 1833년 몽꿋 왕자(뒷날 라마 4세)가 수코타이에서 이 비문을 찾았다고 알려져 있다."
  subjects: [sukhothai-kingdom, yuan, lan-na]
  tags: [politics, culture]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "「람캄행 비문」"]

