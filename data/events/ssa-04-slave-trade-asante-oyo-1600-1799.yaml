# 사하라 이남 사건 2묶음 갈래 04: 노예 무역, 아샨티, 오요 (1600 ~ 1799년)
# 범위: 1600~1799(천문 연도와 같음. 기원전 해 없음). 로지·마제르테인은 1800 무렵까지, 시작 해로 갈래를 정했다. 1800 뒤 일은 쓰지 않고 「뒤의 사건」으로만 가리킨다.
# 깊이: 본문(summary 800~1,600자). 사료가 적은 이른 시대 일은 개관(300~500자): wadai-1635, lozi-1600, swazi-1745, majeerteen-1750.
# 날짜: 모두 그레고리력(1582년 뒤). 확실하지 않은 해는 '무렵', 전승·구술은 '전한다'로 성격을 밝혔고 학설이 갈리는 해는 하나를 골라 '~로 본다'로 썼다.
# 이름 규칙: 항목 이름(다호메이 왕국·로지 왕국·오요 제국 등)을 그대로 쓰고, 노예 무역은 일어난 일과 숫자 범위(추산)만 적었다. 지금 나라와 옛 나라가 이름이 같으면 '지금'을 붙였다.
# 지도 결정과의 관계: 학설이 갈리는 성립·끝 해(다호메이 1600 무렵, 오요 1608 무렵 복귀, 말리 끝 1670 무렵, 콩고 끝 1665, 로앙고 끝 1787 등)는 지도가 고른 해를 따라 쓰고 다른 학설은 한 구절로만 밝혔다.
# 한국사와 닿는 점: 없음.

- id: dahomey-1600
  year: 1600
  endYear: 1700
  title:
    ko: "아보메 고원의 다호메이 왕국 성립(1600 무렵~1700 무렵)"
  summary:
    ko: "오늘날 베냉 남부의 아보메 고원에는 폰어를 쓰는 사람들의 작은 정치체가 있었고, 이것이 뒤에 다호메이 왕국으로 자랐다. 전승에 따르면 시조 도-아클린은 해안 쪽의 알라다 왕국 왕가에서 갈라져 나온 인물로, 1600년 무렵 고원 일대에 자리를 잡았다고 한다. 전승의 왕 계보는 도-아클린이 1620년 무렵까지, 그 뒤를 다코돈우가 1645년까지 다스렸다고 적는다. 다코돈우가 이 지방의 우두머리 단을 죽이고 그 배 위에 궁을 지었다는 이야기가 전하며, '단의 배 안'을 뜻하는 말에서 다호메이라는 이름이 나왔다고 한다. 이는 구술 전승이어서 기록으로 확인되지는 않는다. 이어 우에그바자(1645~1680)가 고원의 이웃 마을들을 하나씩 거두면서 왕국의 틀이 잡혔고, 아카바(1680~1708) 때까지 다호메이는 해안의 알라다 왕국에 조공을 바치는 작은 내륙 나라로 남았다. 이 무렵 대서양 연안의 알라다와 우이다 항구는 유럽 상인에게 노예를 팔아 부유했으나 다호메이는 바다에 닿지 못했다. 다호메이가 군대를 키워 해안으로 나서는 것은 18세기 아가자 때의 일로, 「아가자의 알라다·우이다 정복과 오요의 다호메이 조공(1724~1748)」(뒤의 사건)에서 다룬다. 이 왕국이 성립한 해를 1600년 무렵으로 보는 것은 왕 계보에 기댄 계산이어서, 17세기 후반에야 뚜렷한 나라가 되었다고 보는 연구자도 있다. 고원의 비옥한 흙과 야자 기름, 마을을 둘러싼 방어 시설이 이 작은 나라의 바탕이었다고 설명하며, 왕의 권위는 궁정 의례와 조상에 대한 제사를 통해 이어졌다고 한다. 이 시기 다호메이의 왕명과 재위 해는 18세기에 정리된 왕 계보와 구술에 기대고 있어 해는 어림이다."
  subjects: [dahomey]
  links: []
  tags: [politics, society]
  sources: ["I. A. Akinjogbin, Dahomey and Its Neighbours 1708-1818 (Cambridge University Press, 1967)", "Robin Law, The Slave Coast of West Africa 1550-1750 (Clarendon Press, 1991)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: lozi-1600
  year: 1600
  endYear: 1800
  title:
    ko: "바로체 범람원의 로지 왕국(1600 무렵~1800 무렵)"
  summary:
    ko: "잠베지강 상류의 바로체 범람원은 해마다 강물이 넘쳐 들판이 물에 잠기는 땅으로, 이곳에서 루야나어를 쓰는 사람들이 로지 왕국을 세웠다. 전승은 여성 시조 음보 물레나에서 왕통이 시작되었다고 전하며, 왕국은 17세기에 틀이 잡힌 것으로 본다. 왕은 리툰가라 불렸고, 범람이 시작되면 왕이 평지의 궁정에서 높은 땅의 궁정으로 옮겨 가는 행렬이 쿠옴보카라는 의례로 이어져 왔다. 이 왕국은 범람원의 물고기와 목축, 주변 사람들의 공물로 유지되었다. 18세기 말에는 물람브와 리툰가가 다스리며 이웃 부족들을 거느리는 큰 나라가 되었다고 전한다(재위는 1780년 무렵부터 1830년 무렵까지로 보는 견해가 있으나 1812년부터라고 하는 목록도 있다). 로지 왕국은 이 시기 유럽인과 거의 닿지 않았고 사료는 대부분 19세기에 채록한 구술 전승이다. 1830년대 이후 남쪽에서 올라온 콜롤로의 지배와 그 몰락은 「세벳와네의 콜롤로 왕국과 로지 왕국의 복귀(1845~1864)」(뒤의 사건)에서 다룬다."
  subjects: [lozi-kingdom]
  links: []
  tags: [politics, society, culture]
  sources: ["Mutumba Mainga, Bulozi under the Luyana Kings (Longman, 1973)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)", "Gwyn Prins, The Hidden Hippopotamus (Cambridge University Press, 1980)"]

- id: darfur-1603
  year: 1603
  endYear: 1787
  title:
    ko: "케이라 왕조와 다르푸르 술탄국(1603 무렵~1787)"
  summary:
    ko: "수단 서부의 다르푸르는 투나르 왕조가 다스리다가 케이라 왕조의 술탄들이 이어받았다. 전승은 술라이만 솔롱이 이슬람을 받아들인 새 왕조를 세웠다고 전하며, 그 성립을 1603년 무렵으로 본다. 술라이만의 재위를 1596~1637년으로 보는 견해와 1660년 무렵~1680년 무렵으로 보는 견해가 갈리며, 후자를 따르면 성립은 반세기 넘게 늦어진다. 다르푸르는 마라산 산지를 중심으로 이슬람 학자와 상인을 불러들였고, 술탄 아래 관료를 두어 왕권을 굳혔다. 술탄 무사와 아흐마드 부크르(1720년 무렵 사망)를 거쳐 오마르 렐 때 왕국은 동쪽으로 힘을 뻗었고, 이집트로 가는 낙타 대상로 '40일 길'은 17세기부터 번성했다. 이 길로 상아·타조 깃털과 함께 노예가 이집트로 실려 갔다. 무함마드 타이라브(재위 1753년 무렵~1785년 무렵)는 1785년 무렵 동쪽의 코르도판을 정복해 영토를 크게 넓혔으나 그 직후인 1785~1787년 무렵 숨졌다. 왕위는 아들 압드 알라흐만이 이었다. 이 뒤의 일은 「이집트의 수단 정복과 푼지 술탄국의 끝(1820~1824)」(뒤의 사건)에서 다룬다. 다르푸르 술탄국은 1874년 알주바이르의 정복으로 무너졌고 1898~1916년 알리 디나르 아래 되살아났다가 영국에 정복되어 끝났다. 다르푸르의 술탄들은 이슬람 학자에게 땅을 주고 세금을 면제해 주었으며, 이들 학자가 술탄의 행정을 도와 글을 아는 관료층이 자랐다. 케이라 왕조는 마라산 산지의 농민과 평원의 유목민을 함께 다스렸고, 이 나라의 노예 사냥은 남쪽 변경에서 이루어졌다. 술탄의 도읍은 오래도록 한곳에 고정되지 않고 옮겨 다니다가 18세기 말 알파시르에 자리를 잡았다."
  subjects: [darfur]
  links: []
  tags: [politics, economy, religion]
  sources: ["R. S. O'Fahey and J. L. Spaulding, Kingdoms of the Sudan (Methuen, 1974)", "R. S. O'Fahey, State and Society in Dar Fur (C. Hurst, 1980)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: oyo-empire-1608
  year: 1608
  endYear: 1754
  title:
    ko: "오요 제국의 복귀와 팽창(1608 무렵~1754)"
  summary:
    ko: "서아프리카 요루바 땅의 오요는 1535년 무렵 누페의 공격으로 도읍 오요일레를 잃고 북쪽 보르구 쪽 오요이그보호로 옮겨 가 70년 넘게 망명 생활을 했다(「오요의 성립과 누페의 침입(1300 무렵~1535 무렵)」(앞의 사건)). 오요 제국은 1608년 무렵 오요일레로 돌아와 다시 일어선 것으로 본다(오요이그보호 시기를 1615년 무렵까지로 보는 견해도 있다). 알라핀 아지보예데가 평화를 기리는 베레 축제를 처음 열었고, 알라핀 아비파는 옛 도읍을 다시 사람들로 채우고 의례를 정비했다고 전한다. 알라핀 에구구오조는 요루바 땅 거의 전부를 정복했다고 전한다. 오요의 힘은 기병에서 나왔다. 사바나에서 수입한 말로 중무장 기병을 갖추었으나 남쪽 삼림 지대에서는 말을 기를 수 없어 기병은 주로 북쪽 초원에서 힘을 썼고, 남쪽으로는 약탈과 조공 요구로 나아갔다. 오요 제국은 알라핀 아래에서 재상 격인 바소룬과 오요메시라 불린 귀족 회의가 정치를 맡는 구조였다. 오요는 서쪽 나라들을 속국으로 두었고 1728년 다호메이 침공 뒤 조공을 받았다고 보며 그 해는 갈린다(「아가자의 알라다·우이다 정복과 오요의 다호메이 조공(1724~1748)」(뒤의 사건)). 1754년에는 바소룬 가하의 압박으로 알라핀 라비시와 아웡비오주가 잇달아 자결했다고 전하며, 이때부터 왕권이 흔들리기 시작했다. 가하는 그 뒤 1774년 알라핀 아비오둔에게 처형될 때까지 권력을 쥐었다. 오요의 힘은 말과 함께 도읍을 둘러싼 성벽과 속국에서 거두는 공물에서도 나왔으며, 알라핀의 대리인이 속국 도시에 파견되어 조공을 챙겼다고 한다. 오요일레의 옛 도읍터는 지금 나이지리아 서남부의 올드오요 국립공원 안에 남아 있다."
  subjects: [oyo-empire, dahomey]
  links: []
  tags: [politics, war]
  sources: ["Robin Law, The Oyo Empire c.1600-c.1836 (Clarendon Press, 1977)", "Samuel Johnson, The History of the Yorubas (Routledge, 1921)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: njinga-ndongo-1617
  year: 1617
  endYear: 1671
  title:
    ko: "은징가와 은동고·마탐바, 포르투갈의 벵겔라(1617~1671)"
  summary:
    ko: "앙골라 내륙의 은동고 왕국은 1575년 루안다에 닻을 내린 포르투갈과 노예 무역을 둘러싸고 싸우고 있었다(「루안다 건설과 포르투갈령 앙골라, 은동고와의 전쟁(1575~1599)」(앞의 사건)). 1617년 포르투갈은 남쪽 해안에 벵겔라 요새를 세워 포르투갈령 앙골라의 거점을 늘렸고, 같은 해 은동고에서는 은골라 음반디가 왕위에 올랐다. 그의 누이 은징가는 1621~1622년 루안다에 사절로 가서 협상하고 안나 드 소자라는 이름으로 세례를 받았다. 1624년 음반디가 죽자 은징가가 은동고의 권력을 잡았다. 1626년 포르투갈은 은징가에게 전쟁을 선포했고, 은징가는 동쪽으로 옮겨 1631~1635년 마탐바 왕국을 차지하고 새 근거지로 삼았다. 1641년 네덜란드 공화국의 서인도 회사가 루안다를 점령하자 은징가는 이들과 손잡고 은동고의 땅을 되찾으려 했고, 1647년 콤비 전투에서 네덜란드의 도움으로 포르투갈군을 이겼다. 그러나 1648년 포르투갈이 루안다를 되찾아 네덜란드가 앙골라를 떠났다. 은징가는 1656년 포르투갈과 평화 조약을 맺었고 1663년 12월 17일 숨졌으니 1624년 권력을 잡은 지 39년 만이었다. 누이 카무(바르바라)가 마탐바를 이었다. 은동고는 1671년 포르투갈이 풍구 안동구의 중심지를 차지하면서 독립을 잃었는데, 은징가가 죽은 지 8년 뒤였다. 이 시기 앙골라는 루안다와 벵겔라를 통해 브라질로 실려 가는 노예의 큰 공급지가 되었고, 루안다는 대서양 노예 무역의 가장 큰 출발 항구 가운데 하나가 되었다. 은징가의 외교와 전투는 같은 시대 유럽 문서에 자세히 남아, 그의 이름은 앙골라에서 저항의 상징으로 기억된다."
  subjects: [portuguese-angola, portugal, dutch-republic]
  links: []
  tags: [war, diplomacy, slavery]
  sources: ["John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "Linda M. Heywood, Njinga of Angola: Africa's Warrior Queen (Harvard University Press, 2017)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: mutapa-portuguese-1629
  year: 1629
  endYear: 1693
  title:
    ko: "포르투갈의 무타파 속국화와 로즈위의 반격(1629~1693)"
  summary:
    ko: "잠베지강 남쪽 고원의 무타파 제국은 금과 상아를 모잠비크 해안의 포르투갈 상인에게 팔았다(「무타파 제국의 성립과 대짐바브웨의 쇠퇴(1430 무렵~1480 무렵)」(앞의 사건)). 가치 루세레가 1623년 무렵 죽자 아들 카프란지네가 왕위를 이었으나, 왕위 계승 규칙상 더 유력했던 마부라가 이에 맞섰다. 1629년 포르투갈군이 카프란지네의 군대를 꺾었고, 포르투갈 쪽이 세운 마부라는 포르투갈 왕의 종주권을 인정하고 선교사를 받아들이며 무슬림을 내쫓는다는 조건을 받아들였다. 무타파 제국은 이때부터 포르투갈령 모잠비크의 속국이 되었으나 역사가 스탠 무덴지가 말했듯 조약은 문서상으로만 힘이 있었고, 카프란지네가 1631년 마부라와 포르투갈의 연합군을 물리치기도 했다. 조약 5년 뒤인 1634년 포르투갈은 테테 일대를 프라주라 불리는 땅으로 나누어 정착민에게 주었고 프라주 주인들은 사병을 거느린 지방 우두머리가 되어 약탈로 이익을 챙겼다. 왕위는 마부라(~1652), 시티 카주루쿠무사파(~1663 무렵), 카마라파수 무콤베(~1692 무렵) 등으로 이어졌다. 이 틈에 무타파의 가축 관리인이었던 창가미레 돔보는 소 대여 제도로 세력을 모아 로즈위 국가를 세우고, 1683년 무렵 마웅궤에서 포르투갈군을 꺾었다. 1693년에는 담바라레를 시작으로 포르투갈 시장 도시들을 공격해 대부분을 버리게 했다. 돔보는 1696년 무렵 숨졌다. 무타파의 왕은 이름뿐인 지위로 남았으나, 로즈위 국가는 18세기에도 짐바브웨 고원을 쥐고 포르투갈 상인의 접근을 막았다. 포르투갈은 프라주를 통해 상아와 금, 노예를 모잠비크 섬으로 실어 나르며 이익을 얻었다."
  subjects: [mutapa-empire, portuguese-mozambique, portugal]
  links: []
  tags: [war, politics, economy]
  sources: ["Stan Mudenge, A Political History of Munhumutapa c.1400-1902 (Zimbabwe Publishing House, 1988)", "Allen Isaacman, Mozambique: The Africanization of a European Institution (University of Wisconsin Press, 1972)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: gondar-1632
  year: 1632
  endYear: 1769
  title:
    ko: "파실리데스와 곤다르 시대(1632~1769)"
  summary:
    ko: "에티오피아의 황제 수세뇨스는 예수회의 영향으로 가톨릭으로 개종했으나(1622년) 정교회 신자들의 반란이 커지자 1632년 황제 자리를 아들 파실리데스에게 넘겼다. 파실리데스(재위 1632~1667)는 포르투갈 출신 예수회 선교사들의 땅을 거두어 추방하고 정교회를 되살렸다. 그는 1636년 곤다르를 도읍으로 삼았다고 전하며, 이로써 이동하는 진영 대신 붙박이 궁정이 생겼다. 곤다르는 성채와 교회가 늘어선 도시로 자랐고, 요하네스 1세(재위 1667~1682)를 거쳐 오른 이야수 1세(재위 1682~1706)는 대외 교역을 늘리고 곤다르의 건축을 키운 황제로 기억된다. 1706년 이야수 1세가 죽은 뒤로는 테클라 하이마노트 1세(1706~1708), 테오필로스(~1711), 요스토스(1711~1716), 다윗 3세(1716~1721)를 거치며 황제들이 귀족에게 세워지고 살해되는 일이 되풀이되었다. 바카파(1721~1730)가 중앙의 권위를 되살렸고, 이야수 2세(1730~1755)가 어머니 멘테와브의 섭정을 받았으며 이어 이요아스(1755~1769)가 올랐다. 그러나 1769년 5월 7일 티그라이의 라스 미카엘 세훌이 이요아스를 몰아내고 일주일 뒤 죽이게 했다. 이후 황제는 지방 귀족이 세우는 이름뿐인 자리가 되었다. 이때부터를 제메네 메사핀트('왕자들의 시대')라 하며, 1855년 테오도로스 2세가 이를 끝낼 때까지 이어졌다(「테오도로스 2세와 마그달라 원정(1855~1868)」(뒤의 사건)). 곤다르의 궁궐 단지는 돌로 지은 성채들로 이루어져 오늘날에도 남아 있으며, 이 시기에 지어진 교회들은 벽화와 필사본으로도 이름이 높다. 이 기간에 에티오피아 황제들은 가톨릭과 거리를 두며 포르투갈과의 관계를 거의 끊었다."
  subjects: [ethiopia, portugal]
  links: []
  tags: [politics, religion]
  sources: ["Richard Pankhurst, The Ethiopians: A History (Blackwell, 2001)", "Donald Crummey, Land and Society in the Christian Kingdom of Ethiopia (University of Illinois Press, 2000)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: wadai-1635
  year: 1635
  endYear: 1700
  title:
    ko: "와다이 술탄국의 성립(1635 무렵~1700 무렵)"
  summary:
    ko: "차드 호수 동쪽의 와다이 땅은 15세기 무렵부터 투나르 왕조가 다스렸다. 1635년 무렵 마바 사람 귀족 집안 출신으로 이슬람을 내세운 압드 알카림이 마바와 이웃 작은 집단들을 모아 투나르 왕 다우드를 몰아냈다. 그는 다우드의 딸과 혼인하고 마살리트·다조 같은 집단과도 혼인으로 동맹을 맺어 힘을 굳혔고 우아라를 도읍으로 삼아 콜라크 왕조를 열었다. 이슬람이 국교가 되었지만 평민 대부분은 전통 신앙을 따랐다. 17세기 내내 와다이는 서쪽 다르푸르에 조공을 바쳤으나 세기 끝 무렵 콜라크 야쿠브 아루스가 조공을 거부하고 다르푸르의 공격을 막아 독립을 지켰다. 아들 조다는 남쪽으로 나아가 투나르의 옛 중심지 몬도 일대를 차지했다. 와다이의 재산은 노예 사냥과 노예 무역에서 크게 나왔다."
  subjects: [wadai, darfur]
  links: []
  tags: [politics, war]
  sources: ["R. S. O'Fahey and J. L. Spaulding, Kingdoms of the Sudan (Methuen, 1974)", "Jean-Claude Zeltner, Pages d'histoire du Kanem, pays tchadien (L'Harmattan, 1980)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: dutch-elmina-1637
  year: 1637
  endYear: 1642
  title:
    ko: "네덜란드 서인도 회사의 엘미나 점령과 포르투갈 황금 해안의 끝(1637~1642)"
  summary:
    ko: "기니만의 황금 해안에서 포르투갈은 1482년 엘미나에 상조르즈다미나 성채를 세워 금과 노예 교역을 독점해 왔다. 1590년대 말부터 네덜란드 상인들이 이 해안에 들어와 교역을 트기 시작했고, 1612년 네덜란드 서인도 회사가 모레에 첫 요새 나소를 세웠다. 이 회사는 1621년 대서양 교역의 독점권을 얻었으며, 1630년대 브라질 북동부를 차지한 뒤로 설탕 농장에 필요한 노예를 공급하는 일이 이 회사의 중요한 사업이 되었다. 그래서 네덜란드 공화국은 서아프리카 해안의 노예 공급지를 포르투갈에서 빼앗으려 했다. 1637년 서인도 회사는 포르투갈의 엘미나 성채를 점령하고 이곳을 황금 해안 식민지의 도읍으로 삼았다. 1640년에는 포르투갈이 샤마에 세운 산세바스티앙 요새를 차지했고, 1642년 악심의 산투안토니우 요새를 빼앗아 포르투갈의 마지막 황금 해안 거점이 사라졌다. 포르투갈은 1640년 스페인에서 떨어져 나와 왕국을 되찾은 뒤 네덜란드와 휴전을 맺었으나(1641년), 이 해안의 주도권은 돌아오지 않았다. 네덜란드는 1641년 앙골라의 루안다도 차지해 대서양 노예 무역의 두 거점을 한꺼번에 쥐었고(「은징가와 은동고·마탐바, 포르투갈의 벵겔라(1617~1671)」(앞의 사건)), 엘미나는 1872년 영국에 넘어갈 때까지 약 235년 동안 네덜란드의 황금 해안 중심지로 남았다. 이 뒤 황금 해안에서 노예 수출은 눈에 띄게 늘었다(「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(뒤의 사건)). 엘미나에서 네덜란드는 성채를 지켜 주는 대가로 지역 우두머리들에게 해마다 일정한 지대를 냈다. 성채 안에는 노예를 가두는 지하 감옥도 있었다."
  subjects: [dutch-republic, portugal]
  links: []
  tags: [colonization, war, economy]
  sources: ["Ray A. Kea, Settlements, Trade, and Polities in the Seventeenth-Century Gold Coast (Johns Hopkins University Press, 1982)", "Pieter C. Emmer and Henk den Heijer, Dutch Atlantic Slave Trade (Cambridge University Press, 1990)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: atlantic-slave-trade-1650
  year: 1650
  endYear: 1800
  title:
    ko: "대서양 노예 무역의 정점(1650 무렵~1800 무렵)"
  summary:
    ko: "대서양을 건너 실려 간 아프리카인의 수는 항해 기록을 모은 「노예 무역 자료」(Trans-Atlantic Slave Trade Database) 같은 자료를 바탕으로 1,250만 명에서 1,275만 명 안팎이 배에 올랐고 그 가운데 최대 200만 명이 항해 중 죽었다고 추산한다. 17세기 중반부터 18세기 말까지의 150년은 그중 큰 몫을 차지했는데, 설탕·담배·커피 농장이 아메리카에서 늘고 유럽 나라들이 경쟁적으로 가담했기 때문이다. 1601~1650년에만 포르투갈 배가 약 44만 명을 싣고 갔다는 추산이 있고, 포르투갈과 영국, 스페인, 프랑스, 네덜란드가 차례로 규모가 큰 운반국이 되었다. 잉글랜드는 1672년 왕립 아프리카 회사를 세워 서아프리카 해안의 교역을 독점하게 했고, 1713년 위트레흐트 조약으로 영국은 스페인령 아메리카에 노예를 공급하는 아시엔토 계약을 얻었다(「위트레흐트 조약과 라슈타트 조약」(뒤의 사건)). 노예가 나오는 곳은 앙골라의 루안다·벵겔라와 로앙고 해안, 노예 해안의 우이다, 황금 해안, 비아프라만 같은 여러 곳이었다. 아프리카 쪽에서는 다호메이·오요·아샨티처럼 이 교역으로 총과 직물을 얻어 군대를 키운 나라들이 포로를 팔았으며(「오요 제국의 복귀와 팽창(1608 무렵~1754)」(앞의 사건), 「오세이 투투와 아샨티 제국의 성립(1701~1750)」(뒤의 사건)), 아프리카에 남은 사회는 인구를 잃었다. 한편 사하라 사막을 건너는 무역과 인도양 무역으로도 아프리카인이 노예로 팔려 나갔고, 그 규모는 대서양 쪽과 따로 추산한다. 영국은 1807년 노예 무역을 금지했다(「노예 무역 금지와 시에라리온·감비아 식민지(1807~1821)」(뒤의 사건))."
  subjects: [portugal, england, uk, france, dutch-republic, spain]
  links: []
  tags: [economy, slavery, colonization]
  sources: ["David Eltis and David Richardson, Atlas of the Transatlantic Slave Trade (Yale University Press, 2010)", "Paul E. Lovejoy, Transformations in Slavery (Cambridge University Press, 2012)", "Trans-Atlantic Slave Trade Database (slavevoyages.org)"]

- id: mali-end-1650
  year: 1650
  endYear: 1712
  title:
    ko: "말리 제국의 끝과 세구 왕국의 등장(1650 무렵~1712)"
  summary:
    ko: "13세기 순디아타가 세운 말리 제국은 16세기 송가이에 변방을 잃고 핵심 땅인 니제르강 상류의 만덴으로 줄어들어 있었다(「톤디비 전투와 모로코의 송가이 정복(1591~1599)」(앞의 사건)). 1599년 말리의 왕 마흐무드 4세가 모로코가 세운 아르마 정권이 다스리는 젠네를 공격했으나 패했고, 이후 말리는 바깥으로 힘을 쓰지 못했다. 말리 제국은 1670년 무렵 끝난 것으로 본다. 바마나(밤바라) 사람들이 니아니를 무너뜨렸다는 전승·서술을 근거로 삼는데, 1599년이나 1610년 무렵, 1645년 무렵에 끝났다고 보는 학설도 있다. 만사의 계보는 그 뒤에도 강 상류의 캉가바에서 이름뿐인 권위로 이어졌고, 바마나가 1751년 니아니를 완전히 정복하자 만사는 속국이 되었다. 바마나의 세구는 칼라디앙 쿨리발리(1652~1672 무렵) 때 작은 왕국으로 나타났고 그가 죽은 뒤 단파사리(1672~1697)가 이어 세구코로를 도읍으로 삼았다. 소마(1697~1712)를 거쳐 1712년 칼라디앙의 후손 마마리 비톤 쿨리발리가 지도자가 되어 세구를 새 바마나 왕국의 수도로 만들고 노예 사냥과 군대로 영토를 넓혔다. 비톤은 1755년까지 다스렸으며 그의 뒤로 짧은 재위가 이어지다가 응골로 디아라(1766~1787 무렵)가 왕국을 굳혔다. 이들은 이슬람을 받아들이지 않았고, 세구는 다음 세기 지하드 세력과 맞서는 나라가 된다. 팀북투·젠네 일대의 아르마는 이 사이 세력이 줄어 지역 우두머리로 남았다. 이 시기의 사료는 아랍어 연대기와 구술 전승에 흩어져 있어, 말리 제국이 언제 끝났는지는 학자마다 다르게 정리한다. 니제르강 상류의 말링케 사람들은 금 채취와 농사로 살아가며 나라가 줄어든 뒤에도 정체성을 지켰다."
  subjects: [mali-empire]
  links: []
  tags: [politics, war]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "Richard Roberts, Warriors, Merchants, and Slaves: The State and the Economy in the Middle Niger Valley, 1700-1914 (Stanford University Press, 1987)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: voc-cape-1652
  year: 1652
  endYear: 1713
  title:
    ko: "VOC 케이프 보급소와 코이코이 전쟁(1652~1713)"
  summary:
    ko: "네덜란드 동인도 회사(VOC)는 1602년 설립된 뒤(「네덜란드 동인도 회사의 설립」(앞의 사건)) 네덜란드와 아시아를 오가는 배를 위한 보급소가 필요했다. 1652년 4월 6일 얀 반 리베크가 이끄는 원정대가 테이블만에 닿아 채소밭과 요새를 세웠으며, 이것이 케이프 식민지의 출발이다. 반 리베크는 1662년까지 사령관으로 있었고 자카리아스 바헤나르(1662~1666)와 이어진 여러 사령관을 거쳐 1679년 시몬 반 데르 스텔이 사령관으로 부임했다. 보급소는 곧 땅이 모자라 코이코이 사람들의 목초지를 차지해 갔고, 1659~1660년 첫 코이코이 전쟁이 일어났으며 1660년 코이코이가 땅을 넘겼다. 1673~1677년 두 번째 전쟁으로 회사는 코이코이 사회에 대한 힘을 더 굳혔다. 회사는 자유 시민에게 농장을 주었고 그들은 마다가스카르·모잠비크·아시아에서 데려온 노예를 쓰면서 노예 인구가 빠르게 늘었다. 1685년 프랑스 낭트 칙령이 폐지된 뒤 위그노 피난민이 1688년 무렵부터 케이프로 왔다. 반 데르 스텔은 1679년 스텔렌보스를 세웠고 1691년 첫 총독이 되어 농장 지대를 넓혔으며 그의 아들 빌럼 아드리안(1699~)이 뒤를 이었다. 1713년 천연두가 번져 코이코이 인구가 크게 줄었으며, 1755년에 되풀이된 유행병과 함께 코이코이 사회를 무너뜨렸다는 평가가 있다. 이 뒤 식민지는 안쪽으로 팽창하며 새 국면에 들어선다(「트렉보어의 동진과 케이프 경계, 첫 코사 전쟁(1745~1795)」(뒤의 사건)). 케이프의 노예와 해방 노예, 코이코이 사람들의 혼혈이 늘어난 것도 이 시기의 변화이며, 이들은 뒷날 케이프 유색인 사회의 바탕이 되었다. 케이프타운은 곧 배에 식량과 물을 대 주는 도시로 자랐다."
  subjects: [cape-colony, voc, dutch-republic]
  links: []
  tags: [colonization, society, war]
  sources: ["Hermann Giliomee, The Afrikaners: Biography of a People (University of Virginia Press, 2003)", "Richard Elphick and Hermann Giliomee (eds.), The Shaping of South African Society, 1652-1840 (Wesleyan University Press, 1989)", "The Oxford History of South Africa, vol. 1 (Clarendon Press, 1969)"]

- id: saint-louis-1659
  year: 1659
  endYear: 1677
  title:
    ko: "생루이 건설과 프랑스의 세네갈 상관, 고레(1659~1677)"
  summary:
    ko: "세네갈강 하구의 은다르 섬에는 15세기 무렵부터 월로프 사람들이 살았고, 이곳은 메카로 가는 순례자들이 떠나는 곳이기도 했다. 프랑스는 1638년 하구에서 약 25km 떨어진 보코스 섬에 처음 요새를 세웠으나 홍수가 되풀이되자, 1659년 이 요새를 은다르 섬으로 옮겼다. 이곳을 다스리던 소르의 디아뉴는 해마다 푸른 천 세 조각을 비롯한 물품을 받는 조건으로 정착을 허락했다. 이 정착지가 뒷날 생루이가 된다. 1659년부터 1779년까지 아홉 개의 특허 회사가 차례로 이곳을 맡았고, 1673년 생루이는 프랑스령 세네갈 식민지의 수도가 되었다. 초기 교역품은 노예와 금, 가죽, 밀랍, 용연향이었고 아라비아 고무는 뒤에 중요해졌다. 대서양 쪽의 고레 섬은 네덜란드가 17세기 전반부터 쥐고 있었는데, 프랑스는 네덜란드와의 전쟁 중이던 1677년 고레를 점령했다. 고레는 프랑스가 쥔 노예 수출의 중요한 거점이 되었고, 18세기에는 세네갈의 노예 무역에서 큰 몫을 했다. 이 상관은 해안과 강 하구에 걸린 작은 땅일 뿐 내륙에는 세력이 미치지 못했다(「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(앞의 사건)). 현대 세네갈의 기원이 되는 프랑스령 세네갈은 이 정착지에서 시작되었다. 은다르 섬의 정착지에서는 월로프와 프랑스인 상인이 섞여 살았고, 이곳 상인 가문의 혼혈 후손들이 뒷날 생루이 사회의 중요한 계층이 되었다. 세네갈강 상류의 교역을 둘러싸고 프랑스는 이웃 월로프 왕국과 무어 사람들의 수장들과 해마다 협상해야 했다. 이 정착지는 총독이 이끄는 요새와 병사, 창고가 점차 늘어나면서 상업 도시의 꼴을 갖추었다."
  subjects: [french-senegal, france, dutch-republic]
  links: []
  tags: [colonization, economy]
  sources: ["James F. Searing, West African Slavery and Atlantic Commerce: The Senegal River Valley, 1700-1860 (Cambridge University Press, 1993)", "Philip D. Curtin, Economic Change in Precolonial Africa: Senegambia in the Era of the Slave Trade (University of Wisconsin Press, 1975)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: mascarene-1665
  year: 1665
  endYear: 1767
  title:
    ko: "프랑스의 마스카렌 제도: 부르봉섬과 일드프랑스(1665~1767)"
  summary:
    ko: "마다가스카르 동쪽 인도양의 마스카렌 제도는 사람이 살지 않던 화산섬들로, 프랑스는 1649년 에티엔 드 플라쿠르가 부르봉섬을 영유한다고 선언했다. 1646년부터 1669년 사이 프랑스 반란 병사와 이주민이 이 섬에 처음 자리를 잡았고, 프랑스 동인도 회사는 1665년 정착민을 보내 본격적인 식민을 시작했다. 부르봉섬은 오늘날의 레위니옹으로, 커피와 사탕수수를 키우는 농장 섬이 되어 마다가스카르와 모잠비크에서 노예가 건너왔다. 옆의 섬 모리셔스에는 네덜란드가 1598년부터 짧은 정착을 되풀이하다가 1710년 완전히 버렸고, 1715년 프랑스가 이 섬을 차지해 일드프랑스라 불렀다. 지금의 모리셔스인 이 섬은 1735년부터 1746년까지 총독 마오 드 라부르도네 아래에서 항구 포트루이를 정비하며 인도양 해군 기지로 자랐다. 이 시기 부르봉섬·일드프랑스·세이셸은 하나의 특허 식민지로 묶여 통치되었다. 1767년 7월 14일 프랑스 왕실이 회사에서 두 섬의 통치권을 넘겨받아 왕령 식민지가 되었다. 두 섬은 인도로 가는 항로의 중간 기지이자 인도양 노예 무역의 수요처로서 아프리카 동쪽 해안과 이어졌다. 1810년의 영국의 점령과 파리 조약은 「영국의 모리셔스 점령과 파리 조약(1810~1814)」(뒤의 사건)에서 다룬다. 이 섬들의 농장 사회는 처음부터 노예 노동에 기댔다. 마스카렌 제도에는 로드리게스섬도 들어가는데, 이 섬은 1601년 네덜란드의 지배 아래 있었고 1691년 프랑스 사람들이 정착했다. 날지 못하는 비둘기 무리의 새 도도는 모리셔스에만 살았으나 지금은 멸종했다. 섬 사회의 인구는 유럽인 정착민과 노예, 자유로워진 노예로 이루어졌다."
  subjects: [reunion, french-mauritius, france]
  links: []
  tags: [colonization, economy]
  sources: ["Auguste Toussaint, Histoire de l'île Maurice (Presses universitaires de France, 1971)", "Richard B. Allen, Slaves, Freedmen, and Indentured Laborers in Colonial Mauritius (Cambridge University Press, 1999)", "Pier M. Larson, Ocean of Letters (Cambridge University Press, 2009)"]

- id: mbwila-1665
  year: 1665
  endYear: 1709
  title:
    ko: "음브윌라 전투와 콩고 왕국의 내전(1665~1709)"
  summary:
    ko: "콩고 왕국은 16세기 아폰수 1세 이후 포르투갈과 가깝게 지냈으나 앙골라 총독들이 왕국 남쪽의 광산과 노예 무역에 눈을 돌리면서 관계가 틀어졌다. 포르투갈이 1575년 앙골라 식민지를 세운 뒤 두 나라는 사이에 낀 덴보스 소국들을 놓고 부딪쳤다(「콩고 왕국의 성립과 포르투갈과의 첫 만남(1390 무렵~1491)」(앞의 사건)). 1665년 10월 29일 음브윌라에서 루이스 로페스 드 세케이라가 이끄는 포르투갈군이 콩고군을 꺾었고, 왕 안토니우 1세가 전사했다. 포르투갈 핵심 병력은 화승총병 450명가량에 가벼운 대포 두 문이었고 아프리카인 동맹군 1만 5천 명가량이 함께했으며, 병력 추산은 자료마다 갈린다. 그의 머리는 루안다에 묻혔고, 왕과 두 아들 및 귀족을 합쳐 약 5천 명이 죽거나 사로잡혔다고 한다. 왕의 죽음으로 후계가 정해지지 않아 왕국은 반세기 가까운 내전에 빠졌고, 사로잡힌 귀족들 가운데는 노예가 되어 브라질로 보내진 사람도 있었다. 1678년 무렵 도읍 상사우바도르가 버려졌고 이후 여러 왕가와 소요 같은 지방이 힘을 겨루었다. 1704년 무렵 킴파 비타(도나 베아트리스)는 안토니우 성인의 영이 내렸다고 주장하며 콩고를 하나로 모으자는 안토니우파 운동을 일으켰으나, 1706년 화형당했다. 1709년 페드루 4세가 상사우바도르에 들어가 왕국을 다시 하나로 모았다. 콩고 왕국의 끝을 1665년으로 보지만, 이름뿐인 왕국이 20세기 초까지 이어졌다고 하는 사료도 있다. 이 시기 콩고 땅은 대서양 노예 무역의 큰 공급지가 되었다(「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(앞의 사건)). 왕국의 가장 큰 항구와 지방들은 이 내전 동안 사실상 독립해 노예 무역에 직접 참여했다. 전투 뒤 포르투갈은 콩고 왕의 영토 가운데 소요 같은 해안 지방을 더 쉽게 다룰 수 있게 되었다."
  subjects: [kongo-kingdom, portugal]
  links: []
  tags: [war, politics]
  sources: ["John Thornton, The Kingdom of Kongo: Civil War and Transition, 1641-1718 (University of Wisconsin Press, 1983)", "John Thornton, The Kongolese Saint Anthony: Dona Beatriz Kimpa Vita (Cambridge University Press, 1998)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: mombasa-oman-1696
  year: 1696
  endYear: 1729
  title:
    ko: "오만의 몸바사 포위와 포르투갈의 동아프리카 북부 상실(1696~1729)"
  summary:
    ko: "스와힐리 해안의 몸바사에는 포르투갈이 1590년대에 세운 포트 지저스가 서 있었다. 오만의 야루바 왕조 이맘 사이프 빈 술탄은 1624~1698년 이어진 해상 팽창의 연장선에서 몸바사를 노렸다(「야루바 왕조의 오만: 이맘 선출, 포르투갈 축출과 해상 팽창(1624~1698)」(앞의 사건)). 오만군은 1696년 3월 13일 포트 지저스를 포위했고, 처음에 포르투갈 병사 50~70명과 충성하는 아프리카인 노예 몇백 명이 갇혀 있었다. 굶주림과 병으로 수비대는 줄었고, 잔지바르의 여왕 파투마가 보낸 보급선은 오만군에 잡혀 불탔다. 1697년 9월과 12월 포르투갈 구원대가 일부 닿았으나 소용이 없었으며, 1698년 12월 성채에는 지휘관과 병사 아홉 명, 사제 한 명만 남았다가 12월 13일 함락되어 거의 3년에 걸친 포위가 끝났다. 병으로 포르투갈 병사들이 죽자 파자의 셰이크 다우드가 가족과 다른 아프리카 사람들을 이끌고 방어를 맡았다. 포르투갈 구원 함대는 이레 뒤에야 도착했다. 파투마는 오만으로 끌려갔다가 12년쯤 뒤인 1709년 오만의 속국 통치자로 돌아왔다. 몸바사는 오만이 쥐었고 오만은 펨바섬과 킬와섬도 차지하고 모잠비크섬을 공격했으며, 1699·1700·1701년의 포르투갈 구원 함대는 병과 폭풍으로 실패했다. 포르투갈은 1728년 몸바사를 되찾았으나 1729년 다시 잃었고, 이때부터 포르투갈의 세력은 모잠비크 북부에서 줄어든다. 1741년 이후 몸바사에서는 마즈루이 가문이 힘을 얻었다. 포트 지저스는 지금도 몸바사에 남아 있는 성채로, 이때의 포위전은 인도양 서쪽에서 포르투갈의 영향력이 약해지는 길목으로 꼽힌다."
  subjects: [yaruba-dynasty, portugal, portuguese-mozambique]
  links: []
  tags: [war, colonization]
  sources: ["G. S. P. Freeman-Grenville, The East African Coast: Select Documents (Clarendon Press, 1962)", "Justus Strandes, The Portuguese Period in East Africa (East African Literature Bureau, 1961)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: loango-slave-coast-1700
  year: 1700
  endYear: 1787
  title:
    ko: "로앙고 해안의 노예 무역과 로앙고 왕국의 쇠퇴(1700 무렵~1787)"
  summary:
    ko: "콩고강 북쪽 대서양 해안에서 빌리 사람들의 로앙고 왕국은 왕 마로앙고가 다스리는 나라로, 이웃 카콩고·응고요와 함께 해안의 세 왕국으로 불렸다(「로앙고 왕국의 등장과 콩고 북쪽 해안(1561 무렵~1600 무렵)」(앞의 사건)). 18세기에 로앙고와 말렘보, 카빈다 항구는 구리와 상아, 천을 거래하다가 점차 노예를 사고파는 곳으로 바뀌었다. 이 항구들에는 프랑스·영국·네덜란드·포르투갈 상인이 모여들어 서로 경쟁했으며, 아프리카 쪽 상인들은 내륙의 시장에서 데려온 포로를 해안에서 유럽 배에 넘겼다. 이 무역은 해안 왕들과 항구의 상인들에게 직물과 총, 술을 안겨 주었으나 내륙에서 사람이 빠져나가면서 농업과 수공업이 약해졌다. 왕국의 마로앙고는 항구 관리를 둘러싼 가문 사이의 다툼과 이웃 왕국의 독립 경향으로 권위가 줄었고, 1787년 무렵 왕이 죽은 뒤 후계가 정해지지 않은 긴 공위기가 시작되었다. 로앙고 왕국의 끝을 1787년으로 보지만, 이름뿐인 왕의 계보는 19세기 말까지 이어졌다는 사료도 있다. 해안의 노예 수출은 왕국이 약해진 뒤에도 19세기 초까지 이어졌다. 이 항구들이 유럽 상인에게 팔려 간 사람들의 일부는 브라질과 카리브해 농장으로 갔다(「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(앞의 사건)). 유럽 상인은 해안에 상관을 두지 않고 배를 앞바다에 댄 채 마푸크라 불린 현지 관리와 거래했다. 17세기 절정기에 로앙고의 영향은 카타리나곶에서 콩고강 하구 가까이에 이르렀고, 왕국에는 빌리 말고도 욤베·쿠니·룸부·바봉고 사람이 있었다. 마로앙고의 궁정에서는 해안 상인들이 유럽 상인과의 흥정에서 왕의 허락을 얻어야 했으며, 항구 관리인이 그 관세를 걷었다."
  subjects: [loango-kingdom, portugal, france]
  links: []
  tags: [economy, slavery, politics]
  sources: ["Phyllis M. Martin, The External Trade of the Loango Coast 1576-1870 (Clarendon Press, 1972)", "John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: asante-1701
  year: 1701
  endYear: 1750
  title:
    ko: "오세이 투투와 아샨티 제국의 성립(1701~1750)"
  summary:
    ko: "오늘날 가나 중부의 숲 지대에서 아칸어를 쓰는 작은 나라들은 17세기 말까지 서남쪽 덴키라 왕국에 조공을 바쳤다. 오세이 투투는 1660년 무렵 코코푸 아니남에서 태어나 덴키라 궁정에서 자랐고, 1677년 무렵 쿠와만 땅의 의자를 이어받은 뒤 군대를 씨족 경계를 넘는 부대로 개편하고 이웃 작은 나라들을 모았다. 전승에 따르면 사제 오콤포 아노키에가 하늘에서 황금 의자를 내려오게 했고 이것이 아샨티 연합의 통일을 상징하게 되었다고 한다. 오세이 투투는 새 도읍 쿠마시를 세우고 오드위라 축제를 만들었다. 1701년 페야세 전투에서 아샨티군이 덴키라를 꺾고 왕 은팀 기아카리를 죽였으며, 이것이 아샨티 제국 성립의 해로 꼽힌다. 아샨티는 이어 아키엠이 다투던 땅과 웬치, 트위포, 와사, 아오윈을 차지했다. 1717년 10월 오세이 투투는 아키엠군에 쫓겨 프라강을 건너다가 총에 맞아 죽었고, 그의 군대는 천연두도 앓고 있었다고 한다. 그의 시신은 찾지 못했다. 후계 문제를 정리한 뒤 대조카 오포쿠 와레가 1720년 무렵 아샨티의 왕(아산테헤네)이 되어 1750년까지 다스리며 북쪽으로 영토를 크게 넓혔고, 1722년에는 보노까지 아샨티의 영향 아래 들어갔다. 이 제국은 금과 노예 교역으로 해안의 유럽 상인과 이어졌고, 19세기 영국과의 충돌은 「영국–아샨티 전쟁과 골드코스트 식민지(1824~1874)」(뒤의 사건)로 이어진다. 아샨티 군대는 총기로 무장한 보병이 중심이었고, 해안의 유럽 상인에게서 총과 화약을 사들이는 일이 대외 정책의 중요한 부분이었다. 쿠마시는 길이 모이는 곳에 있어 내륙 교역의 중심으로 자랐다. 아샨티의 연합 구조에서 각 지방의 왕은 쿠마시의 아산테헤네에게 충성을 맹세했다."
  subjects: [asante]
  links: []
  tags: [politics, war]
  sources: ["Ivor Wilks, Asante in the Nineteenth Century (Cambridge University Press, 1975)", "Ivor Wilks, Forests of Gold: Essays on the Akan and the Kingdom of Asante (Ohio University Press, 1993)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: agaja-ouidah-1724
  year: 1724
  endYear: 1748
  title:
    ko: "아가자의 알라다·우이다 정복과 오요의 다호메이 조공(1724~1748)"
  summary:
    ko: "다호메이 왕국은 17세기 내내 바다에 닿지 못한 내륙 나라였으나, 아가자(재위 1708~1740)는 총기를 갖춘 군대를 키워 해안 노예 무역의 중심지를 노렸다(「아보메 고원의 다호메이 왕국 성립(1600 무렵~1700 무렵)」(앞의 사건)). 1724년 아가자는 해안의 알라다 왕국을 정복했고, 1727년에는 유럽 상관들이 모여 있던 우이다 항구를 차지해 대서양 노예 무역 항구를 손에 넣었다. 이로써 다호메이는 포로를 팔아 총과 화약, 직물을 얻는 나라가 되었다. 그러나 이 팽창은 북쪽의 오요 제국과 부딪쳤다. 오요는 1728년 기병을 앞세워 다호메이를 침공했는데, 다호메이의 총소리에 놀란 말들이 흩어지는 가운데 나흘 동안 싸운 끝에 오요가 이겼다고 한다. 오요는 이후에도 여러 차례 침공한 끝에 다호메이를 굴복시켜 조공을 받았다. 조공이 시작된 해는 문서마다 다르다. 1730년 무렵으로 보는 견해가 많으나 1732년이라고도 하고, 오요 문서는 1748년에 다호메이가 조공국이 되었다고 적는다. 아가자의 뒤를 이은 테그베수(재위 1740~1774)는 오요에 매년 공물을 바치면서 노예 무역으로 왕국을 키웠고, 1748년 협정으로 이 종속이 굳었다고 본다. 오요에 대한 조공은 1823년 다호메이가 반기를 들 때까지 이어졌다. 이 조공의 규모는 나중에 해마다 큰 액수로 어림되었으나 해마다 달랐다. 우이다 정복으로 해안의 유럽 상관들은 다호메이 왕의 통제를 받게 되었고, 우이다에서 나가는 노예의 몫은 18세기 중엽 서아프리카 노예 해안에서 가장 컸던 항구 가운데 하나였다. 다호메이는 1730년대 이후 군대를 훈련시키고 화기를 사들이는 데 힘을 쏟았다."
  subjects: [dahomey, oyo-empire]
  links: []
  tags: [war, politics, slavery]
  sources: ["I. A. Akinjogbin, Dahomey and Its Neighbours 1708-1818 (Cambridge University Press, 1967)", "Robin Law, The Slave Coast of West Africa 1550-1750 (Clarendon Press, 1991)", "Robin Law, The Oyo Empire c.1600-c.1836 (Clarendon Press, 1977)"]

- id: fouta-djallon-1725
  year: 1725
  endYear: 1751
  title:
    ko: "푸타잘롱 지하드와 이맘국의 성립(1725~1751)"
  summary:
    ko: "서아프리카 기니 고원의 푸타잘롱에는 풀라니 목동 집단이 오래 들어와 살았고, 이슬람 학자 집안인 토로드베 사람들도 그 속에 있었다. 이들은 17세기 말부터 일부 풀라니와 말링케 이슬람 신자들을 모아 수수·얄룬카 같은 이웃 비무슬림 집단에 맞서는 지하드를 준비했다. 1725년 이슬람 학자 알파 바가 지하드를 일으켰다. 그의 아들 이브라힘 삼베구는 이후 카라모코 알파('학식 있는 알파')라 불렸고, 1727년 탈란산 전투에서 결정적으로 이겨 얄룬카를 몰아냈다. 이 승리로 푸타잘롱은 하나의 나라가 되었고 카라모코 알파는 첫 알마미('믿는 이들의 지휘관')가 되었다. 알마미는 종교와 정치의 우두머리였으며 도읍은 팀보에 두었다. 카라모코 알파는 1751년 숨졌고 이브라힘 소리가 뒤를 이어 이슬람 국가의 틀을 굳혔다. 이 지하드는 서아프리카에서 이슬람 학자들이 일으킨 뒤의 여러 지하드의 앞선 보기로 꼽힌다(「우스만 단 포디오의 지하드와 소코토 칼리프국(1804~1837)」(뒤의 사건)). 푸타잘롱 이맘국의 알마미 자리는 소리가 죽은 뒤 두 가문 알파야와 소리야 사이의 다툼이 되었다가 1845년 2년씩 번갈아 맡기로 합의되었다. 이 나라는 지하드 때 붙잡은 사람들을 노예로 부려 농사와 목축에 썼고, 노예를 해안에 팔기도 했다. 푸타잘롱은 이후 학교와 이슬람 학자 공동체로 이름이 높아 서아프리카 이슬람 교육의 중심지 가운데 하나가 되었다. 풀라니는 본래 소를 치며 이동하던 사람들인데, 지하드 이후 정착한 귀족 층과 목동 층으로 나뉘었고 노예 노동에 기대는 마을이 늘었다. 알마미의 뜻에 따라 지방 우두머리들이 각 지구를 맡아 다스렸다."
  subjects: [fouta-djallon]
  links: []
  tags: [religion, war, politics]
  sources: ["Walter Rodney, A History of the Upper Guinea Coast 1545-1800 (Clarendon Press, 1970)", "Thierno Diallo, Les institutions politiques du Fouta Dyalon au XIXe siècle (IFAN, 1972)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: cape-frontier-1745
  year: 1745
  endYear: 1795
  title:
    ko: "트렉보어의 동진과 케이프 경계, 첫 코사 전쟁(1745~1795)"
  summary:
    ko: "케이프 식민지는 18세기에 안쪽으로 번졌다. 네덜란드 동인도 회사의 통제 밖에서 가축을 몰고 내륙으로 들어간 유럽계 목축민을 트렉보어라 하며, 이들은 코이코이·산 사람의 목초지와 샘을 차지했고 산 사람은 코만도 습격으로 쫓기거나 죽었다. 1745년 무렵 회사는 스웰렌담 지구를 열어 행정을 변경으로 옮기려 했다. 1779년 회사가 그레이트피시강을 식민지 동쪽 경계로 정했으나 많은 코사 사람들이 이미 그 서쪽에 살고 있었다. 그해 12월 가축 도둑질 혐의를 둘러싼 충돌로 첫 코사 전쟁(1779~1781)이 시작되었다. 1780년 11월 총독 판 플레턴베르흐가 강 전체를 경계라고 선언했고, 아드리안 판 야르스펠트의 코만도는 코사를 강 동쪽으로 몰아내려 했다. 이 코만도는 협상에 나온 잘람바 추장을 비롯해 100~200명을 쏘아 죽였다고 추산하며, 추장 여럿의 가축을 약탈했다. 판 야르스펠트가 1781년 7월 19일 코만도를 해산한 뒤 코사 사람들은 곧 그 땅으로 돌아왔다. 1786년 변경에 흐라프레이넛이 세워졌고, 1795년 흐라프레이넛과 스웰렌담의 시민들이 회사 통치에 반기를 들었다. 같은 해 영국이 케이프를 처음 점령하면서 회사의 지배는 끝났다(「네덜란드 동인도 회사의 해산과 네덜란드령 동인도(1795~1800)」(뒤의 사건), 「영국의 케이프 영구 점령과 1820년 이주민(1806~1820)」(뒤의 사건)). 이 시기의 변경에서 산 사람들은 땅을 잃고 살해되었으며, 일부는 농장 노동자로 편입되었다. 변경의 트렉보어는 회사 관리가 닿기 어려운 곳에서 스스로 권위를 세웠고, 이런 독립 성향은 뒷날 보어 사람들의 정체성으로 이어졌다."
  subjects: [cape-colony, voc]
  links: []
  tags: [colonization, war, society]
  sources: ["Hermann Giliomee, The Afrikaners: Biography of a People (University of Virginia Press, 2003)", "Richard Elphick and Hermann Giliomee (eds.), The Shaping of South African Society, 1652-1840 (Wesleyan University Press, 1989)", "The Oxford History of South Africa, vol. 1 (Clarendon Press, 1969)"]

- id: swazi-1745
  year: 1745
  endYear: 1780
  title:
    ko: "스와지 왕국의 성립(1745 무렵~1780 무렵)"
  summary:
    ko: "오늘날 스와질란드의 땅에는 18세기 중엽 나라의 밑바탕이 놓였다. 전승에 따르면 은과네 3세가 이끈 은과네 사람들은 인도양 쪽 델라고아만 일대에서 남서쪽으로 옮겨 와 퐁골라강 일대에 자리를 잡았다. 그는 1745년 무렵부터 1780년 무렵까지 다스린 것으로 보며, 중심지를 응들반데 일대에 두었다고 한다. 이 정착은 이웃 응구니어를 쓰는 집단과의 싸움과 동맹으로 이루어졌는데, 은과네는 남쪽 은드완드웨 쪽 추장들의 세력과 부딪치기 시작했다. 스와지 사람들은 이 땅에서 소 방목과 농사로 살았고, 왕과 왕의 어머니가 함께 나라를 이끄는 전통을 세웠다. 은과네 3세가 1780년 무렵 죽은 뒤 왕위는 그의 후손들이 이었다. 이 왕국은 영국령 스와질란드로 이어지는 나라의 뿌리로 보며, 소부자 1세(1815 무렵~)가 나라를 크게 굳혔다(「므페카네: 남부 아프리카의 전쟁과 새 나라들(1818~1840)」(뒤의 사건)). 사료는 구술 전승이 대부분이어서 연대는 어림이다."
  subjects: [swaziland-protectorate]
  links: []
  tags: [politics, society]
  sources: ["Philip Bonner, Kings, Commoners and Concessionaires: The Evolution and Dissolution of the Nineteenth-Century Swazi State (Cambridge University Press, 1982)", "J. S. M. Matsebula, A History of Swaziland (Longman, 1972)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: majeerteen-1750
  year: 1750
  endYear: 1800
  title:
    ko: "마제르테인 술탄국과 18세기 소말리 해안(1750 무렵~1800 무렵)"
  summary:
    ko: "아프리카의 뿔 북동쪽 끝, 지금 소말리아 북동부의 해안에는 다롯 씨족 연합에 속하는 마제르테인 사람들이 살았다. 마제르테인 술탄국의 성립은 1750년 무렵으로 본다(위키백과는 15~16세기 기원설도 싣는다). 이 해안의 항구 알룰라와 바리 지방은 유향과 수지, 가죽을 아라비아반도와 오만, 인도양 건너 인도로 내다 파는 교역에 이어져 있었다. 술탄국 성립 이전에도 마제르테인의 씨족 어른들이 이 교역로를 지키고 이익을 나누었고, 술탄국이라는 틀은 이 씨족 연합이 우두머리를 모시면서 굳어진 것으로 본다. 사료는 구술 전승이 대부분이어서 1750년 무렵이라는 성립 해는 어림이다."
  subjects: [majeerteen-sultanate]
  links: []
  tags: [politics, economy]
  sources: ["I. M. Lewis, A Pastoral Democracy (Oxford University Press, 1961)", "Lee V. Cassanelli, The Shaping of Somali Society (University of Pennsylvania Press, 1982)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: funj-hamaj-1762
  year: 1762
  endYear: 1800
  title:
    ko: "하마즈 섭정과 푼지 술탄국의 쇠퇴(1762~1800)"
  summary:
    ko: "푼지 술탄국은 17세기 바디 2세(재위 1644~1681) 때 센나르를 붙박이 도읍으로 삼고 잇달아 영토를 넓혔으며, 센나르는 이집트로 가는 대상의 길목에서 아프리카에서도 손꼽히는 교역 도시로 이름이 났다. 술탄은 금과 대상 무역을 쥐고 노예를 이집트로 보냈는데, 한 해에 최대 천 명 안팎의 노예 대상이 간다고 기록되었다. 바디 4세(1724~1762)는 1744년 딘데르강에서 에티오피아 황제 이야수 2세의 침입을 막아 영웅이 되었으나 왕실의 노예 군대와 서쪽·남쪽 변경에서 온 측근에게 기대어 옛 귀족을 숙청했다. 이 틈에 하마즈 사람 무함마드 아부 리카일리크가 귀족들의 지원을 얻어 1762년 3월 센나르를 차지하고 아들 나시르를 꼭두각시 술탄으로 세운 채 섭정으로 권력을 쥐었다(섭정의 시작 해는 사료마다 갈려 1769년을 적은 목록도 있다). 그는 1755년 무렵 이미 코르도판을 근거지로 삼았다가, 다르푸르가 1785년 무렵 코르도판을 정복해 1821년까지 쥐게 되었다. 푼지는 1782년 무렵 동골라를 샤이키야에 잃고, 1791년 뒤에는 타카를 잃었으며, 1800년 무렵 술탄의 실권은 게지라 일대로 줄었다. 푼지가 이처럼 도시 몇 곳이 맞서는 내전 속에 잘게 쪼개지는 사이 이집트 군대가 내려오는 시기가 다가왔다(「이집트의 수단 정복과 푼지 술탄국의 끝(1820~1824)」(뒤의 사건)). 하마즈 섭정은 푼지 술탄의 이름을 빌려 실권을 쥐었고, 술탄은 이후 이름뿐인 자리로 남았다. 센나르의 상인들은 청나일강 유역에서 이집트와 에티오피아, 홍해 쪽을 잇는 길목에서 이익을 얻었으나 내전으로 대상로가 위험해졌다. 이 기간의 사료는 센나르 궁정의 연대기와 방문한 여행자의 기록에 기대고 있다."
  subjects: [funj-sultanate, darfur, ethiopia]
  links: []
  tags: [politics, war]
  sources: ["R. S. O'Fahey and J. L. Spaulding, Kingdoms of the Sudan (Methuen, 1974)", "Jay Spaulding, The Heroic Age in Sinnar (Michigan State University Press, 1985)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: spanish-guinea-1777
  year: 1777
  endYear: 1781
  title:
    ko: "산일데폰소·엘 파르도 조약과 스페인령 기니의 시작(1777~1781)"
  summary:
    ko: "스페인은 노예 무역에 필요한 노예를 외국 상인에게 사야 했고 아프리카에 자기 기지가 없었다. 반면 포르투갈은 1472년 기니만의 비오코에, 1470년대에 안노본에 닿았지만 두 섬을 실제로 다스리지 않았다. 남아메리카에서 라플라타강 하구를 둘러싸고 다투던 두 나라는 1777년 10월 1일 산일데폰소 조약으로 화해했고, 이 조약으로 스페인은 포르투갈에서 안노본과 페르난도포(지금의 비오코)를 넘겨받는 길을 얻었다. 1778년 3월 11일 엘 파르도 조약으로 스페인은 이 섬들과 니제르강에서 오고웨강 사이 기니 해안에서 교역할 권리를 얻었다. 이것이 스페인령 기니의 시작이다. 스페인은 아르헬레호스 백작이 이끄는 원정대를 1778년 보냈으나 황열병과 반란, 기후와 보급난으로 원정은 크게 무너졌다. 백작은 1780년 죽었고 스페인 관리는 1780~1781년 사이 섬에서 철수했다. 스페인이 비오코에 실제로 다시 깃발을 세우는 것은 1827~1843년 영국의 해군 기지를 거친 1843년이다. 따라서 이 사건의 의미는 땅을 다스리는 것보다 스페인의 권리가 국제 조약으로 처음 정해진 데 있다. 스페인 쪽에서는 이 조약으로 얻은 해안이 아프리카 노예를 직접 사들일 수 있는 새 기지가 되기를 기대했다. 이 일은 조약의 문서가 나온 해와 스페인이 실제로 닿은 해를 구분해서 읽어야 한다. 조약의 결과로 포르투갈은 남아메리카의 일부 땅을 얻는 대신 아프리카 섬들을 스페인에 넘겼다고 설명한다. 그러나 두 나라 모두 이 섬들을 직접 가꿀 힘이 부족했다. 따라서 이때 생긴 법적 권리는 19세기에 스페인이 다시 이 섬을 요구하는 근거가 되었다."
  subjects: [spanish-guinea, spain, portugal]
  links: []
  tags: [diplomacy, colonization]
  sources: ["Ibrahim K. Sundiata, From Slaving to Neoslavery: The Bight of Biafra and Fernando Po in the Era of Abolition (University of Wisconsin Press, 1996)", "Max Liniger-Goumaz, Small Is Not Always Beautiful: The Story of Equatorial Guinea (C. Hurst, 1988)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: sierra-leone-1787
  year: 1787
  endYear: 1800
  title:
    ko: "시에라리온의 자유 흑인 정착지와 프리타운(1787~1800)"
  summary:
    ko: "영국은 미국 독립 전쟁 뒤 런던 거리에 늘어난 가난한 흑인들을 '흑인 빈민 구제 위원회'를 통해 아프리카로 보내기로 했다. 1787년 약 400명이 시에라리온 반도에 닿아 코야 템네 우두머리들에게서 산 땅에 그랜빌 타운을 세웠으나, 질병과 이웃 사이의 갈등으로 힘들었고 1789년 제임스 왕이 이 마을을 불태웠다. 1791년 시에라리온 회사가 세워져 새 정착을 준비했다. 그해 5월 30일 영국 의회가 시에라리온 회사법을 통과시켰고(찬성 87, 반대 9), 그랜빌 샤프가 1790년 '아프리카의 자유 영국 땅'이라는 취지서를 펴내 이 일을 밀었으며 헨리 손턴이 법안을 의회에서 이끌었다. 존 클라크슨이 핼리팩스에서 이끈 흑인 정착민은 1,100명이 넘었다. 같은 해 노바스코샤에서 온 미국 출신 흑인 토머스 피터스가 영국에서 이주민의 불만을 알렸고, 회사는 노바스코샤에서 이주할 사람을 모으려고 해군 장교 존 클라크슨을 보냈다. 1792년 3월 11일 노바스코샤 정착민들이 목화나무 곁에 프리타운을 세웠고 클라크슨이 첫 총독이 되었다. 1800년 노바스코샤 정착민들이 반란을 일으켰으나 그해 자메이카에서 온 약 550명의 마룬이 도착해 진압을 도왔고, 마룬은 따로 마룬 타운을 받았다. 이 식민지는 노예 무역 반대 운동과 이어져 있었고, 1807년 이후의 변화는 「노예 무역 금지와 시에라리온·감비아 식민지(1807~1821)」(뒤의 사건)에서 다룬다. 정착민의 상당수는 미국 독립 전쟁 때 영국 편에서 싸운 흑인이었고, 영국이 이들에게 땅을 약속했으나 지키지 않은 일이 이주의 배경이 되었다. 이주민들은 영어를 쓰는 개신교 신자가 많아 현지 템네와는 다른 사회를 이루었다."
  subjects: [uk]
  links: []
  tags: [colonization, society]
  sources: ["Christopher Fyfe, A History of Sierra Leone (Oxford University Press, 1962)", "James W. St. G. Walker, The Black Loyalists (Africana Publishing, 1976)", "Cassandra Pybus, Epic Journeys of Freedom (Beacon Press, 2006)"]

- id: andrianampoinimerina-1787
  year: 1787
  endYear: 1810
  title:
    ko: "안드리아남포이니메리나와 메리나의 통일(1787~1810)"
  summary:
    ko: "마다가스카르 중앙 고원의 이메리나는 앞서 왕 안드리아마시나발로나가 나라를 네 아들에게 나누어 준 뒤 네 소국으로 갈라져 오래 싸웠다(「이메리나 고원과 메리나 왕국의 성립(1540 무렵~1612)」(앞의 사건)). 안드리아남포이니메리나는 1745년 무렵 태어났으며 1787년 삼촌 안드리안자피를 몰아내고 암보히망가의 왕이 되었다. 그는 암보히망가를 도읍이자 정신적 중심지로 삼았다. 1793년 안타나나리보를 정복했고 1794년 정치적 도읍을 그곳으로 옮겼으며, 1795년까지 이메리나가 가장 컸을 때의 영토를 되찾아 네 소국을 다시 하나로 합쳤다. 그는 논의 물을 대는 관개를 늘려 농업을 키우고 시장과 법을 정비했다고 전한다. 1800년 무렵부터는 바깥으로 나아가 베칠레오, 시하나카, 베자노자노, 바라 땅으로 지배를 넓혔다. 그가 1810년 죽자 열여덟 살의 아들 라다마 1세가 왕위를 이었고, 이 아들의 시대에 메리나는 섬 대부분을 아우르는 나라로 커진다(「라다마 1세와 메리나 왕국의 확장(1817~1828)」(뒤의 사건)). 이 통일은 이메리나가 유럽인과 만나기 앞선 시기에 섬 안에서 이루어졌다. 그는 백성에게 논농사를 장려하고 시장에서 공정하게 거래하도록 명령하며 나라의 법을 직접 선포했다고 전해지며, 이는 이메리나가 통일된 뒤의 안정을 보여 주는 이야기로 자주 인용된다. 그가 쌓은 군사 조직은 아들 때 섬 곳곳으로 원정을 보내는 바탕이 되었다. 그의 재위 동안 마다가스카르 해안의 상인들이 노예와 총을 거래하는 항구와의 접촉도 늘었다. 안타나나리보는 이메리나의 곡창 지대를 내려다보는 언덕에 있어 도읍으로 알맞았다."
  subjects: [merina-kingdom]
  links: []
  tags: [politics, war]
  sources: ["Mervyn Brown, A History of Madagascar (Damien Tunnacliffe, 1995)", "Stephen Ellis, The Rising of the Red Shawls (Cambridge University Press, 1985)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: buganda-expansion-1700
  year: 1700
  endYear: 1800
  title:
    ko: "부간다 왕국의 팽창과 부뇨로(1700 무렵~1800 무렵)"
  summary:
    ko: "빅토리아 호수 북쪽 기슭의 부간다 왕국은 16세기 부뇨로의 침입으로 카바카 나키벵게가 죽고도 독립을 지켰고(「대호수 지역 왕국들과 부간다의 성립(1300 무렵~1500 무렵)」(앞의 사건)), 17~18세기에는 도리어 부뇨로의 땅을 차츰 차지해 갔다. 부뇨로는 늘 수세에 몰려 부간다 군대의 습격을 받았다. 부간다는 부두를 정복했고 부소가와 카라궤의 일부를 차지했으며 코오키는 조공국이 되었다. 정복한 땅의 옛 우두머리는 카바카가 임명한 군사 지도자로 갈아 치워 나라의 통일을 굳혔다. 추장 자리도 세습에서 카바카가 임명하는 쪽으로 옮겨 갔다. 카굴루(1674~1704)는 공주 은데게 나솔로가 이끈 추장과 왕자들의 반란을 겪었고 뒷날 빅토리아호에서 익사했다고 한다. 군대는 지구별로 장정을 모으는 징집 방식이었고, 각 지구의 추장이 왕의 부름에 따라 병사를 냈다. 카바카 키아바구(1750 무렵~1780 무렵) 때 파란 구슬이 나라의 화폐가 되었고, 그 뒤 주누(1790 무렵~1800 무렵)를 거쳐 세마쿠쿠로의 시대로 이어졌는데 이 두 왕의 재위 해는 학설마다 다르다. 1800년 무렵까지 부간다는 호수 지대에서 가장 강한 나라가 되었다. 이 나라가 19세기 영국과 만난 일은 「제국 영국 동아프리카 회사와 우간다·동아프리카 보호령(1888~1895)」(뒤의 사건)에서 다룬다. 카바카는 정복지에 임명한 지방관을 통해 공물과 병사를 거두었고, 도읍은 이 시기에 왕의 이동에 맞춰 옮겨 다녔다. 이 중앙 집권의 틀이 19세기 부간다가 유럽인과 이슬람 상인을 만나 변모하는 바탕이 되었다. 카바카의 군사력은 내륙의 징집 병사에 기댔고, 부소가에서 얻은 철과 상아 교역도 왕의 수입이 되었다."
  subjects: [buganda]
  links: []
  tags: [politics, war]
  sources: ["John Rowe, Lugard at Kampala (Longmans, 1969)", "Richard Reid, Political Power in Pre-Colonial Buganda (James Currey, 2002)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]

- id: busaid-zanzibar-1744
  year: 1744
  endYear: 1800
  title:
    ko: "부사이드 왕조와 동아프리카 해안: 잔지바르·킬와의 노예 무역(1744~1800)"
  summary:
    ko: "오만은 1698년 몸바사에서 포르투갈을 몰아낸 뒤 잔지바르와 동아프리카 해안의 항구를 오만의 해외 영토로 삼았다(「오만의 몸바사 포위와 포르투갈의 동아프리카 북부 상실(1696~1729)」(앞의 사건)). 그러나 1718년 이래 오만에는 내전이 이어졌고, 페르시아의 침공을 물리친 아흐마드 빈 사이드가 1744년 이맘으로 뽑혀 부사이드 왕조를 열었다(「페르시아의 오만 침공과 아흐마드 빈 사이드, 부사이드 왕조(1737~1749)」(앞의 사건)). 새 왕조가 본국을 안정시키는 사이 동아프리카 해안의 도시들은 사실상 스스로 다스리는 때가 많았고, 몸바사에서는 마즈루이 가문이 오만에 맞서 힘을 키웠다. 이 해안에서는 인도양 건너 오만·페르시아만의 노예 수요와 함께 프랑스령 마스카렌 제도의 노예 수요가 늘었다(「프랑스의 마스카렌 제도: 부르봉섬과 일드프랑스(1665~1767)」(앞의 사건)). 1776년 킬와의 술탄은 프랑스 상인 모리스와 해마다 노예 천 명을 마스카렌 제도로 보내기로 계약했다고 전한다. 부사이드 쪽은 1780년대 중반 킬와와 잔지바르에 대한 영향력을 늘리려 했으나 이 시기의 오만 지배는 해안 도시들에 대한 느슨한 종주권에 가까웠다. 19세기 사이드 빈 술탄이 잔지바르로 도읍을 옮기고 정향 농장과 노예 무역을 키우는 일은 「사이드 빈 술탄의 잔지바르와 정향·노예 무역(1840~1873)」(뒤의 사건)에서 다룬다. 이 시기의 사료는 포르투갈·프랑스 상인의 기록이 중심이어서, 오만 쪽의 의도는 비교적 적게 남아 있다. 요컨대 18세기 동안 오만의 동아프리카 지배는 이름이 앞서고 실권은 적은 편이었다. 그 사이 해안 도시의 술탄들은 오만과 프랑스를 오가며 자기 이익을 챙겼다."
  subjects: [busaid-oman, france]
