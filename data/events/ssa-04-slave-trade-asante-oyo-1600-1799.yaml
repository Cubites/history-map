  tags: [economy, slavery, politics]
  sources: ["G. S. P. Freeman-Grenville, The French at Kilwa Island (Clarendon Press, 1965)", "Abdul Sheriff, Slaves, Spices and Ivory in Zanzibar (James Currey, 1987)", "The Cambridge History of Africa, vol. 4 (Cambridge University Press, 1975)"]
