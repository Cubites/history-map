# 남아시아 사건 8차 묶음(sa-08): 분할과 독립에서 오늘까지 — 인도·파키스탄·방글라데시·스리랑카·네팔·부탄·시킴·몰디브 (1947 ~ 2026년 기준)
# 범위: 영국령 인도의 분할과 난민·카슈미르 전쟁과 휴전선·토후국 통합과 하이데라바드·칼라트의 가입·간디 암살·실론의 독립·인도 헌법과 주 재편·시킴과 부탄의 조약·네팔 라나 체제의 끝과 판차야트·벵골어 운동·프랑스령과 포르투갈령 인도의 이양·
#   비동맹과 반둥·파키스탄의 군정·싱할라 전용법과 스리랑카 공화국·인더스강 조약·인도–파키스탄 전쟁들·몰디브의 독립·녹색 혁명·동파키스탄의 6개 항과 방글라데시의 독립·심라 협정·인도의 핵실험·시킴의 편입·무지부르 라만의 암살·비상사태,
#   지아 울하크 군정·스리랑카 내전·블루스타 작전·네팔 내전·핵실험·카르길 전쟁·뭄바이 공격·하시나 정부·370조 폐지·스리랑카 경제 위기·2025년 충돌 등 오늘까지의 일.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다. 몰디브는 지도에 그리지 않아 글로만 다룬다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었고 2026년 기준으로 진행 중인 일은 확인한 마지막 사실까지만 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 그 이름이 쓰이던 때의 이야기는 옛 이름(처음 한 번 괄호로 지금 이름)으로 적었다(캘커타(지금 콜카타), 실론은 1972년 앞, 동파키스탄은 1947~1971년).
#   이름이 갈리는 일(1971년 전쟁의 '해방 전쟁'과 '내전', 하이데라바드 진입의 '경찰 행동'과 '병합')은 양쪽 이름을 함께 적었다. 카슈미르는 실효 지배를 사실로만 적고 어느 쪽 주장도 따르지 않았다.
#   사망자·난민·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다. 종교·민족 갈등은 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(인도의 독립과 탈식민지화의 시작, 중화인민공화국의 티베트 병합과 맥마흔선, 중인 국경 전쟁, 핑퐁 외교에서 미중 수교까지, 신냉전과 대한항공 007편 격추, 소련의 해체, 시진핑 체제의 출범과 일대일로).

- id: partition-1947
  year: 1947
  title:
    ko: "영국령 인도의 분할과 난민(1947)"
  summary:
    ko: "1946년 8월 16일 무슬림 연맹이 '직접 행동의 날'을 선포하자 캘커타(지금 콜카타)에서 사흘 동안 4,000명 넘게(추산 4,000~10,000명) 죽는 충돌이 일어났고, 폭력은 벵골의 노아칼리와 비하르로 번졌다. 1947년 2월 영국 정부가 1948년 6월까지 권력을 넘기겠다고 밝힌 뒤 부왕에 오른 마운트배튼은 6월 3일 영국령 인도를 인도와 파키스탄으로 나누는 안을 내놓고 독립 날짜를 8월로 앞당겼다. 국민 회의의 네루와 파텔, 무슬림 연맹의 진나와 리아콰트 알리 칸이 이 안에 동의했고, 영국 의회는 7월 인도 독립법을 통과시켰다. 펀자브와 벵골은 무슬림 다수 지구와 비무슬림 다수 지구로 나누기로 했으며, 북서 변경주는 국민 투표로 파키스탄 가입을, 벵골의 실헷은 국민 투표로 동쪽 곧 파키스탄 가입을 택했다. 영국인 법률가 시릴 래드클리프가 두 경계 위원회의 의장을 맡아 선을 그었고, 그 결과는 독립 이틀 뒤인 8월 17일에야 알려졌다. 8월 14일 카라치에서 진나를 총독으로 하는 파키스탄이, 15일 네루를 총리로 하는 인도가 독립했다(마운트배튼은 1948년 6월까지 인도 총독으로 남았다). 선은 펀자브의 관개 수로와 철도, 시크교도의 성지와 농지를 가로질렀고 벵골의 황마 재배지와 공장도 갈라놓았다. 자기 집을 떠난 사람은 연구자에 따라 1,200만~2,000만 명으로 추산되고, 학살과 열차 습격으로 죽은 사람은 20만~200만 명으로 학자마다 크게 갈린다. 가해는 힌두교도·시크교도·무슬림의 무장 집단이 모두 저질렀고 일부 지방 경찰과 군이 가담했다는 기록도 있다. 수만 명의 여성이 납치되거나 강제로 결혼했으며, 두 정부는 이들을 찾아 돌려보내기로 합의했다. 간디는 독립 기념 행사에 가지 않고 벵골에 머물며 폭력을 가라앉히려 애썼다. 영국의 철수와 다른 식민지의 독립을 함께 본 서술은 「인도의 독립과 탈식민지화의 시작」(같은 시기의 사건)에, 카슈미르를 둘러싼 첫 전쟁은 「제1차 인도–파키스탄 전쟁과 카슈미르 휴전선(1947~1949)」(같은 시기의 사건)에 있다."
  subjects: [india, pakistan, uk]
  links:
    - { from: uk, to: india, note: "인도 독립법에 따라 자치령으로 권력을 넘김 (1947)" }
    - { from: uk, to: pakistan, note: "인도 독립법에 따라 자치령으로 권력을 넘김 (1947)" }
  tags: [politics, society, diplomacy]
  sources: ["Yasmin Khan, The Great Partition: The Making of India and Pakistan (Yale University Press, 2007)", "Ian Talbot·Gurharpal Singh, The Partition of India (Cambridge University Press, 2009)", "「인도 독립법」(1947)"]

- id: kashmir-war-1947
  year: 1947
  endYear: 1949
  title:
    ko: "제1차 인도–파키스탄 전쟁과 카슈미르 휴전선(1947~1949)"
  summary:
    ko: "잠무 카슈미르는 힌두교도 마하라자 하리 싱이 다스린 토후국이었고 주민은 무슬림이 다수였다. 영국의 최고권이 사라진 1947년 8월 하리 싱은 어느 쪽에도 가입하지 않고 파키스탄과 정지 협정을 맺었다. 10월 초 서쪽 푼치에서 세금과 퇴역 군인 문제로 반란이 일어났고, 10월 22일 파슈툰 부족 무장대가 파키스탄 땅에서 넘어와 무자파라바드를 거쳐 바라물라까지 들어왔다. 인도는 파키스탄 정부가 이를 도왔다고 보고 파키스탄은 부족민이 스스로 나선 일이라고 설명한다. 하리 싱은 인도에 도움을 청해 10월 26일 가입 문서에 서명했고, 인도군은 이튿날 공수로 스리나가르에 들어가 셰이크 압둘라의 민족 회의 지원 속에 계곡을 지켰다. 인도는 평화가 돌아오면 주민의 뜻을 묻겠다고 밝혔다. 11월 1일에는 길기트 스카우트가 토후국 총독을 체포해 파키스탄 가입을 선언했다. 인도는 1948년 1월 1일 문제를 유엔 안전 보장 이사회에 넘겼고, 안보리는 4월 결의 47호와 위원회 결의로 파키스탄군 철수, 인도군 감축, 주민 투표의 순서를 내놓았으나 철수 범위를 두고 합의가 없어 투표는 열리지 않았다. 1948년 5월 파키스탄 정규군이 공식으로 전투에 들어갔다. 유엔이 중재한 정전은 1949년 1월 1일 발효했고, 7월 카라치 협정으로 정전선과 유엔 군사 감시단의 임무가 정해졌다. 이 선으로 인도는 계곡·잠무·라다크를, 파키스탄은 지금의 아자드 카슈미르와 길기트·발티스탄을 다스리게 되었다. 인도군 전사자는 1,100명 남짓이고 파키스탄군과 부족민의 전사자는 수천 명으로 알려졌다. 민간인 피해도 컸다. 잠무 지방에서는 무슬림 주민이, 푼치와 미르푸르 쪽에서는 힌두교도와 시크교도 주민이 대규모로 살해되거나 쫓겨났다. 인도는 가입 문서에 따라 옛 토후국 전체를 자기 땅이라 하고, 파키스탄은 가입이 정당하지 않으며 주민 투표로 정해야 한다고 주장한다. 정전선은 1972년 심라 협정으로 통제선이 되었다."
  subjects: [india, pakistan]
  tags: [war, politics, diplomacy]
  sources: ["Srinath Raghavan, War and Peace in Modern India (Palgrave Macmillan, 2010)", "Sumantra Bose, Kashmir: Roots of Conflict, Paths to Peace (Harvard University Press, 2003)", "Christopher Snedden, Kashmir: The Unwritten History (HarperCollins India, 2013)"]

- id: princely-integration-1948
  year: 1948
  endYear: 1949
  title:
    ko: "토후국의 통합: 주나가드·잠무 카슈미르·칼라트(1948~1949)"
  summary:
    ko: "영국의 최고권이 1947년 8월 15일 끝나면서 영국령 인도의 562개 토후국은 인도나 파키스탄에 가입하거나 법적으로는 독립을 택할 수 있게 되었다. 인도에서는 내무 장관 파텔과 국가부 서기 메논이 군주들에게 국방·외교·통신 세 분야만 넘기는 가입 문서와 기존 관계를 그대로 두는 정지 협정을 내놓고 설득했으며, 대다수가 독립 전에 서명했다. 카티아와르의 주나가드는 무슬림 나와브가 8월 15일 파키스탄 가입을 밝히고 파키스탄이 9월 중순 이를 받아들였으나 주민 대부분이 힌두교도였고, 속령 만그롤과 바바리아와드가 인도 가입을 선언했다. 인도의 봉쇄와 군 배치 속에 나와브가 10월 말 카라치로 떠났고 11월 인도군이 들어갔으며, 1948년 2월 주민 투표는 거의 만장일치로 인도 편입을 택했다(인도 관리 아래 치른 투표이며 파키스탄은 이를 인정하지 않았다). 잠무 카슈미르의 가입은 「제1차 인도–파키스탄 전쟁과 카슈미르 휴전선(1947~1949)」(앞의 사건)이, 하이데라바드는 「하이데라바드 폴로 작전과 니잠의 항복(1948)」(같은 해의 사건)이 다룬다. 가입한 작은 토후국들은 합쳐졌다. 1948년 초 사우라슈트라 연합, 5월 28일 마디아 바라트, 7월 15일 파티알라·동펀자브 토후국 연합이 생겼고 1949년 5월 15일 라자스탄이 완성되었으며 7월에는 트라방코르·코친이 합쳐졌다. 군주들은 연금과 칭호를 보장받았고 이 특권은 1971년 헌법 개정으로 없어졌다. 파키스탄 쪽에서는 발루치스탄 중부의 칼라트 칸국이 영국과 1876년 조약을 맺은 나라였고, 칸 아흐마드 야르 칸은 1947년 8월 독립을 선언하며 파키스탄과 정지 협정을 맺었다. 칸이 자기 속령으로 본 카란·마크란·라스벨라는 1948년 3월 중순 따로 파키스탄 가입을 알렸고, 칸은 인도에 접근했다는 보도가 나온 직후인 3월 27일 가입 문서에 서명했다. 진나는 3월 31일 이를 받아들였다. 역사가들은 이 가입을 자발로 보는 쪽과 압박의 결과로 보는 쪽으로 갈리고, 칸의 동생 압둘 카림이 7월에 무장 저항을 일으켰다는 기록이 있다. 칼라트와 세 속령은 1952년 발루치스탄 토후국 연합으로 묶였다가 1955년 서파키스탄에 합쳐졌다."
  subjects: [india, pakistan, kalat, kharan, makran, las-bela]
  tags: [politics, diplomacy]
  sources: ["V. P. Menon, The Story of the Integration of the Indian States (Longmans, Green, 1956)", "Ian Copland, The Princes of India in the Endgame of Empire, 1917–1947 (Cambridge University Press, 1997)", "Yaqoob Khan Bangash, A Princely Affair: The Accession and Integration of the Princely States of Pakistan, 1947–1955 (Oxford University Press, 2015)"]

- id: hyderabad-polo-1948
  year: 1948
  title:
    ko: "하이데라바드 폴로 작전과 니잠의 항복(1948)"
  summary:
    ko: "하이데라바드 주는 데칸 고원의 가장 큰 토후국으로 넓이가 20만 km²를 넘었고, 1941년 조사에서 주민의 약 85%가 힌두교도였으나 군주 니잠 오스만 알리 칸과 지배층은 무슬림이었다. 니잠은 1947년 영국의 최고권이 끝나자 인도·파키스탄 어느 쪽에도 가입하지 않고 독립을 바랐고, 11월 인도와 1년짜리 정지 협정을 맺었다. 이 무렵 공산당이 이끈 텔랑가나 농민 봉기가 지주와 니잠의 지배를 흔들었고, 카심 라즈비가 이끈 무슬림 민병대 라자카르는 많게는 20만 명에 이르렀다고 전해지며 힌두 주민을 위협했다. 인도 정부는 이를 정지 협정 위반과 치안 붕괴로 보았고 하이데라바드는 1948년 8월 21일 유엔 안전 보장 이사회에 호소했다. 진나가 9월 11일 죽은 이틀 뒤인 9월 13일 인도군이 네 방면에서 진입했다. 인도 정부는 이를 '경찰 행동'이라 불렀고 작전명은 폴로였으며, 하이데라바드 쪽과 일부 연구자는 침공이나 병합이라 부른다. 하이데라바드군은 거의 맞서지 못해 9월 17일 니잠이 정전을 선언했고 18일 군이 항복했다. 인도군은 군정을 세웠고 니잠은 뒤에 지방 장관 격의 라즈프라무크가 되었다. 희생자 수는 크게 갈린다. 인도 정부가 파견한 순데를랄 위원회의 보고서(2013년 공개)는 2.7만~4만 명으로 보았고 다른 관찰자들은 20만 명까지 추산한다. 라자카르의 힌두 주민 공격과 인도군 진입 뒤 마을에서 벌어진 무슬림 주민 살해가 모두 기록되었다. 약 18,000명이 구금되었고 대부분 풀려났다. 인도 안의 하이데라바드 주는 뒤에 언어 주 재편으로 텔랑가나·마라트와다·북동부 지구가 이웃 주들로 나뉘면서 없어졌다. 9월 17일은 지금도 지역과 정당에 따라 해방의 날, 합병의 날, 통합의 날로 달리 불린다."
  subjects: [hyderabad-state, india]
  tags: [war, politics]
  sources: ["Taylor C. Sherman, Muslim Belonging in Secular India: Negotiating Citizenship in Postcolonial Hyderabad (Cambridge University Press, 2015)", "V. P. Menon, The Story of the Integration of the Indian States (Longmans, Green, 1956)", "Srinath Raghavan, War and Peace in Modern India (Palgrave Macmillan, 2010)"]

- id: gandhi-assassination-1948
  year: 1948
  title:
    ko: "간디 암살(1948)"
  summary:
    ko: "분할 직후 델리에서도 무슬림 난민과 힌두교도·시크교도 난민 사이의 폭력이 이어지자 간디는 1948년 1월 13일 단식에 들어가 공동체 사이의 화해를 요구했다. 그는 분할 때 정하기로 한 파키스탄 몫의 자산 약 5억 5천만 루피를 인도 정부가 내놓지 않는 것도 옳지 않다고 비판했고, 정부는 단식이 이어지는 동안 이를 지급하기로 했다. 힌두 민족주의자 일부는 이를 무슬림에 대한 양보로 보고 분노했다. 1월 20일 델리의 비를라 저택 기도 모임에서 폭탄이 터졌고, 이 일은 마단랄 파와가 저질렀다. 1월 30일 오후 간디가 기도 모임으로 가는 길에 나투람 고드세가 가까이서 권총을 세 발 쏘았고, 간디는 곧 숨졌다. 고드세는 힌두 민족주의 신문 편집인으로 힌두 마하사바와 가까웠으며 젊은 시절 민족 봉사단(RSS)에 몸담은 적이 있었다. 같은 날 저녁 네루는 라디오 방송에서 '우리 삶의 빛이 꺼졌다'고 말했고 장례는 이튿날 야무나강가에서 치러졌다. 고드세는 법정 진술에서 간디가 분할을 막지 못했고 무슬림에게 지나치게 양보했다고 주장했다. 재판에서 고드세와 공범 나라얀 압테는 사형을 선고받아 1949년 11월 15일 교수형에 처해졌고, 암살을 부추겼다는 혐의를 받은 비나야크 사바르카르는 증거가 모자라 무죄로 풀려났다. 정부는 암살 직후 민족 봉사단을 금지했다가 1949년 7월 조건을 달아 해제했다. 암살은 분할 폭력 속에서도 비폭력을 이야기하던 사람이 쓰러진 일로 받아들여졌고, 신생 인도가 종교로 갈린 나라가 아니라 세속 국가를 지향한다는 입장을 굳히는 데 힘을 보탰다. 마운트배튼은 이때 인도 총독이었고 내무 장관 파텔은 경호 소홀을 두고 비판을 받았다."
  subjects: [india]
  tags: [politics, society]
  sources: ["Ramachandra Guha, Gandhi: The Years That Changed the World, 1914–1948 (Alfred A. Knopf, 2018)", "Stanley Wolpert, Gandhi's Passion: The Life and Legacy of Mahatma Gandhi (Oxford University Press, 2001)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: ceylon-independence-1948
  year: 1948
  title:
    ko: "실론의 독립과 시민권법(1948)"
  summary:
    ko: "실론(지금의 스리랑카)은 1796년 영국이 네덜란드에게서 해안을 빼앗은 뒤 영국령 실론이 되었고 1815년 칸디 왕국이 무너지면서 섬 전체가 영국의 직할 식민지가 되었다. 영국은 차와 고무 농장을 열면서 남인도의 타밀인 노동자를 데려왔고, 1931년 도너모어 헌법으로 보통 선거를 처음 들였다. 인도와 달리 큰 대중 투쟁 없이 협상으로 자치가 넓어졌는데, 소울버리 위원회의 권고를 따른 1946년 소울버리 헌법이 내각제 자치 정부의 바탕이 되었다. 1947년 총선에서 돈 스티븐 세나나야케가 이끈 통합 국민당이 이기자 영국 의회는 실론 독립법을 통과시켰고, 1948년 2월 4일 영연방 안의 자치령 실론이 독립했다. 독립 헌법은 하원과 상원의 양원 의회를 두고 특정 공동체를 차별하는 법을 막는 조항을 넣었다. 영국은 트링코말리 해군 기지와 카투나야케 공군 기지를 쓰는 방위 협정을 함께 맺었다. 새 정부는 같은 해 11월 시민권법을 시행해 아버지가 실론에서 태어났거나 아버지 쪽 조부와 증조부가 실론에서 태어났음을 증명한 사람에게만 시민권을 주었다. 이 요건을 채우지 못한 인도계 타밀인 농장 노동자 70만 명 넘게(인구의 약 11%)가 시민권을 얻지 못했고, 1949년 선거법 개정으로 투표권도 잃었다. 이 정책은 싱할라인 다수가 이끈 정부가 타밀계 표를 줄이려 한 조치라는 비판과, 인도계 이주민의 국적은 인도가 책임질 문제라는 정부 입장이 맞섰다. 실론 인구에서 싱할라인은 약 70%였고 스리랑카 타밀인과 인도계 타밀인, 무슬림이 나머지를 이루었다. 독립 때 섬의 이름은 실론이었고 1972년 공화국 헌법이 나라 이름을 스리랑카로 바꾸었다."
  subjects: [british-ceylon, sri-lanka, uk, india]
  links:
    - { from: uk, to: sri-lanka, note: "실론 독립법에 따라 자치령으로 독립시킴 (1948)" }
  tags: [politics, diplomacy, society]
  sources: ["Nira Wickramasinghe, Sri Lanka in the Modern Age: A History (Hurst & Company, 2014)", "K. M. de Silva, A History of Sri Lanka (C. Hurst & Co., 1981)", "「실론 독립법」(1947)"]

- id: india-bhutan-sikkim-1949
  year: 1949
  endYear: 1950
  title:
    ko: "인도와 부탄·시킴의 조약(1949~1950)"
  summary:
    ko: "부탄과 시킴은 영국령 인도 시절 영국의 보호 아래 놓였다. 부탄은 1907년 우겐 왕추크가 세습 왕위에 오른 뒤 영국과 가까웠고, 시킴의 초걀은 1914년부터 1963년까지 재위한 타시 남걀이었다. 부탄은 1865년 신출라 조약으로 영국에서 연금을 받는 대신 남쪽 두아르 땅을 넘겼고, 1910년 푸나카 조약으로 외교에서 영국의 지도를 받기로 했다. 시킴은 1861년 툼롱 조약으로 영국의 보호 아래 놓였다. 1947년 영국이 물러나자 영국과 맺은 조약이 어떻게 되는지가 불분명해졌고, 인도는 영국령 인도가 가진 관계를 자기가 이어받는다는 입장이었다. 인도는 1949년 중화인민공화국이 서고 티베트 문제가 불거지던 때여서 히말라야 국경의 두 나라와 관계를 서둘러 정리했다. 1949년 8월 8일 다르질링에서 인도와 부탄이 우호 조약을 맺었다. 인도는 부탄의 독립을 인정하고 영국이 뺏은 데왕기리 땅을 돌려주며 부탄 정부에 주는 연금을 늘리기로 했고, 부탄은 외교에서 인도의 조언을 따르기로 했다. 부탄 왕은 국내 정치를 스스로 맡았다. 시킴에서는 1947년 뒤 정당과 왕실이 맞서는 혼란이 이어졌고, 1950년 12월 5일 인도–시킴 조약으로 시킴 왕국은 인도의 보호국이 되었다. 이 조약에서 인도는 시킴의 국방·외교·통신을 맡았고 시킴은 내정에서 자치를 유지했으며, 인도 정부가 파견한 정치 담당관이 왕실을 곁에서 조언했다. 네팔과는 1950년 7월 31일 평화 우호 조약이 따로 맺어졌다. 중국의 티베트 병합은 「중화인민공화국의 티베트 병합과 맥마흔선」(뒤의 사건)에 있다. 부탄은 보호국이 아니라 조약으로 인도의 조언을 받는 독립국이라는 점이 시킴과 달랐다."
  subjects: [bhutan, sikkim, india]
  links:
    - { from: india, to: bhutan, note: "우호 조약으로 외교에서 인도의 조언을 받기로 함 (1949)" }
    - { from: india, to: sikkim, note: "보호국 조약으로 국방·외교·통신을 맡음 (1950)" }
  tags: [diplomacy, politics]
  sources: ["Leo E. Rose, The Politics of Bhutan (Cornell University Press, 1977)", "Sunanda K. Datta-Ray, Smash and Grab: Annexation of Sikkim (Vikas Publishing House, 1984)", "「인도·부탄 우호 조약」(1949)", "「인도·시킴 조약」(1950)"]

- id: india-constitution-1950
  year: 1950
  endYear: 1956
  title:
    ko: "인도 헌법과 공화국, 언어에 따른 주 재편(1950~1956)"
  summary:
    ko: "인도 제헌 의회는 1946년 12월 처음 열려 라젠드라 프라사드를 의장으로 헌법을 만들었다. 1947년 8월 구성된 초안 위원회는 불가촉천민 출신 법학자 암베드카르가 이끌었다. 헌법은 1949년 11월 26일 채택되어 1950년 1월 26일 시행되었는데, 이 날짜는 국민 회의가 1930년 완전 독립을 선언한 날을 기념해 골랐다. 채택 때 395개 조, 22개 부, 8개 부칙으로 이루어졌고 연방제이되 중앙 정부가 강한 의회 내각제, 기본권과 국가 정책 지침, 불가촉천민제 폐지, 지정 카스트·지정 부족의 의석과 일자리 할당, 21세 이상 모든 남녀의 보통 선거권을 담았다. 공용어는 데바나가리 문자의 힌디어이고 영어는 15년 동안 함께 쓰기로 했다. 이로써 영국 왕을 국가 원수로 둔 자치령이던 인도는 대통령을 둔 공화국이 되었고, 영연방에는 남았다. 초대 대통령은 프라사드가 되었고 마지막 총독 라자고팔라차리는 물러났다. 1951년 10월부터 1952년 2월까지 처음 치른 총선에서 국민 회의가 크게 이겼으며 네루가 총리를 이었다. 헌법 시행 때 주는 옛 영국령 관구와 토후국을 합친 구획이어서 언어 경계와 맞지 않았다. 텔루구어를 쓰는 지역이 따로 주를 세우라고 요구하던 중 푸티 스리라물루가 단식 끝에 1952년 12월 죽자 항의가 번졌고, 1953년 10월 언어 주로서 처음 안드라 주가 생겼다. 정부는 파즐 알리를 의장으로 하는 주 재편 위원회를 두었고, 1956년 주 재편법이 11월 1일 시행되어 언어를 바탕으로 14개 주와 6개 연방 직할지로 다시 나뉘었다. 이 일로 하이데라바드 주 같은 옛 토후국의 영역도 이웃 언어 주들로 흡수되었다. 언어 주 요구는 그 뒤에도 이어져 주 경계는 여러 번 조정되었다."
  subjects: [india]
  tags: [politics, society]
  sources: ["Granville Austin, The Indian Constitution: Cornerstone of a Nation (Clarendon Press, 1966)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)", "「인도 헌법」(1950)"]

- id: nepal-rana-end-1951
  year: 1951
  endYear: 1962
  title:
    ko: "네팔 라나 체제의 끝과 마헨드라의 판차야트(1951~1962)"
  summary:
    ko: "네팔에서는 1846년 쿠트 학살 뒤 장 바하두르 라나가 재상직을 세습하는 체제를 세웠고, 샤 왕조의 왕은 왕궁에 머무는 상징이 되었다. 라나 가문은 인도의 영국과 협력하며 100년 넘게 실권을 쥐었다. 인도가 독립한 뒤 인도에서 활동하던 네팔 국민 회의가 1947년 비슈웨슈와르 프라사드 코이랄라를 중심으로 세력을 모았고, 인도 정부는 1950년 7월 31일 네팔과 평화 우호 조약을 맺어 국경을 열고 서로의 안보를 존중하기로 했다. 같은 해 11월 6일 트리부반 왕이 사냥을 구실로 왕궁을 나와 카트만두의 인도 대사관에 몸을 피했다가 뉴델리로 떠났고, 네팔 국민 회의는 무장 봉기에 나섰다. 인도 정부의 중재로 1951년 초 라나 가문, 국민 회의, 왕이 델리 합의를 맺었고(자료마다 날짜가 1월 중순~2월 초로 갈린다) 왕은 2월 중순 돌아왔다. 모한 슘셰르 라나 총리와 코이랄라가 참여한 연립 내각이 서면서 라나 체제는 끝났지만 연립은 오래가지 못했다. 1955년 3월 트리부반이 죽자 아들 마헨드라가 왕위에 올랐고, 네팔은 그해 12월 유엔에 가입했다. 1959년 2월 왕이 공포한 헌법에 따라 처음 치른 총선에서는 네팔 국민 회의가 크게 이겨 코이랄라가 총리가 되었다. 코이랄라 정부는 토지 개혁과 관료 개혁에 나섰으나 궁정과 군의 불신을 샀다. 그러나 1960년 12월 15일 마헨드라는 내각을 해산하고 코이랄라를 구금했으며 정당 활동을 금지했다. 마헨드라는 중국이 티베트를 차지한 뒤 인도와 중국 사이에서 균형을 잡으려 했고 1960~1961년 중국과 우호 조약과 국경 조약을 맺었다. 1962년 12월 공포된 새 헌법은 정당 없이 마을에서 위로 올라가는 간접 선거의 판차야트 제도를 세우고 모든 실권을 왕에게 모았다."
  subjects: [nepal, india]
  tags: [politics, diplomacy]
  sources: ["John Whelpton, A History of Nepal (Cambridge University Press, 2005)", "Leo E. Rose, Nepal: Strategy for Survival (University of California Press, 1971)", "「인도·네팔 평화 우호 조약」(1950)"]

- id: bengali-language-1952
  year: 1952
  endYear: 1956
  title:
    ko: "벵골어 운동과 1952년 2월 21일(1952~1956)"
  summary:
    ko: "1947년 파키스탄은 서쪽과 동쪽에 나뉜 땅으로 출발했고 동벵골(1955년부터 동파키스탄) 주민은 전체 인구의 과반을 차지하는 벵골어 사용자였으나, 우르두어는 서쪽 일부 주민의 모어이면서 이슬람 국가의 상징으로 여겨졌다. 제헌 의회에서는 벵골 출신 의원 디렌드라나트 다타가 의사 진행에 벵골어 사용을 허용하자고 제안했으나 부결되었다. 1948년 3월 진나는 다카에서 우르두어만이 국어가 되어야 한다고 연설했고, 다카 대학 학생들이 이에 항의했다. 1952년 1월 27일 벵골 출신 총리 나지무딘도 우르두어만 국어로 삼겠다고 밝혔다. 이에 다카 대학 학생 단체가 2월 21일 항의 행진을 열기로 했고, 동벵골 정부는 집회를 막으려 144조를 선포했다. 1949년 세워진 아와미 무슬림 연맹(1955년 이름에서 무슬림을 뗌)이 이 운동과 함께 자랐다. 이날 학생과 시민이 다카 대학과 동벵골 의회 건물 부근에서 금지를 어기고 행진하자 경찰이 발포해 살람, 라피크 웃딘 아메드, 바르카트, 자바르를 포함한 시위자들이 숨졌다. 정부 발표는 이날 사망자 3명과 부상자 69명이었고, 이튿날 항의 속에서 더 사망자가 나왔다. 학생들은 다카 의과대학 부근에 임시 추모탑을 세웠으나 경찰이 며칠 뒤 부수었다. 이 사건은 벵골 민족주의의 상징이 되었고, 아와미 연맹을 비롯한 정당이 연합한 통일 전선이 1954년 3월 동벵골 선거에서 무슬림 연맹을 크게 이겼다. 1954년 5월 7일 제헌 의회는 벵골어도 국어로 인정하기로 의결했고, 1956년 2월 29일 제정되어 3월 23일 시행된 헌법은 우르두어와 함께 벵골어를 국가 언어로 규정했다. 2월 21일은 방글라데시에서 순교자의 날로 기려지며 1999년 유네스코가 국제 모어의 날로 정했다."
  subjects: [pakistan]
  tags: [society, politics, culture]
  sources: ["Tariq Rahman, Language and Politics in Pakistan (Oxford University Press, 1996)", "Willem van Schendel, A History of Bangladesh (Cambridge University Press, 2009)", "Rounaq Jahan, Pakistan: Failure in National Integration (Columbia University Press, 1972)"]

- id: indian-enclaves-1954
  year: 1954
  endYear: 1962
  title:
    ko: "프랑스령·포르투갈령 인도의 이양과 고아 병합(1954~1962)"
  summary:
    ko: "인도가 독립한 뒤에도 해안에는 프랑스의 상관 다섯 곳(퐁디셰리·카리칼·마헤·야남·샨데르나고르)과 포르투갈의 고아·다만·디우, 그리고 내륙의 다드라·나가르 하벨리가 남아 있었다. 프랑스는 주민의 뜻을 물어 넘기기로 인도와 합의했고 샨데르나고르가 1950년 먼저 인도에 넘어갔다. 나머지 넷은 1954년 11월 1일 사실상 인도에 넘어갔으며, 1956년 이양 조약이 서명되고 1962년 프랑스 의회가 비준하면서 법적으로 끝났다. 포르투갈의 살라자르 정부는 고아를 식민지가 아니라 본국의 해외 주라며 넘기기를 거부했다. 인도는 1953년 리스본의 공사관을 거두고 1954년 제재를 시작했다. 1954년 7월 22일 인도 단체와 주민 의용대가 다드라 경찰서를 습격했고 8월 11일 나가르 하벨리의 포르투갈 관리와 경찰이 항복해, 두 곳은 1961년 8월 인도에 편입될 때까지 인도의 지원 아래 사실상 따로 다스려졌다. 1955년 8월 15일에는 비무장 활동가 3,000~5,000명이 고아로 들어가려다 포르투갈 경찰의 발포로 20여 명이 죽었고, 인도는 고아 영사관을 닫았다. 1960년 4월 국제 사법 재판소는 다드라 등으로 가는 민간인과 물자의 통행권이 포르투갈에 있으나 무장 병력의 통과는 인도가 막을 수 있다고 판결했다. 1961년 11월 포르투갈군이 여객선 사바르마티를 쏘아 승객 한 명이 죽자 12월 10일 네루는 포르투갈 지배가 이어지는 것은 불가능하다고 밝혔다. 12월 17일 인도 육해공군이 작전 비자이(승리)로 고아·다만·디우에 들어가 약 36시간 만에 끝냈다. 총독 바사루 이 시우바는 끝까지 싸우라는 살라자르의 명령을 따르지 않고 12월 19일 항복했다. 사망자는 인도 쪽 22명과 포르투갈 쪽 30명이며 포로는 4,600여 명이었다. 포르투갈은 이를 침략이라 규탄했고 인도는 식민 지배의 잔재를 거두는 일이라 설명했다. 고아는 군정을 거쳐 1962년 6월 문민 정부로 바뀌었다."
  subjects: [french-india, portuguese-india, india, portugal, france]
  tags: [politics, war, diplomacy]
  sources: ["Srinath Raghavan, War and Peace in Modern India (Palgrave Macmillan, 2010)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)", "「인도·프랑스 이양 조약」(1956)"]

- id: nonaligned-1954
  year: 1954
  endYear: 1961
  title:
    ko: "네루의 비동맹: 판차실 선언, 반둥 회의, 베오그라드 정상 회의(1954~1961)"
  summary:
    ko: "1947년 독립한 인도의 총리 네루는 냉전의 어느 진영과도 군사 동맹을 맺지 않는 비동맹 노선을 내세웠다. 그는 이를 중립이 아니라 사안마다 스스로 판단하는 외교라고 설명했다. 1954년 4월 중국과 인도는 티베트 교역과 통행에 관한 협정을 맺으며 영토 주권의 상호 존중, 상호 불가침, 내정 불간섭, 평등과 호혜, 평화 공존이라는 다섯 원칙(판차실)을 서문에 적었다. 같은 달 콜롬보에서 인도·파키스탄·실론·미얀마(버마)·인도네시아의 총리가 모여 아시아·아프리카 나라들의 회의를 열기로 뜻을 모았다. 파키스탄은 1954년 미국과 군사 원조 협정을 맺고 동남아시아 조약 기구(SEATO)와 1955년 바그다드 조약에 들어가 서방 군사 동맹에 참여하는 길을 택했다. 1955년 4월 18~24일 인도네시아 반둥에서 열린 아시아·아프리카 회의에는 29개국의 대표가 모였다. 수카르노가 주최한 이 회의에 네루, 중국의 저우언라이, 이집트의 나세르 등이 참석했고, 유엔 헌장과 평화 공존 다섯 원칙을 담은 반둥 10원칙을 채택해 식민주의 반대와 주권 존중을 내걸었다. 파키스탄 대표는 자국의 동맹 참여를 변호했다. 인도는 미국과 파키스탄의 군사 협력을 안보 위협으로 보았고, 1955년 소련의 지원으로 빌라이 제철소를 세우기로 합의하는 등 소련과도 가까워졌다. 1961년 9월 베오그라드에서 유고슬라비아의 티토, 이집트의 나세르, 인도의 네루 등이 이끈 첫 비동맹 운동 정상 회의가 열렸다. 이 노선은 신생 독립국이 두 강대국 사이에서 목소리를 낼 틀이 되었다는 평가를 받는다. 인도와 중국의 관계는 국경 문제로 뒤에 나빠졌고, 비동맹이 현실의 안보를 지켜 주지 못했다는 비판도 나왔다(「중인 국경 전쟁」(뒤의 사건))."
  subjects: [india, pakistan, sri-lanka, prc, usa, soviet-union, yugoslavia]
  tags: [diplomacy, politics]
  sources: ["Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)", "Robert J. McMahon, The Cold War on the Periphery: The United States, India, and Pakistan (Columbia University Press, 1994)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)"]

- id: pakistan-ayub-1956
  year: 1956
  endYear: 1969
  title:
    ko: "파키스탄의 1956년 헌법과 아유브 칸의 군정(1956~1969)"
  summary:
    ko: "파키스탄은 헌법 없이 인도 정부법을 고쳐 쓰며 출발했고, 1948년 9월 총독 진나가, 1951년 10월 총리 리아콰트 알리 칸이 잇따라 세상을 떠나 정치의 중심이 흔들렸다. 총독 굴람 무함마드는 1954년 제헌 의회를 해산했고, 1955년에는 서쪽의 여러 주를 하나로 묶는 '원 유닛'이 10월에 시행되어 동쪽과 서쪽이 같은 수의 의석을 갖게 되었다. 1956년 3월 23일 첫 헌법이 시행되어 파키스탄은 이슬람 공화국이 되었고 이스칸데르 미르자가 초대 대통령에 올랐으나, 총리는 초두리 무함마드 알리, 수라와르디, 춘드리가르, 눈으로 잇달아 바뀌었다. 1958년 10월 7일 미르자가 헌법을 폐기하고 계엄령을 선포하며 육군 총사령관 아유브 칸을 계엄 사령관에 앉혔고, 10월 27일 아유브가 미르자를 밀어내고 대통령이 되었다. 아유브는 읍·면 단위 8만 명의 '기본 민주 의원'이 대통령을 뽑게 하는 제도를 만들어 1960년 이들의 신임 투표로 지위를 굳혔고, 1962년 대통령 중심 헌법을 공포했다. 1961년에는 일부다처를 제한하는 가족법을 시행했다. 정부는 산업화와 농업 개발로 '개발의 10년'을 내세웠고 성장도 이루었으나, 경제력이 22개 가문에 쏠린다는 비판과 동파키스탄이 소외된다는 불만이 커졌다. 수도는 카라치에서 새로 짓는 이슬라마바드로 옮기기로 했다. 대외로는 미국과 군사 협력을 이어 가면서도 1963년 중국과 국경 협정을 맺었고, 카슈미르 문제로 1965년 인도와 전쟁에 들어갔다(「제2차 인도–파키스탄 전쟁과 타슈켄트 선언(1965~1966)」(뒤의 사건)). 1965년 1월 대통령 선거에서는 진나의 누이 파티마 진나를 이겼으나 부정 의혹이 일었다. 타슈켄트 선언 뒤 외무 장관 부토가 떠나 1967년 파키스탄 인민당을 만들었고, 1968~1969년 학생과 노동자의 시위가 이어지자 아유브는 1969년 3월 25일 사임하며 권력을 야히야 칸 장군에게 넘겼다."
  subjects: [pakistan, usa, india]
  tags: [politics]
  sources: ["Ayesha Jalal, The State of Martial Rule: The Origins of Pakistan's Political Economy of Defence (Cambridge University Press, 1990)", "Hamid Khan, Constitutional and Political History of Pakistan (Oxford University Press, 2001)", "Ian Talbot, Pakistan: A Modern History (Hurst, 2009)"]

- id: sinhala-only-1956
  year: 1956
  endYear: 1972
  title:
    ko: "싱할라 전용법에서 1972년 공화국 헌법까지(1956~1972)"
  summary:
    ko: "독립 뒤 실론은 돈 스티븐 세나나야케와 그의 아들 더들리, 이어 코텔라왈라가 이끈 통합 국민당 정부가 이어 가며 행정에서 영어를 계속 썼다. 1956년 4월 총선에서는 반다라나이케의 인민 연합 전선이 '싱할라어만'과 불교 지원을 내걸고 이겨 정권을 잡았다. 그해 6월 통과되어 7월 시행된 공용어법 33호(싱할라 전용법)는 싱할라어를 유일한 공용어로 정했다. 싱할라인은 인구의 약 70%였고 타밀어 사용자는 약 29%였다. 타밀계 연방당은 의사당 앞에서 비폭력 농성을 벌였고 6월 갈오야의 충돌로 타밀인 150명가량이 죽었다. 반다라나이케는 1957년 연방당의 첼바나야감과 타밀어의 합리적 사용과 지방 평의회를 약속하는 협정을 맺었으나, 승려들의 반발과 야당의 반대 속에 1958년 4월 이를 폐기했다. 5~6월에는 타밀인을 노린 폭동이 전국으로 번졌다. 8월 타밀어 특별 규정법이 북부·동부주의 타밀어 사용을 허용했지만 시행 규칙은 1966년 1월에야 승인되었다. 1959년 9월 25일 반다라나이케는 승려 탈두웨 소마라마의 총격을 받고 이튿날 숨졌고, 다하나야케와 더들리 세나나야케의 짧은 정부를 거쳐 1960년 7월 그의 아내 시리마보 반다라나이케가 세계 첫 여성 총리가 되었고, 1961년 법정 언어법은 법원의 언어도 싱할라어로 정했다. 1964년 시리마보–샤스트리 협정은 국적 없는 인도계 타밀인 약 97만 5천 명 가운데 52만 5천 명을 인도로 돌려보내고 30만 명에게 시민권을 주기로 했다. 1956년 이후 공직과 군에서 타밀인의 비중이 크게 줄었다고 보는 연구가 많으나 그 가운데 차별의 몫이 얼마인지는 연구자에 따라 평가가 갈린다. 1971년 4월 급진 청년 조직 인민 해방 전선(JVP)이 일으킨 무장 봉기를 정부가 진압했고, 대학 입학의 '표준화'(언어별 합격선)는 타밀 학생의 불만을 키웠다. 1972년 5월 22일 새 헌법은 자치령 실론을 공화국 스리랑카로 바꾸고 불교에 '으뜸가는 지위'를 주었으며 싱할라어 전용을 헌법에 올렸다. 타밀 정당들은 이에 맞서 연합했고, 이 갈등은 「스리랑카 내전과 인도 평화 유지군(1983~2009)」(뒤의 사건)으로 번졌다."
  subjects: [sri-lanka, india]
  tags: [politics, society]
  sources: ["Nira Wickramasinghe, Sri Lanka in the Modern Age: A History (Hurst & Company, 2014)", "K. M. de Silva, A History of Sri Lanka (C. Hurst & Co., 1981)", "「공용어법」(Official Language Act, 1956)"]

- id: indus-waters-1960
  year: 1960
  title:
    ko: "인더스강 조약(1960)"
  summary:
    ko: "1947년 분할은 펀자브의 하나였던 관개망을 갈라 강의 수원과 취수 시설은 인도에, 그 물에 기대는 농지의 큰 부분은 파키스탄에 두게 했다. 1948년 4월 인도 쪽 취수 시설에서 물이 끊겨 파키스탄의 운하가 마르는 일이 있었고, 5월 4일 양국은 파키스탄이 요금을 내고 물을 받는 임시 협정을 맺었다. 해결의 실마리는 1951년 미국 테네시 계곡 개발청 출신 릴리엔솔이 강을 두 나라가 나누지 말고 공동으로 개발하자고 제안하면서 열렸다. 세계은행이 중재에 나서 1954년 자기 안을 내놓았고, 6년 가까운 협상이 이어졌다. 1960년 9월 19일 카라치에서 인도 총리 네루와 파키스탄 대통령 아유브 칸, 세계은행의 일리프가 인더스강 조약에 서명했다. 조약은 동쪽 세 강(라비·비아스·수틀레지)을 인도에, 서쪽 세 강(인더스·젤룸·체납)을 파키스탄에 나눴고 수량으로는 서쪽 강이 훨씬 많아 전체 물의 약 80%가 파키스탄 몫이다. 인도는 서쪽 강을 제한된 관개와 수로를 막지 않는 수력 발전에 쓸 수 있다. 양국이 한 명씩 위원을 내는 상설 인더스 위원회를 두고, 분쟁은 중립 전문가나 중재 재판소가 다루도록 했다. 파키스탄은 10년의 이행 기간에 동쪽 강에 기대던 운하를 서쪽 강에서 끌어오는 연결 운하와 만글라·타르벨라 댐으로 바꾸어야 했다. 이를 위해 영국·미국·서독·호주·캐나다·뉴질랜드와 세계은행이 개발 기금을 마련했고, 인도는 6,206만 파운드를 분담했다. 상류의 인도가 하류의 파키스탄에 물을 흘려보내는 구조라 파키스탄은 이 조약을 생존의 문제로 여기고, 인도는 서쪽 강의 활용 범위를 두고 해석을 달리해 이후에도 분쟁이 이어졌다."
  subjects: [india, pakistan]
  tags: [diplomacy, economy]
  sources: ["Daniel Haines, Rivers Divided: Indus Basin Waters in the Making of India and Pakistan (Oxford University Press, 2017)", "「인더스강 조약」(1960)"]

- id: indo-pak-war-1965
  year: 1965
  endYear: 1966
  title:
    ko: "제2차 인도–파키스탄 전쟁과 타슈켄트 선언(1965~1966)"
  summary:
    ko: "카슈미르 문제가 풀리지 않은 채, 1962년 중국에게 진 인도를 약하다고 본 파키스탄의 아유브 칸 정부는 무력으로 판을 바꾸려 했다. 1965년 4월 서쪽 쿠치 습지에서 국경 충돌이 일어났고 영국의 중재로 가라앉았다(1968년 재판소는 파키스탄이 요구한 9,100 km²가 아니라 780 km²를 파키스탄 몫으로 인정했다). 8월 5일 파키스탄은 지브롤터 작전으로 군인과 무장 대원을 인도 쪽 카슈미르에 들여보내 봉기를 부추겼으나 주민의 호응을 얻지 못했다. 인도군은 8월 말 정전선을 넘어 하지피르 고개를 차지했고, 9월 1일 파키스탄이 참브 쪽에서 그랜드 슬램 작전으로 아크누르를 노렸으나 실패했다. 9월 6일 인도군은 국제 국경을 넘어 라호르 방면으로 진격했고, 케므 카란 쪽 아살 우타르(펀자브 전선)와 시알코트 쪽 차윈다에서 큰 전차전이 벌어졌다. 미국과 영국은 두 나라에 무기와 탄약 공급을 끊었고 전쟁은 오래가지 못했다. 안보리가 9월 20일 결의 211호로 정전을 요구했고 인도가 먼저, 파키스탄이 9월 23일 받아들였다. 독립 연구의 추산으로 전사자는 인도 약 3,000명, 파키스탄 약 3,800명이며, 인도는 파키스탄 땅 약 1,840 km²를, 파키스탄은 인도 땅 약 540 km²를 차지했다. 결론이 나지 않은 전쟁으로 보는 평가가 많고, 서방 연구자 가운데는 정전 때 인도가 유리한 위치였다고 보는 이도 있으며, 두 나라 모두 승리를 내세웠다. 두 나라 모두 자국의 승리를 내세웠고 파키스탄은 9월 6일을 국방의 날로 기린다. 소련 총리 코시긴의 중재로 1966년 1월 10일 타슈켄트에서 인도 총리 샤스트리(1964년 네루의 죽음 뒤 총리가 됨)와 파키스탄 대통령 아유브 칸이 선언에 서명해, 2월 25일까지 1965년 8월 5일 이전 위치로 군을 물리고 외교 관계를 되살리기로 했다. 샤스트리는 이튿날 타슈켄트에서 심장마비로 숨졌고 임시 총리 굴자리랄 난다를 거쳐 1월 24일 인디라 간디가 총리가 되었다. 파키스탄에서는 선언이 전쟁에서 얻은 것을 내주었다는 반발이 일었다(「파키스탄의 1956년 헌법과 아유브 칸의 군정(1956~1969)」(앞의 사건))."
  subjects: [india, pakistan, soviet-union, uk, usa]
  tags: [war, diplomacy]
  sources: ["Srinath Raghavan, War and Peace in Modern India (Palgrave Macmillan, 2010)", "Stephen P. Cohen, The Idea of Pakistan (Brookings Institution Press, 2004)", "「타슈켄트 선언」(1966)"]

- id: maldives-independence-1965
  year: 1965
  endYear: 1968
  title:
    ko: "몰디브의 독립과 공화국(1965~1968)"
  summary:
    ko: "인도양에 흩어진 1,000여 개 산호섬으로 이루어진 몰디브는 12세기 중반 불교를 믿던 왕이 이슬람으로 바꾸었다고 전해지며 술탄이 다스렸다. 1558년 포르투갈이 말레를 점령했으나 1573년 몰아냈고, 뒤에는 실론의 네덜란드 총독에게 공물을 바치는 관계를 거쳐 영국이 1887년 보호령으로 삼았다. 영국은 외교와 방위를 맡고 술탄은 내정을 맡았으며, 술탄은 영국에 해마다 공물을 바쳤다. 1932년 첫 성문 헌법이 만들어졌고, 1953년 1월 무함마드 아민 디디가 술탄제를 없애고 첫 공화국을 세웠으나 몇 달 만에 무너져 1954년 술탄제가 돌아왔다. 영국은 제2차 세계 대전 때 남쪽 아두 환초에 해군 기지를 두었고, 1957년 간섬 비행장이 공군으로 넘어가면서 이곳이 인도양의 공군 중계 기지가 되었다. 1959~1963년 남부 환초 사람들이 수바디브 연합 공화국을 선포하고 말레 정부에 맞섰으며, 말레 정부는 영국이 기지를 지키려 이를 뒷받침했다고 보았다. 1957년부터 총리를 맡은 이브라힘 나시르는 이 갈등을 눌러 두고 영국과 새 협정을 이끌었다. 1965년 7월 26일 콜롬보에서 협정에 서명하면서 영국의 보호가 끝나고 몰디브가 독립했고, 영국은 간 기지와 히타두 기지를 30년 쓰기로 했다. 몰디브는 그해 9월 21일 유엔에 가입했다. 독립 때 국가 원수는 술탄 무함마드 파리드 디디였고 인구는 10만 명이 채 되지 않았으며 대부분 어업으로 살았다. 1968년 3월 국민 투표를 거쳐 11월 11일 술탄제가 폐지되고 공화국이 되었으며 나시르가 대통령에 올랐다. 겉모습은 바뀌었지만 나시르의 권력이 이어졌다는 평가가 있다. 영국은 1976년 3월 말 간 기지에서 물러나 4월 1일 몰디브 정부에 돌려주었다."
  subjects: [uk]
  tags: [politics, diplomacy]
  sources: ["Clarence Maloney, People of the Maldive Islands (Orient Longman, 1980)", "「몰디브 독립 협정」(1965)"]

- id: green-revolution-1966
  year: 1966
  endYear: 1970
  title:
    ko: "인도와 파키스탄의 녹색 혁명(1966~1970)"
  summary:
    ko: "1960년대 중반 인도는 식량 위기에 놓였다. 인구는 1961년 약 4억 4천만 명에서 1971년 약 5억 5천만 명으로 늘고 있었다. 1965년과 1966년 이어진 가뭄으로 곡물 생산이 크게 줄었고, 미국의 식량 원조 계획(PL-480)으로 들여오는 밀에 크게 기댔고 곡물 수입은 대부분 미국산으로 1966년 1,000만 톤 안팎에 이르렀다. 이 의존이 외교 압력의 수단이 되었다는 평가가 많다. 정부는 농업 정책을 바꾸었다. 농업 장관 수브라마니암과 농학자 스와미나탄이 노먼 볼로그가 멕시코에서 개량한 키가 작고 수확이 많은 밀 종자를 1966년 대량으로 들여와 1966~1967년 펀자브 등에 심었다. 정부는 1965년 곡물을 사들이는 식량 공사와 농산물 가격 위원회를 세워 최저 지지 가격을 보장했고, 화학 비료와 관정, 수로, 농업 신용을 한꺼번에 늘렸다. 밀 생산량은 인도 정부 통계로 1965~1966년 약 1,000만 톤에서 1970~1971년 약 2,300만 톤으로 늘었다. 쌀은 필리핀의 IR8 같은 새 품종이 퍼졌으나 관개가 되는 곳에 한정되었다. 파키스탄도 1967년 멕시코산 종자를 들여와 서파키스탄의 펀자브와 신드에서 밀 생산이 크게 늘었다. 볼로그는 1970년 노벨 평화상을 받았다. 이득은 관개가 잘 되고 자본을 가진 펀자브·하리아나·서부 우타르프라데시의 대농과 중농에 몰렸다. 동부 인도와 건조지의 소농, 소작농은 뒤처졌고, 종자와 비료·농약 비용을 대느라 빚을 지는 농가가 늘었다. 지하수를 지나치게 쓰고 토양이 나빠지는 문제는 뒤에 드러났다. 이 변화로 인도는 식량 수입에 기대던 처지를 벗어났다."
  subjects: [india, pakistan, usa]
  tags: [economy, society]
  sources: ["Francine R. Frankel, India's Political Economy, 1947–2004: The Gradual Revolution (2nd ed., Oxford University Press, 2005)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: six-points-1966
  year: 1966
  endYear: 1970
  title:
    ko: "동파키스탄의 6개 항 요구와 1970년 총선, 볼라 사이클론(1966~1970)"
  summary:
    ko: "파키스탄 인구의 과반인 동파키스탄은 황마 수출로 외화를 벌었으나 중앙 정부의 예산과 투자, 군과 관료의 자리는 서파키스탄에 크게 기울었다는 불만이 컸다. 1966년 2월 5~6일 라호르의 야당 회의에서 아와미 연맹의 셰이크 무지부르 라만이 6개 항을 내놓았다. 연방제와 의회 내각제, 중앙 정부는 외교와 국방만 맡음, 두 지역의 화폐를 따로 두거나 동쪽 자본이 빠져나가지 않게 하는 장치, 세금은 지방이 거둠, 지역별 외환 관리와 무역 협정, 동파키스탄 자체 민병대를 담았다. 아유브 칸 정부는 이를 분리 선동으로 보고 무지부르를 구금했다. 1968년 1월에는 인도와 공모해 분리를 꾀했다는 혐의로 그를 기소한 아가르탈라 음모 사건이 터졌다. 학생들의 11개 항 요구와 1969년 초 대중 봉기가 이어지자 정부는 기소를 철회하고 무지부르를 풀어 주었다. 3월 아유브가 물러나고 야히야 칸 장군이 계엄령을 선포했으며, 서파키스탄의 원 유닛을 해체하고 사람마다 한 표를 갖는 첫 직접 총선을 약속했다. 1970년 11월 12~13일 동파키스탄 해안을 볼라 사이클론이 덮쳐 30만~50만 명이 죽은 것으로 추산된다(최소 22만 4천 명이라는 조사도 있다). 연방 정부의 구호가 늦고 모자랐다는 비판이 동파키스탄에서 커졌다. 12월 7일 총선에서 아와미 연맹은 동파키스탄 몫 169석 가운데 167석을 얻어 313석 의회의 과반을 차지했고, 서파키스탄에서는 줄피카르 알리 부토의 인민당이 가장 많은 의석을 얻었다. 부토는 무지부르가 총리가 되는 것을 받아들이지 않았다(「방글라데시 독립 전쟁과 제3차 인도–파키스탄 전쟁(1971)」(뒤의 사건))."
  subjects: [pakistan]
  tags: [politics, society]
  sources: ["Rounaq Jahan, Pakistan: Failure in National Integration (Columbia University Press, 1972)", "Willem van Schendel, A History of Bangladesh (Cambridge University Press, 2009)", "Srinath Raghavan, 1971: A Global History of the Creation of Bangladesh (Harvard University Press, 2013)"]

- id: bangladesh-liberation-1971
  year: 1971
  title:
    ko: "방글라데시 독립 전쟁과 제3차 인도–파키스탄 전쟁(1971)"
  summary:
    ko: "1970년 총선 결과를 두고 부토가 무지부르 라만의 정부 구성을 거부하자 대통령 야히야 칸은 1971년 3월 1일 의회 소집을 미루었다. 동파키스탄에서는 불복종 운동이 번졌고 3월 7일 무지부르가 다카에서 대중 앞에서 연설했다. 협상이 이어지던 3월 25일 밤 파키스탄군은 서치라이트 작전으로 다카 대학과 경찰 시설, 힌두교도 거주지를 공격했다. 무지부르는 체포되어 서파키스탄으로 끌려갔고, 그의 이름으로 방글라데시의 독립이 선포되었다(3월 26일). 4월 17일 인도 국경 가까운 무지부르나가르에서 타지우딘 아흐마드를 총리로 하는 임시 정부가 수립되었다. 벵골인 군인·경찰과 학생·농민이 무크티 바히니(해방군)를 이루어 싸웠고, 파키스탄군은 자마아테 이슬라미 계열의 라자카르와 알바드르 같은 민병대의 도움을 받았다. 민간인 살해와 성폭력이 널리 일어났으며 지식인과 힌두교도가 표적이 되었고, 무크티 바히니와 벵골 군중도 비벵골인(비하리) 주민에게 보복했다. 약 1,000만 명이 인도로 피란했다. 닉슨 정부는 중국과의 접촉을 중개하던 파키스탄을 두둔했고 다카 주재 미국 외교관들은 이에 항의하는 전보(블러드 전보)를 보냈다(「핑퐁 외교에서 미중 수교까지(1971~1979)」(같은 시기의 사건)). 8월 9일 인도는 소련과 평화 우호 협력 조약을 맺었다. 12월 3일 파키스탄 공군이 인도 북서부 기지를 선제 공습하자 인도가 전면 참전해 동서 두 전선에서 싸웠고 12월 6일 방글라데시를 승인했다. 12월 16일 다카에서 파키스탄 동부군 사령관 니아지가 인도군의 아로라 중장에게 항복 문서에 서명했고, 포로는 9만~9만 3천 명이었다. 서쪽 전선은 12월 17일 멎었다. 사망자 수는 크게 갈린다. 방글라데시 정부는 300만 명을 말하고, 파키스탄 정부가 세운 하무드 우르 라흐만 위원회의 보고서는 약 2만 6천 명을 말하며, 연구자의 추산은 대략 5만~10만 명에서 30만~50만 명까지 펼쳐진다. 방글라데시에서는 해방 전쟁, 파키스탄에서는 내전 또는 1971년 사태라 부른다."
  subjects: [bangladesh, pakistan, india, usa, soviet-union]
  links:
    - { from: pakistan, to: bangladesh, note: "독립 전쟁에서 동쪽 땅을 잃음 (1971)" }
  tags: [war, politics]
  sources: ["Srinath Raghavan, 1971: A Global History of the Creation of Bangladesh (Harvard University Press, 2013)", "Sarmila Bose, Dead Reckoning: Memories of the 1971 Bangladesh War (C. Hurst & Co., 2011)", "Gary J. Bass, The Blood Telegram: Nixon, Kissinger, and a Forgotten Genocide (Alfred A. Knopf, 2013)", "「하무드 우르 라흐만 위원회 보고서」(파키스탄 정부)"]

- id: simla-1972
  year: 1972
  endYear: 1974
  title:
    ko: "심라 협정(1972~1974)"
  summary:
    ko: "1971년 12월 서부 전선의 전투가 멎자 야히야 칸이 물러났고 줄피카르 알리 부토가 20일 대통령에 올랐다. 인디라 간디는 1971년 3월 총선에서 크게 이긴 상태였고, 인도는 동파키스탄에서 잡은 파키스탄군 포로 9만 명 남짓과 서쪽 전선에서 차지한 파키스탄 땅을 쥐고 있었다. 부토는 포로의 송환을, 인도는 카슈미르를 포함한 분쟁의 지속적 해결을 바랐다. 1972년 6월 말부터 히마찰프라데시의 심라에서 인도 총리 인디라 간디와 부토가 정상 회담을 열었고 7월 2일 협정에 서명했다(공식 문서는 7월 2일자이며 서명은 3일 새벽에 마무리되었다). 협정은 두 나라가 분쟁을 양자 협상으로 평화롭게 풀고 유엔 헌장의 원칙에 따라 무력 사용이나 위협을 삼가기로 했다. 1971년 12월 17일의 정전선을 통제선으로 삼아 어느 쪽도 일방적으로 바꾸지 않기로 했고, 발효 30일 안에 군대를 국제 국경 안으로 물리며 통신·교통·교역과 문화 교류를 단계적으로 되살리기로 했다. 파키스탄은 7월 15일, 인도는 8월 3일 비준했고 협정은 8월 4일 발효했다. 인도는 점령한 서부 땅 1만 3천 km² 남짓을 돌려주었으나 튀르툭 일대를 비롯한 약 883 km²는 그대로 두었다. 카슈미르 문제에 대한 해석은 갈린다. 인도는 이를 양자 문제로 한정하고 제3자나 유엔의 개입을 배제한 합의라고 보며, 파키스탄은 유엔 결의에 따른 해결의 권리가 사라지지 않았다고 본다. 협정문에는 포로 송환이나 파키스탄이 방글라데시를 승인하는 문제는 담기지 않았다. 포로는 1973년 8월 28일 인도·파키스탄·방글라데시의 델리 협정에 따라 돌아가기 시작했고, 파키스탄은 1974년 2월 방글라데시를 승인했다. 심라 협정은 그 뒤 두 나라 관계의 기본 틀로 인용된다."
  subjects: [india, pakistan, bangladesh]
  tags: [diplomacy]
  sources: ["Srinath Raghavan, 1971: A Global History of the Creation of Bangladesh (Harvard University Press, 2013)", "Stephen P. Cohen, The Idea of Pakistan (Brookings Institution Press, 2004)", "「심라 협정」(1972)"]

- id: pokhran-1974
  year: 1974
  title:
    ko: "인도의 첫 핵실험 포크란(1974)"
  summary:
    ko: "인도는 독립 직후 원자력 위원회를 두고 호미 바바의 지휘 아래 원자력 연구를 시작했고, 1960년 캐나다가 지원한 연구용 원자로 CIRUS가 가동되었다. 1962년 중국에게 진 인도는 안보 불안을 키웠고 1964년 중국이 첫 핵실험을 하자 핵무기를 가질지를 두고 논쟁이 커졌다. 인도는 1968년 핵 확산 금지 조약(NPT)을 핵보유국에만 유리한 차별적 조약이라며 가입하지 않았다. 인디라 간디 정부는 1972년 과학자들에게 폭발 장치를 만들도록 승인했고, 1974년 5월 18일 라자스탄 사막의 포크란 시험장에서 지하 핵 폭발을 실시했다. 시험은 라자 라마나가 이끈 바바 원자력 연구소가 맡았고 갱도는 육군 공병대가 팠다. 성공 소식은 인디라 간디에게 '부처가 미소 지었다'는 암호 전문으로 전해졌다고 한다. 이날이 석가탄신일이어서 암호명은 '웃는 부처'였다. 폭발 출력은 공식으로 12킬로톤이고 독립 추산은 8~10킬로톤 안팎이다. 플루토늄은 CIRUS 원자로에서 나온 것이었다. 인도 정부는 이를 '평화적 핵 폭발'이라 부르며 핵무기 개발이 아니라고 밝혔으나, 비판하는 쪽은 핵무기 능력을 사실상 보인 것으로 보았다. 캐나다는 핵 협력을 중단했고, 핵 기술을 수출하는 나라들은 이듬해 핵 공급국 그룹(NSG)을 만들어 수출 통제를 강화했다. 파키스탄의 부토는 1972년 핵 개발 의사를 이미 밝혔고 인도의 시험 뒤 이를 서둘렀다. 국내에서는 석유 파동 뒤 물가 상승과 5월의 전국 철도 파업으로 인디라 간디 정부가 흔들리던 때여서, 시험이 지지를 끌어모으는 효과도 있었다. 인도는 이후 1998년까지 공식 핵실험을 하지 않았다(「인도와 파키스탄의 핵실험(1998)」(뒤의 사건))."
  subjects: [india, pakistan]
  tags: [politics, war]
  sources: ["George Perkovich, India's Nuclear Bomb: The Impact on Global Proliferation (University of California Press, 1999)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: sikkim-merger-1975
  year: 1975
  title:
    ko: "시킴의 인도 편입(1975)"
  summary:
    ko: "시킴은 1642년부터 남걀 왕조의 초걀(왕)이 다스린 불교 왕국으로, 1950년 12월 5일 인도–시킴 조약으로 인도의 보호국이 되어 국방·외교·통신을 인도에 맡기고 내정은 스스로 맡았다. 주민은 원주민 렙차와 티베트계 부티아보다 19세기 말부터 이주한 네팔계가 다수가 되었는데, 의회 의석은 부티아·렙차와 네팔계에 같은 수로 나뉘어 있어 네팔계의 불만이 컸다. 1963년 즉위한 초걀 팔덴 톤둡 남걀(미국인 왕비 호프 쿡이 있어 국제 언론의 관심을 모았다)의 왕정을 비판하는 시위가 1973년 4월 일어나자 왕은 인도에 도움을 청했고, 5월 8일 인도·초걀·정당 지도자들이 3자 협정을 맺어 인도가 파견한 행정관이 사실상 행정을 이끌게 하고 선거를 약속했다. 1974년 선거에서 카지 렌둡 도르지의 시킴 국민 회의가 크게 이겼고 새 의회는 초걀을 상징적 존재로 줄이는 시킴 정부법을 채택했으며, 인도 의회는 9월 시킴을 인도와 연합한 준주로 삼는 헌법 개정을 통과시켰다. 1975년 4월 9일 무렵 인도군이 강토크의 왕궁을 둘러싸고 호위대를 무장 해제했다. 4월 10일 시킴 의회는 왕정 폐지와 인도 편입을 의결했고, 4월 14일 국민 투표에서 약 97.5%가 찬성했다. 인도 의회가 헌법 36차 개정을 통과시켜 5월 16일 시킴은 인도의 22번째 주가 되었고 초걀은 물러났다. 인도 정부와 시킴 의회의 다수는 이를 주민의 뜻에 따른 합병이라 하고, 초걀 지지자와 일부 연구자는 인도군의 압박 속에 이루어진 병합이며 국민 투표의 상황도 의심스럽다고 본다. 중국은 이를 비판했으나 2003년 인도와의 양해로 사실상 인도의 주권을 받아들였다."
  subjects: [sikkim, india]
  tags: [politics]
  sources: ["Sunanda K. Datta-Ray, Smash and Grab: Annexation of Sikkim (Vikas Publishing House, 1984)", "「인도 헌법 제36차 개정」(1975)"]

- id: mujib-assassination-1975
  year: 1975
  title:
    ko: "무지부르 라만 정부와 1975년 8월 15일의 암살(1975)"
  summary:
    ko: "1972년 1월 10일 파키스탄 감옥에서 풀려난 셰이크 무지부르 라만은 방글라데시로 돌아와 총리가 되었고, 인도군은 3월 철수를 마쳤다. 그는 '벵골의 친구'라 불렸다. 1972년 12월 시행된 헌법은 민족주의·사회주의·민주주의·세속주의를 나라의 4대 원칙으로 삼았고, 1973년 3월 총선에서 아와미 연맹이 크게 이겼다. 그러나 전쟁으로 무너진 경제, 산업 국유화의 부진, 1974년의 홍수와 기근이 정부 지지를 갉아먹었고 기근의 희생자 수는 추산에 따라 크게 갈린다. 1974년 파키스탄이 방글라데시를 승인하고 방글라데시는 유엔에 가입했지만, 같은 해 12월 정부는 비상사태를 선포했다. 정부가 만든 준군사 조직 자티야 락키 바히니의 인권 침해와 좌익 반군에 대한 탄압도 비판받았다. 1975년 1월 헌법 4차 개정은 대통령제와 일당제를 도입했고, 대통령이 된 무지부르는 모든 정당을 방글라데시 농민·노동자 아와미 연맹으로 합치려 했다. 8월 15일 새벽 육군의 중하급 장교들이 다카 다만몬디에 있는 무지부르의 집을 습격해 그와 아내, 아들들을 비롯한 가족을 죽였다. 서독에 있던 딸 하시나와 레하나는 살아남았다. 정부 각료였던 콘다커 무스타크 아메드가 대통령이 되어 계엄령을 선포했다. 11월 3일 칼레드 무샤라프 준장이 반대 쿠데타를 일으킨 날 다카 중앙 교도소에서 타지우딘 아흐마드, 사이드 나즈룰 이슬람, 만수르 알리, 카마루잔 네 지도자가 살해되었다. 11월 6일 무스타크가 물러나고 압두스 사다트 모하마드 사옘 대법원장이 대통령이 되었으며, 7일 병사들의 봉기로 무샤라프가 죽고 지아우르 라만 소장이 실권을 잡았다. 앞서 9월에 공포된 면책 포고령은 암살 가담자의 재판을 막았다."
  subjects: [bangladesh]
  tags: [politics]
  sources: ["Talukder Maniruzzaman, The Bangladesh Revolution and Its Aftermath (Bangladesh Books International, 1980)", "Willem van Schendel, A History of Bangladesh (Cambridge University Press, 2009)"]

- id: emergency-india-1975
  year: 1975
  endYear: 1977
  title:
    ko: "인도의 비상사태(1975~1977)"
  summary:
    ko: "1971년 총선에서 '가난을 몰아내자'를 내건 인디라 간디의 국민 회의가 크게 이겼으나, 석유 파동 뒤 물가 상승과 실업, 부패에 대한 불만이 쌓이면서 1973~1974년 구자라트의 나브니르만 운동과 비하르의 학생 운동이 일어났고 자야프라카시 나라얀이 이를 '완전한 혁명'으로 이끌었다. 1975년 6월 12일 알라하바드 고등 법원 판사 신하는 인디라가 1971년 선거 운동에 공무원과 정부 자원을 쓴 것을 선거법 위반으로 보고 라에바렐리 당선을 무효로 했다. 6월 24일 대법원은 총리직은 유지하되 의회 표결권을 제한하는 조건으로 판결의 집행을 멈추었다. 6월 25일 자야프라카시가 델리 집회에서 군과 경찰에 부당한 명령을 따르지 말라고 호소하자, 그날 밤 파크루딘 알리 아메드 대통령이 총리의 건의에 따라 헌법 352조의 '내부 소요'를 이유로 비상사태를 선포했다. 신문은 사전 검열을 받았고 야당 지도자와 활동가, 언론인이 영장 없이 구금되어 집계에 따라 11만 명 안팎이 잡혔다. 1976년 4월 대법원은 비상사태 중에는 구금에 대해 인신 보호를 청구할 수 없다고 판결했다(ADM 자발푸르 사건, 판사 한 명이 반대 의견). 1976년 제42차 헌법 개정은 행정부의 권한을 키우고 헌법 전문에 사회주의와 세속을 넣었으며 의회의 임기를 늘렸다. 정부는 20개 항 경제 계획을 내세워 규율을 앞세운 행정을 폈다. 그러나 인디라의 아들 산자이 간디의 영향 아래 강제 불임 시술(1976~1977년 약 830만 건)과 델리의 철거(약 70만 명이 쫓겨남)가 반발을 불렀다. 1977년 1월 18일 인디라가 총선을 발표하고 정치범을 풀어 주었고, 3월 16~20일 선거에서 자나타당 연합이 약 295석(자료에 따라 298석), 동맹을 합치면 330석 넘게 얻은 반면 국민 회의는 154석에 그쳤으며 인디라는 라에바렐리에서 졌다. 3월 21일 비상사태가 풀렸고 모라르지 데사이가 인도 첫 비국민 회의 총리가 되었다. 선거에 진 인디라 간디의 뒷날은 「블루스타 작전과 인디라 간디 암살(1984)」(뒤의 사건)로 이어진다."
  subjects: [india]
  tags: [politics]
  sources: ["Gyan Prakash, Emergency Chronicles: Indira Gandhi and Democracy's Turning Point (Princeton University Press, 2019)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: janata-government-1977
  year: 1977
  endYear: 1980
  title:
    ko: "비상사태의 끝과 자나타 정부(1977~1980)"
  summary:
    ko: "1977년 1월 18일 인디라 간디 총리가 총선을 발표하고 정치범 일부를 풀어 주었다. 3월 16~20일 치른 하원 선거에서 야당들이 합친 자나타당이 약 295석(자료에 따라 298석)을 얻었고 인디라의 국민 회의당은 154석에 그쳤으며, 인디라는 라이바렐리에서, 아들 산자이 간디는 아메티에서 졌다. 투표율은 약 60%였다. 비상사태는 3월 21일 끝났고 3월 24일 모라르지 데사이가 독립 뒤 처음으로 국민 회의당이 아닌 정당 출신 총리가 되었다. 새 정부는 샤 위원회를 세워 비상사태 때의 강제 불임 시술, 도시 철거, 정치범 구금 같은 권력 남용을 조사하게 했고, 헌법을 고쳐(제43·44차 개정) 비상사태를 선포하기 어렵게 만들었다. 새 정부는 1979년 1월 후진 계급 지원책을 다룰 만달 위원회를 세웠고, 위원회 권고는 1990년에야 정치 쟁점이 되었다. 인디라 간디는 1978년 11월 보궐 선거로 하원에 돌아왔다가 12월 의원직에서 제명되고 잠시 구금되었다. 그러나 자나타당은 사회주의자, 국민 회의당에서 나온 사람들, 힌두 민족주의 정당 자나 상 출신이 섞인 연합이어서 내분이 컸다. 1979년 7월 데사이가 물러난 뒤 차란 싱이 국민 회의당의 외부 지지로 총리가 되었으나 지지가 철회되어 의회 표결도 거치지 못한 채 8월에 사임했고 하원이 해산되었다. 1980년 1월 선거에서 국민 회의당이 크게 이겨 인디라 간디가 다시 총리가 되었다. 자나 상 출신들은 1980년 4월 인도 인민당을 세웠다. 이 선거는 비상사태를 겪고도 투표로 정권이 바뀔 수 있음을 보인 일로 평가되나, 정권 교체가 안정된 연립 정부로 이어지지는 못했다(「인도의 비상사태(1975~1977)」(앞의 사건))."
  subjects: [india]
  links: []
  tags: [politics]
  sources: ["Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)", "Barbara D. Metcalf·Thomas R. Metcalf, A Concise History of Modern India (3rd ed., Cambridge University Press, 2012)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)"]

- id: zia-ul-haq-1977
  year: 1977
  endYear: 1988
  title:
    ko: "지아 울하크 군정과 부토 처형(1977~1988)"
  summary:
    ko: "1977년 3월 총선에서 줄피카르 알리 부토 총리의 인민당이 크게 이기자 야당 연합은 부정 선거라며 시위를 벌였고 정국이 마비되었다. 7월 5일 육군 참모 총장 지아 울하크가 '페어 플레이 작전'으로 부토를 몰아내고 계엄령을 선포해 계엄 사령관이 되었다. 부토는 1974년 정적의 아버지 살해를 지시했다는 혐의로 재판을 받아 1978년 3월 라호르 고등 법원에서 사형을 선고받았고, 대법원이 1979년 초 4 대 3으로 판결을 유지해 4월 4일 라왈핀디에서 교수형을 당했다. 지지자들은 사법 살인이라고 불렀으며, 파키스탄 대법원은 2024년 3월 이 재판이 공정한 재판의 기준을 채우지 못했다는 의견을 냈다. 지아는 1978년 9월 대통령 자리에도 올라 '니잠 에 무스타파(예언자의 질서)'를 내세워 이슬람화를 밀어붙였다. 1979년 후두드 법령으로 간통·절도 등에 이슬람 형벌을 도입했고 연방 샤리아 법원(1980)과 자카트(구빈세) 제도를 만들었으며 종교 학교가 늘었다. 1983년 신드를 중심으로 민주 회복 운동이 일어났으나 진압되었다. 1984년 12월 국민 투표로 대통령 임기를 늘렸고 1985년 2월 정당 없이 치른 선거에서 무함마드 칸 준에조가 총리가 되었으며, 헌법 개정(제8차)으로 대통령이 의회를 해산할 권한을 가졌다. 군정은 소련의 아프가니스탄 침공 뒤 미국·사우디아라비아와 손잡고 아프간 저항 세력을 도왔다(「소련–아프가니스탄 전쟁과 파키스탄(1979~1989)」(뒤의 사건)). 1988년 5월 지아가 준에조 정부를 해임했고, 8월 17일 바하왈푸르 부근에서 그가 탄 군용기가 추락해 미국 대사와 군 고위 장성들과 함께 숨졌다. 원인은 규명되지 않았다."
  subjects: [pakistan, usa]
  links: []
  tags: [politics, society, religion]
  sources: ["Ian Talbot, Pakistan: A Modern History (Hurst & Company, 2009)", "Owen Bennett Jones, Pakistan: Eye of the Storm (3rd ed., Yale University Press, 2009)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)", "Supreme Court of Pakistan, 「Reference No. 1 of 2011 (Zulfikar Ali Bhutto), Opinion」 (2024년 3월 6일)"]

- id: bangladesh-military-rule-1977
  year: 1977
  endYear: 1991
  title:
    ko: "방글라데시의 군부 통치와 민주화(1977~1991)"
  summary:
    ko: "1975년 8월 셰이크 무지부르 라만이 군인들에게 살해된 뒤 방글라데시에서는 쿠데타와 반란이 잇따랐다. 육군 참모 총장 지아우르 라만이 1977년 4월 대통령이 되어 국민 투표(5월)와 대통령 선거(1978년 6월)로 정당성을 얻었고, 방글라데시 민족주의당(BNP)을 세웠다. 헌법에서 세속주의를 빼고 '전능하신 알라에 대한 절대적 신뢰'를 넣었다. 1981년 5월 30일 치타공에서 일어난 군인들의 쿠데타 시도로 지아우르가 살해되었다. 압두스 사타르 대통령은 1982년 3월 24일 육군 참모 총장 후세인 무함마드 에르샤드의 무혈 쿠데타로 쫓겨났다. 에르샤드는 계엄 사령관으로서 먼저 대법원 판사 출신 아흐산웃딘 초두리를 대통령에 앉혔다가 1983년 12월 직접 대통령이 되었다. 그는 지방 행정 단위를 고치고 시장을 열었으며 자티야당을 만들어 1986년과 1988년 선거를 치렀으나 야당의 보이콧과 부정 의혹이 컸다. 1988년 헌법 개정으로 이슬람을 국교로 삼았다. 1977년부터 치타공 구릉 지대에서는 벵골 정착민 이주에 맞선 샨티 바히니 무장 투쟁이 이어졌으며 1997년 12월 평화 협정으로 끝났다. 1987년 11월 반정부 시위에서 학생 활동가 누르 호센이 가슴과 등에 구호를 쓴 채 경찰 총에 숨져 민주화 운동의 상징이 되었다. 1990년 아와미 연맹과 BNP를 비롯한 야당들, 학생들이 손잡고 대규모 시위를 벌였고, 에르샤드는 12월 6일 사임했다. 대법원장 샤하부딘 아메드가 이끈 과도 정부가 1991년 2월 27일 선거를 치러 지아우르의 아내 칼레다 지아가 총리가 되었다. 1991년 8월 헌법 개정으로 의원 내각제가 복원되었다. 이후 칼레다 지아의 BNP와 셰이크 하시나의 아와미 연맹이 번갈아 집권하는 구도가 이어졌다."
  subjects: [bangladesh]
  links: []
  tags: [politics]
  sources: ["Craig Baxter, Bangladesh: From a Nation to a State (Westview Press, 1997)", "Ali Riaz, Bangladesh: A Political History since Independence (I.B. Tauris, 2016)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)"]

- id: soviet-afghan-war-pakistan-1979
  year: 1979
  endYear: 1989
  title:
    ko: "소련–아프가니스탄 전쟁과 파키스탄(1979~1989)"
  summary:
    ko: "1978년 4월 아프가니스탄에서 공산 계열 장교들이 정변을 일으켜 정권을 잡자 전통 사회와 이슬람 세력의 반발이 번졌고, 1979년 12월 소련이 친소 정권을 지키려고 군대를 보냈다. 이웃 파키스탄은 아프간 저항 세력의 후방이 되었다. 지아 울하크 군정은 페샤와르에 근거를 둔 아프간 정당 일곱 개를 인정해 무기와 자금이 이들을 거치게 했고, 군 정보부(ISI)가 훈련과 배분을 맡았다. 미국의 중앙 정보국은 사우디아라비아와 같은 액수를 대는 방식으로 '사이클론 작전'을 펼쳤고, 1981년 미국은 파키스탄에 6년간 약 32억 달러의 경제·군사 원조와 F-16 전투기를 주기로 했다. 전쟁을 피해 온 아프간 난민은 1980년대 말 유엔 난민 기구(UNHCR) 집계로 300만 명을 넘어 파키스탄이 세계 최대 난민 수용국이 되었다. 중국도 무기를 공급한 것으로 알려졌고 인도는 소련의 침공을 공개적으로 규탄하지 않았다. 한편 아프간 정부 정보 기관의 폭탄 공격과 영공 침범이 이어졌고, 1988년 4월 라왈핀디 부근 오지리 탄약고가 폭발해 백 명 안팎이 숨졌다고 알려졌다. 무기와 마약이 국내로 흘러들고 종교 학교가 늘어난 것도 이 시기의 영향으로 꼽힌다. 1988년 4월 제네바 협정에서 아프가니스탄과 파키스탄이 서로 내정에 간섭하지 않기로 하고 미국·소련이 보증했으며, 소련군은 1989년 2월 15일 철수를 마쳤다. 소련군 전사자는 약 1만 4천 명이고 아프간 민간인 사망은 56만~200만 명 등 추산이 크게 갈린다. 소련이 물러난 뒤 아프간 내전이 이어졌고 1990년대에 파키스탄의 지원을 받은 탈레반이 일어났다(「신냉전과 대한항공 007편 격추」(같은 시기의 사건))."
  subjects: [pakistan, soviet-union, usa]
  links: []
  tags: [war, diplomacy, politics]
  sources: ["Steve Coll, Ghost Wars: The Secret History of the CIA, Afghanistan, and Bin Laden, from the Soviet Invasion to September 10, 2001 (Penguin Press, 2004)", "Barnett R. Rubin, The Fragmentation of Afghanistan: State Formation and Collapse in the International System (2nd ed., Yale University Press, 2002)", "Ian Talbot, Pakistan: A Modern History (Hurst & Company, 2009)"]

- id: sri-lanka-civil-war-1983
  year: 1983
  endYear: 2009
  title:
    ko: "스리랑카 내전과 인도 평화 유지군(1983~2009)"
  summary:
    ko: "싱할라어를 유일한 공용어로 한 1956년 법과 1972년 헌법이 불교에 으뜸 지위를 준 것, 대학 입학과 공직에서 타밀인이 겪은 불이익에 맞서 타밀 정당들은 1976년 분리 독립 결의를 채택했고 벨루필라이 프라바카란의 타밀 엘람 해방 호랑이(LTTE) 같은 무장 조직이 생겼다. 1983년 7월 23일 자프나에서 LTTE 매복으로 군인 13명이 숨지자 콜롬보 등에서 싱할라 군중이 타밀인을 습격한 '검은 7월'이 일어나 수백~수천 명(추산이 갈림)이 죽고 많은 타밀인이 피란했으며, 이를 내전의 시작으로 본다. 1987년 7월 인도의 라지브 간디 총리와 J. R. 자야와르데네 대통령이 협정을 맺어 인도 평화 유지군이 북동부에 들어갔으나 오히려 LTTE와 싸우게 되었고 인도군 1천 명 넘게 숨진 뒤 1990년 3월 철수했다. LTTE는 1991년 5월 라지브 간디를, 1993년 5월 라나싱헤 프레마다사 대통령을 자살 폭탄으로 암살했다. 2002년 2월 노르웨이의 중재로 휴전 협정이 맺어졌으나 2006년 다시 싸움이 시작되었고 정부는 2008년 협정에서 공식 탈퇴했다. 2009년 정부군이 북동부 물라이티부 해안에서 마지막 공세를 펴 5월 18일 프라바카란이 죽고 정부는 전쟁이 끝났다고 선포했다. 유엔 전문가단(2011)은 마지막 몇 달간 민간인 최대 4만 명이 숨졌을 수 있고 상당수가 정부군 포격에 의한 것이라고 보았다. 정부는 이를 부인했다. LTTE는 민간인을 인간 방패로 삼고 소년병을 모집했다는 비판을 받았으며, 미국·인도·유럽 연합 등이 LTTE를 테러 단체로 지정했다. 전체 사망자는 8만~10만 명 안팎으로 추산되나 집계마다 크게 다르다. 전쟁이 끝난 뒤에도 책임 규명과 실종자 문제가 풀리지 않았다."
  subjects: [sri-lanka, india]
  links:
    - { from: india, to: sri-lanka, note: "인도 평화 유지군 파견 (1987)" }
  tags: [war, politics, society]
  sources: ["Neil DeVotta, Blowback: Linguistic Nationalism, Institutional Decay, and Ethnic Conflict in Sri Lanka (Stanford University Press, 2004)", "Report of the Secretary-General's Panel of Experts on Accountability in Sri Lanka (United Nations, 2011)", "OHCHR Investigation on Sri Lanka (OISL), Report of the OHCHR Investigation on Sri Lanka, A/HRC/30/CRP.2 (유엔 인권 이사회, 2015)"]

- id: operation-blue-star-1984
  year: 1984
  title:
    ko: "블루스타 작전과 인디라 간디 암살(1984)"
  summary:
    ko: "인도 펀자브주의 시크 정당 아칼리 달은 1973년 아난드푸르 사히브 결의로 주의 자치권 확대를 요구했고 1982년 '정의의 전쟁' 운동을 벌였다. 이 과정에서 설교자 자르네일 싱 빈드란왈레와 무장한 추종자들이 시크교 최고 성지 하르만디르 사히브(황금 사원)와 아칼 타크트 안에 진을 쳤다. 인디라 간디 정부는 협상이 실패하자 1984년 6월 1~10일 '블루스타 작전'을 펴 5일 밤부터 전차를 앞세워 사원 단지로 진입했고, 빈드란왈레는 죽었다. 정부 백서는 군인 83명과 민간인·무장 인원을 합친 약 490명(자료에 따라 492~493명)의 사망을 밝혔으나 시크 단체와 독립 조사자들은 순례객을 포함한 훨씬 많은 사망자를 주장한다. 아칼 타크트가 크게 부서져 시크 사회의 분노가 컸고 일부 시크 병사가 군영을 이탈했다. 작전이 시크교 순례객이 많이 모이는 6월 초 순교일 무렵에 시작되어 순례객 피해 논란이 컸다. 군은 뒤이어 펀자브 마을을 수색하는 '우드로즈 작전'을 벌였다. 10월 31일 인디라 간디는 자택에서 시크 경호원 두 명의 총에 맞아 숨졌고, 아들 라지브 간디가 그날 저녁 총리직에 올랐다. 이어 사흘 남짓 델리 등 여러 곳에서 시크 주민을 노린 폭력이 일어나 정부 집계로 델리에서 약 2,800명, 전국에서 약 3,350명이 죽었다. 시민 단체는 더 많다고 보며 여러 조사 위원회와 재판이 수십 년 이어졌다. 1985년 7월 라지브 간디와 아칼리 달 지도자 하르찬드 싱 롱고왈이 협정을 맺었으나 롱고왈이 한 달 뒤 암살되었고, 펀자브에서는 시크 분리 국가 칼리스탄을 내세운 무장 투쟁과 경찰의 대응이 1990년대 초까지 이어졌다. 1985년 6월 에어 인디아 182편 폭파(329명 사망)도 캐나다 수사 당국이 시크 급진 단체와 연결해 보았다."
  subjects: [india]
  links: []
  tags: [politics, war, religion, society]
  sources: ["Mark Tully·Satish Jacob, Amritsar: Mrs Gandhi's Last Battle (Jonathan Cape, 1985)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)", "Barbara D. Metcalf·Thomas R. Metcalf, A Concise History of Modern India (3rd ed., Cambridge University Press, 2012)"]

- id: bhopal-disaster-1984
  year: 1984
  title:
    ko: "보팔 가스 참사(1984)"
  summary:
    ko: "1984년 12월 2일 밤부터 3일 새벽 사이 인도 마디아프라데시주 보팔에 있던 미국 유니언 카바이드 사의 인도 자회사 살충제 공장에서 맹독성 메틸 이소시아네이트 가스가 새어 나왔다. 저장 탱크에 물이 들어가 폭주 반응이 일어났고 안전 장치가 제대로 작동하지 않았다. 공장 둘레에는 가난한 주민이 밀집해 살았고 인근 50만 명 안팎이 가스에 노출되었다고 추산된다. 사이렌은 늦게 울렸고 의사들은 가스의 성분을 몰라 치료가 늦었다. 주 정부는 사망자를 3,787명으로 확인했으나 사고 직후 집계는 이보다 낮았고, 민간 의료 단체와 일부 연구자는 처음 몇 주에만 8,000명이 숨졌고 나중에 숨진 사람까지 합치면 1만 5천 명을 넘는다고 본다. 인도 정부가 2006년 법원에 낸 서류는 부상자를 55만 8천여 명으로 적었다. 유니언 카바이드는 1989년 2월 인도 정부와 4억 7천만 달러에 합의했고 대법원이 1991년 합의를 유지했으나 피해자 단체는 보상이 너무 적다고 반발했다. 당시 회장 워런 앤더슨은 체포 뒤 보석으로 풀려난 채 인도에 돌아오지 않아 도망자로 선언되었고 2014년 미국에서 죽었다. 2010년 6월 보팔 법원은 인도 자회사의 전 간부 일곱 명에게 업무상 과실치사로 징역 2년을 선고했다. 회사를 2001년 인수한 다우 케미컬은 책임이 없다고 한다. 부지의 오염 제거는 오래 이루어지지 않았고 수십 년 뒤에도 후유증과 지하수 오염을 호소하는 주민이 많다. 이 참사는 미국에서 1986년 지역 사회의 유해 물질 정보 알 권리법이 만들어지는 계기가 되었고, 다국적 기업의 책임, 개발 도상국의 산업 안전과 규제를 둘러싼 논쟁의 대표 사례가 되었다."
  subjects: [india, usa]
  links: []
  tags: [society, economy]
  sources: ["Sanjoy Hazarika, Bhopal: The Lessons of a Tragedy (Penguin India, 1987)", "Suroopa Mukherjee, Surviving Bhopal: Dancing Bodies, Written Texts, and Oral Testimonies of Women in the Wake of an Industrial Disaster (Palgrave Macmillan, 2010)"]

- id: benazir-sharif-1988
  year: 1988
  endYear: 1999
  title:
    ko: "베나지르 부토와 나와즈 샤리프의 교대 집권(1988~1999)"
  summary:
    ko: "지아 울하크가 숨진 뒤 1988년 11월 총선에서 파키스탄 인민당이 제1당이 되어 12월 2일 베나지르 부토가 이슬람권 나라의 첫 여성 총리가 되었다. 처형된 줄피카르 알리 부토의 딸이다. 그러나 굴람 이스하크 칸 대통령이 헌법 개정(1985)으로 갖게 된 의회 해산권으로 1990년 8월 정부를 해임했고, 같은 해 11월 선거에서 이슬람 민주 동맹의 나와즈 샤리프가 총리가 되었다. 1993년 4월 샤리프도 같은 방식으로 해임되었으나 대법원이 복귀시켰고, 7월 대통령과 총리가 함께 물러난 뒤 임시 정부(총리 모인 쿠레시)가 10월 선거를 치러 부토가 다시 총리가 되었다. 1996년 11월 파루크 레가리 대통령이 부패 혐의로 부토 정부를 해임했다. 1997년 2월 선거에서 샤리프의 무슬림 연맹이 압승했고, 4월 헌법 제13차 개정으로 대통령의 해산권을 없애 의원 내각제를 강화했다. 샤리프는 그 뒤 대법원장 사자드 알리 샤와 부딪쳐 법원과 대립했고(1997년 12월 대법원장 퇴진), 1998년 10월 육군 참모 총장 자항기르 카라마트가 물러난 뒤 페르베즈 무샤라프를 후임으로 앉혔다. 샤리프 정부는 1998년 5월 핵실험을 하고(「인도와 파키스탄의 핵실험(1998)」(뒤의 사건)) 1999년 2월 인도 총리 아탈 비하리 바지파이를 라호르에서 맞았으나 곧 카르길에서 충돌이 일었다(「카르길 전쟁(1999)」(뒤의 사건)). 11년 동안 선출 정부가 네 번 들어섰다가 모두 임기를 채우지 못하고 해임이나 퇴진으로 끝났으며, 두 사람은 서로를 부패와 억압으로 비난했다. 카라치에서는 무하지르 민족 운동과 정부의 충돌, 종파 폭력이 계속되었다. 1990년대 중반 파키스탄은 아프가니스탄의 탈레반 정권을 지원했다."
  subjects: [pakistan, india]
  links: []
  tags: [politics]
  sources: ["Ian Talbot, Pakistan: A Modern History (Hurst & Company, 2009)", "Owen Bennett Jones, Pakistan: Eye of the Storm (3rd ed., Yale University Press, 2009)"]

- id: bhutan-lhotshampa-1990
  year: 1990
  endYear: 2016
  title:
    ko: "부탄 남부 주민의 추방과 난민(1990~2016)"
  summary:
    ko: "부탄 남부에는 19세기 말부터 네팔어를 쓰는 주민이 이주해 정착했고, 이들을 로트샴파(남쪽 사람)라고 부른다. 미국 국무부는 2008년 이들이 인구의 약 35%라고 추산했고, 비율은 자료마다 다르다. 부탄 왕국은 1985년 시민권법으로 1958년 이전 거주를 증명하도록 요구했고, 1988년 남부 인구 조사에서 상당수를 불법 이주자로 분류했다. 1989년에는 '하나의 나라, 하나의 민족' 정책 아래 북부 불교 문화에 맞춘 전통 의상과 예법(드리글람 남사) 착용이 공공장소에서 의무가 되었고 학교에서 네팔어 교육이 빠졌다. 1990년 9~10월 남부에서 이에 반대하는 시위가 벌어졌고, 정부는 이를 반국가 행위로 보고 진압해 수만 명이 부탄을 떠났다. 난민 단체는 강제 추방과 고문, 재산 몰수를 증언하나 부탄 정부는 상당수가 자발적으로 떠났거나 부탄 시민이 아니었다는 입장이다. 연구자들은 1990년대 초까지 10만 명 안팎이 떠났다고 본다. 이들은 인도를 거쳐 네팔 동부 자파·모랑 지역으로 갔고 2010년 1월 유엔 난민 기구가 관리하는 캠프 일곱 곳에 약 8만 5천 명이 있었다. 네팔과 부탄은 1993년부터 여러 차례 회담했으나 송환은 진전이 없었고 인도는 양국 문제라며 개입하지 않았다. 2007년부터 미국·캐나다·호주·영국·북유럽 나라들이 난민을 받아들이는 제3국 정착이 시작되어 2016년 무렵까지 10만 명 남짓이 떠났고 캠프에는 1만 명 남짓이 남았다. 같은 시기 부탄은 국민 총행복을 내세우며 헌법과 입헌 군주제를 준비했는데, 이 난민 문제는 그 평가에서 늘 비판 거리로 거론된다(「부탄의 입헌 군주제와 국민 총행복(2008)」(뒤의 사건))."
  subjects: [bhutan, nepal, india]
  links: []
  tags: [society, politics]
  sources: ["Michael Hutt, Unbecoming Citizens: Culture, Nationhood, and the Flight of Refugees from Bhutan (Oxford University Press, 2003)"]

- id: india-reforms-1991
  year: 1991
  title:
    ko: "라지브 간디 암살과 1991년 경제 개혁(1991)"
  summary:
    ko: "인디라 간디가 죽은 1984년 그의 아들 라지브 간디가 총리가 되었으나 보포르스 무기 거래 의혹으로 1989년 선거에서 졌고, 뒤이은 소수 정부들이 짧게 이어졌다. 1990년 8월 이라크의 쿠웨이트 침공으로 유가가 오르고 걸프 지역 인도인의 송금이 끊겼으며 소련과의 교역이 무너졌다. 재정 적자와 대외 부채까지 겹쳐 1991년 중반 외환 보유고는 몇 주치 수입 대금 수준으로 떨어졌다. 1991년 5월 21일 선거 유세 중이던 라지브 간디는 타밀나두의 스리페룸부두르에서 스리랑카 타밀 무장 조직 LTTE 소속으로 알려진 여성의 자살 폭탄에 숨졌다. 선거에서 국민 회의당이 제1당이 되자 6월 21일 P. V. 나라심하 라오가 소수 정부 총리가 되었고 경제학자 만모한 싱을 재무 장관에 앉혔다. 7월 초 루피를 두 차례 약 19% 평가 절하했고 금을 영국·스위스 은행에 담보로 맡기는 한편 국제 통화 기금(IMF)의 긴급 자금을 받았다. 7월 24일 새 산업 정책으로 18개 업종 말고는 산업 허가제를 없앴고 외국인 직접 투자를 51%까지 자동으로 허용했으며 수입 관세를 낮추고 금융 부문 규제를 풀었다. 개혁의 상당 부분은 1980년대 라지브 간디 정부의 부분적 자유화에서 이어진 것이다. 이는 네루 이래의 계획 경제와 보호 무역에서 시장 개방으로의 전환으로 평가된다. 이후 1990년대 인도의 성장은 이전보다 빨라졌고 빈곤율도 줄었다고 평가되나, 불평등과 고용 없는 성장, 농촌의 어려움을 비판하는 연구도 많다. 같은 해 말 소련이 해체되어 인도는 오랜 우방과 무기 공급국을 잃었다(「소련의 해체」(같은 해의 사건)). 라지브 간디 암살에 관련된 수감자 여섯 명이 2022년 11월 대법원 결정으로 풀려났다."
  subjects: [india, sri-lanka, soviet-union]
  links: []
  tags: [economy, politics]
  sources: ["Vijay Joshi·I. M. D. Little, India's Economic Reforms, 1991–2001 (Clarendon Press, 1996)", "Jagdish Bhagwati·Arvind Panagariya, Why Growth Matters: How Economic Growth in India Reduced Poverty and the Lessons for Other Developing Countries (PublicAffairs, 2013)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: babri-masjid-1992
  year: 1992
  endYear: 2024
  title:
    ko: "바브리 모스크 파괴와 아요디아 분쟁(1992~2024)"
  summary:
    ko: "우타르프라데시주 아요디아의 바브리 모스크는 1528년 무굴 제국의 바부르 휘하 장군 미르 바키가 지은 것으로 알려지며, 힌두교도는 이곳이 라마의 탄생지라고 믿어 왔다. 1949년 12월 밤 모스크 안에 신상이 놓였고 법원은 출입을 막았으며, 1986년 지방 법원이 힌두교도의 예배를 허용해 문을 열게 했다. 힌두 단체 비슈바 힌두 파리샤드(VHP)는 라마 사원 건립 운동을 벌였고 인도 인민당의 L. K. 아드바니는 1990년 가을 전국을 도는 '라마 수레 행진'을 이끌었다. 1992년 12월 6일 VHP, 라슈트리야 스와얌세박 상(RSS), 인도 인민당 지지자 약 15만 명이 모인 집회가 군중의 공격으로 번져 몇 시간 만에 모스크가 무너졌다. 이어 인도 곳곳에서 폭동이 일어나 최소 2,000명이 숨졌으며 대부분 무슬림이었다. 1992년 12월~1993년 1월 뭄바이 폭동에서만 약 900명이 죽었고 1993년 3월 뭄바이 연쇄 폭탄 공격(약 250명 사망)이 폭동의 보복으로 거론되었다. 파키스탄과 방글라데시에서도 힌두 사원이 공격받았다. 리베르한 위원회는 2009년 보고서에서 파괴가 즉흥적이 아니라 계획된 것이라고 판단하며 68명을 지목했다. 2010년 알라하바드 고등 법원은 땅을 셋으로 나누라고 판결했다. 2019년 11월 9일 대법원은 만장일치로 다툼이 된 땅을 라마 신상 쪽에 주어 사원을 짓게 하고 이슬람 쪽에는 아요디아의 다른 곳에 5에이커를 주라고 했으며, 모스크 파괴는 불법이었다고 보았다. 2020년 9월 특별 법원은 기소된 32명을 모두 무죄로 판결했다. 2024년 1월 22일 나렌드라 모디 총리가 참석해 사원의 라마 신상 봉안식이 열렸다."
  subjects: [india, pakistan, bangladesh]
  links: []
  tags: [religion, society, politics]
  sources: ["Sarvepalli Gopal 엮음, Anatomy of a Confrontation: The Babri Masjid–Ramjanmabhumi Issue (Penguin Books India, 1991)", "Christophe Jaffrelot, The Hindu Nationalist Movement in India (Columbia University Press, 1996)", "Supreme Court of India, 「M. Siddiq (D) Thr Lrs v. Mahant Suresh Das & Ors」 (2019년 11월 9일)", "Ramachandra Guha, India After Gandhi: The History of the World's Largest Democracy (Ecco, 2007)"]

- id: nepal-civil-war-1996
  year: 1996
  endYear: 2008
  title:
    ko: "네팔 내전과 왕정 폐지(1996~2008)"
  summary:
    ko: "네팔에서는 1960년 마헨드라 왕이 의회를 해산한 뒤 정당 없는 판차야트 체제가 이어졌다. 1990년 네팔 의회당과 좌파 연합이 이끈 민주화 운동 끝에 비렌드라 왕이 정당 활동을 허용하고 그해 11월 새 헌법으로 입헌 군주제와 복수 정당제를 세웠다. 그러나 정치 불안과 가난, 지역 격차가 이어지자 1996년 2월 13일 푸슈파 카말 다할(프라찬다)이 이끈 네팔 공산당(마오주의)이 서부 롤파·루쿰 등에서 경찰서를 습격하며 '인민 전쟁'을 시작했다. 반군은 농촌을 장악하고 학교와 마을에서 후원금을 거두고 소년병을 모집했으며, 정부 보안군도 의심 지역 주민을 실종시키고 고문했다는 인권 단체의 비판을 받았다. 2001년 6월 1일 왕궁에서 비렌드라 왕 부부 등 왕실 구성원이 총격으로 숨졌고 조사 위원회는 황태자 디펜드라의 범행이라고 발표했다. 이후 즉위한 갸넨드라 왕은 2001년 군대(왕립 네팔군)를 반군 진압에 투입했고 2005년 2월 1일 직접 통치에 나섰다. 2005년 11월 정당 연합과 마오주의 반군이 12개 항 합의를 맺었고, 2006년 4월 이들이 손잡은 두 번째 민주화 운동으로 시위대 19~23명(집계마다 다름)이 숨진 끝에 왕은 의회를 되살렸다. 11월 21일 정부와 마오주의 반군은 포괄적 평화 협정을 맺었다. 내전에서 1만 7천 명이 넘게 숨졌고 인권 단체 집계로는 보안군이 약 8,200명, 반군이 4천여 명을 숨지게 했으며 수천 명이 실종되었다. 2008년 4월 제헌 의회 선거에서 마오주의 정당이 제1당이 되었고 5월 28일 첫 회의가 왕정을 폐지하고 연방 민주 공화국을 선포했다. 8월 다할이 총리가 되었다. 새 헌법은 2015년 9월에야 공포되었다."
  subjects: [nepal]
  links: []
  tags: [war, politics]
  sources: ["Michael Hutt 엮음, Himalayan 'People's War': Nepal's Maoist Rebellion (C. Hurst & Co./Indiana University Press, 2004)", "Mahendra Lawoti·Anup K. Pahari 엮음, The Maoist Insurgency in Nepal: Revolution in the Twenty-First Century (Routledge, 2010)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)"]

- id: nuclear-tests-1998
  year: 1998
  title:
    ko: "인도와 파키스탄의 핵실험(1998)"
  summary:
    ko: "인도는 1974년 5월 18일 라자스탄 포크란에서 '평화적 핵 폭발'이라며 첫 핵실험을 했고, 파키스탄은 1971년 전쟁에서 진 뒤 줄피카르 알리 부토 때부터 핵 개발에 나서 1980년대에 사실상 능력을 갖춘 것으로 알려졌다. 1998년 3월 아탈 비하리 바지파이가 이끄는 인도 인민당 연립 정부가 들어선 뒤 인도는 5월 11일 세 기, 13일 두 기의 지하 핵 장치를 터뜨렸다고 발표했다. 인도 인민당은 선거 공약에서 핵 무기 선택지를 내세워 왔다. 바지파이 총리는 인도가 핵 보유국이 되었다고 선언했고 국방 장관 조지 페르난데스는 중국을 잠재적 위협으로 거론했다. 국내 여론은 대체로 환영했으나 반핵 운동가들은 반대했다. 샤리프 총리의 파키스탄은 5월 28일 발루치스탄의 차가이 산악 지역에서 다섯 기, 30일 한 기를 시험했다고 발표해 대응했다. 양국이 밝힌 위력은 지진 기록을 바탕으로 한 외부 추정치보다 크다는 지적이 있다. 미국은 글렌 수정안에 따라 두 나라에 경제·군사 원조 제한 등의 제재를 가했고 일본은 새 대출을 얼려 두었으며, 유엔 안전 보장 이사회는 6월 6일 결의 1172호로 두 나라의 시험을 규탄하고 핵 확산 금지 조약과 포괄적 핵 실험 금지 조약 서명을 촉구했다. 두 나라 모두 서명하지 않았다. 인도는 선제 불사용을 내세운 핵 교리 초안을 1999년 발표했다. 제재는 2001년 9·11 뒤 대부분 풀렸다. 핵 억지가 안정을 가져오는지 군비 경쟁을 부르는지를 둘러싼 논쟁이 두 나라 안팎에서 일었다. 핵으로 서로를 막을 수 있다는 기대와 달리 1999년 두 나라는 카르길에서 부딪혔고, 이후에도 핵 보유국 사이의 위기가 거듭되었다(「카르길 전쟁(1999)」(뒤의 사건))."
  subjects: [india, pakistan, usa, prc, japan]
  links: []
  tags: [politics, war, diplomacy]
  sources: ["George Perkovich, India's Nuclear Bomb: The Impact on Global Proliferation (University of California Press, 1999)", "Feroz Hassan Khan, Eating Grass: The Making of the Pakistani Bomb (Stanford University Press, 2012)", "United Nations Security Council, 「Resolution 1172 (1998)」 (1998년 6월 6일)"]

- id: kargil-war-1999
  year: 1999
  title:
    ko: "카르길 전쟁(1999)"
  summary:
    ko: "1999년 2월 인도 총리 바지파이가 라호르를 방문해 파키스탄 샤리프 총리와 카슈미르 문제를 양자 대화로 풀겠다는 라호르 선언을 발표했다. 그러나 그 겨울과 봄 파키스탄 북부 경비대 병력이 통제선을 넘어 라다크 카르길 지역의 인도 쪽 고지 수십 곳을 차지했다. 5월 초 목동의 신고로 침투가 드러나자 인도군이 '비자야 작전'을 폈고, 5월 26일부터 공군도 폭격에 나섰다. 침투는 카르길과 스리나가르를 잇는 도로의 보급선을 위협하려는 것으로 보였다. 해발 5,000m 안팎의 고지를 되찾는 싸움은 톨롤링과 타이거 힐 등에서 격렬했다. 파키스탄은 처음에 침투자가 카슈미르 자유 투사라고 했으나 뒤에 정규군 참여가 알려졌고, 샤리프는 육군 참모 총장 페르베즈 무샤라프가 계획했고 자신은 몰랐다고 했으며 무샤라프는 샤리프가 사전 보고를 받았다고 말했다. 1998년 핵실험 이듬해에 핵 보유국끼리 벌인 첫 본격 교전이어서 국제 사회의 압박이 컸다(「인도와 파키스탄의 핵실험(1998)」(앞의 사건)). 7월 4일 샤리프가 워싱턴에서 빌 클린턴 대통령을 만난 뒤 병력을 물리기로 했고, 인도는 7월 26일 작전의 성공을 선언했다. 인도 정부는 사망자를 527명이라고 밝혔다. 파키스탄 쪽 사망자는 군 발표 약 350~450명이고 샤리프는 나중에 4천 명이라 했으며 미국은 700명 안팎으로 추정해 집계가 갈린다. 인도는 정보 실패를 따진 카르길 검토 위원회 보고서(2000)에 따라 국방 체제를 손보았다. 파키스탄에서는 10월 12일 샤리프가 무샤라프를 해임하려다 무샤라프의 군사 정변으로 쫓겨났다(「무샤라프 군정과 2005년 카슈미르 지진(1999~2008)」(같은 시기의 사건))."
  subjects: [india, pakistan, usa]
  links: []
  tags: [war, politics]
  sources: ["Peter R. Lavoy 엮음, Asymmetric Warfare in South Asia: The Causes and Consequences of the Kargil Conflict (Cambridge University Press, 2009)", "Kargil Review Committee, From Surprise to Reckoning: The Kargil Review Committee Report (Sage Publications, 2000)", "Owen Bennett Jones, Pakistan: Eye of the Storm (3rd ed., Yale University Press, 2009)"]

- id: musharraf-1999
  year: 1999
  endYear: 2008
  title:
    ko: "무샤라프 군정과 2005년 카슈미르 지진(1999~2008)"
  summary:
    ko: "1999년 10월 12일 총리 나와즈 샤리프가 스리랑카에서 돌아오는 육군 참모 총장 페르베즈 무샤라프를 해임하려 하자 군이 총리 관저를 장악했다. 무샤라프는 최고 행정관이 되었고 대법원은 2000년 5월 이를 인정했다. 샤리프는 사우디아라비아로 보내졌고 무샤라프는 2001년 6월 대통령 자리에 올랐다. 2001년 9·11 뒤 미국이 압박하자 탈레반 지원을 접고 아프가니스탄 전쟁에서 미국을 돕는 쪽으로 돌아섰다. 이는 국내 무장 단체와 부족 지역의 폭력을 키웠다는 평가를 받는다. 2002년 국민 투표와 법적 틀 명령으로 권한을 굳히고 10월 총선에서 친정부 무슬림 연맹이 제1당이 되었다. 카슈미르에서는 2001년 7월 아그라 정상 회담이 성과 없이 끝났고 그해 12월 인도 의회 습격 뒤 양국이 병력을 대치시켰으나, 2003년 11월 통제선 휴전이 이루어져 대화가 재개되었다. 2005년 10월 8일 무자파라바드 부근을 진원지로 규모 7.6의 지진이 일어나 파키스탄 정부 집계 약 8만 7천 명이 숨지고 350만 명이 집을 잃었으며 인도 쪽 카슈미르에서도 1,360명이 죽었다. 학교 건물이 무너져 어린이 희생이 컸다. 구호를 위해 통제선의 통행 지점 다섯 곳이 지정되어 2005년 11월부터 차례로 열렸다. 2007년 3월 무샤라프가 대법원장을 직무 정지시키자 변호사 운동이 일어났고 7월 이슬라마바드 붉은 모스크 진압, 11월 3일 비상 사태 선포가 이어졌다. 12월 27일 총선 유세 중이던 베나지르 부토가 암살되었다. 2008년 2월 총선에서 인민당이 이기자 무샤라프는 탄핵 압력 속에 8월 18일 사임했다. 이 시기 발루치스탄에서도 무장 투쟁이 되살아났다."
  subjects: [pakistan, india, usa]
  links: []
  tags: [politics, society]
  sources: ["Pervez Musharraf, In the Line of Fire: A Memoir (Free Press, 2006)", "Ian Talbot, Pakistan: A Modern History (Hurst & Company, 2009)", "Hassan Abbas, Pakistan's Drift into Extremism: Allah, the Army, and America's War on Terror (M. E. Sharpe, 2005)", "Owen Bennett Jones, Pakistan: Eye of the Storm (3rd ed., Yale University Press, 2009)"]

- id: gujarat-riots-2002
  year: 2002
  title:
    ko: "구자라트 폭동(2002)"
  summary:
    ko: "2002년 2월 27일 아요디아에서 돌아오던 순례객들이 탄 사바르마티 급행열차의 객차가 구자라트주 고드라역 부근에서 불타 힌두교 순례객 등 59명이 숨졌다. 주 정부는 이슬람 군중의 방화로 보았고 이후 나나바티·샤 위원회와 법원은 방화로 판단했으나, 2004년 연방 철도부가 세운 바네르지 위원회는 2005~2006년 보고서에서 사고 가능성을 제기했으나 구자라트 고등 법원이 2006년 10월 이 위원회의 구성을 무효라고 판결해 논란이 있었다. 이튿날부터 구자라트 곳곳에서 힌두 군중이 무슬림 주민과 재산을 공격했고 아메다바드 등에서 몇 달 동안 폭력이 이어졌다. 인도 정부가 2005년 의회에 밝힌 집계는 사망 1,044명(무슬림 790명, 힌두 254명)에 실종 223명이었고, 시민 조사 단체와 연구자들은 사망이 2천 명을 넘고 대부분이 무슬림이었다고 추산한다. 최대 15만 명이 피란했다. 인권 단체 휴먼 라이츠 워치와 일부 조사 기관은 주 정부와 경찰이 폭력을 막지 않았거나 도왔다고 비판했고, 당시 주 총리였던 나렌드라 모디는 이를 부인했다. 대법원이 세운 특별 수사팀은 2012년 모디에게 책임을 물을 증거가 없다는 종결 보고서를 냈고 대법원은 2022년 6월 이에 대한 이의 신청을 기각했다. 고드라 열차 방화 재판에서는 2011년 31명이 유죄 판결을 받았다(11명 사형, 20명 종신형, 2017년 고등 법원이 사형을 종신형으로 바꿈). 나로다 파티야 학살 재판에서 2012년 32명이 유죄 판결을 받았으나(이 가운데 마야 코드나니는 2018년 고등 법원에서 무죄로 뒤집혔다) 베스트 베이커리 사건은 재판이 마하라슈트라주로 옮겨져 2006년 유죄가 나왔다. 많은 피해자가 오랫동안 임시 거처에 머물렀다. 이 사건은 인도 안에서 종교 공동체 관계와 국가의 책임을 둘러싼 논쟁의 중심에 있고, 모디는 2014년 총리가 되었다(「모디 집권과 370조 폐지(2014~2024)」(뒤의 사건))."
  subjects: [india]
  links: []
  tags: [society, religion, politics]
  sources: ["Martha C. Nussbaum, The Clash Within: Democracy, Religious Violence, and India's Future (Harvard University Press, 2007)", "Human Rights Watch, 「We Have No Orders to Save You」: State Participation and Complicity in Communal Violence in Gujarat (2002)", "Christophe Jaffrelot 엮음, Hindu Nationalism: A Reader (Princeton University Press, 2007)"]

- id: indian-ocean-tsunami-2004
  year: 2004
  title:
    ko: "인도양 지진 해일(2004)"
  summary:
    ko: "2004년 12월 26일 현지 시각 오전 8시 직전 인도네시아 수마트라섬 서쪽 앞바다에서 규모 9.1~9.3의 지진이 일어났다. 스리랑카와 인도 동해안에는 지진 뒤 두 시간 안팎에 파도가 닿았으나 인도양에는 경보 체계가 없었다. 해일은 인도양 연안 14개국을 덮쳐 전체 사망자가 약 23만 명에 이르렀고 인도네시아 아체 지역이 가장 컸다. 남아시아에서는 스리랑카가 약 3만 5천 명으로 가장 많이 죽었다. 동쪽과 남쪽 해안이 가장 피해가 컸으며 갈레 부근에서는 해안선을 달리던 열차가 파도에 휩쓸려 1,700명 안팎이 숨졌다. 건물 약 9만 채가 파괴되어 수십만 명이 집을 잃었다. 내전 중이던 북동부 LTTE 장악 지역도 큰 피해를 입었다. 정부와 LTTE는 2005년 6월 구호 공동 운영 협정을 맺었으나 스리랑카 대법원이 일부 효력을 멈추게 해 무산되었고 정치 대립이 구호에 영향을 미쳤다. 인도에서는 타밀나두 해안과 안다만·니코바르 제도를 중심으로 1만 명이 넘는 사람이 죽었는데, 정부 집계는 사망 1만 749명에 실종 5천 6백여 명이 따로 있고 사망 확인과 추산을 합친 집계는 1만 2천~1만 6천 명 사이에서 갈린다. 인도 정부는 외국의 원조를 받지 않겠다고 하고 해군으로 스리랑카('레인보 작전')와 몰디브('카스토르 작전')에 구호품을 보냈다. 몰디브에서는 사망자가 80여 명이었으나 섬 대부분이 물에 잠겼고 경제 피해가 국내 총생산의 절반 안팎에 이르렀다는 평가가 있다. 국제 사회의 기부액은 140억 달러를 넘었다. 이 재난은 인도양 쓰나미 경보 체계가 2006년 가동되는 계기가 되었다. 스리랑카 정부는 해안선에서 100~200m 안을 건축 금지 구역으로 정했는데 이를 두고 어민의 이주와 복구를 둘러싼 갈등이 오래 남았다."
  subjects: [sri-lanka, india]
  links: []
  tags: [society, economy]
  sources: ["Edward Bryant, Tsunami: The Underrated Hazard (3rd ed., Springer, 2014)", "Asian Development Bank·Japan Bank for International Cooperation·World Bank, Sri Lanka 2005 Post-Tsunami Recovery Program: Preliminary Damage and Needs Assessment (2005)"]

- id: mumbai-attacks-2008
  year: 2008
  title:
    ko: "뭄바이 공격(2008)"
  summary:
    ko: "2008년 11월 26일 밤부터 29일까지 무장한 열 명이 인도 최대 상업 도시 뭄바이의 여러 곳을 공격했다. 이들은 카라치에서 배를 타고 바다를 건너 고무 보트로 상륙했다. 표적은 기차역 차트라파티 시바지 터미너스, 타지마할 팰리스 호텔과 오베로이 트라이던트 호텔, 레오폴드 카페, 유대 교육 시설 나리만 하우스 등이었고 외국인이 많이 머무는 곳이 포함되었다. 인도 국가 보안 경호대가 29일 호텔 진압을 끝낼 때까지 공격자 아홉 명이 죽고 166명이 숨졌으며 3백 명 넘게 다쳤다. 희생자 가운데는 미국·이스라엘·영국 등 외국 국적자도 있었다. 살아서 붙잡힌 아지말 카사브는 재판을 받고 2012년 11월 21일 교수형을 당했다. 인도 정부는 위성 전화 통화 기록 등을 근거로 파키스탄에 근거를 둔 무장 단체 라슈카르에타이바와 파키스탄 정보 기관의 관여를 주장했고, 파키스탄은 처음에는 부인하다가 2009년 1월 카사브가 파키스탄 시민임을 인정하고 계획 일부가 파키스탄에서 이루어졌다고 밝히며 용의자 일곱 명을 재판에 넘겼다. 이 단체는 인도·미국·유엔 안전 보장 이사회 등으로부터 테러 단체로 지정되었다. 미국 시민 데이비드 헤들리는 공격 전 현장 답사를 한 혐의로 2010년 미국에서 유죄를 인정했다. 파키스탄 법원은 2020~2022년 라슈카르 지도자 자키우르 라흐만 라크비와 하피즈 사이드에게 테러 자금 조달 혐의로 유죄를 선고했다. 인도는 이 사건으로 파키스탄과의 포괄적 대화를 중단했고 해안 경비와 대테러 체제를 고쳤다. 2025년 4월에는 공범으로 지목된 타하우르 라나가 미국에서 인도로 인도되었다(「파할감 공격과 인도–파키스탄 무력 충돌(2025)」(뒤의 사건))."
  subjects: [india, pakistan, usa]
  links: []
  tags: [politics, society, diplomacy]
  sources: ["Angel Rabasa 외, The Lessons of Mumbai (RAND Corporation, 2009)", "Christine Fair, In Their Own Words: Understanding Lashkar-e-Tayyaba (Oxford University Press, 2018)"]

- id: bhutan-constitution-2008
  year: 2008
  title:
    ko: "부탄의 입헌 군주제와 국민 총행복(2008)"
  summary:
    ko: "부탄은 1907년 우겐 왕추크가 초대 왕이 된 뒤 왕추크 왕가가 이어 다스렸고, 1949년 인도와 맺은 조약으로 인도의 지도를 받아 외교를 한다는 약속을 했다. 1972년 즉위한 지그메 싱예 왕추크 4세는 '국민 총생산보다 국민 총행복'이라는 말로 알려졌고 국민 총행복을 국정 목표로 삼았다. 1998년 국왕은 내각에 행정 권한을 넘기고 2001년 헌법 초안 위원회를 세웠다. 2005년 초안이 공개되어 전국에서 토론했고, 2006년 12월 14일 국왕은 아들 지그메 케사르 남기엘 왕추크에게 자리를 물려주었다. 2007~2008년 상원 격인 국가 평의회 선거가 처음 치러졌고 2008년 3월 24일 첫 국민 의회 선거에서 부탄 평화 번영당(DPT)이 47석 가운데 45석을 얻었으며 지그메 틴레이가 4월 총리가 되었다. 헌법은 2008년 7월 서명되어 입헌 군주제와 복수 정당제, 의회 3분의 2 찬성과 국민 투표로 왕을 물러나게 할 수 있는 규정을 두었다. 11월 6일 케사르 왕의 즉위식이 열렸다. 2007년 인도와 개정된 우호 조약은 외교 정책에서 인도의 지도를 받는다는 조항을 없앴다. 이후 2013년 선거에서 인민 민주당이 이겨 정권이 바뀌었고, 2017년 인도·중국군이 부탄과 중국이 주장하는 도클람 고원에서 대치했다. 국민 총행복 조사는 심리적 안녕, 건강, 교육, 문화, 환경, 좋은 통치 등 아홉 영역을 따진다. 국민 총행복은 부탄이 환경 보존(국토의 60% 이상을 숲으로 유지한다는 헌법 조항)과 문화 보호를 내세우는 근거이나, 남부 네팔계 주민의 난민 문제 등으로 비판받기도 한다(「부탄 남부 주민의 추방과 난민(1990~2016)」(앞의 사건))."
  subjects: [bhutan, india, prc]
  links: []
  tags: [politics]
  sources: ["Royal Government of Bhutan, 「The Constitution of the Kingdom of Bhutan」 (2008)", "Michael Hutt, Unbecoming Citizens: Culture, Nationhood, and the Flight of Refugees from Bhutan (Oxford University Press, 2003)"]

- id: maldives-democratization-2008
  year: 2008
  title:
    ko: "몰디브의 민주화(2008)"
  summary:
    ko: "몰디브는 해발 2m 안팎의 산호 섬 1,000여 개로 이루어지고 인구가 40만 명 안팎인 나라다. 1965년 영국에서 독립하고 1968년 공화국이 되었으며, 1978년 마우문 압둘 가윰이 대통령이 되어 30년 동안 연이은 신임 투표로 집권했다. 1988년 11월에는 용병의 쿠데타 시도가 일어나 인도가 공수 부대를 보내 막았다. 2003년 교도소에서 한 수감자가 숨진 사건이 시위로 번졌고 야당 인사 무함마드 나시드가 해외에서 몰디브 민주당을 세웠다. 2004년 8월 13일 말레의 '검은 금요일' 시위에서 약 250명이 체포되었고 그해 12월 쓰나미가 섬들을 덮치면서 정부 책임을 따지는 목소리가 커졌다(「인도양 지진 해일(2004)」(앞의 사건)). 2005년 정당을 허용하는 법이 통과되었고, 2008년 8월 7일 가윰이 새 헌법을 비준해 삼권 분립과 기본권을 명시했다. 10월 8일과 28일 결선 투표로 치른 첫 복수 정당 대통령 선거에서 나시드가 가윰을 이겨 11월 11일 취임했다. 나시드는 해수면 상승에 위협받는 나라의 지도자로 기후 협상에 나섰고 2009년 10월 바닷속 각료 회의를 열었다. 2012년 2월 7일 경찰·군 일부 항명과 시위 속에서 사임했는데 나시드는 쿠데타라고 했고 영연방이 참관한 국내 조사 위원회는 2012년 8월 권력 이양이 합법이었다고 결론 냈다. 2013년 선거에서 압둘라 야민이 당선되었고 2015년 나시드는 테러법 위반으로 13년형을 받아 인권 단체의 비판을 받았다. 2018년 9월 이브라힘 무함마드 솔리 대통령이 당선되었고, 2023년 11월 취임한 무함마드 무이주는 인도군 철수를 요구하며 중국과 가까워졌다."
  subjects: [india, prc]
  links: []
  tags: [politics]
  sources: ["Royal Government of Maldives, 「Constitution of the Republic of Maldives (2008)」", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (4th ed., Routledge, 2017)"]

- id: hasina-ouster-2009
  year: 2009
  endYear: 2026
  title:
    ko: "하시나 정부와 2024년 퇴진(2009~2026)"
  summary:
    ko: "2006~2008년 군이 뒷받침한 과도 정부를 거친 뒤 2008년 12월 총선에서 아와미 연맹이 크게 이겨 셰이크 하시나가 2009년 1월 총리로 돌아왔다. 하시나는 셰이크 무지부르 라만의 딸이다. 정부는 1971년 독립 전쟁 때의 범죄를 다루는 국제 범죄 재판소를 2010년 세웠고 야당 자마아테 이슬라미 지도자들이 유죄 판결을 받았으며, 압둘 카데르 몰라는 2013년 12월 교수형을 당했다. 인권 단체는 재판 절차를 비판했다. 2011년 헌법 개정으로 선거 관리 과도 정부 제도가 없어졌고, BNP가 2014년과 2024년 1월 총선을 보이콧했으며 2018년 총선은 부정 의혹이 컸다. 정부는 경제 성장과 기반 시설 확충(파드마 대교 2022년 개통)을 내세웠고 2013년 4월 라나 플라자 의류 공장 붕괴로 1,100여 명이 숨지는 참사가 있었다. 2017년 미얀마에서 박해를 피해 온 로힝야 난민 70만 명 넘게 받아들였다. 야당 인사의 강제 실종과 초법적 처형에 관련해 2021년 미국이 정예 경찰 부대 RAB 등에 제재를 가했다. 2024년 6월 방글라데시 고등 법원이 독립 투사 자손 몫 공직 할당제를 되살리자 학생 시위가 일어났고 7월 중순 이후 경찰과 여당 학생 조직의 진압으로 사망자가 늘었다. 유엔 인권 사무소는 2025년 2월 보고서에서 7월 초~8월 중순 최대 1,400명이 숨졌고 대부분 보안군 발포로 숨졌다고 밝혔다. 8월 5일 하시나는 총리직을 사임하고 헬기로 인도로 떠났다. 8월 8일 노벨 평화상 수상자 무함마드 유누스가 임시 정부 최고 고문이 되었다. 2025년 11월 17일 국제 범죄 재판소는 하시나에게 궐석으로 사형을 선고했고 하시나는 판결을 부인했다. 아와미 연맹이 활동이 금지된 채 2026년 2월 12일 치른 총선에서 BNP 연합이 이겨 타리크 라만이 2월 17일 총리가 되었다."
  subjects: [bangladesh, india, usa]
  links: []
  tags: [politics, society]
  sources: ["Ali Riaz, Bangladesh: A Political History since Independence (I.B. Tauris, 2016)", "Ali Riaz, Voting in a Hybrid Regime: Explaining Political Participation in Bangladesh (Palgrave Macmillan, 2019)", "OHCHR, 「Human Rights Violations and Abuses related to the Protests of July and August 2024 in Bangladesh」 (유엔 인권 사무소, 2025년 2월 12일)"]

- id: modi-article-370-2014
  year: 2014
  endYear: 2024
  title:
    ko: "모디 집권과 370조 폐지(2014~2024)"
  summary:
    ko: "2014년 총선에서 인도 인민당이 단독으로 과반인 282석을 얻어 구자라트주 총리를 지낸 나렌드라 모디가 5월 총리가 되었다. 1984년 이후 한 정당이 하원 과반을 얻은 첫 선거였다. 정부는 2016년 11월 고액권 폐지, 2017년 7월 상품·서비스세(GST) 도입 등 경제 개혁을 폈다. 2016년 9월 우리(Uri) 군 기지 공격 뒤 인도군이 통제선 너머를 타격했다고 밝혔고, 2019년 2월 14일 풀와마에서 자살 폭탄으로 중앙 예비 경찰 40여 명이 숨지자 인도 공군이 26일 파키스탄 발라코트를 폭격했으며 이튿날 공중전이 벌어져 인도 조종사가 붙잡혔다가 풀려났다. 파키스탄은 폭격 피해를 부인했다. 5월 총선에서 인도 인민당은 303석으로 더 크게 이겼다. 2019년 8월 5일 정부는 대통령령으로 잠무 카슈미르 주에 특별 지위를 준 헌법 370조의 효력을 사실상 없앴고 6일 의회가 이를 승인했다. 잠무 카슈미르 재편법에 따라 10월 31일 잠무 카슈미르(입법부를 둠)와 라다크가 연방 직할지가 되었다. 정부는 개발과 통합, 분리주의 약화를 이유로 들었으나 반대하는 쪽은 주민 의사를 묻지 않았고 연방제를 해친다고 했다. 통신이 끊기고 지역 정치인을 포함한 수천 명이 구금되었으며 인터넷은 몇 달 뒤에야 단계적으로 복구되었다. 파키스탄은 이를 불법이라며 인도와 외교 관계를 낮추고 교역을 줄였고 중국도 라다크 편입에 반대했다. 12월에는 이웃 나라의 비무슬림 난민에게 시민권을 주는 시민권 개정법이 통과되어 전국에서 시위가 일었다. 2023년 12월 11일 대법원은 만장일치로 370조 폐지를 합헌이라 보았고 주 지위 회복을 되도록 빨리 하라고 했다. 2024년 총선에서 인도 인민당은 240석으로 과반을 잃었으나 연합으로 모디의 세 번째 집권이 이어졌고, 잠무 카슈미르 주 의회 선거(2024년 9~10월)에서 오마르 압둘라가 주 총리가 되었으나 2025년 기준 주 지위는 회복되지 않았다."
  subjects: [india, pakistan, prc]
  links: []
  tags: [politics]
  sources: ["Christophe Jaffrelot, Modi's India: Hindu Nationalism and the Rise of Ethnic Democracy (Princeton University Press, 2021)", "Sumantra Bose, Kashmir at the Crossroads: Inside a 21st-Century Conflict (Yale University Press, 2021)", "Supreme Court of India, 「In re: Article 370 of the Constitution」 (2023년 12월 11일)"]

- id: sri-lanka-crisis-2022
  year: 2022
  endYear: 2024
  title:
    ko: "스리랑카 경제 위기와 대통령 퇴진(2022~2024)"
  summary:
    ko: "스리랑카는 2019년 4월 부활절 연쇄 폭탄 공격으로 관광이 타격을 받았고 그해 집권한 고타바야 라자팍사 정부가 부가가치세와 법인세를 크게 낮추어 세수가 줄었다. 코로나19로 관광 수입이 더 떨어졌고 외화 보유고는 2022년 3월 약 19억 달러까지 줄었다. 2021년 4월 화학 비료 수입을 금지한 정책은 쌀 생산 감소를 낳아 같은 해 후반 철회되었다. 대외 부채는 500억 달러대에 이르렀고 중국·인도·일본, 국제 채권단 등에게 진 빚이 포함되었다. 정부는 2022년 4월 12일 대외 부채 상환 중단을 선언했는데, 독립 뒤 처음이었다. 연료와 가스, 의약품이 모자라 정전이 길어졌고 물가는 폭등해 콜롬보 소비자 물가 상승률이 9월 69.8%에 이르렀다. 3월 말부터 시위가 퍼졌고 4월 9일 콜롬보 갈페이스 광장에서 '아라갈라야(투쟁)' 농성이 시작되었다. 5월 9일 총리 마힌다 라자팍사 지지자들이 시위대를 공격한 뒤 마힌다는 사임했고, 라닐 위크라마싱하가 총리가 되었다. 7월 9일 시위대가 대통령 관저에 들어가자 고타바야는 몰디브를 거쳐 싱가포르로 떠나 14일 사임했다. 의회는 7월 20일 위크라마싱하를 대통령으로 뽑았고 그는 시위 참가자를 체포하기도 했다. 2022년 경제는 7%대로 줄었다. 정부는 IMF와 2022년 9월 약 29억 달러 규모 지원에 실무 합의하고 2023년 3월 이사회 승인을 받았다. 이를 위해 부가가치세와 소득세를 올렸고 채권단과 채무 재조정 협상을 이어 갔다. 중국의 대출을 두고 '부채의 함정' 논쟁이 있었으나 연구자들은 상업 차입이 더 큰 몫이었다고 본다(「시진핑 체제의 출범과 일대일로(2012~2023)」(앞의 사건)). 2024년 9월 21일 대통령 선거에서 마르크스주의 계열 국민 인민 권력의 아누라 쿠마라 디사나야케가 당선되었다."
  subjects: [sri-lanka, india, prc]
  links: []
  tags: [economy, politics, society]
  sources: ["International Monetary Fund, Sri Lanka: Request for an Extended Arrangement under the Extended Fund Facility (2023)", "Sri Lanka Central Bank, Annual Report 2022 (Central Bank of Sri Lanka, 2023)"]

- id: pahalgam-attack-2025
  year: 2025
  title:
    ko: "파할감 공격과 인도–파키스탄 무력 충돌(2025)"
  summary:
    ko: "2025년 4월 22일 인도가 통치하는 잠무 카슈미르의 파할감 부근 바이사란 초원에서 무장 괴한이 관광객을 공격해 26명이 숨졌다. 대부분 힌두 관광객이었다. 저항 전선(TRF)이라는 단체가 처음 자신들 소행이라 했다가 부인했고 인도는 파키스탄에 근거를 둔 라슈카르에타이바와 연결되었다고 보았다. 파키스탄은 연루를 부인하고 중립적 조사를 요구했다. 인도는 4월 23일 인더스강 조약의 이행을 중단한다고 밝히고 국경 통과소를 닫고 비자를 취소했다. 파키스탄은 영공을 인도 항공사에 닫고 교역을 중단했으며 물 흐름을 막으면 전쟁 행위로 보겠다고 했다. 5월 7일 인도는 '신두르 작전'으로 파키스탄 본토와 파키스탄 통치 카슈미르의 아홉 곳을 미사일로 타격했다고 밝혔고 파키스탄은 민간인 피해와 인도 전투기 격추를 주장했다. 양쪽은 통제선 일대에서 포격을 주고받았고 드론과 장거리 미사일, 전투기가 쓰였다. 5월 10일 인도가 파키스탄 공군 기지를 타격하자 파키스탄은 '분얀 마르수스 작전'으로 맞섰고, 같은 날 오후 5시(인도 표준시) 휴전이 발효되었다. 인도는 민간인 21명과 군·경 8명이 숨졌다고 했고 파키스탄은 민간인 40명과 군인 13명이 숨졌다고 밝혔으며, 격추된 전투기 수는 양쪽 발표가 다르다. 휴전은 도널드 트럼프 미국 대통령이 먼저 알렸으나 인도는 양국 군 사이 직접 협의의 결과라고 설명했고 파키스탄은 미국 등의 중재를 평가했다. 인도는 휴전 뒤에도 인더스강 조약 중단을 유지한다고 밝혔고, 2026년 8월 31일에는 상설 중재 재판소의 판정을 받아들이지 않는다며 입장을 바꾸지 않았다. 이는 2019년 발라코트 공습 이후 인도가 파키스탄 본토 깊숙이 타격한 사례이며(「모디 집권과 370조 폐지(2014~2024)」(앞의 사건)), 핵 보유국 사이의 교전에서 드론이 널리 쓰인 첫 사례로 거론된다. 파키스탄은 중국제 PL-15 공대공 미사일 등을 썼다고 알려졌다. 충돌의 배경에는 2008년 뭄바이 공격(「뭄바이 공격(2008)」(앞의 사건))과 2019년 인도의 370조 폐지 이래 되풀이된 양국 관계 악화가 있다."
  subjects: [india, pakistan, usa, prc]
