- id: nepal-gen-z-protests-2025
  year: 2025
  endYear: 2026
  title:
    ko: "네팔 청년 시위와 정권 붕괴(2025~2026)"
  summary:
    ko: "네팔은 2008년 왕정을 폐지한 뒤 네팔 의회당, 네팔 공산당(통합 마르크스–레닌주의), 마오주의 정당들이 총리 자리를 번갈아 맡았고 국민은 부패와 족벌주의에 불만이 컸다. 정치인 자녀의 호화 생활을 보여 주는 누리 소통망 게시물이 '네포 키즈'라는 이름으로 퍼졌다. 2025년 9월 4일 정부는 등록하지 않았다며 페이스북·유튜브·엑스 등 26개 누리 소통망의 접속을 막았다. 수도 카트만두를 중심으로 청년(Z세대) 시위가 번졌고 9월 8일 의회 청사 부근에서 경찰이 발포해 하루에 19명이 숨졌다. 분노한 군중이 의회 건물, 대통령 관저, 총리 관저, 정당 사무실과 호텔 등에 불을 질렀고 감옥에서 1만 3천 명 넘는 수감자가 탈출했다. 9월 9일 K. P. 샤르마 올리 총리가 사임했고 정부는 누리 소통망 금지를 풀었으며 군이 치안을 맡았다. 사망자는 76명, 부상자는 2,660명으로 정부가 확인했고 경찰 3명이 포함되었다. 청년들은 온라인 대화방에서 임시 총리 후보를 골랐고 9월 12일 전 대법원장 수실라 카르키가 첫 여성 총리로 취임했다. 대통령 람 찬드라 파우델은 의회를 해산하고 2026년 3월 5일 총선을 발표했다. 인권 단체들은 2026년 2월 책임자 불처벌 종식을 촉구했다. 총선에서 신생 정당 라슈트리야 스와탄트라당(RSP)이 하원 275석 가운데 182석을 얻어 압승했고 전 카트만두 시장 발렌드라(발렌) 샤가 3월 27일 총리가 되었다. 샤는 올리의 지역구에서 올리를 크게 이겼다. 올리 전 총리는 시위 진압 책임을 조사받다가 2026년 4월 대법원 명령으로 풀려났다(「네팔 내전과 왕정 폐지(1996~2008)」(앞의 사건))."
  subjects: [nepal]
