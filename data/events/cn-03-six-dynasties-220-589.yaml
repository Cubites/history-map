- id: northern-qi-550
  year: 550
  endYear: 577
  title:
    ko: "북제의 흥망: 고양의 즉위(550)에서 업의 함락(577)"
  summary:
    ko: "534년 고환이 효정제를 업으로 옮겨 세운 동위에서 고환이 547년 죽고 아들 고징이 이었으나 549년 암살되었다. 고징의 아우 고양이 실권을 잡아 550년 효정제의 선양을 받아 북제를 세웠다(문선제). 고양은 초기에는 거란과 유연(柔然)을 정벌하고 산시·산둥을 안정시켜, 북제는 북주보다 인구와 경제에서 앞섰다. 그러나 고양은 말년에 술에 빠져 포악해졌고 559년 죽었다. 뒤를 이은 폐제 고은(559~560), 효소제 고연(560~561)을 거치며 황실 내분과 정변 속에 정치가 어지러웠고, 561년 즉위한 무성제 고담과 565년 즉위한 후주 고위 아래에서 간신과 환관이 득세했다. 572년에는 명장 곡률광이 모함으로 처형되었다. 573년 남조 진(陳)의 선제가 북벌해 회남을 차지하자 북제는 남쪽 땅을 잃었다. 576년 겨울 북주 무제가 진양을 함락했고, 577년 정월 업이 함락되어 후주 고위가 어린 유주 고항에게 자리를 넘겼으나 둘 다 사로잡혔다. 북제는 27년 만에 끝났고 북주가 화북을 통일했다(뒤의 사건 「북주의 화북 통일과 수의 건국」). 북제 시기에도 불교 사원과 석굴이 크게 지어졌고, 이 나라에서 벼슬한 안지추는 뒷날 『안씨가훈』을 썼다. 564년 무렵 편찬한 하청률령은 12편으로 이루어져 수·당 율령의 바탕이 되었다. 북제와 북주는 서로 앞다투어 돌궐 가한에게 해마다 많은 비단을 보내 환심을 샀다. 북제는 6진 출신 선비 무장과 한인 관료 사이의 갈등이 깊었고, 무장 귀족이 군권을, 한인 관료가 문서 행정을 맡는 구조가 불안정을 키웠다. 업의 남성은 동위 때 새로 지어져 번성했다. 북제의 영역은 지금의 허베이·산둥·산시 대부분과 허난 북부로, 동위 이래의 업을 도읍으로 삼았다. 북제의 석굴로는 허베이의 향당산 석굴과 천룡산 석굴 등이 이름났다."
  subjects: [northern-qi, eastern-wei, northern-zhou, chen, khitan, rouran]
  tags: [politics, war]
  sources: ["『북제서』 문선제기·무성제기·후주기·곡률금전", "『주서』 무제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]
