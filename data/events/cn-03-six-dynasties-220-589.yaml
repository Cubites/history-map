# 중국 사건 3차 묶음(cn-03): 삼국·진·5호 16국·남북조 (220 ~ 589)
# 범위: 적벽 대전과 형주 쟁탈, 후한의 멸망과 삼국의 성립, 요동 공손씨의 멸망과 오·위의 동방 외교, 제갈량의 남중 평정과 북벌, 사마씨의 집권과 촉 멸망·서진 건국,
#   서진의 오 정복과 통일(280), 8왕의 난과 5호의 이주, 한(전조)·성한·후조·전량·대의 흥망, 불도징, 석호와 염민의 난, 동진의 성립 직후 정국, 환온의 성한 정벌과 북벌,
#   부견의 통치, 서연·후진·후량(後涼)·서진(西秦)의 독립, 구마라집과 법현, 허시 회랑의 남량·북량·서량, 남연·서촉·하의 흥망, 유유의 후진 정벌, 동진과 송의 문화,
#   북위의 화북 통일 전쟁, 송 문제의 원가 연간, 북위의 불교(폐불과 윈강 석굴), 풍태후의 개혁과 균전제, 효문제의 뤄양 천도, 남북조의 과학과 저술, 양 무제, 6진의 난, 후경의 난, 서위·북주의 부병제, 북제.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 220~589년 지도에서 생기거나 끝난 5호 16국 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 공손씨와 오·위의 외교 사건에 고구려 동천왕과 왜(야마타이국)를, 부견의 통치 사건에 소수림왕의 불교 수용(372)을, 양 무제와 북위 효문제 사건에 백제 무령왕·고구려 장수왕의 교류를 한두 문장씩 견주었다.
#   02번 파일의 영가의 난·전연·전진·비수 전투·북연·송·남조·북조의 분열·수의 통일 사건은 다시 쓰지 않고 「제목」으로 가리켰다.
# 날짜: 1912년 전 중국 사건의 날짜는 음력이며 '음력'으로 밝히거나 달까지만 적었다. 확실하지 않은 날짜는 '무렵'. 연호 원년이 즉위 이듬해인 유년칭원법은 해를 서기로 바꾸어 적었다.
# 이름 규칙: 1911년 전 인물은 한자음(조조·제갈량·석륵·부견), 지금 쓰지 않는 옛 지명은 한자음(장안·건업·업·평성·고장), 지금도 쓰는 이름은 중국어 표기(뤄양·청두·난징·다퉁·타이위안).
#   나라 이름은 항목 이름을 따랐다(서진=西晉, 서진(西秦), 후진(後秦), 후량(後涼), 후한=後漢). 석굴(윈강·룽먼)과 허시 회랑·창장강·화이허강은 00-scope 6절 원칙의 중국어 표기를 썼다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# places의 year: 전쟁 보기가 없는 싸움·포위만 달았다. 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: jingzhou-yiling-219
  year: 211
  endYear: 223
  title:
    ko: "유비의 익주 진출(211~214)과 한중·형주 쟁탈, 이릉 전투(222)"
  summary:
    ko: "적벽 대전 뒤의 일은 앞의 사건 「형주 쟁탈과 적벽 대전(208)」에 이어진다. 조인이 남군을 지키다가 209년 주유에게 밀려 물러났고, 유비는 형주 남부 네 군을 차지했다. 손권은 209년 누이를 유비에게 시집보내 동맹을 다졌고, 210년 주유가 죽은 뒤에는 노숙의 건의로 유비가 형주 일부를 맡아 다스리게 했다. 211년 유비는 익주목 유장의 요청을 받아 한중의 장로를 막는다며 익주로 들어갔다가 214년 유장을 몰아내고 청두를 얻었다. 이 원정에는 방통과 법정이 함께했고 방통은 214년 낙성을 공격하다 화살에 맞아 죽었으며, 청두가 포위되자 유장이 항복하고 서량의 마초도 유비에게 귀순했다. 215년 유비와 손권은 상수를 경계로 형주를 나누었다. 219년 유비는 한중의 정군산에서 조조의 장수 하후연을 죽이고 조조군을 물리쳤다. 조조는 이어 직접 한중으로 나섰으나 유비의 방어를 뚫지 못하고 철수했고, 유비는 그해 음력 7월 면양에서 한중왕에 올랐다. 같은 해 관우가 번성의 조인을 포위해 위의 우금 군을 물리치자, 손권의 장수 여몽이 형주를 급습하고 관우를 사로잡아 죽였다. 이로써 유비는 형주를 잃었다. 220년 조비가 헌제의 선양을 받아 위를 세웠고(뒤의 사건 「후한의 멸망과 삼국의 성립(220~229)」) 이듬해 유비는 촉의 황제가 되었다. 유비는 관우의 원수를 갚고 형주를 되찾으려고 오를 쳤으나, 222년 육손이 이릉에서 숲 속 수백 리에 걸쳐 길게 이어 놓은 촉군의 진영을 불태워 크게 이겼다. 유비는 백제성으로 물러나 223년 죽었고, 승상 제갈량이 등지를 오에 보내 화친을 되살렸다. 이렇게 조조의 북방, 유비의 쓰촨, 손권의 강동이 맞서는 틀이 굳어졌다."
  subjects: [eastern-han, cao-wei, shu, wu]
  tags: [war, politics]
  sources: ["『삼국지』 촉서 선주전·관우전, 위서 무제기, 오서 여몽전·육손전", "『후한서』 헌제기", "『자치통감』 한기·위기", "Rafe de Crespigny, Imperial Warlord: A Biography of Cao Cao 155–220 AD (2010)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: three-kingdoms-220
  year: 220
  endYear: 229
  title:
    ko: "후한의 멸망과 삼국의 성립(220~229)"
  summary:
    ko: "184년 황건적의 난 뒤 후한(後漢) 조정은 환관과 외척, 지방 군벌 사이에서 힘을 잃었다. 196년 조조가 헌제를 허(許)로 맞아들여 실권을 쥐고 208년 승상이 되었으며, 220년 정월 조조가 뤄양에서 죽자 아들 조비가 위왕을 이었다. 조비는 그해 음력 10월 헌제의 선양을 받아 황제가 되어 국호를 위(魏), 연호를 황초라 했다. 헌제는 산양공이 되어 234년까지 살았고 후한은 25년 광무제가 세운 지 195년 만에 끝났다. 조비는 진군의 건의로 구품관인법(구품중정제)을 시행해 중정관이 인물을 아홉 등급으로 매겨 관리를 추천하게 했는데, 뒤에 이 제도는 문벌 귀족이 관직을 독점하는 길이 되었다. 위는 조조 때부터 둔전을 열어 군량을 마련했다. 이듬해 221년 음력 4월 유비는 청두에서 한(漢)을 잇는다며 황제가 되었고(뒤에 촉 또는 촉한이라 부른다), 승상 제갈량이 나라를 이끌었다. 손권은 221년 조비에게서 오왕에 봉해졌다가 222년 독자 연호 황무를 쓰며 위와 갈라섰고, 229년 음력 4월 무창에서 황제가 되어 그해 가을 건업(훗날의 건강, 지금의 난징)으로 도읍을 옮겼다. 촉은 오의 황제 칭호를 인정하고 위에 함께 맞서는 맹약을 맺었다. 후한 157년의 호구는 약 1,068만 호, 5,649만 명으로 기록되었으나 280년 서진이 통일했을 때의 호구는 약 245만 호, 1,616만 명이었다. 전란과 이주로 줄기도 했지만 호적에서 빠진 사람도 많아 실제 인구 감소 폭은 알 수 없다. 조비는 226년 죽어 아들 조예가 이었다. 삼국의 정통을 두고는 뒷날 논쟁이 이어졌다. 서진의 진수가 쓴 『삼국지』는 위를 정통으로 삼았으나, 동진의 습착치는 『한진춘추』에서 촉한이 한을 잇는다고 보았고 남송의 주희가 이끈 『자치통감강목』도 촉한 정통론을 따랐다."
  subjects: [eastern-han, cao-wei, shu, wu]
  links:
    - { from: eastern-han, to: cao-wei, note: "헌제의 선양(220)" }
  tags: [politics]
  sources: ["『삼국지』 위서 문제기, 촉서 선주전, 오서 오주전", "『후한서』 헌제기·군국지", "『진서』 지리지", "『자치통감』 위기", "Rafe de Crespigny, Imperial Warlord: A Biography of Cao Cao 155–220 AD (2010)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: zhuge-liang-225
  year: 223
  endYear: 234
  title:
    ko: "제갈량의 남중 평정(225)과 북벌(227~234): 오장원의 죽음"
  summary:
    ko: "223년 유비가 백제성에서 죽자 어린 유선이 촉의 황제가 되고 승상 제갈량이 정치와 군사를 맡았다. 제갈량은 먼저 오와 화친을 되살렸다. 223년 유비가 죽은 직후 남중(윈난·구이저우 일대)에서 옹개가 반란을 일으키고 맹획이 가담했다. 225년 음력 3월 제갈량이 남쪽으로 내려가 그해 안에 평정하고, 그곳 지도자들을 관직에 임명해 현지를 다스리게 했다. 맹획을 일곱 번 사로잡았다가 일곱 번 놓아주었다는 이야기는 전승이다. 227년 「출사표」를 올리고 한중으로 나가 위를 치는 북벌을 시작했다. 위 명제 조예 때인 228년 첫 북벌에서 천수·남안·안정 세 군이 호응했으나 마속이 가정에서 위의 장합에게 크게 지면서 물러났고, 제갈량은 마속을 처형했다. 229년에는 무도·음평 두 군을 얻었고, 231년에는 기산으로 나가 사마의와 맞섰으나 보급이 끊겨 물러났다. 보급을 맡은 이엄은 책임을 지고 평민으로 쫓겨났다. 234년 마지막 북벌에서 제갈량은 위수 남쪽 오장원에 진을 치고 사마의와 수 개월 맞서다 음력 8월 진중에서 병으로 죽었다. 촉군은 질서 있게 물러났고, 사람들은 ‘죽은 제갈량이 산 사마의를 달아나게 했다’고 말했다. 한중에서 위를 노린 이 작전은 쓰촨 분지의 작은 나라가 치른 무리한 전쟁이었다는 평도 있으나, 제갈량은 법치와 공정한 상벌로 촉을 이끌어 뒷날까지 이상적인 재상으로 꼽힌다. 촉의 인구는 263년 멸망 때 28만 호, 94만 명으로 기록되었다(『삼국지』 촉서 후주전 주). 오는 229년 황제를 칭한 뒤에도 촉과 위 사이에서 움직였고, 234년에는 위의 합비 방면을 쳤다. 제갈량은 법정·유파·이엄 등과 법령 『촉과』를 정했고, 군량 수송을 위해 목우와 유마라는 수레를 만들었다고 전한다. 남중에서 얻은 금·은·소·말은 북벌의 군수에 쓰였다고 한다."
  subjects: [shu, cao-wei, wu]
  tags: [war, politics]
  sources: ["『삼국지』 촉서 제갈량전·후주전, 위서 명제기, 오서 오주전", "『진서』 선제기", "『자치통감』 위기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: gongsun-liaodong-238
  year: 233
  endYear: 239
  title:
    ko: "공손씨 요동의 멸망(238)과 오·위의 동방 외교: 고구려 동천왕, 야마타이국의 사신(238~239)"
  summary:
    ko: "후한 말 요동 태수 공손도가 요동을 차지한 뒤 아들 공손강, 강의 아우 공손공을 거쳐 228년 강의 아들 공손연이 숙부를 밀어내고 이어 3대가 요동을 다스렸다. 207년 조조가 오환을 칠 때(앞의 사건 「조조의 오환 정벌과 선비, 요동의 공손씨」) 공손강은 도망쳐 온 원상·원희 형제를 죽여 조조에게 바쳤다. 공손씨는 이후 위와 오 사이에서 줄타기를 했다. 233년 손권이 장미와 허안을 요동에 보내 공손연을 연왕에 봉하려 하자, 공손연은 오의 사신을 죽이고 그 머리를 위로 보냈다(233년 말 또는 이듬해 초로 사료가 갈린다). 236년 오가 보낸 사신 호위(胡衛)를 동천왕이 죽이고 그 머리를 위의 유주에 보냈다(『삼국사기』). 오는 이보다 앞선 230년 장군 위온과 제갈직을 바닷길로 이주·단주에 보내 사람들을 데려오려 했으나, 이주에서 수천 명을 데려왔을 뿐 성과가 없어 두 장수가 옥에 갇혔다고 한다. 237년 위의 관구검이 먼저 쳤으나 이기지 못했고, 공손연이 연왕을 칭하고 독자 연호를 쓰자 이듬해 위 명제가 사마의에게 4만 군사를 주어 보냈고, 고구려 동천왕도 군사 1천 명을 보내 도왔다. 238년 가을 사마의가 양평(지금의 랴오양)을 함락해 공손연 부자를 죽이고, 『진서』에 따르면 15세 이상 남자 7천여 명을 죽여 시신으로 경관(京觀)을 쌓았다. 이 무렵 위는 유흔과 선우사를 바다 건너 보내 낙랑군·대방군 두 군을 평정하게 했다(『삼국지』 위서 한전). 이로써 위가 요동은 물론 낙랑군과 대방군까지 직접 거느리게 되었다. 이 무렵 일본열도의 야마타이국 여왕 히미코(卑彌呼)가 대방군을 거쳐 위에 사신을 보냈고, 위 명제는 ‘친위왜왕’의 금인과 구리거울을 내렸다(238~239년, 『삼국지』 위서 왜인전). 위가 요동을 차지하자 고구려는 위와 국경이 맞닿게 되었고, 244년 관구검의 침입(뒤의 사건 「위 관구검의 고구려 침입」)으로 이어졌다."
  subjects: [cao-wei, wu, goguryeo, wa, nangnang]
  tags: [politics, war, diplomacy]
  sources: ["『삼국지』 위서 명제기·공손도전·왜인전, 오서 오주전", "『진서』 선제기", "『삼국사기』 고구려본기 동천왕 10년·12년", "『자치통감』 위기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: sima-seizure-249
  year: 249
  endYear: 265
  title:
    ko: "사마씨의 집권과 촉의 멸망: 고평릉의 변(249), 촉 정벌(263), 서진의 건국(265)"
  summary:
    ko: "239년 위 명제가 죽고 어린 조방이 이었다. 종실 조상과 사마의가 보정했으나 조상이 실권을 쥐고 사마의를 밀어냈다. 249년 정월 조방이 조상과 함께 고평릉에 참배하러 나간 틈에 사마의가 뤄양을 장악했고, 조상 일족은 모반으로 몰려 삼족이 처형되었다(고평릉의 변). 사마의가 251년 죽자 아들 사마사가, 255년 사마사가 죽자 아우 사마소가 대장군으로 위의 군권을 쥐었다. 254년 사마사는 황제 조방을 폐위하고 조모를 세웠다. 255년 관구검·문흠, 257~258년 제갈탄이 사마씨에 맞서 일으킨 반란은 모두 진압되었으며, 제갈탄은 오에 도움을 청했으나 소용이 없었다. 260년 조모가 사마소를 치려다 도리어 살해되었고 조환이 세워졌다. 사마소는 촉을 칠 때가 되었다고 보아 263년 종회·등애·제갈서의 세 군대를 보냈다. 등애는 음평에서 험한 산길을 넘어 강유의 부대를 앞질러 청두로 내려왔고 촉의 황제 유선이 항복해 촉은 망했다. 유선은 뤄양으로 옮겨 안락공이 되었다. 종회는 강유와 함께 반란을 꾀하다 264년 군사들에게 죽었고, 등애도 모함으로 죽었다. 사마소는 264년 진왕이 되어 265년 음력 8월 죽었다. 아들 사마염이 진왕을 이어 그해 음력 12월(양력으로는 266년 2월) 조환의 선양을 받아 진(서진)을 세웠다. 이로써 조조가 열어 조비가 세운 위는 45년 만에 끝났다. 위는 조씨 종실의 힘을 억눌러 왔기에 종실 제후왕들이 사마씨의 찬탈을 막지 못했다는 평이 있다. 사마씨는 하내 온현의 명문으로 조조 이래 위 정권의 구품중정제와 둔전제를 바탕으로 문벌 사대부의 지지를 얻었다. 사마염은 건국 직후 종실을 대거 왕에 봉해 각지에 두었다."
  subjects: [cao-wei, shu, western-jin, wu]
  links:
    - { from: cao-wei, to: shu, note: "촉 정복, 유선의 항복(263)" }
    - { from: cao-wei, to: western-jin, note: "조환의 선양(265)" }
  tags: [politics, war]
  sources: ["『삼국지』 위서 삼소제기·종회전·등애전, 촉서 후주전", "『진서』 선제기·경제기·문제기·무제기", "『자치통감』 위기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: jin-unification-280
  year: 279
  endYear: 280
  title:
    ko: "서진의 오 정복과 통일(280): 점전·과전제와 지방 군대의 해산"
  summary:
    ko: "265년 서진을 세운 무제 사마염은 오를 칠 기회를 엿보았다. 오에서는 264년 즉위한 마지막 황제 손호가 폭정을 펴 민심이 흩어져 있었다. 형주 방어를 맡은 양호가 계획을 세웠으나 278년 죽었고, 그가 추천한 두예가 출병을 주장했다. 279년 음력 11월 서진은 여러 갈래로 군사를 내보냈고 『진서』는 그 수를 20만 남짓으로 적는다. 두예는 형주의 강릉을 향해 나아갔고, 왕준(王濬)은 익주에서 큰 배로 창장강을 따라 내려오며 오가 강에 걸어 둔 쇠사슬을 횃불로 녹여 끊었다. 280년 음력 3월 손호가 왕준에게 항복했고, 오가 바친 문서에 따르면 4주 43군 313현, 52만 3천 호, 230만 명이 서진에 편입되었다. 184년 황건적의 난 이래 약 100년, 220년 후한이 무너진 지 60년 만에 중국이 다시 하나가 되었다. 서진은 통일 직후 점전·과전제를 정했다. 남자 한 사람이 70무, 여자는 30무까지 땅을 차지할 수 있게 하고 정남에게는 50무, 정녀에게는 20무의 땅에 세금을 매겼으며, 관품에 따라 1품 50경에서 9품 10경까지 점유 한도를 두어 관료의 특권을 인정했다. 호조식으로는 정남이 있는 집이 해마다 비단 3필과 솜 3근을 냈다. 태강 연간(280~289)에 주군의 병력을 줄이게 해 지방의 방비가 약해졌고, 이것이 곧 닥칠 8왕의 난과 이민족의 봉기에 대응하지 못한 원인의 하나로 꼽힌다. 280년 호구는 약 245만 호, 1,616만 명으로 기록되었다. 통일 뒤 귀족 사이에는 사치가 퍼져 석숭과 왕개가 부를 겨루었다는 이야기가 전한다. 무제는 또 종실을 대거 왕에 봉해 지방의 군사를 맡겼는데, 이 체제는 뒷날 8왕의 난의 바탕이 되었다(뒤의 사건 「서진의 8왕의 난(291~306)과 5호의 이주」)."
  subjects: [western-jin, wu]
  links:
    - { from: western-jin, to: wu, note: "오 정복, 손호의 항복(280)" }
  tags: [war, politics, society]
  sources: ["『진서』 무제기·두예전·왕준전·식화지·지리지", "『삼국지』 오서 삼사주전 주", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: eight-princes-291
  year: 291
  endYear: 306
  title:
    ko: "서진의 8왕의 난(291~306)과 5호의 이주"
  summary:
    ko: "290년 서진 무제가 죽고 지능이 모자란 혜제가 이었다. 291년 황후 가남풍이 초왕 사마위를 움직여 외척 양준 일가를 제거했고, 이어 섭정이 된 여남왕 사마량과 위관도 사마위의 손으로 죽이게 한 뒤 사마위마저 죽였다. 이후 300년까지 가황후가 장화·배위 같은 대신들과 정치를 맡아 한동안 안정되었다. 299년 강통은 「사융론」에서 관중 인구 100만여 명 가운데 절반이 융적이라며 이들을 고향으로 돌려보내자고 했으나 받아들여지지 않았다. 300년 조왕 사마륜이 정변을 일으켜 가남풍을 죽이고 301년 정월 황제를 칭하자, 제왕 사마경·성도왕 사마영·하간왕 사마옹이 일어나 사마륜을 죽이고 혜제를 복위시켰다. 이후 사마경과 장사왕 사마예, 사마영, 사마옹, 동해왕 사마월이 차례로 권력을 다투어 서로를 죽였고 마지막에는 사마월만 남았다. 304년 사마영의 군대가 사마월을 탕음에서 크게 이기고 혜제를 사로잡았으나, 유주의 왕준(王浚)이 선비 단씨·오환 기병을 끌고 와 업을 약탈해 사마영을 몰아냈다. 이 전쟁은 모두 사마씨 종실인 여덟 왕의 이름을 따 8왕의 난이라 하며 『진서』 권59에 이들의 전기가 한데 실려 있다. 306년 음력 11월 혜제가 죽고(독살설이 있다) 회제 사마치가 즉위했으며 사마월이 권력을 잡아 난이 끝났다. 왕들이 선비·오환·흉노의 기병을 끌어들이면서 이민족 군대가 화북 정치의 전면에 나섰다. 흉노 유연(劉淵)은 사마영 곁에서 5부 흉노를 이끌다 304년 북쪽으로 돌아가 한왕을 칭했고(뒤의 사건 「유연의 한(漢)과 전조의 흥기(304~318)」), 파저 출신 유민 이웅은 같은 해 청두에서 성도왕을 칭했다(뒤의 사건 「성한의 흥망(304~347)」). 서진의 통치는 이 전쟁으로 무너져 311년의 뤄양 함락(뒤의 사건 「영가의 난과 서진의 멸망, 동진의 성립」)으로 이어졌다."
  subjects: [western-jin, han-zhao, cheng-han, xianbei]
  tags: [politics, war]
  sources: ["『진서』 혜제기·종실전(권59 팔왕전)·강통전·유원해재기·이특재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: former-liang-301
  year: 301
  endYear: 376
  title:
    ko: "장궤와 전량: 허시 회랑의 한인 정권(301~376)"
  summary:
    ko: "서진이 흔들리던 301년 안정의 한인 명문 장궤가 양주 자사로 부임해 고장(지금의 우웨이)을 근거로 허시 회랑을 다스렸다. 장궤는 끝까지 서진의 신하로 남았고 314년 죽은 뒤 아들 장식이 이었다. 장식은 316년 서진이 망한 뒤에도 민제의 연호 건흥을 계속 썼고 동진이 선 뒤에도 그대로 두었다. 320년 장식이 살해되고 아우 장무가 이어 323년 전조에 칭신했다. 324년 장식의 아들 장준이 이어 허시의 전성기를 열고 서역으로 세력을 뻗쳤으며, 345년 가량왕(假涼王)을 칭하면서도 동진을 종주로 받들었다. 346년 장중화가 이은 뒤 후조의 공격을 받았고, 353년 장중화가 죽은 뒤 어린 장요령을 폐한 장조가 354년 진(晉)의 종주권을 부정했으나 355년 장관이 그를 몰아내고 장현정을 세웠다. 356년 내분과 반란으로 황허강 남쪽 땅을 잃고 전진에 칭신했으며, 361년 장현정이 동진의 종주권을 다시 받아들였다. 363년 장천석이 조카 장현정을 몰아내고 서면서 동진의 연호를 썼다. 중원의 전란을 피해 온 학자들이 허시에 모여 학문이 이어졌고, 366년 승려 낙준이 둔황에서 막고굴을 파기 시작했다는 전승이 있다. 376년 전진의 부견이 군대를 보내자 장천석이 항복해 전량은 망했다(앞의 사건 「저족 부건의 전진과 부견의 화북 통일」). 장씨 정권은 한인 총독이 서진의 이름 아래 반세기 넘게 이어 간 독특한 나라였다. 장준은 서역 장사를 두어 쿠차·선선·우전 등의 조공을 받았다고 『진서』는 적는다. 전량이 서진의 연호를 쓰고 동진을 종주로 받든 것은 중원과 길이 끊긴 허시에서 중원 왕조의 정통을 잇는다는 명분을 지키려는 선택이었다."
  subjects: [former-liang, western-jin, eastern-jin, han-zhao, later-zhao, former-qin]
  links:
    - { from: former-qin, to: former-liang, note: "전량 정복, 장천석의 항복(376)" }
  tags: [politics, society, culture]
  sources: ["『진서』 장궤전·장준전·장천석전", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: han-zhao-304
  year: 304
  endYear: 318
  title:
    ko: "유연의 한(漢)과 전조의 흥기(304~318)"
  summary:
    ko: "유연(劉淵)은 남흉노 선우의 후손으로 뤄양에서 인질로 자라 한문화에 밝았고, 산시 중부(병주)의 5부 흉노의 우두머리로 서진에 벼슬했다. 한 황실의 외손이라며 유씨 성을 쓰고 한(漢)의 정통을 잇는다고 내세웠는데, 묵돌 선우의 후손이라는 주장은 오늘날 학자들이 의심한다. 304년 8왕의 난 속에서 사마영 곁에 있던 유연은 북쪽으로 돌아가 좌국성에서 대선우가 되고 한왕을 칭했다. 308년 황제를 칭하고 이듬해 평양(지금의 린펀)으로 도읍을 옮겼다. 310년 유연이 죽자 맏아들 유화가 이었으나 이복동생 유총이 곧 그를 죽이고 황제가 되었다. 311년 음력 3월 서진의 실권자 사마월이 죽자 그 영구를 호위하던 군사와 관료를 석륵이 영평에서 거의 몰살했고, 이어 한의 군대가 뤄양을 함락해 회제를 사로잡았으며, 316년 음력 11월 장안이 떨어져 민제가 항복하면서 서진이 무너졌다(앞의 사건 「영가의 난과 서진의 멸망, 동진의 성립」). 유총은 회제를 평양에 두고 회계공으로 봉했다가 313년 정월 죽였고, 민제도 평양으로 끌려가 318년 처형되었다. 한은 중국식 관직과 흉노식 제도를 함께 썼다. 한인은 사예와 내사를 두어 군현식으로, 여러 부족(육이)은 선우를 보좌하는 좌우보가 부락 단위로 따로 다스렸다(『진서』 유총재기). 같은 시기 유곤을 돕던 선비 탁발의로가 310년 서진에게서 대공에 봉해졌다(뒤의 사건 「탁발부의 대(代)(310~376)」). 318년 유총이 죽자 유찬이 이었으나 외척 근준의 정변으로 죽었고, 근준에게 맞선 장안의 유요가 황제로 추대되었다. 유요는 319년 국호를 조(趙)로 고쳤으며 이 나라를 전조라 부른다. 같은 해 석륵이 따로 서면서 나라는 동서로 갈라졌다(뒤의 사건 「석륵의 후조 성립(319)과 전조의 멸망(329)」)."
  subjects: [han-zhao, western-jin, tuoba-dai]
  links:
    - { from: han-zhao, to: western-jin, note: "뤄양 함락(311)과 장안 함락(316)" }
  tags: [politics, war]
  sources: ["『진서』 유원해재기·유총재기·유요재기·회제기·민제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: cheng-han-304
  year: 304
  endYear: 347
  title:
    ko: "성한의 흥망(304~347)"
  summary:
    ko: "서진 말 관중에 기근이 들자 파저 출신 이특 형제가 유민 수만 명을 이끌고 한중을 거쳐 촉(쓰촨)으로 들어갔다. 조정이 유민을 돌려보내려 하자 301년 이특이 아우 이류 등과 거병했으나 303년 청두 가까이에서 죽었다. 이류가 이어 죽은 뒤 이특의 아들 이웅이 304년 청두를 차지하고 성도왕을 칭했으며, 306년 황제가 되어 국호를 대성이라 했다. 『진서』는 이웅이 장정에게 해마다 곡식 3곡만 내게 하고 학교를 세우는 등 부담을 줄였다고 평하며 쓰촨은 비교적 평온했다. 307년 한중 남정의 주민을 옮겨 왔고 314년 한중의 반란 세력이 항복해 왔다. 이후 파군을 얻고 320년 월수(량산), 330년 파동에 이르렀으며, 333년에는 장수 이수가 닝주를 공략해 닝주 자사 윤봉의 항복을 받고 윈난·구이저우 서부까지 영역을 넓혀 동진과 맞닿았다. 334년 이웅이 죽자 조카 이반이 즉위했으나 이웅의 아들 이기에게 죽었고, 338년 이웅의 사촌 동생 이수가 이기를 몰아내고 국호를 한(漢)으로 바꾸었다. 이수는 법을 엄하게 하고 세금과 부역을 늘려 궁을 화려하게 지어 원성을 샀다. 343년 아들 이세가 이었고, 이 무렵 산에서 내려온 요족이 쓰촨 북부에 가득해졌다고 한다. 정치가 어지러운 틈을 타 346년 동진의 환온이 출병했고 이듬해 청두에 이르자 이세가 항복해 성한은 망했다(뒤의 사건 「환온의 성한 정벌(347)과 북벌(354~369)」). 쓰촨은 이후 동진의 땅이 되었으나 373년 전진이 차지했고(앞의 사건 「저족 부건의 전진과 부견의 화북 통일」), 405년 서촉이 다시 섰다. 청성산의 천사도 지도자 범장생이 식량을 대 이웅을 지지했고 이웅은 그를 승상으로 높였다. 성한에는 파저 같은 산지 부족과 농서에서 내려온 유민, 촉의 토착 한인이 섞여 있었는데, 이웅은 각 집단의 우두머리에게 관직을 주어 다스렸다."
  subjects: [cheng-han, western-jin, eastern-jin]
  tags: [politics, war, society]
  sources: ["『진서』 이특재기·이웅재기·이수재기·이세재기", "『화양국지』 대동지·이특이웅이수지", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: fotudeng-310
  year: 310
  endYear: 348
  title:
    ko: "불도징과 화북의 불교(310~348)"
  summary:
    ko: "불도징은 서역 출신 승려로 310년 서진의 뤄양에 이르렀다. 이듬해 뤄양이 한(전조)에 함락되는 혼란 속에서 그는 뤄양을 떠났고, 곧 석륵의 장수 곽흑략의 소개로 석륵을 만났다. 불도징은 예언과 신통력으로 석륵의 신임을 얻어 후조가 선 뒤에도 군주의 고문 노릇을 했고, 석호가 335년 업으로 도읍을 옮긴 뒤에는 ‘대화상’으로 받들어졌다. 그의 가르침은 살생과 가혹한 형벌을 삼가라는 것이었다고 전한다. 후조에서 불교는 빠르게 퍼져 사원이 800곳이 넘었다고 한다. 전통적으로 한인은 출가하지 못하고 서역인만 절을 세울 수 있었는데, 석호 때 중서저작랑 왕도가 이 옛 예법을 지켜 한인의 예불을 금하자고 건의했다. 석호는 자신이 변방의 이민족 출신이니 이민족이 믿는 부처를 섬기는 것이 마땅하다고 하며 불교를 믿는 이를 허락했다(『진서』 석계룡재기). 이렇게 이민족 왕조가 한인 왕조와 다른 정통을 불교에서 찾으면서 화북 불교가 자랐다. 348년 불도징이 죽었다(향년 117세라는 전승은 믿기 어렵다). 제자 도안은 뒷날 경전의 목록을 만들고 승려가 모두 석씨 성을 쓰는 관례를 세웠다. 불도징의 불교는 후조를 거쳐 전진의 부견이 도안을 장안으로 맞아들이는 데까지 이어졌고, 뒤에 후진(後秦)의 구마라집이 활약하는 바탕이 되었다. 불도징은 병을 고치고 가뭄에 비를 빈 일로 이름이 높았고 문하에 모인 제자가 1만 명에 가까웠다고 『고승전』은 적는다. 전란과 학살에 지친 이들에게 불교는 위안이 되었고, 이민족 군주에게는 한인 왕조의 유교적 정통과 다른 정당성을 줄 종교가 되었다. 도안은 불도징이 죽은 뒤 전란을 피해 남쪽으로 내려가 365년 무렵부터 샹양에서 가르쳤고, 379년 샹양이 전진에 함락되자 부견이 그를 장안으로 데려갔다."
  subjects: [later-zhao, han-zhao, western-jin]
  tags: [religion, culture]
  sources: ["『고승전』 불도징전", "『진서』 예술전 불도징전·석계룡재기", "Erik Zürcher, The Buddhist Conquest of China (1959)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: tuoba-dai-310
  year: 310
  endYear: 376
  title:
    ko: "탁발부의 대(代)(310~376)"
  summary:
    ko: "탁발부는 선비의 한 갈래로 3세기 후반 탁발역미가 성락 일대에서 부족을 아우르며 힘을 키웠다. 310년 서진의 병주 자사 유곤이 한(전조)에 맞서려 탁발의로의 도움을 받았고, 서진은 의로를 대공에 봉했고 유곤이 대군 일대의 땅을 내주었다. 의로와 유곤은 의형제를 맺었고 312년 대의 군대는 진양을 되찾아 주었다. 313년 의로는 성락을 북도, 평성(지금의 다퉁)을 남도로 삼았고 315년 대왕이 되었다. 316년 의로가 아들 육수와 싸우다 죽은 뒤 조카 보근을 비롯해 군주가 자주 바뀌었고 321년 탁발의이의 미망인 기(祁)씨가 울률(평문제)을 죽이고 자기 아들 하루를 세워 후조에 칭신하기도 했다. 하루에 이어 하나와 예괴가 자리를 다투었다. 338년 후조에 볼모로 가 있던 십익건이 돌아와 대왕에 올랐다. 십익건은 340년 성락으로 도읍을 되돌리고 관직과 법률을 정비했으며 군사가 10만에 이르렀다고 한다. 한인 연봉 같은 지식인을 기용해 문서와 법률을 정비하기도 했다. 전연의 모용씨와는 혼인 동맹을 맺었으나 충돌도 있었고, 352년 전연이 후조의 옛 땅을 차지하며 세력을 넓히자 대의 동쪽 변경은 전연과 맞닿게 되었다. 376년 철불 흉노의 유위진이 전진의 부견에게 대를 치자고 부추기자 전진군이 쳐들어왔고, 십익건은 달아나던 중 혼란 속에서 일족의 손에 죽었다(전진은 이 해 전량도 멸했다). 대는 66년 만에 끝났으나 십익건의 손자 탁발규가 하란부의 도움으로 386년 정월 우천에서 대왕에 올라 대를 다시 세웠고 4월에 국호를 위(북위)로 고쳤다(앞의 사건 「비수 전투와 전진의 붕괴, 후연·북위의 성립」). 탁발부는 이처럼 부족 연합에서 출발해 중국식 제도를 받아들이며 북위로 이어졌다. 탁발규는 398년 평성을 도읍으로 삼아 북위 전반기의 수도로 만들었다. 북위가 대의 후계를 자임한 까닭에 『위서』는 첫 권 「서기」에 탁발씨 조상부터 대의 역사를 적었으나, 그 앞부분은 전승이 많다."
  subjects: [tuoba-dai, western-jin, han-zhao, later-zhao, former-yan, former-qin, xianbei]
  links:
    - { from: former-qin, to: tuoba-dai, note: "대 정복, 십익건의 죽음(376)" }
  tags: [politics, war]
  sources: ["『위서』 서기·황후전", "『진서』 유곤전·부견재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: eastern-jin-gentry-317
  year: 317
  endYear: 329
  title:
    ko: "동진의 초기 정국: 왕과 마의 공존, 왕돈의 난(322)·소준의 난(327), 조적의 북벌"
  summary:
    ko: "317년 낭야왕 사마예가 건강에서 진왕에 올랐고 318년 서진 민제의 죽음이 알려지자 황제(원제)가 되어 동진이 시작되었다(앞의 사건 「영가의 난과 서진의 멸망, 동진의 성립」). 새 정권은 북방에서 내려온 귀족과 강남 토착 호족의 지지가 모두 필요했다. 낭야 왕씨 왕도는 재상으로 오 지방 호족을 끌어들였고, 사촌 왕돈은 창장강 중류의 군사를 쥐었다. ‘왕과 마가 천하를 함께한다’는 말이 돌 만큼 문벌의 힘이 컸다. 북방 유민을 위해서는 본래 살던 지명을 붙인 교군·교현을 두어 고향 호적을 이어 가게 했다. 원제가 유외·조협을 중용해 왕씨를 견제하자 322년 형주의 왕돈이 건강으로 쳐들어와 조협 등을 죽였고(유외는 북쪽으로 달아났다) 얼마 뒤 원제가 죽고 아들 명제가 이었다. 324년 왕돈이 다시 군사를 일으켰으나 병으로 죽으면서 난이 끝났다. 327년에는 소준과 조약이 반란을 일으켜 이듬해 건강을 점령하고 어린 성제를 붙잡았으나 도간과 온교가 328년 소준을 쳐 죽였다. 조약은 북방 정벌로 이름난 조적의 동생이다. 조적은 313년 강북으로 올라가 허난 남부를 되찾는 데 힘썼으나 321년 죽었고, 동진은 조정의 견제 속에 북방을 포기해 석륵의 후조가 화이허강 북쪽으로 내려왔다. 이후 동진은 문벌 귀족과 강남의 토착 세력이 균형을 이루는 강남 정권으로 자리 잡았다. 당시 화북에서는 전조의 유요와 후조의 석륵이 맞서고 있었다. 오 지방 호족으로는 고·육·주·장의 네 성이 이름났고, 왕도는 이들의 협조를 얻어 정권의 뿌리를 내렸다. 북쪽에서 내려온 유민은 백적이라는 별도 호적에 올려 조세와 부역을 가볍게 했고, 이들의 이주는 강남 개발을 앞당겼다."
  subjects: [eastern-jin, later-zhao, han-zhao]
  tags: [politics, society]
  sources: ["『진서』 원제기·명제기·성제기·왕도전·왕돈전·조적전·소준전", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: later-zhao-319
  year: 319
  endYear: 330
  title:
    ko: "석륵의 후조 성립(319)과 전조의 멸망(329)"
  summary:
    ko: "석륵은 상당 무향의 갈족 출신으로 젊어서 노예로 팔렸다가 목장 우두머리 급상의 무리에 들어 반란에 가담했고, 뒤에 유연(劉淵)에게 귀부해 유총 밑에서 허베이·산둥을 평정한 장수가 되었다. 한인 참모 장빈의 조언으로 한인 지식인을 모아 군자영을 두고 법령과 학교를 정비했다. 319년 유요가 국호를 조로 고치며 석륵의 사신을 죽이자 석륵은 양국(지금의 싱타이)에서 대장군·대선우·조왕을 칭하며 따로 섰다(앞의 사건 「유연의 한(漢)과 전조의 흥기(304~318)」). 이로써 서쪽 관중의 유요와 동쪽 화북의 석륵이 같은 국호 조를 쓰며 맞섰고, 두 나라를 전조(유요)와 후조(석륵)라 구분해 부른다. 후조는 323년 산둥의 조억을 멸하고, 321년 조적이 죽은 뒤 동진이 지키지 못한 허난·화이베이로 땅을 넓혔다. 유요는 같은 해 룽유의 진안을 격파했다. 328년 석륵의 조카 석호가 전조를 치자 유요는 뤄양을 포위했다가 석륵이 직접 이끈 군대에 크게 졌고, 『진서』에 따르면 술에 취해 말에서 떨어져 사로잡혔고 곧 처형되었다. 329년 태자 유희가 상규(지금의 톈수이)로 달아났다가 석호에게 죽으면서 전조가 끝났다. 석륵은 330년 천왕을 거쳐 황제를 칭했다. 글을 읽지 못한 석륵은 사람을 시켜 『한서』를 읽게 하고 듣기를 즐겼고, 호인(胡人)을 ‘호’라 부르는 것을 금하고 ‘국인’이라 부르게 했다. 후조는 갈족 같은 호인과 한인을 따로 다스리는 체제를 이었다. 석륵은 양국 둘레에 태학과 소학을 세우고 한인 학자를 우대했으며, 군사는 호인 중심의 국인 군단이 맡고 행정은 한인 관료가 맡는 이중 체제로 나라를 꾸렸다. 330년 무렵 후조는 허베이·산시·산둥·허난·관중에 이르는 화북 대부분을 아울렀다."
  subjects: [later-zhao, han-zhao, eastern-jin]
  links:
    - { from: later-zhao, to: han-zhao, note: "전조 멸망, 유희의 죽음(329)" }
  tags: [politics, war]
  sources: ["『진서』 석륵재기·유요재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: later-zhao-shi-hu-333
  year: 333
  endYear: 352
  title:
    ko: "석호의 후조와 염민의 난(333~352)"
  summary:
    ko: "333년 석륵이 죽고 아들 석홍이 이었으나 석륵의 조카 석호가 실권을 쥐고 334년 석홍을 폐위해 죽였다. 335년 석호는 도읍을 양국에서 업으로 옮겼다. 업에서는 궁전과 후원을 짓느라 백성을 대규모로 징발했고 부역과 군역의 부담이 무거웠다. 석호는 337년 대조천왕을 칭했고 349년 정월 황제를 칭했다. 불도징을 높이 받들어 불교를 장려했다(앞의 사건 「불도징과 화북의 불교(310~348)」). 전연·전량·동진을 거듭 정벌했으나 큰 성과는 없었다. 349년 4월 석호가 죽자 아들들이 후계를 두고 싸웠다. 어린 석세가 이었으나 곧 석준에게 밀려났고, 석준은 석호의 양손자 염민(본래 석민, 한인 출신)이 가담한 정변으로 쫓겨나 석감이 세워졌다. 350년 염민은 석감을 죽이고 업을 차지해 국호를 위(魏)라 했다. 염민이 한인에게 갈족 같은 호인을 죽이라는 명령을 내려 업 일대에서만 약 20만 명이 죽었다고 추산한다(과장되었을 수 있다). 한편 양국에서 석지가 황제를 칭하고 염민에 맞섰고, 전연의 모용씨와 관중의 부건도 이 틈에 힘을 키웠다(앞의 사건 「모용황의 연왕 칭호와 전연의 화북 진출」, 「저족 부건의 전진과 부견의 화북 통일」). 351년 석지가 부하 유현에게 죽으면서 후조가 완전히 끝났다. 352년 염민은 전연의 모용각에게 크게 지고 사로잡혀 처형되었다. 동진의 저부는 349년 후조의 혼란을 틈타 북벌에 나섰으나 크게 지고 물러났다. 후조의 몰락 과정에서 화북 인구가 크게 줄어 많은 이들이 남쪽이나 요서, 관중으로 피했다. 염민은 아버지 염첨이 석륵에게 사로잡혀 후조의 장수가 된 한인으로, 석호의 양손자가 되어 석민이라 불렸다. 정권을 잡은 뒤에는 석씨 성을 버리고 본래의 염씨로 돌아갔다."
  subjects: [later-zhao, former-yan, former-qin, former-liang, eastern-jin]
  tags: [politics, war, society]
  sources: ["『진서』 석륵재기·석계룡재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: huan-wen-347
  year: 346
  endYear: 373
  title:
    ko: "환온의 성한 정벌(347)과 북벌(354~369)"
  summary:
    ko: "환온(312~373)은 명제의 사위로 345년 형주 자사가 되었다. 346년 음력 11월 조정의 반대에도 군사를 이끌고 창장강을 거슬러 올라 성한을 쳤고, 347년 청두에 이르러 이세의 항복을 받았다. 환온은 쓰촨을 얻어 군사와 명성을 크게 키웠고, 조정은 은호를 앞세워 그를 견제했다. 354년 첫 북벌에서 환온은 전진을 쳐 관중의 파상까지 이르렀으나 전진이 보리를 거둬들여 군량을 끊자 물러났다. 356년 둘째 북벌에서는 강족 요양을 쫓아내고 뤄양을 되찾았다. 환온은 도읍을 뤄양으로 옮기자고 주장했으나 조정은 받아들이지 않았고, 뤄양은 365년 전연에게 넘어갔다. 369년 셋째 북벌에서 환온은 5만 군사를 이끌고 전연의 방두까지 갔으나 모용수에게 크게 지고 물러나 위신이 꺾였다. 전연은 이듬해 전진에게 망했다(앞의 사건 「저족 부건의 전진과 부견의 화북 통일」). 371년 환온은 황제 사마혁을 폐하고 간문제를 세웠다. 찬위를 꾀했으나 사안과 왕탄지가 일을 미루는 사이 373년 죽었다. 환온의 북벌이 번번이 한계에 부딪힌 것은 보급 문제와 조정과 장군 사이의 불화가 컸기 때문이다. 한편 동진은 환온 덕에 쓰촨을 얻었으나 이는 창장강 상류를 쥔 장군의 힘을 키워 조정을 위협하는 결과가 되었다. 환온은 352~353년 북벌에 실패한 은호를 354년 탄핵해 평민으로 쫓아냄으로써 조정의 주도권을 쥐었다. 364년에는 유민의 호적을 지금 사는 곳에 올리는 토단을 시행해 조세 기반을 넓혔다. 354년 북벌 때 관중의 노인들이 눈물을 흘리며 뜻밖에 다시 관군을 보게 되었다고 했다는 기록이 『진서』에 전한다. 356년 뤄양을 되찾은 환온은 서진(西晉) 황제들의 능을 수리하고 수비병을 남겼다."
  subjects: [eastern-jin, cheng-han, former-qin, former-yan]
  links:
    - { from: eastern-jin, to: cheng-han, note: "성한 정복, 이세의 항복(347)" }
  tags: [war, politics]
  sources: ["『진서』 환온전·목제기·폐제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: southern-culture-353
  year: 353
  endYear: 433
  title:
    ko: "동진과 송의 문화: 왕희지의 난정(353), 고개지, 도연명과 사령운"
  summary:
    ko: "동진과 남조에서는 문벌 귀족이 청담과 현학을 즐기며 서예·회화·시문을 가꾸었다. 왕희지(303~361 또는 321~379)는 낭야 왕씨 출신으로 353년 음력 3월 3일 회계 산음의 난정에서 사안·손작 등 마흔한 명과 구불구불한 물길에 술잔을 띄우는 모임을 열었고, 이때 지은 시를 엮은 서문 「난정집서」는 행서의 걸작으로 꼽힌다. 아들 왕헌지와 함께 이왕이라 불렸다. 고개지(344 무렵~405 무렵)는 인물화에서 겉모습보다 정신을 그리는 ‘전신’을 중시했고, 『여사잠도』가 당대의 모사본으로 전한다. 도연명(365~427, 372~427로 보기도 한다)은 405년 팽택 현령을 그만두며 「귀거래사」를 짓고 전원으로 돌아가 「도화원기」 같은 글로 이상향을 그렸다. 사령운(385~433)은 송 초 정치에서 밀려나자 산수를 노래해 산수시의 길을 열었으나 433년 반역 혐의로 처형되었다. 송 종실 유의경은 이런 문벌 귀족들의 말과 행동을 『세설신어』로 엮었다. 남조 문화의 이런 흐름은 북쪽에서 이민족 왕조가 불교를 키우던 것과 함께 위진 남북조 시대 중국 문화의 두 갈래를 이루었다. 뒤에 남조 문화는 양 무제 때 문학 비평과 선집으로 이어졌다(뒤의 사건 「양 무제의 문치와 불교(502~549)」). 이런 문화를 길러 낸 문벌 귀족 사회에서는 구품중정제 아래 ‘상품에는 한미한 집안이 없고 하품에는 세력 있는 집안이 없다’는 탄식이 나올 만큼 집안이 관직을 좌우했다(『진서』 유의전). 청담은 죽림칠현의 흐름을 이은 노장 현학이 중심이었고, 여기에 불교가 어울려 현학과 불교가 서로 영향을 주었다. 고개지는 재주와 그림과 어리석음 세 가지에서 으뜸이라 ‘삼절’로 불렸다고 하며, 왕희지는 뒷날 ‘서성’으로 불렸다."
  subjects: [eastern-jin, liu-song]
  tags: [culture]
  sources: ["『진서』 왕희지전·고개지전", "『송서』 은일전 도잠전·사령운전", "『세설신어』 (Richard B. Mather 영역, Shih-shuo Hsin-yü: A New Account of Tales of the World, 1976)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: fu-jian-357
  year: 357
  endYear: 383
  title:
    ko: "부견과 왕맹의 전진: 한인 관료 등용과 여러 민족의 통치(357~383)"
  summary:
    ko: "357년 부견은 폭정을 일삼던 사촌 부생을 폐하고 전진의 군주가 되었다. 부견은 한인 왕맹을 재상으로 기용했다. 왕맹은 은거하던 학자로, 부견에게 발탁된 뒤 호족과 외척의 불법을 엄하게 다스려 기강을 세웠다. 부견은 태학을 일으켜 유학을 장려했고 농업과 수리를 돌보게 했다. 370년 전연을 멸했을 때는 모용씨 선비 수만 호를 장안으로 옮겼고, 이후 정복한 선비·강을 관중에 두고 저족은 각지 요충에 나누어 배치했다. 이는 한인과 여러 민족을 한 나라로 다스리려는 구상에서 나왔으나 뒤에 이들 민족이 비수 전투 뒤 앞다투어 독립하는 바탕이 되었다. 전연 정벌은 왕맹이 이끌어 업을 함락하고 황제 모용위를 사로잡았다. 373년 쓰촨을, 376년 전량과 대를 차지해 화북을 통일했다. 왕맹은 375년 죽으면서 동진을 치지 말고 선비·강을 경계하라고 당부했으나 부견은 남정을 서둘렀다. 부견은 불교도 후원했다. 372년 고구려 소수림왕에게 승려 순도와 불상·경문을 보냈고(앞의 사건 「소수림왕의 불교 수용과 체제 정비」) 379년에는 도안을 장안으로 맞아들였는데, 도안은 장안에서 경전 번역을 이끌었다. 382년 부견은 여광을 서역으로 보내(뒤의 사건 「여광의 서역 원정과 후량(後涼)의 성립(382~403)」) 쿠차의 구마라집을 데려오게 했다. 383년 비수에서 동진에게 크게 지면서 전진은 무너지기 시작했다(앞의 사건 「비수 전투와 전진의 붕괴, 후연·북위의 성립」). 383년 대군에는 모용수·요장 등 투항한 선비·강 수장의 부대가 섞여 있었고, 패전 뒤 이들이 차례로 독립해 후연·서연·후진(後秦)을 세웠다. 『진서』는 부견 때 장안에서 각 주로 가는 길 양쪽에 홰나무와 버드나무를 심고 일정한 거리마다 정과 역을 두었으며 관중이 풍년을 맞아 백성들이 노래했다고 적는다."
  subjects: [former-qin, former-yan, former-liang, tuoba-dai, eastern-jin, goguryeo]
  tags: [politics, society, religion]
  sources: ["『진서』 부견재기·왕맹전", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: later-liang-lu-382
  year: 382
  endYear: 403
  title:
    ko: "여광의 서역 원정과 후량(後涼)의 성립(382~403)"
  summary:
    ko: "382년 부견은 장군 여광에게 7만 군사를 주어 서역 정벌을 명했다. 여광은 서역의 여러 나라를 복속시키고 쿠차를 쳐서 384년 쿠차를 차지했다. 그곳에서 쿠차 출신 승려 구마라집을 사로잡았다. 385년 여광이 돌아오는 길에 비수의 패전 소식이 닿았고, 허시의 전진 관리들은 이미 흩어지고 있었다. 여광은 고장(지금의 우웨이)에 들어가 양주를 차지했고 386년 겨울 부견의 죽음을 듣고 연호를 태안이라 했다. 389년 삼하왕을 칭했고 396년에는 천왕을 칭하며 국호를 대량이라 했다. 397년 북량의 단업과 저거씨, 남량의 독발오고가 연달아 갈라져 나가 후량(後涼)의 땅은 고장 둘레로 줄었다(뒤의 사건 「허시 회랑의 남량·북량·서량(397~421)」). 399년 여광이 죽자 아들 여소가 이었으나 곧 이복형 여찬에게 몰려 죽었고, 401년 사촌 여초·여륭 형제가 여찬을 죽이고 여륭이 올랐다. 여광은 구마라집을 16년 남짓 억류했다. 401년 후진(後秦)의 요흥이 쳐들어오자 여륭은 굴복했고, 구마라집은 후진으로 넘겨졌다. 403년 여륭이 후진에 항복하고 땅을 넘기며 후량(後涼)은 망했다. 여씨는 저족으로 전진의 같은 겨레였으나 부견의 나라가 무너지자 허시에서 자립해 한인·선비·흉노가 섞인 사회를 다스렸다. 여광은 서역에서 낙타 2만여 마리에 보물을 싣고 준마 1만여 필을 끌고 돌아왔다고 한다(『진서』, 과장되었을 수 있다). 구마라집이 허시에 머문 일은 쿠차의 불교 문화가 중원으로 들어오는 길을 열었다는 점에서 중국 불교사에서 중요하다. 후량(後涼)은 한때 둔황에서 우웨이에 이르는 허시 회랑 전체와 시닝까지 다스렸다. 여광은 구마라집을 강제로 쿠차 왕의 딸과 혼인시켰다고 『고승전』은 전한다."
  subjects: [later-liang-lu, former-qin, later-qin, southern-liang, northern-liang]
  links:
    - { from: later-qin, to: later-liang-lu, note: "후량(後涼) 굴복, 여륭의 항복(401~403)" }
  tags: [politics, war]
  sources: ["『진서』 여광재기", "『고승전』 구마라집전", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: western-yan-384
  year: 384
  endYear: 394
  title:
    ko: "서연: 모용홍·모용충의 독립과 장자의 모용영(384~394)"
  summary:
    ko: "전진의 부견은 370년 전연을 멸한 뒤 전연의 황족 모용위와 모용씨 선비를 장안 둘레에 옮겨 살게 했다. 383년 비수의 패전 뒤 전진이 흔들리자 384년 모용수가 연왕을 칭해 후연을 세웠고(앞의 사건 「비수 전투와 전진의 붕괴, 후연·북위의 성립」), 같은 해 모용홍이 관동에서 군사를 일으켜 전진에 맞섰다. 모용홍이 부하에게 죽은 뒤 아우 모용충이 이어 385년 장안을 함락했다. 장안은 큰 약탈을 겪었고 부견은 달아났다. 모용충의 선비 병사들은 고향인 동쪽으로 돌아가기를 바랐으며, 386년 모용충이 부하에게 죽은 뒤 단수·모용의·모용요·모용충(忠)이 한 해 사이에 잇달아 세워졌다 죽는 가운데 무리는 장안을 떠나 산시 남부로 옮겨 갔다. 마지막으로 추대된 모용영이 장자(지금의 창즈)에서 황제를 칭했고, 서연은 산시 중남부의 평양·상당 서쪽·하동을 다스렸다. 같은 모용씨의 후연과는 충돌이 이어졌다. 394년 후연의 모용수가 장자를 함락시키고 모용영을 죽여 서연은 10년 만에 끝났다. 서연은 5호 16국의 16국에 넣지 않는 일이 많지만, 비수 전투 뒤 쏟아진 선비 모용씨의 나라 가운데 장안을 차지한 나라였다. 장안을 차지한 모용충은 황제를 칭했으나 약탈이 심해 민심을 잃었다고 『진서』는 적는다. 이때 부견은 장안을 나가 오장산으로 달아났다가 요장에게 사로잡혔다. 비수 전투 뒤 선비 모용씨는 후연(모용수)과 서연(모용홍·충·영)으로 갈라졌고 뒤에 남연(모용덕)까지 세워, 한 가문이 세 나라를 일으킨 셈이 되었다. 장자가 있는 상당은 타이항산 서쪽의 높은 분지로 화북 평원과 산시 분지를 잇는 군사 요충이었다. 모용영은 연호를 중흥이라 했다. 394년 서연을 병합한 후연은 이듬해 참합피에서 북위에 크게 지고 곧 산시와 하북을 잃었다(앞의 사건 「비수 전투와 전진의 붕괴, 후연·북위의 성립」)."
  subjects: [western-yan, former-qin, later-yan]
  links:
    - { from: later-yan, to: western-yan, note: "서연 정복, 모용영의 죽음(394)" }
  tags: [politics, war]
  sources: ["『진서』 모용위재기·모용수재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: later-qin-yao-chang-384
  year: 384
  endYear: 394
  title:
    ko: "요장의 후진(後秦) 건국과 부견의 죽음(384~394)"
  summary:
    ko: "요장은 강족 추장 요익중의 아들이다. 요익중은 석호를 섬겼고, 아들 요양이 356년 환온에게 뤄양에서 쫓겨난 뒤 357년 전진과 싸우다 죽자 요장은 전진 부견에게 귀순해 장군이 되었다. 384년 모용홍이 관동에서 군사를 일으키자 부견이 보낸 부예가 싸움에서 져 죽었다. 부견의 의심을 받은 요장은 위수 북쪽으로 달아나 강족의 추대를 받아 대장군·대선우·만년진왕을 칭하고 북지에 자리 잡았다. 385년 장안에서 쫓겨나 달아나던 부견을 사로잡았고, 옥새를 내놓으라는 요구에 부견은 ‘오호의 순서에 너희 강이라는 이름은 없다’고 꾸짖었고, 요장은 그를 신평의 불교 사원에서 목 졸라 죽였다(『진서』). 모용충을 따르던 선비가 동쪽으로 떠난 장안을 386년 요장이 차지해 황제에 올랐다(후진(後秦)). 후진은 스스로 나라 이름을 대진이라 했다. 한편 전진의 잔존 세력인 부비와 부등이 맞섰다. 385년 진양에서 황제를 칭한 부비는 386년 뤄양을 노리다 동진군에게 죽었고, 부등이 남안에서 황제로 추대되었다. 389년 요장은 부등의 보급 기지 대계를 밤에 습격해 부등의 황후 모씨를 사로잡아 죽이고 아들들도 죽였다. 요장이 죽고 아들 요흥이 이은 뒤 394년 요흥이 폐교에서 부등의 주력을 무찌르고 부등을 처형했다. 부등의 아들 부숭은 황중에서 황제를 칭했으나 서진(西秦)의 걸복씨에게 죽어 전진은 완전히 끝났다. 이로써 관중은 요씨 강족의 후진이 차지했고, 후진은 뒤에 구마라집을 장안에 맞아들이며 전성기를 열었다(뒤의 사건 「구마라집의 장안 역경(401~413)」). 요장의 독립은 비수 패전 뒤 전진의 투항 장수들이 잇달아 일어선 흐름의 하나였다. 같은 384년 모용수(후연)와 모용홍(서연)이 일어났고, 385년에는 걸복국인(서진(西秦))이, 386년에는 여광(후량(後涼))이 독립했다."
  subjects: [later-qin, former-qin, western-yan, eastern-jin, western-qin]
  links:
    - { from: later-qin, to: former-qin, note: "부견을 죽이고 장안을 차지(385~386)" }
  tags: [politics, war]
  sources: ["『진서』 요장재기·요흥재기·부견재기·부등재기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: western-qin-385
  year: 385
  endYear: 431
  title:
    ko: "걸복부의 서진(西秦)(385~431)"
  summary:
    ko: "걸복부는 서쪽 선비의 한 갈래로 간쑤 중부에서 살았다. 371년 족장 걸복사번이 전진에 복속했고, 383년 비수의 패전 뒤 아들 걸복국인이 385년 용사천(지금의 위중)에서 대선우를 칭하며 독립해 서진(西秦)의 시작이 되었다(387년 한때 전진의 번속이 되었다). 388년 걸복국인이 죽고 아우 걸복건귀가 이어 금성(지금의 란저우 서쪽)으로 도읍을 옮기고 395년 진왕을 칭했다. 400년 후진(後秦)의 요흥에게 크게 지자 남량의 독발씨에게 항복했다가 다시 후진으로 가서 땅을 지켰다. 409년 건귀가 서진(西秦)을 다시 세웠으나 412년 조카 걸복공부에게 죽었다. 건귀의 아들 걸복치반은 공부를 치고 즉위해 포한(지금의 린샤)으로 도읍을 옮겼고, 414년 남량을 멸해 시닝·하이둥을 얻었다. 417년 동진의 종주권을 받아들였으며, 간쑤의 병령사 석굴이 이 무렵 처음 열려 169굴에는 420년의 명문이 남아 있다. 428년 치반의 아들 걸복모말이 이었으나 429년 북량의 압박으로 도읍을 정련으로, 이듬해 남안으로 옮겼으며, 430년 토욕혼에게 서쪽 옛 땅(린샤·란저우·위중)의 대부분을 빼앗겼다. 431년 하의 혁련정이 남안을 치자 걸복모말이 항복했고 서진(西秦)은 망했다. 걸복모말과 일족 500여 명은 처형되었다. 혁련정은 곧 북량을 치러 서쪽으로 갔다가 토욕혼에게 사로잡혔다(뒤의 사건 「혁련발발과 하(夏)의 흥망(407~431)」). 나라 이름은 옛 진(秦) 땅에서 땄고, 서진(西秦)은 전진·후진(後秦)과 구별해 뒤에 붙인 이름이다. 서진(西晉)과는 다른 나라이다. 걸복부는 본래 농서의 목축민 부족이었고 나라는 선비 외에 현지의 한인과 강·저 사람들을 거느렸다."
  subjects: [western-qin, former-qin, later-qin, southern-liang, northern-liang, eastern-jin, helian-xia, tuyuhun]
  links:
    - { from: western-qin, to: southern-liang, note: "남량 정복, 낙도 함락(414)" }
    - { from: helian-xia, to: western-qin, note: "서진(西秦) 정복, 걸복모말의 항복(431)" }
  tags: [politics, war, religion]
  sources: ["『진서』 걸복국인재기", "『자치통감』 진기·송기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: later-qin-yao-xing-394
  year: 394
  endYear: 416
  title:
    ko: "요흥의 후진(後秦): 뤄양 점령과 허시 굴복, 시벽의 패배(394~416)"
  summary:
    ko: "394년 요흥은 폐교 전투에서 전진의 부등을 무찔러 관중을 평정했다. 이후 후진(後秦)은 동쪽으로 뻗어 399년 동진의 뤄양을 차지했고, 이때 요흥은 황제 대신 천왕으로 칭호를 낮추었다. 400년 서진(西秦)의 걸복건귀를 격파해 항복시켰고 401년 후량(後涼)을 굴복시켰으며 403년 여륭이 항복했다. 402년 요흥은 시벽에서 북위와 맞섰으나 크게 졌다. 구지를 복속시키며 후진의 영역이 가장 넓어졌다. 요흥은 불교를 후원해 구마라집을 국사로 모시고 장안에 큰 번역 사업을 열었다(뒤의 사건 「구마라집의 장안 역경(401~413)」). 그러나 한인과 여러 민족을 아우르는 통치에는 한계가 있었다. 407년 철불 흉노의 혁련발발이 후진에서 떨어져 나가 하를 세웠고(뒤의 사건 「혁련발발과 하(夏)의 흥망(407~431)」), 남연과 서촉은 후진에 칭신하며 도움을 구했지만 후진은 제대로 돕지 못했다. 409년에는 서진(西秦)이 다시 섰다. 410년 후진은 서촉과 함께 동진의 형주를 공격했으나 실패했다. 416년 요흥이 죽고 아들 요홍이 이었으나 아우 요의(416)와 일족 요회(417)의 반란과 하·서진(西秦)·구지의 압박으로 후진은 급속히 기울었다. 417년 동진의 유유가 장안을 함락했다(뒤의 사건 「유유의 후진 정벌과 하의 장안 점령(416~418)」). 요흥은 불교뿐 아니라 법률 교육에도 힘써 장안에 율학을 열고 군현의 하급 관리를 불러 가르쳤다고 『진서』는 적는다. 요흥은 요장의 맏아들로 394년부터 22년 동안 후진을 이끌었다. 장안에서는 구마라집 말고도 서역 승려 불야다라와 불타야사가 율장을 번역했다. 후진은 관중과 농서, 뤄양 둘레의 하남을 아우르는 대국이 되었으나, 중앙의 통제가 약해 변경 장수들의 독자적인 움직임을 막지 못했다는 평이 있다."
  subjects: [later-qin, eastern-jin, northern-wei, western-qin, later-liang-lu, helian-xia, western-shu, southern-yan]
  tags: [politics, war, religion]
  sources: ["『진서』 요흥재기·요홍재기", "『위서』 도무제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: three-liang-397
  year: 397
  endYear: 421
  title:
    ko: "허시 회랑의 남량·북량·서량(397~421)"
  summary:
    ko: "397년 후량(後涼)의 여광 정권에서 허시 회랑이 여러 나라로 갈라지기 시작했다(앞의 사건 「여광의 서역 원정과 후량(後涼)의 성립(382~403)」). 그해 한인 단업이 흉노계 노수호 저거남성 등의 추대를 받아 건강군(建康郡, 지금의 가오타이 부근)에서 양주목이 되어 북량이 섰고(398년 장액(지금의 장예)으로 옮겼다), 같은 해 선비 독발오고가 서평왕을 칭하며 남량이 섰다. 400년 둔황 태수 이고가 자립해 양공을 칭하고 405년 주천(지금의 주취안)으로 도읍을 옮겨 서량을 이어 갔다. 이고는 동진에 사신을 보내 진(晉)의 신하임을 밝혔다. 401년 저거남성의 사촌 저거몽손이 단업을 죽이고 북량의 주인이 되었다. 남량은 독발오고의 아우 독발리록고를 거쳐 402년 리록고의 아우 독발녹단이 이었다. 녹단은 404년 후진(後秦)에 칭신했고 406년 후진에게서 고장을 받았으며 408년 다시 왕을 칭했다. 그러나 407년 북량 침공에 실패한 뒤 쇠하여 410년 무렵 고장을 북량에게 내주었고 저거몽손이 412년 고장으로 도읍을 옮겼다. 414년 남량은 서진(西秦)의 걸복치반에게 멸망했다(앞의 사건 「걸복부의 서진(西秦)(385~431)」). 서량의 이고는 사후 당 왕실이 조상으로 받든 인물이다. 이고의 아들 이흠은 420년 북량의 저거몽손에게 패해 죽었고 이듬해 421년 둔황에서 이흠의 아우 이순이 자결하면서 서량이 망했다. 이로써 북량이 허시 회랑을 통일했다. 이 분열기에 허시에는 중원의 전란을 피한 학자와 승려가 모여 불교와 학문이 이어졌다(뒤의 사건 「저거몽손의 북량과 담무참, 북위의 정복(401~439)」). 이고는 둔황에 학교를 키워 학문을 장려했다고 전한다. 북량의 장액·고장과 남량의 낙도·서평, 서량의 둔황·주천은 모두 실크로드가 지나는 길목이어서 세 나라는 서역과의 교역으로 이익을 얻었다."
  subjects: [southern-liang, northern-liang, western-liang, later-liang-lu, later-qin, western-qin, eastern-jin]
  links:
    - { from: northern-liang, to: western-liang, note: "서량 정복, 이흠의 죽음과 이순의 자결(420~421)" }
  tags: [politics, war, society]
  sources: ["『진서』 독발오고재기·저거몽손재기·양무소왕전", "『위서』 도무제기·저거몽손전", "『자치통감』 진기·송기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: southern-yan-398
  year: 398
  endYear: 410
  title:
    ko: "남연(398~410)과 유유의 첫 북벌"
  summary:
    ko: "395년 참합피 전투에서 후연이 북위에 크게 진 뒤(앞의 사건 「비수 전투와 전진의 붕괴, 후연·북위의 성립」) 후연의 하북 땅은 북위에 밀려났다. 398년 모용수의 아우 모용덕은 업을 지키다 활대(지금의 화현)에서 연왕을 칭했다(남연). 북위의 압박으로 399년 활대를 떠나 동진의 청주를 빼앗고 광고(지금의 칭저우)에 도읍해 400년 황제를 칭했다. 405년 모용덕이 죽고 조카 모용초가 이었다. 모용초는 사치와 가혹한 정치로 민심을 잃었고 동진의 화이허강 북쪽을 약탈했다. 모용초는 어머니를 돌려받으려고 407년 후진에 칭신하며 악공 120명을 보냈고, 409년에는 궁정 음악을 갖추려 동진의 숙예를 쳐 남녀 2,500명을 끌고 가 음악을 가르쳤다(『자치통감』). 후진(後秦)에 구원을 청했으나 후진은 하의 압박 때문에 군사를 보내지 못했다. 409년 동진의 유유가 북벌에 나서 임구에서 남연의 주력을 무찌르고 광고를 포위했으며 410년 봄 함락했다. 광고는 반년 넘게 버텼으나 성 안에는 식량이 떨어지고 병든 이가 많았다고 한다. 모용초는 사로잡혀 건강에서 처형되었다. 『진서』는 유유가 귀족 이하 3천 명을 죽이고 성을 헐었다고 적는다. 이로써 동진은 산둥 동·중부를 되찾았다. 유유가 남연을 치는 사이 410년 노순이 건강을 위협했으나 유유가 돌아와 411년 노순을 쳐부쉈다. 유유의 이 승리는 동진 안에서 그의 위신을 높여 뒤에 송을 세우는 발판이 되었다(앞의 사건 「동진에서 송으로, 고구려·백제·왜의 책봉」). 남연이 도읍한 광고는 지금의 산둥성 칭저우로 옛 청주의 중심이었다. 남연은 짧게 끝났지만 산둥 동·중부의 한인 사회를 선비 모용씨가 다스린 정권이었다. 남연의 영역은 동쪽의 바다, 남쪽의 사수, 서쪽의 거야택, 북쪽의 황허강 사이 산둥 동·중부였다."
  subjects: [southern-yan, later-yan, eastern-jin, later-qin, northern-wei, helian-xia]
  links:
    - { from: eastern-jin, to: southern-yan, note: "남연 정복, 광고 함락(410)" }
  tags: [war, politics]
  sources: ["『진서』 모용덕재기·모용초재기·안제기", "『송서』 무제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]
  places:
    - { name: 광고 포위와 함락, at: [118.48, 36.68], year: 410 }

- id: faxian-399
  year: 399
  endYear: 412
  title:
    ko: "법현의 천축 순례(399~412)"
  summary:
    ko: "법현은 중국에 들어온 계율 경전이 불완전함을 안타까워해 399년 장안을 떠나 천축으로 구법 여행을 나섰다. 동행은 혜경 등 몇 사람이었다. 일행은 농산을 넘어 서진(西秦)의 걸복건귀가 다스리던 땅에서 여름 안거를 마쳤고, 남량의 땅을 지나 장액(지금의 장예)에서 북량의 영역에 닿았다. 장액이 어지러워 길이 막히자 그곳에서 다시 여름을 보내며 기다렸다. 둔황에서는 서량의 태수 이고가 사막을 건너는 데 필요한 것을 대 주었다. 일행은 이어 사막(유사)을 건너 선선, 우전(호탄)을 거쳐 파미르를 넘어 북인도로 들어갔다. 법현은 천축에서 계율 경전을 구하고 범본을 베껴 쓴 뒤, 스리랑카를 거쳐 바닷길로 돌아와 412년 산둥 반도의 라오산(지금의 칭다오)에 닿았다. 동진의 도성 건강에서는 인도 승려 불타발타라와 함께 경전을 번역했다. 그는 30여 나라를 지나며 보고 겪은 일을 『불국기』(『법현전』)에 남겼다. 이 책은 5세기 초 인도·중앙아시아·스리랑카를 알려 주는 귀중한 기록이다. 법현이 가져온 계율 경전은 중국 불교의 계율 연구를 이끌었다. 이 여행길은 후진(後秦)이 구마라집을 맞아 번역을 일으키던 때(뒤의 사건 「구마라집의 장안 역경(401~413)」)와 같아, 5세기 초 중국 불교가 번역과 구법 두 길로 한꺼번에 움직였음을 보여 준다. 법현은 파탈리푸트라에서 『마하승기율』 같은 계율서를 얻었고 룸비니·부다가야·사르나트 같은 부처의 성지를 두루 순례했다. 그가 남긴 『불국기』는 사막과 설산을 넘는 고난과 당시 인도의 불교와 사회를 전해, 7세기 현장의 『대당서역기』와 함께 서역·천축 연구의 기본 자료로 꼽힌다. 동행하던 승려들은 도중에 돌아가거나 병으로 죽거나 천축에 남아, 중국으로 돌아온 사람은 법현뿐이었다고 한다."
  subjects: [later-qin, western-qin, southern-liang, northern-liang, western-liang, eastern-jin]
  tags: [religion, culture]
  sources: ["법현, 『불국기』(『법현전』) (James Legge 영역, A Record of Buddhistic Kingdoms, 1886)", "『고승전』 법현전", "Erik Zürcher, The Buddhist Conquest of China (1959)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: kumarajiva-401
  year: 401
  endYear: 413
  title:
    ko: "구마라집의 장안 역경(401~413)"
  summary:
    ko: "구마라집(344~413, 350~409로 보는 설도 있다)은 쿠차 출신 승려로 인도인 아버지와 쿠차 왕실의 어머니 사이에서 태어났다고 전한다. 일찍 출가해 카슈미르와 카슈가르에서 소승과 대승을 배웠다. 384년 쿠차를 친 여광에게 사로잡혀 후량(後涼)의 고장에서 16년 남짓 억류되었고 그동안 중국어를 익혔다. 401년 후진(後秦)의 요흥이 후량을 굴복시키자 구마라집은 장안으로 모셔졌고, 요흥은 그를 국사로 대우하며 소요원에서 번역을 맡겼다. 승조·도생·승예·도융 같은 제자들이 함께 번역에 참여했다. 구마라집은 『반야경』을 풀이한 『대지도론』, 『묘법연화경』, 『유마경』, 『금강경』, 용수의 『중론』과 『십이문론』, 제바의 『백론』을 번역했다. 『고승전』은 번역이 300여 권이라 하고 『출삼장기집』은 35부 294권이라 한다. 앞서의 번역은 노장의 용어를 빌려 불경을 풀이하는 격의불교의 틀을 벗어나지 못했는데, 구마라집은 원문의 뜻을 살려 간결하게 옮겨 널리 읽혔다. 『중론』 등을 바탕으로 삼론종이 자랐고, 『묘법연화경』은 뒤의 동아시아 불교에 큰 영향을 끼쳤다. 남쪽에서는 혜원이 여산에서 이름 높았고 구마라집과 편지를 주고받았다. 413년 구마라집이 죽었다. 소요원의 번역장에는 800여 명의 학승이 모였다고 한다. 제자 승조는 『조론』을 지어 공(空) 사상을 중국 철학의 말로 풀었고, 도생은 선한 뿌리가 없는 이도 부처가 될 수 있다고 주장해 뒷날 선종으로 이어지는 길을 열었다. 그의 번역은 뒤 현장의 신역과 구별해 구역이라 부른다. 구마라집이 죽어 화장하자 혀만 타지 않고 남았다는 전승이 있는데, 이는 그가 번역한 말이 거짓이 없다는 증거로 여겨졌다."
  subjects: [later-qin, later-liang-lu]
  tags: [religion, culture]
  sources: ["『고승전』 구마라집전", "『출삼장기집』", "Erik Zürcher, The Buddhist Conquest of China (1959)", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: juqu-mengxun-401
  year: 401
  endYear: 439
  title:
    ko: "저거몽손의 북량과 담무참, 북위의 정복(401~439)"
  summary:
    ko: "저거몽손(366~433)은 노수호(흉노의 한 갈래) 출신으로, 사촌 저거남성이 반란을 꾸민다고 단업에게 모함해 죽게 한 뒤, 그 죽음을 구실로 군사를 일으켜 401년 단업을 죽이고 북량의 주인이 되었다(앞의 사건 「허시 회랑의 남량·북량·서량(397~421)」). 그는 412년 도읍을 고장(지금의 우웨이)으로 옮기며 하서왕을 칭했고 420~421년 서량을 멸해 허시 회랑을 통일했다. 429년에는 서진(西秦)에게서 시닝 일대를 빼앗았다. 동진과 송, 북위에 번갈아 사신을 보내 책봉을 받으며 나라를 지켰다. 몽손은 불교를 크게 후원했다. 421년 중인도 출신 승려 담무참을 맞아들여 『대반열반경』 번역을 시작하게 했고, 우웨이의 천제산 석굴도 몽손이 열었다고 전한다. 『고승전』은 433년 몽손이 북위의 초청을 받은 담무참을 사람을 보내 죽였다고 전한다. 같은 433년 몽손이 죽고 아들 저거목건이 이었다. 목건은 북위 태무제의 누이 무위공주와 혼인했으나 송과도 가까이 지내 북위의 의심을 샀다. 439년 태무제가 직접 고장을 포위하자 목건이 항복해 북량은 망했다(뒤의 사건 「북위 태무제의 화북 통일 전쟁(424~439)」). 북위는 북량 사람 3만여 가호와 승려·장인을 평성으로 옮겼고, 이들이 뒤에 윈강 석굴을 만드는 데 기여했다고 본다. 목건의 아우 저거무휘는 서쪽 고창으로 옮겨 북량의 잔존 정권을 이었고, 그의 아우 안주를 거쳐 460년 유연(柔然)에게 멸망했다. 북량 때 열린 것으로 보는 석굴로 둔황 막고굴의 초기 굴(제268·272·275굴)이 있다. 허시 회랑은 실크로드의 요지여서 불교 미술이 서역에서 중원으로 건너가는 통로가 되었다. 저거씨의 북량은 인구가 많지 않았으나 허시 회랑의 오아시스 도시와 둔황, 주천을 아울러 서역 교역의 이익을 거두었다."
  subjects: [northern-liang, western-liang, western-qin, northern-wei, rouran, liu-song]
  tags: [politics, religion, culture]
  sources: ["『진서』 저거몽손재기", "『위서』 저거몽손전·석로지", "『송서』 저거몽손전", "『고승전』 담무참전", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: western-shu-405
  year: 405
  endYear: 413
  title:
    ko: "초종의 서촉과 동진의 쓰촨 회복(405~413)"
  summary:
    ko: "403년 환현이 동진 황제를 몰아내고 초를 세웠으나 404년 유유가 이를 무너뜨렸다. 이때 익주 자사 모거(毛璩)는 환현 토벌에 군사를 보냈고, 파서군 출신 장수 초종은 그 군사를 이끌고 동쪽으로 나갔다. 405년 초종은 군사들의 요구로 청두로 돌아와 모거를 죽이고 성도왕을 칭했다(서촉 또는 초촉). 초종은 후진(後秦)에 칭신해 도움을 얻으려 했다. 동진은 407년 유경선을 보냈으나 408년 황호에서 60일 맞서다 양식이 떨어져 물러났다. 410년 초종은 후진 요흥의 허락을 받아 환겸 등과 함께 형주를 쳤으나 유도규에게 패하고 파동군을 차지한 채 물러났다. 413년 유유가 주령석에게 군사를 주어 쓰촨을 치게 했다. 주령석은 창장강을 거슬러 올라 청두를 함락했고 초종은 자결해 서촉은 8년 만에 망했다. 쓰촨은 다시 동진의 땅이 되었다. 쓰촨은 304~347년 이씨의 성한이, 347년 환온의 정복 뒤 동진이, 373년 전진이, 383년 뒤 다시 동진이, 405~413년 서촉이 차지하는 식으로 주인이 거듭 바뀌었다(앞의 사건 「성한의 흥망(304~347)」). 유유는 이 승리로 동진 안에서 군공을 더욱 쌓았다. 유유는 주령석에게 봉투에 담은 명령서를 주며 백제성에 이르러 열라고 했다는 일화가 『자치통감』에 전한다. 서촉은 5호 16국 시기 쓰촨의 마지막 독립 정권이었고, 쓰촨은 이후 송의 익주로 이어졌다. 동진은 408년 유경선의 정벌이 실패한 뒤 내분 때문에 쓰촨을 되찾을 여력이 없었다. 412년 유유가 형주의 정적들을 제압해 창장강 상류를 장악하자 이듬해 서촉 정벌을 결행할 수 있었다. 서촉이 망한 뒤 쓰촨은 동진과 송을 거치며 익주로 불렸고 청두는 창장강 상류의 군사 중심지가 되었다. 서촉은 쓰촨 분지와 충칭 서부를 다스렸고 410년 무렵 충칭 동부까지 영역을 넓혔다."
  subjects: [western-shu, eastern-jin, later-qin]
  links:
    - { from: eastern-jin, to: western-shu, note: "쓰촨 회복, 청두 함락(413)" }
  tags: [war, politics]
  sources: ["『진서』 초종전·모보전·안제기", "『송서』 무제기", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: helian-xia-407
  year: 407
  endYear: 431
  title:
    ko: "혁련발발과 하(夏)의 흥망(407~431)"
  summary:
    ko: "혁련발발은 철불부 흉노(흉노와 선비의 피가 섞인 부족) 유위진의 아들이다. 391년 아버지 유위진이 북위에 패한 뒤 부하에게 살해되자 발발은 달아나 몰혁간에게 몸을 의탁했다가 후진(後秦)의 요흥 아래서 변경 사령관이 되었다. 407년 발발은 후진에 반기를 들고 장인 몰혁간을 죽여 그 무리를 흡수한 뒤 대하천왕·대선우를 칭하며 하(夏)를 세웠다. 하 왕조의 후손을 자처했다. 413년 성을 혁련으로 고치고 오르도스에 도읍 통만성을 쌓기 시작했다. 『진서』는 성벽에 송곳이 한 치라도 들어가면 일꾼을 죽여 벽에 쌓았다고 적는다. 418년 발발은 유유가 떠난 장안을 빼앗고 파상에서 음력 11월 무렵 황제를 칭했다(뒤의 사건 「유유의 후진 정벌과 하의 장안 점령(416~418)」). 425년 발발이 죽자 아들 혁련창이 이었다. 북위 태무제가 426년부터 하를 치자 427년 통만성이 함락되었고 428년 혁련창은 안정에서 사로잡혔다. 동생 혁련정은 평량에서 황제를 칭했다. 430년 북위가 관중을 차지하자 하는 쪼그라들었다. 431년 혁련정은 서진(西秦)을 멸했으나 북량을 치러 가던 길에 황허강을 건너다 토욕혼에게 사로잡혀 북위로 넘겨졌고 432년 처형되었다(뒤의 사건 「북위 태무제의 화북 통일 전쟁(424~439)」). 하는 흉노의 전통과 한인 제도를 함께 썼는데, 『진서』는 발발의 가혹한 정치를 비판한다. 통만성이라는 이름은 ‘만방을 하나로 다스린다’는 뜻으로 지었다고 한다. 성벽의 흙이 희게 보여 뒤에는 백성자라 불렸고 유적이 지금의 샨시성 징볜현에 남아 있다. 성을 혁련으로 고친 까닭은 제왕의 위엄이 하늘과 이어진다는 뜻이라고 한다. 발발은 후진에서 독립한 뒤 북위·동진·후진 세 나라를 상대로 싸웠다."
  subjects: [helian-xia, later-qin, northern-wei, western-qin, tuyuhun, northern-liang]
  tags: [politics, war]
  sources: ["『진서』 혁련발발재기", "『위서』 철불유호전·세조기", "『자치통감』 진기·송기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]
  places:
    - { name: 통만성 함락, at: [108.80, 37.97], year: 427 }

- id: liu-yu-later-qin-416
  year: 416
  endYear: 418
  title:
    ko: "유유의 후진 정벌과 하의 장안 점령(416~418)"
  summary:
    ko: "유유는 가난한 평민 출신으로 북부군 장교로 출발해 399~402년 손은의 반란을 누르며 이름을 얻었다. 유유는 404년 환현을 무너뜨리고 410년 남연을, 413년 서촉을 멸해 동진의 실권자가 되었다. 416년 후진(後秦)의 요흥이 죽고 내분이 일자 유유는 대규모 북벌에 나섰다. 장군 단도제와 왕진악 등이 수군을 이끌고 황허강과 위수를 거슬러 올랐다. 416년 겨울 단도제가 뤄양을 되찾아 서진 황제들의 능을 수리하고 지키는 사람을 두었다고 한다. 417년 왕진악이 장안을 함락했다. 417년 음력 8월 후진의 마지막 황제 요홍이 항복해 건강으로 압송되어 처형되었다. 후진은 33년 만에 망했다. 316년 서진이 장안을 잃은 지 101년 만에 남쪽 정권이 장안을 되찾은 것이었다. 유유는 측근 유목지가 죽어 건강의 정치가 불안해지자 그해 말 동쪽으로 돌아갔다. 장안에는 어린 아들 유의진을 두고 왕진악 등에게 맡겼다. 왕진악은 왕맹의 손자였다. 유유가 떠난 뒤 장안 수비 장수들 사이에 내분이 일어나 어지러워졌고, 418년 하의 혁련발발이 장안을 차지하고 파상에서 황제를 칭했다. 이로써 동진은 관중을 1년 남짓 만에 잃고 뤄양 일대만 지켰다. 420년 유유는 동진 공제의 선양을 받아 송을 세웠다(앞의 사건 「동진에서 송으로, 고구려·백제·왜의 책봉」). 유유의 북벌은 장안까지 이른 남조 최대의 북벌로 꼽힌다. 그러나 관중을 지키지 못하고 곧 정권을 세우는 일로 방향을 돌려, 남쪽 정권이 중원을 되찾기가 얼마나 어려운지를 보여 주었다. 이후 송 문제의 북벌들도 황허강 이북을 넘지 못했다. 후진이 망한 뒤 관중은 하와 북위, 송이 차례로 다투는 땅이 되었고, 요씨 강족 일부는 흩어졌다."
  subjects: [eastern-jin, later-qin, helian-xia]
  links:
    - { from: eastern-jin, to: later-qin, note: "후진 정복, 장안 함락과 요홍의 항복(417)" }
    - { from: helian-xia, to: eastern-jin, note: "장안 점령(418)" }
  tags: [war, politics]
  sources: ["『송서』 무제기", "『진서』 안제기·요홍재기·왕진악전", "『자치통감』 진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: northern-wei-unification-424
  year: 424
  endYear: 439
  title:
    ko: "북위 태무제의 화북 통일 전쟁(424~439)"
  summary:
    ko: "423년 말 태무제 탁발도가 즉위했을 때 북위는 북쪽의 유연(柔然), 남쪽의 하와 송, 동쪽의 북연, 서쪽의 북량에 둘러싸여 있었다. 424년 유연이 평성 가까운 운중까지 쳐들어오자 태무제가 직접 막았고, 429년에는 막북으로 깊이 들어가 유연을 크게 쳐서 많은 사람과 가축을 얻었다. 426년부터 하를 쳐 그해 장안을 점령했고 427년 통만성을 함락해 오르도스와 샨베이를 얻었으며 428년 하의 군주 혁련창을 사로잡았다. 430년 송 문제가 도언지에게 북벌을 맡겨 뤄양과 호뢰를 되찾았으나, 그해 겨울 북위군이 얼어붙은 황허강을 건너 뤄양과 호뢰를 도로 빼앗았고 활대는 431년 봄에 함락되었다. 하의 혁련정이 평량에서 버티다 431년 서진(西秦)을 멸하고 북량을 치러 가던 길에 토욕혼에게 사로잡혀 하가 망했다. 같은 무렵 토욕혼은 서진(西秦)의 서쪽 옛 땅을 차지했고, 439년 북량을 멸한 북위는 서진(西秦)의 옛 땅까지 아울러 토욕혼과 직접 맞서게 되었고 444년 여름 장군 탁발복락을 보내 토욕혼을 쳤다. 432년부터 북위는 해마다 북연을 쳐서 436년 북연이 무너져 풍홍이 고구려로 달아났다(앞의 사건 「북연 왕 풍홍의 고구려 망명」). 439년 가을 태무제가 북량의 도읍 고장을 포위하자 저거목건이 항복해 화북 통일이 이루어졌다(앞의 사건 「북위 태무제의 화북 통일과 남북조 시대」). 이 과정에서 한인 관료 최호가 중용되어 선비 귀족과 한인 사이의 한화가 진행되었다. 탁발규 이래 북위는 부족 조직을 해체해 부락민을 호적에 올렸고, 북쪽 변경에는 유연을 막으려 6진을 두었다(뒤의 사건 「6진의 난과 북위의 분열(523~533)」). 막북 원정에서 얻은 포로와 가축은 평성 둘레의 농경과 목축을 키웠다. 304년 한(전조)이 일어나 화북이 갈라진 지 130여 년 만에 화북이 하나의 정권 아래 놓였다."
  subjects: [northern-wei, helian-xia, western-qin, northern-liang, tuyuhun, liu-song, rouran, northern-yan]
  links:
    - { from: northern-wei, to: helian-xia, note: "하 정복, 통만성 함락(427)" }
    - { from: northern-wei, to: northern-liang, note: "북량 정복, 저거목건의 항복(439)" }
    - { from: northern-wei, to: northern-yan, note: "북연 정복(436)" }
  tags: [war, politics]
  sources: ["『위서』 세조기·철불유호전·저거몽손전", "『송서』 도언지전", "『자치통감』 송기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: song-wen-yuanjia-424
  year: 424
  endYear: 453
  title:
    ko: "송 문제의 원가 연간과 북벌의 실패(424~453)"
  summary:
    ko: "422년 송 무제 유유가 죽고 맏아들 소제가 이었으나 424년 대신들이 소제를 폐하고 무제의 셋째 아들 유의륭을 세웠다(문제). 문제는 453년까지 30년 가까이 재위했고 연호 원가(424~453)를 썼다. 정치가 비교적 안정되어 이 시기를 ‘원가의 치’라 부른다. 438년부터 도성 건강에 현학·유학·사학·문학의 네 학관을 세워 학문을 일으켰고, 범엽이 『후한서』를 지었으며 무제의 조카 유의경이 『세설신어』를 엮었다. 그러나 문제는 북위에게 빼앗긴 황허강 남쪽을 되찾으려 여러 차례 북벌했다. 430~431년과 450~451년의 큰 북벌 말고도 452년에 다시 시도했으나 중단되었다. 430년 도언지가 뤄양과 호뢰를 되찾았으나 북위의 반격으로 모두 잃었다. 450년에는 문제가 북벌을 서둘러 왕현모가 활대를 포위했으나 함락하지 못한 채 무너졌다. 이 틈에 북위 태무제가 남하해 450년 음력 12월 말부터 이듬해 정월 창장강 북안의 과보까지 이르렀고 화이허강과 창장강 사이는 크게 약탈당했다. 북위군은 우이를 함락하지 못한 채 물러났으나 송은 이 전쟁으로 크게 쇠했다. 453년 태자 유소가 정변을 일으켜 문제를 죽였고 곧 아우 유준(효무제)이 유소를 쳐 즉위했다. 이후 송 황실은 골육상쟁에 빠졌다(뒤의 사건 「송 말의 내분과 회북 4주의 상실(453~477)」). 원가 연간에는 고구려 장수왕과 백제 비유왕, 왜의 왕도 송과 사신을 주고받았다(송 건국 때의 책봉은 앞의 사건 「동진에서 송으로, 고구려·백제·왜의 책봉」). 범엽은 445년 문제를 죽이고 유의강을 세우려는 모의에 연루되어 처형되었다. 창장강 하류의 개발이 진전되어 건강과 그 둘레의 상업이 커졌다고 한다. 450년 북벌 때 무장 심경지는 밭 가는 일은 종에게 묻고 길쌈은 계집종에게 물어야 한다며 글만 읽은 신하들의 북벌론을 비웃었다고 한다."
  subjects: [liu-song, northern-wei]
  tags: [politics, war, culture]
  sources: ["『송서』 문제기·도언지전·왕현모전", "『위서』 세조기", "『자치통감』 송기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: northern-wei-buddhism-439
  year: 439
  endYear: 465
  title:
    ko: "북위의 불교: 북량 승려의 이주(439), 태무제의 폐불(446), 윈강 석굴(460 무렵)"
  summary:
    ko: "439년 북위가 북량을 멸하자 태무제는 고장의 주민 3만여 가호와 승려·장인을 평성으로 옮겼다. 허시의 불교와 미술이 평성에 들어왔다. 태무제는 한인 최호와 도사 구겸지의 영향으로 도교를 받아들였다. 구겸지는 신천사도를 일으켜 태무제를 ‘태평진군’을 받드는 군주로 치켜세웠고, 태무제는 440년 연호를 태평진군으로 고치고 442년 도교의 부적을 받았다. 446년 장안의 한 절에서 무기가 발견되자 이를 반란과 연결한 태무제는 장안의 승려를 죽이고 경전과 불상을 불태웠으며 전국에 불교를 금했다. 중국 불교가 겪은 이른바 네 차례 법난 가운데 첫 번째이다. 태자 탁발황이 승려를 몰래 숨겨 피해를 줄였다고 『위서』는 전한다. 450년 최호는 국사 사건으로 일족과 함께 처형되었고, 태무제도 452년 환관 종애에게 죽었다. 종애가 세운 탁발여가 곧 죽임을 당하고 태자 탁발황의 아들인 문성제가 즉위했다. 문성제는 불교를 다시 허락했다. 460년 승려 우두머리인 사문통 담요가 평성 서쪽 무주산 벼랑에 석굴 다섯 곳을 파고 높이 70척에 이르는 큰 불상을 새기자고 청했다. 이것이 윈강 석굴의 시작이 되었다(『위서』 석로지). 윈강의 이른 시기 5굴(담요 5굴)의 큰 불상은 북위 초기 다섯 황제를 부처에 빗댄 것이라는 풀이가 있다. 북량 승려가 옮겨 온 서역·허시의 영향은 이 석굴의 양식에 남았고, 494년 뤄양 천도 뒤 이 흐름은 룽먼 석굴로 이어졌다(뒤의 사건 「효문제의 한화 정책과 뤄양 천도(493~499)」). 폐불 때 승려 다수가 숨거나 환속했고 사원의 재산이 몰수되었으나, 불교는 곧 되살아나 북위 최대의 종교가 되었다. 이처럼 북위의 불교는 국가 권력과 맞물려 탄압과 후원을 오갔다. 담요는 사원에 딸린 노비인 승기호와 불도호 제도를 건의해 사원 경제도 뒷받침했다."
  subjects: [northern-wei, northern-liang]
  tags: [religion, culture]
  sources: ["『위서』 석로지·세조기·최호전", "『고승전』", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: song-decline-453
  year: 453
  endYear: 477
  title:
    ko: "송 말의 내분과 회북 4주의 상실(453~477)"
  summary:
    ko: "453년 효무제 유준이 즉위한 뒤 송 황실은 골육상쟁에 빠졌다. 420년부터 479년까지 송에서는 황제가 여덟 명 바뀌었고 그 가운데 다섯이 폐위되거나 살해되었다. 464년 효무제가 죽자 아들 전폐제가 즉위했으나 폭정 끝에 465년 죽임을 당했고 숙부 명제 유욱이 즉위했다. 명제가 서자 효무제의 아들 진안왕 유자훈이 심양에서 황제를 칭하며 반기를 들었고, 서주를 지키던 설안도 같은 회북의 장수들이 466년 북위에 투항했다. 북위는 이에 응해 466~467년 서주·연주, 469년 청주·기주 같은 회북 4주와 산둥 땅을 차지했고, 송은 이를 돌려받지 못했다. 명제는 종실을 의심해 형제와 조카를 많이 죽였다. 472년 명제가 죽고 어린 후폐제가 즉위하자 장군 소도성이 군권을 쥐었고, 477년 후폐제를 죽이고 순제를 세웠다. 479년 소도성이 순제의 선양을 받아 제를 세우면서 송은 망했다(뒤의 사건 「남조의 송·제·양 교체와 고구려·백제·대가야의 책봉」). 송이 회북을 잃으면서 북쪽 방어선은 화이허강에서 창장강 가까이로 물러났고, 남조에서는 황실 종친이 번갈아 죽고 장군이 정권을 넘보는 일이 되풀이되었다. 송의 황제들은 문벌 귀족을 믿지 못해 한미한 집안 출신의 근신에게 기밀을 맡기는 일이 많았고, 이들이 중서사인으로 정치를 좌우했다. 회북 4주를 차지한 북위는 이곳에 군을 설치해 다스렸고, 송은 이후 화이허강 이남의 방어에 힘을 쏟았다. 회북을 잃은 뒤 건강과 창장강은 북위 기병의 위협을 받게 되었고, 이는 뒤의 남조가 창장강 방어선에 의존하는 틀이 되었다. 송 말의 이런 혼란은 건국한 지 반세기 만에 군사력을 쥔 장군이 정권을 넘보는 길을 열었다. 후폐제는 열네 살 안팎에 살해되었고 선양한 순제도 곧 죽임을 당했다."
  subjects: [liu-song, northern-wei]
  tags: [politics, war]
  sources: ["『송서』 효무제기·전폐제기·명제기·후폐제기", "『남제서』 고제기", "『자치통감』 송기·제기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: six-dynasties-science-462
  year: 462
  endYear: 547
  title:
    ko: "남북조의 과학과 저술: 조충지, 가사협, 역도원, 양현지"
  summary:
    ko: "남북조 시대의 학문은 전란 속에서도 이어졌다. 남조 송·제의 조충지(429~500)는 462년 송 효무제에게 새 역법을 올렸는데 이것이 대명력이다. 대명력은 세차를 처음 반영했고 이전 역법보다 정확한 값을 썼다. 조충지는 원주율을 3.1415926과 3.1415927 사이로 구했다(『수서』 율력지). 대명력은 그가 살아 있을 때는 채택되지 않았고 양 무제 때인 510년에야 시행되었다. 북위의 가사협은 6세기 전반 고양 태수를 지내며 화북 농업 기술을 정리해 『제민요술』을 지었다. 곡물·채소·과수·양잠·축산·양조를 다룬 이 책은 중국에 전하는 가장 오래된 종합 농서로 꼽힌다. 북위의 역도원(5세기 후반~527)은 『수경』에 주석을 달아 40권 『수경주』를 엮었다. 하천을 따라 지리·역사·풍속을 함께 적은 이 책은 지리서의 고전이다. 동위의 양현지는 547년 무렵 천도 뒤 쇠락한 옛 수도 뤄양의 사찰을 되짚어 『낙양가람기』를 썼다. 이 책은 북위 후기 불교 사원의 번성과 뤄양 시가의 모습을 전한다. 이 밖에 소통(소명태자)이 『문선』을 엮고 유협이 『문심조룡』을, 종영이 『시품』을 지어 문학 비평과 선집의 길을 열었다. 이런 성과는 갈라진 남북의 나라들이 저마다 학문과 기술을 키운 결과이다. 조충지는 또 지남거와 천리선, 수력으로 곡식을 찧는 기계를 만들었다고 전하며 수학책 『철술』을 지었으나 일찍 전하지 않게 되었다(『남제서』 조충지전). 대명력은 1회귀년을 365.2428일로 잡아 실제와 오차가 매우 작았고, 『제민요술』은 10권 92편으로 곡물 윤작과 퇴비, 파종 시기, 가축 사육, 술 빚기, 저장까지 다루었다."
  subjects: [liu-song, southern-qi, liang, northern-wei, eastern-wei]
  tags: [culture, economy]
  sources: ["『수서』 율력지", "『제민요술』", "『수경주』", "『낙양가람기』", "『양서』 소통전", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)"]

- id: feng-taihou-484
  year: 484
  endYear: 486
  title:
    ko: "풍태후와 효문제 초기의 개혁: 봉록제·균전제·삼장제(484~486)"
  summary:
    ko: "북위의 풍태후(문명태후)는 문성제의 황후로 북연의 마지막 왕 풍홍의 손녀이다(앞의 사건 「북연 왕 풍홍의 고구려 망명」). 효문제는 471년 세 살에 즉위했고(아버지 헌문제는 태상황이 되었다), 476년 헌문제가 죽자 풍태후가 다시 섭정해 490년 죽을 때까지 실권을 쥐었다(첫 섭정은 465~466년 문성제가 죽은 뒤였다). 풍태후는 한인 관료 이충 등을 기용해 개혁을 이끌었다. 484년 관리에게 정기적으로 봉록을 주는 봉록제를 시행해 뇌물과 약탈로 보수를 대신하던 관행을 막았다. 485년에는 균전제를 반포해 국가가 가진 땅을 농민에게 나누었다. 15세 이상 남자에게 노전 40무, 여자에게 20무를 주어 죽거나 늙으면 국가에 돌려주게 했고 뽕나무밭은 남자에게 20무를 주어 세습을 허용했다. 486년에는 삼장제를 실시해 5가를 린, 5린을 리, 5리를 당으로 묶고 각각 장을 두어 호적을 정리하고 세금을 거두게 했다. 부부 한 쌍에게 비단 1필과 곡식 2석의 세금을 매겼다. 이는 호족이 거느리던 숨은 호구를 국가가 직접 파악하게 한 조치였다. 균전제와 삼장제는 뒤의 수·당의 균전제와 조용조 체제의 바탕이 되었다. 이 무렵 북위는 남제와 사신을 주고받으며 남쪽과의 전쟁을 쉬었다. 풍태후는 어린 효문제를 직접 길렀다. 이충이 삼장제를 건의하자 호족 출신 대신들은 호구가 드러나 세력이 줄 것을 두려워해 반대했으나 풍태후가 받아들였다고 『위서』는 전한다. 풍태후가 이끈 이 개혁들은 효문제가 한화 정책을 펴는 바탕이 되었다. 균전제에는 노비와 소에게도 땅을 주는 규정이 있어 노비와 소를 많이 가진 부호에게 유리했다. 삼장제에서는 인장, 리장, 당장이 각각 1부, 2부, 3부의 노역을 면제받았다. 균전제의 땅 반환 규정은 현실에서 지켜지지 않는 일이 많아 지방에서는 땅 나눔이 이름뿐이었다는 지적이 있다."
  subjects: [northern-wei, southern-qi]
  tags: [politics, economy, society]
  sources: ["『위서』 식화지·문명태후 풍씨전·고조기", "『자치통감』 제기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: luoyang-relocation-493
  year: 493
  endYear: 499
  title:
    ko: "효문제의 한화 정책과 뤄양 천도(493~499)"
  summary:
    ko: "490년 풍태후가 죽자 효문제가 직접 정치를 이끌었다. 효문제는 평성이 북쪽 변경에 치우쳐 문화와 교통에서 불리하다며 중원의 뤄양으로 도읍을 옮기려 했다. 선비 귀족의 반대가 컸기에 493년 남제를 치겠다며 30만 군사를 이끌고 출정했다. 장맛비 속에 뤄양에 이르러 신하들이 진군을 말리자 군사를 돌리는 대신 천도를 받아들이게 했다. 494년 도읍이 뤄양으로 옮겨졌다. 효문제는 이어 495년 조정에서 선비어를 금하고 선비 복장을 한인 옷으로 바꾸게 했으며, 496년 탁발씨를 원씨로 고치는 등 선비의 성을 한자 성으로 바꾸었다. 한인 명문 노·최·정·왕씨와 혼인하도록 권했고 선비 귀족 가문의 등급도 정했다. 뤄양 남쪽 이수 양쪽 절벽에는 천도 직후부터 룽먼 석굴이 만들어지기 시작했다. 선비 귀족의 반발이 이어져 497년에는 태자 원순이 반란에 연루되어 죽음을 강요받았다. 북쪽 변경 6진의 선비 병사들은 이 정책에서 소외되어 불만이 쌓였다(뒤의 사건 「6진의 난과 북위의 분열(523~533)」). 효문제는 남제와 싸우다 499년 죽었다. 491년 고구려 장수왕이 죽었을 때 효문제는 소복을 입고 애도하고 고구려왕으로 추증하며 시호를 내렸다(『위서』). 이 시기 북위는 중국식 관료제와 균전제로 체제를 정비하며 한인 지배층을 끌어안았다. 천도 뒤 뤄양에는 불교 사원이 크게 늘어 『낙양가람기』에 따르면 북위 말 사원이 1천 곳을 넘었다. 효문제는 한어 사용을 권하고 학교를 세워 선비 귀족 자제도 한인 경전을 배우게 했다. 임성왕 원징이 평성에 남아 있던 귀족들을 설득해 천도를 도왔다. 효문제는 관제도 한인 왕조의 9품제에 맞추어 고쳤다."
  subjects: [northern-wei, southern-qi, goguryeo]
  tags: [politics, culture]
  sources: ["『위서』 고조기·고구려전·석로지", "『남제서』 위로전", "『자치통감』 제기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: liang-wudi-502
  year: 502
  endYear: 549
  title:
    ko: "양 무제의 문치와 불교(502~549)"
  summary:
    ko: "502년 소연은 제 화제의 선양을 받아 양을 세웠다(앞의 사건 「남조의 송·제·양 교체와 고구려·백제·대가야의 책봉」). 양 무제는 549년까지 47년 동안 재위해 남조에서 가장 오래 나라를 다스린 황제이다. 즉위 초에는 정치에 힘쓰고 문벌 밖의 인재도 쓰려고 505년 오경박사를 두어 유학을 장려했다. 한편 504년 도교 대신 불교를 믿겠다는 뜻을 밝히고 스스로 보살계를 받아 ‘황제보살’이라 불렸다. 건강 궁궐 곁에 동태사를 세웠고, 527·529·546·547년 네 차례 이 절에서 스스로 몸을 바치는 사신을 했으며 그때마다 신하들이 거금을 내고 황제를 되찾아 왔다. 『남사』는 수도 건강에 절이 500곳이 넘고 승려와 비구니가 10만 명이 넘었다고 적는다. 사찰의 땅과 면세는 국가 재정과 병력에 부담이 되었다. 문화는 꽃폈다. 무제의 아들 소통은 『문선』을 엮었고 유협은 『문심조룡』을, 종영은 『시품』을 지었다. 521년에는 백제 무령왕이 양에 사신을 보내 책봉을 받았다(앞의 사건 「무령왕의 양 교류와 22담로」). 무제는 말년에 정치를 소홀히 했고 북쪽에서 투항한 후경을 받아들인 것이 화근이 되었다(뒤의 사건 「후경의 난과 양의 몰락(547~554)」). 549년 무제는 굶주림 속에 죽었다. 무제는 하루 한 끼만 들고 채소와 곡식만 먹으며 승려처럼 살았다고 한다(『남사』). 541년에는 백제 성왕이 양에 사신을 보내 모시박사와 열반 등의 경전 해설, 공장과 화가를 청해 얻었다고 한다(『양서』 제이전). 무제는 학문에도 밝아 『주역』을 비롯한 여러 경전의 해설서를 지었다고 한다. 소통은 531년 일찍 죽어 아우 소강이 태자가 되었고 소강은 뒤에 간문제가 되었다."
  subjects: [liang, southern-qi, baekje]
  links:
    - { from: southern-qi, to: liang, note: "화제의 선양(502)" }
  tags: [politics, religion, culture]
  sources: ["『양서』 무제기·소통전", "『남사』 양본기·곽조심전", "『자치통감』 양기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: six-garrisons-523
  year: 523
  endYear: 533
  title:
    ko: "6진의 난과 북위의 분열(523~533)"
  summary:
    ko: "북위는 북쪽 변경에 옥야·회삭·무천·무명·유현·회황의 6진을 두어 유연(柔然)을 막았다. 6진에는 선비 귀족과 병사가 살았고 처음에는 명예로운 자리였다. 그러나 494년 뤄양 천도와 한화 정책 뒤 6진의 선비 군인은 승진에서 밀려나고 죄수까지 섞여 들어오면서 처지가 낮아졌다(앞의 사건 「효문제의 한화 정책과 뤄양 천도(493~499)」). 523년 옥야진에서 파육한발릉이 반란을 일으켜 6진이 호응했다. 북위 조정은 유연 칸 아나괴의 도움을 얻어 진압했으나, 항복한 6진 사람 약 20만을 하북으로 옮기자 이들이 곧 하북에서 다시 들고일어났다. 526년 갈영이 하북의 반란군을 이끌고 세력을 키웠다. 528년 효명제가 어머니 호태후에게 눌려 있다가 북방의 군벌 이주영에게 도움을 청하자 호태후가 효명제를 독살했다고 전한다. 이주영은 군대를 이끌고 뤄양에 들어가 호태후가 세운 어린 황제 원쇠와 호태후를 황허강에 던져 죽이고 대신 2천여 명을 학살했다(하음의 변). 이주영은 효장제를 세웠으나 530년 효장제가 궁중에서 이주영을 죽였고, 곧 이주씨가 반격해 효장제를 죽인 뒤 장광왕 원엽과 절민제 원공을 차례로 세웠다. 6진 회삭진 출신 고환은 안정왕 원랑을 세워 맞서다 532년 한릉 전투에서 이주씨를 무찌르고 효무제를 세웠다. 효무제가 고환을 꺼려 534년 관중의 우문태에게 달아나면서 북위는 동서로 갈라졌다(뒤의 사건 「북위의 분열과 동위·서위, 북제·북주의 성립」). 고환은 회삭진, 우문태는 무천진 출신으로 두 사람 모두 6진의 무장이었고, 이들이 세운 동위(북제)와 서위(북주)는 6진 세력과 한인 호족이 섞인 정권이 되었다. 한화 정책에서 소외된 변경 군인의 불만이 북위를 무너뜨린 셈이다. 6진은 본래 평성 둘레의 북쪽 방어선이었으나 뤄양 천도로 도읍에서 멀리 떨어지게 되었다."
  subjects: [northern-wei, rouran]
  tags: [politics, war, society]
  sources: ["『위서』 숙종기·효장기·이주영전·고환전", "『북제서』 신무제기", "『자치통감』 양기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: western-wei-fubing-535
  year: 535
  endYear: 577
  title:
    ko: "서위·북주의 우문태와 부병제(535~577)"
  summary:
    ko: "534년 북위가 갈라진 뒤 서위(535~557)는 땅과 인구가 모두 적은 관중에서 동위와 맞서야 했다. 실권자 우문태는 6진 출신 선비 무장으로서 관중의 한인 호족을 끌어들이는 정책을 펴 힘을 모았다. 한인 학자 소작을 기용해 544년 무렵 6조 조서로 정치 방침을 세우고 뒤에 『주례』를 본뜬 6관제를 정했다(556년). 군사 제도로는 부병제를 발전시켰다. 선비 무장과 관중 한인 호족의 병력을 군부에 편입해 병사를 병호로 정하고 세금을 면제하며 군사 훈련을 시켰고, 6세기 중엽 8주국 12대장군이라는 지휘 체계를 갖추었다. 이렇게 모인 선비와 한인 무장이 섞인 지배층을 관롱 귀족 집단이라 하며 뒤의 북주·수·당을 이끌었다. 우문태가 556년 죽고 이듬해 아들 우문각이 서위 공제의 선양을 받아 북주(557~581)를 세웠다. 서위의 문제·폐제·공제와 북주 초의 효민제 우문각, 명제 우문육을 거쳐 즉위한 무제 우문옹은 572년 권신 우문호를 제거하고 친정을 시작했다. 574년 불교와 도교를 금하고 사원과 재산을 거두어 국고를 채웠으며, 같은 무렵 부병에 한인 농민도 넣어 병력을 늘렸다. 577년 북제를 멸하고 화북을 통일했다(뒤의 사건 「북주의 화북 통일과 수의 건국」). 서위와 북주가 쌓은 군사·행정 제도는 수·당의 부병제와 관제의 바탕이 되었다. 8주국에는 우문태 자신과 이호(당 고조 이연의 할아버지), 독고신(수 문제의 장인) 같은 인물이 들어 있어 이 집단이 수·당 왕실의 뿌리가 되었음을 보여 준다. 서위는 553년 쓰촨, 554년 양의 강릉을 차지해 영토를 넓혔다(뒤의 사건 「후경의 난과 양의 몰락(547~554)」). 소작의 6조 조서는 마음을 다스리고, 교화를 두텁게 하고, 땅의 이익을 다하고, 인재를 고르고, 옥사를 살피고, 부역을 고르게 하라는 여섯 조항이었다."
  subjects: [western-wei, northern-zhou, eastern-wei, northern-qi]
  tags: [politics, society]
  sources: ["『주서』 문제기·무제기·소작전", "『북사』 주본기", "『자치통감』 양기·진기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]

- id: hou-jing-547
  year: 547
  endYear: 554
  title:
    ko: "후경의 난과 양의 몰락(547~554)"
  summary:
    ko: "후경은 회삭진 출신 군인으로 고환 밑에서 동위의 하남을 맡았다. 547년 고환이 죽자 후경은 동위에서 이탈해 서위와 양에 투항을 청했다. 양 무제는 후경을 받아들여 하남왕에 봉했으나 양군이 동위군에게 크게 졌고, 쫓긴 후경은 수양을 차지했다. 548년 후경은 양에 반기를 들고 무제의 조카 소정덕을 황제로 세우며 건강을 포위했다. 549년 음력 3월 건강의 궁성 대성이 함락되었고 무제는 5월 굶주림 속에 죽었다. 후경은 간문제 소강을 세웠다가 550년 한왕이 되었고, 551년 가을 간문제를 폐위·살해하고 소동을 세웠다가 그해 말 소동을 폐하고 스스로 황제가 되어 국호를 한(漢)이라 했다. 그는 건강 일대를 약탈했고 굶주림으로 도시가 비었다. 552년 양의 장수 왕승변과 진패선이 건강을 되찾았고 후경은 달아나다 부하에게 죽었다. 같은 해 무제의 일곱째 아들 소역이 강릉에서 즉위했다(원제). 552년 쓰촨에서 무릉왕 소기가 따로 황제를 칭했는데 553년 서위가 쓰촨의 익주를 차지했고, 554년에는 강릉을 함락해 소역을 죽이고 소찰을 세워 서위의 속국 후량(後梁)을 두게 했다(5대의 후량과 다른 나라이다). 양은 창장강 중류와 쓰촨을 잃고 쇠퇴했다. 왕승변과 진패선은 이후 힘을 겨루었고 557년 진패선이 양 경제의 선양을 받아 진(陳)을 세웠다(앞의 사건 「북위의 분열과 동위·서위, 북제·북주의 성립」). 후경은 오른쪽 다리가 짧아 말 타고 활쏘기에 불편했으나 지략이 있었다고 한다. 『양서』는 건강 성이 닫힐 때 10만여 명이던 사람이 포위가 길어지며 열에 여덟아홉이 죽어 성을 지키는 이가 수천 명의 쇠약한 병사뿐이었다고 적는다. 무제 말년에는 문벌 귀족이 군사를 멀리하고 사치에 빠져 후경의 반란군에게 속수무책이었다는 평이 있다. 건강이 포위된 동안 양의 종실과 장수들이 구원군을 보냈으나 서로 견제하느라 성을 구하지 못했다."
  subjects: [liang, eastern-wei, western-wei]
  links:
    - { from: western-wei, to: liang, note: "익주(553)와 강릉 함락, 소역의 죽음(554)" }
  tags: [war, politics]
  sources: ["『양서』 무제기·간문제기·원제기·후경전", "『남사』 적신전 후경전", "『자치통감』 양기", "Albert E. Dien·Keith N. Knapp 엮음, The Cambridge History of China, Vol. 2: The Six Dynasties, 220–589 (2019)", "Mark Edward Lewis, China Between Empires: The Northern and Southern Dynasties (2009)"]
