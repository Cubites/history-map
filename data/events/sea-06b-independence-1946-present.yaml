- id: malayan-union-1946
  year: 1946
  endYear: 1948
  title:
    ko: "말라야 연합과 싱가포르 직할 식민지(1946~1948)"
  summary:
    ko: "일본이 항복한 뒤 영국은 말라야를 군정 아래 두었다가 1946년 4월 1일 말라야 연합을 세웠다. 해협 식민지가 이때 해체되어 페낭과 말라카(믈라카)가 연합에 들었고, 페락 술탄국·파항 술탄국·슬랑오르·느그리슴빌란·조호르 술탄국·크다·프를리스·클란탄 술탄국·트렝가누 술탄국의 아홉 말레이 주가 한 총독 아래 묶이는 직할 체제가 되었다. 이는 1945년 말 해럴드 맥마이클이 술탄들에게서 받아 낸 조약이 근거였고, 술탄은 종교와 관습만 맡게 되어 주권을 영국 왕에게 넘기는 셈이었으며, 시민권은 중국계와 인도계에게도 넓게 열려 있었다. 싱가포르는 연합에 넣지 않고 따로 직할 식민지로 두었고, 같은 해 7월에는 브룩 가문이 다스리던 사라왁과 북보르네오 회사가 다스리던 북보르네오도 영국 직할 식민지가 되었다. 말레이인들은 술탄의 지위와 말레이인의 우위가 무너진다며 반발했고, 1946년 5월 온 자파르를 중심으로 통일 말레이 민족 기구(UMNO)가 세워져 큰 항의 운동을 벌였다. 영국은 술탄들과 다시 협의해 1948년 2월 1일 말라야 연합을 말라야 연방으로 바꾸었다. 이 연방은 술탄의 주권적 지위를 되살리고 방위와 외교는 영국 고등판무관이 맡았으며 시민권은 엄격히 제한했는데, 중국계가 반발하는 가운데 지금 말레이시아의 서반도를 이루는 틀이 이어졌다. 싱가포르는 이 연방에 들지 않고 직할 식민지로 남았다. 해협 식민지가 해체될 때 라부안은 북보르네오에, 코코스 제도와 크리스마스섬은 싱가포르에 딸렸고, 연합의 초대 총독 에드워드 젠트는 연방 출범 뒤 초대 고등판무관이 되었으나 1948년 7월 비행기 사고로 숨졌다(「말레이시아의 성립과 싱가포르의 분리(1963~1966)」(뒤의 사건))."
