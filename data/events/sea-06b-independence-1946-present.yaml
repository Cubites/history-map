- id: guided-democracy-1955
  year: 1955
  endYear: 1965
  title:
    ko: "수카르노의 교도 민주주의(1955~1965)"
  summary:
    ko: "1955년 4월 반둥 회의를 연 인도네시아(「네루의 비동맹: 판차실 선언, 반둥 회의, 베오그라드 정상 회의(1954~1961)」(앞의 사건))는 그해 9월 첫 총선을 치렀다. 의회 선거에서 국민당(PNI)과 마슈미 이슬람 정당이 각각 57석, 이슬람 학자 연맹(NU)이 45석, 공산당(PKI)이 39석을 얻어 어느 당도 과반이 아니었고 내각이 자주 무너졌다. 자바 밖 지역은 중앙의 자원 수탈과 군 인사에 불만이 컸고 1956년 12월 부통령 하타가 사임했으며 수마트라에서 군 지휘관들이 자치를 선언한 데 이어 1957년 3월 술라웨시에서 퍼메스타가 일어났다. 수카르노는 1957년 2월 교도 민주주의 구상을 밝히고 3월에 계엄을 선포했으며, 1958년 2월 15일 수마트라 파당에서 인도네시아 공화국 혁명 정부(PRRI)가 선포되었으나 중앙군이 몇 달 안에 거점을 차지하고 1961년까지 반란을 가라앉혔다. 1957년 말에는 네덜란드 기업을 국유화하고 네덜란드인 수만 명을 내보냈다. 1959년 7월 5일 대통령령으로 제헌 의회를 해산하고 1945년 헌법으로 돌아가 대통령에게 권한을 모았으며, 민족주의·종교·공산주의 세력을 묶는 나사콤 노선을 폈다. 1960년 의회를 해산해 임명제로 바꾸었고 1963년 임시 국민 협의회는 수카르노를 종신 대통령으로 삼았다. 서뉴기니 요구와 말레이시아 반대 정책에 군비를 쏟는 사이 물가는 치솟았고(「말레이시아의 성립과 싱가포르의 분리(1963~1966)」(뒤의 사건)), 1965년 1월 인도네시아는 유엔 탈퇴를 선언했다. 군과 공산당 사이의 균형은 1965년 9월 30일 무너졌다(「9·30 사건과 대학살, 수하르토의 신질서(1965~1968)」(뒤의 사건))."
  subjects: [indonesia]
  links: []
  tags: [politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)", "Herbert Feith, The Decline of Constitutional Democracy in Indonesia (Cornell University Press, 1962)"]

- id: laotian-civil-war-1959
  year: 1959
  endYear: 1975
  title:
    ko: "라오스 내전과 호찌민 통로(1959~1975)"
  summary:
    ko: "라오스 왕국은 1954년 제네바 회의(「디엔비엔푸 전투와 제네바 협정(1954)」(앞의 사건)) 뒤 중립을 지키기로 했으나, 수바나 푸마가 이끄는 중립파와 수파누웡의 파테트 라오(공산 계열), 푸미 노사완이 이끄는 우파 사이의 갈등이 커졌고 1959년부터 무장 충돌이 이어졌다. 1960년 8월 콩 레 대위가 쿠데타를 일으켰고, 소련이 그의 중립 정권에 공수 지원을 하는 사이 우파가 비엔티안을 되찾아 항아리 평원이 전장이 되었다. 1961~1962년 제네바 회의는 1962년 7월 23일 라오스 중립 선언과 수바나 푸마를 총리로 하는 연립 정부를 이끌어 냈으나 이 합의는 곧 깨졌다. 북베트남은 1959년 5월 창설된 제559 수송단이 라오스 동부를 지나는 보급로(호찌민 통로)를 넓혀 남쪽의 해방 세력을 지원했고, 라오스 안에서 파테트 라오를 도왔다. 미국은 중앙 정보국이 몽족 지휘관 방 파오의 부대를 키워 이른바 '비밀 전쟁'을 치렀고, 1964년부터 1973년까지 약 58만 회 출격해 모두 약 200만 톤의 폭탄을 떨어뜨렸는데(국토 넓이에 비해 가장 많이 폭격받은 나라로 꼽힌다), 터지지 않은 불발탄이 지금도 사람을 해친다. 타이도 비밀리에 의용 부대를 보내 미국을 도왔다. 폭발물 사고로 숨진 사람은 2017년 집계로 약 2만 9천 5백 명이고, 내전 전체의 사망은 2만~6만 2천 명으로 추산된다. 1973년 2월 21일 비엔티안 협정으로 휴전하고 1974년 연립 정부가 구성되었으나 1975년 미국이 인도차이나에서 물러나자 파테트 라오가 지방을 차례로 차지했고, 12월 2일 왕 시사방 와타나가 퇴위하여 라오 인민민주공화국이 선포되었다(수파누웡이 대통령, 카이손 폼비한이 총리). 이 싸움은 「통킹만 사건에서 파리 평화 협정까지: 미국의 베트남 전쟁(1964~1973)」(뒤의 사건)과 겹쳐 진행되었다."
  subjects: [laos, vietnam, usa, thailand]
  links:
    - { from: vietnam, to: laos, note: "호찌민 통로 확보와 파테트 라오 지원 (1959~1975)" }
    - { from: usa, to: laos, note: "중앙 정보국의 비밀 전쟁과 폭격 (1964~1973)" }
  tags: [war, politics]
  sources: ["Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "Joshua Kurlantzick, A Great Place to Have a War: America in Laos and the Birth of a Military CIA (Simon & Schuster, 2017)"]

- id: ne-win-1962
  year: 1962
  endYear: 1988
  title:
    ko: "네윈의 쿠데타와 버마식 사회주의(1962~1988)"
  summary:
    ko: "1948년 독립한 버마(「핀롱 협정과 버마의 독립(1947~1948)」(앞의 사건))에서는 우 누 정부가 공산당·카렌 민족 연합 등의 반란에 시달렸다. 총리가 우 누에서 바 스웨(1956~1957), 다시 우 누(1957~1958)로 바뀐 뒤 1958~1960년에는 네윈 장군의 과도 내각이 군 중심으로 나라를 다스렸다. 1960년 총선에서 우 누가 다시 이겼지만 샨 국의 지도자들이 연방 체제를 고치자고 요구하는 움직임이 나오자 네윈은 1962년 3월 2일 쿠데타를 일으켜 우 누와 샨 지도자들을 체포하고 혁명 평의회를 세웠다. 4월 30일 '버마식 사회주의로 가는 길'을 선포하고 7월 4일 버마 사회주의 계획당(BSPP)을 만들었으며, 7월 7일 랑군(지금 양곤) 대학교 학생회관을 폭파하면서 항의하던 학생들이 숨졌다(공식 15명, 다른 추산은 100명 넘게). 은행과 기업, 무역을 국유화하는 과정에서 인도계와 중국계 수십만 명이 나라를 떠났고(추산), 1964년과 1985년, 1987년에는 화폐 일부를 갑자기 무효로 하여 사람들의 저축이 사라졌다. 1974년 헌법은 일당 체제의 버마 사회주의 공화국을 세웠고 네윈이 대통령이 되었다가 1981년 산 유에게 대통령 자리를 넘기고 당 의장으로 남았다. 1982년 시민권법은 '토착 민족'으로 인정한 집단만 완전한 시민으로 삼아 로힝야는 배제되었다. 소수 민족 무장 단체와 공산당의 반란은 국경 지대에서 이어졌고 경제는 아시아의 가난한 나라로 떨어졌다. 1987년 9월 화폐 무효 조치가 학생과 시민의 불만을 키웠고 네윈은 1988년 7월 당 의장에서 물러났다(「8888 민주화 운동과 국호 미얀마(1988~1990)」(뒤의 사건)). 이 나라의 국호는 1989년 미얀마로 바뀌었다."
  subjects: [myanmar]
  links: []
  tags: [politics, economy]
  sources: ["Robert H. Taylor, General Ne Win: A Political Biography (Institute of Southeast Asian Studies, 2015)", "Martin Smith, Burma: Insurgency and the Politics of Ethnicity (Zed Books, 1991)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)"]

- id: west-new-guinea-1961
  year: 1961
  endYear: 1969
  title:
    ko: "서뉴기니 분쟁과 뉴욕 협정(1961~1969)"
  summary:
    ko: "1949년 헤이그 원탁 회의(「헤이그 원탁 회의와 인도네시아 주권 이양(1949)」(앞의 사건))에서 네덜란드는 뉴기니섬 서쪽 절반을 인도네시아에 넘기지 않고 남겨, 이후 이 땅의 처리를 두고 두 나라가 맞섰다. 네덜란드는 파푸아 사람들이 인도네시아 사람과 다른 민족이라며 독립을 준비시켜 1961년 4월 뉴기니 평의회를 열고 12월 1일 샛별 깃발을 올렸다. 인도네시아는 네덜란드령 동인도의 옛 영토 전체가 자기 몫이라고 주장하며 1961년 12월 19일 수카르노의 '트리코라(3대 인민 명령)'로 군사 행동을 선언하고 1962년 낙하산 부대 등을 들여보냈다. 그해 1월 15일 아라푸라 바다에서는 인도네시아 어뢰정이 침몰하고 지휘관 요스 수다르소 준장이 숨졌다. 미국은 인도네시아가 소련 쪽으로 기울 것을 걱정해 엘즈워스 벙커의 중재안을 냈고, 1962년 8월 15일 뉴욕에서 네덜란드와 인도네시아가 협정에 서명했다. 이에 따라 10월 1일 유엔 임시 행정청(UNTEA)이 행정을 넘겨받았다가 1963년 5월 1일 인도네시아에 넘겼고, 인도네시아는 1969년까지 주민 의사를 묻겠다고 약속했다. 1969년 7~8월의 '자유 선택법'은 투표 대신 인도네시아 당국이 지역 대표 1,025명을 골라 공개로 의견을 말하게 했는데, 당시 인구는 80만 명 안팎이었고 대표들은 모두 인도네시아 편입에 찬성했다. 유엔 총회는 1969년 11월 19일 이 결과를 보고받고 주목한다는 결의를 반대 없이 채택했다(찬성 84, 기권 30). 파푸아 사람들과 여러 연구자는 이 절차가 공정하지 않았다고 비판하고 인도네시아 정부는 국제 합의를 따랐다고 하며, 1965년 만들어진 자유 파푸아 운동(OPM)을 비롯한 무장 저항도 이어졌다."
  subjects: [netherlands-new-guinea, indonesia, netherlands, usa]
  links:
    - { from: netherlands, to: indonesia, note: "뉴욕 협정으로 유엔 임시 행정을 거쳐 서뉴기니를 넘김 (1962~1963)" }
  tags: [diplomacy, politics]
  sources: ["John Saltford, The United Nations and the Indonesian Takeover of West Papua, 1962–1969 (RoutledgeCurzon, 2003)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)"]

- id: malaysia-formation-1963
  year: 1963
  endYear: 1966
  title:
    ko: "말레이시아의 성립과 싱가포르의 분리(1963~1966)"
  summary:
    ko: "1961년 5월 말라야 연방 총리 툰쿠 압둘 라만이 말라야·싱가포르·북보르네오·사라왁·브루나이를 묶는 '말레이시아' 구상을 내놓았다(「말라야 비상사태와 말라야 연방의 독립(1948~1960)」(앞의 사건)). 영국은 식민지를 평화롭게 넘기려 했고, 말라야는 싱가포르의 좌파 세력과 중국계 인구를 연방 안에서 견제하려는 뜻이 맞았다. 1962년 코볼드 위원회와 유엔 조사단은 보르네오 주민 상당수가 가입을 받아들인다고 보고했다. 그러나 1962년 12월 브루나이에서 A. M. 아자하리가 이끈 인민당이 봉기했다가 영국군에 진압되었고, 브루나이 술탄 오마르 알리 사이푸딘 3세는 석유 수입 분배와 서열 문제로 끝내 가입하지 않았다. 1963년 9월 16일 말레이시아가 성립하여 말라야 연방, 싱가포르, 영국 직할 식민지이던 사라왁과 북보르네오(사바로 이름을 바꿈)가 한 연방이 되었다. 인도네시아의 수카르노는 이를 영국이 만든 신식민주의 계획이라 불러 1963년 1월부터 '대결 정책'을 선언하고 게릴라를 말레이시아에 침투시켰으며, 필리핀은 술루 술탄의 상속인 주장을 근거로 사바 동부에 대한 권리를 내세워(말레이시아는 1878년 문서를 임대가 아닌 양도로 보며 거부한다) 한때 외교를 끊었다. 영국·오스트레일리아·뉴질랜드 군이 말레이시아를 도왔다. 연방 안에서는 리콴유의 인민 행동당과 말레이인 중심의 연맹 사이에 인종 정책 갈등이 깊어져 1964년 싱가포르에서 인종 폭동이 일어났고, 1965년 8월 9일 말레이시아 의회가 싱가포르 분리를 표결로 처리하여 싱가포르는 독립했다. 1965년 9·30 사건 뒤 수하르토가 힘을 얻으면서 1966년 8월 11일 방콕 협정으로 대결 정책이 끝났다."
  subjects: [malaysia, singapore, sarawak, north-borneo, brunei, indonesia, philippines, uk]
