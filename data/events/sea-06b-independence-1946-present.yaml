- id: indonesian-revolution-1946
  year: 1946
  endYear: 1949
  title:
    ko: "인도네시아 독립 전쟁(1946~1949)"
  summary:
    ko: "1945년 8월 17일 선언한 공화국(「인도네시아 독립 선언(1945)」(앞의 사건))을 네덜란드는 인정하지 않고 네덜란드령 동인도를 되찾으려 했으며, 영국군이 일본군 무장 해제를 맡아 들어온 뒤 네덜란드군이 돌아와 도시와 농원 지대를 다시 차지했다. 공화국은 수도를 자카르타에서 욕야카르타로 옮겼고, 1946년 11월 링가자티에서 합의안에 가서명하고 1947년 3월 25일 정식 서명했다. 이 협정은 네덜란드가 자바·마두라·수마트라에 대한 공화국의 사실상 통치를 인정하고 인도네시아 연방 공화국을 세운다는 것이었으나 해석이 엇갈려 곧 깨졌다. 네덜란드는 1947년 7월 21일 '경찰 행동'(제1차 군사 행동, 작전명 프로덕트)을 벌여 수마트라와 자바의 농원·항구 지대를 차지했고, 유엔 안전 보장 이사회의 휴전 결의로 8월 초에 멈췄다. 1948년 1월 17일 미국 군함 렌빌호에서 맺은 렌빌 협정은 네덜란드가 그은 점령선(반 무크선)을 휴전선으로 삼아 공화국이 자바 서부와 동부의 땅을 잃게 했다. 1948년 9월에는 공산당 계열이 마디운에서 봉기했으나 공화국군이 진압했고, 이는 공화국이 미국의 신뢰를 얻는 계기가 되었다. 네덜란드는 1948년 12월 19일 제2차 '경찰 행동'(작전명 크라이)으로 욕야카르타를 차지하고 수카르노와 하타 등을 붙잡았지만, 수마트라에 임시 정부가 세워지고 수디르만 장군의 유격전이 이어졌으며 1949년 3월 1일 욕야카르타 총공세 같은 반격이 있었다. 미국이 마셜 원조를 끊겠다고 압박하고 유엔이 철수를 요구하면서 1949년 5월 7일 룸–판 로이옌 합의로 네덜란드군이 물러나고 공화국 지도자들이 돌아왔다. 인도네시아 쪽 사망자는 확인된 것만 약 10만 명에 가깝고 추산으로는 25만 명까지 갈리며, 네덜란드군 사망은 5천 명 안팎에서 1만 5천 명까지 나뉜다. 이 싸움은 「인도의 독립과 탈식민지화의 시작」(뒤의 사건)이 다룬 탈식민지화 흐름의 한 갈래였고, 「헤이그 원탁 회의와 인도네시아 주권 이양(1949)」(뒤의 사건)으로 매듭지어졌다."
  subjects: [indonesia, dutch-east-indies, netherlands, usa]
  links:
