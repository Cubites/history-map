  tags: [politics, society]
  sources: ["Thant Myint-U, The Hidden History of Burma: Race, Capitalism, and the Crisis of Democracy in the 21st Century (W. W. Norton, 2019)", "Francis Wade, Myanmar's Enemy Within: Buddhist Violence and the Making of a Muslim 'Other' (Zed Books, 2017)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)"]
