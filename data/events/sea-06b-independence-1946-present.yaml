# 동남아시아 사건 6b차 묶음(se-06b): 독립 전쟁과 냉전, 민주화 — 프랑스령 인도차이나·필리핀·말라야·인도네시아·버마·동티모르 (1946 ~ 2021년)
# 범위: 제1차 인도차이나 전쟁과 프랑스 연합·필리핀의 독립과 후크발라합 봉기·말라야 연합과 말라야 비상사태·인도네시아 독립 전쟁과 헤이그 원탁 회의·버마의 독립·라오스와 캄보디아의 독립·디엔비엔푸와 제네바 협정·수카르노의 교도 민주주의·
#   서뉴기니 분쟁·말레이시아의 성립과 싱가포르의 분리·베트남 전쟁·9·30 사건과 수하르토의 신질서·아세안·론 놀의 쿠데타·마르코스의 계엄령과 에드사 혁명·타이의 1973년 항쟁과 1976년 10월 6일·동티모르 침공과 병합·사이공 함락과 베트남 통일·
#   크메르 루주·아체 분쟁·베트남의 캄보디아 침공·도이머이·8888 민주화 운동·아시아 금융 위기·동티모르 주민 투표·미얀마의 개혁과 로힝야 위기와 2021년 쿠데타.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 한 나라의 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력이다. 불기·자와력·히즈라력은 쓰지 않았다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 버마는 1989년 앞 '버마', 뒤 '미얀마'(국호 변경 설명 한 번만 병기), 시암은 1939년 앞 '시암', 뒤 '타이'다. 도시는 그때 이름으로 적고 처음 한 번 지금 이름을 괄호로 붙였다
#   (랑군→양곤, 사이공→호찌민시). 베트남 인명은 성조 없이 띄어 쓴다(응우옌 반 티에우 등, 저장소 기존 08 파일 꼴인 '응오딘지엠'만 붙여 쓴다).
#   사망자·난민·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다. 남중국해, 사바, 동티모르, 서뉴기니, 로힝야, 크메르 루주, 9·30 사건, 1976년 10월 6일, 마르코스 계엄은 일어난 일과 숫자만 적었다.
# 지도 해와의 관계: 일본 점령(1942~1945)은 영토 그대로 두고 점령 관계만 글로 적는다. 이중 정권은 법적 국경을 따른다(인도네시아 1949-12-27, 베트남 1954-07). 서뉴기니는 1962년까지 네덜란드, 1963-05-01 인도네시아,
#   동티모르는 1976~1999년 인도네시아 병합 선언(유엔 불승인)을 글로 밝혔고 1999~2001년 유엔 과도 행정은 글로만 적었다. 캄보디아 1979~1989년 베트남 군 주둔은 점령 관계로 적었다.
# 한국사와 닿는 점: 필리핀의 6·25 전쟁 참전, 베트남 전쟁의 한국군, 1992년 한국–베트남 수교, 외환 위기, 동티모르 상록수 부대. 한국사 파일의 글은 고치지 않고 subjects만 넓힌다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(제네바 회의(1954)와 한국 문제, 베트남의 분단과 베트남 공화국 수립, 베트남 파병과 브라운 각서, 네루의 비동맹, 중월 전쟁과 국경 분쟁, 인도양 지진 해일, 남중국해 분쟁).

- id: french-union-1946
  year: 1946
  endYear: 1950
  title:
    ko: "제1차 인도차이나 전쟁의 시작과 프랑스 연합(1946~1950)"
  summary:
    ko: "1945년 9월 호찌민이 베트남 민주 공화국의 독립을 선언했으나(「8월 혁명과 베트남 민주 공화국의 독립 선언(1945)」(앞의 사건)) 프랑스는 인도차이나를 되찾으려 했다. 1946년 3월 6일 호찌민과 프랑스 대표 장 생트니가 베트남을 프랑스 연합 안의 자유 국가로 인정하고 프랑스군이 북쪽에 들어오는 것을 허락하는 예비 협정을 맺었지만, 6월 프랑스 고등판무관 티에리 다르장리외가 코친차이나 자치 공화국을 세우자 통일 문제로 협상이 막혔고 9월의 잠정 협정도 충돌을 막지 못했다. 11월 하이퐁에서 프랑스군이 함포 사격까지 하며 충돌했고, 12월 19일 베트민이 하노이에서 공격에 나서 전면전이 되었다. 같은 해 10월 공포된 프랑스 제4공화국 헌법은 본국과 식민지를 묶는 프랑스 연합을 규정했다. 프랑스는 1948년 6월 하롱만에서 전 황제 바오다이와 합의했고, 1949년 3월 8일 엘리제 협정으로 바오다이를 수반으로 하는 베트남국을 프랑스 연합 안의 제한된 독립국으로 두었으며, 6월에 코친차이나가 안남·통킹과 함께 이 국가로 합쳐졌다. 라오스는 1949년 7월 19일 프랑스–라오 일반 협약, 캄보디아는 같은 해 11월 8일 조약으로 프랑스 연합 안에서 제한된 독립을 얻었다. 한편 타이는 1941년 도쿄 조약으로 얻은 캄보디아 서북부와 라오스의 두 곳을 1946년 10~11월 프랑스에 돌려주고(11월 17일 워싱턴 협정) 12월 유엔에 가입했다. 1949년 10월 중화인민공화국이 서자 1950년 1월 중국과 소련이 호찌민 정부를 승인했고, 2월에는 미국과 영국이 바오다이의 베트남국을 승인했으며 미국은 그해 프랑스에 군사 원조를 시작했다. 1950년 10월 베트민이 중국 국경의 4번 도로 일대에서 프랑스군을 몰아내 국경 지대를 차지하면서 이 전쟁은 냉전의 한 싸움이 되었다."
