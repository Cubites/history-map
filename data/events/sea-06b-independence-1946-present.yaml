  tags: [war, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)", "Benedict R. O'G. Anderson, Java in a Time of Revolution: Occupation and Resistance, 1944–1946 (Cornell University Press, 1972)", "Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: burma-independence-1947
  year: 1947
  endYear: 1948
  title:
    ko: "핀롱 협정과 버마의 독립(1947~1948)"
  summary:
    ko: "일본이 물러난 버마(「임팔 작전과 버마 탈환(1944~1945)」(앞의 사건))에서는 아웅 산이 이끄는 반파시스트 인민 자유 연맹(AFPFL)이 독립을 요구했고, 1947년 1월 27일 런던에서 맺은 아웅 산–애틀리 협정으로 1년 안 독립과 제헌 의회 선거가 약속되었다. 영국령 버마의 분리(「사야 산 반란과 타킨 운동, 영국령 버마의 분리(1930~1937)」(앞의 사건)) 이후 따로 다스려지던 산악 지대(변경 지역)를 어떻게 합칠지가 문제여서, 2월 12일 핀롱에서 아웅 산과 샨 국·카친·친의 지도자들이 모여 변경 지역이 버마 정부와 함께 독립한다는 데 합의했다(이 날짜는 지금도 연방의 날로 기념한다). 4월 제헌 의회 선거에서 AFPFL이 압승했으나 7월 19일 전 총리 우 소가 보낸 무장 괴한이 임시 정부 회의장에서 아웅 산과 각료 여섯 명 등을 쏘아 죽였고(아웅 산은 만 32세였다), 우 누가 뒤를 이어 10월 17일 누–애틀리 협정으로 독립 절차를 마무리했다. 1947년 헌법은 샨 국과 카레니 국(지금 카야주)이 10년 뒤 연방을 떠날 권리를 갖는다고 정했다. 영국 의회는 1947년 12월 10일 버마 독립법을 통과시켰고, 영국령 버마는 1948년 1월 4일 새벽(점성가가 권한 시각이라고 전한다) 버마 연방(지금 미얀마)으로 독립하여 영연방에 들지 않았고, 사오 슈웨 타익이 초대 대통령, 우 누가 총리가 되었다. 독립 직후 공산당이 무장 봉기에 나섰고 1949년 1월에는 카렌 민족 연합이 봉기해 한때 수도 랑군(지금 양곤) 가까이까지 압박하는 등 내전이 이어졌다. 1947년 헌법은 버마 본토, 샨주, 카친주, 카레니주와 친 특별 구역으로 연방을 짰고, 영국과는 1947년 8월 방위 협정도 맺었다."
  subjects: [british-burma, shan-states, karenni-states, myanmar, uk]
  links:
    - { from: uk, to: myanmar, note: "아웅 산–애틀리 협정과 독립법으로 버마를 독립시킴 (1947~1948)" }
  tags: [politics, diplomacy]
  sources: ["Martin Smith, Burma: Insurgency and the Politics of Ethnicity (Zed Books, 1991)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)", "Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Farrar, Straus and Giroux, 2006)"]

- id: malayan-emergency-1948
  year: 1948
  endYear: 1960
  title:
    ko: "말라야 비상사태와 말라야 연방의 독립(1948~1960)"
  summary:
    ko: "말라야 공산당(MCP)은 일본 점령기 항일 유격대의 중심이었고 전쟁 뒤에는 노동 운동을 이끌었다(「말라야 연합과 싱가포르 직할 식민지(1946~1948)」(앞의 사건)). 1948년 6월 16일 페락의 농원에서 유럽인 농원주 세 사람이 살해되자 영국 식민 당국은 6월 18일 말라야 전역에 비상사태를 선포했고(16~17일에는 페락과 조호르에 먼저 선포), 7월 23일 공산당을 불법화했으며, 총서기 천평은 말라야 민족 해방군(MNLA)을 이끌고 밀림으로 들어갔다. 영국은 1950년 해럴드 브릭스 중장의 계획에 따라 50만 명을 넘는 농촌 주민(대부분 중국계)을 철조망이 둘러친 '신촌'으로 옮겨 유격대의 식량과 정보 공급을 끊었다. 1951년 10월 고등판무관 헨리 거니가 매복 공격으로 숨지고 1952년 1월 제럴드 템플러 장군이 군사와 행정 권한을 함께 쥐었는데, 그 시기 사건 수가 한 달 500건 가까이에서 100건 아래로 줄었다(앞선 정책의 열매라는 평가도 있다). 영국은 정치로도 풀어 1955년 총선에서 툰쿠 압둘 라만이 이끄는 연맹(말레이인·말라야 화교 협회·인도인 의회의 연합)이 52석 가운데 51석을 얻었고, 같은 해 12월 발링 회담에서 천평과 툰쿠가 만났으나 합의하지 못했다. 말라야 연방, 곧 오늘날 말레이시아의 서반도는 1957년 8월 31일 독립했고 툰쿠가 초대 총리가 되었다. 싱가포르는 1959년 자치 정부가 되어 리콴유가 총리를 맡았다. 비상사태는 1960년 7월 31일 공식으로 끝났고, 사망자는 공산 쪽 약 6,700명, 영국·말라야 군경 약 2,800명, 민간인 약 2,500명 등 모두 1만 명이 넘는다. 남은 유격대는 타이 국경으로 물러났다가 1989년 12월 평화 협정으로 무기를 내려놓았다."
  subjects: [malaysia, singapore, uk]
  links:
    - { from: uk, to: malaysia, note: "말라야 연방의 독립을 승인 (1957-08-31)" }
  tags: [war, politics]
  sources: ["Anthony Short, The Communist Insurrection in Malaya, 1948–1960 (Frederick Muller, 1975)", "Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (2nd ed., Palgrave, 2001)", "C. Mary Turnbull, A History of Modern Singapore, 1819–2005 (NUS Press, 2009)"]

- id: round-table-1949
  year: 1949
  title:
    ko: "헤이그 원탁 회의와 인도네시아 주권 이양(1949)"
  summary:
    ko: "네덜란드와 인도네시아 공화국은 1949년 5월 룸–판 로이옌 합의 뒤 8월 23일부터 11월 2일까지 헤이그에서 원탁 회의를 열었는데, 7~8월에는 인도네시아 쪽 대표들이 먼저 모여 입장을 맞추었다(「인도네시아 독립 전쟁(1946~1949)」(앞의 사건)). 합의는 네덜란드가 네덜란드령 동인도의 주권을 인도네시아 연방 공화국에 넘기고, 두 나라가 여왕을 수장으로 하는 네덜란드–인도네시아 연합을 이루며, 인도네시아가 네덜란드령 동인도의 채무 약 43억 길더를 떠안고 네덜란드인의 경제적 이권을 보호한다는 것이었다. 연방 공화국은 공화국과 네덜란드가 세운 나라들을 포함한 16개 구성체로 이루어졌다. 서뉴기니 문제는 누가 주권을 갖는지 적지 못한 채 네덜란드령 뉴기니로 네덜란드 통치에 남기고 1년 안에 협상하기로 했으며, 이 문제는 「서뉴기니 분쟁과 뉴욕 협정(1961~1969)」(뒤의 사건)으로 이어졌다. 1949년 12월 27일 암스테르담에서는 율리아나 여왕이 주권 이양 문서에 서명하고 하타가 이를 받았으며, 자카르타에서는 네덜란드 고등판무관이 주권을 넘겼다. 수카르노가 12월 17일 연방 공화국의 대통령으로 취임했고 하타가 총리가 되었다. 연방은 네덜란드군 출신 병력의 처리와 지역 반란으로 흔들렸고 구성체들이 차례로 공화국에 합쳐져 1950년 8월 17일 단일 공화국으로 바뀌었고, 왕립 네덜란드령 인도 군대(KNIL)는 1950년 7월 해체되었다. 인도네시아는 1950년 9월 28일 유엔의 60번째 회원국이 되었다. 이 이양은 「인도의 독립과 탈식민지화의 시작」(앞의 사건)에서 시작된 탈식민지화의 한 장면이다. 인도네시아는 1954년 네덜란드–인도네시아 연합을 일방적으로 폐기했고 1956년에는 채무 의무도 깼다."
  subjects: [indonesia, dutch-east-indies, netherlands-new-guinea, netherlands]
  links:
    - { from: netherlands, to: indonesia, note: "헤이그 원탁 회의 합의에 따라 주권을 이양 (1949-12-27)" }
  tags: [diplomacy, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)", "Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: laos-cambodia-independence-1949
  year: 1949
  endYear: 1954
  title:
    ko: "라오스·캄보디아의 독립(1949~1954)"
  summary:
    ko: "프랑스는 베트남국에 이어 라오스와 캄보디아에도 프랑스 연합 안의 제한된 독립을 주는 길을 택했다. 두 나라는 이미 1947년 헌법을 만들어 입헌 군주제와 의회를 두고 있었다(「제1차 인도차이나 전쟁의 시작과 프랑스 연합(1946~1950)」(앞의 사건)). 라오스에서는 1949년 7월 19일 프랑스–라오 일반 협약으로 시사방봉 왕의 라오스 왕국이 연합 안의 독립국이 되었고, 일본 항복 뒤 자유 라오(라오 이사라) 정부를 세웠다가 방콕으로 피한 인사들이 그해 사면을 받아 대부분 돌아왔으나 수파누웡은 베트민과 손잡고 1950년 8월 자유 라오 전선을 꾸려 파테트 라오(라오 땅)로 불린 공산 계열 세력의 중심이 되었다. 캄보디아에서는 1949년 11월 8일 조약으로 같은 지위를 얻었지만 군사와 재정, 사법의 큰 권한은 프랑스가 쥐었다. 1941년 만 18세로 왕이 된 노로돔 시아누크는 1953년 2월부터 해외를 돌며 '독립 십자군'을 벌여 독립을 호소했고, 프랑스는 1953년 가을 군사와 사법 권한을 넘기기로 했으며 캄보디아는 그해 11월 9일을 독립 기념일로 삼았다. 라오스는 1953년 10월 22일 프랑스–라오 우호 결합 조약으로 완전한 독립을 얻었다. 국제 감시 위원회는 제네바 협정에 따라 두 나라에도 들어갔고, 라오스 총리는 1951년부터 1954년까지 중립 성향의 수바나 푸마 왕자였다. 한편 1953년 4월 베트민과 파테트 라오가 라오스 북부로 밀고 들어갔고, 1954년 제네바 회의(「디엔비엔푸 전투와 제네바 협정(1954)」(뒤의 사건))는 두 나라의 중립을 인정하면서 파테트 라오군이 라오스 북동부의 두 성에 모이도록 했다."
  subjects: [laos, cambodia, france]
  links:
    - { from: france, to: cambodia, note: "군사·사법 권한을 넘겨 독립을 인정 (1953)" }
    - { from: france, to: laos, note: "우호 결합 조약으로 완전한 독립을 인정 (1953-10-22)" }
  tags: [politics, diplomacy]
  sources: ["David P. Chandler, A History of Cambodia (4th ed., Westview Press, 2008)", "Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "Fredrik Logevall, Embers of War: The Fall of an Empire and the Making of America's Vietnam (Random House, 2012)"]

- id: dien-bien-phu-geneva-1954
  year: 1954
  title:
    ko: "디엔비엔푸 전투와 제네바 협정(1954)"
  summary:
    ko: "프랑스는 1953년 앙리 나바르 장군의 계획에 따라 라오스 국경 가까운 분지 디엔비엔푸에 큰 기지를 세워 베트민 주력을 끌어내려 했다. 그러나 보 응우옌 잡이 이끄는 베트민은 포를 산 위로 끌어올려 1954년 3월 13일부터 기지를 포위해 공격했고, 5월 7일 사령관 크리스티앙 드 카스트리 장군이 항복했다. 프랑스 연합군은 사망 2천 명 남짓에 포로 약 1만 1천 명을 냈고 베트민 쪽 전사자는 약 8천 명으로 추산된다. 이 패배는 프랑스 국내의 전쟁 반대 여론을 키웠고, 4월 26일 시작된 제네바 회의(「제네바 회의(1954)와 한국 문제」(같은 해의 사건))는 5월 8일부터 인도차이나를 다루었는데, 저우언라이가 이끈 중화인민공화국 대표단도 참석했다. 중국은 고문단과 포, 보급으로 베트민을 도왔다. 6월 18일 총리에 오른 피에르 망데스 프랑스는 한 달 안에 휴전을 약속했고, 7월 20일 휴전 협정이 맺어졌으며 7월 21일 최종 선언이 채택되었다(「베트남의 분단과 베트남 공화국 수립」(뒤의 사건)). 협정은 북위 17도선(벤하이강)을 군사 분계선으로 삼아 북쪽에는 호찌민의 베트남 민주 공화국 군대, 남쪽에는 프랑스 연합군이 모이게 했고, 300일 안에 주민이 원하는 쪽으로 옮길 수 있게 했으며, 최종 선언은 2년 뒤인 1956년 7월 전국 선거로 통일한다고 밝혔다. 미국과 바오다이의 베트남국은 최종 선언에 서명하지 않았다. 라오스와 캄보디아는 중립을 지키기로 했고 인도·캐나다·폴란드로 이루어진 국제 감시 위원회가 이행을 살폈다. 이로써 프랑스령 인도차이나의 옛 코친차이나·안남·통킹에 대한 프랑스의 통치가 끝나고 땅이 17도선 남북으로 갈렸으며, 북쪽에서 남쪽으로 80만~100만 명 안팎, 남쪽에서 북쪽으로 약 10만 명이 옮겨 갔다고 추산한다. 프랑스군은 1954년 10월 하노이를 떠났다."
  subjects: [vietnam, cochinchina, annam-protectorate, tonkin-protectorate, laos, cambodia, france, prc]
