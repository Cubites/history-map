- id: philippine-independence-1946
  year: 1946
  endYear: 1954
  title:
    ko: "필리핀의 독립과 후크발라합 봉기(1946~1954)"
  summary:
    ko: "일본의 점령(「일본의 동남아 점령(1942~1945)」(앞의 사건))을 겪은 필리핀은 1946년 4월 선거에서 마누엘 로하스가 대통령으로 뽑혔고, 1946년 7월 4일 마닐라 조약으로 미국령 필리핀 시기를 마치고 공화국으로 독립했다(「필리핀 연방(커먼웰스)의 출범(1934~1941)」(앞의 사건)). 독립에 앞서 미국이 정한 벨 무역법(1946)은 미국 상품의 무관세 수입을 이어 가고 미국인에게 필리핀 자원 개발의 동등한 권리(평등권)를 주도록 했으며, 필리핀은 이에 맞춰 1947년 헌법을 고치는 국민 투표를 했다. 1947년 3월에는 군사 기지 협정으로 미국이 클라크 공군 기지와 수빅만 해군 기지 등을 99년 동안 쓰기로 했다. 중부 루손에서는 일본 점령기에 항일 유격대로 싸운 후크발라합(후크단)이 소작 문제를 앞세워 정부와 맞섰고, 1946년 후크단과 가까운 의원들이 의회에서 쫓겨난 뒤 무장 봉기로 번졌다. 로하스가 1948년 4월 숨지자 부통령 엘피디오 키리노가 이어받았고(1948~1953), 1948년 사면령이 실패한 뒤 후크단은 1950년 이름을 인민 해방군으로 바꾸고 마닐라 가까이까지 세력을 넓혔다. 1950년 9월 국방 장관이 된 라몬 막사이사이는 미국의 도움을 받아 군을 개혁하고 투항자에게 땅을 주는 정책을 함께 써서 후크단의 힘을 줄였고, 1953년 대통령이 되었다. 1954년 5월 지도자 루이스 타룩이 투항하면서 봉기는 큰 줄기를 마쳤다. 독립 기념일은 7월 4일이 미국의 독립 기념일과 같아, 1962년 마카파갈 대통령이 1898년 독립 선언일인 6월 12일로 옮겼다. 한편 필리핀은 1950년 6·25 전쟁이 일어나자 9월부터 보병 대대 등을 보내 연인원 약 7천 4백 명이 대한민국을 도왔다."
