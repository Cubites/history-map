- id: vietnam-war-1964
  year: 1964
  endYear: 1973
  title:
    ko: "통킹만 사건에서 파리 평화 협정까지: 미국의 베트남 전쟁(1964~1973)"
  summary:
    ko: "1964년 8월 2일과 4일 북베트남 어뢰정과 미국 구축함이 통킹만에서 부딪쳤다는 발표를 근거로 미국 의회는 8월 7일 통킹만 결의로 대통령의 군사 권한을 넓혔다(4일의 두 번째 공격은 뒤에 불분명하다고 밝혀졌다). 1965년 3월부터 북베트남 폭격(롤링 선더 작전)이 시작되고 3월 8일 해병대가 다낭에 상륙하여 미군은 1969년 54만 명 가까이로 늘었다. 대한민국은 1964년 의료단·태권도 교관단을 보낸 데 이어 1965년부터 전투 부대를 보냈고(「베트남 파병과 브라운 각서」(앞의 사건)), 연인원 약 32만 명이 싸워 5,099명이 전사했다. 베트남 공화국(남베트남)은 1963년 응오딘지엠 정권이 무너진 뒤 쿠데타가 이어지다 1967년 응우옌 반 티에우가 대통령이 되었고, 남쪽의 민족 해방 전선과 북베트남군은 호찌민 통로로 병력을 보냈다. 1968년 1월 30~31일 구정 공세는 남쪽 도시 수십 곳을 동시에 공격해 군사로는 실패했으나 미국 여론을 흔들었고, 3월에는 미라이 마을에서 미군이 비무장 주민 수백 명을 죽였다. 린든 존슨은 3월 31일 재선 불출마를 밝혔고 5월 파리에서 협상이 시작됐다. 닉슨은 '베트남화'로 미군을 줄이면서 1970년 캄보디아, 1971년 라오스로 싸움을 넓혔고 1972년 12월에는 하노이와 하이퐁을 폭격했다. 1973년 1월 27일 파리 평화 협정이 미국·북베트남·베트남 공화국·남베트남 임시 혁명 정부 사이에 맺어졌고 미군은 3월 29일 철수를 마쳤다. 협정 뒤에도 남북의 전투는 이어졌다(「사이공 함락과 베트남 통일(1975~1976)」(뒤의 사건)). 사망자는 미군 약 5만 8천 명이고, 베트남 쪽은 인구학 연구의 79만~114만 명에서 베트남 정부 발표(군인 약 110만 명, 민간인 약 200만 명)까지 크게 갈린다."
  subjects: [vietnam, south-vietnam, usa, rok]
  links:
    - { from: usa, to: south-vietnam, note: "지상군 파병과 군사 개입 (1965)" }
    - { from: rok, to: south-vietnam, note: "전투 부대 파병 (1965~1973)" }
  tags: [war, diplomacy]
  sources: ["George C. Herring, America's Longest War: The United States and Vietnam, 1950–1975 (4th ed., McGraw-Hill, 2002)", "Stanley Karnow, Vietnam: A History (Viking, 1983)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]

- id: g30s-suharto-1965
  year: 1965
  endYear: 1968
  title:
    ko: "9·30 사건과 대학살, 수하르토의 신질서(1965~1968)"
  summary:
    ko: "1965년 9월 30일 밤에서 10월 1일 새벽 사이 대통령 근위대 소속 운퉁 중령이 이끄는 '9·30 운동'이 인도네시아 육군 장군 여섯 명을 납치해 죽이고(국방 장관 나수티온은 탈출했으나 어린 딸이 숨졌다) 자신들이 수카르노를 지키려는 것이라고 밝혔다. 육군 전략 예비군 사령관 수하르토 소장은 하루 만에 자카르타를 장악하고 이 일을 공산당(PKI)의 음모라고 규정했다. 책임을 둘러싼 해석은 지금도 갈려 공산당 지도부 일부와 군 일부가 관여했다는 설, 수하르토의 개입설 등이 겨룬다. 이어 10월부터 1966년 초까지 육군이 부추기거나 지휘하고 민병대와 이슬람 단체가 가담한 대학살이 자바·발리·수마트라 등지에서 일어나 공산당원과 지지자로 몰린 사람들(중국계도 피해를 입었다)이 살해되었고, 가장 널리 인용되는 사망 추산은 50만~100만 명이며 이보다 낮거나 높은 추산도 있다. 수십만 명이 구금되었고 부루섬 같은 곳에 유배된 사람도 있다. 1966년 3월 11일 수카르노는 '3월 11일 명령서(수페르세마르)'로 수하르토에게 질서 회복의 권한을 넘겼고 수하르토는 곧 공산당을 금지했다. 1967년 3월 임시 국민 협의회가 수카르노의 권한을 박탈하고 수하르토를 대통령 직무 대행으로 정했으며, 1968년 3월 정식 대통령이 되었다(「수카르노의 교도 민주주의(1955~1965)」(앞의 사건)). 수하르토는 '신질서'라 부른 체제를 세워 군과 관료 중심으로 나라를 다스리고 서방 경제 자문가들의 도움으로 경제를 안정시켰으며 말레이시아와의 대결도 끝냈다(「말레이시아의 성립과 싱가포르의 분리(1963~1966)」). 이 체제는 1998년까지 이어졌다."
  subjects: [indonesia]
  links: []
  tags: [politics, society]
  sources: ["John Roosa, Pretext for Mass Murder: The September 30th Movement and Suharto's Coup d'État in Indonesia (University of Wisconsin Press, 2006)", "Geoffrey B. Robinson, The Killing Season: A History of the Indonesian Massacres, 1965–66 (Princeton University Press, 2018)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)"]

- id: asean-1967
  year: 1967
  endYear: 1976
  title:
    ko: "동남아시아 국가 연합(아세안)의 창설(1967~1976)"
  summary:
    ko: "1967년 8월 8일 방콕에서 인도네시아의 아담 말리크, 필리핀의 나르시소 라모스, 싱가포르의 S. 라자라트남, 타이의 타낫 코만 외무 장관과 말레이시아의 부총리 툰 압둘 라작이 방콕 선언에 서명해 동남아시아 국가 연합(ASEAN, 아세안)을 세웠다. 앞서 1961년의 동남아시아 연합(ASA)과 1963년의 마필린도 구상은 말레이시아 문제를 둘러싼 갈등으로 흐지부지되었는데(「말레이시아의 성립과 싱가포르의 분리(1963~1966)」(앞의 사건)), 수하르토가 인도네시아의 대결 정책을 끝내고 이웃과의 화해를 앞세우면서 기틀이 마련되었다. 창설 선언은 경제·사회·문화 협력을 내걸었으나 공산주의가 퍼지는 베트남 전쟁 속에서 회원국이 서로의 내정을 간섭하지 않고 외부 강대국의 개입을 줄이자는 안보 이해도 담고 있었다. 1971년 쿠알라룸푸르에서 동남아시아를 평화·자유·중립 지대로 만들자는 선언을 채택했다. 1975년 베트남에서 공산 세력이 승리하자(「사이공 함락과 베트남 통일(1975~1976)」(뒤의 사건)) 1976년 2월 23~24일 인도네시아 발리에서 처음으로 정상 회의를 열어 우호 협력 조약과 아세안 협약 선언에 서명하고 자카르타에 사무국을 두었다. 1976년의 우호 협력 조약은 다른 동남아 나라도 가입할 수 있게 문을 열어 두었다. 창설 뒤 첫 아홉 해 동안은 외무 장관 회의가 가장 중요한 협의 틀이었고 정상 회의는 열리지 않았다. 합의는 '아세안 방식'이라 불리는 만장일치와 내정 불간섭을 원칙으로 삼는다. 이후 브루나이(1984), 베트남(1995), 라오스와 미얀마(1997), 캄보디아(1999)가 가입해 회원이 열 나라가 되었다."
  subjects: [indonesia, malaysia, philippines, singapore, thailand]
  links: []
  tags: [diplomacy, politics]
  sources: ["Amitav Acharya, Constructing a Security Community in Southeast Asia: ASEAN and the Problem of Regional Order (Routledge, 2001)", "Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: lon-nol-1970
  year: 1970
  endYear: 1975
  title:
    ko: "론 놀의 쿠데타와 크메르 공화국(1970~1975)"
  summary:
    ko: "캄보디아는 시아누크가 1955년 왕위를 아버지에게 넘기고 정치에 나서 1960년 국가 원수가 된 뒤 중립을 내세웠고 1965년에는 미국과 외교를 끊었다(「라오스·캄보디아의 독립(1949~1954)」(앞의 사건)). 1960년대 후반 베트남 전쟁이 번지면서 북베트남군과 남쪽의 민족 해방 전선이 동부 국경 지대에 보급 기지를 두었고, 미국은 1969년부터 이곳을 몰래 폭격했다. 쿠데타 직전인 3월 12일 정부는 북베트남군과 민족 해방 전선에 철수를 요구했다. 1970년 3월 18일 시아누크가 소련과 중국을 방문하는 사이 총리 론 놀 장군과 시소왓 시리 마탁 왕자가 국회를 움직여 그를 국가 원수에서 몰아냈다. 시아누크는 베이징에서 크메르 루주와 손잡고 3월 23일 민족 통일 전선의 결성을 선언했고 5월에는 망명 정부를 세웠다. 4월 말 미군과 남베트남군이 캄보디아 동부에 들어갔고(닉슨 대통령이 4월 30일 이를 발표했다), 캄보디아 안에서는 베트남계 주민이 학살되었다. 10월 9일 크메르 공화국이 선포되었고 론 놀은 1971년 뇌졸중을 겪은 뒤에도 1972년 3월 국가 원수에게서 권한을 넘겨받아 대통령이 되었고, 그해 5월 새 헌법이 공포되었다. 정부군은 북베트남군과 크메르 루주에 밀렸고 크메르 루주는 1973년 이후 세력이 빠르게 커졌으며, 미국은 1973년 8월 15일까지 폭격했다. 론 놀은 1975년 4월 1일 나라를 떠났고, 수도 프놈펜은 4월 17일 크메르 루주에 함락되었다(「민주 캄푸치아(크메르 루주)와 집단 학살(1975~1979)」(뒤의 사건)). 이 싸움은 「통킹만 사건에서 파리 평화 협정까지: 미국의 베트남 전쟁(1964~1973)」(같은 때의 사건)과 이어져 있었다."
  subjects: [cambodia, south-vietnam, vietnam, usa]
  links:
    - { from: usa, to: cambodia, note: "국경 지대 침공과 폭격 (1970~1973)" }
    - { from: south-vietnam, to: cambodia, note: "미군과 함께 국경 지대에 진입 (1970-04)" }
  tags: [war, politics]
  sources: ["David P. Chandler, A History of Cambodia (4th ed., Westview Press, 2008)", "Kenton Clymer, The United States and Cambodia, 1969–2000: A Troubled Relationship (RoutledgeCurzon, 2004)", "Ben Kiernan, How Pol Pot Came to Power (Verso, 1985)"]

- id: marcos-edsa-1972
  year: 1972
  endYear: 1986
  title:
    ko: "마르코스의 계엄령과 에드사 혁명(1972~1986)"
  summary:
    ko: "1965년 필리핀 대통령이 된 페르디난드 마르코스는 1969년 재선되었으나 헌법상 3선이 막혀 있었다(「필리핀의 독립과 후크발라합 봉기(1946~1954)」(앞의 사건)). 1972년 9월 21일 포고 1081호로 계엄령을 선포했는데(발표는 23일), 공산당 신인민군(NPA)과 남부 모로 분리 운동에 대한 대응이 구실이었다. 의회는 닫히고 반대파 정치인 베니그노 아키노 2세와 언론인이 구속되었다. 1973년 새 헌법은 시민 회의의 거수 표결로 비준되었다는 논란 속에 대통령 직을 이어 갈 길을 열었고, 마르코스는 1978년부터 총리를 겸했다. 마르코스 정부는 미국의 군사·경제 원조를 받으며 기반 시설을 넓혔으나 가까운 사람들에게 이권을 몰아주는 연고주의와 해외 차입이 커졌고, 역사가 앨프리드 매코이의 집계로는 계엄 기간 약 3,257명이 살해되고 3만 5천 명이 고문을, 7만 명이 불법 구금을 당했다. 1981년 1월 계엄령을 풀었으나 대통령의 포고 권한은 유지되었다. 1983년 8월 21일 미국에서 돌아온 아키노가 마닐라 공항에서 암살되자 불만이 커졌고, 1986년 2월 7일 조기 대선에서 마르코스와 아키노의 아내 코라손 아키노가 맞붙었다. 선관위는 마르코스의 승리를 발표했으나 시민 선거 감시 단체와 가톨릭 교회가 부정을 지적했고, 2월 22일 국방 장관 후안 폰세 엔릴레와 라모스 장군이 군에서 이탈하자 마닐라 대주교 하이메 신 추기경이 방송으로 시민의 지지를 호소하자 시민 수십만 명이 에드사(에피파니오 데 로스 산토스 거리) 일대에 모여 이들을 보호했다. 마르코스는 25일 하와이로 떠났고 코라손 아키노가 대통령이 되었다."
  subjects: [philippines, usa]
  links: []
  tags: [politics]
  sources: ["Alfred W. McCoy, Closer Than Brothers: Manhood at the Philippine Military Academy (Yale University Press, 1999)", "Mark R. Thompson, The Anti-Marcos Struggle: Personalistic Rule and Democratic Transition in the Philippines (Yale University Press, 1995)", "Stanley Karnow, In Our Image: America's Empire in the Philippines (Random House, 1989)"]

- id: thai-october-1973
  year: 1973
  endYear: 1976
  title:
    ko: "타이의 10월 14일 항쟁과 1976년 10월 6일(1973~1976)"
  summary:
    ko: "1932년 입헌 혁명(「시암의 입헌 혁명(1932~1939)」(앞의 사건)) 뒤 타이는 군부가 정치를 쥐는 때가 길었고, 1963년부터 타넘 끼띠카촌 원수가 총리를 맡아 1971년 쿠데타로 헌법을 중지했다. 1973년 6월 람캄행 대학교에서 정부를 풍자한 학생 아홉 명이 퇴학당한 일로 불만이 쌓인 가운데, 10월 6일 헌법 제정을 요구한 인사 13명이 체포되자 학생이 이끄는 시위가 불붙어 10월 13일 방콕에서 수십만 명이 행진했고 14일 경찰의 발포로 공식 집계 사망 77명, 부상 857명이 나왔고 그날 저녁 타넘이 사임했다. 푸미폰 아둔야뎃 국왕이 중재에 나서자 타넘과 부총리 쁘라팟, 타넘의 아들 나롱이 나라를 떠났고, 법학자 산야 탐마삭 탐마삿 대학교 총장이 임시 총리가 되었다. 1974년 10월 7일 새 헌법이 공포되고 1975년 1월 선거가 열렸으나 어느 당도 과반을 얻지 못했고, 쎄니 쁘라못(1975년 2~3월), 그의 동생 쿠끄릿 쁘라못(1975년 3월~1976년 4월), 다시 쎄니(1976년 4월~10월)가 차례로 총리를 맡았으나, 라오스·캄보디아·베트남의 공산화로 안보 불안이 커지고 좌우 대립이 거리의 폭력으로 번졌다(미군은 1976년 7월까지 타이에서 철수했다). 1976년 9월 타넘이 승려가 되어 돌아오자 학생들이 반발해 탐마삿 대학교를 점거했고, 10월 6일 새벽 경찰과 우익 민병대가 대학을 공격해 공식 집계 46명이 숨지고 167명이 다쳤다(비공식 추산은 100명 넘게에서 500명 넘게까지 갈린다). 같은 날 해군 대장 상깟 찰로어루가 군사 쿠데타를 일으켰고 국왕이 임명한 타닌 끄라이위치엔 총리는 강한 반공 정책을 폈다. 학생과 지식인 상당수가 숲으로 가 타이 공산당에 합류했다."
  subjects: [thailand]
  links: []
  tags: [politics, society]
  sources: ["David K. Wyatt, Thailand: A Short History (2nd ed., Yale University Press, 2003)", "Thongchai Winichakul, Moments of Silence: The Unforgetting of the October 6, 1976, Massacre in Bangkok (University of Hawaii Press, 2020)"]

- id: timor-decolonization-1974
  year: 1974
  endYear: 1976
  title:
    ko: "인도네시아의 동티모르 침공과 병합(1974~1976)"
  summary:
    ko: "포르투갈령 티모르는 18세기 초부터 포르투갈이 총독을 두고 다스린 식민지였고, 섬의 서쪽은 네덜란드령 동인도, 곧 지금의 인도네시아였다. 1974년 4월 25일 리스본의 카네이션 혁명 뒤 새 정부가 식민지에서 물러나기로 하자 티모르에서는 포르투갈과 연합을 바라는 티모르 민주 연합(UDT), 즉시 독립을 바라는 동티모르 독립 혁명 전선(프레틸린), 인도네시아 편입을 바라는 아포데티가 생겼다. 1975년 8월 UDT가 쿠데타를 일으키자 프레틸린이 맞서 3주가량 내전이 벌어졌고 포르투갈 총독은 아타우로섬으로 물러났다. 프레틸린이 11월 28일 동티모르 민주 공화국의 독립을 선언했으나 인도네시아는 12월 7일 '로터스 작전'으로 침공해 딜리를 차지했다. 유엔 총회(12월 12일)와 안전 보장 이사회(12월 22일 결의 384)는 인도네시아에 철군을 요구했다. 인도네시아가 세운 임시 정부와 주민 대표 모임이 1976년 5월 31일 편입 문서를 채택했고 7월 17일 동티모르는 인도네시아의 27번째 주가 되었다. 유엔은 이를 인정하지 않고 포르투갈을 시정 국가로 계속 불렀으며 오스트레일리아 등 몇몇 나라만 사실상 인정했다. 점령 기간 사망자는 동티모르 진실 화해 위원회(CAVR)가 1974~1999년 최소 10만 2천 명의 분쟁 관련 사망을 기록했고 점령기 추산이 9만~20만 명으로 갈리는데, 직접 살해되거나 실종된 사람은 약 1만 8천 명 안팎이고 나머지는 굶주림과 병이다. 1977~1978년 인도네시아군의 포위 소탕으로 프레틸린은 크게 약해졌다. 이 문제는 「동티모르 주민 투표와 독립(1999~2002)」(뒤의 사건)으로 이어졌다."
  subjects: [portuguese-timor, indonesia, portugal]
  links:
    - { from: indonesia, to: portuguese-timor, note: "동티모르 침공과 병합 (1975~1976)" }
  tags: [war, politics]
  sources: ["James Dunn, East Timor: A Rough Passage to Independence (3rd ed., Longueville Books, 2003)", "John G. Taylor, East Timor: The Price of Freedom (Zed Books, 1999)", "동티모르 수용·진실·화해 위원회(CAVR), Chega! (2005)"]

- id: fall-of-saigon-1975
  year: 1975
  endYear: 1976
  title:
    ko: "사이공 함락과 베트남 통일(1975~1976)"
  summary:
    ko: "1973년 파리 협정으로 미군이 물러난 뒤(「통킹만 사건에서 파리 평화 협정까지: 미국의 베트남 전쟁(1964~1973)」(앞의 사건)) 북베트남은 1975년 1월 푸억롱성을 차지해 미국이 다시 개입하지 않음을 확인했고 3월 10일 중부 고원의 반메투옷을 공격했다. 베트남 공화국의 응우옌 반 티에우 대통령이 고원에서 철수를 명령하자 군이 무너져 후에(3월 25~26일)와 다낭(3월 29~30일)이 차례로 넘어갔다. 4월 9~21일 쑤언록 전투에서 마지막으로 막은 정부군도 밀리자 티에우는 4월 21일 사임하고 부통령 쩐 반 흐엉이 뒤를 이었다가 4월 28일 즈엉 반 민 장군이 대통령이 되었고, 4월 26일 호찌민 전역이 시작되어 4월 30일 북베트남군의 전차가 사이공의 대통령궁에 들어가자 민이 무조건 항복했다. 미국은 4월 29~30일 '프리퀀트 윈드 작전'으로 미국인과 베트남인 약 7천 명을 헬기로 탈출시켰다. 남쪽에는 남베트남 임시 혁명 정부가 들어섰고, 1976년 4월 25일 전국 총선거를 거쳐 7월 2일 새 국회가 베트남 사회주의 공화국을 선포하여 남북이 한 나라가 되었고 사이공은 호찌민시로 이름이 바뀌었다. 옛 정권의 관리와 군인 수십만 명이 재교육 수용소에 갇혔고 남부의 집단화 정책 뒤 많은 사람이 배로 탈출했는데, 유엔 난민 기구 집계로는 1975~1995년 약 80만 명이 바다를 건너 다른 나라에 닿았다(바다에서 죽은 사람의 수는 추산이 크게 갈린다). 1974년 1월 중국이 파라셀 군도를 차지한 일은 「남중국해 분쟁(1974~2016)」(앞의 사건)에서 다룬다. 같은 해 라오스에서는 12월 2일 라오 인민민주공화국이 세워졌다(「라오스 내전과 호찌민 통로(1959~1975)」(앞의 사건)). 베트남의 통일은 곧 캄보디아와의 충돌로 이어졌다(「베트남의 캄보디아 침공과 캄푸치아 인민 공화국, 1991년 파리 평화 협정(1978~1991)」(뒤의 사건))."
  subjects: [south-vietnam, vietnam, laos, usa]
  links:
    - { from: vietnam, to: south-vietnam, note: "사이공 함락으로 남쪽을 통합 (1975-04-30)" }
  tags: [war, politics]
  sources: ["Stanley Karnow, Vietnam: A History (Viking, 1983)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)", "George C. Herring, America's Longest War: The United States and Vietnam, 1950–1975 (4th ed., McGraw-Hill, 2002)"]

- id: khmer-rouge-1975
  year: 1975
  endYear: 1979
  title:
    ko: "민주 캄푸치아(크메르 루주)와 집단 학살(1975~1979)"
  summary:
    ko: "1975년 4월 17일 크메르 루주(캄푸치아 공산당의 무장 조직)가 프놈펜을 차지하자 곧 도시 주민 수백만 명을 농촌으로 내보냈다(「론 놀의 쿠데타와 크메르 공화국(1970~1975)」(앞의 사건)). 1976년 1월 새 헌법(5일 공포)으로 나라 이름이 민주 캄푸치아가 되었고, 4월 시아누크가 국가 원수에서 물러나자 키우 삼판이 국가 주석, 폴 포트(살롯 사르)가 총리를 맡았으며 누온 체아, 이엥 사리, 손 센 등이 지도부를 이루었다. 지도부는 '앙카(조직)'의 이름으로 화폐와 시장, 사유 재산, 종교, 학교를 없애고 도시 사람을 '새 인민'으로 낮추어 집단 농장에서 강제로 일하게 했다. 극심한 굶주림과 병, 처형으로 사람들이 죽었고, 프놈펜의 중앙 은행 건물은 폭파되었고 쌀 생산은 헥타르당 3톤이라는 목표가 강요되었다. 투올 슬렝(S-21) 수용소에서는 1만 4천~2만 명이 갇혀 몇 사람만 살아남았다. 불교 승려와 참족, 베트남계 주민, 옛 정부 인사 등이 겨냥되었고 당 내부의 숙청도 이어졌다. 전체 사망자는 150만~200만 명(전체 인구의 약 4분의 1 안팎)으로 추산되며 추산마다 범위가 다르다. 베트남과의 국경 충돌이 1977년부터 커졌고 1978년 12월 베트남군이 침공하자 정권은 1979년 1월 무너졌다(「베트남의 캄보디아 침공과 캄푸치아 인민 공화국, 1991년 파리 평화 협정(1978~1991)」(뒤의 사건)). 지도부 일부는 이후에도 타이 국경 근처에서 싸웠으며, 유엔의 지원으로 세워진 캄보디아 특별 재판소(ECCC)는 2014년 누온 체아와 키우 삼판에게 반인도 범죄로 종신형을 선고했고 2018년 두 사람에게 베트남계 주민을 겨냥한 제노사이드 유죄도 선고했다."
  subjects: [cambodia]
  links: []
  tags: [politics, society, war]
  sources: ["Ben Kiernan, The Pol Pot Regime: Race, Power, and Genocide in Cambodia under the Khmer Rouge, 1975–79 (3rd ed., Yale University Press, 2008)", "David P. Chandler, A History of Cambodia (4th ed., Westview Press, 2008)"]

- id: aceh-conflict-1976
  year: 1976
  endYear: 2005
  title:
    ko: "자유 아체 운동과 헬싱키 평화 협정(1976~2005)"
  summary:
    ko: "인도네시아 수마트라섬 북쪽 끝의 아체는 이슬람이 일찍 들어온 곳으로 네덜란드에 맞서 오래 싸운 역사가 있고(「아체 전쟁(1873~1904)」(앞의 사건)), 독립 뒤에도 1953~1959년 다룰 이슬람 반란을 겪은 끝에 1959년 '특별 지역' 지위를 얻었다. 그러나 천연가스와 석유 수입이 자카르타로 가는 데 대한 반발이 컸고, 1976년 12월 4일 하산 디 티로가 피디 산지에서 아체 수마트라 민족 해방 전선(자유 아체 운동, GAM)의 독립을 선언했고, 그는 1979년부터 스웨덴으로 망명해 그곳에서 지도부를 이끌었다. 인도네시아군은 1989~1998년 '군사 작전 지역'을 두고 대규모 진압을 벌여 인권 침해가 널리 보고되었고, 수하르토가 물러난 뒤에도 갈등은 되살아났다. 2001년 특별 자치법으로 샤리아 도입과 수입 배분이 약속되었고, 2002년 12월 9일 제네바에서 적대 행위 중단 합의가 맺어졌으나 2003년 5월 무너지고 계엄이 선포되었다. 2004년 12월 26일 지진 해일로 아체에서만 13만 명이 넘게 숨지거나 실종되자 구호를 위해 접촉이 늘었다(「인도양 지진 해일(2004)」(뒤의 사건)). 핀란드 전 대통령 마르티 아티사리가 이끈 위기 관리 이니셔티브의 중재로 2005년 8월 15일 헬싱키에서 양해 각서에 서명했고, 아체의 지방 정당과 자치, 석유와 가스 수입의 70% 배분이 약속되었으며 GAM은 무장을 풀고 인도네시아군은 철수했다. 유럽 연합과 동남아시아 국가 연합(아세안) 나라들이 감시단을 보냈다. 분쟁의 사망자는 1만 5천 명 안팎으로 추산된다. 2006년 12월 첫 직선제 주지사 선거에서 전 GAM 활동가 이르와디 유수프가 뽑혔다."
  subjects: [indonesia]
  links: []
  tags: [war, politics]
  sources: ["Edward Aspinall, Islam and Nation: Separatist Rebellion in Aceh, Indonesia (Stanford University Press, 2009)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)"]

- id: cambodia-vietnam-1978
  year: 1978
  endYear: 1991
  title:
    ko: "베트남의 캄보디아 침공과 캄푸치아 인민 공화국, 1991년 파리 평화 협정(1978~1991)"
  summary:
    ko: "민주 캄푸치아와 베트남은 1977년부터 국경에서 충돌했고(「민주 캄푸치아(크메르 루주)와 집단 학살(1975~1979)」(앞의 사건)), 1978년 12월 25일 베트남이 캄푸치아 구국 민족 통일 전선과 함께 대규모로 침공해 1979년 1월 7일 프놈펜을 차지했다. 이튿날 헹 삼린을 국가 원수로 하는 캄푸치아 인민 공화국이 세워졌고, 베트남군은 1979년부터 1989년까지 약 10년 동안 캄보디아에 머물며 새 정권을 지원했다(주둔 규모는 15만~20만 명으로 추산). 폴 포트 쪽은 서쪽 타이 국경 지대로 물러났다. 중화인민공화국(중국)은 크메르 루주를 돕고 1979년 2월 베트남을 공격했으며(「중월 전쟁과 국경 분쟁(1979~1991)」(같은 때의 사건)), 타이는 난민과 저항 세력을 받아들이고 아세안과 함께 베트남군의 철수를 요구했다. 미국과 서방, 중국, 아세안은 유엔에서 민주 캄푸치아 대표의 자리를 지지했고, 1982년 6월 시아누크, 손 산, 키우 삼판이 연합 정부를 꾸렸다. 프놈펜에서는 훈 센이 1985년 1월 총리가 되었고 1989년 4월 국호를 캄보디아국으로 바꾸었으며 베트남군은 1989년 9월 철수를 마쳤다. 냉전의 끝이 국제 협상을 열어 1991년 10월 23일 파리에서 캄보디아 평화 협정이 맺어졌고, 유엔 캄보디아 과도 행정기구(UNTAC)가 1992~1993년 선거를 치렀다. 1993년 5월 선거에서 시아누크의 아들 노로돔 라나리드의 푼신펙이 가장 많은 표를 얻었고 같은 해 9월 입헌 군주제의 캄보디아 왕국이 되어 시아누크가 다시 왕위에 올랐다. 베트남 쪽 전사자는 1만 5천~2만 5천 명으로 추산된다."
  subjects: [cambodia, vietnam, thailand, prc]
  links:
    - { from: vietnam, to: cambodia, note: "프놈펜 점령과 군 주둔 (1979~1989)" }
  tags: [war, diplomacy]
  sources: ["David P. Chandler, A History of Cambodia (4th ed., Westview Press, 2008)", "Ben Kiernan, The Pol Pot Regime: Race, Power, and Genocide in Cambodia under the Khmer Rouge, 1975–79 (3rd ed., Yale University Press, 2008)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]

- id: doi-moi-1986
  year: 1986
  endYear: 1995
  title:
    ko: "도이머이와 베트남의 개방(1986~1995)"
  summary:
    ko: "1975년 통일 뒤 베트남은 남부 집단화와 계획 경제를 서둘렀으나(「사이공 함락과 베트남 통일(1975~1976)」(앞의 사건)) 식량 부족과 높은 물가, 캄보디아 주둔과 서방의 경제 제재, 중국과의 갈등이 겹쳐 극심한 침체에 빠졌다. 1986년 7월 레 주언(1960~1986년 서기장)이 죽자 쯔엉 찐이 잠시 서기장을 맡았고, 12월 열린 제6차 공산당 대회에서 응우옌 반 린이 서기장이 되어 '도이머이(쇄신)' 노선을 선포했다. 이는 정치 체제는 그대로 두고 경제에 시장 원리를 들이는 것으로, 1987년 외국인 투자법, 1988년 가구 단위 농사를 인정한 당 정치국 결의 제10호, 1989년 물가 자유화로 이어졌다. 쌀을 들여오던 나라가 1989년부터 수출국이 되었다. 응우옌 반 린은 당 기관지에 '지금 해야 할 일'이라는 칼럼을 연재해 낡은 관행을 비판했다. 1993년 토지법은 농민에게 땅 사용권의 거래와 상속을 인정했고, 1990년대 초 연 경제 성장률은 8%대를 이어 갔다. 1989~1991년 소련과 동유럽 사회주의가 무너지자 베트남은 1991년 중국과 관계를 정상화했고(「베트남의 캄보디아 침공과 캄푸치아 인민 공화국, 1991년 파리 평화 협정(1978~1991)」(같은 때의 사건)), 도 므어이가 1991년 서기장이 되었으며 1992년 새 헌법으로 사유 재산을 인정했다. 대한민국과는 1992년 12월 22일 수교했고, 미국은 1994년 2월 대베트남 금수를 풀었으며 1995년 7월 11일 국교를 맺었다. 베트남은 1995년 7월 28일 아세안에 가입했다. 이후에도 공산당 일당 체제는 이어졌고 관료 부패와 소득 격차, 국영 기업 문제가 숙제로 남았다."
  subjects: [vietnam, usa, rok]
  links:
    - { from: usa, to: vietnam, note: "금수 해제와 국교 정상화 (1994~1995)" }
  tags: [economy, politics, diplomacy]
  sources: ["Martin Gainsborough, Vietnam: Rethinking the State (Zed Books, 2010)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)", "Benedict J. Tria Kerkvliet, The Power of Everyday Politics: How Vietnamese Peasants Transformed National Policy (Cornell University Press, 2005)"]

- id: myanmar-8888-1988
  year: 1988
  endYear: 1990
  title:
    ko: "8888 민주화 운동과 국호 미얀마(1988~1990)"
  summary:
    ko: "네윈 체제의 경제 실패와 1987년 9월 화폐 무효화로 불만이 커지던 버마(「네윈의 쿠데타와 버마식 사회주의(1962~1988)」(앞의 사건))에서 1988년 3월 학생과 경찰의 충돌로 학생이 숨지며 시위가 번졌다. 7월 네윈이 '군이 쏘면 겨누어 쏜다'고 경고하며 당 의장에서 물러나고 후임 세인 르윈이 시위를 강하게 누르자 8월 8일(8888) 전국 총파업과 시위가 일어났고, 군이 발포해 많은 사람이 죽었다. 세인 르윈이 물러난 뒤 마웅 마웅(8월 19일~9월 18일)이 짧게 대통령을 지냈지만 시위가 멈추지 않자 9월 18일 소 마웅 장군이 쿠데타로 국가 법질서 회복 위원회를 세웠다. 이 과정에서 숨진 사람은 정부 발표 약 350명, 다른 추산은 3천 명 넘게로 갈린다. 1988년 4월 어머니를 돌보러 돌아온 아웅 산(「핀롱 협정과 버마의 독립(1947~1948)」(앞의 사건))의 딸 아웅산 수찌는 8월 26일 쉐다곤 파고다 앞 연설로 민주화 운동의 얼굴이 되어 9월 27일 민족 민주 동맹(NLD)을 만들었고, 시위대 수천 명은 국경 지대로 피신해 학생 전선(ABSDF)을 꾸렸다. 군정은 다당제 총선을 약속하는 한편 1989년 6월 18일 영어 국호를 'Union of Myanmar'로 바꾸고 랑군을 양곤으로 고쳤으며(이후의 이야기에서는 미얀마라 쓴다), 7월 수찌를 가택 연금했다. 1990년 5월 27일 총선에서 NLD가 485석 가운데 392석을 얻었으나 군정은 권력을 넘기지 않았다. 수찌는 1991년 노벨 평화상을 받았고 모두 15년 가까이 연금되었다. 소 마웅은 1992년 탄 슈웨 장군에게 자리를 넘겼다."
  subjects: [myanmar]
  links: []
  tags: [politics, society]
  sources: ["Martin Smith, Burma: Insurgency and the Politics of Ethnicity (Zed Books, 1991)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)", "Thant Myint-U, The Hidden History of Burma: Race, Capitalism, and the Crisis of Democracy in the 21st Century (W. W. Norton, 2019)"]

- id: asian-financial-crisis-1997
  year: 1997
  endYear: 1998
  title:
    ko: "아시아 금융 위기와 수하르토의 사퇴(1997~1998)"
  summary:
    ko: "1997년 7월 2일 타이 정부가 바트화를 달러에 묶어 두던 제도를 포기하고 변동 환율제로 옮기자 바트화 가치가 달러당 25바트 안팎에서 1998년 1월 50바트대까지 떨어졌고, 외환 위기가 이웃으로 번졌다. 타이 정부는 8월 5일 금융 회사 42곳의 영업을 정지시켰고, 위기의 원인으로는 단기 외채 의존과 고정 환율, 부실 은행이 꼽힌다. 타이는 8월 국제 통화 기금(IMF)과 약 172억 달러 지원 합의를 했고 짜왈릿 총리가 11월 물러났다. 인도네시아의 루피아는 1997년 말부터 1998년 초까지 달러당 2,400 루피아대에서 한때 1만 6천 루피아 안팎까지 떨어졌고 10월 말 IMF와 약 430억 달러 지원 합의를 맺었다. 대한민국도 11월 21일 IMF에 구제 금융을 신청해 12월 3일 약 570억 달러 지원 합의를 맺었다. 말레이시아는 IMF 지원을 받지 않고 1998년 9월 마하티르 총리가 자본 이동을 통제하고 링깃을 고정했으며, 필리핀은 상대적으로 충격이 작았다. 1998년 경제 성장률은 인도네시아 약 -13%, 타이 약 -10%로 크게 꺾였다. 인도네시아에서는 물가가 오르고 일자리가 줄어 1998년 5월 시위가 폭동으로 번졌는데, 12일 자카르타 트리삭티 대학교 학생 네 명이 총에 맞아 숨졌고 13~15일에는 중국계를 겨냥한 약탈과 폭력으로 큰 피해가 났다. 수하르토 대통령은 5월 21일 사임했고 부통령 하비비가 뒤를 이었다(「9·30 사건과 대학살, 수하르토의 신질서(1965~1968)」(앞의 사건)). 인도네시아 경제는 1999년에야 다시 플러스 성장으로 돌아섰다. 이 위기는 아시아 나라들이 외환 보유고를 쌓고 환율 제도를 바꾸게 한 계기가 되었다."
  subjects: [thailand, indonesia, malaysia, philippines, rok]
  links: []
  tags: [economy, politics]
  sources: ["Paul Blustein, The Chastening: Inside the Crisis That Rocked the Global Financial System and Humbled the IMF (PublicAffairs, 2001)", "Stephan Haggard, The Political Economy of the Asian Financial Crisis (Institute for International Economics, 2000)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (3rd ed., Palgrave, 2001)"]

- id: east-timor-referendum-1999
  year: 1999
  endYear: 2002
  title:
    ko: "동티모르 주민 투표와 독립(1999~2002)"
  summary:
    ko: "1998년 수하르토가 물러나고(「아시아 금융 위기와 수하르토의 사퇴(1997~1998)」(앞의 사건)) 대통령이 된 하비비는 1999년 1월 동티모르에 특별 자치를 줄지 독립을 선택할지 묻겠다고 밝혔고, 5월 5일 인도네시아·포르투갈·유엔이 뉴욕에서 주민 투표 협정에 서명했다. 1999년 8월 30일 유엔 동티모르 임무단이 맡은 투표에서 등록 유권자의 98.6%가 참여했고 투표는 원래 8월 8일로 잡혔다가 미루어졌고, 9월 4일 발표된 결과는 78.5%가 특별 자치를 거부해 독립을 택한 것이었다. 투표 전 석 달 동안 민병대가 유엔 요원과 독립파를 위협했고, 결과가 나온 뒤에는 인도네시아군이 뒷받침한 민병대가 학살과 방화를 벌여 딜리 기반 시설의 약 80%가 파괴되었고, 민간인 약 1,400명이 숨졌으며 20만 명 넘게 서티모르로 끌려갔다(추산). 9월 15일 유엔 안전 보장 이사회 결의 1264로 오스트레일리아가 이끄는 다국적군이 20일 딜리에 들어가 질서를 되찾았고, 대한민국도 10월 상록수 부대를 보냈다. 인도네시아 국민 협의회는 10월 19일 병합을 폐기했고 10월 25일 유엔 동티모르 과도 행정부가 세워져 2002년까지 행정을 맡았다(대표 세르지우 비에이라 지 멜루). 2001년 8월 30일 제헌 의회 선거에서 프레틸린이 88석 가운데 55석을 얻었고, 2002년 4월 14일 독립운동 지도자 사나나 구스망이 대통령으로 뽑혔고, 5월 20일 동티모르가 독립했고, 과도 행정부의 일은 유엔 동티모르 지원단(UNMISET)이 이어받아 2005년까지 남았다. 총리는 마리 알카티리가 맡았다. 이 사건은 「인도네시아의 동티모르 침공과 병합(1974~1976)」(앞의 사건)의 매듭이다."
  subjects: [indonesia, east-timor, portugal, rok]
  links:
    - { from: indonesia, to: east-timor, note: "주민 투표 결과를 받아들여 병합을 폐기 (1999-10-19)" }
  tags: [politics, diplomacy]
  sources: ["James Dunn, East Timor: A Rough Passage to Independence (3rd ed., Longueville Books, 2003)", "John G. Taylor, East Timor: The Price of Freedom (Zed Books, 1999)", "동티모르 수용·진실·화해 위원회(CAVR), Chega! (2005)"]

- id: myanmar-crisis-2008
  year: 2008
  endYear: 2021
  title:
    ko: "사이클론 나르기스에서 2021년 군사 쿠데타까지(2008~2021)"
  summary:
    ko: "2008년 5월 2~3일 사이클론 나르기스가 이라와디 삼각주를 덮쳐 사망·실종 약 13만 8천 명(사망 약 8만 5천, 실종 약 5만 4천)이라는 집계가 나왔다. 군정은 외국 구호의 입국을 제한했고, 그 와중에 5월 10일 군부의 권한을 보장한 새 헌법 국민 투표를 강행해 92%의 찬성을 발표했다(「8888 민주화 운동과 국호 미얀마(1988~1990)」(앞의 사건)). 2010년 11월 총선(NLD 불참)을 치른 뒤 아웅산 수찌가 풀려났고, 2011년 3월 퇴역 장군 테인 세인이 대통령이 되어 정치범 석방, 검열 완화, 소수 민족 무장 조직과의 휴전 같은 개혁을 폈다. 2012년 보궐 선거에서 NLD가 45석 가운데 43석을 얻었고 2015년 11월 8일 총선에서 압승했다. 2016년 3월 틴 쩌가 대통령, 수찌가 국가 고문이 되었고 2018년 3월 윈 민트가 대통령이 되었다. 헌법은 의석의 25%를 군에 배정해 군의 거부권이 남았다. 서부 라카인주에서는 무슬림 소수 민족 로힝야가 1982년 시민권법으로 완전한 시민권에서 배제된 채 2012년 충돌로 약 200명이 숨지고 14만 명이 집을 잃었다. 2016년 10월 9일 무장 단체 공격과 군의 소탕, 2017년 8월 25일 아라칸 로힝야 구원군(ARSA)의 경찰 초소 공격(정부 발표 71명 사망) 뒤 군이 대규모 작전을 벌였다. 국경없는의사회는 첫 달에만 최소 6,700명이 숨졌다고 추산했고 70만 명 넘는 사람이 방글라데시로 피란했으며, 미얀마 정부는 이를 과장이라고 부인한다. 유엔 조사단은 2018년 보고서에서 학살 의도를 지적했고 2019년 11월 감비아가 국제 사법 재판소(ICJ)에 미얀마를 제소했다. 2020년 11월 8일 총선에서 NLD가 476석 가운데 396석을 얻었으나 군이 부정 선거를 주장했고, 2021년 2월 1일 새 의회가 열리는 날 민 아웅 흘라잉 총사령관이 쿠데타로 권력을 잡아 수찌와 윈 민트 대통령 등을 구금하고 1년 비상사태를 선포했다. 이에 항의하는 시위와 공무원 불복종 운동이 이어졌으며 군의 무력 진압으로 사망자가 늘었다."
  subjects: [myanmar, bangladesh]
  links:
