  year: 1270
  title:
    ko: 개경 환도와 원 간섭기의 시작
  summary:
    ko: 무신 정권이 끝나고 고려가 몽골과 강화해 도읍을 개경으로 되돌렸다. 이후 고려는 몽골(원)의 간섭을 받았다. 같은 해 서북면의 최탄 등이 투항하자 몽골은 서경에 동녕부를 두었다.
  subjects: [goryeo, mongol-empire, dongnyeong]
  links:
