  summary:
    ko: 광종이 억울하게 노비가 된 사람을 조사해 양인으로 되돌렸다. 호족의 경제·군사 기반을 약화시키고 왕권을 강화했다.
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 열전 후비 대목왕후 황보씨", "『고려사』 열전 최승로"]

- id: gwageo-958
  year: 958
  title:
    ko: 과거제 실시
  summary:
    ko: "후주에서 귀화한 쌍기의 건의로 광종이 과거제를 실시했다. 시험으로 관리를 뽑아 호족 대신 왕에게 충성하는 관료를 길렀다. 과거에는 문학 능력을 시험하는 제술과, 유교 경전을 시험하는 명경과, 기술관을 뽑는 잡과가 있었고 승려를 위한 승과도 두었으나, 무과는 거의 시행되지 않았다."
  subjects: [goryeo]
  links:
    - { from: later-zhou, to: goryeo, note: "후주 출신 쌍기의 건의" }
  tags: [politics]
  sources: ["『고려사』 세가 광종 9년"]

- id: seongjong-982
  year: 982
  endYear: 983
  title:
    ko: 성종의 유교 정치
  summary:
    ko: "최승로가 시무 28조를 올려 유교 이념에 따른 정치를 건의했다. 성종은 이를 받아들여 12목을 설치하고 지방관을 처음으로 파견했다. 983년에는 지방 호족의 직제를 호장·부호장 등으로 고쳐 향리로 편입했고, 연등회·팔관회 같은 행사도 줄였다(987년 폐지)."
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 세가 성종 원년·2년", "『고려사』 열전 최승로"]

