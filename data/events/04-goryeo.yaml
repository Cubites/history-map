  summary:
    ko: 원의 요구로 결혼도감을 두어 고려 여성을 원에 보냈다(공녀). 이 때문에 일찍 혼인시키는 조혼 풍습이 생겼다. 원은 매를 잡아 바치는 응방도 두었고, 고려에서는 몽골풍, 원에서는 고려양이 유행했다.
  subjects: [goryeo, yuan]
