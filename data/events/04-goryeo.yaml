  tags: [politics]
  sources: ["『고려사』 세가 광종 9년"]

- id: seongjong-982
  year: 982
  endYear: 983
  title:
    ko: 성종의 유교 정치
  summary:
    ko: 최승로가 시무 28조를 올려 유교 이념에 따른 정치를 건의했다. 성종은 이를 받아들여 12목을 설치하고 지방관을 처음으로 파견했다.
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 세가 성종 원년·2년", "『고려사』 열전 최승로"]

