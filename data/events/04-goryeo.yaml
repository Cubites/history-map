  summary:
    ko: 개경 가까운 예성강 어귀의 벽란도가 국제 무역항으로 번성했다. 송과 가장 활발히 교류했고, 거란·여진·일본, 멀리 아라비아 상인까지 드나들었다. 고려(Corea)라는 이름이 서양에 알려진 계기가 되었다.
