  summary:
    ko: "묘청 등 서경 세력이 서경 천도와 칭제 건원, 금 정벌을 주장했다. 개경 세력의 반대로 좌절되자 반란을 일으켰으나 김부식이 이끄는 관군에게 진압되었다. 묘청은 서경에서 나라 이름을 대위, 연호를 천개라 했다. 뒤에 신채호는 이 사건을 '조선 역사상 일천년래 제일대사건'이라고 평가했다."
