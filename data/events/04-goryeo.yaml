- id: baengnyeon-1216
  year: 1216
  title:
    ko: 요세의 백련 결사
  summary:
    ko: 천태종 승려 요세가 강진 만덕사에서 백련 결사를 열었다. 참회와 염불로 극락에 가기를 바라는 법화 신앙을 내세워 지방 백성들의 호응을 얻었다. 지눌의 수선사(정혜 결사)와 함께 무신 집권기 불교 개혁 운동을 이끌었다.
