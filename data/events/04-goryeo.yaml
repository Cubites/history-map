- id: taejo-policies-918
  year: 918
  endYear: 943
  title:
    ko: "태조의 호족 포섭과 민생 안정책"
  summary:
    ko: "태조 왕건은 각지 호족의 딸을 왕비로 맞고, 공을 세운 호족에게 왕씨 성을 내려 주어(사성 정책) 호족을 끌어안았다. 조세를 수확량의 10분의 1로 낮추는 취민유도 정책을 폈고, 흑창을 두어 가난한 백성에게 봄에 곡식을 빌려주고 가을에 거두게 했다. 고구려를 잇는다는 뜻에서 서경(평양)을 북진 정책의 기지로 중시했으며, 통일 뒤에는 『정계』와 『계백료서』를 지어 신하가 지킬 도리를 밝혔다."
  subjects: [goryeo]
  tags: [politics, economy]
  sources: ["『고려사』 세가 태조", "『고려사』 세가 태조 19년", "『고려사』 식화지 조세·상평의창"]

- id: gyunyeo-963
  year: 963
  title:
    ko: "귀법사 창건과 균여의 화엄 사상"
  summary:
    ko: "광종이 개경에 귀법사를 세우고 화엄종 승려 균여를 주지로 삼았다. 균여는 화엄종 안의 남악·북악 두 계통의 대립을 조정하고, 화엄 사상을 중심으로 법상종까지 아우르는 성상융회를 내세워 교종을 통합하려 했다. 불교의 가르침을 백성에게 쉽게 전하려고 향가 「보현십원가」 11수를 지었으며, 이 노래는 『균여전』에 실려 전한다."
  subjects: [goryeo]
  tags: [culture]
  sources: ["『고려사』 세가 광종 14년", "혁련정, 『균여전』"]

- id: gwanchoksa-968
  year: 968
  endYear: 1006
  title:
    ko: "논산 관촉사 석조 미륵보살 입상 조성"
  summary:
    ko: "논산 관촉사에 높이 약 18m의 거대한 석조 미륵보살 입상(은진미륵)이 세워졌다. 절에 전하는 사적비에 따르면 광종 때 승려 혜명이 만들기 시작해 목종 때 완성했다고 한다. 몸에 비해 머리가 크고 얼굴이 강조된 독특한 모습으로, 신라 양식에서 벗어나 지방 세력의 개성이 드러난 고려 초기 불상의 특징을 보여 준다."
  subjects: [goryeo]
  tags: [culture]
  sources: ["「관촉사 사적비」", "국가유산청 국가유산포털 「논산 관촉사 석조미륵보살입상」"]

- id: uichang-986
  year: 986
  endYear: 993
  title:
    ko: "의창과 상평창 설치"
  summary:
    ko: "성종이 태조 때의 흑창에 곡식을 더 채워 의창으로 고치고(986), 흉년이나 봄철에 가난한 농민에게 곡식을 빌려주게 했다. 이어 개경·서경과 12목에 상평창을 두어(993) 곡식값이 쌀 때 사들이고 비쌀 때 풀어 물가를 조절했다. 이 밖에도 고려는 광종 때 기금의 이자로 빈민을 돕는 제위보를, 예종 때 약을 나누어 주는 혜민국과 재난 구호를 맡은 구제도감을 두었고, 동·서 대비원에서 환자와 굶주린 사람을 돌보았다."
  subjects: [goryeo]
  tags: [society, economy]
  sources: ["『고려사』 식화지 상평의창", "『고려사』 세가 성종 5년·12년"]

- id: central-government-995
  year: 995
  title:
    ko: "2성 6부의 중앙 정치 조직"
  summary:
    ko: "성종은 당의 3성 6부제를 받아들여 고려 실정에 맞게 중서문하성과 상서성의 2성, 그 아래 이·병·호·형·예·공부의 6부를 갖추었다(995년 6부 명칭 정비). 여기에 송의 제도를 본뜬 중추원(군사 기밀·왕명 출납)과 삼사(화폐·곡식의 출납 회계)를 더했다. 중서문하성의 재신과 중추원의 추밀은 도병마사(국방·군사)와 식목도감(법·제도)에 모여 나랏일을 의논했는데, 이는 고려만의 독자적인 회의 기구였다. 어사대 관원과 중서문하성의 낭사는 대간이라 불리며 간쟁·봉박과 관리 임명에 동의하는 서경권으로 왕과 관리를 견제했다."
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 백관지", "국사편찬위원회 『신편 한국사』 13"]

- id: goryeo-family-1001
  year: 1001
  endYear: 1392
  precision: century
  title:
    ko: "고려의 가족 제도와 여성의 지위"
  summary:
    ko: "고려에서는 재산을 아들과 딸에게 고르게 나누어 주었고, 호적에는 남녀를 가리지 않고 태어난 순서대로 자녀를 적었으며, 아들이 없으면 딸이나 외손이 제사를 지내기도 했다. 혼인한 뒤 남자가 한동안 처가에서 사는 일이 흔했고, 사위와 외손자도 음서의 혜택을 받았다. 여성의 재혼이 비교적 자유로웠고 재혼한 여성이 낳은 자식도 사회적으로 차별받지 않았다. 이런 모습은 조선 전기까지 이어지다가 성리학 예법이 뿌리내린 17세기 이후 부계 중심 가족 제도로 바뀌었다."
  subjects: [goryeo]
  tags: [society]
  sources: ["『고려사』 열전 손변", "국사편찬위원회 『신편 한국사』 15 고려 전기의 사회와 대외관계"]

- id: yeondeung-palgwan-1010
  year: 1010
  title:
    ko: "연등회·팔관회의 부활"
  summary:
    ko: "성종 때 유교 정치를 내세워 폐지했던 연등회와 팔관회를 현종이 다시 열었다. 연등회는 봄에 등을 밝혀 부처에게 복을 비는 불교 행사였다. 팔관회는 개경에서 11월, 서경에서 10월에 열려 하늘과 산천의 신령, 부처를 함께 섬기는 국가 행사였다. 팔관회 때에는 송의 상인과 여진·탐라의 사신이 와서 왕에게 축하 인사를 올리고 토산물을 바쳤다."
  subjects: [goryeo]
  tags: [culture, diplomacy]
  sources: ["『고려사』 세가 현종 원년", "『고려사』 세가 정종 즉위년", "『고려사』 예지 가례잡의"]

- id: gongeumjeon-1049
  year: 1049
  title:
    ko: "공음전 지급과 문벌 귀족"
  summary:
    ko: "문종이 1품부터 5품까지의 관리에게 공음전을 지급하는 제도를 정했다. 공음전은 자손에게 물려줄 수 있는 토지였다. 5품 이상 관리의 자손이 과거를 거치지 않고 관리가 되는 음서와 함께 고위 관리 가문의 특권을 보장했다. 이를 바탕으로 경원 이씨·해주 최씨·파평 윤씨 같은 문벌 귀족이 왕실이나 다른 명문가와 혼인하며 대대로 권력을 누렸다."
  subjects: [goryeo]
  tags: [economy, society]
  sources: ["『고려사』 식화지 전제 공음전시", "『고려사』 선거지 음서"]

- id: namgyeong-1101
  year: 1101
  endYear: 1104
  title:
    ko: "남경 개창"
  summary:
    ko: "김위제가 도선의 풍수지리설을 근거로 남경(지금의 서울)에 도읍을 두면 나라가 번성한다고 건의했다. 숙종은 남경개창도감을 두고(1101) 궁궐을 짓게 해 1104년에 완성했다. 이후 남경은 중요한 지방 거점이 되었고, 고려 말에는 한때 이곳으로 도읍을 옮기기도 했다."
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 열전 김위제", "『고려사』 세가 숙종 6년·9년"]

- id: seogeung-1123
  year: 1123
  title:
    ko: "송 사신 서긍의 방문과 『고려도경』"
  summary:
    ko: "송이 보낸 사신단을 따라 서긍이 개경에 와서 한 달 남짓 머물렀다. 그는 돌아가서 고려의 제도·풍속·물산과 개경의 모습을 그림과 글로 정리해 『선화봉사고려도경』을 지었다. 고려 사람들이 청자의 푸른빛을 '비색'이라 부른다고 적는 등 고려 중기의 생활을 생생하게 전하는 자료이다. 지금은 그림은 없어지고 글만 남아 있다."
  subjects: [goryeo, song]
  links:
    - { from: song, to: goryeo, note: "사신단 파견" }
  tags: [diplomacy, culture]
  sources: ["서긍, 『선화봉사고려도경』", "『고려사』 세가 인종 원년"]

- id: gyeong-daeseung-1179
  year: 1179
  endYear: 1183
  title:
    ko: "경대승의 집권과 도방"
  summary:
    ko: "젊은 무신 경대승이 정중부 일파를 없애고 권력을 잡았다. 그는 자신을 지키려고 사병 집단인 도방을 두어 정치를 이끌었다. 1183년 경대승이 병으로 죽자 천민 출신 이의민이 권력을 잡아, 1196년 최충헌에게 제거될 때까지 집권했다."
  subjects: [goryeo]
  tags: [politics]
  sources: ["『고려사』 열전 경대승", "『고려사』 열전 이의민"]

- id: mongol-third-invasion-1235
  year: 1235
  endYear: 1239
  title:
    ko: "몽골의 3차 침입과 황룡사 9층 목탑 소실"
  summary:
    ko: "몽골군이 다시 쳐들어와 5년 가까이 전국을 휩쓸었다. 1238년에는 경주까지 내려와 신라 선덕여왕 때 세운 황룡사 9층 목탑을 불태웠다. 강화도의 조정은 부처의 힘으로 적을 물리치기를 바라며 대장경을 다시 새기기 시작했다. 지방에서도 죽주산성의 송문주처럼 몽골군을 막아 낸 싸움이 이어졌다."
  subjects: [goryeo, mongol-empire]
  links:
    - { from: mongol-empire, to: goryeo, note: "3차 침입" }
  tags: [war, culture]
  sources: ["『고려사』 세가 고종 22년~26년", "『고려사』 세가 고종 25년"]
  front: { war: goryeo-mongol-war, date: 1238-00-00 }

- id: hyangyak-gugeupbang-1236
  year: 1236
  precision: decade
  title:
    ko: "『향약구급방』 간행"
  summary:
    ko: "우리 땅에서 나는 약재(향약)로 급한 병을 치료하는 방법을 모은 『향약구급방』이 대장도감에서 간행되었다. 간행 시기는 고종 때인 1236년 무렵으로 추정된다. 현재 남아 있는 가장 오래된 우리나라 의학서이며, 우리말 약재 이름을 한자를 빌려 적어 두어 국어사 연구에도 귀중한 자료이다."
  subjects: [goryeo]
  tags: [culture]
  sources: ["『향약구급방』 조선 태종 17년 중간본 발문", "국사편찬위원회 『신편 한국사』 21"]

- id: dain-cheolso-1255
  year: 1255
  title:
    ko: "충주 다인철소 주민의 항전"
  summary:
    ko: "몽골군이 충주 일대를 공격하자 쇠를 생산하던 다인철소의 주민들이 힘을 모아 몽골군을 막아 냈다. 이 공으로 다인철소는 일반 군현인 익안현으로 올려졌다. 차별받던 소의 주민까지 나서 몽골에 맞섰음을 보여 주는 사건으로, 충주 지역의 대몽 항쟁을 대표한다."
  subjects: [goryeo, mongol-empire]
  links:
    - { from: mongol-empire, to: goryeo, note: "충주 일대 공격" }
  tags: [war, society]
  sources: ["『고려사』 지리지 충주목 익안폐현"]
  places: [{ name: "다인철소 (충주)", at: [127.83, 36.97] }]

- id: chungseon-reform-1298
  year: 1298
  endYear: 1309
  title:
    ko: "충선왕의 개혁"
  summary:
    ko: "충선왕은 즉위하자 정방을 없애고 사림원을 두어 인사를 맡기는 등 권문세족을 누르는 개혁을 폈으나, 원의 압력으로 7개월 만에 물러났다(1298). 1308년 다시 왕위에 오른 뒤에는 소금을 나라가 독점해 파는 각염법을 실시하고 의염창을 두어 재정을 늘렸다(1309). 복위 뒤에는 대부분 원에 머물렀으며, 1314년 연경에 만권당을 세웠다."
  subjects: [goryeo, yuan]
  links:
    - { from: yuan, to: goryeo, note: "충선왕 퇴위 압력" }
  tags: [politics, economy]
  sources: ["『고려사』 세가 충선왕", "『고려사』 식화지 염법"]

- id: mun-ikjeom-1363
  year: 1363
  title:
    ko: "문익점의 목화씨 전래"
  summary:
    ko: "1363년 서장관으로 원에 갔던 문익점이 돌아오면서 목화씨를 가져왔다. 장인 정천익과 함께 경상도 산청(단성)에서 재배에 성공했고, 정천익이 씨를 빼는 씨아와 실을 뽑는 물레를 만들었다고 전한다. 이후 무명(면포)이 널리 퍼져 백성의 옷감이 삼베에서 무명으로 바뀌었고, 조선 시대에는 면포가 화폐처럼 쓰였다."
  subjects: [goryeo, yuan]
  links:
    - { from: yuan, to: goryeo, note: "목화씨 전래" }
  tags: [economy, society]
  sources: ["『고려사』 열전 문익점", "『태조실록』 태조 7년 6월 문익점 졸기", "국사편찬위원회 『신편 한국사』 19"]

- id: seonggyungwan-1367
  year: 1367
  title:
    ko: "성균관 중영과 신진 사대부의 성장"
  summary:
    ko: "공민왕이 성균관을 새로 짓고 이색을 대사성으로 삼아, 정몽주·김구용·이숭인 등과 함께 성리학을 가르치게 했다. 성균관은 순수한 유학 교육 기관으로 자리 잡았고, 과거로 벼슬길에 나선 신진 사대부가 성장하는 터전이 되었다. 신진 사대부는 권문세족의 불법적인 토지 겸병과 불교의 폐단을 비판했으며, 『소학』과 『주자가례』를 보급해 성리학적 생활 규범을 퍼뜨렸다."
  subjects: [goryeo]
  tags: [culture, politics]
  sources: ["『고려사』 열전 이색", "『고려사』 선거지 학교"]

- id: mokho-1374
  year: 1374
  title:
    ko: "목호의 난과 최영의 제주 정벌"
  summary:
    ko: "명이 제주의 말 2천 필을 요구하자, 원 간섭기부터 제주에 머물며 말을 기르던 몽골인 목자(목호)들이 이를 거부하고 반란을 일으켰다. 최영이 2만 5천여 명의 군사를 이끌고 건너가 목호 세력을 진압했다. 이로써 100년 가까이 이어진 몽골 세력의 제주 지배가 완전히 끝났다."
  subjects: [goryeo, ming]
  links:
    - { from: ming, to: goryeo, note: "제주 말 요구" }
  tags: [war]
  sources: ["『고려사』 세가 공민왕 23년", "『고려사』 열전 최영"]
  places: [{ name: "제주 새별오름", at: [126.36, 33.37] }]
