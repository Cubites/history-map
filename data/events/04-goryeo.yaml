- id: ssangseong-1258
  year: 1258
  title:
    ko: 최씨 정권 몰락과 쌍성총관부 설치
  summary:
    ko: 최의가 살해되어 최씨 정권이 무너졌다. 같은 해 몽골군이 쳐들어오자 동북면의 조휘와 탁청이 투항했고, 몽골은 화주(영흥)에 쌍성총관부를 두어 철령 이북을 직접 다스렸다.
