  tags: [politics]
  sources: ["『고려사』 세가 원종 11년"]

- id: sambyeolcho-1270
  year: 1270
  endYear: 1273
  title:
    ko: 삼별초의 항쟁
  summary:
    ko: 개경 환도에 반대한 삼별초가 배중손, 김통정의 지휘 아래 강화도에서 진도, 제주도로 옮겨 가며 몽골과 고려 정부에 맞서 싸웠다.
