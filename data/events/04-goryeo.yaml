  precision: century
  title:
    ko: 상감 청자의 발달
  summary:
    ko: 11세기 순수 청자에 이어 12세기 중엽 고려는 그릇 표면에 무늬를 새기고 다른 색 흙을 메워 굽는 상감 기법을 독자적으로 개발했다. 강진과 부안이 대표적인 생산지였다. 원 간섭기 이후 점차 쇠퇴해 분청사기로 이어졌다.
