# 선사 시대 유물·유적 (2026-11-25, 사본 시험): 연도 막대 왼쪽의 "빙하기"·"빙하기 후" 단계에서 유물·유적 목록과 지도의 점(●)으로 보인다.
# 수록 기준·개수·좌표 대조 결과는 노션 「전세계 사료 추가」 2.3. 이 64건을 끝으로 선사 시대 자료는 더 넣지 않는다.
#   한국 26건: 국가유산청 목록 창구의 시대 코드 선사(01)·석기(03) 가운데 시대 칸이나 설명 글이 구석기·신석기를 적은 지정 국가유산
#   세계유산 38건: 유네스코 요약 설명이 구석기·신석기 유적을 중심 내용으로 적은 39건에서, 한국 묶음과 같은 자리인 「반구천의 암각화」를 뺀 것
# 운영자 검수 필요: 설명 글은 국가유산청·유네스코 글을 옮기지 않고 거기서 확인한 사실로 새로 썼다. 세계유산의 한국어 이름 18건은 뜻만 옮긴 임시 이름이다.
# 칸:
#   year / endYear: 단계의 해(빙하기 -699999, 빙하기 후 -7999)에 맞춘다(실제 연대가 아니다 — src/lib/year.ts의 PREHISTORY). 두 단계에 걸친 것은 year -699999, endYear -7999
#   dateLabel: 화면에 보이는 연대 글(출처 기관의 표기). 없으면 연대를 보이지 않는다
#   sortYear: 목록 순서를 정하는 해(천문 연도, 어림). 없으면 그 단계의 맨 뒤에 이름순
#   period: 한국 유물·유적만. 연대 앞에 보이는 시기(국가유산청 표기)
#   regionUnits: 유적이 있는 권역 단위(목록을 고른 권역의 것만 보이는 데 쓴다). 없으면 이 파일의 기본 권역(동아시아).
#                유적이 있는 오늘날 나라가 이 지도에서 속한 권역이고, 두 권역에 걸친 나라(튀르키예·아제르바이잔)는 둘 다 적는다
#   tags의 relic: 유물·유적 목록에 넣는 표시
#   places: 유적 자리. 한국은 국가유산청 좌표, 세계유산은 위키데이터 좌표(유네스코 좌표와 5km 넘게 어긋나는 5건과 대표 좌표가 없는 연속 유산 18건은 검수 필요).
#           좌표가 없는 임실 하가 유적과 박물관에 있는 유물 3건은 점 없이 목록에만 나온다

