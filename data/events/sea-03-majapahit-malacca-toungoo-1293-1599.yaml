# 동남아 사건 2묶음 갈래 03(se-03): 마자파힛·말라카·따웅우 — 바간의 끝에서 따웅우 제국의 붕괴까지, 믈라카 해협과 자와의 이슬람 술탄국들, 대월의 호·후 레·막 왕조, 아유타야·란쌍·므라우우·크메르의 남쪽 이동, 스페인의 필리핀 진출 (1293 ~ 1599년)
# 범위: 마자파힛의 성립과 전성·끝, 바간의 끝과 핀야·아바·따웅우 왕조, 아유타야·란쌍·수코타이의 흡수와 란나, 쩐 왕조의 끝과 호 왕조·후 레 왕조·막 왕조, 참파의 반격과 몰락, 크메르의 앙코르 포기,
#   말라카 술탄국과 포르투갈의 점령·조호르와 페락, 브루나이·술루·파타니·아체·드막·반튼·반자르·파장·마타람·고와–탈로, 마젤란과 레가스피의 스페인령 필리핀, 바인나웅의 제국과 난다바인의 붕괴, 나레수안의 독립.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(사가잉·마인사잉의 갈라짐, 수마트라·칼리만탄의 토착 소국, 사무드라 파사이)은 글로만 다뤘다.
# 날짜: 1582년 앞은 율리우스력이고 그 뒤는 그레고리력이다. 자와의 사카력·이슬람력·불기는 쓰지 않았고, 확실하지 않은 날짜는 '무렵'으로 적었다. 연대기와 비문의 해는 '전한다·새겼다'로 근거의 성격을 밝혔다.
# 이름 규칙: 표기 사전을 따라 드막 술탄국·반튼·마자파힛·말라카·핀야 왕국·항따와디 왕국·따웅우 왕조·므라우우·레 러이·레 타인 똥·막 당 중·호꾸이리·응우옌 호앙·뜨라이록까낫·나레수안으로 적었고, 베트남 인명은 성조 없이 띄어 썼다.
#   학설이 갈리는 해(아유타야 1350/1351, 바간의 끝 1287/1297, 마자파힛의 끝 1478/1527, 앙코르의 함락 1352·1393·1431)는 지도의 해를 본문 해로 두고 다른 해를 괄호로 병기했다. 분쟁과 정복은 어느 쪽 시각도 따르지 않고 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 시작 해가 1293~1599인 사건을 이 파일이 맡는다.
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(원의 일본·베트남·자와 원정, 정화의 항해, 영락제의 통치, 명의 교지 지배와 람선 봉기, 가네샤 왕조와 일리야스 샤 왕조의 복귀, 알부케르케의 고아 점령, 카를 5세의 황제 선출과 파비아 전투).
#   한국사와 닿는 점은 이 시기에 억지로 잇지 않았다.

- id: majapahit-founding-1293
  year: 1293
  endYear: 1309
  title:
    ko: "라덴 위자야와 마자파힛의 성립(1293~1309)"
  summary:
    ko: "싱하사리의 마지막 왕 크르타나가라가 1292년 케디리의 자야카트왕에게 죽은 뒤(「크르타나가라의 말라유 원정과 싱하사리의 끝(1275~1293)」(앞의 사건)), 그의 사위 라덴 위자야는 케디리에 복종하는 체하며 몸을 숨겼다. 자야카트왕은 그에게 타릭의 숲을 땅으로 주었고, 위자야는 이곳에 마을을 열고 쓴 마자 열매에서 이름을 따 마자파힛이라 불렀다. 1293년 초 쿠빌라이가 크르타나가라를 벌하려 보낸 원의 원정군이 자와에 닿았다(『원사』에는 2만 명으로 적혀 있고, 3만 명으로 적는 서술도 있다. 「원의 일본·베트남·자와 원정(1275~1293)」(앞의 사건)). 위자야는 이 군대와 손잡고 케디리를 쳐서 자야카트왕을 항복시켰다. 케디리가 무너진 뒤 위자야는 원군을 마을로 불러 뜻밖에 습격해 몰아냈고, 원군은 1293년 봄 몬순을 타고 자와를 떠났다. 위자야는 1293년 11월 10일 케르타라자사 자야바르다나라는 이름으로 즉위했다. 그는 크르타나가라의 딸 넷을 아내로 맞아 싱하사리의 정통을 이었음을 내세웠다. 새 나라의 도읍은 믈로 강가의 트로울란 일대에 자리 잡았다. 초기에는 공을 세우고도 보답받지 못했다고 여긴 신하들이 잇따라 반란을 일으켰다. 1295년 랑갈라웨의 반란이 대표적이다. 위자야는 1309년에 죽었고 아들 자야네가라가 1309년부터 1328년까지 뒤를 이었다. 마자파힛은 곧 자와 동부의 쌀농사 평야와 항구를 바탕으로 해상 교역에 나서, 훗날 동남아 섬 지역에 넓은 영향을 미친 나라로 자랐다(「가자 마다와 하얌 우룩, 마자파힛의 전성(1331~1389)」(뒤의 사건)). 위자야가 맞은 왕비 가운데 막내 가야트리(라자파트니)는 1350년 무렵까지 살며 왕실의 어른으로 남았고, 그의 딸 트리부와나가 뒷날 왕위에 올랐다. 『원사』는 원군의 지휘관 사비가 이 원정의 결과로 문책을 받고 재산 일부를 몰수당했다고 전한다."
  subjects: [majapahit, yuan, singhasari]
  links:
    - { from: majapahit, to: yuan, note: "원군을 이용해 케디리를 꺾은 뒤 몰아냄 (1293)" }
  tags: [politics, war]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)", "『원사』 외이전 자와", "『나가라케르타가마』", "『파라톤』"]

- id: pagan-fall-1297
  year: 1297
  endYear: 1313
  title:
    ko: "바간 왕국의 끝과 핀야 왕국(1297~1313)"
  summary:
    ko: "바간 왕국은 몽골의 침공이 이어지던 1280년대에 무너져 갔다(「몽골의 바간 침공과 와레루의 마르타반(1277~1287)」(앞의 사건)). 1287년 나라티하파테 왕이 아들의 손에 죽었고, 같은 해 1월 30일 하버마의 와레루가 독립을 선언해 항따와디 왕국의 뿌리가 되었다. 1289년 5월 왕위에 오른 짜우스와는 바간 도성 둘레밖에 다스리지 못했고, 실권은 마인사잉에 근거를 둔 세 형제 아딩카야·야자딩안·띠하뚜에게 있었다. 짜우스와는 1297년 3월 원에 복종해 원의 총독으로 인정받았다. 그러자 세 형제는 1297년 12월 17일 그를 몰아내고 마인사잉 왕국을 세웠다. 원은 이 일을 1298년 중반에야 알았다. 1301년 원군이 마인사잉을 에워쌌으나 형제가 뇌물을 바치자 물러났고, 1303년까지 상버마에서 모두 철수했다. 바간 왕국의 끝은 연구자마다 해를 달리 잡는다. 원의 침공이 왕조를 무너뜨렸다고 보아 1287년으로 보기도 하고, 마지막 왕이 폐위된 1297년으로 보기도 한다. 여기서는 1297년을 본문 해로 삼는다. 세 형제는 1310년까지 함께 다스렸고 그 뒤 야자딩안과 띠하뚜 두 형제가 이었다. 1313년 띠하뚜가 도읍을 핀야로 옮겨 홀로 왕이 되었고 핀야 왕국이 시작되었다. 핀야는 1313년부터 1325년 무렵까지 띠하뚜, 1325년 무렵부터 우자나 1세의 시대로 이어진다. 아들 사우윤이 1315년 사가잉에 따로 왕조를 세워 상버마는 두 왕실로 갈라졌다. 바간 도성은 작은 읍으로 줄었으나 옛 왕가의 후손이 1368년 무렵까지 도시를 다스렸다. 연구자들은 바간의 지배층이 사원에 땅과 농민을 바치는 일이 거듭되며 세금을 걷을 땅이 줄어 왕권이 약해졌다는 점도 몰락의 바탕으로 든다. 마인사잉 형제는 이라와디 중류의 관개 농지 짜욱세를 근거로 삼았고, 이곳 농민과 샨 출신 병사가 새 왕권의 힘이 되었다."
  subjects: [pagan-empire, pinya-kingdom, yuan, hanthawaddy-kingdom]
  links:
    - { from: pinya-kingdom, to: pagan-empire, note: "바간 왕을 폐위하고 상버마의 실권을 쥠 (1297)" }
    - { from: yuan, to: pinya-kingdom, note: "마인사잉을 에워쌌다가 물러남 (1301)" }
  tags: [politics, war]
  sources: ["Michael Aung-Thwin·Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)", "『원사』 외이전 미얀"]

- id: majapahit-golden-1331
  year: 1331
  endYear: 1389
  title:
    ko: "가자 마다와 하얌 우룩, 마자파힛의 전성(1331~1389)"
  summary:
    ko: "마자파힛은 위자야의 아들 자야네가라(1309~1328)가 죽은 뒤 그의 이복 누이 트리부와나 위자야퉁가데위가 1328년부터 1350년까지 다스렸다. 이 시기에 궁정 무관 가자 마다가 힘을 얻었다. 그는 1331년 사덩의 반란을 눌러 재상(파티) 자리에 올랐고, 곧 최고 재상(마하파티)이 되어 모든 섬을 마자파힛 아래 두겠다는 팔라파 서약을 했다. 서약의 해는 1334년으로도 1336년으로도 적는다. 1343년에는 발리의 왕조를 꺾었다. 1350년 트리부와나의 아들 하얌 우룩이 왕위에 올랐고(~1389) 가자 마다는 1364년 무렵까지 그를 도왔다. 1357년 하얌 우룩이 순다 왕의 딸 디아 피타로카와 혼인하려고 사절을 보낸 일이 부밧 사건으로 번졌다. 부밧 나루에 온 순다 왕 링가부아나와 일행이 마자파힛군과 부딪쳐 죽었고, 공주도 목숨을 끊었다고 전한다. 이 일로 순다와 마자파힛 사이에는 오래 앙금이 남았다. 시인 프라판차가 1365년 완성한 『나가라케르타가마』는 하얌 우룩의 순행과 궁정, 수마트라·말레이 반도·보르네오·동인도네시아의 이름 100여 곳을 마자파힛에 조공하는 땅으로 꼽았다. 다만 이 목록은 조공 관계를 높여 적은 것이고, 마자파힛이 직접 다스린 땅은 동자와와 발리에 가까웠다고 본다. 하얌 우룩이 1389년 죽자 사위 위크라마와르다나가 뒤를 이었다(1389~1429). 곧 왕위 다툼이 일어나 나라의 힘은 기울기 시작했다. 『나가라케르타가마』는 하얌 우룩이 1350년대 여러 차례 지방을 돌아본 순행을 자세히 적었고, 궁정에서 불교와 시바 신앙이 한 왕을 둘러싸고 함께 받들어진 모습을 전한다. 시인 프라판차는 왕실 불교를 맡은 관리였다고 한다."
  subjects: [majapahit, sunda-kingdom]
  links:
    - { from: majapahit, to: sunda-kingdom, note: "부밧 나루에서 순다 왕실 일행과 충돌해 왕을 죽임 (1357)" }
  tags: [politics, war, culture]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)", "『나가라케르타가마』", "『파라톤』"]

- id: ayutthaya-founding-1351
  year: 1351
  endYear: 1369
  title:
    ko: "우통과 아유타야 왕국의 건국(1351~1369)"
  summary:
    ko: "짜오프라야강 하류의 아유타야는 1351년 3월 4일 우통이 라마티보디 1세라는 이름으로 즉위하며 왕국의 도읍이 되었다. 건국 해는 연대기에 따라 1350년과 1351년으로 갈리는데, 여기서는 1351년을 본문 해로 삼는다. 우통은 펫부리 일대에서 일어난 인물로, 아유타야 연대기는 그가 전염병을 피해 옮겨 와 도시를 세웠다고 전한다. 이곳은 강이 세 갈래로 만나 섬처럼 둘러싸이는 땅이라 방어와 수운에 유리했다. 그는 수판부리의 지배자이자 자신의 처남인 보롬마라차와 손잡았고, 라보(롭부리)를 아들 라메수안에게 맡겼다. 1351년 무렵 롭부리, 수판부리, 펫부리가 아유타야 아래 하나로 묶여 라보 왕국은 별개의 나라로서 사라졌다. 기반이 약한 수코타이는 1349년에 이미 아유타야에 조공하게 되었다고 전하지만 해는 분명하지 않다. 우통은 1369년까지 다스렸고 아들 라메수안이 이었으나, 이듬해 1370년 외삼촌 보롬마라차 1세가 도읍으로 들어와 왕위를 차지했다. 보롬마라차 1세는 1388년까지 재위했다. 연대기는 아유타야가 앙코르를 처음 공격한 때를 우통 때(1352년)로 적지만 이 해는 학설이 갈린다. 아유타야는 이렇게 중부 평야의 쌀과 바다 무역을 한 곳에 모은 나라로 자라, 이후 사백여 년 동안 이 지역의 중심이 되었다. 아유타야는 짜오프라야강, 롭부리강, 파삭강이 만나는 섬 위에 있어 중부 평야의 쌀과 바다 교역을 함께 쥘 수 있었다. 라마티보디 1세는 인도의 법전 『마누 다르마샤스트라』의 틀에 몬의 관습을 섞어 법을 정비했다고 전한다. 왕은 상좌부 불교 승단을 후원했고 스리랑카계 승려의 영향이 궁정에 퍼졌다."
  subjects: [ayutthaya-kingdom, lavo-kingdom, sukhothai-kingdom]
  links:
    - { from: ayutthaya-kingdom, to: lavo-kingdom, note: "롭부리를 합침 (1351)" }
  tags: [politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Ayutthaya: Siam in the Early Modern World (Cambridge University Press, 2017)", "『아유타야 연대기』"]

- id: fa-ngum-lan-xang-1353
  year: 1353
  endYear: 1373
  title:
    ko: "파응움과 란쌍 왕국의 건국(1353~1373)"
  summary:
    ko: "란쌍 왕국의 창건자 파응움은 무앙수아(지금 루앙프라방)의 왕가에서 태어났으나 어려서 쫓겨나 앙코르의 궁정에서 자랐다고 전한다. 크메르 왕의 딸과 혼인했고, 1349년 크메르의 지원으로 군대를 얻어 메콩강을 따라 올라가며 흩어진 무앙들을 아울렀다. 그는 1353년 무앙수아에서 왕위에 올라 나라를 란쌍 홈카오(백만 마리 코끼리와 흰 일산의 나라)라 불렀다. 1357년에는 비엔티안을 손에 넣어 메콩강 위쪽과 코랏 고원 가장자리까지 세력을 넓혔다. 크메르 왕비가 불교를 가져오며 앙코르에서 프라방 불상이 옮겨져 상좌부 불교가 궁정에 자리 잡았다고 하는데, 이 전승의 자세한 해는 분명하지 않다. 파응움은 아유타야, 대월과 국경을 맞대면서 지금의 라오스에 가까운 영역을 하나로 묶었다. 그러나 정복이 거듭되며 귀족들의 불만이 커져 1371년 무렵 쫓겨났고, 아들 삼센타이가 왕위에 올랐다(왕 목록은 1373년을 파응움 재위의 끝으로 적는다). 파응움은 북쪽의 난으로 물러나 죽었다고 전한다. 삼센타이는 1416년까지 다스리며 인구 조사로 타이 남자 30만 명을 헤아렸다고 하는데, 그의 이름 '삼센타이'가 '타이 30만'을 뜻한다고 풀이한다. 란쌍은 1707년 분열까지 사백 년 가까이 이어졌다. 『란쌍 연대기』는 파응움이 북쪽으로는 시프송파나, 동쪽으로는 안남 산맥, 남쪽으로는 캄보디아 접경에 닿는 땅을 아울렀다고 전한다. 나라 안은 무앙이라 부르는 읍 단위로 나뉘어 각각 귀족이 다스렸고 공납과 병력을 냈다. 이 일은 연대기의 서술이어서 실제 영역의 크기는 학자마다 다르게 본다. 파응움이 가져온 프라방 불상은 루앙프라방이라는 도시 이름('프라방 불상이 있는 곳')의 유래가 되었다. 그의 이름은 라오스에서 나라를 세운 왕으로 지금도 널리 기억된다."
  subjects: [lan-xang, khmer-empire]
  links:
    - { from: khmer-empire, to: lan-xang, note: "파응움에게 군대를 내줘 왕위를 되찾게 도움 (1349)" }
  tags: [politics]
  sources: ["Martin Stuart-Fox, The Lao Kingdom of Lan Xang: Rise and Decline (White Lotus, 1998)", "Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)"]

- id: che-bong-nga-1367
  year: 1367
  endYear: 1390
  title:
    ko: "제봉아와 참파의 반격, 탕롱 약탈(1367~1390)"
  summary:
    ko: "참파는 14세기 중엽 쩐 왕조 대월과 변경의 땅을 두고 맞서다 1360년 무렵 제봉아가 왕위에 오르며 힘을 되찾았다. 제봉아는 1360년대 말부터 1390년까지 대월을 거듭 공격했다. 1371년 참파군은 바다로 올라가 쩐 왕조의 도읍 탕롱(지금 하노이)을 약탈했고, 쩐의 왕 응에 똥(재위 1370~1372)은 도성을 떠났다. 1377년 쩐의 왕 예 똥(1372~1377)이 큰 군사를 이끌고 참파의 도읍 비자야를 치다가 매복에 빠져 죽었다. 참파군은 이 승리에 힘입어 1377년과 1378년, 1383년에 다시 탕롱을 약탈했다. 쩐 왕조는 이 위기를 거치며 외척 호꾸이리가 군권과 정권을 쥐게 되었다(「호꾸이리의 찬탈과 호 왕조(1400~1407)」(뒤의 사건)). 1390년 쩐의 장수 쩐 캇 찬이 바다에서 제봉아의 배를 막았고, 제봉아의 배 위치를 알려 준 참파 장수의 배신으로 제봉아가 화포에 맞아 죽었다고 전한다. 이 전투는 베트남 쪽 기록에서 화기가 처음 쓰인 해전으로 꼽힌다. 제봉아가 죽자 참파의 반격은 끝났다. 참파는 이어 인드라바르만 6세(재위 1400~1441) 때 메콩강 쪽으로 힘을 뻗었다. 대월 사서는 1371년 참파군이 궁궐을 불태우고 재물과 사람을 약탈해 갔다고 전한다. 쩐 왕조는 참파에 맞서는 군비를 대느라 세금을 무겁게 거두었고, 민심이 흔들리는 가운데 호꾸이리가 군사 지휘에 참여해 힘을 키웠다. 이어 참파는 안으로 왕위를 다투며 대월에 맞서는 힘을 잃어 갔다. 베트남 사서와 참파 쪽 자료는 날짜와 규모가 서로 맞지 않는 곳이 있어 학자마다 약탈의 횟수를 다르게 센다. 1377년의 패배는 대월에서 쩐 왕조가 기울기 시작한 계기로 기록된다."
  subjects: [champa, tran-dynasty]
  links:
    - { from: champa, to: tran-dynasty, note: "탕롱을 약탈함 (1371·1377·1378·1383)" }
    - { from: tran-dynasty, to: champa, note: "해전에서 제봉아를 죽임 (1390)" }
  tags: [war]
  places: [{ name: 탕롱 약탈, at: [105.84, 21.03], year: 1371 }, { name: 하이찌에우 해전, at: [106.1, 20.4], year: 1390 }]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』", "Michael Vickery, Champa Revised (Asia Research Institute, 2005)"]

- id: ava-founding-1364
  year: 1364
  endYear: 1368
  title:
    ko: "사가잉·핀야의 몰락과 아바 왕국(1364~1368)"
  summary:
    ko: "핀야와 사가잉은 14세기 중엽까지 상버마를 두 왕실이 나누어 다스렸다. 핀야에서는 우자나 1세(1325 무렵~1340), 섭정 시투(1340~1344), 짜우스와 1세(1344~1350), 짜우스와 2세(1350~1359), 나라투(1359~1364년 6월)가 이었고, 사가잉에서는 사우윤(1315~1327)에서 따라비야 1세, 슈웨타웅텟, 짜스와, 나우라타 민예(1349년 몇 달), 따라비야 2세를 거쳐 1352년 2월부터 민뵉 띠하빠떼가 다스렸다. 1364년 샨 땅의 모흐닌과 마우 세력이 상버마를 약탈하자 두 왕조의 힘은 크게 꺾였다. 사가잉의 띠하빠떼는 1364년 4월 숨졌고, 핀야는 6월 우자나 2세가 오르고 9월에 끝났다. 이 틈에 타도민비야가 1364년 4월 왕위에 올라 사가잉과 핀야의 땅을 아울렀고, 이듬해 이라와디강과 밋응에강이 만나는 곳에 새 도읍 아바(잉와)를 세웠다. 연구자들은 아바 왕국의 시작을 1364년 또는 1365년으로 적는다. 타도민비야는 1367년 무렵 죽었고, 스와사우께가 1367년부터 1400년까지 뒤를 이었다. 아바는 스스로를 바간의 정통 후계로 여겼고 샨 세력과의 줄다리기에서 힘을 키웠다. 이어 하버마의 항따와디 왕국과 사십 년 동안 싸우게 된다(「아바와 항따와디의 40년 전쟁(1385~1424)」(뒤의 사건)). 아바는 이라와디강과 밋응에강이 만나 상버마의 곡창 짜욱세와 가까워 군량을 대기 쉬웠고, 샨 땅과 하버마 사이의 길목이어서 지키기도 쉬웠다. 샨 땅에서 오는 습격은 그 뒤에도 끊이지 않았다. 스와사우께의 긴 치세(1367~1400) 동안 아바는 샨의 모흐닌과 맞서고 하버마와 싸우며 영역을 다졌다. 그의 아들 따라비야는 1400년 잠시 왕위를 이었다가 몇 달 만에 끝났다."
  subjects: [pinya-kingdom, ava-kingdom, hanthawaddy-kingdom]
  links:
    - { from: ava-kingdom, to: pinya-kingdom, note: "사가잉·핀야의 땅을 아울러 아바 왕국을 세움 (1364)" }
  tags: [politics]
  sources: ["Michael Aung-Thwin·Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: brunei-1368
  year: 1368
  endYear: 1402
  title:
    ko: "브루나이 술탄국의 성립(1368~1402)"
  summary:
    ko: "보르네오 북서 해안의 브루나이강 어귀는 오래된 교역 항이었다. 브루나이의 전승은 무함마드 샤(아왕 알락 베타타르)가 1368년 무렵 나라를 세우고 이슬람으로 개종했다고 하며, 재위를 1363년 또는 1368년부터 1402년까지로 적는다. 그의 개종 해는 분명하지 않아 15세기 초라고 보는 이도 있다. 『나가라케르타가마』(1365)는 마자파힛에 조공하는 땅으로 브루나이를 꼽았다(「가자 마다와 하얌 우룩, 마자파힛의 전성(1331~1389)」(앞의 사건)). 중국 쪽 기록에는 1370년 무렵 브루나이(渤泥) 왕이 명에 사신을 보냈다고 나온다. 명은 브루나이를 조공국으로 대했고, 이는 마자파힛과 말라카의 힘 사이에서 브루나이가 교역 항으로 자리 잡는 바탕이 되었다. 무함마드 샤가 죽은 뒤 아브둘 마지드 하산(1402~1408)이 이었고, 그가 1408년 명의 난징을 찾았다가 죽어 그곳에 묻혔다고 전한다. 이어 아흐맛(1408~1425), 샤리프 알리(1425~1432), 술라이만(1432~1485)이 이었다. 초기 브루나이의 연대는 문서가 모자라 왕실 족보와 중국 기록이 어긋나는 곳이 많다. 브루나이는 15세기 말 볼키아 때 보르네오 북부로 넓어지며 전성기를 맞는다(「볼키아와 브루나이의 전성(1485~1524)」(뒤의 사건)). 브루나이강 어귀의 코타 바투를 도읍으로 삼았다고 전한다. 중국 쪽에서는 이곳을 渤泥(보니)라 불렀고 장뇌와 향료가 주요 교역품이었다. 15세기 초 말라카가 일어나자 브루나이는 말라카와의 교역으로도 이어졌다. 무함마드 샤의 개종 전승은 15세기 초 앞의 근거가 드물어, 15세기 중엽 샤리프 알리 때 이슬람이 굳어졌다고 보는 이도 있다."
  subjects: [brunei, majapahit, ming]
  links:
    - { from: brunei, to: ming, note: "사신을 보내 조공 관계를 맺음 (1370 무렵)" }
  tags: [politics, diplomacy]
  sources: ["Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 1 (Cambridge University Press, 1992)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 1 (Yale University Press, 1988)"]

- id: forty-years-war-1385
  year: 1385
  endYear: 1424
  title:
    ko: "아바와 항따와디의 40년 전쟁(1385~1424)"
  summary:
    ko: "아바 왕국의 스와사우께와 하버마 항따와디 왕국의 라자다릿 사이의 싸움은 1385년 시작되어 1424년까지 이어졌다. 항따와디는 1287년 와레루가 세운 몬의 왕국이다. 그 도읍은 1369년 빈냐 우 왕 때 바고(페구)로 옮겨져 있었다. 라자다릿은 1384년 1월 즉위하자 바고와 이라와디 삼각주의 몬 지방 지배를 굳혔고, 아바의 스와사우께는 하버마를 아울러 이라와디 전 유역을 하나로 묶으려 했다. 처음에는 스와사우께가 삼각주로 군대를 내려보냈으나 라자다릿이 막아냈고 휴전이 오갔다. 전쟁은 해마다 이어진 것이 아니라 몇 차례 싸움과 휴전이 이어졌다. 1400년 스와사우께가 죽고 그 아들 민카웅 1세(1400~1421)가 이었다. 민카웅 1세의 아들 민예까우스와는 하버마로 내려가 싸우다 1415년 전사했다. 이 싸움은 아라칸으로도 번져 아바가 1406년 아라칸을 점령하고 왕자 민소몬이 벵골로 달아났다(「민소몬의 귀환과 므라우우 왕국(1430~1531)」(뒤의 사건)). 라자다릿은 1421년 무렵 죽었고 빈냐 담마라자(1421~1424)가 이었으며 아바는 같은 해 민카웅 1세가 죽고 띠하투(1421~1425)가 올랐다. 전쟁은 1424년 빈냐 란 1세(1424~1446)가 오르며 가라앉았다. 누구도 상대를 무너뜨리지 못했고 두 나라 모두 인구와 힘을 잃었다. 몬 쪽은 뒷날 담마제디(1471~1492) 아래 번영을 맞았다. 싸움터는 주로 이라와디 삼각주와 프롬 일대였고, 두 나라는 서로 포로를 데려다 농사를 짓게 했다. 항따와디가 아바에 맞설 수 있었던 것은 삼각주 항구의 바다 무역으로 얻은 재력 덕분이라고 평가한다. 아라칸과 샨 세력이 편을 바꾸며 싸움을 길게 만들었다."
  subjects: [ava-kingdom, hanthawaddy-kingdom]
  links:
    - { from: ava-kingdom, to: hanthawaddy-kingdom, note: "하버마를 향해 거듭 군대를 보냄 (1385~1424)" }
  tags: [war]
  places: [{ name: 바고(페구), at: [96.48, 17.34], year: 1415 }]
  sources: ["Michael Aung-Thwin·Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Victor Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)", "『아예도뵌』"]

- id: ho-dynasty-1400
  year: 1400
  endYear: 1407
  title:
    ko: "호꾸이리의 찬탈과 호 왕조(1400~1407)"
  summary:
    ko: "쩐 왕조는 14세기 말 참파와의 싸움과 농민 봉기, 흉년으로 기울었다(「제봉아와 참파의 반격, 탕롱 약탈(1367~1390)」(앞의 사건), 「쩐 왕조의 성립(1225~1258)」(앞의 사건)). 외척 호꾸이리는 쩐의 왕비 집안과 혼인으로 힘을 키웠고 1395년 왕 투언 똥의 섭정이 되었다. 1396년 지폐 통보회초를 발행했고 1397년 도읍을 탕롱에서 탄호아의 따이도로 옮겼으며, 같은 해 대토지 소유의 상한을 두었다. 1398년 투언 똥을 물러나게 하고 1396년에 태어난 어린 쩐 티에우 데(호꾸이리의 외손자)를 세웠다. 1400년 음력 2월 호꾸이리는 쩐 티에우 데를 내쫓고 직접 제위에 올라 나라 이름을 다이응우(大虞)로 고쳤다. 1401년에는 둘째 아들 호한트엉에게 제위를 넘겨 자신은 태상황으로 실권을 쥐었다. 1402년에는 참파에서 지금의 꽝남과 꽝응아이 일대를 얻었다. 그러나 쩐 왕가의 후손이라며 명으로 간 쩐 티엠 빈을 영락제가 호송해 돌려보내려 했고, 1406년 이 일행이 국경에서 매복에 걸려 죽자 명은 이를 구실로 군대를 보냈다. 명군은 1406년 말 쳐들어와 1407년 호꾸이리 부자를 사로잡았다(「영락제의 통치: 내각, 환관 기구, 『영락대전』, 안남 정복(1402~1424)」(뒤의 사건), 「명의 교지 지배와 람선 봉기」(뒤의 사건)). 호 왕조는 7년 만에 끝났고 호씨 일가는 중국으로 끌려갔다. 호꾸이리가 1396년 발행한 지폐는 동전 사용을 막으려는 조치였으나 제대로 퍼지지 않았고, 대토지와 노비를 제한한 정책은 귀족의 반발을 샀다. 1400년 뒤 쩐 왕실의 후손을 내세운 세력이 곳곳에서 호 정권에 맞섰고, 이는 명이 개입할 구실이 되었다. 쯔놈으로 쓴 글을 장려한 것도 호 왕조 때의 일로 꼽는다."
  subjects: [tran-dynasty, ho-dynasty, ming, champa]
  links:
    - { from: ho-dynasty, to: tran-dynasty, note: "쩐 왕을 몰아내고 제위를 빼앗음 (1400)" }
    - { from: ho-dynasty, to: champa, note: "꽝남·꽝응아이 일대를 얻음 (1402)" }
    - { from: ming, to: ho-dynasty, note: "군대를 보내 호꾸이리 부자를 사로잡음 (1406 말~1407)" }
  tags: [politics, war]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』", "『명사』 안남전"]

- id: malacca-founding-1400
  year: 1400
  endYear: 1424
  title:
    ko: "파라메스와라와 말라카의 건설(1400~1424)"
  summary:
    ko: "말라카 해협의 좁은 목에 놓인 말라카는 1400년 무렵 파라메스와라가 세운 항구로 전한다. 『말레이 연대기』와 포르투갈의 토메 피르스는 그를 팔렘방 출신의 왕자로 적고, 그가 싱가푸라(테마섹)에서 쫓겨나 무아르를 거쳐 말라카강 어귀에 닿았다고 전한다. 쫓겨난 까닭으로 『말레이 연대기』는 마자파힛의 공격을, 피르스는 시암의 공격을 든다. 파라메스와라는 나무 이름을 딴 이 마을을 해협의 중계 항으로 키웠다. 시암은 이 항구를 속국으로 삼으려 했고, 명의 영락제는 1405년 사신 윤경(尹慶)을 보내 우호를 맺었다(1403년설도 있다). 정화 함대의 들름은 자료마다 해가 갈린다(「정화의 항해(1405~1433)」(뒤의 사건)). 파라메스와라는 1411년 왕실 일행 540명을 이끌고 명에 조공하러 갔다. 명은 말라카를 시암의 위협에서 보호하겠다는 뜻을 보였고, 말라카는 명의 함대가 기착하는 항이 되어 안정되었다. 파라메스와라는 1414년까지 다스렸다. 이슬람은 먼저 무슬림 상인들을 통해 들어왔다. 피르스는 그의 아들 메갓 이스칸다르 샤(1414~1424)가 만년에 개종했다고 하고, 『말레이 연대기』는 무함마드 샤(1424~1444) 때 지배층이 개종했다고 적는다. 파라메스와라가 개종했는지는 근거가 없다. 말라카는 이슬람 상인이 모이는 항으로 커 갔고 인도양과 중국 바다를 잇는 중심 항이 되었다. 말라카 항에서는 서쪽의 인도 구자라트·벵골 상인과 동쪽의 중국·자와 상인이 몬순의 방향에 맞춰 만났다. 인도양에서 오는 배는 서남 몬순을 타고 와 동북 몬순이 불기를 기다리며 말라카에 머물렀고, 이 때문에 말라카가 해협의 창고 항이 되었다. 파라메스와라는 관세와 항구 사용료로 왕실을 꾸렸다."
  subjects: [malacca-sultanate, ming, majapahit]
  links:
    - { from: malacca-sultanate, to: ming, note: "조공 사절을 보내 명의 후원을 얻음 (1411)" }
  tags: [politics, diplomacy, economy]
  sources: ["Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2nd ed. 2001)", "Tomé Pires, The Suma Oriental of Tomé Pires (Armando Cortesão 옮김, Hakluyt Society, 1944)", "『말레이 연대기』", "『명사』 만랄가전"]

- id: sulu-1405
  year: 1405
  endYear: 1450
  title:
    ko: "술루 술탄국의 성립(1405~1450)"
  summary:
    ko: "술루 군도는 일찍부터 진주와 해삼을 중국 상인에게 파는 항이 모인 곳이었다. 14세기 말에는 수마트라 미낭카바우의 왕자로 전하는 라자 바긴다 알리가 1390년 무렵 술루에 닿아 현지 귀족과 혼인했다고 한다. 술루 전승은 조호르 출신으로 알려진 학자 샤리프 울하심이 도착해 술탄국을 세웠다고 하며, 그 해를 1405년 11월 17일 또는 1457년으로 적는다. 샤리프는 지금의 술루 군도에 이슬람 사원을 세워 믿음을 퍼뜨렸다. 중국 『명사』는 1417년 술루의 세 왕(동왕 파두카 파할라, 서왕, 동남쪽 왕)이 사절단을 이끌고 명을 찾았다고 적는다. 동왕 파두카 파할라는 340여 명의 일행과 함께 영락제를 만났고, 돌아오는 길에 산둥의 더저우에서 죽어 그곳에 묻혔다고 전한다. 그의 아들들은 중국에 남아 더저우의 무덤을 지켰다. 이 기록은 술루가 15세기 초 이미 명과 조공 관계를 맺은 교역 정권이었음을 보여 준다. 술루는 이 무렵 브루나이와 관계가 깊었고, 브루나이의 속국이었던 기간을 1457년부터 1578년까지로 보는 서술이 있다(「브루나이 술탄국의 성립(1368~1402)」(앞의 사건)). 술루가 독립했다고 하는 1578년은 스페인이 필리핀에 닿은 뒤의 일이다. 술탄국은 이후 이슬람 교역망의 한 고리로 자랐다. 술루 군도의 해삼과 진주, 바다제비 집은 중국에서 값이 높아 중국 상인이 술루까지 와서 거래했다. 샤리프의 후손은 해안 마을마다 이슬람 사원을 세우고 현지 수장의 딸과 혼인해 술탄 가문을 이루었으며, 술탄은 현지 수장 '다투'와 권한을 나누었다고 한다. 술루의 1417년 사절은 영락제에게 후한 대접을 받았고, 동왕의 장례는 왕의 예로 치러졌다고 전한다."
  subjects: [sulu-sultanate, ming]
  links:
    - { from: sulu-sultanate, to: ming, note: "동왕 파두카 파할라가 사절단을 이끌고 명을 찾음 (1417)" }
  tags: [politics, diplomacy, religion]
  sources: ["Cesar Adib Majul, Muslims in the Philippines (University of the Philippines Press, 1973)", "『명사』 발니전", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: le-loi-1427
  year: 1427
  endYear: 1442
  title:
    ko: "레 러이와 후 레 왕조의 성립(1427~1442)"
  summary:
    ko: "레 러이는 타인호아 람선 지방의 호족으로, 1418년 명의 교지 지배에 맞서 일어났다(「명의 교지 지배와 람선 봉기」(앞의 사건)). 람선 군은 1426년 말 똣동에서 명군을 크게 물리쳤고, 1427년에는 북쪽에서 내려온 명의 원군을 꺾었다(전투의 날짜는 자료마다 갈린다). 1427년 12월 동관 남쪽에서 맹약을 맺고 명군이 물러난 뒤 그는 1428년 4월 제위에 올라 나라 이름을 대월로 되돌리고 도읍을 동경(탕롱, 지금 하노이)이라 했다. 즉위에 앞서 응우옌 짜이가 지은 「평오대고」가 반포되어 명군을 몰아낸 뜻을 선포했다. 명은 1431년 레 러이를 안남국의 임시 책임자로 인정했다. 레 러이는 병사를 상당수 농민으로 돌려보내는 군제 개편을 하고 땅을 나누고 과거를 다시 열었다. 그는 1433년 죽었고 열 살 안팎의 아들 레 타이 똥(1433~1442)이 이었는데, 처음에는 공신 레 삿과 레 응언이 정사를 맡았다. 레 삿은 1437년 숙청되었다. 1442년 8월 레 타이 똥이 지방을 돌아보다 응우옌 짜이의 거처 레찌비엔에서 갑자기 죽자 응우옌 짜이와 그의 집안은 왕을 죽였다는 죄를 받아 처형되었다. 뒤를 이은 어린 레 년 똥(1442~1459)은 왕태후 응우옌 티 아인이 섭정했다. 이 사건은 공신 세력과 왕실의 갈등을 보여 준다. 호 왕조 때 모아진 인구와 땅을 바탕으로 후 레 왕조는 15세기 후반 레 타인 똥 때 전성기를 맞게 된다(「레 타인 똥의 참파 정벌과 홍득 법전(1460~1497)」(뒤의 사건)). 1429년 이후 과거를 다시 열었고, 응우옌 짜이는 『여지지』 같은 지리서를 남겼다. 명과는 조공 관계를 유지해 책봉을 받음으로써 외교적 안정을 얻었다."
  subjects: [later-le-dynasty, ming]
  links:
    - { from: later-le-dynasty, to: ming, note: "동관 맹약으로 명군을 물러나게 함 (1427)" }
  tags: [politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』", "『명사』 안남전"]

- id: mrauk-u-1430
  year: 1430
  endYear: 1531
  title:
    ko: "민소몬의 귀환과 므라우우 왕국(1430~1531)"
  summary:
    ko: "웨탈리 왕조가 끝난 뒤 아라칸은 여러 도읍과 왕조를 거쳤다(「아라칸의 웨탈리 왕국(370~818)」(앞의 사건)). 1406년 아바군이 아라칸을 점령하자 왕자 민소몬(나라메이클라)은 벵골로 달아났다. 그는 벵골 술탄 자랄 웃딘 무함마드 샤의 궁정에 머물며 군사 지원을 얻었다(「가네샤 왕조와 일리야스 샤 왕조의 복귀: 15세기 벵골(1414~1459)」(앞의 사건)). 1430년 벵골의 장수 왈리 칸과 신디 칸이 이끄는 군대의 도움으로 아라칸 왕위를 되찾았다(1429년으로 적는 문서도 있다). 민소몬은 1431년 므라우우를 도읍으로 삼았다고 하고, 그 뒤 벵골 술탄에게 한동안 복종하며 이슬람식 칭호와 벵골 동전을 쓴 것으로 알려져 있다. 그는 술라이만 샤라는 이슬람식 이름도 썼다고 전한다. 그는 1433년 죽었고, 동생 나라누(민카이, 1433~1459)가 이어 1437년 샌도웨와 라무를 합쳤다. 이어 바소퓨(1459~1482)가 1459년 무렵 치타공을 차지했다. 이 해는 자료마다 갈려, 16세기 중엽으로 적는 서술도 있다. 바소퓨의 아들 다울랴(1482~1492)가 아버지를 죽이고 왕위에 올랐다. 이후 바소뇨(1492~1494), 란아웅(1494), 살링가투(1494~1502), 라자(1502~1513), 가자파티(1513~1515), 소오(1515), 타자타(1515~1521), 민카웅(1521~1531)이 짧게 이어졌다. 민빈이 1531년 5월 즉위해 왕국을 전성기로 이끈다. 아라칸의 이전 왕국은 1430년 사라지고 므라우우가 이를 이었다. 므라우우는 칼라단강 옆 분지에 있어 지키기 좋았고, 벵골만의 상인과 버마 내륙을 잇는 항구였다."
  subjects: [mrauk-u, arakan-kingdom, bengal-sultanate]
  links:
    - { from: mrauk-u, to: arakan-kingdom, note: "벵골 군대의 도움으로 아라칸 왕위를 되찾음 (1430)" }
  tags: [politics, war]
  sources: ["Michael W. Charney, Where Jambudipa and Islamdom Converged: Religious Change and the Emergence of Buddhist Communalism in Early Modern Arakan (University of Michigan, 1999)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)"]

- id: angkor-abandoned-1431
  year: 1431
  endYear: 1434
  title:
    ko: "앙코르의 함락과 크메르 도읍의 남쪽 이동(1431~1434)"
  summary:
    ko: "크메르 제국은 자야바르만 7세의 건축 사업(1181 무렵~1218 무렵) 뒤 재정이 기울고 상좌부 불교가 퍼지면서 힘을 잃어 갔다(「자야바르만 2세와 크메르 제국의 시작(802~850)」(앞의 사건)). 14세기 후반 이후 앙코르의 왕 순서는 비문이 드물어 분명하지 않다. 아유타야는 1350년대부터 앙코르를 거듭 공격했고, 타이 쪽 연대기는 1352년과 1393년에 앙코르가 함락되었다고 적는다. 여기서는 아유타야의 보롬마라차 2세가 앙코르를 포위해 함락시킨 1431년을 앙코르 포기의 해로 삼는다. 크메르 왕 폰헤아 얏은 도성이 지키기 어렵다고 보고 앙코르를 떠나 남쪽 메콩강 쪽으로 도읍을 옮겼다. 폰헤아 얏은 1431년부터 1434년 사이 스레이 산토르를 거쳐 차토목(지금의 프놈펜)에 새 도읍을 열었다고 전한다. 폰헤아 얏이 처음 자리 잡은 스레이 산토르가 물에 잠겨 차토목으로 다시 옮겼다는 전승이 있다. 아유타야는 앙코르를 오래 차지하지 않았고, 크메르의 관리와 브라만, 장인을 아유타야로 데려갔다고 한다. 이는 앙코르의 쇠퇴를 부른 하나의 원인일 뿐이며, 학자들은 관개 체계의 약화, 교역 중심의 이동, 왕위 다툼을 함께 든다. 새 도읍은 메콩강과 톤레삽강이 만나 해상 교역에 유리했다. 도읍이 떠난 앙코르 와트는 승려들이 돌보며 순례지로 남았다. 새 도읍의 크메르 왕실은 뒷날 캄보디아로 이어진다. 아유타야와 란쌍은 이 뒤 코랏 고원과 메콩강 오른쪽 기슭에서 세력을 맞댔다. 크메르 도읍은 이후 롱벡(~1594)과 우동(1618~1866)으로 옮겨 간다. 앙코르는 큰 저수지(바라이)와 운하로 쌀농사를 이어 왔는데, 14세기 이후 기후 변화와 관개 시설 관리의 소홀이 겹쳤다는 연구가 있다. 새 도읍 근처에서는 해상 교역이 다시 커졌다."
  subjects: [khmer-empire, cambodia, ayutthaya-kingdom, lan-xang]
  links:
    - { from: ayutthaya-kingdom, to: khmer-empire, note: "앙코르를 포위해 함락시킴 (1431)" }
  tags: [war, politics]
  places: [{ name: 앙코르 함락, at: [103.86, 13.41], year: 1431 }]
  sources: ["David Chandler, A History of Cambodia (Westview Press, 4th ed. 2008)", "Michael Vickery, Cambodia After Angkor: The Chronicular Evidence for the Fourteenth to Sixteenth Centuries (Yale University, 1977)", "『아유타야 연대기』"]

- id: sukhothai-annexed-1438
  year: 1438
  title:
    ko: "아유타야의 수코타이 흡수(1438)"
  summary:
    ko: "수코타이 왕국은 람캄행 때 가장 넓었으나 그 뒤 약해졌다(「수코타이 왕국의 건국(1238~1279)」(앞의 사건)). 람캄행 뒤 로타이와 사촌 응우아 남텀(1323~1347)이 이었고, 1347년 로타이의 아들 마하탐마라차 1세(리타이)가 올랐다. 그는 불교 우주론 『뜨라이품 프라루앙』을 지었다고 전한다. 1349년 아유타야가 수코타이를 공격해 조공국으로 삼았고, 도읍의 무게는 송쾌(뒤의 피사눌록)로 옮겨 갔다. 마하탐마라차 2세(르타이)는 1378년 아유타야에 신하로서 복종했다. 마하탐마라차 3세(사이르타이)는 1399년 올라 1424년 죽었다고 하며, 그의 아들들이 왕위를 다투자 아유타야 왕 인타라차가 개입해 반무앙을 세웠다. 이가 마하탐마라차 4세(보롬마판)이다. 그의 재위는 1419년부터 1438년까지로 적는 서술도 있어 해가 갈린다. 1438년 그가 죽자 아유타야의 보롬마라차 2세가 아들 라메수안(뒷날의 뜨라이록까낫)을 부왕(우파랏)으로 보냈다. 라메수안은 아유타야 관리와 군대를 이끌고 왔고, 이로써 수코타이는 독립 왕국으로서의 지위를 잃었다. 이는 합병이면서 옛 왕가를 일부 살린 형태였다. 수코타이의 옛 땅은 아유타야의 북부 행정으로 흡수되었고, 피사눌록이 중심이 되었다. 그 뒤 수코타이 왕가의 후손들은 아유타야 왕실과 혼인으로 이어졌다. 수코타이는 14세기 송콜록 도자기를 중국과 동남아로 내보냈고 불교 미술에서 걷는 불상 같은 독특한 양식을 남겼다. 옛 왕가의 중심이던 피사눌록은 아유타야 북부 통치의 거점이 되어, 훗날 나레수안의 근거지로 이어졌다. 이후 수코타이 옛 땅은 피사눌록, 수코타이, 사완칼록, 피칫 같은 도시별로 아유타야가 임명한 관리가 다스렸다."
  subjects: [sukhothai-kingdom, ayutthaya-kingdom]
  links:
    - { from: ayutthaya-kingdom, to: sukhothai-kingdom, note: "아들 라메수안을 우파랏으로 앉혀 흡수함 (1438)" }
  tags: [politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Ayutthaya: Siam in the Early Modern World (Cambridge University Press, 2017)"]

- id: malacca-golden-1446
  year: 1446
  endYear: 1488
  title:
    ko: "무자파르 샤·만수르 샤와 말라카의 전성(1446~1488)"
  summary:
    ko: "말라카의 술탄은 파라메스와라(1400~1414)에서 메갓 이스칸다르 샤, 무함마드 샤(1424~1444), 아부 샤히드 샤(1444~1446)를 거쳐 무자파르 샤(1446~1459)로 이어졌다. 무자파르 샤 때 이슬람이 굳건히 자리 잡았고 시암이 쳐들어왔으나 클랑의 수장 툰 페락이 막아냈다고 전한다. 툰 페락은 1456년부터 1498년까지 벤다하라(재상)를 지내며 나라를 이끌었다. 만수르 샤(1459~1477) 때 말라카는 가장 넓은 영역을 이루어, 1470년 무렵 파항을 병합했고 수마트라의 캄파르와 시악도 거느렸다(파항의 병합 해는 분명하지 않다). 알라웃딘 리아얏 샤(1477~1488)와 마흐무드 샤(1488~1511)가 이었다. 말라카는 인도·아랍·중국·자와 상인의 만남터가 되어, 피르스는 이곳에서 80여 개 언어가 쓰인다고 적었다. 항구에는 지역마다 샤반다르(항구 관리)를 두었고, 말라카 법전이 관세와 상거래를 규율했다. 말레이 반도와 수마트라 동해안의 소국들이 말라카에 복종했다. 아유타야는 말라카를 속국으로 삼으려 했으나 이루지 못했다. 이 번영은 1511년 포르투갈의 점령으로 끝났다(「포르투갈의 말라카 점령(1511~1526)」(뒤의 사건)). 말라카의 만수르 샤가 중국의 공주를 맞았다는 이야기는 『말레이 연대기』에 전하는 전승이며 사료로 확인되지 않는다. 말라카는 명에 사신을 보냈고, 정화의 항해가 끝난 뒤에도 교역은 이어졌다. 툰 페락은 군사와 외교를 함께 맡은 재상으로 오래 기억된다. 『말라카 법전』은 항구에서의 거래 질서와 노예·부채에 관한 규칙을 담았다고 전한다. 술탄 아래에는 벤다하라(재상), 트멩궁(치안 책임자), 라크사마나(해군 사령), 샤반다르(항구 책임자)가 있었다."
  subjects: [malacca-sultanate, ayutthaya-kingdom]
  links:
    - { from: malacca-sultanate, to: ayutthaya-kingdom, note: "시암군의 공격을 물리침 (1445~1456 무렵)" }
  tags: [politics, economy]
  sources: ["Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2nd ed. 2001)", "Tomé Pires, The Suma Oriental of Tomé Pires (Armando Cortesão 옮김, Hakluyt Society, 1944)", "『말레이 연대기』"]

- id: trailokanat-1448
  year: 1448
  endYear: 1488
  title:
    ko: "뜨라이록까낫의 개혁과 란나와의 전쟁(1448~1488)"
  summary:
    ko: "아유타야의 왕 보롬마라차 2세(1424~1448)가 죽자 아들 뜨라이록까낫(보롬마뜨라이록까낫)이 1448년 왕위를 이었다. 그는 1438년 수코타이의 부왕으로 나가 있던 라메수안이다(「아유타야의 수코타이 흡수(1438)」(앞의 사건)). 그는 1454년 무렵 행정을 크게 고쳐, 군사를 맡는 깔라홈과 내정을 맡는 마하타이로 관청을 나누고 사까디나(관직과 토지 소유의 등급)를 정했다고 전한다. 말레이 반도 북부의 열한 도를 아유타야의 직접 행정 아래 두는 일도 이 개혁 때로 본다. 한편 란나의 왕 띨록까랏(1441~1487)이 수코타이 북부를 노려 두 나라 사이에 오랜 전쟁이 벌어졌고, 뜨라이록까낫은 1463년 도읍 기능을 피사눌록으로 옮겨 북쪽 싸움에 맞섰다. 띨록까랏은 난과 프래를 차지해 세력을 키웠다. 전쟁은 1470년대 중반에 가라앉았다. 뜨라이록까낫은 1488년까지 재위했고 그 뒤 보롬마라차 3세(1488~1491), 라마티보디 2세(1491~1529)가 이었다. 뜨라이록까낫의 개혁은 이후 아유타야 정치의 기본 틀이 되어, 아유타야는 바다와 내륙 양쪽에서 힘을 쓰는 나라가 되었다. 사까디나 제도에서 평민은 25라이, 왕족과 고위 관리는 수천에서 수만 라이에 이르는 등급을 받았고, 이 등급은 재판의 벌금 크기에도 쓰였다. 뜨라이록까낫은 1461년(1465년으로 적는 서술도 있다) 8개월 동안 승려가 되었다고도 전한다. 그가 북쪽 피사눌록에 머무는 동안 아유타야 도성은 부왕이 맡았다. 이 개혁으로 왕은 수코타이와 라보의 옛 땅까지 하나의 행정 체계 아래 두었고, 아유타야는 중앙 집권 국가의 틀을 갖추었다. 사까디나 등급은 18세기에도 쓰였다."
  subjects: [ayutthaya-kingdom, lan-na]
  links:
    - { from: lan-na, to: ayutthaya-kingdom, note: "수코타이 북부를 두고 싸움 (1450년대~1470년대 중반)" }
  tags: [politics, war]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Ayutthaya: Siam in the Early Modern World (Cambridge University Press, 2017)"]

- id: patani-1457
  year: 1457
  endYear: 1530
  title:
    ko: "파타니 술탄국의 성립(1457~1530)"
  summary:
    ko: "말레이 반도 동안의 파타니는 일찍부터 교역 항이었다. 이곳은 반도 동안에서 옛 랑카수카의 무역 터와 이어지는 곳으로 알려져 있다. 『파타니 연대기(히카야트 파타니)』는 힌두·불교 왕 프라야 뚜 낙파가 새 도읍을 세웠다고 한다. 왕이 병에 걸려 파사이에서 온 샤이크 사이드가 고쳐 주자 이슬람으로 개종해 이스마일 샤라는 이름을 썼다는 전승이다. 이 개종의 해는 15세기 중엽부터 16세기 초까지 자료마다 갈리며, 여기서는 1457년을 술탄국의 시작으로 본다. 1511년 말라카가 무너지자 무슬림 상인들이 파타니로 옮겨 오며 항구는 번영했고(「포르투갈의 말라카 점령(1511~1526)」(뒤의 사건)), 포르투갈 사람 피르스는 1512~1515년 무렵 파타니가 중국과 자와 상인으로 붐비는 항구라고 적었다. 파타니는 아유타야의 영향 아래 있었으며 정기적으로 조공을 보냈다고 하는데, 그 시작 해는 분명하지 않다. 16세기에 파타니는 중국과 일본 상인까지 오가는 동남아 동쪽 해안의 큰 항구로 자랐다. 파타니라는 이름은 『히카야트 파타니』가 어부의 말 '이 바닷가(파타 니)'에서 왔다고 풀이한 데서 비롯한다. 이곳은 무슬림 상인과 불교도 시암 사람, 중국 상인이 함께 사는 항시였고, 술탄은 항구 관세와 상인 보호로 부를 쌓았다. 16세기 말에는 여왕들이 다스리는 전성기를 맞는데 이는 다음 시대의 일이다. 말레이 반도 동해안의 항구 가운데 파타니는 중국 해상과 시암 만을 잇는 길목에 있었다. 파타니의 이슬람은 왕가가 이슬람식 칭호를 쓰면서 굳어졌다고 본다. 『히카야트 파타니』는 17세기 말부터 18세기 전반 사이에 여러 사람이 적은 것으로 본다. 파타니는 시암과 조공 관계를 두면서도 내정은 독자적으로 다스렸다."
  subjects: [patani-sultanate, ayutthaya-kingdom]
  links:
    - { from: patani-sultanate, to: ayutthaya-kingdom, note: "조공을 바침 (15세기 후반~16세기 전반 무렵)" }
  tags: [politics, religion, economy]
  sources: ["Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2nd ed. 2001)", "A. Teeuw·D. K. Wyatt, Hikayat Patani: The Story of Patani (Martinus Nijhoff, 1970)", "Tomé Pires, The Suma Oriental of Tomé Pires (Armando Cortesão 옮김, Hakluyt Society, 1944)"]

- id: le-thanh-tong-1460
  year: 1460
  endYear: 1497
  title:
    ko: "레 타인 똥의 참파 정벌과 홍득 법전(1460~1497)"
  summary:
    ko: "레 타인 똥은 1459년 레 년 똥을 죽이고 오른 레 응이 잔을 1460년 반정으로 몰아내고 즉위했다. 그는 1497년까지 다스리며 후 레 왕조의 전성기를 열었다. 1469년 나라를 13도로 나누고 6년마다 호구를 조사하게 했으며, 1490년 조사에서는 마을 약 8천 곳과 인구 약 370만 명이 기록되었다. 중국식 육부와 9품 관제를 갖추고 과거로 관리를 뽑아 타인호아 출신 공신 집단의 힘을 눌렀다. 1470년 참파의 군사 10만이 후에 일대를 에워싸자 레 타인 똥은 1471년 직접 군대를 이끌고 참파의 도읍 비자야를 함락했다. 참파 왕 짜또안이 사로잡혀 포로로 죽었고, 6만 명이 죽고 3만 명이 사로잡혔다고 전한다(숫자는 자료마다 차이가 크다). 비자야 북쪽의 참파 땅은 대월의 꽝남도가 되었고, 남은 참파는 푸옌 이남으로 줄었다. 1479~1480년에는 직접 18만 대군(추산)을 이끌고 란쌍으로 쳐들어가 루앙프라방을 함락했고 란쌍 왕 짝까팟이 이 무렵 죽은 것으로 전한다. 대월군은 곧 란쌍과 란나 연합에 쫓겨 1484년 11월까지 물러났다. 1483년에는 「홍득 법전」이 완성되었다. 이 법은 중국 법에 바탕을 두면서도 딸에게도 아들과 같은 상속권을 주는 등 베트남 고유의 요소를 담았다. 1479년 응오 시 리엔이 『대월사기전서』를 완성했고, 1484년에는 과거 급제자의 이름을 새긴 비석을 문묘에 세우게 했다. 레 타인 똥은 학문을 장려해 유교 관료 사회를 굳혔다. 홍득 시기에는 지방에 학교를 세워 유교 교육을 넓혔다고 알려져 있다. 레 타인 똥은 1497년 죽었고 아들 레 히엔 똥(1497~1504)이 이었다."
  subjects: [later-le-dynasty, champa, lan-xang]
  links:
