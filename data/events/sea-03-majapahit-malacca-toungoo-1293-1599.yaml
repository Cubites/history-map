- id: mac-dang-dung-1527
  year: 1527
  endYear: 1592
  title:
    ko: "막 당 중의 찬탈과 남북조 전쟁(1527~1592)"
  summary:
    ko: "후 레 왕조는 레 타인 똥 뒤 약해져, 16세기 초 왕이 연이어 바뀌었다(「레 타인 똥의 참파 정벌과 홍득 법전(1460~1497)」(앞의 사건)). 무관 막 당 중은 이 틈에 힘을 쌓아 1527년 레 꿍 호앙을 내몰고 제위에 올랐다. 그는 1529년 아들 막 당 도안에게 제위를 넘기고 태상황이 되었다. 1533년 레 왕조의 신하 응우옌 낌이 라오스의 땅에서 레 짱 똥을 세워 레 왕조의 중흥을 내걸어, 베트남은 남쪽의 레 왕조와 북쪽의 막 왕조로 갈라졌다. 1540년 막 당 중은 명이 군사를 일으키려 하자 국경의 난꽌에서 항복해 땅 일부를 바치고 명의 안남 도통사 지위를 받는 모양으로 책봉을 받았다. 막 당 중은 1541년에 죽었다. 제위는 아들 막 당 도안(1529~1540)을 거쳐 막 푹 하이(1540~1546), 막 푹 응우옌(1546~1561), 막 마우 헙(1562~1592) 차례로 이어졌다(막 푹 하이의 즉위를 1541년으로 적는 서술도 있다). 레 쪽은 1543년 타인호아를 차지했고, 응우옌 낌의 사위 찐 끼엠이 군권을 쥐었다. 찐 끼엠이 1570년 죽은 뒤 맏아들 찐 꼬이가 군권을 이었으나 곧 동생 찐 뚱에게 밀려났고(자료마다 1570~1572년으로 갈린다), 찐 뚱이 1592년 탕롱을 되찾고 막 마우 헙을 붙잡아 죽였다. 막 왕조의 남은 세력은 까오방으로 물러나 명의 보호를 받았다. 레 왕은 이름만 남고 실권은 찐 씨가 쥐게 되었다. 이 전쟁의 마지막은 「찐 주의 까오방 점령과 막 왕조의 끝(1677)」(뒤의 사건)이다. 막 정권은 탕롱을 중심으로 북부 통킹 평야를 다스렸고 상업을 장려해 해안 교역이 늘었으며, 과거도 계속 열어 인재를 모았다. 레 중흥 정권은 라오스 접경의 산간과 타인호아에서 군대를 키웠고 지방 호족의 지지를 얻었다."
  subjects: [mac-dynasty, later-le-dynasty, ming]
  links:
    - { from: mac-dynasty, to: later-le-dynasty, note: "레 왕조의 제위를 빼앗음 (1527)" }
    - { from: later-le-dynasty, to: mac-dynasty, note: "탕롱을 되찾고 막 마우 헙을 처형함 (1592)" }
  tags: [politics, war]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』", "『명사』 안남전"]

- id: johor-perak-1528
  year: 1528
  endYear: 1540
  title:
    ko: "말라카 왕가의 갈라짐: 조호르와 페락(1528~1540)"
  summary:
    ko: "포르투갈이 말라카를 차지한 뒤(「포르투갈의 말라카 점령(1511~1526)」(앞의 사건)) 술탄 마흐무드 샤는 파항을 거쳐 빈탄에서 반격을 이끌었다. 1511년 즉위한 아들 아흐맛 샤(1511~1513)는 1513년 마흐무드의 명으로 죽었고, 마흐무드가 다시 술탄이 되었다(1513~1528). 포르투갈은 1526년 빈탄을 불살랐고 마흐무드 샤는 수마트라의 캄파르로 달아나 1528년 죽었다. 말라카 술탄 가문은 그의 아들들을 따라 두 갈래로 나뉘었다. 맏아들 무자파르 샤 1세는 페락의 지도자들에게 초청받아 1528년 페락 술탄국의 첫 술탄이 되었다. 다른 아들 알라웃딘 리아얏 샤 2세는 조호르강 어귀 조호르 라마에서 조호르 술탄국을 열어 1528년부터 1564년까지 다스렸다. 조호르는 파항과 리아우 제도, 수마트라 동해안의 일부까지 영향을 미치며 말라카 왕통을 이었다고 자처했다. 페락은 주석 산지를 바탕으로 자립을 지켰다. 조호르는 포르투갈, 북쪽의 아체와 번갈아 싸우고 손잡으며 살아남았다(「아체 술탄국의 성립(1496~1530)」(앞의 사건)). 한편 포르투갈의 말라카는 요새 도시로 남아, 말레이 세계는 포르투갈령 말라카, 조호르, 페락, 아체가 맞서는 구도가 되었다. 페락 땅은 주석이 나는 키타강 유역이어서 이후 주석 무역이 왕실 재정의 바탕이 되었다. 조호르는 말라카 왕통의 정통과 해협의 지배권을 내세우며 아체, 포르투갈과 맞섰다. 조호르의 도읍은 포르투갈의 공격을 받아 여러 차례 옮겨 다녔고, 1564년 아체가 조호르를 쳐 술탄을 붙잡아 갔다고 전한다. 조호르 왕실은 말라카의 의례와 칭호를 이어받았다고 자처했다."
  subjects: [malacca-sultanate, johor-sultanate, perak-sultanate, portuguese-malacca]
  links:
    - { from: portuguese-malacca, to: malacca-sultanate, note: "빈탄을 불살라 술탄을 캄파르로 몰아냄 (1526)" }
  tags: [politics]
  sources: ["Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2nd ed. 2001)", "『말레이 연대기』"]

- id: bayinnaung-1551
  year: 1551
  endYear: 1559
  title:
    ko: "바인나웅의 즉위와 아바·샨 국 정복(1551~1559)"
  summary:
    ko: "다빙슈웨디가 1550년 4월 암살되자(「따웅우 왕조의 자립과 다빙슈웨디의 정복(1510~1550)」(앞의 사건)) 그의 누이의 남편 바인나웅이 무너진 나라를 거의 맨손으로 다시 일으켰다. 그는 따웅우, 프롬, 바간, 하버마를 되찾아 1551년 즉위했고 1554년 바고(페구)에서 다시 대관했다. 바인나웅은 1555년 1월 아바를 정복해 아바 왕 시투 짜우띤(1551~1555)을 사로잡고 아바 왕국을 끝냈다(「사가잉·핀야의 몰락과 아바 왕국(1364~1368)」(앞의 사건)). 이어 샨 땅의 모흐닌, 몽미트, 몽난 같은 소국들을 1557년까지 복속시켜 샨 국을 따웅우 아래 묶었다. 1558년에는 란나를 정복해 치앙마이의 왕 메쿠티가 항복했고, 란나는 버마에 종속된 채 자신의 왕을 두는 형태가 되었다. 1560년에는 마니푸르를 쳤다. 샨 영주들(사오파)의 세습권을 줄이고 그 아들들을 도성에 두어 인질 겸 교육을 시킨 것이 큰 성과로 꼽힌다. 그러나 이 제국은 바인나웅 개인에 대한 충성에 기댄 것이라 그가 죽자 흔들린다. 바인나웅은 1564년과 1569년 아유타야를 쳤다(「바인나웅의 아유타야 원정과 1569년 함락(1563~1569)」(뒤의 사건)). 이 사건은 정복의 첫 단계인 아바·샨 국·란나까지를 다룬다. 바인나웅은 속국 왕들을 거느린 '왕 중의 왕'으로서 바고(페구)에 궁전을 새로 지었다. 샨 땅을 정복한 뒤 도량형 통일과 법전 정비를 했다고 알려져 있다. 속국의 왕들은 해마다 도성에 와서 충성을 맹세해야 했고 왕자들은 바고에 머물렀다. 이 체제는 바인나웅이 직접 지휘할 때만 유지되는 한계가 있었다. 군대는 포르투갈 용병과 화기도 썼다."
  subjects: [toungoo-dynasty, ava-kingdom, shan-states, lan-na]
  links:
    - { from: toungoo-dynasty, to: ava-kingdom, note: "아바를 정복하고 왕을 사로잡음 (1555)" }
    - { from: toungoo-dynasty, to: shan-states, note: "샨 땅의 소국들을 복속시킴 (1557)" }
    - { from: toungoo-dynasty, to: lan-na, note: "치앙마이를 항복시켜 속국으로 삼음 (1558)" }
  tags: [war, politics]
  sources: ["Victor Lieberman, Burmese Administrative Cycles: Anarchy and Conquest, c. 1580–1760 (Princeton University Press, 1984)", "Michael Aung-Thwin·Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)"]

- id: nguyen-hoang-1558
  year: 1558
  endYear: 1599
  title:
    ko: "응우옌 호앙의 투언화 진수(1558~1599)"
  summary:
    ko: "응우옌 호앙은 레 왕조의 공신 응우옌 낌의 아들이다. 형 응우옌 우엉이 1545년 찐 끼엠에게 죽은 뒤 그는 조심하며 살다 1558년 매형 찐 끼엠에게 청해 남쪽 변경 투언화의 진수로 나갔다. 후 레 왕조의 조정은 막 왕조와 싸우느라 이 먼 땅에 힘을 쓰기 어려웠다. 투언화는 1306년 참파가 쩐 왕조에 넘긴 오·리 두 주의 옛 땅으로, 호 왕조와 명의 지배 아래서도 변방이었다. 응우옌 호앙은 이곳에서 군사와 농민을 모아 힘을 길렀다. 형 응우옌 우엉처럼 해를 입을까 두려워 먼 변경을 청했다고 보는 서술이 있다. 1570년(1568~1569년으로 적는 서술도 있다)에는 꽝남의 진수도 맡아 지금의 후에에서 꽝남까지 아울렀다. 꽝남은 1471년 레 타인 똥이 참파에서 차지한 곳으로(「레 타인 똥의 참파 정벌과 홍득 법전(1460~1497)」(앞의 사건)), 두 땅 모두 북쪽의 찐 씨가 직접 간섭하기 어려운 변방이었다. 막 왕조와 남북조 전쟁이 이어지는 동안(「막 당 중의 찬탈과 남북조 전쟁(1527~1592)」(앞의 사건)) 응우옌 호앙은 1592년 찐 뚱의 탕롱 탈환에도 참여했다. 이후 1593년부터 1600년까지는 탕롱에 머물며 찐 뚱을 보좌했다. 찐 뚱은 1570년대 초부터 레 왕의 실권자로 군림하고 있었다. 응우옌 호앙이 남쪽으로 돌아가 사실상 자립하는 때는 1600년이며, 이 사건 다음의 일이다(「응우옌 호앙의 자립과 응우옌 주(1600~1627)」(뒤의 사건)). 투언화의 주민은 참파 시대부터 쌀농사를 하던 이들과 북쪽에서 이주한 농민이 섞여 있었다. 응우옌 호앙은 찐 끼엠의 처남이어서 제거되지 않고 먼 변방으로 나갈 수 있었다고 평가한다. 이 일의 해는 『대월사기전서』가 1558년으로 적는다."
  subjects: [later-le-dynasty, mac-dynasty, champa]
  links:
    - { from: later-le-dynasty, to: mac-dynasty, note: "응우옌 호앙도 가세해 탕롱을 되찾음 (1592)" }
  tags: [politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『대월사기전서』"]

- id: setthathirath-1560
  year: 1560
  endYear: 1571
  title:
    ko: "셋타티랏의 비엔티안 천도와 버마의 침공(1560~1571)"
  summary:
    ko: "셋타티랏은 란나 왕녀의 아들로 1546년 란나의 왕이 되었다(1547년까지로 보는 서술도 있다). 1548년 아버지 포티사랏이 죽자 란쌍으로 돌아가 왕위에 올랐고 1550년 대관했다. 1551년 란나를 떠나며 에메랄드 불상을 가지고 갔다. 그는 1560년 도읍을 루앙프라방에서 비엔티안으로 옮겼다. 이는 란쌍의 중심을 메콩강 가운데로 옮기고 버마와 아유타야 사이에서 힘의 균형을 잡으려는 조치였다. 1560년 아유타야의 마하 짝끄라팟과 동맹을 맺었고, 아유타야의 공주와 혼인했다고 전한다. 1566년 무렵 비엔티안에 탓 루앙을 세웠다. 따웅우 왕조의 바인나웅이 란나를 정복하자(「바인나웅의 즉위와 아바·샨 국 정복(1551~1559)」(앞의 사건)) 란쌍도 위험해졌다. 1565년 버마군이 비엔티안을 점령했으나 셋타티랏이 숲으로 물러나 게릴라전을 벌여 버마군은 오래 머물지 못했다. 1568~1570년 버마군이 다시 들어왔을 때도 셋타티랏은 버티었다. 1571년 셋타티랏은 남쪽 아타푸 전투 중 죽었다고 전한다. 뒤를 이은 센솔린타(1571~1575)는 곧 버마에 눌렸다. 비엔티안은 1574년 버마에 점령되었다. 란쌍은 이후 버마의 지배 아래 놓였고(1574~1597 무렵), 이를 다루는 사건은 따로 있다. 셋타티랏은 지금까지 라오스의 민족 영웅으로 기억된다. 에메랄드 불상은 1779년 시암이 비엔티안을 차지할 때까지 비엔티안에 있었다. 셋타티랏은 사원 건축에도 힘써 란쌍 불교 문화의 전성기를 이끌었다. 비엔티안 천도 뒤 란쌍의 중심은 메콩 상류의 루앙프라방에서 중류의 평야 지대로 옮겨져, 이 평야의 쌀농사와 인구가 나라의 힘이 되었다. 그는 불교 사원과 불상을 보호하고 경전 필사를 후원했다고 전한다."
  subjects: [lan-xang, toungoo-dynasty, lan-na]
  links:
    - { from: toungoo-dynasty, to: lan-xang, note: "비엔티안을 공격했으나 오래 지키지 못함 (1565~1570)" }
  tags: [war, politics]
  places: [{ name: 비엔티안 점령, at: [102.6, 17.97], year: 1565 }]
  sources: ["Martin Stuart-Fox, The Lao Kingdom of Lan Xang: Rise and Decline (White Lotus, 1998)", "Victor Lieberman, Burmese Administrative Cycles: Anarchy and Conquest, c. 1580–1760 (Princeton University Press, 1984)"]

- id: ayutthaya-fall-1563
  year: 1563
  endYear: 1569
  title:
    ko: "바인나웅의 아유타야 원정과 1569년 함락(1563~1569)"
  summary:
    ko: "따웅우 왕조의 바인나웅은 란나를 얻은 뒤(「바인나웅의 즉위와 아바·샨 국 정복(1551~1559)」(앞의 사건)) 1563년 아유타야 정벌에 나섰다. 아유타야는 마하 짝끄라팟(1548~1564, 1568~1569)이 다스리고 있었다. 버마군은 1563년 북쪽 요충 피사눌록을 차지했고, 피사눌록의 영주 마하탐마라차는 항복했다. 바인나웅은 1564년 아유타야를 에워싸 왕을 항복시켰고, 왕실 인물들을 인질로 데려갔고, 어린 나레수안도 이때 버마에 갔다고 전한다. 아유타야는 이후 버마의 속국이 되었다(1564~1568). 마하 짝끄라팟은 페구로 끌려가 승려가 되었고, 아들 마힌트라티랏이 버마의 속국 왕으로 올랐다. 1568년 마하 짝끄라팟이 환속해 돌아와 다시 왕위에 올라 버마에 맞서자 바인나웅은 다시 쳐들어왔다. 도성은 포위를 이기지 못하고 1569년 함락되었다. 바인나웅은 마하탐마라차를 속국의 왕으로 앉혔고, 왕은 1569년부터 1590년까지 재위했다. 아유타야의 왕족과 기술자, 포로가 많이 버마로 끌려갔다. 이 무렵 아유타야의 속국 처지가 1584년까지 이어진다(「나레수안의 독립 선언과 농사라이 전투(1584~1605)」(뒤의 사건)). 왕통은 수코타이 왕가 계통의 마하탐마라차에게로 넘어갔다. 마하 짝끄라팟의 왕비 수리요타이가 1548년 버마군과 싸우다 코끼리 위에서 죽었다는 이야기가 연대기에 전해 온다. 1569년 함락 때 도성은 약탈되었고 많은 불상과 보물이 페구로 옮겨졌다. 바인나웅은 해마다 조공과 군사 동원을 받으려 했다. 속국이 된 아유타야는 연공과 병력을 바쳤다. 마하탐마라차는 아들 나레수안을 인질로 바치고 버마의 전쟁에 군대를 보냈다고 전한다. 이는 훗날 독립의 바탕이 된 군사 경험이었다. 영어권 서술에서는 이 함락을 아유타야의 '첫 번째 몰락'이라고도 부른다."
  subjects: [ayutthaya-kingdom, toungoo-dynasty]
  links:
    - { from: toungoo-dynasty, to: ayutthaya-kingdom, note: "아유타야를 에워싸 항복시키고 속국으로 삼음 (1564·1569)" }
  tags: [war, politics]
  places: [{ name: 아유타야 함락, at: [100.56, 14.35], year: 1569 }]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Ayutthaya: Siam in the Early Modern World (Cambridge University Press, 2017)"]

- id: legazpi-1565
  year: 1565
  endYear: 1572
  title:
    ko: "레가스피의 세부 정착과 마닐라 건설(1565~1572)"
  summary:
    ko: "스페인은 마젤란의 항해 뒤(「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」(앞의 사건)) 향신료 제도에 닿으려는 시도를 거듭했다. 1564년 11월 스페인 왕 펠리페 2세의 명으로 멕시코에서 꾸린 미겔 로페스 데 레가스피의 함대가 5척으로 바라 데 나비다드를 떠났고, 항해사이자 수사인 안드레스 데 우르다네타가 함께했다. 함대는 1565년 2월 사마르 섬에 닿아 보홀을 거쳤고, 4월 27일 세부에 상륙했으며, 라자 투파스가 맞섰으나 제압되었다. 정착지는 '산티시모 놈브레 데 헤수스의 마을'이라 불렸고 세부는 그해 스페인령 필리핀의 첫 수도가 되었다(날짜는 율리우스력). 우르다네타는 1565년 태평양을 북쪽으로 돌아 멕시코로 돌아오는 길을 열었다. 이는 이후 마닐라와 멕시코를 잇는 대형 범선 무역의 바탕이 되었다. 1570년 마르틴 데 고이티가 마닐라 만에 닿았고, 1571년 레가스피가 라자 술라이만, 라칸 둘라와 평화를 맺은 뒤 6월 24일 마닐라를 세웠다. 마닐라 일대는 브루나이와 이어진 무슬림 항시 사회였고(「볼키아와 브루나이의 전성(1485~1524)」(앞의 사건)), 성벽 도시 인트라무로스가 이곳에 지어졌다. 레가스피는 1565년부터 1572년까지 초대 총독이었고 1572년 8월 20일 마닐라에서 죽었다. 세부의 첫해는 식량 부족과 포르투갈 함대의 위협으로 어려웠다. 포르투갈은 1568년 세부를 봉쇄하기도 했다. 1570년 이후에야 마닐라가 본거지로 굳어졌고, 마닐라와 아카풀코를 오가는 갈레온 무역의 바탕이 되었다. 마닐라의 라자 술라이만은 1571년 스페인과 싸운 뒤 평화를 맺었고, 곧 마닐라 만 일대의 마을들이 스페인의 지배를 받아들였다."
  subjects: [spanish-philippines, spain, brunei]
  tags: [politics, war]
  places: [{ name: 세부 정착, at: [123.9, 10.3], year: 1565 }, { name: 마닐라 건설, at: [120.97, 14.59], year: 1571 }]
  sources: ["Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)", "William Henry Scott, Barangay: Sixteenth-Century Philippine Culture and Society (Ateneo de Manila University Press, 1994)"]

- id: pajang-mataram-1568
  year: 1568
  endYear: 1601
  title:
    ko: "드막의 끝과 파장·마타람 술탄국(1568~1601)"
  summary:
    ko: "트렝가누가 1546년 죽은 뒤 드막은 왕위 다툼으로 혼란에 빠졌다(「마자파힛의 끝과 드막의 자와 패권(1527~1546)」(앞의 사건)). 아리아 페낭상안이 1549년 드막을 쥐었고 1554년 파장의 군대에 죽었다고 적는 서술이 많으며, 드막의 끝은 1568년으로 적는다. 파장의 지배자 하디위자야(자카 팅키르)는 그를 쓰러뜨린 뒤 드막의 권위를 상징하는 물건을 파장으로 옮겼다. 이로써 드막은 독립 술탄국으로서 끝났고 파장 술탄국이 시작되었다. 하디위자야는 이 공으로 키 아겡 프마나한에게 마타람 땅을 주었는데, 마타람은 처음에 파장의 신하 나라였다. 프마나한은 1584년 죽었고 아들 수타위자야(세나파티)가 이었다. 세나파티는 1582년 하디위자야가 죽은 뒤 파장에서 다툼이 일자 힘을 키웠고, 1586년 파장을 꺾어 마타람을 독립시켰다. 수도는 코타 게데(오늘날의 욕야카르타 가까이)에 두었다. 1584년을 마타람의 독립 해로 적는 자료도 있다. 세나파티는 '파넴바한 세나파티 잉 알라가'라는 칭호로 불리며 중부 자와와 동자와의 소국들을 하나씩 복속시켜 갔다. 1601년 세나파티가 죽자 마스 졸랑(1601~1613)이 이었다. 술탄 아궁(1613~1645) 때 마타람은 자와의 강국이 되며, 그 일은 다음 시대에 속한다. 파장은 내륙 쌀농사 지대인 중부 자와에 있었고 하디위자야는 자와 궁정 예술을 후원했다. 마타람은 내륙 쌀농사와 병력을 바탕으로 해안 항시국과 구별되는 농업 왕국이 된다. 마타람의 옛 도읍 코타 게데에는 지금도 세나파티의 무덤이 있어 자와인의 순례지로 남아 있다. 파장이 무너진 1586년 이후 파장의 땅은 마타람에 합쳐졌다. 이 시기 자와의 궁정은 와양과 가믈란 같은 예술을 이어 가며 이슬람과 옛 힌두 문화를 섞어 냈다."
  subjects: [demak-sultanate, pajang-sultanate, mataram-sultanate]
  links:
    - { from: pajang-sultanate, to: demak-sultanate, note: "드막의 권위를 상징하는 물건을 파장으로 옮김 (1568)" }
    - { from: mataram-sultanate, to: pajang-sultanate, note: "파장을 꺾고 독립함 (1586)" }
  tags: [politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: spanish-expansion-1578
  year: 1578
  endYear: 1596
  title:
    ko: "카스티야 전쟁과 스페인의 루손 북부·민다나오 진출(1578~1596)"
  summary:
    ko: "스페인령 필리핀은 1571년 마닐라를 세운 뒤 루손 섬과 비사야 제도를 차례로 아우르며 가톨릭 포교와 병행했다(「레가스피의 세부 정착과 마닐라 건설(1565~1572)」(앞의 사건)). 1578년 총독 프란시스코 데 산데는 브루나이의 왕위 다툼에 개입해 군대를 보냈다. 이를 카스티야 전쟁이라 부른다. 스페인군은 브루나이 도읍을 잠시 차지했으나 전염병이 돌아 얼마 뒤 물러났다. 같은 1578년에 술루 술탄국이 브루나이에서 독립했다고 한다(「볼키아와 브루나이의 전성(1485~1524)」(앞의 사건)). 북쪽에서는 1570년대 초 후안 데 살세도가 일로코스를 탐험하고, 1581~1583년 사이에는 카가얀강 일대에서 일본인 해적을 몰아내고 누에바 세고비아를 세워 루손 북부에 스페인의 발판을 마련했다. 1596년에는 에스테반 로드리게스 데 피게로아가 마긴다나오를 치러 민다나오로 갔다가 전사했고 원정은 실패했다. 같은 해 예수회가 민다나오 북동쪽 부투안에 선교를 시작해 이 일대에 스페인의 발판이 처음 놓였다. 이 시기 스페인의 지배는 해안과 섬의 평지에 한정되었고, 산악과 남부 이슬람 지역은 스페인이 닿지 못했다. 이는 이후 모로 전쟁의 배경이 된다. 스페인의 필리핀 지배는 엔코미엔다 제도로 마을 단위의 공납을 맡기고, 아우구스티누스회·프란치스코회·예수회 선교사를 지방에 두는 방식으로 이루어졌다. 마닐라와 아카풀코를 오가는 갈레온 무역은 필리핀을 스페인 제국의 한 고리로 만들었다. 필리핀의 지방 수장들은 스페인에 복종하는 대신 세금을 걷는 지위를 인정받았고, 이들 가문이 훗날 프린시팔리아라 불리는 지방 지배층이 되었다."
  subjects: [spanish-philippines, brunei, sulu-sultanate]
  links:
    - { from: spanish-philippines, to: brunei, note: "도읍을 공격해 잠시 차지함 (1578)" }
  tags: [war, politics, religion]
  places: [{ name: 브루나이 도읍 점령, at: [114.94, 4.89], year: 1578 }]
  sources: ["William Henry Scott, Barangay: Sixteenth-Century Philippine Culture and Society (Ateneo de Manila University Press, 1994)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: toungoo-collapse-1581
  year: 1581
  endYear: 1599
  title:
    ko: "난다바인과 따웅우 제국의 붕괴, 페구 약탈(1581~1599)"
  summary:
    ko: "바인나웅은 1581년 10월 10일 아라칸 원정을 앞두고 바고(페구)에서 죽었다(「바인나웅의 즉위와 아바·샨 국 정복(1551~1559)」(앞의 사건)). 아들 난다바인(1581~1599)이 이었으나 제국은 왕에 대한 개인적 충성 위에 서 있어 곧 흔들렸다. 1584년 아바의 총독이 반란을 일으켰고 아유타야가 독립을 선언했다(「나레수안의 독립 선언과 농사라이 전투(1584~1605)」(뒤의 사건)). 난다바인은 1584년 이후 아유타야로 거듭 군대를 보냈으나 모두 실패했고, 1593년 농사라이에서는 왕세자 민지스와를 잃었다. 란나와 란쌍, 샨 땅도 차례로 떨어져 나갔다. 오랜 전쟁으로 징병과 세금이 무거워지자 몬과 샨의 농민이 달아나 논이 비었다. 1599년 따웅우의 왕자와 아라칸의 왕 민라자지가 바고를 에워쌌고, 도성은 그해 12월 함락되었다. 아라칸 군은 도성의 보물과 흰 코끼리를 가져갔다. 난다바인은 따웅우로 끌려가 얼마 뒤 죽었다고 전한다. 아바의 냥얀 왕조가 힘을 얻으며 버마는 새로 통합의 길로 들어선다. 이 무렵 포르투갈 용병 출신 필리프 드 브리투 이 니코테가 시리암에 자리잡았다고 한다. 므라우우 왕국은 이 약탈로 벵골만의 강국으로 올랐다(「민소몬의 귀환과 므라우우 왕국(1430~1531)」(앞의 사건)). 도성이 폐허가 되면서 정치의 중심은 상버마의 아바로 옮겨 갔다. 아라칸 왕은 이때 가져간 페구의 불상과 보물로 므라우우의 사원을 꾸몄다고 전한다. 하버마는 한동안 아라칸과 포르투갈 용병 세력으로 갈렸다. 왕세자 민지스와를 잃은 일은 후계 문제를 크게 흔들었다고 한다. 샨과 란나, 란쌍이 잇달아 떨어져 나가면서 제국은 해체되었다."
  subjects: [toungoo-dynasty, mrauk-u, ayutthaya-kingdom]
  links:
    - { from: mrauk-u, to: toungoo-dynasty, note: "페구를 약탈함 (1599)" }
  tags: [war, politics]
  places: [{ name: 바고(페구) 약탈, at: [96.48, 17.34], year: 1599 }]
  sources: ["Victor Lieberman, Burmese Administrative Cycles: Anarchy and Conquest, c. 1580–1760 (Princeton University Press, 1984)", "Michael W. Charney, A History of Modern Burma (Cambridge University Press, 2009)"]

- id: naresuan-1584
  year: 1584
  endYear: 1605
  title:
    ko: "나레수안의 독립 선언과 농사라이 전투(1584~1605)"
  summary:
    ko: "나레수안은 아유타야 왕 마하탐마라차의 아들로, 어린 나이에 인질로 버마에 갔다가 돌아와 북쪽 피사눌록을 맡았다. 1584년 따웅우 왕조의 난다바인이 아바의 반란을 누르려 병력을 부르자(「난다바인과 따웅우 제국의 붕괴, 페구 약탈(1581~1599)」(앞의 사건)) 나레수안은 크랭에서 황금 잔의 물을 땅에 쏟으며 버마와의 관계를 끊겠다고 선언했다. 이 장면은 20세기 초 담롱 라차누팝 왕자의 서술로 널리 알려졌다. 1590년 아버지가 죽자 나레수안은 7월 즉위했다. 1592년 말 난다바인의 왕세자 민지스와가 대군을 이끌고 왔고, 나레수안은 이듬해 1593년 1월 농사라이에서 코끼리를 탄 채 민지스와와 맞붙었고 민지스와가 죽었다. 아유타야 연대기는 이를 1593년 1월로 적고, 버마 연대기는 같은 날짜를 1593년 1월 8일(율리우스력 1592년 12월 29일)로 적으며 민지스와가 총에 맞았다고 전한다. 정식 결투가 있었는지는 학자들 사이에 의견이 갈린다. 1593년 나레수안은 캄보디아로 원정에 나서 1594년 롱벡을 점령했다(「앙코르의 함락과 크메르 도읍의 남쪽 이동(1431~1434)」(앞의 사건)). 1605년 4월 25일 나레수안은 란나 쪽으로 원정하던 중 위앙행에서 병으로 죽었다. 천연두였을 거라는 견해가 있다. 동생 에까톳사롯이 이었다. 나레수안은 군사 제도를 전쟁 체제로 고쳤고 독립 뒤에도 버마와의 다툼은 이어졌다. 1594년 롱벡 점령 뒤 캄보디아 왕은 아유타야에 눌렸다. 나레수안 시대에 아유타야는 일본·중국·포르투갈 상인과 교역을 넓혀 17세기 번영의 바탕을 만들었다고 평가한다. 연대기는 나레수안을 '검은 왕자'라 불렀다고 전한다."
  subjects: [ayutthaya-kingdom, toungoo-dynasty, cambodia]
  links:
