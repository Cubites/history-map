- id: demak-1475
  year: 1475
  endYear: 1518
  title:
    ko: "드막 술탄국의 성립과 자와 북해안의 이슬람화(1475~1518)"
  summary:
    ko: "자와 북해안의 항구들은 14세기 후반부터 무슬림 상인의 터전이었고, 마자파힛 왕실도 이슬람과 가까웠다(「가자 마다와 하얌 우룩, 마자파힛의 전성(1331~1389)」(앞의 사건)). 전승에 따르면 라덴 파타는 마자파힛 왕가의 피를 이은 인물로, 수난 암펠 같은 이슬람 스승 밑에서 자랐고 마자파힛 왕에게서 글라가 완기(지금의 드막)의 땅을 받았다. 그는 1475년 무렵 즉위했고 1478년 무렵 마자파힛에서 갈라서 드막 술탄국을 세웠다고 한다. 드막 대사원은 1477년 무렵 지어졌다고 전하지만 이 해는 전승에 따른 것이다. 자와에 이슬람을 퍼뜨린 아홉 성인 '왈리 송오'가 이 무렵 활동했다고 하며, 수난 기리와 수난 칼리자가의 이름이 알려져 있다. 드막은 쌀과 항구의 이익으로 북해안의 투반, 그레식, 자파라 같은 항구 도시를 거느렸다. 1478년을 마자파힛이 무너진 해로 보는 서술도 있어, 이 갈림은 따로 다룬다(「마자파힛의 끝과 드막의 자와 패권(1527~1546)」(뒤의 사건)). 라덴 파타는 1518년까지 다스렸고 아들 파티 우누스(1518~1521)가 이었다. 파티 우누스는 1513년 자파라의 군주로서 함대를 이끌고 포르투갈이 점령한 말라카를 공격했으나 실패했다(「포르투갈의 말라카 점령(1511~1526)」(뒤의 사건)). 수난 칼리자가는 가믈란과 와양 같은 자와의 예술을 이슬람 가르침을 전하는 데 썼다고 전한다. 드막의 항구는 자와 북해안과 향신료 제도 사이의 교역을 이어받았다. 건국 해가 1475년과 1478년 사이에서 갈리는 것은 전승의 연대를 풀이하는 방식이 다르기 때문이다. 드막 대사원은 지금도 인도네시아에서 가장 오래된 사원의 하나로 꼽힌다. 라덴 파타는 술탄의 칭호를 썼다고 전한다."
  subjects: [demak-sultanate, majapahit, portuguese-malacca]
  links:
    - { from: demak-sultanate, to: portuguese-malacca, note: "파티 우누스의 함대가 말라카를 공격했으나 물러남 (1513)" }
  tags: [politics, religion]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)", "Tomé Pires, The Suma Oriental of Tomé Pires (Armando Cortesão 옮김, Hakluyt Society, 1944)"]

- id: brunei-bolkiah-1485
  year: 1485
  endYear: 1524
  title:
    ko: "볼키아와 브루나이의 전성(1485~1524)"
  summary:
    ko: "브루나이의 술라이만은 1485년 아들 볼키아에게 자리를 넘겼다. 볼키아(나코다 라감)는 1485년부터 1524년까지 다스리며 브루나이의 전성기를 열었다. 그는 뱃사람의 기질로 알려져 '나코다(선장)'라는 이름으로 불렸다. 볼키아 때 브루나이는 보르네오 북부 해안을 따라 세력을 넓혀 지금의 사라왁과 사바 서부, 술루 군도와 필리핀 남서쪽에 영향력을 미쳤다. 볼키아는 술루의 공주 푸테리 라일라 멘찬나이와 혼인해 두 나라를 맺었다. 마닐라의 라자 마탄다 가문도 브루나이 왕가와 혈연으로 이어졌다고 전하나, 계보는 자료마다 갈린다. 술루는 브루나이에 종속된 위치였다고 하는 서술이 있다(「술루 술탄국의 성립(1405~1450)」(앞의 사건)). 볼키아가 점령한 지역의 정확한 범위와 해는 문서로 분명하지 않다. 1521년 마젤란 함대의 생존자가 브루나이를 찾아 도읍이 2만 5천 가구에 이른다고 적었는데, 이는 볼키아 후기의 모습이다(「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」(뒤의 사건)). 말라카가 포르투갈에 넘어간 뒤(1511) 무슬림 상인들이 브루나이로 옮겨 오며 항구는 더 번성했다. 볼키아가 1524년 죽자 아들 아브둘 카하르(1524~1530)가 이었다. 볼키아 때 브루나이는 후추와 장뇌, 금을 거래하고 중국 도자기를 들여왔다. 브루나이 왕가는 자와와 말라카의 가문과 혼인으로 이어졌고, 말라카가 무너진 뒤 이슬람 학자와 상인이 브루나이로 옮겨 오며 브루나이의 이슬람이 자랐다. 도읍 코타 바투에는 이슬람 사원이 세워졌다고 한다. 볼키아의 뒤는 아브둘 카하르(1524~1530)에 이어 사이풀 리잘(1530~1581)이 이었고, 이 시기에도 브루나이의 영향력이 이어졌다."
  subjects: [brunei, sulu-sultanate, portuguese-malacca]
  links:
    - { from: brunei, to: sulu-sultanate, note: "술루와 혼인으로 맺고 영향력을 넓힘 (15세기 말~16세기 초)" }
  tags: [politics]
  sources: ["Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 1 (Cambridge University Press, 1992)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 1 (Yale University Press, 1988)", "Antonio Pigafetta, Primo viaggio intorno al mondo"]

- id: aceh-1496
  year: 1496
  endYear: 1530
  title:
    ko: "아체 술탄국의 성립(1496~1530)"
  summary:
    ko: "수마트라 북단의 아체는 믈라카 해협으로 드는 길목이라 일찍부터 후추와 금을 팔았다. 아체 술탄국은 알리 무가야트 샤가 세웠다고 전하며, 건국을 1480년으로 적는 서술과 쿠타라자 도읍이 선 1496년으로 적는 서술이 있다. 알리 무가야트 샤의 재위는 1514년 무렵부터 1530년까지로 본다. 그는 1520년부터 이웃 소국을 차례로 아우른 '통일자'로, 델리, 피디르(피디), 파사이를 차례로 차지했다. 파사이의 정복 해는 1523년이라는 서술이 있고 1524년으로 적는 서술도 있다. 사무데라 파사이는 13세기 말에 시작된 동남아 초기의 이슬람 항시 국가였다. 알리 무가야트 샤는 1521년 무렵 포르투갈 함대를 물리치는 등(자료마다 차이가 있다) 말라카를 차지한 포르투갈과 맞섰다(「포르투갈의 말라카 점령(1511~1526)」(뒤의 사건)). 포르투갈이 말라카를 점령하자 이슬람 상인들은 말라카를 피해 아체로 모였다. 그의 뒤는 아들(1530~1537/39 무렵)이 이었고, 알라웃딘 알카하르(1537/39~1571)가 이어 영역을 남쪽 수마트라로 넓혔다. 아체는 17세기 초 이스칸다르 무다(1607~1636) 때 전성기를 맞았다. 포르투갈은 1521년 파사이에 요새를 세웠고, 알리 무가야트 샤는 1523~1524년 원정에서 이를 빼앗아 포르투갈 수비대를 몰아냈다고 전한다. 알리 무가야트 샤는 아체 주변을 하나씩 아울러 수마트라 북단의 이슬람 상인 연합체를 만들었다. 포르투갈의 말라카 점령으로 인도·아랍 상인의 항로가 말라카 대신 아체와 순다 해협으로 돌려지며, 홍해에서 오는 향신료 배도 아체에 닿았다. 아체 왕실은 말라카가 무너진 뒤 이슬람 세계와의 교류에 힘쓰는 한편 후추와 금을 팔아 재정을 키웠다."
  subjects: [aceh-sultanate, portuguese-malacca]
  links:
    - { from: aceh-sultanate, to: portuguese-malacca, note: "포르투갈 함대와 맞서 싸움 (1521 무렵)" }
  tags: [politics, war, religion]
  sources: ["Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)"]

- id: toungoo-1510
  year: 1510
  endYear: 1550
  title:
    ko: "따웅우 왕조의 자립과 다빙슈웨디의 정복(1510~1550)"
  summary:
    ko: "아바 왕국은 15세기 말부터 프롬과 샨 땅이 떨어져 나가며 약해졌다(「아바와 항따와디의 40년 전쟁(1385~1424)」(앞의 사건)). 1510년 10월 16일 따웅우의 영주 밍지뇨가 아바에서 갈라서 따웅우 왕조를 세웠다. 1527년 샨 연맹의 모흐닌이 아바를 약탈했고, 아바 왕 나라파티 2세(1501~1527)가 죽었다. 밍지뇨의 아들 다빙슈웨디가 1530년 11월 24일 왕위에 올라 1550년까지 다스렸다. 다빙슈웨디는 누이의 남편이 된 바인나웅과 함께 하버마의 항따와디를 공격했다. 항따와디 왕 따까윳삐(1526~1539)의 바고(페구)는 포르투갈 용병을 쓰고도 1539년 1월 무렵 함락되었다. 1541년 마르타반을 차지했고, 1542년 프롬을, 1544년 바간을 차지해 그곳에서 대관했다. 1545년에는 바고에서 몬 왕가의 방식으로 다시 대관했다. 1546~1547년 아라칸 원정은 성과가 없었다. 1548년에는 아유타야에 쳐들어갔으나 성을 얻지 못하고 물러났다. 1550년 4월 30일 그는 측근에게 암살당했고, 하버마의 몬 지방이 다시 떨어져 나갔다. 이 혼란을 바인나웅이 수습하게 된다(「바인나웅의 즉위와 아바·샨 국 정복(1551~1559)」(뒤의 사건)). 따웅우 왕조는 이 정복으로 이라와디강 전역을 하나로 묶는 첫 걸음을 내디뎠다. 다빙슈웨디가 즉위했을 때는 만 열네 살이었다. 따웅우는 변방의 작은 영주국이었으나 아바에서 달아난 학자와 샨의 습격을 피해 온 이주민이 모여들었다. 하버마 몬의 해상 교역과 포르투갈 화기를 쓰는 용병이 이후 정복의 큰 힘이 되었다. 밍지뇨는 1530년 죽을 때까지 아바와 샨 사이에서 따웅우를 지켰고, 그가 죽자 아들 다빙슈웨디가 이었다."
  subjects: [toungoo-dynasty, ava-kingdom, hanthawaddy-kingdom]
  links:
    - { from: toungoo-dynasty, to: hanthawaddy-kingdom, note: "바고(페구)를 점령함 (1539)" }
    - { from: toungoo-dynasty, to: ava-kingdom, note: "아바와 맞서 바간까지 나아감 (1542~1545)" }
  tags: [war, politics]
  places: [{ name: 바고 함락, at: [96.48, 17.34], year: 1539 }]
  sources: ["Victor Lieberman, Burmese Administrative Cycles: Anarchy and Conquest, c. 1580–1760 (Princeton University Press, 1984)", "Michael Aung-Thwin·Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)"]

- id: portuguese-malacca-1511
  year: 1511
  endYear: 1526
  title:
    ko: "포르투갈의 말라카 점령(1511~1526)"
  summary:
    ko: "포르투갈의 인도 총독 알부케르케는 1510년 고아를 차지한 뒤(「알부케르케의 고아 점령(1510)」(앞의 사건)) 향신료 무역의 길목인 말라카로 향했다. 그는 1511년 4월 코친을 떠났는데 병사 약 1,000~1,500명과 배 17~18척이 따랐다(서술마다 다르다). 말라카 술탄 마흐무드 샤는 무슬림 상인들의 설득에 포르투갈을 위협으로 보았다. 날짜는 율리우스력이다. 7월 25일 첫 공격이 있었고, 8월 8일 두 번째 공격 끝에 8월 15일 말라카가 함락되었다(8월 24일로 적는 서술도 있다). 마흐무드 샤는 파항으로, 이어 빈탄으로 달아났다. 알부케르케는 강 어귀 남쪽 언덕, 모스크가 있던 자리에 요새를 쌓았고, 이 요새는 뒷날 포르투갈어로 'A Famosa', 곧 아파모사로 알려진다. 첫 대장 루이 드 브리투 파탈링(1512~1514)이 이 요새를 맡았다. 포르투갈의 점령은 도시와 가까운 땅에 그쳤다. 마흐무드 샤는 빈탄에서 말라카를 거듭 공격했고, 1513년과 1521년 드막이 보낸 함대는 모두 실패했다. 1526년 포르투갈은 빈탄을 불살랐고, 마흐무드 샤는 수마트라의 캄파르로 물러나 1528년 죽었다. 무슬림 상인들은 말라카를 피해 아체와 자와의 다른 항구로 옮겨 갔다. 포르투갈은 1513년 중국에 첫 사절을 닿게 했고, 1521년 이후 명 조정이 포르투갈 사절을 가둬 두고 포르투갈인의 입국을 금했다. 토메 피르스는 1512~1515년 말라카에 머물며 『동방 제요(수마 오리엔탈)』를 썼고, 말라카를 쥔 자가 베네치아의 목을 쥔다고 적었다고 전한다. 요새 아파모사의 둘레에는 성벽과 4층 탑이 있었다고 한다. 포르투갈은 아시아 상인에게 통행증(카르타즈)을 팔고 관세를 거두는 방식으로 해협의 교역을 쥐려 했다. 요새 안에는 성당과 총독 관저, 병영이 세워졌다고 한다."
  subjects: [portuguese-malacca, malacca-sultanate, portugal]
  links:
    - { from: portuguese-malacca, to: malacca-sultanate, note: "말라카를 점령함 (1511)" }
  tags: [war, politics, economy]
  places: [{ name: 말라카 점령, at: [102.25, 2.19], year: 1511 }]
  sources: ["Barbara Watson Andaya·Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2nd ed. 2001)", "Tomé Pires, The Suma Oriental of Tomé Pires (Armando Cortesão 옮김, Hakluyt Society, 1944)", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: gowa-tallo-1512
  year: 1512
  endYear: 1593
  title:
    ko: "고와–탈로 연합과 마카사르의 성장(1512~1593)"
  summary:
    ko: "남술라웨시의 마카사르는 마카사르인의 두 나라 고와와 탈로를 중심으로 자랐다. 두 나라는 오랫동안 다투다 1512년 무렵 투마파리시 칼론나(재위 1510 무렵~1546) 때 통합되어 고와–탈로 연합을 이루었다. 고와가 왕이고 탈로가 재상을 맡는 짝으로, 이 연합은 이후 남술라웨시의 맹주가 되었다. 투니팔랑가(1546~1565) 때 고와는 이웃 소국을 차례로 복속시켜 영역을 넓혔고, 해상 교역을 맡는 항구 관리 제도를 정비했다. 이어 투니바타(1565 무렵 짧게), 투니잘로(1565~1590), 투니파술루(1590~1593)가 이었다. 말라카가 포르투갈에 넘어간 뒤(1511) 무슬림 상인과 포르투갈 상인 모두 향신료 섬으로 가는 길의 중계지로 마카사르를 찾았다. 마카사르는 말루쿠의 정향과 육두구, 자와 쌀을 거래하는 열린 항이 되어 다양한 종교의 상인을 받아들였다. 1593년에는 알라웃딘이 왕위에 올랐고, 고와는 1605년 이슬람을 받아들여 술탄국이 되었다(그 뒤 일은 「마카사르 전쟁과 봉가야 조약(1666~1669)」(뒤의 사건)). 고와·탈로 연합의 지배층은 카라엥이라는 칭호를 썼고, 왕과 귀족이 평의회를 이루어 왕을 세웠다. 이웃 부기스 소국 보네·와조·소페잉과 때로 맞서고 때로 손잡았다. 남술라웨시의 쌀과 해안 항구의 교역이 이 연합의 바탕이었다. 마카사르는 말라카 함락 뒤 자리를 잃은 말레이·무슬림 상인들이 모이면서 더 번창했다. 마카사르의 배는 말루쿠 제도의 정향과 육두구를 싣고 자와와 말라카 해협을 오갔고, 이 교역으로 걷은 관세가 연합의 재정이 되었다. 이웃 소국이 복속하면 고와는 그 지배층에게 지위를 인정해 주는 대신 공납과 병력을 받았다."
  subjects: [gowa-tallo]
  tags: [politics, economy]
  sources: ["Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)"]

- id: magellan-1521
  year: 1521
  title:
    ko: "마젤란 함대의 필리핀 도착과 막탄 전투(1521)"
  summary:
    ko: "포르투갈 출신의 마젤란은 스페인 왕 카를로스 1세(곧 카를 5세)의 후원으로 1519년 9월(율리우스력) 향신료 제도를 향해 서쪽으로 떠났다(「카를 5세의 황제 선출과 파비아 전투」(앞의 사건)). 함대는 다섯 척에 약 270명이었다. 1520년 말 남아메리카 남단 해협을 지나 태평양에 들어서 1521년 3월 괌에 닿았고, 3월 16일 필리핀 중부의 호몬혼 섬에 상륙했다. 3월 31일 리마사와에서 처음 미사를 올렸고, 4월 7일 세부에 닿았다. 세부의 라자 후마본은 4월 14일 세례를 받았다. 마젤란은 세부의 후마본과 맞서던 막탄 섬의 수장 라푸라푸를 굴복시키려 1521년 4월 27일 막탄으로 갔다가 전사했다. 생존자들은 세부를 떠나 7월 브루나이에 닿았고(「볼키아와 브루나이의 전성(1485~1524)」(앞의 사건)), 11월 티도레에 이르러 정향을 실었다. 이 항해에서 안토니오 피가페타는 일기를 남겼고, 후안 세바스티안 엘카노가 빅토리아호로 1522년 9월 스페인에 돌아와 최초의 세계 일주를 이루었다. 이 일은 스페인이 필리핀에 오래 머물게 되는 첫걸음이었고, 40여 년 뒤 레가스피 원정의 길을 열었다(「레가스피의 세부 정착과 마닐라 건설(1565~1572)」(뒤의 사건)). 막탄에서 마젤란은 스페인 병사 50명 안팎을 이끌고 상륙했으나 라푸라푸의 병력에 밀려 전사했다고 피가페타는 적었다. 마젤란이 죽은 뒤 후마본은 스페인 사람들을 잔치에 불러 죽였고 함대는 세부를 떠났다. 엘카노가 이끌고 돌아온 빅토리아호에는 향신료가 실려 있었고, 출발 때 270명 안팎이던 선원 가운데 이 배로 돌아온 사람은 열여덟 명이었다고 전한다."
  subjects: [spain, brunei]
  tags: [diplomacy, war]
  places: [{ name: 막탄 전투, at: [124.0, 10.3], year: 1521 }]
  sources: ["Antonio Pigafetta, Primo viaggio intorno al mondo", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: banjar-1526
  year: 1526
  title:
    ko: "반자르 술탄국의 성립(1526)"
  summary:
    ko: "보르네오 남동부의 반자르 일대는 후추와 금, 다이아몬드를 파는 강 하구 항시였다. 이곳에서는 힌두·불교 왕국 네가라 다하가 내륙을 다스렸다. 전승에 따르면 다하의 왕위 다툼에서 밀린 왕자 사무데라가 삼촌 판게란 투멍궁에 맞서 자와 북해안의 드막에 도움을 청했다. 드막은 사무데라가 이슬람으로 개종하는 조건으로 군대를 보냈다고 한다(「드막 술탄국의 성립과 자와 북해안의 이슬람화(1475~1518)」(앞의 사건)). 사무데라는 승리한 뒤 1526년 9월 24일 개종해 술탄 수리안샤라는 이름을 쓰고 반자르 술탄국을 세웠다. 이 날짜는 전승에 따른 것이다. 도읍은 쿠인 강가의 반자르마신에 두었다. 이후 반자르는 칼리만탄 남부의 후추 무역을 장악해 중국과 자와, 말레이 상인의 항이 되었다. 술탄국의 영역은 강 하구와 하류에 있었고, 내륙의 다야크 사람들의 땅은 명목상의 영향권이었다. 수리안샤는 1550년경까지 재위한 것으로 전한다. 드막이 1546년 트렝가누의 죽음 뒤 흔들리자 반자르는 드막과의 종속 관계에서 벗어난 것으로 알려져 있지만, 이 종속의 범위는 분명하지 않다. 이후 반자르는 17~18세기에 마타람과 네덜란드 동인도 회사 사이에서 균형을 잡았다. 쿠인 강가는 하구와 늪지에 지은 수상 가옥과 시장으로 이어졌고, 후추는 내륙 다야크 사람들이 모아 팔았다. 수리안샤의 개종 뒤 반자르 왕실은 이슬람 법정을 두었다고 한다. 반자르의 후추와 다이아몬드는 17세기에 네덜란드와 영국 상인을 끌어들였다. 술탄국은 1860년 폐지될 때까지 이어졌다. 하구의 수상 시장에서는 현지 사람들이 배 위에서 곡식과 과일을 팔았고, 이는 지금도 반자르마신의 풍경으로 남아 있다."
  subjects: [banjar-sultanate, demak-sultanate]
  links:
    - { from: demak-sultanate, to: banjar-sultanate, note: "원군을 보내 사무데라를 도움 (1526)" }
  tags: [politics, religion]
  sources: ["Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)"]

- id: majapahit-end-1527
  year: 1527
  endYear: 1546
  title:
    ko: "마자파힛의 끝과 드막의 자와 패권(1527~1546)"
  summary:
    ko: "위크라마와르다나(1389~1429)의 뒤를 이어 수히타(1429~1447), 크르타위자야(~1451), 라자사와르다나, 기리사와르다나(1456~1466), 싱하위크라마와르다나가 이었고, 1474년 기린드라와르다나(라나위자야)가 왕위를 차지해 도읍을 다하로 옮겼다고 한다. 『나가라케르타가마』가 꼽은 먼 땅들은 떨어져 나갔고, 마자파힛은 동자와의 작은 나라가 되었다. 전통 연대 수수께끼 문구 '시르나 일랑 크르타닝 부미'는 사카력 1400년, 곧 서기 1478년을 가리키는 것으로 풀이되어 이를 마자파힛이 끝난 해로 보는 서술이 있고, 1500년 무렵이나 1527년을 끝으로 보는 서술도 있다. 여기서는 1527년을 본문 해로 삼는다. 드막의 술탄 트렝가누(1521~1546)는 1527년 무렵 다하를 공격해 마자파힛 왕통의 마지막 자리를 무너뜨렸다고 전한다. 같은 해 장수 파타힐라가 순다 칼라파 항을 차지해 자야카르타라 불렀다(「반튼 술탄국의 성립과 순다 왕국의 끝(1527~1579)」(뒤의 사건)). 트렝가누는 투반을 비롯해 동자와의 마디운, 수라바야, 파수루안 같은 항구와 내륙 소국을 차례로 복속시켰다. 1546년 파수루안을 공격하다 죽어 드막은 왕위 다툼에 빠졌다. 마자파힛의 귀족과 학자 일부는 발리로 건너가 힌두 문화를 지켰다고 하며, 발리의 문화적 전통은 지금까지 이어진다. 마자파힛의 힌두·불교 문화는 자와 동부 산록과 발리로 옮겨 가 이어졌다. 한편 드막 같은 북해안 술탄국은 해상 교역으로 부를 얻었으나 내륙 쌀농사 지대와 갈등을 겪었다. 포르투갈의 말라카 점령은 자와 상인의 항로를 바꾸는 계기가 되었다."
  subjects: [majapahit, demak-sultanate]
  links:
    - { from: demak-sultanate, to: majapahit, note: "다하를 공격해 마지막 왕통을 무너뜨림 (1527 무렵)" }
  tags: [politics, war]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 4th ed. 2008)", "『파라톤』", "Anthony Reid, Southeast Asia in the Age of Commerce 1450–1680, vol. 2 (Yale University Press, 1993)"]

- id: banten-1527
  year: 1527
  endYear: 1579
  title:
    ko: "반튼 술탄국의 성립과 순다 왕국의 끝(1527~1579)"
  summary:
    ko: "서자와의 순다 왕국은 파자자란(파쿠안)을 도읍으로 삼았고, 순다 칼라파와 반튼은 후추를 실어 내는 항구였다. 1522년 순다 왕은 말라카의 포르투갈과 조약을 맺어 순다 칼라파에 돌 표지를 세우게 했다. 이슬람 지도자 수난 구눙 자티(시리프 히다야툴라)는 체리본을 세운 뒤 아들 하사누딘을 반튼으로 보내 1526~1527년 무렵 반튼 기랑을 차지하게 했다. 드막의 장수 파타힐라는 1527년 순다 칼라파 항을 차지하고 이름을 '승리의 도시' 자야카르타로 바꾸었다(후일 바타비아가 선다). 하사누딘은 1552년 무렵부터 술탄 칭호를 쓰며 1570년까지 다스렸고, 재위 초 남수마트라의 람풍까지 나아가 후추 산지를 쥐었다. 반튼이 람풍을 쥔 때는 하사누딘 시대로 보는 서술이 많다. 하사누딘의 아들 마울라나 유숩(1570~1580)은 순다 왕국의 내륙 도읍 파쿠안 파자자란을 공격해 1579년 함락시켰다. 순다 왕국의 마지막 왕 라가 물랴(수르야켄차나)는 힘을 잃었고, 왕실의 권위를 나타내는 의례용 돌 자리는 반튼으로 옮겨졌다고 한다. 순다의 귀족 일부는 수메당 같은 서자와 산간 지방에 남았다. 1596년 6월 코르넬리스 더 하우트만이 이끄는 네덜란드의 첫 함대가 반튼에 닿았으나, 포르투갈 상인의 방해와 마찰로 후추 구입은 순조롭지 않았다. 반튼은 후추 무역을 장악하며 16세기 말 동인도 제도 서쪽의 큰 항시 국가가 되었다. 반튼 술탄국의 후추는 중국, 인도, 뒤에는 유럽 상인에게 팔렸다. 마울라나 유숩은 논을 늘리는 수리 공사를 했다고 전한다. 하사누딘은 내륙의 반튼 기랑에서 해안의 옛 반튼으로 도읍을 옮겼다고 전한다. 반튼의 후추 거래는 람풍과 남수마트라 산지에 기댔고 술탄국은 이를 쥐려 했다."
  subjects: [banten-sultanate, sunda-kingdom, demak-sultanate, portugal]
  links:
