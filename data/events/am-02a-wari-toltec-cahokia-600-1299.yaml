# 아메리카 사건 3묶음 갈래 02a: 와리·톨텍·카호키아 (600 ~ 1299년)
# 범위: 600~1299년에 시작하는 안데스(와리·모체와 나스카의 끝·시칸·치무·찬카이·티와나쿠)·메소아메리카(팔렌케·티칼·몬테알반·마야 저지대의 붕괴·톨텍·치첸이트사·믹스텍·마야판)·북아메리카(미시시피 문화·차코 캐니언·메사버드·툴레인과 도싯 문화·노르드인 그린란드)·콜롬비아 안데스(무이스카·타이로나)·카리브해(타이노인·카리브족) 사건 19개.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 해: 모두 기원후라 천문 연도와 같다. 사건 해가 항목의 성립·끝 해와 다르면 항목은 그대로 두고 글에 '무렵'과 다른 학설을 한 구절로 적었다. 방사성 탄소 연대·나이테 연대는 문서가 주는 해를 '무렵'으로 옮겼다.
# 달력: 1582년 앞 날짜는 율리우스력. 마야 장기력을 옮긴 날짜는 상관 상수 학설에 따라 날짜가 갈리므로 달까지만 적었고, 믹스텍 그림 문서의 날짜는 연구자(존 폴)의 연대 그대로 해까지만 적었다.
# 이름 규칙: 항목 이름(와리 문화·모체 문화·나스카 문화·몬테알반·시칸 문화·미시시피 문화·무이스카·타이로나 문화·톨텍·치첸이트사·믹스텍·치무·찬카이 문화·노르드인 그린란드 정착·툴레인·도싯 문화·조상 푸에블로인·카리브족·타이노인·마야판·마야 문명·티와나쿠)을 글자 그대로 본문에 넣었다. 전승의 인물(나이람라프·타카이나모·케찰코아틀 토필친)은 전승임을 밝혔다.
# 지도 결정과의 관계: 땅 없는 항목은 subjects에만 두고 links에는 쓰지 않았다. 항목이 없는 사회(쿠스코 왕국·찬카·콜랴 등)와 학설이 갈리는 나라는 글에서만 다뤘다.
# 가리킨 기존 사건: 「하프르스피오르(872 무렵)에서 그린란드(985 무렵)까지: 노르웨이 왕국과 북대서양의 정착」, 「히메네스 데 케사다의 무이스카 정복과 산타페데보고타(1537~1540)」.

- id: wari-expansion-600
  year: 600
  endYear: 800
  title:
    ko: "와리의 팽창과 피키약타(600~800)"
  summary:
    ko: "와리 문화는 500년 무렵 아야쿠초 분지에서 도시 와리를 중심으로 자랐고(「와리 문화의 시작과 아야쿠초 분지(500~600)」(앞의 사건)), 600년 무렵부터 7세기에 걸쳐 고지대와 해안으로 퍼졌다. 이 확장을 와리 제국이라 부르기도 하지만, 제국이었는지는 학설이 갈린다. 제국이라고 보는 쪽은 지방 도시를 잇는 도로망을 근거로 든다. 고지대의 와리와 태평양 해안의 세 유적을 소돈도 골짜기를 거쳐 이은 길이 알려져 있다. 지방 중심지 가운데 피키약타는 쿠스코 분지의 남동쪽에 있고, 벽으로 둘러싼 복합 시설이 약 2제곱킬로미터에 이른다. 군대 주둔지였다는 설이 있으나 사람이 살던 흔적은 적고 문간이 드물어, 수용소나 감옥이었을 것이라는 추측까지 나왔다. 둘레에는 물길과 계단밭도 만들어졌다. 북쪽 고지대의 비라코차팜파는 모케과 골짜기의 세로 바울, 온코팜파와 같은 건축 양식과 토기를 쓴 지방 중심지였고 와리의 행정 거점으로 본다. 남쪽 모케과 골짜기에서는 와리 사람과 티와나쿠 사람이 충돌 없이 나란히 살았다. 학자 조이스 마커스는 두 세력의 관계를 냉전에 견주어, 서로 무너질 것을 두려워해 싸우지 않았다고 설명했다. 키푸라는 매듭 기록은 첫 천년기의 것이 와리와 연결되어 우아르메이 유적에서도 나왔으나, 와리가 이것을 행정에 어떻게 썼는지는 아직 분명하지 않다. 새 지역을 합칠 때 지방 지도자가 와리를 따르기로 하면 그 땅의 통치를 그대로 맡겼다고 한다. 와리와 티와나쿠 두 전통이 티티카카호 북쪽의 더 이른 푸카라 문화에서 갈라졌다고 보는 견해도 있다. 와리의 끝은 「와리 문화와 티와나쿠의 쇠퇴(900~1000)」(뒤의 사건)에서 다룬다."
  subjects: [wari]
  tags: [politics, society]
  sources: ["William H. Isbell and Gordon F. McEwan (eds.), Huari Administrative Structure: Prehistoric Monumental Architecture and State Government (Dumbarton Oaks, 1991)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru, rev. ed. (Thames & Hudson, 2001)", "Wari Empire, Wikipedia (en)"]

- id: moche-nasca-end-600
  year: 600
  endYear: 800
  title:
    ko: "모체 문화와 나스카 문화의 끝(600~800)"
  summary:
    ko: "모체 문화와 나스카 문화는 비슷한 시기에 힘을 잃었고, 두 문화 모두 끝 해가 문서마다 다르다. 후기 모체를 500~800년으로 잡고 800년 무렵 끝났다고 적는 문서가 있는 반면 700년 무렵으로 적는 문서도 있다. 나스카는 500년 무렵부터 기울어 750년 무렵 완전히 무너졌다고 하면서도 800년 무렵으로 적는 곳이 있다(앞의 일은 「모체 문화의 와카와 시판의 군주(100~600)」·「나스카 문화와 지상화(기원전 200~기원후 500)」(앞의 사건)). 안데스 빙하 코어는 563~594년에 극심한 기후 사건이 있었음을 보여 주는데, 엘니뇨와 연결지어 약 30년의 폭우와 홍수 뒤에 약 30년의 가뭄이 이어졌다고 읽는 설명이 있다. 안데스 눈 녹은 물에 기대던 모체의 물길 농사는 큰 타격을 입었을 것이다. 그래도 모체가 한꺼번에 사라진 것은 아니어서, 판파그란데는 600~700년 모체 V기의 큰 유적이었고 갈린도도 후기 모체의 큰 유적에 든다. 700년 무렵에는 이웃 비루 골짜기까지 모체의 지배가 닿았으나, 헤케테페케 골짜기의 후기 마을에는 방어 시설이 나타나 사회가 불안했음을 시사한다. 와리가 모체를 침략했다는 증거는 없고, 예전에 많은 학자가 그렇게 추정했을 뿐이다. 남쪽 나스카에서도 엘니뇨 홍수가 파괴를 불렀다고 설명하며, 밭을 넓히려 우아랑고 나무를 베어 낸 것이 침식과 물길 피해를 키웠다고 본다. 나스카 후기 6~7기는 550~750년이고, 650년 무렵의 8~9기는 요즘은 나스카가 아니라 중기 지평선의 로로·차키팜파 양식(차키팜파는 와리 양식)으로 갈라 보며, 이때 권력이 해안에서 고지대의 와리로 옮겨 갔다. 뒤는 해안 북쪽의 시칸 문화와 치무가 이었다. 두 문화는 한동안 함께 있었으나 접촉은 제한적이었다. 모체 토기는 이카 근처에서 나왔지만 나스카 토기는 모체 땅에서 발견되지 않았다."
  subjects: [moche-culture, nasca-culture]
  tags: [society, politics]
  sources: ["Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru, rev. ed. (Thames & Hudson, 2001)", "Moche culture, Wikipedia (en)", "Nazca culture, Wikipedia (en)"]

- id: pakal-615
  year: 615
  endYear: 683
  title:
    ko: "팔렌케의 파칼 대왕(615~683)"
  summary:
    ko: "팔렌케의 왕 파칼 대왕은 603년 3월에 태어났다. 어머니는 삭 쿡이고 아버지는 칸 모 히시로 전한다. 615년 7월 만 열두 살에 왕이 되었고, 즉위 뒤 한동안은 어머니가 섭정으로 이끌었다. 삭 쿡은 612년부터 615년까지 팔렌케를 다스린 앞 왕으로 헤아려지기도 한다. 626년 3월에는 익 착부 아하우와 혼인했고, 아내는 672년 11월에 죽었다. 아들로는 635년 무렵 난 칸 바흘람과 644년 무렵 난 칸 조이 치탐, 648년 무렵 난 티볼 찬 마트가 알려져 있다. 티볼 찬 마트는 어머니 익 착부 아하우가 죽고 8년쯤 뒤인 680년 무렵 죽었고 파칼이 그 장례를 이끌었다. 첫 큰 공사는 647년, 파칼이 마흔네 살이던 해에 시작되었다. 파칼은 683년 8월 만 여든 살로 죽었다. 재위는 68년 33일에 이르렀다. 뒤는 아들 키니치 칸 바흘람 2세가 684년부터 702년까지, 그 아우 키니치 칸 조이 치탐 2세가 702년부터 711년 무렵까지 이었다. 파칼의 무덤은 비문의 신전 안에 있었다. 멕시코 고고학자 알베르토 루스가 1948년 이 신전 바닥에서 비밀 입구를 찾아냈고, 계단을 치우는 데 4년이 걸려 1952년 무덤방이 열렸다. 무덤방의 유골로 잰 키는 163센티미터쯤이다. 파칼 시대의 팔렌케는 마야 문명의 저지대 도시 국가 가운데 하나였다. 마야 비문은 그의 출생을 장기력 9.8.9.13.0, 즉위를 9.9.2.4.8, 죽음을 9.12.11.5.18로 적었다. 이 날짜를 서력으로 옮기는 일은 상관 상수 학설에 따라 며칠 어긋날 수 있어, 위에서는 달까지만 적었다. 어머니 삭 쿡은 640년 9월에 죽었다. 팔렌케는 오늘날 멕시코 치아파스주의 정글 가장자리에 있다."
  subjects: [maya-civilization]
  tags: [politics, culture]
  sources: ["Simon Martin and Nikolai Grube, Chronicle of the Maya Kings and Queens: Deciphering the Dynasties of the Ancient Maya, 2nd ed. (Thames & Hudson, 2008)", "Michael D. Coe and Stephen Houston, The Maya, 9th ed. (Thames & Hudson, 2015)", "K'inich Janaab' Pakal I, Wikipedia (en)"]

- id: tikal-calakmul-695
  year: 695
  endYear: 695
  title:
    ko: "티칼의 칼라크물 격파(695)"
  summary:
    ko: "티칼의 왕 자사우 찬 카위일 1세는 682년 5월 왕이 되었고 734년 무렵까지 다스렸다. 티칼은 562년 패배 뒤 약 130년 동안 기록이 끊겼던 도시로, 그의 치세에 다시 힘을 되찾았다. 반대편의 칼라크물은 뱀 머리 문장으로 알려진 칸 왕가의 도시로(「칼라크물의 티칼 격파(562)」(앞의 사건)), 686년 무렵 죽은 것으로 보이는 유크눔 체엔 2세 뒤에 이칙나아브 칵이 686년 4월 왕이 되었다. 이칙나아브 칵은 695년 8월 군대를 이끌고 티칼을 쳤으나 졌고, 신의 상 하나를 빼앗겼다. 이칙나아브 칵이 붙잡혔는지는 분명하지 않다. 티칼의 회반죽 조각에는 사로잡힌 사람이 그려져 있지만 같은 사람인지 알 수 없고, 왕의 운명은 전하지 않는다. 695년 11월에는 칼라크물에 스플릿 어스라는 이름의 통치자가 있었는데, 그가 정당한 왕인지 티칼이 앉힌 인물인지도 알 수 없다. 칼라크물은 이 패배로 전성기를 마쳤다고 평가된다. 그렇다고 곧바로 무너진 것은 아니어서, 유크눔 톡 카위일은 702년과 731년의 카툰 끝에 비석을 일곱 개씩 세웠고, 733~736년 무렵 티칼의 제단에는 묶인 칼라크물 귀족이 새겨졌다. 자사우 찬 카위일 1세는 티칼 1호 신전에 묻힌 것으로 보이며, 이 신전이 그의 무덤으로 지어졌는지는 불분명하다. 뒤는 아들 이킨 찬 카위일이 이었다. 이 싸움은 두 도시의 오랜 패권 다툼에서 티칼이 반격에 성공한 장면이었고, 마야 문명의 저지대 정치가 두 중심 도시를 축으로 짜여 있었음을 보여 준다. 그의 즉위는 장기력 9.12.9.17.16으로 적혔고, 아내 라한 우넨 모는 704년 무렵 죽어 2호 신전에 묻혔다고 한다. 칼라크물에는 비석 117개가 있어 이 지역에서 가장 많다."
  subjects: [maya-civilization]
  tags: [war, politics]
  sources: ["Simon Martin and Nikolai Grube, Chronicle of the Maya Kings and Queens: Deciphering the Dynasties of the Ancient Maya, 2nd ed. (Thames & Hudson, 2008)", "Jasaw Chan K'awiil I, Wikipedia (en)", "Calakmul, Wikipedia (en)"]

- id: classic-collapse-750
  year: 750
  endYear: 900
  title:
    ko: "몬테알반의 버려짐과 마야 남부 저지대의 붕괴(750~900)"
  summary:
    ko: "서기 750년 무렵을 앞뒤로 메소아메리카의 큰 도시 몇 곳이 힘을 잃었다. 오아하카 계곡의 몬테알반은 기원전 500년 무렵 산등성이에 세워진 사포텍의 도시로(「몬테알반 건설과 사포텍의 오아하카 계곡(기원전 500~기원전 100)」(앞의 사건)), 기원전 100년 무렵~기원후 200년 무렵 주민이 약 1만 7천 명이었다고 추산된다. 후기 고전기(500~750년 무렵)에 계곡의 정치 중심 자리를 잃었고, 도시는 900~1000년 무렵 대부분 버려졌다. 문서마다 이 끝 해가 750년 무렵에서 1000년 무렵까지 갈린다. 몬테알반이 하던 일은 수십 개의 작은 정치체가 나눠 맡았고, 사아칠라, 람비티에코, 미틀라 같은 옛 종속 도시가 자립했다. 그 뒤 몬테알반은 의례로만 찾는 곳이 되어, 고전기의 7호 무덤에는 후고전기 믹스텍 귀족이 다시 묻혔다. 마야 문명의 남쪽 저지대에서는 8~9세기에 팔렌케·코판·티칼·칼라크물 같은 도시가 쇠퇴하고 뒤이어 버려졌다. 코판 골짜기의 인구는 흑요석 수화 연대 조사로 400~450년에 약 2만 8천 명으로 추산되고 750~800년부터 줄어 900년에 약 1만 5천 명, 1200년에는 1천 명 아래가 되었다. 중부 저지대에서는 830년 뒤 새 건물이 없었고, 칼라크물의 시골 인구는 약 10분의 1로 줄었다고 한다. 까닭은 하나로 모이지 않았다. 9세기 가뭄을 호수 퇴적물에서 읽은 연구가 1990년대부터 나왔고, 강수량이 25~40퍼센트 줄었다는 추산과 41~54퍼센트(최대 70퍼센트) 줄었다는 추산이 이어졌다. 테오티우아칸이 기울며 교역망이 바뀐 일(테오티우아칸의 쇠퇴는 550~650년 무렵으로, 이 붕괴보다 한 세기쯤 앞선다), 삼림 파괴와 침식, 전쟁, 풍토병을 드는 설도 있고, 걸프 해안에서 온 외부 침입설은 대부분의 학자가 주된 원인으로 보지 않는다. 북쪽 유카탄에서는 치첸이트사·욱스말·코바가 이어져 번성했다(「치첸이트사와 유카탄 북부(900~1200)」(뒤의 사건))."
  subjects: [monte-alban, maya-civilization]
  tags: [society, politics]
  sources: ["Kent V. Flannery and Joyce Marcus, The Cloud People: Divergent Evolution of the Zapotec and Mixtec Civilizations (Academic Press, 1983)", "Arthur A. Demarest, Ancient Maya: The Rise and Fall of a Rainforest Civilization (Cambridge University Press, 2004)", "Monte Albán, Wikipedia (en)", "Classic Maya collapse, Wikipedia (en)"]

- id: sican-750
  year: 750
  endYear: 1100
  title:
    ko: "시칸 문화와 바탄 그란데(750~1100)"
  summary:
    ko: "시칸 문화는 페루 북부 해안 람바예케 계곡에서 750년 무렵 일어나 1375년 무렵까지 이어졌고, 람바예케 문화라고도 부른다. 초기 시칸은 750~900년이고, 바탄 그란데에서는 800년 무렵 도시 포마가 세워졌다. 중기 시칸은 900~1100년으로, 바탄 그란데의 시칸 구역 흙 둔덕은 900~1050년 무렵에 지어졌다. 시칸 미술은 시칸 신과, 그 땅 위의 분신으로 여겨지는 시칸의 군주를 되풀이해 그렸고, 금속 공예로 이름이 났다. 라 레체 계곡에서 나온 금제 의례 가면은 900~1100년의 것으로 알려져 있다. 시칸 이전 이 땅의 중심은 모체였고(「모체 문화와 나스카 문화의 끝(600~800)」(앞의 사건)), 시칸이 모체의 뒤를 이었다. 건국 전승은 나이람라프의 이야기다. 미겔 카베요 발보아가 1586년에 적은 책이 처음 전한다고 하며, 바다를 건너 온 우두머리 나이람라프가 이 땅의 첫 왕이 되었다는 줄거리여서 사료라기보다 16세기에 기록된 전승으로 읽어야 한다. 중기 시칸의 끝은 재난으로 설명된다. 1020년 무렵부터 약 30년의 큰 가뭄이 들었고, 1050~1100년 사이에 신전이 불타고 버려졌으며, 1100년 무렵 엘니뇨 홍수가 피해를 더했다. 이후 후기 시칸의 중심은 투쿠메로 옮겨 갔고, 투쿠메는 약 250년 동안 사람이 살았다. 시칸 문화의 끝은 1375년 무렵 남쪽의 치무가 람바예케를 정복하면서 왔다(「치무의 람바예케 정복과 시칸 문화의 끝(1375~1400)」(뒤의 사건)). 뉴욕 메트로폴리탄 미술관이 가진 시칸 장례 가면도 9~11세기의 것으로 알려져 있다. 건국 전승은 치무 쪽에도 있어, 시칸의 나이람라프에 대응하는 치무의 시조는 타카이나모다(「치무의 찬찬과 찬카이 문화(900~1100)」(뒤의 사건))."
  subjects: [sican-culture]
  tags: [culture, society]
  sources: ["Izumi Shimada, Cultura Sicán: Dios, riqueza y poder en la costa norte del Perú (Edubanco, 1995)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru, rev. ed. (Thames & Hudson, 2001)", "Miguel Cabello de Balboa, Miscelánea Antártica (1586)", "Sicán, Wikipedia (en)"]

- id: mississippian-800
  year: 800
  endYear: 1200
  title:
    ko: "미시시피 문화와 카호키아(800~1200)"
  summary:
    ko: "미시시피 문화는 미시시피강 유역과 그 둘레에서 옥수수 농사에 기대 큰 마을을 이루고 꼭대기가 평평한 흙 둔덕 위에 건물을 세운 사회로, 800년 무렵부터 퍼졌다고 보나 1000년 무렵부터로 적는 문서도 있다. 여러 추장국이 따로 다스렸다. 그 가운데 가장 큰 도시가 오늘날 일리노이주 세인트루이스 맞은편의 카호키아다. 이곳은 600년 무렵부터 사람이 살았고 둔덕은 9세기부터 지어지기 시작했으며, 1050년 무렵 갑자기 사람이 몰려 도시가 커졌다. 그전 인구는 천 명 안팎이었으나 2007년의 연구는 약 1.8제곱킬로미터의 조밀한 중심부 인구가 1050~1100년에 1,400~2,800명에서 1만 200~1만 5,300명으로 늘었다고 추산한다. 도시 전체의 정점 추산은 6천~4만 명으로 갈리고, 1100년 무렵 약 16제곱킬로미터에 1만 5천~2만 명이라는 값도 쓰인다. 몽크스 마운드는 높이 약 30미터, 길이 약 290미터, 너비 약 255미터에 부피가 약 62만 2천 세제곱미터로, 멕시코 북쪽에서 가장 큰 흙 둔덕이다. 4단으로 쌓였고 열 번 가까운 공사를 거쳤다. 서쪽 약 850미터에는 900~1100년 무렵 목재 기둥을 둥글게 세운 우드헨지가 있었다. 1960년대 초 발견되어 원이 다섯 번 바뀌었음이 밝혀졌다. 원래 둔덕은 약 120개였고 지금은 약 80개가 남았다. 1100~1200년은 정치 집중이 가장 컸던 시기로 불리고, 1160~1170년 무렵 도시 동쪽 구역이 불탔으며 1175년 무렵 큰 목책이 처음 세워졌다. 인구는 12세기 말부터 줄어 13세기 중반에는 적어도 절반이 되었다(뒤는 「카호키아의 쇠퇴와 호호캄의 끝(1350~1450)」(뒤의 사건))."
  subjects: [mississippian-culture]
  tags: [society, culture]
  sources: ["Timothy R. Pauketat, Cahokia: Ancient America's Great City on the Mississippi (Viking, 2009)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "Cahokia, Wikipedia (en)"]

- id: muisca-tairona-800
  year: 800
  endYear: 1200
  title:
    ko: "무이스카와 타이로나 문화: 콜롬비아 안데스의 사회(800~1200)"
  summary:
    ko: "콜롬비아의 동부 안데스 고원에서는 보고타 평원을 중심으로 무이스카 사람들이 800년 무렵부터 연맹을 이루기 시작했다. 무이스카 이전 시기는 라에레라 호숫가에서 이름을 딴 에레라기로, 기원전 800년 무렵부터 기원후 800년 무렵까지로 잡지만 학계의 합의는 기원전 400년 무렵~기원후 1000년 무렵이다. 초기 무이스카는 문서에 따라 800~1200년 또는 1000~1200년으로 적힌다. 연맹이 닿은 곳은 약 2만 2천 제곱킬로미터이고, 16세기 초 인구는 약 200만 명이라는 추산이 있으나 학계에서 논쟁 중이다. 네모콘과 시파키라는 소금 생산지였고 소몬도코에는 에메랄드 광산이 있었다(자세한 소개는 「히메네스 데 케사다의 무이스카 정복과 산타페데보고타(1537~1540)」(뒤의 사건)). 보고타 북쪽 세스킬레의 과타비타 호수는 스페인 쪽 기록이 새 우두머리를 금가루로 덮어 호수에 금을 바치는 의례를 치렀다고 전하는 곳이다. 북쪽 카리브 해안의 시에라네바다데산타마르타에서는 타이로나 문화가 900년 무렵 모습을 갖추었다. 해안·비탈·고산지의 마을이 하나의 살림 체계를 이루었고 여러 수장국으로 나뉘었으며, 문화의 전통은 늦어도 10~11세기에 자리 잡았다고 본다. 가장 이른 타이로나 금은 300~800년의 네구안헤기에서 나온다. 시우다드 페르디다(테유나)는 800년 무렵 세워졌다고 하며, 산비탈에 낸 169개의 계단식 터와 1,200개의 돌계단이 있고 인구는 2천~8천 명으로 추산된다. 1972년 도굴꾼 가족이 발견했고 고고학자들은 1976년에 도착했다. 타이로나 금세공은 밀랍 거푸집으로 금·은·구리 합금을 부어 만든 펜던트와 입술·코 장신구로 알려졌고, 코기·위와·아르와코·칸쿠아모 사람이 후손으로 여겨진다."
  subjects: [muisca, tairona-culture]
  tags: [society, culture]
  sources: ["Gerardo Reichel-Dolmatoff, Colombia, Ancient Peoples and Places (Thames & Hudson, 1965)", "Muisca Confederation, Wikipedia (en)", "Tairona, Wikipedia (en)", "Ciudad Perdida, Wikipedia (en)"]

- id: chaco-850
  year: 850
  endYear: 1140
  title:
    ko: "차코 캐니언의 큰 집(850~1140)"
  summary:
    ko: "오늘날 미국 뉴멕시코주 북서부의 차코 캐니언은 850년 무렵 조상 푸에블로인의 인구가 빠르게 늘기 시작해(앞의 일은 「바스켓메이커와 조상 푸에블로인의 시작(1~500)」(앞의 사건)) 900~1150년에 이 지역의 큰 문화 중심이 되었다. 큰 집이라 부르는 여러 층의 석조 건물이 협곡 안에 15채쯤 모였고(14채를 주요 건물로 꼽는 문서도 있다), 한 채는 평균 200칸이 넘고 큰 것은 700칸에 이르렀다. 푸에블로 보니토는 넓이가 약 0.8헥타르이고 방이 650칸 넘으며 부분적으로 4층이다. 10세기 무렵 활처럼 굽은 방 약 50칸이 먼저 지어졌다. 그 안의 높은 신분의 무덤은 800~1130년 무렵에 걸친다. 협곡 밖에는 1115년까지 70곳이 넘는 작은 마을이 있었다. 여섯 갈래의 차코 도로망이 협곡을 서른 곳가량의 바깥 마을과 이었는데, 길은 길게는 97킬로미터까지 뻗고 다진 점토 바닥의 너비가 9미터에 이르는 곳도 있었다. 폐허에서는 터키석이 약 20만 점 발굴되었고, 푸에블로 보니토의 무덤 두 곳에서만 1만 5천 개가 넘는 구슬과 펜던트가 나왔다. 쇠퇴는 가뭄과 맞물린다. 1130년부터 약 50년 동안 가뭄이 이어졌고 1140년 무렵 차코의 체계가 흔들리기 시작했으며, 세기말에는 협곡 중심부의 건물이 봉쇄되고 버려졌다. 1250~1450년에는 기후가 다시 오래 불안정했다. 차코 캐니언은 1987년 세계유산에 올랐다. 사람들은 북쪽에서도 마을을 이어 갔으나 그것도 오래가지 못했다(「메사버드의 절벽 주거와 포코너스의 포기(1190~1300)」(뒤의 사건)). 도로의 용도를 두고는 의례용이라는 설과 물자 수송용이라는 설이 갈린다."
  subjects: [ancestral-puebloan-culture]
  tags: [society, economy]
  sources: ["Stephen H. Lekson, A History of the Ancient Southwest (School for Advanced Research Press, 2008)", "Chaco Culture National Historical Park, Wikipedia (en)"]

- id: toltec-900
  year: 900
  endYear: 1150
  title:
    ko: "톨텍의 툴라(900~1150)"
  summary:
    ko: "톨텍은 멕시코 중부 고원의 도시 툴라(오늘날 이달고주의 툴라 데 아옌데, 러시아의 툴라와는 다른 곳)를 도읍으로 삼은 사회로, 문서에 따라 900~1150년 또는 950~1168년 앞뒤에 번성했다고 본다. 피라미드 B, 곧 틀라우이스칼판테쿠틀리 신전 꼭대기에 전사 모습의 돌기둥이 늘어서 있는데, 이 기둥이 톨텍의 상징이다. 툴라 도심의 대로 아래에서는 900~1100년의 톨텍 무덤이 나왔다. 툴라의 가장 큰 구역은 약 16제곱킬로미터이고 인구가 최대 6만 명이라는 추산이 있다. 아즈텍 사람들은 톨텍을 문명의 본보기로 삼아 톨테카요틀, 곧 톨텍다움을 기술과 예술과 도시 생활을 아우르는 말로 썼고 이것을 유목 사냥꾼의 치치메카요틀에 맞세웠다. 전승은 톨텍의 마지막 왕을 케찰코아틀 토필친이라는 사제 왕으로 전한다. 16세기 도미니크회 수사 디에고 두란은 토필친을 대사제로 적었고 그 제자들이 톨텍이라 불렸다고 했으며, 어떤 문서는 그의 즉위를 1085년으로 적는다. 이 인물이 실존했는지는 전승의 문제라 확정할 수 없다. 톨텍을 제국으로 볼 것인가는 학설이 갈린다. 툴라를 테오티우아칸·테노치티틀란과 견준 연구는 그 영향이 작았다고 보아 제국보다 왕국에 가깝다고 결론지었다. 유카탄의 치첸이트사와 건축·도상이 닮은 점에서 톨텍이 정복했는지, 이주했는지, 느슨하게 이어졌는지를 두고 논쟁이 있다(「치첸이트사와 유카탄 북부(900~1200)」(뒤의 사건)). 툴라는 1150년 무렵부터 1168~1179년 사이 무너졌고, 그 원인으로 치치메카 사람들의 정복이 꼽힌다. 『멘도사 코덱스』는 이곳이 티소크 때 정복되어 아즈텍 제국에 들어갔다고 적었다."
  subjects: [toltec]
  tags: [society, politics]
  sources: ["Richard A. Diehl, Tula: The Toltec Capital of Ancient Mexico (Thames & Hudson, 1983)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs, 7th ed. (Thames & Hudson, 2013)", "Toltec, Wikipedia (en)", "Tula, Hidalgo, Wikipedia (en)", "『멘도사 코덱스』(16세기 아즈텍 공물 그림 문서)", "Diego Durán, Historia de las Indias de Nueva España e islas de la Tierra Firme (16세기 말)"]

- id: chichen-itza-900
  year: 900
  endYear: 1200
  title:
    ko: "치첸이트사와 유카탄 북부(900~1200)"
  summary:
    ko: "치첸이트사는 유카탄 반도 북부의 마야 도시로, 750년 무렵 세워져 750~900년에 도시의 핵심 구조가 갖추어졌다고 본다. 문서에 따라 600년 무렵 후기 고전기 끝에 중요해졌다고 적기도 하며, 이트사는 800년 무렵 들어왔다고 한다. 900~1050년에 이 도시는 유카탄 북부와 중부를 아울렀다. 이름은 이트사의 우물 입구라는 뜻이고 이트사를 물의 마법사로 풀이하는 설도 있으며, 이트사는 북부 반도에서 우세해진 혈통 집단이다. 도시 중심부는 적어도 5제곱킬로미터에 이르고 마야 세계에서 인구 구성이 가장 다양했을 수 있다는 평가가 있다. 엘카스티요는 높이 약 30미터, 아홉 단에 밑변 한 변 약 55미터이며 꼭대기에 6미터의 신전이 있다. 큰 공놀이 경기장은 길이 168미터, 너비 70미터에 벽 높이가 8미터이고, 이 도시에는 공놀이 경기장이 모두 열세 개 있다. 성스러운 세노테는 지름 약 60미터로 수면까지 27미터가량 내려간다. 기록된 마야 글씨의 연대는 832년 앞뒤에서 998년 오소리오 신전까지 이어진다. 중부 멕시코와 닮은 점이 톨텍과 어떻게 이어지는지는 「톨텍의 툴라(900~1150)」(앞의 사건)에서 다룬다. 도시는 1100년 무렵 지역 중심 자리를 잃기 시작해 13세기에는 지배층의 활동이 끊겼으나 도시가 완전히 버려졌는지는 분명하지 않다. 『칠람 발람의 책』은 마야판의 장군 후낙 켈이 13세기에 치첸이트사를 쳤다고 전하지만, 고고학 연대로는 그전에 쇠퇴가 시작되어 이 이야기의 연대는 의심스럽다. 남쪽 저지대가 무너진 뒤에도 마야 문명이 북쪽에서 이어진 것이다(「몬테알반의 버려짐과 마야 남부 저지대의 붕괴(750~900)」(앞의 사건)). 뒤는 「마야판의 성립과 코콤 가문(1220~1300)」(뒤의 사건)이 이었다."
  subjects: [chichen-itza, maya-civilization]
  tags: [society, culture]
  sources: ["Michael D. Coe and Stephen Houston, The Maya, 9th ed. (Thames & Hudson, 2015)", "Arthur A. Demarest, Ancient Maya: The Rise and Fall of a Rainforest Civilization (Cambridge University Press, 2004)", "『칠람 발람의 책』(식민 시대 유카탄 마야어 문서)", "Chichen Itza, Wikipedia (en)"]

- id: mixtec-900
  year: 900
  endYear: 1115
  title:
    ko: "믹스텍 나라들과 8사슴 재규어 발톱(900~1115)"
  summary:
    ko: "믹스텍은 멕시코 오악사카 서부와 그 둘레의 믹스테카에 사는 사람들로, 후고전기가 시작되는 900년 무렵부터 틸란통고·투투테펙 같은 여러 작은 나라를 이루었다. 고지대(믹스테카 알타)와 해안, 저지대(믹스테카 바하)의 나라들은 혼인과 동맹으로 얽혔다. 믹스텍은 그림 문서, 곧 코덱스에 왕가의 역사를 남겼는데 그 가운데 『누탈 코덱스』는 8사슴 재규어 발톱의 일대기를 길게 전한다. 8사슴이라는 이름은 260일 달력의 날 이름에서 따온 것이다. 연구자 존 폴의 연대로 그는 1063년 10월 틸란통고에서 태어났다. 1083~1084년 무렵(문서마다 갈린다) 투투테펙의 왕이 되었고, 1097년 6월에는 틸란통고의 왕이 되어 틸란통고(고지대)·투투테펙(해안)·테오사코알코(저지대) 세 곳을 한 사람이 묶었다고 전한다. 1101년에는 라이벌 11바람을 죽였고, 『누탈 코덱스』는 그가 정복한 도시를 94곳으로 센다. 이때 처남 가운데 막내인 4바람 불 뱀을 살려 두었는데, 8사슴의 죽음에 대해서는 해석이 갈린다. 폴은 4바람이 8사슴 밑에서 자랐고 사냥 도중 그를 암살했다고 본 반면, 찰스 만의 책은 4바람이 연합을 이끌어 8사슴을 사로잡아 제물로 바쳤다고 적는다. 죽음은 1115년 11월이고 나이는 쉰둘로 적히지만 만은 쉰다섯이라 한다. 4바람은 1124년과 1125년의 혼인으로 투투테펙 지배를 정당화했다고 한다. 투투테펙은 아즈텍과 직접 싸운 기록이 남아 있지 않다. 믹스텍 귀족은 이웃 사포텍의 옛 무덤도 다시 썼다(「몬테알반의 버려짐과 마야 남부 저지대의 붕괴(750~900)」(앞의 사건)). 믹스텍 나라들의 끝은 「오악사카 정복과 믹스텍·사포텍 나라들(1521~1529)」(뒤의 사건)이 다룬다."
  subjects: [mixtec]
  tags: [politics, culture]
  sources: ["Kent V. Flannery and Joyce Marcus, The Cloud People: Divergent Evolution of the Zapotec and Mixtec Civilizations (Academic Press, 1983)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "『누탈 코덱스』(믹스텍 그림 문서, Codex Zouche-Nuttall)", "Eight Deer Jaguar Claw, Wikipedia (en)"]

- id: wari-tiwanaku-end-900
  year: 900
  endYear: 1000
  title:
    ko: "와리 문화와 티와나쿠의 쇠퇴(900~1000)"
  summary:
    ko: "와리 문화와 티와나쿠는 중기 지평선의 두 큰 사회로 비슷한 시기에 일어나 비슷한 시기에 기울었다. 와리는 10세기부터 기울었다고 보며 도시 와리의 사람은 1000년 무렵 크게 줄었다. 문서에 따라 이 끝을 1100년 무렵으로 적기도 한다. 도시 와리의 유골은 전성기에도 폭력의 흔적을 보여 주지만 와리가 무너진 뒤에는 그 흔적이 훨씬 늘었고, 여성의 식단도 크게 달라졌다. 붕괴 뒤 무덤에는 파헤친 흔적이 남았다. 심한 가뭄이 붕괴를 키웠을 것이라고 보며, 환경 변화와 내부의 사회·정치 갈등도 원인으로 꼽힌다. 티티카카호 남쪽의 티와나쿠는 1000년 무렵 토기 생산이 멈추고, 가장 큰 식민지인 모케과와 이슬라 델 솔의 거점, 수도의 도시 중심부가 몇십 년 안에 버려졌다고 한다. 수도의 최대 인구는 초기 추산으로 1만 5천~3만 명이고 최근 조사로는 1만~2만 명이다. 태양의 문 같은 돌문은 쓰러져 부서졌고, 푸투니 복합 시설은 불탔으며 저장 항아리가 깨졌다. 가뭄 때문에 호숫가 두둑 밭이 쓸모없어져 먹을 것의 여유와 지배층의 힘이 줄었다는 설명이 오래 있었다. 그러나 더 정교한 연대는 가뭄이 붕괴보다 뒤에 시작되었다고 시사해 이 설명은 도전받고 있다. 두둑 밭을 쓴 마지막 해는 1150년까지 늘려 잡기도 한다. 두 사회는 도상이 닮아 교류했음은 분명하나 서로의 관계는 알려지지 않았고, 와리의 몰락이 티와나쿠의 붕괴와 어떻게 이어졌는지도 분명하지 않다(와리의 팽창은 「와리의 팽창과 피키약타(600~800)」(앞의 사건)). 티와나쿠가 무너진 뒤 사람들이 남쪽으로 옮겨 칠레의 마푸체 사회에 영향을 주었다는 가설도 있으나 하나의 가설일 뿐이다."
  subjects: [wari, tiwanaku]
  tags: [society, politics]
  sources: ["Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru, rev. ed. (Thames & Hudson, 2001)", "William H. Isbell and Gordon F. McEwan (eds.), Huari Administrative Structure: Prehistoric Monumental Architecture and State Government (Dumbarton Oaks, 1991)", "Tiwanaku Empire, Wikipedia (en)", "Wari Empire, Wikipedia (en)"]

- id: chimu-chancay-900
  year: 900
  endYear: 1100
  title:
    ko: "치무의 찬찬과 찬카이 문화(900~1100)"
  summary:
    ko: "치무는 900년 무렵 페루 북부 해안의 모체 골짜기에서 모체 문화의 뒤를 이어 일어났다. 치무의 구전은 시조 타카이나모가 발사나무 뗏목을 타고 바다를 건너와 모체 골짜기에 닿았다고 전하며, 그가 도읍 찬찬을 세웠다고 한다. 문서의 계보는 타카이나모(1305년 무렵), 와크리 카우르(1340년 무렵), 난셈핀코(1375년 무렵), 민찬카만(1462~1470년 무렵)을 들지만 그 사이의 왕이 빠졌을 수 있고 연대도 전승의 값이다. 찬찬은 흙벽돌 담이 9미터에 이르는 열 개의 구획 단지를 둔 큰 도시였다. 찬찬의 인구는 약 3만 명으로 추산되며 가장자리 마을에만 약 2만 6천 명이 살았다는 서술도 있고, 치무 후기에는 약 1만 2천 명의 장인이 이곳에서 일했다고 한다. 치무는 처음 얻은 골짜기들은 뜻을 모아 합쳤고 시칸 문화의 땅은 정복으로 얻었다고 설명된다(「시칸 문화와 바탄 그란데(750~1100)」(앞의 사건)). 그 정복은 「치무의 람바예케 정복과 시칸 문화의 끝(1375~1400)」(뒤의 사건)이 다룬다. 중부 해안에서는 찬카이 문화가 1000년 무렵부터 1470년 무렵까지 이어졌다. 중심은 리마 북쪽 약 80킬로미터의 찬카이와 치욘 골짜기이고, 문화는 파티빌카에서 루린에 이르는 여덟 골짜기에 걸쳤다. 도자기는 흰 바탕에 검은색이나 갈색으로 그림을 그렸고, 열린 그릇에 그린 그림은 400종이 넘으나 아직 읽히지 않는다. 직물로도 이름났으며 종교·주술에 쓰는 얇은 천은 죽은 이의 머리를 덮었다. 귀족 무덤에서는 큰 점토 여인상과 턱이 크고 두 팔을 든 작은 우상 쿠치밀코가 나왔다. 치무는 1400년대 초 찬카이 남쪽 일부를 정복했고 잉카는 1450년 무렵 두 곳을 차지했다고도 하나, 찬카이 문화는 1470년 무렵에 끝난 것으로 본다(「투팍 잉카 유팡키의 북쪽 원정과 치무 정복(1463~1471)」(뒤의 사건))."
  subjects: [chimu, chancay-culture]
  tags: [society, culture]
  sources: ["Michael E. Moseley and Kent C. Day (eds.), Chan Chan: Andean Desert City (University of New Mexico Press, 1982)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru, rev. ed. (Thames & Hudson, 2001)", "Chimú culture, Wikipedia (en)", "Chancay culture, Wikipedia (en)"]

- id: norse-greenland-985
  year: 985
  endYear: 1021
  title:
    ko: "붉은 에이리크의 그린란드 정착과 빈란드(985~1021)"
  summary:
    ko: "노르드인 그린란드 정착은 붉은 에이리크가 이끈 이주에서 비롯되었다(에이리크가 아이슬란드를 떠난 사연은 「하프르스피오르(872 무렵)에서 그린란드(985 무렵)까지: 노르웨이 왕국과 북대서양의 정착」(앞의 사건)). 정착은 986년 뒤로 적는 문서도 있으며, 따라온 사람은 약 700명이고 배 25척 가운데 14척이 닿았다고 전한다. 정착지는 남쪽의 동쪽 정착지와 북쪽의 서쪽 정착지, 둘 사이의 작은 중간 정착지로 나뉘었다. 농가 터는 동쪽에 약 500곳, 서쪽에 95곳, 중간에 20곳으로 모두 약 620곳이다(집계마다 갈린다). 동쪽에는 교회가 열여섯 곳과 수도원이 있었다. 인구는 정점에 2천~1만 명으로 추산되나 최근에는 낮은 쪽인 2천 5백 명 안팎으로 보는 추산이 나왔다. 에이리크의 농장 브라타흘리드에는 길이 24미터의 큰 방이 있었고, 주교좌 가르다르의 첫 주교 아르날드르는 1126년부터 있었다. 바다코끼리 엄니는 유럽에 파는 주요 교역품이었다. 빈란드 이야기는 두 사가가 다르게 전한다. 『그린란드인의 사가』에서는 비아르니 헤르욜프손이 새 해안을 먼저 보았고, 약 15년 뒤 에이리크의 아들 레이프 에이릭손이 그 배를 사서 35명과 헬루란드·마르클란드를 거쳐 빈란드에 닿았다. 『붉은 에이리크의 사가』에서는 레이프가 노르웨이에서 그린란드로 가다 길을 잃어 야생 포도와 저절로 자란 밀을 보았다고 한다. 레이프의 항해는 1000년 무렵으로 보지만 문서가 정확한 해를 주지는 않는다. 캐나다 뉴펀들랜드 북단 랑스 오 메도즈 유적의 목재는 나이테 연대로 1021년이 확인되어 유럽인이 대서양을 건넌 가장 이른 확실한 해이고, 방사성 탄소로는 990~1050년이다. 토르핀 칼세프니의 원정대는 원주민과 처음에 교역했으나 충돌했고, 사가는 이들을 스크렐링이라 불렀다. 이 낱말은 옛 노르드어로 비천한 사람쯤을 뜻한다. 그린란드 정착의 끝은 「흐발세이 결혼 기록과 노르드인 그린란드 정착의 끝(1408~1450)」(뒤의 사건)이 다룬다."
  subjects: [norse-greenland]
  tags: [society, economy]
  sources: ["『그린란드인의 사가』·『붉은 에이리크의 사가』(13세기 아이슬란드 사가, 빈란드 사가)", "Birgitta Linderoth Wallace, Westward Vikings: The Saga of L'Anse aux Meadows (Historic Sites Association of Newfoundland and Labrador, 2006)", "Norse settlements in Greenland, Wikipedia (en)", "Leif Erikson, Wikipedia (en)"]

- id: thule-dorset-1000
  year: 1000
  endYear: 1300
  title:
    ko: "툴레인의 동쪽 이동과 도싯 문화의 끝(1000~1300)"
  summary:
    ko: "툴레인은 1000년 무렵 알래스카 해안에서 모습을 갖춘 사람들로 오늘날 이누이트와 유피크의 조상이며, 2014년의 유전 연구는 이들을 알래스카 북서부의 버니르크 문화와 이었다. 900~1100년에 이 전통이 먼저 서쪽으로, 이어 동쪽으로 퍼졌고 그린란드에는 13세기에 닿았다. 동쪽으로 간 까닭으로는 북극고래를 따라갔다는 설, 바다가 따뜻해졌다는 설, 전쟁, 철을 찾아서라는 설이 있고 어느 것도 정해지지 않았다. 개썰매와 우미악이라 부르는 큰 가죽배, 카약이 이동의 밑받침이었고 작살 끝은 뼈로 만들었으며 가죽 부표가 달렸다. 철은 운석에서 얻었고 노르드인과의 교역에서 간접으로도 들어왔다. 북극고래 사냥은 식량과 기름·연료·건축 재료를 주었고, 고래잡이 좋은 곳에는 집이 열댓 채에서 스무 채쯤 모였으며 한 곳은 약 60채였다. 이 자리에는 도싯 문화가 있었다. 도싯 문화는 「도싯 문화와 북극 해안의 사람들(기원전 500~기원후 500)」(앞의 사건)에서 다룬다. 방사성 탄소 연대로 케임브리지만 둘레에 1350년까지 도싯 사람이 있었다고 하나, 툴레인이 1200년 무렵 닿은 뒤 1300년 무렵까지 도싯이 대체되었다고 본다. 2014년 연구는 19명의 도싯 유골을 분석해 두 집단 사이에 유전·문화 교류의 증거가 거의 없다고 했다. 사라진 까닭은 중세 온난기의 해빙 감소, 새 질병, 적응 실패 같은 설이 있으나 확정할 수 없다. 노르드인과 맞닥뜨린 일은 있었으나 그린란드 노르드인과 툴레인 사이에도 유전적 섞임은 없었다(앞의 일은 「붉은 에이리크의 그린란드 정착과 빈란드(985~1021)」(앞의 사건)). 소빙기로 열린 바다의 철이 짧아져, 높은 북극의 툴레인 마을은 1600년 무렵 버려졌다. 이름은 그린란드 북서부 툴레(지금의 피투피크)에서 따왔다."
  subjects: [thule-culture, dorset-culture]
  tags: [society, culture]
  sources: ["Robert McGhee, Ancient People of the Arctic (UBC Press, 1996)", "Thule people, Wikipedia (en)", "Dorset culture, Wikipedia (en)"]

- id: mesa-verde-1190
  year: 1190
  endYear: 1300
  title:
    ko: "메사버드의 절벽 주거와 포코너스의 포기(1190~1300)"
  summary:
    ko: "메사버드는 오늘날 미국 콜로라도주 남서부의 고원으로, 5천 곳이 넘는 유적과 약 600곳의 절벽 주거가 남아 있다. 조상 푸에블로인은 이곳에서 약 7세기 동안 끊이지 않고 살았고(차코 캐니언의 큰 문화는 「차코 캐니언의 큰 집(850~1140)」(앞의 사건)), 12세기 말부터 사암 절벽 아래 움푹한 곳에 마을을 지었다. 클리프 팰리스는 그 가운데 가장 이름난 절벽 주거다. 1276~1299년의 큰 가뭄이 이 긴 정착을 끝냈다. 나이테가 이 가뭄을 보여 주며, 마지막 사람들이 1285년 무렵 떠났다고 적는 문서와 1300년 무렵 북쪽 마을이 비었다고 하는 문서가 있다. 사람들은 포코너스, 곧 네 주가 만나는 지역의 북쪽을 비우고 남쪽과 동쪽으로 옮겨 갔다. 옮겨 간 곳으로는 리오차마·앨버커키 분지·파하리토 고원·상그레데크리스토 산자락, 리틀콜로라도강과 뉴멕시코 서부·애리조나 동부 등이 꼽힌다. 아코마·주니·헤메스·라구나 같은 지금의 푸에블로 공동체가 이들의 후손으로 이어진다. 이 이동은 한 번의 사건이 아니라 차코 캐니언 때부터 이어진 오랜 기후 압박 속의 일이었다. 절벽 주거는 오랜 세월 비어 있다가 1888년 12월 18일 목장을 하던 리처드 웨더릴이 동행 찰리 메이슨과 클리프 팰리스에 닿으면서 알려졌다. 1906년 6월 29일 국립공원이 되었고 1978년 세계유산에 올랐다. 푸에블로 사람들에게 이곳은 예부터 알려진 조상의 땅이다. 절벽 주거에도 의식을 치르는 둥근 방 키바가 있었고, 고원 위에서는 빗물에 기대는 건조 농법으로 옥수수와 콩, 호박을 길렀고 물을 모으는 저수지도 있었다. 차코와 달리 이 절벽 마을들은 큰 도로망 없이 골짜기별로 흩어져 있었다."
  subjects: [ancestral-puebloan-culture]
  tags: [society, culture]
  sources: ["Stephen H. Lekson, A History of the Ancient Southwest (School for Advanced Research Press, 2008)", "Mesa Verde National Park, Wikipedia (en)"]

- id: taino-kalinago-1200
  year: 1200
  endYear: 1250
  title:
    ko: "타이노 카시케 사회와 칼리나고의 작은 앤틸리스 이주(1200~1250)"
  summary:
    ko: "타이노인은 대앤틸리스 제도에 사는 농경 사회로(앞의 일은 「타이노인 조상의 대앤틸리스 확산(400~600)」(앞의 사건)), 마을은 카시케 또는 여성 카시카가 다스렸다. 여러 마을이 카시카스고라는 수장국을 이루고 수장국들은 연합했다. 히스파니올라는 다섯 카시카스고로 나뉘었다. 사회에는 카시케, 귀족인 니타이노, 사제 보히케, 일하는 농민 나보리아의 네 층이 있었고, 수장 자리는 어머니 쪽으로 이어져 남자 수장은 자기 아들보다 누이의 아들이 잇기 쉬웠다. 카시케는 일부다처로 여러 지방과 혼인 동맹을 맺었다. 신앙의 중심은 조상과 정령을 뜻하는 세미로, 나무로 깎은 상에도 이 말을 썼고 아타베이와 그 아들 유카후가 큰 세미였다. 바테이는 열 명에서 서른 명이 한 편이 되어 고무공으로 치른 의례 공놀이로, 가장 공들인 경기장은 수장국의 경계에 있었다. 콜럼버스 앞의 인구는 연구자마다 히스파니올라 1만~100만 명으로 갈리고, 한 추산은 50만 명을 최대로 보며, 2020년 유전 분석은 타이노 조상 집단이 많아야 수만 명이었다고 했다. 라스카사스의 숫자는 지금은 과장된 것으로 본다. 남쪽 소앤틸리스에는 칼리나고, 곧 카리브족이 있었다. 카리브족은 1200년 무렵 오리노코강 쪽에서 건너왔다는 설이 오래 있었고, 카요 토기가 그레나다와 세인트빈센트에서 1250년 무렵의 방사성 탄소 연대로 나온다. 이들의 말은 아라와크 계통이었다. 소규모 카리브 무리가 원래 사람들을 정복했다는 설과 침략의 증거가 부족하다는 반론이 맞선다. 타이노인은 콜럼버스에게 카리브족이 사람을 잡아먹는다고 말했으나 식인의 확실한 증거는 없고, 이 이야기가 유럽의 군사 원정을 정당화하는 데 쓰였다는 비판이 있다. 지금 도미니카섬에는 약 3천 4백 명의 칼리나고가 약 15제곱킬로미터의 구역에 산다(2008년)."
  subjects: [taino-culture, carib]
  tags: [society, culture]
  sources: ["Irving Rouse, The Tainos: Rise and Decline of the People Who Greeted Columbus (Yale University Press, 1992)", "Taíno, Wikipedia (en)", "Bartolomé de las Casas, Historia de las Indias (16세기)", "Kalinago, Wikipedia (en)"]

- id: mayapan-1220
  year: 1220
  endYear: 1300
  title:
    ko: "마야판의 성립과 코콤 가문(1220~1300)"
  summary:
    ko: "마야판은 1220년대부터 1440년대까지 유카탄 북부의 마야 정치·문화 중심이었다. 이곳의 이른 시기 연대로 중심 피라미드의 초기 단계가 1020~1170년의 방사성 탄소 값을 준다는 문서도 있어, 1220년의 성립 해는 문헌에 기댄 값이다. 치첸이트사가 쇠퇴한 뒤(「치첸이트사와 유카탄 북부(900~1200)」(앞의 사건)) 새 도시가 세워지자 코콤이라는 부유하고 오랜 가문의 우두머리가 지배자로 뽑혔다고 전한다. 식민 시대의 『칠람 발람의 책』이 전하는 장군 후낙 켈의 고향 텔차키요가 마야판 가까이에 있다. 도시는 길이 9.1킬로미터의 성벽이 4.2제곱킬로미터를 둘러싸고 있으며 문은 열두 개이고 그 가운데 일곱 곳이 큰 출입구다. 벽 안에서 확인된 건물은 4천 채가 넘고 대부분 주거였으며, 성벽 밖 약 500미터까지 집이 이어졌다. 성벽 안 인구는 1만~1만 2천 명, 바깥까지 합하면 1만 5천~1만 7천 명이라는 서로 다른 추산이 있다. 도시 안 주거 구역에는 세노테가 약 40개 있었다. 주 신전은 치첸이트사의 엘카스티요를 본뜬 쿠쿨칸 신전으로 계단이 네 개이고 아홉 단이지만, 열등한 모방이라는 평가를 받는다. 이 도시는 주변 도시들이 동맹한 중심이었다. 슈 가문은 코콤이 오기 전부터 이곳 둘레에 살았을 수 있고 욱스말의 혈통을 주장했으며, 이들이 1441년 반란을 이끌게 된다(「마야판의 몰락과 유카탄의 작은 나라들(1441~1461)」(뒤의 사건)). 마야 문명의 후기 중심이던 마야판에서 나온 흑요석은 모두 과테말라 엘 차얄 산지의 것이었고, 카네기 연구소가 1950년대에 5년 동안 이곳을 조사해 보고서를 1962년에 냈다. 마야판을 연맹으로 부르는 것은 주변 도시들이 마야판을 중심으로 동맹했다고 보는 학설에 따른 것이다."
  subjects: [mayapan, maya-civilization]
  tags: [politics, society]
  sources: ["Marilyn A. Masson and Carlos Peraza Lope, Kukulcan's Realm: Urban Life at Ancient Mayapán (University Press of Colorado, 2014)", "Michael D. Coe and Stephen Houston, The Maya, 9th ed. (Thames & Hudson, 2015)", "『칠람 발람의 책』(식민 시대 유카탄 마야어 문서)", "Mayapan, Wikipedia (en)"]
