- id: maji-maji-1905
  year: 1905
  endYear: 1907
  title:
    ko: "마지마지 봉기(1905~1907)"
  summary:
    ko: "독일령 동아프리카는 1890년대부터 남부 주민에게 면화 강제 재배와 인두세, 노동 징발을 지워 불만이 쌓여 있었다. 1898년 이후 인두세를 현금으로 내야 하게 된 주민들은 돈을 구하려 면화 재배와 노동에 매여 있었다. 1905년 7월 31일 마툼비 지방의 주민들이 독일이 시킨 면화밭을 뽑아 버리며 반란이 시작되었다. 영매 킨지키틸레 응왈레가 '마지'(스와힐리어로 물)를 몸에 바르면 총알이 물로 변한다고 가르쳤다고 전하며, 이를 믿은 스무 곳 안팎의 민족 집단이 한뜻으로 들고 일어났다. 킨지키틸레는 곧 붙잡혀 처형되었지만 봉기는 남부 곳곳으로 번졌다. 총독 구스타브 아돌프 폰 괴첸은 아스카리(현지 출신 병사)와 증원 병력을 풀어 마을과 곡식밭을 불태우는 초토화로 맞섰다. 이어 닥친 극심한 기근(우카메)이 희생을 키웠고, 마지막 저항은 1907년 8월에 꺾였다. 사망자는 7만 5천~30만 명으로 추산되며 대부분 기근과 질병으로 죽었다. 독일 쪽 사망은 독일인 15명과 아스카리 73명으로 집계된다. 이 반란은 독일의 식민 통치가 폭력과 강제 노동에 기대고 있음을 드러냈다. 1907년 식민청 장관에 오른 베른하르트 데른부르크는 원주민 보호와 경제 개발을 앞세운 개혁을 내걸었고, 남부에서는 면화 강제 재배를 줄이고 소농 경작을 장려하는 쪽으로 방침이 바뀌었다. 훗날 탕가니카의 독립 운동은 마지마지를 민족의 기억으로 끌어다 썼다. 이 땅은 1차 대전 중 점령되었다가 1920년 영국령 탕가니카 등으로 나뉜다(「1차 세계 대전의 아프리카 전선(1914~1918)」, 「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」, 뒤의 사건)."
  subjects: [german-east-africa, german-empire]
  tags: [war, society]
  sources: ["John Iliffe, A Modern History of Tanganyika (Cambridge University Press, 1979)", "Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)"]

- id: nigeria-amalgamation-1906
  year: 1906
  endYear: 1914
  title:
    ko: "라고스 합병과 나이지리아 통합(1906~1914)"
  summary:
    ko: "1861년 영국이 병합한 라고스 식민지는 1906년 5월 1일 남나이지리아 보호령과 합쳐졌다. 남나이지리아 보호령은 니제르 해안 보호령이 1900년 1월 1일 이름을 바꾼 것으로, 1901~1902년 영국-아로 전쟁으로 이그보 내륙까지 영국의 지배가 닿았다. 한편 북쪽에서는 1900년부터 1906년까지 루가드 고등 판무관이 세운 북나이지리아 보호령이 소코토 칼리프국의 에미르들을 통해 다스리는 간접 통치를 펼쳤다. 1911년 라고스에서 올라온 철도가 북쪽의 카노에 닿았다. 북쪽은 세수가 모자라 적자였고 남쪽은 관세 덕에 흑자였기 때문에, 영국 식민성은 두 보호령을 합쳐 재정을 합치고 철도·행정을 하나로 운영하려 했다. 1911년 식민성은 루가드에게 통합을 맡아 달라고 요청했고, 홍콩 총독을 지낸 그는 1912년 나이지리아로 돌아와 준비를 맡았다. 1914년 1월 1일 라고스 식민지·남나이지리아 보호령·북나이지리아 보호령이 나이지리아 식민지 및 보호령으로 합쳐져 루가드가 초대 총독이 되었다. 나이지리아라는 이름은 1890년대 언론인 플로라 쇼가 널리 퍼뜨렸다. 통합 식민지의 도읍은 라고스였고, 통합 뒤에도 북부는 에미르를 통한 간접 통치를, 남부는 별도의 행정 체계를 유지했다. 북부 에미르들은 자체 재판소와 세금 제도도 이어 갔다. 남나이지리아의 마지막 총독은 월터 이건턴(1904~1912)이었다. 1916년 루가드는 전통 지배자들까지 참여하는 나이지리아 협의회를 세웠다. 합쳐진 땅은 영국령 아프리카에서 인구가 가장 많은 식민지가 되었다. 이 식민지는 1960년 독립까지 이어진다(「나이지리아 연방의 독립(1954~1960)」, 뒤의 사건)."
  subjects: [lagos-colony, southern-nigeria-protectorate, northern-nigeria-protectorate, british-nigeria, uk]
