# 사하라 이남 사건 1묶음 갈래 06: 제2차 보어 전쟁, 분할 끝의 식민 지배 정비, 1차 대전, 위임 통치, 이탈리아의 에티오피아 점령과 1941년 해방 (1899 ~ 1945년)
# 범위: 제2차 보어 전쟁과 남아프리카 연방, 황금 의자 전쟁과 소코토 정복(영국의 서아프리카 병합), 프랑스령 서아프리카·적도 아프리카의 정비와 노이카메룬, 헤레로·나마 학살과 마지마지 봉기, 나이지리아 통합,
#   벨기에의 콩고 병합, 와다이·다르푸르 정복과 라도 고립 지역, 원주민 토지법, 1차 대전의 아프리카 전선과 위임 통치령, 로디지아, 이탈리아의 소말리아 정복과 에티오피아 점령·해방, 마다가스카르 전투, 브라자빌 회의와 맨체스터 범아프리카 회의.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 연속된 과정은 한 사건에 묶었고 올트레 주바 이양과 루돌프 지방 이관은 이탈리아의 소말리아 정복 사건에 한 구절로 넣었다.
# 날짜: 모두 그레고리력. 확실하지 않은 날짜는 '무렵'으로 적었고 조약은 서명 해와 발효 해를 가렸다. 이름 규칙: 도시와 나라는 그때 이름을 쓰고 지금 이름을 한 번 덧붙였다(프랑스령 오트볼타, 남아프리카 연방(지금 남아프리카 공화국)).
# 지도 결정과의 관계: 연방(프랑스령 적도 아프리카·남아프리카 연방)은 구성 단위 항목으로 글과 subjects를 맞췄고, 독일 식민지 넷은 1차 대전 점령 중에도 1919년까지 독일령으로 서술해 1920년 위임 통치령으로 바뀐 때를 분명히 했다.
#   이탈리아의 에티오피아 점령(1936~1941)은 영토는 에티오피아 그대로 두고 병합 선언과 국제 연맹의 불승인을 사실대로 '점령'으로 적었다. 분쟁·학살(헤레로·나마, 마지마지, 예카팃 12)은 일어난 일과 숫자의 범위만 적었다.
# 한국사와 닿는 점: 이 갈래에는 직접 닿는 사건이 없다. 기존 사건은 「제목」으로 가리켰다(아프리카 분할과 베를린 서아프리카 회의 외 여럿).

- id: second-boer-war-1899
  year: 1899
  endYear: 1902
  title:
    ko: "제2차 보어 전쟁과 베르니이헝 조약(1899~1902)"
  summary:
    ko: "1899년 10월 11일 트란스발 공화국과 오라녀 자유국이 영국에 맞서 전쟁에 들어갔다. 트란스발 공화국의 폴 크뤼거 대통령은 비트바테르스란트 금광으로 몰려든 외국인에게 참정권을 주라는 영국의 요구와 영국군 증강을 주권 침해로 보아 10월 9일 최후통첩을 보냈다(앞선 대결은 「영국의 트란스발 병합과 제1차 보어 전쟁(1877~1881)」, 앞의 사건). 보어 기마 부대는 나탈과 케이프 식민지로 들어가 마피켕·킴벌리·레이디스미스를 포위하고, 12월 '검은 주간'에 영국군을 잇달아 물리쳤다. 1900년 로버츠 원수가 병력을 늘려 2월 킴벌리와 레이디스미스를 구원하고 3월 13일 블룸폰테인, 5월 17일 마피켕, 5월 31일 요하네스버그, 6월 5일 프리토리아를 차지했다. 영국은 5월 28일(5월 24일자로 소급) 오라녀 자유국을, 9월 1일 트란스발을 병합한다고 선포했다. 크뤼거가 유럽으로 떠난 뒤에도 루이스 보타·얀 스뮈츠 같은 지휘관의 유격대가 싸움을 이어가자, 키치너는 농장 불태우기와 철조망 요새선으로 맞서며 보어 여성·어린이 10만여 명을 수용소에 가두었다. 수용소에서 보어 여성·어린이 약 2만 6천 명이 죽었고, 따로 가둔 흑인 아프리카인도 약 1만 4천~2만 명이 죽은 것으로 추산된다. 1902년 5월 31일 프리토리아에서 맺은 베르니이헝 조약으로 보어 지도부는 항복해 에드워드 7세의 주권을 받아들였고, 영국은 네덜란드어 사용 허용·재건비 지원·장차 자치를 약속하면서 흑인 참정권 문제는 자치 정부에 미루었다. 영국군 사망은 병사 포함 약 2만 2천 명, 보어 전사자는 약 6천 명이다. 두 공화국은 트란스발 식민지와 오렌지강 식민지가 되었고, 1903년에는 트란스발 동남쪽의 빌크레이·위트레흐트 지방이 나탈 식민지에 붙었다. 이 영국령 식민지들은 1910년 하나로 합쳐진다(「남아프리카 연방의 성립(1909~1910)」, 뒤의 사건)."
  subjects: [south-african-republic, orange-free-state, transvaal-colony, orange-river-colony, uk, cape-colony, natal]
