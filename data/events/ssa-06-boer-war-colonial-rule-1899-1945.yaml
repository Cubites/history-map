  sources: ["John Iliffe, Africans: The History of a Continent (Cambridge University Press, 2nd ed., 2007)", "Roland Oliver and Anthony Atmore, Africa since 1800 (Cambridge University Press, 5th ed., 2005)", "Robert O. Collins, Land Beyond the Rivers: The Southern Sudan, 1898–1918 (Yale University Press, 1971)"]

- id: french-equatorial-africa-1903
  year: 1903
  endYear: 1910
  title:
    ko: "우방기샤리와 프랑스령 적도 아프리카(1903~1910)"
  summary:
    ko: "1880년대 브라자가 콩고강 오른쪽 기슭에 세운 프랑스령 콩고는 1899년부터 수십 개의 양허 회사에 땅과 산물 채취권을 나눠 주는 방식으로 운영되었다(앞선 경위는 「리브르빌에서 브라자까지: 프랑스령 콩고의 성립(1849~1886)」, 앞의 사건). 강 건너 콩고 자유국이 고무 수탈로 비판받던 때에 이 회사들 밑에서도 강제 노동과 강압적 징발이 이어졌다. 1905년 브라자가 실태 조사단을 이끌었으나 돌아오는 길인 9월 14일 다카르에서 죽었고, 조사 보고서는 널리 공개되지 못했다. 한편 1903년 12월 29일 우방기·샤리 지방이 우방기샤리(우방기샤리-차드 식민지)로 따로 서서 오늘날 중앙아프리카 공화국과 차드 남부를 아우르는 새 행정 구역이 생겼다. 1906년 프랑스령 콩고는 프랑스령 가봉과 프랑스령 중앙콩고, 우방기샤리-차드로 나뉘어 이름이 사라졌다. 세 식민지는 1908년 한 총독 아래 묶였고, 초대 총독은 마르시알 메를랭이었다. 1910년 1월 15일 법령으로 브라자빌을 수도로 하는 프랑스령 적도 아프리카가 연방으로 정식 출범했고, 차드까지 합친 넓이는 약 2백 50만 km²에 이르렀다. 연방 출범 때 가봉의 도읍은 리브르빌, 중앙콩고의 도읍은 브라자빌, 우방기샤리의 도읍은 방기였다. 프랑스령 적도 아프리카는 가봉·중앙콩고·우방기샤리를 구성 단위로 하는 연방이었고, 차드는 1920년 우방기샤리에서 갈라져 별도의 식민지가 되었다. 이 연방은 1958년까지 이어져 1958~1960년의 독립 사건에서 네 나라로 갈라진다(「프랑스령 적도 아프리카 네 나라의 독립: 차드·중앙아프리카·가봉·콩고(1958~1960)」, 뒤의 사건)."
  subjects: [french-ubangi-shari, french-gabon, french-middle-congo, french-congo, france]
  links:
    - { from: france, to: french-ubangi-shari, note: "우방기샤리를 세움 (1903)" }
  tags: [politics, economy]
  sources: ["Catherine Coquery-Vidrovitch, Le Congo au temps des grandes compagnies concessionnaires 1898–1930 (Mouton, 1972)", "Patrick Manning, Francophone Sub-Saharan Africa 1880–1995 (Cambridge University Press, 2nd ed., 1998)"]

- id: herero-nama-1904
  year: 1904
  endYear: 1908
  title:
    ko: "헤레로·나마 학살(1904~1908)"
  summary:
    ko: "1904년 1월 12일 독일령 남서아프리카에서 헤레로의 지도자 사무엘 마하레로가 이끄는 반란이 일어났다. 독일 이주민의 땅 잠식과 가축 외상 거래, 이주민의 폭행이 쌓인 끝이었고, 반란군은 이주민 백여 명을 죽였다. 독일 제국은 6월 로타르 폰 트로타 중장을 보내 무력 진압으로 돌아섰다. 8월 11일 바터베르크 전투에서 헤레로 전사와 가족은 포위를 뚫고 오마헤케 사막으로 달아났고, 10월 2일 트로타는 독일 영토 안에 남은 헤레로는 누구든 쏘겠다는 '섬멸 명령'을 내렸다. 독일군은 사막의 우물을 막아 도망친 이들을 물 없는 땅에 가두었다. 황제 빌헬름 2세는 12월 6일 명령을 거두었으나 살아남은 이들은 수용소에 갇혔다. 1904년 가을에는 헨드릭 비트부이가 이끈 나마도 봉기했고, 트로타는 1905년 4월 22일 나마에게도 비슷한 명령을 내렸다. 비트부이는 1905년 10월 29일 전사했고, 나마 전사 약 2천 명이 독일군 최대 1만 4천 명과 맞섰던 유격전은 1907~1908년까지 이어졌다. 뤼데리츠 앞 상어섬을 포함한 수용소에서는 갇힌 사람의 절반 가량이 죽었고, 수용소는 1908년 1월 27일 문을 닫았다. 희생자는 헤레로 4만~8만 명(전체 인구의 약 80%로 추산), 나마 약 1만 명으로 추산된다. 독일 정부는 2015년부터 이 일을 집단 학살이라 부르기 시작했고, 2021년 약 11억 유로의 개발 원조를 약속했으나 법적 배상은 아니라는 입장을 지켰으며, 헤레로·나마 단체 다수는 이 합의를 받아들이지 않았다. 이 땅은 1920년 위임 통치령이 된다(「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」, 뒤의 사건)."
  subjects: [german-south-west-africa, german-empire]
  tags: [war, society]
  sources: ["Jan-Bart Gewald, Herero Heroes: A Socio-Political History of the Herero of Namibia, 1890–1923 (James Currey, 1999)", "Isabel V. Hull, Absolute Destruction: Military Culture and the Practices of War in Imperial Germany (Cornell University Press, 2005)"]
