- id: golden-stool-1900
  year: 1900
  endYear: 1902
  title:
    ko: "황금 의자 전쟁과 영국의 아샨티 병합(1900~1902)"
  summary:
    ko: "아샨티 제국은 1824년부터 영국과 부딪혀 왔고 1874년 영국령 골드코스트 식민지가 세워진 뒤로 힘이 줄었다. 1895년 12월 출발한 영국 원정군은 프렘페 1세가 1874년 전쟁의 배상금을 내지 않고 인신 공희를 이어 간다는 구실로 1896년 1월 쿠마시에 들어가 아샨티헤네(왕) 프렘페 1세를 붙잡아 먼저 시에라리온으로 유배 보냈고, 1900년 세이셸로 옮겼다(1924년 귀환). 아샨티는 영국의 보호 아래 놓였다. 1900년 3월 25일 프레더릭 호지슨 총독이 쿠마시에 와서 아샨티 나라의 혼으로 여겨지는 황금 의자를 내놓으라고 요구했다. 황금 의자는 1701년 무렵 오세이 투투 때 사제 오콤포 아노키에가 하늘에서 불러냈다고 전하는, 아샨티 연합을 하나로 묶는 상징이다. 이에 에지수의 모후 야 아산테와가 전사들을 일으켰다는 전승이 전하며, 아샨티군은 3월 말부터 쿠마시 요새를 포위했다. 4월 29일 요새 공격은 실패했지만 포위는 이어졌고, 6월 23일 호지슨 일행이 포위를 뚫고 빠져나갔다. 7월 15일 윌콕스 소령이 이끈 구원군이 요새에 닿았고, 9월에는 영국의 기동 부대가 봉기를 도운 지방을 돌며 코코푸 같은 곳을 불태웠다. 영국 쪽과 현지 동맹군 사망은 합쳐 1천 명 안팎으로 보이고, 아샨티 쪽 희생은 수천 명으로 전한다. 1901년 영국은 야 아산테와를 비롯한 지도자들을 붙잡아 세이셸로 보냈고, 그는 1921년 그곳에서 죽었다. 1901년 9월 26일 추밀원령으로 아샨티를 영국령 골드코스트 식민지에 병합하는 길이 열렸으며, 1902년 북쪽에는 북부 준주가 따로 두어졌다. 프렘페 1세는 1924년 돌아와 아샨티헤네가 아니라 쿠마시헤네로 인정되었고, 아샨티는 1935년 아샨티 연합으로 되살아난다. 이로써 1701년 무렵 세워졌다고 전하는 아샨티 제국의 독립은 끝났다."
  subjects: [asante, british-gold-coast, uk]
  links:
