- id: haile-selassie-1930
  year: 1930
  endYear: 1935
  title:
    ko: "하일레 셀라시에 1세의 즉위와 에티오피아 헌법(1930~1935)"
  summary:
    ko: "에티오피아는 1896년 아두와 전투에서 이탈리아를 꺾고 독립을 지킨 나라로(「우찰레 조약과 이탈리아령 에리트레아, 아두와 전투(1889~1896)」, 앞의 사건), 북쪽의 이탈리아령 에리트레아와 동쪽의 이탈리아령 소말리아 사이에 끼어 있었다. 메넬리크 2세는 1909년 병이 들어 섭정 타세마 나데우(1909~1911)를 두었고, 손자 리지 이야수가 그 뒤를 이어 섭정을 맡았다. 1913년 12월 12일 메넬리크가 죽자 리지 이야수가 황제로 즉위했지만(이야수 5세로 부르기도 한다) 대관식은 올리지 못했다. 이슬람 세력에 가까워 보이는 행보에 귀족과 교회가 반발해 1916년 9월 27일 폐위되었고, 메넬리크의 딸 자우디투가 여제에, 라스 타파리 마콘넨이 섭정이자 황태자에 올랐다. 에티오피아는 1923년 9월 28일 국제 연맹에 가입했고(「국제 연맹」, 앞의 사건), 타파리는 1924년 유럽 여러 나라를 돌며 바다로 나가는 항구를 얻으려 했으나 성과를 얻지 못했고, 1928년 10월 네구스(왕)가 되었다. 1930년 4월 2일 자우디투가 죽자 그는 하일레 셀라시에 1세로 즉위했고 11월 2일 대관식을 올렸다. 1931년 7월 16일 첫 성문 헌법이 공포되어 황제가 지명하는 상원과 귀족·지방 유력자가 뽑는 하원을 두었지만 황제의 권한은 오히려 강화되었다. 황제는 외국인 고문을 두고 학교와 인쇄소를 세웠으며, 지방 라스의 힘을 줄이고 중앙에서 군대와 관료, 학교를 키우려 했다. 1934년 12월 5일 에티오피아 동남쪽 월월 우물에서 이탈리아령 소말리아 병사와 에티오피아 병사가 충돌했고, 이탈리아 왕국은 이를 구실로 침공을 준비했다(「독일의 재군비와 에티오피아 침공, 추축의 형성」, 뒤의 사건)."
  subjects: [ethiopia, italian-eritrea, italian-somaliland, italy]
  tags: [politics]
  sources: ["Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed., 2001)", "Harold G. Marcus, Haile Sellassie I: The Formative Years, 1892–1936 (University of California Press, 1987)"]

- id: italian-ethiopia-1936
  year: 1936
  endYear: 1941
  title:
    ko: "이탈리아의 에티오피아 점령과 저항(1936~1941)"
  summary:
    ko: "1935년 10월 시작된 이탈리아의 침공(「독일의 재군비와 에티오피아 침공, 추축의 형성」, 앞의 사건) 끝에 1936년 5월 2일 하일레 셀라시에 황제가 망명길에 올랐고, 5월 5일 바돌리오 원수가 아디스아바바에 들어갔다. 5월 9일 이탈리아 왕국의 무솔리니는 에티오피아 병합과 이탈리아 왕의 에티오피아 황제 칭호를 선언했다. 6월 1일 에티오피아는 이탈리아령 에리트레아·이탈리아령 소말리아와 묶여 한 부왕이 다스리는 이탈리아령 동아프리카가 되었다. 6월 30일 하일레 셀라시에는 제네바 국제 연맹 총회에서 독가스 사용을 고발하며 약한 나라를 저버리지 말라고 호소했다. 연맹은 이탈리아에 내린 제재를 7월에 풀었으나 병합을 인정하지는 않았다. 이탈리아의 지배는 도시와 도로 둘레에 닿았을 뿐 시골에서는 아르베뇨치(애국 전사)라 불린 저항 세력이 싸움을 이어갔다. 1937년 2월 19일 부왕 로돌포 그라치아니가 암살 미수로 다친 뒤 아디스아바바에서 이탈리아 군경과 파시스트 민병대, 민간인이 사흘 동안 에티오피아인을 학살한 예카팃 12 학살이 일어났다. 희생자는 이탈리아 쪽 집계 약 1천 4백 명에서 에티오피아 쪽 주장 3만 명까지 갈린다. 1937년 12월 아오스타 공작이 부왕이 되어 현지 지배층을 끌어안는 노선으로 바꿨지만 저항은 끝나지 않았다. 전쟁과 점령 기간의 에티오피아인 사망은 수십만 명으로 추산되며, 일부 학자는 이를 집단 학살이라 부른다. 에티오피아의 땅은 법적으로 에티오피아의 것이었고 이탈리아의 지배는 점령으로 서술된다. 이 점령은 1941년 연합군의 반격으로 끝난다(「동아프리카 전선과 에티오피아 해방(1940~1941)」, 뒤의 사건)."
  subjects: [ethiopia, italian-eritrea, italian-somaliland, italy]
  tags: [war, politics]
  sources: ["Angelo Del Boca, The Ethiopian War 1935–1941 (University of Chicago Press, 1969)", "Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed., 2001)"]

- id: east-africa-campaign-1940
  year: 1940
  endYear: 1941
  title:
    ko: "동아프리카 전선과 에티오피아 해방(1940~1941)"
  summary:
    ko: "1940년 6월 10일 이탈리아 왕국이 영국·프랑스에 선전하자 이탈리아령 동아프리카는 수단·케냐·영국령 소말릴란드를 위협하는 위치에 놓였다(이 땅의 형성은 「이탈리아의 에티오피아 점령과 저항(1936~1941)」, 앞의 사건). 8월 이탈리아는 영국령 소말릴란드를 침공해 영국군을 베르베라에서 몰아냈다. 영국군은 수단과 케냐 양쪽에서 반격에 나섰고, 하일레 셀라시에는 1941년 1월 수단에서 에티오피아 땅으로 돌아와 아르베뇨치와 손잡았다. 2월 25일 케냐에서 올라간 부대가 모가디슈를 차지했고, 3월에는 에리트레아의 케렌에서 두 달 가까운 전투 끝에 3월 27일 이탈리아 방어선이 무너졌다. 4월 1일 아스마라, 4월 6일 아디스아바바가 연합군 손에 들어왔다. 5월 5일 하일레 셀라시에가 5년 만에 아디스아바바로 돌아왔고, 5월 19일 아오스타 공작이 암바알라기에서 항복했다. 남서쪽에서는 벨기에령 콩고의 공안군이 이탈리아군의 항복(1941년 7월)을 받아냈고, 마지막 거점 곤다르는 11월 27일 항복했다. 영국령 소말릴란드는 3월에 회복되었다. 이 전역의 전사자는 영국군 약 1천 1백 명, 이탈리아 쪽 약 1만 7천 명(이탈리아인 약 5천 5백 명과 현지 징집병을 합침), 에티오피아 의용군 약 5천 명으로 추산된다. 이탈리아령 동아프리카는 해체되었고, 이탈리아령 에리트레아와 이탈리아령 소말리아는 각각 에리트레아 (영국 군정, 1941~1952)와 이탈리아령 소말리아 (영국 군정, 1941~1950)로 이어졌다(「옛 이탈리아 식민지: 소말리아 신탁 통치와 에리트레아 연방, 병합(1949~1962)」, 뒤의 사건). 에티오피아는 1942년 1월 영국과 협정을 맺어 주권을 회복했다."
  subjects: [italian-somaliland, italian-eritrea, eritrea-british-admin, somalia-british-admin, ethiopia, british-somaliland, belgian-congo, uk, italy]
  tags: [war]
  sources: ["Anthony Mockler, Haile Selassie's War (Oxford University Press, 1984)", "Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed., 2001)"]
