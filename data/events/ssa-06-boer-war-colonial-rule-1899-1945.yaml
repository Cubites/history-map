- id: upper-volta-1915
  year: 1915
  endYear: 1932
  title:
    ko: "볼타-바니 전쟁과 오트볼타 식민지(1915~1932)"
  summary:
    ko: "프랑스는 1차 대전 중 서아프리카에서 많은 병사를 징발했고, 1915년 말 오늘날 부르키나파소 서부의 보와·마르카 같은 여러 민족이 징병과 세금, 강제 노동에 맞서 볼타-바니 전쟁을 일으켰다. 프랑스는 약 5천 명의 병력과 포병을 투입해 마을을 불태우며 진압했고, 큰 싸움은 1년 남짓 이어졌으며 작은 저항은 1917년 8월까지 이어졌다. 이 전쟁은 1차 대전 중 프랑스령 서아프리카에서 일어난 가장 중요한 무장 저항의 하나로 꼽힌다. 평정 뒤 1919년 3월 1일 상부 세네갈·니제르(프랑스령 수단)의 모시 지방과 프랑스령 코트디부아르의 땅 일부를 묶어 프랑스령 오트볼타가 별도 식민지로 세워졌고, 와가두구가 도읍이 되었는데, 그곳의 모시 왕은 모로 나바라 불리며 수백 년 이어진 질서를 대표했다. 식민지 이름은 검은볼타·붉은볼타·흰볼타 세 강의 상류에서 땄다. 초대 부총독은 에두아르 에슬링(1919~1927)이었고, 1928년부터 알베릭 푸르니에가 이었다. 프랑스령 오트볼타는 모시 왕들이 이끈 전통 질서를 간접 통치에 활용했지만, 식민 당국은 코트디부아르 농장과 철도에 쓸 노동력을 이 땅에서 구하려 했다. 1932년 9월 5일 비용을 줄인다는 이유로 식민지가 해체되어 프랑스령 코트디부아르가 가장 큰 몫을 받았고 프랑스령 수단이 서쪽 가장자리를, 프랑스령 니제르가 도리와 파다응구르마 쪽 동부(1932~1947)를 맡았다. 니제르 소속이던 북쪽의 티베스티는 1931년 프랑스령 차드로 넘어갔다. 모시 왕(모로 나바)은 식민 당국과 협력하면서도 모시 지방이 하나로 묶여 있어야 한다고 요구했고, 이 요구가 복원의 밑바탕이 되어 1947년 9월 4일 오트볼타는 옛 경계로 되살아났다(「협상 회의 네 나라의 독립: 코트디부아르·다호메이·오트볼타·니제르(1960)」, 뒤의 사건). 1932년의 해체와 1947년의 복원은 식민지 경계가 행정 편의로 쉽게 그어지고 지워졌음을 보여 준다."
  subjects: [french-upper-volta, french-sudan, french-niger, french-chad, french-ivory-coast, france]
  tags: [war, politics]
  sources: ["Patrick Manning, Francophone Sub-Saharan Africa 1880–1995 (Cambridge University Press, 2nd ed., 1998)", "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 2nd ed., 2007)"]

- id: darfur-1916
  year: 1916
  endYear: 1916
  title:
    ko: "알리 디나르와 다르푸르 술탄국의 끝(1916)"
  summary:
    ko: "다르푸르 술탄국은 1603년 무렵 세워진 사헬 동쪽의 이슬람 나라로, 1874년 가을 알주바이르 라흐마 만수르가 이끈 군대가 술탄 이브라힘을 죽이고 도읍을 차지했다. 이후 투르코-이집트 정부가 다르푸르를 속주로 다스렸고, 1885년 마흐디군이 이를 정복했다. 푸르 사람들은 마흐디 국가에 맞서 1887년 이브라힘의 아들이 반란을 일으키는 등 저항했다. 1898년 옴두르만 전투로 마흐디 국가가 무너지자(「수단 재정복: 옴두르만 전투와 파쇼다 사건, 공동 통치 협정(1896~1899)」, 앞의 사건) 알리 디나르가 술탄으로 복위해 알파시르를 도읍으로 삼고 술탄국의 제도를 다시 세웠다. 재위는 1898년 9월부터로 적히며 1891년부터로 세는 설명도 있다. 영국은 그의 통치를 눈감아 주었고, 알리 디나르는 사실상 독립을 지키며 1903년 상비군이 약 7천 7백 명이었다고 전한다. 그는 와다이의 계승 다툼에 끼어들고 프랑스가 서쪽 속국들을 차지하는 데 맞서기도 했다. 1915년 그가 오스만 제국 편에 서겠다고 선언했다는 전언에 영국은 프랑스의 팽창에 대한 우려와 소문을 이유로 1916년 이집트군·수단군 원정대를 보냈고, 터키 전선의 싸움이 끝나 이집트의 병력에 여유가 생긴 사정도 한몫했다고 평가된다. 알리 디나르는 영국의 기관총과 대포에 밀려 쫓기다 1916년 11월 6일 전사했고, 다르푸르는 1917년 영국-이집트령 수단의 일부로 편입되었다. 이로써 수단 서쪽 끝에 남아 있던 독립 술탄국이 사라졌다. 이웃 다르 마살리트는 1903년 알리 디나르에게 술탄이 처형되었으나 동생 타지 앗딘이 이끌어 1908년 평화 조약으로 명목상의 종속만 남기고 자립했다."
  subjects: [darfur, anglo-egyptian-sudan]
  links:
    - { from: anglo-egyptian-sudan, to: darfur, note: "다르푸르를 정복함 (1916)" }
  tags: [war, politics]
  sources: ["Richard Leslie Hill, A Biographical Dictionary of the Sudan (Frank Cass, 2nd ed., 1967)", "Martin W. Daly, Empire on the Nile: The Anglo-Egyptian Sudan, 1898–1934 (Cambridge University Press, 1986)"]

- id: mandates-1919
  year: 1919
  endYear: 1922
  title:
    ko: "베르사유 조약과 아프리카의 위임 통치령(1919~1922)"
  summary:
    ko: "1919년 6월 28일 서명(1920년 1월 10일 발효)한 베르사유 조약 제119조로 독일은 해외 식민지를 모두 포기했다(「파리 강화 회의와 베르사유 조약」, 앞의 사건). 연합국은 5월 식민지를 승전국이 병합하지 않고 국제 연맹의 위임을 받아 맡기는 방식을 택했다(「국제 연맹」, 뒤의 사건). 독일령 카메룬은 프랑스령 카메룬(대부분)과 영국령 카메룬(서쪽 가장자리)으로 나뉘었고, 토골란드는 프랑스령 토골란드(동쪽 약 3분의 2)와 영국령 토골란드로 나뉘었다. 독일령 동아프리카는 영국령 탕가니카와 벨기에가 맡은 루안다-우룬디로 갈렸고, 남동쪽 작은 킨조아 삼각지는 포르투갈령 모잠비크에 붙었다. 독일령 남서아프리카는 남아프리카 연방이 맡는 남서아프리카가 되었다. 영국령 토골란드는 골드코스트와, 영국령 카메룬은 나이지리아와 함께 다스려졌고, 루안다-우룬디는 1925년 벨기에령 콩고와 행정이 합쳐졌다. 이 네 곳 가운데 카메룬·토고·탕가니카·루안다-우룬디는 B형으로, 남서아프리카는 위임국이 자국 영토의 일부처럼 다룰 수 있는 C형으로 분류되었다. C형의 위임장은 1920년 12월 17일, B형은 1922년 7월 20일 국제 연맹 이사회가 확정했다. 위임국은 해마다 연맹의 상임 위임 위원회에 보고해야 했지만 독립의 시한은 약속되지 않았다. 1911년 노이카메룬으로 독일에 넘어갔던 프랑스령 가봉·프랑스령 중앙콩고·우방기샤리·프랑스령 차드의 땅은 1920년 프랑스에 돌아갔다(「모로코 위기와 노이카메룬(1911~1913)」, 앞의 사건). 1945년 국제 연합 헌장은 위임 통치령을 신탁 통치로 이어받게 했다(「국제 연합의 창설」, 뒤의 사건)."
  subjects: [german-togoland, german-kamerun, german-east-africa, german-south-west-africa, british-cameroons, french-cameroons, british-togoland, french-togoland, ruanda-urundi, british-tanganyika, south-west-africa, french-chad, french-gabon, french-middle-congo, french-ubangi-shari, belgium, uk, france]
  tags: [diplomacy, politics]
  sources: ["Susan Pedersen, The Guardians: The League of Nations and the Crisis of Empire (Oxford University Press, 2015)", "Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)"]

- id: rhodesia-1922
  year: 1922
  endYear: 1924
  title:
    ko: "남로디지아 자치 식민지와 북로디지아 보호령(1922~1924)"
  summary:
    ko: "세실 로즈가 세운 영국 남아프리카 회사는 1890년대부터 잠베지강 남쪽의 영국 남아프리카 회사령 남로디지아와 북쪽의 영국 남아프리카 회사령 북로디지아를 특허장에 따라 다스렸다(「영국 남아프리카 회사의 마쇼나랜드 점령과 니아살랜드, 마타벨레 전쟁(1889~1893)」, 「레와니카의 로지 왕국과 바로체랜드 보호령(1890~1899)」, 앞의 사건). 회사의 특허장은 1923년에 끝나기로 되어 있었고, 남로디지아의 백인 정착민 앞에는 두 길이 놓였다. 하나는 얀 스뮈츠가 제안한 남아프리카 연방 편입이었고, 다른 하나는 자기들이 의회를 갖는 책임 정부였다. 1922년 10월 27일 주민 투표에서 정착민들은 연방 편입을 약 6대 4로 물리치고 책임 정부를 택했다. 영국은 1923년 9월 12일 남로디지아를 병합하고 10월 1일 헌법을 시행해 자치 식민지로 삼았으며, 초대 총리는 찰스 코글란이었다. 1921년 인구 조사에서 남로디지아의 유럽인은 약 3만 3천 명, 아프리카인은 약 80만 명이었다. 투표권은 재산·소득 요건으로 제한되어 아프리카인 주민은 거의 배제되었고, 1930년 토지 분배법은 인종별로 땅을 갈랐다. 북쪽의 북로디지아는 1924년 4월 1일 회사 손을 떠나 식민성이 맡는 보호령이 되었고, 허버트 스탠리가 초대 총독으로 부임했으며 도읍은 리빙스턴이었다. 회사는 북로디지아의 광물권을 계속 쥐었다. 이 두 땅은 1953년 니아살랜드와 한 연방으로 묶였다가 갈라진다(「로디지아 니아살랜드 연방과 잠비아·말라위의 독립(1953~1964)」, 「로디지아의 일방 독립 선언과 짐바브웨의 독립(1965~1980)」, 뒤의 사건)."
  subjects: [rhodesia, northern-rhodesia, bsac-southern-rhodesia, bsac-northern-rhodesia, uk]
  links:
    - { from: uk, to: rhodesia, note: "남로디지아를 병합해 자치 식민지로 삼음 (1923)" }
  tags: [politics]
  sources: ["Robert I. Rotberg, The Founder: Cecil Rhodes and the Pursuit of Power (Oxford University Press, 1988)", "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 2nd ed., 2007)"]

- id: italian-somalia-1923
  year: 1923
  endYear: 1927
  title:
    ko: "이탈리아의 소말리 술탄국 정복(1923~1927)"
  summary:
    ko: "이탈리아는 1889년 호비오 술탄국(2월 8일)과 마제르테인 술탄국(4월 7일)을 보호 조약으로 묶어 이탈리아령 소말리아의 틀을 마련했지만, 두 술탄국은 안으로 사실상 독립을 지켰다(「호비오 술탄국과 소말리 해안의 보호 조약(1878~1889)」, 앞의 사건). 영국은 1920년 비행기까지 쓴 원정으로 무함마드 압둘라 하산의 데르비시 운동을 꺾었고, 그는 그해 12월 죽었다. 1922년 파시스트가 집권한 이탈리아 왕국은 1923년 12월 체사레 마리아 데 베키를 총독으로 보내(12월 15일 도착) 보호 관계를 직접 지배로 바꾸었다. 1925년 이탈리아가 호비오를 병합하면서 술탄 알리 유수프 케나디드가 쫓겨났고, 1927년 마제르테인의 보콜 오스만 마하무드의 저항도 꺾여 이탈리아의 지배가 소말리아 북동쪽 끝까지 닿았다. 한편 이탈리아는 1915년 런던 조약에서 영국·프랑스가 아프리카에서 식민지를 늘리면 보상하겠다는 약속을 받았다. 이를 근거로 1924년 7월 15일 조약이 맺어져, 영국은 케냐 식민지의 동쪽 유바강 서쪽 땅(올트레 주바, 키스마유 포함)을 이탈리아령 소말리아에 넘겼고 이양은 1925년에 이루어졌다. 같은 정리로 1926년 우간다 보호령의 북동쪽 루돌프 지방이 케냐 식민지로 이관되었다. 이로써 이탈리아령 소말리아의 영토가 하나로 이어졌다. 이탈리아는 소말리아인으로 채운 현지 비정규 부대(두바트)를 써서 내륙을 눌렀다. 데 베키는 1928년까지 총독으로 있으면서 바나디르 해안과 셰벨레 강 둘레에 이탈리아 이주민의 농장을 늘렸다. 이 땅은 1936년 이탈리아령 동아프리카의 소말리아 총독부가 된다(「이탈리아의 에티오피아 점령과 저항(1936~1941)」, 뒤의 사건)."
