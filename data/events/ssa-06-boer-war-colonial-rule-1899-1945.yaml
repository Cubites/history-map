- id: sokoto-conquest-1900
  year: 1900
  endYear: 1903
  title:
    ko: "왕립 니제르 회사의 끝과 영국의 소코토 정복(1900~1903)"
  summary:
    ko: "1886년 특허장을 받은 왕립 니제르 회사는 니제르강 둘레를 다스렸지만, 프랑스·독일과의 경쟁 속에서 영국 정부가 직접 통치로 돌아섰다. 1899년 영국 정부가 회사의 통치권을 사들였고, 1900년 1월 1일 회사 영토의 북쪽이 북나이지리아 보호령이 되어 프레더릭 루가드가 고등 판무관으로 부임했다. 루가드는 자신이 키운 서아프리카 국경군을 바탕으로 북쪽을 차례로 눌렀다. 동쪽 아다마와에서는 1901년 요라를 차지해 독일령 카메룬과 맞닿은 지역까지 영국의 지배가 닿았다. 1903년 2월 카노가 함락되었고, 3월 소코토가 영국군에 넘어가자 칼리프 무함마두 아타히루 1세는 15일 도시를 떠나 동쪽으로 옮겨 갔다. 소코토 칼리프는 1891년부터 압드 알라흐만이 있다가 1902년 10월 죽은 뒤 아타히루 1세(1902년 10월 13일~1903년 3월 15일)가 이었다. 영국은 3월 21일 무함마두 아타히루 2세를 새 술탄으로 세웠고, 아타히루 1세는 7월 27일 부르미 전투에서 전사했다. 이로써 1804년 우스만 단 포디오가 세운 소코토 칼리프국은 독립을 잃고, 칼리프국의 에미르들은 영국 고등 판무관의 승인을 받는 간접 통치 아래의 지방 통치자로 남았다. 루가드는 풀라니가 정복으로 이 땅을 얻었듯 이제는 영국이 정복으로 통치권을 얻었다는 취지로 말했다고 전한다. 아타히루 2세 뒤에는 1915년부터 무함마두 단 아흐마두가 1924년까지 술탄 자리에 있었다. 앞선 경위는 「오일 리버스 보호령과 왕립 니제르 회사, 베닌 원정(1884~1897)」(앞의 사건)이고, 이 보호령은 1914년 남쪽과 합쳐진다(「라고스 합병과 나이지리아 통합(1906~1914)」, 뒤의 사건)."
  subjects: [royal-niger-company, northern-nigeria-protectorate, sokoto-caliphate, german-kamerun, uk]
  links:
    - { from: uk, to: sokoto-caliphate, note: "소코토 칼리프국을 정복함 (1903)" }
  tags: [war, politics]
  sources: ["Murray Last, The Sokoto Caliphate (Longmans, 1967)", "R. A. Adeleye, Power and Diplomacy in Northern Nigeria 1804–1906 (Longman, 1971)"]

- id: french-west-africa-1900
  year: 1900
  endYear: 1909
  title:
    ko: "프랑스령 서아프리카의 정비: 니제르 군사 영토와 모리타니(1900~1909)"
  summary:
    ko: "프랑스령 서아프리카는 1895년 10월 27일 프랑스령 세네갈·프랑스령 수단·프랑스령 기니·코트디부아르를 한 총독부 아래 묶으며 출발했다. 1899년 프랑스는 사헬 안쪽으로 크게 뻗어 있던 프랑스령 수단의 남쪽 땅을 떼어 기니·코트디부아르·프랑스령 다호메이에 붙였고, 니제르강 굽이 건너 동쪽은 1900년 7월 23일 진데르 군사 영토(1910년부터 니제르 군사 영토)라는 이름의 프랑스령 니제르로 따로 묶었다. 같은 해 4월 쿠세리에서 라바가 전사해 카넴-보르누 제국의 옛 땅을 나누는 길이 열렸지만, 그 일은 「라바의 보르누 정복과 쿠세리 전투, 보르누의 분할(1893~1902)」(앞의 사건)이 다룬다. 1902년 총독부는 생루이에서 다카르로 옮겨 갔고, 1904년 10월 18일 개편으로 프랑스령 수단은 '상부 세네갈·니제르'라는 이름의 한 식민지가 되었다. 총독은 에르네스트 루미(1902~1907)에 이어 1908년부터 윌리엄 퐁티였다. 1904년에는 프랑스령 다호메이도 총독부에 정식으로 들어왔고, 1905년에는 노예제를 대부분 폐지하는 조치가 내려졌다. 서쪽 끝 모리타니에서는 1902년부터 사비에르 코폴라니가 이슬람 학자·부족장과의 협상을 앞세워 들어갔고, 1904년 프랑스령 모리타니(모리타니 민간 영토)가 세워졌지만 1905년 5월 티지크자에서 그가 피살되었다. 1907년부터 앙리 구로가 군사 작전을 맡아 1909년 아드라르를 차지했다. 이 사하라 쪽 확장은 「프랑스의 사하라 진출과 알제리 남부 영토(1881~1905)」(앞의 사건)와 이어진다. 이 정비로 서아프리카 전체가 하나의 총독부 아래 놓였고, 이 틀은 1950년대까지 이어졌다. 모리타니는 1920년 식민지로 올라선다."
  subjects: [french-niger, french-mauritania, french-sudan, french-dahomey, french-guinea, french-senegal, kanem-bornu, france]
  links:
    - { from: france, to: french-mauritania, note: "모리타니 민간 영토를 세움 (1904)" }
  tags: [politics, society]
  sources: ["Patrick Manning, Francophone Sub-Saharan Africa 1880–1995 (Cambridge University Press, 2nd ed., 1998)", "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 2nd ed., 2007)"]

- id: east-africa-protectorate-1902
  year: 1902
  endYear: 1915
  title:
    ko: "동아프리카 보호령의 확장: 우간다 동부주 이관과 케냐 고지대 정착(1902~1915)"
  summary:
    ko: "영국은 1895년 제국 영국 동아프리카 회사에서 해안 지방의 통치를 넘겨받아 동아프리카 보호령을 세웠고, 내륙의 우간다 보호령과는 따로 운영했다(앞선 경위는 「제국 영국 동아프리카 회사와 우간다·동아프리카 보호령(1888~1895)」, 앞의 사건). 몸바사에서 빅토리아 호수 쪽으로 가는 우간다 철도는 1896년 시작되어 1901년 말 호수에 닿았으며, 인도에서 온 계약 노동자 3만여 명이 공사에 쓰였다. 1902년 4월 1일 우간다 보호령의 동부주가 동아프리카 보호령으로 넘어와 철도 노선 전체가 한 행정 구역에 들어왔고, 이 땅이 훗날 케냐의 중심이 된다. 서늘한 고원 지대에는 유럽인 정착을 장려하는 정책이 펼쳐졌다. 판무관 찰스 엘리엇(1900~1904)이 이를 앞장서 추진했다. 1905년 영국은 보호령의 관할을 외무부에서 식민성으로 옮기고 수도를 몸바사에서 나이로비로 옮겼다. 1904년 마사이 협정으로 마사이는 나이바샤와 라이키피아 두 보호구로 옮겨야 했고, 1911년 두 번째 협정으로 라이키피아의 마사이마저 남쪽 보호구로 다시 옮겨졌다. 1915년 왕령 토지법은 백인 정착민의 임대 기간을 999년으로 늘리고 아프리카인이 쓰는 땅을 왕령지로 규정해, 키쿠유를 비롯한 주민의 권리를 약하게 만들었다. 우간다 보호령에서는 부간다가 간접 통치 아래 상당한 자치를 누리며 면화 재배를 늘려 갔다. 나일강 서안의 라도 고립 지역은 1894년 영국이 동쪽 콩고의 좁은 땅을 얻는 대신 콩고 자유국의 레오폴드 2세에게 임대한 땅이었다(수단 쪽 경위는 「수단 재정복: 옴두르만 전투와 파쇼다 사건, 공동 통치 협정(1896~1899)」, 앞의 사건). 레오폴드가 1909년 12월 죽자 땅은 되돌려져 1910년 6월 10일 영국-이집트령 수단에 편입되었고, 벨기에령 콩고는 나일강 서안에서 물러났다. 1914년에는 수단과 우간다 보호령의 경계를 교환하면서 옛 라도 땅의 남쪽이 우간다에 붙어 웨스트나일 지방이 되었다. 내륙의 보호령은 1920년 7월 23일 케냐 식민지가 되었고 해안의 좁은 띠는 잔지바르 술탄의 땅으로 남아 별도의 케냐 보호령이 되었다. 두 보호령의 경계는 1920년대에도 거듭 조정된다(「이탈리아의 소말리 술탄국 정복(1923~1927)」, 뒤의 사건)."
  subjects: [british-kenya, british-uganda, anglo-egyptian-sudan, belgian-congo, uk]
  links:
