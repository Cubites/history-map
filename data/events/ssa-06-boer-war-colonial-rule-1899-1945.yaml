- id: madagascar-1942
  year: 1942
  endYear: 1942
  title:
    ko: "마다가스카르 전투(1942)"
  summary:
    ko: "1895~1897년 프랑스가 정복한 마다가스카르는(「프랑스의 마다가스카르 정복과 메리나 왕국의 끝(1895~1897)」, 앞의 사건) 1940년 프랑스의 항복 뒤 비시 정부의 통제 아래 놓였다(「프랑스의 항복과 비시 정부」, 앞의 사건). 연합국은 일본 해군이 인도양 쪽의 디에고수아레스(지금 안치라나나) 항을 쓰면 인도와 호주로 가는 바닷길이 끊긴다고 걱정했다. 1942년 5월 5일 영국군이 아이언클래드 작전으로 디에고수아레스 둘레에 상륙해 7일 항 일대의 비시군을 항복시켰다. 상륙 첫 사흘에만 영국군은 109명이 죽고 283명이 다쳤다고 전한다. 5월 30일에는 일본의 소형 잠수정이 항 안의 영국 전함을 공격해 손상을 입혔다. 그러나 총독 아르망 아네의 비시군은 남쪽으로 물러나 버텼고, 9월 10일 마중가(지금 마하장가), 9월 18일 타마타브(지금 투아마시나)에 영국군이 다시 상륙해 9월 23일 수도 안타나나리보(옛 타나나리브)를 차지했다. 10월에는 안드라말라니나에서 비시군 일부가 항복했고, 영국군은 코모로와 툴리아라에도 상륙했다. 아네는 11월 6일 암발라바오에서 휴전에 서명하고 이틀 뒤 항복했다. 전사자는 연합군 약 1백 명, 비시 프랑스군 약 1백 5십 명이며 부상까지 합친 프랑스군 피해는 문서마다 7백 명 안팎에서 1천 명 넘게 갈린다. 12월 폴 르장틸롬이 자유 프랑스의 고등 판무관으로 부임했고, 섬은 자유 프랑스 아래로 넘어갔다. 프랑스령 마다가스카르 사람들은 전쟁 동안 징발과 물자 부족에 시달렸고, 전쟁이 끝난 뒤 1947년의 봉기로 이어진다(「마다가스카르 봉기와 말라가시 공화국의 독립(1947~1960)」, 뒤의 사건)."
  subjects: [french-madagascar, uk, france]
  tags: [war]
  sources: ["Ashley Jackson, The British Empire and the Second World War (Hambledon Continuum, 2006)", "Martin Thomas, The French Empire at War, 1940–1945 (Manchester University Press, 1998)"]

- id: brazzaville-pan-african-1944
  year: 1944
  endYear: 1945
  title:
    ko: "브라자빌 회의와 제5차 범아프리카 회의(1944~1945)"
  summary:
    ko: "1940년 6월 프랑스가 독일에 항복하자 차드 총독 펠릭스 에부에가 8월 자유 프랑스에 합류했고, 프랑스령 적도 아프리카의 수도 브라자빌은 자유 프랑스의 근거지가 되었다(「프랑스의 항복과 비시 정부」, 앞의 사건). 샤를 드골은 1944년 1월 30일부터 2월 8일까지 프랑스령 중앙콩고의 브라자빌에서 식민지 총독들이 참가하는 회의를 열어 전쟁에 쏟은 아프리카의 기여에 보답할 개혁을 논의했다. 에부에는 1941년 전통 지도자를 활용하는 원주민 정책을 내놓았고, 초청장은 총독 21명, 임시 자문 의회 의원 9명, 알제리·튀니지·모로코 관찰자 6명에게 보내졌고, 회의에는 아프리카인 대표가 초청되지 않았다. 회의는 강제 노동 폐지, 교육 확대, 지방 의회 구성, 주민의 정치 참여 확대를 권고했지만, 식민지의 독립은 물론 프랑스 제국 밖의 자치 가능성까지 배제한다고 밝혔다. 강제 노동은 1946년 4월 법으로 폐지된다. 1945년 10월 프랑스 제헌 의회 선거에는 프랑스령 아프리카 주민도 대표를 처음 보냈다. 한편 영국에서는 1945년 10월 15일부터 맨체스터에서 제5차 범아프리카 회의가 열렸다. 윌리엄 듀보이스가 명예 의장을, 조지 패드모어가 조직을 맡았고, 영국령 골드코스트 출신 콰메 은크루마가 사무를 거들었으며 케냐의 조모 케냐타도 참석했다. 이 회의는 앞선 회의들과 달리 식민 지배의 즉각적인 종식과 아프리카의 자치를 요구했고, 은크루마는 1947년 골드코스트로 돌아가 독립 운동을 이끈다. 두 모임은 프랑스령의 점진적 통합과 영국령의 독립 요구라는 서로 다른 길을 보여 준다. 은크루마의 활동은 「은크루마와 가나의 독립(1951~1957)」(뒤의 사건)으로 이어진다."
  subjects: [french-middle-congo, british-gold-coast, france, uk]
  tags: [politics, diplomacy]
  sources: ["Frederick Cooper, Decolonization and African Society: The Labor Question in French and British Africa (Cambridge University Press, 1996)", "Hakim Adi and Marika Sherwood, The 1945 Manchester Pan-African Congress Revisited (New Beacon Books, 1995)"]
