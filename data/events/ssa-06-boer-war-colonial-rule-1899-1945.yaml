  tags: [politics, economy]
  sources: ["Toyin Falola and Matthew M. Heaton, A History of Nigeria (Cambridge University Press, 2008)", "Murray Last, The Sokoto Caliphate (Longmans, 1967)"]

- id: belgian-congo-1908
  year: 1908
  endYear: 1908
  title:
    ko: "벨기에의 콩고 병합(1908)"
  summary:
    ko: "레오폴드 2세가 개인 소유로 다스리던 콩고 자유국은 고무와 상아 채취를 위한 강제 노동과 가혹한 처벌로 국제 비난을 받았고, 경위는 「레오폴드 2세의 콩고 자유국과 고무 수탈(1885~1904)」(앞의 사건)이 다룬다. 1904년 영국 영사 로저 케이스먼트의 보고서가 나오고 영국에서 콩고 개혁 협회가 만들어지면서 압력이 커지자, 레오폴드는 국제 조사 위원회를 받아들였다. 위원회는 1904~1905년에 조사해 수탈을 확인했고, 1907년 레오폴드와 벨기에 정부가 병합 조약을 맺었다. 1908년 10월 18일 벨기에 의회는 표결로 식민 헌장과 병합을 승인했고, 11월 15일 콩고 자유국이 벨기에령 콩고로 정식 이관되었다. 벨기에는 자유국의 부채를 떠안았고 레오폴드에게 보상금을 주었으며, 벨기에 정부는 식민성을 새로 두어 콩고를 맡겼다. 새 식민지는 강제 노동 가운데 가장 악명 높은 고무 채취 의무를 줄였으나 인두세와 징발 같은 강제는 이어졌다. 자유국 시기의 인구 감소는 기록이 모자라 추산이 크게 갈리며, 1907년의 인구 추정치는 약 913만 명이다. 일부 연구는 고무 지방 인구가 최대 절반까지 줄었다고 보지만 질병의 몫도 컸다. 레오폴드는 1893년 자유국 땅 약 25만 9천 km²를 왕령 영지로 떼어 그 고무 수입을 직접 거두었는데, 이 영지는 1908년 해체되었고 개인 군대 같던 공안군(포르스 퓌블리크)은 벨기에령 콩고의 군대로 이어졌다. 벨기에 정부는 병합에 오래 주저했으나 국제 압력과 투자 회사들의 요구에 밀렸다. 레오폴드 2세는 1909년 12월 17일 죽고 조카 알베르 1세가 왕위를 이었다. 벨기에령 콩고는 1960년 독립 때까지 이어진다(「콩고의 독립과 콩고 위기(1960~1965)」, 뒤의 사건)."
  subjects: [belgium, congo-free-state, belgian-congo]
  links:
    - { from: belgium, to: congo-free-state, note: "콩고 자유국을 넘겨받음 (1908)" }
  tags: [politics, economy]
  sources: ["Adam Hochschild, King Leopold's Ghost (Houghton Mifflin, 1998)", "Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)"]

- id: union-south-africa-1909
  year: 1909
  endYear: 1910
  title:
    ko: "남아프리카 연방의 성립(1909~1910)"
  summary:
    ko: "보어 전쟁 뒤 영국은 트란스발 식민지와 오렌지강 식민지에 1906~1907년 책임 정부를 주었고, 1907년 선거에서 보어 정당이 이겨 트란스발에서는 루이스 보타와 얀 스뮈츠가 정부를 맡았다. 철도 운임과 관세, 흑인 노동력 관리 문제를 한 나라에서 다루자는 요구가 커져 1908년 10월부터 1909년 5월까지 더반·케이프타운·블룸폰테인에서 국민 회의가 열렸고, 케이프 식민지·나탈 식민지·트란스발 식민지·오렌지강 식민지의 대표가 연방 헌법안을 짰다. 영국 의회는 1909년 남아프리카법을 통과시켰고, 1910년 5월 31일 네 식민지가 합쳐 영국 제국 안의 자치령인 남아프리카 연방(1961년부터 남아프리카 공화국)이 출범했다. 초대 총리는 보타였고 총독은 글래드스턴 자작이었다. 1911년 인구 조사에서 전체 약 600만 명 가운데 백인은 약 130만 명(약 21%)이었다. 행정 수도는 프리토리아, 입법 수도는 케이프타운, 사법 수도는 블룸폰테인으로 나뉘었다. 참정권은 케이프 주에서만 재산·교육 자격을 갖춘 비백인 남성 일부에게 남았고, 다른 세 주에서는 백인만 투표했으며 의원 자격은 모두 백인에게 한정되었다. 윌리엄 슈라이너 전 케이프 총리가 이끈 아프리카인·유색인 대표단이 런던에서 항의했지만 법은 바뀌지 않았다. 바수톨란드·베추아날란드·스와질란드는 장차 편입한다는 조항만 둔 채 영국이 따로 맡았다. 총리는 이후 스뮈츠(1919~1924), 헤르초크(1924~1939), 스뮈츠(1939~1948)로 이어진다. 전쟁에서 맞섰던 두 백인 집단의 화해가 이 나라의 틀이 되었고, 아프리카인의 배제는 곧 불붙는 정치 문제가 되었다(「남아프리카 원주민 민족 회의와 원주민 토지법(1912~1913)」, 뒤의 사건)."
  subjects: [south-africa, cape-colony, natal, transvaal-colony, orange-river-colony, uk]
  links:
    - { from: uk, to: south-africa, note: "네 식민지를 합쳐 남아프리카 연방을 세움 (1910)" }
  tags: [politics]
  sources: ["Leonard Thompson and Lynn Berat, A History of South Africa (Yale University Press, 4th ed., 2014)", "Leonard Thompson, The Unification of South Africa 1902–1910 (Clarendon Press, 1960)"]

- id: wadai-1909
  year: 1909
  endYear: 1912
  title:
    ko: "프랑스의 와다이 정복(1909~1912)"
  summary:
    ko: "와다이 술탄국은 1635년 무렵 세워진 차드 호 동쪽의 이슬람 나라로, 사하라 횡단 교역과 노예 무역으로 번성했고 사누시 교단과 가까웠다. 프랑스에게 와다이는 리비아의 사누시 세력과 사하라 교역로를 잇는 길목이었고, 서쪽 다르푸르의 알리 디나르는 와다이의 계승 다툼에 끼어들곤 했다. 프랑스는 1900년 라바 국가를 꺾고 차드 호 쪽에 군사 지배를 굳힌 뒤 동쪽으로 눈을 돌려 1906년 와다이를 침공했다. 와다이의 전통 기병과 보병은 프랑스의 현대 무기에 맞서기 어려웠다. 마지막 독립 쿨락(술탄)인 두드 무라(1901년 11월 즉위)는 1909년 6월 12일 피겐슈 대위가 병사 180명과 대포 두 문을 이끌고 아베셰에 들어오자 수도를 잃었다. 프랑스는 이튿날 와다이를 프랑스 땅이라고 선포하고 두드 무라의 사촌 아담 아실을 꼭두각시 술탄으로 세웠다. 두드 무라는 카프카로 물러나 사누시 교단의 도움을 받으며 저항했고, 1910년 1월 4일 와디 카자에서 피겐슈 부대를 전멸시켰다. 같은 해 4월 19일 카프카에서 졌지만, 11월 8일 도로테 전투에서는 1908년 알리 디나르와 평화 조약을 맺고 자립한 다르 마살리트의 술탄 타지 앗딘의 군대와 함께 프랑스군 300명을 물리쳤다. 1911년 프랑스는 다르 마살리트의 도읍 다르질을 부수었고, 두드 무라는 1911년 10월 항복해 유배되었다. 아담 아실도 반란 책임을 물어 1911년 폐위되었으며, 와다이는 1912년 프랑스령 차드의 직할 영토에 합쳐져 술탄국의 독립이 끝났다. 두드 무라는 프랑스 연금을 받으며 1927년에 죽은 것으로 기록된다. 프랑스는 1935년 와다이 술탄제를 프랑스의 보호 아래 되살렸다."
  subjects: [wadai, french-chad, france]
  links:
    - { from: france, to: wadai, note: "와다이를 정복함 (1909)" }
  tags: [war, politics]
  sources: ["Patrick Manning, Francophone Sub-Saharan Africa 1880–1995 (Cambridge University Press, 2nd ed., 1998)"]

- id: neukamerun-1911
  year: 1911
  endYear: 1913
  title:
    ko: "모로코 위기와 노이카메룬(1911~1913)"
  summary:
    ko: "1911년 봄 모로코에서 프랑스가 반란 진압을 구실로 페스에 군대를 보내 보호령으로 나아가자(「알헤시라스 회의에서 페스 조약까지: 모로코 보호령의 성립(1906~1912)」, 앞의 사건), 독일은 7월 1일 군함 판터호를 아가디르 항에 보냈다. 이 위기의 배경은 「영국-프랑스 협상과 모로코 위기」(앞의 사건)에 있다. 영국이 프랑스 편에 서자 독일은 모로코를 양보하는 대가로 아프리카에서 보상을 요구했다. 1911년 11월 4일 베를린에서 맺은 협정으로 독일은 모로코에서 프랑스의 우위를 인정했고, 프랑스는 프랑스령 가봉·프랑스령 중앙콩고·우방기샤리의 땅 약 27만 km²를 독일령 카메룬에 넘겼다. 이 땅이 노이카메룬(신카메룬)으로 불렸고, 협정은 모로코와 콩고를 맞바꾼 거래라 하여 모로코-콩고 협정으로도 불린다. 프랑스 의회에서도 콩고 양도를 놓고 격론이 벌어졌고 비준은 1912년 초에 이루어졌다. 독일은 콩고강과 우방기강에 닿는 두 갈래 통로를 얻었고, 프랑스는 그 대가로 독일령 카메룬의 로곤·샤리강 사이 좁은 땅(약 1만 2천 km², '오리 부리'로 불린 지대)을 독일에게서 넘겨받아 프랑스령 차드에 붙였다. 카메룬은 약 46만 5천 km²에서 약 76만 km²로 커졌고 이양은 1913년 6월 1일 마무리되었다. 독일 본국에서는 쓸모없는 땅을 얻었다는 비판이 컸고 식민 장관이 이에 항의해 물러났다. 독일 제국이 1914년 전쟁에 빠지자 프랑스는 1916년 이 땅을 되차지했고, 1920년 위임 통치령을 정할 때 경계는 1911년 앞의 선으로 돌아갔다(오리 부리 지대만 프랑스령에 남음). 그 정리는 「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」(뒤의 사건)에 이어진다."
  subjects: [german-kamerun, french-gabon, french-middle-congo, french-ubangi-shari, french-chad, german-empire, france]
  links:
    - { from: france, to: german-kamerun, note: "프랑스령 콩고의 땅을 넘김 (1911)" }
  tags: [diplomacy, politics]
  sources: ["Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)", "Patrick Manning, Francophone Sub-Saharan Africa 1880–1995 (Cambridge University Press, 2nd ed., 1998)"]

- id: anc-land-act-1912
  year: 1912
  endYear: 1913
  title:
    ko: "남아프리카 원주민 민족 회의와 원주민 토지법(1912~1913)"
  summary:
    ko: "1910년 남아프리카 연방(지금 남아프리카 공화국)이 세워진 뒤 아프리카인은 의회에 들어갈 수 없었고, 투표권도 케이프 주의 일부 남성에게만 남았다. 1912년 1월 8일 블룸폰테인에 모인 아프리카인 지도자들이 남아프리카 원주민 민족 회의를 세웠다. 변호사 피슬리 카 이사카 세메가 모임을 불렀고, 초대 의장은 교육가 존 둡, 사무총장은 언론인 솔 플라체였다. 이 조직은 1923년 아프리카 국민회의(ANC)로 이름을 바꾼다. 첫 회의에는 추장과 교회 지도자, 교사와 언론인이 함께해 부족과 지역을 넘어 아프리카인이 하나로 모인다는 뜻을 담았다. 1913년 6월 16일 재가된 원주민 토지법(19일 시행)은 아프리카인과 다른 사람 사이의 토지 매매·임대를 막고 백인 농장의 소작을 금지했으며, 아프리카인이 땅을 가질 수 있는 지역을 원주민 보호구로 한정했다. 보호구는 처음에 남아프리카 연방 땅의 약 7%였고, 1936년 원주민 신탁 토지법이 13%까지 넓히기로 했으나 백인 인구 비율에 견주면 여전히 크게 모자랐다. 백인 농장의 소작농은 쫓겨나 가축을 팔거나 떠돌았고, 플라체는 이를 『Native Life in South Africa』(1916)에 기록했다. 1914년 둡·플라체 등은 영국으로 건너가 법의 폐지를 호소했으나 성과 없이 돌아왔다. 같은 해 헤르초크가 보타와 갈라서 국민당을 세워 백인 안의 보어 민족주의가 정당으로 자리 잡았다. 아프리카인의 반대 활동은 이후 반세기 동안 청원과 대표단 파견으로 이어진다. 이 법이 정한 토지 분할은 1948년 이후 아파르트헤이트 법의 바탕이 된다(「국민당 정부와 아파르트헤이트 법(1948~1953)」, 뒤의 사건)."
  subjects: [south-africa]
  tags: [politics, society]
  sources: ["Leonard Thompson and Lynn Berat, A History of South Africa (Yale University Press, 4th ed., 2014)", "Sol T. Plaatje, Native Life in South Africa (P. S. King & Son, 1916)"]

- id: ww1-africa-1914
  year: 1914
  endYear: 1918
  title:
    ko: "1차 세계 대전의 아프리카 전선(1914~1918)"
  summary:
    ko: "1914년 8월 전쟁이 터지자 독일 제국의 아프리카 식민지는 영국·프랑스·벨기에와 남아프리카 연방군의 공격을 받았다. 가장 먼저 토골란드가 독일 무선국 카미나를 스스로 파괴하고 8월 26일 항복했다. 독일령 카메룬에서는 9월 27일 두알라가 함락되었고, 독일군은 내륙의 모라 요새에서 버티다 1916년 2월 18일 항복하거나 스페인령 리오무니로 넘어갔다. 독일령 남서아프리카에서는 1914년 9월 남아프리카 연방군의 침공이 샌드폰테인에서 막혔고, 10월에는 연방 안의 보어 강경파 마리츠 등이 독일 편에 서서 반란을 일으켰으나 진압되었다. 루이스 보타 총리가 직접 군대를 이끌어 1915년 7월 9일 코라브에서 독일군의 항복을 받았다. 독일령 동아프리카에서는 파울 폰 레토포르베크가 1914년 11월 탕가 전투에서 영국군 상륙을 막아낸 뒤 병력이 수천~1만 명 남짓이면서도 끝까지 게릴라전을 이어갔다. 1916년 스뮈츠가 지휘한 연합군이 남쪽과 서쪽에서 공세를 펼쳐 중앙선 철도를 차지하자, 레토포르베크는 포르투갈령 모잠비크로 넘어갔다가 북로디지아에서 1918년 11월 25일 휴전 소식을 듣고 항복했다. 이 전선에서 총과 짐을 나른 아프리카 짐꾼과 군속의 사망은 전투 병사보다 훨씬 많아, 추산이 수만 명에서 10만 명 이상까지 갈린다. 1915년 1월에는 니아살랜드에서 존 칠렘브웨 목사가 징발과 토지 문제에 맞서 봉기했다가 진압되었다. 독일령 네 곳은 1919년까지 독일 영토로 남았고 전쟁 중 점령은 1920년 위임 통치령으로 굳어진다(「파리 강화 회의와 베르사유 조약」, 「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」, 뒤의 사건)."
  subjects: [german-togoland, german-kamerun, german-south-west-africa, german-east-africa, german-empire, uk, france]
  tags: [war]
  sources: ["Hew Strachan, The First World War in Africa (Oxford University Press, 2004)", "Edward Paice, Tip & Run: The Untold Tragedy of the Great War in Africa (Weidenfeld & Nicolson, 2007)"]
