# 동남아 사건 se-01: 청동기 시대 동남아에서 부남·임읍·전 리 왕조·첸라까지 — 홍강 유역·타이 동북부·메콩 삼각주·베트남 중부 해안·이라와디강 유역·라카인 해안·자와와 칼리만탄 (기원전 2000년 무렵 ~ 기원후 616년)
# 범위: 풍응우옌 문화·오스트로네시아어 사용자의 섬 동남아 확산·반 치앙·사후인 문화·동선 문화와 청동 북·반랑 전승과 어우락·조타의 남월·인도와 이어진 바닷길과 철기 시대·쀼 도시국가의 등장(베익타노·할린)·한의 교지 지배·쯩 자매의 봉기와 마원의 원정·부남의 성립과 범만·옥에오 항구·임읍의 건국과 범호달·범양매·오의 교지 통치와 찌에우 부인·쿠타이와 타루마나가라의 산스크리트 비문·아라칸의 웨탈리 왕국·스리크세트라와 쀼의 불교·부남 자야바르만의 사행·리남데의 만춘과 전 리 왕조·첸라의 성립(바바바르만 1세와 마헨드라바르만)
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(어우락·랑카수카·쿠타이)과 땅 없는 항목(청동기 시대 동남아·전 리 왕조·쀼 도시국가)은 글과 subjects로만 다뤘다. 랑카수카는 옥에오 항구 사건에 합쳤다. 이미 있는 다른 파일 사건(진의 영남 정복·혜제와 여후의 시대·한 무제의 남월·민월·서남이 정복·광무제의 통치·교지의 여흥 반란·법현의 천축 순례·남조의 송·제·양 교체)은 다시 쓰지 않고 「제목」으로 가리켰다.
# 날짜: 기원전 연도는 글에 '기원전 N년'으로 적고, 저장소 year는 천문 연도(기원전 N년 = 1−N)다. 중국·베트남 사서의 날짜는 음력이고, 확실하지 않은 해는 '무렵'으로 적었다. 학설이 갈리는 해(남월의 건국 204/203, 부남의 성립 50/68, 임읍의 건국 137/192, 어우락의 병합 179/207, 쯩 자매의 죽음, 아라칸과 부남 군주의 연대)는 한 해를 본문으로 두고 다른 해를 괄호로 병기했다. 전승(홍방 왕조·혼전과 유엽·웨탈리의 찬드라 왕조)과 사서·비문의 기록은 가려 적었다. 저장소의 하한(기원전 2333년)보다 앞선 일은 쓰지 않았다.
# 이름 규칙: 표기 사전과 위키백과 한국어판 표제(쯩 자매·시색·소정·어우락·안즈엉브엉·꼬로아)를 따랐고, 항목이 있는 나라는 항목 이름으로 적었다. 중국 사서의 이름은 한국 한자음으로 적고 필요하면 한자를 병기했다. 군주의 재위는 위키백과의 군주표와 정보 상자를 맞춰 보았고 갈리는 쪽은 괄호로 함께 적었다. 분쟁과 정복은 어느 쪽 시각도 따르지 않고 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 영토가 있는 기간만 links에 썼다. 시작 해가 천문 −2332~599인 사건을 이 파일이 맡는다. 한국사와 닿는 점은 한 무제의 남월 정복(기원전 111)과 고조선 정복(기원전 108)이 같은 원정기라는 한 구절뿐이다.

- id: phung-nguyen-2000bc
  year: -1999
  endYear: -1499
  title:
    ko: "풍응우옌 문화와 홍강 유역의 청동기(기원전 2000~1500)"
  summary:
    ko: "풍응우옌 문화는 북베트남 홍강 유역에서 기원전 2000~1500년 무렵에 이어진, 신석기 끝과 청동기 처음에 걸친 문화다. 이름은 1958년 발견된 풍응우옌 유적에서 땄는데, 이 유적은 홍강 가의 도시 비엣찌에서 18킬로미터쯤 떨어져 있고 1959년 꼬느에에서 처음 발굴이 이루어졌다. 유적은 주변보다 몇 미터 높은 터나 강·개울 가까이에 자리 잡아 물을 쓰기 쉬운 곳을 골랐음을 알 수 있고, 가장 널리 나오는 유물은 발 모양을 닮은 간 돌자귀와 무늬를 넣은 토기다. 홍강 유역에서는 이 무렵 벼농사가 자리 잡았는데, 벼가 어디서 들어왔는지는 남중국에서 왔다는 견해가 많으나 문서마다 설명이 엇갈린다. 이 문화 앞에는 기원전 1만 년 앞뒤까지 거슬러 오르는 호아빈 문화처럼 사냥하고 채집하던 사람들의 아주 긴 시대가 있었다. 풍응우옌 뒤로는 동다우(기원전 1500~1000), 고문(기원전 1000~800 무렵)으로 이어지며 청동 도구와 무기가 차츰 늘었고, 그 끝에 동선 문화가 나타났다(「동선 문화와 청동 북(기원전 700~기원후 43)」(뒤의 사건)). 가장 이른 청동 북의 무늬가 풍응우옌 토기의 무늬와 구조가 닮았다는 연구가 있어, 홍강 유역의 청동기를 바깥에서 들어온 것으로만 보지 않고 이곳의 전통이 이어진 것으로 읽는 흐름이 베트남 학계에 있다. 연대는 방사성탄소 측정이 많지 않아 유적마다 수백 년씩 달라질 수 있다. 청동기 시대 동남아라 부르는 문화권은 이렇게 홍강 유역에서 시작해 타이 동북부의 반 치앙과 베트남 중부 해안의 사후인 같은 이웃 문화로 넓어졌다. 홍강 유역의 이런 마을들은 뒤에 반랑과 어우락 같은 나라 이야기가 얹히는 바탕이 되었다."
  subjects: [southeast-asia-bronze-age]
  tags: [society, culture]
  sources: ["Charles Higham, The Bronze Age of Southeast Asia (Cambridge University Press, 1996)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)"]

- id: austronesian-islands-2000bc
  year: -1999
  endYear: -999
  title:
    ko: "오스트로네시아어 사용자의 섬 동남아 확산(기원전 2000~1000)"
  summary:
    ko: "오스트로네시아어를 쓰는 사람들은 타이완에서 바다로 나가 기원전 2200년 무렵 필리핀 북부의 바탄 제도에 닿았고, 그곳에서 필리핀 제도를 따라 남쪽으로 퍼졌다. 타이완에서 바다로 나간 이 확산은 기원전 3000년 무렵부터 기원전 1500년 무렵까지 이어졌다고 본다. 타이완에 이르기까지의 일은 그보다 앞 수천 년에 걸친 이야기라 여기서는 접어 둔다. 돛은 기원전 2000년 앞서 쓰였다고 보며, 양쪽에 부재를 단 아우트리거 배와 게 발톱 모양의 돛 같은 항해 기술 덕분에 사람들은 짧은 시간에 먼 섬까지 갈 수 있었다. 기원전 1500년 무렵에는 보르네오와 술라웨시, 인도네시아 서쪽과 동쪽 섬들에 이르렀고, 일부는 더 동쪽 태평양으로 나아가 라피타 문화를 이루었다. 타이완에서 퍼졌다는 설명은 피터 벨우드가 처음 제안한 모형으로 가장 널리 받아들여지고, 타이완과 대륙 사이의 접촉은 기원전 1500년 무렵까지 이어졌다고 본다. 그러나 순다 대륙붕에서 퍼졌다는 경쟁 가설도 있어 학자들이 지금도 다툰다. 새로 온 사람들은 섬마다 이미 살던 사냥·채집 집단과 섞였다. 필리핀의 이른바 네그리토 집단은 오스트로네시아 계통의 유전자를 30~50퍼센트 가진 것으로 추정된다. 대륙 쪽에서는 참족의 조상인 참어 계통 사람들이 베트남 중부 해안에 자리 잡았다고 보며, 참파 사람들의 말이 오스트로네시아어 계통인 까닭이 여기에 있다. 그 시기는 학설에 따라 크게 달라진다. 홍강 유역과 타이 동북부의 농경 마을들이 청동을 다루던 때, 청동기 시대 동남아의 바다 쪽에서는 이 이주민이 배와 토기와 가축을 가지고 새 터전을 열었고, 그들의 말은 뒤에 말레이어와 자와어와 타갈로그어, 참어가 되는 말들의 뿌리가 되었다."
  subjects: [southeast-asia-bronze-age]
  tags: [society, culture]
  sources: ["Peter Bellwood, First Islanders: Prehistory and Human Migration in Island Southeast Asia (Wiley Blackwell, 2017)", "Peter Bellwood, Prehistory of the Indo-Malaysian Archipelago, 3rd ed. (ANU Press, 2007)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)"]

- id: ban-chiang-1500bc
  year: -1499
  endYear: -499
  title:
    ko: "반 치앙과 타이 동북부의 청동기·벼농사(기원전 1500~500)"
  summary:
    ko: "반 치앙은 타이 동북부 우돈타니 도 농한 군에 있는 마을 유적으로, 1992년 유네스코 세계유산에 올랐다. 1974~1975년 미국 펜실베이니아 대학 박물관과 타이 예술국이 함께 발굴했고(체스터 고먼과 피싯 차룬웡사가 공동 책임), 142기 이상의 무덤이 나왔다. 사람들은 집 곁이나 집 밑에 죽은 이를 묻으면서 토기와 부장품을 함께 넣었다. 처음에는 열형광 측정으로 기원전 4400~3400년이라는 값이 나와 세계에서 가장 이른 청동기 문화로 불렸으나, 뒤의 방사성탄소 측정은 청동 주조가 기원전 2000년 무렵에 시작되었다고 보았고, 찰스 하이엄 등이 사람과 동물 뼈로 한 베이지안 분석은 마을이 처음 들어선 때를 기원전 1500년 무렵, 청동기로 넘어간 때를 기원전 1000년 무렵으로 잡는다. 금속 가공이 언제 시작되었는지는 지금도 크게 다투는 문제이고, 초기 보고가 내세운 이른 철 가공 연대도 뒤의 발굴로 받아들여지기 어렵게 되었다. 도가니 같은 유물이 나와 마을 사람들이 청동 도구를 직접 부어 만들었음을 알 수 있고, 청동 제품은 큰 공방이 아니라 마을마다 작은 규모로 만들어졌다. 가장 아래 무덤에서 나온 벼 식물 규소체는 기원전 2100년 무렵으로 측정되어 벼농사가 이르게 자리 잡았음을 시사하나 해석은 갈린다. 물소를 부린 뒤 사람들의 평균 수명이 30.4세에서 28.1세로 줄었다는 분석도 있다. 반 치앙의 이름을 널리 알린 붉은 무늬 토기는 기원전 300년~기원후 200년 무렵으로 훨씬 뒤의 것이다. 이 유적은 청동기 시대 동남아에서 홍강 유역의 풍응우옌·동선과 견줄 자리를 차지하며, 청동 기술이 중국에서 들어왔는지 이곳에서 따로 시작되었는지를 가르는 논쟁의 한가운데에 있다."
  subjects: [southeast-asia-bronze-age]
  tags: [society, culture]
  sources: ["Charles Higham, The Bronze Age of Southeast Asia (Cambridge University Press, 1996)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)", "Joyce C. White, Ban Chiang: Discovery of a Lost Bronze Age (University of Pennsylvania Museum, 2008)"]

- id: sa-huynh-1000bc
  year: -999
  endYear: 200
  title:
    ko: "사후인 문화와 바다의 옥·구슬 교역(기원전 1000~기원후 200)"
  summary:
    ko: "사후인 문화는 청동기 시대 동남아의 바닷가 쪽 문화로, 기원전 1000년 무렵부터 기원후 200년 무렵까지 베트남 중부와 남부 해안, 곧 꽝빈에서 메콩 삼각주 가장자리에 걸쳐 번성했다. 이름은 1909년 프랑스 학자 비네가 꽝응아이 성 해안 모래 언덕의 사후인 유적에서 독무덤을 찾아 보고한 데서 왔다. 가장 큰 특징은 죽은 이를 화장해 뚜껑 달린 독에 담아 묻는 풍습으로, 독 곁에 깨뜨린 그릇을 함께 두기도 했는데, 이런 매장 방식은 이 문화만의 특징으로 꼽힌다. 북쪽 동선 문화에서 청동이 중심이었던 것과 달리 이곳 유적에서는 이 지역에서 만든 철 도구와 무기가 많이 나온다. 사람들은 짐승 두 마리가 맞붙은 모양의 옥이나 유리 귀걸이를 달았는데, 이런 ‘링링오’ 귀걸이는 필리핀과 타이완, 타이 남부, 보르네오 북동부에서도 나와 바다를 사이에 둔 넓은 교류권의 증거가 된다. 연구자들은 이를 사후인–칼라나이 교류권(기원전 500~기원후 1500)이라 부른다. 초록 옥은 타이완에서, 초록 운모는 필리핀 민도로에서 왔고 검은 옥은 베트남 하띤에서 났다. 유리와 홍옥수 구슬, 금 장신구는 대체로 바깥에서 들여온 것이며, 한(漢)의 청동 거울도 나와 기원후 첫 세기에 이미 중국과 인도 쪽 교역에 닿아 있었음을 보여 준다. 이 사람들이 참족의 조상일 것이라는 견해가 많은데, 임읍의 주민을 처음에는 몬–크메르 계통으로 보고 참족은 뒤에 북쪽으로 퍼지며 합쳐졌다는 반론도 있다. 기원후 192년 일남군에서 임읍이 일어서는 때(「구련의 임읍 건국과 참파의 시작(192~280)」(뒤의 사건))가 이 문화의 끝 무렵과 겹쳐서, 사후인에서 참파로 이어졌다고 보는 견해가 널리 받아들여진다."
  subjects: [southeast-asia-bronze-age, champa]
  tags: [society, culture, economy]
  sources: ["Charles Higham, The Bronze Age of Southeast Asia (Cambridge University Press, 1996)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)", "Peter Bellwood, First Islanders: Prehistory and Human Migration in Island Southeast Asia (Wiley Blackwell, 2017)"]

- id: dong-son-700bc
  year: -699
  endYear: 43
  title:
    ko: "동선 문화와 청동 북(기원전 700~기원후 43)"
  summary:
    ko: "동선 문화는 청동기 시대 동남아의 대표 문화로, 홍강 삼각주와 마강(타인호아) 유역을 중심으로 기원전 1000년 무렵부터 기원후 1세기까지 이어진 청동기 문화로, 청동 북이 두드러지게 만들어진 기원전 700년 앞뒤부터를 이 사건이 다룬다. 이름은 타인호아 성 동선 마을 유적에서 땄다. 이 문화는 앞선 고문 문화에서 나왔고, 타이의 증거로 보아 청동 주조가 중국에서 건너온 것이 아니라 동남아에서 따로 발달했을 수도 있다고 보는 연구가 있다. 사람들은 벼를 짓고 물소와 돼지를 길렀으며 통나무배를 타고 오갔고, 청동으로 도구와 무기, 허리띠 고리, 종과 북을 부어 만들었다. 대표 유물인 청동 북은 하노이 남쪽 응옥르 유적에서 나온 것이 유명하며, 북 면에는 깃털 장식을 쓴 전사와 배, 새, 악사, 벼를 찧는 모습이 새겨져 있다. 오스트리아 학자 헤거가 나눈 ‘헤거 1형’ 북은 이 문화의 중심지에서 만들어졌고, 같은 갈래의 북은 윈난과 광시에서 타이, 말레이 반도, 수마트라와 자와, 인도네시아 동부 섬들까지 퍼져 나갔다. 북이 퍼진 길은 교역 사슬을 따라간 것으로 보며, 북 면의 그림은 이 사회가 어떻게 살았는지 알려 주는 거의 유일한 단서다. 『후한서』 마원전은 마원이 교지에서 낙월(駱越)의 구리 북을 얻어 말 모양을 만들었다고 전한다. 이는 기원후 43년 쯩 자매의 봉기가 눌린 뒤의 일이다(「쯩 자매의 봉기와 마원의 원정(40~43)」(뒤의 사건)). 한이 이 땅을 직접 다스리면서(「한의 교지 지배와 북속기의 시작(기원전 111~기원후 39)」(뒤의 사건)) 청동 북의 전통은 사라지고 한식 벽돌 무덤이 늘었다. 이 문화의 사람들이 어떤 말을 썼는지는 분명하지 않으며, 오늘날 베트남인의 조상과 곧바로 이어진다는 주장에는 이견이 있다."
  subjects: [southeast-asia-bronze-age]
  tags: [society, culture]
  sources: ["Charles Higham, The Bronze Age of Southeast Asia (Cambridge University Press, 1996)", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "『후한서』 마원전"]

- id: au-lac-257bc
  year: -256
  endYear: -178
  title:
    ko: "반랑 전승과 안즈엉브엉의 어우락(기원전 257~179)"
  summary:
    ko: "베트남 전승은 홍강 유역에 홍방 왕조가 있었고 반랑을 도읍으로 한 이 나라를 18대 흥 왕이 다스렸다고 전한다. 이 이야기는 15세기 『대월사기전서』에서 완성된 꼴로 나타나며, 고고학으로는 청동기 시대 동남아의 홍강 유역 사회, 곧 풍응우옌에서 동선으로 이어진 사회와 겹쳐 읽는다. 같은 전승은 기원전 257년 서쪽 산지의 어우비엣 사람을 이끈 툭판(안즈엉브엉)이 반랑을 눌러 두 집단을 합쳐 어우락을 세웠다고 적는다. 도읍 꼬로아 성은 하노이 동쪽에 있고 달팽이 껍데기처럼 겹겹의 해자와 성벽을 두른 큰 유적으로, 넓이가 약 600헥타르에 이르며 건설이 기원전 4세기에 시작되어 기원전 300~100년에 중간 단계를 맞았다고 본다. 전승에는 금빛 거북이 성을 쌓는 일을 도왔고 까오로가 그 발톱으로 한 번에 수백 명을 쏘는 쇠뇌를 만들었다는 이야기가 얹혀 있다. 쇠뇌를 쓰는 군대는 전국 시대 중국의 기술에서 영향을 받았을 수 있다. 『사기』 남월열전은 어우락이라는 이름을 적지 않고, 기원전 180년 여후가 죽은 뒤 남월의 조타가 군대의 위세와 재물로 민월과 서구·낙(西甌駱)을 복속시켰다고 적는다. 이를 어우락의 병합으로 읽어 기원전 179년으로 잡는 것이 통설이다. 병합이 어떻게 이루어졌는지는 사료가 말해 주지 않으며, 남월의 힘이 실제로 얼마나 미쳤는지는 연구자마다 달리 본다. 전승은 조타의 아들 쫑투이가 안즈엉브엉의 딸 미쩌우와 혼인한 뒤 쇠뇌의 방아쇠를 몰래 망가뜨렸다는 이야기로 이 일을 설명한다. ‘어우락’이라는 이름이 문헌에 나타나는 것은 15세기에 와서이고, 안즈엉브엉을 실제 인물로 보는 연구도 있다. 이 일은 「조타의 남월: 건국에서 어우락 병합과 멸망까지(기원전 204~111)」(뒤의 사건)에서 이어진다."
  subjects: [southeast-asia-bronze-age, nanyue]
  tags: [politics, society]
  sources: ["Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "『사기』 남월열전", "『대월사기전서』"]

- id: nanyue-zhao-tuo-204bc
  year: -203
  endYear: -110
  title:
    ko: "조타의 남월: 건국에서 어우락 병합과 멸망까지(기원전 204~111)"
  summary:
    ko: "진의 남해군 용천 현령이던 조타(찌에우다, 趙佗)는 진이 무너지는 틈에 영남을 쥐었다. 남해 군위 임효가 병들어 죽기 전에 뒷일을 맡기자 조타는 오령의 관문을 막고 진이 둔 관리들을 죽인 뒤, 기원전 204년(기원전 203년 설도 있음) 계림과 상군을 아울러 남월 무왕(武王)을 칭하고 번우(지금의 광저우)에 도읍했다(「진의 영남 정복과 영거(기원전 219~214)」(앞의 사건)). 기원전 196년 한 고조가 육가를 보내 인을 내리자 조타는 신하가 되기로 했다. 그러나 여후 때(기원전 185~183년 무렵) 한이 철기와 말의 교역을 막자 스스로 황제를 칭하고 장사국을 쳤고, 기원전 181년 한의 반격은 덥고 습한 날씨 탓에 병사가 병들어 실패했다. 여후가 죽고(기원전 180년) 문제가 달래자 조타는 한과의 관계에서는 황제 칭호를 거두었으나 나라 안에서는 그대로 썼다(「혜제와 여후의 시대(기원전 195~180)」(뒤의 사건)). 조타는 군대와 재물로 민월과 서구·낙을 복속시켰고 기원전 179년 무렵 홍강 유역의 어우락을 아울렀다(「반랑 전승과 안즈엉브엉의 어우락(기원전 257~179)」(앞의 사건)). 그는 기원전 137년 100세가 넘어(103세로 전한다) 죽었다. 손자 조말(趙眜, 재위 기원전 137~122)이 이었는데, 1983년 광저우 상강산에서 나온 그의 무덤에는 비단실로 꿴 옥 수의와 ‘문제행새(文帝行璽)’ 금도장이 있어 나라 안에서 황제를 칭했음을 보여 준다. 이어 조영제(재위 기원전 122~113), 그 아들 조흥(113~112), 조흥의 이복형 조건덕(112~111)이 올랐고 재상 여가가 오래도록 실권을 쥐었다. 기원전 112년 한인 출신 태후와 어린 왕 조흥이 한에 복속하려 하자 여가가 둘을 죽이고 건덕을 세웠다. 한은 군대를 보내 기원전 111년 번우를 함락했고 건덕과 여가를 사로잡았다. 이 일은 「한 무제의 남월·민월·서남이 정복」(뒤의 사건)에서 이어지며, 한 무제는 3년 뒤 고조선도 무너뜨렸다."
  subjects: [nanyue, western-han, gojoseon]
  links:
    - { from: western-han, to: nanyue, note: "번우를 함락해 남월을 멸망시킴 (기원전 111)" }
  tags: [politics, war]
  sources: ["『사기』 남월열전", "『한서』 남월전", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Ben Kiernan, Việt Nam: A History from Earliest Times to the Present (Oxford University Press, 2017)"]

- id: indian-ocean-trade-200bc
  year: -199
  endYear: 100
  title:
    ko: "인도와 이어진 바닷길과 철기 시대의 시작(기원전 200~기원후 100)"
  summary:
    ko: "기원전 3세기 무렵부터 동남아 곳곳에서 철기가 널리 퍼지면서 청동기 시대 동남아의 시대가 저물고 철기 시대가 열렸다. 홍강 유역에서는 남월과 한의 철기가 들어왔고, 타이 동북부와 베트남 중부 해안에서는 철을 스스로 만들어 쓰는 마을이 늘었다. 이 무렵 인도 동해안과 동남아 사이에는 계절풍을 타고 오가는 뱃길이 자리 잡았고, 금과 은, 향료, 상아, 코뿔소 뿔, 거북 껍데기가 이 바닷길의 대표 물건이었다. 타이 중부의 반 돈 타 펫(기원전 400~300 무렵)이나 끄라 지협의 카오 삼 깨오 같은 유적에서는 인도에서 온 홍옥수 구슬과 인도식 물건이 나와, 인도와의 접촉이 기원전 몇 세기부터 있었음을 보여 준다. 『한서』 지리지에는 한의 사신이 일남군의 변경 요새나 쉬원, 합포에서 배를 타고 몇 나라를 거쳐 다섯 달 남짓 가면 도원국에 이르고, 거기서 뭍길과 다시 뱃길로 황지국(黃支國, 인도 남동 해안으로 본다)에 이른다고 적혀 있다. 한 무제 때 황금과 비단을 싣고 간 사신들이 이 길을 따라 진귀한 물건을 사 왔다고 한다. 인도 쪽 불교 전승은 아소카 왕이 수바르나부미, 곧 ‘황금의 땅’에 승려를 보냈다고 하나 이 땅이 어디인지는 학자마다 달리 본다. 기원후 1세기의 그리스어 항해 안내서와 2세기의 프톨레마이오스는 황금의 땅과 카티가라라는 항구를 적고 있다. 이 물결을 따라 인도의 문자와 종교, 왕권 관념이 들어와 동남아 수령들의 권위를 세우는 데 쓰였다. 이렇게 이어진 바닷길에서 옥에오 같은 항구가 자라 부남의 기반이 되었고(「부남의 성립: 혼전과 유엽 전승(50~225)」(뒤의 사건)), 청동기 시대 동남아라 부르는 문화권은 이 무렵 철기 시대로 넘어갔다."
  subjects: [southeast-asia-bronze-age, western-han, nanyue]
  tags: [economy, culture]
  sources: ["Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)", "『한서』 지리지"]

- id: pyu-beikthano-200bc
  year: -199
  endYear: 400
  title:
    ko: "쀼 도시국가의 등장: 베익타노와 할린(기원전 200~기원후 400)"
  summary:
    ko: "쀼는 티베트–버마어를 쓰던 사람들로, 기원전 2세기 무렵 이라와디강 유역에 들어와 성곽을 두른 도시를 세웠다. 가장 이른 도시 가운데 하나인 베익타노는 기원전 180년 무렵 선 것으로 보며, 벽돌 성벽을 둘러싼 도시의 방사성탄소 연대는 기원전 180년에서 기원후 610년에 걸친다. 도시 터에서는 벽돌로 쌓은 불교 건물 터와 항아리 무덤이 나왔다. 또 다른 대표 도시 할린은 더 북쪽 사가잉 지방에 있고, 도시 문에서 나온 나무의 방사성탄소 연대는 기원후 70년 무렵으로 나왔다. 쀼 사람들은 도시마다 따로 왕을 두었으며 하나의 나라로 묶인 적이 없고, 중국 사서는 훗날 이들을 표(驃)라 불렀다. 3~4세기에 이르면 쀼 글자로 쓴 가장 이른 글이 나타나고, 화장한 뼈를 담은 항아리와 불교의 무늬가 스리크세트라에서도 나온다. 베익타노는 성벽의 방사성탄소 연대가 기원전 180년에서 기원후 610년에 걸치지만, 유적 자체는 기원전 200년에서 기원후 100년 무렵의 것으로 본다. 쀼는 인도와 중국 윈난을 잇는 육상과 해상 교역로의 길목에 앉아 있었고, 이라와디강 중류의 건조한 땅에서 저수지와 수로로 물을 대 벼를 짓는 일이 이를 받쳤다. 쀼 도시들은 5~8세기 스리크세트라가 중심이 되는 시기를 거쳐(「스리크세트라와 쀼의 불교(5~8세기)」(뒤의 사건)) 832년 무렵 남조의 군대가 할린을 약탈하면서 기울고, 11세기 중엽 바간 왕국의 버마 사람들 속에 섞여 들어간다. 2014년 베익타노·할린·스리크세트라는 ‘쀼 고대 도시’로 유네스코 세계유산에 올랐다. 고고학 연대와 연대기의 연대가 자주 어긋나서, 연대기가 전하는 해는 전승으로 다뤄야 한다."
  subjects: [pyu-city-states]
  tags: [society, culture, religion]
  sources: ["Janice Stargardt, The Ancient Pyu of Burma, vol. 1: Early Pyu Cities in a Man-Made Landscape (PACSEA, 1990)", "Gordon H. Luce, Phases of Pre-Pagán Burma: Languages and History (Oxford University Press, 1985)", "Charles Higham, Early Mainland Southeast Asia: From First Humans to Angkor (River Books, 2014)"]

- id: jiaozhi-commanderies-111bc
  year: -110
  endYear: 39
  title:
    ko: "한의 교지 지배와 북속기의 시작(기원전 111~기원후 39)"
  summary:
    ko: "기원전 111년 남월을 무너뜨린 한은 그 땅(지금의 광둥·광시·하이난과 베트남 북부)에 남해·창오·울림·합포·교지·구진·일남·주애·담이의 9개 군을 두었고, 그 가운데 교지·구진·일남이 지금의 베트남 북부와 중부에 있었다(「한 무제의 남월·민월·서남이 정복」(앞의 사건)). 이때부터 천 년쯤 이어지는 중국의 베트남 지배를 베트남에서는 북속기(北屬期)라 부른다. 『한서』 지리지에 따르면 서기 2년 호구 조사에서 교지군에 9만 2천여 호와 74만 6천여 명, 구진군에 3만 5천여 호와 16만 6천여 명, 일남군에 1만 5천여 호와 6만 9천여 명이 기록되어 있다. 교지군은 10개 현으로 이루어졌고 홍강 평야의 룩러우와 롱비엔이 중심이었다. 하이난섬의 주애·담이 두 군은 먼 데다 저항이 잦아 한이 기원전 82년과 46년에 차례로 줄이거나 없앴다. 한은 베트남 쪽 군에는 자사(刺史)를 두어 감찰하게 했으나, 홍강 유역에서는 낙장(雒將)이라 불리는 토착 수령이 현을 다스리는 관습이 이어졌고 한은 이들의 세력을 크게 건드리지 않았다. 군현의 관리와 상인, 유배된 사람들이 내려오면서 한자와 철제 농기구, 쟁기와 소로 짓는 농사, 유교식 혼례와 학교가 조금씩 들어왔다고 한다. 1세기 초 교지 태수 서광(錫光)과 구진 태수 임연(任延)이 농사와 예법을 가르쳤다고 전하지만, 이 기록은 중국 쪽 사서에만 의존한다. 한의 군현 지배가 느슨하던 홍강 유역에서는 서기 40년, 낙장 가문의 딸 쯩짝이 일으킨 봉기가 터진다(「쯩 자매의 봉기와 마원의 원정(40~43)」(뒤의 사건)). 이 사건 기간에는 한이 왕망의 신(新)을 거쳐 후한으로 바뀌는 일도 겹쳐 있어 교지의 정치도 여러 번 달라졌다."
  subjects: [western-han, eastern-han, nanyue]
  tags: [politics, society]
  sources: ["『한서』 지리지", "『후한서』 남만서남이열전", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Ben Kiernan, Việt Nam: A History from Earliest Times to the Present (Oxford University Press, 2017)"]

- id: trung-sisters-40
  year: 40
  endYear: 43
  title:
    ko: "쯩 자매의 봉기와 마원의 원정(40~43)"
  summary:
    ko: "서기 40년 봄(음력) 지금의 하노이 서쪽 메링에서 쯩 자매(쯩짝·쯩니, 徵側·徵貳)가 한의 지배에 맞서 일어났다. 쯩짝은 낙장 가문의 딸로 시색(詩索)의 아내였다. 베트남 전승은 교지 태수 소정(蘇定)이 시색을 죽이고 세금을 무겁게 거둔 일이 봉기의 계기였다고 전하지만, 중국 사서에는 소정이 시색을 죽였다는 말이 없다. 『후한서』는 쯩짝 자매가 구진·일남·합포의 토착 수령을 끌어들여 영외 65개 성을 차지했다고 적는다. 쯩짝은 왕을 칭하고 메링에 도읍했다. 후한 광무제는 41년 마원을 복파장군으로 삼아 장사 등 여러 군에서 병력 1만~2만을 모으게 했고(「광무제의 통치: 세금 경감과 도전 검사, 교지의 징 자매 반란(30~57)」(앞의 사건)), 마원은 42년 봄 군대를 이끌고 교지에 닿아 랑박 근처 싸움에서 반군을 무찔렀다. 자매는 금계(禁溪)로 물러났다가 이듬해 43년 사로잡히거나 쓰러져 목이 베여 낙양으로 보내졌다고 『후한서』는 적는다(달이 정월과 4월로 사서마다 갈린다). 베트남 전승은 두 사람이 하트강에 몸을 던졌다고 한다. 『후한서』는 이어 300여 명의 반군 수령이 영릉으로 옮겨졌고, 구진의 두양 등을 칠 때 5천여 명을 베거나 사로잡았다고 전한다. 마원은 서우현을 봉계·망해 두 현으로 나누고 월(越)의 법과 한의 법이 어긋나는 10여 가지를 고쳐 아뢰었다고 한다. 이 일 뒤로 한은 낙장을 통한 간접 지배를 줄이고 군현의 관리를 직접 보내는 체제로 나아갔다. 마원이 국경에 세웠다는 구리 기둥 이야기는 후대 전승이라 자리가 분명하지 않다. 봉기의 중심이 메링이었고 낙장 수령들이 전사로 나선 점은 동선 이래의 토착 군사력이 아직 남아 있었음을 보여 준다. 베트남에서는 쯩 자매를 민족의 영웅으로 기리고 오늘날도 제사를 지낸다."
  subjects: [eastern-han]
  tags: [war, politics]
  sources: ["『후한서』 남만서남이열전", "『후한서』 마원전", "『대월사기전서』", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)"]

- id: funan-founding-50
  year: 50
  endYear: 225
  title:
    ko: "부남의 성립: 혼전과 유엽 전승(50~225)"
  summary:
    ko: "부남(扶南)은 동남아에서 처음 기록에 나타나는 큰 나라로, 중심은 메콩 삼각주와 지금의 캄보디아 남부였다. 부남이라는 이름은 중국 사서의 것이며 그 시대의 현지 글에는 나오지 않는다. 『양서』 부남전 등이 전하는 건국 이야기에 따르면, 혼전(混塡, 인도 브라만 카운디냐와 같은 사람으로 보기도 한다)은 꿈에서 신이 준 활을 받아 상인의 배를 타고 바다로 나가 부남 땅에 닿았다. 이곳의 여왕 유엽(柳葉)이 배를 습격하려 하자 혼전의 화살이 배를 꿰뚫었고, 놀란 유엽이 항복하자 혼전은 벌거벗고 있던 유엽에게 천을 둘러 주고 혼인해 나라를 세웠다고 한다. 이 이야기는 캄보디아의 프레아 통과 니양 니악 설화와 닮았고, 인도 문화가 이 땅에 퍼진 일을 설명하는 이야기로 읽힌다. 혼전이 상인의 배를 탔다는 점은 인도 상인과 브라만이 바닷길로 이 땅에 들어온 사정을 비추고, 그가 받은 활은 왕권의 상징으로 읽힌다. 이후 자손이 일곱 읍에 나뉘어 다스렸으며, 혼반황(混盤況)을 거쳐 반반(盤盤)이 3년 만에 죽자 대장군 범만(范蔓, 범사만(范師蔓)으로도 적는다)이 왕으로 추대되었다고 한다. 앙코르보레이를 비롯한 유적은 이곳에 이미 기원전부터 사람이 살았음을 보여 주며, 주민이 몬–크메르 계통이었는지 오스트로네시아 계통이었는지 여러 계통이 섞였는지는 다툼이 있다. 나라가 선 해는 1세기 무렵(50년, 68년 설도 있음)으로 보며, 범만이 죽는 225년 무렵(228년으로 적는 군주표도 있다)까지를 이 사건이 다룬다. 이 시기의 부남은 운하를 파서 논에 물을 대고 배를 만들어 바다 교역에 나서면서 자랐고, 그 힘이 범만 때 이웃 나라들을 눌러 바닷가 교역로를 차지하는 데 쓰였다(「범만의 부남 확장과 강태·주응의 사행(205~250 무렵)」(뒤의 사건)). 부남의 항구 옥에오는 인도양 바닷길의 길목으로 자랐다."
  subjects: [funan]
  tags: [politics, society]
  sources: ["『양서』 부남전", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)"]

- id: oc-eo-100
  year: 100
  endYear: 550
  title:
    ko: "옥에오 항구와 부남의 바다 교역(1~6세기)"
  summary:
    ko: "옥에오는 베트남 남부 안장성 토아이선 군에 있는 유적으로, 1942년 프랑스 학자들이 항공 사진으로 찾아낸 뒤 루이 말르레가 발굴을 이끌었다. 부남의 큰 항구였다고 보며 사용된 때는 기원전 2세기부터 기원후 12세기까지로 길게 잡는 문서도 있다. 운하가 유적을 가로지르고, 68킬로미터쯤 되는 운하가 북동쪽 앙코르보레이로 이어져 도시와 항구를 물길로 묶었다. 이곳에서 안토니누스 피우스(재위 138~161) 때의 로마 금 메달이 나왔고 마르쿠스 아우렐리우스(재위 161~180) 때의 것도 있다고 하며, 인도와 페르시아 계통의 물건도 함께 나와 부남이 인도양과 남중국해를 잇는 교역의 중간 기지였음을 보여 준다. 말르레는 옥에오를 프톨레마이오스가 적은 카티가라와 같은 항구로 보았다. 부남은 이 교역으로 얻은 부로 운하와 논, 은 동전과 큰 도시를 갖추었다. 옥에오 문화는 서기 1~630년으로 잡는다. 말레이 반도 쪽 랑카수카(狼牙脩)는 『양서』가 건국이 400여 년 전이라고 적어 2세기로 거슬러 오르는 나라로, 3세기 초 부남이 커지면서 기울었다고 한다. 이 나라는 515년 바가닷타 왕이 처음 중국에 사신을 보냈고 523년, 531년, 568년에도 사신이 갔다. 위치는 타이 남부 파타니 일대로 보는 견해가 많고 1989년부터 야랑에서 불교와 힌두교 유물, 중국과 아랍의 청동 동전이 발굴되었다. 옥에오에서는 6~7세기의 비슈누 상이 나와 힌두 신앙이 이 항구를 지배한 때도 있었음을 알려 준다. 부남의 힘이 기울고 첸라가 일어나면서(「첸라의 성립: 바바바르만 1세와 마헨드라바르만(550~616)」(뒤의 사건)) 옥에오 일대의 교역은 줄었다고 본다."
  subjects: [funan]
  tags: [economy, culture]
  sources: ["Louis Malleret, L'archéologie du delta du Mékong, 4 vols. (École française d'Extrême-Orient, 1959–1963)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "『양서』 제이전"]

- id: linyi-founding-192
  year: 192
  endYear: 280
  title:
    ko: "구련의 임읍 건국과 참파의 시작(192~280)"
  summary:
    ko: "한의 일남군은 지금 베트남 중부 꽝빈에서 꽝남 일대에 걸쳐 있었고, 가장 남쪽 현이 상림현이었다. 사서는 서기 137년 상림의 만이 한의 관리를 공격하는 소란이 있었고, 192년 상림 사람 구련(區連)이 현령을 죽이고 왕을 칭했다고 전한다(137년을 건국으로 보는 설도 있다). 137년 소란에서는 수천 명이 상림현을 공격해 관리를 죽였다고 전하며, 이 일 때문에 구련이 나라를 세운 해가 137년이라는 설도 생겼다. 이 나라를 중국 사서는 임읍(林邑)이라 불렀는데, 상림에서 ‘상’ 자를 떼고 읽은 이름으로 본다. 도읍은 칸다푸라로 보며 지금 후에 둘레에 있었다고 한다. 구련에게 아들이 없어 외조카 범웅(范熊)이 이었고, 범웅의 아들 범일(范逸)이 뒤를 이었다고 『진서』가 전한다. 임읍은 3세기 내내 한이 약해진 틈에 일남군과 구진군을 거듭 습격했고, 오의 교지 지배와 부딪혔다(「오의 교지 지배와 찌에우 부인의 봉기(226~248)」(뒤의 사건)). 280년 진이 오를 멸망시켜 중국을 다시 합친 뒤에도 임읍은 일남·구진 변경을 위협했다. 임읍 주민이 누구였는지는 학자마다 다르다. 참족의 조상인 사후인 사람들이 세웠다고 보는 견해가 널리 받아들여지지만(「사후인 문화와 바다의 옥·구슬 교역(기원전 1000~기원후 200)」(앞의 사건)), 한 학자는 중국 사서의 임읍은 참족이 아니라 몬–크메르 계통 사람이었고 참족은 5~6세기에야 북쪽으로 퍼지며 합쳐졌다고 주장한다. 임읍이라는 이름은 마지막 사행이 있던 749년까지 쓰였고 8세기 중엽부터 환왕(環王), 9세기에는 점성(占城)으로 바뀌었으며 점성이 참파다. 임읍에서 시작된 이 나라는 뒤에 참파라는 이름으로 15세기까지 중국·베트남과 맞닿으며 이어진다."
  subjects: [champa, eastern-han]
  links:
    - { from: champa, to: eastern-han, note: "일남군 상림현에서 떨어져 나와 임읍을 세움 (192)" }
  tags: [politics, society]
  sources: ["『후한서』 남만서남이열전", "『진서』 사이전 임읍국", "『수경주』", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia (Toyo Bunko, 1998)"]

- id: fan-shiman-205
  year: 205
  endYear: 250
  title:
    ko: "범만의 부남 확장과 강태·주응의 사행(205~250 무렵)"
  summary:
    ko: "『양서』 부남전은 범만(范蔓)이 큰 배를 만들어 바다를 건너 이웃 나라 열 곳 남짓을 쳐서 복속시키고 ‘부남 대왕’을 칭했다고 적는다. 위치가 분명하지 않은 이 나라들에는 말레이 반도 쪽 땅도 포함되었다고 보며, 이 일은 보통 3세기 초(205년 무렵부터 재위로 보는 쪽이 있고, 일부 군주표는 범만의 재위를 220~228년으로 적는다)의 일이다. 범만은 금린(金鄰) 정벌에 나섰다가 병들어 죽었다고 하고(225년 무렵), 맏아들 범금생(范金生)이 먼 나라에 있던 사이 누이의 아들 범전(范旃)이 왕위를 가로챘다고 한다. 범전은 돌아온 금생을 죽였고, 범만의 둘째 아들 범장(范長)이 범전을 죽였으며, 범심(范尋)이 범장을 죽이고 왕이 되었다고 『양서』는 적는다. 이런 짧은 재위와 찬탈이 이어진 사정은 사서가 간략해 연대를 확정하기 어렵다. 226년 교지를 직접 다스리게 된 오는(「오의 교지 지배와 찌에우 부인의 봉기(226~248)」(뒤의 사건)) 중랑 강태(康泰)와 선화종사 주응(朱應)을 부남에 보냈는데, 이들이 간 때는 245~250년 무렵으로 보며 부남 왕은 범전 또는 범심이었다고 갈린다. 『양서』에 따르면 부남은 인도에 사신 소물(蘇物)을 보냈고, 인도 왕은 진송(陳宋)을 사신으로 보냈는데 강태와 주응이 진송을 만나 인도의 일을 물었다고 전한다. 강태는 돌아와 『오시외국전』을 썼고, 부남의 도읍과 궁전, 문자가 인도 글자를 닮았다고 적었다. 두 사람은 이 나라 사람들이 벌거벗고 지내는 것을 보고 옷을 입히라고 권했고, 왕이 그 뒤 남자들에게 가로 두른 천을 입게 했다고 『양서』는 적는다. 강태와 주응의 책은 사서에 인용된 조각으로만 전해진다. 부남은 3세기 중엽 중국과 인도 양쪽에 사신을 보내며 바다 교역의 중심 나라로 올라섰다. 이 일은 263년의 교지 반란(「교지의 여흥 반란과 오의 교지 회복」(뒤의 사건))에 앞선다."
  subjects: [funan, wu]
  tags: [politics, diplomacy]
  sources: ["강태, 『오시외국전』(후대 책에 인용된 조각)", "『양서』 부남전", "『수서』 진랍전", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia (Toyo Bunko, 1998)"]

- id: lady-trieu-226
  year: 226
  endYear: 248
  title:
    ko: "오의 교지 지배와 찌에우 부인의 봉기(226~248)"
  summary:
    ko: "후한 말 교지는 사섭(士燮)이 태수로서 187년부터 40년 가까이 실질적으로 다스렸고, 220년 교지는 오에 충성을 맹세했다. 226년 사섭이 죽자 오의 손권은 교지를 교주와 광주로 나누었고, 여대(呂岱)를 보내 227년 사섭의 아들 사휘를 비롯한 집안을 처형하고 교지를 오의 직접 지배 아래 두었다. 사섭은 형제들을 합포·구진·남해 태수로 앉혀 남쪽 일대에 큰 세력을 이루었던 터라 그 집안이 무너진 일은 이 땅의 질서를 크게 흔들었다. 231년 오는 또 다른 장수를 구진군으로 보내 월 사람들의 저항을 눌렀다. 여대는 강태와 주응을 부남에 보내 바다 쪽 소식을 얻게 했다(「범만의 부남 확장과 강태·주응의 사행(205~250 무렵)」(앞의 사건)). 오의 지배가 거칠어지는 가운데 248년 교지와 구진에서 큰 반란이 일어났고, 『삼국지』는 반군이 성을 공격했으며 오의 자사 육윤(陸胤)이 반군 수령을 달래고 재물을 주어 대체로 끝냈고 항복한 집이 3만 호를 넘었다고 적는다. 서진 시대 유흔기(劉欣期)의 『교주기』와 이를 인용한 『태평어람』은 구진의 여성 찌에우 부인(趙嫗)이 이 봉기를 이끌었다고 전한다. 찌에우 부인에 대한 이야기는 베트남 전승에서 더 커져, 코끼리를 타고 싸웠다는 이야기와 죽은 뒤 신선이 되었다는 이야기가 덧붙었는데, 이는 사료로 확인되지 않는다. 죽음도 처형당했다는 설과 스스로 목숨을 끊었다는 설이 있고, 나이는 스물한 살 또는 스물세 살로 전한다. 중국 쪽 사서는 찌에우 부인의 이름을 적지 않는다. 교지의 불안은 가라앉지 않아 263년 다시 반란이 일어났다(「교지의 여흥 반란과 오의 교지 회복」(뒤의 사건))."
  subjects: [wu]
  tags: [politics, war]
  sources: ["『삼국지』 오서", "『태평어람』", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Ben Kiernan, Việt Nam: A History from Earliest Times to the Present (Oxford University Press, 2017)"]

- id: kutai-tarumanagara-358
  year: 358
  endYear: 450
  title:
    ko: "쿠타이와 타루마나가라: 섬 동남아의 첫 산스크리트 비문(358~450)"
  summary:
    ko: "동칼리만탄 마하캄강 가의 무아라카만에서 돌기둥 일곱 개가 나왔다. 유파라 부르는 이 기둥에는 팔라바 문자로 쓴 산스크리트어 비문이 새겨져 있고 내용은 브라만 사제들에게 바친 선물을 기리는 것이다. 글자꼴로 4세기 후반으로 본다. 비문에는 세 대의 왕 이름이 나온다. 이름이 산스크리트어 같지 않은 쿠둥가는 ‘사람들의 주인(나렌드라)’으로 불리고 아마도 토착 수령이었으며, 아들 아스와와르만은 ‘왕가의 시조’로 인도식 신앙을 받아들인 인물로 보고, 손자 물라와르만은 ‘왕 중의 왕(라젠드라)’이라 불리며 비문을 새기게 했다. 비문에 따르면 물라와르만이 브라만에게 소 2만 마리를 바쳤다고 전한다. 이 나라를 쿠타이라 부르는데 그 시대에 불린 이름은 알려져 있지 않으며, 섬 동남아에서 가장 이른 힌두 왕국으로 본다. 서자와의 타루마나가라는 후대 사본이 358년 자야싱하와르만이 세웠다고 전하는데, 이 사본들은 믿기 어렵다는 평가가 많아 358년은 전승 연대다. 5세기 푸르나와르만 왕이 남긴 비문 일곱 개가 지금 보고르·자카르타·반튼에서 나왔는데, 치아루테운 비문은 왕의 발자국을 비슈누의 발자국에 견주고, 투구 비문은 왕이 재위 22년에 고마티강을 잇는 운하를 21일 만에 팠고(찬드라바가 운하는 앞서 팠다고 적는다) 브라만에게 소 1천 마리를 바쳤다고 적는다. 이 비문들에도 연도는 없어 글자꼴로 연대를 헤아린다. 법현은 귀국길인 412년 앞뒤에 야바드비파에 닿아 이곳에 브라만교가 번성한다고 적었다(「법현의 천축 순례(399~412)」(뒤의 사건)). 중국 사서는 이 나라를 다라마(多羅磨)라 적는다. 두 곳의 비문은 모두 토착 수령이 인도의 말과 제사를 빌려 왕의 권위를 세운 흔적으로 읽는다."
  subjects: [tarumanagara]
  tags: [culture, religion, politics]
  sources: ["법현, 『불국기』", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Kenneth R. Hall, A History of Early Southeast Asia: Maritime Trade and Societal Development, 100–1500 (Rowman & Littlefield, 2011)", "J. G. de Casparis, Prasasti Indonesia, vol. 2 (Masa Baru, 1956)"]

- id: waithali-arakan-370
  year: 370
  endYear: 818
  title:
    ko: "아라칸의 웨탈리 왕국(370~818)"
  summary:
    ko: "벵골만 동쪽 라카인 해안에서는 4세기에 힘의 중심이 다냐와디에서 웨탈리로 옮겨 갔다. 아라칸 연대기는 370년 한 수령이 앞 왕조의 마지막 왕을 쳐서 찬드라 왕조를 열었다고 전한다. 이 연대는 전승 연대이며 학자마다 달리 본다. 웨탈리(팔리어 이름 베살리)는 지금 미얀마 라카인주 북부 므라우우 군구, 시트웨 북동쪽 70킬로미터쯤에 있다. 중국과 인도를 잇는 바닷길의 교역 중심지였고 도시의 배치에도 인도의 영향이 짙었다. 729년 새긴 아난다찬드라 비문(산스크리트어)은 이 나라 사람들이 대승 불교를 믿었고 왕가가 시바 신에서 나왔다고 적는다. 비문과 다른 자료를 바탕으로 학자들이 초기 왕들의 목록을 짜지만 왕조의 마지막 왕들에 관한 설명은 자료마다 다르다. 웨탈리의 동전은 찬드라 왕가와 바라문교의 무늬를 새겼으며 아라칸 화폐의 시작으로 꼽히고, 버마의 화폐보다 천 년쯤 앞선다. 전승은 부처가 다냐와디를 찾았고 마하무니 불상이 그때 만들어졌다고 하나 이것은 전설이며, 이 불상은 1784년 버마 왕 보도퍼야가 아라칸을 정복하며 가져갔다. 아난다찬드라는 비문을 새긴 왕으로 알려진 인물이고, 라카인 해안은 벵골과 버마 사이의 바닷길과 육로에 모두 닿아 있었다. 이 왕국의 연대는 아라칸 연대기가 전하는 것이어서 중국·버마 쪽 기록과 맞추기 어렵다. 웨탈리는 818년 무렵 끝난 것으로 전하며 10세기 무렵 권력의 중심은 레므로강 골짜기의 도시들로 옮겨 갔다. 이 이동이 정복 때문인지 버마족 이주 때문인지는 학자들이 갈리게 본다. 현재 터에는 사원 몇 곳과 성벽 흔적이 남아 있다. 이 땅의 뒷이야기는 15세기 므라우우 왕국으로 이어진다(「민소몬의 귀환과 므라우우 왕국(1430~1531)」(뒤의 사건))."
  subjects: [arakan-kingdom]
  tags: [politics, culture, religion]
  sources: ["Pamela Gutman, Burma's Lost Kingdoms: Splendours of Arakan (Orchid Press, 2001)", "Michael W. Charney, Where Jambudipa and Islamdom Converged: Religious Change and the Emergence of Buddhist Communalism in Early Modern Arakan (University of Michigan, 1999)", "『아라칸 연대기』"]

- id: linyi-fan-huda-380
  year: 380
  endYear: 446
  title:
    ko: "범호달과 바드라바르만 1세, 미선의 첫 사원과 유송의 임읍 원정(380~446)"
  summary:
    ko: "4세기 중엽 임읍은 범문(范文)이라는 인물이 왕이 되어 일남군을 공격했고 그 아들 범불(范佛)이 이었다고 『진서』가 전한다. 범호달(范胡達)은 380년 임읍의 왕이 되었고, 비문에서는 ‘다르마마하라자 슈리 바드라바르만’이라 불린다. 그는 이름 끝에 ‘바르만’을 붙인 임읍의 첫 왕으로 알려져 있으며, 산스크리트어 비문을 새기고 인도에서 브라만 학자를 불러 들였다. 그의 비문은 임읍의 이른 산스크리트 비문 가운데 하나로 꼽히며, 연대는 글자꼴로 헤아려 학자마다 갈린다. 그는 지금의 꽝남성 미선 골짜기에 시바의 상징인 링가 바드레슈와라를 모신 성소를 세웠고, 미선은 이후 1000년 가까이 참파 왕들의 제사터가 된다. 군사 면에서는 399년 일남과 구진 두 군을 습격했고, 405년부터 413년까지 동진의 교주 자사와 거듭 싸우다 413년에 패한 뒤 자취를 감추었다. 두 아들이 죽었고, 아들 간가라자가 왕위를 내놓고 인도의 갠지스강 쪽으로 순례를 떠난 것으로 전하며, 그 뒤 임읍은 내전에 들어갔다. 사서가 적은 ‘범호달’과 비문의 ‘바드라바르만’을 같은 인물로 보는 것이 합의된 해석이다. 임읍에서 힌두교가 나라의 종교로 자리 잡은 것은 4세기 부남과의 전쟁과 땅의 획득을 거치며 인도 문화가 들어온 결과라고 설명한다. 420년 유송이 서자 임읍은 변경 군현을 거듭 공격하면서도 송에 사신을 보내 책봉을 받았는데, 이때의 왕 범양매(范陽邁, 재위 420~421 무렵)에 이어 아들 범양매 2세(재위 421~446)가 아버지의 이름을 이어받았다고 적는 자료가 있다. 446년 송이 단화지(檀和之)가 이끄는 원정군을 보내자 이 군대는 임읍의 도읍을 함락하고 약탈했다. 미선의 첫 사원은 큰불로 무너졌고 뒤에 삼부바르만이 다시 지었다. 이 시기 임읍의 연대는 중국 사서와 비문 사이에 어긋나는 대목이 있어 사건마다 한두 해씩 달라질 수 있다."
  subjects: [champa, eastern-jin, liu-song]
  links:
    - { from: champa, to: eastern-jin, note: "일남·구진 두 군을 습격해 약탈함 (399)" }
    - { from: liu-song, to: champa, note: "원정군이 도읍을 함락하고 약탈함 (446)" }
  tags: [religion, politics, war]
  sources: ["『진서』 사이전 임읍국", "『송서』 이만전 임읍국", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia (Toyo Bunko, 1998)"]

- id: sri-ksetra-400
  year: 400
  endYear: 800
  title:
    ko: "스리크세트라와 쀼의 불교(5~8세기)"
  summary:
    ko: "스리크세트라는 지금 미얀마 삐이(프롬) 가까이 흐르는 이라와디강 가에 있던 쀼 도시국가 가운데 가장 큰 도시로, 5세기에서 7세기 사이에 세워졌다고 본다. 화장 무덤은 기원후 270년 무렵(±30년), 불교 무늬가 있는 토기 조각은 340년 무렵(±30년)으로 방사성탄소 측정이 나와 이 땅에 인도 종교가 일찍 닿았음을 알려 준다. 이곳에는 속이 꽉 찬 원통형의 보보지 탑이 남아 있고, 하마자 일대에서는 쀼 글자로 왕들의 이름을 새긴 돌 항아리와 팔리어 불경을 새긴 금판이 나왔다. 쀼 사회는 불교, 특히 상좌부와 대승, 힌두교가 함께 퍼진 사회였고, 돌 항아리에는 하리비크라마·수리야비크라마처럼 ‘비크라마’가 붙은 왕들의 이름이 보인다. 중국의 승려 현장은 648년 이 도시를 ‘실리차달라’라는 이름으로 전했고, 의정은 675년의 기록에서 ‘실리차달라’를 언급했다. 연대기는 이 땅에서 비크라마 왕조가 638년 3월 22일 새 달력을 열었고 739년 3월 25일 두투바웅이 둘째 왕조를 세웠다고 전하지만, 이 연대는 후대 연대기의 것이고 고고학과 맞지 않는 데가 있다. 8세기 중반 남조가 남쪽으로 내려오면서 754년 또는 760년께 습격이 시작되었고 763년까지 이라와디강 위쪽을 차지했다. 쀼의 왕은 800~802년 사절을 당에 보냈는데, 『신당서』 표국전은 802년 왕자 수난타(舒難陀)가 이끄는 악사단이 당 조정에서 연주했다고 적는다. 832년 무렵 남조는 할린을 약탈하고 3천 명을 끌어갔다. 그러나 할린 일대에서는 그 뒤로도 870년 무렵까지 사람이 산 흔적이 있어 이 도시들이 한꺼번에 사라지지는 않았다. 쀼의 도시들은 11세기 중엽 바간 왕국에 흡수된다."
  subjects: [pyu-city-states]
  tags: [religion, culture, society]
  sources: ["Janice Stargardt, The Ancient Pyu of Burma, vol. 1: Early Pyu Cities in a Man-Made Landscape (PACSEA, 1990)", "Gordon H. Luce, Phases of Pre-Pagán Burma: Languages and History (Oxford University Press, 1985)", "『신당서』 표국전"]

- id: funan-jayavarman-484
  year: 484
  endYear: 514
  title:
    ko: "부남 자야바르만의 남제·양 사행과 불교(484~514)"
  summary:
    ko: "자야바르만 카운디냐(闍耶跋摩)는 5세기 말 부남의 왕이다. 『남제서』는 479년 소도성이 세운 남조의 제(齊)가 그에게 ‘안남장군 부남왕’이라는 칭호를 내렸다고 적는다(「남조의 송·제·양 교체와 고구려·백제·대가야의 책봉」(앞의 사건)). 484년 자야바르만은 인도의 승려 나가세나(那伽仙)를 남제에 보내 임읍(참파)을 칠 군대를 청했다. 이 일은 임읍이 부남의 이웃으로 커지는 것을 막으려는 뜻이었다고 설명되며, 남제 조정은 요청에 응하지 않았다. 나가세나는 인도 사람으로, 인도 문화가 부남 왕실에 뿌리내렸음을 이 일이 보여 준다. 나가세나가 올린 글에는 시바 신을 섬기는 풍습이 담겨 있고, 불교도 함께 번성했음을 알려 준다. 502년 양이 서자 503년 자야바르만은 산호 불상을 바쳤고 양은 그의 칭호를 높여 주었다. 그는 514년에 죽었다. 중국 사서는 죽은 뒤 첩의 아들 루드라바르만(留陀跋摩)이 왕위 다툼에서 이복동생 구나바르만을 죽이고 올랐다고 적는다. 남아 있는 비문에 따르면 자야바르만의 왕비 쿨라프라바바티가 514년부터 517년까지 직접 나라를 다스렸고, 엘리트들이 그를 지지했으나 의붓아들 루드라바르만에게 패했다. 구나바르만이 쿨라프라바바티의 아들이라는 것은 추정이며, 두 사람의 이름이 나오는 비문은 모두 비슈누 신앙을 보여 준다. 루드라바르만은 514년부터 540년 또는 550년까지 재위했다(사료마다 끝이 갈린다). 이 무렵 부남 출신 승려 승가바라(僧伽婆羅)와 만다라선(曼陀羅仙)이 양에 와서 경전을 옮겼다고 하며, 이 나라는 불교와 힌두교가 함께 퍼진 곳이었다. 부남은 이 뒤 첸라의 독립과 확장으로 힘을 잃는다(「첸라의 성립: 바바바르만 1세와 마헨드라바르만(550~616)」(뒤의 사건))."
  subjects: [funan, southern-qi, liang, champa]
  tags: [diplomacy, religion]
  sources: ["『남제서』 만이전 부남국", "『양서』 부남전", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia (Toyo Bunko, 1998)"]

- id: ly-bi-van-xuan-544
  year: 544
  endYear: 602
  title:
    ko: "리남데의 만춘과 전 리 왕조(544~602)"
  summary:
    ko: "6세기 전반 양의 교주 자사 소자(蕭諮)의 가혹한 통치에 불만이 쌓인 가운데, 중국계 집안 출신 토착 호족 리남데(李賁, 베트남어 리비)가 541년 봉기해 양의 군대를 몰아냈다. 544년 음력 정월 그는 황제를 칭하고(하노이의 쩐꾸옥 탑을 세웠다는 전승도 있다) 나라 이름을 만춘(萬春)이라 했으며, 543년에는 쳐들어온 임읍을 물리쳤다고 『대월사기전서』는 전한다. 545년 양 무제는 군대를 보냈고 양 쪽 장수 가운데 진패선(陳霸先)이 있었다. 리남데는 546년 가닌 성이 무너진 뒤 산지로 물러나 항전하다가 547년(548년 설도 있음) 암살되었다. 형 리티엔바오(李天寶)가 군을 이끌다 555년 병사했다. 548년 리남데의 장수 찌에우꽝푹이 늪지 다제(夜澤)에서 군대를 일으켜 찌에우비엣브엉을 칭했고, 550년 무렵 교주의 중심지 롱비엔을 되찾았다. 557년 양이 무너지고 진패선이 진(陳)을 세우자 압박이 줄었다. 571년 리티엔바오의 일족 리펏뜨(李佛子)가 휴전을 깨고 찌에우꽝푹의 영역을 쳤고, 찌에우꽝푹은 후퇴하다 죽었으며 리펏뜨가 후 리 남데로 올랐다. 589년 수가 진을 무너뜨리고 중국을 합쳤고, 602년 수가 약 10만 명의 군대를 보내자 후 리 남데는 항복했다. 이 장수는 유방(劉方)이다. 이로써 이 나라는 약 60년 만에 끝났고 홍강 유역은 다시 수의 교주가 되었다. 이 60년 동안 양·진·수는 교주를 두었다고 이름을 내세웠지만, 홍강 유역의 늪지와 일부 고을은 리남데와 찌에우꽝푹, 후 리 남데가 이어서 쥐고 있었다. 중국·베트남 사서의 날짜는 모두 음력이다. 이 독립은 약 60년으로 짧았지만 베트남 사람들은 이를 독립 왕조의 첫 보기로 기린다."
  subjects: [early-ly-dynasty, liang, chen, sui]
  tags: [politics, war]
  sources: ["『대월사기전서』", "『양서』 무제기", "Keith W. Taylor, The Birth of Vietnam (University of California Press, 1983)", "Ben Kiernan, Việt Nam: A History from Earliest Times to the Present (Oxford University Press, 2017)"]

- id: chenla-rise-550
  year: 550
  endYear: 616
  title:
    ko: "첸라의 성립: 바바바르만 1세와 마헨드라바르만(550~616)"
  summary:
    ko: "첸라(진랍)는 처음에 부남에 딸린 나라였다. 『수서』 진랍전은 첸라가 본디 부남의 속국이었다고 적는다. 지금 캄보디아 북·중부에서 라오스 남부 참파삭에 걸친 땅에서 크메르 사람들이 일어났다고 보며, 참파삭의 왓푸를 성지로 모셨다. 목록에 따르면 슈루타바르만(550 무렵~555), 슈레슈타바르만(555 무렵~560), 비라바르만(560 무렵~575), 캄부자라자락슈미(575 무렵~580)를 거쳐 바바바르만 1세(580 무렵~600)가 오른다. 앞의 두 왕은 뒤 전승에 나오는 이름이라 실재와 재위가 분명하지 않다. 비문에 따르면 비라바르만은 마헨드라바르만(치트라세나)의 아버지이고, 마헨드라바르만은 바바바르만의 어머니가 같은 동생이었으나 아버지는 달랐다고 한다. 그러나 시텝 비문은 바바바르만의 아버지를 다르게 적는다. 바바바르만은 598년 신전을 지었고 바바푸라(지금 타라바리와트 근처로 본다)에 살았다. 마헨드라바르만(600 무렵~616)은 부남을 정복한 인물로 꼽히지만, 부남 정복을 바바바르만과 함께 했는지는 분명하지 않다. 『수서』는 616~617년 첸라의 사신이 수에 왔다고 적는다. 첸라가 하나의 왕국이었는지, 여러 왕가의 연합이었는지 의심하는 학설도 있다. 부남의 마지막 왕 루드라바르만이 죽은 때(540~550년께, 사료마다 갈림)와 이 나라가 일어서는 때가 겹쳐 부남은 서서히 힘을 잃었다(「부남 자야바르만의 남제·양 사행과 불교(484~514)」(앞의 사건)). 부남 병합과 이샤나푸라 천도는 마헨드라바르만의 뒤를 이은 이샤나바르만 1세 때의 일이다(「이샤나바르만 1세와 첸라의 부남 병합(616~637)」(뒤의 사건))."
  subjects: [chenla, funan]
  tags: [politics]
  sources: ["『수서』 진랍전", "George Cœdès, The Indianized States of Southeast Asia (University of Hawaii Press, 1968)", "Michael Vickery, Society, Economics, and Politics in Pre-Angkor Cambodia (Toyo Bunko, 1998)", "Charles Higham, The Civilization of Angkor (Weidenfeld & Nicolson, 2001)"]
