# 오세아니아 사건: 오스트레일리아·뉴기니 원주민, 오스트로네시아족의 항해, 라피타 문화, 폴리네시아·미크로네시아 사회의 형성, 유럽 항해자와 제1함대 출항 (기원전 2333년(천문 −2332) ~ 1787년)
# 범위: (기원전 2333년~1299년) 오스트레일리아 원주민·토레스 해협 제도 원주민, 뉴기니 고지대의 농경, 오스트로네시아족의 확산, 라피타 문화(비스마르크 제도~사모아), 마리아나 제도·서미크로네시아의 정착, 폴리네시아인의 형성, 동폴리네시아·통가·하와이·난 마돌·이스터섬·뉴질랜드 정착. (1300년~1787년) 1400년 무렵 하와이 섬들의 족장 사회부터 1787년 제1함대 출항까지(고대 하와이·타히티 족장 사회·통가의 왕권 나뉨, 마젤란·레가스피·산비토레스의 괌과 차모로인, 멘다냐·케이로스·토레스·얀스존·타스만·로헤벤·월리스·부갱빌·쿡의 항해, 이소켈레칼, 카메하메하 1세, 보타니만 식민 결정).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 해: 족장 사회와 전승의 해(우미 아 릴로아 1500년 무렵, 통가 왕권 나뉨 1470년 무렵·1610년 무렵, 이소켈레칼 1628년 무렵)는 '무렵'과 학설 갈림을 글에 밝혔다. 카메하메하 1세의 재위 시작은 문서마다 1782·1795·1810년으로 갈려 세 해를 모두 적었다.
# 날짜: (기원전 2333년~1299년) year는 천문 연도(기원전 N년 = 1−N, 기원전 2333년은 천문 −2332), 글에는 '기원전 N년', id 끝은 -Nbc. 고고 문화의 연대는 방사성 탄소 연대라 '무렵'을 붙이고, 문서마다 갈리는 해(라피타의 솔로몬·바누아투 도착 기원전 1300년 무렵 ↔ 기원전 1200년 뒤, 동폴리네시아·하와이·이스터섬·뉴질랜드 정착의 옛 '긴 연대' ↔ 새 '짧은 연대')는 한 구절로 밝혔다. 오스트레일리아 원주민·토레스 해협 제도 원주민·파푸아인·오스트로네시아족은 연도 막대의 하한(기원전 2333년)보다 앞서 존재했으므로 그 해에 이미 살던 모습으로 썼다. 항목이 고른 해와 글의 학설 해가 다르면 항목은 그대로 두고 글에 '무렵'과 다른 설을 적었다. (1300년~1787년) 1582년 앞 스페인·포르투갈 기록은 율리우스력으로 적었고, 네덜란드(홀란트)·영국(1752년 앞은 율리우스력)·프랑스 기록은 그레고리력 날짜를 문서에 적힌 대로 썼다. 날짜변경선 양쪽의 같은 날 서술은 이 파일에 없다.
# 이름 규칙: (기원전 2333년~1299년) 항목 이름(오스트레일리아 원주민·토레스 해협 제도 원주민·파푸아인·오스트로네시아족·라피타 문화·멜라네시아인·미크로네시아인·차모로인·솔로몬 제도 주민·니바누아투·폴리네시아인·타히티 족장 사회·통가 제국·고대 하와이·사우델레우르 왕조·라파누이인·마오리족)을 글자 그대로 썼다. 그 밖의 유적·인물 이름은 위키백과 한국어판 표제, 없으면 저장소 표기 사전과 외래어 표기법을 따랐다. (1300년~1787년) 항목 이름(고대 하와이·타히티 족장 사회·통가 제국·차모로인·솔로몬 제도 주민·니바누아투·파푸아인·토레스 해협 제도 원주민·오스트레일리아 원주민·마오리족·라파누이인·사우델레우르 왕조·하와이 왕국)을 글자 그대로 썼다. '발견' 대신 '도착'·'닿다'로 쓰고, 원주민 쪽 피해는 기록의 성격(유럽 항해 기록·선교사 기록)을 밝혔다.
# 지도 결정과의 관계: (기원전 2333년~1299년) 이 시기 항목은 모두 땅을 그리지 않는 항목이라 subjects에만 두고 links는 쓰지 않았다. 항목 기간과 사건 기간이 다른 경우는 글에 문서마다 다른 해를 한 구절로 적었다. (1300년~1787년) 땅이 없는 항목은 links 없이 subjects만 썼다. 하와이 왕국은 1795년 오아후섬 장악부터이고 카우아이·니하우섬은 1810년이라는 점을 글에 밝혔다.
# 한국사와 닿는 점: 없음(한국사 사건과 억지로 잇지 않음).
# 가리킨 기존 사건: (기원전 2333년~1299년) 오스트로네시아어 사용자의 섬 동남아 확산(sea-01, 뒤의 사건 — 필리핀 확산은 그 글이 정본), 같은 파일 안 사건, 같은 파일 뒷부분의 사건(이소켈레칼·카메하메하). (1300년~1787년) 「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」, 「콜럼버스와 다가마, 신항로 개척」, 「레가스피의 세부 정착과 마닐라 건설(1565~1572)」, 다른 파일의 고정 사건(「하와이 제도의 정착과 고대 하와이(1000~1300)」·「동폴리네시아에 닿은 항해와 타히티 족장 사회의 시작(300~1000)」·「아호에이투와 통가 제국의 시작(950~1300)」·「난 마돌과 사우델레우르 왕조(1100~1300)」·「라파누이인의 이스터섬 정착과 모아이(1200~1600)」·「마오리족의 아오테아로아 정착과 모아 사냥(1250~1500)」·「마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)」·「제1함대와 뉴사우스웨일스 식민지(1788~1792)」·「포마레 왕조의 타히티 왕국(1791~1815)」·「카메하메하 1세의 하와이 통일과 카우무알리이(1810~1819)」·「조지 투포우 1세의 통가 통일과 1875년 헌법(1845~1875)」).

- id: aboriginal-2333bc
  year: -2332
  endYear: -1499
  title:
    ko: "오스트레일리아 원주민과 토레스 해협 제도 원주민, 딩고의 도착(기원전 2333~기원전 1500)"
  summary:
    ko: "기원전 2333년 무렵 오스트레일리아 대륙에는 이미 수만 년 동안 이어 온 사람들의 사회가 곳곳에 퍼져 있었다. 오스트레일리아 원주민의 조상은 바닷물이 낮아 오스트레일리아와 뉴기니가 하나로 이어져 있던 옛 대륙 사훌에 5만~6.5만 년 전에 닿았다고 본다. 유전체 연구 가운데에는 4만 3천 년 전쯤으로 늦추는 것도 있어 도착 연대는 학설이 갈린다. 유럽 사람이 들어오는 1788년 무렵까지 250개가 넘는 언어가 쓰였고, 400개가 넘는 집단이 확인된다. 그때의 인구는 적어도 31만 4,500명으로 추산된다. 이들은 '꿈의 시대(드리밍)'라 부르는 조상의 창조 이야기를 노래·춤·그림으로 이어 전했고, 그 이야기가 땅의 길과 모습을 기억하게 하는 송라인(노래의 길)이었다. 집단 사이에는 물건이 먼 거리를 오가는 교역이 있었다. 이 무렵 대륙에 들어온 새 동물이 딩고다. 가장 오래된 뼈는 널라버 평원의 마두라 동굴에서 나왔는데, 뼈가 묻힌 퇴적층으로 잰 값은 약 3,450년 전(기원전 1500년 무렵)이고 2018년에 뼈를 직접 잰 값은 3,348~3,081년 전이며, 딩고의 유전자 분석은 약 8,300년 전 도착을 내놓는 등 3,500~12,000년 전 사이로 어림한다. 태즈메이니아에서는 딩고 뼈가 나오지 않는데, 섬이 약 1만 2천 년 전 대륙에서 떨어진 뒤에 딩고가 들어왔다는 뜻으로 읽는다. 북쪽 케이프요크반도와 뉴기니섬 사이 토레스 해협의 섬들에는 토레스 해협 제도 원주민이 살았다. 이들은 오스트레일리아 원주민과 문화가 구별되는 별개의 사람들이며, 뉴기니와 케이프요크 양쪽과 오래 교류했다. 섬에 사람이 처음 자리 잡은 때는 분명하지 않다. 1788년 이후의 일은 「제1함대와 뉴사우스웨일스 식민지(1788~1792)」(뒤의 사건)에서 이어진다."
  subjects: [aboriginal-australians, torres-strait-islanders]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Aboriginal Australians", "위키백과 Dingo", "위키백과 Torres Strait Islanders"]

- id: new-guinea-highlands-2333bc
  year: -2332
  endYear: -999
  title:
    ko: "뉴기니 고지대의 농경과 쿠크 습지(기원전 2333~기원전 1000)"
  summary:
    ko: "뉴기니섬 중앙 고지대에서는 기원전 2333년 무렵 파푸아인이 이미 몇천 년 동안 땅을 일구어 온 사회를 이루고 있었다. 파푸아인은 바닷물이 낮던 때 오스트레일리아와 이어져 있던 땅을 거쳐 뉴기니에 들어온 사람들의 후손으로, 뒤에 바닷가로 들어온 오스트로네시아어 사용자와 달리 오스트로네시아어가 아닌 수백 개의 언어를 쓴다. 그 농경의 자취가 가장 잘 남은 곳이 와기 계곡의 쿠크 습지다. 마운트하겐 북동쪽 12~13km, 해발 약 1,550m에 있는 이 유적은 핵심 구역이 116헥타르이며 2008년 유네스코 세계유산에 올랐다. 발굴에서는 습지의 물을 빼려고 판 도랑 체계가 나왔다. 가장 이른 배수 시설은 약 9,000년 전으로 올라가고, 바나나와 사탕수수를 기른 증거는 약 6,900~6,400년 전으로 추정된다. 이 체계는 물을 내보내는 큰 물길과 밭을 둘러싼 큰 도랑·작은 도랑으로 이루어졌고, 바닥의 점토층은 사람이 일부러 판 것임을 보여 준다. 땅 파는 나무 막대와 간 돌(갈돌)도 함께 나왔다. 이런 손질 덕에 이곳 풀밭은 사람 손으로 농사에 알맞게 바뀐 '인위적 초지'가 되었다고 평가받고, 세계유산 문화유산 기준 (3)과 (4)에 해당한다고 인정되었다. 재배한 것은 토란과 바나나, 사탕수수였으며, 이곳은 토란을 기를 수 있는 고지대의 한계에 가까운 곳이었다고 한다. 이처럼 고지대 계곡의 농경은 바닷가에 오스트로네시아족이 닿기 훨씬 앞에서 시작되어, 계곡마다 작은 집단으로 나뉜 사회를 먹여 살렸다. 내륙 고지대는 1930년대에야 바깥 사람들과 처음 만났다. 바닷가와 섬에서 파푸아인이 오스트로네시아족과 만나는 이야기는 「라피타 문화의 비스마르크 제도 출현(기원전 1600~기원전 1300)」(뒤의 사건)에서 이어진다."
  subjects: [papuans]
  tags: [society, economy]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Kuk Early Agricultural Site", "위키백과 영어판 Indigenous people of New Guinea"]

- id: austronesian-2333bc
  year: -2332
  endYear: -1599
  title:
    ko: "대만을 떠난 오스트로네시아족의 항해(기원전 2333~기원전 1600)"
  summary:
    ko: "기원전 2333년 무렵 타이완에서는 오스트로네시아어를 쓰는 사람들이 이미 오래전부터 바다로 나가고 있었다. 이 바다 확산은 몇백 년 동안 이어진 큰 흐름의 한복판에 있었다. 타이완의 신석기 사회(다펀컹 문화)는 방사성 탄소 연대로 기원전 4000년 무렵까지 올려 보는 설도 있어 출발 해는 연구자마다 다르다. 이 '타이완 기원설'은 언어의 계통과 농경의 증거를 함께 근거로 들며, 벨우드의 1991년 논문이 대표적이다. 이에 맞서는 설로는 사람이 크게 옮기지 않고 말만 퍼졌다는 주장과 남중국 기원 자체를 부정하는 입장이 있다. 타이완에는 그보다 앞서 기원전 10000~6000년 무렵 대륙에서 사람이 들어왔다고 본다. 확산을 이끈 것은 배의 기술이다. 쌍동선과 판자를 끈으로 엮은 배가 이 사람들의 상징이었다. 이 모형의 언어학 근거는 타이완 원주민의 말이 오스트로네시아어족에서 가장 먼저 갈라진 가지라는 점이며, 타이완 원주민에는 아미족·아타얄족·부눈족·파이완족 같은 집단이 있다. 배에는 쌀·바나나·코코넛·빵나무·참마·토란·닥나무 같은 작물과 닭·돼지·개가 실렸다. 사람들은 먼저 필리핀 북쪽으로 내려갔고, 필리핀과 섬 동남아로 퍼지는 일은 「오스트로네시아어 사용자의 섬 동남아 확산(기원전 2000~1000)」(뒤의 사건)이 다룬다. 이 바다 사람들은 거기서 더 동쪽 태평양으로도 나아갔다. 기원전 1600년 무렵에는 뉴기니 북동쪽 비스마르크 제도에 라피타 문화가 나타나고, 기원전 1500년 무렵에는 필리핀 쪽에서 마리아나 제도에 사람이 닿는다. 이들의 후손에는 폴리네시아인과 미크로네시아인, 라피타 문화의 사람들이 들며, 훗날 서쪽으로는 마다가스카르, 동쪽으로는 이스터섬, 남쪽으로는 뉴질랜드까지 닿았다."
  subjects: [austronesian-culture]
  tags: [society, culture]
  sources: ["Peter Bellwood, First Islanders: Prehistory and Human Migration in Island Southeast Asia (Wiley Blackwell, 2017)", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Austronesian peoples"]

- id: lapita-1600bc
  year: -1599
  endYear: -1299
  title:
    ko: "라피타 문화의 비스마르크 제도 출현(기원전 1600~기원전 1300)"
  summary:
    ko: "기원전 1600년 무렵 뉴기니 북동쪽 비스마르크 제도(뉴브리튼섬·뉴아일랜드섬·무사우섬)에 이빨 모양 도구로 눌러 찍은 무늬를 넣은 토기가 나타났다. 이것이 라피타 문화다. 조개나 모래를 섞어 낮은 불에 구운 이 토기는 비스마르크 제도에서 기원전 1600~1200년 무렵에 '고전' 꼴이 만들어졌고, 그 앞 단계가 이 섬들에서 확인되지 않아 이미 다 갖추어진 모습으로 나타난 것으로 본다. 무사우섬의 탈레파케말라이 유적이 가장 이른 집단의 보기로 꼽힌다. 이 사람들은 어디서 왔을까. 필리핀 북부에서 곧바로 왔다거나 마리아나 제도를 거쳐 왔다는 설이 있고, 2016년 바누아투와 통가에서 나온 라피타 사람 네 구의 유전자 연구는 이들이 타이완·필리핀 북부 사람들과 이어진다고 보았다. 이들은 「오스트로네시아어 사용자의 섬 동남아 확산(기원전 2000~1000)」(앞의 사건)이 다룬 확산이 바다 동쪽으로 뻗은 갈래이며, 흑요석 같은 돌을 먼 거리까지 주고받았다. 그러나 비스마르크 제도에는 이미 파푸아인이 오래전부터 살고 있었다. 멜라네시아인은 이 파푸아인과 새로 들어온 오스트로네시아족이 섞이면서 이루어졌다고 보는 것이 일반적인 학설이다. 그렇다고 라피타 문화가 곧 멜라네시아인의 전부는 아니다. 고지대의 파푸아인 농경 사회는 「뉴기니 고지대의 농경과 쿠크 습지(기원전 2333~기원전 1000)」(앞의 사건)에서 보듯 따로 이어졌고, 섬마다 마을 단위의 작은 사회가 자리 잡았다. 라피타 사람들은 이곳에서 배를 다시 띄워 더 먼 섬으로 나아가게 된다. 라피타 문화가 닿은 곳과 그 끝은 「피지·통가·사모아에 닿은 라피타와 그 끝(기원전 1000~기원전 500)」(뒤의 사건)이 이어서 다룬다."
  subjects: [lapita-culture, melanesian-societies, papuans]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Lapita culture", "위키백과 Melanesians"]

- id: marianas-1500bc
  year: -1499
  endYear: -999
  title:
    ko: "마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)"
  summary:
    ko: "기원전 1500년 무렵 동남아시아 섬 쪽에서 배를 타고 온 사람들이 마리아나 제도에 처음 자리 잡았다. 마리아나 제도는 오스트로네시아족이 닿은 오세아니아의 첫 섬들로 꼽히며, 사람들은 필리핀 쪽에서 동쪽으로 먼 바다를 건넜다. 이들이 어디서 왔는지는 학설이 갈린다. 필리핀 기원설이 일반적이지만, 마리아나 옛 유골의 유전자 분석은 인도네시아 동부, 아마도 술라웨시 섬을 가리키며 필리핀과의 직접 관계는 보이지 않는다고 보았다. 2020년의 한 연구는 마리아나 유골과 바누아투·통가의 라피타 사람들이 같은 오스트로네시아 계통 집단에서 갈라져 나왔다고 보았다. 곧 이 첫 마리아나 사람들은 「라피타 문화의 비스마르크 제도 출현(기원전 1600~기원전 1300)」(앞의 사건)과 거의 같은 때, 서로 다른 길로 태평양에 들어선 사촌 격이다. 이들은 미크로네시아인의 서쪽 갈래이며 차모로인의 조상이다. 차모로인이라는 이름은 지금 괌과 북마리아나 제도에 사는 사람들을 가리키고, 정착 연대는 위키백과 문서들이 대개 기원전 1500년 무렵으로 적어(미크로네시아 역사 문서에는 기원전 2000년 무렵이라는 줄도 있다) 널리 받아들여진다. 쌀이 이른 정착 때부터였는지는 문서마다 달라, 위키백과 차모로인 문서는 선사 시대부터 길렀다고, 미크로네시아 역사 문서는 800년 무렵 다시 들어왔다고 적는다. 섬들은 필리핀과 먼 바다로 떨어져 있어 이 정착은 우연히 떠밀린 표류가 아니라 계획한 원양 항해의 결과로 읽히며, 이른 시기 마을은 바닷가를 따라 늘어섰다고 본다. 이 사회가 천 년 넘게 이어지며 이룬 모습은 뒤에 「마리아나의 라테 석주 시대(900~1521)」(뒤의 사건)로 바뀐다. 팔라우와 얍, 캐롤라인 제도 쪽 정착은 「팔라우·얍과 캐롤라인 제도의 정착(기원전 300~기원후 500)」(뒤의 사건)에서 다룬다."
  subjects: [micronesian-culture, chamorro]
  tags: [society, culture]
  sources: ["위키백과 History of Micronesia", "위키백과 Chamorro people", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)"]

- id: lapita-southwest-1300bc
  year: -1299
  endYear: -999
  title:
    ko: "라피타의 솔로몬·바누아투·누벨칼레도니 확산(기원전 1300~기원전 1000)"
  summary:
    ko: "비스마르크 제도에서 시작한 라피타 문화는 기원전 1300년 무렵부터 기원전 1000년 무렵 사이에 동남쪽 섬들로 퍼졌다. 위키백과 문서는 솔로몬 제도·바누아투·누벨칼레도니에 라피타 양식 유물이 나타나는 때를 기원전 1200년 뒤로 적어, 이른 설인 기원전 1300년 무렵과 문서마다 몇백 년씩 다르다. 사람들은 먼저 솔로몬 제도에 이르렀다. 이 섬들에는 수만 년 전부터 사람이 살았으므로, 솔로몬 제도 주민의 바탕은 이미 살던 사람들과 라피타 사람들이 만나 이루어졌다고 본다. 더 동쪽의 바누아투에서는 에파테섬의 테우마 유적이 가장 이름나 있다. 이곳 라피타 묘지는 조개의 방사성 탄소 연대로 기원전 1000년 무렵의 것이며, 무덤 25기에서 유골 36구가 나왔다. 유골은 모두 머리뼈가 없었고 머리가 있어야 할 자리에 원뿔조개 고리를 놓은 모습이었다. 지금 니바누아투, 곧 바누아투 사람들의 시작도 이 무렵의 라피타 정착에 닿아 있다고 본다. 누벨칼레도니에서는 본섬 서쪽 해안의 유적이 1952년 미국 고고학자 에드워드 기퍼드와 리처드 슈틀러 2세의 발굴로 알려졌다. 이 이름 '라피타'는 그 지역 말을 잘못 들어 적은 데서 나왔다고 한다. 그곳 정착은 뒤에 기원전 800년 무렵으로 측정되었다. 솔로몬 제도 서쪽 섬들은 비스마르크 제도에서 가까워 눈에 보이는 섬을 따라 건널 수 있었지만, 바누아투와 누벨칼레도니는 그보다 훨씬 먼 바다 건너에 있었다고 본다. 이렇게 라피타는 섬에서 섬으로 옮겨 가며, 그때까지 사람이 살지 않던 섬들에도 마을을 세웠다. 그 뒤의 이야기는 「피지·통가·사모아에 닿은 라피타와 그 끝(기원전 1000~기원전 500)」(뒤의 사건)에서 다룬다."
  subjects: [solomon-islanders, ni-vanuatu, lapita-culture]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Lapita culture", "위키백과 Solomon Islanders", "위키백과 Ni-Vanuatu"]

- id: lapita-fiji-tonga-1000bc
  year: -999
  endYear: -499
  title:
    ko: "피지·통가·사모아에 닿은 라피타와 그 끝(기원전 1000~기원전 500)"
  summary:
    ko: "기원전 1000년 무렵 라피타 문화는 서쪽 폴리네시아의 문턱인 피지·통가·사모아에 닿았다. 위키백과 폴리네시아 문서는 이 섬들에 라피타 정착이 이루어진 때를 기원전 1300년 무렵부터 기원전 900년 무렵 사이로 폭넓게 적는다. 라피타 양식 유물은 200곳이 넘는 유적에서 4,000km에 걸쳐 나오는데, 사모아가 동쪽 끝이다. 사모아 우폴루섬의 물리파누아 유적은 기원전 1000년 무렵으로, 폴리네시아에서 지금까지 찾은 가장 오래된 유적으로 꼽힌다. 통가에서는 사람의 흔적이 기원전 900년 무렵부터 이어진다는 2010년의 연구가 있고, 피지에서는 기원전 800년 무렵 또는 그보다 앞서 살았던 라피타 여성의 유골('마나 유골')이 알려져 있다. 라피타 토기가 끝난 때는 곳마다 다르다. 위키백과 문서는 사모아에서 약 2,800년 전, 곧 기원전 800년 무렵에 이 토기가 만들어지지 않게 되고 통가에서는 약 2,000년 전까지 만들어졌다고 적는다. 무늬 토기가 사라지는 때를 기원전 500년 무렵으로 보는 설명도 있어, 문서마다 해가 몇백 년씩 다르다. 토기의 끝이 사람의 끝은 아니었다. 토기에 무늬를 넣지 않게 된 뒤에도 섬에 남은 사람들은 무늬 없는 토기를 빚으며 살았고, 이들이 폴리네시아인의 조상이다. 이 변화는 한 번에 일어난 것이 아니라 몇 세기에 걸쳐 섬마다 달리 나타났다. 이 사람들이 만든 문화는 「사모아·통가에서 폴리네시아 문화의 형성(기원전 800~기원전 1)」(뒤의 사건)로 이어지며, 서쪽 섬에서 퍼진 라피타 문화는 이렇게 막을 내린다. 이 끝에서 보면 라피타는 사라진 문화라기보다 다른 문화로 바뀐 것이다."
  subjects: [lapita-culture]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Lapita culture", "위키백과 Polynesia"]

- id: polynesia-800bc
  year: -799
  endYear: 0
  title:
    ko: "사모아·통가에서 폴리네시아 문화의 형성(기원전 800~기원전 1)"
  summary:
    ko: "기원전 800년 무렵부터 통가와 사모아에서 폴리네시아인의 고유한 문화가 형성되기 시작했다. 폴리네시아인은 하와이·이스터섬·뉴질랜드를 꼭짓점으로 한 삼각형의 바다에 퍼져 산 사람들로, 사모아인·통가인·타히티인·하와이인·마오리족이 여기에 든다. 라피타 문화는 더 동쪽으로 나아가지 못하고 서쪽 폴리네시아에서 멈추었다. 그 멈춤이 얼마나 오래였는지는 문서마다 다르다. 위키백과 폴리네시아 문서는 대략 1,000년으로, 폴리네시아인 문서는 약 1,500년으로 적으며 그 까닭은 분명하지 않다. 그동안 통가와 사모아에 남은 사람들은 폴리네시아어의 조상이 되는 말과 족장 중심 사회, 신성한 힘(마나)과 금기(타푸), 카바 의례 같은 폴리네시아의 바탕을 이 섬들에서 키웠다고 본다. 이 사회를 '조상 폴리네시아 사회'라 부른다. 문화의 형성은 라피타가 닿은 뒤 두세 세기 안에 시작된 것으로 읽는다(「피지·통가·사모아에 닿은 라피타와 그 끝(기원전 1000~기원전 500)」(앞의 사건)). 사람들은 별과 파도, 구름과 새의 움직임을 읽어 바다를 건넜고, 쌍동선 같은 큰 배에 작물과 가축을 실어 새 섬으로 옮겨 갔다. 무늬 토기는 사라졌지만 배와 항해의 지식은 이어졌고, 그 위에 족장이 마을 여럿을 이끄는 사회가 서서히 커졌다고 본다. 이 긴 머무름이 끝나면서 동쪽으로의 항해가 다시 시작된다. 중앙 폴리네시아의 쿡 제도·소시에테 제도·마르키즈 제도가 처음 정착된 때를 기원후 1000~1150년 무렵으로 보는 새 연대와 더 이른 옛 연대가 갈리는데, 그 이야기는 「동폴리네시아에 닿은 항해와 타히티 족장 사회의 시작(300~1000)」(뒤의 사건)에서 다룬다. 이 시기 팔백 년 동안 통가와 사모아는 폴리네시아 문화의 요람이었다."
  subjects: [polynesian-culture]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Polynesians", "위키백과 Polynesia"]

- id: western-micronesia-300bc
  year: -299
  endYear: 500
  title:
    ko: "팔라우·얍과 캐롤라인 제도의 정착(기원전 300~기원후 500)"
  summary:
    ko: "마리아나 제도보다 남서쪽의 팔라우와 얍, 그 동쪽 캐롤라인 제도의 섬들은 미크로네시아인의 또 다른 갈래가 자리 잡은 곳이다. 위키백과 미크로네시아 역사 문서는 팔라우와 얍에 또 다른 오스트로네시아 이주민이 기원전 1000년 무렵까지 닿았고 아마 술라웨시 쪽에서 왔겠지만 그 자세한 경과는 잘 알려지지 않았다고 적는다. 같은 문서는 팔라우와 얍을 마리아나 제도와 따로 일어난 이주로 구분한다. 그러므로 기원전 300년 무렵은 정착의 첫 해가 아니라, 바다 사회가 섬마다 뿌리내려 산호섬과 화산섬의 생활 방식을 갖추어 가던 시기를 잡은 것이다. 위키백과 미크로네시아 역사 문서는 멜라네시아에서 올라온 라피타 이주민이 기원전 200년 무렵 동부 미크로네시아에 닿았다고 적고, 난 마돌 문서는 폰페이섬의 가장 이른 정착을 기원후 1년 무렵으로 본다. 캐롤라인 제도 쪽의 조상은 약 2,000년 전, 곧 기원후 무렵에 닿았다는 견해가 있다. 이 연대는 방사성 탄소 값이 적고 해석이 갈려 섬마다 몇백 년씩 달라질 수 있다. 사람들은 작은 산호섬에서 타로·빵나무·코코넛을 가꾸고 고기를 잡으며 살았고, 별과 바람, 물결을 읽는 항해술로 섬 사이를 오갔다. 이 항해 전통은 뒤에 폴리네시아인과는 다른 길로 발달한 미크로네시아인의 특징이 되었다. 얍의 큰 돌 화폐 라이는 대부분 옛적 팔라우에서 캐 온 것이라 하는데, 그 시작 해는 위키백과도 밝히지 못하고 있어 이 시기의 일로 단정하지 않는다. 마리아나 제도 쪽의 같은 미크로네시아인 갈래는 「마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)」(앞의 사건)에서 다루었다. 이 서쪽·동쪽 섬들의 사회는 이어 「난 마돌과 사우델레우르 왕조(1100~1300)」(뒤의 사건)에서 보듯 폰페이섬에서 돌로 쌓은 큰 중심지를 낳기에 이른다."
  subjects: [micronesian-culture]
  tags: [society, culture]
  sources: ["위키백과 History of Micronesia", "위키백과 Yap", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)"]

- id: east-polynesia-300
  year: 300
  endYear: 1000
  title:
    ko: "동폴리네시아에 닿은 항해와 타히티 족장 사회의 시작(300~1000)"
  summary:
    ko: "서쪽 폴리네시아에 머물던 항해자들이 동쪽 바다로 다시 나아가 소시에테 제도와 마르키즈 제도 같은 동폴리네시아에 닿은 때는 학설이 크게 갈린다. 예전의 '긴 연대'는 동폴리네시아 정착을 기원후 300년 무렵까지 올려 보았다. 그러나 방사성 탄소 연대 1,434개를 믿을 만한 시료 중심으로 다시 견준 2011년 연구(미국 국립과학원 회보 PNAS)는 '짧은 연대'로 소시에테 제도를 1025~1120년 무렵, 나머지 섬들을 1190~1290년 무렵으로 본다. 위키백과 폴리네시아 문서도 중앙 폴리네시아의 쿡 제도·소시에테 제도·마르키즈 제도가 처음 자리 잡은 때를 1000~1150년으로 적고, 폴리네시아인 문서는 동쪽 이주가 700년 무렵 다시 시작되었다고 쓰는 등 문서마다 다르다. 2021년의 유전체 모형은 소시에테 제도에 11세기에 닿았고, 12세기에 오스트랄 제도와 투아모투 제도 쪽으로 퍼졌다고 본다. 위키백과 폴리네시아 문서는 쿡 제도의 '타히티 시기'를 900~1300년으로 적기도 한다. 연구자들은 대체로 새 연구의 짧은 연대 쪽을 따른다. 타히티섬과 둘레 섬에서는 아리이라 부르는 족장들이 고장마다 따로 다스렸고, 마라에라는 돌 제단에서 제사를 지냈다고 알려져 있다. 족장 사회는 이 오랜 정착의 끝에 자라난 것이어서 정착 연대가 어느 설이든 그 시작은 정착과 이어져 있다. 이 사람들은 좁은 섬에서 먹을거리를 키워 인구를 늘리며 더 먼 바다로 다시 사람을 내보내는 힘이 되었고, 그 갈래가 하와이·이스터섬·뉴질랜드에 닿는 이야기는 이어 「하와이 제도의 정착과 고대 하와이(1000~1300)」(뒤의 사건)로 이어진다."
  subjects: [tahitian-chiefdoms, polynesian-culture]
  tags: [society, culture]
  sources: ["Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "위키백과 Polynesia", "위키백과 Polynesians", "위키백과 Ancient Hawaii", "Janet M. Wilmshurst 외, High-precision radiocarbon dating shows recent and rapid initial human colonization of East Polynesia, PNAS 108(5), 2011"]

- id: latte-900
  year: 900
  endYear: 1521
  title:
    ko: "마리아나의 라테 석주 시대(900~1521)"
  summary:
    ko: "마리아나 제도에서는 900년 무렵부터 차모로인이 라테라는 돌기둥 위에 집을 짓기 시작했다. 위키백과 라테 석주 문서는 사용의 시작을 900년 무렵으로, 미크로네시아 역사 문서는 800년 무렵 동남아시아에서 온 두 번째 이주민이 큰 건축물을 지었다고 적어 시작 해는 문서마다 다르다. 라테는 하리기라 부르는 기둥 위에 타사라는 반구형 머릿돌을 평평한 면이 위로 오게 얹은 것이다. 기둥은 높이 60cm에서 3m가 보통이고, 티니안섬 타가의 집에 남은 것은 5m가량으로 가장 높다. 로타섬에서 캐 둔 기둥은 세웠다면 8m에 이르렀을 것이다. 로타섬 채석장에 남은 가장 큰 기둥은 34톤, 가장 큰 머릿돌은 22톤이다. 라테는 괌과 로타·티니안·사이판 같은 남쪽 마리아나의 섬들에 있고, 흐트러지지 않은 것은 대개 나란한 두 줄에 8~14개가 서 있다. 1500~1600년대 스페인 기록은 그 위의 건물을 카누 보관처이자 공동체의 모임 장소로 적는다. 누가 살았는지는 학자마다 다르다. 높은 신분만 살았다는 견해가 있고 돌의 수와 높이가 신분을 보여 주었다는 견해도 있다. 차모로인 사회는 신분이 나뉘어 아래층은 마나창, 위층은 차모리라 불렀고, 차모리는 다시 아초티와 지배 계층인 마투아로 갈렸다고 한다. 둥근 머릿돌은 쥐가 기어오르지 못하게 한 것이라는 설명이 있고, 필리핀 이푸가오족의 나무 기둥 곡식 창고와 닮았다는 지적도 있다. 라테 시대는 1521년 마젤란 일행이 닿은 뒤 1565년 스페인의 영유 선언과 1668년 선교 시작을 거치며 쇠퇴하여 1700년 무렵에는 돌이 거의 쓰이지 않았다. 앞선 정착의 모습은 「마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)」(앞의 사건)에 있다."
  subjects: [chamorro]
  tags: [society, culture]
  sources: ["위키백과 Latte stone", "위키백과 Chamorro people", "위키백과 History of Micronesia"]

- id: tui-tonga-950
  year: 950
  endYear: 1300
  title:
    ko: "아호에이투와 통가 제국의 시작(950~1300)"
  summary:
    ko: "통가에서는 950년 무렵 첫 투이 통가 아호에이투가 나왔다고 전한다. 위키백과 통가 제국 문서는 그의 시기를 950년 무렵, 투이 통가 문서는 900년 무렵으로 적어 문서마다 다르며, 둘 다 구전의 왕 목록에서 나온 값이라 '무렵'으로만 읽으며, 목록의 첫 왕 아호에이투 앞뒤로는 해가 거의 붙어 있지 않다. 통가와 사모아의 구전은 아호에이투가 신 탕가로아의 아들이라고 말한다. 투이 통가는 나라의 영적 지도자로 받들어져 왕권은 신성했고, 첫 수확물을 바치는 제사 이나시도 신으로 받들어진 투이 통가에게 올렸다. 가장 이름난 유적은 하아몽가 아 마우이로, 투이 투이투이(투이타투이)가 13세기에 니투아 지역에 세웠다고 전한다. 같은 위키백과의 투이 통가 목록은 그를 열한 번째 왕으로 놓고 1100년 무렵의 사람으로 적어 두 문서가 다르다. 이 목록에서 열 번째 왕 모모 때에 통가의 해양 세력이 생겨났다고 한다. 이 세력을 '통가 제국'이라 부르는 것은 학자들의 말이며, 힘이 가장 셌던 때는 1200~1500년 무렵이다. 둘레 섬에서 공물을 받으며 영향을 넓혔고, 사모아의 마누아 제도는 초기 통가 왕들은 신성하게 여겼다. 이 세력은 투이 피티와 투이 마누아가 다스리던 땅 대부분을 거둬들였지만 마누아 제도만은 투이 마누아의 다스림에 남았다고 한다. 사모아가 통가 사람을 몰아낸 때는 13세기나 14세기로 갈린다. 이 사건이 끝나는 1300년 무렵까지 투이 통가는 신성한 왕으로서 통가타푸섬을 중심으로 섬들을 이끌었고, 그 뒤의 일은 투이 통가의 실권이 다른 칭호로 넘어가는 과정으로 이어진다. 통가의 구전 왕 목록은 가톨릭 선교사들이 모은 것이고, 다른 목록은 순서가 전승과 맞지 않아 덜 믿을 만하다고 한다."
  subjects: [tui-tonga]
  tags: [politics, culture]
  sources: ["위키백과 Tuʻi Tonga Empire", "위키백과 Tuʻi Tonga", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)"]

- id: hawaii-settlement-1000
  year: 1000
  endYear: 1300
  title:
    ko: "하와이 제도의 정착과 고대 하와이(1000~1300)"
  summary:
    ko: "하와이 제도에 폴리네시아인이 처음 닿은 때는 학설이 크게 갈린다. 전통적 추정은 400~1100년 무렵 사이에 사모아·마르키즈·타히티에서 항해자가 드문드문 닿았다고 보고, 예전 방사성 탄소 값 가운데에는 124년까지 올라가는 것도 있다. 그러나 더 믿을 만한 시료로 다시 잰 2011년 연구는 1219~1266년 무렵에 닿았다고 하며, 이는 「동폴리네시아에 닿은 항해와 타히티 족장 사회의 시작(300~1000)」(앞의 사건)에서 본 두 물결 가운데 뒤의 물결에 든다. 폴리네시아인 문서는 900년에 하와이에 닿았다고 적는다. 이 사건은 옛 추정의 한복판인 1000년 무렵을 시작으로 삼았으니 연대는 모두 '무렵'으로 읽어야 한다. 정착한 사람들은 타로(칼로)를 심었고, 지난 천 년 사이 물길을 대는 논 같은 큰 밭을 만들었다. 강어귀와 개울을 막아 만든 양어못은 500년이나 그보다 앞서 생겼다고 하며, 카우아이섬의 메네후네 양어못은 1,000년 넘은 것이다. 1778년 쿡이 닿을 무렵 양어못은 360개가 넘어 한 해 900톤(200만 파운드) 가까운 물고기를 냈다. 위키백과 고대 하와이 문서는 타히티 사람의 정착을 13세기로 보기도 한다. 땅은 산에서 바다까지 길게 나눈 아후푸아아로 나뉘어 물과 농사를 다스렸다. 족장 계층 알리이가 섬이나 섬의 일부를 다스리고, 카푸라는 금기가 질서를 지켰다. 카푸는 1000~1300년 무렵 두 번째 이주와 함께 들어왔다는 가설이 있고, 타히티 영향이 그 바탕이라고 본다. 족장 사회가 커지고 섬 사이 싸움이 거세지는 뒤의 이야기는 「카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)」(뒤의 사건)에서 이어진다."
  subjects: [hawaiian-chiefdoms, polynesian-culture]
  tags: [society, culture]
  sources: ["위키백과 Ancient Hawaii", "위키백과 Polynesians", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "Janet M. Wilmshurst 외, High-precision radiocarbon dating shows recent and rapid initial human colonization of East Polynesia, PNAS 108(5), 2011"]

- id: nan-madol-1100
  year: 1100
  endYear: 1300
  title:
    ko: "난 마돌과 사우델레우르 왕조(1100~1300)"
  summary:
    ko: "미크로네시아 폰페이섬의 동쪽 바닷가 산호초 위에는 난 마돌이라는 돌로 쌓은 인공 섬 무리가 있다. 돌과 산호로 쌓은 인공 섬은 92개이고 물길이 그 사이를 지나며, 중심부는 길이 약 1.5km, 너비 0.5km이며 유적 구역 전체는 18제곱킬로미터가 넘는다. 섬들은 조수가 드나드는 물길로 둘러싸여 있다. 사우델레우르 왕조가 섬을 하나로 다스리며 이곳을 도읍으로 삼았다고 전한다. 이 왕조의 시작은 1100년 무렵으로 잡지만 큰 돌 건축은 1180~1200년 무렵부터이고 방사성 탄소 연대는 약 1180년이다. 건물은 8~9세기부터 쌓았다는 보기도 있어 해가 문서마다 다르다. 건축가들은 섬 반대편 화산암 마개 모양의 바위에서 현무암 기둥을 캐 나르고 쌓았다. 난다우와스 왕릉 구역의 담은 5.5~7.5m 높이다. 왕조가 하나로 묶은 사람은 폰페이섬 전체에 2만 5천 명쯤으로 추산되나 중심부에 산 사람은 1,000명 이하였을 것이다. 전승은 쌍둥이 마법사 올리시파와 올로소파가 템웬 섬 바깥에 제단을 쌓았다고 하며, 용이 돌을 들어 날랐다고 말한다. 쌍둥이 가운데 하나가 죽은 뒤 남은 이가 첫 사우델레우르가 되었다고 한다. 이 전승은 구전이어서 해를 말할 수 없고, 왕조 시대가 약 500년 이어졌다는 설명이 있으며 전승은 그 무너진 때를 1500년대로 돌리기도 한다. 유적은 2016년 '난 마돌: 미크로네시아 동부의 의례 중심지'라는 이름으로 세계유산에 올랐다. 이 왕조의 끝은 「이소켈레칼과 사우델레우르 왕조의 끝(1628~1629)」(뒤의 사건)에 있다. 미크로네시아인의 서쪽 섬 정착은 「팔라우·얍과 캐롤라인 제도의 정착(기원전 300~기원후 500)」(앞의 사건)과 이어진다."
  subjects: [saudeleur, micronesian-culture]
  tags: [politics, culture]
  places: [{ name: 난 마돌, at: [158.33, 6.84], year: 1180 }]
  sources: ["위키백과 Nan Madol", "위키백과 History of Micronesia", "위키백과 Saudeleur dynasty"]

- id: rapa-nui-1200
  year: 1200
  endYear: 1600
  title:
    ko: "라파누이인의 이스터섬 정착과 모아이(1200~1600)"
  summary:
    ko: "이스터섬, 곧 라파누이에 사람이 처음 닿은 때는 800년 무렵으로 보는 예전 견해와 1200년 무렵으로 보는 짧은 연대로 갈린다. 위키백과 이스터섬 문서는 2007년 연구를 따라 12세기를 가장 좋은 추정으로 적고, 폴리네시아 문서도 망가레바를 거쳐 1200년 무렵 닿았다고 본다. 전승은 족장 호투 마투아와 선장 투우 코 이호가 두 척의 카누로 왔다고 하며, 그 고향을 마라에 렌가라고 한다. 섬 이름 '라파누이'는 1860년대 노예 사냥 뒤에 쓰기 시작한 폴리네시아 이름으로 '큰 라파'를 뜻하며, 영어 이름은 1722년 부활절에 네덜란드의 야코프 로헤벤이 닿은 데서 나왔다. 이 섬 사람들이 남긴 가장 큰 것은 모아이다. 섬에는 1,000기 가까운 석상이 남아 있으며, 라노 라라쿠 채석장에서 깎아 대개 해안의 아후 위에 세웠다. 아후는 석상이 서는 돌 제단이자 신성한 구역이었고, 석상은 바다를 등지고 마을 쪽을 향했다. 이 섬 사람들은 롱고롱고라는 글자 판도 남겼다. 숲이 사라진 까닭은 학설이 갈린다. 땅을 일구려고 나무를 벤 일과 폴리네시아쥐가 들어온 일이 숲을 줄였다는 데는 대체로 의견이 같지만, 재레드 다이아몬드는 지나친 벌채와 쥐, 기후 변화를 겹쳐 '생태계 파괴'로 설명했고 헌트와 리포는 인구가 늘며 숲이 줄었다고 보면서 뒤의 붕괴를 질병과 약탈, 노예 사냥 탓으로 돌린다. 인구는 유럽 사람이 처음 닿은 1722년 무렵 2,000~4,000명으로 어림하는데, 한 해석은 그 앞 세기에 1만 5천 명까지 컸다고 하는 반면 다른 연구는 몇천 명을 넘지 않았다고 한다. 이 섬은 폴리네시아인의 정착지 가운데 가장 동쪽 끝으로 남았다."
  subjects: [rapa-nui, polynesian-culture]
  tags: [society, culture]
  sources: ["위키백과 Easter Island", "위키백과 Polynesia", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)", "Jared Diamond, Collapse: How Societies Choose to Fail or Succeed (2005)", "Terry Hunt·Carl Lipo, The Statues That Walked: Unraveling the Mystery of Easter Island (2011)"]

- id: maori-1250
  year: 1250
  endYear: 1500
  title:
    ko: "마오리족의 아오테아로아 정착과 모아 사냥(1250~1500)"
  summary:
    ko: "뉴질랜드, 마오리말로 아오테아로아에 폴리네시아인이 처음 자리 잡은 때는 1250년 무렵으로 본다. 쥐 뼈의 방사성 탄소 연대는 1280년 무렵을 가리키고, 2022년 연구는 북섬 정착을 1250~1275년 사이로 보며, 본격적인 정착은 14세기 전반으로 잡는 이도 있다. 폴리네시아 문서는 뉴질랜드를 1200~1300년으로 적어 문서마다 해가 다르다. 정착민은 동폴리네시아에서 왔고 조상은 5,000년쯤 전 타이완 원주민에까지 닿는다. 구전은 조상들이 큰 와카(카누)를 타고 하와이키에서 계획해 건너왔다고 하며 그 해를 1350년 무렵으로 적기도 한다. 남섬 마를버러의 와이라우 바 유적은 정착 초기인 '고풍기'의 유적이며, 13세기 초에서 15세기 초까지 사람이 살았던 곳으로, 다른 곳에서 태어난 사람의 뼈가 나온 뉴질랜드 유일의 유적이다. 사람들은 날지 못하는 큰 새 모아를 사냥했다. 가장 큰 종은 목을 뻗으면 키 3.6m, 무게 약 230kg에 이르렀다. 모아는 1445년 무렵까지 모두 사라졌는데, 방사성 탄소 연대는 사람이 오고 100년이 안 되어 멸종했음을 가리켜 몇 세기 걸렸다고 보던 예전 견해를 바꾸었다. 모아를 먹이로 삼던 하스트독수리도 함께 사라졌다. 마오리족은 부족마다 땅과 우두머리를 따로 두었다. 사람들은 고구마(쿠마라)를 길렀고, 인구가 늘며 경쟁과 싸움이 잦아지자 파라는 요새 마을이 곳곳에, 특히 북쪽에 많이 지어졌다. 1500년 무렵부터의 추운 시기와 함께 사회가 '고전기'로 바뀌었다고 본다. 15세기 무렵 일부는 채텀 제도로 건너가 모리오리가 되었다. 구전은 16세기의 지도자 누누쿠가 전쟁을 금했다고 전한다. 고전기에는 정교하게 다듬은 옥(포우나무) 무기와 장식, 조각한 전쟁 카누, 집회소(와레누이)가 특징이다."
  subjects: [maori, polynesian-culture]
  tags: [society, culture]
  sources: ["위키백과 Māori people", "위키백과 Moa", "위키백과 Polynesia", "Patrick V. Kirch, On the Road of the Winds: An Archaeological History of the Pacific Islands before European Contact, 2nd ed. (University of California Press, 2017)"]

- id: hawaii-chiefdoms-1400
  year: 1400
  endYear: 1600
  title:
    ko: "하와이섬 족장 사회와 섬마다의 알리이 누이(1400~1600)"
  summary:
    ko: "고대 하와이는 하와이섬·마우이섬·오아후섬·카우아이섬 같은 큰 섬마다 알리이 누이라 부르는 최고 족장이 따로 다스리던 사회다. 처음 사람이 자리 잡은 일은 「하와이 제도의 정착과 고대 하와이(1000~1300)」(앞의 사건)에서 다루었다. 사회는 네 신분으로 나뉘었다. 신의 힘(마나)을 받아 다스린다고 여긴 알리이 족장, 사제와 항해사·목수·치료사를 아우르는 카후나, 밭을 갈고 고기를 잡아 족장과 사제를 먹여 살린 마카아이나나 평민, 그 아래의 종과 천민 카우와였다. 땅은 사고파는 것이 아니라 족장이 관리하는 것이어서 족장이 죽거나 싸움에 지면 다시 나뉘었다. 땅은 산에서 바다까지 이어진 구역별로 나뉘었고 구역마다 콘오히키라는 땅 관리인이 족장을 대신했다. 카푸 금기는 제사와 먹는 것, 고기잡이철을 정하는 법 구실을 했다. 모시던 큰 신은 전쟁의 쿠, 빛과 생명의 카네, 죽음의 카나로아, 평화와 풍요의 로노였다. 신전인 헤이아우에는 농사를 비는 로노의 신전과 전쟁 때 제물을 바치던 루아키니가 있었고, 루아키니에는 알리이와 높은 족장, 쿠 신을 모시는 카후나만 들어갈 수 있었다. 한 해의 끝 무렵 몇 달은 로노를 기리는 마카히키 철이어서 싸움을 멈추고 공물을 거두었다. 하와이섬은 전승에 따르면 1500년 무렵 우미 아 릴로아가 여러 지역을 하나로 묶었고 그의 후손 한 계통이 18세기 후반까지 섬을 다스렸다고 하는데, 이 연대는 계보에서 어림한 값이다. 이 사회는 「쿡의 하와이 도달과 죽음(1778~1779)」(뒤의 사건)을 지나 「카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)」(뒤의 사건)로 이어진다."
  subjects: [hawaiian-chiefdoms]
  tags: [society, politics]
  sources: ["위키백과 영어판 Ancient Hawaii", "위키백과 영어판 Kamehameha I", "위키백과 한국어판 고대 하와이"]

- id: tahiti-marae-1450
  year: 1450
  endYear: 1767
  title:
    ko: "타히티와 쿡 제도의 마라에와 족장 사회(1450~1767)"
  summary:
    ko: "타히티 족장 사회는 유럽 사람이 닿기 앞서 소시에테 제도의 섬과 골짜기마다 족장 가문이 따로 다스리던 사회다(아리이 족장과 마라에의 첫 소개는 「동폴리네시아에 닿은 항해와 타히티 족장 사회의 시작(300~1000)」(앞의 사건)에 있다). 마라에는 한 가문과 한 땅에 묶여 제사를 올리고 족장의 권위를 눈에 보이게 하던 곳이며, 라이아테아섬 오포아의 타푸타푸아테아 마라에는 약 천 년 동안 동폴리네시아의 종교 중심이었다고 하고 2017년 유네스코 세계유산으로 올랐다. 먼 섬의 족장과 항해자들이 이곳에 모였다고 전하며, 이 모임이 먼 섬과 이어진 항해 소식의 바탕이었다고 보는 시각이 있다. 아리오이는 오로 신을 섬기며 섬을 돌아다니며 춤과 연극을 보이던 결사로, 신분이 높은 이들이 이끌었다고 전한다. 이 모습은 18세기 유럽 방문자와 선교사의 기록에 기대 알려진 것이어서 그 눈으로 본 해석이라는 점을 함께 읽어야 한다. 타히티섬은 큰 타히티누이와 작은 타히티이티가 좁은 목으로 이어진 섬이고, 라이아테아·후아히네·보라보라 같은 가까운 섬들과 함께 소시에테 제도를 이룬다. 타히티섬 안에서는 큰 족장 집안들이 마라에와 땅을 거느린 채 동맹과 전쟁을 되풀이했을 뿐 한 사람이 섬 전체를 쥔 적이 없었다. 쿡 제도의 라로통가섬에서도 아리키라 불리는 족장 가문들이 섬을 나누어 다스렸다고 한다. 이런 사회는 1722년 로헤벤이 소시에테 제도 서쪽의 보라보라에 들렀을 뿐 타히티섬에는 1767년 월리스의 배가 처음 닿을 때까지 이어졌고, 1791년 이 족장 사회가 포마레 가문 아래 하나로 묶이기 시작했다(「포마레 왕조의 타히티 왕국(1791~1815)」(뒤의 사건))."
  subjects: [tahitian-chiefdoms]
  tags: [society, religion]
  sources: ["위키백과 영어판 Taputapuātea", "위키백과 영어판 Society Islands", "위키백과 한국어판 소시에테 제도"]

- id: tonga-dual-1470
  year: 1470
  endYear: 1610
  title:
    ko: "투이 하아타칼라우아와 투이 카노쿠폴루: 통가 왕권의 나뉨(1470~1610)"
  summary:
    ko: "통가 제국의 임금 투이 통가는 아호에이투 이래 신성한 임금으로 여겨졌고(「아호에이투와 통가 제국의 시작(950~1300)」(앞의 사건)), 날마다의 정치는 시간이 지나며 다른 칭호로 넘어갔다. 전승은 투이 통가 카우울루포누아 1세가 동생 모웅가모투아에게 일상의 정치와 군사를 맡기고 투이 하아타칼라우아라는 칭호를 준 데서 이 나뉨이 시작되었다고 전한다. 이 일의 해는 족보에서 어림한 값이어서 문서마다 다르다. 위키백과 영어판 투이 하아타칼라우아 문서는 모웅가모투아를 1470년 무렵으로 적지만, 통가 제국 문서는 투이 통가 타카라우아가 1535년 암살된 뒤 카우울루포누아 1세가 칭호를 만들었다고 적는다. 하아타칼라우아는 일상의 결정을 맡았지만 사람의 생사를 가르는 마지막 말은 투이 통가가 쥐었다고 한다. 1610년 무렵 여섯 번째 투이 하아타칼라우아 모웅가통가가 사모아 쪽 어머니를 둔 응가타에게 투이 카노쿠폴루라는 칭호를 주었다. 카노쿠폴루는 '우폴루의 심장'을 뜻한다고 하며 어머니 쪽 사모아 혈통을 기린 이름이다. 이로써 통가의 권력은 신성한 임금 투이 통가, 일상의 정치를 맡은 투이 하아타칼라우아, 그리고 새 칭호 투이 카노쿠폴루로 갈라졌다. 족장들은 옛 해안길을 사이에 두고 투이 통가를 따르는 무리와 카노쿠폴루를 따르는 무리로 나뉘었다고 하며, 시간이 갈수록 카노쿠폴루 쪽의 힘이 커졌다. 투이 통가의 권위는 제사와 의례에서 계속 높았으나 땅과 사람을 부리는 힘은 두 칭호 쪽으로 옮겨 갔다고 한다. 이런 계보는 전승이어서 이름과 차례가 문서마다 조금씩 다르다. 그 계통에서 나온 타우파아하우가 19세기에 조지 투포우 1세가 되어 통가를 하나로 묶는다(「조지 투포우 1세의 통가 통일과 1875년 헌법(1845~1875)」(뒤의 사건))."
  subjects: [tui-tonga]
  tags: [politics, society]
  sources: ["위키백과 영어판 Tuʻi Tonga Empire", "위키백과 영어판 Tuʻi Haʻatakalaua", "위키백과 영어판 Tuʻi Kanokupolu"]

- id: guam-magellan-1521
  year: 1521
  endYear: 1526
  title:
    ko: "마젤란 함대의 괌 도착과 차모로인(1521~1526)"
  summary:
    ko: "1521년 3월 6일(율리우스력) 마젤란 함대의 배들이 괌의 해안에 닿았다. 다섯 척으로 떠난 함대는 폭풍과 병, 반란을 겪어 세 척에 선원 절반쯤으로 줄어 있었고 태평양을 석 달 넘게 건너온 끝이었다(항해 전체는 「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」, 신항로 개척의 틀은 「콜럼버스와 다가마, 신항로 개척」). 닿은 곳은 우마탁이라는 설이 많지만 마젤란의 일기 그림은 투몬을 가리킬 수도 있다고 한다. 배를 에워싼 차모로인의 날랜 돛배들이 물건을 바꾸자고 다가왔고, 한 사람이 기함 뒤에 매달린 작은 배를 끌고 갔다. 함대는 이를 도둑질로 보고 포를 쏘며 상륙해 집을 불태웠다. 안토니오 피가페타는 이때 일곱 명쯤이 죽었다고 적었다(스페인 쪽 기록 하나뿐인 숫자다). 마젤란은 이 섬들을 '도둑의 섬'(라드로네스 제도)이라 불렀는데, 이는 스페인 쪽의 이름이고 차모로인에게는 물건을 나누는 풍습의 문제였다는 풀이가 있다. 이 이름은 1668년 산비토레스가 마리아나 제도로 바꾸어 부른다. 앞서 사람이 살기 시작한 일은 「마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)」(앞의 사건)에서 다루었다. 위키백과 영어판 스페인–차모로 전쟁 문서는 스페인 사람이 선교를 시작한 1668년의 괌 인구를 3만 5천~5만 명으로 어림한다(프랜시스 헤젤은 4만 명을 가정한다). 마젤란 함대는 사흘쯤 머물며 물과 신선한 먹을거리를 얻고 3월 9일 떠나, 일주일 뒤인 3월 16일 필리핀 호몬혼섬에 닿았다. 차모로인의 돛배(프로아)는 한쪽에 뜨개를 단 날랜 배로 스페인 사람 눈에 매우 빠르게 보였다고 한다. 1526년에는 로아이사 원정대가 태평양을 건너 이 섬들에 닿았다."
  subjects: [chamorro]
  tags: [exploration, society]
  sources: ["위키백과 영어판 History of Guam", "안토니오 피가페타, 마젤란 항해 일기(위키백과 영어판 Antonio Pigafetta 참조)", "위키백과 영어판 Chamorro people", "위키백과 영어판 Spanish–Chamorro Wars", "위키백과 한국어판 차모로인"]

- id: legazpi-guam-1565
  year: 1565
  endYear: 1600
  title:
    ko: "레가스피의 괌 영유 선언과 마닐라 갈레온(1565~1600)"
  summary:
    ko: "레가스피의 함대는 멕시코를 떠나 태평양을 건너 1565년 1월 괌 앞바다에 닿았다(율리우스력). 함대는 마젤란에게서 40여 년이 지난 뒤 이 길을 되짚었고, 물과 먹을 것과 땔감을 사려고 차모로인의 마을에 들렀다. 차모로인은 마리아나 제도에 기원전 1500년 무렵부터 살아 온 사람들이다(「마리아나 제도의 첫 정착과 차모로인의 조상(기원전 1500~기원전 1000)」(앞의 사건)). 앞서와 같이 돛배를 몰고 나와 쌀과 과일과 코코넛을 쇠붙이와 바꾸었다. 레가스피는 이 섬이 스페인 왕 펠리페 2세의 땅이라고 선언했다. 스페인 쪽의 영유 선언일 뿐이어서 이때 섬에 눌러앉은 사람은 없었고, 괌에 스페인 선교사들이 들어오는 때는 1668년이다. 함대는 이어 필리핀으로 가 세부에 첫 정착지를 세웠다. 그 일과 돌아오는 길을 찾은 일은 「레가스피의 세부 정착과 마닐라 건설(1565~1572)」에 있다. 이런 접촉은 스페인 쪽 눈으로 쓴 글에만 남아 있다. 이 길로 아카풀코와 마닐라를 오간 마닐라 갈레온은 은을 싣고 와 중국 비단과 바꾸어 돌아가는 배로, 1565년부터 마지막 항해가 있던 1815년까지 해마다 한두 척이 다녔다. 괌은 이 항로의 정기 기항지였으나 스페인은 오랫동안 섬에 관리를 두지 않았고, 괌에서 '총독' 칭호를 처음 쓴 사람은 스페인–차모로 전쟁 중이던 1676년 6월의 프란시스코 데 이리사리이며, 스페인 왕에게서 임명을 처음 받은 총독은 1681년 6월 괌에 온 안토니오 데 사라비아였다. 차모로인의 처지에서는 해마다 서쪽으로 가는 큰 배가 들러 쇠붙이를 바꾸어 주는 일이 생겼고, 이 접촉이 병이 들어오는 길이기도 했다."
  subjects: [chamorro]
  tags: [exploration, trade]
  sources: ["위키백과 영어판 History of Guam", "위키백과 영어판 Manila galleon", "위키백과 한국어판 마닐라 갈레온"]

- id: mendana-1568
  year: 1568
  endYear: 1595
  title:
    ko: "멘다냐의 솔로몬 제도 항해(1568~1595)"
  summary:
    ko: "알바로 데 멘다냐는 페루 총독의 명으로 1567년 11월 20일 로스레예스호와 토도스산토스호 두 척을 이끌고 카야오를 떠나(율리우스력) 서쪽의 이름 없는 땅을 찾았다. 1568년 2월 7일 산타이사벨섬을 보고 며칠 뒤 닿아 작은 배를 만들어 둘레의 섬들을 돌았다. 스페인 사람들은 솔로몬 왕의 금이 이곳에서 났을 것이라 여겨 이 섬들을 '솔로몬 제도'라 불렀다. 솔로몬 제도 주민과는 처음에는 물건을 나누었으나 이내 식량을 두고 다툼이 잦아졌고 충돌에서 많은 사람이 죽었다고 하며, 과달카날 같은 섬 이름은 스페인 사람들이 가져온 이름이다. 8월 7일 선장·항해사·병사·선원 회의가 돌아가기로 해 1569년 1월 말 멕시코 해안에 닿았다. 이 섬들은 금이 없다는 평판과 잘못된 위치 기록 때문에 거의 200년 동안 다시 찾아지지 않았다. 솔로몬 왕의 금 전설은 구약성서의 땅 오빌과 이어 붙인 믿음일 뿐 근거가 없었다. 멘다냐는 1595년 4월 9일 카야오에서 네 척에 378명을 태우고 두 번째로 떠났다. 7월 21일 마르키즈 제도에 닿아 페루 총독 가르시아 우르타도 데 멘도사를 기려 이름을 붙이고, 9월 8일 산타크루스(오늘의 넨도섬)에 닿아 정착지를 세웠다. 그러나 병과 원주민과의 다툼이 이어졌고, 10월 18일 멘다냐가 죽었으며 10월 30일 정착지를 버렸으니 두 달도 버티지 못한 셈이다. 정착을 노린 두 번째 항해에는 가족도 함께 탔다. 멘다냐의 아내 이사벨 바레토가 지휘를 이어받았다. 11월 18일 남은 세 척이 떠나 1596년 2월 11일 페드루 페르난데스 지 케이로스가 산헤로니모호를 마닐라만으로 끌고 들어왔다."
  subjects: [solomon-islanders]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Álvaro de Mendaña de Neira", "위키백과 영어판 Solomon Islands"]

- id: quiros-torres-1606
  year: 1606
  endYear: 1607
  title:
    ko: "케이로스의 에스피리투산토와 토레스 해협 통과(1606~1607)"
  summary:
    ko: "페드루 페르난데스 지 케이로스는 1605년 12월 21일 카야오에서 세 척에 약 160명을 태우고 떠났다(율리우스력). 1606년 5월 오늘날 바누아투의 가장 큰 섬에 닿은 그는 이곳을 남쪽 큰 대륙의 일부라 믿어 '아우스트랄리아 델 에스피리투산토'라 불렀고 누에바예루살렘이라는 도시를 세우려 했다. '아우스트랄리아'는 라틴어로 '남쪽'을 뜻하는 말에 스페인 왕가 합스부르크의 '오스트리아'를 겹쳐 쓴 말장난이라는 풀이가 있고, 에스피리투산토는 '성령'을 뜻한다. 그러나 니바누아투 쪽의 적대와 선원들의 불화로 몇 주 만에 계획을 버렸다. 6월 11일 밤 케이로스의 배가 나쁜 날씨에 다른 배와 떨어졌다. 케이로스는 날씨 탓에 돌아가지 못했다고 했지만, 부하 디에고 데 프라도의 기록은 선원 반란으로 그가 선실에 갇혔다고 적고 토레스는 그가 일부러 버렸다고 말했다. 케이로스의 배는 그해 11월 아카풀코에 닿았다. 둘째 지휘관 루이스 바에스 데 토레스는 며칠을 헛되이 찾은 뒤 섬을 떠나 서쪽으로 갔다. 그는 뉴기니 남쪽 해안을 따라 가다 훗날 이름이 붙는 토레스 해협의 좁고 얕은 바다를 지나 1607년 5월 마닐라에 닿았다. 이 해협은 가장 좁은 곳이 약 150 km이고 암초와 얕은 바다가 많아 배가 지나기 어렵다. 토레스와 프라도는 뉴기니 남동쪽 해안에서 파푸아인과 폭력을 겪고 스무 명을 붙잡았다고 적었다. 토레스의 보고는 스페인 문서고에 묻혔다가, 1762~1765년 사이 알렉산더 달림플이 기록을 보고 항해 지도를 조지프 뱅크스에게 건넨 뒤에야 알려졌다. 케이로스의 죽음은 1614년이라는 설과 1615년이라는 설이 갈린다. 두 사람이 지나간 이 길은 유럽에서 오스트레일리아에 닿으려던 길의 한 갈래였다."
  subjects: [ni-vanuatu, papuans]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Pedro Fernandes de Queirós", "위키백과 영어판 Luís Vaz de Torres", "위키백과 영어판 Torres Strait"]

- id: janszoon-1606
  year: 1606
  endYear: 1629
  title:
    ko: "얀스존의 케이프요크반도와 '뉴홀랜드'(1606~1629)"
  summary:
    ko: "네덜란드 동인도 회사는 1605년 빌럼 얀스존이 지휘하는 두이프컨호를 보내 남쪽과 동쪽 땅에서 교역할 곳을 찾게 했다. 두이프컨호는 1605년 11월 18일 반탐을 떠나 반다를 거쳐 1606년 2월 26일 케이프요크반도 서쪽 해안, 오늘날 카펀테리아만의 페너파더강 가까이에 닿았다(율리우스력). 위키백과 영어판은 이를 오스트레일리아에 대한 최초의 확실한 유럽 사람의 목격이자 상륙으로 적는다. 이 해안에 사는 오스트레일리아 원주민과의 만남은 우호적이지 않았다. 한 기록(존 세어리스가 전한 말)은 충돌로 선원 아홉이 죽었다고 적지만 뉴기니 쪽 사망을 합친 값이라 오스트레일리아 쪽 사망은 서술마다 갈리고, 일부 원주민 구전은 이 사망을 케이프키어위어 일대의 일로 전한다. 얀스존은 이 땅을 뉴기니의 남쪽 연장이라 여긴 것으로 알려져 있으며 이 땅이 교역할 만한 곳이 아니라고 보고 반다로 돌아갔다. 이 땅의 사람들은 수만 년 전부터 살아 온 이들이다(「오스트레일리아 원주민과 토레스 해협 제도 원주민, 딩고의 도착(기원전 2333~기원전 1500)」(앞의 사건)). 이후 네덜란드 배들이 인도양에서 동인도로 가는 새 항로를 타고 오스트레일리아 서해안에 닿는 일이 잦아졌다. 1616년 디르크 하르톡이 에이트라흐트호로 서해안 앞 섬에 닿아 접시를 남겼고, 1623년 얀 카르스턴스존이 카펀테리아만 해안을 따라 갔으며, 1629년에는 바타비아호가 서해안 앞바다에서 난파했다. 네덜란드 사람들은 이 땅을 '뉴홀랜드'라 부르기 시작했는데, 이 이름이 널리 쓰인 것은 1642년과 1644년의 아벌 타스만 항해(「아벌 타스만의 태즈메이니아와 뉴질랜드 도달(1642~1644)」(뒤의 사건)) 뒤다. 유럽 사람들은 이 땅을 이득이 없다고 보아 오랫동안 손대지 않았고, 서해안은 항로를 벗어난 배가 닿는 곳이었다. 오스트레일리아를 하나의 대륙으로 그려 낸 지도도 이 항해들이 쌓인 뒤에야 나온다."
  subjects: [aboriginal-australians]
  tags: [exploration]
  sources: ["위키백과 영어판 Duyfken", "위키백과 영어판 Willem Janszoon", "위키백과 영어판 Dirk Hartog"]

- id: isokelekel-1628
  year: 1628
  endYear: 1629
  title:
    ko: "이소켈레칼과 사우델레우르 왕조의 끝(1628~1629)"
  summary:
    ko: "사우델레우르 왕조는 폰페이섬을 처음으로 하나로 묶어 다스린 왕조로, 난 마돌을 정치와 제사의 중심으로 삼았다(「난 마돌과 사우델레우르 왕조(1100~1300)」(앞의 사건)). 왕조의 임금 수는 여덟 명에서 열일곱 명까지 이야기마다 다르다. 사우델레우르 때 폰페이섬은 세 구역이었고 뒤에 우와 네트가 더해져 지금의 다섯 구역이 되었다. 바치는 공물은 처음에는 철마다 거두는 것이었으나 시간이 지나며 노동 의무가 커졌다고 하는데, 이 이야기는 폰페이 사람들의 구전과 전설로 전해 온 것이다. 전승에 따르면 뒷날의 임금들은 섬 사람들에게 무거운 공물을 요구해 미움을 샀고, 그 공물이 노동 요구로 커져 주민이 굶주리며 종처럼 살았다고 한다. 오늘날 미크로네시아 연방에 드는 코스라에섬에서 온 이소켈레칼이 군사를 이끌고 와 마지막 사우델레우르를 몰아냈다. 이소켈레칼이 선 해는 고고학 연구가 1628년 무렵으로 보지만, 구전 전승은 이 일을 16세기에 두기도 해 학설마다 다르다. 그가 세운 질서가 난마르키 체제다. 폰페이섬은 마돌레니흐므를 비롯한 다섯 족장령으로 나뉘었고, 족장령마다 우두머리가 난마르키 칭호를 쓰는 이 체제는 이소켈레칼의 정복 뒤 들어섰으며, 사우델레우르의 중앙 통치보다 권한이 흩어진 체제로 오늘날까지 이어진다. 난마르키들은 난 마돌에 머물렀지만 물과 먹을 것을 스스로 구해야 했고, 이 어려움이 난 마돌이 점차 비어 간 까닭의 하나라는 설이 있으며 인구가 줄었다는 설도 있다. 난 마돌의 모습은 「난 마돌과 사우델레우르 왕조(1100~1300)」(앞의 사건)에 있다. 이소켈레칼은 침공 뒤 난 마돌에도 머물렀다고 한다."
  subjects: [saudeleur]
  tags: [politics, legend]
  sources: ["위키백과 영어판 Nan Madol", "위키백과 영어판 Saudeleur dynasty", "위키백과 한국어판 사우델레우르 왕조"]

- id: tasman-1642
  year: 1642
  endYear: 1644
  title:
    ko: "아벌 타스만의 태즈메이니아와 뉴질랜드 도달(1642~1644)"
  summary:
    ko: "네덜란드 동인도 회사의 총독 안토니 판 디멘의 뜻에 따라 아벌 타스만은 1642년 8월 14일 두 척을 이끌고 바타비아를 떠났다(네덜란드 기록은 그레고리력 날짜다). 11월 24일 오늘날 태즈메이니아의 서쪽 해안이 눈에 들어와 후견인의 이름을 따 '안토니 판 디멘의 땅', 곧 반디먼즈랜드라 이름 붙였고, 12월 1일 남동쪽 앞바다에 닻을 내렸고 2일 보트가 만에서 뭍에 올라 푸성귀를 구했으며 3일 이 땅이 네덜란드의 것이라 선언했다. 이곳에서 사람을 만나지는 못했으나 나무에 판 발판과 연기를 보았다고 적었는데, 이 땅에 살던 사람들이 오스트레일리아 원주민이다. 12월 13일에는 뉴질랜드 남섬의 해안을 보고 '스타텐란트'라 불렀으니 유럽 사람이 기록으로 남긴 첫 도착이다. 12월 중순 이후 지금의 골든베이에서 마오리족의 배가 작은 배를 들이받는 충돌이 일어나 네덜란드 선원 넷이 죽었고, 타스만은 이곳을 '살인자의 만'이라 불렀다. 마오리족 쪽에는 이 일의 기록이 없어 까닭은 알 수 없고, 네덜란드 기록은 마오리족이 먼저 적대했다고 적었다. 타스만은 이 해안을 두고 '알려지지 않은 남쪽 땅의 본토 해안이라고 우리는 믿는다'고 적었으며, 상륙하지 못한 채 북쪽으로 올라갔고 1643년 1월 20일 통가 군도를 만났으며 피지의 암초에서 배가 위험에 빠진 뒤 6월 15일 바타비아로 돌아왔다. 1644년 1월 30일 두 번째로 바타비아를 떠나 오스트레일리아 북쪽 해안을 따라 갔고 8월에 돌아왔다. 마오리족과 유럽 사람의 다음 만남은 1769년 「제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)」(뒤의 사건)이다."
  subjects: [maori, aboriginal-australians]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Abel Tasman", "위키백과 영어판 Golden Bay / Mohua", "위키백과 한국어판 아벌 타스만"]

- id: marianas-mission-1668
  year: 1668
  endYear: 1695
  title:
    ko: "산비토레스의 마리아나 선교와 스페인–차모로 전쟁(1668~1695)"
  summary:
    ko: "1668년 6월 15일 갈레온 산디에고호가 괌에 닿아 예수회의 디에고 루이스 데 산비토레스와 선교사들이 내렸다(율리우스력). 하갓냐에서는 족장 케푸하가 이들을 맞았다고 한다. 선교사들은 이 섬들의 이름을 스페인 왕비 마리아나를 기려 마리아나 제도로 바꾸었다. 선교를 둘러싼 긴장은 1670~1671년 전쟁으로 번졌고, 1672년 4월 2일 투몬에서 산비토레스와 조수 페드로 칼룽소드가 족장 마타팡 쪽에 죽었고 후라오도 가담했다는 전승이 있다. 전쟁은 되풀이되었고, 1679년 괌에 온 호세 데 키로가가 1680년 지휘를 맡으면서 마을을 부수고 차모로인을 교회 둘레의 큰 마을로 모으는 정책이 강하게 시행되었다. 1683년의 큰 봉기가 마지막 큰 저항이었고, 위키백과 영어판 History of Guam은 1695년 7월 키로가가 괌·로타·티니안·아기한의 정복을 마쳤다고 적지만, 같은 곳의 스페인–차모로 전쟁 문서는 티니안 원정을 1696년 7월로, 북쪽 섬 이주의 끝을 1699년으로 적는다. 산비토레스의 죽음은 뒷날 그를 복자로 올리는 절차로 이어졌고 이 절차는 1695년에 공식으로 열렸다. 1671년과 1693년의 태풍, 1688년의 천연두도 사람 수를 줄였다. 차모로인은 모계 씨족 사회로, 족장이 마을을 이끌었다. 선교사들이 아이들에게 세례를 주는 일이 부모와 어른들의 반발을 샀다고 하며 이것이 충돌의 한 까닭으로 꼽힌다. 스페인 사람이 오기 앞의 인구 어림은 「마젤란 함대의 괌 도착과 차모로인(1521~1526)」(앞의 사건)에 있고, 1710년의 조사는 3,539명(괌페디아) 또는 3,197명(안 페레스 하토리가 모은 표)이라 두 값이 다르다. 줄어든 까닭으로 프랜시스 헤젤은 전염병을 가장 크게 보고, 전쟁에서 많이 죽었다고 보는 서술도 있다. 북마리아나 제도 사람들을 괌으로 옮겨 모으는 일은 1740년에도 있었다. 이 선교의 앞 시기는 「레가스피의 괌 영유 선언과 마닐라 갈레온(1565~1600)」(앞의 사건)에 있다."
  subjects: [chamorro]
  tags: [religion, war]
  sources: ["위키백과 영어판 Diego Luis de San Vitores", "위키백과 영어판 History of Guam", "위키백과 영어판 Spanish–Chamorro Wars", "괌페디아 Guampedia(1710년 조사)"]

- id: roggeveen-1722
  year: 1722
  endYear: 1722
  title:
    ko: "로헤벤의 이스터섬 도착과 라파누이(1722)"
  summary:
    ko: "네덜란드 서인도 회사의 뜻으로 야코프 로헤벤은 1721년 8월 1일 세 척에 선원 223명을 태우고 떠났다. 함대는 포클랜드를 지나 태평양에 들어섰고, 1722년 4월 5일 부활절 일요일에 남태평양의 외딴 섬에 닿아 '부활절 섬'이라 불렀다. 이 섬이 오늘날의 이스터섬이며 섬 사람들이 라파누이인이다('라파누이'라는 섬 이름은 뒷날 쓰기 시작한 것이다. 「라파누이인의 이스터섬 정착과 모아이(1200~1600)」(앞의 사건)). 로헤벤은 섬 사람이 2천~3천 명쯤 된다고 어림해 적었는데, 이것이 유럽 사람이 이 섬을 적은 첫 기록이다. 로헤벤 함대에 탄 이의 기록은 라파누이인이 돌 조각상 앞에서 불을 피우고 몸을 굽혀 절하는 모습을 전한다. 상륙 때 충돌이 일어나 섬 사람 열두 명쯤이 죽었다고 위키백과 영어판 이스터섬 문서는 적는다. 로헤벤의 항해는 남쪽의 큰 대륙을 찾으려는 것이었고, 그 대신 만난 이 외딴 섬은 칠레 해안에서 서쪽으로 약 3,512 km 떨어져 있다. 이어 함대는 투아모투 제도에서 기함 아프리칸스허 갈레이호를 타카포토 환초에서 잃었고, 소시에테 제도의 보라보라와 마우피티에 닿은 첫 유럽 사람으로 적히며, 사모아의 네 섬을 지도에 그렸다. 마카테아에서는 해안의 군중에게 총을 쏘았고 이어 섬 사람의 매복으로 선원 열 명이 죽었다. 남은 두 척이 바타비아에 닿자 동인도 회사 독점을 어겼다는 까닭으로 로헤벤은 체포되고 배는 몰수되었으나 긴 소송 끝에 회사가 보상했다. 1770년 11월 스페인의 곤살레스 원정대가 섬에 들러 서 있는 조각상을 보았고, 1774년 쿡은 일부 조각상이 쓰러져 있다고 적었다."
  subjects: [rapa-nui]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Jacob Roggeveen", "위키백과 영어판 Easter Island"]

- id: wallis-1767
  year: 1767
  endYear: 1768
  title:
    ko: "월리스의 타히티 도달(1767~1768)"
  summary:
    ko: "영국 해군 대위 새뮤얼 월리스가 지휘한 돌핀호는 1767년 6월 소시에테 제도의 타히티섬에 닿았다. 유럽 배가 이 섬에 닿은 첫 기록이다. 월리스는 병이 들어 선실에 머물렀고 부관 토비아스 퍼노가 먼저 뭍에 올라 깃발을 꽂고 국왕의 이름으로 땅을 차지한다고 선언했다. 배는 마타바이만에 한 달 넘게 머물렀다. 함께 떠난 스왈로호와는 마젤란 해협을 나온 직후 폭풍에 갈라져, 월리스는 혼자 태평양을 건넜다. 병든 선원이 많던 돌핀호는 타히티의 신선한 과일과 채소로 기운을 되찾았다고 한다. 영국 쪽 항해 기록은 처음에 카누를 탄 타히티 사람들이 배를 에워싸고 돌을 던졌고 영국 배가 대포를 쏘아 흩었다고 적는데, 이 충돌과 사상자 수는 영국 기록에만 남아 있다. 이어 영국 사람들은 파파라의 여성 족장 푸레아(영국 기록의 오베레아)와 교역하게 되었고, 쇠못과 쇠 연장이 타히티 사람에게 큰 값이었다고 전한다. 월리스는 섬을 '조지 3세의 섬'이라 부르고 영국 국왕의 땅이라 선언했으나 타히티 사람은 이 선언을 알 수 없었고 이 영유는 영국 쪽의 일방적 선언일 뿐이다. 타히티 족장 사회가 닿기 앞서 어떤 질서를 가졌는지는 「타히티와 쿡 제도의 마라에와 족장 사회(1450~1767)」(앞의 사건)에 있다. 돌핀호는 7월 말 타히티를 떠나 열 달 가까이 지난 1768년 5월 영국으로 돌아왔다. 월리스가 가져온 소식은 이듬해 프랑스의 부갱빌 항해(「부갱빌의 항해와 '새 키테라'(1768~1769)」(뒤의 사건))와 영국의 쿡 항해로 이어진다. 타히티는 이때부터 유럽 배의 기항지가 되어 갔고, 쇠와 병과 무기가 섬에 들어온 시작이기도 했다."
  subjects: [tahitian-chiefdoms]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Samuel Wallis", "위키백과 영어판 Tahiti"]

- id: bougainville-1768
  year: 1768
  endYear: 1769
  title:
    ko: "부갱빌의 항해와 '새 키테라'(1768~1769)"
  summary:
    ko: "루이앙투안 드 부갱빌은 1766년 11월 15일 낭트를 떠나 부데즈호와 에투알호 두 척으로 세계를 한 바퀴 돌았는데, 이는 프랑스 최초의 세계 일주였다. 배에 탄 박물학자 필리베르 코메르송이 본 꽃은 훗날 부겐빌레아라는 이름이 되었다. 1768년 4월 타히티에 이르러 열흘쯤 머물며 섬을 프랑스 왕의 땅이라 선언하고 '누벨시테르'(새 키테라)라 불렀다. 이 이름은 그리스 신화에서 사랑의 여신이 이른 섬의 이름이다. 타히티 사람들이 배에서 물건을 맞바꾸는 모습이 유럽에 알려지면서, 철학자 디드로가 『Supplément au voyage de Bougainville』에서 타히티를 소재로 삼아 자연 상태의 평화로움을 그려, 이른바 '고귀한 야만인'의 상이 퍼지는 데 한몫했다(유럽 계몽사상 쪽의 해석이며 타히티 족장 사회의 실제 모습과는 다르다). 부갱빌은 타히티 사람 아후투루를 배에 태우고 프랑스로 데려갔다. 아후투루는 1771년 10월 고향으로 돌아가는 길에 천연두로 죽었다. 항해는 이어 사모아 가까이를 지나 '항해자 제도'라는 이름을 남겼다고 하며, 1768년 5월 오늘날 바누아투인 뉴헤브리디스의 섬들을 지나갔으며, 솔로몬 제도를 지나며 부건빌섬에 이름을 남겼다. 그는 이곳 솔로몬 제도 주민의 적대 때문에 상륙을 피했다고 한다. 6월에는 큰 파도를 만나 항로를 바꾸었고 이때 그레이트배리어리프에 거의 다다랐다고 하며, 1769년 3월 16일 생말로에 돌아왔을 때 330~340명(배별로 214명과 116명이 탔다는 값을 더하면 330명이다) 가운데 일곱 명만 잃었다. 월리스가 먼저 닿았던 타히티의 사정은 「월리스의 타히티 도달(1767~1768)」(앞의 사건)에 있다."
  subjects: [tahitian-chiefdoms, solomon-islanders]
  tags: [exploration, society]
  sources: ["위키백과 영어판 Louis Antoine de Bougainville", "위키백과 영어판 Tahiti", "드니 디드로(Denis Diderot)의 『Supplément au voyage de Bougainville』(위키백과 영어판 참조)"]

- id: cook-first-voyage-1769
  year: 1769
  endYear: 1771
  title:
    ko: "제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)"
  summary:
    ko: "1768년 8월 26일 제임스 쿡이 지휘하는 엔데버호가 94명을 태우고 플리머스를 떠났다. 쿡은 서른아홉 살이었고 비밀 지시로 남쪽 큰 대륙을 찾으라는 명령도 받았다고 한다. 영국 왕립학회가 금성이 태양 앞을 지나는 일을 재려고 보낸 항해였다. 1769년 4월 13일 타히티 마타바이만에 닿아 6월 3일 금성의 통과를 쟀다. 식물학자 조지프 뱅크스와 함께, 라이아테아의 사제이자 항해자인 투파이아가 배에 올라 남태평양의 길잡이가 되었다. 투파이아는 이 항해에서 이질로 죽었다. 쿡은 타히티 족장 사회의 마을들과 교역하며 7월 소시에테 제도를 영국의 것이라 선언했다. 10월 6일 뉴질랜드에 닿아 7일 포버티만에 올랐을 때 마오리족과 충돌이 일어나 몇 사람이 죽었고, 쿡은 1770년 3월 27일까지 두 섬을 일주하며 쿡 해협을 확인하고 해안을 지도에 그렸다. 4월 19일 오스트레일리아 동해안 포인트힉스를 보고 4월 29일 보타니만에 올랐는데, 그곳 사람들은 창으로 맞섰다고 한다. 마오리 셋이 10월 15일 케이프키드내퍼스에서 더 죽었고, 조지프 뱅크스는 비용을 대어 일곱 사람을 함께 데려갔다. 6월 11일 그레이트배리어리프에 좌초해 8월 초까지 엔데버강에서 배를 수리했고, 8월 22일 포제션섬에서 동해안 전체를 영국 국왕의 땅이라 선언하며 뉴사우스웨일스라 이름 붙였다. 이 선언은 땅에 살던 오스트레일리아 원주민과는 아무 상의가 없었다. 엔데버호는 바타비아를 거쳐 1771년 7월 12일 딜 앞바다에 닿았고, 바타비아에서 일곱 명, 그곳에서 영국으로 가는 길에 스물세 명이 죽었다. 이 항해가 닦은 길이 「영국의 보타니만 식민 결정과 제1함대 출항(1786~1787)」(뒤의 사건)의 바탕이 되었다."
  subjects: [maori, aboriginal-australians, tahitian-chiefdoms]
  tags: [exploration, society]
  sources: ["위키백과 영어판 First voyage of James Cook", "위키백과 영어판 James Cook", "위키백과 한국어판 제임스 쿡"]

- id: cook-hawaii-1778
  year: 1778
  endYear: 1779
  title:
    ko: "쿡의 하와이 도달과 죽음(1778~1779)"
  summary:
    ko: "1776년 떠난 쿡의 3차 항해는 레절루션호와 디스커버리호로 북태평양의 길을 찾는 것이었다(1차 항해는 「제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)」(앞의 사건)). 1778년 1월 18일 오아후섬이 눈에 들어왔고 며칠 뒤 카우아이섬과 니하우섬에 올랐다. 하와이 제도에 유럽 사람이 닿은 확실한 기록은 이 항해가 처음이며, 영국 사람들이 이 섬들을 '샌드위치 제도'라 부른 것은 영국 해군 장관의 이름을 딴 것이다. 쿡은 북쪽으로 올라갔다가 1779년 1월 17일 하와이섬 케알라케쿠아만에 돌아왔다. 이때는 신 로노를 기리는 마카히키 철이었고, 하와이 사람이 쿡을 로노로 여겼는가를 두고 학자 마셜 살린스와 가나나트 오베예세케레가 다투었으며 앤 샐먼드는 최고 족장이 신의 후손으로 여겨졌다고 풀어 학설이 갈린다. 배는 2월 4일 떠났으나 돌풍에 돛대가 상해 11일 돌아왔다. 디스커버리호의 작은 배를 도둑맞은 일로 쿡이 최고 족장 칼라니오푸우를 인질로 잡으려다 1779년 2월 14일 카아와로아에서 충돌이 일어나 쿡과 해병 네 명이 죽었다. 하와이 사람은 카아와로아에서 17명, 같은 날 만의 다른 곳에서 여덟 명이 더 죽어 모두 25명이 숨졌다고 한다. 하와이 사람들은 쿡의 몸을 나누어 족장들에게 돌렸는데, 높은 상대에 대한 존중의 표시였다고 설명한다. 유럽 무역이 이때부터 고대 하와이로 들어왔고, 유럽 사람과 만나기 앞의 인구는 20만~100만 명으로 어림한다. 이 섬의 족장들은 곧 서양 무기를 얻으려 다투게 된다(「카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)」(뒤의 사건))."
  subjects: [hawaiian-chiefdoms]
  tags: [exploration, war]
  sources: ["위키백과 영어판 Death of James Cook", "위키백과 영어판 Third voyage of James Cook", "위키백과 영어판 Ancient Hawaii", "마셜 살린스·가나나트 오베예세케레·앤 샐먼드의 논쟁(위키백과 영어판 Death of James Cook 참조)"]

- id: kamehameha-1782
  year: 1782
  endYear: 1795
  title:
    ko: "카메하메하 1세의 하와이섬 장악과 누우아누 전투(1782~1795)"
  summary:
    ko: "카메하메하는 하와이섬 코할라에서 태어난 족장으로 태어난 해는 1736년 무렵(카마카우의 설)부터 1748~1761년(쿠이켄달의 설) 사이에서 갈린다. 하와이섬의 최고 족장 칼라니오푸우가 1782년에 죽으면서 아들 키와라오가 자리를 이었고 조카 카메하메하는 땅 일부를 받았다. 그해 모쿠오하이 전투에서 키와라오가 패해 죽었고 섬은 몇 세력으로 갈렸다. 카메하메하는 그 가운데 하나를 쥐었고 위키백과 영어판은 1782년 7월부터 그를 하와이섬 알리이 누이로 적는다. 족장들이 서양 무기를 얻으려 다투던 때(「쿡의 하와이 도달과 죽음(1778~1779)」(앞의 사건))라, 카메하메하는 영국 선원 존 영과 아이작 데이비스(페어아메리칸호 승무원 가운데 유일하게 살아남은 사람)를 곁에 두었다. 1790년 마우이섬 케파니와이 전투에서는 페어아메리칸호에서 얻은 대포로 마우이 군대를 눌렀고, 1791년 푸우코홀라 신전이 완성된 뒤 경쟁자 케오우아가 죽자 하와이섬 전체의 임금이 되었다. 1795년에는 마우이섬과 몰로카이섬을 거쳐 오아후섬에서 누우아누 전투로 이겼다. 이로써 고대 하와이가 끝나고 하와이 왕국이 섰다. 그의 재위 시작은 문서마다 1782년(알리이 누이), 1795년(여러 섬을 아우른 왕국), 1810년(카우아이섬까지 어우러진 때)으로 갈린다. 카우아이섬과 니하우섬은 1810년에야 하나로 묶였다(「카메하메하 1세의 하와이 통일과 카우무알리이(1810~1819)」(뒤의 사건)). 하와이섬 알리이 누이의 자리는 칼라니오푸우에서 아들 키와라오를 거쳐 카메하메하에게 넘어갔고, 카메하메하는 1819년 5월 8일 또는 14일에 죽었는데 문서마다 날이 다르다."
  subjects: [hawaiian-chiefdoms, hawaiian-kingdom]
  tags: [politics, war]
  sources: ["위키백과 영어판 Kamehameha I", "위키백과 영어판 Hawaiian Kingdom", "위키백과 한국어판 카메하메하 1세"]

- id: botany-bay-1786
  year: 1786
  endYear: 1787
  title:
    ko: "영국의 보타니만 식민 결정과 제1함대 출항(1786~1787)"
  summary:
    ko: "영국은 죄수를 보내던 북아메리카 식민지를 미국 독립으로 잃은 뒤 다른 이송지가 필요해졌다. 위키백과 영어판은 태평양에서 프랑스의 팽창을 막을 기지가 필요했다는 이유도 든다. 앞서 1783년 8월 제임스 마트라가 정착을 제안했고 조지프 뱅크스가 그해 7월 도움을 약속한 일이 있었는데, 이 둘이 보타니만 식민 계획의 앞선 제안으로 꼽힌다. 보타니만은 「제임스 쿡의 1차 항해: 뉴질랜드와 오스트레일리아 동해안(1769~1771)」(앞의 사건)에서 쿡이 1770년 닿은 곳이다. 1786년 8월 내무 장관 시드니 경(토머스 타운센드)이 이곳에 죄수 식민지를 세우기로 했고, 그해 9월 아서 필립이 함대 사령관으로 임명되어 식민지가 서면 총독이 되기로 했다. 함대는 1787년 5월 13일 포츠머스를 떠났다. 배는 열한 척으로, 해군의 시리우스호와 서플라이호, 물자선 셋(골든그로브·피시번·보로데일), 죄수 수송선 여섯(알렉산더·샬럿·프렌드십·레이디 펜린·프린스 오브 웨일스·스카버러)이었다. 몰리 길런의 값으로 배에 오른 사람은 1,420명이고 그 가운데 죄수는 남자 582명과 여자 193명, 해병이 247명, 선원이 323명이었다. 시드니 경의 이름은 뒷날 도시 시드니의 이름이 되었다. 이 계획을 짜는 자리에 땅의 주인인 오스트레일리아 원주민은 없었다. 영국 쪽이 이 땅을 주인 없는 땅으로 보았다는 서술이 있으나 '테라 눌리우스'라는 법 개념은 뒤에 쓰인 말이어서 학설이 갈리며, 1992년 오스트레일리아 고등법원의 마보 판결이 이 생각을 부정했다. 배의 도착은 「제1함대와 뉴사우스웨일스 식민지(1788~1792)」(뒤의 사건)에서 다룬다."
  subjects: [aboriginal-australians]
  tags: [politics, colonization]
  sources: ["위키백과 영어판 First Fleet(몰리 길런의 값 인용)", "위키백과 영어판 Botany Bay", "위키백과 영어판 Arthur Phillip", "Mollie Gillen, The Founders of Australia: A Biographical Dictionary of the First Fleet (Library of Australian History, 1989)"]
