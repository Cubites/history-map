# 아메리카 사건 1묶음 갈래 05b(am-05b): 독립 전쟁과 새 나라들 — 스페인령 아메리카의 독립(아르헨티나·칠레·그란콜롬비아·멕시코·중앙아메리카·페루·볼리비아)·브라질 제국·우루과이·아이티의 섬 통일과 도미니카 공화국·먼로 독트린·플로리다 인계·포클랜드·눈물의 길·텍사스·캐나다 연합·오리건 조약·멕시코–미국 전쟁 (1816 ~ 1849년)
# 범위: 리오데라플라타 연합주와 칠레의 독립·시스플라티나(동방 연안) 점령과 우루과이의 독립·세븐오크스와 모피 회사 합병·보야카와 그란콜롬비아·애덤스–오니스 조약·이괄라 계획과 멕시코 제1제국·중앙아메리카의 독립과 연방공화국·페루와 볼리비아의 독립·브라질 제국의 독립·히스파니올라 통일과 도미니카 공화국·먼로 독트린과 러시아령 아메리카 경계·그란콜롬비아의 해체·포클랜드 제도·인디언 이주법과 눈물의 길·브라질 섭정기·텍사스 혁명과 공화국·페루–볼리비아 연합 전쟁·캐나다 연합법·중앙아메리카 연방의 해체·오리건 조약과 밴쿠버섬 식민지·멕시코–미국 전쟁(사건 21개).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 독립 사건 하나가 여러 나라의 탭 칸을 채우므로 본문에 그 나라 항목 이름을 모두 적었다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 저장소 기존 표기를 따랐다. 이름만 바뀐 나라는 그때 이름으로 쓰고 항목 이름을 함께 적었다
#   (리오데라플라타 연합주(지금 아르헨티나), 누에바그라나다 공화국(지금 콜롬비아), 멕시코 제국(1822~1823, 같은 나라 멕시코), 중앙아메리카 연합주(뒤에 연방공화국), 포르투갈령 브라질→브라질 제국(1822년부터)).
#   같은 이름이 나라·지역·도시로 겹치는 말(과테말라 총사령부와 과테말라시티, 산토도밍고 총사령부와 산토도밍고 시, 페루 부왕령과 페루)은 처음에 꼬리까지 밝혔다. 사망자·이주민은 범위와 추산으로 적었다.
#   분쟁과 학살(눈물의 길, 노예제와 노예 무역, 텍사스와 멕시코가 다툰 경계, 포클랜드 주권)은 일어난 일과 숫자만 적고 어느 쪽 시각도 따르지 않았다. 원주민은 부족 이름으로 적고 '인디언'은 법 이름(인디언 이주법·인디언 준주)에서만 썼다.
# 지도 결정과의 관계: 부왕령 묶음은 구성 단위별 항목으로 두고 글에서 묶음을 말했다. 텍사스 공화국만 따로 항목으로 두었고 누에시스강~리오그란데강 분쟁 땅은 사실대로 '경계를 두고 다툰 땅'으로 적었다.
#   오리건 컨트리의 공동 점유(1818~1846)와 미국·원주민 조약의 땅은 글에만 사실대로 적었다. 페루–볼리비아 연합·리우그란지두술 공화국·짧은 정권은 글로만 적었다. 승인되지 않은 선언과 일방적 독립은 승인 여부를 사실대로 적었다.
# 한국사와 닿는 점: 이 갈래에는 없다(한국사 파일은 고치지 않는다). 하와이는 이 갈래 몫이 아니다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(5월 혁명과 파라과이의 독립(1810~1811), 아이티의 남북 분열과 크리스토프의 북부 왕국(1806~1820)). 같은 파일 안의 사건끼리도 「」로 가리켰다.

- id: argentina-chile-independence-1816
  year: 1816
  endYear: 1818
  title:
    ko: "투쿠만 의회와 안데스 횡단: 아르헨티나·칠레의 독립(1816~1818)"
  summary:
    ko: "1816년 3월부터 투쿠만에서 모인 의회는 7월 9일 남아메리카 연합주의 독립을 선언했고, 며칠 뒤 선언문에 모든 외국 지배에서 벗어난다는 구절을 더했다. 부에노스아이레스가 이끈 이 나라는 옛 리오데라플라타 부왕령의 뒤를 이은 리오데라플라타 연합주(지금 아르헨티나)로, 상페루와 파라과이는 이미 떨어져 나가 있었다(「5월 혁명과 파라과이의 독립(1810~1811)」(앞의 사건)). 독립 선언 뒤 의회가 뽑은 최고 지도자 후안 마르틴 데 푸에이레돈(1816~1819)은 쿠요 지방 총독 호세 데 산마르틴에게 군대를 맡겨 안데스 너머 칠레의 왕당파를 치게 했다. 칠레의 애국파는 1814년 란카과 전투에서 져 산맥을 넘어 피신해 있었고, 산마르틴은 3년 가까이 멘도사에서 군대와 보급을 갖추었다. 산마르틴은 1817년 1월 산맥을 넘어 2월 12일 차카부코에서 이겼고, 칠레인 베르나르도 오히긴스가 칠레의 최고 지도자(1817~1823)가 되었다. 1818년 2월 12일 오히긴스가 독립을 선언해 칠레 총사령부는 칠레로 이어졌다. 3월 칸차라야다에서 졌으나 4월 5일 마이푸 전투에서 이겨 칠레의 독립이 굳었다. 칠레는 영국 출신 토머스 코크레인 제독을 맞아 해군을 꾸렸고, 이 함대는 1820년 산마르틴의 군대를 페루로 실어 날랐다(「산마르틴의 리마 입성에서 아야쿠초까지: 페루·볼리비아의 독립(1821~1825)」(뒤의 사건)). 왕당파의 근거지는 리마의 페루 부왕령에 남아 있었다. 푸에이레돈의 뒤를 이은 호세 론도(1819~1820)가 1820년 2월 세페다 전투에서 져 물러나자 연합주의 중앙 정부는 무너졌고 각 주가 따로 정부를 꾸렸다. 1819년 중앙집권 헌법은 연방주의 지방의 반발만 샀다."
  subjects: [argentina, chile, rio-de-la-plata-viceroyalty, chile-captaincy-general, peru-viceroyalty]
  links:
    - { from: argentina, to: rio-de-la-plata-viceroyalty, note: "투쿠만 의회가 독립을 선언 (1816-07-09)" }
    - { from: chile, to: chile-captaincy-general, note: "오히긴스가 독립을 선언 (1818-02-12)" }
  tags: [war, politics]
  sources: ["John Lynch, The Spanish American Revolutions 1808–1826 (W. W. Norton, 2nd ed., 1986)", "John Lynch, San Martín: Argentine Soldier, American Hero (Yale University Press, 2009)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: cisplatine-uruguay-1816
  year: 1816
  endYear: 1828
  title:
    ko: "포르투갈의 동방 연안 점령과 우루과이의 독립(1816~1828)"
  summary:
    ko: "리오데라플라타 강 동쪽의 동방 연안(반다오리엔탈)은 호세 헤르바시오 아르티가스가 이끄는 연방주의 세력이 부에노스아이레스와 따로 움직이던 땅이었다. 아르티가스는 1815년 엔트레리오스·코리엔테스·산타페 등을 묶은 자유 주민 연맹의 보호자가 되었고, 주인 없는 땅과 반대파의 땅을 가난한 농민·원주민·자유 흑인과 혼혈에게 나누어 주는 토지 규정을 내렸다. 포르투갈 왕 주앙 6세는 궁정이 있던 리우데자네이루에서 1816년 군대를 보내 이곳을 쳤고, 1817년 1월 20일 몬테비데오를 차지했다. 아르티가스는 1820년 타쿠아렘보 전투에서 져 파라과이로 망명했다. 1821년 7월 31일 몬테비데오 시의회가 포르투갈령 브라질 안의 시스플라티나주로 편입하기로 결의했고, 브라질 제국이 독립한 뒤에도 이 땅은 제국에 속했다. 1825년 4월 19일 후안 안토니오 라바예하가 이끈 33인의 동방인이 아그라시아다에 상륙해 봉기했고 브라질 쪽에 있던 프룩투오소 리베라도 곧 합류했다. 8월 25일 플로리다 의회는 1821년의 편입을 무효로 하고 브라질에서 떨어져 리오데라플라타 연합주(지금 아르헨티나)와 합친다고 선언했다. 브라질이 12월 10일 전쟁을 선포해 시스플라티나 전쟁이 시작되었는데, 브라질 함대가 부에노스아이레스 항을 봉쇄해 무역이 막히자 연합주도 평화로 기울었다. 육지에서는 1827년 무렵 승패가 갈리지 않았고 바다에서는 브라질이 앞섰다. 영국이 중재에 나서 1828년 8월 27일 예비 강화 조약이 맺어졌고, 이 땅은 브라질에도 아르헨티나에도 속하지 않는 독립 국가 우루과이가 되었다. 1830년 헌법이 정해져 프룩투오소 리베라가 첫 대통령이 되었다."
  subjects: [uruguay, portuguese-brazil, brazil, argentina, uk]
  links:
    - { from: portuguese-brazil, to: uruguay, note: "동방 연안을 점령 (1817-01-20)" }
    - { from: brazil, to: uruguay, note: "예비 강화 조약으로 독립을 인정 (1828-08-27)" }
  tags: [war, politics]
  sources: ["John Lynch, The Spanish American Revolutions 1808–1826 (W. W. Norton, 2nd ed., 1986)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)", "Leslie Bethell (ed.), The Independence of Latin America (Cambridge University Press, 1987)"]

- id: fur-trade-merger-1816
  year: 1816
  endYear: 1821
  title:
    ko: "세븐오크스 사건과 모피 회사의 합병, 북서부 영토(1816~1821)"
  summary:
    ko: "허드슨 베이 회사는 1670년 영국 왕에게서 받은 헌장으로 허드슨만으로 흘러드는 물이 모이는 땅 루퍼츠랜드의 교역을 독점한다고 주장했으나, 그 안에서 영국 왕실의 행정이 미친 곳은 교역소 몇 곳뿐이었다. 몬트리올 상인들이 세운 노스웨스트 회사가 서쪽 내륙으로 파고들어 교역이 겹치자 두 회사는 격하게 다투었다. 허드슨 베이 회사의 대주주 셀커크 백작 토머스 더글러스는 1811년 레드강 일대의 땅을 허가받아 스코틀랜드 이주민을 보냈는데, 1814년 레드강 정착지 총독이 내린 식량 반출 금지령은 메티스가 말린 들소 고기 페미컨을 팔아 살던 길을 막았고, 이 정착지는 노스웨스트 회사의 내륙 교역로를 가로막았다. 원주민과 유럽인 사이에서 태어나 사냥과 교역으로 살던 메티스는 이를 자신들의 땅에 대한 침입으로 받아들였다. 1816년 6월 19일 세븐오크스에서 회사 총독 로버트 셈플과 회사 직원·이주민 스무 명 남짓이 메티스 무리에게 죽었고, 셀커크는 보복으로 노스웨스트 회사의 윌리엄 요새를 차지해 다툼은 법정으로 번졌다. 영국 정부가 나서 1821년 두 회사를 합치게 했고, 합친 회사는 허드슨 베이 회사의 이름을 지켰고 북부 지역 총독은 조지 심프슨이 맡았다. 영국 의회는 합병 회사에 루퍼츠랜드 밖 서북쪽 땅에서도 교역을 독점할 허가를 주었는데, 이 땅이 북서부 영토다. 한편 영국과 미국은 1818년 협약으로 레이크오브더우즈에서 로키산맥까지 북위 49도선을 국경으로 삼고, 그 서쪽 오리건 컨트리는 처음 10년을 함께 쓰기로 했다. 이 넓은 땅의 주인은 어디까지나 원주민 여러 민족이었고, 영국의 지배는 회사 교역소를 통한 명목에 가까웠다."
  subjects: [north-western-territory, ruperts-land, uk, usa]
  links: []
  tags: [economy, society]
  sources: ["E. E. Rich, The Fur Trade and the Northwest to 1857 (McClelland and Stewart, 1967)", "John S. Galbraith, The Hudson's Bay Company as an Imperial Factor, 1821–1869 (University of California Press, 1957)"]

- id: boyaca-gran-colombia-1819
  year: 1819
  endYear: 1822
  title:
    ko: "보야카 전투와 그란콜롬비아의 성립(1819~1822)"
  summary:
    ko: "1819년 시몬 볼리바르는 베네수엘라 동부 평원에서 안데스를 넘어 누에바그라나다 부왕령 땅으로 들어갔다. 우기에 불어난 강과 평원을 지난 행군에는 산탄데르의 부대와 영국·아일랜드 지원병으로 이루어진 군단이 함께했다. 2월 앙고스투라 의회에서 베네수엘라와 누에바그라나다를 하나로 묶자고 연설한 그는 7월 높은 고개를 넘는 행군 끝에 8월 7일 보야카 다리 근처에서 호세 마리아 바레이로 대령이 이끈 왕당군을 무너뜨렸다. 바레이로는 포로가 되었고 부왕 후안 데 사마노는 보고타를 버리고 달아났다. 이어 12월 17일 앙고스투라 의회는 기본법으로 베네수엘라·누에바그라나다·키토 세 지방을 묶어 콜롬비아 공화국(역사에서는 그란콜롬비아라 부른다)을 세우고 볼리바르를 대통령으로 뽑았다. 옛 베네수엘라 총사령부 땅도 이 나라에 들어갔으나 스페인군은 곳곳에 남았다. 카르타헤나가 1821년 10월 항복했고 마라카이보와 푸에르토카베요가 1823년에 떨어져서야 스페인의 마지막 거점이 사라졌다. 1821년 6월 24일 카라보보 전투에서 베네수엘라의 왕당군이 꺾였고, 쿠쿠타 의회가 8월 30일 헌법을 정해 보고타를 수도로 삼았으며 볼리바르를 대통령, 프란시스코 데 파울라 산탄데르를 부통령으로 뽑았다. 의회는 노예의 자식을 자유인으로 하는 법도 만들었고, 볼리바르가 남쪽 전쟁터로 나간 동안 정부는 산탄데르가 맡았다. 1822년 5월 24일 안토니오 호세 데 수크레가 피친차 전투에서 이겨 키토를 얻었고, 7월 과야킬도 합쳐져 지금 에콰도르 땅이 그란콜롬비아에 들어왔다. 피친차 전투에는 산마르틴이 페루에서 보낸 지원 병력도 함께했고, 1821년 11월 스페인에서 떨어져 나온 파나마도 이 나라에 합류해 있었다."
  subjects: [gran-colombia, new-granada-viceroyalty, venezuela-captaincy-general]
