  sources: ["Roderick J. Barman, Brazil: The Forging of a Nation, 1798–1852 (Stanford University Press, 1988)", "Boris Fausto, A Concise History of Brazil (Cambridge University Press, 1999)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: hispaniola-unification-1822
  year: 1822
  endYear: 1844
  title:
    ko: "아이티의 히스파니올라 통일과 도미니카 공화국의 독립(1822~1844)"
  summary:
    ko: "스페인이 되찾은 산토도밍고 총사령부는 1821년 말 호세 누녜스 데 카세레스가 스페인 지배에서 벗어나 독립을 선언했으나, 새 나라는 몇 달 버티지 못했다. 아이티 대통령 장피에르 부아예는 1820년 북부 왕국을 흡수해 아이티를 통일한 데 이어(「아이티의 남북 분열과 크리스토프의 북부 왕국(1806~1820)」(앞의 사건)) 섬 전체를 하나로 한다며 1만 명 안팎의 병력으로 1822년 2월 9일 산토도밍고에 들어갔고, 산토도밍고 총사령부는 아이티에 합쳐졌다. 섬의 서쪽은 프랑스어와 크레올어, 동쪽은 스페인어를 쓰며 살아온 땅이었다. 아이티는 이때 동쪽의 노예제를 없앴으나 아이티 정부의 세금과 토지 정책, 스페인어 사용자와 가톨릭 교회 재산에 대한 간섭은 동쪽 주민의 반감을 샀다. 산토도밍고의 대학이 문을 닫고 스페인어를 쓰던 지배층 상당수가 쿠바·푸에르토리코·베네수엘라로 떠났다. 1825년 프랑스가 독립을 승인하는 대가로 1억 5천만 프랑의 배상금을 요구하자(1838년 9천만 프랑으로 줄었다) 그 부담은 세금으로 섬 전체에 돌아갔다. 후안 파블로 두아르테는 1838년 7월 16일 비밀 결사 라트리니타리아를 만들었고 같은 날 라몬 마티아스 메야와 프란시스코 델 로사리오 산체스가 합류해 독립을 준비했고, 1843년 부아예가 쫓겨난 뒤 샤를 리비에르에라르가 집권하자 두아르테는 망명했다. 1844년 2월 27일 도미니카인들이 산토도밍고의 푸에르타 델 콘데 요새를 차지해 독립을 선언했고 이튿날 아이티 수비대가 항복했다. 목장주 페드로 산타나가 이 봉기에 합류했고, 그해 11월 헌법을 정한 도미니카 공화국의 첫 대통령이 되었다. 아이티는 이후에도 여러 차례 군대를 보내 도미니카 공화국과 싸웠다."
  subjects: [dominican-republic, haiti, santo-domingo-captaincy]
  links:
    - { from: haiti, to: santo-domingo-captaincy, note: "산토도밍고에 입성해 섬을 통일 (1822-02-09)" }
    - { from: dominican-republic, to: haiti, note: "독립을 선언 (1844-02-27)" }
  tags: [politics, war]
  sources: ["Frank Moya Pons, The Dominican Republic: A National History (Markus Wiener Publishers, 1995)", "David Nicholls, From Dessalines to Duvalier: Race, Colour and National Independence in Haiti (Cambridge University Press, 1979)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: monroe-doctrine-1823
  year: 1823
  endYear: 1825
  title:
    ko: "먼로 독트린과 러시아령 아메리카의 경계 조약(1823~1825)"
  summary:
    ko: "스페인령 아메리카가 잇따라 독립하자 1822년 미국 대통령 제임스 먼로는 의회에 보내는 글에서 독립한 나라들의 승인을 권했고, 이어 콜롬비아·멕시코·칠레 등이 승인을 받았다. 한편 유럽에서는 신성 동맹의 나라들이 혁명을 누르려 한다는 걱정이 퍼졌고, 영국 외무 장관 조지 캐닝은 1823년 미국에 공동 성명을 내자고 했다. 미국은 단독으로 하는 길을 택했는데, 이를 뒷받침할 해군력이 모자라 실제로는 영국 해군의 힘에 기댄 선언이었다. 1823년 12월 2일 먼로가 의회에 낸 일곱 번째 연두 교서에는 유럽이 아메리카의 독립국을 식민지로 삼으려 하면 미국의 안전을 위협하는 일로 보겠다는 구절이 들어 있었다. 교서를 주로 쓴 사람은 국무 장관 존 퀸시 애덤스였고, 먼로 독트린이라는 이름은 1850년에야 붙었다. 이 일의 또 다른 계기는 러시아였다. 러시아-아메리카 회사가 있는 러시아령 아메리카는 1821년 황제의 칙령으로 북위 51도 북쪽 해안에서 100마일 안 바다에 외국 배가 들어오지 못하게 하겠다고 선언해 영국과 미국의 반발을 샀다. 러시아는 1824년 미국과 맺은 조약으로 북위 54도 40분 아래로는 정착하지 않기로 했고, 1825년 영국과 맺은 협약으로 이 위도의 섬 남쪽 끝에서 포틀랜드 해협과 해안 산마루를 따라 서경 141도선까지 이어지는 경계를 정해 알래스카 남동부 해안 띠를 러시아령으로 굳혔다. 쿠바와 푸에르토리코는 스페인령으로 남았고, 라틴아메리카 나라들이 모인 1826년 파나마 회의에 미국 대표단은 제때 닿지 못했다. 러시아령 아메리카 안쪽의 대부분은 틀링깃 등 토착 민족이 살던 곳이었고 러시아의 지배는 해안 교역소에 한정되어 있었다."
  subjects: [usa, russian-america, russia, uk]
  links: []
  tags: [diplomacy, politics]
  sources: ["Ernest R. May, The Making of the Monroe Doctrine (Harvard University Press, 1975)", "James E. Lewis Jr., The American Union and the Problem of Neighborhood: The United States and the Collapse of the Spanish Empire, 1783–1829 (University of North Carolina Press, 1998)", "S. Frederick Starr (ed.), Russia's American Colony (Duke University Press, 1987)"]

- id: gran-colombia-breakup-1828
  year: 1828
  endYear: 1831
  title:
    ko: "그란콜롬비아–페루 전쟁과 그란콜롬비아의 해체(1828~1831)"
  summary:
    ko: "1826년 4월 30일 호세 안토니오 파에스가 베네수엘라에서 보고타 정부에 맞서 일어난 라코시아타는 그란콜롬비아의 균열을 드러냈다. 1828년 4월 열린 오카냐 의회에서는 중앙집권을 바라는 시몬 볼리바르 쪽과 연방제를 바라는 쪽이 갈려 두 달 만에 아무 결론 없이 끝났고, 8월 27일 볼리바르는 독재권을 쥐었다. 9월 25일 암살 시도가 일어나 부통령이었던 프란시스코 데 파울라 산탄데르가 사형을 선고받았다가 추방으로 줄었다. 같은 무렵 페루가 과야킬과 하엔, 마이나스를 요구하며 맞서 1828~1829년 그란콜롬비아–페루 전쟁이 일어났고, 안토니오 호세 데 수크레는 1829년 2월 27일 타르키에서 페루군을 이겼으나 기병이 큰 손실을 입어 진격이 멈췄고, 9월 22일 과야킬 조약으로 전쟁이 끝났다. 1830년 5월 4일 볼리바르가 대통령에서 물러나 호아킨 모스케라가 뒤를 이었고, 베네수엘라(5월 6일 발렌시아 의회, 파에스)와 에콰도르(5월 13일 키토 일대 남부 지구, 후안 호세 플로레스)가 잇따라 따로 나라를 세웠다. 6월 4일 수크레가 암살당했고 9월에는 라파엘 우르다네타가 쿠데타로 정부를 잡았다. 볼리바르는 5월 보고타를 떠나 유럽으로 가려 했으나 병이 깊어져 12월 17일 산타마르타 가까이에서 죽었다. 1831년 4월 도밍고 카이세도가 우르다네타의 뒤를 이었고, 11월 21일 그란콜롬비아가 법적으로 폐지되었다. 호세 마리아 오반도의 임시 정부를 거쳐 1832년 3월 산탄데르가 누에바그라나다 공화국(지금 콜롬비아)의 대통령이 되었다. 그란콜롬비아는 지금의 콜롬비아·베네수엘라·에콰도르·파나마 땅에 걸쳐 있었다."
  subjects: [gran-colombia, venezuela, ecuador, colombia, peru]
  links:
    - { from: venezuela, to: gran-colombia, note: "발렌시아 의회가 따로 나라를 세움 (1830-05-06)" }
    - { from: ecuador, to: gran-colombia, note: "키토 일대 남부 지구가 분리를 선언 (1830-05-13)" }
    - { from: colombia, to: gran-colombia, note: "누에바그라나다 공화국으로 이어짐 (1831-11-21)" }
  tags: [politics, war]
  sources: ["David Bushnell, The Making of Modern Colombia: A Nation in Spite of Itself (University of California Press, 1993)", "John Lynch, Simón Bolívar: A Life (Yale University Press, 2006)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: falklands-1829
  year: 1829
  endYear: 1833
  title:
    ko: "베르네의 정착지와 영국의 포클랜드 재장악(1829~1833)"
  summary:
    ko: "포클랜드 제도(스페인어 이름 말비나스)는 18세기에 프랑스·영국·스페인이 차례로 정착지를 세웠던 땅으로, 스페인 수비대는 1811년 떠났다. 1820년 11월 6일 리오데라플라타 연합주(지금 아르헨티나)에서 온 사략선장 데이비드 주엣이 푸에르토솔레다드에서 연합주의 깃발을 올리고 섬들의 영유를 선언했다. 1823년 부에노스아이레스 주는 동포클랜드의 땅을 호르헤 파체코에게 주었고, 그의 사업이 실패하자 상인 루이 베르네가 이를 이어받아 물개와 야생 소를 잡아 팔며 1828년 식민지를 세우고 푸에르토루이스라 불렀다. 1829년 부에노스아이레스는 베르네를 섬들의 군·민정 사령관으로 임명했고 영국은 이에 항의했으나 베르네는 사업을 이어 갔다. 1831년 베르네가 미국 물개잡이 배들을 붙잡자 미국 군함 렉싱턴호가 푸에르토루이스를 습격했고, 선장은 섬들이 주인 없는 땅이라고 선언했다. 1833년 1월 2일 영국 군함 클리오호가 닿아 선장 제임스 온슬로가 아르헨티나 깃발을 내리라고 요구했고, 연합주 지휘관 호세 마리아 피네도는 1월 5일 항의하며 섬을 떠났다. 그해 8월 가우초 안토니오 리베로가 이끈 반란으로 영국인 몇 명이 죽었으나 곧 진압되었다. 섬의 이름은 영국이 쓰는 포클랜드와 아르헨티나가 쓰는 말비나스로 갈린다. 이후 영국이 섬을 계속 다스려 1841년 민간 총독을 보냈고 영국계 정착민이 늘었다. 영국이 무엇을 노렸는지는 남대서양 항로의 기지를 얻으려 했다는 해석이 있다. 아르헨티나는 스페인에서 물려받은 권리를 내세워 1833년의 점거가 힘으로 이루어진 불법이라고 항의해 왔고, 영국은 섬 주민의 뜻을 근거로 든다."
  subjects: [falkland-islands, argentina, uk, usa]
  links:
    - { from: uk, to: falkland-islands, note: "군함을 보내 섬을 다시 차지 (1833-01)" }
  tags: [diplomacy, politics]
  sources: ["Peter J. Beck, The Falkland Islands as an International Problem (Routledge, 1988)", "Lawrence Freedman, The Official History of the Falklands Campaign, vol. 1: The Origins of the Falklands War (Routledge, 2005)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: trail-of-tears-1830
  year: 1830
  endYear: 1839
  title:
    ko: "인디언 이주법과 눈물의 길(1830~1839)"
  summary:
    ko: "미국 남동부에는 체로키·촉토·크리크·치카소·세미놀 다섯 민족이 오래 살아 왔고, 이 가운데에는 문자와 헌법을 만들고 농장을 가꾸는 민족도 있었다. 체로키는 세쿼이아가 만든 문자를 1820년대에 널리 썼고 1827년 헌법을 정했다. 그러나 면화 농업이 퍼지고 1829년 조지아에서 금이 발견되자 백인 이주민과 주 정부는 이들의 땅을 요구했다. 1830년 5월 28일 대통령 앤드루 잭슨이 서명한 인디언 이주법은 의회에서 하원 102 대 97, 상원 28 대 19로 겨우 통과되었고, 이들을 땅 교환의 형식으로 미시시피강 서쪽 인디언 준주(지금 오클라호마 일대)로 옮기게 했으나 실제로는 압박 속에서 이루어졌다. 연방 대법원은 1832년 우스터 대 조지아 사건에서 조지아가 체로키 땅에 주 법을 적용할 수 없다고 판결했으나 잭슨은 이를 집행하지 않았다. 촉토는 1831년 가을부터 겨울 추위와 질병 속에서 길을 떠나 이 길을 눈물과 죽음의 길이라 불렀고, 이주는 1836년까지 이어졌다. 크리크는 1834~1837년, 치카소는 1837~1847년에 걸쳐 옮겨졌고, 세미놀은 제2차 세미놀 전쟁(1835~1842) 속에서 일부가 끝까지 남았다. 체로키 가운데 소수파가 1835년 12월 29일 뉴에코타 조약에 서명했는데 대표 존 로스는 서명하지 않았다. 이 조약에 근거해 마틴 밴 뷰런 정부 아래 1838년 5월부터 체로키 1만 3천~1만 6천 명쯤이 강제로 옮겨져 겨울에 걸친 긴 길을 걸었고, 죽은 이는 추산 4천~8천 명이다. 다섯 민족 전체로는 1830~1850년 약 6만 명이 옮겨졌고 사망은 1만 3천~1만 7천 명으로 추산한다. 이 길은 눈물의 길로 기억된다."
  subjects: [usa]
  links: []
  tags: [society, politics]
  sources: ["Anthony F. C. Wallace, The Long, Bitter Trail: Andrew Jackson and the Indians (Hill and Wang, 1993)", "Theda Perdue, Michael D. Green, The Cherokee Removal: A Brief History with Documents (Bedford/St. Martin's, 3rd ed., 2016)", "Daniel Walker Howe, What Hath God Wrought: The Transformation of America, 1815–1848 (Oxford University Press, 2007)"]

- id: regency-brazil-1831
  year: 1831
  endYear: 1845
  title:
    ko: "섭정기 브라질의 반란과 페드루 2세의 친정(1831~1845)"
  summary:
    ko: "1831년 4월 7일 페드루 1세가 다섯 살 된 아들 페드루 2세에게 황제 자리를 물려주고 포르투갈로 떠나자(페드루 1세는 1834년 그곳에서 죽었다), 의회가 뽑은 섭정이 나라를 맡았다. 1834년 헌법 추가법이 지방 의회를 만들어 지방에 권한을 주었다. 삼두 섭정(1831~1835)과 신부 출신 디오구 안토니우 페이조(1835~1837), 페드루 지 아라우주 리마(1837~1840)가 차례로 섭정을 맡았다. 1831년 11월 7일 노예 수입을 금하는 법이 만들어졌으나 지켜지지 않아 밀수입이 이어졌다. 이 시기에는 지방의 반란이 잇따랐다. 파라에서는 1835년 오두막에 사는 가난한 주민과 원주민·혼혈이 카바나젱을 일으켜 1840년까지 싸웠고 수만 명이 죽었다는 추산이 있다. 남쪽 리우그란지두술에서는 1835년 파하포스 전쟁이 시작되어 1836년 9월 11일 안토니우 지 소자 네투가 리우그란지두술 공화국을 선포하고 반군 지도자 베투 곤살베스가 대통령으로 추대되었으며, 이 공화국은 10년 가까이 따로 정부를 유지했다. 바이아의 사비나다(1837~1838)와 마라냥의 발라이아다(1838~1841)도 일어났다. 반란을 누르려면 중앙 정부를 강하게 해야 한다는 목소리가 커졌고, 자유당 쪽이 성년 선포 운동을 이끌어 1840년 7월 23일 열네 살의 페드루 2세가 성년으로 선포되었고 1841년 7월 18일 대관했다. 1845년 3월 평화 협정으로 파하포스 전쟁이 끝났다. 한편 북쪽 국경에서는 프랑스령 기아나와 브라질이 오야포크강과 아라과리강 사이 땅을 두고 맞섰는데, 1841년 무렵 두 나라가 이 땅을 중립 지대로 두기로 했다. 이 땅의 넓이는 약 26만 km²로 어림된다."
  subjects: [brazil, french-guiana]
  links: []
  tags: [politics, society]
  sources: ["Roderick J. Barman, Brazil: The Forging of a Nation, 1798–1852 (Stanford University Press, 1988)", "Boris Fausto, A Concise History of Brazil (Cambridge University Press, 1999)", "Leslie Bethell, José Murilo de Carvalho (eds.), Brazil: Empire and Republic, 1822–1930 (Cambridge University Press, 1989)"]

- id: texas-revolution-1835
  year: 1835
  endYear: 1845
  title:
    ko: "텍사스 혁명과 텍사스 공화국(1835~1845)"
  summary:
    ko: "멕시코는 1820년대에 스티븐 오스틴 같은 이주 사업가에게 텍사스 땅을 맡겨 이주민을 받아들였고, 이주민 가운데에는 노예를 부리는 면화 농장주도 있었다. 이주민이 크게 늘자 멕시코 정부는 1830년 미국인의 이주를 막는 법을 만들었고, 연방제를 버리고 중앙집권으로 기울었다. 이에 텍사스의 앵글로계 이주민과 텍사스 태생 멕시코인(테하노)이 반발해, 1835년 10월 2일 곤잘레스에서 첫 충돌이 일어났다. 1836년 3월 2일 대표들이 독립을 선언했고 텍사스 헌법은 노예제를 인정했으며 3월 6일 알라모 요새가 안토니오 로페스 데 산타 안나의 군대에 함락되었으며 3월 27일에는 고리애드에서 포로 수백 명이 처형되어 텍사스인들을 더 격분시켰다. 후안 세긴 같은 일부 테하노는 텍사스 편에서 싸웠다. 4월 21일 새뮤얼 휴스턴이 샌재신토 전투에서 이겨 산타 안나를 사로잡았고, 5월 14일 벨라스코 조약으로 멕시코군이 물러났으나 멕시코는 조약도 독립도 인정하지 않았다. 텍사스 공화국은 1836년 9월 휴스턴을 대통령으로 뽑았고(임시 대통령은 데이비드 버넷), 1837년 3월 미국이 승인한 뒤 영국·프랑스 등도 승인했다. 미라보 라마르(1838~1841), 휴스턴(1841~1844), 앤슨 존스(1844~1846)가 이어 대통령을 맡았다. 공화국은 남쪽 경계를 리오그란데강이라 주장했으나 멕시코는 누에시스강이라 했고, 서쪽과 북쪽의 넓은 땅은 코만치족 등 원주민이 실제로 지배했다. 1845년 2월 미국 의회가 병합을 결의했고 10월 텍사스 유권자가 이를 받아들여 12월 29일 28번째 주가 되었으며, 정부는 1846년 2월 19일 넘어갔다."
  subjects: [texas-republic, mexico, usa]
  links:
    - { from: texas-republic, to: mexico, note: "독립을 선언해 분리 (1836-03-02)" }
    - { from: usa, to: texas-republic, note: "병합 (1845-12-29)" }
  tags: [war, politics]
  sources: ["Randolph B. Campbell, Gone to Texas: A History of the Lone Star State (Oxford University Press, 2003)", "Paul D. Lack, The Texas Revolutionary Experience: A Political and Social History, 1835–1836 (Texas A&M University Press, 1992)", "Gregg Cantrell, Stephen F. Austin: Empresario of Texas (Yale University Press, 1999)"]

- id: peru-bolivia-confederation-1836
  year: 1836
  endYear: 1843
  title:
    ko: "페루–볼리비아 연합 전쟁과 칠레의 마가야네스 점유(1836~1843)"
  summary:
    ko: "1830년대 페루는 오르베고소와 살라베리 같은 장군들이 서로 싸우는 내전으로 어지러웠다. 볼리비아 대통령 안드레스 데 산타 크루스는 1835년 오르베고소를 도와 병력을 보냈고, 이를 바탕으로 1836년 북페루 공화국·남페루 공화국·볼리비아 세 나라를 묶은 페루–볼리비아 연합을 세워 10월 28일 자신이 최고 보호관이 되었다. 칠레는 이 연합이 태평양 무역의 주도권을 쥐고 발파라이소 항이 칼야오 항에 밀리게 되리라고 걱정했고, 안데스의 힘의 균형을 깨뜨린다고 보았고, 칠레 정부의 실력자 디에고 포르탈레스가 이를 앞장서 반대했다. 1836년 12월 칠레 의회가 전쟁을 승인했고, 1837년 5월 후안 마누엘 데 로사스가 이끄는 아르헨티나 연맹도 볼리비아의 타리하 병합을 구실로 전쟁을 선포했다. 포르탈레스는 1837년 군인들의 반란으로 살해되었다. 아르헨티나 쪽 싸움은 북쪽 국경에서 이어졌으나 전쟁의 승패를 가르지는 못했다. 칠레가 보낸 첫 원정군은 1837년 11월 파우카르파타 조약으로 물러났으나 칠레 정부는 연합을 그대로 두는 이 조약을 거부했고, 마누엘 불네스가 이끈 두 번째 원정군에는 연합에 반대하는 페루 장군 아구스틴 가마라 같은 이들이 함께했다. 리마를 두고 공방이 이어지던 연합군은 1839년 1월 20일 융가이 전투에서 무너졌다. 산타 크루스는 그해 2월 물러나 에콰도르로 떠났고 8월 연합은 해체가 선언되었다. 전쟁에 이긴 칠레는 힘을 키워, 1843년 9월 21일 마젤란 해협에 불네스 요새를 세우고 마가야네스 일대를 점유했다. 원주민인 테우엘체·카웨스카르 등이 살던 이 땅에서 칠레는 이후 영토를 넓혀 나갔다."
  subjects: [peru, bolivia, chile, argentina]
  links: []
  tags: [war, politics]
  sources: ["The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)", "Simon Collier, William F. Sater, A History of Chile, 1808–2002 (Cambridge University Press, 2nd ed., 2004)", "Peter F. Klarén, Peru: Society and Nationhood in the Andes (Oxford University Press, 2000)"]

- id: canada-union-1837
  year: 1837
  endYear: 1841
  title:
    ko: "어퍼캐나다·로어캐나다 반란과 연합법(1837~1841)"
  summary:
    ko: "1791년 이래 영국령 캐나다는 영어 사용자가 많은 어퍼캐나다와 프랑스어 사용자가 대다수인 로어캐나다로 나뉘어 있었고, 두 곳 모두 총독과 임명된 위원회가 선출 의회보다 힘이 셌다. 로어캐나다에서는 루이조제프 파피노가 이끄는 애국당이 정치 개혁을 요구하다 1837년 11월 무장 봉기에 나서 23일 생드니에서는 영국군을 물리쳤으나 12월 생외스타슈에서 졌고, 12월 어퍼캐나다에서도 윌리엄 라이언 매켄지가 12월 5일 토론토 가까이에서 일어났다. 두 반란은 곧 진압되었으며 1838년의 두 번째 봉기도 실패해 로어캐나다에서 애국당원 열두 명이 처형되고 쉰여덟 명이 오스트레일리아로 보내졌다. 영국은 로어캐나다의 헌정을 멈추고 특별 위원회로 다스리게 한 뒤 1838년 더럼 백작을 총독으로 보냈다. 그는 반란자 처분 문제로 영국 정부와 부딪쳐 그해 사임했다. 그가 남긴 보고서는 두 식민지를 합치고 책임 정부를 도입하자고 권했으며, 프랑스계 주민을 역사도 문학도 없는 집단으로 보아 영어 사용 사회에 동화시키자는 주장도 담았다. 1840년 7월 23일 영국 의회가 연합법을 통과시켰고, 1841년 2월 10일 두 식민지가 합쳐 캐나다주(수도는 처음에 킹스턴)가 되었다. 두 지역의 의원 수를 같게 해 인구가 더 많은 로어캐나다의 몫을 줄였고 프랑스어는 의회 공용어에서 빠졌고, 프랑스계 주민은 이를 동화 정책으로 받아들여 반발했다. 이 조치는 1848년에야 없어졌다. 책임 정부는 처음에는 도입되지 않았으며 1848년 엘긴 총독이 볼드윈과 라퐁텐의 다수파에서 내각을 꾸리면서 자리 잡았다. 두 식민지는 캐나다주 안에서 캐나다 서부와 동부로 이어졌다."
  subjects: [province-of-canada, upper-canada, lower-canada, uk]
  links:
    - { from: uk, to: province-of-canada, note: "연합법으로 두 식민지를 합침 (1841-02-10)" }
  tags: [politics, war]
  sources: ["J. M. S. Careless, The Union of the Canadas: The Growth of Canadian Institutions, 1841–1857 (McClelland and Stewart, 1967)", "Phillip Buckner (ed.), Canada and the British Empire (Oxford University Press, 2008)", "Jean-Paul Bernard, Les Rébellions de 1837–1838 (Boréal Express, 1983)"]

- id: central-america-breakup-1838
  year: 1838
  endYear: 1841
  title:
    ko: "중앙아메리카 연방공화국의 해체(1838~1841)"
  summary:
    ko: "중앙아메리카 연방공화국은 1830년 프란시스코 모라산이 대통령이 되면서 자유주의 개혁을 밀어붙였다. 모라산은 1830~1834년과 1835~1839년 두 차례 연방 대통령을 지냈고 1834년 수도를 과테말라시티에서 엘살바도르의 산살바도르로 옮겼다. 모라산은 1829년 과테말라시티를 차지해 보수파 정부를 무너뜨렸고, 교회 재산과 특권을 줄이는 개혁은 가톨릭 교회와 보수파, 그리고 원주민·농민의 반발을 샀다. 1837년 콜레라가 과테말라를 휩쓸자 교회가 이를 개혁에 대한 벌이라 말했고, 혼혈 농민 라파엘 카레라가 이끈 반란이 번졌는데, 이 반란에는 콜레라 소문과 무거운 세금, 원주민 공동 토지에 대한 위협이 얽혀 있었다. 1838년 4월 30일 니카라과가 연방에서 갈라섰고, 5월 30일 연방 의회가 각 주가 스스로 갈라서는 것을 허용했다. 온두라스는 1838년 10월 이탈을 결의해 1839년까지 새 정부를 꾸렸고, 코스타리카는 11월 14일 갈라섰다. 과테말라는 카레라의 힘 아래 1839년 4월 17일 연방이 끝났다고 선포했다. 모라산은 임기를 마친 뒤 엘살바도르 주 정부를 맡아 싸웠으나 1840년 3월 과테말라시티 공격이 카레라에게 막혀 4월 망명했고, 1841년 1월 30일 엘살바도르가 독립 공화국을 선포했다. 연방은 한 나라로 다시 합치지 못했고, 모라산은 1842년 코스타리카에서 마지막으로 연방을 되살리려다 9월 15일 처형되었다. 갈라선 주들은 저마다 헌법과 군대를 가졌고 국경을 둘러싼 다툼이 잦았다. 다섯 나라는 이후 서로 합치려는 시도를 거듭했고, 모라산의 이름은 연방을 되살리려던 자유주의자들의 상징으로 남았다."
  subjects: [costa-rica, nicaragua, guatemala, honduras, el-salvador, central-american-federation]
