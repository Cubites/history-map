- id: adams-onis-1819
  year: 1819
  endYear: 1821
  title:
    ko: "애덤스–오니스 조약과 플로리다 인계(1819~1821)"
  summary:
    ko: "남아메리카의 반란에 힘이 묶인 스페인은 플로리다를 지킬 힘이 없었고, 미국은 국경을 넘나드는 세미놀족과 도망친 노예를 구실로 군대를 보냈다. 제1차 세미놀 전쟁(1817~1818) 중 앤드루 잭슨은 1818년 스페인령 플로리다로 들어가 펜서콜라를 점령했다. 국무 장관 애덤스는 잭슨의 행동을 감싸며 스페인이 플로리다를 지킬 수 없다면 넘기라고 압박했다. 스페인은 협상에 나서, 1819년 2월 22일 워싱턴에서 미국 국무 장관 존 퀸시 애덤스와 스페인 공사 루이스 데 오니스가 조약에 서명했다. 스페인은 동·서 플로리다를 미국에 넘겼고, 미국은 자국 시민이 스페인에 가진 청구권을 500만 달러까지 맡아 처리하는 한편 텍사스에 대한 요구를 거두었다. 두 나라의 경계는 사빈강 어귀에서 북위 32도선, 레드강, 서경 100도선, 아칸소강 수원, 북위 42도선을 따라 태평양까지 그어졌고, 선 남쪽은 누에바에스파냐 부왕령으로 남았으며 스페인은 선 북쪽 태평양 연안(오리건)에 대한 권리를 미국에 넘겼다. 이에 앞서 1818년 영미 협약은 루퍼츠랜드 남쪽 끝의 레드강 유역을 북위 49도선 아래라는 이유로 미국에 넘겼다(「세븐오크스 사건과 모피 회사의 합병, 북서부 영토(1816~1821)」(앞의 사건)). 미국 상원은 1819년 2월 24일 만장일치로 승인했으나 스페인 왕 페르난도 7세의 비준은 1820년 10월에야 나왔고, 조약은 1821년 2월 22일 발효해 7월 펜서콜라에서 인계가 이루어져 잭슨이 첫 준주 지사가 되었다. 플로리다는 세미놀 등 원주민이 살던 땅이기도 했지만 조약은 이들의 뜻을 묻지 않았다. 이 조약으로 미국의 땅은 멕시코만 연안까지 이어졌고, 태평양에 닿는 경계선이 문서에 처음 그려졌다."
  subjects: [spanish-florida, usa, spain, new-spain-viceroyalty, ruperts-land]
  links:
    - { from: spain, to: usa, note: "조약으로 플로리다를 넘김 (1819-02-22, 발효 1821-02-22)" }
  tags: [diplomacy, politics]
  sources: ["Philip Coolidge Brooks, Diplomacy and the Borderlands: The Adams–Onís Treaty of 1819 (University of California Press, 1939)", "Samuel Flagg Bemis, John Quincy Adams and the Foundations of American Foreign Policy (Alfred A. Knopf, 1949)", "Gordon S. Wood, Empire of Liberty: A History of the Early Republic, 1789–1815 (Oxford University Press, 2009)"]

- id: mexico-independence-1821
  year: 1821
  endYear: 1824
  title:
    ko: "이괄라 계획과 멕시코 제1제국(1821~1824)"
  summary:
    ko: "1820년 스페인에서 자유주의 혁명이 일어나 1812년 헌법이 되살아나자, 누에바에스파냐 부왕령의 보수파 지주와 성직자는 본국의 개혁이 자신들의 특권을 해칠까 걱정했다. 왕당군 장교 아구스틴 데 이투르비데는 남쪽 산악에서 싸우던 반란군 지도자 비센테 게레로와 손잡고 1821년 2월 24일 이괄라 계획을 내놓았다. 가톨릭 신앙, 독립, 스페인 태생과 멕시코 태생의 연합이라는 세 가지 보장을 내세우고 입헌 군주제를 약속했다. 앞서 1810년 미겔 이달고 신부가 일으킨 봉기는 이달고(1811)와 호세 마리아 모렐로스(1815)가 처형되면서 꺾여 게레로의 게릴라만 남아 있었다. 8월 24일 이투르비데는 새로 온 마지막 부왕 후안 오도노후와 코르도바 조약을 맺어 독립을 인정받았고, 9월 27일 삼보장군이 멕시코시티에 들어와 28일 독립 선언서가 나왔다. 유카탄 총사령부도 11월 2일 새 나라에 들어왔다. 스페인 의회는 조약을 받아들이지 않았고 왕위를 이을 부르봉 가문 사람도 오지 않아, 1822년 5월 이투르비데가 군중과 군의 추대로 아구스틴 1세 황제가 되어 7월 대관했다. 그러나 의회와 맞서다 1823년 초 안토니오 로페스 데 산타 안나가 과달루페 빅토리아와 함께 1823년 2월 1일 카사마타 계획으로 반기를 들자 3월 19일 퇴위하고 이탈리아로 망명했다. 니콜라스 브라보·과달루페 빅토리아·페드로 셀레스티노 네그레테 셋이 행정권을 맡았고, 1824년 10월 연방 헌법이 만들어져 빅토리아가 첫 대통령이 되었다. 유카탄은 뒤에 한때 따로 공화국을 세우기도 했다(1841~1848). 제국 시절의 멕시코는 이름만 달랐을 뿐 지금 멕시코와 같은 나라다."
  subjects: [mexico, new-spain-viceroyalty, yucatan-captaincy]
  links:
    - { from: mexico, to: new-spain-viceroyalty, note: "독립을 선언 (1821-09-28)" }
  tags: [politics, war]
  sources: ["Jaime E. Rodríguez O., The Independence of Spanish America (Cambridge University Press, 1998)", "Timothy E. Anna, The Mexican Empire of Iturbide (University of Nebraska Press, 1990)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: central-america-independence-1821
  year: 1821
  endYear: 1823
  title:
    ko: "중앙아메리카의 독립과 연방공화국의 성립(1821~1823)"
  summary:
    ko: "과테말라 총사령부는 지금의 과테말라·엘살바도르·온두라스·니카라과·코스타리카와 멕시코 남부 치아파스를 아우른 땅이었다. 멕시코에서 독립 운동이 번지자 1821년 9월 15일 과테말라시티의 지도자들은 총사령관이 이끈 모임에서 독립을 결의했다. 그러나 보수파는 멕시코와 합치기를 원했고, 1822년 1월 5일 합병이 선포되어 이 땅은 이투르비데의 멕시코 제국에 들어갔다. 엘살바도르는 합병에 맞서 싸웠으나 멕시코군에 눌렸다. 이투르비데가 1823년 3월 물러나자 멕시코 장군 비센테 필리솔라가 의회 소집을 허락했고, 엘살바도르 사제 호세 마티아스 델가도가 이끈 제헌 의회는 7월 1일 멕시코와 스페인 어느 쪽에서도 독립한다고 선언하고 중앙아메리카 연합주를 세웠다. 치아파스는 이에 들지 않고 1824년 멕시코에 합류했다. 1824년 4월에는 노예제를 없앴고, 11월 22일 연방 헌법이 만들어져 가톨릭을 국교로 삼은 중앙아메리카 연방공화국이 되었으며, 1825년 4월 첫 선거에서는 호세 세실리오 델 바예가 더 많은 표를 얻었으나 과반이 되지 못해 의회가 마누엘 호세 아르세를 첫 대통령으로 뽑았다. 수도는 과테말라시티에 두었고 옛 총사령부의 다섯 주가 저마다 의회와 헌법을 두고 연방을 이루었다. 주민 대부분은 원주민과 혼혈이었으나 연방 정부는 크리오요 지배층의 것이었고, 니카라과에서는 보수파의 그라나다와 자유파의 레온이 서로 다투었다. 연방 정부에는 과테말라의 상인과 지주의 입김이 셌고, 주마다 힘이 달랐으며 자유주의자와 보수주의자가 부딪쳐 1820년대 후반 첫 내전이 일어났다(시작 해는 1826~1828년으로 갈린다)(「중앙아메리카 연방공화국의 해체(1838~1841)」(뒤의 사건))."
  subjects: [central-american-federation, guatemala-captaincy, mexico]
  links:
    - { from: mexico, to: guatemala-captaincy, note: "합병을 선포해 제국에 편입 (1822-01-05)" }
  tags: [politics]
  sources: ["Ralph Lee Woodward Jr., Central America: A Nation Divided (Oxford University Press, 3rd ed., 1999)", "Héctor Pérez Brignoli, A Brief History of Central America (University of California Press, 1989)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Cambridge University Press, 1985)"]

- id: peru-bolivia-independence-1821
  year: 1821
  endYear: 1825
  title:
    ko: "산마르틴의 리마 입성에서 아야쿠초까지: 페루·볼리비아의 독립(1821~1825)"
  summary:
    ko: "페루 부왕령은 남아메리카 스페인 지배의 마지막 보루였다. 호세 데 산마르틴은 칠레에서 배로 병력을 실어 1820년 9월 페루 해안에 상륙했고, 부왕 호세 데 라 세르나가 1821년 7월 리마를 떠나자 28일 리마에서 독립을 선언했다. 산마르틴은 8월 3일 보호관이 되어 원주민의 공납을 없애고 이들을 페루인이라 부르게 하며 7월 28일 독립 선언 뒤에 태어난 노예의 자식을 자유인으로 한다는 법(8월 12일)을 내렸으나 왕당군은 안데스 산지에 남았고, 그는 1822년 7월 과야킬에서 시몬 볼리바르와 만났는데 두 사람이 무엇을 이야기했는지는 기록이 적어 학설이 갈린다. 산마르틴은 이 뒤 9월 20일 의회에서 물러나 페루를 떠났다. 그 뒤 호세 데 라 마르를 의장으로 한 최고위원회와 1823년 호세 데 라 리바 아궤로, 호세 베르나르도 데 타글레의 정부가 이어졌으나 정치는 흔들렸고, 페루 의회의 부름을 받은 볼리바르가 1824년 2월 독재관이 되었다. 그란콜롬비아 병력과 함께 진군한 볼리바르와 안토니오 호세 데 수크레는 8월 6일 후닌에서 총을 거의 쓰지 않은 기병전을 이겼고, 12월 9일 아야쿠초에서 수크레가 왕당군을 무너뜨려 부상한 부왕 라 세르나를 사로잡고 항복을 받았다. 이듬해 4월 상페루(알토페루)의 마지막 왕당파 지휘관이 죽어 페루 부왕령은 끝났다. 추키사카에서 열린 상페루 의회는 1825년 8월 6일 스페인은 물론 페루와 리오데라플라타 연합주 어느 쪽에도 속하지 않는 독립을 선언하고 나라 이름을 볼리바르를 기려 볼리비아로 정했고, 볼리바르는 이 나라의 헌법을 직접 써 보냈다(1826). 리마 앞 카야오 요새의 스페인군은 1826년 1월에야 항복했다."
  subjects: [peru, bolivia, peru-viceroyalty, gran-colombia]
  links:
    - { from: peru, to: peru-viceroyalty, note: "리마에서 독립을 선언 (1821-07-28)" }
    - { from: bolivia, to: peru-viceroyalty, note: "상페루 의회가 독립을 선언 (1825-08-06)" }
  tags: [war, politics]
  sources: ["John Lynch, The Spanish American Revolutions 1808–1826 (W. W. Norton, 2nd ed., 1986)", "Peter F. Klarén, Peru: Society and Nationhood in the Andes (Oxford University Press, 2000)", "Herbert S. Klein, A Concise History of Bolivia (Cambridge University Press, 2nd ed., 2011)"]

- id: brazil-independence-1822
  year: 1822
  endYear: 1825
  title:
    ko: "이피랑가의 외침과 브라질 제국의 독립(1822~1825)"
  summary:
    ko: "1808년 리우데자네이루로 옮겨 온 포르투갈 왕실이 1815년 12월 16일 브라질을 왕국으로 높였다(「포르투갈 왕실의 브라질 이전과 브라질 왕국(1808~1815)」(앞의 사건)). 그러나 1820년 포르투에서 자유주의 혁명이 일어나 의회가 왕의 귀국과 브라질의 옛 식민 지위 복귀를 요구했고, 주앙 6세는 1821년 귀국하면서 아들인 왕세자 페드루를 브라질 섭정으로 남겼다. 리스본 의회가 페드루에게도 귀국을 명하자 1822년 1월 9일 페드루는 머물겠다고 선언했고, 9월 7일 이피랑가 강가에서 독립을 외쳤다. 10월 12일 황제로 추대되어 12월 1일 페드루 1세로 대관했으며, 포르투갈령 브라질은 브라질 제국이 되었다. 바이아와 마라냥 같은 곳에는 포르투갈 수비대가 남아 독립 전쟁이 벌어졌다. 장관 주제 보니파시우 지 안드라다 이 시우바가 독립의 길을 이끌었고, 칠레에서 싸웠던 영국인 토머스 코크레인이 브라질 해군을 맡아 바이아 앞바다를 막았다. 1823년 7월 2일 살바도르의 포르투갈군이 항복하면서 전쟁은 사실상 끝났고, 파라와 마라냥도 그해 안에 제국에 합류했다. 페드루 1세는 1823년 제헌 의회를 닫고 1824년 헌법을 직접 내렸는데, 이에 반발한 북동부 페르남부쿠 등지는 1824년 적도 연합을 내세워 일어났다가 진압되었다. 포르투갈은 영국의 중재로 1825년 8월 29일 리우데자네이루 조약에서 독립을 승인했고, 브라질은 배상금 200만 파운드를 물기로 하고 이를 영국에서 빌려 마련했다. 영국은 승인의 조건으로 노예 무역의 폐지를 요구했고 브라질은 1826년 조약에서 1830년부터 이를 금지하기로 했다. 1824년 헌법은 재산에 따라 투표권을 나누었고, 제국은 노예제를 그대로 둔 채 세워졌다."
  subjects: [brazil, portuguese-brazil, portugal, uk]
  links:
    - { from: brazil, to: portuguese-brazil, note: "이피랑가에서 독립을 선언 (1822-09-07)" }
    - { from: portugal, to: brazil, note: "리우데자네이루 조약으로 독립을 승인 (1825-08-29)" }
