- id: oregon-treaty-1846
  year: 1846
  endYear: 1849
  title:
    ko: "오리건 조약과 밴쿠버섬 식민지(1846~1849)"
  summary:
    ko: "1818년 영미 협약은 북위 49도선을 로키산맥까지 국경으로 삼으면서 그 서쪽 오리건 컨트리를 두 나라가 함께 점유하기로 했다(「세븐오크스 사건과 모피 회사의 합병, 북서부 영토(1816~1821)」(앞의 사건)). 이 땅에는 치누크·살리시 등 여러 원주민 민족이 살았고, 허드슨 베이 회사가 교역소를 두었다. 1843년 천 명 가까운 이주민이 오리건 길에 오른 뒤 이주민이 크게 늘자 미국에서는 오리건 전체를 요구하는 목소리가 높아졌고, 북위 54도 40분까지를 주장하는 구호도 나왔다. 1844년 선거에서 이긴 제임스 포크 대통령은 처음에는 이 입장을 내세웠으나 1846년 멕시코와의 전쟁이 다가오자 영국과 타협하려 했다. 6월 6일 영국이 49도선을 해안까지 잇자는 안을 보내오자 6월 12일 미국 상원이 38 대 12로 영국의 제안을 받아들이라고 권했고, 6월 15일 국무 장관 제임스 뷰캐넌과 영국 공사 리처드 패켄햄이 오리건 조약에 서명했고 18일 상원이 41 대 14로 비준했다. 국경은 북위 49도선을 따라 해안까지 이어지다 밴쿠버섬을 영국에 남기고 대륙과 섬 사이 해협 한가운데로 돌아 나가는 것으로 정해졌고, 허드슨 베이 회사의 남쪽 재산권은 존중하기로 했고 컬럼비아강 항행도 회사에 한동안 허용되었다. 해협을 가리키지 않아 샌환 제도를 두고 1859년 돼지 전쟁이 일어났다. 영국은 1849년 밴쿠버섬을 허드슨 베이 회사에 맡겨 밴쿠버섬 식민지를 세웠다. 허드슨 베이 회사가 독점 교역을 허가받았던 북서부 영토 가운데 49도선 아래 서쪽 땅은 미국 땅이 되어, 회사는 본거지를 컬럼비아강가의 밴쿠버 요새에서 섬의 빅토리아 요새로 옮겼다."
  subjects: [vancouver-island, usa, uk, north-western-territory]
  links:
    - { from: uk, to: vancouver-island, note: "허드슨 베이 회사에 맡겨 식민지를 세움 (1849-01-13)" }
  tags: [diplomacy, politics]
  sources: ["Frederick Merk, The Oregon Question: Essays in Anglo-American Diplomacy and Politics (Belknap Press of Harvard University Press, 1967)", "Howard Jones, Donald A. Rakestraw, Prologue to Manifest Destiny: Anglo-American Relations in the 1840s (Scholarly Resources, 1997)", "John S. Galbraith, The Hudson's Bay Company as an Imperial Factor, 1821–1869 (University of California Press, 1957)"]

- id: mexican-american-war-1846
  year: 1846
  endYear: 1848
  title:
    ko: "멕시코–미국 전쟁과 과달루페이달고 조약(1846~1848)"
  summary:
    ko: "1845년 텍사스를 병합한 미국은 경계를 리오그란데강이라 했고 멕시코는 누에시스강이라 했다(「텍사스 혁명과 텍사스 공화국(1835~1845)」(앞의 사건)). 제임스 포크 대통령은 두 강 사이 땅에 군대를 보내는 한편 캘리포니아와 뉴멕시코를 사들이려 했으나 멕시코는 협상을 거부했다. 1846년 4월 25일 이 땅에서 미국 기병대와 멕시코군이 충돌했고 5월 13일 미국 의회가 전쟁을 선포했다. 전쟁은 마리아노 파레데스 정부 아래 시작되어 니콜라스 브라보의 짧은 대행(1846년 7월 말~8월 초)을 거쳐 호세 마리아노 살라스, 발렌틴 고메스 파리아스, 산타 안나, 페드로 마리아 데 아나야, 마누엘 데 라 페냐 이 페냐 정부로 이어졌다. 미국 육군은 1846년 8월 스티븐 커니의 부대가 뉴멕시코를 점령했고, 캘리포니아에서는 미국인 이주민이 일으킨 곰 깃발 봉기가 몇 주짜리 캘리포니아 공화국을 세웠다가 곧 미국 편에 섰다. 윈필드 스콧이 1847년 3월 베라크루스에 상륙해 내륙으로 밀고 들어갔고, 9월 13일 차풀테펙 성을 차지한 뒤 멕시코시티에 들어갔다. 1848년 2월 2일 과달루페이달고 조약이 서명되어 멕시코는 지금의 캘리포니아·네바다·유타와 애리조나·뉴멕시코·콜로라도·와이오밍의 많은 부분을 미국에 넘겼고, 미국은 1,500만 달러를 냈다. 조약은 리오그란데를 경계로 확인했고, 땅 안의 멕시코인에게 미국 시민이 될 길과 재산권을 약속했다. 전쟁에 반대하는 목소리도 컸고, 하원의원 에이브러햄 링컨은 1847년 처음 충돌이 정말 미국 땅에서 일어났는지 따지는 결의안을 냈다. 사망자는 미국 쪽 약 1만 3천 명(대부분 병으로), 멕시코 쪽 약 2만 5천 명으로 추산한다. 1848년 1월 캘리포니아에서 금이 나와 골드러시가 시작되었다."
  subjects: [mexico, usa]
  links:
    - { from: mexico, to: usa, note: "과달루페이달고 조약으로 땅을 할양 (1848-02-02)" }
  tags: [war, diplomacy]
  sources: ["Robert W. Johannsen, To the Halls of the Montezumas: The Mexican War in the American Imagination (Oxford University Press, 1985)", "Amy S. Greenberg, A Wicked War: Polk, Clay, Lincoln, and the 1846 U.S. Invasion of Mexico (Alfred A. Knopf, 2012)", "Pedro Santoni, Mexicans at Arms: Puro Federalists and the Politics of War, 1845–1848 (Texas Christian University Press, 1996)"]
