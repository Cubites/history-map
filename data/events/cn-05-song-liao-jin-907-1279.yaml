- id: wang-jian-former-shu-907
  year: 903
  endYear: 924
  title:
    ko: "왕건의 전촉 건국과 기·전촉의 다툼(903~924)"
  summary:
    ko: "왕건은 847년 지금 허난성 뤄허 부근의 우양에서 태어나 군인이 된 뒤 쓰촨으로 들어온 사람으로, 891년 청두를 차지해 서천 절도사가 되었다. 902년 한중을 얻었는데 이곳은 쓰촨의 북쪽 관문이었다. 903년 소종에게서 촉왕에 봉해졌고, 907년 당이 망하자 음력 9월 청두에서 황제를 칭했는데 이가 전촉이다. 쓰촨은 험한 산에 둘러싸여 방어하기 쉬웠고 비단과 차, 소금 생산이 풍부했으며, 청두에서는 차와 종이, 인쇄 같은 산업이 성했다. 왕건은 당 말에 쓰촨으로 피난 온 관료와 문인을 받아들여 궁정 문화를 키웠고, 청두의 비단인 촉금 같은 특산품을 중원과 거래해 재정을 꾸렸다. 많은 양자를 두어 군을 맡겼다고 전하는데 이는 당 말 번진에서 흔한 방식이었다. 전촉은 동쪽의 후량, 북쪽의 기와 맞서면서도 후량의 봉작을 받지 않았다. 관중 서부 봉상의 기왕 이무정도 당의 연호를 쓰며 후량을 인정하지 않았지만, 한중과 천수 일대를 두고는 전촉과 다투었다. 915년 가을 전촉군이 기를 공격해 봉주를 함락했고, 기의 천웅군 절도사가 진주(秦州, 지금 톈수이)를 바쳐 항복했다. 이때 진·봉·성·계주가 전촉 땅이 되었다. 기는 같은 해 정난군(빈주)을 후량에게 잃어 봉상 둘레만 남았으나, 918~920년 전촉의 봉상 공격을 막아 냈다. 왕건은 말년에 국호를 한(漢)으로 바꿨다가 촉으로 되돌렸고, 918년 음력 6월 죽어 아들 왕연이 뒤를 이었다. 이무정은 이후에도 봉상을 지키다 923년 후당이 서자 이듬해 신복해 진왕(秦王)에 봉해졌고 그해 죽었다. 전촉의 멸망은 「후당의 전촉 정복과 장종의 죽음(925~926)」(뒤의 사건)에서 다룬다."
  subjects: [tang, former-shu, qi-fengxiang, later-liang, later-tang]
  links:
    - { from: former-shu, to: qi-fengxiang, note: "천웅군 4주 획득(915)" }
  tags: [war, politics]
  sources: ["『구오대사』 참위열전 왕건", "『신오대사』 전촉세가", "『십국춘추』 전촉", "『자치통감』 후량기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: later-tang-conquers-shu-925
  year: 925
  endYear: 926
  title:
    ko: "후당의 전촉 정복과 장종의 죽음(925~926)"
  summary:
    ko: "전촉의 왕연은 사치와 연회에 빠져 정치를 환관과 측근에게 맡겼다. 924년 봉상의 이무정이 후당에 신복해 진왕(秦王)에 봉해지고 그해 죽자 관중 서부는 후당 손에 들어왔다. 추밀사 곽숭도는 쓰촨 정벌을 건의한 인물로 알려져 있다. 925년 음력 9월 이존욱은 아들 이계급을 지휘관으로, 곽숭도를 부장으로 삼아 약 6만 명(추산)의 군대를 보내 쓰촨을 쳤다. 전촉은 쓰촨의 험한 지형만 믿고 대비가 허술했고 장수들은 싸울 의지가 약했다. 왕연은 아버지 왕건이 죽은 뒤 즉위해 재위 7년 만에 나라를 잃었다. 후당군이 진입하자 전촉의 관료와 장수는 대부분 저항하지 않고 항복했다고 전한다. 후당군은 한중에서 검문까지 불과 몇 주 만에 나아가 청두로 밀고 내려왔으며, 11월 왕연이 항복해 전촉은 70일 남짓 만에 무너졌다. 형남의 고계흥은 후당에서 924년 남평왕에 봉해졌는데, 전촉이 망한 뒤 전촉의 귀주·협주(지금 후베이성 즈구이·이창)를 얻었다고 전한다. 그러나 승전 뒤 후당 조정은 어지러워졌다. 이존욱은 음악과 연극을 즐겨 광대 출신 측근을 총애했고, 곽숭도가 쓰촨에서 자립을 꾀한다는 의심을 받자 황후 유씨가 이계급에게 지시해 925년 말~926년 초 곽숭도를 죽였다. 이존욱의 명으로 왕연 일가도 뤄양으로 호송되던 길에 죽임을 당했다. 926년 봄 위주에서 병란이 일어났고, 토벌을 맡은 이사원이 군사들에게 떠밀려 반란에 가담했다. 음력 4월 뤄양에서도 곽종겸의 병변이 일어나 이존욱은 화살에 맞아 만 40세로 죽었다. 이사원이 뤄양에 들어가 즉위하니 곧 명종이다. 쓰촨에 파견된 맹지상의 이야기는 「맹지상의 후촉 건국(925~934)」(뒤의 사건)에서 이어진다."
  subjects: [later-tang, former-shu, jingnan]
  links:
    - { from: later-tang, to: former-shu, note: "전촉 정복(925)" }
    - { from: jingnan, to: former-shu, note: "귀주·협주 차지(925)" }
  tags: [war, politics]
  sources: ["『구오대사』 당서 장종기", "『신오대사』 당본기", "『자치통감』 후당기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: later-tang-mingzong-926
  year: 926
  endYear: 936
  title:
    ko: "후당 명종과 말제, 석경당의 반란(926~936)"
  summary:
    ko: "이극용의 양자 출신인 이사원(명종)은 926년 병란 속에서 즉위했다. 그는 군인 출신이라 글을 읽지 못해 신하가 올리는 글을 읽어 주게 했다고 전하지만, 환관을 줄이고 궁정 낭비를 억제했으며 풍도 같은 재상을 등용했다. 풍년이 들어 세금 부담도 상대적으로 가벼워서 후당 명종 시기는 5대에서 비교적 안정된 때로 평가받는다. 932년에는 풍도의 건의로 국자감이 유교 경전을 목판으로 찍어 내는 일을 시작했다. 풍도는 후당 뒤로도 여러 왕조를 섬긴 인물로, 명종에게 민생을 앞세우라고 건의했다고 전한다. 933년 말 명종이 죽자 아들 이종후(민제)가 이었으나 몇 달 만인 934년 봄 양자 이종가(말제)가 봉상에서 군사를 일으켜 민제를 몰아냈고, 민제는 달아나다 잡혀 살해되었다. 이에 앞서 934년 봄 쓰촨의 맹지상이 칭제했는데 후당은 이를 막지 못했다. 말제 이종가는 즉위 뒤 재정이 바닥나 병사들에게 약속한 상여금을 주지 못해 군심이 흔들렸다고 한다. 이종가는 이사원의 양자였고 석경당은 이사원의 사위여서 두 사람은 형제 같은 처지였으나 서로를 의심했다. 이종가가 하동 절도사 석경당을 의심해 936년 그를 산둥의 천평군(운주)으로 옮기라고 명하자, 석경당은 거부하고 타이위안에서 반란을 일으켜 거란 태종에게 도움을 청했다. 거란군이 936년 가을 타이위안을 구원해 후당군을 깨뜨리자 석경당은 음력 11월 황제를 칭하고 후진(後晉)을 세웠다. 이종가는 가족과 함께 뤄양의 누각에서 스스로 불에 뛰어들어 후당은 햇수로 14년 만에 끝났다. 석경당이 거란에 연운 16주를 넘기기로 약속한 일은 「거란의 연운 16주 확보와 오대의 교체」에서 다룬다."
  subjects: [later-tang, later-jin, liao, later-shu]
  tags: [politics, war]
  sources: ["『구오대사』 당서 명종기·말제기", "『신오대사』 당본기", "『자치통감』 후당기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Wang Gungwu, The Structure of Power in North China during the Five Dynasties (University of Malaya Press, 1963)"]

- id: meng-zhixiang-later-shu-934
  year: 925
  endYear: 934
  title:
    ko: "맹지상의 후촉 건국(925~934)"
  summary:
    ko: "맹지상은 이극용의 사위로 이존욱의 매형이었으며 이존욱을 섬긴 장수였다. 925년 후당이 전촉을 멸하자 서천 절도사가 되어 쓰촨에 부임했다. 이존욱이 죽고(926) 이사원이 즉위하는 혼란 속에서 그는 쓰촨의 군사와 재정을 쥐었고, 927년 봄 후당이 보낸 감군 이엄을 청두에서 죽였다. 쓰촨은 험한 검문과 삼협이 외부 군대의 진입을 어렵게 했고, 후당 조정은 중원의 정변으로 쓰촨을 통제할 힘이 없었다. 930년 가을 동천 절도사 동장이 반란을 일으키자 맹지상도 가담했으나, 932년 여름 동장이 쳐들어왔다가 패해 죽자 그는 동천을 합치고 다시 후당에 칭신했다. 이로써 쓰촨 전체가 그의 손에 들어왔다. 맹지상은 쓰촨에 이른 뒤 전촉 시절의 가혹한 세금을 줄이고 옛 관리를 일부 등용해 민심을 얻으려 했다고 전한다. 청두는 비단과 종이, 인쇄가 발달한 도시여서 후촉의 재정을 뒷받침했고, 후촉은 전촉 때의 제도와 관료를 많이 이어받았다. 후촉은 쓰촨 분지와 한중을 가진 큰 나라였다. 맹지상이 쓰촨 부임 때 데려온 하동 출신 장수들이 정권의 핵심을 이루었고 전촉의 옛 관료와 쓰촨 토착 세력이 이를 뒷받침한 것으로 알려져 있다. 933년 봄 명종이 그를 촉왕에 봉했으나 같은 해 명종이 죽자 맹지상은 더 이상 후당의 눈치를 보지 않았다. 934년 봄 청두에서 황제를 칭해 후촉을 세웠다. 이어 후당 말제 이종가가 민제를 몰아내는 어지러운 틈에 한중의 산남서도·무정군도 귀순했다. 맹지상은 즉위한 지 얼마 안 된 그해 음력 7월에 죽었고 열다섯 살 안팎의 아들 맹창이 뒤를 이었다. 후촉의 멸망은 「송의 후촉 평정(964~966)」(뒤의 사건)에서 다룬다."
  subjects: [later-tang, later-shu, former-shu]
  links:
    - { from: later-shu, to: later-tang, note: "산남서도·무정군 귀순(934)" }
  tags: [politics]
  sources: ["『구오대사』 참위열전 맹지상", "『신오대사』 후촉세가", "『자치통감』 후당기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: later-han-later-zhou-951
  year: 946
  endYear: 951
  title:
    ko: "후진의 멸망과 후한·후주의 교체(946~951)"
  summary:
    ko: "석경당은 936년 아버지로 섬기는 대가로 거란에 연운 16주를 넘기기로 약속하고 황제가 되었으며, 실제 인수는 938년이었다. 942년 석경당이 죽고 조카 석중귀가 뒤를 이은 뒤, 석중귀는 거란 황제에게 손자라 칭하되 신하라고는 하지 않았다. 거란은 944~946년 되풀이해 후진(後晉)을 쳤고, 946년 말 후진의 장수 두위가 거란에 투항하며 후진은 멸망했다. 거란 태종은 947년 정월 카이펑에 들어가 국호를 대요라 일컬었으나, 곡식을 거두는 군대가 약탈을 일삼아 중원 민심을 잃고 음력 3월에 물러났다. 철수하던 태종은 지금 허베이성에서 병으로 죽었고 시신은 소금에 절여 북쪽으로 옮겨졌다고 전하며, 이는 거란 안에서도 후계 다툼을 낳았다. 하동 절도사 유지원은 947년 음력 2월 타이위안에서 황제를 칭하고 후한(後漢)을 세웠으며 6월 카이펑에 들어갔다. 이후에도 하북과 관중의 번진들은 후한의 명령을 따르지 않는 일이 잦았다. 유지원은 이듬해 정월에 죽고 열일곱 살 안팎의 아들 은제가 뒤를 이었다. 권신들과 갈등을 빚던 은제는 950년 추밀사 곽위의 가족을 죽였고, 곽위는 이에 군사를 일으켰다. 은제는 도망 중 살해되었다. 곽위는 951년 음력 정월 카이펑에서 황제에 올라 후주를 세웠다. 5대의 교체는 군대가 황제를 세우고 쫓는 일이 잦았는데, 곽위도 부하들이 황제를 상징하는 누런 천을 몸에 둘러 추대하는 모양새로 즉위했다고 전한다. 이 방식은 조광윤의 진교 병변에서 되풀이된다(「송의 건국과 고려의 대송 외교」). 유지원의 동생 유숭도 같은 달 타이위안에서 황제를 칭했고(북한), 북한은 거란에 의지해 후주와 맞섰다. 5대 가운데 후진과 후한은 각각 11년과 4년 만에 끝난 짧은 나라였다."
  subjects: [later-jin, liao, later-han, later-zhou, northern-han]
  links:
    - { from: liao, to: later-jin, note: "후진 멸망(946)" }
    - { from: later-zhou, to: later-han, note: "곽위의 후한 타도(950)" }
