  sources: ["『금사』 선종본기·애종본기", "『원사』 태조본기·태종본기", "Michal Biran, Chinggis Khan (Oneworld, 2007)", "Tao Jing-shen, The Jurchen in Twelfth-Century China: A Study of Sinicization (University of Washington Press, 1976)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]
