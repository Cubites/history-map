  sources: ["『구오대사』 진서·한서·주서", "『신오대사』 진본기·한본기·주본기", "『자치통감』 후한기·후주기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Wang Gungwu, The Structure of Power in North China during the Five Dynasties (University of Malaya Press, 1963)"]

- id: four-prefectures-955
  year: 947
  endYear: 956
  title:
    ko: "진·봉·성·계 4주의 귀속과 후주의 후촉 공격(947~956)"
  summary:
    ko: "947년 거란이 후진(後晉)을 무너뜨릴 때 후진의 웅무군 절도사 하중건은 거란에 따르지 않고 진주(秦州)·성주·계주를 후촉에 바쳤고, 이어 봉주도 귀순했다. 이로써 진(秦)·봉·성·계 4주(지금 톈수이·룽난·펑현 일대)가 후촉 땅이 되었다. 4주는 지금의 간쑤성 동남부와 산시성(陝西) 서남부에 걸쳐 있다. 진주는 웨이허강 상류의 곡창이자 서쪽 티베트계 세력과 닿는 곳이었고, 봉주와 성주·계주는 친링 산맥을 넘는 길목을 잡고 있었다. 특히 봉주는 친링 산맥 서쪽 끝의 요충으로 한중과 관중을 잇는 길목이기도 했다. 후촉에는 방패이자 관중으로 나가는 발판이었고, 중원 쪽에서는 관중 서쪽 옆구리가 열린 셈이었다. 948~949년 관중과 하동 서부의 세 번진(하중·영흥군[장안]·봉상)이 후한에 반란을 일으키자 후촉은 봉상을 돕는다며 출병했으나, 곽위가 이끄는 후한군에 막혀 성과를 거두지 못했다. 쓰촨은 맹지상 이래 전란을 피해 풍요를 누렸고 맹창 때에도 정치는 대체로 평온했다. 후한과 후주 초에는 4주를 되찾을 여유가 없었다. 4주를 둘러싼 다툼은 관중을 누가 쥐느냐에 따라 쓰촨의 안전이 달라진다는 사실을 보여 주었다. 954년 후주 세종이 고평 전투를 이기고 군대를 정비하자 사정이 달라졌다. 세종은 955년 음력 5월 왕경과 향훈 등에게 후촉을 치게 했다. 후주군이 진주·성주·계주를 차례로 얻은 뒤 봉주가 955년 말~956년 초 함락되어 4주가 모두 후주로 넘어갔다. 맹창은 대등한 칭호로 화평을 청하는 글을 보냈으나 세종은 답하지 않았다. 이 싸움으로 후촉은 한중과 쓰촨 분지만 지키게 되었다. 세종은 쓰촨 쪽 공세를 접고 남당을 향해 군을 돌렸다(「후주 세종의 회남 정벌(955~958)」(뒤의 사건))."
  subjects: [later-shu, later-han, later-zhou]
  links:
    - { from: later-zhou, to: later-shu, note: "4주 회복(955~956)" }
  tags: [war, politics]
  sources: ["『구오대사』 주서 세종기", "『신오대사』 주본기·후촉세가", "『자치통감』 후주기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: zhou-shizong-954
  year: 954
  endYear: 960
  title:
    ko: "후주 세종의 개혁과 고평 전투(954~960)"
  summary:
    ko: "곽위(후주 태조)는 일찍이 아내 시씨의 조카 시영을 양자로 삼았고, 950년 후한 은제에게 친아들들을 잃어 시영이 후계자가 되었다. 시영은 954년 음력 정월 곽위가 죽자 만 32세로 즉위했다(세종). 즉위 두 달 만에 북한의 유숭이 거란 원군과 함께 남침했다. 세종은 직접 군을 이끌고 고평에서 북한·거란 연합군과 맞섰는데, 후주군 일부가 먼저 도망쳐 위기에 빠졌으나 조광윤 등이 앞장서 싸워 이겼다. 세종은 전선에서 달아난 장수들을 처벌하며 군기를 바로잡았다고 전한다. 이어 허약한 군인을 가려내고 정예를 뽑아 중앙 금군을 강화했으며, 조광윤을 금군의 핵심 자리에 올렸다. 세종은 즉위 전부터 후주의 군사 업무를 맡아 군의 사정을 잘 알고 있었다. 955년에는 허가 없이 세운 불교 사원을 정리하고 불상과 종을 녹여 동전을 만들었는데, 세금과 병역에서 빠지는 사람을 줄이고 동전 부족을 메우려는 조치였다. 호적과 조세를 다시 정리하고 수로를 고쳐 재정도 단단히 했으며, 학자들을 불러 경전을 간행하게 하고 958년에는 법전 『대주형통』을 정비했다. 그는 신하들에게 10년은 천하를 개척하고 10년은 백성을 기르며 10년은 태평을 이루겠다는 포부를 밝혔다고 전한다. 955년 후촉 공격은 「진·봉·성·계 4주의 귀속과 후주의 후촉 공격(947~956)」(앞의 사건)에서, 남당을 친 회남 정벌은 「후주 세종의 회남 정벌(955~958)」(뒤의 사건)에서 다룬다. 959년 음력 4월 세종은 북쪽으로 출정해 와교관·익진관·어구관을 되찾고 영주(瀛州)·막주 등을 얻었으나 유주를 앞두고 병이 나 돌아왔고, 음력 6월 만 37세로 죽었다. 만 5세의 어린 아들 시종훈이 뒤를 이었다. 960년 정월 조광윤이 진교역에서 추대되어 공제의 선양을 받으면서 후주는 끝났다(「송의 건국과 고려의 대송 외교」)."
  subjects: [later-zhou, northern-han, liao]
  links:
    - { from: later-zhou, to: liao, note: "관남 3관과 영주·막주 회복(959)" }
  tags: [politics, war]
  sources: ["『구오대사』 주서 세종기", "『신오대사』 주본기", "『자치통감』 후주기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)"]

- id: zhou-huainan-956
  year: 955
  endYear: 958
  title:
    ko: "후주 세종의 회남 정벌(955~958)"
  summary:
    ko: "남당은 951년 초를 멸했으나 이듬해 후난을 잃었고, 후주는 후촉을 누른 뒤 남당으로 눈을 돌렸다. 회남은 곡창이자 소금 생산지였고, 후량 이래 중원 왕조가 남쪽으로 나아가려면 거쳐야 하는 곳이자 오와 남당의 북쪽 국경이었다. 전쟁은 955년 말 이곡이 이끈 군대로 시작되었고 세종은 956년 음력 정월 말~2월 직접 나섰다. 후주군은 변하와 대운하를 따라 보급할 수 있었고 세종은 수로를 정비해 병선이 오가게 했다. 회남의 수주(지금 안후이성 서우현)는 남당의 유인섬이 굳게 지켜 14개월 남짓 포위 끝에 957년 봄 함락되었는데, 유인섬은 병이 깊어 부하들이 항복한 직후 죽었고 세종은 그의 충절을 높이 평가해 후하게 장례를 치르게 했다. 조광윤은 저주 싸움에서 남당군을 깨뜨리며 이름을 높였다. 세종은 노획한 남당 전함을 바탕으로 수군을 만들었다고 전한다. 956년 양저우가 후주군에게 점령되었고, 957년 겨울 세종이 다시 친정하면서 회남의 여러 성이 후주 손에 들어왔다. 남당은 병력이 많았으나 장수들이 서로 시기하고 지휘가 통일되지 않아 각지에서 무너졌다. 남당의 이경은 창장강 방어선에 의지해 화의를 청했다. 958년 음력 3월 남당은 창장강 북쪽 14주 60현(회남 일대 등)을 후주에 넘기고 칭신했으며, 스스로 황제 칭호를 버리고 후주의 연호를 썼다. 전쟁 뒤 세종은 회남에 관리를 보내 호구를 조사하고 농사를 장려했다. 남당은 소금 생산지 회남을 잃어 재정이 어려워졌고 금릉(지금 난징)이 국경에 가까워져 불안이 커졌다. 세종이 이 승리 뒤 북쪽으로 나선 일은 「후주 세종의 개혁과 고평 전투(954~959)」(앞의 사건)에서 다룬다."
  subjects: [later-zhou, southern-tang]
  links:
    - { from: southern-tang, to: later-zhou, note: "회남 14주 할양과 칭신(958)" }
  tags: [war, diplomacy]
  sources: ["『구오대사』 주서 세종기", "『신오대사』 주본기·남당세가", "『자치통감』 후주기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: yang-wu-902
  year: 902
  endYear: 919
  title:
    ko: "양행밀의 오와 건주 병합(902~919)"
  summary:
    ko: "양행밀은 병사 출신으로, 당 말 혼란을 틈타 892년 회남 절도사가 되었고 광릉(지금 양저우)을 근거지로 회남을 차지한 뒤 902년 소종에게서 오왕에 봉해졌다. 전란으로 황폐해진 회남에서 농민을 정착시키고 차와 소금, 비단 생산을 북돋웠으며, 양저우는 대운하와 창장강이 만나는 교통의 요충이어서 회복이 빨랐다. 오는 수군이 강해 창장강과 화이허강 일대에서 주전충의 남진을 막는 방어벽 구실을 했고, 907년 당이 망한 뒤에도 당의 연호를 써 후량을 인정하지 않았다. 905년 양행밀이 죽자 맏아들 양악이 이었으나 방탕해 908년 서온과 장호에게 살해되었다. 서온은 양행밀의 둘째 아들 양융연을 세우고 군사와 행정의 실권을 쥐었다. 양씨 군주를 앞세운 채 서온 집안이 권력을 잡는 이 구조는 서온의 양아들 서지고가 양씨를 대신하는 일로 이어졌다(「서지고의 선양과 남당 건국(927~943)」(뒤의 사건)). 909년 위전풍이 홍주(진남군)를 공격했다가 오군에게 사로잡히면서 위전풍이 다스리던 무주 등 장시 중·남부가 오에 들어와, 오는 홍·강주와 합쳐 장시 대부분을 가졌다. 이 남쪽 건주(虔州, 지금 장시성 간저우)는 노광조와 담전파가 다스렸다. 노광조는 885년 건주를 차지하고 902년 소주(지금 사오관)까지 얻었으며, 후량이 서자 백승군 방어사로 인정받고 909년에는 오에도 명목상 귀부했다. 노광조가 910년 죽은 뒤 아들 노연창이 이었으나 소주를 남한에게 잃었고, 913년부터는 담전파가 건주를 맡았다. 918년 11월 오군이 건주를 함락해 담전파를 격파하고 오는 장시 전체를 차지했다. 919년 양융연이 오국왕이 되었으나 실권은 서온 집안, 특히 양아들 서지고에게 넘어가 있었다."
  subjects: [tang, yang-wu, qianzhou-baisheng, later-liang]
  links:
    - { from: yang-wu, to: qianzhou-baisheng, note: "건주(虔州) 병합(918)" }
  tags: [politics, war]
  sources: ["『구오대사』 참위열전 양행밀", "『신오대사』 오세가", "『십국춘추』 오", "『자치통감』 후량기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: xu-zhigao-southern-tang-937
  year: 927
  endYear: 943
  title:
    ko: "서지고의 선양과 남당 건국(927~943)"
  summary:
    ko: "오의 군주 양부(양융연의 아우로 920년 형을 이어 즉위)에게 실권자 서온은 황제 칭호를 권하는 글을 올렸으나 927년 가을 죽었고, 양부는 그해 말 황제를 칭했다. 서온의 양아들 서지고(徐知誥, 본성 이씨)는 서온의 맏아들 서지훈(徐知訓)이 918년 살해되자 서온 곁에서 힘을 키웠고, 서온이 죽은 뒤 친아들 서지순(徐知詢)을 밀어내 929년 무렵 오의 정치를 한 손에 쥐었다. 그는 금릉(지금 난징)에서 정무를 보며 법을 가볍게 하고 호적을 정리하며 세금을 줄이고 농업을 북돋아 민심을 얻었다고 전한다. 금릉에는 전란을 피한 문인과 화가, 학자가 모여들었다. 935년 말 그는 제왕(齊王)에 봉해졌고 937년 음력 10월 양부의 선양을 받아 금릉에서 황제에 올랐다. 이 교체는 군사 쿠데타라기보다 오의 군신이 동의한 비교적 평화로운 교체로 서술된다. 처음에는 국호를 제(齊)라 했다고도 전한다. 양부는 이듬해 단양궁으로 옮겨졌다가 939년 죽었다. 같은 해 서지고는 당 황실의 후손을 자처하며 국호를 당으로 고치고 성을 이씨로 되돌리고 이름을 변(昪)으로 고쳤는데, 이는 남당이 당의 정통을 잇는 나라라는 선전의 구실을 했다. 이를 역사에서 남당(열조)이라 부른다. 도읍은 금릉(난징)이었고 광릉(양저우)을 부도로 삼았다. 이경은 서지고의 맏아들로 본래 이름이 서경통이었다가 이경으로 고쳤다. 이변은 전쟁을 줄이고 이웃과의 불필요한 충돌을 피해 오월과 화평을 이어 갔다. 남당은 오가 쌓은 회남과 강서를 바탕으로 한 큰 나라였고 금릉의 문화가 번성했다. 이변은 943년 음력 2월 죽고 장남 이경이 뒤를 이었으며, 오의 땅 가운데 동쪽 오월은 따로 서 있었다. 이경 때의 팽창은 「민의 분열과 멸망, 푸젠의 재편(943~949)」(뒤의 사건)에서 다룬다."
  subjects: [yang-wu, southern-tang]
  links:
    - { from: southern-tang, to: yang-wu, note: "양부의 선양을 받아 오를 이음(937)" }
  tags: [politics]
  sources: ["『신오대사』 남당세가", "『십국춘추』 남당", "『자치통감』 후진기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: wuyue-qian-liu-907
  year: 893
  endYear: 932
  title:
    ko: "전류와 오월의 건국: 항저우의 번영(893~932)"
  summary:
    ko: "전류는 임안(지금 항저우시 린안구) 사람으로, 젊어서 소금 밀매로 살다 당 말 황소의 난 때 병사로 공을 세워 항저우 일대의 군을 이끌게 되었다. 전류는 가난한 집에서 태어나 군공으로 일어난 인물로 알려져 있다. 886년 항주 자사가 되었고 893년 진해군 절도사가 되었으며, 896년 월주(지금 사오싱)에서 일어난 반란을 진압하고 진동군 절도사도 겸해 저장 전체를 아울렀다. 902년 월왕, 904년 오왕에 봉해졌고 907년 후량에게서 오월왕에 봉해졌으며, 923년 후량이 오월국왕으로 올렸다. 전류는 중원의 어느 왕조든 섬기는 것을 나라를 지키는 방침으로 삼아 칭호를 앞세운 외교로 이웃의 침입을 막았고, 양씨의 오와는 자주 싸웠으나 큰 전쟁은 피했다. 항저우의 성을 넓히고 저수지와 수문을 두어 농업과 교통을 도왔으며 앞바다의 제방은 조수 피해를 줄였다고 전하고, 쇠뇌를 쏘아 밀려오는 조수를 막았다는 전설도 있다. 서호를 쳐 내는 군사를 두어 호수를 관리하게 했고, 쌀과 비단, 차 생산이 늘어 오월은 부유해졌다. 불교를 보호해 항저우 일대에 사찰이 많이 들어섰다. 전류는 죽을 때 자손에게 중원을 섬기고 백성을 편안히 하라고 일렀다는 이야기가 전한다. 932년 전류가 죽자 아들 전원관이 뒤를 이었다. 이러한 방침 덕분에 오월은 큰 전란을 겪지 않아 농업과 수공업, 불교 문화가 발전했고 창장강 하류 문화의 터전이 되었다. 오월이 복주(지금 푸저우)를 얻은 일(947)은 「민의 분열과 멸망, 푸젠의 재편(943~949)」(뒤의 사건)에서, 송에 땅을 바친 일(978)은 「오월·청원군의 납토(978)」(뒤의 사건)에서 다룬다."
  subjects: [tang, wuyue, later-liang, yang-wu]
  tags: [politics, society]
  sources: ["『구오대사』 세습열전 전류", "『신오대사』 오월세가", "『십국춘추』 오월", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: min-wang-shenzhi-907
  year: 893
  endYear: 935
  title:
    ko: "왕심지의 민: 푸젠의 개발(893~935)"
  summary:
    ko: "왕조·왕심규·왕심지 삼형제는 광주(光州) 고시 출신으로, 당 말 혼란 속에 병사를 이끌고 남쪽으로 내려와 893년 복주(지금 푸저우)를 차지했다. 왕조가 푸젠 관찰사가 되었으나 897년 죽으면서 동생 왕심규가 아니라 왕심지에게 자리를 넘기라고 일렀다고 전한다. 왕씨 형제는 중원에서 내려온 군대와 함께 푸젠의 토착 세력을 아울렀고, 그 때문에 민은 이주민과 토착민이 섞인 사회로 출발했다. 왕심지는 907년 후량이 서자 후량의 신하가 되었고 909년 후량에게서 민왕에 봉해졌다. 그는 이웃과 다투기보다 영내를 안정시키는 것을 앞세워 세금을 줄였다고 한다. 민은 산이 많고 평지가 좁아 농지가 부족했으므로 왕심지는 바닷길 교역과 차·종이 같은 산업을 장려했고, 복주는 예로부터 바닷길의 관문이어서 항구를 정비하고 외국 상인을 보호했다고 한다. 왕심지는 후량·후당에 해마다 조공했고 바닷길로도 사신을 보냈다고 전한다. 중원이 혼란한 틈에 피난 온 학자와 기술자를 받아들였고, 성곽을 넓히고 사찰을 지원했으며 사문학이라는 학교를 세워 인재를 길렀다고 한다. 왕심지는 근검하게 살았다고 전해진다. 왕심지 때 푸젠은 오랜 전란에서 비껴나 평온을 누렸다. 925년 왕심지가 죽자 맏아들 왕연한이 이었으나 형제 사이의 다툼 끝에 926년 말~927년 초 둘째 아들 왕연균(혜종)이 즉위했다. 왕연균은 933년 황제를 칭하고 국호를 대민이라 했다. 935년 말 그는 아들 왕계붕(강종)에게 살해되었고, 이로써 민은 형제와 부자의 살육으로 약해지기 시작했다. 이후 민의 분열은 「민의 분열과 멸망, 푸젠의 재편(943~949)」(뒤의 사건)에서 다룬다."
  subjects: [min-kingdom, later-liang]
  tags: [politics, economy]
  sources: ["『구오대사』 참위열전 왕심지", "『신오대사』 민세가", "『십국춘추』 민", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Hugh R. Clark, Community, Trade, and Networks: Southern Fujian Province from the Third to the Thirteenth Century (Cambridge University Press, 1991)"]

- id: min-fall-945
  year: 943
  endYear: 949
  title:
    ko: "민의 분열과 멸망, 푸젠의 재편(943~949)"
  summary:
    ko: "민의 왕연희(경종)는 939년 조카 왕계붕(강종)을 죽이고 즉위한 뒤 방탕과 의심으로 신하들의 마음을 잃었다. 943년 음력 2월 동생 왕연정이 건주(建州, 지금 푸젠성 젠어우)에서 따로 황제를 칭해 나라 이름을 은(殷)이라 했고, 민은 복주(지금 푸저우)의 민과 건주의 은으로 갈라졌다. 건주는 푸젠 북부 산간의 요충이었다. 944년 복주에서 쿠데타가 일어나 왕연희가 살해되고 주문진이 스스로 황제를 칭했다. 왕연정과 주문진은 서로 싸웠고 남당이 이 틈을 노렸다. 945년 음력 2월 주문진이 부하에게 살해되자 왕연정이 민을 다시 합쳐 국호를 민으로 되돌렸으나, 음력 8월 남당군이 건주를 함락하고 왕연정이 항복해 민은 멸망했다. 건주 함락 뒤 정주(汀州) 등 푸젠 북부·서부가 남당에 들어갔고 천주(지금 취안저우)·장주(지금 장저우)도 명목상 귀순했으나 남당의 지배는 오래가지 못했다. 건주는 푸젠 북부에서 차와 종이를 생산하는 곳이기도 했다. 복주는 이인달이 945년 주문진의 옛 세력을 제거하고 차지했는데, 처음 남당에 칭신했다가 946년 가을 남당군의 공격을 받자 후진(後晉)에 칭신하고 오월에 구원을 청했다. 오월군이 946년 12월 도착해 947년 봄 남당군을 깨뜨렸고, 이인달이 947년 오월에 입조했다가 복주로 돌아온 뒤 남당에 다시 붙으려다 오월 장수 포수양에게 살해되어 복주는 오월이 직접 차지했다. 천주에서는 유종효가 944년 겨울 실권을 쥐었고 946년 남당이 천주 자사로 임명했으나, 947년 남당 주둔군을 몰아냈으며 949년 남당이 청원군을 두고 그를 절도사로 삼았다. 이로써 푸젠은 오월(복주)·청원군(천주·장주)·남당(건주·정주 등)으로 나뉘었다. 푸젠의 이후 번영은 「송의 경제 발전과 기술 혁신(960~1127)」(뒤의 사건)에서 다룬다."
  subjects: [min-kingdom, southern-tang, wuyue, qingyuan-jun]
  links:
    - { from: southern-tang, to: min-kingdom, note: "건주 함락과 민 멸망(945)" }
  tags: [politics, war]
  sources: ["『구오대사』 참위열전", "『신오대사』 민세가·남당세가", "『십국춘추』 민", "『자치통감』 후진기·후한기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: ma-chu-ma-yin-907
  year: 896
  endYear: 947
  title:
    ko: "마은의 초: 후난의 차 무역과 천책부(896~947)"
  summary:
    ko: "마은은 허주 언릉 출신으로 목수로 일하다 당 말 병란 속에 군인이 된 인물이다. 896년 담주(지금 창사)를 차지해 무안군 절도사가 되었다. 907년 후량이 서자 후량에게서 초왕에 봉해졌고 후난 전부와 광시 북부의 정강군 일대, 연주를 다스렸다. 광시 남부의 용관은 한때 초의 영향 아래 있었으나 911년 남한에게 넘어갔다. 마은은 낮은 신분의 병사에서 올라온 사람이라 후량·후당 같은 중원 왕조에 칭신하는 한편 이웃과는 무력을 앞세워 영토를 지켰다. 후난은 5대 동안 전란이 비교적 적은 곡창 지대였고, 마은은 곡식과 차를 중원에 팔아 말과 무기를 구했는데 이 무역은 물자가 귀하던 중원 왕조에도 환영받았다. 927년 후당이 마은을 초국왕에 봉하자 그는 궁전을 세우고 백관을 두어 나라의 틀을 갖추었고, 담주는 후난의 중심지로 번성했다. 후당 시기에는 구리가 귀해 철로 만든 동전도 만들어 썼다. 마은의 영역은 호수와 평야가 많은 후난이 중심이어서 곡물과 차 생산이 풍부했다. 마은은 이웃 오·남한과 큰 전쟁을 피하며 평화를 유지하려 했고, 초는 후난 전부와 광시 북부에 이르는 큰 땅을 다스렸다. 마희범은 마은의 넷째 아들이다. 930년 마은이 죽자 둘째 아들 마희성이 이었으나 932년 죽어 동생 마희범이 뒤를 이었다. 마희범 때인 940년 초는 지금 후난성 서북부의 토착 수령 팽사수와 싸운 끝에 굴복시키고 구리 기둥에 조건을 새겨 세웠다. 팽사수의 땅은 초의 직접 지배에 들지 않았고, 마희범은 939년 후진에게서 천책상장군 칭호를 받고 천책부를 열어 18학사를 두었다가 947년 죽었다. 이후 초의 내분은 「초의 멸망과 무평군의 성립(947~956)」(뒤의 사건)에서 다룬다."
  subjects: [ma-chu, later-liang, later-tang, southern-han]
  links:
    - { from: southern-han, to: ma-chu, note: "용관 차지(911)" }
  tags: [politics, economy]
  sources: ["『구오대사』 참위열전 마은", "『신오대사』 초세가", "『십국춘추』 초", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: ma-chu-fall-wuping-951
  year: 947
  endYear: 956
  title:
    ko: "초의 멸망과 무평군의 성립(947~956)"
  summary:
    ko: "마희범이 947년 죽은 뒤 형제들이 자리를 놓고 다투었다. 마희악은 마희범의 이복형으로 낭주(무평군)에서 오래 세력을 키운 인물이었고, 마희범의 동복 아우 마희광이 즉위한 뒤에도 승복하지 않고 다툼을 이어 갔다. 마희숭은 마희악의 아우다. 마희악은 마희광(947~950)을 몰아내고 즉위했으나(950년 음력 12월, 양력으로는 951년 1월), 동생 마희숭이 다시 마희악을 쫓아냈다. 이 내분 속에 남당이 군대를 보냈다. 951년 겨울(음력 10월) 남당군이 담주(창사)에 들어가자 마희숭은 항복했고 초는 멸망했다. 남한은 이 틈을 타 948년 하주·소주(昭州)를 시작으로 951년 정강군(계주)과 몽주를 차지했고, 그해 겨울 침주도 빼앗았다. 후난은 초가 오래 다스린 곡창이어서 남당에게는 회남과 맞바꿀 만한 큰 땅이었다. 그러나 남당의 후난 통치는 서툴렀다. 남당군을 이끈 변호는 마씨 집안과 신료를 금릉(지금 난징)으로 보내고 후난에서 약탈을 일삼아 현지 민심을 잃었고, 남당은 후난을 다스릴 병력도 부족했다. 952년 낭주(지금 창더)의 유언이 마희악의 옛 부하들을 규합해 남당군을 몰아냈고, 변호는 그해 말 담주를 버리고 달아났다. 유언은 후주에서 무평군 절도사로 인정받았다. 무평군이란 이름은 낭주에 두었던 절도사의 군호에서 왔다. 그 뒤 유언이 제거되고 왕규를 거쳐 956년 주행봉이 무평군을 이어받아 후난 전체를 다스렸다. 무평군의 지배자는 서로 죽이는 일을 되풀이했다. 후난은 마씨 시절부터 차와 곡식 생산의 중심지로서 전란 뒤에도 빠르게 회복되었다. 남당은 후난을 잃고 회남에서도 후주에 밀려 힘이 꺾였다(「후주 세종의 회남 정벌(955~958)」(뒤의 사건))."
  subjects: [ma-chu, southern-tang, southern-han, wuping-jun, later-zhou]
  links:
    - { from: southern-han, to: ma-chu, note: "정강군·몽주·침주 차지(951)" }
    - { from: southern-tang, to: ma-chu, note: "담주 접수와 초 멸망(951)" }
  tags: [politics, war]
  sources: ["『신오대사』 초세가·남당세가", "『십국춘추』 초", "『자치통감』 후한기·후주기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: southern-han-liu-yin-905
  year: 905
  endYear: 938
  title:
    ko: "유은·유엄의 남한 건국(905~938)"
  summary:
    ko: "유은은 광저우를 중심으로 일어난 군인 집안 출신으로(아버지는 봉주 자사 유겸), 905년 청해군 절도사가 되어 광둥을 다스렸다. 907년 후량이 서자 후량에게서 인정받았고 909년 남평왕, 이어 남해왕에 봉해졌다. 후량이 내린 봉작은 남한이 중원 왕조의 권위를 빌려 남쪽에서 입지를 굳히는 수단이 되었다. 911년 유은이 죽고 서출 아우 유엄이 뒤를 이었다. 유엄은 911년 초의 용관(容管)을 차지했고 913년에는 건무군(옹주, 옹관)에서 절도사로 인정받았다. 건주(虔州) 정권이 가진 소주(韶州, 지금 사오관)도 노연창이 죽은 뒤 빼앗아(911~912) 광둥 북부까지 영토를 넓혔다. 917년 음력 8월 황제를 칭해 나라 이름을 대월이라 했다가 이듬해 한(漢)으로 고쳤고 연호를 건형이라 했다. 한이라는 국호는 유씨가 한 황실의 후손임을 내세운 것이라고도 한다. 도읍은 광저우의 흥왕부였다. 광저우는 남해 바닷길의 관문으로 당대부터 페르시아·아랍 상인이 모여 사는 구역이 있었고, 남한은 이들과의 교역과 소금·진주 같은 특산에서 나오는 재정으로 군을 길러 영남 전체를 다스렸다. 유엄은 용(龑)이라는 새 글자를 만들어 이름으로 삼았다고 전한다. 유엄은 광시 북부로 나아가려 했으나 후난의 초와 맞부딪혀 더 가지 못했다. 930년 남한은 교주(지금 베트남 북부)를 점령했고 931년 양정예가 이를 되찾았으며, 938년 오권이 이끄는 베트남 군이 바익당강에서 유엄의 아들 유홍조가 이끈 남한 수군을 깨뜨려 베트남이 중국 왕조의 직접 지배에서 벗어나는 계기가 되었다. 남한의 멸망은 「송의 남한 평정(970~971)」(뒤의 사건)에서 다룬다."
  subjects: [southern-han, later-liang, ma-chu, qianzhou-baisheng]
  links:
    - { from: southern-han, to: ma-chu, note: "용관 차지(911)" }
    - { from: southern-han, to: qianzhou-baisheng, note: "소주 차지(912)" }
  tags: [politics]
  sources: ["『구오대사』 참위열전 유은·유엄", "『신오대사』 남한세가", "『십국춘추』 남한", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: hexi-guiyi-ganzhou-848
  year: 848
  endYear: 926
  title:
    ko: "허시 회랑의 귀의군과 감주 위구르(848~926)"
  summary:
    ko: "허시 회랑 서쪽 끝의 사주(지금 둔황)와 과주는 8세기 말부터 토번의 지배를 받았다. 848년 한인 장의조가 토번 세력을 몰아내 두 주를 되찾았고, 851년 당은 이곳에 귀의군을 두어 장의조를 절도사로 삼았다. 귀의군의 한인 주민들은 토번 지배 아래에서도 한어와 한인의 풍습을 지켰고 이것이 봉기가 성공한 바탕이었다. 귀의군이 있던 둔황은 비단길의 요충이자 불교 석굴 막고굴이 있는 곳이었다. 장씨 집안은 한동안 허시 동쪽까지 세력을 뻗었으나 890년 장회심 일가가 살해되는 내분 뒤 감주와 양주는 귀의군에서 떨어져 나갔다. 허시 동쪽 감주(지금 장예)에서는 위구르 칸국이 무너진 뒤 옮겨 온 위구르인이 자리를 잡아 894년 무렵 감주 위구르 칸국을 세웠다. 907년 당이 망한 뒤 귀의군의 장승봉은 909~910년 무렵 스스로 백의천자라 칭하며 서한금산국을 세웠지만, 911년 감주 위구르에 패해 사실상 종속되었다. 914년 조의금이 장씨를 대신해 절도사에 올라 귀의군을 되살렸다. 조의금은 916년 감주 위구르의 공주와 혼인하며 화해했고 918년 후량에게서 절도사 칭호를 받았다. 925년 조의금이 감주 위구르를 쳐 이겼고, 이듬해 즉위한 새 칸은 조의금의 딸과 혼인했다. 조의금은 막고굴에 우전 왕의 초상을 그린 굴을 만드는 등 둔황의 불교 미술을 후원했다. 둔황에는 한문과 티베트어, 호탄어, 소그드어 등 여러 언어의 불교 경전과 문서가 모였다. 두 나라는 비단길을 오가는 상인과 사신을 받아들이며 허시 회랑의 교역을 이었다. 이들의 마지막은 「서하의 허시 회랑 정복: 감주와 사주(1028~1038)」(뒤의 사건)에서 다룬다."
  subjects: [tang, guiyi, ganzhou-uyghur, later-liang]
  tags: [politics, society]
  sources: ["『신오대사』 사이부록", "『송사』 외국전 회골전", "『자치통감』 후량기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: song-conquers-jingnan-chu-963
  year: 962
  endYear: 963
  title:
    ko: "송의 형남·무평군 평정(962~963)"
  summary:
    ko: "960년 송을 세운 조광윤은 후주의 옛 땅을 안정시킨 뒤 남쪽 나라들을 하나씩 정복해 나갔다. 첫 대상은 창장강 중류의 형남과 후난의 무평군이었다. 이곳을 차지하면 후촉을 동쪽에서, 남당을 서쪽에서 압박할 수 있었다. 형남은 고계흥이 강릉(지금 징저우)을 근거로 924년 남평왕에 봉해진 뒤, 아들 고종회(재위 928~948), 고종회의 아들 고보융(948~960), 그 아우 고보욱(960~962), 조카 고계충(고보융의 아들, 962~963)으로 이어져 왔다. 형남은 5대 10국 가운데 가장 작은 나라에 속했으나 창장강 중류의 교통로를 쥐고 있어 이웃 나라들 사이에서 칭신을 거듭하며 버텼다. 후난의 무평군은 유언이 낭주(지금 창더)에서 세웠고 왕규를 거쳐 956년 주행봉이 이었다. 962년 주행봉이 죽고 어린 아들 주보권이 뒤를 잇자 장수들 사이에 권력 다툼이 일었고 부장 장문표가 반란을 일으켰다. 송은 주씨 쪽의 구원 요청을 명분으로 963년 음력 정월 모용연소와 이처운에게 군대를 주어 후난으로 보냈다. 모용연소는 송 건국 초의 원로 장수였고 이처운은 군수 보급과 전술을 맡은 장수였다. 송군은 형남에게 길을 빌려 달라 하고 강릉 가까이 이르렀고, 형남의 고계충은 호구와 병력, 창고를 송에 넘겼다(음력 2월). 송군은 곧 후난으로 내려가 3월 낭주를 함락하고 주보권을 사로잡았다. 길을 빌려 두 나라를 차례로 무너뜨린 이 계책을 옛 중국에서는 가도멸괵이라 불렀다. 주보권과 고씨 집안은 카이펑으로 호송되어 벼슬을 받았다. 송은 창장강 중류를 모두 얻어 후촉과 남한, 남당 정복의 발판을 마련했다. 같은 무렵 고려 광종이 송과 외교를 열었다(「송의 건국과 고려의 대송 외교」)."
  subjects: [song, jingnan, wuping-jun]
  links:
    - { from: song, to: jingnan, note: "형남 접수(963)" }
    - { from: song, to: wuping-jun, note: "낭주 함락(963)" }
  tags: [war, politics]
  sources: ["『송사』 태조본기", "『송사』 세가 형남 고씨", "『속자치통감장편』 건륭 3년·4년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-conquers-shu-965
  year: 964
  endYear: 966
  title:
    ko: "송의 후촉 평정(964~966)"
  summary:
    ko: "후촉의 맹창은 934년부터 31년 가까이 재위하며 쓰촨의 풍요에 안주했다. 후촉이 북한과 손잡으려 사신을 보냈다가 송에 발각되었다는 이야기가 전하며, 송은 이를 구실로 삼았다. 후촉의 장수들은 고령이거나 서로 불화했다. 후촉은 쓰촨의 비단과 차, 인쇄 문화를 바탕으로 부유했고 문학과 학문도 성했다. 후촉이 쌓아 둔 재물이 많았기에 송군이 노린 것은 땅뿐 아니라 재물이기도 했다는 평가가 있다. 맹창은 즉위 초 권신을 제거하고 친정을 시작했다는 평을 듣지만 만년에는 사치와 쾌락에 빠져 군사를 소홀히 했다고 전한다. 송 태조는 964년 음력 11월 왕전빈과 유광의에게 군대를 주어 두 갈래로 쓰촨을 치게 했다. 북로군은 한중에서 검문 쪽으로 단 몇 주 만에 돌파했고, 동로군은 귀주·협주 쪽에서 창장강을 거슬러 올라 합류했다. 후촉의 재상 왕소원은 자신이 나가면 중원을 쓸어버리겠다고 호언했으나 송군에게 연이어 패했다. 한중의 방어가 뚫리자 송군은 청두 가까이 이르렀고, 965년 음력 정월 맹창이 항복해 후촉은 두 달 남짓 만에 멸망했다. 맹창은 카이펑으로 호송되어 그해 안에 죽었다. 송군이 청두에 들어갔을 때 후촉의 창고에는 막대한 재물과 곡식이 쌓여 있었다고 하며, 송은 이를 카이펑으로 보냈다. 그러나 송군의 약탈과 군기 문란, 후촉 병사를 카이펑으로 보내려는 조치에 반발해 965년 전사웅의 반란이 일어났고 송은 군을 더 보내 이듬해에야 가라앉혔다. 송은 쓰촨에서 구리 동전을 쓰지 못하게 하고 철전만 쓰게 했는데, 철전은 무거워 큰 거래에 불편했다. 철전의 불편과 종이 증서 교자의 등장은 「송의 경제 발전과 기술 혁신(960~1127)」(앞의 사건)에서 다룬다. 후촉이 가졌던 한중과 쓰촨 전역이 송에 넘어갔다."
  subjects: [song, later-shu]
  links:
    - { from: song, to: later-shu, note: "후촉 정복(964~965)" }
  tags: [war, politics]
  sources: ["『송사』 태조본기·세가 서촉 맹씨", "『속자치통감장편』 건덕 2년·3년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-conquers-southern-han-971
  year: 970
  endYear: 971
  title:
    ko: "송의 남한 평정(970~971)"
  summary:
    ko: "남한의 유창은 열여섯 살 안팎에 즉위(958)해 환관과 궁인에게 정치를 맡겼고 가혹한 형벌로 신하들의 마음을 잃었다. 사서는 궁정에 환관이 수천 명이나 되었다고 전한다(추산). 남한은 광저우와 하이난의 진주 채취, 상아·향료 무역으로 재정을 마련해 영남 전체를 다스린 큰 나라였으나 정치가 부패해 있었다. 송은 후난 평정(963)으로 남한과 국경이 맞닿았고, 남한이 송의 변경을 건드리자 송 태조는 970년 음력 9월 반미와 윤숭가에게 광시 북부를 쳐서 남한을 정복하게 했다. 남한 정복은 송이 남쪽 나라들을 평정한 순서에서 형남·후촉 다음 세 번째였다. 광시 북부의 하주(賀州)·소주(昭州) 등은 광저우로 가는 관문 구실을 했다. 송군은 970년 말~971년 정월 하주 등 광시 북부의 주를 차례로 함락하고 연주(連州)·소주(韶州) 등을 얻으며 광저우 가까이 이르렀다. 남한의 지방 수령 가운데에는 싸우지 않고 항복하는 이도 많았다. 남한은 광저우 앞에 코끼리 부대를 배치했는데, 송군이 화살과 불로 쏘자 코끼리가 놀라 되돌아 달려 남한군이 흩어졌다. 유창은 배를 준비해 재물을 싣고 달아나려 했다는 이야기도 전한다. 971년 음력 2월 유창이 항복하면서 남한은 멸망했다. 남한의 지배층은 카이펑으로 옮겨져 벼슬을 받았다. 송은 남한이 멸망한 직후 광저우에 군을 두어 치안을 잡았고, 같은 해 시박사를 두어 바닷길을 오가는 상인과 물품을 관리하게 했는데 이는 송대 해외 무역 관리 제도의 시작이었다. 광둥·광시·하이난이 송의 땅이 되어 광둥의 진주와 향료, 상아 같은 남방 특산을 얻었고, 남은 나라는 남당과 오월, 청원군, 북한뿐이었다."
  subjects: [song, southern-han]
  links:
    - { from: song, to: southern-han, note: "광저우 함락과 남한 정복(971)" }
  tags: [war, politics]
  sources: ["『송사』 태조본기·세가 남한 유씨", "『속자치통감장편』 개보 3년·4년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-conquers-southern-tang-975
  year: 974
  endYear: 976
  title:
    ko: "송의 남당 평정과 이욱의 항복(974~976)"
  summary:
    ko: "남당의 이욱은 961년 아버지 이경의 뒤를 이었다. 이경은 958년 후주에 칭신했고, 이욱도 송에 칭신하며 스스로를 황제 대신 국주라 불렀다. 971년 남한이 망하자 국호까지 버리고 강남국주로 낮추었다. 이욱은 불교와 시문을 좋아했으나 나라를 지킬 대비는 허술했고, 통일을 바라는 송에게 남당은 걸림돌이었다. 974년 음력 9월 송 태조는 이욱에게 입조를 요구했고, 이욱이 병을 핑계로 거절하자 조빈과 반미에게 수만 명의 군대(추산)를 주어 정벌에 나서게 했다. 송 태조가 남당 사신 서현에게 침상 곁에서 남이 코 고는 것을 둘 수 없다고 말했다는 유명한 이야기가 전한다. 오월의 전숙도 송의 요청으로 군을 보태 974년 12월 상주를 포위했다. 남당은 금릉(지금 난징)과 창장강을 믿고 송의 공격을 막을 수 있다고 보았으나, 송군은 채석에 부교를 놓아 창장강을 건넌 뒤 금릉을 에워쌌다. 채석 부교 도하는 창장강 도하 작전으로 이름이 높다. 조빈은 병을 핑계로 몸져누웠다가 장수들에게 함부로 사람을 죽이지 않겠다고 맹세하게 한 뒤 일어났다고 한다. 금릉이 에워싸인 뒤에는 수군 지휘관 주령찬이 상류에서 구원을 시도했으나 화공선 전술이 바람 방향 때문에 실패했다고 전하며, 다른 구원 시도도 번번이 막혔다. 975년 음력 11월 금릉이 함락되고 이욱이 항복했다(양력으로는 975년 말 또는 976년 초). 이욱은 카이펑으로 호송되어 위명후에 봉해졌고, 시와 사, 서화에 뛰어나 나라를 잃은 슬픔을 노래한 사로 이름을 남겼다. 남당은 937년 건국된 지 38년 만에 끝났다. 이로써 창장강 하류와 강남 일대가 송의 땅이 되었고, 남은 나라는 오월과 청원군, 북한이었다."
  subjects: [song, southern-tang, wuyue]
  links:
    - { from: song, to: southern-tang, note: "금릉 함락과 남당 정복(975)" }
  tags: [war, politics]
  sources: ["『송사』 태조본기·세가 남당 이씨", "『속자치통감장편』 개보 7년·8년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]
