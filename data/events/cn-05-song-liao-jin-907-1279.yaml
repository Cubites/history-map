- id: wuyue-qingyuan-submit-978
  year: 978
  title:
    ko: "오월·청원군의 납토(978)"
  summary:
    ko: "975년 남당이 무너지자 오월은 홀로 남았다. 오월의 전숙(본명 전홍숙)은 송에 순종하며 남당 정벌에도 군을 보태 협력해 왔다. 976년 음력 10월 송 태조가 죽고 동생 태종이 즉위했고, 태종은 북한을 치기 전에 남쪽을 정리해 두려 했다. 청원군은 작은 나라였으나 천주(지금 취안저우) 항구를 통한 해상 교역으로 재정이 넉넉했다. 청원군의 유종효는 947년 남당군을 몰아내 천주를 독자적으로 다스리고 949년 장주(지금 장저우)까지 얻은 뒤 남당·오월·송 사이에서 균형을 잡았고, 항구 천주를 정비해 대외 교역을 장려했다. 유종효가 962년 죽은 뒤 양자 유소자가 임시로 이었고, 진홍진은 유소자를 밀어내 장한사를 명목상 절도사로 세웠다가 963년 그에게서 실권을 넘겨받았으며, 송이 964년 진홍진을 평해군 절도사로 삼았다. 전숙은 입조할 때 막대한 예물과 함께 오월의 호적과 지도를 올렸다고 전하며, 태종은 그를 후하게 대우했다고 한다. 남쪽과 동쪽이 모두 송 땅으로 둘러싸이자 진홍진은 978년 음력 4월 천주·장주 두 주를 송에 바쳤다. 오월은 후량·후당·후진·후한·후주와 송까지 중원의 모든 왕조에 칭신하며 살아남은 나라였다. 오월 왕 전숙은 여러 차례 송에 사신과 예물을 보내며 환심을 샀고, 같은 해 음력 5월 카이펑에 들어가 오월의 13주 1군(지금의 저장 전부와 장쑤 남부, 상하이, 푸젠 동북부의 복주(지금 푸저우) 일대)을 송에 바쳤다. 오월은 70여 년 만에 끝났다. 이 평화적인 항복은 전쟁의 피해를 줄였고, 오월 시절 항저우에 세운 보숙탑·뇌봉탑은 오월의 불교 문화를 보여 준다. 청원군과 오월이 한 해 사이에 송에 합쳐진 것은 남당이 멸망한 뒤 고립된 처지 때문이었다. 이로써 10국 가운데 남은 것은 북한뿐이었고 태종은 곧 북한으로 향했다(「송의 북한 평정(976~979)」(앞의 사건))."
  subjects: [song, wuyue, qingyuan-jun]
  links:
    - { from: wuyue, to: song, note: "13주 1군을 바침(978)" }
    - { from: qingyuan-jun, to: song, note: "천주·장주를 바침(978)" }
  tags: [diplomacy, politics]
  sources: ["『송사』 태종본기·세가 오월 전씨·세가 진홍진", "『속자치통감장편』 태평흥국 3년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-conquers-northern-han-979
  year: 976
  endYear: 979
  title:
    ko: "송의 북한 평정(976~979)"
  summary:
    ko: "951년 유숭이 세운 북한은 타이위안을 중심으로 산시 중·북부 10여 주를 가진 작은 나라였으나 거란에 의지해 후주와 송에 맞섰다. 북한은 요의 완충지대 구실을 하여 송이 오래 정복하지 못했다. 북한의 유씨는 후한 황실의 후손을 자처했고 해마다 요에 조공했다. 유숭(951~954)의 뒤를 유균(954~968)이 이었고, 968년 유계은이 잠깐 즉위했다가 살해되어 유계원(968~979)이 뒤를 이었다. 북한은 거란에서 받은 책봉과 군사 지원에 의지했지만 해마다 요에 바치는 부담이 커서 재정이 어려웠다고 전한다. 송 태조는 969년 직접 타이위안을 에워쌌으나 요의 구원군에 막혀 물러났다. 타이위안을 둘러싼 산시 북부는 산지와 분지가 이어져 방어하기 쉬웠다. 송은 남쪽 통일에 힘을 쏟는 동안 북한 공략을 뒤로 미루었으나 976년 태조 말년에도 북한을 쳤다. 태조가 죽고 동생 태종이 즉위한 뒤 979년 음력 2월 태종은 친정에 나서 석령관에서 요의 구원군을 물리친 뒤 타이위안을 에워쌌고, 포위전은 석 달 남짓 이어진 끝에 음력 5월 유계원이 항복했다. 송은 타이위안성을 불사르고 물을 대 허문 뒤 근처 양곡에 새 성을 쌓아 이를 대신하게 했다. 송군은 항복 뒤에도 요의 반격에 대비해 북쪽 변경에 병력을 배치했다. 이로써 10국이 모두 끝났고 당 말 이래 70여 년 이어진 분열이 마무리되었다. 그러나 연운 16주는 요의 손에 남았다. 태종은 군대를 쉬게 하지 않고 곧바로 연운으로 향했다(「고량하 전투와 옹희 북벌: 송 태종의 연운 회복 시도(979~986)」(뒤의 사건)). 오월과 청원군의 항복은 「오월·청원군의 납토(978)」(뒤의 사건)에서 다룬다."
  subjects: [song, northern-han, liao]
  links:
    - { from: song, to: northern-han, note: "타이위안 함락과 북한 정복(979)" }
  tags: [war, politics]
  sources: ["『송사』 태종본기·세가 북한 유씨", "『속자치통감장편』 태평흥국 4년", "Peter Lorge, The Reunification of China: Peace through War under the Song Dynasty (Cambridge University Press, 2015)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-taizu-centralization-961
  year: 961
  endYear: 976
  title:
    ko: "송 태조의 중앙 집권과 문치주의(961~976)"
  summary:
    ko: "조광윤은 군인들에게 추대되어 황제에 올랐기에, 같은 일이 되풀이되는 것을 막는 데 힘썼다(건국은 「송의 건국과 고려의 대송 외교」). 5대 53년 동안 5왕조에서 열네 명의 황제가 바뀐 경험이 송의 제도 설계를 이끌었다. 961년 음력 7월 그는 술자리에서 석수신 등 오랜 동료 장수들에게 병권을 내놓고 편히 지내라고 권했다고 전한다. 이른바 술잔 사이에 병권을 거둔 일이다. 장수들은 물러났고 석수신은 천평군 절도사로 나가는 등 공신을 박대하지 않고 명예롭게 물러나게 하는 방식이 쓰였다고 한다. 송은 금군의 지휘권을 여러 사람에게 나누고, 군사는 추밀원, 행정은 중서문하, 재정은 삼사가 맡게 해 권한을 갈랐다. 지방에는 문관이 지주로 가서 번진을 대신하게 했고 통판이라는 감독관을 따로 두었으며, 전운사가 세금을 중앙으로 보내게 했다. 지방의 정예 병사를 금군에 편입해 번진의 힘을 빼앗았다. 973년에는 태조가 직접 합격자를 시험하는 전시를 처음 시행해 과거를 황제의 시험으로 삼았다. 문신이 정치의 중심이 되고 무신이 견제를 받는 문치주의가 자리 잡았다. 군사력이 중앙 금군에 집중되어 수도 방어에는 유리했으나 지방 군사가 약해지고 장수와 병사가 서로 익숙하지 않아 전투력이 떨어졌다는 비판도 있다. 이를 보완하려 송은 큰 상비군을 두었고 이 비용은 재정을 압박했다(「왕안석의 신법과 신구법당의 대립(1069~1104)」(뒤의 사건)). 그 결과 내란과 쿠데타는 줄었다. 976년 음력 10월 태조가 죽고 동생 태종이 뒤를 이었다. 사대부 중심 정치의 흐름은 「주희와 성리학(1130~1200)」(뒤의 사건)에서 이어진다."
  subjects: [song]
  tags: [politics, society]
  sources: ["『송사』 태조본기", "『속자치통감장편』 건륭·개보", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-liao-wars-979
  year: 979
  endYear: 986
  title:
    ko: "고량하 전투와 옹희 북벌: 송 태종의 연운 회복 시도(979~986)"
  summary:
    ko: "979년 음력 5월 북한을 무너뜨린 송 태종은 쉬지 않고 연운 16주를 되찾으려 했다. 송군은 요의 남경(지금 베이징)을 열흘 남짓 에워쌌으나 7월 고량하에서 요군에게 크게 패했다. 야율사가 먼저 싸우다 밀렸고, 저녁에 야율휴가와 야율사진이 양쪽에서 협공해 송군을 깼다. 태종은 화살을 맞고 당나귀 수레를 타고 달아났다고 전하며, 군중에서는 황제가 죽었다는 소문이 돌아 태조의 아들 조덕소를 황제로 세우자는 논의가 있었다고 한다. 야율휴가는 요의 남경 방면을 맡은 명장으로 송군은 그에게 여러 번 패했다. 요는 이후 송의 변경을 거듭 공격했다. 986년 태종은 요에서 성종이 만 14세로 어리고 모후 승천태후가 집권해 정국이 불안하다고 보고 세 갈래로 북벌했다(옹희 북벌, 986년 음력 3월 교전). 조빈의 동로군은 탁주까지 올랐으나 보급이 끊겨 물러나다 기구관에서 요군에 크게 졌고, 전중진의 중로군도 물러났으며, 반미와 양업의 서로군은 응주·삭주·환주·운주 등을 얻었으나 동로군이 무너지자 철수해야 했다. 양업은 후방을 맡았다가 진가곡에서 포로가 되어 단식하다 죽었다. 송 태종은 형 태조와 달리 문신 중심 정치를 한층 강화하면서도 연운 회복을 가장 큰 과제로 삼았다. 두 차례의 북벌 실패는 군사 작전을 황제와 문신, 환관이 감독하는 송의 제도적 한계를 드러냈다. 요는 연운 16주에 대한 지배를 굳혔고 송과 대등한 자리에서 외교를 벌이게 되었다. 이로써 송은 연운 회복을 사실상 포기하고 방어로 돌아섰다. 요는 뒤에 고려도 침입했다(「거란의 1차 침입과 서희의 외교 담판」). 이후의 송·요 관계는 「전연의 맹: 송·요의 형제 관계(1004~1005)」(뒤의 사건)에서 다룬다."
  subjects: [song, liao, northern-han]
  tags: [war]
  sources: ["『송사』 태종본기·양업전", "『요사』 성종본기·야율휴가전", "『속자치통감장편』 태평흥국·옹희", "Tao Jing-shen, Two Sons of Heaven: Studies in Sung-Liao Relations (University of Arizona Press, 1988)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: liao-dual-system-982
  year: 982
  endYear: 1009
  title:
    ko: "승천태후와 요 성종: 이중 통치와 한화(982~1009)"
  summary:
    ko: "요는 916년 야율아보기가 세운 나라로, 947년 태종이 중원에서 국호를 대요라 했다(「거란의 요 건국과 발해 정복」). 요는 거란 유목민을 다스리는 북면관과 한인 주현을 다스리는 남면관을 따로 두는 이중 통치를 했고, 상경·동경·남경을 두었으며 뒤에 중경(1007)·서경(1044)을 더해 5경이 되었다. 야율아보기 시기에 만든 거란 대자(920)와 소자(925)는 거란어를 적는 문자였다. 요에서는 황제 자리에 야율씨가, 황후 자리에 소씨 가문이 오르는 혼인 관계가 이어져, 승천태후 소씨와 야율씨 황실의 결합이 정치의 중심 구조였다. 982년 경종이 죽고 만 10세의 성종이 즉위하자 모후 소씨(승천태후)가 섭정했다. 성종은 어려서부터 한문 서적을 읽고 한시를 지었으며 한인 문화를 받아들이는 데 적극적이었다고 전한다. 승천태후는 한인 대신 한덕양을 중용하고 과거를 확대해 한인 관료를 뽑았으며 법과 세제를 정비해 요의 한화를 촉진했다. 거란 귀족들이 가진 사병과 노예의 문제를 정리하고 군사 편제도 손봤다. 986년 송의 옹희 북벌을 막았고(「고량하 전투와 옹희 북벌: 송 태종의 연운 회복 시도(979~986)」(앞의 사건)), 993년에는 동쪽의 고려를 침입해 압록강 동쪽 땅 문제로 서희와 담판을 벌였다(「거란의 1차 침입과 서희의 외교 담판」). 요가 고려를 침입한 배경에는 송과 맞서면서 동쪽 후방을 안정시키려는 뜻이 있었고, 고려가 송과 가까워지는 것을 막으려 한 것이다. 1004년 직접 군을 이끌고 송을 쳐 전연의 맹을 맺었다(「전연의 맹: 송·요의 형제 관계(1004~1005)」(뒤의 사건)). 승천태후는 1009년 죽을 때까지 정치를 이끌었고, 요는 이 시기에 가장 안정되었다."
  subjects: [liao, song, goryeo]
  tags: [politics, society]
  sources: ["『요사』 성종본기·후비전 경종 후비 소씨·병위지", "『송사』 거란전", "Tao Jing-shen, Two Sons of Heaven: Studies in Sung-Liao Relations (University of Arizona Press, 1988)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: chanyuan-1004
  year: 1004
  endYear: 1005
  title:
    ko: "전연의 맹: 송·요의 형제 관계(1004~1005)"
  summary:
    ko: "986년 옹희 북벌 뒤에도 요는 송의 변경을 되풀이해 압박했다. 1004년 요의 성종과 승천태후는 대군(수십만이라 전하나 확실하지 않음)을 이끌고 남하해 송의 하북 깊숙이 들어왔다. 송에서는 일부 대신이 도읍을 남쪽으로 옮기자고 했으나 재상 구준은 황제의 친정으로 사기를 높이자고 주장했다. 송 진종은 황허강을 건너 전주(지금 허난성 푸양 일대) 북성에 올라 군사를 격려했다. 이 무렵 송군의 쇠뇌에 요의 선봉장 소달름이 죽어 요의 기세도 꺾였고, 깊이 들어온 군대의 보급선도 길어졌다. 송은 황허강을 방패 삼아 전선을 지켰다. 양측은 곧 화의로 돌아섰고 1004년 말(양력 1005년 1월) 조리용이 사신으로 맹약을 맺었다. 이 협상에서 요는 처음에 관남 지역의 반환을 요구했으나 송이 거절하고 재물로 타협했다. 구준은 사신 조리용에게 30만을 넘기면 목을 베겠다고 했다고 전한다. 조건은 송이 해마다 요에 은 10만 냥과 비단 20만 필을 보내고, 두 나라 황제는 형제로 하여 진종이 형이 되며, 국경은 지금대로 하고 새 성곽과 해자를 쌓거나 물길을 새로 내지 않는다는 것이었다. 전연의 맹은 송에게 굴욕이었으나 전쟁 비용에 비하면 감당할 만한 부담이었다는 평가도 있다. 요는 연운 16주를 지키면서 송의 재물까지 얻었다. 두 나라는 이 조약으로 사신을 정기적으로 주고받으며 외교 의례를 갖추었고, 동아시아에 송과 요 두 중심이 서는 국제 질서가 자리 잡았다. 이로써 두 나라 사이에는 큰 전쟁이 없는 시기가 이어졌고 국경의 시장에서 교역이 이루어졌다. 이후 세폐가 늘어난 일은 「서하의 건국과 송·요·서하의 균형」에서 다룬다."
  subjects: [song, liao]
  links:
    - { from: song, to: liao, note: "세폐 지급(1005)" }
  tags: [war, diplomacy]
  sources: ["『송사』 진종본기·구준전", "『요사』 성종본기", "『속자치통감장편』 경덕 원년", "Tao Jing-shen, Two Sons of Heaven: Studies in Sung-Liao Relations (University of Arizona Press, 1988)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: xixia-conquers-hexi-1028
  year: 1028
  endYear: 1038
  title:
    ko: "서하의 허시 회랑 정복: 감주와 사주(1028~1038)"
  summary:
    ko: "서하를 세운 탕구트는 강족 계통의 부족으로, 당 말 이씨가 하주(夏州, 지금 산시성(陝西) 북부)에서 절도사가 되어 세력을 키웠다. 탕구트의 이씨는 당 말 황소의 난 진압에 공을 세워 하국공에 봉해졌다고 한다. 982년 이계봉이 송에 투항했으나 일족인 이계천이 반발해 송과 요 사이에서 세력을 넓혔고, 이계천의 아들 이덕명(재위 1004~1032)이 송과 요 양쪽에 칭신하면서 영토를 다졌다. 탕구트는 황허강 상류 오르도스 남쪽과 허란산 일대에서 목축과 농경을 함께하며 교역의 이익을 얻었다. 이덕명의 아들 이원호는 1003년에 태어나 1028년 아버지의 명으로 군을 이끌고 감주를 공격해 감주 위구르를 무너뜨렸다. 요도 1020년대에 감주 위구르를 쳐 약화시켰고 이원호는 그 틈을 이용했다. 1032년 이덕명이 죽자 이원호가 뒤를 이었다. 이원호는 송에서 받은 조씨 성을 버리고 위명씨를 칭했으며 머리 모양을 독발로 바꾸게 하고 관제를 정비했다. 서하 문자는 야리인영이 한자의 구성을 본떠 만들었고(1036) 불경 번역에도 쓰였다. 같은 해 사주와 과주를 차지해 귀의군을 병합했다. 허시 회랑이 서하의 손에 들어가자 송과 서역을 잇는 비단길 무역은 서하가 쥐게 되었고, 서하는 소금과 말, 비단길 교역을 쥐고 군사력을 키웠다. 서하는 인구와 재정의 규모가 송이나 요보다 작았으나 기병이 강해 전쟁에서 효율적이었다. 둔황 막고굴의 장경동은 11세기 초 어느 때에 봉해졌는데 서하의 침공을 피하려 했다는 설이 있으나 확실하지 않다. 1038년 음력 10월 이원호는 흥경부(지금 인촨)에서 황제를 칭하고 국호를 대하라 했다. 이후 서하는 송·요와 맞서 싸웠다(「서하의 건국과 송·요·서하의 균형」)."
  subjects: [ganzhou-uyghur, guiyi, xixia, liao]
  links:
    - { from: xixia, to: guiyi, note: "사주·과주 병합(1036)" }
  tags: [war, politics]
  sources: ["『송사』 하국전", "『요사』 서하외기", "Ruth W. Dunnell, The Great State of White and High: Buddhism and State Formation in Eleventh-Century Xia (University of Hawai'i Press, 1996)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: song-xixia-qingli-1040
  year: 1040
  endYear: 1045
  title:
    ko: "송·서하 전쟁과 경력 신정(1040~1045)"
  summary:
    ko: "이원호가 1038년 황제를 칭하자 송은 이원호의 관작을 거두고 서하와의 교역을 막았다. 서하는 1040년 정월 삼천구, 1041년 호수천, 1042년 정천채에서 송군에 연달아 큰 승리를 거두었다. 송 인종은 범중엄과 한기를 섬서에 보내 방어를 맡겼고, 두 사람은 서북 경략을 분담했다. 한기는 서하를 공격하자고 했고 범중엄은 방어를 우선하자고 했는데, 호수천의 대패는 한기가 주도한 공세 전략의 실패로 알려져 있다. 범중엄은 대순성 같은 요충에 성채를 쌓아 서하의 공격을 막았고 서하 사람들이 가슴속에 갑병 수만이 있다고 평했다고 전한다. 정천채 전투에서는 송의 장수 갈회민 등이 전사했다. 그러나 서하도 교역이 끊겨 소금·곡식·비단이 부족해졌고 요가 송에 압력을 가하며 서하를 견제하자 협상으로 돌아섰다. 1044년 두 나라는 화의를 맺었다. 이원호는 송에 신하를 칭했고(황제는 국내에서만 칭함), 송은 해마다 은 7만 2천 냥, 비단 15만 3천 필, 차 3만 근(명절 하사 포함)을 서하에 주기로 했다. 이를 경력 화약이라 한다(「서하의 건국과 송·요·서하의 균형」). 송은 서하와의 전쟁 중 변경에 큰 군대를 두고 군량 수송에 큰 비용을 썼으며, 이때 늘린 군대가 그대로 상비군이 되어 재정을 짓눌렀다. 이 화약과 요에 대한 세폐 증액으로 송의 부담은 크게 늘었고 군대는 100만 명이 넘게 불어났다(추산). 이에 인종은 1043년 범중엄·한기·부필 등을 중용해 관리 임용, 과거, 군사, 농업, 부역 등의 개혁안 10조를 올리게 했다. 경력 신정이라 부르는 이 개혁은 기득권의 반발로 1045년 범중엄 등이 지방으로 나가며 거의 중단되었다."
  subjects: [song, xixia, liao]
  links:
    - { from: song, to: xixia, note: "경력 화약, 세사 지급(1044)" }
  tags: [war, politics]
  sources: ["『송사』 인종본기·범중엄전·하국전", "『속자치통감장편』 경력", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: song-economy-technology-960
  year: 960
  endYear: 1127
  title:
    ko: "송의 경제 발전과 기술 혁신(960~1127)"
  summary:
    ko: "당 말과 5대의 전란으로 북방이 황폐해지는 동안 창장강 하류와 남부는 비교적 안정되어 개발이 빨랐다. 1012년 송 진종은 푸젠에서 가뭄에 강하고 일찍 여무는 점성도를 들여와 회남과 강남에 보급하게 했고, 개간과 이모작으로 곡물 생산이 늘었다. 인구는 12세기 초 1억을 넘었다는 추산이 있다. 카이펑 같은 큰 도시에서는 상업 구역과 주거 구역을 가르던 오랜 규제가 무너져 밤에도 가게가 열렸고, 시골의 정기 시장과 도시의 상점이 늘었다. 장택단의 「청명상하도」는 12세기 초 카이펑의 번화한 모습을 그렸다. 차·소금·술은 국가가 전매했고 광산, 제철, 도자기, 비단 생산이 번성했다. 동전 수요가 커져 송은 구리 동전을 대량으로 주조하고도 부족을 겪었고, 큰 거래에는 무거운 동전 대신 어음이 쓰였다. 쓰촨에서는 상인들이 발행한 종이 증서 교자를 1020년대에 정부가 관영으로 바꾸었는데, 그 배경이 된 철전의 불편은 「송의 후촉 평정(964~966)」(뒤의 사건)에서 다룬다. 송은 971년 광저우에 시박사를 둔 데 이어 항저우·명주·천주(지금 취안저우) 등에도 두어 해외 무역을 관리하고 세금을 거두었다. 아랍 상인과 함께 고려 상인도 송과 활발히 교역했다(「벽란도와 대외 무역」). 기술에서는 필승이 1040년대에 점토 활자를 만들었다고 심괄의 『몽계필담』이 전하고, 12세기 초 문헌에는 나침반을 항해에 쓴 기록이 나온다. 1044년 『무경총요』에는 화약 제조법이 실려 있고 화약 무기가 군에 쓰이기 시작했다. 목판 인쇄가 널리 퍼져 책과 지식이 보급되었다. 이렇게 농업이 늘고 상업이 발달하면서 송 사회는 귀족보다 과거로 뽑힌 사대부와 부유한 상인, 지주가 활약하는 사회로 바뀌었다. 학자들은 이를 당송 변혁이라 부르기도 한다."
  subjects: [song, goryeo]
  tags: [economy, society]
  sources: ["『송사』 식화지", "『몽계필담』", "Richard von Glahn, The Economic History of China: From Antiquity to the Nineteenth Century (Cambridge University Press, 2016)", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 5, part 2: Sung China, 960–1279 (John W. Chaffee·Denis Twitchett 편, Cambridge University Press, 2015)"]

- id: wang-anshi-reforms-1069
  year: 1069
  endYear: 1104
  title:
    ko: "왕안석의 신법과 신구법당의 대립(1069~1104)"
  summary:
    ko: "송 신종은 1067년 즉위하자 요와 서하에 주는 세폐·세사와 불어난 군비로 바닥난 재정을 되살리려 했다. 그는 왕안석을 중용했고 1069년 제치삼사조례사를 두어 신법을 시작했다. 주요 신법은 농민에게 봄에 곡식과 돈을 빌려주고 가을에 이자를 받는 청묘법, 물가를 조절하고 유통을 맡는 균수법·시역법, 부역을 돈으로 바꾸는 모역법, 토지를 측량해 세를 고르게 하는 방전균세법, 농가를 묶어 치안과 병력을 맡기는 보갑법, 말을 길러 바치게 하는 보마법 등이다. 과거도 시와 부 대신 경서의 뜻을 묻게 고쳤다. 청묘법은 농민을 고리대에서 구하려는 뜻이 있었으나 관리가 대출을 억지로 할당하고 이자를 거두는 폐단이 생겼다는 비판이 컸다. 신법으로 국가 재정이 한때 나아졌다는 평가도 함께 있어, 왕안석의 개혁은 시행하는 관리의 자질에 크게 좌우되었고 의도와 시행 사이의 간극이 반대파에게 구실을 주었다. 사마광·한기·구양수·소식 등은 이득을 좇아 백성을 수탈하는 정책이라며 반대했다. 왕안석은 1074년 재상에서 물러났다 복귀했고 1076년 은퇴했으며, 신종은 직접 신법을 이어 갔다. 그 사이 요가 하동 국경을 다시 정하자고 압박하자 송은 1070년대 중반 땅을 내주었다. 1085년 신종이 죽고 어린 철종 아래 선인태후가 섭정하자 사마광이 재상이 되어 신법을 대부분 폐지했다(원우 갱화). 1093년 선인태후가 죽고 철종이 친정하자 이듬해부터 신법파가 돌아와 구법파를 내쫓았다(소술). 1100년 철종이 죽고 동생 휘종이 즉위하자 1102년 채경이 구법파 명단을 비석에 새기기 시작했고, 1104년에는 309명의 이름을 새긴 원우당적비를 세워 관직 진출을 막았다. 정책 논쟁은 파벌 싸움이 되어 조정을 약하게 했다."
  subjects: [song, liao]
  links:
    - { from: song, to: liao, note: "하동 국경 땅을 내줌(1076)" }
  tags: [politics, economy]
  sources: ["『송사』 신종본기·왕안석전·사마광전", "『속자치통감장편』 희녕·원우", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: maritime-alliance-1118
  year: 1114
  endYear: 1123
  title:
    ko: "아구다의 봉기와 해상의 맹(1114~1123)"
  summary:
    ko: "요는 천조제 때 정치가 어지러워 동북의 여진 부족을 가혹하게 수탈했고, 해동청이라는 사냥용 매를 바치게 하는 일이 불만의 하나로 꼽힌다. 천조제가 연회에서 여진 족장들에게 춤을 추라고 했으나 아구다가 거절했다는 이야기도 전한다. 여진은 쑹화강과 헤이룽강 유역에서 반농반렵 생활을 하던 만주의 사람들로 완옌부가 부족 연맹을 이끌었다. 아구다는 맹안·모극이라는 군사·행정 조직으로 병력을 묶어 강한 군대를 만들었다. 완옌부는 1114년 영강주를 공략하고 출하점에서 요군을 깨뜨렸으며, 이듬해 아구다가 황제에 올라 금을 세웠다(「금 건국」). 금의 성장을 본 송 휘종은 요의 연운 땅을 되찾으면 큰 업적이 되리라 기대했고, 환관 동관을 앞세워 금과 손잡으려 했다. 송은 1118년부터 바닷길로 사신을 보내 교섭했고, 1120년 맺은 해상의 맹에서 금이 장성 이북의 요 땅을, 송이 연경(유주) 일대를 공격하기로 하고 송이 요에 주던 세폐를 금에 넘기기로 했다. 이는 전연의 맹을 깬 것이었다(「전연의 맹: 송·요의 형제 관계(1004~1005)」(앞의 사건)). 금은 1120~1122년 요의 상경과 중경을 차례로 차지했으나, 송군은 1122년 연경 공격에 거듭 실패했고 금군이 대신 연경을 차지했다. 1123년 금은 연경 등 7주만 송에 돌려주었고, 송은 세폐 외에 해마다 100만 관의 대세전을 금에 내기로 했다. 그 사이 금은 성안의 사람과 재물을 옮겨 가 연경은 빈 성이 되었다. 아구다는 1123년 죽고 동생 오걸매(태종)가 뒤를 이었다. 이 일로 금은 송의 약함을 알았다. 요가 멸망하고 금이 송을 침공하는 과정은 「요 멸망」과 「금의 송 침공과 정강의 변(1125~1127)」(뒤의 사건)에서 다룬다."
  subjects: [jin, jurchen, liao, song]
  links:
    - { from: jin, to: liao, note: "요 상경·중경 점령(1120~1122)" }
    - { from: jin, to: song, note: "연경 등 7주 반환(1123)" }
    - { from: song, to: jin, note: "세폐와 대세전 지급(1123)" }
  tags: [war, diplomacy]
  sources: ["『금사』 태조본기", "『송사』 휘종본기·동관전", "『요사』 천조황제기", "Tao Jing-shen, The Jurchen in Twelfth-Century China: A Study of Sinicization (University of Washington Press, 1976)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: jin-conquers-northern-song-1125
  year: 1125
  endYear: 1127
  title:
    ko: "금의 송 침공과 정강의 변(1125~1127)"
  summary:
    ko: "1125년 금은 요의 천조제를 사로잡아 요를 멸망시켰다(「요 멸망」). 금은 송이 요의 잔당과 금에서 투항한 장수를 받아들였다는 구실로 그해 음력 10월 두 갈래로 송을 쳤다. 서로군은 완안종한이 타이위안 쪽으로, 동로군은 완안종망이 연경에서 남쪽으로 내려왔다. 금이 송을 이렇게 빨리 무너뜨린 데에는 송 조정의 혼란이 컸다. 휘종은 서화에 몰두해 정치를 채경과 동관 같은 총신에게 맡겼고, 진귀한 돌과 나무를 나르는 부담이 쌓여 1120년 방랍의 난 같은 반란이 일어났다. 놀란 휘종은 12월 태자 조환(흠종)에게 제위를 물려주고 태상황이 되어 남쪽으로 달아났다. 1126년 음력 정월 금 동로군이 황허강을 건너 카이펑을 에워쌌고 이강이 방어를 지휘했다. 송 조정은 주전론과 화의론으로 갈렸다. 송은 막대한 금과 은, 비단을 보내고 3진을 넘기기로 하고 화의를 맺었고, 화의파가 이강을 파면하자 태학생 진동 등 수많은 사람이 항의해 이강이 복직되기도 했다. 송이 약속을 지키지 않자 금은 그해 가을 다시 쳐들어왔다. 11월 두 갈래의 금군이 카이펑에서 합류해 윤11월 25일(양력 1127년 1월 9일) 성이 함락되었다. 금군은 도성 외곽을 약탈하며 궁궐의 보물을 가져갔고 황족과 관리의 가솔도 포로가 되었다. 연호 정강의 이름을 딴 이 사건을 정강의 변이라 한다. 금은 이듬해 휘종과 흠종을 폐위하고 신하 장방창을 초의 황제로 세운 뒤, 음력 4월 철수하면서 두 황제와 황족·관리·기술자 등 1만 4천 명 넘는 사람들을 북쪽으로 끌고 갔다(추산). 북송은 이로써 멸망했다. 정강의 변과 남송의 성립은 한국사 「북송 멸망과 남송 성립」에서도 다룬다."
  subjects: [song, jin, liao]
  links:
    - { from: jin, to: liao, note: "천조제 포로, 요 멸망(1125)" }
    - { from: jin, to: song, note: "카이펑 함락과 황제 북행(1126~1127)" }
  tags: [war, politics]
  sources: ["『금사』 태종본기", "『송사』 흠종본기·이강전", "『정강요록』", "Tao Jing-shen, The Jurchen in Twelfth-Century China: A Study of Sinicization (University of Washington Press, 1976)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]
  places: [{ name: 카이펑 포위, at: [114.31, 34.8], year: 1126 }]

- id: southern-song-founding-1127
  year: 1127
  endYear: 1138
  title:
    ko: "남송의 성립과 고종의 남천(1127~1138)"
  summary:
    ko: "정강의 변 때 금에 잡히지 않은 휘종의 아홉째 아들 조구는 1127년 음력 5월 상추(옛 응천부)에서 즉위했으니 남송의 고종이다. 금이 세운 괴뢰 정권 초의 장방창은 곧 물러났다. 고종은 재상으로 이강을 불렀으나 두 달 남짓 만에 물러나게 하고 황잠선·왕백언 같은 화의파를 가까이했으며, 이강을 비판한 태학생 진동 등을 처형했다. 카이펑 유수 종택은 하북 의병을 모아 금에 맞서며 거듭 환도를 청했으나 1128년 병으로 죽었다. 후임 두충은 1129년 카이펑을 버리고 건강으로 물러났다가 그해 말 금에 항복했다. 고종은 양저우에서 항저우로, 다시 남쪽으로 피신했다. 1129년 음력 3월 묘유의 변으로 고종은 만 1세의 아들 조부에게 제위를 넘기고 물러났다가 한 달 남짓 뒤 복위했다. 금의 올출이 1129년 말~1130년 초 창장강을 건너 항저우와 명주까지 추격하자 고종은 바다로 달아났다. 한세충이 1130년 황천탕에서 올출의 퇴로를 오래 막았고, 악비는 건강(금릉)을 되찾았다. 올출은 북으로 물러났다. 금은 1130년 유예를 앞세워 괴뢰 나라 제를 세웠다. 고종은 1130~1131년 월주(지금 사오싱)에 머문 뒤 1132년 무렵 임안(항저우)으로 돌아갔고, 1138년 이곳을 임시 도읍인 행재소로 확정했다. 남송은 영토가 화이허강 남쪽으로 줄었으나 경제 중심지인 창장강 유역과 동남 해안을 가져 부유했다. 고종은 아버지 휘종과 형 흠종이 금에 잡혀 있는 처지여서, 이들을 데려오자는 주장과 정통성 문제가 정치에 늘 따라다녔다. 한세충·악비·장준·유광세 같은 장수들이 병력을 모아 창장강 방어선을 지켰으나 조정은 이들의 힘을 경계했다. 이렇게 세워진 남송은 창장강과 화이허강 일대에서 금과 맞섰다. 이 일은 「북송 멸망과 남송 성립」에서도 짧게 다룬다."
  subjects: [song, jin]
  tags: [politics, war]
  sources: ["『송사』 고종본기·종택전", "『금사』 올출전", "『건염이래계년요록』", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)"]

- id: yue-fei-shaoxing-1134
  year: 1134
  endYear: 1142
  title:
    ko: "악비와 소흥 화의(1134~1142)"
  summary:
    ko: "남송 초 악비는 하북서로 탕음(지금 허난성 탕인) 출신으로 한세충·장준·유광세와 함께 중흥 4장으로 꼽혔다. 그가 이끈 악가군은 얼어 죽어도 집을 헐지 않고 굶어 죽어도 약탈하지 않는다는 군령으로 알려졌고, 이 군령은 백성의 지지를 얻은 이유로 자주 거론된다. 1134년 악비는 금이 세운 괴뢰 나라 제에게 빼앗긴 샹양 등 6군을 되찾았다. 1137년 금이 제를 없애고 1138~1139년 금과 남송이 화의해 하남을 돌려받기로 했으나, 금의 올출이 1140년 화의를 깨고 하남을 다시 차지했다. 이 무렵 금에서도 하남 땅을 직접 다스리기 어려워 송과 화의하는 것이 유리하다는 판단이 있었다. 악비는 북상해 언성에서 금군을 격파하고 카이펑 가까이 주선진까지 이르렀으나, 고종과 재상 진회는 철군을 명령하고 열두 장의 금패로 그를 불러들였다. 악비가 소환될 때 올출은 악비를 꺾기 전에는 송을 이길 수 없다고 탄식했다고 전한다. 1141년 음력 4월 악비·한세충·장준은 병권을 내놓고 추밀원으로 옮겨졌고, 10월 악비는 투옥되었다. 진회는 막수유, 곧 있을 법하다는 죄목으로 악비를 가두었다고 전한다. 1141년 음력 11월 송은 금과 화의를 맺었다(소흥 화의, 이듬해 비준). 송은 금에 신하를 칭하고 해마다 은 25만 냥과 비단 25만 필을 보내며 국경은 화이허강과 대산관을 잇는 선으로 한다는 것이었다. 악비는 음력 12월(양력 1142년 1월) 옥중에서 만 38세로 죽었다. 악비는 어머니가 등에 충성의 글자를 새겨 주었다는 일화로 백성들의 사랑을 받았다고 전한다. 남송 조정에서는 화의로 안정을 얻는 길과 북벌로 실지를 회복하는 길이 갈렸고, 화의를 이끈 것은 진회보다 고종의 뜻이 컸다는 평가도 있다."
  subjects: [song, jin]
  links:
    - { from: song, to: jin, note: "소흥 화의, 신하를 칭하고 세폐 지급(1141)" }
  tags: [war, diplomacy]
  sources: ["『송사』 악비전·진회전·고종본기", "『금사』 올출전", "『건염이래계년요록』", "Tao Jing-shen, The Jurchen in Twelfth-Century China: A Study of Sinicization (University of Washington Press, 1976)", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]

- id: jin-hailing-caishi-1161
  year: 1161
  endYear: 1165
  title:
    ko: "해릉왕의 남침과 송·금 화의(1161~1165)"
  summary:
    ko: "금의 해릉왕 완안량은 1149년 음력 12월(양력 1150년 1월) 희종을 죽이고 즉위해 1153년 도읍을 상경에서 중도(연경, 지금 베이징)로 옮겼다. 1157년에는 상경의 옛 궁궐과 귀족 저택을 불태우게 했는데, 이는 여진 귀족의 옛 근거지를 없애려는 조치로 반발을 불렀다. 금에서는 여진 귀족이 화북의 한인 사회를 다스렸는데 해릉왕의 한화 정책과 중도 천도는 여진 귀족의 불만을 키웠다. 그는 송을 정복해 천하를 통일하려 병력과 물자를 거듭 징발했고, 여진과 거란, 한인의 불만을 샀다. 해릉왕은 시와 글에 능한 한화된 군주였고 남송 정벌을 위해 전함 건조에도 힘썼다고 한다. 1161년 음력 9월 해릉왕은 약 60만 명(사료의 수치로 과장일 수 있음)의 대군을 이끌고 남침했다. 같은 해 요양에서 완안옹(세종)이 황제에 올랐다는 소식이 전해졌다. 해릉왕의 군대는 오랜 징발로 지쳐 있었고 수군이 약했다. 송에서는 문신 우윤문이 급히 군을 지휘해 채석기에서 금군의 도하를 막아 이겼고, 이 싸움에서 송 수군은 화약을 쓴 무기를 쓴 것으로 전한다. 금군 내부에서도 해릉왕에 대한 반감이 커져 해릉왕은 양저우에서 부하 장수들에게 살해되었다(음력 11월). 남침은 끝났고 세종은 군을 거두고 안정을 꾀해 소요순이라 불리는 시기를 열었다. 남송에서는 1162년 고종이 퇴위하고 태조의 후손인 효종이 즉위했다. 효종은 1163년 장준·이현충에게 북벌을 맡겼으나 부리에서 패했고, 1164년 말~1165년 융흥 화의로 송은 금의 조카가 되고 세폐를 은 20만 냥과 비단 20만 필로 줄인 것으로 전한다(소흥 화의의 25만에서 줄었다)."
  subjects: [jin, song]
  links:
    - { from: song, to: jin, note: "융흥 화의, 세폐 지급(1165)" }
  tags: [war, diplomacy]
  sources: ["『금사』 해릉본기·세종본기", "『송사』 효종본기·우윤문전", "Tao Jing-shen, The Jurchen in Twelfth-Century China: A Study of Sinicization (University of Washington Press, 1976)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]
