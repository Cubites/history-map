# 중국 사건 5차 묶음: 5대 10국에서 남송의 멸망까지 (907 ~ 1279, 작업 cn-05)
# 범위: 후량의 건국과 번진의 분립, 유수광의 연과 백향 전투, 후당의 건국과 전촉 정복, 후당 명종과 말제, 후촉의 건국, 후한·후주의 교체, 후주 세종의 개혁·회남 정벌, 오·남당·오월·민·초·남한과 귀의군·감주 위구르,
#   조광윤의 문치주의와 송의 통일 전쟁(형남·후촉·남한·남당·오월·북한), 송·요 전쟁과 전연의 맹, 승천태후의 요, 서하의 허시 회랑 정복과 송·서하 전쟁·경력 신정, 송의 경제와 기술, 왕안석의 신법과 당쟁,
#   해상의 맹과 정강의 변, 남송의 성립, 악비와 소흥 화의, 해릉왕의 남침과 융흥 화의, 몽골의 서하·금 정복, 몽골과 남송의 전쟁(쓰촨·샹양), 임안 함락과 애산 전투, 주희와 성리학.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 907~1279년 지도에서 생기거나 끝난 항목(10국과 그 사이 나라, 귀의군·감주 위구르 등)과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 송의 경제와 기술 사건에서 벽란도의 송·고려 교역(고려를 subjects로), 요의 이중 통치 사건에서 거란의 고려 침입(고려를 subjects로), 주희 사건에서 안향의 성리학 소개를 가리켰다.
#   한국사 03·04번 파일에 이미 있는 중국 사건(당의 멸망, 거란의 요 건국, 연운 16주 확보와 오대의 교체, 송의 건국, 서하의 건국과 경력 화약, 금 건국, 요 멸망, 북송 멸망과 남송 성립, 서하 멸망, 금 멸망, 몽골의 대리 정복, 원 국호 제정)은 다시 만들지 않았다.
#   사건 글에서는 「제목」으로 가리킨다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 달력: 1912년 앞 중국의 날짜는 음력이라 달만 적은 것도 음력 달이다. 음력 11·12월의 일은 양력으로 이듬해 초일 수 있다.
# 이름 규칙: 신해혁명(1911) 앞 인물은 한자음(주전충·조광윤·왕안석·악비), 옛 지명은 한자음(변주·금릉·임안·하동), 지금도 쓰는 지명은 중국어 표기(카이펑·뤄양·타이위안·청두·난징·항저우·광저우), 옛 주 이름은 한자음에 '(지금 …)'을 붙임.
#   금(金)의 인물은 굳은 표기(아구다·올출), 몽골 인명은 굳은 표기(칭기즈 칸·쿠빌라이·몽케·바얀). 왕조 이름이 겹치는 후진(後晉)·후한(後漢)·진(晉, 하동)은 한자를 병기했다.
# places: 전쟁 보기가 없는 싸움·포위 가운데 위치가 분명한 곳만 달았다.
# 서술은 새로 작성. 출처는 사료(『구오대사』 『신오대사』 『송사』 『요사』 『금사』 『자치통감』 등)와 표준 개설서. 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: zhu-wen-later-liang-907
  year: 904
  endYear: 913
  title:
    ko: "주전충의 후량 건국과 번진의 분립(904~913)"
  summary:
    ko: "「황소의 난(874~884)」(앞의 사건)에 가담했다가 당에 투항한 주온은 전충이라는 이름을 받고 변주(지금 카이펑)의 선무 절도사가 되어 황허강 중·하류의 번진을 차례로 눌렀다. 904년 그는 소종을 장안에서 뤄양으로 옮기게 한 뒤 시해하고 어린 애제를 세웠다. 주전충이 변주를 맡게 된 것은 당 조정이 황소의 난 진압을 번진에 맡기다 그 번진에게 무너지는 과정을 상징한다. 905년에는 백마역에서 당의 귀족 대신 서른 명 남짓을 죽여 시신을 황허강에 던졌다고 전하며, 이로써 귀족 출신 관료는 큰 타격을 입었다. 907년 음력 4월 애제의 선양을 받아 카이펑에서 황제에 올랐고(후량 태조) 이름을 황(晃)으로 고쳐 카이펑을 동도로 삼았다. 당은 289년 만에 끝났으며 애제는 이듬해 살해되었다. 카이펑은 황허강과 대운하가 만나는 교통의 요지라 군량과 물자를 모으기 쉬웠다. 그러나 새 황제를 모두가 받아들인 것은 아니었다. 하동의 진왕 이극용(진(晉))은 당의 연호를 계속 썼고, 봉상의 기왕 이무정(기(岐))과 회남의 오(吳, 양씨)도 같았다. 청두의 왕건은 907년 음력 9월 따로 황제를 칭했다(전촉). 후량은 전류와 마은을 각각 오월왕과 초왕에 봉했고(907) 왕심지를 민왕, 유은을 남평왕에 봉해(909) 남쪽 정권들을 달랬다. 이렇게 중원의 5대 왕조와 각지의 10국이 나란히 선 5대 10국 시대가 열렸다. 912년 음력 6월 주전충은 아들 주우규에게 살해되었고, 주우규는 이듬해 음력 2월 다른 아들 주우정에게 제거되었다. 말제 주우정은 카이펑을 도읍으로 삼았으나 이후 후량은 하북에서 연이어 밀렸다. 당의 멸망 자체와 후삼국의 대중 외교는 「당의 멸망과 오대의 시작, 후삼국의 대중 외교」에서 다룬다."
  subjects: [tang, later-liang, jin-hedong, qi-fengxiang, former-shu, yang-wu, wuyue, ma-chu, min-kingdom, southern-han]
  links:
    - { from: later-liang, to: tang, note: "애제의 선양을 받아 당을 이음(907)" }
  tags: [politics]
  sources: ["『구오대사』 양서 태조기", "『신오대사』 양본기", "『자치통감』 후량기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)", "Wang Gungwu, The Structure of Power in North China during the Five Dynasties (University of Malaya Press, 1963)"]

- id: yan-liu-baixiang-907
  year: 907
  endYear: 913
  title:
    ko: "유수광의 연과 하북의 번진: 백향 전투와 연의 멸망(907~913)"
  summary:
    ko: "노룡 절도사 유인공의 아들 유수광은 907년 여름 유주(지금 베이징 서남쪽)를 지키며 아버지를 가두고 권력을 쥐었다. 유주는 지금 베이징의 전신이 되는 도시로, 중원과 거란 같은 북방 세력이 맞닿는 곳이었고 유인공은 당 말부터 이곳을 다스려 왔다. 후량은 908년 가을 유수광을 노룡 절도사로 삼고 연왕에 봉했다. 909년 유수광은 형 유수문을 사로잡았고 이듬해 봄 의창군(창주 일대)이 항복해, 베이징·톈진과 허베이 북부를 아우르는 세력이 되었다. 한편 후량 태조는 하북의 성덕군(진주(鎭州), 지금 정딩)과 의무군(정주(定州), 지금 딩저우)을 합치려 했다. 성덕의 왕용과 의무의 왕처직은 910년 후량과 끊고 하동의 이존욱(진(晉))과 손잡았다. 911년 봄 백향(柏鄕, 지금 허베이성 바이샹현)에서 진·성덕·의무 연합군이 왕경인이 이끈 후량의 대군을 크게 깨뜨려 후량의 하북 진출은 꺾였고, 하북의 번진들은 후량에 맞설 용기를 얻었다. 후량은 이 패전 뒤에도 하북 진출을 포기하지 않았으나 끝내 뜻을 이루지 못했다. 911년 음력 8월 유수광은 유주에서 대연 황제를 칭하고 연호를 응천이라 했으며, 이어 의무군을 쳤으나 진이 의무군을 도왔다. 912년 진의 장수 주덕위가 유주를 에워쌌고, 913년 말(음력 11월) 유주가 함락되자 유수광은 달아나다 붙잡혔다. 진은 유주와 의창군을 얻어 황허강 북쪽의 가장 큰 세력이 되었다. 연이 무너진 뒤 이 변경 지대에는 진과 후량뿐 아니라 거란의 관심도 쏠렸는데, 그 결과는 「거란의 연운 16주 확보와 오대의 교체」에서 다룬다. 성덕군과 의무군의 마지막은 「이존욱의 하북 평정과 후당의 건국(915~923)」(뒤의 사건)에서 다룬다."
  subjects: [yan-liu, jin-hedong, later-liang, chengde, yiwu]
  links:
    - { from: jin-hedong, to: yan-liu, note: "유주 함락과 연의 멸망(913)" }
  tags: [war, politics]
  sources: ["『구오대사』 유수광전", "『신오대사』 유수광전", "『자치통감』 후량기", "The Cambridge History of China, vol. 5, part 1: The Sung Dynasty and Its Precursors, 907–1279 (Denis Twitchett·Paul Jakov Smith 편, Cambridge University Press, 2009)"]
  places: [{ name: 백향 전투, at: [114.69, 37.48], year: 911 }, { name: 유주 포위, at: [116.36, 39.88], year: 912 }]

- id: li-cunxu-later-tang-923
  year: 915
  endYear: 923
  title:
    ko: "이존욱의 하북 평정과 후당의 건국(915~923)"
  summary:
    ko: "908년 아버지 이극용의 뒤를 이은 이존욱은 사타 출신 군대를 이끌고 후량과 황허강 북쪽을 다투었다. 그는 직접 기병을 이끌고 앞장서 싸운 용맹한 장수였다. 915년 후량의 천웅군(위박, 위주)에서 병사들이 반란을 일으키자 이존욱은 위주(지금 허베이성 다밍)에 들어갔고, 916년까지 위박과 형·명·자주를 차지해 황허강 북쪽의 후량 땅을 거의 빼앗았다. 위박의 아군은 당 말부터 절도사를 세우고 쫓을 만큼 힘이 센 직업 군인 집단이었는데, 이존욱은 이들을 거두어 친위 부대로 삼았다. 이존욱의 승리에는 이극용 때부터 다져진 사타 기병의 기동력과 후량 내부의 반란, 그리고 후량 장수들이 서로 의심하며 힘을 모으지 못한 사정이 겹쳐 있었다. 921년 성덕군에서 양자 장문례가 왕용을 죽이고 후량에 붙으려 하자, 진(晉)은 이듬해 진주(鎭州)를 함락해 장문례를 제거하고 성덕군을 합쳤다. 의무군에서는 양자 왕도가 정변으로 아버지 왕처직을 가두고 권력을 쥐었으며, 이후 진의 번속이 되었다(921~922). 한편 916년 거란의 야율아보기가 황제를 칭해 북쪽 변경에 새 세력이 섰다(「거란의 요 건국과 발해 정복」). 923년 음력 4월 이존욱은 위주에서 황제에 올라 나라 이름을 당이라 했다. 이극용의 집안은 당 황실에게서 이씨 성을 받았기에 당의 계승을 내세운 것이며, 역사에서는 후당이라 부른다. 같은 해 음력 10월 이사원이 카이펑을 기습하자 말제 주우정은 측근 황보린에게 자신을 죽이게 했고 황보린도 자결했다. 이존욱이 카이펑에 들어와 후량은 멸망했다. 후당은 뤄양을 도읍으로 삼았다. 후당의 쓰촨 정복과 이존욱의 죽음은 「후당의 전촉 정복과 장종의 죽음(925~926)」(뒤의 사건)에서 다룬다."
  subjects: [jin-hedong, later-liang, chengde, yiwu, later-tang]
  links:
    - { from: jin-hedong, to: chengde, note: "진주 함락과 성덕군 병합(922)" }
    - { from: jin-hedong, to: later-liang, note: "위박 확보(915~916)와 후량 멸망(923)" }
