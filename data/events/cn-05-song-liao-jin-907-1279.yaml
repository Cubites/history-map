- id: mongol-song-wars-1235
  year: 1235
  endYear: 1259
  title:
    ko: "몽골의 남송 공격: 쓰촨과 창장강 중류(1235~1259)"
  summary:
    ko: "금이 망하자 남송은 몽골이 약속한 하남을 되찾으려 1234년 군을 보내 카이펑과 뤄양에 들어가려 했으나(입락) 보급이 끊기고 몽골군에 막혀 물러났다. 몽골은 이를 구실로 1235년 남송 정벌에 나섰다. 오고타이의 아들 쿠텐은 쓰촨을, 쿠추는 후베이를 쳤고, 1236년 쓰촨의 청두가 몽골의 손에 떨어지고 샹양이 한때 항복했다. 남송은 1239년 맹공의 활약으로 샹양을 되찾고 몽골을 막았다. 남송에는 맹공 같은 유능한 장수가 있었으나 조정이 이들을 견제하는 정치가 이어졌다. 1241년 오고타이가 죽자 몽골 내부 사정으로 공세가 늦춰졌다. 섭정기와 귀위크 칸(재위 1246~1248)을 거쳐 1251년 몽케가 칸이 되자 남송 공략이 다시 본격화했다. 몽케는 쿠빌라이와 훌라구에게 각각 중국 남부와 서아시아를 맡겨 대규모 원정을 벌였고, 남송 공략도 몽골 제국의 큰 전략 속에서 움직였다. 쿠빌라이는 1253~1256년 대리를 정복해 남송을 남서쪽에서 에워쌌다(「몽골의 대리 정복」). 1258년 몽케는 쓰촨을 침공했고 우량카다이는 대월을 거쳐 광시로 향했다. 1259년 음력 7월 몽케는 조어성(지금 충칭시 허촨)을 에워싸다 죽었다. 같은 해 쿠빌라이가 후베이의 악주를 공격하자 남송 재상 가사도가 몰래 강화를 청했다. 몽케의 죽음 소식에 쿠빌라이는 북으로 돌아가 칸의 자리를 차지하려 했다(「쿠빌라이의 즉위와 아릭 부케 전쟁, 대도 건설(1260~1272)」(뒤의 사건)). 몽골의 남송 공략은 다른 지역보다 오래 걸렸다. 남쪽은 강과 호수, 산이 많아 기병 중심의 몽골군이 힘을 쓰기 어려웠고, 송이 많은 성을 쌓아 방어했기 때문이다. 쓰촨 방어는 점점 무너졌다."
  subjects: [song, mongol-empire]
  links:
    - { from: mongol-empire, to: song, note: "쓰촨·후베이 침공(1235~1259)" }
  tags: [war]
  sources: ["『송사』 이종본기·맹공전", "『원사』 헌종본기", "The Song-Yuan-Ming Transition in Chinese History (Paul Jakov Smith·Richard von Glahn 편, Harvard University Asia Center, 2003)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]
