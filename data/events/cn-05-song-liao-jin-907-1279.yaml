- id: xiangyang-siege-1268
  year: 1268
  endYear: 1273
  title:
    ko: "샹양 포위전(1268~1273)"
  summary:
    ko: "남송을 정복하려던 쿠빌라이는 1261년 송 장수 유정이 몽골에 투항하자 그의 건의에 따라 1267년 창장강 중류의 요충 샹양과 판청(번성)을 먼저 공략하기로 했다. 한수이강을 사이에 둔 두 성은 오래 남송의 북쪽 방벽이었고, 한수이강 위의 부교와 쇠사슬 방책으로 이어져 서로 지원했다. 몽골이 판청을 먼저 친 것은 이 연결을 끊으려는 것이었다. 한수이강은 창장강으로 흘러드는 큰 지류여서 이곳을 차지하면 창장강 중류로 내려갈 수 있었다. 1268년 음력 9월 아주와 유정이 포위를 시작했고, 몽골은 한수이강 유역에 수군을 키워 두 성을 잇는 보급선을 끊었다. 송은 창장강과 한수이강의 수군이 강했지만 몽골이 수군을 키워 맞서자 그 이점이 줄었다. 남송은 1270~1272년 구원군을 보냈으나 번번이 실패했다. 샹양을 지키던 여문환은 5년 가까이 버티며 처음 몽골의 항복 권유를 거절했고, 쿠빌라이는 항복하면 후히 대우하겠다고 약속했다고 전한다. 1272년 일 칸국에서 알라 알딘과 이스마일 같은 기술자들이 와서 회회포라는 무거운 추의 투석기를 만들었고, 1273년 정월 판청이 먼저 함락되어 샹양은 완전히 고립되었다. 음력 2월 여문환이 샹양을 바치고 항복했고, 그는 몽골군의 길잡이가 되어 남송 공격에 앞장섰다. 유정은 송의 군사 사정을 잘 알고 있어 몽골에 큰 도움이 되었다. 샹양 함락은 몽골이 한수이강을 따라 창장강으로 내려가는 길을 열었다. 샹양이 무너지자 송군의 사기가 크게 꺾였고 임안(지금 항저우)의 조정에도 큰 충격을 주었으며, 송에서는 구원을 소홀히 한 재상 가사도에 대한 비난이 일었다. 몽골은 그 사이 1271년 국호를 대원으로 정했다(「원 국호 제정」)."
  subjects: [song, mongol-empire, yuan]
  links:
    - { from: yuan, to: song, note: "샹양 함락(1273)" }
  tags: [war]
  sources: ["『송사』 도종본기·여문환전", "『원사』 아주전·유정전", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "The Song-Yuan-Ming Transition in Chinese History (Paul Jakov Smith·Richard von Glahn 편, Harvard University Asia Center, 2003)"]
