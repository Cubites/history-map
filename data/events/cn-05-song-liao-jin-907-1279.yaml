- id: zhu-xi-neo-confucianism-1175
  year: 1130
  endYear: 1200
  title:
    ko: "주희와 성리학(1130~1200)"
  summary:
    ko: "주희는 1130년 푸젠에서 태어나 1148년 과거에 급제했다. 북송의 주돈이·장재·정호·정이가 닦은 유학의 새 이론을 이어받아, 우주와 사물을 이룬 원리(이)와 질료(기)로 설명하고 격물치지로 이를 깨우치는 성리학을 완성했다. 성리학은 불교와 도교의 형이상학에 맞서 유학을 이론적으로 다시 세우려는 시도였다. 이 학문이 자라난 바탕은 과거로 뽑힌 사대부가 정치와 사회의 중심이 된 송의 질서였다(「송 태조의 중앙 집권과 문치주의(961~976)」(앞의 사건)). 주희의 아버지 주송은 과거에 급제한 관료였다. 1175년 여조겸과 『근사록』을 엮었고, 아호사에서 육구연과 논쟁했다. 주희는 사물의 이치를 하나하나 따져 가면 마침내 환히 통한다고 보았고 육구연은 마음이 곧 이라 책에 앞서 마음을 세워야 한다고 하며 갈라섰다. 1179년 남강군 지사로 일하며 백록동서원을 다시 세워 서원 교육의 모범으로 삼았다. 1190년에는 『사서장구집주』를 펴내 『대학』·『중용』·『논어』·『맹자』를 유교 교육의 중심에 놓았다. 주희는 서원 강학과 『주자가례』로 일상의 예법까지 정리했다고 전하며, 평생 관직보다 학문과 교육에 마음을 두어 여러 번 관직을 사양하고 사당을 관리하는 한직을 청했다. 남송에서 서원이 늘고 출판이 활발해지면서 주희의 저술은 빠르게 퍼졌고, 제자들은 서원을 중심으로 학파를 이루었다. 정치에서는 권신을 비판해 1196년부터 경원당금으로 학문이 위학이라 하여 금지되고 탄압을 받았으나 제자들은 학문을 이어 갔다. 주희는 1200년 음력 3월 죽었다. 성리학이 이후 동아시아에 퍼지는 과정과 고려 후기 안향의 소개는 「안향의 성리학 소개」에서 다룬다."
  subjects: [song]
  tags: [culture, society]
  sources: ["『송사』 도학전·주희전", "『주자어류』", "Dieter Kuhn, The Age of Confucian Rule: The Song Transformation of China (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 5, part 2: Sung China, 960–1279 (John W. Chaffee·Denis Twitchett 편, Cambridge University Press, 2015)"]

- id: mongol-xixia-1205
  year: 1205
  endYear: 1227
  title:
    ko: "몽골의 서하 원정(1205~1227)"
  summary:
    ko: "칭기즈 칸은 금을 치기 전에 서하를 먼저 눌렀다. 서하의 도읍 중흥부(지금 인촨)는 황허강 가의 비옥한 평야에 있었고 서하는 불교가 번성해 사원과 탑이 많았다. 1226년 직접 정벌에 나설 때 칭기즈 칸은 서하가 서아시아 원정 때 약속을 어겼다고 주장했다. 몽골은 1205년 서하 변경을 처음 습격하고 1207년 다시 쳤으며, 1209년 세 번째 원정으로 중흥부를 에워쌌다. 서하는 금에 구원을 청했으나 금은 응하지 않았고, 두 나라가 서로 돕지 않은 것은 몽골이 하나씩 무너뜨리는 데 유리하게 작용했다. 몽골은 황허강 물을 끌어 도시를 물에 잠기게 하려다 제방이 터져 몽골군도 피해를 입었다. 이듬해(1210) 서하의 이안전(양종)이 항복해 딸을 칭기즈 칸에게 시집보내고 조공하기로 했다. 서하는 몽골에 속하게 되자 금과 싸우는 몽골의 원정에 협력했고, 1210년대 서하는 금과도 오래 싸워 지쳐 갔다. 서하에서는 1211년 이준욱(신종)이 정변으로 즉위했고 1223년 헌종이 뒤를 이었다. 1217년 몽골이 다시 중흥부를 에워쌌고, 1219년 칭기즈 칸이 서아시아 원정에 군대를 내라고 하자 서하는 이를 거부해 몽골과의 관계가 깨졌다. 칭기즈 칸은 1226년 서하를 직접 정벌했고, 이듬해 중흥부가 함락되기 직전 병으로 죽었으나 몽골은 그의 죽음을 한동안 숨겼다고 전한다. 말제 이현이 항복했으나 살해되었고 서하의 도읍은 파괴되었다. 서하는 189년 만에 끝났고 몽골군의 학살로 탕구트 사람들은 많이 죽거나 흩어졌으며, 서하 문자는 원대에도 불경 간행에 쓰였으나 점차 쓰이지 않게 되었다. 서하가 멸망하면서 몽골은 금의 서쪽 방어선을 허물 수 있게 되었다. 이 멸망은 한국사 「서하 멸망」에서도 다룬다."
  subjects: [xixia, mongol-empire, jin]
  links:
    - { from: mongol-empire, to: xixia, note: "서하 원정과 정복(1205~1227)" }
  tags: [war]
  sources: ["『원사』 태조본기", "『송사』 하국전", "Michal Biran, Chinggis Khan (Oneworld, 2007)", "Ruth W. Dunnell, The Great State of White and High: Buddhism and State Formation in Eleventh-Century Xia (University of Hawai'i Press, 1996)", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: mongol-jin-conquest-1211
  year: 1211
  endYear: 1234
  title:
    ko: "몽골의 금 정복(1211~1234)"
  summary:
    ko: "금은 1211년 칭기즈 칸의 침공을 받았다. 몽골군은 그해 야호령에서 금의 대군을 크게 깨뜨리고 화북으로 밀려들었다. 당시 금의 군주는 위소왕(재위 1208~1213)이었는데 1213년 정변으로 살해되고 선종이 즉위했다. 1213년 몽골군은 거용관을 넘어 하북과 산시(山西)의 수십 개 성을 차례로 공략했고, 1214년 중도를 에워싸자 금 선종은 공주와 금은, 말 등을 바치는 화의를 맺은 뒤 카이펑으로 도읍을 옮겼다. 칭기즈 칸은 이를 화의 위반으로 보고 다시 중도를 쳐, 1215년 음력 5월 중도가 함락되었다. 금은 하북·산둥에서 한인 군벌들이 몽골에 붙으며 약해졌고, 중도 함락 뒤 하남 방어에 집중했으며 1217~1224년 송·서하와 싸우며 힘을 더 소모했다. 금은 여진 귀족 중심의 맹안·모극 조직이 해이해졌고 황허강 범람 같은 재해로 민생도 흔들렸다. 몽골군에는 금에서 투항한 거란인과 한인 장수가 많았고 거란 출신 야율초재 같은 인물이 몽골의 통치 방식에 큰 영향을 주었다. 1224년 선종이 죽고 애종이 이었다. 칭기즈 칸이 죽고(1227) 오고타이가 1229년 즉위한 뒤 몽골은 금을 마무리하려 했다. 1232년 음력 정월 삼봉산에서 금의 주력을 격파하고 카이펑을 에워쌌는데, 금군은 진천뢰라는 폭탄과 비화창으로 맞섰다. 1233년 정월 애종이 카이펑을 떠났고 4월 카이펑은 항복했다. 애종은 귀덕을 거쳐 채주로 갔다. 송은 몽골과 손잡고 군량 등을 보내며 금을 함께 공격했다. 1234년 음력 정월 채주가 함락되자 애종은 자결했고 말제 완안승린도 싸우다 죽어 금은 멸망했다. 몽골은 하남을 송에 돌려주겠다고 했으나 지키지 않았고, 송이 이를 되찾으려 한 시도가 몽골·남송 전쟁으로 이어졌다(「몽골의 남송 공격: 쓰촨과 창장강 중류(1235~1259)」(뒤의 사건)). 이 일은 한국사 「금 멸망」에서도 짧게 다룬다."
  subjects: [jin, mongol-empire, song]
  links:
    - { from: mongol-empire, to: jin, note: "금 정복(1211~1234)" }
    - { from: song, to: jin, note: "몽골과 연합해 채주 공격(1233~1234)" }
