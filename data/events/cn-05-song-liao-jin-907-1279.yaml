- id: lin-an-yashan-1279
  year: 1274
  endYear: 1279
  title:
    ko: "남송의 멸망: 임안 함락에서 애산까지(1274~1279)"
  summary:
    ko: "샹양이 함락된 뒤 송 도종이 1274년 음력 7월 죽고 두 살의 공제가 즉위해 사 태황태후가 섭정했다. 그해 가을 원은 바얀을 총사령관으로 삼아 샹양 함락 뒤 약 1년을 준비한 끝에 20만 병력(추산)을 보내 한수이강에서 창장강으로 내려오게 했다. 원군의 진군 속도는 빨랐다. 1275년 음력 2월 가사도가 직접 군을 이끌었으나 정가주에서 크게 패했고, 파면되어 유배 가던 길에 살해되었다. 송의 각 성은 대부분 항복했고, 원군은 저항한 창저우를 함락한 뒤 주민을 학살했고, 이는 다른 성의 항복을 부추겼다. 1276년 음력 정월 원군이 임안(지금 항저우) 성 아래 이르자 사 태황태후와 공제가 항복했고 원군이 임안에 들어갔다. 문천상은 1275년 의병을 모아 싸웠고 임안 협상 중 억류되었다가 탈출해 저항을 이어 갔다. 도종의 두 아들 조하와 조병은 임안을 빠져나가 복주(지금 푸저우)에서 조하가 단종으로 즉위했다(1276). 복주 정권은 천주(지금 취안저우)에서 바다 무역을 맡던 포수경이 1277년 원에 붙으면서 큰 타격을 입었다. 조정은 광둥의 뇌주(지금 레이저우) 쪽으로 쫓겨 다녔고, 1278년 음력 4월 조하가 죽자 조병이 제위에 올랐다. 장세걸은 남은 배들을 이끌고 애산에 근거지를 마련했고 문천상은 육지에서 저항을 이어 갔으나 그해 음력 12월 오파령에서 잡혔다. 원의 장홍범은 애산에서 송 수군을 에워쌌다. 애산에는 신하와 가족, 배를 탄 피난민이 많이 모여 있었다고 하며, 이 싸움에서 바다에 빠져 죽은 사람이 10만 명이 넘는다는 기록이 있다(추산). 1279년 음력 2월 6일(양력 3월 19일) 애산 해전에서 송군이 무너지자 육수부가 어린 황제 조병을 안고 바다에 몸을 던졌고 송은 멸망했다. 이어 원은 중국 전역을 다스리게 되었다."
  subjects: [song, yuan]
  links:
