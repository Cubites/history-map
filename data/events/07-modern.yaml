    ko: 일본의 독도 불법 편입
  summary:
    ko: 러일 전쟁 중 일본이 시마네현 고시 제40호로 독도를 '다케시마'라 부르며 자기 영토에 불법으로 편입했다.
  subjects: [japan, daehan-jeguk]
