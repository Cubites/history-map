  summary:
    ko: 안중근이 만주 하얼빈역에서 초대 통감 이토 히로부미를 사살했다. 뤼순 감옥에서 『동양 평화론』을 쓰다 순국했다. 같은 해 전명운·장인환(1908)과 이재명의 의거도 이어졌다.
  subjects: [daehan-jeguk, japan]
