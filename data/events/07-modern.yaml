- id: banggongnyeong-1889
  year: 1889
  title:
    ko: 방곡령 선포
  summary:
    ko: "일본으로 곡물이 대량 유출되자 함경도 관찰사 조병식이 방곡령을 내렸다. 일본은 1개월 전 통보 규정을 어겼다며 배상금을 요구했다. 방곡령은 1883년 조일 통상 장정의 규정에 따른 것이었고 1890년 황해도에서도 내려졌으나, 조선은 1893년 일본에 배상금을 물어야 했다."
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "곡물 수출 금지" }
    - { from: japan, to: joseon, note: "배상금 요구" }
  tags: [economy]
  sources: ["『고종실록』 고종 26년"]

- id: donghak-first-1894
  year: 1894
  title:
    ko: 동학 농민 운동 (1차 봉기와 전주 화약)
  summary:
    ko: "고부 군수 조병갑의 수탈에 맞서 전봉준이 고부 관아를 점령했다. 백산에서 격문과 4대 강령을 발표하고 황토현·황룡촌에서 관군을 이긴 뒤 전주성을 점령했다. 정부가 청에 원병을 요청하자 일본도 톈진 조약을 구실로 군대를 보냈다. 농민군은 전주 화약을 맺고 전라도에 집강소를 두어 폐정 개혁을 실천했다. 고부 봉기는 조병갑이 만석보를 쌓고 물세를 거둔 데서 비롯되었다. 사태를 수습하러 온 안핵사 이용태가 봉기 참가자를 탄압하자 1차 봉기로 번졌다."
  subjects: [joseon, qing, japan]
  links:
    - { from: qing, to: joseon, note: "원병 파견" }
    - { from: japan, to: joseon, note: "톈진 조약을 구실로 파병" }
  tags: [society, war]
  sources: ["『고종실록』 고종 31년", "전봉준 공초"]
  places: [{ name: "황토현", at: [126.85, 35.62] }, { name: "황룡촌", at: [126.72, 35.3] }, { name: "전주성", at: [127.15, 35.82] }]

