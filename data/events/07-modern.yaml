  subjects: [joseon, uk]
  links:
    - { from: joseon, to: uk, note: "조영 수호 통상 조약" }
  tags: [culture]
  sources: ["『고종실록』 고종 20년", "『한성순보』"]

- id: gapsin-1884
  year: 1884
  endYear: 1885
  title:
    ko: 갑신정변
  summary:
    ko: 김옥균·박영효 등 급진 개화파가 우정총국 개국 축하연에서 정변을 일으켜 14개조 정강(청에 대한 사대 폐지, 지조법 개혁, 인민 평등)을 발표했으나 청군의 개입으로 3일 만에 실패했다. 조선은 일본과 한성 조약을, 청과 일본은 톈진 조약(1885, 양국 군대 철수와 파병 시 통보)을 맺었다.
  subjects: [joseon, japan, qing]
