  subjects: [joseon, qing, japan]
  links:
    - { from: joseon, to: japan, note: "2차 수신사 김홍집" }
    - { from: qing, to: joseon, note: "『조선책략』 전래" }
  tags: [diplomacy, politics]
  sources: ["『고종실록』 고종 17년·18년", "황쭌셴, 『조선책략』"]

- id: tongni-gimu-1880
  year: 1880
  endYear: 1881
  title:
    ko: 통리기무아문 설치와 개화 정책
  summary:
    ko: 개화 정책을 총괄하는 통리기무아문과 12사를 두고, 신식 군대인 별기군을 만들었다(1881). 일본에 조사 시찰단(신사 유람단)을, 청의 톈진에 영선사(김윤식)를 보냈고, 영선사의 경험으로 근대 무기 공장인 기기창이 세워졌다(1883).
  subjects: [joseon, japan, qing]
  links:
