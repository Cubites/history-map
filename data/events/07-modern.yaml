- id: eulmi-reform-1895
  year: 1895
  endYear: 1896
  title:
    ko: 을미개혁과 을미의병
  summary:
    ko: "친일 내각이 단발령을 내리고 태양력 사용, '건양' 연호, 종두법, 우편 사무, 친위대·진위대 설치 등을 추진했다. 을미사변과 단발령에 분노한 유인석·이소응 등 유생이 의병을 일으켰다. 아관파천 뒤 고종이 단발령을 거두고 의병 해산을 권고하는 조칙을 내리자 의병 대부분이 흩어졌다."
