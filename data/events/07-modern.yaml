# ── 3·1 운동과 대한민국 임시정부 ────────────────────────

- id: february-8-1919
  year: 1919
  title:
    ko: 2·8 독립 선언
  summary:
    ko: "윌슨의 민족 자결주의와 고종의 죽음을 계기로 도쿄의 조선 청년 독립단이 독립 선언서를 발표했다. 상하이의 신한 청년당은 김규식을 파리 강화 회의에 보냈다. 만주·연해주의 독립운동가 39명은 조소앙이 쓴 대한 독립 선언서(무오 독립 선언)를 발표해 무장 투쟁으로 독립을 이루자고 했다(발표 시기는 1918년 11월 설과 1919년 2월 설이 있다)."
  subjects: [occupied-korea, japan]
  links:
    - { from: occupied-korea, to: japan, note: "도쿄 유학생의 독립 선언" }
  tags: [politics]
  sources: ["「2·8 독립 선언서」"]

- id: march-first-1919
  year: 1919
  title:
    ko: 3·1 운동
  summary:
    ko: 민족 대표 33인의 이름으로 독립 선언서를 발표하고 전국에서 만세 시위가 일어났다. 비폭력으로 시작해 도시에서 농촌으로, 국외(간도, 연해주, 미주)로 퍼졌다. 일제는 화성 제암리 학살 등으로 잔인하게 탄압했다. 3·1 운동은 대한민국 임시정부 수립과 중국 5·4 운동에 영향을 주었고, 일제는 통치 방식을 바꾸었다.
  subjects: [occupied-korea, japan, roc]
  links:
    - { from: occupied-korea, to: japan, note: "만세 시위" }
