    - { from: japan, to: roc, note: "간도 출병, 간도 참변" }
  tags: [war]
  sources: ["『독립신문』 1920년", "국사편찬위원회 『한국독립운동사』"]
  front: { war: independence-war-1920, date: 1920-10-21 }

- id: free-city-1921
  year: 1921
  title:
    ko: 자유시 참변
  summary:
    ko: "간도 참변을 피해 러시아 자유시(스보보드니)로 옮겨 간 독립군 부대들이 지휘권 다툼 속에 적색군의 무장 해제 요구를 거부하다 큰 피해를 입었다. 간도 참변 뒤 독립군 부대들은 밀산에서 서일을 총재로 대한 독립 군단을 만든 뒤 자유시로 옮겨 갔다."
  subjects: [occupied-korea, soviet-union]
  links:
    - { from: occupied-korea, to: soviet-union, note: "독립군의 자유시 이동" }
    - { from: soviet-union, to: occupied-korea, note: "적색군의 무장 해제 공격" }
  tags: [war]
  sources: ["국사편찬위원회 『한국독립운동사』"]
