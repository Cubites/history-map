# ── 러일 전쟁과 국권 피탈 (1904 ~ 1910) ─────────────────

- id: russo-japanese-war-1904
  year: 1904
  title:
    ko: 러일 전쟁과 한일 의정서·제1차 한일 협약
  summary:
    ko: "대한제국이 국외 중립을 선언했으나 일본은 러시아를 기습하고 한일 의정서를 강요해 군사 요지를 쓸 수 있게 했다. 이어 제1차 한일 협약으로 메가타(재정)와 스티븐스(외교)를 고문으로 보내는 고문 정치를 시작했다. 전쟁 전 러시아가 압록강 하구의 용암포를 조차하려 해(1903) 일본과의 대립이 깊어졌다. 일본은 전쟁 중 군사 수송을 위해 경부선(1905)과 경의선(1906)을 서둘러 놓았다."
  subjects: [daehan-jeguk, japan, russia]
  links:
