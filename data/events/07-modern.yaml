- id: an-junggeun-1909
  year: 1909
  title:
    ko: 안중근의 이토 히로부미 사살
  summary:
    ko: "안중근이 만주 하얼빈역에서 초대 통감 이토 히로부미를 사살했다. 뤼순 감옥에서 『동양 평화론』을 쓰다 순국했다. 이보다 앞서 전명운·장인환이 샌프란시스코에서 스티븐스를 저격했고(1908), 같은 해 12월에는 이재명이 이완용을 습격했다. 안중근은 앞서 연해주에서 의병으로 국내 진공 작전에 참여했고, 동지들과 손가락을 끊어 맹세하는 단지 동맹을 맺었다."
  subjects: [daehan-jeguk, japan]
