- id: self-strength-1920
  year: 1920
  endYear: 1923
  title:
    ko: 물산 장려 운동과 민립 대학 설립 운동
  summary:
    ko: 조만식 등이 평양에서 "내 살림 내 것으로"를 내세워 국산품 애용을 호소하는 물산 장려 운동을 시작했다. 이상재 등은 조선 민립 대학 기성회를 만들어 "한민족 1천만이 한 사람 1원씩"을 모으려 했으나 일제의 방해로 실패했고, 일제는 경성 제국 대학을 세웠다(1924).
