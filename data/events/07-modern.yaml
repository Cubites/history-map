- id: independence-bases-1911
  year: 1911
  endYear: 1914
  title:
    ko: 국외 독립운동 기지 건설
  summary:
    ko: 이회영 형제 등이 서간도 삼원보에 경학사와 신흥 강습소(뒤의 신흥 무관 학교)를 세웠다. 연해주에서는 권업회가 조직되고 이상설·이동휘가 대한 광복군 정부를 세웠으며(1914), 하와이에서는 박용만이 대조선 국민 군단을 만들었다(1914).
