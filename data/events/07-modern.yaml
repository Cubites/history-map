# 7번 묶음: 근대 (1876 ~ 1945)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료·자료. 운영자 검수 필요.
# 강화도 조약(1876)은 6번 묶음에 있다. 광복 이후는 8번 묶음에서 다룬다.
# 『고종실록』: 고종 1년 = 1864년. 『순종실록』: 순종 1년 = 1908년.
# 1910~1945년 한국 안의 사건은 'occupied-korea'(일제 강점기의 한국)에 둔다. 대한민국 임시정부는 영토가 없어 따로 나라로 두지 않았다.

# ── 개항과 개화 정책 (1876 ~ 1884) ─────────────────────

- id: trade-rules-1876
  year: 1876
  title:
    ko: 조일 수호 조규 부록과 조일 무역 규칙
  summary:
    ko: 강화도 조약에 이어 개항장에서 일본인의 거류지(간행이정 10리)를 정하고 일본 화폐를 쓸 수 있게 했다. 무역 규칙으로 양곡의 무제한 유출과 무관세 무역을 허용했다. 김기수가 1차 수신사로 일본에 다녀왔다.
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "불평등한 무역 규칙" }
    - { from: joseon, to: japan, note: "1차 수신사 파견" }
  tags: [diplomacy, economy]
  sources: ["『고종실록』 고종 13년", "김기수, 『일동기유』"]

- id: joseon-strategy-1880
  year: 1880
  endYear: 1881
  title:
    ko: 『조선책략』 유포와 영남 만인소
  summary:
    ko: "2차 수신사 김홍집이 청의 황쭌셴이 쓴 『조선책략』을 들여왔다. 러시아를 막으려면 청과 친하고 일본과 맺고 미국과 연결해야 한다는 내용이었다. 이에 반발해 이만손 등 영남 유생이 만인소를 올리는 등 위정척사 운동이 거세졌다. 같은 해(1881) 강원도 유생 홍재학은 만언척사소를 올려 개화 정책을 추진한 관리들을 비판하다 처형되었다."
  subjects: [joseon, qing, japan]
  links:
    - { from: joseon, to: japan, note: "2차 수신사 김홍집" }
    - { from: qing, to: joseon, note: "『조선책략』 전래" }
  tags: [diplomacy, politics]
  sources: ["『고종실록』 고종 17년·18년", "황쭌셴, 『조선책략』"]

- id: tongni-gimu-1880
  year: 1880
  endYear: 1881
  title:
    ko: 통리기무아문 설치와 개화 정책
  summary:
    ko: "개화 정책을 총괄하는 통리기무아문과 12사를 두고, 신식 군대인 별기군을 만들었다(1881). 일본에 조사 시찰단(신사 유람단)을, 청의 톈진에 영선사(김윤식)를 보냈고, 영선사의 경험으로 근대 무기 공장인 기기창이 세워졌다(1883). 구식 군대인 5군영은 무위영과 장어영 2영으로 줄였다."
  subjects: [joseon, japan, qing]
  links:
    - { from: joseon, to: japan, note: "조사 시찰단 파견" }
    - { from: joseon, to: qing, note: "영선사 파견" }
  tags: [politics]
  sources: ["『고종실록』 고종 17년·18년"]

- id: korea-us-treaty-1882
  year: 1882
  title:
    ko: 조미 수호 통상 조약
  summary:
    ko: "청의 알선으로 서양 나라와 처음 맺은 조약이다. 거중 조정, 치외 법권, 최혜국 대우를 규정했고 처음으로 관세 조항을 넣었다. 이듬해 민영익 등이 보빙사로 미국에 갔다. 보빙사를 수행한 유길준은 미국에 남아 공부했고, 뒤에 서양의 제도와 문물을 국한문 혼용체로 소개한 『서유견문』(1895)을 펴냈다."
  subjects: [joseon, usa, qing]
  links:
    - { from: qing, to: joseon, note: "조약 알선" }
    - { from: joseon, to: usa, note: "수교, 보빙사 파견 (1883)" }
  tags: [diplomacy]
  sources: ["『고종실록』 고종 19년·20년", "「조미 수호 통상 조약」"]

- id: imo-1882
  year: 1882
  title:
    ko: 임오군란
  summary:
    ko: "별기군과의 차별 대우와 밀린 급료에 불만을 품은 구식 군인들이 난을 일으켜 일본 공사관을 공격했다. 흥선 대원군이 잠시 다시 집권했으나 청군이 대원군을 납치해 갔다. 이후 일본과 제물포 조약(배상금, 공사관 경비병 주둔)을, 청과 조청 상민 수륙 무역 장정(청 상인의 내지 통상)을 맺었고, 청은 마젠창과 묄렌도르프를 고문으로 보내 내정에 간섭했다. 조청 상민 수륙 무역 장정에는 조선이 청의 속방이라는 내용이 담겼고, 조일 수호 조규 속약으로 일본 상인의 활동 범위가 개항장 사방 50리(2년 뒤 100리)로 넓어졌다. 제물포 조약에 따라 수신사로 일본에 간 박영효는 처음으로 태극기를 국기로 사용했다."
  subjects: [joseon, qing, japan]
  links:
    - { from: qing, to: joseon, note: "군란 진압, 대원군 납치, 내정 간섭" }
    - { from: japan, to: joseon, note: "제물포 조약" }
  tags: [politics, war]
  sources: ["『고종실록』 고종 19년", "「제물포 조약」", "「조청 상민 수륙 무역 장정」"]

- id: hanseong-sunbo-1883
  year: 1883
  title:
    ko: 근대 시설과 『한성순보』
  summary:
    ko: "박문국에서 최초의 근대 신문인 『한성순보』를 펴내고, 화폐를 찍는 전환국을 설치했다. 함경도 덕원 주민들이 최초의 근대 사립 학교인 원산 학사를 세웠다. 같은 해 영국·독일과도 수교했다. 『한성순보』는 열흘마다 순한문으로 펴낸 관보 성격의 신문이었다. 갑신정변 때 중단되었다가 1886년 국한문을 섞어 쓴 『한성주보』로 다시 나와 처음으로 상업 광고를 실었다."
  subjects: [joseon, uk]
  links:
    - { from: joseon, to: uk, note: "조영 수호 통상 조약" }
  tags: [culture]
  sources: ["『고종실록』 고종 20년", "『한성순보』"]

- id: gapsin-1884
  year: 1884
  endYear: 1885
  title:
    ko: 갑신정변
  summary:
    ko: "김옥균·박영효 등 급진 개화파가 우정총국 개국 축하연에서 정변을 일으켜 14개조 정강(청에 대한 사대 폐지, 지조법 개혁, 인민 평등)을 발표했으나 청군의 개입으로 3일 만에 실패했다. 조선은 일본과 한성 조약을, 청과 일본은 톈진 조약(1885, 양국 군대 철수와 파병 시 통보)을 맺었다. 개화파는 박규수·오경석·유홍기의 영향을 받아 형성되었는데, 임오군란 뒤 두 갈래로 나뉘었다. 김홍집·김윤식·어윤중 등 온건 개화파는 청의 양무운동을 본받아 동도서기를 내세웠고, 김옥균 등 급진 개화파는 일본의 메이지 유신을 본받아 급진적인 개혁을 주장했다."
  subjects: [joseon, japan, qing]
  links:
    - { from: japan, to: joseon, note: "일본 공사관의 지원 약속" }
    - { from: qing, to: joseon, note: "청군의 진압" }
    - { from: qing, to: japan, note: "톈진 조약" }
  tags: [politics]
  sources: ["『고종실록』 고종 21년", "김옥균, 『갑신일록』"]

# ── 열강의 대립과 동학 농민 운동 (1885 ~ 1895) ───────────

- id: geomundo-1885
  year: 1885
  endYear: 1887
  title:
    ko: 거문도 사건
  summary:
    ko: "러시아의 남하를 막는다며 영국 함대가 거문도를 불법 점령했다. 조선과 러시아가 가까워지는 데 대한 견제였다. 이 무렵 부들러와 유길준이 한반도 중립화론을 주장했다. 앞서 조선은 러시아와 수교했고(조러 수호 통상 조약, 1884), 갑신정변 뒤 청의 간섭이 심해지자 러시아와 가까워지려 했다(조러 밀약설)."
  subjects: [joseon, uk, russia]
  links:
