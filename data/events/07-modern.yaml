    - { from: uk, to: russia, note: "러시아 남하 견제" }
  tags: [diplomacy, war]
  sources: ["『고종실록』 고종 22년·24년"]
  places: [{ name: "거문도", at: [127.31, 34.03] }]

- id: modern-schools-1885
  year: 1885
  endYear: 1886
  title:
    ko: 광혜원과 근대 학교 설립
  summary:
    ko: 미국인 선교사 알렌의 건의로 최초의 근대식 병원 광혜원(제중원)을 세웠다. 아펜젤러의 배재 학당, 스크랜턴의 이화 학당이 문을 열었고, 정부는 헐버트 등을 교사로 초빙해 육영 공원을 세웠다(1886).
  subjects: [joseon, usa]
