- id: eulsa-1905
  year: 1905
  title:
    ko: 을사늑약과 통감부 설치
  summary:
    ko: "일본이 군대를 동원해 강압적으로 을사늑약(제2차 한일 협약)을 맺어 대한제국의 외교권을 빼앗고, 이듬해 통감부를 두어 이토 히로부미가 초대 통감이 되었다. 고종은 조약에 서명하지 않았다. 장지연은 「시일야방성대곡」을 쓰고 민영환은 자결했으며, 민종식·최익현·신돌석(평민 의병장) 등이 을사의병을 일으켰다. 조약은 경운궁(덕수궁) 중명전에서 강제로 맺어졌으며, 찬성한 이완용·박제순 등 다섯 대신은 을사오적이라 불렸다. 최익현은 쓰시마로 끌려가 그곳에서 숨졌다."
  subjects: [daehan-jeguk, japan]
  links:
