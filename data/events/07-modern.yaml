- id: cultural-rule-1920
  year: 1920
  endYear: 1925
  title:
    ko: 이른바 문화 통치와 산미 증식 계획
  summary:
    ko: "3·1 운동 뒤 일제는 보통 경찰제로 바꾸고 한글 신문(『조선일보』·『동아일보』) 발행을 허가했으나 경찰 수는 오히려 늘었고 검열을 강화했다. 친일파를 기르는 민족 분열 통치였다. 일본의 쌀 부족을 메우려 산미 증식 계획(1920~1934)을 실시해 쌀을 대량으로 가져갔고, 회사령을 폐지했으며 치안 유지법(1925)으로 사회주의와 독립운동을 탄압했다. 문관도 총독이 될 수 있게 했으나 실제로 임명된 적은 없었다. 제2차 조선 교육령(1922)으로 보통학교 수업 연한을 6년으로 늘리고 대학 설립 규정을 두었으며, 도 평의회·부 협의회 같은 자문 기구를 두어 지방 자치를 흉내 냈다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "민족 분열 통치, 쌀 수탈" }
  tags: [politics, economy]
  sources: ["『조선총독부 관보』", "「치안 유지법」"]

- id: bongo-cheongsan-1920
  year: 1920
  title:
    ko: 봉오동 전투와 청산리 대첩
  summary:
    ko: "홍범도의 대한 독립군이 봉오동에서 일본군을 크게 이겼다. 일본군이 간도로 대규모 군대를 보내자 김좌진의 북로 군정서와 홍범도 부대 등이 청산리 일대에서 대승을 거두었다. 일본군은 보복으로 간도의 한인을 학살했다(간도 참변). 청산리 전투에는 천주교도들이 만든 의민단 등 여러 독립군 부대도 함께 참여했다."
  subjects: [occupied-korea, japan, roc]
  links:
