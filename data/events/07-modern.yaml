  places: [{ name: "서울 진공 작전 (양주)", at: [127.05, 37.8] }]

- id: sinminhoe-1907
  year: 1907
  endYear: 1911
  title:
    ko: 신민회
  summary:
    ko: 안창호·양기탁 등이 공화정 수립을 목표로 비밀 결사 신민회를 만들었다. 대성 학교·오산 학교를 세우고 태극 서관과 자기 회사를 운영했으며, 서간도에 독립운동 기지(삼원보, 경학사, 신흥 강습소)를 만들었다. 105인 사건(1911)으로 해체되었다.
