# ── 1910년대: 무단 통치 ─────────────────────────────────

- id: military-rule-1910
  year: 1910
  endYear: 1918
  title:
    ko: 무단 통치와 토지 조사 사업
  summary:
    ko: "헌병 경찰이 즉결 처분권을 가지고 조선 태형령(1912)으로 한국인만 매로 다스렸으며, 관리와 교사도 제복을 입고 칼을 찼다. 기한부 신고제로 토지 조사 사업을 벌여 많은 농민이 경작권을 잃었고, 회사령(허가제)으로 한국인의 기업 설립을 막았다. 또 삼림령(1911)·어업령(1911)·광업령(1915)을 만들어 산림·어장·광산을 총독부와 일본인이 차지하기 쉽게 했다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "무단 통치, 경제 수탈" }
  tags: [politics, economy]
  sources: ["『조선총독부 관보』", "「조선 태형령」", "「토지 조사령」"]

- id: independence-bases-1911
  year: 1911
  endYear: 1914
  title:
    ko: 국외 독립운동 기지 건설
  summary:
    ko: "이회영 형제 등이 서간도 삼원보에 경학사와 신흥 강습소(뒤의 신흥 무관 학교)를 세웠다. 연해주에서는 권업회가 조직되고 이상설·이동휘가 대한 광복군 정부를 세웠으며(1914), 하와이에서는 박용만이 대조선 국민 군단을 만들었다(1914). 북간도에서는 명동 학교가 민족 교육을 펼치고 대종교 계열의 중광단(1911)이 조직되었으며, 미주에서는 대한인 국민회(1910)가 독립운동 자금을 모으고 안창호가 흥사단(1913)을 만들었다."
  subjects: [occupied-korea, qing, russia, usa]
  links:
    - { from: occupied-korea, to: qing, note: "서간도 이주, 신흥 강습소" }
    - { from: occupied-korea, to: russia, note: "연해주 권업회, 대한 광복군 정부" }
    - { from: occupied-korea, to: usa, note: "하와이 대조선 국민 군단" }
  tags: [politics]
  sources: ["국사편찬위원회 『한국독립운동사』"]

- id: secret-societies-1912
  year: 1912
  endYear: 1915
  title:
    ko: 독립 의군부와 대한 광복회
  summary:
    ko: 임병찬이 고종의 밀지를 받아 복벽주의를 내세운 독립 의군부를 조직했다(1912). 박상진은 공화정을 목표로 대한 광복회를 조직하고 군자금을 모아 친일 부호를 처단했다(1915).
