    - { from: joseon, to: qing, note: "영선사 파견" }
  tags: [politics]
  sources: ["『고종실록』 고종 17년·18년"]

- id: korea-us-treaty-1882
  year: 1882
  title:
    ko: 조미 수호 통상 조약
  summary:
    ko: 청의 알선으로 서양 나라와 처음 맺은 조약이다. 거중 조정, 치외 법권, 최혜국 대우를 규정했고 처음으로 관세 조항을 넣었다. 이듬해 민영익 등이 보빙사로 미국에 갔다.
  subjects: [joseon, usa, qing]
  links:
