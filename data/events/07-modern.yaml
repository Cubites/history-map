    ko: 의열단 조직
  summary:
    ko: "김원봉이 만주 지린에서 의열단을 조직했다. 신채호가 쓴 「조선 혁명 선언」(1923)을 행동 강령으로 삼아 민중의 직접 혁명을 주장했다. 김상옥(종로 경찰서), 나석주(동양 척식 주식회사) 등이 의거를 일으켰다. 뒤에 김원봉은 황푸 군관 학교에 들어가 조직적인 무장 투쟁을 준비했다. 박재혁(부산 경찰서, 1920)·김익상(조선 총독부, 1921)·김지섭(도쿄 왕궁, 1924)도 의열단원으로 의거를 일으켰고, 김원봉은 난징에 조선 혁명 군사 정치 간부 학교(1932)를 세워 간부를 길렀다."
  subjects: [occupied-korea, japan]
  links:
    - { from: occupied-korea, to: japan, note: "식민 통치 기관 파괴·요인 암살" }
  tags: [politics]
  sources: ["신채호, 「조선 혁명 선언」", "국사편찬위원회 『한국사』 48"]

- id: amtaedo-1923
  year: 1923
  title:
    ko: 암태도 소작 쟁의
  summary:
    ko: 전남 신안 암태도의 소작농들이 7~8할에 이르는 소작료를 4할로 낮추라고 요구하며 1년 가까이 싸워 뜻을 이루었다. 1920년대 농민 운동의 대표적인 사례다.
  subjects: [occupied-korea, japan]
  tags: [society, economy]
  sources: ["『동아일보』 1923~1924년 기사", "국사편찬위원회 『한국사』 49"]

- id: communist-party-1925
  year: 1925
  title:
    ko: 치안 유지법과 조선 공산당
  summary:
    ko: 3·1 운동 뒤 사회주의 사상이 들어와 1925년 조선 공산당이 조직되었다. 일본은 같은 해 치안 유지법을 만들어 사회주의자와 독립운동가를 탄압했다. 사회주의 세력의 등장은 민족 유일당 운동과 신간회(1927)로 이어졌다.
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "치안 유지법으로 탄압" }
  tags: [politics]
  sources: ["『조선총독부 관보』", "국사편찬위원회 『한국사』 49"]

- id: joseonsa-1925
  year: 1925
  title:
    ko: 조선사 편수회와 식민 사관
  summary:
    ko: "조선 총독부가 조선사 편수회를 만들어 『조선사』를 펴냈다. 한국사가 외세에 휘둘렸다는 타율성론, 발전 없이 멈춰 있었다는 정체성론, 붕당은 분열하는 민족성 탓이라는 당파성론 등으로 식민 지배를 정당화했다. 이에 맞서 박은식·신채호의 민족주의 사학, 백남운의 사회 경제 사학, 진단 학회(1934)의 실증 사학이 나왔다. 신채호는 『조선상고사』에서 역사를 '아(我)와 비아(非我)의 투쟁'으로 보았고, 백남운은 『조선사회경제사』(1933)에서 한국사도 세계사의 보편적인 발전 법칙을 따랐다며 정체성론을 반박했다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "식민 사관 보급" }
  tags: [culture]
  sources: ["조선사편수회, 『조선사』", "국사편찬위원회 『한국사』 51"]

- id: vnarod-1931
  year: 1931
  endYear: 1934
  title:
    ko: 브나로드 운동과 문자 보급 운동
  summary:
    ko: 동아일보가 '민중 속으로'라는 뜻의 브나로드 운동을 벌여 학생들이 농촌에서 한글을 가르치고 계몽 활동을 했다. 조선일보도 "아는 것이 힘, 배워야 산다"는 구호로 문자 보급 운동(1929~)을 벌였다. 총독부의 금지로 1935년 무렵 중단되었다.
  subjects: [occupied-korea]
  tags: [culture, society]
  sources: ["『동아일보』 1931년 기사", "『조선일보』 1929년 기사"]

# ── 한국사능력검정시험(심화) 빈출 주제 보충 2 (2026-09-29): 시대별 조사 뒤 반박 검증을 거친 항목 ──

- id: joil-trade-regulations-1883
  year: 1883
  title:
    ko: "조일 통상 장정"
  summary:
    ko: "무관세 무역으로 손해가 커지자 조선은 일본과 조일 통상 장정을 새로 맺어 수출입 상품에 관세를 매길 수 있게 했다. 식량이 모자랄 때 1개월 전에 알리면 곡물 수출을 막을 수 있는 방곡령 조항을 두었으나, 일본에 최혜국 대우를 인정하고 일본 어민이 전라·경상·강원·함경도 바다에서 고기를 잡을 수 있게 했다. 뒤에 함경도(1889)·황해도(1890)의 방곡령은 이 조항을 근거로 내려졌다."
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "관세 부과, 방곡령 조항" }
    - { from: japan, to: joseon, note: "최혜국 대우, 연해 어업권" }
  tags: [diplomacy, economy]
  sources: ["『고종실록』 고종 20년", "「조일 통상 장정」"]

- id: telegraph-electric-1885
  year: 1885
  endYear: 1888
  title:
    ko: "전신선 가설과 전등 설치"
  summary:
    ko: "청이 차관과 기술을 대어 서울과 인천·의주를 잇는 서로 전선을 놓았고(1885), 한성 전보 총국이 업무를 시작했다. 1887년에는 미국 에디슨 전기 회사의 설비로 경복궁 건청궁에 처음 전등이 켜졌다. 1888년에는 조선 정부가 서울과 부산을 잇는 남로 전선을 놓았다."
  subjects: [joseon, qing, usa]
  links:
    - { from: qing, to: joseon, note: "서로 전선 가설 (1885)" }
    - { from: usa, to: joseon, note: "건청궁 전등 설비 (1887)" }
  tags: [culture]
  sources: ["『고종실록』 고종 22년", "국사편찬위원회 우리역사넷"]

- id: donghak-petition-1892
  year: 1892
  endYear: 1893
  title:
    ko: "동학의 교조 신원 운동"
  summary:
    ko: "동학교도들이 처형된 교조 최제우의 누명을 벗기고 동학을 믿을 자유를 얻으려고 교조 신원 운동을 벌였다. 공주·삼례 집회(1892)와 궁궐 앞에 엎드려 올린 복합 상소(1893)에서는 종교적 요구가 중심이었다. 1893년 충청도 보은 집회에서는 '척왜양창의'를 내걸고 탐관오리 처벌을 요구했다. 이로써 종교 운동이 반외세·반봉건 정치 운동으로 바뀌었다."
  subjects: [joseon]
  tags: [society, politics]
  sources: ["『고종실록』 고종 29년·30년", "국사편찬위원회 『신편 한국사』 39"]

- id: commercial-rights-1898
  year: 1898
  endYear: 1899
  title:
    ko: "상권 수호 운동과 민족 은행 설립"
  summary:
    ko: "청·일 상인이 도성 안까지 들어와 상권을 넓히자 서울 시전 상인들이 가게 문을 닫고 외국 상인을 내보내라고 요구했다(1890). 1898년에는 황국 중앙 총상회를 만들어 독립 협회와 함께 상권 수호 운동을 벌였다. 이 무렵 민족 자본으로 조선은행(1896)·한성은행(1897)·대한천일은행(1899)이 세워졌고, 1880년대부터 대동 상회·장통 회사 같은 상회사도 생겨났다."
  subjects: [daehan-jeguk, qing, japan]
  links:
    - { from: qing, to: daehan-jeguk, note: "청 상인의 도성 안 상권 침투" }
    - { from: japan, to: daehan-jeguk, note: "일본 상인의 상권 침투" }
  tags: [economy]
  sources: ["『독립신문』 1898년", "국사편찬위원회 『신편 한국사』 44"]

- id: private-newspapers-1898
  year: 1898
  endYear: 1904
  title:
    ko: "『황성신문』·『제국신문』과 『대한매일신보』"
  summary:
    ko: "1898년 남궁억 등이 국한문 혼용의 『황성신문』을, 이종일이 순한글의 『제국신문』을 창간했다. 『황성신문』은 유생과 지식층을, 『제국신문』은 서민과 부녀자를 주된 독자로 삼았으며, 『황성신문』은 을사늑약 때 「시일야방성대곡」을 실었다. 1904년 양기탁과 영국인 베델이 창간한 『대한매일신보』는 베델의 치외 법권 덕분에 일제의 검열을 피할 수 있어, 강한 항일 논조를 펴고 국채 보상 운동을 이끌었다."
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["『황성신문』", "『제국신문』", "『대한매일신보』", "국사편찬위원회 『신편 한국사』 46"]

- id: hwalbindang-1900
  year: 1900
  endYear: 1904
  title:
    ko: "활빈당의 활동"
  summary:
    ko: "동학 농민 운동이 실패한 뒤 흩어진 농민 등이 무장 집단을 이루었는데, 그 가운데 '가난한 백성을 살린다'는 뜻의 활빈당이 가장 컸다. 활빈당은 부호와 관아를 습격해 빼앗은 재물을 가난한 이들에게 나누어 주었다. 1900년 무렵 「대한 사민 논설 13조목」을 내걸고 방곡령 시행, 시장에 외국 상인이 드나드는 것 금지, 철도 부설권 양도 반대, 토지의 균등한 분배 같은 반외세·반봉건 요구를 밝혔다. 일부는 뒤에 의병에 합류했다."
  subjects: [daehan-jeguk]
  tags: [society]
  sources: ["국사편찬위원회 우리역사넷", "국사편찬위원회 『신편 한국사』 44"]

- id: jeju-uprising-1901
  year: 1901
  title:
    ko: "제주 이재수의 난 (신축 민란)"
  summary:
    ko: "대한제국이 보낸 봉세관이 제주에서 세금을 무겁게 걷었다. 일부 천주교도가 세금 걷는 일에 끼어들거나 교회의 힘을 믿고 횡포를 부리자 민중이 봉기했다. 이재수 등이 이끈 봉기군은 제주성을 점령하고 천주교도 수백 명을 죽였다. 프랑스가 군함을 보내 외교 문제로 번졌고, 정부는 군대를 보내 사태를 수습한 뒤 이재수 등을 처형했다."
  subjects: [daehan-jeguk, france]
  links:
    - { from: france, to: daehan-jeguk, note: "군함 파견, 선교사 보호 요구" }
  tags: [society]
  sources: ["『고종실록』 고종 38년", "김윤식, 『속음청사』"]
  places: [{ name: "제주성", at: [126.52, 33.51] }]

- id: gando-commissioner-1903
  year: 1903
  title:
    ko: "이범윤의 간도 관리사 파견"
  summary:
    ko: "백두산정계비의 '토문'을 조선은 쑹화강 지류로, 청은 두만강으로 해석하면서 간도 귀속 문제가 일어났다. 조선은 어윤중을 서북 경략사로 보내 조사하고(1883), 이중하를 보내 청과 감계 회담(1885·1887)을 벌였으나 결론을 내지 못했다. 대한제국은 1902년 이범윤을 간도에 보내 실태를 살피게 했고, 이듬해 간도 관리사로 임명해 그곳에 사는 한인을 보호하고 세금을 걷게 했다."
  subjects: [daehan-jeguk, qing, gando-disputed]
  links:
    - { from: daehan-jeguk, to: gando-disputed, note: "간도 관리사 파견, 한인 보호" }
    - { from: daehan-jeguk, to: qing, note: "간도 영유권 주장" }
  tags: [politics, diplomacy]
  sources: ["『고종실록』 고종 40년", "국사편찬위원회 『신편 한국사』 39", "동북아역사재단 『간도 문제』"]

- id: hawaii-emigration-1903
  year: 1903
  endYear: 1905
  title:
    ko: "하와이 이민의 시작"
  summary:
    ko: "대한제국 정부의 허가를 받은 첫 공식 이민단이 1902년 12월 제물포를 떠나 이듬해 1월 하와이 호놀룰루에 닿았다. 이들은 사탕수수 농장에서 낮은 임금을 받으며 고되게 일했고, 1905년 이민이 막힐 때까지 7천여 명이 건너갔다. 같은 해 1천여 명은 멕시코 유카탄반도의 에네켄(용설란) 농장으로 이주해 노예와 다름없는 대우를 받았다. 미주 한인들은 뒤에 대한인 국민회(1910) 등을 만들어 독립운동을 지원했다."
  subjects: [daehan-jeguk, usa]
  links:
    - { from: daehan-jeguk, to: usa, note: "하와이 사탕수수 농장 노동 이민" }
  tags: [society]
  sources: ["국사편찬위원회 우리역사넷", "인천 한국이민사박물관 자료"]

- id: cheondogyo-1905
  year: 1905
  title:
    ko: "동학의 천도교 개칭"
  summary:
    ko: "3대 교주 손병희가 동학의 이름을 천도교로 바꾸고 근대 종교로 체제를 갖추었다(1905). 동학 조직을 이끌고 친일 단체 일진회에 가담한 이용구 등은 교단에서 내쫓았다(1906). 천도교는 기관지 『만세보』(1906)를 펴내 민족 의식을 일깨웠고, 뒤에 3·1 운동에 앞장섰으며 『개벽』·『어린이』 등의 잡지를 펴냈다."
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["『만세보』 1906년", "국사편찬위원회 『신편 한국사』 46"]

- id: new-literature-1906
  year: 1906
  endYear: 1908
  title:
    ko: "신소설과 신체시"
  summary:
    ko: "이인직이 『만세보』에 『혈의 누』(1906)를 연재한 뒤 신소설이 널리 읽혔다. 신소설은 한글로 쓰였으며 신교육·자유 연애·미신 타파 같은 계몽 사상을 담았다. 안국선의 『금수회의록』(1908)은 동물의 입을 빌려 세태를 풍자했다가 출판법(1909)으로 판매가 금지되었다. 최남선은 잡지 『소년』 창간호(1908)에 신체시 「해에게서 소년에게」를 실었고, 같은 해 서울에 극장 원각사가 문을 열어 신극 『은세계』가 공연되었다."
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["이인직, 『혈의 누』", "『소년』 1908년 11월 창간호"]

- id: daejonggyo-1909
  year: 1909
  title:
    ko: "나철의 대종교 창시"
  summary:
    ko: "을사오적 처단을 꾀했던 나철이 오기호 등과 함께 단군을 받드는 단군교를 열고(1909), 이듬해 대종교로 이름을 고쳤다. 대종교는 단군 신앙으로 민족 의식을 높였고, 일제의 탄압을 피해 교단의 중심을 만주로 옮겼다. 대종교도들은 중광단(1911)을 조직했으며, 이는 북로 군정서로 이어져 청산리 대첩에 참여했다."
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["국사편찬위원회 『신편 한국사』 46", "국사편찬위원회 『한국독립운동사』"]

- id: education-ordinance-1911
  year: 1911
  title:
    ko: "제1차 조선 교육령"
  summary:
    ko: "조선 총독부가 일본 왕에게 충성하는 '충량한 국민'을 기른다는 목표로 제1차 조선 교육령을 공포했다. 한국인이 다니는 보통학교의 수업 연한을 4년으로 하여 일본인 학교보다 짧게 했고, 일본어 교육과 낮은 수준의 실업 교육을 중심으로 해 고등 교육의 기회를 거의 주지 않았다. 사립학교 규칙(1911)과 서당 규칙(1918)으로 민족 교육을 하던 사립 학교와 서당도 억눌렀다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "식민지 차별 교육" }
  tags: [politics, culture]
  sources: ["「조선 교육령」(1911)", "『조선총독부 관보』", "국사편찬위원회 『한국사』 47"]

- id: han-yongun-1913
  year: 1913
  title:
    ko: "한용운과 불교 유신 운동"
  summary:
    ko: "총독부는 사찰령(1911)을 만들어 주지 임명과 사찰 재산 처분을 총독이 허가하도록 해 불교계를 통제했다. 한용운은 『조선불교유신론』(1913)을 펴내 불교의 낡은 관습을 고치고 민중 속으로 들어가자고 주장했고, 조선 불교 유신회(1921) 등을 통해 사찰령 폐지 운동을 벌였다. 3·1 운동 때 민족 대표로 참여했으며, 시집 『님의 침묵』(1926)을 남겼다."
  subjects: [occupied-korea]
  tags: [culture]
  sources: ["한용운, 『조선불교유신론』", "「사찰령」(1911)", "국사편찬위원회 『한국사』 51"]

- id: won-buddhism-1916
  year: 1916
  title:
    ko: "원불교의 창시"
  summary:
    ko: "박중빈(소태산)이 전남 영광에서 깨달음을 얻고 새 불교를 열었다. 저축 조합을 만들어 모은 돈으로 바닷가 갯벌을 막아 논을 만들었고, 허례허식 폐지·미신 타파·근검저축·남녀평등을 내세운 새 생활 운동을 펼쳤다. 1924년 익산에서 불법 연구회를 세워 활동했고, 광복 뒤 원불교로 이름을 바꾸었다(1947)."
  subjects: [occupied-korea]
  tags: [culture, society]
  sources: ["『원불교 교사』", "국사편찬위원회 『한국사』 51"]

- id: great-unity-declaration-1917
  year: 1917
  title:
    ko: "대동단결 선언"
  summary:
    ko: "신규식·박은식·조소앙 등 14명이 상하이에서 대동단결 선언을 발표했다. 순종이 주권을 포기한 것은 곧 국민에게 주권을 넘겨준 것이라는 논리(국민 주권설·주권 불멸론)를 내세워, 국민이 주인인 공화제 정부를 세우자고 했다. 신규식은 이에 앞서 상하이에서 동제사(1912)를 만들어 독립운동가를 모았으며, 이 선언은 대한민국 임시정부 수립의 이론적 바탕이 되었다."
  subjects: [occupied-korea, roc]
  links:
    - { from: occupied-korea, to: roc, note: "상하이에서 선언 발표" }
  tags: [politics]
  sources: ["「대동단결 선언」(1917)", "국사편찬위원회 『한국사』 47"]

- id: kanto-massacre-1923
  year: 1923
  title:
    ko: "관동 대지진과 한인 학살"
  summary:
    ko: "일본 도쿄·요코하마 일대에 관동 대지진이 일어나자 한인이 우물에 독을 풀고 폭동을 일으킨다는 헛소문이 퍼졌다. 계엄령 아래 일본 군경과 민간 자경단이 수많은 한인을 학살했는데, 임시정부의 『독립신문』은 희생자를 6천여 명으로 보도했다. 이 혼란 속에서 박열도 붙잡혀 뒤에 일왕 암살을 꾀했다는 대역죄로 재판을 받았다."
  subjects: [japan, occupied-korea]
  links:
    - { from: japan, to: occupied-korea, note: "재일 한인 학살" }
  tags: [society]
  sources: ["『독립신문』 1923년 기사", "국가기록원 『일본 진재시 피살자 명부』"]

- id: children-movement-1923
  year: 1923
  title:
    ko: "방정환과 소년 운동"
  summary:
    ko: "천도교 소년회(1921)를 이끈 방정환이 '어린이'라는 말을 널리 쓰며 어린이를 한 사람의 인격체로 존중하자고 주장했다. 1922년 천도교 소년회가 어린이날을 정했고, 1923년 조선 소년 운동 협회가 첫 어린이날 기념식을 열었다. 방정환은 같은 해 잡지 『어린이』를 펴내고 도쿄에서 색동회를 조직했다. 천도교는 이 밖에도 『개벽』·『신여성』 같은 잡지를 펴내 민중 계몽에 힘썼다."
  subjects: [occupied-korea]
  tags: [society, culture]
  sources: ["『어린이』 창간호(1923)", "『동아일보』 1923년 5월 기사", "국사편찬위원회 『한국사』 49"]

- id: labor-farmer-league-1924
  year: 1924
  endYear: 1931
  title:
    ko: "조선 노농 총동맹과 노동·농민 운동"
  summary:
    ko: "3·1 운동 뒤 조선 노동 공제회(1920) 등 노동자·농민 단체가 늘어나 1924년 전국 조직인 조선 노농 총동맹이 만들어졌고, 1927년 조선 노동 총동맹과 조선 농민 총동맹으로 나뉘었다. 1930년대에는 일제의 탄압으로 합법 활동이 어려워지자 사회주의자들이 비합법적인 혁명적 노동조합·농민 조합을 만들어 항일 투쟁의 성격을 띠었다. 평원 고무 공장 노동자 강주룡은 임금 삭감에 맞서 평양 을밀대 지붕에 올라 고공 농성을 벌였다(1931)."
  subjects: [occupied-korea]
  tags: [society, economy]
  sources: ["『동아일보』 1924년 기사", "『동광』 1931년 7월호", "국사편찬위원회 『한국사』 49"]

- id: provisional-government-reform-1925
  year: 1925
  endYear: 1944
  title:
    ko: "임시정부의 개헌과 이동"
  summary:
    ko: "임시 의정원이 위임 통치 청원 등을 문제 삼아 이승만 대통령을 탄핵하고 박은식을 2대 대통령으로 뽑았다(1925). 이어 헌법을 고쳐 국무령 중심의 내각 책임제(1925), 국무위원 중심의 집단 지도 체제(1927), 김구 주석 중심 체제(1940), 김구·김규식의 주석·부주석 체제(1944)로 바뀌었다. 윤봉길 의거(1932) 뒤 일제의 추적을 피해 상하이를 떠나 항저우·창사·광저우 등을 거쳐 1940년 충칭에 자리 잡았다."
  subjects: [occupied-korea, roc]
  links:
    - { from: occupied-korea, to: roc, note: "상하이에서 충칭까지 이동" }
  tags: [politics]
  sources: ["「대한민국 임시 헌법」·「대한민국 임시 약헌」", "『대한민국 임시정부 공보』", "국사편찬위원회 『한국독립운동사』"]

- id: arirang-1926
  year: 1926
  title:
    ko: "나운규의 영화 「아리랑」"
  summary:
    ko: "나운규가 각본·감독·주연을 맡은 무성 영화 「아리랑」이 서울 단성사에서 개봉해, 식민지 민중의 설움과 저항 의식을 그려 큰 인기를 끌었다. 1920년대에는 토월회(1923)가 신극 운동을 벌였고, 조선 프롤레타리아 예술가 동맹(카프, 1925)이 결성되어 계급 의식을 강조하는 프롤레타리아 문학을 이끌었다."
  subjects: [occupied-korea]
  tags: [culture]
  sources: ["『조선일보』 1926년 10월 기사", "국사편찬위원회 『한국사』 51"]

- id: rural-revitalization-1932
  year: 1932
  endYear: 1940
  title:
    ko: "농촌 진흥 운동과 남면북양 정책"
  summary:
    ko: "세계 대공황으로 쌀값이 떨어지고 소작 쟁의가 거세지자, 총독부는 '자력갱생'을 내세운 농촌 진흥 운동(1932~1940)을 벌여 농민을 통제하고 식민 지배 체제를 안정시키려 했다. 조선 소작 조정령(1932)과 조선 농지령(1934)을 만들어 소작 조건을 일부 조정했으나 지주 중심의 구조는 그대로였다. 또 일본 방직 공업의 원료를 얻으려고 남부에는 면화를, 북부에는 양을 기르게 하는 남면북양 정책을 폈다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "농촌 통제와 원료 수탈" }
  tags: [economy, politics]
  sources: ["「조선 농지령」(1934)", "『조선총독부 관보』", "국사편찬위원회 『한국사』 50"]

- id: hinomaru-erasure-1936
  year: 1936
  title:
    ko: "손기정과 일장기 말소 사건"
  summary:
    ko: "손기정이 베를린 올림픽 마라톤에서 금메달을, 남승룡이 동메달을 땄다. 『조선중앙일보』와 『동아일보』가 사진 속 손기정의 가슴에 달린 일장기를 지우고 보도하자, 총독부는 『동아일보』를 무기 정간했고 『조선중앙일보』는 끝내 폐간되었다(1937). 일제는 1940년 『동아일보』와 『조선일보』마저 강제로 폐간했다."
  subjects: [occupied-korea, japan]
  links:
    - { from: japan, to: occupied-korea, note: "신문 정간·폐간" }
  tags: [culture, society]
  sources: ["『동아일보』 1936년 8월 25일", "국사편찬위원회 『한국사』 51"]

- id: pochonbo-1937
  year: 1937
  title:
    ko: "동북 항일 연군과 보천보 전투"
  summary:
    ko: "만주에서는 중국 공산당이 이끈 동북 항일 연군(1936)에 많은 한인이 참여해 중국인과 함께 항일 무장 투쟁을 벌였다. 동북 항일 연군 안의 한인들은 조국 광복회(1936)를 만들어 국내 조직과 연결하려 했다. 1937년 동북 항일 연군의 한 부대가 압록강을 건너 함경남도 갑산군 보천보의 경찰 주재소와 면사무소 등을 습격했고, 『동아일보』 등이 이를 크게 보도했다."
  subjects: [occupied-korea, manchukuo, japan]
  links:
    - { from: occupied-korea, to: japan, note: "보천보 습격" }
  tags: [war]
  sources: ["『동아일보』 1937년 6월 5일 호외", "국사편찬위원회 『한국사』 50"]
  places: [{ name: "보천보", at: [128.3, 41.53] }]

- id: independence-league-1941
  year: 1941
  endYear: 1942
  title:
    ko: "조선 독립 동맹과 조선 의용군"
  summary:
    ko: "화북으로 옮겨 간 조선 의용대 대원들이 조선 의용대 화북 지대를 만들어 중국 공산당 팔로군과 함께 싸웠고, 1941년 말 호가장 전투에서 일본군과 맞섰다. 1942년 타이항산 근거지에서 김두봉을 주석으로 조선 독립 동맹이 결성되었고, 화북 지대는 그 군대인 조선 의용군으로 바뀌었다. 조선 독립 동맹은 보통 선거에 의한 민주 공화국 수립과 대기업 국유화, 토지 분배를 내건 강령을 발표했으며, 뒤에 옌안(연안)으로 옮겨 활동하다 광복 뒤 북한으로 들어가 연안파를 이루었다."
  subjects: [occupied-korea, roc, japan]
  links:
    - { from: occupied-korea, to: japan, note: "화북에서 항일 무장 투쟁" }
  tags: [war, politics]
  sources: ["「조선 독립 동맹 강령」", "국사편찬위원회 『한국사』 50", "독립기념관 한국독립운동사연구소"]
  places: [{ name: "호가장", at: [114.3, 37.75] }]
