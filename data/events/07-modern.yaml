  title:
    ko: 신간회
  summary:
    ko: "정우회 선언을 계기로 비타협적 민족주의와 사회주의 세력이 연합해 신간회를 만들었다(회장 이상재). 일제 강점기 최대의 합법적 민족 운동 단체로, 광주 학생 항일 운동에 조사단을 보내고 민중 대회를 열려 했다. 자매 단체로 근우회가 있었다. 1931년 해소되었다. 이광수의 「민족적 경륜」(1924) 이후 일부 민족주의자들이 일제 지배 아래에서 자치권을 얻자는 자치 운동을 펼치자, 이를 비판한 비타협적 민족주의자들이 사회주의 세력과 손을 잡은 것이다."
  subjects: [occupied-korea]
  tags: [politics]
  sources: ["『조선일보』 1927년", "「신간회 강령」"]

