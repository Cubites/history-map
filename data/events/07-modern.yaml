- id: independence-club-1896
  year: 1896
  endYear: 1898
  title:
    ko: 독립 협회와 만민 공동회
  summary:
    ko: "서재필이 『독립신문』을 창간하고 독립 협회를 세워 독립문을 지었다. 만민 공동회를 열어 러시아의 절영도 조차 요구를 막고, 관민 공동회에서 헌의 6조를 결의했다. 의회식 중추원 관제가 반포되었으나, 보수 세력이 공화정을 세우려 한다고 모함해 황국 협회를 동원해 해산시켰다. 독립문은 청의 사신을 맞던 영은문을 헐어 낸 자리 가까이에 세웠다. 독립 협회는 러시아의 재정 고문과 군사 교관을 돌려보내고 한러 은행을 문 닫게 하는 이권 수호 운동도 벌였다."
  subjects: [joseon, russia]
  links:
    - { from: joseon, to: russia, note: "절영도 조차 반대 (1898)" }
  tags: [politics, society]
  sources: ["『독립신문』", "『고종실록』 고종 35년"]

- id: daehan-jeguk-1897
  year: 1897
  title:
    ko: 대한제국 수립
  summary:
    ko: 고종이 경운궁(덕수궁)으로 돌아와 연호를 '광무'로 고치고, 환구단에서 황제 즉위식을 올린 뒤 국호를 '대한'으로 정했다.
  subjects: [joseon, daehan-jeguk]
  links:
    - { from: joseon, to: daehan-jeguk, note: "국호 변경, 황제 즉위" }
