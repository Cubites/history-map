- id: gwangmu-reform-1899
  year: 1899
  endYear: 1904
  title:
    ko: 대한국 국제와 광무개혁
  summary:
    ko: 황제가 군대 통수권, 입법·사법·행정권을 모두 가진다는 대한국 국제를 반포했다. 구본신참을 내세워 원수부를 두고, 양전 사업을 벌여 토지 소유자에게 지계를 발급했다. 상공업 진흥책으로 회사와 공장을 세우고 실업 학교를 설립했으며, 한성 전기 회사의 전차가 다니고 경인선이 개통되었다(1899).
  subjects: [daehan-jeguk]
  tags: [politics, economy]
  sources: ["『고종실록』 고종 36년", "「대한국 국제」"]

- id: dokdo-edict-1900
  year: 1900
  title:
    ko: 대한제국 칙령 제41호 (울도군 설치)
  summary:
    ko: 울릉도를 울도군으로 높이고 울릉 전도와 죽도, 석도(독도)를 관할하게 해, 독도가 대한제국의 영토임을 법으로 밝혔다.
