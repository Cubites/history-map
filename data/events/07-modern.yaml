  tags: [politics, diplomacy]
  sources: ["『고종실록』 고종 44년", "『순종실록』 순종 즉위년"]

- id: jeongmi-uibyeong-1907
  year: 1907
  endYear: 1909
  title:
    ko: 정미의병과 서울 진공 작전
  summary:
    ko: "해산된 군인들이 의병에 합류해 의병 전쟁으로 발전했다. 이인영·허위가 이끄는 13도 창의군이 서울 진공 작전을 벌이고(1908) 각국 영사관에 국제법상 교전 단체로 인정해 달라고 요구했다. 일제는 '남한 대토벌 작전'(1909)으로 의병을 탄압했고, 의병들은 간도와 연해주로 옮겨 갔다. 군대가 해산되던 날 시위대 대대장 박승환이 자결하자 병사들이 서울 남대문 일대에서 일본군과 시가전을 벌였고, 원주 진위대 등 지방 군인들도 의병에 합류했다."
  subjects: [daehan-jeguk, japan]
  links:
    - { from: daehan-jeguk, to: japan, note: "의병 전쟁" }
    - { from: japan, to: daehan-jeguk, note: "남한 대토벌 작전" }
