- id: sin-chaeho-1908
  year: 1908
  title:
    ko: 신채호의 「독사신론」과 애국 계몽 운동
  summary:
    ko: "신채호가 『대한매일신보』에 「독사신론」을 실어 민족주의 역사학의 방향을 제시했다. 국문 연구소(1907)에서 주시경·지석영이 한글을 연구했고, 『을지문덕전』·『이순신전』 같은 위인전이 널리 읽혔다. 일제는 신문지법·보안법(1907)으로 언론과 집회를 탄압했다. 박은식은 『유교 구신론』(1909)에서 양명학을 바탕으로 유교를 백성 중심으로 개혁하자고 주장했다. 일제는 사립학교령(1908)과 출판법(1909)으로 민족 교육과 출판도 통제했다."
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["『대한매일신보』 1908년", "『순종실록』"]

- id: oriental-development-1908
  year: 1908
  title:
    ko: 동양 척식 주식회사 설립
  summary:
