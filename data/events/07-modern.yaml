  tags: [diplomacy]
  sources: ["『고종실록』 고종 19년·20년", "「조미 수호 통상 조약」"]

- id: imo-1882
  year: 1882
  title:
    ko: 임오군란
  summary:
    ko: 별기군과의 차별 대우와 밀린 급료에 불만을 품은 구식 군인들이 난을 일으켜 일본 공사관을 공격했다. 흥선 대원군이 잠시 다시 집권했으나 청군이 대원군을 납치해 갔다. 이후 일본과 제물포 조약(배상금, 공사관 경비병 주둔)을, 청과 조청 상민 수륙 무역 장정(청 상인의 내지 통상)을 맺었고, 청은 마젠창과 묄렌도르프를 고문으로 보내 내정에 간섭했다.
  subjects: [joseon, qing, japan]
  links:
    - { from: qing, to: joseon, note: "군란 진압, 대원군 납치, 내정 간섭" }
    - { from: japan, to: joseon, note: "제물포 조약" }
  tags: [politics, war]
  sources: ["『고종실록』 고종 19년", "「제물포 조약」", "「조청 상민 수륙 무역 장정」"]

