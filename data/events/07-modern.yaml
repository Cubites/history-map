- id: mitsuya-1925
  year: 1925
  title:
    ko: 미쓰야 협정과 3부
  summary:
    ko: 만주에서 참의부·정의부·신민부의 3부가 자치 행정과 무장 활동을 펼쳤다. 조선 총독부 경무국장 미쓰야와 만주 군벌이 독립운동가를 체포해 넘기는 미쓰야 협정을 맺어 독립군이 큰 어려움을 겪었고, 3부는 국민부와 혁신 의회로 재편되었다.
