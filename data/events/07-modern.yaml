- id: gabo-reform-1894
  year: 1894
  endYear: 1895
  title:
    ko: 갑오개혁 (1·2차)
  summary:
    ko: "일본의 간섭 속에 군국기무처가 개혁을 추진했다(1차). 과거제와 신분제, 연좌제, 조혼을 없애고 은 본위 화폐 제도와 조세의 금납화를 시행했다. 2차 개혁에서는 고종이 홍범 14조를 반포하고, 8아문을 7부로, 8도를 23부로 바꾸었으며 재판소를 설치하고 교육 입국 조서를 발표했다. 이에 앞서 정부는 전주 화약 뒤 교정청을 두어 스스로 개혁하려 했으나, 일본군이 경복궁을 점령하면서 뜻을 이루지 못했다. 1차 개혁 때는 '개국' 기년을 쓰고, 궁내부를 두어 왕실 사무를 정부와 나누었으며, 6조를 8아문으로 바꾸고 탁지아문이 재정을 도맡게 했다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "개혁 간섭" }
  tags: [politics]
  sources: ["『고종실록』 고종 31년·32년", "「홍범 14조」"]

- id: donghak-second-1894
  year: 1894
  title:
    ko: 동학 농민 운동 (2차 봉기와 우금치 전투)
  summary:
    ko: 일본군이 경복궁을 점령하자 농민군이 반외세를 내세우며 다시 봉기했다. 남접과 북접이 논산에서 합류했으나 공주 우금치에서 일본군과 관군에 크게 패했고 전봉준이 체포되었다. 폐정 개혁 요구의 일부는 갑오개혁에 반영되었다.
  subjects: [joseon, japan]
  links:
