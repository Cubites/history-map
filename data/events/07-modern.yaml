- id: annexation-1910
  year: 1910
  title:
    ko: 국권 피탈
  summary:
    ko: "일본이 이른바 '한국 병합 조약'을 강요해 대한제국의 국권을 빼앗고 조선 총독부를 설치했다. 황현은 「절명시」를 남기고 자결했다. 앞서 친일 단체 일진회가 합방을 청원했고(1909), 일제는 1910년 6월 경찰권마저 빼앗았다. 조약은 총리대신 이완용과 통감 데라우치 사이에 맺어져 8월 22일 조인되고 29일 공포되었다. 조선 총독은 일본 육해군 대장 가운데에서 임명되어 행정·입법·사법·군사권을 모두 쥐었고, 중추원은 친일 인사로 채운 형식적인 자문 기구에 지나지 않았다."
  subjects: [daehan-jeguk, japan, occupied-korea]
