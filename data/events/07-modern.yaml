  tags: [politics, society]
  sources: ["「기미 독립 선언서」", "박은식, 『한국독립운동지혈사』"]

- id: provisional-government-1919
  year: 1919
  title:
    ko: 대한민국 임시정부 수립
  summary:
    ko: "상하이에서 민주 공화제를 채택한 대한민국 임시정부가 세워졌다(국무총리 이승만). 연통제와 교통국으로 국내와 연락하고, 독립 공채를 발행했으며, 구미 위원부를 두고 외교 활동을 펼쳤다. 『독립신문』을 발행하고 사료 편찬소에서 『한일관계사료집』을 펴냈다. 이 정부는 연해주의 대한 국민 의회, 서울의 한성 정부와 통합해(1919년 9월) 이승만을 대통령, 이동휘를 국무총리로 하는 통합 임시정부가 되었다."
  subjects: [occupied-korea, roc]
  links:
