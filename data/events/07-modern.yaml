  tags: [diplomacy]
  sources: ["「가쓰라-태프트 각서」", "「포츠머스 조약」"]

- id: eulsa-1905
  year: 1905
  title:
    ko: 을사늑약과 통감부 설치
  summary:
    ko: 일본이 군대를 동원해 강압적으로 을사늑약(제2차 한일 협약)을 맺어 대한제국의 외교권을 빼앗고, 이듬해 통감부를 두어 이토 히로부미가 초대 통감이 되었다. 고종은 조약에 서명하지 않았다. 장지연은 「시일야방성대곡」을 쓰고 민영환은 자결했으며, 민종식·최익현·신돌석(평민 의병장) 등이 을사의병을 일으켰다.
