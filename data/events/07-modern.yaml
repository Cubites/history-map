    ko: 헤이그 특사와 고종 강제 퇴위
  summary:
    ko: 고종이 네덜란드 헤이그의 만국 평화 회의에 이준·이상설·이위종을 특사로 보내 을사늑약의 무효를 알리려 했으나 실패했다. 일본은 이를 구실로 고종을 강제로 물러나게 하고 한일 신협약(정미 7조약)을 맺어 차관 정치를 시작했으며, 대한제국 군대를 해산했다.
