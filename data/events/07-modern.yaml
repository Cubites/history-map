- id: sinminhoe-1907
  year: 1907
  endYear: 1911
  title:
    ko: 신민회
  summary:
    ko: 안창호·양기탁 등이 공화정 수립을 목표로 비밀 결사 신민회를 만들었다. 대성 학교·오산 학교를 세우고 태극 서관과 자기 회사를 운영했으며, 서간도에 독립운동 기지(삼원보, 경학사, 신흥 강습소)를 만들었다. 105인 사건(1911)으로 해체되었다.
  subjects: [daehan-jeguk]
  tags: [politics, society]
  sources: ["국사편찬위원회 『한국독립운동사』", "『대한매일신보』"]

- id: sin-chaeho-1908
  year: 1908
  title:
    ko: 신채호의 「독사신론」과 애국 계몽 운동
  summary:
    ko: 신채호가 『대한매일신보』에 「독사신론」을 실어 민족주의 역사학의 방향을 제시했다. 국문 연구소(1907)에서 주시경·지석영이 한글을 연구했고, 『을지문덕전』·『이순신전』 같은 위인전이 널리 읽혔다. 일제는 신문지법·보안법(1907)으로 언론과 집회를 탄압했다.
  subjects: [daehan-jeguk]
  tags: [culture]
  sources: ["『대한매일신보』 1908년", "『순종실록』"]

