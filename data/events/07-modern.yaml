  summary:
    ko: 대한제국이 국외 중립을 선언했으나 일본은 러시아를 기습하고 한일 의정서를 강요해 군사 요지를 쓸 수 있게 했다. 이어 제1차 한일 협약으로 메가타(재정)와 스티븐스(외교)를 고문으로 보내는 고문 정치를 시작했다.
