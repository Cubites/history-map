  summary:
    ko: 일본에서 들여온 차관 1,300만 원을 국민의 힘으로 갚자며 대구에서 서상돈 등이 시작했다. 『대한매일신보』 등 언론이 지원하고 금연·금주와 여성들의 비녀·가락지 모으기로 전국에 퍼졌으나 통감부의 탄압으로 실패했다.
