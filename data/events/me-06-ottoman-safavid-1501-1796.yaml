# 서아시아·북아프리카 사건 5차 묶음(me-06): 사파비·오스만의 아랍 지방·아라비아와 걸프·마그레브의 사드·알라위, 호타키·아프샤르·잔드·카자르 (1501 ~ 1796)
# 범위: 이스마일 1세와 사파비 왕조의 성립·아크코윤루와 티무르 왕조의 끝(1501~1510), 타흐마스프 1세, 아바스 1세의 개혁·이스파한·영토 회복, 바그다드를 둘러싼 전쟁과 주하브 조약,
#   사파비의 쇠퇴, 호타키의 칸다하르 봉기와 이스파한 함락, 나디르 샤와 인도 원정, 카림 칸의 잔드 왕조, 아가 무함마드 칸과 카자르 왕조, 오스만의 이라크 장악과 이라크의 맘루크 파샤,
#   오스만의 이집트 주 편성과 메카 샤리프의 복속, 이집트 베이들의 부활, 오스만의 예멘과 카심 이맘국·모카 무역·라헤즈의 자립, 걸프의 포르투갈과 알하사·바니 할리드,
#   야루바·부사이드의 오만, 디리야의 사우드 가문과 무함마드 이븐 압드 알와하브, 레바논 산의 파흐르 앗딘과 갈릴리의 다히르 알우마르,
#   스페인의 마그레브 거점, 사드 왕조의 흥기와 알카사르키비르·아흐마드 알만수르, 바르바로사 형제와 알제, 튀니스 재정복과 하프스 왕조의 끝, 트리폴리·페잔,
#   딜라 자위야와 알라위 왕조(물라이 이스마일), 알제 섭정의 성립, 튀니스 후사인 왕조·트리폴리 카라만리 왕조.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1501~1796년 지도에서 생기거나 끝난 항목과 1만 km²(주변 등급 땅은 5만 km²)를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   긴 과정은 한 사건에 여러 나라를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 이 시대 서아시아와 직접 닿는 한국 항목은 없어 subjects로 잇지 않았다.
#   유럽·중국 파일의 셀림 1세의 맘루크 정복과 찰디란·아마시아 조약과 1590년 강화·오스만-사파비 전쟁과 나수흐 파샤 조약·동조지아·튀니스 원정과 프레베자 해전·레판토 해전·스페인 무적함대의 패배·러시아-튀르크 전쟁은
#   다시 쓰지 않고 「제목」으로 가리켰다. 프랑스의 이집트 원정(1798) 이후는 다음 묶음의 몫이다.
# 날짜: 1582년 전은 율리우스력이다. 히즈라력 날짜는 양력 해로 바꾸어 적었고 확실하지 않은 날짜는 '무렵'으로 적었다. 사료마다 해가 갈리는 일(아바스 1세의 즉위 1587/1588 등)은 갈린다고 밝혔다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서의 굳은 표기(무함마드·칼리프·사파비)를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며, 오스만 인물은 튀르크식(바르바로사 형제의 오루츠·하이레딘),
#   지명은 지금도 쓰는 이름은 지금 나라 말(이스파한·타브리즈·바그다드·시라즈·튀니스), 옛 도시는 굳은 표기(트리폴리·알카사르키비르). 나라 이름은 항목 이름을 따랐다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 표준 개설서의 원서 위주(한국어 번역본은 핑클의 『오스만제국사』만 사용).
#   병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 피정복민·소수자와 종파 서술은 한쪽 입장만 따르지 않고 전승과 학설을 구분했다.

- id: safavid-ismail-1501
  year: 1501
  endYear: 1510
  title:
    ko: "이스마일 1세와 사파비 왕조의 성립(1501~1510)"
  summary:
    ko: "사파비는 아르다빌의 수피 교단(사파비야)에서 비롯했다. 교단장 하이다르가 1488년 시르반 원정에서 죽은 뒤, 1487년에 태어난 아들 이스마일이 기병 부족들(크즐바시, '붉은 머리'라는 뜻)의 지지를 얻어 1500년 시르반샤를 치고 이듬해 아제르바이잔으로 나아갔다. 1501년 나히체반 근처에서 아크코윤루의 알반드를 무찌른 그는 타브리즈에서 샤로 즉위하고 열두 이맘파를 나라 종교로 선포했다. 그때 이란 주민은 수니파가 많았으므로 개종은 설교와 압력, 저항하는 수니 울라마에 대한 탄압을 함께 겪었고, 사파비는 레바논 자발 아밀 같은 곳의 시아파 학자를 불러 와 법과 교리를 갖추었다. 이스마일은 1503년 하마단 전투 뒤 이라크아잠·파르스·케르만을 차지해 아크코윤루의 중심을 무너뜨렸고, 1508년에는 바그다드와 메소포타미아를 얻어 아크코윤루가 끝났다. 같은 1508년 후제스탄의 무샤샤 왕조도 사파비의 총독 아래로 들어갔다. 동쪽에서는 우즈베크의 무함마드 샤이바니 칸이 1500~1501년 사마르칸트, 1507년 헤라트를 차지하며 티무르 왕조의 마지막 군주들을 몰아냈고, 이로써 티무르 왕조가 끝났다. 이스마일은 1510년 12월 메르브 근처에서 샤이바니 칸을 죽이고 호라산과 시스탄을 사파비 아래에 두었다. 이슬람 정복 뒤 이란 고원 대부분이 이란 출신 왕조 아래 하나로 묶인 것은 이때가 처음이라는 평가가 있다. 그러나 1514년 찰디란에서 오스만의 셀림 1세에게 크게 져 서쪽 확장은 멈추었다(「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 뒤의 사건). 같은 시기 카이로에서는 맘루크가 마지막 시기를 맞고 있었다(「맘루크 술탄국의 마지막: 칸수 알가우리와 투만바이 2세(1501~1517)」, 같은 시기의 사건)."
  subjects: [safavid-iran, aq-qoyunlu, musha-sha, timurid-empire]
  links:
    - { from: safavid-iran, to: aq-qoyunlu, note: "타브리즈 즉위, 이란 중·남부와 바그다드 장악 (1501~1508)" }
    - { from: safavid-iran, to: musha-sha, note: "후제스탄 병합 (1508)" }
  tags: [politics, war, religion]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson 편, Laurence Lockhart 공편, Cambridge University Press, 1986)", "Andrew J. Newman, Safavid Iran: Rebirth of a Persian Empire (I.B. Tauris, 2006)"]

- id: yemen-tahirid-1504
  year: 1504
  endYear: 1570
  title:
    ko: "타히르 왕조의 끝과 오스만의 예멘 진출(1504~1570)"
  summary:
    ko: "타히르 왕조는 1454년 라술 왕조에게서 아덴을 빼앗은 형제가 세운 술탄국으로, 자비드와 아덴을 오가며 티하마 해안과 남부 고지를 다스렸다. 술탄 아미르 2세(재위 1489~1517)는 1504년 자이드파 이맘이 쥐던 사나를 되찾아 영토를 넓혔다. 그러나 1507년 포르투갈이 소코트라를 차지하고 인도양에서 홍해 무역을 위협하자 맘루크가 후사인 알쿠르디의 함대를 보냈다. 이 함대는 1509년 디우에서 졌고 1515년 다시 예멘에 닿았지만, 아미르 2세는 물자 대는 일을 거부했다. 1513년 포르투갈의 아덴 공격을 스스로 막아 낸 그였으나, 1517년 맘루크가 이끈 연합군에 져 사나 근처에서 붙잡혀 처형당했고 타히르 왕조는 끝났다. 맘루크는 자비드에 공물을 바치는 정권을 세웠지만, 같은 해 오스만이 이집트를 차지하면서 곧 뿌리를 잃었다. 1538년 오스만의 하딤 술레이만 파샤가 아덴에서 그곳의 마지막 수장 아미르 이븐 다우드를 처형하고 도시를 얻어 예멘 주를 세웠으며, 인도 구자라트의 디우 원정은 실패했다. 오스만은 티하마와 남부를 쥐었으나 북쪽 고지의 자이드파 이맘국과 오랫동안 맞섰다. 1546년 우바이스 파샤가 타이즈를 차지했고, 뒤이어 외즈데미르 파샤가 사나를 차지했다는 기록이 있으며(연대는 1546~1548년으로 적는 자료와 1549년 이후로 적는 자료가 갈린다), 이맘 무타하르는 1560년대 말 반란을 이끌어 사나를 한때 되찾았다. 오스만은 1569~1570년 시난 파샤의 원정으로 아덴과 타이즈를 되찾고 고지의 반란을 일단 눌렀으나, 시밤 카우카반 포위는 휴전으로 끝났고 사나의 지배는 곧 다시 흔들렸다. 자비드와 아덴은 인도양과 홍해를 잇는 항구여서 향신료·직물 거래의 관세가 큰 수입이었고, 이 이익을 두고 포르투갈과 맘루크, 오스만이 차례로 부딪혔다. 예멘 주는 총독이 자주 바뀌고 병력을 채우기 어려워 오스만의 주 가운데 다스리기 힘든 곳으로 꼽혔다."
  subjects: [tahirid-sultanate, mamluk-sultanate, ottoman, zaydi-imamate, portugal]
  tags: [politics, war]
  sources: ["The Cambridge History of Islam, vol. 1A: The Central Islamic Lands from Pre-Islamic Times to the First World War (P. M. Holt·Ann K. S. Lambton·Bernard Lewis 편, Cambridge University Press, 1970)", "R. B. Serjeant, The Portuguese off the South Arabian Coast: Hadrami Chronicles (Clarendon Press, 1963)", "Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (Palgrave Macmillan, 2002)"]

- id: spanish-presidios-1509
  year: 1509
  endYear: 1510
  title:
    ko: "스페인의 북아프리카 거점 점령: 오랑·베자이아·트리폴리(1509~1510)"
  summary:
    ko: "1492년 그라나다를 정복한 스페인은 무슬림 해적을 막고 북아프리카 해안에 발판을 두려 했다. 톨레도 대주교 시스네로스 추기경이 비용을 대고 페드로 나바로가 이끈 원정군은 1509년 5월 자이얀 왕조의 서쪽 항구 오랑을 차지했는데, 도시를 점령하며 수천 명이 죽거나 포로가 되었다는 기록이 있다(수는 사료마다 갈린다). 이듬해 1월에는 하프스 왕조의 항구 베자이아(부지)를 얻었고, 하프스의 술탄은 내륙 산지로 물러났다. 7월에는 트리폴리를 공격해 점령했다. 알제 앞바다 섬의 요새(페뇬)도 이때 지어져 알제는 스페인에 조공을 바치게 되었다. 틀렘센의 자이얀 왕은 스페인에 공납하는 처지가 되었다. 그러나 8월 제르바 섬 원정에서 스페인군이 크게 져 기세가 꺾였다. 스페인은 해안 거점(프레시디오)을 지켰지만 내륙으로 들어가지 못했고, 해안 도시 주민은 세금과 조공으로 다스림을 받았다. 이 거점들에 맞서 오스만과 손잡은 바르바로사 형제가 알제에서 일어서게 된다. 스페인은 이에 앞서 1497년 멜리야, 1505년 메르스엘케비르, 1508년 페뇬 데 벨레스 데 라 고메라를 차지했고, 이 거점들은 포르투갈이 모로코 대서양 해안에 둔 기지들과 함께 이베리아의 북아프리카 변경을 이루었다. 시스네로스는 이 원정을 십자군의 연장으로 여겼으나, 실제 목적은 해적 기지를 없애고 곡물과 교역로를 확보하는 데 있었다고 보는 연구도 많다. 점령된 도시의 주민은 학살과 약탈, 포로 매매의 피해를 입었고 일부 무슬림과 유대인은 내륙으로 피했다. 오랑에는 스페인 수비대와 총독이 자리를 잡아 스페인 왕실의 지원금에 기대 도시를 지켰다. 스페인 왕실의 관심은 곧 이탈리아 전쟁과 신대륙으로 옮겨 가 정복은 더 나아가지 않았다. 이 점이 스페인의 진출이 해안 거점에 머문 까닭이었다."
  subjects: [spain, hafsid-sultanate, zayyanid-kingdom]
  links:
    - { from: spain, to: zayyanid-kingdom, note: "오랑 점령 (1509)" }
    - { from: spain, to: hafsid-sultanate, note: "베자이아·트리폴리 점령 (1510)" }
  tags: [war, politics]
  sources: ["Andrew C. Hess, The Forgotten Frontier: A History of the Sixteenth-Century Ibero-African Frontier (University of Chicago Press, 1978)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]

- id: saadi-rise-1510
  year: 1510
  endYear: 1557
  title:
    ko: "사드 왕조의 흥기와 와타스 왕조의 끝(1510~1557)"
  summary:
    ko: "15세기 말부터 포르투갈이 모로코 대서양 해안의 아가디르(1505)·사피(1508)·아제무르(1513)·마자간(1514~1515)을 차지하자, 와타스 왕조의 술탄은 이를 막지 못했다. 남쪽 수스 지방의 부족들은 예언자의 후손(샤리프)을 자처하는 사드 가문의 무함마드 알카임을 1510년 저항의 지도자로 세웠다. 그의 아들 아흐마드 알아라지는 1524~1525년 마라케시를 차지했고, 1517년 아버지가 죽은 뒤 형제 무함마드 알샤이크가 수스를 쥐었다. 1527년 타들라 조약으로 와타스가 북쪽 페스, 사드가 남쪽을 맡기로 했지만 오래가지 못했고, 무함마드 알샤이크는 1541년 아가디르를 포르투갈에게서 되찾으며 명성을 높였다. 1549년 그는 페스를 차지해 와타스 왕조를 무너뜨렸다. 와타스의 마지막 군주 알리 아부 하순은 알제의 오스만 총독 살라흐 레이스의 도움으로 1554년 페스에 돌아왔으나, 같은 해 타들라 근처에서 사드 군에 져 죽었고 와타스 왕조는 완전히 끝났다. 알제는 모로코를 가까이 두려 와타스를 편들었고, 무함마드 알샤이크는 1557년 오스만 첩자의 손에 암살당한 것으로 전한다. 사드 왕조는 화승총과 대포를 도입하고 사탕수수 농장을 키워 나라의 바탕을 다졌다. 한편 포르투갈에게 빼앗긴 항구들에서는 주민이 쫓겨나거나 포로가 되는 일이 많았고, 이는 사드 가문이 저항의 기수로 내세워진 까닭이었다. 사드 가문은 포르투갈에 맞선 성전을 내세워 수피 교단(자위야)과 부족의 지지를 모았고, 군은 안달루스 이주민과 도시 상인의 기술을 받아들였다. 수스 평야에는 사탕수수 제당소가 늘어 설탕이 유럽으로 수출되었다. 이 무렵 모로코는 북쪽의 포르투갈·스페인 거점, 동쪽의 오스만 알제, 남쪽의 사하라 교역로 사이에서 균형을 잡아야 했다."
  subjects: [saadi-sultanate, wattasid-sultanate, ottoman, portugal]
  links:
    - { from: saadi-sultanate, to: wattasid-sultanate, note: "페스 점령 (1549), 와타스 왕조의 끝 (1554)" }
  tags: [politics, war]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Weston F. Cook Jr., The Hundred Years War for Morocco: Gunpowder and the Military Revolution in the Early Modern Muslim World (Westview Press, 1994)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Ralph Manheim 옮김, Princeton University Press, 1977)"]

- id: ottoman-algiers-1516
  year: 1516
  endYear: 1554
  title:
    ko: "바르바로사 형제와 오스만의 알제 진출(1516~1554)"
  summary:
    ko: "레스보스 출신 해적 오루츠와 하이레딘 형제(바르바로사 형제)는 튀니지 하프스 왕조의 항구를 기지로 삼다가 1516년 알제를 차지했다. 알제는 스페인의 페뇬 요새에 조공을 바치던 도시였고, 오루츠는 도시의 지배자를 몰아냈다. 1518년 틀렘센 근처에서 스페인과 맞서다 죽은 오루츠의 뒤를 이은 하이레딘은 1519년 셀림 1세에게 충성을 맹세하고 오스만의 병력과 대포를 받았다. 1529년 페뇬 요새를 무너뜨려 스페인의 발판을 지운 그는 1533년 술레이만 1세에게 불려 가 오스만 함대 사령관(카푸단 파샤)이 되었고, 알제는 오스만이 임명하는 총독(베일레르베이)이 다스렸다. 1534년 하이레딘이 튀니스를 차지했다가 이듬해 카를 5세에게 빼앗기는 과정은 「튀니스 원정과 밀라노 공국의 끝, 프레베자 해전」(뒤의 사건)에 있다. 1541년 카를 5세가 알제를 공격했으나 폭풍으로 함대가 흩어져 실패했다. 알제의 총독들은 16세기 전반부터 동쪽의 하프스 영역으로 나아가 콘스탄틴 일대를 차츰 오스만 땅으로 만들었다(해는 1529년설과 1540년대설이 갈린다). 서쪽에서는 1551년 하산 코르소가 틀렘센을 둘러싼 사드 쪽 세력을 몰아냈고, 1554년 자이얀 왕조가 오스만의 보호령으로 끝났다. 알제 해적과 총독은 지중해에서 선박을 잡고 연안을 습격해 많은 그리스도교도를 포로로 삼았으며, 스페인은 같은 시기 무슬림 포로와 모리스코를 압박했다. 하이레딘은 스페인에서 쫓겨난 무슬림 일부를 배로 북아프리카에 옮겼다고 전한다. 이렇게 알제는 오스만의 서쪽 끝 변경 기지가 되었다(오스만의 로도스 점령은 「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 앞의 사건). 알제 항구는 이 무렵 해적 선장과 군인, 상인이 모이는 도시로 빠르게 커졌다."
  subjects: [ottoman, zayyanid-kingdom, hafsid-sultanate, spain, saadi-sultanate]
  links:
    - { from: ottoman, to: hafsid-sultanate, note: "콘스탄틴 일대 병합 (1540년대)" }
    - { from: ottoman, to: zayyanid-kingdom, note: "틀렘센 보호령 (1554)" }
  tags: [war, politics]
  sources: ["John B. Wolf, The Barbary Coast: Algeria under the Turks, 1500 to 1830 (W. W. Norton, 1979)", "Andrew C. Hess, The Forgotten Frontier: A History of the Sixteenth-Century Ibero-African Frontier (University of Chicago Press, 1978)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]

- id: ottoman-iraq-1517
  year: 1517
  endYear: 1546
  title:
    ko: "오스만의 이라크 장악: 모술·바그다드·바스라(1517~1546)"
  summary:
    ko: "1514년 찰디란에서 사파비를 무찌른 오스만의 셀림 1세는 타브리즈에 잠시 들어갔다가 물러났지만(「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 앞의 사건), 이어 동남 아나톨리아의 쿠르드 토후들을 끌어들여 디야르바크르와 마르딘을 차지했다. 이드리스 비틀리시 같은 쿠르드 학자가 협상을 맡았다. 1517년 비이크르 메흐메트 파샤가 모술 일대를 차지했고(주로 편성된 것은 1534~1538년 무렵), 사파비는 이라크 북부를 잃었다. 바그다드는 1508년 이스마일 1세가 차지한 뒤 사파비 총독이 다스렸는데, 전승에 따르면 이때 수니파의 성묘가 훼손되어 수니 주민이 불안을 겪었다. 술레이만 1세는 1533~1535년 두 이라크(이란 서부와 이라크) 원정에 나서 1534년 타브리즈를, 같은 해 11월 바그다드를 얻었다. 그는 바그다드에서 아부 하니파의 묘와 수피 성인 길라니의 묘를 돌보며 수니파 도시의 후원자로 나섰고 시아파 성지인 나자프와 카르발라도 찾았다고 전한다. 남쪽 바스라는 현지 아랍 수장이 1534~1536년 오스만의 종주를 받아들였고 1546년 오스만 수비대가 들어와 오스만 땅이 되었다(바스라는 1508~1524년 사파비가 차지한 적도 있다). 사파비는 1532년부터 이어진 전쟁 끝에 1555년 아마시아 조약으로 이 경계를 인정한다(「아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼」, 뒤의 사건). 이라크의 시아파 주민은 사파비 지배에서 오스만 지배로 넘어갔고, 두 제국 사이의 국경 지대에 놓인 성지 도시의 안정은 이후 두 나라 관계의 핵심이 되었다. 오스만은 정복한 땅을 주(에얄레트)와 산자크로 나누어 토지 조사로 세금을 정했고, 쿠르드 토후들은 세습 자치를 인정받았다. 바스라는 걸프와 인도양 교역으로 이어지는 입구였고, 오스만은 이곳에서 포르투갈의 걸프 진출을 막는 거점을 얻었다."
  subjects: [safavid-iran, ottoman]
  links:
    - { from: ottoman, to: safavid-iran, note: "모술(1517)·바그다드(1534) 정복" }
  tags: [war, politics]
  sources: ["Stephen H. Longrigg, Four Centuries of Modern Iraq (Clarendon Press, 1925)", "Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (Palgrave Macmillan, 2002)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]

- id: ottoman-egypt-1517
  year: 1517
  endYear: 1525
  title:
    ko: "오스만의 이집트 주 편성과 메카 샤리프의 복속(1517~1525)"
  summary:
    ko: "1517년 1월 리다니야 전투에서 맘루크를 무찌른 셀림 1세는 카이로에 들어갔고, 마지막 맘루크 술탄 투만바이 2세는 4월 처형당했다(「맘루크 술탄국의 마지막: 칸수 알가우리와 투만바이 2세(1501~1517)」, 앞의 사건). 셀림은 9월 카이로를 떠나기 전 마르즈 다비크에서 맘루크를 저버린 알레포 총독 하이르 베이를 이집트 총독에 앉혔다(앞서 임명된 유누스 파샤가 곧 해임된 뒤였고, 하이르 베이는 1522년 죽을 때까지 재임했다). 오스만은 맘루크 군인 계층을 없애지 않고 베이(귀족) 신분으로 행정에 참여시켰고, 이집트를 여러 산자크로 나누어 총독(파샤)과 예니체리 부대, 현지 베이가 서로 견제하는 틀을 두었다. 같은 해 메카 샤리프국의 샤리프 바라카트는 아들 아부 누마이를 보내 셀림에게 메카·메디나의 열쇠를 바쳤고, 오스만은 두 성지의 보호자 지위를 얻었다. 아바스 가문의 카이로 칼리프를 이스탄불로 옮겨 칼리프직을 넘겨받았다는 이야기는 후대에 부풀려졌다는 견해가 많다. 하이르 베이가 죽은 뒤 1523년 총독이 된 아흐메트 파샤는 1524년 스스로 술탄을 칭하며 반란을 일으켰으나 붙잡혀 처형되었다. 귀젤제 카심 파샤가 총독으로 사태를 수습한 뒤(1524~1525) 술레이만 1세는 대재상 이브라힘 파샤를 보냈고, 이브라힘은 1525년 이집트 법령집(칸운나메)을 반포해 세금과 총독·베이의 권한, 토지 행정을 정리했다. 이집트는 오스만의 주요 속주가 되었다. 카이로는 이슬람 세계의 학문 중심 알아즈하르와 홍해·지중해 무역로를 지닌 큰 도시로 남았다. 셀림 1세는 이집트의 학자와 기술자 일부를 이스탄불로 데려갔다고 전하고, 행정 문서에서는 튀르크어의 비중이 커졌다. 이집트의 곡물은 이스탄불과 두 성지의 식량 공급에서 중요했고 세금도 해마다 이스탄불로 보내졌으며, 해마다 순례단 편에 물자와 선물을 보내 메카와 메디나를 후원하는 일은 오스만 술탄의 권위와 이어졌다."
  subjects: [ottoman, mamluk-sultanate, sharifate-of-mecca]
  links:
    - { from: ottoman, to: sharifate-of-mecca, note: "메카 샤리프의 복속, 종주 (1517)" }
  tags: [politics, war]
  sources: ["P. M. Holt, Egypt and the Fertile Crescent, 1516–1922: A Political History (Cornell University Press, 1966)", "Stanford J. Shaw, The Financial and Administrative Organization and Development of Ottoman Egypt, 1517–1798 (Princeton University Press, 1962)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]

- id: al-hasa-1521
  year: 1521
  endYear: 1670
  title:
    ko: "포르투갈의 걸프 진출과 알하사: 자브르 토후국에서 바니 할리드까지(1521~1670)"
  summary:
    ko: "아라비아 동부 알하사 오아시스와 카티프 해안은 15세기 자브르 토후국이 다스렸고 아지와드 이븐 자므일(1496년 사망) 때 가장 컸다. 그가 죽은 뒤 나라는 나뉘었고 미그린이 알하사·카티프·바레인을 이었다. 포르투갈은 1507년 알부케르케가 호르무즈를 처음 점령했고 1515년 그곳 왕을 속국으로 삼아 걸프 입구를 쥐었다. 미그린이 호르무즈 왕국의 속령 바레인을 차지하자 호르무즈와 포르투갈이 1521년 힘을 합쳐 바레인을 쳤고, 미그린은 이 싸움에서 죽어 자브르 토후국은 이내 무너졌다. 뒤이어 오스만이 1550년 무렵 알하사와 카티프를 얻고 1550년대 초 알하사를 오스만 주로 세웠다. 그러나 1551년 포르투갈과 호르무즈 군이 카티프 요새를 점령해 허물 만큼 오스만의 힘은 약했다. 오스만은 포르투갈과 맞서는 데 이곳이 필요했지만 지방 부족을 다스릴 힘은 약했다. 바레인은 1602년 사파비가 포르투갈과 호르무즈 쪽에서 빼앗았다. 알하사와 카티프에는 시아파 주민이 많았는데, 이 모든 지배 아래에서 세금을 내며 살았다. 1669~1670년 바니 할리드 부족의 바라크 이븐 구라이르가 알하사의 오스만 수비대를 몰아내고 알무바라즈를 도읍으로 삼아 바니 할리드 토후국을 세웠다. 이 토후국은 알하사와 카티프를 쥐고 오아시스 농업과 걸프 무역, 진주 채취를 바탕으로 오래 이어졌다. 알하사 오아시스는 샘물을 끌어 대추야자와 쌀을 기르는 곳이었고, 카티프와 바레인 연안은 진주 채취가 중요한 수입원이었다. 이 부가 걸프 세력들이 다투는 까닭이었다. 바니 할리드의 지배층은 유목 부족 출신이었으나 오아시스 정착민과 시아파 공동체에게서 세금과 곡물을 거두었다. 바레인은 사파비가 얻은 뒤에도 포르투갈, 호르무즈, 현지 수장 사이에서 주인이 자주 바뀌었다. 이 지역은 외부 제국의 힘이 닿았다 사라지기를 되풀이하는 변경이었고, 토착 부족 연합이 그 힘의 빈틈을 채웠다."
  subjects: [jabrid-emirate, bani-khalid-emirate, ottoman, portugal, safavid-iran]
  links:
    - { from: bani-khalid-emirate, to: ottoman, note: "알하사에서 오스만 세력 축출 (1669~1670)" }
  tags: [politics, war]
  sources: ["Willem Floor, The Persian Gulf: A Political and Economic History of Five Port Cities, 1500–1730 (Mage Publishers, 2006)", "R. B. Serjeant, The Portuguese off the South Arabian Coast: Hadrami Chronicles (Clarendon Press, 1963)", "Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)"]

- id: tahmasp-1524
  year: 1524
  endYear: 1576
  title:
    ko: "타흐마스프 1세의 치세: 크즐바시 내전과 우즈베크, 카즈빈 천도(1524~1576)"
  summary:
    ko: "이스마일 1세가 1524년 5월 죽자 열 살 남짓한 아들 타흐마스프가 샤가 되었다. 사파비의 군사력은 크즐바시 부족(우스타즐루·샴루·루믈루·타칼루 등)이 쥐고 있었는데, 어린 샤를 둘러싼 부족 간 권력 다툼이 1524년부터 1533년 무렵까지 이어졌다. 그 틈에 우즈베크 군주 우바이둘라 칸이 1524년부터 호라산을 여러 차례 침입해 헤라트를 포위했고, 타흐마스프는 1528년 잠 전투에서 우즈베크를 물리쳤다. 헤라트는 1528년 우즈베크가 한때 차지했다가 1530년 여름 사파비가 되찾았다. 1533년 무렵 스스로 나라를 이끌기 시작한 타흐마스프는 부족 장군에게만 의존하지 않으려 조지아·아르메니아·체르케스 출신의 포로를 궁정과 군에 들였고, 이 정책은 뒷날 아바스 1세가 이어받는다. 그는 독실함으로 알려졌으며 술과 풍속 단속을 내렸고, 자발 아밀의 시아파 학자 알리 알카라키 같은 법학자를 후대했다. 1544년에는 인도에서 쫓겨 온 무굴의 후마윤을 맞이해 도왔다. 오스만과는 1532년부터 싸워 1555년 아마시아 조약으로 강화했는데 그 경과는 「아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼」(뒤의 사건)에 있고, 찰디란은 「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」(앞의 사건)에 있다. 오스만의 압력으로 사파비의 도읍은 타브리즈에서 더 안쪽의 카즈빈으로 옮겨졌다(1555년을 드는 설명이 많다). 타흐마스프는 1576년 5월 죽을 때까지 52년을 다스려 사파비 왕조 최장 재위를 남겼다. 그가 죽자 후계를 둘러싼 크즐바시 내분이 다시 일어난다. 전하는 이야기로는 타흐마스프가 1533년 무렵 참회를 선언하고(1556년 참회 칙령으로 거듭 밝혔다) 술과 음악, 궁정 화가의 후원을 멀리해 사파비 궁정의 서화 공방이 약해졌다고 한다. 반면 시아파 성지 순례와 법학 교육이 늘고 울라마가 나라 안에서 영향력을 키웠다."
  subjects: [safavid-iran, ottoman]
  tags: [politics, religion]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson 편, Laurence Lockhart 공편, Cambridge University Press, 1986)", "Andrew J. Newman, Safavid Iran: Rebirth of a Persian Empire (I.B. Tauris, 2006)"]

- id: tripoli-fezzan-1530
  year: 1530
  endYear: 1551
  title:
    ko: "트리폴리: 구호 기사단에서 오스만으로, 페잔 술탄국의 성립(1530~1551)"
  summary:
    ko: "1510년 스페인이 차지한 트리폴리를 1530년 카를 5세가 구호 기사단에게 맡겼다. 기사단은 1522년 로도스를 잃고 떠돌다가(「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 앞의 사건) 몰타와 함께 이 항구를 받아 지켰다. 기사단령 트리폴리는 도시와 그 둘레뿐이었고, 내륙 주민은 부족 수장들이 다스렸다. 오스만 쪽에서는 해적 출신 투르구트 레이스가 1550년 스페인에게 근거지 마흐디야를 빼앗긴 뒤 오스만 함대에 힘을 보태고 있었다. 이듬해 오스만 해군 제독 시난 파샤와 투르구트가 함대를 이끌고 트리폴리를 포위해 1551년 8월 기사단의 항복을 받았다. 프랑스 사절이 협상을 도와 기사단 일부는 몰타로 떠날 수 있었으나, 기사단 편의 무슬림 보조병 약 2백 명은 처형되고 나머지 수비대는 노예가 되었다고 한다. 투르구트는 1553~1554년 트리폴리 총독이 되었고 트리폴리타니아는 오스만 주로 편성되었다. 한편 사하라 안쪽 페잔에서는 1550년 무렵 모로코 출신 샤리프 무함마드 알파시를 시조로 하는 아우라드 무함마드 왕조가 무르주크를 도읍으로 페잔 술탄국을 세웠다. 이 술탄국은 사하라 종단 무역의 중계지로 금·상아·소금과 노예가 오가던 길을 쥐었으며, 1570년대 이후 트리폴리의 오스만 총독에게 공물을 바치는 처지가 되었다. 페잔의 노예 교역에서 희생된 사람들은 대부분 사하라 이남에서 잡혀 온 이들이었다. 트리폴리는 낙타 대상이 사하라를 건너 금과 상아, 사람을 싣고 오는 북쪽 끝 항구였고, 페잔의 무르주크는 그 길목이었다. 기사단은 1530년부터 몰타를 거점으로 삼아 지중해 중부의 무슬림 선박을 공격했고, 오스만 해적도 몰타와 이탈리아 해안을 습격해 주민을 잡아갔다. 트리폴리 원정에는 프랑스 왕실의 외교 지원이 있었다고 전한다. 이 협력은 프랑스와 오스만이 합스부르크에 맞서 손잡은 큰 틀의 한 부분이었다."
  subjects: [fezzan-sultanate, ottoman, spain]
  tags: [politics, war]
  sources: ["Ettore Rossi, Storia di Tripoli e della Tripolitania dalla conquista araba al 1911 (Istituto per l'Oriente, 1968)", "John Wright, Libya: A Modern History (Croom Helm, 1982)", "Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (Palgrave Macmillan, 2002)"]

- id: tunis-1569
  year: 1569
  endYear: 1574
  title:
    ko: "튀니스를 둘러싼 오스만과 스페인의 다툼, 하프스 왕조의 끝(1569~1574)"
  summary:
    ko: "하프스 왕조의 튀니스는 1534년 하이레딘에게 넘어갔다가 1535년 카를 5세에게 되찾아졌고(「튀니스 원정과 밀라노 공국의 끝, 프레베자 해전」, 앞의 사건), 이후 하프스 술탄은 스페인이 지키는 라 굴레트 요새에 기대어 유지되었다. 1569년 알제 총독 울루지 알리(우루츠 알리)가 튀니스를 차지해 술탄 하미다를 몰아냈다. 1571년 레판토 해전(「오스만의 키프로스 정복과 레판토 해전」, 뒤의 사건)에서 오스만 함대가 크게 졌어도 스페인의 후안 데 아우스트리아는 1573년 10월 튀니스를 다시 얻어 하프스 왕가의 무함마드를 세웠다. 오스만은 이듬해 복수에 나섰다. 코자 시난 파샤(뒤의 대재상)와 울루지 알리가 이끈 오스만군은 함대 250~300척에 병력 약 7만 5천 명(총독들의 병력까지 합치면 10만 가까이)으로 전하나 수는 사료마다 크게 다르다. 1574년 7월 중순 튀니스를 에워싸 8월 24일 라 굴레트 요새(방어군 약 7천 명)가 무너졌고, 9월 13일 튀니스 앞의 작은 요새에 남은 스페인군도 항복했다. 스페인 쪽 사망자는 6천 7백 명 정도로 알려져 있다. 오스만은 마지막 하프스 술탄을 이스탄불로 보내 하프스 왕조는 끝났고, 튀니스는 오스만 주가 되었다. 스페인은 이후 지중해 서쪽에 힘을 모으게 되어 북아프리카 해안을 다시 얻으려는 시도를 접었다. 튀니스 사람들은 하프스 왕조 말기의 내분과 두 제국의 싸움을 번갈아 겪었고, 오스만 아래에서는 총독(파샤)과 예니체리, 뒤에는 데이와 무라드 가문의 베이가 권력을 나누었다. 튀니스는 안달루스 이주민과 유대인 공동체, 상인으로 이름난 도시였으나 전쟁 때마다 약탈과 포로 매매의 피해를 입었다. 1535년 카를 5세 군의 점령 때에는 수천에서 수만 명이 죽거나 노예가 되었다고 하나 수는 사료마다 크게 다르다."
  subjects: [hafsid-sultanate, ottoman, spain]
  links:
    - { from: ottoman, to: hafsid-sultanate, note: "튀니스 재정복, 하프스 왕조의 끝 (1574)" }
  tags: [war, politics]
  sources: ["Andrew C. Hess, 'The Battle of Lepanto and Its Place in Mediterranean History', Past & Present 57 (1972)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "John B. Wolf, The Barbary Coast: Algeria under the Turks, 1500 to 1830 (W. W. Norton, 1979)"]

- id: alcazar-mansur-1578
  year: 1578
  endYear: 1603
  title:
    ko: "알카사르키비르 전투와 아흐마드 알만수르, 송가이 원정(1578~1603)"
  summary:
    ko: "1576년 오스만의 도움으로 술탄이 된 사드의 아브드 알말리크가 조카 무함마드 알무타와킬을 몰아내자, 무함마드는 포르투갈의 젊은 왕 세바스티앙에게 달려가 도움을 청했다. 세바스티앙은 1578년 8월 4일 알카사르키비르(크사르 엘케비르) 근처에서 아브드 알말리크와 맞붙었으나 크게 져서 왕 자신과 무함마드 알무타와킬이 죽었고 병든 아브드 알말리크도 전투 도중 숨졌다. 세 왕이 한꺼번에 죽어 '세 왕의 전투'라 부른다. 포르투갈은 귀족과 병사 수천 명을 잃고 포로로 잡힌 사람이 1만 명이 넘었으며 몸값이 큰 부담이 되었다. 왕위는 숙부 엔히크 추기경(1578~1580)을 거쳐 1580년 스페인의 펠리페 2세에게 넘어간다(「스페인 무적함대의 패배」, 뒤의 사건). 아브드 알말리크의 동생 아흐마드 알만수르(재위 1578~1603)는 곧 술탄에 올랐고, 몸값 수입을 바탕으로 엘바디 궁전을 짓고 군을 키웠다. 그는 스페인에 맞서 잉글랜드의 엘리자베스 1세와 손잡는 길을 찾기도 했다. 1590년 말 알만수르는 스페인 출신 환관 주다르 파샤가 지휘하는 기병 1,500명과 화승총병 중심의 보병 2,500명, 모두 4천 명 안팎의 부대를 사하라 건너 송가이로 보냈다. 군은 1591년 3월 톤디비에서 송가이의 아스키아 이샤크 2세를 무찌르고 가오와 팀북투, 젠네를 차지했다. 이 땅의 금이 사드의 재정에 보탬이 되었지만 먼 곳을 오래 다스리기는 어려웠고, 학자 아흐마드 바바 같은 팀북투 지식인들은 저항을 이유로 마라케시로 끌려갔다(1593~1594). 알만수르가 1603년 죽자 아들들 사이의 계승 전쟁이 이어져 나라가 마라케시와 페스로 갈라졌다. 엘바디 궁전은 몸값과 송가이에서 들어온 금, 제당 수익으로 지어졌다고 전하며 알만수르에게 알다하비(황금의 왕)라는 별명이 붙은 것도 이 때문이라고 한다."
  subjects: [saadi-sultanate, portugal, spain, ottoman]
  tags: [war, politics]
  sources: ["Mercedes García-Arenal, Ahmad al-Mansur: The Beginnings of Modern Morocco (Oneworld, 2009)", "Weston F. Cook Jr., The Hundred Years War for Morocco: Gunpowder and the Military Revolution in the Early Modern Muslim World (Westview Press, 1994)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]
