- id: algiers-regency-1659
  year: 1659
  endYear: 1710
  title:
    ko: "알제 섭정의 성립: 예니체리 정변과 데이 체제(1659~1710)"
  summary:
    ko: "알제는 1587년 이래 술탄이 3년 임기로 보내는 파샤가 다스렸지만, 실권은 점차 예니체리 부대(오자크)와 해적 선장들(레이스)로 옮겨 갔다. 1659년 예니체리가 정변을 일으켜 파샤를 밀어내고 총사령관 칼릴 아가를 우두머리로 세우면서(크레타 전쟁 군자금을 둘러싼 갈등이 계기였다고 전한다) 알제는 알제 섭정이라 불리는 사실상 군사 공화정이 되었다. 아가 체제는 1671년 해적 선장들의 반란으로 끝나고 선장들과 부대가 뽑은 데이가 종신으로 나라를 맡았다. 정변을 인정한 오스만은 곧 파샤를 정기적으로 보내지 않게 되었고, 파샤는 종주권을 나타내는 명목상 직책으로 남았다가 1710년 데이 바바 알리 샤우슈가 술탄에게서 파샤 칭호까지 받아 두 직을 겸하면서 의미를 잃었다. 나라는 알제 주변과 오랑·티테리·콘스탄틴 세 지방(베일릭)으로 나뉘었고 베이가 이를 다스렸다. 지방 부족과 카빌리아 산악 공동체에서는 세금과 공물이 중요한 문제였고, 유목 부족은 조공만 바치는 경우가 많았다. 스페인이 1509년부터 지키던 오랑은 1707~1708년 포위 끝에 베이 무스타파 부슬라그엠이 차지해 알제 손에 들어왔다. 프랑스는 1682~1683년과 1688년에 알제를 포격하며 해적 활동에 맞섰고, 유럽 국가들은 조공이나 조약으로 항해를 지키려 했다. 해적 활동으로 잡혀 온 그리스도교도 포로는 알제에서 노동하거나 몸값 협상을 기다려야 했다. 지배층은 터키계 군인과 그 후손(쿨로을루)이었고 아랍·베르베르 주민은 세금을 내는 피지배 위치였다. 데이는 군인과 해적 선장의 대표인 디완의 선택을 받는 종신 지도자였으나 실제로는 암살과 쿠데타로 자리가 자주 바뀌었다고 전한다. 알제의 상인과 장인, 안달루스 이주민의 후손과 유대인 공동체는 정치에는 참여하지 못했지만 도시 경제를 떠받쳤다. 섭정은 오스만 술탄에게 이름뿐인 충성을 바치고 전쟁 때 군을 보내는 정도였으며, 실제 외교와 조약은 알제가 스스로 맺었다."
  subjects: [regency-of-algiers, ottoman, spain, france]
  tags: [politics]
  sources: ["John B. Wolf, The Barbary Coast: Algeria under the Turks, 1500 to 1830 (W. W. Norton, 1979)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Ralph Manheim 옮김, Princeton University Press, 1977)"]

- id: alaouite-1666
  year: 1666
  endYear: 1727
  title:
    ko: "알라위 왕조의 성립과 물라이 이스마일의 통치(1666~1727)"
  summary:
    ko: "알라위는 예언자의 후손(샤리프)을 자처하는 가문으로 타필랄트의 시질마사에서 일어났다. 1631년 물라이 알리 셰리프가 지도자로 추대된 뒤 물라이 무함마드(1635~1664)가 세력을 넓혔고, 그의 동생 물라이 라시드(재위 1664~1672)가 1666년 6월 페스를 얻어 도읍으로 삼았다. 라시드는 1668년 딜라 자위야를 무너뜨리고 1668~1669년 마라케시를 차지해 사드 왕조 뒤의 모로코를 하나로 모았다. 라시드가 1672년 젊은 나이에 죽자 이복동생 물라이 이스마일이 뒤를 이어 1727년까지 약 55년을 다스렸다. 이스마일은 지방 부족에 기대지 않으려 '아비드 알부하리'라고 부르는 흑인 친위대를 길렀다. 이들은 노예와 하라틴(사하라 남쪽 출신 농민)을 모은 병력으로 그에게만 충성했고, 병영과 가족 마을이 메크네스 둘레에 있었다. 이스마일은 도읍을 페스에서 메크네스로 옮겨 성채와 궁전을 크게 지었는데 공사에는 삯 일꾼과 부족에서 징발한 사람이 주로 동원되었고 포로로 잡은 그리스도교도도 일부 쓰였다. 그는 1681년 스페인이 지키던 마모라를, 1684년 잉글랜드가 떠난 탕헤르를, 1689년 라라슈를, 1691년 아실라를 되찾아 대서양 해안의 유럽 거점을 크게 줄였다(포르투갈의 마자간과 스페인의 세우타·멜리야는 남았다). 프랑스의 루이 14세와도 외교를 주고받아 1699년 루이 14세의 서출 딸에게 혼인을 청한 일이 있었다. 무거운 세금과 군 복무는 도시와 부족 주민에게 부담이었다. 이스마일은 샤리프 가문의 정통성에 기대어 성전을 내세우고 해안의 유럽 거점을 되찾는 일을 자신의 권위로 삼았다. 주민은 군 징집과 세금, 노예 모으는 일에 시달렸고 메크네스 건설은 노동 부담을 키웠다. 이스마일은 유럽 국가들에게서 포로 몸값과 무기, 무역 특권을 얻어 내는 외교를 함께 펼쳤고, 영국과는 탕헤르를 두고 오래 맞섰다. 그리스도교도 포로의 몸값은 수도회나 가문이 협상했다."
  subjects: [alaouite-morocco, dila-zawiya, spain, england, portugal]
