- id: baghdad-zuhab-1623
  year: 1623
  endYear: 1639
  title:
    ko: "바그다드를 둘러싼 오스만-사파비 전쟁과 주하브 조약(1623~1639)"
  summary:
    ko: "1623년 바그다드에서 예니체리 사령관 바크르 수바시가 현지 총독과 다투다 아바스 1세에게 도움을 청하자, 샤는 대군을 이끌고 와 1624년 1월(1623년 말로 적는 자료도 있다) 바그다드를 차지했다. 바크르는 뒤에 오스만 쪽으로 돌아섰으나 그의 아들 무함마드가 사파비의 도시 장악을 도왔다고 전한다. 사파비는 곧 모술 둘레와 나자프·카르발라 같은 시아파 성지를 손에 넣었다. 오스만은 1625~1626년 바그다드를 포위했으나 풀지 못했다. 아바스가 1629년 죽은 뒤 손자 사피가 왕위에 올랐지만, 오스만의 무라드 4세는 1630년대에 반격해 1635년 예레반과 타브리즈를 차지했으나 사파비는 이듬해 예레반을 되찾았다. 1638년 11월 무라드 4세는 직접 바그다드를 포위해 12월 도시를 얻었다. 함락 때 수비대와 주민이 많이 죽었다고 전한다(수는 사료마다 크게 다르다). 이어 1639년 5월 주하브(카스레시린) 조약이 맺어졌고, 오스만은 바그다드와 이라크 메소포타미아를, 사파비는 예레반을 포함한 동쪽 아르메니아·아제르바이잔을 가졌다. 이 경계선은 오늘날 이란–이라크 국경의 뿌리로 흔히 꼽힌다. 사파비는 같은 1638년 칸다하르를 무굴 제국에 넘겨주었다(사파비 총독 알리 마르단 칸의 변절). 주하브 조약은 아마시아 조약(1555)을 이어받은 경계 확인으로, 순례와 상업에 대한 규정도 담았다고 전한다. 바그다드는 사파비 지배 시기에 시아파 성지와 이어진 도시가 되었다가 오스만 아래에서 다시 수니파 도시의 모습을 되찾았다. 이라크 남부의 시아파 부족과 성지 도시 주민의 삶은 어느 제국 아래에서나 세금과 군 징발에 흔들렸다. 이 전쟁 동안 바그다드 둘레의 농촌은 약탈과 징발로 황폐해졌고 성지 순례객과 대상의 길도 막혔다. 이라크 쿠르드 토후들은 두 제국 사이에서 편을 바꾸며 자치를 지키려 했다. 오스만과 사파비는 서로 종파 선전을 쓰기도 했으나 싸움의 바탕은 영토와 무역로 다툼이었다."
  subjects: [safavid-iran, ottoman]
  links:
    - { from: safavid-iran, to: ottoman, note: "바그다드 점령 (1623~1624)" }
    - { from: ottoman, to: safavid-iran, note: "바그다드 수복 (1638), 주하브 조약 (1639)" }
