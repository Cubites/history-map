- id: diriyah-1744
  year: 1744
  endYear: 1795
  title:
    ko: "디리야의 사우드 가문과 무함마드 이븐 압드 알와하브의 동맹, 팽창(1744~1795)"
  summary:
    ko: "나지드의 작은 오아시스 도시 디리야는 무함마드 이븐 사우드(1765년 죽음, 집권 시작은 1720년대 중반으로 학설이 갈린다)가 다스렸다. 한발리 법학파 학자 무함마드 이븐 압드 알와하브(1703년경~1792)는 성자 숭배와 무덤 참배를 다신 숭배에 가깝다며 비판해 나지드 우야이나에서 쫓겨난 뒤 1744년 디리야에서 환영받았다. 이븐 사우드는 그를 보호하고 정치와 군사를 맡으며 압드 알와하브는 종교 지도를 맡는다는 협약을 맺었다. 이 동맹으로 사우드 가문의 오아시스 국가가 확장 전쟁을 종교 개혁의 이름으로 정당화할 수 있었다. 추종자들은 스스로 '유일신을 믿는 이들'이라 했고 반대자들은 와하브파라 불렀다. 이븐 압드 알와하브의 형제 술라이만을 포함해 많은 수니 학자들이 이 가르침을 비판했다. 이븐 사우드가 1765년 죽자 아들 압둘아지즈(재위 1765~1803)가 이어 리야드의 다함 이븐 다우와스와 오래 싸운 끝에 1773년 리야드를 차지했다. 사우드 가문은 1792년 알하사 공격을 시작해 1794년 카티프를 얻고 1795년 바니 할리드 토후국의 알하사를 차지했다. 새로 복속된 지역의 주민은 성자 무덤을 허물고 세금(자카트)을 디리야에 바치도록 요구받았다. 이 팽창은 사막의 부족 연합과 오아시스 도시를 한 정권으로 묶은 첫 시도였다. 압드 알와하브는 1792년 죽었다. 디리야는 나지드 한가운데 와디 하니파에 있었고 대추야자 농사와 대상로의 중개로 먹고살았다. 와하브 학자들은 쿠란과 하디스에 기대어 성자 숭배와 무덤 위 건축, 담배와 음악을 금했다. 추종자들이 말하는 개혁은 다신 숭배의 요소를 없앤다는 이름으로 오아시스 주민의 오랜 신앙과 풍속을 바꾸는 일이었고, 이 때문에 주민과 부족 사이에서 호응과 반발이 함께 있었다."
  subjects: [emirate-of-diriyah, bani-khalid-emirate]
  links:
    - { from: emirate-of-diriyah, to: bani-khalid-emirate, note: "알하사 정복 (1795)" }
  tags: [politics, religion, war]
  sources: ["Natana J. DeLong-Bas, Wahhabi Islam: From Revival and Reform to Global Jihad (Oxford University Press, 2004)", "Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)"]

- id: zand-karim-khan-1751
  year: 1751
  endYear: 1779
  title:
    ko: "카림 칸의 잔드 왕조와 시라즈(1751~1779)"
  summary:
    ko: "1747년 나디르 샤가 죽은 뒤 이란은 아프샤르의 후계자들과 지방 장군들로 갈라졌다. 루르계 잔드 부족 출신의 카림 칸은 1750년 바흐티아리의 알리 마르단 칸·아부 알파트 칸과 손잡고 사파비 왕손 이스마일 3세를 명목상의 군주로 세웠다. 그는 1751년 알리 마르단과 갈라서며 이란 중·남부에서 실권을 쥐고 샤라는 칭호를 쓰지 않은 채 '민중의 대리인(와킬 알라아야)'을 자처했다. 1750년대부터 1760년대 초에 걸쳐 아프간계 아자드 칸과 카자르의 무함마드 하산 칸을 차례로 꺾어 1760년대에는 카스피해 쪽과 아제르바이잔까지 장악했다. 호라산은 아프샤르의 샤로흐 샤가 이어 갔다. 그는 시라즈를 도읍으로 삼아 와킬 시장과 와킬 모스크, 성채를 짓고 세금을 낮추어 20여 년의 비교적 평화로운 시기를 열었다고 평가받는다. 영국 동인도 회사에는 부셰르 상관을 허용해 걸프 무역을 키웠다. 카림 칸의 동생 사데크 칸이 1775~1776년 오스만령 바스라를 포위해 1776년 4월 16일 점령했으나 이 땅은 그가 죽자 곧 오스만에게 돌아갔다. 카림 칸은 1779년 3월 1일 시라즈에서 죽었다. 그는 카자르 부족장 무함마드 하산 칸의 아들 아가 무함마드(훗날의 카자르 왕조 창건자)를 시라즈에 인질로 두었다. 카림이 죽자 후계를 둘러싼 잔드 가문의 내분이 일어났다. 카림 칸은 도시에 시장과 대상 숙소를 늘렸으나 군사를 크게 쓰는 확장 정책은 펴지 않았다. 샤를 칭하지 않은 것은 왕권을 이어받은 정통성 논란을 피하려는 뜻이었다고 본다. 아르메니아인과 유대인 공동체도 그의 시기 비교적 안정을 누렸다고 전한다. 카림 칸의 궁정은 시인과 건축가, 화가를 후원했고, 시라즈의 하피즈와 사아디 묘를 고쳐 세웠다고 전한다."
  subjects: [zand-dynasty, afsharid-iran, ottoman]
  tags: [politics]
  sources: ["John R. Perry, Karim Khan Zand: A History of Iran, 1747–1779 (University of Chicago Press, 1979)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]

- id: egypt-beys-1760
  year: 1760
  endYear: 1791
  title:
    ko: "이집트 베이들의 부활과 알리 베이 알카비르(1760~1791)"
  summary:
    ko: "18세기 이집트에서는 오스만이 보낸 총독(파샤)의 힘이 약해지고 맘루크 출신 베이들의 집안(가계)이 군사력과 세금 징수권을 쥐었다. 조지아 혹은 압하지야 출신으로 전하는 알리 베이는 1760년 베이들 사이에서 샤이크 알발라드(나라의 우두머리)로 뽑혔다. 그는 1766년 쫓겨났다가 1767년 10월 카이로를 되찾았고, 1769년 오스만에 대한 공납을 끊고 자기 이름으로 화폐를 찍었다. 1770년 장군 무함마드 아부 알다하브를 히자즈로 보내 메카 샤리프국을 자기 영향 아래 두려 했고, 1771년에는 시리아로 군을 보내 갈릴리의 다히르 알우마르와 손잡고 다마스쿠스를 차지했다. 이 무렵 러시아와 오스만이 전쟁 중이었다(「러시아-튀르크 전쟁과 퀴췩카이나르자 조약」, 뒤의 사건). 그러나 시리아에서 아부 알다하브가 오스만 첩자의 이간에 넘어가 돌아섰고, 알리 베이는 1773년 봄 살리히야 근처 싸움에서 져 얼마 뒤 죽었다. 아부 알다하브는 1775년 죽기까지 이집트를 다스렸고, 이후 이브라힘 베이와 무라드 베이가 권력을 나누었다. 오스만은 1786년 하산 파샤를 함대와 함께 보내 8월 1일 카이로에 들어갔고, 두 베이는 상이집트로 달아났다. 하산 파샤는 러시아와의 전쟁으로 이듬해 돌아갔다. 1791년 전염병으로 샤이크 알발라드 이스마일 베이가 죽자 이브라힘과 무라드가 카이로에 돌아왔다. 이집트 농민은 이 모든 세금 경쟁 속에서 무거운 부담을 졌다. 이 시기 카이로는 여전히 홍해 커피 무역과 인도 직물 거래, 곡물과 쌀 수출의 중심이었다. 베이들은 이 이익을 쥐려고 서로 다투었고, 전쟁과 전염병, 세금이 농민의 삶을 어렵게 했다. 울라마와 콥트 서기, 시리아 그리스도교도 상인이 베이 정권과 얽혀 도시 경제를 움직였다."
  subjects: [ottoman, sharifate-of-mecca]
  tags: [politics, war]
  sources: ["Daniel Crecelius, The Roots of Modern Egypt: A Study of the Regimes of ʿAli Bey al-Kabir and Muhammad Bey Abu al-Dhahab, 1760–1775 (Bibliotheca Islamica, 1981)", "P. M. Holt, Egypt and the Fertile Crescent, 1516–1922: A Political History (Cornell University Press, 1966)", "Stanford J. Shaw, The Financial and Administrative Organization and Development of Ottoman Egypt, 1517–1798 (Princeton University Press, 1962)"]

- id: qajar-rise-1779
  year: 1779
  endYear: 1796
  title:
    ko: "아가 무함마드 칸과 카자르 왕조의 성립(1779~1796)"
  summary:
    ko: "카자르는 카스피해 남동쪽 아스타라바드에 근거한 튀르크멘 크즐바시 부족이다. 아가 무함마드는 어린 시절 아딜 샤에게 거세당해 후사를 얻지 못했고, 카림 칸의 인질로 시라즈에서 지냈다. 1779년 카림이 죽자 그는 마잔다란으로 달아나 부족 세력을 모았다. 같은 해부터 시라즈의 잔드 가문은 카림의 이복동생 자키 칸이 섭정으로 실권을 쥔(1779년 3~6월, 피살) 아래 카림의 아들 무함마드 알리 칸·아부 알파트 칸(1779년 3~8월)이 이름뿐인 군주로 있었고, 이어 사데크 칸(1779~1781), 알리 무라드 칸(1781~1785), 자파르 칸(1785~1789), 사이드 무라드 칸(1789), 로트프 알리 칸(1789~1794)이 이어 잡으며 내분이 이어졌다. 아가 무함마드는 1785년 5월 2일 이스파한을 차지했고 1786년 3월 12일 테헤란을 도읍으로 삼았다. 1789년 무렵 그는 북부와 이스파한 일대를 아우르는 권력을 굳혔고, 이 해를 카자르 왕조의 출발로 보는 설명도 있다. 1791년 아제르바이잔, 1792년 7월 21일 시라즈를 얻었고 로트프 알리 칸은 케르만으로 달아났다. 1794년 10월 24일 다섯 달 가까운 포위 끝에 케르만이 함락되었고 도시는 약탈당했으며 주민이 눈이 뽑히는 등 가혹한 보복을 받았다고 전한다(규모는 사료마다 다르다). 로트프 알리는 붙잡혀 죽었고 잔드 왕조가 끝났다. 1795년 9월 11일에는 트빌리시를 약탈했다(「오스만·페르시아 사이의 동조지아, 카르틀리-카헤티 왕국의 성립」, 앞의 사건). 1796년 3월 정식으로 샤에 올랐고, 이어 호라산의 마슈하드에 들어가 아프샤르의 샤로흐 샤를 폐위해 아프샤르 왕조를 끝냈다. 이로써 이란 땅 대부분이 다시 한 왕조의 손에 모였다. 카자르의 도읍 테헤란은 아직 작은 도시였으나 카스피해 쪽과 이란 고원을 함께 살필 수 있는 곳이었다. 아가 무함마드의 조지아 원정은 1783년 카르틀리-카헤티 왕국이 러시아의 보호를 받기로 한 데 대한 대응이기도 했다."
