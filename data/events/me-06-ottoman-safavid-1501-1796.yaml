- id: yaruba-oman-1624
  year: 1624
  endYear: 1698
  title:
    ko: "야루바 왕조의 오만: 이맘 선출, 포르투갈 축출과 해상 팽창(1624~1698)"
  summary:
    ko: "오만은 이바드파가 이맘을 선출하는 전통이 있었으나 15세기 이후 내륙 니즈와·바흘라는 나브하니 왕조가 세습 군주로 다스리고 있었다. 1624년 이바드파 학자들은 나시르 빈 무르시드 알야루비를 이맘으로 뽑아 나브하니 왕조를 대신하게 했다. 이로써 야루바 왕조가 들어섰다. 나시르는 부족들을 하나로 모아 루스타크와 니즈와를 중심으로 힘을 키웠다. 해안은 1507년 알부케르케가 무스카트를 점령한 이래 포르투갈 거점이 이어져 있었는데, 야루바 군은 1633년 줄파르(라스알카이마), 1643년 소하르의 포르투갈 거점을 빼앗았다. 나시르의 사촌이자 뒤를 이은 술탄 빈 사이프(재위 1649~1679)는 1650년 무스카트를 되찾아 포르투갈을 오만 해안에서 쫓아냈다. 오만은 이 승리 뒤 함대를 갖춘 해양 세력으로 올라섰고 1660년 몸바사를 공격했다. 1696~1698년에는 오랜 포위 끝에 몸바사의 포트 지저스를 얻어 몸바사 이북의 동아프리카 해안에서 포르투갈 세력을 몰아냈다(모잠비크 같은 더 남쪽은 포르투갈이 계속 쥐었다). 잔지바르 같은 동아프리카 해안에 오만인이 정착하기 시작했고, 이는 뒷날 상아·정향·노예 무역으로 이어진다. 빌아랍 빈 술탄(재위 1679~1692) 때는 이맘 직이 세습되는 관행이 굳어져 이바드파의 선출 이상과 거리가 생겼다. 빌아랍의 동생 사이프 빈 술탄은 1692년 이맘이 되어 관개 시설을 정비하고 포트 지저스 포위를 이끌었다. 야루바의 오만은 이맘 정치와 해상 교역이 결합된 독특한 나라였다. 해외 무역으로 무스카트는 인도양의 큰 항구가 되었고 오만 선박은 인도 서해안과 페르시아만, 동아프리카를 오갔다. 이바드파 이맘국은 이맘을 부족 회의에서 뽑는 전통과 세습으로 바꾸려는 힘 사이에서 긴장을 겪었다. 오만 내륙의 농민은 아팔라지(관개 수로)에 기대어 대추야자 농사를 지었고, 이맘은 수로 관리와 공유지를 둘러싼 갈등의 중재자 역할도 했다."
  subjects: [yaruba-dynasty, nabhani-dynasty, portugal]
  tags: [politics, war, religion]
  sources: ["J. C. Wilkinson, The Imamate Tradition of Oman (Cambridge University Press, 1987)", "Willem Floor, The Persian Gulf: A Political and Economic History of Five Port Cities, 1500–1730 (Mage Publishers, 2006)"]
  places: [{ name: 무스카트 수복, at: [58.59, 23.61], year: 1650 }, { name: 포트 지저스 포위, at: [39.68, -4.06], year: 1698 }]

- id: safavid-late-1629
  year: 1629
  endYear: 1694
  title:
    ko: "사파비 왕조의 정체: 사피에서 술레이만까지(1629~1694)"
  summary:
    ko: "아바스 1세가 1629년 죽은 뒤 손자 사피(재위 1629~1642)가 왕위에 올라 왕족과 장군을 잇달아 죽였다. 아바스가 키운 굴람 장군 이맘 쿨리 칸도 1630년대 초 일가와 함께 처형되었다. 사피 때 사파비는 1638년 바그다드와 칸다하르를 잃었다(칸다하르는 사파비 총독 알리 마르단 칸이 무굴에 넘겼다). 아들 아바스 2세(재위 1642~1666)는 아홉 살 무렵 왕위에 올랐으나 자라서 1648~1649년 겨울 칸다하르를 되찾았고, 무굴의 반격(1649·1652·1653)을 막아 냈다. 그의 치세는 오스만과의 평화, 이스파한의 번영과 건축으로 기억된다. 다만 1656년 이스파한 유대인에게 개종을 강요한 일이 있었고 1661/1662년 무렵까지 이어졌다가 풀렸다고 전한다. 사피 2세로 1666년 11월 즉위한 술레이만(재위 1666~1694)은 1667년 기근과 지진 같은 재난이 이어지자 1668년 3월 다시 대관하며 이름을 술레이만으로 바꾸었다. 그의 치세에 왕실 재정은 왕실 사치와 환관·후궁의 정치 개입으로 흔들렸다. 울라마(시아파 학자)의 영향력은 커져 무함마드 바게르 마즐레시 같은 학자가 수피와 소수 공동체에 엄격한 정책을 펼쳤다. 이 시기 사파비는 여전히 비단과 걸프 무역으로 부유했지만 군제는 굴람과 부족 병력 모두 약해졌다. 이스파한은 외국 여행가와 상인이 찾는 국제 도시였고, 아르메니아·조지아 출신 굴람과 관료가 궁정과 군에서 큰 비중을 차지했다. 17세기 후반 이란에는 역병과 흉작이 되풀이되고 세금 부담이 커져 농민과 소수 공동체가 어려움을 겪었다고 전한다. 술레이만이 1694년 7월 죽자 아들 술탄 후사인이 뒤를 이었다."
  subjects: [safavid-iran, ottoman]
  tags: [politics]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Rudi Matthee, Persia in Crisis: Safavid Decline and the Fall of Isfahan (I.B. Tauris, 2012)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson 편, Laurence Lockhart 공편, Cambridge University Press, 1986)"]

- id: qasimid-mocha-1636
  year: 1636
  endYear: 1728
  title:
    ko: "카심 이맘국의 전성기와 모카 커피 무역, 라헤즈 술탄국의 자립(1636~1728)"
  summary:
    ko: "오스만이 물러난 뒤 이맘 알무타와킬 이스마일(재위 1644~1676)은 예멘 대부분을 한 정권 아래 모았다. 그의 군대는 북쪽 아시르에서 동쪽 도파르 쪽까지 나아갔다. 이맘국의 재정은 항구 모카에서 나왔다. 당시 예멘은 커피를 거의 혼자 내는 나라였고, 모카는 홍해 입구의 가장 바쁜 항구로 이집트·오스만·인도·유럽 상인이 모여 커피를 실어 갔다. 네덜란드와 영국 동인도 회사가 17세기 초부터 모카에 상관을 두었고 프랑스 상인도 뒤따랐다. 그러나 18세기 들어 네덜란드가 자바에, 프랑스가 인도양 부르봉 섬에 커피를 심어 예멘의 독점이 흔들렸다. 이맘국은 자이드파 이맘이 고지의 샤피이파 주민과 유대인 공동체를 다스리는 구조였다. 알마흐디 아흐마드(재위 1676~1681) 때인 1679년 유대인을 사나에서 모와자로 쫓았다가 이듬해쯤 돌아오게 했다고 전한다. 이맘 자리는 카심 가문 안에서 서로 다투는 후계 싸움이 잦았고(알무아이야드 무함마드 2세, 재위 1681~1686 등을 거쳐 알마흐디 무함마드가 1689~1718년 재위), 부족 수장의 힘이 커졌다. 알무타와킬 알카심(1716~1727)과 알만수르 후사인 2세(1727~1748) 때 남부의 라헤즈에서는 압달리 가문의 수장이 1728년 무렵(1731년설도 있다) 이맘에게서 벗어나 술탄을 칭하고 아덴을 얻었다. 이렇게 라헤즈 술탄국이 자립하면서 이맘국은 아덴과 남부 해안을 잃었다. 커피는 이슬람 세계에서 수피의 밤 예배에 쓰이다가 도시의 커피집으로 퍼졌다. 그러나 모카의 항구는 티하마의 샤피이파 상인과 인도·유럽 상인이 주로 움직였다. 카심 이맘들은 사나에 모스크와 궁전, 정원을 지어 도시를 가꾸었고, 고지의 유대인 장인은 은세공과 직물 일에 종사하며 세금(지즈야)을 냈다."
  subjects: [qasimid-state, lahej-sultanate]
  links:
    - { from: lahej-sultanate, to: qasimid-state, note: "아덴 장악, 자립 (1728)" }
  tags: [economy, politics]
  sources: ["The Cambridge History of Islam, vol. 1A: The Central Islamic Lands from Pre-Islamic Times to the First World War (P. M. Holt·Ann K. S. Lambton·Bernard Lewis 편, Cambridge University Press, 1970)", "Nancy Um, The Merchant Houses of Mocha: Trade and Architecture in an Indian Ocean Port (University of Washington Press, 2009)", "Robert W. Stookey, Yemen: The Politics of the Yemen Arab Republic (Westview Press, 1978)"]

- id: dila-zawiya-1641
  year: 1641
  endYear: 1668
  title:
    ko: "딜라 자위야의 페스 장악과 사드 왕조의 끝(1641~1668)"
  summary:
    ko: "아흐마드 알만수르가 죽은 1603년 뒤 모로코는 사드의 후계 다툼과 지방 세력의 자립으로 갈라졌다. 중아틀라스의 수피 교단 딜라 자위야(수도원)는 1566년 무렵 아부 바크르 알딜라이가 세웠고, 그의 손자 무함마드 알하지 때 교단이 군사력을 갖춘 정권으로 올라섰다. 딜라의 군대는 1641년 무렵 페스를 차지했고 메크네스와 라바트·살레, 탕헤르 일대까지 영향을 미쳤다. 사드 왕조는 1640년대부터 마라케시 일대만 지키는 처지였고, 1659년 마지막 술탄 아흐마드 알아바스가 살해되어 끝났다. 한편 타필랄트의 샤리프 가문(알라위)은 딜라와 부딪히며 일어섰다. 1646년 딜라는 알라위의 물라이 무함마드를 눌러 시질마사 서쪽과 남쪽을 자기 영향권에 두게 했다고 전한다. 그러나 물라이 무함마드는 1664년 동생 라시드와 싸우다 죽었고, 라시드가 1666년 6월 페스를 얻어 알라위 왕조의 기반을 닦았다. 라시드는 1668년 6월 딜라의 중아틀라스 본거지를 무너뜨렸고 1668~1669년 마라케시까지 차지해 모로코를 다시 하나로 모았다. 딜라는 이로써 정치·군사 기반을 잃었고 가족은 틀렘센으로 쫓겨났다. 1677년 무함마드 알하지의 손자가 알제의 오스만 세력을 등에 업고 돌아와 재기를 꾀했으나 이스마일 아래에서 1680년 자취를 감추었다. 사드 왕조 뒤의 이 20여 년은 교단과 샤리프 가문이 정통성을 놓고 겨룬 시기였고, 도시 주민과 부족은 이 사이에서 세금과 약탈을 견뎌야 했다. 딜라의 지도자들은 샤리프 가계가 아니라 수피 학자 집안이어서 정통성을 학식과 영적 권위에서 찾았고, 베르베르계 부족과 도시 상인의 지지를 얻었다. 페스는 카라위인 대학이 있는 학문의 중심이어서 도시 울라마와 딜라 지도부 사이에는 협력과 갈등이 함께 있었다. 이 무렵 라바트와 살레에서는 안달루스 이주민 출신의 해적 공동체가 사실상 독립해 대서양에서 활동했고, 딜라는 이들에게도 영향력을 미치려 했다고 전한다. 딜라는 큰 도시에 총독을 보내 세금을 걷고 자기 편 학자를 앉혔다."
  subjects: [dila-zawiya, saadi-sultanate, alaouite-morocco]
