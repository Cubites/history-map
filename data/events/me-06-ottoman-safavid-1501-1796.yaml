- id: abbas-reform-1587
  year: 1587
  endYear: 1598
  title:
    ko: "아바스 1세의 즉위와 개혁: 군제 정비와 우즈베크 격퇴(1587~1598)"
  summary:
    ko: "타흐마스프 1세가 죽은 뒤(1576) 사파비는 이스마일 2세(재위 1576~1577)와 무함마드 호다반다(재위 1578~1587)를 거치며 크즐바시 부족들의 권력 다툼과 오스만과의 전쟁에 시달렸다(「아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼」, 앞의 사건). 우즈베크의 아브달라 칸 2세는 1587년 말 헤라트를 에워싸 1589년 2월 항복받았고 같은 1589년 마슈하드도 차지했다. 이런 위기에서 1587년 10월 카즈빈에서 크즐바시 장군 무르시드 쿨리 칸이 호다반다를 물러나게 하고 열여섯 살 아들 아바스를 샤로 세웠다(대관을 1588년으로 적는 곳도 있다). 아바스 1세는 1589년 7월 자신을 앞세워 권력을 휘두르던 무르시드 쿨리 칸을 죽이고 직접 통치에 나섰고, 1590년 오스만과 강화하며 서쪽을 내주는 대신 동쪽 우즈베크에 힘을 쏟았다. 그는 부족 장군에게 기대는 군사 체제를 줄이려고 조지아·아르메니아·체르케스 출신 포로 병사(굴람)를 길러 샤에게만 충성하는 상비군과 화승총·대포 부대를 키웠다. 1598년 무렵 영국인 셜리 형제가 사파비 궁정에 도착해 대포 부대 정비를 도왔다고 전한다. 땅의 일부는 왕실 직할지로 삼아 길란(1591)과 마잔다란을 거두었다. 1597~1598년 마슈하드를 되찾고 8월 헤라트 전투에서 우즈베크를 크게 물리쳐 호라산을 회복했다. 같은 해 도읍을 카즈빈에서 이스파한으로 옮겼다. 이로써 사파비는 동쪽 우즈베크의 위협을 덜고 오스만과의 새 싸움을 준비하게 되었다(「오스만-사파비 전쟁과 나수흐 파샤 조약, 동조지아」, 뒤의 사건). 호라산과 헤라트를 되찾은 일은 시아파 성지 마슈하드의 이맘 레자 묘역을 사파비 아래로 되돌린 일이기도 했고, 아바스는 이 묘역을 후원하며 순례를 장려했다. 직할지를 넓힌 것은 부족 장군에게 나누어 주던 몫을 줄이는 방법이기도 했다."
  subjects: [safavid-iran, ottoman]
  tags: [politics, war]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Andrew J. Newman, Safavid Iran: Rebirth of a Persian Empire (I.B. Tauris, 2006)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson 편, Laurence Lockhart 공편, Cambridge University Press, 1986)"]
  places: [{ name: 헤라트 전투, at: [62.2, 34.35], year: 1598 }]

- id: fakhr-al-din-1590
  year: 1590
  endYear: 1635
  title:
    ko: "파흐르 앗딘 2세와 레바논 산의 드루즈 토후국(1590~1635)"
  summary:
    ko: "오스만의 시리아에서 레바논 산 슈프 지방은 드루즈의 마안 가문이 세습 토후(에미르)로서 조세를 거두며 다스렸다. 파흐르 앗딘 2세는 1590/1591년 무렵 토후가 되어 시돈·베이루트 일대를 넓혀 나가며 다마스쿠스 총독과 맞섰다. 오스만이 중부 유럽 전쟁과 아나톨리아의 반란(젤랄리)으로 어수선하던 1600년대 초, 그는 알레포의 반란자 알리 잔불라트와 손잡았으나 1607년 잔불라트가 패하자 오스만과 흥정해 지위를 지켰고, 1613년 오스만의 원정에 몰려 나라를 떠났다. 파흐르 앗딘은 토스카나 대공국 메디치가의 보호를 받아 리보르노와 피렌체에서 지내다가(1615년까지) 시칠리아와 나폴리를 거쳐 1618년 돌아왔다. 돌아온 그는 레바논 산에서 갈릴리 북부와 베카 골짜기까지 세력을 넓히고 실크 무역과 토스카나·마르세유 상인과의 거래를 키웠다. 마론파 주민이 많은 북쪽(주바일·바트룬 일대)으로 세력을 넓혀 드루즈와 마론파가 함께 사는 틀이 이때 자리 잡았다고 본다. 오스만 조정은 그의 독자 외교와 요새를 경계해 1633년 다마스쿠스 총독 퀴췩 아흐메트 파샤를 보냈고, 파흐르 앗딘은 붙잡혀 이스탄불에서 1635년 처형당했다. 슈프의 드루즈는 이스마일파에서 갈라져 나와 교리를 바깥에 감추는 전통이 있는 독자 종파를 따르는 이들이었다. 오스만은 레바논 산 토후들에게 산자크 베이 직을 주어 세금 징수를 맡겼다. 파흐르 앗딘은 베이루트와 시돈에 요새를 쌓고 토스카나에서 건축가와 기술자를 불러들였다고 전한다. 그의 시대 레바논 산의 경제는 비단과 올리브, 비누 생산이 중심이었고 프랑스와 토스카나 상인이 시돈과 베이루트를 드나들었다. 그러나 영토 확장은 이웃 총독과 베두인 수장의 반발도 낳았다. 파흐르 앗딘이 피렌체에 머문 일은 토스카나가 오스만과 맞서는 동맹을 찾던 외교와 맞물렸다고 보며, 그는 이탈리아 건축과 정원의 영향을 레바논 산 궁정에 가져왔다."
  subjects: [ottoman]
  tags: [politics]
  sources: ["Abdul-Rahim Abu-Husayn, Provincial Leaderships in Syria, 1575–1650 (American University of Beirut, 1985)", "William Harris, Lebanon: A History, 600–2011 (Oxford University Press, 2012)"]

- id: qasimid-1597
  year: 1597
  endYear: 1636
  title:
    ko: "카심 이맘국의 성립과 오스만의 예멘 철수(1597~1636)"
  summary:
    ko: "오스만의 예멘 총독들은 세금을 무겁게 매기고 지방 수장을 억눌러 고지대 주민의 불만을 샀다. 1597년 9월 자이드파의 학자 알만수르 알카심이 이맘을 칭하며 사다 쪽 산악에서 일어났다. 자이드파는 아흘 알바이트(예언자 가문)의 후손 가운데 학식 있고 무장을 갖춘 이를 이맘으로 세우는 전통을 따랐다. 사다는 9세기 말 첫 자이드파 이맘 알하디 일랄하크가 세운 이맘국의 중심 도시였다. 알카심은 오스만의 큰 군대와 싸우다 1600년대 초 휴전하는 일을 되풀이했고(1608년 무렵 열 해 휴전을 맺었다고 전한다) 1620년 죽을 때까지 고지를 지켰다. 아들 알무아이야드 무함마드(재위 1620~1644)가 이었고, 1628년 사나를 오스만에서 빼앗았다. 오스만은 다른 전선과 재정난 때문에 예멘에 충분한 병력을 보내지 못했고, 1634년 자비드가 함락되었으며 1636년 마지막 수비대가 예멘을 떠났다(모카는 한동안 오스만이 지켰다). 이맘국은 고지 자이드파 부족의 군사력으로 남쪽 티하마의 샤피이파 주민까지 다스리게 되었다. 이런 지배 구조는 종파 다른 주민의 불만을 낳았다. 오스만 철수로 예멘은 오스만 영역에서 벗어나 이맘 정권 아래 놓였다. 이맘국은 자이드파 법학의 중심이 되어 사다와 사나의 학자들이 많은 저술을 남겼다. 카심 가문의 이맘국은 고지 부족 연합의 군사 지도자이자 종교 지도자가 이맘이라는 자이드파의 전통에 기댔다. 같은 시기 남쪽 해안에서는 오스만 총독들이 자비드와 모카를 지키며 커피와 인도 상품의 관세를 거두려 했으나, 산악 부족의 습격과 병력 부족으로 힘을 잃었다. 지방 수장들은 이맘과 오스만 어느 쪽에 설지 저울질했다."
  subjects: [qasimid-state, zaydi-imamate, ottoman]
  links:
    - { from: qasimid-state, to: ottoman, note: "사나 탈환 (1628), 예멘 완전 축출 (1636)" }
  tags: [politics, war, religion]
  sources: ["The Cambridge History of Islam, vol. 1A: The Central Islamic Lands from Pre-Islamic Times to the First World War (P. M. Holt·Ann K. S. Lambton·Bernard Lewis 편, Cambridge University Press, 1970)", "Robert W. Stookey, Yemen: The Politics of the Yemen Arab Republic (Westview Press, 1978)", "Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (Palgrave Macmillan, 2002)"]

- id: isfahan-silk-1598
  year: 1598
  endYear: 1629
  title:
    ko: "아바스 1세의 이스파한 건설과 사파비의 비단 무역, 뉴줄파의 아르메니아 상인(1598~1629)"
  summary:
    ko: "아바스 1세가 1598년 도읍으로 삼은 이스파한은 자얀데강 가에서 새로 정비되었다. 도시 한가운데에 나크셰 자한 광장이 만들어졌고 광장 둘레에 왕실 모스크(샤 모스크, 1611년 착공해 사피 때 완공), 셰이크 로트폴라 모스크(1602/1603~1619), 알리 카푸 궁전과 시장이 들어섰다. 사파비는 이란 북부 길란과 시르반의 비단을 왕실이 사들여 파는 독점 사업으로 삼았고, 비단은 오스만 영내의 알레포·이즈미르를 거치거나 페르시아만 항구로 가 유럽에 팔렸다. 이 상업을 맡은 이들은 줄파(나흐체반 지방) 아르메니아 상인이었다. 아바스는 1604~1605년 오스만과의 전쟁 중 아르메니아 지방 주민을 대거 이란 안쪽으로 옮겼고(이주 규모는 약 15만 명에서 25만~30만 명이라는 추산까지 크게 갈린다), 줄파 상인의 일부는 이스파한 남쪽 강 건너 뉴줄파에 정착했다. 이 이주는 많은 이들에게 강제 이주였고 길에서 죽은 이도 많았다. 아르메니아인은 신앙을 지키며 교회를 세웠고 인도·러시아·유럽 상인망을 이었다. 1622년 호르무즈를 차지한 뒤 새 항구 반다르아바스에는 네덜란드와 영국 동인도 회사가 상관을 열어 직접 거래를 시작했다. 카펫과 도자기, 직물이 이란의 주요 수출품이 되었다. 아바스가 1629년 죽을 때 이스파한은 수십만 명이 사는 큰 도시였다고 전한다. 도시에는 카르멜회 수사를 비롯한 유럽 선교사도 오갔고, 샤는 외국 상인과 사절에게 비교적 관대했다. 이런 접대는 오스만에 맞설 동맹을 찾으려는 외교와도 이어졌다. 이스파한은 광장과 시장, 모스크가 하나로 이어져 왕권과 종교, 상업이 한 자리에 모인 도시 설계로 평가받는다. 나크셰 자한 광장은 폴로 경기와 군 사열, 축제가 열리던 공공의 마당이기도 했다."
  subjects: [safavid-iran, ottoman]
  tags: [economy, culture]
  sources: ["Rudi Matthee, The Politics of Trade in Safavid Iran: Silk for Silver, 1600–1730 (Cambridge University Press, 1999)", "Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Willem Floor, The Persian Gulf: A Political and Economic History of Five Port Cities, 1500–1730 (Mage Publishers, 2006)"]

- id: abbas-recovery-1601
  year: 1601
  endYear: 1622
  title:
    ko: "아바스 1세의 영토 회복: 남부 해안, 타브리즈, 칸다하르와 호르무즈(1601~1622)"
  summary:
    ko: "동쪽을 안정시킨 아바스 1세는 먼저 남쪽으로 눈을 돌렸다. 1601~1602년 파르스의 라르를 얻었고, 1602년에는 파르스 총독 알라베르디 칸이 바레인을 포르투갈과 호르무즈 쪽에서 빼앗았다. 오스만이 중부 유럽의 긴 전쟁과 아나톨리아의 반란으로 약해진 틈을 타 1603년 타브리즈를 되찾았고, 1604년 6월 예레반이 항복했으며, 1605년 11월 수피얀 전투에서 오스만군을 물리쳤다. 이 싸움은 1612년 나수흐 파샤 조약으로 한 차례 매듭지어졌다(「오스만-사파비 전쟁과 나수흐 파샤 조약, 동조지아」, 뒤의 사건). 동쪽에서는 무굴 제국의 영역이던 칸다하르를 1622년 6월 얻었다. 이보다 앞서 2월부터 4월까지 두 달 남짓 파르스 총독 이맘 쿨리 칸이 영국 동인도 회사 함선 다섯 척의 도움을 받아 호르무즈 섬의 포르투갈 요새를 에워싸 함락했다. 호르무즈는 쇠퇴했고 사파비는 맞은편의 반다르아바스를 새 항구로 키웠다. 영국 회사는 그 대가로 비단 무역 특권을 노렸다. 이런 전쟁은 아바스가 키운 굴람 상비군과 화승총 부대가 중심이 되어 이루어졌고, 점령지 주민은 정복당하거나 이주당했다. 1602년의 바레인 점령은 다수 시아파인 섬을 사파비 영향권으로 넣었다. 이렇게 아바스는 1590년 오스만에 내준 서쪽을 거의 되찾고 동쪽과 남쪽 걸프 해안으로 넓혀 사파비를 이스마일 1세 이후 가장 넓게 만들었다. 이 시기 사파비의 지휘부는 조지아·아르메니아 출신 굴람 장군들이 이끌었다. 알라베르디 칸(1613년 죽음)과 그 아들 이맘 쿨리 칸이 대표적이었고, 아들은 아버지의 뒤를 이어 파르스를 맡아 호르무즈 정복의 주역이 되었다. 포르투갈은 호르무즈를 잃은 뒤에도 오만의 무스카트를 거점으로 걸프 어귀에 남았다."
  subjects: [safavid-iran, ottoman, portugal]
  tags: [war, politics]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Willem Floor, The Persian Gulf: A Political and Economic History of Five Port Cities, 1500–1730 (Mage Publishers, 2006)", "Andrew J. Newman, Safavid Iran: Rebirth of a Persian Empire (I.B. Tauris, 2006)"]
