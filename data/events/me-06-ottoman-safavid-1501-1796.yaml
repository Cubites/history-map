- id: iraq-mamluk-1704
  year: 1704
  endYear: 1747
  title:
    ko: "이라크의 맘루크 파샤 체제: 하산 파샤와 아흐마드 파샤(1704~1747)"
  summary:
    ko: "오스만 바그다드 주는 17세기 말부터 총독 교체와 예니체리의 횡포로 혼란스러웠다. 1704년 이스탄불이 총독으로 보낸 조지아 출신 하산 파샤(재임 1704~1723)는 조지아·체르케스 출신 군사 노예(맘루크)를 사들여 길러 자기 부대를 만들고 바그다드 주를 안정시켰다. 그의 아들 아흐마드 파샤(재임 1723~1747)가 총독 자리를 이었고, 오스만 조정은 이 세습에 가까운 맘루크 체제를 실제로 인정했다(이 체제의 시작을 하산 파샤의 1704년으로 보는 설명과 술레이만 아부 라일라가 총독이 된 1749년부터로 보는 설명이 갈린다). 총독의 힘은 바스라 항구의 무역 수입과 부족 연합(무타피크 등)과의 거래에 달려 있었다. 훗날 아프샤르 왕조를 연 나디르는 1733년과 1743년 이라크를 공격했다. 1733년에는 사파비 샤 아래 총사령관으로 바그다드를 에워쌌다가 오스만 사령관 토팔 오스만 파샤에게 져서 물러났으나, 같은 해 가을 키르쿠크 근처 싸움에서 이겨 토팔 오스만이 전사했다. 1743년에는 샤가 된 나디르가 키르쿠크와 나자프를 차지하고 모술을 포위했으나 모술 총독 하지 후사인 잘릴리가 이를 막아 냈다. 나디르는 그해 나자프에서 수니·시아 울라마의 모임을 열었으나 오스만 조정은 그가 내놓은 종파 화해 제안을 받아들이지 않았다. 아흐마드 파샤는 이 시기를 견딘 뒤 1747년 죽었다. 총독의 주요 일은 바그다드 둘레의 샴마르·무타피크 같은 부족, 쿠르드 토후, 이웃한 주와의 관계를 다스리는 것이었다. 모술에서는 잘릴리 가문이 1726년 무렵부터 총독 자리를 맡았다. 바스라의 무역상과 시아파 성지 도시 주민은 이 체제에서 세금과 징발을 부담했다. 바그다드 군대는 조지아·체르케스 출신 맘루크가 중심이었고 총독 가문은 이 군사 노예를 사서 길러 자신의 사람으로 만들었다. 그 결과 오스만 조정이 보낸 외부 인물이 아니라 바그다드의 맘루크 가문이 총독을 맡는 관행이 굳었다. 오스만 술탄은 이 총독들에게 파샤 직함을 내려 승인했다."
  subjects: [ottoman, afsharid-iran]
  tags: [politics, war]
  sources: ["Stephen H. Longrigg, Four Centuries of Modern Iraq (Clarendon Press, 1925)", "Hala Fattah, The Politics of Regional Trade in Iraq, Arabia, and the Gulf, 1745–1900 (State University of New York Press, 1997)", "Thabit A. J. Abdullah, Merchants, Mamluks, and Murder: The Political Economy of Trade in Eighteenth-Century Basra (State University of New York Press, 2001)"]

- id: husainid-karamanli-1705
  year: 1705
  endYear: 1711
  title:
    ko: "오스만 아래 세습 정권의 성립: 튀니스의 후사인 왕조와 트리폴리의 카라만리 왕조(1705~1711)"
  summary:
    ko: "17세기에 튀니스는 오스만 파샤 아래에서 실권이 데이와 베이에게 넘어가 있었고, 1613년부터 무라드 가문의 베이들이 세습으로 이었다. 무라드 가문의 베이직은 1702년 예니체리 사령관 이브라힘 알샤리프에게 넘어갔고, 이브라힘은 1705년 7월 케프 부근에서 알제 데이의 군대에 져 알제로 끌려갔다. 크레타 그리스계 무슬림을 아버지로 둔 군인 후사인 이븐 알리가 같은 해 7월 스스로 베이를 선포했고, 알제군의 튀니스 포위를 배상금을 주고 풀게 했다고 전한다. 오스만 조정은 그에게 베일레르베이 칭호를 내려 가문의 세습을 인정했다고 한다. 이렇게 후사인 왕조가 시작되어 튀니스는 이름만 오스만 아래에 있고 실제로는 외교와 조세를 스스로 정하는 정권이 되었다. 동쪽 트리폴리에서는 1711년 예니체리 기병 장교 아흐메트 카라만리가 총독 칼릴 파샤를 죽이고 튀르크 장교들을 처형한 뒤 권력을 쥐었다. 오스만 조정은 그를 파샤로 인정할 수밖에 없었고, 카라만리 가문의 파샤 자리는 세습이 되었다. 두 정권은 알제 섭정과 함께 오스만의 마그레브 속령이 지방 왕조로 바뀌는 길을 보여 준다. 해적 활동과 유럽 국가들과의 조약, 곡물과 올리브유 수출이 이 정권의 재정이었고, 지배 계층은 튀르크계 군인과 쿨로을루였으며 토착 아랍·베르베르 주민은 세금을 냈다. 튀니스의 베이는 지방에 순회 군대(마할라)를 보내 세금을 걷었고 파샤와 데이의 역할은 줄어들었다. 카라만리 가문은 해적 활동과 사하라 대상 무역의 관세로 재정을 꾸렸고 오스만에는 형식적 공물을 보냈다. 두 정권 모두 금요일 설교에서 오스만 술탄의 이름을 부르며 종주권을 형식으로 인정했다. 후사인 1세는 예니체리와 아랍·베르베르 부족 병력, 안달루스 이주민의 후손을 함께 아우르려 했고 튀니스 상인과 유대인 공동체의 지지를 얻었다. 카라만리 가문은 쿨로을루(튀르크 군인과 현지 여성 사이의 후손)와 부족 수장의 연합에 기댔다."
  subjects: [husainid-tunisia, karamanli-tripolitania, regency-of-algiers, ottoman]
  tags: [politics]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Lucette Valensi, Tunisian Peasants in the Eighteenth and Nineteenth Centuries (Beth Archer 옮김, Cambridge University Press, 1985)", "John Wright, Libya: A Modern History (Croom Helm, 1982)"]

- id: hotak-kandahar-1709
  year: 1709
  endYear: 1722
  title:
    ko: "미르 와이스의 칸다하르 봉기와 호타키 왕조(1709~1722)"
  summary:
    ko: "칸다하르는 사파비와 무굴이 차지하려 다투던 변경 도시로, 1703~1704년 사파비가 조지아 출신 총독 구르긴 칸을 보내 다스리고 있었다. 이 총독은 수니파 파슈툰 길자이족을 엄하게 다스려 불만을 샀다. 길자이 호타키 부족의 수장 미르 와이스는 1709년 4월 구르긴 칸을 죽이고 칸다하르를 차지했다. 사파비는 조지아 출신 장군들이 이끈 원정군을 보냈으나 거듭 졌고, 미르 와이스는 칸다하르를 독립 상태로 이끌어 1715년 죽을 때까지 지켰다. 동생 압둘 아지즈가 뒤를 이었다가 1717년 미르 와이스의 아들 마흐무드에게 죽임을 당했다. 헤라트의 압달리 파슈툰도 이 무렵 사파비에서 벗어나 사파비의 동쪽 변경은 크게 흔들렸다. 1720~1721년 마흐무드는 케르만을 공격해 야즈드까지 나아갔고, 1722년 3월 8일 이스파한 동쪽 굴나바드에서 사파비군을 크게 이겼다. 사파비 군은 부족 병력과 굴람이 서로 돕지 못했고 지휘관들의 의견이 갈렸다. 연구자들은 이 봉기의 배경으로 사파비의 종교·조세 정책에 대한 변경 수니파 주민의 불만과 중앙 정부의 허약함을 꼽는다. 이어지는 이스파한 포위는 다음 사건에서 다룬다. 칸다하르는 인도로 가는 길목이어서 무굴 제국과 사파비가 번갈아 차지했고, 길자이는 파슈툰 부족 가운데 가장 큰 축에 들었다. 굴나바드에서 사파비군은 수가 더 많았으나 지휘가 흩어져 졌다고 전한다(병력은 사료마다 다르다). 굴나바드 승리 전의 몇 해 동안 사파비 조정은 환관·후궁과 울라마의 다툼으로 변경을 돌보지 못했다. 술탄 후사인은 신앙심이 깊어 수니파와 수피, 소수 공동체를 억누르는 쪽으로 기울었다는 평가가 있다. 미르 와이스는 메카의 학자들에게서 시아파 지배자에 맞서는 일이 정당하다는 견해를 받았다고 전한다. 그의 봉기는 아프가니스탄 역사에서 파슈툰 독립 국가의 기원으로 자주 기억된다."
  subjects: [hotak-dynasty, safavid-iran]
  links:
    - { from: hotak-dynasty, to: safavid-iran, note: "굴나바드 전투 승리 (1722)" }
  tags: [war, politics]
  sources: ["Laurence Lockhart, The Fall of the Safavi Dynasty and the Afghan Occupation of Persia (Cambridge University Press, 1958)", "Rudi Matthee, Persia in Crisis: Safavid Decline and the Fall of Isfahan (I.B. Tauris, 2012)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]

- id: isfahan-fall-1722
  year: 1722
  endYear: 1730
  title:
    ko: "이스파한 함락과 사파비의 몰락(1722~1730)"
  summary:
    ko: "굴나바드에서 이긴 마흐무드 호타키는 1722년 3월부터 이스파한을 에워쌌다. 굶주림과 전염병으로 시민이 크게 죽었다고 전한다(수는 사료마다 다르다). 샤 술탄 후사인은 10월 23일 성을 열고 왕위를 마흐무드에게 넘겼다. 아들 타흐마스프 2세는 포위를 빠져나가 카즈빈에서 샤를 칭하며 왕조를 이었다. 이 틈에 이웃 나라들이 이란을 나누어 가졌다. 러시아의 표트르 1세는 1722년 카스피해 연안으로 원정해 9월 데르벤트를 얻고 길란에도 들어갔으며(완전 장악은 1723년 3월) 1723년 7월 바쿠를 차지했고, 오스만도 1723년 조지아와 아제르바이잔으로 들어가 1724년 콘스탄티노폴리스 조약으로 러시아와 이란 땅을 나누었다(「오스만·페르시아 사이의 동조지아, 카르틀리-카헤티 왕국의 성립」, 뒤의 사건). 마흐무드는 정신이 불안해져 사파비 왕족과 귀족을 대량으로 죽이다 1725년 죽었고, 사촌 아슈라프가 뒤를 이었다. 아슈라프는 1727년 오스만과 하마단 조약을 맺어 오스만이 점령한 서부를 인정하는 대신 샤로 승인받았다. 호라산의 아프샤르 부족 장수 나디르 쿨리는 1726년 타흐마스프 2세 편에 서서 말레크 마흐무드 시스타니의 마슈하드를 되찾았고, 1729년 5월 헤라트 근처 압달리를, 9월 담간에서 아슈라프를 무찌르고 11월 다시 이겨 12월 이스파한에 들어갔다. 아슈라프는 1730년 쫓겨 가다 죽었다. 1730년 봄 나디르는 오스만과 싸우러 서쪽으로 향해 하마단과 케르만샤를 되찾는 데 나섰다. 이스파한 시민은 포위 중 굶주림에 시달렸고 함락 뒤에도 호타키의 약탈과 세금에 시달렸다. 러시아의 원정은 1723년 사파비가 데르벤트·바쿠·길란 등을 넘기는 조약에 이르렀으나 이란에서 비준되지 않았다. 이스파한 함락 소식은 이란 안팎에 사파비의 정통성이 무너졌음을 알렸고 지방의 칸들이 저마다 움직이는 계기가 되었다. 뉴줄파의 아르메니아 상인 공동체도 약탈과 징발을 겪었다고 전한다."
  subjects: [safavid-iran, hotak-dynasty, ottoman, russia]
  links:
    - { from: hotak-dynasty, to: safavid-iran, note: "이스파한 함락 (1722)" }
    - { from: ottoman, to: safavid-iran, note: "서부 점령 (1723~1727)" }
  tags: [war, politics]
  sources: ["Laurence Lockhart, The Fall of the Safavi Dynasty and the Afghan Occupation of Persia (Cambridge University Press, 1958)", "Rudi Matthee, Persia in Crisis: Safavid Decline and the Fall of Isfahan (I.B. Tauris, 2012)", "Michael Axworthy, The Sword of Persia: Nader Shah, from Tribal Warrior to Conquering Tyrant (I.B. Tauris, 2006)"]

- id: zahir-al-umar-1730
  year: 1730
  endYear: 1775
  title:
    ko: "다히르 알우마르와 아크레: 갈릴리의 지방 세력(1730~1775)"
  summary:
    ko: "오스만의 시리아 총독령 가운데 갈릴리는 지방 수장들이 세금 징수권을 사서 다스렸다. 베두인 기원의 자이다니 가문 출신의 다히르 알우마르는 1730년 무렵 티베리아스를 요새로 만들며 힘을 키웠고, 1750년 무렵 지중해 항구 아크레를 도읍으로 삼았다. 그는 나사렛과 사페드 같은 갈릴리의 도시와 농촌을 아울러 면화를 심게 하고, 아크레를 통해 마르세유의 프랑스 상인에게 팔아 재정을 마련했다. 이슬람교도와 그리스도교도, 유대인 상인이 모두 그의 영역에서 활동했다. 다마스쿠스 총독들은 그를 여러 차례 공격했으나 실패했다. 1770년대 러시아-튀르크 전쟁(「러시아-튀르크 전쟁과 퀴췩카이나르자 조약」, 뒤의 사건)이 한창일 때 다히르는 이집트의 알리 베이와 손잡고 1771년 다마스쿠스를 압박했으며, 1772년 러시아 함대의 지원을 받았다. 알리 베이가 무너진 뒤 오스만은 해군 제독 하산 파샤를 보냈고, 1775년 8월 하산 파샤의 함포 사격 중 북아프리카 출신 용병 포병이 응사를 멈추었고, 아크레를 빠져나가려던 다히르는 8월 21~22일 그 용병들의 총에 맞아 목이 베였다. 다히르를 섬기다 등을 돌린 보스니아 출신 맘루크 아흐마드 알자자르는 그가 죽은 뒤 하산 파샤에게서 아크레 수비를 넘겨받았고(1775년 9월) 뒤에 시돈 총독이 되었다. 다히르의 시도는 오스만 영토 안에서 지방 세력이 해안 무역을 바탕으로 사실상 자치 정권을 세운 사례였고, 같은 세기 이집트의 베이들과 이라크의 맘루크 총독과 비슷한 흐름이었다. 다히르는 특히 면화를 아크레를 통해 프랑스로 수출했고 아크레의 성벽과 항구를 고쳤다. 그의 영역 안에서 그리스도교도와 유대인 상인은 보호를 받았으나 농민과 수장은 무거운 세금을 졌다. 베이루트와 시돈에서는 레바논 산 토후, 시아파 메타왈리 수장과의 갈등과 협력이 이어졌다. 다히르의 군대는 베두인 기병과 북아프리카 출신 용병이 중심이었다. 그는 오스만 술탄에게 이름뿐인 충성을 보이면서 세금을 아크레에 모으려 했다."
  subjects: [ottoman, russia]
  tags: [politics, economy]
  sources: ["Amnon Cohen, Palestine in the 18th Century: Patterns of Government and Administration (Magnes Press, 1973)", "Thomas Philipp, Acre: The Rise and Fall of a Palestinian City, 1730–1831 (Columbia University Press, 2001)", "P. M. Holt, Egypt and the Fertile Crescent, 1516–1922: A Political History (Cornell University Press, 1966)"]

- id: nader-shah-1736
  year: 1736
  endYear: 1747
  title:
    ko: "나디르 샤와 아프샤르 왕조(1736~1747)"
  summary:
    ko: "나디르는 1732년 샤 타흐마스프 2세가 오스만에게 캅카스 땅을 잃는 원정에 실패하자 그를 물러나게 하고 갓난아이 아바스 3세를 세워 섭정이 되었다. 1735년 3월 나디르는 러시아와 간자 조약을 맺어 카스피해 연안 도시를 돌려받았고, 그해 여름 오스만을 무찔러 동조지아와 아르메니아를 되찾았다(「오스만·페르시아 사이의 동조지아, 카르틀리-카헤티 왕국의 성립」, 앞의 사건). 1736년 1월 무간 평원 집회에서 부족장과 울라마가 그를 샤로 추대했고, 그는 3월 8일 즉위했다. 이로써 사파비 왕조가 끝나고 아프샤르 왕조가 시작되었다. 나디르는 시아파를 국교로 삼은 사파비의 방침을 풀어 시아의 자으파리 법학파를 수니의 네 법학파에 이은 다섯째 법학파로 인정하자고 제안했으나, 오스만 조정은 받아들이지 않았다. 그는 1738년 호타키 왕조의 마지막 근거지 칸다하르를 얻고 1739년에는 무굴 제국을 공격해 델리를 약탈했으며, 1740년 부하라와 히바 칸국을 복속시켰다. 1741년 마잔다란에서 암살 시도를 당한 뒤 아들 레자 쿨리를 의심해 눈을 멀게 했다고 전하고, 1741~1743년 다게스탄 원정에서는 레즈긴 부족의 저항에 지쳤다. 오스만과는 1743년 이라크를 공격한 뒤 1746년 강화해 주하브 조약의 경계로 돌아갔다. 군대와 전쟁 비용을 대려 한 무거운 세금은 지방의 반란을 불렀고, 1747년 6월 20일 호라산 쿠찬 근처에서 부하 장교들에게 암살되었다. 그의 죽음 뒤 제국은 곧 흩어져 호라산 일대만 아프샤르 가문에 남았다. 나디르의 군대는 페르시아인뿐 아니라 아프간·우즈베크·쿠르드·투르크멘 병력으로 이루어졌다. 그는 걸프에 함대를 키우려 했으나 오래 이어지지 않았다. 러시아는 간자 조약으로 카스피해 연안 도시를 돌려주는 대신 오스만에 맞서는 이란과의 협력을 얻었고, 덕분에 나디르는 북서쪽의 부담을 덜고 동쪽으로 눈을 돌릴 수 있었다."
  subjects: [afsharid-iran, safavid-iran, hotak-dynasty, ottoman, russia]
  tags: [politics, war]
  sources: ["Michael Axworthy, The Sword of Persia: Nader Shah, from Tribal Warrior to Conquering Tyrant (I.B. Tauris, 2006)", "Ernest S. Tucker, Nadir Shah's Quest for Legitimacy in Post-Safavid Iran (University Press of Florida, 2006)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]

- id: busaid-oman-1737
  year: 1737
  endYear: 1749
  title:
    ko: "페르시아의 오만 침공과 아흐마드 빈 사이드, 부사이드 왕조(1737~1749)"
  summary:
    ko: "야루바의 이맘 술탄 빈 사이프 2세가 1718년 죽은 뒤 오만은 후계 다툼과 부족 갈등으로 갈라졌고, 사이프 빈 술탄 2세와 술탄 빈 무르시드가 이맘 자리를 두고 맞섰다. 사이프 빈 술탄 2세 쪽이 이란의 나디르 샤에게 도움을 청하자 1737년 페르시아군이 오만 내륙을 습격하고 물러났다. 1742~1743년에는 페르시아군이 다시 와서 무스카트를 차지했고, 이맘 술탄 빈 무르시드가 소하르에서 전사했다. 소하르 총독 아흐마드 빈 사이드 알부사이디는 페르시아군에 아홉 달 동안 포위당한 끝에 협약을 맺어 공물을 바치는 조건으로 소하르·바르카 총독 자리를 이었고, 이를 바탕으로 1744년 이맘으로 선출되었다(1749년이라는 설도 있다). 1747년 나디르가 암살되어 이란에서 지원이 끊기자 그는 바르카에서 페르시아 수비대 지도자들을 모아 죽이고 오만 해안의 남은 페르시아 세력을 정리했다. 야루바의 마지막 이맘 빌아랍 빈 히미야르가 1749년 죽자 아흐마드는 오만을 홀로 다스리는 지도자가 되었다. 이렇게 부사이드 왕조가 시작되었다. 부사이드의 오만은 무스카트의 해상 무역과 동아프리카 해안의 세력, 이바드파의 이맘 선출 전통을 함께 이어 갔다. 이 시기 오만은 외세 침입을 이겨 냈지만 전쟁과 내전으로 농촌과 내륙 도시가 크게 피폐했다. 아흐마드 빈 사이드는 상인 출신으로 알려졌고 소하르 총독으로서 인도·페르시아만 교역의 이익을 알았다. 그는 함대를 키우고 무스카트를 중심 항구로 삼았다. 이바드파 이맘 선출의 전통은 지켜졌으나 학자와 부족장의 합의로 뽑힌 이맘이 군사와 행정 권력까지 쥐는 쪽으로 기울었다. 이란에서는 아프샤르 왕조의 나디르가 죽은 뒤 오만 원정이 이어지지 못했다. 무스카트는 이 무렵 인도 서해안과 페르시아만, 동아프리카 잔지바르를 잇는 중계 항구였고 아흐마드는 이곳에 군함과 상선을 갖추었다. 페르시아 점령은 내륙과 해안의 파벌 다툼을 깊게 했고 오만 주민의 피해도 컸다."
  subjects: [busaid-oman, yaruba-dynasty, afsharid-iran]
  links:
    - { from: busaid-oman, to: afsharid-iran, note: "페르시아군 축출 (1744~1747)" }
    - { from: busaid-oman, to: yaruba-dynasty, note: "야루바 왕조 대신 단독 통치 (1749)" }
  tags: [politics, war]
  sources: ["J. C. Wilkinson, The Imamate Tradition of Oman (Cambridge University Press, 1987)", "Michael Axworthy, The Sword of Persia: Nader Shah, from Tribal Warrior to Conquering Tyrant (I.B. Tauris, 2006)", "Willem Floor, The Persian Gulf: A Political and Economic History of Five Port Cities, 1500–1730 (Mage Publishers, 2006)"]

- id: nader-india-1738
  year: 1738
  endYear: 1739
  title:
    ko: "나디르 샤의 인도 원정과 델리 약탈(1738~1739)"
  summary:
    ko: "아프샤르 왕조의 나디르는 1738년 칸다하르를 얻어 마지막 군주 후세인 호타키(미르 와이스의 아들)를 몰아내고 호타키 왕조를 끝낸 뒤(1737~1738년의 포위 끝에 항복받았다고 전한다) 아프가니스탄을 지나 인도 쪽으로 나아갔다. 명분은 무굴 제국이 칸다하르에서 도망친 아프간인을 숨겨 주었고 나디르의 사절이 잘랄라바드에서 막혀 살해되었다는 것이었다. 1738년 6월 카불을 차지하고 겨울 페샤와르를 거쳐 1739년 1월 라호르에 들어갔다. 1739년 2월 24일 카르날에서 무굴 황제 무함마드 샤의 대군과 맞붙어 몇 시간 만에 이겼다. 무굴군은 수가 훨씬 많았으나 화력과 기동력에서 밀렸다(양쪽 병력은 사료마다 크게 다르고 무굴군 사망은 8천~3만 명 사이 추산이 있고 2만 명 안팎이 흔하다). 나디르는 3월 20일 델리에 들어갔는데, 이튿날 밤 나디르가 죽었다는 소문이 돌아 시민이 페르시아 병사를 공격했다. 나디르는 이에 보복해 22일 도시 주민을 학살하도록 명했다. 희생자는 대개 2만~3만 명으로 추산되지만 사료마다 갈린다. 그는 공작 왕좌와 코이누르 다이아몬드를 비롯한 막대한 보물을 가지고 5월 델리를 떠났고, 인더스강 서쪽 땅을 얻었다. 이란에서는 3년 동안 세금을 면제했다고 전한다. 무굴 제국은 이 침입으로 위신과 재정이 크게 무너져 지방 세력의 독립과 마라타의 팽창이 빨라졌다. 델리 시민 가운데에는 상인과 장인, 여성과 아이들이 많았고 도시는 며칠 동안 약탈과 방화에 시달렸다. 학살이 끝난 뒤 나디르는 무굴 귀족에게서 거액의 배상금을 걷게 했다. 카르날 전투는 니잠 알물크의 협상으로 마무리되었고, 델리에서 나디르는 무함마드 샤를 황제 자리에 그대로 두었다. 이는 나디르가 인도를 직접 다스리기보다 재물과 서쪽 영토를 얻는 데 뜻을 두었음을 보여 준다. 이 학살은 지금도 인도 역사에서 큰 상처로 기억된다."
  subjects: [afsharid-iran, hotak-dynasty]
  tags: [war]
  sources: ["Michael Axworthy, The Sword of Persia: Nader Shah, from Tribal Warrior to Conquering Tyrant (I.B. Tauris, 2006)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]
