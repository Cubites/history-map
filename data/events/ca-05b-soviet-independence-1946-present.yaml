- id: tajik-civil-war-1992
  year: 1992
  endYear: 1997
  title:
    ko: "타지키스탄 내전(1992~1997)"
  summary:
    ko: "타지키스탄은 소련 공화국 가운데 가장 가난했고 지역(레가르·쿨랍·후잔드와 가름·파미르)과 정당(공산당 옛 간부, 민주당, 이슬람 부흥당)으로 나뉘어 있었다. 1991년 8월 말 마흐카모프가 사임한 뒤 아슬로노프와 이스칸다로프의 대행과 나비예프의 짧은 재직을 거쳐, 11월 대통령 선거에서 옛 공산당 제1서기 라흐몬 나비예프가 영화인 다블라트 쿠도나자로프를 누르고 당선되었으나, 1992년 봄 두샨베 시내 광장에서 야당이 오래 농성했고 정부가 민병대에 무기를 나눠 주면서 5월 5일 무렵 충돌이 시작되었다. 9월 7일 나비예프가 공항에서 무장 병력에 둘러싸여 사임을 강요당했고 아크바르샤 이스칸다로프가 대통령 직무를 이어받았으며, 11월 후잔드에서 열린 최고 소비에트가 대통령제를 없애고 쿨랍 출신 에모말리 라흐몬을 최고 소비에트 의장(국가 수반)으로 뽑았다(11월 19~20일). 러시아와 우즈베키스탄의 지원을 받은 인민 전선 민병대가 12월 두샨베를 장악하면서 야당 지지 지역인 가름과 파미르 출신 주민에 대한 학살과 방화, 추방이 이어졌고 인권 단체들은 이를 인종 청소에 가깝다고 평가했다. 야당은 아프가니스탄으로 넘어가 이슬람 부흥당 사이드 압둘로 누리를 중심으로 통합 타지크 야당(UTO)을 이루었고, 국경을 지키던 러시아군 국경 경비대가 1993년 7월 습격을 받아 25명 안팎이 죽었다. 1994년 11월 라흐몬은 헌법을 국민 투표에 부치고 대통령에 직접 선출되었다. 같은 해 12월 유엔 타지키스탄 감시단(UNMOT)이 파견되었고, 1996년 12월 호스데 합의, 1997년 6월 27일 모스크바에서 라흐몬과 누리가 '평화와 민족 화합을 위한 일반 협정'을 맺어 야당 인사에게 정부 요직의 30%를 배정하기로 했다. 사망자는 2만~15만 명(주로 5만~10만 명으로 인용됨)으로 추산이 크게 갈리며 120만 명 정도가 집을 잃었다. 이 전쟁은 독립 직후 신생 국가가 지역 균형을 잃으면 쉽게 무너질 수 있음을 보여 주었고, 같은 시기 이웃 나라들의 정치 체제 선택에도 영향을 주었다(「독립 뒤 중앙아시아의 정치 체제와 아스타나 천도(1992~2006)」(같은 해의 사건))."
  subjects: [tajikistan, russia-fed, uzbekistan, afghanistan]
  links: []
  tags: [war, politics]
  sources: ["Shirin Akiner, Tajikistan: Disintegration or Reconciliation? (Royal Institute of International Affairs, 2001)", "Shirin Akiner·Catherine Barnes (eds.), Politics of Compromise: The Tajikistan Peace Process (Conciliation Resources, 2001)", "Adeeb Khalid, Islam after Communism: Religion and Politics in Central Asia (University of California Press, 2007)"]

- id: central-asia-regimes-1992
  year: 1992
  endYear: 2006
  title:
    ko: "독립 뒤 중앙아시아의 정치 체제와 아스타나 천도(1992~2006)"
  summary:
    ko: "다섯 나라는 독립 뒤 소련 시절 지도자를 중심으로 강한 대통령제를 만들었다. 카자흐스탄의 누르술탄 나자르바예프는 1995년 국민 투표로 임기를 2000년까지 늘렸고 민주화보다 경제 개혁과 석유 개발을 앞세웠으며, 1997년 12월 수도를 알마티에서 북쪽의 아크몰라로 옮겨 1998년 아스타나로 이름 지었다. 우즈베키스탄의 이슬람 카리모프는 1991년 12월 대선에서 야당 후보를 누르고 1995년 국민 투표로 임기를 늘렸으며 야당 '에르크'·'비를리크'를 막았고 1999년 2월 타슈켄트 폭탄 사건 뒤 이슬람주의 세력을 강하게 탄압했다. 투르크메니스탄의 사파르무라트 니야조프는 1992년 6월 단독 후보로 당선되어 1999년 12월 종신 대통령이 되었고, 1995년 12월 유엔 총회에서 영세 중립국으로 인정받았으며 자신을 '투르크멘바시'(투르크멘의 아버지)라 부르게 하고 『루흐나마』(2001)를 학교와 공무원 시험에 의무화한 개인숭배로 알려졌다. 니야조프는 2006년 12월 21일 죽었고 부총리 구르반굴리 베르디무하메도프가 대통령 직무 대행을 거쳐 2007년 2월 11일 선거에서 이겨 14일 취임했다. 키르기스스탄의 아스카르 아카예프는 1990년 10월 최고 소비에트에서 대통령이 된 뒤 1991년 10월 직선으로 뽑혔고 1993년 새 헌법으로 '민주주의의 섬'이라 불렸으나 2000년대 들어 가족 중심의 권력과 부패 비판을 받았으며 독립 직후 낡은 소련식 체제에서 시장 경제로 바꿔 1998년 세계 무역 기구에 중앙아시아 최초로 가입했다. 타지키스탄의 라흐몬은 내전 뒤 1999년과 2003년 국민 투표로 임기 제한을 풀었다. 다섯 나라 모두 선거는 있었으나 국제 기구는 야당과 언론의 활동이 제한된 점을 거듭 지적했고, 지도자들은 이를 안정과 질서를 지키는 데 필요한 일이라고 설명했다. 1990년대에는 러시아계 주민이 많이 떠나 카자흐스탄에서만 인구가 100만 명 넘게 줄었다. 1990년대 타지키스탄은 내전을 겪었고(「타지키스탄 내전(1992~1997)」(같은 해의 사건)), 우즈베키스탄·투르크메니스탄은 이 일을 이웃 나라의 불안 사례로 들며 안정을 명분 삼았다."
  subjects: [kazakhstan, uzbekistan, turkmenistan, kyrgyzstan, tajikistan]
  links: []
