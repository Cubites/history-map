# 중앙아시아 사건 5b차 묶음(ca-05b): 소련 시대 후반과 독립 — 아프가니스탄·카자흐스탄·우즈베키스탄·투르크메니스탄·키르기스스탄·타지키스탄 (1946 ~ 2026년 기준)
# 범위: 아프가니스탄 왕정 후기와 파슈투니스탄 문제·세미팔라틴스크 핵실험장·처녀지 개간·바이코누르 우주 기지·아랄해와 면화·다우드의 공화국과 사우르 혁명·소련의 개입과 무자헤딘·
#   소련 말기 알마티·페르가나·두샨베·오시의 충돌·나지불라 정권의 몰락과 아프가니스탄 내전·다섯 공화국의 독립·타지키스탄 내전·독립 뒤의 정치 체제·탈레반 정권과 북부 동맹·
#   상하이 협력 기구와 집단 안보 조약 기구·미국의 아프가니스탄 전쟁과 공화국·키르기스스탄의 두 혁명·안디잔 사건과 미르지요예프의 개혁·탈레반의 재집권·카자흐스탄의 권력 이양과 1월 사태.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다. 소련의 구성 공화국은 항목이 없어 글로만 다루고 항목은 소련으로 이었다.
# 날짜: 모두 그레고리력이다. 아프가니스탄의 태양력(히즈라 샴시)은 쓰지 않았다. 확실하지 않은 날짜는 '무렵'으로 적었고 2026년 기준으로 진행 중인 일은 확인한 마지막 사실까지만 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 그 이름이 쓰이던 때의 이야기는 옛 이름(알마아타는 1993년 앞, 두샨베, 아스타나)으로 적었다.
#   사망자·난민·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다. 핵실험 피해, 아프가니스탄 전쟁들, 타지키스탄 내전, 안디잔·오시·카자흐스탄 1월 사태의 사망자, 탈레반의 정책은 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(소련–아프가니스탄 전쟁과 파키스탄, 신냉전과 대한항공 007편 격추, 고르바초프의 개혁·개방과 신사고 외교, 소련의 해체, 시진핑 체제의 출범과 일대일로).

- id: afghan-monarchy-late-1946
  year: 1946
  endYear: 1973
  title:
    ko: "아프가니스탄 왕정 후기와 파슈투니스탄 문제(1946~1973)"
  summary:
    ko: "1933년 열아홉 살에 왕이 된 자히르 샤는 한동안 삼촌들에게 정치를 맡겼고, 총리는 샤 마흐무드 칸(1946~1953)에 이어 왕의 사촌인 무함마드 다우드 칸(1953~1963), 무함마드 유수프(1963~1965), 무함마드 하심 마이완드왈(1965~1967), 대행 압둘라 야크타(1967년 10~11월 3주)를 거쳐 누르 아흐마드 에테마디(1967~1971), 압둘 자히르(1971~1972), 무함마드 무사 샤피크(1972~1973)로 이어졌다. 1947년 영국령 인도가 갈라져 파키스탄이 서자 아프가니스탄 정부는 1893년의 듀랜드선을 국경으로 인정하지 않고 선 건너 파슈툰 사람들의 자결을 요구하는 파슈투니스탄 문제를 내세웠고, 유엔에서 파키스탄의 가입에 홀로 반대표를 던졌으나 곧 철회했다. 파키스탄이 서방의 군사 동맹에 들자 다우드 정부는 미국에서 무기를 얻지 못하고 1955년 말 소련 지도자 흐루쇼프와 불가닌의 방문을 받아 소련의 무기와 차관을 들여왔으며, 소련은 도로와 터널(1964년 살랑 터널)을 놓고 군을 훈련했고 미국은 헬만드강 개발을 도와 두 진영 사이에서 균형을 잡는 외교가 이어졌다. 1961년 파슈투니스탄 문제로 파키스탄과 국교를 끊고 국경을 닫았다가 경제가 어려워지자 다우드는 1963년 3월 물러났고 국교는 그해 5월 회복되었다. 1964년 10월 공포한 헌법은 입헌 군주제 아래 양원제 의회와 직선 하원을 두고 왕족이 각료가 되지 못하게 했으며 여성에게도 투표권을 주었다. 그러나 왕이 정당법을 재가하지 않아 정당은 합법적 기반을 얻지 못했고, 1965년 결성된 인민 민주당 같은 공산 계열 세력과 카불 대학의 이슬람주의 학생 운동이 따로 자라났다. 1971~1972년 가뭄으로 북부와 중부 산악 지대에서 큰 기근이 났고 정부 대응이 비판받는 가운데 정치 불안이 깊어졌다. 그 끝에 다우드가 왕이 이탈리아에 있던 1973년 7월 정변으로 왕정을 무너뜨렸다(「다우드의 공화국과 사우르 혁명(1973~1979)」(뒤의 사건))."
  subjects: [afghanistan, pakistan, soviet-union, usa]
  links: []
  tags: [politics, diplomacy]
  sources: ["Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)", "Louis Dupree, Afghanistan (Princeton University Press, 1973)", "Barnett R. Rubin, The Fragmentation of Afghanistan: State Formation and Collapse in the International System (2nd ed., Yale University Press, 2002)"]

- id: semipalatinsk-test-site-1949
  year: 1949
  endYear: 1991
  title:
    ko: "세미팔라틴스크 핵실험장(1949~1991)"
  summary:
    ko: "소련은 미국에 이어 핵무기를 만들려고 1947년 소련 부총리 겸 원자 계획 책임자 라브렌티 베리야의 주도로 카자흐 공화국 북동부 이르티시강 가의 약 1만 8천 km² 초원을 실험장으로 골랐고, 수용소 노동자들이 시설을 지었다. 1949년 8월 29일 첫 원자 폭탄 시험이 이곳에서 성공했고, 1953년 8월에는 소련의 첫 수소 폭탄 계열 시험이 이어졌다. 1963년 대기권·우주·수중 핵실험을 금지하는 부분 핵실험 금지 조약이 맺어진 뒤에는 지하 실험이 중심이 되어 1949~1989년에 모두 450여 차례(집계에 따라 456~468차례, 그중 대기권 약 120여 차례)의 핵실험이 있었다. 실험은 인근 마을 주민을 대피시키지 않거나 제대로 알리지 않은 채 이루어졌고, 카자흐 쪽 전문가들은 낙진에 노출된 사람을 150만 명 안팎으로, 직접 피해를 입은 사람을 20만 명 안팎으로 추산한다. 암과 선천성 기형의 증가가 이 지역 주민의 건강 조사에서 거론되지만 원인과 규모는 연구마다 갈려 한 숫자로 말하기 어렵다. 1989년 2월 카자흐 시인 올자스 술레이메노프가 이끈 반핵 운동 '네바다–세미팔라틴스크'가 수십만 명의 서명을 모으며 번졌고, 마지막 폭발(1989년 10월 19일) 뒤 카자흐 공화국 대통령 나자르바예프가 1991년 8월 29일 실험장을 닫는 포고령을 냈다. 이 운동은 소련 말기 중앙아시아에서 민족 의식과 환경 문제가 만난 첫 대중 운동으로 꼽힌다. 독립한 카자흐스탄은 소련이 남긴 핵무기를 1990년대 중반까지 러시아로 넘기고 비핵국이 되는 길을 골랐다. 실험장 가까이의 도시 쿠르차토프(옛 이름 세미팔라틴스크-21)에는 핵 연구자와 군인이 모여 살았고, 주변 주민의 건강 문제는 소련 시기에 비밀로 다루어졌다."
  subjects: [soviet-union, kazakhstan]
  links: []
  tags: [politics, society, war]
  sources: ["Kate Brown, Plutopia: Nuclear Families, Atomic Cities, and the Great Soviet and American Plutonium Disasters (Oxford University Press, 2013)", "Martha Brill Olcott, The Kazakhs (2nd ed., Hoover Institution Press, 1995)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)"]

- id: virgin-lands-1954
  year: 1954
  endYear: 1964
  title:
    ko: "처녀지 개간과 카자흐 스텝의 변화(1954~1964)"
  summary:
    ko: "1953년 9월 스탈린의 뒤를 이은 흐루쇼프는 곡물 부족을 풀려고 카자흐 북부와 시베리아 서부의 초원을 갈아엎는 계획을 내놓았고, 1954년 초 공산당 중앙 위원회가 이를 확정해 1956년까지 약 1,300만 헥타르를 개간하기로 했다. 청년 자원자와 기계가 대거 들어가 개간 목표는 2,800만~3,000만 헥타르로 올라갔고, 1956년 처녀지의 곡물 생산은 1949~1953년 평균보다 180% 늘어 소련 역사상 가장 큰 수확을 거두었다. 카자흐 공화국 제1서기 쥬마베이 샤야흐메토프는 이 땅이 곡물에 맞지 않는다고 주저하다 1954년 2월 물러나고, 판텔레이몬 포노마렌코(1954~1955), 레오니트 브레즈네프(1955~1956), 이반 야코블레프(1956~1957), 니콜라이 벨랴예프(1957~1960), 딘무하메드 쿠나예프(1960~1962), 이스마일 유수포프(1962~1964)로 이어지며 개간을 밀어붙였다. 1955년 가뭄으로 카자흐의 곡물 수확은 전해보다 35% 줄었고, 센바람에 표토가 날아가는 침식이 번져 1959년 뒤 생산이 떨어져 1956년의 기록을 다시 넘지 못했다. 흐루쇼프는 1960년 말 북부 다섯 주를 묶은 처녀지 변경주를 만들고 이듬해 중심 도시 아크몰린스크를 첼리노그라드('처녀지 시')로 바꾸었으며 1963년에는 비료 투입을 늘렸으나 흉작이 겹쳐 캐나다에서 밀을 사 와야 했다. 이주민 수백만 명이 들어와 카자흐 공화국에서 카자흐인의 비율은 1959년 인구 조사에서 약 30%로 떨어졌고, 유목과 목축에 쓰이던 초원은 농지가 되었으며 러시아어를 쓰는 도시와 마을이 북부에 생겼다. 개간은 소련 농업이 늘어난 땅에 기대는 길에서 벗어나지 못한다는 비판을 낳았고, 1964년 흐루쇼프가 물러난 뒤 속도가 크게 줄었다."
  subjects: [soviet-union]
  links: []
  tags: [economy, society, politics]
  sources: ["Martin McCauley, Khrushchev and the Development of Soviet Agriculture: The Virgin Land Programme 1953–64 (Macmillan, 1976)", "Martha Brill Olcott, The Kazakhs (2nd ed., Hoover Institution Press, 1995)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)"]

- id: baikonur-1955
  year: 1955
  endYear: 1961
  title:
    ko: "바이코누르 우주 기지와 스푸트니크·가가린(1955~1961)"
  summary:
    ko: "1955년 소련 정부는 시르다리야강 중류의 투라탐 부근 사막에 대륙 간 탄도 미사일 R-7의 시험장을 짓기로 했고, 설계 책임자 세르게이 코롤료프가 이끄는 팀이 건설을 맡았다. 기지는 실제 바이코누르 마을과 300km 넘게 떨어져 있었으나 서방의 눈을 속이려고 바이코누르라는 이름을 붙였다는 설명이 널리 알려져 있다. 1957년 8월 R-7이 처음 성공적으로 날았고, 10월 4일 이 기지에서 세계 첫 인공위성 스푸트니크 1호가 올라갔으며, 11월 3일에는 개 라이카를 태운 스푸트니크 2호가 이어 올랐다. 1961년 4월 12일 유리 가가린이 탄 보스토크 1호가 이곳에서 출발해 약 108분 동안 지구를 한 바퀴 돌아 사람을 우주로 보낸 첫 나라가 되었고, 이 일은 미국과 소련의 우주 경쟁을 불붙였다. 기지 둘레에는 군인과 기술자의 도시 레닌스크(1995년 바이코누르로 개명)가 생겨 소련 전역에서 사람이 들어왔고, 인근 초원의 목축민은 로켓 단계가 떨어지는 구역에서 옮겨 가야 했다. 기지는 소련이 무너진 뒤 카자흐스탄 땅에 남았고 1994년 임대 협정으로 러시아가 시설을 계속 썼으며 2004년 협정으로 임대 기간이 2050년까지 늘었다. 곧 카자흐스탄 안에서는 로켓 낙진의 환경 영향이 논란이 되었다. 1960년 10월 24일에는 R-16 미사일이 발사대에서 폭발해 전략 로켓군 사령관 미트로판 네델린 원수를 비롯한 수십 명에서 100명 넘게(추산이 갈림) 숨졌으나 소련은 한참 동안 사고를 감추었다. 스푸트니크의 성공은 서방에 '스푸트니크 충격'을 주어 미국이 1958년 항공 우주국(NASA)을 세우고 과학 교육에 투자를 늘리는 계기가 되었다."
  subjects: [soviet-union]
  links: []
  tags: [politics, society]
  sources: ["Asif A. Siddiqi, Challenge to Apollo: The Soviet Union and the Space Race, 1945–1974 (NASA, 2000)", "Asif A. Siddiqi, Sputnik and the Soviet Space Challenge (University Press of Florida, 2003)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)"]

- id: aral-sea-1960
  year: 1960
  endYear: 2005
  title:
    ko: "면화 단작과 아랄해의 축소(1960~2005)"
  summary:
    ko: "소련은 중앙아시아의 건조한 땅에 물을 대어 면화를 대량으로 길러 섬유와 군수 원료를 자급하려 했고, 우즈베크 공화국 제1서기 샤라프 라시도프(1959~1983)가 오랫동안 면화 증산을 이끌었다. 1960년대 아무다리야강과 시르다리야강의 물을 대규모 수로로 돌려 논밭에 대자 호수로 흘러드는 물이 줄어 1960년께 약 6만 8천 km²로 세계에서 네 번째로 컸던 아랄해의 수위가 낮아지기 시작했다. 1987년 아랄해는 북쪽의 작은 호수와 남쪽의 큰 호수로 갈라졌고, 호수 넓이는 2000년대 초 처음의 10분의 1 안팎으로 줄었으며 염분이 크게 올라 물고기가 사라졌다. 어항 무이낙은 바다에서 수십 km 떨어진 내륙이 되어 배들이 모래 위에 남았고 어업 노동자와 가족이 일자리를 잃었다. 마른 바닥에서 소금과 농약이 섞인 먼지가 날려 올라 주변 주민의 호흡기 질환과 빈혈, 식수 오염이 보고되었고 지역 기후도 건조해졌다. 호수 한가운데의 보즈로즈데니예섬에는 소련이 생물 무기를 시험한 시설이 있었다. 한편 모스크바는 면화 생산량이 미달이라는 보고를 부풀리는 일이 공화국 지도부 전체에 퍼진 것을 알게 되어 1983년부터 우즈베크 공화국에서 '면화 사건' 수사를 벌였고, 라시도프가 1983년 죽은 뒤 간부 수백 명이 처벌되었다. 독립 뒤에도 우즈베키스탄과 투르크메니스탄은 면화를 외화 벌이로 삼아 물 갈등이 이어졌다. 카자흐스탄은 세계은행 등의 지원으로 시르다리야 하구에 코크아랄 댐을 지어 2005년에 마무리했고, 북쪽 호수의 수위와 어업이 일부 회복되었으나 남쪽 호수는 대부분 마른 채 남았다. 1954년 착공한 카라쿰 운하는 아무다리야 물을 투르크메니스탄 사막을 가로질러 1,300km 넘게 끌어 면화밭과 도시에 댔다."
  subjects: [soviet-union, uzbekistan, kazakhstan, turkmenistan]
  links: []
  tags: [economy, society]
  sources: ["Philip Micklin, 'The Aral Sea Disaster', Annual Review of Earth and Planetary Sciences 35 (2007)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)", "Martha Brill Olcott, Central Asia's New States: Independence, Foreign Policy, and Regional Security (United States Institute of Peace Press, 1996)"]

- id: daoud-republic-1973
  year: 1973
  endYear: 1979
  title:
    ko: "다우드의 공화국과 사우르 혁명(1973~1979)"
  summary:
    ko: "1973년 7월 17일 전 총리 무함마드 다우드 칸이 공산 계열 장교들의 도움으로 정변을 일으켜 이탈리아에 있던 자히르 샤를 몰아내고 왕정을 없앤 뒤 아프가니스탄 공화국의 대통령이 되었다. 다우드는 소련의 원조를 받는 개혁을 밀어붙이고 파슈투니스탄 문제로 파키스탄과 갈등하다가 1976년 무렵 화해를 모색했으며 점차 공산 세력을 정부에서 밀어내고 이란과 사우디아라비아에서 원조를 구하며 소련과 거리를 두려 했다. 1978년 4월 인민 민주당 지도자 미르 아크바르 카이바르가 암살되고 장례식이 시위로 번지자 다우드가 당 간부를 체포했고, 4월 27~28일 당과 가까운 장교들이 카불에서 무장 봉기(사우르 혁명)를 일으켜 다우드와 가족 대부분을 죽였다. 압둘 카디르가 이틀 동안 임시 국가 수반을 맡은 뒤 4월 30일 누르 무함마드 타라키가 혁명 평의회 의장이 되고 아프가니스탄 민주 공화국을 선포했다. 정부는 토지 개혁, 고리대 부채 탕감, 신부값 제한, 여성 교육 확대 같은 급진적 개혁을 서둘러 밀어붙였고 지방 지도층과 종교 지도자를 탄압해 1978년 봄부터 지방에서 반란이 일어났다. 인민 민주당은 타라키의 '인민'(칼크) 파와 카르말의 '깃발'(파르참) 파로 갈렸고, 1979년 3월 헤라트 반란에서 소련 고문관 가족을 포함해 많은 사람이 죽었다. 1979년 9월 14일 총리 하피줄라 아민이 타라키를 몰아내 혁명 평의회 의장이 되었고 타라키는 그 뒤 10월에 숨졌다. 아민의 강압 정치가 반란을 키우자 소련은 위기감을 느껴 12월 병력을 보내는 길을 택했다(「소련의 개입과 아프가니스탄 무자헤딘의 저항(1979~1989)」(뒤의 사건)). 다우드는 1977년 새 헌법을 만들어 민족 혁명당 한 정당만 인정하는 대통령제로 체제를 굳혔다. 폐위된 자히르 샤는 1973년 8월 로마에서 퇴위 문서에 서명했다."
  subjects: [afghanistan, soviet-union, pakistan]
  links: []
  tags: [politics, war]
  sources: ["Barnett R. Rubin, The Fragmentation of Afghanistan: State Formation and Collapse in the International System (2nd ed., Yale University Press, 2002)", "Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)", "Rodric Braithwaite, Afgantsy: The Russians in Afghanistan, 1979–89 (Oxford University Press, 2011)"]

- id: soviet-afghan-resistance-1979
  year: 1979
  endYear: 1989
  title:
    ko: "소련의 개입과 아프가니스탄 무자헤딘의 저항(1979~1989)"
  summary:
    ko: "1979년 12월 24일 소련 공수 부대가 카불로 들어오고 27일 특수부대가 대통령궁을 공격해 하피줄라 아민이 죽었으며, 소련은 망명해 있던 바브라크 카르말을 혁명 평의회 의장 자리에 앉혔다. 최대 10만 명이 넘는 소련군(제40군)이 주요 도시와 도로를 지켰으나 산악과 농촌은 이슬람 깃발 아래 모인 무자헤딘('성전의 전사')이 장악했다. 무자헤딘은 파키스탄 페샤와르에 본부를 둔 7개 정당(굴부딘 헤크마티아르의 이슬람당, 부르하누딘 라바니의 이슬람 협회 등)과 이란을 근거지로 한 시아파 정당들로 갈렸고, 판지시르 계곡에서는 아흐마드 샤 마수드가 소련군의 되풀이된 공세를 막았다. 1986년 가을 미국이 어깨 발사식 스팅어 미사일을 지원해 소련의 헬기 우위가 흔들렸다. 소련군의 전쟁 방식과 정부군 정보 기관의 탄압으로 마을이 파괴되고 난민이 파키스탄과 이란으로 흘러들어 1980년대 말 500만 명 안팎이 되었으며, 민간인 사망은 추산이 56만~200만 명으로 크게 갈린다. 카르말은 1986년 5월 당 서기장 자리를 비밀 경찰(카드) 책임자였던 무함마드 나지불라에게 넘겼고 11월에 의장직도 하지 무함마드 참카니에게 내줬다. 나지불라는 1987년 9월 대통령이 되었고 1월부터 '민족 화해' 정책으로 무자헤딘과 협상하려 했으나 응하지 않았다. 고르바초프가 소련군 철수를 결정해 1988년 4월 제네바 협정(「소련–아프가니스탄 전쟁과 파키스탄(1979~1989)」(같은 해의 사건))이 맺어졌고 마지막 소련군은 1989년 2월 15일 아무다리야강의 다리를 건너 돌아갔다. 소련군 전사자는 약 1만 4천~1만 5천 명이다. 전쟁은 소련 안에서도 개혁을 재촉했고(「고르바초프의 개혁·개방과 신사고 외교」(뒤의 사건)), 서방은 이를 신냉전의 한 장면으로 보았다(「신냉전과 대한항공 007편 격추」(같은 해의 사건))."
  subjects: [afghanistan, soviet-union, pakistan, usa]
  links: []
  tags: [war, politics, diplomacy]
  sources: ["Rodric Braithwaite, Afgantsy: The Russians in Afghanistan, 1979–89 (Oxford University Press, 2011)", "Steve Coll, Ghost Wars: The Secret History of the CIA, Afghanistan, and Bin Laden, from the Soviet Invasion to September 10, 2001 (Penguin Press, 2004)", "Barnett R. Rubin, The Fragmentation of Afghanistan: State Formation and Collapse in the International System (2nd ed., Yale University Press, 2002)"]

- id: central-asia-unrest-1986
  year: 1986
  endYear: 1990
  title:
    ko: "소련 말기 중앙아시아의 민족 충돌(1986~1990)"
  summary:
    ko: "1986년 12월 16일 소련 공산당 지도부가 22년 동안 카자흐 공화국 제1서기였던 딘무하메드 쿠나예프를 해임하고 러시아인 겐나디 콜빈을 보내자 이튿날부터 알마아타(지금 알마티)에서 학생과 청년이 광장에 모여 항의했고, 진압 과정에서 공식 집계로는 사망 2명(3명으로 적은 자료도 있다)이었으나 비공식 추산은 수백 명에 이르러 숫자가 갈린다. 이 '젤톡산' 사건은 소련 말기 첫 큰 민족 시위로 꼽히며 콜빈은 1989년 6월 나자르바예프로 교체되었다. 우즈베크 공화국에서는 1983년 라시도프가 죽은 뒤 모스크바가 면화 부정을 파헤치는 사건(「면화 단작과 아랄해의 축소(1960~2005)」(앞의 사건))이 이어졌고, 1989년 6월 페르가나 골짜기에서 우즈베크인과 소수 민족 메스헤티아 튀르크인 사이에 충돌이 벌어져 공식 집계로 100명 안팎이 죽고 메스헤티아 튀르크인 약 1만 7천 명이 피란했다. 그 뒤 우즈베크 공화국 제1서기는 이슬람 카리모프가 되었다. 1990년 2월 타지크 공화국 두샨베에서는 아르메니아 난민의 주택 배정 소문으로 폭동이 일어나 20여 명이 죽었고 비상사태가 선포되었다. 같은 해 6월 키르기스 공화국 오시 지방에서 땅과 주택을 놓고 키르기스인과 우즈베크인이 충돌해 공식 집계 300명 이상(비공식은 더 많음)이 죽었다. 이 사건들을 지나며 공화국마다 민족어를 국가어로 삼는 법(1989~1990)이 제정되고 우즈베크 '비를리크', 타지크 '라스토헤즈' 같은 민족 운동이 나타났다. 1991년 3월 연방 유지 국민 투표에는 다섯 공화국이 모두 참여해 다수가 찬성했으나 8월 정변 실패 뒤 연방은 급속히 흔들렸다(「소련의 해체」(뒤의 사건))."
  subjects: [soviet-union]
  links: []
  tags: [society, politics]
  sources: ["Martha Brill Olcott, The Kazakhs (2nd ed., Hoover Institution Press, 1995)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)", "Nick Megoran, Nationalism in Central Asia: A Biography of the Uzbekistan–Kyrgyzstan Boundary (University of Pittsburgh Press, 2017)"]

- id: afghan-civil-war-1989
  year: 1989
  endYear: 1996
  title:
    ko: "나지불라 정권의 몰락과 무자헤딘 내전(1989~1996)"
  summary:
    ko: "소련군이 물러난 뒤에도 아프가니스탄의 나지불라 정권은 소련의 무기와 연료에 기대어 버텼다. 1989년 3월 무자헤딘이 파키스탄 정보부의 도움을 받아 잘랄라바드를 공격했으나 정부군이 막아 냈고, 1990년 3월 국방 장관 샤나와즈 타나이의 군사 정변 시도도 실패했다. 소련이 해체를 앞둔 1991년 말~1992년 초 지원을 끊자 정권은 흔들렸고, 1992년 3월 북부의 우즈베크계 민병대 지도자 압둘 라시드 도스툼이 아흐마드 샤 마수드와 손잡았다. 4월 16일 나지불라는 유엔 중재로 출국하려다 공항에서 막혀 카불의 유엔 사무소로 피신했고 압둘 라힘 하티프가 12일 동안 임시 대통령을 맡았다. 4월 24일 페샤와르 협정으로 무자헤딘 정당들이 과도 정부를 세우기로 해 시브가툴라 무자디디가 4월 28일 임시 대통령이 되었고, 6월 28일 부르하누딘 라바니가 이어받았다. 그러나 굴부딘 헤크마티아르의 이슬람당이 카불 밖에서 로켓으로 도시를 쏘았고, 라바니와 마수드의 이슬람 협회, 도스툼의 세력, 시아파 하자라 정당과 사우디가 지원하는 사야프의 정당 등이 서로 싸웠다. 1993년 이슬라마바드 합의와 1994년 합종연횡에도 싸움은 멎지 않았고, 카불 시가지는 대부분 파괴되어 수만 명(추산이 갈림)이 죽고 수십만 명이 도시를 떠났다. 파키스탄은 헤크마티아르를 밀다 1994년 이후 새로 일어난 탈레반 쪽으로 기울었다. 국가는 사실상 지방 군벌이 나누어 다스리게 되었다. 1993년 2월 카불 서쪽 아프샤르 지구에서는 마수드·사야프 계열 병력이 하자라 주민을 공격해 학살이 일어났다. 이 사이 도스툼은 북부의 마자르이샤리프를, 이스마일 칸은 서부 헤라트를 사실상 다스렸다."
  subjects: [afghanistan, soviet-union, pakistan]
  links: []
  tags: [war, politics]
  sources: ["Barnett R. Rubin, The Fragmentation of Afghanistan: State Formation and Collapse in the International System (2nd ed., Yale University Press, 2002)", "Steve Coll, Ghost Wars: The Secret History of the CIA, Afghanistan, and Bin Laden, from the Soviet Invasion to September 10, 2001 (Penguin Press, 2004)", "Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)"]

- id: central-asia-independence-1991
  year: 1991
  endYear: 1992
  title:
    ko: "중앙아시아 다섯 공화국의 독립과 알마아타 선언(1991~1992)"
  summary:
    ko: "1991년 8월 모스크바에서 보수파가 정변을 일으켰다 실패하자 중앙아시아 공화국들은 앞다투어 독립을 선언했다. 우즈베키스탄(카리모프)은 8월 31일에 선언했고(기념일은 9월 1일) 키르기스스탄(아카예프)도 같은 날, 타지키스탄은 9월 9일, 투르크메니스탄(니야조프)은 국민 투표(10월 26일)를 거쳐 10월 27일 선언했고, 카자흐스탄은 12월 16일 가장 늦게 선언했다. 각 공화국 지도자는 대부분 공산당 제1서기에서 대통령이 된 사람들이었다. 12월 8일 러시아·우크라이나·벨라루스 정상이 벨라베자 협정으로 소련의 소멸을 선언하자 중앙아시아 지도자들은 소외된 데 불만을 드러냈고, 이들은 12월 13일 아시가바트에서 만나 독립 국가 연합(CIS)에 동등한 창립 회원으로 참여하겠다고 요구했다. 12월 21일 알마아타에서 11개 공화국이 알마아타 선언에 서명해 독립 국가 연합이 성립했다(「소련의 해체」(같은 해의 사건)). 12월 25일 고르바초프가 사임하고 이튿날 소련이 해체되어 다섯 공화국은 독립 국가가 되었다. 1992년 3월 2일 다섯 나라는 유엔에 가입했다. 이 과정에서 소련이 그어 놓은 공화국 경계(「소련의 민족 경계 획정과 중앙아시아 공화국들(1924~1936)」(앞의 사건))가 국경이 되었고, 공화국마다 같은 민족이 이웃 나라에 사는 문제가 남았다. 독립 직후의 선거와 국민 투표로 카리모프(12월 말), 나자르바예프(12월 1일), 아카예프(10월 12일), 라흐몬 나비예프(11월 24일)가 직선 대통령이 되었다. 러시아어를 쓰는 주민이 많이 떠나고 경제는 루블 지역 붕괴와 물가 상승으로 크게 흔들렸다. 통화도 루블 지역에서 빠져나와 키르기스스탄의 솜(1993년 5월), 카자흐스탄의 텡게(1993년 11월)와 투르크메니스탄의 마나트(1993년 11월)가 먼저 나왔고 타지키스탄은 2000년에야 소모니를 도입했다. 타지키스탄에서는 독립 몇 달 뒤 내전이 터졌고(「타지키스탄 내전(1992~1997)」(뒤의 사건)), 나라마다 정치 체제는 「독립 뒤 중앙아시아의 정치 체제와 아스타나 천도(1992~2006)」(뒤의 사건)에서 보듯 강한 대통령제로 굳어 갔다."
