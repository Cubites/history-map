- id: taliban-emirate-1996
  year: 1996
  endYear: 2001
  title:
    ko: "탈레반 정권과 북부 동맹(1996~2001)"
  summary:
    ko: "탈레반('학생들')은 1994년 가을 칸다하르에서 물라 무함마드 오마르를 중심으로 일어나 파키스탄 국경 지대의 이슬람 학교 출신 청년들과 옛 무자헤딘 지휘관을 모았다. 파키스탄의 군 정보부와 사우디아라비아의 자금을 업고 1995년 9월 헤라트를, 1996년 9월 27일 카불을 차지했으며, 오마르는 그해 4월 칸다하르에서 예언자의 망토를 두르고 '신자들의 지도자'를 칭했다. 탈레반은 이 땅을 '아프가니스탄 이슬람 토후국'이라 불렀다. 이들은 샤리아의 엄격한 해석을 시행했는데, 여성의 취업과 교육을 막았고 텔레비전과 음악을 금지했으며 남성에게 수염을 기르게 했다. 카불에서는 나지불라가 유엔 사무소에서 끌려 나와 처형되었다(1996년 9월 27일). 라바니 정부의 나머지는 북부로 물러나 마수드의 타지크계 이슬람 협회, 도스툼의 우즈베크계 민병대, 하자라 시아파 정당이 모인 '북부 동맹(공식 이름은 이슬람 통일 구국 전선)'을 이루었으며, 이 동맹은 인도와 이란, 러시아, 타지키스탄, 우즈베키스탄의 지원을 받고 유엔은 라바니 정부를 대표로 인정했다. 파키스탄·사우디아라비아·아랍 에미리트만 탈레반 정권을 승인했다. 1998년 8월 마자르이샤리프를 점령한 탈레반은 하자라인 학살로 비판받았다. 2000년 오마르의 양귀비 재배 금지로 아편 생산이 줄었으나 이미 가뭄과 제재로 기근이 심했고, 1999년과 2000년 유엔 제재가 이어졌다. 1998년 8월 미국은 동아프리카 주재 미국 대사관 폭탄 공격에 대응해 아프가니스탄의 알카에다 훈련장에 순항 미사일을 쏘았다. 2001년 3월 바미얀의 대불 두 점을 폭파한 일은 세계에 충격을 주었다. 탈레반은 오사마 빈라덴과 알카에다가 아프가니스탄에서 활동하도록 허용했고 2001년 9월 9일 마수드가 암살되었다. 탈레반이 2001년 말 쫓겨나기 전까지 국토의 약 90%를 지배했다."
  subjects: [afghanistan, pakistan, usa]
  links: []
  tags: [politics, war, religion]
  sources: ["Ahmed Rashid, Taliban: Militant Islam, Oil and Fundamentalism in Central Asia (Yale University Press, 2000)", "Steve Coll, Ghost Wars: The Secret History of the CIA, Afghanistan, and Bin Laden, from the Soviet Invasion to September 10, 2001 (Penguin Press, 2004)", "Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)"]

- id: sco-csto-central-asia-1996
  year: 1996
  endYear: 2015
  title:
    ko: "상하이 협력 기구와 러시아·중국 사이의 중앙아시아(1996~2015)"
  summary:
    ko: "1996년 4월 26일 상하이에서 중국과 러시아, 카자흐스탄, 키르기스스탄, 타지키스탄이 국경 지역의 군사 신뢰 구축 협정을 맺어 '상하이 5국'이 시작되었고, 1997년 4월 모스크바에서 국경 부근 병력 감축 협정을 맺었다. 2001년 6월 15일 우즈베키스탄이 합류하며 상하이 협력 기구(SCO)가 출범했고 2002년 헌장을 채택해 테러·분리주의·극단주의 대응을 핵심 과제로 삼았다. 이 시기 중앙아시아는 러시아와 중국, 미국의 이해가 겹쳤는데, 미국은 2001년 아프가니스탄 전쟁을 계기로 우즈베키스탄 카르시하나바트(2001~2005)와 키르기스스탄 마나스(2001~2014)에 공군 기지를 두었다. 러시아는 1992년 타슈켄트에서 맺은 집단 안보 조약을 2002년 집단 안보 조약 기구(CSTO)로 바꾸고 2003년 키르기스스탄 칸트에 공군 기지를 두었으며, 우즈베키스탄은 이 조약에서 1999년 나갔다 2006년 돌아왔고 2012년 다시 떠났다. 2005년 안디잔 사건 뒤 우즈베키스탄이 미군 기지를 내보내고 러시아·중국과 가까워지자 SCO는 안보 협력의 틀로서 무게를 얻었다. 경제에서는 카자흐스탄·벨라루스·러시아가 2015년 1월 유라시아 경제 연합을 출범시켰고 키르기스스탄이 2015년 8월 합류했다. 중국은 카자흐스탄에서 시작해 중앙아시아를 가로지르는 송유관·가스관에 투자하고 2013년 '실크로드 경제 벨트'를 내놓으며 이 지역의 가장 큰 교역국이 되었다(「시진핑 체제의 출범과 일대일로(2012~2023)」(뒤의 사건)). 중앙아시아 나라들은 어느 한 강대국에 기울지 않도록 여러 기구와 협정을 함께 활용하는 외교를 폈다."
  subjects: [russia-fed, prc, kazakhstan, kyrgyzstan, tajikistan, uzbekistan, usa]
  links: []
  tags: [diplomacy, politics]
  sources: ["Alexander Cooley, Great Games, Local Rules: The New Great Power Contest in Central Asia (Oxford University Press, 2012)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)"]

- id: afghan-republic-war-2001
  year: 2001
  endYear: 2021
  title:
    ko: "미국의 아프가니스탄 전쟁과 이슬람 공화국(2001~2021)"
  summary:
    ko: "2001년 9월 11일 미국 본토 공격 뒤 탈레반이 알카에다 지도자 빈라덴의 인도를 거부하자 미국과 영국이 10월 7일 공습을 시작했고, 북부 동맹 지상군이 11월 13일 카불을 되찾았다. 12월 5일 독일 본에서 열린 회의에서 아프가니스탄 임시 행정부가 합의되어 하미드 카르자이가 12월 22일 의장(임시 행정부)으로 취임했고, 2002년 6월 긴급 로야 지르가에서 과도 대통령이 되었다. 새 헌법은 2004년 1월 4일 로야 지르가가 승인했으며, 10월 9일 대통령 선거에서 카르자이가 당선되어 12월 7일 취임했다. 국제 안보 지원군(ISAF)이 카불을 지키고 나토가 지방까지 책임지는 사이 탈레반은 파키스탄 국경 지대에서 반란을 키워 2006년 무렵부터 남부에서 세력을 되찾았다. 2009년 미국이 병력을 늘렸으나 2011년 5월 빈라덴이 파키스탄에서 죽은 뒤 철군이 본격화했고, 2014년 9월 29일 아슈라프 가니가 압둘라 압둘라와의 분쟁 끝에 대통령에 올라 연립 정부를 세웠다. 2014년 12월 ISAF가 끝나고 '확고한 지원' 임무로 바뀌었다. 부패와 마약 거래, 군 병력의 소모가 문제로 꼽혔다. 2020년 2월 29일 미국과 탈레반이 도하에서 미군 철수를 조건으로 협정을 맺었으나 아프가니스탄 정부는 협상 밖에 있었다. 2021년 8월 탈레반이 지방 도시를 잇달아 점령하고 8월 15일 카불에 들어갔으며 가니는 나라를 떠났고, 미군은 8월 30일 철수를 마쳤다. 전쟁으로 민간인 약 4만 6천 명을 포함해 17만 6천~21만 2천 명 이상(집계 기관마다 갈림)이 숨졌다. 2004년 헌법은 대통령제와 양원제 의회를 두고 하원 의석의 일부를 여성에게 배정했다. 같은 시기 아프가니스탄은 아편 양귀비의 세계 최대 재배지가 되어 반군의 자금원이 되었다."
  subjects: [afghanistan, usa, uk, pakistan]
  links: []
  tags: [war, politics]
  sources: ["Carter Malkasian, The American War in Afghanistan: A History (Oxford University Press, 2021)", "Ahmed Rashid, Descent into Chaos: The United States and the Failure of Nation Building in Pakistan, Afghanistan, and Central Asia (Viking, 2008)", "Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)"]

- id: kyrgyz-revolutions-2005
  year: 2005
  endYear: 2010
  title:
    ko: "키르기스스탄의 튤립 혁명과 2010년 혁명(2005~2010)"
  summary:
    ko: "아카예프 대통령 가족의 부패와 권력 세습 의혹으로 불만이 쌓인 가운데 2005년 2월 27일과 3월 13일 의회 선거에서 부정이 있었다는 항의가 남부 잘랄아바트와 오시에서 번졌다. 3월 24일 시위대가 수도 비슈케크의 대통령 관저를 점거하자 아카예프는 가족과 카자흐스탄을 거쳐 러시아로 떠났다(공식 사임서는 4월 초에 제출). 이시엔바이 카디르베코프가 3월 24~25일 대통령 직무 대행을 맡았고 쿠르만베크 바키예프가 총리 겸 대행이 되었으며, 7월 10일 대통령 선거에서 바키예프가 약 90%를 얻어 당선되어 취임했다(8월 14일 공식 취임). 러시아와 미국은 각각 칸트와 마나스에 공군 기지를 두고 이 사태를 주시했다. 이 일을 서구 언론은 '튤립 혁명'이라 불렀으나 이 이름을 쓰지 않고 3월 혁명 등으로 부르는 사람도 많다. 바키예프 정권도 부패와 가족 권력으로 비판받았고, 2010년 4월 6일 탈라스에서 시작된 시위가 4월 7일 비슈케크에서 총격으로 번져 80여 명이 죽었으며 바키예프는 남부로 갔다가 나라를 떠나 벨라루스로 망명했다(법적 사임은 4월 15일). 로자 오툰바예바가 4월 7일 과도 정부 수반이 되었다. 6월 10~14일 남부 오시와 잘랄아바트에서 키르기스인과 우즈베크인 사이에 폭력이 일어나 정부는 사망자를 약 470명으로 발표했고 독립 조사는 더 많았다고 보았으며 수십만 명이 피란했다. 6월 27일 국민 투표로 의원 내각제에 가까운 헌법을 승인했고, 오툰바예바는 2010년 7월 3일 과도 대통령에 취임했다. 알마즈벡 아탐바예프가 2011년 12월 1일 대통령이 되어 2017년 11월 24일까지 맡았다. 2010년 뒤에도 정치는 불안했다. 2020년 10월 의회 선거에 항의하는 시위가 일어나 제엔베코프 대통령이 10월 15일 사임했고, 사디르 자파로프와 탈란트 마미토프의 대행을 거쳐 자파로프가 2021년 1월 28일 대통령 자리에 올랐다."
  subjects: [kyrgyzstan, russia-fed, usa]
  links: []
  tags: [politics, society]
  sources: ["Sally N. Cummings (ed.), Domestic and International Perspectives on Kyrgyzstan's 'Tulip Revolution': Motives, Mobilization and Meanings (Routledge, 2009)", "Nick Megoran, Nationalism in Central Asia: A Biography of the Uzbekistan–Kyrgyzstan Boundary (University of Pittsburgh Press, 2017)", "Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)"]

- id: andijan-uzbekistan-2005
  year: 2005
  endYear: 2017
  title:
    ko: "안디잔 사건과 미르지요예프의 개혁(2005~2017)"
  summary:
    ko: "2004년 6월 우즈베키스탄 안디잔의 실업가 23명이 이슬람 극단주의 단체 아크로미야 활동 혐의로 체포되자 재판장 앞에서 항의가 커졌고, 2005년 5월 13일 새벽 무장한 사람들이 교도소를 습격해 피고와 수감자를 풀어 주고 주 청사를 점거했다. 오전 정부군이 바부르 광장에 모인 군중에게 총을 쏘았다. 정부는 사망자를 187명이라고 발표했고 외국 언론은 400~600명, 야당 지도자 무함마드 솔리흐는 1,000명 이상을 말했으며 인권 감시 기구는 비무장 시위대를 학살한 것이라고 결론 내렸다. 정부는 이를 이슬람 무장 세력의 폭동으로 규정하고 국제 조사를 거부했다. 유럽 연합은 2005년 10월 3일 무기 금수와 비자 제한을 결정했고, 우즈베키스탄은 카르시하나바트의 미국 공군 기지를 내보내며 러시아·중국에 기울었다. 카리모프는 2016년 9월 2일 죽었고(국영 매체 발표) 상원 의장 니그마틸라 율다셰프가 9월 2~8일 직무 대행을 하다가, 총리 샤브카트 미르지요예프가 9월 8일 대통령 직무 대행이 되어 12월 4일 선거에서 당선되었다(12월 14일 취임). 미르지요예프는 2017년 9월 외환 거래를 자유화했고 정치범 일부를 풀었으며 이웃 나라와 국경·교통 협력을 늘렸으나 정치 체제의 틀은 크게 바뀌지 않았다. 면화 수확에 학생과 공무원을 동원하는 강제 노동도 단계적으로 줄였다. 사건 직후 수백 명의 안디잔 주민이 국경을 넘어 키르기스스탄으로 피란했다. 독립적인 국제 조사는 끝내 이루어지지 않아 사망자의 정확한 수는 지금도 확인되지 않는다. 사건의 성격은 정부가 말하는 이슬람 무장 반란과 인권 단체가 말하는 평화 시위 학살로 갈린다."
  subjects: [uzbekistan, usa, russia-fed]
  links: []
  tags: [politics, society]
  sources: ["Adeeb Khalid, Central Asia: A New History from the Imperial Conquests to the Present (Princeton University Press, 2021)", "Human Rights Watch, Bullets Were Falling Like Rain: The Andijan Massacre, May 13, 2005 (2005)", "Alexander Cooley, Great Games, Local Rules: The New Great Power Contest in Central Asia (Oxford University Press, 2012)"]

- id: taliban-return-2021
  year: 2021
  endYear: 2026
  title:
    ko: "탈레반의 재집권과 이슬람 토후국(2021~)"
  summary:
    ko: "2021년 8월 15일 탈레반이 카불에 들어가고 아슈라프 가니 대통령이 나라를 떠나면서 이슬람 공화국이 무너졌다. 8월 26일 카불 공항 부근에서 이슬람 국가 호라산 지부의 자폭 공격으로 아프가니스탄 사람 170명 안팎과 미군 13명이 죽었고, 미군은 8월 30일 철수를 마쳤다. 9월 7일 탈레반은 하산 아쿤드를 총리 대행으로 하는 과도 정부를 발표했고 최고 지도자 하이바툴라 아쿤드자다가 모든 결정권을 쥐었다. 이 정부는 이름을 '아프가니스탄 이슬람 토후국'으로 되돌렸다. 판지시르 골짜기의 저항 세력은 9월에 꺾였으나 일부가 계속 싸웠다. 탈레반은 1996~2001년의 방식보다 부드러운 통치를 약속했지만 2022년 3월 중등학교 여학생 등교를 막았고 12월 20일 여성의 대학 교육을, 24일 비정부 기구의 여성 직원을 막았으며 공공장소에서 여성의 복장과 이동을 제한하는 포고령을 이어 냈다. 국제 사회는 이를 인권 침해로 보았고 어느 나라도 정식 승인을 서두르지 않았으며 미국은 해외에 있던 약 70억 달러의 아프가니스탄 중앙은행 자산을 동결했다. 외국 원조가 줄어 경제가 크게 무너져 인구의 절반 넘게 인도적 지원이 필요하다고 유엔은 밝혔다. 이슬람 국가 호라산 지부의 공격과 파키스탄과의 국경 충돌이 이어졌고, 중앙아시아 나라들은 안보와 교역을 이유로 탈레반 정부와 접촉했다. 탈레반 지도부는 샤리아에 따른 통치라고 설명하며 외부의 인권 비판에 반발한다. 2022년 6월 22일 동부 파크티카주 지진으로 1,000명 넘게 죽는 재해도 겹쳐 국제 원조 기관이 활동 규제 속에서 구호에 나서야 했다. 수십만 명의 아프가니스탄 사람이 이란과 파키스탄으로 다시 떠났고 파키스탄은 2023년부터 불법 체류자 송환을 늘렸다."
  subjects: [afghanistan, usa, pakistan]
  links: []
  tags: [politics, war, society]
  sources: ["Carter Malkasian, The American War in Afghanistan: A History (Oxford University Press, 2021)", "Thomas Barfield, Afghanistan: A Cultural and Political History (Princeton University Press, 2010)", "유엔 아프가니스탄 지원단(UNAMA), 인권 상황 보고서(2021~2024)"]

- id: kazakhstan-tokayev-2019
  year: 2019
  endYear: 2022
  title:
    ko: "카자흐스탄의 권력 이양과 1월 사태(2019~2022)"
  summary:
    ko: "1990년부터 나라를 이끈 대통령 누르술탄 나자르바예프는 2019년 3월 19일 사임을 발표했다. 상원 의장 카심조마르트 토카예프가 대통령 직무를 이어받았고 수도 아스타나는 나자르바예프를 기려 누르술탄으로 이름이 바뀌었다(2022년 9월 아스타나로 되돌림). 6월 9일 선거에서 토카예프가 약 70%로 당선되어 6월 12일 취임했으며 나자르바예프는 '엘바시(민족의 지도자)'로 안전 보장 회의 의장 자리를 유지했다. 2022년 1월 1일 액화 석유 가스 가격 상한이 풀려 값이 거의 두 배가 되자 2일 서부 망기스타우주의 자나오젠에서 시위가 일어나 알마티 등으로 번졌다. 1월 5일 토카예프는 비상사태를 선포하고 마민 정부를 사퇴시켰으며 나자르바예프를 안전 보장 회의 의장에서 물러나게 한 뒤 스스로 그 자리를 맡았다. 같은 날 알마티의 관청이 불타고 총격이 이어졌고, 6일 토카예프의 요청으로 러시아가 이끄는 집단 안보 조약 기구(CSTO) 병력 약 3,800명이 도착해 주요 시설을 지켰다. 7일 토카예프는 '경고 없이 쏘라'는 명령을 내렸다. 정부는 1월 19일 227명이 죽었다고(이후 집계 238명, 보안 요원 19명 포함) 밝혔고 수천 명이 구금되었으며 인권 단체는 구금자의 고문 의혹을 제기했다. 토카예프는 시위를 '테러와 도적떼'의 소행으로 규정했고 CSTO는 1월 13~20일 철수했다. 6월 5일 국민 투표에서 의회 권한을 키우는 개헌이 77.18%(투표율 68.06%) 찬성으로 승인되었고, 이어 대통령 임기를 7년 한 번으로 하는 개헌과 11월의 조기 대선에서 토카예프가 재선되었다. 알마티에서는 공항이 한때 시위대에 점거되고 약탈이 일어났다는 보도가 있었다."
