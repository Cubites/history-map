# 사하라 이남 아프리카 사건 8차 묶음(ssa-08): 냉전이 끝난 뒤 — 나미비아 독립·아파르트헤이트의 끝·소말릴란드와 에리트레아·르완다 집단 학살·콩고 전쟁·수단과 남수단·사헬과 뿔의 전쟁 (1990 ~ 2026년 기준)
# 범위: 나미비아의 독립, 만델라 석방과 첫 전 인종 선거, 소말리아 정부의 붕괴와 소말릴란드 독립 선언, 멩기스투 정권의 붕괴와 에리트레아의 독립, 소말리아 내전과 유엔 개입, 시에라리온·라이베리아 내전,
#   르완다 집단 학살, 제1·2차 콩고 전쟁, 에리트레아–에티오피아 전쟁, 아프리카 연합의 출범, 다르푸르 분쟁, 보코 하람의 봉기, 남수단의 독립과 내전, 말리 북부 반란, 서아프리카 에볼라 유행,
#   무가베의 퇴진, 티그라이 전쟁, 사헬의 쿠데타 연쇄, 수단 내전.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다. 끝나지 않은 일은 확인한 마지막 사실까지만 적었다 — 수단 내전(sudan-war-2023)은 2026년 9월까지의 사실이고 endYear 2026은 그 기준 해다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 이름만 바뀐 나라는 그때 이름으로 쓰고 항목 이름을 한 번 함께 적었다(자이르는 1997년부터 콩고 민주 공화국, 남서아프리카는 1990년부터 나미비아).
#   사망자·난민·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다. 르완다 집단 학살은 국제 형사 재판소가 판정한 대로 쓰고, 다르푸르·아자와드·소말릴란드·티그라이는 일어난 일과 숫자만 적었다.
# 지도 결정과의 관계: 소말릴란드는 독립 선언일 뿐 승인한 나라가 오래 없었다는 사실(결정 4)을 그대로 썼고, 아자와드의 독립 선언(2012)은 짧게 끝나 승인이 없었다고(결정 5) 적었다. 제2차 콩고 전쟁의 점령과 차드 북부 점령은 글로만 다뤘다.
#   에리트레아는 1993년 독립을 법적 시작으로 쓰고 1991~1992년의 사실상 독립을 글로 밝혔다. 신속지원군·SSC-카투모·보코 하람의 지배지는 글로만 적었다.
# 한국사와 닿는 점: 없음. 한국사 파일의 글은 고치지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(앙골라 내전·아파르트헤이트 법·샤프빌 학살·옛 이탈리아 식민지·에티오피아 혁명·르완다 혁명·콩고 위기·수단의 독립·아프리카 단결 기구의 창설·로디지아의 독립·소말릴란드 통합).
