- id: namibia-1990
  year: 1990
  endYear: 1990
  title:
    ko: "나미비아의 독립(1990)"
  summary:
    ko: "독일령 남서아프리카는 제1차 세계 대전 중인 1915년 남아프리카 연방군에 점령되었고, 1920년 국제 연맹의 위임 통치령이 되어 남아프리카가 다스렸다. 위임 통치 아래에서도 인종 분리 정책이 이어지자 유엔 총회는 1966년 위임의 종료를 선언했고, 1968년 이 땅을 나미비아라 부르기로 했으며, 1971년 국제 사법 재판소는 남아프리카의 계속된 통치가 불법이라는 권고 의견을 냈다. 남서아프리카 인민 기구(SWAPO)는 1966년 8월 26일 오무굴루그웸베 교전으로 무장 투쟁을 시작했고, 이 싸움은 앙골라 내전과 얽혀 이어졌다(「앙골라 내전과 쿠이토 쿠아나발레 전투(1975~1988)」(앞의 사건)). 1978년 안전 보장 이사회 결의 435호가 남아프리카군 철수와 유엔 감독 아래의 선거를 정했으나 이행은 미뤄졌고, 1988년 12월 22일 뉴욕에서 앙골라·쿠바·남아프리카 공화국이 협정에 서명하면서 쿠바군의 앙골라 철수와 나미비아 독립 절차가 맞물렸다. 결의 435호의 이행은 1989년 4월 1일 시작되었으나 그날 SWAPO 무장대의 국경 침투 보고와 함께 교전이 벌어져 게릴라 최소 263명과 남아프리카 쪽 27명이 숨졌고, 4월 말 새 합의로 가라앉았다. 유엔 나미비아 독립 지원단(UNTAG)이 감독한 제헌 의회 선거는 1989년 11월 7~11일 치러져 투표율 약 97%, SWAPO 득표율 약 57%였는데, 헌법을 혼자 정할 수 있는 3분의 2에는 못 미쳤다. 제헌 의회는 1990년 2월 9일 헌법을 채택했고, 1990년 3월 21일 남서아프리카가 나미비아 공화국으로 독립하며 샘 누조마가 초대 대통령이 되었다. 항구 월비스베이는 남아프리카가 계속 쥐고 있다가 1994년 3월 1일 나미비아에 넘겼다."
  subjects: [south-west-africa, namibia, south-africa, angola]
  links:
    - { from: south-africa, to: namibia, note: "위임 통치를 끝내고 독립을 넘김 (1990-03-21)" }
  tags: [politics, diplomacy]
  sources: ["Colin Leys and John S. Saul (eds.), Namibia's Liberation Struggle: The Two-Edged Sword (James Currey, 1995)", "Leonard Thompson, A History of South Africa (4th ed., Yale University Press, 2014)", "Martin Meredith, The Fate of Africa: From the Hopes of Freedom to the Heart of Despair (PublicAffairs, 2005)"]

- id: mandela-release-1990
  year: 1990
  endYear: 1994
  title:
    ko: "만델라 석방과 아파르트헤이트의 끝, 첫 전 인종 선거(1990~1994)"
  summary:
    ko: "국민당 정부가 세운 아파르트헤이트 법(「국민당 정부와 아파르트헤이트 법(1948~1953)」(앞의 사건))과 샤프빌 이후의 탄압(「샤프빌 학살과 리보니아 재판(1960~1964)」(앞의 사건))은 1980년대 말 국제 제재와 저항 속에서 한계에 몰렸다. 1989년 8월 피터르 빌럼 보타가 물러나고 프레데리크 빌럼 더클레르크가 국가 원수 대행을 거쳐 9월 20일 국가 원수로 뽑혔다. 더클레르크는 1990년 2월 2일 의회 연설에서 아프리카 국민회의 등 해방 운동 단체의 금지를 풀고 정치범 석방을 밝혔고, 1990년 2월 11일 넬슨 만델라가 27년 만에 풀려났다. 1991년에는 인구 등록법과 집단 지구법 등 아파르트헤이트의 뼈대 법이 폐지되었고, 정부와 아프리카 국민회의 등이 참여한 민주 남아프리카 회의(CODESA)가 협상을 이끌었다. 협상 중에도 폭력은 이어져 1992년 6월 17일 보이파통에서 45명이 숨졌다. 1992년 3월 17일 백인 유권자만 참여한 국민 투표에서 3분의 2가 넘는 찬성이 협상 계속을 승인했고, 1993년 12월 10일 만델라와 더클레르크는 노벨 평화상을 함께 받았다. 1994년 4월 26~29일 첫 전 인종 선거에서 아프리카 국민회의는 62.65%(400석 가운데 252석), 국민당은 20.39%(82석), 인카타 자유당은 10.54%(43석)를 얻었다. 임시 헌법에 따른 거국 정부에서 만델라가 대통령(1994년 5월 10일 취임)이 되고 더클레르크와 타보 음베키가 부통령을 맡았으며, 형식상 독립국이던 트란스케이 등 반투스탄도 남아프리카 공화국에 다시 합쳐졌다. 국민당은 1996년 5월 9일 탈퇴를 밝혀 6월 30일 거국 정부에서 빠졌고, 진실과 화해 위원회가 1996년부터 인권 침해를 조사해 일부 가해자에게 사면을 주었다."
  subjects: [south-africa]
  links: []
  tags: [politics, society]
  sources: ["Nelson Mandela, Long Walk to Freedom: The Autobiography of Nelson Mandela (Little, Brown, 1994)", "Leonard Thompson, A History of South Africa (4th ed., Yale University Press, 2014)", "Allister Sparks, Tomorrow Is Another Country: The Inside Story of South Africa's Road to Change (Heinemann, 1995)"]

- id: somaliland-1991
  year: 1991
  endYear: 1991
  title:
    ko: "소말리아 정부의 붕괴와 소말릴란드 독립 선언(1991)"
  summary:
    ko: "영국령 소말릴란드는 1960년 6월 26일 독립했다가 닷새 뒤 신탁 통치령이던 옛 이탈리아령 소말리아와 합쳐 소말리아가 되었다(「소말릴란드와 소말리아 신탁 통치령의 독립과 통합(1960)」(앞의 사건)). 1969년 쿠데타로 집권한 시아드 바레의 정권이 북서부의 이사크 씨족을 억누르자 1981년 소말리 민족 운동(SNM)이 세워졌다. SNM은 1988년 5월 27일 부라오를 차지하고 하르게이사에 들어가(자료에 따라 29일 또는 31일) 6월 1일 무렵 공항을 뺀 대부분을 쥐었으나, 정권은 두 도시를 폭격과 포격으로 되받아쳤고, 이사크 민간인 사망은 5만~20만 명 안팎으로 추산이 갈리며 약 40만 명이 에티오피아로 피란했다. 남쪽에서는 씨족 무장 세력들이 바레를 몰아내 바레가 1991년 1월 26일 모가디슈를 떠났고, 중앙 정부는 사라졌다. SNM과 북부 씨족 원로들은 1991년 4월 27일부터 5월 15일까지 부라오에서 회의를 열어 북서부의 분리를 정했고, 1991년 5월 18일 아브디라흐만 투르가 이끄는 이 정부가 소말리아로부터 독립을 선언했다. 그 뒤 오랫동안 이 선언을 승인한 나라가 없어 국제법상 소말리아의 영토로 다뤄졌다. 1993년 보라마 대회의가 무함마드 하지 이브라힘 에갈을 대통령으로 뽑았고 에갈은 1997년 다시 선출되어 2002년 5월 3일 죽을 때까지 자리를 지켰다. 2001년 5월 31일 국민 투표에서 97.1%가 헌법에 찬성했다. 2023년에는 동부 라스아노드 일대가 소말릴란드 정부를 벗어나 SSC-카투모 행정부 아래 놓였고, 2025년 12월 26일 이스라엘이 유엔 회원국으로는 처음으로 소말릴란드를 공식 승인했다."
  subjects: [somalia, somaliland]
  links: []
  tags: [politics, war]
  sources: ["Mark Bradbury, Becoming Somaliland (James Currey, 2008)", "I. M. Lewis, A Modern History of the Somali: Nation and State in the Horn of Africa (4th ed., James Currey, 2002)", "Gérard Prunier, Africa's World War: Congo, the Rwandan Genocide, and the Making of a Continental Catastrophe (Oxford University Press, 2009)"]

- id: derg-fall-eritrea-1991
  year: 1991
  endYear: 1993
  title:
    ko: "멩기스투 정권의 붕괴와 에리트레아의 독립(1991~1993)"
  summary:
    ko: "에티오피아에서는 1974년 하일레 셀라시에 황제가 군부에 폐위된 뒤 데르그가 집권했고, 1977년 2월 3일 멩기스투 하일레 마리암이 의장이 되어(「에티오피아 혁명과 데르그(1974~1977)」(앞의 사건)) 1976~1978년 붉은 테러로 3만~75만 명이 숨졌다는 추산이 나온다. 멩기스투는 1987년 9월 10일 새 헌법으로 에티오피아 인민 민주 공화국의 대통령이 되었다. 에리트레아는 1952년 연방으로 에티오피아와 합쳐졌다가 1962년 병합되었고(「옛 이탈리아 식민지: 소말리아 신탁 통치와 에리트레아 연방, 병합(1949~1962)」(앞의 사건)), 1961년 9월 1일 하미드 이드리스 아와테가 시작한 독립 전쟁은 훗날 에리트레아 인민 해방 전선(EPLF)이 이끌었다. EPLF와 연합한 티그라이 인민 해방 전선이 에티오피아 인민 혁명 민주 전선(EPRDF)을 이끌고 진격하자 멩기스투는 1991년 5월 21일 에티오피아를 떠나 짐바브웨에 망명했고 부통령이 대행했다. EPLF는 5월 24일 아스마라에 들어갔고 EPRDF는 5월 28일 아디스아바바에 들어갔다. 1991년 7월 1~5일 아디스아바바 회의에서 EPRDF 중심의 과도 정부가 서고 멜레스 제나위가 과도 대통령이 되었으며, 참관인으로 온 EPLF는 에리트레아인이 국민 투표로 독립을 정할 권리를 인정받았다. 1993년 4월 국민 투표에서 99.83%(찬성 1,100,260표·반대 1,822표, 투표율 98.52%)가 독립에 찬성했고, 1993년 5월 24일 독립을 선포한 에리트레아는 5월 28일 유엔에 가입했다. 이사이아스 아페웨르키가 이끄는 EPLF가 새 나라를 맡았고, 에티오피아는 1995년 연방 민주 공화국이 되었다."
  subjects: [ethiopia, eritrea]
  links:
    - { from: ethiopia, to: eritrea, note: "국민 투표 결과를 받아들여 독립을 인정 (1993)" }
  tags: [politics, war]
  sources: ["Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)", "Martin Plaut, Understanding Eritrea: Inside Africa's Most Repressive State (Hurst, 2016)"]

- id: sierra-leone-liberia-wars-1991
  year: 1991
  endYear: 2003
  title:
    ko: "시에라리온·라이베리아 내전(1991~2003)"
  summary:
    ko: "라이베리아에서는 1989년 12월 24일 찰스 테일러의 라이베리아 국민 애국 전선(NPFL)이 코트디부아르에서 니므바 군으로 들어와 새뮤얼 도 정권에 맞섰다. 도는 1990년 9월 9일 프린스 존슨의 부대에 잡혀 숨졌고, 서아프리카 경제 공동체(ECOWAS)의 평화 유지군 ECOMOG은 나이지리아 중심의 약 4천 명으로 8월 몬로비아에 상륙했다. 첫 내전의 사망자는 약 20만 명이라는 집계가 있고, 1997년 7월 선거에서 테일러가 약 75%를 얻어 8월 2일 정권을 넘겨받았다. 시에라리온에서는 1991년 3월 23일 포데이 상코의 혁명연합전선(RUF)이 테일러 쪽 지원을 받아 라이베리아 국경을 넘어 반란을 일으켰다. 1992년 4월 29일 청년 장교들이 쿠데타로 집권해 발렌틴 스트래서가 이끌었고(1996년 1월 다시 쿠데타로 쫓겨나 줄리어스 마다 비오가 3월까지 이었다), 1995년 3월 남아프리카의 민간 군사 회사 이그제큐티브 아웃컴스가 반군을 밀어냈다. 1996년 선거에서 아흐마드 테잔 카바가 대통령이 되고 11월 30일 아비장 평화 협정이 맺어졌으나 1997년 3월 무렵 무너졌으며, 1997년 5월 25일 조니 폴 코로마 소령이 쿠데타로 군사 평의회를 세웠다. ECOMOG이 1998년 2월 12일 프리타운에서 군사 평의회를 몰아냈고 카바가 3월 10일 돌아와 복귀했고 1999년 7월 7일 로메 평화 협정으로 상코가 사면과 부통령직을 얻었다. 2000년 5월 반군이 유엔 평화 유지군 500명 넘게 붙잡고 프리타운으로 향하자 영국군이 팔리서 작전으로 사태를 안정시켰고, 카바는 2002년 1월 18일 전쟁 종결을 선언했다. 시에라리온 내전의 사망자는 5만~7만 명, 피란민은 약 250만 명이다. 라이베리아에서는 1999년 4월 기니에서 들어온 반 테일러 세력의 두 번째 내전이 2003년 8월 테일러가 사임해 나이지리아로 떠나고 8월 18일 아크라 포괄적 평화 협정이 맺어지며 끝났고, 1989~2003년 라이베리아 내전의 사망자는 25만 명이 넘는다. 시에라리온 특별 재판소는 테일러에게 2012년 징역 50년을 선고했다."
  subjects: [sierra-leone, liberia, nigeria]
  links: []
  tags: [war, politics]
  sources: ["Stephen Ellis, The Mask of Anarchy: The Destruction of Liberia and the Religious Dimension of an African Civil War (Hurst, 1999)", "Lansana Gberie, A Dirty War in West Africa: The RUF and the Destruction of Sierra Leone (Hurst, 2005)", "Martin Meredith, The Fate of Africa: From the Hopes of Freedom to the Heart of Despair (PublicAffairs, 2005)"]

- id: somalia-intervention-1992
  year: 1992
  endYear: 1995
  title:
    ko: "소말리아 내전과 유엔 개입(1992~1995)"
  summary:
    ko: "시아드 바레가 1991년 1월 모가디슈를 떠난 뒤 소말리아에는 중앙 정부가 사라졌다(「소말리아 정부의 붕괴와 소말릴란드 독립 선언(1991)」(앞의 사건)). 통합 소말리아 의회 안에서 알리 마흐디 무함마드와 무함마드 파라 아이디드의 세력이 모가디슈를 갈라 싸웠고, 내전과 가뭄이 겹친 1991~1992년 기근으로 간접 사망이 20만~30만 명에 이른다고 추산한다. 유엔은 1992년 4월 소말리아 활동단(UNOSOM I)을 만들어 7월 정전 감시단을 보냈고, 8월 구호 수송을 시작했으며, 12월 9일 미국 해병대가 상륙한 희망 회복 작전으로(해병 약 1만 7천 8백 명과 육군 보병 약 1만 명이 투입되었다) 미군 주도 통합 기동대(UNITAF)가 구호 길을 열었다. 1993년 3월 UNOSOM II가 임무를 넘겨받으며 권한을 넓혔고, 6월 5일 모가디슈 라디오 방송국 부근에서 파키스탄군 24명이 숨지자 유엔은 책임자의 체포를 요구했다. 7월 12일에는 미군 헬리콥터가 씨족 원로 회의장을 공격해 소말리 쪽 54명이 숨졌다고 적십자가 밝혔고(소말리 쪽 주장은 더 많다), 8월 8일 폭탄으로 미군 4명이 숨졌다. 1993년 10월 3~4일 미군 특수 부대가 아이디드 쪽 간부를 붙잡으려다 헬리콥터 3대가 격추되며 큰 전투가 벌어졌다. 미군은 18명이 숨지고 73~84명이 다쳤으며 말레이시아군도 1명이 숨졌고, 소말리 쪽 사망은 133~700명으로 추산이 갈린다(국제 적십자는 200명 사망·700명 부상). 이 전투 뒤 미국은 철수를 정해 1994년 3월까지 군을 뺐고, 유엔군도 1995년 초 모두 떠났다. 중앙 정부는 되살아나지 못했고, 1998년 북동부에 푼틀란드가 자치 정부를 세웠으며 2000년 8월에야 과도 국민 정부가 압디카심 살라드 하산을 대통령으로 세웠다."
  subjects: [somalia, usa]
  links: []
  tags: [war, politics]
  places: [{ name: 모가디슈 전투, at: [45.33, 2.04], year: 1993 }]
  sources: ["Mark Bowden, Black Hawk Down: A Story of Modern War (Atlantic Monthly Press, 1999)", "Walter Clarke and Jeffrey Herbst (eds.), Learning from Somalia: The Lessons of Armed Humanitarian Intervention (Westview Press, 1997)", "I. M. Lewis, A Modern History of the Somali: Nation and State in the Horn of Africa (4th ed., James Currey, 2002)"]

- id: rwanda-genocide-1994
  year: 1994
  endYear: 1994
  title:
    ko: "르완다 집단 학살(1994)"
  summary:
    ko: "르완다는 1962년 독립한 뒤(「르완다 혁명과 르완다·부룬디의 독립(1959~1962)」(앞의 사건)) 후투 중심 정권 아래서 투치가 차별받았고 많은 투치가 이웃 우간다로 피란했다. 우간다에서 자란 투치 망명자들의 르완다 애국 전선(RPF)이 1990년 10월 1일 국경을 넘어 쥐베날 하비아리마나 정권을 공격했고, 내전 끝에 1993년 8월 4일 탄자니아 아루샤에서 협정이 맺어졌다. 1994년 4월 6일 하비아리마나 대통령과 부룬디의 시프리앵 은타랴미라 대통령이 탄 비행기가 격추되어 두 사람이 숨졌고, 이튿날부터 후투 강경파가 장악한 임시 정부와 군, 인테라함웨 같은 민병대가 투치와 온건 후투를 조직적으로 죽이기 시작했다. 학살은 4월 7일부터 7월 중순(자료에 따라 15일 또는 19일)까지 약 100일 이어져 사망자가 52만~70만 명(투치 50만~66만 명, 트와 약 1만 명, 온건 후투 1만~3만 명)으로 추산되는데, 르완다 정부는 107만 명을 주장하고 인권 감시 기구(휴먼 라이츠 워치)는 약 50만 7천 명을 추산한다. 투치 여성 25만~50만 명이 강간을 당했다는 추산도 있다. RPF는 7월 4일 키갈리를 차지하고 7월 18일 북서부 기세니를 장악해 이튿날 학살을 끝냈다. 보복을 두려워한 후투 약 200만 명이 이웃 나라, 특히 자이르(1997년부터 콩고 민주 공화국)로 피란했고 이 피란민 진영은 「제1·2차 콩고 전쟁(1996~2003)」(뒤의 사건)의 불씨가 되었다. 유엔은 1994년 11월 결의 955호로 르완다 국제 형사 재판소를 세웠고, 이 재판소는 1998년 9월 2일 장폴 아카예수 사건에서 국제 법정 최초로 집단 학살죄를 인정했다. 파스퇴르 비지문구가 대통령을 맡았다가 2000년 물러나자 RPF 사령관 출신인 부통령 폴 카가메가 대통령이 되었다."
  subjects: [rwanda, burundi, uganda, dr-congo]
  links: []
  tags: [war, society]
  sources: ["Gérard Prunier, The Rwanda Crisis: History of a Genocide (Columbia University Press, 1995)", "Alison Des Forges, Leave None to Tell the Story: Genocide in Rwanda (Human Rights Watch, 1999)", "Scott Straus, The Order of Genocide: Race, Power, and War in Rwanda (Cornell University Press, 2006)"]

- id: congo-wars-1996
  year: 1996
  endYear: 2003
  title:
    ko: "제1·2차 콩고 전쟁(1996~2003)"
  summary:
    ko: "모부투 세세 세코는 1965년 쿠데타로 권력을 잡아(「콩고의 독립과 콩고 위기(1960~1965)」(앞의 사건)) 1971년 나라 이름을 자이르로 바꾸고 30년 넘게 다스렸다. 르완다 집단 학살 뒤(「르완다 집단 학살(1994)」(앞의 사건)) 자이르 동부로 넘어온 후투 피란민 진영에 학살 가담 민병대가 섞이자 르완다는 이를 위협으로 보았고, 1996년 9월 동부에서 바니아물렝게 반란이 일어났다. 10월 18일 로랑데지레 카빌라를 대변인으로 하는 콩고-자이르 해방 민주 세력 동맹(AFDL)이 만들어졌고, 르완다·우간다·앙골라의 지원을 받은 이 동맹이 1997년 2월부터 5월까지 자이르를 차지했다. 모부투는 5월 16일 나라를 떠났고 카빌라는 5월 17일 스스로 대통령에 올라 나라 이름을 콩고 민주 공화국으로 바꾸었으며 5월 29일 취임했다. 카빌라가 1998년 7월 27일 르완다군에 철수를 명령하고 8월 2일 동부에서 반란이 터지며 제2차 전쟁이 시작되었다. 르완다와 우간다가 반군을 돕고 부룬디도 군을 보냈으며, 짐바브웨와 앙골라, 나미비아, 차드가 카빌라 정부를 도왔다. 우간다가 밀어 준 장피에르 벰바의 콩고 해방 운동이 9월 30일 만들어졌고, 반군과 르완다·우간다군은 동부와 북부의 넓은 땅을 차지한 채 전선이 굳어졌다. 1999년 7~8월 루사카 평화 협정이 맺어졌으나 싸움은 이어졌고, 2001년 1월 16일 카빌라가 집무실에서 경호원의 총에 숨져 아들 조제프 카빌라(당시 29세)가 뒤를 이었다. 2002년 르완다(프리토리아 협정)와 우간다(루안다 협정)가 군을 빼기로 했고, 12월 17일 전면 포괄 합의와 2003년 4월 2일 선 시티에서의 콩고 내 대화 최종 의정서를 거쳐 2003년 7월 18일 과도 정부가 서면서 전쟁이 공식으로 끝났다. 이 전쟁에는 아홉 나라와 약 스물다섯 무장 집단이 얽혔다. 국제 구호 위원회(IRC)는 1998~2007년 초과 사망을 540만 명 넘게 추산했으나 방법을 둘러싼 논쟁이 있고, 직접 폭력 사망만 보면 1998~2001년 35만 명 넘는다고 한다."
  subjects: [dr-congo, rwanda, uganda, burundi, angola, zimbabwe]
  links: []
  tags: [war, politics]
  sources: ["Gérard Prunier, Africa's World War: Congo, the Rwandan Genocide, and the Making of a Continental Catastrophe (Oxford University Press, 2009)", "Thomas Turner, The Congo Wars: Conflict, Myth and Reality (Zed Books, 2007)", "John F. Clark (ed.), The African Stakes of the Congo War (Palgrave Macmillan, 2002)"]

- id: eritrea-ethiopia-war-1998
  year: 1998
  endYear: 2018
  title:
    ko: "에리트레아–에티오피아 전쟁과 국경 분쟁(1998~2018)"
  summary:
    ko: "1993년 독립한 에리트레아(「멩기스투 정권의 붕괴와 에리트레아의 독립(1991~1993)」(앞의 사건))와 에티오피아는 국경, 특히 바드메 일대의 귀속을 두고 다투다가 1998년 5월 6일 에리트레아군이 바드메에 들어가면서 전쟁이 시작되었다. 에티오피아 의회는 5월 13일 전쟁을 선포했고, 1999년 2월 22일 선셋 작전으로 바드메를 되찾으려 했으며 2000년 5월 12일 전선 여러 곳에서 대공세를 벌였다. 유엔 안전 보장 이사회는 2000년 5월 17일 결의 1298호로 두 나라에 무기 금수를 걸었고 에티오피아는 25일 전쟁이 끝났다고 선언했다. 2000년 6월 18일 합의에 이르렀고 7월 31일 결의 1312호로 유엔 에리트레아·에티오피아 임무단(UNMEE)이 폭 25km의 임시 안전 지대를 맡았으며, 12월 12일 알제 협정이 서명되어 국경 확정을 구속력 있는 중재에 맡겼다. 국경 위원회는 2002년 4월 13일(또는 14일) 바드메를 에리트레아에 속한다고 결정했으나 에티오피아가 이행하지 않아 전쟁도 평화도 아닌 상태가 이어졌다. 전쟁의 사망자는 합쳐서 7만~30만 명으로 추산이 크게 갈리고(국제 위기 그룹은 7만~10만 명, 에리트레아 1만 9천~5만 명·에티오피아 3만 4천~6만 명), 약 60만~65만 명이 집을 잃었다. 2018년 4월 2일 아비 아머드가 에티오피아 총리로 뽑혔고 6월 5일 집권 연합이 알제 협정의 전면 이행을 받아들였으며, 7월 에리트레아의 이사이아스 아페웨르키와의 정상 회담에서 두 나라는 전쟁 상태를 끝냈다고 선언했다. 아비 아머드는 이 공로로 2019년 노벨 평화상을 받았다. 에티오피아의 총리는 이 사이에 멜레스 제나위(1995~2012년)와 하일레마리암 데살레뉴(2012~2018년)를 거쳤다."
  subjects: [eritrea, ethiopia]
  links: []
  tags: [war, diplomacy]
  sources: ["Tekeste Negash and Kjetil Tronvoll, Brothers at War: Making Sense of the Eritrean-Ethiopian War (James Currey, 2000)", "Martin Plaut, Understanding Eritrea: Inside Africa's Most Repressive State (Hurst, 2016)", "Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)"]

- id: african-union-2002
  year: 2002
  endYear: 2002
  title:
    ko: "아프리카 연합의 출범(2002)"
  summary:
    ko: "아프리카 단결 기구(OAU)는 1963년 5월 25일 아디스아바바에서 32개 나라 정부가 서명해 만들어졌다(「아프리카 단결 기구의 창설(1963)」(앞의 사건)). 1990년대 말 리비아의 무아마르 카다피가 더 긴밀한 연합을 내세웠고, 1999년 9월 9일 리비아 시르트에서 OAU 정상들이 연합 창설을 요구하는 시르트 선언을 냈다. 2000년 로메 정상 회의에서 아프리카 연합 설립 규약이 채택되었고 2001년 루사카에서 이행 계획이 마련되었다. 아프리카 연합(AU)은 2002년 7월 9일 남아프리카 공화국 더반에서 첫 총회를 열며 출범했고 초대 의장은 남아프리카 대통령 타보 음베키였고 임기는 1년이었다. OAU는 같은 날 해체되었고 그때 회원국은 53개였다. OAU가 식민 지배의 종식과 기존 국경의 존중에 무게를 두었고 1990년대 르완다 학살 같은 대량 폭력에 손을 쓰지 못했다는 비판이 개편의 배경이었다. 연합 위원회의 첫 위원장은 알파 우마르 코나레(2003년 선출)였다. 본부는 에티오피아의 아디스아바바에 있고, 집행 기관인 위원회도 이곳에 둔다. OAU가 내정 불간섭을 앞세웠던 데 견주어 AU 설립 규약은 집단 학살 같은 중대한 범죄가 벌어질 때 총회의 결정으로 회원국에 개입할 권리를 두었다. 정상 회의 옆에서 2001년 출범한 아프리카 개발을 위한 새 동반자 관계(NEPAD)가 함께 움직였고, 평화 안보 이사회가 분쟁에 대응하는 기구로 세워졌다. 지금 회원국은 55개이며 모로코가 2017년 1월 31일 다시 가입했다. 쿠데타로 집권한 정부의 회원 자격은 정지되어 말리·부르키나파소·니제르·수단 등이 정지 명단에 올라 있다."
  subjects: [south-africa, ethiopia, libya]
  links: []
  tags: [diplomacy, politics]
  sources: ["Tim Murithi, The African Union: Pan-Africanism, Peacebuilding and Development (Ashgate, 2005)", "John Iliffe, Africans: The History of a Continent (2nd ed., Cambridge University Press, 2007)", "Martin Meredith, The Fate of Africa: From the Hopes of Freedom to the Heart of Despair (PublicAffairs, 2005)"]

- id: darfur-2003
  year: 2003
  endYear: 2020
  title:
    ko: "다르푸르 분쟁(2003~2020)"
  summary:
    ko: "수단 서부 다르푸르에서는 물과 땅을 둘러싼 유목민과 푸르·자그하와·마살리트 등 농경민의 갈등에 중앙 정부의 정책이 겹쳐 있었다. 정부는 1990년대 후반(1996~1999년) 마살리트와 아랍계 유목민의 충돌에 쓴 아랍계 민병대를 다시 불러냈고 이들이 잔자위드로 불렸다. 푸르와 자그하와 집단은 2001년 7월 21일 아부 감라에서 모임을 갖고 저항을 논의했고(플린트와 데 발의 서술), 2003년 2월 26일 다르푸르 해방 전선이 골로를 공격했다. 이 조직은 수단 해방 운동/군(SLM/A)이 되었고 정의평등운동(JEM)과 함께 4월 25일 엘파시르 공항을 습격해 정부 집계로 군인과 기술자 75명을 죽이고 32명을 붙잡았다. 정부군은 폭격과 잔자위드의 마을 공격으로 맞섰다. 2004년 4월 차드의 중재로 은자메나 인도적 정전 협정이 맺어졌고, 미국 국무 장관 콜린 파월은 9월 이 사태를 집단 학살 또는 그에 해당하는 행위라고 불렀다. 2006년 5월 5일 정부와 미니 미나위의 SLA 분파가 다르푸르 평화 협정에 서명했으나 JEM과 압둘 와히드 알누르 분파는 거부했다. 2007년 7월 31일 결의 1769호로 아프리카 연합·유엔 합동 임무단(UNAMID)이 승인되었다. 국제 형사 재판소(ICC)는 2007년 4월 27일 아마드 하룬과 알리 쿠샤이브에 대한 체포 영장을 냈고, 오마르 알바시르에게 2009년 3월 4일 전쟁 범죄·반인도 범죄 혐의로, 2010년 7월 12일 집단 학살 혐의 세 건을 더해 체포 영장을 냈다. 사망자는 유엔 추산 약 30만 명, 수단 정부 발표 약 1만 명, 그 밖의 추산 20만~40만 명으로 갈리고, 집을 잃은 사람은 유엔 추산 285만~300만 명이다. 알바시르는 2019년 4월 11일 군에 쫓겨났고 2020년 10월 3일 주바에서 정부와 여러 반군이 평화 협정에 서명했으나, 2023년 내전으로 다르푸르에서 다시 큰 폭력이 일었다(「수단 내전(2023~)」(뒤의 사건))."
  subjects: [sudan, chad]
  links: []
  tags: [war, society]
  sources: ["Julie Flint and Alex de Waal, Darfur: A New History of a Long War (Zed Books, 2008)", "Gérard Prunier, Darfur: The Ambiguous Genocide (Cornell University Press, 2005)", "Alex de Waal, The Real Politics of the Horn of Africa: Money, War and the Business of Power (Polity, 2015)"]

- id: boko-haram-2009
  year: 2009
  endYear: 2017
  title:
    ko: "보코 하람의 봉기(2009~2017)"
  summary:
    ko: "무함마드 유수프가 2002년 나이지리아 북동부 마이두구리에서 세운 이슬람 운동은 서양식 교육을 거부했고, 주민들은 이를 서양식 교육은 금지라는 뜻의 보코 하람이라 불렀다. 2009년 7월 26일 시작된 유수프의 봉기는 실패했고 유수프는 정부 쪽의 손에 숨졌다. 뒤이어 아부바카르 셰카우가 사실상 이끌게 된 조직은 경찰서·교회·학교를 공격하는 무장 조직으로 바뀌었고 2011년 8월 26일에는 아부자의 유엔 건물에 폭탄 테러를 일으켰다. 나이지리아 정부는 2013년 5월 보르노·요베·아다마와 주에 비상사태를 선포했다. 2014년 4월 14일 보르노 주 치복에서 여학생 276명이 납치되어 세계의 관심을 끌었는데 그 가운데 57명은 곧 달아났다. 2014년 한 해의 사망자는 10,849명에 이르렀고 북동부 일부가 조직의 통제에 놓였다. 2015년 3월 셰카우가 이슬람 국가(IS)에 충성을 밝혀 조직은 이슬람 국가 서아프리카 지부(ISWAP)가 되었다. 같은 해 3월 28일 치른 대통령 선거에서 무함마두 부하리가 야당 후보로 당선되었고, 나이지리아·니제르·차드·카메룬 등이 다국적 합동군(MNJTF, 약 7천 5백 명)을 꾸려 반격하면서 싸움이 이웃 나라로 번졌다. 조직의 활동은 카메룬·차드·니제르로 퍼졌고 2022년부터 베냉에서도 존재가 보고되었다. 2016년 조직은 ISWAP 쪽과 셰카우 쪽으로 갈라졌다. 직접 사망은 약 3만 5천 명, 간접 사망까지 합치면 약 35만 명으로 추산되고 약 240만 명이 집을 떠났다. 셰카우는 2021년 5월 19일 ISWAP과의 싸움에서 자폭해 숨졌고, 이 분쟁은 2017년 이후에도 이어졌다."
  subjects: [nigeria, niger, chad, cameroon]
  links: []
  tags: [war, religion]
  sources: ["Alexander Thurston, Boko Haram: The History of an African Jihadist Movement (Princeton University Press, 2018)", "Alex Thurston, Jihadists of North Africa and the Sahel: Local Politics and Rebel Groups (Cambridge University Press, 2020)", "Martin Meredith, The Fate of Africa: From the Hopes of Freedom to the Heart of Despair (PublicAffairs, 2005)"]

- id: south-sudan-2011
  year: 2011
  endYear: 2011
  title:
    ko: "남수단의 독립(2011)"
  summary:
    ko: "수단은 1956년 독립한 직후부터(「수단의 독립(1953~1956)」(앞의 사건)) 아랍 이슬람 문화가 중심인 북부와 비아랍·기독교·전통 신앙이 많은 남부 사이의 갈등을 안았다. 1955년부터 1972년까지 첫 내전이 이어졌고 1972년 아디스아바바 협정으로 남부가 자치를 얻었으나, 1983년 가파르 니메이리가 이슬람법을 전국에 적용하자 존 가랑이 이끄는 수단 인민 해방 운동/군(SPLM/A)이 봉기하며 제2차 수단 내전(1983~2005)이 시작되었다. 이 내전의 사망자는 추산이 갈리지만 100만 명을 넘는다고 본다. 2005년 1월 9일 포괄적 평화 협정이 서명되어 남부에 6년의 자치를 주고 끝에 독립 여부를 묻는 주민 투표를 하기로 했다. 가랑은 그해 7월 30일 숨졌고 살바 키르가 뒤를 이었다. 2011년 1월 9~15일 남부 주민 투표에서 분리 독립에 3,792,518표(98.83%), 통일에 44,888표(1.17%)가 나왔고(등록 유권자 3,947,676명 가운데 투표율 97.58%), 2월 7일 결과가 발표되었다. 2011년 7월 9일 남수단 공화국이 독립해 키르가 초대 대통령이 되었고 유엔은 7월 14일 이 나라를 193번째 회원국으로 받아들였다. 아비에이 지역의 귀속을 묻는 투표는 경계와 거주 자격 논쟁으로 열리지 못했고 수단군이 2011년 5월 21일 아비에이를 차지했다. 2012년 4월에는 남수단군이 헤글리그 유전 지대를 잠시 차지했다가 수단군이 되찾았다. 국경과 석유 수송료를 둘러싼 갈등은 풀리지 않은 채 남았고, 남수단은 곧 내전에 빠졌다(「남수단 내전(2013~2018)」(뒤의 사건))."
  subjects: [south-sudan, sudan]
  links:
    - { from: sudan, to: south-sudan, note: "주민 투표 결과를 받아들여 분리 독립을 인정 (2011-07-09)" }
  tags: [politics, diplomacy]
  sources: ["Douglas H. Johnson, South Sudan: A New History for a New Nation (Ohio University Press, 2016)", "Douglas H. Johnson, The Root Causes of Sudan's Civil Wars (James Currey, 2003)", "Peter Martell, First Raise a Flag: How South Sudan Won the Longest War but Lost the Peace (Hurst, 2018)"]

- id: mali-2012
  year: 2012
  endYear: 2015
  title:
    ko: "말리 북부 반란과 프랑스의 개입(2012~2015)"
  summary:
    ko: "말리 북부의 투아레그는 1960년 독립 뒤 여러 차례 봉기를 일으켰다. 2012년 1월 16일 아자와드 민족 해방 운동(MNLA)이 공세를 시작했고, 3월 22일 아마두 사노고 대위가 이끈 군인들의 쿠데타로, 대통령 선거를 한 달 앞둔 아마두 투마니 투레 대통령이 쫓겨나 정부의 통제가 흔들렸다. 반군은 며칠 만에 팀북투·키달·가오를 차지했고, 4월 6일 MNLA는 북부를 묶은 아자와드의 독립을 선언했으나 아프리카 연합과 유럽 연합은 무효로 보았고 승인한 나라는 없었다. MNLA와 손잡았던 이슬람 무장 세력 안사르 딘, 알카에다 마그레브 지부(AQIM), 서아프리카 통일·지하드 운동(MUJAO)이 MNLA를 밀어내고 북부 거의 전부를 장악해 이슬람법을 강요했다. 2013년 1월 11일 프랑스가 말리 정부의 요청으로 세르발 작전을 시작해 주요 도시를 되찾았고, MNLA는 2013년 2월 14일 독립 요구를 접었다. 2013년 6월 18일 정부와 투아레그 반군이 예비 평화 협정에 서명했으나 9월 26일 반군이 협정에서 빠졌고, 2013년 선거에서 이브라힘 부바카르 케이타가 대통령이 되었다. 세르발 작전은 2014년 사헬 전역을 맡는 바르칸 작전으로 이어졌다. 프랑스군은 바르칸 작전 때 약 5,100명이었고 유엔 임무단은 군 1만 1,200명·경찰 1,440명을 허가받았다. 2015년 6월 알제 협정이 정부와 투아레그 세력 사이에서 마무리되었다. 2017년에는 여러 지하드 조직이 합쳐 JNIM이 만들어졌다. 이 분쟁으로 2023년까지 사망자가 모두 약 2만 명이고(MINUSMA 311명, 프랑스군 58명 포함), 약 37만 명이 난민이나 국내 실향민이 되었다."
  subjects: [mali, france]
  links: []
  tags: [war, politics]
  sources: ["Baz Lecocq, Disputed Desert: Decolonisation, Competing Nationalisms and Tuareg Rebellions in Northern Mali (Brill, 2010)", "Alex Thurston, Jihadists of North Africa and the Sahel: Local Politics and Rebel Groups (Cambridge University Press, 2020)", "John Iliffe, Africans: The History of a Continent (2nd ed., Cambridge University Press, 2007)"]

- id: south-sudan-civil-war-2013
  year: 2013
  endYear: 2018
  title:
    ko: "남수단 내전(2013~2018)"
  summary:
    ko: "독립 2년 반 만인 2013년 12월 15일, 독립 때 대통령과 부통령이던 키르와 마차르의 갈등 속에 수도 주바에서 대통령 경호대 안의 충돌이 터졌다. 살바 키르 대통령은 앞서 부통령에서 물러나게 한 리크 마차르와 다른 10명이 쿠데타를 꾀했다고 주장했고 마차르는 부인했다. 2013년 7월 키르가 마차르를 비롯한 내각 전체를 해임한 터였고, 키르는 딩카족, 마차르는 누에르족이어서 싸움은 두 집단의 학살과 보복으로 번졌고, 보르와 유니티 주 등으로 퍼지는 가운데 육군 제8사단(사령관 피터 가닷)이 2013년 12월 18일 반란을 일으켰다. 2014년 1월 23일 에티오피아에서 정전이 합의되었으나 지켜지지 않았고, 2015년 1월 탄자니아 아루샤에서 수단 인민 해방 운동 분파들이 재통합에 합의했으며 같은 해 8월 타협 평화 협정이 서명되었다. 2016년 4월 마차르가 부통령으로 주바에 돌아왔으나 7월 주바에서 다시 전투가 벌어져 수백 명이 숨졌고 그의 세력은 적도 지방으로 빠졌다. 유엔 남수단 임무단(UNMISS)은 전투를 피한 민간인을 기지 안 보호 구역에 받아들였다. 2018년 9월 12일 아디스아바바에서 활성화된 평화 협정이 서명되어 전쟁은 공식으로 끝났고, 2020년 2월 22일 키르와 마차르가 통합 정부를 세웠다. 2018년 4월까지의 사망은 약 38만 3천~40만 명(직접 폭력 사망 약 19만 명, 굶주림과 병 등 그 밖의 전쟁 관련 사망 약 19만 3천 명)으로 추산되고, 약 400만 명이 집을 떠나 약 180만 명은 나라 안에, 약 250만 명은 우간다와 수단 등 이웃 나라에 있다. 합의 뒤에도 2025년 나시르와 종글레이 일대의 충돌처럼 일부 지역의 싸움이 이어졌다."
  subjects: [south-sudan, uganda, sudan]
  links: []
  tags: [war, politics]
  sources: ["Douglas H. Johnson, South Sudan: A New History for a New Nation (Ohio University Press, 2016)", "Peter Martell, First Raise a Flag: How South Sudan Won the Longest War but Lost the Peace (Hurst, 2018)", "Alex de Waal, The Real Politics of the Horn of Africa: Money, War and the Business of Power (Polity, 2015)"]

- id: ebola-2014
  year: 2014
  endYear: 2016
  title:
    ko: "서아프리카 에볼라 유행(2014~2016)"
  summary:
    ko: "기니 남동부의 작은 마을 멜리안두에서 2013년 12월 두 살 안팎의 어린이 에밀 우아모노가 숨진 것이 서아프리카 에볼라 유행의 첫 환자로 여겨진다. 기니 보건부가 확인한 아홉 달 뒤의 2014년 3월 25일 세계 보건 기구(WHO)가 알렸을 때(3월 24일까지 의심 환자 86명·사망 59명) 바이러스는 이미 국경을 넘고 있었다. 감염은 라이베리아와 시에라리온으로 번져 도시 지역에서 폭발적으로 늘었고, 병원과 장례 관습이 감염을 키웠다. WHO는 2014년 8월 8일 국제적 공중 보건 비상사태를 선포했다. 환자는 나이지리아(20명·사망 8명, 2014년 10월 20일 종식)와 말리(2014년 10월 23일 첫 환자·2015년 1월 18일 종식), 세네갈 등으로도 번졌고, 영국에서는 2014년 12월 29일 간호사 폴린 카퍼키가, 이탈리아에서는 2015년 5월 12일 사르데냐의 간호사가 확진되었다. 미국에서는 2014년 9월 30일 첫 환자가 진단되었으며 스페인에서는 10월 6일 간호사의 감염이 서아프리카 밖 첫 전파로 확인되었다. 최종 집계는 환자 28,616명과 사망 11,310명으로 치명률이 약 40%이다. 시에라리온은 2015년 11월 7일, 기니는 2015년 12월 29일 종식을 선언했고, 라이베리아는 2015년 5월 9일·9월 3일·2016년 1월 14일에 거듭 종식이 선언되었으나 작은 재발이 이어져 2016년 6월 9일 유행이 끝났다고 선언되었다. WHO는 이에 앞서 2016년 3월 29일 국제 비상사태를 풀었다. 2016년 12월 WHO는 백신 후보 rVSV-ZEBOV의 시험이 효과를 보였다고 발표했고 이 백신은 2019년 승인되었다."
  subjects: [guinea, liberia, sierra-leone, nigeria, mali]
  links: []
  tags: [society]
  sources: ["WHO Ebola Response Team, Ebola Virus Disease in West Africa - The First 9 Months of the Epidemic and Forward Projections (New England Journal of Medicine 371, 2014)", "David Quammen, Ebola: The Natural and Human History of a Deadly Virus (W. W. Norton, 2014)"]

- id: mugabe-2017
  year: 2017
  endYear: 2017
  title:
    ko: "무가베의 퇴진(2017)"
  summary:
    ko: "로버트 무가베는 1980년 로디지아 시대를 마친 독립 짐바브웨의 첫 총리가 되었고(「로디지아의 일방 독립 선언과 짐바브웨의 독립(1965~1980)」(앞의 사건)) 1987년 대통령으로 올라 37년 가까이 나라를 이끌었다. 2000년부터 백인 소유 상업 농장의 강제 수용이 시작되어 농업 생산과 외화 수입이 무너졌고, 초인플레이션으로 짐바브웨 달러가 사실상 쓰이지 않게 되자 2009년부터 외국 통화를 쓰게 되었다. 93세가 된 무가베의 후계가 2017년의 쟁점이었다. 부인 그레이스 무가베가 후계 자리를 노리는 가운데 11월 6일 무가베는 부통령 에머슨 음난가과를 불충을 이유로 해임했다. 음난가과는 11월 8일 모잠비크를 거쳐 남아프리카로 피신했다. 11월 13일 군 사령관 콘스탄티노 치웬가가 자신들의 동지가 계속 겨냥되면 군이 나서겠다고 경고했고, 11월 14일 저녁 군인과 장갑차가 하라레에 나타나 국영 방송을 장악했다. 11월 15일 새벽 시부시소 모요 소장이 국영 방송에서 군은 범죄자를 겨냥할 뿐이고 무가베는 안전하다고 밝혔으며, 군은 쿠데타가 아니라고 부인했다. 11월 18일 하라레 등에서 군의 행동을 환영하고 퇴진을 요구하는 대규모 평화 시위가 열렸고, 11월 19일 집권당 ZANU-PF가 무가베를 당 대표에서 해임하고 음난가과로 바꾸었는데 무가베는 방송 연설에서 사임을 거부했다. 11월 20일 치웬가는 이 군사 행동을 레거시 복원 작전이라 불렀고 집권당이 정한 시한이 지났다. 11월 21일 무가베는 사임서를 냈고 야콥 무단다 의장이 의회 합동 회의에서 이를 읽었으며, 11월 24일 음난가과가 대통령에 취임했다."
  subjects: [zimbabwe]
  links: []
  tags: [politics]
  sources: ["Blessing-Miles Tendi, The Army and Politics in Zimbabwe: Mujuru, the Liberation Fighters and Mugabe (Cambridge University Press, 2020)"]

- id: tigray-war-2020
  year: 2020
  endYear: 2022
  title:
    ko: "티그라이 전쟁(2020~2022)"
  summary:
    ko: "2018년 4월 아비 아머드가 총리가 되면서 티그라이 인민 해방 전선(TPLF)이 오래 주도해 온 연방 권력이 흔들렸다. 코로나19로 선거가 미뤄지자 TPLF가 이끄는 티그라이 주는 2020년 9월 독자 선거를 치렀고 연방 정부는 이를 불법으로 보았다. 2020년 11월 3일 한밤 TPLF 세력이 메켈레의 연방군 북부 사령부와 다른 기지를 공격했고(TPLF는 선제 자위라고 주장), 11월 4일 연방 정부가 보복 공세와 비상사태를 선포했다. 연방군은 11월 28일 메켈레를 차지했고, 에리트레아군이 티그라이에서 연방군 편에 서서 싸웠으며 11월 28~29일 악숨에서 민간인 수백 명이 에리트레아군에 숨졌다고 알려졌는데, 휴먼 라이츠 워치는 200명 넘게, 에티오피아 인권 위원회는 100명 넘게, 주민 증언은 800명까지 말한다. 암하라 지방군은 티그라이 서부를 차지했다. 2021년 2월 유엔 인도주의 조정관 마크 로콕은 티그라이의 최대 40%를 에티오피아군이 통제하지 못한다고 밝혔다. 2021년 6월 28일 티그라이 방위군(TDF)이 메켈레를 되찾았고 연방 정부는 일방 휴전을 선언했으며, 2022년 3월 24일 무기한 인도적 휴전이 선포되었으나 8월 말 협상이 깨져 전투가 다시 터졌다. 2022년 11월 2일 아프리카 연합의 중재로 에티오피아 정부와 티그라이 쪽이 전투 중단에 합의했고(효력은 이튿날부터, 에리트레아는 당사자가 아니었다) 11월 12일 이행 합의가 서명되었다. 사망자는 추산 방법에 따라 크게 갈려 10만 명 넘는다는 집계(UCDP), 약 10만 2천 명(런던 대학), 16만 2천~37만 8천 명(헨트 대학), 최대 80만 명(맨체스터 대학)이 있다. 약 275만 명이 나라 안에서, 약 88만 명이 국외 난민으로 집을 잃었다."
  subjects: [ethiopia, eritrea]
  links: []
  tags: [war, politics]
  sources: ["Martin Plaut and Sarah Vaughan, Understanding Tigray and the Ethiopian Conflict (Hurst, 2023)", "Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)"]

- id: sahel-coups-2020
  year: 2020
  endYear: 2023
  title:
    ko: "사헬의 쿠데타 연쇄(2020~2023)"
  summary:
    ko: "서아프리카 사헬에서는 이슬람 무장 세력과의 장기전과 정치 불신 속에 2020~2023년 군부가 정권을 잇달아 잡았다. 2020년 8월 18일 말리에서 아시미 고이타가 이끄는 군부가 이브라힘 부바카르 케이타 대통령을 몰아냈고, 2021년 5월 24일 과도 대통령 바 은다우를 쫓은 두 번째 쿠데타로 고이타가 실권을 쥐었다. 차드에서는 2021년 4월 20일 이드리스 데비 대통령이 전선에서 숨지자 군사 평의회가 권력을 잡고 아들인 군 장성이 군사 평의회 의장이 되어 나라를 이끌었다. 기니에서는 2021년 9월 5일 마마디 둠부야 대령의 특수 부대가 알파 콩데 대통령을 붙잡았고 서아프리카 경제 공동체는 9월 8일 기니의 자격을 정지했다. 부르키나파소에서는 2022년 1월 24일 로크 카보레 대통령이 쫓겨나고 폴앙리 산다오고 다미바가 집권했으나 9월 30일 이브라힘 트라오레 대위가 다시 쿠데타를 일으켰다. 니제르에서는 2023년 7월 26일 대통령 경호대장 압데라흐만 치아니가 무함마드 바줌 대통령을 가두고 집권했다. 군부 정권들은 프랑스와 갈라섰다. 말리는 2022년 프랑스와 방위 협정을 끝내 8월 중순 프랑스군 철수가 마무리되었고, 부르키나파소는 2023년 1월 프랑스군 특수 부대 400명의 한 달 안 철수를 요구했으며, 니제르는 2023년 7월 프랑스군 1,500명의 철수를 요구해 마크롱 대통령이 연말까지 전면 철수를 밝혔다. 2023년 9월 16일 말리·부르키나파소·니제르는 상호 방위 조약으로 사헬 국가 동맹을 맺었고, 2024년 1월 28일 서아프리카 경제 공동체 탈퇴를 밝혀 2025년 1월 29일 정식으로 탈퇴했으며 2024년 7월 연합 조약을 맺었다."
  subjects: [mali, burkina-faso, niger, guinea, chad, france]
  links: []
  tags: [politics, war]
  sources: ["Alex Thurston, Jihadists of North Africa and the Sahel: Local Politics and Rebel Groups (Cambridge University Press, 2020)", "John J. Chin, The Expanding Sahel Coup Belt (Current History 125권 871호, University of California Press, 2026)"]

- id: sudan-war-2023
  year: 2023
  endYear: 2026
  title:
    ko: "수단 내전(2023~)"
  summary:
    ko: "2019년 4월 11일 군이 오마르 알바시르를 몰아냈고(「다르푸르 분쟁(2003~2020)」(앞의 사건)) 군과 신속지원군(RSF)이 이끄는 과도 체제가 이어졌으나, 2021년 10월 압델 파타 알부르한과 RSF 사령관 무함마드 함단 다갈로(헤메티)가 쿠데타로 문민 정부를 밀어냈다. 군(SAF)을 이끄는 부르한과 RSF를 이끄는 헤메티의 권력 다툼이 커져 2023년 4월 15일 하르툼에서 전투가 터졌고 곧 다르푸르와 코르도판으로 번졌다. RSF는 다르푸르의 잔자위드 민병대에서 자랐다. 2024년 5월 무렵부터 RSF가 다르푸르 북부 엘파시르를 포위해 2025년 10월 26일 차지했는데, 이 도시와 주변 마을의 사망은 유엔이 3일간 최소 6,000명이라 밝혔고 그 밖의 추산은 6만 명을 넘는다. 군은 2025년 3월까지 하르툼을 되찾았다. 2025년 1월 7일 미국 정부는 RSF와 동맹 민병대가 집단 학살을 저질렀다고 판정했고, 2025년 4월 RSF 동맹 세력은 평화와 단결 정부를 내세웠다. 전체 사망자는 매우 불확실해 15만~40만 명으로 추산되며 하르툼 주에서만 약 6만 1천 명(직접 폭력 약 2만 6천 명)이 숨졌다. 2026년 7월 6일 현재 1,400만 명이 넘는 사람이 집을 떠났고(난민 약 450만 명 포함), 약 2,500만 명이 심각한 식량 불안을 겪으며 어린이 약 400만 명이 급성 영양실조이고 그 가운데 약 77만 명은 생명이 위태롭다고 하며, 여러 지역에서 기근이 확인되었다. 2026년 9월까지 지속적인 휴전은 이뤄지지 않았다. 정부는 2026년 하르툼으로 돌아갔지만 전투는 코르도판·다르푸르·블루나일 등에서 이어졌다."
  subjects: [sudan]
  links: []
  tags: [war, politics]
  sources: ["Alex de Waal, The Real Politics of the Horn of Africa: Money, War and the Business of Power (Polity, 2015)"]
