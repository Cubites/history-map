- id: dogra-ladakh-1834
  year: 1834
  endYear: 1842
  title:
    ko: "잠무 도그라의 라다크·발티스탄 정복(1834~1842)"
  summary:
    ko: "잠무의 라자 굴랍 싱은 란지트 싱에게서 1822년 라자 칭호를 받은 시크 제국의 봉신이었다. 그의 장군 조라와르 싱 칼루리아는 1834~1835년 키슈트와르에서 수루 계곡을 따라 라다크를 침입했고, 1835년 봄 라다크 왕은 배상금 5만 루피와 해마다 조공 2만 루피를 내기로 했다. 1836년 카슈미르 총독 메한 싱이 라다크의 반란을 부추기자 조라와르는 이를 눌러 왕을 폐위하고 새 왕을 세웠다가 1838년 옛 왕을 복위시켰으나, 라다크는 이미 도그라의 손에 들어와 있었다. 1839~1840년 겨울에는 발티스탄을 정복해 스카르두를 함락했고 무함마드 샤를 연 7,000루피의 조공을 내는 군주로 앉혔다. 조라와르는 란지트 싱에게 티베트 원정을 허락받으려다 거절당했는데, 1841년 셰르 싱의 허락을 받아 원정에 나서 9월 6일 타클라코트(푸랑)를 점령했다. 그러나 얼어붙은 고원에서 군량과 병력이 무너져 1841년 12월 12일 토요 전투에서 전사했다. 이어 티베트군이 라다크로 내려와 레를 에워쌌으나 도그라군이 이겼고, 1842년 추슬 조약으로 두 쪽은 옛 국경과 교역을 지키기로 했다. 라다크 왕가는 스톡 영지로 물러났고 이 일로 잠무 도그라의 라다크 지배가 굳어졌다. 이 정복은 1846년 암리차르 조약으로 굴랍 싱이 카슈미르를 사들여 잠무 카슈미르 주를 세우는 바탕이 되었다(「시크 전쟁과 잠무 카슈미르의 성립, 영국의 펀자브 병합(1845~1849)」, 뒤의 사건). 굴랍 싱은 동생 디안 싱과 함께 라호르 궁정에서도 큰 영향력을 쥐었다(디안 싱은 란지트의 재상이었다). 라다크 정복에는 카슈미르 숄 양모가 오가는 교역로를 손에 넣으려는 목적도 있었다는 해석이 있다."
  subjects: [ladakh-kingdom, jammu-kashmir-state, sikh-empire]
  tags: [war, politics]
  sources: ["Alexander Cunningham, Ladak, Physical, Statistical, and Historical (W. H. Allen, 1854)", "Janet Rizvi, Ladakh: Crossroads of High Asia (Oxford University Press, 1983)", "Ahmad Hasan Dani, History of Northern Areas of Pakistan (National Institute of Historical and Cultural Research, 1991)"]

- id: talpur-sindh-1779
  year: 1779
  endYear: 1843
  title:
    ko: "탈푸르 왕조의 신드와 영국의 병합(1779~1843)"
  summary:
    ko: "신드는 18세기 내내 칼호라 왕조가 다스렸고, 1779년 조드푸르(마르와르)가 움에르코트 요새를 차지했다. 칼호라의 군 지휘관이던 발루치 부족 탈푸르 가문의 미르 파테 알리 칸은 1783년 할라니 싸움에서 칼호라를 꺾고 하이데라바드를 도읍으로 탈푸르 왕조를 열었다. 같은 가문의 미르 소라브 칸은 상부 신드에 하이르푸르 주를 세웠고, 다른 갈래는 미르푸르 카스를 세워 아미르(수령)들이 신드를 셋으로 나누어 다스렸다. 1813년 탈푸르는 움에르코트를 되찾았다. 회사와는 1809년 우호 조약을 맺었고, 1832년 조약으로 인더스강 통행을 열었으며 하이르푸르의 독립적 지위가 인정되었다. 제1차 아프가니스탄 전쟁을 앞두고(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 뒤의 사건) 영국은 1839년 아미르들에게 보조군 주둔을 받아들이게 했다. 1842년 총독 엘런버러는 아미르들이 적대했다고 보아 조약 개정을 요구했는데, 그 근거가 된 정보의 신빙성을 두고 논란이 있다. 찰스 네이피어 장군은 1843년 2월 17일 미아니에서 2,800명 안팎의 병력으로 발루치 군(탈푸르 쪽 병력은 자료에 따라 약 2,200명에서 3만 명까지 갈린다)을 꺾었고, 3월 24일 두바에서 미르푸르 카스의 셰르 무함마드가 져 신드가 병합되었다. 하이데라바드의 아미르들은 유배되었다. 영국 편에 선 하이르푸르의 알리 무라드는 상부 신드의 땅 일부를 잃었으나 하이르푸르 주는 토후국으로 남았다. 네이피어는 초대 신드 총독이 되었다. 영국의 이 병합은 당시 영국 안에서도 침략이라는 비판을 받았다. 신드는 인더스강 하구와 카라치 항을 끼고 있어 회사는 이곳을 인도에서 아프가니스탄으로 가는 통로로 보았다. 네이피어의 총독 직은 1847년 신드가 봄베이 관구에 합쳐질 때까지 이어졌다."
  subjects: [talpur-sindh, khairpur-state, jodhpur-state, company-india]
  links:
    - { from: talpur-sindh, to: jodhpur-state, note: "움에르코트를 되찾음 (1813)" }
