  sources: ["P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)", "Sushil Chaudhury, From Prosperity to Decline: Eighteenth Century Bengal (Manohar, 1995)", "William Dalrymple, The Anarchy: The East India Company, Corporate Violence, and the Pillage of an Empire (Bloomsbury, 2019)"]
