  tags: [war, politics]
  sources: ["H. T. Lambrick, Sind: A General Introduction (Sindhi Adabi Board, 1964)", "H. T. Lambrick, Sir Charles Napier and Sind (Clarendon Press, 1952)", "Hamida Khuhro, The Making of Modern Sind: British Policy and Social Change in the Nineteenth Century (Indus Publications, 1978)"]

- id: anglo-nepal-war-1814
  year: 1814
  endYear: 1816
  title:
    ko: "영국–네팔 전쟁과 수가울리 조약(1814~1816)"
  summary:
    ko: "네팔은 서쪽 사틀레지강에서 동쪽 티스타강까지 뻗었고(「고르카의 네팔 통일과 팽창(1768~1804)」, 앞의 사건), 남쪽 타라이 평원에서 인도의 회사 영토와 맞닿아 부톨과 시오라즈의 귀속을 두고 다투었다. 당시 네팔은 국왕 기르반 유데 비크람 샤 아래에서 빔센 타파가 정부를 이끌었다. 1814년 11월 총독 헤이스팅스(모이라 후작)가 전쟁을 선포했다. 네팔 쪽 발라바드라 쿤와르가 지킨 칼룽가 요새에서 로버트 질레스피 소장이 1814년 10월 31일 전사해 회사군의 첫 공격은 크게 실패했다. 그러나 서쪽 산지에서는 데이비드 오크터로니가 밀어붙였고, 쿠마온에서는 니콜스 대령이 1815년 4월 알모라를 함락시켰다. 5월 아마르 싱 타파가 말라운에서 항복 조건에 서명해 네팔군이 서쪽 땅에서 물러났다. 회사는 시르무르·케온탈·빌라스푸르 등 산지 군주들(펀자브 산지 토후국들)을 구르카의 지배에서 풀어 주는 대신 특허장(산드)으로 영국의 보호 아래 두었다. 1815년 12월 2일 수가울리에서 조약이 마련되었으나 네팔 궁정이 비준을 미루자 오크터로니가 1816년 2월 마크완푸르로 들어갔고, 1816년 3월 4일 조약이 비준되었다. 네팔은 칼리강 서쪽의 쿠마온·가르왈과 타라이 땅, 동쪽의 시킴 땅을 내놓았고 카트만두에 영국 상주 사절을 받아들였으나 독립과 내정은 지켰다(타라이 가운데 일부는 곧 돌려받았고 서부 타라이는 1860년에 돌려받았다). 회사는 가르왈 서쪽을 옛 왕 프라디윰나 샤의 아들 수다르샨 샤에게 돌려주어 테흐리 가르왈 주를 세우고 동쪽 가르왈과 쿠마온은 직접 거두었다. 구르카 병사들이 회사군에 들어와 훗날 구르카 연대의 바탕이 되었다. 영국 장교들은 구르카 군의 요새 방어와 용맹을 높이 평가했고 이는 이후 구르카 모병으로 이어졌다. 타라이 평원은 곡창이자 군주의 수입원이어서 네팔 궁정에는 큰 손실이었다."
