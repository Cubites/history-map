- id: third-anglo-maratha-war-1817
  year: 1817
  endYear: 1818
  title:
    ko: "제3차 마라타 전쟁과 라지푸타나 보호 조약(1817~1818)"
  summary:
    ko: "피다리라 불린 비정규 기병 무리가 중앙 인도에서 마드라스 관구와 하이데라바드까지 약탈하자, 총독 헤이스팅스(모이라 후작)는 이를 구실로 마라타 가문과 라지푸트 나라들을 에워싸는 대규모 작전을 폈다. 페슈와 바지 라오 2세는 1815년 바로다의 사절 강가다르 샤스트리가 살해된 일로 의심받아, 1817년 6월 푸네 조약으로 가이크와드에 대한 권리를 버리고 땅 일부를 내놓았다. 1817년 11월 5일 키르키에서 페슈와가 회사 진영을 공격했다가 졌고, 11월 26일 나그푸르 시타불디에서 본슬레 아파 사히브가 졌으며, 12월 21일 마히드푸르에서 인도르 홀카르군이 무너져 1818년 1월 홀카르는 보조 동맹을 받아들였다. 괄리오르의 신디아도 1817년 11월 조약으로 피다리 토벌에 협조했다. 1818년 1월 1일 코레가온 비마에서 회사의 소수 부대(마하르 병사가 많았다)와 페슈와군이 하루 맞섰고 양쪽이 모두 승리를 주장했다. 바지 라오 2세는 쫓기다 6월 3일 항복해 연 8락 루피의 연금을 받고 칸푸르 근처 비투르로 보내졌으며, 페슈와 직위는 폐지되고 영토는 봄베이 관구에 합쳐져 마라타 제국이 끝났다. 회사는 사타라에 이름뿐인 마라타 군주 프라탑 싱을 세웠고 데칸 토후국들과 조약을 맺었다. 나그푸르는 아파 사히브가 폐위되고 어린 라구지 3세가 영국 후견 아래 올랐다. 앞서 본슬레에게 빼앗겼던 소하그푸르 일대는 이때 영국 땅이 되었고, 1812년부터 영국의 보호를 받던 레와 주(바겔칸드)는 그대로 토후국으로 남았다. 바로다의 가이크와드는 구자라트의 팔란푸르·마히칸타·레와칸타 토후국들을 보호하는 대신 영국에 기대게 되었다. 라지푸타나에서는 1817년 11~12월 카롤리와 코타를 시작으로 1818년 1월 메와르와 조드푸르, 3월 비카네르, 4월 자이푸르, 12월 자이살메르가 보호 조약을 맺었다. 동부 라지푸타나 토후국들(알와르·바라트푸르)과 둥가르푸르·반스와라 등 남부 라지푸타나 토후국들, 중앙 인도의 말와 토후국들도 같은 때 영국의 보호 아래 놓였다. 군주들은 마라타와 피다리의 압박에서 벗어나는 대신 외교와 군사를 회사에 맡기고 조공을 회사에 냈다."
