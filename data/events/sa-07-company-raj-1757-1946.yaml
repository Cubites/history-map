- id: third-carnatic-war-1757
  year: 1757
  endYear: 1763
  title:
    ko: "제3차 카르나타카 전쟁과 프랑스 세력의 후퇴(1757~1763)"
  summary:
    ko: "인도 남동 해안의 카르나타카에서는 1740년대부터 영국과 프랑스 동인도 회사가 카르나타카 나와브 자리와 하이데라바드 니잠 자리를 둘러싼 후계 다툼에 한쪽씩 붙어 싸웠다. 유럽에서 7년 전쟁이 터지자(「외교 혁명과 7년 전쟁」, 앞의 사건) 싸움이 다시 불붙었고 이를 제3차 카르나타카 전쟁이라 부른다. 프랑스는 1758년 4월 랠리 백작의 원정군을 퐁디셰리에 보냈다. 랠리는 6월 영국의 포트 세인트 데이비드를 차지했으나 1758년 12월부터 1759년 2월까지 마드라스를 에워싸고도 함락시키지 못했다. 영국 쪽 포드 대령은 1759년 4월 북부 시르카르의 마술리파트남을 빼앗아 프랑스가 하이데라바드 니잠의 궁정에서 쥐던 영향력을 없앴고, 니잠 살라바트 장은 그해 영국과 조약을 맺었다. 1760년 1월 22일 와디와시에서 에어 쿠트가 랠리의 군을 꺾었고, 영국군은 오랜 봉쇄 끝에 1761년 1월 퐁디셰리의 항복을 받은 뒤 성곽을 허물었다. 1763년 파리 조약으로 영국은 퐁디셰리·찬데르나고르 등 프랑스의 상관을 돌려주되 군대와 요새를 두지 못하게 했고, 프랑스는 인도 군주들의 후계 다툼에 끼지 않기로 했다. 프랑스는 영국이 밀던 무함마드 알리 왈라자를 카르나타카의 정당한 나와브로 인정해야 했다. 프랑스령 인도는 이 뒤로 몇 곳의 상관으로 줄었고, 영국 동인도 회사는 벵골에 이어 남인도 해안에서도 군사적으로 맞설 유럽 세력이 없게 되었다. 나와브는 회사 군대의 비용을 대려고 빚을 졌다. 프랑스 쪽 부시 후작은 1751년부터 하이데라바드 니잠의 궁정에 군대를 두고 북부 시르카르의 수입을 얻었으나, 랠리가 1758년 그를 불러들인 사이 영국이 그 땅을 차지하는 길이 열렸다. 이 무렵 마이소르에서는 하이데르 알리가 두각을 나타내기 시작했다."
  subjects: [carnatic-nawab, hyderabad-state, french-india, company-india, uk, france]
  links:
    - { from: company-india, to: french-india, note: "퐁디셰리를 점령해 프랑스 세력을 꺾음 (1761)" }
