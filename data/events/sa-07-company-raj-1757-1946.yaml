- id: bentinck-reforms-1828
  year: 1828
  endYear: 1835
  title:
    ko: "벤팅크의 개혁: 사티 금지와 1833년 헌장법(1828~1835)"
  summary:
    ko: "윌리엄 벤팅크는 윌리엄 베일리의 대행을 이어 1828년 7월 총독에 올랐고(재임 1828~1835), 1834년 4월부터 인도 전체의 총독이 되었다. 그는 비용을 줄이려고 군 수당을 깎고 행정을 정리했으며 군대의 태형을 없앴다. 1829년 12월 4일 벵골 관구 규정 17호로 사티(과부가 남편의 장작더미에서 죽는 관행)를 형사 범죄로 만들었고 이는 1830년 마드라스·봄베이에 확대되었다. 람 모한 로이는 이 금지를 지지해 1828년 브라모 사바를 세웠으나, 라다칸타 데브 같은 정통 힌두들은 다르마 사바를 만들어 반대하며 영국 추밀원에 청원했다(1832년 기각). 윌리엄 슬리먼은 1830년대에 교살 강도단 투기를 소탕하는 부서를 이끌었다. 1833년 헌장법은 회사의 중국 무역 독점을 없애고 회사를 통치 기구로만 남겨 20년 연장했으며, 총독에게 인도 전체의 입법권을 주고 법률 위원(매콜리)을 두게 했다. 법은 종교·출신·피부색을 이유로 관직에서 배제하지 않는다고 선언했으나 실제 고위직은 유럽인 몫이었다. 이 시기 회사는 영토도 넓혔다. 1830~1831년 나가르 반란으로 마이소르 왕국을 직접 통치(1831)했고, 카차르(1832)·쿠르그(1834)·카시와 자인티아 구릉(1835)을 병합했다. 마이소르의 와디야르 왕가는 명목상 왕으로 남았다. 벤팅크는 1835년 3월 총독에서 물러났고 찰스 메트칼프가 대행했다. 1835년에는 캘커타 의과대학이 세워졌고, 임시 총독 메트칼프가 언론 규제를 풀어 신문 발행이 자유로워졌다. 1831년 뒤로는 인도인 판사(사드르 아민 등)와 부징세관 자리를 늘려 지방 행정의 낮은 직급을 인도인에게 열었다."
  subjects: [company-india, mysore, uk]
  tags: [politics, society]
  sources: ["Lata Mani, Contentious Traditions: The Debate on Sati in Colonial India (University of California Press, 1998)", "Thomas R. Metcalf, Ideologies of the Raj (Cambridge University Press, 1994)", "David Kopf, British Orientalism and the Bengal Renaissance: The Dynamics of Indian Modernization 1773–1835 (University of California Press, 1969)"]

- id: macaulay-minute-1835
  year: 1835
  title:
    ko: "매콜리의 교육 건의서와 영어 교육 정책(1835)"
  summary:
    ko: "회사는 1781년 캘커타 마드라사, 1790년대 바라나시 산스크리트 학교를 세워 인도 학문을 후원했고, 1813년 헌장법으로 해마다 10만 루피를 인도 학문과 과학 교육에 쓰기로 했다. 이 돈을 어디에 쓰느냐를 두고 공공 교육 위원회가 갈렸다. 아랍·산스크리트·페르시아 학문을 가르쳐야 한다는 동양학파와, 영어로 서양 학문을 가르쳐야 한다는 서양학파였다. 한편 람 모한 로이는 1823년 서양 과학 교육을 요구하는 편지를 보냈고, 선교사 알렉산더 더프는 1830년 영어 학교를 열었다. 1834년 법률 위원으로 온 토머스 매콜리는 1835년 2월 2일 건의서에서 인도의 학문을 깎아내리며, 피와 피부색은 인도인이지만 취향·생각·지성은 영국식인 계층을 만들어 영어로 가르쳐야 한다고 주장했다. 총독 벤팅크는 1835년 3월 7일 결의로 교육 예산을 영어를 통한 유럽 학문과 과학에 쓰기로 했다(영어 교육령). 1837년에는 페르시아어가 법원 공용어 자리에서 밀려났다. 영어 교육은 중간층을 키워 행정에 쓸 인도인 관리를 길렀으나 대부분 지역어와 전통 학교 교육은 지원을 잃었고, 오늘날 연구자들은 그 평가가 갈린다고 말한다. 이 정책은 벵골의 근대 지식인 사회와 뒷날 민족 운동 지도자를 길러 낸 배경이 되었다. 이 건의서는 아랍·산스크리트 문헌 한 서가가 좋은 유럽 도서관의 서가 하나에도 값하지 못한다고 말한 것으로 유명하다. 1844년 총독 하딩은 영어를 아는 인도인을 관직에 우대한다고 선언해 영어 교육의 길을 넓혔다. 매콜리는 법률 위원으로 일하며 인도 형법 초안(1837)도 썼다. 공공 교육 위원회는 1823년 세워져 위원 열 명이 두 파로 나뉘어 있었다."
  subjects: [company-india]
  tags: [culture, politics]
  sources: ["David Kopf, British Orientalism and the Bengal Renaissance: The Dynamics of Indian Modernization 1773–1835 (University of California Press, 1969)", "Gauri Viswanathan, Masks of Conquest: Literary Study and British Rule in India (Columbia University Press, 1989)", "T. B. Macaulay, 「Minute on Indian Education」(1835)"]

- id: first-afghan-war-1838
  year: 1838
  endYear: 1842
  title:
    ko: "제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)"
  summary:
    ko: "이란의 헤라트 포위(「무함마드 샤와 헤라트 문제, 영국–이란 전쟁(1834~1857)」, 앞의 사건)를 러시아의 영향으로 본 총독 오클랜드는 아프가니스탄의 도스트 무함마드 대신 두라니 가문의 샤 슈자를 세우려 했다. 1838년 6월 샤 슈자, 란지트 싱의 시크 제국, 회사가 세 나라 조약을 맺었다. 1838년 말 인더스군 약 2만 명이 펀자브와 신드를 거쳐 볼란 고개로 진군해 1839년 8월 카불에서 샤 슈자를 복위시켰다. 시크 제국은 카이베르 길을 열어 주고 페샤와르를 병참으로 내주었으며, 하이르푸르 주를 포함한 신드의 아미르들은 보조군 주둔을 강요받았다. 도스트 무함마드는 1840년 항복해 인도로 유배되었다. 1841년 11월 카불에서 봉기가 일어나 영국 사절 매크노튼이 12월 죽었고, 1842년 1월 카불을 떠난 영국·인도 군대와 종군자 약 1만 6,500명(군인 약 4,500명과 종군자 약 1만 2,000명)은 겨울 고개에서 거의 전멸해 의사 브라이던만 잘랄라바드에 닿았다. 총독 엘런버러는 포록과 노트가 이끈 군대를 보냈고, 이 군대는 1842년 9월 카불에 들어가 포로를 구한 뒤 10월 대시장을 불태우고 카불을 떠나 12월 펀자브로 철수를 마쳤다. 샤 슈자는 1842년 4월 살해되었고 도스트 무함마드는 1843년 돌아왔다. 전비는 인도의 세입에서 나왔고 병사의 대부분은 인도인이었다. 란지트 싱이 죽은(1839) 뒤 시크 궁정이 혼란에 빠진 데다 영국군이 펀자브를 오가며 시크 군부와 회사의 긴장이 커졌고, 이는 시크 전쟁으로 이어졌다(「시크 전쟁과 잠무 카슈미르의 성립, 영국의 펀자브 병합(1845~1849)」, 뒤의 사건). 도스트 무함마드는 1837년 알렉산더 번스의 사절단이 오자 영국의 도움을 먼저 구했으나, 영국이 시크 제국과 맞서는 것을 피하면서 거절당했다."
  subjects: [company-india, sikh-empire, talpur-sindh, khairpur-state, uk]
  links:
    - { from: sikh-empire, to: company-india, note: "세 나라 조약으로 카이베르 길과 페샤와르 병참을 내줌 (1838~1839)" }
  tags: [war, diplomacy]
  sources: ["William Dalrymple, Return of a King: The Battle for Afghanistan, 1839–42 (Bloomsbury, 2013)", "Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "J. S. Grewal, The Sikhs of the Punjab (Cambridge University Press, 1990)"]

- id: anglo-sikh-wars-1845
  year: 1845
  endYear: 1849
  title:
    ko: "시크 전쟁과 잠무 카슈미르의 성립, 영국의 펀자브 병합(1845~1849)"
  summary:
    ko: "란지트 싱이 죽은(1839) 뒤 라호르 궁정은 카락 싱(재위 1839~1840), 아들 나우 니할 싱(1840), 찬드 카우르(1840~1841), 셰르 싱(1841~1843)을 거치며 파벌 다툼과 암살로 흔들렸고, 1843년 다섯 살 둘립 싱이 즉위하자 어머니 진드 카우르가 섭정했다. 군대(칼사)는 병사 회의로 힘을 키워 궁정을 위협했다. 1845년 12월 11일 시크 군이 사틀레지강을 건너 제1차 시크 전쟁이 시작되었다. 12월 18일 무드키와 21일 페로제샤에서 영국은 큰 피해를 입고 이겼고, 1846년 1월 28일 알리왈, 2월 10일 소브라온에서 시크 군이 크게 졌다(소브라온 시크 쪽 사망은 8,000~10,000명으로 추산). 시크 군 지휘관 랄 싱과 테즈 싱은 배신했다는 의심을 받았다. 1846년 3월 9일 라호르 조약으로 시크는 사틀레지강과 베아스강 사이 잘란다르 도압을 넘기고 배상금 1,500만 루피를 내기로 했으나 라호르 국고에는 약 500만 루피뿐이어서, 나머지 약 1,000만 루피 몫으로 카슈미르·하자라와 산지를 회사에 넘겼다(자료에 따라 배상금을 2,000만 루피로 적기도 한다). 3월 16일 암리차르 조약으로 회사는 카슈미르를 잠무의 굴랍 싱에게 750만 루피에 넘겼고, 굴랍 싱이 잠무 카슈미르 주의 마하라자가 되었다. 12월 바이로왈 조약으로 영국 상주 사절 헨리 로런스가 섭정 회의를 이끌었다. 1848년 4월 물탄의 총독 물라지 아래에서 영국 관리 둘이 살해되자 반란이 번졌고 셰르 싱 아타리왈라 등이 합류해 제2차 시크 전쟁이 되었다. 1849년 1월 13일 칠리안왈라에서 영국은 큰 손실을 입었고, 2월 21일 구자라트에서 포격전으로 이겼다. 3월 12일 시크 군이 항복했고 3월 29일 둘립 싱이 서명한 문서로 펀자브가 동인도 회사령 인도에 병합되었다(4월 2일 선포로 적는 글도 있다). 어린 둘립 싱은 연금을 받으며 물러났고 코이누르 다이아몬드는 1850년 빅토리아 여왕에게 바쳐졌다. 펀자브는 헨리·존 로런스 형제 등이 이끈 행정 위원회가 다스렸다. 서틀레지강 동쪽 펀자브 토후국들 가운데 작은 곳들은 1846년을 전후해 영국 직할로 편입되었다."
