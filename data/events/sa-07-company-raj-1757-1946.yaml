- id: sikh-misl-lahore-1765
  year: 1765
  endYear: 1799
  title:
    ko: "시크 미슬 연합과 라호르 점령(1765~1799)"
  summary:
    ko: "시크교 공동체는 17세기 말 무굴 제국의 탄압 속에서 무장한 무리(잣타)로 흩어져 싸웠다. 1748년 암리차르에서 이들을 열한 개(헤아리기에 따라 열두 개) 미슬로 짜고 연합 군대 달 칼사를 세웠다. 미슬은 서로 독립한 수령들의 동맹이었고, 해마다 암리차르에 모이는 사르바트 칼사의 결의(구르마타)로 큰일을 정했다. 아흐마드 샤 두라니의 원정이 거듭되는 가운데 시크 세력은 오히려 자랐다. 1762년 2월 5~6일 두라니 군이 말레르콜라 근처에서 이동 중이던 시크의 가족과 병사 무리를 쫓아 죽인 와다 갈루가라(큰 학살)에서 죽은 시크는 사료에 따라 5,000명에서 5만 명까지 갈리고, 당대 무슬림 연대기는 약 2만 5,000명, 시크 쪽 사료는 약 3만 명을 들었다. 그해 4월 두라니는 하르만디르 사힙(황금 사원)을 화약으로 폭파했으나, 시크는 10월 17일 암리차르에서 두라니 군을 꺾었다. 1764년 1월 시크는 시르힌드를 점령해 총독 자인 칸을 죽였고, 1765년 4월 무렵 바기 미슬의 구자르 싱·레흐나 싱이 라호르를 차지하고 카냐 미슬의 소바 싱이 합류해, 세 수령이 도시를 함께 다스리며 자기들의 주화를 찍었다. 이로써 인더스강 동쪽 펀자브의 큰 부분이 두라니의 손을 떠나 미슬들이 나눠 다스렸다. 두라니의 티무르 샤(재위 1772~1793)와 자만 샤(재위 1793~1801)가 다시 원정했으나 시크를 누르지 못했다. 미슬 가운데 수케르차키아 미슬의 란지트 싱이 1799년 자만 샤의 철수 틈에 라호르를 차지했고, 이로써 미슬의 시대가 끝나고 훗날 시크 제국이 된 통일 국가의 바탕이 놓였다(「란지트 싱의 시크 제국(1799~1839)」, 뒤의 사건). 대표적 미슬로 바기·알루왈리아·카냐·라마가르히아·수케르차키아가 있었고, 풀키안 가문(파티알라 등)은 사틀레지강 동쪽 시르힌드 일대에 자리 잡았다. 수령들은 점령지를 나누어 세금을 걷었고 마을은 수령에게 보호세(라키)를 내는 방식이 퍼졌다."
  subjects: [sikh-empire, durrani-empire]
  links:
    - { from: sikh-empire, to: durrani-empire, note: "라호르를 차지해 인더스강 동쪽 펀자브에서 두라니를 몰아냄 (1765)" }
  tags: [war, politics, religion]
  sources: ["J. S. Grewal, The Sikhs of the Punjab (Cambridge University Press, 1990)", "Khushwant Singh, A History of the Sikhs, Vol. 1: 1469–1839 (Princeton University Press, 1963)", "Jos Gommans, The Rise of the Indo-Afghan Empire c. 1710–1780 (Brill, 1995)"]

- id: hyder-ali-mysore-1761
  year: 1761
  endYear: 1784
  title:
    ko: "하이데르 알리의 집권과 제1·2차 마이소르 전쟁(1761~1784)"
  summary:
    ko: "마이소르는 힌두 와디야르 왕가가 이름뿐인 군주로 앉고 실권은 재상 가문이 쥐고 있었다. 무슬림 군인 집안의 하이데르 알리는 1755년 딘디굴 요새를 맡아 프랑스인 기술자의 도움으로 군을 서양식으로 기른 뒤, 1761년 실권자를 몰아내고 마이소르의 실제 지배자가 되었다(와디야르 왕은 그대로 두었다). 그는 시라(1761)와 비드누르(1763)를 정복했고 1766년에는 말라바르의 사모린을 눌렀으며, 1760년대 후반에는 카르나타카 나와브가 다스리던 바라마할·코임바토르 일대도 차지했다. 1766년 11월 하이데라바드의 니잠은 북부 시르카르를 영국 동인도 회사에 넘기는 대신 군사 도움을 받기로 했고, 하이데르는 이를 포위로 보아 맞섰다. 제1차 마이소르 전쟁(1767~1769)에서 하이데르는 처음 니잠과 손잡았다가 니잠이 영국 쪽으로 돌아서자 홀로 싸워 1769년 봄 마드라스 성문 앞까지 진군했고, 1769년 4월 정복지를 서로 돌려주고 공격받으면 돕는다는 마드라스 조약을 얻었다. 그러나 1771년 마라타가 마이소르를 쳤을 때 회사는 돕지 않았다. 하이데르는 1776~1779년 니잠에게서 구티·벨라리·아난타푸르 일대를, 1778년 마라타에게서 다르와드를 빼앗았다. 1779년 영국이 프랑스령 마에를 차지하자 그는 마라타·니잠과 반영 동맹을 맺었고(제2차 전쟁, 1780~1784), 1780년 9월 폴릴루르에서 윌리엄 베일리의 부대를 무찔러 마드라스 일대를 휩쓸었다. 1781년 7월 에어 쿠트가 포르토노보에서 그를 꺾었고, 하이데르는 1782년 12월 병으로 죽었다. 아들 티푸가 프랑스 함대의 지원을 받으며 싸움을 이었으나 1784년 3월 11일 망갈로르 조약으로 전쟁 전 상태로 돌아가기로 했다(「티푸 술탄과 제3·4차 마이소르 전쟁, 와디야르 가문의 복위(1782~1799)」, 뒤의 사건)."
