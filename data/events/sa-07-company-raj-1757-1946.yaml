- id: first-anglo-burmese-war-1824
  year: 1824
  endYear: 1826
  title:
    ko: "제1차 영국–버마 전쟁과 얀다보 조약, 아삼·마니푸르(1824~1826)"
  summary:
    ko: "아홈 왕국의 대신 바단 찬드라 바르푸칸은 정적 푸르난다 부르하고하인에 맞서 도움을 청했으나 회사가 거절하자 버마(콘바웅 왕조) 궁정에 청했고, 버마군은 1817년부터 아삼에 들어가 1819년 이후 직접 지배했다. 마니푸르도 1819년 버마군에게 짓밟혀 많은 주민이 도망쳤고, 버마는 카차르와 자인티아 구릉에도 손을 뻗었다. 1823년 9월 샤푸리 섬에서 충돌이 일어난 뒤 회사는 1824년 3월 5일 선전했다. 영국군은 1824년 5월 랑군을 점령하고 서쪽에서는 아삼에서 버마군을 쫓아냈으며, 마니푸르에서는 회사의 지원을 받은 가미르 싱이 마니푸르 병력을 모아 버마군을 몰아냈다. 버마 총사령관 마하 반둘라는 1825년 4월 도나뵤에서 전사했다. 1826년 2월 24일 얀다보 조약으로 버마는 아삼과 마니푸르, 아라칸과 테나세림 해안을 내놓고 카차르·자인티아에 간섭하지 않기로 했으며 배상금 100만 파운드를 4회에 나누어 내기로 했다. 이 조약은 아홈 왕국과 카차르 왕국의 동의 없이 맺어졌다. 마니푸르는 가미르 싱이 왕위를 되찾았고, 아삼은 회사의 관리 아래 들어갔다. 회사는 1833~1838년 상부 아삼에 아홈 왕자 푸란다르 싱하를 앉혔다가 1838년 이를 거두었다. 이 전쟁에서 영국·인도 군인 약 1만 5,000명이 죽었는데 대부분 질병 때문이었고, 버마 쪽 사망은 더 많았을 것으로 보지만 알려지지 않았다. 이 전쟁에 동원된 영국·인도 군은 약 4만 명이었다. 버마군은 숲속 목책에 의지해 맞섰고, 영국군은 우기와 열병·이질로 전투에서보다 질병으로 더 많이 죽었다. 카차르의 고빈다 찬드라 왕은 1824년 3월 영국과 보호 조약을 맺었다."
  subjects: [ahom-kingdom, manipur, company-india]
  links:
