- id: dalhousie-lapse-1848
  year: 1848
  endYear: 1856
  title:
    ko: "달하우지의 실권 원칙 병합: 사타라·나그푸르·아와드(1848~1856)"
  summary:
    ko: "달하우지 후작 제임스 브라운램지는 1848년 1월 인도 총독이 되어 1856년 2월까지 재임했다(후임 캐닝). 그는 1834년 이사회가 밝힌 원칙을 넓게 적용했다. 영국의 보호를 받는 토후국의 군주가 친아들 없이 죽으면 입양 후계를 인정하지 않고 땅을 거두는 실권 원칙이다. 사타라는 1848년 4월 왕이 입양 후계 없이 죽자 이듬해 병합되어 데칸 토후국들 가운데 가장 큰 땅 하나가 사라졌다. 1849년에 삼발푸르(오리사 토후국들 가운데 한 곳)와 자이트푸르, 1850년 바갈, 1852년 우다이푸르(차티스가르), 1854년 잔시, 1854년 3월 나그푸르(라구지 3세가 1853년 12월 죽음)가 이어졌다. 카롤리의 병합은 이사회가 취소했다. 1853년 5월 니잠과의 조약으로 베라르와 라이추르 도압이 하이데라바드 부대의 비용 담보로 회사에 맡겨졌다. 카르나타카 나와브와 탄조르 왕의 칭호는 1855년 없어졌고, 바지 라오 2세의 양아들 나나 사힙은 연금 승계를 1851년 거부당했다. 아와드는 실권 원칙의 사례가 아니었다. 달하우지는 나와브 와지드 알리 샤가 실정을 한다는 상주 사절 슬리먼과 아웃램의 보고를 근거로 1856년 2월 병합을 선포했다(이 근거에는 반론이 있다). 와지드 알리 샤는 연금을 받으며 캘커타 교외 메티아브루즈로 옮겨 살았다. 달하우지는 1852년 제2차 영국–버마 전쟁으로 남버마의 페구까지 병합했다. 실권 원칙 병합으로 회사는 해마다 400만 파운드가량의 수입을 얻었다고 한다. 그러나 땅과 칭호를 잃은 군주와 지주, 아와드 출신이 많던 벵골군 병사의 반감이 쌓여 1857년 반란의 한 배경이 되었다(「세포이 항쟁(인도 대반란)과 무굴 제국의 끝(1857~1858)」, 뒤의 사건)."
