- id: nepal-unification-1768
  year: 1768
  endYear: 1804
  title:
    ko: "고르카의 네팔 통일과 팽창(1768~1804)"
  summary:
    ko: "카트만두 분지의 카트만두·파탄·박타푸르는 말라 왕가의 세 도시 왕국으로 갈라져 서로 다투고 있었다. 서쪽 산지의 소왕국 고르카의 왕 프리트비 나라얀 샤는 1744년 누와콧을 차지한 뒤 분지를 에워싸 소금 길을 끊고 키르티푸르를 1766년 무렵 함락시켰다. 카트만두 왕의 부탁을 받은 동인도 회사가 1767년 킨로크 대위의 원정대를 보냈으나 신둘리에서 고르카 군에게 졌다. 고르카는 1768년 카트만두와 파탄을, 1769년 4월 박타푸르를 차지하고 카트만두를 도읍으로 삼았다. 그는 1775년 죽기 전에 동쪽으로 티스타강 가까이 세력을 넓혔다. 뒤를 이은 프라탑 싱 샤(재위 1775~1777)와 어린 라나 바하두르 샤(재위 1777~1799) 시기에는 섭정 라젠드라 락슈미 왕비와 바하두르 샤 왕자가 다투었고, 그 사이에도 1782년 람중·타나훈, 1786년 베리 지역, 1789년 줌라, 1790년 쿠마온의 찬드 왕국과 도티가 고르카에 들어왔다. 1788~1792년 고르카가 티베트를 침입해 타시룬포 사원을 약탈하자 청이 군대를 보내 네팔을 물리쳤고, 네팔은 청에 조공하기로 했다(「건륭제의 십전무공(1747~1792)」, 앞의 사건). 1792년 회사와도 통상 조약을 맺었다. 1803~1804년에는 대지진으로 약해진 가르왈을 아마르 싱 타파가 점령하고, 서쪽 사틀레지강 쪽 펀자브 산지 토후국들로 세력을 뻗었다. 그러나 캉그라 요새를 에워싼 싸움(1806~1809)은 란지트 싱의 시크 군이 끼어들어 실패했다. 이 팽창으로 네팔은 동쪽 티스타강에서 서쪽 사틀레지강에 이르렀으나, 이는 곧 회사와 부딪치는 원인이 되었다(「영국–네팔 전쟁과 수가울리 조약(1814~1816)」, 뒤의 사건)."
  subjects: [nepal, kumaon-kingdom, garhwal-kingdom, punjab-hill-states, qing, company-india]
  links:
    - { from: nepal, to: kumaon-kingdom, note: "쿠마온 찬드 왕국을 점령 (1790)" }
    - { from: nepal, to: garhwal-kingdom, note: "가르왈 왕국을 점령 (1803~1804)" }
  tags: [war, politics]
  sources: ["John Whelpton, A History of Nepal (Cambridge University Press, 2005)", "Ludwig F. Stiller, The Rise of the House of Gorkha (Manjusri Publishing House, 1973)", "Leo E. Rose, Nepal: Strategy for Survival (University of California Press, 1971)"]

- id: ahom-moamoria-1769
  year: 1769
  endYear: 1805
  title:
    ko: "아홈의 모아모리아 반란(1769~1805)"
  summary:
    ko: "아홈 왕국은 1228년부터 브라마푸트라강 골짜기를 다스렸고, 농민(파이크)을 부역과 군역으로 동원하는 파이크 제도가 나라의 바탕이었다. 비슈누파의 마야마라 사트라(수도원) 신도인 모아모리아는 농민·장인·모란 같은 부족민이 많았고 부역 부담과 왕실의 압박에 불만이 컸다. 1769년 9월 관리가 모아모리아 수장 라가 네오그를 채찍질한 일을 계기로 반란이 일어났고, 그해 11월 반군은 수도 랑푸르와 가르가온을 차지하고 왕 락슈미 싱하(재위 1769~1780)를 사로잡았다. 왕은 1770년 4월 복위했으나 질서는 돌아오지 않았다. 왕실이 모아모리아 수천 명(추산)을 죽인 1782~1783년의 보복 학살 뒤 반란이 다시 커져 왕실은 서쪽 구와하티로 물러났다. 1792년 구와하티의 왕 가우리나트 싱하(재위 1780~1795)가 동인도 회사에 도움을 청하자 회사는 토머스 웰시 대위의 부대를 보냈고, 웰시는 1792년 11월 구와하티를 되찾고 1794년 3월 랑푸르를 차지했다. 그러나 총독 존 쇼어는 불간섭 방침에 따라 군대를 거두게 했다. 반란은 1805년 무렵 끝났고 반군은 마탁이라 불린 반독립 지역을 얻었다. 연구자들은 반란과 기근, 내전으로 상부 아삼 인구가 절반 안팎으로 줄었다고 말한다. 파이크 제도가 무너진 왕국은 봉급을 받는 인도 용병을 키웠으나 회복하지 못했고, 1817년 이후 버마의 침입을 받아 1826년 영국에 넘어갔다(「제1차 영국–버마 전쟁과 얀다보 조약, 아삼·마니푸르(1824~1826)」, 뒤의 사건). 반군에는 부족민과 농민, 일부 하급 귀족이 함께했고, 왕실 안에서도 부르하고하인·보르고하인 같은 대신 가문 사이의 권력 다툼이 반란과 얽혔다."
  subjects: [ahom-kingdom, company-india]
  tags: [war, society]
  sources: ["Edward Gait, A History of Assam (Thacker, Spink & Co., 1906)", "S. K. Bhuyan, Anglo-Assamese Relations, 1771–1826 (Department of Historical and Antiquarian Studies in Assam, 1949)", "Amalendu Guha, Medieval and Early Colonial Assam: Society, Polity, Economy (K. P. Bagchi, 1991)"]

- id: bengal-famine-1769
  year: 1769
  endYear: 1773
  title:
    ko: "1770년 벵골 대기근과 회사의 직접 징세(1769~1773)"
  summary:
    ko: "1768년 가을과 1769년 여름의 몬순이 약해 벵골과 비하르의 쌀 농사가 거듭 흉작이 되었고, 1769~1770년에 큰 기근이 닥쳤다. 사망자는 연구자에 따라 100만~1,000만 명으로 갈린다. 흔히 인용하는 700만~1,000만 명은 회사 이사회가 1770년 5월 주민의 3분의 1이라 쓴 판단과 워런 헤이스팅스가 1772년 같은 비율을 쓴 데서 이어진 값이다. 라자트 다타는 당시 숫자가 부풀려졌다며 120만 명 안팎을 제시하고, 팀 다이슨은 1,000만 명은 믿기 어렵다고 본다. 회사는 1765년 디와니를 얻은 뒤 토지세 징수를 청부에 넘겼고, 징수액은 몇 해 만에 30%가량 늘었다. 1770년 초 일부 관리가 세금 감면을 제안했으나 이뤄지지 않았고, 봄 수확이 나빠지자 평의회는 부나와브 무함마드 레자 칸의 조언으로 오히려 세금을 10% 올렸다. 회사의 직접 구호는 작았고 나와브 쪽은 곡식 모으기와 자선 급식에 나섰다. 중북부 벵골과 비하르의 티르후트·참파란이 특히 크게 당했고, 동쪽 델타는 상대적으로 덜 당했다. 농민이 땅을 버리고 천연두가 겹쳤다. 1772년 벵골 총독이 된 헤이스팅스는 이중 통치를 끝내고 회사 관리를 징세관으로 파견해 세금 걷기를 직접 맡았고 국고를 무르시다바드에서 캘커타로 옮겼으며, 레자 칸은 체포되어 조사를 받았다. 일부 학자는 회사의 징세 정책보다 날씨와 인구 압력의 비중이 컸다고 보지만, 기근은 회사 지배 비판의 상징이 되어 영국 의회가 인도 통치를 감독하는 규제법을 마련하는 배경이 되었다(「규제법과 워런 헤이스팅스의 벵골(1773~1785)」, 뒤의 사건). 벵골에서는 이 기근을 벵골력 1176년의 기근이라 기억하며 여러 문학 작품의 배경이 되었다."
  subjects: [company-india, uk]
  tags: [society, economy]
  sources: ["Rajat Datta, Society, Economy and the Market: Commercialization in Rural Bengal c.1760–1800 (Manohar, 2000)", "Tim Dyson, A Population History of India: From the First Modern People to the Present Day (Oxford University Press, 2018)", "P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)"]

- id: rohilla-war-1773
  year: 1773
  endYear: 1775
  title:
    ko: "로힐라 전쟁과 아와드의 팽창(1773~1775)"
  summary:
    ko: "로힐칸드는 갠지스강 위쪽 도아브 북동쪽 평원으로, 18세기 중엽 아프간계 로힐라 수령들이 다스렸다. 1772년 마라타가 로힐칸드를 침입하자 하피즈 라흐마트 칸이 아와드 나와브 슈자 웃다울라에게 도움을 청하고 보수로 40락(400만) 루피를 약속했으나 마라타가 물러난 뒤 지키지 않았다. 슈자 웃다울라는 로힐칸드를 아와드에 합치려 했고, 1773년 9월 바라나시에서 워런 헤이스팅스는 회사군을 빌려주는 대가로 40락 루피를 받기로 슈자 웃다울라와 합의했다. 1774년 4월 23일 미란푸르 카트라에서 알렉산더 챔피언이 이끈 회사군과 아와드군이 로힐라군을 꺾었고 하피즈 라흐마트 칸이 전사했다. 파이줄라 칸이 이끄는 나머지 세력은 산지로 물러났다가 1774년 10월 7일 랄당 조약으로 람푸르 일대만 영지로 얻었고 이 땅이 람푸르 토후국의 시작이 되었다. 로힐칸드는 아와드에 병합되었고, 많은 로힐라 사람들이 떠나거나 약탈을 겪었다. 이 일은 뒤에 헤이스팅스가 탄핵 재판에서 한 나라를 파괴했다는 공격을 받는 근거가 되었다(「규제법과 워런 헤이스팅스의 벵골(1773~1785)」, 같은 시기의 사건). 슈자 웃다울라는 1775년 1월 죽고 아들 아사프 웃다울라가 뒤를 이었다. 그는 1775년 파이자바드 조약으로 바라나시 지부를 회사에 넘기고 회사군 주둔 비용을 늘려 받아들였으며, 도읍을 파이자바드에서 러크나우로 옮겼다. 이 조약은 아와드가 회사의 인도 지배에 기대는 길로 들어서는 첫걸음이 되었다. 로힐라는 18세기 초 아프간계 이주 병사들이 알리 무함마드 칸 아래 로힐칸드에 자리 잡은 집단으로, 무굴이 쇠퇴하던 때에는 델리 정치에도 개입했다. 연구자들은 헤이스팅스가 군대를 빌려준 데에는 아와드를 마라타와 로힐라에 맞서는 완충지로 삼으려는 계산이 있었다고 본다."
  subjects: [rohilkhand, awadh, company-india]
  links:
    - { from: awadh, to: rohilkhand, note: "회사의 도움으로 로힐칸드를 병합 (1774)" }
    - { from: awadh, to: company-india, note: "파이자바드 조약으로 바라나시 지부를 넘김 (1775)" }
  tags: [war, politics]
  sources: ["P. J. Marshall, The Impeachment of Warren Hastings (Oxford University Press, 1965)", "Richard B. Barnett, North India Between Empires: Awadh, the Mughals, and the British, 1720–1801 (University of California Press, 1980)", "Chris Bayly, Rulers, Townsmen and Bazaars: North Indian Society in the Age of British Expansion, 1770–1870 (Cambridge University Press, 1983)"]

- id: hastings-regulating-1773
  year: 1773
  endYear: 1785
  title:
    ko: "규제법과 워런 헤이스팅스의 벵골(1773~1785)"
  summary:
    ko: "동인도 회사는 1772년 벵골 기근과 전쟁 비용으로 재정이 무너져 영국 정부에 대출을 청했고, 영국 의회는 1773년 규제법으로 회사를 감독하기 시작했다. 이 법은 벵골 총독을 인도 전체를 아우르는 총독으로 올려 마드라스·봄베이 관구가 외교와 전쟁에서 그에게 따르게 했고, 총독을 포함한 평의회 다섯 명이 다수결로 다스리게 했으며, 캘커타에 대법원을 두었다. 초대 총독은 헤이스팅스(재임 1773~1785)였다. 그는 평의회의 필립 프랜시스·클레버링 등과 심하게 다투었고, 대법원장 일라이자 임페이가 1775년 벵골 브라만 난다쿠마르를 문서 위조죄로 교수형에 처한 일은 정적 제거라는 비판을 불렀다. 헤이스팅스는 징세와 재판 제도를 고쳐 회사 관리가 지방 징세와 민사 재판을 맡게 했고, 아랍·페르시아 학문을 배우는 캘커타 마드라사(1781)와 윌리엄 존스의 아시아 협회(1784)를 후원했다. 한편 그는 바라나시 라자 체이트 싱에게 군비를 거듭 요구해 1781년 반란을 부르고, 아와드의 베굼(왕대비)들에게서 돈을 거둔 일로 비판받았다. 제1차 마라타 전쟁·마이소르 전쟁의 비용이 겹쳤다. 1784년 피트의 인도법은 의회가 임명하는 통제 위원회를 세워 회사의 정치 사무를 정부가 쥐게 했다(회사는 무역과 관리 임명권을 유지). 헤이스팅스는 1785년 2월 귀국했고 에드먼드 버크의 주도로 탄핵되어 1788년부터 재판을 받았으나 1795년 무죄로 풀려났다. 총독 자리는 존 맥퍼슨의 대행을 거쳐 1786년 콘월리스에게 넘어갔다. 같은 1773년 영국 의회는 회사를 구제하려 차 조례를 통과시켰고, 이 조례는 12월 북아메리카 식민지의 보스턴 차 사건을 불렀다."
  subjects: [company-india, uk, awadh]
  links:
    - { from: uk, to: company-india, note: "규제법(1773)과 인도법(1784)으로 회사의 인도 통치를 의회·통제 위원회 감독 아래 둠" }
  tags: [politics, economy]
  sources: ["P. J. Marshall, The Impeachment of Warren Hastings (Oxford University Press, 1965)", "P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)", "「규제법」(Regulating Act, 1773)", "「피트의 인도법」(India Act, 1784)"]

- id: first-anglo-maratha-war-1775
  year: 1775
  endYear: 1782
  title:
    ko: "제1차 마라타 전쟁과 살바이 조약(1775~1782)"
  summary:
    ko: "1773년 페슈와 나라얀 라오가 암살된 뒤 숙부 라구나트 라오가 페슈와 자리를 주장했으나, 나나 파드나비스가 이끄는 열두 대신이 어린 사와이 마다브 라오를 세우고 섭정했다. 1775년 3월 봄베이의 회사는 수라트 조약으로 라구나트를 돕고 살세트·바세인을 얻기로 했고, 이를 시작으로 전쟁이 일어났다. 캘커타의 평의회는 이를 취소하고 1776년 3월 푸란다르 조약으로 라구나트에게 연금을 주려 했으나 봄베이는 그를 계속 보호했다. 1779년 1월 와드가온에서 회사군이 포위되어 조약(1월 16일)에 서명했지만 헤이스팅스가 이를 부인했다. 토머스 고더드는 1779년 2월 아흐메다바드를 점령하고 1780년 12월 바세인을 차지했고, 1780년 8월 포팜 대위는 고하드의 라나의 도움으로 괄리오르 요새를 점령했다. 중부 인도에서는 마하지 신디아와 영국 장교 캐맥의 군이 승패를 주고받았고, 1781년 4월 고더드는 보르 고개에서 마라타군에게 크게 졌다. 1779년 하이데라바드의 니잠과 마이소르의 하이데르 알리가 마라타와 손잡아 영국에 맞서면서 회사는 여러 전선에 얽혔다. 마하지 신디아가 중재해 1782년 5월 17일 헤이스팅스와 살바이 조약을 맺었고, 마라타 쪽 비준은 1783년 2월 나나 파드나비스가 했다. 조약으로 회사는 라구나트를 버리고 마다브 라오 2세를 페슈와로 인정했으며 살세트를 지켰고, 정복지를 돌려주었으며 야무나강 서쪽 마라타의 영역을 인정했다. 이후 약 20년 동안 영국과 마라타 사이에는 큰 전쟁이 없었고, 회사는 마이소르에 집중했다. 봄베이의 회사는 이미 1774년 12월 살세트 섬을 점령해 두고 있었다. 나나 파드나비스는 이 전쟁 뒤에도 1800년 죽을 때까지 푸네 정부의 실권을 쥐었다."
  subjects: [maratha-peshwa, company-india, gwalior-state, hyderabad-state, mysore, uk]
  links:
    - { from: company-india, to: maratha-peshwa, note: "살바이 조약으로 정복지를 돌려주고 라구나트 지원을 거둠 (1782)" }
  tags: [war, diplomacy]
  sources: ["Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "G. S. Sardesai, New History of the Marathas, Vol. 3: Sunset over Maharashtra, 1772–1848 (Phoenix Publications, 1948)", "Randolf G. S. Cooper, The Anglo-Maratha Campaigns and the Contest for India (Cambridge University Press, 2003)"]

- id: mahadji-sindhia-1783
  year: 1783
  endYear: 1803
  title:
    ko: "마하지 신디아와 델리의 무굴 황제(1783~1803)"
  summary:
    ko: "마하지 신디아는 신디아 가문의 마라타 장군으로, 파니파트 전투(1761)에서 부상을 입고 살아남아 북인도의 마라타 세력을 되살렸다. 1771~1772년 그는 앨라하바드에 머물던 무굴 황제 샤 알람 2세를 마라타의 보호 아래 델리로 데려갔고, 1782년 살바이 조약을 중재했으며, 1783년 괄리오르 요새를 차지했다. 1784년 샤 알람 2세는 페슈와를 황제 대리(바킬 이 무틀라크)로 임명하고 마하지를 그 부관으로 세워 델리의 행정과 군대를 맡겼다. 마하지는 브누아 드 부안 같은 유럽 장교가 훈련한 정규 보병과 포병을 키웠다. 1787년 9월 자이푸르·조드푸르의 라지푸트 군이 랄소트에서 그를 막았으나, 1790년 파탄과 메르타에서 이겨 두 나라를 조공국으로 만들었다. 1788년 로힐라 수령 굴람 카디르가 델리를 점령해 샤 알람 2세의 눈을 멀게 하자 마하지는 같은 해 10월 2일 델리를 되찾고 굴람 카디르를 처형했다. 마하지는 1794년 2월 푸네 근처 진영에서 죽었고 형 투코지의 손자인 다울라트 라오 신디아가 열다섯 살로 뒤를 이었다. 델리의 황제는 마라타의 보호 아래 이름뿐인 군주로 남았다. 같은 때 남쪽에서는 마이소르의 티푸 술탄이 회사와 싸우고 있었다(「티푸 술탄과 제3·4차 마이소르 전쟁, 와디야르 가문의 복위(1782~1799)」, 앞의 사건). 1803년 9월 11일 제럴드 레이크가 이끈 회사군이 델리 근교에서 신디아의 프랑스인 장교 지휘 군대를 꺾고 델리에 들어가 눈먼 황제를 회사의 보호 아래 두었고, 12월 30일 수르지–안장가온 조약으로 신디아는 도아브·델리·아그라 일대를 회사에 넘겼다(「제2차 마라타 전쟁과 델리·오리사의 병합(1802~1805)」). 무굴 황제의 보호자가 마라타에서 회사로 바뀐 것이다. 드 부안이 1795년 물러난 뒤에는 프랑스인 피에르 페롱이 군을 맡았다. 샤 알람 2세는 1806년 죽고 아들 아크바르 2세(재위 1806~1837)와 바하두르 샤 2세(재위 1837~1857)가 무굴 황제 자리를 이었으며, 이들은 회사의 연금을 받는 이름뿐인 황제였다."
