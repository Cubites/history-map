- id: buxar-1764
  year: 1764
  endYear: 1765
  title:
    ko: "북사르 전투와 알라하바드 조약, 벵골 디와니(1764~1765)"
  summary:
    ko: "벵골 나와브 미르 카심은 1760년 나와브에 오른 뒤 도읍을 뭉게르로 옮기고 군대를 서양식으로 키웠으며, 1763년 국내 통행세를 모두 없애 회사 상인의 관세 면제 특권이 가져온 불공평을 없애려 했다. 회사는 이를 거부하고 같은 해 7월 미르 자파르를 다시 나와브에 앉혔다. 미르 카심의 군이 파트나에서 영국인 포로와 회사 직원 약 45~58명이 죽는 파트나 학살(1763년 10월, 자료에 따라 100명이 넘는다는 서술도 있다)이 벌어졌고, 그는 곧 패해 아와드로 달아났다. 그는 아와드의 나와브 슈자 웃다울라와 아와드에 머물던 무굴 황제 샤 알람 2세와 손잡았고, 연합군은 1764년 10월 22일 북사르에서 헥터 먼로가 이끈 회사군(약 7,000명)과 싸워 졌다. 연합군은 수적으로 훨씬 많았으나(추산 4만 명 안팎) 지휘가 흩어져 있었다. 미르 자파르는 1765년 2월 죽고 아들 나짐 웃다울라가 나와브에 올랐는데, 회사는 그에게 군대를 해산하게 하고 행정권을 회사가 뽑은 부나와브 무함마드 레자 칸에게 맡기게 했다. 1765년 8월 클라이브는 알라하바드에서 두 조약을 맺었다. 샤 알람 2세는 벵골·비하르·오리사의 디와니(토지세를 걷는 권리)를 회사에 주고 해마다 260만 루피를 받기로 했다. 슈자 웃다울라는 배상금 500만 루피를 물고 코라와 알라하바드를 황제에게 넘기되 아와드 본토는 지켰다. 그 결과 회사는 세금을 걷고 군대를 쥐는 한편 치안과 재판은 나와브 이름으로 맡기는 이중 통치를 벵골에 세웠고, 이 체제는 1770년 대기근과 함께 비판받았다. 클라이브는 1765년 5월 벵골 총독으로 돌아와 협상을 이끌었다. 샤 알람 2세는 알라하바드에서 회사의 보호를 받다가 1772년에야 마라타의 호위로 델리에 돌아갔다. 회사는 이로써 인도에서 교역 단체이면서 벵골의 세금을 거두는 영토 정부를 겸하게 되었다."
  subjects: [bengal-nawabs, company-india, awadh, uk]
  links:
