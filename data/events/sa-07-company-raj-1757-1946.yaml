# 남아시아 사건 7차 묶음(sa-07): 동인도 회사에서 영국령 인도의 끝까지 — 플라시 전투에서 내각 사절단까지 (1757 ~ 1946년)
# 범위: 플라시 전투와 벵골 디와니·카르나타카 전쟁·두라니의 인도 침입과 제3차 파니파트 전투·시크 미슬과 란지트 싱의 시크 제국·네팔 통일과 영국–네팔 전쟁·벵골 기근과 규제법·마이소르 전쟁과 티푸 술탄·마라타 전쟁 세 차례·영구 정액제·
#   웰즐리의 보조 동맹·실론의 점령과 칸디 병합·탈푸르 왕조와 신드 병합·아홈의 모아모리아 반란과 제1차 버마 전쟁·벤팅크의 개혁과 매콜리의 영어 교육·잠무 도그라의 라다크 정복·제1차 아프가니스탄 전쟁·시크 전쟁과 잠무 카슈미르·달하우지의 실권 원칙 병합·
#   철도와 전신·세포이 항쟁(인도 대반란), 영국 정부의 직할 통치와 빅토리아 여왕의 선언·잠무 카슈미르 주와 길기트·시킴의 툼롱 조약·부탄의 두아르 전쟁과 왕정·1876~1878년 대기근과 인도 여제 선포·칼라트와 영국령 발루치스탄·
#   인도 국민 회의·아삼 변경의 편입과 마니푸르 전쟁·듀랜드선과 치트랄 원정·벵골 분할과 스와데시·무슬림 연맹과 러크나우 협정·심라 회의와 맥마흔선·1차 세계 대전과 인도·암리차르 학살과 1919년 개혁·
#   비협조·킬라파트 운동·토후국과 최고권·네팔–영국 조약과 라나 체제·사이먼 위원회와 원탁 회의·소금 행진과 푸나 협정·실론의 도너모어 헌법·1935년 인도 통치법·라호르 결의·2차 세계 대전과 크립스 사절단·
#   인도를 떠나라 운동·벵골 기근·인도 국민군·왕립 인도 해군 반란·내각 사절단과 임시 정부.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다. 총독(Governor-General)과 부왕(Viceroy) 재임은 위키백과 목록을 따랐고 대행도 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 그 이름이 쓰이던 때의 이야기는 옛 이름(처음 한 번 괄호로 지금 이름: 캘커타(지금 콜카타), 실론은 1972년 앞)으로 적었다.
#   이름이 갈리는 일(1857년 항쟁의 '세포이 항쟁'·'인도 대반란'·'제1차 독립 전쟁')은 양쪽 이름을 함께 적었다. 사망자·기근 숫자는 당사자 발표와 연구자 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다.
#   양쪽의 가해와 민간인 피해는 주어를 밝혀 함께 적었고, 종교·공동체 갈등은 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(외교 혁명과 7년 전쟁, 건륭제의 십전무공(1747~1792), 프랑스의 이집트·시리아 원정(1798~1801), 무함마드 샤와 헤라트 문제·영국–이란 전쟁(1834~1857),
#   그레이트 게임과 판데 사건, 파미르 분쟁과 파미르 경계 협정, 영국의 티베트 침입과 청의 티베트 직접 통치 시도, 1차 세계 대전의 중동 전선, 세브르 조약과 튀르키예 독립 전쟁, 로잔 조약과 튀르키예 공화국, 대공황, 태평양 전쟁 발발,
#   영국령 인도의 분할과 난민, 토후국의 통합, 인도와 부탄·시킴의 조약, 네팔 라나 체제의 끝, 실론의 독립과 시민권법).

- id: plassey-1757
  year: 1757
  endYear: 1760
  title:
    ko: "플라시 전투와 미르 자파르의 벵골(1757~1760)"
  summary:
    ko: "벵골 나와브 시라지 웃다울라는 1756년 6월 영국 동인도 회사가 캘커타(지금 콜카타) 요새를 고치고 상인들이 관세 면제 특권을 사사로이 쓴다는 이유로 캘커타를 공격해 차지했다. 이때 포로를 가둔 좁은 방에서 사람들이 죽은 '블랙홀' 사건을 포로였던 홀웰은 146명 가운데 123명이 죽었다고 썼으나, 오늘날 연구자들은 이 숫자가 크게 부풀려졌다고 본다. 1757년 1월 마드라스에서 온 로버트 클라이브와 해군 제독 왓슨이 캘커타를 되찾았고, 영국과 프랑스가 7년 전쟁에 들어간 터라 3월에는 프랑스 상관 찬데르나고르를 점령했다(「외교 혁명과 7년 전쟁」, 앞의 사건). 6월 23일 플라시(팔라시)에서 클라이브의 병력 약 3,000명(영국인 약 800명과 인도인 병사)이 시라지 웃다울라의 군 약 5만 명과 맞섰다. 시라지의 총사령관 미르 자파르는 미리 클라이브와 약속하고 군을 움직이지 않았고, 몇 시간의 포격전 끝에 나와브군은 흩어졌다. 시라지는 도망치다 붙잡혀 7월 초 살해되었다. 회사는 미르 자파르를 나와브에 올리는 대가로 거액의 보상금과 캘커타 남쪽 24개 파르가나의 지주권을 받았다. 클라이브 개인이 받은 거액의 선물은 1772~1773년 영국 의회의 조사 대상이 되었다. 미르 자파르는 약속한 돈과 회사 군대의 비용을 대지 못해 쪼들렸고, 회사는 1760년 10월 그를 물러나게 하고 사위 미르 카심을 나와브에 세웠다. 플라시는 군사적으로 큰 싸움이라기보다 매수와 음모로 이긴 전투였으나, 이를 계기로 회사는 교역 단체에서 벵골의 군주를 세우고 내리는 세력이 되었다. 당시 벵골은 상공업이 발달한 인도의 부유한 지방이었고, 음모에는 무르시다바드의 대은행가 자가트 세트 가문 등 벵골 상인과 은행가가 가담했다. 회사는 이후 벵골의 세금과 교역에서 얻은 수입으로 군대를 키워 다른 지역으로 나아갔다."
