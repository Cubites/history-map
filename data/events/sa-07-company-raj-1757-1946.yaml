- id: second-anglo-maratha-war-1802
  year: 1802
  endYear: 1805
  title:
    ko: "제2차 마라타 전쟁과 델리·오리사의 병합(1802~1805)"
  summary:
    ko: "1802년 10월 인도르의 홀카르가 푸네에서 페슈와 바지 라오 2세와 신디아의 연합군을 꺾자 페슈와는 영국에 몸을 맡겨 12월 바세인 조약을 맺었다. 이 조약으로 페슈와는 회사군을 상주시키고 그 비용으로 땅을 넘기며 외교를 회사와 상의하기로 했다. 괄리오르의 신디아와 나그푸르의 본슬레는 이를 마라타의 독립을 해치는 일로 보고 맞섰고, 1803년 8월 전쟁이 일어났다. 아서 웰즐리(뒷날의 웰링턴 공)는 데칸에서 아흐마드나가르를 차지하고 9월 23일 아사예에서 신디아·본슬레 연합군을 격파했으며 11월 29일 아르가온에서 본슬레를 꺾었다. 북쪽에서는 제럴드 레이크가 9월 알리가르를 점령하고 9월 11일 델리 근교에서 신디아의 군을 물리쳤으며 11월 라스와리에서 이겼다. 1803년 12월 17일 데오가온 조약으로 본슬레는 카타크(오리사 해안)와 발레슈와르를 회사에 넘겼고, 12월 30일 수르지–안장가온 조약으로 신디아는 도아브·델리·아그라, 분델칸드 일부, 브로치 등을 넘겼다. 신디아와 달리 홀카르는 1804년 4월 영국에 전쟁을 선포하고 유격전으로 처음에는 영국군을 괴롭혔으나, 영국이 1805년 초 바라트푸르 요새를 에워싸고도 점령하지 못하는 가운데 힘이 빠져 1805년 12월 24일 라지가트 조약으로 화의했다. 웰즐리는 막대한 전비로 1805년 7월 소환되었고, 후임 콘월리스는 두 번째 임기 석 달 만인 10월에 죽었으며, 대행 조지 발로는 신디아에게 괄리오르와 고하드를 돌려주는 등 불간섭 정책으로 돌아섰다. 이 전쟁으로 회사는 델리와 도아브, 오리사 해안을 얻어 북인도와 동해안을 하나로 이었고, 페슈와는 이름만 남았다."
