- id: railways-telegraph-1853
  year: 1853
  endYear: 1857
  title:
    ko: "철도·전신·우편과 우드의 교육 보고서(1853~1857)"
  summary:
    ko: "달하우지는 1853년 4월 철도 건의서에서 간선 철도망의 얼개를 밝혔다. 철도는 영국 민간 회사가 짓고 회사 정부가 5%의 이자를 보증하는 방식이었으며, 수익이 모자라면 인도의 세입으로 메웠다. 인도 첫 여객 철도는 1853년 4월 16일 봄베이–타나(약 34km) 구간에서 달렸고, 1854년 8월 캘커타 근교 하우라–후글리, 1856년 7월 마드라스 로야푸람–왈라자로드 구간이 이어졌다. 철도는 면화·황마·곡물을 항구로 옮기고 영국산 제품을 내륙에 들였으며 군대를 빠르게 움직이게 했다. 한편 윌리엄 오쇼네시가 1851년 캘커타–다이아몬드 하버에 시험선을 놓은 전신은 1854년 전신법 뒤 캘커타–아그라–봄베이·마드라스를 잇는 선으로 늘어났다. 1854년 우편법은 전국에 균일한 요금을 도입했고, 같은 해 갠지스 운하(로르키)가 열려 서북 지방의 관개가 늘었다. 이해 7월 찰스 우드의 교육 보고서는 지방마다 학교를 세우고 대학을 두라고 권고해 1857년 캘커타·봄베이·마드라스 대학이 문을 열었다. 이 시설들은 시장 통합과 행정, 군 이동을 쉽게 해 식민 통치의 힘이 되었고, 철도가 기근 때 곡식 수송에 쓰였다는 평가도 있다. 반면 민족주의 경제학자들은 보증 이자와 영국산 자재 구매가 인도 재정에 짐을 지웠다고 비판했다. 1857년 반란 때는 전신이 영국군의 연락에 쓰였고, 철도와 전신선은 반란군의 공격 대상이기도 했다. 1854년에는 공공사업부를 세워 도로·운하·관개를 총괄하게 했다. 1853년 봄베이–타나 구간은 대인도 반도 철도 회사가, 1854년 하우라–후글리 구간은 동인도 철도 회사가 놓았다. 1856년까지 전신선은 캘커타에서 아그라를 거쳐 펀자브와 봄베이·마드라스까지 이어졌다."
  subjects: [company-india, uk]
  tags: [economy, society]
  sources: ["Ian J. Kerr, Building the Railways of the Raj, 1850–1900 (Oxford University Press, 1995)", "Daniel R. Headrick, The Tentacles of Progress: Technology Transfer in the Age of Imperialism, 1850–1940 (Oxford University Press, 1988)", "Thomas R. Metcalf·Barbara D. Metcalf, A Concise History of Modern India (Cambridge University Press, 2012)"]

- id: indian-rebellion-1857
  year: 1857
  endYear: 1858
  title:
    ko: "세포이 항쟁(인도 대반란)과 무굴 제국의 끝(1857~1858)"
  summary:
    ko: "1857년의 봉기는 영국 쪽에서 '세포이 항쟁', 오늘날 연구에서 '인도 대반란'이라 부르고 인도에서는 '제1차 독립 전쟁'이라는 이름도 쓰인다. 5월 10일 메러트에서 벵골군 기병 85명이 새 엔필드 소총 탄약통(소·돼지 기름을 발랐다는 소문이 돌았다)을 거부해 징역을 받자 동료 병사들이 이들을 풀어 주고 영국 장교와 가족을 죽인 뒤 델리로 갔다. 5월 11일 델리에 들어간 병사들은 81세의 무굴 황제 바하두르 샤 2세를 황제로 추대했고, 황제는 마지못해 응했다고 전해진다. 7월 1일 바레일리의 부대를 이끌고 델리에 온 박트 칸이 총사령관을 맡았다. 5월 16일 궁정 안에서 영국인 포로와 숨은 민간인 50명가량이 죽었다. 원인으로는 탄약통뿐 아니라 1856년 아와드 병합, 실권 원칙, 무거운 지세, 선교와 개혁에 대한 불안, 해외 근무 규정이 꼽힌다. 칸푸르에서는 나나 사힙 쪽이 6월 사티차우라 가트에서 영국인 남자들을 죽였고 7월 15일 비비가르에서 여성과 아이 약 200명이 살해되었다. 영국군은 칸푸르를 되찾으며 반란군 포로를 대포에 묶어 쏘고 마을을 불태우는 보복을 했다. 러크나우에서는 6월부터 11월까지 영국 거주지가 포위되었고 하즈라트 마할이 아들 비르지스 카디르를 아와드의 나와브로 세웠다. 시크와 구르카, 네팔의 장 바하두르 라나가 보낸 군대, 신디아와 하이데라바드 니잠 같은 토후국들의 협력으로 영국은 9월 20일 델리를 되찾고 황제를 붙잡았다. 델리를 되찾은 영국군은 도시에서 약탈과 민간인 살해를 일으켰고 많은 주민이 도시 밖으로 쫓겨났으며, 아와드 등지에서도 마을을 불태우는 보복이 이어졌다. 황제의 아들 둘은 허드슨이 사살했다. 바하두르 샤 2세는 1858년 초 재판을 받고 랑군으로 유배되어 1862년 죽었고, 이로써 무굴 제국이 끝났다. 잔시의 락슈미바이는 1858년 6월 괄리오르에서 전사했다. 전투는 1858년 6월 괄리오르의 패배로 사실상 끝났고 공식 종전은 1859년 7월이다. 사망자는 영국 쪽 약 6,000명(민간인 포함)이고, 인도 쪽은 전투와 보복, 뒤따른 기근과 질병까지 80만 명 안팎이라는 대략적 추산이 있으나 기초 자료가 빈약하다. 1858년 8월 인도 통치법으로 회사의 통치권이 영국 왕실로 넘어갔다(「영국 정부의 직할 통치와 빅토리아 여왕의 선언(1858)」, 뒤의 사건)."
