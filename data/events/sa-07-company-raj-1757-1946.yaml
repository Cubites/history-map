- id: ranjit-singh-1799
  year: 1799
  endYear: 1839
  title:
    ko: "란지트 싱의 시크 제국(1799~1839)"
  summary:
    ko: "란지트 싱은 수케르차키아 미슬의 수령으로, 1799년 7월 두라니의 자만 샤가 물러난 틈에 라호르를 차지했고 1801년 4월 12일 라호르 요새에서 마하라자(대왕)에 올랐다. 그는 1805년 암리차르를 합치고 1807년 카수르를 차지했다. 인도에서 세력을 넓히던 영국 동인도 회사와는 1809년 4월 25일 토머스 메트칼프와 암리차르 조약을 맺어 서틀레지강 동쪽 펀자브 토후국들(파티알라·진드·나바 같은 시크 토후국들)을 영국의 보호 아래 두는 대신 그 서쪽으로 뻗는 길을 얻었다. 그해 그는 구르카에 눌려 있던 캉그라 등 펀자브 산지 토후국들을 도와 포위를 풀어 주며 요새를 넘겨받았다. 이어 서쪽으로 나아가 1818년 물탄, 1819년 카슈미르(소피안 전투에서 두라니 총독 자바르 칸을 격파), 1823년 노셰라 싸움으로 페샤와르의 바라크자이 형제를 조공국으로 삼았고 1834년 페샤와르를 병합했다. 군대는 알라르·벤투라 같은 프랑스·이탈리아 장교를 써서 보병과 포병을 서양식으로 키웠고, 코이누르 다이아몬드는 1813년 폐위된 샤 슈자에게서 받았다. 주민은 자료에 따라 무슬림이 약 70~80%로 다수였고 힌두와 시크는 소수였는데 란지트는 세 종교의 사람을 모두 관리와 장교로 썼으며 하르만디르 사힙(황금 사원)을 금으로 장식했다. 두라니 제국은 이 정복으로 인더스강 동쪽 땅 전부와 페샤와르를 잃었고, 1826년 무렵 바라크자이 가문이 카불을 차지하면서 두라니 왕가의 지배가 끝났다. 란지트가 죽은 이듬해인 1840년에는 장군 벤투라가 만디와 쿨루 일대의 산지 토후국들을 점령해 시크 제국의 조공 아래 두었다. 란지트는 1839년 6월 27일 죽었고, 카락 싱, 나우 니할 싱, 찬드 카우르, 셰르 싱을 거쳐 1843년 어린 둘립 싱이 오를 때까지 궁정은 파벌 다툼에 흔들렸다. 그는 징세 제도를 정비하고 라호르에 주조소를 두었으며 암리차르를 상업 중심지로 키웠다. 1831년 10월에는 로파르에서 총독 벤팅크와 만나 우호 관계를 확인했다."
