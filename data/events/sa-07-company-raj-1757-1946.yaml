- id: permanent-settlement-1786
  year: 1786
  endYear: 1793
  title:
    ko: "콘월리스와 영구 정액제(1786~1793)"
  summary:
    ko: "찰스 콘월리스는 헤이스팅스를 이은 존 맥퍼슨의 대행 기간을 지나 1786년 9월 총독에 올랐다(재임 1786~1793). 그는 회사 관리가 사무역과 선물로 수입을 챙기던 관행을 막으려고 봉급을 크게 올리고 사무역을 금했다. 1793년 법전(콘월리스 법전)으로 징세관이 재판권을 잃어 징세와 재판이 갈렸고, 유럽인만 고위 행정직에 오르게 해 인도인은 낮은 자리에 머물렀다. 가장 큰 일은 토지세 제도였다. 1789년 10년 정액으로 먼저 시행한 뒤 1793년 3월 벵골·비하르·오리사 일부에서 세액을 영원히 고정하는 영구 정액제(영구 정착)를 선포했다. 자민다르(징세 청부인)는 땅의 소유자가 되어 정해진 세금을 해가 지기 전까지 내야 했고(이른바 '일몰 법'), 내지 못하면 땅이 경매에 넘어갔다. 그 결과 오래된 대자민다르 가문 가운데 상당수가 땅을 잃고 새 지주와 도시 상인 지주가 들어섰으며, 소작인(라이야트)의 관습상 권리는 지주의 뜻에 맡겨졌다. 회사는 세입이 안정되고 지주 계층의 충성을 얻었으나, 세액이 고정된 탓에 이후 늘어난 지대 수입은 지주에게 돌아갔다. 한편 콘월리스는 1788년 하이데라바드 니잠 쪽에 있던 구토르 지구를 회사 관리 아래 넣었고 제3차 마이소르 전쟁(「티푸 술탄과 제3·4차 마이소르 전쟁, 와디야르 가문의 복위(1782~1799)」, 앞의 사건)을 이끌었다. 총독 자리는 1793년 존 쇼어가 이었다. 필립 프랜시스가 1776년에 먼저 영구 정액제를 제안했고, 콘월리스는 영국식 지주 계급을 인도에 세워 회사의 통치를 안정시키려는 구상을 따랐다. 이 제도는 1795년 바라나시에도 적용되었지만 마드라스와 봄베이에서는 뒤에 농민과 직접 계약하는 라이야트와리 제도가 따로 쓰였다. 콘월리스는 경찰 구역과 지방 법원도 새로 짜서 유럽인 판사가 지방을 순회하게 했다."
  subjects: [company-india, hyderabad-state, uk]
  tags: [economy, politics, society]
  sources: ["Ranajit Guha, A Rule of Property for Bengal: An Essay on the Idea of Permanent Settlement (Mouton, 1963)", "Sirajul Islam, The Permanent Settlement in Bengal: A Study of Its Operation 1790–1819 (Bangla Academy, 1979)", "P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)"]

- id: ceylon-british-1796
  year: 1796
  endYear: 1815
  title:
    ko: "영국의 실론 점령과 칸디 왕국의 병합(1796~1815)"
  summary:
    ko: "실론 섬의 해안 지대는 17세기 중반부터 네덜란드 동인도 회사가 다스렸고(네덜란드령 실론), 내륙 산악에는 칸디 왕국이 남아 있었다. 프랑스 혁명군이 네덜란드를 점령하자 오라녀 공 빌럼 5세는 1795년 큐 서한으로 식민지를 영국의 보호에 맡기라고 지시했다. 영국 동인도 회사의 마드라스 군은 1795년 트링코말리를 차지하고 1796년 2월 콜롬보의 항복을 받아 네덜란드령 해안을 얻었다. 영국령 실론은 처음 마드라스 관구가 다스렸고, 1802년 아미앵 조약으로 네덜란드가 실론을 영국에 넘기면서 왕령 식민지가 되었다. 영국은 내륙으로 눈을 돌렸다. 1803년 영국군이 칸디에 들어가 무투사미를 허수아비 왕으로 세웠으나 칸디 쪽의 반격과 질병으로 큰 피해를 입고 물러났다. 칸디의 왕 스리 위크라마 라자싱하(재위 1798~1815)는 귀족들과 불화했고, 총독 로버트 브라운리그는 이를 이용해 1815년 2월 칸디로 진군했다. 1815년 3월 2일 칸디 협약으로 귀족들이 왕의 폐위를 선언하고 섬 전체가 영국 왕실 아래 들어갔으며, 협약은 불교와 귀족의 관습상 권리를 지키겠다고 약속했다. 왕은 인도 벨로르 요새에 유배되어 1832년 무렵 죽었다. 약속과 달리 귀족의 권한이 줄고 불교 보호가 느슨해지자 1817~1818년 우바 반란이 일어났고 영국군이 진압했다(반란군 쪽 사망은 8,000~1만 명으로 추산한다). 이로써 섬 전체가 외세의 통치 아래 들어갔다. 프레더릭 노스가 1798년 첫 문관 총독으로 부임해 마드라스의 지배를 끝냈다. 해안 지대에서는 계피(시나몬)·진주·코끼리 교역이 주요 수입이었다. 칸디 왕국은 1739년부터 남인도 출신 나야크 왕가가 왕위를 이어 불교를 후원했으나 귀족들과의 갈등이 잦았다."
  subjects: [dutch-ceylon, british-ceylon, kandy, uk, netherlands, company-india]
  links:
