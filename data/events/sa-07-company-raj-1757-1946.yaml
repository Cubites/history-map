  sources: ["Stewart Gordon, Marathas, Marauders, and State Formation in Eighteenth-Century India (Oxford University Press, 1994)", "Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "William Dalrymple, The Anarchy: The East India Company, Corporate Violence, and the Pillage of an Empire (Bloomsbury, 2019)"]

- id: tipu-sultan-1782
  year: 1782
  endYear: 1799
  title:
    ko: "티푸 술탄과 제3·4차 마이소르 전쟁, 와디야르 가문의 복위(1782~1799)"
  summary:
    ko: "티푸 술탄은 아버지 하이데르 알리가 죽은 1782년 12월 마이소르의 통치자가 되었다. 그는 유럽식으로 훈련한 보병과 철제 통을 쓴 로켓 부대를 키우고, 새 역법과 주화를 쓰며, 국가가 교역과 비단 생산에 나서게 했고, 1787~1788년 프랑스와 오스만 궁정에 사절을 보냈다. 1789년 12월 티푸가 영국의 동맹 트라방코르의 방어선을 공격하자 회사, 하이데라바드 니잠, 마라타가 손잡아 제3차 마이소르 전쟁(1790~1792)이 일어났다. 1791년 총독 콘월리스가 직접 군을 이끌어 세링가파탐을 에워쌌고, 1792년 3월 18일 세링가파탐 조약으로 티푸는 영토의 절반가량을 내놓았다. 회사는 말라바르 해안 일부와 바라마할·딘디굴, 마라타는 퉁가바드라강까지, 니잠은 크리슈나강과 펜네르강 사이를 얻었고, 티푸는 배상금 330락(3억 3천만) 루피를 내고 세 아들 가운데 둘을 인질로 보냈다. 티푸는 프랑스와 다시 손잡으려 했고, 1798년 나폴레옹의 이집트 원정이 시작되자(「프랑스의 이집트·시리아 원정(1798~1801)」, 뒤의 사건) 총독 웰즐리는 이를 구실로 제4차 전쟁(1798~1799)을 일으켰다. 회사군과 니잠, 마라타군이 사방에서 마이소르를 쳐 1799년 5월 4일 세링가파탐이 함락되었고 티푸는 성벽 가에서 전사했다. 회사는 남인도에서 마이소르를 나누어 카나라·코임바토르 등을 차지하고, 벨라리·아난타푸르 쪽은 니잠에게 주었으며, 가운데 땅은 와디야르 가문의 어린 크리슈나라자 3세를 세워 보조 동맹으로 묶었다. 티푸 가문은 벨로르로 옮겨졌다. 티푸는 영국에 끝까지 맞선 군주로 기려지는 한편, 말라바르와 쿠르그에서 강제 개종과 사원 훼손이 있었다는 비판도 받으며, 연구자에 따라 그 규모와 의도에 대한 평가가 갈린다."
