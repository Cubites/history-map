  sources: ["P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)", "C. A. Bayly, Indian Society and the Making of the British Empire (Cambridge University Press, 1988)", "Thomas R. Metcalf·Barbara D. Metcalf, A Concise History of Modern India (Cambridge University Press, 2012)"]

- id: durrani-panipat-1757
  year: 1757
  endYear: 1767
  title:
    ko: "두라니의 인도 침입과 제3차 파니파트 전투(1757~1767)"
  summary:
    ko: "아흐마드 샤 두라니(압달리)는 1747년 칸다하르에서 두라니 제국을 세운 뒤 1748년부터 1767년까지 여덟 차례 넘게 인더스강을 건너 펀자브와 델리를 쳤다. 1757년 초 그는 델리를 점령해 약탈하고 무굴 황제 알람기르 2세를 두고 돌아갔다. 이 빈틈에 마라타의 페슈와 발라지 바지 라오의 동생 라구나트 라오가 1758년 라호르와 아톡까지 올라가 아프간 세력을 몰아냈다. 아흐마드 샤는 1759년 다시 와서 로힐칸드의 로힐라 지도자 나집 웃다울라와 아와드의 나와브 슈자 웃다울라를 편으로 얻었다. 마라타 총사령관 사다시브라오 바우는 신디아(훗날 괄리오르 주)·홀카르(훗날 인도르 주) 등 가문의 군대를 이끌고 델리를 되찾은 뒤, 1761년 1월 14일 파니파트에서 아프간 연합군과 맞붙어 크게 졌다. 사다시브라오와 페슈와의 아들 비슈와스라오가 전사했고, 사망자 수는 전투와 퇴각 중 학살을 합쳐 연구자에 따라 3만~7만 명, 많게는 10만 명 안팎으로 갈린다. 페슈와 발라지 바지 라오는 패전 소식을 듣고 그해 6월 죽었다. 마라타의 북진은 십 년쯤 멈췄다가 마하지 신디아의 1771년 델리 입성으로 되살아났다. 아흐마드 샤는 델리를 직접 다스리지 않고 나집 웃다울라를 무굴 황제의 섭정으로 남겼다. 그가 인도를 떠나자 펀자브에서는 시크 세력이 일어나, 1762년 2월 아프간 군이 시크 가족과 병사를 추격해 죽였으나(「시크 미슬 연합과 라호르 점령(1765~1799)」, 뒤의 사건) 두라니는 끝내 펀자브를 지키지 못했다. 아흐마드 샤의 마지막 인도 원정은 1767~1768년이었고 그는 1772년 죽었다. 1757년 아흐마드 샤의 군은 델리뿐 아니라 마투라 같은 힌두 성지 도시도 약탈했고 주민이 많이 죽었다는 기록이 있다. 파니파트 뒤 여성과 아이 약 2만 2,000명이 노예로 끌려갔다는 당대 연대기의 서술이 있다."
