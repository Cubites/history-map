- id: crown-rule-1858
  year: 1858
  title:
    ko: "영국 정부의 직할 통치와 빅토리아 여왕의 선언(1858)"
  summary:
    ko: "1857년 반란을 겪은 영국 의회는 1858년 8월 2일 「인도 통치법」을 통과시켜 동인도 회사의 통치권을 왕실로 넘겼다(「세포이 항쟁(인도 대반란)과 무굴 제국의 끝(1857~1858)」, 앞의 사건). 회사 이사회와 감독청이 맡던 일은 내각의 인도 장관과 15명으로 이루어진 인도 평의회가 이어받았고, 초대 인도 장관은 스탠리 경(뒤의 15대 더비 백작)이었다. 총독 캐닝은 부왕(副王)을 겸하게 되었고, 11월 1일 알라하바드에서 빅토리아 여왕의 선언이 낭독되었다. 선언은 토후들과 맺은 조약을 지키고 더는 영토를 병합하지 않으며 신민을 종교와 관계없이 같게 대하고 반란 가담자 대부분을 사면한다고 약속했다. 이 약속에 따라 영국은 1862년 토후들에게 양자를 들여 대를 잇는 것을 인정하는 허가장을 내주어 실권 원칙을 버렸고, 반란에서 영국 편에 선 이들에게 상을 주었다. 레와 주는 소하그푸르(지금 샤돌 일대)와 아마르칸타크를 돌려받았고, 네팔의 총리 장 바하두르 라나는 1858년 군대를 보내 영국군을 도운 대가로 1860년 서부 타라이 땅을 되돌려받았다. 회사의 유럽인 부대는 왕실 군대로 옮겨졌다. 같은 무렵 벵골에서는 1859년 3월께 나디아 지방의 농민들이 선금에 묶여 헐값에 쪽(인디고)을 재배하던 일을 거부하기 시작해 무르시다바드·비르붐 등으로 번졌다. 대농장주와 지주 쪽의 폭력에 맞서 농민은 재배 거부와 농장 습격으로 맞섰고, 정부는 1860년 인디고 위원회를 꾸려 조사한 뒤 1862년 재배를 강제하는 계약을 막는 법을 만들었다. 디나반두 미트라의 희곡 『닐 다르판』(1860)이 이 일을 다루어 벵골의 민족 감정에 영향을 주었다. 이렇게 영국령 인도는 왕실이 직접 다스리는 지역과 보호 아래 둔 토후국으로 나뉜 체제로 자리 잡았다."
  subjects: [british-raj, uk, rewa-state, nepal]
  links:
    - { from: uk, to: british-raj, note: "인도 통치법으로 동인도 회사의 통치권을 이어받음 (1858)" }
  tags: [politics, society]
  sources: ["Barbara D. Metcalf·Thomas R. Metcalf, A Concise History of Modern India (Cambridge University Press, 3rd ed., 2012)", "Sugata Bose·Ayesha Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)", "Ranajit Guha, Elementary Aspects of Peasant Insurgency in Colonial India (Oxford University Press, 1983)", "「인도 통치법」(1858)", "「빅토리아 여왕의 선언」(1858)"]

- id: dogra-kashmir-1860
  year: 1860
  endYear: 1935
  title:
    ko: "잠무 카슈미르 주의 도그라 지배와 길기트(1860~1935)"
  summary:
    ko: "잠무 카슈미르 주는 1846년 굴랍 싱이 동인도 회사에 750만 루피를 내고 카슈미르 골짜기를 받아 세운 토후국이다(「시크 전쟁과 잠무 카슈미르의 성립, 영국의 펀자브 병합(1845~1849)」, 앞의 사건). 굴랍 싱은 1857년에 죽었고 아들 란비르 싱(재위 1857~1885), 프라탑 싱(1885~1925), 하리 싱(1925~1949)이 차례로 이었다. 서북쪽 길기트는 1842년 점령했다가 1852년에 잃은 뒤 1860년 도그라 군이 되찾아 길기트 와자라트(관할구)로 삼았고, 훈자·나가르 등 산골 소국들이 도그라의 종주권을 인정했다. 영국은 러시아가 파미르 쪽에서 내려올까 염려해 1877년 길기트에 특별 임무관을 두었다가 1889년 상주 정무관을 두는 길기트 에이전시를 세웠고, 1891년 군사 행동으로 훈자와 나가르를 에이전시 아래 넣었다. 같은 1889년 영국은 프라탑 싱이 러시아와 내통했다는 의심으로 실권을 줄여 상주관과 평의회 아래 두었다가 1905년 되돌려주었다. 1913년 영국인 장교가 이끄는 길기트 스카우트가 도그라 수비대를 대신했고, 1935년 영국은 하리 싱에게서 길기트 와자라트의 서쪽 일대를 60년 동안 빌리는 계약을 맺었다. 주민은 1941년 조사에서 약 4분의 3이 무슬림이었으나 군주와 지배층은 힌두교 도그라였다. 1931년 7월 13일 스리나가르 감옥 앞에서 경찰이 시위대에 발포해 20여 명이 숨진 일을 계기로 무슬림 정치 운동이 일어나 1932년 셰이크 압둘라 등이 무슬림 회의를 세웠고, 이 단체는 1939년 모든 종교를 아우르는 국민 회의(내셔널 콘퍼런스)로 이름을 바꾸었다. 이 나라는 1946년까지 영국령 인도의 토후국이었고 그 뒤 일은 「토후국의 통합: 주나가드·잠무 카슈미르·칼라트(1948~1949)」(뒤의 사건)이 다룬다."
  subjects: [jammu-kashmir-state, british-raj]
  tags: [politics, society]
  sources: ["Mridu Rai, Hindu Rulers, Muslim Subjects: Islam, Rights, and the History of Kashmir (Princeton University Press, 2004)", "Chitralekha Zutshi, Languages of Belonging: Islam, Regional Identity, and the Making of Kashmir (Hurst, 2004)", "Imperial Gazetteer of India, vol. 15: Kashmir and Jammu (Clarendon Press, 1908)"]

- id: sikkim-tumlong-1861
  year: 1861
  endYear: 1890
  title:
    ko: "시킴의 툼롱 조약과 영국의 보호, 1890년 영청 조약(1861~1890)"
  summary:
    ko: "시킴은 히말라야 동쪽의 작은 불교 왕국으로 남걀 가문의 초걀(왕)이 다스렸고 티베트와 가까웠다. 1835년 시킴은 휴양지로 쓸 다르질링을 동인도 회사에 넘겼으나, 1849년 시킴의 재상이 다르질링을 찾은 영국인 식물학자 후커와 캠벨을 붙잡자 영국은 1850년 다르질링 일대와 타라이 평지를 병합하고 해마다 주던 보상금을 끊었다. 1860년 시킴 군대가 영국 영내를 건드린 일을 구실로 에덴이 이끄는 영국 군대가 들어갔고, 1861년 3월 툼롱에서 조약이 맺어졌다. 티베트에 머물던 초걀 츠그푸드 남걀 대신 왕세자 시드켕 남걀이 서명했으며, 시킴은 7천 루피를 내고 영국 신민의 통행과 교역을 열고 영국이 길을 놓도록 허락했다. 이 조약으로 시킴은 사실상 영국의 보호국이 되었고(보호 관계 성립 해는 학자에 따라 1861년 또는 1890년), 영국은 인도와 티베트를 잇는 교역로를 얻었다. 그러나 티베트는 시킴을 자신의 종주권 아래에 있다고 보았고 1886년 이후 시킴 북부 링투에 군대를 두자 영국이 1888년 그레이엄이 이끄는 군대를 보내 몰아냈다. 이 일을 매듭지으려 1890년 3월 캘커타(지금 콜카타)에서 영국과 청이 협약을 맺어 청은 시킴이 영국의 보호국임을 인정하고 시킴–티베트 경계를 정했다. 티베트 대표는 이 협약에 참여하지 못했고 티베트는 협약의 효력을 받아들이지 않았다. 1889년부터 영국인 정무관 존 클로드 화이트가 강토크에 머물며 사실상 시킴을 다스렸고, 1893년 영국–티베트 통상 규칙으로 국경 시장이 열렸다. 영국은 다르질링과 시킴 산비탈의 차 농장과 개간에 네팔 이주민을 들였고, 이 때문에 시킴에서 렙차·부티아 원주민 못지않게 네팔계 주민이 늘어나 뒷날 정치 문제가 되었다. 이 흐름은 1903년 영국의 티베트 침입으로 이어진다(「영국의 티베트 침입과 청의 티베트 직접 통치 시도(1903~1910)」, 뒤의 사건)."
  subjects: [sikkim, british-raj, qing]
  links:
    - { from: sikkim, to: british-raj, note: "툼롱 조약으로 보호를 받아들임 (1861)" }
  tags: [politics, diplomacy]
  sources: ["Imperial Gazetteer of India, vol. 22: Sikkim (Clarendon Press, 1908)", "「툼롱 조약」(1861)", "「영청 조약」(1890)"]

- id: bhutan-duar-1864
  year: 1864
  endYear: 1910
  title:
    ko: "부탄의 두아르 전쟁과 신출라 조약, 왕정의 성립(1864~1910)"
  summary:
    ko: "부탄은 히말라야 남쪽 기슭의 불교 나라로, 드룩 데시(세속 통치자)와 제 켄포(승려 수장)가 나라를 이끌고 파로·통사 같은 지방 총독(펜롭)이 힘을 겨루었다. 평원 가장자리의 두아르 지방은 부탄이 아삼과 벵골 쪽 영주들에게서 공물을 받던 곳이라 국경 약탈 문제가 이어졌다. 1863년 영국은 에덴 사절단을 푸나카로 보냈으나, 에덴은 불리한 조약안에 서명하라는 압박과 푸대접을 받았다고 알리며 1864년 4월 돌아왔고 영국은 그해 11월 벵골 두아르를 병합한다고 선언했다. 1864년 말부터 약 다섯 달 동안 이어진 두아르 전쟁은 부탄군이 데왕기리를 한때 되찾기도 했으나 결국 영국이 이겼다. 1865년 11월 11일 신출라 조약으로 부탄은 아삼 두아르와 벵골 두아르, 데왕기리를 넘기고 영국에게서 해마다 2만 5천 루피(조건을 지키면 5만 루피까지)를 받기로 했다. 이는 나라 땅의 5분의 1 안팎으로 서술된다. 그 뒤 부탄은 드룩 데시 자리를 두고 내전을 겪었고, 통사 펜롭 지그메 남걀과 그 아들 우겐 왕추크(1882년부터 통사 펜롭)가 힘을 키웠다. 우겐 왕추크는 1904년 영국의 티베트 침입 때 영국과 티베트 사이를 중재했고(「영국의 티베트 침입과 청의 티베트 직접 통치 시도(1903~1910)」, 뒤의 사건), 1907년 12월 17일 승려·관리·주민 대표가 그를 세습 국왕(드룩 걀포)으로 추대했다. 1910년 푸나카 조약으로 영국이 주던 보조금은 10만 루피로 올랐고 부탄은 대외 관계에서 영국의 조언을 따르기로 했으며 영국은 부탄의 내정에 간섭하지 않기로 했다. 이 관계는 1949년 인도와 맺은 조약으로 이어진다(「인도와 부탄·시킴의 조약(1949~1950)」, 뒤의 사건)."
  subjects: [bhutan, british-raj]
  links:
    - { from: bhutan, to: british-raj, note: "신출라 조약으로 두아르 지방을 넘김 (1865)" }
  tags: [war, politics, diplomacy]
  sources: ["Leo E. Rose, The Politics of Bhutan (Cornell University Press, 1977)", "「신출라 조약」(1865)", "「푸나카 조약」(1910)"]

- id: famine-durbar-1876
  year: 1876
  endYear: 1881
  title:
    ko: "1876~1878년 대기근과 인도 여제 선포, 마이소르의 반환(1876~1881)"
  summary:
    ko: "1876년 데칸 고원의 몬순이 실패해 마드라스·봄베이 관구와 마이소르·하이데라바드 주에서 기근이 시작되었고, 1877년에는 북쪽의 펀자브와 중부 지방으로 번졌다. 피해를 입은 땅은 약 67만 km², 영향을 받은 주민은 약 5,850만 명으로 추산된다. 초과 사망자는 연구자에 따라 560만~960만 명(필드하우스, 다이슨 등)으로 추산되며 인구학적 추산에는 약 820만 명도 있다. 마이소르 한 곳만 70만~110만 명이 죽어 인구의 5분의 1 가까이를 잃었다는 추산이 있다. 부왕 리턴과 구호 책임자 리처드 템플은 구호 비용을 줄이는 방침을 폈다. 구호 노동의 임금은 낮았고 곡물 수출은 이어졌으며, 이런 정책은 영국에서도 인도에서도 비판을 받았다. 1877년 1월 1일 델리에서 열린 제국 대회(더바르)에서는 1876년 「왕실 칭호법」에 따라 빅토리아 여왕이 인도 여제로 선포되었고 토후들이 참석해 충성을 보였다. 이 행사는 기근이 한창일 때 큰돈을 들였다는 비판을 낳았다. 정부는 1880년 기근 위원회를 꾸렸고 그 보고를 바탕으로 1880년대 초 기근 법전이 만들어졌다. 법전은 흉작의 조짐을 보면 구호 노동과 구호소를 미리 열고 곡물 값이 오른다고 시장에 직접 끼어들지는 않는 원칙을 정했다. 시장에 맡긴다는 자유방임의 믿음이 정책을 이끌었다는 평가가 많다. 한편 마이소르는 1831년부터 영국인 판무관이 직접 다스려 왔는데, 1881년 영국은 1867년 양자로 인정한 우데야르(와디야르) 왕가의 열여덟 살 차마라젠드라 와디야르 10세에게 통치권을 되돌려주었다. 마이소르는 그 뒤 토후국으로서 영국령 인도 안에 남았다. 이 기근과 정부의 대응은 영국 지배 아래 인도의 부가 빠져나간다는 비판에 힘을 실어 주었다(「인도 국민 회의의 창립과 초기 민족 운동(1885~1905)」, 뒤의 사건)."
  subjects: [british-raj, uk, mysore, hyderabad-state]
  tags: [society, economy, politics]
  sources: ["Mike Davis, Late Victorian Holocausts: El Niño Famines and the Making of the Third World (Verso, 2001)", "Tim Dyson, A Population History of India: From the First Modern People to the Present Day (Oxford University Press, 2018)", "Imperial Gazetteer of India, vol. 18: Mysore (Clarendon Press, 1908)"]

- id: british-baluchistan-1876
  year: 1876
  endYear: 1887
  title:
    ko: "칼라트와 샌더먼 조약, 영국령 발루치스탄의 성립(1876~1887)"
  summary:
    ko: "발루치스탄 중부의 칼라트 칸국은 칸이 부족장(사르다르)들을 다스리는 느슨한 나라였고, 칸 쿠다다드와 부족장들은 자주 다투었다. 영국은 1876년 로버트 샌더먼을 보내 12월 자코바바드에서 칼라트 조약(자코바바드 조약이라고도 한다)을 맺고 칸의 지위를 인정하는 대신 퀘타에 영국군이 머물고 칸과 부족장 사이의 분쟁을 영국이 중재하며 칸에게 해마다 보조금을 주기로 했다. 영국의 속셈은 아프가니스탄을 경유해 러시아가 인도 서북쪽에 닿는 일을 막는 데 있었다(「그레이트 게임과 판데 사건」, 뒤의 사건). 2차 아프가니스탄 전쟁(1878~1880) 중인 1879년 간다마크 조약으로 아프가니스탄 아미르가 피신과 시비 등의 관할권을 넘기자 이 지역과 퀘타가 영국 행정 아래 놓였고, 1883년 칼라트는 볼란 고개 일대를 영국에 빌려주었다. 볼란 고개와 피신을 지나는 철도가 1880년대에 놓여 퀘타는 칸다하르 쪽을 겨냥한 영국령 인도의 군사 거점이 되었다. 영국은 이 땅을 1887년 영국령 발루치스탄으로 묶어 총독의 대리인 겸 판무관 아래 두었고, 샌더먼 체제라 불리는 방식으로 부족장에게 보조금과 지위를 주고 부족 회의(지르가)와 부족 민병대를 활용해 간접 통치했다. 이후 1890년 조브, 1896년 차가이, 1899년 누슈키, 1903년 나시라바드가 차례로 영국령에 편입되거나 칼라트에게서 임차되었다. 칼라트의 칸은 영국의 보호 아래 살아남았으나, 1893년 영국은 쿠다다드 칸을 물러나게 하고 아들 마흐무드 칸 2세(재위 1893~1931)를 올렸다. 칸이 부족장 위의 실질적 종주인지 이름뿐인 우두머리인지는 뒤에도 논쟁거리로 남았다. 1947년 칼라트를 둘러싼 일은 「토후국의 통합: 주나가드·잠무 카슈미르·칼라트(1948~1949)」(뒤의 사건)이 다룬다."
  subjects: [kalat, british-raj]
  links:
    - { from: kalat, to: british-raj, note: "퀘타 일대를 영국에 맡김 (1876)" }
  tags: [politics, diplomacy]
  sources: ["Imperial Gazetteer of India, vol. 6: Baluchistan (Clarendon Press, 1908)", "Metcalf·Metcalf, A Concise History of Modern India (Cambridge University Press, 3rd ed., 2012)", "「칼라트 조약」(1876)"]

- id: indian-national-congress-1885
  year: 1885
  endYear: 1905
  title:
    ko: "인도 국민 회의의 창립과 초기 민족 운동(1885~1905)"
  summary:
    ko: "1885년 12월 28일 봄베이의 고쿨다스 테즈팔 산스크리트 학원에서 인도 국민 회의의 첫 대회가 12월 31일까지 나흘 동안 열렸다. 영국 퇴직 관리 앨런 옥타비언 흄이 조직을 거들었고 대표 72명이 모였으며, 대부분 영어 교육을 받은 변호사·교사·언론인이었고 초대 의장은 변호사 우메시 찬드라 바네르지였다. 처음의 요구는 인도인의 행정 참여를 넓히고 입법 평의회를 개혁하는 정도였고, 영국 지배를 곧바로 끝내자는 것이 아니었다. 1892년 「인도 평의회법」이 간접 선거의 길을 조금 열었으나 인도인의 몫은 작았다. 로메시 찬드라 더트는 『인도 경제사』(1902~1903)에서 영국 지배가 인도 경제를 쇠퇴시켰다고 분석해 이 논의를 이었다. 다다바이 나오로지는 1886년 의장이 되었고 1892년 영국 하원의원에 뽑혔으며, 인도의 부가 영국으로 빠져나간다는 '재물 유출론'을 펼쳤다. 이 시기 회의의 주류는 청원과 토론으로 개혁을 구하는 온건파(나오로지, 고칼레)였다. 반면 마하라슈트라의 틸라크는 1893년 가네샤 축제와 1895년 시바지 축제를 정치 모임으로 만들어 대중을 끌어들였고, 1897년 선동 혐의로 징역 18개월을 받았다. 펀자브의 랄라 라지파트 라이, 벵골의 비핀 찬드라 팔도 더 강한 방식을 주장해 훗날 '랄·발·팔'로 불렸다. 영국 정부는 회의를 관리와 상류층의 모임으로 낮춰 보았고, 부왕 커즌(재임 1899~1905)은 회의가 곧 사라질 것이라고 했다. 이 갈등은 1905년 벵골 분할로 폭발했다(「벵골 분할과 스와데시 운동(1905~1911)」, 뒤의 사건). 이 시기 회의의 지지 기반은 도시 중간층에 머물렀고, 무슬림 대표와 농민의 참여는 적었다(1887년 의장 바드루딘 티아브지 같은 무슬림 인물도 있었다)."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)", "Bipan Chandra et al., India's Struggle for Independence (Penguin Books, 1989)", "Sekhar Bandyopadhyay, From Plassey to Partition and After: A History of Modern India (Orient Blackswan, 2004)"]

- id: northeast-frontier-1879
  year: 1879
  endYear: 1895
  title:
    ko: "아삼 변경의 편입: 나가 구릉, 마니푸르 전쟁, 루샤이 구릉(1879~1895)"
  summary:
    ko: "아삼 동쪽과 남쪽의 산악 지대에는 나가·루샤이(미조) 같은 여러 부족이 마을 단위로 살았고, 영국은 차 농장과 국경 안전을 이유로 이 땅을 단계적으로 영국령 인도에 넣었다. 1873년 영국은 아삼 변경에 내선(인너 라인) 규정을 두어 차 농장 지대와 산악 부족 지역을 갈랐다. 나가 구릉은 1866년 아삼의 한 군(디스트릭트)이 되었고 1878년 코히마가 중심지가 되었다. 1879년 10월 정치 관리 다만트가 세금과 노동 징발 문제로 코노마 마을을 찾았다가 일행과 함께 죽자 코히마가 포위되었는데, 마니푸르 군이 구원했다. 영국군이 코노마를 쳐 1880년 3월 강화가 맺어졌고 나가 구릉은 1881년 영국령에 편입되었다. 마니푸르 왕국은 1886년 이래 마하라자 수라찬드라가 다스렸는데, 1890년 9월 군 지휘관(세나파티) 티켄드라지트가 궁정 정변을 일으켜 그를 몰아내고 이복형제 쿨라찬드라를 세웠다. 영국이 마니푸르를 영국의 하위 토후국으로 본 반면 마니푸르 쪽은 자신들을 독립국으로 여겼다. 1891년 3월 아삼 판무관 퀸턴이 군대를 이끌고 와 티켄드라지트를 체포하려 하자 싸움이 나서 퀸턴을 비롯한 영국인 관리 다섯 명이 죽었다. 영국은 세 방향에서 군대를 보내 3월 31일부터 4월 27일까지 진격했고 크혼좀 전투(4월 25일)를 거쳐 임팔을 차지했다. 티켄드라지트와 지휘관 넷은 8월 13일 교수형을 당했고 영국은 총기 약 4,000정을 거두었다. 9월 22일 어린 추라찬드라가 왕위에 올랐고 1892~1907년에는 영국 정무관이 나라를 대신 다스렸다. 남쪽의 루샤이 구릉은 1889~1890년 친–루샤이 원정 뒤 족장들의 저항이 이어지다 가라앉은 1895년 영국령 인도로 선포되었으며 1898년 한 군으로 합쳐졌다."
  subjects: [british-raj, manipur]
  links:
    - { from: british-raj, to: manipur, note: "마니푸르 전쟁에서 이겨 왕국을 영국의 보호 아래 둠 (1891)" }
  tags: [war, politics]
  sources: ["Ethel St. Clair Grimwood, My Three Years in Manipur and Escape from the Recent Mutiny (Richard Bentley and Son, 1891)", "Imperial Gazetteer of India, vols. 16–18: 'Lushai Hills', 'Manipur', 'Naga Hills' (Clarendon Press, 1908)", "Metcalf·Metcalf, A Concise History of Modern India (Cambridge University Press, 3rd ed., 2012)"]

- id: durand-nwfp-1893
  year: 1893
  endYear: 1901
  title:
    ko: "듀랜드선과 치트랄 원정, 북서 변경주(1893~1901)"
  summary:
    ko: "영국령 인도의 서북쪽 끝에는 파슈툰·발루치 부족이 살았고 영국은 이 땅을 놓고 아프가니스탄과 러시아를 의식했다(「그레이트 게임과 판데 사건」, 앞의 사건). 1893년 11월 12일 외무 장관 모티머 듀랜드가 카불에서 아프간 아미르 압두르 라흐만과 협정을 맺어 영국령 인도와 아프가니스탄 사이의 영향권 경계(듀랜드선)를 정했다. 1894~1896년 합동 조사단이 약 1,300km를 측량했다. 이 선은 파슈툰 부족의 땅을 둘로 갈랐고, 뒷날 파키스탄과 아프가니스탄의 경계가 되었으나 아프가니스탄 정부들은 협정의 효력을 거듭 다투었다. 선의 서쪽 땅은 아프가니스탄 쪽 일이라 여기서 다루지 않는다. 이 선의 북쪽 끝에는 치트랄이 있었다. 치트랄의 므하타르(왕)는 1877년 조약으로 잠무 카슈미르 주 마하라자의 종주권을 인정했고, 1892년 므하타르 아만 울물크가 죽은 뒤 아들 아프잘 울물크·니잠 울물크와 숙부 셰르 아프잘, 아미르 울물크가 차례로 왕위를 다투었다(아프잘과 니잠은 살해되었다). 1895년 인접한 잔돌의 우므라 칸이 끼어들자 영국은 군대를 보냈고, 치트랄 요새에 있던 영국인 수비대가 약 48일 동안 포위당했다. 영국군은 4월 3일 말라칸드 고개를 뚫었고 켈리 부대가 4월 20일 치트랄에 들어갔으며 우므라 칸은 아프가니스탄으로 달아났다. 영국은 열두 살의 슈자 울물크를 므하타르로 세우고(재위 1936년까지) 치트랄에 주둔군을 남겼으며, 디르·스와트·치트랄을 아우르는 말라칸드 에이전시를 만들었다. 이 지역의 경계는 같은 해 파미르 경계 협정으로 이어졌다(「파미르 분쟁과 파미르 경계 협정」, 앞의 사건). 1897~1898년에는 말라칸드와 티라 지방에서 부족 봉기가 일어나 영국이 큰 병력을 보냈다. 1901년 부왕 커즌은 펀자브에서 서북 변경의 파슈툰 지역을 떼어 북서 변경주를 만들고 부족 지역은 변경 범죄 규정으로 다스렸다. 치트랄은 영국과의 보호 관계를 이어 가는 토후국이 되었다."
  subjects: [british-raj, chitral-kingdom, jammu-kashmir-state]
  tags: [politics, diplomacy, war]
  sources: ["Imperial Gazetteer of India, vol. 10: Chitral (Clarendon Press, 1908)", "Metcalf·Metcalf, A Concise History of Modern India (Cambridge University Press, 3rd ed., 2012)", "「듀랜드선 협정」(1893)"]

- id: bengal-partition-1905
  year: 1905
  endYear: 1911
  title:
    ko: "벵골 분할과 스와데시 운동(1905~1911)"
  summary:
    ko: "벵골 관구는 비하르와 오리사까지 합쳐 인구 약 7,850만 명(추산)으로 영국령 인도에서 가장 커서 한 총독이 다스리기 어렵다는 말이 오래 나왔다. 부왕 커즌은 1905년 10월 16일 관구를 둘로 나누어 다카를 중심으로 하는 동벵골·아삼 주(약 3,100만 명, 대부분 무슬림)와 서벵골·비하르·오리사로 갈랐다. 영국은 행정 효율을 내세웠으나 벵골 힌두 지식층(바드랄록)은 자기 고장의 분열이고 힌두와 무슬림을 떼어 놓으려는 계산이라고 받아들였다. 다카의 나와브 살리물라처럼 동벵골 주를 반긴 무슬림 지도자도 있었고 반대한 무슬림도 있었다. 국민 회의의 청원이 먹히지 않자 1905년 8월 7일 캘커타 시청에서 영국 상품 불매를 결의했고, 분할이 시행된 10월 16일 라빈드라나트 타고르의 제안으로 서로 팔에 실을 매어 주는 라키 의식을 치렀다. 영국 상품을 거부하고 인도 제품을 쓰는 스와데시, 민족 학교를 세우는 운동이 퍼졌고 '반데 마타람'이 구호가 되었다. 운동의 한쪽에서는 아우로빈도 고시의 동생 바린 등이 이끈 비밀 결사가 폭탄 공격을 시도했고 1908년 무자파르푸르 폭탄 사건에 연루된 쿠디람 보스가 교수형을 받았다. 1907년 수라트 대회에서 국민 회의가 온건파와 급진파로 갈렸다. 영국은 폭력 혐의자를 억누르는 한편 1909년 「인도 평의회법」(몰리–민토 개혁)을 내놓았다. 1911년 12월 12일 델리 더바르에서 조지 5세는 동서 벵골을 다시 합치고 비하르·오리사·아삼을 떼어 새 주로 만들며 수도를 캘커타에서 델리로 옮긴다고 알렸다. 새 체제는 1912년 시작되었고 신도시 뉴델리는 1931년에 문을 열었다. 분할이 취소되자 동벵골의 일부 무슬림은 실망했다."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Sumit Sarkar, The Swadeshi Movement in Bengal, 1903–1908 (People's Publishing House, 1973)", "Sekhar Bandyopadhyay, From Plassey to Partition and After: A History of Modern India (Orient Blackswan, 2004)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)"]

- id: muslim-league-1906
  year: 1906
  endYear: 1916
  title:
    ko: "전인도 무슬림 연맹의 창립과 몰리–민토 개혁, 러크나우 협정(1906~1916)"
  summary:
    ko: "벵골 분할 직후인 1906년 10월 아가 칸 3세가 이끈 무슬림 대표단(심라 대표단) 35명이 부왕 민토를 찾아 선거에서 무슬림에게 따로 몫을 달라고 요구했다. 12월 30일 다카에서 열린 전인도 무슬림 교육 회의에서 나와브 살리물라가 새 정당을 제안했고 만장일치로 전인도 무슬림 연맹이 만들어졌다. 연맹은 처음에 영국에 충성하며 무슬림의 정치적 권리를 지킨다는 목표를 내세웠다. 영국은 1909년 「인도 평의회법」(몰리–민토 개혁)으로 입법 평의회의 선출 의원을 늘리고 무슬림에게 따로 선거구와 의석을 주었다. 이는 종교에 따라 선거구를 가른 첫 큰 제도로, 영국이 이간한 것이라는 비판과 소수 공동체를 지키는 장치라는 옹호가 함께 있었다. 이후 1912년 벵골 분할 취소와 발칸 전쟁·오스만의 위기로 많은 무슬림이 영국에 실망했고(1911~1913년 이탈리아–튀르크 전쟁과 발칸 전쟁에서 오스만이 몰린 일도 영향을 주었다), 연맹은 1913년 자치를 목표로 내걸었으며 변호사 무함마드 알리 진나가 연맹에 들어왔다. 진나는 국민 회의 소속이기도 했다. 1916년 12월 러크나우에서 국민 회의와 연맹이 같은 곳에서 대회를 열어 협정을 맺었다. 틸라크 등 국민 회의 쪽은 무슬림의 별도 선거구를 받아들였고, 중앙 입법 평의회 인도인 의석의 3분의 1을 무슬림에게 주기로 했으며, 무슬림이 적은 주에서는 인구 비율보다 많은 의석을 얻고 다수인 주에서는 덜 얻기로 했다. 두 단체가 함께 자치를 요구하는 이 협정은 1916년 틸라크와 애니 베전트가 세운 자치 연맹 운동과 함께 전쟁 중 민족 운동을 넓혔으나 별도 선거구는 훗날 공동체 갈등의 틀이 되었다는 평가를 받는다."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Francis Robinson, Separatism among Indian Muslims: The Politics of the United Provinces' Muslims, 1860–1923 (Cambridge University Press, 1974)", "Ayesha Jalal, The Sole Spokesman: Jinnah, the Muslim League and the Demand for Pakistan (Cambridge University Press, 1985)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)"]

- id: simla-1913
  year: 1913
  endYear: 1914
  title:
    ko: "심라 회의와 맥마흔선(1913~1914)"
  summary:
    ko: "1912년 청이 무너지자 티베트의 13대 달라이 라마는 청군을 몰아내고 1913년 독립을 선언했으나 중화민국은 티베트를 자국 영토로 주장했다. 영국령 인도 정부는 티베트를 중국과 인도 사이의 완충지로 삼으려고 중화민국·티베트와 3자 회의를 열었다(「영국의 티베트 침입과 청의 티베트 직접 통치 시도(1903~1910)」, 앞의 사건). 1907년 영러 협상에서 영국과 러시아가 중국의 종주권을 인정한 바 있어(「영러 협상과 삼국 협상」, 앞의 사건) 영국은 티베트의 지위를 중국의 종주권과 티베트 자치를 함께 두는 쪽으로 풀고자 했다. 영국의 정치 관리 찰스 벨은 티베트 쪽을 도왔다. 회의는 1913년 10월 심라에서 시작되어 영국 대표 헨리 맥마흔, 티베트 대표 샤트라, 중화민국 대표 이반 첸(천이판)이 참석했다. 영국은 티베트를 중국의 종주권 아래 두되 외티베트는 자치를 누리고 내티베트에는 중국의 지위를 더 인정하는 안을 냈다. 1914년 4월 세 대표가 안에 가서명했으나 중화민국 정부가 이를 거부했고, 7월 3일 영국과 티베트만 협약에 서명했다. 한편 영국과 티베트 대표는 1914년 3월 편지를 주고받아 부탄 동쪽에서 히말라야 능선을 따라 약 890km를 이어 영국령 인도와 티베트 사이의 경계로 삼기로 했는데, 이것이 맥마흔선이다. 타왕을 포함한 선 남쪽 땅은 이 선에 따라 영국령 인도 쪽에 놓이게 되었다. 영국은 이 선을 오래 공표하지 않다가 1930년대 말에야 공식 문서에 실었고, 중화민국 정부와 뒤의 중국은 이 선도 3자 협약도 인정하지 않았다. 티베트는 이후에도 1950년까지 사실상 독립을 이어 갔다. 이 선을 둘러싼 갈등은 1950년 중화인민공화국의 티베트 진입 뒤로 이어진다(「중화인민공화국의 티베트 병합과 맥마흔선」, 뒤의 사건)."
  subjects: [british-raj, roc, bhutan]
  tags: [diplomacy, politics]
  sources: ["Alastair Lamb, The McMahon Line: A Study in the Relations between India, China and Tibet, 1904 to 1914 (Routledge & Kegan Paul, 1966)", "Melvyn C. Goldstein, A History of Modern Tibet, 1913–1951: The Demise of the Lamaist State (University of California Press, 1989)", "「심라 협약」(1914)"]

- id: ww1-india-1914
  year: 1914
  endYear: 1918
  title:
    ko: "1차 세계 대전과 인도(1914~1918)"
  summary:
    ko: "1914년 8월 영국이 독일에 선전 포고하자 부왕 하딩은 인도 정부를 대표해 인도도 전쟁에 들어간다고 알렸고 입법 평의회는 이를 의결하지 않았다. 인도군은 1백만 명 넘게 해외에서 싸웠고 메소포타미아에 약 70만 명이 갔다(「1차 세계 대전의 중동 전선(1914~1918)」, 같은 시기의 사건). 서부 전선에도 약 13만 명이 보내졌고 이들 가운데 약 9,000명이 죽었다. 전체 인도군 사망자는 6만~7만 4천 명으로 계산된다. 토후국도 병사와 돈을 내놓았다. 제국 근무 부대로 1914년 약 2만 2천 명이 편성되었고 하이데라바드 주의 니잠을 비롯한 토후들이 거액을 냈으며, 비카네르 마하라자 강가 싱은 1917년 제국 전쟁 내각에 인도 대표로 참석했다. 네팔의 라나 정권은 구르카 모병을 늘려 허락했고 네팔군 일부를 인도 북서 국경의 방비에 돌렸다. 인도는 1917년 전쟁 지원금으로 1억 파운드를 부담하기로 했고 세금과 물가가 올랐으며, 곡물·황마 수출과 군수품 생산이 늘어난 대신 서민의 살림은 어려워졌다. 1918~1919년 인플루엔자는 인도에서 1,200만~1,700만 명을 죽인 것으로 추산된다. 전쟁 중 반영 활동도 있었다. 북미의 가다르당 인도인이 1915년 2월 봉기를 꾀했으나 발각되었고 싱가포르에서는 5경보병연대가 반란을 일으켰으며, 영국은 「인도 방위법」(1915)으로 체포와 재판의 권한을 넓혔다. 1914년 캐나다 밴쿠버에서 입국을 거부당한 코마가타 마루 호의 시크·무슬림 승객들은 인도로 돌아와 9월 캘커타 근처 버지버지에서 경찰과 부딪쳐 승객 19명이 죽었다. 1915년 1월 간디가 남아프리카에서 돌아왔다. 전쟁 협력을 보상받으려는 기대 속에 1917년 8월 인도 장관 몬터규가 인도에 책임 정부를 단계적으로 마련하겠다고 밝혔으나 실제 개혁은 「인도 통치법」(1919)으로 이어졌다(「롤럿법과 암리차르 학살, 몬터규–첼름스퍼드 개혁(1919)」, 뒤의 사건)."
  subjects: [british-raj, uk, nepal, hyderabad-state]
  tags: [war, politics, society]
  sources: ["David Omissi, The Sepoy and the Raj: The Indian Army, 1860–1940 (Macmillan, 1994)", "Santanu Das, India, Empire, and First World War Culture: Writings, Images, and Songs (Cambridge University Press, 2018)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)"]

- id: amritsar-1919
  year: 1919
  title:
    ko: "롤럿법과 암리차르 학살, 몬터규–첼름스퍼드 개혁(1919)"
  summary:
    ko: "전쟁이 끝나자 영국은 혁명 활동 혐의자를 재판 없이 가둘 수 있는 「롤럿법」을 1919년 3월 18일 통과시켰고, 인도인은 이를 '정의도 변호도 없는 법'이라 불렀다. 간디는 4월 6일 전국 하르탈(파업)을 불러 사티아그라하 운동을 시작했다. 펀자브에서는 4월 10일 암리차르의 지도자 사티아팔과 키츨루가 체포되자 군중이 은행과 관청을 공격해 유럽인 여러 명(5명으로 적는 자료가 많다)이 죽었고, 영국 여성 선교사가 폭행당했다. 4월 13일 바이사키 축제날 암리차르의 잘리안왈라 바그(담으로 둘러싸인 공원)에서 모인 군중에게 준장 레지널드 다이어가 병사 50명을 이끌고 경고 없이 약 10분 동안 발포했다. 군중 규모는 6천~2만 명(추산)이었고 사망자는 헌터 위원회 집계 379명, 인도 쪽 추산은 700~1,000명 이상으로 갈리며 부상은 1,200명 넘었다. 영국은 펀자브에 계엄을 선포하고 다이어는 길에서 영국 여성이 폭행당한 거리를 기어서 지나게 하는 명령을 내렸다. 정부가 꾸린 헌터 위원회(1919년 10월 구성, 1920년 3월 보고)는 다이어의 발포를 중대한 잘못으로 보아 그를 군직에서 물러나게 했으나 형사 처벌은 하지 않았다. 영국 본국에서는 다이어를 옹호해 기금을 모은 이도 있었다. 시인 라빈드라나트 타고르는 5월 31일 기사 작위를 포기했다. 한편 「인도 통치법」(1919, 몬터규–첼름스퍼드 개혁)은 주 정부 일부 분야(교육·보건 등)를 선출된 인도인 장관에게 맡기고 나머지는 총독이 지명한 관리가 맡는 양두 정치(이중 통치)를 도입했다. 중앙 입법부는 양원제가 되었으나 선거권은 일부에게만 주어졌다. 분노한 인도인은 개혁을 받아들이지 않았고 1920년 비협조 운동이 시작되었다(「비협조·킬라파트 운동(1920~1922)」, 뒤의 사건)."
  subjects: [british-raj, uk]
  tags: [society, politics]
  sources: ["Kim A. Wagner, Amritsar 1919: An Empire of Fear and the Making of a Massacre (Yale University Press, 2019)", "Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)", "Hunter Committee, Report of the Disorders Inquiry Committee (Government of India, 1920)"]

- id: non-cooperation-1920
  year: 1920
  endYear: 1922
  title:
    ko: "비협조·킬라파트 운동(1920~1922)"
  summary:
    ko: "1차 세계 대전에서 오스만이 졌다는 소식은 오스만 술탄이 칼리프를 겸한다고 여긴 인도 무슬림에게 충격이었다. 무함마드 알리와 샤우카트 알리 형제 등이 1919년 킬라파트 위원회를 만들어 칼리프의 지위를 지키라고 요구했고(「세브르 조약과 튀르키예 독립 전쟁」, 앞의 사건), 간디는 이 운동과 롤럿법·암리차르 학살에 대한 분노를 하나로 묶어 영국 정부와 협력하지 않는 운동을 이끌었다(「롤럿법과 암리차르 학살, 몬터규–첼름스퍼드 개혁(1919)」, 앞의 사건). 간디는 1920년 9월 캘커타 특별 대회와 12월 나그푸르 대회에서 국민 회의가 이를 받아들여 목표를 '평화적 수단에 의한 스와라지(자치)'로 바꾸었다. 운동은 영국이 준 작위와 명예 반납, 관청·재판소·학교·대학 거부, 영국 직물 불매와 손으로 짠 카디 보급, 술집 앞 농성, 불가촉천민 차별 철폐를 내세웠다. 세금 불납은 일부 지역에 그쳤다. 모틸랄 네루와 치타란잔 다스처럼 변호사를 접은 이도 있었고 아자드와 안사리 같은 무슬림 지도자도 참여했다. 1921년 11월 웨일스 공의 방문을 보이콧하는 시위가 벌어졌고 12월 영국은 모틸랄 네루와 자와할랄 네루를 비롯한 지도자를 대거 가두었다. 1922년 2월 4일 연합주 고라크푸르 근처 차우리차우라에서 시위대와 경찰이 부딪쳐 경찰서에 불이 붙어 경찰관 20여 명(22명으로 서술되기도 한다)이 죽었다. 간디는 폭력이 번지는 것을 두려워해 2월 12일 운동을 멈추었고, 3월 10일 체포되어 3월 18일 6년형을 받았다(1924년 2월 건강 문제로 풀려났다). 갑작스러운 중단에 비판도 많았다. 1924년 3월 튀르키예 공화국이 칼리프 제도를 없애자(「로잔 조약과 튀르키예 공화국」, 뒤의 사건) 킬라파트 운동은 힘을 잃었고, 무슬림과 힌두의 협력 분위기도 식었다. 국민 회의 안에서는 모틸랄 네루와 다스가 1923년 스와라지당을 만들어 입법부에 들어가 안에서 싸우는 길을 택했다."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Gail Minault, The Khilafat Movement: Religious Symbolism and Political Mobilization in India (Columbia University Press, 1982)", "Judith M. Brown, Gandhi: Prisoner of Hope (Yale University Press, 1989)", "Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)"]

- id: princely-states-1921
  year: 1921
  endYear: 1946
  title:
    ko: "토후국과 영국의 최고권: 군주 회의에서 내각 사절단 각서까지(1921~1946)"
  summary:
    ko: "영국령 인도는 영국이 직접 다스린 주들과 세습 군주가 내정을 맡은 토후국으로 나뉘었고, 토후국은 1947년 무렵 560개 남짓으로 땅의 약 40%, 인구의 약 4분의 1을 차지했다. 영국은 조약으로 군주의 내정을 인정하되 외교·국방·통신은 쥐는 '최고권(paramountcy)'을 내세웠다. 1921년 2월 8일 델리에서 군주 회의(나렌드라 만달)가 처음 열려 직접 참석하는 108개 토후국과 소국 127곳을 대표하는 12석, 모두 120석으로 출발했으나 바로다·괄리오르·인도르는 참석하지 않았고 대표가 없는 소국도 300곳이 넘었다. 초대 의장(총장)은 비카네르의 강가 싱이었다(1921~1926). 1927~1929년 버틀러 위원회는 토후국이 인도 정부가 아니라 영국 왕실과 관계를 맺는다고 보면서도 최고권은 계속 최고여야 한다고 결론 내렸다. 1930년 원탁 회의에서 일부 군주는 연방에 들어가겠다고 말했고 1935년 법은 토후국 의석과 인구의 절반이 넘는 나라가 가입해야 연방을 열도록 했으나 하이데라바드 주·마이소르 왕국·카슈미르(잠무 카슈미르 주)·트라방코르 왕국·괄리오르 주·인도르 주·바로다 주 같은 큰 나라의 군주들이 가입 조건을 두고 흥정을 이어 가 연방은 성립하지 못했다. 군주의 나라 안에서는 주민이 선거와 개혁을 요구하는 인민 협회(프라자 만달)가 퍼졌고 1938년 국민 회의는 이들을 지지한다고 밝혔다. 라지푸타나에서는 자이푸르·조드푸르·비카네르·메와르·자이살메르·코타, 서북에서는 바하왈푸르·하이르푸르·쿠치·치트랄, 중부와 동부에서는 보팔 주·레와 주·마니푸르·트리푸라·테흐리 가르왈·마유르반즈·바스타르·수르구자 같은 토후국이 있었고, 그 밖에 카티아와르·펀자브·펀자브 산지·동부 라지푸타나·남부 라지푸타나·팔란푸르·마히칸타·레와칸타·오리사·차티스가르·분델칸드·말와·데칸의 작은 토후국 무리가 있었다. 1946년 5월 12일 내각 사절단은 각서에서 영국의 최고권은 영국 왕실이 계속 쥘 수도, 새 인도 정부에 넘길 수도 없으며 토후국이 최고권에 넘겼던 권리는 토후국에 돌아간다고 밝혔다. 이후 영국령 인도와 토후국의 관계는 독립 과정에서 다시 정해졌다(「영국령 인도의 분할과 난민(1947)」, 뒤의 사건; 「토후국의 통합: 주나가드·잠무 카슈미르·칼라트(1948~1949)」, 뒤의 사건)."
  subjects: [british-raj, uk, hyderabad-state, mysore, travancore, jammu-kashmir-state, gwalior-state, indore-state, baroda-state, jaipur-state, jodhpur-state, bikaner-state, mewar-state, jaisalmer-state, kota-state, bahawalpur-state, khairpur-state, cutch-state, chitral-kingdom, bhopal-state, rewa-state, manipur, tripura, tehri-garhwal, mayurbhanj-state, bastar-state, surguja-state, kathiawar-states, punjab-states, punjab-hill-states, east-rajputana-states, south-rajputana-states, palanpur-states, mahi-kantha-states, rewa-kantha-states, orissa-states, chhattisgarh-states, bundelkhand-states, malwa-states, deccan-states]
  tags: [politics, diplomacy]
  sources: ["Ian Copland, The Princes of India in the Endgame of Empire, 1917–1947 (Cambridge University Press, 1997)", "V. P. Menon, The Story of the Integration of the Indian States (Longmans, Green, 1956)", "「버틀러 위원회 보고서」(1929)", "「내각 사절단의 토후국 조약과 최고권 각서」(1946)"]

- id: nepal-britain-treaty-1923
  year: 1923
  title:
    ko: "네팔–영국 조약과 라나 체제(1923)"
  summary:
    ko: "네팔은 1814~1816년 영국과 싸워 1816년 수가울리 조약으로 영토 일부를 잃은 뒤 영국인 대표(레지던트)를 카트만두에 받아들이되 독립국으로 남았다. 1846년 코트 학살로 권력을 쥔 장 바하두르 라나 가문은 총리직을 대대로 물려받았고 샤 왕가의 국왕은 이름뿐인 자리에 머물렀다. 장 바하두르는 1857~1858년 영국을 도왔고 1860년 서부 타라이를 되돌려받았다(「영국 정부의 직할 통치와 빅토리아 여왕의 선언(1858)」, 앞의 사건). 장 바하두르 뒤로 형제와 조카들이 총리직을 이었고 1901~1929년 총리 찬드라 슘셰르 라나는 영국과의 우호를 지키는 한편 공식 독립 인정을 바랐다. 1차 세계 대전 중 네팔은 구르카 병사를 영국군에 내고 군대 일부를 인도에 보냈다(「1차 세계 대전과 인도(1914~1918)」, 앞의 사건). 1923년 12월 21일 카트만두 싱하 더르바르에서 찬드라 슘셰르와 영국 사절 오코너가 조약에 서명했다. 제1조는 두 정부가 서로 대내외 독립을 인정한다고 정했고, 제2조는 수가울리를 포함한 앞선 조약을 폐기했다. 네팔은 영국령 인도 항구를 거쳐 무기와 군수품을 수입할 수 있게 되었고 관세 면제를 받았다. 모병 문제는 조약문에 따로 적히지 않았으며, 영국은 구르카 병사를 계속 모집했다. 1924년 찬드라 슘셰르는 노예제를 없앴다. 라나 체제는 외부와 거리를 두고 교육과 정치 활동을 억눌렀다. 1936년 라나 정권에 반대하는 프라자 파리샤드가 세워졌으나 1941년 활동가 네 명이 처형되는 등 억눌렸다. 총리는 비마 슘셰르(1929~1932)와 유다 슘셰르(1932~1945)를 거쳐 파드마 슘셰르(1945~1948), 모한 슘셰르(1948~1951)에 이르렀다. 이 체제는 1951년에 끝난다(「네팔 라나 체제의 끝과 마헨드라의 판차야트(1951~1962)」, 뒤의 사건)."
  subjects: [nepal, british-raj]
  tags: [diplomacy, politics]
  sources: ["John Whelpton, A History of Nepal (Cambridge University Press, 2005)", "Leo E. Rose, Nepal: Strategy for Survival (University of California Press, 1971)", "「영국–네팔 조약」(1923)"]

- id: simon-commission-1927
  year: 1927
  endYear: 1932
  title:
    ko: "사이먼 위원회와 원탁 회의(1927~1932)"
  summary:
    ko: "1919년 법은 10년 뒤 개혁의 성과를 살펴보기로 했고, 영국 정부는 1927년 11월 존 사이먼을 위원장으로 하는 의회 조사단을 앞당겨 구성했다. 위원 7명은 모두 영국인이어서 인도 정치 세력이 거의 한목소리로 반발했고, 1927년 12월 국민 회의 마드라스 대회는 보이콧을 결의했다. 1928년 2월 3일 위원회가 봄베이에 도착하자 '사이먼, 돌아가라'를 외치는 시위가 벌어졌다. 1928년 10월 30일 라호르에서 경찰이 시위대를 곤봉으로 때려 랄라 라지파트 라이가 다쳤고 11월 17일 숨지자 분노가 커졌다. 인도인 정당은 인도인 자신의 헌법안을 보여 주려고 1928년 여름 모틸랄 네루를 중심으로 네루 보고서를 만들었으나 무슬림 연맹은 별도 선거구 문제를 놓고 의견이 달라 1929년 3월 진나가 14개 조항을 내세웠다. 1929년 10월 31일 부왕 어윈은 인도 헌정 발전의 목표가 자치령 지위라고 밝히고 원탁 회의를 제안했다. 1929년 12월 국민 회의 라호르 대회는 완전한 독립(푸르나 스와라지)을 목표로 삼았다. 사이먼 위원회의 보고서는 1930년 6월 나왔고 주 정부의 책임제 확대와 연방 구상을 담았다. 원탁 회의는 런던에서 세 차례 열렸다. 1차(1930년 11월~1931년 1월)에는 국민 회의가 불참했으나 토후국 군주들이 연방을 받아들일 뜻을 보였고, 2차(1931년 9~12월)에는 간디가 국민 회의의 유일한 대표로 참석했으나 공동체 문제로 합의하지 못했으며, 3차(1932년 11~12월)는 국민 회의가 빠진 채 열렸다. 이 사이 1931년 3월 간디–어윈 협정이 있었다(「소금 행진과 시민 불복종, 푸나 협정(1930~1934)」, 뒤의 사건). 회의의 논의는 1935년 「인도 통치법」으로 이어졌다(「1935년 인도 통치법과 1937년 선거, 버마의 분리(1935~1937)」, 뒤의 사건)."
  subjects: [british-raj, uk]
  tags: [politics, diplomacy]
  sources: ["Judith M. Brown, Modern India: The Origins of an Asian Democracy (Oxford University Press, 2nd ed., 1994)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)", "Report of the Indian Statutory Commission (HMSO, 1930)"]

- id: civil-disobedience-1930
  year: 1930
  endYear: 1934
  title:
    ko: "소금 행진과 시민 불복종, 푸나 협정(1930~1934)"
  summary:
    ko: "1930년 1월 26일 국민 회의는 영국령 인도의 완전한 독립을 다짐하는 선언을 발표했고 간디가 투쟁 방법을 맡았다. 1929년 시작된 세계 대공황으로 농산물 값이 떨어져 농민의 세금 부담이 무거워진 때였다(「대공황」, 앞의 사건). 간디는 소금세를 표적으로 삼았다. 소금은 가난한 사람도 쓰는 필수품인데 정부가 독점하고 세금을 매겼기 때문이다. 3월 12일 간디는 제자 78명과 함께 사바르마티 아슈람에서 해안 마을 단디까지 약 387km를 걸었고, 4월 6일 바닷물에서 소금을 만들어 법을 어겼다. 이를 계기로 전국에서 소금 제조, 영국 직물 불매, 세금 거부, 산림법 위반이 번졌다. 5월 5일 간디가 체포된 뒤 소금 창고를 향한 행진이 이어졌고 5월 21일 다라사나에서 사로지니 나이두가 이끈 비폭력 시위대가 경찰 곤봉에 맞았다. 서북 변경의 페샤와르에서는 4월 23일 경찰 발포로 사망자가 났고(집계는 갈린다), 압둘 가파르 칸이 이끈 쿠다이 키드마트가르(신의 종) 운동도 불복종에 참여했다. 이 운동으로 6만 명 넘는 사람이 투옥되었다. 1931년 3월 5일 간디–어윈 협정으로 정치범을 풀고 소금을 해안 주민이 쓸 만큼 만드는 것을 허락하는 대신 불복종을 멈추었다. 그러나 2차 원탁 회의가 성과 없이 끝나자(「사이먼 위원회와 원탁 회의(1927~1932)」, 앞의 사건) 1932년 1월 운동이 다시 시작되었으나 곧 억눌렸다. 1932년 8월 영국 총리 맥도널드의 '공동체 재정(커뮤널 어워드)'이 불가촉천민(지금의 달리트)에게 따로 선거구를 주자 간디는 이에 반대해 9월 20일 예르와다 감옥에서 단식을 시작했다. 9월 24일 암베드카르와 힌두 지도자들이 푸나 협정을 맺어 별도 선거구 대신 주 의회에서 불가촉천민에게 따로 의석을 두는 방식을 택했다. 의석은 영국안(71석)보다 많은 148석이었고 후보는 예비 선거로 가린 뒤 공동 선거구에서 뽑았다. 암베드카르는 이 협정이 압력 속에서 이루어졌다고 보았다. 운동은 1934년에 공식으로 거두어졌다."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Judith M. Brown, Gandhi: Prisoner of Hope (Yale University Press, 1989)", "Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)", "B. R. Ambedkar, What Congress and Gandhi Have Done to the Untouchables (Thacker, 1945)"]

- id: donoughmore-1931
  year: 1931
  title:
    ko: "실론의 도너모어 헌법과 보통 선거(1931)"
  summary:
    ko: "영국령 실론은 1802년 이래 영국 직할 식민지였고, 1915년 싱할라인과 무슬림(무어인) 사이 폭동에 영국이 계엄을 폈다가 싱할라 지도자들을 가두면서 민족 운동이 일어났다. 1919년 국민 회의(실론 국민 회의)가 세워졌고 1920년대에 총독 매닝의 개혁으로 입법 평의회의 선출 의원이 늘었으나 인종별 선거구가 문제였다. 식민 장관 시드니 웹은 1927년 11월 도너모어 경을 위원장으로 하는 조사단을 보냈고 위원단은 약 넉 달 머물며 140명을 면담했다. 보고서(1928)는 인종별 선거구를 없애고 만 21세 이상 남녀 모두에게 투표권을 주라고 권했다. 이렇게 1931년 헌법으로 국가 평의회(State Council)가 설치되었다. 의원은 집행 위원회를 맡아 교육·보건 같은 부문을 이끌었고, 총독은 국방·외교와 재정 등 핵심 직책을 쥔 관리들을 두어 최고 권한을 유지했다. 아시아의 식민지에서 처음 도입한 보통 선거였으나 한계도 컸다. 유력 타밀 지도자들은 인종별 선거구가 사라지면 소수가 힘을 잃는다며 반대했고, 자프나의 청년 회의는 1931년 선거를 보이콧했다. 인도계 타밀인 농장 노동자들은 거주 요건 때문에 투표권이 제한되었고 이 문제는 뒤에 크게 불거졌다. 국가 평의회는 선출 의원 50명과 총독이 지명하는 의원 8명으로 이루어져 1931년 7월 7일 처음 열렸고, 농업 장관에는 돈 스티븐 세나나야케가 올랐다. 실론 쪽에서는 이 헌법이 지나치게 영국의 권한을 남겼다고 보았고 완전한 자치를 요구했다. 차·고무 수출에 기대던 실론 경제가 대공황의 타격을 받던 때 이 제도가 시작되었다(「대공황」, 앞의 사건). 이 헌법은 1947년까지 이어졌고, 그 뒤 독립 과정은 「실론의 독립과 시민권법(1948)」(뒤의 사건)이 다룬다."
  subjects: [british-ceylon, uk]
  tags: [politics, society]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Jane Russell, Communal Politics under the Donoughmore Constitution, 1931–1947 (Tisara Prakasakayo, 1982)", "Report of the Special Commission on the Constitution of Ceylon (HMSO, 1928)"]

- id: government-of-india-1935
  year: 1935
  endYear: 1937
  title:
    ko: "1935년 인도 통치법과 1937년 선거, 버마의 분리(1935~1937)"
  summary:
    ko: "원탁 회의의 논의를 이은 「인도 통치법」(1935)은 1935년 8월 영국 의회를 통과했다. 이 법은 주 정부에서 양두 정치를 없애 선출된 인도인 장관이 주 행정을 맡게 하고 총독과 주지사에게는 비상시 권한을 남겨 두었다. 선거권은 약 500만 명에서 3,500만 명 안팎(성인 인구의 약 14%)으로 늘었으나 별도 선거구는 그대로였다. 중앙 정부에는 영국령 인도와 토후국을 묶는 연방을 만들고 방위·외교는 총독이 쥐는 양두 정치를 두기로 했으나 토후국의 가입 조건이 채워지지 않아 연방은 세워지지 않았다(「토후국과 영국의 최고권: 군주 회의에서 내각 사절단 각서까지(1921~1946)」, 앞의 사건). 이 법으로 신드가 봄베이에서 갈라지고 오리사와 비하르가 나뉘어 1936년 오리사 주가 생겼으며 연방 대법원이 설치되었다. 인도 준비 은행도 1935년 4월에 문을 열었다. 버마는 1937년 4월 1일 영국령 인도에서 갈라져 따로 총독의 식민지가 되었고, 아덴도 인도 정부에서 떨어져 직할 식민지가 되었다. 1937년 2월 주 선거에서 국민 회의는 11개 주 가운데 5개 주에서 과반수를 얻고 7월까지 7~8개 주에서 정부를 세웠다. 무슬림 연맹은 무슬림 몫 의석에서 부진했고, 연합주에서 국민 회의와 연맹의 연립이 불발되며 두 단체 사이가 벌어졌다. 국민 회의 정부는 교육과 토지 개혁에 손을 댔으나 무슬림 사회 일부는 이를 힌두 주도로 받아들였고 이는 1940년 라호르 결의로 이어지는 흐름 속에 있었다(「무슬림 연맹의 라호르 결의(1940)」, 뒤의 사건). 이 헌법의 상당 부분은 1950년 인도 헌법과 파키스탄의 헌법에 이어졌다."
  subjects: [british-raj, uk]
  tags: [politics]
  sources: ["Judith M. Brown, Modern India: The Origins of an Asian Democracy (Oxford University Press, 2nd ed., 1994)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)", "「인도 통치법」(1935)"]

- id: lahore-resolution-1940
  year: 1940
  title:
    ko: "무슬림 연맹의 라호르 결의(1940)"
  summary:
    ko: "1937년 선거에서 부진한 무슬림 연맹은 진나의 지도 아래 무슬림 대중 정당으로 방향을 바꾸었다. 1939년 10~11월 국민 회의 정부들이 전쟁 참여 문제로 총사퇴하자 연맹은 12월 22일을 '해방의 날'로 기념했다. 그 사이 시인 이크발의 1930년 구상과 초두리 라흐마트 알리가 1933년 전단에서 말한 '파키스탄'이라는 이름이 퍼져 있었다. 1940년 3월 22~24일 라호르에서 열린 연맹 대회는 3월 23일 결의를 채택했다. 제안은 벵골 수상 파즐룰 후크가 했고 연합주의 할리쿠잔만과 펀자브·북서 변경주·신드 대표가 찬성했다. 결의는 인도 북서와 동의 무슬림이 다수인 지역을 모아 '독립 국가들'을 이루고 그 구성 단위가 자치와 주권을 갖게 하며 소수자의 안전장치를 두라고 했다. 진나는 연설에서 힌두교도와 무슬림은 종교와 문화·역사가 달라 한 나라 안의 소수와 다수가 아니라 서로 다른 두 민족이라고 말했다. 결의문에는 '파키스탄'이라는 말이 없었으나 힌두 언론이 '파키스탄 결의'라고 부르자 연맹도 그 이름을 받아들였다. 국민 회의는 이를 인도 분열 요구로 보고 반대했고 하나의 인도를 지켜야 한다고 했으며, 시크 사회 일부와 펀자브·벵골의 힌두는 자기 지역이 나뉠 것을 걱정했다. 무슬림 가운데도 반대하는 이가 있었는데 자미아트 울라마에 힌드 같은 단체는 통일 인도를 주장했다. 결의문의 뜻은 '국가들'이 복수인지 하나인지를 두고 연구자 사이에 해석이 갈리며, 연맹은 1946년 4월 의원 대회에서 '하나의 국가'로 고치는 방향으로 입장을 정리했다. 이 요구는 전쟁 중 협상과 1946년 선거를 거쳐 분할로 이어진다(「내각 사절단과 임시 정부(1946)」, 뒤의 사건)."
  subjects: [british-raj]
  tags: [politics]
  sources: ["Ayesha Jalal, The Sole Spokesman: Jinnah, the Muslim League and the Demand for Pakistan (Cambridge University Press, 1985)", "Ian Talbot·Gurharpal Singh, The Partition of India (Cambridge University Press, 2009)", "「라호르 결의」(1940)"]

- id: india-wwii-1939
  year: 1939
  endYear: 1942
  title:
    ko: "2차 세계 대전과 인도, 크립스 사절단(1939~1942)"
  summary:
    ko: "1939년 9월 3일 영국이 독일에 선전 포고하자 부왕 린리스고는 인도 지도자들과 협의하지 않고 인도가 전쟁에 들어갔다고 선언했다. 국민 회의는 전쟁 목적과 인도의 독립을 먼저 밝히라고 요구했고, 답을 얻지 못하자 1939년 10월 말 8개 주 정부가 총사퇴했다. 영국은 1940년 8월 '8월 제안'으로 전쟁 뒤 자치령 지위를 약속하고 총독 집행 평의회에 인도인을 더하겠다고 했으나 국민 회의는 거부했고, 1940년 10월부터 간디는 개인 사티아그라하 운동을 하나씩 선별해 이끌었다. 1941년 12월 일본이 태평양 전쟁을 시작해(「태평양 전쟁 발발」, 뒤의 사건) 1942년 2월 싱가포르가 함락되고 3월 랑군을 잃으며 안다만 제도가 일본에 점령되자 동쪽 국경이 위협받았다. 인도군은 전쟁 중 약 250만 명이 지원병으로 늘어 역사상 가장 큰 지원병 군대가 되어 북아프리카·이탈리아·버마에서 싸웠다. 영국 전시 내각은 지지를 얻으려 스태퍼드 크립스를 보냈고 크립스는 3월 22일 델리에 도착해 3월 29일 안을 발표했다. 안은 전쟁이 끝나면 자치령 지위를 주고 헌법 제정 회의를 열며 원하는 주는 연합에서 빠질 수 있다고 했으나, 전쟁 중에는 방위를 영국이 계속 쥐었다. 국민 회의는 4월 2일 반대 입장을 밝혔고 간디는 이를 '부도 날 은행의 선일자 수표'라고 불렀다. 무슬림 연맹은 4월 13일 파키스탄 요구가 분명하지 않다며 거부했다. 크립스 사절단의 실패는 곧 인도를 떠나라 운동으로 이어졌다(「인도를 떠나라 운동(1942~1944)」, 뒤의 사건). 전쟁은 곡물 값 폭등과 징발로 서민에게도 부담이 되었고, 인도가 영국에 군수품을 대고 전비 일부를 떠맡은 결과 전쟁이 끝날 때 영국이 인도에 진 스털링 부채는 약 13억 파운드로 쌓였다."
  subjects: [british-raj, uk, japan]
  tags: [war, politics]
  sources: ["Srinath Raghavan, India's War: World War II and the Making of Modern South Asia (Basic Books, 2016)", "Yasmin Khan, India at War: The Subcontinent and the Second World War (Oxford University Press, 2015)", "Nicholas Mansergh (ed.), Constitutional Relations between Britain and India: The Transfer of Power 1942–7, vol. 1 (HMSO, 1970)"]

- id: quit-india-1942
  year: 1942
  endYear: 1944
  title:
    ko: "인도를 떠나라 운동(1942~1944)"
  summary:
    ko: "크립스 사절단이 실패한 뒤 간디는 영국이 곧바로 인도를 떠나야 한다고 보았고, 1942년 7월 14일 국민 회의 운영 위원회가 와르다에서 영국 철수를 요구하는 결의를 했다. 8월 8일 봄베이의 고왈리아 탱크에서 열린 전인도 위원회에서 간디는 '행동하라, 아니면 죽으라'를 외치며 비폭력 대중 투쟁을 호소했다. 영국은 그날 밤부터 이튿날 새벽까지 간디와 국민 회의 지도부를 거의 모두 체포했고 간디는 푸네의 아가 칸 궁에 갇혔다. 지도자 없이 남은 운동은 곳곳에서 우편국·철도·경찰서를 습격하는 폭력으로 번졌고 비하르와 연합주 동부의 발리아, 벵골의 미드나포르가 특히 격렬했다. 발리아는 한동안 따로 행정을 꾸렸고 미드나포르의 탐룩에서는 병행 정부(자티야 사르카르)가 1944년까지 이어졌다. 아루나 아사프 알리와 자야프라카시 나라얀은 지하에서 싸웠고 우샤 메타 등이 비밀 라디오 방송을 이끌었다. 영국은 군대와 무기를 동원해 진압했다. 영국 정부 집계로 사망자가 1,028명이었고 국민 회의 쪽은 4,000~10,000명으로 추산하며, 체포된 사람은 10만 명이 넘었다. 무슬림 연맹은 운동에 반대하며 '나누고 떠나라'를 내세웠고 힌두 마하사바와 인도 공산당(소련이 참전하자 영국과 협력)도 참여하지 않았으며 많은 토후국도 영국을 거들었다. 간디의 아내 카스투르바는 1944년 2월 감옥에서 숨졌고 간디는 건강이 나빠진 1944년 5월 풀려났다. 운동 자체는 목적을 이루지 못했으나, 연구자들은 이 운동이 영국의 전후 통치 비용을 키웠다고 본다. 그 사이 벵골에서는 기근이 일어났다(「1943년 벵골 기근(1943~1944)」, 뒤의 사건)."
  subjects: [british-raj, uk]
  tags: [politics, society]
  sources: ["Srinath Raghavan, India's War: World War II and the Making of Modern South Asia (Basic Books, 2016)", "Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)", "Judith M. Brown, Gandhi: Prisoner of Hope (Yale University Press, 1989)"]

- id: bengal-famine-1943
  year: 1943
  endYear: 1944
  title:
    ko: "1943년 벵골 기근(1943~1944)"
  summary:
    ko: "1942년 일본이 버마를 점령하면서 영국령 인도의 벵골이 수입하던 쌀이 끊겼고 같은 해 10월 사이클론과 벼 곰팡이병으로 가을 수확이 줄었다. 벵골 주 정부는 일본군 상륙에 대비해 해안과 강 근처의 쌀을 치우는 '쌀 거부 정책'과 배를 없애는 '배 거부 정책'(약 4만 5천 척 압수)을 폈다. 전쟁이 부른 물가 상승에 전쟁 관련 노동자를 우선하는 식량 배급이 겹쳤고 주 사이의 쌀 거래가 막혔으며, 가격 통제를 풀자 값이 치솟고 사재기와 암시장이 퍼졌다. 1942년 12월에는 일본군의 캘커타 폭격이 곡물 거래를 흔들었다. 1943년 중반 굶주린 농민이 캘커타로 몰려들었고 1943년 4월부터 무슬림 연맹의 나지무딘 내각이 벵골을 맡았다. 정부는 처음에 기근을 공식으로 인정하지 않았고, 1943년 8월 『스테이츠맨』 편집장 이언 스티븐스가 캘커타 거리의 굶주린 사람들 사진을 싣자 비로소 여론이 움직였다. 전시 내각은 선박이 모자란다며 부왕의 곡물 수입 요청을 대부분 거절했는데, 이 설명을 두고 비판자는 정치적 우선순위의 문제였다고 반박한다(수상 처칠의 책임을 둘러싼 논쟁이 이어진다). 1943년 10월 새 부왕 웨이블이 군대를 동원해 구호에 나서자 상황이 나아졌고, 12월 풍작 뒤 기근은 가라앉았다. 사망자는 대부분 굶주림과 말라리아·콜레라 같은 질병으로 죽었고 절반 넘게 1944년에 숨졌다. 정부의 기근 조사 위원회(1945)는 약 150만 명으로 보았고 아마르티아 센은 약 300만 명으로 추산했으며, 근래 연구는 210만~380만 명까지 본다(어떤 서술은 80만 명에서 시작한다). 농업 노동자·어민·수공업자의 피해가 특히 컸다. 센은 식량 총량이 아니라 사람들이 식량을 얻을 권리의 붕괴가 원인이라고 설명했다. 이 일은 영국 지배의 정당성을 크게 흔들었다."
  subjects: [british-raj, uk]
  tags: [society, economy]
  sources: ["Paul R. Greenough, Prosperity and Misery in Modern Bengal: The Famine of 1943–1944 (Oxford University Press, 1982)", "Amartya Sen, Poverty and Famines: An Essay on Entitlement and Deprivation (Clarendon Press, 1981)", "Famine Inquiry Commission, Report on Bengal (Government of India, 1945)"]

- id: ina-bose-1943
  year: 1943
  endYear: 1946
  title:
    ko: "인도 국민군과 수바스 찬드라 보스(1943~1946)"
  summary:
    ko: "수바스 찬드라 보스는 1938년 국민 회의 의장에 뽑혔으나 간디 쪽과 갈려 1939년 물러나 포워드 블록을 만들었다. 1941년 1월 영국의 감시를 피해 인도를 떠나 독일로 갔고 1943년 잠수함을 갈아타며 일본이 점령한 동남아시아에 닿았다. 일본군이 1942년 말레이시아와 싱가포르에서 잡은 인도군 포로로 처음 꾸린 인도 국민군(제1 INA)은 지도자 모한 싱과 일본의 갈등으로 1942년 12월 해산되었다. 1943년 7월 보스가 싱가포르에서 국민군을 맡아 재편했고 10월 21일 자유 인도 임시 정부(아자드 힌드)를 선포했다. 이 정부는 일본과 추축국의 승인을 받았고 일본이 안다만·니코바르를 명목상 넘겼다. 국민군은 포로 약 1만 6천 명을 포함해 말레이·버마의 인도인 민간 지원자까지 약 4만 3천 명이 되었다. 1944년 일본군의 임팔–코히마 작전(우고 작전)에 함께해 마니푸르 국경 일대에서 싸웠으나 보급 부족과 질병으로 크게 졌다. 같은 인도·버마 전선에서 한국광복군 요원이 영국군 쪽에서 활동했다(「한국광복군의 연합 작전과 국내 진공 작전 준비」, 같은 시기의 사건). 1945년 8월 18일 보스는 일본 항복 뒤 타이완에서 비행기 사고로 숨졌다고 알려졌으나 죽음의 경위를 두고 논란이 이어졌다. 1945년 11월 영국은 델리 레드 포트에서 국민군 장교를 반역죄로 재판하기 시작했다. 첫 재판에는 힌두·무슬림·시크 장교 세 사람(프렘 사갈, 샤 나와즈 칸, 구르박시 싱 딜런)을 한 자리에서 세웠으나 국민 회의와 무슬림 연맹이 모두 이들을 지지해 항의 시위가 캘커타를 비롯한 여러 도시에 번졌다. 총사령관 오친렉은 형 집행을 하지 않았고 약 1만 1천 명의 국민군은 급여 없이 해임되었다. 이 재판은 영국군 인도 병사의 충성을 믿기 어렵게 만든 계기로 평가된다."
  subjects: [british-raj, uk, japan]
  tags: [war, politics]
  sources: ["Peter W. Fay, The Forgotten Army: India's Armed Struggle for Independence, 1942–1945 (University of Michigan Press, 1993)", "Sugata Bose, His Majesty's Opponent: Subhas Chandra Bose and India's Struggle against Empire (Harvard University Press, 2011)", "Srinath Raghavan, India's War: World War II and the Making of Modern South Asia (Basic Books, 2016)"]

- id: rin-mutiny-1946
  year: 1946
  title:
    ko: "왕립 인도 해군 반란(1946)"
  summary:
    ko: "1946년 2월 18일 봄베이의 해군 통신 훈련소 탈와르호에서 수병들이 영국인 지휘관의 인종차별적 욕설과 형편없는 급식, 더딘 제대에 항의해 명령을 거부했다. 항의는 곧 봄베이의 다른 함정과 육상 기지로 번져 이튿날 해군 중앙 파업 위원회가 꾸려졌고, 함정과 육상 기지 56곳, 수병 1만 명 넘게 참여했다고 한다. 요구는 급식과 급여 개선, 영국 수병과의 평등한 대우, 인도인 장교 확대 외에 국민군 포로와 정치범 석방, 인도네시아와 이집트에 있는 인도군의 철수까지 내걸었다. 반란자들은 국민 회의·무슬림 연맹·공산당의 깃발을 함께 달았다. 공산당만 이들을 지지해 2월 22일 총파업을 불렀고 봄베이에서 노동자와 군대·경찰이 충돌해 최대 236명이 숨졌다는 서술이 있다(공동체 충돌에 따른 사망이 섞였다). 카라치에서는 마노라 섬의 하인두스탄호 반란이 진압되며 사상자가 났고, 캘커타에서는 후글리호가 명령을 거부했다. 국민 회의와 무슬림 연맹은 모두 반란에 반대했고, 발라브바이 파텔은 파업 위원회와 만나 처벌하지 않겠다는 보장을 받고 항복하도록 설득했으며 진나도 중단을 호소했다. 2월 23일부터 25~26일 사이에 반란이 끝났으나 보장은 지켜지지 않아 476명이 해임되었고 독립 뒤에도 복직하지 못했다. 이 반란에 앞서 1946년 1월에는 인도 공군 병사들의 파업도 있었다. 이 사건은 1945~1946년 국민군 재판 항의와 겹쳐 영국이 군대의 충성에 기대 인도를 계속 통치하기 어렵다는 판단을 굳히는 데 영향을 주었다는 해석이 있다. 영국 정부는 이 무렵 내각 사절단을 보내기로 했다(「내각 사절단과 임시 정부(1946)」, 뒤의 사건)."
  subjects: [british-raj, uk]
  tags: [war, politics, society]
  sources: ["Sumit Sarkar, Modern India 1885–1947 (Macmillan, 1983)", "Bose·Jalal, Modern South Asia: History, Culture, Political Economy (Routledge, 4th ed., 2017)", "Nicholas Mansergh (ed.), The Transfer of Power 1942–7, vol. 6 (HMSO, 1976)"]

- id: cabinet-mission-1946
  year: 1946
  title:
    ko: "내각 사절단과 임시 정부(1946)"
  summary:
    ko: "1945년 7월 영국 총선에서 노동당이 이기자 애틀리 정부는 인도에 권력을 넘기는 일을 서둘렀고, 앞서 6~7월 웨이블이 연 심라 회의는 연맹의 몫 문제로 틀어졌다. 1945~1946년 선거에서 국민 회의는 일반(비무슬림) 선거구 대부분을 이기고 무슬림 연맹은 중앙 의회의 무슬림 몫 30석 전부와 주 의회 무슬림 몫 의석의 약 87%(약 429석, 집계에 따라 갈린다)를 얻어 두 정당의 대결이 굳어졌다. 1946년 3월 24일 인도 장관 페식로런스, 상무 장관 스태퍼드 크립스, 해군 장관 알렉산더가 내각 사절단으로 델리에 도착했다. 5월 16일 안은 파키스탄의 분리를 받아들이지 않고 국방·외교·통신만 맡는 약한 연방과 그 아래 세 집단(A 힌두 다수 주, B 서북의 무슬림 다수 주, C 벵골과 아삼)을 두고 토후국은 연방에 넘기지 않은 권한을 그대로 지니도록 했다. 연맹은 집단 B·C를 사실상 파키스탄의 기초로 보았고 국민 회의는 아삼과 북서 변경주가 집단에서 빠질 권리를 주장했다. 연맹은 6월 6일 안을 받아들였고 국민 회의는 집단 편성 해석에 이견을 두고 받아들였으나 7월 10일 네루가 국민 회의가 안에 묶이지 않는다고 말하자 연맹은 7월 29일 승낙을 철회하고 8월 16일을 '직접 행동의 날'로 정했다(「영국령 인도의 분할과 난민(1947)」, 뒤의 사건이 캘커타 충돌을 다룬다). 9월 2일 네루를 중심으로 하는 임시 정부가 세워졌고 연맹은 10월 26일 참여했다. 12월 9일 헌법 제정 회의가 첫 회의를 열었으나 연맹은 불참했다. 이 가운데 총독 웨이블은 영국군의 철수 준비 계획(붕괴 계획)을 올렸으나 거절되었고, 영국은 1947년 새 부왕 마운트배튼으로 방침을 바꾸었다. 영국령 인도는 이렇게 1946년 말 사실상 두 정당이 합의하지 못한 채 마지막 해를 맞았다."
  subjects: [british-raj, uk]
  tags: [politics, diplomacy]
  sources: ["Nicholas Mansergh (ed.), The Transfer of Power 1942–7, vol. 7 (HMSO, 1977)", "Yasmin Khan, The Great Partition: The Making of India and Pakistan (Yale University Press, 2007)", "Ayesha Jalal, The Sole Spokesman: Jinnah, the Muslim League and the Demand for Pakistan (Cambridge University Press, 1985)"]
