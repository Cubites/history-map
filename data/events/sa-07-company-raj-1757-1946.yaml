  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Sinnappah Arasaratnam, Ceylon (Prentice-Hall, 1964)", "Lorna Dewaraja, The Kandyan Kingdom of Sri Lanka, 1707–1782 (Lake House Investments, 1988)"]

- id: wellesley-subsidiary-1798
  year: 1798
  endYear: 1801
  title:
    ko: "웰즐리의 보조 동맹 정책과 카르나타카·아와드(1798~1801)"
  summary:
    ko: "리처드 웰즐리는 존 쇼어와 대행 앨러드 클라크 중장에 이어 1798년 5월 총독에 올랐다(재임 1798~1805). 그는 프랑스 혁명군과 나폴레옹의 위협을 구실로 인도 군주들에게 보조 동맹을 받아들이게 했다. 군주는 영국군을 수도 가까이 두고 그 비용을 돈이나 땅으로 대며, 외교를 영국에 맡기고, 다른 유럽인을 쓰지 않고, 영국 상주 사절(레지던트)을 받아들였다. 하이데라바드 니잠은 1798년 9월 첫 보조 조약으로 프랑스인 장교 레이몽이 훈련한 부대를 해산하고 회사군 6,000명을 받아들였으며, 1800년 10월 새 조약으로 마이소르에서 얻은 땅(벨라리·카다파 등 '양도 지구')을 군대 비용으로 회사에 넘겼다. 마이소르의 와디야르 가문도 1799년 보조 동맹을 받아들였다. 카르나타카에서는 웰즐리가 티푸의 문서에서 나와브가 티푸와 내통했다는 증거를 찾았다고 주장했고, 카르나타카 나와브 움다트 웃 우마라가 1801년 7월 죽자 후계자 아짐 웃다울라는 통치권을 회사에 넘기고 수입의 일부를 연금으로 받는 조약에 서명했다(1801년 7월 31일). 아와드의 나와브 사다트 알리 칸은 1801년 11월 조약으로 로힐칸드·하부 도아브·고라크푸르를 회사에 넘겨 영토의 약 절반을 잃었다. 웰즐리는 1801년 2월 공문에서 이 방침이 군주들이 위험한 연합을 맺지 못하도록 영국에 기대게 하려는 것이라고 밝혔다. 이 체제는 방어를 보장하는 대신 군주의 군사적 자주를 없앴고, 회사가 후계 다툼과 내정에 끼어드는 길을 열었다. 웰즐리는 1800년 캘커타에 포트 윌리엄 칼리지를 세워 회사 신임 관리에게 인도의 언어와 법을 가르쳤고, 총독 관저를 호화롭게 지어 런던의 이사회에서 비난을 샀다."
