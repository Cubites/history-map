# 중국 사건: 홍타이지의 청 건국에서 신해혁명 앞까지 (1635 ~ 1911)
# 범위: 홍타이지의 몽골 복속과 청 국호·팔기·이번원, 도르곤의 섭정과 입관, 변발령과 강남 정복, 남명 정권, 정성공의 타이완과 천해령, 강희제의 즉위·치수·해금 해제, 삼번의 난,
#   갈단과 강희제의 친정, 천주교 관용령과 전례 논쟁, 준가르의 티베트 침입과 청의 티베트 경영, 옹정제의 지정은제·군기처·문자옥, 개토귀류, 캬흐타 조약, 건륭제의 준가르 정벌과 신장,
#   십전무공, 사고전서와 문자옥, 광저우 무역 체제, 매카트니 사절단, 청 중기의 인구와 상업, 고증학, 백련교의 난과 팔괘교, 임칙서의 아편 금지와 아편 전쟁, 태평천국(봉기·천경·멸망),
#   염군과 묘족·회족의 봉기, 신유정변과 동치 중흥, 양무운동, 일본의 타이완 출병과 해방 논쟁, 신장 수복과 이리 문제, 청불 전쟁, 봉금 해제와 동삼성, 타이완 민주국, 변법 운동과 무술정변,
#   의화단과 신축 조약, 광서신정과 과거 폐지, 입헌 준비, 동맹회와 혁명파의 봉기, 철도 국유화와 우창 봉기, 영국의 티베트 침입과 청의 티베트 직접 통치 시도.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1636~1911년 지도에서 생기거나 끝난 항목(후금·청·몽골)과 1만 km² 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 홍타이지 사건에서 「후금 건국」·「병자호란과 삼전도의 굴욕」, 도르곤 사건에서 「명 말의 농민 반란과 이자성의 베이징 점령(1628~1644)」·「소현 세자의 귀국」, 정성공 사건에서 「삼번의 난과 청의 타이완 정복」,
#   갈단 사건에서 「청의 외몽골·티베트·칭하이 복속」, 전례 논쟁 사건에서 「시헌력 채택」, 양무운동 사건에서 「통리기무아문 설치와 개화 정책」, 청불 전쟁 사건에서 「갑신정변」, 만주 사건에서 「간도 문제와 감계 회담」·「기유각서와 간도 협약」,
#   청일 전쟁 패전 사건에서 「청일 전쟁과 시모노세키 조약」, 우창 봉기 사건에서 「신해혁명과 중화민국 수립」을 가리켰다. 한국사 06·07번 파일의 사건(병자호란·명의 멸망·나선 정벌·삼번의 난·청의 내륙 아시아 복속·청일 전쟁·신해혁명 등)과
#   유럽 파일의 「네르친스크 조약」·「아편 전쟁과 난징 조약」·「제2차 아편 전쟁과 베이징 조약」·「러시아의 연해주 획득」·「의화단 운동과 8개국 연합군」은 다시 만들지 않고 글에서 이름만 가리켰다.
#   1636년 앞 후금(누르하치·사르후·정묘호란)은 원·명 시대 사건 파일에서, 1912년 중화민국 수립 뒤는 이어지는 사건 파일에서 다룬다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도로 넣고, 본문의 연도는 모두 서기이다.
# 달력: 본문의 날짜는 '음력'이라고 밝힌 곳을 빼면 모두 양력(서력)이다. 음력과 양력을 함께 적은 곳은 둘 다 밝혔다.
# 이름 규칙: 신해혁명(1911) 앞 인물은 한자음(홍승주·사가법·오삼계·강희제·임칙서·홍수전·증국번·서태후), 쑨원·위안스카이·캉유웨이·량치차오·리훙장은 저장소 표기 사전을, 리위안훙·황싱·푸이는 신해혁명 뒤에도 활동한 인물이라 중국어 표기를 따랐고, 신해혁명 뒤에도 활동했으나 청 안의 직책으로 나오는 관료(서세창·장건·재풍·혁광·성선회·조이풍·단방·재택·대홍자)는 한자음으로 썼다.
#   옛 지명은 한자음(봉천·천경·경사), 지금도 쓰는 지명은 중국어 표기(난징·베이징·광저우·쿤밍·시안·우창·한커우·톈진·타이완·쑤저우·마웨이), 만주·몽골·티베트 인명은 굳은 표기(홍타이지·도르곤·갈단·체왕 랍탄·켈상 갸초). 나라 이름은 항목 이름과 맞췄다.
# places: 위치가 학설로 갈리거나 전쟁 보기와 겹치는 싸움이 많아 달지 않았다.
# 서술은 새로 작성. 출처는 사료(『청실록』 『청사고』 등)와 표준 개설서. 병력·사상자·재정 숫자는 사료가 과장하는 일이 많아 '추산'이나 '전한다'로 적었다.

- id: hongtaiji-qing-founding-1635
  year: 1635
  endYear: 1643
  title:
    ko: "홍타이지의 몽골 복속과 청의 건국, 팔기와 이번원(1635~1643)"
  summary:
    ko: "1626년 누르하치가 죽자 여덟째 아들 홍타이지가 후금의 칸에 올랐다. 홍타이지는 서쪽으로 차하르의 릭단 칸을 몰아냈고, 릭단이 1634년 죽은 이듬해(1635) 그 아들 에제이가 원의 옥새를 바치며 항복했다. 이로써 내몽골의 여러 부가 후금에 복속했다. 같은 해 홍타이지는 옛 족명 여진 대신 만주라는 이름을 쓰게 했다. 1636년 음력 4월 선양에서 만주·몽골·한인 대신의 추대를 받아 황제에 올라 국호를 청, 연호를 숭덕으로 정했다(「병자호란과 삼전도의 굴욕」(뒤의 사건)에서 조선이 이 청을 상대했다). 복속한 몽골 부족은 1636년 무렵 설치한 몽골 아문이 맡았고, 이 기관은 1638년 이번원으로 이름을 고쳐 청의 번부 통치의 바탕이 되었다. 군사 조직도 넓어졌다. 누르하치가 만든 팔기에 더해 몽골팔기(1635)와 한군팔기(1642)가 세워져, 항복한 몽골인과 한인이 청 군대의 큰 부분을 이루었다. 화포 면에서는 1631년 명의 홍이포를 본뜬 대포를 만들었고, 명의 장수 공유덕·경중명·상가희가 수군과 화포를 가지고 잇따라 투항하면서(1633~1634) 해상 전력도 갖추었다. 1640~1642년 송산·진저우 일대의 싸움에서 명의 홍승주가 지고 항복(1642)한 것도 한군팔기가 커지는 계기가 되었다. 한편 홍타이지는 6부(1631)와 도찰원을 두는 등 명의 제도를 본뜬 관제를 갖추었고, 정치 제도에서 한인 관료의 몫을 키웠다. 1643년 음력 8월 홍타이지가 후계를 정하지 않은 채 갑자기 죽자, 황족 회의에서 아홉째 아들 푸린이 다섯 살로 즉위하니 순치제이고, 도르곤과 지르갈랑이 섭정을 맡았다. 누르하치 때 여진 부족 연합에 가까웠던 후금이 홍타이지 때 만주·몽골·한인을 아우르는 다민족 국가로 바뀐 셈이다. 「후금 건국」(앞의 사건)과 「병자호란과 삼전도의 굴욕」(뒤의 사건)이 이 국가를 조선 쪽에서 본 일을 다룬다."
  subjects: [hugeum, qing, mongols, ming, joseon]
  links:
    - { from: hugeum, to: mongols, note: "차하르 정복, 내몽골 복속 (1635)" }
  tags: [politics, war]
  sources: ["『청태종실록』", "『청사고』 태종본기", "Mark C. Elliott, The Manchu Way: The Eight Banners and Ethnic Identity in Late Imperial China (Stanford University Press, 2001)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: dorgon-regency-1643
  year: 1643
  endYear: 1651
  title:
    ko: "도르곤의 섭정과 입관, 순치제의 친정(1643~1651)"
  summary:
    ko: "1643년 홍타이지가 죽자 아홉째 아들 푸린이 다섯 살로 즉위했다. 이가 순치제이다. 홍타이지의 동생 도르곤과 사촌 지르갈랑이 함께 섭정을 맡았지만, 실제 권력은 곧 도르곤에게 모였다. 이듬해 이자성이 베이징을 함락하고 숭정제가 목을 맸다. 도르곤은 산해관의 오삼계와 손잡고 이자성군을 물리친 뒤 베이징에 들어갔다(「명 말의 농민 반란과 이자성의 베이징 점령(1628~1644)」(앞의 사건)). 순치제도 선양에서 옮겨 와 그해 음력 10월 베이징에서 즉위식을 올려 중국 지배를 선포했다. 이자성은 이듬해 후베이의 산악에서 죽었다고 하나 경위는 분명하지 않다. 청은 명의 6부와 과거를 이어받고 명 관료를 대거 받아들였으며, 숭정제의 장례를 치러 명의 뒤를 잇는다는 모습을 보였다. 소현 세자와 봉림 대군도 청군과 함께 베이징에 갔다가 1645년 조선으로 돌아왔다(「소현 세자의 귀국」(뒤의 사건)). 화북에서는 한인 농민의 반발이 컸다. 팔기에 땅을 나누어 주려고 한인의 밭을 빼앗는 권지(圈地)가 벌어졌고, 한인이 스스로 팔기의 노비가 되는 투충(投充)도 늘었기 때문이다. 도르곤은 1646년 과거를 다시 열어 한인 지식인을 관료로 끌어들였고, 1647년 명률을 바탕으로 한 『대청률집해부례』를 반포하게 했다. 관직은 만주인과 한인을 함께 임명하는 만한 병용으로 운영했다. 도르곤의 직함은 숙부섭정왕에서 황숙부섭정왕을 거쳐 1649년 황부섭정왕까지 높아졌고, 황제에 가까운 권위를 누렸다. 도르곤은 1650년 12월 사냥 중 얻은 병으로 서른여덟 살에 죽었다. 1651년 열두 살 순치제가 친정에 나서자 지르갈랑 쪽 인물들이 도르곤의 죄를 고발했고, 순치제는 도르곤의 직함을 거두고 무덤을 파헤쳤다. 도르곤의 명예는 1778년 건륭제가 회복해 주었다. 순치제는 이후 한인 관료와 예수회 선교사 아담 샬을 가까이 두고 통치를 이어 갔다."
  subjects: [qing, ming, joseon]
  links:
    - { from: qing, to: ming, note: "산해관 전투 뒤 베이징 입성 (1644)" }
  tags: [politics, war]
  sources: ["『청세조실록』", "『청사고』 세조본기", "『청사고』 열전 예친왕 도르곤", "Frederic Wakeman Jr., The Great Enterprise: The Manchu Reconstitution of Imperial Order in Seventeenth-Century China (University of California Press, 1985)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: southern-ming-1644
  year: 1644
  endYear: 1662
  title:
    ko: "남명 정권의 분열과 영력제의 최후(1644~1662)"
  summary:
    ko: "숭정제가 죽은 소식이 전해지자 난징에서 복왕 주유숭이 마사영 등 장수들의 힘으로 1644년 홍광제로 즉위했고, 사가법도 그 압력 속에 이를 받아들였다. 그러나 조정은 마사영과 동림당 계통 관료의 다툼으로 흔들렸다. 1645년 양저우가 무너지고 난징이 함락되어 홍광제는 붙잡혔다. 같은 해 푸젠에서는 당왕 주율건이 정지룡의 힘을 업고 융무제로 즉위했고, 저장에는 노왕 주이해가 감국을 칭했다. 융무제는 1646년 음력 8월 청군에 붙잡혀 죽었고 정지룡은 청에 투항했다. 그 아들 정성공은 아버지를 따르지 않고 계속 싸웠다. 융무제의 동생 주율월은 광저우에서 소무제를 칭했으나 영력제와 정통을 다투다 이듬해 초 청군이 광저우를 함락할 때 죽었다. 같은 1646년 말 계왕 주유랑이 광둥 자오칭에서 영력제로 즉위했다. 영력제의 궁중에서는 황태후와 황후가 예수회 선교사에게 세례를 받았고(1648), 선교사 보임이 1650년 교황에게 보내는 편지를 가지고 유럽으로 떠났다고 전한다. 그러나 1650년 상가희·경계무 같은 투항 한인 장수가 이끄는 청군이 광저우를 되찾았고, 남명은 서남쪽 윈난·구이저우로 쫓겨났다. 1647년 죽은 장헌충이 쓰촨에서 세운 대서군의 장수 이정국이 영력제 편에 서서 1652년 계림에서 정남왕(定南王) 공유덕을 자살로 몰고 헝양에서 니칸을 죽여 후난·광시를 되찾았다. 그러나 1659년 청군이 쿤밍을 차지하자 영력제는 미얀마로 달아났다. 1661년 오삼계가 군대를 이끌고 미얀마 국경에 나타나자 미얀마 조정이 음력 12월 영력제를 넘겼고, 영력제는 1662년 쿤밍에서 처형되었다. 같은 해 이정국도 병으로 죽었다. 정성공은 1659년 창장강을 거슬러 올라가 난징을 포위했으나 실패한 뒤 타이완으로 눈을 돌렸다(「정성공의 타이완 점령과 정씨 정권, 천해령(1661~1684)」(뒤의 사건)). 남명의 여러 정권은 하나로 힘을 모으지 못했고, 청은 투항 한인 장수들을 앞세워 이들을 차례로 무너뜨렸다. 남명이 오래 버틴 데에는 변발령에 대한 한인 사대부의 반감이 컸다(「강남 정복과 변발령, 양저우·장인·자딩의 학살(1645~1646)」(뒤의 사건))."
  subjects: [qing, ming]
  tags: [war, politics]
