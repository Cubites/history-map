- id: queue-order-jiangnan-1645
  year: 1645
  endYear: 1646
  title:
    ko: "강남 정복과 변발령, 양저우·장인·자딩의 학살(1645~1646)"
  summary:
    ko: "청은 1644년 베이징에 들어간 뒤에도 남쪽의 명 잔여 세력과 이자성·장헌충의 군대를 따로 정리해야 했다. 1645년 도르곤은 동생 도도를 총사령으로 삼아 강남으로 보냈다. 도도의 군대는 음력 4월 말 양저우를 함락했다. 명의 병부상서 사가법이 이끌던 양저우는 성이 무너진 뒤 청군에게 약탈과 학살을 당했고, 사가법은 항복을 거부하다 죽었다. 생존자 왕수초의 『양저우십일기』는 열흘 동안의 참상을 기록했지만 죽은 이를 80여만 명이라 적은 것은 과장으로 본다. 도시 인구가 그만큼 많지 않았다는 연구가 있다. 도도의 군대는 음력 5월(양력 6월) 난징을 차지했고, 홍광제는 달아나다 붙잡혔다. 같은 해 음력 5월 말~6월(양력 6월 하순~7월 상순) 도르곤은 한인 남자에게 앞머리를 깎고 뒷머리를 땋게 하는 변발령을 다시 내렸다. 1644년 베이징에서 내렸다가 반발에 늦춘 명령이었다. 열흘 안에 따르지 않으면 죽인다는 엄한 기한이 붙었고, 머리를 지키면 목이 없고 목을 지키면 머리카락이 없다는 구호가 따랐다. 산둥 출신 투항 관료 손지해 같은 이들이 이 명령을 재촉했다고 한다. 머리 모양이 곧 복종의 표시였기에 강남 곳곳에서 항쟁이 일어났다. 부모에게서 받은 몸의 일부인 머리카락을 함부로 자르지 않는다는 유교의 관념도 반발을 키웠다. 장인에서는 염응원·진명우 등이 80여 일을 버텼고 음력 8월(양력 10월) 성이 무너지자 청군이 수만 명을 죽였다. 이들의 항전은 뒷날 의로운 저항으로 기억되었다. 자딩은 한인 출신 투항 장수 이성동이 세 번에 걸쳐 도륙했다. 청군 가운데 투항한 한인 장수와 병사의 몫이 컸다는 점도 눈여겨볼 대목이다. 변발령은 청이 정복자임을 분명히 하는 규정이 되었고, 강남의 사대부는 끝까지 저항하거나 은둔하는 길을 택했다. 변발은 청 말까지 이어졌다."
  subjects: [qing]
  tags: [war, society]
  sources: ["왕수초, 『양저우십일기』", "『청세조실록』", "Frederic Wakeman Jr., The Great Enterprise: The Manchu Reconstitution of Imperial Order in Seventeenth-Century China (University of California Press, 1985)", "Lynn A. Struve, Voices from the Ming-Qing Cataclysm: China in Tigers' Jaws (Yale University Press, 1993)"]

- id: kaozheng-scholarship-1660
  year: 1660
  endYear: 1790
  title:
    ko: "명 말 청 초의 사상가와 고증학(1660~1790)"
  summary:
    ko: "명이 망하고 청이 들어선 충격은 지식인에게 학문의 방향을 되묻게 했다. 황종희는 『명이대방록』(1663 무렵)에서 군주 한 사람이 천하를 사유물로 삼는 것을 비판했고, 고염무는 『일지록』에서 학문이 세상을 다스리는 데 쓰여야 한다는 경세치용을 강조했으며, 왕부지는 역사와 철학에서 독자적인 저술을 남겼다. 세 사람 모두 명의 유민으로 청의 관직을 사양했다. 고염무는 각지를 돌며 지리와 제도를 직접 조사하고 『천하군국이병서』를 엮었으며, 황종희는 『명유학안』으로 명대 사상사를 정리했다. 이들은 양명학이 추상의 심성 논의로 흘렀다는 반성에서 근거 있는 학문을 내세웠다. 강희 연간에 학문이 안정되자 경전의 글자와 뜻을 문헌에서 엄밀히 따지는 고증학이 자리 잡았다. 염약거는 『고문상서소증』에서 오래전부터 믿어 온 『고문상서』의 일부가 후대의 위작임을 밝혔다. 매문정은 서양 역법과 중국 역법을 함께 연구해 수학과 천문학의 기초를 닦았다. 18세기 건륭·가경 연간에는 혜동과 대진, 단옥재 같은 학자들이 소리와 글자에서 뜻을 알아내는 방법을 정교하게 다듬어 음운학과 문자학, 훈고학에서 큰 성과를 냈다. 이런 학풍은 쑤저우·양저우·항저우 같은 강남의 출판과 장서 문화, 부유한 상인의 후원에 힘입었다. 이 학풍은 건륭 연간에 가장 번성해 건가학파라 불린다. 청은 한편 『강희자전』(1716)과 『고금도서집성』(1725 무렵 완성) 같은 대규모 서적을 편찬하며 학술을 후원했고, 문자옥으로 정치 비판은 억눌렀다. 지식인이 현실 정치 대신 고증으로 기울었다는 평가도 있다. 고증학이 현실에서 멀어졌다는 비판 속에 경전을 개혁과 잇는 학풍이 뒤에 되살아나 변법 사상으로 이어졌다(「캉유웨이의 변법 운동과 무술정변(1895~1898)」(뒤의 사건))."
  subjects: [qing]
  tags: [culture, society]
  sources: ["황종희, 『명이대방록』", "고염무, 『일지록』", "『청사고』 유림전", "Benjamin A. Elman, From Philosophy to Philology: Intellectual and Social Aspects of Change in Late Imperial China (Harvard University Council on East Asian Studies, 1984)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: koxinga-taiwan-1661
  year: 1661
  endYear: 1684
  title:
    ko: "정성공의 타이완 점령과 정씨 정권, 천해령(1661~1684)"
  summary:
    ko: "정성공은 정지룡의 아들로 일본 히라도에서 태어났다. 융무제에게서 명 황실의 성인 주(朱)를 받아 국성야로 불렸다. 아버지가 청에 항복한 뒤에도 명을 되살린다며 푸젠 연안의 샤먼과 진먼을 근거지로 싸웠다. 1659년 창장강을 따라 올라가 난징을 에워쌌으나 패해 물러나자 새 근거지가 필요해졌다. 타이완 남부는 1624년부터 네덜란드 동인도 회사가 차지해 젤란디아 성을 세워 놓고 있었다. 정성공은 1661년 군대를 이끌고 타이완에 상륙해 성을 포위했고, 1662년 2월 총독 코이에트가 항복해 네덜란드의 통치가 끝났다. 타이완 남부 안핑의 옛 성은 이후 정씨 정권의 중심 항구가 되었다. 정성공은 그해 6월 서른일곱 살로 죽었다. 청은 이에 앞서 1661년 정씨 세력과 바닷가 주민의 연결을 끊으려고 연안 주민을 안쪽으로 옮기는 천해령을 내렸다. 연안 수십 리 안의 집과 배를 불태우고 주민을 내몰아 바닷가 주민의 피해가 컸다. 정성공이 죽은 뒤 숙부 정습과 계승을 다툰 정경이 타이완을 이어받았고, 1663~1664년 청·네덜란드 연합군에게 샤먼과 진먼을 잃고 타이완으로 물러났다. 정경은 한인 이주민과 둔전으로 기반을 닦았다. 정경 정권은 명의 제도를 본뜬 육관을 두고 1666년 공자묘와 학당을 세웠으며, 일본·동남아와의 무역과 청 연안과의 밀무역으로 재정을 꾸렸다. 삼번의 난 때인 1674년에는 푸젠 연안으로 군대를 보냈으나 청에게 밀려 1680년 물러났다. 정경이 1681년 죽은 뒤 어린 정극상이 이어받았다. 청은 1683년 시랑의 수군을 보내 펑후 해전에서 이겼고, 정극상은 항복했다. 강희제는 조정 안의 타이완 포기론을 물리치고 1684년 푸젠성 관할 타이완부를 두었다. 천해령도 이 무렵 거두었다(「삼번의 난과 청의 타이완 정복」(뒤의 사건)은 이 일을 조선 쪽에서 다룬 글이다). 타이완에 사는 평포족 같은 원주민은 네덜란드와 정씨, 청의 통치를 차례로 겪었다."
  subjects: [qing, dutch-republic]
  tags: [war, politics]
  sources: ["『청사고』 성조본기", "『청사고』 시랑전", "Tonio Andrade, How Taiwan Became Chinese: Dutch, Spanish, and Han Colonization in the Seventeenth Century (Columbia University Press, 2008)", "Lynn A. Struve, The Southern Ming, 1644–1662 (Yale University Press, 1984)"]

- id: kangxi-early-rule-1661
  year: 1661
  endYear: 1685
  title:
    ko: "강희제의 즉위와 오보이 제거, 치수와 해금 해제(1661~1685)"
  summary:
    ko: "1661년 순치제가 천연두로 스물두 살에 죽고 여섯 살 현엽이 뒤를 이으니 강희제이다. 소니·수크사하·에빌룬·오보이 네 보정대신이 정치를 맡았다. 그 가운데 오보이는 팔기의 이익을 앞세우며 권력을 독점해 갔다. 1667년 열세 살 강희제가 친정을 선포했고, 1669년 오보이를 붙잡아 가두었다. 오보이는 곧 옥중에서 죽었다. 같은 해 강희제는 오보이 때 늘었던, 한인 농지를 빼앗아 팔기에 주는 권지를 금지해 한인 농민의 불만을 가라앉혔다. 이후 삼번의 난(「삼번의 난과 청의 타이완 정복」(뒤의 사건)에서 조선 쪽 파장을 다룬다)을 겪으면서도 강희제는 한인 지식인을 끌어들이려 힘썼다. 1679년 박학홍유과를 열어 이름난 학자를 불렀고, 이들은 『명사』 편찬(1679 시작, 1739 완성)에 참여했다. 강희제는 선교사 페르비스트에게서 천문과 기하를 배우기도 했다. 1684년 첫 남순길에는 곡부의 공자묘에서 직접 제사를 올려 유교 전통을 존중하는 모습을 보였다. 가장 큰 현안은 황허강과 대운하였다. 황허강은 잦은 범람으로 대운하의 물길이 막히기 일쑤였고, 강희제는 1677년 근보를 하도총독에 앉혀 제방과 물길을 고치게 했다. 강희제는 1684년부터 여섯 차례 남쪽을 순행하며 치수 현장과 강남의 민심을 직접 살폈다. 대외 정책도 바뀌었다. 정씨 세력을 누르기 위한 천해령으로 바닷가 무역이 막혀 있었으나, 타이완을 차지한 뒤인 1684년 바다 무역을 허락하고 이듬해 광둥·푸젠·저장·장쑤에 해관을 두어 세금을 걷게 했다. 해금이 풀리자 푸젠과 광둥 상인이 동남아로 나가는 길도 다시 열렸다. 이는 뒤의 광저우 무역 체제로 이어지는 출발점이다(「광저우 무역 체제와 공행(1757~1842)」(뒤의 사건))."
  subjects: [qing]
  tags: [politics, economy]
  sources: ["『청성조실록』", "『청사고』 성조본기", "『청사고』 오배전", "Jonathan D. Spence, Emperor of China: Self-Portrait of K'ang-hsi (Alfred A. Knopf, 1974)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: sanfan-revolt-1673
  year: 1673
  endYear: 1681
  title:
    ko: "삼번 철폐와 삼번의 난, 강희제의 평정(1673~1681)"
  summary:
    ko: "삼번은 청의 중국 정복을 도운 한인 장수 세 사람이 받은 봉지였다. 오삼계는 윈난·구이저우의 평서왕, 상가희는 광둥의 평남왕, 경계무의 아들 경정충은 푸젠의 정남왕(靖南王)이었다. 이들은 자기 군대와 재정권을 쥐어 조정의 큰 부담이 되었다. 1673년 상가희가 늙어 요동으로 돌아가길 청하며 아들 상지신에게 번을 물려주려 하자, 강희제는 세습을 허락하지 않고 번을 아예 거두기로 했다. 오삼계와 경정충도 조정의 뜻을 떠보려 철번을 청했는데, 조정은 이를 받아들였다. 오삼계는 1673년 음력 11월(양력 12월) 윈난에서 군대를 일으켜 명을 되살린다는 구호를 내걸었다. 반란은 구이저우·쓰촨·후난으로 번졌고 경정충(1674)과 상지신(1676)이 호응해 청의 남쪽이 크게 흔들렸다. 타이완의 정경도 푸젠 연안으로 군대를 보내 합세했으나 곧 사이가 틀어졌다(「정성공의 타이완 점령과 정씨 정권, 천해령(1661~1684)」(앞의 사건)). 청은 초기에 팔기군이 부진했고, 한인으로 이루어진 녹영군이 전투의 주력이 되었다. 강희제는 반란 가담자에게 자수의 길을 열어 주며 갈라 세웠다. 경정충과 상지신이 청에 항복하자 오삼계는 고립되었다. 특히 간쑤·산시(陝西)의 녹영 장수 장용·왕진보·손사극·조량동 등이 쓰촨과 윈난을 되찾는 데 공이 컸다. 청은 군비를 메우려고 돈을 받고 관직과 학위를 주는 연납도 늘렸다. 선교사 페르비스트는 1674년 이후 청군을 위해 대포를 주조했다. 오삼계는 1678년 후난 헝양에서 황제를 칭하고 나라 이름을 주라 했으나 그해 음력 8월 병으로 죽었다. 손자 오세번이 윈난으로 물러나 버텼으나 1681년 청군이 쿤밍을 에워싸자 스스로 목숨을 끊어 난이 끝났다. 이 난을 거치며 청은 한인 장수가 군대와 영지를 쥐는 방식을 접고 중앙의 통제를 굳혔다."
  subjects: [qing]
  tags: [war, politics]
  sources: ["『청성조실록』", "『청사고』 오삼계전", "『청사고』 성조본기", "Jonathan D. Spence, Emperor of China: Self-Portrait of K'ang-hsi (Alfred A. Knopf, 1974)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: galdan-war-1688
  year: 1688
  endYear: 1697
  title:
    ko: "갈단의 할하 침공과 강희제의 친정(1688~1697)"
  summary:
    ko: "서몽골의 오이라트 가운데 준가르부의 갈단은 티베트에서 승려로 지내다 돌아와 1670년대에 형 승게의 원수를 갚고 부를 이끌게 되었다. 갈단은 달라이 라마에게서 칸의 칭호를 받고(1670년대 후반) 타림 분지를 차지한 데 이어 동쪽으로 눈을 돌렸다. 직접 계기는 1687~1688년 무렵 외몽골 할하의 투시예투 칸이 갈단의 동생을 죽인 일이었다. 1688년 갈단이 외몽골의 할하를 치자 할하의 투시예투 칸과 몽골 불교의 지도자 젭춘담바 호탁트는 남쪽 내몽골로 달아나 청에 도움을 청했다. 강희제는 1689년 러시아와 네르친스크 조약을 맺어 북쪽을 안정시킨 뒤(「네르친스크 조약」(뒤의 사건)) 갈단 문제에 힘을 쏟았다. 갈단은 1689년 조카 체왕 랍탄에게 준가르 본거지를 빼앗겨 곤란에 빠졌지만 1690년 내몽골 깊숙이 들어왔고, 청군은 울란부퉁에서 맞붙었으나 승패가 분명치 않았으며 갈단은 대열을 지킨 채 물러났다. 1691년 할하의 여러 왕공은 돌론노르에서 강희제를 만나 청의 신하가 되었고, 이들은 팔기를 본뜬 기(旗)로 편성되었다. 갈단은 그 뒤에도 북쪽 초원에서 힘을 모았다. 강희제는 1696~1697년 세 차례 직접 군대를 이끌고 북쪽으로 나섰다. 1696년에는 청군이 동로·중로·서로의 세 갈래로 나뉘어 북진했다. 1696년 음력 5월 자오모도에서 청의 서로군이 갈단을 크게 무찔렀고, 갈단은 1697년 알타이 산중에서 죽었다. 죽은 방식은 병사라는 설과 음독이라는 설이 갈린다. 이 전쟁으로 청은 외몽골(할하)을 확실히 차지하게 되었다. 이는 몽골의 유목 사회가 청의 번부 체제 안으로 들어가는 일이었다. 그러나 갈단의 조카 체왕 랍탄이 이리에서 준가르를 이끌며 청과의 싸움은 이어졌다(「청의 외몽골·티베트·칭하이 복속」(뒤의 사건))."
  subjects: [qing, mongols, russia-tsardom]
  links:
    - { from: qing, to: mongols, note: "할하 귀부, 갈단 격파 (1691~1697)" }
  tags: [war, politics]
  sources: ["『청성조실록』", "『친정평정삭막방략』", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Belknap Press of Harvard University Press, 2005)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: rites-controversy-1692
  year: 1692
  endYear: 1742
  title:
    ko: "천주교 관용령과 전례 논쟁, 금교(1692~1742)"
  summary:
    ko: "청은 명 말에 들어온 예수회 선교사를 받아들여 흠천감에서 천문과 역법을 맡겼다. 순치제는 아담 샬을 가까이 두었고, 시헌력은 청의 공식 역법이 되었다(「시헌력 채택」(앞의 사건)은 이 역법이 조선에 들어간 일을 다룬다). 그러나 1664~1665년 양광선의 고발로 아담 샬 등이 옥에 갇히는 교안이 있었고, 1669년 강희제가 페르비스트를 흠천감에 복귀시키며 서양 천문학의 자리가 되살아났다. 강희제는 선교사의 대포 제작과 천문 지식, 네르친스크 조약의 통역에 도움을 받아 1692년 천주교를 해롭지 않다고 보아 포교를 허락했다. 문제는 신자의 조상 제사와 공자 제사였다. 18세기 초 중국인 신자는 수십만 명으로 추산된다. 마테오 리치 이래 예수회는 이를 사회적 예절로 보아 허용했지만(「마테오 리치의 베이징 선교와 『천주실의』」(앞의 사건)), 도미니코회와 프란치스코회는 우상 숭배라며 반대했다. 한편 예수회 선교사 제르비옹과 부베는 강희제에게 기하학과 천문을 가르쳤고, 이탈리아인 카스틸리오네는 1715년 베이징에 와 낭세녕이라는 이름으로 궁정 화가로 일했다. 교황 클레멘스 11세는 1704년 이를 금지했고, 강희제는 1706년 리치의 방식을 따르겠다고 서약한 선교사에게만 체류 허가증을 주었다. 교황청이 1715년 금지를 거듭 확인하고 1720년 사절 메차바르바가 와서 협상했으나 풀리지 않았다. 강희제는 1721년 교황의 간섭에 반발하며 서양인의 포교를 금지하는 편이 낫겠다는 뜻을 밝혔다. 옹정제는 1724년 흠천감의 선교사를 빼고 선교사를 마카오로 보내는 금교령을 내렸다. 교황 베네딕토 14세가 1742년 조상 제사를 다시 금지하면서 논쟁은 끝났다. 청은 종교와 의례에서도 황제의 권위를 지키려 했고, 천주교 포교와 서양 학문이 들어오는 길은 좁아졌다(「예수회 해산」(뒤의 사건))."
  subjects: [qing]
  tags: [religion, diplomacy]
  sources: ["『청성조실록』", "『청사고』 성조본기", "David E. Mungello 편, The Chinese Rites Controversy: Its History and Meaning (Institut Monumenta Serica, 1994)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: qing-population-economy-1700
  year: 1700
  endYear: 1800
  title:
    ko: "청 중기의 인구 증가와 상업 경제(1700~1800)"
  summary:
    ko: "청은 17세기 말 전란이 가라앉은 뒤 한 세기 동안 인구가 크게 늘었다. 추산으로 1700년 1억 5천만 안팎이던 인구가 1800년 무렵 3억 안팎이 되었다. 청의 보갑 제도에 따른 인구 집계는 1741년 1억 4천만 명, 1790년 3억 명 남짓으로 나왔으나 신뢰도를 두고 논쟁이 있다. 오랜 평화와 세금 제도의 변화, 새 작물이 이를 뒷받침했다. 1712년 강희제가 이후 늘어나는 인구에는 정세를 더 걷지 않겠다고 선언했고, 이어 옹정제 때 정세를 토지세에 합치는 지정은제가 퍼지자 호적에 오르는 인구가 늘었다. 아메리카에서 들어온 옥수수와 고구마, 땅콩은 벼가 자라지 않는 산비탈과 척박한 땅에서도 잘 자라서 쓰촨·후베이·후난·산시(陝西)의 산악 지대가 개간되었다. 인구가 넘치는 강남과 푸젠에서 쓰촨, 만주, 타이완, 동남 아시아로 옮겨 가는 사람도 많았다. 장쑤·저장의 비단과 면직물, 안후이 상인과 산시(山西) 상인이 이끈 소금과 금융업은 전국을 하나의 시장으로 엮었다. 동향 상인이 세운 회관과 공소가 도시마다 자리 잡았고, 양저우의 소금 상인은 전매 허가로 큰 부를 쌓았다. 강남의 농가는 쌀 대신 면화와 뽕나무를 심고 곡식은 창장강 중상류에서 사 오는 분업이 자리 잡았다. 차와 비단, 도자기를 광저우에서 팔아 들어온 은이 시장의 화폐 구실을 했다(「광저우 무역 체제와 공행(1757~1842)」(뒤의 사건)). 그러나 늘어난 인구에 견줘 경작지는 한계가 있어 1인당 땅이 줄었고, 쓰촨·후베이·산시(陝西)의 산악 지대로 흘러든 유민 사이에서는 불안이 쌓였다. 이는 곧 백련교의 난으로 이어졌다(「백련교의 난과 화신의 몰락, 팔괘교의 자금성 습격(1796~1813)」(뒤의 사건)). 건륭제의 성세 뒤에는 인구와 자원의 불균형이라는 구조적 문제가 있었다."
  subjects: [qing]
  tags: [economy, society]
  sources: ["Ho Ping-ti, Studies on the Population of China, 1368–1953 (Harvard University Press, 1959)", "William T. Rowe, China's Last Empire: The Great Qing (Belknap Press of Harvard University Press, 2009)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: qing-tibet-1717
  year: 1717
  endYear: 1751
  title:
    ko: "준가르의 라싸 점령과 청의 티베트 경영, 암반과 가샥(1717~1751)"
  summary:
    ko: "티베트는 17세기 중엽부터 5대 달라이 라마와 칭하이의 호쇼트부 구시 칸이 손잡고 다스렸다. 그러나 호쇼트의 라짱 칸은 1705년 섭정 상계 갸초를 죽이고 1706년 6대 달라이 라마를 폐위했다. 이에 반발한 티베트 안의 불만을 틈타 준가르의 체왕 랍탄은 1717년 군대를 보내 라싸를 점령하고 라짱 칸을 죽였다. 강희제는 이듬해 군대를 보냈으나 살윈강 일대에서 전멸에 가까운 패배를 당했다. 청은 1720년 두 갈래로 다시 군대를 보내 준가르를 몰아내고 라싸에 들어갔으며, 리탕 출신의 어린 켈상 갸초를 7대 달라이 라마로 앉혔다(「청의 외몽골·티베트·칭하이 복속」(앞의 사건)). 청과 달라이 라마의 관계는 1653년 5대 달라이 라마가 베이징에서 순치제를 만난 때로 거슬러 올라가고, 강희제는 1713년 판첸 라마에게도 칭호를 내렸다. 청은 티베트 불교를 후원하며 몽골인과 티베트인을 아우르는 수단으로 삼았고, 베이징의 옹화궁을 1744년 티베트 불교 사원으로 바꾸었다. 청은 호쇼트 칸을 다시 세우지 않고 티베트 귀족 가운데서 칼룬들로 이루어진 위원회(가샥)를 두어 다스리게 했다. 1727~1728년 귀족 사이의 내전이 일어나 캉첸네가 살해되자, 청군이 개입해 폴하네가 권력을 잡도록 도왔고 1728년부터 황제의 대신인 암반 둘을 라싸에 주재시켰다. 청군 일부도 라싸에 남아 지켰고, 티베트의 일은 번부를 맡는 이번원이 관리했다. 폴하네가 1747년 죽고 아들 규메 남갈이 뒤를 이었는데, 1750년 암반이 규메 남갈을 죽이자 격분한 군중이 암반을 살해했다. 청이 군대를 보내 수습했고, 1751년 건륭제가 13조 장정을 정해 달라이 라마가 가샥과 함께 정치를 맡되 암반이 이를 감독하게 했다. 이로써 티베트는 청의 통제 아래 달라이 라마의 정부가 통치하는 체제가 굳었다."
  subjects: [qing]
  tags: [politics, war, religion]
  sources: ["『청사고』 번부전 서장", "Luciano Petech, China and Tibet in the Early 18th Century: History of the Establishment of Chinese Protectorate in Tibet (E. J. Brill, 1950)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: yongzheng-reforms-1722
  year: 1722
  endYear: 1735
  title:
    ko: "옹정제의 즉위와 지정은제, 군기처, 문자옥(1722~1735)"
  summary:
    ko: "1722년 음력 11월 강희제가 죽자 넷째 아들 윤진이 즉위하니 옹정제이다. 강희제 만년의 후계 다툼 속에 이루어진 즉위여서 그 정통성을 둘러싼 의심은 오래 이어졌다. 옹정제는 같은 일을 되풀이하지 않으려고 후계자의 이름을 밀봉해 건청궁 정대광명 편액 뒤에 두고 사후에 열게 하는 비밀 건저의 방식을 만들었다. 또 관료들이 황제에게 직접 올리는 비밀 보고서인 주접 제도를 크게 넓혀, 황제가 붉은 글씨로 직접 답을 달아 보냈다. 재정 개혁도 이어졌다. 지방관이 세금으로 거둔 은을 녹여 주조할 때 줄어드는 몫을 메운다는 명목으로 덧붙이던 화모를 국가가 공식 세목으로 거두어 관료의 봉급 보충(양렴은)과 지방 재정에 쓰게 했다(화모귀공). 또 사람 수에 매기던 정세를 토지세에 합쳐 부과하는 지정은제도 1723년 즈리를 시작으로 각 성에 퍼졌다. 이는 땅이 적은 가난한 농민의 부담을 가볍게 했지만, 지방의 시행 속도는 달랐다. 옹정제는 1720년대 말 서북 군사 작전을 위해 군수방을 설치했고, 이 기구는 군기처로 자리 잡아(연대는 1730년대 초까지 학설이 갈린다) 황제 직속의 최고 정책 기구가 되었다. 연갱요와 악종기는 1723~1724년 칭하이 롭상 단진의 반란을 눌렀다(「청의 외몽골·티베트·칭하이 복속」(앞의 사건)). 그러나 옹정제는 세력이 커진 연갱요를 1726년 자결하게 했고, 황위를 다투었던 동생 윤사와 윤당도 가두어 옥중에서 죽게 했다. 1728년에는 증정 사건이 터졌다. 증정이 여류량의 한인 중심 사상에 영향을 받아 쓰촨·산시(陝西) 총독 악종기를 부추겨 반란을 꾀하려다 발각된 것이다. 옹정제는 증정을 벌하는 대신 1730년 직접 『대의각미록』을 써 청이 이민족 왕조라는 비판에 반박하려 했고, 건륭제는 즉위한 뒤 이 책을 거두고 증정을 처형했다. 옹정제는 1735년 음력 8월 죽었다."
  subjects: [qing]
  tags: [politics]
  sources: ["『청세종실록』", "『청사고』 세종본기", "Madeleine Zelin, The Magistrate's Tael: Rationalizing Fiscal Reform in Eighteenth-Century Ch'ing China (University of California Press, 1984)", "Beatrice S. Bartlett, Monarchs and Ministers: The Grand Council in Mid-Ch'ing China, 1723–1820 (University of California Press, 1991)", "Jonathan D. Spence, Treason by the Book (Viking, 2001)"]

- id: gaitu-guiliu-1726
  year: 1726
  endYear: 1736
  title:
    ko: "개토귀류와 서남 변경의 묘강 편입(1726~1736)"
  summary:
    ko: "윈난·구이저우·광시·쓰촨 서부 산악 지대에는 원 이래 토사라 불리는 소수 민족 수령이 세습으로 다스리는 지역이 많았다. 토사는 조정에 공물을 바치고 군대를 대 주는 대신 자치를 누렸다. 명 때도 일부 지역에서 토사를 없애고 조정이 보내는 관리가 다스리게 하는 일이 있었지만, 이를 본격으로 추진한 이는 옹정제였다. 옹정제는 1726년 만주인 오르타이를 윈난·구이저우 총독에 앉히고 이 정책을 맡겼다. 오르타이는 토사의 세습 지배권을 없애고 일정 기간마다 바뀌는 유관을 보내며, 토지를 조사해 세금을 걷고 학교를 세우는 개토귀류를 밀어붙였다. 토사가 순순히 따르면 관직과 보상을 주었으나 저항하는 곳은 군대로 눌렀다. 토사의 지배를 받던 주민은 토사에게 내던 세와 부역을 조정의 세금으로 바꾸어 내게 되었다. 청은 새로 편입한 지역에 학교와 현성을 세우고 한인 관리와 병력을 배치했다. 1731~1732년 구이저우 동남부 묘강의 구저우(古州) 일대를 평정해 청의 직접 통치 아래 두었다. 그러나 이 과정에서 군대의 약탈과 한인 상인·이주민의 토지 침탈, 세금 부담이 겹쳐 묘족의 불만이 쌓였다. 1735년 옹정제 말에 묘강에서 대규모 봉기가 일어났고, 건륭제가 즉위한 뒤 1736년 장광사가 이끈 청군이 겨우 진압했다. 건륭제는 이후 변경에 대한 개입을 신중히 하는 쪽으로 방향을 틀었다. 개토귀류로 서남 변경은 중앙의 행정 안에 들어갔지만, 이 지역 주민의 삶은 큰 변화를 겪었고 한인의 이주가 늘며 갈등도 따랐다. 개토귀류는 소수 민족 지역을 한인 중심의 군현 질서에 맞추려는 성격이 강해, 묘족 등은 땅과 풍속에서 압박을 받았다. 이 문제는 뒤에 쓰촨 서부 금천 일대의 전쟁에서도 이어졌다(「건륭제의 십전무공(1747~1792)」(뒤의 사건))."
  subjects: [qing]
  tags: [politics, society]
  sources: ["『청세종실록』", "『청사고』 악이태전", "Laura Hostetler, Qing Colonial Enterprise: Ethnography and Cartography in Early Modern China (University of Chicago Press, 2001)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: kyakhta-treaty-1727
  year: 1727
  title:
    ko: "캬흐타 조약과 러시아 교역(1727)"
  summary:
    ko: "네르친스크 조약(1689)은 동쪽 국경(아르군강·스타노보이 산맥)만 정했을 뿐 외몽골과 시베리아 사이의 서쪽 국경은 정하지 않은 채 남겨 놓았다(「네르친스크 조약」(앞의 사건)). 러시아는 1721년 표트르 1세가 제국을 선포한 뒤 중국과의 교역을 넓히고 싶었고, 청은 준가르와 러시아의 연합을 막고 몽골 북쪽 국경을 안정시키려 했다. 네르친스크 조약 뒤에도 러시아 상인 대상은 1693년 이데스의 사절단 등을 따라 베이징을 오갔고, 1719년 이즈마일로프의 사절이 갔으나 국경 문제는 풀리지 않았다. 외몽골에서 러시아 쪽으로 넘어가는 유목민이 늘어난 것도 국경 획정을 서두르게 했다. 1685년 알바진에서 잡힌 코사크 가운데 일부는 청의 팔기에 편입되어 베이징에 살며 정교회 신앙을 이어 가고 있었다. 양쪽은 1727년 협상을 이어 갔다. 러시아의 대표는 세르비아계 사바 블라디슬라비치였고, 청의 대표는 할하의 체렝 친왕과 툴리선 등이었다. 협상 끝에 1727년 부린스키 협정에 이어 캬흐타 조약이 맺어졌다. 조약은 캬흐타에서 서쪽으로 사얀 산맥 서부의 샤빈다바가, 동쪽으로 아르군강까지 이어지는 몽골 북쪽 국경에 표지를 세워 경계를 확정했다. 러시아는 3년마다 상인 대상을 베이징에 보낼 수 있게 되었고, 캬흐타와 추루하이투에 국경 시장이 열렸다. 베이징에는 러시아 정교회 사제단이 머물 수 있었다. 러시아 학생이 베이징에 머물며 중국어와 만주어를 배우는 것도 허용되었다. 범죄자와 도망자는 서로 돌려보내기로 했다. 청은 러시아가 외몽골의 도망자를 받아들이지 않기로 한 점을 특히 중요하게 보았다. 이후 캬흐타는 러시아의 모피와 중국의 차·비단이 오가는 큰 시장이 되어 19세기 중엽까지 두 나라 교역의 중심 구실을 했다. 청은 이 조약으로 몽골 북쪽을 안정시켰고, 러시아는 중국 시장에 접근하는 길을 얻었다."
  subjects: [qing, russia]
  links:
    - { from: qing, to: russia, note: "몽골 북쪽 국경 확정과 교역 허용 (1727)" }
  tags: [diplomacy, economy]
  sources: ["「캬흐타 조약」(1727)", "『청세종실록』", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: qianlong-ten-campaigns-1747
  year: 1747
  endYear: 1792
  title:
    ko: "건륭제의 십전무공(1747~1792)"
  summary:
    ko: "건륭제는 1792년 스스로 십전노인이라 부르며 재위 중 열 번의 큰 승리를 기렸다. 이를 십전무공이라 한다. 열 가지는 준가르 평정 두 차례(1755·1757), 타림 분지의 회부 평정(1758~1759), 대금천·소금천 두 차례(1747~1749, 1771~1776), 타이완의 임상문 사건 진압(1786~1788), 미얀마 원정(1765~1769), 베트남 원정(1788~1789), 구르카 원정 두 차례(1788~1792)이다. 준가르와 회부 평정은 「건륭제의 준가르 정벌과 신장 편입(1755~1759)」(뒤의 사건)에서 따로 다룬다. 쓰촨 서부 산악의 금천은 티베트계 주민이 사는 곳으로, 토사 사이의 다툼에 청이 개입해 험한 산악에서 두 차례 힘든 싸움을 치렀다. 둘째 싸움에서는 아계 등이 돌로 쌓은 망루(碉)를 하나하나 깨고 나서야 끝낼 수 있었다. 임상문은 천지회와 이어진 인물로 타이완 중부 장화에서 일어나 한때 타이완 중서부의 여러 현성을 차지했으나 복강안이 이끄는 청군에 진압되었다. 미얀마 원정은 윈난 국경의 분쟁에서 시작되어 네 차례 군대가 밀림과 열병으로 큰 피해를 입고 물러나 끝내 목적을 이루지 못했다. 1788년 베트남 레 왕조의 요청으로 군대를 보냈으나 이듬해 떠이선의 응우옌 후에에게 크게 져서 물러났고, 곧 응우옌 후에를 안남 국왕으로 책봉하는 쪽으로 방향을 바꾸었다. 네팔의 구르카가 티베트를 침입하자 복강안이 군대를 이끌고 티베트로 가서 1792년 네팔 쪽 국경 안까지 밀어붙여 구르카가 화의를 청하게 했다. 열 번의 전쟁에서 이긴 것보다 비용이 엄청나게 든 전쟁이 많았고, 건륭제 말의 재정 약화로 이어졌다고 본다. 십전무공은 청이 북서쪽 변경과 서남 변경에 영토를 넓힌 정점이면서 한계도 보여 준다. 이 전쟁들로 청의 영토는 건륭 말에 최대 규모에 이르렀다."
  subjects: [qing]
  tags: [war, politics]
  sources: ["『십전기』(건륭제 지음)", "『청고종실록』", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Belknap Press of Harvard University Press, 2005)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: qianlong-dzungar-1755
  year: 1755
  endYear: 1759
  title:
    ko: "건륭제의 준가르 정벌과 신장 편입(1755~1759)"
  summary:
    ko: "준가르는 갈단 체렝이 죽은 1745년 뒤 내분에 빠졌다. 칸 자리를 놓고 다와치와 아무르사나가 싸우다 패한 아무르사나가 1754년 청에 투항했다. 건륭제는 1755년 아무르사나를 앞세워 군대를 보냈고, 청군은 이리를 차지해 다와치를 사로잡았다. 준가르 사회는 내분과 천연두 유행으로 이미 크게 약해져 있었다. 건륭제는 준가르를 여러 부로 나누어 각각 칸을 세우려 했으나, 한 부의 칸으로 만족하지 못한 아무르사나가 청군이 물러가자 반란을 일으켰다. 이 무렵 외몽골의 할하 귀족 칭귄자브도 1756년 청에 맞서 일어났다가 이듬해 진압되었다. 청은 1756~1757년 더 큰 군대로 준가르 땅을 휩쓸었고, 아무르사나는 러시아로 달아났다가 1757년 천연두로 죽었다. 전쟁 중 청군(팔기·녹영과 할하 몽골 부대)과 청에 가담한 타림 분지 주민의 학살, 천연두, 굶주림이 겹쳐 준가르 사회는 사실상 무너졌다. 건륭제는 투항한 이도 죽이고 젊고 건장한 이를 처형하라고 명했다고 전한다. 청대 학자 위원(魏源)은 준가르 약 60만 가운데 천연두로 약 40퍼센트, 달아난 이가 약 20퍼센트, 청군에게 살해된 이가 약 30퍼센트라고 적었으나 현대 연구자의 추산은 사망자 40만~60만 이상(퍼듀·클라크 42만~48만, 화이트 60만, 더 높은 추산도 있다)으로 인구의 70~80퍼센트에 이른다고 본다. 학자들은 이를 제노사이드로 부르기도 하나 용어를 두고 의견이 갈린다. 청은 이어 1758~1759년 타림 분지에서 위구르 지도자 호자 형제가 일으킨 반란을 눌러 카슈가르·야르칸드 등을 차지했다. 호자 형제는 준가르의 타림 분지 지배기에 이리에 볼모로 잡혀 있다가 청군이 이리를 차지하자 풀려난 이들이었다. 새로 얻은 땅은 새 영토라는 뜻의 신장으로 불렸고, 청은 뒤에(1762) 이리에 장군을 두어 다스렸다(신장성은 1884년 설치). 우루무치 등지에는 한인 농민과 위구르 이주민, 팔기 부대가 옮겨 가 둔전을 일구었다."
  subjects: [qing, russia]
  tags: [war, politics]
  sources: ["『평정준갈이방략』", "『청고종실록』", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Belknap Press of Harvard University Press, 2005)", "James A. Millward, Beyond the Pass: Economy, Ethnicity, and Empire in Qing Central Asia, 1759–1864 (Stanford University Press, 1998)"]

- id: canton-system-1757
  year: 1757
  endYear: 1842
  title:
    ko: "광저우 무역 체제와 공행(1757~1842)"
  summary:
    ko: "강희제가 1684년 바다 무역을 허락한 뒤 서양 상인은 여러 항구에서 장사할 수 있었다. 그러나 건륭제는 1757년 서양 선박의 입항을 광저우 한 곳으로 제한했다. 1759년에는 영국 상인 플린트가 북쪽 항구에서 직접 호소하려다 처벌받아 마카오에 3년 가까이 갇힌 일이 있었다. 광저우에서는 1760년 무렵 공행이라 불린 허가 상인 조합이 외국 상인을 상대하는 독점권을 얻었다. 공행 상인은 외국 배의 세금과 행동에 보증을 서고, 광둥 해관 감독이 이들을 감독했다. 외국 상인은 무역철이 끝나면 포르투갈인이 사는 마카오로 물러가야 했고, 광저우에서는 정해진 상관 지역(13행)에서만 지내며 여성을 데려올 수 없었다. 청 관리와 직접 서신을 주고받는 것도 막혀 있어 외국 상인은 공행을 통해서만 요구를 전했다. 공행은 대신 큰 이익을 누려 오병감(伍秉鑑) 같은 상인은 세계에서 손꼽히는 부자가 되었다. 이 체제 아래서 영국 동인도 회사는 차를 대량으로 사들였다. 1784년 영국이 차 관세를 크게 내리자 수입은 더 늘었고, 미국(1784년 첫 배)과 프랑스·네덜란드 상인도 광저우로 왔다. 청은 차와 비단, 도자기를 팔고 은을 받아 갔지만, 영국은 중국에 팔 만한 상품이 마땅치 않아 수입이 늘수록 은이 중국으로 흘러들었다. 영국 상인이 인도산 아편을 중국에 들여오면서 19세기 들어 흐름이 거꾸로 되어 은이 중국에서 빠져나갔다. 청의 관리는 무역을 중화 질서의 은혜로 여겼고 영국은 평등한 통상을 원했다. 이 체제는 청이 외국과의 무역을 국가 사이의 외교가 아니라 상인과 관리의 문제로 다루는 방식이었다. 두 시각의 충돌은 「매카트니 사절단과 건륭제의 칙서(1792~1794)」(뒤의 사건)로 이어졌고, 끝내 아편 전쟁이 터져 1842년 난징 조약이 공행의 독점을 폐지하면서 이 체제는 막을 내렸다(「임칙서의 아편 금지와 아편 전쟁(1838~1844)」(뒤의 사건))."
  subjects: [qing, uk, usa, france, dutch-republic, portugal]
  links:
    - { from: qing, to: uk, note: "무역을 광저우로 제한 (1757)" }
  tags: [economy, diplomacy]
  sources: ["『대청회전』", "Paul A. Van Dyke, The Canton Trade: Life and Enterprise on the China Coast, 1700–1845 (Hong Kong University Press, 2005)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: siku-quanshu-1772
  year: 1772
  endYear: 1787
  title:
    ko: "『사고전서』 편찬과 문자옥(1772~1787)"
  summary:
    ko: "건륭제는 1772년 천하의 책을 모아 바치라고 명했고, 이듬해 사고전서관을 열어 대규모 편찬을 시작했다. 총찬관 기윤과 육석웅 등 학자 수백 명이 책을 고르고 교정했으며, 필사생 수천 명이 베껴 썼다. 책은 경(經)·사(史)·자(子)·집(集)의 네 부로 나뉘었다. 첫 질이 1782년 완성되었고 모두 일곱 질이 만들어져 베이징·선양·열하의 궁궐 네 곳과 강남의 전장·양저우·항저우 세 곳에 나누어 보관되었다. 모두 3,400~3,600종 안팎, 3만 6천여 책의 방대한 규모로, 중국 고전 문헌을 갈무리한 일이었다. 수록하지 않고 제목과 해제만 『사고전서총목제요』에 남긴 책도 6천 종이 넘는다. 명의 『영락대전』에서 사라진 책 수백 종을 뽑아 되살리는 작업도 함께 이루어졌다. 편찬 관원이 360여 명, 필사원이 3,800여 명에 이르렀다고 전한다. 기윤은 『사고전서총목제요』의 집필을 이끌었다. 책 이름과 저자를 간추린 『사고전서간명목록』도 따로 만들었다. 책을 모으는 일은 한인 지식인을 학술 사업에 끌어들여 정치적 반감을 누그러뜨리려는 뜻도 있었다. 한편 책을 모으는 과정은 사상 검열이기도 했다. 청을 비난하거나 만주족을 낮추어 부르는 낱말이 들어 있거나 명 말 청 초의 민감한 내용이 담긴 책은 지우거나 고쳤으며, 금서로 정해 없앤 책이 약 3천 종(목록상 2,855종이라는 집계가 있다)에 이른다고 한다. 건륭제 때는 글 속의 낱말을 꼬투리 잡아 처벌하는 문자옥도 이어졌다. 건륭제는 학술을 후원해 청의 문화적 권위를 높이려 했으나, 책의 일부를 없애고 고쳐 청의 통치 이념에 맞추려 했다는 점이 지적된다. 사고전서관에서 활동한 학자들은 책을 교정하는 과정에서 고증학의 방법을 더 갈고닦았다(「명 말 청 초의 사상가와 고증학(1660~1790)」(앞의 사건)). 사고전서는 지금까지 남은 가장 큰 총서로 평가받는다."
  subjects: [qing]
  tags: [culture, politics]
  sources: ["『사고전서총목제요』", "『청고종실록』", "R. Kent Guy, The Emperor's Four Treasuries: Scholars and the State in the Late Ch'ien-lung Era (Harvard University Council on East Asian Studies, 1987)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: macartney-embassy-1792
  year: 1792
  endYear: 1794
  title:
    ko: "매카트니 사절단과 건륭제의 칙서(1792~1794)"
  summary:
    ko: "영국은 광저우에 갇힌 무역을 넓히려고 1792년 조지 3세의 사절로 매카트니 경을 보냈다. 사절단은 건륭제의 생일을 축하한다는 명목으로 1792년 9월 영국을 떠나 이듬해 8월 톈진에 도착했다. 선물로 시계와 천문 기구, 군함 모형 같은 영국의 공업 제품을 실었다. 사절단에는 천문학자와 화가, 의사도 동행했고 이들의 기록은 영국이 중국을 이해하는 데 큰 영향을 주었다. 베이징 상주 공사 파견과 새 항구 개방, 관세의 정액화, 작은 섬 하나의 사용권 같은 요구를 내놓을 계획이었다. 청은 사절단을 조공 사절로 대접해 황제 앞에서 세 번 무릎 꿇고 아홉 번 머리를 조아리는 의식을 요구했다. 매카트니는 영국 왕에게 하듯 한쪽 무릎만 꿇고 허리를 숙이는 인사를 하겠다고 맞섰다. 건륭제는 1793년 9월 열하의 피서산장에서 이 방식으로 매카트니를 만났다. 정작 통상 협상은 이루어지지 않았다. 건륭제는 조지 3세에게 보낸 칙서에서 천조에는 없는 물건이 없어 외국과 교역할 필요가 없고 광저우에서의 무역만 허락한다는 뜻을 밝혔다. 사절단은 1794년 광저우를 거쳐 돌아갔다. 사절 일행은 베이징에서 청의 궁정 문화를 직접 접했다. 영국은 이 실패 뒤 군사력을 앞세운 개방 정책으로 기울었다는 평가가 있다. 매카트니는 돌아가며 청이 겉으로 보이는 것보다 군사적으로 낡았다고 평했다. 건륭제는 외국의 요구를 들어줄 까닭이 없다고 보았고, 청은 곧 백련교의 난에 휘말렸다(「백련교의 난과 화신의 몰락, 팔괘교의 자금성 습격(1796~1813)」(뒤의 사건)). 영국에서는 청이 닫힌 나라라는 인식이 퍼졌으나, 청의 입장에서는 정해진 의례 안에서 외국 사절을 대하는 정상적 외교였다. 1816년 영국이 보낸 애머스트 사절단은 같은 의례 문제로 황제를 만나지 못한 채 돌아갔다."
  subjects: [qing, uk]
  links:
    - { from: uk, to: qing, note: "통상 확대를 요구하는 사절 파견 (1793)" }
  tags: [diplomacy]
  sources: ["「영국 국왕에게 내린 칙서」(1793)", "『청고종실록』", "James L. Hevia, Cherishing Men from Afar: Qing Guest Ritual and the Macartney Embassy of 1793 (Duke University Press, 1995)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: white-lotus-1796
  year: 1796
  endYear: 1813
  title:
    ko: "백련교의 난과 화신의 몰락, 팔괘교의 자금성 습격(1796~1813)"
  summary:
    ko: "18세기 말 쓰촨·후베이·산시(陝西)의 산악 지대에는 먹고살 길을 찾아 모여든 유민이 많았다. 관리와 지주의 가혹한 수탈을 받는 이들 사이에 미륵불이 곧 세상에 온다는 백련교의 믿음이 퍼졌다. 청은 이런 민간 종교를 비밀 결사로 보아 탄압했고, 이는 오히려 반발을 키웠다. 1774년에는 산둥에서 왕륜이 이끄는 청수교의 반란이 일어나기도 했다. 1796년 후베이에서 시작된 봉기가 쓰촨과 산시(陝西), 허난으로 번졌다. 왕총아 같은 지도자가 이끄는 이들은 관군을 피해 산악을 오가며 싸웠다. 반란군은 가을과 겨울에 산악 지대로 흩어졌다가 봄에 다시 모이는 식으로 싸워 관군을 지치게 했다. 청군은 화신의 영향 아래 부패해 있었고, 녹영군도 제대로 싸우지 못했다. 진압의 주력은 녹영군과 향용·단련 같은 한인 민병이었다. 건륭제는 1796년 재위 60년을 채우고 아들 가경제에게 황제 자리를 물려주었으나 태상황으로 실권을 쥐었다. 1799년 음력 정월 건륭제가 죽자 가경제는 곧 화신을 붙잡아 죄를 물어 자결하게 했다. 화신은 건륭제의 총신으로 20년 넘게 권력을 누리며 막대한 재산을 쌓았다. 몰수된 그의 재산이 국고의 몇 해 치 수입과 맞먹었다는 이야기는 과장일 가능성이 크다. 가경제는 이후 마을마다 요새를 쌓고 향촌 민병인 단련을 조직하는 한편 주민을 요새로 모아 반란군과 갈라 놓는 견벽청야 전술을 썼다. 1804년까지 반란이 가라앉았지만 이 전쟁에서 청의 비축 재정이 크게 줄었고, 팔기와 녹영이 약해진 모습도 드러났다. 1813년에는 팔괘교의 천리교도가 환관의 도움을 받아 자금성에 쳐들어왔다가 진압되었다. 이 사건 때 훗날의 도광제가 되는 황자 민녕이 활약했다고 전한다. 백련교의 난은 청의 쇠퇴가 시작되는 전환점으로 흔히 꼽힌다."
  subjects: [qing]
  tags: [war, society]
  sources: ["『청인종실록』", "『청사고』 인종본기", "Susan Naquin, Millenarian Rebellion in China: The Eight Trigrams Uprising of 1813 (Yale University Press, 1976)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: lin-zexu-opium-1838
  year: 1838
  endYear: 1844
  title:
    ko: "임칙서의 아편 금지와 아편 전쟁(1838~1844)"
  summary:
    ko: "1830년대에 청으로 들어오는 아편은 해마다 수만 상자에 이르렀고, 차와 비단을 판 대금으로 들어오던 은이 거꾸로 빠져나가 은값이 올랐다. 조정에서는 아편을 합법화하고 세금을 매기자는 의견(허내제, 1836)과 엄벌로 근절하자는 의견(황작자, 1838)이 맞섰고, 도광제는 엄금 쪽을 택했다. 도광제는 은 유출로 은값이 오르는 것과 병사들의 아편 흡연을 크게 걱정했다. 1838년 말 임칙서가 흠차대신으로 광저우에 파견되어 1839년 3월 도착했다. 임칙서는 외국 상인에게 아편을 모두 내놓고 다시는 들여오지 않겠다는 서약서를 쓰게 했고, 상관을 봉쇄한 끝에 영국 상인 쪽에서 2만여 상자(약 1,400톤)를 받아 6월 후먼 해안에서 없앴다. 영국은 이를 구실로 1840년 6월 원정군을 보냈다. 영국 의회 안에서도 이 전쟁이 부도덕하다는 비판이 있었으나 정부를 비난하는 동의안이 근소한 차이로 부결되어 출병은 이어졌다. 청은 새 무기와 증기선을 앞세운 영국군에게 저우산(딩하이)과 샤먼, 닝보, 상하이, 전장을 차례로 잃었고, 광저우는 1841년 몸값을 내고 영국군을 물러나게 했다. 도광제는 임칙서를 파면했고(1840), 뒤에 협상을 맡은 기선이 홍콩 할양을 담은 가조약을 맺었다가 거부되어 처벌받았다(1841). 임칙서는 신장 이리로 유배되었다. 1842년 8월 난징 조약이 맺어졌고(「아편 전쟁과 난징 조약」(뒤의 사건)) 홍콩섬이 영국에 넘어갔다. 이듬해 호문 조약으로 관세율과 영사 재판권, 최혜국 대우가 정해졌고, 1844년 미국과 왕샤 조약, 프랑스와 황푸 조약이 맺어졌다. 위원(魏源)은 서양 사정을 정리한 『해국도지』(1842)를 펴 서양의 뛰어난 기술을 배워 서양을 제어하자고 주장했다. 청의 조정과 사대부는 이 패배를 곧바로 체제의 위기로 받아들이지는 않았다. 그러나 5개 항구가 열리고 외국 상인이 들어오며 청은 새로운 국제 질서에 끌려 들어갔다."
  subjects: [qing, uk, usa, france]
  links:
    - { from: qing, to: uk, note: "홍콩섬 할양, 5개 항구 개방 (난징 조약, 1842)" }
  tags: [war, diplomacy]
  sources: ["『주판이무시말』 도광조", "『청사고』 임칙서전", "Julia Lovell, The Opium War: Drugs, Dreams and the Making of China (Picador, 2011)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)"]

- id: taiping-rising-1843
  year: 1843
  endYear: 1853
  title:
    ko: "홍수전의 배상제회와 태평천국의 봉기(1843~1853)"
  summary:
    ko: "홍수전은 광둥 화현의 객가 농가에서 태어나 몇 차례 과거에 떨어졌다. 병중에 환상을 보았고, 기독교 소책자 『권세양언』을 읽은 뒤(1843) 자신이 하느님의 아들이자 예수의 동생이라고 믿게 되었다. 광시 쯔징산에서 풍운산이 일으킨 배상제회에 홍수전은 1847년 합류해 지도자가 되었다. 배상제회는 우상을 부수고 모든 사람이 하느님 아래 형제자매라고 가르쳤다. 양수청은 하느님의 뜻을, 소조귀는 예수의 뜻을 전한다고 내세웠다. 아편 전쟁 뒤 은값이 오르면서 농민의 세 부담이 늘었고, 광시에서는 본지 주민과 객가가 땅과 물을 놓고 다투며 재난이 이어졌다. 이런 사정이 신자를 모으는 바탕이 되었다. 1850년 가을 광시 각지의 신자 수만 명이 금전 일대에 모여들었다. 홍수전은 1851년 1월 금전촌에서 봉기해 태평천국을 세우고 천왕에 올랐다. 신자들은 가진 재산을 공동 창고(성고)에 내놓고 남녀를 나누어 군영에서 지냈다. 양수청·소조귀·위창휘(韋昌輝)·석달개 등이 왕으로 봉해져 군대를 이끌었다. 석달개는 지주 집안 출신이었고 양수청은 숯을 굽던 가난한 집 출신이었다. 이들은 1851년 영안을 차지했다가 포위를 뚫고 후난으로 올라갔고, 그 과정에서 풍운산과 소조귀를 잃었다. 광시에서 후난으로 올라가는 동안 천지회 같은 민간 결사의 사람들도 가세했다. 후난과 후베이의 가난한 농민, 광부, 선원이 합류하여 군대는 수십만 명으로 불어났다. 1853년 1월 우창을 차지한 태평군은 창장강을 따라 내려가 1853년 3월 19일 난징을 차지했다. 이곳을 천경이라 이름 붙이고 도읍으로 삼았다. 난징을 지키던 만주 팔기군과 가족은 이때 많이 죽임을 당했다. 태평천국은 우상 숭배를 버리고 상제를 섬기며, 아편·도박·전족을 금하고 땅을 고르게 나누겠다는 이상을 내걸었다. 이 반란은 청의 존립을 위협하는 큰 위기가 되었다."
  subjects: [qing]
  tags: [war, society, religion]
  sources: ["『청사고』 홍수전전", "Jonathan D. Spence, God's Chinese Son: The Taiping Heavenly Kingdom of Hong Xiuquan (W. W. Norton, 1996)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)"]

- id: nian-miao-hui-revolts-1851
  year: 1851
  endYear: 1873
  title:
    ko: "염군과 묘족·회족의 봉기(1851~1873)"
  summary:
    ko: "태평천국과 같은 시기, 청 곳곳에서 대규모 반란이 일어났다. 화이허강 유역의 안후이·허난·산둥·장쑤 경계 지대에서는 소금 밀매와 농민 자위 조직에서 비롯된 염군이 1851년 무렵부터 퍼지다가 1855년 장낙행을 중심으로 크게 일어났다. 그해 황허강이 물길을 북쪽으로 크게 바꾸면서 이 일대의 기근이 더욱 깊어졌다. 염군은 기마와 기동으로 승격림심의 몽골 기병과 싸워 1865년 승격림심을 죽이기도 했다. 염군은 태평군과 때로 손을 잡았으나 하나의 조직으로 합쳐지지는 않았다. 증국번이 토벌에 실패했으나 그가 쌓기 시작한 하천·운하 방어선을 리훙장의 회군이 이어 염군을 가두는 전술로 1868년까지 진압했다. 구이저우에서는 장수명이 이끈 묘족 봉기가 1855년부터 18년간 이어졌다. 한인 관리와 상인의 토지 침탈과 세금 부담이 원인이었고, 청은 1872년 진압했다. 윈난에서는 1856년 쿤밍에서 청 관리가 부추긴 회족 학살을 계기로 회족 지도자 두원수가 다리(大理)를 근거로 일어나 윈난 서부를 16년 동안 다스렸으나 1872년 말 청군이 다리를 함락할 때 죽었다. 두원수는 청 관리의 회족 학살을 규탄하며 영국에 사절을 보내 지원을 청했으나(1872) 얻지 못했다. 산시(陝西)와 간쑤에서도 1862년 한인과 회족의 충돌에서 시작된 회족 봉기가 1873년까지 이어졌다. 이 지역의 인구는 크게 줄었다. 수백만 명이 죽었다고도 하나 추산이 크게 엇갈린다. 한인과 회족 사이의 갈등과 그 기억도 오래 남았다. 반란을 누른 이는 리훙장과 좌종당, 증국번이 이끈 한인 군대였고, 이들은 청의 안정을 지켰지만 조정은 지방 군벌에 기대는 처지가 되었다. 서북의 반란은 청이 신장을 되찾는 일과도 이어졌다(「서북 회민 봉기와 야쿱 벡, 좌종당의 신장 수복과 이리 문제(1862~1884)」(뒤의 사건))."
  subjects: [qing]
  tags: [war, society]
  sources: ["『청사고』 승격림심전", "Elizabeth J. Perry, Rebels and Revolutionaries in North China, 1845–1945 (Stanford University Press, 1980)", "Jonathan N. Lipman, Familiar Strangers: A History of Muslims in Northwest China (University of Washington Press, 1997)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)"]

- id: taiping-tianjing-1853
  year: 1853
  endYear: 1860
  title:
    ko: "천경의 태평천국과 북벌·서정, 천경 사변(1853~1860)"
  summary:
    ko: "난징에 자리 잡은 태평천국은 1853년 『천조전무제도』를 내어 땅을 고르게 나누고 모든 수확을 공동 창고에 모은다는 이상을 밝혔다. 남녀를 군영으로 갈라 두는 엄한 규율을 세웠으며, 성서를 바탕으로 한 과거와 새 달력도 만들었다. 달력은 윤달 없이 해를 고르게 나눈 태평천국 고유의 것이었다. 그러나 이 제도는 전쟁 중이라 그대로 실현되기 어려웠다. 홍수전은 궁중에 머물며 정사를 양수청에게 맡기다시피 했다. 군사 면에서는 1853년 5월 임봉상 등이 이끄는 북벌군이 허난과 즈리를 거쳐 톈진 근처까지 올라갔으나 겨울 추위와 보급난, 승격림심의 청군에 막혀 1855년 전멸했다. 서쪽으로 보낸 서정군은 안후이와 장시, 후베이를 오가며 청군과 싸웠고, 증국번이 후난에서 길러 낸 상군과 맞섰다. 청은 팔기와 녹영군이 약해 한인 향용인 상군에 기대는 형편이었다. 1856년 음력 8월(양력 9월) 천경에서는 큰 내분이 터졌다. 하느님의 뜻을 전한다며 힘을 키운 동왕 양수청이 홍수전을 압박하자, 홍수전은 위창휘와 진일강(秦日綱)에게 양수청을 죽이게 했다. 그러나 살육은 걷잡을 수 없이 번져 양수청 쪽 사람 수만 명이 죽었고, 위창휘도 곧 처형되었다. 군사 지도자 석달개는 1857년 난징을 떠나 따로 싸웠다. 1859년에는 홍수전의 사촌 홍인간이 홍콩에서 와 철도와 은행, 신문을 갖추자는 『자정신편』을 내놓았으나 현실로 옮겨지지는 못했다. 천경 사변은 지도부의 단결을 무너뜨린 전환점으로 평가된다. 이후 태평천국은 홍수전의 친족을 중심으로 재편되었다. 위기를 넘긴 태평군은 이수성과 진옥성(陳玉成)의 활약으로 1860년 5월 청의 강남대영을 깨고 6월 쑤저우를 차지했다. 청은 같은 무렵 영국·프랑스와도 싸우고 있었다(「제2차 아편 전쟁과 베이징 조약」(뒤의 사건))."
  subjects: [qing, uk, france]
  tags: [war, politics, religion]
  sources: ["『청사고』 홍수전전", "『청사고』 증국번전", "Jonathan D. Spence, God's Chinese Son: The Taiping Heavenly Kingdom of Hong Xiuquan (W. W. Norton, 1996)", "Franz Michael(Chung-li Chang 협력), The Taiping Rebellion: History and Documents, vol. 1: History (University of Washington Press, 1966)"]

- id: taiping-fall-1860
  year: 1860
  endYear: 1864
  title:
    ko: "상군·회군과 상승군, 태평천국의 멸망(1860~1864)"
  summary:
    ko: "1860년 쑤저우를 차지한 태평군이 상하이로 다가가자 상하이의 외국 상인과 중국 상인은 두려움에 떨었다. 상하이 상인들은 미국인 워드가 이끄는 외국인 용병 부대를 은으로 지원했다. 이 부대가 상승군이다. 워드는 1862년 9월 츠시 전투에서 전사했고, 버지빈을 거쳐 영국군 장교 고든이 1863년 지휘를 맡아 리훙장의 회군과 함께 싸웠다. 리훙장은 1862년 안후이에서 편성한 회군을 상하이로 데려가 장쑤순무가 되었다. 이 무렵 영국과 프랑스는 베이징 조약(1860)으로 이미 이권을 얻었기에 청 조정이 무너지는 일을 원치 않았고, 태평천국을 가로막는 쪽으로 움직였다. 한편 증국번의 상군은 1861년 음력 8월 안칭을 되찾았고, 증국번의 동생 증국전이 1862년 난징을 포위했다. 상군은 증국번이 후난의 유생과 농민을 고향 연고로 묶어 만든 군대로, 지휘관 가운데 유생 출신이 많아 병사가 장군 개인에게 충성하는 성격이 강했다. 회군은 이를 본뜬 군대였다. 태평천국의 이수성이 구원에 나섰으나 막지 못했다. 1863년 석달개는 쓰촨 다두허강에서 청군에 항복했다가 처형되었다. 1864년 6월 홍수전이 병으로(자결설도 있다) 죽었고, 7월 19일 난징이 무너졌다. 상군은 도성을 약탈하고 많은 사람을 죽였으며, 도시는 큰 불에 탔다. 난징을 되찾은 증국번과 증국전은 높은 작위를 받았다. 남은 태평군 일부는 이후에도 몇 해 더 싸웠다. 열네 살 홍수전의 아들(어린 천왕)은 탈출했으나 그해 가을 붙잡혀 처형되었다. 홍인간도 청군에 잡혀 처형되었다. 이 전쟁으로 죽은 사람은 연구자에 따라 2천만~3천만 명으로 추산하며, 더 높은 추산도 있다. 상군과 회군은 청 조정이 아니라 장군에게 충성하는 지방 군대였고, 이후 증국번과 리훙장 같은 한인 관료가 군사와 재정에서 지방 권한을 키웠다."
  subjects: [qing, uk]
  tags: [war]
  sources: ["『청사고』 증국번전", "『청사고』 리훙장전", "Philip A. Kuhn, Rebellion and Its Enemies in Late Imperial China: Militarization and Social Structure, 1796–1864 (Harvard University Press, 1970)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)"]

- id: xinyou-coup-1861
  year: 1860
  endYear: 1875
  title:
    ko: "함풍제의 열하 피란과 신유정변, 동치 중흥(1860~1875)"
  summary:
    ko: "제2차 아편 전쟁 중 영국·프랑스군이 베이징에 다가오자 함풍제는 1860년 열하로 피란했고, 동생 공친왕 혁흔이 남아 베이징 조약을 맺었다(「제2차 아편 전쟁과 베이징 조약」(앞의 사건)). 이때 영국·프랑스군은 원명원을 약탈하고 불태웠다. 공친왕은 이듬해 1월 외국과의 일을 맡아 보는 총리각국사무아문(총리아문)을 만들었다. 1861년 음력 7월 함풍제가 열하에서 죽고 다섯 살 아들 재순이 이었다. 함풍제는 재원·단화·숙순 등 여덟 대신에게 어린 황제를 돕게 했다. 그러나 황제의 생모 서태후와 함풍제의 황후 동태후, 공친왕은 그해 11월 초(음력 9월 말) 정변을 일으켰다. 숙순은 처형되고 재원과 단화는 자결을 명받았다. 이를 신유정변이라 한다. 두 태후가 어린 황제를 대신해 수렴청정을 하고 공친왕이 의정왕으로 조정을 이끌게 되었으며, 연호는 동치로 정해졌다. 동태후는 정치에 소극적이었고 서태후가 점차 실권을 쥐었다. 공친왕은 1865년 서태후에게 의정왕 직을 빼앗겼으나 총리아문 일은 계속 맡았다. 증국번·리훙장·좌종당 같은 한인 관료가 군사를 쥐고 태평천국과 염군을 누르며 질서를 되살렸고, 서양의 기술을 받아들이는 양무 사업을 일으켰다. 이 시기를 동치 중흥이라 한다. 강남에서는 태평천국 진압 뒤 세금을 줄이고 황폐한 농지를 복구했으며, 통과세인 이금이 지방 재정의 새 기둥이 되어 독무의 힘을 키웠다. 그 결과 동치 연간에는 지방 독무가 세금과 군사를 맡는 체제가 굳어졌다. 동치제는 1873년 친정에 나섰으나 1875년 열여덟 살로 자식 없이 죽었다. 서태후는 동치제와 같은 항렬인 세 살 사촌 재첨(서태후의 조카)을 광서제로 세워 황통 관행을 어기고서도 수렴청정을 이어 갔다. 광서제가 친정에 나선 시기(1889~1898)를 빼면 서태후는 1908년 죽을 때까지 청의 실권을 쥐었다."
  subjects: [qing]
  tags: [politics]
  sources: ["『청사고』 목종본기", "『청사고』 후비전", "Mary C. Wright, The Last Stand of Chinese Conservatism: The T'ung-Chih Restoration, 1862–1874 (Stanford University Press, 1957)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)"]

- id: manchuria-ban-lifted-1860
  year: 1860
  endYear: 1907
  title:
    ko: "봉금 해제와 한인의 만주 이주, 동삼성 설치(1860~1907)"
  summary:
    ko: "청은 만주를 발상지로 여겨 입관 뒤에도 한인(漢人)의 이주를 막았다. 1668년 한인의 이주를 금했고 1681년까지 랴오닝 일대에 유조변이라는 방책을 둘러 경계로 삼았다. 지린과 헤이룽장은 팔기가 주둔하는 곳이 되었다. 그러나 금지는 엄격하지 않아 산둥과 즈리의 가난한 농민이 몰래 산해관을 넘는 일이 이어졌다. 이를 틈관동이라 했다. 이주민은 산둥 사람이 가장 많았고 계절에 따라 오가는 이도 많았다. 1858년 아이훈 조약과 1860년 베이징 조약으로 러시아가 헤이룽강(아무르강) 북쪽과 우수리강 동쪽을 얻자(「러시아의 연해주 획득」(앞의 사건)) 청은 국경을 지키려면 사람을 채워야 한다는 위기를 느꼈다. 헤이룽장에서 1860년 일부 땅의 개간을 허락한 것을 시작으로 지린과 봉천에서도 금지가 차례로 풀렸다. 두만강 건너 간도에도 함경도의 조선인이 많이 들어가 농사를 지었다(「간도 문제와 감계 회담」(뒤의 사건)). 20세기 초에는 농촌까지 한인이 다수를 이루었다. 콩 재배와 대두·콩깻묵 수출이 늘어 만주는 곡창이자 수출 지대가 되었다. 동청철도(1896년 청과 러시아의 비밀 조약에 따라 부설권을 얻어 1897년 착공)가 놓이며 하얼빈 같은 도시가 생겨났다. 러일 전쟁은 만주를 전장으로 만들었다. 청이 중립을 선언한 가운데 일본이 이겨 포츠머스 조약(1905)으로 남만주의 러시아 이권을 이어받았다. 일본은 1906년 남만주 철도 주식회사를 세워 이를 운영했다. 청은 열강의 이권 다툼에서 만주를 지키려고 1907년 동삼성 총독을 두고 봉천·지린·헤이룽장에 성을 설치했다. 초대 총독은 서세창이었다. 이는 만주를 청 본토와 같은 행정으로 묶으려는 조처였다. 일본이 이권을 넓히는 가운데 간도의 귀속은 뒤에 청과 일본의 협약으로 정해졌다(「기유각서와 간도 협약」(뒤의 사건))."
  subjects: [qing, russia, japan, joseon]
  tags: [society, politics]
  sources: ["『청사고』 지리지", "Robert H. G. Lee, The Manchurian Frontier in Ch'ing History (Harvard University Press, 1970)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: self-strengthening-1861
  year: 1861
  endYear: 1895
  title:
    ko: "양무운동과 중체서용(1861~1895)"
  summary:
    ko: "아편 전쟁과 태평천국, 제2차 아편 전쟁에서 서양 무기의 힘을 절감한 한인 관료들은 서양의 기술을 받아들여 청을 지키려 했다. 이를 양무운동이라 한다. 증국번은 1861년 안칭에 군계소를 세웠고, 총리아문은 1862년 외국어와 과학을 가르치는 경사동문관을 열었다. 1864년에는 미국인 선교사 마틴이 옮긴 휘튼의 국제법 책이 『만국공법』이라는 이름으로 간행되었다. 리훙장은 상하이에 강남제조총국(1865)을, 난징에 금릉기기국(1865)을 세웠고 좌종당은 푸저우에 선정국(1866)을 만들었다. 리훙장은 1872년 윤선초상국을 세워 관이 감독하고 상인이 경영하게 했고, 개평 탄광(1870년대 후반)과 전신선(1880~1881)으로 사업을 넓혔다. 개평 탄광의 석탄을 나르려고 당서 철도(1881)도 놓였다. 용굉의 건의로 1872년부터 어린 학생들을 미국에 유학시켰으나, 보수파의 반대로 1881년 불러들였다. 청은 유럽에서 군함을 사 들여 1888년 북양해군을 만들었고, 장지동은 한양에 제철소(1890년 착공)를 세웠다. 조선도 청의 양무 사업을 참고해 통리기무아문을 설치하고 기기를 배우러 사람을 톈진에 보냈다(「통리기무아문 설치와 개화 정책」(뒤의 사건)). 양무운동은 서양 학문을 쓰임으로 삼고 유교의 가르침을 바탕으로 삼는다는 중체서용을 내세워 정치 체제를 바꾸지 않았다. 관독상판 기업에서는 관료의 부정과 정실이 얽혔고, 사업은 서로 이어지지 않았다. 지방 독무가 사업을 따로 벌여 재정과 계획이 흩어진 점도 한계였다. 1894~1895년 청일 전쟁(「청일 전쟁과 시모노세키 조약」(뒤의 사건))에서 북양해군이 무너지면서 이 운동의 한계가 드러났다. 이 운동에 대한 평가는 청을 근대화하려던 점진적 개혁이라는 시각과 제도 개혁 없이 기술만 들였다는 비판으로 갈린다."
  subjects: [qing, joseon, usa]
  tags: [politics, economy]
  sources: ["『청사고』 리훙장전", "『청사고』 장지동전", "Albert Feuerwerker, China's Early Industrialization: Sheng Hsuan-huai (1844–1916) and Mandarin Enterprise (Harvard University Press, 1958)", "The Cambridge History of China, vol. 10, Part 1: Late Ch'ing, 1800–1911 (John K. Fairbank 편, Cambridge University Press, 1978)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: xinjiang-ili-crisis-1862
  year: 1862
  endYear: 1884
  title:
    ko: "서북 회민 봉기와 야쿱 벡, 좌종당의 신장 수복과 이리 문제(1862~1884)"
  summary:
    ko: "1862년 산시(陝西)에서 시작된 회족의 봉기는 간쑤를 거쳐 신장으로 번졌고, 1864년 쿠차와 우루무치, 이리에서도 무슬림이 일어나 청의 통치가 무너졌다. 코칸트 칸국의 장군 야쿱 벡은 1865년 카슈가르에 들어와 세력을 얻었고, 1870년까지 타림 분지의 대부분을 아울렀다. 이 정권은 러시아·영국과 통상 조약을 맺었다. 영국은 그를 러시아에 맞서는 완충 세력으로 보아 1873년 사절을 보냈다. 그러나 이슬람 법을 엄격히 적용하고 세금을 무겁게 매겨 주민의 지지를 잃었다. 러시아는 1871년 질서를 되찾아 주겠다며 이리를 점령하고 청이 힘을 되찾으면 돌려준다고 했다. 청의 조정에서는 1874~1875년 해방이냐 새방이냐를 놓고 논쟁이 벌어졌다(「일본의 타이완 출병과 해방 논쟁, 류큐 처분, 북양해군(1874~1888)」(뒤의 사건)). 좌종당이 서북 지역 군무를 맡고 신장 수복에 나서 1876년 유금당 등이 이끄는 청군이 북쪽 우루무치 일대를 되찾고 남쪽으로 내려갔다. 야쿱 벡은 1877년 5월 쿠얼러에서 죽었고, 청군은 그해 말부터 이듬해 초까지 카슈가르와 호탄을 되찾았다. 좌종당은 군량을 간쑤의 둔전에서 마련하고 상인 호설암을 통해 외국 은행의 돈을 빌려 군비를 댔다. 이리 문제는 외교로 풀렸다. 숭후가 러시아와 맺은 리바디아 조약(1879)은 영토를 크게 잃는다는 비난 속에 거부되어 숭후는 하옥되었고, 증기택이 다시 협상해 상트페테르부르크 조약(이리 조약, 1881)으로 이리 대부분을 되찾았다. 대신 서쪽 변경 일부를 러시아에 넘기고 배상금을 물었다. 청은 1884년 이 지역에 신장성을 설치하고 유금당을 초대 순무로 삼았다. 이 일로 청은 신장을 직접 행정 구역으로 삼게 되었다."
  subjects: [qing, russia, uk]
  links:
    - { from: qing, to: russia, note: "이리 반환의 대가로 서쪽 변경 일부 할양 (1881)" }
  tags: [war, diplomacy]
  sources: ["『청사고』 좌종당전", "『청사고』 유금당전", "Immanuel C. Y. Hsü, The Ili Crisis: A Study of Sino-Russian Diplomacy, 1871–1881 (Clarendon Press, 1965)", "Hodong Kim, Holy War in China: The Muslim Rebellion and State in Chinese Central Asia, 1864–1877 (Stanford University Press, 2004)"]

- id: formosa-haifang-1874
  year: 1874
  endYear: 1888
  title:
    ko: "일본의 타이완 출병과 해방 논쟁, 류큐 처분, 북양해군(1874~1888)"
  summary:
    ko: "1871년 류큐 사람들이 타이완 남부에 표류했다가 원주민에게 수십 명이 살해되는 일이 있었다. 류큐는 오래 청과 일본 사쓰마에 함께 조공하는 처지였는데, 일본은 이를 구실 삼아 1874년 5월 사이고 쓰구미치의 지휘로 타이완에 군대를 보냈다. 일본은 청의 교화가 미치지 않는 땅을 쳤다고 주장했다. 청이 항의하자 영국의 중재로 같은 해 10월 베이징에서 일본과 약정을 맺고 배상금 50만 냥을 주었다. 일본은 이 약정을 청이 일본의 출병을 인정한 것으로 이용했다. 청은 이 일 뒤 타이완 방어를 서둘러 개발 금지를 풀고 이주를 장려했다(심보정, 1875). 리훙장은 1874년 말 일본의 위협을 들어 해군 확장을 주장하는 상주를 올렸고, 조정에서는 바다의 방어를 앞세워야 한다는 리훙장의 해방론과 신장의 위기를 먼저 막아야 한다는 좌종당의 새방론이 맞붙었다(「서북 회민 봉기와 야쿱 벡, 좌종당의 신장 수복과 이리 문제(1862~1884)」(앞의 사건)). 조정은 두 가지를 함께 하기로 하고 해군 건설에 해마다 400만 냥의 경비를 마련하려 했으나 실제 모인 금액은 이에 못 미쳤다. 일본은 1879년 류큐 왕국을 없애고 오키나와현을 두었다. 청은 이에 항의하며 그랜트 전 미국 대통령의 중재까지 요청했고 1880년에는 류큐를 나누자는 안도 논의되었으나 합의되지 않았다. 1880년대 청은 독일에서 만든 철갑함 정원과 진원을 사 들이고 1888년 북양해군 장정을 공포해 정여창을 제독으로 하는 북양해군을 정식으로 만들었다. 정원과 진원은 당시 동아시아에서 손꼽히는 큰 전함이었다. 1882년 임오군란에서 청이 조선에 군대를 보낸 것(「임오군란」(뒤의 사건))은 이처럼 일본의 동진이 두드러진 가운데 청이 조선에 대한 종주권을 굳히려 한 행동이었다."
  subjects: [qing, japan, joseon]
  links:
    - { from: japan, to: qing, note: "타이완 출병 (1874)" }
  tags: [war, diplomacy]
  sources: ["『청사고』 리훙장전", "『청사고』 좌종당전", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: sino-french-war-1883
  year: 1883
  endYear: 1885
  title:
    ko: "청불 전쟁과 톈진 조약(1883~1885)"
  summary:
    ko: "베트남 응우옌 왕조는 오랫동안 청에 조공하는 관계였다. 프랑스는 홍강 유역의 통킹을 차지하려고 1883년 후에 조약과 1884년 6월의 개정 조약으로 베트남을 보호국으로 만들었고, 이때 응우옌 황제가 청에서 받은 인장도 녹여 없앴다. 청은 이를 인정하지 않고 광시·윈난의 군대를 베트남 북부에 보냈고, 유영복이 이끄는 흑기군도 프랑스군과 싸웠다. 조정 안에서는 끝까지 싸우자는 청류파와 화의를 서두른 리훙장이 맞섰다. 1884년 4월에는 서태후가 공친왕을 군기처에서 내보내는 개편도 있었다. 5월 리훙장이 프랑스와 톈진 간명 조약을 맺었으나 철군 기한을 두고 해석이 갈려 6월 박레에서 충돌이 일어났다. 청과 프랑스는 정식으로 선전 포고를 하지 않은 채 싸웠다. 프랑스 함대는 8월 23일 푸저우의 마웨이 앞바다에서 복건 수군을 거의 쓸어버렸고 10월에는 타이완 지룽에 상륙해 점령했다. 그러나 단수이에서는 유명전과 손개화가 프랑스군을 물리쳤다. 프랑스군은 지룽을 점령한 채 타이완 해안을 봉쇄했으나 더 나아가지 못했고 1885년 6월 물러났다. 1885년 3월 국경의 진남관에서는 풍자재가 이끄는 청군이 프랑스군을 물리쳤고, 프랑스군이 랑선에서 물러났다는 소식으로 프랑스에서는 페리 내각이 무너졌다. 그러나 청은 전투의 승리를 이용하지 않고 1885년 6월 9일 톈진 조약을 맺어 베트남에 대한 프랑스의 보호권을 인정했다. 영토는 잃지 않았으나 조공 관계로 이어 오던 종주권은 사라졌다. 청은 바다에서 지고 육지에서 이겼다. 전쟁이 끝난 1885년 청은 해군 아문을 두고 타이완을 성으로 승격해 유명전을 초대 순무에 앉혔다. 유명전은 타이완 방위를 위해 지룽 탄광을 개발하고 철도와 전신을 놓았다. 1884년 청이 베트남 전선 때문에 조선 주둔군 일부를 빼낸 것이 그해 12월 갑신정변의 한 배경으로 꼽힌다(「갑신정변」(뒤의 사건))."
  subjects: [qing, france, joseon]
  tags: [war, diplomacy]
  sources: ["『청사고』 리훙장전", "『청사고』 유영복전", "Lloyd E. Eastman, Throne and Mandarins: China's Search for a Policy during the Sino-French Controversy, 1880–1885 (Harvard University Press, 1967)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: tongmenghui-uprisings-1894
  year: 1894
  endYear: 1911
  title:
    ko: "쑨원의 흥중회와 동맹회, 혁명파의 봉기(1894~1911)"
  summary:
    ko: "쑨원은 광둥 출신으로 홍콩에서 서양 의학을 공부했다. 청일 전쟁이 한창이던 1894년 11월 하와이에서 화교를 모아 흥중회를 세워 청을 무너뜨리고 공화정을 세우자고 호소했다. 1895년 광저우에서 처음 일으키려던 봉기는 사전에 발각되어 실패했고, 쑨원은 망명길에 올랐다. 1896년에는 런던의 청 공사관에 갇혔다가 풀려나기도 했다. 이후 일본과 하노이 등지를 거점으로 삼았다. 1900년대 들어 일본과 유럽 유학생 가운데 혁명을 지지하는 이가 늘었다. 1905년 8월 도쿄에서 흥중회와 후난의 화흥회(황싱), 저장의 광복회 인사들이 모여 중국동맹회를 만들고 쑨원이 총리가 되었다. 동맹회의 강령은 만주족을 몰아내고 중화를 되찾아 민국을 세우며 토지 소유를 고르게 한다는 것이었다. 한인 민족주의가 혁명의 바탕에 있었다. 기관지 『민보』는 쑨원이 다듬은 민족·민권·민생의 삼민주의를 내세웠고, 량치차오의 입헌 군주제 주장과 논쟁했다. 량치차오 등 입헌파는 『신민총보』로 혁명이 열강의 간섭과 내란을 부른다고 반박했다. 동맹회는 1906년 평류리 봉기를 시작으로 광둥, 광시, 윈난 등 청의 남쪽 변경에서 거듭 봉기를 일으켰으나 모두 실패했다. 청의 군대가 약한 변경과 프랑스령 인도차이나 국경을 이용했고, 1910년에는 광저우의 신군 일부도 봉기했다. 1911년 4월 27일 황싱이 이끈 광저우 봉기는 황화강에서 수십 명의 희생자를 내고 끝났다. 그러나 이 거듭된 실패는 사람들에게 청의 약함을 알리고 혁명에 대한 동정을 불러일으켰다. 한편 동맹회는 소수 지식인과 화교, 비밀 결사에 의존했고, 정작 혁명을 일으킨 것은 동맹회의 영향을 받은 우창의 신군이었다(「철도 국유화와 보로 운동, 우창 봉기(1911)」(뒤의 사건))."
  subjects: [qing, japan]
  tags: [politics, war]
  sources: ["쑨원, 「『민보』 발간사」(1905)", "Marie-Claire Bergère, Sun Yat-sen (Janet Lloyd 옮김, Stanford University Press, 1998)", "Mary Backus Rankin, Early Chinese Revolutionaries: Radical Intellectuals in Shanghai and Chekiang, 1902–1911 (Harvard University Press, 1971)"]

- id: taiwan-republic-1895
  year: 1895
  title:
    ko: "청일 전쟁의 패배와 삼국 간섭, 타이완 민주국(1895)"
  summary:
    ko: "황해 해전(1894)과 웨이하이웨이 함락(1895년 2월)으로 북양해군이 무너지자 청은 화의에 나섰다. 리훙장은 일본의 시모노세키에서 협상하다 괴한의 총에 맞아 다치기도 했다. 1895년 4월 17일 시모노세키 조약이 맺어졌다. 이 조약에 청 안의 반발이 거셌으나 광서제는 5월 비준에 서명했다. 청은 조선이 자주국임을 인정하고 랴오둥반도와 타이완, 펑후 제도를 일본에 넘기며 배상금 2억 냥을 물기로 했다(「청일 전쟁과 시모노세키 조약」(앞의 사건)). 타이완 주민은 2년 안에 떠나지 않으면 일본 신민이 되기로 했다. 러시아와 독일, 프랑스는 일본이 랴오둥반도를 차지하는 데 반대하여 돌려주라고 압박했고(삼국 간섭), 일본은 5월 반환을 받아들였고, 11월 협약으로 보상금 3천만 냥을 받고 돌려주었다. 타이완의 신사층과 관리는 조약에 반발했다. 타이완 순무 당경숭을 총통으로 삼아 1895년 5월 하순 타이완 민주국을 선포했다. 연호는 영청이라 했고, 청에 충성하는 형식을 취해 열강의 승인을 구했으나 어느 나라도 승인하지 않았다. 일본 근위사단은 5월 말 지룽 동쪽에 상륙해 6월 초 지룽을 점령했고, 당경숭은 6월 초 중국 본토로 달아났다. 일본은 6월 타이완 총독부를 두었고 초대 총독은 가바야마 스케노리였다. 이어 유영복이 타이난에서 저항을 이끌었으나, 10월 하순 타이난이 함락되자 본토로 빠져나가 민주국은 막을 내렸다. 일본군은 전투보다 풍토병으로 죽은 병사가 더 많았다고 한다. 한인 주민과 원주민의 무장 저항은 그 뒤에도 이어졌다. 청일 전쟁의 패배는 중국 지식인에게 큰 충격을 주어 변법 운동으로 이어졌다(「캉유웨이의 변법 운동과 무술정변(1895~1898)」(뒤의 사건))."
  subjects: [qing, japan, russia, german-empire, france]
  links:
    - { from: qing, to: japan, note: "타이완 할양 (시모노세키 조약, 1895)" }
  tags: [war, diplomacy]
  sources: ["「시모노세키 조약」(1895)", "『청사고』 덕종본기", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: hundred-days-reform-1895
  year: 1895
  endYear: 1898
  title:
    ko: "캉유웨이의 변법 운동과 무술정변(1895~1898)"
  summary:
    ko: "청일 전쟁의 패배 소식이 전해지자 베이징에 과거를 보러 온 거인들이 술렁였다. 캉유웨이는 1895년 시모노세키 조약 반대와 변법을 요구하는 1천여 명의 연서를 모았다고 하는데 이를 공차상서라 부른다. 실제로 상소가 제출되지는 못했다는 설이 유력하다. 캉유웨이는 『공자개제고』(1897)에서 공자를 제도를 바꾼 개혁가로 그려 변법의 근거를 대었고, 제자 량치차오와 함께 강학회를 세우고 『시무보』(1896) 같은 신문으로 개혁론을 퍼뜨렸다. 1897년 독일이 자오저우만을 점령하자 위기감이 높아졌고, 이듬해 광서제는 캉유웨이를 중용했다. 1898년 6월 11일 국시를 밝히는 조서를 내려 변법을 시작했다. 경사대학당을 세우고 과거의 팔고문을 폐지하며, 철도와 광산을 관할하는 기관을 두고, 쓸모없는 관직을 정리하는 내용이었다. 그러나 기득권을 잃게 될 관료들의 반발이 컸다. 서태후와 보수파는 광서제의 조치에 불만이 컸고, 개혁파는 군사력을 쥔 위안스카이에게 도움을 청했으나 위안스카이는 이를 서태후 쪽에 알렸다고 전한다. 장지동은 이 무렵 『권학편』(1898)에서 중체서용을 내세워 급진적 개혁을 경계했다. 9월 21일 서태후가 정변을 일으켜 광서제를 영대에 가두고 정권을 다시 쥐었다. 캉유웨이와 량치차오는 일본으로 망명했고, 9월 28일 담사동 등 여섯 사람이 처형되었다. 담사동은 『인학』을 쓴 사상가였다. 개혁 조치는 대부분 폐지되고 경사대학당만 남았다. 정변 뒤 보수파가 힘을 얻고 열강에 대한 반감이 커진 가운데 의화단 사건이 터졌다(「의화단 운동과 서태후의 선전 포고, 신축 조약(1898~1901)」(뒤의 사건)). 위로부터의 급진적 개혁이어서 지지 기반이 얕았다는 평가도 있다. 100일이 조금 넘는 개혁이었다."
  subjects: [qing, japan, german-empire]
  tags: [politics, culture]
  sources: ["『청사고』 덕종본기", "캉유웨이, 『공자개제고』", "Luke S. K. Kwong, A Mosaic of the Hundred Days: Personalities, Politics, and Ideas of 1898 (Harvard University Council on East Asian Studies, 1984)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: boxer-uprising-china-1898
  year: 1898
  endYear: 1901
  title:
    ko: "의화단 운동과 서태후의 선전 포고, 신축 조약(1898~1901)"
  summary:
    ko: "1890년대 산둥은 가뭄과 황허강 범람, 독일의 자오저우만 조차(1898)와 철도 부설, 선교사와 신자의 마찰로 불안했다. 의화권으로 불린 민간 무술 조직은 1898년 가을 부청멸양을 내세워 교회와 신자를 공격했다. 의화단에는 홍등조 같은 여성 조직도 있었다. 산둥 순무가 된 위안스카이가 1899년 말 진압에 나서자 의화단은 즈리로 옮겨 가 톈진과 베이징 일대로 번졌다. 청 조정은 이를 진압할지 이용할지를 두고 갈라졌고, 1900년 6월 의화단이 베이징으로 들어와 공사관 구역을 에워쌌다. 서태후는 6월 21일(음력 5월 25일) 열강에 선전 포고를 했다. 이 사이 선교사와 중국인 신자가 많이 죽었다. 양강 총독 유곤일, 호광 총독 장지동, 양광 총독 리훙장, 산둥 순무 위안스카이 등은 조정의 명령을 따르지 않고 외국과 평화를 지키는 동남호보를 맺어 전쟁이 남쪽으로 번지는 것을 막았다. 8월 14일 영국·러시아·일본·프랑스·독일·미국·오스트리아-헝가리·이탈리아 8개국 연합군이 베이징을 점령했고, 서태후는 광서제와 함께 시안으로 피란했다(「의화단 운동과 8개국 연합군」(뒤의 사건)). 점령 뒤 연합군은 베이징과 톈진에서 약탈을 벌였다. 리훙장이 외국과 협상하여 1901년 9월 신축 조약이 맺어졌다. 청은 배상금 4억 5천만 냥을 39년에 걸쳐 물고, 공사관 구역에 외국 군대가 머무는 것을 인정하며, 연합군을 공격한 관료를 처벌하기로 했다. 총리아문은 외무부로 바뀌었다. 서태후는 피란길에 개혁을 약속했고, 이는 광서신정으로 이어졌다(「광서신정과 과거 폐지(1901~1905)」(뒤의 사건)). 신축 조약으로 청의 재정은 더 기울었고 열강의 간섭이 깊어졌다. 의화단 운동의 평가는 지금도 갈리는데, 외세에 맞선 민중 운동이라는 시각과 폭력적인 배외주의라는 시각이 있다."
  subjects: [qing, uk, russia, japan, france, german-empire, usa, austria-hungary, italy]
  tags: [war, diplomacy]
  sources: ["「신축 조약」(1901)", "『청사고』 덕종본기", "Joseph W. Esherick, The Origins of the Boxer Uprising (University of California Press, 1987)", "Paul A. Cohen, History in Three Keys: The Boxers as Event, Experience, and Myth (Columbia University Press, 1997)"]

- id: xinzheng-exam-abolished-1901
  year: 1901
  endYear: 1905
  title:
    ko: "광서신정과 과거 폐지(1901~1905)"
  summary:
    ko: "의화단 사건으로 크게 흔들린 서태후는 피란지 시안에서 1901년 1월 신정을 시행하겠다는 상유를 내렸다. 이를 광서신정이라 한다. 앞서 무술변법에서 거부했던 개혁을 이번에는 서태후 스스로 이끈 셈이다. 정무처를 두어 개혁을 총괄하게 했고, 군사에서는 위안스카이의 북양육진을 비롯한 신식 군대(신군)를 훈련시켰다. 북양육진은 1905년까지 모양을 갖추었고, 훗날 북양 군벌의 바탕이 되었다. 교육에서는 1901년 팔고문을 폐지하고, 1902~1904년 서양식 학제를 공포하여 새 학교를 세웠다. 새 학교의 교과에는 서양 과학과 외국어, 체육이 들어갔다. 해외 유학도 장려하여 일본으로 가는 유학생이 크게 늘었다. 형벌에서는 1905년 능지처사 같은 잔혹한 형을 없앴다. 가장 큰 변화는 과거의 폐지였다. 위안스카이와 장지동 등의 상주로 1905년 9월 2일(음력 8월 4일) 수 양제 때 시작된 과거를 폐지한다는 조서가 내려졌다. 이로써 1,300년 가까이 이어져 온 관료 선발 제도가 끝났다. 관료가 되려고 유교 경전을 공부하던 길이 사라지자 사대부 신분의 기반이 흔들렸고, 새 학교와 유학을 거친 신지식인이 새 세력으로 떠올랐다. 이 가운데 일부는 혁명으로 기울었다. 앞서 1903년에는 상부를 세워 상법을 정비했다. 신정 비용은 새 세금과 부가세로 충당되어 민중의 부담이 커졌고, 곳곳에서 세금 반대 소요가 일어났다. 새 학교와 입헌 준비에는 신사층의 돈과 조직이 쓰였고, 이들은 지방 자치를 요구하는 세력이 되었다. 신정은 낡은 신분 질서를 부수는 길을 열었지만, 청을 되살리려는 개혁이 청을 무너뜨리는 힘을 키웠다는 평가도 있다."
  subjects: [qing, japan]
  tags: [politics, society]
  sources: ["『광서조동화록』", "『청사고』 선거지", "Douglas R. Reynolds, China, 1898–1912: The Xinzheng Revolution and Japan (Harvard University Council on East Asian Studies, 1993)", "Benjamin A. Elman, A Cultural History of Civil Examinations in Late Imperial China (University of California Press, 2000)"]

- id: tibet-younghusband-1903
  year: 1903
  endYear: 1910
  title:
    ko: "영국의 티베트 침입과 청의 티베트 직접 통치 시도(1903~1910)"
  summary:
    ko: "영국령 인도의 총독 커즌은 러시아가 티베트에 영향력을 넓힌다고 의심해 티베트와 직접 교섭하려 했다. 티베트가 응하지 않자 영국은 영허즈번드 대령을 대표로 하는 사절단과 맥도널드 준장이 지휘하는 군대를 보내 1903년 12월 국경을 넘었다. 영국은 러시아와 가까운 부랴트 승려 도르지예프가 달라이 라마 곁을 오간 일을 문제 삼았다. 1904년 3월 구루에서 칼과 화승총으로 맞선 티베트군이 크게 졌고 영국군은 8월 라싸에 들어갔다. 구루에서는 티베트군 수백 명이 죽었고 영국군의 피해는 매우 적었다. 13대 달라이 라마는 몽골로 달아났다. 영국은 티베트 대표와 라싸 조약(1904)을 맺어 통상 시장의 개설과 배상금을 얻었으나, 청의 암반은 서명하지 않았다. 영국은 조약의 배상금(750만 루피)을 3분의 1로 줄이고 춤비 계곡 점령 기간을 단축했다. 청은 이를 계기로 티베트에 대한 종주권을 넘어 주권을 내세우기 시작했다. 청은 티베트에 학교와 군대를 새로 세우고 한인 관리를 두는 정책을 폈다. 1906년 베이징에서 영국과 협약을 맺어 영국이 티베트를 병합하지 않고 간섭하지 않는 것을 확인받았다(「영러 협상과 삼국 협상」(뒤의 사건)에서 영국과 러시아도 티베트에 간섭하지 않기로 했다). 이후 청은 티베트와 인접한 캄(동티베트)에서 조이풍을 시켜 사원 세력을 누르고 토사를 없애는 개토귀류를 밀어붙였다. 1908년 달라이 라마는 몽골과 우타이산을 거쳐 베이징에서 서태후와 광서제를 만났으나 청의 처우에 불만을 품었다. 1910년 2월 종영이 이끈 청군이 라싸에 들어가자 달라이 라마는 인도 다르질링으로 피신했고, 청은 그의 칭호를 거두었다고 선언했다. 청은 티베트를 이전의 암반 감독을 넘어 직접 다스리려 했지만, 티베트 사람의 반발이 컸다."
  subjects: [qing, uk, russia]
  tags: [war, politics, diplomacy]
  sources: ["『청사고』 번부전 서장", "Alastair Lamb, British India and Tibet, 1766–1910 (Routledge & Kegan Paul, 1986)", "Matthew W. Mosca, From Frontier Policy to Foreign Policy: The Question of India and the Transformation of Geopolitics in Qing China (Stanford University Press, 2013)"]

- id: constitutional-movement-1905
  year: 1905
  endYear: 1911
  title:
    ko: "입헌 준비와 흠정헌법대강, 황족 내각(1905~1911)"
  summary:
    ko: "1905년 러일 전쟁에서 입헌국 일본이 전제국 러시아를 이기자 입헌 정치를 바라는 목소리가 커졌다. 청은 1905년 말 재택, 대홍자, 단방 등 다섯 대신을 일본과 구미로 보내 헌정을 시찰하게 했다. 일행은 일본에서 이토 히로부미 등의 헌법 강설을 들었다. 1906년 9월 서태후는 입헌을 준비하겠다는 상유를 내렸다. 1908년 8월 흠정헌법대강을 발표했는데, 황제가 입법과 행정의 큰 권한을 쥐고 통치하는 일본식 헌법을 본뜬 것으로, 9년 안에 헌법을 마련하고 국회를 연다는 계획을 함께 밝혔다. 대강은 황제의 신성불가침과 군대 통솔권을 명시했고, 신민의 권리는 부록에서 일부만 인정했다. 그해 11월 광서제와 서태후가 하루 사이에 잇따라 죽었다. 두 살 푸이가 선통제로 즉위하고 아버지 재풍이 섭정왕이 되었다. 청은 1909년 각 성에 자의국을 열었고 1910년에는 중앙에 자정원을 열었다. 자의국 선거는 납세액과 학력으로 선거권을 제한해 유권자가 인구의 극히 일부였다. 자의국은 지방 예산과 철도 문제에서 총독과 부딪히는 일이 많았다. 자의국 의원은 대체로 신사층과 상인 출신으로, 장건(張謇) 같은 입헌파는 국회를 빨리 열자는 청원을 벌였다. 1910년에는 청원이 세 차례 이어졌다. 조정은 1910년 11월 개설을 3년 앞당기겠다고 했으나 그 이상은 양보하지 않았다. 입헌파가 보기에 조정의 개혁은 느렸고 중앙 권한을 늘리는 쪽으로만 흘렀다. 1911년 5월 책임내각이 발표되었다. 총리대신은 황족 경친왕 혁광이었고, 각료 13명 가운데 만주·몽골 귀족이 9명, 그 가운데 황족이 7명이었다. 사람들은 이를 황족 내각이라 불렀고, 입헌파는 청이 개혁할 뜻이 없다고 보아 등을 돌렸다(「철도 국유화와 보로 운동, 우창 봉기(1911)」(뒤의 사건))."
  subjects: [qing, japan]
  tags: [politics]
  sources: ["『청사고』 선통제본기", "Edward J. M. Rhoads, Manchus and Han: Ethnic Relations and Political Power in Late Qing and Early Republican China, 1861–1928 (University of Washington Press, 2000)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]

- id: railway-nationalization-wuchang-1911
  year: 1911
  title:
    ko: "철도 국유화와 보로 운동, 우창 봉기(1911)"
  summary:
    ko: "청 말 중국 남부 여러 성에서는 지방 신사와 상인이 주식을 모아 철도를 놓고 있었다. 이들은 철도 이권을 외국에 넘기지 않으려 했다. 민간 철도 회사들은 거액을 모았지만 공사가 더디고 횡령 문제도 있었다. 그러나 청 조정은 재정난 속에 1911년 5월 간선 철도를 국유화한다는 상유를 내렸다. 우전부 상서 성선회가 맡아, 월한 철도(광저우~우한)와 천한 철도(쓰촨~우한)의 부설을 위해 영국·프랑스·독일·미국의 은행단에서 차관을 얻기로 했다. 민간 주주에게 주식을 되사는 보상이 제대로 이루어지지 않자 후난, 후베이, 광둥, 특히 쓰촨에서 반발이 컸다. 쓰촨에서는 보로동지회가 철도를 지키자는 운동(보로 운동)을 벌였고, 9월 7일 쓰촨 총독 대리 조이풍이 지도자들을 체포하고 청두에서 군중에게 발포해 수십 명이 죽었다. 보로 운동은 처음에는 청원과 파업, 상점 철시로 평화롭게 진행되었다. 보로동지회는 신사와 상인이 중심이었고 가로회라는 비밀 결사도 가세했다. 쓰촨 각지에 무장 봉기가 번졌고, 청은 후베이의 신군 일부를 쓰촨에 보냈다. 그만큼 우한의 방비가 약해졌다. 한편 후베이 신군 안에는 문학사와 공진회 같은 혁명 단체가 뿌리를 내리고 있었다. 10월 9일 한커우의 혁명파 기관이 발각되고 체포가 이어지자 병사들이 10일 밤 우창에서 봉기했다. 봉기군은 총독 관청을 점령하고 신군 협통 리위안훙을 억지로 대표에 앉혀 후베이 군정부를 세웠다. 청은 위안스카이를 불러 대응하게 했으나 봉기는 순식간에 여러 성으로 퍼져 갔다(「신해혁명과 중화민국 수립」(뒤의 사건)). 10월 말까지 후난·산시(陝西)·산시(山西)·윈난 등이 잇달아 청에서 떨어져 나왔다. 입헌파가 등을 돌린 가운데 터진 우창 봉기는 청의 통치가 무너지는 신호가 되었다."
  subjects: [qing, uk, france, german-empire, usa]
  tags: [politics, economy, war]
  sources: ["『청사고』 선통제본기", "Joseph W. Esherick, Reform and Revolution in China: The 1911 Revolution in Hunan and Hubei (University of California Press, 1976)", "The Cambridge History of China, vol. 11, Part 2: Late Ch'ing, 1800–1911 (John K. Fairbank·Kwang-Ching Liu 편, Cambridge University Press, 1980)"]
