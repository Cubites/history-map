# 서아시아·북아프리카 사건 4차 묶음(me-04): 부와이·파티마·셀주크·십자군 시대의 이 지역·아이유브·알모라비드·알모하드·몽골의 서정 (945 ~ 1258)
# 범위: 부와이 왕조의 바그다드 입성과 아두드 앗다울라, 함단 왕조의 알레포와 미르다스 왕조, 카르마트와 우윤 왕조, 이란 서북부 쿠르드·다일람 왕조들, 메카 샤리프국,
#   파티마의 이집트 정복과 카이로, 알하킴과 드루즈, 파티마의 위기와 니자르·무스탈리 분열, 지리·함마드·하즈룬과 바누 힐랄, 마그라와·알모라비드·알모하드, 하프스·자이얀·마린의 자립,
#   가즈니 왕조, 셀주크의 이란 정복과 알프 아르슬란·말리크샤·니잠 알물크, 케르만·시리아·이라크 셀주크와 아타베그, 니자르 이스마일파와 알라무트, 호라즘샤 왕조,
#   예루살렘 왕국·트리폴리 백국의 무슬림 쪽 모습, 장기와 누르 앗딘, 살라딘과 파티마의 끝·아이유브 왕조, 아이유브 가문의 분봉, 예멘의 지야드·나자흐·술라이흐·주라이·마흐디·라술,
#   오만의 이바드 이맘국과 나브하니, 아바스 칼리프 알나시르의 부흥, 몽골의 호라즘 정복과 잘랄 앗딘, 모술의 루울루, 맘루크 술탄국의 성립, 훌라구의 서정과 바그다드 함락.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 945~1258년 지도에서 생기거나 끝난 항목과 1만 km²(주변 등급 땅은 5만 km²)를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   아라비아 내륙·동부와 오만처럼 주변 등급인 땅의 일은 개관 분량(300~500자)으로 줄였다. 긴 과정은 한 사건에 여러 왕조를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 이 시대 서아시아와 직접 닿는 한국 항목은 없어 subjects로 잇지 않았다. 몽골 쪽 이야기는 한국사 파일에 이미 있는 사건을 다시 쓰지 않았다.
#   유럽·중국 파일의 마케도니아 왕조의 반격·만지케르트·십자군 각 차와 십자군 국가·살라딘의 하틴과 제3차 십자군·시칠리아 왕국·알모라비드와 알모하드의 이베리아·라스 나바스·조지아와 몽골은
#   다시 쓰지 않고 「제목」으로 가리켰고, 이 파일에서는 이 지역 쪽 일만 썼다. 아인 잘루트(1260) 뒤의 일은 다음 묶음의 몫이다.
# 날짜: 1582년 전이라 율리우스력이다. 히즈라력은 양력 해로 바꾸어 적었고 해가 갈리거나 확실하지 않은 날짜는 '무렵'이나 '○○년설'로 적었다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서의 굳은 표기(살라딘·칼리프·술탄)를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며(알무스타심), 해 글자 동화는 저장소에 굳은 꼴만 쓴다(누르 앗딘·잘랄 앗딘·샤자르 앗두르).
#   지명은 지금도 쓰는 이름은 지금 나라 말(바그다드·카이로·알레포·다마스쿠스·튀니스), 십자군 시대 도시는 굳은 표기(안티오크·아크레·에데사)를 따르고 나라 이름은 항목 이름을 따랐다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음).
#   병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 피정복민·소수자와 종파 서술은 한쪽 입장만 따르지 않고 전승과 학설을 구분했다.

- id: buyid-baghdad-945
  year: 945
  endYear: 946
  title:
    ko: "부와이 왕조의 바그다드 입성과 칼리프 알무스타크피 폐위(945~946)"
  summary:
    ko: "945년 12월 무렵(946년 1월설도 있음) 부와이 왕조의 아흐마드 이븐 부와이가 군을 이끌고 바그다드에 들어갔다. 다일람 출신 삼 형제 가운데 맏형 알리는 파르스를, 아흐마드는 후제스탄을 차지한 참이었고, 그 과정은 「부와이 형제의 흥기: 이란 서부의 장악(934~945)」(앞의 사건)과 「아미르 알우마라 제도와 칼리프의 무력화(936~945)」(앞의 사건)에 있다. 바그다드에서는 튀르크 장군들이 아미르 알우마라 자리를 두고 다투며 재정이 바닥나 있었고, 칼리프 알무스타크피(재위 944~946)는 아흐마드를 맞아들여 아미르 알우마라 직과 '무이즈 앗다울라'(왕조의 강화자)라는 칭호를 내렸다. 형 알리는 '이마드 앗다울라', 동생 하산은 '룩큰 앗다울라'라는 칭호로 불렸는데, 세 형제가 칭호를 받은 해는 945년이라는 설이 통설이고 934~935년설도 있다. 부와이 사람들은 시아파 곧 열두 이맘파나 자이드파 쪽으로 기울었다고 보지만 아바스 칼리프를 없애지 않았다. 수니 다수 주민과 군대를 다스리는 데 칼리프의 권위가 필요했기 때문이라는 풀이가 있다. 946년 1월 무렵 궁정에서 부와이의 다일람 병사들이 칼리프를 끌어내렸고, 알무스타크피는 눈이 멀어 폐위되었다. 부와이는 그 자리에 알무티(재위 946~974)를 세웠다. 칼리프는 임명장을 주고 의례를 이끄는 상징으로 남았고, 실제 군사와 재정은 부와이의 아미르가 쥐었다. 이 구조는 이후 100년 가까이 이어졌다. 무이즈 앗다울라는 다일람 병사에게 이라크의 세금 수입을 맡기는 방식(이크타)으로 군대를 먹여 살렸고, 이 제도는 세금 걷는 일과 군인 봉급을 한데 묶어 이후 이슬람 세계의 군사 제도에 널리 퍼졌다. 수니 다수 주민과 시아 성향의 새 지배자 사이의 긴장은 바그다드 거리의 종파 충돌로 이어지기도 했다."
  subjects: [buyid-dynasty, abbasid-caliphate]
  tags: [politics]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)"]

- id: sayf-al-dawla-aleppo-946
  year: 946
  endYear: 1016
  title:
    ko: "함단 왕조의 알레포: 사이프 앗다울라에서 루울루 가문까지(946~1016)"
  summary:
    ko: "함단 왕조의 사이프 앗다울라(재위 945~967)는 944년 알레포를 차지하고 이흐시드 왕조의 카푸르와 다툰 끝에 북시리아를 지켜, 알레포를 도읍으로 한 토후국을 세웠다. 그의 궁정에는 시인 무타납비와 철학자 알파라비가 머물렀다. 그는 동로마와 거의 해마다 싸웠고, 그 일은 「마케도니아 왕조의 반격: 멜리테네(934)에서 크레타(961)·안티오크(969)까지」(앞의 사건)에 있다. 962년 니케포로스 포카스가 알레포 시가지를 약탈했고, 969년 안티오크를 얻은 동로마는 아들 사드 앗다울라(재위 967~991)에게 조공을 받는 관계를 맺었다. 파티마 칼리프국이 시리아로 올라오자 알레포는 동로마와 파티마 사이에 놓였다. 파티마 군이 994년 알레포를 포위하자 바실리오스 2세가 995년 직접 원정해 포위를 풀었고, 1001년 두 나라가 휴전을 맺었고, 알레포는 뒤에 파티마의 종주를 받아들이면서 동로마에도 조공을 바쳤다. 사드 앗다울라의 아들 사이드 앗다울라(재위 991~1002) 아래에서 가신 루울루가 1002년 실권을 쥐었고, 1004년 마지막 함단 군주를 밀어내면서 함단 왕조의 알레포가 끝났다. 루울루 가문은 1016년 무렵까지 알레포를 다스렸으나, 만수르 때 민중이 일어나 그가 동로마 땅으로 달아나자 알레포는 파티마 총독에게 넘어갔다. 이 과정에서 알레포는 아랍 부족, 아르메니아인과 그리스인 기독교도, 시아·수니 주민이 뒤섞인 변경 도시로 자랐다. 동로마 제국은 이 변경 전쟁에서 969년 안티오크를 되찾은 뒤 알레포를 속국처럼 다루어 시리아 북부의 정치에 오래 개입했다. 알레포는 이 기간 이집트에서 올라오는 파티마 쪽 군대와 부딪히는 완충지였고, 도시 주민은 전쟁과 조공, 약탈을 번갈아 겪었다. 사이프 앗다울라의 궁정이 남긴 시와 학문은 아랍 문학사에서 한 시대를 이룬 것으로 평가된다."
  subjects: [hamdanid-dynasty, luluids-of-aleppo, ikhshidid-dynasty, fatimid-caliphate, byzantine-empire]
  tags: [politics, war]
  sources: ["Marius Canard, Histoire de la dynastie des H'amdanides de Jazîra et de Syrie (Publications de la Faculté des Lettres d'Alger, 1951, 1권)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)"]

- id: adud-al-dawla-949
  year: 949
  endYear: 983
  title:
    ko: "부와이 대아미르 정권과 아두드 앗다울라(949~983)"
  summary:
    ko: "부와이 왕조는 한 집안이 나누어 다스리는 연합이었다. 이마드 앗다울라 알리가 949년 죽자 후사가 없던 그의 뒤를 조카이자 룩큰 앗다울라의 아들인 파나 쿠스라우가 '아두드 앗다울라'라는 칭호로 파르스에서 이었고, 이라크의 무이즈 앗다울라와 이란 중부의 룩큰 앗다울라가 같은 집안의 어른으로서 그 위에 있었다. 아두드 앗다울라는 967년 이웃 일리아스 왕조의 케르만을 침공해 968년 도읍 바르다시르를 차지했고, 같은 무렵 오만 해안도 부와이 아래 들어갔다. 이라크의 무이즈 앗다울라가 967년 죽고 아들 이즈 앗다울라 바흐티야르가 이으면서 병사들의 반란과 재정난이 겹치자 아두드 앗다울라가 사촌의 땅을 노렸다. 그는 977~978년 이라크로 들어가 바흐티야르를 물리치고(바흐티야르는 978년 전사) 바그다드를 차지했으며, '샤한샤'(왕 중의 왕)라는 이란식 칭호를 쓰고 칼리프에게 이를 받아들이게 했다. 979년 모술의 함단 왕조를 눌렀고, 980~981년 무렵 지야르 왕조의 카부스를 쫓아 타바리스탄을 얻었다. 그는 바그다드에 병원(비마리스탄)을 짓고 관개 시설을 정비했으며 학자와 시인을 후원했다. 아두드 앗다울라는 983년 3월 죽었고, 이후 아들들이 다투며 부와이는 갈라졌다. 이라크 중부 힐라 쪽에서는 아랍 부족장 가문인 마즈야드 왕조가 961년 무렵부터 뿌리를 내려 나중에 부와이와 셀주크의 틈에서 힘을 키웠다. 아두드 앗다울라 시기는 부와이의 영토가 가장 넓었던 때로, 이란 서부에서 이라크·오만에 걸쳤다. 아바스 칼리프국의 칼리프 알타이으(재위 974~991)는 아두드 앗다울라의 딸을 아내로 맞았다고 전한다. 부와이 군주들은 열두 이맘파나 자이드파 쪽으로 기운 시아 신앙을 가졌으나 수니 다수 주민 위에서 다스렸고, 아두드 앗다울라 때에는 시아와 수니 모두의 종교 건축과 학자 후원이 이어졌다. 이 시기 바그다드는 아랍어와 페르시아어 문화가 만나는 도시였다."
  subjects: [buyid-dynasty, abbasid-caliphate, ilyasid-dynasty, hamdanid-dynasty, ziyarid-dynasty, mazyadid-dynasty]
  links:
    - { from: buyid-dynasty, to: ilyasid-dynasty, note: "케르만 정복 (967~968)" }
  tags: [politics, war]
  sources: ["Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)", "Heribert Busse, Chalif und Großkönig: Die Buyiden im Iraq (945–1055) (Beiruter Texte und Studien 6, Franz Steiner Verlag, 1969)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: qarmatian-hasa-951
  year: 951
  endYear: 1077
  title:
    ko: "카르마트 국가의 쇠퇴: 흑석 반환(951)과 우윤 왕조의 알하사(1077)"
  summary:
    ko: "카르마트 국가는 이스마일파 가운데 파티마와 갈라선 분파가 동아라비아 알하사에 세운 정권으로, 930년 메카에서 흑석(카바의 검은 돌)을 빼앗아 간 일로 이름이 났다. 이 정권의 터는 아부 사이드 알자나비가 899년 무렵 바레인(걸프 서안)에서 닦았고, 알하사 오아시스의 대추야자 농사와 걸프 교역을 기반으로 삼았다. 이 습격으로 메카에서 순례객과 주민이 죽었고, 사료는 죽은 사람 수를 수천에서 3만 명까지 다르게 적는다. 11세기 중엽 이곳을 찾은 페르시아 여행자는 여섯 명의 지도자가 모여 다스리며 주민에게서 세금을 거의 걷지 않았다고 기록했으나, 호의적인 한 사람의 기록이라 조심해서 읽어야 한다. 이에 앞서 카르마트는 아바스 칼리프국의 순례 행렬을 습격하고 바스라와 쿠파를 공격해 이라크를 위협했다. 이 돌은 여러 해의 협상 끝에 951년(952년설도 있음) 카르마트가 메카에 돌려주었다(대가와 경위는 사료마다 다르다). 돌아온 흑석은 깨어진 채 카바에 다시 박혔다고 전하며, 그동안 카르마트의 약탈로 이라크와 아라비아를 잇는 순례길이 한동안 끊기다시피 했다. 카르마트 군은 아랍 부족 기병과 노예 병사로 이루어졌고 알하사의 농원 일은 노예들이 맡았다고 전한다. 카르마트는 파티마 칼리프국의 칼리프를 이맘으로 따르지 않았고, 970년대에는 시리아에서 파티마와 싸웠다. 그 뒤 힘이 약해졌다. 11세기 후반 아랍 부족장 압둘라 이븐 알리 알우윤이 셀주크의 도움을 받아 1077년 무렵(1067년설도 있음) 알하사와 카티프 해안의 카르마트를 무너뜨리고 우윤 왕조를 세웠다. 카르마트의 쇠퇴는 파티마의 이집트 정복(969) 이후 이슬람 세계의 중심이 카이로와 바그다드로 쏠린 흐름과 맞물렸다."
  subjects: [qarmatian-state, uyunid-dynasty, abbasid-caliphate, fatimid-caliphate]
  tags: [politics, religion]
  sources: ["The Encyclopaedia of Islam, 2판 (Brill, 1960~2009)", "Wilferd Madelung, Religious Trends in Early Islamic Iran (Bibliotheca Persica, 1988)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)"]

- id: northwest-dynasties-955
  year: 955
  endYear: 1015
  title:
    ko: "이란 서북부와 자그로스의 쿠르드·다일람 왕조들: 라와드·하산와이·안나즈(955~1015)"
  summary:
    ko: "10세기 후반 부와이 왕조의 힘이 이란 고원과 이라크에 걸쳐 있던 동안, 자그로스 산지와 아제르바이잔에서는 쿠르드계 영주들이 지방 정권을 세웠다. 아제르바이잔은 살라르(무사피르) 왕조의 땅이었는데, 쿠르드 부족 라와드 가문이 타브리즈를 중심으로 힘을 키워 979년 무렵(980년대설도 있음) 살라르 왕조에게서 아제르바이잔을 빼앗고 라와드 왕조로 자리 잡았다. 살라르는 타롬에 작은 땅만 남았다. 케르만샤와 로레스탄 쪽에서는 하산와이 이븐 후세인이 959년 무렵 쿠르드 바르자니 부족을 모아 하산와이 왕조를 세웠고, 아들 바드르 이븐 하산와이(재위 979~1014)는 부와이의 신하로서 한 시대 이 지역의 평화를 지켰다. 바드르가 1014년 죽자 후계 다툼이 일어났고, 1015년 자발 서부는 안나즈 왕조로 넘어갔다. 안나즈 왕조는 990년 무렵 안나즈 가문이 훌완과 케르만샤 쪽에서 일으킨 쿠르드 계통 정권이다. 이 쿠르드 영주들은 부와이의 약화를 틈타 땅을 얻었으나, 이웃의 큰 나라에 공물을 바치며 자립을 지켰다. 11세기 중반 셀주크가 들어오면서 세 왕조 모두 그 아래로 들어갔다. 이 쿠르드 영주들이 쌓은 성채와 교역로는 이후 셀주크와 몽골 시기에도 이 지역의 정치를 규정했다. 라와드 왕조의 도시 타브리즈는 상업과 건축으로 자랐고, 쿠르드 부족 연합은 가축 이동로를 따라 권력을 행사했다. 이웃한 아르메니아와 조지아 왕국은 이들과 때로 동맹했고 때로 싸웠다. 이들의 군대는 쿠르드 부족 기병과 산성에 기댔고, 쿠르드 영주들은 이웃의 큰 나라가 약해지면 도시와 성채를 넓히고 강해지면 공물로 땅을 지키는 길을 되풀이했다. 이 지역의 쿠르드 가문들은 아랍·페르시아 문화와 섞이며 도시 상인과 협력했다."
  subjects: [rawadid-dynasty, hasanwayhid-dynasty, annazid-dynasty, sallarid-dynasty, buyid-dynasty]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Vladimir Minorsky, Studies in Caucasian History (Cambridge University Press, 1953)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)"]

- id: sharifate-mecca-967
  year: 967
  endYear: 1200
  title:
    ko: "메카 샤리프국과 히자즈: 파티마와 아이유브의 종주권 아래(967~1200)"
  summary:
    ko: "메카와 메디나가 있는 히자즈는 아랍 사막의 가장자리로, 강한 왕조가 직접 다스리기 어려운 땅이었다. 967년 무렵 무함마드의 외손자 하산의 후손 자파르 이븐 무함마드 알하산(재위 967~980)이 메카의 샤리프(예언자의 후손으로 도시를 다스리는 가문의 우두머리)가 되었고, 이 샤리프 가문이 이후 오랫동안 메카를 이어 다스렸다. 샤리프들은 파티마 칼리프국이 이집트를 얻은 뒤 파티마의 종주를 받아들이고 곡물과 지원을 받았으며, 1012년에는 메카의 아미르가 칼리프를 칭했다가 같은 해 물러났고, 1060년대에는 예멘의 술라이흐 왕조가 한동안 샤리프를 임명했다. 그 뒤 샤리프들은 파티마와 셀주크 사이에서 모호한 자리를 지켰다. 1171년 살라딘이 파티마를 끝내자 아이유브 왕조의 종주권 아래로 옮겨 갔다. 순례길을 맡은 샤리프에게 순례 안전과 곡물 공급은 가장 중요한 일이어서 이집트와 이라크의 강한 나라에 기대는 것이 되풀이되었다. 메카는 곡물을 대부분 이집트와 이라크에서 들여왔고 카바를 덮는 천(키스와)도 강한 나라가 해마다 보냈기 때문에, 어느 나라의 이름을 금요 설교에 올리고 키스와를 받느냐가 곧 종주권의 표시였다. 순례객에게서 걷는 세금과 이집트에서 오는 하사품이 샤리프의 주된 수입이었고, 무함마드의 후손이라는 권위는 정치력이 약해도 순례 도시를 다스릴 명분이 되었다. 샤리프 가문 안에서도 후계를 두고 형제와 사촌이 다투어 메카를 차지하는 사람이 자주 바뀌었다. 샤리프의 군사력은 히자즈의 베두인 부족에 기댄 작은 것이었다. 1200년 무렵 카타다 이븐 이드리스가 메카를 차지하면서 샤리프의 지배가 새 가문으로 넘어갔고, 메카 샤리프국은 이후에도 이어졌다."
  subjects: [sharifate-of-mecca, fatimid-caliphate, ayyubid-dynasty]
  tags: [politics, religion]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2009)"]

- id: fatimid-egypt-968
  year: 968
  endYear: 983
  title:
    ko: "파티마의 이집트 정복과 카이로 건설, 시리아 진출(968~983)"
  summary:
    ko: "이집트의 이흐시드 왕조는 카푸르가 968년 4월 죽은 뒤 어린 군주를 둘러싼 다툼과 기근에 시달렸다. 이프리키야의 파티마 칼리프 알무이즈는 오래 준비한 원정군의 사령관으로 시칠리아 출신 장군 자우하르를 보냈고, 자우하르는 969년 7월 이집트에 들어와 푸스타트의 항복을 받았다. 파티마의 군대는 저항이 적었고 주민에게 안전과 종교의 자유를 약속했다. 자우하르는 푸스타트 북쪽에 칼리프가 살 새 도성을 세우기 시작했고, 이 도시는 '승리하는 도시'라는 뜻의 알카히라, 곧 카이로가 되었다. 970년에는 알아즈하르 모스크를 짓기 시작해 972년 첫 금요 예배를 올렸고, 이 모스크는 곧 이스마일파 교리를 가르치는 중심이 되었다. 알무이즈는 973년 6월 이프리키야에서 카이로로 들어와 파티마의 도읍을 옮겼고, 이프리키야는 부하 지리 왕조에게 맡겼다. 이집트를 얻은 파티마는 시리아로 군을 보냈다. 970년 자우하르의 부하 자파르 이븐 팔라가 팔레스타인과 다마스쿠스를 차지했으나, 자파르는 971년 8월 카르마트에게 져 죽었고, 카르마트는 971년과 974년 이집트까지 쳐들어왔다. 튀르크 장수 알프티긴은 975년 다마스쿠스를 차지해 978년까지 쥐었으나 978년 8월 타와힌 전투에서 알아지즈에게 졌다. 이 싸움은 파티마가 979년 팔레스타인·요르단을 되찾고, 카심 알투라비가 파티마 아래에서 쥐던 다마스쿠스를 983년 레바논과 함께 직접 지배로 바꾸며 풀려 갔다. 알무이즈는 975년 죽었고 아들 알아지즈(재위 975~996)가 이었다. 이 시기 동로마와는 안티오크 문제로 맞섰고, 969년 안티오크를 얻은 동로마의 반격은 「마케도니아 왕조의 반격: 멜리테네(934)에서 크레타(961)·안티오크(969)까지」(앞의 사건)에 있다. 파티마 칼리프국이 카이로를 도읍으로 삼으면서 지중해와 홍해, 인도양을 잇는 교역의 이익이 이집트로 모였고, 카이로는 이슬람 세계의 큰 도시로 자랐다. 카르마트 국가는 이스마일파이면서도 파티마를 인정하지 않아 파티마의 가장 곤란한 적수가 되었다. 정복 직후 이집트 주민의 대다수는 수니 무슬림과 콥트 교회 신자였고, 파티마는 이들에게 이스마일파 신앙을 강요하지 않는 편이었다."
  subjects: [fatimid-caliphate, ikhshidid-dynasty, qarmatian-state]
  links:
    - { from: fatimid-caliphate, to: ikhshidid-dynasty, note: "이집트 정복 (969)" }
  tags: [war, politics, religion]
  sources: ["Michael Brett, The Fatimid Empire (Edinburgh University Press, 2017)", "Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)"]

- id: zirid-ifriqiya-972
  year: 972
  endYear: 1015
  title:
    ko: "지리 왕조의 이프리키야 통치와 함마드·하즈룬의 자립(972~1015)"
  summary:
    ko: "파티마의 알무이즈는 972년 이집트로 떠나기에 앞서 이프리키야를 산하자 베르베르 부족의 지도자 유수프 부르긴 이븐 지리에게 맡겼고, 이로써 지리 왕조가 시작되었다. 지리 왕조는 카이라완을 도읍으로 파티마의 가신으로서 이프리키야와 알제리 동부를 다스렸고, 978년 트리폴리타니아 해안까지 장악했다. 파티마가 이집트로 옮겨 가면서 마그레브에서는 지리 왕조가 사실상 독립 국가처럼 움직였지만 이름은 파티마의 총독이었다. 부르긴의 아들 함마드가 1007년 알제리 중부에 칼아 베니 함마드를 세웠고, 바디스(재위 996~1016) 때의 다툼 속에서 1015년 무렵 지리에게서 떨어져 나와 함마드 왕조를 이루었다. 한편 트리폴리에서는 마그라와 계통의 풀풀 이븐 사이드가 1001년 지리에게서 자립해 하즈룬 왕조를 열고 트리폴리 해안을 얻었다. 지리 왕조는 알제리 중부·트리폴리타니아의 땅을 잃었으나 튀니지 중심의 땅은 지켰고, 카이라완은 11세기 전반 무역과 학문이 번성하는 도시였다. 두 갈래로 갈라진 함마드와 지리의 다툼은 11세기 중반 바누 힐랄의 침입으로 이어졌다. 파티마의 총독 부르긴은 979년 마그레브 서부의 시질마사와 페스까지 원정했다가 984년 돌아오던 길에 죽었고, 아들 알만수르(재위 984~996)와 바디스(재위 996~1016)가 이었다. 지리 왕조는 파티마 칼리프국의 이름으로 금요 예배를 올리며 이프리키야를 다스렸지만 실제로는 마그레브의 주인처럼 움직였다. 이는 파티마가 서쪽 땅에 신경을 덜 쓰고 이집트와 시리아에 힘을 쏟게 만들었고, 이 느슨한 관계가 뒤에 지리 왕조가 파티마에게서 떨어져 나가는 배경이 되었다. 카이라완은 11세기 전반 법학과 학문의 중심지였다."
  subjects: [zirid-dynasty, fatimid-caliphate, hammadid-dynasty, khazrunid-dynasty]
  tags: [politics]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Hady Roger Idris, La Berbérie orientale sous les Zīrīdes, Xe–XIIe siècles (Adrien-Maisonneuve, 1962)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)"]

- id: maghrawa-974
  year: 974
  endYear: 1056
  title:
    ko: "서마그레브의 마그라와와 코르도바의 개입: 이드리스·미드라르 왕조의 끝(974~1056)"
  summary:
    ko: "10세기 후반 서마그레브에서는 이드리스 왕조, 미드라르 왕조 같은 옛 왕조들이 코르도바의 후우마이야 칼리프국과 파티마 사이에서 밀려났다. 이드리스 왕조는 파티마와 코르도바 어느 쪽에도 기대어 간신히 지키다가 974년 코르도바의 장군 갈리브에게 하산 2세가 항복해 코르도바로 끌려가면서 끝났다. 976년 무렵에는 제나타 베르베르 계통의 마그라와 가문의 시질마사 군주 하즈룬 이븐 풀풀이 시질마사를 차지해 미드라르 왕조를 끝냈다. 마그라와의 지리 이븐 아티야는 코르도바 칼리프국의 지원을 받아 987년 페스를 얻어 모로코 북부의 주인이 되었고, 코르도바가 무너진 뒤에는 자립해 이어 갔다. 마그라와가 틀렘센과 시질마사에 걸치는 상업 길을 쥐면서 사하라 횡단 교역의 이익을 거둔 것이 그 힘의 바탕이었다. 그러나 11세기 중반 사하라 서쪽에서 일어난 알모라비드 운동이 시질마사를 1056년 무렵 차지하면서 마그라와의 세력이 꺾이기 시작했다. 이 지역의 정치는 베르베르 부족의 이합집산이었고, 후우마이야 칼리프국의 이베리아에서의 일은 「알만수르의 죽음(1002)에서 후우마이야 칼리프국의 끝(1031)까지」(뒤의 사건)에 있다. 마그라와 왕조는 사하라 교역의 이익 위에서 파티마 칼리프국과 후우마이야 칼리프국 사이를 오가며 충성 대상을 바꾸었다. 파티마는 921~931년 페스까지 영향을 미쳤다가 물러난 뒤 지리 왕조를 통해 간접으로 개입했고, 이 지역의 정치는 제국들의 대리전과 베르베르 부족의 이합집산이 얽힌 것이었다. 서쪽의 대서양 평야에는 바르가와타 연합이 독자 신앙을 지키며 버텼다. 마그라와의 지배는 이 지역에서 제나타 베르베르 부족이 정치의 주역이 되는 흐름을 보여 준다."
  subjects: [idrisid-dynasty, midrarid-dynasty, maghrawa-dynasty, cordoba-caliphate, fatimid-caliphate]
  tags: [politics, war]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (Longman, 1996)"]

- id: ghaznavid-977
  year: 977
  endYear: 1040
  title:
    ko: "가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)"
  summary:
    ko: "가즈니 왕조는 사만 왕조의 튀르크계 노예 장군 알프티긴이 세운 가즈니 정권에서 나왔다. 977년 사부크티긴이 가즈니의 군주가 되었고, 997년 그가 죽은 뒤 아들 이스마일이 잠깐 이었으나 998년 형제 마흐무드(재위 998~1030)가 이스마일을 꺾고 즉위해 사만 왕조의 내분을 틈타 영토를 넓혔다. 사만 왕조는 999년 카라한 왕조가 부하라를 차지하고 마흐무드가 호라산을 가져가면서 무너졌다. 시스탄의 사파르 왕조는 1003년 마흐무드에게 마지막 군주 칼라프 이븐 아흐마드를 폐위당하고 땅을 빼앗겼다. 마흐무드는 인도 북서부를 여러 차례 공격해 얻은 재물로 군대와 궁정을 유지했고, 시인 피르다우시가 『샤나메』를 바친 곳도 이 궁정이다. 천문학자 알비루니도 가즈니 궁정에서 일했다. 1029년 마흐무드는 부와이 쪽 땅이던 라이와 이란 중부로 진출했다. 카스피해 남쪽의 지야르 왕조는 부와이 아래에 있다가 되살아난 뒤 가즈니의 종주권을 받아들였다. 그러나 마흐무드가 죽은 뒤 아들 무함마드가 몇 달 잠깐 이었고(1030), 그를 밀어낸 형제 마수드 1세(재위 1030~1041)는 1040년 단다나칸에서 셀주크에 크게 졌고, 호라산을 잃었다. 가즈니는 아프가니스탄과 펀자브 쪽으로 물러나 그곳에서 이어졌다. 부와이 왕조와는 이란 서부와 호라산 사이의 국경에서 부딪쳤고, 마흐무드는 부와이의 라이 지배를 끊어 이란 중부에서 부와이의 힘을 줄였다. 가즈니 군은 튀르크계 노예 병사(굴람)와 인도에서 온 병사, 코끼리 부대로 이루어졌고, 세금은 호라산의 농업 지대와 인도 원정의 전리품에서 나왔다. 마흐무드의 인도 원정은 신전 약탈로 인도 쪽에서는 큰 피해로 기억되고, 이슬람 쪽에서는 성전의 영웅으로 기려졌다. 가즈니의 궁정은 아랍어와 페르시아어, 튀르크어 문화가 섞인 곳이었고, 이는 훗날 이란 동부 문화의 바탕이 되었다."
  subjects: [ghaznavid-empire, samanid-empire, saffarid-dynasty, buyid-dynasty, ziyarid-dynasty]
  tags: [politics, war, culture]
  sources: ["C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: buyid-decline-983
  year: 983
  endYear: 1036
  title:
    ko: "부와이 왕조의 분열과 지방 정권: 우카일·카쿠이·마즈야드(983~1036)"
  summary:
    ko: "아두드 앗다울라가 983년 죽은 뒤 부와이 왕조의 영토는 형제와 사촌의 다툼 속에서 갈라졌다. 삼삼 앗다울라(재위 983~987)와 샤라프 앗다울라(재위 987~989)를 거쳐 989년 이라크의 바하 앗다울라(재위 989~1012)가 한동안 이란의 땅을 합쳤으나 지방 정권들이 따로 서면서 영토가 줄었다. 990년 무렵 모술 둘레에서는 아랍 우카일 부족의 무함마드 이븐 알무사이이브가 우카일 왕조를 세웠고, 아랍 사료에는 이들이 부와이의 이름뿐인 신하로 모술과 자지라 북부를 다스렸다고 전한다. 이란 중부에서는 카쿠이 왕조를 연 무함마드 이븐 루스탐이 1008년 무렵 이스파한을 차지했고 1023~1024년 하마단까지 얻었다. 이라크 중부 힐라 쪽에서는 마즈야드 왕조를 이룬 아랍 부족장들이 1012년 무렵 부와이에게서 이 땅을 사실상 넘겨받았다. 한편 호라산의 가즈니 왕조는 1029년 라이를 부와이의 손에서 빼앗고 이란 서부로 진출했다. 이 시기 아바스 칼리프국의 칼리프는 알카디르(재위 991~1031)가 강한 부와이 군주 사이에서 수니 교리를 다시 세우는 선언(알카디르 신조)을 반포하는 등 종교 권위를 되살리려 했으나, 군사와 재정은 부와이 군인에게 달려 있었다. 이 분열이 뒤에 셀주크가 들어올 길을 열었다. 바하 앗다울라 뒤로는 술탄 앗다울라(재위 1012~1021), 무샤리프 앗다울라(재위 1021~1025), 잘랄 앗다울라(재위 1025~1044)가 바그다드의 부와이 군주로 이어졌지만 이들은 튀르크 병사와 다일람 병사의 반란과 재정난에 시달렸다. 세 지방 정권은 모두 이름뿐인 부와이의 종주권 아래에서 자라, 부와이는 한 나라라기보다 느슨한 가문 연합이 되어 갔다. 군인들에게 땅의 수입을 나누어 주는 방식은 농민의 부담을 키웠다는 지적도 있다."
  subjects: [buyid-dynasty, kakuyid-dynasty, mazyadid-dynasty, ghaznavid-empire, abbasid-caliphate, uqaylid-dynasty]
  tags: [politics]
  sources: ["Heribert Busse, Chalif und Großkönig: Die Buyiden im Iraq (945–1055) (Beiruter Texte und Studien 6, Franz Steiner Verlag, 1969)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)"]

- id: hakim-druze-996
  year: 996
  endYear: 1021
  title:
    ko: "알하킴의 통치와 드루즈 신앙의 시작(996~1021)"
  summary:
    ko: "알하킴은 996년 열한 살 무렵 파티마의 여섯째 칼리프가 되었다. 초기 몇 해는 환관 바르자완이 섭정으로 실권을 쥐었고(1000년 3월 피살), 이후 그가 직접 다스리면서 변덕스러운 칙령이 이어졌다. 1005년부터 그리스도교도와 유대인에게 특별한 옷과 표지를 강요하고 교회와 회당을 부수거나 닫게 했으며, 1009년에는 예루살렘의 성묘 교회를 헐라고 명령했다. 이는 훗날 유럽에서 십자군의 구실로 이야기되었다. 그러나 1012년 무렵부터는 일부 칙령이 되돌려져 강제로 개종한 이들의 복귀가 허용되었고, 기독교도 재상과 대신도 오갔다. 한편 그는 1005년 카이로에 '지식의 집'(다르 알일름)을 열어 학자들을 모았고, 천문학자 이븐 유누스가 그의 궁정에서 관측했다. 1017년 무렵 하므자 이븐 알리와 알다라지 같은 이스마일파 선교사들이 알하킴을 신의 화신으로 보는 가르침을 퍼뜨렸고, 이 가르침이 드루즈파의 시작이 되었다. 드루즈는 이스마일파에서 갈라져 나왔으며 스스로를 따로 규정한다. 알하킴은 1021년 2월 카이로 근처 무카탐 언덕으로 말을 타고 나갔다가 돌아오지 않았고, 누이 싯트 알물크가 섭정을 맡았다. 이집트의 드루즈 선교는 탄압을 받아 시리아와 레바논 산지로 옮겨 갔다. 이 기간 동로마 제국과는 1001년 휴전 이후 이어진 관계가 성묘 교회 일로 흔들렸다. 알하킴 시기 파티마 칼리프국은 1000년 무렵 홈스와 하마 쪽 중부 시리아까지 영향력을 넓혔다. 이집트 주민의 상당수는 콥트 교회를 따르는 그리스도교도였고 유대인 공동체도 있어 이 정책의 피해가 컸다. 성묘 교회 파괴는 동로마와 서유럽에서 큰 분노를 샀으나, 알하킴 시대의 칙령은 일관되지 않아 학자들은 그의 진짜 의도를 두고 의견이 갈린다."
  subjects: [fatimid-caliphate, byzantine-empire]
  tags: [politics, religion]
  sources: ["Michael Brett, The Fatimid Empire (Edinburgh University Press, 2017)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "Heinz Halm, The Fatimids and Their Traditions of Learning (I. B. Tauris, 1997)"]

- id: yemen-end-997
  year: 997
  endYear: 1022
  title:
    ko: "예멘의 유피르·지야드 왕조의 끝과 나자흐 왕조의 성립(997~1022)"
  summary:
    ko: "예멘은 9세기 이래 티하마(홍해 해안)와 고지가 나뉘어 있었다. 고지에서는 시밤-카우카반의 유피르 왕조가 사나를 중심으로 자이드파 이맘과 다투며 이어 왔으나, 997년 무렵 압둘라 이븐 카흐탄이 죽은 뒤 자이드파 이맘 다이 유수프와 함단 부족이 사나를 다투는 가운데 권위가 사라졌다. 사다에서는 자이드파 이맘국이 이맘 알하디 일라 알학 이래 이어지고 있었고, 고지의 부족 사이에서 영향력을 지켰다. 티하마의 자비드를 중심으로 한 지야드 왕조는 이름만 남은 군주 아래 아비시니아 출신 노예 재상들이 실권을 쥐고 있었다. 1012년 재상 후세인 이븐 살라마가 죽은 뒤 그의 노예 마르잔이 재상을 맡았고, 1018년 마지막 지야드 군주가 피살된 뒤에는 마르잔의 에티오피아계 노예 나피스가 왕을 칭하면서 지야드 왕조가 끝났다. 나자흐 가문은 나피스와 마르잔을 물리치고 1022년 나자흐 왕조를 세워 티하마를 직접 다스렸다. 나자흐는 에티오피아 쪽 노예 출신 군인과 아랍 부족을 병력으로 삼았다. 이 시기 예멘의 정치는 외부의 큰 나라보다 지역 부족과 소왕조 사이의 이합집산으로 움직였고, 술라이흐 왕조가 이스마일파 선교로 세력을 얻는 것은 뒤의 일이다. 자비드는 쿠란 학교와 법학으로 이름난 해안 도시였고, 아덴은 인도양 교역의 항구로 자라고 있었다. 후세인 이븐 살라마는 981년 이후 수십 년 실권을 쥔 아비시니아 출신 노예 재상으로, 그의 가문과 뒤의 나자흐 가문이 같은 노예 군인 집단 안에서 권력을 주고받았다. 나자흐 왕조의 통치는 뒤의 술라이흐 왕조가 일어날 때까지 티하마를 지탱했다. 고지의 부족들은 사나와 사다를 오가며 자이드파 이맘과 유피르 가문, 외부의 이스마일파 선교사 사이에서 편을 바꾸었고, 이는 뒤의 술라이흐 왕조가 퍼뜨린 선교가 뿌리내릴 바탕이 되었다. 예멘은 이 무렵 이집트와 이라크의 큰 나라에서 멀어 독자 정치가 오래 이어졌다."
  subjects: [yufirid-dynasty, ziyadid-dynasty, najahid-dynasty, zaydi-imamate]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "ʿUmāra al-Yamanī, Taʾrīkh al-Yaman (영역: Yaman, Its Early Mediaeval History, Henry Cassels Kay 옮김, Edward Arnold, 1892)"]

- id: mirdasid-1014
  year: 1014
  endYear: 1080
  title:
    ko: "알레포의 미르다스 왕조와 파티마·동로마(1014~1080)"
  summary:
    ko: "알레포는 1016년 무렵 루울루 가문이 쫓겨난 뒤 파티마 칼리프국의 총독이 다스렸으나, 시리아 북부 유목민 부족의 힘이 컸다. 키랍 부족의 살리흐 이븐 미르다스는 1008년 라흐바를 차지했고 1014년 옥에서 달아나 키랍 부족의 우두머리로 올라 힘을 쌓다가 1025년 알레포를 차지해 미르다스 왕조를 세웠다. 그는 파티마의 세력과 동로마 사이에서 균형을 잡다가 1029년 우쿠하와나 전투에서 파티마의 장군에게 죽었다. 아들 나스르가 이었고 1030년 동로마 제국 황제 로마노스 3세 아르귀로스의 원정군이 아자즈에서 나스르에게 패했다. 나스르가 1038년 죽자 파티마 장군 아누슈티긴이 알레포를 맡았으나 1042년 그가 죽은 뒤 티말이 알레포를 되찾았다. 티말(재위 1042~1062 무렵, 중간에 마흐무드가 잠깐 차지한 때가 있다), 아티야(재위 1062~1065), 마흐무드(재위 1065~1075 무렵)가 파티마와 동로마, 셀주크 사이에서 알레포를 지켰다. 미르다스 왕조는 아랍 유목민 부족이 도시를 다스린 사례로, 유목 부족이 소왕조를 세우는 이 시기의 특징을 보여 준다. 1071년 이후에는 셀주크 투르크멘의 시리아 진출이 닥쳤다. 1080년 모술의 우카일 왕조의 무슬림 이븐 쿠라이시가 알레포를 차지하면서 미르다스 왕조가 끝났다. 알레포는 이 시기 파티마 칼리프국과 동로마 제국 어느 쪽에도 완전히 속하지 않은 채 두 나라에 번갈아 조공했고, 도시 주민은 수니와 시아, 그리스도교도가 섞여 있었다. 미르다스 군주들은 아랍 유목 부족 병력과 도시 용병을 같이 썼으며 시인과 학자를 궁정에 모았다. 아랍 시인 아부 알알라 알마아리(973~1057)가 알레포 둘레의 마아라에서 살며 이 시기를 보냈다."
  subjects: [mirdasid-dynasty, fatimid-caliphate, byzantine-empire, uqaylid-dynasty]
  tags: [politics, war]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Michael Brett, The Fatimid Empire (Edinburgh University Press, 2017)"]

- id: oman-ibadi-1016
  year: 1016
  endYear: 1164
  title:
    ko: "오만 이바드파 이맘국의 재건과 나브하니 왕조(1016~1164)"
  summary:
    ko: "10세기에는 부와이 왕조에, 11세기 중엽 뒤에는 케르만 셀주크의 카부르트가 오만 해안에 보낸 원정 같은 외부 세력에 눌려 있던 오만 내륙에서, 이바드파 공동체는 1016년 무렵 새 이맘을 세워 오만 이바드 이맘국을 다시 일으켰다. 오만 해안의 소하르는 인도양 교역으로 이름난 항구였으나 10세기 이래 외부 세력이 번갈아 차지했고, 이바드파는 내륙의 니즈와와 루스타크에서 이맘 중심의 공동체를 지켰다. 이바드파는 이슬람 초기의 분파로 수니와 시아 어느 쪽과도 다르며, 아랍 부족 구조 위에 이맘 선출이 얹힌 정치를 했다. 이맘은 부족 사이의 분쟁을 조정하고 법을 집행했고, 해안 도시의 상인과 내륙 농경민은 서로 다른 이해를 가졌다. 오만의 이바드파는 동아프리카와 인도 해안으로 나가는 상인들을 통해 바깥 세계와 이어졌고, 내륙의 아랍 부족은 관개 수로(팔라지)를 파서 대추야자와 곡식을 길렀다. 이맘 선출은 부족 사이의 합의에 달려 있어 이맘이 비어 있는 때에는 부족 지도자들이 일을 이끌었다. 이맘국의 법은 이바드파 법학을 따랐고, 쿠란과 이맘의 판결이 분쟁을 가르는 기준이었다. 이바드 이맘은 학자와 부족 지도자가 선출하는 것이 원칙이었고, 자격을 잃으면 물러나게 하는 제도였다. 이 넷째 이맘국은 니즈와와 루스타크를 중심으로 다힐리야와 자히라의 내륙 부족을 이끌었다. 1154년 무렵 아랍 부족 가문인 나브하니가 내륙의 실권을 쥐고 왕(말릭)으로 세습해 다스리면서 이맘은 의례적인 존재가 되었고, 이맘국은 1164년 무렵(1153년 뒤 이맘 기록이 없다는 설도 있음) 끊겼다. 나브하니 왕조는 이후 1624년 야루바 왕조에 자리를 내줄 때까지 이어졌다."
  subjects: [ibadi-imamate-of-oman, nabhani-dynasty]
  tags: [politics, religion]
  sources: ["John C. Wilkinson, The Imamate Tradition of Oman (Cambridge University Press, 1987)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: tughril-seljuk-1037
  year: 1037
  endYear: 1063
  title:
    ko: "투그릴 베그와 셀주크의 이란 정복: 단다나칸(1040)에서 바그다드 입성(1055)까지"
  summary:
    ko: "셀주크는 오구즈 튀르크의 한 부족 집단으로, 지도자 셀주크의 손자 투그릴 베그와 차그리 베그 형제가 가즈니 왕조와 카라한 왕조 사이의 초원에서 힘을 쌓았다. 1037년 무렵 이들은 호라산의 니샤푸르를 차지했고, 1040년 5월 단다나칸에서 가즈니의 마수드 1세에게 크게 이겨 호라산을 얻었다. 투그릴은 1040년대 라이와 지야르 왕조의 땅 쿠미스를 거쳐 서쪽으로 나아갔고, 1051년 카쿠이 왕조의 이스파한을 1년 가까운 포위 끝에 얻어 도읍을 삼았다. 1054년에는 라와드 왕조의 와흐수단이 아제르바이잔에서 항복했다. 그는 아바스 칼리프국의 칼리프 알카임의 요청으로 1055년 12월 바그다드에 들어가 부와이 왕조의 세력을 몰아냈고,  셀주크 군은 튀르크멘 유목 부족이었고, 그 가운데 일부는 정복 과정에서 아나톨리아 방향으로도 나아갔다. 1062년 파르스의 마지막 부와이 정권이 무너졌고 살라르 왕조의 마지막 땅 타롬도 같은 무렵 넘어갔다. 투그릴은 1063년 9월 아들 없이 죽었고, 조카 알프 아르슬란이 이었다. 수니 신앙의 보호자를 자처한 셀주크는 시아 성향이던 부와이와 달리 수니 질서를 회복하는 세력으로 칼리프 쪽에서 환영받았다고 본다. 이때 셀주크 제국은 호라산의 니샤푸르에서 이스파한을 거쳐 바그다드에 이르는 큰 나라가 되었다. 투그릴은 1058년 칼리프에게서 '동쪽과 서쪽의 왕'이라는 칭호를 받아 술탄을 칭했고, 같은 1058~1059년에는 튀르크 장군 바사시리가 투그릴이 이란에 나간 틈을 타 바그다드를 차지하고 파티마 칼리프의 이름으로 금요 예배를 올리게 했으나, 1059년 말 투그릴이 바그다드를 되찾았다."
  subjects: [seljuk-empire, ghaznavid-empire, buyid-dynasty, ziyarid-dynasty, kakuyid-dynasty, rawadid-dynasty, sallarid-dynasty, abbasid-caliphate]
  links:
    - { from: seljuk-empire, to: ghaznavid-empire, note: "호라산 획득, 단다나칸 전투 (1040)" }
    - { from: seljuk-empire, to: buyid-dynasty, note: "바그다드 입성과 이라크 장악 (1055)" }
  tags: [war, politics]
  sources: ["Andrew C. S. Peacock, The Great Seljuk Empire (Edinburgh University Press, 2015)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "C. E. Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)"]

- id: almoravid-maghreb-1040
  year: 1040
  endYear: 1090
  title:
    ko: "알모라비드의 흥기와 마그레브 정복(1040~1090)"
  summary:
    ko: "알모라비드 왕조는 서사하라의 산하자 베르베르 가운데 람투나 부족 연합에서 일어났다. 1040년대 구달라 부족의 족장 야히야 이븐 이브라힘이 순례에서 돌아오는 길에 이슬람 법학자 압둘라 이븐 야신을 데려와 부족에게 엄격한 말리크 법학파의 가르침을 퍼뜨리게 했고, 이븐 야신은 뒤에 람투나의 지도자 야히야 이븐 우마르의 후원을 받았다. 이븐 야신은 강가의 수도원(리바트) 같은 거점에서 추종자들을 모아 군사 공동체를 만들었다. 이 운동은 1054년 무렵 시질마사를 얻으며 사하라 교역로를 쥐었고, 1056년 마그라와 왕조의 시질마사 지배가 무너졌다. 같은 1056년 야히야 이븐 우마르가 전사하자 아부 바크르 이븐 우마르가 운동을 이끌었다. 대서양 평야의 바르가와타 연합과는 1058~1059년에 싸웠고, 이븐 야신은 그 싸움에서 죽었다. 바르가와타는 1060년 무렵 아부 바크르 이븐 우마르에게 정복되었다(그는 1060년 무렵 남쪽의 반란을 누르러 내려가며 북쪽을 유수프 이븐 타슈핀에게 맡겼고, 1087년 죽을 때까지 남쪽을 맡았다). 이어 유수프 이븐 타슈핀이 1060년대 후반 페스를 얻었고, 1070년 무렵 마라케시가 세워져 도읍이 되었다. 1070년 무렵 마그라와의 페스·타자가 알모라비드에게 넘어갔고, 1080~1081년에는 우지다와 틀렘센까지 얻어 마그라와가 끝났다. 1082년 알제와 셸리프강 쪽을 함마드 왕조에게서 빼앗았다. 유수프는 이후 안달루스로 건너갔으며, 그 일은 「알모라비드의 안달루스 지배(1086~1147)와 타이파의 부활」(뒤의 사건)에 있다. 알모라비드는 사하라를 가로지르는 교역로와 금의 흐름을 쥐는 힘을 얻었다. 이븐 야신과 아부 바크르가 이끈 초기 운동은 부족 전사들을 엄격한 규율 아래 두었고, 정복한 도시에서 법에 없는 세금을 폐지하겠다는 명분을 내세웠다. 이 때문에 많은 도시민이 지지했다고도, 반대한 부족은 무력으로 눌렸다고도 전한다. 알모라비드라는 이름은 '리바트'(수도원 겸 요새)에서 나온 '무라비툰'에서 왔다고 설명한다."
  subjects: [almoravids, barghawata-confederacy, maghrawa-dynasty, hammadid-dynasty]
  tags: [war, politics, religion]
  sources: ["Amira K. Bennison, The Almoravid and Almohad Empires (Edinburgh University Press, 2016)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)"]

- id: kirman-seljuk-1041
  year: 1041
  endYear: 1187
  title:
    ko: "케르만 셀주크 술탄국(1041~1187)"
  summary:
    ko: "케르만 셀주크 술탄국은 셀주크 제국의 지방 정권으로, 투그릴 베그의 조카 카부르트가 케르만을 차지하면서 시작되었다. 카부르트는 1041년 무렵부터 부와이 왕조의 케르만을 공략해 1040년대 후반에 케르만 전체를 장악했고, 오만 해안에도 원정군을 보냈다. 그는 1072년 알프 아르슬란이 죽은 뒤 조카 말리크샤와 술탄 자리를 다투다가 1073년 패해 처형되었다. 그러나 후손들은 케르만을 이어 다스렸다. 말리크샤가 1092년 죽고 제국이 갈라지는 동안에도 케르만 셀주크는 바르다시르와 시르잔을 중심으로 대셀주크 술탄에게 이름뿐인 신하의 예를 바치며 독자적으로 이어졌다. 1186/87년 무렵 오구즈 튀르크멘의 말리크 디나르가 케르만을 차지해 케르만 셀주크가 끝났다. 케르만은 이후에도 호라즘과 몽골 시기를 거치며 독자 정권이 서는 땅이었다. 카부르트의 아들들(케르만샤·술탄샤·후세인 오마르)을 거쳐 투란샤 1세(재위 1084년 무렵~1096년 무렵)와 이란샤(재위 1096년 무렵~1101)가 이었고, 아르슬란샤 1세(재위 1101~1142), 무함마드 1세(재위 1142~1156), 투그릴샤(재위 1156~1169 무렵)를 거쳐 바람샤(재위 1169~1174 무렵), 아르슬란샤 2세(재위 1174~1176 무렵), 투란샤 2세(재위 1176~1183 무렵)가 이었다. 마지막 술탄은 무함마드 2세(재위 1183~1187 무렵)였다. 케르만은 사막과 산지 사이의 오아시스 도시를 이은 땅으로, 이란 고원과 페르시아만을 잇는 길목이었다. 케르만 셀주크는 대셀주크 술탄국과 달리 오래 한 왕조가 이어졌고, 12세기 중엽까지 케르만 도시들의 상업과 건축을 후원했다. 케르만 지방은 인도양 쪽 해안과 이란 고원을 잇는 대상 길을 쥐고 있어 호르무즈로 가는 물자가 이 땅을 지나갔다. 이 왕조는 대셀주크의 한 갈래로서 이란 남동부의 사막 길을 안정시킨 것으로 평가된다."
  subjects: [kirman-seljuk-sultanate, seljuk-empire]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)"]

- id: sulayhid-yemen-1047
  year: 1047
  endYear: 1138
  title:
    ko: "술라이흐 왕조와 아르와 여왕: 예멘의 이스마일파 정권(1047~1138)"
  summary:
    ko: "예멘 고지의 하라즈 산지 출신 법학자 알리 이븐 무함마드 알술라이히는 1046년 이스마일파로 개종해 파티마 칼리프국의 칼리프를 따르는 선교(다와)의 지도자가 되었고, 1047년 무장 병력을 모아 술라이흐 왕조를 열었다. 1060년 무렵 티하마의 나자흐 왕조 군주가 독살되자 자비드를 얻었고, 1062년 예멘을 평정하고 히자즈로 올라갔으며, 1063년 사나를 도읍으로 삼았다. 파티마의 이름으로 금요 예배를 올렸고, 파티마 칼리프는 술라이흐를 예멘의 대리로 인정했다. 알리는 순례길에서 나자흐의 사이드에게 피살되었고(1067년설, 1081년설도 있음), 아들 아흐마드 알무카람이 그 뒤를 이었다. 아흐마드가 병들자 아내 아르와가 1086년 국정을 넘겨받았고, 1087년 무렵 도읍을 산악 도시 지블라로 옮겼다. 1083년 아덴 쪽은 주라이 왕조가 술라이흐의 신하로서 이어받았고, 1089년 티하마는 나자흐가 되찾았다. 11세기 말 사나 둘레에서 함단 가문이 자립해 사나 함단 술탄국이 섰다(1098/1099년). 아르와는 파티마 칼리프가 예멘 이스마일파의 최고 지도자로 인정한 여성 통치자였다. 1138년 아르와가 죽자 술라이흐 왕조도 끝났고, 예멘 이스마일파는 뒤에 인도의 보흐라 공동체로 이어졌다. 북쪽 사다의 자이드파 이맘국은 술라이흐와 같은 시아이면서도 교리가 달라 서로 맞서 있었다. 술라이흐의 통치는 예멘 고지의 부족 사회와 해안 도시들을 한데 묶은 드문 시기였고, 아르와는 학문을 후원하고 도로와 요새를 정비했다고 전해진다. 이스마일파는 예멘 고지의 부족민 사이에서 수니 다수와 자이드파 사이의 소수 신앙으로 퍼졌고, 술라이흐 시기에 만들어진 선교 조직이 이후 인도의 이스마일파 공동체와 이어졌다."
  subjects: [sulayhid-dynasty, najahid-dynasty, zurayid-dynasty, hamdanid-sultanate-of-sanaa, fatimid-caliphate, zaydi-imamate]
  tags: [politics, religion]
  sources: ["Delia Cortese·Simonetta Calderini, Women and the Fatimids in the World of Islam (Edinburgh University Press, 2006)", "ʿUmāra al-Yamanī, Taʾrīkh al-Yaman (영역: Yaman, Its Early Mediaeval History, Henry Cassels Kay 옮김, Edward Arnold, 1892)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)"]

- id: banu-hilal-1048
  year: 1048
  endYear: 1090
  title:
    ko: "지리 왕조의 파티마 이탈과 바누 힐랄의 이주(1048~1090)"
  summary:
    ko: "지리 왕조의 알무이즈 이븐 바디스(재위 1016~1062)는 1048년 무렵 파티마와 결별하고 수니 법학파와 아바스 칼리프의 이름으로 금요 예배를 올렸다. 카이로의 파티마 칼리프국은 군사 개입 대신 이집트에 머물던 바누 힐랄과 바누 술라임 같은 아랍 유목 부족이 서쪽으로 이동하도록 허용하거나 부추겼다고 전한다. 바누 술라임은 먼저 키레나이카에 자리 잡았고, 지리 군은 1052년 하이다란에서 힐랄 부족에게 크게 졌다. 알무이즈는 1057년 무렵 카이라완을 버리고 해안 도시 마흐디야로 옮겨 갔고, 카이라완은 약탈로 쇠퇴했다. 이븐 할둔은 이를 '메뚜기 떼'라는 비유로 말했으나 오늘날 학자들은 이주의 파괴 정도와 규모를 과장으로 보기도 한다. 이후 이 땅에는 아랍어와 유목 생활이 널리 퍼졌고, 베르베르 지역의 아랍화가 빨라졌다. 지리 왕조는 알무이즈의 아들 타밈(재위 1062~1108)이 이었다. 함마드 왕조는 알나시르(재위 1062~1088) 때 콘스탄틴 쪽으로 땅을 넓혔으나, 1090년 무렵 남쪽 땅(호드나 일대)을 힐랄 부족에게 내주고 도읍을 칼아 베니 함마드에서 해안의 베자이아로 옮겨 갔다. 침입 뒤 카이라완의 수공업과 학문은 마흐디야와 시칠리아, 안달루스로 옮겨 갔고, 농촌에서는 유목민의 방목지가 넓어졌다. 근래 연구는 사료가 이주를 정치적으로 과장했다고 보며, 이주가 수십 년에 걸쳐 여러 부족이 느리게 퍼진 과정이었다고 본다. 지리 왕조가 마흐디야에서 해상 교역과 함대를 키우는 동안 내륙은 아랍 부족이 갈라 가졌고, 시칠리아의 노르만이 이 틈을 노리게 되었다. 이 일은 이프리키야의 정치 중심이 내륙 카이라완에서 해안으로 옮겨 가는 전환점이었다."
  subjects: [zirid-dynasty, hammadid-dynasty, fatimid-caliphate]
  tags: [politics, war, society]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Hady Roger Idris, La Berbérie orientale sous les Zīrīdes, Xe–XIIe siècles (Adrien-Maisonneuve, 1962)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Ibn Khaldūn, Histoire des Berbères et des dynasties musulmanes de l'Afrique septentrionale (Baron de Slane 옮김, Paul Geuthner, 1925~1956)"]

- id: alp-arslan-1063
  year: 1063
  endYear: 1092
  title:
    ko: "알프 아르슬란과 말리크샤: 니잠 알물크의 셀주크 제국(1063~1092)"
  summary:
    ko: "셀주크 제국은 알프 아르슬란(재위 1063~1072)이 술탄이 된 뒤 동쪽의 호라산에서 서쪽의 이라크와 시리아 변경까지 이어지는 제국으로 자랐다. 만지케르트에서 동로마 제국 황제를 이긴 일은 「알프 아르슬란과 만지케르트(1071): 셀주크의 아나톨리아 진출과 다니슈멘드」(뒤의 사건)에 있다. 이 시기 실무를 맡은 재상은 페르시아 출신 니잠 알물크(재상 1064~1092)였다. 그는 1065년 바그다드에 니자미야 마드라사를 세우기 시작해 수니 법학자와 관리를 길렀고, 이슬람 학문의 후원을 정책으로 삼았다. 신학자 알가잘리가 1091년 바그다드 니자미야에서 가르친 것도 이 제도 안의 일이었다. 말리크샤(재위 1072~1092) 때 셀주크는 이스파한을 도읍으로 삼아 가장 번성했고, 이스파한 관측소에서 오마르 하이얌 등 학자들이 일하며 1079년 무렵 잘랄리 달력을 만들었다고 전한다. 셀주크 군은 튀르크 군인에게 토지의 세금 수입을 나누어 주는 이크타 제도로 유지되었다. 니잠 알물크는 1092년 10월 암살되었는데, 전승은 니자르 이스마일파의 자객이 한 일이라고 한다. 말리크샤도 같은 해 11월 죽었고, 제국은 곧 갈라지기 시작했다. 아바스 칼리프국의 칼리프 알무크타디(재위 1075~1094)는 말리크샤의 딸을 아내로 맞았고, 말리크샤가 한때 칼리프를 바그다드에서 물러나게 하려 했다는 이야기도 전한다. 이 제국의 행정은 페르시아어 문서와 관리가, 군사는 튀르크 군인과 유목민이 맡아 둘이 나뉘어 있었다. 니잠 알물크의 『통치술』(시야사트나마)은 왕이 신하와 첩자를 어떻게 부릴지 논한 책으로 이 시기 국가 운영의 이상을 보여 준다."
  subjects: [seljuk-empire, abbasid-caliphate, byzantine-empire]
  tags: [politics, culture]
  sources: ["Andrew C. S. Peacock, The Great Seljuk Empire (Edinburgh University Press, 2015)", "Carla L. Klausner, The Seljuk Vezirate: A Study of Civil Administration, 1055–1194 (Harvard University Press, 1973)", "Nizam al-Mulk, Siyāsatnāma (영역: The Book of Government or Rules for Kings, Hubert Darke 옮김, Routledge & Kegan Paul, 1960)"]

- id: fatimid-crisis-1065
  year: 1065
  endYear: 1094
  title:
    ko: "파티마의 위기와 바드르 알자말리, 알무스탄시르의 죽음과 니자르·무스탈리 분열(1065~1094)"
  summary:
    ko: "파티마 칼리프국의 칼리프 알무스탄시르(재위 1036~1094)는 60년 가까이 다스린 이슬람 세계에서 가장 긴 재위의 칼리프였다. 1065년부터 7년 가까이 나일 강의 수위가 낮아 기근이 들었고(알무스탄시르의 대기근), 튀르크계 군인과 수단계·베르베르계 군인이 서로 싸우면서 카이로와 푸스타트가 약탈되었다. 후대 사료는 궁정이 보물을 내다 팔아 급료를 댔고 도시 주민이 극심한 굶주림을 겪었다고 전한다. 1060년대부터 칼리프는 사실상 군벌의 손에 있었다. 1073년 무렵 칼리프는 아크레 총독이던 아르메니아 출신 장군 바드르 알자말리를 불러들였고, 바드르는 아르메니아 병사를 이끌고 들어와 1074년 재상 겸 총사령관(아미르 알주유시)이 되어 질서를 되찾았다. 이후 재상직은 군벌 출신이 쥐었다. 같은 시기 시리아에서는 투르크멘 장수 아트시즈가 1071~1073년 팔레스타인을 차지하고 1076년 다마스쿠스를 얻었으며, 이는 시리아 셀주크 왕조가 서는 바탕이 되었고, 그 왕조를 연 투투시는 셀주크 술탄 말리크샤의 동생이었다. 바드르는 해안 도시들을 되찾았고 1094년 죽었다. 알무스탄시르가 1094년 12월 죽자 바드르의 아들 알아프달이 어린 막내 알무스탈리를 세웠고, 장자 니자르를 따르던 이들은 이를 인정하지 않았다. 이로써 이스마일파는 니자르파와 무스탈리파로 갈라졌다. 알아프달은 이집트의 실권을 쥐었고, 이후 칼리프는 재상의 그늘에서 이어졌다. 바드르의 개혁 뒤 파티마의 재정은 안정되었으나 칼리프는 점차 상징이 되었고, 재상직은 군벌이 이어받았다. 이 위기 속에서 이집트에서는 군인 지배가 굳어졌고, 아르메니아 출신 군인과 관리, 콥트 교회 신자 관료가 눈에 띄게 쓰였다."
  subjects: [fatimid-caliphate, seljuks-of-syria, seljuk-empire]
  tags: [politics, religion, society]
  sources: ["Michael Brett, The Fatimid Empire (Edinburgh University Press, 2017)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)"]

- id: syria-seljuks-1071
  year: 1071
  endYear: 1118
  title:
    ko: "셀주크의 시리아 진출과 시리아 셀주크 왕조, 시리아의 소왕조들(1071~1118)"
  summary:
    ko: "투르크멘 장수 아트시즈 이븐 우박은 처음 파티마 쪽에서 싸우다 보수 다툼으로 돌아서 1071~1073년 팔레스타인과 예루살렘을 차지했고 1076년 다마스쿠스를 얻었다. 그는 1077년 예루살렘의 반란을 누르면서 안전을 약속하고도 알아크사 모스크로 피신한 이들을 포함해 주민 약 3,000명을 죽였다고 전하며, 같은 해 이집트 원정에 실패했고 1079년 말리크샤의 동생 투투시에게 죽었다. 투투시는 시리아 셀주크 왕조를 세웠고 1086년 알레포를 얻었다. 미르다스 왕조가 끝난 알레포(1080)를 차지한 우카일 왕조의 무슬림 이븐 쿠라이시는 1085년 쉴레이만 이븐 쿠탈미시에게 죽었고, 이듬해 투투시가 쉴레이만을 물리치고 알레포를 얻었다. 투투시가 1095년 죽자 아들 리드완이 알레포를, 두카크가 다마스쿠스를 맡아 서로 싸웠다. 이 틈에 1097~1099년 제1차 십자군이 시리아와 팔레스타인에 들어왔고, 파티마 칼리프국이 1098년 되찾은 예루살렘이 1099년 십자군에게 넘어가 예루살렘 왕국이 섰다(「제1차 십자군: 클레르몽(1095)에서 예루살렘 함락(1099)까지」(뒤의 사건)). 두카크가 1104년 죽자 동생 이르타시가 잠깐 이은 뒤 아타베그 투그테긴이 다마스쿠스를 쥐고 부리 왕조를 열었다. 1101년 아르투크 왕조의 쇼크멘이 히슨 카이파에서 일어났고, 이 가문은 이후 자지라 북부와 알레포를 다스리게 된다. 리드완이 1113년 죽은 뒤 아들 알프 아르슬란 알아크라스와 술탄샤를 거쳐 알레포는 1118년 아르투크의 일가지에게 넘어갔다. 이 분열 때문에 시리아의 무슬림은 십자군에 맞서 협력하기 어려웠다. 십자군 국가와 무슬림 쪽의 싸움은 뒤의 「에데사 백국과 안티오크 공국(1098~1150): 십자군 국가와 에데사의 함락(1144)」(뒤의 사건)에도 있다. 시리아의 도시 주민은 투르크멘 군대의 약탈과 세금에 시달렸다."
  subjects: [seljuks-of-syria, seljuk-empire, uqaylid-dynasty, mirdasid-dynasty, fatimid-caliphate, artuqid-dynasty, burid-dynasty, jerusalem-kingdom]
  tags: [war, politics]
  sources: ["Carole Hillenbrand, The Crusades: Islamic Perspectives (Edinburgh University Press, 1999)", "Ibn al-Qalānisī, Dhayl taʾrīkh Dimashq (영역: The Damascus Chronicle of the Crusades, H. A. R. Gibb 옮김, Luzac, 1932)", "Steven Runciman, A History of the Crusades, vol. 1: The First Crusade and the Foundation of the Kingdom of Jerusalem (Cambridge University Press, 1951)"]

- id: uyunid-arabia-1077
  year: 1077
  endYear: 1253
  title:
    ko: "동아라비아의 우윤 왕조와 우스푸르 왕조(1077~1253)"
  summary:
    ko: "카르마트 국가를 무너뜨린 압둘라 이븐 알리 알우윤은 1076~1077년 무렵 우윤 왕조를 세우고 알하사 오아시스와 카티프 해안을 다스렸다. 이 땅의 경제는 알하사 오아시스의 샘물을 끌어 쓰는 대추야자 농사와 걸프 해안의 진주잡이, 인도양 교역에 기댔고, 우윤의 영향은 카티프와 바레인 지방(걸프 서안)에 걸쳤다. 이 땅은 걸프 항구와 내륙 오아시스를 잇는 길목이라 이라크의 칼리프 정권과 이란의 셀주크 모두에게 값진 땅이었다. 압둘라가 셀주크의 도움을 받은 것은 말리크샤의 권위가 걸프에까지 닿던 때였고, 셀주크가 약해지자 우윤은 사실상 자립한 정권으로 이어졌다. 군주들은 부족 지도자의 자격으로 알하사 오아시스의 물 사용과 마을 사이의 분쟁을 조정했고, 해안의 카티프는 진주 상인과 선원이 모이는 항구였다. 걸프 건너 이란 해안과 오만 쪽 상인 사이의 교역에서 걷는 세금이 정권의 주요 수입이었다고 본다. 알하사의 대추야자는 이라크와 걸프 항구로 실려 나가 곡물과 바뀌었고, 걸프의 진주는 이라크와 인도까지 팔렸다. 왕조 말기에는 내분이 이어지고 유목 부족과 해안 정권의 압력이 겹쳐 힘이 약해졌다. 우윤은 셀주크와 아바스 칼리프에게 이름뿐인 신하로서 예를 갖추면서 이 지역의 대추야자와 해안 교역을 쥐었다. 이 시기 알하사와 카티프 주민 사이에 열두 이맘파 시아가 퍼졌다고 보는 설명이 있으며, 우윤 정권 자체의 종파는 사료마다 갈린다. 1253년 무렵 아랍 우카일 부족의 우스푸르 가문이 실권을 쥐면서 우윤 왕조가 끝나고 우스푸르 왕조가 이어졌다. 우스푸르 왕조는 14세기 초까지 알하사와 카티프를 다스렸고, 바레인섬을 놓고 호르무즈와 다투었다."
  subjects: [uyunid-dynasty, usfurid-dynasty]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2009)"]

- id: khwarazm-rise-1077
  year: 1077
  endYear: 1200
  title:
    ko: "호라즘샤 왕조의 성장: 아누슈티긴에서 테키시까지(1077~1200)"
  summary:
    ko: "호라즘은 아랄해로 흐르는 아무다리야 하류의 오아시스 지대로, 셀주크 술탄 말리크샤의 튀르크계 노예 출신 아누슈티긴 가르차이가 1077년 무렵 총독으로 임명되며 호라즘샤 왕조가 시작되었다. 그의 아들 쿠틉 앗딘 무함마드(재위 1097~1127)가 처음 '호라즘샤'를 칭했고, 셀주크 대술탄 산자르에게 신하의 예를 바쳤다. 아들 아트시즈(재위 1127~1156)는 산자르에게 대들어 1138년 산자르의 침공을 받았다. 아트시즈는 1141년 산자르가 카트완 전투에서 카라 키타이에게 지자 카라 키타이에 신하의 예를 바치며 자립의 틈을 얻었다(「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」, 뒤의 사건). 일 아르슬란(재위 1156~1172)에 이어 테키시(재위 1172~1200)는 이복형제 술탄샤와 1172년부터 1193년까지 맞서며 힘을 키웠고, 호라즘을 아바스 칼리프와 이라크 셀주크의 틈에서 크게 키웠다. 테키시는 1194년 라이 가까이에서 이라크 셀주크의 마지막 술탄 투그릴 3세를 물리쳐 이란 서부를 얻었고, 아바스 칼리프 알나시르에게서 이란 서부 지배를 인정받았다. 1190년대 후반에서 1200년 무렵에는 호라산도 손에 넣어 호라즘은 이란과 중앙아시아에 걸치는 큰 나라가 되었다. 이 성장은 셀주크 제국이 흩어진 뒤의 힘의 공백을 호라즘이 메운 결과였다. 이 나라의 군대는 튀르크계 군인과 캉글리 부족 같은 초원 부족에 기댔고, 이는 훗날 몽골 침입 때 약점이 되었다. 호라즘 제국이라 부르는 이 나라는 아랄해 남쪽 오아시스 도시 구르간지를 도읍으로 삼았고, 관개 농업과 대상 무역으로 부를 쌓았다. 산자르 아래에서 호라즘샤는 셀주크 제국의 신하로서 세금을 바치고 군대를 보냈지만 점차 독립 정권으로 자랐다."
  subjects: [khwarazmian-empire, seljuk-empire]
  tags: [politics, war]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Ibn al-Athīr, al-Kāmil fī l-taʾrīkh (영역: The Annals of the Saljuq Turks, D. S. Richards 옮김, RoutledgeCurzon, 2002)"]

- id: alamut-1090
  year: 1090
  endYear: 1124
  title:
    ko: "니자르 이스마일파와 알라무트 성채(1090~1124)"
  summary:
    ko: "하산 이 사바흐는 이란 중부 출신으로 이스마일파에 들어가 1078년 무렵 카이로를 찾았다고 전한다. 그는 1090년(1091년설도 있음) 카스피해 남쪽 엘부르즈 산맥의 알라무트 성채를 지략으로 차지했고, 이 성채를 시작으로 이란 곳곳의 산성들을 모아 니자르 이스마일파의 국가를 세웠다. 1094년 파티마 칼리프국의 칼리프 알무스탄시르가 죽고 니자르와 무스탈리가 갈라서자 하산은 니자르를 따랐다. 산성 공동체는 셀주크 제국의 대군에 맞서는 대신 요인 암살(피다이)을 정치 수단으로 삼았다고 전해지며, 1092년 니잠 알물크의 암살도 이 조직이 한 일로 전승에서 말한다. 이 소문이 십자군 시대 유럽에서 '암살자'(아사신) 전설로 퍼졌고, 이슬람 쪽 비난과 풍자가 얽혀 있어 사실과 전설을 가려 읽어야 한다. 니자르파는 시리아에서도 1100년대 초부터 산성을 얻었다. 카스피해 남쪽에서 지야르 왕조의 마지막 군주 길란샤가 1090년 죽은 뒤 그 땅 일부가 이스마일파의 영향권으로 넘어갔다고 전한다. 같은 무렵 마잔다란 산지에서는 바반드 왕조의 이스파바디야 계통이 셀주크의 신하로 이어지고 있었다. 하산 이 사바흐는 1124년 알라무트에서 죽었다. 알라무트의 마지막은 「훌라구의 서정과 바그다드 함락(1256~1258)」(뒤의 사건)에 있다. 니자르파의 교리는 이맘의 가르침에 따른 비밀 해석을 강조했고, 알라무트에는 서고가 있었다고 전한다. 셀주크 쪽은 이스마일파로 의심받는 이들을 탄압하고 그들의 산성을 거듭 포위했고, 이 과정에서 니자르파로 몰린 주민이 죽거나 쫓겨나기도 했다. 이들을 직접 기록한 사료는 대부분 적대 세력이 쓴 것이라 조직의 실제 모습을 알기 어렵다. 하산의 후계자들은 알라무트를 중심으로 이란과 시리아의 산성 수십 곳을 이었다."
  subjects: [ziyarid-dynasty, bavandid-dynasty, seljuk-empire, fatimid-caliphate]
  tags: [religion, politics]
  sources: ["Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "Marshall G. S. Hodgson, The Order of Assassins: The Struggle of the Early Nizârî Ismâʿîlîs against the Islamic World (Mouton, 1955)", "Peter Willey, Eagle's Nest: Ismaili Castles in Iran and Syria (I. B. Tauris, 2005)"]

- id: seljuk-split-1092
  year: 1092
  endYear: 1152
  title:
    ko: "말리크샤 이후 셀주크 제국의 분열과 아타베그 정권(1092~1152)"
  summary:
    ko: "셀주크 제국의 술탄 말리크샤가 1092년 죽자 아들 바르키야루크(재위 1092~1105)와 동생 투투시가 술탄 자리를 놓고 싸웠고, 바르키야루크가 죽은 뒤에는 어린 아들 말리크샤 2세를 거쳐 무함마드 타파르(재위 1105~1118)가 술탄이 되었다. 1095년 투투시가 죽은 뒤 시리아는 아들들이 갈라 가졌고, 모술은 1096년 셀주크 장수 케르보가에게 넘어가 우카일 왕조가 끝났다. 케르보가는 1098년 안티오크를 구하러 가서 십자군에게 졌다. 1115년 무렵 로레스탄 산지에서는 하자라스프 왕조의 터가 닦였고, 1117년 무렵 셀주크 아래에 남아 있던 쿠르드 안나즈 왕조의 마지막 영지도 사라졌다. 무함마드 타파르가 1118년 죽자 아들 마흐무드 2세(재위 1118~1131)가 이란 서부와 이라크의 술탄이 되었고(이라크 셀주크 술탄국), 호라산의 산자르(1097년부터 총독, 1118~1157 대술탄)가 동방을 맡아 제국이 두 갈래가 되었다. 이라크 셀주크의 술탄들은 어린 왕자를 맡은 튀르크계 군인 후견인 곧 아타베그에게 의존했다. 1136년 엘디구즈 왕조를 연 엘디구즈가 아제르바이잔에서 아타베그가 되었고, 1148년 무렵 파르스에서 살구르 가문(살구르 왕조)이, 로레스탄에서 하자라스프가 사실상 독립 정권으로 섰다. 마흐무드 2세가 1131년 죽은 뒤 아들 다우드와 동생 투그릴 2세를 거쳐 동생 마수드(재위 1134년 무렵~1152)가 술탄일 때 아바스 칼리프국의 칼리프 알무크타피가 군대를 길러 바그다드에서 되살아났고, 1152년 마수드가 죽자 이라크 중부를 칼리프가 되찾았다. 시리아 북부와 자지라에서는 아르투크 왕조의 가문들이 도시를 나누어 다스렸다. 한편 1127년 장기가 모술의 아타베그가 되어 시리아 쪽으로 나아갔다(「이마드 앗딘 장기와 누르 앗딘: 시리아 무슬림 세력의 결집(1127~1154)」, 뒤의 사건)."
  subjects: [seljuk-empire, iraq-seljuk-sultanate, hazaraspid-dynasty, uqaylid-dynasty, annazid-dynasty, eldiguzid-dynasty, salghurid-dynasty, abbasid-caliphate, artuqid-dynasty]
  tags: [politics, war]
  sources: ["Andrew C. S. Peacock, The Great Seljuk Empire (Edinburgh University Press, 2015)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: jerusalem-tripoli-1099
  year: 1099
  endYear: 1153
  title:
    ko: "예루살렘 왕국과 트리폴리 백국: 해안의 십자군 국가(1099~1153)"
  summary:
    ko: "1099년 7월 예루살렘을 차지한 십자군은 고드프루아를 '성묘의 수호자'로 세웠고, 그가 1100년 죽자 동생 보두앵 1세가 에데사에서 와서 예루살렘 왕이 되어 예루살렘 왕국의 틀을 세웠다. 십자군의 진군은 「제1차 십자군: 클레르몽(1095)에서 예루살렘 함락(1099)까지」(앞의 사건)에 있고, 에데사와 안티오크는 「에데사 백국과 안티오크 공국(1098~1150): 십자군 국가와 에데사의 함락(1144)」(앞의 사건)에 있다. 툴루즈의 레몽 4세는 1102년 트리폴리 곁 언덕(필그림 산)에 요새를 쌓기 시작해 트리폴리 백국의 터를 놓았고, 1109년 후계자 베르트랑이 제노바 함대의 도움으로 트리폴리를 얻었다. 보두앵 1세는 1104년 아크레를, 1110년 베이루트와 시돈을 차지했고, 1118년 이집트 원정 길에서 죽을 때까지 왕국의 영토를 요르단 건너까지 넓혔다. 보두앵 2세(재위 1118~1131)와 풀크(재위 1131~1143) 때 1124년 티레를 얻었고 1153년 보두앵 3세가 파티마 칼리프국의 아스칼론을 8개월 포위한 끝에 차지해 왕국이 이집트 쪽 해안까지 닿았다. 이 팽창은 시리아 무슬림 세력이 갈려 있었기 때문에 가능했다. 다마스쿠스의 부리 왕조는 때로 프랑크와 손잡고 알레포·모술과 맞섰고, 아르투크 왕조의 일가지는 1119년 안티오크 군을 꺾었다. 점령당한 도시의 무슬림과 유대인은 학살되거나 쫓겨났고, 농촌 무슬림 주민은 농노처럼 프랑크 영주 아래에 남은 경우가 많았다. 해안 도시에서는 파티마 수비대와 주민이 오래 버텼고, 티레는 1111~1112년 보두앵 1세의 포위를 막아 냈다가 1124년 오랜 포위 끝에 항복 조건에 따라 원하는 주민이 도시를 떠날 수 있었다. 파티마의 쇠퇴 속에 이집트는 프랑크 왕국의 이웃이 되었다."
  subjects: [jerusalem-kingdom, tripoli-county, fatimid-caliphate, burid-dynasty, artuqid-dynasty]
  tags: [war, politics]
  sources: ["Carole Hillenbrand, The Crusades: Islamic Perspectives (Edinburgh University Press, 1999)", "Steven Runciman, A History of the Crusades, vol. 2: The Kingdom of Jerusalem and the Frankish East, 1100–1187 (Cambridge University Press, 1952)", "Ibn al-Qalānisī, Dhayl taʾrīkh Dimashq (영역: The Damascus Chronicle of the Crusades, H. A. R. Gibb 옮김, Luzac, 1932)"]

- id: almohad-maghreb-1120
  year: 1120
  endYear: 1160
  title:
    ko: "알모하드의 마그레브 통일과 노르만의 이프리키야 해안 점령(1120~1160)"
  summary:
    ko: "알모하드 칼리프국의 뿌리는 아틀라스의 마스무다 베르베르 사이에서 일어난 운동이다. 이븐 투마르트는 동방에서 공부한 뒤 1117년 무렵 마그레브로 돌아와 알모라비드 왕조의 법학자들을 신인동형론이라 비판했고, 1121년 무렵 스스로 '마흐디'(바른 길로 이끄는 이)임을 선언했다. 그는 1124~1125년 틴말에 거점을 세우고 마스무다 부족들을 '신의 유일성을 믿는 이들'(알무와히둔)로 묶어 군사 공동체를 만들었다. 이븐 투마르트가 1130년 무렵 죽은 뒤 제자 압드 알무민이 한동안 그 죽음을 감추다가 1133년 지도자 자리를 이어받았고, 틀렘센 근처 출신의 그는 제나타 계통 베르베르였다. 압드 알무민은 1145~1146년 틀렘센과 페스를 얻고 1147년 마라케시를 차지해 알모라비드를 대체한 뒤, 칼리프에 해당하는 칭호 '아미르 알무미닌'을 썼다. 알모하드는 1147년 이후 이베리아 반도로도 건너갔고, 그 일은 「알모하드와 제2차 타이파의 끝(1172), 알라르코스(1195)」(뒤의 사건)에 있다. 한편 시칠리아 왕국의 로제르 2세는 1146년 트리폴리를 차지해 하즈룬 왕조를 끝냈고, 1148년 마흐디야를 차지해 지리 왕조가 끝났다(「시칠리아 왕국: 로제르 2세의 대관(1130)에서 하인리히 6세의 정복(1194)까지」, 뒤의 사건). 압드 알무민은 1152년 알제 서쪽을 차지하고 베자이아에서 함마드 왕조의 마지막 군주 야히야의 항복을 받아 함마드 왕조를 끝냈다. 1152년 세티프에서 아랍 부족을 물리쳤고 그 부족 일부를 모로코로 옮겨 정착시켰다고 전한다. 1159~1160년 튀니스와 마흐디야를 차지해 노르만을 몰아냈다. 이로써 알모하드는 트리폴리타니아 서쪽 마그레브 전체를 하나로 묶는 제국이 되었다."
  subjects: [almohads, almoravids, zirid-dynasty, hammadid-dynasty, khazrunid-dynasty, sicily-kingdom]
  links:
    - { from: almohads, to: almoravids, note: "마라케시 정복 (1147)" }
    - { from: sicily-kingdom, to: zirid-dynasty, note: "마흐디야 점령 (1148)" }
    - { from: almohads, to: hammadid-dynasty, note: "베자이아 정복 (1152)" }
  tags: [war, politics, religion]
  sources: ["Amira K. Bennison, The Almoravid and Almohad Empires (Edinburgh University Press, 2016)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)"]

- id: zengi-nur-1127
  year: 1127
  endYear: 1154
  title:
    ko: "이마드 앗딘 장기와 누르 앗딘: 시리아 무슬림 세력의 결집(1127~1154)"
  summary:
    ko: "이마드 앗딘 장기는 튀르크계 군인 출신으로 셀주크 술탄에게서 1127년 모술의 아타베그에 임명되어 장기 왕조를 열었다. 그는 1128년 알레포를 얻어 자지라 북부와 시리아 북부를 하나로 묶었고, 1130년 하마를, 1138년 홈스(아내 주무르드의 지참금으로)를 차지했다. 아르투크 왕조의 지방 가문을 눌렀고 다마스쿠스의 부리 왕조는 여러 차례 공격했으나(1135·1139·1140·1145년) 끝내 얻지 못한 채 시리아의 무슬림 세력을 모았고, 1144년 12월 에데사 백국의 도읍 에데사를 함락했다(「에데사 백국과 안티오크 공국(1098~1150): 십자군 국가와 에데사의 함락(1144)」, 앞의 사건). 장기는 1146년 부하에게 암살되었다. 아들 누르 앗딘 마흐무드(재위 1146~1174)는 알레포를 도읍으로 삼았고 제2차 십자군이 1148년 다마스쿠스를 포위하자 구원하러 움직였으며(「제2차 십자군(1147~1149)과 '사제왕 요한' 소식」, 뒤의 사건), 1154년 4월 다마스쿠스를 차지해 부리 왕조를 끝냈다. 누르 앗딘은 십자군에 맞선 성전(지하드) 이념을 내세워 마드라사를 세우고 수니 정통의 부흥을 후원했다. 그가 다마스쿠스와 알레포를 하나로 묶은 시리아는 예루살렘 왕국과 맞서는 큰 세력이 되었고, 모술의 장기 계통은 형제 가문으로 따로 이어졌다. 이 과정은 예루살렘 왕국의 팽창과 맞물렸고 1153년 아스칼론은 프랑크가 차지했다. 장기의 군대는 튀르크 군인과 쿠르드·투르크멘 기병으로 이루어졌고, 아타베그 정권은 어린 군주의 후견인이라는 틀 위에서 영토를 모았다. 이 정권은 알레포와 모술의 상업 도시들을 함께 쥐면서 재정을 마련했다. 누르 앗딘은 1154년 뒤 이집트로 눈을 돌려 시르쿠를 보내게 된다(「아스칼론 함락(1153)에서 파티마 칼리프국의 끝(1171)까지」, 뒤의 사건)."
  subjects: [zengid-dynasty, burid-dynasty, jerusalem-kingdom, artuqid-dynasty]
  links:
    - { from: zengid-dynasty, to: burid-dynasty, note: "다마스쿠스 점령 (1154)" }
  tags: [war, politics]
  sources: ["Carole Hillenbrand, The Crusades: Islamic Perspectives (Edinburgh University Press, 1999)", "Nikita Elisséeff, Nūr ad-Dīn: un grand prince musulman de Syrie au temps des croisades (Institut français de Damas, 1967)", "Ibn al-Athīr, al-Kāmil fī l-taʾrīkh (영역: The Chronicle of Ibn al-Athīr for the Crusading Period, D. S. Richards 옮김, Ashgate, 2006~2008)"]

- id: katwan-ghur-1141
  year: 1141
  endYear: 1186
  title:
    ko: "카트완 전투(1141)와 가즈니 왕조의 끝(1186)"
  summary:
    ko: "1141년 9월 9일 사마르칸트 북쪽 카트완 초원에서 셀주크 제국의 술탄 산자르는 카라 키타이의 구르칸 예뤼 다스(야율대석)가 이끄는 군대에게 크게 졌다. 산자르는 트란스옥시아나를 잃었고, 이 싸움에서 야즈드의 카쿠이 가문의 가르샤습 2세가 전사해 카쿠이 왕조도 끝났다. 호라즘 제국의 군주 호라즘샤 아트시즈는 이 틈에 호라산의 메르브·니샤푸르 등을 차지했으나 1142년 산자르에게 쫓겨났고, 카라 키타이에도 조공을 바쳤다(1143년 산자르에게 다시 복속). 산자르는 1153년 오구즈 튀르크멘에게 붙잡혀 3년 갇혔다 풀려났고 1157년 죽었으며, 그 뒤 대셀주크는 호라산에서 흩어졌다. 서쪽의 이란 고원 셀주크는 이라크 셀주크 술탄국이 이었고, 동쪽 호라산은 호라즘이 파고들었다. 한편 아프가니스탄의 구르 산지에서는 구르 왕조가 일어나 1151년 알라 앗딘이 가즈니를 불태웠고, 1173년 기야스 앗딘의 동생 무이즈 앗딘이 가즈니를 오구즈 튀르크멘에게서 되찾았다(가즈니 왕조는 1151년 구르에 쫓겨 이미 라호르로 옮겨 가 있었다). 무이즈 앗딘은 1186년 라호르를 차지해 마지막 가즈니 군주를 사로잡았고 가즈니 왕조가 끝났다. 가즈니 왕조는 한때 아프가니스탄과 인도 북서부, 호라산에 걸치는 제국이었다. 구르 왕조는 이후 델리 술탄국의 바탕이 되는 인도 원정을 이어 갔다. 카라 키타이(서요)는 요나라 유민인 거란 계통이 중앙아시아에 세운 나라로, 불교를 믿으면서 주변 무슬림과 튀르크 유목민을 통치했다. 이 패배 소식은 십자군 시대 유럽에서 '사제왕 요한' 전설의 바탕이 되었다고도 한다(「제2차 십자군(1147~1149)과 '사제왕 요한' 소식」, 뒤의 사건). 이 일로 호라산의 도시들은 약탈과 세금에 시달렸고, 셀주크 술탄의 권위는 눈에 띄게 줄었다. 이 싸움은 셀주크 제국이 사실상 두 갈래로 갈라지는 전환점으로 본다."
  subjects: [seljuk-empire, khwarazmian-empire, kakuyid-dynasty, ghaznavid-empire, ghurid-dynasty]
  tags: [war, politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Andrew C. S. Peacock, The Great Seljuk Empire (Edinburgh University Press, 2015)"]

- id: fatimid-fall-1153
  year: 1153
  endYear: 1171
  title:
    ko: "아스칼론 함락(1153)에서 파티마 칼리프국의 끝(1171)까지"
  summary:
    ko: "1153년 8월 예루살렘 왕 보두앵 3세가 파티마의 해안 요새 아스칼론을 차지해 파티마는 팔레스타인의 마지막 거점을 잃었다. 이집트의 파티마 칼리프는 이때 이미 재상들이 실권을 쥔 가운데 어린 칼리프가 이어졌고(알자피르 1149~1154, 알파이즈 1154~1160, 알아디드 1160~1171), 재상들은 서로 싸웠다. 1160년대에는 예루살렘 왕국의 아모리 1세와 시리아의 장기 왕조의 누르 앗딘이 이집트를 두고 맞섰다. 재상 샤와르가 쫓겨나 누르 앗딘에게 도움을 청하자 장군 시르쿠가 1164년과 1167년, 1168~1169년 이집트로 원정했다. 1168년 아모리가 빌베이스를 점령하자 샤와르가 푸스타트를 불태웠고(이때 도시 주민은 집과 시장을 잃었다), 1169년 1월 시르쿠는 샤와르를 처형하고 재상이 되었으나 두 달 만에 죽었다. 조카 살라딘이 재상이 되어 파티마 군의 수단계 병사를 눌렀다. 1171년 9월 살라딘은 금요 예배에서 파티마 칼리프의 이름을 빼고 아바스 칼리프를 받들게 했고, 알아디드는 곧 죽어 파티마 칼리프국이 끝났다. 이집트는 시아 이스마일파 정권에서 수니 질서로 돌아섰으며, 알아즈하르 모스크는 한동안 쓰이지 않다가 뒤에 수니 학문의 중심이 되었다. 파티마 시기에 이집트에서 이스마일파 신자는 소수였고 주민 다수는 수니 무슬림과 콥트 기독교도였다. 이 일은 살라딘의 아이유브 왕조로 이어졌다(「살라딘과 아이유브 왕조의 성립: 이집트와 시리아의 통합(1171~1193)」, 뒤의 사건). 알아디드는 아홉 살(1160년 7월)에 즉위한 어린 칼리프였고, 파티마 군대는 수단계·아르메니아계·튀르크계 병사가 서로 싸우는 상태였다."
  subjects: [fatimid-caliphate, jerusalem-kingdom, zengid-dynasty, ayyubid-dynasty]
  tags: [politics, war, religion]
  sources: ["Michael Brett, The Fatimid Empire (Edinburgh University Press, 2017)", "Carole Hillenbrand, The Crusades: Islamic Perspectives (Edinburgh University Press, 1999)", "Anne-Marie Eddé, Saladin (Jane Marie Todd 옮김, Harvard University Press, 2011)"]

- id: yemen-after-1158
  year: 1158
  endYear: 1229
  title:
    ko: "예멘의 마흐디·주라이 왕조와 아이유브 왕조의 예멘 정복, 라술 왕조의 독립(1158~1229)"
  summary:
    ko: "술라이흐 왕조가 1138년 끝난 뒤 예멘은 여러 소왕조로 쪼개졌다. 티하마의 나자흐 왕조는 1158년 마지막 군주가 알리 이븐 마흐디에게 자비드를 잃어 끝났고, 알리가 세운 마흐디 왕조(1159~1174)는 이슬람 공동체의 엄격한 규율을 내세운 종교 지도자의 정권이었다. 남부 아덴은 술라이흐의 신하였던 주라이 왕조가 이어서 다스렸다. 사나 둘레는 사나 함단 술탄국이 다스렸다. 이 분열을 틈타 살라딘은 1173년 형 투란샤를 예멘에 보냈고, 투란샤는 1174년 5월 자비드를 얻어 마흐디 왕조를 끝냈고 같은 해 6월 아덴을 정복해 주라이 왕조를 끝냈다. 이로써 아이유브 왕조(예멘)가 시작되었다. 사나는 1189년 아이유브가 굳게 차지하면서 사나 함단 술탄국이 끝났다. 아이유브의 예멘 통치자 투그테긴 이븐 아유브(재위 1183~1197) 등은 이집트와 시리아의 형제와 가까이 지내면서도 예멘을 따로 다스렸다. 1229년 마지막 아이유브 통치자 마스우드가 시리아로 떠나며 대리로 맡긴 라술 가문의 우마르 이븐 알리는 처음에는 이집트 아이유브의 대리로 다스리다가 뒤에 독립해 라술 왕조를 세웠다. 라술 왕조는 이후 타이즈와 자비드를 중심으로 해상 교역과 학문으로 번성했다. 마흐디 왕조의 알리 이븐 마흐디는 이슬람 공동체의 규율을 엄격히 따르라고 설교한 종교 지도자 출신이었다고 전한다. 아덴은 이 무렵 인도양 상인들이 드나드는 큰 항구여서 아이유브 왕조가 정복한 뒤 세금 수입의 큰 몫을 냈다. 라술 왕조는 아이유브 총독이 독립한 것이어서 아이유브 행정 제도를 이어받았다. 자이드파 이맘국은 사다에서 이 모든 정권과 따로 이어졌다."
  subjects: [najahid-dynasty, mahdid-dynasty, zurayid-dynasty, ayyubid-yemen, hamdanid-sultanate-of-sanaa, rasulid-dynasty, ayyubid-dynasty]
  links:
    - { from: ayyubid-yemen, to: mahdid-dynasty, note: "자비드 정복 (1174)" }
  tags: [politics, war]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "ʿUmāra al-Yamanī, Taʾrīkh al-Yaman (영역: Yaman, Its Early Mediaeval History, Henry Cassels Kay 옮김, Edward Arnold, 1892)", "R. B. Serjeant·R. Lewcock 엮음, Ṣanʿāʾ: An Arabian Islamic City (World of Islam Festival Trust, 1983)"]

- id: iraq-seljuk-end-1152
  year: 1152
  endYear: 1194
  title:
    ko: "칼리프의 이라크 회복과 이라크 셀주크의 끝(1152~1194)"
  summary:
    ko: "1152년 이라크 셀주크 술탄국의 술탄 마수드가 죽자 아바스 칼리프국의 칼리프 알무크타피(재위 1136~1160)는 바그다드와 와시트 둘레의 이라크 중부를 직접 다스리기 시작했다. 이는 칼리프가 부와이·셀주크의 그늘을 벗어나 땅을 다시 쥐는 첫걸음이었다. 칼리프 알무스탄지드(재위 1160~1170)는 1163년 마즈야드 왕조를 힐라에서 몰아내 이라크 중부를 칼리프 직할로 굳혔다. 한편 셀주크 술탄들은 아타베그에게 눌렸다. 아제르바이잔의 엘디구즈 왕조는 1160년 무렵부터 하마단과 케르만샤 쪽을 얻어 이란 서부의 실권을 쥐었고, 샴스 앗딘 엘디구즈(재위 1136~1175)와 아들들 파흘라반(재위 1175~1186)·키질 아르슬란(재위 1186~1191)이 술탄을 허수아비로 세웠다. 1169년 라이, 1175년 이스파한과 야즈드까지 엘디구즈의 영향 아래에 놓였다. 파르스의 살구르 왕조는 따로 지방을 지켰다. 술탄 투그릴 3세(재위 1176~1194)는 이 구속을 벗으려 했지만 호라즘 제국의 호라즘샤 테키시의 침입을 받아, 1194년 3월 라이 가까이에서 져 전사했다. 이로써 이란에서 셀주크 제국의 마지막 계통이 끝났고, 라이 일대가 호라즘에게 넘어갔고 엘디구즈는 하마단·아제르바이잔에서 독립 세력으로 남았다. 알무스타디(재위 1170~1180)를 거쳐 칼리프가 된 알나시르(재위 1180~1225)는 호라즘의 도움으로 이란 서부의 셀주크 압력에서 벗어났으나, 그 결과 호라즘의 힘이 이라크 앞까지 닿았다. 칼리프는 호라즘에게서 옛 셀주크 땅 일부를 넘겨받았다. 이 기간 이라크 농촌은 아랍 부족과 튀르크멘 병사의 약탈로 불안했고, 바그다드는 마드라사와 도서관으로 학문의 중심 지위를 지켰다. 호라즘의 서진은 이란 서부의 엘디구즈 가문과 칼리프 모두에게 위협이어서, 알나시르는 호라즘의 힘을 이용하면서도 경계했다."
  subjects: [abbasid-caliphate, iraq-seljuk-sultanate, eldiguzid-dynasty, khwarazmian-empire, seljuk-empire, mazyadid-dynasty, salghurid-dynasty]
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: saladin-1171
  year: 1171
  endYear: 1193
  title:
    ko: "살라딘과 아이유브 왕조의 성립: 이집트와 시리아의 통합(1171~1193)"
  summary:
    ko: "살라딘(본명 유수프)은 쿠르드 계통 아이유브 가문 출신으로, 숙부 시르쿠를 따라 이집트에 들어가 1169년 재상이 되었다. 1171년 9월 파티마 칼리프의 이름을 빼고 아바스 칼리프국 칼리프의 이름으로 금요 예배를 올리게 해 파티마 칼리프국을 끝내고 아이유브 왕조를 열었다(「아스칼론 함락(1153)에서 파티마 칼리프국의 끝(1171)까지」, 앞의 사건). 1174년 누르 앗딘이 죽자 살라딘은 다마스쿠스를 얻었고 홈스·하마를 더했으며, 1183년 알레포를 차지해 시리아와 이집트를 하나로 묶었다. 모술의 장기 왕조와는 1186년 화약으로 서로 인정했다. 이 통합으로 예루살렘 왕국은 남북에서 포위되었고, 살라딘은 1187년 7월 하틴에서 십자군을 크게 이겨 예루살렘을 탈환했다(「살라딘의 하틴(1187)과 예루살렘 탈환, 제3차 십자군(1189~1192)」, 뒤의 사건). 예루살렘을 되찾을 때 살라딘은 몸값(남자 10디나르 등)을 받고 주민을 풀어 주었으나 몸값을 내지 못한 수천 명은 노예가 되었고, 이 일은 1099년의 학살과 자주 견주어진다. 1192년 9월 라믈라 조약으로 야파·아크레 둘레의 해안 땅은 프랑크에게 남았고 살라딘은 순례를 허용했다. 그는 1193년 3월 다마스쿠스에서 죽었다. 살라딘은 시아 성향의 파티마 체제를 정리하고 수니 마드라사를 세웠으며, 아이유브 가문은 영토를 형제와 아들에게 나누어 다스리는 방식을 이었다. 이 제국의 영토는 이집트와 시리아에 걸치고 예멘의 일부까지 닿았다. 그는 1176년 카이로 성채를 쌓기 시작했고, 법학자 이븐 샤다드가 그의 궁정에서 기록을 남겼다. 살라딘의 군대는 쿠르드·튀르크 기병으로 이루어졌고, 그는 이집트의 세금과 시리아의 군인을 합쳐 십자군에 맞섰다."
  subjects: [ayyubid-dynasty, zengid-dynasty, jerusalem-kingdom, abbasid-caliphate, fatimid-caliphate]
  links:
    - { from: ayyubid-dynasty, to: fatimid-caliphate, note: "이집트 장악, 파티마 칼리프국의 끝 (1171)" }
    - { from: ayyubid-dynasty, to: zengid-dynasty, note: "다마스쿠스·알레포 획득 (1174~1183)" }
  tags: [politics, war]
  sources: ["Anne-Marie Eddé, Saladin (Jane Marie Todd 옮김, Harvard University Press, 2011)", "Ibn Shaddād, al-Nawādir al-sulṭāniyya (영역: The Rare and Excellent History of Saladin, D. S. Richards 옮김, Ashgate, 2001)", "R. Stephen Humphreys, From Saladin to the Mongols: The Ayyubids of Damascus, 1193–1260 (State University of New York Press, 1977)"]

- id: nasir-abbasid-1180
  year: 1180
  endYear: 1242
  title:
    ko: "아바스 칼리프의 마지막 부흥: 알나시르에서 알무스탄시르까지(1180~1242)"
  summary:
    ko: "아바스 칼리프국의 칼리프 알나시르(재위 1180~1225)는 셀주크의 힘이 흩어진 틈을 이용해 바그다드의 칼리프를 이름뿐인 존재에서 직접 땅과 군대를 가진 군주로 되돌렸다. 그는 이라크 중부를 다스리면서 1194년 호라즘의 테키시가 투그릴 3세를 꺾은 뒤 옛 셀주크 지방의 일부를 넘겨받았다. 수피 학자 아부 하프스 우마르 알수흐라와르디를 외교에 쓰고 '푸투와'(젊은이들의 기사단 같은 조직)를 국가 질서 안에 묶어 도시의 젊은이와 장인을 칼리프 편으로 끌어들였다. 한편 동쪽의 호라즘 제국이 이란 서부를 차지해 이라크 앞까지 닿자 알나시르는 호라즘을 견제하려 했다. 호라즘샤 무함마드 2세는 1217/1218년 칼리프의 권위를 부정하고 시아 알리 가문의 사람을 칼리프로 세우려 바그다드로 군을 보냈으나 자그로스의 겨울 눈 속에서 군대가 흩어져 돌아갔다. 칼리프 알무스탄시르(재위 1226~1242)는 1227~1234년 무렵 바그다드에 수니 4대 법학파를 함께 가르치는 무스탄시리야 마드라사를 세웠고, 1232년에는 아르빌 둘레를 칼리프 직할지로 더했다. 알나시르의 아들 알자히르(재위 1225~1226)는 짧게 다스렸다. 이 시기의 칼리프 국가는 이라크 중부의 소국이었지만 이슬람 세계의 종교 권위를 쥐고 있었다. 그러나 몽골이 1230년대부터 이란과 이라크를 압박했고, 군대는 작았다. 알나시르는 40년 넘게 재위하며 자신을 이슬람 세계 모든 칼리프 권위의 중심으로 내세워 이집트의 아이유브와 호라즘, 서방의 알모하드 같은 여러 군주에게 사절을 보냈다. 푸투와 조직에는 지방 군주들도 가입시켜 칼리프의 영향력을 넓히려 했다. 이 시기 바그다드는 몽골이 오기 직전의 마지막 번영기를 누렸다."
  subjects: [abbasid-caliphate, khwarazmian-empire]
  tags: [politics, religion]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Angelika Hartmann, an-Nāṣir li-Dīn Allāh (1180–1225): Politik, Religion, Kultur in der späten ʿAbbāsidenzeit (Walter de Gruyter, 1975)"]

- id: ayyubid-division-1193
  year: 1193
  endYear: 1250
  title:
    ko: "아이유브 가문의 분봉과 알아딜·알카밀, 제5차·제7차 십자군(1193~1250)"
  summary:
    ko: "살라딘이 1193년 죽자 아이유브 왕조는 영토가 아들들과 동생들에게 나뉘어 이집트·다마스쿠스·알레포가 따로 움직였다. 동생 알아딜이 형제와 조카들을 누르고 1200년 이집트의 술탄이 되어 다시 가문 전체를 이끌었다. 알아딜의 아들 알카밀(재위 1218~1238)은 제5차 십자군(1218~1221)이 다미에타를 점령하자 다미에타를 되찾아 십자군을 몰아냈다. 그러나 다마스쿠스의 형제 알무아잠이 죽은(1227) 뒤 그의 아들과 다투자 1229년 신성 로마 황제 프리드리히 2세와 화약(야파 조약)을 맺어 예루살렘과 베들레헴, 나사렛을 내주었고, 이 도시들은 10년간 십자군 쪽에 있었다. 이슬람 쪽에서는 이를 비난하는 목소리가 컸다. 알카밀이 죽은 뒤(1238) 아들 알아딜 2세(재위 1238~1240)가 밀려났고 가문의 다툼은 이어졌으며, 알살리흐 아이유브(재위 1240~1249)는 튀르크계 노예 병사 맘루크(바흐리야)를 늘리고 호라즘 용병을 불러들여 1244년 예루살렘을 되찾았다. 같은 해 가자 근처 라 포르비 전투에서 예루살렘 왕국과 기사단의 연합군을 물리쳤다. 1248년 프랑스 왕 루이 9세가 이끈 제7차 십자군이 이집트로 와서 1249년 6월 다미에타를 점령했으나, 알살리흐는 같은 해 11월 죽었고 1250년 2월 만수라 전투에서 이집트 군에게 크게 졌다. 루이 9세는 4월에 붙잡혔다가 몸값을 내고 풀려났다. 이 승리의 주역이던 맘루크가 곧 아이유브의 이집트 정권을 무너뜨리게 된다. 이 분봉 체제는 형제와 조카 사이의 협력과 다툼이 번갈아 나타났고 십자군과도 때로 화친을 맺는 정치였다. 맘루크는 아이유브 술탄이 사들인 튀르크계 노예 병사로, 알살리흐가 나일강 섬 로다에 병영을 세워 길렀다."
  subjects: [ayyubid-dynasty, jerusalem-kingdom]
  tags: [politics, war, diplomacy]
  sources: ["R. Stephen Humphreys, From Saladin to the Mongols: The Ayyubids of Damascus, 1193–1260 (State University of New York Press, 1977)", "Carole Hillenbrand, The Crusades: Islamic Perspectives (Edinburgh University Press, 1999)", "Steven Runciman, A History of the Crusades, vol. 3: The Kingdom of Acre and the Later Crusades (Cambridge University Press, 1954)"]

- id: muhammad-ii-1200
  year: 1200
  endYear: 1220
  title:
    ko: "알라 앗딘 무함마드 2세의 호라즘 제국(1200~1220)"
  summary:
    ko: "호라즘 제국의 무함마드 2세(재위 1200~1220)는 아버지 테키시에게서 호라즘을 물려받아 영토를 이란 고원과 트란스옥시아나에 걸치게 넓혔다. 1204년 이후 페르시아 이라크(라이·하마단·이스파한)는 엘디구즈 왕조의 아타베그 가문에 딸린 맘루크 아이두그미시와 멩글리가 다스렸는데, 호라즘은 이 땅을 1217년 다시 차지했다. 1210년에는 마잔다란과 고르간을 얻어 바반드 왕조 같은 지방 영주를 눌렀고, 1214년에는 오구즈 튀르크멘이 가진 케르만을 빼앗았다. 동쪽에서는 카라 키타이와 구르 왕조의 힘이 약해진 틈에 1210~1215년 트란스옥시아나와 아프가니스탄을 차지했다. 이 나라는 호라즘 전통의 튀르크계 군인과 어머니 투르칸 하툰이 이끄는 캉글리 부족에 기댄 군사 정권이었고, 도시 귀족과 칼리프 쪽 법학자와는 사이가 좋지 않았다. 무함마드는 1217/1218년 아바스 칼리프국의 칼리프 알나시르를 폐위하려 했으나 군대가 눈 속에서 흩어져 실패했다. 1218년 호라즘 쪽 총독이 오트라르에서 칭기즈 칸의 상인 사절단을 죽이면서 몽골과의 전쟁이 시작되었다. 이 시기 호라즘은 아직 하나의 제국으로 굳어지지 못했고, 지방 군 사령관들은 서로 불신했다. 이 제국의 내부는 호라즘 군인 지휘관과 무함마드의 어머니 투르칸 하툰 사이의 알력으로 흔들렸고, 무함마드는 후계자로 장남 잘랄 앗딘이 아니라 어머니가 미는 다른 아들을 세우려 했다. 칼리프와 맞선 일은 많은 무슬림에게 정통성 문제로 비쳤다. 호라즘이 서쪽으로 힘을 쏟는 동안 동쪽에서는 몽골이 중앙아시아에서 힘을 키우고 있었다. 무함마드는 '제2의 알렉산드로스'를 자처했다고도 전한다."
  subjects: [khwarazmian-empire, eldiguzid-dynasty, abbasid-caliphate, bavandid-dynasty, ghurid-dynasty]
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Ibn al-Athīr, al-Kāmil fī l-taʾrīkh (영역: The Chronicle of Ibn al-Athīr for the Crusading Period, D. S. Richards 옮김, Ashgate, 2006~2008)", "ʿAṭā-Malik Juvaynī, Taʾrīkh-i jahāngushā (영역: Genghis Khan: The History of the World Conqueror, John Andrew Boyle 옮김, Manchester University Press, 1958)"]

- id: mongol-khwarazm-1219
  year: 1219
  endYear: 1231
  title:
    ko: "몽골의 호라즘 정복과 잘랄 앗딘(1219~1231)"
  summary:
    ko: "1218년 오트라르의 총독이 몽골의 상인 사절단을 죽이자 몽골 제국의 칭기즈 칸은 1219년 가을 대군을 이끌고 호라즘 영토로 들어왔다. 1220년 2월 부하라와 3월 사마르칸트가 함락되었고, 무함마드 2세는 도망하다가 1220년 말 카스피해의 섬에서 죽었다. 칭기즈 칸의 아들 조치 등이 포위한 도읍 구르간지(우르겐치)는 1221년 봄 몇 달의 싸움 끝에 무너졌고, 톨루이가 이끈 군이 1221년 초 메르브를, 4월 니샤푸르를 쳤다. 도시를 약탈하고 많은 주민을 죽였다는 기록이 많으며, 사료는 수십만에서 100만이 넘는 숫자를 적지만 과장으로 본다. 무함마드의 아들 잘랄 앗딘은 1221년 가을 파르완에서 몽골군을 한 번 꺾었으나 11월 인더스강에서 크게 져 인도로 건너갔다. 그는 1224년 이란으로 돌아와 1225년 엘디구즈 왕조의 마지막 군주 우즈벡을 몰아내고 타브리즈를 차지했으며 같은 해 조지아군도 꺾었다(「조지아와 몽골: 타마르의 전성기 뒤의 침공과 복속, 서조지아의 분리」, 뒤의 사건). 케르만에서는 호라즘의 총독을 몰아낸 카라 키타이 출신 바라크 하지브가 1222년 쿠틀루그 칸 왕조를 열었다. 잘랄 앗딘은 1230년 룸의 셀주크에게 졌고, 1231년 8월 몽골에 쫓기다 쿠르드 산지에서 살해되었다. 이로써 호라즘 제국이 끝났다. 몽골은 이란과 이라크를 이어 압박했고, 그 마지막 단계가 훌라구의 서정이다. 몽골군은 도시마다 항복하면 목숨을 살려 주고 저항하면 학살하는 방식으로 압박했고, 장인과 학자는 몽골 본국으로 끌려가기도 했다. 이 정복으로 호라산과 트란스옥시아나의 관개 농업 지대는 크게 파괴되었다고 학자들은 본다."
  subjects: [mongol-empire, khwarazmian-empire, eldiguzid-dynasty, qutlugh-khanid-dynasty]
  links:
    - { from: mongol-empire, to: khwarazmian-empire, note: "호라즘 정복 (1219~1221)" }
  tags: [war, politics]
  sources: ["ʿAṭā-Malik Juvaynī, Taʾrīkh-i jahāngushā (영역: Genghis Khan: The History of the World Conqueror, John Andrew Boyle 옮김, Manchester University Press, 1958)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)"]

- id: almohad-fall-1229
  year: 1229
  endYear: 1248
  title:
    ko: "알모하드의 해체와 하프스·자이얀·마린 왕조의 자립(1229~1248)"
  summary:
    ko: "알모하드 칼리프국은 1212년 라스 나바스 데 톨로사에서 크게 진 뒤(「라스 나바스 데 톨로사 전투와 알모하드의 몰락」, 앞의 사건) 칼리프 자리를 둘러싼 다툼으로 힘이 빠졌다. 1229년 이드리스 알마문(재위 1227~1232)은 이븐 투마르트를 마흐디로 받드는 알모하드의 교리를 공개적으로 버렸다. 그 뒤 알라시드(재위 1232~1242)와 알사이드(재위 1242~1248)가 이었으나 칼리프의 권위는 마라케시 둘레에 그쳤다. 이는 이프리키야 총독 가문의 자립을 앞당겼다. 이프리키야에서는 하프스 가문 총독의 아들 아부 자카리야 야히야가 1229년 알모하드와 결별하고 튀니스를 도읍으로 하프스 왕조를 열었고, 1230년 콘스탄틴과 베자이아까지 얻었다. 알제리 서부에서는 아브드 알와드 가문의 수장 야그무라산이 1235/1236년 틀렘센에서 자립해 자이얀 왕조를 열고 알모하드 칼리프에게 맞서 1248년에 칼리프 알사이드를 꺾었다고 전한다. 모로코에서는 제나타 계통 마린 부족이 일찍이 1215년부터 알모하드와 싸웠고, 1244~1248년 사이 메크네스·타자·라바트·살레를, 1248년 페스를 차지하며 마린 왕조를 세웠다. 알모하드는 알무르타다(재위 1248~1266) 때 마라케시를 중심으로 모로코 남부에 남았고, 안달루스의 땅은 카스티야의 레콩키스타에 빼앗겼다. 이 분열로 마그레브는 동에서 서로 하프스, 자이얀, 마린이라는 세 왕조가 갈라 다스리는 구도가 되었다. 하프스 왕조는 튀니스를 도읍으로 이프리키야의 상업과 학문을 이었고 안달루스에서 건너온 학자와 장인을 받아들였다. 자이얀 왕조와 마린 왕조는 모두 제나타 베르베르 계통이어서 같은 계통의 부족 연합 속에서 서로 다투었다. 알모하드의 해체는 안달루스에서 카스티야와 아라곤이 땅을 얻는 틈을 주었다. 마그레브의 세 왕조는 이후 서로 국경을 다투며 오래 공존했다."
  subjects: [almohads, hafsid-sultanate, zayyanid-kingdom, marinid-sultanate]
  tags: [politics, war]
  sources: ["Amira K. Bennison, The Almoravid and Almohad Empires (Edinburgh University Press, 2016)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)"]

- id: lulu-mosul-1234
  year: 1234
  endYear: 1245
  title:
    ko: "모술의 바드르 앗딘 루울루: 장기 왕조의 끝(1234)에서 몽골 복속(1243년 무렵)까지"
  summary:
    ko: "바드르 앗딘 루울루는 아르메니아계 또는 쿠르드계(사료가 갈린다)의 해방 노예 출신 장군으로, 1211년 무렵부터 모술의 장기 가문 어린 군주들의 후견인으로 모술을 실제로 다스렸다. 1234년 루울루는 마지막 장기 군주 나시르 앗딘 마흐무드를 제거하고(사료는 살해로 전한다) 자기 이름으로 주화를 찍어 모술의 주인이 되었고, 이로써 장기 왕조의 모술 계통이 끝나고 루울루 정권이 시작되었다. 루울루는 이웃한 아이유브 가문과 아바스 칼리프 사이에서 균형을 잡으며 모술을 지켰다. 모술은 이 시기 금속 세공과 필사본 제작으로 이름난 도시였고, 구리·황동에 은을 박는 상감 세공이 이슬람 미술사에서 '모술 학파'로 꼽힌다. 호라산에서 피난 온 장인들이 기술을 들여왔다는 설명도 있으며, 루울루는 학자와 예술가를 후원했다. 그러나 1230년대 후반부터 몽골이 이라크 북부에 이르자, 루울루는 1243년(1245년설도 있음) 몽골 제국의 종주권을 받아들이고 공물을 바쳤다. 1243년 쾨세다으 전투에서 몽골이 룸의 셀주크를 꺾은 뒤 서아시아의 소국들은 앞다투어 몽골에 사절을 보냈다(「룸 술탄국의 전성과 몽골의 종주권: 쾨세다으(1243)에서 카라만(1277)까지」, 앞의 사건). 이는 몽골의 서아시아 정복에서 가장 이른 가신 관계 중 하나였고, 모술은 티그리스강 서안의 교역 도시로 이라크 북부의 곡물과 강 교역에 기대어 살았고, 루울루는 사절과 선물을 주고받으며 도시를 지켰으나 주민은 몽골의 직접 공격을 피한 대신 공물과 군수 부담을 졌다. 이후 훌라구의 서정에서 루울루가 한 역할은 「훌라구의 서정과 바그다드 함락(1256~1258)」(뒤의 사건)에 있다."
  subjects: [lulu-dynasty, zengid-dynasty, mongol-empire]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)"]

- id: mamluk-rise-1249
  year: 1249
  endYear: 1253
  title:
    ko: "맘루크 술탄국의 성립: 샤자르 앗두르와 아이바크(1249~1253)"
  summary:
    ko: "아이유브 술탄 알살리흐는 1249년 11월 제7차 십자군의 이집트 공격 한가운데 죽었고, 그의 아내 샤자르 앗두르가 죽음을 감추고 군대를 지휘했다. 1250년 2월 만수라 전투에서 맘루크(바흐리야) 장교들이 십자군에 크게 이겼고, 루이 9세는 4월 포로가 되었다(「아이유브 가문의 분봉과 알아딜·알카밀, 제5차·제7차 십자군(1193~1250)」, 앞의 사건). 알살리흐의 아들 투란샤가 시리아에서 이집트로 와서 자신의 측근을 앉히자 맘루크 장교들이 1250년 5월 그를 죽였다. 샤자르 앗두르가 술탄으로 추대되어 맘루크 정권이 열렸다. 그러나 아바스 칼리프가 여성 술탄을 받아들이지 않자 샤자르는 맘루크 장수 아이바크와 혼인해 자리를 넘겼다. 아이바크는 아이유브 가문의 어린 알아슈라프 무사를 이름뿐인 공동 술탄으로 두고 정권을 쥐었다. 이 사건으로 이집트에서 아이유브 왕조의 지배가 끝나고 맘루크 술탄국이 시작되었다. 시리아의 아이유브 군주 알나시르 유수프는 이를 인정하지 않고 맞섰으나, 1253년 아바스 칼리프의 중재로 요르단강을 사이에 두고 땅을 나누어 팔레스타인이 맘루크 쪽으로 넘어갔다. 아이바크는 1250년대 내내 맘루크 안의 반란과 시리아의 아이유브 군주들을 상대해야 했다. 맘루크는 곧 몽골을 맞아 싸우게 된다(「아인 잘루트 전투와 바이바르스의 맘루크 술탄국(1260~1277)」, 뒤의 사건). 아이유브 시대에 사들인 튀르크계(킵차크) 노예 군인이 새 지배층이 되었고, 이후 맘루크는 군주 자리를 노예 출신 군인이 이어받는 독특한 체제를 이어 갔다. 샤자르 앗두르는 이슬람 세계의 중세 술탄 가운데 드문 여성 통치자로 기억된다."
  subjects: [mamluk-sultanate, ayyubid-dynasty]
  links:
    - { from: mamluk-sultanate, to: ayyubid-dynasty, note: "이집트 장악 (1250)" }
  tags: [politics, war]
  sources: ["Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)", "P. M. Holt, The Age of the Crusades: The Near East from the Eleventh Century to 1517 (Longman, 1986)", "R. Stephen Humphreys, From Saladin to the Mongols: The Ayyubids of Damascus, 1193–1260 (State University of New York Press, 1977)"]

- id: hulagu-baghdad-1256
  year: 1256
  endYear: 1258
  title:
    ko: "훌라구의 서정과 바그다드 함락(1256~1258)"
  summary:
    ko: "몽골 제국의 몽케 칸은 서아시아 정복의 임무를 동생 훌라구에게 맡겼고, 훌라구는 1253년 10월 카라코룸을 떠나 천천히 서쪽으로 나아갔다. 그는 1256년 1월 아무다리야강을 건너 엘부르즈 산맥의 니자르 이스마일파 영역으로 들어섰다. 1256년 11월 19일 마지막 이맘 루큰 앗딘 후르샤가 마이문 디즈 성채에서 항복했고, 12월 15일 알라무트도 문을 열었다(「니자르 이스마일파와 알라무트 성채(1090~1124)」, 앞의 사건). 훌라구는 이 무렵부터 일 칸국의 터를 닦기 시작했다. 훌라구는 칼리프 알무스타심(재위 1242~1258)에게 항복을 요구했으나 칼리프는 이를 받아들이지 않았다. 1258년 1월 22일 몽골군이 바그다드 동쪽에 닿았고 1월 29일 무렵 총공격이 시작되어 2월 초 성벽이 뚫렸다. 모술의 루울루 정권은 몽골군의 강 건너기와 군수 보급을 도왔고, 조지아와 아르메니아 가신 군도 함께했다(「조지아와 몽골: 타마르의 전성기 뒤의 침공과 복속, 서조지아의 분리」, 앞의 사건). 2월 10일 칼리프가 항복했고 13일부터 약 1주일 도시가 약탈되었다. 훌라구 쪽 기록은 주민 약 20만 명이 죽었다고 하고, 후대 무슬림 사료는 80만에서 200만을 전하는데 역사가들은 큰 수를 과장으로 본다. 알무스타심은 2월 20일 무렵 처형되었고 아바스 칼리프국은 끝났다. 훌라구의 기독교도 아내 도쿠즈 하툰의 중재로 기독교도의 집들이 보호받았다고 전한다. 몽골군이 시리아로 향한 일은 「아인 잘루트 전투와 바이바르스의 맘루크 술탄국(1260~1277)」(뒤의 사건)에 있다. 훌라구의 군대에는 중국인 기술자와 투석기 부대가 있었고, 조치 계통과 차가타이 계통의 병사도 섞여 있었다."
  subjects: [ilkhanate, abbasid-caliphate, mongol-empire, lulu-dynasty]
  links:
    - { from: mongol-empire, to: abbasid-caliphate, note: "바그다드 함락, 칼리프 알무스타심의 처형 (1258)" }
  tags: [war, politics]
  sources: ["Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "ʿAṭā-Malik Juvaynī, Taʾrīkh-i jahāngushā (영역: Genghis Khan: The History of the World Conqueror, John Andrew Boyle 옮김, Manchester University Press, 1958)", "Rashīd al-Dīn, Jāmiʿ al-tawārīkh (영역: The Successors of Genghis Khan, John Andrew Boyle 옮김, Columbia University Press, 1971)"]
