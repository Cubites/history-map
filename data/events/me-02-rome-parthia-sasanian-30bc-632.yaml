- id: muhammad-mecca-hijra-613
  year: 613
  endYear: 622
  title:
    ko: "메카의 포교와 박해, 히즈라(613~622)"
  summary:
    ko: "공개 포교를 시작한 무함마드(613 무렵)는 쿠라이시 유력자들의 반발에 부딪혔다. 다신교 숭배와 순례·교역에서 얻는 이익, 씨족 중심 질서를 위협한다고 본 것이다. 메카 시기에 내려왔다고 전하는 쿠란의 이른 계시는 짧은 운문으로 유일신과 심판의 날, 약자를 돌보는 일을 강조한다. 노예와 가난한 이들이 먼저 믿었고, 그 가운데 우마이야 이븐 할라프의 노예였던 빌랄은 고문을 받다 아부 바크르가 사서 풀어 주었다고 전한다. 아부 자흘과 아부 라하브 같은 유력자가 반대에 앞장섰으나 삼촌 아부 탈리브이 씨족의 이름으로 무함마드를 보호했다. 615년 무렵 일부 신자들이 홍해 건너 악숨 왕(네구스)의 땅으로 피신했다. 616~619년 무렵 쿠라이시의 다른 씨족이 하심·무탈리브 씨족과 거래·혼인을 끊었다는 전승이 있으나 사실 여부는 학설이 갈린다. 619년 아내 하디자와 삼촌 아부 탈리브이 잇따라 죽어 무함마드는 씨족의 보호를 잃었다. 쿠란 30장은 동로마가 사산에 패했으나 곧 이기리라는 구절을 담고 있어 이 무렵 두 제국의 전쟁이 아라비아 사람들의 입에도 오르내렸음을 보여 준다. 야스립(메디나)은 오아시스 농업 도시로 아우스와 하즈라즈 두 부족이 부아스 전투(617 무렵)까지 오래 다퉈 외부 중재자가 필요했다. 620~621년 아카바에서 이 도시 사람들과 서약이 맺어졌고, 622년 두 번째 아카바 서약으로 이들이 무함마드를 지도자로 청하자 신자들이 먼저 떠났다. 무함마드는 아부 바크르와 함께 622년 9월 메디나에 닿았다. 이 이주가 히즈라이며, 훗날 칼리프 우마르가 이 해를 이슬람 달력(히즈라력)의 원년으로 정했다(원년 1월 1일은 율리우스력 622년 7월 16일에 해당한다)."
  subjects: [sasanian-empire, byzantine-empire]
  tags: [religion, society]
  sources: ["W. Montgomery Watt, Muhammad at Mecca (Clarendon Press, 1953)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)", "Frank E. Peters, Muhammad and the Origins of Islam (State University of New York Press, 1994)", "Robert G. Hoyland, In God's Path: The Arab Conquests and the Creation of an Islamic Empire (Oxford University Press, 2015)"]

- id: muhammad-medina-badr-622
  year: 622
  endYear: 627
  title:
    ko: "메디나의 공동체와 바드르·우후드·참호 전투(622~627)"
  summary:
    ko: "메디나에서는 아우스와 하즈라즈 두 아랍 부족이 오래 다투고 있었고, 유대 부족(카이누카·나디르·쿠라이자)이 함께 살았다. 무함마드는 622~623년 무렵 「메디나 헌장」으로 신자와 여러 부족을 하나의 공동체(움마)로 묶고 서로 방어한다고 약속했다고 전한다(헌장의 연대와 성격은 학설이 갈린다). 헌장의 조항은 유대 부족이 신자 공동체와 함께 메디나를 지키고 비용을 나누되 자신의 종교는 지킨다고 정했다고 전한다. 메카에서 온 이주자(무하지룬)와 메디나의 도운 이들(안사르)은 형제 관계를 맺고 재산과 일을 나누었다고 하며, 예배의 방향(키블라)이 예루살렘에서 메카로 바뀐 것도 이 무렵(623~624)이라고 전한다. 이 사이 북쪽에서는 동로마 황제 헤라클레이오스가 622년 사산을 반격하기 시작해 두 제국은 아라비아에 간섭할 겨를이 없었다고 흔히 설명한다. 624년 3월 바드르에서 무슬림 300명 남짓이 메카군 약 950명을 이기고 쿠라이시의 유력자 아부 자흘이 죽었다. 625년 3월 우후드에서는 메카군 3,000명이 무슬림 700명을 이겼으나, 아부 수프얀이 메디나를 치지 못하고 돌아갔다. 627년 3월 메카와 동맹 부족 약 1만 명이 메디나를 에워쌌는데(참호 전투), 무슬림은 페르시아 출신 살만의 제안에 따라 도시 북쪽에 참호를 팠다고 한다. 폭풍과 동맹의 분열로 포위군은 물러났다. 무슬림은 카이누카(624)와 나디르(625년 무렵) 부족을 메디나에서 내보냈고, 참호 전투 뒤에는 적과 내통했다는 이유로 쿠라이자 부족의 남자들을 처형했다고 전승은 전하는데(수는 600~900명으로 갈리고, 일부 학자는 이 서술의 과장을 의심한다), 이로써 메디나 안의 반대가 사라지고 무함마드의 정치 지도력이 굳어졌다."
  subjects: [sasanian-empire, byzantine-empire]
  tags: [war, politics, religion]
  sources: ["W. Montgomery Watt, Muhammad at Medina (Clarendon Press, 1956)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)", "Frank E. Peters, Muhammad and the Origins of Islam (State University of New York Press, 1994)", "Robert G. Hoyland, In God's Path: The Arab Conquests and the Creation of an Islamic Empire (Oxford University Press, 2015)"]
  places:
    - { name: 바드르 전투, at: [38.77, 23.74], year: 624 }
    - { name: 우후드 전투, at: [39.61, 24.5], year: 625 }

- id: muhammad-hudaybiyya-628
  year: 628
  endYear: 630
  title:
    ko: "후다이비야 협정(628)과 메카 정복(630)"
  summary:
    ko: "628년 3월 무함마드는 신자 약 1,400~1,500명과 함께 메카로 소순례(우므라)를 떠났다. 쿠라이시는 이를 막았고, 메카 가까운 후다이비야에서 협상이 이루어졌다. 쿠라이시 쪽 협상자 수하일 이븐 아므르는 협정문에서 '알라의 사도'라는 칭호를 빼라고 요구했고 무함마드가 이를 받아들였다는 일화가 전한다. 협정은 10년의 휴전과 그해는 돌아가고 이듬해 사흘 동안 순례를 허용한다는 것, 메카에서 메디나로 도망온 이를 돌려보낸다는 것, 부족들이 어느 편과도 동맹을 맺을 수 있다는 것을 담았다. 무슬림 가운데는 이 협정을 불리하다고 보는 이도 있었으나, 이 휴전 덕에 무함마드는 628년 유대 오아시스 하이바르를 정복하고 부족들을 모을 수 있었다. 전승은 이 무렵 무함마드가 동로마 황제·사산 왕·악숨 왕·이집트 총독에게 서한을 보냈다고 전하는데, 서한의 사실성은 학자들이 갈린다. 629년 3월 무함마드는 약속대로 메카로 가서 사흘 동안 소순례를 했고, 이 무렵 쿠라이시의 유력 인물 할리드 이븐 알왈리드와 아므르 이븐 알아스가 메디나로 가서 이슬람을 받아들였다고 전한다. 629년 9월 북쪽 무타(지금 요르단 카라크 부근)에서 무슬림 3천 명이 동로마군과 그 아랍 동맹 부족을 만나 지휘관 자이드·자으파르·이븐 라와하가 죽고 할리드가 군대를 이끌어 물러났다(결과는 사료마다 갈려, 무슬림 쪽 서술은 병력을 지킨 후퇴로 보고 현대 연구자는 대체로 동로마 쪽 우세로 본다). 쿠라이시 쪽 동맹이 무슬림 쪽 동맹을 습격하며 휴전을 깨자 무함마드는 630년 1월 무렵 약 1만 명으로 메카로 나아갔다. 무함마드는 쿠라이시 지도자 아부 수프얀의 집에 들어가는 사람은 안전하다고 선언해 저항을 줄였다고 전한다. 메카는 큰 싸움 없이 항복했고 카바의 신상들이 치워졌으며, 일부 사람을 뺀 대부분이 사면되었다. 이어 후나인에서 하와진·타키프 연합군을 이겼다."
  subjects: [byzantine-empire, sasanian-empire]
  tags: [diplomacy, war, religion]
  sources: ["W. Montgomery Watt, Muhammad at Medina (Clarendon Press, 1956)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)", "Frank E. Peters, Muhammad and the Origins of Islam (State University of New York Press, 1994)", "Robert G. Hoyland, In God's Path: The Arab Conquests and the Creation of an Islamic Empire (Oxford University Press, 2015)"]
