- id: khosrow-ii-bahram-chobin-590
  year: 590
  endYear: 591
  title:
    ko: "호스로 2세의 즉위와 바흐람 추빈의 반란(590~591)"
  summary:
    ko: "호르미즈드 4세(재위 579~590)는 귀족과 사제에게 엄했고, 동로마·돌궐과 한꺼번에 싸우다 590년 정변으로 쫓겨나 죽었다. 정변을 이끈 이들은 왕의 처남이자 호스로의 외삼촌인 비스타함과 빈두이흐였고, 이들이 아들 호스로 2세를 왕위에 올렸다. 그런데 파르티아계 미흐란 가문 출신 장군 바흐람 추빈이 반기를 들었다. 바흐람은 588년 돌궐 왕 샤바의 군대를 크게 무찔러 이름을 날렸으나, 전승에 따르면 호르미즈드는 동로마와 싸워 진 그에게 패전의 책임을 물어 실 잣는 여자의 옷을 보내 모욕했다. 바흐람은 군대를 이끌고 크테시폰으로 진군해 스스로 왕(바흐람 6세)이 되었고, 호스로 2세는 590년 크테시폰을 떠나 서쪽으로 달아나 동로마 영토로 들어가 황제 마우리키오스에게 도움을 청했다. 마우리키오스는 이를 받아들여 호스로를 아들처럼 대했고(딸 마리아를 아내로 보냈다는 이야기도 전하나 사실성은 의심받는다), 591년 동로마군(나르세스와 요한 미스타콘이 이끌었다)과 아르메니아 병력, 호스로 쪽 귀족이 힘을 모아 아제르바이잔의 블라라톤 부근에서 바흐람을 꺾었다. 바흐람은 돌궐 땅으로 달아나 죽었다고 한다. 호스로의 외삼촌 비스타함은 뒤에 반란을 일으켜 동북쪽에서 따로 왕을 칭했다. 호스로 2세는 보답으로 다라와 마르티로폴리스, 페르사르메니아의 대부분과 이베리아 땅을 동로마에 넘겼다. 이로써 두 제국 사이에는 591년부터 10년 남짓 평화가 이어졌고, 마우리키오스는 병력을 발칸의 아바르와 슬라브 쪽으로 돌릴 수 있었다. 이 평화가 깨진 뒤의 전쟁은 「헤라클레이오스와 사산 전쟁(602~628): 예루살렘 함락과 콘스탄티노폴리스 포위(626)」(뒤의 사건)에서 다룬다."
  subjects: [sasanian-empire, byzantine-empire]
  tags: [politics, diplomacy]
  sources: ["Michael Whitby, The Emperor Maurice and His Historian: Theophylact Simocatta on Persian and Balkan Warfare (Oxford University Press, 1988)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]

- id: sasanian-levant-egypt-610
  year: 610
  endYear: 630
  title:
    ko: "사산 지배 아래의 시리아·팔레스타인·이집트(610~630)"
  summary:
    ko: "602년 시작된 전쟁은 호스로 2세의 장군들이 610년 무렵 시리아 자지라(에데사)를 차지하고 611~613년 안티오키아와 다마스쿠스를 치면서 동로마의 동방 속주를 휩쓸었다. 그 사이 동로마에서는 602년 마우리키오스를 죽이고 오른 포카스가 610년 헤라클레이오스에게 쫓겨났으나 전세는 곧 바뀌지 않았다. 614년 예루살렘이 함락되어 많은 이가 죽고(전하는 수는 사료마다 다르다), 성묘 교회와 다른 교회가 불탔으며 '진짜 십자가'가 크테시폰으로 옮겨졌다. 총대주교 자카리아스도 포로로 끌려갔다. 팔레스타인 도시들은 대체로 사산군에 협력하거나 맞서지 않아 피해가 도시마다 달랐고(카이사레아는 614년 포위 끝에 함락되었다), 순례와 교회 재건은 사산이 물러난 뒤에야 다시 이어졌다. 이 전쟁에서 유대인 일부가 사산 편에 섰고, 페르시아는 한때 예루살렘의 통치를 유대인에게 맡겼다는 서술이 있지만, 규모와 기간은 학자들이 갈린다. 619년 장군 샤흐르바라즈가 알렉산드리아를 함락해 이집트 전체가 사산에 들어갔다. 사산 총독령은 지방 관리를 쓰고 세금을 거두었으며, 호스로 2세의 궁정에서는 아내 시린과 의사 가브리엘을 비롯한 그리스도교도가 힘을 가졌다. 사산 지배 아래에서는 동로마 국교회(칼케돈파) 대신 미아피시스파(시리아 정교회)와 동방 교회가 힘을 얻었다. 헤라클레이오스의 반격은 622년 시작해 627년 말 니네베 싸움으로 결판났고(「헤라클레이오스와 사산 전쟁(602~628): 예루살렘 함락과 콘스탄티노폴리스 포위(626)」(앞의 사건)), 628년 평화 조약에 따라 사산군은 시리아와 이집트에서 물러났다. 629년 헤라클레이오스가 이 땅을 되찾았고 630년 초 진짜 십자가가 예루살렘으로 돌아왔다."
  subjects: [sasanian-empire, byzantine-empire]
  links:
    - { from: sasanian-empire, to: byzantine-empire, note: "시리아·팔레스타인·이집트 점령(614~619)" }
  tags: [war, politics, religion]
  sources: ["Walter E. Kaegi, Heraclius: Emperor of Byzantium (Cambridge University Press, 2003)", "James Howard-Johnson, Witnesses to a World Crisis: Historians and Histories of the Middle East in the Seventh Century (Oxford University Press, 2010)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]
  places:
