- id: ardashir-unification-222
  year: 222
  endYear: 240
  title:
    ko: "아르다시르 1세의 이란 통일: 종속 왕국의 병합(222~240)"
  summary:
    ko: "파르티아 아래의 이란에는 여러 지방 왕국이 있었다. 파르스의 페르시스 왕가 출신 아르다시르 1세는 파파크의 아들로 지방의 맞수들을 누르고 파르스를 모은 뒤 이웃으로 뻗었다. 사산 왕조의 이름은 이스타크르의 아나히타 신전을 돌보던 사제 사산에게서 나왔다고 전승은 말하지만, 사산과 파파크의 관계는 사료마다 다르다. 그는 222년 무렵 티그리스·유프라테스 하구의 카라케네 왕국(도읍 카락스)을 차지해 걸프의 바다 장사를 손에 넣었고, 224년에는 엘리마이스 왕국을 누르는 한편 호르미즈드간에서 파르티아의 마지막 왕 아르타바누스 4세를 이겼다(「사산 왕조의 등장(224~226)과 샤푸르 1세: 발레리아누스의 패배(260)」(뒤의 사건)). 226년 크테시폰에서 '이란인의 샤한샤'를 칭하며 사산 제국이 섰고, 226년 무렵 북서쪽 아트로파테네(지금의 아제르바이잔 이란령)도 그의 손에 들어갔다. 그 뒤 호라산과 시스탄, 고르간 같은 동쪽 땅에 이어 걸프 맞은편의 동아라비아 해안(바레인과 마준)까지 240년 무렵 영향권에 넣었다고 전승은 전하는데, 이 원정이 하트라 정복과 뒤섞인 이야기라고 보는 학자도 있다. 하트라는 220년대 후반(226/227~229년 무렵)의 첫 포위에서 버텼으나 240~241년께 무너졌고(아르다시르와 공동 통치자 샤푸르 1세가 함께 나선 것으로 본다), 이로써 파르티아 때 제 이름으로 서 있던 지방 왕국 가운데 사산 앞에 남은 곳은 적었다. 아르다시르는 카린·수렌 같은 파르티아계 귀족 가문과도 손잡아 통치를 굳혔고, 조로아스터교 사제단과 짝을 이룬 중앙 집권의 틀을 놓았다. 아르다시르는 파르스에 새 도시 아르다시르 쿠라(지금의 피루자바드)를 세웠고, 뒷날의 서사는 그가 아케메네스 왕조의 후예로서 이란의 옛 영광을 되찾았다는 명분을 만들어 갔다."
  subjects: [sasanian-empire, parthian-empire, persis-kingdom, elymais, characene, atropatene]
  links:
    - { from: persis-kingdom, to: characene, note: "카라케네 병합(222 무렵)" }
    - { from: sasanian-empire, to: elymais, note: "엘리마이스 병합(224 무렵)" }
    - { from: sasanian-empire, to: atropatene, note: "아트로파테네 병합(226 무렵)" }
  tags: [politics, war]
  sources: ["Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Josef Wiesehöfer, Ancient Persia from 550 BC to 650 AD (Azizeh Azodi 영역, I. B. Tauris, 1996)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "타바리, 『예언자들과 왕들의 역사』", "Parvaneh Pourshariati, Decline and Fall of the Sasanian Empire (I. B. Tauris, 2008)"]

- id: sasanian-religion-mani-kartir-242
  year: 242
  endYear: 293
  title:
    ko: "사산의 종교: 마니교의 등장과 사제 카르티르(242~293)"
  summary:
    ko: "사산 왕조는 조로아스터교를 받드는 사제단과 손잡고 나라를 이끌었지만 모든 종교를 한꺼번에 눌렀던 것은 아니다. 바빌로니아 출신의 마니(216~274/277)는 240년대에 샤푸르 1세의 궁정에 들어가 왕의 보호를 받으며 가르침을 폈다. 마니교는 빛과 어둠이 싸우는 세계관 위에 조로아스터교와 그리스도교, 불교의 요소를 모아 엮은 종교로, 마니가 샤푸르에게 바친 책 『샤푸라간』이 전해 오는 글의 하나이다. 마니는 스스로를 붓다·조로아스터·예수의 뒤를 잇는 마지막 예언자라 하고 가르침을 직접 만든 글자로 적게 했으며, 선교사들을 곳곳에 보내 교회 조직을 갖추었다. 마니교 문헌은 시리아어·중세 페르시아어·파르티아어·소그드어 등으로 옮겨져 사산 안팎에서 읽혔다. 이 종교는 인도·중앙아시아와 로마 제국으로 퍼졌고 뒷날 중국에까지 이르렀다. 사제 카르티르는 샤푸르 1세 때 처음 이름이 오르내렸고, 호르미즈드 1세(재위 270~271 무렵)와 바흐람 1세(271~274 무렵)를 거쳐 바흐람 2세(274~293) 때 가장 큰 힘을 얻어 나크셰 로스탐 등지에 비문을 새겼다. 비문에서 그는 유대인·불교도·힌두교도·나사렛파·그리스도교도·만다이아교도·마니교도를 쫓아냈다고 적고 조로아스터교 신전 불을 세웠다고 자랑하지만, 실제 박해의 범위는 학자들이 갈린다. 카르티르의 비문들에는 그가 사제직과 불의 신전을 늘렸고 영혼의 저승길을 직접 보았다고 하는 환상 서술도 들어 있다. 마니는 바흐람 1세 때 붙잡혀 감옥에서 죽었고(274~277년설), 제자들은 흩어졌다. 바흐람 3세(293, 몇 달)에 이어 나르세(293~302)가 왕위에 오르면서 권력의 틀이 바뀌었다."
  subjects: [sasanian-empire, roman-empire]
  tags: [religion, society]
  sources: ["Samuel N. C. Lieu, Manichaeism in the Later Roman Empire and Medieval China (2판, Mohr Siebeck, 1992)", "Mary Boyce, Zoroastrians: Their Religious Beliefs and Practices (Routledge, 1979)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(2): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: himyar-unification-275
  year: 270
  endYear: 300
  title:
    ko: "힘야르의 사바 병합(275 무렵)과 남아라비아의 통일(290 무렵)"
  summary:
    ko: "3세기 남아라비아의 힘은 고지의 힘야르로 쏠렸다. 힘야르 왕들은 자파르를 도읍으로 삼아 마리브의 사바 왕과 번갈아 우위를 다투었는데, 275년 무렵 사바의 수도 마리브까지 거두며 사바 왕국을 흡수했다. 바로 이어 290년 무렵부터 하드라마우트를 눌러 남아라비아 왕국을 하나로 묶었다(하드라마우트를 아우른 때를 300년 무렵으로 보는 학설도 있다). 비문에 새겨진 연대는 왕의 이름과 상대 순서로 짐작한 것이어서 앞뒤 십수 년의 오차가 따른다. 힘야르 왕들은 '사바와 두 라이단, 하드라마우트와 야므낫, 그리고 그들의 아랍'의 왕을 칭했는데, 이 칭호는 2세기 후반 명문에도 보이고 통일 뒤 굳어져 옛 세 나라와 남서 해안(야므낫)을 아우르는 통치를 자랑했다. 힘야르는 북쪽 나지드의 유목 부족과도 관계를 맺었지만 사막 안쪽을 직접 다스리지는 못했다. 나라는 마리브의 큰 댐과 관개 농업, 홍해와 인도양을 오가는 교역에서 부를 얻었다. 힘야르 사람들은 사바어와 같은 계통의 말과 글을 썼고, 사바 시대부터 이어진 마리브의 관개 전통과 신전 제도를 물려받았다. 힘야르 고지는 비가 많아 계단식 밭농사가 널리 퍼졌고, 비문은 유목 부족인 '아랍'이 힘야르 군대에 보조병으로 쓰였음을 보여 준다. 지방의 부족 우두머리(카일)들은 힘야르 왕 아래에서 제 자리를 지켰다고 비문은 전한다. 홍해 맞은편의 악숨은 3세기 말부터 힘을 키워 힘야르와 맞섰고, 이 대립은 뒤에 종교 문제와 얽힌다. 한편 같은 세기 전반에 사산의 아르다시르 1세가 걸프 맞은편 동아라비아 해안까지 영향권에 넣었다는 전승이 있으나 학설이 갈린다(「아르다시르 1세의 이란 통일: 종속 왕국의 병합(222~240)」(앞의 사건))."
  subjects: [himyarite-kingdom, saba-kingdom, hadramawt-kingdom]
  links:
    - { from: himyarite-kingdom, to: saba-kingdom, note: "사바 병합(275 무렵)" }
    - { from: himyarite-kingdom, to: hadramawt-kingdom, note: "하드라마우트 병합(290 무렵)" }
  tags: [politics]
  sources: ["Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Christian Julien Robin, 'Arabia and Ethiopia', in Scott Fitzgerald Johnson 엮음, The Oxford Handbook of Late Antiquity (Oxford University Press, 2012)", "Glen W. Bowersock, The Throne of Adulis: Red Sea Wars on the Eve of Islam (Oxford University Press, 2013)"]

- id: egypt-monasticism-285
  year: 285
  endYear: 360
  title:
    ko: "이집트의 수도 생활: 안토니오스와 파코미오스(285~360)"
  summary:
    ko: "그리스도교의 수도 생활은 3~4세기 로마령 이집트에서 시작되었다. 안토니오스(251 무렵~356)는 중부 이집트 코마의 부유한 집에서 태어나 재산을 나누어 주고 285년 무렵(270년 무렵설도 있다) 사막으로 물러나 홀로 수행했다. 아타나시오스가 쓴 『안토니오스의 생애』(360 무렵)는 그를 은수사의 본보기로 그렸고, 이 책이 지중해 세계에 수도 생활의 이상을 퍼뜨렸다. 안토니오스는 311년 박해 때 알렉산드리아에서 갇힌 신자들을 도왔고, 아리우스 논쟁 때는 아타나시오스 편에 섰다고 전한다. 이어 니트리아와 스케티스 같은 사막 골짜기에 은수사들이 모여들었다. 파코미오스(292 무렵~346 무렵, 348년설도 있다)는 320년 무렵 상이집트 타벤니시에서 처음으로 규칙과 공동 식사, 공동 노동을 갖춘 공주 수도원을 세웠고, 그의 수도원 연합은 그가 죽을 무렵 여덟 곳 안팎에 수백 명, 뒤에는 수천 명 규모로 자랐다. 파코미오스는 젊어서 로마군에 끌려갔다가 군인들을 돕는 그리스도교도의 친절을 보고 신자가 되었다고 전하며, 그의 누이 마리아는 여성 수도원을 세웠다고 한다. 수도원의 이상은 이집트에서 팔레스타인과 시리아로, 4세기 중엽 이후 서방으로 퍼졌다. 이집트에서는 콥트어(그리스 글자를 바탕으로 한 이집트어)가 그리스도교 문헌의 언어가 되어 수도원이 교회와 문화의 중심이 되었다. 이 흐름은 뒷날 바실리오스와 베네딕투스의 수도 규칙에도 영향을 주었다. 303년 디오클레티아누스의 박해(「그리스도교 대박해(303~311)와 갈레리우스의 관용 칙령」(뒤의 사건))를 겪은 이집트 교회는 313년의 공인(「그리스도교의 공인: 밀라노 협약(313)과 니케아 공의회(325)」(뒤의 사건)) 뒤 알렉산드리아 총대주교를 중심으로 힘을 키웠다."
  subjects: [roman-empire]
  tags: [religion, society]
  sources: ["Athanasius(아타나시오스), Vita Antonii(『안토니오스의 생애』) (Robert C. Gregg 영역, Paulist Press, 1980)", "William Harmless, Desert Christians: An Introduction to the Literature of Early Monasticism (Oxford University Press, 2004)", "Armand Veilleux 역주, Pachomian Koinonia (Cistercian Publications, 1980~1982)"]

- id: lakhmid-kingdom-293
  year: 293
  endYear: 602
  title:
    ko: "라흠 왕국과 알히라: 사산의 아랍 변경(293~602)"
  summary:
    ko: "알히라(지금 이라크 나자프 남동쪽)를 도읍으로 한 라흠 왕국은 사산 제국의 서쪽 사막 변경을 지키는 아랍 왕조의 나라였다. 아므르 이븐 아디를 시조로 전하며, 나르세가 293~296년 무렵 새긴 파이쿨리 비문에 라흠 왕 아므르가 이름을 올려 이 무렵부터 사산에 딸린 나라로 본다. 그 아들 이므루 알카이스 1세(~328)의 무덤 비문(나마라 비문, 328년)은 나바테아 문자로 새긴 이른 아랍어 비문으로 쓰였고 그를 '모든 아랍의 왕'이라 새겼다. 라흠은 동방 교회 그리스도교와 아랍 시가 퍼지는 곳이었고, 이므루 알카이스 뒤로 여러 왕이 이어졌고, 그 힘은 알문디르 3세(재위 505~554 무렵) 때 가장 컸다. 그는 사산 편에서 동로마의 시리아를 거듭 쳤고 531년 칼리니쿰(라카) 전투 때 사산군과 함께했다고 프로코피우스는 쓴다. 554년 칼키스(킨나스린) 가까이의 싸움(야움 할리마)에서 동로마의 아랍 동맹 가산의 알하리스 이븐 자발라와 맞붙다 죽었다고 전한다(「가산 왕국과 동로마의 아랍 동맹: 알하리스 이븐 자발라(529~584)」(뒤의 사건)). 그 뒤 아므르 3세(554~569)와 카부스(569~573), 사산 총독이 직접 다스린 짧은 때(573~574)를 거쳐 알문디르 4세(574~580)가 이었고, 마지막 왕 누만 3세(재위 580~602)는 그리스도교로 돌아섰다고 전하며, 호스로 2세가 602년 그를 폐위하고 라흠을 사산 총독의 직할로 삼았다(누만이 갇혀 죽었다는 전승도 있다). 얼마 뒤 디카르 싸움에서 바크르 부족이 사산군을 이겼다고 전하나 해는 갈린다. 알히라는 동방 교회의 수도원과 아랍 시인이 모이는 곳으로 이름을 남겼다. 알히라 부근에는 카와르낙과 사디르 같은 궁전이 있었고, 그리스도교도 시인 아디 이븐 자이드를 비롯한 시인들이 궁정을 드나들었다고 한다. 라흠은 가산과 아랍 변경의 목초지와 대상로를 두고 겨루었고, 사산과 동로마는 모두 이 두 왕조를 통해 사막의 부족을 달래거나 부렸다."
  subjects: [lakhmid-kingdom, sasanian-empire, byzantine-empire]
  links:
    - { from: sasanian-empire, to: lakhmid-kingdom, note: "알히라의 라흠을 종속 왕국으로 둠(293 무렵)" }
    - { from: sasanian-empire, to: lakhmid-kingdom, note: "누만 3세 폐위와 직할(602)" }
  tags: [politics, society]
  sources: ["Irfan Shahîd, Byzantium and the Arabs in the Sixth Century, vol. 1 (Dumbarton Oaks, 1995)", "Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "타바리, 『예언자들과 왕들의 역사』", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: shapur-ii-309
  year: 309
  endYear: 379
  title:
    ko: "샤푸르 2세의 치세: 아랍 원정과 아디아베네의 병합(309~379)"
  summary:
    ko: "호르미즈드 2세가 309년 죽고 맏아들 아두르 나르세가 몇 달 만에 귀족들에게 살해된 뒤, 귀족들이 어린 샤푸르 2세(재위 309~379)를 왕위에 세웠다. 전승은 그가 태어나기도 전에 왕관을 받았다고 하며, 귀족과 사제단이 섭정을 맡다가 325년 무렵 직접 다스리기 시작했다. 샤푸르 2세는 나라 안팎에서 시리아 사막의 아랍 부족과 동아라비아 해안을 쳐서 몰아냈고, 그 일로 아랍 전승에서 '어깨를 꿰뚫는 이'라 불렸다고 전한다(타바리). 350년대에는 동쪽에서 키오니타이와 싸우다 358년 그 왕 그룸바테스를 동맹으로 삼아 아미다로 나섰다고 암미아누스는 쓴다. 샤푸르 2세는 도시 건설에도 힘써 수사를 다시 세우고 포로를 정착시켰다고 전한다. 337년 콘스탄티누스가 죽자 로마와 오랜 전쟁이 시작되었다. 니시비스를 세 번 에워쌌으나 얻지 못했고, 344년 싱가라 싸움과 359년 아미다 함락(암미아누스가 증인이다)을 거쳐 363년 율리아누스가 전사한 뒤 요비아누스가 다섯 지방과 니시비스를 내주는 조약을 맺었다(「로마와 사산 페르시아: 갈레리우스의 승리와 니시비스 조약(298), 율리아누스의 원정과 요비아누스의 조약(363)」(앞의 사건)). 샤푸르 2세 때 조로아스터교 대사제 아두르바드 이 마라스판단이 경전 아베스타의 정리를 이끌었다는 전승이 있다(연대는 학설이 갈린다). 콘스탄티누스가 그리스도교를 받아들인 뒤 사산 안의 그리스도교도는 로마와 내통한다는 의심을 받아 340년 무렵부터 박해를 겪었다. 아디아베네는 224년 뒤 사산의 종속 왕국으로 있다가 샤푸르 2세 말기인 379년 무렵 사산의 속주가 된 것으로 본다. 샤푸르 2세는 70년을 다스린 뒤 379년 죽었고, 이복형제 아르다시르 2세(379~383)가 이었는데, 그는 아디아베네의 종속 왕으로 있다가 즉위했다."
  subjects: [sasanian-empire, adiabene, roman-empire]
  links:
    - { from: sasanian-empire, to: adiabene, note: "아디아베네 병합(379 무렵)" }
  tags: [politics, war]
  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Josef Wiesehöfer, Ancient Persia from 550 BC to 650 AD (Azizeh Azodi 영역, I. B. Tauris, 1996)"]

- id: church-of-the-east-410
  year: 410
  endYear: 486
  title:
    ko: "사산 제국의 그리스도교: 동방 교회의 독립(410~424)과 신학 정립(484~486)"
  summary:
    ko: "사산 제국 안의 그리스도교도는 3~4세기에 메소포타미아와 이란 서부를 중심으로 퍼졌고, 샤푸르 2세 때(340년 무렵~) 동로마와 같은 신앙이라는 의심 속에 박해를 받았다. 야즈데게르드 1세(재위 399~420)는 그리스도교도를 너그럽게 대했고, 410년 셀레우키아-크테시폰에서 모인 공의회(마르 이삭이 이끌었다)는 사산 안의 교회 조직을 하나로 묶고 니케아 신조를 받아들였다. 이 공의회는 동로마 사절 마루타 주교의 중재로 열렸다고 하며, 사산 안의 그리스도교도는 대개 샤푸르 1세 때 끌려온 시리아·아르메니아 포로의 후손과 메소포타미아의 시리아어 사용자였다. 424년 다드이쇼의 회의는 이 교회의 총대주교가 동로마 교회의 감독을 받지 않는다고 선언해 사실상 독립을 확인했다. 이어 431년 에페소스 공의회(「교리 논쟁: 에페소스 공의회(431)와 칼케돈 공의회(451)」(뒤의 사건))에서 단죄된 네스토리오스의 가르침을 따르던 신학자 일부가 동로마에서 사산 땅으로 옮겨 왔다. 484년 벳 라파트 회의에서는 니시비스 주교 바르사우마가 이끈 쪽이 테오도로스의 신학을 받아들였으나 교회 안에서 인정받지 못해 이듬해 뒤집혔고, 486년 셀레우키아-크테시폰 회의(아카키오스)에서 두 본성을 구분하는 신조로 일치를 되찾았다. 니시비스의 학교는 시리아어로 신학과 주석을 가르쳐 동방 교회의 신학자를 길러 냈다. 총대주교(카톨리코스)는 셀레우키아-크테시폰에 자리 잡았고 사산 왕은 이 자리를 공식 창구로 삼았다. 그러나 야즈데게르드 1세 말기와 바흐람 5세(재위 420~438) 때 박해가 다시 일었고 야즈데게르드 2세(재위 438~457) 때에도 이어졌으며, 조로아스터교 사제단은 개종자와 시신 매장 같은 문제를 들어 그리스도교도를 압박하기도 했고, 순교자 이야기는 시리아어 『페르시아 순교자 행전』에 모였다. 이렇게 '동방 교회'(뒷날 네스토리우스파)는 동로마와 선을 긋고 페르시아 왕의 보호를 받는 교회로 자리 잡았다. 라흠 왕국의 알히라도 이 교회의 중심의 하나였다."
  subjects: [sasanian-empire, byzantine-empire, lakhmid-kingdom]
  tags: [religion, society]
  sources: ["Samuel Hugh Moffett, A History of Christianity in Asia, vol. 1: Beginnings to 1500 (2판, Orbis Books, 1998)", "Sebastian P. Brock, 'The Church of the East in the Sasanian Empire up to the Sixth Century and its Absence from the Councils in the Roman Empire', Syriac Dialogue (1996)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(2): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: moorish-kingdoms-477
  year: 477
  endYear: 533
  title:
    ko: "반달 아프리카의 무어 왕국들: 마우로로마 왕국과 아우레스(477~533)"
  summary:
    ko: "반달 왕국(앞의 사건 「가이세리크의 반달 왕국: 아프리카 이동(429)·카르타고(439)·로마 약탈(455)」)이 선 뒤 마우레타니아와 누미디아의 산지에는 반달의 지배가 미치지 않았다. 477년 가이세리크가 죽자 무어인(베르베르 지도자들)은 더욱 자립했다. 알타바(지금 알제리 오란 부근)를 도읍으로 한 마우로로마 왕국에서는 마수나가 508년 비문에서 '무어인과 로마인의 왕'을 칭했고, 로마계 주민과 무어인을 함께 거느렸다. 아우레스 산지에서는 후네리크가 죽은 484년 무렵 마스티스가 반달에 맞서 자립해 '임페라토르'를 칭했다고 아리스 비문이 전한다(그 지배가 수십 년이라고 새겼다). 마스티스 뒤에는 이아브다스가 이었다. 반달 왕 군타문트(재위 484~496)와 트라사문트(496~523)는 이들을 누르지 못했고, 523년 라구아탄 부족을 이끈 카바온이 트리폴리타니아에서 반달군을 꺾었다고 프로코피우스는 전한다. 트라사문트 뒤에는 후네리크의 아들 힐데리크(재위 523~530)와 겔리메르(530~534)가 이었다. 533년 동로마의 반달 원정 때 마수나가 동로마와 손잡았다는 서술이 있으나, 프로코피우스의 '마소나스'가 같은 인물인지는 학자들이 갈린다. 반달 왕국은 아리우스파가 가톨릭 주교를 자주 박해한 나라였기에, 무어 왕국들 아래의 로마계 주민은 반달의 지배가 풀린 것을 반겼다는 해석이 있다(모데랑). 508년 알타바 비문에는 마수나와 그가 다스린 알타바·카스트라 세베리아나 같은 도시가 나오고, 반달은 해안 평야의 도시와 올리브 농장을 지켰으나 남쪽과 서쪽 산지에는 오래 힘이 미치지 않았다. 이 시기 무어 왕국들은 로마 속주 제도와 라틴어 문화를 이어받으면서도 부족 중심 통치와 결합한 독자적 정치 체제를 이루었고, 이는 534년 이후 동로마와의 관계로 이어진다(「유스티니아노스의 아프리카 재정복: 반달 왕국의 멸망(533~534)」(뒤의 사건))."
  subjects: [vandal-kingdom, mauro-roman-kingdom, aures-kingdom]
  tags: [politics, society]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Yves Modéran, Les Maures et l'Afrique romaine (IVe–VIIe siècle) (École française de Rome, 2003)", "Andrew H. Merrills·Richard Miles, The Vandals (Wiley-Blackwell, 2010)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: kavad-mazdak-488
  year: 488
  endYear: 531
  title:
    ko: "카바드 1세와 마즈다크 운동(488~531)"
  summary:
    ko: "페로즈 1세가 에프탈에게 져 죽은 뒤(484) 형제 발라시가 왕위에 있다가 488년 귀족들에게 쫓겨나고, 페로즈의 아들 카바드 1세가 즉위했다. 에프탈은 중앙아시아 초원의 세력으로 페로즈 1세에게 두 번 이겨 사산에서 공물을 받아 갔고, 카바드의 즉위와 복위에도 얽혀 있었다. 카바드는 귀족의 힘을 누르려 평등을 내세운 마즈다크의 운동을 한때 보호했다고 전한다. 마즈다크는 재산과 아내를 공유해야 한다고 했다고 하지만, 이는 적대적인 후대 사료의 서술이라 실제 가르침은 사료에 따라 갈린다. 귀족과 사제단은 496년 카바드를 폐위하고 가마스프(재위 496~498)를 세운 뒤 카바드를 '망각의 성'에 가두었다. 그러나 카바드는 탈출해(전승은 아내의 도움을 받았다고 한다) 에프탈의 도움으로 498년 왕위를 되찾았다. 이후 카바드는 마즈다크파와 거리를 두었고, 마즈다크와 그 추종자들이 처형·학살되었다고 전한다(주체를 카바드로 보는 서술과 아들 호스로 1세로 보는 서술이 갈리고, 연대는 524~531년설이며 규모도 학설이 갈린다). 이 일로 귀족 가문의 영지와 힘이 줄고 왕권이 세졌다는 해석이 있다. 카바드는 에프탈에게 낼 돈을 동로마에 요구했다가 거절당한 일이 한 구실이 되어 502~506년 동로마 황제 아나스타시우스와 싸워 아미다를 함락(502/503)했고, 527년 유스티노스 1세·유스티니아노스(뒤의 사건 「유스티니아노스 1세의 치세: 『로마법 대전』·니카 반란(532)·하기아 소피아(537)와 541년의 역병」) 때 다시 전쟁이 시작되어 530년 다라 전투에서는 졌으나 531년 칼리니쿰에서는 라흠의 알문디르 3세가 사산 편에서 함께 싸운 끝에 이겼다. 카바드는 세금 조사를 시작해 아들 호스로 1세가 다듬는 개혁의 터를 닦았고, 531년 죽었다."
  subjects: [sasanian-empire, byzantine-empire, lakhmid-kingdom]
  tags: [politics, society]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Josef Wiesehöfer, Ancient Persia from 550 BC to 650 AD (Azizeh Azodi 영역, I. B. Tauris, 1996)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]
