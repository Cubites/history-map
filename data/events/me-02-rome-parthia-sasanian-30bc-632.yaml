- id: garmul-altava-570
  year: 570
  endYear: 579
  title:
    ko: "가르물의 항쟁과 마우로로마 왕국의 끝, 알타바 왕국(570~579)"
  summary:
    ko: "6세기 중엽 이후 동로마 아프리카의 변경에서는 무어인 우두머리 가르물(재위 570 무렵~578)이 나타나 동로마를 거듭 쳤다. 546~548년의 평화 뒤 한 세대 동안 비교적 안정되었던 아프리카는 560년대 말부터 다시 무어의 압력을 받았다. 이 무렵 동로마는 568년 롬바르드의 이탈리아 침입(앞의 사건 「롬바르드의 이탈리아(568)와 라벤나 총독령: 알보인에서 아이스툴프까지」)과 572년 시작된 사산과의 전쟁으로 병력이 모자랐고, 아프리카의 도시들은 성벽과 적은 수비대에 의지하고 있었다. 비클라룸의 요한네스의 『연대기』는 가르물이 570년 아프리카 도독 테오도로스와 장군 테오닥투스를 죽이고 571년 그 후임 아마빌리스를 죽였다고 전하고, 571년 동로마군을 크게 이겼다고 한다. 가르물은 마우로로마 왕국의 왕으로 본다. 무어인은 산지와 건조한 고원에서 기습과 이동으로 싸웠고, 그 지도자들은 로마식 칭호와 부족 질서를 함께 지녔다. 동로마는 이들을 힘으로 누르거나 칭호와 선물로 달래는 길을 번갈아 썼다. 카이사르 티베리오스(578년 9월부터 황제 티베리오스 2세)는 장군 겐나디우스를 아프리카에 보내 577~578년 원정에 나서게 했다. 사료는 겐나디우스가 가르물의 백성에게 공포를 주는 방식으로 싸웠다고 전한다. 가르물은 578년(579년설) 싸움에서 죽었고, 무어 부족들은 동로마의 지배를 받아들였다. 이 일로 마우로로마 왕국은 무너졌지만, 알타바 둘레에는 작은 왕국(알타바 왕국)이 이어졌다고 본다. 알타바는 508년 마수나의 비문이 보여 주듯 로마 시대부터 이어진 도시로, 로마계 주민과 무어인이 한 도시 안에서 어울려 살았다. 가르물 이후 알타바 왕들의 이름은 670년대까지 사료에 전하지 않는다."
  subjects: [mauro-roman-kingdom, altava-kingdom, byzantine-empire]
  tags: [war, politics]
  sources: ["John of Biclar(비클라룸의 요한네스), Chronica(『연대기』) (Kenneth Baxter Wolf 영역, Conquerors and Chroniclers of Early Medieval Spain, Liverpool University Press, 1990)", "Yves Modéran, Les Maures et l'Afrique romaine (IVe–VIIe siècle) (École française de Rome, 2003)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: muhammad-birth-revelation-570
  year: 570
  endYear: 613
  title:
    ko: "무함마드의 탄생과 첫 계시(570 무렵~613)"
  summary:
    ko: "무함마드는 570년 무렵 메카의 쿠라이시 하심 씨족에서 태어났다고 전한다(전승은 악숨령 예멘의 아브라하가 메카를 치려다 실패한 '코끼리의 해'로 꼽는다). 이 무렵 그의 둘레에는 사산이 예멘과 마준을, 동로마가 시리아를 거느리고 있었다. 아버지 압둘라는 태어나기 전에, 어머니 아미나는 어린 시절에 죽어 할아버지 압둘 무탈리브과 삼촌 아부 탈리브이 키웠다. 하심 씨족은 카바를 찾는 순례자에게 물을 대는 일을 맡았고, 어린 무함마드는 한동안 사막의 바누 사드 부족에 맡겨 길러졌다는 전승이 있다. 젊어서 대상을 따라 시리아까지 오갔고 믿을 만한 사람이라는 뜻의 '알아민'으로 불렸다고 하며, 595년 무렵 부유한 과부 하디자와 혼인했다. 605년 무렵 카바를 고치던 때 쿠라이시 씨족들이 검은 돌을 누가 제자리에 놓을지로 다투자 무함마드가 중재했다는 전승도 있다. 610년 무렵 메카 근처 히라 동굴에서 천사 지브릴을 통해 첫 계시를 받았다는 것이 무슬림 전승이다(쿠란 96장의 첫 구절). 하디자와 사촌 알리, 가까운 벗 아부 바크르, 해방 노예 자이드가 처음 믿은 이들이라고 하며, 3년쯤 조용히 전한 뒤 613년 무렵부터 공개적으로 가르쳤다. 가르침의 핵심은 오직 하나인 알라를 섬기고 심판의 날에 대비하며 약자를 돌보라는 것이었다. 무함마드의 생애에 관한 가장 이른 전기(이븐 이스하크와 이븐 히샴, 8~9세기)와 타바리의 연대기는 모두 한 세기 이상 뒤의 기록이라, 역사학자들은 전승의 신뢰도를 두고 의견이 다르며 어린 시절 일화일수록 사실로 확인하기 어렵다고 본다. 이 글은 전승을 전승으로 적고, 신앙의 해석은 다루지 않는다."
  subjects: [sasanian-empire, byzantine-empire, aksumite-yemen]
  tags: [religion, society]
  sources: ["W. Montgomery Watt, Muhammad at Mecca (Clarendon Press, 1953)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)", "Frank E. Peters, Muhammad and the Origins of Islam (State University of New York Press, 1994)", "Robert G. Hoyland, In God's Path: The Arab Conquests and the Creation of an Islamic Empire (Oxford University Press, 2015)"]

- id: sasanian-yemen-570
  year: 570
  endYear: 628
  title:
    ko: "사산의 예멘과 마준 지배: 와흐리즈의 사나 점령(570)에서 바단의 이슬람 수용(628)까지"
  summary:
    ko: "아브라하 가문의 악숨령 예멘 세력을 몰아내려 한 사이프 이븐 디 야잔은 동로마의 도움을 얻지 못하자 라흠의 알히라를 거쳐 호스로 1세에게 청했다. 호스로는 장군 와흐리즈에게 군대를 주어 보냈다(타바리는 감옥에서 뽑은 800명이라 쓰며 병력 규모는 서술마다 다르다). 와흐리즈는 호스로 1세의 노장으로 디일람 출신 병사를 이끌었다고 전하며, 570년 무렵 사나를 차지했다. 전승은 쿠라이시의 압둘 무탈리브을 비롯한 아라비아 부족의 사절들이 사이프를 찾아가 승리를 축하했다고 전한다. 처음에는 사이프를 왕으로 앉힌 속국이었다가, 그가 575~578년 사이 악숨 출신 시종들에게 살해된 뒤 와흐리즈가 다시 군대를 이끌고 와 사이프의 아들 마아디카리브를 왕으로 세웠다. 예멘은 곧 사산의 속주가 되어 총독직이 와흐리즈에서 아들 마르주반 등으로 이어졌고, 호스로 2세 때 바단이 총독이 되었다. 사산은 총독이 예멘 부족 수장들을 통해 간접적으로 다스리게 했다고 한다. 사산 병사와 예멘 여자 사이에서 난 아들들은 '아브나'라 불리는 공동체를 이루었다. 이로써 사산은 걸프와 인도양으로 이어지는 바닷길을 쥐어 동로마와 악숨을 견제할 수 있었다고 평가된다. 걸프 맞은편 오만 해안과 바레인은 '마준'이라는 속주로 3세기부터 사산이 영향권에 두었고, 6세기에는 총독들이 소하르 같은 항구와 바레인(바탄 아르다시르)을 맡아 걸프와 인도양 교역을 감독했다. 호스로 2세가 628년 죽은 뒤(「사산 제국의 내분과 야즈데게르드 3세의 즉위(628~632)」(뒤의 사건)) 예멘 총독 바단은 본국과 끊어졌다. 전승에 따르면 호스로가 바단에게 무함마드를 잡아 오라고 명했는데, 바단이 보낸 사자들이 메디나에 이르렀을 때 무함마드가 호스로의 죽음을 알렸고 이에 바단이 이슬람을 받아들였다고 한다(전승마다 순서가 갈리고, 개종의 해는 628년설이 가장 이르며 631년 무렵까지 내려 보는 설도 있다). 이로써 사산의 예멘 지배는 사실상 끝났다."
  subjects: [sasanian-empire, aksumite-yemen]
  tags: [politics, war]
