- id: roman-egypt-30bc
  year: -29
  endYear: 14
  title:
    ko: "로마의 이집트 속주(기원전 30~기원후 14): 아우구스투스의 직할지와 곡창"
  summary:
    ko: "기원전 30년 8월 옥타비아누스가 알렉산드리아에 들어가고 클레오파트라 7세가 죽어 프톨레마이오스 왕국이 끝났다(앞의 사건 「안토니우스와 클레오파트라 7세: 동방의 재편(기원전 41~34), 악티움 해전(31)과 프톨레마이오스 왕국의 끝(30)」). 아우구스투스는 이집트를 원로원이 보내는 총독의 속주로 두지 않고 황제가 직접 거느리는 땅으로 삼았다. 원로원 의원과 높은 기사는 황제의 허락 없이 이집트에 들어갈 수 없었고(타키투스 『연대기』 2.59), 총독은 기사 신분의 이집트 장관(praefectus Aegypti)이 맡았다. 첫 장관 가이우스 코르넬리우스 갈루스(기원전 30~26)는 남쪽 테바이스의 반란을 누르고 공적을 비문에 자랑하다가 아우구스투스의 눈 밖에 나 소환되어 기원전 26년 스스로 목숨을 끊었다. 뒤를 이은 아일리우스 갈루스(기원전 26~24)는 「아일리우스 갈루스의 아라비아 원정(기원전 26~25)」(뒤의 사건)에 나섰고, 가이우스 페트로니우스(기원전 24~22 무렵)는 남쪽 쿠시 왕국과 싸운 끝에 기원전 21/20년 화의를 맺었다고 한다. 로마는 나일 골짜기의 수로를 다시 쳐 농업 생산을 늘렸고, 프톨레마이오스 때부터 내려온 신전 사제단과 알렉산드리아의 그리스인·유대인·이집트인 사이의 몫도 그대로 이었다. 알렉산드리아 시민권은 그리스계 가운데서도 일부에게만 열려 있었고, 이집트인 농민 대부분은 시민 밖의 신분이었다. 로마는 이집트의 부를 군대 급료와 로마 시의 곡물 공급에 돌려 썼다고 흔히 설명하며, 치안은 처음 군단 셋이 맡았다. 인두세(라오그라피아)가 새로 자리를 잡아 그리스 도시 시민과 이집트 농민의 세 부담이 갈렸다. 이집트의 곡물은 알렉산드리아에서 배로 로마에 보내졌고, 요세푸스가 전하는 아그리파 2세의 연설에는 이집트가 로마의 곡물 수요 가운데 넉 달 치를 댄다는 말이 나온다(『유대 전쟁사』 2.386)."
  subjects: [ptolemaic-kingdom, roman-empire]
  tags: [politics, economy]
  sources: ["Tacitus(타키투스), Annales(『연대기』) 2.59 (John Jackson 영역, Loeb, 1931~1937)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 2.386 (H. St. J. Thackeray 영역, Loeb, 1927~1928)", "Strabo(스트라본), Geographica(『지리지』) 17.1.12~13 (H. L. Jones 영역, Loeb, 1917~1932)", "Naphtali Lewis, Life in Egypt under Roman Rule (Oxford University Press, 1983)", "Alan K. Bowman, Egypt after the Pharaohs, 332 BC–AD 642 (British Museum Press, 1986)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)"]

- id: nabataea-petra-hegra-30bc
  year: -29
  endYear: 40
  title:
    ko: "나바테아 왕국의 번영: 페트라와 헤그라, 리히얀의 합병(기원전 30~기원후 40)"
  summary:
    ko: "나바테아 왕국은 페트라를 도읍으로 향료와 유향을 나르는 대상로를 쥐고 번영했다. 왕국의 수입은 남아라비아의 유향·몰약을 가자와 지중해로 중개하는 일과 사해에서 나는 역청(아스팔트)을 이집트에 파는 일에서 나왔다. 스트라본은 로마에서 페트라를 보고 온 아테노도로스에게 들은 대로 이 도시가 법을 잘 지키고 외국인이 많이 사는 곳이라고 적었다(『지리지』 16.4.21). 페트라의 암벽 정면 건축(지금 '알카즈네')은 이집트·그리스·메소포타미아 양식이 섞여 있으며 이 무렵 새겨진 것으로 보지만 연대는 학설이 갈린다. 기원전 1세기 말에서 기원후 1세기 초가 전성기로, 오보다스 3세(재위 기원전 30~9)의 실력자 실라이오스가 로마와 외교를 맡다가 기원전 9년 무렵 헤롯과의 다툼으로 아우구스투스의 미움을 사 몇 해 뒤 로마에서 처형되었다. 아레타스 4세(재위 기원전 9~기원후 40)가 서면서 왕국은 페트라의 건축과 왕묘로 이름난 가장 안정된 때를 맞았다. 왕국은 남쪽으로 히자즈 북부의 오아시스로 뻗어 헤그라(지금의 마다인살리흐)를 둘째 도시로 삼고 암벽 무덤을 새겼다. 이 골짜기 곁의 데단(지금의 알울라)에 있던 리히얀 왕국은 기원전 1세기 사이에 사라졌는데, 카스켈은 나바테아가 흡수한 때를 스트라본의 갈루스 원정 기록과 헤그라의 아레타스 4세 때 비문에 따라 기원전 24년 무렵으로 추정한다(리히얀의 끝은 기원전 1세기 안에서 학설이 갈리고, 기원전 9년 무렵까지 단계로 흡수되었다고 보는 설도 있다). 나바테아인은 아람어를 문어로 쓰면서 아랍어 이름을 그대로 새겨, 뒷날 아랍 문자의 뿌리가 되는 글자를 남겼다. 아레타스 4세의 딸은 갈릴래아 영주 헤롯 안티파스와 혼인했다가 버림받았고, 이를 둘러싼 국경 다툼에서 아레타스가 36년 안티파스의 군대를 이겼다. 한편 같은 무렵 다마스쿠스에는 아레타스가 세운 총독이 있었다고 신약성경이 전한다(『고린도후서』 11:32). 왕국의 끝은 「아라비아 속주의 설치와 나바테아의 끝(106)」(뒤의 사건)에서 다룬다."
  subjects: [nabataean-kingdom, lihyan, herodian-judea, roman-empire]
  links:
