- id: mecca-quraysh-500
  year: 500
  endYear: 610
  precision: decade
  title:
    ko: "이슬람 이전의 메카: 쿠라이시와 카바, 대상 교역(500 무렵~610)"
  summary:
    ko: "6세기 아라비아 서부 히자즈의 메카는 건조한 골짜기에 카바 성소가 선 도시였다. 카바는 이슬람 이전에도 여러 신의 성소였고, 전승은 360 신상이 있었다고 한다. 이슬람 전승은 카바를 아브라함과 아들 이스마엘이 세웠다고 하고, 곁의 샘 잠잠은 하갈과 이스마엘 이야기와 이어 말한다. 카바 둘레의 성역(하람)에서는 피를 흘리는 일이 금지되어 이곳이 거래와 화해의 자리가 되었다고 전한다. 메카를 다스린 부족 쿠라이시는 5세기 후반~6세기 어림에 쿠사이 이븐 킬랍이 흩어진 씨족을 모았다고 전하며, 하심·우마이야·마크줌 등의 씨족이 있었다. 쿠란 106장은 쿠라이시의 겨울과 여름 대상 여행을 말하는데, 목적지는 쿠란이 이름으로 대지 않고 주석과 아랍 전승이 겨울은 예멘, 여름은 시리아로 채운다. 메카에서는 성스러운 달에 싸움을 금하는 휴전이 있었고, 근처 시장(오카즈)에서 시와 장사가 오갔다. 메카가 향료 무역의 큰 중심지였다는 통설을 두고 패트리샤 크로네 같은 학자는 교역 규모가 작았다고 반박하여 학설이 갈리며, 메카를 대상로의 큰 중간 기착지라기보다 성소와 시장이 지역 부족을 이어 주는 순례 도시로 보는 해석도 있다. 메카에는 국가가 없었고 부족 어른의 합의로 움직였다. 주민 대부분은 알라를 높은 신으로 두면서 알라트·웃자·마나트 같은 신도 섬겼고, 이웃 야스립(메디나)과 하이바르에는 유대 부족이, 나지란에는 그리스도교도가 살았으며 일신교를 찾는 '하니프'도 있었다. 570년 무렵 악숨령 예멘의 아브라하가 메카를 치려 했다는 전승이 있고(「악숨령 예멘과 아브라하: 마리브 댐 수리(548 무렵)와 '코끼리의 해'(570 무렵)」(뒤의 사건)), 아라비아 둘레에서는 사산과 동로마가 라흠과 가산을 앞세워 영향을 겨루었다. 이런 환경 속에서 쿠라이시의 하심 씨족에서 무함마드가 태어났다."
  subjects: [aksumite-yemen, sasanian-empire, byzantine-empire]
  tags: [society, religion, economy]
  sources: ["W. Montgomery Watt, Muhammad at Mecca (Clarendon Press, 1953)", "Patricia Crone, Meccan Trade and the Rise of Islam (Princeton University Press, 1987)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)"]

- id: dhu-nuwas-najran-518
  year: 518
  endYear: 525
  title:
    ko: "두 누와스와 나지란의 학살(523 무렵), 악숨의 예멘 정복(525)"
  summary:
    ko: "4세기 말~5세기 초부터 힘야르 왕들은 '하늘과 땅의 주' '라흐마난(자비로운 이)'만을 찾는 비문을 새겼고, 유대교가 지배층의 신앙으로 자리 잡았다(말리키카리브 유하민 때로 보며 학설이 갈린다). 6세기 초 힘야르는 동로마 편의 그리스도교 국가 악숨과 사산 편의 라흠 사이에서 눈치를 보았다. 악숨은 4세기 에자나 왕 때 그리스도교를 받아들인 아프리카 북동부의 큰 왕국이었고, 나지란은 남아라비아 북쪽 오아시스 도시로 6세기에 그리스도교 공동체와 주교가 있었다. 쿠데타로 그리스도교도 왕 마아디카리브 야피르를 몰아내고 즉위한 유수프 아사르 야스아르(두 누와스)는 힘야르 안의 악숨 수비대와 그리스도교 공동체를 쳤다. 시리아어 문헌 『힘야르인의 책』과 시몬(벳 아르삼)의 편지는 523년 무렵 나지란에서 많은 그리스도교도가 죽었다고 전한다(두 누와스의 즉위는 518년설과 522년설이 갈리고 학살은 523~524년설이며, 희생자 수도 사료마다 다르다). 소식을 들은 동로마 황제 유스티노스 1세는 악숨 왕 칼레브(엘라 아스베하)에게 군대를 보내도록 권했고, 525년 악숨군이 홍해를 건너 힘야르를 쳤다. 프로코피우스에 따르면 칼레브는 두 누와스를 꺾고 그리스도교도 에시미파이오스를 앉혔고, 두 누와스는 죽었다(아랍 전승은 말을 타고 바다로 뛰어들었다고 전한다). 이로써 힘야르 왕국은 끝나고 악숨령 예멘이 섰으며, 나지란의 순교자 이야기는 그리스도교권에서 오래 기려졌다. 『힘야르인의 책』은 나지란의 지도자 하리스(아레타스)를 순교자로 전한다. 힘야르 안의 유대교도와 그리스도교도가 모두 이 사건에서 희생을 겪었다는 점에서, 사건은 종교 충돌이자 악숨·동로마와 사산·라흠의 대리 대결이기도 했다."
  subjects: [himyarite-kingdom, aksumite-yemen, byzantine-empire, aksum]
  tags: [religion, war, politics]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Irfan Shahîd, The Martyrs of Najrân: New Documents (Société des Bollandistes, 1971)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Glen W. Bowersock, The Throne of Adulis: Red Sea Wars on the Eve of Islam (Oxford University Press, 2013)"]

- id: aksumite-yemen-abraha-525
  year: 525
  endYear: 570
  title:
    ko: "악숨령 예멘과 아브라하: 마리브 댐 수리(548 무렵)와 '코끼리의 해'(570 무렵)"
  summary:
    ko: "525년 악숨은 총독 에시미파이오스(사미파 아슈와)를 앉히고 군대를 물렸다. 얼마 뒤 악숨 군인 아브라하가 반란을 일으켜 총독을 몰아냈고, 악숨 왕이 보낸 군대를 두 번 막았다(프로코피우스). 아브라하는 악숨 왕에게 명목상 공납하는 조건으로 예멘을 직접 다스리며 사나를 근거지로 삼아 '사바와 두 라이단, 하드라마우트와 야므낫의 왕'을 칭했다. 548년 무렵 무너진 마리브 댐을 고쳤다는 비문을 남겼고, 사나에는 큰 교회 알칼리스를 세웠다. 이 교회를 아랍 전승은 카바에 맞서는 순례지로 세운 것이라 서술하지만 이는 뒷날의 해석이다. 아브라하 시대의 마리브 비문은 사바어로 쓰였으나 첫머리에 '자비로운 이와 그의 메시아와 성령'의 힘을 비는 문구를 새겨 그리스도교 왕임을 보여 준다. 동로마는 531년 무렵 유스티니아노스가 사절 율리아누스를 악숨과 예멘에 보내 비단 교역에서 사산을 거치지 않는 길을 열려 했으나 성과는 적었다. 552년 무렵 아브라하가 중부 아라비아의 마아드 부족을 쳤다는 비문(무라이간 비문)이 있다. 아랍 전승은 아브라하가 코끼리를 앞세워 메카의 카바를 치려다 실패했다고 하며, 그해를 '코끼리의 해'라 부르고 무함마드가 태어난 해로 꼽는다(쿠란 105장 「코끼리」). 이 일의 연대는 570년 무렵으로 잡지만 6세기 중엽으로 앞당기는 학설도 있고, 아브라하가 죽은 해도 확실하지 않다. 아브라하가 죽은 뒤 아들 야크숨, 이어 마스루크가 이었다. 마스루크가 다스리던 때 힘야르 왕가의 후손 사이프 이븐 디 야잔은 사산의 도움을 구했고, 이는 「사산의 예멘과 마준 지배: 와흐리즈의 사나 점령(570)에서 바단의 이슬람 수용(628)까지」(뒤의 사건)로 이어진다."
  subjects: [aksumite-yemen, himyarite-kingdom, sasanian-empire, byzantine-empire, aksum]
  tags: [politics, religion]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Glen W. Bowersock, The Throne of Adulis: Red Sea Wars on the Eve of Islam (Oxford University Press, 2013)", "Christian Julien Robin, 'Arabia and Ethiopia', in Scott Fitzgerald Johnson 엮음, The Oxford Handbook of Late Antiquity (Oxford University Press, 2012)"]

- id: ghassanids-529
  year: 529
  endYear: 584
  title:
    ko: "가산 왕국과 동로마의 아랍 동맹: 알하리스 이븐 자발라(529~584)"
  summary:
    ko: "가산은 시리아 남부(하우란·골란)에 자리 잡은 아랍 부족 연합으로, 3세기 무렵 예멘에서 옮겨 왔다는 전승이 있다. 이들은 동로마의 동방 변경을 지키는 동맹이자 아랍 속 그리스도교(미아피시스파)의 한 축이었다. 529년 유스티니아노스는 알하리스 이븐 자발라에게 '왕'과 '필라르코스'(부족장)의 칭호를 주어 시리아의 아랍 동맹 부족을 아우르게 했고, 라흠의 알문디르 3세에 맞서게 했다(프로코피우스 『전쟁사』 1.17). 라흠이 사산의 동맹이었으므로 두 아랍 왕조는 동로마와 사산이라는 두 제국의 변경을 서로 맞은편에서 지키는 셈이었다. 알하리스의 요청으로 542/543년 무렵 야코부스 바라다이오스(와 테오도로스)가 미아피시스파 주교로 서임되었고, 야코부스가 각지에 성직자를 세워 동로마 국교회와 갈라진 시리아 정교회의 조직을 세웠다. 알하리스는 554년 칼키스(킨나스린) 가까이의 싸움(야움 할리마)에서 알문디르를 꺾어 죽였다고 전한다. 가산의 중심 도시는 시리아 남부의 자비야였고, 이들은 시리아 사막 가장자리 루사파(세르기오폴리스)의 성 세르기오스 성지를 후원했다. 알하리스는 563년 콘스탄티노폴리스를 방문해 유스티니아노스와 만났다고 하며, 이는 로마가 아랍 동맹을 얼마나 중하게 보았는지 보여 준다. 알하리스의 아들 알문디르 이븐 알하리스(재위 569~582)도 라흠을 쳤지만 581년 무렵 마우리키오스에게 배신을 의심받아 붙잡혀 시칠리아로 유배당했고, 가산 사람들은 반발했고, 아들 알누만 6세(재위 581~583)도 동로마와 맞서다 붙잡혔다. 584년 무렵 가산의 맹주 지위는 여러 우두머리로 쪼개졌다. 동로마가 가산 같은 아랍 동맹을 통제하지 못한 일은 변경 방어를 약하게 했다는 평가가 있다. 7세기 아랍 정복 때의 일은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(뒤의 사건)에서 다룬다."
  subjects: [byzantine-empire, lakhmid-kingdom, sasanian-empire]
  tags: [politics, diplomacy, religion]
  sources: ["Irfan Shahîd, Byzantium and the Arabs in the Sixth Century, vol. 1 (Dumbarton Oaks, 1995)", "Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]

- id: khosrow-i-531
  year: 531
  endYear: 579
  title:
    ko: "호스로 1세의 개혁과 동로마와의 전쟁: 영원한 평화(532)·안티오키아 약탈(540)·50년 평화(562)"
  summary:
    ko: "카바드 1세의 뒤를 이은 호스로 1세(재위 531~579)는 532년 유스티니아노스와 '영원한 평화'를 맺었다. 동로마가 1만 1천 파운드의 금을 주는 조건이었다. 호스로는 내부에서 귀족의 힘을 누르고 나라의 틀을 가다듬었다. 토지를 재서 땅과 사람에게 현금과 현물로 거두는 세제를 짰고, 군대를 네 군관구로 나누어 변경 방어를 맡겼으며, 하급 귀족 데흐칸을 기병 복무로 묶어 중앙의 군사 기반으로 삼았다. 호스로의 궁정은 529년 아테네 아카데미가 닫힌 뒤 떠난 철학자들을 받아들였으나, 532년 평화 조약에 이들의 안전을 보장하는 조항이 들어가 돌아갔다고 아가티아스는 전한다. 540년 호스로는 영원한 평화를 깨고 시리아로 쳐들어가 안티오키아를 약탈하고 주민을 끌고 와 크테시폰 곁에 '호스로의 더 좋은 안티오키아'를 세웠다. 이어 라지카를 놓고 541~562년 싸움이 이어졌고, 562년 '50년 평화'가 맺혀 동로마는 해마다 금 3만 솔리두스를 내고 사산은 라지카를 내놓았다(「유스티니아노스 1세의 치세: 『로마법 대전』·니카 반란(532)·하기아 소피아(537)와 541년의 역병」(앞의 사건), 「캅카스의 이베리아와 라지카: 사산·동로마·아랍 사이(580~787)」(뒤의 사건)). 호스로는 서돌궐과 손잡고 557년 무렵 중앙아시아의 에프탈을 무너뜨렸고(「돌궐의 성립(552)과 아바르의 서진: 게피드의 멸망(567)과 동로마-돌궐 동맹(568)」(뒤의 사건)), 570년에는 예멘으로 군대를 보냈다. 아베스타를 문자로 옮겼다고 보는 작업도 이 무렵이라고 한다. 572년 동로마와 전쟁이 다시 시작되어 573년 다라를 빼앗았고, 579년 죽었다."
  subjects: [sasanian-empire, byzantine-empire]
  tags: [politics, war, diplomacy]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Agathias(아가티아스), Histories(『역사』) 2.30~31 (Joseph D. Frendo 영역, Walter de Gruyter, 1975)", "Zeev Rubin, 'The Reforms of Khusro Anushirwan', in Averil Cameron 엮음, The Byzantine and Early Islamic Near East III: States, Resources and Armies (Darwin Press, 1995)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]
