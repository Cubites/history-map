- id: juba-ii-mauretania-25bc
  year: -24
  endYear: 24
  title:
    ko: "유바 2세와 마우레타니아 왕국(기원전 25~기원후 24)"
  summary:
    ko: "기원전 46년 탑수스 전투에서 진 누미디아의 유바 1세의 아들 유바는 어린 나이에 로마로 끌려가 아우구스투스 곁에서 자랐다. 마우레타니아는 기원전 33년 보쿠스 2세가 죽으며 로마에 맡긴 땅이었고, 기원전 25년 아우구스투스는 이를 속주로 삼지 않고 그를 왕(유바 2세)으로 세웠으며 대신 누미디아 땅은 아프리카 속주에 합쳤다. 유바 2세는 안토니우스와 클레오파트라 7세의 딸 클레오파트라 셀레네 2세와 혼인했고, 옛 카르타고 계통의 항구 이올을 카이사레아(지금의 셰르셸)로 이름을 바꿔 도읍으로 삼았다. 볼루빌리스 같은 내륙 도시도 그의 영향 아래 로마식 건물이 들어섰다. 카이사레아 동쪽 해안 언덕에는 왕가의 거대한 원형 무덤(지금 '마우레타니아 왕릉')이 서 있고 지금도 남아 있다. 왕국은 곡물·올리브유·생선 소스(가룸)와 대서양 연안 모가도르 앞 섬(지금의 에사우이라)의 자줏빛 염료를 팔아 번영했다. 유바는 그리스어로 『리비카』와 아라비아·아시리아 역사를 쓴 학자이기도 했으나 이 책들은 거의 남아 있지 않다. 왕국은 로마의 종속 왕국이어서 내륙 부족과의 싸움에 로마가 끼어들었다. 6년 가이툴리아 부족이 왕국을 어지럽히자 로마의 코수스 렌툴루스가 나서 눌렀다고 카시우스 디오는 전한다(55.28). 유바와 클레오파트라 셀레네의 동전에는 악어와 이시스 상징 같은 이집트풍 도안이 새겨져, 어머니의 유산을 의식한 왕가의 취향을 보여 준다. 17년부터는 로마의 아프리카 속주 남쪽에서 타크파리나스가 반란을 일으켜 24년까지 이어졌고, 왕의 아들 프톨레마이오스가 이때 로마를 도왔다. 유바 2세는 23년(24년설)에 죽었고 아들 프톨레마이오스가 이었다. 왕국의 끝은 「프톨레마이오스의 죽음과 마우레타니아 속주의 설치(40~44)」(뒤의 사건)에서 다룬다."
  subjects: [mauretania, roman-empire]
  links:
    - { from: roman-empire, to: mauretania, note: "유바 2세에게 마우레타니아를 맡김(기원전 25)" }
  tags: [politics]
  sources: ["Duane W. Roller, The World of Juba II and Kleopatra Selene (Routledge, 2003)", "Tacitus(타키투스), Annales(『연대기』) 2.52, 4.23~26 (John Jackson 영역, Loeb, 1931~1937)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 53.26, 55.28 (Earnest Cary 영역, Loeb, 1914~1927)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)"]

- id: parthia-rome-euphrates-20bc
  year: -19
  endYear: 36
  title:
    ko: "파르티아와 로마: 군기 반환(기원전 20), 유프라테스 회담(기원후 2)과 아르타바누스 2세(36)"
  summary:
    ko: "카레 전투(앞의 사건 「크라수스의 파르티아 원정과 카레 전투(기원전 53), 같은 때의 한과 흉노」)에서 빼앗긴 군기와 포로는 로마의 큰 숙제였다. 기원전 20년 아우구스투스가 시리아에 머무는 동안 파르티아 왕 프라아테스 4세가 군기와 포로를 돌려주었고, 아우구스투스는 이를 외교의 승리로 내세웠다(『업적록』 29). 파르티아 군대는 갑옷을 입힌 중기병과 말 위에서 쏘는 궁수가 중심이었고, 왕은 지방 영주와 귀족 가문의 연합 위에서 겨울 도읍 크테시폰을 중심으로 다스렸다. 같은 해 아르메니아에는 티베리우스가 티그라네스 3세를 세웠다. 프라아테스는 기원전 10년 무렵 네 아들을 로마에 인질로 보냈고, 기원전 2년 그가 아내 무사(아우구스투스가 선물로 보낸 이탈리아 출신 여자였다고 요세푸스는 쓴다)와 아들 프라아타케스에게 암살된 뒤 로마와 파르티아는 아르메니아를 두고 다시 부딪쳤다. 기원후 2년 아우구스투스의 손자 가이우스 카이사르가 유프라테스의 한 섬에서 프라아타케스와 만나 서로의 영역을 인정하는 회담을 했다. 프라아타케스가 쫓겨난 뒤 오로데스 3세(6년 무렵)를 거쳐 로마에서 돌아온 보노네스 1세(재위 8~12)가 파르티아 왕이 되었지만 귀족들이 로마식 풍습을 꺼려 쫓아냈고, 12년 무렵부터 아르타바누스 2세(재위 12~38/41)가 오래 나라를 다스렸다. 36년(37년설도 있다) 시리아 총독 비텔리우스가 아르메니아 왕위를 두고 아르타바누스와 맞서다 유프라테스 한복판의 배 위에서 회담하여 우호를 맺었는데, 헤롯 왕국의 갈릴래아 영주 헤롯 안티파스가 이 자리를 위해 천막을 세웠다고 요세푸스는 쓴다(『유대 고대사』 18.96~105). 이로써 유프라테스가 두 나라의 경계로 굳었고, 아르메니아의 문제는 「네로 때의 아르메니아: 코르불로와 란데이아 협정(63), 티리다테스의 대관(66)」(뒤의 사건)으로 이어진다."
  subjects: [parthian-empire, roman-empire, arsacid-armenia, herodian-judea]
  tags: [diplomacy, politics]
  sources: ["Augustus(아우구스투스), Res Gestae Divi Augusti(『업적록』) 29 (P. A. Brunt·J. M. Moore 편역, Oxford University Press, 1967)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 54.8, 55.10a (Earnest Cary 영역, Loeb, 1914~1927)", "Tacitus(타키투스), Annales(『연대기』) 2.1~4, 6.31~37 (John Jackson 영역, Loeb, 1931~1937)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 18.96~105 (Louis H. Feldman 영역, Loeb, 1965)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)"]

- id: garamantes-roman-19bc
  year: -18
  endYear: 202
  title:
    ko: "가라만테스와 로마: 가라마와 포가라(기원전 19~기원후 202)"
  summary:
    ko: "페잔(지금 리비아 남서부)의 가라만테스는 도읍 가라마(지금의 젬)를 중심으로 오아시스에 포가라라는 지하 수로를 놓아 농사를 지었다. 헤로도토스는 이들이 네 필 말의 전차로 동굴에 사는 이들을 사냥한다고 적었다(『역사』 4.183). 대플리니우스에 따르면 기원전 19년 루키우스 코르넬리우스 발부스가 가라만테스를 쳐 정착지 열다섯 곳을 차지했다(『박물지』 5.36~38). 기원후 69~70년 무렵 가라만테스가 렙티스 마그나와 오에아(트리폴리) 사이의 싸움에 끼어들자 로마군이 개입해 이들을 몰아냈다고 타키투스는 전한다(『역사』 4.50). 이 일 뒤에도 가라마는 사하라를 가로지르는 교역로의 길목으로 소금·금·상아·노예를 지중해 쪽으로 보내는 일에 이름을 남겼고, 2세기 중엽에는 페잔의 큰 세력으로 자랐다. 202년 세베루스가 가라마를 차지했다는 전승도 있으나 사료가 약하다. 가라만테스의 문자는 대부분 읽히지 않고, 포가라의 연대와 노예 노동 여부는 학설이 갈린다."
  subjects: [garamantes, roman-empire]
  tags: [society, economy]
  sources: ["Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 5.36~38 (H. Rackham 외 영역, Loeb, 1938~1963)", "Tacitus(타키투스), Historiae(『역사』) 4.50 (Clifford H. Moore 영역, Loeb, 1925~1931)", "David J. Mattingly, Tripolitania (Batsford, 1995)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: herod-partition-4bc
  year: -3
  endYear: 6
  title:
    ko: "헤롯 왕국의 분할(기원전 4)과 유대 속주의 설치(6)"
  summary:
    ko: "헤롯이 죽자(기원전 4) 아우구스투스는 유언을 대체로 받아들여 왕국을 셋으로 나누었다. 아르켈라오스와 안티파스는 로마에서 서로 왕위를 주장했고, 유대인 사절 50명은 아예 헤롯 가문의 지배를 끝내 달라고 청했으나 황제는 이를 물리쳤다고 요세푸스는 쓴다. 아르켈라오스는 '왕'의 칭호는 받지 못하고 공을 세우면 왕이 될 수 있다는 약속만 받았다. 맏이 아르켈라오스는 유대·사마리아·이두메아를 다스리는 민족장(에트나르케스)이 되었고, 헤롯 안티파스는 갈릴래아와 페레아, 필리포스는 바타나이아·트라코니티스·아우라니티스를 맡는 영주(테트라르케스)가 되었다. 누이 살로메 1세는 얌니아·아조토스·파사엘리스 같은 도시를 받았다. 왕이 죽은 직후 유대·갈릴래아·페레아 곳곳에서 반란이 일었다. 시리아 총독 바루스가 군단을 이끌고 올라와 눌렀고, 요세푸스에 따르면 2,000명을 십자가에 못 박았다. 세포리스는 이 반란 때 불탔다가 안티파스가 다시 지어 갈릴래아의 도읍으로 삼았다. 아르켈라오스는 학정으로 유대인과 사마리아인의 호소를 받아 6년 아우구스투스에게 폐위되어 갈리아의 비엔나로 쫓겨났다. 그 땅은 시리아 총독의 감독 아래 기사 신분의 총독(프라이펙투스)이 다스리는 유대 속주로 바뀌었고, 첫 총독 코포니우스(6~9)가 카이사레아에 자리 잡았다. 카이사레아는 헤롯이 세운 항구 도시로, 로마 총독의 관저가 되어 유대 속주의 행정 중심이 되었다. 시리아 총독 퀴리니우스는 6년 속주의 호구 조사를 시행했는데, 이에 맞선 갈릴래아의 유다의 저항을 요세푸스는 로마의 지배를 받아들이지 않는 '네 번째 철학'의 시작이라 쓴다. 안티파스와 필리포스의 영지는 그대로 이어졌고, 가다라 같은 데카폴리스 도시들은 시리아 속주에 속했다."
  subjects: [herodian-judea, roman-empire]
  links:
