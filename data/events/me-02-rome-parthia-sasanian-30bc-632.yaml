- id: jesus-ministry-26
  year: 26
  endYear: 33
  title:
    ko: "예수의 활동과 십자가형(30 무렵)"
  summary:
    ko: "예수는 헤롯 대왕 말년(기원전 6~4 무렵으로 본다)에 태어나 갈릴래아의 나사렛에서 자랐다고 전한다. 마태오복음이 말하는 헤롯 대왕 때(기원전 4년 이전)와 누가복음이 말하는 퀴리니우스의 호구 조사(6년)가 서로 연대가 맞지 않아 정확한 해는 알 수 없다. 갈릴래아를 다스린 영주는 헤롯 안티파스였고, 요세푸스에 따르면 안티파스는 세례자 요한을 붙잡아 처형했다(『유대 고대사』 18.116~119). 예수는 갈릴래아 곳곳과 예루살렘에서 가르쳤는데, 복음서는 하느님 나라를 전하는 선생이자 치유자로 그렸다. 당시 유대 땅은 로마 총독과 헤롯 왕국 영지의 영주, 예루살렘 성전의 대사제가 얽혀 있었고, 유월절 같은 순례절기에는 예루살렘이 크게 붐볐다. 유월절 무렵 예루살렘에서 유대 총독 폰티우스 필라투스(빌라도, 26년부터 총독)의 판결로 십자가형을 받았다. 이 사건은 대체로 30년이나 33년으로 잡는다. 로마 쪽 기록으로는 타키투스가 티베리우스 때 필라투스에게 처형된 '그리스도'를 언급한 짧은 글(『연대기』 15.44)이 있고, 요세푸스의 예수 서술(『유대 고대사』 18.63)은 뒷날 기독교인이 손댄 부분이 있다고 보지만 처형 사실의 근거로 인정한다. 제자들은 예수가 죽음에서 되살아났다고 믿고 전했으며, 이 믿음이 그리스도교의 출발점이 되었다. 가장 이른 글인 바울의 편지(50년대)는 부활 선포를 이미 전해 받은 신앙으로 적고, 복음서는 70년 무렵부터 1세기 말 사이에 쓰였다고 본다. 믿음의 내용은 신앙의 문제이고, 여기서는 역사학이 확인하는 범위만 적는다. 예수의 가르침은 당시 유대교 안의 여러 흐름(바리사이·사두개·에세네)과 닿아 있었다. 뒤의 일은 「바울의 전도와 초기 교회(34~64)」(뒤의 사건)로 이어진다."
  subjects: [herodian-judea, roman-empire]
  tags: [religion, society]
  sources: ["E. P. Sanders, The Historical Figure of Jesus (Penguin, 1993)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 18.55~64, 18.116~119 (Louis H. Feldman 영역, Loeb, 1965)", "Tacitus(타키투스), Annales(『연대기』) 15.44 (John Jackson 영역, Loeb, 1931~1937)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: paul-early-church-34
  year: 34
  endYear: 64
  title:
    ko: "바울의 전도와 초기 교회(34~64)"
  summary:
    ko: "예수가 죽은 뒤 예루살렘의 제자들은 유대교 안의 한 모임으로 시작했다. 34년 무렵(36년설) 스데반이 돌에 맞아 죽은 일을 계기로 일부는 시리아의 안티오키아로 옮겨 갔고, 이곳 신도들을 처음 '그리스도인'이라 불렀다고 사도행전은 전한다. 다마스쿠스로 가던 바리사이 출신 사울(바울)이 뒤에 회심했고(회심의 해는 30년대 초·중반으로 갈린다), 바나바와 함께 소아시아와 그리스에서 이방인에게 복음을 전했다. 44년 아그리파 1세가 세베대의 아들 야고보를 처형했고, 48~50년 무렵 예루살렘 회의에서 이방인 신도가 할례를 받지 않아도 된다는 쪽으로 결론이 났다(갈라디아서와 사도행전이 이 회의를 달리 서술한다). 예루살렘 교회는 예수의 형제 야고보가 이끌었다. 바울은 에페소스·고린도·필리피·테살로니키에 교회를 세우고 로마 신자들에게 보낸 서간(57년 무렵)을 남겼다. 예루살렘에서 붙잡혀 60년 무렵 로마로 압송되었고, 전승은 그가 베드로와 함께 네로 때 로마에서 죽었다고 하나 정확한 해는 모른다. 62년 예루살렘 교회의 야고보는 대사제 안나노스가 연 재판에서 돌에 맞아 죽었다고 요세푸스는 쓴다(『유대 고대사』 20.200). 바울의 편지들은 신약성경에서 가장 이른 글이며, 율법의 행위가 아니라 믿음으로 의롭게 된다는 점을 강조해 이방인 신도의 길을 열었다. 이 무렵 그리스도교는 시리아 속주의 도시와 헤롯 왕국 영역, 소아시아·그리스·로마의 유대인 공동체와 그 둘레를 중심으로 퍼졌다. 이방인 신자가 늘면서 그리스도교는 유대교의 한 갈래에서 독자적인 종교로 갈라서기 시작했다. 유대 땅의 충돌은 「유대 전쟁(66~73): 예루살렘 함락과 성전 파괴(70), 마사다」(뒤의 사건)로, 로마의 박해는 「로마 대화재(64)와 네로의 그리스도교 박해」(뒤의 사건)로 이어진다."
  subjects: [herodian-judea, roman-empire]
  tags: [religion, society]
  sources: ["E. P. Sanders, Paul: The Apostle's Life, Letters, and Thought (Fortress Press, 2015)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 19.343~352, 20.197~203 (Louis H. Feldman 영역, Loeb, 1965)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: adiabene-conversion-36
  year: 36
  endYear: 66
  title:
    ko: "아디아베네 왕가의 유대교 개종: 헬레나와 이자테스 2세(36~66)"
  summary:
    ko: "아르벨라(지금의 에르빌)를 도읍으로 한 아디아베네 왕국은 파르티아에 딸린 나라였다. 대자브강과 소자브강 사이의 비옥한 평야를 차지해 곡창이라 할 만했고, 도읍 아르벨라는 아시리아 시대부터 이슈타르 신전으로 이름난 곳이었다. 그 무렵 유대 땅은 로마 총독이 다스렸고, 41~44년에는 헤롯 왕국의 아그리파 1세가 이를 되살려 다스렸다(「헤롯 가문의 영지와 이투라이아의 병합(37~92)」(뒤의 사건)). 요세푸스에 따르면 왕 모노바조스 1세의 아내 헬레나와 아들 이자테스 2세는 1세기 전반 상인 아나니아스에게 유대교를 배웠다. 이자테스는 30년대 중반(30년대 초설도 있다) 왕위에 올라 파르티아의 아르타바누스 2세가 쫓겨났다 돌아오는 일을 도왔고, 보답으로 니시비스 지방을 받았다고 한다. 이자테스는 처음에 유대교 신자가 되고도 할례는 미뤘지만 갈릴래아에서 온 엘레아자르의 권유로 할례를 받았다. 어머니 헬레나는 46~48년 무렵 예루살렘으로 옮겨 가 흉년에 이집트에서 곡식을, 키프로스에서 무화과를 사들여 가난한 이들을 도왔다. 사도행전도 클라우디우스 때 큰 흉년이 있었다고 전한다. 그는 예루살렘에 궁과 무덤(지금 '왕들의 무덤')을 지었다. 이자테스가 55~59년 사이 죽자 형제 모노바조스 2세가 왕위를 이었고, 아디아베네 왕가의 일부는 예루살렘에 머물렀다. 66년 유대 전쟁이 터지자 이들의 친척들이 유대인 편에서 싸우다 예루살렘에서 로마군에 항복했다고 요세푸스는 쓴다(『유대 전쟁사』 2.520, 6.356). 개종에 반발한 귀족들이 볼로가세스 1세에게 도움을 청했으나 큰 싸움으로 번지지 않았고, 왕국은 파르티아의 종속 아래 이어졌다. 왕국의 뒷날은 「샤푸르 2세의 치세: 아랍 원정과 아디아베네의 병합(309~379)」(뒤의 사건)에서 다룬다."
  subjects: [adiabene, parthian-empire, herodian-judea]
  tags: [religion, politics]
  sources: ["Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 20.17~96 (Louis H. Feldman 영역, Loeb, 1965)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 2.520, 5.252~253, 6.356 (H. St. J. Thackeray 영역, Loeb, 1927~1928)", "Jacob Neusner, A History of the Jews in Babylonia I: The Parthian Period (Brill, 1965)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: agrippa-ituraea-annexed-37
  year: 37
  endYear: 92
  title:
    ko: "헤롯 가문의 영지와 이투라이아의 병합(37~92)"
  summary:
    ko: "37년 즉위한 칼리굴라는 어릴 적 벗 아그리파(헤롯 대왕의 손자)에게 죽은 필리포스의 영지와 왕호를 주었고, 39년 헤롯 안티파스가 쫓겨나자 갈릴래아와 페레아도 더해 주었다. 이투라이아(칼키스 쪽 레바논 골짜기)는 38년 소하이무스가 받아 다스렸다. 41년 클라우디우스는 아그리파 1세에게 유대와 사마리아까지 주어, 41~44년 아그리파 1세 아래에서 헤롯 대왕 때와 비슷한 크기의 왕국이 잠깐 되살아났다. 요세푸스는 아그리파 1세가 유대교 율법에 충실한 모습을 보여 바리사이의 호감을 얻었다고 쓰고, 사도행전은 그가 예루살렘 교회를 박해해 세베대의 아들 야고보를 처형했다고 전한다. 아그리파 1세는 44년 카이사레아에서 갑자기 죽었고(요세푸스와 사도행전이 죽음을 다르게 서술한다), 유대는 다시 로마가 보낸 총독의 직할지가 되었다. 그의 아들 아그리파 2세는 그때 열여섯 살쯤이어서 클라우디우스가 왕위를 잇게 하지 않았다고 요세푸스는 쓴다. 49년 소하이무스가 죽자 이투라이아는 시리아 속주에 합쳐졌다(타키투스 『연대기』 12.23). 아그리파 2세는 50년 무렵 칼키스를 받았다가 53년 필리포스의 옛 영지로 옮겼고, 네로가 갈릴래아의 티베리아스와 페레아의 일부를 더해 주었다. 그는 66년 시작된 유대 전쟁에서 로마 편에 섰고(「유대 전쟁(66~73): 예루살렘 함락과 성전 파괴(70), 마사다」(뒤의 사건)), 누이 베레니케와 함께 티투스를 따랐다. 아그리파 2세가 죽은 때는 92~93년께로 보는 쪽이 많고 100년설도 있다. 아그리파 2세가 아들 없이 죽고 그의 영지가 시리아 속주에 합쳐지면서, 헤롯 대왕에서 이어진 왕가의 통치는 한 세기 남짓 만에 끝났다."
  subjects: [herodian-judea, ituraea, roman-empire]
  links:
    - { from: roman-empire, to: ituraea, note: "이투라이아 병합(49)" }
    - { from: roman-empire, to: herodian-judea, note: "아그리파 2세의 영지 편입(92 무렵)" }
  tags: [politics]
  sources: ["Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 18.237~256, 19.274~363, 20.104~143 (Louis H. Feldman 영역, Loeb, 1965)", "Tacitus(타키투스), Annales(『연대기』) 12.23 (John Jackson 영역, Loeb, 1931~1937)", "Daniel R. Schwartz, Agrippa I: The Last King of Judaea (Mohr Siebeck, 1990)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: mauretania-annexed-40
  year: 40
  endYear: 44
  title:
    ko: "프톨레마이오스의 죽음과 마우레타니아 속주의 설치(40~44)"
  summary:
    ko: "유바 2세의 아들 프톨레마이오스는 23/24년 아버지를 이어 마우레타니아 왕이 되었고, 타크파리나스의 반란을 막는 데 로마를 도와 원로원에서 '로마 국민의 벗이자 동맹'이라는 칭호를 받았다. 39년 말에서 40년 사이 칼리굴라는 그를 로마로 불러들여 붙잡고 처형했다. 옛 사료는 그의 자줏빛 망토와 부 때문에 샘을 냈다고 전하지만, 근대의 연구자들은 로마가 마우레타니아를 더는 종속 왕국으로 두기 어려워졌기 때문이라고 본다. 왕의 해방 노예 아이데몬이 복수를 내걸고 일으킨 반란이 40년부터 40년대 초중반까지 이어졌고(아이데몬이 죽은 뒤에는 사발루스가 이끌었다) 볼루빌리스가 일부 파괴되었고, 클라우디우스는 수에토니우스 파울리누스와 호시디우스 게타를 보내 이를 눌렀다. 대플리니우스에 따르면 파울리누스는 로마 장군으로서 처음 아틀라스산맥을 넘어 게르강 쪽까지 닿았다(『박물지』 5.14). 플리니우스가 길게 전하는 아틀라스와 사막 가장자리의 지리 정보는 로마가 이 지역을 처음 직접 눈으로 본 결과였다(5.14~15). 반란을 누른 뒤 클라우디우스는 마우레타니아를 물루야강(옛 이름 몰루카)을 경계로 서쪽 팅기타나와 동쪽 카이사리엔시스 두 속주로 나누고 기사 신분 총독을 두었다. 속주 편성은 42년에 시작해 44년께 마무리된 것으로 본다. 탕헤르(팅기스)와 카이사레아가 각 속주의 도읍이 되었고, 해안과 강가의 도시에 퇴역병 식민이 세워졌다. 리프산맥과 아틀라스의 산악 부족 땅은 로마 지배 밖에 남았다. 프톨레마이오스의 죽음을 칼리굴라의 변덕보다는 로마가 오랜 종속 왕국을 속주로 바꿀 구실로 보는 해석도 있다. 두 속주는 군단이 아니라 보조군과 기사 신분 총독(프로쿠라토르)이 맡았고, 곡물과 올리브유는 속주의 도시와 농장에서 로마로 나갔다."
  subjects: [mauretania, roman-empire]
  links:
    - { from: roman-empire, to: mauretania, note: "마우레타니아 병합(42)" }
  tags: [politics, war]
  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 59.25, 60.8~9 (Earnest Cary 영역, Loeb, 1914~1927)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 5.1~14 (H. Rackham 외 영역, Loeb, 1938~1963)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『칼리굴라』 26 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Duane W. Roller, The World of Juba II and Kleopatra Selene (Routledge, 2003)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)"]

- id: south-arabia-rivals-50
  year: 50
  endYear: 200
  title:
    ko: "남아라비아 왕국들의 각축: 사바·힘야르·하드라마우트·카타반(50 무렵~200 무렵)"
  summary:
    ko: "기원후 1세기 중엽 남아라비아에서는 사바·힘야르·하드라마우트·카타반 네 나라가 향료와 유향이 오가는 대상로와 인도양 항구를 두고 겨루었다. 40~70년 무렵의 항해서 『에리트레아 해 안내서』는 '호메리타이(힘야르)와 사바이타이' 두 겨레의 왕 카리바엘이 자파르에 머물며 로마 황제에게 선물을 보낸다고 적고, 유향의 나라 하드라마우트의 왕 엘레아조스가 도읍 사바타(샤브와)에서 유향 항구 카네(카나)와 소코트라까지 거느린다고 쓴다. 사바의 중심은 마리브였고, 사나는 뒷날 남아라비아 고지의 중심 도시로 자란다. 카타반은 도읍 팀나에서 향 장사로 번영했지만 2세기 들어 이웃 나라들에게 눌려 약해졌다. 통설은 200년 무렵 하드라마우트와 힘야르가 카타반의 땅을 나누어 가져 카타반이 끝났다고 본다(1세기 말로 앞당기거나 3세기 초로 늦추는 학설도 있다). 이 사이 힘야르는 고지대 도읍 자파르에서 세력을 키워 사바와 번갈아 우위를 다투었고, 사바는 힘야르와 하드라마우트 사이에서 동맹과 전쟁을 되풀이했다. 나라마다 주신이 달라 카타반은 암(달의 신), 사바는 알마카, 하드라마우트는 신(사인)을 모셨다. 홍해와 인도양의 계절풍 항로가 알려지자 로마령 이집트에서 남아라비아 항구를 거쳐 인도로 가는 배가 늘었고, 이 교역이 왕국들에 큰 이익이었다. 향료 대상로는 하드라마우트의 샤브와에서 출발해 마리브와 나지란, 히자즈의 오아시스를 거쳐 페트라와 가자에 닿았다. 남아라비아의 비문은 사바어 문자로 새겨졌고, 이 문자는 에티오피아의 게즈 문자와 같은 뿌리의 계통이다. 나라 사이의 싸움은 비문에 새겨져 전하는데, 비문의 연대는 왕의 이름과 상대 순서로 짐작한 것이라 몇십 년의 오차가 있다."
  subjects: [saba-kingdom, qataban, hadramawt-kingdom, himyarite-kingdom]
  links:
    - { from: hadramawt-kingdom, to: qataban, note: "카타반 분할·병합(200 무렵)" }
  tags: [politics, economy]
  sources: ["Lionel Casson 역주, The Periplus Maris Erythraei (Princeton University Press, 1989)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 6.153~162 (H. Rackham 외 영역, Loeb, 1938~1963)", "Christian Julien Robin, 'Arabia and Ethiopia', in Scott Fitzgerald Johnson 엮음, The Oxford Handbook of Late Antiquity (Oxford University Press, 2012)"]

- id: arabia-province-106
  year: 105
  endYear: 111
  title:
    ko: "아라비아 속주의 설치와 나바테아의 끝(106)"
  summary:
    ko: "나바테아 왕 라벨 2세(재위 70~106)는 아라비아 북서부와 요르단 고원을 거느린 마지막 왕이었다. 105/106년 그가 죽자 트라야누스는 총독 코르넬리우스 팔마를 시리아에서 내려보내 나바테아를 로마 속주 '아라비아'(아라비아 페트라이아)로 삼았다. 싸움이 크게 벌어졌다는 기록이 없어 저항이 적었으리라는 견해가 많으나(카시우스 디오는 팔마가 복속시켰다고 적고, 군단 둘이 남북 두 길로 들어갔다고 보는 서술도 있다), 그에 앞서 라벨이 로마와 맺은 친밀한 관계가 바탕이 되었다고 본다. 트라야누스는 속주 설치를 기념하는 주화에 '아라비아 획득'(ARAB ADQ)이라는 문구를 새겼다. 새 속주에는 제3 키레나이카 군단이 주둔했고, 로마는 홍해 항구 아일라(아카바)와 시나이·북서 아라비아 변경을 군대로 지켰으며, 나바테아 출신은 로마 보조군에 복무하기도 했다. 나바테아의 옛 땅 가운데 네게브와 시나이 남부도 속주에 들어갔고, 페트라와 헤그라는 도시로 이어지며 나바테아의 아람어와 신들도 한동안 이어졌다. 병합에 앞서 나바테아의 말리쿠스 2세는 유대 전쟁 때 로마군에 기병 1,000과 보병 5,000(대부분 궁수)을 보냈고(요세푸스 『유대 전쟁사』 3.68), 헤그라의 암벽 무덤 비문들은 매장 권리와 위반 때의 벌금을 법률 문서처럼 새겨 나바테아의 법 문화를 보여 준다. 새 속주의 도읍은 나바테아의 북쪽 도시 보스트라(지금의 시리아 부슈라 에스샴)로 옮겨졌다. 트라야누스는 111년부터 보스트라에서 아카바 만까지 이어지는 '새 트라야누스 길'을 놓아 군대와 대상이 오가게 했다. 트라야누스의 파르티아 원정은 「트라야누스의 파르티아 원정(113~117)과 최대 판도: 아르메니아·메소포타미아 속주」(뒤의 사건)에서 다룬다."
  subjects: [nabataean-kingdom, roman-empire]
  links:
    - { from: roman-empire, to: nabataean-kingdom, note: "나바테아 병합과 아라비아 속주 설치(106)" }
  tags: [politics]
  sources: ["Glen W. Bowersock, Roman Arabia (Harvard University Press, 1983)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 68.14 (Earnest Cary 영역, Loeb, 1914~1927)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: judaism-mishnah-talmud-135
  year: 135
  endYear: 500
  title:
    ko: "유대교의 재편: 미슈나(200 무렵)와 바빌로니아 탈무드(500 무렵)"
  summary:
    ko: "바르 코크바 반란(앞의 사건 「바르 코크바 반란(132~136)과 유대 땅의 변화」)이 진압된 135년 뒤 유대인은 예루살렘 출입이 금지되었고, 유대교의 중심은 갈릴래아(우샤·세포리스·티베리아스)로 옮겨 갔다. 성전과 제사가 사라진 자리에서 율법 해석을 이끄는 랍비들이 공동체를 이끌었다. 학원(예시바)과 회당이 성전의 자리를 대신했다. 랍비 법정은 로마 당국의 묵인 아래 혼인과 상속, 안식일, 정결 같은 유대인 내부 문제를 맡았고, 갈릴래아의 족장(나시)이 로마 제국 안에서 유대 공동체의 대표 노릇을 했다. 유다 하나시(랍비)는 200년 무렵 세포리스에서 구전 율법을 『미슈나』(여섯 부 63편)로 엮었고, 이를 풀이한 『예루살렘 탈무드』는 400년 무렵 티베리아스에서 마무리되었다. 같은 때 바빌로니아(224년까지는 파르티아, 뒤에는 사산 제국의 땅)에서는 유대인 공동체가 번성했다. 수라와 푼베디타 같은 학원이 랍비를 길렀고 유대인 공동체의 수장(레시 갈루타)이 사산 정부의 인정을 받아 세금과 재판을 맡았다. 이곳의 학자들이 『미슈나』를 두고 오래 토론한 결과를 『바빌로니아 탈무드』로 엮어 500년 무렵 편찬을 마친 것으로 본다(그 뒤에도 후대 학자들이 다듬었다는 학설이 있다). 사산 안의 유대인은 샤푸르 1세 때처럼 보호를 받기도 했고, 카르티르의 비문에 유대인이 이름을 올렸으나 실제 억압의 범위는 학자들이 갈리며, 5세기에 야즈데게르드 2세·페로즈 1세 때 일부 학원이 문을 닫는 압박도 겪었다. 동로마 제국에서는 그리스도교가 국가 종교가 되면서 425년 무렵 갈릴래아의 족장(나시) 직이 없어졌다. 이렇게 유대교는 성전이 없는 종교로 거듭났고 두 탈무드가 이후 유대교 율법의 바탕이 되었다. 미슈나는 농업·절기·여성·민법·성물·정결의 여섯 부로 이루어져 있고, 탈무드는 미슈나 본문과 그에 대한 토론(게마라)을 함께 싣는다."
  subjects: [roman-empire, parthian-empire, sasanian-empire, byzantine-empire]
  tags: [religion, society]
  sources: ["Seth Schwartz, Imperialism and Jewish Society, 200 B.C.E. to 640 C.E. (Princeton University Press, 2001)", "Jacob Neusner, A History of the Jews in Babylonia (Brill, 1965~1970)", "Catherine Hezser, The Social Structure of the Rabbinic Movement in Roman Palestine (Mohr Siebeck, 1997)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)"]

- id: parthia-late-198
  year: 191
  endYear: 221
  title:
    ko: "파르티아의 말기: 세베루스의 크테시폰 점령(198)과 카라칼라·아르타바누스 4세(216~217)"
  summary:
    ko: "2세기 말 파르티아 왕 볼로가세스 5세(재위 191~208)의 나라는 트라야누스(앞의 사건 「트라야누스의 파르티아 원정(113~117)과 최대 판도: 아르메니아·메소포타미아 속주」)와 마르쿠스 아우렐리우스 때의 로마 침공에 시달린 데다 왕위를 둘러싼 내분으로 힘이 약했다. 195년 세베루스는 오스로에네를 로마의 영향 아래 두고 메소포타미아 속주를 세웠고(「세베루스 왕조(193~235)와 카라칼라의 시민권 칙령(212)」(뒤의 사건)), 197~198년 유프라테스를 따라 내려가 크테시폰을 점령하고 약탈했다. 세베루스는 이 원정으로 '파르티아 정복자'(파르티쿠스 막시무스)의 칭호를 얻었다. 그러나 곧 물러났고 하트라를 두 번 에워싸고도 198·199년 성을 함락하지 못했다. 크테시폰은 116년 트라야누스, 165년 아비디우스 카시우스에 이어 이때 세 번째로 로마군에 점령되었다. 208년 무렵 볼로가세스 5세가 죽은 뒤 볼로가세스 6세와 아르타바누스 4세가 왕위를 다투어 나라가 갈라졌다. 216년 카라칼라는 평화를 구실로 혼인을 청한다며 오다 국경을 넘어 메디아의 아르벨라 왕릉을 파헤치는 등 파르티아 땅을 휩쓸었고, 이듬해 4월 카레 가까이에서 부하에게 살해되었다. 뒤를 이은 마크리누스는 217년 아르타바누스 4세와 니시비스 근처에서 사흘을 싸웠으나 이기지 못하고 화의를 맺어 포로를 돌려받고 거액의 배상금(카시우스 디오는 2억 세스테르티우스라고 쓴다)을 냈다. 아르타바누스는 이긴 듯 보였지만, 지방 왕들은 이미 중앙에 충성하지 않았고 페르시스의 영주 아르다시르가 이 틈에 일어섰다. 이 일은 「아르다시르 1세의 이란 통일: 종속 왕국의 병합(222~240)」(뒤의 사건)으로 이어진다."
  subjects: [parthian-empire, roman-empire, osroene]
  tags: [war, politics]
  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 75.1~3, 77.18~21, 79.26~27 (Earnest Cary 영역, Loeb, 1914~1927)", "Herodian(헤로디아노스), History of the Empire(『로마사』) 3.9, 4.10~11, 4.15 (C. R. Whittaker 영역, Loeb, 1969~1970)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]
  places:
