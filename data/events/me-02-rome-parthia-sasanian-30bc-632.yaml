- id: byzantine-africa-moors-534
  year: 534
  endYear: 548
  title:
    ko: "동로마의 아프리카와 무어인: 솔로몬의 아우레스 원정(539), 킬리움 싸움(544), 요한 트로글리타(546~548)"
  summary:
    ko: "벨리사리우스가 반달 왕국을 무너뜨린(앞의 사건 「유스티니아노스의 아프리카 재정복: 반달 왕국의 멸망(533~534)」) 뒤 동로마는 아프리카 도독령(프라이펙투라)을 세웠으나, 안쪽 산지에는 무어 수장들이 버티고 있었다. 도독이자 장군 솔로몬(재임 534~536, 539~544)은 환관 출신이었으나 도시 성벽을 고치고 길목에 요새를 쌓았으며, 반달 때 가톨릭 교회에서 빼앗은 재산을 돌려주는 유스티니아노스의 정책도 함께 시행했다. 동로마는 534년 이후 마우레타니아 시티펜시스와 카이사리엔시스의 해안 도시(세티프·카이사레아)도 직접 맡았다. 솔로몬은 535년 이후 비자케나와 누미디아의 무어 부족을 쳤고, 539년 아우레스 산지로 올라가 이아브다스를 몰아냈다(이아브다스는 마우레타니아로 달아났다). 동로마는 아우레스에 요새를 쌓고 544년까지 점령했다. 한편 군대의 급료와 토지를 둘러싼 불만으로 스토차스의 반란이 일어나(536~545) 아프리카는 흔들렸고, 벨리사리우스가 한때 카르타고로 돌아와 진압을 도왔으며, 그 뒤 유스티니아노스의 사촌 게르마노스가 군을 맡아 반란을 눌렀고 539년 솔로몬이 다시 도독이 되었다. 솔로몬의 조카 세르기오스가 543년 트리폴리타니아 총독으로서 레우아타이 부족 사절들을 연회에서 죽이자 레우아타이와 안탈라스가 이끈 무어 부족들이 일어났고, 544년 킬리움에서 동로마군이 크게 져 솔로몬이 전사했다. 이아브다스는 이 틈에 아우레스를 되찾았다. 솔로몬이 죽은 뒤 조카 세르기오스(544~545)가 이었으나, 함께 보낸 아레오빈두스는 546년 3월 누미디아의 군지휘관 군타리크에게 살해되었고 군타리크를 누른 아르타바네스도 곧 소환되었다. 동로마는 요한 트로글리타를 보내 546~548년 싸웠고(이 싸움은 코리푸스의 서사시 『요하니스』가 전한다), 548년 카토 평원 전투 뒤 평화가 자리 잡았다. 서쪽 마우레타니아의 마스티가스는 동로마의 지휘관(둑스)이 되었으며 마우로로마 왕국의 왕으로 보기도 한다."
  subjects: [byzantine-empire, aures-kingdom, mauro-roman-kingdom, vandal-kingdom]
  tags: [war, politics]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Corippus(코리푸스), Iohannis(『요하니스』) (George W. Shea 영역, Edwin Mellen Press, 1998)", "Yves Modéran, Les Maures et l'Afrique romaine (IVe–VIIe siècle) (École française de Rome, 2003)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]
  places:
