# 서아시아·북아프리카 사건 2차 묶음(me-02): 로마·파르티아·사산·동로마, 이슬람 이전 아라비아, 무함마드 (기원전 30 ~ 기원후 632)
# 범위: 로마의 이집트 속주와 아일리우스 갈루스의 아라비아 원정, 나바테아와 리히얀, 유바 2세와 마우레타니아의 병합(40~44), 헤롯의 통치 후반·왕국 분할·유대 속주, 예수와 초기 교회,
#   헤롯 가문의 영지와 이투라이아의 병합, 아라비아 속주(106), 파르티아와 로마의 경계·아디아베네의 개종·파르티아 말기, 아르다시르 1세의 이란 통일, 사산의 종교(마니·카르티르),
#   라흠과 가산, 샤푸르 2세, 동방 교회, 카바드 1세와 마즈다크, 호스로 1세·호스로 2세, 사산의 시리아·이집트 지배와 내분(628~632), 남아라비아의 통일과 힘야르·악숨·사산의 예멘,
#   이슬람 이전의 메카와 무함마드의 생애, 가라만테스와 무어 왕국들(마우로로마·아우레스·알타바)과 동로마의 아프리카, 이집트의 수도 생활, 유대교의 재편.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 주변 등급 땅(사하라 내륙)의 일은 개관 분량. 이 시대 지도에서 생기거나 끝난 나라와 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 이 시대 서아시아 사건은 직접 닿는 한국사 사건이 없어 subjects로 잇지 않았다.
# 다른 파일 사건은 다시 쓰지 않고 「제목」으로 가리켰다: 안토니우스와 클레오파트라 7세(악티움), 크라수스의 카레 전투, 유대 전쟁, 바르 코크바 반란, 트라야누스의 파르티아 원정, 사산 왕조의 등장(224),
#   로마와 사산 페르시아의 전쟁(296~363), 헤라클레이오스와 사산 전쟁, 아랍의 정복과 동로마, 유스티니아노스의 아프리카 재정복, 캅카스의 이베리아와 라지카 등.
# 날짜: 1582년 전은 율리우스력이며 달까지만 적거나 통설의 날짜를 따랐다. 히즈라력은 필요할 때 괄호로만 썼고, 확실하지 않은 날짜는 '무렵'. 무함마드의 생애는 이슬람 전승과 학설을 나눠 적었다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서 표기(무함마드·칼리프·쿠란, 정관사 al-은 '알'), 고대 로마 인명은 라틴어 꼴(아일리우스 갈루스·코르넬리우스 발부스), 사산 왕은 중세 페르시아어 꼴(아르다시르·샤푸르·호스로·카바드),
#   동로마 인물은 그리스식(헤라클레이오스·유스티니아노스), 옛 도시는 굳은 표기(크테시폰·알히라·안티오키아), 나라 이름은 항목 이름을 따랐다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3). places의 year: 전쟁 보기가 없는 싸움·포위만 달았다.
# 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서. 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: herod-late-reign-30bc
  year: -29
  endYear: -3
  title:
    ko: "헤롯의 통치 후반: 하우란 병합과 성전 재건, 죽음(기원전 30~4)"
  summary:
    ko: "기원전 30년 로도스에서 옥타비아누스를 만난 헤롯은 안토니우스 편이었던 지난날을 해명하고 왕위를 인정받았다. 옥타비아누스는 클레오파트라가 떼어 갔던 예리코 둘레와 해안 도시들, 가다라·히포스를 되돌려 주었고, 기원전 23~20년에는 이투라이아 왕가의 제노도로스가 다스리던 트라코니티스·바타나이아·아우라니티스(하우란)를 헤롯에게 더했다. 제노도로스가 기원전 20년 무렵 죽자 파네아스 일대도 헤롯이 받았다. 파네아스에는 아우구스투스를 기리는 신전을 세웠다고 요세푸스는 쓴다. 헤롯은 넓어진 영토와 로마의 후원으로 항구 도시 카이사레아 마리티마(기원전 22~10/9)와 사마리아의 세바스테를 차례로 세우고, 기원전 20/19년부터 예루살렘 성전을 크게 고쳐 지었다. 본당과 안뜰은 몇 해 만에 마무리되었지만 바깥 뜰과 부속 건물 공사는 헤롯이 죽은 뒤에도 이어져 60년대에야 끝났고, 성전산을 받친 큰 축대 돌 가운데 아랫부분이 지금의 '통곡의 벽'에 남아 있다. 헤롯은 마사다와 헤로디온, 예리코에 궁전과 요새도 지었고, 흉년이 든 기원전 25년에는 자기 재산으로 이집트에서 곡식을 사 와 백성에게 나누어 주었다고 한다. 헤롯 왕국은 로마의 종속 왕국으로서 이웃 나바테아와는 기원전 9년 무렵 전쟁까지 벌였다. 집안에서는 아내 마리암네 1세(기원전 29년 처형)와 두 아들 알렉산드로스·아리스토불로스(기원전 7년 처형), 맏아들 안티파테르(기원전 4년, 자신이 죽기 며칠 전)를 차례로 죽여 말년이 어두웠다. 헤롯은 기원전 4년 봄 예리코에서 죽었다고 보며(요세푸스가 적은 월식과 유월절 앞이라는 때에 따른 통설이고, 기원전 1년설도 있다), 유언으로 왕국을 세 아들에게 나누어 주었다. 마태오복음이 전하는 베들레헴의 영아 학살은 요세푸스에 나오지 않아 대부분의 현대 연구자는 역사적 사실로 보지 않는다. 계승과 분할은 「헤롯 왕국의 분할(기원전 4)과 유대 속주의 설치(6)」(뒤의 사건)에서 다룬다."
  subjects: [herodian-judea, ituraea, nabataean-kingdom, roman-empire]
  links:
