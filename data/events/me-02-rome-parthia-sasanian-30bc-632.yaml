  tags: [politics, economy]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 16.4.21 (H. L. Jones 영역, Loeb, 1917~1932)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 16.220~16.354 (Ralph Marcus·Allen Wikgren 영역, Loeb, 1963), 18.109~126 (Louis H. Feldman 영역, Loeb, 1965)", "Glen W. Bowersock, Roman Arabia (Harvard University Press, 1983)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Robert G. Hoyland, Arabia and the Arabs: From the Bronze Age to the Coming of Islam (Routledge, 2001)"]

- id: aelius-gallus-arabia-26bc
  year: -25
  endYear: -24
  title:
    ko: "아일리우스 갈루스의 아라비아 원정(기원전 26~25)"
  summary:
    ko: "이집트 장관 아일리우스 갈루스는 아우구스투스의 명으로 기원전 26년 무렵 '행복한 아라비아'(남아라비아)를 향해 군대를 보냈다. 홍해를 지나 향료와 금의 나라를 로마 영향 아래 두려는 시도였다. 스트라본에 따르면 아우구스투스는 그 나라들을 벗으로 삼거나 정복해 큰 부를 얻으려 했다(『지리지』 16.4.22). 원정의 출발점인 레우케 코메는 나바테아의 항구로, 이집트와 페트라를 잇는 상로가 아라비아 서해안의 대상로와 만나는 곳이었다. 스트라본은 갈루스의 벗으로서 이 원정을 자세히 적었는데, 그에 따르면 병력은 로마군과 동맹군 약 1만 명이고 유대인 500명과 나바테아인 1,000명이 섞여 있었다. 길을 안내한 나바테아 왕국의 실력자 실라이오스가 일부러 군대를 헤매게 했다고 스트라본은 쓰지만, 이는 갈루스 쪽 변명이었을 수 있다. 군대는 레우케 코메에 상륙한 뒤 반년 가까이 아라비아 서부를 남쪽으로 걸어 나지란을 지나 마리브(스트라본의 마르시아바로 추정) 앞에 닿았다. 더위와 물 부족, 낯선 질병으로 군대는 크게 줄었고, 마리브를 에워싸고도 물이 떨어져 엿새 만에 물러났다고 한다. 스트라본은 싸우다 죽은 병사가 일곱 명뿐이고 나머지는 병과 굶주림, 험한 길로 죽었다고 쓴다. 돌아오는 데는 60일이 걸렸다. 사바 왕국과 이웃 나라들은 정복당하지 않았으며, 로마가 남아라비아를 직접 차지하려 한 시도로는 이 원정이 처음이자 마지막이었다. 스트라본은 갈루스가 이집트 장관이던 때 홍해의 미오스 호르모스에서 인도로 가는 배가 120척에 이른다는 말을 들었다고 적어(『지리지』 2.5.12), 이 원정과 별개로 홍해 교역이 커지고 있었음을 보인다. 갈루스는 기원전 24년 무렵 페트로니우스로 교체되었다. 실라이오스는 뒷날 이 일을 포함한 여러 죄로 로마에서 처형되었다고 스트라본은 전한다."
  subjects: [roman-empire, nabataean-kingdom, saba-kingdom]
  links:
    - { from: roman-empire, to: saba-kingdom, note: "마리브 포위와 퇴각(기원전 25)" }
