- id: sasanian-civil-war-628
  year: 628
  endYear: 632
  title:
    ko: "사산 제국의 내분과 야즈데게르드 3세의 즉위(628~632)"
  summary:
    ko: "628년 2월 25일 파루흐 호르미즈드(이스파흐부단 가문의 스파흐베드)와 아들 로스탐·파루흐자드가 이끈 귀족 연합이 호스로 2세를 폐위해 가두고, 아들 카바드 2세가 즉위했다. 카바드 2세는 아버지를 처형했고 이복형제들도 죽였으며, 동로마의 헤라클레이오스와 평화 조약을 맺어 점령지를 돌려주기로 했다. 그러나 628년 9월 6일 역병으로 죽었다. 그 뒤 여덟 살의 아르다시르 3세(재위 628~630)가 섰지만 재상 마흐아다르 구슈나스프가 정치를 쥐었다. 서쪽에서 헤라클레이오스와 협상한 장군 샤흐르바라즈가 크테시폰을 차지해 630년 아르다시르 3세와 재상을 죽이고 왕이 되었으나 약 40일 만에 파루흐 호르미즈드(파르티아계)에게 살해되었다. 파루흐 호르미즈드는 호스로 2세의 딸 보란을 세우고 스스로 재상이 되었으나, 샤흐르바라즈의 아들 샤푸르 이 샤흐르바라즈가 보란을 몰아냈다가 곧 그 자신도 밀려났다. 이어 보란의 자매 아자르미도흐트가 파르시그 파벌의 피루즈 호스로의 지지로 즉위해(630/631년 무렵) 파루흐 호르미즈드의 청혼을 거절하고 그를 죽였다. 파루흐 호르미즈드의 아들 로스탐이 복수로 아자르미도흐트를 눈 멀게 해 죽이고 보란을 다시 세웠으나(631년 무렵), 파르시그 파벌이 반발해 보란을 제거했다. 호스로 3세·호르미즈드 6세·호스로 4세·페로즈 2세·파루흐자드 호스로 5세처럼 이름만 전하는 왕들도 있어 몇 해 사이에 열 명 안팎의 왕이 바뀌었는데, 문헌에 따라 이름과 순서가 다르고, 이 시기 사산 주화에는 왕의 이름이 한두 해 사이에 거듭 바뀌어 새겨졌다. 보란과 아자르미도흐트는 사산사에서 드물게 여성으로 왕위에 오른 이들이다. 이 틈에 카린·수렌·미흐란·이스파흐부단 같은 귀족 가문이 군대를 나누어 쥐어, 왕은 이들의 지지에 기대지 않고는 서기 어려웠다. 로스탐과 피루즈 호스로 두 파벌(파르시그와 파르티아계 파흘라브)의 타협으로 호스로 2세의 손자 야즈데게르드 3세(재위 632~651)가 즉위하면서 내분은 끝났다."
  subjects: [sasanian-empire, byzantine-empire]
  tags: [politics]
  sources: ["Parvaneh Pourshariati, Decline and Fall of the Sasanian Empire: The Sasanian-Parthian Confederacy and the Arab Conquest of Iran (I. B. Tauris, 2008)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "타바리, 『예언자들과 왕들의 역사』"]

- id: muhammad-death-632
  year: 630
  endYear: 632
  title:
    ko: "아라비아의 통합과 무함마드의 죽음(630~632)"
  summary:
    ko: "메카 정복(앞의 사건 「후다이비야 협정(628)과 메카 정복(630)」) 뒤 무함마드는 630년 가을 북쪽 국경의 타부크로 원정해 동로마와 싸우지는 않았으나, 아일라(아카바)와 자르바·아드루흐 같은 변경 도시의 그리스도교도·유대교도와 인두세를 내는 대신 보호받는 조약을 맺었다. 631년은 '사절단의 해'라 불릴 만큼 아라비아 곳곳의 부족이 메디나에 사절을 보냈다. 나지란의 그리스도교도와는 공납과 신앙의 자유를 약속하는 조약이 맺어졌고, 예멘의 사산 총독 바단과 아브나가 이슬람 쪽으로 돌아섰다는 전승(앞의 사건 「사산의 예멘과 마준 지배: 와흐리즈의 사나 점령(570)에서 바단의 이슬람 수용(628)까지」)은 개종의 해를 628년으로 보는 설과 631년 무렵까지 내려 보는 설이 갈리는데, 뒤의 설을 따르면 이 무렵의 일이며, 바레인과 오만(마준) 쪽의 사산 총독과 지방 우두머리도 이슬람을 받아들이거나 조공했다고 전한다. 632년 무렵 이슬람 공동체는 메디나·메카·타이프를 비롯해 히자즈와 나지드 일부, 바레인과 예멘의 신자들로 이루어졌고 아직 통일된 행정 조직은 없었다. 632년 3월(이슬람력 10년 12월) 무함마드는 신자 수만 명과 고별 순례를 하고 아라파트에서 설교했다. 그는 632년 6월 8일 메디나에서 병으로 죽었고(60대 초반), 아이샤의 방에 묻혔다. 신자 공동체는 사키파에서 모여 아부 바크르를 후계자(칼리프)로 뽑았고, 수니파는 이를 공동체의 합의로, 시아파는 무함마드가 알리를 후계로 지명했다고 보아 이견이 이어졌다. 아라비아 대부분 부족이 메디나의 지도 아래 모이면서 곧 이어질 큰 정복의 바탕이 마련되었으나, 그 과정은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(뒤의 사건)에서 다룬다."
  subjects: [byzantine-empire, sasanian-empire]
  tags: [religion, politics]
  sources: ["W. Montgomery Watt, Muhammad at Medina (Clarendon Press, 1956)", "Ibn Ishaq(이븐 이스하크), Sirat Rasul Allah(『알라의 사도 전기』) (Alfred Guillaume 영역, The Life of Muhammad, Oxford University Press, 1955)", "Frank E. Peters, Muhammad and the Origins of Islam (State University of New York Press, 1994)", "Robert G. Hoyland, In God's Path: The Arab Conquests and the Creation of an Islamic Empire (Oxford University Press, 2015)"]
