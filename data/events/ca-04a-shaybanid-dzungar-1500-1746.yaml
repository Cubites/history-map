# 중앙아시아 사건 4차 묶음 앞 절반(ca-04a): 샤이반 왕조와 준가르의 시대 — 부하라·히바·코칸트·카자흐·모굴/야르칸드·준가르·바부르의 카불·두라니 앞의 이란과 러시아의 첫 진출 (1500 ~ 1746년)
# 범위: 무함마드 샤이바니의 트란스옥시아나 정복과 부하라 칸국 샤이반 왕조·모굴 칸들과 야르칸드 칸국·바부르의 카불 왕국·카자흐 칸국의 카심 칸·히바 칸국의 일바르스(아랍샤) 가문과 아불 가지 칸·사파비와 우즈베크의 호라산 다툼·마드라사와 낙슈반디 교단과 대상 교역·노예 무역·
#   압둘라 칸 2세의 전성·잔 왕조(아스트라한 왕조)·오이라트 연합에서 준가르 칸국으로·갈단의 타림 분지 정복·타우케 칸과 「일곱 법」·코칸트 칸국의 성립·베코비치-체르카스키의 히바 원정·준가르의 카자흐 침공과 '대재앙'·아부 알카이르 칸의 러시아 신속·나디르 샤의 중앙아시아 원정.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(모굴리스탄·투루판 밖의 호자 정권·카라델(하미)·아르군 가문의 칸다하르·헤라트의 아브달리·북부 우즈베크 소국·오이라트 연합 등)은 글로만 다뤘다.
# 날짜: 출처 달력 그대로 적었다. 히즈라력은 쓰지 않았고, 확실하지 않은 날짜는 '무렵'으로, 학설이 갈리는 해는 범위나 한 구절로 적었다. 1582년 앞 유럽·러시아 쪽 날짜는 달까지만 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제를 따랐고, 샤이반 왕조·잔 왕조(첫 등장 '(아스트라한 왕조)')·압둘라 칸 2세·카자흐(카자크와 구분)·코칸트 칸국·투루판·바다크샨으로 적었다.
#   준가르 침공·노예 무역·나디르 샤의 원정 피해 같은 민감한 내용은 어느 쪽 시각도 따르지 않고 일어난 일과 사료 사정만 적었으며, 숫자가 갈리면 범위로 적거나 싣지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(이스마일 1세와 사파비 왕조의 성립, 타흐마스프 1세의 치세, 제1차 파니파트 전투, 아크바르의 북서 경영, 아바스 1세의 즉위와 개혁, 갈단의 할하 침공, 준가르의 라싸 점령, 나디르 샤와 아프샤르 왕조 등).
#   한국사와 닿는 점은 갈단과 준가르가 청의 외몽골·티베트 복속 과정에서 맞선 일을 가리키는 것으로 한정했다.

- id: shaybani-transoxiana-1500
  year: 1500
  endYear: 1510
  title:
    ko: "무함마드 샤이바니의 트란스옥시아나 정복과 샤이반 왕조(1500~1510)"
  summary:
    ko: "15세기 말 티무르 왕조는 사마르칸트와 헤라트로 갈라져 약해졌고, 킵차크 초원의 우즈베크 유목민을 이끈 무함마드 샤이바니(샤이반 왕조, 아불 하이르 칸의 손자)가 이 틈을 노렸다. 그는 1500년 사마르칸트를 차지했으나 티무르 가문의 바부르에게 한때 빼앗겼고, 1501년 사르이풀 전투에서 이겨 사마르칸트와 부하라를 굳히며 부하라 칸국의 바탕을 세웠다. 1503년에는 타슈켄트를 다스리던 모굴 칸 마흐무드와 투루판의 아흐마드 알라크를 물리쳤고(마흐무드는 뒤에 사로잡혀 처형되었다), 1504년 무렵 페르가나에서 바부르를 밀어내 그가 카불로 가게 했다. 1505년에는 호라즘의 우르겐치를 열 달 가까운 포위 끝에 얻었고 1506년 발흐를 차지했으며, 후사인 바이카라가 죽은 뒤 아들들이 다투던 헤라트를 1507년 차지해 티무르 왕조의 마지막 근거지를 없앴다. 초원 쪽에서는 카자흐 칸국이 시르다리야 북쪽에서 힘을 키워 그의 후방을 위협했고, 샤이바니는 카자흐 술탄들과 되풀이해 싸웠으나 끝내 누르지 못했다. 한편 1501년 이란을 통일한 이스마일 1세의 사파비 왕조와는 호라산을 두고 부딪쳤고, 1510년 12월 샤이바니는 메르브 근처에서 크게 패해 죽었다. 사파비 쪽 사정은 「이스마일 1세와 사파비 왕조의 성립(1501~1510)」(뒤의 사건)에 있다. 샤이바니가 죽은 뒤 샤이반 왕조는 수윤추크 호자(재위 1511~1512)를 거쳐 쾨치쿤지(재위 1512~1530, 1510년 무렵부터라는 서술도 있다)가 칸 자리를 이었으나, 영토는 일가의 술탄들이 나누어 다스려 칸의 힘이 약했다. 카자흐 칸국 쪽 사정은 「카심 칸의 카자흐 칸국 확장과 그 뒤의 칸들(1511~1538)」(뒤의 사건)에서 이어진다. 샤이바니에게 밀린 모굴 칸들의 뒷일은 「모굴 칸들의 투루판과 야르칸드 칸국, 『타리히 라시디』(1500~1570)」(같은 해의 사건)에 있다."
  subjects: [bukhara-khanate, timurid-empire, kazakh-khanate, safavid-iran, turfan-khanate]
  links:
    - { from: bukhara-khanate, to: timurid-empire, note: "헤라트를 차지함 (1507)" }
  tags: [war, politics]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)", "Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)"]

- id: moghul-yarkand-1500
  year: 1500
  endYear: 1570
  title:
    ko: "모굴 칸들의 투루판과 야르칸드 칸국, 『타리히 라시디』(1500~1570)"
  summary:
    ko: "유누스 칸(재위 1462~1487)이 죽은 뒤 모굴리스탄은 서쪽의 마흐무드 칸(재위 1487~1508, 타슈켄트)과 동쪽의 아흐마드 알라크(재위 1487~1503 무렵, 투루판)로 나뉘어 다스려졌다. 둘 다 1503년 무함마드 샤이바니의 부하라 칸국에 패해 서쪽의 모굴 세력은 꺾였고, 아흐마드 알라크의 아들 만수르 칸(재위 1503~1543 무렵, 목록에 따라 1545 또는 1548)이 투루판을 이었다. 만수르는 1513년 카라델(하미)의 지배자를 꺾고 하미를 차지했다. 그 아우 술탄 사이드는 1514년 타림 분지 서쪽에서 도글라트 가문의 미르자 아부 바크르를 몰아내고 카슈가르와 야르칸드를 얻어 야르칸드 칸국을 세웠다. 사이드 칸(재위 1514~1533)은 형 만수르를 이름뿐인 윗사람으로 모셨으나 실제로는 따로 다스렸고, 티베트 쪽 원정길에서 죽었다. 뒤를 이은 압두라시드 칸(재위 1533~1560 무렵, 1565로 적는 목록도 있다)은 카자흐와 서쪽 모굴리스탄 땅을 다투다 잃어 칸국의 터가 타림 분지로 좁혀졌고, 이어 압둘카림(재위 1560~1591) 등이 칸이 되었다. 투루판에서는 만수르 뒤 샤 칸(재위 1545 무렵~1570)을 거쳐 마지막 칸 무함마드가 있었는데, 1570년 무렵 야르칸드 칸 압둘카림의 아우이자 호탄 총독인 압두라힘이 침공해 그를 사로잡았고 투루판은 야르칸드 아래로 들어갔다. 이 시대의 기록으로 도글라트 가문의 미르자 하이다르가 카슈미르에서 1546~1547년 무렵 완성한 『타리히 라시디』가 있으며, 모굴 칸들과 도글라트 가문의 다툼, 카자흐·우즈베크와의 관계를 안에서 본 거의 유일한 사료다. 두 칸국의 궁정은 이슬람 신비주의 교단의 호자 가문에 기댔는데, 호자들의 다툼은 훗날 준가르를 끌어들이는 원인이 된다. 타림 분지의 오아시스 도시 사이를 잇는 대상 교역은 이 시기에도 이어졌고, 이 일은 「갈단의 타림 분지 정복과 야르칸드 칸국의 끝(1678~1705)」(뒤의 사건)으로 이어진다."
  subjects: [turfan-khanate, yarkand-khanate, bukhara-khanate, kazakh-khanate]
  tags: [politics, culture]
  sources: ["Mirza Muhammad Haidar Dughlat, A History of the Moghuls of Central Asia: The Tarikh-i-Rashidi, trans. N. Elias and E. Denison Ross (Sampson Low, Marston, 1895)", "Mirza Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: babur-kabul-1504
  year: 1504
  endYear: 1526
  title:
    ko: "바부르의 카불 왕국과 사마르칸트 재점령(1504~1526)"
  summary:
    ko: "티무르 가문의 바부르는 열두 살에 페르가나 왕이 되어 사마르칸트를 두 번 차지했으나 무함마드 샤이바니가 세운 부하라 칸국에 번번이 밀렸고, 1504년 힌두쿠시를 넘어 카불을 얻어 새 터전으로 삼았다. 카불 왕국은 산악 목지와 인도·중앙아시아를 잇는 대상로를 쥐었으나 땅이 좁아 늘 재정이 모자랐다. 바부르는 1507년 파디샤(황제) 칭호를 썼고, 같은 해 샤이바니가 헤라트를 차지하자 칸다하르를 거쳐 돌아왔다. 칸다하르는 이때 아르군 가문의 손에 있었는데, 이 가문이 신드로 옮겨 간 일은 「아르군·타르칸 왕조의 신드와 물탄, 무굴의 신드 병합(1527~1593)」(뒤의 사건)에 있다. 1510년 샤이바니가 메르브에서 죽자 바부르는 이스마일 1세의 도움을 받아 1511년 가을 사마르칸트를 다시 얻었다. 그러나 사파비의 후원을 받는 처지에 놓여 현지의 지지가 약해졌고, 1512년 11월 가즈데완에서 사파비·바부르 연합군이 우바이둘라가 이끈 우즈베크 군에 크게 지면서 트란스옥시아나를 영영 잃었다. 이 싸움은 「사파비 왕조와 우즈베크의 호라산 다툼(1512~1540)」(뒤의 사건)에서 더 다룬다. 그 뒤 바부르는 눈을 인도로 돌려 1519년부터 펀자브 쪽을 되풀이해 건드렸고, 1522년 칸다하르를 아르군 가문에게서 얻어 카불과 이었다. 그는 이 시기를 투르크어(차가타이어)로 쓴 회고록 『바부르나마』에 남겼는데 풍경과 사람, 정원과 과일까지 세밀하게 적어 근세 중앙아시아의 귀한 사료로 꼽힌다. 1526년 델리 술탄국의 이브라힘 로디를 꺾은 일은 「제1차 파니파트 전투와 바부르의 무굴 제국(1526~1530)」(뒤의 사건)에 있고, 바부르 사후 무굴 제국에서 카불은 후마윤의 아우 캄란이 맡는 등 계속 무굴의 땅이었다. 이는 수르 왕조가 델리를 차지한 시기에도 이어졌고, 그 경과는 「차우사·카나우지 전투와 후마윤의 망명(1539~1545)」(뒤의 사건)에서 볼 수 있다."
  subjects: [babur-kabul-kingdom, timurid-empire, bukhara-khanate, safavid-iran, arghun-dynasty, mughal-empire]
  tags: [politics, war, culture]
  sources: ["Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)", "Stephen Frederic Dale, The Garden of the Eight Paradises: Babur and the Culture of Empire in Central Asia, Afghanistan and India (1483–1530) (Brill, 2004)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: kasym-kazakh-1511
  year: 1511
  endYear: 1538
  title:
    ko: "카심 칸의 카자흐 칸국 확장과 그 뒤의 칸들(1511~1538)"
  summary:
    ko: "카자흐 칸국은 자니벡과 케레이가 아불 하이르 칸의 우즈베크에서 갈라져 나온 1460년대에 시작했다고 보는 것이 카자흐 사학의 통설이며(러시아 쪽 학설은 아불 하이르가 죽은 1468~1471년 뒤로 본다), 그 성립 시기 논의는 아직 끝나지 않았다. 부룬둑 칸(재위 1480~1511)은 이름뿐인 칸이었고 자니벡의 아들 카심이 실권을 쥐었다. 카심은 한때 같은 칭기즈 칸의 후예인 무함마드 샤이바니와 킵차크 초원 주도권을 두고 싸웠고, 샤이바니가 1510년 메르브에서 죽은 뒤 부하라 칸국의 압박이 줄어 시르다리야 북쪽 초원에서 카자흐의 힘이 다시 커졌다고 한다. 카심은 1511년 무렵 부룬둑을 밀어내고 칸의 자리에 올라 1518년 또는 1521년까지 다스렸다고 한다. 카자흐의 생활 기반은 양·말·낙타를 키우는 계절 이동 유목이었고 시르다리야 중류의 도시들은 교역과 방어의 거점이었다. 그의 치하에서 카자흐는 시르다리야 중류의 도시들과 오늘날 카자흐스탄 대부분을 아우르는 유목 국가로 컸고, 카자흐 전승은 그에게 처음으로 법을 글로 적은 칸이라는 이름('카심 칸의 빛나는 길')을 붙인다. 같은 때 일어난 우즈베크와 사파비의 싸움은 「사파비 왕조와 우즈베크의 호라산 다툼(1512~1540)」(뒤의 사건)에 있다. 카심의 땅 가운데 서쪽 모굴리스탄 쪽은 뒤에 야르칸드의 압두라시드와 다투는 자리가 된다. 카심이 죽은 뒤에는 마마시(재위 1518~1523 무렵)와 타히르(재위 1523~1533)가 칸이 되었으나 우즈베크와 모굴에 밀려 땅이 줄었고, 부이다시(재위 1533~1538)와 같은 때 아흐메트·토기임 같은 경쟁 칸이 나와 갈라졌다. 이를 다시 모은 사람이 하크 나자르(재위 1538~1580)다. 카자흐 칸국의 이 시기는 문자 사료가 모굴 쪽 『타리히 라시디』와 우즈베크 쪽 기록에 기대 후대에 정리한 것이어서 해와 재위가 학설마다 한두 해에서 열 해까지 다르다."
  subjects: [kazakh-khanate, bukhara-khanate, yarkand-khanate]
  tags: [politics, society]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Mirza Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)"]

- id: khiva-khanate-1511
  year: 1511
  endYear: 1663
  title:
    ko: "일바르스 가문의 히바 칸국과 아불 가지 칸(1511~1663)"
  summary:
    ko: "아무다리야 하류의 호라즘은 1505년 무함마드 샤이바니에게 점령되었다가, 사파비의 주둔군이 쫓겨난 1511년 샤이반 왕조의 일족인 일바르스가 칸이 되어 히바 칸국(아랍샤 가문)을 열었다. 사파비와 우즈베크의 다툼은 「사파비 왕조와 우즈베크의 호라산 다툼(1512~1540)」(뒤의 사건)에서 다룬다. 일바르스(재위 1511~1518) 뒤에는 술탄 하지(1518~1519), 하산 쿨리(1519~1524), 부주가(1524~1529), 수피얀(1529~1535), 아브니크(1535~1538)가 차례로 이어졌는데 부주가와 수피얀의 재위는 출처마다 서로 바뀌어 있다. 1538년 무렵 부하라의 우바이둘라가 호라즘을 침공해 한동안 손에 넣었다가 물러났고, 아브니크는 부하라와 싸우던 중 죽었다는 서술도 있다. 칼(1539~1549), 아카타이(1549~1557), 두스트 무함마드(1557~1558)를 거쳐 하지 무함마드 1세가 1558년부터 1602년까지 오래 다스렸고, 이때 잉글랜드 상인 앤서니 젠킨슨이 지나갔으며 부하라의 침공(1593년 무렵)과 반격이 있었다. 아랍 무함마드 1세(1602~1623) 때 아무다리야 물길이 바뀌어 도읍이 우르겐치에서 히바로 옮겨 갔다고 하며 그 시기는 17세기 초 무렵으로 1600년부터 1619년까지 학설이 갈린다. 이스판디야르(1623~1643)에 이어 아불 가지 바하두르(1643~1663)가 칸이 되었다. 그는 일찍이 사파비 이란에서 오래 망명했고 칼미크의 약탈을 막아 냈으며 우즈베크와 투르크멘 부족을 다스렸다. 그는 튀르크어로 투르크멘의 계보를 적은 책과 튀르크·몽골 계보사 『샤자라이 투르크』를 남겼고, 뒤의 책은 아들 아누샤(재위 1663~1685)가 마무리했다고 전해진다. 히바의 힘은 투르크멘 부족 군사력에 기댔고, 이웃 부하라와는 해마다 국경 지대를 두고 다퉜다. 쿵그라트 가문이 실권을 쥐는 뒷일은 「쿵그라트 가문의 히바 칸국(1770~1825)」(뒤의 사건)에 있다."
  subjects: [khiva-khanate, bukhara-khanate, safavid-iran]
  tags: [politics, culture]
  sources: ["Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)", "Abu'l-Ghazi Bahadur Khan, Shajara-i Tarakima (17세기 사료, 투르크멘 계보)", "Abu'l-Ghazi Bahadur Khan, Shajara-i Turk (17세기 사료, 튀르크·몽골 계보)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: safavid-uzbek-wars-1512
  year: 1512
  endYear: 1540
  title:
    ko: "사파비 왕조와 우즈베크의 호라산 다툼(1512~1540)"
  summary:
    ko: "이스마일 1세는 1510년 메르브에서 무함마드 샤이바니를 꺾고 헤라트와 호라산을 얻었다(「이스마일 1세와 사파비 왕조의 성립(1501~1510)」, 앞의 사건). 샤이반 왕조는 이를 되찾으려 했고, 사파비는 바부르를 앞세워 아무다리야 너머를 노렸다. 그러나 1512년 11월 12일 부하라 북쪽 가즈데완에서 이스마일 1세가 보낸 대신 나즘 에 사니의 군대와 바부르의 병력이 샤이바니의 조카 우바이둘라 술탄이 이끈 우즈베크 군에 크게 졌다. 나즘은 사로잡혀 죽고 바부르는 히사르로 달아난 뒤 바부르의 카불 왕국으로 돌아갔다. 사파비 장수들이 나즘에게 협력하지 않았다는 기록이 있고, 앞서 카르시에서 일어난 주민 살육이 바부르를 괴롭게 했다는 기록도 있다. 이 패배로 사파비는 트란스옥시아나를 되찾을 길을 잃었고, 이스마일 1세가 1514년 찰디란에서 오스만 제국에 진 뒤로는 동쪽에 힘을 쏟기도 어려웠다. 그 뒤 우즈베크는 호라산을 되풀이해 노렸고, 헤라트의 주인은 1510년부터 사파비였지만 우바이둘라의 공격이 1524년부터 잦아졌다(「타흐마스프 1세의 치세: 크즐바시 내전과 우즈베크, 카즈빈 천도(1524~1576)」, 뒤의 사건). 1528년 9월 열네 살의 타흐마스프 1세는 잠 근처 싸움에서 우즈베크를 꺾었다. 그러나 우바이둘라는 1528년 무렵부터 1530년 여름까지 헤라트를 한동안 차지했다가 쫓겨났다고 하며(서술에 따라 포위만 적기도 한다), 우즈베크는 1530년 이후에도 되풀이해 헤라트를 노렸다. 샤이반 왕조 안에서는 쾨치쿤지(재위 1512~1530)와 아부 사이드(1530~1533)에 이어 우바이둘라가 1533년부터 부하라 칸이 되어 1540년 죽을 때까지 호라산 원정과 부하라 건설을 이끌었다. 그 밑에서 미르이 아랍 마드라사가 1530년대에 세워졌다. 우바이둘라가 죽은 뒤 압둘라 1세(1540)와 압둘라티프(1540~1552)가 칸이 되었으나 샤이반 일가 내부의 다툼이 커져 호라산 압박이 한동안 잦아들었고, 우즈베크가 헤라트를 다시 크게 위협하는 것은 1580년대 압둘라 칸 2세부터다."
  subjects: [safavid-iran, bukhara-khanate, babur-kabul-kingdom, ottoman]
  tags: [war, politics]
  sources: ["Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)"]

- id: madrasa-trade-bukhara-1550
  year: 1550
  endYear: 1700
  title:
    ko: "마드라사와 낙슈반디 교단, 대상 교역과 노예 무역(1550~1700)"
  summary:
    ko: "16~17세기 부하라와 사마르칸트는 정치가 어지러운 중에도 학문과 건축의 중심이었다. 부하라에는 우바이둘라 때 세운 미르이 아랍 마드라사(1530년대)와 모다리 칸 마드라사(1567), 압둘라 칸 2세의 코시 마드라사(1588~1590)가 올랐고, 사마르칸트의 레기스탄 광장에는 잔 왕조의 사마르칸트 총독 얄랑투시 바하두르가 울루그 베그 마드라사 맞은편에 셰르도르(1619~1636)를, 이어 틸랴코리(1646~1660)를 세웠다. 이슬람 신비주의 낙슈반디 교단은 호자 아흐라르 이래 사회·정치에서 큰 힘을 지녔고, 주이바리 호자 가문은 막대한 와크프(기증 재산)를 쥐고 칸들의 후견이자 중재자로 움직였다. 타림 분지에서는 마흐둠이 아잠의 후손인 호자들이 이샤키야(카라 타글리크)와 아파키야(아크 타글리크)로 갈라져 야르칸드 칸국의 권력을 좌우했다. 교역은 인도·이란·러시아 세 방향으로 뻗었다. 카불과 발흐를 지나는 길로 말이 무굴 제국의 인도로 가고 면직물이 들어왔으며, 부하라에는 인도 상인 공동체가 자리 잡았다. 1556년 러시아가 아스트라한 칸국을 차지하자 볼가강 길의 러시아 상인이 부하라와 히바를 찾았다. 해로가 열리면서 대상 교역이 일찍 쇠퇴했다는 오랜 통설은 근래 연구가 이 시기에도 교역이 이어졌다고 반박해 학자마다 평가가 다르다. 노예 무역은 교역의 어두운 얼굴이었다. 우즈베크와 투르크멘의 약탈로 사로잡힌 사파비 왕조 이란 호라산의 시아파, 남러시아 초원의 러시아인과 칼미크 포로가 부하라와 히바 시장에서 팔렸다. 포로의 규모는 사료가 드물고 학자마다 추산이 크게 달라 한 숫자로 말하기 어렵다. 이 모든 일은 칸의 힘이 약해지고 실권이 부족장과 호자에게 넘어가던 17세기 정치 변화와 맞물려 있었다."
  subjects: [bukhara-khanate, khiva-khanate, yarkand-khanate, safavid-iran, mughal-empire, russia-tsardom, astrakhan-khanate]
  tags: [culture, society, economy, religion]
  sources: ["Scott C. Levi, The Indian Diaspora in Central Asia and Its Trade, 1550–1900 (Brill, 2002)", "Robert D. McChesney, Waqf in Central Asia: Four Hundred Years in the History of a Muslim Shrine, 1480–1889 (Princeton University Press, 1991)", "Audrey Burton, The Bukharans: A Dynastic, Diplomatic and Commercial History, 1550–1702 (St. Martin's Press, 1997)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: abdullah-khan-bukhara-1583
  year: 1583
  endYear: 1598
  title:
    ko: "압둘라 칸 2세와 부하라 칸국의 전성(1583~1598)"
  summary:
    ko: "샤이반 왕조는 우바이둘라 이후 일족의 술탄들이 부하라·사마르칸트·타슈켄트·발흐를 나누어 다스렸고, 압둘라티프(재위 1540~1552)·나우루즈 아흐마드(1552~1556)·피르 무함마드 1세(1556~1561)·이스칸다르(1561~1583)로 칸이 이어졌다. 이 중 이스칸다르의 아들 압둘라가 아버지의 이름으로 1560년대부터 실권을 쥐고 발흐(1573)와 타슈켄트(1576)를 차례로 합쳤다. 압둘라 칸 2세는 1583년 아버지가 죽자 정식으로 칸이 되었고 1584년 바다크샨을 차지했다. 이때 무굴의 아크바르는 동쪽 경계를 두고 그와 불가침을 맺었고(「아크바르의 북서 경영: 카불·카슈미르·신드·칸다하르(1585~1595)」, 뒤의 사건), 압둘라는 사파비 이란과의 싸움에 힘을 쏟을 수 있었다. 사파비에서 아바스 1세가 즉위한 1587년 직후의 혼란을 타 1587~1588년 무렵부터 호라산을 공격해 헤라트에 이어 마슈하드를 차지했고, 헤라트 함락은 1589년 2월로 적으며 1588년 말로 적는 서술도 있다. 이 지역을 되찾으려는 아바스 1세의 반격은 「아바스 1세의 즉위와 개혁: 군제 정비와 우즈베크 격퇴(1587~1598)」(뒤의 사건)에 있다. 1593~1594년에는 히바 칸국의 호라즘도 차지했다. 안으로는 상업과 관개, 교통로를 정비해 대상 숙소와 다리, 저수지를 곳곳에 세웠고 코시 마드라사(1588~1590)도 이 시기 건축이다. 그러나 말년에 카자흐 칸 타우켈이 이끄는 카자흐가 북쪽에서 힘을 키웠다. 압둘라는 1598년 초에 죽었고, 아들 압드 알무민이 한동안 칸이 되었으나 몇 달 만에 살해되었다. 헤라트와 마슈하드도 같은 해 아바스 1세가 되찾았다. 그가 죽으면서 샤이반 왕조는 끝이 가까워졌고 이 일은 「샤이반 왕조의 끝과 잔 왕조의 부하라 칸국(1599~1711)」(뒤의 사건)에 이어진다."
  subjects: [bukhara-khanate, safavid-iran, mughal-empire, khiva-khanate, kazakh-khanate]
  tags: [politics, war]
  sources: ["Audrey Burton, The Bukharans: A Dynastic, Diplomatic and Commercial History, 1550–1702 (St. Martin's Press, 1997)", "Roger M. Savory, Iran under the Safavids (Cambridge University Press, 1980)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: janid-bukhara-1599
  year: 1599
  endYear: 1711
  title:
    ko: "샤이반 왕조의 끝과 잔 왕조의 부하라 칸국(1599~1711)"
  summary:
    ko: "압둘라 칸 2세가 죽은 뒤 그의 아들 압드 알무민이 1598년 칸이 되었으나 몇 달 만에 살해되었고, 피르 무함마드 2세(재위 1598~1599)가 뒤를 이었다. 1599년 바키 무함마드가 그를 꺾고 부하라를 차지하면서 샤이반 왕조가 끝나고 잔 왕조가 섰다. 이 왕조는 아스트라한 칸국의 칭기즈 칸 후예 자니 무함마드가 1555~1556년 무렵 러시아에 쫓겨 부하라로 피신해 샤이반 가문과 혼인한 데서 시작해 아스트라한 왕조라고도 부른다. 잔 왕조의 칸은 바키 무함마드(재위 1599~1605 무렵), 발리 무함마드(1605~1611 무렵), 이맘 쿨리(1611~1641, 죽음 1642), 나디르 무함마드(1642~1645), 압둘아지즈(1645~1681), 수반 쿨리(1681~1702), 우바이둘라(1702~1711)로 이어졌고 재위 해는 목록마다 한두 해씩 다르다. 1598년 카자흐 칸 타우켈이 타슈켄트를 얻어 타슈켄트는 부하라의 손에서 떠났고, 이맘 쿨리 때 얄랑투시 바하두르 같은 우즈베크 부족장이 사마르칸트 등에서 힘을 키웠다. 그 열매가 레기스탄의 셰르도르와 틸랴코리 마드라사다. 나디르 무함마드는 발흐를 다스리다 아들 압둘아지즈에게 밀려 무굴 샤자한에게 도움을 청했고, 무굴군이 1646년 발흐와 바다크샨에 들어갔으나 지치고 비싼 싸움 끝에 1647년 물러났다(「샤자한의 치세: 타지마할과 샤자하나바드, 칸다하르 다툼(1628~1656)」, 뒤의 사건). 17세기 후반 수반 쿨리 때에 발흐·히사르·히바에 대한 영향력을 다투고 건축과 문예를 후원했으나, 칸의 힘은 점점 부족장과 호자에게 넘어갔다. 1711년 우바이둘라가 부족장에게 암살되고 아불 파이즈(재위 1711~1747)가 올랐으나 실권이 없어, 칸국은 더욱 쪼개졌다. 이 쪼개짐은 「망기트 가문의 실권과 부하라 토후국의 성립(1747~1800)」(뒤의 사건)에서 망기트 가문의 집권으로 이어진다."
  subjects: [bukhara-khanate, mughal-empire, kazakh-khanate, khiva-khanate]
  tags: [politics, war]
  sources: ["Audrey Burton, The Bukharans: A Dynastic, Diplomatic and Commercial History, 1550–1702 (St. Martin's Press, 1997)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Robert D. McChesney, Waqf in Central Asia: Four Hundred Years in the History of a Muslim Shrine, 1480–1889 (Princeton University Press, 1991)"]

- id: dzungar-founding-1634
  year: 1634
  endYear: 1671
  title:
    ko: "오이라트 연합에서 준가르 칸국으로(1634~1671)"
  summary:
    ko: "15~16세기 서몽골의 오이라트(두르벤 오이라트, 곧 '네 오이라트': 초로스·두르벳·토르구트·호슈트 등)는 몽골 칸들과 싸우며 천산 북쪽과 알타이 사이에서 느슨한 연합을 이루었다. 17세기 초 러시아와 카자흐 세력, 할하 몽골에 밀리자 토르구트 일부는 볼가강 하류로 옮겨 갔고(「칼미크의 볼가강 이주와 노가이 오르다의 무너짐」, 앞의 사건), 호슈트의 구시 칸은 티베트로 갔다. 이리 계곡과 타르바가타이에 남은 초로스 부족의 바투르 훙타이지가 1634년 오이라트를 모아 준가르 칸국의 첫 훙타이지(에르데니 바투르, 재위 1634~1653)가 되었다. 준가르라는 이름은 '왼쪽 날개'를 뜻하는 몽골어에서 왔다. 그는 러시아와 교역하고 이리 계곡과 타르바가타이에서 농경민을 정착시켜 곡물과 수공업을 키웠으며 1640년 오이라트와 할하 몽골 귀족들의 회의에서 「몽골-오이라트 법전」이 만들어지는 데 힘을 보탰다. 티베트 불교(겔룩파)가 준가르 지배 이념이었으며, 카자흐 칸국과는 1635년 무렵부터 되풀이해 부딪쳤다. 1643년 겨울 준가르의 카자흐 원정은 카자흐 칸 잔기르(재위 1628~1652)와 얄랑투시 바하두르의 반격으로 물러났고, 카자흐 쪽 전승은 이를 오르불락 전투라 부르며 소수 병력의 승리로 기억하지만 병력 숫자는 전승마다 다르다. 바투르가 죽은 뒤 아들 셍게(1653~1671)가 이었으나 이복형제들과 다투다 암살당했고(1670 또는 1671), 티베트에서 돌아온 아우 갈단이 권력을 잡았다. 준가르가 일어서면서 천산 북쪽 목지의 주인이 카자흐에서 준가르로 바뀌었고, 이 갈단의 시대는 「갈단의 타림 분지 정복과 야르칸드 칸국의 끝(1678~1705)」(뒤의 사건)으로 이어진다."
  subjects: [dzungar-khanate, kazakh-khanate, mongols]
  tags: [politics, war]
  sources: ["Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)", "Michael Khodarkovsky, Where Two Worlds Met: The Russian State and the Kalmyk Nomads, 1600–1771 (Cornell University Press, 1992)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: galdan-tarim-1680
  year: 1678
  endYear: 1705
  title:
    ko: "갈단의 타림 분지 정복과 야르칸드 칸국의 끝(1678~1705)"
  summary:
    ko: "갈단은 형 셍게가 암살당한 1670~1671년 티베트에서 돌아와 훙타이지(재위 1671~1697)가 되었다. 그는 겔룩파 승려로 자랐고 5대 달라이 라마의 후원을 받으며 오이라트의 여러 부족을 눌렀다. 같은 때 타림 분지의 야르칸드 칸국에서는 이스마일 칸(재위 1670~1678)과 호자 아파크가 이끄는 아크 타글리크(백산파) 교단이 맞섰다. 갈단은 1677~1678년 아파크 호자의 도움 요청으로 개입했고 야르칸드 칸국은 1680년에 끝났다는 서술이 일반적이며, 정복의 해를 1678년 또는 1680년으로 적는 서술이 갈린다. 칸 목록은 이스마일 뒤에 그의 아우 압두라시드 2세(1678~1680)를 올리나 그 경위는 서술마다 다르다. 그 뒤 아파크 호자(1680~1690), 무함마드 이민(1690~1692), 야히야 호자(1692~1695), 악바시(1695~1705)가 차례로 준가르가 세운 칸이나 호자로서 이름뿐인 지위를 이었고, 준가르는 오아시스 도시에서 세금과 공납을 거뒀다. 아크 타글리크와 카라 타글리크(흑산파)의 다툼은 이 시기에도 계속되었다. 준가르는 갈단이 할하 몽골을 침공한 1688년부터 강희제와 맞섰고(「갈단의 할하 침공과 강희제의 친정(1688~1697)」, 뒤의 사건), 청은 1696~1697년 하미의 위구르 지배자를 귀순시켜 하미를 준가르를 막는 길목으로 삼았다. 갈단은 1696년 자오모도에서 크게 지고 1697년 죽었으며, 조카 체왕 랍탄(재위 1697~1727)이 준가르를 이어받았다. 이 흐름은 몽골고원과 티베트까지 청과 준가르가 겨룬 과정의 일부이며, 청의 승리는 「청의 외몽골·티베트·칭하이 복속」(한국사 06-joseon-late, 뒤의 사건)과 이어진다. 준가르의 타림 분지 지배는 1750년대 청의 정벌로 끝나는데, 그 뒤의 신장 통치는 「청의 신장 통치와 카자흐·코칸트 교역(1759~1820)」(뒤의 사건)에 있다."
  subjects: [dzungar-khanate, yarkand-khanate, qing]
  links:
    - { from: dzungar-khanate, to: yarkand-khanate, note: "야르칸드 칸국을 정복함 (1678~1680)" }
  tags: [war, politics, religion]
  sources: ["Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: tauke-seven-laws-1680
  year: 1680
  endYear: 1718
  title:
    ko: "타우케 칸과 「일곱 법」, 세 주즈의 갈림(1680~1718)"
  summary:
    ko: "카심 칸 이후 카자흐 칸들은 하크 나자르(재위 1538~1580), 시가이(1580~1582), 타우켈(1582~1598), 에심(1598~1628), 잔기르(1628~1652), 바하두르(1652~1680)로 이어졌고, 에심 때에는 이전 법을 모은 법이 있었다고 한다. 준가르가 천산 북쪽에서 일어서며 카자흐에 압력을 더하던 1680년 타우케가 칸이 되어 1715년(1718년으로 적는 서술도 있다)까지 다스렸다. 갈단의 준가르는 1681~1687년 타우케의 카자흐와 싸웠고, 그 조카 체왕 랍탄의 군대가 1683년 타슈켄트와 시르다리야 쪽까지 나아가 1685년 탈라스를 차지하고 1687년 투르키스탄을 포위했다고 한다. 그는 관습법을 가다듬어 「일곱 법」(제티 자르기)이라 불리는 법으로 묶은 칸으로 기억되며, 세 주즈의 이름난 비 톨레(대주즈)·카지벡(중주즈)·아이테케(소주즈)가 법과 재판을 도왔다고 전한다. 이 무렵 대·중·소 세 주즈로 나뉘는 틀이 굳었고(1698년 무렵으로 적는 서술이 있다), 칸 아래에서 각 주즈가 따로 목지와 전사들을 거느렸다. 타우케는 투르키스탄을 거점으로 주즈들을 이어 보려 했고, 1710년 무렵에는 타슈켄트 가까운 쿤토베에서 세 주즈가 모여 준가르에 맞서 아우기르에서 이겼다고 한다. 그러나 이 모임과 승리는 카자흐 전승에 기대어 문헌 사료로는 확인이 어렵다. 타우케가 죽은 뒤 소주즈의 아부 알카이르와 카이프가 다투었고 세 주즈가 한 사람의 지휘 아래 움직이기 어려워졌으며, 아부 알카이르가 대표 칸으로 불리기도 했으나 주즈마다 따로 움직였다. 이 분열은 곧 이어진 준가르의 대침공 때 큰 약점이 되었고, 그 이야기는 「준가르의 카자흐 침공과 '대재앙'(1723~1730)」(뒤의 사건)에 있다. 카자흐 칸국은 이 시기에 유목 사회가 법과 비의 판결, 부족 회의로 질서를 세운 사회였고, 타우케의 법이 정확히 어떤 조항이었는지는 후대의 정리에 의존한다."
  subjects: [kazakh-khanate, dzungar-khanate]
  tags: [politics, society]
  sources: ["Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: kokand-founding-1709
  year: 1709
  endYear: 1770
  title:
    ko: "샤 루흐 비와 코칸트 칸국의 성립(1709~1770)"
  summary:
    ko: "18세기 초 부하라 칸국의 힘이 약해지자 페르가나 계곡은 부하라의 손을 벗어났다. 이곳에서 우즈베크 밍 부족의 샤 루흐 비(재위 1709~1722)가 1709년 무렵 코칸트 가까이 요새를 쌓고 독립 세력을 세운 것이 코칸트 칸국의 시작이다. 이때는 칸이 아니라 비(부족 장)를 칭했다. 아들 압둘라힘 비(1722~1734)는 호잔트와 우라튜베, 사마르칸트까지 건드렸으나 호잔트에서 살해되었다. 압둘카림 비(1734~1751)는 1740년 도읍을 코칸트로 옮겨 도시를 키웠다. 그동안 준가르가 페르가나로 압력을 가해, 1742년 침공이 있었고 1745년에는 코칸트를 에워쌌으나 갈단 체렝이 죽자 물러났다. 압둘카림은 평화를 얻으려 맏아들 바바 비를 인질로 넘겼다. 이르다나 비(1751~1752, 1753~1769)는 1752년 준가르의 지원을 받은 바바 비에게 쫓겨났다가 이듬해 돌아왔고, 1765년에는 타슈켄트를 한때 차지했으나 아블라이 칸에게 되찾겼다고 한다. 1750년대 후반 청이 준가르를 무너뜨리고 타림 분지를 차지하자(「건륭제의 준가르 정벌과 신장 편입(1755~1759)」, 뒤의 사건) 이르다나는 청과 사절을 주고받았다. 이 관계의 성격은 분명하지 않아, 근래 연구는 청의 지배로 보는 옛 서술에 의문을 던진다. 술라이만 비(1769~1770)가 몇 달 만에 살해된 뒤 나르부타 비가 올랐다. 페르가나는 곡물과 면, 비단이 넉넉한 땅이어서 타슈켄트와 카슈가르, 부하라를 잇는 교역으로 도시가 컸고 이 기반이 칸국의 팽창 밑천이 되었다. 코칸트는 부하라와 우라튜베를 두고 100년 넘게 다퉜고, 코칸트를 이은 칸국의 팽창은 「알림 칸과 우마르 칸의 코칸트 칸국(1798~1822)」(뒤의 사건)에서 이어진다."
  subjects: [kokand-khanate, bukhara-khanate, dzungar-khanate, qing]
  tags: [politics, war]
  sources: ["Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876: Central Asia in the Global Age (University of Pittsburgh Press, 2017)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)"]

- id: bekovich-khiva-1717
  year: 1717
  title:
    ko: "베코비치-체르카스키의 히바 원정(1717)"
  summary:
    ko: "러시아는 이미 1640년대 야이크강 어귀에 코자크의 요새 구리예프를 쌓아 카스피해 북안에 발을 들였고, 표트르 1세는 대북방 전쟁의 군비를 메우고 인도로 가는 길을 열려는 뜻에서 중앙아시아에 눈을 돌렸다. 1700년 무렵에는 히바의 칸이 보낸 사절이 러시아 신하가 되기를 청했다는 기록이 있고, 표트르는 야르칸드 쪽에 금이 난다는 소문에 이끌려 1714년 부흐홀츠를 이르티시강 위쪽으로 보냈다. 아무다리야가 옛날에는 카스피해로 흘렀다는 이야기가 있어 표트르는 물길을 되돌릴 수 있는지도 살피게 했다. 카바르다(체르케스) 영주 가문 출신의 알렉산드르 베코비치-체르카스키는 1716년 2월 지휘권을 받아 카스피해 동안에 요새를 쌓은 뒤 1716~1717년 약 6천 명의 병력을 이끌고 히바로 떠났다. 히바의 칸 시르 가지(재위 1714~1727)는 사막을 건너온 러시아군을 상대로 1717년 여름 격전을 벌였고, 러시아 쪽 서술은 러시아군이 먼저 이겼다고 하나 살아 돌아온 사람의 증언은 사흘 싸움 끝에 히바 쪽이 러시아군을 몰아냈다고 한다. 그 뒤 베코비치가 칸의 화평 제안을 믿고 병력을 여러 곳으로 나눠 머물게 하자 히바 쪽이 이를 하나씩 쳐서 많은 병사가 죽거나 노예가 되었고 베코비치도 목숨을 잃었다. 정확한 숫자와 과정은 러시아와 히바 쪽 기록이 달라 갈린다. 이 실패로 러시아는 한 세기 넘게 히바에 직접 군대를 보내지 않았고, 대신 카자흐 초원 소주즈를 통한 우회로로 눈을 돌렸다(「아부 알카이르 칸의 러시아 신속과 세 주즈(1731~1740)」, 뒤의 사건). 러시아의 히바 문제는 1839년 페롭스키 원정으로 되살아난다. 표트르는 1718년 이탈리아 출신 플로리오 베네베니를 부하라로 보내 길과 교역을 살피게 했는데, 외교와 교역으로 접근하는 방식은 이 실패 뒤에도 이어졌다."
  subjects: [russia-tsardom, khiva-khanate]
  tags: [war, diplomacy]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: aktaban-1723
  year: 1723
  endYear: 1730
  title:
    ko: "준가르의 카자흐 침공과 '대재앙'(1723~1730)"
  summary:
    ko: "준가르의 훙타이지 체왕 랍탄(재위 1697~1727)은 1717년 라싸를 차지한 뒤(「준가르의 라싸 점령과 청의 티베트 경영, 암반과 가샥(1717~1751)」, 앞의 사건) 청에 밀려 서쪽으로 눈을 돌렸다. 1723년 봄 준가르 군이 카자흐 땅으로 들어와 대주즈와 중주즈의 유목지, 투르키스탄과 타슈켄트를 한꺼번에 덮쳤다. 카자흐 사학은 이 시기를 '맨발로 달아난 대재앙'(악타반 슈브린디)이라 부른다. 주즈들은 목지를 버리고 시르다리야 남쪽의 호잔트와 사마르칸트 쪽으로 흩어져 피했고, 많은 사람이 가축과 땅을 잃었다. 이때 소주즈의 아부 알카이르 칸이 연합군의 총사령으로 추대되었다고 전한다. 반격은 1727년 무렵(1728년 설도 있다) 울리타우 산맥 서쪽 불란티강에서 시작되어, 카자흐 쪽 서술은 바투르들이 준가르군을 꺾었다고 한다. 이어 1729~1730년 무렵 아니라카이 평원에서 다시 준가르를 꺾어 침공이 사실상 끝났다. 그러나 이 싸움들의 날짜와 규모는 사료마다 달라, 대재앙이 끝난 해를 1727년 또는 1730년으로 적는 서술이 갈린다. 피해 규모를 믿을 만하게 알려 주는 일차 사료는 드물어 여기에는 숫자를 싣지 않는다. 체왕 랍탄이 1727년 죽고 갈단 체렝(재위 1727~1745)이 이어 가는 중에도 침공은 이어졌다. 이 사건은 카자흐에 큰 상처를 남겨, 이후 소주즈가 러시아에 도움을 청하는 한 배경이 되었다(「아부 알카이르 칸의 러시아 신속과 세 주즈(1731~1740)」, 뒤의 사건). 대주즈와 중주즈에서는 몇십 년 뒤 아블라이 칸이 힘을 모아 세 주즈를 이끌게 된다(「아블라이 칸과 세 주즈의 칸 추대(1771~1781)」, 뒤의 사건)."
  subjects: [dzungar-khanate, kazakh-khanate, qing]
  tags: [war, society]
  sources: ["Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)"]

- id: junior-zhuz-russia-1731
  year: 1731
  endYear: 1740
  title:
    ko: "아부 알카이르 칸의 러시아 신속과 세 주즈(1731~1740)"
  summary:
    ko: "준가르의 침공으로 지친 소주즈의 아부 알카이르 칸(1718년 즉위)은 같은 칸 가문의 경쟁자 카이프와의 싸움에서도 후원자가 필요했다. 러시아 제국의 안나 여제는 우랄 남쪽에서 바시키르와 칼미크를 누르고 히바·부하라와의 교역로를 안전하게 하려던 참이었다. 1731년 10월 21일(러시아 구력 10월 10일) 아부 알카이르는 알렉세이 테프켈레프가 이끈 러시아 사절단 앞에서 안나 여제의 신하가 되겠다고 서약했다. 중주즈의 칸 세메케도 뒤에 비슷한 서약을 했으나 그 때를 1732년·1734년·1740년으로 적는 서술이 갈린다. 그러나 이 서약이 러시아 영토로의 편입이었는지, 보호를 구하는 이름뿐인 약속이었는지는 학자마다 평가가 다르다. 러시아는 1734년 오렌부르크 원정대를 보내 오렌부르크와 요새선을 쌓기 시작했고(「오렌부르크 원정과 요새선, 바시키르의 저항」, 뒤의 사건), 이 요새선이 이후 러시아가 카자흐 초원 안으로 나아가는 발판이 된다. 카자흐 쪽에서는 서약이 소주즈 칸 한 사람이 정한 일이었고 다른 주즈의 칸들이 모두 따른 것은 아니었다. 1740년에는 훗날 아블라이 칸이 되는 중주즈의 술탄 아빌만수르가 오렌부르크에서 러시아에 서약했다고 한다. 이후 중주즈는 준가르와 러시아 사이에서 양쪽을 저울질하며 움직였다. 1735년에는 오르강 어귀에 오렌부르크가 서고(뒤에 현재 자리로 옮겼다) 그 둘레에 요새가 이어졌으며, 바시키르 봉기(1735~1740)가 일어나 소주즈 목지의 정세도 흔들렸다. 아부 알카이르는 러시아 후원을 얻어 경쟁자 카이프를 누르려 했으나 소주즈 안의 부족장들이 모두 그를 따른 것은 아니어서 이 서약은 이후 내분을 낳는 씨앗이 되기도 했다. 러시아는 서약을 근거로 소주즈의 목지 이동과 교역에 간섭하기 시작했고, 이는 뒤에 카자흐 초원 전체에 대한 행정 편입으로 이어진다."
  subjects: [kazakh-khanate, russia, dzungar-khanate]
  tags: [diplomacy, politics]
  sources: ["Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)"]

- id: nadir-central-asia-1737
  year: 1737
  endYear: 1747
  title:
    ko: "나디르 샤의 중앙아시아 원정(1737~1747)"
  summary:
    ko: "나디르 샤는 1736년 아프샤르 왕조를 열고 샤가 된 뒤(「나디르 샤와 아프샤르 왕조(1736~1747)」, 앞의 사건) 이란 동쪽 국경을 정리하는 일을 서둘렀다. 헤라트의 아브달리 아프간은 사파비의 힘이 약해진 1717년 무렵 자립했다가 1729년 나디르에게 꺾여 그의 군에 편입되었고, 칸다하르의 호타키 왕조는 1738년 나디르에게 무너졌다. 바로 이어 카불을 거쳐 인도로 들어가는 길이 열렸고, 무굴 제국의 도읍 델리 원정은 「나디르 샤의 인도 원정과 델리 약탈(1738~1739)」(뒤의 사건)에 있다. 인도에서 돌아온 나디르는 1740년 아무다리야를 건너 북쪽으로 나아갔다. 그 앞서 1737년 무렵 아들 레자 쿨리의 군대가 발흐와 안드호이 쪽 지배자들을 누르고 부하라 쪽으로 진군했다고 하며, 바다크샨까지 미쳤다고 적는 서술도 있으나 해와 범위는 사료마다 다르다. 부하라의 칸 아불 파이즈는 실권을 쥔 아탈릭 무함마드 하킴의 권유로 싸우지 않고 복속했고, 곧이어 히바 칸국으로 가 칸 일바르스 2세를 처형하고 노예로 잡혀 있던 이란 포로들을 풀어 주었다. 나디르의 군대가 지나간 곳에서 약탈과 징발이 있었다고 사료는 전한다. 히바에는 이란이 앉힌 타히르(1740~1742)가 칸이 되었으나 나디르의 힘이 약해지자 지배도 흔들렸다. 나디르는 1747년 6월 20일 쿠찬 근처에서 암살되었고, 부하라의 망기트 가문과 칸다하르의 아흐마드 샤 두라니가 곧바로 힘을 키운다(「망기트 가문의 실권과 부하라 토후국의 성립(1747~1800)」, 「아흐마드 샤의 두라니 제국과 북쪽 우즈베크 땅(1747~1793)」, 뒤의 사건). 부하라의 아불 파이즈는 1747년까지 자리를 지켰으나 실권은 아탈릭 무함마드 하킴(1740~1743, 하킴의 임명을 1721로 적는 서술도 있다)에게 있었고, 그가 죽은 뒤 몇 해의 혼란을 거쳐 아들 무함마드 라힘(1745 무렵~1753, 칸을 죽인 1747년에 실권을 굳혔다는 서술도 있다)이 실권을 쥐었다."
  subjects: [afsharid-iran, hotak-dynasty, bukhara-khanate, khiva-khanate, mughal-empire]
