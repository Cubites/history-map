- id: deccan-sultanates-1527
  year: 1527
  endYear: 1574
  title:
    ko: "바흐마니 술탄국의 끝과 데칸 술탄국들의 다툼(1527~1574)"
  summary:
    ko: "바흐마니 술탄국은 1490년 무렵부터 총독들이 떨어져 나가 힘을 잃었고, 마지막 술탄 칼리물라 샤가 1527년 비다르를 떠나 아마드나가르로 달아나면서 끝났다. 그 뒤 데칸 북부에서는 다섯 정권이 서로 다투었다. 비자푸르 술탄국(아딜 샤 왕조)은 이브라힘 아딜 샤 1세(1535~1558, 앞서 말루 아딜 샤가 1534~1535년 짧게 재위)와 알리 아딜 샤 1세(1558~1580) 때 서남 데칸을 다스렸고, 아마드나가르 술탄국(니잠 샤 왕조)은 부르한 니잠 샤 1세(1510~1553)가 도읍을 굳혔다. 골콘다 술탄국(쿠틉 샤 왕조)은 텔랑가나에서 시작해 이브라힘 쿨리 쿠틉 샤(1550~1580) 때 안드라 해안 쪽으로 세력을 넓혔다. 비다르 술탄국(바리드 샤 왕조)은 재상 가문이 세운 작은 나라로 비다르 둘레를 지켰고, 베라르 술탄국(이마드 샤 왕조)은 베라르를 다스리다 1574년 아마드나가르의 무르타자 니잠 샤에게 병합되었다. 네 나라는 라이추르 도아브와 숄라푸르 같은 국경 땅을 두고 되풀이해 싸웠고, 아마드나가르·골콘다는 시아파를 공식 신앙으로 삼았고 비자푸르는 시아파와 수니파 사이를 오갔으며, 종파 차이도 정치 다툼에 섞였다. 한편 남쪽의 비자야나가라 제국 앞에서는 때로 손을 잡았다. 이 균형은 1565년 네 술탄이 연합한 탈리코타 전투(「탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)」, 뒤의 사건)로 비자야나가라를 꺾으면서 비자푸르와 골콘다가 남쪽으로 팽창하는 길이 열렸다. 이 나라들은 페르시아·튀르크·아비시니아(에티오피아)·데칸 출신 무슬림 귀족과 마라타·텔루구 무장 세력을 함께 군대와 관청에 두었다. 비자푸르의 이브라힘 아딜 샤 2세(재위 1580~1627)는 음악 후원으로 이름이 높았고, 데칸의 화려한 건축과 세밀화는 이 술탄국들의 궁정 문화에서 나왔다. 다만 술탄들은 거듭 서로 싸웠고 그 결과 무굴이 데칸에 진출할 틈이 생겼다."
  subjects: [bahmani-sultanate, bijapur-sultanate, ahmadnagar-sultanate, golconda-sultanate, bidar-sultanate, berar-sultanate]
  links:
    - { from: ahmadnagar-sultanate, to: berar-sultanate, note: "베라르 술탄국을 병합 (1574)" }
  tags: [politics, war]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Burton Stein, A History of India (Blackwell, 1998)", "Thomas R. Metcalf·Barbara D. Metcalf, A Concise History of Modern India (Cambridge University Press, 2012)"]

- id: sindh-multan-1527
  year: 1527
  endYear: 1593
  title:
    ko: "아르군·타르칸 왕조의 신드와 물탄, 무굴의 신드 병합(1527~1593)"
  summary:
    ko: "칸다하르에서 내려온 아르군 가문의 샤 벡 아르군은 1520년대 초 삼마 왕조를 무너뜨리고 신드를 차지했다. 아들 샤 후사인 아르군은 남펀자브의 물탄 술탄국(랑가 왕조)을 오랫동안 포위한 끝에 1528년 물탄을 빼앗았고 물탄 술탄국은 끝났다. 물탄은 아르군 총독이 쫓겨나는 등 혼란이 이어졌다. 후마윤이 수르의 셰르 샤에게 쫓겨 1540년대 초 신드로 들어왔을 때 샤 후사인은 그를 돕지 않았고, 1542년 신드의 우마르코트에서 후마윤의 아들 아크바르가 태어났다. 셰르 샤의 수르 왕조는 1541년 물탄을 차지했다가 1555년 후마윤이 델리를 되찾으며 물탄도 무굴로 돌아왔다. 1555년 무렵부터 아르군의 갈래인 타르칸 가문이 신드를 이었고 명목상 무굴 황제에게 복종을 표했다. 아크바르는 라호르에 머물던 1590년대 초 압둘 라힘 칸(칸이 카나)을 신드로 보냈다. 타르칸 왕 미르자 자니 벡은 1591년 시작된 원정에 맞서다 1593년 항복해 무굴 귀족이 되었고 신드는 무굴의 수바(주)가 되었다. 신드 아래쪽(타타 둘레)은 이 뒤 1737년까지 무굴 총독이 다스렸고, 위쪽은 1701년 칼호라 가문이 무굴의 위임을 받았다(「칼호라 가문의 신드와 두라니 제국(1701~1748)」, 뒤의 사건). 신드는 인더스강 하구의 타타를 중심으로 면직물과 선박 교역으로 번성했으나, 포르투갈 함대는 1555년 타타를 약탈해 도시가 큰 피해를 입었다. 물탄은 남펀자브 상업과 순례의 중심으로 수피 성지가 많아 무굴 아래서도 종교와 학문의 중심 구실을 이어 갔다. 아르군과 타르칸 정권은 아프간·튀르크계 군인 귀족이 땅을 쥐고 신드의 토착 지주와 상인에게서 세를 걷는 군사 정권이었다."
  subjects: [arghun-dynasty, multan-sultanate, mughal-empire, sur-empire]
  links:
    - { from: arghun-dynasty, to: multan-sultanate, note: "물탄을 빼앗아 물탄 술탄국을 끝냄 (1528)" }
    - { from: mughal-empire, to: arghun-dynasty, note: "압둘 라힘 칸이 신드를 병합 (1593)" }
  tags: [politics, war]
  sources: ["H. T. Lambrick, Sind: A General Introduction (Sindhi Adabi Board, 1964)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)"]

- id: madurai-nayak-1529
  year: 1529
  endYear: 1736
  title:
    ko: "마두라이 나야크 왕조와 진지 나야크, 타밀 지방의 나야카 정권들(1529~1736)"
  summary:
    ko: "비자야나가라의 크리슈나데바 라야는 1529년 무렵 비스바나타 나야크를 마두라이에 보내 판디아 옛 땅을 맡겼다. 비스바나타는 마두라이 요새를 새로 쌓고 영토를 팔라야캄(군사 영지) 일흔두 곳으로 나눠 부하 지휘관에게 맡기는 팔라야카라 제도를 세웠다고 전한다. 비자야나가라가 1565년 탈리코타 전투에서 진 뒤 중앙의 힘이 약해지자 마두라이와 진지(젠지)의 나야크는 1600년 무렵 공납을 끊고 홀로 서게 되었다(「탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)」, 뒤의 사건). 마두라이의 티루말라이 나야크(1623~1659)는 미낙시 사원의 푸두 만다팜을 짓고 도읍을 오가며 이웃 라마나드와 마이소르, 비자푸르와 싸웠다. 1659년부터 이어진 촉카나타 나야크(1659~1682)는 마이소르의 침입에 시달렸고, 며느리 망가말은 손자를 대신해 1689~1704년 섭정을 맡아 아우랑제브의 데칸 진출 속에서 공납과 외교로 나라를 지켰다. 진지 나야크는 1649년 비자푸르 술탄국에게 진지를 잃었다. 무굴의 카르나타카 총독이 1692년 이후 아르코트에서 힘을 키우자(「카르나타카 전쟁과 뒤플렉스·클라이브의 아르코트(1746~1754)」, 뒤의 사건) 마두라이는 압박을 받았고, 1731년 즉위한 여왕 미낙시는 1736년 아르코트 나와브 도스트 알리의 사위 찬다 사히브의 속임수에 넘어가 트리치노폴리를 내주었다. 이로써 마두라이 나야크 왕조는 끝났고 남부 타밀은 카르나타카 나와브의 영향 아래 놓였다. 나야크들은 힌두 사원과 도시 계획을 후원해 마두라이 미낙시 사원 둘레에 동심원 모양으로 도시를 키웠다. 텔루구어를 쓰는 지배층이 타밀 사회와 섞이는 과정에서 팔라야카라(군사 영주)가 지역 권력으로 자랐고, 이 영주들은 18세기 영국 동인도 회사와 카르나타카 나와브가 맞설 때까지 남부 타밀의 정치를 좌우했다."
  subjects: [madurai-nayak, gingee-nayak, vijayanagara-empire, carnatic-nawab, bijapur-sultanate]
