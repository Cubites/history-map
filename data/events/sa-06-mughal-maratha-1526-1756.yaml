  tags: [war, politics, economy]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "S. Arasaratnam, Ceylon and the Dutch, 1600–1800: External Influences and Internal Change in Early Modern Sri Lanka (Variorum, 1996)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Wiley-Blackwell, 2012)"]
