- id: kalhora-sindh-1701
  year: 1701
  endYear: 1748
  title:
    ko: "칼호라 가문의 신드와 두라니 제국(1701~1748)"
  summary:
    ko: "신드는 1593년 무굴 수바가 된 뒤 무굴 총독이 다스렸다. 수피 성자 가문 출신으로 신드 북부에서 세력을 키운 칼호라 가문의 미안 야르 무함마드는 1701년 아우랑제브에게서 신드 북부의 통치를 인정받아 칼호라 왕조(탈푸르 시기에 이르는 신드 왕국)의 기틀을 놓았다. 미안 누르 무함마드(재위 1719~1753)는 1737년 무굴로부터 신드 아래쪽(타타)까지 받아 신드 전체를 쥐었다. 나디르 샤는 1739년 신드를 침입해 누르 무함마드를 쫓아냈고 막대한 공물을 요구했다(「나디르 샤의 인도 원정과 델리 약탈(1738~1739)」, 뒤의 사건). 1747년 아흐마드 샤 두라니가 칸다하르에서 두라니 제국을 세우자 신드 칼호라는 1748년 그의 종주권을 인정했다. 수틀레지강·판즈나드강 남쪽 촐리스탄 사막 가장자리의 다우드포트라 가문 아바시 나와브 바하왈 칸 1세는 1748년 칼호라와 무굴의 틈에서 바하왈푸르 주를 세웠다. 두 정권은 이후 두라니의 영향권에서 신드와 남펀자브의 토후 정권이 되었다. 신드 왕국은 칼호라 가문이 1783년까지, 이어 발루치 탈푸르 가문의 미르들이 다스렸다. 칼호라 가문은 수피 피르(지도자)로서의 종교적 권위를 토지 기증으로 굳혀 대지주 집단을 세웠고, 아라비아해 항구 카라치는 1729년 무렵 상인들이 세운 요새를 바탕으로 교역 도시로 자라기 시작했다. 신드의 농업은 인더스강 운하 관개에 크게 기댔다. 칼호라 시기 신드의 지배층은 신드 토착 지주와 발루치 부족 용병으로 갈려 있었고, 뒤에 발루치 탈푸르 가문이 이를 이용해 정권을 잡았다. 칼호라 시기의 신드 연대기는 페르시아어로 쓰였고, 이후 신드어 문학도 이 시기에 크게 성장했다."
  subjects: [talpur-sindh, bahawalpur-state, durrani-empire, mughal-empire]
  links:
    - { from: durrani-empire, to: talpur-sindh, note: "칼호라 정권이 종주권을 인정하고 공물을 바침 (1748)" }
  tags: [politics]
  sources: ["H. T. Lambrick, Sind: A General Introduction (Sindhi Adabi Board, 1964)", "Jos Gommans, The Rise of the Indo-Afghan Empire, c. 1710–1780 (Brill, 1995)", "Imperial Gazetteer of India, Vol. 8 (Clarendon Press, 1908)"]

- id: aurangzeb-death-1707
  year: 1707
  endYear: 1720
  title:
    ko: "아우랑제브의 죽음과 무굴 제국의 쇠퇴(1707~1720)"
  summary:
    ko: "아우랑제브는 1707년 3월 아마드나가르에서 88살로 죽었다. 아들들의 후계 다툼에서 바하두르 샤 1세(재위 1707~1712)가 6월 자주에서 동생 아잠 샤를 꺾고 즉위했고, 1709년 카밤 박시도 제거되었다. 바하두르 샤는 마라타와 라지푸트, 시크에 모두 타협하지 못해 지방이 흔들렸다. 라지푸트 토후국들은 1708년 마르와르(조드푸르)의 아지트 싱, 메와르, 암베르(자이푸르)가 연합해 무굴에서 이탈했다(「라지푸트 토후국과 마라타(1707~1754)」, 같은 시기의 사건). 같은 해 도스트 무함마드 칸 같은 아프간 군인이 베라시아 영지를 얻어 훗날 보팔 주의 터전을 닦았다. 바하두르 샤 뒤 자한다르 샤(1712~1713)를 지나 파루흐시야르(재위 1713~1719)는 사이이드 형제(압둘라 칸·후사인 알리 칸)의 도움으로 즉위했으나 그들의 지배를 못 견뎌 갈등했다. 1717년 파루흐시야르는 영국 동인도 회사에 벵골 무관세 교역과 캘커타 일대 마을 구입 허가를 담은 칙령(파르만)을 주었다. 1719년 후사인 알리는 마라타의 페슈와 발라지 비슈와나트와 협정을 맺어 데칸 여섯 수바에서 차우트와 사르데슈무키를 인정하는 대신 군사 지원을 얻었다. 사이이드 형제는 1719년 파루흐시야르를 폐위해 살해했고 두 허수아비 황제 뒤 무함마드 샤(재위 1719~1748)를 세웠다. 무함마드 샤는 1720년 후사인 알리를 제거했고 압둘라 칸은 1722년 죽었다. 무굴 황제의 권위는 이 시기 이미 명목에 가까워져 지방 총독과 금융업 가문이 실권을 쥐었다. 재정 면에서는 자기르 부족과 데칸 전쟁 비용이 겹쳐 귀족 봉급 지급이 늦어졌다. 연구자들은 이 과정을 무굴 '쇠퇴'로 볼지 지방 정권의 성장으로 볼지를 두고 논쟁한다."
  subjects: [mughal-empire, maratha-peshwa, jodhpur-state, mewar-state, jaipur-state, bhopal-state]
  links:
    - { from: maratha-peshwa, to: mughal-empire, note: "데칸 여섯 수바의 차우트·사르데슈무키를 인정받음 (1719)" }
  tags: [politics, war]
  sources: ["Muzaffar Alam, The Crisis of Empire in Mughal North India: Awadh and the Punjab, 1707–48 (Oxford University Press, 1986)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Parties and Politics at the Mughal Court, 1707–1740 (Oxford University Press, 2002)"]

- id: rajput-marathas-1707
  year: 1707
  endYear: 1754
  title:
    ko: "라지푸트 토후국과 마라타(1707~1754)"
  summary:
    ko: "1707년 아우랑제브가 죽자 라지푸트 토후국들은 무굴의 직접 지배에서 벗어나려 했다. 마르와르의 아지트 싱은 1708년 조드푸르를 되찾았고 메와르와 암베르의 사와이 자이 싱 2세와 함께 연합해 무굴과 협상했다. 사와이 자이 싱(재위 1699~1743)은 이후 무굴 황제 밑에서 말와 총독을 맡고, 1727년 자이푸르를 세워 도읍을 옮기고 델리 등에 천문대(잔타르 만타르)를 지었다. 아지트 싱은 1724년 아들 박트 싱과 아바이 싱에게 살해되었다. 1734년 7월 후르다에서 라지푸트 군주들이 마라타에 맞서 동맹을 논의했으나 합의하지 못했고, 마라타는 라지푸타나에서 차우트를 걷기 시작했다. 자이 싱이 죽은 뒤 이슈와리 싱과 마도 싱 1세가 자이푸르 계승을 두고 1748년 바그루에서 싸웠고(승패는 사료마다 갈린다) 이슈와리 싱은 영지 일부를 내주고 홀카르(인도르 주)에 공납하는 조건으로 자리를 지켰다가 1750년 죽자 마도 싱 1세가 이었다. 메와르는 상그람 싱 2세(재위 1710~1734) 아래서 안정되었으나 18세기 중엽 마라타의 공납 요구에 시달렸다. 코타의 하다 가문, 비카네르의 라토르 가문도 같은 압박을 받았다. 라지푸타나 토후국들은 1818년 동인도 회사와 보호 조약을 맺을 때까지 마라타의 간섭 아래 있었다. 자이푸르는 격자 길과 구역으로 나뉜 계획 도시로 지어졌고, 자이 싱은 천문 관측으로 달력을 고치려 했다. 반면 마르와르와 메와르는 내부 후계 다툼에 마라타가 끼어들면서 18세기 중엽 재정이 크게 줄었다. 이 시기 라지푸트 토후국의 군주들은 무굴 황제의 칙령에 기대어 영토를 지켰고, 마라타의 침입이 계속되자 동인도 회사의 보호를 구하는 길로 나아갔다."
  subjects: [jaipur-state, jodhpur-state, mewar-state, kota-state, bikaner-state, maratha-peshwa, mughal-empire, indore-state]
  links:
    - { from: maratha-peshwa, to: mewar-state, note: "라지푸타나에서 차우트를 걷기 시작 (1730년대)" }
  tags: [politics, war]
  sources: ["Jadunath Sarkar, A History of Jaipur (Orient Longman, 1984)", "Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "James Tod, Annals and Antiquities of Rajasthan (Smith, Elder & Co., 1829–1832)"]

- id: mughal-successor-states-1717
  year: 1717
  endYear: 1733
  title:
    ko: "무굴 지방 총독들의 자립: 벵골 나와브, 로힐칸드, 아와드, 하이데라바드(1717~1733)"
  summary:
    ko: "무굴 제국의 중앙이 약해지자 지방 수바다르(총독)가 세습 정권을 세웠다. 벵골에서는 디완 무르시드 쿨리 칸이 1717년 수바다르를 겸해 무르시다바드를 도읍으로 삼고 황제에 명목상 공납하는 사실상의 독립을 누렸다. 1727년 사위 슈자 웃딘이 이었고 1733년 비하르가 벵골 나와브에 합쳐졌다. 이 정권은 1757년 플라시에서 무너진다(「플라시 전투와 미르 자파르의 벵골(1757~1760)」, 뒤의 사건). 갠지스 평원의 로힐칸드에서는 아프간 장교 알리 무함마드 칸이 1721년 무렵 로힐라 아프간 정착민을 모아 바레일리 일대의 정권을 세웠다. 아와드에서는 페르시아 출신 사아다트 알리 칸 부르한 울 물크가 1722년 총독으로 부임해 사실상 대물림 나와브 왕조를 열었다. 데칸에서는 니잠 울물크(아사프 자 1세)가 1713~1715년과 1720~1721년 데칸 총독을 지내고, 1722~1724년 재상을 맡았다가 궁정 파벌에 환멸을 느껴 데칸으로 내려가 1724년 10월 사카르 케다 전투에서 무굴이 보낸 경쟁자 무바리즈 칸을 꺾고 하이데라바드 중심의 아사프 자 왕조를 열었다. 이들 정권은 모두 무굴 황제의 이름을 받들었으나 군사와 재정은 자립했다. 1739년 나디르 샤의 델리 약탈(「나디르 샤의 인도 원정과 델리 약탈(1738~1739)」, 뒤의 사건)이 이 흐름을 굳혔다. 이들 정권의 정통성은 무굴 황제가 내린 칙령과 칭호(나와브, 니잠)에 있었으므로 대부분 황제를 명목상 종주로 받들었고, 이는 훗날 영국 동인도 회사도 같은 칙령 체제를 이용해 권리를 주장하는 길이 되었다. 연구자들은 이 현상을 두고 '무굴 쇠퇴'인지 '지방 정권의 성장'인지를 두고 논쟁한다."
  subjects: [bengal-nawabs, rohilkhand, awadh, hyderabad-state, mughal-empire]
  links:
    - { from: hyderabad-state, to: mughal-empire, note: "사카르 케다 전투로 데칸에서 자립 (1724)" }
  tags: [politics]
  sources: ["Muzaffar Alam, The Crisis of Empire in Mughal North India: Awadh and the Punjab, 1707–48 (Oxford University Press, 1986)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "C. A. Bayly, Rulers, Townsmen and Bazaars: North Indian Society in the Age of British Expansion, 1770–1870 (Cambridge University Press, 1983)"]
