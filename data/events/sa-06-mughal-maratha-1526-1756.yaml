- id: jahangir-1605
  year: 1605
  endYear: 1627
  title:
    ko: "자한기르의 치세: 누르 자한, 메와르의 복종, 칸다하르의 상실(1605~1627)"
  summary:
    ko: "아크바르의 맏아들 살림은 1605년 10월 자한기르(재위 1605~1627)로 즉위했다. 1606년 맏아들 쿠스라우가 반란을 일으켜 진압되었고, 이 일과 얽혀 시크교 구루 아르잔이 처형되었다(「구루 아르잔의 처형과 시크 공동체의 무장화(1606~1675)」, 뒤의 사건). 1611년 황제는 페르시아 출신 미르자 기야스 벡의 딸 메르운니사와 혼인했고, 왕비는 누르 마할(궁전의 빛)로 불리다 뒤에 누르 자한(세계의 빛)이라는 칭호를 받았으며, 그의 아버지 이티마드 웃다울라와 오빠 아사프 칸이 조정의 실권을 쥐었다. 1615년 메와르의 아마르 싱이 쿠람 왕자(훗날 샤자한)와 협상해 무굴 종주권을 인정하고 치토르 성의 반환을 받았다. 1620년에는 히말라야 기슭의 캉그라 요새가 무굴에 넘어왔다. 데칸에서는 말리크 암바르에게 밀렸다(「말리크 암바르와 아마드나가르의 끝, 무굴·비자푸르·골콘다(1600~1636)」, 앞의 사건). 1622년 사파비의 아바스 1세가 칸다하르를 빼앗았다(「아바스 1세의 영토 회복: 남부 해안, 타브리즈, 칸다하르와 호르무즈(1601~1622)」, 앞의 사건). 원정 명령을 거부한 쿠람은 1622~1625년 반란을 일으켰고, 1626년에는 장군 마하바트 칸이 황제를 억류하는 일도 있었다. 이 시기 분델칸드의 오르차 왕 비르 싱 분델라가 세력을 키웠고, 바겔 왕가는 1617년 무렵 도읍을 반다브가르에서 레와로 옮겼다. 자한기르는 카슈미르 여행 중 1627년 10월 죽었다. 자한기르는 회화와 자연사에 관심이 깊어 궁정 화가 우스타드 만수르 같은 이들에게 새와 꽃을 그리게 했고, 회고록 『투주크 이 자한기리』에 일상과 판단을 직접 적었다. 궁정의 정의의 사슬(황제의 거처에 매단 사슬을 당기면 재판받는 장치)에 대한 이야기도 전한다."
  subjects: [mughal-empire, mewar-state, rewa-state]
  tags: [politics, war]
  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Wheeler M. Thackston 옮김, The Jahangirnama: Memoirs of Jahangir, Emperor of India (Oxford University Press, 1999)", "Ruby Lal, Domesticity and Power in the Early Mughal World (Cambridge University Press, 2005)"]

- id: guru-arjan-1606
  year: 1606
  endYear: 1675
  title:
    ko: "구루 아르잔의 처형과 시크 공동체의 무장화(1606~1675)"
  summary:
    ko: "시크교의 다섯째 구루 아르잔(재위 1581~1606)은 1604년 『아디 그란트』를 엮고 암리차르의 하르만디르 사힙(황금 사원)을 완성하는 등 공동체의 틀을 세웠다. 1606년 자한기르는 아르잔을 라호르에서 붙잡아 처형했다. 무굴 쪽 사료인 『투주크 이 자한기리』는 그가 반란을 일으킨 쿠스라우 왕자를 도왔다고 하고, 시크교 전승은 고문과 박해를 강조한다. 이 일로 여섯째 구루 하르고빈드(재위 1606~1644)는 영적 권위(피리)와 세속 권위(미리)를 함께 내세우며 암리차르에 아칼 타크트를 세우고 군대를 길렀다. 하르고빈드는 1609년 무렵부터 괄리오르 요새에 갇혔다 풀려났고, 이후 무굴과 몇 차례 부딪쳤다. 아홉째 구루 테그 바하두르(재위 1665~1675)는 1675년 11월 델리에서 처형되었다. 시크교 전승은 그가 카슈미르 판디트들의 청을 받아 강제 개종에 맞섰기 때문이라고 하고, 무굴 쪽 기록과 일부 연구자는 지방 반란에 얽혔거나 아우랑제브의 종교 정책 아래 다른 이유가 있었다고 본다. 어느 쪽이든 아우랑제브 아래 시크 공동체는 무굴과 갈라섰고, 열째 구루 고빈드 싱의 칼사 창설로 이어졌다(「칼사의 창설과 반다 싱 바하두르의 봉기(1699~1716)」, 뒤의 사건). 첫째 구루 나나크에서 이어진 공동체는 이 무렵 십일조(다스반트)와 지방 대리인(마사드) 제도, 도시 암리차르의 건설로 자립 조직의 기반을 갖췄다. 그래서 무굴의 탄압과 시크의 무장화를 종교 갈등만이 아니라 펀자브 농민, 특히 자트 농민 사회의 정치화와 얽힌 일로 설명하는 연구자도 있다. 이 과정에서 시크 공동체는 신앙 공동체에서 군사력을 가진 정치 공동체로 바뀌어 갔다."
  subjects: [mughal-empire]
  tags: [religion, politics]
  sources: ["J. S. Grewal, The Sikhs of the Punjab (Cambridge University Press, 1990)", "W. H. McLeod, Sikhism (Penguin, 1997)", "Louis E. Fenech, Martyrdom in the Sikh Tradition: Playing the 'Game of Love' (Oxford University Press, 2000)"]

- id: mysore-wodeyar-1610
  year: 1610
  endYear: 1704
  title:
    ko: "마이소르 워디야르 왕가의 성장: 스리랑가파트나에서 치카 데바라자까지(1610~1704)"
  summary:
    ko: "마이소르의 워디야르 왕가는 비자야나가라의 변방 영주로 14세기 말부터 마이소르 둘레를 다스렸다. 라자 워디야르(재위 1578~1617)는 1610년 비자야나가라의 총독 티루말라 라야에게서 스리랑가파트나를 빼앗아 도읍으로 삼았다. 이는 탈리코타 전투 뒤 약해진 비자야나가라의 변방에서 나야카들이 홀로 서던 흐름의 하나였다(「탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)」, 앞의 사건). 칸티라바 나라사라자 1세(재위 1638~1659)는 비자푸르군을 막아 내며 마이소르를 키웠다. 치카 데바라자(재위 1673~1704)는 북쪽으로 툼쿠르와 마두기리, 동쪽으로 살렘 쪽을 넓혔고 1687년 무굴 장군 카심 칸에게서 방갈루루를 사들였다. 샤지 본슬레가 비자푸르에게 받아 다스리던 방갈루루는 무굴이 비자푸르를 무너뜨린 뒤 무굴 땅이 되었는데, 무굴은 이를 30만 루피에 마이소르에 넘겼다고 한다. 치카 데바라자는 중앙 관청을 열여덟 부서로 나누는 행정 개혁을 했고, 1700년 무렵 아우랑제브에게서 '주그 데오 라자'라는 칭호를 받았다. 마이소르는 이 무렵 마라타·무굴·마두라이 나야크 사이에서 균형을 잡으며 카르나타카 고원 최대의 힌두 왕국이 되었다. 스리랑가파트나의 다사라 축제는 비자야나가라의 의례를 이은 왕실 행사로 이 시기에 정착했다고 한다. 18세기 중엽 하이데르 알리가 집권(1761)하기까지 워디야르 왕가는 점차 장군 가문(달라바이)에 실권을 넘겼다. 17세기 마이소르는 비자푸르와 마라타, 마두라이 나야크 사이에서 군사 균형을 읽으며 영토를 넓힌 소왕국이었다. 워디야르 왕가는 1761년 하이데르 알리가 실권을 쥔 뒤에도 명목상 왕으로 남았고, 1799년 영국이 다시 왕위를 세우면서 20세기까지 이어졌다."
  subjects: [mysore, vijayanagara-empire, mughal-empire, bijapur-sultanate, madurai-nayak]
  links:
    - { from: mysore, to: vijayanagara-empire, note: "스리랑가파트나를 빼앗아 도읍으로 삼음 (1610)" }
  tags: [politics]
  sources: ["Burton Stein, A History of India (Blackwell, 1998)", "Burton Stein, Vijayanagara (Cambridge University Press, 1989)", "Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)"]

- id: english-surat-1612
  year: 1612
  endYear: 1619
  title:
    ko: "영국 동인도 회사의 수라트 진출과 토머스 로의 사절(1612~1619)"
  summary:
    ko: "1600년 잉글랜드 여왕 엘리자베스 1세의 특허장을 받은 잉글랜드 동인도 회사는 1608년 윌리엄 호킨스를 수라트에 보냈으나 포르투갈의 방해로 성과를 얻지 못했다. 1612년 11월 토머스 베스트가 이끈 영국 함대가 수라트 앞바다 스왈리에서 포르투갈 함대를 물리치자 무굴 총독이 영국을 인정했고, 1613년 자한기르의 칙령(파르만)으로 수라트에 상관이 세워졌다. 1615년 제임스 1세가 보낸 사절 토머스 로가 수라트에 도착해 이듬해 1월 아지메르에서 자한기르를 만났다. 로는 1619년 2월까지 궁정에 머물며 무역 조약을 요구했으나 황제는 정식 조약 대신 상관 설치를 허락하는 칙령으로 갈음했고, 로는 본국에 군사 거점 없이 무역에 전념할 것을 조언했다. 포르투갈은 1535년 디우 요새 이래 해안 항로를 쥐고 통행증으로 무굴 선박을 단속했으나(「알부케르케의 고아 점령(1510)」, 앞의 사건), 영국이 서해안에서 힘을 기르면서 이 독점은 흔들렸다. 네덜란드 동인도 회사도 1602년 설립 뒤 인도 동해안 풀리캇(1609)과 구자라트에 상관을 열었다(「네덜란드 동인도 회사의 설립」, 앞의 사건). 인도의 면직물과 쪽(인디고)이 이들 상관에서 유럽으로 실려 나갔다. 수라트는 메카 순례선이 떠나는 항구로 '메카의 문'이라 불렸고, 황실 여성이 소유한 배도 영국·포르투갈 해적의 표적이 되었다. 이 때문에 회사와 무굴 총독 사이에는 해상 안전을 둘러싼 협상이 거듭되었다. 영국 동인도 회사는 이때까지 무굴의 허가에 기대는 작은 무역 집단이었고, 군사 개입은 뒤에 가서야 이뤄졌다. 포르투갈은 이 일을 계기로 구자라트 연안 교역의 독점이 흔들렸고 영국과 네덜란드가 뒤따라 서해안으로 들어왔다."
  subjects: [mughal-empire, portuguese-india, portugal, england]
  links:
    - { from: england, to: portuguese-india, note: "스왈리 해전에서 포르투갈 함대를 꺾음 (1612)" }
  tags: [diplomacy, economy]
  sources: ["William Foster 편, The Embassy of Sir Thomas Roe to the Court of the Great Mogul, 1615–1619 (Hakluyt Society, 1899)", "K. N. Chaudhuri, The Trading World of Asia and the English East India Company, 1660–1760 (Cambridge University Press, 1978)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Wiley-Blackwell, 2012)"]
