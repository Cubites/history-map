- id: gond-kingdoms-1600
  year: 1600
  endYear: 1739
  title:
    ko: "중부 인도의 곤드 왕국들과 라탄푸르, 수르구자(1600~1739)"
  summary:
    ko: "중부 인도의 사트푸라 산지와 나르마다강 상류에는 곤드족 왕국이 여럿 있었다. 가르하-만들라 왕국은 15세기 말 상그람 샤가 52개 성채 영지를 묶어 세웠고, 1564년 무굴에게 진 뒤에도 곤드 왕가가 공납하며 이어졌다. 사트푸라 산지의 데오가르 왕국은 16세기 말~17세기 초 곤드 왕조로 자리 잡았고, 박트 불란드 샤(17세기 말~18세기 초)는 무굴 궁정과 가까워 이슬람으로 개종하고 아우랑제브에게서 지위를 인정받았다. 그는 나그푸르를 새 도읍으로 키워 평야 농업을 장려하고 힌두·무슬림 상인과 장인을 불러 모았다. 찬다 왕국은 15세기 후반부터 찬드라푸르를 도읍으로 한 곤드 왕조로 남았다. 차티스가르 평야의 라탄푸르 왕국은 칼추리 왕조가 11세기부터 다스려 왔고, 17세기 초 북쪽 땅에서 수르구자 토후국이 갈라진 것이 1613년 무렵이다. 수르구자는 나중에 차티스가르 북쪽 고원의 토후국으로 남았다. 이 곤드 왕국들은 무굴 제국의 변두리에서 공납 관계로 독립을 유지했다. 18세기 전반 박트 불란드의 후계 다툼으로 데오가르가 약해지자 마라타 장군 라구지 본슬레가 개입했고, 1739년 본슬레가 나그푸르에 자리 잡으며 곤드 왕국들의 시대는 저물기 시작했다(「나그푸르의 본슬레와 곤드 왕국들의 끝(1739~1751)」, 뒤의 사건). 곤드 사회는 부족 중심의 사회에서 라지푸트·브라만 계통의 왕권을 받아들이며 차츰 힌두화·이슬람화한 정치체로 이행했고, 숲과 산에서 나는 목재·상아·철이 무굴과 이웃 왕국과의 교역품이자 공납품이 되었다. 이 왕국들의 연대기는 전해지는 것이 적어 건국 해와 계보에는 연구자마다 차이가 있다. 곤드 왕가의 후손은 20세기에도 일부 토후와 지주 가문으로 이어졌다."
  subjects: [garha-mandla-kingdom, deogarh-kingdom, chanda-kingdom, ratanpur-kingdom, surguja-state, mughal-empire]
  tags: [politics]
  sources: ["Robert Vane Russell, The Tribes and Castes of the Central Provinces of India (Macmillan, 1916)", "Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)"]

- id: malik-ambar-1600
  year: 1600
  endYear: 1636
  title:
    ko: "말리크 암바르와 아마드나가르의 끝, 무굴·비자푸르·골콘다(1600~1636)"
  summary:
    ko: "에티오피아 출신 노예 병사였다가 아마드나가르 술탄국의 재상이 된 말리크 암바르는 1600년 아마드나가르 요새가 무굴에 넘어간 뒤 무르타자 니잠 샤 2세를 앞세워 파란다에서 나라를 다시 세웠다. 그는 마라타 기병을 모아 무굴의 보급선을 끊는 게릴라 전술을 쓰고, 토지를 측량해 세금을 정하는 제도를 도입하며 키르키(지금 아우랑가바드)를 새 도읍으로 키웠다. 1624년 바트바디 전투에서는 비자푸르군과 함께 무굴을 꺾었고 1626년 죽을 때까지 데칸에서 무굴이 이기지 못하게 했다. 비자푸르의 이브라힘 아딜 샤 2세(재위 1580~1627)는 1619년 비다르의 바리드 샤 가문을 내쫓아 비다르 술탄국을 병합했다. 말리크 암바르가 죽은 뒤 아마드나가르는 귀족 다툼에 빠졌고, 샤자한의 무굴군은 1633년 다울라타바드를 함락해 술탄 후사인 샤를 괄리오르에 가두었다. 마라타 장수 샤지 본슬레는 한동안 아마드나가르 계승자를 세워 버텼으나 1636년 샤자한이 비자푸르와 골콘다에 협상을 요구해 조약이 맺어졌다. 골콘다의 압둘라 쿠틉 샤는 무굴 종주권을 인정해 공납하고 사파비 샤 대신 황제 이름으로 금요일 설교를 했으며, 비자푸르는 무굴의 종주권을 인정하는 대신 아마드나가르 땅 일부(푸네·북콘칸 등)를 받았다. 아마드나가르 술탄국은 이로써 끝났다. 말리크 암바르의 행정은 토지 측량과 세액 책정을 정비했고, 그가 쓴 마라타 기병 가운데에는 샤지 본슬레의 가문 같은 세력이 있었다. 이 경험은 뒤에 시바지가 활동할 무대를 마련했다고 평가된다. 에티오피아에서 팔려 온 하브시(아비시니아) 군인과 관료는 데칸 술탄국들에서 중요한 세력이었고, 말리크 암바르는 그 가운데 가장 이름난 인물이다."
  subjects: [ahmadnagar-sultanate, bidar-sultanate, bijapur-sultanate, golconda-sultanate, mughal-empire]
  links:
    - { from: bijapur-sultanate, to: bidar-sultanate, note: "비다르를 병합 (1619)" }
    - { from: mughal-empire, to: ahmadnagar-sultanate, note: "샤자한이 다울라타바드를 함락하고 조약으로 남은 땅을 비자푸르와 나눔 (1633~1636)" }
  tags: [war, politics]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Jadunath Sarkar, History of Aurangzib (M. C. Sarkar & Sons, 1912–1924)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)"]
