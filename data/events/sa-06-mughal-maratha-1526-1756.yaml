- id: khalsa-1699
  year: 1699
  endYear: 1716
  title:
    ko: "칼사의 창설과 반다 싱 바하두르의 봉기(1699~1716)"
  summary:
    ko: "열째 구루 고빈드 싱(재위 1675~1708)은 아버지 테그 바하두르의 처형 뒤 아난드푸르를 거점으로 공동체를 이끌었다. 1699년 4월 바이사키 축일에 아난드푸르에서 다섯 지원자(판즈 피아레)를 세워 칼사(순수한 이들)라는 무장 공동체를 열고 남성에게 싱(사자), 여성에게 카우르(공주)의 이름과 다섯 상징(오 카카르)을 주었다. 이 과정에서 아난드푸르를 둘러싼 산지 라자(펀자브 산지 토후국들)와 무굴의 사르힌드 총독 와지르 칸이 칼사와 싸웠다. 1700~1705년 아난드푸르 포위 끝에 고빈드 싱은 철수했고, 어린 두 아들은 1705년 12월 사르힌드에서 처형되었다. 고빈드 싱은 1708년 10월 난데드에서 죽기 전 구루의 자리를 경전 『구루 그란트 사힙』에 넘겼다. 그가 만난 바이라기 수도승 반다 싱 바하두르가 1709년 펀자브에 들어가 농민과 하층 신분을 모아 봉기했고, 1710년 5월 사르힌드를 함락해 와지르 칸을 죽였다(이 과정에서 무슬림 주민이 입은 피해가 무굴 연대기에 적혀 있고, 시크 전승은 농민에게 땅을 돌려준 개혁을 강조한다). 바하두르 샤 1세의 무굴군이 로하가르의 봉기군 거점을 1710년 12월 함락했고, 반다는 산지로 물러났다. 1715년 12월 구르다스 나갈에서 포위되어 사로잡힌 반다는 1716년 6월 델리에서 처형되었다. 고빈드 싱은 페르시아어 서한 『자파르나마』를 아우랑제브에게 보내 신의를 어긴 점을 책망했다고 전한다. 시크 전승은 칼사 창설이 카스트와 출신을 넘어 한 공동체로 묶는 일이었다고 말하지만, 연구자들은 시크 공동체가 점차 무장 집단으로 바뀐 긴 과정의 한 단계로 본다. 칼사의 형식과 시크 의례는 이후 18세기 시크 미슬과 달 칼사의 조직으로 이어졌다."
  subjects: [mughal-empire, punjab-hill-states]
