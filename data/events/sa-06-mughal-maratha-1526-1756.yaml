  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Jadunath Sarkar, A History of Jaipur (Orient Longman, 1984)", "Irfan Habib 편, Akbar and His India (Oxford University Press, 1997)"]
