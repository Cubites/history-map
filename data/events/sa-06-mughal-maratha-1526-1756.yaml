  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Wiley-Blackwell, 2012)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)"]
