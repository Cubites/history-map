- id: akbar-institutions-1564
  year: 1564
  endYear: 1585
  title:
    ko: "아크바르의 제도: 만사브다르, 지즈야 폐지, 딘 이 일라히, 파테푸르 시크리(1564~1585)"
  summary:
    ko: "무굴 제국의 아크바르는 1563년 순례세를, 1564년 비무슬림에게 걷던 지즈야를 없앴다. 지즈야는 1679년 아우랑제브가 다시 걷기까지 폐지된 채였다(「아우랑제브와 라지푸트 전쟁, 지즈야 부활(1679~1681)」, 뒤의 사건). 관료와 군대는 만사브다르 체제로 묶였다. 귀족은 자트(서열)와 사와르(기병 수)로 등급이 매겨진 만사브를 받고 봉급이나 징세권(자기르)으로 급여를 받았으며, 땅은 황제의 것으로 보아 만사브다르가 죽으면 되돌려졌다. 재무대신 토다르 말은 1570년대 말부터 십 년간의 수확과 시세를 모아 지세를 매기는 제도를 세웠다고 전한다. 아크바르는 1571년부터 아그라 서쪽 시크리에 새 도읍 파테푸르 시크리를 지어 1585년까지 궁정을 두었다. 1575년 이바다트 하나에서 이슬람 학자와 다른 종교 대표를 모아 토론시켰고, 1579년 신앙 문제에서 황제의 판단을 최종으로 하는 문서가 나왔다. 1582년 무렵 궁정의 소수 인사에게 황제에 대한 충성을 중심으로 한 가르침(딘 이 일라히, 신성한 신앙)을 베풀었으나 따른 이는 많지 않았다고 한다. 아불 파즐은 『아크바르나마』와 『아이네 아크바리』를 썼다. 1585년 아크바르가 라호르로 옮기면서 파테푸르 시크리는 버려졌다. 만사브다르 대다수는 투란·이란 출신 외국인이었으나 라지푸트와 인도 태생 무슬림의 비율이 점차 늘었다. 이 체제는 17세기 후반 징세권으로 줄 땅(자기르)이 모자라는 '자기르 위기'를 맞아 아우랑제브 때의 불안 요인이 되었다고 연구자들은 본다. 이 제도들의 효과를 두고 연구자들은 만사브다르 체제가 황제 중심의 통일된 관료 군사 조직을 만들었다고 보는 쪽과, 현실에서는 귀족 파벌의 균형으로 움직였다고 보는 쪽으로 갈린다."
  subjects: [mughal-empire]
  tags: [politics, economy, religion]
  sources: ["Irfan Habib, The Agrarian System of Mughal India, 1556–1707 (Oxford University Press, 1999)", "M. Athar Ali, The Apparatus of Empire: Awards of Ranks, Offices and Titles to the Mughal Nobility (1574–1658) (Oxford University Press, 1985)", "Catherine B. Asher, Architecture of Mughal India (Cambridge University Press, 1992)"]

- id: talikota-1565
  year: 1565
  endYear: 1649
  title:
    ko: "탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)"
  summary:
    ko: "비자야나가라 제국은 크리슈나데바 라야(재위 1509~1529) 뒤 아추타 라야를 거쳐 사다시바 라야(재위 1542~1570) 때 실권을 쥔 재상 알리야 라마 라야가 데칸 술탄국들의 다툼에 끼어들어 이웃을 자극했다. 1565년 1월 아마드나가르·비자푸르·골콘다·비다르의 네 술탄이 연합해 탈리코타(라크샤사-탕가디) 근처 크리슈나강 가에서 비자야나가라군과 싸웠고, 라마 라야가 사로잡혀 죽자 군대가 무너졌다. 연합군은 수도 함피를 여러 달 약탈했고 도시는 다시 살아나지 못했다. 이 싸움의 사망자 숫자와 약탈의 규모는 포르투갈·페르시아 사료마다 달라 믿을 만한 통계가 없다. 아라비두 왕조의 티루말라 데바 라야는 페누콘다로 물러났고, 벤카타 2세(재위 1586~1614) 때 찬드라기리·벨로르로 도읍을 옮기며 제국의 이름을 이었다. 마두라이·진지·탄자부르 같은 나야크는 1600년 무렵 사실상 홀로 서서 공납만 바치거나 끊었고(「마두라이 나야크 왕조와 진지 나야크, 타밀 지방의 나야카 정권들(1529~1736)」, 앞의 사건), 1579년 골콘다가 군투르 쪽을 빼앗았다. 비자푸르와 골콘다는 1640년대 카르나타카로 군대를 보내 1646년 벨로르의 스리랑가 3세를 꺾었고, 진지는 1649년 비자푸르에 함락되었다. 비자푸르는 방갈루루·시라까지, 골콘다는 넬로르까지 이르렀다. 비자야나가라의 쇠퇴는 술탄국 연합뿐 아니라 아라비두 왕조 내부 다툼, 나야카의 독립, 말을 수입에 기대던 기병의 약화로도 설명된다. 버턴 스타인은 비자야나가라를 중앙의 힘이 한정된 분절적 국가로 보았고, 따라서 탈리코타 하나로 제국이 쓰러졌다기보다 이미 느슨해진 틀이 무너졌다고 해석한다."
  subjects: [vijayanagara-empire, bijapur-sultanate, ahmadnagar-sultanate, golconda-sultanate, bidar-sultanate, gingee-nayak, madurai-nayak]
  links:
    - { from: bijapur-sultanate, to: vijayanagara-empire, note: "탈리코타에서 술탄 연합군이 꺾고 라이추르 도아브와 벨라리를 차지 (1565)" }
    - { from: golconda-sultanate, to: vijayanagara-empire, note: "벨로르의 스리랑가 3세를 꺾고 카르나타카 해안을 차지 (1646)" }
    - { from: bijapur-sultanate, to: gingee-nayak, note: "진지를 함락 (1649)" }
  tags: [war, politics]
  sources: ["Burton Stein, Vijayanagara (Cambridge University Press, 1989)", "Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Robert Sewell, A Forgotten Empire (Vijayanagar): A Contribution to the History of India (Swan Sonnenschein, 1900)"]
