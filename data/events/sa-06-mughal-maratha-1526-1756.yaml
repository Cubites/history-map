- id: ahom-mughal-1536
  year: 1536
  endYear: 1682
  title:
    ko: "아홈 왕국의 확장과 코치 왕국의 분열, 무굴과의 전쟁(1536~1682)"
  summary:
    ko: "브라마푸트라강 골짜기의 아홈 왕국은 수훙뭉 왕(재위 1497~1539)이 1523년 상부 아삼의 추티아 왕국을 병합하고 1536년 디마푸르의 카차리 왕국을 꺾으면서 콜롱강까지 넓어졌다. 서쪽의 코치 왕국은 1515년 비스와 싱하가 세웠고 나라 나라얀(재위 1540~1587) 때 가장 컸으나 1581~1587년 코치 비하르와 코치 하조로 갈라졌다. 코치 하조의 파리크시트 나라얀이 1612년 무굴 벵골 총독 이슬람 칸에게 져 무굴이 서아삼 캄루프를 차지하면서 무굴은 아홈과 국경을 맞댔다. 벵골 총독 샤이스타 칸은 1666년 아라칸에게서 치타공을 빼앗고 동쪽 변경을 넓혔다. 1662년 미르 줌라의 무굴군은 아홈 도읍 가르가온까지 들어갔으나 우기에 병이 돌아 1663년 길라자리가트 조약으로 물러났다. 차크라드와지 싱하 왕(1663~1670)은 이를 갚으려 1667년 구와하티를 되찾았고, 무굴이 암베르의 람 싱 1세를 보내 1671년 브라마푸트라강 가 사라이가트에서 싸웠을 때 라치트 보르푸칸이 좁은 수로에서 작은 배로 무굴 함대를 막았다. 1679년 구와하티를 지키던 라루크솔라 보르푸칸이 무굴에 구와하티를 넘겼으나 가다다르 싱하 왕(1681~1696)은 1682년 이타쿨리 전투에서 구와하티를 되찾아 마나스강을 국경으로 삼았다. 아홈 사회는 파이크 제도라는 부역 징발로 농민을 편성해 전쟁과 수리 사업에 동원했고, 쌀 농사를 위해 제방(가르)을 쌓았다. 아홈은 무굴의 압도적 기병에 맞서 하천과 요새, 수군에 기대어 싸웠고, 왕실 연대기 『부란지』는 이 시기 전쟁을 자세히 남겼다. 아홈은 1228년 수카파 이래 이어 온 세습 군주제에 귀족 가문(고하인)의 합의가 더해진 정치였고, 무굴과의 전쟁 뒤 아홈은 1826년까지 독립을 유지했다."
  subjects: [ahom-kingdom, koch-kingdom, mughal-empire]
  links:
    - { from: mughal-empire, to: koch-kingdom, note: "코치 하조를 병합 (1612)" }
    - { from: ahom-kingdom, to: mughal-empire, note: "사라이가트(1671)와 이타쿨리(1682)에서 구와하티를 지킴" }
