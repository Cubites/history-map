  sources: ["Edward Gait, A History of Assam (Thacker, Spink & Co., 1906)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)"]
