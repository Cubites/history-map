- id: nagpur-bhonsle-1739
  year: 1739
  endYear: 1751
  title:
    ko: "나그푸르의 본슬레와 곤드 왕국들의 끝(1739~1751)"
  summary:
    ko: "라구지 본슬레는 페슈와 샤후의 신임을 받은 마라타 장군으로, 베라르 지방에서 힘을 키워 중부 인도의 곤드 나라들을 노렸다. 1740년대 전반에는 데오가르 곤드 왕조의 후계 다툼에 개입했고, 나그푸르를 근거지로 삼았다. 박트 불란드의 아들 찬드 술탄이 1739년 죽은 뒤 서자들이 왕위를 다투자 미망인이 라구지에게 도움을 청했고, 라구지는 1743년 무렵 데오가르에 개입해 후계 다툼을 가렸으며 1740년대 말까지 실권을 쥐었다. 1741년에는 차티스가르의 라탄푸르 왕국을 무너뜨려 마라타 총독이 다스리게 했고, 오지 토후국들은 공납 영주가 되었다. 가르하-만들라 곤드 왕국도 이 무렵(1742년 무렵) 힘을 잃었다. 1751년에는 곤드의 찬다 왕국이 병합되었다. 그 사이 라구지의 장군 바스카르 람이 1742~1744년 벵골을 거듭 침입하자 벵골 나와브 알리바르디 칸은 이를 막다 1751년 협정으로 오리사의 세금(연 12라크(120만) 루피 안팎의 차우트)을 마라타에 내기로 하고 오리사를 라구지 쪽에 넘겼다. 벵골 쪽 문헌 『마하라슈트라 푸라나』는 이 침입을 약탈과 학살로 적었고 마라타 쪽 사료는 차우트를 정당한 권리로 서술했다. 나그푸르 왕국은 1853년까지 이어졌다. 곤드 왕조는 이슬람으로 개종한 박트 불란드 아래서도 힌두 사원을 후원했고, 본슬레 시기에는 마라티어를 쓰는 관리와 상인이 평야 지대로 들어와 나그푸르의 사회가 바뀌었다. 곤드 주민은 산지와 숲으로 밀려나는 경우가 많았다. 라구지 본슬레의 오리사 지배는 마라타 연합 안에서 페슈와와 본슬레 가문의 경쟁을 일으켰다. 라구지 본슬레는 1755년 죽었고, 아들 자누지가 이어 나그푸르를 다스렸다."
  subjects: [nagpur-kingdom, deogarh-kingdom, ratanpur-kingdom, chhattisgarh-states, garha-mandla-kingdom, chanda-kingdom, bengal-nawabs, maratha-peshwa]
  links:
    - { from: nagpur-kingdom, to: deogarh-kingdom, note: "후계 다툼에 개입해 실권을 쥠 (1743 무렵)" }
    - { from: nagpur-kingdom, to: ratanpur-kingdom, note: "라탄푸르를 무너뜨림 (1741)" }
    - { from: nagpur-kingdom, to: chanda-kingdom, note: "찬다를 병합 (1751)" }
