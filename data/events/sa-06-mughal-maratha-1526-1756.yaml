# 남아시아 사건 6차 묶음(sa-06): 무굴 제국의 성립에서 쇠퇴까지, 데칸 술탄국·마라타·시크·유럽 상사 — 제1차 파니파트 전투에서 두라니의 펀자브 병합까지 (1526 ~ 1756년)
# 범위: 바부르의 무굴 제국과 칸와 전투·수르 왕조와 후마윤의 복귀·아크바르의 정복과 제도·데칸 술탄국들과 탈리코타 전투·비자야나가라의 쇠퇴와 나야카 정권들·자한기르와 토머스 로·샤자한과 계승 전쟁·
#   아우랑제브의 라지푸트 전쟁과 데칸 원정·시바지와 마라타 왕국·시크 구루와 칼사·무굴 지방 정권들의 자립·바지 라오 1세와 마라타의 북진·유럽 상사들과 카르나타카 전쟁·
#   실론의 시타와카·칸디·포르투갈·네덜란드·부탄의 통일·아홈과 코치·마이소르·트라방코르·발루치스탄과 신드·곤드 왕국들·두라니의 펀자브 병합.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다. 군주의 재위 연도는 위키백과 목록을 따랐다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 지금 이름과 다른 옛 이름은 그 이름이 쓰이던 때의 이야기에서 옛 이름(처음 한 번 괄호로 지금 이름: 캘커타(지금 콜카타))으로 적었다.
#   사원 파괴·개종·지즈야·학살·순장(자우하르)처럼 해석이 갈리는 일은 일어난 일과 주어, 숫자(범위와 출처)만 적었고, 아우랑제브·시바지 같은 인물 평가는 학설이 갈리면 양쪽을 한 문장씩 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(네덜란드 동인도 회사의 설립, 나디르 샤의 인도 원정과 델리 약탈, 오스트리아 왕위 계승 전쟁, 외교 혁명과 7년 전쟁,
#   타흐마스프 1세의 치세, 아바스 1세의 영토 회복, 바그다드를 둘러싼 오스만-사파비 전쟁).

- id: first-panipat-1526
  year: 1526
  endYear: 1530
  title:
    ko: "제1차 파니파트 전투와 바부르의 무굴 제국(1526~1530)"
  summary:
    ko: "바부르는 티무르와 몽골 칭기즈 칸의 후손으로 페르가나에서 쫓겨나 1504년 카불을 차지한 뒤 여러 번 인도 북서부를 넘보았다. 델리 술탄국의 마지막 술탄 이브라힘 로디와 사이가 나빠진 펀자브 총독 다울랏 칸 로디와 이브라힘의 숙부 알람 칸이 그를 불렀다. 1526년 4월 파니파트에서 바부르의 군대는 화승총과 야전포를 수레와 방패로 엮은 진지에 두고 양 날개로 에워싸는 오스만식 전술로 이브라힘의 군대를 무너뜨렸고, 이브라힘은 전사했다. 병력은 바부르 쪽 1만 2천 명 안팎, 로디 쪽 3만~10만 명 등 기록마다 크게 갈린다. 이 승리로 델리 술탄국은 끝났고 무굴 제국이 시작되었다(「쿠트브 웃딘 아이바크와 델리 술탄국의 성립(1206~1210)」, 앞의 사건). 북인도에서 가장 큰 도전은 메와르의 라나 상가가 이끄는 라지푸트 연합이었다. 상가는 둥가르푸르의 라왈 우다이 싱 같은 라지푸트 군주들과 마흐무드 로디 등 아프간 세력을 모아 1527년 3월 칸와에서 바부르와 맞섰다. 바부르는 병사들의 사기를 올리려 술을 끊겠다 맹세하고 무슬림 상인에게 걷던 세금을 없앴으며, 포병과 기병으로 이겼다. 우다이 싱이 이 싸움에서 죽자 그의 땅은 둥가르푸르와 반스와라로 나뉘었고, 남부 라지푸타나 토후국들의 바탕이 되었다. 상가는 1528년 초 죽었고 바부르는 1528년 1월 찬데리, 1529년 5월 갠지스·고그라강 합류점에서 비하르의 아프간 세력과 벵골 술탄 누스라트 샤의 군대를 꺾었다. 바부르는 1530년 12월 아그라에서 죽었고 맏아들 후마윤이 뒤를 이었다. 바부르가 터키어로 쓴 회고록 『바부르나마』는 이 시기의 자연과 사람을 자세히 전한다. 바부르는 카불에서 델리까지 들어온 이방 군주로서 인도의 더위와 풍습에 불만을 적으면서도 아그라에 정원과 우물, 저수조를 만들어 중앙아시아식 생활 공간을 옮겨 심으려 했다."
  subjects: [mughal-empire, delhi-sultanate, mewar-state, south-rajputana-states, bengal-sultanate]
