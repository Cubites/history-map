- id: bhutan-shabdrung-1616
  year: 1616
  endYear: 1651
  title:
    ko: "샤브드룽 응아왕 남걀과 부탄의 통일(1616~1651)"
  summary:
    ko: "티베트 둑파 카규파의 화신 승려 응아왕 남걀은 1616년 티베트에서 세력 다툼에 밀려 부탄으로 들어왔다. 그는 샤브드룽(그 앞에서 엎드리는 이)이라는 칭호를 받고 둑파 승단의 수장이자 부탄의 국가 지도자가 되었다. 부탄 안의 다른 불교 종파와 지방 세력을 누르며 계곡마다 종(요새 수도원)을 세웠고, 푸나카 종(1637)과 팀푸의 타시초 종을 세워 행정 거점으로 삼았다. 티베트 중앙의 겔룩파와 몽골 군대는 1634년 무렵부터 여러 번 부탄을 쳐들어왔으나 샤브드룽은 이를 막아 냈다. 샤브드룽은 법전과 의례를 정비해 승려의 권위(종교)와 세속 통치를 나누는 이중 체제를 세웠다. 이때 정해진 둑 데시(세속 통치자)와 제 켄포(종교 수장) 제도는 20세기까지 부탄 통치의 뼈대로 남았다. 샤브드룽은 1651년 푸나카에서 은거에 들어갔으며, 승려들이 그의 죽음을 오랫동안(여러 연구는 1705년까지) 숨겼다고 한다. 부탄은 이 시기 남쪽 두아르 평야의 코치와 아삼 지방 사이의 통로를 쥐고 서벵골과 아삼의 변경과 교역했다. 샤브드룽이 세운 질서는 둑파 승단을 중심으로 한 국가 정체성(드룩율, 용의 땅)을 낳았고, 종 건축은 오늘날까지 행정과 종교의 거점으로 남았다. 이후 샤브드룽 환생자의 계승 다툼 속에서 세속 권력인 둑 데시가 커졌고, 부탄은 18세기 코치 비하르 문제로 영국 동인도 회사와 처음 충돌하게 된다(1772~1774). 샤브드룽의 통일은 티베트 쪽의 압박 속에 이뤄졌으며, 부탄과 티베트의 관계는 이후 17~18세기에도 긴장과 협상을 오갔다. 샤브드룽 시대의 법전과 사원 조직은 오늘날 부탄의 종교·문화 정체성의 뿌리로 말해진다."
  subjects: [bhutan]
  tags: [politics, religion]
  sources: ["Michael Aris, Bhutan: The Early History of a Himalayan Kingdom (Aris & Phillips, 1979)", "Karma Phuntsho, The History of Bhutan (Random House India, 2013)"]

- id: shah-jahan-1628
  year: 1628
  endYear: 1656
  title:
    ko: "샤자한의 치세: 타지마할과 샤자하나바드, 칸다하르 다툼(1628~1656)"
  summary:
    ko: "자한기르가 죽자 쿠람 왕자는 장인 아사프 칸(뭄타즈 마할의 아버지)의 도움으로 1628년 초 샤자한으로 즉위했다(즉위식은 같은 해 2월). 그의 치세는 무굴 제국의 재정이 가장 넉넉하고 건축이 가장 화려했던 시기로 꼽힌다. 1631년 왕비 뭄타즈 마할이 데칸의 부르한푸르에서 아이를 낳다 죽자 샤자한은 아그라 야무나강 가에 무덤 타지마할을 지었다. 설계자로는 우스타드 아흐마드 라호리가 전하며 공사는 1632년 무렵부터 1653년까지 이어졌다. 1639년부터 1648년까지는 델리에 새 도읍 샤자하나바드(오늘의 올드델리)와 붉은 요새를 지었다. 1630~1632년 데칸과 구자라트의 큰 기근, 1634~1635년 분델칸드의 줌하르 싱 반란이 있었고, 1632년 벵골의 후글리에서 포르투갈 상인을 쫓아냈다. 1631년에는 하라오티의 하다 가문 마도 싱이 코타를 받아 분디에서 갈라섰다. 북서쪽 칸다하르는 1638년 사파비 총독 알리 마르단 칸이 샤자한에게 넘겨주어 무굴령이 되었으나 1649년 사파비 아바스 2세에게 되빼앗겼다(「바그다드를 둘러싼 오스만-사파비 전쟁과 주하브 조약(1623~1639)」, 앞의 사건). 아우랑제브(1649, 1652)와 다라 시코(1653)의 포위는 모두 실패했고, 1646~1647년 발흐·바다크샨 원정도 큰 비용만 들고 물러났다. 이 시기 무굴은 재정과 문화가 가장 넉넉했으나, 건축과 원정에 막대한 비용을 쓴 탓에 농민의 세 부담이 컸다는 지적이 있다. 연구자들은 이를 아우랑제브 때의 '자기르 위기'와 연결해서 본다. 한편 샤자한이 쌓은 건축 사업은 일꾼과 장인의 대규모 동원으로 이뤄져, 타지마할 공사에는 수천 명 이상이 동원되었다고 하나 정확한 인원은 전하는 사료마다 다르다."
  subjects: [mughal-empire, kota-state]
  tags: [politics, culture, war]
  sources: ["Catherine B. Asher, Architecture of Mughal India (Cambridge University Press, 1992)", "Ebba Koch, The Complete Taj Mahal and the Riverfront Gardens of Agra (Thames & Hudson, 2006)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)"]
  places: [{ name: 타지마할, at: [78.04, 27.18], year: 1632 }, { name: 칸다하르 포위, at: [65.71, 31.62], year: 1649 }]

- id: ceylon-dutch-1638
  year: 1638
  endYear: 1658
  title:
    ko: "칸디와 네덜란드의 동맹, 포르투갈령 실론의 끝(1638~1658)"
  summary:
    ko: "칸디 왕국의 라자싱하 2세(재위 1635~1687)는 포르투갈이 해안에서 계피를 독점하는 것을 막으려 네덜란드 동인도 회사와 손을 잡았다. 1638년 칸디군은 간노루와에서 포르투갈 원정군을 크게 이겼고, 같은 해 네덜란드 해군 제독 아담 베스터볼트가 바티칼로아에서 칸디와 조약을 맺었다. 네덜란드는 1640년 갈레와 네곰보를 차지했으나 포르투갈의 반격과 칸디와의 갈등으로 이후 십 년 가까이 소강이었고, 1652~1654년 영국-네덜란드 전쟁이 끼어들었다. 네덜란드는 1656년 5월 일곱 달의 포위 끝에 콜롬보를 함락했고 1658년 2월 만나르, 6월 자프나를 차지해 포르투갈을 섬에서 몰아냈다. 이때 네덜란드는 칸디 왕에게 약속한 요새를 넘기지 않았고, 계피 거래권을 독점하며 해안 지구를 직접 다스렸다. 칸디는 산지 내륙으로 갇혀 항구 교역이 끊겼다. 네덜란드령 실론은 1796년 영국에 점령될 때까지 이어졌다. 포르투갈령 실론은 1597년 코테 왕국의 계승으로 시작되어 1619년 자프나를 더했다가(「시타와카·코테·칸디와 포르투갈: 라자싱하 1세에서 포르투갈령 실론의 성립까지(1565~1597)」, 앞의 사건) 이때 막을 내렸다. 네덜란드 동인도 회사는 계피 수출로 이익을 내려고 칸디가 쥔 산지의 계피 수확과 연안 노동자를 통제했고, 이런 독점은 18세기 칸디와의 거듭된 갈등으로 이어졌다. 칸디 왕은 해안 교역권을 잃은 채 내륙 농업과 사원 후원에 기대어 나라를 유지했다. 한편 실론 북부의 자프나 왕국은 1619년 포르투갈에 점령된 뒤 네덜란드 지배 아래 들어갔다. 네덜란드가 해안 지구를 직접 다스린 것은 이후 150년 가까이 이어졌다."
  subjects: [kandy, portuguese-ceylon, dutch-ceylon, dutch-republic, portugal]
  links:
