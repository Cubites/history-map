- id: sur-empire-1540
  year: 1540
  endYear: 1556
  title:
    ko: "셰르 샤 수르의 행정과 수르 왕조의 끝, 후마윤의 복귀(1540~1556)"
  summary:
    ko: "셰르 샤 수르(재위 1540~1545)는 5년 남짓한 짧은 치세에 북인도 행정의 뼈대를 만들었다. 그는 땅을 재어 농민과 직접 세액을 정하는 지세 제도를 세웠고, 은화 루피야(약 178그레인)를 기준 화폐로 삼았으며, 벵골의 소나르가온에서 인더스강까지 이르는 대간선 도로(훗날 그랜드 트렁크 로드의 바탕)를 고치고 곳곳에 숙소와 역참을 두었다. 영토는 1541년 물탄, 1542년 말와, 1543년 라이센, 1544년 마르와르로 넓어졌으나 1545년 5월 칼린자르 요새를 포위하다 화약 폭발로 죽었다. 아들 이슬람 샤(재위 1545~1554)는 귀족을 억누르며 나라를 이었지만 그가 죽자 후계 다툼과 반란이 번졌고, 벵골 총독 무함마드 칸 수르는 1554년 독립을 선언했다(「벵골 술탄국과 오리사, 아프간 정권들과 무굴의 벵골·오리사 정복(1550~1592)」, 뒤의 사건). 델리에서는 무함마드 아딜 샤와 시칸다르 샤 수르가 맞섰다. 후마윤은 이 틈에 1555년 6월 사르힌드에서 시칸다르 샤를 꺾고 7월 델리에 돌아왔으나 이듬해 1월 서고 계단에서 떨어져 죽었다. 수르 왕조는 1556년 무렵 사라졌고 아들 아크바르가 13살에 자리를 이었다(「제2차 파니파트 전투와 아크바르의 즉위(1556~1562)」, 뒤의 사건). 셰르 샤가 쌓은 펀자브의 로타스 요새와 사사람의 무덤은 수르 시대 건축으로 남았다. 이 제도들은 아크바르 시기 토다르 말이 지세를 정비할 때 바탕이 되었고, 그가 셰르 샤 밑에서 일했다고도 전해진다. 수르 왕조는 짧았지만 아프간 귀족과 라지푸트, 토착 관료를 함께 쓰는 방식을 시도해 무굴 행정의 선례가 되었다. 셰르 샤의 땅 측량은 땅의 질에 따라 세액을 정했고, 농민이 문서(파타)로 세액을 확인하는 방식이었다."
  subjects: [sur-empire, mughal-empire, malwa-sultanate, bengal-sultanate]
  links:
    - { from: sur-empire, to: malwa-sultanate, note: "말와를 차지 (1542)" }
    - { from: mughal-empire, to: sur-empire, note: "사르힌드에서 시칸다르 샤를 꺾고 델리를 되찾음 (1555)" }
  tags: [politics, war, economy]
  sources: ["Kalika Ranjan Qanungo, Sher Shah and His Times (Orient Longman, 1965)", "Irfan Habib, The Agrarian System of Mughal India, 1556–1707 (Oxford University Press, 1999)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)"]

- id: bengal-afghan-1550
  year: 1550
  endYear: 1592
  title:
    ko: "벵골 술탄국과 오리사, 아프간 정권들과 무굴의 벵골·오리사 정복(1550~1592)"
  summary:
    ko: "벵골은 1540년 셰르 샤에게 정복되어 수르 왕조의 지방이 되었다가, 총독 무함마드 칸 수르가 1554년 독립해 벵골 술탄국을 되살렸다. 그는 1555년 무함마드 아딜 샤와 싸우다 죽었고 아들 바하두르 샤(재위 1555~1560)는 1557년 수라지가르 전투에서 아딜 샤의 군대를 꺾고 비하르까지 차지했다. 이어진 카라니 왕조의 술레이만 카라니(재위 1565~1572)는 장군 칼라파하르를 보내 1568년 오리사의 가자파티 왕국을 무너뜨렸다. 가자파티는 1515~1518년 무렵 크리슈나강 이남을 비자야나가라에 잃어 오리사 쪽으로 좁아졌고, 1541년 무렵 수르야밤샤가 끊기고 보이 왕조가 이어받았다. 술레이만의 아들 다우드 칸 카라니(재위 1572~1576)는 아크바르에 맞서다가 1574년 무굴의 문임 칸에게 파트나를 잃었고 1576년 7월 12일 라지마할에서 져 잡혀 처형되었다. 이로써 무굴은 벵골과 비하르를 얻었으나 오리사에 남은 아프간 세력은 1592년까지 버텼고, 암베르의 만 싱 1세가 1590~1592년 원정으로 오리사를 무굴령에 넣으면서 산지 영주 가르자트들이 무굴에 공납하는 오리사 토후국들이 되었다. 벵골 동부에서는 이사 칸 같은 바로 부이얀(열두 지주)이 오래 무굴에 맞섰다. 라지마할은 무굴 벵골의 첫 도읍이 되었다가 1610년 무렵 다카로 옮겨졌다. 카라니 시기 벵골은 직물과 쌀 수출로 번성했고, 오리사 해안의 푸리 자간나트 사원은 정치 분쟁의 중심이었다. 바로 부이얀과 아프간 잔당이 오래 버티면서 무굴이 벵골 동부를 완전히 다스리기까지는 17세기 초까지 시간이 걸렸다. 벵골의 아프간 정권들은 델리의 수르 왕조와 아프간 귀족층의 뿌리를 공유했으나, 지방 지주와 선박 상인에 기대어 홀로 서려 했다."
  subjects: [bengal-sultanate, gajapati-kingdom, mughal-empire, orissa-states, sur-empire]
  links:
    - { from: bengal-sultanate, to: gajapati-kingdom, note: "카라니의 칼라파하르가 오리사를 정복해 가자파티 왕국을 끝냄 (1568)" }
    - { from: mughal-empire, to: bengal-sultanate, note: "라지마할에서 다우드 칸을 꺾고 벵골·비하르를 차지, 1592년 오리사 정복 (1576~1592)" }
  tags: [war, politics]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)"]
