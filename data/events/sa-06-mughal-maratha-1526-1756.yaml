- id: deccan-conquest-1686
  year: 1686
  endYear: 1687
  title:
    ko: "아우랑제브의 비자푸르·골콘다 병합(1686~1687)"
  summary:
    ko: "아우랑제브는 1681년부터 데칸에서 머물렀다. 비자푸르의 시칸다르 아딜 샤는 마라타와 골콘다를 돕는다는 이유로 무굴의 표적이 되었고, 아우랑제브는 1685년 4월부터 비자푸르 성을 포위했다. 성안은 기근과 역병으로 시달렸고 1686년 9월 시칸다르가 항복해 비자푸르 술탄국이 끝났다. 시칸다르는 다울라타바드에 갇혔고 그가 죽은 해는 1700년이라는 서술이 많다. 골콘다의 아불 하산 쿠틉 샤(타나 샤)는 재상 마다나와 아카나 형제가 힌두 관료의 힘을 키웠다는 이유로, 또 시바지와의 동맹을 이유로 공격을 받았다. 무굴군은 1687년 1월부터 골콘다 요새를 포위했고 술탄국은 8개월 가까이 버티다 9월 22일 함락되었다. 아불 하산은 다울라타바드에 갇혔다가 1699년 죽었다. 두 병합으로 무굴은 인도 아대륙의 거의 전부를 지배했고 영토 규모가 최대에 이르렀다. 그러나 점령한 두 땅은 곧 무굴 관리의 부패와 마라타의 침입으로 안정되지 않았다. 이때 무굴 장군 카심 칸은 방갈루루를 마이소르의 치카 데바라자에게 넘겼다(「마이소르 워디야르 왕가의 성장: 스리랑가파트나에서 치카 데바라자까지(1610~1704)」, 앞의 사건). 골콘다의 다이아몬드 광산과 해안 항구 마술리파트남의 세입은 무굴 재정에 들어갔다. 그러나 정복지를 안정시킬 병력과 관리가 모자라 아우랑제브의 마지막 이십 년 동안 무굴 재정은 계속 줄었고, 점령한 두 땅에서는 기근과 반란이 이어졌다. 두 술탄국의 수도 하이데라바드는 뒤에 아사프 자 왕조가 이어받는다(「무굴 지방 총독들의 자립: 벵골 나와브, 로힐칸드, 아와드, 하이데라바드(1717~1733)」, 뒤의 사건). 아우랑제브는 이 병합 뒤 두 나라의 귀족과 관리를 무굴 만사브다르로 흡수하려 했으나 데칸 귀족과 무굴 관리 사이의 마찰이 컸다."
