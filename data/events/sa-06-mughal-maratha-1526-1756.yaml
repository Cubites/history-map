- id: second-panipat-1556
  year: 1556
  endYear: 1562
  title:
    ko: "제2차 파니파트 전투와 아크바르의 즉위(1556~1562)"
  summary:
    ko: "1556년 1월 후마윤이 죽은 뒤 2월 14일 아크바르는 13살로 펀자브 칼라나우르에서 즉위했고, 후견인 바이람 칸이 섭정으로 나랏일을 맡았다. 같은 해 10월 수르 왕조 아딜 샤의 재상이던 힘무(헤무)가 델리를 차지하고 비크라마디티야 왕을 칭했다. 무굴군은 11월 5일 파니파트에서 힘무와 싸웠는데, 힘무가 눈에 화살을 맞고 쓰러지자 군대가 무너졌고 힘무는 사로잡혀 처형되었다. 이 싸움이 제2차 파니파트 전투다. 아크바르는 1560년 바이람 칸을 물러나게 해 직접 다스리기 시작했고 바이람은 이듬해 메카로 가는 길에 암살되었다. 아크바르의 유모 마함 앙가와 그의 아들 아담 칸 같은 궁정 파벌이 영향력을 다투는 가운데, 아담 칸은 1561년 말와를 쳐서 마지막 술탄 바즈 바하두르를 쫓아냈으나 포로 학살로 아크바르의 노여움을 샀다. 말와는 1562년 무굴 지방이 되었고 1401년 이래의 말와 술탄국은 이로써 사라졌다. 바이람 칸은 후마윤 때부터 충성한 투르크멘 출신 장수로 아크바르의 어린 시절 스승이기도 했다. 그의 섭정기에 무굴은 1558년 무렵부터 괄리오르·아지메르·자운푸르 쪽으로 지배를 넓혀 델리와 아그라 중심의 영역을 굳혔다. 이 시기 무굴의 재정은 불안했고 귀족들은 투란(중앙아시아)계와 이란계 파벌로 갈려 있었으므로, 아크바르는 뒤에 라지푸트와 인도 태생 무슬림을 불러들여 파벌 균형을 꾀했다(「아크바르와 라지푸트: 혼인 동맹, 치토르 포위, 할디가티 전투(1562~1576)」, 뒤의 사건). 아크바르는 즉위 직후 군사를 직접 이끌지 못했으므로 이 시기 무굴의 승리에는 바이람 칸의 지휘가 결정적이었다는 평이 많다. 아불 파즐의 『아크바르나마』는 이 전투와 힘무의 최후를 자세히 적었다."
  subjects: [mughal-empire, sur-empire, malwa-sultanate]
  links:
    - { from: mughal-empire, to: malwa-sultanate, note: "바즈 바하두르를 몰아내고 말와를 차지 (1561~1562)" }
  tags: [war, politics]
  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)", "Abraham Eraly, The Mughal Throne: The Saga of India's Great Emperors (Weidenfeld & Nicolson, 2003)"]
