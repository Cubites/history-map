- id: gujarat-conquest-1572
  year: 1572
  endYear: 1573
  title:
    ko: "아크바르의 구자라트 정복(1572~1573)"
  summary:
    ko: "구자라트 술탄국은 바하두르 샤 뒤 귀족들이 술탄을 갈아 세우는 혼란 속에 있었고, 마지막 술탄 무자파르 샤 3세(재위 1561~1573)는 실권을 귀족 이티마드 칸에게 빼앗겼다. 귀족들이 서로 아크바르에게 도움을 청하자 아크바르는 1572년 7월 파테푸르 시크리를 떠나 구자라트로 나아가 11월 아마다바드에 들어갔다. 1572년 사르날에서 반란을 일으킨 이브라힘 후사인 미르자의 군대를 꺾었고, 1573년 2월 수라트를 포위해 얻었다. 무자파르 샤 3세는 항복했고 구자라트 술탄국은 1398년 이래의 역사를 끝냈다. 구자라트는 아마다바드를 도읍으로 한 무굴의 수바(주)가 되었다. 아크바르가 돌아간 뒤 미르자들이 아마다바드를 에워싸자 아크바르는 1573년 8~9월 직접 달려가 9월 2일 이들을 꺾었다. 구자라트의 면직물과 카캄베·수라트 항구는 무굴 제국에 해상 무역의 수입원을 주었고, 아크바르는 이때 카캄베에서 처음으로 바다를 보았다고 전한다. 이 원정 중 포르투갈 사절이 무굴 군영을 찾았고 이후 구자라트는 무굴과 포르투갈이 항구 통행증(카르타스)을 두고 부딪치는 지역이 되었다. 무굴은 1583년 구자라트 반란을 다시 진압했다. 구자라트 평원을 두고 아크바르가 얻은 승리를 기념해 파테푸르 시크리에 1601년 부란드 다르와자가 세워졌다. 구자라트 술탄국 시절부터 이어진 아마다바드의 이슬람 건축은 무굴 건축에도 영향을 주었다. 아크바르가 구자라트에서 만난 상인과 이슬람 학자, 자이나교 승려는 이후 궁정의 종교 토론에 영향을 주었다고 전한다. 정복 뒤 구자라트의 항구 세입은 무굴이 서해안 교역에서 얻는 가장 큰 수입원이 되었다. 구자라트 정복은 아크바르의 첫 해안 지방 정복이었고, 구자라트의 총독 자리는 뒤에 무굴 황자들이 맡는 중요한 자리가 되었다."
  subjects: [gujarat-sultanate, mughal-empire, portugal]
  links:
    - { from: mughal-empire, to: gujarat-sultanate, note: "아마다바드·수라트를 차지해 구자라트 술탄국을 끝냄 (1572~1573)" }
  tags: [war, politics]
  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)", "Ashin Das Gupta·M. N. Pearson 편, India and the Indian Ocean, 1500–1800 (Oxford University Press, 1987)"]

- id: mughal-north-1585
  year: 1585
  endYear: 1595
  title:
    ko: "아크바르의 북서 경영: 카불·카슈미르·신드·칸다하르(1585~1595)"
  summary:
    ko: "아크바르는 1585년 이복동생 미르자 하킴이 죽자 카불을 병합했고 라호르에 궁정을 두어 북서 변경을 직접 살폈다. 1586년 카슈미르에서는 차크 왕조의 유수프 샤 차크가 무굴군에 굴복해 카슈미르 술탄국이 끝났다. 카슈미르 골짜기는 1589년 아크바르가 직접 찾았고 이후 무굴 황제의 여름 궁정으로 자리 잡았다. 같은 때 카이베르 고개 쪽에서는 바야지드 안사리의 로샤니야 운동과 파슈툰 부족이 무굴군을 거듭 괴롭혀, 1586년 무굴 궁정인 비르발이 부족 원정에서 전사했다. 신드는 1591년 시작된 원정 끝에 1593년 타르칸 정권(아르군 왕조의 갈래)이 항복해 무굴에 병합되었고(「아르군·타르칸 왕조의 신드와 물탄, 무굴의 신드 병합(1527~1593)」, 앞의 사건), 1595년에는 칸다하르가 사파비 총독 무자파르 후사인 미르자의 투항으로 무굴에 들어왔다(「아바스 1세의 영토 회복: 남부 해안, 타브리즈, 칸다하르와 호르무즈(1601~1622)」, 뒤의 사건). 힌두쿠시 남쪽의 치트랄 골짜기에서는 16세기 말 카토르 가문이 세력을 키워 치트랄 왕국의 바탕을 놓았다(1585년 무렵). 1585년에는 아크바르가 초타나그푸르 고원을 원정해 나그반시 왕을 공납 관계에 넣었다. 카불은 바부르의 무덤이 있는 곳으로, 아크바르는 이곳에서 중앙아시아의 우즈베크 샤이반 가문을 경계했다. 사파비 이란과 카불·칸다하르를 두고 거듭 다투는 일은 이후 두 제국의 대립 축이 되었다. 북서 변경의 파슈툰 부족 땅은 무굴이 끝내 완전히 다스리지 못했다. 이 시기에 무굴은 카불(1585), 카슈미르(1586), 신드(1593), 칸다하르(1595)를 차례로 얻어 지금의 파키스탄과 아프가니스탄 동부를 영역으로 삼았다."
  subjects: [mughal-empire, kashmir-sultanate, chitral-kingdom, arghun-dynasty]
  links:
    - { from: mughal-empire, to: kashmir-sultanate, note: "유수프 샤 차크를 굴복시켜 병합 (1586)" }
  tags: [war, politics]
  sources: ["Mohibbul Hasan, Kashmir under the Sultans (Aakar Books, 2005)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Stephen F. Dale, The Garden of the Eight Paradises: Babur and the Culture of Empire in Central Asia, Afghanistan and India (1483–1530) (Brill, 2004)"]

- id: mughal-deccan-1595
  year: 1595
  endYear: 1605
  title:
    ko: "아크바르의 데칸 원정: 찬드 비비와 아마드나가르, 칸데시의 병합(1595~1605)"
  summary:
    ko: "아마드나가르 술탄국에서 부르한 니잠 샤 2세가 1595년 죽자 어린 술탄 바하두르 샤를 둘러싼 귀족 파벌이 갈라졌다. 비자푸르 알리 아딜 샤 1세의 미망인이자 아마드나가르 출신 왕족인 찬드 비비(찬드 술타나)는 섭정으로 나서 1595년 12월부터 이듬해 3월까지 무굴의 무라드 왕자와 압둘 라힘 칸의 포위를 견뎠고, 조약으로 베라르를 무굴에 넘겼다(1596). 조약이 지켜지지 않자 전쟁이 이어졌고 찬드 비비는 1600년 궁정 파벌에게 죽임을 당했다. 아크바르가 보낸 다니얄 왕자와 압둘 라힘의 군대는 1600년 8월 아마드나가르 요새를 함락했고, 마지막 술탄 바하두르는 괄리오르에 갇혔다. 칸데시는 파루키 왕조가 지켜 온 타프티 골짜기의 술탄국으로, 아크바르가 직접 남하해 아시르가르 요새를 포위한 끝에 1601년 1월 얻어 무굴 수바가 되었다. 그러나 말리크 암바르가 아마드나가르 술탄국의 이름으로 계속 싸웠고(「말리크 암바르와 아마드나가르의 끝, 무굴·비자푸르·골콘다(1600~1636)」, 뒤의 사건), 아크바르는 1601년 북으로 돌아가 1605년 10월 아그라에서 죽었다. 비자푸르와 골콘다는 이때 무굴 사절을 맞으며 공납을 약속했다. 이 원정으로 무굴은 칸데시·베라르·아마드나가르 일부에 걸치는 '데칸 수바'를 처음 세웠고, 총독을 맡은 아크바르의 아들 다니얄은 술병으로 1604년 죽었다. 이 무렵 살림 왕자가 반란을 일으키는 등 아크바르는 말년에 후계 문제를 안았다. 이 원정 때문에 무굴은 처음으로 남쪽 데칸 고원에서 장기 전쟁을 치르게 되었고, 이 전쟁은 아우랑제브 때 정점에 이르렀다. 찬드 비비는 말을 타고 성벽에서 지휘한 인물로 이후 데칸의 여성 영웅으로 기억된다."
  subjects: [mughal-empire, ahmadnagar-sultanate, khandesh-sultanate, bijapur-sultanate, golconda-sultanate]
  links:
    - { from: mughal-empire, to: khandesh-sultanate, note: "아시르가르 요새를 얻어 칸데시 술탄국을 병합 (1601)" }
    - { from: mughal-empire, to: ahmadnagar-sultanate, note: "베라르를 받고(1596) 아마드나가르 요새를 함락 (1600)" }
  tags: [war, politics]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)"]
