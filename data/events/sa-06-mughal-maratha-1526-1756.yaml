- id: sitawaka-kotte-1565
  year: 1565
  endYear: 1597
  title:
    ko: "시타와카·코테·칸디와 포르투갈: 라자싱하 1세에서 포르투갈령 실론의 성립까지(1565~1597)"
  summary:
    ko: "실론 섬의 코테 왕국은 1521년 비자야바후 7세가 세 아들에게 죽임을 당한 뒤 코테·시타와카(마야두네)·라이가마로 갈라졌고, 1505년 이후 콜롬보에 자리 잡은 포르투갈은 코테 왕을 보호하는 대신 계피 무역권을 얻었다. 코테 왕 다르마팔라(재위 1551~1597)는 1557년 가톨릭 세례를 받았다. 시타와카의 마야두네와 아들 라자싱하 1세(재위 1581~1593)는 포르투갈의 코테 지원에 맞서 1562년 물레리야와에서 포르투갈군을 물리쳤고, 1565년 코테는 콜롬보 요새 안으로 물러났다. 라자싱하 1세는 1582년 칸디 산지를 정복해 섬 대부분을 다스렸다. 그러나 1593년 그가 죽자 시타와카는 무너졌고, 칸디 지방의 귀족 콘나푸 반다라는 비말라다르마수리야 1세로 즉위해(1592~1604) 칸디 왕국의 기틀을 세웠으며 1594년 단투레에서 포르투갈 원정군을 꺾었다. 다르마팔라는 1580년 유언 증서로 코테를 포르투갈 왕에게 넘기기로 했고 1597년 죽자 포르투갈이 코테의 계승자가 되어 포르투갈령 실론이 시작되었다. 포르투갈의 지배는 서·남해안 지구에 한정되었고, 포르투갈은 1619년 자프나 왕국도 무너뜨렸다. 포르투갈은 이 시기 계피 교역과 가톨릭 선교(프란치스코회와 예수회)로 해안 주민의 개종을 이끌었고, 해안의 살라가마·카라바 같은 카스트 집단은 포르투갈과 관계를 맺어 지위를 높였다. 이 과정에서 해안과 내륙의 사회가 갈라지는 틀이 굳어졌다. 라자싱하 1세의 시타와카는 포르투갈에 맞서 섬 대부분을 하나로 묶었으나 그가 죽자 곧 무너졌고, 이는 싱할라 왕조의 마지막 통일 시도로 평가되기도 한다. 이 시기 싱할라어 문헌과 포르투갈 연대기는 같은 전투를 서로 다르게 적어, 사건의 순서와 사상자 숫자는 사료마다 차이가 있다."
  subjects: [kotte-kingdom, sitawaka-kingdom, kandy, portuguese-ceylon, portugal]
  links:
    - { from: sitawaka-kingdom, to: kotte-kingdom, note: "코테를 콜롬보로 몰아내고 내륙을 차지 (1565)" }
    - { from: portugal, to: kotte-kingdom, note: "다르마팔라의 유언 증서로 코테를 이어받음 (1597)" }
  tags: [war, politics, religion]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Wiley-Blackwell, 2012)", "Chandra Richard de Silva, The Portuguese in Ceylon, 1617–1638 (H. W. Cave, 1972)"]
