- id: bajirao-north-1720
  year: 1720
  endYear: 1740
  title:
    ko: "페슈와 바지 라오 1세와 마라타의 북진(1720~1740)"
  summary:
    ko: "바지 라오 1세(페슈와 1720~1740)는 사타라의 샤후 왕 아래서 마라타의 재상직을 이어받아 북진을 이끌었다. 1728년 2월 팔케드에서 하이데라바드의 니잠을 꺾어 데칸의 차우트를 인정받았다. 1729~1731년 분델칸드의 차트라살이 무굴 장군 무함마드 칸 방가시의 공격을 받아 도움을 청하자 달려가 구했고, 차트라살이 1731년 죽자 유산의 3분의 1을 받아 잔시와 사가르 일대를 얻었다(분델칸드 토후국들의 시작). 말와에서는 장군 라노지 신디아(훗날 괄리오르 주)와 말하르라오 홀카르(훗날 인도르 주)에게 1731~1732년 말와의 몫을 나눠 주었고, 구자라트 쪽 일은 가이크와드가 맡았다(「가이크와드의 구자라트: 바로다 점령과 카티아와르 토후국들의 자립(1721~1753)」, 뒤의 사건). 1737년 4월 바지 라오는 델리 성문 앞까지 진군했고, 12월 보팔에서 니잠 울물크와 무굴 연합군을 꺾어 1738년 1월 무굴 황제가 말와와 나르마다~참발 사이 땅의 지배를 인정하는 조약을 받아 냈다. 이 조약 뒤 도스트 무함마드 칸이 세운 보팔 주도 마라타에 조공하게 되었다. 1739년 5월에는 동생 치마지 아파가 포르투갈령 바세인(바사이)을 함락해 서해안 콘칸의 포르투갈 거점을 크게 줄였다. 바지 라오는 1740년 4월 나르마다강 가에서 진군 중 죽었다. 그가 닦은 마라타의 북진은 장군 가문이 말와, 구자라트, 나그푸르에 독립 정권을 세우는 연합 체제로 굳어졌다. 바지 라오는 말 위에서 군을 이끄는 기동 전술로 알려졌으며, 군비는 정복지에서 차우트를 정식으로 징수하는 방식으로 충당했다. 그의 방식은 샤후 왕이 허락한 권한을 장수들에게 나눠 주는 연합 체제를 낳았으나 중앙의 통제는 약했다. 그의 지휘 아래 마라타 군대는 사타라 도읍을 비운 채 멀리 델리 근처까지 이르렀고, 샤후 왕은 이를 허락하되 직접 통제하지는 못했다."
