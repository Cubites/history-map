- id: durrani-punjab-1748
  year: 1748
  endYear: 1756
  title:
    ko: "두라니의 펀자브·카슈미르 병합과 무굴 제국의 서쪽 상실(1748~1756)"
  summary:
    ko: "아흐마드 샤 두라니(압달리)는 1747년 칸다하르에서 왕이 된 뒤 나디르 샤가 차지했던 인더스 서안의 땅을 이어받았다(「나디르 샤의 인도 원정과 델리 약탈(1738~1739)」, 앞의 사건). 그는 1748년 1월 인더스강을 건너 라호르를 차지했으나 3월 마누푸르에서 무굴의 왕자 아흐마드 샤 바하두르와 펀자브 총독 무인 울 물크(미르 마누)에게 막혔다. 1749년 다시 쳐들어와 차하르 마할 4개 지구의 징세권을 받았고, 1751~1752년에는 라호르와 물탄을 둘러싸고 미르 마누와 싸웠다. 1752년 무굴 황제 아흐마드 샤 바하두르는 협정으로 펀자브와 물탄의 징세권을 아흐마드 샤에게 넘겼고, 카슈미르도 1752~1753년 두라니가 차지했다. 같은 해 무굴 재상 사프다르 장은 마라타와 아흐마디야 협정을 맺어 아프간과 로힐라를 막아 주는 대가로 펀자브·신드의 차우트 등을 약속했다. 1753년 미르 마누가 죽자 펀자브는 혼란에 빠졌고 두라니는 1756년 11월 네 번째로 출정해 이듬해 1월 델리를 약탈했다. 펀자브에서는 시크 무장 단체(달 칼사)가 1748년 암리차르에 모여 열한 개 미슬로 결집해 지방 권력으로 자랐다. 이 흐름은 1761년 제3차 파니파트 전투와 시크 세력의 부상으로 이어진다(「두라니의 인도 침입과 제3차 파니파트 전투(1757~1767)」, 뒤의 사건). 두라니의 침입은 델리의 부를 노린 원정이 주된 목적이었지 직접 통치가 목적이 아니었고, 펀자브의 지방 권력과 시크 미슬이 그 틈에서 자랐다. 시크 미슬은 두라니의 거듭된 침입 속에서 라호르와 암리차르 둘레를 두고 힘을 키웠다. 이 침입들은 두라니 제국이 펀자브와 카슈미르를 지배하는 바탕을 놓았고, 시크 세력은 1760년대부터 이 땅을 두라니에서 빼앗아 나갔다."
  subjects: [durrani-empire, mughal-empire, maratha-peshwa]
