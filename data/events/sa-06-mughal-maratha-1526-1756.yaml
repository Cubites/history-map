- id: madras-bombay-1639
  year: 1639
  endYear: 1690
  title:
    ko: "마드라스·봄베이·퐁디셰리·캘커타: 유럽 상관의 성장(1639~1690)"
  summary:
    ko: "17세기 중엽부터 유럽 상사들은 무역 거점을 요새화된 도시로 키웠다. 영국 동인도 회사는 1639년 코로만델 해안의 지방 영주에게서 땅을 받아 1640년 마드라스에 세인트 조지 요새를 세웠다. 1661년 영국 왕 찰스 2세가 포르투갈 공주 캐서린 브라간사와 혼인하면서 봄베이를 지참금으로 받았고, 1668년 이를 연 10파운드로 회사에 빌려주었다. 벵골에서는 1690년 8월 조브 차르녹이 후글리강 가 수타누티에 자리 잡았고, 1696년 요새 건설을 거쳐 1698년 세 마을의 지세권을 얻어 캘커타(지금 콜카타)가 자랐다. 프랑스 동인도 회사는 1664년 콜베르가 세웠고, 프랑수아 마르탱이 1674년 비자푸르의 지방관 셰르 칸 로디에게서 퐁디셰리를 얻어 훗날 프랑스령 인도의 중심으로 삼았다. 퐁디셰리는 1693년 네덜란드가 점령했다가 1699년 돌려주었다. 네덜란드 동인도 회사는 1663년 코친 등 말라바르 해안의 포르투갈 거점을 빼앗았고, 덴마크는 1620년 트랑케바르에 상관을 열었다. 무굴 황제와 지방 군주는 회사를 상업 집단으로 보았으므로 이 상관들은 무굴 총독과 지방 통치자의 허가 아래 자리 잡았다. 이 도시들이 18세기 식민지 전쟁의 거점이 되었다. 마드라스의 블랙타운(인도인 상인촌)과 요새 안 화이트타운(유럽인 구역)처럼 이 도시들은 유럽인 구역과 인도인 구역이 갈린 식민 도시의 초기 모습을 보였다. 회사는 직물 상인과 직조공을 불러 모아 도시를 키웠고, 이들 도시는 뒤에 영국령 인도의 거점이 되었다. 이 거점들은 17세기까지 무굴과 지방 군주가 허락한 상관 수준이었고, 1690년대 이후에야 요새와 자체 병력을 갖춘 도시로 커졌다."
  subjects: [french-india, mughal-empire, bijapur-sultanate, france, dutch-republic]
  links:
    - { from: france, to: french-india, note: "퐁디셰리에 상관을 열어 프랑스령 인도의 바탕을 놓음 (1674)" }
  tags: [economy, diplomacy]
  sources: ["K. N. Chaudhuri, The Trading World of Asia and the English East India Company, 1660–1760 (Cambridge University Press, 1978)", "P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Wiley-Blackwell, 2012)"]

- id: shivaji-swarajya-1645
  year: 1645
  endYear: 1673
  title:
    ko: "시바지의 스와라지: 토르나 요새에서 푸란다르 조약까지(1645~1673)"
  summary:
    ko: "시바지 본슬레(1630 무렵~1680)는 비자푸르 술탄국을 섬기던 샤지 본슬레의 아들로, 마하라슈트라 서부 산지의 푸네에서 자랐다. 1645~1646년 무렵 토르나 요새를 얻어 스와라지(자치)의 첫걸음을 내디뎠고, 이후 콘칸 해안과 산악 요새를 하나씩 넓혔고 이 스와라지는 훗날 마라타 제국의 바탕이 되었다. 1659년 11월 프라탑가드에서 비자푸르 장군 아프잘 칸을 죽이고 그의 군대를 흩어 놓아 북콘칸과 푸네 쪽을 비자푸르에게서 가져왔고. 1660년 판할라 포위를 풀고 달아나는 길에 바지 프라부 데슈판데가 파반 킨드에서 추격을 막다 전사했다. 무굴 데칸 총독 샤이스타 칸은 1660년 푸네를 차지해 머물다가 1663년 4월 밤 시바지의 습격으로 손가락을 잃고 물러났고, 1664년 1월 시바지는 무굴의 항구 도시 수라트를 약탈했다. 1665년 6월 암베르의 자이 싱 1세에게 포위된 시바지는 푸란다르 조약으로 요새 35개 중 23개를 넘겼다. 1666년 5월 아그라 궁정에서 모욕을 당하고 연금되었다가 8월 탈출했다. 1670년 시바지는 요새 대부분을 되찾고 수라트를 다시 약탈했다. 시바지에 대한 평가는 힌두 자치의 영웅으로 보는 시각과 무굴 연대기가 약탈자로 적은 시각이 갈린다. 시바지의 군대는 가벼운 보병과 기병이 산악 요새를 오가며 매복과 기습으로 싸우는 방식에 기댔는데, 이는 말리크 암바르 때 데칸에서 발달한 전술이다. 해안에는 수군을 두어 콘칸 해안을 지켰다. 시바지의 군대는 처음엔 마발라(산악 농민) 보병이 중심이었고 뒤에는 기병 비중이 늘었다. 시바지의 어머니 지자바이와 스승 다다지 콘데오는 어린 시절의 교육과 정치 감각에 영향을 준 인물로 전한다. 이 시기 시바지의 세력은 비자푸르와 무굴 어느 쪽에도 속하지 않는 중간 지대에서 자랐다."
  subjects: [maratha-peshwa, bijapur-sultanate, mughal-empire]
  links:
    - { from: maratha-peshwa, to: bijapur-sultanate, note: "프라탑가드에서 아프잘 칸을 꺾고 북콘칸·푸네를 차지 (1659)" }
    - { from: mughal-empire, to: maratha-peshwa, note: "푸란다르 조약으로 요새 23개를 넘겨받음 (1665)" }
  tags: [war, politics]
  sources: ["Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "Jadunath Sarkar, Shivaji and His Times (M. C. Sarkar & Sons, 1920)", "Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)"]
