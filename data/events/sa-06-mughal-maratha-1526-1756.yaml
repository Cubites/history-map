- id: akbar-rajputs-1562
  year: 1562
  endYear: 1576
  title:
    ko: "아크바르와 라지푸트: 혼인 동맹, 치토르 포위, 할디가티 전투(1562~1576)"
  summary:
    ko: "아크바르는 라지푸트 군주들을 없애지 않고 무굴 귀족 체제 안으로 끌어들였다. 1562년 암베르(훗날 자이푸르)의 바르말 왕이 딸을 아크바르와 혼인시키고 아들 바그완트 다스와 손자 만 싱이 무굴 장군이 되었다. 혼인을 맺은 가문은 대를 이어 높은 만사브를 받았고 종교 의식을 지킬 자유를 얻었다. 항복하지 않은 쪽은 메와르의 우다이 싱 2세였고, 아크바르는 1567년 10월부터 치토르 요새를 포위해 1568년 2월 함락시켰다. 수비대 장수 자이말과 파타가 죽은 뒤 여성들이 자우하르(집단 자결)를 택했다고 전하며, 연대기 작가 아불 파즐은 함락 뒤 아크바르가 성 안 주민(비전투원)의 학살을 명령해 약 3만 명이 죽었다고 적었는데, 이 숫자가 수비대 전사자까지 합친 것인지는 사료마다 갈린다. 우다이 싱은 산지의 새 도읍 우다이푸르로 물러났다. 1569년 란탐보르의 수르잔 하다가 항복했고, 1570년 나가우르 집회에서 비카네르와 자이살메르의 군주가 복종해 혼인으로 무굴과 이어졌고, 조드푸르는 1564년 무굴군이 점령했다가 1583년 우다이 싱에게 돌려주었다. 우다이 싱의 아들 프라탑 싱은 굴복하지 않았고 1576년 6월 할디가티에서 만 싱이 이끄는 무굴군에게 졌으나 산속에서 저항을 이어 1597년 죽었다. 이보다 앞선 1564년 아사프 칸이 곤드의 가르하-만들라 왕국을 쳐서 왕비 두르가바티가 전사했고, 이 왕국은 무굴에 공납하게 되었다. 라지푸트 연합에 들어간 가문의 군사는 이후 무굴 군대의 중추가 되어 카불에서 벵골까지 싸웠다. 반면 프라탑 싱의 저항은 훗날 라지푸트 용기의 상징으로 기억되었으나, 연구자들은 메와르가 곧 협상에 나선 점도 함께 지적한다. 혼인으로 이은 라지푸트 공주들은 무굴 궁정에서 힌두 의례를 지키는 것이 허용되었고 이는 이후 무굴 황실의 문화 혼합으로 이어졌다."
  subjects: [mughal-empire, jaipur-state, mewar-state, jodhpur-state, bikaner-state, jaisalmer-state, garha-mandla-kingdom]
  links:
