- id: bahadur-shah-gujarat-1531
  year: 1531
  endYear: 1537
  title:
    ko: "바하두르 샤의 구자라트와 포르투갈의 디우 진출(1531~1537)"
  summary:
    ko: "구자라트 술탄국의 바하두르 샤(재위 1526~1537)는 1531년 말와의 만두를 차지해 말와 술탄국을 합쳤고 1532년 라이센 성을 얻은 뒤 1535년 메와르의 치토르를 포위해 함락했다. 이때 메와르의 왕비 카르나바티가 후마윤에게 도움을 청했다고 전하지만 이 일화는 연대기마다 사실과 전설이 섞여 있다. 후마윤이 구자라트로 올 기미가 보이자 바하두르 샤는 1534년 12월 포르투갈 인도 총독 누노 다 쿠냐에게 바세인(지금 바사이)을 넘기는 조약을 맺었고, 1535년에는 디우 요새를 포르투갈이 짓도록 허락했다. 후마윤은 1535년 말와와 구자라트로 쳐들어와 바하두르 샤를 디우로 몰아냈으나, 동쪽에서 셰르 칸(훗날 셰르 샤)이 일어나자 1536년 돌아가야 했다. 바하두르 샤는 구자라트를 되찾았지만 포르투갈이 요새를 돌려주지 않자 1537년 2월 디우 앞바다에서 포르투갈 총독을 만나다 배 위에서 물에 빠져 죽었다. 포르투갈 쪽은 다툼 중 일어난 사고로, 구자라트 쪽은 배신한 살해로 기록한다. 구자라트에서는 술탄 자리 다툼이 이어졌고, 디우는 포르투갈령 인도의 거점으로 1961년까지 남았다(「알부케르케의 고아 점령(1510)」, 앞의 사건). 말와는 1537~1542년 카디르 샤가 다스리다 수르 왕조에 넘어갔다. 구자라트는 아라비아해 교역의 중심으로 캄바트·수라트·디우 항구에서 면직물과 향신료가 나갔다. 포르투갈은 이 교역을 쥐려고 통행증(카르타스) 제도를 세워 갔고, 오스만 함대는 1538년 디우를 포위했으나 포르투갈이 지켜 냈다. 디우 요새는 이후 아라비아해 항로 통제의 중요한 거점이 되었다. 후마윤이 구자라트를 얻은 기간은 1년이 못 되어, 무굴의 구자라트 지배는 1572년 아크바르의 정복(「아크바르의 구자라트 정복(1572~1573)」, 뒤의 사건)에야 이뤄졌다."
  subjects: [gujarat-sultanate, malwa-sultanate, mughal-empire, portuguese-india, portugal, mewar-state]
  links:
    - { from: gujarat-sultanate, to: malwa-sultanate, note: "만두를 차지해 말와 술탄국을 합침 (1531)" }
