- id: aurangzeb-rajput-1679
  year: 1679
  endYear: 1681
  title:
    ko: "아우랑제브와 라지푸트 전쟁, 지즈야 부활(1679~1681)"
  summary:
    ko: "아우랑제브(재위 1658~1707)는 1679년 4월 비무슬림에게 걷던 지즈야를 다시 부과했다. 신분과 재산에 따라 세 등급의 세액을 매겼고 여성·어린이·가난한 이와 일부 관직자는 면제했다. 이 정책의 동기에 대해서는 학설이 갈린다. 자두나트 사르카르 등은 이를 정통 수니 신앙에 따른 종교 정책으로 보았고, 오드리 트러슈키나 사티시 찬드라 같은 연구자들은 데칸 전쟁으로 바닥난 재정과 울라마 계층의 압력 등 재정·정치 요인을 함께 강조한다. 같은 시기 마르와르(조드푸르)의 자스완트 싱이 1678년 12월 아프가니스탄 국경에서 죽자 아우랑제브는 마르와르를 직접 관리 아래 두었다. 자스완트 싱의 유복자 아지트 싱을 델리에서 빼돌려 지킨 이는 라토르 가문의 두르가다스였고, 이 일이 라지푸트 가문 전체의 반발을 불러 메와르의 라지 싱 1세도 편에 섰다. 무굴군은 1679~1680년 메와르를 침입해 우다이푸르와 여러 사원을 공격했고(무굴 쪽 기록은 사원 파괴를 직접 적었다), 라나 라지 싱은 산지에서 게릴라전으로 맞섰다. 1681년 아우랑제브의 넷째 아들 아크바르가 라토르·시소디아의 지원으로 스스로 황제를 칭했다가 실패해 마라타의 삼바지에게, 다시 이란으로 달아났다. 1681년 6월 메와르와 화의가 이뤄졌으나 마르와르 전쟁은 1707년까지 이어졌고, 이 일로 아우랑제브는 데칸으로 떠난 채 북인도 귀족과의 신뢰를 되찾지 못했다. 지즈야 부과에 항의하는 군중이 델리에서 황제의 행차를 막았다는 기록이 이탈리아 사람 니콜로 마누치의 글에 있다. 한편 마르와르·메와르와의 전쟁은 라지푸트 귀족이 무굴 군대에서 맡던 비중을 흔들어 놓았고, 암베르의 자이 싱 가문 같은 일부 가문만 협력을 이어 갔다."
  subjects: [mughal-empire, jodhpur-state, mewar-state]
  links:
    - { from: mughal-empire, to: jodhpur-state, note: "마르와르를 직접 관리 아래 둠 (1679)" }
  tags: [politics, war, religion]
  sources: ["Audrey Truschke, Aurangzeb: The Man and the Myth (Penguin, 2017)", "Jadunath Sarkar, History of Aurangzib (M. C. Sarkar & Sons, 1912–1924)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)"]

- id: maratha-wars-1680
  year: 1680
  endYear: 1707
  title:
    ko: "삼바지·라자람·타라바이와 마라타 전쟁(1680~1707)"
  summary:
    ko: "시바지가 죽은 뒤 삼바지(재위 1681~1689)는 마라타 왕국을 이끌며 아우랑제브와 포르투갈령 인도의 고아, 잔지라의 시디에 맞섰다. 아우랑제브는 1681년 가을 아들 아크바르를 쫓아 데칸에 내려온 뒤 1707년까지 남쪽에 머물며 마라타를 치려 했다. 비자푸르(1686)와 골콘다(1687)를 무너뜨린 뒤(「아우랑제브의 비자푸르·골콘다 병합(1686~1687)」, 뒤의 사건) 1689년 2월 삼바지는 상가메슈와르에서 사로잡혀 3월 처형되었다. 동생 라자람(재위 1689~1700)은 도읍 라이가드가 함락되자 남쪽 진지(젠지)로 달아나 1690~1698년 무굴군의 긴 포위를 견뎠다. 진지는 1698년 줄피카르 칸에게 함락되었고(무굴은 1692년 그를 카르나타카 태수로 두었으며, 이 지방이 훗날 카르나타카 나와브가 된다) 라자람은 마하라슈트라로 돌아갔다. 라자람이 1700년 죽자 왕비 타라바이가 어린 아들 시바지 2세를 내세워 섭정을 맡아 무굴 영역으로 약탈 원정을 넓혔다. 마라타 장수들은 말와와 구자라트 북부까지 들어갔고 토호와 군벌이 제각기 차우트를 거두었다. 아우랑제브는 1705년 와긴게라, 1707년 아마드나가르로 물러났다. 군대와 재정이 소모된 채 1707년 3월 아우랑제브가 죽자(「아우랑제브의 죽음과 무굴 제국의 쇠퇴(1707~1720)」, 뒤의 사건) 새 황제 아잠 샤가 삼바지의 아들 샤후를 풀어 주어 타라바이 쪽과 후계 다툼을 붙였다. 이 25년 전쟁은 무굴에 막대한 인명과 재정 손실을, 데칸 주민에게 기근과 역병을 남겼다. 무굴 군영은 수십만 명이 따라다니는 이동 도시였고, 연구자들은 군인과 상인, 종자를 합한 규모를 수십만 명 이상으로 추산한다. 이 군영의 보급이 데칸 농촌을 압박했다. 마라타 쪽 사료와 무굴 연대기는 삼바지의 처형과 라자람의 도피를 서로 다르게 평가하며, 연구자들은 이 전쟁이 분산된 마라타 지휘 체계를 오히려 강하게 만들었다고 본다."
  subjects: [maratha-peshwa, mughal-empire, carnatic-nawab, portuguese-india]
  links:
    - { from: mughal-empire, to: maratha-peshwa, note: "삼바지를 처형(1689)하고 진지를 함락 (1698)" }
  tags: [war, politics]
  sources: ["Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "Jadunath Sarkar, History of Aurangzib (M. C. Sarkar & Sons, 1912–1924)", "John F. Richards, The Mughal Empire (Cambridge University Press, 1993)"]
