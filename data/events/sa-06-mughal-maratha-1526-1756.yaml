- id: chausa-kannauj-1539
  year: 1539
  endYear: 1545
  title:
    ko: "차우사·카나우지 전투와 후마윤의 망명(1539~1545)"
  summary:
    ko: "바부르가 죽은 뒤 후마윤(재위 1530~1540, 1555~1556)은 형제 캄란·아스카리·힌달에게 영지를 나눠 주고 동쪽의 아프간 세력과 맞섰다. 비하르의 아프간 수장 셰르 칸 수르는 1538년 벵골 술탄국의 도읍 가우르를 차지했고, 후마윤은 가우르에서 몇 달 머물다 돌아오는 길에 1539년 6월 비하르 서쪽 차우사에서 크게 졌다. 셰르 칸은 스스로 셰르 샤라 칭했고, 형제들의 도움이 적었던 후마윤은 1540년 5월 카나우지(빌그람)에서 다시 졌다. 후마윤은 라호르와 신드를 거쳐 라자스탄 마르와르의 도움을 구했으나 거절당했고, 1542년 신드의 우마르코트에서 아들 아크바르가 태어났다. 이 일로 무굴 제국은 델리에서 밀려나 1555년까지 이어진 수르 왕조의 시대가 열렸다. 후마윤은 1544년 이란으로 건너가 사파비 왕조의 타흐마스프 1세를 만나 군대를 빌렸고(「타흐마스프 1세의 치세: 크즐바시 내전과 우즈베크, 카즈빈 천도(1524~1576)」, 앞의 사건) 1545년 칸다하르와 카불을 차지했다. 이후 카불에 머무는 동안 동생 캄란과의 다툼이 되풀이되었다. 후마윤은 학식이 높고 점성술과 천문학을 즐긴 군주로 알려졌으나 군사적 결단에는 약했다는 평이 있다. 반면 셰르 샤 수르는 비하르 사사람의 영주 집안 출신으로 로디와 무굴 아래서 행정을 익혔고, 이 경험은 뒤의 개혁(「셰르 샤 수르의 행정과 수르 왕조의 끝, 후마윤의 복귀(1540~1556)」, 뒤의 사건)으로 이어졌다. 무굴 제국이 한 번 델리를 잃었다가 되찾은 이 과정은 바부르가 세운 나라가 아직 뿌리내리지 못했음을 보여 준다. 차우사와 카나우지에서 무굴군은 병력이 많았으나 보급과 지휘가 어긋났고, 차우사에서는 쫓기던 무굴군이 갠지스강을 건너다 많이 빠져 죽었고 후마윤도 물에 빠졌다가 구조되었다."
  subjects: [mughal-empire, sur-empire, bengal-sultanate]
  links:
    - { from: sur-empire, to: mughal-empire, note: "차우사와 카나우지에서 후마윤을 꺾어 델리에서 몰아냄 (1539~1540)" }
  tags: [war, politics]
  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Satish Chandra, Medieval India: From Sultanate to the Mughals, Part II: Mughal Empire (1526–1748) (Har-Anand Publications, 2005)", "Michael H. Fisher, A Short History of the Mughal Empire (I.B. Tauris, 2016)"]
