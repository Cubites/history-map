- id: gaekwad-gujarat-1721
  year: 1721
  endYear: 1753
  title:
    ko: "가이크와드의 구자라트: 바로다 점령과 카티아와르 토후국들의 자립(1721~1753)"
  summary:
    ko: "마라타 장수 필라지 가이크와드는 1721년 무렵 구자라트의 송가드를 차지해 근거지로 삼았다. 구자라트 총독 사르불란드 칸이 마라타에 차우트를 인정해 달라는 요구에 시달리다 1730년 마르와르의 아바이 싱에게 자리를 넘겼고, 이 무렵 주나가드 같은 반도의 군소 정권이 무굴 총독의 통제에서 풀려났다. 카티아와르 반도에는 주나가드·나와나가르·바브나가르·포르반다르·곤달 등 190여 개의 작은 토후국이 있었는데, 이들은 무굴 아래서 이어 오다가 1730년 무렵부터 사실상 자립했다. 1731년 4월 다보이에서 페슈와 바지 라오가 마라타 총사령관 트림바크 라오 다바데를 꺾자 구자라트의 마라타 세력은 페슈와와 가이크와드 쪽으로 정리되었다. 필라지는 1734년 바로다를 점령해 가이크와드 가문의 도읍을 삼았다(바로다 주의 시작). 다마지 가이크와드와 페슈와의 동생 라구나트 라오는 1753년 아마다바드를 점령해 무굴의 구자라트 지배를 끝냈다. 구자라트 평원은 페슈와와 가이크와드가 나눠 맡았다. 카티아와르의 군소 토후국들은 가이크와드와 페슈와에게 공물을 바치면서 독립을 유지했다. 이 뒤 바로다는 가이크와드 가문이 영국 동인도 회사와 보조 조약(1802)을 맺는 토후국으로 이어졌다. 구자라트의 수라트·캄바트 항구와 면직물 산업은 무굴 쇠퇴기에도 상업 자본을 유지했다. 카티아와르의 작은 토후국들은 해적질과 항구 징수로 살아남으며 훗날 영국의 카티아와르 에이전시 아래 묶였다. 다보이 전투 이후 가이크와드가 구자라트에서 얻은 몫은 페슈와와 나눠야 했고, 이 불화는 18세기 후반 마라타 연합 내부 갈등으로 이어졌다. 구자라트 평원을 둘러싼 이 다툼에서 무굴의 지방 관리와 현지 상인은 마라타에게 차우트를 주고 평화를 사는 일이 잦았다."
  subjects: [baroda-state, kathiawar-states, maratha-peshwa, mughal-empire]
  links:
    - { from: baroda-state, to: mughal-empire, note: "아마다바드를 점령해 구자라트 지배를 끝냄 (1753)" }
  tags: [politics, war]
  sources: ["Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "Imperial Gazetteer of India, Vol. 6 (Clarendon Press, 1908)", "Muzaffar Alam, The Crisis of Empire in Mughal North India: Awadh and the Punjab, 1707–48 (Oxford University Press, 1986)"]

- id: travancore-marthanda-1729
  year: 1729
  endYear: 1758
  title:
    ko: "마르탄다 바르마와 트라방코르의 성립(1729~1758)"
  summary:
    ko: "남인도 말라바르 해안의 소왕국 벤나드(벤나트)의 마르탄다 바르마는 1729년 왕위에 올라 귀족 가문 연합(여덟 가문의 필라마르)과 마두라이 쪽 세력의 압박을 이기고 왕권을 굳혔다. 그는 1740년대 중반부터 1750년 사이 콜람·카얌쿨람·암발라푸자·테쿰쿠르 같은 이웃 소왕국을 차례로 합쳐 지금 케랄라 남부를 아우르는 트라방코르 왕국을 이뤘다. 1741년 8월 콜라첼 전투에서 네덜란드 동인도 회사의 해군이 트라방코르에 졌고, 포로로 잡힌 네덜란드 장교 에우스타키우스 데 라노이는 나중에 트라방코르 군대의 총사령관이 되어 서양식 훈련을 도입했다. 1753년 마벨리카라 조약으로 네덜란드는 후추 교역권을 받는 대신 정치 간섭을 그만두었다. 마르탄다 바르마는 1750년 1월 나라 전체를 파드마나바스와미 신에게 바치고 스스로 신의 종(파드마나바 다사)이라 칭해 왕권을 신앙으로 정당화했다. 그는 후추 전매와 도로, 상비군으로 재정을 키웠다. 1758년 죽은 뒤 카르티카 티루날이 이어 1766년 마이소르의 침입에 맞서야 했다. 이 나라는 1795년 영국 동인도 회사와 보조 동맹을 맺어 토후국이 되었다. 트라방코르의 군사 개혁과 후추 전매는 말라바르 해안 후추 교역에서 네덜란드 세력을 줄이는 결과를 낳았다. 사원 재정을 왕실이 직접 관리했고, 이 체제는 나이르 귀족과 브라만 사회의 틀 위에 서 있었다. 트라방코르는 이후 영국과 가까운 토후국으로 남았다. 마르탄다 바르마는 귀족의 반란을 진압하며 일부 가문의 토지를 몰수하고 새로운 신하 계층을 세웠다. 마르탄다 바르마의 업적은 트라방코르 왕실 전승에서 건국자의 이야기로 오래 전해졌다. 그가 닦은 도로와 운하는 이후 케랄라 남부 교역을 이었다."
  subjects: [travancore, dutch-republic]
  links:
    - { from: travancore, to: dutch-republic, note: "콜라첼에서 네덜란드 동인도 회사를 꺾음 (1741)" }
  tags: [politics, war]
  sources: ["A. Sreedhara Menon, A Survey of Kerala History (Sahitya Pravarthaka Co-operative Society, 1967)", "Burton Stein, A History of India (Blackwell, 1998)"]
