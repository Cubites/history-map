- id: succession-war-1657
  year: 1657
  endYear: 1659
  title:
    ko: "샤자한의 병과 계승 전쟁: 다라 시코와 아우랑제브(1657~1659)"
  summary:
    ko: "샤자한은 1657년 9월 중병에 걸렸다. 네 아들 중 맏이 다라 시코는 황제의 후계자로 아버지 곁에서 정무를 맡았고, 벵골의 샤 슈자, 구자라트의 무라드 박시, 데칸의 아우랑제브가 각각 군사를 일으켰다. 아우랑제브는 이미 1656~1657년 골콘다 포위와 비다르·칼리야니(북 카르나타카)의 비자푸르 요새를 쳐서 얻어 군사력이 컸고, 비자푸르와 골콘다는 무굴에 거액을 바쳐 화의했다. 1658년 4월 다르마트에서 아우랑제브·무라드의 연합군이 다라가 보낸 자스완트 싱의 군대를 꺾었고, 5월 아그라 가까운 야무나강 가에서 다라 자신을 크게 꺾었다. 아우랑제브는 아그라 요새를 장악해 샤자한을 가두었고(황제는 1666년 1월 죽을 때까지 갇혀 지냈다) 동생 무라드를 체포했다. 1658년 7월 델리에서, 이듬해 6월 재차 즉위식을 올렸다. 슈자는 1659년 1월 카즈와에서 졌고 아라칸으로 달아나 거기서 죽었다. 다라는 신드로 달아났다가 사로잡혀 1659년 8월 델리에서 처형되었다. 아우랑제브는 이로써 알람기르('세계를 쥔 자') 황제가 되었고, 이 전쟁은 형제 살해와 종교 성향 논쟁으로 오래 해석되어 왔다. 다라를 힌두교와 수피 사상에 열린 인물로, 아우랑제브를 정통 수니 신앙의 인물로 대비하는 서술이 많으나 최근 연구는 두 사람의 정치적 계산과 귀족 파벌의 역할을 함께 강조한다. 무굴 왕위 계승에는 장자 상속 원칙이 없었고 아들들이 각자 지방 총독으로 군대를 거느렸으므로 황제가 죽거나 앓을 때마다 무력 다툼이 벌어졌다. 1657~1659년 전쟁은 이 제도의 약점이 가장 격하게 터진 사례다. 이 전쟁에서 이긴 아우랑제브는 형제를 모두 제거했고, 이후 황제 자리를 지키려는 궁정의 긴장은 그의 치세 내내 이어졌다."
  subjects: [mughal-empire, bijapur-sultanate, golconda-sultanate]
  tags: [war, politics]
  sources: ["John F. Richards, The Mughal Empire (Cambridge University Press, 1993)", "Audrey Truschke, Aurangzeb: The Man and the Myth (Penguin, 2017)", "Jadunath Sarkar, History of Aurangzib (M. C. Sarkar & Sons, 1912–1924)"]
  places: [{ name: 아그라 근처 야무나강 가 전투, at: [78.08, 27.14], year: 1658 }, { name: 다르마트 전투, at: [75.9, 23.2], year: 1658 }]

- id: kalat-baloch-1666
  year: 1666
  endYear: 1749
  title:
    ko: "칼라트 칸국과 발루치스탄 토후국들: 카란·마크란·라스벨라(1666~1749)"
  summary:
    ko: "발루치스탄 중부 고원에서는 브라후이 부족의 아흐마드자이 가문이 칸 자리를 쥐고, 1666년 미르 아흐마드 1세가 칼라트에서 칸국을 열었다. 칼라트 칸은 무굴 제국(카치 지방 일부)과 사파비 이란 사이에서 사실상 홀로 서서 발루치 부족 연합을 이끌었다. 압둘라 칸(재위 1715~1730)이 카치 평야를 칼라트에 더했고, 나시르 칸 1세(재위 1749~1794) 때 칸국은 가장 컸다. 서북 사막의 카란에서는 나우셰르와니 가문이 1697년 무렵 자리를 잡았다. 아라비아해 기슭 마크란의 케치 골짜기에서는 기치키 가문이 1740년대 세력을 키워 나와브를 칭했고, 카라치 서쪽 라스벨라에서는 잠 알리 칸 1세가 1742년 라스벨라의 잠 왕조를 세웠다. 이 토후국들은 칼라트 칸을 종주로 여기기도 했고 때로는 독립을 주장했다. 1739년 나디르 샤가 인더스 서안과 발루치스탄 일부를 병합하자(「나디르 샤의 인도 원정과 델리 약탈(1738~1739)」, 뒤의 사건) 칼라트 칸은 이란에 복종했고, 1747년 나디르 샤가 죽은 뒤 두라니 아흐마드 샤와 협상해야 했다. 1749년 나시르 칸이 칸 자리에 올라 아프간 두라니 제국과의 관계를 새로 정했다. 발루치스탄의 경제는 목축과 대상 무역, 해안 교역에 기대었고 칸은 부족 족장(사르다르)의 지지로 권위를 유지했다. 칸의 권위는 부족 연합 위에 선 것이어서 칸국은 중앙집권 국가라기보다 조정자에 가까웠다. 18세기 발루치스탄의 정치는 칸의 권위와 부족 족장의 자치 사이에서 줄다리기가 이어졌고, 이 구도는 영국령 시기에도 이어졌다. 이 구도는 영국령 시기의 칼라트 보호 조약과 1947년 칼라트의 독립 선언에도 영향을 주었다."
  subjects: [kalat, kharan, makran, las-bela, durrani-empire]
  tags: [politics]
  sources: ["Taj Mohammad Breseeg, Baloch Nationalism: Its Origin and Development (Royal Book Company, 2004)", "Jos Gommans, The Rise of the Indo-Afghan Empire, c. 1710–1780 (Brill, 1995)"]

- id: maratha-kingdom-1674
  year: 1674
  endYear: 1680
  title:
    ko: "시바지의 대관과 마라타 왕국(1674~1680)"
  summary:
    ko: "1674년 6월 시바지는 라이가드 요새에서 바라나시의 학자 가가 바트의 주재로 힌두 의례에 따라 대관식을 올리고 차트라파티(왕중왕)라는 칭호를 썼다. 대관은 비자푸르·골콘다 같은 무슬림 군주가 다스리던 데칸에서 힌두 군주의 정통성을 세우려는 일이었고, 그가 출신인 본슬레 가문을 크샤트리아로 승격하는 의식도 곁들여졌다. 시바지는 여덟 대신(아슈타 프라단)이 맡는 행정 체제를 세웠고, 주변 영토에서 수확의 4분의 1(차우트)과 10분의 1(사르데슈무키)을 거두는 방식으로 재정을 마련했다. 1677~1678년에는 골콘다의 압둘 하산 쿠틉 샤와 손잡고 카르나타카로 내려가 진지와 벨로르를 얻었다. 이복 형제 에코지(방카지)는 탄자부르를 다스리고 있었다. 시바지는 1680년 4월 라이가드에서 죽었다. 그의 아들 삼바지는 계승 다툼 끝에 1681년 즉위했다. 시바지의 평가는 힌두 민족주의의 영웅이자 군사 지도자로 보는 서술과, 약탈로 세력을 키운 지역 군벌로 보는 무굴 연대기의 서술이 갈리며, 최근 연구는 두 시각을 모두 비판하며 그가 속한 데칸 군사 노동 시장과 술탄국 사회의 맥락에 놓고 본다. 대관식에는 영국 동인도 회사의 봄베이 상관이 사절 헨리 옥센든을 보내 조약을 논의했고, 시바지는 1664~1667년 무렵 쌓은 서해안 수군 요새 신두두르그를 비롯한 해안 요새로 통행증을 팔아 해상 교역에서도 수입을 얻었다. 대관 비용과 전쟁 경비는 새로 차지한 지역에 대한 상납과 징세로 마련되었다. 이 대관으로 마라타는 술탄국의 장군이 아닌 독자 왕국으로 위상을 굳혔고, 이는 뒤의 마라타 연합이 정통성을 잇는 바탕이 되었다. 대관식은 라이가드에서 약 한 달 동안 이어졌고, 여덟 대신이 새로 임명되었다고 전한다."
  subjects: [maratha-peshwa, golconda-sultanate, bijapur-sultanate, mughal-empire]
  links:
    - { from: maratha-peshwa, to: bijapur-sultanate, note: "카르나타카 원정으로 진지·벨로르를 얻음 (1677~1678)" }
  tags: [politics, war]
