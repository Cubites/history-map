  sources: ["Stewart Gordon, The Marathas 1600–1818 (Cambridge University Press, 1993)", "Robert Vane Russell, The Tribes and Castes of the Central Provinces of India (Macmillan, 1916)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)"]

- id: carnatic-wars-1746
  year: 1746
  endYear: 1754
  title:
    ko: "카르나타카 전쟁과 뒤플렉스·클라이브의 아르코트(1746~1754)"
  summary:
    ko: "오스트리아 왕위 계승 전쟁(「오스트리아 왕위 계승 전쟁」, 앞의 사건)이 인도에 번져 1746년 프랑스 총독 라 부르도네가 영국 동인도 회사의 마드라스를 점령했다. 이 제1차 카르나타카 전쟁은 1748년 엑스라샤펠 조약으로 마드라스가 영국에 돌아가며 끝났다. 하이데라바드 니잠 아사프 자 1세가 1748년 죽고 카르나타카 나와브 자리도 흔들리자 퐁디셰리를 거점으로 프랑스령 인도를 이끈 총독 조제프 뒤플렉스는 하이데라바드 계승자로 무자파르 장을, 카르나타카 나와브로 찬다 사히브를 밀었고 영국은 나시르 장과 무함마드 알리 왈라자를 밀었다. 1749년 8월 암부르에서 나와브 안와루딘이 죽었고, 1751년 로버트 클라이브는 아르코트를 급습해 51일간 지켜 냈다. 프랑스의 장군 샤를 부시는 하이데라바드 니잠 살라바트 장의 궁정에 주둔해 북부 시르카르를 얻었고 1752년 마라타의 압박을 받아 칸데시 쪽 땅을 내주었다. 영국이 밀던 무함마드 알리가 트리치노폴리에서 이기자 프랑스는 뒤플렉스를 1754년 소환했고 후임 고데에가 1755년 1월 임시 협정을 맺었다. 이 싸움에서 유럽 회사들은 인도 군주의 후계 다툼을 이용하는 방식으로 군사 개입의 길을 열었다. 1756년 유럽에서 7년 전쟁이 터지면서 싸움은 다시 불붙었다(「외교 혁명과 7년 전쟁」, 뒤의 사건). 유럽 회사의 군사 개입은 소수의 유럽인 장교가 훈련한 인도인 병사(세포이)를 쓰는 방식으로, 인도 군주의 기병 위주 군대를 규율 있는 보병과 야포가 앞서는 사례를 보였다. 이 방식은 뒤에 플라시와 북사르로 이어진다. 유럽 본국 사이의 강화와 상관없이 인도에서는 두 회사가 현지 군주를 앞세워 싸움을 이어 간 것이 이 전쟁의 특징이었다."
  subjects: [carnatic-nawab, hyderabad-state, french-india, uk, france, maratha-peshwa]
  links:
    - { from: uk, to: french-india, note: "무함마드 알리를 지원해 프랑스 후보를 꺾음 (1749~1754)" }
  tags: [war, politics]
  sources: ["Henry Dodwell, Dupleix and Clive: The Beginning of Empire (Methuen, 1920)", "P. J. Marshall, Bengal: The British Bridgehead: Eastern India 1740–1828 (Cambridge University Press, 1987)", "C. A. Bayly, Indian Society and the Making of the British Empire (Cambridge University Press, 1988)"]
