  sources: ["John Wright, Libya: A Modern History (Croom Helm, 1982)", "Lisa Anderson, The State and Social Transformation in Tunisia and Libya, 1830–1980 (Princeton University Press, 1986)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]
