- id: yahya-1904
  year: 1904
  endYear: 1918
  title:
    ko: "이맘 야흐야의 반란과 다안 조약, 오스만 지배의 끝(1904~1918)"
  summary:
    ko: "오스만의 예멘 지배는 도시에 머물렀고 고지의 자이드파는 세금과 징병, 새 법 제도에 반발해 1890년대부터 이맘 무함마드 하미드 앗딘 아래에서 봉기를 되풀이했다(「오스만의 예멘 재정복과 카심 왕조의 끝(1849~1872)」, 앞의 사건). 그가 1904년 죽자 아들 야흐야가 이맘으로 추대되어 반란을 이어 갔고, 1904~1905년 오스만군은 사나 둘레에서 큰 손실을 입었고, 오스만 정부는 1905년 아흐메트 페이지 파샤에게 대군을 맡겨 사나를 구원했다. 오스만은 민법전을 거두고 샤리아 법원을 되살리는 양보를 해야 했다. 1906년 북쪽 아시르에서는 이드리스 가의 반란이 일어났고 1910~1911년 야흐야는 다시 봉기했으나 부족의 지지가 약해 힘이 꺾였다. 1911년 10월 오스만 장군 아흐메트 이제트 파샤가 다안에서 야흐야와 조약을 맺어, 고지 일곱 구역에서는 오스만 민법 대신 이슬람 법을 적용하고 이맘이 재판관(카디)을 지명하되 정부가 승인하게 했으며, 오스만은 야흐야의 반대자에 맞서 그를 지지하고 해마다 2만 5천 튀르크 리라를 주기로 했다. 야흐야는 칼리프와 '신자들의 지도자' 칭호 주장을 버리고 '자이드파 이맘'으로 칭하며 오스만 관할 지역에서는 자카트를 거두지 않기로 했다. 이후 야흐야는 사다와 하자 같은 북쪽 고지의 부족을 묶어 내정을 정비했다. 이는 오스만이 고지에서 사실상의 자치를 인정한 것이었다. 1914년 오스만이 참전하자 야흐야는 오스만과 협정을 유지하며 영국령 아덴과 접한 남쪽에서 영국과도 맞서지 않으려 했고, 이드리스 가와의 사이도 좋지 않았다(「아시르의 이드리스와 이드리스 가의 에미르국(1907~1915)」, 뒤의 사건). 1918년 오스만이 패전하여 물러나자 야흐야는 사나를 맡아 독립을 선언하고 무타와킬 왕국을 세웠다(날짜는 10~11월 설이 갈린다). 아덴 쪽의 영국령 보호령과 이드리스 가, 네지드와의 국경 문제는 이때부터 새 나라가 풀어야 할 몫이 되었다."
  subjects: [zaydi-imamate-yahya, idrisid-emirate, ottoman, uk]
  links:
    - { from: ottoman, to: zaydi-imamate-yahya, note: "다안 조약으로 자이드파 지역 자치 인정 (1911)" }
  tags: [politics, war, religion]
  sources: ["Thomas Kuehn, Empire, Islam, and Politics of Difference: Ottoman Rule in Yemen, 1849–1919 (Brill, 2011)", "Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "Robert W. Stookey, Yemen: The Politics of the Yemen Arab Republic (Westview Press, 1978)"]

- id: iran-constitution-1905
  year: 1905
  endYear: 1911
  title:
    ko: "카자르 입헌 혁명과 1911년 러시아 최후통첩(1905~1911)"
  summary:
    ko: "러일 전쟁과 러시아 혁명(1905)의 소식, 담배 보이콧 이래 이어진 이권 판매와 외채에 대한 불만 속에서(「나세르 앗딘 샤의 통치와 담배 보이콧(1848~1896)」, 앞의 사건) 1905년 12월 테헤란 시장이 설탕 상인을 발바닥 매질로 벌한 일이 입헌 운동의 불씨가 되었다. 울라마와 상인은 성지 샤압둘아짐과 1906년 7월 영국 공사관에 농성하며 헌법과 의회를 요구했다. 1906년 8월 카자르 왕조의 무자파르 앗딘 샤가 헌법을 약속했고 10월 첫 의회(마즐리스)가 열렸으며 12월 기본법이 서명되었다(그는 이듬해 1월 죽었다). 각지에 지역 협의회(안주만)가 생겨 상인·장인·울라마가 정치에 참여했다. 뒤를 이은 무함마드 알리 샤(재위 1907~1909)는 1907년 영러 협상으로 러시아의 후원을 얻자(「영러 협상과 삼국 협상」, 뒤의 사건) 1908년 6월 러시아 장교가 지휘하는 카자크 여단에게 의회를 포격하게 했다. 타브리즈에서는 사타르 칸과 바기르 칸이 입헌파의 저항을 이끌며 포위를 견뎠다. 1909년 7월 바크티아리 부족과 길란의 입헌파가 테헤란에 들어가 샤를 폐위하자 그는 러시아 공사관으로 피신했고, 열한 살의 아들 아흐마드 샤(재위 1909~1925)가 즉위했다. 울라마가 모두 입헌 편이었던 것은 아니어서 샤이흐 파즈롤라 누리는 헌법이 이슬람 법에 어긋난다며 샤 편에 서서 반대했고 1909년 입헌파에게 처형되었다. 두 번째 의회는 1911년 미국인 재정 고문 모건 슈스터를 불러 세금 체계를 개혁하려 했다. 러시아는 1911년 11월 슈스터를 해임하라는 최후통첩을 보냈고 군대를 카즈빈까지 내려보냈으며 의회가 거부하자 1911년 12월 정부와 바크티아리 대신들이 의회를 닫고 슈스터를 내보냈다. 러시아군은 타브리즈에서 입헌파를 처형했다. 이로써 입헌 혁명은 끝났으나 의회와 헌법, 언론이라는 새 정치의 틀은 이란 사회에 남았다."
  subjects: [qajar-iran, russia, uk]
  links: []
  tags: [politics, society, diplomacy]
  sources: ["Mangol Bayat, Iran's First Revolution: Shi'ism and the Constitutional Revolution of 1905–1909 (Oxford University Press, 1991)", "Janet Afary, The Iranian Constitutional Revolution, 1906–1911: Grassroots Democracy, Social Democracy, and the Origins of Feminism (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]

- id: morocco-protectorate-1906
  year: 1906
  endYear: 1912
  title:
    ko: "알헤시라스 회의에서 페스 조약까지: 모로코 보호령의 성립(1906~1912)"
  summary:
    ko: "영국-프랑스 협상으로 프랑스가 모로코를 세력권으로 인정받은 뒤(「영국-프랑스 협상과 모로코 위기」, 앞의 사건) 1906년 1~4월 알헤시라스 회의는 모로코의 독립과 문호 개방을 확인하면서 항구의 경찰을 프랑스와 스페인에 맡기고 국립 은행을 세우게 했다. 술탄 압드 알아지즈(재위 1894~1908)가 서양식 개혁과 사치로 빚을 늘리자 부족과 울라마의 불만이 커졌다. 1907년 7월 카사블랑카 항구 공사장에서 현지인이 유럽인 노동자를 죽이는 일이 일어나자 프랑스 군함이 도시를 포격하고 샤우야 지방을 점령했다(모로코 쪽 사망자는 수백 명에서 수천 명으로 추산이 갈린다). 남부의 하피드는 이를 구실로 술탄을 칭하고 반란을 일으켜 1908년 압드 알아지즈를 몰아냈으나 재정난으로 프랑스 차관과 감독을 받아들였다. 1909년 2월 프랑스와 독일은 프랑스의 정치적 이익과 독일의 경제적 이익을 서로 인정하는 협정을 맺었다. 1911년 봄 페스 둘레 부족이 반란을 일으키자 프랑스군이 페스를 구원한다며 진군해 도시를 차지했고, 이는 독일이 7월 군함을 아가디르로 보낸 위기로 이어졌다. 11월 프랑스는 독일에 콩고 일부를 주는 조건으로 모로코에서 뜻대로 할 권리를 얻었다. 1912년 3월 30일 하피드는 페스 조약에 서명해 프랑스의 보호를 받아들였고, 4월 페스에서 모로코인 병사들의 반란이 일어나 큰 인명 피해가 났다(프랑스군의 진압으로 모로코인 수백 명이 죽었다는 추산이 있다). 프랑스는 리요테를 총주재관으로 보냈고 하피드는 8월 물러나고 동생 유수프가 술탄이 되었다(재위 1912~1927). 1912년 11월 프랑스–스페인 조약으로 스페인은 북부의 보호령을 얻었다. 남쪽에서는 마 알아이닌의 아들 아흐마드 알히바가 1912년 8월 술탄을 칭하며 저항했으나 9월 프랑스군에 졌다."
  subjects: [alaouite-morocco, french-morocco, spanish-morocco, france, spain, german-empire]
  links:
    - { from: france, to: alaouite-morocco, note: "페스 조약으로 보호령 설치 (1912)" }
    - { from: spain, to: alaouite-morocco, note: "북부 보호령 획득 (1912)" }
  tags: [politics, diplomacy, war]
  sources: ["Edmund Burke III, Prelude to Protectorate in Morocco: Precolonial Protest and Resistance, 1860–1912 (University of Chicago Press, 1976)", "Susan Gilson Miller, A History of Modern Morocco (Cambridge University Press, 2013)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]

- id: idrisi-asir-1907
  year: 1907
  endYear: 1915
  title:
    ko: "아시르의 이드리스와 이드리스 가의 에미르국(1907~1915)"
  summary:
    ko: "아시르는 홍해 연안 티하마와 고원 지대를 낀 곳으로 오스만 예멘 주의 한 산작이었다(「오스만의 예멘 재정복과 카심 왕조의 끝(1849~1872)」, 앞의 사건). 수피 교단 이드리시야를 세운 모로코 출신 아흐마드 이븐 이드리스(1837년 죽음)의 손자 무함마드 알이드리스는 메카와 카이로의 알아즈하르에서 공부한 뒤 1906~1907년 무렵 아시르에서 세력을 모아 사비야를 근거로 오스만의 세금과 관리의 부패에 반발하는 부족을 이끌었다. 그는 1908년 말 이맘으로 추대되고 1909년 1월 정부를 세웠으며 그해 하반기(8~9월 무렵) 티하마의 항구 루하이야 등을 차지했다. 그는 사비야에 학교와 모스크를 세우고 부족 사이의 분쟁을 중재했다. 재정은 지잔 항구의 관세와 부족의 자카트, 교단의 기부에 기댔고, 부족 분쟁을 판결하는 종교 지도자의 권위가 정치의 바탕이었다. 이드리스는 아시르 대부분을 차지했으나 1910년 1월 알하파이르 조약으로 오스만이 그를 아시르의 카이마캄으로 인정했고, 샤리아 법 문제로 같은 해 10월 싸움이 다시 일어나 오스만과 샤리프 후세인의 히자즈 군이 반격했다고 전한다. 이 무렵 이맘 야흐야와는 오스만에 맞서는 점에서 가까웠다가 경쟁하게 되었다(「이맘 야흐야의 반란과 다안 조약, 오스만 지배의 끝(1904~1918)」, 앞의 사건). 이탈리아–튀르크 전쟁(1911~1912) 때는 이탈리아 해군이 포격과 무기로 아시르를 도왔다고 전한다. 1차 대전이 터지자 이드리스는 아덴의 영국 대표와 1915년 4월 조약을 맺어 영국의 후원을 받으며 오스만 지배 아래의 티하마 해안을 압박했다. 영국은 홍해 항로의 안전과 이맘 야흐야 견제를 위해 이드리스를 후원했다고 평가된다. 이 후원은 이드리스 가의 에미르국이 아시르에서 한 나라의 꼴을 갖추는 바탕이 되었다. 이드리스는 종교 지도자의 권위로 부족을 묶었으나 해안 항구와 홍해 무역에 기대는 국가의 한계를 안고 있었다."
  subjects: [idrisid-emirate, zaydi-imamate-yahya, ottoman, uk, sharifate-of-mecca]
  links: []
  tags: [politics, religion, war]
  sources: ["Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "Thomas Kuehn, Empire, Islam, and Politics of Difference: Ottoman Rule in Yemen, 1849–1919 (Brill, 2011)", "Anne K. Bang, The Idrisi State in Asir, 1906–1934: Politics, Religion and Personal Prestige as State-Building Factors in Early Twentieth-Century Arabia (Centre for Middle Eastern and Islamic Studies, University of Bergen, 1996)"]

- id: italian-libya-1911
  year: 1911
  endYear: 1912
  title:
    ko: "이탈리아의 리비아 침공(1911~1912)"
  summary:
    ko: "카라만리 왕조가 무너진 뒤 오스만은 트리폴리타니아와 키레나이카를 직접 다스렸고 내륙에서는 사누시 교단이 오아시스와 부족 사이에서 교육과 교역망을 쥐었다(「카라만리 트리폴리: 미국과의 전쟁, 페잔 병합, 오스만의 직접 통치(1801~1835)」, 앞의 사건). 이탈리아는 튀니지를 프랑스에 내준 뒤 리비아에 눈독을 들였고 1911년 9월 말 최후통첩을 보내고 29일 오스만에 선전 포고했다. 이탈리아 함대는 트리폴리를 포격한 뒤 10월 병력을 상륙시켰고 곧 토브루크·데르나·벵가지·알쿰스 등 해안 도시를 차지했다. 이탈리아가 끌어들인 병력은 1912년 중반 10만 명 가까이로 늘었다(추산). 오스만 해군이 약해 해상 보급이 막히자 이집트와 튀니지의 육로가 저항군의 보급로가 되었다. 오스만 정규군은 내륙으로 물러났고 장교 엔베르 파샤·무스타파 케말 등이 아랍·베르베르 주민과 사누시 교단의 저항을 조직했다. 1911년 10월 트리폴리 오아시스의 샤라샤트에서 주민이 이탈리아군을 공격하자 이탈리아군이 주민을 대량으로 죽였고(사망자는 수백 명에서 수천 명으로 추산이 갈리고 리비아 쪽 추산은 4천 명 이상이다) 수천 명의 리비아인이 이탈리아 섬들로 보내졌다. 이탈리아는 1911년 11월 비행기에서 폭탄을 던져 첫 공중 폭격을 했고 같은 달 5일 두 지방을 병합한다고 선포했다. 1912년 10월 18일 로잔(우시) 조약으로 오스만은 두 지방에서 군대를 물리고 술탄의 종교 대리인을 두는 것만 남겼으며 이탈리아가 이 땅을 차지했다(이 전쟁 때 이탈리아가 점령한 도데카니사는 「발칸 전쟁」, 뒤의 사건). 그러나 이탈리아는 해안 도시만 지배했고 내륙은 사누시 교단과 부족이 계속 저항했다. 이탈리아는 이 땅을 이탈리아령 리비아로 부르기 시작했다."
  subjects: [italian-libya, italy, ottoman]
  links:
