# 서아시아·북아프리카 사건 7차 묶음(me-07): 프랑스의 이집트 원정에서 1차 대전까지 — 무함마드 알리·탄지마트·카자르·식민 점령·수에즈 운하 (1797 ~ 1918)
# 범위: 아가 무함마드 칸의 암살과 파트흐 알리 샤, 러시아–이란 전쟁과 굴리스탄·투르크만차이 조약, 헤라트 문제와 영국–이란 전쟁, 바브 운동과 아미르 카비르, 나세르 앗딘 샤와 담배 보이콧, 카자르 입헌 혁명,
#   디리야의 이라크·히자즈 원정과 이집트–와하브 전쟁, 제2차 사우디 국가와 라시드 가문의 하일, 오스만의 알하사 점령과 네지드의 몰락, 압둘아지즈의 리야드 탈환·알하사 정복·다린 조약,
#   프랑스의 이집트·시리아 원정, 무함마드 알리의 집권과 시리아·수단 원정과 두 차례 이집트–오스만 전쟁, 수에즈 운하와 이스마일의 부채, 우라비 혁명과 영국의 점령·보호국 선포,
#   마흐무트 2세·탄지마트·미드하트 파샤와 압뒬하미트 2세, 레바논 산의 내전과 무타사리피야, 걸프의 일반 해양 조약과 영구 해상 휴전·바레인·카타르·쿠웨이트·오만과 잔지바르의 분리,
#   영국의 아덴 점령·아덴 보호령, 오스만의 예멘 재정복과 카심 왕조의 끝·이맘 야흐야와 다안 조약·아시르의 이드리스, 미국–트리폴리 전쟁과 카라만리 왕조·이탈리아의 리비아 침공,
#   프랑스의 알제 점령·압델카데르와 알제리 정복·식민 정착과 무크라니 봉기·사하라 진출, 튀니스의 개혁과 파산·바르도 조약, 이슬리 전투와 스페인–모로코 전쟁·페스 조약과 보호령, 스페인령 사하라,
#   1차 대전의 중동 전선과 후세인–맥마흔 서한·아랍 반란·사이크스–피코 협정·밸푸어 선언(1918년 10월 다마스쿠스·알레포 입성까지).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1798~1918년 지도에서 생기거나 끝난 항목과 1만 km²(주변 등급 땅은 5만 km²)를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   주변 등급 땅(서사하라 해안)의 일은 개관 분량으로 썼다. 긴 과정은 한 사건에 여러 나라를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 이 시대 서아시아와 직접 닿는 한국 항목은 없어 subjects로 잇지 않았다. 유럽 파일의 나폴레옹의 집권·러시아의 조지아 병합·그리스 독립 전쟁·크림 전쟁·베를린 회의·아프리카 분할·그레이트 게임·
#   영국-프랑스 협상·영러 협상·청년 튀르크 혁명·발칸 전쟁·갈리폴리 전투는 다시 쓰지 않고 「제목」으로 가리켰다. 1918년 10월 30일 무드로스 휴전 뒤의 점령 행정은 다루지 않는다.
# 날짜: 그레고리력이다. 히즈라력 날짜는 양력 해로 바꾸어 적었고 확실하지 않은 날짜는 '무렵'으로 적었다. 사료마다 해가 갈리는 일은 갈린다고 밝혔다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서의 굳은 표기(무함마드·칼리프)를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며, 오스만 인물은 튀르크식(마흐무트·압뒬하미트),
#   지명은 지금도 쓰는 이름은 지금 나라 말(이스파한·타브리즈·알제·튀니스), 옛 도시는 굳은 표기. 나라 이름은 항목 이름을 따랐다. 같은 이름이 둘인 사람은 구별어를 붙였다(오만의 파이살 빈 투르키와 사우디의 파이살 빈 투르키).
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   병력·사상자·인구는 범위와 '추산'으로 적었다. 피정복민·소수자와 종파 서술은 한쪽 입장만 따르지 않고 사실과 주장을 구분했다.

- id: qajar-fath-ali-1797
  year: 1797
  endYear: 1813
  title:
    ko: "아가 무함마드 칸의 암살과 파트흐 알리 샤, 1차 러시아–이란 전쟁과 굴리스탄 조약(1797~1813)"
  summary:
    ko: "카자르 왕조의 첫 샤 아가 무함마드 칸은 1797년 6월 카라바흐의 슈샤에서 두 번째 조지아 원정 중 하인들에게 암살되었다(「아가 무함마드 칸과 카자르 왕조의 성립(1779~1796)」, 앞의 사건). 거세당해 아들이 없던 그의 자리는 조카 바바 칸이 군 지휘관 사데크 칸 샤카키와 이복 숙부 알리 콜리 칸 같은 경쟁자를 누르고 이어, 1797년 파트흐 알리 샤로 즉위해 1798년 3월 테헤란에서 대관했다(재위 1797~1834). 그는 맏이가 아닌 아들 아바스 미르자를 1799년 무렵 후계자로 삼아 타브리즈에서 유럽식 훈련을 받는 새 군대(니잠 제디드)를 키우게 했다. 아바스 미르자는 타브리즈에 무기 공장과 인쇄소를 두고 1811년 학생들을 영국에 유학 보냈다. 러시아가 1801년 카르틀리-카헤티 왕국을 합치자(「러시아의 조지아 병합」, 뒤의 사건) 이란은 조지아에 대한 종주권을 잃지 않으려 했고, 1804년 러시아군이 간자 칸국을 점령하면서 러시아–이란 전쟁(1804~1813)이 시작되었다. 이란은 나폴레옹의 프랑스와 핀켄슈타인 조약(1807)을, 영국과 예비 조약(1809)·확정 조약(1812)을 맺어 도움을 구했으나, 두 나라 모두 러시아와의 관계 때문에 이란을 위해 싸워 주지 않았다. 1812년 10월 아슬란두즈 전투에서 크게 진 이란은 1813년 10월 굴리스탄 조약을 맺었다(영국 사절 오즐리의 중재로 카라바흐의 굴리스탄 마을에서 서명했다). 조약으로 이란은 조지아와 다게스탄, 간자·카라바흐·시르반·바쿠 같은 북부 칸국들을 러시아에 내주었고 카스피해에서 러시아 군함만 다닐 수 있게 되었으며, 러시아는 아바스 미르자를 후계자로 지지하기로 했다. 이 패배는 부족 기병에 기대는 카자르 군대와 개혁의 한계를 드러냈고, 이란은 이를 바로잡으려다 다시 전쟁으로 나아갔다(「2차 러시아–이란 전쟁과 투르크만차이 조약(1826~1828)」, 뒤의 사건)."
  subjects: [qajar-iran, kartli-kakheti, russia, uk, france]
  links:
    - { from: qajar-iran, to: russia, note: "굴리스탄 조약으로 조지아·다게스탄·북부 칸국 할양 (1813)" }
  tags: [politics, war, diplomacy]
  sources: ["Muriel Atkin, Russia and Iran, 1780–1828 (University of Minnesota Press, 1980)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)", "Abbas Amanat, Pivot of the Universe: Nasir al-Din Shah Qajar and the Iranian Monarchy, 1831–1896 (University of California Press, 1997)"]

- id: diriyah-hejaz-1797
  year: 1797
  endYear: 1811
  title:
    ko: "디리야의 이라크·히자즈 원정: 카르발라 습격과 메카 점령(1797~1811)"
  summary:
    ko: "디리야 토후국은 1790년대 말 압둘아지즈 이븐 무함마드(재위 1765~1803)와 아들 사우드 아래 오아시스 국가에서 아라비아 대부분에 영향을 미치는 나라로 커졌다(「디리야의 사우드 가문과 무함마드 이븐 압드 알와하브의 동맹, 팽창(1744~1795)」, 앞의 사건). 이 나라의 군대는 1790년대 말부터 이라크 남부 변경과 시리아 사막, 걸프와 오만 해안의 부족들을 습격하고 자카트를 거두었다. 1802년 4월(아랍 사료와 필비의 연대이며 유럽 동양학자와 이란니카는 1801년으로 둔다)에는 시아파의 성지 카르발라를 쳐서 이맘 후사인 성소를 약탈하고 돔을 부수고 주민을 죽였다(사망자는 사료마다 달라 2천~5천 명 사이로 갈린다). 와하브 쪽은 묘 숭배를 다신 숭배에 가까운 행위로 보았고, 시아파와 수니파의 학자들은 이를 약탈과 학살로 보아 오스만 쪽의 반발이 커졌다. 같은 1802년 타이프를 차지한 사우드는 1803년 메카에 들어갔다. 와하브 군이 4월 메카로 진군하자 샤리프 갈리브는 제다로 피했고 그의 대리인이 도시를 넘겼으며, 갈리브는 뒤에 와하브의 종주를 받아들이는 조건으로 샤리프 자리를 이어 갔다고 전한다. 와하브 군은 묘 위의 건축을 허물고 담배와 음악을 금했으며, 1804~1805년 사이(브리태니커는 1804년, 아랍 사료는 1805년)에는 메디나도 차지했다. 1803년 11월 압둘아지즈가 디리야에서 쿠르드 출신 수행자에게 암살되자 사우드가 이맘이 되어 정복을 이었다. 걸프의 바레인과 오만 해안 족장들에게도 조공이 요구되었고 시아파와 수니파 학자들은 성지 장악에 항의했다. 1805년 무렵부터 1807년 사이에는 시리아와 이집트에서 오는 공식 순례 행렬이 성지에 들어가지 못했고, 두 성지를 지킨다는 오스만 술탄의 권위는 크게 흔들렸다. 술탄은 이집트 총독 무함마드 알리에게 히자즈 수복을 맡겼고 1811년 이집트군이 움직였다(「이집트–와하브 전쟁과 디리야의 함락(1811~1818)」, 뒤의 사건)."
