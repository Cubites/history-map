- id: abdelkader-1832
  year: 1832
  endYear: 1847
  title:
    ko: "압델카데르의 저항과 프랑스의 알제리 정복(1832~1847)"
  summary:
    ko: "알제 점령 뒤에도 프랑스군은 항구 몇 곳만 쥐었고 내륙은 부족과 수피 교단이 다스렸다. 카디리야 교단 지도자 가문의 압델카데르는 1832년 11월 마스카라 둘레 부족들에게 아미르로 추대되어 지하드를 내세워 서부를 하나로 묶었다. 프랑스는 데미슈엘 협정(1834)으로 그의 권위를 인정했다가 1835년 마크타에서 졌고, 1837년 5월 타프나 조약으로 오랑 지방 안쪽과 티테리를 그의 땅으로 다시 인정했다. 압델카데르는 정규 보병과 세금 제도를 갖추고 이동 수도 스말라를 두어 국가의 꼴을 만들었다. 프랑스는 1837년 10월 콘스탄틴을 함락해 동부의 아흐마드 베이를 몰아냈고, 1839년 가을 '철문' 협곡을 지나간 일을 압델카데르가 조약 위반으로 보아 11월 전쟁이 다시 일어났다. 1840년 말 총독에 지명되어 1841년 초 부임한 뷔조는 곡식밭과 가축을 불태우는 습격(라지아)과 병력 분산 작전으로 전쟁을 바꾸었다. 이 과정에서 민간인과 부족 전체가 굶주림과 학살을 입었다. 1843년 5월 오말 공작의 부대가 이동 수도 스말라를 급습하자 압델카데르는 모로코로 물러났다(「이슬리 전투와 스페인–모로코 전쟁(1844~1860)」, 뒤의 사건). 1845년 6월 다흐라의 동굴에서는 펠리시에 대령의 부대가 피신한 오울라드 리아 부족민을 연기로 질식시켰다(사망자는 5백~1천2백 명 안팎으로 자료마다 갈리며 높은 쪽은 알제리 쪽 추산이다). 같은 해 9월 시디브라힘에서 프랑스 기병대를 무찔렀으나 모로코의 지원이 끊겨 1847년 12월 항복했다. 그는 알렉산드리아나 아크레로 가게 해 주겠다는 약속과 달리 프랑스에 갇혔다. 프랑스군 병력은 뷔조가 부임하던 무렵 약 6만 명에서 1847년 10만 명을 넘는 규모(약 10만 9천 명)로 늘어 있었다. 정복 뒤 첫 수십 년 동안 전쟁·기근·질병으로 알제리인 50만~100만 명이 죽었다는 추산이 있으나(당시 인구 약 300만) 규모는 연구자마다 다르다."
  subjects: [abdelkader-emirate, french-algeria, france]
  links:
    - { from: french-algeria, to: abdelkader-emirate, note: "압델카데르 토후국 정복, 항복 (1843~1847)" }
  tags: [war, politics, religion]
  sources: ["Charles-Robert Ageron, Modern Algeria: A History from 1830 to the Present (Michael Brett 옮김, Hurst, 1991)", "Jennifer E. Sessions, By Sword and Plow: France and the Conquest of Algeria (Cornell University Press, 2011)", "Julia A. Clancy-Smith, Rebel and Saint: Muslim Notables, Populist Protest, Colonial Encounters (Algeria and Tunisia, 1800–1904) (University of California Press, 1994)"]
