- id: karamanli-1801
  year: 1801
  endYear: 1835
  title:
    ko: "카라만리 트리폴리: 미국과의 전쟁, 페잔 병합, 오스만의 직접 통치(1801~1835)"
  summary:
    ko: "트리폴리의 파샤 유수프 카라만리(재위 1795~1832)는 1793년 알리 부르굴(알리 파샤)이 형 하메트를 쫓아내자 1795년 하메트와 함께 돌아와 튀니스의 도움으로 트리폴리를 되찾은 뒤 하메트마저 알렉산드리아로 추방하고 권력을 잡아, 지중해를 오가는 배에 조공을 받는 방식으로 재정을 꾸렸다(「오스만 아래 세습 정권의 성립: 튀니스의 후사인 왕조와 트리폴리의 카라만리 왕조(1705~1711)」, 앞의 사건). 1801년 5월 그는 미국에 더 많은 조공을 요구하며 영사관의 깃대를 잘라 사실상 전쟁을 선포했고, 미국–트리폴리 전쟁(1801~1805)이 일어났다. 미국 해군은 트리폴리를 봉쇄했으나 1803년 10월 프리깃함 필라델피아호가 좌초해 승무원이 포로가 되었고, 1804년 2월 데커터가 그 배를 불태웠다. 1805년 4월 미국 외교관 이턴과 유수프의 형 하메트가 이집트에서 이끈 용병·해병대가 항구 데르나를 차지하자 유수프는 협상에 나섰고, 6월 평화 조약을 맺어 포로 몸값을 받는 대신 미국의 조공 요구를 접었다. 안으로는 사하라 대상 무역과 노예 무역의 관문이던 페잔을 눌렀다. 페잔의 아울라드 무함마드 술탄 정권(1550년 무렵~)은 1811~1813년 사이 트리폴리군에게 무너졌고 트리폴리가 페잔을 직접 다스렸다. 그러나 유럽의 해적 단속과 노예·해적 수입의 감소, 영국·프랑스 영사에게 진 빚, 세금 부담 속에서 주민 반란이 이어졌다. 1832년 유수프가 아들 알리 2세에게 자리를 넘기자 후계 다툼이 일어났고, 오스만 정부는 1835년 5월 함대를 보내 알리를 물러나게 한 뒤 트리폴리를 직접 다스렸다. 이로써 카라만리 왕조가 끝났다. 1830년 프랑스의 알제 점령 소식은 오스만이 서쪽 속령을 서둘러 거두게 한 이유 가운데 하나로 꼽힌다(「프랑스의 알제 점령(1827~1830)」, 뒤의 사건)."
  subjects: [karamanli-tripolitania, fezzan-sultanate, usa, ottoman]
  links:
