- id: tunisia-reform-1837
  year: 1837
  endYear: 1869
  title:
    ko: "아흐마드 베이의 개혁과 튀니스의 기본 협약·헌법, 파산(1837~1869)"
  summary:
    ko: "후사인 왕조의 아흐마드 베이(재위 1837~1855)는 무함마드 알리의 이집트를 본보기로 서양식 군대와 관청으로 나라를 키우려 했다. 그는 1840년 바르도에 군사 학교를 열고 징병제를 도입했으며 1846년 노예제 폐지를 선포했다. 같은 해 그는 프랑스를 찾아 루이 필리프를 만났다. 오스만 술탄은 튀니스에 종주권을 주장했으나 실제 지배는 하지 못했고, 베이는 사절과 선물로 관계를 이어 갔다. 그러나 군대와 궁정 비용을 대려 세금을 늘려 농민과 유목민의 부담이 커졌다. 아흐마드 뒤를 이은 무함마드 베이(재위 1855~1859)는 1857년 9월 영국·프랑스 영사의 압력 속에서 '기본 협약'을 발표해 종교와 상관없이 신민의 법 앞의 평등과 재산·상업의 자유를 인정했고, 외국인의 토지 소유 길도 열었다. 이어 무함마드 앗사디크 베이(재위 1859~1882)는 1861년 4월 아랍 세계에서 가장 이른 성문 헌법을 선포해 베이의 권한을 대의 회의(대평의회)로 제한하려 했다. 그 뒤 총리 무스타파 하즈나다르(재임 1855~1873) 같은 대신들이 정부를 쥔 채 재정은 나빠졌다. 1863년 유럽 은행에서 불리한 조건으로 빌린 차관이 늘었고 1864년 세금을 두 배로 올리자 알리 벤 가다함이 이끄는 부족 반란이 일어났다. 헌법은 반란이 번지던 1864년 4월 정지되었고 반란은 이듬해 진압되었다. 1867~1869년의 기근과 콜레라, 차관 상환 불능으로 1869년 튀니스는 파산을 선언했고 프랑스·영국·이탈리아가 참여한 국제 재정 위원회가 세입을 관리하게 되었다. 이는 튀니스가 유럽 채권국의 감독을 받게 되는 첫걸음이었다(「프랑스의 튀니지 점령과 바르도 조약(1878~1883)」, 뒤의 사건)."
  subjects: [husainid-tunisia, ottoman, france, uk]
  links: []
  tags: [politics, economy, society]
  sources: ["L. Carl Brown, The Tunisia of Ahmad Bey, 1837–1855 (Princeton University Press, 1974)", "Kenneth J. Perkins, A History of Modern Tunisia (Cambridge University Press, 2004)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]

- id: aden-1839
  year: 1839
  endYear: 1886
  title:
    ko: "영국의 아덴 점령과 아덴 보호령(1839~1886)"
  summary:
    ko: "아덴은 라헤즈 술탄국의 압달리 가문이 다스리던 항구였다(「카심 이맘국의 전성기와 모카 커피 무역, 라헤즈 술탄국의 자립(1636~1728)」, 앞의 사건). 영국령 인도 정부는 증기선이 인도와 이집트를 오가려면 홍해 입구에 석탄 보급 항구가 필요하다고 보아 해군 장교 헤인스를 보냈다. 1837년 인도 배가 아덴 앞바다에서 난파해 약탈당한 일을 구실로 영국은 술탄 무신 빈 파들에게 항구를 사거나 빌리자고 요구했고, 협상이 틀어지자 1839년 1월 18~19일 군함과 인도 병사를 보내 아덴을 점령했다. 영국은 술탄에게 해마다 연금을 주기로 했다. 술탄 무신은 1839년 11월과 1840년 5월·7월 세 차례 아덴을 되찾으려다 실패했고(11월 시도 뒤 영국이 연금 지급을 중단했다), 1843년 화의를 청해 1844년 2월 연금이 복원되었다. 점령 때 어촌이나 다름없던 아덴은 1870년대에 약 2만 명(추산)의 항구 도시가 되었고 영국은 1857년 홍해 입구의 페림섬도 차지했다. 아덴은 1850년 자유항이 되었고 1869년 수에즈 운하가 열리자 급성장했으며, 봄베이 총독부 아래의 영국령 인도의 한 부분으로 다스려졌다. 영국은 항구의 안전과 식수·식량 공급을 위해 둘레의 술탄·아미르들과 우호 조약을 맺었다. 예멘의 오스만은 1873년 이후 북쪽 달라 쪽으로 세력을 뻗어 영국과 분쟁했다(「오스만의 예멘 재정복과 카심 왕조의 끝(1849~1872)」, 뒤의 사건). 영국은 1880년대에 조약을 정식 보호 관계로 바꾸었고, 마흐라 술탄국과 소코트라섬과 맺은 1886년의 보호 조약이 그 첫 줄로 꼽힌다. 이로써 아덴 둘레에 아덴 보호령이 이루어졌다. 아덴은 영국에는 제국 항로의 거점이었지만, 내륙의 술탄국들은 영국이 외교와 방위를 맡는 대신 안으로는 자치를 이어 갔다."
  subjects: [aden-protectorate, lahej-sultanate, uk, ottoman, company-india]
  links: []
  tags: [politics, diplomacy, economy]
  sources: ["R. J. Gavin, Aden under British Rule, 1839–1967 (C. Hurst, 1975)", "Gordon Waterfield, Sultans of Aden (John Murray, 1968)", "Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)"]

- id: lebanon-1840
  year: 1840
  endYear: 1861
  title:
    ko: "레바논 산의 내전과 무타사리피야(1840~1861)"
  summary:
    ko: "레바논 산은 마론파와 드루즈가 섞여 사는 산악 지역으로, 시하브 가문의 아미르가 오스만의 징세 청부를 맡아 다스렸다. 아미르 바시르 2세(재위 1788~1840)는 이브라힘 파샤의 시리아 점령에 협력했으나, 이집트의 징병과 무기 몰수에 마론파와 드루즈가 모두 반발해 1840년 봉기가 일어났다(「수단 정복과 두 차례 이집트–오스만 전쟁(1820~1841)」, 앞의 사건). 영국·오스트리아 함대가 베이루트를 포격하자 바시르는 항복해 몰타로 보내졌다. 오스만은 시하브 가문의 바시르 3세(1840~1842)를 폐위하고 직접 통치하려 했으나 열강의 요구로 1842년 12월 산을 북쪽 마론파 지역과 남쪽 드루즈 지역으로 나누어 각각 부총독(카이마캄)에 맡겼다. 두 공동체가 섞여 사는 곳에서는 1841년과 1845년 충돌이 이어졌다. 1858년 카스라완에서는 마론파 농민이 같은 마론파 영주의 특권에 맞서 봉기했고, 이 사회 갈등은 드루즈 영주와 마론파 농민의 충돌로 번졌다. 1860년 5월부터 산 곳곳에서 마론파와 드루즈가 서로 마을을 공격했고 마론파 민간인 수천 명이 죽었으며(그리스도교도 사망자는 7천~1만 2천 명 안팎으로 추산이 갈리고 드루즈 쪽에도 사망자가 많았다) 오스만 관리가 이를 막지 않았다는 비난이 있었다. 7월에는 다마스쿠스에서 군중이 그리스도교 구역을 습격해 수천 명이 죽었고(3천~6천 명 추산) 이때 압델카데르가 많은 그리스도교도를 보호했다. 오스만 외무 장관 푸아드 파샤는 일부 관리와 드루즈 지도자를 처형했고, 프랑스는 1860년 8월 약 6천 명을 보냈다. 1861년 6월 열강과 오스만이 합의한 규정으로 레바논 산은 열강이 보장하는 자치 지역(무타사리피야)이 되어, 오스만이 임명하는 레바논 밖 출신 가톨릭 그리스도교도 총독(무타사리프)과 종파별 대표로 구성된 행정 회의가 다스렸다."
  subjects: [ottoman, muhammad-ali-egypt, france, uk]
  links: []
  tags: [politics, society, religion]
  sources: ["Leila Tarazi Fawaz, An Occasion for War: Civil Conflict in Lebanon and Damascus in 1860 (University of California Press, 1994)", "Ussama Makdisi, The Culture of Sectarianism: Community, History, and Violence in Nineteenth-Century Ottoman Lebanon (University of California Press, 2000)", "Engin Akarlı, The Long Peace: Ottoman Lebanon, 1861–1920 (University of California Press, 1993)"]

- id: bab-1844
  year: 1844
  endYear: 1863
  title:
    ko: "바브 운동과 바하이 신앙의 시작, 아미르 카비르의 개혁(1844~1863)"
  summary:
    ko: "1844년 5월 시라즈에서 젊은 상인 사이이드 알리 무함마드가 열두 번째 이맘을 가리키는 '문(바브)'이라고 선언하고, 첫 제자 18명을 모아 새 가르침을 폈다. 그는 이슬람 법을 새 계시로 고쳐야 한다고 가르쳤고 1848년 무렵에는 스스로 기다리던 마흐디임을 밝혔다. 울라마는 이를 이단이라 보아 탄압했고, 바브는 이스파한을 거쳐 아제르바이잔의 마쿠와 치리크 성채에 갇혔다. 1848년 6~7월 바다슈트 집회에서는 시인 타히레가 베일을 벗고 설교해 옛 법을 버릴지를 두고 신자들 사이에 논란이 일었다. 1848~1851년 마잔다란의 셰이크 타바르시 사당, 니리즈, 잔잔에서 바브 신자들의 무장 봉기가 일어나 정부군과 싸우다 수천 명이 죽었다(신자들은 방어였다고 했고 정부는 반란으로 보았다). 1848년 9월 열일곱 살의 나세르 앗딘 샤가 카자르 왕조의 샤로 즉위해 총리 아미르 카비르(미르자 타키 칸)에게 정치를 맡겼다. 아미르 카비르는 궁정 비용을 줄이고 관리의 부패를 단속했으며 근대 학교 다르 알푸눈을 세웠으나(개교는 그가 해임된 뒤였다), 바브를 1850년 7월 타브리즈에서 총살하게 했다. 그는 궁정의 반대 세력의 압력으로 1851년 11월 해임되었고 1852년 1월 카샨에서 살해되었다. 1852년 8월 바브 신자 몇 명이 샤를 저격하려다 실패하자 신자들에 대한 대대적인 처형이 일어나 시인이자 신학자 타히레도 죽었다. 신자 가운데 미르자 후세인 알리 누리(바하올라)는 1853년 바그다드로 추방되었고, 1863년 바브가 예고한 인물이라고 선언해 바하이 신앙을 열었다. 같은 1863년 그는 오스만 정부의 명령으로 이스탄불로 옮겨 가야 했다."
  subjects: [qajar-iran]
  links: []
  tags: [religion, politics, society]
  sources: ["Abbas Amanat, Resurrection and Renewal: The Making of the Babi Movement in Iran, 1844–1850 (Cornell University Press, 1989)", "Moojan Momen, The Babi and Baha'i Religions, 1844–1944: Some Contemporary Western Accounts (George Ronald, 1981)", "Abbas Amanat, Pivot of the Universe: Nasir al-Din Shah Qajar and the Iranian Monarchy, 1831–1896 (University of California Press, 1997)"]

- id: morocco-isly-1844
  year: 1844
  endYear: 1860
  title:
    ko: "이슬리 전투와 스페인–모로코 전쟁(1844~1860)"
  summary:
    ko: "알제리를 정복하던 프랑스는 모로코의 술탄 압드 알라흐만(재위 1822~1859)이 압델카데르를 돕는다고 보았다(「압델카데르의 저항과 프랑스의 알제리 정복(1832~1847)」, 앞의 사건). 1844년 8월 프랑스 함대가 탕헤르(6일)와 모가도르(15일)를 포격했고, 8월 14일 뷔조가 이끈 프랑스군이 우지다 가까운 이슬리강 가에서 수가 훨씬 많은 모로코군을 무찔렀다. 1844년 9월 탕헤르 조약과 1845년 3월 랄라마그니아 조약으로 술탄은 압델카데르를 법의 보호 밖에 두기로 했고 국경은 일부만 정해졌다. 이 패배는 모로코 군대의 약점을 드러냈다. 영국은 1856년 12월 모로코와 통상 조약을 맺어 관세를 낮추고 독점을 없애며 영국 상인에게 치외 법권을 얻었다. 1859년 10월 스페인은 세우타 둘레의 경계 분쟁을 구실로 새 술탄 무함마드 4세(재위 1859~1873)의 모로코에 선전 포고했다. 오도넬 장군이 이끈 스페인군은 1860년 1월 카스티예호스 싸움을 거쳐 2월 테투안을 차지했고 3월 와드라스에서 모로코군을 이겼다. 스페인군 사망자의 대부분은 전투가 아니라 콜레라 같은 질병 때문이었다고 전한다. 1860년 4월 와드라스 조약으로 모로코는 막대한 배상금(2천만 두로, 약 1억 페세타)을 물고 대서양 쪽 어업 거점을 스페인에 주기로 했다. 배상금은 영국 은행에서 빌린 돈으로 치렀고 모로코는 관세 수입 일부를 담보로 내놓아 재정을 유럽 채권자에게 기대게 되었다. 스페인군은 배상금을 모두 받을 때까지 테투안에 머물렀다. 이후 술탄들은 유럽 교관을 불러 군대를 고치려 했으나, 유럽 영사가 모로코인 협력자에게 치외 법권을 주는 '보호민' 제도가 늘어 세금 수입과 주권이 줄었다."
  subjects: [alaouite-morocco, abdelkader-emirate, french-algeria, france, spain, uk]
  links:
    - { from: spain, to: alaouite-morocco, note: "스페인–모로코 전쟁, 테투안 점령 (1859~1860)" }
  tags: [war, diplomacy, politics]
  sources: ["Edmund Burke III, Prelude to Protectorate in Morocco: Precolonial Protest and Resistance, 1860–1912 (University of Chicago Press, 1976)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Susan Gilson Miller, A History of Modern Morocco (Cambridge University Press, 2013)"]

- id: nasir-din-1848
  year: 1848
  endYear: 1896
  title:
    ko: "나세르 앗딘 샤의 통치와 담배 보이콧(1848~1896)"
  summary:
    ko: "카자르 왕조의 나세르 앗딘 샤(재위 1848~1896)는 열일곱 살에 즉위해 처음에는 총리 아미르 카비르의 개혁을 지지했으나 1851년 그를 해임하고 이듬해 죽게 했다(「바브 운동과 바하이 신앙의 시작, 아미르 카비르의 개혁(1844~1863)」, 앞의 사건). 그의 치세에 이란은 전신선과 근대 학교, 서양식 군대(1879년 러시아 장교가 이끄는 카자크 여단)를 들였고 샤는 1873·1878·1889년 유럽을 방문했다. 1869~1872년 흉작과 기근으로 많은 사람이 죽었다(사망자는 수십만 명에서 백만 명 이상까지 추산이 갈린다). 국가 재정이 모자라자 샤는 이권을 외국인에게 팔았다. 1872년 영국인 로이터 남작에게 철도·광산·은행 사업을 70년간 맡기는 이권을 주었으나 러시아와 울라마가 반발해 이듬해 취소했다. 1890년 3월 영국인 탤벗 소령에게 담배의 생산·판매·수출을 50년간 맡기는 독점권을 주자 상인과 울라마가 반대하는 운동이 일어났다. 1891년 12월 시아파의 최고 법학자 미르자 하산 시라지가 이라크 사마라에서 담배 사용을 금하는 법적 의견(파트와)을 내자, 궁정 안 여인들까지 담배를 끊었다고 전할 만큼 보이콧이 널리 퍼졌다. 샤는 1892년 1월 이권을 취소했고 이란은 보상금 50만 파운드를 영국계 은행에서 빌려 처음으로 큰 외채를 졌다. 이 일은 상인(바자리)과 울라마가 정부에 맞서 힘을 합친 첫 큰 사례로, 뒤의 입헌 운동의 밑바탕이 되었다(「카자르 입헌 혁명과 1911년 러시아 최후통첩(1905~1911)」, 뒤의 사건). 1896년 5월 샤는 테헤란 근처 샤압둘아짐 성지에서 자말 앗딘 알아프가니의 제자 미르자 레자 케르마니에게 암살되었고 아들 무자파르 앗딘 샤가 뒤를 이었다."
  subjects: [qajar-iran, uk, russia]
  links: []
  tags: [politics, economy, society]
  sources: ["Nikki R. Keddie, Religion and Rebellion in Iran: The Tobacco Protest of 1891–1892 (Frank Cass, 1966)", "Abbas Amanat, Pivot of the Universe: Nasir al-Din Shah Qajar and the Iranian Monarchy, 1831–1896 (University of California Press, 1997)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)"]

- id: algeria-settlement-1848
  year: 1848
  endYear: 1871
  title:
    ko: "알제리 식민 정착과 크레미외 법령, 1871년 무크라니 봉기(1848~1871)"
  summary:
    ko: "1848년 헌법은 알제리를 프랑스 땅으로 선언하고 알제·오랑·콘스탄틴을 본토와 같은 도로 삼았다(「압델카데르의 저항과 프랑스의 알제리 정복(1832~1847)」, 앞의 사건). 정부는 파리의 실업자와 농민에게 땅을 주는 농업 식민지를 세웠고, 정착민은 무슬림 부족에게서 빼앗거나 몰수한 땅을 받았다. 정복도 계속되어 1849년 비스크라의 자아차 오아시스가 포위 끝에 허물어지고 1852년 라구아트가 함락되었으며, 1857년 랑동 원수가 카빌리 산악 지대를 정복해 여성 지도자 파트마 느수메르를 사로잡았다. 나폴레옹 3세는 1860년 알제리를 찾아 부족의 땅을 보호하겠다고 말했고 1863년 원로원 결의는 부족 땅의 처분을 막았으나, 정착민의 압력으로 효과는 제한되었다. 1865년 결의는 무슬림도 프랑스 시민이 될 수 있게 했지만 이슬람 신분법을 버려야 했으므로 신청자는 극소수였다. 1866~1868년 가뭄과 메뚜기, 콜레라가 겹쳐 대기근이 일어나 수십만 명이 죽었다(추산은 연구자마다 갈린다). 1870년 10월 크레미외 법령은 알제리의 유대인(약 3만 5천 명)에게 프랑스 시민권을 일괄 주었고 무슬림은 제외했다. 보불 전쟁으로 제2제정이 무너진 혼란 속에서 1871년 3월 카빌리의 유력자 무함마드 알무크라니가 반란을 일으켰고, 4월 라흐마니야 교단장 셰이크 아헤다드가 지하드를 선포하자 반란은 수십만 명 규모로 퍼졌다(참가자 수는 추산). 무크라니가 5월 전사하고 반란이 진압되자 프랑스는 가담한 부족의 땅 약 45만 헥타르를 몰수하고 막대한 벌금을 물렸다. 몰수한 땅은 알자스·로렌에서 온 이주민을 비롯한 정착민에게 넘어갔다."
  subjects: [french-algeria, france]
  links: []
  tags: [politics, society, war]
  sources: ["Charles-Robert Ageron, Modern Algeria: A History from 1830 to the Present (Michael Brett 옮김, Hurst, 1991)", "John Ruedy, Modern Algeria: The Origins and Development of a Nation (Indiana University Press, 1992)", "Julia A. Clancy-Smith, Rebel and Saint: Muslim Notables, Populist Protest, Colonial Encounters (Algeria and Tunisia, 1800–1904) (University of California Press, 1994)"]

- id: ottoman-yemen-1849
  year: 1849
  endYear: 1872
  title:
    ko: "오스만의 예멘 재정복과 카심 왕조의 끝(1849~1872)"
  summary:
    ko: "무함마드 알리의 이집트군이 물러난 뒤(「와하브·이집트의 티하마 점령과 카심 왕조의 쇠퇴(1803~1840)」, 앞의 사건) 예멘 해안에서는 오스만이 다시 힘을 뻗쳤다. 오스만은 1849년 호데이다를 비롯한 티하마를 되찾아 홍해 쪽 거점을 얻었고, 고지의 이맘들은 서로 다투며 힘이 약했다. 오스만군은 1849년 이후 사나까지 나아갔다가 부족 반란으로 물러나기를 되풀이했다. 해안과 남쪽 고지에 많은 샤피이파 주민은 비교적 오스만 행정을 받아들였으나 북쪽의 자이드파 부족은 저항했다. 이맘 자리를 두고 여러 후보가 겨루는 사이 부족 수장들이 세금과 무장 병력을 쥐었다. 1869년 수에즈 운하가 열려 홍해가 증기선의 주요 항로가 되자 오스만 정부에게 홍해 입구는 더 중요해졌고, 아덴을 쥔 영국과 맞서야 할 필요도 커졌다(「영국의 아덴 점령과 아덴 보호령(1839~1886)」, 앞의 사건). 1870년부터 오스만은 이집트에서 병력을 배로 실어 날라 예멘으로 보냈다. 1871년 오스만군이 아흐메트 무흐타르 파샤의 지휘 아래 홍해 연안으로 들어와 고지로 올라갔고 1872년 사나를 차지했다. 오스만은 이 땅을 예멘 주(빌라예트)로 편성해 사나를 도읍으로 삼았고, 초대 총독이 된 무흐타르 파샤(재임 1871~1873)는 주를 사나·호데이다·타이즈·아시르의 네 산작으로 나누었다. 카심 왕조의 이맘국은 사나를 잃어 이때 끝났다. 그러나 오스만의 지배는 주로 도시와 해안에 미쳤고 고지는 자이드파 이맘과 부족 수장이 사실상 다스렸다. 오스만의 세금과 징병, 새 법 제도는 고지 주민의 반발을 샀고 반란이 되풀이되었다(「이맘 야흐야의 반란과 다안 조약, 오스만 지배의 끝(1904~1918)」, 뒤의 사건)."
  subjects: [qasimid-state, ottoman, uk]
  links:
    - { from: ottoman, to: qasimid-state, note: "티하마 점령 (1849), 사나 점령 (1872)" }
  tags: [politics, war]
  sources: ["Thomas Kuehn, Empire, Islam, and Politics of Difference: Ottoman Rule in Yemen, 1849–1919 (Brill, 2011)", "Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "Robert W. Stookey, Yemen: The Politics of the Yemen Arab Republic (Westview Press, 1978)"]

- id: suez-1854
  year: 1854
  endYear: 1879
  title:
    ko: "수에즈 운하와 헤디브 이스마일의 부채(1854~1879)"
  summary:
    ko: "무함마드 알리 뒤 이집트는 아들 이브라힘 파샤(1848)와 손자 아바스 힐미 1세(재위 1848~1854)를 거쳐, 1854년 무함마드 알리의 넷째 아들 사이드 파샤(재위 1854~1863)가 총독이 되었다(「무함마드 알리의 집권과 맘루크 학살(1805~1811)」, 앞의 사건). 사이드의 친구였던 프랑스 외교관 페르디낭 드 레셉스는 1854년 11월 수에즈 운하 건설 특허를 얻었고, 1858년 세운 수에즈 운하 회사의 주식 가운데 이집트 정부가 큰 몫을 샀다. 1859년 4월 포트사이드에서 공사가 시작되었다. 공사 초기에는 이집트 농민이 의무 노역(코르베)으로 동원되었고 사망자는 1천~3천 명 안팎이라는 연구부터 뒷날 이집트 대통령 나세르가 든 12만 명까지 크게 갈린다. 영국은 노역을 비판하며 오스만 술탄을 통해 압력을 넣었고 1864년 프랑스 황제 나폴레옹 3세의 중재로 이집트는 회사에 8천 4백만 프랑을 배상하며 노역을 줄이게 되었다. 운하는 1869년 11월 열렸다. 이스마일 파샤(재위 1863~1879)는 1866~1867년 술탄에게 큰 공납을 바치고 장자 상속과 '헤디브' 칭호를 얻었다. 미국 남북 전쟁 때의 면화 호황이 끝난 뒤에도 그는 철도·항구·카이로 도심 건설과 수단·에티오피아 원정에 거액을 썼고, 유럽 은행에서 불리한 조건으로 빌린 빚이 1876년 약 9천만 파운드(추산)에 이르렀다. 1875년 11월 영국은 이스마일이 내놓은 운하 회사 주식을 약 4백만 파운드에 샀다(「아프리카 분할과 베를린 서아프리카 회의」, 뒤의 사건). 1876년 유럽 채권국이 공채 기금을 세우고 영국·프랑스 통제관이 재정을 맡는 이중 통제가 시작되었으며, 1878년에는 유럽인 장관이 든 내각이 들어섰다. 이스마일은 1879년 4월 이를 물리치려다 6월 오스만 술탄에게 폐위되었고 아들 테피크가 헤디브가 되었다."
  subjects: [muhammad-ali-egypt, ottoman, france, uk]
  links: []
  tags: [economy, politics, diplomacy]
  sources: ["Zachary Karabell, Parting the Desert: The Creation of the Suez Canal (Alfred A. Knopf, 2003)", "David S. Landes, Bankers and Pashas: International Finance and Economic Imperialism in Egypt (Harvard University Press, 1958)", "The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)"]

- id: oman-zanzibar-1856
  year: 1856
  endYear: 1891
  title:
    ko: "사이드 빈 술탄의 죽음과 오만·잔지바르의 분리, 영국의 배타 협정(1856~1891)"
  summary:
    ko: "사이드 빈 술탄(재위 1804~1856)은 무스카트와 동아프리카 잔지바르를 오가며 정향 농장과 인도양 무역으로 바다 제국을 이루고 1840년 무렵 궁정을 잔지바르로 옮겼으나, 1856년 죽자 아들들이 나라를 둘로 나누었다(「페르시아의 오만 침공과 아흐마드 빈 사이드, 부사이드 왕조(1737~1749)」, 앞의 사건). 투와이니 빈 사이드는 무스카트와 오만(재위 1856~1866)을, 마지드는 잔지바르(재위 1856~1870)를 맡았다. 투와이니가 1859년 잔지바르를 치려 하자 영국 해군이 막았고, 인도 총독 캐닝의 1861년 판정으로 두 술탄국이 갈라져 잔지바르가 오만에 해마다 보조금을 주기로 했다. 영국과 프랑스는 1862년 3월 두 나라의 독립을 함께 존중한다고 선언했다. 오만에서는 투와이니가 1866년 아들 살림에게 살해되었고 살림은 1868년 이바드파 이맘 아잔 빈 카이스에게 쫓겨났다. 영국은 아잔을 인정하지 않았고, 투르키 빈 사이드(재위 1871~1888)가 영국의 도움을 받아 1871년 무스카트를 되찾았다. 이후 오만 술탄은 영국령 인도의 보조금에 재정을 기대었다. 1879년 투르키는 도파르의 살랄라를 차지했다. 그곳은 인도 말라바르 출신 성직자 파들 빈 알라위가 오스만의 이름으로 다스리다가 주민 반란으로 쫓겨난 땅이었고, 현지 족장들이 무스카트에 도움을 청했다. 오만 술탄 파이살 빈 투르키(재위 1888~1913, 사우디의 파이살 빈 투르키와 다른 사람)는 1891년 3월 영국과 배타 협정을 맺어 영국의 동의 없이 땅을 넘기거나 팔지 않기로 했다. 해안 상인과 내륙 이바드파 부족 사이의 거리가 멀어진 것도 이 시기의 변화였다."
  subjects: [busaid-oman, oman, uk, france]
  links: []
  tags: [politics, diplomacy, economy]
  sources: ["J. C. Wilkinson, The Imamate Tradition of Oman (Cambridge University Press, 1987)", "Reda Bhacker, Trade and Empire in Muscat and Zanzibar: Roots of British Domination (Routledge, 1992)", "J. G. Lorimer, Gazetteer of the Persian Gulf, Oman, and Central Arabia (Superintendent Government Printing, 1908~1915)"]

- id: ottoman-hasa-1865
  year: 1865
  endYear: 1891
  title:
    ko: "사우드 가문의 분열, 오스만의 알하사 점령과 네지드 토후국의 몰락(1865~1891)"
  summary:
    ko: "1865년 12월 파이살 빈 투르키가 죽자 맏아들 압둘라와 동생 사우드가 이맘 자리를 두고 싸웠고 오아시스 도시와 부족들이 편을 갈랐다(「제2차 사우디 국가: 투르키와 파이살, 이집트 점령(1824~1865)」, 앞의 사건). 압둘라가 오스만에 도움을 청한 것을 계기로 바그다드 총독 미드하트 파샤가 1871년 군을 바닷길로 보내 알하사를 차지했고, 이곳은 오스만 제국의 한 산작이 되었다. 같은 원정으로 카티프와 카타르 쪽도 오스만의 영향 아래 들어갔다(「카타르: 1868년 협정과 오스만의 지배, 영국과의 1916년 조약(1868~1916)」, 뒤의 사건). 사우드와 압둘라는 리야드를 번갈아 쥐었고(1871~1873년 압둘라, 1873~1875년 사우드), 1875년 압둘라흐만이 잠시 이맘을 칭한 뒤 1876년 압둘라가 돌아왔으나 형제와 조카들 사이의 싸움은 그치지 않았다. 이 틈에 자발 샴마르 토후국을 이끄는 하일의 무함마드 빈 라시드(재위 1869~1897)가 힘을 키워 영향권이 자우프와 팔미라 쪽까지 닿았다. 하일은 이라크와 시리아를 잇는 대상로에 걸쳐 있어 통행세와 보호비로 재정을 꾸렸다. 1887년 사우드 빈 파이살의 아들 무함마드가 숙부 압둘라를 가두자 무함마드 빈 라시드가 개입해 리야드를 차지하고 압둘라와 압둘라흐만을 하일로 데려갔으며, 리야드는 라시드 가문이 보낸 총독이 다스리게 되었다. 압둘라가 죽은 1889년 아우 압둘라흐만이 리야드에서 이맘을 칭했으나, 1891년 1월 물라이다 전투에서 라시드 군에게 크게 졌다. 압둘라흐만과 아들 압둘아지즈(이븐 사우드)를 비롯한 사우드 가문은 리야드를 잃고 쿠웨이트로 망명했다. 이로써 제2차 사우디 국가는 끝났고 라시드 가문은 네지드 대부분을 아우르게 되었다. 알하사의 오스만 지배는 이후 오래 이어졌다(「압둘아지즈의 리야드 탈환과 네지드의 재건(1902~1915)」, 뒤의 사건). 망명한 사우드 가문은 쿠웨이트의 사바 가문 아래에서 지냈다."
  subjects: [emirate-of-nejd, jabal-shammar, ottoman]
