- id: gulf-treaty-1819
  year: 1819
  endYear: 1853
  title:
    ko: "영국–카와심 전쟁과 일반 해양 조약, 영구 해상 휴전(1819~1853)"
  summary:
    ko: "걸프 남쪽 해안에서는 라스알카이마와 샤르자를 근거지로 한 카와심(알카시미) 가문이 바다에서 힘을 쥐고 있었고, 그 가운데 라스알카이마 계열이 와하브 쪽에 섰으며 샤르자 계열은 부분적으로만 동조했다. 영국 동인도 회사는 이들이 인도 항로의 상선을 습격하는 '해적'이라 보아 1809년에 이어 1819년 11월 봄베이에서 약 3천 명의 원정군을 보냈고, 원정군은 12월 라스알카이마를 포격해 22일 다야 요새 수비대의 항복을 받았다. 영국군은 카와심의 배들을 불태워 이 해안의 해상 세력을 꺾었다. 카와심 쪽 설명과, 카와심 가문 출신으로 샤르자를 다스리는 술탄 빈 무함마드 알카시미 같은 연구자는 '해적'이라는 규정이 인도 무역을 지키려는 영국 쪽 경쟁 이해에서 나왔으며 습격 가운데 상당수는 해상 통행과 정치 다툼에서 비롯했다고 본다. 영국은 오만 무스카트의 술탄 사이드 빈 술탄(재위 1804~1856)의 도움을 얻었다. 1820년 1월 8일 라스알카이마에서 시작해 몇 주 사이 여러 족장이 차례로 일반 해양 조약에 서명했고(아지만과 움알쿠와인은 3월 가입, 바레인은 2월), 서명한 족장들은 영국 배에 대한 약탈과 노예 거래를 그치기로 했다. 조약에는 노예 매매 금지도 들어 있었고 1847년 헤넬 조약은 노예 선박을 수색할 권리를 영국에 주었다. 1835년부터는 진주잡이 철(약 6개월)의 해전을 쉬는 휴전이 족장들의 서명으로 해마다 되풀이되었고 1843년에는 10년 휴전이 되었으며, 1853년 5월 족장들이 영구 해상 휴전을 맺어 바다에서는 서로 싸우지 않고 분쟁은 영국 정치 대리인에게 맡기기로 했다. 이렇게 되풀이된 휴전으로 영국과 묶인 라스알카이마·아부다비·두바이·샤르자 등의 족장국은 '트루셜(휴전) 해안'의 '트루셜 국가들'로 불리게 되었다. 땅 위의 싸움까지 막은 것은 아니었지만 영국이 걸프 해상 질서의 심판자가 되는 길이 굳어졌다. 이 체제는 뒤에 영국이 외교권까지 맡는 배타 협정으로 이어졌다(「영국과 바레인: 1820년 조약에서 1892년 배타 협정까지(1820~1892)」, 뒤의 사건)."
  subjects: [trucial-states, busaid-oman, uk, company-india]
  links: []
  tags: [war, diplomacy, politics]
  sources: ["Sultan Muhammad Al-Qasimi, The Myth of Arab Piracy in the Gulf (Croom Helm, 1986)", "J. B. Kelly, Britain and the Persian Gulf 1795–1880 (Clarendon Press, 1968)", "Frauke Heard-Bey, From Trucial States to United Arab Emirates: A Society in Transition (Longman, 1982)"]

- id: bahrain-1820
  year: 1820
  endYear: 1892
  title:
    ko: "영국과 바레인: 1820년 조약에서 1892년 배타 협정까지(1820~1892)"
  summary:
    ko: "1783년 아라비아 본토의 주바라에서 건너와 바레인을 차지한 알할리파 가문은 진주 무역으로 나라를 꾸렸고 와하브·오만·이란 사이에서 줄타기를 했다. 1820년 바레인 족장들은 트루셜 해안(뒷날의 트루셜 국가들)의 다른 족장들과 함께 영국과 일반 해양 조약을 맺어 해적질과 노예 거래를 막기로 했다(「영국–카와심 전쟁과 일반 해양 조약, 영구 해상 휴전(1819~1853)」, 앞의 사건). 1830년대에는 이집트·오스만과 네지드의 압력 속에서 조공을 바치며 버텼다. 1843년에는 족장 압둘라 빈 아흐마드가 종손(형 살만의 손자) 무함마드 빈 칼리파에게 밀려났다. 바레인은 페르시아만의 영국 정치 주재관(이란 해안의 부시르에 주재)을 거쳐 영국과 관계를 이어 갔고, 영국이 인정해 주는 것이 족장 자리의 정통성을 받치는 큰 힘이 되었다. 1861년 5월 족장 무함마드 빈 칼리파가 영국과 맺은 영구 평화와 우호 조약으로 바레인은 바다에서 싸우지 않기로 하고 영국은 해상 공격에서 바레인을 지켜 주기로 했다. 그러나 1867~1868년 바레인과 카타르 해안 부족 사이에 전쟁이 일어나자 영국이 개입해 1868년 무함마드를 물러나게 했고 동생 알리 빈 칼리파가 족장이 되었다. 1869년 8월 알리가 외부 침입으로 죽고 무함마드 빈 압둘라가 자리를 빼앗았으나, 그해 12월 영국 정치 대리인 펠리 대령이 그를 몰아내고 알리의 아들 이사 빈 알리(재위 1869~1932)를 앉혔다. 이란의 카자르 정부는 바레인이 이란 땅이라고 주장했고 오스만도 1870년대에 압력을 넣었으나 영국은 바레인을 영국과 조약을 맺은 독립 토후국으로 대우했다. 1880년 12월 조약에서 이사는 영국의 동의 없이 다른 나라와 협정을 맺거나 땅을 넘기지 않기로 했고, 1892년 3월 배타 협정으로 영국의 동의 없이는 외국 대표를 받지 않기로 하여 영국의 보호가 굳어졌다. 바레인 경제는 진주잡이에 기대었고, 수니파인 알할리파 지배층은 시아파 농민과 진주잡이 노동자에게 세금과 부담을 지웠다."
  subjects: [bahrain, trucial-states, uk]
  links: []
  tags: [diplomacy, politics, economy]
  sources: ["J. B. Kelly, Britain and the Persian Gulf 1795–1880 (Clarendon Press, 1968)", "Fred H. Lawson, Bahrain: The Modernization of Autocracy (Westview Press, 1989)", "Rosemarie Said Zahlan, The Making of the Modern Gulf States: Kuwait, Bahrain, Qatar, the United Arab Emirates and Oman (Unwin Hyman, 1989)"]

- id: egypt-ottoman-1820
  year: 1820
  endYear: 1841
  title:
    ko: "수단 정복과 두 차례 이집트–오스만 전쟁(1820~1841)"
  summary:
    ko: "무함마드 알리는 1820~1822년 수단 북부를 정복해 노예와 금, 병사를 구했다(아들 이스마일은 1822년 신디에서 족장에게 습격당해 죽었다고 전한다). 그는 이집트 농민을 징집해 서양식 상비군을 키웠고 프랑스 장교 세브(술레이만 파샤)가 이를 도왔다. 아들 이브라힘 파샤는 술탄의 요청으로 그리스 모레아에 출병했으나(1825~1827, 「그리스 독립 전쟁」, 뒤의 사건) 나바리노 해전에서 함대를 잃었고, 술탄에게 보상으로 시리아 총독직을 요구했다. 거절당하자 이브라힘은 1831년 10월 시리아를 침공해 1832년 5월 아크레를 함락하고 12월 코니아에서 오스만 재상의 군대를 무찔렀다. 러시아가 1833년 2월 함대를 보내 술탄을 도왔고, 마흐무트 2세는 1833년 5월 퀴타히아 조약으로 이집트에 시리아 총독직과 아다나를 넘겼다. 시리아에서 이브라힘의 세금과 징병, 무기 몰수는 농민과 드루즈의 반란을 불렀다. 한편 이집트의 국가 독점과 공장 정책은 1838년 영국–오스만 통상 조약(발타 리만)으로 막혀 흔들렸다. 1839년 6월 24일 오스만군이 시리아를 되찾으려 니집에서 싸웠다가 무너졌고 마흐무트 2세는 7월 1일 죽었으며 오스만 함대는 알렉산드리아로 넘어갔다. 영국·러시아·오스트리아·프로이센은 1840년 7월 런던 협약으로 이집트 세습 총독직과 아크레를 중심으로 한 시리아 남부의 종신 통치를 줄 테니 나머지 시리아를 내놓으라고(받아들이지 않으면 그 조건마저 잃는다고 압박했다) 제안했고 무함마드 알리가 거절하자 영국·오스트리아 함대가 베이루트(9월)와 아크레(11월)를 포격했다. 레바논 산의 반란까지 겹쳐 이브라힘은 시리아에서 물러났다(「레바논 산의 내전과 무타사리피야(1840~1861)」, 뒤의 사건). 1841년 술탄의 칙령으로 무함마드 알리는 이집트의 세습 총독 지위를 얻고 군대를 1만 8천 명으로 줄이기로 했으며 시리아와 히자즈, 크레타를 돌려주었다."
