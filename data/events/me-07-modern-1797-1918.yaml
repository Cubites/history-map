- id: sahara-1881
  year: 1881
  endYear: 1905
  title:
    ko: "프랑스의 사하라 진출과 알제리 남부 영토(1881~1905)"
  summary:
    ko: "알제리 북부를 정복한 프랑스는 사하라를 철도와 대상로의 길목으로 보고 남쪽으로 눈을 돌렸다(「알제리 식민 정착과 크레미외 법령, 1871년 무크라니 봉기(1848~1871)」, 앞의 사건). 1870년대 말에는 사하라를 가로질러 알제리와 니제르·차드를 잇는 철도 계획이 논의되었다. 1881년 2월 플라테르스의 탐사대가 투아레그의 매복으로 지휘관과 장교들을 잃고 철수하다 대부분 죽자(생존자는 소수) 충격과 응징·식민 확대 요구가 일었으나 관심은 곧 식었고 횡단 철도 계획은 접혔다(투아레그는 탐사대를 자기 땅에 들어온 침입자로 보았다). 푸로–라미 원정대는 1898년 알제리에서 출발해 1900년 4월 차드 호 둘레에 이르렀다. 1853년부터 프랑스의 보호를 받던 이바드파의 오아시스 연합 음자브를 1882년 병합하고 우아르글라·수프 쪽 오아시스에 군을 두었다. 모로코 술탄의 종주를 받아 온 투아트·구라라·티디켈트 오아시스에는 프랑스군이 1899년 말 인살라에 이어 1900~1901년 아울레프와 아드라르, 구라라를 차지했다. 오아시스 마을의 상인과 수피 교단 지도자들은 모로코 술탄에게 도움을 청했으나 술탄은 군사적으로 대응할 수 없었다. 군 관리 체제 아래에서 이 땅은 1902년 알제리 '남부 영토'로 묶였고 낙타 부대(사하라 중대)가 주둔했다. 호가르의 아하가르 투아레그 연합은 1902년 5월 티트에서 프랑스군에게 졌고, 지도자 무사 악 아마스탄이 1904~1905년 무렵 프랑스의 종주를 받아들이면서 타실리 쪽까지 프랑스의 지배 아래 들어갔다. 프랑스에서는 이 과정을 '평화적 침투'라 불렀으나 벤저민 브라우어 같은 연구자는 오아시스 점령과 낙타 부대 습격, 우물과 가축의 통제로 이루어진 폭력적 과정이었다고 본다. 오아시스 상인과 투아레그 유목민은 사하라 횡단 교역이 줄고 가축과 땅을 잃는 변화를 겪었다."
  subjects: [french-algeria, france, alaouite-morocco]
  links: []
  tags: [war, politics, society]
  sources: ["Benjamin Claude Brower, A Desert Named Peace: The Violence of France's Empire in the Algerian Sahara, 1844–1902 (Columbia University Press, 2009)", "Charles-Robert Ageron, Modern Algeria: A History from 1830 to the Present (Michael Brett 옮김, Hurst, 1991)", "The Cambridge History of Africa, vol. 6: From c. 1870 to c. 1905 (Roland Oliver·G. N. Sanderson 편, Cambridge University Press, 1985)"]

- id: british-egypt-1883
  year: 1883
  endYear: 1914
  title:
    ko: "영국의 이집트 지배와 보호국 선포(1883~1914)"
  summary:
    ko: "영국은 이집트를 점령한 뒤에도 헤디브와 오스만의 종주권은 그대로 두고 총영사가 실권을 쥐는 방식으로 다스렸다(「우라비 혁명과 영국의 이집트 점령(1879~1882)」, 앞의 사건). 에블린 베어링(크로머 경)이 1883~1907년 총영사로 재정을 균형 잡고 의무 노역을 없앴으며 관개 시설을 넓혀 1902년 아스완 댐을 열었다. 이는 면화 재배를 늘려 지주와 외국 상인에게 이익이 되었으나 소농은 빚과 토지 상실로 고통받았다. 한편 수단에서는 마흐디 반란이 일어나 힉스 군이 1883년 무너졌고 고든이 1885년 하르툼에서 죽었으며, 영국·이집트 군이 1898년 옴두르만에서 마흐디 군을 무찌른 뒤 1899년 영국·이집트 공동 통치가 시작되었다. 1906년 6월 딘샤와이에서 영국 장교들의 비둘기 사냥 중 마을 사람들이 다치고 영국 장교 한 명이 더위로 죽자 특별 재판이 열려 농민 네 명이 교수형을 받고 여럿이 채찍형과 징역을 받아 민족주의 여론이 크게 일어났다. 1892년 테피크가 죽자 열일곱 살의 아바스 힐미 2세가 헤디브가 되어 총영사와 자주 부딪쳤다. 1904년 영국-프랑스 협상으로 영국은 이집트에서의 우위를 프랑스에게 인정받았다(「영국-프랑스 협상과 모로코 위기」, 뒤의 사건). 크로머는 1907년 물러났고 무스타파 카밀의 국민당이 독립을 요구했다(그는 1908년 죽었다). 헤디브 아바스 힐미 2세(재위 1892~1914)가 이스탄불에 머물던 1914년 오스만이 참전하자 영국은 11월 계엄령을 시행했고 12월 보호국을 선포해 오스만의 종주권을 끊었으며 아바스 힐미 2세를 폐위하고 후세인 카밀을 술탄으로 세워 이집트 술탄국으로 바꾸었다(「1차 세계 대전의 중동 전선(1914~1918)」, 뒤의 사건)."
  subjects: [muhammad-ali-egypt, british-egypt, uk, ottoman]
  links:
    - { from: uk, to: muhammad-ali-egypt, note: "이집트 점령 통치 (1883~1914)" }
    - { from: uk, to: british-egypt, note: "보호국 선포, 후세인 카밀 즉위 (1914)" }
  tags: [politics, economy, society]
  sources: ["Afaf Lutfi al-Sayyid-Marsot, Egypt and Cromer: A Study in Anglo-Egyptian Relations (John Murray, 1968)", "Robert L. Tignor, Modernization and British Colonial Rule in Egypt, 1882–1914 (Princeton University Press, 1966)", "The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)"]

- id: spanish-sahara-1884
  year: 1884
  endYear: 1900
  title:
    ko: "스페인의 리오데오로 보호령 선포(1884~1900)"
  summary:
    ko: "1884년 스페인 아프리카주의·식민주의자 협회가 보낸 탐험가 에밀리오 보넬리는 서사하라 대서양 해안의 다크라 반도에서 오울라드 부 스바 부족의 족장 세 명과 조약을 맺었다. 스페인 정부는 11월의 이 조약을 근거로 1884년 12월 리오데오로·블랑코 곶 등 거점의 보호령을 선포했고 1885년 7월 보하도르 곶에서 블랑코 곶까지 해안 전체로 넓혀 선포했으며, 1885년 다크라 반도에 세운 요새를 빌라시스네로스라 불렀다. 이는 아프리카를 점령한 나라가 영유권을 가진다는 베를린 회의(1884~1885)의 원칙에 맞추려는 움직임이었다(「아프리카 분할과 베를린 서아프리카 회의」, 같은 시기의 사건). 그러나 스페인은 오래 해안 거점만 지켰고 내륙의 사하라위 부족은 스페인의 지배 밖에서 이동하며 살았고, 오울라드 델림 같은 부족은 1885년부터 1890년대 중반까지 요새를 여러 번 공격했다. 1900년 프랑스와 맺은 파리 조약이 리오데오로와 프랑스령 서아프리카의 경계를 정했다."
  subjects: [spanish-sahara, spain]
  links: []
  tags: [politics, diplomacy]
  sources: ["The Cambridge History of Africa, vol. 6: From c. 1870 to c. 1905 (Roland Oliver·G. N. Sanderson 편, Cambridge University Press, 1985)", "Tony Hodges, Western Sahara: The Roots of a Desert War (Lawrence Hill & Co., 1983)"]

- id: kuwait-1896
  year: 1896
  endYear: 1915
  title:
    ko: "쿠웨이트의 무바라크와 영국의 1899년 협정(1896~1915)"
  summary:
    ko: "쿠웨이트는 18세기 중엽 우타이바 부족의 사바 가문이 걸프 북쪽 끝에 세운 항구 도시로, 1871년 오스만이 알하사를 차지하며(「사우드 가문의 분열, 오스만의 알하사 점령과 네지드 토후국의 몰락(1865~1891)」, 앞의 사건) 바스라 주 아래 카이마캄이 다스리는 곳으로 편입되었다. 1896년 5월 무바라크가 이복형제인 셰이크 무함마드 알사바와 자라흐를 죽이고 권력을 잡았고(직접 죽였는지는 의심하는 연구자도 있다), 오스만은 1897년 그를 카이마캄으로 인정했다. 독일이 바그다드 철도를 놓아 종착점을 쿠웨이트로 삼을 가능성이 커지자 무바라크는 영국의 보호를 구했다. 1899년 1월 무바라크는 영국과 협정을 맺어 영국의 동의 없이 땅을 넘기거나 외국 대표를 받지 않기로 했고 영국은 쿠웨이트를 보호하기로 했다. 이는 오스만의 종주권과 겹치는 모호한 관계였다. 1901년에는 오스만 군함이 쿠웨이트에 접근하자 영국 군함이 막아 섰다. 1903년 오스만이 독일 회사에 바그다드 철도 건설권을 주자 쿠웨이트가 종착점이 될 가능성에 영국이 더욱 신경을 썼다. 1900~1901년 쿠웨이트는 하일의 자발 샴마르 토후국(라시드 가문)과 싸웠고, 무바라크는 쿠웨이트에서 지내던 사우드 가문의 압둘아지즈가 1902년 리야드를 습격하는 것을 도왔다(「압둘아지즈의 리야드 탈환과 네지드의 재건(1902~1915)」, 뒤의 사건). 1913년 영국과 오스만의 협정 합의안은 쿠웨이트를 오스만 제국 안의 자치 구역으로 두면서 영국과 맺은 협정을 인정했으나 비준되지 않았다. 1914년 11월 오스만이 참전하자 영국은 쿠웨이트를 영국 보호 아래의 독립 정부로 인정했다. 무바라크는 진주잡이와 상업, 영국과의 협정을 바탕으로 쿠웨이트를 키웠고 1915년 죽었다."
  subjects: [kuwait, jabal-shammar, uk, ottoman, german-empire]
  links: []
  tags: [politics, diplomacy]
  sources: ["B. J. Slot, The Origins of Kuwait (Brill, 1991)", "B. J. Slot, Mubarak al-Sabah: Founder of Modern Kuwait, 1896–1915 (Arabian Publishing, 2005)", "Rosemarie Said Zahlan, The Making of the Modern Gulf States: Kuwait, Bahrain, Qatar, the United Arab Emirates and Oman (Unwin Hyman, 1989)"]

- id: ibn-saud-1902
  year: 1902
  endYear: 1915
  title:
    ko: "압둘아지즈의 리야드 탈환과 네지드의 재건(1902~1915)"
  summary:
    ko: "1891년 물라이다에서 진 사우드 가문은 쿠웨이트로 망명했고(「사우드 가문의 분열, 오스만의 알하사 점령과 네지드 토후국의 몰락(1865~1891)」, 앞의 사건) 압둘라흐만의 아들 압둘아지즈는 청년기를 그곳에서 보냈다. 1902년 1월 그는 쿠웨이트에서 소수 병력을 이끌고 리야드에 들어가 라시드 가문의 총독을 죽이고 도시를 되찾았다. 이후 그는 오아시스 정착민의 지지를 얻어 1904년 무렵 카심을 차지하는 쪽으로 나아갔고 오스만은 라시드 가문을 도우려 카심에 군을 보냈으나 성과가 적었다. 1906년 라시드 가문의 아미르 압둘아지즈 빈 무타입이 싸움에서 죽은 뒤 가문은 1906~1908년 사이 아미르가 네 번 바뀌는 내분에 빠졌다(자발 샴마르는 이로써 약해졌다). 압둘아지즈는 1912년부터 유목민을 정착촌(히즈라)에 모아 종교 교육과 군사 훈련을 받게 하는 이흐완 운동을 후원해 새 병력을 얻었다. 1913년 5월에는 발칸 전쟁으로 바쁜 오스만의 알하사 수비대를 급습해 알하사와 카티프를 차지했다. 1915년 1월 자라브 전투에서 라시드 가문의 군대와 싸웠으나 승부를 가리지 못했고 이때 영국 정치 장교 셰익스피어가 전사했다. 1915년 12월 걸프의 다린 섬에서 영국 대표 퍼시 콕스와 맺은 조약으로 영국은 압둘아지즈를 네지드와 알하사의 지배자로 인정하고 보호를 약속했으며, 압둘아지즈는 영국 동의 없이 다른 나라와 조약을 맺거나 땅을 넘기지 않기로 했다. 압둘아지즈는 영국의 보조금을 받으면서도 오스만과 큰 싸움은 피했다. 같은 시기 샤리프 후세인은 히자즈에서 아랍 반란을 준비하고 있었다(「후세인–맥마흔 서한과 아랍 반란, 사이크스–피코 협정과 밸푸어 선언(1915~1918)」, 뒤의 사건)."
  subjects: [nejd, jabal-shammar, kuwait, ottoman, uk]
  links:
