  tags: [politics, war, diplomacy]
  sources: ["Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)", "Joseph Kostiner, The Making of Saudi Arabia, 1916–1936: From Chieftaincy to Monarchical State (Oxford University Press, 1993)", "Gary Troeller, The Birth of Saudi Arabia: Britain and the Rise of the House of Sa'ud (Frank Cass, 1976)"]
