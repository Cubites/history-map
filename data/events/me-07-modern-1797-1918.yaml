- id: ww1-middle-east-1914
  year: 1914
  endYear: 1918
  title:
    ko: "1차 세계 대전의 중동 전선(1914~1918)"
  summary:
    ko: "오스만 정부는 1914년 8월 독일과 비밀 동맹을 맺고 10월 말 흑해에서 러시아 항구를 포격해 참전했다. 갈리폴리 전투와 아르메니아인의 강제 이주·학살은 「전쟁의 확대와 갈리폴리 전투」(같은 시기의 사건)가 다루고, 이 사건은 아랍 지방과 이란의 전선을 다룬다. 메소포타미아에서는 영국령 인도군이 1914년 11월 바스라를 차지하고 바그다드로 올라가다 1915년 11월 크테시폰에서 막혔다. 쿠트에서 포위된 타운센드의 군대는 1916년 4월 항복했고, 포로가 된 영국·인도군 약 1만 3천 명 가운데 많은 수가 포로 생활 중 죽었다. 영국군은 1917년 3월 모드의 지휘로 바그다드를 차지했다. 시나이에서는 제말 파샤의 오스만군이 1915년 2월 수에즈 운하를 공격했다가 물러났고(영국은 1914년 12월 이집트를 보호국으로 선포해 이집트 술탄국을 군사 기지로 삼았다), 1916년 8월 로마니 싸움 뒤 영국 이집트 원정군이 철도와 수도관을 놓으며 동쪽으로 나아갔다. 1917년 두 차례의 가자 공격은 실패했으나 10월 31일 앨런비가 베르셰바를 차지했고 12월에는 예루살렘에 들어갔다. 1918년 9월 므깃도 싸움으로 오스만 전선이 무너져 10월 1일 다마스쿠스, 10월 말 알레포에 이르렀다. 이 진격에는 호주 경기병과 샤리프 후세인의 아들 파이살의 아랍군이 함께했다(「후세인–맥마흔 서한과 아랍 반란, 사이크스–피코 협정과 밸푸어 선언(1915~1918)」, 뒤의 사건). 1918년 10월 30일 무드로스 휴전으로 전투가 멈추었다(「무드로스 휴전과 아랍 지방의 점령 행정(1918~1920)」, 뒤의 사건). 아라비아에서는 1915년 7월 오스만군이 라헤즈 술탄국의 땅을 차지해 아덴을 위협했고, 쿠웨이트의 무바라크와 네지드의 압둘아지즈는 영국과 손잡았으나 하일의 자발 샴마르 토후국(라시드 가문)은 오스만 편에 섰다. 중립을 선언한 카자르 왕조의 이란은 러시아가 북부를, 영국이 남부를 차지하고 오스만군도 서북부에 들어와 전장이 되었으며 1917년부터 기근이 겹쳐 많은 주민이 죽었다(다수 연구자는 약 100만~200만 명으로 보고 마지드는 800만~1천만 명까지 추산해 크게 갈리며, 큰 추산은 비판이 많다). 시리아에서는 연합국의 해상 봉쇄와 제말 파샤의 곡물 반입 제한, 오스만 군의 곡물 징발, 1915년 메뚜기 떼가 겹쳐 레바논 산을 중심으로 1915~1918년 기근이 일어나 10만~20만 명이 죽었다는 추산이 있으며, 책임을 연합국의 봉쇄와 오스만 당국의 정책 가운데 어디에 두느냐는 평가가 갈린다. 1916년 5월에는 제말 파샤가 베이루트와 다마스쿠스에서 아랍 민족주의자 21명을 교수형에 처했다."
  subjects: [ottoman, uk, russia, german-empire, british-egypt, qajar-iran, lahej-sultanate, aden-protectorate, kuwait, nejd, jabal-shammar, british-raj]
