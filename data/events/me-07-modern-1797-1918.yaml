  links: []
  tags: [politics, war, religion]
  sources: ["Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)", "Natana J. DeLong-Bas, Wahhabi Islam: From Revival and Reform to Global Jihad (Oxford University Press, 2004)", "Alexei Vassiliev, The History of Saudi Arabia (Saqi Books, 1998)"]

- id: french-egypt-1798
  year: 1798
  endYear: 1801
  title:
    ko: "프랑스의 이집트·시리아 원정(1798~1801)"
  summary:
    ko: "프랑스 총재 정부는 영국과 인도를 잇는 길목을 쥐려고 1798년 5월 나폴레옹 보나파르트가 이끄는 3만 6천 명 안팎의 원정군을 툴롱에서 이집트로 보냈다. 당시 이집트는 오스만 총독이 있었지만 실권은 맘루크 베이인 이브라힘과 무라드가 쥐고 있었다(「이집트 베이들의 부활과 알리 베이 알카비르(1760~1791)」, 앞의 사건). 7월 1일 알렉산드리아에 상륙한 프랑스군은 7월 21일 피라미드 전투에서 무라드 베이의 맘루크 기병을 무찌르고 카이로에 들어갔다. 그러나 8월 1~2일 아부키르만 해전에서 넬슨의 영국 함대가 프랑스 함대를 거의 없애 원정군은 본국과 끊겼다. 점령군은 이집트 명사들로 디완(자문 회의)을 꾸렸고, 동행한 학자들이 이집트 학술원을 세워 조사했으며 그 성과는 『이집트지』로 남았다(로제타석은 1799년 7월 발견되었다). 한편 세금과 종교 모욕에 반발해 1798년 10월 21일 카이로 봉기가 일어나 알아즈하르를 중심으로 번졌고, 프랑스군은 대포로 진압해 수천 명이 죽었다(추산). 오스만은 9월 프랑스에 선전 포고했다. 나폴레옹은 1799년 2월 시리아로 올라가 3월 자파를 차지했으나 항복한 수비대 포로를 죽인 일은 지금도 논란이고, 3~5월 아크레 포위는 영국 해군과 아크레 총독 자자르 파샤의 방어에 막혀 페스트와 함께 실패했다. 그는 7월 아부키르에서 오스만군을 물리친 뒤 8월 말 군을 두고 몰래 프랑스로 돌아가 브뤼메르 쿠데타로 집권했다(「나폴레옹의 집권과 프랑스 민법전」, 뒤의 사건). 뒤를 이은 클레베르는 1800년 1월 엘아리시 협정으로 철수를 약속했으나 영국이 거부해 무산되었고, 3월 헬리오폴리스에서 오스만군을 이긴 뒤 6월 14일 시리아 출신 학생 술라이만 알할라비에게 암살되었다. 메누가 지휘를 이었으나 1801년 3월 영국군이 아부키르에 상륙하고 오스만군이 시리아에서 내려와, 카이로는 6월, 알렉산드리아는 9월 항복했다. 프랑스군은 영국 배로 물러났고, 오스만 원정군의 알바니아 부대의 장교 가운데 무함마드 알리가 있었다(「무함마드 알리의 집권과 맘루크 학살(1805~1811)」, 뒤의 사건)."
