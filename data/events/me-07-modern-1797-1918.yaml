  sources: ["Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)", "Alexei Vassiliev, The History of Saudi Arabia (Saqi Books, 1998)", "Madawi Al-Rasheed, Politics in an Arabian Oasis: The Rashidi Tribal Dynasty (I.B. Tauris, 1991)"]

- id: qajar-russo-1826
  year: 1826
  endYear: 1828
  title:
    ko: "2차 러시아–이란 전쟁과 투르크만차이 조약(1826~1828)"
  summary:
    ko: "굴리스탄 조약(1813)은 카자르 왕조의 이란과 러시아의 국경을 분명히 정하지 못해 다툼이 이어졌다(「아가 무함마드 칸의 암살과 파트흐 알리 샤, 1차 러시아–이란 전쟁과 굴리스탄 조약(1797~1813)」, 앞의 사건). 러시아가 1825년 고크차 호 쪽 땅을 차지하자 시아파 울라마가 성전을 선포하며 샤를 압박했고(아바스 미르자는 전쟁에 신중했다는 설명이 있다), 아바스 미르자는 1826년 7월 러시아령을 공격했다. 러시아군은 1826년 9월 간자 근처에서 이란군을 물리쳤고 1827년 8월 오샤칸 싸움에서도 아바스 미르자가 졌으며, 파스케비치 장군은 1827년 7월 나히체반, 10월 13일(러시아 옛 달력 10월 1일) 에리반을 차지한 뒤 10월 말 타브리즈까지 들어갔다. 1828년 2월 러시아군이 타브리즈에 머무는 가운데 맺은 투르크만차이 조약으로 이란은 에리반·나히체반 칸국을 러시아에 넘겼고 아락스강이 국경이 되었으며, 막대한 배상금(은 루블 2천만 안팎)을 물고 러시아 상인에게 치외 법권과 낮은 관세를 주었다. 이런 조건은 뒤에 이란이 다른 유럽 나라와 맺는 조약의 본보기가 되었다. 조약에는 주민 이주 조항이 있어 이란령의 아르메니아인이 아락스 북쪽으로 옮겨 갔다. 영국은 1814년 조약의 보조금 조항이 침략을 받았을 때만 적용된다며, 이란이 먼저 공격했다는 이유로 지급을 거부했다. 싸움은 아제르바이잔·탈리시·카라바흐 전선에서 치러졌고 아바스 미르자의 새 군대는 러시아 포병에 밀렸다. 아락스 북쪽 땅에는 아르메니아인과 튀르크계 무슬림이 섞여 살았고 이들의 처지는 러시아 지배 아래서 바뀌었다. 이란은 북쪽에서 땅을 잃자 서쪽의 헤라트 쪽으로 눈을 돌렸다(「무함마드 샤와 헤라트 문제, 영국–이란 전쟁(1834~1857)」, 뒤의 사건)."
  subjects: [qajar-iran, russia, uk]
  links:
    - { from: qajar-iran, to: russia, note: "투르크만차이 조약으로 에리반·나히체반 할양 (1828)" }
  tags: [war, diplomacy, politics]
  sources: ["Muriel Atkin, Russia and Iran, 1780–1828 (University of Minnesota Press, 1980)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)", "Ervand Abrahamian, A History of Modern Iran (Cambridge University Press, 2008)"]

- id: algiers-1827
  year: 1827
  endYear: 1830
  title:
    ko: "프랑스의 알제 점령(1827~1830)"
  summary:
    ko: "프랑스와 알제 섭정 사이에는 나폴레옹 시기의 곡물 외상값을 둘러싼 오랜 다툼이 있었다. 1827년 4월 알제의 데이 후세인이 프랑스 영사 드발을 부채(扇)로 쳤고(프랑스에서는 이를 '부채 사건'이라 불렀다), 프랑스는 사과를 얻지 못하자 알제 항구를 봉쇄했다. 봉쇄는 3년 가까이 이어졌으나 성과가 없었고 1829년 8월에는 협상하러 간 프랑스 사절의 배가 알제 포대의 포격을 받는 일까지 있었으며, 국내 불만에 시달리던 샤를 10세의 정부는 외부의 성공으로 인기를 얻으려 원정을 결정했다. 1830년 6월 14일 부르몽이 이끄는 3만 4천~3만 7천 명 안팎(자료마다 다르다)의 원정군이 알제 서쪽 시디페루슈에 상륙했고, 6월 19일 스타우엘리에서 알제 군대를 물리친 뒤 7월 5일 후세인의 항복을 받아 알제를 차지했다. 항복 조건은 종교와 재산을 존중한다고 약속했으나 프랑스군은 곧 성채의 재산을 가져가고 종교 재산(와크프)과 모스크를 징발했다. 후세인은 이탈리아로 떠났고, 1659년부터 이어 온 알제 섭정은 끝났다. 프랑스가 쥔 알제와 해안 거점은 뒷날 프랑스령 알제리로 불리는 지배의 출발점이 되었다. 정작 샤를 10세는 같은 달 7월 혁명이 일어나 곧 물러났고, 새 정부는 점령을 이어 갈지 오래 정하지 못했다. 섭정은 이름뿐인 오스만 술탄의 종주 아래 있었으나 오스만 함대는 1827년 10월 나바리노 해전에서 무너진 터라 알제를 도울 수 없었다(「그리스 독립 전쟁」, 앞의 사건). 알제 성채에서 가져간 재산의 규모와 행방은 지금도 논란이다. 그 사이 콘스탄틴의 아흐마드 베이와 서쪽의 부족들은 프랑스에 맞서 싸움을 이어 갔다(「압델카데르의 저항과 프랑스의 알제리 정복(1832~1847)」, 뒤의 사건)."
  subjects: [regency-of-algiers, french-algeria, france, ottoman]
  links:
    - { from: france, to: regency-of-algiers, note: "알제 점령, 데이 후세인의 항복 (1830)" }
  tags: [war, politics]
  sources: ["Charles-Robert Ageron, Modern Algeria: A History from 1830 to the Present (Michael Brett 옮김, Hurst, 1991)", "John Ruedy, Modern Algeria: The Origins and Development of a Nation (Indiana University Press, 1992)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]
