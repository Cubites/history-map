- id: herat-1834
  year: 1834
  endYear: 1857
  title:
    ko: "무함마드 샤와 헤라트 문제, 영국–이란 전쟁(1834~1857)"
  summary:
    ko: "후계자 아바스 미르자가 1833년 죽자 그의 아들 무함마드 샤가 1834년 할아버지 파트흐 알리 샤를 이어 카자르 왕조의 샤가 되었다(재위 1834~1848). 그는 북쪽 캅카스를 러시아에 잃은 뒤 동쪽의 헤라트를 이란의 옛 땅으로 보고 되찾으려 했다(「2차 러시아–이란 전쟁과 투르크만차이 조약(1826~1828)」, 앞의 사건). 1837년 11월 이란군이 헤라트를 포위하자 영국은 러시아 공사 시모니치가 이를 부추긴다고 보고 인도로 가는 길목이 위험해진다고 여겼다. 영국 장교 엘드레드 포팅거는 헤라트 총리 야르 무함마드 칸의 방어를 돕는 조언자로 참여했고(그의 역할은 영국 쪽 사료에 기대는 영웅담이라 검증이 어렵다), 영국은 1838년 6월 걸프의 하르그 섬을 차지하며 압박했다. 샤는 1838년 9월 포위를 풀었다. 영국은 이듬해 1차 아프가니스탄 전쟁(1839~1842)을 일으켜 카불에 자기 편 아미르를 세우려 했다. 이 일은 영국과 러시아가 이란과 아프가니스탄을 두고 벌인 '그레이트 게임'의 한 대목이었다(「그레이트 게임과 판데 사건」, 뒤의 사건). 무함마드 샤 뒤를 이은 나세르 앗딘 샤 때인 1856년 10월 이란군이 헤라트를 차지하자 영국은 인도 총독부의 군대를 걸프로 보내 같은 해 12월 부시르를 점령했다. 1857년 3월 4일 파리에서 조약이 서명되었으나 소식이 늦게 닿아 3월 말까지 싸움이 이어졌고, 영국은 그사이 호람샤르를 차지하고 아와즈 쪽으로 나아갔다. 이 조약으로 이란은 헤라트에서 물러나고 아프가니스탄의 독립을 인정했으며, 영국은 이란에서 최혜국 대우와 영사 파견의 권리를 얻었다. 이 전쟁은 이란이 영국 해군 앞에서 얼마나 약한지를 보였고, 이란 정부가 유럽과 균형을 잡는 외교에 더욱 기대는 계기가 되었다. 이란 쪽에서는 총리 미르자 아카 칸 누리(재임 1851~1858)가 이 정책을 이끌었다."
  subjects: [qajar-iran, uk, russia, company-india]
