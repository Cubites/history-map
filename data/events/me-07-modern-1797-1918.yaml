- id: yemen-tihama-1803
  year: 1803
  endYear: 1840
  title:
    ko: "와하브·이집트의 티하마 점령과 카심 왕조의 쇠퇴(1803~1840)"
  summary:
    ko: "카심 왕조의 이맘은 사나가 있는 고지대를 쥐고, 홍해 연안 티하마의 호데이다·모카 같은 항구에서 커피 수출 관세를 거두어 재정을 꾸렸다(「카심 이맘국의 전성기와 모카 커피 무역, 라헤즈 술탄국의 자립(1636~1728)」, 앞의 사건). 그러나 1803년 아시르 상부에서 와하브 쪽(디리야 토후국)에 선 수장 아부 누크타에게 패한 아부아리시의 샤리프 하무드가 와하브에 복속했고, 하무드는 이후 3년에 걸쳐 이맘에게서 티하마 해안을 빼앗았다(이맘 알만수르 알리 1세의 1806년 원정은 시작도 못 했다). 이로써 이맘국은 항구 수입을 잃었다. 새 지배층은 성자 묘를 허물고 자카트를 바치게 해, 샤피이파가 많은 해안 주민은 호응과 반발로 갈렸고, 하무드는 1808년 와하브와 갈라서 1809년 아부 누크타를 죽였다. 이 수입으로 사나의 궁정과 군대를 유지해 온 카심 왕조는 재정에 큰 타격을 입었다. 이집트군이 디리야를 꺾은 1818년 무렵 이맘은 해안을 잠시 되찾았다(「이집트–와하브 전쟁과 디리야의 함락(1811~1818)」, 뒤의 사건). 하지만 1833년 이집트 총독 무함마드 알리의 군대가 호데이다와 티하마를 차지해 1840년까지 이집트가 홍해 해안을 다스렸다. 이집트가 1840년 아라비아에서 철수하자 해안은 오스만이 돌아오기까지 지방 수장들의 손에 있었다. 사나의 이맘은 이 틈에서 힘이 약해져, 1835년 뒤에는 이맘이 자주 바뀌고 암살과 폐위가 잇달았으며 부족 수장들의 힘이 커졌다. 이 무렵 모카와 호데이다에서는 영국·프랑스 상선과 인도 상인이 커피를 실어 갔고 1798년 이후에는 미국 세일럼의 상선도 모카에 드나들었으나, 자바와 서인도의 커피에 밀려 예멘 커피의 몫은 줄어들었다. 1839년 영국이 남쪽 항구 아덴을 차지하자(「영국의 아덴 점령과 아덴 보호령(1839~1886)」, 뒤의 사건) 홍해 입구와 아덴만이 모두 외세와 이집트의 경쟁 무대가 되었다. 이로써 예멘 고지대 이맘국은 해안 무역의 이익을 잃고 산지 이맘국으로 오그라들었다."
  subjects: [qasimid-state, emirate-of-diriyah, muhammad-ali-egypt]
  links:
    - { from: muhammad-ali-egypt, to: qasimid-state, note: "호데이다 등 티하마 점령 (1833)" }
  tags: [politics, war, economy]
  sources: ["Robert W. Stookey, Yemen: The Politics of the Yemen Arab Republic (Westview Press, 1978)", "Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)"]

- id: muhammad-ali-1805
  year: 1805
  endYear: 1811
  title:
    ko: "무함마드 알리의 집권과 맘루크 학살(1805~1811)"
  summary:
    ko: "프랑스군이 물러난 뒤에도 오스만 총독은 이집트에서 맘루크 베이들과 알바니아 용병대 사이에 끼어 힘을 쓰지 못했다(「프랑스의 이집트·시리아 원정(1798~1801)」, 앞의 사건). 무함마드 알리는 1769년 알바니아계 집안에서 태어나 마케도니아의 카발라에서 자란 군인으로, 1801년 오스만 원정군의 알바니아 부대 부지휘관으로 이집트에 왔다. 1805년 5월 카이로의 울라마와 상인이 총독 쿠르시드 파샤를 거부하고 그를 추대하는 형식이 갖춰졌고, 술탄은 7월 그를 총독으로 인정했다. 1807년 3월 영국군이 알렉산드리아를 차지했으나 로제타에서 져 9월 물러났다. 그는 자기를 추대한 울라마 지도자 우마르 마크람을 1809년 유배하고, 같은 시기 울라마와 베이들이 쥐던 징세권(이탈삼)과 와크프(종교 기부 재산) 수입을 거두어들이기 시작했다. 1806~1807년 맘루크 지도자 바르디시와 엘피 베이가 잇따라 죽어 맘루크는 구심점을 잃었으나 상이집트에서는 여전히 힘을 가졌다. 1811년 3월 1일 그는 아라비아 원정군의 출정식을 구실로 맘루크 지도자들을 카이로 성채로 불러 학살했다(성채 안 희생자는 사료와 연구에 따라 74명에서 약 500명까지 추산이 갈리고 5백 명 안팎이라는 전승이 대표적이며, 이후 며칠 사이 지방에서도 더 죽었고 전국에서 남은 맘루크가 쫓겨 죽거나 일부는 수단으로 달아났다). 좁은 성채 문 안에 갇힌 지도자들이 총격을 받아 죽었다고 전하며, 한 사람이 성벽에서 말을 타고 뛰어내려 살았다는 이야기는 전설로 본다. 이로써 이집트에서 오래 이어진 맘루크 군사 계층이 정치 무대에서 사라졌다. 이어진 토지 조사와 이탈삼 폐지로 농민이 국가에 직접 세금을 내게 되었고, 이는 군대와 공장을 키울 재정이 되었지만 농민의 세금과 노역 부담도 함께 키웠다."
  subjects: [muhammad-ali-egypt, ottoman, uk]
  links: []
  tags: [politics, society, war]
  sources: ["Afaf Lutfi al-Sayyid-Marsot, Egypt in the Reign of Muhammad Ali (Cambridge University Press, 1984)", "Khaled Fahmy, All the Pasha's Men: Mehmed Ali, His Army and the Making of Modern Egypt (Cambridge University Press, 1997)", "The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)"]

- id: ottoman-reform-1808
  year: 1808
  endYear: 1876
  title:
    ko: "마흐무트 2세의 개혁과 탄지마트(1808~1876)"
  summary:
    ko: "셀림 3세는 새 군대(니잠 제디드)를 만들려다 예니체리와 울라마의 반발로 1807년 폐위되었고 이듬해 살해되었다. 그 뒤를 이은 무스타파 4세(재위 1807~1808)도 곧 밀려났고, 1808년 즉위한 마흐무트 2세(재위 1808~1839)는 먼저 지방 유력자(아얀)들과 문서 협약을 맺어 힘을 모은 뒤, 1826년 6월 반란을 일으킨 예니체리를 대포로 진압해 부대를 없앴다(이를 '길조의 사건'이라 부른다). 그는 서양식 군대와 관청, 우편, 신문을 도입하고 관복을 페즈 모자와 겉옷으로 바꿨다. 이집트의 무함마드 알리와 두 차례 싸우며 새 군대의 한계를 겪었다(「수단 정복과 두 차례 이집트–오스만 전쟁(1820~1841)」, 뒤의 사건). 아들 압뒬메지트 1세(재위 1839~1861) 때인 1839년 귤하네 칙령은 생명·재산·명예의 보장, 공정한 세금, 징병 기간 제한을 약속하며 탄지마트(재편)를 열었다. 1856년 오스만이 영국·프랑스와 손잡고 러시아에 맞선 크림 전쟁이 끝날 무렵 나온 개혁 칙령은 종교와 상관없이 신민의 평등을 거듭 밝히고 비무슬림 공동체(밀레트)의 회의를 정비했으나, 무슬림 보수층과 일부 비무슬림 지도자 모두 불만을 가졌다(「크림 전쟁」, 뒤의 사건). 1858년 토지법과, 압뒬메지트 1세의 동생 압뒬아지즈(재위 1861~1876) 때인 1864년 주(빌라예트) 법은 아랍 지방에도 적용되었다. 이라크에서는 1831년 오스만 군이 다우드 파샤의 맘루크 체제를 끝냈고 시리아에서는 베이루트·다마스쿠스가 주 행정의 중심이 되었다. 1850년 알레포의 소요나 1860년 다마스쿠스 학살처럼 평등 정책이 불러온 종파 갈등도 일어났다. 개혁은 지방 행정과 징세를 중앙에 묶었으나 대외 차관이 늘어 1875년 오스만 정부는 이자 지급을 멈추었고, 이는 1876년 위기의 배경이 되었다(「미드하트 파샤와 1876년 헌법, 압뒬하미트 2세의 통치(1876~1909)」, 뒤의 사건)."
  subjects: [ottoman, muhammad-ali-egypt, uk, france]
  links: []
  tags: [politics, society, economy]
  sources: ["Stanford J. Shaw·Ezel Kural Shaw, History of the Ottoman Empire and Modern Turkey, vol. 2: Reform, Revolution, and Republic: The Rise of Modern Turkey, 1808–1975 (Cambridge University Press, 1977)", "Roderic H. Davison, Reform in the Ottoman Empire, 1856–1876 (Princeton University Press, 1963)", "Donald Quataert, The Ottoman Empire, 1700–1922 (Cambridge University Press, 2000)"]

- id: egypt-wahhabi-1811
  year: 1811
  endYear: 1818
  title:
    ko: "이집트–와하브 전쟁과 디리야의 함락(1811~1818)"
  summary:
    ko: "와하브 군이 두 성지를 장악하자(「디리야의 이라크·히자즈 원정: 카르발라 습격과 메카 점령(1797~1811)」, 앞의 사건) 술탄 마흐무트 2세는 이집트 총독 무함마드 알리에게 원정을 맡겼다. 무함마드 알리의 아들 투순 파샤가 1811년 말 얀부에 상륙했으나 사프라 고개에서 크게 졌다가, 1812년 11월 메디나를, 1813년 1월 메카를 되찾았다. 무함마드 알리는 1813년 직접 히자즈로 건너가 샤리프 갈리브를 붙잡아 쫓아냈고 새 샤리프를 세웠으며, 이로써 메카 순례 행렬(마흐말)은 다시 성지에 들어갈 수 있게 되었고 이후 히자즈는 오래 이집트가 다스렸다. 사우드가 1814년 죽은 뒤 아들 압둘라가 이맘을 이었다. 투순이 1815년 압둘라와 맺은 협약을 무함마드 알리가 물리치고 싸움을 이어 갔고, 1816년 말 이브라힘 파샤가 지휘를 맡아 네지드로 깊이 들어갔다. 이집트군은 1817~1818년 카심의 성채 도시들을 하나씩 굴복시킨 뒤 1818년 4월 디리야를 포위해 5개월 만에 압둘라의 항복 제의(9월 11일)를 받고 9월 15일 전쟁을 끝냈다. 원정군은 알바니아·튀르크·마그레브 출신 용병이 중심이었다. 압둘라는 이스탄불로 끌려가 오스만 조정에서 그해 12월 처형되었고, 이브라힘은 디리야의 성벽과 집들을 부수어 도시가 오래 쇠락했다. 전쟁은 원정비와 물자 징발로 이집트 재정에도 크게 부담이 되었으며, 아라비아 주민도 약탈과 파괴를 입었다. 이 원정은 무함마드 알리가 새 군대와 함대를 기르고 술탄과 맞먹는 힘을 쌓는 바탕이 되었다. 사우드 가문은 살아남은 이들이 네지드로 흩어졌다가 뒷날 리야드를 되찾는다(「제2차 사우디 국가: 투르키와 파이살, 이집트 점령(1824~1865)」, 뒤의 사건)."
  subjects: [muhammad-ali-egypt, emirate-of-diriyah, sharifate-of-mecca, ottoman]
  links:
