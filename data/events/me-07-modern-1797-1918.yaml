- id: qatar-1868
  year: 1868
  endYear: 1916
  title:
    ko: "카타르: 1868년 협정과 오스만의 지배, 영국과의 1916년 조약(1868~1916)"
  summary:
    ko: "카타르 반도의 부족들은 바레인 알할리파 가문의 영향 아래 있었다. 1867~1868년 바레인과 카타르 해안 부족 사이에 전쟁이 일어나자 영국이 개입했고, 1868년 9월 영국 정치 대리인 펠리가 맺게 한 합의에서 무함마드 빈 사니가 반도 부족의 대표로 인정되면서 사니 가문의 길이 열렸다(「영국과 바레인: 1820년 조약에서 1892년 배타 협정까지(1820~1892)」, 앞의 사건). 1871년 오스만이 알하사 점령에 이어(「사우드 가문의 분열, 오스만의 알하사 점령과 네지드 토후국의 몰락(1865~1891)」, 앞의 사건) 카타르에도 군을 보내 1872년 무함마드의 아들 자심 빈 무함마드를 카이마캄(군수)에 임명해 간접 통치했다. 도하에는 오스만 수비대가 주둔했으나 자심은 카이마캄 직함을 지니면서도 실권을 쥐었다. 오스만 총독이 1893년 자심의 형제와 부족 지도자들을 가두자 자심은 알와지바에서 진압군을 물리쳤고, 이 일로 오스만 지배는 사실상 이름뿐인 것이 되었다. 자심은 1878년부터 1913년까지 사니 가문의 수장으로 이 반도를 다스렸고 아들 압둘라 빈 자심(재위 1913~1949)이 뒤를 이었다. 1913년 7월 29일 서명된 영국–오스만 협약에서 오스만은 카타르에 대한 권리를 버렸으나 1차 대전으로 비준되지 않았다. 1914년 1차 대전이 터지고 1915년 오스만 수비대가 도하를 떠났다. 1916년 11월 압둘라는 영국과 조약을 맺어 영국이 해상 공격에서 카타르를 지켜 주는 대신 영국의 동의 없이 외국과 조약을 맺지 않기로 했다. 이로써 카타르는 걸프 휴전 체제의 한 나라로 영국의 보호 아래 들어갔다."
  subjects: [qatar, ottoman, uk, bahrain]
  links: []
  tags: [politics, diplomacy]
  sources: ["Rosemarie Said Zahlan, The Making of the Modern Gulf States: Kuwait, Bahrain, Qatar, the United Arab Emirates and Oman (Unwin Hyman, 1989)", "Allen J. Fromherz, Qatar: A Modern History (Georgetown University Press, 2012)", "J. G. Lorimer, Gazetteer of the Persian Gulf, Oman, and Central Arabia (Superintendent Government Printing, 1908~1915)"]

- id: midhat-1876
  year: 1876
  endYear: 1909
  title:
    ko: "미드하트 파샤와 1876년 헌법, 압뒬하미트 2세의 통치(1876~1909)"
  summary:
    ko: "탄지마트 개혁의 외채는 1875년 오스만의 채무 이자 지급 정지로 이어졌고, 발칸의 반란과 재정 위기 속에서(「마흐무트 2세의 개혁과 탄지마트(1808~1876)」, 앞의 사건) 1876년 5월 재상 출신 미드하트 파샤 등이 술탄 압뒬아지즈를 폐위했다. 뒤를 이은 무라트 5세는 석 달 만에 물러났고, 압뒬하미트 2세(재위 1876~1909)가 8월 즉위해 12월 헌법(칸운 에사시)을 선포했다. 이 헌법은 이슬람교도와 비무슬림 모두를 오스만 신민으로 두고 선거로 뽑는 하원을 두었다. 그러나 술탄은 1877년 2월 미드하트를 추방했고, 4월 러시아와 전쟁이 일어나자 1878년 2월 의회를 닫았다(「러시아-튀르크 전쟁과 산스테파노 조약」, 뒤의 사건). 미드하트는 이라크 총독(1869~1872)과 시리아 총독(1878년부터) 때 증기선과 학교, 시 위원회를 도입한 개혁가였으나 뒤에 체포되어 1883년 무렵 타이프에서 죽었다(튀르크어 자료는 1884년). 압뒬하미트 2세의 통치는 비밀 경찰과 검열, 이슬람 연대와 칼리프 권위를 앞세운 '범이슬람' 정책이 특징이었다. 아랍 지방에서는 1900년 착공해 1908년 다마스쿠스와 메디나를 이은 히자즈 철도를 두 성지 순례와 군대 이동에 썼다. 1880년대 러시아와 동유럽 유대인의 팔레스타인 이주가 시작되자 오스만은 이주와 토지 매입을 제한했다. 1894~1896년 동부 아나톨리아와 이스탄불 등에서 일어난 아르메니아인 학살로 8만~30만 명이 죽었다는 추산이 있으며 연구자마다 규모를 달리 본다. 1908년 7월 청년 튀르크 혁명으로 헌법이 되살아났고(「청년 튀르크 혁명과 보스니아 위기」, 뒤의 사건) 압뒬하미트는 1909년 4월 폐위되었다."
  subjects: [ottoman, russia]
  links: []
  tags: [politics, society, religion]
  sources: ["Stanford J. Shaw·Ezel Kural Shaw, History of the Ottoman Empire and Modern Turkey, vol. 2: Reform, Revolution, and Republic: The Rise of Modern Turkey, 1808–1975 (Cambridge University Press, 1977)", "Selim Deringil, The Well-Protected Domains: Ideology and the Legitimation of Power in the Ottoman Empire, 1876–1909 (I.B. Tauris, 1998)", "M. Şükrü Hanioğlu, A Brief History of the Late Ottoman Empire (Princeton University Press, 2008)"]

- id: tunisia-bardo-1878
  year: 1878
  endYear: 1883
  title:
    ko: "프랑스의 튀니지 점령과 바르도 조약(1878~1883)"
  summary:
    ko: "1869년 파산한 튀니스는 프랑스·영국·이탈리아의 재정 위원회 아래서 빚을 갚느라 세금을 늘렸고(「아흐마드 베이의 개혁과 튀니스의 기본 협약·헌법, 파산(1837~1869)」, 앞의 사건) 세 나라는 튀니스에서 이권을 다투었다. 당시 튀니지에는 이탈리아인 이주민이 1만 명 안팎으로 프랑스인보다 훨씬 많았다. 1878년 베를린 회의에서 영국 대표가 프랑스에 튀니스에서 뜻대로 하라는 뜻을 내비쳤다고 전한다(「베를린 회의와 그리스의 테살리아 획득」, 같은 시기의 사건). 프랑스는 1881년 4월 튀니지 북서부 크루미르 부족이 알제리 국경을 넘었다는 것을 구실로 군을 보내 튀니스 가까이까지 진군했다. 앞서 1880년 튀니스–골레타 철도를 두고 이탈리아 회사와 프랑스 회사가 맞붙은 일이 갈등을 키웠고, 프랑스의 페리 총리는 이 원정의 비용과 명분을 두고 의회에서 비판받아 1881년 11월 물러났다. 1881년 5월 12일 바르도에서 무함마드 앗사디크 베이는 프랑스와 조약을 맺어 프랑스군의 주둔과 프랑스 상주 공사의 외교 대행, 재정 감독을 받아들였고 오스만의 종주권은 이름만 남았다. 이 조약에 반발해 1881년 여름 남부 부족과 스팍스 도시가 봉기했고 프랑스군은 7월 스팍스를 함대로 포격한 뒤 10월 카이라완을 점령했다. 무함마드 앗사디크가 1882년 죽자 동생 알리가 베이가 되었다(재위 1882~1902). 1883년 6월 라마르사 협약으로 알리 베이는 프랑스가 권고하는 행정·사법·재정 개혁을 실행하기로 했고, 프랑스 관리가 베이 정부 부처를 맡아 사실상 내정을 쥐는 보호령이 되었다. 이탈리아는 튀니지에 이주민이 많았고 이 일에 크게 반발해 1882년 독일·오스트리아-헝가리와 삼국 동맹을 맺었다(「비스마르크 체제와 삼국 동맹」, 뒤의 사건)."
  subjects: [husainid-tunisia, french-tunisia, france, italy, uk, ottoman]
  links:
    - { from: france, to: husainid-tunisia, note: "튀니지 점령, 바르도 조약 (1881)" }
  tags: [politics, war, diplomacy]
  sources: ["Kenneth J. Perkins, A History of Modern Tunisia (Cambridge University Press, 2004)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Julia A. Clancy-Smith, Rebel and Saint: Muslim Notables, Populist Protest, Colonial Encounters (Algeria and Tunisia, 1800–1904) (University of California Press, 1994)"]

- id: urabi-1879
  year: 1879
  endYear: 1882
  title:
    ko: "우라비 혁명과 영국의 이집트 점령(1879~1882)"
  summary:
    ko: "이스마일이 폐위된 뒤 아들 테피크가 헤디브가 되었으나(「수에즈 운하와 헤디브 이스마일의 부채(1854~1879)」, 앞의 사건) 유럽 채권국의 통제 아래서 재정 긴축은 군인과 관리, 농민에게 부담이 되었다. 1881년 2월 외국인 장교에 비해 승진에서 밀리던 이집트인 장교들이 항의했고, 아흐마드 우라비가 지도자로 떠올랐다. 9월 9일 우라비는 아브딘 궁전 앞에서 군대를 이끌고 헌법과 의회, 군 증원을 요구했고 테피크는 이를 받아들여 그해 말 의회가 열렸다. 이 의회는 예산을 심의할 권한을 두고 영국·프랑스의 통제관과 부딪쳤다. 이 운동은 '이집트인의 이집트'를 내세워 군인뿐 아니라 지주, 울라마, 상인, 농민의 지지를 얻었다. 1882년 1월 영국과 프랑스가 헤디브를 지지하는 공동 서한을 보내자 반발이 커졌고, 2월 우라비는 전쟁 장관을 맡은 내각에 들어갔다. 6월 11일 알렉산드리아에서 일어난 충돌로 유럽인과 이집트인이 많이 죽자(사망자는 유럽인 50명 안팎과 이집트인 수백 명으로 추산이 갈린다) 영국 함대가 7월 11일 도시를 포격했다. 헤디브 테피크에 이어 오스만 술탄 압뒬하미트 2세도 우라비를 반역자로 선언했으나 군대를 보내지는 않았다. 프랑스는 군사 개입에서 물러났고, 영국군은 월즐리의 지휘 아래 수에즈 운하 쪽에서 들어가 1882년 9월 13일 텔엘케비르에서 우라비의 군대를 무찔렀다. 우라비는 사형이 감형되어 실론으로 유배되었고, 테피크는 헤디브 자리를 지켰다. 영국은 질서가 회복되면 곧 물러나겠다고 했으나 군대는 철수하지 않았다(「영국의 이집트 지배와 보호국 선포(1883~1914)」, 뒤의 사건). 이 일을 서양 침략에 맞선 민족주의 혁명으로 볼지 군부 반란으로 볼지는 연구자마다 해석이 갈린다."
  subjects: [muhammad-ali-egypt, uk, france, ottoman]
  links:
    - { from: uk, to: muhammad-ali-egypt, note: "이집트 점령, 텔엘케비르 전투 (1882)" }
  tags: [war, politics, society]
  sources: ["Juan R. I. Cole, Colonialism and Revolution in the Middle East: Social and Cultural Origins of Egypt's 'Urabi Movement (Princeton University Press, 1993)", "Alexander Schölch, Egypt for the Egyptians! The Socio-Political Crisis in Egypt, 1878–1882 (Ithaca Press, 1981)", "The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)"]
