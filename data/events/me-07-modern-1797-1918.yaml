  tags: [war, politics, religion]
  sources: ["Khaled Fahmy, All the Pasha's Men: Mehmed Ali, His Army and the Making of Modern Egypt (Cambridge University Press, 1997)", "Madawi Al-Rasheed, A History of Saudi Arabia (Cambridge University Press, 2002)", "Afaf Lutfi al-Sayyid-Marsot, Egypt in the Reign of Muhammad Ali (Cambridge University Press, 1984)"]
