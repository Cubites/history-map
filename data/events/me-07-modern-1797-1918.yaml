- id: arab-revolt-1915
  year: 1915
  endYear: 1918
  title:
    ko: "후세인–맥마흔 서한과 아랍 반란, 사이크스–피코 협정과 밸푸어 선언(1915~1918)"
  summary:
    ko: "메카의 샤리프 후세인은 1908년 오스만에서 샤리프로 임명된 뒤 히자즈에 대한 술탄의 간섭이 커지자 영국과 손잡을 길을 찾았다. 1915년 7월부터 1916년 3월까지 이집트 주재 영국 고등판무관 맥마흔과 주고받은 서한에서 영국은 오스만에 맞서 일어난다면 아랍의 독립을 지지하겠다고 했으나, 다마스쿠스·홈스·하마·알레포의 서쪽에 있는 시리아 일부 땅은 빼야 한다고 했고 팔레스타인이 이에 들어가는지는 지금까지도 해석이 갈린다. 1916년 5월 영국·프랑스는 비밀리에 사이크스–피코 협정을 맺어 시리아·레바논은 프랑스가, 바그다드와 바스라, 하이파 일대는 영국이 다스리거나 영향 아래 두고 팔레스타인은 국제 관리로 하기로 했으며 러시아도 동의했다. 후세인은 이 협정을 몰랐고, 1916년 6월 10일 아들 알리·압둘라·파이살·자이드와 함께 메카에서 반란을 일으켰다. 반란군은 베두인 부족과 오스만군에서 옮겨 온 아랍 장교들로 이루어졌고, 영국이 금과 무기를 대었다. 제다 수비대는 6월 16일, 메카의 오스만 수비대는 7월 9일, 타이프는 9월 22일에 항복했고 후세인은 10월 스스로 아랍의 왕이라 칭했으나 영국과 프랑스는 히자즈의 왕으로만 인정했다(히자즈 왕국). 네지드의 압둘아지즈와 아시르의 이드리스, 예멘의 이맘 야흐야는 각자 영국이나 오스만과 관계를 맺었을 뿐 후세인의 반란에 가담하지 않았고 서로 경쟁했다. 1917년 1월 와즈, 7월 6일 아카바를 차지한 아랍군은 파이살의 지휘로 오스만의 히자즈 철도를 끊으며 영국군의 팔레스타인 진격을 도왔다. 한편 1917년 11월 2일 영국 외무 장관 밸푸어는 영국 유대인 공동체의 지도자 월터 로스차일드 경에게 보낸 편지로, 영국 정부가 팔레스타인에 유대 민족을 위한 '민족적 고향'을 세우는 것을 호의적으로 보고 그 달성을 돕겠다고 하되 그곳의 비유대 공동체의 시민적·종교적 권리와 다른 나라 유대인이 누리는 권리와 정치적 지위를 해쳐서는 안 된다고 밝혔다. 시온주의 운동은 이를 환영했고, 아랍 지도자와 팔레스타인 아랍 주민은 이를 영국이 아랍에 한 약속과 자기들 땅에 대한 권리에 어긋난다고 보았다. 연구자에 따라 영국의 약속이 서로 어긋난 것이 의도였는지 전시의 타협이었는지를 달리 본다. 1918년 10월 1일 파이살의 아랍군이 다마스쿠스에 들어갔다."
