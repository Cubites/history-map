- id: nejd-1824
  year: 1824
  endYear: 1865
  title:
    ko: "제2차 사우디 국가: 투르키와 파이살, 이집트 점령(1824~1865)"
  summary:
    ko: "디리야가 무너진 뒤 이집트군은 네지드 곳곳에 수비대를 두었으나 병사와 보급의 부담으로 1820년대 초 대부분 물러났다(「이집트–와하브 전쟁과 디리야의 함락(1811~1818)」, 앞의 사건). 1824년 사우드 가문의 투르키 빈 압둘라가 리야드를 되찾아 도읍으로 삼으면서 제2차 사우디 국가가 시작되었다. 그는 오스만에 형식상 조공을 바치며 힘을 모아 1830년 알하사와 카티프를 차지했고, 이로써 바니 할리드의 알하사 지배가 끝났다. 투르키는 1834년 육촌 미샤리의 사주로 암살되었고, 아들 파이살 빈 투르키가 미샤리를 죽이고 이맘이 되었다. 1836년 하일에서는 압둘라 빈 라시드가 파이살의 임명으로 하일을 맡아 라시드 가문의 아미르국인 자발 샴마르가 시작되었고, 이 나라는 사우드 가문의 종주 아래 네지드 북부를 다스렸다. 파이살이 조공을 끊자 무함마드 알리는 1837~1838년 군을 보내 리야드를 차지하고 파이살을 카이로로 보냈으며, 사우드 일가 칼리드 빈 사우드를 앉혔다. 이집트군은 1840년 런던 협약으로 물러났고(「수단 정복과 두 차례 이집트–오스만 전쟁(1820~1841)」, 앞의 사건) 칼리드는 1841년 압둘라 빈 투나얀에게 밀려났다. 1843년 파이살이 카이로를 빠져나와 리야드를 되찾고 1865년까지 다스렸다. 1865년 2월에는 영국령 인도의 펠리 대령이 리야드를 찾아 파이살을 만났다. 이 나라는 알하사와 걸프 연안의 오아시스·부족에서 세금과 조공을 거두고 바레인·오만 해안의 족장들에게 압력을 넣었지만, 오스만이나 영국과 정면으로 부딪치는 것은 피했다. 1865년 12월 파이살이 죽고 아들들이 후계를 두고 다투면서 나라가 흔들리기 시작했다(「사우드 가문의 분열, 오스만의 알하사 점령과 네지드 토후국의 몰락(1865~1891)」, 뒤의 사건)."
  subjects: [emirate-of-nejd, bani-khalid-emirate, jabal-shammar, muhammad-ali-egypt, ottoman]
  links:
    - { from: emirate-of-nejd, to: bani-khalid-emirate, note: "알하사 점령 (1830)" }
