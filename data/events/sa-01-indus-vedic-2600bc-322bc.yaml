# 남아시아 사건 1차 묶음(sa-01): 16대국·마가다의 성장과 난다 왕조, 아케메네스의 간다라와 알렉산드로스의 인더스 원정 (기원전 2600 ~ 기원전 322년)
# 범위: 16대국과 기원전 500 무렵 판도, 가나상가(공화정)와 밧지, 아반티·바트사·코살라의 다툼, 마가다의 빔비사라·아자타샤트루·파탈리푸트라·시슈나가와 난다 왕조,
#   붓다·마하비라·6사외도와 결집, 제2의 도시화, 서사시와 파니니, 남인도 거석 문화, 스리랑카 비자야 전승과 판두카바야, 다리우스 1세의 간다라·힌두시, 알렉산드로스의 인더스 원정.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 기원전 연도는 천문 연도(기원전 N년 = 1−N)로 year를 적고 글에는 '기원전 N년'으로 썼다. 16대국과 마가다 왕들의 재위는 후대 불전(『마하밤사』)과 푸라나의 연표가 서로 어긋나서
#   위키백과 영어판 왕조 문서의 재위를 따르되 '무렵'을 붙이거나 다른 설을 한 구절 적었다. 붓다·마하비라의 생몰 연대는 한 값으로 못 박지 않았다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 종교 인물과 시설의 일은 주어와 사료(누가 언제 적었나)를 밝혔다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다.
#   인더스 문명·베다 시대(기원전 601년 앞)는 같은 갈래의 앞 절에 따로 있다.

- id: harappa-mohenjo-2300bc
  year: -2299
  title:
    ko: "인더스 문명의 성숙기: 하라파·모헨조다로·돌라비라와 도시 계획(기원전 2600~1900 무렵)"
  summary:
    ko: "인더스강과 지금은 말라붙은 가가르·하크라강 둘레에서 기원전 2600년 무렵부터 도시들이 잇달아 나타나 기원전 1900년 무렵까지 이어졌다. 이 시기를 인더스 문명(하라파 문화)의 성숙기라 하며, 바탕에는 기원전 7000년 무렵부터 발루치스탄 산자락에서 시작된 메르가르 같은 농경 마을과 기원전 3300년 무렵부터의 초기 하라파 단계가 있었다. 큰 도시로는 인더스강 가의 모헨조다로(지금 파키스탄 신드주), 라비강 가의 하라파(펀자브주), 촐리스탄의 간웨리왈라, 인도 하리아나의 라키가르히, 구자라트 카치의 돌라비라가 꼽히고, 알려진 거주지는 1,000곳이 넘으며 발굴된 것은 100곳 안팎이다. 하라파와 모헨조다로에는 저마다 3만~6만 명이 살았다고 어림하는 연구가 있으나 추산일 뿐이다. 도시는 높은 성채 구역과 넓은 아래 시가지로 나뉘고, 길이 거의 직각으로 만나는 격자 꼴이었으며, 집은 구운 벽돌로 짓고 길 밑에 덮개 있는 하수도를 묻었다. 벽돌의 길이·너비·두께 비는 대체로 4:2:1로 맞았고 집집마다 우물과 목욕 공간이 있었다. 모헨조다로 성채의 '대욕장'은 의식용 목욕 시설로 보는 견해가 많지만 확실하지 않고, 궁전이나 신전이라 단정할 건물은 찾지 못했다. 하라파는 1921년 다야 람 사니가, 모헨조다로는 1922년 R. D. 바네르지가 발굴을 시작했고 1924년 존 마셜이 이 문명의 존재를 세상에 알렸다. 인더스 평원 밖의 도시도 있었다. 구자라트 카치의 소금 사막(란) 가운데 하디르 섬에 자리한 돌라비라는 성채·중간 도시·아래 도시 셋으로 짜이고 벽돌뿐 아니라 사암 석재를 많이 쓴 점이 모헨조다로와 다르며, 계절에 따라 흐르는 두 하천의 물을 둑으로 막아 큰 저수 시설 여럿에 모았다(2021년 유네스코 세계유산). 같은 구자라트의 로탈에서는 구운 벽돌로 쌓은 길이 200m 남짓한 큰 못이 나와 발굴자 S. R. 라오는 조수를 이용한 부두라 보았으나 지금은 관개용 저수지라는 견해도 맞선다. 누가 어떤 체제로 도시를 다스렸는지는 문자가 풀리지 않아 알 수 없으며, 표준화된 벽돌과 추를 근거로 한 중앙 권력설과 도시마다 자치했다는 설이 맞선다. 메소포타미아·이집트와 같은 때 일어난 큰 강 문명이면서도 왕릉이나 큰 신전이 없다는 점이 이 문명의 특징으로 자주 꼽힌다."
  subjects: [indus-civilization]
  tags: [society, culture]
  sources: ["Jonathan Mark Kenoyer, Ancient Cities of the Indus Valley Civilization (Oxford University Press, 1998)", "Gregory L. Possehl, The Indus Civilization: A Contemporary Perspective (AltaMira Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: indus-seals-crafts-2280bc
  year: -2279
  title:
    ko: "인더스 인장과 풀리지 않은 문자, 수공업과 도량형(기원전 2600~1900 무렵)"
  summary:
    ko: "인더스 문명의 유적에서는 활석(스테아타이트)을 깎아 구워 만든 작은 인장이 수천 점 나온다. 모양은 대개 한 변이 2~3cm인 네모꼴에 뒤쪽 손잡이 구멍이 달렸고, 앞면에는 외뿔 짐승(흔히 '유니콘'이라 부른다)·혹소·코끼리·코뿔소·호랑이 같은 짐승과 짧은 글이 새겨져 있다. 점토 덩어리에 찍힌 자국이 함께 나오는 것으로 보아 물건 꾸러미나 창고를 봉하는 데 쓴 것으로 여겨진다. 글자(기호)는 목록에 따라 400가지 안팎으로 헤아리며, 한 줄은 대개 대여섯 글자이고 알려진 가장 긴 글도 스물예닐곱 기호에 그친다. 오른쪽에서 왼쪽으로 썼다는 해석이 널리 받아들여지고, 돌라비라 성문 근처에서는 큰 기호 열 개가 이어진 간판 같은 판이 나왔다. 이 문자는 아직 풀리지 않았다. 글이 너무 짧고, 뜻이나 소리를 알려 줄 두 언어 병기 비문이 없으며, 그 말이 어느 어족인지도 모르기 때문이다. 드라비다어 계통이라는 주장, 인도-아리아어 계통이라는 주장 등이 나왔으나 합의가 없고, 일부 연구자는 이 기호들이 말을 적은 문자가 아니라 신분이나 소유를 나타내는 상징 체계였다고 주장하지만 다수설은 아니다. 인더스 문명이 쇠퇴하면서 이 문자도 쓰이지 않게 되었고, 인도에서 다음으로 확실하게 읽히는 문자가 나오는 것은 1,600년 가까이 뒤인 아소카 시대의 일이다. 수공업도 높은 수준에 이르렀다. 홍옥수(카넬리안)에 구멍을 뚫고 산으로 무늬를 새긴 구슬, 조개를 켜서 만든 팔찌, 유약을 입힌 파이앙스, 물레로 빚어 붉은 바탕에 검은 무늬를 그린 도기가 도시 작업장에서 대량으로 만들어졌다. 구리는 라자스탄과 아라발리 산지에서 얻었고 비소·주석·납을 섞은 청동으로 도끼·칼·그릇을 만들었으며, 모헨조다로의 청동 '춤추는 소녀' 상은 밀랍 주조 기법을 보여 준다. 무게는 정육면체 돌추로 달았는데 단위가 1·2·4·8로 두 배씩 늘다가 큰 단위에서 십진으로 바뀌었고 같은 규격이 하라파에서 로탈까지 쓰였다. 로탈에서는 눈금 간격이 약 1.7mm인 상아 자가 나왔다. 돈이나 화폐로 쓰인 물건은 확인되지 않아 거래는 물물 교환이었을 것으로 짐작하며, 벽돌과 추의 규격을 정한 권위가 왕이었는지 상인 조직이었는지는 사료가 없어 알 수 없다."
  subjects: [indus-civilization]
  tags: [culture, economy]
  sources: ["Asko Parpola, Deciphering the Indus Script (Cambridge University Press, 1994)", "Gregory L. Possehl, The Indus Civilization: A Contemporary Perspective (AltaMira Press, 2002)", "Jonathan Mark Kenoyer, Ancient Cities of the Indus Valley Civilization (Oxford University Press, 1998)"]

- id: meluhha-trade-2260bc
  year: -2259
  title:
    ko: "메소포타미아의 '멜루하' 교역과 인더스 문명(기원전 2350~1900 무렵)"
  summary:
    ko: "기원전 2600년 무렵부터 도시를 이룬 인더스 문명은 먼 나라와도 거래했다. 수메르·아카드의 쐐기문자 기록에는 동쪽 먼 땅 '멜루하'에서 오는 물건 이야기가 나온다. 홍옥수 구슬, 청금석, 금, 상아, 이상한 목재와 새가 그것이고, 대다수 학자는 멜루하를 인더스 문명 지역으로 본다. 아카드를 세운 사르곤(재위 기원전 2334~2279 무렵)은 멜루하·마간(오만 일대)·딜문(바레인)의 배가 자기 도시 부두에 닿았다고 자랑했고, 기원전 2200년 무렵 인장에는 '멜루하 말의 통역관'이 나오며, 기원전 2100년 무렵 라가시 지방 문서에는 멜루하 사람들의 마을이 있었다고 적혀 있다. 반대로 인더스 인장과 추, 인더스식 구슬이 우르·키시·수사와 걸프의 바레인·파일라카 섬에서 나왔고, 인더스 지역에서는 메소포타미아 원통 인장이 드물게 나왔다. 청금석은 아프가니스탄 북부 바다크샨에서 났는데, 그곳 쇼르투가이에 인더스 문명의 교역 거점이 있었다. 오만의 구리와 딜문의 중개가 교역의 한 축이었다. 길은 바닷길과 이란 고원을 거치는 땅길이 함께 있었다고 보며, 어느 쪽이 더 중요했는지는 아직 논쟁이다. 교역은 기원전 1900년 무렵 인더스 도시들이 쇠퇴하면서 끊겼고, 멜루하라는 이름은 뒤에 에티오피아·누비아를 가리키는 말로 옮겨 갔다. 이 교역은 인더스 문명이 서아시아와 접촉했음을 보여 주는 거의 유일한 문자 기록이다. 아카드의 인장에 새겨진 '멜루하 말의 통역관'은 통역이 필요할 만큼 오가는 일이 잦았음을 보여 준다. 멜루하를 인더스 지역으로 보는 근거는 홍옥수와 청금석, 인더스식 인장이 나오는 유적의 분포와 맞아떨어진다는 점이다. 한편 인더스 쪽에는 이 교역을 직접 적은 글이 없어 거래 규모와 조직은 알기 어렵다."
  subjects: [indus-civilization]
  tags: [economy, diplomacy]
  sources: ["Shereen Ratnagar, Encounters: The Westerly Trade of the Harappa Civilization (Oxford University Press, 1981)", "Gregory L. Possehl, The Indus Civilization: A Contemporary Perspective (AltaMira Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: indus-religion-society-2300bc
  year: -2299
  title:
    ko: "인더스 문명의 종교와 사회, 풀리지 않는 물음(기원전 2300 무렵)"
  summary:
    ko: "문자가 풀리지 않아 인더스 사람들(기원전 2600~1900 무렵)의 믿음과 사회는 유물로만 짐작한다. 흙으로 빚은 여인상이 많이 나와 '어머니 여신' 숭배를 말하는 학자가 있고, 모헨조다로의 인장에 새겨진 뿔 달린 머리 장식의 앉은 인물은 발굴자 마셜이 '원시 시바'로 보아 '파슈파티(짐승의 주) 인장'이라는 이름이 붙었으나 이 해석은 추측이라는 비판이 많다. 보리수(핍팔) 나무 무늬와 혹소·외뿔 짐승을 새긴 인장, 칼리바간과 로탈에서 나온 불을 피운 흔적이 있는 단은 의례의 증거로 거론되지만 어느 것도 확정되지 않았다. 죽은 사람은 도기와 장신구를 곁에 두고 팔다리를 편 채 묻는 것이 보통이었다. 사회 구조도 논쟁거리다. 집의 크기와 구조가 비교적 고르고 궁전이나 왕릉, 전쟁 그림, 무기가 거의 없어서 평등한 사회였다고 보는 견해가 있다. 한편 장신구와 집 규모에 차이가 있고 성채가 따로 있다는 점을 들어 상인·장인·사제 같은 엘리트가 있었다고 보는 견해도 있다. 모헨조다로에서 '사제 왕'이라 불리는 수염 난 석상이 나왔으나 이름은 발굴자가 붙인 것이며 그가 실제로 사제였는지 왕이었는지는 알 수 없다. 이 시기의 서술에서는 뒷날의 힌두교와의 연속성을 찾으려는 시도가 많지만, 이를 증명할 글이 없다는 한계를 분명히 해야 한다. 물을 중시한 의례는 목욕 시설과 집집의 욕실, 하수도의 구조에서도 짐작되지만 이를 종교의 증거로 단정할 수는 없다. 목욕과 불, 보리수, 짐승을 숭배하는 풍습이 뒷날의 힌두교와 이어지는지는 학자마다 의견이 다르다. 장례 풍습에서도 부장품의 차이가 크지 않아 신분 차이가 뚜렷하지 않았다는 해석이 있다."
  subjects: [indus-civilization]
  tags: [religion, society]
  sources: ["Gregory L. Possehl, The Indus Civilization: A Contemporary Perspective (AltaMira Press, 2002)", "Jonathan Mark Kenoyer, Ancient Cities of the Indus Valley Civilization (Oxford University Press, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: indus-decline-1900bc
  year: -1899
  endYear: -1699
  title:
    ko: "인더스 도시의 쇠퇴와 후기 하라파(기원전 1900~1700 무렵)"
  summary:
    ko: "인더스 문명의 도시들은 기원전 1900년 무렵부터 쇠퇴해 기원전 1700년 무렵에는 대부분 버려졌다. 가장 널리 받아들여지는 설명은 기후 변화다. 여름 계절풍이 약해지면서 건조화가 진행되었고 가가르·하크라강 유역의 물이 줄었으며 강의 흐름도 바뀌어, 농사와 도시가 기대던 물이 불안정해졌다는 것이다. 한 가지 원인으로 설명하기는 어렵고 홍수, 교역망의 붕괴, 전염병 같은 요인이 거론된다. 1940년대에 모티머 휠러가 내놓은 '아리아인의 침입으로 도시가 파괴됐다'는 설은 모헨조다로에서 나온 유골이 한 번의 학살을 보여 주지 않고 시기도 서로 다르다는 점이 밝혀져 이제 받아들여지지 않는다. 쇠퇴 뒤에도 사람이 사라진 것은 아니다. 인장·문자·표준 추는 쓰이지 않게 되고 도시 계획과 하수도의 수준이 떨어졌지만, 하라파의 H 묘지, 신드의 즈쿠르 문화, 구자라트의 랑푸르 문화 같은 후기 하라파 문화가 기원전 1300년 무렵까지 이어졌다. 인구는 점차 동쪽의 펀자브·하리아나·갠지스–야무나 도아브와 남쪽의 구자라트·마하라슈트라로 옮겨 가 작은 마을에서 농사와 목축을 하며 살았다. 2019년 발표된 라키가르히 유골 한 구의 고대 DNA 분석은 이 도시 사람들의 계통이 뒤의 남아시아 사람들과 이어져 있음을 보여 준다고 해석된다. 도시 생활의 끝과 문명의 소멸은 구별해서 보아야 하며, 인더스 문명의 많은 요소가 뒤의 인도 문화에 이어졌다고 보는 학자가 많다. 최근에는 이 시기를 도시 문명이 갑자기 '무너졌다'기보다 큰 도시가 작은 마을로 흩어진 변화로 보는 경향이 있다. 인더스 지역에서는 오랫동안 문자가 쓰이지 않아 이야기를 전할 기록이 없어졌다."
  subjects: [indus-civilization]
  tags: [society]
  sources: ["Gregory L. Possehl, The Indus Civilization: A Contemporary Perspective (AltaMira Press, 2002)", "Jonathan Mark Kenoyer, Ancient Cities of the Indus Valley Civilization (Oxford University Press, 1998)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: indo-aryan-migration-2000bc
  year: -1999
  endYear: -1499
  title:
    ko: "인도-아리아어 사용 집단의 남아시아 이주(기원전 2000~1500 무렵)"
  summary:
    ko: "산스크리트와 이란어, 그리스어, 라틴어는 같은 인도·유럽어족에 든다. 이 가운데 인도-이란어파의 한 갈래인 인도-아리아어를 쓰는 집단이 중앙아시아에서 남아시아 북서부로 몇 차례에 나누어 들어왔다는 것이 언어학·고고학·고대 DNA 연구가 맞물려 학계 다수설을 이룬다. 시기는 기원전 2000~1500년 무렵으로 보는데, 그 앞 단계는 카스피해 북쪽 초원의 신타시타 문화(기원전 2200~1900 무렵)와 안드로노보 문화(기원전 2000~1450 무렵)이고, 이들은 중앙아시아 남부의 박트리아–마르기아나 문명권과 교류하며 일부 의례와 낱말을 받아들였다고 본다. 서아시아 쪽 증거로는 기원전 14세기 무렵 미탄니 왕국의 조약문에 인드라·미트라·바루나·나사티야 같은 신 이름이 나오고 말 조련서에 산스크리트와 닮은 낱말이 있어, 인도-아리아어를 쓰는 지배층이 시리아 북부에도 있었음을 보여 준다. 2019년 나라심한 등이 발표한 고대 DNA 연구는 기원전 2천 년대에 초원 계통의 유전 성분이 남아시아 북부로 들어온 것을 보였고, 같은 해 라키가르히의 유골 한 구에서는 이 성분이 나타나지 않았다고 보고되었다. 이는 침입군이 도시를 무너뜨린 사건이 아니라 오랜 기간 작은 집단이 느리게 퍼지고 현지 사람들과 섞인 과정으로 설명되며, 소수 엘리트가 언어를 퍼뜨렸다는 모형도 있다. 일부 학자와 정치적 주장은 인도·유럽어가 인도에서 퍼져 나갔다는 이른바 인도 기원설을 내세우나 언어학과 유전학 자료와 맞지 않는다는 반론이 많다. 아리아는 본래 언어 집단과 자기 부름 이름이지 인종 개념이 아니다. 이 이주는 인더스 문명이 쇠퇴하던 때와 겹치고, 뒤에 베다 시대 인도의 갠지스 평원 진출과 이어지며 쿠루·판찰라의 형성 과정으로 연결된다. 다만 이주의 구체적인 시기와 경로, 규모는 아직 연구가 진행 중이다."
  subjects: [indus-civilization, vedic-india]
  tags: [society, culture]
  sources: ["David W. Anthony, The Horse, the Wheel, and Language (Princeton University Press, 2007)", "Edwin Bryant, The Quest for the Origins of Vedic Culture: The Indo-Aryan Migration Debate (Oxford University Press, 2001)", "Vagheesh M. Narasimhan 외, 'The formation of human populations in South and Central Asia', Science 365 (2019)"]

- id: rigveda-1500bc
  year: -1499
  title:
    ko: "『리그베다』와 십왕 전쟁(기원전 1500 무렵)"
  summary:
    ko: "『리그베다』는 인도에서 가장 오래된 문헌으로, 기원전 1500~1000년 무렵 펀자브 일대에서 지어져 오랫동안 입으로만 전해졌다. 10권(만달라) 1,028편의 찬가, 약 1만 600구절로 이루어지며, 천둥과 전쟁의 신 인드라, 불의 신 아그니, 신주(神酒) 소마, 바루나·미트라·여명의 여신 우샤스 같은 신을 찬양한다. 베다 시대 인도 사람들은 일곱 강의 땅(사프타신두)과 사라스바티강을 노래하고, 소와 말, 전차를 중요하게 여기며 소를 빼앗는 싸움을 자주 했다. 사회는 부족(자나)과 그 우두머리인 라잔을 중심으로 짜였고, 부족 회의(사바·사미티)와 왕의 사제(푸로히타)가 정치에 관여했다. 7권의 노래는 파루슈니강(지금 라비강) 가에서 벌어진 '십왕 전쟁'을 전한다. 바라타족의 왕 수다스가 푸루족을 비롯한 열 부족의 연합을 물리쳤고, 이 싸움을 이끌고 노래한 사제 가문이 바시슈타였다. 뒤에 바라타와 푸루가 합쳐져 쿠루족이 되었다. 금속은 구리·청동을 뜻하는 말만 나오고 철은 뒤의 『아타르바베다』에서야 나타난다. 네 신분을 말하는 '푸루샤 찬가'(10권)는 가장 늦은 층에 속한다. 찬가는 가문별로 암송해 정확하게 전해졌고, 이 구전 전통은 2008년 유네스코 인류무형문화유산 대표 목록에 올랐고 『리그베다』 사본 30점은 2007년 세계기록유산이 되었다. 『리그베다』의 연대와 무대는 어족 이동 문제와 얽혀 있어 사료 해석이 갈리지만, 이 노래들이 남아시아 북서부에서 지어졌다는 점은 널리 받아들여진다. 찬가는 제사 때 읊는 노래로 사제 가문이 외워 전했고, 뒤의 후기 베다 시기에 『사마베다』와 『야주르베다』가 제사용으로 엮이면서 네 베다의 틀이 갖춰졌다. 『리그베다』의 신들은 이란의 『아베스타』와 닮은 점이 많아 인도·이란 공통 시기의 종교를 짐작하는 단서가 되며, 아수라와 데바의 위치가 두 전통에서 뒤바뀐다는 점도 자주 거론된다."
  subjects: [vedic-india]
  tags: [culture, religion]
  sources: ["Michael Witzel, 'Early Sanskritization: Origin and Development of the Kuru State', Electronic Journal of Vedic Studies 1-4 (1995)", "Edwin Bryant, The Quest for the Origins of Vedic Culture: The Indo-Aryan Migration Debate (Oxford University Press, 2001)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: later-vedic-1000bc
  year: -999
  title:
    ko: "후기 베다 시대: 갠지스 진출과 철기, 바르나(기원전 1000 무렵)"
  summary:
    ko: "기원전 1100년 무렵부터 기원전 500년 무렵까지를 후기 베다 시대라 부른다. 중심이 펀자브에서 갠지스–야무나 사이의 도아브로 옮겨 가고, 기원전 1000년 무렵부터 철 도끼와 쟁기가 쓰이면서 숲을 개간해 정착 농업이 자리 잡았다. 보리와 밀에 더해 벼가 재배되었고, 이 시기의 물질 문화는 회색 바탕에 검은 무늬를 그린 회색채도토기(기원전 1000~600 무렵)와 짝을 이룬다고 본다. 『사마베다』·『야주르베다』·『아타르바베다』가 엮이고, 의례를 풀이한 『브라마나』가 지어졌으며, 왕의 즉위식(라자수야)과 말 희생제(아슈바메다)처럼 비용이 많이 드는 제사가 왕의 권위를 높였다. 부족(자나)이 영토 국가(자나파다)로 바뀌어 가고, 바르나로 불리는 사회 구분이 제도로 굳어졌다. 사료에 적힌 바르나는 사제인 브라만, 무사인 크샤트리아, 평민인 바이샤, 이들에게 봉사하는 슈드라 넷이며, 뒤의 법전은 직업과 의무를 이 구분에 맞추어 정한다. 이 틀이 현실의 사회를 얼마나 그대로 반영했는지는 알 수 없고, 『샤타파타 브라마나』가 전하는 불의 신 이야기는 베다 문화가 동쪽 코살라·비데하 쪽으로 퍼져 간 과정을 신화로 담은 것으로 읽힌다. 이 시기 베다 시대 인도 사회는 부족 사회에서 국가로 가는 길목에 서 있었고, 왕을 도와 세금을 걷는 관리와 군대도 나타났다. 집안의 불을 지키고 조상에게 바치는 제사가 가정 의례(그리햐)로 정해졌고 생애 주기 의례도 생겼다. 제사의 형식이 복잡해지면서 사제의 힘이 커졌고, 이에 맞서는 사상이 뒤이어 나타난다. 철기 사용과 인구 증가는 도아브 일대 마을의 수를 크게 늘렸다. 이 시기의 변화가 뒤의 16대국을 낳은 사회의 바탕이 된다."
  subjects: [vedic-india]
  tags: [society, religion, economy]
  sources: ["Michael Witzel, 'Early Sanskritization: Origin and Development of the Kuru State', Electronic Journal of Vedic Studies 1-4 (1995)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: kuru-panchala-900bc
  year: -899
  title:
    ko: "쿠루와 판찰라: 베다 문화의 중심(기원전 900 무렵)"
  summary:
    ko: "베다 시대 인도 후기의 정치 중심은 갠지스–야무나 도아브 위쪽의 쿠루 왕국이었다. 쿠루는 『리그베다』의 바라타·푸루 부족이 합쳐져 생긴 부족 국가에서 출발해 기원전 1200~900년 무렵 힘을 키웠다. 『아타르바베다』가 '쿠루족의 왕'으로 찬양하는 파리크시트와 그 아들로 말 희생제를 지냈다고 『샤타파타 브라마나』가 전하는 자나메자야가 이 왕국의 대표적인 왕이다. 쿠루의 브라만들은 흩어져 있던 찬가를 모아 정리하고 대규모 제사 의례(슈라우타)를 체계화했다고 여겨지며, 뒤의 문헌이 말하는 '가장 순수한 말'의 땅이라는 평판도 여기서 나왔다. 고고학에서는 쿠루 땅이 회색채도토기 문화권과 겹치고, 하스티나푸라 유적에서 이 시기 층이 나온다. 뒤의 전승은 하스티나푸라가 홍수로 무너져 쿠루 왕가가 코삼비로 옮겼다고 전하나 베다 시대의 글에는 그 이야기가 없다. 쿠루는 비(非)베다 부족으로 여겨지는 살바족의 공격을 받아 쇠퇴했고, 문화의 중심은 동쪽의 판찰라로 옮겨 갔다. 판찰라 왕 케신 달비아(기원전 900~750 무렵)는 마지막 쿠루 왕의 조카로 전해진다. 『마하바라타』는 쿠루 왕가 안의 두 갈래가 싸운 이야기로, 기원전 1000년 무렵의 갈등이 기억에 남은 것일 수 있다고 보지만 고고학으로 확인된 사건은 아니며, 지금 전하는 글은 기원전 400년 무렵부터 기원후 400년 무렵 사이에 완성되었다. 쿠루와 판찰라 두 이름은 뒤에 16대국의 이름으로 다시 나타난다. 쿠루의 땅 쿠룩셰트라는 뒤에 힌두 전통에서 성지가 되었고, 이곳에서 정리된 제사 문헌은 뒤의 여러 베다 학파에 영향을 주었다. 두 왕국의 이야기는 베다 문헌 곳곳에 흩어져 있어 연속된 역사로 보기는 어렵다."
  subjects: [vedic-india]
  tags: [politics, culture]
  sources: ["Michael Witzel, 'Early Sanskritization: Origin and Development of the Kuru State', Electronic Journal of Vedic Studies 1-4 (1995)", "John Brockington, The Sanskrit Epics (Brill, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: vedanga-sulba-800bc
  year: -799
  title:
    ko: "베당가와 슐바 수트라, 제사에서 나온 학문(기원전 800 무렵)"
  summary:
    ko: "베다 시대 인도에서는 제사를 정확히 지내기 위한 보조 학문이 발달해 '베다의 팔다리'라는 뜻의 베당가(Vedanga) 여섯이 정리되었다. 발음을 다루는 시크샤, 운율의 찬다스, 문법의 비야카라나, 낱말 뜻풀이의 니룩타(파니니보다 앞선 기원전 7~5세기 무렵의 야스카가 대표), 천문과 길일을 헤아리는 지요티샤, 의례 규정의 칼파이다. 이 가운데 칼파에는 큰 제사를 규정한 슈라우타 수트라, 가정 의례의 그리햐 수트라, 법과 의무의 다르마 수트라와 함께 제단 쌓는 법을 다룬 슐바 수트라가 들어 있다. 슐바는 '줄'을 뜻하며 제단을 재는 끈에서 온 이름이다. 바우다야나·아파스탐바·카티야야나 같은 이름으로 전하는 슐바 수트라는 기원전 800~500년 무렵에 만들어졌다고 보는데, 정사각형 제단과 새 모양 제단을 쌓으려면 넓이를 바꾸지 않고 도형을 바꾸는 계산이 필요했고, 직사각형 대각선 위의 정사각형 넓이가 두 변 위의 정사각형 넓이의 합과 같다는 규칙(흔히 피타고라스 정리라 부른다)이 서술되어 있다. 정사각형 대각선의 길이를 변의 약 1.41421배로 매우 정확하게 어림한 값도 나온다. 천문학에서는 5년을 한 주기로 해와 달의 운행을 맞추는 지요티샤의 달력이 전하나 연대는 불확실하다. 이 학문들은 제사를 정확히 지내려는 필요에서 시작되었고, 사제 가문이 외워 전하는 과정에서 다듬어졌다. 제단의 방향을 맞추려면 해와 별의 위치를 알아야 했고 이것이 천문학의 씨앗이 되었으며, 낱말과 소리를 정확히 보존하려는 노력은 파니니 문법으로 이어졌다. 이처럼 인도의 수학·언어학·천문학은 종교 의례에서 시작되어 자라났다. 이 지식은 모두 구전으로 이어지다 뒤에 글로 정리되었다."
  subjects: [vedic-india]
  tags: [culture, religion]
  sources: ["Kim Plofker, Mathematics in India (Princeton University Press, 2009)", "Hartmut Scharfe, Grammatical Literature (A History of Indian Literature, vol. 5, fasc. 2; Otto Harrassowitz, 1977)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: upanishads-650bc
  year: -649
  endYear: -600
  title:
    ko: "우파니샤드: 아트만과 브라만, 윤회와 해탈의 물음(기원전 650~600 무렵)"
  summary:
    ko: "베다 시대 인도 후기, 제사 중심의 베다 종교 안에서 제사의 뜻을 따져 묻는 철학 문헌이 나타났다. 우파니샤드(가까이 앉는다는 뜻으로 스승 곁에서 전해 들은 가르침)이다. 가장 오래된 『브리하다라냐카』와 『찬도기아』는 기원전 7~6세기 무렵 앞뒤 한 세기 안팎에 지어졌다고 보는 견해가 널리 받아들여지지만, 주요 우파니샤드 전체는 기원전 800~300년 무렵에 걸쳐 지어졌다고 보며 학자에 따라 더 늦은 연대를 내기도 한다. 대표 인물은 야지냐발키아, 웃달라카 아루니와 그의 아들 슈웨타케투이고, 비데하의 왕 자나카가 철학자들을 불러 모았다고 전한다. 가르가와 마이트레이 같은 여성도 토론자로 등장한다. 핵심 개념은 우주의 근원인 브라만과 개인의 자아인 아트만이 같다는 생각('그것이 너다')이다. 사람은 행위(카르마)에 따라 죽은 뒤 다시 태어나는 윤회(삼사라)를 되풀이하고, 참된 앎으로 이 흐름에서 벗어나는 것이 해탈(목샤)이라는 가르침이 이 시기에 정리되었다. 이 사상은 바라문교의 철학이 되어 뒤의 힌두교 철학에 이어졌다. 같은 갠지스 평원 동부에서 나타난 불교와 자이나교가 아트만의 존재를 부정하거나 베다 권위를 받아들이지 않은 점과 견주어 보는 연구가 많으며, 어느 쪽이 앞서 영향을 주었는지는 학자마다 다르다. 이 가르침은 쿠루–판찰라에서 비데하로 옮겨 간 베다 문화의 새 중심에서 나왔다는 점에서도 중요하다. 우파니샤드는 제사 중심의 베다 종교에서 지혜 중심의 사색으로 무게를 옮겼다고 평가된다. 뒤에 나온 베단타 학파가 이 가르침을 체계화했고, 샹카라의 주석으로 이어진다. 이 사상은 뒤의 사상가들이 해석을 달리하며 여러 학파로 나뉜다."
  subjects: [vedic-india]
  tags: [religion, culture]
  sources: ["Patrick Olivelle, The Early Upanisads: Annotated Text and Translation (Oxford University Press, 1998)", "Johannes Bronkhorst, Greater Magadha: Studies in the Culture of Early India (Brill, 2007)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]
- id: mahajanapadas-600bc
  year: -599
  title:
    ko: "16대국의 시대: 불전이 전하는 열여섯 나라(기원전 600 무렵)"
  summary:
    ko: "기원전 6세기 무렵 갠지스 평원과 그 둘레에는 '마하자나파다(큰 나라)'라 불린 열여섯 나라가 있었다. 불교 경전 『앙굿타라 니카야』는 앙가·마가다·카시·코살라·밧지·말라·체디·바트사·쿠루·판찰라·마츠야·수라세나·아스마카·아반티·간다라·캄보자를 꼽고, 다른 경전과 자이나교 문헌, 푸라나의 목록은 이름과 순서가 조금씩 다르다. 이 열거는 모두 훨씬 뒤에 엮은 글이라서 나라마다 실제 경계는 알 수 없고, 나라 이름과 도읍 이름에 기대어 어림할 뿐이다. 북쪽의 간다라(탁실라)와 캄보자는 서북쪽에 있었고, 아스마카(도읍 포타나)는 고다바리강 가에서 16대국 가운데 가장 남쪽에 있었다. 코살라(도읍 슈라바스티·아요디아)와 바트사(코삼비), 판찰라(아히차트라·캄필랴), 아반티(우자인)와 밧지(바이샬리)도 이 목록에 든다. 정치 형태는 왕이 다스리는 나라가 대부분이었고, 밧지와 말라 같은 곳은 여러 씨족이 회의로 다스리는 연맹이었다. 바탕에는 철제 농기구로 갠지스 평원 동쪽의 숲과 습지를 개간해 늘어난 농업 생산이 있었고, 도시와 시장, 세금을 걷는 관리와 상비군이 나타났다. 나라들은 서로 땅을 뺏고 사위·장인으로 얽히며 다투었고, 곧 마가다가 가장 강해졌다. 이 시대의 서술은 붓다와 마하비라가 살던 때를 배경으로 삼은 후대 글에 기대고 있다는 한계가 있다. 이 가운데 코살라·바트사·판찰라·밧지·아반티·아스마카는 뒤 사건들에 이어 나오는 나라들이며, 마가다는 조금 뒤 힘을 키운다. 이 나라들이 언제 생겼는지는 알려져 있지 않고, 불전이 가장 일찍 열거하는 때로 기원전 6세기 무렵을 잡을 뿐이다. 이 목록을 기준으로 이 시대를 흔히 '16대국 시대'라 부른다."
  subjects: [kosala-kingdom, vatsa-kingdom, panchala-kingdom, vajji-confederacy, avanti-kingdom, assaka-kingdom]
  tags: [politics]
  sources: ["Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "F. R. Allchin, The Archaeology of Early Historic South Asia: The Emergence of Cities and States (Cambridge University Press, 1995)"]

- id: gana-sangha-550bc
  year: -549
  title:
    ko: "가나상가: 밧지 연맹과 공화정 나라들(기원전 550 무렵)"
  summary:
    ko: "16대국 가운데 일부는 왕이 아닌 씨족 회의가 다스렸다. 이런 나라를 가나(무리) 또는 상가(모임)라 부르며, 갠지스강 북쪽 히말라야 기슭의 밧지(밧지는 팔리어 이름, 산스크리트 브리지)·말라·샤캬·콜리야 등이 이에 든다. 가장 큰 밧지 연맹은 바이샬리를 중심으로 리차비족을 비롯한 여덟 씨족이 모인 연합체였다고 하며, 자이나교의 마하비라가 그 가까이에서 태어났다고 전한다. 정치는 회의장(산타가라)에서 열리는 집회에서 이루어졌고, 지도자는 '라자(왕)'라 불리는 씨족 어른들이 번갈아 맡았다. 붓다는 마지막 여행에서 밧지가 자주 모이고, 어른을 공경하고, 옛 법을 따르는 동안 번영할 것이라 말했다고 『마하파리닛바나 숫타』가 전하며, 학자들은 불교 승가가 회의로 운영되는 방식이 이런 공화정의 관행과 닮았다고 본다. 반대로 마가다 같은 왕국은 이들을 회의로는 막기 어려운 이웃으로 보고 이간책과 전쟁으로 무너뜨렸다. 밧지는 이웃 코살라나 마가다와 맞서야 했다. 이 공화정의 구성원은 씨족 상층의 크샤트리아에 한정되어 오늘의 민주정과는 거리가 멀다. 이 나라들은 사료가 불전과 자이나 경전에 거의 한정되어 있어 구체적인 제도는 알 수 없다. 자이나교와 불교가 같은 지역에서 일어난 점을 이런 공화정 사회와 관련지어 설명하는 학자가 많다. 신분제의 틀이 느슨한 곳에서 브라만의 권위에 도전하는 사상이 나오기 쉬웠다는 것이다. 한편 마가다 같은 왕국은 군대와 세금으로 지탱하는 중앙 집권이 더 효율적이어서 결국 이 나라들을 흡수했다. 공화정의 경험은 뒤의 인도 정치 사상에도 흔적을 남겼다고 보는 학자도 있다. 이 시대에 회의로 다스린 나라가 실제로 몇 곳이었는지도 확정되지 않았다."
  subjects: [vajji-confederacy]
  tags: [politics, society]
  sources: ["R. S. Sharma, Aspects of Political Ideas and Institutions in Ancient India (Motilal Banarsidass, 1959)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: taxila-gandhara-550bc
  year: -549
  endYear: -325
  title:
    ko: "탁실라: 간다라의 학문과 교역 중심(기원전 550~326)"
  summary:
    ko: "탁실라는 지금 파키스탄 펀자브 북부 이슬라마바드 가까이에 있던 간다라의 도시로, 인더스강에서 서아시아와 중앙아시아로 가는 길목에 있었다. 발굴된 비르 마운드 유적은 기원전 6세기 무렵부터 사람이 살았음을 보여 주며, 뒤에 시르캅(기원전 2세기 그리스계 도시)과 시르수크(쿠샨 시대)로 도읍이 옮겨 갔다. 불전은 간다라 왕 푸카사티가 마가다 왕 빔비사라와 사절을 주고받았다고 적고, 빔비사라의 주치의 지바카가 탁실라에서 일곱 해 동안 의학을 배웠다고 전한다. 이 이야기들은 후대 불전의 서술이다. 이 지역은 기원전 6세기 후반 아케메네스 제국에 편입되어 간다라 또는 힌두시에 속했고, 제국의 행정어인 아람어가 퍼졌으며 여기서 나온 카로슈티 문자가 간다라에서 쓰였다고 본다. 탁실라의 학문은 베다와 의학, 군사, 문법 같은 분야로 알려져 파니니와 카우틸랴(찬드라굽타의 스승이라는 전승)가 이곳과 이어진다고 전해지지만 사료가 후대의 것이어서 확인하기 어렵다. 탁실라는 서쪽과 동쪽의 물건과 사상이 오가는 중개지였다. 기원전 326년 알렉산드로스가 인더스강을 건너오자 그곳의 왕 탁실레스(암비)는 맞서지 않고 코끼리와 가축을 바치며 그를 맞았는데, 이웃 포로스와의 다툼에서 마케도니아 군의 힘을 빌리려는 뜻이 있었다고 아리아노스 등 그리스 사가는 전한다. 이후 탁실라는 마우리아의 총독 도시, 인도-그리스와 쿠샨의 도시로 이어진다. 이 도시의 학문 중심지라는 평판은 후대 전승이 부풀렸다는 의견도 있어, 발굴로 확인된 대학 건물은 없다. 아케메네스 시대의 탁실라는 서쪽의 이란 고원과 동쪽의 갠지스 평원을 잇는 북로(웃타라파타)의 서쪽 끝이었고, 마가다의 상인들도 이 길로 서북쪽과 거래했다."
  subjects: [achaemenid-empire, macedonia-kingdom, magadha-kingdom]
  tags: [culture, economy]
  sources: ["John Marshall, Taxila: An Illustrated Account of Archaeological Excavations (Cambridge University Press, 1951)", "Arrian(아리아노스), Anabasis Alexandri, trans. P. A. Brunt (Loeb Classical Library, Harvard University Press, 1976–1983)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: bimbisara-magadha-544bc
  year: -543
  title:
    ko: "빔비사라와 마가다 왕국의 성장(기원전 544~492 무렵)"
  summary:
    ko: "마가다는 갠지스강 중류 남쪽, 지금의 비하르 남부에 있던 나라로 하리앙카 왕조의 빔비사라(재위 기원전 544~492 무렵, 후대 불교 연대기 『마하밤사』의 연표)가 이끌며 커지기 시작했다. 도읍은 산으로 둘러싸인 라자그리하(옛 이름 기리브라자)였다. 빔비사라는 동쪽 앙가의 왕을 꺾고 참파를 차지해 아들 아자타샤트루를 그곳 총독으로 삼았다고 전한다. 또 혼인으로 이웃과 엮었는데, 불전은 코살라 왕 파세나디(프라세나지트)의 누이가 그의 아내가 되어 카시의 한 마을을 지참금으로 받았고, 밧지의 리차비 집안과 마드라의 왕녀도 아내로 맞았다고 적는다. 서북쪽 간다라의 푸카사티 왕과 사신을 주고받았고, 서쪽의 아반티 왕 프라디요타가 병들자 의사 지바카를 보냈다고도 한다. 자신은 붓다를 후원해 대나무 숲 정사(벨루바나)를 기증했고, 자이나교 문헌은 그를 마하비라의 신자 세닛카로 적는다. 마가다가 성장한 배경으로는 구리와 철이 나는 산지와 갠지스·손강의 수운, 기름진 평야가 꼽힌다. 말년의 일은 전승이 갈리는데, 불전은 아들 아자타샤트루가 아버지를 가두어 죽였다고 전한다. 빔비사라와 아자타샤트루의 재위는 붓다의 연대에 맞추어 학자마다 다르게 헤아린다. 위키백과 영어판은 기원전 544~492년을 쓰지만 단기 연표를 따르면 기원전 5세기 후반이 된다. 불전은 그가 마을 8만 곳의 촌장을 모아 회의를 열었다고 전하는데 숫자는 과장으로 보며, 농민에게서 곡물로 세금을 거두는 체계가 일찍 잡혀 있었음을 시사한다. 라자그리하의 오래된 성도 그의 시기에 새로 쌓았다고 한다. 마가다의 이런 성장은 다음 왕 아자타샤트루 때 더 빨라진다. 앙가의 참파는 갠지스강 하류와 이어지는 항구여서 마가다가 동쪽 바다 교역에 다가서는 발판이 되었다."
  subjects: [magadha-kingdom, kosala-kingdom]
  tags: [politics, war, diplomacy]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)"]

- id: pradyota-avanti-540bc
  year: -539
  title:
    ko: "프라디요타의 아반티와 바트사 왕 우다야나(기원전 540 무렵)"
  summary:
    ko: "서인도 말와 지방의 아반티는 16대국 가운데 마가다와 겨룬 서쪽의 강국이었다. 도읍은 북쪽의 우자인과 남쪽의 마히슈마티(나르마다강 가)였고, 우자인이 통합 도읍이 되었다. 푸라나의 계보에서 프라디요타(불전은 '잔혹한 파조타'라 부름)는 아버지 풀리카가 옛 왕을 죽이고 아들을 왕위에 앉히는 방식으로 기원전 546년 무렵 즉위했고 재위 23년이라고 한다. 그 뒤로 팔라카(523~499 무렵), 비샤카유파(499~449), 아자카(449~428), 난디바르다나(428~408)가 이어져 이 왕조는 모두 다섯 왕에 138년이라고 푸라나는 헤아린다. 푸라나의 햇수는 어긋나는 곳이 많아 이 연표는 어림이며, 그 끝인 기원전 408년은 마가다가 아반티를 합친 해(기원전 414~413 무렵)와 몇 해 어긋난다. 프라디요타는 밧지의 리차비 왕녀 시바와 혼인하고 바르카치(지금 브로치) 항구를 얻어 서아시아와의 바다 교역에 접근했다. 이웃 바트사(도읍 코삼비)의 왕 우다야나와 싸워 그를 사로잡았다가 풀어 주고 딸 바사바닷타와 혼인시켰다는 이야기를 자이나 전승과 후대 희곡이 전한다. 또 간다라와 싸워 졌다고 전하고, 마가다를 칠 준비를 해 아자타샤트루가 라자그리하의 성벽을 보강했다는 불전의 이야기가 있다. 이처럼 아반티·바트사·마가다는 서로 위협하며 국경을 맞댔다. 아반티는 마가다의 시슈나가에게 무너질 때까지 서인도의 중심이었다. 우자인에서는 기원전 6세기 무렵의 흙 성벽과 해자를 두른 도시 유적이 발굴되어 이 나라의 도읍이 일찍부터 번영했음을 보여 준다. 프라디요타 왕조의 사실은 푸라나와 불전, 자이나 문헌, 후대 희곡의 이야기를 이어 붙인 것이어서 왕의 이름과 순서가 확정되지는 않았다. 아반티의 이런 팽창은 마가다가 서쪽으로 눈을 돌리게 한 배경이었다."
  subjects: [avanti-kingdom, vatsa-kingdom, magadha-kingdom]
  links:
    - { from: avanti-kingdom, to: vatsa-kingdom, note: "프라디요타가 바트사의 우다야나를 사로잡았다가 풀어 주고 사위로 삼았다고 전함 (기원전 540 무렵)" }
  tags: [politics, war]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: second-urbanization-500bc
  year: -499
  title:
    ko: "제2의 도시화: 갠지스 평원의 철제 농기구·화폐·상인(기원전 500 무렵)"
  summary:
    ko: "인더스 문명의 도시가 사라진 뒤 천 년 넘게 남아시아에는 큰 도시가 거의 없다가, 기원전 6~5세기 무렵 갠지스 평원에서 도시가 다시 나타났다. 이를 제2의 도시화라 부른다. 원동력은 철제 도끼와 쟁기를 쓰고 벼를 심어 늘어난 농업 잉여다. 마가다의 라자그리하, 코살라의 슈라바스티, 바트사의 코삼비, 바라나시, 바이샬리, 아반티의 우자인, 탁실라 같은 곳이 도시로 자랐고, 해자와 성벽을 두른 곳이 많았다. 이 시기 유적에는 광이 나는 검은 도기(북방흑색마연도기, 기원전 700~200 무렵)가 널리 나온다. 은 조각에 도장을 찍은 최초의 화폐인 타각 화폐(카르샤파나)가 기원전 6~5세기부터 쓰였다고 보며, 이는 상업이 늘었음을 보여 준다. 불전은 '가하파티(집을 가진 사람)'라 불린 부유한 평민과 직업별 조합(슈레니)을 말하고, 이들은 붓다와 마하비라의 가장 든든한 후원자가 되었다. 대표적인 상인 아나타핀디카는 코살라의 슈라바스티에서 기원정사(제타바나)를 기증했다고 전한다. 교역로는 서북쪽 탁실라로 가는 북로(웃타라파타)와 남쪽 데칸으로 가는 남로(닥시나파타)가 있었다. 철광이 가깝던 마가다는 이 이익을 독점해 강해졌다. 이 사회 변화는 제사 중심의 바라문교에 맞선 불교·자이나교가 나타난 배경으로 자주 꼽힌다. 다만 이 시대 도시의 규모와 인구는 발굴이 제한되어 있어 알 수 없는 부분이 많다. 도시를 연결한 것은 갠지스강과 그 지류의 뱃길이었다. 강가의 파탈리가마와 바라나시는 곡물과 직물, 철을 실어 날랐고, 서북쪽 탁실라는 아케메네스 제국의 길과 이어져 서아시아의 물품이 들어왔다. 도시의 신분 차이는 컸고 노예와 하인(다사)도 있었다. 이 도시들의 위치는 뒤에 마우리아와 굽타의 중심지로 이어진다."
  subjects: [magadha-kingdom, kosala-kingdom, vatsa-kingdom, avanti-kingdom]
  tags: [economy, society]
  sources: ["F. R. Allchin, The Archaeology of Early Historic South Asia: The Emergence of Cities and States (Cambridge University Press, 1995)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: buddha-500bc
  year: -499
  title:
    ko: "붓다와 불교의 시작: 생몰 연대의 논쟁(기원전 500 무렵)"
  summary:
    ko: "불교를 연 고타마 싯다르타(붓다)는 히말라야 기슭 샤캬족의 나라에서 태어났다고 한다. 아소카의 룸비니 기둥 비문이 그곳을 탄생지로 기린다. 불전은 그가 스물아홉에 집을 떠나 6년 수행 끝에 보드가야의 보리수 아래에서 깨달음을 얻고 사르나트에서 첫 설법을 했다고 한다(초전법륜). 가르침의 뼈대는 괴로움의 원인과 소멸을 가르치는 사성제, 그 길로 제시한 팔정도, 극단을 피하는 중도, 모든 것이 인연으로 생겨나고 변한다는 무상과 연기, 영원한 자아가 없다는 무아다. 그는 마가다 왕 빔비사라와 코살라 왕 파세나디의 후원을 받았고 상인들이 기증한 정사(벨루바나·제타바나)에서 우기를 보내며 신분을 따지지 않고 출가자를 받았다. 신분제를 부정한 것은 아니고 출신보다 행위를 중시했다고 해석한다. 마지막은 쿠시나가라에서 맞았고 그 일을 열반(파리닛바나)이라 한다. 생몰 연대는 학자마다 크게 다르다. 20세기 초에는 기원전 563~483년이 널리 쓰였고, 스리랑카와 동남아 전통은 기원전 624~544년이며, 인도 쪽 자료에 기대면 열반이 기원전 5세기 말~4세기 초(기원전 368년)로 내려간다. 1988년 독일의 학술 모임에서 많은 발표자가 열반을 기원전 400년 앞뒤 20년 안에 둔 뒤 이 연대가 힘을 얻었으나 합의는 없다. 그래서 빔비사라와 아자타샤트루의 재위 연대도 함께 달라진다. 붓다 자신의 말은 그가 죽은 뒤 수백 년 동안 구전되었으므로 글로 전하는 모습은 후대의 정리다. 불교는 붓다 생전부터 상인과 왕족의 후원 속에 갠지스 평원 곳곳으로 퍼졌고, 교단은 비구와 비구니, 재가 남녀 신자로 이루어졌다. 붓다가 쓴 말은 마가다 지방의 속어에 가까웠다고 전하며, 산스크리트로 가르침을 적지 않았다는 점도 바라문교와 구별된다."
  subjects: [magadha-kingdom, kosala-kingdom]
  tags: [religion, culture]
  sources: ["Heinz Bechert (ed.), The Dating of the Historical Buddha (Vandenhoeck & Ruprecht, 1991–1992)", "Richard Gombrich, Theravada Buddhism: A Social History from Ancient Benares to Modern Colombo (Routledge, 1988)", "Étienne Lamotte, History of Indian Buddhism: From the Origins to the Saka Era, trans. Sara Webb-Boin (Institut Orientaliste, Louvain-la-Neuve, 1988)"]

- id: mahavira-500bc
  year: -499
  title:
    ko: "마하비라와 자이나교의 성립(기원전 500 무렵)"
  summary:
    ko: "자이나교의 24대 티르탕카라(길을 연 스승) 마하비라(본명 바르다마나)는 비데하의 쿤다그라마, 곧 바이샬리 가까운 곳에서 태어났다고 한다. 아버지는 즈냐트리카 씨족의 지도자였고 어머니 트리샬라는 밧지 연맹의 리차비 가문 출신으로 전한다. 서른 살에 집을 떠나 열두 해 동안 고행한 끝에 깨달음(케발라 즈냐나)을 얻고 서른 해 남짓 가르침을 폈다고 한다. 가르침의 핵심은 어떤 생명도 해치지 않는 불살생(아힘사), 거짓말하지 않음, 훔치지 않음, 성적 절제, 소유하지 않음의 오계이며, 이전의 파르슈바나타 때는 넷이었다고 한다. 업이 영혼에 쌓여 윤회가 일어나므로 고행과 계율로 업을 씻어야 해탈한다고 가르쳤고, 베다의 권위와 제사, 신이 세상을 만들었다는 생각은 받아들이지 않았다. 불교와 달리 영혼의 존재를 인정한다. 승단은 남녀 출가자와 재가 신자 넷으로 이루어졌다. 자이나교 문헌은 마가다의 빔비사라와 아자타샤트루를 그의 신자로 적는데, 불교 문헌도 같은 두 왕을 붓다의 신자로 적어 서로 겹친다. 생몰 연대는 전통으로는 기원전 599~527년(백의파)이나 510년(공의파)이고, 일부 학자는 기원전 549년 태어나 468~467년 무렵 죽었다고 하며 던다스는 기원전 425년 앞뒤로 내린다. 교단은 뒤에 옷을 입는 백의파와 벗고 지내는 공의파로 갈라졌다. 이 교단은 상인 계층의 후원을 받아 오늘까지 이어진다. 자이나교는 불살생을 엄격히 지켜 농사를 피하고 상업과 금융에 종사하는 신자가 많았는데, 이 점이 뒤에 서인도 상인 사회에 뿌리내린 배경으로 설명된다. 24명의 티르탕카라 가운데 앞의 22명은 신화적 인물로 여겨지고 파르슈바나타부터 역사적 인물로 보는 견해가 있다."
  subjects: [vajji-confederacy, magadha-kingdom]
  tags: [religion, culture]
  sources: ["Paul Dundas, The Jains (Routledge, 2002)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: sramana-teachers-500bc
  year: -499
  title:
    ko: "슈라마나 운동과 여섯 스승, 아지비카(기원전 500 무렵)"
  summary:
    ko: "기원전 6~5세기 갠지스 평원 동부에서는 가정을 떠나 걷고 가르치며 사는 수행자들이 크게 늘었다. 이들을 슈라마나(노력하는 사람)라 부르며, 베다의 제사와 브라만의 권위를 중심에 두지 않았다는 점에서 바라문교의 사제와 구별된다. 동부 마가다·코살라 일대에서 일어난 이 사상의 흐름을 '대(大) 마가다' 문화로 부르는 학자도 있다. 불전 『사만냐팔라 숫타』는 마가다 왕 아자타샤트루가 붓다를 찾아가 당대의 여섯 스승을 평하는 장면을 전하는데, 이는 불교 쪽 기록이다. 푸라나 캇사파는 선악의 업이 없다고 했고, 막칼리 고살라는 모든 것이 정해진 질서(니야티)에 따라 일어난다고 하여 아지비카를 이끌었으며, 아지타 케사캄발린은 사람이 죽으면 몸이 흙으로 돌아갈 뿐이라는 유물론을 폈다고 한다. 파쿠다 캇차야나는 일곱 요소가 변하지 않는다고 보았고, 산자야는 어느 쪽도 단정하지 않는 회의론을 폈으며, 니간타 나타풋타는 자이나교의 마하비라로 알려져 있다. 아지비카는 뒤에 마우리아 왕실의 후원도 받았으나 자기 문헌이 남지 않아 상대 종교의 기록으로만 전해지고 중세에 사라졌다. 이 사상가들의 문제의식은 업과 윤회, 해탈 같은 물음이었고 우파니샤드의 철학과 같은 시대에 나란히 전개되었다. 이 운동은 신분이 아니라 행위로 사람을 평가하자는 주장을 세웠다는 점에서 뒤의 불교와 자이나교의 출발점이다. 베다 전통의 바깥에서 일어난 이 사상들은 서로 논쟁하며 자랐고, 불교의 사성제와 무아, 자이나교의 업론도 이 토론의 틀 안에서 만들어졌다. 신흥 도시의 상인과 장인이 수행자에게 시주해 생활을 도왔다. 여섯 스승의 가르침은 모두 상대편 문헌을 통해서만 알려진다."
  subjects: [magadha-kingdom, kosala-kingdom]
  tags: [religion, society]
  sources: ["A. L. Basham, History and Doctrines of the Ajivikas (Luzac, 1951)", "Johannes Bronkhorst, Greater Magadha: Studies in the Culture of Early India (Brill, 2007)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: mahajanapadas-500bc
  year: -499
  title:
    ko: "기원전 500 무렵의 판도: 마가다·코살라·바트사·아반티와 그 이웃"
  summary:
    ko: "기원전 500년 무렵 갠지스 평원의 힘의 균형은 네 나라와 그 둘레로 짜였다. 동쪽의 마가다는 빔비사라가 동쪽 앙가를 합쳐 갠지스강 남쪽 비하르 일대를 차지했고 라자그리하를 도읍으로 삼았다. 서북쪽 갠지스강 북쪽의 코살라는 슈라바스티를 도읍으로, 카시(바라나시)를 지참금과 정복으로 얻어 가장 부유한 나라 가운데 하나였다. 두 나라는 혼인으로 얽혀 있었으나 카시를 놓고 다투기도 했다. 갠지스와 야무나가 만나는 곳의 바트사는 코삼비를 도읍으로 삼았고 서쪽의 아반티와 마가다 사이에서 줄타기를 했다. 아반티는 우자인과 마히슈마티를 아우르며 말와와 나르마다 골짜기를 다스렸다. 판찰라는 쿠루가 쇠퇴한 뒤 베다 문화의 전통을 이었으나 힘은 약해진 상태였고, 북판찰라는 아히차트라, 남판찰라는 캄필랴를 도읍으로 삼았다. 갠지스강 북쪽의 밧지 연맹은 바이샬리를 중심으로 리차비 등이 회의로 다스렸다. 데칸 북서쪽의 아스마카는 고다바리강 중류에서 포타나를 도읍으로 삼았다. 여기에 쿠루·수라세나·마츠야·체디·말라·카시 같은 작은 나라와 서북쪽의 간다라·캄보자가 있었다. 이 판도는 불전과 푸라나가 말한 지명에서 거꾸로 어림한 것이어서 경계선과 나라 수는 확정할 수 없다. 이어지는 한 세기 동안 마가다는 밧지를 합치고, 코살라와 아반티를 흡수해 갠지스 평원 전체의 주인이 되어 간다. 강을 낀 땅이 많아 수운과 농업에 유리한 나라가 힘을 얻었다. 마가다는 강이 도읍을 둘러싸고 철광이 가까웠으며, 코살라는 비옥한 평야가 있어도 맞닿은 국경이 길어 지키기 어려웠다. 군대는 코끼리·말·전차·보병의 네 갈래로 짜였다고 불전이 전한다. 여러 나라의 크기와 인구를 가늠할 수치는 전하지 않는다."
  subjects: [kosala-kingdom, magadha-kingdom, panchala-kingdom, vajji-confederacy, vatsa-kingdom, avanti-kingdom, assaka-kingdom]
  tags: [politics]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: darius-gandhara-518bc
  year: -517
  endYear: -330
  title:
    ko: "아케메네스의 간다라와 힌두시 지배(기원전 518~330)"
  summary:
    ko: "아케메네스 제국이 남아시아 북서부로 들어온 것은 키루스 2세 때(기원전 535년 무렵 이후)였으나 힘을 굳힌 것은 다리우스 1세다. 그는 즉위 직후의 반란을 눌러 기원전 519~518년 무렵 새긴 「베히스툰 비문」에 속령으로 간다라(가다라)와 사타기디아를 올렸고, 뒤의 페르세폴리스·낙슈에 루스탐 비문에는 인더스 쪽 땅 힌두시(힌두스)가 더해졌다. 힌두시는 인더스강 중하류와 탁실라를 포함하는 땅으로 본다. 다리우스는 카리안다의 스킬락스를 보내 인더스강을 따라 내려가 바다로 나와 서쪽 이집트 홍해까지 항해하게 했다고 헤로도토스가 전하며 항해에 약 30개월이 걸렸다고 한다. 헤로도토스는 제국의 스무 번째 주를 인도(힌두시)로 두고 사금 360탈란톤을 세금으로 냈다고 하는데, 은으로 환산하면 가장 많은 액수여서 과장이라는 의심도 있다. 간다라·사타기디아는 일곱 번째 주로 170탈란톤을 냈다. 제국 아래에서 아람어가 행정에 쓰였고, 여기서 나온 카로슈티 문자가 뒤에 간다라 지역에서 쓰였다고 본다. 인도의 병사는 크세르크세스의 그리스 원정(기원전 480~479)에 면 옷에 갈대 활을 들고 따랐고, 기원전 331년 가우가멜라에서도 코끼리 열다섯 마리를 보냈다. 왕릉 부조의 속민 행렬에는 기원전 338년 무렵 아르타크세르크세스 3세 때까지 간다라와 힌두시가 나타난다. 알렉산드로스가 제국을 무너뜨리면서 이 지배도 끝났다. 제국 전체의 정비는 「다리우스 1세의 제국 정비: 「베히스툰 비문」·사트라피·왕의 길·페르세폴리스·화폐(기원전 522~486)」(앞의 사건)가, 제국의 끝은 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」(뒤의 사건)이 다룬다."
  subjects: [achaemenid-empire]
  tags: [politics, diplomacy]
  sources: ["Herodotus(헤로도토스), Histories, trans. A. D. Godley (Loeb Classical Library, Harvard University Press, 1920–1925)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: kosala-pasenadi-480bc
  year: -479
  title:
    ko: "코살라의 파세나디와 비두다바, 카시와 샤캬(기원전 480 무렵)"
  summary:
    ko: "코살라는 갠지스강 북쪽 아와드 지방에 있던 나라로 슈라바스티와 아요디아가 큰 도시였다. 『라마야나』가 노래하는 라마의 나라도 아요디아의 코살라다. 붓다 시대의 왕 파세나디(산스크리트 프라세나지트)는 카시를 합쳐 영토를 넓히고 붓다를 후원한 신자로 불전에 자주 나오며, 그의 누이가 마가다 왕 빔비사라와 혼인할 때 카시의 한 마을을 지참금으로 주었다고 한다. 아자타샤트루가 아버지 빔비사라를 죽이자 파세나디가 그 마을을 거둬들였고, 이를 두고 두 나라가 싸웠다. 불전은 한때 파세나디가 졌다가 다시 이겨 아자타샤트루를 사로잡았으나 화해하고 딸 바지라를 시집보냈다고 적는다. 파세나디가 늙어 마가다로 도움을 청하러 갔다가 라자그리하의 성문 앞에서 죽자, 아들 비두다바(비루다카)가 왕위를 이었다고 한다. 비두다바는 샤캬족이 신분을 속여 어머니를 시집보냈다는 앙심을 품고 샤캬의 나라 카필라바스투를 공격해 크게 해쳤으며, 얼마 뒤 홍수에 휩쓸려 죽었다고 불전은 전한다. 이 이야기는 모두 후대 불교 문헌의 서술이며 연대와 세부는 확인하기 어렵다. 코살라가 마가다에 합쳐진 시기는 사료마다 달라 기원전 5세기 후반부터 난다 왕조가 갠지스 평원을 합친 기원전 4세기 중엽 사이로 어림한다. 코살라는 이후 독립을 잃었으나 아요디아와 슈라바스티는 뒤에도 종교와 상업의 중심으로 남았다. 코살라의 도읍 슈라바스티는 상인이 모이는 큰 도시였고 아나타핀디카의 기원정사가 있던 곳으로 불교 자료에 자주 나온다. 지금의 사헤트–마헤트 유적에서는 북방흑색마연도기가 나오는 층이 확인되어 이 시기에 도시가 있었음을 보여 준다. 이 이야기는 불교 신자의 눈으로 정리된 것이라는 점을 감안해야 한다."
  subjects: [kosala-kingdom, magadha-kingdom]
  tags: [politics, war]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Richard Gombrich, Theravada Buddhism: A Social History from Ancient Benares to Modern Colombo (Routledge, 1988)"]

- id: ajatashatru-vajji-468bc
  year: -467
  title:
    ko: "아자타샤트루의 즉위와 밧지 정복(기원전 468 무렵)"
  summary:
    ko: "아자타샤트루(재위 기원전 492~460 무렵)는 아버지 빔비사라를 몰아냈다고 전하는 마가다의 왕이다. 먼저 외삼촌인 코살라 왕 파세나디와 카시를 놓고 싸웠고 화해한 뒤 서쪽을 안심할 수 있게 되자 갠지스강 건너 북쪽의 밧지 연맹을 쳤다. 불전은 대신 밧소카라(바사카라)가 밧지에 거짓으로 투항해 3년 동안 이간책을 쓴 끝에 연맹의 단결이 무너져 침공이 쉬워졌다고 적는다. 자이나교 문헌은 아자타샤트루가 큰 돌을 날리는 투석기와 칼날 달린 전차를 처음 썼다고 전한다. 또 갠지스강과 손강이 만나는 곳의 마을 파탈리가마에 요새를 쌓아 밧지를 막았는데, 이곳이 뒤에 파탈리푸트라가 된다. 전쟁은 오래 이어졌고 마가다는 기원전 468년 무렵 바이샬리를 차지했다고 하는데 연대는 학설이 갈린다. 이 나라의 땅은 갠지스강 북쪽으로 넓어져 마가다는 코살라와 어깨를 나란히 하는 대국이 되었다. 한편 불전은 붓다의 열반이 아자타샤트루 재위 8년이라 적는다. 연대가 정해지면 이 왕의 재위도 함께 정해진다. 아자타샤트루는 이 시기 라자그리하에서 첫 불교 결집을 후원했다고 전한다. 이 사건은 왕이 이끄는 큰 국가가 씨족 회의의 연맹을 무너뜨린 과정으로 해석된다. 아자타샤트루의 시기에 마가다는 군사 기술과 행정이 앞선다는 평가를 받는다. 그는 라자그리하의 성벽을 보강하고 새 요새를 쌓았으며 철제 무기를 대량으로 쓸 수 있는 자원도 있었다. 불교와 자이나교 문헌은 모두 그가 아버지를 죽인 죄를 뉘우치고 가르침을 청했다고 적는데, 두 교단이 각각 왕을 자기 편으로 끌어당긴 이야기라 사실 여부를 가리기 어렵다. 밧지가 무너진 뒤 리차비족은 뒤에 네팔과 비하르에서 다시 이름을 드러낸다."
  subjects: [magadha-kingdom, vajji-confederacy, kosala-kingdom]
  links:
    - { from: magadha-kingdom, to: vajji-confederacy, note: "아자타샤트루가 밧지 연맹을 정복하고 바이샬리를 차지함 (기원전 468 무렵)" }
  tags: [war, politics]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Romila Thapar, From Lineage to State: Social Formations in the Mid-First Millennium BC in the Ganga Valley (Oxford University Press, 1984)", "Paul Dundas, The Jains (Routledge, 2002)"]

- id: buddhist-councils-480bc
  year: -479
  endYear: -379
  title:
    ko: "제1결집과 제2결집: 불교 교단의 정리와 분열(기원전 480~380 무렵)"
  summary:
    ko: "붓다가 열반한 뒤 제자들은 가르침을 모아 외웠다고 불교 문헌은 전한다. 제1결집은 열반 직후 마가다의 라자그리하에서 열렸다고 하며, 아자타샤트루의 후원 아래 마하카사파의 주재로 500명의 아라한이 모여 우팔리가 율(계율)을, 아난다가 법(가르침)을 외웠다고 한다. 이 이야기는 훨씬 뒤의 율장과 연대기에 실린 것이라 모임의 규모와 내용을 그대로 믿기 어렵다는 학자가 많다. 약 100년 뒤 열렸다는 제2결집은 바이샬리에서 일어났다. 바이샬리의 밧지족 출신 비구들이 소금을 저장하고 금은을 받는 등 열 가지 관행을 허용하자 율에 어긋난다고 본 장로들이 칼라소카 왕 때(위키백과 영어판은 기원전 383년) 700명의 비구가 모여 판정했다고 한다. 이 모임을 계기로 보수적인 장로들의 상좌부(스타비라)와 개혁적인 대중부(마하상기카)로 교단이 갈라졌다는 전통이 있으나, 갈라진 시기와 원인에 대해서는 학자마다 의견이 다르며 아소카 이후였다고 보는 견해도 있다. 팔리어와 산스크리트 계통의 기록이 각각 다른 모임을 적어, 모임의 횟수와 연대는 여러 설이 겹친다. 이 교단 분열은 뒤에 부파 불교가 열여덟 개 안팎으로 나뉘는 흐름의 출발로 꼽힌다. 아소카 때의 제3결집은 이어지는 다음 세기의 사건이다. 결집은 가르침이 입으로 전해지던 시대에 교단이 하나의 정본을 세우려는 노력이었다. 팔리어 율장과 산스크리트 계통 율장이 결집의 모습을 서로 다르게 적고 있어 어느 쪽이 더 오래된 전승인지 학자들이 다툰다. 세 번째 결집은 아소카 시대에 파탈리푸트라에서 열렸다고 전한다. 따라서 이 사건은 교리 논쟁의 시작이 아니라 교단의 규율을 둘러싼 갈등으로 읽힌다."
  subjects: [magadha-kingdom, vajji-confederacy]
  tags: [religion]
  sources: ["Étienne Lamotte, History of Indian Buddhism: From the Origins to the Saka Era, trans. Sara Webb-Boin (Institut Orientaliste, Louvain-la-Neuve, 1988)", "Richard Gombrich, Theravada Buddhism: A Social History from Ancient Benares to Modern Colombo (Routledge, 1988)", "Heinz Bechert (ed.), The Dating of the Historical Buddha (Vandenhoeck & Ruprecht, 1991–1992)"]

- id: pataliputra-460bc
  year: -459
  title:
    ko: "파탈리푸트라 천도와 하리앙카 왕조의 끝(기원전 460~413 무렵)"
  summary:
    ko: "아자타샤트루 뒤 마가다 왕위는 짧은 재위가 이어졌다. 위키백과 영어판의 군주 표로는 우다인(재위 기원전 460~444 무렵), 아누룻다(444~440), 문다(440~437), 다르샤카(437, 푸라나 쪽 이름이며 나가다사카와 같은 사람으로 보기도 한다), 나가다사카(437~413)가 차례로 왕위에 올랐다. 불교 연대기는 이들이 모두 아버지를 죽이고 왕이 된 것으로 적어 '부친 살해 왕조'라 부르지만, 이는 후대의 평가다. 우다인 때 도읍을 라자그리하에서 갠지스강과 손강이 만나는 곳의 파탈리푸트라로 옮겼다. 이곳은 아자타샤트루가 밧지를 막으려 세운 요새 파탈리가마가 있던 곳이며, 강으로 둘러싸여 방어에 좋고 갠지스강 수운을 통해 평원 전체와 이어졌다. 이 도시는 뒤에 마우리아와 굽타의 도읍이 된다. 자이나교 문헌은 우다인이 이웃 나라의 자객에게 죽었고 후계자가 없어 대신들이 난다를 왕으로 세웠다고 적어 불교와 전승이 다르다. 『마하밤사』는 시민들이 나가다사카를 몰아내고 대신 시슈나가를 세웠다고 하며, 이 사건으로 하리앙카 왕조가 막을 내렸다. 푸라나는 왕명 순서가 다르다. 이 왕들의 재위는 후대 연표의 어림이며, 기원전 5세기의 마가다는 문자 기록이 없어 연대를 확정하기 어렵다. 한편 마가다의 영토는 이 시기 서쪽 바트사와 코살라 방면으로 계속 늘고 있었다. 이 도시는 성벽과 해자로 둘러싸였고, 뒤에 마우리아 궁정에 온 그리스 사절 메가스테네스는 강을 따라 길게 뻗은 목책 도시였다고 적었다. 처음에는 꽃의 도시라는 뜻의 쿠수마푸라로도 불렸다고 전한다. 이 천도로 마가다의 중심은 산악 요새에서 평원의 강 도시로 옮겨 갔다. 연대 문제를 떠나 이 도시가 이후 오랫동안 인도 북부의 정치 중심이 되었다는 점은 분명하다."
  subjects: [magadha-kingdom]
  tags: [politics]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: shishunaga-avanti-414bc
  year: -413
  endYear: -412
  title:
    ko: "시슈나가의 즉위와 아반티 정복(기원전 414~413 무렵)"
  summary:
    ko: "『마하밤사』는 시민들이 마지막 하리앙카 왕 나가다사카를 몰아내고 대신 시슈나가를 왕으로 세웠다고 전한다. 위키백과 영어판은 시슈나가의 재위를 기원전 413~395년으로 쓴다. 푸라나는 시슈나가를 하리앙카보다 앞에 두기도 하는 등 왕명과 순서가 엇갈려 연대는 어림이다. 시슈나가는 서쪽의 아반티를 쳐서 프라디요타 왕조를 눌렀다고 하며, 이 일로 말와의 우자인이 마가다에 합쳐져 마가다는 코살라·바트사·아반티를 둘러싼 갠지스 평원과 말와까지 이르는 최대 나라가 되었다. 정복의 해는 문서에 적혀 있지 않아 기원전 414~413년 무렵으로 어림한다. 시슈나가 뒤에는 아들 칼라소카(재위 기원전 395~367 무렵), 난디바르다나(367~355), 마하난딘(355~345 무렵)이 이었다. 칼라소카 때 바이샬리에서 제2결집이 열렸다고 전한다. 푸라나는 마하난딘이 신분이 낮은 어머니에게서 난 아들 마하파드마에게 죽었다고 하고, 불교 문헌은 칼라소카의 아들들이 우그라세나라는 이름의 난다에게 쫓겨났다고 하며 두 전승이 다르다. 시슈나가 왕조는 약 70년 남짓 이어진 뒤 난다 왕조로 넘어간다. 시슈나가 왕조는 사료가 짧아 왕들의 사적이 거의 알려지지 않는다. 푸라나는 열 왕을 꼽으나 이름과 순서가 문헌마다 달라 하리앙카와 시슈나가 왕명이 섞인 것으로 보는 학자도 있다. 이 시기 마가다는 아반티를 누르고 서쪽의 코살라와 바트사를 에워싸는 위치에 올라 난다 왕조에 영토를 물려주는 바탕을 마련했다. 이 왕조의 연대가 확정되지 않았다는 점도 함께 밝혀 둔다. 마가다의 확장은 곧 난다 왕조가 이어받는다. 푸라나가 시슈나가 왕조의 햇수를 360년으로 헤아리는 것은 명백한 과장으로 본다."
  subjects: [magadha-kingdom, avanti-kingdom]
  links:
    - { from: magadha-kingdom, to: avanti-kingdom, note: "시슈나가가 프라디요타 왕조를 눌러 아반티를 합침 (기원전 414~413 무렵)" }
  tags: [politics, war]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: deccan-megaliths-600bc
  year: -599
  endYear: -322
  title:
    ko: "데칸과 남인도의 거석 문화와 철기(기원전 600~322 무렵)"
  summary:
    ko: "갠지스 평원에 16대국이 서던 때 빈디아산맥 남쪽 데칸과 남인도에서는 돌로 무덤을 만드는 거석 문화가 널리 퍼져 있었다. 이 문화는 기원전 1000년 무렵 철기가 쓰이기 시작할 때부터 기원후 초기까지 이어졌다고 보며(더 이른 연대 주장도 있으나 층위가 흐트러져 논쟁이다) 발굴로 알려진 곳은 마하라슈트라 동부의 비다르바, 카르나타카의 할루르·브라마기리·마스키, 텔랑가나, 타밀나두의 아디찬날루르, 케랄라 등이다. 무덤 양식은 돌널(석관), 항아리 장례(옹관), 선돌(멘히르), 고인돌(돌멘), 돌무더기 등 여러 가지다. 죽은 사람과 함께 검은 바탕에 붉은 입구의 도기(검은·붉은 도기)와 철제 무기·농기구, 말 뼈, 금 장신구, 홍옥수 구슬이 묻혔다. 철 도구 덕분에 숲을 개간하고 땅을 깊이 갈 수 있어 인구가 늘었고, 저수지와 우물을 이용한 농업이 자리 잡았다고 본다. 남쪽에서는 이 거석 사회에서 부족 수장이 나오고 뒤에 상감 시대 타밀 세 왕국이 성립했다고 보는 학자가 많다. 다만 이 무덤을 만든 사람들이 누구였는지, 어떤 언어를 썼는지는 글이 없어 알 수 없다. 고다바리강 유역의 아스마카도 이 거석 문화권에 걸치지만, 불전에 나오는 아스마카와 이 유적의 담당자가 같은 집단이라고 말할 근거는 아직 없다. 북쪽의 16대국 소식이 남인도에 어떤 영향을 주었는지도 사료가 없어 알 수 없다. 데칸에 큰 왕조가 서는 것은 이보다 뒤의 일이다. 철제 도구로 가능했던 대규모 노동으로 돌을 세운 무덤은 지도자의 권위를 보여 주는 기념물이었다고 해석되며, 일부 유적에서는 말과 철검, 금 장신구가 함께 나와 사회에 계층 차이가 있었음을 시사한다. 이 시기 남인도의 정치 구조는 거석 무덤 말고는 사료가 거의 없어 알 수 없다. 푸라나는 아스마카가 기원전 345년 무렵 마하파드마 난다에게 정복되었다고 전하나 데칸 쪽에서 이를 확인해 줄 자료는 없다."
  subjects: [assaka-kingdom]
  tags: [society, economy]
  sources: ["Dilip K. Chakrabarti, India: An Archaeological History (Oxford University Press, 1999)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: epics-400bc
  year: -399
  title:
    ko: "『마하바라타』와 『라마야나』의 형성(기원전 400 무렵)"
  summary:
    ko: "인도의 두 대서사시는 이 무렵부터 문자 이전의 구전 형태로 자라났다. 『마하바라타』는 쿠루족 안의 두 갈래, 판다바 오형제와 카우라바 백 형제가 싸운 쿠룩셰트라 전쟁을 줄거리로 하고, 『바가바드기타』와 같은 철학적 대목을 품고 있다. 지금 전하는 형태는 기원전 400년 무렵부터 기원후 400년 무렵 사이에 천천히 완성되었다. 판찰라 왕녀 드라우파디의 혼인, 판찰라 군이 판다바 편에서 싸우는 이야기가 나오는 점에서 쿠루와 판찰라의 옛 기억이 담겼다고 본다. 전쟁이 실제로 있었는지는 고고학으로 확인되지 않았고 기원전 1000년 무렵의 갈등이 확대된 것일 수 있다는 정도로 말한다. 『라마야나』는 코살라의 도읍 아요디아의 왕자 라마가 14년 추방되어 악마 왕 라바나에게 납치된 아내 시타를 구하는 이야기이며, 시인 발미키가 지었다고 전한다. 가장 오래된 층은 기원전 5~4세기 무렵으로 보는 견해가 있으나 학설이 갈린다. 두 서사시는 이후 동남아와 중앙아시아까지 번역되고 변용되어 널리 퍼졌다. 이 시기에는 『다르마수트라』라는 법 규정도 편찬되어 바르나별 의무를 정리했는데, 이는 제도를 적은 것이지 현실의 모습 그대로는 아니다. 이야기에 나오는 나라 이름과 관계는 후대 청중의 지리관을 반영한 것이어서 역사 사실로 그대로 쓰기 어렵다. 『마하바라타』는 약 10만 구절로 세계에서 가장 긴 서사시로 꼽히고, 『라마야나』는 약 2만 4천 구절이다. 두 서사시는 구전 이야기꾼의 낭송으로 전해지다 글로 정리되었다. 이 서사시들은 후대 인도 문화에서 이야기의 원천으로 계속 쓰였다. 이야기에 나오는 나라 이름과 관계도 사실을 그대로 전한 것은 아니다."
  subjects: [kosala-kingdom, panchala-kingdom]
  tags: [culture, religion]
  sources: ["John Brockington, The Sanskrit Epics (Brill, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: panini-350bc
  year: -349
  title:
    ko: "파니니와 산스크리트 문법: 『아슈타디야이』(기원전 350 무렵)"
  summary:
    ko: "파니니는 간다라의 살라투라(지금 파키스탄 북부)에서 태어났다고 전하는 문법학자로, 산스크리트의 문법을 『아슈타디야이』('여덟 장')에 정리했다. 전통은 이 책을 약 4,000개의 수트라(짧은 규칙)로 헤아리며, 판본에 따라 3,959개 또는 3,996개로 본다. 8장이 각 4절로 나뉜다. 소리 규칙에서 낱말 만들기, 문장 짜임에 이르는 규칙들은 약호와 순서 규칙을 써서 아주 짧게 쓰였다. 14줄의 '시바 수트라'는 소리를 묶어 부르는 약어 체계다. 이 책은 현대 언어학자들이 규칙을 순서대로 적용해 문장을 만드는 생성 문법의 선구로 평가한다. 파니니가 살았던 때는 기원전 7세기에서 4세기까지 학설이 갈린다. 화폐를 언급한 점에 비추어 기원전 4세기 중엽으로 보는 견해와 언어 형태에 근거해 기원전 6~5세기로 보는 견해가 있어 여기서는 앞의 설에 따라 연대를 어림했다. 이 무렵 간다라는 형식상 아케메네스 제국의 태수령이었으나 책에는 고대 페르시아어의 영향이 보이지 않고 남아시아의 북서부 땅과 동쪽의 코살라·마가다 같은 지역이 다뤄진다. 카티야야나(기원전 250년 무렵으로 보는 설)가 주석을 달고, 뒤에 파탄잘리가 『마하바샤』로 책을 해설하며 이 문법 전통이 이어졌다. 이렇게 고정된 산스크리트('완성된 말')는 이후 학문과 문학의 공용어로 오랫동안 쓰였다. 『아슈타디야이』가 자리 잡으면서 산스크리트는 더 이상 변하지 않는 규범 언어가 되었다. 이는 일상어(프라크리트)와 갈라서게 한 요인으로 평가되기도 한다. 책은 베다 언어의 예외 규칙도 따로 두고 있어 파니니가 베다의 말과 당대의 말을 모두 다뤘음을 보여 준다. 이 책은 지금도 언어학 연구의 대상으로 읽힌다."
  subjects: [achaemenid-empire, kosala-kingdom, magadha-kingdom]
  tags: [culture]
  sources: ["Hartmut Scharfe, Grammatical Literature (A History of Indian Literature, vol. 5, fasc. 2; Otto Harrassowitz, 1977)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: pandukabhaya-anuradhapura-377bc
  year: -376
  title:
    ko: "스리랑카 비자야 전승과 판두카바야의 아누라다푸라(기원전 377 무렵)"
  summary:
    ko: "스리랑카의 불교 연대기 『디파밤사』와 『마하밤사』는 섬의 시작을 이렇게 전한다. 북인도의 한 나라에서 쫓겨난 왕자 비자야와 일행이 붓다가 열반한 날 섬 서북쪽에 닿아 야크샤(원주민) 여인 쿠웨니의 도움으로 땅을 얻었다. 비자야는 뒤에 쿠웨니를 버리고 남인도 판디아의 공주를 아내로 맞아 왕이 되었다. 이 이야기는 전설이며, 고고학은 섬에서 기원전 첫 천년기 앞쪽부터 철기를 쓰는 마을이 있었음을 보여 준다. 『마하밤사』에 따르면 비자야 뒤 판두바수데바와 아바야 등을 거쳐 판두카바야가 외삼촌들을 물리치고 즉위해 아누라다푸라를 도읍으로 삼았다고 한다. 『마하밤사』는 그가 도시 구획과 저수지(아바야 저수지)를 만들었다고 전한다. 연대기가 세는 햇수는 비자야 상륙 뒤 106년째에 판두카바야가 즉위한 것으로 되어 있어, 붓다의 열반을 기원전 543년으로 두면 기원전 437년이 되고 기원전 483년으로 보면 기원전 377년이 된다. 위키백과 영어판은 앞의 값(재위 기원전 437~367)을 쓰고, 이 사건은 기원전 377년 무렵을 따랐다. 뒤의 왕 무타시와를 거쳐 데바남피야 티사 때(기원전 3세기)가 되어서야 불교가 들어온다. 아누라다푸라는 이후 1,000년 넘게 싱할라 왕국의 도읍이었다. 연대기는 불교 승려가 훨씬 뒤에 엮은 글이라 초기 왕들의 이름과 연대를 그대로 믿기는 어렵다. 아누라다푸라에는 뒤에 대사원(마하비하라) 등이 세워지고 사원과 저수지, 도시가 함께 발전해 섬 문명의 중심이 된다. 도읍은 말와투강 가의 건조 지대에 있어 저수지를 통한 물 관리가 도시를 유지하는 열쇠였다. 이 연표 차이는 『마하밤사』의 기록이 불교의 열반 연대에 의존하기 때문에 생긴다."
  subjects: [anuradhapura-kingdom]
  tags: [politics]
  sources: ["Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: nanda-345bc
  year: -344
  endYear: -322
  title:
    ko: "마하파드마 난다와 난다 왕조: 시슈나가 왕조의 끝과 갠지스 평원의 통합(기원전 345~322 무렵)"
  summary:
    ko: "푸라나는 시슈나가 왕조의 마지막 왕 마하난딘이 신분이 낮은 어머니에게서 난 아들 마하파드마 난다에게 죽었다고 전하고, 불교 문헌은 우그라세나라는 이름의 난다를 첫 왕으로 적는다. 그의 즉위는 기원전 345년 무렵으로 보며(기원전 364년 무렵 등 다른 추정도 있다), 이 난다 왕조는 기원전 322~321년 무렵 마지막 왕 다나 난다가 찬드라굽타에게 무너질 때까지 이어졌다. 전통은 아홉 난다를 말하고, 『마하밤사』에 따르면 이들의 재위는 합쳐 22년이다. 푸라나는 마하파드마가 '모든 크샤트리아의 파괴자'로 이크슈바쿠(코살라 왕가)·판찰라·카시·아스마카·쿠루·수라세나 같은 옛 왕가를 쓸어냈다고 하는데, 이는 마가다가 갠지스 평원의 코살라·판찰라·바트사를 모두 합치고 남쪽 아스마카까지 닿았다는 것으로 풀이된다. 하티굼파 비문에 '난다 왕'이 칼링가에 운하를 팠다는 말이 있어 칼링가(오리사)의 일부도 이 왕조가 차지했다고 본다. 어디까지 영토였는지는 푸라나·그리스 기록·비문 한두 곳에 기대고 있어 확정하기 어렵다. 알렉산드로스를 따르던 그리스 기록은 갠지스 강가의 프라시이·간가리다이 왕에게 보병 20만, 기병 2만, 전차 2천, 코끼리 3천(디오도로스는 4천)이 있었다고 전하고 다른 그리스 저자는 더 큰 수를 적으나 과장이 섞였을 것이다. 파탈리푸트라에는 막대한 재물이 쌓여 있었다는 평판이 타밀 시에도 보이며, 그리스 기록은 왕이 낮은 신분 출신이라 백성의 미움을 샀다고 적는다. 이 왕조의 끝은 「찬드라굽타와 마우리아 제국의 성립(기원전 321년 무렵)」(뒤의 사건)가 다룬다. 난다 왕조는 철광과 관료제, 큰 군대를 갖춘 갠지스 평원 최초의 통일 정권으로 평가되며, 마우리아가 이 구조를 이어받았다."
  subjects: [nanda-empire, magadha-kingdom, kosala-kingdom, panchala-kingdom, vatsa-kingdom]
  links:
    - { from: nanda-empire, to: magadha-kingdom, note: "마하파드마 난다가 시슈나가 왕조를 이어 마가다의 왕위를 차지함 (기원전 345 무렵)" }
  tags: [politics, war]
  sources: ["Hem Chandra Raychaudhuri, Political History of Ancient India (University of Calcutta, 1923)", "Quintus Curtius Rufus(쿠르티우스), History of Alexander, trans. John C. Rolfe (Loeb Classical Library, Harvard University Press, 1946)", "Diodorus Siculus(디오도로스), Library of History, vol. 8, trans. C. Bradford Welles (Loeb Classical Library, Harvard University Press, 1963)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: alexander-india-326bc
  year: -325
  endYear: -324
  title:
    ko: "알렉산드로스의 인더스 원정: 히다스페스 전투와 회군, 태수령(기원전 326~325)"
  summary:
    ko: "마케도니아 왕국의 알렉산드로스는 아케메네스 제국을 무너뜨린 뒤 기원전 327년 봄 힌두쿠시를 넘어 지금의 아프가니스탄 동부와 파키스탄 북부로 들어왔다. 스와트·부네르의 아스파시오이와 아사케노이(마사가에서 격렬히 저항)를 꺾고 기원전 326년 4월 요새 아오르노스를 함락했다. 인더스강을 건너 탁실라의 왕 탁실레스(암비)의 환영을 받고, 기원전 326년 5월(7월이라는 문서도 있다) 히다스페스강(지금 젤룸강)에서 포로스의 군대와 싸웠다. 아리아노스는 포로스에게 코끼리 약 200마리가 있었다고 적는다. 알렉산드로스는 밤에 강을 건너는 작전으로 이겼으나 손실이 컸고, 사로잡힌 포로스를 풀어 주어 태수로 되돌려 앉혔다. 그 뒤 동쪽으로 사랑갈라(카타이오이)를 부수고 히파시스강(지금 비아스강)에 이르렀는데, 지친 군대가 더 나아가기를 거부하자 열두 제단을 세우고 돌아섰다. 이때 갠지스 쪽에는 프라시이의 큰 군대가 있다는 이야기를 듣고 그 힘이 두려움을 키웠다고 그리스 기록은 전하며 이는 난다 왕조를 말한다. 기원전 326년 말~325년 인더스강을 내려가며 말리족을 치다 크게 다쳤고, 기원전 325년 가을 일부는 게드로시아 사막을 통해 돌아갔으며 네아르코스의 함대는 바닷길로 갔다. 태수 필리포스는 암살되고 신드 쪽은 페이톤이 맡았으며, 포로스와 탁실레스는 펀자브의 현지 왕으로 남았다. 알렉산드로스가 죽자(기원전 323) 태수령은 흔들렸고 기원전 316년 무렵까지 마케도니아 세력은 철수했다. 원정 전체는 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」(앞의 사건)이 다루고, 그 뒤 인더스 땅의 변화는 「찬드라굽타와 마우리아 제국의 성립(기원전 321년 무렵)」(뒤의 사건)가 이어 간다."
  subjects: [macedonia-kingdom, nanda-empire]
  tags: [war, politics]
  sources: ["Arrian(아리아노스), Anabasis Alexandri, trans. P. A. Brunt (Loeb Classical Library, Harvard University Press, 1976–1983)", "Quintus Curtius Rufus(쿠르티우스), History of Alexander, trans. John C. Rolfe (Loeb Classical Library, Harvard University Press, 1946)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]
