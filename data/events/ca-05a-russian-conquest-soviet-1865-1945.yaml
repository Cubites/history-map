# 중앙아시아 사건 5차 묶음 앞 절반(ca-05a): 러시아의 정복과 소련 시기 — 부하라·히바·코칸트·예티샤르·아프가니스탄·투르키스탄·카자흐 초원 (1865 ~ 1945년)
# 범위: 러시아의 타슈켄트 점령과 투르키스탄 총독부·부하라와 히바의 보호국화·코칸트 칸국의 폐지·투르크멘 정복·철도와 면화·스텝의 러시아인 이주·안디잔 봉기·자디드 운동·1916년 반란·
#   1917년의 투르키스탄과 알라시 오르다·바스마치·두 인민 소비에트 공화국·민족 경계 획정·집단화와 카자흐 대기근·강제 이주·동투르키스탄 공화국들과 신장의 군벌·2차 대전,
#   그리고 같은 시기 아프가니스탄(셰르 알리와 계승 전쟁·제2차 전쟁·압두르 라흐만의 나라 만들기·하비불라·제3차 전쟁과 아만알라의 개혁·무사히반 왕조의 성립)과 예티샤르의 일.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(코칸트 자치 정부·알라시 오르다·동투르키스탄 공화국·타란치 술탄국·우루무치 퉁간 정권 등)은 글로만 다뤘다.
# 날짜: 러시아 쪽 날짜는 1918년 2월 앞에도 그레고리력으로 적고, 출처가 구력을 쓰는 중요한 날짜는 괄호로 구력을 함께 적었다. 아프가니스탄의 태양력·히즈라력은 쓰지 않았다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제를 따랐고, 코칸트 칸국·부하라 토후국·카자흐(카자크와 구분)로 적었다. 1925년 앞 러시아 문서의 '키르기스'가 카자흐를 가리킬 때는 카자흐로 적고 풀이를 달았다.
#   사망자·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적고 한 숫자로 못 박지 않았다. 정복·진압·강제 이주·기근은 어느 쪽 시각도 따르지 않고 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 소련 구성 공화국은 따로 항목이 없어 소련으로 적었다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(서북 회민 봉기와 야쿱 벡…, 칼라트와 샌더먼 조약…, 그레이트 게임과 판데 사건, 파미르 분쟁과 파미르 경계 협정, 영러 협상과 삼국 협상, 러시아 혁명·내전, 신경제 정책, 5개년 계획, 연해주 한인의 중앙아시아 강제 이주, 신장의 편입과 위구르 문제 등).
#   한국사와 닿는 점은 1937년 고려인 강제 이주를 다룬 사건과 엮었다.

- id: tashkent-1865
  year: 1865
  endYear: 1866
  title:
    ko: "러시아의 타슈켄트 점령과 이르자르 전투(1865~1866)"
  summary:
    ko: "타슈켄트는 1810년대부터 코칸트 칸국의 큰 도시였고 시르다리야 강가의 상업 중심지였다. 러시아는 1864년 6월 투르키스탄과 아울리에아타, 9월 침켄트를 차지해 오렌부르크 선과 시베리아 선을 이었으나, 국경 방어와 면화 공급, 영국에 맞선 세력 다툼이라는 이유로 더 나아갔다. 코칸트의 실권자 물라 알림쿨은 1865년 5월 타슈켄트를 지키다 전사했고, 미하일 체르냐예프 장군은 6월 27일부터 약 2,000명의 병력으로 성을 공격해 6월 29일(구력 6월 17일) 장로들의 항복을 받았다. 도시를 지키던 병력이 훨씬 많았다고 전해지나 숫자는 사료마다 다르다. 이어 러시아는 타슈켄트를 중심으로 투르키스탄 주를 세웠고 체르냐예프가 군정 장관이 되었으며, 1866년 코칸트 칸국과의 협상이 깨지자 타슈켄트를 제국에 병합했다. 같은 때 코칸트에서는 후다야르 칸이 술탄 사이드(1863~1865)와 빌 바흐치 칸(1865)을 거친 뒤 네 번째로 자리에 올랐다. 부하라의 에미르 무자파르(재위 1860~1885)는 러시아의 북진을 막으려 성전을 선포하고 러시아 사절을 억류했으나 1866년 5월 이르자르 전투에서 러시아군에 크게 졌다. 러시아군은 이어 6월 후잔드를 차지했고 가을에 우라튜베와 지작을 점령해 부하라와 코칸트의 사이를 끊었다. 체르냐예프는 명령 없이 움직였다는 비판 속에 1866년 교체되었고 후임 로마놉스키가 이 선을 굳혔다. 히바 칸국의 무함마드 라힘 2세는 러시아와 맞닿지 않아 아직 직접 부딪히지 않았다. 이 점령으로 러시아는 중앙아시아의 큰 오아시스 도시를 처음 차지했다. 타슈켄트의 인구는 10만 명 안팎이라고 전해지며, 점령 뒤 러시아 군정은 옛 도시 곁에 병영과 러시아인 거주지를 따로 세웠다."
  subjects: [russia, kokand-khanate, bukhara-emirate, khiva-khanate]
  links:
    - { from: russia, to: kokand-khanate, note: "타슈켄트를 점령함 (1865)" }
  tags: [war, politics]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)"]

- id: yettishar-1865
  year: 1865
  endYear: 1878
  title:
    ko: "야쿱 벡의 예티샤르(1865~1878)"
  summary:
    ko: "1860년대 중반 타림 분지는 청에 맞선 무슬림 봉기로 청의 지배가 무너진 상태였다. 코칸트의 실권자 알림쿨은 카슈가르의 호자 일족을 내세워 개입했고, 야쿱 벡은 1865년 1월 부주르그 칸과 함께 국경을 넘어 카슈가르에 들어갔다. 그는 곧 부주르그를 밀어내고 카슈가르·야르칸드·마랄바시를 잡았으며 1867년 무렵 호탄과 악수까지 손에 넣었고, 투루판과 우루무치 쪽으로는 1870년 무렵 나아갔다. 우루무치에는 퉁간(회족) 지도자들이 세운 정권이 있었는데 야쿱 벡은 이를 눌러 복속시켰다. 하미는 청과 이어진 토착 왕가의 영향 아래 남았다. 그는 '아탈릭 가지'를 칭했고 부하라 에미르에게서 칭호를 받았으며 오스만의 술탄이 에미르로 인정했다. 샤리아에 따라 세금을 거두고 규율을 세운 정부는 군사 중심이었고, 오스만과 영국, 러시아가 사절을 보내 통상 관계를 맺었다(영국은 1874년 조약, 러시아는 1872년 협정). 그러나 어느 쪽도 청에 맞서 그를 도우려 하지 않았다. 러시아는 1871년 이리 골짜기를 점령했는데 이곳은 타란치(위구르 농민)의 술탄국이 다스리던 땅이었다(반환은 1881년). 청은 좌종당을 보내 1876년 북쪽을 되찾았고, 야쿱 벡은 1877년 5월 말 쿠얼러에서 갑자기 죽었다. 자연사와 독살설이 갈린다. 아들들이 다투는 사이 청군이 1877년 12월 카슈가르를, 1878년 1월 호탄을 되찾으면서 예티샤르는 끝났다. 청 쪽의 군사 작전과 이리 문제는 「서북 회민 봉기와 야쿱 벡, 좌종당의 신장 수복과 이리 문제(1862~1884)」(앞의 사건)에 있다. 예티샤르는 '일곱 도시'라는 뜻으로 타림 분지 서쪽의 여러 오아시스 도시를 묶어 부르는 이름이다. 정부의 세금 부담이 무거웠고 이 점이 청군이 진격할 때 그의 지지를 흔들었다고 보는 연구가 많다."
  subjects: [yettishar, kokand-khanate, qing, russia, uk, ottoman]
  tags: [war, politics, diplomacy]
  sources: ["Kim Hodong, Holy War in China: The Muslim Rebellion and State in Chinese Central Asia, 1864–1877 (Stanford University Press, 2004)", "Immanuel C. Y. Hsu, The Ili Crisis: A Study of Sino-Russian Diplomacy, 1871–1881 (Oxford University Press, 1965)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: turkestan-governorate-1867
  year: 1867
  endYear: 1882
  title:
    ko: "투르키스탄 총독부의 설치와 카우프만의 통치(1867~1882)"
  summary:
    ko: "러시아는 1867년 7월 타슈켄트에 투르키스탄 총독부를 세우고 시르다리야 주와 세미레치예 주를 묶어 콘스탄틴 폰 카우프만 장군을 초대 총독에 임명했다. 카우프만은 1882년 죽을 때까지 자리를 지켰고(뒤로 체르냐예프 1882~1884, 로젠바흐 1884~1889, 브레프스키 1889~1898, 두호프스코이 1898~1901과 여러 총독을 거쳐 삼소노프 1909~1914, 마르트손 1914~1916이 이었다), 황제의 대리인으로 외교와 전쟁을 직접 다룰 수 있었다. 그가 닦은 통치는 현지의 이슬람 법정과 마을 자치를 남기되 세금과 치안, 군사를 러시아 군정이 쥐는 것이었다. 정교회 전도를 막아 종교에는 간섭하지 않는다는 정책을 폈고, 러시아인 거주지를 옛 도시 옆에 따로 세웠다. 1868년에는 사마르칸트를 중심으로 자라프샨 구역을 만들었고, 1873년 아무다리야 구역과 1876년 페르가나 주가 더해졌다. 코칸트의 후다야르 칸은 1868년 통상 조약으로 러시아의 보호를 받는 처지가 되었고 칸국은 칸이 있는 채 총독의 감독을 받았다. 부하라 토후국은 1868년 사마르칸트를 잃었고, 히바 칸국과는 국경에 걸린 문제가 쌓이고 있었다. 카우프만은 현지인을 '고정된 틀 안에서' 다스려야 한다는 구상을 가졌고 군정 아래 학교와 관측소, 도서관을 세웠으며 1871~1872년의 『투르키스탄 앨범』 같은 기록 사업을 지원했다. 그러나 정복 직후의 군정은 수탈과 폭력이 잦았고 현지 주민의 불만이 쌓였다. 투르키스탄 총독부는 1917년까지 이어졌고 1886년 규정으로 틀이 굳어졌다. 총독부의 군정은 현지 사회를 낯선 것으로 보는 시선과 근대화의 약속이 뒤섞여 있었다. 지방은 군 장교가 구역장을 맡아 사법과 행정을 함께 쥐었고, 총독은 현지 유력자에게 관직과 훈장을 주어 끌어안았다. 정복 초기의 일은 「러시아의 타슈켄트 점령과 이르자르 전투(1865~1866)」(앞의 사건)에 있다."
  subjects: [russia, kokand-khanate, khiva-khanate, bukhara-emirate]
  tags: [politics]
  sources: ["Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Alexander Morrison, Russian Rule in Samarkand, 1868–1910: A Comparison with British India (Oxford University Press, 2008)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: bukhara-protectorate-1868
  year: 1868
  endYear: 1870
  title:
    ko: "사마르칸트 점령과 부하라 토후국의 보호국화(1868~1870)"
  summary:
    ko: "부하라 토후국은 에미르 무자파르(재위 1860~1885)가 다스렸고 1866년 이르자르 전투에서 진 뒤에도 러시아와의 전쟁을 이어 갔다. 카우프만의 부대는 1868년 5월 중순(구력 5월 1~2일) 자라프샨 강가의 차판아타에서 부하라군을 깼고 사마르칸트에 들어갔다. 러시아 수비대가 남은 사이 주민과 부하라 쪽 병력이 6월 중순(14~20일) 며칠 동안 도시를 에워쌌으나 구원군이 도착해 물러났다. 여름에 맺은 조약으로 러시아는 사마르칸트와 자라프샨 강 상류를 차지해 자라프샨 구역을 만들었고, 부하라는 배상금을 물고 러시아 상인에게 통상과 관세의 특권을 주었다. 에미르는 자리를 지켰으나 러시아 몰래 외국과 교섭하지 않기로 했다. 1870년 8월 러시아군은 에미르에게 맞서던 키타브와 샤흐리삽즈의 벡들을 쳐서 눌렀고 그 땅을 에미르에게 넘겨주었다. 에미르는 1870년대 동부의 히사르·쿨롭·카라테긴·다르바즈 같은 산지의 작은 영주들을 차례로 복속시켰다. 1873년 조약으로 부하라는 외교권을 러시아에 넘기고 노예 거래를 금지하기로 했다. 에미르 무자파르가 죽은 뒤 압둘아하드(재위 1885~1910)가 이었고, 후계는 알림 칸(재위 1910~1920)이었다. 부하라 토후국은 이로써 러시아의 보호국이 되어 내정은 에미르가 맡았으나 1920년까지 유지된 이 체제는 러시아 세력권 안에서만 움직일 수 있었다. 러시아 상인은 부하라 시내에 상관을 열 수 있게 되었고 러시아산 면직물과 설탕이 시장에 쏟아졌다. 부하라는 사마르칸트와 자라프샨 계곡의 관개지를 잃었고, 러시아와 맞서 성전을 주장하던 울라마와 러시아의 요구 사이에서 에미르는 늘 줄타기를 해야 했다. 사마르칸트는 티무르의 도읍이었던 곳이어서 이 땅을 잃은 일은 부하라 에미르의 위신에 깊은 상처를 남겼다."
  subjects: [russia, bukhara-emirate]
  links:
    - { from: russia, to: bukhara-emirate, note: "사마르칸트를 점령하고 보호국으로 삼음 (1868)" }
  tags: [war, diplomacy, politics]
  sources: ["Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Alexander Morrison, Russian Rule in Samarkand, 1868–1910: A Comparison with British India (Oxford University Press, 2008)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)"]

- id: sher-ali-afghanistan-1865
  year: 1865
  endYear: 1878
  title:
    ko: "셰르 알리와 아프가니스탄의 계승 전쟁(1865~1878)"
  summary:
    ko: "도스트 무함마드가 1863년 6월 죽자 그의 아들 셰르 알리가 자리를 이었으나 이복형제 무함마드 아프잘과 무함마드 아잠이 맞섰다. 1866년 5월 셰르 알리가 져 카불을 내주었고 아프잘이 1866년 5월부터 1867년 10월까지, 아잠이 1867년 10월부터 1868년 8월까지 차례로 에미르를 칭했다. 셰르 알리는 칸다하르와 헤라트를 거점으로 힘을 모아 1868년 9월 카불을 되찾았다. 영국령 인도의 총독 메이오는 1869년 3월 암발라에서 셰르 알리를 만나 무기와 보조금을 주었으나 도움을 보장하는 조약은 맺지 않았다. 1870년대에는 러시아가 아무다리야 쪽에 닿았고 1873년 영국과 러시아는 아무다리야를 아프가니스탄 북쪽 경계로 삼는 교환 문서에 합의했다. 셰르 알리가 후계로 지명한 아들 압둘라 잔이 1878년 8월 죽자 후계 문제도 불안해졌는데, 맏아들 야쿠브 칸은 헤라트 총독으로 1870년 반란을 일으켰다가 1874년 갇힌 일이 있었다. 영국은 1873년 이후 에미르가 영국 대표를 받아들이기를 바랐으나 셰르 알리는 이를 거부했고 1878년 7월 22일 러시아 사절 스톨레토프가 카불에 도착했다. 1838~1842년의 첫 전쟁 같은 영국의 개입을 겪은 아프가니스탄 지배층은 어느 쪽에도 기울기를 꺼렸다(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 앞의 사건). 영국이 사절단을 받으라고 압박하자 셰르 알리는 거절했고, 이것이 제2차 전쟁의 직접 원인이 되었다. 셰르 알리는 전쟁 중인 1879년 2월 21일 마자르이샤리프에서 죽었다. 도스트 무함마드의 많은 아들 가운데 셰르 알리를 후계로 삼은 것이 다툼의 뿌리였고, 내전 동안 나라는 카불·칸다하르·헤라트·마자르이샤리프로 갈라진 것이나 다름없었다."
  subjects: [afghanistan, british-raj, uk, russia]
  tags: [politics, diplomacy, war]
  sources: ["Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Vartan Gregorian, The Emergence of Modern Afghanistan: Politics of Reform and Modernization, 1880–1946 (Stanford University Press, 1969)", "Martin Ewans, Afghanistan: A Short History of Its People and Politics (HarperCollins, 2002)"]

- id: khiva-protectorate-1873
  year: 1873
  title:
    ko: "러시아의 히바 원정과 겐데미안 조약(1873)"
  summary:
    ko: "히바 칸국의 칸 무함마드 라힘 2세(재위 1864~1910)는 러시아 상인과 국경 약탈, 노예 문제로 러시아와 오래 맞서 있었다. 러시아는 1873년 봄 투르키스탄의 카우프만 부대와 오렌부르크, 망기슐라크, 크라스노보츠크 쪽 부대를 네 방향에서 보내 사막을 건너게 했다. 부대들은 5월 말부터 히바로 모였고, 히바는 6월 10일(구력 5월 29일) 항복했다. 8월 24일(구력 8월 12일) 칸은 겐데미안에서 조약에 서명해 아무다리야 오른쪽 기슭을 러시아에 넘겼고, 그 땅에 아무다리야 구역이 설치되었다. 칸은 러시아 황제를 위에 두고 외교권을 넘겼으며 러시아 배가 아무다리야를 자유롭게 오가게 하고, 노예 거래를 없애기로 했다. 전쟁 배상금은 해마다 나눠 내는 몫으로 정해졌다. 칸은 자리를 지켰으나 정복의 부담은 아래로 돌아갔다. 칸국의 영향 아래 있던 요무트 투르크멘에게는 따로 벌금 약 30만 루블이 매겨졌고, 저항하는 투르크멘 마을들이 불에 타 많은 사람이 죽었다. 그 수는 사료마다 갈린다. 같은 해 영국과 러시아는 아무다리야를 따라 아프가니스탄의 북쪽 경계를 정하는 교환 문서를 마무리했다(1872년 말~1873년 초). 바다크샨과 와칸이 아프가니스탄 쪽에 든다는 풀이는 이때 나왔고, 러시아는 아프가니스탄 안의 일에는 간섭하지 않기로 했다. 히바는 이 일로 러시아의 보호국이 되었으며, 이후 칸 이스판디야르(재위 1910~1918)와 사이드 압둘라(재위 1918~1920)까지 이어졌다. 칸국 안에서는 아무다리야 오른쪽 기슭의 우즈베크와 카라칼파크 농민이 새 구역에 들어가 러시아 법의 지배를 받게 되었다. 풀려난 페르시아인 노예의 수는 러시아 쪽이 수만 명이라 밝혔으나 정확하지 않다."
  subjects: [russia, khiva-khanate, afghanistan, uk]
  links:
    - { from: russia, to: khiva-khanate, note: "원정으로 히바를 항복시키고 보호국으로 삼음 (1873)" }
  tags: [war, diplomacy]
  sources: ["Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Peter Hopkirk, The Great Game: The Struggle for Empire in Central Asia (Kodansha International, 1992)"]

- id: kokand-annexation-1876
  year: 1875
  endYear: 1876
  title:
    ko: "코칸트 칸국의 폐지와 페르가나 주(1875~1876)"
  summary:
    ko: "코칸트 칸국의 후다야르 칸은 1865년 네 번째로 자리에 올랐고 러시아의 보호를 받는 처지가 된 뒤 세금을 무겁게 걷었다. 유목 키프차크와 키르기스(코칸트 안의 유목민) 사이에서 불만이 쌓여 1873년부터 압두라흐만 아프토바치가 이끄는 반란이 일어났다. 1875년 후다야르는 러시아 쪽으로 달아났고 아들 나스룻딘이 칸이 되었으나 반란 지도자들이 풀라트(풀라트 칸)를 새 칸으로 세웠다. 풀라트는 러시아에 대한 성전을 내세웠다. 러시아의 투르키스탄 총독 카우프만은 미하일 스코벨레프를 보내 1875년 가을부터 겨울에 걸쳐 군대를 진격시켰고, 1876년 초 코칸트와 안디잔을 점령했다. 풀라트는 붙잡혀 처형되었다. 나스룻딘은 1876년 칸으로 복귀했으나 러시아는 1876년 2월 칸국을 폐지하고 그 땅에 페르가나 주를 세워 스코벨레프를 초대 군정 장관으로 삼았다. 칸국은 1709년 무렵부터 이어졌다. 이로써 시르다리야 상류의 페르가나 분지는 러시아의 직접 통치 아래 들어갔고, 목화 재배와 철도가 이 땅의 농업을 바꾸게 되었다. 부하라와 히바는 보호국으로 남았으나 코칸트만 칸국으로서는 사라졌다. 이 일은 코칸트 칸국이 지금의 우즈베키스탄 동부와 키르기스스탄, 타지키스탄 북부 일부에 걸친 나라였음을 생각하면 중앙아시아 정복의 마지막 큰 고비였다. 스코벨레프는 이 진압으로 이름을 얻었다. 코칸트는 19세기 초 타슈켄트와 시르다리야 중류, 페르가나 분지를 차지한 나라였으나 중엽에는 칸이 너무 자주 바뀌고 유목 세력과 정주민 세력 사이에서 흔들렸다. 폐지 뒤 칸의 일족은 러시아 땅 안에서 연금을 받거나 유배되어 지냈다. 페르가나 주의 중심은 새로 세운 신마르길란으로 정해졌다. 이 새 도시는 러시아인 거주지와 병영을 갖추고 지금의 페르가나 시가 되었다."
  subjects: [russia, kokand-khanate]
  links:
    - { from: russia, to: kokand-khanate, note: "칸국을 폐지하고 병합함 (1876)" }
  tags: [war, politics]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: second-afghan-war-1878
  year: 1878
  endYear: 1880
  title:
    ko: "제2차 아프가니스탄 전쟁과 압두르 라흐만의 즉위(1878~1880)"
  summary:
    ko: "1878년 7월 22일 러시아 사절이 카불에 도착하자 영국령 인도 정부는 같은 해 9월 외교 사절단을 보내려 했으나 카이베르 고개 입구에서 막혔다. 11월 20일 최후통첩 시한이 지나자 영국령 인도군은 세 방향에서 아프가니스탄에 들어가 알리마스지드와 페이와르 고개를 차지했다. 셰르 알리는 북쪽으로 물러나 1879년 2월 마자르이샤리프에서 죽었고, 아들 야쿠브 칸이 이어받아 5월 26일 간다마크 조약을 맺었다. 조약으로 아프가니스탄은 외교를 영국에 맡기고 해마다 보조금을 받으며 영국 대표를 카불에 두었고, 쿠람과 피신, 시비 같은 변경 땅은 영국이 쥐었다(「칼라트와 샌더먼 조약, 영국령 발루치스탄의 성립(1876~1887)」, 앞의 사건). 그러나 1879년 9월 3일 카불에서 영국 사절 루이스 카바냐리와 수행원들이 군인들의 봉기로 죽어 전쟁이 다시 터졌다. 로버츠 장군의 부대는 10월 6일 차라시아브에서 이기고 8일 카불에 들어갔으며, 야쿠브 칸은 10월 12일 자리에서 물러났다. 12월 셰르푸르 병영의 포위가 풀린 뒤에도 저항은 이어졌고, 헤라트 총독 무함마드 아유브 칸이 1880년 7월 마이완드에서 영국군 한 부대를 무찔렀다. 영국은 러시아 투르키스탄에 머물던 압두르 라흐만을 에미르로 인정하기로 해 1880년 7월 카불에서 그를 세웠고, 9월 1일 로버츠가 칸다하르에서 아유브를 깨뜨렸다. 영국군은 1881년 4월 칸다하르에서 물러났다. 영국령 인도·영국군은 모두 1만 명 넘게 죽었는데 전투 사망은 1,850명 남짓이고 나머지는 병으로 죽었으며, 아프가니스탄 쪽은 큰 전투에서만 5,000명 넘게 죽었다는 추산이 있다."
  subjects: [afghanistan, british-raj, uk, russia]
  tags: [war, diplomacy]
  sources: ["Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Martin Ewans, Afghanistan: A Short History of Its People and Politics (HarperCollins, 2002)", "Peter Hopkirk, The Great Game: The Struggle for Empire in Central Asia (Kodansha International, 1992)"]

- id: turkmen-conquest-1879
  year: 1879
  endYear: 1885
  title:
    ko: "러시아의 투르크멘 정복: 괵테페와 메르브(1879~1885)"
  summary:
    ko: "카스피해 동쪽 아할 오아시스에는 투르크멘 테케 부족이 살았고 이웃한 이란과 히바, 부하라를 약탈과 노예 거래로 위협해 왔다. 러시아는 1879년 라마킨 장군의 원정이 덴길테페에서 막히자 이듬해 미하일 스코벨레프를 보냈다. 스코벨레프는 카스피 해안에서 철도를 놓으며 보급선을 확보했고, 1880년 12월부터 괵테페 요새를 포위했다. 1881년 1월 24일 지하 갱도 폭파와 총공격으로 요새가 무너졌고 30일 아시가바트까지 차지했다. 러시아군은 요새 안과 도주하는 이들을 가리지 않고 죽였고, 테케의 사망은 약 15,000~20,000명으로 추산되며 스코벨레프는 요새 안에서만 6,500구를 묻었다고 보고했다. 러시아의 사망은 59~268명으로 사료마다 다르다. 1881년 5월 6일 카스피 건너 땅은 자카스피 주로 묶였고, 같은 해 12월 러시아와 카자르 왕조의 이란은 아할 조약으로 이란이 아할과 메르브에 대한 권리를 접고 경계를 아트렉 강 쪽으로 정했다. 메르브의 투르크멘 장로들은 1884년 초 러시아 쪽에 넘어갔고 알리하노프가 오아시스를 맡았다. 이로써 러시아는 아프가니스탄 북서 변경까지 닿았다. 1885년 3월 판데에서 아프가니스탄군과 부딪친 일은 「그레이트 게임과 판데 사건」(뒤의 사건)에 있다. 투르크멘 부족들은 러시아 아래에서 군정과 세금을 받으며 편입되었다. 요새 안에는 병사뿐 아니라 가족인 여성과 아이들도 있어 희생이 컸다. 러시아의 승리를 안 주변 투르크멘 부족들은 저항 대신 협상을 택했고, 정복 뒤 투르크멘 노동력은 철도 건설에도 쓰였다. 투르크멘은 말과 양탄자로 이름난 유목·반유목 부족이었다. 이란 국경 지대를 약탈해 붙잡은 포로를 노예로 파는 일이 러시아가 내세운 명분의 하나였다."
  subjects: [russia, qajar-iran, afghanistan]
  tags: [war, politics]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Peter Hopkirk, The Great Game: The Struggle for Empire in Central Asia (Kodansha International, 1992)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)"]

- id: abdur-rahman-1880
  year: 1880
  endYear: 1901
  title:
    ko: "압두르 라흐만의 나라 만들기와 듀랜드선(1880~1901)"
  summary:
    ko: "압두르 라흐만 칸(재위 1880~1901)은 영국이 1880년 7월 아프가니스탄의 에미르로 세운 인물로 1869년부터 러시아령 사마르칸트에서 망명했다가 돌아왔다. 1880년 영국군이 꺾은 아유브 칸을 영국군이 철수한 1881년 그가 다시 꺾고 헤라트와 칸다하르를 차지해 나라를 합쳤다. 영국의 보조금(연 120만 루피 안팎에서 뒤에 늘어남)으로 군대와 관청을 키웠고 외교는 영국에 맡겼다. 1885년 판데 위기(「그레이트 게임과 판데 사건」, 뒤의 사건) 뒤에는 북쪽 경계가 러시아와 정해졌다. 1888년 마자르이샤리프에서 사촌 이스하크 칸이 일으킨 반란을 눌렀다. 1883년 바다크샨과 와칸을 차지했고 판지강 건너 슈그난·로샨은 1895년 파미르 경계 협정으로 내놓았다(「파미르 분쟁과 파미르 경계 협정」, 뒤의 사건). 1891~1893년에는 하자라자트의 시아파 하자라 반란을 눌러 많은 사람이 죽거나 이란·영국령 인도로 달아났다. 1893년 11월 12일 영국령 인도 외무 장관 모티머 듀랜드와 카불에서 협정을 맺어 동쪽 경계선을 그었다(「듀랜드선과 치트랄 원정, 북서 변경주(1893~1901)」, 뒤의 사건). 이 선은 파슈툰 부족 지역을 둘로 갈랐다. 1895~1896년에는 카피리스탄을 정복하고 주민에게 이슬람 개종을 강요해 땅 이름을 '빛의 땅' 누리스탄으로 바꾸었다. 그는 '철의 에미르'로 불렸고 밀고망 같은 엄격한 통치로 중앙집권 국가를 만들었다. 그는 부족 반란자를 평정하는 한편 상비군과 병기 공장, 세금 징수 제도를 만들었고 부족 지도자의 자제를 궁정에 두어 인질로 삼았다. 직접 쓴 자서전도 영어로 펴냈다. 압두르 라흐만이 1901년 10월 1일 죽자 맏아들 하비불라가 이었다. 즉위 경위는 「제2차 아프가니스탄 전쟁과 압두르 라흐만의 즉위(1878~1880)」(앞의 사건)에 있다."
  subjects: [afghanistan, british-raj, uk, russia]
  tags: [politics, war]
  sources: ["Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Vartan Gregorian, The Emergence of Modern Afghanistan: Politics of Reform and Modernization, 1880–1946 (Stanford University Press, 1969)", "Martin Ewans, Afghanistan: A Short History of Its People and Politics (HarperCollins, 2002)"]

- id: railway-cotton-1880
  year: 1880
  endYear: 1906
  title:
    ko: "중앙아시아 철도와 면화(1880~1906)"
  summary:
    ko: "러시아는 스코벨레프의 원정에 쓰려고 1880년 카스피 해안 미하일롭스크 만에서 키질아르바트까지 철도를 놓기 시작했다. 이 선은 미하일 안넨코프가 맡아 아시가바트(1885)와 메르브(1886)를 지나 1888년 5월 사마르칸트까지 뻗었고, 아무다리야 철교는 부하라 에미르의 허락 아래 놓였다. 타슈켄트까지는 1899년 이어졌다. 1906년에는 오렌부르크에서 타슈켄트까지 철도가 완성되어 모스크바와 중앙아시아가 곧바로 이어졌다. 철도는 군대와 관리, 러시아 농민을 실어 날랐고 목화와 곡물 시장을 열었다. 러시아 방적 업자들은 미국산 면화 값이 오르자 중앙아시아산 면화를 키우게 했고, 미국 육지면 씨앗이 들어와 페르가나·시르다리야·자라프샨의 관개지가 목화밭으로 바뀌었다. 20세기 초 러시아 공장이 쓰는 면화의 상당 부분이 투르키스탄에서 왔다는 추산이 있다. 부하라와 히바도 보호국 신분으로 목화 거래에 묶였다. 농민은 목화 값을 담보로 빚을 졌고 곡물은 시베리아에서 들여와야 했다. 단일 작물 재배는 뒷날 소련 시기까지 이어져 아랄해 위기의 바탕이 되었다. 한편 철도는 러시아인 이주와 노동자 계층을 만들어 1905년 철도 노동자 파업 같은 움직임을 낳았다. 철도 연변에는 정거장 마을과 러시아인 구역이 생겼고 철도 노동자와 상인, 관리의 새 도시가 나타났다. 러시아 공산품이 들어오자 현지 직물 수공업은 밀려났다. 농민이 면화 값을 미리 받고 빚에 묶이는 구조도 은행과 고리대, 러시아 중개 상인 위에 자리 잡았다. 러시아는 부하라 도시에서 가까운 철도역 곁에 러시아인 도시 신부하라(지금의 카간)를 세웠고, 에미르는 철도가 부하라 시내로 들어오는 것을 막았다."
  subjects: [russia, bukhara-emirate, khiva-khanate]
  tags: [economy, society]
  sources: ["Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Alexander Morrison, Russian Rule in Samarkand, 1868–1910: A Comparison with British India (Oxford University Press, 2008)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: jadid-movement-1884
  year: 1884
  endYear: 1917
  title:
    ko: "자디드 운동(1884~1917)"
  summary:
    ko: "자디드는 이슬람 사회를 새 교육과 신문으로 고치려는 무슬림 개혁가들이다. 크림의 이스마일 가스프린스키는 1883년 신문 『타르주만』을 내고 1884년 소리 내어 글자를 가르치는 '새 방법' 학교를 처음 열었다. 이 학교는 외우기 위주의 옛 마크타브와 달리 읽기와 셈, 지리를 가르쳤다. 이 생각은 1890년대 이후 투르키스탄에 퍼져 사마르칸트의 마흐무드호자 베흐부디, 타슈켄트의 무나워르 카리 같은 사람들이 새 학교와 신문, 극장을 열었다. 베흐부디의 희곡 『아버지를 죽인 자』(1913)는 중앙아시아 근대 연극의 시작으로 꼽힌다. 부하라에서는 압두라우프 피트라트 같은 젊은 지식인(젊은 부하라인)이 에미르의 낡은 통치를 비판했다. 자디드는 러시아 지배를 받아들이면서도 근대 교육과 자치를 요구했고, 전통 울라마(카디미)와는 갈등했다. 1917년 혁명 때 이들은 투르키스탄 무슬림 협의회와 코칸트 자치 정부를 이끌었다. 이후 볼셰비키와 한때 손잡았으나 1920년대 말부터 탄압을 받았고, 베흐부디는 1919년 부하라에서 살해되었으며 피트라트와 작가 압둘라 카디리, 출프콘 같은 사람들은 1938년 대숙청 때 처형되었다. 1980년대 말 이후 우즈베키스탄에서 복권되었다. 새 방법 학교는 1900년대에 늘어나 수백 곳에 이른다는 추산이 있으나 숫자는 학자마다 다르다. 자디드는 『타라키』(1906년), 『사마르칸트』(1913년) 같은 신문을 냈고, 부하라 에미르는 이를 막았으나 개혁파는 비밀 학교로 맞섰다. 자디드 가운데에는 오스만, 이집트, 인도에서 공부한 경험이 있는 사람도 있었다. 이들의 희곡과 시, 소설은 우즈베크 근대 문학의 바탕이 되었다."
  subjects: [russia, bukhara-emirate]
  tags: [culture, society, religion]
  sources: ["Adeeb Khalid, The Politics of Muslim Cultural Reform: Jadidism in Central Asia (University of California Press, 1998)", "Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)", "Edward A. Allworth, The Modern Uzbeks: From the Fourteenth Century to the Present (Hoover Institution Press, 1990)"]

- id: steppe-settlement-1891
  year: 1891
  endYear: 1914
  title:
    ko: "스텝 총독부와 러시아인 이주(1891~1914)"
  summary:
    ko: "러시아는 1822년과 1824년 규정으로 카자흐 초원의 소주즈와 중주즈를 행정 구역으로 묶은 뒤 1868년 임시 규정으로 아크몰린스크·세미팔라틴스크·세미레치예 같은 주를 두었다. 1891년 「스텝 지방 통치 규정」은 카자흐 유목민이 쓰는 땅을 국유지로 선언하고 유목민에게는 쓸 권리만 남겼다. 이 규정으로 카자흐 지방은 서부 시베리아 총독부에서 갈라진 스텝 총독부의 이름 아래 군정으로 짜였다. 이 무렵 러시아 문서는 카자흐를 '키르기스'라고 불렀다. 1891년 이후 곡물이 남아도는 중부 러시아와 우크라이나의 농민이 시베리아 철도가 닿자 스텝으로 몰렸고, 1896년 이주청이 세워진 뒤 정부가 이주를 지원했다. 1906년 이후 스톨리핀의 농업 개혁 아래 이주가 크게 늘어 1914년 무렵까지 100만 명이 넘는 농민이 카자흐 초원과 투르키스탄으로 옮겨 온 것으로 추산된다. 정부는 유목민의 '남는 땅'을 가려 이주민에게 주었고, 카자흐 목축민은 겨울 목초지와 물가를 잃었다. 곡물과 소를 시장에 파는 농민 경제가 들어와 유목 경제의 균형이 깨졌다. 카자흐 지식인들은 이주와 땅 문제를 신문 『카자흐』 같은 곳에서 제기했고 이 불만은 1916년 반란의 한 원인이 되었다. 정부는 유목민의 계절 이동 경로를 좁히고 이주민을 위해 따로 땅을 가르는 정책을 썼다. 이주민 마을은 곡물을 키우고 철도를 따라 시장 도시를 이루었다. 카자흐의 목축 면적은 줄고 가축 수도 크게 줄었다는 추산이 있다. 1897년 러시아 제국 인구 조사에서 카자흐(당시 이름은 키르기스)는 300만 명 남짓으로 집계되었다. 이주민 가운데에는 러시아인뿐 아니라 우크라이나인과 벨라루스인 농민도 많았다."
  subjects: [russia]
  tags: [society, politics]
  sources: ["Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Sarah Cameron, The Hungry Steppe: Famine, Violence, and the Making of Soviet Kazakhstan (Cornell University Press, 2018)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: andijan-uprising-1898
  year: 1898
  title:
    ko: "안디잔 봉기(1898)"
  summary:
    ko: "1898년 5월 17일 밤 무함마드 알리 두크치 이샨(마달리 이샨)이 이끄는 수피 교단의 신도 수천 명(약 2,000명이라는 설이 많다)이 페르가나 분지의 안디잔 병영을 습격했다. 이샨은 마르길란 근교 밍테파의 영적 지도자로 러시아 지배와 이교도의 생활 양식에 맞서 성전을 일으켰다. 습격은 새벽에 병영에서 러시아 병사 20명 남짓을 죽였으나 곧 격퇴되었다. 이샨은 사로잡혀 다른 주모자들과 함께 군법 회의에서 사형을 받았고 수백 명이 시베리아 유형을 받았다는 기록이 있다. 투르키스탄 총독 두호프스코이는 사건 뒤 이슬람 교단과 신도의 모임을 더 엄하게 감시했다. 이 봉기는 러시아의 군정과 높은 세금, 새로 들어온 목화 시장과 외지인에 대한 불만이 이슬람 지도자에게 모인 사건으로 해석된다. 일부 연구자는 이를 1916년 반란 전의 큰 폭력으로 본다. 러시아 관리들은 이를 외부 이슬람 세력의 음모로 보려 했으나 그런 증거는 약했고, 이는 러시아 당국이 이슬람을 두려워한 모습을 보여 준다. 봉기는 짧았지만 러시아가 투르키스탄 통치의 허술함을 알게 한 사건이었다. 재판은 군법 회의로 진행되었고 민간 재판의 절차를 거치지 않았다. 이후 투르키스탄 당국은 수피 교단과 성직자의 모임을 더 엄하게 감시했고, 책임을 이샨 개인의 광신으로 돌리는 서술이 많았다. 그러나 참가자 가운데에는 정복 뒤 흔들린 지역 질서와 땅 문제에 불만을 가진 농민과 장인이 많았다는 지적도 있다. 안디잔은 1876년 폐지된 코칸트 칸국의 옛 땅이어서 칸국 시대의 질서를 기억하는 주민이 많았다. 투르키스탄 총독 세르게이 두호프스코이는 사건 뒤 주 장관들에게 이슬람 교단의 활동 보고를 요구했다."
  subjects: [russia]
  tags: [war, religion, politics]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Adeeb Khalid, The Politics of Muslim Cultural Reform: Jadidism in Central Asia (University of California Press, 1998)"]

- id: habibullah-afghanistan-1901
  year: 1901
  endYear: 1919
  title:
    ko: "하비불라의 아프가니스탄: 개혁과 중립(1901~1919)"
  summary:
    ko: "압두르 라흐만이 1901년 10월 1일 죽자 맏아들 하비불라가 별 다툼 없이 에미르가 되었다. 그는 아버지의 철권 통치를 조금 풀어 정치범을 풀어 주고 1904년 카불에 서양식 교육을 하는 하비비아 학교를 세웠다. 외교는 여전히 영국에 맡겨져 있었다. 1905년 3월 영국령 인도 사절 루이스 데인과 맺은 조약이 압두르 라흐만 때의 약속을 이어 영국이 해마다 보조금을 주고 외교를 맡는다고 정했다. 1907년 1월 인도를 찾았으나, 같은 해 8월 영국과 러시아가 맺은 협정은 아프가니스탄을 영국의 영향권으로 인정하면서 아프가니스탄 정부의 동의는 구하지 않았고 하비불라는 이를 인정하지 않았다(「영러 협상과 삼국 협상」, 뒤의 사건). 마흐무드 타르지 같은 젊은 지식인이 돌아와 1911년 신문 『시라지 알아크바르』를 냈고, 이들이 뒷날 아만알라의 개혁을 이끌었다. 제1차 세계 대전이 터지자 하비불라는 오스만의 성전 호소에도 중립을 지켰다. 1915년 10월 독일과 오스만의 니데르마이어·헨티히 사절단이 카불에 와서 아프가니스탄을 연합국에 맞서 끌어들이려 했으나 하비불라는 서둘러 응하지 않고 시간을 끌었고, 이는 영국령 인도를 지키는 데 도움이 되었다. 전쟁 뒤 독립을 바라는 목소리가 커졌고, 하비불라는 1919년 2월 20일 무렵 라그만의 사냥 중에 암살되었다. 동생 나스룰라가 에미르를 칭했으나 아만알라가 군대를 등에 업고 곧 그를 몰아냈다. 하비불라의 죽음은 독립 전쟁의 신호가 되었다. 내정에서는 카불에 군사 학교와 병기 공장을 늘리고 전화와 전신을 들였으며 자발 우스시라지 수력 발전소(1911년)를 세웠다. 동생 나스룰라는 종교계와 가까운 보수파를 이끌었고, 타르지를 따르는 개혁파와의 균형이 하비불라 정치의 큰 틀이었다."
  subjects: [afghanistan, british-raj, uk, russia, ottoman, german-empire]
  tags: [politics, diplomacy]
  sources: ["Ludwig W. Adamec, Afghanistan, 1900–1923: A Diplomatic History (University of California Press, 1967)", "Vartan Gregorian, The Emergence of Modern Afghanistan: Politics of Reform and Modernization, 1880–1946 (Stanford University Press, 1969)", "Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)"]

- id: revolt-1916
  year: 1916
  endYear: 1917
  title:
    ko: "1916년 중앙아시아 반란과 우르쿤(1916~1917)"
  summary:
    ko: "1916년 7월 8일(구력 6월 25일) 러시아 황제는 지금까지 병역이 면제되던 투르키스탄과 스텝의 19~43세 남성을 전선 후방의 노동 부대로 동원하라는 칙령을 내렸다. 땅을 빼앗긴 불만과 전쟁에 따른 물가 상승, 징집 명단을 만드는 관리의 부패가 겹쳐 7월 16일(구력 7월 3일) 후잔드에서 첫 충돌이 일어났고 소요는 타슈켄트, 안디잔, 나만간과 지작으로 번졌다. 스텝에서는 투르가이의 아만겔디 이마노프가 반란을 이끌었고, 세미레치예에서는 키르기스(유목 키르기스)와 카자흐 반란자들이 러시아 이주민 마을을 습격했다. 총독 마르트손 아래 시작된 반란을 8월 부임한 쿠로파트킨이 3만 명 안팎의 병력과 카자크 부대로 진압했고 징집을 미루었으나 조치가 전해지는 데 한 달 넘게 걸렸다. 군사 법정은 사형을 선고했고 마을이 불탔다. 수만 명의 키르기스와 카자흐가 중국령으로 달아났고, 이 피란을 키르기스어로 '우르쿤'이라 한다. 해발 3,000미터가 넘는 천산 산길을 넘으며 많은 사람이 죽었다. 사망 추산은 10만~50만 명(소콜 1954년 약 27만 명)으로 갈리고, 키르기스 연구자 바트르바예바는 인구 통계에 기대 약 4만 명으로 본다. 러시아 이주민 쪽은 약 2,300~3,000명이 죽었다. 자카스피 지역의 저항은 1917년 1월 말 끝났다. 이 반란은 러시아의 식민 지배에 대한 가장 큰 무장 저항으로 꼽히며 지금도 키르기스스탄과 카자흐스탄에서 기억된다. 반란의 공격 대상은 러시아인 관리와 이주민만이 아니었다. 징집 명부를 만드는 현지 마을 관리와 부유층도 부정을 저지른다는 의심을 받아 습격당했다. 반란의 한 중심이던 세미레치예에서는 러시아 이주민도 큰 피해를 입었고, 이는 뒤의 보복에 구실이 되었다."
  subjects: [russia]
  tags: [war, society, politics]
  sources: ["Edward Dennis Sokol, The Revolt of 1916 in Russian Central Asia (Johns Hopkins Press, 1954)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Sarah Cameron, The Hungry Steppe: Famine, Violence, and the Making of Soviet Kazakhstan (Cornell University Press, 2018)"]

- id: turkestan-revolution-1917
  year: 1917
  endYear: 1918
  title:
    ko: "투르키스탄의 혁명: 타슈켄트 소비에트와 코칸트 자치 정부(1917~1918)"
  summary:
    ko: "러시아에서 「러시아 2월 혁명」(같은 해의 사건)이 일어나자 투르키스탄에서도 총독부가 무너지고 임시 정부의 투르키스탄 위원회가 세워졌다. 그러나 타슈켄트의 권력은 러시아인 노동자와 병사의 소비에트가 쥐었고, 무슬림 주민은 대표권에서 밀려났다. 1917년 11월 타슈켄트 소비에트는 「러시아 10월 혁명」(같은 해의 사건) 뒤 정권을 잡았다. 같은 해 12월(신력) 코칸트에서 열린 무슬림 대회가 투르키스탄 자치 정부를 선포했고 무스타파 초카예프가 의장을 맡았다. 이 정부는 자디드와 지식인이 이끌었으나 군대도 재정도 없었다. 1918년 2월 콜레소프 휘하의 붉은 군대가 코칸트를 공격해 자치 정부를 무너뜨렸고 도시가 약탈당하고 불탔다. 희생자 수는 수천 명에서 2만 명이 넘는다는 추산까지 갈린다. 이 뒤 바스마치 저항이 커졌다(「러시아 내전과 전시 공산주의」, 뒤의 사건). 1918년 3월 콜레소프의 부하라 공격은 실패해 에미르와 조약을 맺었다. 4월 30일 타슈켄트에서 투르키스탄 자치 소비에트 사회주의 공화국이 선포되어 러시아 연방에 속했는데, 원주민은 지도부에서 대부분 빠졌다. 1918년 7월에는 아시가바트에서 반볼셰비키 자카스피 임시 정부가 서 영국군 사절단의 도움을 받았다. 투르키스탄 공화국은 내전 속에서 이어졌고 1924년 경계 획정으로 해체되었다. 소비에트와 임시 정부의 투르키스탄 위원회가 모두 현지 주민을 지도부에서 배제한 점이 코칸트 자치 선포의 직접 이유로 꼽힌다. 초카예프는 뒤에 외국으로 망명해 반소련 활동을 이어 갔다. 코칸트 시장이 불탔다는 기록이 있고 자치 정부의 지도자들은 달아나거나 숨었다."
  subjects: [russia, soviet-union, bukhara-emirate]
  tags: [politics, war]
  sources: ["Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)"]

- id: alash-orda-1917
  year: 1917
  endYear: 1920
  title:
    ko: "알라시 오르다와 카자흐 자치 운동(1917~1920)"
  summary:
    ko: "카자흐 지식인들은 1916년 반란과 토지 문제를 지켜보며 정치 조직을 꾸리기 시작했다. 1917년 7월(신력) 오렌부르크에서 첫 전 카자흐 대회가 열려 알리한 부케이한을 중심으로 알라시 당을 세웠다. 12월 2차 대회는 카자흐 지역의 자치를 선포하고 정부 격인 알라시 오르다를 세웠으며 중심은 세미팔라틴스크(지금의 세메이)에 두었다. 알리한 부케이한이 의장을 맡았고 아흐메트 바이투르신, 미르자크프 둘라토프 같은 인물이 함께했다. 이들은 카자흐 부족 질서를 근대적 민족 국가의 틀로 바꾸려 했고 유목민의 땅을 보호하려 했다. 내전이 터지자 알라시 오르다는 처음에 백군 쪽의 두토프, 콜차크와 손잡았으나 그들이 자치를 인정하지 않아 갈라섰고 1919년 소비에트 정부와 협상해 붉은 군대 쪽으로 돌아섰다. 소비에트 정부는 1919~1920년 알라시 오르다를 해산시켰다. 1920년 8월 소비에트 러시아는 오렌부르크를 수도로 키르기스 자치 소비에트 사회주의 공화국을 세웠고, 이 이름은 1925년 카자흐 자치 공화국으로 바뀌었다. 알라시 오르다 인사 가운데 상당수는 새 공화국의 교육과 행정에 참여했으나 1930년대 후반의 대숙청 때 처형되거나 옥사했다. 부케이한과 바이투르신은 1937년 처형되었다고 전해진다. 알라시 당의 강령은 보통 선거와 정교 분리, 지방 자치, 카자흐 땅의 보호, 카자흐어 학교의 확충을 담았다. 부케이한은 산림 기술자 출신이었고 바이투르신은 카자흐어 문자 개혁과 교과서로 이름난 언어학자였다. 알라시는 카자흐 전승에서 시조로 꼽는 이름이라고 한다. 이들 가운데 일부는 소련 공화국의 교육과 출판 기관에서 일했다."
  subjects: [russia, soviet-union]
  tags: [politics]
  sources: ["Sarah Cameron, The Hungry Steppe: Famine, Violence, and the Making of Soviet Kazakhstan (Cornell University Press, 2018)", "Steven Sabol, Russian Colonization and the Genesis of Kazak National Consciousness (Palgrave Macmillan, 2003)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: basmachi-1918
  year: 1918
  endYear: 1934
  title:
    ko: "바스마치 운동(1918~1934)"
  summary:
    ko: "바스마치는 러시아 당국과 소련 쪽 서술이 붙인 이름으로 우즈베크어 '습격자'에서 왔고 비하하는 뜻이 있었으며, 싸운 사람들은 스스로를 이슬람의 전사나 자유의 전사로 불렀다. 그 뿌리는 1916년 반란과 1918년 2월 코칸트 자치 정부의 진압에 있다. 페르가나에서는 이르가시, 마다민 벡, 코르시르마트 같은 지휘관이 소비에트 정권에 맞서 싸웠고, 마다민 벡은 한때 러시아 이주민과 손잡았다가 1920년 3월 붉은 군대 쪽으로 돌아섰다. 동부 부하라와 히사르 쪽에서는 이브라힘 벡이 이끌었다. 1921년 11월 오스만 제국의 옛 육군 장관 엔베르 파샤가 합류해 범튀르크주의 통합을 꾀했으나 바스마치 지도자들과 어울리지 못했고 1922년 8월 4일 전투에서 죽었다. 소비에트 정부는 군사 공세와 함께 와크프 재산을 돌려주고 샤리아 법정과 쿠란 학교를 허용하는 양보를 했고, 1922년 6월 카프룬 전투 이후 저항이 줄었다. 1923년에는 가름에서 몰렸다. 이 사이 많은 지도자가 아프가니스탄으로 달아나 그곳에서 국경 습격을 이어 갔고, 소련군은 1929~1930년 국경을 넘어 이를 눌렀다. 집단화에 맞서 1929년 이후 다시 일어난 저항도 있었고, 히바에서는 준나이드 칸이 1920년대 후반까지 싸웠다. 마지막 큰 작전은 1933년 10월 카라쿰에서 있었고 1934년 무렵 끝난 것으로 본다. 소비에트 쪽은 바스마치를 부농과 성직자, 외국의 사주를 받은 반혁명으로 설명했다. 그러나 일부 지휘관은 지역 공동체와 이슬람을 지킨다는 뜻을 밝혔고 튀르크 민족주의자와 전직 에미르 관리까지 얽혀 있어, 운동 전체를 하나로 정의하기는 어렵다. 소련 쪽 대응은 「히바와 부하라의 인민 소비에트 공화국(1920~1924)」(뒤의 사건)에 이어진다."
  subjects: [soviet-union, bukhara-emirate, khiva-khanate, afghanistan]
  tags: [war, politics]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)", "Martha Brill Olcott, 'The Basmachi or Freemen's Revolt in Turkestan 1918–24', Soviet Studies 33:3 (1981)"]

- id: amanullah-reforms-1919
  year: 1919
  endYear: 1929
  title:
    ko: "제3차 아프가니스탄 전쟁과 아만알라의 개혁(1919~1929)"
  summary:
    ko: "하비불라가 1919년 2월 암살되자 동생 나스룰라가 에미르를 칭했으나(2월 20일~28일) 하비불라의 셋째 아들 아만알라가 카불의 군대를 쥐고 자리를 차지했다. 아만알라는 영국령 인도의 소요를 틈타 독립을 되찾겠다며 5월 3일 바그를 점령해 전쟁을 일으켰고, 영국은 5월 6일 선전 포고했다. 영국군은 전선에서 아프가니스탄군을 물리치고 5월 24일 영국 공군기가 카불을 폭격했으며 아만알라는 5월 29일 휴전을 청해 6월 3일 발효했다. 8월 8일 라왈핀디 조약으로 영국은 보조금을 끊고 외교 지도권을 접었고 듀랜드선은 확인되었으며, 조약문이 독립을 분명히 쓰지는 않았으나 아프가니스탄은 사실상 외교 독립을 얻었다. 소련과는 1921년 2월 모스크바 조약을 맺어 소련이 처음으로 아프가니스탄의 독립을 인정했고 영국과는 1921년 11월 카불 조약으로 관계를 정했다. 아만알라는 1923년 헌법을 공포하고 학교와 여학교를 세우고 강제 노역과 일부 세금을 고쳤으며 여성의 베일 문제와 서양식 복장을 놓고 갈등을 빚었다. 1926년 6월 9일 에미르에서 왕으로 칭호를 올렸다. 1924년 초 호스트의 부족이 일으킨 반란은 1925년 1월까지 이어졌고 진압되었다. 1927년 12월부터 이듬해 7월까지 인도, 이집트, 유럽, 소련, 튀르키예를 돈 뒤 더 빠른 개혁을 밀어붙였고, 1928년 가을 울라마와 부족 지도자들의 반발이 커져 내전으로 번졌다. 이 일은 「아만알라의 몰락과 무사히반 왕조의 성립(1929~1933)」(뒤의 사건)에서 이어진다. 1924~1925년 호스트 반란은 징병과 호적 등록, 세금 제도 개혁에 대한 부족의 반발이었다."
  subjects: [afghanistan, british-raj, uk, soviet-union]
  tags: [war, diplomacy, politics]
  sources: ["Ludwig W. Adamec, Afghanistan, 1900–1923: A Diplomatic History (University of California Press, 1967)", "Vartan Gregorian, The Emergence of Modern Afghanistan: Politics of Reform and Modernization, 1880–1946 (Stanford University Press, 1969)", "Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)"]

- id: people-soviet-republics-1920
  year: 1920
  endYear: 1924
  title:
    ko: "히바와 부하라의 인민 소비에트 공화국(1920~1924)"
  summary:
    ko: "히바에서는 1918년 10월 칸 이스판디야르가 투르크멘 지도자 준나이드 칸에게 살해된 뒤 그의 꼭두각시 사이드 압둘라(재위 1918~1920)가 자리에 앉았다. 1920년 1월 붉은 군대가 호라즘으로 들어가자 준나이드가 쫓겨났고 칸은 2월 2일 물러났다. 4월 26일 호라즘 인민 소비에트 공화국이 세워졌고 칸국의 마지막 이름은 사라졌다. 부하라에서는 에미르 알림 칸(재위 1910~1920)이 젊은 부하라인(자디드)과 러시아 공산주의자의 압력을 받았다. 1920년 8월 말 프룬제가 이끈 붉은 군대가 부하라를 공격해 9월 2일 도시를 차지했고, 에미르는 동부 부하라로 달아났다가 1921년 아프가니스탄으로 망명해 1944년 카불에서 죽었다. 이 뒤 부하라 인민 소비에트 공화국이 세워졌고 파이줄라 호자예프가 인민 위원회 의장이 되어 이끌었다. 두 공화국은 형식상 독립국이었으나 1921년 소비에트 러시아와 군사·경제 협정을 맺어 붉은 군대와 소련 고문에 기댔다. 이들은 러시아 연방 밖에서 따로 사회주의 공화국으로 이름이 바뀌었다가(호라즘은 1923년, 부하라는 1924년) 1924년 10월 민족 경계 획정으로 없어졌다. 이 사이 동부 부하라에서는 이브라힘 벡의 저항이 길게 이어졌고, 에미르국과 칸국의 땅은 우즈베크, 투르크멘, 타지크 공화국에 나뉘어 들어갔다. 호라즘 공화국의 지도부에는 젊은 히바 개혁가와 투르크멘·우즈베크 대표가 있었고 농민은 토지 개혁과 세금 감면을 요구했다. 부하라 정부 안에서는 자디드 출신과 공산당원의 갈등이 커서 1920년대 초 숙청이 잇따랐다. 소비에트 정권에 맞선 저항은 「바스마치 운동(1918~1934)」(앞의 사건)에 있다."
  subjects: [khiva-khanate, bukhara-emirate, soviet-union]
  tags: [politics, war]
  sources: ["Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: national-delimitation-1924
  year: 1924
  endYear: 1936
  title:
    ko: "소련의 민족 경계 획정과 중앙아시아 공화국들(1924~1936)"
  summary:
    ko: "「신경제 정책과 소련의 수립」(앞의 사건) 뒤 소련은 1924년 투르키스탄 자치 공화국과 부하라, 호라즘을 '민족'에 따라 새로 나누기로 했다. 그 이전의 경계는 부하라 토후국과 히바 칸국의 영역, 투르키스탄 공화국 주들로 민족이 섞여 있었다. 1924년 6월 공산당 중앙 위원회가 결정을 내려 중앙아시아 국이 작업했고 10월 14일 타지크 자치 공화국(우즈베크 공화국 안)이, 10월 27일 우즈베크와 투르크멘 소비에트 사회주의 공화국이 세워졌다. 카라키르기스 자치주와 카라칼파크 자치주는 러시아 연방 안에 두어졌다. 1925년 키르기스 자치 공화국의 이름이 카자흐 자치 공화국으로 바뀌었다. 1929년 10월 타지크 자치 공화국이 연방 공화국으로 올라서며 후잔드를 더했고, 키르기스 자치 공화국은 1926년에 자치 공화국이 되었다. 1936년 12월 카자흐와 키르기스가 연방 공화국이 되었고 카라칼파크는 우즈베크 공화국에 들어갔다. 소련 지도부는 이를 소수 민족이 자기 땅과 말, 관리를 갖게 하는 정책으로 설명했다. 연구자들은 소련이 민족 정체성을 만들고 지배하려 했다고 보거나, 이미 있던 민족주의 움직임을 반영했다고 보아 의견이 갈린다. 부하라와 사마르칸트의 타지크어 사용자들이 우즈베크 공화국에 남아 불만이 남았다. 사마르칸트는 1930년까지 우즈베크 공화국의 수도였다가 타슈켄트로 옮겨졌다. 경계를 긋는 작업에는 언어학자와 민족지학자가 참여했고 1926년 소련 첫 인구 조사의 민족 구분이 쓰였다. 페르가나 분지처럼 민족이 뒤섞인 곳은 경계선이 복잡해졌고, 오늘날 키르기스스탄·우즈베키스탄·타지키스탄 사이의 국경 문제 가운데 다수가 이때 그어진 선에서 비롯했다고 본다."
  subjects: [soviet-union, bukhara-emirate, khiva-khanate]
  tags: [politics, society]
  sources: ["Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)", "Francine Hirsch, Empire of Nations: Ethnographic Knowledge and the Making of the Soviet Union (Cornell University Press, 2005)", "Terry Martin, The Affirmative Action Empire: Nations and Nationalism in the Soviet Union, 1923–1939 (Cornell University Press, 2001)"]

- id: musahiban-afghanistan-1929
  year: 1929
  endYear: 1933
  title:
    ko: "아만알라의 몰락과 무사히반 왕조의 성립(1929~1933)"
  summary:
    ko: "1928년 11월 카불 북쪽의 타지크 지도자 하비불라 칼라카니('바차이 사카오')가 아만알라에 맞서 일어났다. 아만알라는 1929년 1월 14일 왕위에서 물러나 형 이나야툴라에게 넘겼으나 이나야툴라는 1월 17일까지 사흘 만에 물러났고 칼라카니가 카불에서 왕을 칭했다. 아만알라는 3월 칸다하르에서 복귀를 시도했으나 5월 23일 인도로 떠났다. 칼라카니는 1929년 1월부터 10월까지 재위했다. 파리에 있던 옛 장군 무함마드 나디르 칸이 영국의 묵인 아래 부족을 모아 카불을 쳐서 10월 13일 도시를 차지했고 15일 나디르 샤로 즉위했다. 칼라카니는 곧 처형되었다. 나디르 샤는 같은 무사히반 가문 사람으로 아만알라의 개혁을 늦추고 울라마와 부족의 지지를 얻으려 했다. 1931년 헌법을 공포해 하나피 이슬람법을 바탕으로 의회를 두었다. 1933년 11월 8일 나디르 샤는 카불 학생에게 암살되었고 19세의 아들 자히르 샤가 왕위를 이었으며 실권은 숙부 하심 칸 총리가 쥐었다. 이 가문이 1973년 다우드의 쿠데타까지 아프가니스탄을 다스렸다(「다우드의 공화국과 사우르 혁명(1973~1979)」, 뒤의 사건). 이 시기 국경 건너 소련의 중앙아시아에서는 바스마치 지도자들이 아프가니스탄으로 피신했고 소련은 이를 구실로 개입했다. 칼라카니와 그의 동지들은 안전을 약속받고 항복했으나 곧 처형되었다고 전해진다. 나디르 샤 시기에 군대와 은행, 대학이 정비되어 1932년 카불 대학이 문을 열었다. 무사히반은 '동반자'라는 뜻으로 나디르 샤의 가문을 가리키며, 그의 형제 하심 칸과 샤 마흐무드 칸이 차례로 총리를 맡아 실권을 쥐었다. 이 체제는 부족과 종교계의 보수적 견제를 받아 개혁의 속도를 늦췄다."
  subjects: [afghanistan, british-raj, uk, soviet-union]
  tags: [politics, war]
  sources: ["Vartan Gregorian, The Emergence of Modern Afghanistan: Politics of Reform and Modernization, 1880–1946 (Stanford University Press, 1969)", "Louis Dupree, Afghanistan (Princeton University Press, 1973)", "Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)"]

- id: kazakh-famine-1930
  year: 1929
  endYear: 1934
  title:
    ko: "집단화와 카자흐 대기근(1929~1934)"
  summary:
    ko: "소련 정부는 1920년대 말부터 유목민을 정착시키고 집단 농장에 묶으려 했다. 카자흐 공산당 제1서기 필리프 골로셰킨은 1920년대 중반부터 유목 사회의 부농 격인 바이를 겨냥한 '작은 10월' 정책을 폈다. 1929~1930년 목축 가축을 강제로 거두고 곡물과 고기 징발량을 높게 정하자 가축 수가 크게 줄었는데, 연구자들은 소와 양이 약 80~90% 줄었다고 추산한다. 정착 준비도 없이 집단 농장에 묶인 사람들은 1930~1933년 굶주림에 시달렸다. 사망자는 추산에 따라 약 130만~230만 명이며 높은 쪽 추산은 카자흐인 가운데 38~42%에 이른다. 카자흐 공화국 안 카자흐인의 비중은 약 60%에서 38%로 떨어졌다. 약 66만~110만 명이 중국, 몽골, 아프가니스탄, 이란, 소련 다른 공화국으로 피란했고 중국으로 넘으려다 국경 수비대에 사살된 이들도 있다. 1931년 서부 카자흐의 아다이 지역 같은 곳에서 봉기가 일어났으나 진압되었다. 일부 연구자와 카자흐스탄 정부는 이를 제노사이드로 보고, 다른 연구자는 의도적 학살이 아니라 정책의 무모함과 관료의 무관심이 낳은 기근으로 본다. 의견이 갈리는 가운데 소련 안 다른 지역의 기근(우크라이나 등)과의 비교도 이어진다. 골로셰킨은 1933년 자리를 떠났고 아르메니아 출신 레본 미르조얀이 뒤를 이었다. 이 사건이 카자흐 사회와 인구에 남긴 상처는 뒷날 「면화 단작과 아랄해의 축소(1960~2005)」(뒤의 사건)가 다루는 면화 중심 농업 정책 같은 소련 시기의 정책 논의에도 이어진다. 카자흐 지도부 안에서도 투라르 리스쿨로프 같은 공산당원이 중앙에 징발 완화를 호소했으나 받아들여지지 않았다. 1935년 집단 농장 규약이 농가의 가축 소유를 일부 허용하면서 정책이 누그러졌다. 기근 뒤에는 남은 유목민이 정착 농장으로 옮겨 살게 되었다."
  subjects: [soviet-union]
  tags: [society, politics, economy]
  sources: ["Sarah Cameron, The Hungry Steppe: Famine, Violence, and the Making of Soviet Kazakhstan (Cornell University Press, 2018)", "Niccolò Pianciola, 'The Collectivization Famine in Kazakhstan, 1931–1933', Harvard Ukrainian Studies 25:3–4 (2001)", "Robert Kindler, Stalin's Nomads: Power and Famine in Kazakhstan (University of Pittsburgh Press, 2018)"]

- id: east-turkestan-republics-1933
  year: 1933
  endYear: 1949
  title:
    ko: "신장의 군벌과 두 동투르키스탄 공화국(1933~1949)"
  summary:
    ko: "중화민국이 들어선 뒤 신장은 1912~1928년 성장 양쩡신이, 1928~1933년 주석 진수런이 다스렸다. 하미의 반란(1931)과 간쑤 회족 군벌 마중잉의 개입 속에서 1933년 4월 쿠데타로 진수런이 쫓겨나고 류원룽이 주석을 이었으나 군사 총독 성스차이가 실권을 잡았다. 호탄과 카슈가르에서는 1933년 초부터 위구르 지도자들이 움직였고 1933년 11월 카슈가르에서 동투르키스탄 이슬람 공화국이 선포되었으나 1934년 2월 마중잉 군과 성스차이에게 무너졌다. 성스차이는 소련의 군사 지원으로 마중잉을 몰아냈고 1934년 '6대 정책'을 내세웠으며 소련 영향 아래 신장을 다스렸다. 1937~1938년 그는 위구르와 회족 엘리트를 포함한 반대파를 숙청했고 사망은 5만~10만 명으로 추산된다. 1942년 이후 소련이 독일과 전쟁에 몰리자 그는 충칭의 국민당 정부 쪽으로 기울었고 1944년 해임되었다. 같은 해 11월 이리(굴자)에서 반란이 일어나 동투르키스탄 공화국이 선포되었고 엘리한 퇴레가 의장을 맡았다. 이 공화국은 소련의 도움을 받았고 이리, 타르바가타이, 알타이 세 지구를 다스렸다. 1946년 국민당 정부와 연합 정부를 세웠다가 갈라졌고 1949년 중화인민공화국이 신장에 들어오며 세 지구 정권도 흡수되었다. 이후의 편입과 신장 정책은 「신장의 편입과 위구르 문제(1944~2022)」(뒤의 사건)에 있다. 첫 공화국의 대통령은 호자 니야즈, 총리는 사비트 다몰라였고 샤리아에 바탕을 둔 국가를 표방했다. 반면 이리의 두 번째 공화국은 위구르·카자흐·회족 지도자들이 소련의 지원 속에 이끌었다. 소련은 성스차이를 도와 광물과 통상에서 특권을 얻었다."
  subjects: [roc, soviet-union, prc]
  tags: [politics, war]
  sources: ["Andrew D. W. Forbes, Warlords and Muslims in Chinese Central Asia: A Political History of Republican Sinkiang 1911–1949 (Cambridge University Press, 1986)", "Linda Benson, The Ili Rebellion: The Moslem Challenge to Chinese Authority in Xinjiang, 1944–1949 (M. E. Sharpe, 1990)", "Justin Jacobs, Xinjiang and the Modern Chinese State (University of Washington Press, 2016)"]

- id: deportations-central-asia-1937
  year: 1937
  endYear: 1944
  title:
    ko: "소련 민족들의 중앙아시아 강제 이주(1937~1944)"
  summary:
    ko: "스탈린 시기 소련은 국경 지대와 '신뢰할 수 없다'고 본 민족을 통째로 먼 곳으로 옮겼고 중앙아시아와 카자흐스탄이 그 주요 행선지가 되었다. 민족 전체로는 첫 번째인 1937년 극동 연해주의 고려인 약 17만 명의 이주로, 이 일은 「연해주 한인의 중앙아시아 강제 이주」(같은 해의 사건)에서 다룬다. 카자흐스탄과 우즈베키스탄에 내려진 이들은 먼저 집단 농장을 만들었고 쌀과 면화 재배에 쓰였다. 이에 앞선 1936년에는 폴란드계 약 3만 6천 명이 우크라이나 국경 지대에서 카자흐스탄으로 옮겨졌다. 1941년 8월 28일 칙령으로 볼가 독일인 40만 명 안팎을 비롯한 소련 독일인 약 95만 명이 독소 전쟁의 시작(「독소 전쟁의 시작」, 뒤의 사건) 뒤 카자흐스탄과 시베리아로 옮겨졌다. 1943~1944년에는 카라차이(1943년 11월), 칼미크(1943년 12월), 체첸과 인구시(1944년 2월), 발카르(1944년 3월), 크림 타타르(1944년 5월), 메스케티아 튀르크(1944년 11월)가 나치 독일에 협력했다는 집단 혐의를 받아 카자흐스탄, 키르기스스탄, 우즈베키스탄 같은 곳으로 보내졌다. 이주민은 NKVD가 관리하는 '특별 정착지'에 묶여 이동이 제한되었고, 이동 중과 첫 몇 해의 굶주림과 질병으로 많은 사람이 죽었다. 민족마다 사망 추산이 크게 갈린다. 1956~1957년 일부 민족에게 귀환이 허용되었으나 볼가 독일인과 크림 타타르, 메스케티아 튀르크의 귀환은 훨씬 늦었다. 이주 대상이 된 민족은 며칠 안에 짐을 꾸려 화물 열차에 실렸고 이동에는 몇 주가 걸렸다. 그 결과 카자흐스탄과 중앙아시아는 여러 민족이 섞여 사는 곳이 되었다. 특별 정착지의 이주민은 1948년부터 영구 추방으로 선고되어 허가 없이 떠나면 징역형을 받았다."
  subjects: [soviet-union, nazi-germany]
  tags: [society, politics]
  sources: ["Pavel Polian, Against Their Will: The History and Geography of Forced Migrations in the USSR (Central European University Press, 2004)", "Terry Martin, 'The Origins of Soviet Ethnic Cleansing', Journal of Modern History 70:4 (1998)", "Alexander Nekrich, The Punished Peoples: The Deportation and Fate of Soviet Minorities at the End of the Second World War (W. W. Norton, 1978)"]

- id: world-war-central-asia-1941
  year: 1941
  endYear: 1945
  title:
    ko: "2차 대전기의 중앙아시아: 후방 기지와 징집(1941~1945)"
  summary:
    ko: "1941년 6월 나치 독일의 침공(「독소 전쟁의 시작」, 같은 해의 사건) 뒤 소련은 서부의 공장을 우랄과 시베리아, 중앙아시아로 옮겼다. 카자흐스탄, 우즈베키스탄, 키르기스스탄은 이 소개 공장과 수십만 명의 피란민을 받아 후방 산업 기지가 되었다. 알마아타와 타슈켄트는 모스크바와 레닌그라드에서 온 영화·학술·문화 기관과 예술가를 맞았고, 영화 스튜디오가 알마아타에 옮겨 와 영화를 만들었다. 카자흐스탄의 카라간다 탄광과 발하시 구리, 우즈베키스탄의 목화와 중공업이 전쟁 물자를 대었다. 징집도 컸다. 카자흐스탄과 우즈베키스탄에서만 각각 100만 명 안팎이 군대에 나갔다고 하며 많은 이들이 전선에서 죽거나 실종되었다. 알마아타에서 편성된 제316 소총 사단(사령관 판필로프)은 1941년 모스크바 방어전에 참전했다. 1942년 폴란드인 안데르스 군이 우즈베키스탄과 카자흐스탄에서 편성되어 이란으로 떠났다. 영국과 소련은 1941년 8월 팔라비 왕조의 이란을 점령해 철도로 보급로를 열었는데(이란 회랑), 이 길은 중앙아시아 쪽으로도 이어졌다. 나치 독일은 포로가 된 중앙아시아인으로 투르키스탄 군단을 만들었다. 전쟁 중 징집과 공출, 노동 동원은 농촌의 삶을 어렵게 했고 소련 안의 강제 이주(「소련 민족들의 중앙아시아 강제 이주(1937~1944)」, 앞의 사건)와 겹쳤다. 알마아타에서는 영화 감독 에이젠시테인이 『이반 뇌제』를 촬영했고 타슈켄트는 시인 안나 아흐마토바 같은 문인을 받아들였다. 카자흐스탄의 곡물과 가축, 키르기스스탄의 양모와 고기도 전선 보급에 쓰였다. 소개되었던 공장 가운데 상당수는 전쟁 뒤에도 현지에 남아 중앙아시아 공업의 바탕이 되었다."
  subjects: [soviet-union, nazi-germany, pahlavi-iran]
  tags: [war, society]
  sources: ["Rebecca Manley, To the Tashkent Station: Evacuation and Survival in the Soviet Union at War (Cornell University Press, 2009)", "Sarah Cameron, The Hungry Steppe: Famine, Violence, and the Making of Soviet Kazakhstan (Cornell University Press, 2018)", "Adeeb Khalid, Making Uzbekistan: Nation, Empire, and Revolution in the Early USSR (Cornell University Press, 2015)"]
