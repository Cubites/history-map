- id: pontus-rise-183bc
  year: -182
  endYear: -94
  title:
    ko: "폰토스 왕국의 팽창: 파르나케스 1세의 시노페(기원전 183)에서 미트리다테스 6세의 흑해 연안(108~95)까지"
  summary:
    ko: "흑해 남안의 폰토스 왕국은 미트리다테스 왕조가 기원전 3세기 초 일으켰다(지도는 기원전 281년부터 그린다). 파르나케스 1세는 기원전 183년 그리스 도시국가 시노페와 동쪽 해안의 코티오라·케라수스를 차지하고(코티오라 주민을 옮겨 파르나키아를 세웠다: 스트라본 12.3.17. 지도는 이 해 흑해 남안의 해안 도시 띠를 폰토스로 옮기는데, 트라페주스가 이때 들었는지는 분명하지 않아 근사다) 페르가몬의 에우메네스 2세, 카파도키아 등과 싸웠다(기원전 183~179, 로마의 중재로 끝). 그 뒤 미트리다테스 4세 필로파토르 필라델포스(재위 기원전 170 무렵~150 무렵)를 거쳐 미트리다테스 5세 에우에르게테스(재위 기원전 150 무렵~120)는 로마를 도왔고 기원전 129년 아시아 속주를 정리하던 아퀼리우스에게서 대프리기아를 받았으나 원로원이 기원전 116년 이를 되찾았다(지도는 기원전 129~116년 대프리기아를 폰토스로 그린다). 미트리다테스 6세 에우파토르(재위 기원전 120~63)는 어린 나이에 어머니 라오디케 6세·동생 미트리다테스 크레스토스와 함께 왕위에 올랐다가 기원전 116~113년 무렵 어머니를 몰아내고 단독 통치를 시작했고, 기원전 112년 무렵 소아르메니아를 물려받았고, 스트라본에 따르면 소아르메니아 왕들이 거느려 트라페주스·파르나키아까지 닿던 칼다이오이·티바레노이 땅도 함께 넘어왔다(12.3.28. 지도는 소아르메니아와 흑해 남안의 내륙(폰토스 산맥)을 기원전 112년부터 폰토스로 그린다). 기원전 110~107년 장군 디오판토스가 크림에서 크림 스키타이 왕국과 싸웠고(앞의 사건), 스키타이에 몰린 보스포로스 왕 파이리사데스 5세는 기원전 108년 무렵 왕국을 미트리다테스 6세에게 넘겼으며(스트라본 7.4.4) 콜키스와 케르소네소스도 폰토스 손에 들어갔다. 지도는 폰토스의 땅을 기원전 108년 흑해 북·동안(보스포로스·콜키스·케르소네소스)과 칼디아로 넓혀 그린다. 기원전 108년 무렵 비티니아 왕 니코메데스 3세와 파플라고니아를 나누었고, 카파도키아에서는 누이 라오디케의 남편 아리아라테스 6세를 암살한 뒤(기원전 116 무렵) 조카 아리아라테스 7세를 앉혔다가 기원전 101년 무렵 죽이고 여덟 살 난 아들을 아리아라테스 9세로 앉혔다(카파도키아 귀족이 세운 아리아라테스 8세도 몰아냈다). 로마 공화정은 기원전 95년 무렵 파플라고니아의 독립을 명하고 카파도키아에 아리오바르자네스 1세를 세웠다(지도는 기원전 95년 파플라고니아를 폰토스에서 뺀다). 이 팽창은 폰토스를 로마와 부딪히게 만든 바탕이 되었다."
