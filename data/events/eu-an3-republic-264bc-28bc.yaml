- id: pompey-east-66bc
  year: -65
  endYear: -62
  title:
    ko: "폼페이우스의 동방 정리(기원전 66~63): 폰토스의 끝, 셀레우코스의 끝(64), 유대(63)"
  summary:
    ko: "기원전 66년 마닐리우스 법으로 동방 지휘권을 얻은 폼페이우스는 아르메니아의 티그라네스 2세를 항복시켜 미트리다테스 전쟁을 끝내고 소아시아와 레반트를 새로 정리했다. 기원전 65년 카스피해 쪽으로 진군해 이베리아 왕 아르토케스와 캅카스 알바니아의 오로이제스와 싸웠고(지도는 캅카스 알바니아를 기원전 65년부터 그린다), 기원전 64년 셀레우코스의 마지막 왕들(안티오코스 13세와 필리포스 2세)을 내치고 시리아를 속주로 삼아 셀레우코스 제국을 없앴다(지도는 기원전 64년에 끝낸다). 기원전 63년 예루살렘에서는 하스몬 가문의 왕위 다툼(히르카노스 2세 대 아리스토불로스 2세)에 개입해 석 달 포위 끝에 성전 구역을 차지했고, 요세푸스는 이때 1만 2천 명이 죽었다고 적는다(『유대 고대사』 14.71). 유대는 로마에 조공하게 되었다. 같은 해 미트리다테스 6세는 아들 파르나케스 2세의 반란 속에 크림의 판티카파이온에서 죽었다. 폼페이우스는 폰토스 왕국을 나누어 서부(아미소스·시노페 등 열한 도시국가의 땅, 아마세이아는 학설이 갈린다)를 비티니아와 합쳐 비티니아-폰토스 속주로 삼고, 동부 일부를 갈라티아의 데이오타로스에게, 콜키스를 아리스타르코스에게 주었으며, 파르나케스 2세를 보스포로스 왕으로 세워 ‘로마의 친구’로 삼았다(아피아노스 『미트리다테스 전쟁』 114). 카파도키아는 아리오바르자네스 1세 아래 로마의 동맹 왕국으로 남았다. 지도는 폰토스를 기원전 63년에 끝내고 갈라티아·콜키스·보스포로스를 로마의 종속 왕국으로, 서부 파플라고니아의 일부를 로마 땅으로 그린다. 플루타르코스는 이 정리로 로마의 속주 세입이 연 5천만에서 8천 5백만 드라크마로 늘었다고 적는다(『폼페이우스』 45). 이 정리로 로마 공화정은 동방을 직접 다스리는 땅(속주)과 종속 왕국으로 두는 땅으로 나눴다."
  subjects: [roman-republic, pontus-kingdom, seleucid-empire, arsacid-armenia, caucasian-albania, iberia-kingdom, colchis, galatia-kingdom, bosporan-kingdom, paphlagonia-kingdom, cappadocia-kingdom]
