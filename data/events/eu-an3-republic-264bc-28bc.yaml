- id: pergamon-bequest-133bc
  year: -132
  endYear: -128
  title:
    ko: "페르가몬 왕국의 유증(기원전 133)과 아리스토니코스의 반란, 아시아 속주(기원전 129)"
  summary:
    ko: "페르가몬의 아탈로스 왕조는 로마의 동맹으로 기원전 188년 아파메아 조약에서 소아시아 서부를 얻어 커졌다(에우메네스 2세 재위 197~159, 아탈로스 2세 160~138). 아탈로스 3세(재위 138~133)는 기원전 133년 죽으며 왕국을 로마에 남긴다는 유언을 했다. 유언의 동기와 범위는 학자마다 갈린다. 로마의 호민관 티베리우스 그라쿠스는 이 유산의 돈으로 토지를 받은 가난한 시민에게 농기구와 씨앗 값을 대자고 했다(플루타르코스 『티베리우스 그라쿠스』 14). 그러나 에우메네스 2세의 서자로 알려진 아리스토니코스가 ‘에우메네스 3세’를 칭하며 반란을 일으켜 노예와 가난한 사람들을 모아 ‘태양의 도시’를 세우겠다는 이상을 내세웠다고 한다(스트라본 14.1.38). 카파도키아 왕 아리아라테스 5세가 로마 편에서 싸우다 기원전 130년 전사했고 전년(기원전 131) 집정관이던 푸블리우스 리키니우스 크라수스(무키아누스)도 프로콘술로 전사했다. 기원전 130년 집정관 마르쿠스 페르페르나가 아리스토니코스를 사로잡았고(연대는 130~129로 갈리며 아리스토니코스는 129년 로마에서 처형되었다), 마니우스 아퀼리우스가 기원전 129년부터 남은 저항을 눌러 속주를 정비했다. 로마 공화정은 기원전 129년 이 땅을 ‘아시아 속주’로 삼고 리카오니아를 카파도키아에, 대프리기아를 폰토스에 주었다(뒤에 프리기아는 되찾음). 지도는 페르가몬을 기원전 133년에 끝내고 소아시아 서부를 로마 땅으로 옮기며, 레스보스·키오스·사모스 같은 그리스 도시국가의 섬들도 기원전 129년 이 속주에 든 것으로 그린다. 로마는 기원전 123년 가이우스 그라쿠스의 법 이래 속주 아시아의 세금을 징세 청부업자(푸블리카니)가 거두게 해 속주민의 원성을 샀고, 기원전 88년 아시아의 학살의 한 배경이 되었다(뒤의 사건)."
  subjects: [pergamon-kingdom, roman-republic, pontus-kingdom, cappadocia-kingdom, greek-city-states]
  tags: [politics, war]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 13.4.2, 14.1.38 (H. L. Jones 영역, Loeb, 1917~1932)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『티베리우스 그라쿠스』 14 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 36.4 (J. C. Yardley 영역, 1994)", "Esther V. Hansen, The Attalids of Pergamon (2판, 1971)", "Erich S. Gruen, The Hellenistic World and the Coming of Rome (1984)"]

- id: gracchi-133bc
  year: -132
  endYear: -120
  title:
    ko: "그라쿠스 형제의 개혁(기원전 133, 123~121)과 로마 공화정의 위기"
  summary:
    ko: "한니발 전쟁 뒤 이탈리아의 소농은 오랜 원정과 대토지(라티푼디움)에 눌려 줄었다고 플루타르코스와 아피아노스는 전한다. 기원전 133년 호민관 티베리우스 셈프로니우스 그라쿠스는 불법으로 차지한 공유지를 한 사람 500유게라로 제한하고 남는 땅을 가난한 시민에게 나누는 법을 평민회에 올렸다. 다른 호민관 옥타비우스의 거부권을 평민회 투표로 해임하고 법을 통과시킨 것이 전례를 깨는 일이었고, 페르가몬 왕국의 유증(앞의 사건)으로 들어올 돈을 분배에 쓰겠다고도 했다. 임기를 이어가려던 그는 그해 원로원 의원들이 이끈 무리에게 곤봉으로 맞아 죽었고 지지자 300명쯤도 죽었다(플루타르코스 『티베리우스 그라쿠스』 19). 동생 가이우스 그라쿠스는 기원전 123·122년 호민관을 맡아 곡물을 싼값에 파는 법, 속주 아시아의 세금 징수권을 기사 신분에 맡기는 법, 카르타고 터에 식민시를 세우는 법 등을 추진했고 이탈리아 동맹시에 시민권을 넓히려다 반발을 샀다. 기원전 121년 원로원의 비상 결의에 따라 집정관 오피미우스가 아벤티누스 언덕에서 그의 지지자를 쳐 가이우스는 죽고 지지자 3천 명 가까이가 처형되었다고 한다(『가이우스 그라쿠스』 17). 두 형제의 죽음은 정치 다툼에 폭력을 쓰는 선례가 되어 공화정 말의 내전으로 이어졌다고 평한다. 같은 시기 로마는 기원전 123~122년 발레아레스 제도를 정복했고(지도는 이 땅을 기원전 121년 버전에 묶는다) 기원전 121년 갈리아 트란살피나를 얻었다(뒤의 사건)."
  subjects: [roman-republic, pergamon-kingdom]
  tags: [politics, society]
  sources: ["Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『티베리우스 그라쿠스』·『가이우스 그라쿠스』 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Appian(아피아노스), Rhomaika(『로마사』) 『내전기』 1.7~27 (Horace White 영역, Loeb, 1912~1913)", "David Stockton, The Gracchi (1979)", "Andrew Lintott, Violence in Republican Rome (2판, 1999)"]

- id: transalpine-gaul-125bc
  year: -124
  endYear: -120
  title:
    ko: "갈리아 트란살피나(기원전 125~121): 마살리아의 요청과 알로브로게스·아르베르니의 패배, 나르보 식민시(118)"
  summary:
    ko: "마살리아(마르세유)는 기원전 6세기부터 리구리아 부족·켈트 부족과 다투며 로마의 동맹이었다. 기원전 125년 살루비이의 압박을 받던 마살리아가 도움을 청하자 로마는 기원전 125~123년 마르쿠스 풀비우스 플라쿠스와 가이우스 섹스티우스 칼비누스를 보내 살루비이를 눌렀고 엑스(아쿠아이 섹스티아이)를 세웠다(기원전 123/122). 살루비이의 도피처가 된 알로브로게스를 기원전 121년 그나이우스 도미티우스 아헤노바르부스가 꺾고, 퀸투스 파비우스 막시무스가 아르베르니 왕 비투이투스의 군을 론강과 이제르강이 만나는 곳 부근에서 물리쳤다. 오로시우스는 이 싸움에서 갈리아 병사 18만 가운데 15만이 죽거나 물에 빠졌다고 적고(5.14) 리비우스 『요약』 61은 12만이라 하나 수는 믿기 어렵다. 아르베르니의 땅은 로마가 직접 취하지 않았으나 알로브로게스와 남쪽 땅이 로마의 것이 되었고, 기원전 118년 나르보 마르티우스(지금의 나르본)에 로마 시민의 식민시가 세워졌다. 이탈리아와 히스파니아를 잇는 육로(도미티아 가도)를 로마가 얻은 것이다. 지도는 프랑스 남동부 해안과 론강 골짜기·랑그도크, 제네바(알로브로게스)를 기원전 121년부터 로마 공화정 땅으로 그리고 프로방스 해안의 리구리아 부족 땅은 비워 둔다. 마살리아와 그 땅(부슈뒤론도)은 로마의 동맹 자유시라 기원전 49년 카이사르에게 항복할 때까지 그리스 도시국가 묶음으로 둔다(부슈뒤론도 통째라 엑스 쪽은 근사). 이 속주(갈리아 나르보넨시스)는 훗날 카이사르의 갈리아 정복의 발판이 되었다(뒤의 사건)."
  subjects: [roman-republic, celtic-tribes, ligurian-tribes, greek-city-states]
  links:
