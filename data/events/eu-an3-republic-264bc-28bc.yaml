- id: telamon-cisalpine-225bc
  year: -224
  endYear: -217
  title:
    ko: "텔라몬 전투(기원전 225)와 갈리아 키살피나의 첫 정복(기원전 224~222)"
  summary:
    ko: "기원전 232년 호민관 가이우스 플라미니우스가 아드리아해 쪽 피케눔의 옛 갈리아 땅을 로마 시민에게 나누는 법을 통과시키자 포강 유역의 갈리아 부족이 불안해했고, 폴리비오스는 이를 전쟁의 한 원인으로 본다(2.21). 기원전 225년 보이이와 인수브레스, 알프스 너머에서 온 용병 가이사타이가 에트루리아로 쳐들어오자 로마는 집정관 둘과 동맹군을 보냈고, 에트루리아 해안 텔라몬에서 두 집정관 군이 앞뒤로 갈리아군을 끼워 쳐서 이겼다(집정관 가이우스 아틸리우스 레굴루스는 전사). 폴리비오스는 갈리아군의 전사자를 4만, 포로를 1만이라 적는다(2.31). 그는 이때 로마와 이탈리아 동맹이 낼 수 있는 병력 명부를 77만여 명으로 적는데(2.24) 실제 동원 수가 아니라 징병 가능한 인원의 어림이다. 기원전 224년 보이이가 항복했고, 223년 집정관 플라미니우스가 포강을 건너 인수브레스의 땅을 압박했으며, 222년 집정관 마르쿠스 클라우디우스 마르켈루스가 클라스티디움에서 인수브레스가 고용한 가이사타이의 지도자 비리도마루스(폴리비오스는 이름을 적지 않고, 뒤 사료에서는 브리토마르토스라고도 한다)를 직접 죽여(로마사에서 세 번째이자 마지막 ‘최고 전리품’) 메디올라눔(밀라노)이 항복했다. 지도는 보이이를 기원전 224년, 인수브레스를 기원전 222년부터 로마 공화정 땅으로 그린다. 로마는 플라미니아 가도(220)를 놓았고 기원전 218년 플라켄티아와 크레모나에 각 6천 명의 식민자를 보냈다. 한니발이 알프스를 넘기 직전 보이이와 인수브레스가 이 식민시를 습격하며 들고일어나(폴리비오스 3.40) 지도는 두 부족을 기원전 218년 켈트 부족 묶음으로 되돌린다. 로마의 정복은 땅의 몰수와 식민으로 이어졌다."
