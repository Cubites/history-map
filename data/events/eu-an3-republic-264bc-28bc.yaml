- id: mercenary-war-barcids-241bc
  year: -240
  endYear: -218
  title:
    ko: "용병 전쟁(기원전 241~238)과 사르데냐·코르시카, 바르카 가문의 히스파니아(기원전 237~219)와 사군툼"
  summary:
    ko: "전쟁이 끝나자 카르타고는 시칠리아에서 돌아온 용병들에게 밀린 급료를 줄 수 없었고, 기원전 241년 말 아프리카의 용병이 리비아 농민까지 끌어들여 반란을 일으켰다(용병 전쟁). 폴리비오스는 이를 ‘무자비한 전쟁’이라 부른다(1.65~88). 하밀카르 바르카가 누미디아 기병의 도움으로 기원전 238년 무렵 반란을 눌렀다. 사르데냐의 카르타고 용병도 반란을 일으켜 로마에 섬을 넘기려 했고, 로마는 카르타고가 항의하자 전쟁을 하겠다고 위협해 사르데냐와 코르시카를 내놓고 1,200탈란톤을 더 내게 했다. 폴리비오스는 이를 부당한 조처로 보고 뒤의 한니발 전쟁의 한 원인으로 꼽는다(3.10, 3.28). 지도는 사르데냐와 코르시카를 기원전 238년부터 로마 공화정 땅으로 그린다. 기원전 237년 하밀카르는 가데스에 상륙해 히스파니아 남부의 은광과 병력으로 카르타고의 힘을 되살리려 했고 기원전 229/228년 싸움에서 죽었다. 사위 하스드루발이 기원전 228년 무렵 카르타고 노바(지금의 카르타헤나)를 세웠고, 기원전 226/225년 로마와 에브로강을 넘지 않기로 하는 협정을 맺었다(폴리비오스 2.13). 기원전 221년 하스드루발이 암살되자 한니발이 사령관이 되어 올카데스(221)와 바카이이·카르페타니(220)를 쳤고, 기원전 219년 로마의 동맹 사군툼을 8개월 포위해 함락시켰다(3.13~17). 카르타고의 복속은 부족에게 병력과 공납을 요구했고 사군툼 함락은 가혹했다고 전한다. 지도는 이베리아 부족 묶음의 땅이던 곳을 카르타고의 땅으로 바꾸어 기원전 237년 투르데타니아(안달루시아 서부), 228년 남동부(오레타니·바스테타니·콘테스타니), 220년 카르페타니·올카데스(톨레도·마드리드·쿠엔카), 219년 사군툼 일대로 넓혀 그린다."
