  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『미트리다테스 전쟁』 84~105, 『시리아 전쟁』 48 (Horace White 영역, Loeb, 1912~1913)", "Strabo(스트라본), Geographica(『지리지』) 11.14.15 (H. L. Jones 영역, Loeb, 1917~1932)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『루쿨루스』 21~32 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 36.1~36 (Earnest Cary 영역, Loeb, 1914~1927)", "Michael Chahin, The Kingdom of Armenia (1987)", "A. N. Sherwin-White, Roman Foreign Policy in the East, 168 B.C. to A.D. 1 (1984)"]
