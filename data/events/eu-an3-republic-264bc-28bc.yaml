- id: pirates-cilicia-crete-102bc
  year: -101
  endYear: -66
  title:
    ko: "킬리키아 해적과 로마의 소탕(기원전 102~67), 크레타 정복(69~67)과 폼페이우스의 지중해 지휘권"
  summary:
    ko: "셀레우코스 제국이 쇠퇴하고 로도스가 기원전 167년 뒤 해군을 줄이자 동지중해에는 킬리키아와 크레타를 근거지로 한 해적이 늘었다. 스트라본은 델로스의 노예 시장에 사람을 공급하는 일이 이들의 큰 수입이었다고 적는다(14.5.2). 기원전 102년 로마 공화정은 변론가 마르쿠스 안토니우스를 법무관으로 킬리키아에 보냈고(지도는 피시디아·팜필리아를 기원전 102년부터 로마 땅으로 그린다) 기원전 78~74년 푸블리우스 세르빌리우스 바티아(이사우리쿠스)가 킬리키아·이사우리아를 눌렀다. 해적은 기원전 75년 젊은 카이사르를 붙잡았다가 몸값을 받고 풀어 주었고, 카이사르는 풀려난 뒤 그들을 잡아 십자가형에 처했다고 플루타르코스는 전한다. 기원전 74년 마르쿠스 안토니우스 크레티쿠스가 해적 소탕 지휘권으로 크레타를 쳤다가 졌고, 기원전 69~67년 퀸투스 카이킬리우스 메텔루스가 크레타를 정복해 ‘크레티쿠스’라 불렸다. 기원전 67년 호민관 가비니우스의 법으로 폼페이우스가 3년 동안 지중해 전역과 해안 내륙의 거의 무제한 권한을 얻었고 수십 일 만에 해적을 소탕했다고 전한다(플루타르코스 『폼페이우스』 25~28). 항복한 해적은 킬리키아 평야의 솔로이(폼페이오폴리스) 같은 곳에 정착시켰다. 이런 비상 지휘권이 공화정의 규범을 흔든 점도 지적된다. 지도는 크레타(그리스 도시국가 묶음)와 킬리키아 평야를 기원전 67년 로마 땅으로 그리고, 해적의 땅이던 킬리키아 트라케이아는 기원전 129~68년 비운다."
  subjects: [roman-republic, seleucid-empire, greek-city-states, rhodes]
  links:
    - { from: roman-republic, to: greek-city-states, note: "크레타 정복(기원전 69~67)" }
  tags: [war]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 14.5.2 (H. L. Jones 영역, Loeb, 1917~1932)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『폼페이우스』 24~29, 『카이사르』 1~2 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 36.20~37 (Earnest Cary 영역, Loeb, 1914~1927)", "Philip de Souza, Piracy in the Graeco-Roman World (1999)"]
