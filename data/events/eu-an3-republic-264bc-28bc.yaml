- id: syracuse-siege-213bc
  year: -213
  endYear: -211
  title:
    ko: "시라쿠사 포위와 함락(기원전 214~212), 아르키메데스"
  summary:
    ko: "시라쿠사는 기원전 263년부터 히에론 2세 아래 로마의 동맹이었다. 히에론이 기원전 215년 아흔 살 안팎으로 죽고 어린 손자 히에로니모스가 칸나이 뒤 카르타고 편에 섰다가 214년 암살되자, 시라쿠사는 반로마 지도부 아래 로마와 싸웠다. 기원전 214년 집정관이던 마르쿠스 클라우디우스 마르켈루스가(이듬해부터는 전직 집정관 자격의 프로콘술로) 214~213년 육지와 바다에서 도시를 에워쌌으나 아르키메데스가 설계했다고 전하는 투석기와 갈고리 기중기에 막혔다(폴리비오스 8.3~7. 거울로 배를 태웠다는 이야기는 후대의 것으로 의심받는다). 기원전 212년 가을 아르테미스 축제 때 방비가 느슨한 틈을 타 마르켈루스가 에피폴라이를 차지하고 도시를 차례로 함락시켰다. 약탈 때 아르키메데스도 로마 병사에게 죽었다고 리비우스와 플루타르코스가 전하는데, 마르켈루스가 그를 산 채 데려오라고 했다고 한다. 도시의 예술품이 로마로 실려 갔고(리비우스 25.40) 시라쿠사는 독립을 잃어 시칠리아 속주에 들었다. 지도는 시라쿠사를 기원전 212년 말 모습으로 끝내 로마 공화정 땅으로 옮긴다. 시칠리아에서 카르타고 편에 선 아그리겐툼 등은 기원전 210년 로마가 차지했다."
  subjects: [syracuse, roman-republic, carthage]
  links:
    - { from: roman-republic, to: syracuse, note: "시라쿠사 함락(기원전 212)" }
  tags: [war]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 7.3~8, 8.3~7 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Ab urbe condita(『로마사』) 24.21~39, 25.23~31 (B. O. Foster 외 영역, Loeb, 1919~1959)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『마르켈루스』 13~19 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "J. F. Lazenby, Hannibal’s War: A Military History of the Second Punic War (1978)"]
