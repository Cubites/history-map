- id: tylis-odrysian-212bc
  year: -211
  endYear: -167
  title:
    ko: "트라키아: 티리스 켈트 왕국의 끝(기원전 212)과 오드리사이 왕국, 로마와 마케도니아 사이(기원전 212~168)"
  summary:
    ko: "기원전 279년 그리스를 침입한 켈트 무리 가운데 일부가 트라키아 동남부에 눌러앉아 티리스를 중심으로 왕국을 세웠다. 폴리비오스는 이 켈트 왕국이 비잔티온 같은 그리스 도시국가에서 공물을 받아 갔고, 비잔티온이 공물을 줄이려 로도스 등의 도움을 구하다 전쟁(기원전 220년 무렵)이 일어났다고 전한다(4.45~52). 티리스는 카바로스 왕 때 가장 강했으나 곧 트라키아인에게 무너졌다(4.46). 연대는 기원전 212년 무렵으로 보며 지도는 티리스를 이 해에 끝내고 그 땅을 헤브로스강 골짜기의 오드리사이 왕국(아스타이)에 넘긴다. 오드리사이 왕국은 기원전 5세기에 세워져 마케도니아·켈트·셀레우코스 사이에서 줄어든 나라로, 지도는 기원전 264년부터 헤브로스강 골짜기를 이 나라로 그린다. 리비우스는 기원전 184년 필리포스 5세가 트라키아의 한 우두머리 아모도코스를 싸움에서 이겨 사로잡았다고 적는다(39.35). 필리포스 5세가 기원전 183년 필리포폴리스를 차지한 일은 지도에 그리지 않는다. 로도페산과 서트라키아의 베시·사파이오이, 세르디 같은 부족은 트라키아 부족 묶음으로 그린다. 기원전 171년 오드리사이 왕 코티스 4세는 마케도니아의 페르세우스 편에 섰다(리비우스 42.29. 3차 마케도니아 전쟁은 뒤의 사건). 이 시기 트라키아는 로마의 직접 통치를 받지 않았고, 로마와 가까워지는 과정에서 왕들이 편을 갈랐다."
  subjects: [tylis-kingdom, odrysian-kingdom, thracian-tribes, macedonia-kingdom, greek-city-states]
  tags: [politics, war]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 4.45~52 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Ab urbe condita(『로마사』) 39.35, 42.29 (B. O. Foster 외 영역, Loeb, 1919~1959)", "Zofia H. Archibald, The Odrysian Kingdom of Thrace: Orpheus Unmasked (1998)", "Lyudmil F. Vagalinski 엮음, In Search of Celtic Tylis in Thrace (III c. BC) (Sofia: Bulgarian Academy of Sciences, 2010)"]

- id: scipio-zama-210bc
  year: -209
  endYear: -200
  title:
    ko: "스키피오 아프리카누스: 히스파니아 정복(기원전 210~206)과 자마 전투(202), 포에니 전쟁의 끝"
  summary:
    ko: "히스파니아에서는 스키피오 형제(그나이우스와 푸블리우스)가 기원전 211년 전사해 로마 공화정의 군이 에브로강 북쪽으로 밀려 있었다. 기원전 210년, 전사한 푸블리우스의 아들이자 같은 이름인 푸블리우스 코르넬리우스 스키피오(스물다섯 살 안팎)가 정무관이 아닌 채 사령관으로 보내졌고, 기원전 209년 카르타고 노바를 하루 만에 쳐서 은광과 인질을 얻었다. 208년 바이쿨라에서 하스드루발 바르카를 눌렀으나 하스드루발은 이탈리아로 빠져나갔고(앞의 사건), 기원전 206년 일리파에서 카르타고군을 꺾어 반도에서 카르타고 세력을 몰아냈다(폴리비오스 11.20~33). 지도는 이베리아 부족 묶음의 땅이던 카르타고 노바 일대를 기원전 209년, 안달루시아와 남동부를 기원전 206년 로마 땅으로 옮기고 일레르게테스 반란(206~205)의 진압을 같은 버전에 묶는다. 스키피오는 기원전 205년 집정관이 되어 아프리카를 침공했고(204 상륙), 누미디아 왕 마시니사와 손잡고 203년 카르타고·시팍스 진영을 야습해 불태웠다. 카르타고는 한니발을 불러들였고 기원전 202년 가을 자마에서 두 사람이 맞서 로마·누미디아 기병이 한니발의 군을 꺾었다(폴리비오스 15.9~16). 기원전 201년 강화로 카르타고는 히스파니아를 내놓고 군함을 10척만 남기며 배상금 1만 탈란톤을 50년에 걸쳐 내고 로마의 허락 없이 전쟁하지 못하게 되었다(15.18). 스키피오는 ‘아프리카누스’라는 이름을 얻었다. 같은 때 동아시아에서는 흉노의 묵특 선우가 기원전 209년 무렵 동호를 쳐서 그 남은 무리가 오환과 선비로 갈라졌다고 하며, 기원전 206년 진이 무너진 뒤 유방이 항우를 꺾고 기원전 202년 한(전한)을 세웠다(지도는 진과 동호를 기원전 206년에 끝내고 오환·선비를 이 해부터, 한을 기원전 202년부터 그린다)."
  subjects: [carthage, roman-republic, iberian-tribes, qin, donghu, wuhuan, xianbei, xiongnu, western-han]
