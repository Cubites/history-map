  tags: [war]
  sources: ["Caesar(카이사르), Commentarii de Bello Gallico(『갈리아 전기』) 7 (H. J. Edwards 영역, Loeb, 1917)", "Hirtius(히르티우스), Commentarii de Bello Gallico(『갈리아 전기』) 8.44 (H. J. Edwards 영역, Loeb, 1917)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『카이사르』 15, 25~27 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 7.92 (H. Rackham 외 영역, Loeb, 1938~1963)", "Adrian Goldsworthy, Caesar: Life of a Colossus (2006)"]
