- id: hannibal-italy-metaurus-215bc
  year: -214
  endYear: -202
  title:
    ko: "한니발의 이탈리아 전쟁(기원전 215~203): 카푸아와 타렌툼, 메타우루스 전투(207)"
  summary:
    ko: "칸나이 뒤 로마 공화정은 새 군단을 모아 파비우스와 마르켈루스의 지연·소모전으로 한니발이 큰 도시를 함락하지 못하게 했다. 마케도니아의 필리포스 5세가 한니발과 손잡았으나(기원전 215, 앞의 사건) 큰 도움은 없었다. 기원전 216년 카푸아가, 이어 삼니움·아풀리아·브루티움 일부가 한니발 편으로 돌아섰으나 라티움과 중부 이탈리아의 동맹은 대부분 로마 곁에 남았고, 동맹시의 충성이 한니발이 로마를 이기지 못한 큰 까닭으로 꼽힌다. 카르타고 본국의 지원은 제한적이었던 반면 로마는 해마다 20개 안팎의 군단을 유지했다. 기원전 212년 한니발이 타렌툼 시내를 차지했고(요새는 로마가 지켰다), 211년 로마가 카푸아를 에워싸자 한니발은 로마로 진군해 위협했으나(211) 카푸아는 함락되어 지도자들이 처형되고 시민 일부가 노예가 되었다. 기원전 209년 파비우스가 타렌툼을 되찾았고 리비우스는 3만 명이 노예로 팔렸다고 적는다(27.16). 기원전 207년 한니발의 아우 하스드루발 바르카가 히스파니아에서 알프스를 넘어 내려왔으나 메타우루스강 부근에서 집정관 가이우스 클라우디우스 네로와 마르쿠스 리비우스 살리나토르에게 져 죽었고, 로마군은 그의 머리를 한니발의 진영에 던졌다고 전한다. 한편 기원전 205년 마고 바르카가 리구리아에 상륙해 리구리아·켈트 부족을 모았으나 203년 인수브레스 땅에서 졌다. 기원전 203년 한니발은 스키피오의 아프리카 상륙으로 소환되어 브루티움을 떠났다. 한니발 군의 약탈과 로마의 보복으로 이탈리아 남부 농촌은 크게 황폐해졌다. 지도는 한니발의 남이탈리아 점령을 땅이 바뀐 것으로 그리지 않는다(5년 넘게 다스렸어도 결말이 되돌려진 점령은 그리지 않는 기준)."
