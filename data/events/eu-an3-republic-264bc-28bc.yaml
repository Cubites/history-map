- id: cisalpine-ligurian-reconquest-200bc
  year: -199
  endYear: -153
  title:
    ko: "북이탈리아의 완성: 갈리아 키살피나 재정복(기원전 200~191), 리구리아 전쟁, 아퀼레이아(181)와 노리쿰"
  summary:
    ko: "한니발 전쟁 때 그에게 가담했던 포강 유역의 갈리아 부족에 맞서 로마 공화정은 기원전 200년부터 다시 싸웠다. 기원전 200년 카르타고 장교 하밀카르가 이끈 갈리아·리구리아군이 플라켄티아와 크레모나를 쳤으나 패했고, 기원전 197년 케노마니가 로마 편으로 돌아선 뒤 인수브레스가 민키우스강 부근에서 졌고, 196년 마르켈루스가 코뭄을 차지했다(지도는 케노마니와 인수브레스 일대를 기원전 196년 로마 땅으로 그린다). 기원전 191년 집정관 푸블리우스 코르넬리우스 스키피오 나시카가 보이이를 꺾어 땅의 절반을 몰수했다고 리비우스는 전하고(36.39), 스트라본은 보이이가 도나우강 쪽으로 옮겨 갔다고 적는다(5.1.6). 로마는 볼로냐(189)·모데나와 파르마(183)·아퀼레이아(181) 같은 식민시와 아이밀리아 가도(187)로 포강 유역을 로마 시민과 이탈리아 정착민의 땅으로 바꾸었다. 리구리아의 산악 부족은 더 오래 버텼다: 기원전 180년 아푸아니 약 4만 명이 삼니움으로 강제 이주되었고(리비우스 40.38), 기원전 177년에는 이스트리아의 히스트리(지도는 일리리아·판노니아 부족 묶음으로 그린다)를 쳐서 네사크티움을 함락했다. 리비우스는 기원전 171~170년 알프스 너머 켈트의 왕 킨키빌루스와 로마의 교섭을 적는데(43.1, 43.5; 이 왕을 노리쿰 왕으로 보는 견해가 많으나 타우리스키로 보기도 한다) 지도는 노리쿰 왕국을 기원전 170년부터 따로 그린다. 기원전 155~154년에는 마살리아의 청으로 집정관들이 오크시비이·데키아테스 같은 리구리아 부족을 쳤다(폴리비오스 33.8~10). 리구리아 부족과 켈트 부족의 땅이 이렇게 하나씩 로마의 시민 식민지와 동맹으로 바뀌었다."
  subjects: [roman-republic, celtic-tribes, ligurian-tribes, noricum-kingdom, illyrian-tribes]
