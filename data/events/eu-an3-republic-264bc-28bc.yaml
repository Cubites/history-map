  sources: ["Polybius(폴리비오스), Historiai(『역사』) 10.2~20, 11.20~33, 14.1~10, 15.1~19 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Ab urbe condita(『로마사』) 26.18~51, 27.17~20, 28~30 (B. O. Foster 외 영역, Loeb, 1919~1959)", "H. H. Scullard, Scipio Africanus: Soldier and Politician (1970)", "Sima Qian(사마천), Shiji(『사기』) 110 흉노열전 (Burton Watson 번역, Records of the Grand Historian: Han Dynasty II, 개정판 1993)"]
