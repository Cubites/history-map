- id: illyrian-wars-greece-229bc
  year: -228
  endYear: -204
  title:
    ko: "로마의 첫 그리스 개입: 일리리아 전쟁(기원전 229·219)과 아카이아 동맹의 성장, 제1차 마케도니아 전쟁(215~205)"
  summary:
    ko: "아드리아해 동쪽의 일리리아 왕국(아르디아이오이)은 왕비 테우타 아래 해적질로 이탈리아 상인을 괴롭혔고, 로마 사절이 살해되자 로마 공화정은 기원전 229년 함대와 군대를 보내 코르키라(케르키라)를 얻고 아폴로니아와 에피담노스를 보호 아래 두었다. 기원전 228년 강화로 테우타는 해안을 내놓고 로마의 허락 없이 리소스 남쪽으로 배를 보내지 않기로 했다. 이때 로마 사절은 처음으로 코린토스 이스트미아 경기와 아테네를 찾았다(폴리비오스 2.12). 지도는 이 땅을 기원전 228년 버전에서 로마 땅으로 옮긴다. 기원전 219년 파로스의 데메트리오스가 조약을 어기자 집정관 루키우스 아이밀리우스 파울루스가 쳐서 그를 마케도니아로 쫓았다. 한편 펠로폰네소스에서는 시키온의 아라토스가 이끈 아카이아 동맹이 코린토스(243)·메갈로폴리스(235)·아르고스(229)를 얻어 커졌으나(지도는 아르골리스·아르카디아를 기원전 228년 아카이아로 그린다) 스파르타 왕 클레오메네스 3세에게 밀리자 마케도니아의 안티고노스 3세 도손을 불러들였고, 도손이 기원전 222년 셀라시아에서 클레오메네스를 꺾었다. 도손의 뒤를 이은 필리포스 5세는 아카이아 편에서 아이톨리아 동맹과 싸웠다(동맹 전쟁, 220~217). 기원전 216년 칸나이에서 로마가 진 뒤 필리포스는 기원전 215년 한니발과 조약을 맺었고, 로마는 기원전 211년 아이톨리아 동맹과 손잡고(페르가몬도 뒤에 가담) 제1차 마케도니아 전쟁(215~205)을 치렀으나 큰 병력은 쓰지 않았다. 에페이로스에서 맺은 기원전 205년 포이니케 강화로 끝났다(리비우스 29.12). 그리스 도시국가들은 이 시기 두 세력 사이에서 편을 갈랐다."
  subjects: [roman-republic, illyrian-kingdom, epirus, achaean-league, aetolian-league, macedonia-kingdom, pergamon-kingdom, greek-city-states]
