- id: gallic-war-58bc
  year: -57
  endYear: -55
  title:
    ko: "카이사르의 갈리아 정복(1): 헬베티이와 아리오비스투스(기원전 58), 벨가이와 베네티(57~56)"
  summary:
    ko: "기원전 60년 로마 공화정의 실력자 카이사르·폼페이우스·크라수스가 비공식 동맹(제1차 삼두 정치)을 맺었다. 카이사르는 기원전 61~60년 히스파니아 울테리오르 총독으로 서북쪽 칼라이키아의 부족을 치고(지도는 칼라이키아 남부를 기원전 60년 로마 땅으로 그린다) 기원전 59년 집정관을 지낸 뒤 갈리아 키살피나·일리리쿰·나르보넨시스 총독이 되어 갈리아 정복에 나섰다. 기원전 58년 알프스 서부를 지나 갈리아에 들어간 그는(『갈리아 전기』 1.10, 지도는 코티우스 왕국을 기원전 58년부터 따로 그린다) 이주하던 헬베티이를 비브락테 부근에서 꺾어 돌려보냈다(카이사르는 이주민 36만 8천 명이라 적으나 부풀려졌다는 견해가 많다). 이어 수에비 왕 아리오비스투스를 알자스 쪽에서 꺾어 라인강 서쪽에서 몰아냈다(지도는 라인강 오른쪽·남독일을 기원전 58년부터 켈트에서 게르만 부족으로 바꾼다). 기원전 57년 벨가이 연합과 싸운 사비스강에서 네르비이 군이 거의 전멸했다고 카이사르는 적는다(2.28). 기원전 56년에는 브르타뉴의 베네티를 해전에서 꺾고 크라수스의 아들이 아퀴타니아를 눌렀으며, 루카 회담에서 삼두가 카이사르의 총독 임기를 5년 늘렸다. 『갈리아 전기』의 숫자와 서술은 카이사르가 직접 쓴 정당화의 글이라 사실을 부풀렸다고 보는 학자가 많다. 같은 기원전 57년 한반도 남쪽에서는 『삼국사기』가 박혁거세가 신라를 세웠다고 전하나, 로마와는 아무런 접촉이 없었다."
  subjects: [celtic-tribes, germanic-tribes, cottian-alps, roman-republic, silla]
