- id: second-triumvirate-philippi-43bc
  year: -42
  endYear: -27
  title:
    ko: "제2차 삼두 정치와 필리피 전투(기원전 43~42), 옥타비아누스의 일리리아 전쟁(35~33)과 크라수스의 모이시아 원정(29~28)"
  summary:
    ko: "카이사르가 죽자 그의 유언으로 양자이자 후계자가 된 열여덟 살의 가이우스 옥타비우스(옥타비아누스)가 카이사르파의 마르쿠스 안토니우스, 레피두스와 손잡았다. 기원전 43년 11월 이 셋은 5년 임기의 삼두 정치를 법으로 세우고 살생부를 만들어 정적을 죽였다. 아피아노스는 원로원 의원 300명쯤과 기사 2천 명쯤이 지목되었다고 적고(『내전기』 4.5) 변론가 키케로는 안토니우스의 요구로 12월 포르미아이에서 살해되었다. 암살자 브루투스와 카시우스는 동방에서 군을 모아 기원전 42년 10월 마케도니아 필리피에서 두 차례 싸웠고, 첫 싸움에서 카시우스가 자결했으며 20일쯤 뒤 브루투스도 져 자결했다. 로마 공화정의 마지막 군사적 저항이 꺾인 것이다. 그 뒤 안토니우스는 동방을, 옥타비아누스는 서방을 맡았다. 옥타비아누스는 기원전 41~40년 안토니우스의 아내 풀비아와 동생이 일으킨 페루시아 전쟁을 눌렀고, 기원전 36년 그의 부하 아그리파의 함대가 시칠리아의 섹스투스 폼페이우스를 나울로코스에서 꺾었다. 기원전 35~33년에는 직접 일리리아·판노니아 부족의 땅을 쳐 이아피데스(35, 메툴룸)와 사바강 일대 시시아, 달마티아의 델마타이(34~33)를 복속시켰다(지도는 이아피데스·리부르니를 기원전 35년, 슬로베니아 남부의 켈트계 타우리스키·라토비키를 기원전 35년, 달마티아 내륙을 기원전 33년 로마 땅으로 그린다). 기원전 29~28년 마케도니아 총독 마르쿠스 크라수스(삼두 크라수스의 손자)는 도나우강 이남의 바스타르나이와 모이시를 꺾고 다키아 쪽 게타이 왕 롤레스를 친구이자 동맹으로 삼았다(카시우스 디오 51.23~27). 지도는 모이시·트리발리가 살던 트라키아 부족 묶음의 땅(세르비아 동부·불가리아 북서부)과 다르다니(코소보 일대)의 일리리아·판노니아 부족 묶음의 땅을 기원전 28년 로마 공화정 땅으로 옮긴다."
