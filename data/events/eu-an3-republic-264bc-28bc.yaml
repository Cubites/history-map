- id: antony-cleopatra-actium-41bc
  year: -40
  endYear: -29
  title:
    ko: "안토니우스와 클레오파트라 7세: 동방의 재편(기원전 41~34), 악티움 해전(31)과 프톨레마이오스 왕국의 끝(30)"
  summary:
    ko: "필리피 뒤 로마 공화정의 동방을 맡은 안토니우스는 기원전 41년 킬리키아의 타르소스에서 프톨레마이오스 왕국의 클레오파트라 7세(재위 기원전 51~30)를 만나 손잡았다. 그는 동방에 종속 왕을 세워 다스렸다. 기원전 37/36년 (폰토스는 기원전 37년 미트리다테스 6세의 손자 다리우스에게 잠깐 맡겼다가) 폴레몬을 폰토스(콜키스 포함)의 왕으로, 아르켈라오스를 카파도키아의 왕으로, 아민타스를 갈라티아와 피시디아·리카오니아 일대의 왕으로 앉히고(지도는 갈라티아를 기원전 37년에 넓히고 폰토스를 폴레몬 왕조로 이어 콜키스를 끝낸다) 클레오파트라에게 키프로스와 킬리키아 해안 일부를 주었다. 기원전 36년 파르티아 원정은 군수품 수레를 잃고 메디아 아트로파테네에서 물러나 보병 2만 명과 기병 4천 명 가까이를 잃고 끝났다(플루타르코스 『안토니우스』 50). 기원전 34년 아르메니아 왕 아르타바스데스 2세를 사로잡아 알렉산드리아로 끌고 갔고, 이른바 ‘알렉산드리아의 기증’(34)으로 클레오파트라와 그 자식들에게 동방의 왕국들을 나눠 준 일이 로마에서 비판을 샀다. 기원전 32년 옥타비아누스는 안토니우스의 유언장을 공개해 선전전을 벌였고 원로원이 클레오파트라에게 선전포고했다. 기원전 31년 9월 2일 그리스 서쪽 악티움 앞바다에서 아그리파가 이끈 옥타비아누스 함대가 안토니우스·클레오파트라 연합 함대를 꺾었고, 두 사람은 먼저 빠져나갔다. 기원전 30년 8월 옥타비아누스가 알렉산드리아에 들어오자 안토니우스가 자결했고 클레오파트라도 곧 죽었다(독사에 물려 죽었다는 전승은 확실하지 않다). 클레오파트라와 카이사르의 아들로 기원전 44년부터 어머니와 공동 왕(프톨레마이오스 15세)이던 카이사리온도 처형되었다. 프톨레마이오스 왕국은 이로써 끝나고 이집트는 옥타비아누스의 사적인 속주가 되었다(지도는 이 왕국의 권역 안 땅인 키프로스를 기원전 30년 로마로 옮겨 끝낸다). 내전을 끝낸 옥타비아누스의 원수정은 뒤의 사건이다. 같은 때 한반도 북부에서는 주몽이 기원전 37년 졸본에서 고구려를 세웠다고 『삼국사기』가 전한다(`goguryeo-founded`)."
