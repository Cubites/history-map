- id: scythia-sarmatia-crimea-200bc
  year: -199
  endYear: -106
  title:
    ko: "흑해 북쪽 초원: 스키타이에서 사르마티아로, 크림 스키타이 왕국(기원전 3~2세기)과 폰토스의 개입(110~107)"
  summary:
    ko: "기원전 7~4세기에 흑해 북쪽 초원을 다스린 스키타이는 기원전 3세기에 돈강 동쪽에서 서쪽으로 밀려든 사르마티아 계통 유목민(지도는 사르마티아·알란 부족 묶음으로 그린다)에게 밀렸다. 올비아의 프로토게네스를 기리는 비문(기원전 200년 무렵)은 사이오이 같은 스키타이 계통 집단과 갈라타이·스키로이 등이 올비아 둘레를 위협했다고 전한다. 폴리비오스는 기원전 179년 무렵 사르마티아 왕 가탈로스를 적는다(25.2). 지도는 초원을 기원전 179년까지 스키타이 부족 묶음으로, 그 뒤 사르마티아(록솔라니 등)로 그리고 돈강 동쪽은 처음부터 사르마티아로 그린다. 리비우스는 필리포스 5세가 기원전 180년 무렵 도나우강 너머의 바스타르나이를 끌어들여 이탈리아를 치려 했다고 적고(40.57), 지도는 포딜리아·부코비나·갈리치아를 기원전 179년부터 바스타르나이(다키아 부족 묶음)로 그린다. 스키타이는 도나우강 하류와 크림 반도로 물러나 네아폴리스(지금의 심페로폴 부근)를 중심으로 왕국을 이루었고, 스트라본에 따르면 왕 스킬루로스와 그 아들 팔라코스가 올비아와 케르소네소스 같은 그리스 도시국가를 압박했다(7.4.3). 플루타르코스는 스킬루로스가 죽을 때 아들 80명에게 화살 묶음을 꺾게 하여 단결을 가르쳤다고 전한다(Moralia 174f). 스킬루로스의 재위 연대는 불확실해 지도는 크림 스키타이 왕국을 기원전 150년 무렵부터 그리고 스키타이 부족 묶음을 이 해에 끝낸다. 케르소네소스의 요청으로 기원전 110~107년 폰토스 왕 미트리다테스 6세의 장군 디오판토스가 크림에 와서 팔라코스를 꺾고 스키타이를 복속시켰으며, 이를 바탕으로 보스포로스 왕국이 폰토스에 넘어갔다(스트라본 7.4.3~4). 사르마티아·스키타이 모두 문자 기록을 남기지 않아 그리스 도시의 비문과 고고학에 기대어 짐작한다."
  subjects: [scythian-tribes, sarmatian-alan-tribes, dacian-tribes, crimean-scythia, pontus-kingdom, bosporan-kingdom, greek-city-states]
  links:
    - { from: pontus-kingdom, to: crimean-scythia, note: "디오판토스의 원정(기원전 110~107)" }
  tags: [war, society]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 7.3~7.4 (H. L. Jones 영역, Loeb, 1917~1932)", "Polybius(폴리비오스), Historiai(『역사』) 25.2 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Plutarch(플루타르코스), Moralia(『윤리론집』) 174f (Frank Cole Babbitt 영역, Loeb, 1931)", "Tadeusz Sulimirski, The Sarmatians (1970)", "Renate Rolle, The World of the Scythians (1989)"]

- id: second-macedonian-war-200bc
  year: -199
  endYear: -195
  title:
    ko: "제2차 마케도니아 전쟁(기원전 200~197), 키노스케팔라이 전투와 그리스인의 자유 선언(196)"
  summary:
    ko: "한니발 전쟁이 끝난 직후인 기원전 200년 로마 공화정은 페르가몬의 아탈로스 1세와 로도스의 호소를 받아 마케도니아의 필리포스 5세(재위 기원전 221~179)에게 선전포고했다. 필리포스는 에게해의 도시들을 쳐 왔고 셀레우코스 제국의 안티오코스 3세와 프톨레마이오스 왕국의 영토를 나누기로 했다는 소문도 돌았다(폴리비오스 15.20). 처음 2년은 승패가 갈리지 않다가, 기원전 198년 집정관 티투스 퀸크티우스 플라미니누스가 아이톨리아 동맹과 아카이아 동맹의 지지를 얻어 필리포스를 몰아붙였고, 기원전 197년 6월 테살리아의 키노스케팔라이(‘개의 머리’) 언덕에서 로마 군단이 마케도니아 팔랑크스를 꺾었다. 강화로 필리포스는 그리스 본토와 소아시아의 거점을 내놓고 배상금 1,000탈란톤을 내며 함대와 군대를 줄이게 되었으나 왕국은 남았다(리비우스 33.30). 기원전 196년 이스트미아 경기에서 플라미니누스가 그리스 도시들의 ‘자유’를 선언하자 사람들이 환호했다고 폴리비오스와 플루타르코스는 전한다(폴리비오스 18.46, 『플라미니누스』 10). 지도는 마케도니아가 잃은 테살리아와 마그네시아를 기원전 196년부터 그리스 도시국가 땅으로 그린다. 로마군은 기원전 194년 그리스에서 철수했다. 그러나 이 ‘자유’는 로마의 영향 아래 놓인 보호였고, 몫이 작다고 여긴 아이톨리아 동맹은 불만을 품어 안티오코스 3세와 충돌의 불씨가 되었다(뒤의 사건)."
  subjects: [macedonia-kingdom, roman-republic, greek-city-states, aetolian-league, achaean-league, pergamon-kingdom, rhodes, seleucid-empire]
  links:
