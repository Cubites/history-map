- id: roman-syrian-war-192bc
  year: -191
  endYear: -187
  title:
    ko: "로마·시리아 전쟁(기원전 192~188): 테르모필라이와 마그네시아 전투(190), 아파메아 조약(188)"
  summary:
    ko: "플라미니누스의 철수(194) 뒤 불만을 품은 아이톨리아 동맹의 부름으로 셀레우코스 제국의 안티오코스 3세가 기원전 192년 1만 안팎의 병력으로 그리스에 건너왔다. 같은 해 아카이아 동맹은 필로포이멘의 지휘로 스파르타를 동맹에 넣고 기원전 191년 메세네도 가입시켰다(지도는 라코니아·메세니아를 기원전 191년 아카이아로 그린다). 기원전 191년 집정관 마니우스 아킬리우스 글라브리오가 테르모필라이에서 안티오코스를 꺾어 소아시아로 쫓았다. 그리스 도시국가 가운데 아카이아 동맹과 아테네 등은 로마 편에 섰고 필리포스 5세의 마케도니아 왕국은 로마군에 길을 열어 주었다. 로마군은 로도스·페르가몬 함대의 도움으로 소아시아에 건너가, 기원전 190년 말 또는 189년 초 마그네시아(시필로스산 아래)에서 루키우스 스키피오(형 스키피오 아프리카누스가 동행)가 안티오코스를 꺾었다. 리비우스는 로마 쪽 전사자를 300명 남짓, 안티오코스 쪽을 5만이 넘는다 하나(37.44) 크게 부풀려진 수다. 기원전 188년 아파메아 조약으로 안티오코스는 타우로스산맥 서쪽의 소아시아를 내놓고 배상금 1만 5천 탈란톤을 내며 코끼리와 함대를 넘기기로 했다(폴리비오스 21.42, 리비우스 38.38). 로마 공화정은 이 땅을 직접 차지하지 않고 페르가몬의 에우메네스 2세에게 소아시아 서부를, 로도스에 리키아와 카리아 남부를 주었고(지도는 기원전 188년 페르가몬과 로도스를 넓힌다) 아이톨리아 동맹은 정복지를 잃었다. 기원전 189년 그나이우스 만리우스 불소가 갈라티아를 쳐 약탈했고, 안티오코스의 장군 아르탁시아스(아르메니아)와 자리아드리스(소페네)는 패전을 틈타 왕을 칭했다(스트라본 11.14.5. 지도는 아르메니아를 기원전 189년부터 독립으로 그리고 소페네 왕국을 이 해에 새로 그린다. 소아르메니아는 셀레우코스 땅으로 그리지 않아 이 해에 바뀌지 않는다). 한니발은 안티오코스에게서 비티니아로 달아났다가 기원전 183년 무렵 로마의 압박 속에 목숨을 끊었다고 전한다."
  subjects: [seleucid-empire, roman-republic, aetolian-league, achaean-league, pergamon-kingdom, rhodes, macedonia-kingdom, arsacid-armenia, sophene-kingdom, greek-city-states, galatia-kingdom]
