- id: britain-rhine-55bc
  year: -54
  endYear: -53
  title:
    ko: "카이사르의 라인강 도하와 브리타니아 원정(기원전 55·54)"
  summary:
    ko: "기원전 55년 우시페테스와 텐크테리 두 게르만 부족이 라인강을 건너 갈리아로 들어오자 로마 공화정의 총독 카이사르가 휴전 담판 중에 이들을 쳐서 크게 학살했다. 카이사르는 이 두 부족이 그 전에 라인강 양쪽 기슭에 살던 메나피이를 오른쪽 기슭에서 몰아냈다고 적는다(4.4. 지도는 헬데를란트의 라인강 북쪽을 기원전 51년 버전부터 켈트 부족 묶음에서 게르만 부족 묶음으로 옮겨 그린다). 그는 상대를 여자와 아이까지 43만 명이라 적는다(『갈리아 전기』 4.15). 소(小)카토는 이 일을 비난해 카이사르를 게르만에게 넘기자고 했다고 플루타르코스는 전한다. 이어 카이사르는 10일 만에 목조 다리로 라인강을 건너 게르만 땅에 18일 머물고 돌아왔다. 같은 해 8월 말 2개 군단(보병 1만 안팎)을 배에 싣고 켄트 해안에 상륙했으나 폭풍에 배가 상하고 기병이 오지 못해 몇 주 만에 물러났다. 기원전 54년 5개 군단과 기병 2천을 800척 가까운 배에 싣고 다시 건너 템스강 북쪽까지 진격해 카시벨라우누스의 연합을 눌렀으나 땅을 차지하지 않고 인질과 공납을 약속받아 돌아왔다. 지도는 두 원정을 땅이 바뀐 것으로 그리지 않는다(브리타니아 남부는 켈트 부족 묶음 그대로). 돌아온 겨울 에부로네스의 암비오릭스가 반란을 일으켜 카이사르의 한 군단과 5개 대대를 매복으로 몰살시키자(기원전 54, 『갈리아 전기』 5.26~37) 카이사르는 보복으로 에부로네스를 거의 없앴다. 로마에서는 이 원정이 오케아노스 너머까지 간 일로 선전되었다."
  subjects: [roman-republic, celtic-tribes, germanic-tribes]
  tags: [war]
  sources: ["Caesar(카이사르), Commentarii de Bello Gallico(『갈리아 전기』) 4.1~38, 5.1~23, 5.24~58 (H. J. Edwards 영역, Loeb, 1917)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『카이사르』 22~23, 『소(小)카토』 51 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 39.50~53 (Earnest Cary 영역, Loeb, 1914~1927)", "Adrian Goldsworthy, Caesar: Life of a Colossus (2006)"]
