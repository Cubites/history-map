- id: ptolemaic-egypt-rome-168bc
  year: -167
  endYear: -54
  title:
    ko: "프톨레마이오스 왕국과 로마: 에레우시스의 날(기원전 168)에서 키프로스 합병(58)과 프톨레마이오스 12세의 복위(55)까지"
  summary:
    ko: "프톨레마이오스 왕국은 기원전 217년 라피아에서 이겼으나 토착 이집트인의 반란(기원전 206~186년 상이집트에서 독립 정권)과 제5차 시리아 전쟁으로 코일레시리아를 잃어 약해졌다(앞의 사건). 기원전 170~168년 셀레우코스 제국의 안티오코스 4세가 이집트를 침공해 멤피스를 얻고 알렉산드리아를 포위하자, 로마 사절 가이우스 포필리우스 라이나스가 기원전 168년 여름 알렉산드리아 근교 에레우시스에서 원로원의 철수 요구를 전하며 지팡이로 안티오코스의 둘레에 원을 그어 대답하기 전엔 나가지 말라고 했다(폴리비오스 29.27, 리비우스 45.12). 안티오코스는 물러났고 이 ‘에레우시스의 날’은 로마 공화정이 헬레니즘 왕국들 위에 서게 된 상징이다. 그 뒤 프톨레마이오스 6세와 8세 형제의 다툼은 로마의 중재를 받았고(기원전 163 키레나이카 분할), 키레나이카의 프톨레마이오스 아피온은 기원전 96년 유언으로 나라를 로마에 남겼다. 8세가 죽은 뒤(기원전 116) 프톨레마이오스 9세와 10세의 다툼(116~80)과 베레니케 3세·11세를 거쳐, 프톨레마이오스 12세 아울레테스(재위 기원전 80~58, 55~51, 사이에 딸 베레니케 4세가 58~55이며 58~57년은 클레오파트라 6세 트리파이나와 공동 통치)는 카이사르와 폼페이우스에게 거액을 주고 기원전 59년 ‘로마의 동맹이자 친구’로 인정받았으나 그 비용 때문에 알렉산드리아 시민의 분노를 샀다(수에토니우스 『카이사르』 54). 기원전 58년 로마는 그의 동생인 키프로스의 프톨레마이오스 왕에게 나라를 내놓으라 요구했고, 왕은 자결했으며 카토가 재산을 정리해 키프로스를 합병했다. 아울레테스는 로마로 달아났다가 기원전 55년 시리아 총독 가비니우스의 군대로 복위했다(카시우스 디오 39.55~58). 지도는 키프로스를 기원전 58년에 로마 땅으로 옮긴다(뒤에 기원전 47년 카이사르가 프톨레마이오스 일가에게 돌려주는 일은 뒤의 사건)."
  subjects: [ptolemaic-kingdom, seleucid-empire, roman-republic]
  links:
    - { from: roman-republic, to: ptolemaic-kingdom, note: "에레우시스의 날(기원전 168)" }
  tags: [diplomacy, politics]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 29.27 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Ab urbe condita(『로마사』) 45.10~12 (B. O. Foster 외 영역, Loeb, 1919~1959)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 39.12~16, 39.55~58 (Earnest Cary 영역, Loeb, 1914~1927)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『카이사르』 54 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Günther Hölbl, A History of the Ptolemaic Empire (2001, Tina Saavedra 영역)"]

- id: maccabean-revolt-167bc
  year: -166
  endYear: -140
  title:
    ko: "마카베오 반란(기원전 167~141): 안티오코스 4세의 박해와 하스몬 가문의 독립"
  summary:
    ko: "안티오코스 4세 에피파네스(재위 기원전 175~164)는 프톨레마이오스 왕국 침공에서 돌아오던 길(기원전 169)에 예루살렘 성전을 약탈했고, 로마 공화정의 요구로 이집트에서 물러난 뒤인 기원전 167년 성전에 제우스 올림피오스의 제단을 세우고 할례와 안식일 지키기, 토라 소지를 금지했다(『마카베오기』 상 1, 하 6). 모딘의 사제 마타티아스가 이를 거부해 반란을 일으켰고, 아들 유다 마카베오가 게릴라전으로 시리아군을 거듭 꺾어 기원전 164년 12월 성전을 정화해 봉헌했다(하누카의 유래). 안티오코스 4세가 죽은 뒤 섭정들이 종교 금지를 풀었으나 싸움은 이어졌다. 유다는 기원전 160년 엘라사에서 전사했고 동생 요나단(기원전 152 대사제)과 시몬이 뒤를 이었다. 시몬은 기원전 142년 시리아에서 세금 면제를 얻고 기원전 141년 예루살렘의 시리아 수비대(아크라)를 몰아내 사실상 독립했다(상 13). 하스몬 가문은 기원전 104년부터 왕을 칭했고(요세푸스) 주변을 정복하면서 이두메아인 등을 강제로 유대교로 개종시켰다. 이 반란에는 헬레니즘 문화를 받아들이려던 유대인 사이의 갈등도 얽혀 있었고, 성전 정화의 기억은 뒤에 유대인의 정체성에 큰 몫을 했다. 이 지역은 권역 밖이라 지도에 그리지 않으며, 셀레우코스 제국은 이 무렵 콤마게네가 떨어져 나가는 등 쇠퇴한다(뒤의 사건)."
  subjects: [seleucid-empire, ptolemaic-kingdom, roman-republic]
  tags: [war, society]
  sources: ["Jonathan A. Goldstein, I Maccabees (Anchor Bible, 1976)", "Jonathan A. Goldstein, II Maccabees (Anchor Bible, 1983)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 12.237~13.214 (Ralph Marcus 영역, Loeb, 1943)", "Bezalel Bar-Kochva, Judas Maccabaeus: The Jewish Struggle against the Seleucids (1989)", "John D. Grainger, The Syrian Wars (2010)"]
