  sources: ["Caesar(카이사르), Commentarii de Bello Civili(『내전기』) (A. G. Peskett 영역, Loeb, 1914)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『카이사르』 32~69, 『폼페이우스』 60~80 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『카이사르』 31~89 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Appian(아피아노스), Rhomaika(『로마사』) 『내전기』 2 (Horace White 영역, Loeb, 1912~1913)", "Tom Holland, Rubicon: The Last Years of the Roman Republic (2003)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 41.36 (Earnest Cary 영역, Loeb, 1914~1927)"]
