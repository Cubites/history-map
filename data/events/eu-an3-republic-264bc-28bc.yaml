- id: vercingetorix-alesia-53bc
  year: -52
  endYear: -49
  title:
    ko: "베르킨게토릭스의 반란과 알레시아 전투(기원전 52), 갈리아 정복의 마무리(51)"
  summary:
    ko: "기원전 53년 겨울부터 켈트 부족 묶음으로 그리는 갈리아 곳곳에서 반란이 일어났고 기원전 52년 아르베르니의 젊은 귀족 베르킨게토릭스가 총사령관으로 추대되었다. 그는 카이사르의 보급을 끊으려 초토 전술을 썼다(비투리게스는 마을 20여 곳을 스스로 태웠으나 아바리쿰은 지키려다 점령되어 카이사르에 따르면 약 4만 명이 죽었다, 『갈리아 전기』 7.28). 카이사르는 게르고비아에서 물러났으나 결국 베르킨게토릭스를 만두비이의 요새 도시 알레시아에 가두었다. 카이사르는 로마 공화정의 군단으로 안쪽에는 갇힌 갈리아군을 막고 바깥쪽에는 구원군을 막는 이중 보루를 쌓았다. 그는 알레시아 안에 8만, 구원군이 보병 25만과 기병 8천이라 적으나(7.71, 7.76) 현대 학자는 크게 부풀려진 수라고 본다. 구원군이 격퇴되자 베르킨게토릭스가 항복했고, 로마로 끌려가 6년 동안 갇혔다가 카이사르의 개선식(기원전 46) 뒤 처형되었다. 기원전 51년 욱셀로두눔이 무너질 때 카이사르가 항전한 이들의 손을 잘랐다고 히르티우스는 적는다(8.44). 지도는 갈리아 전체(약 55만 km²)를 로마 땅으로 옮기는 해를 욱셀로두눔이 무너진 기원전 51년으로 잡는다. 플루타르코스는 갈리아 정복에서 800개 도시를 함락하고 300개 부족을 복속시키며 100만 명을 죽이고 100만 명을 노예로 삼았다고 적고, 대플리니우스는 죽은 이를 119만 2천 명이라 적으나 모두 과장으로 본다. 정복은 많은 목숨과 땅을 앗았으나 갈리아가 라틴어와 로마 속주 제도로 옮겨 가는 바탕이 되었다."
  subjects: [celtic-tribes, roman-republic]
  links:
