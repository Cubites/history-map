  tags: [war]
  sources: ["Livy(리비우스), Periochae(『요약』) 60~61 (Alfred C. Schlesinger·Russel M. Geer 엮음, Loeb, 1959)", "Velleius Paterculus(벨레이우스 파테르쿨루스), Historia Romana(『로마사』) 1.15 (Frederick W. Shipley 영역, Loeb, 1924)", "Orosius(오로시우스), Historiae adversus paganos(『이교도에 맞선 역사』) 5.14 (Roy J. Deferrari 영역, 1964)", "C. M. Ebel, Transalpine Gaul: The Emergence of a Roman Province (1976)"]

- id: marius-cimbri-jugurtha-113bc
  year: -112
  endYear: -100
  title:
    ko: "유구르타 전쟁(기원전 112~105)과 킴브리·테우토네스 전쟁(113~101), 마리우스의 부상"
  summary:
    ko: "누미디아 왕 미킵사가 기원전 118년 죽은 뒤 양자 유구르타가 왕자들을 제거하고 아데르발을 죽이면서 키르타의 이탈리아 상인들까지 학살하자(기원전 112) 로마 공화정이 개입했다. 살루스티우스는 로마 지휘관들의 매수를 고발한다(『유구르타 전쟁』). 퀸투스 카이킬리우스 메텔루스 밑에서 싸운 부관 가이우스 마리우스가 기원전 107년 ‘새 인물’로 집정관에 올라 사령관이 되었고, 그의 재무관 술라가 유구르타의 장인 마우레타니아 왕 보쿠스를 설득해 기원전 105년 유구르타를 넘기게 했다. 한편 북쪽에서는 킴브리와 테우토네스가 기원전 113년 노리쿰의 노레이아에서 로마 집정관 카르보를 꺾었고(노리쿰은 로마와 친선 관계였다), 갈리아를 휩쓸어 기원전 105년 아라우시오(오랑주)에서 카이피오와 말리우스의 군대를 크게 무찔렀다(사료의 로마 쪽 사망자 수는 8만에서 12만에 이르러 과장으로 본다). 마리우스는 첫 집정관 해인 기원전 107년 재산 없는 시민도 군단에 받아들였고(살루스티우스 86, 군대가 장군에게 충성하는 계기로 본다), 위기 속에서 기원전 104~100년 거듭 집정관이 되어 군대를 다시 짰으며, 기원전 102년 엑스에서 테우토네스와 암브로네스를, 기원전 101년 베르켈라이에서 마리우스와 카툴루스가 킴브리를 꺾었다. 플루타르코스는 엑스에서 10만 명 넘게 죽거나 잡혔고 베르켈라이에서 12만 명이 죽고 6만 명이 잡혔다고 적는데(『마리우스』 21·27) 과장으로 본다. 포로는 노예가 되었고 킴브리 여인들이 집단으로 목숨을 끊었다고 전한다. 이 이동은 북해 연안 게르만 계통 집단이 주도했다고 보나 켈트계가 섞였다고 보기도 한다. 지도는 킴브리·테우토네스의 이동과 누미디아를 그리지 않는다."
  subjects: [roman-republic, germanic-tribes, celtic-tribes, noricum-kingdom]
  links:
