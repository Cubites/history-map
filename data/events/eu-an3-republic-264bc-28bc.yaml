- id: third-macedonian-war-171bc
  year: -170
  endYear: -165
  title:
    ko: "제3차 마케도니아 전쟁(기원전 171~168), 피드나 전투와 마케도니아 네 공화국·에페이로스의 약탈(167)"
  summary:
    ko: "필리포스 5세의 아들 페르세우스(재위 기원전 179~168)가 그리스에서 인기를 얻자 페르가몬의 에우메네스 2세가 로마에 그를 고발했고, 로마 공화정은 기원전 171년 선전포고했다. 처음 3년은 로마가 지지부진했으나 기원전 168년 6월 말 루키우스 아이밀리우스 파울루스가 피드나에서 마케도니아 팔랑크스를 부쉈다(전투 전날 밤 월식이 있었다고 전한다). 페르세우스는 사모트라케로 달아났다가 항복해 로마의 개선 행렬에 끌려갔고 이탈리아에서 죽었다. 마케도니아 왕국은 이듬해(기원전 167) 해체되어 암피폴리스·테살로니케·펠라·펠라고니아를 중심으로 네 공화국(메리데스)으로 갈라졌다. 로마는 서로 결혼과 거래를 못 하게 하고 금·은 광산 채굴을 막았으며 왕에게 내던 세금의 절반을 로마에 내게 했다(리비우스 45.29). 일리리아 왕 겐티우스도 168년 스코드라에서 패했고, 이듬해(167) 일리리아 왕국은 셋으로 나뉘어 공납 지역이 되었다(리비우스 45.26). 에페이로스는 페르세우스에 협력한 몰로시아인을 벌하려 원로원이 기원전 167년 아이밀리우스 파울루스에게 약탈을 맡겨 70개 도시가 파괴되고 15만 명이 노예로 팔렸다고 폴리비오스와 리비우스는 적는다(폴리비오스 30.15, 리비우스 45.34). 아카이아 동맹의 지도자 천 명도 의심을 받아 이탈리아에 억류되었는데 역사가 폴리비오스도 그 가운데 있었다(30.13). 로도스는 전쟁 중 중재를 내세워 로마의 미움을 샀다. 로마는 기원전 167년 카리아와 리키아를 로도스에서 떼어 자유를 주었고(리키아 동맹이 따로 선다) 기원전 166년 델로스를 아테네에 주어 자유항으로 삼아 로도스의 항구 수입이 크게 줄었다(폴리비오스 30.31). 지도는 마케도니아 왕국·일리리아 왕국·에페이로스를 기원전 168년까지 그리고, 네 공화국이 세워지고 일리리아와 에페이로스가 정리된 기원전 167년부터 마케도니아 네 공화국을 따로, 일리리아 왕국과 에페이로스의 땅을 로마 땅으로 그리며, 로도스의 카리아·리키아도 같은 해 떼어 낸다. 이 전쟁으로 마케도니아와 그리스 도시국가들은 로마의 눈치를 보는 곳이 되었다."
  subjects: [macedonia-kingdom, macedonian-republics, roman-republic, epirus, illyrian-kingdom, rhodes, lycian-league, achaean-league, pergamon-kingdom, greek-city-states]
