- id: celtiberian-lusitanian-wars-193bc
  year: -192
  endYear: -132
  title:
    ko: "히스파니아 내륙의 정복: 톨레툼(기원전 192)과 그라쿠스의 조약(179), 루시타니아 전쟁과 비리아투스(155~139), 누만티아의 함락(133)"
  summary:
    ko: "기원전 206년 카르타고를 몰아낸 로마 공화정은 히스파니아에 눌러앉았고(기원전 197년 가까운 히스파니아와 먼 히스파니아 두 속주) 이베리아 부족 묶음에 드는 내륙 부족(켈티베리아·루시타니아 등)과 거듭 싸웠다. 기원전 192년 마르쿠스 풀비우스 노빌리오르가 카르페타니의 중심 톨레툼을 차지했다(지도는 이 땅을 기원전 192년부터 로마로 그린다). 기원전 180~178년 켈티베리아와 싸운 티베리우스 셈프로니우스 그라쿠스(그라쿠스 형제의 아버지)는 부족과 조약을 맺어 공납과 병력을 정했고 이 평화는 20여 년 이어졌다(지도는 에브로강 상류와 켈티베리아 일대를 기원전 179년 로마 땅으로 그린다). 기원전 155년부터 루시타니아인이 들고일어났고 기원전 150년 총독 갈바는 협상을 핑계로 무기를 내려놓은 루시타니아인을 학살하거나 팔았다(아피아노스 『이베리케』 58~60). 살아남은 비리아투스가 기원전 147년 무렵부터 게릴라전으로 로마군을 거듭 꺾었으나 기원전 139년 로마 장군 카이피오에게 매수된 측근 셋에게 암살되었다(74~75). 지도는 루시타니아와 베토네스 땅을 기원전 139년 로마로 옮긴다. 동쪽에서는 켈티베리아 전쟁(기원전 153~151, 143~133)이 이어졌다. 기원전 137년 집정관 만키누스가 누만티아 앞에서 맺은 항복 조약을 원로원이 파기하고 만키누스를 적에게 넘겼다(재무관 티베리우스 그라쿠스가 이 조약을 맺은 일행이었다). 기원전 134년 스키피오 아이밀리아누스가 누만티아를 포위했고, 기원전 133년 굶주린 주민이 항복했고 항복 직후 많은 이가 스스로 목숨을 끊었으며(아피아노스 96~97), 스키피오는 50명을 개선식용으로 남기고 나머지를 팔고 도시를 허물었다(98). 도시에 불을 질러 집단으로 죽었다는 이야기는 후대 전승이다. 지도는 소리아·과달라하라·세고비아 일대를 기원전 133년 로마 땅으로 그린다. 로마의 정복은 학살과 노예화를 거듭했고 부족은 끈질기게 맞섰다."
  subjects: [iberian-tribes, roman-republic]
  links:
