- id: hannibal-cannae-218bc
  year: -217
  endYear: -215
  title:
    ko: "한니발의 이탈리아 침공: 알프스(기원전 218), 트레비아·트라시메누스, 칸나이(216)"
  summary:
    ko: "기원전 218년 로마 공화정이 사군툼 문제로 카르타고에 선전포고하자 한니발은 육로로 에브로강과 피레네산맥, 론강을 거쳐 늦가을 알프스를 넘었다. 이때 코끼리와 병력의 상당수를 잃었고 폴리비오스는 보병 2만과 기병 6천이 남았다고 적는다(3.56). 넘은 고갯길은 논쟁이다. 11월 티키누스에서 로마 기병을 꺾고 12월 트레비아강에서 집정관 셈프로니우스 롱구스의 군대를 격파하자 포강 유역의 보이이·인수브레스가 한니발 편으로 돌아섰다(지도는 이들을 기원전 218년 켈트 부족 묶음으로 되돌린다). 그사이 로마는 그나이우스 스키피오를 히스파니아에 보내 엠포리온과 타라코에 거점을 만들었고(지도는 카탈루냐 북부를 기원전 218년부터 이베리아 부족 묶음에서 로마 땅으로 옮겨 그린다) 몰타를 차지했다. 기원전 217년 6월(날짜는 당시 로마 달력 기준, 아래 날짜도 같다) 트라시메누스호에서 한니발은 집정관 가이우스 플라미니우스의 군대를 안개 낀 호숫가 매복으로 거의 전멸시켰다(플라미니우스 전사. 폴리비오스는 1만 5천 명이 죽고 1만 5천 명 넘게 사로잡혔다고 적는다, 3.84~85. 1만 명이 흩어져 달아났다는 것은 리비우스 22.7). 독재관 퀸투스 파비우스 막시무스는 결전을 피하는 지연전을 폈다. 기원전 216년 8월 2일 아풀리아의 칸나이에서 집정관 아이밀리우스 파울루스와 테렌티우스 바로의 로마·동맹군(폴리비오스는 보병 8만, 기병 6천이라 한다)이 한니발의 군(보병 4만, 기병 1만)에 양익 포위로 무너졌다. 폴리비오스는 보병 약 7만이 죽었다고 하고(3.117) 리비우스는 보병 4만 5천 5백, 기병 2천 7백이라 적어(22.49) 수가 다르며, 파울루스를 포함해 원로원 의원 수십 명이 죽었다. 칸나이는 포위 섬멸의 본보기로 꼽힌다. 한니발 군이 지난 곳의 농민은 징발과 약탈에 시달렸다."
