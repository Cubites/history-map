  tags: [politics, war]
  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『시리아 전쟁』 45~70 (Horace White 영역, Loeb, 1912~1913)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 35~40 (J. C. Yardley 영역, 1994)", "Susan Sherwin-White·Amélie Kuhrt, From Samarkand to Sardis: A New Approach to the Seleucid Empire (1993)", "Kay Ehling, Untersuchungen zur Geschichte der späten Seleukiden (164–63 v. Chr.) (2008)"]

- id: third-punic-corinth-149bc
  year: -148
  endYear: -145
  title:
    ko: "제3차 포에니 전쟁(기원전 149~146)과 카르타고의 파괴, 마케도니아 속주(148)와 코린토스의 파괴(146)"
  summary:
    ko: "카르타고는 한니발 전쟁 뒤 무역으로 다시 번영했으나 누미디아 왕 마시니사의 잦은 침범에 시달렸다. 기원전 150년 무렵 카르타고가 로마의 허락 없이 마시니사에 맞서 군을 일으키자(강화 조약 위반) 로마 공화정은 기원전 149년 선전포고했다. 대(大)카토는 연설을 카르타고를 없애야 한다는 말로 맺곤 했다고 전한다(플루타르코스 『카토』 27). 카르타고가 인질과 무기를 넘겼으나 로마가 도시를 버리고 바다에서 먼 내륙으로 옮기라고 요구하자 거절하고 맞섰다. 3년을 버틴 끝에 기원전 146년 봄 스키피오 아이밀리아누스(아프리카누스의 양손자)가 도시에 쳐들어가 엿새 동안의 시가전 끝에 불태웠다(아피아노스 『리비케』 128~130). 아피아노스는 살아남은 주민이 5만 명이었고 노예로 팔렸다고 적는다. 땅은 아프리카 속주가 되었다. 도시에 소금을 뿌렸다는 이야기는 훨씬 뒤에 만들어진 것으로 본다. 마케도니아에서는 페르세우스의 아들이라 자처한 안드리스코스가 기원전 150년 반란을 일으켜 로마군을 꺾었으나 기원전 148년 퀸투스 카이킬리우스 메텔루스에게 졌고, 마케도니아는 로마의 속주가 되었다(지도는 마케도니아 네 공화국을 기원전 148년에 끝내고 마케도니아를 로마 땅으로 옮긴다). 기원전 146년 아카이아 동맹은 스파르타의 이탈 문제로 로마와 갈라서 싸우다가 루키우스 뭄미우스에게 코린토스에서 졌다. 뭄미우스는 코린토스를 약탈하고 불태웠으며 남자를 죽이고 여자와 아이를 노예로 팔았다고 파우사니아스는 전한다(7.16). 미술품이 로마로 실려 갔고 아카이아 동맹은 해체되었으며, 기원전 188년 이래 로마의 종속 동맹이던 아이톨리아 동맹을 포함한 그리스 도시국가들은 마케도니아 총독의 감독 아래 놓였다(속주 아카이아는 기원전 27년에 따로 생긴다). 지도는 카르타고와 두 동맹을 기원전 146년에 끝내고 그리스 본토를 로마 땅으로 옮기며, 카르타고의 식민 도시였던 이비사(에부수스)도 이 해부터 로마와 동맹 조약을 맺은 도시로 보아 로마 땅으로 그린다."
  subjects: [carthage, roman-republic, macedonian-republics, achaean-league, aetolian-league, greek-city-states]
  links:
    - { from: roman-republic, to: achaean-league, note: "아카이아 전쟁과 코린토스(기원전 146)" }
  tags: [war]
  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『리비케』 67~135 (Horace White 영역, Loeb, 1912~1913)", "Polybius(폴리비오스), Historiai(『역사』) 36~39 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Pausanias(파우사니아스), Hellados periegesis(『그리스 안내기』) 7.14~16 (W. H. S. Jones 영역, Loeb, 1918~1935)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『대(大)카토』 26~27 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Richard Miles, Carthage Must Be Destroyed: The Rise and Fall of an Ancient Civilization (2010)"]
