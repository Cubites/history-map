# 유럽 고대 사건 3차 묶음: 제1차 포에니 전쟁에서 악티움과 프톨레마이오스 왕국의 끝까지 (기원전 264 ~ 기원전 28, 작업 EVA3)
# 범위: 제1차 포에니 전쟁(264~241)과 시칠리아, 용병 전쟁과 사르데냐·코르시카(238), 바르카 가문의 히스파니아(237~219)와 사군툼, 텔라몬과 갈리아 키살피나(225~191),
#   일리리아 전쟁(229·219)과 그리스 본토, 제2차 포에니 전쟁(218~201: 알프스·트레비아·트라시메누스·칸나이·시라쿠사 212·메타우루스·일리파·자마),
#   안티오코스 3세(223~187)와 마그네시아·아파메아 조약(188), 제2·3차 마케도니아 전쟁(200~197·171~168), 켈티베리아·루시타니아 전쟁(누만티아 133),
#   제3차 포에니 전쟁과 코린토스 파괴(146), 마카베오 반란(167~), 셀레우코스 제국의 해체, 페르가몬 유증(133)과 아시아 속주(129), 프톨레마이오스 왕국과 로마,
#   그라쿠스 형제, 갈리아 트란살피나(121), 유구르타 전쟁과 킴브리·테우토네스(마리우스), 킬리키아 해적과 크레타(67), 동맹시 전쟁(91~88)과 술라, 세르토리우스와 스파르타쿠스,
#   폰토스의 팽창, 미트리다테스 전쟁(89~63, 88년 아시아의 학살)과 비티니아 유증(74), 티그라네스 2세의 아르메니아(95~66), 폼페이우스의 동방 정리(66~63), 부레비스타의 다키아(82~44),
#   카이사르의 갈리아 정복(58~50, 알레시아 52)과 브리타니아 원정(55·54), 카레 전투(53), 내전(49~45)과 카이사르의 암살(44), 제2차 삼두 정치와 필리피(42), 악티움(31)과 이집트 정복(30),
#   티리스와 오드리사이 왕국, 흑해 북쪽 초원의 스키타이·사르마티아와 크림 스키타이.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 기원전 264~28년 지도에서 생기거나 끝난 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음(docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 스키피오 아프리카누스 사건에서 같은 때의 진의 멸망·한(전한)의 성립·흉노, 카이사르의 갈리아 정복 사건에서 신라 건국 전승(기원전 57), 카레 전투 사건에서 한 무제의 서역 경영과 낙랑군,
#   안토니우스와 클레오파트라 사건에서 고구려 건국 전승(기원전 37)을 한 문장씩 견주었다. 01·02번 파일의 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 264년 = −263)로 넣고 본문에는 '기원전 264년'처럼 적었다.
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 며칠 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 고대 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: first-punic-war-264bc
  year: -263
  endYear: -240
  title:
    ko: "제1차 포에니 전쟁(기원전 264~241)과 로마의 시칠리아"
  summary:
    ko: "기원전 264년 로마는 볼시니를 함락해 에트루리아 도시들의 마지막 독립을 끝냈고 남이탈리아까지 아울러 반도 대부분을 다스렸다(지도는 이 해로 에트루리아 도시국가와 이탈리아 부족 묶음을 끝낸다). 같은 해 시칠리아 북동쪽 메사나를 차지한 용병 마메르티니가 시라쿠사의 히에론 2세와 카르타고에 맞서 로마에 도움을 청하자 로마가 바다를 건너 카르타고와 전쟁을 시작했다. 히에론은 기원전 263년 로마와 동맹했고 시라쿠사는 그 뒤 로마의 동맹으로 남는다. 조약으로 히에론은 시라쿠사와 둘레 몇 도시(아크라이·레온티노이·메가라·헬로로스·네에톤·타우로메니온)만 지켰고(디오도로스 23.4), 카타나 같은 동부 도시는 이 해 로마에 항복했다(지도는 1만 km² 미만이라 카타나를 기원전 260년 버전부터 그리스 도시국가 묶음에서 로마 땅으로 옮긴다). 로마는 262년 아그리겐툼을 함락했고(폴리비오스는 2만 5천 명 넘는 주민이 노예로 팔렸다고 적는다, 1.19) 처음으로 큰 함대를 지어 260년 밀라이에서, 256년 에크노모스곶에서 이겼다. 아프리카로 건너간 마르쿠스 아틸리우스 레굴루스는 255년 튀니스 부근에서 스파르타 출신 용병대장 크산티포스에게 져 포로가 되었다. 로마는 254년 파노르무스를 얻었으나 249년 드레파나 해전에서 졌고, 시칠리아 서쪽 끝 릴리바이움 포위는 250년부터 이어졌다. 카르타고의 하밀카르 바르카는 에릭스산 일대에서 오래 버텼으나, 241년 3월 아이가테스 제도 앞바다에서 가이우스 루타티우스 카툴루스가 카르타고의 보급 함대를 꺾자 카르타고는 강화를 청했다. 조약으로 카르타고는 시칠리아를 비우고 배상금을 내기로 했다(폴리비오스 1.62~63). 지도는 시칠리아 서부(카르타고령)를 기원전 241년 조약 해로 로마 공화정 땅으로 옮겨 그린다. 이 땅이 로마의 첫 해외 속주 시칠리아의 바탕이 되었다. 폴리비오스는 이 전쟁을 역사상 가장 오래 이어지고 큰 전쟁이라 적었고 양쪽의 배 손실을 로마 700척, 카르타고 500척이라 하나(1.63) 수는 믿기 어렵다."
