- id: carrhae-han-53bc
  year: -53
  endYear: -52
  title:
    ko: "크라수스의 파르티아 원정과 카레 전투(기원전 53), 같은 때의 한과 흉노"
  summary:
    ko: "로마 공화정의 삼두 가운데 한 사람인 마르쿠스 리키니우스 크라수스는 기원전 55년 집정관을 지낸 뒤 시리아 총독이 되어 부와 군공을 얻으려 파르티아 원정에 나섰다. 아르메니아 왕 아르타바스데스 2세가 아르메니아를 거치자고 제안했으나 크라수스는 메소포타미아의 사막 길을 택했다(플루타르코스 『크라수스』 19). 기원전 53년 6월 카레(하란) 부근에서 수레나가 이끈 파르티아의 중무장 기병과 활 쏘는 기병이 로마군(약 4만)을 에워쌌다. 크라수스의 아들 푸블리우스가 전사하고 로마군 대부분이 죽거나 사로잡혔으며 파르티아 쪽이 협상 중 크라수스를 죽였다(플루타르코스는 약 2만 명이 죽고 1만 명이 포로가 되었다고 적는다, 31). 포로가 파르티아 동쪽 마르기아나에 정착했다고 플리니우스는 전한다(『박물지』 6.47). 20세기 호머 덥스는 이들이 흉노 질지 선우의 용병이 되었다가 기원전 36년 한의 진탕에게 진 군단병이며 간쑤성 리첸(驪靬)의 이름이 ‘레기오’에서 비롯했다고 주장했으나 학계는 대체로 받아들이지 않는다. 기원전 36년 한의 진탕이 중앙아시아에서 흉노의 질지 선우를 죽인 일은 사료에 전하지만 로마 군단과의 관계는 증명되지 않았다. 확실한 것은 한 무제가 장건의 사행(기원전 138~126) 이후 서역에 진출해 기원전 2세기 말 파르티아(안식)와 처음 사절을 주고받았고(『사기』 대완열전), 같은 무제가 동쪽으로는 기원전 108년 고조선을 멸망시켜 한반도 북부에 낙랑군 등을 두었다는 것이다(`han-invasion-109`, `han-commanderies-108`). 카레의 패배로 파르티아는 로마와 맞서는 강국이 되었고, 빼앗긴 독수리 군기는 기원전 20년 아우구스투스가 외교로 되찾았다(뒤의 사건)."
