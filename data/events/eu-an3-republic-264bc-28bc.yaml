- id: mithridatic-wars-89bc
  year: -88
  endYear: -80
  title:
    ko: "제1차·제2차 미트리다테스 전쟁(기원전 89~81)과 88년 아시아의 학살"
  summary:
    ko: "기원전 90년 미트리다테스 6세는 니코메데스 4세의 동생 소크라테스 크레스토스를 앞세워 니코메데스를 내쫓고 카파도키아의 아리오바르자네스 1세도 몰아냈으나, 기원전 89년 로마 공화정의 사절 마니우스 아퀼리우스(129년 아퀼리우스의 아들)가 두 왕을 되돌려 놓았다. 이 사절 등의 부추김으로 비티니아 왕 니코메데스 4세가 폰토스를 침입하자(아피아노스 『미트리다테스 전쟁』 11), 미트리다테스 6세가 반격해 카파도키아와 소아시아를 휩쓸었다. 기원전 88년 그는 아시아 속주의 로마인과 이탈리아인을 하루에 죽이라고 명령했다. 발레리우스 막시무스와 멤논은 8만 명, 플루타르코스는 15만 명이라 적으나 모두 부풀려졌다는 견해가 많다. 징세 청부로 쌓인 원한이 도시들이 가담한 배경으로 꼽힌다. 로도스는 폰토스의 포위를 막아냈고(기원전 88), 아테네 같은 그리스 도시국가 일부는 미트리다테스 편에 섰으나 기원전 87~86년 술라가 아테네와 피레우스를 에워싸 함락하고 약탈했으며, 기원전 86년 카이로네이아와 85년 오르코메노스에서 폰토스군을 꺾었다. 미트리다테스도 아시아에서 로마 편 도시를 가혹하게 다뤘다(아피아노스는 키오스 시민을 콜키스로 보냈다고 적는다). 기원전 85년 다르다노스 협정으로 그는 정복지를 내놓고 함선 70척과 배상금을 내기로 했다. 술라는 아시아 도시에 큰 배상금과 군대 숙영 부담을 물렸다(플루타르코스 『술라』 25). 기원전 83~81년 무레나가 폰토스를 침범한 제2차 전쟁은 술라의 명령으로 끝났다. 지도는 미트리다테스의 아시아 점령 기간(88~85)을 땅이 바뀐 것으로 그리지 않고 폰토스 왕국은 그대로 둔다."
