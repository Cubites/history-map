  sources: ["Sallust(살루스티우스), Bellum Iugurthinum(『유구르타 전쟁』) (J. C. Rolfe 영역, Loeb, 1921)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『마리우스』 11~27 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Livy(리비우스), Periochae(『요약』) 63~68 (Alfred C. Schlesinger·Russel M. Geer 엮음, Loeb, 1959)", "Richard J. Evans, Gaius Marius: A Political Biography (1994)"]
