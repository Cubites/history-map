- id: seleucid-disintegration-163bc
  year: -162
  endYear: -68
  title:
    ko: "셀레우코스 제국의 해체: 콤마게네·오스로에네의 이탈(기원전 163·132)과 파르티아의 메소포타미아(129), 왕위 다툼과 티그라네스(83~69)"
  summary:
    ko: "안티오코스 4세가 죽은 뒤(기원전 164) 어린 안티오코스 5세(164~162)를 둘러싼 섭정 다툼 속에서 기원전 163년 콤마게네의 총독 프톨레마이오스가 독립했다(지도는 콤마게네를 기원전 163년부터 따로 그린다). 기원전 162년 데메트리오스 1세가 안티오코스 5세를 죽이고 왕이 되었고, 그 뒤 알렉산드로스 발라스(150~145), 데메트리오스 2세와 알렉산드로스 발라스의 아들 안티오코스 6세를 내세운 장군 디오도토스 트리폰의 대립(145~138), 안티오코스 7세(138~129)가 이어졌다. 안티오코스 7세가 죽은 뒤에는 파르티아에서 풀려난 데메트리오스 2세의 복위(129~125)와 반왕 알렉산드로스 2세 자비나스(128~123), 셀레우코스 5세(126~125), 그리고 125~121년 아들 안티오코스 8세와 공동 통치한 클레오파트라 테아(126~125년은 단독)가 엇갈렸고, 왕위를 노리는 사람들이 로마·프톨레마이오스의 후원을 업고 다퉜다. 동쪽에서는 파르티아의 미트리다테스 1세가 기원전 141년 바빌로니아를 차지했고, 안티오코스 7세는 기원전 130년 원정에 나섰다가 129년 죽었다(지도는 메소포타미아 북부 니시비스 일대와 킬리키아 트라케이아를 기원전 129년 셀레우코스 땅에서 빼 비운다). 기원전 132년 무렵 에데사에서 아리우 가문이 오스로에네 왕국을 세웠다(지도는 기원전 132년). 그 뒤 안티오코스 8세 그리포스와 9세 키지케노스의 분할 통치(기원전 114 무렵~96) 같은 내전에 이어 데메트리오스 3세·셀레우코스 6세(96~94)·안티오코스 10세·11세·12세·필리포스 1세 등이 엇갈린 끝에 쪼개졌고, 기원전 83년 아르메니아의 티그라네스 2세가 시리아를 차지했다(지도는 시리아·킬리키아 평야·니시비스를 기원전 83년 아르메니아로 그린다). 기원전 69년 루쿨루스에게 티그라네스가 지자 셀레우코스 왕가의 안티오코스 13세 아시아티코스가 시리아를 돌려받았다(지도는 기원전 69년). 기원전 64년 폼페이우스가 이 나라를 없애는 일은 뒤의 사건이다. 제국 쇠퇴는 왕조 내부의 다툼과 파르티아의 압박이 얽힌 결과였고 로마 공화정은 이를 이용해 이웃 왕국들의 독립을 인정했다."
  subjects: [seleucid-empire, commagene, osroene, arsacid-armenia, roman-republic]
  links:
