- id: antiochus-iii-223bc
  year: -222
  endYear: -194
  title:
    ko: "안티오코스 3세의 제국 재건(기원전 223~195): 몰론과 아카이오스의 반란, 라피아와 파니온, 아르메니아"
  summary:
    ko: "셀레우코스 제국은 3세기 중엽 이후 파르티아와 박트리아를 잃고 소아시아에서는 페르가몬이 일어나 기울고 있었다. 형 셀레우코스 3세가 암살되자 기원전 223년 왕위에 오른 안티오코스 3세(재위 기원전 223~187)가 제국을 되살렸다. 먼저 동방 총독 몰론(222~220)과 소아시아의 사촌 아카이오스(220~213)의 반란을 눌렀다. 아카이오스가 소아시아에서 왕이라 칭하는 사이 페르가몬의 아탈로스 1세가 기원전 218년 그의 영토 가운데 아이올리스와 미시아를 차지했고(폴리비오스 5.77~78, 지도는 미시아를 기원전 218년부터 페르가몬 땅으로 그린다), 안티오코스는 기원전 213년 사르디스에서 아카이오스를 사로잡아 처형했다. 제4차 시리아 전쟁(219~217)에서는 프톨레마이오스 4세에게 기원전 217년 라피아(가자 부근)에서 졌고, 폴리비오스는 이 싸움에 쓰인 이집트 토착민 보병이 뒤에 반란의 힘이 되었다고 적는다(5.107). 안티오코스는 기원전 212~205년 아르메니아(소페네)의 왕 크세르크세스를 눌러 복속시키고 파르티아·박트리아를 거쳐 인도 국경에 이르는 원정으로 동방 속주를 다시 세워 ‘대왕’이라 불렸다. 제5차 시리아 전쟁(202~195)에서는 기원전 200년(198년으로 보는 견해도 있다) 파니온(바니아스)에서 이겨 코일레시리아를 얻고 소아시아의 프톨레마이오스 땅을 차지했으며, 기원전 196년 헬레스폰토스를 건너 트라키아 케르소네소스의 리시마케이아를 다시 세웠다. 이것이 로마와 부딪히는 씨앗이 되었다(뒤의 사건). 지도는 대아르메니아와 소페네 일대를 기원전 200년부터 안티오코스의 장군 아르탁시아스와 자리아드리스가 다스린 셀레우코스 땅으로 그린다(스트라본 11.14.5, 기원전 189년 독립). 소아르메니아는 이 무렵 셀레우코스에 들었다는 근거가 없어(스트라본 11.14.5의 두 장군은 대아르메니아와 소페네를 맡음) 지도는 아리아케스 왕들 이래의 소아르메니아 왕국으로 잇는다."
  subjects: [seleucid-empire, ptolemaic-kingdom, pergamon-kingdom, arsacid-armenia]
  links:
