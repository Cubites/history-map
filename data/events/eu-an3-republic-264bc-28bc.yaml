- id: social-war-sulla-91bc
  year: -90
  endYear: -78
  title:
    ko: "동맹시 전쟁(기원전 91~88)에서 술라의 독재(82~79)까지: 이탈리아의 시민권과 로마의 내전"
  summary:
    ko: "로마의 오랜 동맹이던 이탈리아 공동체(마르시·삼니움·루카니아 등)는 병력을 내면서도 시민권이 없어 불만이었고, 기원전 91년 시민권 확대를 추진하던 호민관 마르쿠스 리비우스 드루수스가 암살되자 아스쿨룸에서 반란이 터졌다(동맹시 전쟁). 반란 동맹은 코르피니움(‘이탈리카’)을 수도로 삼아 자기 정부와 화폐를 갖췄다. 로마는 기원전 90년 율리우스법과 89년 플라우티우스·파피리우스법으로 시민권을 넓혀 반란에서 이탈하는 공동체를 늘리며 반란을 눌렀다. 벨레이우스는 이탈리아 청년 30만이 죽었다고 적으나(2.15) 과장이다. 이로써 포강 이남 이탈리아의 자유민 대부분이 로마 시민이 되었다. 곧이어 기원전 88년 집정관 술라가 미트리다테스 전쟁 지휘권을 받으려 하자 마리우스가 호민관 술피키우스의 도움으로 가로채려 했고, 술라는 처음으로 군대를 이끌고 로마로 진군했다. 술라가 동방에 간 사이(뒤의 사건) 킨나와 마리우스가 로마를 차지해 반대파를 학살했고(기원전 87), 기원전 83년 돌아온 술라는 기원전 82년 콜리나 문에서 삼니움 군을 꺾어 로마를 장악했다. 술라는 임기를 정하지 않은 독재관(기원전 82~79 무렵)이 되어 살생부로 정적을 지목해 죽이게 했는데, 아피아노스는 처음 명단에 원로원 의원 40명쯤과 기사 1,600명쯤이 있었다고 적는다(1.95). 원로원을 600명으로 늘리고 호민관의 권한을 줄이는 개혁을 한 뒤 독재관 자리를 내려놓았고(81~79년 사이로 연대가 갈린다) 기원전 78년 죽었다. 군대가 장군에게 충성하는 폭력의 정치가 굳어졌다고 평한다. 지도는 이탈리아를 기원전 264년부터 로마 공화정 한 나라로 그린다."
  subjects: [roman-republic]
  tags: [war, politics]
  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『내전기』 1.34~107 (Horace White 영역, Loeb, 1912~1913)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『술라』, 『마리우스』 34~46 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Velleius Paterculus(벨레이우스 파테르쿨루스), Historia Romana(『로마사』) 2.15~28 (Frederick W. Shipley 영역, Loeb, 1924)", "Arthur Keaveney, Sulla: The Last Republican (2판, 2005)", "Henrik Mouritsen, Italian Unification: A Study in Ancient and Modern Historiography (1998)"]
