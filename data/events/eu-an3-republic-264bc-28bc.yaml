- id: tigranes-95bc
  year: -94
  endYear: -65
  title:
    ko: "티그라네스 2세의 아르메니아(기원전 95~66): 소페네 병합과 시리아 점령, 티그라노케르타(69)"
  summary:
    ko: "아르탁시아스 왕조의 티그라네스 2세(재위 기원전 95~55)는 파르티아에 인질로 가 있다가 약 70개 골짜기를 대가로 돌려받아 즉위했다고 스트라본은 전한다(11.14.15). 그는 소페네를 아르메니아에 합쳤고(지도는 소페네 왕국을 기원전 95년에 끝낸다), 파르티아 왕 미트리다테스 2세가 죽은 뒤 메소포타미아 북부를 얻어 ‘왕 중의 왕’이라 칭했다. 장인인 폰토스 왕 미트리다테스 6세와 동맹을 맺고 기원전 83년 내전으로 갈라진 셀레우코스 제국의 시리아를 차지했다(지도는 시리아·킬리키아 평야·니시비스를 기원전 83년 아르메니아로 그린다). 새 수도 티그라노케르타를 지으며 그리스·아랍·카파도키아 등의 도시민을 강제로 옮겨 채웠다고 아피아노스는 적는다. 기원전 69년 로마 공화정의 루쿨루스가 티그라노케르타 앞에서 훨씬 큰 아르메니아군을 꺾었고(양쪽 병력은 사료마다 달라 정확하지 않다) 기원전 68년 아르탁사타를 향해 진군했으나 군단의 불만으로 물러났다. 티그라네스는 시리아에서 쫓겨나 셀레우코스 왕가의 안티오코스 13세가 돌아왔다(앞의 사건). 기원전 66년 폼페이우스가 오자 아들 티그라네스의 반란까지 겹쳐 왕은 아르탁사타에서 항복해 시리아와 소아시아의 정복지를 내놓고 배상금을 냈으나, 아르메니아 본토와 ‘로마의 친구이자 동맹’이라는 지위는 지켰다(아피아노스, 카시우스 디오 36.51~53). 지도는 이 정복지를 기원전 95·83·69년의 변화로 그린다. 티그라네스가 옮긴 사람들이 겪은 강제 이주와 그가 세운 대제국의 짧은 수명은 아르메니아 역사에서 전성기와 몰락의 상징이 된다."
  subjects: [arsacid-armenia, sophene-kingdom, seleucid-empire, roman-republic, cappadocia-kingdom, pontus-kingdom]
