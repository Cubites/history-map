  tags: [war, politics]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 4.48~51, 5.40~87, 5.107, 7.15~18, 8.15~23, 15.20, 16.18~19 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Strabo(스트라본), Geographica(『지리지』) 11.14.5 (H. L. Jones 영역, Loeb, 1917~1932)", "John D. Grainger, The Syrian Wars (2010)", "John Ma, Antiochos III and the Cities of Western Asia Minor (1999)"]
