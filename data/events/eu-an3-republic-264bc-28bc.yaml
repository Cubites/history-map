- id: caesar-civil-war-49bc
  year: -48
  endYear: -43
  title:
    ko: "카이사르의 내전(기원전 49~45)과 암살(44)"
  summary:
    ko: "크라수스가 죽고(기원전 53) 삼두 정치가 무너져 폼페이우스가 원로원 보수파와 손잡자, 기원전 49년 1월 카이사르는 로마 공화정 속주의 경계인 루비콘강을 군단과 함께 건너 이탈리아로 진군했다. 폼페이우스 일파는 이탈리아를 떠났고 카이사르는 히스파니아의 폼페이우스 군을 일레르다에서 꺾었으며(49) 마살리아를 포위해 항복을 받고 그 내륙 땅을 빼앗았다(카이사르 『내전기』 2.22. 지도는 1만 km² 미만이라 마살리아를 기원전 44년 버전부터 그리스 도시국가 묶음에서 로마 땅으로 옮긴다). 같은 해 카이사르는 포강 북쪽(트란스파다나) 주민에게 시민권을 주었고(카시우스 디오 41.36), 라이티 쪽의 트리덴툼(트렌토)도 이 무렵 자치시가 되었다고 본다(지도는 트렌토를 기원전 44년 버전부터 켈트 부족 묶음에서 로마 땅으로 옮겨 그린다). 기원전 48년 8월 9일(개정 전 로마 달력 기준이라 율리우스력으로는 6월 초, 이하 달은 같은 기준) 테살리아의 파르살로스에서 카이사르가 폼페이우스의 군(카이사르는 보병 4만 5천이라 적고 자기 쪽은 2만 2천이라 한다)을 꺾었고, 폼페이우스는 이집트로 갔다가 프톨레마이오스 13세의 신하들에게 살해되었다(9월 말). 갈라티아의 데이오타로스는 폼페이우스 편에 섰다가 카이사르의 용서를 받았다. 카이사르는 알렉산드리아 전쟁(48~47)에서 프톨레마이오스 13세를 꺾고 클레오파트라 7세를 동생 프톨레마이오스 14세와 함께 왕위에 앉혔으며, 기원전 47년 8월 젤라에서 보스포로스 왕 파르나케스 2세를 닷새 만에 꺾고 ‘왔노라, 보았노라, 이겼노라’라는 보고를 보냈다고 한다. 기원전 46년 4월 탑수스에서 공화파의 잔당을 꺾었고 소(小)카토는 자결했다. 기원전 45년 3월 히스파니아 문다에서 폼페이우스의 아들들을 꺾어 내전을 마쳤다. 카이사르는 독재관으로서 달력 개혁(율리우스력, 기원전 45), 원로원 확대, 퇴역병 식민시 건설(코린토스·카르타고 재건)을 했고 기원전 44년 2월 종신 독재관이 되었다. 기원전 44년 3월 15일 마르쿠스 브루투스, 가이우스 카시우스 등 원로원 의원 60여 명이 폼페이우스 극장 회당에서 그를 찔러 죽였다(수에토니우스는 상처가 스물세 곳이라 적는다). 그는 파르티아 원정을 준비하던 중이었다. 지도는 키프로스를 카이사르가 기원전 47년 프톨레마이오스 일가에게 돌려준 모습으로 기원전 44년 버전에 그린다. 내전은 갈리아·히스파니아·그리스·이집트·아프리카에 번져 로마인이 로마인을 죽였다."
