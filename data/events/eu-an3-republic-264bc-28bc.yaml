- id: bithynia-third-mithridatic-74bc
  year: -73
  endYear: -65
  title:
    ko: "비티니아의 유증(기원전 74)과 제3차 미트리다테스 전쟁(74~66)"
  summary:
    ko: "비티니아 왕 니코메데스 4세는 후사 없이 죽으며 왕국을 로마에 남긴다는 유언을 했고(기원전 74), 로마 공화정은 이를 받아들여 속주로 삼았다(지도는 이 땅을 기원전 74년에 로마 땅으로 옮기고 비티니아 왕국을 끝낸다). 로마의 팽창을 막으려던 미트리다테스 6세는 기원전 74/73년 비티니아로 진군했고, 기원전 74년 집정관을 지낸 루키우스 리키니우스 루쿨루스가 속주 총독으로서 기원전 73년 키지코스 포위를 풀며 폰토스군을 꺾었다. 기원전 72년 루쿨루스가 카파도키아를 거쳐 폰토스 본토까지 쳐들어가 카비라 부근에서 이기자 미트리다테스는 사위인 아르메니아 왕 티그라네스 2세에게 달아났다. 루쿨루스는 기원전 69년 티그라노케르타에서, 68년 니시비스를 얻었으나 군단이 보수와 복무 기한에 불만을 터뜨려 진군을 멈췄고, 기원전 67년 미트리다테스가 폰토스를 되찾았다(지도는 이 되찾음을 그리지 않는다). 기원전 66년 폼페이우스가 지휘권을 넘겨받아 미트리다테스를 니코폴리스 부근에서 밤에 기습해 꺾었다. 미트리다테스는 콜키스를 거쳐 크림의 보스포로스로 달아났다(뒤의 사건). 루쿨루스는 병사들의 불만을 이용한 정적에게 시달려 지휘권을 잃었다. 이 전쟁은 로마가 동방에서 왕국을 속주로 바꾸는 속도를 높였다."
  subjects: [bithynia-kingdom, pontus-kingdom, roman-republic, arsacid-armenia, cappadocia-kingdom]
  tags: [war, politics]
  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『미트리다테스 전쟁』 71~105 (Horace White 영역, Loeb, 1912~1913)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『루쿨루스』 6~36, 『폼페이우스』 30~34 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 35~36 (Earnest Cary 영역, Loeb, 1914~1927)", "Arthur Keaveney, Lucullus: A Life (1992)", "Brian McGing, The Foreign Policy of Mithridates VI Eupator, King of Pontus (1986)"]
