- id: burebista-82bc
  year: -81
  endYear: -43
  title:
    ko: "부레비스타의 다키아(기원전 82~44)"
  summary:
    ko: "도나우강 하류와 카르파티아산맥 일대의 게타이·다키아인은 기원전 82년 무렵 부레비스타가 부족들을 모아 왕국을 이루며 힘을 얻었다. 스트라본에 따르면 그는 사제 데카이네오스의 조언으로 포도나무를 없애고 술을 금하는 엄한 법으로 백성을 다스리며 군사력을 키웠다(7.3.11). 기원전 60년 무렵부터 도나우강을 건너 트라키아와 일리리아·판노니아 부족 쪽을 약탈하고 켈트계 보이이와 타우리스키를 무너뜨렸으며 흑해 서안의 그리스 도시국가(올비아·아폴로니아·메셈브리아 등)도 손에 넣었다고 한다. 디오니소폴리스의 결의문은 부레비스타를 트라키아 왕들 가운데 첫째이자 가장 큰 왕이라 부르고, 기원전 48년 그가 폼페이우스에게 사절을 보낸 일을 전한다. 로마 공화정의 카이사르가 파르티아 원정 전에 다키아를 치려 했다고 스트라본은 적지만, 기원전 44년 부레비스타는 반란으로 죽었고(카이사르의 죽음과 같은 해라 스트라본이 적는다) 왕국은 넷 또는 다섯으로 갈라졌다. 지도는 부레비스타의 확장을 몰다비아·무테니아·도브루자·티서강 평원으로 보아 기원전 60년의 ‘다키아 왕국’ 버전으로 그리고(올테니아와 트란실바니아는 기원전 82년부터), 그의 죽음을 기원전 44년 버전으로 그린다. 보이이가 무너진 뒤의 니더외스터라이히는 도나우강 남쪽(벨레이우스 2.109가 노리쿰 왕국의 땅이라 적은 카르눈툼 쪽)을 기원전 60년부터 노리쿰 왕국으로 그리고, 강 북쪽은 켈트 부족 묶음으로 둔다. 후계 정권은 도시와 산악 요새를 짓고 로마와 갈라섰다가 100여 년 뒤 데케발루스 때 다시 모였다(뒤의 사건). 연대는 대부분 스트라본에 기대어 불확실하다."
  subjects: [dacian-kingdom, dacian-tribes, thracian-tribes, illyrian-tribes, celtic-tribes, greek-city-states, roman-republic, noricum-kingdom]
  tags: [politics, war]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 7.3.5, 7.3.11~12 (H. L. Jones 영역, Loeb, 1917~1932)", "Jordanes(요르다네스), Getica(『게티카』) 67~73 (Charles C. Mierow 영역, 1915)", "Wilhelm Dittenberger 엮음, Sylloge Inscriptionum Graecarum (3판, 1915~1924) 762 (디오니소폴리스의 아코르니온 결의문)", "Dan Oltean, Dacia: Landscape, Colonisation and Romanisation (2007)", "Velleius Paterculus(벨레이우스 파테르쿨루스), Historia Romana(『로마사』) 2.109 (Frederick W. Shipley 영역, Loeb, 1924)"]

- id: sertorius-spartacus-80bc
  year: -79
  endYear: -70
  title:
    ko: "세르토리우스 전쟁(기원전 80~72)과 스파르타쿠스의 반란(73~71)"
  summary:
    ko: "술라의 살생부를 피한 마리우스파 퀸투스 세르토리우스는 기원전 80년 히스파니아에 와서 이베리아 부족 묶음에 드는 루시타니아와 켈티베리아 부족의 지지를 얻어 로마 정부에 맞서는 독자 정권(자체 원로원까지 갖춤)을 세웠다. 기원전 76년부터 폼페이우스가 파견되어 한동안 어려움을 겪었으나, 기원전 73/72년 세르토리우스가 부하 페르페르나에게 연회에서 암살되자 남은 세력을 쉽게 꺾었다. 폼페이우스는 바스크 땅에 폼파엘로(팜플로나)를 세웠다고 전한다(스트라본 3.4.10. 지도는 나바라를 기원전 72년 로마 땅으로 그린다). 같은 때 이탈리아에서는 기원전 73년 카푸아의 검투사 학교에서 트라키아 출신 스파르타쿠스와 갈리아인 크릭수스·오이노마오스 등 70여 명이 탈출해 베수비우스산에 자리 잡았다. 노예와 가난한 농민이 모여들어 아피아노스는 12만에 이르렀다고 적으나(『내전기』 1.117) 부풀려졌을 수 있다. 로마 공화정이 보낸 군대는 거듭 졌고 반란군은 북이탈리아까지 갔다가 되돌아 남쪽으로 내려왔다. 기원전 71년 마르쿠스 리키니우스 크라수스가 8개 군단으로 이들을 몰아 시칠리아로 건너려던 계획을 막았고, 실라루스강 부근 싸움에서 스파르타쿠스는 전사했다. 아피아노스는 포로 6천 명이 카푸아에서 로마까지 아피우스 가도를 따라 십자가에 매달렸다고 적는다(1.120). 달아난 5천 명을 죽인 폼페이우스는 자신이 반란을 끝냈다고 주장했고, 두 사람은 기원전 70년 집정관이 되었다. 이 반란은 시칠리아의 노예 반란(기원전 135~132, 104~100)과 함께 로마 노예제의 규모와 가혹함을 드러냈다."
  subjects: [iberian-tribes, roman-republic, thracian-tribes]
  tags: [war, society]
  sources: ["Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『세르토리우스』, 『크라수스』 8~11, 『폼페이우스』 17~21 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Appian(아피아노스), Rhomaika(『로마사』) 『내전기』 1.108~121 (Horace White 영역, Loeb, 1912~1913)", "Strabo(스트라본), Geographica(『지리지』) 3.4.10 (H. L. Jones 영역, Loeb, 1917~1932)", "Brent D. Shaw, Spartacus and the Slave Wars: A Brief History with Documents (2001)", "Philip O. Spann, Quintus Sertorius and the Legacy of Sulla (1987)"]
