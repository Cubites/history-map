- id: portuguese-goa-1510
  year: 1510
  title:
    ko: "알부케르케의 고아 점령(1510)"
  summary:
    ko: "1509년 인도 총독에 오른 아폰수 드 알부케르케는 인도양을 통제할 영구적인 해군 기지가 필요하다고 봤다. 그는 먼저 캘리컷을 노렸다가 실패한 뒤 서해안 고아로 눈을 돌렸다(바스쿠 다가마의 도착은 「바스쿠 다가마의 캘리컷 도착(1498)」, 앞의 사건). 고아는 비자푸르의 아딜 샤히 왕국이 다스리던 항구 도시로, 비자야나가라가 노리는 아랍 말 수입 항구이기도 했다. 현지 힌두 해적 두목 티모지가 길을 안내하자 알부케르케는 1510년 2월 17일 고아를 점령했다. 그러나 비자푸르의 이스마일 아딜 샤가 곧 반격했고 5월 포르투갈은 도시를 내줘야 했다. 알부케르케는 같은 해 11월 25일 다시 공격해 점령했고, 알부케르케가 왕에게 보낸 편지는 이때 죽은 이슬람 주민을 약 6천 명으로 적었는데, 이는 포르투갈 쪽 추산이며 비자푸르 군인만 죽었다고 보는 이견도 있다. 이후 고아는 포르투갈 인도 총독의 도읍이 되어 1961년 인도군에 점령당할 때까지 450년 넘게 포르투갈령으로 남았다. 알부케르케는 포르투갈 병사와 현지 여성의 혼인을 장려해 식민지 사회를 만들려 했고, 1511년 말라카, 1515년 호르무즈를 차지해 인도양의 거점을 이었다. 고아는 코친, 카나노르 요새와 함께 포르투갈의 인도 거점망이 됐고, 알부케르케는 1515년 고아에서 죽었다. 포르투갈은 현지 힌두 상인과 지주를 인정해 협력하는 방침을 택했지만, 이 방침은 훗날 1560년 고아 종교 재판소 설치와 함께 바뀐다. 고아의 인구에는 현지 힌두와 무슬림, 포르투갈 남성과 인도 여성의 혼인으로 태어난 후손이 섞였다. 알부케르케는 말과 향신료 교역을 장악하면서도 비자야나가라와의 동맹을 유지하려 했다. 1510년의 고아 점령은 포르투갈이 인도에서 얻은 첫 영구 영토다."
  subjects: [portugal, portuguese-india, bijapur-sultanate, vijayanagara-empire]
  links:
    - { from: portugal, to: bijapur-sultanate, note: "고아를 빼앗음 (1510)" }
  tags: [war, diplomacy]
  sources: ["M. N. Pearson, The Portuguese in India (The New Cambridge History of India I.1, Cambridge University Press, 1987)", "The Commentaries of the Great Afonso Dalboquerque, trans. Walter de Gray Birch (Hakluyt Society, 1875–1884)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Longman, 1993)"]

- id: ibrahim-lodi-1517
  year: 1517
  endYear: 1525
  title:
    ko: "이브라힘 로디와 아프간 귀족의 이반(1517~1525)"
  summary:
    ko: "시칸다르의 아들 이브라힘 로디(재위 1517~1526)는 즉위하자 아프간 귀족들의 부족 중심 질서를 줄이고 술탄에게 권력을 집중시키려 했다. 동생 잘랄 칸이 자운푸르에서 왕을 자처하자 이브라힘은 군대를 보내 잘랄 칸을 사로잡았고(잘랄 칸은 1518년 무렵 살해됐다), 1518년 괄리오르를 차지했다. 그러나 메와르의 라나 상가에게 1517년 하톨리에서, 1519년 돌푸르 근처에서 패했다. 이 정책은 아프간 대귀족의 반발을 샀다. 1524년 펀자브 총독 다울라트 칸 로디가 이브라힘에게 맞서 바부르에게 도움을 청했고, 이브라힘의 숙부 알람 칸도 같은 일을 했다. 바부르는 1519년부터 펀자브 변경을 거듭 넘나들며 시험하다가 1524년 라호르를 차지했다. 이브라힘의 반격과 귀족 이반 속에서 델리 술탄국은 약해졌고, 1526년 4월 파니파트에서 바부르의 군대에게 패해 이브라힘이 전사했다(「제1차 파니파트 전투와 바부르의 무굴 제국(1526~1530)」, 뒤의 사건). 이로써 델리 술탄국의 다섯 왕조 시대가 끝났다. 이브라힘이 다울라트 칸을 델리로 불렀을 때 아들 딜라와르 칸이 궁정에서 모욕을 당했다는 일화가 반란의 계기로 전해진다. 이브라힘은 귀족들이 술탄 앞에서 서 있게 하는 등 의례도 엄격히 했다고 전하는데, 이는 아프간 귀족의 불만을 키웠다. 1526년 4월 파니파트에서의 패배는 이브라힘이 귀족 상당수의 지지를 잃은 상태에서 일어났다. 바부르는 회고록 『바부르나마』에서 이브라힘을 경험 없는 지휘관으로 묘사했다. 이브라힘의 동생 잘랄 칸과 숙부 알람 칸의 내분은 로디 가문 안의 후계 다툼이 얼마나 깊었는지 보여 준다. 그러나 반란은 다울라트 칸의 개인 야심만이 아니라 귀족층 전체의 불만이 겹친 결과였다."
  subjects: [delhi-sultanate, mewar-state]
  tags: [politics, war]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)", "Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)"]
