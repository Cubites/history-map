- id: garhwal-himalaya-1358
  year: 1358
  endYear: 1391
  title:
    ko: "중부 히말라야: 가르왈의 통일과 카사 말라 왕국의 해체(1358~1391)"
  summary:
    ko: "야무나강과 갠지스강 상류의 산악 지대인 가르왈에서는 52개의 작은 성채(가르)가 저마다 영주에게 속해 있었다. 전승에 따르면 아자이 팔이 이들을 하나로 묶어 1358년 무렵 가르왈 왕국을 세웠다. 이 연대는 어림이고 왕가의 계보도 후대 기록에 의존한다. 도읍은 처음 찬드푸르 가르히에 있다가 훗날 스리나가르로 옮겨졌다. 동쪽 쿠마온에서는 찬드 왕가가 점차 힘을 키워 14세기 후반 이 산악 지대의 중심 세력이 됐다. 더 동쪽 지금의 서부 네팔 카르날리강 상류에서는 카사 말라 왕국이 13~14세기 한때 쿠마온과 서부 티베트까지 영향을 미쳤다. 이 왕국은 14세기 후반부터 지방 영주들이 갈라지며 해체됐고 1391년 무렵이 끝으로 여겨진다. 세 산악 정치체는 평원의 델리 술탄국과 직접 부딪히기보다 순례길과 소금·양모 교역로를 통해 이어졌다. 이 산악 왕국들은 평원의 정복자들이 닿기 어려운 지형 덕분에 오래 독립을 유지했다. 가르왈의 왕들은 바드리나트 신전의 보호자로 자처했고, 순례길 덕분에 평원과 이어졌다. 쿠마온에서는 카티유리 왕조가 힘을 잃은 뒤 여러 소국으로 갈라졌고, 찬드 왕가가 참파와트를 도읍으로 점차 통일해 갔다. 이 산악 정치체들은 소금·양모 교역과 티베트로 통하는 마나·니티 고개, 바드리나트·케다르나트·강고트리·야무노트리 순례에 기대어 살았다. 이 시기의 실상은 비문과 구전에 주로 의존한다. 가르왈 왕들은 이후 스리나가르를 도읍 삼아 1803년 구르카에 무너질 때까지 이어졌다. 이 산악 사회는 평원의 이슬람 정권과 달리 힌두 사원 중심의 왕권 이념을 유지했다. 쿠마온의 찬드 왕가는 18세기 후반 구르카의 침공 때까지 이어졌다."
  subjects: [garhwal-kingdom, kumaon-kingdom, khasa-malla-kingdom, delhi-sultanate]
  tags: [politics]
  sources: ["E. T. Atkinson, The Himalayan Districts of the North-Western Provinces of India (North-Western Provinces and Oudh Government Press, 1882–1886)", "R. C. Majumdar (ed.), The Delhi Sultanate (Bharatiya Vidya Bhavan, 1960)"]

- id: jaunpur-sharqi-1394
  year: 1394
  endYear: 1494
  title:
    ko: "자운푸르 술탄국: 샤르키 왕조의 성립과 로디 왕조의 병합(1394~1494)"
  summary:
    ko: "피루즈 사후 델리 정권이 쪼개지는 가운데 술탄 마흐무드 샤 투글루크의 재상 말리크 사르와르 '하와자 이 자한'이 1394년 동쪽 총독으로 파견돼 자운푸르를 중심으로 독립했다. 그는 '동방의 군주(말리크 우스 샤르크)'라는 칭호를 썼고, 이 때문에 왕조를 샤르키(동쪽) 왕조라 부른다. 양자 무바라크 샤(재위 1399~1402)를 거쳐 이브라힘 샤(재위 1402~1440) 때 전성기를 맞았다. 이브라힘은 델리의 말루 이크발과 맞서고 벵골·칼피·괄리오르와 다퉜으며 1414년 무렵 비하르와 미틸라를 둘러싸고 벵골과 부딪쳤다. 그는 학자와 수피를 후원했고 이 도시를 '인도의 시라즈'라 부르게 했다. 건축에서는 이브라힘 때 완공된 아탈라 마스지드(1408)와 후세인 샤 때 지은 자미 마스지드(1470)처럼 힌두 사원 양식과 이슬람 건축이 섞인 양식이 두드러진다. 마흐무드 샤(재위 1440~1457)와 무함마드 샤(1457~1458)를 거쳐 마지막 술탄 후세인 샤(재위 1458~)는 델리의 로디와 거듭 부딪쳤고 델리를 차지하려다 실패했다. 바흘룰 로디가 1479년 무렵 자운푸르를 처음 점령해 1486년 아들 바르박을 앉혔고, 후세인 샤는 1494년 시칸다르 로디에게 마지막으로 패해 비하르의 칼가온으로 달아났다. 후세인 샤가 되찾으려는 시도는 1494년까지 이어졌다. 이 왕조의 뒤를 이어 이 지역은 로디 왕조의 총독 아래 들어갔다. 샤르키 왕조는 갠지스 평원 동부의 곡창 지대를 기반으로 큰 군대를 유지했고, 이브라힘 샤 때 지은 모스크들은 거대한 정문 아치로 알려진 독특한 양식을 이루었다. 자운푸르 건축은 옛 힌두·자이나 사원의 석재를 다시 쓰면서 지방 건축가의 기술을 받아들인 것으로 해석된다. 이 도시는 학문과 음악의 중심으로도 유명했다. 샤르키 궁정은 학자와 수피 성자의 후원자였다."
  subjects: [jaunpur-sultanate, delhi-sultanate, bengal-sultanate]
  links:
    - { from: delhi-sultanate, to: jaunpur-sultanate, note: "바흘룰 로디가 자운푸르를 병합함 (1479 무렵)" }
  tags: [politics, war, culture]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)"]

- id: timur-sack-regional-sultanates-1394
  year: 1394
  endYear: 1407
  title:
    ko: "티무르의 델리 약탈과 지방 술탄국의 독립(1394~1407)"
  summary:
    ko: "1388년 피루즈 샤가 죽은 뒤 델리의 술탄들은 지방 총독과 귀족을 통제하지 못했다. 이 틈에 1391년 구자라트에 부임한 자파르 칸이 구자라트의 항구와 상업 도시를 거점으로 힘을 키웠고, 1394년 동쪽에 자운푸르가 독립했다. 1398년 9월 티무르가 인더스강을 건너 물탄, 바트니르를 거쳐 12월 델리에 이르렀다. 티무르는 델리 성문 앞에서 마흐무드 샤 투글루크와 재상 말루 이크발의 군대를 꺾고 도성을 며칠 동안(자료에 따라 닷새에서 여드레) 약탈했다(원정은 「티무르의 이라크·시리아 원정과 죽음(1393~1405)」, 앞의 사건). 티무르 쪽 기록은 델리에 이르기 전 포로 십만 명을 죽였다고 적었으나 숫자는 과장일 수 있다. 장인들은 사마르칸트로 끌려갔다. 티무르는 1399년 초 인도를 떠나며 펀자브의 물탄·딜팔푸르를 맡은 키지르 칸을 대리인으로 남겼다. 이 약탈 뒤 남은 델리 술탄국은 델리 둘레의 작은 영토만 직접 다스렸고, 지방에서는 독립 국가가 일어났다. 구자라트의 자파르 칸은 1398년부터 사실상 홀로 다스렸고 1407년 무자파르 샤 1세로 공식 즉위했으며, 그의 손자 아마드 샤 1세는 1411년 아마다바드를 세웠다. 말와에서는 총독 딜라와르 칸 구리가 1401년 독립을 굳혔고 아들 호샹 샤(재위 1406~1435)는 도읍을 만두로 옮겼다. 칸데시도 이미 독립했다. 델리는 투글루크의 마지막 술탄 마흐무드(1394~1413)를 거쳐 1414년 사이이드 왕조로 넘어간다. 티무르가 델리에서 데려간 석공들은 사마르칸트의 모스크 건축에 쓰였다고 전한다. 지방 술탄국들은 이후 각각 독자적인 건축 양식을 발전시킨다. 이 약탈로 델리의 인구와 상업이 크게 줄었다고 전한다. 이 일은 인도 쪽 기록에서 오래 재앙으로 기억됐다."
  subjects: [delhi-sultanate, gujarat-sultanate, malwa-sultanate, khandesh-sultanate]
  tags: [war, politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Abraham Eraly, The Age of Wrath: A History of the Delhi Sultanate (Penguin Viking, 2014)"]

- id: tripura-manikya-1400
  year: 1400
  endYear: 1464
  title:
    ko: "트리푸라 왕국과 마니키아 왕조의 시작(1400 무렵~1464)"
  summary:
    ko: "벵골 동쪽 언덕과 평야에 자리한 트리푸라 왕국은 달의 혈통을 자처하는 왕가가 이어졌다. 왕실 연대기 『라자말라』는 15세기에 벵골어 운문으로 쓰여 왕들의 계보를 전하는데, 1400년 무렵 이후 마하 마니키아와 다르마 마니키아 같은 왕의 이야기가 좀 더 구체적으로 나온다. 『라자말라』는 1464년 라트나 파가 벵골 술탄 루큰 웃딘 바르바크 샤의 도움을 받아 왕위에 올라 '마니키아(보석)' 칭호를 처음 받았다고 적지만, 화폐로는 이미 마하 마니키아(재위 1400년 무렵~1431) 때 칭호가 보여 연대기의 초기 연대는 그대로 믿기 어렵다. 트리푸라는 서쪽 평야에서 벵골 술탄국과 치타공 일대를 두고 다퉜고, 언덕 지대는 독립을 유지했다. 이 왕가는 1947년 인도에 가입하고 1949년 병합 협정으로 통치가 끝날 때까지 이어지지만 15세기 이전의 연대는 연대기의 전승에 의존한다. 다냐 마니키아(재위 1490~1515)는 치타공을 차지했다고 전하고, 1501년 오늘날 우다이푸르(트리푸라)에 트리푸라순다리 사원을 세웠다. 트리푸라의 지배층은 한 세기 동안 벵골어와 산스크리트를 궁정 언어로 썼고, 산악 주민의 언어는 코크보로크였다. 트리푸라의 왕은 힌두 신앙을 따르면서도 산악 주민의 신앙을 함께 받아들였고, 15세기 이전 계보에는 건국 신화가 섞여 있다. 벵골 술탄국은 14세기 일리야스 샤 왕조 때부터 트리푸라 서쪽 평원에 진출해 코밀라·노아칼리 일대를 두고 트리푸라와 다퉜고, 벵골이 치타공을 쥐면 트리푸라는 바다로 나가는 길이 막혔다. 근대 연구자들은 트리푸라 연대기의 계보를 15세기 이후부터 비교적 믿을 만하다고 본다. 트리푸라의 군은 보병과 코끼리, 산악 전투에 능한 궁수에 의존했다고 한다. 왕조의 신앙 중심은 트리푸라 여신과 14신(차다 데바타)의 숭배였다고 전한다."
  subjects: [tripura, bengal-sultanate]
  tags: [politics]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "J. Long, 'Analysis of the Bengali Poem Ráj Málá, or Chronicles of Tripurá', Journal of the Asiatic Society of Bengal 19 (1850)"]

- id: kotte-kingdom-1412
  year: 1412
  endYear: 1521
  title:
    ko: "감폴라에서 코테로: 스리랑카의 도읍 이동과 섬의 분열(1412~1521)"
  summary:
    ko: "13세기 담바데니야에서 야파후와와 쿠루네갈라로 옮겨 다니던 싱할라 왕권은 14세기 중엽 감폴라에 자리 잡았다. 그 무렵 라이가마의 대신 알라케슈와라(알라가코나라)가 해안 코테에 요새를 쌓고 권력을 쥐었다. 1411년 명의 정화 함대가 알라케슈와라를 사로잡아 난징으로 데려갔다(「정화의 항해(1405~1433)」, 앞의 사건). 1412년 파라크라마바후 6세(재위 1412~1467)가 코테를 도읍으로 삼아 즉위했고, 섬 대부분을 통합했다. 이 도읍 이동으로 싱할라 왕조는 폴론나루와의 건조 지대를 벗어나 해안 무역 도시를 근거로 삼게 됐다. 1450년 무렵 파라크라마바후 6세가 양아들 사푸말 쿠마라야를 보내 자프나 왕국을 정복해 북부까지 닿았다. 1469년에는 산지의 칸디가 독립해 갈라졌다. 1505년 포르투갈 함대가 폭풍으로 갈레에 닿았고 코테의 왕(파라크라마바후 8세로 보는 설이 있다)과 계피 공납 조약이 맺어졌다. 파라크라마바후 6세가 죽은 1467년 뒤 코테 왕위는 여러 왕을 거쳤고 그 순서와 연대는 자료마다 갈린다. 비자야바후 7세(재위 1509~1521)가 아들들에게 살해된 1521년 '비자야바 콜라야' 뒤 코테 왕국은 코테의 부와네카바후 7세, 시타와카의 마야둔네, 라이가마의 파라라자싱헤 셋으로 쪼개졌다. 시타와카가 이후 포르투갈에 맞서 가장 강한 힘을 얻는다. 갈레에는 1409년 정화가 세운 한문·타밀어·페르시아어 3개 국어 비석이 남아 있다. 파라크라마바후 6세는 불교와 싱할라 문학을 후원해 코킬라 산데샤 같은 운문이 나왔다. 코테 왕국은 계피와 코끼리, 보석을 수출했고 아랍 무슬림 상인과 남인도 상인이 항구에 드나들었다. 자프나 정복 뒤에도 북부는 1467년 이후 다시 아랴차크라바르티 왕가의 영향권으로 돌아갔다. 코테는 콜롬보에서 멀지 않은 내륙 호수 곁에 자리 잡아 계피 산지와 항구를 함께 지배할 수 있었다."
  subjects: [sinhalese-kingdom, kotte-kingdom, sitawaka-kingdom]
  tags: [politics]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Sinnappah Arasaratnam, Ceylon (Prentice-Hall, 1964)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Longman, 1993)"]

- id: sayyid-dynasty-1414
  year: 1414
  endYear: 1451
  title:
    ko: "사이이드 왕조: 델리 술탄국의 축소(1414~1451)"
  summary:
    ko: "티무르가 떠난 뒤 델리는 투글루크 왕조의 마지막 술탄 마흐무드와 귀족 다울라트 칸 로디가 이어받았다. 1414년 티무르가 물탄과 딜팔푸르 총독으로 앉힌 키지르 칸이 델리를 차지하고 사이이드 왕조를 열었다. 그는 예언자의 후손(사이이드)이라 자처했고, 술탄 칭호는 쓰지 않은 채 티무르의 아들 샤 루흐의 가신으로서 공납을 보냈다. 재위는 키지르 칸(1414~1421), 무바라크 샤(1421~1434), 무함마드 샤(1434~1440년대 중반), 알람 샤(1440년대 중반~1451)로 이어졌다. 영토는 델리 일대와 도아브 일부, 시르힌드 이남으로 한정됐다. 1440년대에는 말와의 마흐무드 할지가 델리까지 위협했고, 시르힌드의 바흘룰 로디가 이를 막아 힘을 키웠다. 1445년 무렵 물탄에서는 현지 귀족들이 샤이크 유수프를 술탄으로 세워 물탄 술탄국(랑가 왕조)이 델리에서 떨어져 나갔다. 자운푸르와도 변경 다툼이 이어졌다. 알람 샤는 정치에 뜻이 없어 바다운으로 물러났고, 1451년 바흘룰 로디가 델리를 차지했다. 이 왕조의 동시대 기록은 야히야 시르힌디의 『타리크 이 무바라크 샤히』(1434) 한 권이 거의 유일하다. 델리 로디 정원에 무바라크 샤와 무함마드 샤의 팔각형 묘가 남아 있다. 키지르 칸은 해마다 메와트와 카테르, 에타와의 반란을 토벌해야 했고, 무바라크 샤(재위 1421~1434)는 1434년 궁정 귀족들에게 암살당했다. 델리 술탄의 재정은 델리 둘레의 지세에 의존했고, 지방 총독의 이크타가 사실상 세습되며 중앙의 통제는 약해졌다. 키지르 칸의 가계가 정말 예언자의 후손인지는 확인되지 않아, 이 왕조의 정통성은 처음부터 논란이었다."
  subjects: [delhi-sultanate, multan-sultanate, malwa-sultanate, jaunpur-sultanate]
  tags: [politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)", "Yahya bin Ahmad Sirhindi, Tarikh-i Mubarak Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 4 (Trübner, 1872)"]

- id: bengal-ganesha-1414
  year: 1414
  endYear: 1459
  title:
    ko: "가네샤 왕조와 일리야스 샤 왕조의 복귀: 15세기 벵골(1414~1459)"
  summary:
    ko: "벵골 술탄 기야스 웃딘 아잠 샤(재위 1390~1411)는 명과 사절을 주고받았고 페르시아 시인 하피즈와 편지를 나눴다는 일화로도 이름을 남겼다. 그가 죽은 뒤 아들 함자 샤와 바야지드 샤 등이 차례로 올랐으나 실권은 힌두 지주 가네샤(다누자마르다나 데바)가 쥐었고, 1414년 무렵에는 그가 권력을 굳혔다. 이슬람 성자 누르 쿠트브 알람이 자운푸르의 이브라힘 샤르키에게 도움을 청하자 이브라힘이 1415년 벵골로 쳐들어오자 가네샤는 물러나고 아들 자두가 이슬람으로 개종해 잘랄 웃딘 무함마드 샤로 즉위했다(가네샤가 1416년 무렵 잠시 다시 권좌에 올랐다는 설도 있다). 가네샤 가문의 지배는 1435년 무렵까지 이어졌다가(자두는 1433년 죽었고 아들 아흐마드 샤가 1435년 무렵 살해되었다) 일리야스 샤 왕조가 복귀했다. 벵골 술탄은 명에 기린을 보내기도 했다(「정화의 항해(1405~1433)」, 앞의 사건). 나시르 웃딘 마흐무드 샤 1세(재위 1435~1459) 때는 장군 칸 자한 알리가 남서 벵골의 숲을 개척해 바게르하트를 건설하고 육십 돔 모스크 같은 건축을 남겼다. 루큰 웃딘 바르바크 샤(재위 1459~1474)는 아비시니아 노예 병사를 대거 궁정 호위대로 들였고, 이 집단이 훗날 1487~1493년 왕위를 차지했다. 1415년 무렵부터 벵골 술탄국의 영토는 미틸라를 포함해 북비하르 쪽으로 넓어졌다. 15세기 벵골에서는 크리티바스가 벵골어 『라마야나』를 짓고, 마라다르 바수가 바르바크 샤의 후원으로 『스리크리슈나 비자야』를 썼다. 아라칸 왕 나라메이클라는 1430년 벵골 술탄의 군대를 빌려 복위해 한동안 벵골의 종주권을 받아들였다고 전한다. 15세기 벵골은 술탄이 아비시니아 군인과 지방 호족의 균형 위에서 다스린 나라였고, 이 균형은 1494년 알라웃딘 후세인 샤의 즉위로 안정을 찾는다."
  subjects: [bengal-sultanate, jaunpur-sultanate]
  tags: [politics, culture]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)"]

- id: mewar-kumbha-sanga-1433
  year: 1433
  endYear: 1528
  title:
    ko: "메와르의 라나 쿰바와 상가(1433~1528)"
  summary:
    ko: "라자스탄 남부의 메와르는 델리와 말와, 구자라트 술탄국 사이에서 라지푸트의 중심으로 성장했다. 라나 쿰바(쿰바카르나, 재위 1433~1468)는 1437년 사랑푸르 근처에서 말와의 마흐무드 할지를 꺾어 포로로 잡았다고 전해지며, 그 승리를 기념해 치토르에 비자이 스탐바(승리탑)를 세웠다. 쿰바는 쿰발가르 요새를 비롯해 전승에 따르면 요새 서른두 곳을 쌓거나 고쳤고, 음악 이론서 『상기타라자』를 쓴 학자 군주로도 알려졌다. 그는 1468년 아들 우다이 싱에게 암살당했다. 상가(상그람 싱, 재위 1508 무렵~1528) 때 메와르는 가장 강했다. 그는 1517년 하톨리에서 이브라힘 로디를 꺾었고, 1519년에는 가가론에서 말와의 마흐무드 2세를 사로잡았으며, 구자라트의 무자파르 샤 2세와도 이다르의 계승 문제로 맞섰다. 상가는 여러 라지푸트 군주를 모아 델리와 아그라를 노렸다. 1527년 바부르와 맞붙은 칸와 전투에서 패했고(「제1차 파니파트 전투와 바부르의 무굴 제국(1526~1530)」, 뒤의 사건), 이듬해 죽었다. 이 일로 델리를 놓고 다투던 라지푸트와 아프간의 시대가 끝났다. 쿰바의 승리탑과 요새는 지금도 치토르가르와 쿰발가르에 남아 있다. 쿰바 때 자이나 상인 다르나 샤가 라나크푸르 자이나 사원(1437년 착공)을 지었다. 메와르의 시소디아 가문은 이후 델리 술탄과 무굴 황제에게 가장 오래 맞선 라지푸트 가문으로 기억된다. 쿰바의 승리탑은 높이 37미터가량으로 힌두 신상과 비문으로 덮여 있다. 메와르 전승에서 상가는 몸에 여든 군데가 넘는 상처를 입고도 전장을 지켰다고 전한다. 쿰바 사후 메와르는 아들들의 계승 다툼으로 한동안 흔들렸다."
  subjects: [mewar-state, malwa-sultanate, gujarat-sultanate, delhi-sultanate]
  tags: [war, politics]
  sources: ["Rima Hooja, A History of Rajasthan (Rupa, 2006)", "Har Bilas Sarda, Maharana Kumbha: Sovereign, Soldier, Scholar (Scottish Mission Industries, 1917)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)"]

- id: kapilendra-gajapati-1434
  year: 1434
  endYear: 1470
  title:
    ko: "카필렌드라와 가자파티 왕국의 성립(1434~1470)"
  summary:
    ko: "오리사 해안을 지배하던 동부 강가 왕조는 1434년 마지막 왕 바누데바 4세가 죽으며 끝났다. 신하이던 카필렌드라(재위 1434~1467)가 권력을 잡고 새 왕조를 열었다. 그는 '코끼리의 주인(가자파티)'이라는 칭호를 썼기 때문에 이 왕조를 가자파티라 부른다. 카필렌드라는 남쪽으로 진출해 15세기 중엽까지 비자야나가라의 데바 라야 2세(재위 1424~1446)와 그 뒤를 이은 말리카르주나 라야와 싸웠고, 레디 왕국의 해안 땅을 차지해 크리슈나강 이남의 우다야기리와 콘다비두까지 세력을 넓혔다. 레디 왕국이 끝난 때는 1446년 무렵이라는 설부터 1450년대 초라는 설까지 연구자마다 갈린다. 북쪽으로는 벵골과 바흐마니의 변경과 다퉜다. 카필렌드라 사후 아들 푸루쇼타마(재위 1467~1497)가 이어받았으나 1470년 무렵 우다야기리를 비자야나가라의 살루바 나라심하에게 잃어 판도가 줄었다. 가자파티 왕들은 푸리의 자간나타 사원을 후원하며 스스로를 신의 대리인으로 자처했고, 그 신앙이 오리사 정치 체제의 정당성이 됐다. 이 왕조(수르야밤샤 가자파티)는 푸루쇼타마와 프라타파루드라(재위 1497~1540)를 거쳐 1541년 끝나고 보이 왕조가 이었으며, 1568년 보이 왕조의 마지막 왕 무쿤다 데바가 죽으면서 오리사는 벵골의 카라니 아프간 세력에게 넘어간다. 카필렌드라 때 사랄라 다스가 오리야어 『마하바라타』를 썼고, 가자파티 왕이 자간나타 수레의 길을 직접 쓰는 의례(체라 파한라)가 굳어졌다. 가자파티의 판도는 15세기 중엽 오리사 해안에서 남쪽 콘다비두까지 이어진 해안 지대였다. 카필렌드라는 벵골의 술탄과도 부딪혔고, 오리야어가 궁정 문학의 언어로 자리 잡아 갔다. 이 시기 오리사에서는 푸리의 자간나타 사원을 중심으로 한 종교 정치가 굳어진다. 가자파티라는 칭호는 이후 오리사 왕들이 두루 썼다."
  subjects: [eastern-ganga-dynasty, gajapati-kingdom, reddi-kingdom, vijayanagara-empire]
  links:
    - { from: gajapati-kingdom, to: reddi-kingdom, note: "레디 왕국의 해안 땅을 차지함 (1446 무렵~1450년대)" }
  tags: [politics, war]
  sources: ["Burton Stein, Vijayanagara (The New Cambridge History of India I.2, Cambridge University Press, 1989)", "Cynthia Talbot, Precolonial India in Practice: Society, Region, and Identity in Medieval Andhra (Oxford University Press, 2001)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)"]

- id: bhakti-kabir-1440
  year: 1440
  endYear: 1518
  title:
    ko: "박티 운동과 카비르, 수피 교단(15세기)"
  summary:
    ko: "박티 운동은 남인도 알바르·나야나르 시인들의 신앙에서 비롯해 12~13세기 마하라슈트라의 즈냐네슈와르와 나므데브를 거치며 북인도의 지방어 시와 노래로 퍼졌다. 이 운동은 신 앞에서 신분과 학식이 소용없다고 주장했다. 바라나시의 카비르(생몰은 1440년 무렵~1518년 무렵이라는 설과 14세기 말~15세기 중엽이라는 설이 갈린다)는 이슬람교 직조공 가문에서 자랐고, 라마난다의 제자로 알려진다. 그는 바라나시를 중심으로 힌두교 브라만과 이슬람 울라마의 의례와 문헌 권위를 함께 풍자하며 형상 없는 신에 대한 사랑을 노래했다. 그의 시는 『비자크』와 『구루 그란트 사히브』에 실렸다. 같은 시기 벵골에서는 차이타냐(1486~1534)가 크리슈나 신앙의 박티를 이끌었고, 메와르에서는 왕비 미라바이가 크리슈나를 노래했다. 수피 교단도 델리와 지방 술탄국의 도시에서 힌두 신자와 접촉하며 지방어 시와 음악을 발전시켰고, 이 흐름에서 구루 나나크 같은 이가 나왔다. 이 신앙 운동은 델리 술탄국의 로디 왕조와 벵골 술탄국의 후세인 샤 시대에도 이어졌다. 라비다스(구두장이 가문) 같은 낮은 신분 출신 시인도 나왔고, 카비르와 라비다스, 나나크의 시 일부는 같은 문헌에 함께 실렸다. 델리에서는 치슈티 교단의 수피 성자 니자무딘 아울리아와 시인 아미르 쿠스라우의 전통이 이어졌다. 박티 시인들의 노래는 장터와 순례길을 따라 구전됐고 필사본으로 정리된 것은 대개 사후였다. 그래서 카비르의 생몰이나 시의 진위를 두고도 연구자들의 의견이 갈린다. 이 운동은 델리 술탄국의 정치 구도를 바꾸지 않았지만 평민 사회의 신앙과 지방어 문학을 키웠다. 박티 시인들의 평등 주장은 현실의 신분 제도를 곧바로 바꾸지는 못했다."
  subjects: [delhi-sultanate, bengal-sultanate, mewar-state]
  tags: [religion, culture]
  sources: ["Charlotte Vaudeville, Kabir, vol. 1 (Clarendon Press, 1974)", "Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "J. S. Grewal, The Sikhs of the Punjab (The New Cambridge History of India II.3, Cambridge University Press, 1990)"]

- id: lodi-dynasty-1451
  year: 1451
  endYear: 1489
  title:
    ko: "바흘룰 로디와 로디 왕조의 성립(1451~1489)"
  summary:
    ko: "로디 가문은 아프간 부족으로, 델리 술탄국의 다섯 번째이자 마지막 왕조를 세웠다. 시르힌드 총독이던 바흘룰 로디는 사이이드 왕조 마지막 술탄 알람 샤가 델리에서 물러난 1451년 4월 델리 술탄에 올랐다. 그는 아프간 귀족들을 동료로 대우해 옥좌에 앉지 않고 함께 앉았다고 전하며, 부족 연합의 성격이 짙은 이 정권의 구조가 이후 로디 왕조의 특징이자 약점이 됐다. 바흘룰의 가장 큰 과제는 동쪽의 자운푸르였다. 1450년대부터 샤르키 왕조와 거듭 싸운 끝에 1479년 무렵 자운푸르를 병합했다. 그는 괄리오르와 에타와의 토착 군주들에게 공납을 받았고, 자운푸르에는 아들 바르박을 총독으로 앉혔다. 자신이 만든 '바흘롤리' 은화는 이후 오랜 기간 통용됐다. 그는 1489년 죽으면서 땅을 아들들에게 나눠 주었는데, 이 관습은 후계 다툼의 불씨가 됐다. 로디 정권의 영토는 투글루크 왕조의 전성기보다 훨씬 작았으나, 갠지스 평원 중부에서 펀자브까지 이어지는 땅을 다시 하나로 묶었다. 바흘룰은 아프간 고지대 로에서 부족민을 불러들여 군대의 중심으로 삼았다. 델리 치라그 델리 근처에 그의 묘가 남아 있다. 바흘룰은 아프간 부족 지도자들을 군대의 중심으로 삼고 지방 총독직을 같은 부족에게 맡겼다. 이 방식은 군사력을 키웠으나 술탄의 권력이 부족 지도자들의 동의에 기대게 했다. 그는 괄리오르와 에타와의 힌두 영주들을 완전히 누르지 못해 공납으로 만족했다. 그의 시대 델리와 북인도는 비교적 안정을 되찾았다. 그가 아들 가운데 시칸다르(니잠 칸)를 후계자로 정한 일은 형제 사이 반목의 불씨가 됐다(「시칸다르 로디와 아그라의 건설(1489~1517)」, 뒤의 사건)."
  subjects: [delhi-sultanate, jaunpur-sultanate]
  tags: [politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)"]

- id: rajput-states-1459
  year: 1459
  endYear: 1503
  title:
    ko: "조드푸르·비카네르·암베르의 성립(1459~1503)"
  summary:
    ko: "15세기 후반 라자스탄에서는 라지푸트 가문의 새 근거지가 잇따라 생겼다. 마르와르의 라토르 가문은 라오 조다가 1459년 만도르에서 남쪽 언덕으로 도읍을 옮겨 조드푸르를 세우고 메헤랑가르 요새를 쌓았다. 이 나라는 타르 사막 동쪽의 조드푸르·팔리·나고르 일대를 다스리며 훗날 조드푸르 주가 된다. 조다의 아들 비카는 1465년 무렵 아버지 곁을 떠나 북서쪽 사막 지대로 가서 라토르의 새 영토를 개척했다. 전승에 따르면 비카네르 도성과 요새는 1488년에 세워졌고, 이 나라는 사막 목축민과 낙타 교역에 기대었다. 동쪽 둔다르 지방의 암베르(아메르)를 다스리던 카치와하 가문은 프리트비라지 싱(재위 1503~1527) 때 메와르의 상가를 따랐다고 전하며, 훗날 자이푸르 주로 이어진다. 자이푸르 도성은 1727년 사와이 자이 싱 2세가 세워 이름이 바뀐다. 세 나라는 메와르의 라나 쿰바·상가와 델리·구자라트 술탄국 사이에서 서로 협력하고 다투며 자리를 잡았다. 조다는 1450년대에 만도르를 되찾은 뒤 메와르와 혼인 동맹으로 경계를 정했다고 전한다. 비카네르의 데슈노크에는 카르니 마타 사원이 있으며 비카는 이 여신의 축복으로 나라를 세웠다는 전승이 있다. 암베르의 카치와하 왕가는 열두 아들에게 영지를 나눠 준 '바라 코트리' 제도로 알려졌다. 라토르 가문은 중세 연대기에서 카나우지 왕가의 후손을 자처했고, 조드푸르와 비카네르는 이후 오랫동안 같은 가문의 두 갈래로 이어졌다. 라지푸트 연대기는 이 가문들의 건국을 영웅담으로 서술하므로, 15세기의 실제 모습은 비문과 후대 전승을 견주어야 드러난다. 조드푸르와 비카네르는 사막 교역로의 낙타 상인과 소금 거래에서 재정을 얻었다."
  subjects: [jodhpur-state, bikaner-state, jaipur-state, mewar-state]
  tags: [politics]
  sources: ["Rima Hooja, A History of Rajasthan (Rupa, 2006)", "James Tod, Annals and Antiquities of Rajast'han (Smith, Elder & Co., 1829–1832)"]

- id: mahmud-gawan-1463
  year: 1463
  endYear: 1482
  title:
    ko: "마흐무드 가완의 개혁과 데칸의 파벌 다툼(1463~1482)"
  summary:
    ko: "마흐무드 가완은 이란 길란 출신 상인이자 학자로, 1453년 바흐마니 술탄국에 와서 재능을 인정받아 1463년 무함마드 샤 3세(재위 1463~1482)의 재상이 됐다. 그는 바흐마니의 정치와 영토를 크게 정비했다. 1469~1472년 서쪽 콘칸 해안과 고아, 다볼, 벨가움을 비자야나가라에게서 빼앗아 아라비아해로 나가는 항구를 얻었고, 북쪽으로 칸데시와 오리사의 가자파티 왕국 쪽 원정도 벌였다. 행정에서는 나라를 네 지방에서 여덟 지방으로 늘리고 총독의 힘을 줄이며 토지를 측량해 세금을 거뒀다. 1472년 비다르에 이슬람 학교 마드라사 마흐무드 가완을 세워 학자를 모았다. 그러나 이란과 아랍 출신 외래 귀족(아파키)과 데칸 토박이 귀족(데칸니) 사이의 갈등이 깊었고, 데칸 쪽 귀족은 위조 편지로 가완이 반역했다고 술탄에게 일러 1481년 그를 처형하게 했다. 70대 노인이었다. 가완이 죽자 지방 총독이 중앙의 통제에서 벗어나기 시작했다. 가완은 페르시아어 서한집 『리야즈 울 인샤』를 남겼고, 그가 세운 마드라사는 삼천 권쯤 되는 장서를 갖췄다고 전한다. 가완이 죽은 뒤 어린 술탄 마흐무드 샤(재위 1482~1518)는 귀족 파벌의 꼭두각시가 됐다(「바흐마니 술탄국의 해체와 데칸 술탄국들(1490~1527)」, 뒤의 사건). 그는 바흐마니 후기의 개혁가로 평가되지만, 외래 귀족 중심 정책이 갈등을 키웠다는 비판도 있다. 가완은 술탄이 어릴 때 섭정 위원회에서 재상으로 실권을 쥐었고, 이 지위가 그를 귀족들의 표적으로 만들었다. 그의 개혁에 대한 우리의 이해는 서한집과 후대 연대기에 의존한다. 가완이 정비한 지방 제도의 영향은 그 뒤 술탄국들의 행정에도 남았다."
  subjects: [bahmani-sultanate, vijayanagara-empire, khandesh-sultanate, gajapati-kingdom]
  tags: [politics, war]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Haroon Khan Sherwani, Mahmud Gawan: The Great Bahmani Wazir (Kitabistan, 1942)", "Haroon Khan Sherwani, The Bahmanis of the Deccan (Munshiram Manoharlal, 1985)"]

- id: guru-nanak-1469
  year: 1469
  endYear: 1539
  title:
    ko: "구루 나나크와 시크교의 시작(1469~1539)"
  summary:
    ko: "나나크는 1469년 펀자브의 탈완디(지금 파키스탄 난카나 사히브)에서 힌두 카트리 가문에 태어났다. 젊어서는 술탄푸르에서 델리 술탄국 로디 왕조의 펀자브 총독 다울라트 칸 로디 밑에서 곡식 창고를 맡았다. 시크교 전승에 따르면 그는 1499년 무렵 강에서 신의 부름을 받고 '힌두도 무슬림도 없다'고 선언했으며, 이후 수십 년 동안 인도 각지와 메카, 바그다드를 다녀왔다고 전해진다. 그의 가르침은 하나의 신(이크 옹카르)에 대한 믿음, 신의 이름을 부르는 수행, 정직한 노동, 나눔, 카스트 차별 거부를 핵심으로 한다. 그는 박티 시인들과 수피 전통을 이어받으면서 힌두교와 이슬람의 형식적 의례를 비판했다. 1520~1521년 바부르의 군대가 사이드푸르(지금 에미나바드)를 쳐서 도시를 약탈하자 그는 그 참상을 시로 남겼다. 그는 말년에 카르타르푸르에 정착해 공동체 식당(랑가르)과 함께 모이는 법회(상가트)를 열었다. 1526년 이후 무굴 제국이 펀자브를 얻은 뒤인 1539년 그는 제자 라흐나를 후계자 구루 앙가드로 지명하고 숨졌다. 그의 찬가는 훗날 『구루 그란트 사히브』에 실린다. 나나크의 곁에는 이슬람교도 악사 마르다나가 있었다. 나나크의 생애는 사후에 기록된 전기 '자나므사키'에 크게 의존해 연대에 불확실성이 있다. 그의 뒤를 이은 구루 앙가드(재위 1539~1552)는 구르무키 문자를 정비해 시크교 문헌의 기초를 닦았다고 전한다. 나나크의 가르침을 박티와 수피 전통의 연장으로 볼지 새 종교의 시작으로 볼지에 대해서는 연구자들의 의견이 갈린다. 그의 공동체는 함께 먹는 식사 풍습 덕분에 카스트와 종교가 다른 이들을 모았다. 다만 이 가르침이 일관된 교리 체계로 정리된 것은 이후 구루들의 시대였다."
  subjects: [delhi-sultanate]
  tags: [religion, culture]
  sources: ["W. H. McLeod, Guru Nanak and the Sikh Religion (Clarendon Press, 1968)", "J. S. Grewal, The Sikhs of the Punjab (The New Cambridge History of India II.3, Cambridge University Press, 1990)"]

- id: gond-kingdoms-1470
  year: 1470
  endYear: 1480
  title:
    ko: "곤드 왕국들의 성립: 찬다와 가르하-만들라(1470~1480)"
  summary:
    ko: "중부 인도의 산림 고원에서는 곤드 사람들의 왕국이 15세기 후반에 정치 체제를 갖췄다. 오늘날 마하라슈트라 동쪽 찬드라푸르 일대에서는 칸디야 발랄 샤가 1470년 무렵 찬다 왕국을 세웠다고 전한다. 중부 나르마다 계곡의 자발푸르와 만들라 일대에서는 상그람 샤(재위 1480~1541)가 가르하-만들라 왕국을 이끌며 쉰두 개의 성채(가르)를 아울렀다. 두 왕국의 연대는 곤드 연대기와 후대 기록에 기대 어림이다. 이 지역은 말와, 칸데시, 바흐마니 술탄국과 접한 변경이어서 곤드 왕들은 때로 공납을 바치고 때로 맞서며 독립을 지켰다. 곤드 왕국들은 토착 부족 사회가 힌두교 신분 제도와 라지푸트 계보를 받아들이며 왕권을 갖춰 간 사례로 꼽힌다. '곤드와나(곤드의 땅)'라는 지역 이름이 여기서 나왔다. 자발푸르 근처 가르하에는 곤드 왕들의 성채가 있었다. 곤드 왕국의 재정은 논농사와 소금, 숲 산물(목재·밀랍·약초)과 철 생산에 기댔고, 이 지역은 평원과 데칸 고원을 잇는 교역로였다. 곤드 왕들은 15~16세기에 힌두 브라만을 궁정에 들이고 라지푸트 계보와 혼인을 통해 왕권의 틀을 갖췄다. 말와 술탄국과 델리가 중부 인도에 힘을 뻗칠수록 곤드 왕국들은 산림 고원을 방패로 삼아 독립을 유지했다. 이 지역 연구는 곤드의 구전과 후대 힌두 연대기에 기댄다. 성채망은 군사·징세 단위로 쓰였다고 전한다. 곤드 지배층은 공납을 바치는 대신 말와와 바흐마니 군의 직접 지배를 피했고, 침입이 있을 때는 산림 지대로 물러나 게릴라전을 펼쳤다고 한다. 두 왕국의 땅은 지금의 마디아프라데시와 마하라슈트라 동부에 걸쳐 있었다. 이들의 힘은 16세기 중반 무굴이 다가오면서 시험을 받는다."
  subjects: [chanda-kingdom, garha-mandla-kingdom, malwa-sultanate, khandesh-sultanate, bahmani-sultanate]
  tags: [politics]
  sources: ["Imperial Gazetteer of India (Clarendon Press, 1908–1909)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)"]

- id: sikandar-lodi-1489
  year: 1489
  endYear: 1517
  title:
    ko: "시칸다르 로디와 아그라의 건설(1489~1517)"
  summary:
    ko: "바흘룰이 죽자 아들 니잠 칸이 시칸다르 샤라는 이름으로 즉위했고(재위 1489~1517), 형제들과의 다툼을 이긴 뒤 아프간 귀족들의 힘을 누르며 중앙 통제를 강화했다. 그는 1495~1499년 비하르를 평정하고 벵골의 알라웃딘 후세인 샤와 서로 침공하지 않는다는 조약을 맺어 동쪽 경계를 정했다. 1504년에는 아그라를 새 근거지로 삼아 성채를 쌓고 궁정을 옮겼는데, 이 도시가 훗날 무굴의 도읍이 된다. 괄리오르의 토마라 왕가를 거듭 공격했으나 성을 빼앗지 못했고, 1504년 돌푸르를 차지했다. 그는 땅을 재는 표준 단위 '가즈 이 시칸다리'를 정했고, 의학서 번역과 시 창작을 후원했다. 연대기는 시칸다르가 마투라 같은 힌두 성지의 사원을 부수고 강가에서 힌두교도의 순례 목욕을 막았다고 전한다. 한편 그의 궁정에서 일한 힌두 서기와 상인도 많았다. 1505년 아그라 일대에 큰 지진이 났다. 그는 1517년 죽었고, 아프간 귀족층은 아들 이브라힘을 세웠으나 그의 동생 잘랄 칸이 자운푸르에서 따로 왕을 자처하면서 다시 분열이 시작됐다. 이 무렵 펀자브에서는 구루 나나크가 가르침을 펼치고 있었다. 그의 이름으로 편찬된 1512년에 엮인 페르시아어 의학서는 산스크리트 의학서를 바탕으로 했다고 전한다. 연대기는 브라만 로단이 이슬람과 힌두교가 모두 참이라고 했다가 처형됐다고도 적는다. 그의 시대 아그라는 델리와 함께 두 번째 군사·행정 중심으로 자랐고, 이는 무굴이 아그라를 도읍으로 삼는 바탕이 됐다. 시칸다르는 토지를 측량해 세금을 정비했다. 시칸다르는 '굴루키'라는 필명으로 시를 지었고, 그의 치세에 힌두 서기들도 페르시아어를 익혀 관직에 올랐다."
  subjects: [delhi-sultanate, bengal-sultanate]
  tags: [politics, war]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)"]

- id: bahmani-breakup-1490
  year: 1490
  endYear: 1527
  title:
    ko: "바흐마니 술탄국의 해체와 데칸 술탄국들(1490~1527)"
  summary:
    ko: "마흐무드 가완이 죽은 뒤(「마흐무드 가완의 개혁과 데칸의 파벌 다툼(1463~1482)」, 앞의 사건) 바흐마니 술탄 마흐무드 샤(재위 1482~1518)는 궁정 파벌의 꼭두각시가 되어 갔고, 지방 총독들은 하나씩 독립했다. 1490년 비자푸르의 유수프 아딜 칸이 독립을 선언해 아딜 샤히 왕조를 열었다. 같은 해 준나르의 아마드 니잠 샤가 니잠 샤히 왕조를 세워 1494년 아마드나가르를 도읍으로 삼았고, 베라르의 파트 알라 임마드 알물크가 임마드 샤히 왕조를 세웠다. 비다르에서는 재상 카심 바리드가 실권을 쥐고 1492년 무렵 바리드 샤히 왕조를 열었다. 텔랑가나 총독 술탄 쿨리 쿠트브 알물크는 1518년 골콘다에서 쿠트브 샤히 왕조를 세웠다. 1527년 마지막 바흐마니 술탄 칼리물라 샤가 아마드나가르로 달아나며 바흐마니 이름이 끊겼다. 다섯 술탄국은 서로 땅을 두고 다퉜고, 비자푸르는 1510년 고아를 포르투갈에게 잃었다(「알부케르케의 고아 점령(1510)」, 뒤의 사건). 1520년에는 비자야나가라의 크리슈나데바 라야가 라이추르 도압을 차지했다(「크리슈나데바 라야와 비자야나가라의 전성기(1509~1529)」, 뒤의 사건). 아딜 샤히는 이란 시아파를 받아들이는 등 종교 정책이 달랐고, 술탄국 궁정에서는 페르시아어와 데칸어(다크니)가 함께 쓰였다. 비다르에서는 바리드 샤히 시대에 금은 상감 공예(비드리)가 발전했고, 골콘다는 훗날 다이아몬드 교역으로 이름을 떨친다. 다섯 술탄국은 서로 혼인과 전쟁을 거듭하다 1565년 베라르를 뺀 네 나라(비자푸르·아마드나가르·골콘다·비다르)가 탈리코타에서 힘을 모아 비자야나가라를 꺾는다(「탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)」, 뒤의 사건). 이 가운데 베라르가 가장 작았다."
  subjects: [bahmani-sultanate, bijapur-sultanate, ahmadnagar-sultanate, berar-sultanate, bidar-sultanate, golconda-sultanate, vijayanagara-empire]
  links:
    - { from: bijapur-sultanate, to: bahmani-sultanate, note: "유수프 아딜 칸이 독립을 선언해 바흐마니에서 떨어져 나옴 (1490)" }
  tags: [politics]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Haroon Khan Sherwani, The Bahmanis of the Deccan (Munshiram Manoharlal, 1985)", "Muhammad Qasim Hindu Shah Firishta, History of the Rise of the Mahomedan Power in India, trans. John Briggs (Longman, Rees, Orme, Brown, and Green, 1829)"]

- id: vasco-da-gama-calicut-1498
  year: 1498
  title:
    ko: "바스쿠 다가마의 캘리컷 도착(1498)"
  summary:
    ko: "포르투갈 왕 마누엘 1세의 명을 받은 바스쿠 다가마의 함대는 1497년 7월 리스본을 떠나 희망봉을 돌아 동아프리카 말린디에서 인도양을 건너는 도선사를 태우고 1498년 5월 20일 인도 서남해안의 캘리컷(지금 코지코드)에 닿았다(유럽 쪽 이야기는 「콜럼버스와 다가마, 신항로 개척」, 앞의 사건). 캘리컷은 말라바르 해안의 후추 수출 중심으로, 아랍·페르시아·구자라트 상인과 현지 무슬림 상인 마필라의 교역항이었다. 자모린(사무티리)은 이들을 맞았지만 포르투갈이 가져온 선물이 보잘것없었고 무슬림 상인들이 이들을 경계했다. 다가마는 8월 말 후추와 계피 일부를 싣고 떠났으며, 이 항해는 유럽에서 인도로 가는 직항로를 처음 연 것으로 평가된다. 1500년 카브랄의 함대는 캘리컷 상관을 세우려다 충돌했고, 1502년 다가마는 더 큰 함대를 이끌고 와 캘리컷을 포격했다. 구자라트와 홍해를 잇는 이슬람 상인의 향신료 교역망에 포르투갈이 무력으로 끼어들면서 인도양 교역의 질서가 바뀌기 시작한다. 다가마의 항해를 인도 쪽에서 보면 낯선 땅의 발견이 아니라 이미 활발한 인도양 교역망에 새 세력이 끼어든 일이라는 지적이 있다. 1502년 다가마는 메카에서 돌아오던 배 미리호를 불태워 승객 수백 명을 죽였다고 포르투갈 쪽 기록도 전한다. 이 항해 이전에도 인도양에는 아랍·페르시아·구자라트·중국 상인이 오가는 교역망이 있었고(정화의 함대도 15세기 초 캘리컷에 닿았다, 「정화의 항해(1405~1433)」, 앞의 사건), 캘리컷은 그 중심 항구의 하나였다. 자모린 정권은 항구에서 상인에게 거두는 관세에 의존했고, 포르투갈이 해상 통제를 요구하면서 충돌이 커졌다. 이 항해로 유럽은 인도양 향신료에 직접 닿게 됐다."
  subjects: [portugal, gujarat-sultanate]
  tags: [diplomacy, economy]
  sources: ["Sanjay Subrahmanyam, The Career and Legend of Vasco da Gama (Cambridge University Press, 1997)", "M. N. Pearson, The Portuguese in India (The New Cambridge History of India I.1, Cambridge University Press, 1987)"]

- id: diu-naval-battle-1509
  year: 1509
  title:
    ko: "디우 해전과 포르투갈의 인도양 해상권(1509)"
  summary:
    ko: "1505년 인도 총독에 임명된 프란시스쿠 드 알메이다는 해안 요새와 해군력으로 인도양을 통제하는 '푸른 바다 정책'을 폈다. 이에 이집트의 맘루크 술탄국은 홍해와 인도양을 잇는 향신료 교역 수입이 줄어들자 구자라트 술탄국, 캘리컷의 자모린과 손을 잡았다. 1508년 1월 차울 앞바다에서 맘루크·구자라트 연합 함대가 알메이다의 아들 루렌수가 이끄는 포르투갈 함대를 쳐서 루렌수가 숨졌다. 알메이다는 복수를 다짐하고 1509년 2월 3일 구자라트의 디우 앞바다에서 맘루크 제독 후사인 알쿠르디와 구자라트 총독 말리크 아야즈의 연합 함대를 꺾었다. 포르투갈 쪽이 쓴 함포와 큰 배가 승패를 갈랐다. 이 승리로 맘루크는 인도양에서 물러나게 되고 포르투갈이 인도양의 해상권을 쥐었으며, 디우는 이후에도 구자라트가 지켰으나 1535년 포르투갈이 요새를 세운다. 알메이다는 1509년 말 총독 자리를 알부케르케에게 넘겼다. 맘루크는 1517년 오스만에 멸망한다(「오스만의 이집트 주 편성과 메카 샤리프의 복속(1517~1525)」, 뒤의 사건). 말리크 아야즈는 패배 뒤 포르투갈과 화의를 맺고 교역을 이어 갔다. 오스만과 구자라트가 1538년 디우를 포위한 일은 이후 이야기다. 이 승리는 포르투갈이 해군력으로 인도양 교역을 좌우하는 통행증(카르타스) 제도의 바탕이 됐다. 통행증이 없는 배는 나포될 수 있었기 때문에 인도양 상인들은 포르투갈에 통행증을 사야 했다. 포르투갈은 이 승리로 호르무즈와 말라카로 나아갈 길을 닦았다. 구자라트 술탄은 디우의 요새 건설을 거부하다가 1535년에야 조약에 따라 포르투갈에 요새를 허락한다. 디우는 구자라트의 주요 항구였다."
  subjects: [portugal, gujarat-sultanate, mamluk-sultanate]
  links:
    - { from: portugal, to: mamluk-sultanate, note: "디우 해전에서 맘루크·구자라트 연합 함대를 꺾음 (1509)" }
  tags: [war, diplomacy]
  sources: ["M. N. Pearson, The Portuguese in India (The New Cambridge History of India I.1, Cambridge University Press, 1987)", "Sanjay Subrahmanyam, The Portuguese Empire in Asia, 1500–1700: A Political and Economic History (Longman, 1993)"]
  places: [{ name: 디우 해전, at: [70.98, 20.71], year: 1509 }]

- id: krishnadevaraya-vijayanagara-1509
  year: 1509
  endYear: 1529
  title:
    ko: "크리슈나데바 라야와 비자야나가라의 전성기(1509~1529)"
  summary:
    ko: "비자야나가라는 15세기 말 살루바 가문에 이어 툴루바 가문이 권력을 잡는 혼란을 겪었다. 1509년 크리슈나데바 라야(재위 1509~1529)가 즉위하면서 전성기가 열렸다. 그는 먼저 동쪽 오리사의 가자파티 프라타파루드라와 싸워 1514년 우다야기리, 1515년 콘다비두를 빼앗았고(1518년 화의로 가자파티 공주와 혼인했다), 바흐마니 계승 술탄국들과 부딪혔다. 1520년 5월 비자푸르의 이스마일 아딜 샤와 라이추르에서 싸워 라이추르 요새를 차지했다. 포르투갈령 인도(고아)의 알부케르케와 말 수입 동맹을 맺어 바트칼 항구에 요새 건설을 허락했다. 툴루바 시대의 군사·행정에서는 나야카(군사 영주)가 땅을 받고 병력을 바치는 체제가 발전해 훗날 마두라이·탄자부르·진지 나야크 같은 독립 정권의 바탕이 됐다. 1509년 무렵 진지 일대에도 비자야나가라의 나야카가 자리 잡았다고 하나 연대는 학설이 갈린다. 크리슈나데바 라야는 텔루구어 서사시 『아묵타말랴다』를 쓰고, 학자 여덟 명(아슈타디갈라)을 후원했으며, 함피에 하자라 라마 사원과 비탈라 사원을 세웠다. 1520년 무렵 함피를 찾은 도밍구스 파에스는 도시를 '로마만큼 크고 아름답다'고 적었다. 그의 사후 아치유타 라야 때부터 왕권이 약해지다가 1565년 탈리코타 전투에서 크게 꺾인다(「탈리코타 전투와 비자야나가라의 쇠퇴(1565~1649)」, 뒤의 사건). 1530년대 후반에는 페르낭 누니스도 도시를 찾아 연대기를 남겼다. 고아 점령은 「알부케르케의 고아 점령(1510)」(뒤의 사건)이 다룬다. 비자야나가라의 판도는 벵골만에서 아라비아해에 이르렀고, 항구 교역(말과 직물 거래)에서 얻는 세금이 주요 재원이었다. 라이추르 점령은 비자푸르와의 오랜 경계 다툼에서 비자야나가라가 가장 크게 이긴 일이었다."
  subjects: [vijayanagara-empire, gajapati-kingdom, bijapur-sultanate, gingee-nayak, portuguese-india]
  links:
    - { from: vijayanagara-empire, to: gajapati-kingdom, note: "우다야기리와 콘다비두를 빼앗음 (1514~1515)" }
    - { from: vijayanagara-empire, to: bijapur-sultanate, note: "라이추르 도압을 차지함 (1520)" }
  tags: [war, politics, culture]
  sources: ["Burton Stein, Vijayanagara (The New Cambridge History of India I.2, Cambridge University Press, 1989)", "Robert Sewell, A Forgotten Empire (Vijayanagar): A Contribution to the History of India (Swan Sonnenschein, 1900)", "Cynthia Talbot, Precolonial India in Practice: Society, Region, and Identity in Medieval Andhra (Oxford University Press, 2001)"]
