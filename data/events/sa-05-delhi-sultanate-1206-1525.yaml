# 남아시아 사건 5차 묶음(sa-05): 델리 술탄국의 다섯 왕조와 같은 때의 여러 나라 — 쿠트브 웃딘 아이바크에서 이브라힘 로디까지 (1206 ~ 1525년)
# 범위: 델리 술탄국의 성립과 일투트미시·라지야·발반·알라웃딘 할지·말리크 카푸르의 데칸 원정·투글루크 왕조와 무함마드 빈 투글루크·피루즈 샤·티무르의 델리 약탈·사이이드·로디 왕조,
#   비자야나가라와 바흐마니·데칸 술탄국들·마두라이 술탄국·와랑갈 이후의 안드라, 벵골 술탄국과 아삼·트리푸라, 카슈미르 술탄국, 신드의 삼마와 아르군, 자운푸르·구자라트·말와·칸데시 술탄국,
#   메와르와 라지푸트 토후국의 성립, 오리사의 가자파티, 곤드 왕국들, 스리랑카의 마가·코테, 박티 운동과 구루 나나크, 바스쿠 다가마와 디우 해전·고아의 점령.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 여러 나라를 묶고 실제 과정의 기간만 잡았다. 1206년 무렵의 정치 지형은 델리 술탄국과 같은 때 있던 나라들을 한 개관 사건에 모았다.
# 날짜: 모두 그레고리력이다. 연대기마다 해가 갈리는 일과 확실하지 않은 날짜는 '무렵'으로 적었다. 군주 재위는 위키백과 영어판 목록을 따랐다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 델리 술탄국은 다섯 왕조(맘루크·할지·투글루크·사이이드·로디)를 한 나라로 적었다.
#   사원 파괴·개종·지즈야·학살·순장(자우하르) 같은 민감한 일은 어느 쪽 시각도 따르지 않고 일어난 일과 주어, 숫자만 적었고, 숫자나 평가가 갈리면 범위나 두 학설을 함께 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(몽골의 호라즘 정복, 이븐 바투타의 여행, 티무르의 서방 원정, 콜럼버스와 다가마의 신항로, 정화의 항해, 마르코 폴로의 동방 여행, 카이두와 몽골 칸국의 분열).

- id: delhi-sultanate-1206
  year: 1206
  endYear: 1210
  title:
    ko: "쿠트브 웃딘 아이바크와 델리 술탄국의 성립(1206~1210)"
  summary:
    ko: "1206년 3월 구르 왕조의 술탄 무함마드 구리가 인더스강 가에서 암살되자(범인은 이스마일파나 코카르 부족 등으로 기록이 갈린다) 그가 인도에 남긴 노예 출신 장군들이 땅을 나눠 가졌다. 구르 군이 1190년대에 북인도 평원을 차지한 일은 앞 시기의 이야기이고, 이 사건은 그 뒤를 잇는 정권의 출발을 다룬다. 델리와 라호르를 맡던 쿠트브 웃딘 아이바크는 1206년 6월 라호르에서 즉위했고, 1208년 구르의 군주 기야스 웃딘 마흐무드가 노예 신분을 풀어 주는 문서를 보내 그의 지위를 인정했다. 그러나 가즈니의 타지 웃딘 일디즈, 우치와 물탄의 나시르 웃딘 카바차, 벵골의 할지 장군들이 저마다 자립을 노려 아이바크의 땅은 라호르·델리·아지메르·카날 일대에 머물렀다. 카바차는 우치를 근거지로 신드 북부와 물탄을 쥐고 1206년 무렵부터 델리와 따로 움직였다. 아이바크는 총독 시절인 1190년대부터 델리에 '쿠와트 알 이슬람' 사원을 세우고 쿠트브 미나르를 쌓기 시작했고 술탄이 된 뒤에도 공사를 이었는데, 사원 비문은 여러 힌두·자이나 사원(스물일곱 곳이라 적었다)의 석재를 다시 썼다고 밝힌다. 그는 1210년 라호르에서 폴로 경기 중 말에서 떨어져 죽었다. 군대가 아들 아람 샤를 세웠으나 델리의 귀족들이 사위 일투트미시를 불러 1211년 권력을 넘겼다. 아이바크에서 일투트미시로 이어진 정권을 '맘루크 왕조' 또는 '노예 왕조'라 부르지만 술탄 대부분이 이미 자유인이었다는 점에서 이름이 오해를 부른다는 지적이 있다. 이 정권이 델리 술탄국으로 불리며 다섯 왕조를 거쳐 1526년까지 이어진다. 라호르가 처음 도읍이었고 델리는 군사 거점이었으며, 도읍은 일투트미시 때 델리로 옮겨 굳어졌다. 술탄국의 군사력은 튀르크계 노예 군인(맘루크)과 그들에게 나눠 준 봉토(이크타)에 기댔고, 지방의 힌두 지주들은 공납을 바치는 조건으로 자리를 지켰다. 궁정 언어는 페르시아어가 되어 중앙아시아와 이란에서 관료와 학자, 시인이 몰려들었다."
  subjects: [delhi-sultanate, qubacha-multan, ghurid-dynasty]
  tags: [politics, war]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (Permanent Black, 2007)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)"]

- id: north-india-dynasties-1206
  year: 1206
  title:
    ko: "델리 술탄국이 생길 무렵의 북인도·서인도 여러 나라(1206)"
  summary:
    ko: "델리 술탄국이 문을 연 1206년 무렵 북인도와 서인도에는 구르 군의 공격을 받고도 자리를 지킨 왕조가 많았다. 라자스탄에서는 차하마나(차우한) 왕가가 1192년 타라인 전투의 패배 뒤 아지메르를 잃고 란탐보르를 거점으로 삼았고, 메와르에서는 구힐라 가문이 치토르 일대를 다스렸으며, 타르 사막 서쪽 자이살메르는 바티 가문이, 카티아와르 동쪽 쿠치는 사마 부족 호족들(뒤에 자데자 왕조로 이어진다)이 맡았다. 구자라트의 찰루키아(솔란키) 왕가는 도읍 아닐와라(지금 파탄)에서 구르 군을 몇 차례 물리쳤고, 말와의 파라마라 왕가는 도읍 다르에서 이웃 나라들과 다퉜다. 분델칸드의 찬델라 왕가는 1202~1203년 아이바크에게 칼린자르 요새를 잃고 힘이 줄었다. 카슈미르는 로하라 왕조가 이어받았으나 궁정 파벌 싸움으로 약해져 있었다. 인더스강 하류의 신드는 소마라 왕조가 토착 호족 세력을 바탕으로 다스렸다. 히말라야 쪽으로는 라다크 왕국, 쿠마온의 산지 군주들, 지금의 서부 네팔 카르날리강 유역의 카사 말라 왕국, 펀자브 산지 토후국들, 곧 지금의 히마찰 지방에 흩어진 산지 소국들이 각자의 골짜기를 다스렸다. 이 나라들은 대개 1300년을 전후한 델리의 원정 때 서로 다른 운명을 맞는다. 이 왕가들은 요새를 중심으로 한 씨족 연합 성격이 강했고, 사원과 저수지를 지어 정당성을 얻었다. 구자라트 찰루키아 왕가의 후신 바겔라 왕가의 재상 바스투팔라와 테자팔라는 1230년대에 마운트아부에 룬 바사히 자이나 사원을 세웠다. 칼린자르 요새는 찬델라 왕가의 상징이었고, 구르 군이 차지한 아지메르 일대는 델리의 관할이 됐다. 카슈미르의 로하라 왕조는 산악 지형 덕분에 이슬람 군의 직접 공격을 받지 않았다. 마운트아부의 이 사원들은 지금도 남아 있다."
  subjects: [delhi-sultanate, chahamana-dynasty, mewar-state, jaisalmer-state, cutch-state, chaulukya-dynasty, paramara-dynasty, chandela-dynasty, lohara-dynasty, soomra-dynasty, ladakh-kingdom, kumaon-kingdom, khasa-malla-kingdom, punjab-hill-states]
  tags: [politics]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "R. C. Majumdar (ed.), The Delhi Sultanate (Bharatiya Vidya Bhavan, 1960)", "Rima Hooja, A History of Rajasthan (Rupa, 2006)"]

- id: east-south-dynasties-1206
  year: 1206
  title:
    ko: "델리 술탄국이 생길 무렵의 동인도·데칸·남인도·스리랑카 여러 나라(1206)"
  summary:
    ko: "1206년 무렵 델리의 힘은 갠지스 평원 위쪽에만 미쳤고, 동쪽과 남쪽은 별개의 왕조들이 나누고 있었다. 벵골에서는 세나 왕조의 락슈마나 세나가 1204년 무렵 바크티야르 할지에게 나디아를 잃고 동벵골로 물러났고, 북비하르 쪽에서는 미틸라의 카르나타 왕조가 시므라운가르를 도읍으로 삼았다. 오리사 해안은 동부 강가 왕조(찰루키아 방계)가 푸리의 자간나타 사원을 지으며 다스렸으며, 중부 인도에서는 라탄푸르 왕국의 칼라추리 계통과 오리사 북부의 마유르반즈 같은 작은 호족 나라가 이어졌다. 동북쪽 임팔 분지에서는 마니푸르의 메이테이 왕들이 자리를 지켰다. 데칸 고원에서는 데바기리의 야다바 왕가, 와랑갈의 카카티야 왕가, 카르나타카 남부의 호이살라 왕가가 서로 다투며 세력을 키웠다. 더 남쪽 타밀 지방에서는 촐라 왕가가 쿨로퉁가 3세 때까지 이름을 이었으나 판디아와 호이살라에 밀려 쇠퇴하고 있었다. 스리랑카에서는 폴론나루와를 중심으로 한 싱할라 왕국이 12세기 후반 파라크라마바후 1세 이후의 혼란 속에서 흔들리고 있었다. 이 가운데 여러 나라가 14세기 초 델리의 원정에 맞닥뜨린다. 이 나라들은 대규모 사원 건축을 통해 권위를 드러냈다. 호이살라는 벨루르와 할레비두의 사원을, 카카티야는 팔람페트의 라마파 사원(1213)을 남겼고, 동부 강가 왕조는 13세기 중엽 코나라크 태양 사원을 세웠다. 벵골의 일은 「바크티야르 할지 이후의 벵골: 라크나우티와 세나 왕조의 끝(1206~1245)」(같은 시기의 사건)이 따로 다룬다. 스리랑카 섬의 일은 「칼링가 마가의 침입과 스리랑카 싱할라 왕국의 남서 이동(1215~1256)」(뒤의 사건)이, 남인도 타밀 지방의 일은 「후기 촐라의 쇠퇴와 판디아 왕국의 전성(1216~1279)」(뒤의 사건)이 이어서 다룬다."
  subjects: [delhi-sultanate, sena-dynasty, karnat-dynasty, eastern-ganga-dynasty, ratanpur-kingdom, mayurbhanj-state, manipur, yadava-dynasty, kakatiya-dynasty, hoysala-dynasty, chola-dynasty, sinhalese-kingdom]
  tags: [politics]
  sources: ["Burton Stein, A History of India (Blackwell, 1998)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)", "K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)"]

- id: bengal-lakhnauti-1206
  year: 1206
  endYear: 1245
  title:
    ko: "바크티야르 할지 이후의 벵골: 라크나우티와 세나 왕조의 끝(1206~1245)"
  summary:
    ko: "구르 왕조 휘하의 장군 바크티야르 할지는 1204년 무렵 나디아를 급습해 세나 왕조의 락슈마나 세나를 몰아내고 가우르 근처 라크나우티를 거점으로 삼았다. 1206년 그는 티베트와 이어지는 길을 뚫으려 아삼 쪽 카마루파로 원정군을 이끌었으나 우기와 협곡 지형, 현지 군의 저항으로 대부분을 잃고 돌아와 얼마 뒤 데오코트에서 부하 알리 마르단 할지에게 살해됐다. 라크나우티는 곧 할지 장군들의 다툼과 델리의 간섭 속에 놓였다. 후삼 웃딘 이와즈 할지가 1212년 무렵 기야스 웃딘이라는 이름으로 독립을 선언해 세금을 거두고 동쪽 변경 원정을 벌였으나, 1225년 일투트미시의 원정에 조공을 약속했다가 1227년 델리가 보낸 왕자 나시르 웃딘 마흐무드에게 죽었다. 이후 라크나우티는 델리가 보낸 총독이 이어받았으나 먼 거리 때문에 통제가 느슨했다. 한편 락슈마나 세나의 아들 비슈바루파 세나와 케샤바 세나 등 세나 계 왕들은 동벵골의 비크람푸르를 근거로 1230년대까지 비문을 남겼고, 그 뒤 데바 왕조의 다누자마다바 다샤라타데바가 동벵골의 지배자로 나타난다. 세나 계의 마지막과 데바 왕조의 시작 연대는 모두 어림이며 1245년 무렵으로 본다. 이슬람이 벵골에서 퍼진 과정은 정복만으로 설명하기 어렵다는 연구가 있다. 삼각주 동부의 숲을 논으로 개간하는 일과 수피 성자, 농민 공동체의 개종, 상업 교류가 함께 작용했다는 것이다. 라크나우티의 총독과 독립 군주들은 모스크와 수피 시설을 세워 이 흐름을 후원했다. 서쪽 이웃 미틸라의 카르나타 왕가는 이 시기 델리의 직접 지배 밖에 있었고 1324년에야 투글루크 군에 무너진다. 가우르와 판두아 일대는 이후 벵골 술탄국의 중심 지역이 된다. 후대의 유적에서는 옛 힌두·불교 건물의 석재를 새 모스크에 다시 쓴 사례도 확인된다."
  subjects: [delhi-sultanate, sena-dynasty, deva-dynasty-bengal, karnat-dynasty, ghurid-dynasty]
  links:
