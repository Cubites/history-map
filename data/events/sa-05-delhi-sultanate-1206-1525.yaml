- id: kakatiya-andhra-1323
  year: 1323
  endYear: 1368
  title:
    ko: "카카티야 왕국의 몰락과 안드라의 무수누리 나야카·레디 왕국(1323~1368)"
  summary:
    ko: "1323년 델리 군이 와랑갈을 함락해 카카티야 왕가가 끝나자(「투글루크 왕조의 성립과 와랑갈·마두라이의 정복(1320~1325)」, 앞의 사건) 텔루구 지방은 주인이 없는 땅이 됐다. 무함마드 빈 투글루크의 델리 정권이 이 땅을 되찾지 못한 경과는 「무함마드 빈 투글루크의 개혁과 제국의 이탈(1325~1351)」(뒤의 사건)이 다룬다. 델리가 임명한 총독과 군대는 곧 지방 무장 세력의 도전을 받았다. 카카티야의 무장 출신 프롤라야 나야카가 1330년 무렵 여러 나야카(군사 영주)를 규합해 델리 수비대를 몰아내는 반란을 이끌었고, 사촌 카파야 나야카(재위 1333~1368)가 1336년 와랑갈을 되찾아 텔랑가나를 다스렸다. 이 무수누리 나야카 정권은 비자야나가라, 1347년 갓 일어선 바흐마니와 서로 동맹을 맺기도 하고 부딪치기도 했으며, 1363년 카파야 나야카는 바흐마니 술탄에게 골콘다 요새를 넘겨야 했다. 그가 죽은 1368년 무렵 나라는 흩어졌다. 해안 쪽에서는 프롤라야 베마 레디가 1325년 무렵 아단키에서 레디 왕국을 세웠고, 아나베마 레디(재위 1364~1386) 때 콘다비두를 중심으로 군투르와 고다바리·크리슈나 삼각주를 다스렸다. 레디 궁정은 텔루구 문학을 후원해 시인 스리나타 같은 이를 낳았으나, 15세기에 비자야나가라와 오리사의 가자파티 사이에서 쪼개졌다. 한편 카카티야의 마지막 왕 프라타파루드라의 아우 안나마데바가 지금의 바스타르로 가서 1324년 무렵 바스타르 왕가를 열었다는 전승이 있고, 바스타르의 지배자들은 오랫동안 카카티야의 후손을 자처했다. 카카티야 시대에는 가나파티 데바(재위 1199~1262)가 해안 항구 모투팔리를 정비해 교역을 키웠고, 그의 딸 루드라마 데비(재위 1262~1289)가 여왕으로 다스렸다. 마르코 폴로는 1290년대 모투팔리를 들러 여왕 루드라마의 정치를 칭찬했다."
  subjects: [kakatiya-dynasty, musunuri-nayakas, reddi-kingdom, bastar-state, delhi-sultanate, bahmani-sultanate, vijayanagara-empire]
  tags: [politics, war]
  sources: ["Cynthia Talbot, Precolonial India in Practice: Society, Region, and Identity in Medieval Andhra (Oxford University Press, 2001)", "Burton Stein, Vijayanagara (The New Cambridge History of India I.2, Cambridge University Press, 1989)", "Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)"]

- id: muhammad-tughluq-1325
  year: 1325
  endYear: 1351
  title:
    ko: "무함마드 빈 투글루크의 개혁과 제국의 이탈(1325~1351)"
  summary:
    ko: "1325년 즉위한 무함마드 빈 투글루크는 이슬람 학문과 철학, 수학에 밝았고 정책 실험에 적극적이었다. 1327년 그는 델리 술탄국을 남쪽에서 다스리기 위해 도읍을 데바기리(다울라타바드)로 옮기려 했다. 바라니와 이븐 바투타는 델리 주민이 강제로 이주해 도성이 비었다고 적었지만, 실제 이주 대상은 귀족과 학자, 수피 등 상층에 한정됐다고 보는 연구자도 많다. 1335년 무렵 도읍은 델리로 되돌아왔다. 1329~1330년경에는 구리 주화를 은화 값으로 쓰게 하는 토큰 화폐를 발행했다. 원과 일 칸국의 지폐를 본뜬 것으로 보지만 위조가 퍼져 거둬들였고 재정에 큰 손실이 났다. 도아브의 세금을 늘린 정책과 겹쳐 기근이 닥치자(1330년대 후반) 농민이 숲으로 달아났다. 그는 호라산 원정을 계획해 군대를 모았다가 해산했고, 히말라야 카라칠 원정(1330년대 초)에서는 병력을 거의 잃었다. 이븐 바투타는 1333년 신드를 거쳐 델리에 와서 몇 해 동안 재판관을 지냈다(「이븐 바투타의 여행과 『여행기』(1325~1355)」, 같은 시기의 사건). 이 시기 제국은 먼 지방부터 떨어져 나갔다. 1335년 마두라이(「마두라이 술탄국의 성립과 쇠퇴(1335~1378)」, 뒤의 사건), 1336년 비자야나가라(「하리하라와 부카, 비자야나가라의 성립(1336~1378)」, 뒤의 사건), 1338년 벵골(「일리야스 샤와 벵골 술탄국의 독립(1338~1358)」, 뒤의 사건), 1347년 데칸의 바흐마니(「하산 간구와 바흐마니 술탄국의 성립(1347~1397)」, 뒤의 사건)가 독립했다. 무함마드는 1351년 3월 신드에서 반란자 타기를 쫓다 병들어 죽었다. 1335년 무렵 델리 술탄국의 판도는 카슈미르와 네팔, 최남단을 빼고 남아시아 대부분에 걸친 최대치에 이르렀다. 바라니는 무함마드의 정책을 사려 없는 실험이라 비판했고, 일부 현대 연구자는 그를 시대를 앞선 혁신가로 평가한다."
  subjects: [delhi-sultanate, madurai-sultanate, vijayanagara-empire, bengal-sultanate, bahmani-sultanate]
  tags: [politics, economy]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Agha Mahdi Husain, Tughluq Dynasty (Thacker, Spink & Co., 1963)", "Ziauddin Barani, Tarikh-i Firuz Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 3 (Trübner, 1871)", "Ross E. Dunn, The Adventures of Ibn Battuta (University of California Press, 1986)"]

- id: madurai-sultanate-1335
  year: 1335
  endYear: 1378
  title:
    ko: "마두라이 술탄국의 성립과 쇠퇴(1335~1378)"
  summary:
    ko: "1323년 델리 군에 점령된 마두라이 일대는 마아바르 주로 불리며 델리의 총독이 다스렸다. 1335년 무렵 총독 잘랄 웃딘 아산 샤가 독립을 선언하고 마두라이 술탄국을 세웠다. 아산 샤는 곧 암살됐고 이후 알라웃딘 우다우지, 쿠트브 웃딘, 기야스 웃딘 다므가니(재위 1340~1344 무렵)가 이어 즉위하는 혼란이 이어졌다. 이븐 바투타는 1344년 무렵 다므가니의 궁정을 찾아 그의 잔혹한 통치와 역병을 기록했다. 다므가니는 1343년 호이살라 왕 발랄라 3세를 마두라이 앞 카난누르에서 패사시켰다고 전한다. 이 일로 카르나타카 남부의 호이살라는 사실상 끝났고 그 땅은 비자야나가라가 이어받았다. 술탄국은 역병과 내분에 시달렸고, 1370년 무렵 부카 1세의 아들 쿠마라 캄파나가 마두라이를 공격해 1370년대 후반 술탄국을 끝냈다. 이 일은 캄파나의 아내 강가데비가 쓴 산스크리트 서사시 『마두라 비자얌』에 담겼다. 마두라이는 이후 비자야나가라의 총독 아래 있다가 16세기에 마두라이 나야크가 독립한다. 『마두라 비자얌』은 술탄 치하의 마두라이를 사원이 황폐해진 시기로 묘사했고, 쿠마라 캄파나의 장군 고파나가 1371년 스리랑감의 랑가나타 사원을 다시 열었다고 비문이 전한다. 이 서술은 비자야나가라 쪽 시각이라는 점을 감안해야 한다. 이 정복은 「하리하라와 부카, 비자야나가라의 성립(1336~1378)」(뒤의 사건)이 이어서 다룬다. 마두라이는 미낙시 사원이 있는 오랜 판디아의 도읍이었고, 14세기 초 두 왕자 순다라 판디아와 비라 판디아의 형제 다툼으로 이미 힘이 약했다. 이 일대는 말 무역과 진주 어업으로 알려진 부유한 지역이었다. 술탄국의 주화와 비문은 드물어 연구는 이븐 바투타와 후대 비자야나가라 사료에 많이 기댄다."
  subjects: [madurai-sultanate, hoysala-dynasty, vijayanagara-empire, delhi-sultanate]
  links:
    - { from: vijayanagara-empire, to: madurai-sultanate, note: "쿠마라 캄파나가 마두라이를 정복해 술탄국을 끝냄 (1370년대)" }
  tags: [politics, war]
  sources: ["Burton Stein, Vijayanagara (The New Cambridge History of India I.2, Cambridge University Press, 1989)", "Ross E. Dunn, The Adventures of Ibn Battuta (University of California Press, 1986)", "K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)"]

- id: vijayanagara-1336
  year: 1336
  endYear: 1378
  title:
    ko: "하리하라와 부카, 비자야나가라의 성립(1336~1378)"
  summary:
    ko: "툼바드라강 가의 칸나다계 소국 캄필리는 1327~1328년 무함마드 빈 투글루크 군에 무너졌다. 이때 캄필리의 관리였던 형제 하리하라와 부카는 포로로 델리에 끌려가 개종했다가 풀려나 현지의 총독으로 보내졌다는 설이 있고, 호이살라나 카카티야 군의 장수였다는 설도 있다. 출신에 관한 학설은 갈리지만 1336년 4월 하리하라 1세가 툼바드라강 남안 비자야나가라(승리의 도시)에서 대관식을 올렸다는 점은 비문이 뒷받침한다. 상가마 왕조라 불리는 이 정권은 델리의 압박이 약해지고 호이살라의 발랄라 3세가 1343년 마두라이 근처에서 죽자 호이살라 영토를 흡수했고(1346년 무렵 통합), 형제는 내륙 고원에서 동해안과 서해안으로 세력을 넓혔다. 부카 1세(재위 1356~1377)는 바흐마니 술탄국과 라이추르 도압을 두고 거듭 싸웠다(「하산 간구와 바흐마니 술탄국의 성립(1347~1397)」, 뒤의 사건). 1370년 무렵 부카의 아들 쿠마라 캄파나가 마두라이를 공격해 1370년대 후반 술탄국을 무너뜨렸고, 타밀 지방 남쪽까지 비자야나가라의 판도가 닿았다. 왕은 시링게리 수도원의 학승 비디야란야 같은 이들에게 의지했다고 전해지며, 1374년 부카는 명에 사절을 보냈다. 이 왕국은 이후 두 세기 넘게 남인도의 패권을 쥐게 된다. 이 왕들은 스스로 '힌두 왕들 가운데 술탄(힌두라야수라트라나)'이라 부르며 술탄국의 복식과 의례를 받아들였다. 왕권의 중심은 함피 일대의 사원이었으며, 비루파크샤 신의 이름으로 통치한다는 관념을 앞세웠다. 시조 상가마의 이름을 따 상가마 왕조라 부른다. 하리하라 1세와 부카 1세는 처음 함께 다스렸고, 하리하라가 죽은 1356년 부카가 단독으로 왕위에 올랐다."
  subjects: [vijayanagara-empire, hoysala-dynasty, delhi-sultanate, bahmani-sultanate, madurai-sultanate]
  links:
