  tags: [war, politics]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)"]

- id: iltutmish-1211
  year: 1211
  endYear: 1236
  title:
    ko: "일투트미시의 즉위와 델리 술탄국의 기틀(1211~1236)"
  summary:
    ko: "일투트미시는 아이바크의 사위이자 노예 출신 장군으로, 1211년 아람 샤를 몰아내고 델리 술탄에 올랐다. 그는 먼저 경쟁자들을 눌렀다. 1215~1216년 타라인 부근에서 가즈니에서 쫓겨 펀자브로 온 타지 웃딘 일디즈를 꺾었고, 1217년 라호르를 확보했다. 1221년 칭기즈 칸이 호라즘의 잘랄 웃딘을 쫓아 인더스강에 이르렀을 때(「몽골의 호라즘 정복과 잘랄 앗딘(1219~1231)」, 뒤의 사건) 잘랄 웃딘이 피신처를 청했으나 일투트미시는 응하지 않았고 몽골은 인도 안으로 들어오지 않았다. 1227~1228년에는 우치와 물탄의 카바차를 쳐서 인더스강에서 익사하게 했고 신드 북부를 델리 아래 두었다. 벵골에서는 1225년과 1227년 두 차례 원정으로 이와즈 할지의 독립을 끝냈다. 동쪽과 서쪽으로는 1226년 차하마나 왕조의 란탐보르를 차지했으나 곧 되돌려졌고 1232년에는 괄리오르를 차지했으며 1234~1235년 파라마라 왕조의 옛 땅인 말와의 빌사·우자인을 공격했는데, 연대기는 이때 우자인의 마하칼 사원이 부서졌다고 전한다. 메와르의 도읍 나그다도 공격했다고 한다. 1229년 바그다드의 아바스 칼리프 알무스탄시르가 인정의 예복과 문서를 보내자 일투트미시는 술탄 지위의 정통성을 얻었다. 그는 은 탕카와 구리 지탈 화폐 체계를 갖추고, 이크타(봉토) 제도를 정비하고, 쿠트브 미나르를 완성했으며, 튀르크 출신 군인 귀족 집단 '40인(투르칸 이 치할가니)'을 키웠다. 1236년 그가 죽은 뒤 이 집단이 왕위 계승을 좌우하게 된다. 1229년 맏아들 나시르 웃딘 마흐무드가 죽자 일투트미시는 델리 남쪽에 술탄 가리 묘를 세웠는데, 인도에 남은 가장 오래된 이슬람 묘로 꼽힌다. 그는 죽을 때 맏아들 대신 딸 라지야를 후계자로 지목했다고 한다(「라지야 술탄과 '40인' 귀족의 권력 다툼(1236~1240)」, 뒤의 사건)."
  subjects: [delhi-sultanate, qubacha-multan, chahamana-dynasty, mewar-state, paramara-dynasty]
  links:
    - { from: delhi-sultanate, to: qubacha-multan, note: "우치·물탄의 카바차를 쳐서 신드 북부를 병합 (1228)" }
  tags: [politics, war, diplomacy]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (Permanent Black, 2007)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)", "Mohammad Habib·Khaliq Ahmad Nizami (eds.), A Comprehensive History of India, vol. 5: The Delhi Sultanat (A.D. 1206–1526) (People's Publishing House, 1970)"]

- id: magha-sri-lanka-1215
  year: 1215
  endYear: 1256
  title:
    ko: "칼링가 마가의 침입과 스리랑카 싱할라 왕국의 남서 이동(1215~1256)"
  summary:
    ko: "12세기 후반 파라크라마바후 1세 이후 폴론나루와의 싱할라 왕국은 왕위 다툼으로 흔들렸고, 남인도 판디아와 촐라의 간섭도 받았다. 1215년 무렵 인도 동해안 칼링가에서 온 마가(칼링가 마가)가 군대를 이끌고 들어와 폴론나루와를 차지하고 섬 북부와 동부 건조 지대를 다스렸다. 싱할라 연대기 『출라왐사』는 그가 사원과 관개 시설을 부수고 땅을 빼앗았다고 비난하지만, 남인도 타밀 용병과 싱할라 영주 사이의 정치 다툼으로 보는 연구자도 있어 평가가 갈린다. 싱할라 지도자들은 폴론나루와를 버리고 남서쪽 습윤 지대로 물러났다. 비자야바후 3세가 1220년 무렵 담바데니야에 새 도읍을 열었고, 파라크라마바후 2세(재위 1236~1270)가 마가의 세력을 몰아내 북쪽 땅 일부를 되찾았다. 마가는 1255년 무렵 나라를 잃은 것으로 보인다. 이 사이 섬 북부 자프나 반도에는 타밀계 아랴차크라바르티 왕가가 자리 잡았다. 폴론나루와의 관개 문명이 무너지고 싱할라 왕조의 중심이 습윤 지대로 옮겨 가는 전환이 이 시기에 굳어졌다. 옛 연구는 이 시기 이후 폴론나루와 일대 관개 시설이 무너지고 말라리아가 퍼져 북부 건조 지대가 비었다고 설명했으나, 최근 연구는 기후 변화와 인도양 교역로의 이동도 함께 본다. 싱할라 왕권은 이후에도 야파후와, 쿠루네갈라, 감폴라로 도읍을 옮기며 부처의 치아 사리를 가져가 정통성의 상징으로 삼았다. 자프나 반도의 아랴차크라바르티 왕국은 13세기 중엽 이후 북부에 자리 잡았고, 14세기에 이븐 바투타가 푸탈람에서 그 왕을 만나기도 했다(「이븐 바투타의 여행과 『여행기』(1325~1355)」, 뒤의 사건). 마가가 사원과 승원을 약탈했다는 서술은 싱할라 사료의 시각에서 나온 것이므로 타밀 쪽 기록과 견주어 읽어야 한다는 지적이 있다."
  subjects: [magha-kingdom, sinhalese-kingdom]
  tags: [war, politics]
  sources: ["K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Sinnappah Arasaratnam, Ceylon (Prentice-Hall, 1964)"]

- id: chola-pandya-1216
  year: 1216
  endYear: 1279
  title:
    ko: "후기 촐라의 쇠퇴와 판디아 왕국의 전성(1216~1279)"
  summary:
    ko: "12세기 말 남인도의 패자였던 촐라 왕가는 쿨로퉁가 3세(재위 1178~1218) 때 이미 호이살라와 판디아의 압박을 받고 있었다. 1216년 마라바르만 순다라 판디아 1세가 즉위해 촐라 땅으로 쳐들어갔고, 1219년 무렵 우라이유르와 탄자부르를 불태워 촐라 왕을 달아나게 했다. 촐라는 호이살라 왕 나라심하 2세의 개입으로 겨우 이어졌으나, 라제드라 3세(재위 1246~1279) 때에는 독립적인 힘을 거의 잃었다. 판디아의 전성기는 자타바르만 순다라 판디아 1세(재위 1251~1268) 때였다. 그는 촐라와 호이살라를 눌렀고 칸치푸람을 거쳐 카카티야 영토인 넬로르까지 진출했으며, 싱할라 왕국이 다스리던 스리랑카 북부에도 군대를 보냈다. 마라바르만 쿨라세카라 1세(재위 1268~1310) 때 판디아는 마두라이와 해안 항구 카얄을 중심으로 진주 어업과 아라비아 말 수입으로 부를 쌓았다. 1279년 무렵 라제드라 3세가 마지막으로 사라지며 촐라 왕가의 이름이 끊겼다. 마르코 폴로(「마르코 폴로의 동방 여행과 『세계의 서술』」, 뒤의 사건)는 1290년대 초 이 지역을 '마아바르'라 부르며 판디아 왕의 부와 진주 채취를 적었다. 쿨라세카라 사후 아들들의 왕위 다툼이 델리 군의 개입을 불렀고, 판디아 왕가는 1323년 투글루크 군에 무너진다. 자타바르만 순다라 판디아 1세는 치담바람 사원의 지붕을 금으로 덮고 스리랑감 사원을 보수했다고 비문에 전한다. 판디아는 카얄 항구를 통해 아라비아 말을 대량으로 수입했고, 페르시아 역사가 와사프는 판디아의 부와 말 거래를 자세히 적었다. 촐라의 쇠퇴에는 지방 호족이 중앙에서 벗어난 일도 한몫했다. 호족 코퍼룬징가는 1231년 라자라자 3세를 사로잡았고, 호이살라가 개입해서야 풀려났다."
  subjects: [chola-dynasty, pandya-dynasty, hoysala-dynasty, kakatiya-dynasty, sinhalese-kingdom]
  tags: [politics, war]
  sources: ["K. A. Nilakanta Sastri, A History of South India: From Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Burton Stein, A History of India (Blackwell, 1998)", "Hermann Kulke·Dietmar Rothermund, A History of India (Routledge, 2004)"]

- id: assam-ahom-kamata-1228
  year: 1228
  endYear: 1523
  title:
    ko: "아삼의 새 왕국들: 아홈의 성립과 카마타·코치(1228~1523)"
  summary:
    ko: "브라마푸트라 골짜기는 13세기에 정치 지형이 크게 바뀌었다. 1228년 타이계 왕자 수카파가 미얀마 북부의 파트카이 산맥을 넘어 골짜기 상부로 들어왔다. 그는 모란·보라히 등 토착 집단을 흡수하고 논농사와 부역 제도(파이크)로 나라를 세웠으며 1253년 차라이데오를 도읍으로 삼았다. 이 나라가 아홈 왕국이다. 1206년 바크티야르 할지의 카마루파 원정이 실패한 뒤(「바크티야르 할지 이후의 벵골: 라크나우티와 세나 왕조의 끝(1206~1245)」, 앞의 사건) 서쪽 골짜기에서는 카마타 왕국이 1257년 무렵 상디아 때 도읍을 카마타푸르로 옮겨 이어졌고, 15세기 중엽에는 켄 왕조의 닐라드와즈·차크라드와즈·닐람바르가 나라를 이끌었다. 1498년 벵골의 알라웃딘 후세인 샤가 카마타푸르를 차지해 카마타 왕국을 끝냈으나 벵골의 지배는 오래 가지 못했다. 그 자리에서 1515년 무렵 코치 족장 비스와 싱하가 코치 왕국을 세웠다. 한편 아홈은 수훙문(재위 1497~1539) 때 동쪽 추티아 왕국을 1523년 병합해 상부 아삼을 장악했고, 화승총과 대포를 쓰기 시작했다. 아홈 연대기 '부란지'는 이 시기를 상세히 전하며, 아홈 지배층은 시간이 흐르며 아삼어와 힌두교를 받아들였다. 아홈 왕국은 처음에는 타이어를 썼지만 시간이 지나며 아삼어를 받아들였고, 연대기 '부란지'도 타이어에서 아삼어 산문으로 바뀌었다. 파이크 제도는 성인 남자를 일정 기간 국가에 부역하게 하는 방식으로 관개와 방어를 책임졌다. 코치 왕국은 비스와 싱하의 아들 나라나라야나(재위 1540 무렵~1587) 때 가장 커진다. 1498년 후세인 샤의 카마타 원정은 벵골 술탄국이 북동 변경으로 가장 멀리 나아간 일이었다. 아홈 동쪽 이웃 추티아 왕국은 사디야를 도읍으로 삼은 타이계 왕국이었고, 1523년 아홈에 병합되면서 아홈의 영토는 상부 아삼 전체로 넓어졌다."
  subjects: [ahom-kingdom, kamata-kingdom, koch-kingdom, bengal-sultanate]
  links:
