- id: bengal-ilyas-1338
  year: 1338
  endYear: 1358
  title:
    ko: "일리야스 샤와 벵골 술탄국의 독립(1338~1358)"
  summary:
    ko: "무함마드 빈 투글루크 때 델리의 벵골 통제가 흔들리면서 1338년 무렵 동벵골의 소나르가온과 서벵골의 라크나우티가 잇따라 델리에서 떨어져 나갔다. 소나르가온의 파크르 웃딘 무바라크 샤는 1340년 치타공을 차지했고, 라크나우티에서는 알라웃딘 알리 샤가 일어섰다. 1342년 샴스 웃딘 일리야스 샤가 알리 샤를 몰아내고 라크나우티와 사트가온을 합쳐 벵골 술탄국을 세웠으며, 1352년 소나르가온의 후계자 이크티야르 웃딘 가지 샤를 제거해 벵골 전체를 하나로 묶었다. 이븐 바투타는 1346년 무렵 소나르가온에서 파크르 웃딘을 만나 실헤트를 들른 뒤 소나르가온에서 배를 타고 수마트라로 향했다(「이븐 바투타의 여행과 『여행기』(1325~1355)」, 앞의 사건). 피루즈 샤 투글루크는 1353~1354년 원정군을 보내 일리야스의 에크달라 요새를 포위했으나 우기가 오자 물러났고, 1359~1360년 일리야스의 아들 시칸다르 샤를 상대로 다시 원정했다가 사실상 독립을 인정하는 화의를 맺었다. 이로써 벵골은 델리의 영향권에서 벗어나 갠지스-브라마푸트라 삼각주의 논농사와 직물, 해상 무역을 기반으로 하는 독립 국가가 됐다. 일리야스 샤 왕조는 1414년까지 이어진다(1435년 무렵 복귀). 일리야스 샤는 판두아(지금 말다 지구)를 도읍으로 삼았고, 시칸다르 샤(재위 1358~1390)는 판두아에 아디나 모스크(1373~1375)를 세웠다. 이 무렵 벵골은 쌀과 비단, 무슬린 직물을 수출해 명성이 높았다. 일리야스 샤 왕조는 힌두 지주와 관리를 중용하고 벵골어 문학이 자랄 환경을 마련했다고 평가된다. 에크달라 요새의 정확한 위치는 학자마다 다르게 짚는다."
  subjects: [bengal-sultanate, sonargaon-sultanate, delhi-sultanate]
  links:
    - { from: bengal-sultanate, to: sonargaon-sultanate, note: "소나르가온을 병합해 벵골을 하나로 합침 (1352)" }
  tags: [politics, war]
  sources: ["Richard M. Eaton, The Rise of Islam and the Bengal Frontier, 1204–1760 (University of California Press, 1993)", "Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Ross E. Dunn, The Adventures of Ibn Battuta (University of California Press, 1986)"]

- id: kashmir-sultanate-1339
  year: 1339
  endYear: 1470
  title:
    ko: "카슈미르 술탄국의 성립과 자인 울 아비딘(1339~1470)"
  summary:
    ko: "14세기 초 카슈미르는 로하라 왕조 말기의 내분과 침입으로 흔들렸다. 1320년 무렵 티베트계 왕자 린차나가 권력을 잡고 이슬람으로 개종해 샤드르 웃딘이라는 이름으로 짧게 다스렸고, 그 사이 스와트에서 온 샤 미르가 궁정에서 세력을 키웠다. 린차나가 죽은(1323) 뒤 우다야나데바가 1338년까지 다스렸고 그의 아내 코타 라니가 이어 통치했으나 샤 미르는 1339년 그녀를 밀어내고 샴스 웃딘이라는 이름으로 술탄이 되어 카슈미르 술탄국을 열었다(로하라 왕조의 끝). 이 샤미리 왕조는 1561년까지 이어진다. 시칸다르(재위 1389~1413)는 중앙아시아에서 온 수피들, 특히 미르 사이이드 알리 함다니의 후손과 추종자들을 받아들였다. 칼하나의 『라자타랑기니』를 잇는 산스크리트 연대기(조나라자·스리바라)와 페르시아 연대기는 이 시기에 사원이 부서지고 지즈야가 부과되고 개종이 압박됐다고 전하지만, 규모와 주체(술탄인지 재상인지)에 대한 해석은 연구자마다 갈린다. 카슈미르의 이슬람화는 수피와 리시 수도자의 활동, 직물 장인 공동체의 개종이 함께 작용한 긴 과정이었다. 자인 울 아비딘(재위 1420~1470)은 지즈야를 없애고 사원을 다시 짓게 하며 산스크리트와 페르시아 서적의 번역을 후원했다. 중앙아시아에서 직조공과 장인을 불러 카슈미르 숄 산업의 기틀을 놓았고, 울라르 호수에 인공 섬 자이나 랑카를 쌓았다. 사람들은 그를 '부드샤(위대한 왕)'라 불렀다. 자인 울 아비딘은 소 도살을 금하고 힌두 관리를 중용했다고 전한다. 샤미리 왕조 뒤인 1561년에는 차크 왕조가 권력을 잡는다. 전승에 따르면 린차나는 수피 불불 샤의 영향으로 개종했고, 샤미리 시대에도 지방 귀족 다마라 세력의 도전이 이어졌다. 자인 울 아비딘은 1470년 죽을 때까지 50년 가까이 다스렸고, 그 뒤 후계 다툼으로 샤미리 왕조의 힘이 약해진다."
  subjects: [kashmir-sultanate, lohara-dynasty]
  tags: [politics, religion, culture]
  sources: ["Mohibbul Hasan, Kashmir under the Sultans (Iran Society, 1959)", "Kalhana, Rajatarangini: A Chronicle of the Kings of Kashmir, trans. M. A. Stein (Archibald Constable, 1900)"]

- id: bahmani-1347
  year: 1347
  endYear: 1397
  title:
    ko: "하산 간구와 바흐마니 술탄국의 성립(1347~1397)"
  summary:
    ko: "델리 술탄국의 무함마드 빈 투글루크가 징세와 이주 정책을 강행하자 데바기리 지방의 '사다 아미란'(백인 대장) 귀족들이 1345년부터 반란을 일으켰다. 1347년 8월 이들은 하산 간구(자파르 칸)를 술탄으로 추대했고, 그는 알라웃딘 바흐만 샤라는 이름으로 즉위해 바흐마니 술탄국을 열었다. 이름의 유래는 전설의 이란 영웅 바흐만, 또는 브라만 후원자 간구라는 전승이 있다. 도읍은 처음 굴바르가에 세워졌다. 둘째 술탄 무함마드 샤 1세(재위 1358~1375)는 나라를 네 지방(타라프)으로 나누어 총독을 두고, 비자야나가라와 크리슈나·퉁가바드라 사이 라이추르 도압을 두고 싸웠다. 1363년에는 와랑갈의 무수누리 나야카 카파야에게서 골콘다 요새를 넘겨받았다. 17세기 연대기 페리슈타는 이 전쟁에서 양쪽이 주민을 대량으로 죽였다고 적지만 수치는 과장일 수 있다. 1370년대에는 술탄 암살과 궁정 내분이 이어졌고, 무함마드 샤 2세(재위 1378~1397)의 평화로운 치세에 학문과 건축이 발전해 굴바르가의 자미 사원(1367)이 완성됐다. 1396년부터 데칸 일대에 큰 가뭄이 들어 이후 십여 년 동안 이어졌다. 바흐마니의 궁정에서는 이란계 관료와 데칸 토박이 귀족이 갈등하며 훗날 파벌 다툼의 씨앗이 됐다. 이 왕조는 15세기에 도읍을 비다르로 옮기고 데칸 최대 세력으로 성장한다. 반란자들은 처음에 이스마일 무크를 술탄으로 추대했지만 그가 늙었다는 이유로 곧 하산 간구에게 자리를 넘겼다. 도읍은 훗날 1429년 무렵 비다르로 옮겨진다. 바흐마니 군은 기병이 중심이었고 14세기 후반 화약 무기를 쓰기 시작했다고 연대기가 전한다. 궁정 언어는 페르시아어였고 지방에서는 데칸어(다크니)가 퍼졌다. 하산 간구는 1358년에 죽었다."
  subjects: [bahmani-sultanate, delhi-sultanate, vijayanagara-empire, musunuri-nayakas]
  links:
    - { from: bahmani-sultanate, to: musunuri-nayakas, note: "카파야 나야카에게서 골콘다 요새를 넘겨받음 (1363)" }
  tags: [politics, war]
  sources: ["Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Burton Stein, Vijayanagara (The New Cambridge History of India I.2, Cambridge University Press, 1989)", "Haroon Khan Sherwani, The Bahmanis of the Deccan (Munshiram Manoharlal, 1985)", "Muhammad Qasim Hindu Shah Firishta, History of the Rise of the Mahomedan Power in India, trans. John Briggs (Longman, Rees, Orme, Brown, and Green, 1829)"]

- id: firuz-shah-tughluq-1351
  year: 1351
  endYear: 1388
  title:
    ko: "피루즈 샤 투글루크의 치세와 칸데시의 독립(1351~1388)"
  summary:
    ko: "1351년 3월 무함마드 빈 투글루크가 신드에서 죽자 군대는 사촌 피루즈 샤를 술탄으로 세우고 델리로 돌아왔다. 피루즈는 제국의 영토를 되찾는 데 힘쓰기보다 안정을 택했다. 1353~1354년과 1359~1360년 두 차례 벵골 원정은 화의로 끝났고, 1360년 오리사의 자자나가르, 1361년 캉그라(나가르코트) 원정을 벌였으며 1362~1363년 신드의 타타 원정은 큰 피해를 남기고 물러나는 데 그쳤다. 그는 귀족의 이크타 보유를 사실상 세습으로 인정해 귀족층의 지지를 얻었고, 쿠란 법에 없는 세금을 폐지하고 브라만에게도 지즈야를 매겼다고 연대기가 전한다. 야무나강과 수틀레지강에서 물길을 끌어 히사르 피루자(1354)와 피로자바드(1354, 지금 델리 코틀라)에 물을 댔고, 1359년 자운푸르를 세웠다. 아소카 석주를 토프라와 메루트에서 옮겨 델리에 세웠는데, 당시에는 이 글자를 읽는 이가 없었다. 연대기는 그가 18만 명의 노예 부대를 두었다고 적었다. 그는 자서전 『푸투하트 이 피루즈 샤히』도 남겼다. 그러나 지방 총독의 힘이 커졌고, 1370년 무렵 칸데시를 이크타로 받은 말리크 라자 파루키가 1382년 독립해 타프티 골짜기에서 칸데시 술탄국을 열었다. 1388년 피루즈가 죽은 뒤 술탄 자리를 둘러싼 내전이 1394년까지 이어졌다. 그는 가난한 처녀의 혼인을 돕는 기구와 병원(다룰 시파), 일자리 알선 기구도 두었다고 전해진다. 그의 치세는 안정과 번영을 이뤘다는 평가와 국고를 기울이고 군 통제를 느슨하게 했다는 평가가 함께 있다. 델리 코틀라 피로자 샤 유적에는 지금도 아소카 석주가 서 있다. 1368년 벼락을 맞은 쿠트브 미나르를 고쳐 윗층을 새로 올리기도 했다."
  subjects: [delhi-sultanate, khandesh-sultanate, bengal-sultanate]
  tags: [politics, economy]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Satish Chandra, Medieval India: From Sultanat to the Mughals, Part I: Delhi Sultanat (1206–1526) (Har-Anand, 1997)", "Ziauddin Barani·Shams-i Siraj Afif, Tarikh-i Firuz Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 3 (Trübner, 1871)"]

- id: sind-samma-1351
  year: 1351
  endYear: 1522
  title:
    ko: "신드: 소마라에서 삼마, 아르군으로(1351~1522)"
  summary:
    ko: "인더스강 하류의 신드는 11세기부터 소마라 왕조가 타타(지금 타타) 일대를 다스렸다. 델리의 무함마드 빈 투글루크는 1351년 반란자 타기를 쫓아 신드로 들어갔다가 타타 근처에서 죽었다. 이 무렵 삼마 가문의 잠 우나르가 소마라를 밀어내고 타타를 차지해 삼마 왕조를 열었다(시작 연대는 1335년 직후에서 1351년 무렵까지 자료마다 갈린다). 피루즈 샤 투글루크는 1362~1363년 타타를 공격해 잠 바비니야에게 복종을 약속받았으나 실제 지배는 이어지지 않았다. 삼마 왕조는 15세기에 호족 연합 형태로 신드 전역을 다스렸고, 잠 니자무딘(니도, 재위 1461~1508) 때 가장 번성했다. 그 시기 타타 근교 마클리 언덕에는 대규모 공동묘지와 영묘가 조성됐다(마클리 유적군). 1520년대 초(1519~1524년 사이로 학설이 갈린다) 칸다하르를 근거로 한 샤 베그 아르군이 바부르에게 쫓겨 남쪽으로 내려와 삼마의 잠 피로즈를 꺾고 신드 전체를 장악했다. 아르군 왕조는 타타를 도읍 삼았고, 샤 후사인 아르군은 1528년 물탄 술탄국(랑가 왕조)을 빼앗았다. 아르군 왕조는 1555년 타르칸 왕조로 이어져 1593년 무굴에 병합된다. 신드는 델리의 중심에서 멀어 14세기 중반부터 독자적인 정치 전통을 이었다. 타타 근처 마클리 언덕에는 14~18세기의 묘가 많이 남아 있는데 그 수는 추산이 갈리고(수십만 기라는 설명이 널리 쓰인다), 삼마 시대의 영묘가 포함된 이 유적은 유네스코 세계유산으로 지정됐다. 신드는 페르시아어와 아랍어 학문의 중심이기도 했다. 삼마 군주들은 '잠'이라는 칭호를 쓰며 호족 연합 위에 섰다. 델리 술탄들은 신드를 거듭 노렸으나 영구 지배에는 실패했다. 샤 베그 아르군은 바부르에게 밀려 칸다하르를 잃고 신드로 내려온 사람이었다. 후대 기록은 타타에 신학교가 많았다고 전한다. 인더스강 하구의 항구 교역도 삼마와 아르군 시대의 재정을 받쳤다."
  subjects: [soomra-dynasty, samma-dynasty, arghun-dynasty, delhi-sultanate, multan-sultanate]
  links:
