- id: raziya-1236
  year: 1236
  endYear: 1240
  title:
    ko: "라지야 술탄과 '40인' 귀족의 권력 다툼(1236~1240)"
  summary:
    ko: "일투트미시는 죽기 전 아들들이 무능하다고 보고 딸 라지야를 후계자로 지목했다고 연대기 『타바카트 이 나시리』는 전한다. 그러나 1236년 4월 그가 죽자 튀르크 귀족 집단 '40인'은 아들 루큰 웃딘 피루즈를 세웠고, 실권은 어머니 샤 투르칸이 쥐었다. 지방 총독들이 반란을 일으키고 델리 주민이 들고일어나자 피루즈 모자는 1236년 말 살해됐고 라지야가 델리 술탄 자리에 올랐다. 그는 베일을 벗고 신하들 앞에 나타나 재판하고 군을 이끌었으며, 자기 이름으로 화폐를 찍었다. 이슬람 세계 역사에서 드문 여성 군주였다. 그러나 '40인'은 권력을 나눠 주지 않으려 했고, 라지야가 아비시니아 출신 자말 웃딘 야쿠트를 마구간 총감으로 높이자 튀르크 귀족들이 반발했다. 1240년 타바린다(지금 바티다)의 총독 알투니야가 반란을 일으켜 야쿠트를 죽이고 라지야를 가뒀다. 라지야는 알투니야와 혼인해 델리로 진군했으나 이복형제 무이즈 웃딘 바흐람 샤의 군에 져 달아났고, 1240년 10월 카이탈 근처에서 살해됐다. 『타바카트 이 나시리』의 저자 민하지 시라지는 그의 능력을 높이 평가하면서도 '여성이라 모든 자질이 소용없었다'고 썼다. 바흐람 샤 때인 1241년 몽골군이 라호르를 약탈하며 펀자브 방어선이 흔들렸다. 라지야 이후 바흐람 샤(재위 1240~1242)와 마수드 샤(재위 1242~1246)가 차례로 세워졌다가 폐위되는 일이 이어져, 이 시기 술탄의 자리가 '40인'의 손에 달려 있었음을 보여 준다. 라지야의 죽음에 관해서도 연대기마다 장소와 가해자가 다르게 전해진다. 일부 연구자는 이 갈등의 핵심이 술탄의 성별보다 튀르크 노예 군인 집단과 지방 총독, 법학자 사이의 권력 배분에 있었다고 해석한다."
  subjects: [delhi-sultanate]
  tags: [politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Minhaj-i-Siraj, Tabakat-i-Nasiri, trans. H. G. Raverty (Asiatic Society of Bengal, 1881)", "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (Permanent Black, 2007)"]

- id: balban-mongols-1246
  year: 1246
  endYear: 1287
  title:
    ko: "몽골의 침입과 발반의 델리 통치(1246~1287)"
  summary:
    ko: "1241년 몽골군이 라호르를 약탈한 뒤 펀자브는 몽골과 델리가 번갈아 다스리는 변경이 됐다. 이 변경을 지킨 사람이 일투트미시의 노예 출신 장군 기야스 웃딘 발반이다. 그는 1246년부터 술탄 나시르 웃딘 마흐무드(재위 1246~1266)의 재상 겸 섭정으로 실권을 쥐고, 반란을 일으킨 귀족과 메와트 약탈자들을 토벌하며 도아브의 숲을 베어 길을 냈다. 1266년 마흐무드가 죽자 발반이 술탄에 올랐다. 그는 '40인' 귀족 집단을 해체하고, 군 명부(디완 이 아르즈)를 정비하고, 정보원을 두고, 궁정에 페르시아식 엎드려 절하기와 발에 입 맞추기 의례를 도입해 술탄의 권위를 높였다. 서북 변경에서는 비아스강 쪽에 요새를 쌓았으나 1285년 맏아들 무함마드가 물탄 근처에서 몽골과 싸우다 죽었다. 시인 아미르 쿠스라우는 이때 포로가 됐다가 풀려났다. 벵골에서는 총독 투그릴이 1279년 무렵 독립을 선언하자 발반이 1281~1282년 직접 군대를 이끌고 가 라크나우티를 되찾았다. 투그릴이 소나르가온 쪽으로 달아날 때 이곳의 데바 왕조 지배자가 길을 막겠다고 약속했다고 바라니는 적었다. 발반은 아들 부그라 칸을 벵골 총독에 앉혔고, 1287년 죽은 뒤 부그라 칸의 가문이 라크나우티를 사실상 독립적으로 다스렸다. 이 시기 델리와 펀자브에서는 수피 성자 바바 파리드(1266년 사망)와 그의 제자 니자무딘 아울리아가 활동했고, 시인 아미르 쿠스라우(1253~1325)가 델리 궁정에서 페르시아어 시를 썼다. 발반이 죽은 뒤 손자 카이쿠바드(재위 1287~1290)가 즉위했으나 곧 할지 가문이 권력을 잡는다. 바라니에 따르면 발반은 천한 집안 출신 관리의 임용을 막았다고 한다. 델리의 도시 질서도 그의 치세에 정비됐다."
  subjects: [delhi-sultanate, deva-dynasty-bengal]
  links:
    - { from: delhi-sultanate, to: deva-dynasty-bengal, note: "발반의 벵골 원정으로 동벵골 지배자가 델리의 영향권에 들어옴 (1281)" }
  tags: [politics, war]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Sunil Kumar, The Emergence of the Delhi Sultanate, 1192–1286 (Permanent Black, 2007)", "Ziauddin Barani, Tarikh-i Firuz Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 3 (Trübner, 1871)"]

- id: alauddin-khalji-1290
  year: 1290
  endYear: 1306
  title:
    ko: "할지 혁명과 알라웃딘 할지의 정복·시장 통제(1290~1306)"
  summary:
    ko: "1290년 잘랄 웃딘 피루즈 할지가 발반 가문의 어린 술탄을 제치고 즉위하면서 튀르크계 귀족이 독점하던 델리의 권력이 할지 가문으로 넘어갔다. 이를 '할지 혁명'이라 부르기도 한다. 1296년 조카 알라웃딘이 데바기리의 야다바 왕국을 기습해 막대한 전리품을 얻은 뒤 카라에서 삼촌을 죽이고 술탄이 됐다. 그는 곧 두 가지 문제에 맞섰다. 첫째는 몽골이다. 차가타이 칸국의 군대가 1299년 델리를 포위하고 1303년 두 달 동안 도성 밖을 점령했다. 1305년 아므로하와 1306년 라비강에서 몽골군을 격파하면서 침입이 잦아들었다(「카이두의 도전과 몽골 제국의 칸국 분열(1266~1304)」, 앞의 사건). 이를 위해 알라웃딘은 상비군을 현금으로 먹였는데, 바라니는 기병 한 명의 연봉을 234탕카로 적었다. 둘째는 그 군대를 유지할 재원이다. 그는 도아브의 곡물 수확 절반을 세금으로 거뒀고, 델리의 곡식·옷감·말·가축 가격을 법으로 정해 어기면 처벌했으며, 정보원이 시장을 감시했다. 이 통제를 국가의 경제 개입 실험으로 높이 평가하는 연구자도 있고, 델리에만 한정됐으며 그의 죽음 뒤 곧 무너졌다고 보는 연구자도 있다. 정복도 이어졌다. 1299년 구자라트 원정은 바겔라 왕 카르나가 데바기리로 달아나고 1304년 최종 병합으로 마무리됐다(찰루키아 왕가의 끝). 1301년 란탐보르는 하미라 데바가 죽고 차하마나 왕가가 끝났으며, 1303년 메와르 주의 도읍 치토르를 차지했다. 연대기를 쓴 아미르 쿠스라우는 치토르에서 3만 명이 죽었다고 적었는데 과장일 수 있고, 라니 파드미니 이야기는 1540년 자야시의 서사시에서 처음 나온 전설이다. 1305년에는 말와의 파라마라 왕조가 무너졌다. 알라웃딘은 건축에서도 시리 요새(1303 무렵)와 쿠트브 미나르 곁의 알라이 다르와자(1311)를 남겼다."
  subjects: [delhi-sultanate, yadava-dynasty, chaulukya-dynasty, chahamana-dynasty, paramara-dynasty, mewar-state]
  links:
    - { from: delhi-sultanate, to: chaulukya-dynasty, note: "구자라트 원정으로 바겔라 왕 카르나를 몰아냄 (1299~1304)" }
    - { from: delhi-sultanate, to: chahamana-dynasty, note: "란탐보르 요새를 함락해 차하마나 왕가를 끝냄 (1301)" }
    - { from: delhi-sultanate, to: paramara-dynasty, note: "말와 원정으로 파라마라 왕가를 끝냄 (1305)" }
  tags: [war, politics, economy]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Abraham Eraly, The Age of Wrath: A History of the Delhi Sultanate (Penguin Viking, 2014)", "Ziauddin Barani, Tarikh-i Firuz Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 3 (Trübner, 1871)"]

- id: malik-kafur-deccan-1307
  year: 1307
  endYear: 1317
  title:
    ko: "말리크 카푸르의 데칸 원정과 야다바 왕국의 병합(1307~1317)"
  summary:
    ko: "알라웃딘 할지는 1306~1307년 즈음부터 북인도를 넘어 데칸으로 눈을 돌렸고, 노예 출신 환관 장군 말리크 카푸르가 원정군을 이끌었다. 1307~1308년 데바기리의 야다바 왕 라마찬드라는 항복해 델리로 불려 간 뒤 공납을 약속받고 복위했다. 1309~1310년 카푸르는 와랑갈의 카카티야 왕 프라타파루드라를 포위했고, 왕은 막대한 보물과 매년의 공납을 약속하고 물러가게 했다. 1310~1311년에는 드와라사무드라의 호이살라 왕 발랄라 3세가 공납을 약속했고, 카푸르는 남쪽 마두라이까지 내려가 판디아 왕자들의 다툼을 틈타 사원을 약탈했다. 바라니와 이사미는 델리로 가져간 전리품의 코끼리·말·금 수량을 서로 다르게 적었다. 이때 세 나라(카카티야·호이살라·판디아)는 군대 주둔 없이 공납만 바쳐 델리의 종주권 아래 들어갔고, 병합이 아니라 공납 관계였다. 1311년 무렵 라마찬드라가 죽은 뒤 아들 샹카라데바가 공납을 끊자 1313년 카푸르가 다시 군대를 보내 그를 죽였다. 1316년 알라웃딘이 죽고 카푸르도 곧 살해됐다. 새 술탄 쿠트브 웃딘 무바라크 샤 때 하라팔라데바가 데바기리에서 반란을 일으키자 1317년 무렵 술탄이 직접 내려가 그를 죽이고 데바기리를 델리 총독의 직할지로 삼아 야다바 왕가를 끝냈다. 이때 북쪽 분델칸드의 찬델라 왕가는 14세기 초 해미라바르만의 비문을 마지막으로 기록에서 사라진다. 이 원정들로 델리의 지배가 데칸 북부와 서부까지 닿았다. 말리크 카푸르는 1299년 구자라트 원정에서 사로잡힌 노예 출신으로 알라웃딘의 신임을 얻은 것으로 전해진다. 시인 아미르 쿠스라우와 이사미의 시 형식 연대기가 이 원정들을 가장 자세히 전하지만, 둘 다 델리 궁정의 시각에서 쓰였다는 점을 감안해야 한다."
  subjects: [delhi-sultanate, yadava-dynasty, kakatiya-dynasty, hoysala-dynasty, pandya-dynasty, chandela-dynasty]
  links:
    - { from: delhi-sultanate, to: yadava-dynasty, note: "데바기리를 직할지로 병합 (1317)" }
  tags: [war, politics]
  sources: ["Peter Jackson, The Delhi Sultanate: A Political and Military History (Cambridge University Press, 1999)", "Abraham Eraly, The Age of Wrath: A History of the Delhi Sultanate (Penguin Viking, 2014)", "Richard M. Eaton, A Social History of the Deccan, 1300–1761: Eight Indian Lives (Cambridge University Press, 2005)", "Ziauddin Barani, Tarikh-i Firuz Shahi, in H. M. Elliot·John Dowson, The History of India, as Told by Its Own Historians, vol. 3 (Trübner, 1871)"]

- id: tughluq-dynasty-1320
  year: 1320
  endYear: 1325
  title:
    ko: "투글루크 왕조의 성립과 와랑갈·마두라이의 정복(1320~1325)"
  summary:
    ko: "1316년 알라웃딘이 죽은 뒤 델리는 술탄이 연이어 바뀌는 혼란에 빠졌고, 1320년 구자라트 출신 개종자 호스로 칸이 무바라크 샤를 죽이고 권력을 잡았다. 그러나 펀자브 디팔푸르의 총독 가지 말리크가 군을 이끌고 와 호스로 칸을 꺾고 1320년 9월 기야스 웃딘 투글루크라는 이름으로 즉위하면서 투글루크 왕조가 열렸다. 그는 몽골을 여러 차례 물리친 변경 사령관이었고, 델리 근처에 투글루카바드 요새를 쌓았다. 1321년 아들 울루그 칸(뒤의 무함마드 빈 투글루크)이 와랑갈의 프라타파루드라를 공격했으나 술탄이 죽었다는 소문과 군 내 반란으로 물러났다. 1323년 두 번째 원정에서 와랑갈이 함락되자 카카티야 왕가는 끝났고 프라타파루드라는 델리로 끌려가다 죽었다고 전한다. 같은 해 델리 군은 마두라이를 차지하고 판디아 왕가의 땅을 마아바르 주로 삼았다. 1324년에는 술탄이 직접 벵골로 가서 라크나우티를 델리 아래 다시 두고 티르후트(미틸라)의 카르나타 왕 하리심하데바를 몰아냈다. 하리심하데바는 네팔 쪽으로 달아났고 카르나타 왕조는 이 무렵 끝났다. 기야스 웃딘은 1325년 2월 벵골에서 돌아오던 길에 아들이 세운 임시 건물이 무너져 죽었다. 사고라는 설과 아들이 꾸민 일이라는 설이 모두 있으며, 이븐 바투타가 후자를 전한다. 투글루크 가문은 튀르크 출신 아버지와 자트 출신 어머니를 둔 변경 무장 집안이었다. 기야스 웃딘은 농업과 관개를 권장하고 역참 제도를 정비했다고 전하며, 수피 성자 니자무딘 아울리아와 사이가 나빠 성자가 '델리는 아직 멀다'고 말했다는 일화가 남아 있다. 투글루카바드(1321~1323)는 거대한 석조 요새였으나 물 부족 등으로 곧 쓰이지 않게 됐다."
  subjects: [delhi-sultanate, kakatiya-dynasty, pandya-dynasty, karnat-dynasty]
  links:
    - { from: delhi-sultanate, to: kakatiya-dynasty, note: "와랑갈을 함락해 카카티야 왕가를 끝냄 (1323)" }
    - { from: delhi-sultanate, to: pandya-dynasty, note: "마두라이를 차지해 마아바르 주를 세움 (1323)" }
