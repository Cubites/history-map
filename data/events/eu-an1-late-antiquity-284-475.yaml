- id: euric-visigoths-456
  year: 456
  endYear: 475
  title:
    ko: "테오도리쿠스 2세와 에우리크의 서고트 왕국: 히스파니아와 갈리아의 확장(456~475)"
  summary:
    ko: "서고트 왕 테오도리쿠스 2세는 453년 형 토리스문드를 죽이고 왕이 되어 455년 서로마 황제 아비투스를 세우는 데 힘을 보탰고, 456년 10월 5일 오르비고강에서 수에비 왕 레키아르를 꺾어 히스파니아 서쪽을 휩쓸었다. 아비투스가 456년 폐위된 뒤 마요리아누스가 갈리아를 되찾으려 했으나 서고트는 458~459년 아를 부근에서 막혀 조약을 맺었다. 마요리아누스가 461년 죽자 서고트는 462년 나르본을 얻었다(아그리피누스의 양도, 히다티우스). 466년 동생 에우리크가 테오도리쿠스를 죽이고 왕이 되었다. 에우리크(466~484)는 469년 무렵 데올 부근에서 '브리튼인의 왕' 리오타무스(브리튼인 왕국 쪽 사람으로 보이나 출신은 확실하지 않다)의 군대를 격파하고 베리와 오베르뉴 쪽을 위협했으며 471년 아를에서 로마군을 눌렀다. 시도니우스가 주교로 있던 클레르몽은 에크디키우스가 475년까지 버텼으나 율리우스 네포스가 아르베르니를 서고트에 넘겼다. 같은 때 에우리크의 장군들이 472~473년 팜플로나·사라고사를 차지하고 카르타기넨시스를 얻어 히스파니아 대부분을 장악했다. 에우리크 때 나온 법전(475년 무렵, 476년설도 있다)은 서고트 법의 첫 성문법이다. 아를과 마르세유는 476년에 얻는다(뒤의 사건). 지도는 457년 루시타니아·바이티카, 462년 나르본·노벰포풀라니아 남부, 471년 아키텐 1주·님·투르, 473년 타라코넨시스 내륙과 카르타기넨시스, 475년 아르베르니와 타라코 해안을 서고트 땅으로 그리며 468년 포르투갈 중부는 수에비 땅으로 돌린다."
  subjects: [visigothic-kingdom, suebi-kingdom, western-roman-empire, brittonic-kingdoms]
  links:
