- id: christian-recognition-313
  year: 313
  endYear: 325
  title:
    ko: "그리스도교의 공인: 밀라노 협약(313)과 니케아 공의회(325)"
  summary:
    ko: "313년 로마 제국의 두 정제 콘스탄티누스와 리키니우스가 밀라노에서 만나 누구나 자기가 고른 신앙을 따를 자유와 몰수한 교회 재산의 반환에 합의했다(흔히 '밀라노 칙령'이라 하나 락탄티우스와 에우세비오스가 전하는 리키니우스의 동방 포고가 남아 있을 뿐이고, 하나의 칙령이 아니었다고 보는 학자가 많다). 콘스탄티누스는 교회에 세금 면제와 재판권 같은 혜택을 주고 321년 일요일을 쉬는 날로 정했지만 이교 제사를 곧바로 금하지는 않았다. 교회 안에서는 북아프리카의 도나투스파 분열과, 알렉산드리아 사제 아리우스가 성자는 성부와 같은 본질이 아니라고 가르친다는 주교 알렉산드로스의 단죄가 불거졌고 황제가 개입했다. 325년 5월 니케아에 모인 공의회(참석 주교는 300명 안팎이라 하나 사료마다 다르다)는 성자가 성부와 '같은 본질(호모우시오스)'이라는 니케아 신경을 채택하고 아리우스를 추방했으며 부활절 날짜를 정하는 원칙을 세웠다. 알렉산드리아의 부제로 따라갔다가 328년 주교가 된 아타나시오스는 평생 이 신경을 지켰다. 결정이 곧 받아들여진 것은 아니어서 아리우스를 둘러싼 다툼은 380년대까지 이어졌다(뒤의 사건). 콘스탄티누스는 337년 죽기 직전 니코메디아의 에우세비오스에게 세례를 받았다."
  subjects: [roman-empire]
  tags: [religion, politics]
  sources: ["Eusebius, The History of the Church from Christ to Constantine (G. A. Williamson 영역, 1965)", "Lactantius, De mortibus persecutorum (J. L. Creed 영역, 1984)", "Henry Chadwick, The Church in Ancient Society: From Galilee to Gregory the Great (2001)", "Timothy D. Barnes, Constantine and Eusebius (1981)", "Noel Lenski 엮음, The Cambridge Companion to the Age of Constantine (2006)"]

- id: constantinople-324
  year: 324
  endYear: 337
  title:
    ko: "콘스탄티노폴리스의 건설(324~330)과 콘스탄티누스의 죽음(337)"
  summary:
    ko: "단독 황제가 된 콘스탄티누스는 324년 옛 그리스 도시 비잔티온을 새 수도로 삼기로 하고 성벽을 넓혀, 330년 5월 11일 '새 로마'를 봉헌했다(황제의 이름을 딴 콘스탄티노폴리스로 불렸다). 이곳에는 원로원과 곡물 배급, 경주장·궁전·성당을 두어 제2의 로마로 꾸몄다. 309~310년에 금화 솔리두스를 내어 통화를 안정시켰고, 군대를 황제의 이동군(코미타텐세스)과 변경군(리미타네이)으로 나누고 문관과 무관을 갈라 디오클레티아누스의 틀을 굳혔다. 332년 도나우강 북쪽의 게르만계 고트족을 눌러 조약을 맺었고, 334년에는 사르마티아·알란 부족 가운데 사르마티아인의 내분 뒤 많은 수를 제국 안에 정착시켰다(30만 명이라 전하나 믿기 어렵다). 337년 5월 22일 페르시아 원정을 준비하다 니코메디아 가까이에서 죽었고, 몇 달 뒤 군대가 이복형제와 조카 등 친족 여럿을 죽인 끝에 세 아들 콘스탄티누스 2세·콘스탄티우스 2세·콘스탄스가 정제가 되어 제국을 나누었다(뒤의 사건). 이후 콘스탄티노폴리스는 395년 동로마 제국의 수도가 되어 1453년 오스만 제국에 정복될 때까지 이어진다."
  subjects: [roman-empire, germanic-tribes, sarmatian-alan-tribes]
  tags: [politics, society]
  sources: ["게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)", "Timothy D. Barnes, Constantine: Dynasty, Religion and Power in the Later Roman Empire (2011)", "Eusebius, Life of Constantine (Averil Cameron·Stuart G. Hall 영역, 1999)", "Zosimus, New History(『새 역사』) (Ronald T. Ridley 영역, 1982)", "Averil Cameron, The Later Roman Empire: AD 284–430 (1993)"]

- id: constantius-julian-337
  year: 337
  endYear: 363
  title:
    ko: "콘스탄티누스의 아들들과 율리아누스(337~363)"
  summary:
    ko: "337년 로마 제국의 정제가 된 세 아들 가운데 콘스탄티누스 2세는 340년 동생 콘스탄스와 싸우다 죽었고, 콘스탄스는 350년 장군 마그넨티우스에게 살해되었다(같은 해 판노니아에서 베트라니오가, 로마에서 네포티아누스가 황제를 칭했으나 베트라니오는 물러났고 네포티아누스는 죽었다). 콘스탄티우스 2세는 351년 9월 28일 무르사에서 마그넨티우스를 꺾어(양쪽 전사자가 5만 4천 명이라는 조시모스의 수는 과장일 수 있다) 353년 마그넨티우스가 자결하자 홀로 제국을 차지했다. 콘스탄티우스는 354년 부제 갈루스를 처형한 뒤 355년 사촌 율리아누스를 부제로 삼아 갈리아로 보냈다. 율리아누스는 357년 스트라스부르(아르겐토라툼) 부근에서 알레만인(게르만 부족) 왕 크노도마리우스를 사로잡았고, 358년 살리 프랑크를 톡산드리아에 받아들였다(뒤의 사건). 360년 파리에서 군대가 율리아누스를 정제로 추대하자 콘스탄티우스가 맞서려다 361년 11월 병으로 죽었다. 단독 황제 율리아누스는 그리스도교로 자랐으나 옛 신들의 신전을 되살리고, 362년 그리스도교인 교사가 고전을 가르치지 못하게 하는 칙령을 내려 반발을 샀다(그리스도교 쪽은 그를 '배교자'라 불렀고 이 별칭이 통용된다). 363년 3월 안티오키아에서 사산 원정을 떠났다가 6월 26일 퇴각 중 전사했고 장군 요비아누스가 뒤를 이어 이듬해 죽었다(앞의 사건). 지도는 사두 정치 이후의 분담을 그리지 않는다."
  subjects: [roman-empire, germanic-tribes]
  tags: [politics, war, religion]
  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Zosimus, New History(『새 역사』) (Ronald T. Ridley 영역, 1982)", "G. W. Bowersock, Julian the Apostate (1978)", "Averil Cameron·Peter Garnsey 엮음, The Cambridge Ancient History XIII: The Late Empire, A.D. 337–425 (1998)", "Averil Cameron, The Later Roman Empire: AD 284–430 (1993)"]
