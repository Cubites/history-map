- id: catalaunian-451
  year: 451
  endYear: 453
  title:
    ko: "카탈라우눔 평원 전투(451)와 아틸라의 이탈리아 원정(452)·죽음(453)"
  summary:
    ko: "450년 서로마 황제의 누이 호노리아가 보낸 구혼을 빌미로 아틸라는 지참금으로 서로마 땅의 절반을 요구했고, 451년 봄 라인강을 건너 갈리아로 들어왔다. 군대는 훈 제국의 훈과 게피드·동고트·루기·스키리 같은 게르만 부족 신민의 연합이었고 수는 알 수 없다. 4월 7일 메스가 불탔고 6월 오를레앙 포위는 로마와 서고트 구원군이 와서 풀렸다. 서로마 장군 아이티우스는 서고트 왕 테오도리쿠스 1세, 알란 왕 상기반, 부르군트, 프랑크, 아르모리카인 등을 모아 6월 20일 무렵 카탈라우눔 평원(상파뉴, 샬롱이나 트루아 부근이나 정확한 곳은 알 수 없다)에서 맞섰다. 테오도리쿠스는 전사했고 아틸라는 마차 진으로 물러났다. 요르다네스는 사상자를 16만 5천 명으로, 히다티우스는 30만 명으로 적으나 과장이다. 아이티우스는 서고트를 돌려보내고 추격하지 않았다. 452년 아틸라는 이탈리아로 들어와 아퀼레이아를 함락시켜 파괴했고(주민이 석호로 피해 베네치아가 시작되었다는 전승이 있다) 포강 유역을 약탈한 뒤 만토바 부근 민초강에서 교황 레오 1세의 사절단을 만나 물러났다. 전염병과 보급 문제, 동로마 마르키아누스가 도나우강 방면을 쳤다는 사정이 더 컸다고 본다. 453년 아틸라는 새 아내 일디코와의 혼인 잔치 밤에 출혈로 죽었다(프리스쿠스를 인용한 요르다네스). 지도는 451~452년의 원정을 그리지 않는다."
  subjects: [hunnic-empire, western-roman-empire, visigothic-kingdom, burgundian-kingdom, byzantine-empire, germanic-tribes]
  links:
    - { from: hunnic-empire, to: western-roman-empire, note: "갈리아와 이탈리아 원정(451~452)" }
    - { from: visigothic-kingdom, to: hunnic-empire, note: "카탈라우눔 전투(451)" }
  tags: [war]
  sources: ["Jordanes, The Gothic History of Jordanes (Charles C. Mierow 영역, 1915)", "Hydatius, Chronicle(『연대기』) (R. W. Burgess 영역, 1993)", "R. C. Blockley 엮음·옮김, The Fragmentary Classicising Historians of the Later Roman Empire, 2권 (1983)", "Christopher Kelly, Attila the Hun: Barbarian Terror and the Fall of the Roman Empire (2008)", "Peter Heather, The Fall of the Roman Empire (2005)"]
