- id: theodosius-i-379
  year: 379
  endYear: 395
  title:
    ko: "테오도시우스 1세: 테살로니키 칙령(380)·학살(390)·프리기두스 전투(394)와 395년의 동서 분리"
  summary:
    ko: "테오도시우스 1세(재위 379~395)는 380년 2월 27일 콘스탄티노폴리스 시민에게 내린 칙령에서 모든 백성이 사도 베드로가 전한 신앙, 곧 니케아 신앙을 따르라고 명했고, 381년 콘스탄티노폴리스 공의회에서 니케아 신경이 다시 확정되어 아리우스파는 예배와 공직의 제약을 받았다. 383년 브리타니아에서 마그누스 막시무스가 황제를 칭해 그라티아누스를 죽이고 갈리아·브리타니아·히스파니아를 차지했다. 387년 이탈리아로 쳐들어와 공동 정제 발렌티니아누스 2세를 동방으로 쫓아냈으나 388년 시스키아(사바강)와 포에토비오(드라바강)에서 테오도시우스에게 지고 아퀼레이아에서 처형되었다(8월 28일). 388년 칼리니쿰에서 그곳 주교가 부추긴 무리가 유대 회당을 태우자 황제가 주교에게 재건을 명했으나 밀라노 주교 암브로시우스가 반대해 물러났다. 390년 테살로니키에서 군사령관 부테리크가 군중에게 죽자 황제의 명(또는 군의 과잉 진압)으로 군중이 경기장에서 학살되었는데 테오도레토스는 7천 명이라 적는다(사료의 수). 암브로시우스가 한동안 황제를 성찬에서 배제해 참회하게 했다. 391~392년 칙령으로 이교 제사를 금했고 알렉산드리아 주교 테오필로스가 이끈 그리스도교인들이 군대의 도움으로 세라페움을 헐었다(391). 발렌티니아누스 2세가 392년 5월 죽자(자살인지 살해인지 사료가 갈린다) 장군 아르보가스트(게르만 부족인 프랑크 출신)가 문관 에우게니우스를 서방 황제로 세우자 테오도시우스는 394년 9월 5~6일 프리기두스강 가에서 격파했다(아르보가스트는 자결). 395년 1월 17일 밀라노에서 죽으며 제국을 두 아들, 서쪽 호노리우스와 동쪽 아르카디우스에게 맡겼다. 387년 아르메니아 분할은 따로 있다(뒤의 사건). 지도는 395년부터 서로마와 동로마로 그린다."
  subjects: [roman-empire, western-roman-empire, byzantine-empire, germanic-tribes]
  links:
