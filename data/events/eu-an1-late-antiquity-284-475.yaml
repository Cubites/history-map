- id: attila-huns-420
  year: 420
  endYear: 450
  title:
    ko: "훈 제국의 전성기: 루아와 아틸라, 동로마의 공납(420~450)"
  summary:
    ko: "훈은 5세기 초 중심을 판노니아 평원(지금의 헝가리)으로 옮겨 게르만·사르마티아 부족을 거느린 연합체가 되었다. 서로마의 아이티우스가 훈에 머문 적이 있어 훈 용병을 자주 썼고 433년 무렵 판노니아 일부를 훈에 넘겼다는 서술이 있다. 울딘(400 무렵)과 카라톤(412) 같은 왕을 거쳐 루아의 형제 옥타르가 430년 무렵 죽은 뒤 홀로 다스리던 루아가 434년 죽자 조카 블레다와 아틸라가 함께 다스렸고, 435년 마르구스에서 동로마가 공납을 해마다 금 350파운드에서 700파운드로 두 배 올렸다(프리스쿠스). 441년 훈은 마르구스 주교가 훈 왕의 무덤을 도굴했다는 구실로 도나우강을 건너 싱기두눔·시르미움을 차지했고, 443년 나이수스·세르디카까지 쳐서 동로마에서 밀린 공납 6천 파운드와 해마다 2천 1백 파운드를 받기로 했다. 445년 아틸라가 블레다를 죽이고 홀로 왕이 되었다. 447년 우투스강에서 동로마군을 꺾고 발칸을 휩쓸어 테르모필레까지 이르렀으나 콘스탄티노폴리스는 재건한 성벽으로 지켜졌고 아나톨리우스가 맺은 조약으로 도나우강 남쪽 '닷새 길' 띠를 훈에 넘기고 물러났다. 449년 동로마 사절 막시미누스와 역사가 프리스쿠스가 아틸라의 막사를 찾은 이야기가 프리스쿠스의 단편에 남아 있다(손님을 후하게 맞는 모습도 적는다). 450년 서로마 황제의 누이 호노리아가 반지와 함께 구혼을 보냈다고 알려져 아틸라는 이를 구실로 서쪽으로 향했다(뒤의 사건). 지도는 420년 판노니아 평원과 트란실바니아, 433년 판노니아, 441년 시르미움, 447년 아나톨리우스의 띠를 훈 제국 땅으로 그린다."
  subjects: [hunnic-empire, byzantine-empire, western-roman-empire, germanic-tribes]
  links:
    - { from: hunnic-empire, to: byzantine-empire, note: "공납과 도나우강 남쪽 땅(435~447)" }
    - { from: western-roman-empire, to: hunnic-empire, note: "판노니아 양도(433 무렵)" }
  tags: [war, diplomacy]
  sources: ["R. C. Blockley 엮음·옮김, The Fragmentary Classicising Historians of the Later Roman Empire, 2권 (1983)", "Christopher Kelly, Attila the Hun: Barbarian Terror and the Fall of the Roman Empire (2008)", "E. A. Thompson, The Huns (Peter Heather 개정, 1996)", "Otto J. Maenchen-Helfen, The World of the Huns (1973)", "Jordanes, The Gothic History of Jordanes (Charles C. Mierow 영역, 1915)"]
  places: [{ name: 싱기두눔(베오그라드), at: [20.46, 44.82], year: 441 }, { name: 시르미움(스렘스카미트로비차), at: [19.6, 44.97], year: 441 }, { name: 나이수스(니시), at: [21.9, 43.32], year: 443 }, { name: 우투스강(비트강) 하구, at: [24.74, 43.68], year: 447 }]

- id: vandal-africa-429
  year: 429
  endYear: 456
  title:
    ko: "가이세리크의 반달 왕국: 아프리카 이동(429)·카르타고(439)·로마 약탈(455)"
  summary:
    ko: "가이세리크(재위 428~477)는 429년 5월 반달과 알란을 이끌고 지브롤터 해협을 건너 북아프리카로 갔다. 아프리카 총독 보니파키우스가 불렀다는 프로코피우스의 이야기는 믿기 어렵다고 보는 학자가 많다. 430년 5월부터 히포 레기우스를 14개월 포위했고 포위 중 8월 28일 주교 아우구스티누스가 죽었다. 435년 조약으로 누미디아 일부의 정착을 인정받았다가, 439년 10월 19일 카르타고를 불시에 점령하며 서로마의 곡창을 쥐었다. 442년 조약으로 아프리카 프로콘술라리스·비자케나와 누미디아 일부를 차지하고 서로마에는 모레타니아와 누미디아 서부를 남겼다(트리폴리타니아가 누구 몫이었는지는 사료가 갈린다). 아리우스파인 반달 왕은 가톨릭 주교와 사제를 쫓고 교회 재산을 몰수했다고 가톨릭 쪽 사료(빅토르 비텐시스)가 적는데 선전이 섞여 있다. 455년 3월 발렌티니아누스 3세가 암살되자 가이세리크는 6월 로마에 닿아 약 2주 동안 약탈했다. 교황 레오 1세의 간청으로 사람을 죽이거나 도시를 불태우지는 않았으나 보물과 황후 에우독시아, 두 딸을 끌고 갔고 딸 에우도키아는 가이세리크의 아들 훈네리크와 혼인했다. 이어 사르데냐·코르시카·발레아레스를 차지했다. 이 무렵 북아프리카는 이 구간 지도에 없고 지도는 456년 세 섬을 반달 땅으로 그린다. 468년 동로마의 원정이 실패한다(뒤의 사건)."
  subjects: [vandal-kingdom, western-roman-empire]
  links:
    - { from: vandal-kingdom, to: western-roman-empire, note: "로마 약탈(455)과 섬들(456)" }
  tags: [war, politics]
  sources: ["Andy Merrills·Richard Miles, The Vandals (2010)", "Victor of Vita, History of the Vandal Persecution (John Moorhead 영역, 1992)", "Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Hydatius, Chronicle(『연대기』) (R. W. Burgess 영역, 1993)", "R. C. Blockley 엮음·옮김, The Fragmentary Classicising Historians of the Later Roman Empire, 2권 (1983)"]
