- id: burgundians-411
  year: 411
  endYear: 474
  title:
    ko: "부르군트 왕국: 보름스(413)·훈의 공격(436)·사파우디아(443)"
  summary:
    ko: "라인강 동쪽의 게르만 부족 부르군트는 411년 마인츠에서 황제를 칭한 요비누스를 왕 군디카리우스(군다하르)가 알란 왕 고아르와 함께 지지하며 서쪽 역사에 나온다. 413년 로마는 이들을 라인강 왼쪽(마인츠·보름스·슈파이어 일대)에 동맹자로 정착시켰다(보름스는 『니벨룽의 노래』의 도읍이라는 전승에 기대어 정한 통설이다). 435년 아이티우스가 군디카리우스를 꺾어 강화했으나 곧 훈이 왕과 그 백성을 쓸어 버렸다고 프로스페르는 적고, 히다티우스는 437년 부르군트 2만 명이 죽었다고 적는다(숫자는 과장일 수 있고, 아이티우스가 훈 제국에서 온 용병을 썼다고 보는 것이 보통이다). 지도는 436년 보름스 왕국을 지우고 서로마 땅으로 돌린다. 443년 아이티우스가 살아남은 부르군트를 사파우디아(제네바호와 사부아)에 정착시켰다(『452년 갈리아 연대기』). 부르군트는 451년 카탈라우눔에서 서로마 편에 섰고(뒤의 사건), 456년 서고트의 히스파니아 원정(오르비고강 전투)에 왕 군디오크가 따랐다고 하며 형제 킬페리크 1세와 함께 다스렸다고 본다. 아이티우스가 죽고 로마의 중앙 권력이 흔들리자 457~458년 리옹 반란이 마요리아누스에게 눌렸다가(시도니우스) 461년 마요리아누스가 죽은 뒤 리옹을 차지했고, 470년대 비바레·가프·느베르 쪽과 아비뇽·발랑스로 퍼졌다(지도는 474년). 군디오크의 아들 군도바드는 472~473년 서로마의 파트리키우스로 있다가 돌아와 왕이 되었다(뒤의 사건)."
  subjects: [burgundian-kingdom, western-roman-empire, hunnic-empire, germanic-tribes]
