- id: sasanian-wars-296
  year: 296
  endYear: 363
  title:
    ko: "로마와 사산 페르시아: 갈레리우스의 승리와 니시비스 조약(298), 율리아누스의 원정과 요비아누스의 조약(363)"
  summary:
    ko: "사산 왕 나르세가 아르메니아에서 티리다테스 3세를 쫓아내자 로마는 296년(297년설도 있다) 반격에 나섰으나 부제 갈레리우스가 칼리니쿰 부근에서 졌다. 297~298년 갈레리우스는 아르메니아의 사탈라 가까이에서 나르세의 진영을 쳐 왕의 아내와 딸들을 사로잡았고, 298년(299년설도 있다) 니시비스에서 맺은 조약(6세기 페트로스 파트리키오스의 기록)으로 티그리스강 건너 다섯 지방(인길레네·소페네·아르자네네·코르두에네·자브디케네)을 얻었으며 아르메니아 왕을 지키고 이베리아(카르틀리)의 왕을 로마가 세우기로 했다. 이 평화는 40년쯤 이어졌다. 샤푸르 2세(재위 309~379)는 337년 콘스탄티누스 1세가 죽은 직후 전쟁을 되살려 니시비스를 거듭 포위했고(338·346·350), 359년 아미다를 함락시켰다. 363년 율리아누스가 크테시폰 앞까지 진격했다가 퇴각 중 6월 26일 전사하자 군대가 추대한 요비아누스는 30년 평화를 맺으며 니시비스와 싱가라(카스트라 마우로룸 포함), 티그리스강 건너 다섯 지방(298년의 목록과 달리 아르자네네·모크소에네·자브디케네·레히메네·코르두에네, 암미아누스)을 사산에 넘기고 아르메니아를 돕지 않기로 했다(암미아누스는 이를 치욕으로 적는다). 지도는 298년부터 소페네 등 남쪽 사트라피아를 로마로 그리고, 363년 아르자네네·코르두에네 등을 사산 땅이라 비운다. 니시비스는 근사로 로마·동로마 땅에 둔다."
  subjects: [roman-empire, arsacid-armenia, iberia-kingdom]
  links:
    - { from: roman-empire, to: arsacid-armenia, note: "니시비스 조약(298)과 아르메니아 방치(363)" }
    - { from: roman-empire, to: iberia-kingdom, note: "이베리아 왕의 임명권(298)" }
  tags: [war, diplomacy]
  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Ehsan Yarshater 엮음, The Cambridge History of Iran 3(1): The Seleucid, Parthian and Sasanian Periods (1983)", "Touraj Daryaee, Sasanian Persia: The Rise and Fall of an Empire (2009)", "Timothy D. Barnes, The New Empire of Diocletian and Constantine (1982)", "G. W. Bowersock, Julian the Apostate (1978)"]
