  tags: [politics, society]
  sources: ["Zosimus, New History(『새 역사』) (Ronald T. Ridley 영역, 1982)", "Gildas, The Ruin of Britain and Other Works (Michael Winterbottom 영역, 1978)", "Robin Fleming, Britain after Rome: The Fall and Rise, 400 to 1070 (2010)", "A. S. Esmonde Cleary, The Ending of Roman Britain (1989)", "Peter Salway, Roman Britain (1981)"]

- id: suebi-hispania-409
  year: 409
  endYear: 469
  title:
    ko: "수에비 왕국: 갈라이키아에서 메리다(439)·오르비고강 전투(456)까지"
  summary:
    ko: "411년 제비뽑기로 수에비는 갈라이키아 서쪽(지금의 갈리시아와 북부 포르투갈)에, 하스딩 반달은 그 동쪽에 자리 잡았다. 헤르메리크(409 무렵~438)가 병들어 물러난 뒤 아들 레킬라(438~448)가 439년 메리다를, 441년 바이티카와 카르타기넨시스의 세비야 일대를 차지해 히스파니아에서 가장 강한 세력이 되었다. 448년 즉위한 레키아르는 서고트 왕 테오도리쿠스 1세의 딸과 혼인해 그의 사위가 되었고 타라코넨시스의 바스콘족 땅과 사라고사·레리다를 약탈했다. 카르타기넨시스는 로마에 돌아가 있었는데(지도는 453년) 수에비가 455년 다시 약탈하자 아비투스와 서고트가 사절을 보냈다고 히다티우스는 적는다. 서로마 황제 아비투스를 세운 서고트 왕 테오도리쿠스 2세가 456년 10월 5일 오르비고강 가에서 레키아르를 꺾었고, 레키아르는 포르투에서 사로잡혀 12월 처형되었다. 그 뒤 서고트가 세운 아이울프, 그 뒤 수에비가 뽑은 말드라스와 프루마리우스·레미스문드 같은 왕들이 다투는 사이 서고트의 영향이 커졌고, 히다티우스는 468년 코님브리가가 약탈되고 469년 리스본이 수에비에게 넘어갔다고 적는다(그의 연대기는 469년에 끝난다). 지도는 411년 수에비에 갈라이키아 서쪽을, 420년 갈라이키아 전체를, 439년 루시타니아를, 441년 바이티카·카르타기넨시스를 주었다가 457년 서고트가 루시타니아·바이티카를 차지하는 것으로, 468년 포르투갈 중부(코님브리가 일대)는 수에비 땅으로 돌려 그린다. 수에비 왕국은 585년까지 갈라이키아에 남는다(뒤의 사건)."
