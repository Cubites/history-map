- id: great-persecution-303
  year: 303
  endYear: 311
  title:
    ko: "그리스도교 대박해(303~311)와 갈레리우스의 관용 칙령"
  summary:
    ko: "디오클레티아누스는 로마 제국이 옛 신들의 보호로 유지된다는 생각에서, 부제 갈레리우스의 부추김(락탄티우스의 설명)도 받아 303년 2월 23일 무렵 니코메디아의 성당을 헐게 하고 이튿날 칙령으로 성당 파괴와 성서 소각을 명했으며 신자의 공직과 법적 권리를 빼앗았다. 이어 성직자를 가두라(303)는 칙령과 모든 사람에게 신들에게 제사를 지내라(304)는 칙령이 나왔다. 서쪽에서는 콘스탄티우스 1세가 성당만 헐고 신자는 해치지 않아 브리타니아·갈리아는 피해가 적었고, 막시미아누스의 이탈리아·히스파니아·아프리카와 갈레리우스·막시미누스 다이아의 동쪽에서는 심했다. 희생자는 수천 명으로 현대 학자는 3,000~3,500명쯤으로 어림하나(프렌드 등) 순교자 기록은 신자 쪽 사료가 부풀렸다는 비판이 있다. 박해 때 성서를 넘긴 성직자(트라디토레스)를 둘러싼 갈등은 북아프리카 도나투스파의 분열로 이어졌다. 한편 아르메니아에서는 전통 연대로 301년 무렵 티리다테스 3세가 그레고리오스에게 세례를 받고 그리스도교를 국교로 삼았다고 전한다. 305년 두 정제가 퇴위한 뒤에도 동쪽에서 이어지다가 311년 4월 30일 병든 갈레리우스가 신자의 신앙과 집회를 허용하는 칙령(세르디카 칙령이라고도 한다)을 냈다. 달마티아 라브섬의 석공 마리누스가 박해를 피해 티타노산에 정착해 산마리노를 세웠다는 전승이 있다(전승의 연대 301년은 대박해가 시작된 303년보다 앞서 어긋난다)."
  subjects: [roman-empire, arsacid-armenia, san-marino]
  tags: [society, religion]
  sources: ["Eusebius, The History of the Church from Christ to Constantine (G. A. Williamson 영역, 1965)", "Lactantius, De mortibus persecutorum (J. L. Creed 영역, 1984)", "W. H. C. Frend, Martyrdom and Persecution in the Early Church (1965)", "G. E. M. de Ste. Croix, Christian Persecution, Martyrdom, and Orthodoxy (Michael Whitby·Joseph Streeter 엮음, 2006)", "Timothy D. Barnes, Constantine and Eusebius (1981)"]

- id: constantine-rise-306
  year: 306
  endYear: 324
  title:
    ko: "콘스탄티누스의 등장: 요크의 추대(306)·밀비우스 다리(312)·리키니우스와의 내전(324)"
  summary:
    ko: "콘스탄티우스 1세 클로루스가 306년 7월 25일 요크(에보라쿰)에서 죽자 아버지의 군대가 아들 콘스탄티누스를 정제로 추대했고, 갈레리우스는 그를 부제로만 인정했다. 사두 정치가 무너져 막시미아누스의 아들 막센티우스가 306년 10월 로마에서 황제를 칭했고, 은퇴했던 막시미아누스도 한때 다시 정제를 칭했다가 310년 죽었다. 서쪽 정제가 된 세베루스 2세(306~307)는 막센티우스를 치다 져서 죽었고, 308년 카르눈툼 회의에서 리키니우스가 정제가 되었다. 콘스탄티누스는 312년 이탈리아로 쳐들어와 토리노·베로나를 얻은 뒤 10월 28일 로마 북쪽 밀비우스 다리 부근에서 막센티우스를 물리쳤다(막센티우스는 티베르강에서 익사했다). 전투 전에 하늘의 표지를 보고 병사의 방패에 그리스도의 표지를 새겼다고 하나, 락탄티우스는 꿈으로, 에우세비오스는 콘스탄티누스에게 들은 환상으로 달리 적는다. 313년 동쪽의 리키니우스에게 이복누이 콘스탄티아를 시집보내 손잡았고(그해 리키니우스는 동쪽의 막시미누스 다이아(305 부제, 310 정제)를 꺾어 죽게 했다), 316~317년 키발라이 등지에서 싸운 뒤 화해했다. 324년 7월 3일 아드리아노폴리스, 9월 18일 크리소폴리스에서 리키니우스를 꺾어 제국 전체의 단독 황제가 되었고 리키니우스는 324년에 세운 공동 정제 마르티니아누스와 함께 이듬해 처형되었다. 사두 정치의 분담은 지도에 그리지 않는다."
  subjects: [roman-empire]
  tags: [politics, war]
  sources: ["Timothy D. Barnes, Constantine and Eusebius (1981)", "Timothy D. Barnes, Constantine: Dynasty, Religion and Power in the Later Roman Empire (2011)", "Noel Lenski 엮음, The Cambridge Companion to the Age of Constantine (2006)", "Lactantius, De mortibus persecutorum (J. L. Creed 영역, 1984)", "Eusebius, Life of Constantine (Averil Cameron·Stuart G. Hall 영역, 1999)"]
