- id: nedao-454
  year: 454
  endYear: 469
  title:
    ko: "네다오 전투(454)와 훈 제국의 해체(469)"
  summary:
    ko: "아틸라가 죽자(453) 아들들이 제국을 나눠 다투었다. 454년 판노니아의 네다오 강가에서 게피드 왕 아르다리크가 이끈 반란 부족들(루기·스키리·헤룰리 등)이 아틸라의 맏아들 엘락이 이끈 훈과 그 편의 부족들을 크게 꺾었고 엘락이 죽었다(요르다네스는 3만 명이 죽었다고 적으나 숫자는 의심스럽다). 훈 제국은 사실상 무너져 게피드가 옛 다키아(트란실바니아·티서강 평원)를 차지했고(마르키아누스가 해마다 금 100파운드를 보조) 시르미움은 동고트가 판노니아를 떠난 473년에 얻었다(지도는 454년부터 시르미움까지 게피드 왕국으로 근사해 그린다). 서로마가 넘겼던 판노니아는 루기·스키리 같은 게르만 부족과 동고트가 차지했다. 동로마 황제 마르키아누스는 동고트를 동맹자로 판노니아에 받아들였다. 아틸라의 아들 뎅기지크와 에르낙은 도나우강 하류 북쪽 초원으로 물러났다. 463년 사라구르·우루구르·오노구르 같은 튀르크계 유목민이 흑해 북쪽에 새로 나타났다고 프리스쿠스는 적는다(지도는 454년부터 이 초원을 훈·불가르계 유목민으로 그린다). 468년 뎅기지크가 동로마를 치다 469년 장군 아나가스테스에게 패해 죽었고 그의 머리가 콘스탄티노폴리스에서 전시되었다(『부활절 연대기』). 에르낙은 도나우강 하류 쪽에 남았다고 요르다네스는 쓴다. 훈의 이름은 이후 불가르계 유목민의 호칭으로 이어졌다."
  subjects: [hunnic-empire, gepid-kingdom, hunnic-bulgar-tribes, byzantine-empire, germanic-tribes]
  links:
    - { from: gepid-kingdom, to: hunnic-empire, note: "네다오 전투(454)" }
    - { from: byzantine-empire, to: hunnic-empire, note: "뎅기지크의 패배(469)" }
  tags: [war]
  sources: ["Jordanes, The Gothic History of Jordanes (Charles C. Mierow 영역, 1915)", "R. C. Blockley 엮음·옮김, The Fragmentary Classicising Historians of the Later Roman Empire, 2권 (1983)", "Michael Whitby·Mary Whitby 옮김, Chronicon Paschale 284–628 AD (1989)", "Otto J. Maenchen-Helfen, The World of the Huns (1973)", "Walter Pohl, The Avars: A Steppe Empire in Central Europe, 567–822 (2018)"]

- id: last-western-emperors-455
  year: 455
  endYear: 475
  title:
    ko: "서로마의 마지막 황제들: 발렌티니아누스 3세의 죽음(455)에서 율리우스 네포스(475)까지"
  summary:
    ko: "아이티우스를 454년 손수 죽인 발렌티니아누스 3세는 455년 3월 아이티우스의 부하들에게 살해되었다. 이어 페트로니우스 막시무스(455)는 반달이 다가오자 달아나다 죽었고, 서고트의 지지를 받은 갈리아 귀족 아비투스(455~456)는 군사령관 리키메르에게 쫓겨났다. 리키메르는 스스로 황제가 될 수 없는 게르만계 군인이라 황제를 세우고 갈아치웠다: 마요리아누스(457~461)는 갈리아와 히스파니아에서 서고트와 반달에 맞서 회복에 힘썼으나 460년 반달이 매수한 배신자들이 카르타기넨시스 해안(일리키 부근)에서 함대를 불태운 뒤 461년 리키메르에게 처형되었다. 리비우스 세베루스(461~465) 뒤 황제 없이 지내다 동로마 황제 레오 1세가 보낸 안테미우스(467~472)가 즉위했고(그의 468년 반달 원정은 뒤의 사건), 472년 4월 리키메르가 올리브리우스를 세우고 로마를 포위해 7월 함락시킨 뒤 조카 군도바드(부르군트 왕족)가 안테미우스를 죽이게 했으나(7월 11일) 리키메르(8월)도 올리브리우스(11월)도 그해 죽었다. 군도바드가 세운 글리케리우스(473~474)를 레오 1세가 보낸 율리우스 네포스(474~475)가 몰아냈다. 475년 8월 네포스의 군사령관 오레스테스가 라벤나에서 반란을 일으키자 네포스는 달마티아로 달아났고, 오레스테스는 10월 어린 아들 로물루스 아우구스툴루스를 황제로 세웠다. 그사이 갈리아의 대부분은 서고트(462 나르본·471 아키텐 1주·475 아르베르니)와 부르군트(461 리옹)에, 북갈리아는 아이기디우스의 수아송 왕국에, 455년 이후 알레만인이 알자스에 퍼졌다. 지도는 이를 해마다 넘긴 해로 그린다. 476년의 끝은 뒤의 사건이다."
