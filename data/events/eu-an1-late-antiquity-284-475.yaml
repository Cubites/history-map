- id: leo-vandal-expedition-457
  year: 457
  endYear: 474
  title:
    ko: "동로마의 레오 1세와 468년 반달 원정의 실패"
  summary:
    ko: "트라키아 출신 장교 레오 1세는 457년 마르키아누스가 죽자 알란계 실력자 아스파르의 손으로 황제가 되었다. 레오는 아스파르의 고트·알란 군대에 맞서려고 이사우리아인을 끌어들여 466년 이사우리아 장군 타라시코디사(제논)를 사위로 삼았고, 471년 아스파르와 그 아들 아르다부리우스를 궁정에서 죽였다. 서쪽에서는 467년 안테미우스를 서로마 황제로 보냈다. 468년 레오는 처남 바실리스쿠스에게 대함대를 맡겨 반달을 치게 했다. 배는 케드레노스가 1,113척이라 적고 군사 수는 사료마다 크게 다르다(히더는 군사 약 3만 명, 선원과 마르켈리누스·헤라클리우스의 군까지 합쳐 5만 명 안팎으로 본다). 비용은 프리스쿠스와 프로코피우스가 금 13만 파운드, 요안니스 리도스가 금 6만 4천 파운드와 은 70만 파운드, 칸디두스가 금 6만 5천 파운드와 은 70만 파운드라 한다. 바실리스쿠스는 카르타고 가까운 메르쿠리움 곶(케이프 본)에서 가이세리크의 닷새 휴전 요청을 받아들였다가 바람이 부는 밤 반달의 불배에 함대 상당수를 잃었다. 같은 468년 달마티아의 군사령관 마르켈리누스가 시칠리아에서 살해되었고 시칠리아는 반달에 넘어갔다(지도는 468년). 이 실패로 동서 로마가 힘을 합쳐 아프리카를 되찾을 길이 막혔다. 469년 동로마가 뎅기지크의 훈·불가르계 유목민을 꺾은 일은 앞의 사건에 있다. 474년 1월 레오가 죽자 일곱 살 손자 레오 2세가 아버지 제논과 함께 다스리다 그해 11월 죽었고 제논이 단독 황제가 되었다(474~491). 475년 1월 제논은 장군 바실리스쿠스에게 쫓겨났다가 476년 돌아와 다시 즉위한다."
