- id: huns-westward-370
  year: 370
  endYear: 376
  title:
    ko: "훈족의 서진: 알란과 그레우퉁기의 정복(370년대)과 보스포로스 왕국의 사라짐"
  summary:
    ko: "암미아누스는 마이오티스(아조프)해 너머에서 온 낯선 유목민 훈이 370년 무렵 돈강 동쪽의 알란(사르마티아·알란 부족)을 꺾고, 375~376년 흑해 북쪽 초원의 게르만 부족인 고트 그레우퉁기를 이끌던 에르마나리크가 훈에 몰려 자결했으며 뒤를 이은 비티미리스도 전사했다고 전한다. 이 무렵 케르치 해협 양쪽의 보스포로스 왕국이 사료에서 사라진다(훈의 진출과 겹치나 정확한 끝은 알 수 없다). 남은 그레우퉁기 일부는 훈의 종주 아래 들어갔고, 테르빙기 고트족의 지도자 아타나리크가 훈을 막으려다 물러나자 프리티게른이 이끄는 무리가 376년 로마 땅으로 피신을 청했다(뒤의 사건). 훈이 누구인가는 논쟁이다. 18세기 이래 중국 사서의 흉노(북흉노의 후예)와 같은 무리라는 견해가 있고, 311년 뤄양 함락을 'xwn'의 일로 전한 소그드어 『고서간』(312~313년 무렵 작성)이 근거로 거론되나(드 라 바이시에르 2005), 마엔헬펜(1973)은 이름만 닮았을 뿐 문화적 연결이 약하다며 회의적이다. 같은 때 동아시아에서는 전진(351~394)이 370년 전연을 멸망시켰고, 372년 고구려 소수림왕에게 승려 순도와 불상을 보내 불교를 전했다(`sosurim-372`). 지도는 370년 돈강 동쪽 알란의 땅을, 376년 보스포로스와 흑해 북쪽 고트의 땅(포딜리아·키이우·몰다비아·왈라키아)을 훈 제국으로 그린다."
  subjects: [hunnic-empire, sarmatian-alan-tribes, bosporan-kingdom, germanic-tribes, former-qin, former-yan, goguryeo]
  links:
    - { from: hunnic-empire, to: sarmatian-alan-tribes, note: "알란 정복(370 무렵)" }
    - { from: hunnic-empire, to: germanic-tribes, note: "그레우퉁기의 붕괴(375~376)" }
    - { from: former-qin, to: goguryeo, note: "승려 순도와 불상(372)" }
  tags: [war, society]
  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Otto J. Maenchen-Helfen, The World of the Huns (1973)", "E. A. Thompson, The Huns (Peter Heather 개정, 1996)", "Étienne de la Vaissière, 'Huns et Xiongnu', Central Asiatic Journal 49 (2005)", "Peter Heather, The Fall of the Roman Empire (2005)", "『삼국사기』 고구려본기 소수림왕 2년"]

- id: gothic-crossing-376
  year: 376
  endYear: 382
  title:
    ko: "고트족의 도나우 도하(376)·아드리아노폴리스 전투(378)와 382년의 정착"
  summary:
    ko: "훈에 쫓긴 테르빙기 고트족(프리티게른과 알라비우스가 이끈 무리)이 376년 도나우강 남쪽에 살게 해 달라고 청하자 발렌스는 받아들여 이들을 건너게 했다. 암미아누스는 로마 관리 루피키누스와 막시무스가 건너는 사람을 헤아리지도 못하고, 굶주린 고트족에게 개 한 마리 값으로 노예 한 명을 요구했다고 비난한다. 에우나피오스는 건넌 수를 20만으로 적는데 렌스키는 이를 이주민 전체의 수로 받아들이고 히더는 테르빙기 전사 1만 명에 모두 5만 명 안팎(그레우퉁기까지 합쳐 10만 명 남짓)으로 어림한다. 377년 마르키아노폴리스에서 루피키누스가 고트 지도자를 연회에서 죽이려던 계략이 어긋나 고트족이 반란을 일으켰고 그레우퉁기 무리도 합세했다. 훈 제국의 압박이 이 사태의 뿌리였다. 378년 8월 9일 발렌스는 서쪽 황제 그라티아누스의 원군을 기다리지 않고 아드리아노폴리스 가까이에서 싸우다 기병에게 무너졌고, 암미아누스는 군대의 3분의 1만 살아남았다고 적는다(현대의 어림은 로마군 1만~2만 명 전사). 황제도 죽었고 시신을 찾지 못했다. 이 소식에 로마 쪽 동방 군사령관 율리우스가 동방 도시에 있던 고트 병사들을 하루에 모두 죽이게 했다. 379년 1월 그라티아누스가 히스파니아 출신 장군 테오도시우스를 동방 정제로 세웠고, 382년 10월 3일 조약으로 게르만 부족인 고트족은 로마 제국의 도나우강 이남(모이시아)에서 독립 집단으로 살며 로마를 위해 싸울 병사를 내기로 했다. 지도는 이 정착지를 로마 땅으로 그린다."
  subjects: [germanic-tribes, roman-empire, hunnic-empire]
  links:
