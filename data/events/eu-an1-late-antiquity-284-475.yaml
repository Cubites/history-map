  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Noel Lenski, Failure of Empire: Valens and the Roman State in the Fourth Century A.D. (2002)", "Michael Kulikowski, Rome's Gothic Wars: From the Third Century to Alaric (2007)", "Peter Heather, Goths and Romans 332–489 (1991)", "Peter Heather, The Fall of the Roman Empire (2005)"]
