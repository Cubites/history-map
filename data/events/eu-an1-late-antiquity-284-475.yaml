- id: alaric-stilicho-395
  year: 395
  endYear: 418
  title:
    ko: "스틸리코와 알라리크: 로마 약탈(410)에서 서고트의 아키텐 정착(418)까지"
  summary:
    ko: "스틸리코(반달계 군인의 아들, 테오도시우스의 조카딸 세레나의 남편)는 395년 테오도시우스가 죽자 어린 서로마 황제 호노리우스의 후견인을 자처했고, 동로마를 맡은 아르카디우스의 궁정과 맞섰다. 프리기두스에서 싸운 고트인 알라리크는 보상을 받지 못하자 반란을 일으켜 발칸을 휩쓸었고 401년 이탈리아로 들어왔으나 402년 폴렌티아·베로나에서 스틸리코에게 막혔다. 호노리우스는 402년 궁정을 라벤나로 옮겼다. 406년 8월 스틸리코는 피에솔레에서 라다가이수스의 무리를 꺾었다. 408년 8월 22일 스틸리코가 반역 혐의로 처형되자 이탈리아의 로마 병사들이 도시마다 게르만 병사의 가족을 학살했고, 조시모스는 병사 3만 명이 알라리크에게 합류했다고 적으나 히더는 지나치게 많다고 본다. 알라리크는 408~410년 로마를 거듭 포위하며 409년 원로원 의원 아탈루스를 황제로 세웠다가 410년 폐위했고(아타울프가 414~415년 다시 세웠다), 410년 8월 24일 밤 성문이 열리자 사흘 동안 도시를 약탈하고 호노리우스의 이복누이 갈라 플라키디아를 인질로 데려갔다(문이 열린 경위는 배신인지 굶주림 끝의 항복인지 사료가 갈린다). 약탈은 주로 재물에 한정되고 성당은 건드리지 않았다고 오로시우스는 적으나, 800년 만의 로마 함락은 큰 충격이었고 아우구스티누스는 『신국론』을 쓰게 되었다. 알라리크는 410년 말 남이탈리아 코센차에서 죽었고, 처남 아타울프가 갈리아로 올라가 414년 나르본에서 호노리우스의 이복누이 갈라 플라키디아와 혼인했다. 415년 아타울프가 암살되고 시게리크가 며칠 만에 죽은 뒤 왈리아(415~418)가 히스파니아에서 반달·알란과 싸웠고, 418년 로마와 맺은 조약으로 아키텐에 자리 잡아 서고트 왕국이 시작되었고, 왈리아의 뒤를 이은 테오도리쿠스 1세(418~451)가 왕국을 굳혔다. 같은 시기 동아시아에서는 고구려 광개토왕(재위 391~413)이 백제와 후연을 치며 영토를 넓혔다(`gwanggaeto-391`). 지도는 410년의 로마 점령을 그리지 않고 418년부터 서고트의 아키텐을 그린다."
  subjects: [western-roman-empire, byzantine-empire, visigothic-kingdom, germanic-tribes, goguryeo]
