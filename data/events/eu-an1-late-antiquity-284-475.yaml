# 유럽 고대 사건 1차 묶음: 디오클레티아누스의 사두 정치에서 서로마의 마지막 황제들까지 (284 ~ 475, 작업 EVA1)
# 범위: 디오클레티아누스의 즉위와 사두 정치·속주 개편·가격 칙령, 카라우시우스와 알렉투스의 브리타니아 제국, 사산 페르시아와의 전쟁(니시비스 조약 298·요비아누스의 조약 363),
#   그리스도교 대박해와 콘스탄티누스의 등장(요크 306·밀비우스 다리 312·밀라노 협약 313·니케아 공의회 325·콘스탄티노폴리스 330), 콘스탄티우스 2세·율리아누스, 프랑크인과 북갈리아,
#   발렌티니아누스 1세와 발렌스, 훈족의 서진과 고트족의 도나우 도하(376)·아드리아노폴리스(378)·382년 정착, 테오도시우스 1세와 395년 동서 분리, 아르메니아 분할(387)과 아르사케스 왕조의 끝(428),
#   동로마의 아르카디우스·테오도시우스 2세, 스틸리코·알라리크와 로마 약탈(410)·서고트의 아키텐 정착(418), 라인 도하(406)와 히스파니아 분할(411), 로마의 브리타니아 포기(410), 수에비 왕국, 부르군트 왕국,
#   훈 제국의 전성기와 카탈라우눔(451)·네다오(454), 반달의 아프리카(429~439)와 로마 약탈(455), 성 패트릭, 에페소스·칼케돈 공의회, 앵글로색슨의 도래, 서로마의 마지막 황제들과 서고트 에우리크의 확장, 레오 1세의 반달 원정(468).
# 깊이: 고등학교 세계사 교과서 본문 수준에, 284~475년 지도에서 생기거나 끝난 유럽 항목(브리타니아 제국 286~296, 픽트 왕국 297, 산마리노 301, 훈 제국 370, 보스포로스 왕국 376, 서로마·동로마 제국 395, 로마 제국 395,
#   수에비·반달·알란(히스파니아) 409, 웨일스·브리튼인 왕국들 410, 부르군트 왕국 411, 서고트 왕국 418, 아르메니아 왕국 428, 앵글로색슨·스트래스클라이드·달리어타 450, 게피드·훈·불가르계 유목민 454,
#   수아송 왕국·프랑크 왕국 457, 캅카스 알바니아 461 등)을 ±2년 기준으로 subjects에 이음(docs/REGION_GUIDE.md §5). 지도의 큰 변화(1만 km² 넘는 유럽 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 훈족의 서진 사건에 같은 때의 전진(370 전연 멸망)과 고구려 소수림왕(372 승려 순도)을, 스틸리코와 알라리크 사건에 같은 때의 고구려 광개토왕(391~413)을 견주었다. 02번 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 며칠 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다. 연도는 기원후라 천문 연도와 같다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 고대 사료와 표준 개설서의 원서(한국어 번역본은 저장소에 이미 있는 오스트로고르스키만). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: diocletian-tetrarchy-284
  year: 284
  endYear: 305
  title:
    ko: "디오클레티아누스의 즉위(284)와 사두 정치·속주 개편·가격 칙령(301)"
  summary:
    ko: "카루스의 아들 누메리아누스가 죽은 뒤 군대가 달마티아 출신 근위대 장교 디오클레티아누스를 284년 11월 20일 황제로 추대했고, 이듬해 마르구스 전투에서 누메리아누스의 형 카리누스를 꺾어 제국을 홀로 차지했다(카리누스는 285년 부하에게 살해되었다). 286년 동료 장군 막시미아누스를 공동 정제로 세워 서쪽을 맡기고, 293년 두 정제 밑에 부제 갈레리우스(동)와 콘스탄티우스 1세 클로루스(서)를 두는 '사두 정치'를 열었다. 황제들은 니코메디아·시르미움·밀라노·트리어 같은 전선 가까운 도시에 머물렀다. 속주를 100곳 안팎으로 잘게 나눠 관구로 묶고 군정과 민정을 갈랐으며, 군대를 늘리고 세금을 인구와 토지에 매기는 제도로 고쳤다. 301년 물가 상승을 누르려 상품과 임금의 최고가격을 정한 '가격 칙령'을 내렸으나 시장에서 지켜지지 않아 흐지부지되었다. 287년 무렵(298년이라는 설도 있다) 로마의 도움으로 티리다테스 3세가 아르메니아 왕위에 돌아왔다(그전에는 사산의 왕족 나르세가 아르메니아를 맡았다). 303년부터 그리스도교 박해를 시작했고(뒤의 사건), 305년 5월 1일 디오클레티아누스는 막시미아누스와 함께 퇴위해 스플리트 가까운 궁전에서 지냈다. 지도는 사두 정치의 분담을 그리지 않고 로마 제국을 한 나라로, 아르메니아는 287년부터 그린다."
  subjects: [roman-empire, arsacid-armenia]
  links:
    - { from: roman-empire, to: arsacid-armenia, note: "티리다테스 3세의 복위(287 무렵)" }
  tags: [politics]
  sources: ["Stephen Williams, Diocletian and the Roman Recovery (1985)", "Timothy D. Barnes, The New Empire of Diocletian and Constantine (1982)", "Averil Cameron, The Later Roman Empire: AD 284–430 (1993)", "Alan K. Bowman·Peter Garnsey·Averil Cameron 엮음, The Cambridge Ancient History XII: The Crisis of Empire, A.D. 193–337 (2005)", "Lactantius, De mortibus persecutorum (J. L. Creed 영역, 1984)"]

- id: carausius-britannic-empire-286
  year: 286
  endYear: 297
  title:
    ko: "카라우시우스와 알렉투스의 브리타니아 제국(286~296)"
  summary:
    ko: "메나피이 부족(지금의 벨기에 북부) 출신 함대 지휘관 카라우시우스는 갈리아 북해안의 해적 토벌을 맡았다가 약탈품을 가로챘다는 혐의로 막시미아누스가 처형을 명하자(에우트로피우스) 286년 브리타니아로 건너가 스스로 황제를 칭했다. 브리타니아와 갈리아 북부 해안(불로뉴)을 쥐고 함대와 브리타니아 군단으로 버티며 자기 주화를 찍었는데, 주화에 막시미아누스·디오클레티아누스와 함께 '형제'로 새겨 인정받기를 바랐다. 289년 막시미아누스의 원정이 실패한 뒤 로마는 한동안 그의 자리를 사실상 받아들였다. 그러나 293년 부제가 된 콘스탄티우스 1세 클로루스가 불로뉴를 포위해 함락시켰고, 같은 해 재무관 알렉투스가 카라우시우스를 죽이고 뒤를 이었다. 296년 콘스탄티우스와 친위대장관 아스클레피오도투스가 두 갈래로 바다를 건너 알렉투스를 쓰러뜨렸고 콘스탄티우스는 런던에서 환영받았다고 297년 『라틴 찬가집』의 찬사가 전한다. 이 찬사에 처음으로 칼레도니아의 '픽트인'이라는 이름이 나온다. 지도는 브리타니아 제국을 286~295년 브리타니아(하드리아누스 방벽까지)로 그리고 불로뉴는 그리지 않으며, 296년 브리타니아를 로마에 돌려주고 297년 칼레도니아를 켈트 부족에서 픽트인으로 바꿔 그린다."
  subjects: [roman-empire, britannic-empire, picts, celtic-tribes]
  links:
    - { from: roman-empire, to: britannic-empire, note: "콘스탄티우스의 불로뉴 함락(293)과 브리타니아 회복(296)" }
  tags: [politics, war]
  sources: ["John Casey, Carausius and Allectus: The British Usurpers (1994)", "C. E. V. Nixon·Barbara Saylor Rodgers 옮김, In Praise of Later Roman Emperors: The Panegyrici Latini (1994)", "Eutropius, Breviarium (H. W. Bird 영역, 1993)", "Aurelius Victor, De Caesaribus (H. W. Bird 영역, 1994)", "Stephen Williams, Diocletian and the Roman Recovery (1985)"]
