- id: franks-north-gaul-358
  year: 358
  endYear: 475
  title:
    ko: "프랑크인과 북갈리아: 톡산드리아(358)·킬데리크 1세(457)·수아송 왕국(461)"
  summary:
    ko: "358년 율리아누스는 라인강 하구 가까이 톡산드리아(지금의 네덜란드 남부와 벨기에 북부)에 있던 게르만 부족 살리 프랑크를 로마의 동맹자로 받아들여 그곳에 살게 했다. 프랑크 사람은 로마군에서 높은 자리에 올랐는데, 4세기 후반의 아르보가스트는 군사령관(388~394)에 이르렀다. 이들 게르만 부족 출신 장교가 로마 정치의 한 축이 되었다. 406년 라인강이 뚫릴 때 프랑크는 로마 편에서 반달과 싸웠다고 투르의 그레고리우스가 인용한 사료가 전한다(반달 왕 곤데기셀이 이때 전사). 5세기 중엽 살리 프랑크 왕 클로디오가 캉브레 쪽을 차지했으나 448년 무렵 비쿠스 헬레나에서 아이티우스가 이끈 로마군(기병은 훗날 황제 마요리아누스가 지휘)에게 패했다고 시도니우스는 읊는다. 457년 무렵 투르네를 근거지로 킬데리크 1세(전승의 메로베크의 아들, 클로비스의 아버지)가 살리 프랑크를 이끌었고, 450년대 말~460년대 중반(학설에 따라 457·459·463~464년) 라인강 중류의 리푸아리 프랑크가 쾰른과 트리어를 차지했다(두 도시가 같은 해에 넘어갔는지는 사료가 약하다). 한편 북갈리아의 로마 군사령관 아이기디우스는 461년 마요리아누스가 제거된 뒤 서로마 정부와 갈라서 수아송을 근거지로 삼았고, 464~465년 죽은 뒤 아들 시아그리우스가 이었다. 킬데리크는 한때 아이기디우스와 손잡고 463년 무렵 오를레앙에서 서고트와 싸웠다. 이 수아송의 로마 영역(수아송 왕국)은 클로비스에게 넘어간다(뒤의 사건). 지도는 405년까지 톡산드리아를 로마 땅으로, 457년 투르네·캉브레를 프랑크로, 459년 쾰른을 프랑크로(근사), 461~475년 북갈리아를 수아송 왕국으로 그린다."
  subjects: [roman-empire, western-roman-empire, frankish-kingdom, domain-of-soissons, visigothic-kingdom, germanic-tribes]
  links:
    - { from: roman-empire, to: germanic-tribes, note: "살리 프랑크의 톡산드리아 정착(358)" }
    - { from: western-roman-empire, to: domain-of-soissons, note: "아이기디우스의 갈라섬(461)" }
  tags: [politics, society]
  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Gregory of Tours, The History of the Franks (Lewis Thorpe 영역, 1974)", "Sidonius Apollinaris, Poems and Letters (W. B. Anderson 영역, Loeb, 1936~1965)", "Edward James, The Franks (1988)", "Ian Wood, The Merovingian Kingdoms 450–751 (1994)", "Penny MacGeorge, Late Roman Warlords (2002)"]

- id: valentinian-valens-364
  year: 364
  endYear: 375
  title:
    ko: "발렌티니아누스 1세와 발렌스: 제국의 분담(364)과 브리타니아의 대음모 수습(368)"
  summary:
    ko: "요비아누스가 364년 2월 죽자 로마 제국의 군대는 판노니아 출신 장교 발렌티니아누스 1세를 황제로 뽑았고, 그는 동생 발렌스를 공동 정제로 삼아 서쪽(밀라노·트리어)과 동쪽(콘스탄티노폴리스)을 나누어 다스렸다. 발렌티니아누스는 367년 아들 그라티아누스를 정제로 삼았고, 라인강·도나우강에 요새를 쌓으며 알레만인 같은 게르만 부족과 싸웠다. 367년 브리타니아에서는 픽트·스코티·색슨 등이 정찰병의 배신과 겹쳐 한꺼번에 침입했는데('대음모', 암미아누스는 바르바리카 콘스피라티오라 불렀다) 장군 테오도시우스(훗날 황제 테오도시우스 1세의 아버지)가 368~369년 수습했다. 발렌티니아누스는 375년 11월 17일 브리게티오(지금의 헝가리 코마롬)에서 콰디 사절에게 화를 내다 쓰러져 죽었고 서쪽은 아들 그라티아누스와 네 살의 발렌티니아누스 2세가 이었다. 발렌스는 365~366년 율리아누스의 친척 프로코피우스의 반란을 눌렀고, 367~369년 도나우강을 건너 테르빙기 고트족 지도자 아타나리크와 싸워 강 위의 배에서 조약을 맺었다. 발렌스는 아리우스파에 기울어 니케아파 주교들을 쫓아냈다. 이 무렵 훈이 흑해 북쪽에 나타났다(뒤의 사건). 지도는 사두 정치 이후의 분담을 그리지 않는다."
  subjects: [roman-empire, germanic-tribes, picts]
  links:
