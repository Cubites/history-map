- id: patrick-ireland-431
  year: 431
  endYear: 461
  title:
    ko: "성 패트릭과 아일랜드의 그리스도교(5세기)"
  summary:
    ko: "아일랜드는 로마 제국 밖이었고 5세기 초까지 그리스도교인이 드물었다. 교황 켈레스티누스 1세가 431년 팔라디우스를 '그리스도를 믿는 아일랜드인'의 첫 주교로 보냈다(프로스페르). 패트릭(라틴어 파트리키우스)은 브리튼의 로마계 집안 출신으로 열여섯 살 무렵 아일랜드 해적에게 끌려가 목동으로 6년을 지내다 탈출했고, 뒤에 주교가 되어 아일랜드로 돌아와 교회를 세웠다고 『고백록』과 『코로티쿠스에게 보내는 편지』에서 스스로 적는다. 편지는 브리튼 왕 코로티쿠스의 병사들이 새 신자를 죽이고 노예로 팔아넘긴 것에 항의한다(코로티쿠스를 브리튼인 왕국들 가운데 알트 클루트의 왕 케레티크로 보는 견해가 있다). 전통 연대는 432년 도착, 461년 죽음이나, 학자들은 패트릭의 활동을 5세기 후반(493년 죽음설)으로 늦춰 보기도 한다. 7세기 무이르추의 전기가 전설을 더했고 축일은 3월 17일이다. 이 무렵 아일랜드 왕국들이 서로 다투었고, 전승은 아일랜드 북부의 달리어타 사람들이 500년 무렵 페르구스 모르를 따라 스코틀랜드 서부 아가일로 건너갔다고 하나 고고학은 이를 의심한다. 지도는 450년 무렵부터 아가일을 달리어타로, 클라이드강 일대를 스트래스클라이드(알트 클루트)로 그린다."
  subjects: [irish-kingdoms, brittonic-kingdoms, strathclyde, dal-riata]
  tags: [culture, religion]
  sources: ["Ludwig Bieler 옮김, The Works of St. Patrick (1953)", "Thomas Charles-Edwards, Early Christian Ireland (2000)", "E. A. Thompson, Who Was Saint Patrick? (1985)", "Prosper of Aquitaine, Epitoma Chronicon (Steven Muhlberger, The Fifth-Century Chroniclers, 1990에 실린 영역)", "Robin Fleming, Britain after Rome: The Fall and Rise, 400 to 1070 (2010)"]

- id: ephesus-chalcedon-431
  year: 431
  endYear: 451
  title:
    ko: "교리 논쟁: 에페소스 공의회(431)와 칼케돈 공의회(451)"
  summary:
    ko: "428년 콘스탄티노폴리스 총대주교가 된 네스토리오스는 동로마 교회에서 마리아를 '그리스도의 어머니'라 부르자고 해, '하느님의 어머니'라는 호칭을 쓰는 알렉산드리아 총대주교 키릴로스와 맞섰다. 431년 6월 테오도시우스 2세가 소집한 에페소스 공의회에서 키릴로스는 안티오키아 주교단이 도착하기 전에 회의를 열어 네스토리오스를 폐위했고, 늦게 도착한 동방 주교들이 맞서 두 공의회로 갈렸다가 433년 화해 문서로 수습되었다. 네스토리오스는 435년 페트라로, 뒤에 이집트 오아시스로 유배되었고, 그를 따른 교회는 페르시아로 퍼져 '동방 교회'가 되었다. 한편 수도원장 에우티케스는 그리스도의 인성이 신성에 흡수되었다고 주장하다 448년 단죄되었고, 449년 에페소스의 두 번째 공의회('강도 공의회')는 에우티케스를 복권시키고 서로마 교회를 대표한 교황 레오 1세의 서한(「토무스」)을 읽지도 않고 묵살했다. 450년 마르키아누스가 즉위하자 451년 10월 칼케돈에 500명 안팎의 주교가 모여 그리스도가 두 본성으로 혼합 없이 한 인격에 있다는 정의를 채택했다. 이집트·시리아의 많은 신자가 이를 받아들이지 않아 콥트 교회와 시리아 정교회 같은 '단성론'(스스로는 '합성론'이라 부른다) 교회로 갈라졌다. 칼케돈은 또 콘스탄티노폴리스 총대주교에게 로마 다음의 서열을 준 28조를 정했는데 교황 레오 1세가 이를 거부했다."
  subjects: [byzantine-empire, western-roman-empire]
  tags: [religion, politics]
  sources: ["Richard Price·Michael Gaddis 옮김, The Acts of the Council of Chalcedon, 3권 (2005)", "Henry Chadwick, The Church in Ancient Society: From Galilee to Gregory the Great (2001)", "Fergus Millar, A Greek Roman Empire: Power and Belief under Theodosius II, 408–450 (2006)", "Averil Cameron·Bryan Ward-Perkins·Michael Whitby 엮음, The Cambridge Ancient History XIV: Late Antiquity: Empire and Successors, A.D. 425–600 (2000)"]

- id: anglo-saxon-arrival-449
  year: 449
  endYear: 475
  title:
    ko: "앵글로색슨의 도래(449 무렵)와 브리튼인의 이주"
  summary:
    ko: "비드는 브리튼의 통치자 보르티게른이 북쪽의 픽트와 스코티에 맞서려고 불러들인 앵글인·색슨인·유트인 용병이 마르키아누스 황제 때인 449년 헹기스트와 호사의 인솔로 켄트에 상륙했다고 전하고, 『앵글로색슨 연대기』도 449년을 적는다. 길다스(6세기)는 이름을 대지 않고 '오만한 폭군'이 색슨을 불렀다고 쓰며, 연대와 인명은 후대의 윤색이 섞여 있다. 고고학은 5세기 초부터 북해 건너 이주와 용병의 정착이 이어졌고 5세기 중엽 일부가 브리튼인과 갈라서면서 브리타니아 동부와 남부로 퍼졌다고 본다. 이주의 규모(소규모 지배층의 교체인지 대규모 이주인지)는 학자들이 갈린다. 브리튼인은 서쪽 웨일스 공국들과 콘월로 밀려나거나 앵글로색슨 사회에 섞였고, 일부는 바다를 건너 아르모리카로 옮겼다(뒤의 브르타뉴). 요르다네스는 469년 무렵 '브리튼인의 왕' 리오타무스가 1만 2천 명(요르다네스의 수)을 이끌고 갈리아에서 서고트에 맞섰다고 적는다. 길다스는 로마계 지도자 암브로시우스 아우렐리아누스가 저항을 이끌었다고 쓴다. 북쪽에서는 클라이드강 일대의 알트 클루트(스트래스클라이드)가 브리튼인 왕국으로 자리 잡았고, 아가일의 달리어타는 아일랜드에서 건너온 이들의 왕국이라 전하나 연대는 불확실하다. 지도는 450년 무렵부터 템스강 어귀·켄트·동앵글리아·린지를 앵글로색슨 왕국들로, 아가일을 달리어타로, 클라이드강 일대를 스트래스클라이드로 그리고 461년 아르모리카 서쪽을 브리튼인 왕국들로 그린다. 476년부터의 일은 뒤의 사건이다."
  subjects: [anglo-saxon-kingdoms, brittonic-kingdoms, welsh-principalities, strathclyde, dal-riata, picts]
  links:
    - { from: anglo-saxon-kingdoms, to: brittonic-kingdoms, note: "정착과 브리튼인의 이주(449 무렵~)" }
