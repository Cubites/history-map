- id: rhine-crossing-406
  year: 406
  endYear: 429
  title:
    ko: "라인 도하(406)와 반달·알란·수에비의 히스파니아 분할(411)"
  summary:
    ko: "406년 마지막 날(통설)에 얼어붙은 라인강을 반달·알란·수에비가 건너 마인츠 일대의 갈리아로 들어왔다. 프랑크가 로마 편에서 막아 반달 왕 곤데기셀이 전사했으나 알란이 도와 반달이 살아남았다고 투르의 그레고리우스가 인용한 사료가 전한다. 이들은 갈리아를 휩쓸다 409년 피레네를 넘어 히스파니아로 들어왔고, 411년 제비뽑기로 땅을 나누었다고 히다티우스는 적는다: 하스딩 반달은 갈라이키아의 동쪽, 수에비는 서쪽, 알란은 루시타니아와 카르타기넨시스, 실링 반달은 바이티카. 416~418년 서로마 황제 호노리우스의 청으로 싸운 왈리아의 서고트가 실링 반달과 알란 왕 아다크를 무너뜨려 남은 알란(사르마티아·알란 부족 가운데 서쪽으로 간 무리)은 하스딩 반달 왕 군데리크를 따랐다('반달과 알란의 왕'). 419년 무렵 하스딩이 수에비와 다투다 바이티카로 옮겼고, 425년 카르타고 노바와 발레아레스를 약탈했다. 428년 군데리크가 죽고 이복동생 가이세리크가 왕이 되었다. 429년 5월 가이세리크가 반달과 알란을 이끌고 북아프리카로 건너갔다(빅토르 비텐시스와 프로코피우스는 노약자까지 합해 8만 명이라 하나 과장일 수 있다). 지도는 406년 라인강 하류의 톡산드리아를 게르만 부족으로 바꾸고, 슐레지엔의 반달이 떠난 폴란드 일대는 근거가 약해 비우며, 411년 제비뽑기대로 알란 왕국을 411~417년 그린다. 420~428년 하스딩 반달은 바이티카를 차지한 것으로 그린다."
  subjects: [vandal-kingdom, alans-hispania, suebi-kingdom, sarmatian-alan-tribes, western-roman-empire, visigothic-kingdom, germanic-tribes]
