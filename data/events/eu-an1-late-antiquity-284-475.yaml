- id: armenia-caucasus-387
  year: 387
  endYear: 461
  title:
    ko: "캅카스의 아르메니아 분할(387)과 아르사케스 왕조의 끝(428), 아바라이르 전투(451)"
  summary:
    ko: "386~387년 합의로 테오도시우스 1세와 사산 왕 샤푸르 3세가 아르메니아를 나누어 서쪽 작은 몫(카린·아킬리세네·스페르)은 로마가, 동쪽 대부분은 사산의 종주 아래 아르사케스 왕가의 왕이 맡았다(조약 문서는 남아 있지 않아 연도와 경계는 학자마다 다르다). 로마는 자기 몫의 아르사케스 왕정을 없애 속주로 삼았다(서쪽 왕 아르샤크 3세는 390년 무렵 죽었다). 동쪽에서는 메스로프 마슈토츠가 405년 무렵 아르메니아 문자를 만들고 성서를 번역해 교회와 문화가 자랐다. 428년 아르사케스 왕 아르탁세스 4세가 귀족들의 청으로 사산 왕 바흐람 5세에게 폐위되어 아르메니아의 왕정이 끝나고 사산의 총독(마르즈판)이 다스렸다. 451년 5월 26일 야즈데게르드 2세가 조로아스터교를 강요하자 바르단 마미코니안이 이끈 귀족과 성직자가 아바라이르 평원에서 맞섰다가 졌고 바르단도 죽었으나, 그 뒤의 저항이 484년 느바르삭 조약으로 신앙의 자유를 얻게 했다고 아르메니아 사료는 그린다. 이웃 캅카스 알바니아는 387년 아르메니아의 우티크와 아르차흐를 얻었고 462년 무렵(461~463년설) 바체 2세가 물러나 아르사케스 왕정이 끝나고 사산의 마르즈판령이 되었다. 이베리아 왕국(카르틀리)은 4세기 전반(330년대 무렵) 그리스도교를 받아들였다고 전하며, 라지카는 로마(동로마)의 종주 아래 있었다. 지도는 387년 분할대로 카린 등 서쪽을 로마로, 우티크 등을 알바니아로 그리고, 428년 아르메니아를 비우고, 알바니아는 단순화해 461년부터 비운다(사산 직할지)."
  subjects: [arsacid-armenia, caucasian-albania, iberia-kingdom, lazica, roman-empire, byzantine-empire]
  links:
    - { from: roman-empire, to: arsacid-armenia, note: "샤푸르 3세와의 분할(387)" }
    - { from: arsacid-armenia, to: caucasian-albania, note: "우티크·아르차흐 양도(387)" }
    - { from: byzantine-empire, to: lazica, note: "동로마의 종주" }
  tags: [politics, war, religion]
  sources: ["Nina G. Garsoïan 옮김, The Epic Histories Attributed to P'awstos Buzand (1989)", "Robert W. Thomson 옮김, Elishē, History of Vardan and the Armenian War (1982)", "Cyril Toumanoff, Studies in Christian Caucasian History (1963)", "Ronald Grigor Suny, The Making of the Georgian Nation (2판, 1994)", "Stephen H. Rapp Jr., Studies in Medieval Georgian Historiography: Early Texts and Eurasian Contexts (2003)"]

- id: theodosian-east-395
  year: 395
  endYear: 450
  title:
    ko: "아르카디우스와 테오도시우스 2세의 동로마: 성벽(413)·히파티아(415)·법전(438)"
  summary:
    ko: "395년 동쪽을 이은 아르카디우스(395~408)는 환관 에우트로피우스 같은 궁정 실력자에게 휘둘렸고, 아들 테오도시우스 2세(408~450)는 일곱 살에 즉위해 친위대장관 안테미우스와 누이 풀케리아의 보살핌 속에 자랐다. 안테미우스는 413년 콘스탄티노폴리스의 육지 성벽(테오도시우스 성벽)을 쌓았고, 447년 지진으로 무너진 성벽은 곧 다시 세워졌다. 동로마는 서로마보다 도시와 재정 기반이 단단해 침입을 성벽과 돈으로 막을 수 있었다. 서쪽에서는 호노리우스가 421년 장군 콘스탄티우스를 공동 황제 콘스탄티우스 3세로 세웠으나 그가 그해 죽었고, 423년 호노리우스가 죽은 뒤 요안네스가 황제를 칭하자(423~425) 테오도시우스 2세가 425년 군대를 보내 사촌 발렌티니아누스 3세(425~455, 어머니 갈라 플라키디아가 섭정)를 세웠다. 415년 알렉산드리아에서 신플라톤주의 철학자 히파티아가 낭독자 페트로스가 이끈 그리스도교 군중에게 죽임을 당했다. 소크라테스 스콜라스티코스는 총독 오레스테스와 주교 키릴로스의 갈등 속에서 일어난 일로 적으며, 키릴로스가 직접 지시했는지는 학자들이 갈린다. 같은 시기 황제의 법은 이교 제사를 금하고 유대인의 공직을 막았으며(438년 신칙법), 유대인 총대주교직도 425년 무렵 가말리엘 6세가 죽은 뒤 429년까지 폐지되었다. 428년 콘스탄티노폴리스 총대주교가 된 네스토리오스의 논쟁은 에페소스 공의회로 이어졌다(뒤의 사건). 438년 『테오도시우스 법전』은 콘스탄티누스 이후 황제의 법을 모았다. 440년대 아틸라의 훈 제국은 도나우강 남쪽에서 거액의 공납을 받아 냈다(뒤의 사건). 450년 7월 테오도시우스 2세가 말에서 떨어져 죽자 군대가 아스파르의 지지로 군인 마르키아누스(450~457)를 8월에 정제로 추대했고 풀케리아는 그와 혼인해 정통성을 뒷받침했다."
  subjects: [byzantine-empire, western-roman-empire, hunnic-empire]
  links:
