- id: britain-end-407
  year: 407
  endYear: 446
  title:
    ko: "로마의 브리타니아 포기: 콘스탄티누스 3세(407)와 호노리우스의 편지(410)"
  summary:
    ko: "383년 마그누스 막시무스가 브리타니아의 병력을 데리고 갈리아로 건너간 뒤 방벽 북쪽의 픽트, 아일랜드의 스코티, 북해의 색슨 같은 게르만 부족의 습격에 대한 방어가 약해졌고, 406년 말 라인강이 뚫리자 브리타니아 주둔군은 406~407년 마르쿠스와 그라티아누스를 차례로 세웠다가 죽이고 콘스탄티누스 3세를 추대했다. 그는 남은 병력을 갈리아와 히스파니아로 데려가 407~411년 서방 일부를 다스리다 서로마 황제 호노리우스의 장군 콘스탄티우스에게 졌다. 조시모스는 409~410년 색슨의 침입에 맞서 브리튼 사람들이 스스로 무장해 로마 관리를 쫓아냈고, 호노리우스가 브리타니아의 도시들에 스스로 지키라는 편지(410)를 보냈다고 적는다(수신처가 이탈리아 남부의 브룻티움이라는 해석도 있다). 이후 로마의 행정과 군대, 화폐 공급이 끊겼고 고고학은 5세기 전반에 도시 생활과 도기 생산, 화폐 유통이 줄어 사라졌다고 본다. 길다스는 446년 무렵 브리튼인이 아이티우스에게 구원을 청한 '브리튼인의 신음'을 적었고, 『452년 갈리아 연대기』는 441~442년 브리타니아가 색슨의 지배에 들어갔다고 쓴다. 색슨의 도래는 뒤의 사건이다. 지도는 410년 브리타니아를 브리튼인 왕국들(묶음)과 웨일스 공국들로 바꿔 그리고, 맨섬과 방벽 사이에 있던 켈트 부족의 묶음은 이때 끝난다."
  subjects: [western-roman-empire, brittonic-kingdoms, welsh-principalities, celtic-tribes, picts, germanic-tribes]
