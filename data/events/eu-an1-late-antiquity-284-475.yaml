  sources: ["Peter Heather, The Fall of the Roman Empire (2005)", "Michael Kulikowski, Rome's Gothic Wars: From the Third Century to Alaric (2007)", "Alan Cameron·Jacqueline Long, Barbarians and Politics at the Court of Arcadius (1993)", "Orosius, Seven Books of History against the Pagans (Roy J. Deferrari 영역, 1964)", "Zosimus, New History(『새 역사』) (Ronald T. Ridley 영역, 1982)", "R. C. Blockley 엮음·옮김, The Fragmentary Classicising Historians of the Later Roman Empire, 2권 (1983)"]
