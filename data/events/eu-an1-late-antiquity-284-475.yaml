  sources: ["Ammianus Marcellinus, Res Gestae(『역사』) (John C. Rolfe 영역, Loeb, 1935~1940)", "Neil McLynn, Ambrose of Milan: Church and Court in a Christian Capital (1994)", "Stephen Williams·Gerard Friell, Theodosius: The Empire at Bay (1994)", "Clyde Pharr 옮김, The Theodosian Code and Novels and the Sirmondian Constitutions (1952)", "Peter Heather, The Fall of the Roman Empire (2005)"]
