# 아메리카 사건 1묶음 갈래 06b: 쿠바 공화국과 파나마의 독립, 멕시코 혁명, 카리브의 미국 점령, 남아메리카 국경 정리, 대공황기의 선린 정책, 2차 대전 (1900 ~ 1944년)
# 범위: 플랫 수정안과 쿠바 공화국, 파나마의 분리와 운하, 고무 붐과 아마존 국경, 루스벨트 추론과 카리브 점령, 멕시코 혁명과 카르데나스의 석유 국유화, 코르도바 대학 개혁, 금주법,
#   살로몬–로사노 조약과 리마 조약, 바르가스 혁명, 동그린란드 판결, 차코 전쟁, 선린 정책, 캐나다와 라틴아메리카의 2차 대전, 알류샨 열도 전투, 브레턴우즈 회의.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 연속된 과정은 한 사건에 묶었고 따로 쓰지 않은 일(덴마크령 서인도 매입, 니카라과 산디노, 레티시아 분쟁 등)은 가까운 사건에 한 구절로 넣었다.
# 날짜: 모두 그레고리력. 확실하지 않은 날짜는 '무렵'으로 적었고 조약은 서명 해와 발효 해를 가렸다. 이름 규칙: 나라·지역은 그때 이름을 쓰고 지금 이름을 한 번 덧붙였다(쿠바 공화국, 파나마 운하 지대).
# 지도 결정과의 관계: 쿠바는 1902년 독립국으로 다루되 플랫 수정안 아래의 제약은 사실만 적고 '보호국'으로 정의하지 않았다. 미국의 점령(쿠바 1906~1909, 니카라과, 아이티, 도미니카 공화국)과 분쟁 띠(차코·아마존 상류)는 사실대로 글에만 적었다.
#   남부 연합 같은 갈래 밖 일은 다루지 않았다. 하와이·이스터섬은 이 갈래에서 다루지 않았다.
# 한국사와 닿는 점: 1905년 멕시코 에네켄 농장 한인 이민을 멕시코 혁명 사건에 한 구절로 적고 「하와이 이민의 시작」으로 가리켰다(한국사 파일은 고치지 않음).
# 가리킨 기존 사건: 「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」·「유틀란트 해전과 미국의 참전」·「워싱턴 회의」·「대공황」·「아일랜드 자유국과 웨스트민스터 헌장」·「태평양 전쟁 발발」·「국제 연합의 창설」·「하와이 이민의 시작」.

- id: cuba-republic-1901
  year: 1901
  endYear: 1903
  title:
    ko: "플랫 수정안과 쿠바 공화국의 출범(1901~1903)"
  summary:
    ko: "1898년 미국–스페인 전쟁이 끝나자 스페인은 쿠바의 주권을 내놓았고(「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」, 앞의 사건) 1899년 1월 1일부터 미국 군정이 쿠바를 다스렸다. 군정은 레너드 우드 총독 아래에서 위생과 학교, 재정을 정비하며 제헌 의회 선거를 거쳐 헌법 제정을 이끌었다. 그 사이 미국 의회는 상원 의원 오빌 플랫이 제안한 조항을 1901년 3월 2일 윌리엄 매킨리 대통령의 서명으로 법으로 만들었다(플랫 수정안). 쿠바가 다른 나라에 영토나 권리를 넘기거나 빚을 지는 일을 막고, 쿠바의 독립과 안정된 정부를 지킨다는 이유로 미국이 개입할 권리를 인정하며, 해군 기지 땅을 미국에 내주라는 요구가 들어 있었다. 쿠바 제헌 의회는 그해 2월 21일 완성한 헌법에 이 조항을 부록으로 넣는 일에 반발하다가 1901년 6월 12일 찬성 16, 반대 11, 기권 4로 받아들였다. 1902년 5월 20일 토마스 에스트라다 팔마가 초대 대통령에 취임하면서 군정이 끝나고 쿠바 공화국이 출범했다. 1903년 5월 22일에는 수정안을 조약으로 옮긴 쿠바–미국 관계 조약이 서명되었고, 관타나모만 해군 기지의 조차가 따로 정해졌다. 쿠바는 대통령과 의회를 갖춘 독립국이었으나 외교와 재정에 제약이 있어, 이 체제를 보호국에 가깝다고 보는 시각과 형식상의 주권을 강조하는 시각이 갈린다. 에스트라다 팔마가 재선을 둘러싼 무장 봉기 속에 1906년 9월 28일 물러나자 미국은 수정안에 근거해 9월 29일 임시 정부를 세웠고, 윌리엄 하워드 태프트에 이어 찰스 마군이 1909년 1월 28일까지 통치한 뒤 호세 미겔 고메스에게 정부를 넘겼다. 수정안은 1934년에 폐지되었다(「선린 정책: 플랫 수정안 폐지와 아이티 철수(1933~1936)」, 뒤의 사건)."
  subjects: [cuba, usa]
  links:
    - { from: usa, to: cuba, note: "군정을 끝내고 쿠바 공화국에 정부를 넘김 (1902)" }
  tags: [politics, diplomacy]
  sources: ["Louis A. Pérez Jr., Cuba under the Platt Amendment, 1902–1934 (University of Pittsburgh Press, 1986)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)"]

- id: panama-independence-1903
  year: 1903
  endYear: 1904
  title:
    ko: "파나마의 분리 독립과 운하 조약(1903~1904)"
  summary:
    ko: "1903년 11월 3일 콜롬비아의 파나마 지협에서 분리가 선언되어 파나마 공화국이 세워졌다. 미국이 지협을 가로지르는 운하를 파기 위해 콜롬비아와 맺은 헤이–에란 조약은, 천일 전쟁(1899~1902)의 상처가 가시지 않은 콜롬비아 의회에서 1903년 8월 12일 부결되었다. 미국 의회는 1902년 6월 스푸너 법으로 파나마 노선을 고르고 콜롬비아와 협상하도록 했는데, 협상이 무산되자 프랑스 기술자 필리프 뷔노바리야와 파나마의 분리파는 미국의 힘을 믿고 움직였고, 11월 2일 미국 군함 내슈빌호가 대서양 쪽 콜론항에 닿았다. 11월 3일 밤 콜롬비아 군함 보고타호가 파나마시티를 포격해 민간인 한 명이 숨졌지만 분리를 막지는 못했다. 미국은 11월 6~7일에 비공식으로 받아들인 데 이어 13일 새 정부를 정식으로 승인했다. 11월 18일 미국 국무 장관 존 헤이와 파나마 대표를 맡은 뷔노바리야가 헤이–뷔노바리야 조약에 서명했는데, 파나마 사람은 서명에 들지 않았고 파나마 대표단이 워싱턴에 닿기 전에 서명이 끝났다는 점이 뒤에 비판을 받았다. 조약은 운하 양쪽으로 5마일(약 8km)씩의 운하 지대를 미국이 영구히 쓰고 그 안에서 주권을 가진 것처럼 다스리게 하고 파나마에 일시금 1,000만 달러와 해마다 25만 달러를 주기로 했으며, 1904년 2월 26일 발효했다. 같은 2월 제헌 의회가 헌법을 만들고 마누엘 아마도르 게레로를 초대 대통령으로 뽑았다. 콜롬비아는 오랫동안 분리를 받아들이지 않다가, 미국이 2,500만 달러를 다섯 번에 나누어 내기로 한 톰슨–우루티아 조약(1921년 발효)에서 파나마의 독립을 인정했다. 운하 공사는 「파나마 운하의 건설과 개통(1904~1914)」(뒤의 사건)이 이어서 다룬다."
  subjects: [panama, colombia, usa]
  links:
    - { from: panama, to: colombia, note: "콜롬비아에서 분리·독립함 (1903)" }
    - { from: panama, to: usa, note: "운하 지대를 영구히 쓰도록 내줌 (1903)" }
  tags: [politics, diplomacy]
  sources: ["Walter LaFeber, The Panama Canal: The Crisis in Historical Perspective (Oxford University Press, 1978)", "David McCullough, The Path Between the Seas: The Creation of the Panama Canal, 1870–1914 (Simon & Schuster, 1977)"]

- id: rubber-borders-1903
  year: 1903
  endYear: 1912
  title:
    ko: "고무 붐과 아마존 국경: 1909년 볼리비아–페루 조약과 푸투마요 사건(1903~1912)"
  summary:
    ko: "1879년 무렵부터 1911년 무렵까지 이어진 아마존 고무 붐은 볼리비아·페루·브라질·콜롬비아가 맞닿은 고무나무 숲의 국경을 다툼의 땅으로 만들었다. 가장 큰 쟁점은 마드레데디오스강과 푸루스강 유역이었다. 볼리비아는 1903년 11월 17일 페트로폴리스 조약으로 아크레 지방을 브라질에 넘겼고, 남은 국경은 아르헨티나 대통령 호세 피게로아 알코르타의 중재에 맡겼다. 1909년 7월 9일의 중재 판정을 두고 협상이 이어져 같은 해 9월 17일 라파스에서 페루 공사 솔론 폴로와 볼리비아 외무 장관 다니엘 산체스 부스타만테가 조약에 서명했다. 볼리비아는 마드레데디오스·푸루스 유역 약 25만 km²에 대한 페루의 주권을 받아들이고, 페루는 아크레강 남쪽 약 9만 1,726km²에 대한 볼리비아의 주권을 인정했다. 푸투마요강 유역에서는 페루 사업가 훌리오 세사르 아라나의 회사(1903년 말의 J.C. 아라나 이 에르마노스, 1907년 9월 6일 런던에 등록한 페루 아마존 회사로 이어짐)가 원주민에게 고무 채취를 강요했다. 영국 영사 로저 케이스먼트가 1910년 회사 장부와 바베이도스 출신 노동자들의 증언을 조사해 학대를 폭로했고, 1911년 4월과 6월에 페루에서 회사 직원들에 대한 체포 영장이 발부되었다. 케이스먼트의 보고는 1912년 영국 의회에 제출되어 국제 여론을 일으켰다. 이 일대에서 숨진 원주민은 1879~1930년 전체로 3만 2천~4만 명 이상이라는 추산이 있다. 브라질과 페루의 국경도 1909년 조약으로 정해졌다. 푸투마요 땅을 자기 땅으로 내세운 콜롬비아와 페루의 다툼은 「살로몬–로사노 조약과 리마 조약, 레티시아 분쟁: 페루의 국경 정리(1922~1934)」(뒤의 사건)에서 이어진다."
  subjects: [peru, bolivia, brazil, colombia]
  links:
    - { from: bolivia, to: peru, note: "마드레데디오스·푸루스 유역을 인정함 (1909)" }
  tags: [diplomacy, society]
  sources: ["Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)", "Michael Taussig, Shamanism, Colonialism, and the Wild Man: A Study in Terror and Healing (University of Chicago Press, 1987)"]

- id: roosevelt-corollary-1904
  year: 1904
  endYear: 1934
  title:
    ko: "루스벨트 추론과 카리브의 미국 점령(1904~1934)"
  summary:
    ko: "1902년 말 영국·독일·이탈리아가 빚을 받아 내려고 베네수엘라 해안을 봉쇄하자 유럽 나라가 서반구에서 무력을 쓰는 일에 대한 미국의 우려가 커졌다(「먼로 독트린과 러시아령 아메리카의 경계 조약(1823~1825)」, 앞의 사건). 1904년 2월 22일 헤이그 중재 법정은 봉쇄에 나선 세 나라의 채권을 먼저 갚아야 한다고 판정했다. 1904년 12월 6일 시어도어 루스벨트 대통령은 연례 교서에서 '만성적 잘못'이나 질서의 무너짐이 있는 나라에는 미국이 국제 경찰 구실을 할 수 있다고 밝혔고, 이것이 루스벨트 추론이다. 첫 적용은 도미니카 공화국이었다. 빚에 시달리던 이 나라의 세관을 1905년 미국이 맡아 수입의 일부로 외채를 갚게 했다. 윌리엄 태프트 정부는 군함 대신 은행 자본을 앞세운 '달러 외교'를 폈으나 군대 파견도 이어졌다. 미국은 쿠바를 1906~1909년 다시 점령했고(「플랫 수정안과 쿠바 공화국의 출범(1901~1903)」, 앞의 사건), 니카라과에는 1912년 8월 4일부터 1925년 8월까지와 1926년 5월부터 1933년 1월 2일까지, 아이티에는 1915년 7월 28일부터 1934년 8월 1일까지, 도미니카 공화국에는 1916~1924년 해병대를 주둔시켰다. 점령 아래에서 세관과 재정, 경찰이 미국의 감독을 받았고 저항하는 농민 무장대와의 싸움이 벌어졌다. 1917년 미국은 덴마크로부터 서인도 제도의 세 섬을 2,500만 달러에 사들였다. 1928년의 클라크 각서는 이 추론을 부분적으로 거두어들인 것으로 평가되고, 점령은 니카라과에서는 후버 정부 말에, 아이티에서는 프랭클린 루스벨트 정부 아래에서 끝났고 선린 정책이 이를 굳혔다(「선린 정책: 플랫 수정안 폐지와 아이티 철수(1933~1936)」, 뒤의 사건)."
  subjects: [usa, venezuela, dominican-republic, cuba, nicaragua, haiti, denmark]
  links:
    - { from: usa, to: dominican-republic, note: "세관을 맡아 재정을 감독함 (1905)" }
    - { from: usa, to: nicaragua, note: "해병대로 점령함 (1912~1933)" }
    - { from: usa, to: haiti, note: "해병대로 점령함 (1915~1934)" }
  tags: [diplomacy, war]
  sources: ["Lester D. Langley, The Banana Wars: United States Intervention in the Caribbean, 1898–1934 (Scholarly Resources, 2002)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)"]

- id: panama-canal-1904
  year: 1904
  endYear: 1914
  title:
    ko: "파나마 운하의 건설과 개통(1904~1914)"
  summary:
    ko: "파나마 지협을 가로지르는 운하 공사는 먼저 프랑스가 시작했다. 수에즈 운하를 만든 페르디낭 드 레셉스가 이끄는 회사가 1881년 1월 1일 공사를 시작했으나 말라리아와 황열병, 산사태 같은 기술 문제로 일꾼이 많이 죽고 기술자가 거듭 바뀌다가 약 2억 8,700만 달러를 쓰고 1889년 파산했다. 이 시기 사망자는 약 2만 2천 명이라는 추산이 있고 그 가운데 프랑스인은 5천 명에 이른다는 말도 있다. 파나마가 분리된 뒤(「파나마의 분리 독립과 운하 조약(1903~1904)」, 앞의 사건) 미국은 1904년 5월 4일 운하 재산을 정식으로 넘겨받았다. 미국이 맡은 첫 수석 기술자 존 월리스가 1905년 6월 사임한 뒤 존 프랭크 스티븐스가 차그레스강의 홍수를 겪어 본 뒤 바다 높이의 운하 대신 갑문으로 물을 올리는 방식을 밀어붙였고, 1907년 육군 소령 조지 워싱턴 고설스가 이어받아 예정(1916년)보다 2년 일찍 마쳤다. 1906년 의회는 갑문식을 승인했다. 위생 책임자 윌리엄 C. 고거스는 모기를 없애는 방역으로 두 해쯤 사이에 황열병과 말라리아를 크게 줄였다. 미국 시기의 사망자는 병과 사고를 합쳐 약 5,600명(두 시기를 합쳐 약 2만 7천 5백 명이라는 계산도 있다)으로 추산되며 대부분 서인도 제도 출신 노동자였고 미국인은 350명쯤이었다. 길이 약 82km의 운하는 당시 세계에서 가장 큰 인공 호수였던 가툰 호수와 쿨레브라 절개 구간을 지나는 갑문식으로 1914년 8월 15일 기선 안콘호가 처음으로 지나가며 열렸다. 개통 직후 유럽에서 1차 대전이 일어나 행사는 소박했다. 운하 지대의 반환은 「국기 사건과 토리호스–카터 조약(1964~1979)」(뒤의 사건)에서 다룬다."
  subjects: [panama, usa]
  links:
    - { from: usa, to: panama, note: "운하를 완공해 개통함 (1914)" }
  tags: [economy, society]
  sources: ["David McCullough, The Path Between the Seas: The Creation of the Panama Canal, 1870–1914 (Simon & Schuster, 1977)", "Walter LaFeber, The Panama Canal: The Crisis in Historical Perspective (Oxford University Press, 1978)"]

- id: mexican-revolution-1910
  year: 1910
  endYear: 1920
  title:
    ko: "멕시코 혁명과 1917년 헌법(1910~1920)"
  summary:
    ko: "1876년부터 대통령 자리에 머문 포르피리오 디아스의 오랜 독재(1880~1884년의 마누엘 곤살레스 재임을 빼고)는 1910년 선거에서 흔들렸다. 도전자 프란시스코 마데로가 투옥되었다가 풀려나 산루이스포토시 계획을 내걸고 1910년 11월 20일을 기해 무장 봉기를 호소했다. 디아스는 1911년 5월 25일 물러났고 프란시스코 레온 데 라바라가 임시 대통령을 거친 뒤 마데로가 11월 6일 취임했다. 1913년 2월 수도에서 '비극의 열흘'이라 불린 군 쿠데타가 일어나 마데로와 부통령 호세 마리아 피노 수아레스가 사임을 강요당한 뒤 살해되었고, 페드로 라스쿠라인이 45분 남짓 대통령을 맡았다가 빅토리아노 우에르타에게 자리를 넘겼다. 우에르타는 베누스티아노 카란사의 입헌파, 판초 비야와 에밀리아노 사파타의 농민군에 밀려 1914년 7월 15일 물러났다(프란시스코 카르바할이 8월 13일까지 임시로 맡았고, 비야·사파타 쪽이 세운 임시 대통령 셋이 1914~1915년에 이어졌다). 1914년 4월 미국은 베라크루스를 점령했고 1916~1917년에는 비야의 습격에 맞서 존 퍼싱의 원정군이 북부 멕시코에 들어왔다. 그 사이 1915년 셀라야 전투에서 알바로 오브레곤이 비야를 꺾었다. 1917년 2월 5일 새 헌법이 선포되어 땅과 지하자원을 국가의 것으로 하고 노동자의 권리를 정했으며, 카란사가 5월 1일 헌법 아래 대통령에 올랐다. 카란사는 1920년 5월 21일 오브레곤 등의 아구아프리에타 계획 반란 속에서 숨졌고 아돌포 데 라 우에르타의 임시 정부를 거쳐 12월 1일 오브레곤이 취임했다. 사망자는 약 100만 명에서 170만~270만 명까지 추산이 갈린다. 1905년 한인 1천여 명이 유카탄의 에네켄 농장에 이주한 일은 「하와이 이민의 시작」에 나온다."
  subjects: [mexico, usa]
  links:
    - { from: usa, to: mexico, note: "베라크루스를 점령함 (1914)" }
  tags: [politics, war]
  sources: ["Alan Knight, The Mexican Revolution, 2 vols. (Cambridge University Press, 1986)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)"]

- id: cordoba-reform-1918
  year: 1918
  title:
    ko: "코르도바 대학 개혁 운동(1918)"
  summary:
    ko: "예수회가 1613년에 세운 코르도바 국립 대학은 아르헨티나에서 가장 오래된 대학으로, 성직자와 보수적 교수 집단이 운영을 쥐고 있었다. 1918년 3월 이 대학 의과 대학에서 학생들이 학교 운영 방식에 항의하면서 대학 개혁 운동이 시작되었다. 이 무렵 아르헨티나는 1912년 사엔스 페냐 법으로 남성의 비밀·의무 투표가 마련되었고, 1916년 급진 시민 연합의 이폴리토 이리고옌이 대통령에 올라 중간층의 정치 참여가 넓어진 때였다. 학생들은 대학 연맹을 만들어 파업을 이끌었다. 3월 31일 학생들이 총파업을 벌이자 정부는 대학에 개입관 호세 마티엔소를 보냈지만, 보수적인 안토니오 노레스가 학장으로 뽑히자 학생들은 파업을 기한 없이 이어 가기로 했다. 6월 21일 학생들은 「라 후벤투드 아르헨티나 데 코르도바 아 로스 옴브레스 리브레스 데 수드아메리카」라는 선언을 발표해 남아메리카의 모든 자유로운 사람에게 호소했다. 대학 문제를 넘어 낡은 질서를 거부하는 청년 세대의 선언이기도 했다. 요구는 대학의 자치, 교수·졸업생·학생이 뽑은 대표가 함께 대학을 다스리는 일, 가톨릭 교회의 영향을 줄이는 세속화와 교육 과정의 현대화였다. 이리고옌은 이 움직임에 호의를 보였고, 여론이 들끓자 법무·교육부 장관 호세 살리나스를 새 개입관으로 보냈다. 개혁을 시행하는 포고는 1918년 10월 12일 마련되었다. 개혁이 내세운 대학 자치와 학생의 참여는 이후 라틴아메리카 대학의 기본 원칙이 되었다. 개혁은 곧 라틴아메리카 여러 나라로 번져 리마(1919)·쿠스코(1920)·산티아고(1920)·멕시코(1921)에서 비슷한 학생 운동이 일어났다."
  subjects: [argentina]
  tags: [society, culture]
  sources: ["Richard J. Walter, Student Politics in Argentina: The University Reform and Its Effects, 1918–1964 (Basic Books, 1968)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)"]

- id: prohibition-1919
  year: 1919
  endYear: 1933
  title:
    ko: "금주법과 1920년대 미국(1919~1933)"
  summary:
    ko: "1917년 12월 18일 미국 의회가 발의한 수정 헌법 제18조는 1919년 1월 16일 네브래스카가 36번째로 비준하면서 확정되었고 1920년 1월 17일 효력을 얻었다. 이 조항은 마시는 술을 만들고 팔고 나르는 일을 막았지만 술을 갖거나 마시는 일은 막지 않았다. 집행법인 볼스테드법은 우드로 윌슨 대통령의 거부권을 의회가 뒤집어 1919년 10월 만들어졌고, 맥주와 포도주까지 금지 대상에 넣었다는 사실이 뒤늦게 알려져 북부 여러 주의 반발을 샀다. 술 소비는 처음에는 줄었으나 밀주와 무허가 술집이 번지고 조직 범죄가 자랐다. 시카고의 알 카포네는 1931년 탈세로 유죄 판결을 받기 전까지 한 해 약 6천만 달러를 벌었다는 추산이 있고, 공업용 알코올에 독을 섞은 술로 약 1만 명이 숨졌다는 추산도 있다. 밖으로는 미국이 해군 군축을 이끈 「워싱턴 회의」(뒤의 사건)를 열던 시기였다. 한편 1920년 8월에는 여성 참정권을 보장한 수정 헌법 제19조가 확정되었고, 1924년에는 이민을 출신국별 한도로 제한하는 이민법이 만들어졌다. 1920년대의 호황이 1929년 대공황으로 꺾이자(「대공황」, 뒤의 사건) 금주법을 둘러싼 여론이 바뀌었고, 프랭클린 루스벨트가 1932년 폐지를 내걸었고, 1933년 3월 4일 취임한 뒤 3월 22일 서명된 컬런–해리슨 법에 따라 4월 7일부터 알코올 3.2퍼센트(무게 기준) 이하의 맥주와 포도주를 다시 팔 수 있게 되었다. 수정 헌법 제21조가 1933년 12월 5일 제18조를 없앴다. 헌법 수정이 다른 수정으로 폐지된 유일한 사례다. 제21조는 주 의회가 아니라 주마다 열린 헌법 회의의 비준을 거친 유일한 수정 헌법이기도 하다."
  subjects: [usa]
  tags: [society, politics]
  sources: ["Daniel Okrent, Last Call: The Rise and Fall of Prohibition (Scribner, 2010)", "Frederick Lewis Allen, Only Yesterday: An Informal History of the 1920's (Harper & Brothers, 1931)"]

- id: peru-borders-1922
  year: 1922
  endYear: 1934
  title:
    ko: "살로몬–로사노 조약과 리마 조약, 레티시아 분쟁: 페루의 국경 정리(1922~1934)"
  summary:
    ko: "아우구스토 레기아는 1919년 7월 4일 쿠데타로 호세 파르도를 몰아내고 다시 대통령이 되어 1930년 8월 25일까지 11년 남짓 페루를 다스렸다. 이 기간에 페루는 이웃 둘과 오랜 국경 문제를 조약으로 정리했다. 1922년 3월 24일 페루와 콜롬비아는 살로몬–로사노 조약으로 푸투마요강 일대의 국경을 정하고 아마존강가의 레티시아 지구를 콜롬비아에 넘기기로 했다(앞선 푸투마요의 일은 「고무 붐과 아마존 국경: 1909년 볼리비아–페루 조약과 푸투마요 사건(1903~1912)」, 앞의 사건). 칠레와는 「남아메리카 태평양 전쟁과 안콘 조약(1879~1884)」(앞의 사건)에서 칠레가 타크나·아리카를 10년 동안 점유한 뒤 주민 투표로 귀속을 정하기로 했던 문제가 남아 있었다. 투표는 열리지 않았고, 1925년 미국 대통령 캘빈 쿨리지의 중재로 투표를 준비하다 무산되었다. 1929년 6월 3일 리마에서 페루 외무 장관 페드로 호세 라다 이 가미오와 칠레 대표 에밀리아노 피게로아 라라인이 리마 조약에 서명했다. 타크나는 페루가, 아리카는 칠레가 갖고, 칠레가 페루에 최대 600만 달러를 보상하며 타크나–아리카 철도와 아리카 항구의 부두 사용권을 페루에 주었다. 타크나는 1929년 8월 28일 자정 페루로 돌아갔다. 한편 레티시아 주민 대부분이 페루 사람이라 불만이 컸고, 1932년 9월 1일 페루 민간인과 군인이 레티시아를 점령해 콜롬비아와 싸움이 벌어졌다. 양쪽 전사자는 각각 40명쯤이었고 질병으로 더 많이 죽었다. 1933년 4월 30일 루이스 미겔 산체스 세로 대통령이 암살되자 후임 오스카르 베나비데스가 국제 연맹 위원회에 레티시아를 맡겼고, 5월 24일 전투가 멎었으며 1934년 콜롬비아와 페루가 서명한 리우데자네이루 의정서가 살로몬–로사노 조약을 다시 확인했다."
  subjects: [peru, colombia, chile]
  links:
    - { from: peru, to: colombia, note: "레티시아 지구를 넘김 (1922)" }
    - { from: chile, to: peru, note: "타크나를 돌려줌 (1929)" }
  tags: [diplomacy, war]
  sources: ["Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Cambridge University Press, 1986)", "Fredrick B. Pike, The Modern History of Peru (Praeger, 1967)"]

- id: vargas-1930
  year: 1930
  endYear: 1945
  title:
    ko: "바르가스 혁명과 신국가(1930~1945)"
  summary:
    ko: "1920년대 브라질은 상파울루와 미나스제라이스의 대농장주가 번갈아 대통령을 내는 구공화국이었고, 커피 수출에 경제가 기울어 있었다. 1929년 대공황으로 커피값이 무너지자(「대공황」, 앞의 사건) 정치 균형도 흔들렸다. 1930년 3월 선거에서 상파울루가 민 줄리우 프레스치스가 이기자 낙선한 제툴리우 바르가스와 리우그란지두술·미나스제라이스·파라이바 주가 맺은 자유 동맹이 부정 선거를 주장하며 7월 부통령 후보 주앙 페소아가 암살된 일도 불씨가 되어 10월 3일 봉기했다. 군이 10월 24일 워싱턴 루이스 대통령을 몰아내고 군사 평의회가 11월 3일까지 맡은 뒤 바르가스가 임시 대통령에 올랐다. 1932년 7월 9일 상파울루 주가 헌법 제정을 요구하며 입헌 혁명을 일으켰으나 10월 초 진압되었다. 1934년 7월에 노동권과 여성 참정권을 담은 새 헌법이 만들어져 바르가스가 간접 선거로 대통령에 뽑혔다. 그러나 1937년 11월 10일 그는 쿠데타로 의회를 해산하고 새 헌법을 선포해 신국가(에스타두 노부)를 열었으며 정당을 금지하고 언론을 통제했다(1935년 공산당 주도 봉기가 진압된 뒤 탄압이 거세져 있었다). 한편 노동 조합을 국가 아래에 두고 1943년 통합 노동법으로 노동법을 정비해 도시 노동자의 지지를 얻었고, 제철소 같은 국가 주도의 산업화를 이끌었다. 바르가스는 1945년 10월 29일 군부에 밀려 물러났고 호제 리니아리스가 1946년 1월 31일까지 임시로 대통령을 맡은 뒤 에우리쿠 가스파르 두트라가 이어받았다. 브라질의 2차 대전 참전은 「라틴아메리카의 2차 대전 참전과 브라질 원정군(1942~1945)」(뒤의 사건)에서 다룬다."
  subjects: [brazil]
  tags: [politics, economy]
  sources: ["Thomas E. Skidmore, Politics in Brazil, 1930–1964: An Experiment in Democracy (Oxford University Press, 1967)", "Boris Fausto, A Concise History of Brazil (Cambridge University Press, 1999)"]

- id: east-greenland-1931
  year: 1931
  endYear: 1933
  title:
    ko: "에리크 왕의 땅과 동그린란드 판결(1931~1933)"
  summary:
    ko: "그린란드에는 이누이트가 오래전부터 살았고 10세기 끝 무렵 에리크가 이끈 바이킹이 정착했다고 전하며, 1721년 덴마크-노르웨이의 선교와 식민이 다시 시작된 뒤 덴마크령으로 이어졌다. 1814년 킬 조약으로 덴마크가 노르웨이를 스웨덴에 넘길 때 그린란드·아이슬란드·페로 제도는 덴마크에 남았다(「킬 조약과 스웨덴-노르웨이 연합」, 앞의 사건). 덴마크가 실제로 다스린 곳은 서해안과 일부 동해안뿐이었고, 덴마크는 1921년 그린란드 전역에 대한 주권을 선언해 두었다. 스피츠베르겐 문제에서 덴마크의 양해를 구하던 1919년 7월 22일 노르웨이 외무 장관 닐스 일렌은 덴마크가 그린란드 전체에 대한 주권을 내세워도 노르웨이는 문제 삼지 않겠다는 취지로 말했다(일렌 선언). 그러나 1931년 7월 노르웨이는 아무도 살지 않는 동해안 일부가 주인 없는 땅이라며 '에리크 왕의 땅'이라 이름 붙여 점유를 선언했다. 덴마크는 상설 국제 사법 재판소에 호소했다. 재판소는 1933년 4월 5일 킬 조약과 그 뒤 조약들을 바탕으로 덴마크가 그린란드 전체의 주권을 가진다고 판결했고, 일렌 선언은 노르웨이를 구속하는 무조건적이고 확정적인 약속이라고 보았다. 재판소는 덴마크가 1814년 뒤 그린란드에 주권을 계속 행사해 왔다고 보았고, 사람이 거의 살지 않는 땅에서는 주권 행사의 흔적이 적어도 인정된다고 보았다. 노르웨이는 판결을 받아들이고 주장을 거두었다. 판결은 일방적 선언의 구속력과 실효적 점유의 기준을 보여 준 사례로 자주 인용된다. 이 판결로 그린란드 동쪽과 북쪽까지 덴마크 주권이 국제법으로 확인되어 지금 그린란드 전체가 덴마크령으로 이어지는 바탕이 되었다."
  subjects: [greenland, denmark, norway]
  links:
    - { from: norway, to: denmark, note: "에리크 왕의 땅 주장을 거둠 (1933)" }
  tags: [diplomacy]
  sources: ["The Legal Status of Eastern Greenland, Permanent Court of International Justice, Series A/B No. 53 (1933)", "Finn Gad, The History of Greenland, vol. 3 (McGill-Queen's University Press, 1982)"]

- id: chaco-war-1932
  year: 1932
  endYear: 1938
  title:
    ko: "차코 전쟁과 차코 평화 조약(1932~1938)"
  summary:
    ko: "볼리비아와 파라과이는 앞선 전쟁에서 바다나 땅을 잃고 둘 다 바다에 닿지 못했다. 볼리비아는 파라과이강을 통해 대서양으로 나가는 길을, 파라과이는 점유를 내세워 그란차코 북부(차코 보레알)를 원했다. 1920년대 국경 충돌이 쌓이며 무장 경쟁이 벌어졌고, 이 땅에 석유가 있다는 기대가 커졌다. 스탠더드 오일이 볼리비아와, 로열 더치 셸이 파라과이와 이어져 있다는 말이 돌았지만 연구자들은 석유 회사가 전쟁을 일으켰다는 근거는 약하다고 본다. 1932년 6월 15일 볼리비아군이 피틴타 호수의 파라과이 요새를 차지하며 파라과이가 동원령을 내렸고, 9월 9일 보케론 요새를 포위한 싸움이 시작되어 9월 29일 요새가 파라과이 손에 들어갔다. 볼리비아 대통령 다니엘 살라망카와 독일 출신의 총사령관 한스 쿤트가 지휘한 군은 1933년 나난와 공격에서 두 번 실패했고, 12월 캄포비아에서 포위되어 수천 명이 사로잡혔고, 파라과이가 잡은 볼리비아 병사는 모두 약 2만 1천 명에 이르렀다. 볼리비아는 1934~1935년 빌라몬테스 방어선을 지켜 파라과이의 진격을 막았다. 파라과이는 대통령 에우세비오 아얄라(1932년 8월~1936년 2월)와 장군 호세 펠릭스 에스티가리비아가 이끌었고, 1936년 2월 혁명 뒤 라파엘 프랑코(1936년 2월~1937년 8월)를 거쳐 펠릭스 파이바(1937년 8월~1938년 10월)가 이어받았다. 1935년 6월 12일 휴전했고 1938년 7월 부에노스아이레스 평화 조약과 10월 10일 중재 판정으로 파라과이가 차코 보레알의 약 4분의 3을 갖고 볼리비아는 파라과이강 쪽 항행 보장을 받았다(이 권리는 전쟁 전에도 있었다). 볼리비아에서는 이 패배가 군부와 기성 정치에 대한 불신을 키워 1952년 혁명의 배경이 되었다고 본다. 사망자는 볼리비아 약 5만 6천~8만 명, 파라과이 약 3만 5천~5만 명으로 추산이 갈린다."
  subjects: [paraguay, bolivia]
  links:
    - { from: bolivia, to: paraguay, note: "차코 보레알을 내줌 (1938)" }
  tags: [war, diplomacy]
  sources: ["Bruce W. Farcau, The Chaco War: Bolivia and Paraguay, 1932–1935 (Praeger, 1996)", "Matthew Hughes, Logistics and Chaco War: Bolivia versus Paraguay, 1932–1935 (Journal of Military History 69, 2005)"]

- id: good-neighbor-1933
  year: 1933
  endYear: 1936
  title:
    ko: "선린 정책: 플랫 수정안 폐지와 아이티 철수(1933~1936)"
  summary:
    ko: "카리브에서 미국의 개입이 되풀이되자 라틴아메리카에서는 반감이 쌓였고, 허버트 후버 정부가 이미 군사 개입을 줄이는 쪽으로 움직이고 있었다(앞선 개입은 「루스벨트 추론과 카리브의 미국 점령(1904~1934)」, 앞의 사건). 1933년 3월 4일 취임한 프랭클린 루스벨트는 이웃 나라의 권리를 존중하는 '좋은 이웃'의 태도를 내세웠고, 1933년 12월에는 미국의 확정된 정책이 이제부터 무력 개입에 반대하는 것이라고 밝혔다. 1933년 12월 몬테비데오에서 열린 제7차 범아메리카 회의에서 미국은 다른 나라의 내정에 무력으로 개입하지 않는다는 원칙에 동의했다. 니카라과에서는 1934년 아우구스토 산디노가 피살된 뒤 아나스타시오 소모사 가르시아의 국가 방위대가 힘을 잡았다. 쿠바에서는 1933년 8월 12일 제라르도 마차도가 물러난 뒤 알베르토 에레라, 카를로스 마누엘 데 세스페데스, 5인 위원회, 라몬 그라우가 다섯 달 사이(1933년 8월~1934년 1월)에 이어졌고 카를로스 멘디에타가 1934년 1월 18일 임시 대통령이 되었다. 1934년 5월 29일 새 쿠바–미국 조약이 1903년의 관계 조약을 대신해 플랫 수정안의 개입권을 없앴지만 관타나모만 해군 기지는 그대로 두었다(「플랫 수정안과 쿠바 공화국의 출범(1901~1903)」, 앞의 사건). 아이티에서는 1934년 8월 1일 점령이 끝났다. 1936년 부에노스아이레스 평화 유지 회의가 이 원칙을 이었고, 한계도 남아 파나마 운하 지대의 미군은 그대로였다. 멕시코의 석유 국유화에도 미국은 군사 개입을 하지 않았다(「카르데나스의 개혁과 석유 국유화(1934~1940)」, 뒤의 사건)."
  subjects: [usa, cuba, haiti, nicaragua]
  links:
    - { from: usa, to: haiti, note: "점령군을 철수시킴 (1934)" }
  tags: [diplomacy, politics]
  sources: ["Bryce Wood, The Making of the Good Neighbor Policy (Columbia University Press, 1961)", "Louis A. Pérez Jr., Cuba under the Platt Amendment, 1902–1934 (University of Pittsburgh Press, 1986)"]

- id: cardenas-oil-1934
  year: 1934
  endYear: 1940
  title:
    ko: "카르데나스의 개혁과 석유 국유화(1934~1940)"
  summary:
    ko: "1920년대 후반 멕시코는 대통령에서 물러난 뒤에도 힘을 쥔 플루타르코 엘리아스 카예스의 영향 아래 에밀리오 포르테스 힐, 파스쿠알 오르티스 루비오, 아벨라르도 로드리게스 세 대통령이 이어졌다. 1934년 12월 1일 취임한 라사로 카르데나스는 1917년 헌법의 약속을 실행에 옮겼다. 대토지를 농민 공동체인 에히도에 나눠 주고 노동 조합을 키웠다. 1936년 카르데나스는 카예스를 국외로 내보내 힘을 굳혔다. 헌법 27조는 지하자원을 국가의 것으로 정했는데 석유는 영국·네덜란드·미국 회사가 쥐고 있었다. 노동자들이 임금과 계약을 요구했고 2,600만 페소 임금 판정을 회사가 받아들이지 않은 데다 대법원이 회사의 항소를 기각하자 카르데나스는 1938년 3월 18일 라디오로 석유 자원과 외국 석유 회사의 시설을 국유화한다고 밝혔다. 닷새 뒤 수도 소칼로 광장에 언론 추산 약 20만 명이 모였고 시민은 보상금을 모으려 물건을 기부했다. 1938년 6월 7일 법령으로 국영 석유 회사 페멕스가 만들어져 20일 영업을 시작했으며, 뒤에 세계 손꼽는 석유 회사로 자랐다. 영국은 1938년 5월 대사를 불러들였고 회사들은 멕시코 상품 불매를 호소했으며 여러 나라가 멕시코 석유 시장을 닫았다. 미국은 선린 정책에 따라 군사 개입을 하지 않았다(「선린 정책: 플랫 수정안 폐지와 아이티 철수(1933~1936)」, 앞의 사건). 대법원은 1939년 12월 2일 국유화가 합법이라고 판결했고, 보상 문제는 2차 대전 중에 풀렸다. 카르데나스는 스페인 내전에서 진 공화파 망명자도 받아들였고, 1940년 12월 마누엘 아빌라 카마초에게 대통령직을 넘겼다."
  subjects: [mexico, uk, usa]
  tags: [economy, politics]
  sources: ["Alan Knight, The Mexican Revolution, 2 vols. (Cambridge University Press, 1986)", "Jonathan C. Brown, Oil and Revolution in Mexico (University of California Press, 1993)"]

- id: canada-ww2-1939
  year: 1939
  endYear: 1944
  title:
    ko: "캐나다의 2차 대전과 징병 위기(1939~1944)"
  summary:
    ko: "캐나다는 1931년 웨스트민스터 헌장으로 영국과 동등한 자치령이 되어 외교권을 스스로 가졌다(「아일랜드 자유국과 웨스트민스터 헌장」, 앞의 사건). 그래서 1939년 9월 1일 독일이 폴란드를 침공하고 영국이 선전 포고를 한 뒤에도 캐나다 의회가 따로 표결해 9월 10일 독일에 선전 포고를 했다. 이웃 뉴펀들랜드는 재정 위기로 1934년 2월 16일부터 영국이 임명하는 위원회 정부 아래 있었고 영국과 함께 전쟁에 들어갔다. 1935년 총선으로 총리가 되어 전쟁 내내 정부를 이끈 캐나다 총리 윌리엄 라이언 매켄지 킹은 1940년 8월 미국 대통령 프랭클린 루스벨트와 오그던스버그에서 합의해 미국과 캐나다의 상설 공동 방위 위원회를 두었다. 1940년 9월에는 미국이 영국에 구축함 50척을 주고 뉴펀들랜드 같은 영국령 기지를 빌리는 거래가 이루어졌다. 1939년 12월에는 영국 연방 항공 훈련 계획이 캐나다에서 시작되어 연합국의 조종사를 길렀다. 1941년 12월에는 홍콩 방어에 나선 캐나다 부대가 일본군에 사로잡혔다. 캐나다군은 1942년 8월 프랑스 디에프 상륙에서 큰 피해를 입었고 1944년 6월 6일 노르망디 상륙에서 주노 해변을 맡았다. 병력이 모자라자 킹 정부는 1942년 4월 징병을 허용할지 국민 투표에 부쳤고, 영어권 다수가 찬성한 반면 프랑스어권 퀘벡은 크게 반대했다. 킹은 징병이 필요하면 하되 꼭 징병을 하는 것은 아니라는 말로 시행을 늦추었다. 1944년 11월 해외 전선에 징집병을 보내기로 한 결정은 다시 나라의 균열을 드러냈다. 뉴펀들랜드의 앞날은 「국민 투표와 뉴펀들랜드의 캐나다 합류(1946~1949)」(뒤의 사건)에서 다룬다."
  subjects: [canada, newfoundland]
  tags: [war, politics]
  sources: ["C. P. Stacey, Six Years of War: The Army in Canada, Britain and the Pacific (Queen's Printer, 1955)", "Desmond Morton, A Military History of Canada (McClelland & Stewart, 1985)"]

- id: ecuador-peru-war-1941
  year: 1941
  endYear: 1942
  title:
    ko: "에콰도르–페루 전쟁과 리우데자네이루 의정서(1941~1942)"
  summary:
    ko: "에콰도르와 페루는 독립 때부터 아마존 상류의 땅을 두고 다퉜다. 1936년 두 나라가 현상 유지선을 정했지만 1938년 뒤에도 충돌이 이어졌고, 1941년 7월 5일 사루미야강 일대에서 전투가 시작되었다(에콰도르는 이를 '41년 전쟁'이라 부른다). 서로 상대가 먼저 쏘았다고 주장했다. 페루군은 7월 23일 북부 분견대로 공세에 나서 마카라와 푸에르토볼리바르를 차지하고 낙하산 부대와 해군을 쓰며 과야킬을 봉쇄했다. 작고 장비가 부족한 에콰도르 군대는 아마존의 야우피강·산티아고강 쪽에서도 밀렸다. 에콰도르의 요청으로 7월 31일 휴전이 시작되었으나 페루가 어겨 전투가 이어졌고, 10월 2일 탈라라 협정이 새 휴전을 맺었다. 페루는 엘오로주와 로하주 일부, 분쟁 중인 아마존 땅을 차지해 엘오로에서 민간 행정을 폈고, 많은 주민이 피란했다. 1942년 1월 29일 리우데자네이루에서 열린 미주 외무 장관 회의 중에 에콰도르–페루 리우데자네이루 의정서가 서명되어 에콰도르는 아마존으로 나가는 길의 주장을 접었고, 미국·브라질·아르헨티나·칠레가 보증국을 맡았다. 1936년 선과 견주면 에콰도르가 약 1만 8,552km²를 내놓고 페루가 약 5,072km²를 내놓는 교환이었다. 에콰도르가 주장하던 마이나스 지방 약 20만 km²가 이로써 페루 땅으로 굳어졌고, 의정서는 1942년 2월 26일 양국 의회가 비준했다. 페루 대통령은 마누엘 프라도 우가르테체, 에콰도르 대통령은 카를로스 아로요 델 리오였고, 페루군은 1942년 2월 엘오로에서 물러났다. 1960년 호세 마리아 벨라스코 이바라 대통령이 점령 아래 서명되었다며 의정서가 무효라고 선언했으나 페루와 보증국은 인정하지 않았다."
  subjects: [ecuador, peru]
  links:
    - { from: ecuador, to: peru, note: "아마존 영토를 인정함 (1942)" }
  tags: [war, diplomacy]
  sources: ["David R. Mares and David Palmer, Power, Institutions, and Leadership in War and Peace: Lessons from Peru and Ecuador, 1995–1998 (University of Texas Press, 2012)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 8: Latin America since 1930 (Cambridge University Press, 1991)"]

- id: aleutian-islands-1942
  year: 1942
  endYear: 1943
  title:
    ko: "알류샨 열도 전투(1942~1943)"
  summary:
    ko: "1941년 12월 태평양 전쟁이 일어난 뒤(「태평양 전쟁 발발」, 앞의 사건) 일본은 1942년 6월 미드웨이 공격과 때를 맞춰 알래스카 서쪽의 알류샨 열도를 쳤다. 6월 3일과 4일 일본 항공기가 운알래스카섬의 미국 해군 기지 더치하버를 공습했고, 6월 6일 키스카섬과 7일 애투섬에 일본군이 올라 미국 땅인 두 섬을 차지했다. 미국은 열도에 사는 알류트인 880여 명을 며칠 안에 알래스카 남동부의 옛 통조림 공장과 광산 막사 같은 곳으로 옮겼고, 그곳으로 간 831명 가운데 85명이 숨졌다고 전한다. 프리빌로프 제도의 세인트폴·세인트조지섬 주민은 6월 24일부터 펀터만으로, 아트카섬 주민은 6월 25일 무렵 킬리스누로 옮겨졌는데 아트카 주민 83명 가운데 17명이 숨졌다. 애투섬 주민은 일본 홋카이도의 오타루로 끌려가 40퍼센트쯤이 억류 중 숨졌고, 소개된 주민은 1944~1945년에야 돌아갔다. 1943년 5월 11일 미국 제7보병 사단이 애투섬에 상륙해 싸웠고 5월 29일 일본군의 마지막 돌격으로 전투가 끝났는데, 미군은 전사 549명과 부상 1,148명에 심한 동상 환자 1,200명을 냈고 일본군은 시신 2,351구가 확인되었으며 포로는 28명뿐이었다. 키스카의 일본군은 7월 말 안개를 틈타 몰래 철수했고, 8월 15일 미국군과 캐나다군 3만 4,000여 명이 상륙했을 때는 적이 없었다. 이 상륙에는 캐나다군 약 5,300명이 함께했는데 미국·캐나다 합동 제1특별 임무군(약 2,000명)과 캐나다 공군 비행 대대 둘도 들어 있었고, 사상자 313명은 대부분 오인 사격·부비트랩·사고·질병·동상에서 나왔다."
  subjects: [usa, japan, canada]
  tags: [war]
  sources: ["Brian Garfield, The Thousand-Mile War: World War II in Alaska and the Aleutians (University of Alaska Press, 1995)", "Samuel Eliot Morison, History of United States Naval Operations in World War II, vol. 7: Aleutians, Gilberts and Marshalls, June 1942–April 1944 (Little, Brown, 1951)"]

- id: latin-america-ww2-1942
  year: 1942
  endYear: 1945
  title:
    ko: "라틴아메리카의 2차 대전 참전과 브라질 원정군(1942~1945)"
  summary:
    ko: "1942년 1월 리우데자네이루에서 미주 외무 장관 회의가 열리자 미국은 아메리카 나라들이 추축국과 관계를 끊도록 이끌었고, 아르헨티나의 외무 장관이 이에 반대해 아르헨티나는 중립을 지켰다. 멕시코에서는 유조선 포트레로델야노호(5월 13일)와 파하데오로호(5월 20일)가 독일 잠수함에 침몰하자 5월 22일 대통령 마누엘 아빌라 카마초가 전쟁 선포를 승인받으려 의회를 소집해 추축국과 전쟁에 들어갔다. 멕시코는 1942년 미국과 브라세로 협정을 맺어 농업 노동자를 미국에 보냈고(1964년까지 이어짐), 1945년 4월 30일 마닐라에 닿은 제201 전투 비행 대대(약 300명, 조종사 30명과 P-47 전투기 25대)가 필리핀 전역에서 싸워 조종사 5명이 숨졌다. 브라질은 상선 침몰이 잇따르자 1942년 8월 22일 독일·이탈리아에 전쟁을 선포했다. 브라질 원정군은 사령관 마스카렌야스 지 모라이스 아래 약 2만 5,900명으로 꾸려져 1944년 7월 2일 첫 5,000명이 떠나 7월 16일 나폴리에 닿았고, 미국 제5군에 속해 이탈리아 북부 전선에서 싸웠다. 1944년 11월 29일의 두 번째 공격이 막힌 몬테카스텔로는 1945년 2월 21일 브라질 제1사단이 차지했고, 원정군은 전사 948명을 내고 장군 둘을 포함한 포로 2만 573명을 잡았다. 공군에서는 1943년 12월 18일 창설된 제1전투 항공단이 445회 출격해 이탈리아 전선을 도왔다. 아르헨티나는 1943년 6월 군부 쿠데타로 선 정부에서 1944년 2월 에델미로 파렐이 대통령에 오른 뒤에도 중립을 이어 가다 1945년 3월 27일 일본과 독일에 전쟁을 선포했다."
  subjects: [brazil, mexico, argentina, usa]
  tags: [war, politics]
  sources: ["Frank D. McCann, The Brazilian-American Alliance, 1937–1945 (Princeton University Press, 1973)", "Leslie Bethell (ed.), The Cambridge History of Latin America, vol. 8: Latin America since 1930 (Cambridge University Press, 1991)"]

- id: bretton-woods-1944
  year: 1944
  title:
    ko: "브레턴우즈 회의(1944)"
  summary:
    ko: "1944년 7월 1일부터 22일까지 미국 뉴햄프셔주 브레턴우즈의 마운트워싱턴 호텔에 연합국 44개국 대표 730명이 모여 전후의 통화·금융 질서를 논의했다. 공식 이름은 연합국 통화 금융 회의였고 쿠바·멕시코·브라질 같은 아메리카 나라들도 대표를 보냈다. 전쟁 막바지에 미국은 금 준비의 대부분을 쥔 가장 큰 채권국이었고, 1930년대의 통화 블록과 경쟁적 평가 절하가 무역을 줄였다는 반성이 회의의 바탕이었다. 영국 쪽 협상 대표는 경제학자 존 메이너드 케인스, 미국 쪽은 재무부의 해리 덱스터 화이트였고 화이트가 국제 통화 기금을 다룬 제1위원회를, 케인스가 국제 부흥 개발 은행을 다룬 제2위원회를 맡았다. 케인스는 국제 청산 동맹과 '방코르'라는 새 국제 통화를 두자고 했으나, 달러를 금에 묶고 다른 나라 통화를 달러에 묶는 미국의 안이 받아들여졌다. 회의는 국제 통화 기금과 국제 부흥 개발 은행을 세우기로 했고, 환율은 근본적인 불균형이 있을 때만 고치게 했다. 각국은 국제 통화 기금에 출자금(쿼터)을 내고 그 크기가 표결권을 정했으며, 국제 부흥 개발 은행은 전쟁으로 무너진 나라들의 재건과 개발에 돈을 빌려주는 일을, 국제 통화 기금은 회원국의 단기 국제 수지 어려움을 돕는 일을 맡았다. 협정은 출자금의 80퍼센트 이상을 맡은 나라들이 비준해야 효력이 생겼는데 1945년 12월 27일 그 기준을 채웠고 첫 총회는 1946년 3월 미국 서배너에서 열렸다. 소련은 최종 의정서에 서명했으나 비준하지 않아 두 기구에 가입하지 않았다. 국제 연합 헌장은 「국제 연합의 창설」(뒤의 사건)에서 보듯 이듬해 서명되었고, 두 기구는 국제 연합과 함께 전후 세계 질서의 틀이 되었다."
  subjects: [usa, uk, soviet-union]
  tags: [economy, diplomacy]
  sources: ["Benn Steil, The Battle of Bretton Woods: John Maynard Keynes, Harry Dexter White, and the Making of a New World Order (Princeton University Press, 2013)", "Richard N. Gardner, Sterling-Dollar Diplomacy (Oxford University Press, 1956)"]
