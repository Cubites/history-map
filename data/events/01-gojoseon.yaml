# ── 여러 나라의 성장 ───────────────────────────────────

- id: buyeo-society
  year: -199
  endYear: -100
  precision: century
  title:
    ko: 부여의 성장과 풍속
  summary:
    ko: "쑹화강 유역의 넓은 평야에서 부여가 성장했다. 왕 아래 마가·우가·저가·구가가 각자 사출도를 다스리는 연맹 왕국이었다. 12월에 영고라는 제천 행사를 열었고, 남의 물건을 훔치면 12배로 갚는 1책 12법, 형이 죽으면 동생이 형수를 아내로 삼는 형사취수제, 왕이 죽으면 사람을 함께 묻는 순장 풍습이 있었다. 반농반목으로 말·주옥·모피가 특산물이었다. 전쟁이 일어나면 하늘에 제사하고 소를 잡아 그 굽으로 길흉을 점쳤다(우제점법). 가뭄이나 장마로 곡식이 여물지 않으면 그 책임을 왕에게 물어 바꾸거나 죽여야 한다고 했고, 흰옷을 즐겨 입었으며, 영고 때에는 형옥을 멈추고 죄수를 풀어 주었다."
  subjects: [buyeo]
  tags: [society]
  sources: ["『삼국지』 위서 동이전 부여"]

- id: okjeo-dongye
  year: -107
  endYear: -1
  precision: century
  title:
    ko: 옥저와 동예의 풍속
  summary:
    ko: "함경도 해안의 옥저와 강원도 북부 해안의 동예는 왕이 없고 읍군·삼로라는 군장이 다스렸다. 옥저에는 여자아이를 신랑 집에서 기르다 성인이 되면 혼인시키는 민며느리제와, 가족이 죽으면 뼈를 추려 한 목곽에 넣는 가족 공동 무덤이 있었다. 동예는 10월에 무천이라는 제천 행사를 열고, 다른 부족의 영역을 침범하면 노비·소·말로 갚는 책화와 같은 씨족끼리 혼인하지 않는 족외혼이 있었다. 단궁·과하마·반어피가 특산물이었다. 두 나라 모두 고구려의 압박으로 크게 성장하지 못했다. 옥저는 땅이 기름지고 바다에서 나는 것이 많았으나 고구려에 복속되어 베·물고기·소금 같은 공물을 멀리 날라 바쳤으며, 동예는 호랑이를 신으로 섬겨 제사를 지냈다."
  subjects: [okjeo, dongye]
  tags: [society]
  sources: ["『삼국지』 위서 동이전 동옥저·예"]

- id: samhan
  year: -107
  endYear: -1
  precision: century
  title:
    ko: 삼한의 성립과 제정 분리
  summary:
    ko: "고조선 멸망 뒤 유이민이 남쪽으로 내려오면서 진국이 마한·진한·변한의 삼한으로 발전했다. 마한의 목지국 지배자가 삼한을 이끌었고, 신지·견지(큰 세력)와 읍차·부례(작은 세력)라는 군장이 있었다. 제사장인 천군이 다스리는 신성 지역 소도에는 군장의 권력이 미치지 못해 제정이 분리되어 있었다. 5월 수릿날과 10월 계절제를 지냈고, 벼농사를 위해 저수지를 만들었다(김제 벽골제 등). 변한은 철이 많이 나서 낙랑과 왜에 수출하고 화폐처럼 썼다. 마한은 54개, 진한과 변한은 각각 12개의 소국으로 이루어졌는데, 마한의 백제국·진한의 사로국·변한의 구야국이 뒤에 각각 백제·신라·금관가야로 성장했다. 소도에는 큰 나무를 세우고 방울과 북을 매달아 귀신을 섬겼으며, 죄지은 사람이 도망쳐 들어가도 잡아가지 못했다. 진한에는 아이의 머리를 돌로 눌러 납작하게 만드는 편두 풍습이 있었다."
  subjects: [mahan, jinhan, byeonhan, jin-guk]
  links:
