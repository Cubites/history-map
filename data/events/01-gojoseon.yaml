# 1번 묶음: 고조선과 여러 나라 (기원전 2333 ~ 기원전 1세기)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 연도는 천문 연도: 기원전 1년 = 0, 기원전 108년 = -107.
# 연대가 분명하지 않은 사건은 precision: century(세기) 또는 decade(무렵)로 적는다.
# 삼국의 건국(기원전 57~)부터는 2번 묶음에서 다룬다.

# ── 선사 시대 (2026-09-28): 연도 막대 왼쪽의 구석기·신석기 단계에서 보인다 ──

- id: paleolithic
  year: -699999
  title:
    ko: 구석기 시대의 생활
  summary:
    ko: "약 70만 년 전부터 한반도에 사람이 살았다. 돌을 깨뜨려 만든 뗀석기를 썼는데, 전기에는 주먹도끼·찍개처럼 하나로 여러 용도에 쓰는 도구를, 후기에는 슴베찌르개처럼 작고 쓰임새가 나뉜 도구를 만들었다. 사냥과 채집으로 먹을 것을 구하며 동굴이나 바위 그늘, 강가의 막집에 살고 옮겨 다녔다. 무리를 이루어 살았고 지도자는 있었으나 계급은 없는 평등 사회였다. 연천 전곡리에서는 동아시아에서 처음으로 아슐리안계 주먹도끼가 발견되었다. 청원 두루봉 동굴에서는 국화꽃 가루가 뿌려진 채 묻힌 어린아이 뼈(흥수아이)가 나와 장례 풍습을 짐작하게 하며, 공주 석장리·단양 수양개 등에서는 짐승과 물고기 모양을 새긴 조각품이 나와 사냥감이 늘기를 빈 것으로 본다."
  subjects: [prehistory]
  tags: [society]
  sources: ["국사편찬위원회 『한국사』 2", "전곡선사박물관 해설"]
  places: [{ name: "연천 전곡리", at: [127.06, 38.01] }, { name: "공주 석장리", at: [127.08, 36.45] }, { name: "단양 수양개", at: [128.33, 37.0] }, { name: "상원 검은모루 동굴", at: [126.1, 38.85] }, { name: "청원 두루봉 동굴 (흥수아이)", at: [127.52, 36.63] }]

- id: neolithic
  year: -7999
  precision: decade
  title:
    ko: 신석기 시대의 생활
  summary:
    ko: "기원전 8000년 무렵부터 돌을 갈아 만든 간석기와 토기를 쓰기 시작했다. 이른 민무늬 토기·덧무늬 토기에 이어 빗살무늬 토기가 널리 쓰였다. 조·피 등을 기르는 농경과 목축이 시작되었으나 여전히 사냥·채집·고기잡이가 중요했다. 강가나 바닷가에 반지하 움집을 짓고 정착했으며, 가락바퀴와 뼈바늘로 옷과 그물을 만들었다. 씨족을 바탕으로 한 부족 사회였고 계급은 없었다. 자연물에 영혼이 있다는 애니미즘, 특정 동식물을 숭배하는 토테미즘, 무당을 믿는 샤머니즘이 나타났다. 갈돌과 갈판으로 곡식을 갈았고, 움집은 바닥이 둥글거나 모서리가 둥근 네모꼴이며 가운데에 화덕을 두었다. 부산 동삼동 조개더미에서는 조개껍데기 가면과 일본 규슈산 흑요석이 나와 바다 건너 교류가 있었음을 보여 준다."
  subjects: [prehistory]
  tags: [society, culture]
  sources: ["국사편찬위원회 『한국사』 2", "국립중앙박물관 선사·고대관 해설"]
  places: [{ name: "서울 암사동", at: [127.13, 37.56] }, { name: "양양 오산리", at: [128.68, 38.08] }, { name: "부산 동삼동 조개더미", at: [129.07, 35.08] }, { name: "제주 고산리", at: [126.18, 33.3] }, { name: "봉산 지탑리 (탄화된 좁쌀)", at: [125.95, 38.5] }]

# ── 고조선의 건국과 발전 ────────────────────────────────

- id: gojoseon-founded
  year: -2332
  title:
    ko: 고조선 건국과 단군 신화
  summary:
    ko: "단군왕검이 아사달에 도읍해 고조선을 세웠다고 전한다. 단군 신화에는 하늘의 자손이라는 선민사상, 환웅 부족과 곰을 숭배하는 부족의 결합(토테미즘), 바람·비·구름을 다스리는 농경 사회, 제사장(단군)과 정치 지배자(왕검)를 겸한 제정일치 사회, 널리 인간을 이롭게 한다는 홍익인간의 이념이 담겨 있다. 단군 신화는 『삼국유사』·『제왕운기』·『세종실록』 지리지·『동국여지승람』 등에 실려 있다. 강화 마니산의 참성단은 단군이 하늘에 제사 지낸 제단이고, 정족산의 삼랑성은 단군이 세 아들을 시켜 쌓은 성이라고 『고려사』 지리지에 전한다."
  subjects: [gojoseon]
  tags: [politics]
  sources: ["『삼국유사』 기이 고조선(왕검조선)", "『제왕운기』", "『동국통감』"]

- id: bronze-age
  year: -1999
  endYear: -1000
  precision: century
  title:
    ko: 청동기 문화와 고조선의 세력 범위
  summary:
    ko: "한반도와 만주에서 청동기 문화가 발전하면서 계급이 생기고 군장(족장)이 나타났다. 비파형 동검, 고인돌(탁자식), 미송리식 토기, 거친무늬 거울이 나오는 요령 지방과 한반도 서북부가 고조선의 세력 범위로 여겨진다. 반달 돌칼로 곡식을 거두고 민무늬 토기를 썼으며, 일부 지역에서 벼농사가 시작되었다. 무덤으로는 고인돌과 돌널무덤을 만들었는데, 거대한 고인돌 덮개돌을 옮기려면 많은 사람을 동원해야 했으므로 지배자의 힘을 짐작할 수 있다. 여주 흔암리·부여 송국리에서는 탄화미가 나왔고, 마을 둘레에 도랑(환호)과 나무 울타리(목책)를 둘러 외부의 침입에 대비했다. 고창·화순·강화의 고인돌 유적은 2000년 유네스코 세계 유산에 올랐다. 바위그림으로는 고래·거북·사슴과 배를 타고 고래를 잡는 모습을 새긴 울주 대곡리 반구대 암각화, 동심원 같은 기하학 무늬를 새긴 고령 장기리 암각화가 꼽힌다. 반구대 암각화는 신석기 시대에 새겼다는 견해도 있으며, 2025년 천전리 암각화와 함께 '반구천의 암각화'로 유네스코 세계 유산에 올랐다."
  subjects: [gojoseon]
  tags: [culture, society]
  sources: ["국사편찬위원회 『한국사』"]
  places: [{ name: "강화 부근리 고인돌", at: [126.43, 37.76] }, { name: "고창 고인돌", at: [126.6, 35.43] }, { name: "화순 고인돌", at: [126.97, 34.97] }, { name: "부여 송국리", at: [126.96, 36.2] }, { name: "의주 미송리 동굴", at: [124.6, 40.2] }]

