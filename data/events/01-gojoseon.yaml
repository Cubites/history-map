- id: iron-age
  year: -449
  endYear: -200
  precision: century
  title:
    ko: 철기 문화의 보급과 독자적인 청동기 문화
  summary:
    ko: "기원전 5세기 무렵부터 철기가 보급되어 농기구와 무기가 발전했다. 명도전·반량전·오수전 같은 중국 화폐가 나와 중국과 활발히 교류했음을 알 수 있고, 창원 다호리에서 나온 붓은 한자를 썼음을 보여 준다. 한편 세형동검·잔무늬 거울과 거푸집이 나와 독자적인 청동기 문화가 발전했다(세형동검 문화). 널무덤·독무덤을 만들었다. 철기가 널리 쓰이면서 청동기는 주로 의식에 쓰는 도구로 바뀌었고, 늘어난 농업 생산력과 활발해진 정복 활동은 여러 나라가 성장하는 바탕이 되었다."
  subjects: [gojoseon, yan-state]
  links:
    - { from: yan-state, to: gojoseon, note: "명도전 유입, 철기 전래" }
  tags: [culture, economy]
  sources: ["국사편찬위원회 『한국사』"]

