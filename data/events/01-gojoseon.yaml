# ── 위만 조선 ─────────────────────────────────────────

- id: wiman-194
  year: -193
  title:
    ko: 위만의 집권
  summary:
    ko: 진·한 교체기의 혼란으로 유이민이 고조선으로 들어왔다. 연 지역에서 1천여 명을 이끌고 온 위만은 준왕에게서 서쪽 변경을 지키는 일을 맡았다가, 세력을 키워 준왕을 몰아내고 왕이 되었다(기원전 194). 위만은 상투를 틀고 조선옷을 입었으며, 나라 이름을 그대로 조선이라 하고 토착민 출신을 높은 벼슬에 앉혔다. 쫓겨난 준왕은 남쪽 진국으로 가서 한왕이라 했다고 전한다.
