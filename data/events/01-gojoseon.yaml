    ko: 한은 고조선 땅에 낙랑·진번·임둔군을 두고 이듬해 현도군을 두었다. 고조선에는 사회 질서를 지키는 8조법이 있었는데, 사람을 죽인 자는 사형, 남을 다치게 한 자는 곡식으로 배상, 도둑질한 자는 노비로 삼되 용서받으려면 50만 전을 내게 했다는 3개 조항이 전한다. 생명과 노동력, 사유 재산을 중시한 계급 사회였음을 알 수 있다. 한 군현이 설치된 뒤 법 조항이 60여 개로 늘어나 풍속이 각박해졌다.
