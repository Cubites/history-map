- id: commanderies-82
  year: -81
  endYear: -74
  title:
    ko: 진번·임둔군 폐지와 현도군 이동
  summary:
    ko: "토착 세력의 저항으로 한은 진번군과 임둔군을 폐지해 낙랑군과 현도군에 나누어 합쳤고(기원전 82), 현도군을 서북쪽으로 옮기면서(기원전 75) 옛 임둔 지역인 영동 7현은 낙랑군 동부도위가 맡게 되었다. 낙랑군은 313년 고구려 미천왕에게 쫓겨날 때까지 남았다."
