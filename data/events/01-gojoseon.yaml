  summary:
    ko: "위만 조선은 철기 문화를 본격적으로 받아들여 군사력을 키우고, 진번과 임둔을 복속시켜 영토를 넓혔다. 한반도 남쪽의 진국과 한 사이의 직접 교역을 막고 중계 무역으로 이익을 얻었다. 위만의 손자 우거왕 때 조선상 역계경이 왕에게 간언했다가 받아들여지지 않자 동쪽의 진국으로 떠났는데, 이때 2천여 호의 백성이 따라갔다고 전한다(『위략』)."
