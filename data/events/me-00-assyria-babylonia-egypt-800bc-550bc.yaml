- id: carthage-africa-750bc
  year: -749
  endYear: -549
  title:
    ko: "카르타고의 아프리카 쪽 바탕(기원전 8~6세기): 우티카와 리비아 부족, 도시의 핵과 마고 가문"
  summary:
    ko: "카르타고는 오늘날 튀니스 만 안쪽의 반도에 있었다. 건국 전승은 유럽 쪽 사건에서 다루므로(「페니키아인과 카르타고의 서지중해: 건국 전승(기원전 814), 에부수스(기원전 654 무렵), 알랄리아 무렵까지」, 앞의 사건) 여기서는 아프리카 쪽 사정을 본다. 발굴은 기원전 8세기 중엽에 사람이 살았고 자주색 염료를 만든 뿔고둥 껍데기가 쌓였음을 보여 주며, 기원전 7세기에는 약 10헥타르의 첫 도시 핵이 있었다. 가까운 우티카는 카르타고보다 오래된 페니키아 도시로 전해지나 발굴된 가장 이른 층은 기원전 8세기로 보는 견해가 많다. 하드루메툼(수스)과 렙티스 같은 페니키아 거점이 튀니지와 리비아 해안을 따라 이어졌고 서쪽 모로코 해안에는 릭수스가 있었다. 카르타고 둘레에는 리비아 사람 농민과 유목 부족이 살았다. 유스티누스는 카르타고 사람들이 땅값을 리비아 사람에게 오랫동안 바쳤다고 전하는데(18.5), 이는 후대의 서술이어서 사실 여부와 기간을 확인하기 어렵다. 도시에는 어린아이의 유해와 석비를 묻은 토펫이 있어, 이를 어린이 희생의 증거로 보는 견해와 영아 묘지로 보는 견해가 맞선다. 기원전 6세기 중엽부터 마고 가문이 군사 지휘권을 쥐었다고 전한다. 유스티누스에 따르면 마고는 군대를 정비하고 영토를 넓혀 리비아 사람과 싸웠다(18.7). 카르타고의 부와 군대는 아프리카 쪽의 곡물과 올리브 농사, 말을 얻을 수 있는 리비아 사람과의 관계 위에서 자랐다. 카르타고가 모도시 티레의 신 멜카르트에게 해마다 예물을 보냈다는 후대의 서술도 있다. 카르타고가 힘을 키우면서 우티카 같은 아프리카 쪽 페니키아 도시가 점차 카르타고와 가까운 동맹이나 속국이 되었다는 서술이 있으나 그 시기는 분명하지 않다."
  subjects: [carthage]
  tags: [politics, economy, society]
  sources: ["Dexter Hoyos, The Carthaginians (Routledge, 2010)", "Maria Eugenia Aubet, The Phoenicians and the West (2판, Cambridge University Press, 2001)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 18~19 (J. C. Yardley 영역, Scholars Press, 1994)", "Josette Elayi, History of Phoenicia (Lockwood Press, 2018)"]

- id: nabonassar-babylonian-astronomy-747bc
  year: -746
  endYear: -651
  title:
    ko: "나보나사르의 바빌로니아(기원전 747)와 바빌로니아 천문 기록: ‘나보나사르 기원’과 천문 일지(기원전 652~)"
  summary:
    ko: "바빌로니아 왕 나부나시르(그리스 이름 나보나사르)는 기원전 747년에 즉위해 734년까지 다스렸다. 훗날 프톨레마이오스는 『알마게스트』에서 이 즉위의 해를 천문 계산의 기원 원년으로 삼았고, 이를 ‘나보나사르 기원’이라 부른다. 이 연대는 기원전 8세기 이후의 일식·월식 관측 기록이 이어진 덕분에 오늘날 해마다 맞출 수 있다. 바빌로니아에는 이미 오래전부터 점성술과 천체 관측이 신전과 궁정의 일이었고, 아시리아 왕 에사르하돈과 아슈르바니팔의 궁정에 점성가들이 올린 보고서가 많이 남아 있다. 그들은 일식과 행성의 움직임을 불길한 조짐으로 읽고 왕에게 대처를 권했다. 바빌로니아의 천문 일지는 기원전 652년부터 시작하는 것이 지금까지 알려진 가장 이른 것으로, 달·행성·날씨·곡물 가격과 큰 사건을 달마다 적었다. 이 자료는 훗날 신바빌로니아와 아케메네스, 헬레니즘 시대까지 이어진다. 프톨레마이오스는 날짜를 해마다 365일로 고정된 이집트식 달력으로 세어, 고대의 관측을 하나의 연대표에 올릴 수 있게 했다. 『알마게스트』는 ‘마르도켐파도스’(마르두크아플라이딘나 2세)의 원년인 기원전 721년의 월식을 바빌로니아의 관측으로 인용한다. 프톨레마이오스의 ‘왕 명단’은 나보나사르부터 왕을 이어 적어 고대 연대학의 뼈대가 되었고, 후대 서술(베로소스)은 나부나시르가 앞 왕들의 기록을 없앴다고 전하나 믿기 어렵다. 관측은 신전 사제단의 학자들이 이어 맡았고 징조 풀이는 ‘에누마 아누 엔릴’ 같은 징조 모음집으로 정리되었다. 아시리아와 바빌로니아의 연대기 가운데 『바빌로니아 연대기』 1번이 나부나시르의 즉위부터 기록을 시작하는 것도 이 시기의 의미를 보여 준다."
  subjects: [babylonia-kingdom, neo-assyrian-empire]
  tags: [culture]
  sources: ["A. J. Sachs·H. Hunger, Astronomical Diaries and Related Texts from Babylonia, vol. I: Diaries from 652 B.C. to 262 B.C. (Verlag der Österreichischen Akademie der Wissenschaften, 1988)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "J. A. Brinkman, A Political History of Post-Kassite Babylonia, 1158–722 B.C. (Pontificium Institutum Biblicum, 1968)", "Marc Van De Mieroop, A History of the Ancient Near East, ca. 3000–323 BC (3판, Wiley-Blackwell, 2016)"]

- id: tiglath-pileser-iii-745bc
  year: -744
  endYear: -726
  title:
    ko: "티글라트필레세르 3세(기원전 745~727): 아시리아의 개혁, 아르파드의 함락과 바빌론 왕위"
  summary:
    ko: "아시리아에서는 기원전 746년 칼후(님루드)에서 반란이 일어났고, 이듬해 티글라트필레세르 3세가 왕위에 올랐다(재위 기원전 745~727). 그는 귀족들이 쥔 큰 속주를 작게 쪼개 왕이 보낸 총독에게 맡기고, 비문을 새길 권리를 왕에게만 두었으며, 샴시일루 같은 대신의 이름을 기록에서 지웠다. 군대는 농한기에 모이는 징집병에서 왕이 거느리는 상비군(키슈르 샤리, ‘왕의 부대’)으로 바뀌어 정복지 병사와 용병도 편입했다. 정복지 사람을 대규모로 옮기는 정책을 본격화한 것도 이 왕이다. 기원전 744년 바빌로니아 동쪽을 치고 마나이의 왕(이란주로 보는 견해가 있다)과 손잡았으며, 744~743년 자그로스에 비트함반·파르수아 속주를 세웠다. 기원전 743년에는 우라르투 왕 사르두리 2세를 아르파드 근처에서 꺾고 그를 투슈파까지 쫓았다. 북시리아의 아르파드는 이미 기원전 754년 무렵 아슈르니라리 5세와 맺은 조약(왕 마티일루, 서판 일부만 남음)으로 아시리아의 종주권 아래 들어가 있었으나, 3년의 원정과 긴 포위 끝에 기원전 740년 함락되어 속주가 되었다. 기원전 738년에는 아르파드 남쪽에 쿨라니아·하타리카·시미라 속주를 세웠으나 하맛은 속국으로 두었다. 기원전 734년에는 이집트 국경에 이르러 가자를 점령했고, 유다·에돔·모압·암몬이 공물을 바쳤다. 기원전 732년 다마스쿠스를 얻은 일은 뒤에 따로 다룬다. 기원전 732~731년 무렵 바빌로니아에서 나부무킨제리가 왕위에 오르자 기원전 729년 바빌론을 차지하고, 바빌로니아 사람들이 왕으로 인정한 첫 아시리아 왕이 되었다. 바빌로니아는 속주가 아니라 한 왕 아래 두 나라(개인 연합)로 남았다. 그는 약 68세로 기원전 727년에 죽었고 아들 샬마네세르 5세가 이었다. 그가 칼후에 지은 중앙 궁전의 부조는 훗날 에사르하돈이 다른 궁전의 재료로 다시 썼다. 이 정책은 이후 사르곤 2세와 센나케리브가 이어받아 제국의 틀이 되었다."
  subjects: [neo-assyrian-empire, arpad-kingdom, hamath-kingdom, babylonia-kingdom, urartu, aram-damascus, judah-kingdom]
  links:
    - { from: neo-assyrian-empire, to: arpad-kingdom, note: "아르파드 정복과 속주화 (기원전 740)" }
