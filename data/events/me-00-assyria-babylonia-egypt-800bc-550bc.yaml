- id: samaria-fall-722bc
  year: -721
  endYear: -719
  title:
    ko: "사마리아의 함락(기원전 722/721)과 하맛의 반란(기원전 720)"
  summary:
    ko: "이스라엘의 마지막 왕 호세아(재위 기원전 732~722 무렵)는 아시리아에 공물을 바치다가 티글라트필레세르 3세가 죽자 공물을 끊고 이집트의 ‘소’ 왕에게 사자를 보냈다고 열왕기는 전한다(열왕기 하 17장). 소가 누구인지는 사이스의 테프나크트 계열의 왕, 타니스의 오소르콘 4세 등으로 학자들 사이에 의견이 갈린다. 샬마네세르 5세는 호세아를 가두고 사마리아를 3년 동안 에워쌌다(포위는 기원전 725~724년에 시작해 722년에 끝난 것으로 본다). 바빌로니아 연대기는 샬마네세르가 ‘사마리아를 파괴했다’고 짧게 적는다. 한편 그 뒤를 이은 사르곤 2세는 자기 비문에서 사마리아를 얻고 27,280명을 옮겼다고 주장한다. 많은 학자는 포위를 끝낸 이가 샬마네세르 5세였고 사르곤이 공을 자기 것으로 삼았다고 본다. 이주민은 아시리아의 구자나(하부르강 유역)와 메디아의 성읍들에 정착했고(열왕기 하 17장은 할라와 하볼강가의 고산을 든다), 빈 땅에는 바빌로니아·하맛 등에서 데려온 사람들이 채워져 이스라엘은 사마리아 속주가 되었다. 이 이주를 ‘아시리아 포로기’라 하며, 후대 전승은 북왕국 열 지파가 사라졌다고 하나 역사가는 그 땅의 사람 가운데 상당수가 남았고 일부는 유다로 피난했다고 본다. 기원전 720년에는 하맛의 야우비디(일루비디)가 이웃 도시들을 모아 반란을 일으켰으나 사르곤이 오론테스강 가의 카르카르에서 꺾고 그를 처형했으며, 하맛은 속주가 되어 아시리아 사람들이 옮겨 살게 되었다고 한다. 사마리아 발굴에서는 기원전 8세기 말의 파괴층과 아시리아식 건물이 확인되어, 도시가 이후 아시리아 총독의 거점이 되었다고 본다."
  subjects: [israel-kingdom, hamath-kingdom, neo-assyrian-empire]
  links:
    - { from: neo-assyrian-empire, to: israel-kingdom, note: "사마리아 함락과 속주화 (기원전 722/721)" }
    - { from: neo-assyrian-empire, to: hamath-kingdom, note: "카르카르 전투와 하맛의 병합 (기원전 720)" }
  tags: [politics, war]
  sources: ["Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)", "Grant Frame, The Royal Inscriptions of Sargon II, King of Assyria (721–705 BC) (Pennsylvania State University Press, 2021)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "『구약 성경』 열왕기 하 17~18장 (대한성서공회 개역개정)", "Bustenay Oded, Mass Deportations and Deportees in the Neo-Assyrian Empire (Reichert, 1979)"]

- id: merodach-baladan-721bc
  year: -720
  endYear: -709
  title:
    ko: "마르두크아플라이딘나 2세의 바빌론(기원전 721~710)과 사르곤 2세의 재정복"
  summary:
    ko: "남쪽 늪과 해안의 칼데아 부족 가운데 비트야킨의 족장 마르두크아플라이딘나 2세는 아시리아가 바빌로니아를 쥐고 있던 기원전 729년 이후에도 공물을 바치며 힘을 길렀다. 샬마네세르 5세가 죽고 사르곤 2세가 왕위를 두고 다투던 기원전 722~721년 무렵 그는 바빌론을 차지해 왕이 되었고, 바빌로니아 연대기는 그가 12년 다스렸다고 적는다. 엘람의 훔반니카시 1세와 손잡은 그는 기원전 720년 데르에서 사르곤의 군대와 싸웠다. 사르곤은 이긴 것처럼 적었으나 바빌로니아 연대기는 엘람 왕이 아시리아군을 물리쳤다고 적어 사르곤은 한동안 바빌로니아를 되찾지 못했다. 마르두크아플라이딘나가 유다의 히스기야에게 사절을 보냈다고 열왕기는 전하며(히스기야의 병을 문병하는 사절로 적는다), 이를 반아시리아 연합을 꾀한 것으로 보는 풀이는 연구자들의 추정이고 그 해도 기원전 8세기 말과 701년 직전 사이에서 확실하지 않다(열왕기 하 20장). 사르곤은 서쪽과 북쪽의 일을 마친 뒤 기원전 710년 바빌로니아를 쳐 바빌론에 들어갔고, 바빌론의 마르두크 사제단은 그를 환영해 왕으로 받아들였다. 이듬해 마르두크아플라이딘나는 비트야킨의 거점 두르야킨에서 항복하고 목숨은 건진 채 엘람으로 달아났다. 사르곤은 이후 ‘바빌론의 왕’ 칭호를 쓰며 기원전 705년까지 두 나라를 다스렸다. 이 칼데아 족장은 센나케리브가 즉위하자 다시 돌아와 바빌로니아를 흔든다(「센나케리브의 바빌로니아 정책(기원전 703~689)과 바빌론의 파괴, 암살(기원전 681)」, 뒤의 사건). 바빌로니아의 사제단과 도시들은 아시리아의 간섭 속에서도 독자적인 이해를 지켰고, 칼데아 부족과 아람 부족은 두 세력 사이를 오가며 자기 몫을 챙겼다. 사르곤은 비트야킨의 땅이 걸프의 딜문(바레인) 쪽까지 이어졌다고 적었다."
  subjects: [babylonia-kingdom, neo-assyrian-empire, elam-neo-elamite, judah-kingdom]
  links:
    - { from: neo-assyrian-empire, to: babylonia-kingdom, note: "바빌로니아 재정복과 ‘바빌론 왕’ 즉위 (기원전 710)" }
  tags: [politics, war]
  sources: ["A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Grant Frame, The Royal Inscriptions of Sargon II, King of Assyria (721–705 BC) (Pennsylvania State University Press, 2021)", "J. A. Brinkman, A Political History of Post-Kassite Babylonia, 1158–722 B.C. (Pontificium Institutum Biblicum, 1968)", "Matthew W. Waters, A Survey of Neo-Elamite History (State Archives of Assyria Studies 12, Neo-Assyrian Text Corpus Project, 2000)", "『구약 성경』 열왕기 하 20장 (대한성서공회 개역개정)"]

- id: sargon-ii-717bc
  year: -716
  endYear: -704
  title:
    ko: "사르곤 2세(기원전 722~705)의 원정과 두르샤루킨의 건설, 타발에서의 죽음"
  summary:
    ko: "사르곤 2세는 기원전 722년 1월 샬마네세르 5세 뒤에 왕위에 올랐다(다툼 끝에 올랐다는 견해가 많고 형제 관계도 분명하지 않다). 기원전 717년 카르케미시의 피시리가 반란을 일으키자 사르곤은 이를 눌러 카르케미시를 속주로 삼았고, 같은 해 칼후 북쪽에 새 도시 두르샤루킨(‘사르곤의 성채’, 지금의 코르사바드)을 짓기 시작했다. 기원전 716년 메디아 쪽에서는 하르하르와 키셰심에 속주를 세워 이란 고원 서쪽에 아시리아의 거점을 두었다. 기원전 714년에는 우라르투 왕 루사 1세를 우아우슈산 근처에서 꺾고 신전 도시 무사시르를 약탈했다(「아시리아 곁의 두 왕국: 우라르투(기원전 9세기~590 무렵)와 프리기아의 미다스(기원전 8세기~695 무렵)」, 앞의 사건). 기원전 713년에는 타발을 병합했고 기원전 711년에는 아스돗의 이아마니를 눌렀다. 기원전 709년에는 키프로스의 일곱 왕이 공물을 바쳤고(키티온의 사르곤 석비는 원정 뒤에 섰다), 프리기아의 미다스(아시리아 기록의 무쉬키 왕 미타)도 아시리아와 화해했다. 앞서 기원전 710년 사르곤은 바빌론에 들어가 ‘바빌론의 왕’이 되었다(앞의 사건 「마르두크아플라이딘나 2세의 바빌론(기원전 721~710)과 사르곤 2세의 재정복」). 두르샤루킨은 기원전 707년에 끝나 706년에 왕궁이 옮겨졌고 성벽과 궁궐 벽면에는 라마수(날개 달린 소) 석상과 부조가 새겨졌다. 그러나 기원전 705년 타발에서 쿨룸마의 구르디가 아시리아 진영을 쳐서 사르곤이 죽었고 시신은 끝내 찾지 못했다고 한다. 아시리아에서는 왕이 장례도 받지 못한 일이 재앙으로 읽혔고, 아들 센나케리브는 새 도시를 버리고 수도를 니네베로 옮겼다."
  subjects: [neo-assyrian-empire, urartu, phrygia, babylonia-kingdom]
  tags: [politics, war]
  sources: ["Grant Frame, The Royal Inscriptions of Sargon II, King of Assyria (721–705 BC) (Pennsylvania State University Press, 2021)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: media-rise-716bc
  year: -715
  endYear: -611
  title:
    ko: "메디아의 흥기(기원전 8~7세기): 아시리아 기록의 메디아 족장들과 키악사레스, 아라파와 아슈르의 공격(기원전 615~614)"
  summary:
    ko: "메디아 사람은 이란 서부 자그로스 산지에서 소규모 족장 사회를 이루고 살던 이란계 집단으로, 아시리아 기록에는 기원전 9세기부터 ‘마다이’로 나온다. 사르곤 2세는 기원전 716년 이란 쪽에 하르하르와 키셰심 속주를 세워 메디아 족장들에게 공물을 거두었다. 에사르하돈 때 메디아 족장 라마타이아 등이 충성 서약을 맺었으나 족장 카슈타리투(헤로도토스의 프라오르테스로 보기도 한다)는 아시리아에 맞섰다. 헤로도토스는 데이오케스가 엑바타나를 세우고 프라오르테스를 거쳐 키악사레스가 군대를 고쳐 만들어 아시리아와 리디아에 맞섰다고 전하지만(1.95~107), 이 서술에는 후대의 윤색이 많아 학계는 통일 왕국이 언제 서는지를 두고 의견이 갈린다. 바빌로니아 연대기가 메디아의 모습을 분명하게 적는 것은 기원전 615년 키르쿠크 둘레의 아라파를 메디아군이 공격한 때부터다. 기원전 614년 메디아군은 아시리아의 옛 수도 아슈르를 함락해 약탈했고, 신바빌로니아를 세운 나보폴라사르는 그 자리에서 키악사레스와 동맹을 맺었다고 한다(「나보폴라사르와 신바빌로니아의 성립(기원전 626)·니네베의 함락(기원전 612)」, 뒤의 사건). 기원전 612년 니네베가 무너진 뒤 북부 이라크는 메디아가 얻었다고 본다. 메디아의 고고 유적은 하마단과 케르만샤 일대의 고딘 테페, 누시잔 테페, 바바잔 테페에서 나오며, 작은 요새 마을이 모인 모습이라 헤로도토스가 그린 큰 제국은 확인되지 않는다는 비판이 있다. 엑바타나가 메디아의 도읍이라는 서술은 나보니두스 연대기에서야 분명히 확인된다. 헤로도토스는 메디아 사람 가운데 사제 계층인 마고이가 있었다고 적지만(1.101) 이는 후대의 서술이고 메디아의 종교와 문자 생활은 거의 알려지지 않는다."
  subjects: [media-kingdom, neo-assyrian-empire, neo-babylonian-empire]
  tags: [politics, war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 1.95~107 (A. D. Godley 영역, Loeb, 1920~1925)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, Eisenbrauns, 2002)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: shabaka-shabataka-714bc
  year: -713
  endYear: -705
  title:
    ko: "샤바카·샤바타카와 이집트의 통일(기원전 714 무렵), 아시리아와의 첫 접촉과 아스돗의 이아마니(기원전 713~711, 인도는 707/706 무렵)"
  summary:
    ko: "피예가 죽은 뒤 쿠시의 왕위는 샤바카와 샤바타카가 이었다. 두 사람의 순서와 재위는 학설이 갈린다. 아래 탕이바르 비문 등에 힘입어 근래 널리 받아들여지는 새 설은 샤바타카(재위 기원전 714 무렵~705)가 먼저 다스리고 샤바카(705~690 무렵)가 이었다고 보며, 샤바카(721~707 무렵) 뒤에 샤바타카가 이었다는 옛 설도 있다. 누가 이집트를 하나로 묶었는지도 이 순서에 따라 갈린다. 후대 전승(마네토를 옮긴 글)은 보코리스(사이스 제24왕조의 바켄라네프)가 쿠시의 사바콘에게 산 채로 불태워졌다고 전하며, 이를 샤바카(또는 샤바타카)의 일로 본다. 어느 쪽이든 기원전 8세기 말 쿠시는 삼각주의 군주들을 누르고 이집트 전체를 쥐었다. 샤바카는 멤피스를 수도로 삼아 카르낙 신전을 고쳤고, 오래된 멤피스 신학의 글을 돌에 새긴 ‘샤바카 석비’(대영박물관)를 남겼다. 그 무렵 아시리아는 이미 서쪽에서 이집트의 가장자리에 닿아 있었다. 기원전 720년 사르곤 2세는 라피아에서 가자의 하누누와 이집트의 지원군을 꺾었다. 기원전 713~711년 아스돗의 이아마니(야마니)는 사르곤에 맞서 반란을 일으켰다가 패하자 이집트와 쿠시 쪽으로 달아났는데, 사르곤 2세의 탕이바르 비문(사르곤 15년, 기원전 707/706 무렵)은 이 도피자를 쿠시의 왕 샤바타카가 몇 해 뒤에 쇠사슬에 묶어 넘겼다고 적는다. 이사야서 20장은 아스돗이 점령되던 때 예언자가 이집트와 쿠시에 기대는 일의 부질없음을 말했다고 전한다. 쿠시의 왕들은 아시리아와의 충돌을 한동안 피했다. 그러나 기원전 701년의 엘테케 싸움부터 쿠시와 아시리아는 서로를 적으로 삼게 된다(뒤의 사건 「센나케리브의 유다 원정(기원전 701): 라키시의 포위와 예루살렘」). 쿠시 왕들의 정통성은 테베에서 ‘아몬의 신의 아내’직을 아메니르디스 1세와 샤펜웨펫 2세로 이어 가는 방식으로 이집트 신전 체계 안에 뿌리내렸다."
  subjects: [kushite-egypt, neo-assyrian-empire]
  tags: [politics, diplomacy]
  sources: ["Kenneth A. Kitchen, The Third Intermediate Period in Egypt (1100–650 B.C.) (2판, Aris & Phillips, 1986)", "Robert G. Morkot, The Black Pharaohs: Egypt's Nubian Rulers (Rubicon Press, 2000)", "Grant Frame, The Royal Inscriptions of Sargon II, King of Assyria (721–705 BC) (Pennsylvania State University Press, 2021)", "『구약 성경』 이사야 20장 (대한성서공회 개역개정)", "Nicolas Grimal, A History of Ancient Egypt (Ian Shaw 영역, Blackwell, 1992)"]

- id: cimmerians-scythians-714bc
  year: -713
  endYear: -648
  title:
    ko: "킴메르와 스키타이의 서아시아 침입(기원전 714~7세기 중엽): 아시리아 기록과 헤로도토스"
  summary:
    ko: "아시리아 기록의 ‘김미라이’, 곧 킴메르인은 기원전 8세기 말 카프카스 쪽에서 우라르투와 프리기아의 변경에 나타났다. 사르곤 궁정의 편지(왕자 센나케리브가 보낸 보고)는 기원전 714년 우라르투가 킴메르에게 패한 일을 전하며(「아시리아 곁의 두 왕국: 우라르투(기원전 9세기~590 무렵)와 프리기아의 미다스(기원전 8세기~695 무렵)」, 앞의 사건), 에사르하돈은 기원전 679년 킬리키아의 후부슈나에서 킴메르 왕 테우슈파를 꺾었다고 적는다. 에사르하돈의 신탁 문의 기록에는 이슈쿠자의 바르타투아에게 왕녀를 줄지 묻는 대목이 있어 아시리아와 스키타이가 한때 손잡았음을 보여 준다. 헤로도토스는 스키타이가 킴메르를 쫓아 서아시아로 들어와 28년 동안 아시아를 다스렸고 메디아의 키악사레스가 연회에서 그 지도자들을 죽여 끝냈다고 전한다(1.103~106). 또 그는 이집트의 프삼티크가 스키타이를 달래 이집트 침입을 막았다고도 적지만(1.105), 이 이야기를 뒷받침하는 아시리아·이집트 쪽 자료는 없고 고고학의 증거도 약하다. 아슈르바니팔의 기록은 리디아의 기게스가 아시리아와 손을 끊은 뒤 몰락했다고 적고, 그리스 전승은 킴메르의 공격으로 죽었다고 전한다. 죽은 해는 기원전 650년대 중반~644 무렵으로 갈린다(「리디아: 기게스에서 크로이소스까지(기원전 680 무렵~547), 최초의 동전과 사르디스의 함락」, 뒤의 사건). 이 이동하는 기마 집단은 한 나라를 세우지 못한 채 아시리아의 변경을 흔들었고, 흑해 북쪽 초원의 스키타이 왕국은 이들과 이어지는 집단이다(「스키타이 왕국(왕족 스키타이)의 흥망(기원전 650 무렵~280 무렵), 동물 양식과 초원길, 아테아스(기원전 339)」, 뒤의 사건). 킴메르의 이동 경로와 시기는 고고학으로 거의 확인되지 않아 연구자들 사이에 논쟁이 이어진다."
  subjects: [neo-assyrian-empire, urartu, phrygia, scythian-kingdom, saite-egypt]
  tags: [war, society]
  sources: ["Askold Ivantchik, Les Cimmériens au Proche-Orient (Orbis Biblicus et Orientalis 127, Universitätsverlag Freiburg·Vandenhoeck & Ruprecht, 1993)", "Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "Herodotus(헤로도토스), Historiai(『역사』) 1.103~106 (A. D. Godley 영역, Loeb, 1920~1925)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: sennacherib-babylon-703bc
  year: -702
  endYear: -680
  title:
    ko: "센나케리브의 바빌로니아 정책(기원전 703~689)과 바빌론의 파괴, 암살(기원전 681)"
  summary:
    ko: "센나케리브는 기원전 705년 아버지 사르곤이 전사한 뒤 왕위에 올랐다(재위 기원전 705~681). 바빌로니아에서는 마르두크아플라이딘나가 엘람의 도움으로 되돌아와 왕위를 다투었으나 기원전 703년 키시에서 아시리아군에 패했다. 센나케리브는 바빌로니아 출신 벨입니를 왕으로 세웠다가 기원전 700년 무렵 맏아들로 보이는 아슈르나딘슈미로 바꾸었다. 기원전 694년 그는 서쪽에서 불러온 조선공과 선원으로 만든 함대를 티그리스와 유프라테스를 따라 보내 페르시아만 쪽 엘람 해안에 칼데아 피난민을 쳤다. 이에 맞서 엘람이 바빌로니아에 쳐들어와 아슈르나딘슈미를 사로잡아 데려갔고(처형된 것으로 본다) 네르갈우셰지브가 왕이 되었다. 기원전 691년 무렵 아시리아는 엘람·바빌로니아 연합군과 할룰레에서 맞붙었는데 어느 쪽이 이겼는지는 기록마다 다르다. 바빌로니아에서 무셰지브마르두크가 일어나자 센나케리브는 오랜 포위 끝에 기원전 689년 바빌론을 함락해 도시를 크게 파괴하고 아라흐투 운하의 물길을 돌려 잠겼다고 자랑했다. 그는 마르두크 신상도 아시리아로 가져갔다. 이후 바빌로니아는 기원전 689~681년 왕이 없는 해가 이어졌다. 센나케리브는 니네베를 수도로 삼아 ‘견줄 데 없는 궁전’(남서궁)과 물길, 성벽을 지었다. 기원전 681년 그는 아들 아르다무리시와 나부샤루우쭈르에게 신전에서 살해되었고, 열왕기는 아들 둘이 달아났다고 전한다(열왕기 하 19장). 에사르하돈이 형들을 물리치고 왕위를 이었다. 니네베에는 수십 킬로미터 밖의 산에서 물을 끌어오는 운하와 예르완의 수로교도 지었다. 바빌론의 신상을 가져가고 도시를 물에 잠근 일은 바빌로니아 사람들에게 마르두크 신앙에 대한 모독으로 오래 기억되었다."
  subjects: [neo-assyrian-empire, elam-neo-elamite]
  tags: [politics, war]
  sources: ["A. Kirk Grayson·Jamie Novotny, The Royal Inscriptions of Sennacherib, King of Assyria (704–681 BC), Part 1 (Eisenbrauns, 2012)", "Josette Elayi, Sennacherib, King of Assyria (SBL Press, 2017)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Grant Frame, Babylonia 689–627 B.C.: A Political History (Nederlands Instituut voor het Nabije Oosten, 1992)", "Matthew W. Waters, A Survey of Neo-Elamite History (State Archives of Assyria Studies 12, Neo-Assyrian Text Corpus Project, 2000)"]

- id: hezekiah-sennacherib-701bc
  year: -700
  title:
    ko: "센나케리브의 유다 원정(기원전 701): 라키시의 포위와 예루살렘"
  summary:
    ko: "유다의 히스기야(재위는 기원전 715~686 무렵이라는 설과 726~697 무렵이라는 설이 있다)는 센나케리브가 즉위하자 사르곤 시대부터 이어진 반아시리아 움직임에 가담했다. 그는 에그론 사람들이 넘긴 파디를 예루살렘에 가두고 성벽을 고쳤다. 열왕기는 히스기야가 물길을 끌어들였다고 전하며(열왕기 하 20장), 기혼 샘에서 실로암 못으로 이어진 터널 안벽의 실로암 비문(1880년 발견, 이스탄불 고고학 박물관)은 두 방향에서 판 굴착조가 만난 일을 왕의 이름 없이 적는다(터널의 연대는 논쟁이 있다). 기원전 701년 센나케리브는 페니키아 해안과 필리스티아를 평정하고 엘테케에서 이집트와 쿠시의 연합군을 물리친 뒤 유다로 내려왔다. 열왕기는 당시 쿠시의 왕 디르하가(타하르카)가 나섰다고 전하나 타하르카는 이때 아직 왕이 아니었을 것이다. 아시리아군은 유다 제2의 도시 라키시를 에워싸 흙 경사로를 쌓고 공성 기구로 함락했는데, 라키시 유적에서 이 경사로와 반격 경사로가 발굴되었고 니네베 궁전의 라키시 부조(대영박물관)가 포위의 장면을 새겼다. 센나케리브의 기록(테일러 각주)은 유다의 성곽 도시 46곳을 얻고 200,150명을 옮겼으며 히스기야를 예루살렘에 ‘새장의 새처럼’ 가두었다고 적고, 공물로 금 30달란트와 은 800달란트를 받았다고 한다(열왕기 하 18장은 은 300달란트로 적는다). 아시리아 기록은 예루살렘을 함락했다고 주장하지 않는다. 열왕기는 야훼의 천사(개역개정은 ‘여호와의 사자’)가 아시리아 진영에서 18만 5천 명을 쳐서 센나케리브가 니네베로 돌아갔다고 전하며(열왕기 하 19장), 헤로도토스는 이집트 접경 펠루시움에서 들쥐가 아시리아군의 활줄을 갉았다고 적는다(2.141). 두 이야기는 질병이나 다른 사정을 비유했다고 보기도 하나 확인할 수 없다. 히스기야는 왕위를 지켰고 유다는 영토 일부를 필리스티아 도시들에 넘겼다."
  subjects: [judah-kingdom, neo-assyrian-empire, kushite-egypt]
  links:
    - { from: neo-assyrian-empire, to: judah-kingdom, note: "라키시 함락과 예루살렘 포위 (기원전 701)" }
  tags: [war, politics, religion]
  sources: ["A. Kirk Grayson·Jamie Novotny, The Royal Inscriptions of Sennacherib, King of Assyria (704–681 BC), Part 1 (Eisenbrauns, 2012)", "Lester L. Grabbe 엮음, ‘Like a Bird in a Cage’: The Invasion of Sennacherib in 701 BCE (Sheffield Academic Press, 2003)", "『구약 성경』 열왕기 하 18~19장, 이사야 36~37장 (대한성서공회 개역개정)", "Herodotus(헤로도토스), Historiai(『역사』) 2.141 (A. D. Godley 영역, Loeb, 1920~1925)", "Ephraim Stern, Archaeology of the Land of the Bible, Volume II: The Assyrian, Babylonian, and Persian Periods (732–332 B.C.E.) (Doubleday, 2001)"]
