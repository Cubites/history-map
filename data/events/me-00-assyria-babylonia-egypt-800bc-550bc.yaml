# 서아시아·북아프리카 사건 me-00: 신아시리아와 바빌로니아·이집트 쿠시 왕조·유다와 이스라엘·메디아와 엘람 (기원전 800 ~ 기원전 550)
# 범위: 아다드니라리 3세의 서방 원정과 아람 다마스쿠스·이스라엘의 회복, 리비아계 왕조의 분열과 쿠시의 상이집트 진출, 페니키아 도시와 아시리아, 티글라트필레세르 3세의 개혁과 속주·강제 이주,
#   시리아·에브라임 전쟁과 사마리아의 함락, 하맛·아르파드의 끝, 마르두크아플라이딘나 2세의 바빌론과 사르곤 2세, 센나케리브의 유다 원정(라키시)과 바빌론 파괴, 에사르하돈과 아시리아의 이집트 정복,
#   피예·샤바카·타하르카의 쿠시 왕조와 그 끝, 아슈르바니팔의 도서관과 샤마시슘우킨의 전쟁, 엘람의 쇠퇴, 메디아의 흥기와 아시리아의 마지막 왕들, 므낫세·요시야의 유다와 마지막 왕들,
#   필리스티아·트란스요르단·아라비아 북부, 아람어의 확산과 8세기 예언자들, 바빌로니아의 천문 기록, 프삼티크 2세의 누비아 원정과 티레 포위, 카르타고의 아프리카 쪽 바탕, 안샨의 키루스와 메디아의 끝.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 아라비아 북부와 사하라 쪽 일은 개관 분량이다. 기원전 800~551년 지도에서 생기거나 끝난 서아시아·북아프리카 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이었다.
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 722년 = −721)로 넣고 본문에는 '기원전 722년'처럼 적었다. 신아시리아 왕의 재위는 림무(해 이름) 목록과 아시리아 왕 목록이 굳은 연대를 따르되(기원전 763년 일식 기준),
#   즉위한 해와 재위 첫 해를 구분했고 학설이 갈리는 연대(이집트 제25왕조의 왕 순서와 재위, 유다·이스라엘 왕의 재위, 아슈르바니팔의 죽음)는 '무렵'이나 두 설을 함께 적었다.
# 날짜: 율리우스력 날짜는 달까지만 적거나 통설을 따랐다. 바빌로니아·히브리 달력은 필요한 곳에서만 적었다.
# 이름 규칙: 아시리아·바빌로니아 왕은 굳은 교과서 꼴(티글라트필레세르·샬마네세르·사르곤·센나케리브·에사르하돈·아슈르바니팔·나보폴라사르), 이집트 왕은 저장소 기존 꼴(피예·샤바카·타하르카·타누타문·프삼티크·네코),
#   이스라엘·유다 왕은 개역 성경 표기(여로보암·히스기야·므낫세·요시야·여호야김·시드기야)를 따르고, 지명은 라키시·사마리아·니네베·님루드·두르샤루킨·하란·카르케미시 등 굳은 꼴을 썼다.
# 다른 파일 사건과의 관계: 프삼티크 1세·키레네의 건설·나보폴라사르와 니네베의 함락·바빌론 유수·아마시스·나보니두스는 같은 시기 다른 파일의 사건을 「제목」으로 가리키고 이 지역 쪽 일만 새로 썼다.
#   페니키아인과 카르타고의 건국 전승·우라르투와 프리기아·스키타이 왕국·리디아·그리스 알파벳·키루스의 제국 성립은 유럽 쪽 사건을 가리키고 중복을 피했다.
# 한국사와 닿는 점: 이 시대 서아시아·북아프리카 사건과 한국사 항목이 직접 닿는 곳은 없다. 같은 시기 중국의 춘추 시대 개막은 「제목」으로 한 번 견주었다.
# 서술은 새로 작성. 출처는 당대 기록(아시리아 왕 비문·연대기·바빌로니아 연대기·피예 승전비 등)과 후대 서술(성서의 신학적 서술·헤로도토스·요세푸스)을 구분해 밝혔고, 성서 서술은 '열왕기는 ~라고 전한다'처럼 출처를 적었다.
#   병력·사상자·강제 이주민 수는 왕 비문이 부풀리는 일이 많아 범위와 '추산'·출처로 적었다. 운영자 검수 필요.

- id: adad-nirari-iii-800bc
  year: -799
  endYear: -789
  title:
    ko: "아다드니라리 3세의 서방 원정(기원전 805~796)과 다마스쿠스의 약화, 이스라엘의 회복(기원전 800 무렵~790)"
  summary:
    ko: "아시리아의 아다드니라리 3세(재위 기원전 811~783, 짧은 림무 목록으로는 810년 즉위)는 앞선 왕들이 이룬 서쪽 땅의 지배를 다시 세우려 했다. 어린 왕 곁에서 어머니 삼무라마트(그리스 전승의 세미라미스)가 몇 해 힘을 쥐었으나 정식 섭정이었다고 보는 견해는 지금은 지지를 잃었다. 왕의 비문과 연대기를 따르면 그는 기원전 805년 무렵부터 서쪽으로 거듭 원정했고 기원전 796년 무렵 다마스쿠스의 왕 ‘마리’를 에워싸 막대한 은·동·철과 비단 옷을 공물로 받았다고 적는다. 마리는 하자엘의 아들 벤하닷 3세로 보는 견해가 많다. 텔 알리마 석비에는 공물을 바친 나라로 사마리아의 요아스와 티레·시돈이 올라 있다. 파자르즉 석비(기원전 805년)는 쿰무흐 왕의 청을 받은 아다드니라리 3세가 아르파드 왕 아타르슘키가 이끈 여덟 왕의 연합을 파카라후부나에서 꺾고 쿰무흐와 구르굼의 경계를 정했다고 적는다. 하맛의 왕 자쿠르가 새긴 아람어 자쿠르 비문(기원전 8세기 초, 800~785년 무렵)은 다마스쿠스의 벤하닷이 열일곱 왕을 모아 하드라크에 있던 자쿠르를 에워쌌으나 신 바알샤마인의 도움으로 버텼다고 적어, 아시리아가 힘을 쓰기 전 시리아 정치의 한복판이 다마스쿠스였음을 보여 준다. 아시리아의 압박으로 다마스쿠스가 약해지자 이스라엘 왕 요아스는 열왕기가 전하듯 하자엘의 아들 벤하닷에게 잃은 성읍을 되찾았다(열왕기 하 13장). 남쪽의 유다는 아마샤의 시대였고, 열왕기 하 14장은 아마샤가 요아스와 맞붙었다가 벧세메스에서 져서 예루살렘 성벽 일부가 헐렸다고 전한다(기원전 790 무렵). 아다드니라리 뒤 아시리아는 기원전 745년까지 서쪽에 거의 손을 뻗지 못해 시리아의 작은 나라들이 한동안 숨을 돌렸다. 이에 앞서 다마스쿠스는 하자엘(재위 기원전 842 무렵~800 무렵) 때 이스라엘과 유다를 눌렀고, 텔 단 비문(기원전 9세기 후반)은 아람 왕이 이스라엘 왕과 ‘다윗 집안’의 왕을 이겼다고 자랑한 것으로 읽힌다. 아다드니라리의 원정은 서쪽 나라들이 공물을 바치게 하는 속국 체계의 틀을 놓았지만 아시리아가 이 땅을 직접 다스린 것은 아니었다."
  subjects: [neo-assyrian-empire, aram-damascus, israel-kingdom, judah-kingdom, hamath-kingdom, arpad-kingdom]
  tags: [politics, war]
  sources: ["A. Kirk Grayson, Assyrian Rulers of the Early First Millennium BC, II (858–745 BC) (University of Toronto Press, 1996)", "Alan R. Millard, The Eponyms of the Assyrian Empire, 910–612 BC (State Archives of Assyria Studies 2, Neo-Assyrian Text Corpus Project, 1994)", "『구약 성경』 열왕기 하 13~14장 (대한성서공회 개역개정)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "John Boardman 외 엮음, The Cambridge Ancient History III.1: The Prehistory of the Balkans; and the Middle East and the Aegean World, Tenth to Eighth Centuries B.C. (2판, Cambridge University Press, 1982)"]

- id: magnate-age-babylonia-800bc
  year: -799
  endYear: -744
  title:
    ko: "아시리아 ‘귀족의 시대’(기원전 800 무렵~745)와 바빌로니아 왕국, 기원전 763년의 일식"
  summary:
    ko: "아다드니라리 3세 때(기원전 796 무렵)부터 대신들이 힘을 키우기 시작했고, 그가 죽은 기원전 783년부터 티글라트필레세르 3세가 즉위한 기원전 745년까지 아시리아는 샬마네세르 4세(재위 기원전 783~773), 아슈르단 3세(773~755), 아슈르니라리 5세(755~745)가 차례로 왕위에 올랐으나 영토는 거의 늘지 않았다. 이 시기를 ‘귀족의 시대’라 부르는 것은 투르타누(최고 사령관) 샴시일루 같은 대신들이 큰 속주를 쥐고 왕을 제치며 자기 이름으로 비문을 새겼기 때문이다. 아시리아의 림무 목록에는 기원전 763년 시반 달에 일식이 있었다고 적혀 있고, 천문학으로 이 일식의 날짜가 정해져 있어서 신아시리아 연대 전체를 해마다 맞추는 닻이 된다. 같은 시기 남쪽 바빌로니아는 아시리아의 바로 아래에서 독립한 왕국이었으나 힘이 약했다. 바빌로니아 왕 목록은 ‘E 왕조’ 시대의 짧은 재위와 왕 없는 해를 기록하고, 도시들은 신전 사제단과 칼데아·아람 부족의 틈에서 움직였다. 칼데아 부족은 남쪽 늪과 해안의 비트야킨을 중심으로 힘을 키워 갔고 아람 부족은 중부 유프라테스에 자리를 잡았다. 북쪽에서는 우라르투가 사르두리 2세 때 가장 강해져 아시리아의 서쪽 길까지 위협했다(「아시리아 곁의 두 왕국: 우라르투(기원전 9세기~590 무렵)와 프리기아의 미다스(기원전 8세기~695 무렵)」, 같은 시기의 사건). 귀족의 시대는 기원전 746년 칼후(님루드)에서 일어난 반란으로 끝났고, 왕위에 오른 티글라트필레세르 3세가 대신들의 권한부터 거두어들였다. 바빌로니아의 왕은 에리바마르두크(기원전 769 무렵~760)와 나부슈마이슈쿤(760 무렵~748)을 거쳐 기원전 747년 나부나시르가 올랐다(「나보나사르의 바빌로니아(기원전 747)와 바빌로니아 천문 기록: ‘나보나사르 기원’과 천문 일지(기원전 652~)」, 뒤의 사건)."
  subjects: [neo-assyrian-empire, babylonia-kingdom, urartu]
  tags: [politics, society]
  sources: ["A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Alan R. Millard, The Eponyms of the Assyrian Empire, 910–612 BC (State Archives of Assyria Studies 2, Neo-Assyrian Text Corpus Project, 1994)", "J. A. Brinkman, A Political History of Post-Kassite Babylonia, 1158–722 B.C. (Pontificium Institutum Biblicum, 1968)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "John Boardman 외 엮음, The Cambridge Ancient History III.1: The Prehistory of the Balkans; and the Middle East and the Aegean World, Tenth to Eighth Centuries B.C. (2판, Cambridge University Press, 1982)"]

- id: libyan-kashta-egypt-800bc
  year: -799
  endYear: -729
  title:
    ko: "이집트 제3중간기의 분열: 리비아계 왕조들(기원전 800 무렵~)과 카슈타의 상이집트 진출(기원전 750 무렵)"
  summary:
    ko: "기원전 800년 무렵 이집트는 하나의 왕 아래 있지 않았다. 삼각주의 타니스에는 리비아 출신 군인 가문의 제22왕조(재위 기원전 945~720 무렵)가 있었고, 렌토폴리스(이우풋 2세) 같은 곳에서는 제23왕조로 부르는 다른 왕들이 따로 왕을 칭했으며, 사이스에서는 기원전 730년대 무렵 테프나크트가 제24왕조를 열었다. 사제단은 테베에서 아몬의 ‘신의 아내’를 앞세워 자기 영역을 지켰고, 리비아계 장군들은 헤르모폴리스·헤라클레오폴리스·멤피스를 나눠 쥐었다. 아몬 대사제직을 둘러싼 왕가 안의 내전(타켈롯 2세 때)은 테베를 약하게 만들었다. 남쪽 나일 상류의 쿠시에서는 이집트 문화를 받아들인 왕들이 나파타(게벨 바르칼)를 중심으로 힘을 키웠다. 카슈타는 엘레판티네에 석비를 세우고 딸 아메니르디스 1세를 테베의 ‘아몬의 신의 아내’ 후계자로 삼게 했다고 전해 상이집트를 평화롭게 손에 넣는 길을 열었다. 이 무렵을 제25왕조(쿠시 왕조)의 시작으로 보며 시작 해는 기원전 747~744년 무렵으로 보는 것이 보통이고 카슈타부터 세는 설은 750년대로 올려 잡는다. 카슈타의 아들 피예 때 쿠시는 하이집트의 군주들을 눌러 이집트의 상위 왕이 된다(뒤의 사건 「피예의 이집트 원정(기원전 728~725 무렵)과 승전비」). 이 분열은 아시리아가 이집트와 처음 부딪친 기원전 8세기 말 이집트의 약점이기도 했다. 삼각주 주민은 ‘마샤와샤의 대족장’ 같은 칭호를 쓴 리비아계 족장들의 지배를 받았고, 이들은 이집트식 이름과 이집트 신들을 받아들이면서도 깃털 장식 같은 리비아 풍습을 유지했다. 샤샹크 1세 이래 제22왕조 왕들은 아들을 아몬 대사제와 중요한 도시의 장관에 앉혀 가문의 힘으로 나라를 묶으려 했으나, 이 방식이 오히려 왕가의 갈래를 늘려 분열을 부추겼다."
  subjects: [kushite-egypt]
  tags: [politics]
  sources: ["Kenneth A. Kitchen, The Third Intermediate Period in Egypt (1100–650 B.C.) (2판, Aris & Phillips, 1986)", "Robert G. Morkot, The Black Pharaohs: Egypt's Nubian Rulers (Rubicon Press, 2000)", "László Török, The Kingdom of Kush: Handbook of the Napatan–Meroitic Civilization (Brill, 1997)", "Nicolas Grimal, A History of Ancient Egypt (Ian Shaw 영역, Blackwell, 1992)"]

- id: phoenician-cities-assyria-800bc
  year: -799
  endYear: -675
  title:
    ko: "페니키아 도시들과 아시리아(기원전 8~7세기): 티레·시돈·비블로스의 공물과 시돈의 파괴(기원전 677)"
  summary:
    ko: "레바논 해안의 티레·시돈·비블로스·아르바드는 한 나라가 아니라 도시마다 왕이 있는 도시국가였고, 지중해 무역과 자주색 염료, 삼나무로 부를 쌓았다. 이 도시들이 카르타고 같은 서쪽 거점을 세운 일은 유럽 쪽 사건에서 따로 다룬다(「페니키아인과 카르타고의 서지중해: 건국 전승(기원전 814), 에부수스(기원전 654 무렵), 알랄리아 무렵까지」, 앞의 사건). 키프로스의 키티온에는 티레가 세운 거점이 있었고, 기원전 709년 사르곤 2세의 키프로스 원정을 기념하는 석비가 그곳에서 나왔다. 아시리아는 서쪽 항구의 목재와 상품, 함대가 필요해 이 도시들을 속국으로 삼았다. 기원전 738년 티글라트필레세르 3세의 공물 명단에는 티레의 히람과 비블로스의 왕이 올랐고, 기원전 701년 센나케리브의 원정 때는 시돈·티레의 왕 룰리가 키프로스로 달아났다고 아시리아 기록은 적는다. 시돈은 기원전 677년 에사르하돈에게 함락되어 파괴되었다. 왕 압디밀쿠티는 바다로 달아났다가 사로잡혀 처형되었고, 에사르하돈은 그 자리에 카르에사르하돈이라는 새 도시를 세우고 속주로 삼았다. 티레의 왕 바알 1세는 에사르하돈과 조약을 맺고 해안과 섬의 도시를 지켰다. 페니키아의 22자 자음 문자는 이 도시들에서 아람어와 히브리어, 그리스 도시들이 받아들인 알파벳의 바탕이 되었다(「폴리스의 성립과 첫 올림피아 제전(전승 기원전 776), 호메로스와 그리스 알파벳(기원전 8세기)」, 같은 시기의 사건). 센나케리브는 룰리가 달아난 뒤 시돈에 새 왕을 세웠고, 티레는 기원전 7세기 전반에도 해상 무역의 중심으로 살아남았다. 레바논의 삼나무와 페니키아 조선공은 아시리아에도 쓸모가 있었고, 센나케리브가 기원전 694년 엘람 원정에 쓴 함대도 서쪽에서 불러온 조선공이 만들었다고 한다."
  subjects: [neo-assyrian-empire, carthage, greek-city-states]
  tags: [politics, economy, culture]
  sources: ["Josette Elayi, History of Phoenicia (Lockwood Press, 2018)", "H. Jacob Katzenstein, The History of Tyre: From the Beginning of the Second Millennium B.C.E. until the Fall of the Neo-Babylonian Empire in 539 B.C.E. (Schocken Institute for Jewish Research, 1973)", "Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "Maria Eugenia Aubet, The Phoenicians and the West (2판, Cambridge University Press, 2001)"]

- id: jeroboam-ii-790bc
  year: -789
  endYear: -739
  title:
    ko: "여로보암 2세와 우시야의 시대(기원전 790 무렵~740): 이스라엘의 번영과 사마리아 오스트라카"
  summary:
    ko: "북왕국 이스라엘의 여로보암 2세(재위는 기원전 793~753으로 보는 설과 786~746으로 보는 설이 있다)는 아시리아가 서쪽에서 물러난 틈에 영토를 넓혔다. 열왕기는 그가 하맛 어귀에서 아라바 바다까지 국경을 되찾았다고 전한다(열왕기 하 14장). 1910년 사마리아 궁정터에서 나온 오스트라카(질그릇 조각 글)는 술과 기름의 납품 기록으로, 왕의 재위 연수 9·10·15·17년이 적혀 있다. 어느 왕인지는 적혀 있지 않으나 여로보암 2세 때로 보는 견해가 유력하며, 왕실 경제가 이 도시에 집중되었음을 보여 준다. 남쪽 유다에서는 우시야(아사랴, 재위 기원전 791 무렵~740 무렵)가 오래 다스려 군사와 농업을 키웠다고 열왕기와 역대기는 전한다. 이 번영 속에서 예언자 아모스는 유다 남쪽 드고아 출신으로 북쪽 베델에 가서 부유한 사람들의 불의와 가난한 사람의 처지를 비판했고, 호세아는 북왕국 안에서 우상 숭배와 외세 의존을 꾸짖었다(「8세기 예언자들(아모스·호세아·이사야·미가): 아시리아의 부상과 사회 비판(기원전 760 무렵~700 무렵)」, 뒤의 사건). 여로보암이 죽은 뒤 이스라엘은 크게 흔들렸다. 열왕기에 따르면 그의 아들 스가랴가 여섯 달 만에 살룸에게 죽어 예후 왕조가 끝났고, 이어 므나헴, 브가히야, 베가가 차례로 왕위를 쥐는 동안 왕위 다툼과 쿠데타가 이어졌다. 이 혼란은 기원전 745년 티글라트필레세르 3세가 즉위하며 서쪽으로 다시 돌아온 아시리아에 맞설 힘을 잃은 나라를 만들었다. 사마리아 궁정터에서 나온 상아 조각은 연대가 아합 시대와 8세기 사이에서 갈리는데, 8세기로 본다면 번영과 함께 빈부 격차가 커진 사회를 보여 준다고 읽을 수 있다. 아모스 7장은 베델의 제사장 아마샤가 여로보암에게 아모스를 고발하고 그를 쫓아냈다고 전한다."
  subjects: [israel-kingdom, judah-kingdom, neo-assyrian-empire]
  tags: [politics, society, religion]
  sources: ["『구약 성경』 열왕기 하 14~15장, 아모스, 호세아 (대한성서공회 개역개정)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "Israel Finkelstein·Neil Asher Silberman, The Bible Unearthed: Archaeology's New Vision of Ancient Israel and the Origin of Its Sacred Texts (Free Press, 2001)", "John Boardman 외 엮음, The Cambridge Ancient History III.1: The Prehistory of the Balkans; and the Middle East and the Aegean World, Tenth to Eighth Centuries B.C. (2판, Cambridge University Press, 1982)"]

- id: prophets-eighth-century-760bc
  year: -759
  endYear: -699
  title:
    ko: "8세기 예언자들(아모스·호세아·이사야·미가): 아시리아의 부상과 사회 비판(기원전 760 무렵~700 무렵)"
  summary:
    ko: "기원전 8세기 이스라엘과 유다에서는 왕과 지배층의 불의를 꾸짖고 아시리아의 침략을 신(야훼)의 심판으로 읽은 예언자들이 나타났다. 책의 첫머리에 적힌 시대로 보면 아모스는 여로보암 2세와 우시야의 시대에, 호세아는 여로보암 2세부터 북왕국의 마지막 무렵까지, 이사야는 우시야부터 히스기야 때까지, 미가는 요담에서 히스기야 때까지 활동했다. 아모스는 유다의 목자 출신으로 북왕국의 성소 베델에서 성전 제사보다 정의를 요구했고, 호세아는 이스라엘이 다른 신을 따르고 이집트와 아시리아 사이에서 줄을 타는 일을 비판했다. 이사야는 예루살렘의 선지자로 시리아·에브라임 전쟁 때 아하스에게 두려워하지 말고 믿음으로 서라고 했다고 이사야서 7장은 전하며(열왕기 하 16장은 아하스가 아시리아에 도움을 청했다고 적는다), 센나케리브가 쳐들어왔을 때 히스기야에게 예루살렘이 버티리라고 말했다고 열왕기는 전한다(열왕기 하 19장). 미가는 유다 시골의 가난한 이의 처지를 대변했다. 이 책들은 오랜 세월 편집되었다고 본다. 이사야서의 40장 이하는 바빌론 유수기의 작품으로 보는 견해가 널리 받아들여지며, 어느 예언의 말이 정확히 누구의 것이고 언제 쓰였는지는 연구자들 사이에 논쟁이 계속된다. 역사가는 예언자의 말을 당시 사회를 보여 주는 자료로 읽을 뿐 미래를 맞혔는지는 사실로 다루지 않는다. 중국에서는 같은 무렵 동주의 천자가 약해지고 제후들이 힘을 키웠다(「춘추 시대의 개막: 천자의 쇠퇴와 제후국들」, 앞의 사건). 예언서는 땅을 쥔 지주와 빚에 몰린 소농으로 갈라진 사회, 예루살렘과 지방의 관계, 아시리아에 대한 정치적 입장을 보여 주는 자료로도 읽힌다. 이 책들을 신앙의 경전으로 받아들이는 입장과 역사학이 자료로 읽는 입장은 구분된다."
  subjects: [israel-kingdom, judah-kingdom, neo-assyrian-empire]
  tags: [religion, culture, society]
  sources: ["『구약 성경』 아모스, 호세아, 이사야 1~39장, 미가, 열왕기 하 15~19장 (대한성서공회 개역개정)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "John Barton·John Muddiman 엮음, The Oxford Bible Commentary (Oxford University Press, 2001)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: neo-elamite-760bc
  year: -759
  endYear: -716
  title:
    ko: "신엘람 왕국의 등장(기원전 760 무렵): 훔반타흐라에서 훔반니카시 1세까지"
  summary:
    ko: "엘람은 수사와 안샨을 두 중심으로 이란 남서부의 후제스탄 평야와 고지를 아우른 오래된 나라로, 기원전 12세기 뒤 쇠퇴했다가 기원전 8세기 중엽부터 바빌로니아의 기록에 다시 나타난다. 신엘람기는 보통 기원전 1100년 무렵부터 770년 무렵까지를 1기, 그 뒤 646년까지를 2기, 646~539년을 3기로 나눈다. 바빌로니아 문서가 이름을 주는 첫 신엘람 왕은 훔반타흐라(기원전 760 무렵~743)이며, 그 뒤를 훔반니카시 1세(기원전 743~717)가 이었다. 훔반니카시는 기원전 720년 데르 근처에서 아시리아 왕 사르곤 2세와 싸워 바빌로니아의 마르두크아플라이딘나 2세를 도왔다(「마르두크아플라이딘나 2세의 바빌론(기원전 721~710)과 사르곤 2세의 재정복」, 뒤의 사건). 아시리아 기록은 엘람 왕들이 바빌로니아의 반란자들과 늘 손을 잡았다고 적는다. 엘람의 중심은 평야의 수사와 산악의 안샨이었는데, 안샨은 훗날 페르시아 왕가가 나온 땅이다. 아시리아 왕들은 엘람의 땅을 번번이 약탈했지만 한 번에 병합하지는 못해 엘람은 한 세기 가까이 아시리아의 가장 끈질긴 동쪽 이웃이었다. 엘람 왕들은 자신을 ‘수사와 안샨의 왕’이라 불렀고 엘람어로 석비와 벽돌에 글을 새겼다. 엘람이 아시리아에 입은 큰 타격은 아슈르바니팔 때에 있었다(뒤의 사건 「엘람의 쇠퇴: 울라이 전투(기원전 653)와 수사의 약탈(기원전 647~646)」). 엘람의 왕위는 오래된 관행에 따라 형제와 조카 사이에서도 이어져 후계를 둘러싼 다툼이 잦았고, 이는 아시리아의 개입을 불렀다. 엘람 사람들은 수사와 안샨에서 아카드어와 엘람어를 함께 썼고, 아시리아와 바빌로니아의 문서에는 엘람 왕과 왕자의 이름이 자주 올라 이 나라의 정치적 비중을 보여 준다."
  subjects: [elam-neo-elamite, neo-assyrian-empire, babylonia-kingdom]
  tags: [politics, war]
  sources: ["Matthew W. Waters, A Survey of Neo-Elamite History (State Archives of Assyria Studies 12, Neo-Assyrian Text Corpus Project, 2000)", "Elizabeth Carter·Matthew W. Stolper, Elam: Surveys of Political History and Archaeology (University of California Press, 1984)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: aramaic-spread-750bc
  year: -749
  endYear: -610
  title:
    ko: "아람어와 아람 문자의 확산(기원전 8~7세기): 아람 도시국가에서 아시리아 제국의 공용어로"
  summary:
    ko: "아람인은 기원전 11세기 무렵부터 시리아와 상부 메소포타미아에 도시국가를 세운 유목·반유목 집단으로, 다마스쿠스·하맛·아르파드·구자나 같은 나라가 있었다. 이들은 페니키아 문자를 바탕으로 한 22자의 자음 문자로 아람어를 적었다. 아람어 비문 가운데 기원전 9세기 중엽에 아시리아어와 아람어를 함께 새긴 텔 페헤리예 조각상이 앞선 자료이고, 하맛의 자쿠르 비문(기원전 8세기 초)과 아르파드와 맺은 세피레 조약 비문(기원전 8세기 중엽)이 뒤를 잇는다. 아시리아는 아람 도시국가를 하나씩 속주로 삼고 아람 사람을 아시리아 본토와 바빌로니아에 옮겼다(「아시리아의 통치 제도: 속주와 속국, 총독과 역참, 강제 이주(기원전 745~612)」, 뒤의 사건). 쐐기문자는 점토판에 새겨야 했지만 아람 문자는 파피루스와 가죽에 잉크로 쓸 수 있어 빠르고 값쌌기 때문에, 아시리아 궁전 부조에도 두 서기가 나란히 일하는 모습이 보인다. 한 서기는 점토판에 쐐기문자를, 다른 서기는 두루마리에 아람 문자를 쓴다. 열왕기에 따르면 유다 왕 히스기야의 관리들은 아시리아 사령관 랍사게에게 아람어로 말해 달라고 청했는데 백성이 알아듣지 못하게 하려는 뜻이었다(열왕기 하 18장). 이는 아람어가 이미 외교의 언어였음을 보여 준다. 제국의 행정에서 쓰인 아람어는 훗날 아케메네스의 공용어(제국 아람어)로 이어져 서아시아의 공통 문자가 되었다. 아람 문자는 뒤에 히브리어 사각 문자와 시리아 문자, 나바테아를 거친 아랍 문자의 바탕이 되었다. 아시리아 점토판 문서의 일부에는 아람어 주석이 덧붙은 것이 있다. 아람어는 제국이 무너진 뒤에도 신바빌로니아에서 쓰였고, 구약 성경의 에스라서와 다니엘서 일부도 아람어로 적혔다."
