  tags: [politics, war]
  sources: ["Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Alan R. Millard, The Eponyms of the Assyrian Empire, 910–612 BC (State Archives of Assyria Studies 2, Neo-Assyrian Text Corpus Project, 1994)", "Simo Parpola·Kazuko Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (Helsinki University Press, 1988)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: assyrian-provinces-deportation-745bc
  year: -744
  endYear: -611
  title:
    ko: "아시리아의 통치 제도: 속주와 속국, 총독과 역참, 강제 이주(기원전 745~612)"
  summary:
    ko: "신아시리아는 정복지를 두 가지로 다스렸다. 가까운 곳은 속주로 만들어 왕이 보낸 총독(샤크누)이 세금과 노역, 군대의 징발을 맡았고, 먼 곳은 현지의 왕을 남겨 두고 해마다 공물을 받으면서 왕에게 충성을 서약하게 했다(속국). 반란이 일어나면 속국을 속주로 바꾸는 것이 통례였다. 왕과 총독, 지방 관리는 편지로 연락했고 역참과 큰길이 이를 도왔다. 칼후와 니네베에서 나온 서판은 총독의 보고와 점성가의 조언, 첩자와 사절의 소식을 전한다. 가장 두드러진 제도는 강제 이주다. 반란을 일으킨 땅의 사람들을 먼 곳으로 옮겨 고향에서 떼어 놓고, 그들을 농사와 건설, 군대로 쓰며 빈 땅에는 다른 곳에서 데려온 사람을 채웠다. 부스타나이 오데드는 아시리아 기록에서 모은 사례를 바탕으로 신아시리아기의 이주민을 합쳐 약 440만 명(±90만)으로 추산하지만 이 합계는 숫자가 없는 기록을 외삽한 값이고 왕 비문의 수가 부풀려졌을 수도 있다. 사르곤 2세는 이스라엘 왕국의 수도 사마리아에서 27,280명을 옮겼다고 적었다. 오데드는 이주민이 대체로 가족 단위로 옮겨져 먹을 것과 땅을 받아 정착했고 아시리아 본토에 있는 이가 많았다고 본다. 그러나 기술 없는 이주민은 건설 공사에 부려졌고, 궁전 부조에는 족쇄를 차거나 갈고리를 얼굴에 꿴 채 끌려가는 이주민의 모습이 새겨졌다. 이주민 자신이 남긴 기록은 거의 없어 처우는 아시리아 쪽 기록과 히브리 성서로만 전해진다. 이 방식은 제국 안의 언어와 문화를 섞었고, 아람어가 제국 곳곳에서 쓰이게 된 배경이기도 하다. 한편 아시리아의 군대는 철제 무기와 공성 무기, 기병과 전차를 갖추어 성을 부수고 반란을 막아 냈으며, 왕은 정복당한 이들을 처형·가죽 벗김 같은 공포로 위협했다는 것을 비문과 궁전 부조가 자랑한다. 왕에게 충성하는 지방 엘리트에게는 땅과 관직을 주어 제국 안에 이해관계를 만들었다. 총독들도 해마다 이름을 붙이는 림무 관직에 오를 수 있어 속주 관리가 궁정 서열 안에 들어갔고, 사르곤의 두르샤루킨과 센나케리브의 니네베 같은 수도 건설에는 이주민 노동력이 쓰였다."
  subjects: [neo-assyrian-empire, israel-kingdom]
  tags: [politics, society]
  sources: ["Bustenay Oded, Mass Deportations and Deportees in the Neo-Assyrian Empire (Reichert, 1979)", "Mario Liverani, Assyria: The Imperial Mission (Allison Brown 영역, Eisenbrauns, 2017)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "Simo Parpola·Kazuko Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (Helsinki University Press, 1988)", "Amélie Kuhrt, The Ancient Near East c. 3000–330 BC (Routledge, 1995)"]

- id: kedar-arab-queens-738bc
  year: -737
  endYear: -643
  title:
    ko: "아라비아 북부의 케다르와 ‘아랍 여왕’들(기원전 738~7세기 중엽): 아시리아의 낙타 유목민 관계"
  summary:
    ko: "시리아 사막과 북아라비아의 오아시스에서는 낙타를 치고 향료와 무역품을 나르던 아랍 유목 집단이 아시리아의 기록에 처음 나타난다. 기원전 738년 티글라트필레세르 3세에게 공물을 바친 이들 가운데 ‘아랍의 여왕’ 자비베가 있고, 기원전 733년의 원정에서는 여왕 삼시를 꺾었다고 한다. 센나케리브 때는 오아시스 도시 아두마투(지금의 두마트 알잔달)의 여왕 텔훈누가 신상을 빼앗겼고, 에사르하돈은 아랍 왕 하자엘에게 그 신상을 돌려주었고, 그 뒤 아시리아 궁정에서 자란 타부아를 ‘아랍의 여왕’에 세웠다. 아슈르바니팔 때 케다르의 우아이테(야우타)는 샤마시슘우킨의 반란(기원전 652~648) 무렵 아시리아에 맞섰다가 꺾였고, 기원전 645년 무렵 아비아테와 그의 형제 아야암무가 사로잡혔다고 아시리아 기록은 적는다(연대는 자료마다 한두 해 갈린다). 이 사막의 땅은 아시리아가 직접 지배한 적이 없고, 원정은 향료 길의 장악과 변경 안정이 목적이었다. 같은 케다르는 훗날 예레미야서와 이사야서에도 양과 낙타를 치는 부족으로 나오며, 그 중심지는 시나이 북쪽에서 북아라비아에 걸쳐 있었다. 아랍 부족과 신바빌로니아의 관계는 나보니두스의 타이마 체류에서 이어진다(「나보니두스와 신바빌로니아의 끝: 타이마 체류(기원전 553~543 무렵)와 바빌론의 항복(기원전 539)」, 뒤의 사건). 아시리아 기록에서 ‘아랍’이라는 이름이 처음 나오는 것은 기원전 853년 카르카르 전투에 낙타 1천 마리를 이끌고 온 ‘아랍 사람 긴디부’를 적은 대목이다. 에사르하돈이 이집트로 갈 때 아랍 부족에게서 낙타를 구한 일처럼, 낙타를 쓰는 아랍 부족은 사막 이동과 무역, 전쟁의 방식을 바꾸었다(「아시리아의 이집트 정복(기원전 674~667)」, 뒤의 사건)."
  subjects: [neo-assyrian-empire]
  tags: [politics, war, economy]
  sources: ["Israel Eph'al, The Ancient Arabs: Nomads on the Borders of the Fertile Crescent, 9th–5th Centuries B.C. (Magnes Press·Brill, 1982)", "Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)", "Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)"]

- id: syrian-ephraimite-war-734bc
  year: -733
  endYear: -731
  title:
    ko: "시리아·에브라임 전쟁과 다마스쿠스의 함락(기원전 734~732), 갈릴리와 길르앗의 상실"
  summary:
    ko: "다마스쿠스의 왕 르신과 이스라엘(에브라임)의 왕 베가는 아시리아에 맞서는 동맹에 유다를 끌어들이려 했다. 유다 왕 아하스가 따르지 않자 두 나라가 예루살렘을 쳤다고 열왕기와 이사야서는 전하며, 아하스가 아시리아에 도움을 청하면서 티글라트필레세르 3세에게 은과 금을 보냈다(열왕기 하 16장). 아시리아의 비문에도 ‘유다의 여호아하스(야우하지)’가 공물을 바친 왕으로 올라 있다. 아시리아군은 기원전 734년 이집트 국경까지 내려가 가자를 점령했고, 기원전 733~732년에 다마스쿠스를 에워싸 함락했다. 열왕기는 르신이 죽고 다마스쿠스 사람들이 키르로 끌려갔다고 전한다. 아람 다마스쿠스는 이로써 기원전 732년에 끝났고 땅은 아시리아 속주가 되었다. 이스라엘은 갈릴리와 길르앗, 해안 평야를 잃어 아시리아의 속주(므깃도·도르·길르앗)로 편입되었다. 고고학에서 하솔과 같은 갈릴리 성읍들의 파괴층이 이때의 일로 읽힌다. 남은 북왕국은 에브라임 산지의 사마리아와 그 둘레 정도였다. 베가는 호세아의 반란으로 죽었고, 티글라트필레세르는 호세아가 자기 도움으로 왕이 되었다고 적었다. 열왕기 하 15장은 갈릴리 주민이 아시리아로 옮겨졌다고 전한다. 유다는 형식상 독립을 지켰으나 아시리아의 속국이 되어 공물을 바쳐야 했고, 예루살렘 성전과 궁정의 은과 금이 아시리아로 흘러 나갔다. 열왕기는 아하스가 다마스쿠스에서 본 제단을 따라 예루살렘 성전에 새 제단을 세웠다고 전한다(열왕기 하 16장). 이사야서 7장은 이 위기 때 아하스에게 ‘임마누엘’의 징조를 주었다고 전하는데, 그 뜻은 신앙 전승마다 다르게 해석한다. 아시리아는 갈릴리에 총독을 두고 도로와 요새를 정비해 이 땅을 서쪽 진출의 거점으로 삼았다."
  subjects: [aram-damascus, israel-kingdom, judah-kingdom, neo-assyrian-empire]
  links:
    - { from: neo-assyrian-empire, to: aram-damascus, note: "다마스쿠스 함락과 속주화 (기원전 732)" }
    - { from: neo-assyrian-empire, to: israel-kingdom, note: "갈릴리·길르앗 점령 (기원전 732)" }
  tags: [politics, war]
  sources: ["Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)", "『구약 성경』 열왕기 하 15~16장, 이사야 7장 (대한성서공회 개역개정)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "Ephraim Stern, Archaeology of the Land of the Bible, Volume II: The Assyrian, Babylonian, and Persian Periods (732–332 B.C.E.) (Doubleday, 2001)"]

- id: philistia-assyria-babylon-734bc
  year: -733
  endYear: -603
  title:
    ko: "필리스티아 도시들: 아시리아의 속국에서 바빌로니아의 파괴까지(기원전 734~604)"
  summary:
    ko: "지중해 남동 해안의 가자·아스글론·아스돗·에그론·가트는 필리스티아의 도시국가였다. 기원전 734년 티글라트필레세르 3세의 원정으로 가자의 하누누는 이집트로 달아났고 이 도시들은 아시리아의 공물 명단에 올랐다. 기원전 720년 사르곤 2세는 라피아에서 가자의 하누누와 이집트 쪽 지원군을 꺾었고, 기원전 713~711년에는 아스돗의 반란을 진압하고 도시를 파괴해 속주로 삼았다(아스돗에서는 사르곤 2세의 석비 조각이 발굴되었다). 사르곤은 기원전 716년 무렵 ‘이집트의 개울’ 가에 교역 거점(카루)을 열어 이집트·아라비아와의 교역을 감독했다고 비문에 적었다. 열왕기와 이사야서는 이 반란에 유다가 연루되었을 가능성을 비친다. 기원전 701년 센나케리브의 원정 때는 아스글론과 에그론을 쳐서 왕들을 갈아 치웠고, 에그론의 반란을 이끈 귀족과 관리는 처형했다고 적었다. 에그론의 왕 파디는 히스기야의 유다에 붙잡혀 있다가 풀려났다. 에그론 유적에서는 7세기 아시리아의 속국 아래 올리브 기름을 대량 생산한 산업 구역(백 곳이 넘는 압착 시설)이 발굴되었고, 1996년 나온 봉헌 비문은 왕 이카우수가 파디의 아들임을 적는다. 이집트의 네코 2세가 기원전 609년 이후 카디티스(보통 가자로 본다)를 차지했다고 헤로도토스는 전한다(2.159). 신바빌로니아의 네부카드네자르 2세는 기원전 604년 키슬리무 달(11~12월) 아스글론을 점령해 파괴했다고 『바빌로니아 연대기』가 적는다. 아스글론 발굴에서 이 파괴층이 확인되었고 지도층 일부가 바빌로니아로 끌려갔다고 본다. 아스글론 같은 도시는 파괴되고 다른 도시는 속주나 속국으로 남아, 필리스티아 왕국들은 6세기 초 독립을 잃었다."
  subjects: [neo-assyrian-empire, judah-kingdom, saite-egypt, neo-babylonian-empire]
  tags: [politics, war]
  sources: ["Ephraim Stern, Archaeology of the Land of the Bible, Volume II: The Assyrian, Babylonian, and Persian Periods (732–332 B.C.E.) (Doubleday, 2001)", "Seymour Gitin·Trude Dothan·Joseph Naveh, ‘A Royal Dedicatory Inscription from Ekron’, Israel Exploration Journal 47 (1997)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Herodotus(헤로도토스), Historiai(『역사』) 2.159 (A. D. Godley 영역, Loeb, 1920~1925)", "Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)"]

- id: transjordan-edom-moab-ammon-734bc
  year: -733
  endYear: -551
  title:
    ko: "암몬·모압·에돔(기원전 8~6세기): 아시리아의 공물에서 바빌로니아의 편입까지"
  summary:
    ko: "요르단강 동쪽 고원에는 북쪽부터 암몬(수도 랍바, 지금의 암만)·모압·에돔이 있었다. 이 가운데 모압은 기원전 9세기 왕 메사가 새긴 메사 비석(루브르)으로 이스라엘의 지배를 벗어난 일을 자랑한 것으로 알려져 있으며, 비석에는 모압의 신 그모스의 이름과 이스라엘 야훼의 그릇을 옮겨 갔다는 말이 새겨져 있다. 기원전 734년 티글라트필레세르 3세의 공물 명단에는 모압의 살라마누, 암몬의 사니푸, 에돔의 카우스말라카가 올랐다. 기원전 673년 무렵 에사르하돈의 명단에는 모압의 무수리, 암몬의 푸두일, 에돔의 카우스가브리가 올라 있어, 같은 세 나라의 왕 이름이 60년 남짓 간격을 두고 아시리아의 공물 명단에 이어서 오른 것을 볼 수 있다. 이 시기 왕들은 이집트와 아시리아 사이를 오가며 때로 반란에 가담했고 아라비아와 지중해를 잇는 대상 무역로를 쥐고 부유해졌다. 기원전 594년 무렵 에돔·모압·암몬의 사절이 유다 왕 시드기야를 찾아와 바빌로니아에 맞서는 동맹을 의논했다고 예레미야서는 전한다(예레미야 27장). 같은 책은 암몬의 왕 바알리스가 유다 총독 그달리야의 암살을 사주했다고 전하며(예레미야 40~41장), 요세푸스는 바빌로니아가 예루살렘 함락 5년 뒤 암몬과 모압을 쳤다고 적으나 후대의 서술이어서 확인할 수 없다(『유대 고대사』 10.181). 나보니두스는 기원전 553년 무렵 아라비아 서북으로 나아가며 에돔을 쳤다고 본다(바빌로니아 기록은 이 원정을 아라비아 오아시스 중심으로 적는다). 기원전 6세기 중엽에는 세 나라 모두 바빌로니아의 영향 아래에 있었다. 에돔은 아라바의 구리와 시나이·네게브의 무역로를 쥐었고 신 코스(카우스)를 섬겼다. 세 나라는 모두 왕이 대를 이어 다스린 왕국이었으나 비문과 공물 명단에 전하는 왕의 이름은 몇 개에 그친다."
  subjects: [neo-assyrian-empire, neo-babylonian-empire, judah-kingdom]
  tags: [politics]
  sources: ["Israel Eph'al, The Ancient Arabs: Nomads on the Borders of the Fertile Crescent, 9th–5th Centuries B.C. (Magnes Press·Brill, 1982)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 10 (Ralph Marcus 영역, Loeb, 1937)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "Hayim Tadmor·Shigeo Yamada, The Royal Inscriptions of Tiglath-pileser III (744–727 BC) and Shalmaneser V (726–722 BC), Kings of Assyria (Eisenbrauns, 2011)"]

- id: piye-conquest-728bc
  year: -727
  endYear: -726
  title:
    ko: "피예의 이집트 원정(기원전 728~725 무렵)과 승전비"
  summary:
    ko: "쿠시의 왕 피예(재위 기원전 747~716 무렵이라는 설과 744~714라는 설이 있다)는 나파타에서 이집트의 약소 왕국들을 지켜보고 있었다. 기원전 728~725년 무렵(재위 20~21년째, 즉위 해 학설에 따라) 사이스의 테프나크트가 삼각주의 군주들과 연합해 남쪽으로 올라와 중이집트의 쿠시 속국 헤라클레오폴리스를 압박하고 헤르모폴리스의 님로트까지 끌어들이자, 피예는 군대를 나일강을 따라 내려보냈다. 그는 테베에서 아몬 신에게 제를 올린 뒤 헤르모폴리스를 포위해 항복시키고 멤피스를 폭풍처럼 점령했다. 삼각주의 타니스 왕 오소르콘 4세와 렌토폴리스의 이우풋 2세 같은 군주들이 차례로 복속했다. 테프나크트는 사자를 보내 맹세하며 항복했으나 끝내 피예 앞에 직접 나서지 않았다. 게벨 바르칼에 세운 승전비(1862년 발견, 카이로 박물관)는 이 원정을 길게 새기며, 피예가 굶주린 말들을 본 것에 화를 내고 정결 의식을 지키지 않은 군주는 왕궁에 들이지 않았다는 등 쿠시 왕의 신앙과 기개를 전한다. 피예는 이집트를 직접 다스리지 않고 군주들의 지위를 인정한 채 공물만 받고 나파타로 돌아갔다. 그는 엘쿠르루에 이집트식 피라미드를 짓고 묻혔다. 이 원정으로 쿠시는 이집트의 상위 왕이 되었고, 다음 왕들이 이집트를 한 나라로 묶는다. 피예는 나파타의 게벨 바르칼 아몬 신전을 크게 넓혔고 그 바위산을 아몬의 거처로 여겼다. 이집트 신관들은 쿠시 왕을 외국의 침략자가 아니라 이집트 전통의 수호자로 받아들였다. 피예 뒤로 샤바카와 샤바타카(순서는 학설이 갈린다), 타하르카, 타누타문이 이집트 왕의 칭호를 이어 썼다. 비문은 피예가 멤피스를 얻고도 시민을 해치지 못하게 했다고 적는다."
  subjects: [kushite-egypt]
  tags: [politics, war]
