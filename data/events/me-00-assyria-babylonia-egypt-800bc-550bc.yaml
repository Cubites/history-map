- id: esarhaddon-681bc
  year: -680
  endYear: -668
  title:
    ko: "에사르하돈(기원전 681~669): 바빌론의 재건, 시돈의 파괴, 후계 서약(기원전 672)"
  summary:
    ko: "센나케리브가 살해되자 에사르하돈은 형들과의 싸움에서 이겨 니네베를 차지하고 기원전 681년 왕위에 올랐다(재위년은 기원전 680~669로 센다). 그는 아버지가 파괴한 바빌론을 되살리는 것을 큰 사업으로 삼아 기원전 680년 재건을 선언하고 에사길라(마르두크 신전)와 에테메난키(지구라트)를 고쳤으며, 아시리아에 있던 마르두크 신상을 돌려보내는 데 힘썼다. 기원전 677년의 시돈 함락과 카르에사르하돈 건설은 따로 다룬다(「페니키아 도시들과 아시리아(기원전 8~7세기): 티레·시돈·비블로스의 공물과 시돈의 파괴(기원전 677)」, 앞의 사건). 기원전 673~672년의 명단에는 유다의 므낫세를 비롯한 서쪽 22명의 왕이 궁전 건설에 목재와 석재를 바치는 이로 올라 있다. 기원전 672년 그는 제국 안 고관들과 속국 왕들에게 아들 아슈르바니팔을 아시리아의 후계자로, 아들 샤마시슘우킨을 바빌로니아의 후계자로 삼겠다는 서약을 맺게 했다. 이 ‘후계 서약’ 서판은 1955년 님루드 신전에서 나왔는데, 메디아 족장 같은 속국 지도자들의 서약을 담았고, 저주 조항의 일부는 구약의 신명기 28장과 비슷해 둘의 관계가 논쟁된다. 에사르하돈은 이집트 원정길에 병을 얻어 하란에서 기원전 669년 죽었다(「아시리아의 이집트 정복(기원전 674~667)」, 뒤의 사건). 왕의 어머니 나키아(자쿠투)는 궁정에서 영향력이 컸고, 왕은 신탁과 점성가의 보고에 크게 의지했으며 불길한 징조가 나오면 대역 왕을 세우는 의식을 치르기도 했다. 기원전 670년에는 사시라는 고관을 앞세워 왕을 몰아내려던 궁정 음모가 드러나 가담한 많은 고관이 처형되었는데, 공식 기록은 이 일을 적지 않아 다른 자료로 짜 맞춘다. 비문에서 그는 스스로를 ‘이집트·파트로스·쿠시의 왕’이라 불렀다. 역대하 33장은 므낫세가 사슬에 묶여 바빌론에 끌려갔다 돌아왔다고 전하나 아시리아 쪽 기록에는 이 일이 없다. 이 서약은 왕이 죽은 뒤 아슈르바니팔이 왕위에 오를 때 근거가 되었다."
  subjects: [neo-assyrian-empire, judah-kingdom]
  tags: [politics, war, diplomacy]
  sources: ["Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "Simo Parpola·Kazuko Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (Helsinki University Press, 1988)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "Karen Radner, ‘The Trials of Esarhaddon: The Conspiracy of 670 BC’, ISIMU 6 (2003)", "Mario Liverani, Assyria: The Imperial Mission (Allison Brown 영역, Eisenbrauns, 2017)"]

- id: assyria-egypt-674bc
  year: -673
  endYear: -665
  title:
    ko: "아시리아의 이집트 정복(기원전 674~667)"
  summary:
    ko: "기원전 701년 엘테케에서 부딪친 아시리아와 이집트·쿠시는 에사르하돈 때 본격적으로 맞섰다. 에사르하돈은 기원전 677년 아라비아 부족을 치며 이집트 국경 ‘이집트의 개울’ 가까이 닿았고, 기원전 674년(673년설도 있다)의 첫 이집트 원정은 쿠시 왕 타하르카에게 패해 실패했다. 기원전 671년 에사르하돈은 아라비아 부족장들에게서 낙타를 얻어 시나이 사막을 건너 이집트로 들어갔다. 비문은 그가 멤피스를 반나절 만에 얻고 타하르카의 가족을 사로잡았다고 자랑하며, 타하르카는 달아났다. 아시리아는 이집트를 직접 속주로 삼지 않고 삼각주의 사이스를 다스리던 네코 1세를 비롯해 20명 안팎의 현지 군주에게 왕과 총독의 칭호를 주어 속국으로 두었다. 에사르하돈이 세운 승전비(북시리아 신 사말, 지금의 진지를리 출토)에는 타하르카의 아들이 끈에 묶여 무릎 꿇은 모습이 새겨졌다. 기원전 669년 타하르카는 멤피스와 삼각주를 되찾았고, 에사르하돈은 다시 원정을 떠나다가 하란에서 죽었다. 기원전 667년 아슈르바니팔은 이집트로 군대를 보내 타하르카를 몰아냈다. 타하르카는 테베로 달아났고 아슈르바니팔은 네코 1세를 복위시키고 그의 아들 프삼티크를 아트리비스에 두었다. 그러나 삼각주의 군주들이 비밀리에 타하르카와 편지를 주고받은 일이 발각되어 네코는 니네베로 끌려갔다가 선물과 함께 사이스로 돌려보내졌다. 아시리아는 이집트의 부와 신전의 재물을 얻었지만 거리가 멀어 오래 눌러앉지 못했다. 쿠시 왕조의 끝과 프삼티크의 자립은 이어진 사건에서 다룬다(「쿠시 왕조의 끝(기원전 664~656): 타누타문과 테베의 약탈, 상이집트의 상실」, 뒤의 사건). 아시리아는 삼각주의 신전과 현지 관습을 크게 건드리지 않고 금·은·보석과 말, 장인을 가져갔다."
  subjects: [neo-assyrian-empire, kushite-egypt]
  links:
    - { from: neo-assyrian-empire, to: kushite-egypt, note: "멤피스 점령과 삼각주의 속국화 (기원전 671)" }
  tags: [war, politics]
  sources: ["Erle Leichty, The Royal Inscriptions of Esarhaddon, King of Assyria (680–669 BC) (Eisenbrauns, 2011)", "Kenneth A. Kitchen, The Third Intermediate Period in Egypt (1100–650 B.C.) (2판, Aris & Phillips, 1986)", "Robert G. Morkot, The Black Pharaohs: Egypt's Nubian Rulers (Rubicon Press, 2000)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)"]

- id: ashurbanipal-669bc
  year: -668
  endYear: -630
  title:
    ko: "아슈르바니팔(기원전 669~631 무렵): 니네베의 도서관과 제국의 절정"
  summary:
    ko: "아슈르바니팔은 기원전 669년 아버지 에사르하돈이 죽자 아시리아의 왕이 되었다(죽음은 기원전 631년설이 우세하고 627년설도 있다). 그의 치세에 아시리아는 쿠시 왕조의 이집트를 쳐서 얻었으나 곧 잃었고, 엘람을 무너뜨렸으며, 형제 샤마시슘우킨의 반란을 눌렀다. 리디아의 기게스가 킴메르에 맞서 도움을 청한 일도 그의 비문에 나온다. 그러나 아슈르바니팔은 전쟁보다 학문과 건축으로 이름이 높다. 니네베 쿠윤직 언덕에서 나온 서판 3만 점 이상은 ‘아슈르바니팔의 도서관’으로 불리며 영국인 오스틴 헨리 레이어드(1849~1851)와 호르무즈드 라삼(1850년대 초)의 발굴로 대영박물관에 들어갔다. 왕은 자신이 글을 읽고 쓸 줄 알며 전문가들의 비밀 지식에 통달했다고 비문에 자랑했다. 도서관에는 점술과 징조(에누마 아누 엔릴), 주문, 의학, 어휘집, 창조 서사시(에누마 엘리시), 길가메시 서사시 등이 있었고, 1872년 조지 스미스가 해독한 길가메시 서사시의 11번째 서판의 홍수 이야기는 구약의 노아와 비교되어 관심을 끌었다. 왕은 바빌로니아와 각지의 신전에서 서판을 베끼게 해 모았다고 한다. 아슈르바니팔이 지은 니네베 북궁의 부조 ‘사자 사냥’은 우리에서 풀어놓은 사자를 왕이 활과 창으로 잡는 의식 장면으로 읽는 견해가 있으며, 아시리아 미술의 정점으로 꼽힌다. 아슈르바니팔이 죽은 뒤 아들 아슈르에틸일라니와 신샤르이슈쿤 등이 차례로 왕위를 이었으나 제국은 급속히 기울었다. 말년의 기록은 거의 없어 그의 죽음의 해와 마지막 몇 해의 일은 분명하지 않다. 서판에는 ‘아슈르바니팔 왕의 궁전’이라는 소유 표시가 찍혔고 원본과 맞춰 고쳤다는 필사 표시가 남은 것도 있다."
  subjects: [neo-assyrian-empire, kushite-egypt, elam-neo-elamite]
  tags: [culture, politics]
  sources: ["Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "Mario Liverani, Assyria: The Imperial Mission (Allison Brown 영역, Eisenbrauns, 2017)", "Grant Frame, Babylonia 689–627 B.C.: A Political History (Nederlands Instituut voor het Nabije Oosten, 1992)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: kush-end-664bc
  year: -663
  endYear: -655
  title:
    ko: "쿠시 왕조의 끝(기원전 664~656): 타누타문과 테베의 약탈, 상이집트의 상실"
  summary:
    ko: "타하르카(재위 기원전 690~664)가 죽자 조카 타누타문이 왕위를 이었다. 그는 나파타의 ‘꿈 석비’에서 두 마리 뱀의 꿈을 꾼 뒤 이집트를 되찾으라는 징조로 읽었다고 전한다. 타누타문은 상이집트를 거쳐 멤피스를 얻었고, 아시리아에 붙은 사이스의 네코 1세는 이 싸움에서 죽은 것으로 본다(헤로도토스는 2.152에서 사이스의 왕 네코를 에티오피아인 사바코스가 죽였다고 전한다). 아슈르바니팔은 곧 군대를 보냈고 프삼티크와 함께 멤피스 근처에서 타누타문을 꺾었다. 기원전 663년 아시리아군은 테베를 약탈했다. 아슈르바니팔의 기록은 도시에서 금·은과 보석, 오벨리스크 둘을 가져갔다고 적었고, 구약의 나훔서는 니네베의 운명을 ‘노(테베) 아몬’의 몰락에 견준다(나훔 3장). 타누타문은 누비아로 물러났으나 상이집트에서는 아몬의 신관 멘투엠하트 같은 토호가 계속 테베를 다스렸다. 기원전 656년(프삼티크 재위 9년) 프삼티크 1세는 함대를 테베로 보내 딸 니토크리스를 ‘아몬의 신의 아내’ 샤펜웨펫 2세의 후계자로 입양시키는 방식으로 상이집트를 평화롭게 손에 넣었다(「프삼티크 1세의 이집트 재통일(기원전 664~)과 네코 2세(기원전 610~595)」, 같은 시기의 사건). 이로써 쿠시는 이집트 지배를 마쳤고 제25왕조는 끝났다. 쿠시 왕들은 나파타에서 이집트식 왕권을 유지했고 아몬을 모시는 신앙과 문자를 이어 갔으며, 나파타에서 메로에로 중심이 옮겨 가며 아프리카의 독자적인 왕국으로 남았다. 쿠시 왕조의 영향은 이집트 문화에 오래 남았다. 쿠시 왕들은 엘쿠르루와 누리에 이집트식 피라미드를 짓고 이집트의 신들을 계속 모셨으며, 이집트의 사이스 왕조는 뒷날 이 왕들의 이름을 기념물에서 지웠다(「프삼티크 2세의 누비아 원정(기원전 593 무렵)과 쿠시의 남하」, 뒤의 사건)."
  subjects: [kushite-egypt, neo-assyrian-empire, saite-egypt]
  links:
    - { from: saite-egypt, to: kushite-egypt, note: "상이집트 접수와 쿠시 세력의 퇴장 (기원전 656)" }
  tags: [politics, war]
  sources: ["Robert G. Morkot, The Black Pharaohs: Egypt's Nubian Rulers (Rubicon Press, 2000)", "László Török, The Kingdom of Kush: Handbook of the Napatan–Meroitic Civilization (Brill, 1997)", "Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)", "Miriam Lichtheim, Ancient Egyptian Literature, Volume III: The Late Period (University of California Press, 1980)", "『구약 성경』 나훔 3장 (대한성서공회 개역개정)", "Herodotus(헤로도토스), Historiai(『역사』) 2.152 (A. D. Godley 영역, Loeb, 1920~1925)"]

- id: elam-ulai-susa-653bc
  year: -652
  endYear: -645
  title:
    ko: "엘람의 쇠퇴: 울라이 전투(기원전 653)와 수사의 약탈(기원전 647~646)"
  summary:
    ko: "엘람의 왕 테움만(재위 기원전 664~653 무렵)은 전왕 우르타크의 아들들을 내쫓고 왕위에 올랐다. 우르타크의 아들 훔반니카시 2세와 탐마리투는 아시리아로 달아났고, 아슈르바니팔이 그들을 돌려보내라는 요구를 거절하자 테움만은 기원전 653년 아시리아 동쪽으로 쳐들어왔다. 아시리아군은 울라이강(카룬강 서쪽의 카르헤강) 가의 틸투바 근처에서 엘람군을 꺾었고 테움만은 아들과 함께 죽었다. 니네베 궁전 부조는 이 싸움과 테움만의 목을 가져가 연회장에 걸어 둔 장면을 새겼다. 아슈르바니팔은 훔반니카시 2세(우마니가시)를 마닥투에, 탐마리투를 히달루에 앉히며 엘람을 둘로 나눴다. 엘람은 샤마시슘우킨의 반란에 가담했다가 다시 아시리아의 보복을 받았다. 기원전 647~646년 아슈르바니팔은 엘람을 다시 쳐 수사를 약탈했다. 비문은 신전과 왕릉을 부수고 신상과 보물을 가져갔으며 땅에 소금을 뿌렸다고 자랑한다. 엘람의 수도 수사는 크게 파괴되었으나 엘람이라는 이름의 왕국은 곧바로 사라지지 않고 작은 왕국들로 나뉘어 이어졌다. 신엘람 3기(기원전 646~539)로 부르는 이 시기에 수사는 일부 되살아났고 고지의 안샨 쪽은 페르시아 사람들이 차지해 갔다. 학자들은 이 파괴를 엘람이 쇠퇴한 결정적 계기로 보되 아시리아가 엘람을 한 번에 병합하지는 못했다고 본다(앞의 사건 「신엘람 왕국의 등장(기원전 760 무렵): 훔반타흐라에서 훔반니카시 1세까지」). 아시리아로 달아났던 엘람 왕족은 아시리아에서 자라 엘람의 왕으로 돌아가기도 했다. 수사에서는 파괴 뒤에도 엘람어 문서가 이어졌다. 아슈르바니팔은 이때 수사에서 1,635년 전에 엘람이 가져갔던 여신 상을 되찾아 우루크로 돌려보냈다고 자랑하는데, 이는 엘람이 오래된 보물을 간직하고 있었음을 알려 준다."
  subjects: [elam-neo-elamite, neo-assyrian-empire]
  tags: [war, politics]
  sources: ["Matthew W. Waters, A Survey of Neo-Elamite History (State Archives of Assyria Studies 12, Neo-Assyrian Text Corpus Project, 2000)", "Elizabeth Carter·Matthew W. Stolper, Elam: Surveys of Political History and Archaeology (University of California Press, 1984)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: shamash-shum-ukin-652bc
  year: -651
  endYear: -647
  title:
    ko: "샤마시슘우킨의 반란(기원전 652~648): 아시리아 형제 전쟁과 바빌론의 포위"
  summary:
    ko: "에사르하돈은 기원전 672년 서약으로 아슈르바니팔을 아시리아의, 샤마시슘우킨을 바빌로니아의 후계자로 정했고, 아슈르바니팔은 기원전 669년, 샤마시슘우킨은 마르두크 신상이 돌아온 기원전 668년에 왕이 되었다. 샤마시슘우킨은 바빌론의 왕이었으나 실제로는 형제의 종속 왕이었다. 마르두크 신상이 돌아오고 바빌론의 재건이 이어졌어도 그는 아시리아의 군사 징발과 간섭에 시달렸다. 기원전 652년 그는 아시리아에 반기를 들었다. 칼데아 부족과 아람 부족, 엘람, 북아라비아의 케다르 부족이 가담했다고 아슈르바니팔의 기록은 적는다. 전쟁은 약 3년 이어졌고 아시리아군은 바빌로니아 도시들을 하나씩 되찾아 바빌론을 포위했다. 기원전 648년 바빌론은 2년 가까운 포위 끝에 굶주림 속에 함락되었고, 아슈르바니팔은 포위 중 사람이 사람을 먹는 일이 있었다고 자랑하듯 기록했다. 샤마시슘우킨은 궁전이 불탈 때 죽은 것으로 보는 견해가 많으나 기록이 분명하지 않다. 아슈르바니팔은 센나케리브의 거상 앞에서 반란자들을 처형했다고 전한다. 이후 바빌론은 칸달라누가 아슈르바니팔의 이름으로 다스렸고(기원전 648~627), 이 인물이 아슈르바니팔 자신과 같다는 소수 견해도 있다. 형제 전쟁은 아시리아의 힘을 크게 깎았다. 바빌로니아의 도시들은 약탈로 피폐해졌고 원정은 엘람과 아라비아로 번지며 제국의 재정을 소모시켰다. 이 틈에 나보폴라사르가 기원전 626년 바빌론의 왕위에 올랐다(「나보폴라사르와 신바빌로니아의 성립(기원전 626)·니네베의 함락(기원전 612)」, 뒤의 사건). 이 전쟁으로 바빌로니아 도시들은 샤마시슘우킨 쪽과 아슈르바니팔 쪽으로 갈렸고, 우루크와 우르 같은 남쪽 도시들은 대체로 아시리아를 지지했다고 본다."
  subjects: [neo-assyrian-empire, elam-neo-elamite]
  tags: [war, politics]
  sources: ["Grant Frame, Babylonia 689–627 B.C.: A Political History (Nederlands Instituut voor het Nabije Oosten, 1992)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Israel Eph'al, The Ancient Arabs: Nomads on the Borders of the Fertile Crescent, 9th–5th Centuries B.C. (Magnes Press·Brill, 1982)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)"]

- id: josiah-reform-640bc
  year: -639
  endYear: -608
  title:
    ko: "므낫세에서 요시야까지: 유다의 아시리아 종속과 요시야의 개혁(기원전 622), 므깃도(기원전 609)"
  summary:
    ko: "히스기야의 아들 므낫세(재위는 기원전 697~642 무렵이라는 설과 687~643이라는 설이 있다)는 아시리아의 속국으로 오래 다스렸고, 에사르하돈과 아슈르바니팔의 공물 명단에 이름이 올랐다. 열왕기는 그가 아시리아의 신들을 들여오고 예루살렘 성전에 제단을 세워 이스라엘의 신앙을 어지럽혔다고 평가하며(열왕기 하 21장), 이는 신학적 평가이므로 정치적 사정과 함께 읽어야 한다. 그의 아들 아몬이 두 해 만에 암살되자 여덟 살의 요시야가 기원전 640년 무렵 왕위에 올랐다. 아시리아가 기울던 때 요시야는 열왕기에 따라 재위 18년째(기원전 622)에 성전을 수리하다가 ‘율법책’이 발견되었고, 이를 계기로 예루살렘 성전에서만 제사를 드리게 하고 지방 산당과 다른 신들을 없앴으며 유월절을 크게 지켰다(열왕기 하 22~23장). 역대기는 개혁이 더 일찍 시작되었다고 적는다. 많은 학자는 이 율법책이 신명기의 핵심 부분이었다고 보고, 개혁이 아시리아의 영향이 약해진 틈에 옛 북왕국 땅으로 영향력을 넓히려는 정치적 의도와 연결되어 있었다고 본다. 반면 개혁의 규모와 사실성을 의심하는 견해도 있다. 같은 시기 예언자 예레미야가 활동을 시작했고, 스바냐와 나훔은 아시리아의 몰락을 말했다. 기원전 609년 이집트의 네코 2세가 아시리아를 도우려 북쪽으로 가는 길에 요시야가 므깃도에서 길을 막다가 죽었다(열왕기 하 23장, 역대하 35장은 죽는 경위를 다르게 적는다). 이 일로 유다는 이집트의 영향권에 들어갔다. 열왕기는 개혁 때 없앤 것으로 하늘의 군대에 바치는 제사와 아세라 목상, 몰렉 제의 같은 항목을 든다(열왕기 하 23장)."
  subjects: [judah-kingdom, neo-assyrian-empire, saite-egypt]
  tags: [religion, politics]
  sources: ["『구약 성경』 열왕기 하 21~23장, 역대하 33~35장 (대한성서공회 개역개정)", "Israel Finkelstein·Neil Asher Silberman, The Bible Unearthed: Archaeology's New Vision of Ancient Israel and the Origin of Its Sacred Texts (Free Press, 2001)", "Lester L. Grabbe, Ancient Israel: What Do We Know and How Do We Know It? (T&T Clark, 2007)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)"]

- id: assyria-last-kings-631bc
  year: -630
  endYear: -608
  title:
    ko: "아시리아의 마지막 왕들(기원전 631~609): 아슈르에틸일라니·신샤르이슈쿤·아슈르우발리트 2세와 이집트의 지원"
  summary:
    ko: "아슈르바니팔이 죽은 뒤(기원전 631년설과 627년설이 있다) 아들 아슈르에틸일라니(재위 기원전 631~627 무렵)가 왕이 되었고, 그 궁정에서 힘을 쥐었던 환관 출신 장군 신슈무리시르는 아슈르에틸일라니의 형제 신샤르이슈쿤(재위 627~612)이 즉위한 뒤 반란을 일으켜 북바빌로니아를 석 달 가량 차지했으나 진압되었다(기원전 626 무렵). 바빌로니아에서는 칸달라누가 죽자 나보폴라사르가 기원전 626년 바빌론의 왕이 되었다. 아시리아는 기원전 616년부터 바빌로니아에게 유프라테스 유역을 잃어 갔는데, 이때 이집트의 프삼티크 1세가 아시리아에 군대를 보내 도왔다고 바빌로니아 연대기는 적는다. 이집트는 아시리아를 완충지로 삼아 바빌로니아를 막고 싶었다. 기원전 614년 아슈르와 기원전 612년 니네베가 무너진 경과는 「나보폴라사르와 신바빌로니아의 성립(기원전 626)·니네베의 함락(기원전 612)」(뒤의 사건)이 다룬다. 니네베 할지 성문의 발굴에서는 성을 지키다 쓰러진 병사의 유해와 화살촉이 나왔다. 신샤르이슈쿤은 이때 죽은 것으로 보며, 살아남은 아슈르우발리트 2세는 하란에서 왕을 칭했으나 기원전 609년 이집트의 도움을 받은 반격마저 실패한 뒤 기록에서 사라져 이 해를 아시리아 왕국의 끝으로 본다. 네코 2세는 이 무렵 북상하다가 유다의 요시야와 므깃도에서 부딪쳤다. 제국이 무너진 이유는 형제 전쟁과 속국의 반란, 바빌로니아·메디아의 동시 공격이 겹쳤기 때문이라고 설명하지만 그 비중은 연구자마다 다르다. 아슈르 지방의 사람들과 문화는 이후에도 이어져 도시와 신전이 일부 남았다. 이집트의 지원은 이후 이집트가 하란과 카르케미시로 군대를 보내는 첫걸음이 되었다."
  subjects: [neo-assyrian-empire, neo-babylonian-empire, media-kingdom, saite-egypt, judah-kingdom]
  tags: [politics, war]
  sources: ["A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Karen Radner, Ancient Assyria: A Very Short Introduction (Oxford University Press, 2015)", "Mario Liverani, Assyria: The Imperial Mission (Allison Brown 영역, Eisenbrauns, 2017)", "Marc Van De Mieroop, A History of the Ancient Near East, ca. 3000–323 BC (3판, Wiley-Blackwell, 2016)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, Cambridge University Press, 1991)"]

- id: judah-last-kings-609bc
  year: -608
  endYear: -585
  title:
    ko: "유다의 마지막 왕들(기원전 609~586): 이집트와 바빌로니아 사이, 라키시 서신과 예루살렘의 포위"
  summary:
    ko: "요시야가 죽은 뒤 백성은 아들 여호아하스를 왕으로 세웠으나 네코 2세가 석 달 만에 그를 이집트로 끌어가고 형 엘리아김을 여호야김으로 이름을 바꿔 왕위에 앉혔다(열왕기 하 23장). 여호야김(재위 기원전 609~598)은 이집트에 무거운 공물을 바쳤으나 기원전 605년 카르케미시에서 이집트가 지자 기원전 605~604년 무렵 네부카드네자르 2세에게 복속했다. 기원전 601년 바빌로니아와 이집트가 부딪쳐 서로 큰 손해를 입자 그는 다시 이집트 편에 서서 반기를 들었다. 기원전 598년 여호야김이 죽고 아들 여호야긴이 석 달 뒤 항복하자 바빌로니아는 기원전 597년 예루살렘을 차지하고 시드기야를 왕으로 세웠다(「네부카드네자르 2세: 예루살렘의 함락(기원전 587)과 바빌론 유수, 바빌론의 건설(기원전 605~561)」, 뒤의 사건). 기원전 594년 무렵에는 주변 나라 사절이 예루살렘에 모여 반바빌로니아 동맹을 의논했고, 예레미야는 바빌로니아의 멍에를 받아들이라고 했다(예레미야 27장). 시드기야가 이집트의 왕 아프리에스(호프라)에 기대 기원전 589년 무렵 다시 반란하자 포위가 시작되었다. 예레미야서는 아프리에스의 군대가 나서자 바빌로니아가 잠시 포위를 풀었다고 전한다(예레미야 37장). 1935년 라키시에서 나온 히브리어 서판(라키시 서신) 가운데 한 통은 전초 지휘관이 상관에게 아세가의 신호를 볼 수 없다고 보고하는 내용으로 읽힌다. 예레미야서도 라키시와 아세가가 마지막까지 버틴 요새였다고 적는다(34장). 유다의 왕국으로서의 역사는 기원전 587/586년 예루살렘의 함락으로 끝났다. 아랏 요새에서 나온 히브리어 오스트라카에는 에돔의 위협을 알리는 편지가 들어 있다."
  subjects: [judah-kingdom, saite-egypt, neo-babylonian-empire]
  tags: [politics, war]
  sources: ["『구약 성경』 열왕기 하 23~25장, 예레미야 27장·34장·37장 (대한성서공회 개역개정)", "Harry Torczyner 외, Lachish I (Tell ed-Duweir): The Lachish Letters (Oxford University Press, 1938)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "J. Maxwell Miller·John H. Hayes, A History of Ancient Israel and Judah (2판, Westminster John Knox Press, 2006)", "Ephraim Stern, Archaeology of the Land of the Bible, Volume II: The Assyrian, Babylonian, and Persian Periods (732–332 B.C.E.) (Doubleday, 2001)"]

- id: psamtik-ii-nubia-593bc
  year: -592
  endYear: -588
  title:
    ko: "프삼티크 2세의 누비아 원정(기원전 593 무렵)과 쿠시의 남하"
  summary:
    ko: "프삼티크 2세(재위 기원전 595~589)는 즉위 3년째인 기원전 593년 무렵(592년설도 있다) 군대를 남쪽 누비아로 보냈다. 이 원정에는 그리스·카리아·페니키아 용병이 따랐고, 아부심벨의 람세스 2세 석상 다리에 그리스어와 카리아어, 페니키아어 낙서가 남았다. 그리스어 낙서는 프삼티크가 엘레판티네에 이르렀을 때 그와 함께 배를 타고 온 자들이 키르키스를 지나 강이 허락하는 데까지 올라갔다고 적는다. 원정군은 쿠시 땅 안으로 들어가 나파타까지 닿았다고 알려지는데, 카르낙 석비는 쿠시군을 물리쳤다고 적는다. 이후 이집트 전역에서 제25왕조 쿠시 왕들의 이름과 모습을 지우는 일이 벌어졌다. 이는 사이스 왕조가 쿠시 왕조의 정통성을 부정하려는 움직임이었다. 쿠시의 아스펠타(재위는 기원전 600 무렵~580 무렵이라는 설과 593~568이라는 설이 있다) 때 왕궁이 남쪽 메로에 쪽으로 옮겨졌을 가능성이 있고, 이를 이집트 원정의 결과로 보는 견해가 있으나 확실하지는 않다. 나파타는 이후에도 아몬 신앙의 중심지로 남았다. 프삼티크 2세는 이 뒤 시리아·페니키아를 방문하기도 했으나 즉위 6년 만에 죽었고, 아프리에스가 왕위를 이었다(「아마시스 2세(기원전 570~526)와 캄비세스 2세의 이집트 정복(기원전 525)」, 뒤의 사건). 이집트의 남쪽 국경은 엘레판티네 둘레의 제1폭포에 머물렀다. 낙서를 남긴 그리스 용병 가운데는 로도스와 이오니아 출신이 있다. 승리 뒤에도 이집트는 누비아를 직접 지배하려 하지 않고 국경 수비를 굳히는 데 그쳤다. 프삼티크 2세의 딸 앙크네스네페리브레는 테베의 ‘아몬의 신의 아내’ 니토크리스의 후계자가 되어 사이스 왕가가 상이집트를 신전 체계로 묶는 일을 이어 갔다."
  subjects: [saite-egypt]
  tags: [war, politics]
  sources: ["Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)", "László Török, The Kingdom of Kush: Handbook of the Napatan–Meroitic Civilization (Brill, 1997)", "Robert G. Morkot, The Black Pharaohs: Egypt's Nubian Rulers (Rubicon Press, 2000)", "Nicolas Grimal, A History of Ancient Egypt (Ian Shaw 영역, Blackwell, 1992)"]

- id: tyre-siege-586bc
  year: -585
  endYear: -572
  title:
    ko: "네부카드네자르 2세의 티레 포위(기원전 586~573 무렵)와 에스겔의 예언"
  summary:
    ko: "페니키아의 티레는 본토 해안과 가까운 섬 도시로, 아시리아의 포위에도 샬마네세르 5세 때(요세푸스가 전하는 메난드로스에 따르면 5년)와 에사르하돈 때를 견뎠다. 신바빌로니아의 네부카드네자르 2세가 시리아·팔레스타인을 얻은 뒤에도 티레는 이집트의 부추김 속에 바빌로니아에 맞섰다. 헤로도토스는 이집트의 아프리에스가 시돈을 치고 티레와 바다에서 싸웠다고 전한다(2.161). 요세푸스가 전하는 메난드로스 인용에 따르면 네부카드네자르는 티레를 13년 동안 에워쌌고(『아피온 반박』 1.156~159), 일반적으로 그 시기를 기원전 586~573년으로 본다. 요세푸스 자신은 시작을 네부카드네자르 7년으로 적어 해가 더 이르게 어긋난다. 바빌로니아 쪽 기록은 ‘왕과 군대가 티레로 진군할 때의 식량’을 적은 서판 한 장(1926년 발견) 정도여서 포위의 경과는 잘 알려지지 않는다. 에스겔은 기원전 587/586년 무렵 티레의 파멸을 예언했으나(에스겔 26장), 약 16년 뒤 29장은 네부카드네자르의 군대가 티레를 치느라 고생했으나 아무 보수를 받지 못했다고 적어 티레를 군사적으로 점령하지 못했음을 짐작하게 한다. 포위는 협상으로 끝났고 티레는 바빌로니아의 종주권을 받아들였다. 이토바알 3세가 죽거나 물러난 뒤 바알 2세가 속국의 왕으로 즉위했다. 요세푸스는 바알 2세(재위 기원전 573~564 무렵) 뒤 티레가 한동안 왕 대신 ‘판관’들의 다스림을 받았다고 전하나 이는 이 포위가 끝난 뒤의 일이다. 이 포위는 네부카드네자르가 바빌로니아의 서쪽 영토를 어떻게 굳혔는지를 보여 주는 사례이다. 에스겔 27장은 티레가 스페인의 은, 키프로스의 목재, 이집트의 아마포를 거래한 폭넓은 교역을 시로 그린다. 네부카드네자르는 이 무렵 레바논의 삼나무를 얻는 일에 힘을 쏟았다고 와디 브리사 비문이 적는다."
  subjects: [neo-babylonian-empire, saite-egypt]
  tags: [war, politics]
  sources: ["H. Jacob Katzenstein, The History of Tyre: From the Beginning of the Second Millennium B.C.E. until the Fall of the Neo-Babylonian Empire in 539 B.C.E. (Schocken Institute for Jewish Research, 1973)", "Josephus(요세푸스), Contra Apionem(『아피온 반박』) 1.156~159 (H. St. J. Thackeray 영역, Loeb, 1926)", "Herodotus(헤로도토스), Historiai(『역사』) 2.161 (A. D. Godley 영역, Loeb, 1920~1925)", "Josette Elayi, History of Phoenicia (Lockwood Press, 2018)", "『구약 성경』 에스겔 26장·29장 (대한성서공회 개역개정)"]

- id: cyrus-anshan-559bc
  year: -558
  endYear: -549
  title:
    ko: "안샨의 키루스 2세(기원전 559~550)와 메디아의 끝"
  summary:
    ko: "키루스 2세는 이란 남서부 파르스의 안샨(지금의 탈레 말리얀 일대)을 다스린 왕가에서 태어났다. 키루스 원통은 그가 캄비세스 1세의 아들이자 키루스(1세)의 손자, 테이스페스의 후손이며 모두 ‘안샨의 왕’이었다고 적는다. 안샨은 엘람의 고지로 한때 엘람 왕국에 속했으나 엘람이 약해진 뒤 페르시아 사람들이 차지해 아시리아의 속국이 되었다가 메디아의 영향 아래 있었다고 본다. 키루스가 왕위에 오른 해는 기원전 559년이다. 『나보니두스 연대기』는 기원전 550년 무렵(나보니두스 6년, 549년설도 있다) 메디아의 왕 이슈투메구(아스티아게스)가 안샨의 왕 키루스를 치러 군대를 모았으나 군대가 반란을 일으켜 그를 키루스에게 넘겼고 키루스가 엑바타나로 가서 은과 금을 가져왔다고 적는다. 헤로도토스는 아스티아게스의 꿈과 외손자 키루스의 성장, 하르파고스의 배신 이야기를 전하지만 이는 전설 요소가 많아 연대기와 구분해야 한다(1.107~130). 키루스는 메디아의 땅을 물려받아 안샨과 메디아를 합쳤고 기록은 그 뒤 그를 ‘페르시아의 왕’으로 부른다. 이로써 기원전 615년 무렵부터 시작된 메디아 왕국은 끝나고, 수사를 포함한 엘람 지역도 이 무렵 새 제국의 영향권에 들어간 것으로 보며, 엘람과 수사를 얻은 때를 기원전 540년 무렵으로 적는 서술도 있어 정확한 시기에는 학설이 갈린다. 키루스는 이어 리디아를 정복하고 바빌로니아를 무너뜨린다(「키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)」, 뒤의 사건). 키루스의 조상 테이스페스, 키루스 1세, 캄비세스 1세가 실제로 얼마나 독립적인 왕이었는지, 키루스 원통의 계보를 어디까지 믿을지는 학설이 갈린다."
  subjects: [anshan-kingdom, media-kingdom, elam-neo-elamite, neo-babylonian-empire]
  tags: [politics, war]
  sources: ["Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (Routledge, 2007)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, Eisenbrauns, 2002)", "Matthew W. Waters, Ancient Persia: A Concise History of the Achaemenid Empire, 550–330 BCE (Cambridge University Press, 2014)", "Herodotus(헤로도토스), Historiai(『역사』) 1.107~130 (A. D. Godley 영역, Loeb, 1920~1925)", "Matthew W. Waters, A Survey of Neo-Elamite History (State Archives of Assyria Studies 12, Neo-Assyrian Text Corpus Project, 2000)"]
