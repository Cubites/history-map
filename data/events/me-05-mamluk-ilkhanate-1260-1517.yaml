# 서아시아·북아프리카 사건 5차 묶음(me-05): 맘루크 술탄국, 일 칸국과 그 뒤의 이란 왕조들, 티무르·투르크멘 왕조, 마린·하프스·와타스, 라술·타히르 (1260 ~ 1517)
# 범위: 아인 잘루트와 바이바르스, 맘루크 체제와 카이로의 아바스 칼리프, 칼라운의 시리아 해안 장악, 안나시르 무함마드, 바르쿠크와 부르지 맘루크, 바르스베이, 카이트바이,
#   칸수 알가우리와 맘루크의 끝, 마라게 천문대와 『집사』, 아바카에서 바이두까지, 가잔·울제이투·아부 사이드와 일 칸국의 해체, 무자파르·인주, 잘라이르·초바니,
#   사르바다르·토가 테무르·바반드, 티무르의 흥기와 이란·이라크·시리아 원정, 샤 루흐와 울루그 베그, 카라코윤루와 아크코윤루, 무샤샤, 알모하드의 끝과 마린 왕조,
#   아부 알하산·아부 이난, 하프스의 절정, 이븐 바투타와 이븐 할둔, 와타스, 동아라비아의 알하사, 예멘의 라술·타히르, 흑사병과 이집트·시리아.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1260~1517년 지도에서 생기거나 끝난 항목과 1만 km²(주변 등급 땅은 5만 km²)를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   긴 과정은 한 사건에 여러 왕조를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 이 시대 서아시아와 직접 닿는 한국 항목은 없어 subjects로 잇지 않았다. 고려의 원 간섭기와 같은 때 일 칸국은 원과 사절·학자·기술자를 주고받았다.
#   유럽·중국 파일의 십자군 국가의 끝(안티오크~아크레)·일 칸국의 쇠퇴·티무르와 토크타미시·앙카라 전투·흑사병·세우타·살라도·오스만-맘루크 전쟁·키프로스·셀림 1세의 맘루크 정복은
#   다시 쓰지 않고 「제목」으로 가리켰다. 바그다드 함락(1258)은 앞 묶음, 사파비 왕조의 성립(1501)과 오스만의 이집트 주 편성은 다음 묶음의 몫이다.
# 날짜: 1582년 전이라 율리우스력이다. 히즈라력은 양력 해로 바꾸어 적었고 확실하지 않은 날짜는 '무렵'이나 '께', 해가 사료마다 갈리는 일은 갈린다고 밝혔다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서의 굳은 표기(칼라운·가잔·티무르)를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며, 지명은 지금도 쓰는 이름은 지금 나라 말(카이로·다마스쿠스·타브리즈·페스),
#   옛 도시는 굳은 표기(안티오크·아크레·술타니예). 나라 이름은 항목 이름을 따랐다. 몽골 인물은 저장소 꼴(훌라구·멩구 테무르)로 맞췄다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음).
#   병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 피정복민·소수자와 종파 서술은 한쪽 입장만 따르지 않고 전승과 학설을 구분했다.

- id: ain-jalut-1260
  year: 1260
  endYear: 1277
  title:
    ko: "아인 잘루트 전투와 바이바르스의 맘루크 술탄국(1260~1277)"
  summary:
    ko: "바그다드를 무너뜨린 훌라구(「훌라구의 서정과 바그다드 함락(1256~1258)」, 앞의 사건)는 1259년 가을 시리아로 군대를 돌렸다. 킬리키아 아르메니아의 왕 헤툼 1세도 몽골 편에 가담했다. 1260년 1월 알레포가, 3월 다마스쿠스가 몽골 손에 들어갔고 시리아 아이유브의 마지막 대군주 안나시르 유수프는 달아나다 붙잡혀 죽었다. 대칸 몽케의 죽음 소식(1259)과 목초지 문제로 훌라구가 주력을 이끌고 아제르바이잔으로 물러나자 장군 키트부카가 소수 병력과 남았다. 이집트의 맘루크 술탄 쿠투즈는 항복을 요구한 몽골 사절을 처형하고 바이바르스가 이끈 선봉과 함께 시나이를 넘어 1260년 9월 3일 갈릴리의 아인 잘루트에서 키트부카의 군을 꺾었다. 키트부카는 전사했으나 몽골은 1260년 말에도 시리아에 들어왔으므로 이 싸움이 몽골의 서진을 곧바로 끊은 것은 아니다. 쿠투즈는 카이로로 돌아오던 길에 살해되었고 바이바르스가 1260년 10월 술탄이 되었다. 바이바르스는 1261년 바그다드에서 살아남은 아바스 가문의 알무스탄시르를 카이로로 맞아 칼리프로 세워 자신의 정권에 종교적 정당성을 더했다. 알무스탄시르는 같은 1261년 11월 바그다드 탈환에 나섰다가 유프라테스 강가 안바르 부근에서 몽골군에 죽었고, 1262년 알하킴 1세가 카이로에서 칼리프로 세워졌다. 1262년 모술에서는 몽골에 맞서 반란을 일으킨 루울루 정권의 알살리흐 이스마일이 포위 끝에 무너졌다. 몽골과 맞서던 킵차크 칸국의 베르케는 바이바르스와 사절을 주고받으며 훌라구의 일 칸국을 협공할 길을 텄다. 바이바르스는 1263년 카라크, 1268년 안티오크 등 시리아 해안과 내륙의 요새를 차지했고(「안티오크 함락(1268)에서 아크레 함락(1291)까지: 십자군 국가의 해안 거점 상실」, 같은 시기의 사건), 1277년 4월 아나톨리아의 엘비스탄에서 일 칸국군을 물리친 뒤 7월 다마스쿠스에서 죽었다."
  subjects: [mamluk-sultanate, ayyubid-dynasty, ilkhanate, lulu-dynasty, cilician-armenia, golden-horde, mongol-empire]
  tags: [war, politics]
  sources: ["Reuven Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (Cambridge University Press, 1995)", "Peter M. Holt, The Age of the Crusades: The Near East from the Eleventh Century to 1517 (Longman, 1986)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)"]
  places: [{ name: 아인 잘루트 전투, at: [35.38, 32.56], year: 1260 }]

- id: mamluk-system-1261
  year: 1261
  endYear: 1517
  title:
    ko: "맘루크 체제의 짜임: 노예 군인과 이크타, 카이로의 아바스 칼리프(1261~1517)"
  summary:
    ko: "맘루크는 어린 나이에 사들인 뒤 군사 교육을 받고 해방되어 군인이 된 노예 출신 병사를 뜻한다. 이집트·시리아의 맘루크 술탄국에서는 이 군인 집단이 곧 지배층이어서 술탄은 대개 에미르들의 추대로 올랐고, 아들이 이을 때도 이 지지가 필요했으므로 왕조가 혈통으로 오래 이어지기 어려웠다. 1250년부터 1382년까지를 바흐리 맘루크 시기, 그 뒤 1517년까지를 부르지 맘루크 시기라 부른다. 바흐리 쪽은 킵차크 초원 출신 튀르크계가, 부르지 쪽은 캅카스의 체르케스인이 많았다고 하며, 흑해와 캅카스에서 온 노예는 제노바·베네치아 상인 같은 상인의 손을 거쳐 공급되었다. 이들은 카이로 성채의 병영에서 교육받았고 보수로 농촌의 세수를 나누어 받는 이크타를 배정받았다. 이크타는 세습되지 않고 다시 배정되어 술탄이 군인을 다스리는 수단이었으나, 병사가 늘고 흑사병(1347년 이후)으로 농민이 줄자 세수가 모자라 새 세금과 몰수가 거듭되었다. 카이로에는 1261년부터 아바스 가문의 칼리프가 있었다. 이들은 실권이 없었으나 술탄에게 임명장을 내려 통치의 정당성을 주는 상징이었고, 이 계승은 1517년 오스만이 카이로를 차지하며 끝났다. 술탄들은 메카와 메디나를 보호한다는 명분을 앞세워 순례길과 히자즈의 메카 샤리프국을 후견했다. 이집트의 콥트 교회 신자와 유대인 공동체는 인두세를 내며 서기와 의사로 일하기도 했으나, 14세기 초에는 이집트에서 교회가 닫히거나 헐리는 일도 있었다. 맘루크의 아들(아울라드 알나스)은 아버지와 달리 노예로 자라지 않은 자유인이어서 높은 군직에 오르기 어려웠고, 군인 신분은 대를 이어 물려주기 쉽지 않았다."
  subjects: [mamluk-sultanate, sharifate-of-mecca]
  tags: [politics, society, religion]
  sources: ["David Ayalon, Studies on the Mamluks of Egypt (1250–1517) (Variorum Reprints, 1977)", "Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "Michael W. Dols, The Black Death in the Middle East (Princeton University Press, 1977)"]

- id: maragha-jami-1262
  year: 1262
  endYear: 1311
  title:
    ko: "마라게 천문대와 『집사』: 일 칸국의 학문(1262~1311)"
  summary:
    ko: "훌라구는 1259년 이란 북서부 마라게에 천문대를 세우라고 명했고 책임을 천문학자 나시르 앗딘 투시에게 맡겼다. 투시는 니자르 이스마일파 성채에 머물다 1256년 훌라구를 섬기게 된 학자이다. 천문대는 1262년께부터 쓰였고 투시 아래 이란·시리아·중국 쪽에서 모인 학자들이 관측해 1272년께 『일 칸의 천문표』를 엮었다. 이 천문표와 투시가 행성 운동 설명에 쓴 '투시 쌍'은 뒷날 유럽 천문학과 닿았다고 보는 견해가 있으나 닿은 길은 학자마다 다르다. 마라게 천문대는 투시가 죽은 1274년 뒤로 기울었다. 투시는 윤리학과 논리학, 수학에서도 이름난 학자였고, 천문대의 터는 지금도 이란 서북부 언덕에 남아 있다. 같은 시기 일 칸국의 도읍 타브리즈에서는 라시드 앗딘이 학문을 이끌었다. 유대인 가문 출신으로 이슬람으로 개종한 의사 라시드 앗딘은 1298년께부터 재상을 지냈고, 일 칸 가잔의 명으로 몽골사를 쓰기 시작해 울제이투 때인 1307년께 『집사』의 몽골사 부분을 바쳤다. 『집사』는 1311년 무렵 중국·인도·프랑크·유대 등 세계 여러 사회의 역사를 아우르는 책으로 넓어졌고, 이는 몽골 제국이 이어 놓은 유라시아 교류가 있어 가능했다. 라시드 앗딘은 타브리즈 동쪽에 '라브이 라시디'라는 학문 구역을 두고 필사실과 도서관, 병원을 갖추었다고 한다. 라시드 앗딘은 『집사』를 아랍어와 페르시아어 두 판으로 해마다 베껴 여러 도시에 두게 했다고 전한다. 그의 최후는 「아부 사이드와 일 칸국의 해체(1316~1335)」(뒤의 사건)에 있다. 학자들이 몽골 궁정의 후원을 받아 천문·역사·의학을 발전시킨 이 시기는 이란 문화가 몽골의 정복 뒤 다시 꽃핀 때로 꼽힌다."
  subjects: [ilkhanate]
  tags: [culture, politics]
  sources: ["George Saliba, Islamic Science and the Making of the European Renaissance (MIT Press, 2007)", "Sheila S. Blair, A Compendium of Chronicles: Rashid al-Din's Illustrated History of the World (Nour Foundation·Oxford University Press, 1995)", "라시드 앗딘, 『집사』 (영역: Jami'u't-tawarikh: Compendium of Chronicles, Wheeler M. Thackston 옮김, Harvard University Department of Near Eastern Languages and Civilizations, 1998~1999)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)"]

- id: ilkhanate-abaqa-1265
  year: 1265
  endYear: 1295
  title:
    ko: "일 칸국의 정비: 아바카에서 아르군·가이하투·바이두까지(1265~1295)"
  summary:
    ko: "훌라구가 1265년 2월 죽자 아들 아바카가 이어받았다. 아바카는 북쪽의 킵차크 칸국 베르케 쪽 군대와 캅카스에서 맞섰고, 1270년 헤라트에서는 동쪽 차가타이 칸국의 바라크를 꺾었다. 서쪽에서는 로마 교황청과 서유럽 군주들에게 맘루크에 맞서는 동맹을 거듭 제안했으나 뜻을 이루지 못했고, 1277년 엘비스탄의 패배와 1281년 10월 홈스에서 동생 멩구 테무르가 이끈 군의 패배로 시리아 진출은 막혔다. 내정에서는 이란 출신 관료 가문의 아타말리크 주바이니가 바그다드를, 그의 형 샴스 앗딘 주바이니가 재정을 맡았다. 살구르 왕조의 마지막 여군주 압이슈 하툰이 훌라구의 아들 멩구 테무르와 혼인한 뒤 파르스는 일 칸국에 더 단단히 묶여 직할지에 가까워졌다(살구르 왕조의 끝을 1282년 무렵으로 보는 견해와 압이슈 하툰이 죽은 1286년으로 보는 견해가 있다). 아바카는 1282년 4월 죽었다. 아들 아르군을 제치고 칸이 된 동생 아흐마드 테구데르는 이슬람으로 개종한 첫 일 칸이었으나 맘루크와 화해하려다 칭기즈 칸 일가와 몽골 군인들의 반감을 샀고 1284년 아르군에게 밀려나 죽었다. 아르군은 1286년 원의 대칸 쿠빌라이의 승인을 받았다. 그는 불교를 가까이하고 유대인 의사 출신 재상 사드 앗다울라를 썼으나, 사드 앗다울라는 1291년 아르군이 죽을 무렵 처형되었다. 아르군이 1287~1288년 네스토리우스파 수도사 랍반 바르 사우마를 유럽에 보낸 일도 맘루크 협공을 노린 외교였다. 그 뒤 가이하투(1291~1295)가 지폐를 시험하다 경제를 어지럽혔고(「중통초와 지원초: 원의 지폐 제도(1260~1294)」, 앞의 사건) 바이두가 1295년 잠깐 앉았다가 가잔에게 무너졌다."
  subjects: [ilkhanate, salghurid-dynasty, mamluk-sultanate, golden-horde, yuan]
  tags: [politics, diplomacy, war]
  sources: ["Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Reuven Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (Cambridge University Press, 1995)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: almohad-end-1269
  year: 1269
  endYear: 1274
  title:
    ko: "알모하드의 끝과 마린 왕조의 마라케시 점령(1269~1274)"
  summary:
    ko: "알모하드 칼리프국은 1212년 라스 나바스 데 톨로사 패전 뒤 이베리아 영토와 내부 결속을 잃어 갔고, 모로코 동부 초원에서 올라온 자나타계 베르베르 유목민 마린 가문이 페스를 차지한 1248년 뒤 마라케시 둘레의 좁은 땅으로 줄어들었다. 마라케시만 쥐고 있던 알모하드의 마지막 칼리프 이드리스 알와티크(아부 다부스)는 1269년 죽었고, 경위는 노예에게 살해되었다는 설과 마린에게 처형되었다는 설로 갈린다. 마린의 술탄 아부 유수프 야쿱(재위 1258/1259~1286)이 1269년 마라케시를 차지했고, 이로써 1147년 마라케시를 차지하며 시작된 알모하드 지배가 끝났다. 아부 유수프 야쿱은 1271년 무렵 드라아 골짜기를 복속시켰고 1273~1274년 무렵 탕헤르와 시질마사(타필랄트)까지 지배를 넓혔다고 전한다. 마린은 페스를 도읍으로 삼아 모로코 북부를 근거로 했고, 1274년 무렵에야 사하라 상업로의 북쪽 끝 도시 시질마사에 닿았다. 페스에는 1271년 알사파린 마드라사가 세워지는 등 마린의 마드라사 건축이 시작되었다. 동쪽 틀렘센의 자이얀 왕조(야그무라센, 재위 1236~1283)는 마린과 거듭 싸우면서도 독립을 지켰다. 1270년에는 튀니스의 하프스 왕조는 프랑스 왕 루이 9세의 십자군을 맞았으나 왕이 병으로 죽자 조약을 맺어 철수하게 했다(「루이 9세와 파리 조약(1259): 프랑스 왕권의 확대와 알퐁스의 툴루즈」, 앞의 사건). 마린은 알모하드와 달리 칼리프를 칭하지 않고 술탄·아미르 알무슬리민 같은 칭호를 쓰며 이베리아의 이슬람 세력을 돕겠다는 명분을 앞세웠다. 알모하드가 물러난 뒤 이베리아에서는 카스티야와 아라곤이 레콩키스타를 이어 갔고, 그라나다의 나스르 왕조만 남아 마린과 카스티야 사이에서 균형을 잡으려 했다."
  subjects: [almohads, marinid-sultanate, zayyanid-kingdom, hafsid-sultanate]
  tags: [politics, war]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Maya Shatzmiller, The Berbers and the Islamic State: The Marinid Experience in Pre-Protectorate Morocco (Markus Wiener, 2000)", "이븐 할둔, 『베르베르인의 역사』", "이븐 할둔, 『이바르의 책』"]

- id: qalawun-crusader-coast-1279
  year: 1279
  endYear: 1293
  title:
    ko: "칼라운과 알아슈라프 칼릴: 맘루크의 시리아 해안 장악(1279~1293)"
  summary:
    ko: "바이바르스가 1277년 죽은 뒤 아들 바라카 칸(재위 1277~1279)과 어린 살라미시(1279)가 잇따라 에미르들에게 밀려났고, 1279년 11월 에미르 칼라운이 술탄에 올랐다. 칼라운(재위 1279~1290)은 다마스쿠스의 반란 총독 순쿠르 알아슈카르를 누르고 1281년 10월 홈스에서 일 칸 아바카의 동생 멩구 테무르가 이끈 몽골군과 킬리키아 아르메니아·조지아 지원군을 꺾었다(몽골 쪽 병력은 맘루크 사료에 훨씬 크게 적혀 있다). 그는 1285년 병원 기사단의 마르카브 성채를, 1287년 라타키아를 차지했다. 1289년 4월 칼라운은 트리폴리 백국의 도시 트리폴리를 한 달 가까이 포위한 끝에 함락해 백국을 없앴다. 도시는 불타 폐허가 되었고 맘루크는 몇 킬로미터 안쪽에 새 트리폴리를 세웠다. 칼라운은 1290년 11월 아크레 원정을 준비하다 죽었고 아들 알아슈라프 칼릴(재위 1290~1293)이 1291년 4월 6일부터 5월 18일까지 아크레를 포위해 함락했다. 도시 주민 상당수가 죽거나 포로가 되었고, 티레·시돈·베이루트 등은 그해 안에 항복하거나 버려져 예루살렘 왕국의 본토 거점이 모두 사라졌다(십자군 쪽 경과는 「안티오크 함락(1268)에서 아크레 함락(1291)까지: 십자군 국가의 해안 거점 상실」, 앞의 사건). 맘루크는 해안 도시의 성벽을 헐어 십자군이 다시 상륙하지 못하게 했다. 칼릴은 1292년 유프라테스 가의 아르메니아 총대주교 거처 흐롬클라를 차지했으나 1293년 12월 에미르들에게 살해되었다. 칼라운은 카이로에 병원과 마드라사, 영묘를 이은 큰 복합 건물(1284~1285)을 세웠고, 이 가문은 그 뒤에도 술탄 자리를 이었다."
  subjects: [mamluk-sultanate, tripoli-county, jerusalem-kingdom, ilkhanate, cilician-armenia]
  links:
    - { from: mamluk-sultanate, to: tripoli-county, note: "트리폴리 함락 (1289)" }
    - { from: mamluk-sultanate, to: jerusalem-kingdom, note: "아크레 함락 (1291)" }
  tags: [war, politics]
  sources: ["Peter M. Holt, The Age of the Crusades: The Near East from the Eleventh Century to 1517 (Longman, 1986)", "Reuven Amitai-Preiss, Mongols and Mamluks: The Mamluk-Ilkhanid War, 1260–1281 (Cambridge University Press, 1995)", "Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)", "알마크리지, 『왕조들을 아는 길』"]

- id: nasir-muhammad-1293
  year: 1293
  endYear: 1341
  title:
    ko: "안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341)"
  summary:
    ko: "1293년 12월 알아슈라프 칼릴이 살해된 뒤 에미르 바이다라가 술탄을 칭했으나 곧 에미르들에게 살해되었고, 에미르들은 칼라운의 어린 아들 안나시르 무함마드를 맘루크 술탄국의 술탄으로 세웠으나 실권은 섭정 에미르들이 쥐었다. 1294년 에미르 키트부가가 그를 밀어내고 스스로 술탄이 되었고(1294~1296), 이어 라진(1296~1299)이 올랐다가 살해되자 1299년 안나시르가 복위했다. 두 번째 재위(1299~1309)에도 실권은 살라르와 바이바르스 알자시니키르 같은 에미르들에게 있었고, 안나시르는 1309년 스스로 물러나 카라크에 머물렀다. 바이바르스 알자시니키르의 짧은 통치(1309~1310)를 거쳐 1310년 에미르들이 그를 다시 불러들이면서 세 번째 재위(1310~1341)가 시작되었다. 이때부터 안나시르는 나이 든 에미르들을 눌러 직접 다스렸다. 그는 1313~1325년 무렵 이집트와 시리아의 토지를 다시 측량(라우크 알나시리)해 이크타를 다시 배정했고, 운하와 수로를 정비하고 카이로에 많은 건물을 세웠다. 1322년 무렵(1323년설도 있음) 일 칸 아부 사이드와 화약을 맺어 1260년부터 이어진 일 칸국과의 전쟁을 끝냈다(「아부 사이드와 일 칸국의 해체(1316~1335)」, 뒤의 사건). 킵차크 칸국의 우즈베크 칸과는 혼인으로 손잡고 흑해에서 오는 노예 군인 공급을 이었다. 1317년에는 누비아 동골라 왕국의 왕권이 이슬람 쪽 인물에게 넘어갔고, 1337년에는 킬리키아 아르메니아의 항구 아야스를 차지했다. 안나시르가 1341년 죽은 뒤에도 그의 아들과 손자 여럿이 술탄 자리를 이었으나 대개 에미르들의 허수아비였다."
  subjects: [mamluk-sultanate, ilkhanate, cilician-armenia, golden-horde]
  tags: [politics, society]
  sources: ["Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "Reuven Amitai, Holy War and Rapprochement: Studies in the Relations between the Mamluk Sultanate and the Mongol Ilkhanate (1260–1335) (Brepols, 2013)", "알마크리지, 『왕조들을 아는 길』"]

- id: ghazan-1295
  year: 1295
  endYear: 1304
  title:
    ko: "가잔의 개종과 개혁: 일 칸국의 이슬람화와 맘루크 전쟁(1295~1304)"
  summary:
    ko: "1295년 3월 가이하투가 살해되고 바이두가 칸위를 이었다. 훌라구의 증손으로 호라산 총독이던 가잔은 에미르 나우루즈의 지지를 얻어 1295년 6월 이슬람으로 개종했고, 같은 해 10월 바이두를 눌러 일 칸이 되었다. 개종 직후 나우루즈의 주도로 불교 사원과 교회, 유대 교당이 훼손되었으나 가잔은 1297년 나우루즈를 처형한 뒤 비무슬림 공동체를 다시 보호하겠다고 했다. 가잔은 재상 라시드 앗딘과 함께 세금 징수를 규칙화하고, 군인에게 땅의 수입을 나누는 방식(이크타)을 손보고, 도량형과 화폐를 통일하고, 역참을 정비했다. 이 개혁은 유목 군인의 약탈과 징세의 폐단에서 농민을 지키려는 목적을 내세웠다(라시드 앗딘의 학문은 「마라게 천문대와 『집사』: 일 칸국의 학문(1262~1311)」, 앞의 사건). 가잔은 맘루크에 대한 군사 행동도 이었다. 1299년 12월 말 홈스 가까운 와디 알하즈나다르에서 킬리키아 아르메니아·조지아 군의 도움을 받아 맘루크군을 물리쳤고 1300년 1월 다마스쿠스에 들어갔으나, 목초가 모자라고 병사가 흩어지자 몇 달 뒤 물러났다. 1303년 4월 가잔이 보낸 몽골군이 다마스쿠스 남쪽 마르즈 알사파르에서 안나시르 무함마드의 맘루크군에 크게 졌다(「안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341)」, 앞의 사건). 맘루크 학자 이븐 타이미야는 몽골인의 개종이 겉일 뿐이며 야사(칭기즈 칸의 법)를 따르는 군주를 진정한 무슬림 군주로 볼 수 없다는 파트와를 내렸다. 가잔은 타브리즈 근처에 샨브 가잔이라는 건물 단지를 짓고 자신의 영묘로 삼았다. 이슬람 의례를 따르면서도 몽골의 군사 관습은 이어서, 이후 일 칸국의 궁정은 이슬람과 몽골 전통이 섞인 모습이 되었다. 가잔은 1304년 5월 카즈빈 근처에서 죽었다."
  subjects: [ilkhanate, mamluk-sultanate, cilician-armenia]
  tags: [politics, religion, war]
  sources: ["Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "라시드 앗딘, 『집사』 (영역: Jami'u't-tawarikh: Compendium of Chronicles, Wheeler M. Thackston 옮김, Harvard University Department of Near Eastern Languages and Civilizations, 1998~1999)", "Reuven Amitai, Holy War and Rapprochement: Studies in the Relations between the Mamluk Sultanate and the Mongol Ilkhanate (1260–1335) (Brepols, 2013)"]

- id: marinid-tlemcen-1299
  year: 1299
  endYear: 1307
  title:
    ko: "마린 왕조의 틀렘센 포위와 알만수라(1299~1307)"
  summary:
    ko: "마린 왕조의 술탄 아부 야쿱 유수프(재위 1286~1307)는 아버지 아부 유수프 야쿱의 뒤를 이은 군주로, 1299년 틀렘센을 에워쌌다. 틀렘센은 자이얀 왕조의 도읍으로 사하라 이남으로 가는 대상로와 지중해 항구를 잇는 마그레브 중부의 요지였다. 마린 군은 성 밖에 알만수라('승리한 도시')라는 군영 도시를 세우고 8~9년 동안 틀렘센을 압박했으며, 에워싸인 틀렘센의 곡식값이 크게 올랐다고 한다. 틀렘센의 자이얀 군주 아부 사이드 우스만 1세는 1303년(1304년설도 있음) 죽고 아들 아부 자이얀 무함마드 1세(재위 1303~1308)가 이었으나 도성은 버텼다. 1307년 5월 아부 야쿱이 군영에서 환관에게 살해되고 아부 타비트가 즉위하자 마린 군은 포위를 풀었고, 알만수라는 버려졌다. 마린은 틀렘센을 끝내 차지하지 못했지만 이 오랜 포위는 두 왕조의 힘을 갉아먹었다. 마린은 1306년 무렵 남쪽 수스 지방까지 지배를 넓힌 것으로 본다. 틀렘센 서쪽에는 알만수라 모스크의 미나레트 일부가 지금도 남아 있다. 마린 왕조는 뒤에 아부 알하산 때(「아부 알하산의 마그레브 통일 시도: 틀렘센·살라도·튀니스(1331~1351)」, 뒤의 사건) 틀렘센을 차지한다. 자이얀 왕조는 알모하드가 약해진 틈에 야그무라센이 1236년 세운 나라로, 마린과 같은 자나타계 베르베르 부족 연합 출신이었다. 틀렘센은 마린과 하프스 사이에서 조공과 동맹으로 독립을 이어 가는 완충 국가였고, 이 때문에 마린에게는 늘 걸림돌이었다. 이 포위는 마린이 마그레브 중부로 나아가려는 가장 길고 큰 시도로 꼽히지만, 틀렘센은 높은 성벽과 대상 무역으로 모은 재물에 기대어 버텼다고 전한다. 포위 동안 마린 군영 둘레에는 시장과 모스크, 목욕탕까지 갖춘 도시가 생겼다고 한다."
  subjects: [marinid-sultanate, zayyanid-kingdom]
  tags: [war, politics]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Maya Shatzmiller, The Berbers and the Islamic State: The Marinid Experience in Pre-Protectorate Morocco (Markus Wiener, 2000)", "이븐 할둔, 『베르베르인의 역사』", "이븐 할둔, 『이바르의 책』"]

- id: oljeitu-sultaniyya-1304
  year: 1304
  endYear: 1316
  title:
    ko: "울제이투와 술타니예: 새 도읍과 종교 정책(1304~1316)"
  summary:
    ko: "가잔이 1304년 5월 아들 없이 죽자 동생 울제이투(본명 무함마드 호다반다)가 일 칸위를 이었다. 울제이투는 어린 시절 불교와 기독교 세례를 거쳐 이슬람에 이르렀다고 전하며, 수니파 쪽 법학파들 사이를 오가다가 1309~1310년께 시아파 열두 이맘파로 기울었다고 한다. 시아 신학자 알라마 알힐리를 궁정에 불러 가까이 두었고, 이 일로 수니파 학자와 무슬림 관료 사이에 불화가 일었다. 그는 1306년 무렵 이란 북서부 술타니예('군주의 도시')를 새 도읍으로 삼아 짓기 시작했다. 아르군이 터를 잡았다고 전하는 이 도시에서 울제이투의 영묘(1302~1312년께 지음)는 벽돌 돔의 지름이 25미터에 이르는 이란 건축의 걸작으로 꼽힌다. 1306년 울제이투는 케르만의 쿠틀루그 칸 왕조 군주를 물러나게 하고 총독을 보내 케르만을 직할로 삼았다. 이로써 쿠틀루그 칸 왕조가 끝났다고 본다. 1305~1306년 무렵 차가타이 칸국 등 다른 몽골 칸국과 화약을 맺었고, 1306~1307년에는 헤라트의 카르트 가문을 누르고 카스피해 남서쪽 길란으로 군대를 보냈다. 1312년 시리아의 라하바 요새를 공략했으나 얻지 못했고 맘루크 정복의 꿈은 이루지 못했다. 재상 라시드 앗딘은 『집사』를 마무리하고 타브리즈에 학문 구역을 키웠다. 울제이투는 1316년 12월 술타니예에서 서른 중반으로 죽었고 열한 살 남짓한 아들 아부 사이드가 이었다. 울제이투라는 이름은 몽골어로 ‘축복받은’이라는 뜻이라고 한다. 술타니예는 타브리즈에서 카즈빈으로 이어지는 큰길 가에 있어 여름 목초지와 가까웠고, 몽골 군주의 이동 궁정 전통을 이은 도읍이었다. 그의 궁정에서는 페르시아어와 아랍어, 튀르크어, 몽골어를 쓰는 학자들이 함께 일했고 천문과 의학, 역사 편찬이 이어졌다."
  subjects: [ilkhanate, qutlugh-khanid-dynasty, mamluk-sultanate]
  tags: [politics, religion, culture]
  sources: ["Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "라시드 앗딘, 『집사』 (영역: Jami'u't-tawarikh: Compendium of Chronicles, Wheeler M. Thackston 옮김, Harvard University Department of Near Eastern Languages and Civilizations, 1998~1999)"]

- id: muzaffarid-rise-1314
  year: 1314
  endYear: 1358
  title:
    ko: "무자파르 왕조의 흥기와 인주 왕조의 끝(1314~1358)"
  summary:
    ko: "무자파르 왕조는 일 칸국의 가신이던 샤라프 앗딘 무자파르가 야즈드 근처 마이부드의 총독이 된 1314년께 시작되었다. 그의 아들 무바리즈 앗딘 무함마드는 1319년 무렵 야즈드의 아타벡을 몰아내고 도시를 차지해 사실상 왕조를 세웠다. 1335년 일 칸 아부 사이드가 죽은 뒤 파르스에서는 일 칸국의 황실 영지(인주)를 관리하던 마흐무드 샤 인주가 자립해 인주 왕조를 세웠고, 이 왕조는 시라즈를 도읍 삼았다. 초바니 왕조의 피르 후사인이 1339~1342년 시라즈를 쥔 동안 인주의 아부 이스하크는 쫓겨났다가 되찾았고, 1340년대 이스파한까지 차지했다. 한편 무바리즈 앗딘 무함마드는 1339~1340년 케르만을 차지하고 이어 파르스로 나아갔다. 1353년 시라즈 전투에서 아부 이스하크를 꺾어 파르스를 얻었으며, 1356~1357년 무렵 이스파한까지 차지해 도망한 아부 이스하크를 붙잡아 처형했다. 인주 왕조는 이로써 끝났다. 무바리즈 앗딘은 술집과 오락을 엄하게 금해 '감찰관(무흐타시브)'으로 불렸고, 시인 하피즈는 이 엄격함을 풍자했다고 전한다. 무바리즈 앗딘은 1358년 아들 샤 슈자에게 눈이 멀게 된 채 밀려났다. 샤 슈자(재위 1358~1384, 중간 1364~1366년은 형제 샤 마흐무드가 쥠)는 시라즈를 중심으로 왕조를 이끌며 시와 서예를 후원했다. 인주 왕조와 무자파르 왕조 아래 시라즈에서 활동한 하피즈(1325/1326년께~1389년께)는 『디반』으로 이란 서정시의 정점을 이루었다. 무자파르 가문은 호라산에서 이란 중부로 옮겨 온 아랍계 집안이라고 전하나 이는 가문의 주장일 가능성이 있다. 무바리즈 앗딘은 서예와 건축을 지원해 시라즈에 모스크를 세우거나 고쳤다고 전한다."
  subjects: [muzaffarid-dynasty, injuid-dynasty, ilkhanate, chobanid-dynasty]
  tags: [politics, war, culture]
  sources: ["The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Charles Melville, The Fall of Amir Chupan and the Decline of the Ilkhanate, 1327–37: A Decade of Discord in Mongol Iran (Indiana University Research Institute for Inner Asian Studies, 1999)", "Encyclopaedia Iranica, 'Muzaffarids' 항목 (www.iranicaonline.org)"]

- id: abu-said-ilkhanate-end-1316
  year: 1316
  endYear: 1335
  title:
    ko: "아부 사이드와 일 칸국의 해체(1316~1335)"
  summary:
    ko: "울제이투가 죽은 뒤 열한 살 남짓한 아들 아부 사이드가 1316년 말 일 칸에 올랐고, 실권은 에미르 초반이 쥐었다. 1318년 재상 라시드 앗딘이 울제이투를 독살했다는 모함을 받아 처형되었다(「마라게 천문대와 『집사』: 일 칸국의 학문(1262~1311)」, 앞의 사건). 1320년대 아부 사이드는 성년이 되자 초반 일가를 눌렀다. 1327년 초반의 아들 데마스크 카자를 처형했고, 호라산으로 달아난 초반도 1327년 가을 헤라트에서 그곳 카르트 가문의 군주에게 처형되었다. 이 일로 초반 가문은 몰락했으나 훗날 손자 하산 쿠첵이 초바니 왕조를 세운다(「잘라이르 술탄국과 초바니 왕조: 타브리즈와 바그다드(1335~1374)」, 뒤의 사건). 한편 1322년 무렵 아부 사이드는 맘루크의 안나시르 무함마드와 화약을 맺어 1260년부터 이어진 전쟁을 끝냈다(조약이 체결된 해를 1323년으로 보는 견해도 있다). 이 무렵 이란 서부와 이라크는 잘라이르 가문의 에미르 하산 부주르그 같은 에미르들이 세력을 키웠고, 야즈드에서는 훗날 무자파르 왕조를 세울 무바리즈 앗딘이 힘을 얻었다(「무자파르 왕조의 흥기와 인주 왕조의 끝(1314~1358)」, 앞의 사건). 아부 사이드는 1335년 11월 후계자 없이 죽었다. 재상 기야스 앗딘이 칭기즈 칸의 후손 아르파 케운을 칸으로 세웠으나 칸국은 이미 에미르들 손에 갈라져 있었고, 이후의 허수아비 칸들은 에미르들의 다툼 속에서 오갔다. 아나톨리아와 캅카스에서 같은 시기에 일어난 일은 「일 칸국의 쇠퇴와 조지아의 재통일, 에레트나·둘카디르 베이국」(뒤의 사건)에 있다. 칸국이 무너진 이유로는 후계자가 없었다는 점 외에 칸의 권력이 에미르 부족 연합에 기대어 있던 구조와 몽골 군인과 정주 지역 관료 사이의 틈을 드는 연구가 많다."
  subjects: [ilkhanate, mamluk-sultanate, jalayirid-sultanate, muzaffarid-dynasty]
  tags: [politics, diplomacy]
  sources: ["Charles Melville, The Fall of Amir Chupan and the Decline of the Ilkhanate, 1327–37: A Decade of Discord in Mongol Iran (Indiana University Research Institute for Inner Asian Studies, 1999)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 5: The Saljuq and Mongol Periods (J. A. Boyle 편, Cambridge University Press, 1968)", "Reuven Amitai, Holy War and Rapprochement: Studies in the Relations between the Mamluk Sultanate and the Mongol Ilkhanate (1260–1335) (Brepols, 2013)"]

- id: alhasa-1320
  year: 1320
  endYear: 1417
  title:
    ko: "동아라비아 알하사: 우스푸르에서 자르완·자브르로(1320~1417)"
  summary:
    ko: "아라비아 동부의 알하사 오아시스와 카티프 해안은 대추야자 농사와 바레인 해역의 진주잡이로 이름난 땅이었다. 우스푸르 이븐 라시드가 세운 우스푸르 왕조(1253~1320)는 아랍 우카일 가문의 갈래로, 1253년께 카르마트의 뒤를 이은 우윤 왕조를 무너뜨리고 알하사를 도읍으로 동아라비아와 바레인 제도를 다스렸다. 우스푸르 왕조의 끝은 자료마다 1320년과 1392년으로 갈리는데, 아랍 사료는 우스푸르군이 1354년께 바스라를 쳐 몽골군을 물리쳤으나 잘라이르의 하산 부주르그가 타이 부족장 파와즈 이븐 무한나의 도움을 얻어 이들을 바스라에서 몰아냈다고 전한다. 1320년 무렵 자르완 가문이 실권을 쥐어 우스푸르 왕조가 끝나고 자르완 왕조(1320~1417)가 이어졌다고 보는 설이 있다. 자르완 가문은 아랍계 바누 말리크 가문으로, 우카일 계통인지 아브드 알카이스 계통인지 학설이 갈린다. 이들은 카티프를 도읍으로 열두 이맘파 시아 학자를 법관 같은 요직에 썼고, 14세기에는 바스라를 근거로 한 무타피크 부족장 사이드 이븐 무가미스의 세력을 몰아냈다. 이븐 바투타 같은 여행자는 이들을 시아를 얕잡아 부르는 말인 라피다로 불렀고 이집트의 한 수니 학자는 카르마트의 잔재라 불렀으나, 오늘날에는 이스마일파로 보는 견해와 열두 이맘파로 보는 견해가 맞선다. 사료가 적어 자세한 경과는 확실하지 않다. 1417년 자브르 가문의 자밀이 마지막 자르완 군주를 쓰러뜨리고 알하사를 차지해 자브르 토후국(1417~1521)이 시작되었다. 자브르 토후국은 호르무즈, 이집트의 맘루크, 이란의 티무르 왕조 사이에서 부족 연합과 오아시스 농업, 진주 교역에 기댄 토후국으로 오래 이어졌다. 이 시기 알하사는 기록이 짧아 연도와 계보도 자료마다 갈린다."
  subjects: [usfurid-dynasty, jarwanid-dynasty, jabrid-emirate]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2005)"]

- id: rasulid-golden-age-1322
  year: 1322
  endYear: 1363
  title:
    ko: "라술 왕조의 전성과 자이드파·맘루크·메카의 다툼(1322~1363)"
  summary:
    ko: "라술 왕조는 아이유브 왕조의 예멘 총독이던 우마르 이븐 알리가 1229년부터 세웠고, 해안 티하마의 자비드와 고지 타이즈를 두 도읍으로 삼아 홍해와 인도양 사이의 아덴 항구 교역에서 얻은 수입으로 번영했다. 알무자히드 알리(재위 1322~1363)는 40년 넘게 다스린 술탄이었다. 북쪽 산악 지대의 자이드파 이맘국(사다)은 사나를 두고 라술 왕조와 다투었고, 사나는 1324년께 자이드파 쪽에 넘어간 것으로 본다. 알무자히드는 1349~1350년 순례차 메카에 갔다가 맘루크 군에게 붙잡혀 카이로로 끌려가 한 해 남짓 억류되었다가 풀려났다. 이 사건은 홍해 무역과 메카 샤리프국의 후견을 두고 라술 왕조와 맘루크 술탄국이 부딪힌 일이었다. 라술 왕조에는 학자 군주가 많았다. 알아슈라프 우마르 1세(재위 1295~1296)가 농업 달력을 담은 책을, 알아슈라프 이스마일 1세(재위 1377~1400/1401)가 예멘 역사서를 남겼고, 알아프달 알아바스(재위 1363~1377)도 백과사전류의 책을 썼다. 술탄들은 타이즈와 자비드에 마드라사를 세워 두 도시를 학문의 중심으로 키웠다고 한다. 라술 왕조의 세수는 티하마의 농업과 아덴 항구의 관세에서 나왔고, 아덴은 인도와 이집트를 잇는 교역로의 종착지였다. 술탄들은 맘루크와 혼인과 선물로 관계를 이었으나 메카에서 맘루크가 앞선 후견자로 행세하는 일을 경계했다. 라술이라는 이름은 아바스 칼리프의 사자(라술)였던 조상에서 왔다고 전한다. 알무자히드는 타이즈에 알무자히디야 마드라사를 세웠다고 전한다. 이 무렵 아덴에서는 인도산 직물과 향신료, 이집트로 가는 상품에 관세가 매겨졌다. 라술 왕조의 도읍 타이즈에는 알아슈라피야와 알무자파르 모스크가 지금도 남아 있다."
  subjects: [rasulid-dynasty, zaydi-imamate, mamluk-sultanate, sharifate-of-mecca]
  tags: [politics, economy, culture]
  sources: ["G. Rex Smith, Studies in the Medieval History of the Yemen and South Arabia (Variorum, 1997)", "Daniel Martin Varisco, Medieval Agriculture and Islamic Science: The Almanac of a Yemeni Sultan (University of Washington Press, 1994)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: ibn-battuta-1325
  year: 1325
  endYear: 1355
  title:
    ko: "이븐 바투타의 여행과 『여행기』(1325~1355)"
  summary:
    ko: "마린 왕조 치하의 탕헤르에서 태어난 법학자 이븐 바투타는 1325년 6월 스물한 살 무렵 메카 순례를 떠나 이집트와 시리아를 거쳐 1326년 메카에 이르렀다. 그는 이어 이라크와 이란을 돌며 일 칸 아부 사이드의 궁정을 보았고, 메카에서 몇 해를 지낸 뒤 예멘의 라술 왕조와 인도양 연안, 동아프리카 해안, 페르시아만, 아나톨리아와 흑해를 거쳐 중앙아시아와 인도 델리에 닿았으며 몰디브와 중국까지 갔다고 전한다(델리 술탄이 보낸 중국 사절단의 배가 난파해 일행이 흩어졌다고 하며, 중국 여정이 사실인지는 의심받는다). 돌아오는 길에 1348년 다마스쿠스에서 흑사병을 만났고, 1349년 페스로 돌아와 이베리아 반도의 그라나다와 사하라 이남의 말리 제국(1352~1353)까지 다녀왔다. 마린의 술탄 아부 이난은 이븐 바투타의 이야기를 글로 남기라고 명했고, 그는 안달루시아 출신 문사 이븐 주자이에게 구술해 1355년 『여행기(리흘라)』를 엮었다(1356년설도 있다). 이 책은 순례길과 수피 수도원, 맘루크의 환대, 이슬람 법관들의 연결망으로 이어진 14세기 이슬람 세계를 보여 주지만, 기억에 기댄 서술이 많아 해와 순서는 학자마다 다르게 본다. 그는 가는 곳마다 그 지역의 법관과 수피 교단의 수도원, 군주의 후원에 기대어 지냈고, 델리에서는 술탄 무함마드 이븐 투글루크 아래 법관을 몇 해 지냈다. 그가 정리한 이야기에는 14세기 몰디브와 인도, 동아프리카 해안의 풍속이 담겨 있어 지역사 연구의 귀한 자료가 된다. 그는 오랜 여행을 마치고 마린 왕조 아래에서 법관으로 지냈다고 전한다. 말리에서는 만사 술레이만의 궁정 접견과 사하라를 건너는 상인들의 교역을 기록했고, 이는 서아프리카 역사 연구의 중요한 자료이다."
  subjects: [marinid-sultanate, mamluk-sultanate, ilkhanate, rasulid-dynasty, delhi-sultanate, mali-empire]
  tags: [culture, society]
  sources: ["The Travels of Ibn Battūta, A.D. 1325–1354 (H. A. R. Gibb·C. F. Beckingham 옮김, Hakluyt Society, 1958~2000)", "Ross E. Dunn, The Adventures of Ibn Battuta: A Muslim Traveler of the 14th Century (University of California Press, 1986)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)"]

- id: marinid-abu-al-hasan-1331
  year: 1331
  endYear: 1351
  title:
    ko: "아부 알하산의 마그레브 통일 시도: 틀렘센·살라도·튀니스(1331~1351)"
  summary:
    ko: "마린 왕조의 술탄 아부 알하산(재위 1331~1348)은 모로코에서 알제리 서부, 튀니지까지 모두 쥐려 했다. 1337년 그는 틀렘센을 함락해 자이얀 왕조의 군주 아부 타슈핀 1세를 죽이고 이 왕조를 한동안 무너뜨렸다. 1340년에는 이베리아로 건너가 그라나다 에미르국과 함께 카스티야에 맞섰으나 살라도강에서 크게 졌다(「살라도 전투와 알헤시라스 점령」, 뒤의 사건). 그 뒤로 이베리아 해협을 건너는 대규모 개입은 끊겼다. 아부 알하산은 눈을 동쪽으로 돌려 1347년 튀니스의 하프스 왕조를 무너뜨리고 이프리키야를 차지했다. 그러나 1348년 4월 카이라완 가까이에서 아랍계 유목 부족들에게 크게 져 군대를 잃었고, 이 틈에 아들 아부 이난이 페스에서 스스로 술탄을 칭했다. 같은 해 흑사병이 마그레브에도 번져 군대와 도시가 흔들렸다. 아부 알하산은 틀렘센과 이프리키야를 잃고 모로코 남쪽으로 쫓겨나 1351년 아틀라스에서 죽었다. 하프스와 자이얀 왕조는 이 틈에 나라를 되찾았다. 아부 알하산은 ‘검은 술탄’이라 불렸고 페스에 학문 시설을 짓고 법학자를 후원했다고 한다. 그는 라바트 가까이 샬라에서 아버지가 시작한 성문을 1339년 완성했고, 죽은 뒤 샬라에 묻혔다. 1344년에는 알헤시라스마저 카스티야에 넘어갔다. 튀니스에 들어간 아부 알하산이 이프리키야의 아랍 유목 부족에게서 인질과 세금을 거두려 하자 부족 연합이 반발했다고 전한다. 아부 알하산은 하프스 술탄 아부 바크르 2세의 딸과 혼인했고(해는 분명하지 않다), 1346년 장인이 죽은 뒤 하프스의 계승 다툼을 틈타 1347년 튀니스에 들어갔다. 그의 군대에는 아랍 유목 기병과 기독교 용병도 섞여 있었다고 한다. 이 혼인은 하프스 왕가의 내분을 이용하려는 계산이기도 했다."
  subjects: [marinid-sultanate, zayyanid-kingdom, hafsid-sultanate, granada]
  tags: [war, politics]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Maya Shatzmiller, The Berbers and the Islamic State: The Marinid Experience in Pre-Protectorate Morocco (Markus Wiener, 2000)", "Robert Brunschvig, La Berbérie orientale sous les Hafsides des origines à la fin du XVe siècle (Adrien-Maisonneuve, 1940~1947)", "이븐 할둔, 『이바르의 책』"]

- id: jalayirid-chobanid-1335
  year: 1335
  endYear: 1374
  title:
    ko: "잘라이르 술탄국과 초바니 왕조: 타브리즈와 바그다드(1335~1374)"
  summary:
    ko: "아부 사이드가 후계자 없이 죽은 1335년 뒤 일 칸국의 가신과 에미르들은 칭기즈 칸 후손을 명목상 칸으로 세우고 각자 땅을 차지했다. 잘라이르 부족의 에미르 하산 부주르그는 바그다드와 이라크 남부를 근거로 잘라이르 술탄국을 세웠다. 초반의 손자 하산 쿠첵은 1338년께 하산 부주르그를 꺾고 아제르바이잔의 타브리즈를 차지해 초바니 왕조를 세웠고, 사티 베그 같은 허수아비 칸을 올렸다. 하산 쿠첵은 1343년 아내에게 살해되었고 동생 말레크 아슈라프가 이어받아 엄하게 다스렸다. 1356~1357년 킵차크 칸국의 자니 베그가 군대를 보내 타브리즈를 차지하고 말레크 아슈라프를 처형하면서 초바니 왕조는 끝났다. 자니 베그가 곧 죽고 아들이 물러나자 하산 부주르그의 아들 우와이스(재위 1356~1374)가 1358~1360년 사이 타브리즈를 얻어(해는 자료마다 갈린다) 잘라이르 술탄국이 아제르바이잔까지 넓어졌다. 그 사이 이란 서남부 무자파르 왕조가 한때 타브리즈를 점령했다가 물러났다고 전하며, 점령한 이를 무바리즈 앗딘 무함마드로 적는 글도 샤 슈자로 적는 글도 있다. 우와이스는 1370년 무렵 라이 일대까지 영향력을 뻗쳤다고 하나 세부는 분명하지 않다. 우와이스가 1374년 죽은 뒤 아들 후사인 1세(재위 1374~1382)를 거쳐 아흐마드(재위 1382~1410)가 오르기까지 아들들이 다투어 나라는 약해졌고, 이 나라는 뒤에 티무르의 공격을 받는다(「티무르의 이란 정복: 호라산에서 시라즈까지(1381~1393)」, 뒤의 사건). 잘라이르 가문은 몽골 정복 때 이란에 들어온 잘라이르 부족 출신으로 일 칸국에서 에미르를 냈다. 바그다드는 아바스 칼리프국이 무너진 뒤에도 학문과 상업의 중심이었고, 우와이스는 학자와 시인, 화가를 후원해 타브리즈와 바그다드의 궁정 문화를 키웠다고 전한다. 우와이스는 술탄을 칭하고 자기 이름으로 동전을 찍었다고 전한다."
  subjects: [jalayirid-sultanate, chobanid-dynasty, ilkhanate, golden-horde, muzaffarid-dynasty]
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Charles Melville, The Fall of Amir Chupan and the Decline of the Ilkhanate, 1327–37: A Decade of Discord in Mongol Iran (Indiana University Research Institute for Inner Asian Studies, 1999)"]

- id: sarbadar-togha-temur-1337
  year: 1337
  endYear: 1384
  title:
    ko: "사르바다르 정권과 카스피해 남쪽의 정권들: 바반드·토가 테무르·아미르 왈리(1337~1384)"
  summary:
    ko: "일 칸국이 무너지는 1330년대 호라산과 카스피해 남쪽에서는 지방 정권이 여럿 일어났다. 1337년 세브제바르에서 압드 알라자크가 세금 문제로 일 칸국 쪽 관리와 부딪히며 봉기해 사르바다르('교수대에 목을 걸 각오를 한 이들') 정권을 세웠다. 이 정권은 하산 주리 같은 시아파 성향 신비주의 지도자들의 가르침에 가까웠다고 하며, 수니파 학자와 관료를 끌어안아야 하는 때도 있었다. 압드 알라자크는 1338년 동생 와지흐 앗딘 마수드에게 살해되었고, 마수드(재위 1338~1343)가 정권을 이었다. 그 뒤 사르바다르 군주는 여러 번 바뀌었고(야히야 카라위는 1353~1356년 재위) 호자 알리 무아이야드가 1360년대 초(1361~1364년설)부터 사르바다르를 이끌었다. 같은 시기 고르간(아스타라바드)에서는 칭기즈 칸 일족의 토가 테무르가 1338년께부터 일 칸을 자처하며 마잔다란과 호라산을 넘보았다. 토가 테무르는 1353년 말 술탄 두빈에서 사르바다르의 야히야 카라위에게 살해되어 정권이 끝났다. 마잔다란에서는 바반드 왕조의 킨흐와리야 갈래(1238~1349)가 몽골과 일 칸국의 가신으로 이어졌으나, 마지막 군주 하산 2세가 키야 아프라시얍에게 살해되어 1349년께 끝났다. 토가 테무르가 죽은 뒤 1356년부터 아스타라바드에서는 아미르 왈리가 정권을 세웠다. 호자 알리 무아이야드는 1381년 니샤푸르에서 티무르에게 복속해 사르바다르의 독립은 끝났고, 아미르 왈리는 1384년 아스타라바드를 티무르에게 잃고 잘라이르 쪽으로 달아났다. 사르바다르 정권은 몽골 이후 이란에서 일어난 민중 봉기 성격의 정권으로 평가되지만 세부는 사료가 적어 학설이 갈린다. 사르바다르 정권의 중심 세브제바르는 지금 이란 라자비 호라산주의 도시이다."
  subjects: [sarbadar-dynasty, togha-temur-domain, amir-vali-astarabad, bavandid-dynasty, timurid-empire, jalayirid-sultanate]
  tags: [politics, war, religion]
  sources: ["The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Encyclopaedia Iranica, 'Sarbedārs' 항목 (www.iranicaonline.org)", "Encyclopaedia Iranica, 'Āl-e Bāvand' 항목 (www.iranicaonline.org)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: black-death-mamluk-1347
  year: 1347
  endYear: 1349
  title:
    ko: "흑사병과 이집트·시리아(1347~1349)"
  summary:
    ko: "페스트는 1347년 가을 흑해와 콘스탄티노폴리스에서 온 배를 타고 알렉산드리아에 상륙했다고 전한다(유럽 쪽 경과는 「흑사병과 유대인 학살」, 앞의 사건). 병은 1348년 카이로와 나일강 삼각주로 번졌고 여름과 가을에는 시리아의 도시들을 덮쳤다. 이븐 바투타는 1348년 다마스쿠스에서 하루 사망자가 2천 명이 넘는다고 들었다고 적었고, 카이로의 연대기들은 하루 수천 명에서 수만 명이 죽었다고 적었으나 이런 수는 과장일 가능성이 크다. 이슬람 법학자들은 페스트로 죽는 일을 순교로 보았고, 사람들은 모스크와 성자 무덤에 모여 기도했다. 이슬람 세계에서는 유럽에서처럼 유대인에 대한 집단 학살이 일어나지 않았다는 점이 자주 지적된다. 농민이 크게 줄자 군인의 이크타 수입과 세금이 줄었고, 군인의 급료를 대려 새 세금을 거두자 반발이 일었다. 병이 가라앉은 뒤에도 페스트는 여러 차례 되돌아왔고 이집트 인구는 쉽게 회복되지 못했다. 정치도 흔들려, 안나시르 무함마드의 어린 아들 안나시르 하산이 1347년 술탄에 올랐으나 에미르들의 다툼 속에 힘을 쓰지 못했다(「안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341)」, 앞의 사건). 학자들은 페스트의 원인과 전염 여부를 두고 신학과 의학에서 논쟁했다. 병이 도시에서 시골로 번지며 농사짓는 사람이 줄어 곡물값과 임금이 오르고 관개 수로를 돌볼 일손이 모자라게 되었다는 연구가 있다. 도시에서는 죽은 이의 장례를 이슬람 법에 맞게 치르려 했으나 사망자가 너무 많아 집단 매장이 불가피했다고 전한다. 알마크리지는 콘스탄티노폴리스에서 온 배의 노예와 선원이 거의 다 죽었다고 적었다고 한다."
  subjects: [mamluk-sultanate]
  tags: [society, economy]
  sources: ["Michael W. Dols, The Black Death in the Middle East (Princeton University Press, 1977)", "The Travels of Ibn Battūta, A.D. 1325–1354 (H. A. R. Gibb·C. F. Beckingham 옮김, Hakluyt Society, 1958~2000)", "알마크리지, 『왕조들을 아는 길』", "Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)"]

- id: marinid-abu-inan-1348
  year: 1348
  endYear: 1359
  title:
    ko: "아부 이난과 마린 왕조의 정점과 쇠퇴(1348~1359)"
  summary:
    ko: "아부 이난 파리스는 1348년 아버지 아부 알하산이 이프리키야에서 크게 지자 페스에서 스스로 술탄을 칭했고, 아부 알하산은 1351년 죽었다. 아부 이난은 1352년 자이얀 왕조가 되찾았던 틀렘센을 다시 차지했고, 1352~1353년 동쪽으로 나아가 하프스 왕조의 땅이던 베자이아와 콘스탄틴을 얻어 마린의 지배를 알제리 동부까지 넓혔다. 이 땅은 오래 지키지 못했고, 1357년께의 후퇴(이프리키야에서 군대가 반발해 물러났다는 설과 틀렘센 앞의 패배를 드는 설이 갈린다)로 판도는 다시 줄었다. 아부 이난 때 페스에는 부 이나니아 마드라사(1350년대)가 세워졌고 마린의 학문과 건축은 절정을 맞았다. 그는 이븐 바투타의 여행담을 글로 쓰게 했으며(「이븐 바투타의 여행과 『여행기』(1325~1355)」, 앞의 사건), 젊은 이븐 할둔도 1354년 이후 그의 궁정 비서로 일했으나 반역 혐의로 감옥에 갇히기도 했다. 1357년 말 병이 든 아부 이난은 1358년 1월 재상 하산 이븐 우마르 일파에게 목 졸려 죽었다. 이후 마린의 술탄은 재상들이 세운 어린 군주가 이었고 실권이 약했다. 1359년 힌타타 부족이 마라케시를 차지해 사실상 독립적으로 다스렸으므로, 마린의 지배는 모로코 북부에서 이어졌다. 이 쇠퇴가 한 세기 뒤 와타스 왕조로 이어진다(「마린 왕조의 끝과 와타스 왕조의 성립(1465~1472)」, 뒤의 사건). 아부 이난은 법학자들을 궁정에 불러 토론을 벌이게 했고 아미르 알무미닌(신자들의 지휘자)을 칭했다고 전한다. 그의 급작스러운 죽음은 마린 왕조가 마그레브를 다시 하나로 묶으려던 마지막 시도의 끝이었다. 아부 이난은 마린 왕조 군주 가운데 가장 야심 찬 인물로 꼽힌다."
  subjects: [marinid-sultanate, zayyanid-kingdom, hafsid-sultanate]
  tags: [politics, war, culture]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Maya Shatzmiller, The Berbers and the Islamic State: The Marinid Experience in Pre-Protectorate Morocco (Markus Wiener, 2000)", "Robert Irwin, Ibn Khaldun: An Intellectual Biography (Princeton University Press, 2018)", "이븐 할둔, 『이바르의 책』"]

- id: timur-rise-1370
  year: 1370
  endYear: 1380
  title:
    ko: "티무르의 즉위와 트란스옥시아나의 장악(1370~1380)"
  summary:
    ko: "14세기 중엽 차가타이 칸국은 서쪽의 트란스옥시아나와 동쪽의 모굴리스탄으로 갈라졌고, 트란스옥시아나에서는 칸의 권위가 약해져 부족 에미르들이 땅을 나누어 쥐고 있었다. 바를라스 부족 출신의 에미르 티무르(1336년께 카슈 근처 출생)는 처남 아미르 후세인과 함께 싸우다 틈이 벌어져 후세인을 꺾었다. 1370년 4월 발흐에서 티무르는 에미르들의 추대를 받아 지배자로 올랐다. 티무르는 칭기즈 칸의 후손이 아니어서 '칸'을 칭하지 않고 칭기즈 칸 후손인 수유르가트미시를 명목상의 칸으로 세웠으며, 칭기즈 칸 가문의 사위(구레겐)라는 칭호를 썼다. 도읍은 사마르칸트에 두었다. 1370년대에는 호라즘을 여러 차례 공격하고, 동쪽 모굴리스탄 칸국에 원정을 거듭해 변경을 안정시켰다. 1376~1378년께 킵차크 칸국의 토크타미시를 도와 칸 자리에 오르게 했다(그가 뒤에 적이 되는 경과는 「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」, 뒤의 사건). 티무르는 정복한 도시에서 장인과 학자를 사마르칸트로 옮겨 도읍을 가꾸었다. 이 세력이 곧 이란으로 향한다. 당시 서아시아의 정치는 일 칸국이 무너진 뒤 칭기즈 칸 일가의 칸위가 에미르들에게 좌우되는 때여서, 티무르는 칸의 후손을 앞세운 에미르 정권이라는 틀을 이용할 수 있었다. 그의 군대는 유목 기병에 정주 지역에서 모은 병력과 공병을 더한 혼성군이었고 정복지의 세금과 약탈품이 군대를 먹였다. 그는 이슬람 학자와 수피 교단을 가까이하며 스스로를 이슬람의 수호자로 내세웠다. 티무르는 젊은 시절 입은 상처로 다리를 절어 ‘절름발이 티무르(티무르 이 랑)’로 불렸고, 이것이 서유럽에서 ‘탬벌레인’이 되었다고 한다."
  subjects: [timurid-empire, golden-horde, chagatai-khanate, moghulistan]
  tags: [politics, war]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)"]

- id: ibn-khaldun-1375
  year: 1375
  endYear: 1406
  title:
    ko: "이븐 할둔의 『역사 서설』과 역사학(1375~1406)"
  summary:
    ko: "이븐 할둔(1332~1406)은 하프스 왕조의 튀니스에서 안달루시아계 학자 집안에 태어났다. 그는 하프스 왕조의 튀니스, 마린 왕조의 페스, 그라나다, 베자이아, 자이얀 왕조의 틀렘센 궁정에서 관리와 사절로 일하며 마그레브의 정변을 겪었다. 정치에서 한발 물러나 1375년부터 알제리 서부 이븐 살라마 성채에 머물며 1377년 『역사 서설(무깟디마)』을 완성했다. 그는 이 책에서 유목민의 강한 결속력(아사비야)이 정주 문명의 왕조를 무너뜨리고 새 왕조를 세우지만, 사치와 결속의 약화로 왕조는 대개 세 세대, 곧 120년 안팎에 쇠퇴한다고 설명했다. 이 틀로 마그레브의 왕조 교체를 풀었으며 경제·사회·도시에 대한 서술도 담았다. 1382년 카이로로 가서 맘루크 술탄국의 말리크파 대법관을 여러 번 지냈고, 1401년 티무르 왕조를 세운 티무르가 다마스쿠스를 에워쌌을 때 티무르와 만나 이야기를 나누었다고 자서전에 적었다. 그는 1406년 카이로에서 죽었다. 『이바르의 책』은 마그레브 베르베르인의 역사를 비롯한 세계사를 담은 큰 연대기로, 『역사 서설』은 그 서문이다. 서양에서는 19세기 이래 사회과학의 선구자로 평가했으나 지금은 당시 이슬람 지식인 사회 속에서 읽으려는 연구가 많다. 그는 세금이 지나치게 높아지면 생산 의욕이 꺾여 오히려 세수가 줄어든다는 설명도 남겼다. 『역사 서설』은 사건을 연대순으로 늘어놓는 데서 벗어나 사료를 비판하며 사건의 원인을 사회 구조에서 찾으려 했다는 점에서 눈에 띈다. 그는 역사가들이 과장된 숫자와 전설을 그대로 옮기는 버릇을 비판했다. 카이로에서는 알아즈하르 등에서 가르치기도 했다. 이븐 할둔의 저작은 오스만 시대 학자들에게 읽혔고 19세기에 유럽에 널리 알려졌다."
  subjects: [hafsid-sultanate, marinid-sultanate, zayyanid-kingdom, mamluk-sultanate, timurid-empire]
  tags: [culture, politics]
  sources: ["이븐 할둔, 『역사 서설』 (영역: The Muqaddimah: An Introduction to History, Franz Rosenthal 옮김, Princeton University Press, 1967)", "Robert Irwin, Ibn Khaldun: An Intellectual Biography (Princeton University Press, 2018)", "이븐 할둔, 『이바르의 책』", "이븐 할둔, 『타리프(자서전)』 (티무르와의 만남을 적은 대목의 영역은 Fischel, Ibn Khaldūn and Tamerlane에 수록)", "Walter J. Fischel, Ibn Khaldūn and Tamerlane (University of California Press, 1952)"]

- id: turkmen-confederations-1375
  year: 1375
  endYear: 1402
  title:
    ko: "카라코윤루와 아크코윤루의 성립(1375~1402)"
  summary:
    ko: "일 칸국이 무너지고 잘라이르 술탄국이 기울면서, 아나톨리아 동부와 아제르바이잔, 북이라크 사이의 초원에서는 튀르크멘 부족 연합이 힘을 키웠다. 카라코윤루('검은 양')는 바이람 호자가 이끌며 모술과 반 호 둘레에서 일어나 1375년께 나라의 틀을 갖추었다. 이어 카라 무함마드가 아제르바이잔에서 잘라이르와 다투고 1384년 마르딘의 아르투크 왕조에 압력을 넣었다. 그의 아들 카라 유수프는 1400년 티무르의 공격을 받아 이집트의 맘루크 쪽으로 달아났다. 아크코윤루('흰 양')는 카라 유룩 우스만(재위 1378~1435)이 디야르바크르를 근거로 일으켰고, 티무르 편에 서서 카라코윤루와 맞섰다. 1402년 티무르는 앙카라 전투(「앙카라 전투와 오스만 공백기」, 뒤의 사건) 뒤 아크코윤루에게 디야르바크르 일대를 주었다. 두 연합은 한 세기 가까이 이란과 이라크, 아나톨리아 동부의 패권을 놓고 다투게 된다. 두 연합이 세운 나라는 뒤에 이스마일 1세의 사파비 왕조에 밀린다(「이스마일 1세와 사파비 왕조의 성립(1501~1510)」, 뒤의 사건). 두 연합 모두 유목 기병이 중심이었고 아나톨리아 동부와 이란 서북부의 도시에서 세금을 거두며 차츰 정주 국가로 바뀌어 갔다. 카라코윤루는 타브리즈를, 아크코윤루는 아미드(디야르바크르)를 거점으로 삼았다. 이들은 족장들의 합의에 기댄 연합체여서 군주가 죽으면 계승 다툼이 잦았고, 그 때문에 오래도록 서로를 약하게 했다. 이들의 등장으로 14세기 말에서 15세기에 걸쳐 서아시아 동부의 중심은 몽골계 정권에서 투르크멘 유목 연합으로 옮겨 갔다. 두 연합의 이름이 어느 상징에서 왔는지는 설이 갈려 확실하지 않다."
  subjects: [qara-qoyunlu, aq-qoyunlu, jalayirid-sultanate, timurid-empire, artuqid-dynasty]
  tags: [politics]
  sources: ["John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (University of Utah Press, 1999)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: timur-iran-1381
  year: 1381
  endYear: 1393
  title:
    ko: "티무르의 이란 정복: 호라산에서 시라즈까지(1381~1393)"
  summary:
    ko: "티무르는 1381년 호라산을 정복하기 시작했다. 헤라트의 카르트 가문이 항복했고, 사르바다르의 호자 알리 무아이야드도 니샤푸르에서 복속했다. 1384년에는 마잔다란과 아스타라바드로 군대를 보내 아미르 왈리를 쫓았다. 이어 술타니예와 아제르바이잔으로 나아가 1386년 타브리즈를 차지했고, 잘라이르 술탄국의 술탄 아흐마드는 바그다드로 물러났다. 같은 해 티무르는 조지아 왕국의 트빌리시를 점령해 조지아를 일시 종속시켰다. 이란 서남부로 나아간 티무르는 1387년 이스파한에서 일어난 반란을 진압하며 도시 주민을 학살했다(사망자 수는 사료마다 크게 달라 수만 명에서 십만 명 이상으로 전한다). 시라즈의 무자파르 왕조는 샤 슈자가 죽은(1384) 뒤 분열되어 있었고, 샤 슈자의 아들들은 티무르에게 복속했다. 1392년부터의 이른바 '5년 원정'에서 티무르는 이란 서부와 남부를 다시 차지하고 루리스탄의 하자라스프 왕조를 가신으로 삼았으며, 1393년 샤 만수르를 꺾고 목을 베었다. 남은 무자파르 왕자들은 처형되었고(1393년 5월 22일) 무자파르 왕조는 끝났다. 티무르의 이란 정복은 서쪽의 킵차크 칸국 토크타미시와의 전쟁과 겹쳤다(「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」, 뒤의 사건). 티무르는 대개 항복하는 도시에는 세금과 인질을 요구하고 저항한 도시는 학살과 약탈로 보복했으며, 학살 뒤 해골을 쌓아 올린 일이 두려움을 퍼뜨리는 수단이었다고 전한다. 티무르가 정복한 지방은 대개 아들과 손자가 총독으로 맡았고, 현지 왕조는 가신으로 남는 경우가 많았다. 이스파한 학살은 도시 주민이 티무르의 세금 관리를 죽인 데서 비롯되었다고 전한다."
  subjects: [timurid-empire, sarbadar-dynasty, amir-vali-astarabad, jalayirid-sultanate, muzaffarid-dynasty, hazaraspid-dynasty, georgia-kingdom, kart-dynasty]
  tags: [war, politics]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Encyclopaedia Iranica, 'Mozaffarids' 항목 (www.iranicaonline.org)"]

- id: barquq-burji-1382
  year: 1382
  endYear: 1412
  title:
    ko: "바르쿠크와 부르지 맘루크의 시작(1382~1412)"
  summary:
    ko: "안나시르 무함마드 일가의 마지막 술탄 알살리흐 하지(재위 1381~1382)를 1382년 에미르 바르쿠크가 몰아내고 술탄이 되었다. 바르쿠크는 캅카스 출신 체르케스인으로 에미르 얄부가의 맘루크에서 출세한 사람이다. 이 때문에 이때부터를 체르케스계가 많은 부르지 맘루크 시대라 부른다. 1389년 말라티아 총독 민타시와 알레포 총독 얄부가 알나시리가 반란을 일으키자 바르쿠크는 달아나다 붙잡혀 카라크 성에 갇혔고, 반란군은 하지를 알만수르라는 칭호로 다시 세웠다. 1390년 2월 카이로에서 맘루크 파벌이 맞붙은 끝에 바르쿠크를 따르는 세력이 반란군을 꺾어 그는 카이로로 돌아와 복위했다. 1393년 티무르가 바그다드를 차지하고 시리아를 노릴 기미를 보이자 바르쿠크는 오스만과 손잡았고, 1394년에는 잘라이르 술탄 우와이스의 딸 탄두 하툰과 혼인했으며, 1399년 6월 죽을 때까지 티무르의 위협에 대비했다. 어린 아들 파라지(재위 1399~1412, 1405년 잠깐은 동생 압드 알아지즈)가 뒤를 잇자 티무르가 1400년 시리아로 들어왔다. 티무르는 1400년 10월 알레포를, 1401년 1월 다마스쿠스를 함락했고, 두 도시에서 약탈과 살육, 장인의 강제 이주가 있었다. 이븐 할둔은 파라지를 따라 다마스쿠스에서 티무르를 만났다(「이븐 할둔의 『역사 서설』과 역사학(1375~1406)」, 앞의 사건). 티무르가 1401년 봄 시리아에서 물러나자 맘루크 지배는 회복되었으나 반란과 역병, 기근으로 파라지의 통치는 흔들렸다. 바르쿠크가 보호했던 잘라이르의 술탄 아흐마드와 카라코윤루의 카라 유수프도 한동안 맘루크 땅에서 지냈다. 파라지는 1412년 에미르 샤이크 알마흐무디에게 밀려나 살해되었고, 아바스 칼리프 알무스타인이 잠깐 술탄에 올랐다가 샤이크가 술탄 자리를 이었다. 바르쿠크는 카이로에 마드라사와 수피 수도원, 영묘를 합친 큰 건물(1384~1386)을 세웠다. 부르지 시기에는 술탄 자리를 두고 에미르 파벌이 자주 부딪혔고 술탄 개인의 맘루크 군단이 다음 술탄을 가르는 힘이 되었다. 바르쿠크의 영묘는 아들 파라지가 카이로 북쪽 묘지에 지은 단지에 있다고 한다."
  subjects: [mamluk-sultanate, timurid-empire, jalayirid-sultanate, qara-qoyunlu]
  tags: [politics, war]
  sources: ["Robert Irwin, The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (Croom Helm, 1986)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "Walter J. Fischel, Ibn Khaldūn and Tamerlane (University of California Press, 1952)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)"]

- id: timur-west-1393
  year: 1393
  endYear: 1405
  title:
    ko: "티무르의 이라크·시리아 원정과 죽음(1393~1405)"
  summary:
    ko: "티무르는 이란을 장악한 1393년 바그다드로 나아갔다. 잘라이르 술탄 아흐마드는 이집트로 달아났고, 티무르는 이라크를 차지한 뒤 북쪽 마르딘의 아르투크 왕조를 에워쌌다(1394). 1395년에는 킵차크 칸국을 크게 이겼고(「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」, 앞의 사건), 1398년에는 인도 북부로 들어가 12월 델리를 약탈했고 도시 주민 상당수가 죽거나 포로가 되었다. 1400년부터는 아나톨리아 동부 시바스와 시리아로 향해 알레포(1400)와 다마스쿠스(1401)를 함락했고 1401년 여름 바그다드를 다시 포위해 함락시켰다. 이때 바그다드에서는 큰 학살이 있었고 사망자 수는 사료마다 크게 달라 수만 명에서 십만 명 안팎으로 전한다. 1399~1403년에는 조지아를 거듭 쳤고, 1402년 앙카라 전투에서 오스만 술탄 바예지트 1세를 꺾었다(「앙카라 전투와 오스만 공백기」, 뒤의 사건). 같은 해 12월에는 에게해 연안 스미르나의 병원 기사단 요새를 함락했다. 티무르는 이어 1404년 말 명을 치려고 길을 떠났다가 1405년 2월 오트라르에서 죽었다. 그의 정복은 도시의 파괴와 장인의 이주를 낳았으나 사마르칸트와 헤라트를 중심으로 한 문예 부흥의 바탕이 되기도 했다. 티무르의 서쪽 원정은 영속적 통치보다 약탈과 공물에 가까웠고, 아나톨리아 베이국을 되살리고 아르투크 같은 지방 군주를 가신으로 삼는 방식으로 땅을 다스렸다. 바그다드의 파괴는 이후 이 도시의 학문과 상업을 크게 약화시켰다고 평가된다. 바그다드를 두 번 잃은 아흐마드 잘라이르는 오스만과 맘루크 땅을 오갔고, 맘루크 술탄 파라지에게 갇혀 있다가 1405년 티무르가 죽자 풀려나 바그다드로 돌아왔다. 이 원정으로 맘루크와 오스만은 몽골계 정복자에 맞선다는 공동의 이해를 가졌으나 실제 군사 협력은 거의 없었다."
  subjects: [timurid-empire, jalayirid-sultanate, artuqid-dynasty, mamluk-sultanate, ottoman, delhi-sultanate]
  tags: [war, politics]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Walter J. Fischel, Ibn Khaldūn and Tamerlane (University of California Press, 1952)"]

- id: hafsid-abu-faris-1394
  year: 1394
  endYear: 1434
  title:
    ko: "하프스 술탄국의 절정: 아부 파리스의 튀니스(1394~1434)"
  summary:
    ko: "하프스 왕조는 1229년 튀니스에서 시작해 1270년 루이 9세의 십자군을 겪었고, 1347년에는 마린 왕조 아부 알하산의 점령을 겪었다(「아부 알하산의 마그레브 통일 시도: 틀렘센·살라도·튀니스(1331~1351)」, 앞의 사건). 14세기 후반 아흐마드 2세(재위 1370~1394)가 중앙의 권위를 되살렸고, 그 아들 아부 파리스 압드 알아지즈 2세(재위 1394~1434)가 이를 이어 하프스 왕조의 절정을 이끌었다. 아부 파리스는 1401년 트리폴리타니아를, 1410~1411년(1413년설도 있음) 알제 둘레를 다시 병합했고, 1424년에는 틀렘센의 자이얀 군주를 꺾고 가신을 세웠다. 이 시기 튀니스는 사하라 횡단 대상로와 지중해 교역의 종착점으로 번성했고, 지중해 항구들에서는 베네치아·제노바·아라곤 상인들이 조약을 맺고 장사했다. 이베리아의 레콩키스타에 쫓긴 안달루시아 난민도 튀니스에 정착했다. 아부 파리스의 뒤를 이어 무함마드 3세 알문타시르(재위 1434~1435)를 거쳐 우스만(재위 1435~1488)이 가장 오래 다스렸다. 하프스의 알무스탄시르는 1259년 메카 샤리프의 승인을 받아 칼리프를 칭했고, 튀니스의 자이투나 모스크와 학교는 마그레브 학문의 중심이었다. 수출품은 직물과 곡물, 올리브유, 밀랍이었고 대상로를 따라 오는 금과 노예가 이 교역을 뒷받침했다. 아부 파리스는 문예를 후원해 튀니스에 학자들이 모였고, 안달루시아에서 건너온 기술자와 이주민을 받아들여 도시와 농촌을 개발했다. 아부 파리스는 1397~1402년 콘스탄틴과 베자이아 쪽 지방 세력을 눌러 비스크라(1402)와 투자르(1404)를 되찾았다고 한다."
  subjects: [hafsid-sultanate, zayyanid-kingdom, marinid-sultanate, venice, genoa]
  tags: [politics, economy]
  sources: ["Robert Brunschvig, La Berbérie orientale sous les Hafsides des origines à la fin du XVe siècle (Adrien-Maisonneuve, 1940~1947)", "Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2005)"]

- id: qara-yusuf-succession-1405
  year: 1405
  endYear: 1410
  title:
    ko: "티무르 사후의 서부 이란: 카라 유수프의 아제르바이잔·이라크 장악(1405~1410)"
  summary:
    ko: "티무르가 1405년 2월 죽자 손자들과 아들들이 제국을 두고 다투었고, 사마르칸트에서는 손자 할릴 술탄이, 아제르바이잔과 이라크에서는 아들 미란 샤와 그의 아들 아부 바크르가 서쪽 땅을 맡았다. 티무르를 피해 이집트의 맘루크 쪽과 오스만 쪽에 머물던 카라코윤루의 카라 유수프가 돌아와, 1406년 10월 나히체반에서 아부 바크르를 꺾고 타브리즈를 되찾았다. 1408년에는 사르드루드 전투에서 미란 샤가 죽었다고 전한다. 이로써 티무르 왕조는 서쪽 이란 고원의 북서부를 잃었다. 카라 유수프는 1409년 마르딘을 차지해 아르투크 왕조의 마르딘 갈래를 무너뜨렸고, 1410년에는 잘라이르 술탄국의 술탄 아흐마드를 꺾어 죽이고 바그다드와 이라크 중북부를 얻었다. 한편 디야르바크르의 아크코윤루는 카라 유룩 우스만 아래 카라코윤루와 계속 맞섰다. 티무르의 넷째 아들 샤 루흐는 헤라트에서 힘을 키우고 있었다(「샤 루흐의 헤라트와 티무르 왕조의 문예 부흥(1409~1447)」, 뒤의 사건). 카라 유수프의 진출은 일 칸국 이래 이란 서북부에서 이어진 투르크멘 유목 세력이 티무르 후손의 자리를 차지해 가는 과정이었다. 이 시기의 전쟁은 농민과 도시민에게 세금과 약탈의 부담을 안겼다. 티무르의 손자들 사이의 내전은 이 전환을 쉽게 했다. 사마르칸트와 헤라트, 시라즈에서 각자 움직인 티무르 일족은 서쪽 땅을 지킬 힘을 모으지 못했다. 그의 아들들은 이 땅을 두고 샤 루흐와 계속 부딪히게 된다. 1406년의 승리 뒤 카라 유수프는 타브리즈를 도읍으로 삼았고, 이 도시는 뒤에 카라코윤루와 아크코윤루가 번갈아 차지하는 도읍이 된다. 이 변화는 한 세대 안에 일어났다."
  subjects: [qara-qoyunlu, timurid-empire, jalayirid-sultanate, artuqid-dynasty, aq-qoyunlu]
  tags: [war, politics]
  sources: ["The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (University of Utah Press, 1999)", "Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: shah-rukh-1409
  year: 1409
  endYear: 1447
  title:
    ko: "샤 루흐의 헤라트와 티무르 왕조의 문예 부흥(1409~1447)"
  summary:
    ko: "티무르의 넷째 아들 샤 루흐(재위 1405~1447)는 헤라트를 근거로 힘을 키워, 1409년 사마르칸트를 차지하고 아들 울루그 베그를 총독으로 앉혔다. 이후 그는 티무르 왕조 전체의 지배자로 40년 넘게 안정을 이끌었으며, 도읍은 사마르칸트가 아닌 헤라트에 두었다. 샤 루흐는 이슬람 법과 수니파 정통을 앞세우며 티무르 때의 정복 위주 통치에서 질서 있는 통치로 옮겨 갔다고 평가된다. 서쪽에서는 1420~1421년과 1429년, 1434~1435년 카라코윤루의 이스칸다르를 쳐서 아제르바이잔을 되찾았다가 이스칸다르가 폐위되자 자한 샤를 앉히고 종주권을 인정받았다. 1424년에는 루리스탄 하자라스프 왕조의 마지막 군주 기야스 앗딘을 폐위해 왕조를 끝냈다. 헤라트에서는 왕비 고하르샤드가 메셰드 등에 큰 모스크와 마드라사를 세웠고, 아들 바이순구르가 서예와 책 만들기를 이끌었다. 이 시기 헤라트의 세밀화와 사료 편찬은 이란 문화사에서 한 정점으로 꼽힌다. 역사가 하피즈 아브루는 샤 루흐의 궁정에서 세계사 편찬을 맡았다. 1447년 3월 샤 루흐가 라이로 가는 길에 죽자 아들과 손자들이 다투어 제국은 갈라졌다. 서쪽 이란 고원은 이미 카라코윤루 쪽으로 기울고 있었고 티무르 왕조의 직접 지배는 호라산 서부와 아스타라바드 쪽으로 줄었다. 샤 루흐는 명 조정과도 사절을 주고받아 1410년대부터 중앙아시아와 중국 사이의 교류를 이었고, 이 시기 이란 문화의 중심은 헤라트로 옮겨 갔다. 샤 루흐는 헤라트의 이흐티야르 앗딘 성채(1415)를 고쳐 쌓았다. 그는 맘루크 술탄들과 카바 신전의 덮개를 두고 서한을 주고받았다. 샤 루흐는 티무르 왕조 군주 가운데 가장 오래 다스렸다."
  subjects: [timurid-empire, hazaraspid-dynasty, qara-qoyunlu, mamluk-sultanate]
  tags: [politics, culture, war]
  sources: ["Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Thomas W. Lentz·Glenn D. Lowry, Timur and the Princely Vision: Persian Art and Culture in the Fifteenth Century (Los Angeles County Museum of Art·Smithsonian Institution Press, 1989)"]

- id: jalayirid-end-1411
  year: 1411
  endYear: 1432
  title:
    ko: "잘라이르 술탄국의 마지막: 힐라와 와시트(1411~1432)"
  summary:
    ko: "카라 유수프가 1410년 바그다드를 차지한 뒤에도 잘라이르 가문은 이라크 남부의 힐라와 와시트, 바스라 쪽에서 버텼다. 카라코윤루는 바그다드를 카라 유수프의 아들 피르 부다크에게 맡겨 다스리게 했다. 이 시기 잘라이르 군주의 재위 순서는 사료마다 달라(아흐마드가 죽은 1410년 뒤 샤 왈라드를 비롯해 탄두 하툰, 마흐무드, 우와이스 2세, 후사인 2세 등이 거론된다) 학자마다 다르게 정리한다. 카라 유수프가 1420년 11월(12월설도 있음) 죽은 뒤 카라코윤루는 샤 루흐와 싸웠고, 이 틈에 잘라이르는 겨우 목숨을 이었다. 1431년 10월 카라코윤루의 왕자 아스판이 힐라를 차지했고, 마지막 술탄 후사인 2세는 1431년 11월 9일 붙잡혀 죽었다. 1432년께 잘라이르 술탄국은 완전히 끝났다. 이로써 일 칸국에서 갈라져 나온 이라크의 몽골계 정권은 사라졌고, 이라크는 카라코윤루의 지배 아래로 들어갔다. 잘라이르 술탄국은 일 칸국의 에미르 하산 부주르그가 1330년대 세운 뒤 우와이스 때 타브리즈와 바그다드를 잇는 큰 나라였으나, 티무르의 침입(1386·1393·1401)으로 도시가 약탈당하고 술탄이 두 번 이집트로 피신했다. 힐라는 유프라테스 중류의 시아 학문 중심지였고, 와시트와 바스라는 하류의 농업과 항구 교역지였다. 탄두 하툰은 잘라이르 술탄국에서 드물게 여성이 실권을 쥔 사례로 거론되나 재위 연대는 확실하지 않다. 이로써 바그다드의 지배는 한 세기 동안 몽골계 가문에서 투르크멘 연합으로 넘어갔다. 카라코윤루에게 바그다드와 힐라를 차지하는 일은 아바스 칼리프국 이래 이라크의 행정 중심을 쥐는 일이었다. 힐라 둘레의 유프라테스 하류는 관개 농업의 중심이었다. 바스라는 인도양과 이어진 항구였다."
  subjects: [jalayirid-sultanate, qara-qoyunlu, timurid-empire]
  tags: [politics, war]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Encyclopaedia Iranica, 'Jalayerids' 항목 (www.iranicaonline.org)"]

- id: ulugh-beg-samarkand-1417
  year: 1417
  endYear: 1449
  title:
    ko: "울루그 베그와 사마르칸트의 천문학(1417~1449)"
  summary:
    ko: "울루그 베그(1394~1449)는 티무르 왕조 군주 샤 루흐의 아들로 1409년부터 사마르칸트를 다스렸고 1447년 아버지가 죽자 술탄이 되었다. 1417~1420년 사마르칸트에 마드라사를 세웠고, 1424~1429년께 사마르칸트 근처에 큰 천문대를 지었다. 천문대에서는 알리 쿠시지 등 학자들이 관측하여 『술탄의 천문표(지즈 이 술타니)』를 1437년께 완성했다. 이 천문표는 별 천여 개의 위치를 담았고 항성년의 길이를 오늘의 값에 아주 가깝게 구한 것으로 높이 평가된다. 이 일에는 카디자데 알루미와 잠시드 알카시 같은 학자가 함께했다고 전한다. 울루그 베그는 종교 학자들과 정치적으로 부딪혔고, 1449년 아들 압둘 라티프의 사주로 살해되었다. 이어 천문대는 쇠퇴했다. 울루그 베그의 천문학은 마라게 천문대에서 이어진 이슬람 천문학 전통의 절정으로 꼽힌다(「마라게 천문대와 『집사』: 일 칸국의 학문(1262~1311)」, 앞의 사건). 천문대는 큰 원통형 건물이었고 땅속에 깊이 묻은 거대한 육분의로 별을 쟀다고 한다. 울루그 베그는 학자들과 직접 토론했고 스스로 천문학 논문도 썼다. 그의 마드라사에서는 수학과 천문학, 이슬람 법을 함께 가르쳤다. 천문표에는 자신들의 관측으로 다시 잰 별의 위치가 실려, 프톨레마이오스 이래 별 목록을 새로 쓴 것으로 평가된다. 천문표는 오스만과 인도, 유럽에서도 읽혔고 17세기에 영국에서 라틴어로 펴내었다. 울루그 베그는 ‘위대한 군주’를 뜻하는 칭호이고 본명은 무함마드 타라가이이다. 사마르칸트 레기스탄 광장의 울루그 베그 마드라사는 지금도 남아 있다. 알리 쿠시지는 뒤에 이스탄불로 옮겨 오스만 천문학의 기틀을 놓았다."
  subjects: [timurid-empire]
  tags: [culture]
  sources: ["V. V. Barthold, Four Studies on the History of Central Asia, vol. 2: Ulugh-Beg (V. Minorsky·T. Minorsky 옮김, E. J. Brill, 1958)", "Thomas W. Lentz·Glenn D. Lowry, Timur and the Princely Vision: Persian Art and Culture in the Fifteenth Century (Los Angeles County Museum of Art·Smithsonian Institution Press, 1989)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)"]

- id: barsbay-spice-cyprus-1422
  year: 1422
  endYear: 1438
  title:
    ko: "바르스베이의 향신료 전매와 키프로스 원정(1422~1438)"
  summary:
    ko: "파라지가 1412년 죽은 뒤 칼리프 알무스타인이 잠깐 술탄에 올랐다가 샤이크 알무아이야드(재위 1412~1421)가 술탄이 되었고, 그가 죽은 뒤 아들 아흐마드와 에미르 타타르, 어린 무함마드가 몇 달씩 이은 끝에 1422년 에미르 바르스베이가 술탄이 되었다. 바르스베이는 홍해 교역의 수입을 국가 재정으로 거두려 했다. 그는 1425년 무렵 히자즈의 항구 제다를 홍해 교역의 주요 관문으로 키웠고, 1428년께부터 후추 같은 향신료 거래를 술탄이 사들여 파는 전매로 바꾸어 베네치아 상인에게 정한 값에 사도록 했다. 이 정책은 카리미 상인이라 불리던 이집트의 향신료 상인들을 몰락시켰고 베네치아와의 마찰을 낳았다. 한편 키프로스의 뤼지냥 왕국 해적들이 시리아와 이집트 해안을 노략하자 바르스베이는 1424년과 1425년 원정대를 보내 해안 도시들을 공격했다. 1426년 7월 키로키티아 전투에서 키프로스 왕 야누스가 맘루크군에 패배해 사로잡혔고, 맘루크는 왕의 몸값을 받고 키프로스를 공납국으로 삼았다(「카테리나 코르나로와 키프로스의 베네치아 편입」, 뒤의 사건). 바르스베이는 1438년 6월 죽었다. 베네치아는 알렉산드리아와 다마스쿠스의 상관(폰다코)에서 장사하는 대가로 관세를 냈고, 후추를 사려는 유럽 상인은 술탄이 정한 값에 사야 했다. 맘루크 사회 안에서는 이 정책을 군인 급료를 대려는 재정 해법으로 보는 평가와 상업을 위축시켰다고 보는 평가가 함께 있다. 바르스베이는 1425년 아슈라피 금화를 새로 찍어 베네치아 두카트와 같은 값으로 쓰이게 했다고 한다. 뒤에 포르투갈이 인도양에서 향신료 교역을 흔들면서 이 전매는 한계를 드러냈다. 바르스베이는 체르케스인으로 바르쿠크의 맘루크였다가 술탄에 올랐다. 그의 치세 16년은 맘루크 술탄국의 번영기로도 평가된다."
  subjects: [mamluk-sultanate, cyprus-kingdom, venice]
  tags: [economy, war]
  sources: ["The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "Eliyahu Ashtor, Levant Trade in the Later Middle Ages (Princeton University Press, 1983)", "Carl F. Petry, Protectors or Praetorians? The Last Mamluk Sultans and Egypt's Waning as a Great Power (State University of New York Press, 1994)"]
  places: [{ name: 키로키티아 전투, at: [33.34, 34.8], year: 1426 }]

- id: musha-sha-1435
  year: 1435
  endYear: 1461
  title:
    ko: "무샤샤 운동과 후제스탄의 호베이제(1435~1461)"
  summary:
    ko: "무샤샤는 15세기 전반 후제스탄의 호베이제와 이라크 남부의 와시트·바스라 일대에서 시아 신비주의 운동을 이끈 무함마드 이븐 팔라(1461년 죽음)가 일으킨 정권이다. 무함마드는 1435/1436년 무렵 스스로 숨은 이맘 마흐디의 대리 또는 재림이라는 믿음을 내세워 추종자를 모았고, 호베이제를 본거지로 삼아 후제스탄과 이라크 남부로 힘을 넓혔다. 후대의 시아 학자들은 그가 알리를 신으로 높였다고 비판했으나, 그의 교리의 실제 모습은 사료가 적고 비판자의 글에 기대는 점이 많아 분명하지 않다. 이 시기 후제스탄은 샤 루흐의 티무르 왕조와 카라코윤루 사이에 낀 땅이어서, 무샤샤는 두 큰 세력의 틈에서 독립을 지켰다. 1441년께 호베이제를 차지해 후제스탄 서부를 다스렸다. 무함마드가 죽은 뒤에는 아들 마울라 알리와 후손이 가문을 이었다. 무샤샤 가문은 뒤에 1508년 사파비 왕조의 이스마일 1세에게 독립을 잃고 사파비 아래의 총독으로 이어진다(「이스마일 1세와 사파비 왕조의 성립(1501~1510)」, 뒤의 사건). 후제스탄은 카룬강과 카르헤강이 흐르는 저지대 평야로 사탕수수와 쌀농사가 이루어지는 곳이었고, 이라크 남부의 늪지와 맞닿아 있어 중앙 정부의 힘이 닿기 어려웠다. 이런 조건에서 아랍계 부족과 시아 신앙을 가진 농민이 중앙 권력에서 벗어난 공동체를 이루기 쉬웠다. 무샤샤의 지도자는 가문 안에서 아들에게 이어졌고 마울라(주군)라는 칭호를 썼다고 한다. 무함마드는 학자이자 신비주의자였고 ‘무샤샤’라는 이름은 ‘빛나는 자’라는 별칭에서 왔다는 설이 있다. 이 지역에는 열두 이맘파 시아가 많았고 무함마드는 그 신앙의 가장자리에서 새 해석을 내놓았다고 한다."
  subjects: [musha-sha, timurid-empire, qara-qoyunlu]
  tags: [religion, politics]
  sources: ["P. Luft, 'Mushaʿshaʿ', The Encyclopaedia of Islam, 2nd ed., vol. 7 (Brill, 1993)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Bosworth, C. E., The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: jahan-shah-1438
  year: 1438
  endYear: 1468
  title:
    ko: "자한 샤의 카라코윤루: 이란 장악과 헤라트(1438~1468)"
  summary:
    ko: "카라 유수프의 아들 자한 샤는 1435년 샤 루흐에게 아제르바이잔 총독으로 인정받았고, 1436년 샤 루흐의 도움으로 형제 이스칸다르를 꺾은 뒤 1438년 4월 19일 즉위했다. 1440년에는 약 2만 명을 이끌고 조지아를 침입해 트빌리시를 약탈했고, 1444년의 두 번째 원정은 아할치헤에서 승부 없이 끝났다. 1446년 6월에는 일곱 달의 포위 끝에 바그다드를 차지해 아들 미르자 무함마드를 맡겼다. 자한 샤는 처음 티무르 왕조 샤 루흐의 종주권을 받아들였다가 1447년 샤 루흐가 죽자 독립해 술탄과 칸을 칭했다. 1452~1453년에는 사베, 쿰, 이스파한, 시라즈, 야즈드를 차지하고 시라즈를 아들 피르 부다크에게 맡겨 카라코윤루가 이란 고원 대부분을 차지했다. 1458년에는 헤라트까지 가서 여섯 달 머물렀으나 아들 하산 알리의 반란과 티무르 왕조 술탄 아부 사이드가 타브리즈로 진군한 일 때문에 돌아섰다. 피르 부다크는 1458년 이래 여러 차례 반란을 일으켜 한 번은 어머니의 청으로 용서받았으나, 바그다드 총독으로 있던 때 다시 일어나 1464년 패하여 미르자 무함마드에게 처형되었다. 그는 문예를 후원했고 타브리즈의 푸른 모스크(1465)는 그의 아내 자한 베굼 하툰이 세웠다고 전한다. 한편 카라코윤루는 디야르바크르의 아크코윤루와 오래 맞섰다. 1466년 자한 샤가 디야르바크르를 노리고 군대를 보냈고, 1467년 10월 말 또는 11월(두 설) 차파크추르(지금의 뷘괼 근처)에서 우준 하산에게 크게 져 죽었다. 아들 하산 알리(재위 1467~1468)가 이었으나 우준 하산이 1468년 카라코윤루를 무너뜨렸다(「우준 하산의 아크코윤루: 카라코윤루 정복과 오틀룩벨리(1467~1478)」, 뒤의 사건). 자한 샤는 ‘하키키’라는 필명으로 시를 지었다고 한다. 그는 푸른 모스크의 남쪽 부분에 묻혔다고 한다."
  subjects: [qara-qoyunlu, timurid-empire, aq-qoyunlu]
  tags: [politics, war]
  sources: ["John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (University of Utah Press, 1999)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)"]

- id: rasulid-tahirid-1443
  year: 1443
  endYear: 1454
  title:
    ko: "라술 왕조의 끝과 타히르 왕조의 성립(1443~1454)"
  summary:
    ko: "15세기 전반 라술 왕조는 안나시르 아흐마드(재위 1400~1424)가 한동안 나라의 힘을 되살렸다. 이때 명의 사절이 예멘에 들렀다는 기록이 있다(1418~1419). 그러나 아흐마드가 죽은 뒤 1424~1443년에는 다섯 술탄이 이었고 재위 11년의 알자히르 야흐야 말고는 재위가 짧았으며, 군인과 부족의 반란으로 왕조가 흔들렸다. 이 틈에 남부 산악 지대의 타히르 가문(바누 타히르)이 힘을 키워 1443년 라헤즈를 차지했다. 1454년 타히르 가문의 아미르와 알리 형제가 아덴을 차지했고, 마지막 라술 술탄 알마스우드 아부 알카심은 자리에서 물러나 메카로 갔다. 아미르 이븐 타히르가 알자피르를 칭하고 술탄이 되면서 타히르 왕조(1454~1517)가 시작되었다. 타히르 왕조는 자비드를 겨울 도읍으로, 여름에는 산지의 주반과 알미크라나를 쓰며 티하마와 고지를 다스렸다. 타히르 왕조는 뒤에 사나를 놓고 자이드파와 거듭 싸웠다. 라술 왕조 말기에는 군인과 베두인 부족이 술탄을 갈아 치우는 일이 잦았고, 맘루크가 홍해 교역과 메카 샤리프의 후견을 쥐면서 이집트와의 경쟁에서도 밀렸다. 사나는 라술 시대에도 자이드파 이맘국과 다투는 땅이었고, 타히르 왕조는 고지에서 자이드파와 겨루면서 홍해 연안 도시를 쥐는 해안 성격의 국가였다. 타이즈의 알아슈라피야 마드라사 같은 라술 시대의 건물은 타히르 왕조 때에도 쓰였고, 아덴 항구에는 인도와 아프리카 상인이 모여 장사했다. 이로써 두 세기 넘게 이어진 라술 왕조가 끝났다. 타히르 왕조의 술탄들은 자이드파와 싸우는 한편 이집트의 맘루크와 선물과 사절을 주고받았다. 아미르 1세는 아덴 항구의 수입으로 군대를 키웠다고 전한다. 아덴은 라술 시대 이래 인도양 교역으로 이름난 항구였다."
  subjects: [rasulid-dynasty, tahirid-sultanate, zaydi-imamate]
  tags: [politics]
  sources: ["G. Rex Smith, Studies in the Medieval History of the Yemen and South Arabia (Variorum, 1997)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2005)"]

- id: marinid-end-wattasid-1465
  year: 1465
  endYear: 1472
  title:
    ko: "마린 왕조의 끝과 와타스 왕조의 성립(1465~1472)"
  summary:
    ko: "마린 왕조는 14세기 후반 이후 술탄의 실권이 약해졌고, 1420년부터 재상 아부 자카리야 야히야 이래 와타스 가문의 재상들이 어린 술탄을 대신해 사실상 나라를 다스렸다. 1415년 포르투갈이 세우타를 차지한 일(「세우타 정복과 엔히크 왕자의 항해」, 앞의 사건)도 마린의 권위를 흔들었다. 술탄 압드 알하크 2세(재위 1420~1465)는 1459년께 와타스 가문의 힘을 꺾고 직접 통치하려 했다. 그러나 그가 유대인 재상을 중용하고 세금을 걷자 페스에서 반란이 일어났다. 1465년 압드 알하크 2세는 반란 속에서 죽어 마린 왕조는 끝났고, 이 소동에서 페스의 유대인 공동체가 큰 피해를 입었다고 전한다. 반란 뒤 페스는 이드리스 가문의 후손으로 알려진 샤리프 무함마드 알주티의 통치를 받았다. 1471년 포르투갈이 아르질라와 탕헤르를 차지하자 모로코는 큰 충격을 받았고, 와타스 가문의 무함마드 알샤이크가 1471/1472년 페스에 들어가 와타스 왕조(1472~1554)를 열었다. 와타스가 실제로 다스린 곳은 모로코 북부(탕헤르에서 타필랄트·우지다까지)였고 남부와 대서양 평야는 지방 세력과 수피 교단이 쥐었다. 해안 도시를 잃으면서 모로코의 이슬람 사회는 지중해와 대서양 무역에서 밀렸고, 이 위기 속에서 무함마드의 후손으로 인정받는 샤리프들의 권위가 커졌다. 페스 반란은 유대인 공동체뿐 아니라 도시의 시민층과 학자들이 정권에 품은 불만이 터진 결과였다고 풀이하는 연구가 있다. 포르투갈은 1458년 알카세르세구에르를 차지해 해안의 거점을 늘렸고, 1471년 아르질라 점령 때 주민 상당수가 죽거나 포로가 되었다고 전한다. 이 시기 모로코의 해안 도시들은 포르투갈의 압박에 맞서 지방 수장들이 따로 움직였다."
  subjects: [marinid-sultanate, wattasid-sultanate, portugal]
  tags: [politics, society]
  sources: ["Jamil M. Abun-Nasr, A History of the Maghrib in the Islamic Period (Cambridge University Press, 1987)", "Maya Shatzmiller, The Berbers and the Islamic State: The Marinid Experience in Pre-Protectorate Morocco (Markus Wiener, 2000)", "The Encyclopaedia of Islam, 2판 (Brill, 1960~2005)"]

- id: uzun-hasan-1467
  year: 1467
  endYear: 1478
  title:
    ko: "우준 하산의 아크코윤루: 카라코윤루 정복과 오틀룩벨리(1467~1478)"
  summary:
    ko: "아크코윤루의 우준 하산(재위 1452~1478)은 1452년 정변으로 디야르바크르에서 권력을 잡았고(단독 지배는 1457년 뒤로 보는 견해도 있다), 1467년 차파크추르에서 카라코윤루의 자한 샤를 꺾었다. 이어 1468년 카라코윤루의 하산 알리를 무너뜨려 아제르바이잔과 이라크, 이란 서부를 차지했다. 1469년에는 카라바흐에서 티무르 왕조의 술탄 아부 사이드를 꺾고 사로잡았으며, 아부 사이드는 티무르 왕족 야드가르 무함마드에게 넘겨져 처형되었다. 이로써 우준 하산은 이란 고원의 서쪽 절반과 이라크, 아나톨리아 동부를 아우르는 제국을 이루었고, 타브리즈를 도읍으로 삼았다. 우준 하산은 오스만의 확장을 막으려 베네치아에 군사 지원을 요청했고(「베네치아-오스만 전쟁과 스칸데르베그의 알바니아」, 앞의 사건) 카라만 베이국과도 손잡으려 했다. 그러나 지원은 오지 않았고, 1473년 8월 오틀룩벨리(지금의 튀르키예 동부)에서 오스만 술탄 메흐메트 2세의 대포와 화승총을 앞세운 군대에게 크게 졌다. 우준 하산은 조지아도 거듭 침입해 조지아 왕국의 분열을 부채질했다(「조지아 왕국의 내전과 세 왕국으로의 분열」, 앞의 사건). 그가 1478년 죽자 아들 술탄 할릴이 잠시 오른 뒤 야쿱(재위 1478~1490)이 이었다. 우준 하산은 트레비존드 황제의 딸 데스피나 하툰과 1458년께 혼인해 흑해 연안의 정세에도 관련되어 있었다. 아크코윤루는 타브리즈 궁정에서 수니와 시아 학자, 수피를 함께 후원했고 세금과 재판을 정한 세속 법령집(카눈나메)을 두었다고 전한다. 우준 하산은 맘루크와도 사절을 주고받았다. 우준 하산의 아들 제이넬은 케르만 총독으로 있다가 오틀룩벨리에서 전사했다. 베네치아는 오스만과 싸운 1463~1479년 전쟁에서 동맹을 찾아 사절을 거듭 타브리즈로 보냈다. 그 가운데 카테리노 제노는 우준 하산을 설득해 오스만을 치게 했으나, 같은 때 오스만을 공격한 서유럽 나라는 없었다. 우준 하산의 딸 할리마 알람샤 하툰은 사파비 교단의 샤이크 하이다르와 혼인했고, 그 아들이 훗날 이스마일 1세가 되었다."
  subjects: [aq-qoyunlu, qara-qoyunlu, timurid-empire, ottoman, venice, georgia-kingdom]
  tags: [war, politics]
  sources: ["John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (University of Utah Press, 1999)", "The Cambridge History of Iran, vol. 6: The Timurid and Safavid Periods (Peter Jackson·Laurence Lockhart 편, Cambridge University Press, 1986)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)"]

- id: qaytbay-1468
  year: 1468
  endYear: 1496
  title:
    ko: "카이트바이의 치세: 건축과 오스만과의 대립(1468~1496)"
  summary:
    ko: "카이트바이는 1468년 에미르들의 추대로 술탄에 올라 1496년까지 맘루크 술탄국을 이끌었다. 그의 앞에는 자크마크(재위 1438~1453), 이날(1453~1461), 쿠슈카담(1461~1467) 같은 술탄이 이어졌고, 1467~1468년에는 얄바이와 티무르부가가 몇 달씩 올랐다. 28년 남짓한 치세는 부르지 맘루크 시기에 가장 길다. 카이트바이는 1472년 메카 순례를 다녀왔고 메카 샤리프국과 히자즈의 안정에 힘썼다. 그는 카이로의 묘지 구역에 영묘와 마드라사를 세웠고, 알렉산드리아에는 옛 파로스 등대 자리에 요새(1477~1479)를 쌓았다. 대외적으로는 우준 하산의 아크코윤루와 사절을 주고받았고(「우준 하산의 아크코윤루: 카라코윤루 정복과 오틀룩벨리(1467~1478)」, 앞의 사건), 오스만 술탄 바예지트 2세의 동생 젬이 1481년 이집트로 피난하자 그를 맞았다. 맘루크의 종주 아래 있던 둘카디르 베이국이 오스만 쪽으로 기울면서 두 나라 갈등이 커져, 1485~1491년 전쟁이 벌어졌다(「오스만-맘루크 전쟁과 카라만 베이국의 끝」, 뒤의 사건). 맘루크는 승리하여 킬리키아 평원을 지켰지만 전쟁 비용이 늘었다. 한편 1480년대 말 포르투갈이 희망봉을 돌아 인도양으로 나아갈 길을 열고 있었다. 그의 치세 건축은 이슬람 건축사에서 맘루크 양식의 마지막 정점으로 꼽힌다. 카이트바이는 시리아 총독들에게 국경 방어를 맡기고 유럽 상인과의 향신료·직물 교역도 이어 갔다. 순례 때 만난 메카의 샤리프와 학자들에게 많은 기부를 했다고 전한다. 그가 죽은 뒤 맘루크 술탄국은 술탄이 거듭 바뀌는 혼란기에 들어섰다. 카이트바이의 묘와 마드라사 복합 건물은 카이로 북쪽 묘지에 있으며 정교한 돌 돔으로 유명하다."
  subjects: [mamluk-sultanate, aq-qoyunlu, ottoman, dulkadir-beylik, sharifate-of-mecca]
  tags: [politics, culture]
  sources: ["Carl F. Petry, Twilight of Majesty: The Reigns of the Mamlūk Sultans al-Ashraf Qāytbāy and Qānṣūh al-Ghawrī in Egypt (University of Washington Press, 1993)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "John E. Woods, The Aqquyunlu: Clan, Confederation, Empire (University of Utah Press, 1999)"]

- id: mamluk-end-1501
  year: 1501
  endYear: 1517
  title:
    ko: "맘루크 술탄국의 마지막: 칸수 알가우리와 투만바이 2세(1501~1517)"
  summary:
    ko: "카이트바이가 1496년 죽은 뒤 몇 해 동안 어린 아들 안나시르 무함마드와 에미르 출신 술탄이 잇따라 올랐다가 쫓겨났고, 1501년 투만바이 1세를 몰아낸 에미르들이 체르케스 출신 에미르 칸수 알가우리를 술탄으로 세웠다. 알가우리(재위 1501~1516)는 재정을 메우려 세금과 몰수를 거듭하는 한편 카이로에 큰 마드라사와 영묘를 지었다. 포르투갈이 1498년 다가마의 항해(「콜럼버스와 다가마, 신항로 개척」, 앞의 사건) 뒤 인도양으로 나아가자 홍해 향신료 교역이 흔들렸고, 알가우리는 베네치아의 도움을 받아 수에즈에서 함대를 만들어 후사인 알쿠르디가 이끌어 인도로 보냈다. 이 함대는 1508년 차울에서 포르투갈 함대를 물리쳤으나 1509년 2월 디우에서 크게 졌다. 1515년 후사인 알쿠르디의 두 번째 함대가 예멘에 상륙했고, 1517년 타히르 왕조의 마지막 술탄 아미르 2세가 맘루크군과 싸우다 붙잡혀 처형되면서 왕조가 끝났다. 사파비의 이스마일 1세(「이스마일 1세와 사파비 왕조의 성립(1501~1510)」, 같은 시기의 사건)가 1514년 오스만 셀림 1세에게 찰디란에서 진 뒤 오스만은 맘루크가 사파비와 손잡을지 의심했고, 맘루크의 보호를 받던 둘카디르 베이국을 둘러싸고 두 나라 관계가 나빠졌다. 1516년 8월 마르즈 다비크에서 알가우리가 죽었고, 1516년 가을 투만바이 2세가 술탄이 되어 1517년 1월 리다니야에서 싸우고 카이로를 지키려 했으나 오스만군이 도시를 차지했고(「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 뒤의 사건) 투만바이는 4월 처형되었다. 1517년 맘루크 술탄국은 오스만 제국에 병합되어 끝났다. 알가우리가 죽은 뒤 알레포 총독 하이르 베이 같은 에미르 일부는 오스만 쪽으로 돌아섰다고 한다."
