- id: chile-coup-1970
  year: 1970
  endYear: 1973
  title:
    ko: "아옌데의 인민 연합과 1973년 칠레 쿠데타(1970~1973)"
  summary:
    ko: "1970년 9월 칠레 대통령 선거에서 사회당의 살바도르 아옌데는 사회당·공산당 등 좌파가 묶은 인민 연합 후보로 36.6%를 얻어, 35.3%의 호르헤 알레산드리와 28.1%의 라도미로 토믹을 앞섰으나 과반이 없어 의회가 결정하게 되었다. 10월 24일 의회가 아옌데를 뽑았고 11월 3일 에두아르도 프레이 몬탈바(1964~1970년 재임)의 뒤를 이어 취임했다. 아옌데 정부는 '칠레식 사회주의 길'을 내세워 은행·기업 국유화와 농지 개혁을 밀어붙였고 1971년 구리 광산을 국유화했는데, 물가 상승과 물자 부족, 1972년 10월 트럭 운전사 파업 같은 갈등 속에 사회가 두 쪽으로 갈렸다. 미국은 닉슨 행정부가 칠레 경제를 압박하고 야당 쪽을 지원했으며(미국 상원 조사 위원회가 1975년 보고서로 밝힘), 1973년 8월 24일 육군 총사령관이 카를로스 프라츠에서 아우구스토 피노체트로 바뀌었다. 9월 11일 육군·해군(호세 토리비오 메리노)·공군(구스타보 레이)의 장성들이 쿠데타를 일으켜 공군기가 대통령궁 라모네다궁을 폭격했고, 아옌데는 오전 9시 10분 무렵 라디오로 마지막 연설을 한 뒤 궁 안에서 숨졌다(자살로 확인됨). 군정 평의회 의장이 된 피노체트는 1974년 6월 17일 '국가 최고 통솔자'로 올랐고 1990년 3월 11일 파트리시오 아일윈에게 넘길 때까지 정당을 금지하고 반대파를 탄압해, 군정 아래 죽거나 실종된 사람이 3,095명 이상으로 인정되고 이 밖에 고문과 불법 구금의 피해자가 수만 명이라고 한다. 아일윈 정부는 1990년 진실·화해 위원회를 꾸려 1991년 레티그 보고서를 냈고, 2004년의 발레치 보고서는 고문 피해자를 따로 조사했다."
