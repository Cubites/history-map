- id: guyana-independence-1953
  year: 1953
  endYear: 1966
  title:
    ko: "영국령 기아나의 자치와 가이아나의 독립(1953~1966)"
  summary:
    ko: "1953년 4월 영국령 기아나에서 처음으로 보통 선거가 치러져 체디 자간의 인민 진보당(PPP)이 24석 가운데 18석을 얻었고, 자간이 정부 수석이 되었으나 노조 인정 절차를 바꾸려는 노동관계법안을 두고 영국과 설탕 업계가 반발했다. 당시 인구는 인도계가 약 절반, 아프리카계가 약 3분의 1이었다. 영국은 10월 9일 공산주의 침투를 우려해 헌법을 정지하고 군대를 보냈으며 자간 정부는 133일 만에 물러났고 임시 정부가 1957년까지 이어졌다. 1955년 PPP는 인도계 지지의 자간과 아프리카계 지지의 포브스 버넘으로 갈라졌고 버넘은 1957년 국민 회의(PNC)를 세웠다. 1957년 선거에서 PPP가 이긴 데 이어 1961년 8월 선거에서 35석 중 20석을 얻었고, 새 헌법으로 자치 정부가 서자 자간이 총리가 되었으나 1962~1964년 도시 중심의 아프리카계와 사탕수수 농장 중심의 인도계 사이에서 파업과 소요가 이어져 약 160명이 숨졌고, 1964년 10월 선거에서 PPP가 최다 의석(24석)을 얻고도 과반을 못 얻어 PNC가 연립을 이루어 12월 14일 버넘이 총리가 되었다(영국이 1963년 헌법 회의에서 비례 대표제를 정한 것이 PPP의 과반을 막았다). 1966년 5월 26일 영국령 기아나가 영국에서 독립해 약 21만 km²의 가이아나가 되었고, 독립에 앞선 1966년 2월 17일 영국·베네수엘라·영국령 기아나 정부가 제네바 협정을 맺어 베네수엘라가 1899년 판정을 무효라 주장한 에세키보 서쪽 땅의 국경 분쟁을 협의하기로 했다. 독립 뒤 버넘 정부는 영연방에 남았다가 1970년 2월 23일 공화국을 선포했다."
  subjects: [british-guiana, guyana, uk]
  links:
    - { from: uk, to: guyana, note: "영국령 기아나의 독립을 승인 (1966-05-26)" }
  tags: [politics, diplomacy]
  sources: ["Clive Y. Thomas, The Poor and the Powerless: Economic Policy and Change in the Caribbean (Monthly Review Press, 1988)", "Cheddi Jagan, The West on Trial: My Fight for Guyana's Freedom (Michael Joseph, 1966)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]

- id: civil-rights-1954
  year: 1954
  endYear: 1968
  title:
    ko: "민권 운동: 브라운 판결에서 민권법까지(1954~1968)"
  summary:
    ko: "1954년 5월 17일 미국 연방 대법원은 브라운 대 교육위원회 사건에서 공립학교의 인종 분리가 위헌이라고 만장일치로 판결하고(이듬해 후속 판결은 '신중한 속도'로 시행하라고 했다) 1896년 이래의 '분리하되 평등' 원칙을 깨뜨렸다. 1955년 8월 미시시피주에서 열네 살 에밋 틸이 살해된 사건이 전국의 분노를 샀고, 1955년 12월 1일 앨라배마주 몽고메리에서 로자 파크스가 버스 좌석 양보를 거부해 체포되자 마틴 루서 킹 목사가 이끈 버스 불매 운동이 약 1년 동안 이어졌고, 1957년 아칸소주 리틀록에서는 아이젠하워 대통령이 연방군을 보내 흑인 학생의 등교를 지켰고, 1960년 2월 노스캐롤라이나주 그린즈버러의 식당 연좌 시위와 1961년 자유 승차 운동이 이어졌고, 1963년 4~5월 앨라배마주 버밍햄의 시위는 경찰의 강경 진압으로 전국의 관심을 크게 모았다. 1963년 6월 활동가 메드가 에버스가 피살되고 8월 28일 워싱턴 행진(참가자 추산 약 25만 명)에서 킹이 연설했으며, 케네디 암살 뒤 대통령이 된 린든 존슨이 1964년 7월 2일 민권법에, 1965년 8월 6일 투표권법에 서명해(3월 7일 셀마 행진 참가자가 경찰에 맞은 일과 3월 21~25일 셀마에서 몽고메리까지 약 2만 5천 명의 행진이 법을 서두르게 한 직후였다) 공공시설과 고용의 차별, 투표 자격 제한이 법으로 금지되었다. 1968년 4월 4일 킹이 테네시주 멤피스에서 암살되자 여러 도시에서 소요가 일었고, 4월 11일 주택 판매·임대 차별을 막는 공정 주택법이 서명되었다. 1964년 여름에는 미시시피에서 유권자 등록 운동이 벌어졌다."
  subjects: [usa]
  links: []
  tags: [society, politics]
  sources: ["Taylor Branch, Parting the Waters: America in the King Years 1954–63 (Simon & Schuster, 1988)", "James T. Patterson, Brown v. Board of Education: A Civil Rights Milestone and Its Troubled Legacy (Oxford University Press, 2001)", "Taylor Branch, Pillar of Fire: America in the King Years 1963–65 (Simon & Schuster, 1998)"]

- id: suriname-independence-1954
  year: 1954
  endYear: 1975
  title:
    ko: "네덜란드 왕국 헌장과 수리남의 독립(1954~1975)"
  summary:
    ko: "네덜란드령 수리남은 2차 세계 대전 뒤 자치를 넓혀 가다가 1954년 12월 15일 네덜란드 왕국 헌장으로 네덜란드·네덜란드령 안틸레스와 함께 왕국을 이루는 자치 구성국이 되었고, 국방과 외교는 왕국 정부가 맡았다. 수리남은 인도계(힌두스타니)·아프리카계(크리올)·자바계 외에 탈주 노예의 후손인 마룬과 원주민이 사는 나라였고 정치도 그 집단별로 나뉜 정당 정치였으며, 1970년대 들어 네덜란드가 독립을 먼저 제안해 1973년부터 국민당(NPS)이 이끄는 수리남 정부와 독립 협상이 시작되었다. 1973년 선거 뒤 총리가 된 헨크 아론의 정부 아래 1975년 11월 25일 수리남이 네덜란드에서 독립했고(남아메리카에서 가장 작은 독립국으로 면적 약 16만 4천 km², 공용어는 네덜란드어이다) 요한 페리에르가 형식상의 국가 원수인 초대 대통령이 되었고 당시 인구는 40만 명 안팎이었는데 경제는 미국계 알코아 계열이 캐던 보크사이트에 크게 기대고 있었으며, 네덜란드는 약 15억 달러의 개발 원조를 1985년까지 약속했다. 독립 앞뒤로(특히 1974~1975년에) 인구의 약 3분의 1이 네덜란드로 옮겨 갔는데, 독립 뒤 사회가 불안해질까 하는 걱정과 네덜란드 시민권을 가질 기회가 겹친 결과였다. 1980년 2월 하사관들이 일으킨 쿠데타로 아론 정부가 무너지고 데시 보우터르서가 실권을 잡았으며, 페리에르 대통령은 새 정부를 인정하지 않고 헨크 친아선을 총리로 세웠으나, 다섯 달쯤 뒤 군부가 페리에르를 몰아내고 친아선을 대통령에 앉혔다. 1982년 12월에는 군부가 정치인·언론인 등 15명을 처형했고, 네덜란드는 이를 이유로 원조를 끊었으며, 1986년부터 1992년까지 내륙에서 내전이 이어졌다."
  subjects: [dutch-suriname, suriname, netherlands]
  links:
    - { from: netherlands, to: suriname, note: "독립을 승인 (1975-11-25)" }
  tags: [politics, diplomacy]
  sources: ["Gert Oostindie and Inge Klinkers, Decolonising the Caribbean: Dutch Policies in a Comparative Perspective (Amsterdam University Press, 2003)", "Rosemarijn Hoefte, Suriname in the Long Twentieth Century: Domination, Contestation, Globalization (Palgrave Macmillan, 2014)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]

- id: west-indies-federation-1958
  year: 1958
  endYear: 1966
  title:
    ko: "서인도 연방과 트리니다드 토바고·바베이도스의 독립(1958~1966)"
  summary:
    ko: "1958년 1월 3일 영국은 자메이카·트리니다드 토바고·바베이도스를 비롯한 영국령 열 곳(앤티가·바베이도스·도미니카·그레나다·자메이카·몬트세랫·세인트키츠 네비스 앵귈라·세인트루시아·세인트빈센트·트리니다드 토바고)을 묶어 서인도 연방을 세웠다. 인구는 약 300만~400만 명으로 자메이카(약 166만 명)와 트리니다드 토바고(약 90만 명)가 대부분을 차지했고 총리는 바베이도스의 그랜틀리 애덤스, 수도는 트리니다드의 차과라마스(실제 정부는 포트오브스페인에 있었다)였다. 1958년 3월 25일 첫 연방 선거에서는 애덤스의 서인도 연방 노동당이 26석, 민주 노동당이 19석을 얻었다. 연방은 재정과 이주의 자유, 연방 정부의 힘을 두고 다투었고 트리니다드의 에릭 윌리엄스는 미국 해군이 쓰던 차과라마스 기지의 반환 문제로 미국과 맞섰고, 그와 자메이카의 노먼 맨리 모두 연방과 자기 섬 사이에서 흔들렸다. 1961년 9월 자메이카가 국민 투표에서 54%의 찬성으로 연방 탈퇴를 정했고(맨리는 이듬해 4월 총선에서 졌다), 트리니다드는 1962년 1월 14일 집권당 인민 국민 운동이 연방 불참을 결의했으며, 연방은 1962년 5월 31일 해체되었다(윌리엄스는 '열에서 하나를 빼면 영이다'라는 말로 연방이 설 수 없음을 말했다). 자메이카는 1962년 8월 6일 알렉산더 부스타만테 총리 아래, 트리니다드 토바고는 1962년 8월 31일 윌리엄스 아래 독립했고, 바베이도스는 1966년 11월 30일 독립했으며, 영국은 이들을 영연방 회원국으로 승인했다. 바하마는 1973년에 독립했고, 바베이도스는 에롤 배로우, 트리니다드 토바고는 윌리엄스(1981년 숨질 때까지 집권)가 독립을 이끌었다."
  subjects: [jamaica, trinidad-and-tobago, barbados, uk]
  links:
    - { from: uk, to: jamaica, note: "독립을 승인 (1962-08-06)" }
    - { from: uk, to: trinidad-and-tobago, note: "독립을 승인 (1962-08-31)" }
    - { from: uk, to: barbados, note: "독립을 승인 (1966-11-30)" }
  tags: [politics, diplomacy]
  sources: ["The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)", "Elisabeth Wallace, The British Caribbean: From the Decline of Colonialism to the End of Federation (University of Toronto Press, 1977)", "Eric Williams, From Columbus to Castro: The History of the Caribbean, 1492–1969 (André Deutsch, 1970)"]

- id: alaska-hawaii-statehood-1959
  year: 1959
  endYear: 1959
  title:
    ko: "알래스카·하와이의 주 편입(1959)"
  summary:
    ko: "알래스카는 1867년 러시아에서 사들인 뒤(「알래스카 매입(1867)」(앞의 사건)) 군정과 구역 정부를 거쳐 1912년 준주가 되었고, 2차 세계 대전 때는 일본군이 알류샨 열도의 애투섬과 키스카섬을 점령한 뒤(1942년 6월) 미군이 되찾는 싸움을 치르면서 군사 요충지가 되었다. 알래스카에서는 1955~1956년 헌법 제정 회의가 열려 주 헌법을 만들었고, 1958년 7월 7일 알래스카 주 법이 서명되고 8월 26일 주민 투표에서 약 5대 1의 찬성이 나온 뒤, 1959년 1월 3일 아이젠하워 대통령의 선포로 알래스카가 미국의 49번째 주가 되어 연방 하원에 의원 1명을 보내게 되었다. 면적이 약 170만 km²로 미국에서 가장 큰 주이며, 1964년 3월 27일 성금요일에는 규모 9.2의 대지진이 덮쳐 약 130명이 숨졌고, 뒤이어 1968년 프루드호만에서 대형 유전이 발견되어 1977년 송유관이 완공되었고 1971년 알래스카 원주민 청구 해결법이 원주민 단체에 약 4,400만 에이커의 땅과 약 9억 6천만 달러의 보상을 주기로 했다. 하와이는 1898년 병합과 1900년 준주 편입을 거쳐 1959년 3월 연방 의회의 편입법을 거쳐 6월 27일 주민 투표에서 약 94%의 찬성이 나온 뒤 8월 21일 50번째 주가 되었다. 두 곳의 편입은 남부 민주당 의원들의 반대(하와이는 주민 다수가 백인이 아니라는 점도 걸림돌이었다)와 정당 균형 문제로 오래 미뤄졌고, 1954년에는 상원의 반대 연합이 두 곳을 한 묶음으로 묶어 함께 막으려 했다. 이로써 미국 본토 밖에 두 주가 생겼고 성조기의 별은 50개가 되어 새 국기가 1960년 7월 4일부터 쓰였다."
  subjects: [usa]
  links: []
  tags: [politics]
  sources: ["Claus-M. Naske and Herman E. Slotnick, Alaska: A History (University of Oklahoma Press, 3rd ed., 2011)", "Roger Bell, Last Among Equals: Hawaiian Statehood and American Politics (University of Hawaii Press, 1984)", "Stephen Haycox, Alaska: An American Colony (University of Washington Press, 2002)"]

- id: dominican-intervention-1961
  year: 1961
  endYear: 1966
  title:
    ko: "트루히요 암살과 미국의 도미니카 공화국 개입(1961~1966)"
  summary:
    ko: "라파엘 트루히요는 1930년부터 도미니카 공화국을 군부와 정보 기관으로 다스렸고, 1937년 10월 국경 지대에서 아이티계 주민을 학살한 '파슬리 학살'(희생자 추산은 약 1만 4천~4만 명 안팎으로 갈리나 학계는 대체로 약 2만 명으로 본다)을 일으켰다. 1961년 5월 30일 트루히요가 군 장교들의 매복으로 암살되었는데 중앙 정보국이 무기를 건넨 사실이 알려져 있다. 1960년 8월 미주 기구가 베네수엘라 대통령 암살 기도를 이유로 트루히요 정권을 제재한 바 있고, 1961년 11월 트루히요 일가가 망명했고 1962년 1월 트루히요 암살 때 대통령이던 호아킨 발라게르가 물러난 뒤 라파엘 보넬리의 국가 평의회가 들어섰으며, 1962년 12월 선거에서 오랜 망명에서 돌아온 후안 보슈가 당선되어 1963년 2월 27일 취임했고 4월 새 헌법을 공포했으나 교회·군·지주가 공산주의라 비난했고 9월 25일 군의 쿠데타로 쫓겨났다. 군부가 세운 삼두 정부(1963년 12월부터 도널드 레이드 카브랄이 이끌었다)에 맞서 1965년 4월 24일 보슈의 복귀를 요구하는 '헌정파' 군인과 시민이 봉기해 내전이 벌어졌고 프란시스코 카아마뇨 대령이 5월 헌정파의 대통령으로 선출되었으며, 미국 존슨 정부는 쿠바 같은 나라가 또 생기는 것을 막겠다며 4월 28일 수도 산토도밍고에 해병대를 상륙시켜 한때 병력이 2만 명을 넘었다. 이어 미주 기구 결의로 미주 평화군이 구성되었고(브라질 등이 참가), 1965년 9월 과도 정부(대통령 엑토르 가르시아고도이)가 들어섰으며, 미군과 평화군은 1966년 9월까지 머물렀다. 1966년 6월 선거에서 트루히요 정권에 봉사했던 호아킨 발라게르가 보슈를 물리치고 당선되어 7월 1일 취임해 1978년까지 연속으로 집권했다. 내전의 사망자는 추산 수천 명이다."
  subjects: [dominican-republic, usa]
  links: []
  tags: [politics, war]
  sources: ["Piero Gleijeses, The Dominican Crisis: The 1965 Constitutionalist Revolt and American Intervention (Johns Hopkins University Press, 1978)", "Eric Paul Roorda, The Dictator Next Door: The Good Neighbor Policy and the Trujillo Regime in the Dominican Republic, 1930–1945 (Duke University Press, 1998)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]

- id: brazil-coup-1964
  year: 1964
  endYear: 1974
  title:
    ko: "브라질 군사 쿠데타와 군정(1964~1974)"
  summary:
    ko: "1961년 8월 25일 자니우 쿼드루스 대통령이 갑자기 사임하자 하원 의장 라니에리 마질리가 임시로 맡은 뒤 부통령 주앙 굴라르가 군 일부의 반대 속에 의회 중심 체제를 받아들여 취임했고, 1963년 1월 국민 투표로 대통령제가 되살아났다. 굴라르의 '기초 개혁'(농지 개혁 등)이 의회에서 막히고 물가 상승률이 1960년 30.5%에서 1964년 92.1%로 뛰는 가운데 우파와 군, 가톨릭 교회, 언론의 반발이 커졌고 미국도 야당 쪽을 도와 해군 함대를 대기시킨 '형제 샘 작전'을 준비했으나 쓰지는 않았다. 1964년 3월 31일 미나스제라이스에서 군이 봉기했고 굴라르는 우루과이로 망명했으며, 4월 2일 의회가 대통령 자리를 비었다고 선언해 하원 의장 라니에리 마질리가 이어받은 뒤 4월 15일 우베르투 지 알렝카르 카스텔루 브랑쿠 장군이 대통령에 올랐다(굴라르는 1976년 망명지에서 숨졌다). 군정은 1965년 제도법 2호로 기존 정당을 해산해 군정 지지의 국가 혁신 동맹(ARENA)과 야당 브라질 민주 운동(MDB) 둘만 허용했고, 1967년 1월 군정 헌법을 공포했으며, 아르투르 다 코스타 이 시우바(1967~1969) 때인 1968년 12월 13일 제도법 5호가 의회를 닫고 영장 없는 체포를 허용했으며, 1969년 8월 코스타 이 시우바가 쓰러진 뒤 군사 평의회를 거쳐 취임한 에밀리우 가라스타주 메디시(1969~1974) 때 아라과이아강 일대 게릴라가 진압되고 경제가 해마다 약 10% 안팎으로 자랐으나(경제 기적) 고문과 탄압이 심했다. 에르네스투 가이젤(1974~1979)은 '느리고 점진적인 개방'을 내걸었고, 국가 진실 위원회는 2014년 군정기 사망·실종 434명을 공식으로 확인했다."
  subjects: [brazil]
  links: []
  tags: [politics]
  sources: ["Thomas E. Skidmore, The Politics of Military Rule in Brazil, 1964–85 (Oxford University Press, 1988)", "Alfred Stepan, The Military in Politics: Changing Patterns in Brazil (Princeton University Press, 1971)", "The Cambridge History of Latin America, vol. 9: Brazil since 1930 (Cambridge University Press, 2008)"]

- id: panama-canal-treaties-1964
  year: 1964
  endYear: 1979
  title:
    ko: "국기 사건과 토리호스–카터 조약(1964~1979)"
  summary:
    ko: "1903년 11월 미국과 파나마가 맺은 운하 조약은(운하는 대서양과 태평양을 잇는 약 82km의 물길이다) 미국에 운하 지대의 영구적 사용권과 사실상의 주권 행사를 주었고, 지대는 폭 약 16km로 나라 한가운데를 가로질렀고, 미국은 연 25만 달러(1955년 약 193만 달러로 인상)를 냈으며 지대 안에서는 미국 깃발만 걸었다. 1964년 1월 9일(지금은 파나마의 순국 열사의 날) 지대 안 학교에서 파나마 국기를 함께 게양하려던 학생들과 미국 쪽이 충돌해 폭동이 나흘 가까이 이어졌고, 파나마 사람 20여 명이 숨지고 약 500명이 다쳤으며 파나마 정부는 이튿날 미국과의 외교 관계를 끊었다(4월 3일 회복). 1967년 합의한 조약안은 파나마 안의 반발로 비준되지 못했고, 1968년 군사 쿠데타로 오마르 토리호스가 실권을 쥔 뒤 반환을 둘러싼 협상이 이어졌으며, 1977년 9월 7일 워싱턴에서 지미 카터 대통령과 토리호스가 파나마 운하 조약과 중립 조약을 서명했다. 파나마는 10월 23일 국민 투표에서 67.4% 찬성으로 비준했고, 미국 상원은 1978년 3월 16일(중립 조약, 미국의 방어 권리를 확인하는 수정안을 더함)과 4월 18일(운하 조약)에 각각 68 대 32로 승인했다. 조약은 1979년 10월 1일 효력이 생겨 운하 지대가 없어지고 파나마의 관할이 돌아왔으며, 운하의 운영은 미국·파나마 공동의 운하 위원회를 거쳐 1999년 12월 31일 낮 파나마로 완전히 넘어갔다. 중립 조약은 2000년 뒤에도 이어지는 영구 조약으로 운하가 중립이며 중립을 지키기 위해 미국이 방어할 권리를 가진다고 정했다."
  subjects: [panama, usa]
  links: []
  tags: [diplomacy, politics]
  sources: ["Walter LaFeber, The Panama Canal: The Crisis in Historical Perspective (Oxford University Press, updated ed., 1989)", "Michael L. Conniff, Panama and the United States: The Forced Alliance (University of Georgia Press, 1992)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]

- id: che-guevara-1966
  year: 1966
  endYear: 1967
  title:
    ko: "체 게바라의 볼리비아 게릴라(1966~1967)"
  summary:
    ko: "1928년 아르헨티나 로사리오에서 태어난 의사 체 게바라는 쿠바 혁명의 지도자 가운데 한 사람으로 쿠바 국립 은행 총재와 산업 장관을 지낸 뒤 1965년 콩고에서 반군을 도왔으나 성과 없이 7개월 만에 물러났고, 1966년 11월 3일 '라몬'이라는 가명으로 변장하고 라파스를 거쳐 볼리비아에 들어가 남동부 냥카우아수 계곡에 민족 해방군(ELN)이라 부른 게릴라 부대를 꾸렸다. 대원은 쿠바인·볼리비아인·페루인 등 50명 안팎이었고, 볼리비아 공산당은 지도부 마리오 몬혜 등이 따르지 않아 거리를 두었다. 레네 바리엔토스 정부는 미국의 군사 고문 지원 아래 훈련받은 레인저 부대를 보냈고 천식을 앓던 게바라의 부대는 1967년 3월 첫 교전을 치렀고 8월 31일 한 부대가 강을 건너다 매복에 걸려 전멸하는 등 밀렸으며 농민의 도움을 거의 얻지 못한 채 쫓겼고, 합류하려던 프랑스 지식인 레지 드브레도 4월 붙잡혔다. 1967년 4월 그는 삼대륙 연대 기구에 '제2, 제3의 베트남'을 만들자는 글을 보냈다. 10월 8일 게바라는 유로 협곡에서 부상한 채 붙잡혀 10월 9일 라이게라 마을 학교에서 만 39세로 총살되었고(집행은 마리오 테란 하사), 시신은 지문 확인을 위해 손이 잘린 채 공개되었고 10월 15일 카스트로가 사망을 확인하며 사흘간의 애도를 선포했으며, 유해는 오랫동안 숨겨져 있다가 1997년 발라그란데 근처에서 발굴되어 쿠바로 옮겨졌다. 쿠바 혁명의 방식을 다른 나라에서 되풀이하려던 시도는 이로써 크게 꺾였지만, 게바라는 그가 남긴 『볼리비아 일기』와 함께 라틴아메리카와 그 밖의 세계에서 혁명의 상징으로 남았다."
