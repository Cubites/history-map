  title:
    ko: "영국령 온두라스에서 벨리즈로: 이름 바꿈과 독립(1973~1981)"
  summary:
    ko: "영국령 온두라스(지금 벨리즈)는 17세기 중엽부터 영국 벌채업자(베이맨)가 정착한 땅으로, 1798년 스페인의 마지막 공격을 물리친 뒤(「세인트조지스 케이 전투와 벨리즈의 베이맨 정착지(1798)」(앞의 사건)) 영국인 정착지로 이어져 1862년 왕령 식민지가 되었고, 1961년 10월 허리케인 하티가 옛 수도 벨리즈시티를 휩쓴 뒤 내륙에 새로 짓는 벨모판으로 수도를 옮기기로 했고 1970년 정부 청사가 옮겨 갔다. 1964년 1월 내정 자치를 얻었고 인민 연합당의 조지 프라이스가 정부를 이끌었으며, 1973년 6월 이름이 영국령 온두라스에서 벨리즈로 바뀌었다. 이웃 과테말라는 식민 시기 스페인의 권리를 이어받았다며 벨리즈 땅의 전부나 일부를 오래 자기 영토라 주장했고, 영국은 이 위협 때문에 군을 주둔시켰고, 1975년과 1977년 과테말라가 국경에 병력을 모을 때는 병력과 전투기를 더 보냈다. 독립 협상은 과테말라의 반대로 풀리지 않았고, 1980년 11월 유엔 총회는 벨리즈의 독립을 요구하는 결의를 채택했다. 1981년 9월 21일 벨리즈는 과테말라와 합의 없이 독립했고 프라이스가 초대 총리가 되었으며, 영국 부대는 독립 뒤에도 벨리즈 정부의 요청으로 남아 있다가 1994년 훈련 부대만 남기고 모두 철수했다. 프라이스는 과테말라가 제안한 '연합 국가(associated state)' 지위도 거절했다. 과테말라 대통령은 1990년대 초 벨리즈의 독립을 승인했으나 영토 분쟁은 풀리지 않아, 2018년 과테말라와 2019년 벨리즈의 국민 투표가 모두 이 문제를 국제 사법 재판소에 맡기는 데 찬성했다. 독립 때 인구는 약 15만 명 안팎이었다. 독립한 벨리즈는 영연방의 일원으로 영국 왕을 국가 원수로 삼았다."
  subjects: [belize, guatemala, uk]
  links:
    - { from: uk, to: belize, note: "독립을 승인 (1981-09-21)" }
  tags: [politics, diplomacy]
  sources: ["The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)", "Assad Shoman, Thirteen Chapters of a History of Belize (Angelus Press, 1994)", "C. H. Grant, The Making of Modern Belize: Politics, Society and British Colonialism in Central America (Cambridge University Press, 1976)"]

- id: operation-condor-1975
  year: 1975
  endYear: 1983
  title:
    ko: "콘도르 작전과 남아메리카 군사 정권(1975~1983)"
  summary:
    ko: "1970년대 남아메리카 남부에서는 군사 정권이 줄줄이 들어서 있었다. 파라과이는 알프레도 스트로에스네르가 1954년부터, 볼리비아는 우고 반세르가 1971년부터, 우루과이는 1973년 6월 27일 대통령이 군과 손잡고 의회를 해산한 뒤 민간·군 독재가 이어졌고, 브라질은 1964년부터 군정이었고 「브라질 군사 쿠데타와 군정(1964~1974)」(앞의 사건), 칠레는 피노체트가 1973년 정권을 잡았다 「아옌데의 인민 연합과 1973년 칠레 쿠데타(1970~1973)」(앞의 사건). 1975년 11월 25일 칠레 산티아고에서 아르헨티나·볼리비아·칠레·파라과이·우루과이 군 정보 기관의 책임자들이 모여 망명한 반대파를 서로의 영토에서 추적하고 체포·인도·살해하는 협력 체제인 콘도르 작전을 정식으로 세웠고, 브라질은 1976년 6월 뒤늦게 가담했으나 라틴아메리카 밖의 작전에는 나서지 않았다. 1976년 3월 24일 아르헨티나에서는 호르헤 라파엘 비델라 장군이 이끄는 군사 평의회가 이사벨 페론 정부를 무너뜨리고 '더러운 전쟁'이라 불리는 탄압을 시작했다. 콘도르 작전의 피해자는 최소 6만 명으로 추산하는 자료도 있고, 국경을 넘어 이루어진 작전의 희생자는 400~500명으로 본다(J. 패트리스 맥셰리의 2002년 집계는 국경을 넘은 작전에서 숨지거나 실종된 사람을 최소 402명으로 본다). 미국 정부가 어디까지 알았고 관여했는지는 연구마다 평가가 갈린다. 작전은 1983년 아르헨티나 군정이 무너지며 끝난 것으로 본다. 1976년 9월 21일 워싱턴에서 칠레 전 외무 장관 올란도 레텔리에르가 차량 폭탄으로 미국인 동료 로니 모피트와 함께 숨진 일은 이 협력 체제의 사례로 꼽힌다."
  subjects: [argentina, chile, uruguay, paraguay, bolivia, brazil]
  links: []
  tags: [politics, war]
  sources: ["J. Patrice McSherry, Predatory States: Operation Condor and Covert War in Latin America (Rowman & Littlefield, 2005)", "John Dinges, The Condor Years: How Pinochet and His Allies Brought Terrorism to Three Continents (The New Press, 2004)", "The Cambridge History of Latin America, vol. 8: Latin America since 1930: Spanish South America (Cambridge University Press, 1991)"]

- id: nicaraguan-revolution-1979
  year: 1979
  endYear: 1990
  title:
    ko: "산디니스타 혁명과 콘트라 전쟁(1979~1990)"
  summary:
    ko: "니카라과는 1936년부터 소모사 가문이 사실상 나라를 다스렸고, 1956년 아버지 아나스타시오 소모사 가르시아가 암살된 뒤 맏아들 루이스 소모사 데바일레가 1963년까지 이어받았고, 1967년 동생 아나스타시오 소모사 데바일레가 대통령에 올랐다. 1972년 마나과 지진의 구호 물자를 정권이 가로챘다는 비판이 퍼졌고, 1978년 1월 10일 정권 비판 신문 『라프렌사』의 편집인 페드로 호아킨 차모로가 피살되자 마나과에서 폭동이 일었다. 산디니스타 민족 해방 전선(FSLN)이 1978~79년 전국 봉기를 이끌었고, 전투에서 1만~5만 명이 숨졌다는 추산이 있다. 소모사가 1979년 7월 17일 사임해 마이애미로 떠났고 7월 19일 산디니스타가 수도 마나과에 들어가 다섯 사람의 국가 재건 평의회(다니엘 오르테가 등)가 나라를 맡았다. 1981년 로널드 레이건 정부가 들어선 뒤 미국은 원조를 끊고 온두라스 국경의 반정부 무장 세력인 콘트라를 지원했으며, 콘트라 전쟁은 1990년까지 이어져 3만 2천~4만 3천 명이 숨졌다는 추산이 있다. 1986년 6월 27일 국제 사법 재판소는 미국이 니카라과에 무력을 쓰고 항구에 기뢰를 설치한 것이 국제법 위반이라고 판결했다. 1986년 말부터 드러난 이란–콘트라 사건은 이란에 무기를 팔아 얻은 돈이 콘트라로 흘러간 일로 레이건 정부를 흔들었다. 1988년 3월 사포아 휴전, 1989년 텔라 합의로 콘트라는 해산했고, 1990년 2월 25일 선거에서 비올레타 차모로가 이끄는 야당 연합이 오르테가를 누르고 승리했다. 같은 시기 이웃 엘살바도르에서는 1979년부터 1992년까지 내전이 이어졌다. 산디니스타는 1980년 문맹 퇴치 운동과 토지 개혁을 벌였고, 1984년 11월 선거에서 오르테가가 대통령에 뽑혔으나 경제는 전쟁으로 무너졌다."
  subjects: [nicaragua, usa]
  links: []
  tags: [politics, war]
  sources: ["The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)", "Walter LaFeber, Inevitable Revolutions: The United States in Central America (W. W. Norton, 2nd ed., 1993)", "Matilde Zimmermann, Sandinista: Carlos Fonseca and the Nicaraguan Revolution (Duke University Press, 2000)"]
