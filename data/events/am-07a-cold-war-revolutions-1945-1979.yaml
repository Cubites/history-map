- id: associated-states-1967
  year: 1967
  endYear: 1979
  title:
    ko: "서인도 연합주와 그레나다·도미니카 연방·세인트루시아·세인트빈센트 그레나딘의 독립(1967~1979)"
  summary:
    ko: "서인도 연방이 해체된 뒤에도 작은 섬들은 독립 국가를 꾸릴 힘이 모자랐고, 영국은 1967년 서인도 법으로 앤티가·도미니카·그레나다·세인트키츠 네비스 앵귈라·세인트루시아·세인트빈센트를 서인도 연합주로 묶어 내정은 각 섬이 맡고 국방과 외교는 영국이 맡게 했다. 인구 약 6천 명 안팎의 앵귈라는 1967년 5월 세인트키츠 네비스 지배를 거부하고 분리를 선언했고 영국이 1969년 3월 낙하산 병력 약 300명과 경찰을 보내 질서를 회복했으며 앵귈라는 1980년 12월 연합주에서 떨어져 영국의 별도 속령이 되었다. 연합주 헌법은 어느 섬이든 의회의 결정으로 연합을 끝내고 독립할 수 있게 했다. 그레나다는 에릭 게리 총리 아래 1974년 2월 7일 가장 먼저 독립했으나(게리는 1979년 3월 모리스 비숍의 쿠데타로 쫓겨났다), 도미니카 연방(Commonwealth of Dominica)은 패트릭 존 총리 아래 1978년 11월 3일, 세인트루시아(영국과 프랑스가 여러 번 번갈아 차지했던 섬)는 1979년 2월 22일 존 콤프턴 총리 아래, 본섬과 그레나딘 제도로 이루어진 세인트빈센트 그레나딘은 1979년 10월 27일 밀턴 케이토 총리 아래 각각 독립해 영연방에 남았다. 모두 인구 7만~12만 명 안팎의 작은 나라였고 1981년 이웃 섬들과 함께 동카리브 국가 기구를 만들었다. 앤티가와 세인트키츠 네비스는 1981년과 1983년에 독립하여 「앤티가 바부다와 세인트키츠 네비스의 독립(1981~1983)」(뒤의 사건)으로 이어졌다. 도미니카 연방은 이름이 비슷한 도미니카 공화국(히스파니올라섬)과 다른 나라로, 서인도 제도 동쪽 윈드워드 제도의 섬나라이다."
