- id: football-war-1969
  year: 1969
  endYear: 1969
  title:
    ko: "축구 전쟁(1969)"
  summary:
    ko: "온두라스는 1962년 농지 개혁법을 만들어 1967년 무렵까지 엄격히 시행했고, 소유 근거가 분명치 않은 땅에서 사람들을 내쫓았다. 그 땅에는 인구가 많고 땅이 좁은 엘살바도르에서 건너와 농사짓던 이주민이 많았고, 이들이 대거 엘살바도르로 되돌려 보내지면서 두 나라 사이의 긴장이 커졌다. 1970년 월드컵 예선에서 두 나라가 만나 1969년 6월 8일 테구시갈파에서 온두라스가 1대 0, 6월 15일 산살바도르에서 엘살바도르가 3대 0으로 이겼고, 경기장 안팎의 폭력과 양국 언론의 선동이 겹쳤다. 결정전 전날 밤인 6월 26일 엘살바도르가 외교 관계를 끊었고, 6월 말 멕시코시티에서 열린 결정전은 엘살바도르가 연장 끝에 3대 2로 이겼다. 7월 14일 엘살바도르(대통령 피델 산체스 에르난데스)의 공군과 지상군이 온두라스(대통령 오스발도 로페스 아레야노)를 공격해 전쟁이 시작되었고, 미주 기구가 긴급 회의를 열어 중재한 끝에 7월 18일 밤 휴전이 이루어져 엘살바도르 군대는 8월 2일 물러났다. 사망자 수는 갈려서, 공식 발표는 엘살바도르 107명과 온두라스 99명이지만 현지 사제는 약 400명을, 미국 중앙 정보국 내부 문서는 최대 1,500명을 들며 대부분 민간인이었다고 본다. 엘살바도르 사람 6만~13만 명이 쫓겨났다는 추산도 있다. 1980년 10월 30일 페루 리마에서 평화 조약이 서명되었고, 국경은 1992년 국제 사법 재판소가 분쟁 지역의 대부분을 온두라스에 주는 판결을 내렸으며 엘살바도르는 1999년에야 받아들였다. 전쟁이 나흘 남짓 만에 끝나 '100시간 전쟁'이라고도 부르며, 온두라스는 1971년 중앙아메리카 공동 시장에서 탈퇴했다."
  subjects: [honduras, el-salvador]
  links: []
  tags: [war, politics]
  sources: ["The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)", "Thomas P. Anderson, The War of the Dispossessed: Honduras and El Salvador, 1969 (University of Nebraska Press, 1981)", "William H. Durham, Scarcity and Survival in Central America: Ecological Origins of the Soccer War (Stanford University Press, 1979)"]
