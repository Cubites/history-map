# 아메리카 사건 1묶음 갈래 07a(am-07a): 냉전과 혁명 — 페론·뉴펀들랜드의 캐나다 합류·리오 조약과 미주 기구·과테말라 쿠데타·볼리비아 혁명·쿠바 혁명·가이아나·민권 운동·수리남·서인도 연방·알래스카와 하와이의 주 편입·도미니카 공화국 개입·브라질 군정·파나마 운하 조약·체 게바라·서인도 연합주·틀라텔롤코·축구 전쟁·칠레 쿠데타·벨리즈·콘도르 작전·산디니스타 혁명 (1945 ~ 1979년)
# 범위: 1945~1979년 아메리카의 냉전 정치, 쿠바 혁명, 군사 정권, 영국·네덜란드령 카리브와 기아나의 독립, 뉴펀들랜드의 캐나다 합류. 뒤 시기(1980년~)는 07b 몫이다.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 한 나라의 긴 과정은 한 사건에 묶었고, 독립 사건 하나가 여러 나라의 탭 칸을 채우므로 본문에 그 나라 항목 이름을 모두 적었다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 저장소 기존 표기를 따랐다. 이름만 바뀐 나라는 그때 이름으로 쓰고 항목 이름을 함께 적었다. 사망자·희생자·실종자는 범위와 추산으로 적었고 한 숫자로 못 박지 않았다.
#   분쟁과 학살(쿠데타와 군사 정권의 희생자, 틀라텔롤코, 축구 전쟁, 과테말라 내전 등)은 일어난 일과 숫자만 적었고 어느 쪽 시각도 따르지 않았다.
# 지도 해와의 관계: 영국령·네덜란드령 식민 단위(영국령 기아나·네덜란드령 수리남·서인도 연합주)는 구성 단위별 항목으로 두고 연방·연합 자체는 글로 적었다.
# 한국사와 닿는 점: 6·25 전쟁에 콜롬비아가 라틴아메리카에서 유일하게 보병 대대를 보낸 일을 한 구절로 적었다. 한국사 파일의 글은 고치지 않는다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(국제 연합의 창설, 북대서양 조약 기구의 결성, 쿠바 미사일 위기, 플랫 수정안과 쿠바 공화국의 출범(1901~1903)).

- id: peron-1946
  year: 1946
  endYear: 1955
  title:
    ko: "후안 페론 정부와 1955년 군사 쿠데타(1946~1955)"
  summary:
    ko: "1943년 6월 아르헨티나 군사 쿠데타 뒤 노동 장관으로 노동 조합과 손잡은 후안 페론 대령은 1945년 10월 9일 군 안의 반발로 물러나 체포되었으나, 10월 17일 노동자들이 부에노스아이레스 5월 광장에 모여 석방을 요구한 일(훗날 '충성의 날')로 정치에 되돌아왔다. 페론은 1946년 2월 24일 선거에서 노동당 후보로 급진 시민 연합이 이끈 연합의 호세 탐보리니를 누르고 6월 4일 군정 대통령 에델미로 파렐의 뒤를 이어 대통령에 취임했으며, 노동 조합의 지지와 임금 인상·사회 보장으로 정권을 다졌다. 1946년 중앙은행이 국유화되었고 영국계 철도는 1948년 3월 국유화되었으며, 1947년 9월 23일 여성 참정권법이 제정되어 1951년 대통령 선거에서 여성이 처음 투표했다. 1951년에는 야당 신문 「라프렌사」를 몰수했고, 1952년에는 물가 상승과 흉작 속에 임금·물가 동결과 긴축 계획을 내놓았다. 아내 에바 페론(에비타)은 1952년 7월 숨질 때까지 노동자 복지 활동과 여성 참정권 운동으로 지지를 모았고, 1949년 3월 새 헌법이 1853년 헌법을 대체해 재선의 길을 열어 페론은 1951년 재선되어 1952년 6월 4일 두 번째 임기에 들어갔다. 1954년부터 이혼법과 교육 문제를 두고 가톨릭 교회와 충돌이 깊어졌고, 1955년 6월 해군 항공대가 5월 광장을 폭격해 약 300명이 숨졌고, 9월 16일 에두아르도 로나르디 장군이 '해방 혁명'이라 부른 쿠데타를 일으켜 페론은 9월 21일 물러나 파라과이 등지로 망명했다(1973년 귀국). 로나르디가 9월 23일 임시 대통령이 되었다가 11월 13일 페드로 에우헤니오 아람부루 장군이 이어받았다."
  subjects: [argentina]
  links: []
  tags: [politics]
  sources: ["The Cambridge History of Latin America, vol. 8: Latin America since 1930: Spanish South America (Cambridge University Press, 1991)", "David Rock, Argentina 1516–1987: From Spanish Colonization to Alfonsín (University of California Press, 1987)", "Daniel James, Resistance and Integration: Peronism and the Argentine Working Class, 1946–1976 (Cambridge University Press, 1988)"]

- id: newfoundland-confederation-1946
  year: 1946
  endYear: 1949
  title:
    ko: "국민 투표와 뉴펀들랜드의 캐나다 합류(1946~1949)"
  summary:
    ko: "뉴펀들랜드는 1907년 자치령이 되었으나 대공황 속에 수산물 값이 떨어지고 빚 부담이 커져 1933년 말 스스로 자치 정부를 내려놓았고, 1934년 2월 16일부터 영국이 보낸 총독과 뉴펀들랜드인 셋·영국인 셋의 위원이 다스리는 위원회 정부 아래 있었다. 영국은 1946년 국민 회의(의장 시릴 폭스 판사, 선출 의원 45명 — 1946년 6월 21일 선거로 뽑아 9월에 개회)를 열어 앞날의 정체를 논의하게 했고, 조이 스몰우드는 그해 10월 캐나다와 교섭할 대표단을 보내자는 안을 냈으나 받아들여지지 않았다. 1948년 3월 영국 정부가 국민 회의의 뜻을 누르고 캐나다 합류를 투표지에 넣게 하여, 6월 3일 1차 투표에서 책임 정부 복귀 44.55%·캐나다 합류 41.13%·위원회 정부 유지 14.32%로 과반이 나오지 않자 7월 22일 결선 투표가 열렸다. 결선에서 캐나다 합류가 52.34%(78,323표), 책임 정부 복귀가 47.66%(71,334표)로 이겼고, 1949년 3월 31일 자정 뉴펀들랜드는 캐나다의 열 번째 주가 되어 자치령 시대(1907~1949)가 끝났다. 스몰우드가 4월 1일 첫 주 총리에 취임해 1972년까지 이끌었고, 합류 조건은 1948년 12월 오타와에서 서명되어 캐나다가 뉴펀들랜드의 부채를 떠안고 가족 수당과 노령 연금을 적용하기로 했으며, 1927년 영국 추밀원 판결로 뉴펀들랜드에 속해 있던 래브라도도 함께 캐나다에 들어갔다. 합류 반대 쪽은 책임 정부 연맹과 피터 캐신 등이 이끌었고, 이 합류가 이루어진 직후 캐나다는 「북대서양 조약 기구의 결성」(뒤의 사건)에도 창설국으로 참여했다."
  subjects: [newfoundland, canada, uk]
  links:
    - { from: canada, to: newfoundland, note: "뉴펀들랜드의 합류를 받아들여 열 번째 주로 삼음 (1949-03-31)" }
  tags: [politics, diplomacy]
  sources: ["Peter Neary, Newfoundland in the North Atlantic World, 1929–1949 (McGill-Queen's University Press, 1988)", "David Alexander, Atlantic Canada and Confederation: Essays in Canadian Political Economy (University of Toronto Press, 1983)", "Raymond B. Blake, Canadians at Last: Canada Integrates Newfoundland as a Province (University of Toronto Press, 1994)"]

- id: rio-treaty-oas-1947
  year: 1947
  endYear: 1948
  title:
    ko: "리오 조약과 미주 기구(1947~1948)"
  summary:
    ko: "2차 세계 대전이 끝나 가던 1945년 2~3월 멕시코시티에서 열린 차풀테펙 회의에서 미주 나라들은 한 나라에 대한 공격을 모두에 대한 공격으로 본다는 원칙에 합의했고(「국제 연합의 창설」(앞의 사건)과 같은 때), 이 원칙을 조약으로 옮긴 것이 1947년 9월 2일 브라질 리우데자네이루에서 서명한 미주 상호 원조 조약(리오 조약)이다. 1948년 4월 30일에는 콜롬비아 보고타에서 21개 나라가 미주 기구 헌장에 서명해 옛 범미주 연합을 이은 미주 기구가 세워졌고(1951년 12월 효력, 초대 사무총장 알베르토 예라스 카마르고), 미국이 두 문서를 이끌었고, 리오 조약은 브라질 리우데자네이루에서 서명되었다. 1948년 보고타 회의가 한창이던 4월 9일 콜롬비아 자유당 지도자 호르헤 엘리에세르 가이탄이 보고타에서 총에 맞아 숨지자 '보고타소'라 불리는 폭동이 일어나 도심이 불탔고, 이어 보수·자유 양당의 무장 충돌 '라 비올렌시아'('폭력 시대')가 1950년대 후반까지 이어져 희생자가 추산으로 10만~30만 명에 이르렀다. 리오 조약은 서반구의 한 나라가 무력 공격을 받으면 다른 모든 나라가 이를 자기들에 대한 공격으로 보고 돕기로 했으나 군대를 보낼 의무는 지우지 않았고, 미주 기구 헌장은 회원국 내정에 대한 불간섭 원칙을 적었다. 보고타 회의에는 미국 국무 장관 조지 마셜이 참석했으며, 그 회의는 국제 공산주의의 아메리카 개입에 반대하는 결의도 채택했다. 미주 기구는 1962년 1월 푼타델에스테 회의에서 쿠바 정부를 기구의 활동에서 배제했다. 콜롬비아는 6·25 전쟁에 라틴아메리카에서 유일하게 보병 대대를 보냈다."
  subjects: [usa, brazil, colombia]
  links: []
  tags: [diplomacy, politics]
  sources: ["The Cambridge History of Latin America, vol. 6: Latin America since 1930: Economy, Society and Politics, Part 2 (Cambridge University Press, 1994)", "Gordon Connell-Smith, The Inter-American System (Oxford University Press, 1966)", "David Bushnell, The Making of Modern Colombia: A Nation in Spite of Itself (University of California Press, 1993)"]

- id: guatemala-coup-1951
  year: 1951
  endYear: 1954
  title:
    ko: "아르벤스의 농지 개혁과 1954년 과테말라 쿠데타(1951~1954)"
  summary:
    ko: "1931년부터 집권한 독재자 호르헤 우비코가 1944년 7월 시위 끝에 물러나고 10월 혁명으로 후임 정권까지 무너진 뒤, 12월 선거에서 압도적으로 뽑힌 후안 호세 아레발로(1945~1951)가 노동법과 사회 보장을 도입했고, 1951년 3월 15일 하코보 아르벤스 대령이 대통령에 취임했다. 아르벤스는 1952년 6월 17일 법령 900호로 놀리는 땅을 보상하고 수용해 농민에게 나눠 주는 농지 개혁을 시작했고, 1953년에는 철도·항만·바나나 농장을 쥔 미국계 유나이티드 프루트 회사의 안 쓰는 땅 약 20만 에이커가 포함되었는데 정부가 내놓은 보상은 회사가 세금 신고에 적은 값인 약 60만 달러였고 회사는 그 스무 배가 넘는 액수를 요구했으며 1954년 6월까지 약 140만 에이커가 분배되었다. 미국 아이젠하워 정부는 1953년 8월 중앙 정보국의 '성공 작전'(PBSuccess)을 승인해 공산주의 침투를 막는다는 이유로 정권 교체를 꾀했고, 1954년 6월 18일 카를로스 카스티요 아르마스가 온두라스에서 국경을 넘고 중앙 정보국의 비밀 방송이 대군의 침공처럼 보이게 하자 군이 움직이지 않아 아르벤스는 농민에게 무기를 나눠 주려 했으나 군 지휘부가 따르지 않았고 6월 27일 사임해 멕시코 대사관으로 피신했다. 이에 앞서 1954년 3월 카라카스 미주 회의가 공산주의의 아메리카 정부 장악을 경계하는 결의를 채택했고 과테말라가 반대표를 던졌다. 군사 평의회를 거쳐 7월 8일 카스티요 아르마스가 집권해 공산당과 노조를 금지하고 수용된 땅 대부분을 옛 주인에게 돌려주었으며(1957년 피살), 1960년부터 1996년까지 이어진 과테말라 내전에서 약 20만 명이 숨지거나 실종된 것으로 추산된다."
  subjects: [guatemala, usa]
  links: []
  tags: [politics, war]
  sources: ["Piero Gleijeses, Shattered Hope: The Guatemalan Revolution and the United States, 1944–1954 (Princeton University Press, 1991)", "Stephen Schlesinger and Stephen Kinzer, Bitter Fruit: The Story of the American Coup in Guatemala (Harvard University Press, rev. ed., 2005)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]

- id: bolivian-revolution-1952
  year: 1952
  endYear: 1964
  title:
    ko: "볼리비아 혁명(1952~1964)"
  summary:
    ko: "1952년 4월 9일 민족주의 혁명 운동(MNR)이 광부 민병대와 경찰의 가세로 무장봉기해 11일 대통령궁(팔라시오 케마도)을 차지했고 12일 군이 항복했으며, 이 싸움에서 모두 약 490명이 숨졌다. 혁명 직후 노동자 단체 볼리비아 노동 센터(COB)가 결성되어 광산 운영에 대한 노동자 통제를 요구했고 국영 광산은 적자와 생산 감소에 오래 시달렸다. 아르헨티나 망명에서 돌아온 빅토르 파스 에스텐소로가 4월 15일 대통령이 되어(1952~1956; 11~15일은 에르난 실레스 수아소가 임시로 맡았다) 1952년에 보통 선거를 도입해 문자 해독·재산 자격을 없앴고, 군대를 줄이고 광부·농민 민병대를 무장시켰으며, 10월 31일 주석 수출 대부분을 쥐고 있던 파티뇨·호쉴트·아라마요 세 가문의 대형 주석 광산을 국유화해 국영 볼리비아 광산 공사를 세웠다. 1953년 8월 2일 코차밤바 우쿠레냐에서 농지 개혁령이 서명되어 대농장이 해체되고 원주민 농민에게 땅이 돌아갔고, 농민 조합은 MNR 정부의 든든한 지지 기반이 되었다. 대통령직은 에르난 실레스 수아소(1956~1960), 파스 에스텐소로(1960~1964)로 이어졌다. 실레스 수아소 정부는 1956년 미국 원조 속에 통화 안정 계획을 시행해 물가를 잡았으나 광산 노조와 갈등이 커졌고, 1961년에는 미국·서독·미주 개발 은행이 돕는 삼각 계획으로 광산 공사의 재건과 임금 억제가 추진되어 광부의 반발을 샀고, 파스 에스텐소로는 1964년 5월 선거로 임기를 다시 이었으나 1964년 11월 4일 레네 바리엔토스 장군이 쿠데타로 파스 에스텐소로를 몰아내 혁명 정부가 끝났다."
  subjects: [bolivia]
  links: []
  tags: [politics, society]
  sources: ["The Cambridge History of Latin America, vol. 8: Latin America since 1930: Spanish South America (Cambridge University Press, 1991)", "Herbert S. Klein, Bolivia: The Evolution of a Multi-Ethnic Society (Oxford University Press, 2nd ed., 1992)", "James Dunkerley, Rebellion in the Veins: Political Struggle in Bolivia, 1952–82 (Verso, 1984)"]

- id: cuban-revolution-1953
  year: 1953
  endYear: 1961
  title:
    ko: "쿠바 혁명과 피그스만 침공(1953~1961)"
  summary:
    ko: "1952년 3월 10일 풀헨시오 바티스타가 쿠데타로 정권을 잡아 선거를 없애자, 변호사 피델 카스트로가 이끈 청년들이 1953년 7월 26일 산티아고데쿠바의 몬카다 병영을 공격했다가 실패했다. 카스트로 형제와 아르헨티나 태생 의사 체 게바라 등 82명 안팎은 1956년 12월 요트 그란마호로 쿠바 동부 해안에 상륙해 시에라마에스트라 산지에서 게릴라전을 벌였고, 바티스타는 1959년 1월 1일 도미니카 공화국으로 달아났고 게릴라는 곧 수도 아바나에 들어갔다. 판사 마누엘 우루티아가 임시 대통령이 되고 카스트로는 1959년 2월 총리가 되어 개혁을 밀어붙였고, 1959년 5월 17일 농지 개혁법은 토지 소유 한도를 약 400헥타르로 묶었으며, 1960년 2월 소련과 통상 협정을 맺어 소련산 원유를 들여오자 미국계 정유 회사가 정제를 거부해 쿠바는 그해 8월부터 미국 기업 자산을 국유화했다. 미국은 1960년 10월 금수 조치에 이어 1961년 1월 3일 외교 관계를 끊었다. 아이젠하워 정부가 1960년 3월 승인한 계획에 따라 중앙 정보국이 훈련한 쿠바 망명자 부대 '2506 여단' 약 1,400명이 케네디 정부 때인 1961년 4월 17일 피그스만에 상륙했으나 사흘 안에 졌고, 114명이 죽고 1,202명이 포로가 되었다. 카스트로는 그 전날 혁명이 사회주의적이라고 선언했으며, 미국은 그해 11월 쿠바 정부를 흔드는 몽구스 작전을 시작했다. 쿠바는 이어 소련과 더욱 가까워졌고 이는 「쿠바 미사일 위기」(뒤의 사건)로 이어졌다(쿠바 공화국의 출범은 「플랫 수정안과 쿠바 공화국의 출범(1901~1903)」(앞의 사건))."
  subjects: [cuba, usa]
  links: []
  tags: [war, politics]
  sources: ["Louis A. Pérez Jr., Cuba: Between Reform and Revolution (Oxford University Press, 5th ed., 2015)", "Hugh Thomas, Cuba: The Pursuit of Freedom (Harper & Row, 1971)", "The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)"]
