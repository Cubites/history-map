- id: tlatelolco-1968
  year: 1968
  endYear: 1968
  title:
    ko: "틀라텔롤코 학살(1968)"
  summary:
    ko: "1968년 7월 멕시코시티에서 경쟁하는 학생 무리의 싸움을 경찰이 거칠게 진압한 일을 계기로 대학생들이 거리로 나섰고, 이들은 구속된 학생의 석방과 경찰 책임자 처벌 같은 요구를 걸고 전국 학생 파업 위원회를 꾸렸다. 1929년 이래 한 정당(제도혁명당)이 집권해 온 멕시코에서 구스타보 디아스 오르다스 대통령 정부는 라틴아메리카에서 처음으로 열리는 올림픽(10월 12일 개막)을 앞두고 시위를 막으려 했고, 군이 대학 건물을 점령하는 일이 되풀이되었다. 10월 2일 저녁 6시 15분 무렵 멕시코시티 틀라텔롤코 구역의 삼문화 광장에서 학생 집회가 열렸는데, 군과 경찰이 광장을 둘러싼 가운데 하늘에서 신호탄이 오르자 총격이 시작되었다. 정부는 학생 쪽이 먼저 쐈다고 했고 사망자를 수십 명으로 발표했으나, 미국 국가 안보 문서고의 케이트 도일은 사망자 44명의 신원을 확인했고 그 밖의 추산은 300~400명, 인권 단체와 일부 자료는 최대 500명까지 들며, 부상자는 1,000명이 넘고 체포된 사람은 1,345명이라고 한다. 당시 내무 장관은 루이스 에체베리아로 1970년 대통령이 되었다. 올림픽은 예정대로 열렸고, 정부는 오랫동안 사건을 공식으로 다루지 않았다. 이 사건은 멕시코에서 일당 체제의 권위를 흔들어 정치 개방의 시작점으로 꼽히며, 해마다 10월 2일 추모 행진이 열린다. 1967년 이 구역의 외교부 청사에서 서명한 틀라텔롤코 조약(라틴아메리카 비핵 지대 조약)과는 이름만 같다. 2000년 비센테 폭스가 정권을 잡은 뒤 군·정보 기관 문서가 공개되고 2002년 특별 검사가 임명되었으나 책임자 처벌은 이루어지지 않았다. 1971년 6월 10일 학생 행진에 대한 또 한 번의 유혈 진압(성체 축일 학살)도 있었다."
  subjects: [mexico]
  links: []
  tags: [politics, war]
  sources: ["The Cambridge History of Latin America, vol. 7: Latin America since 1930: Mexico, Central America and the Caribbean (Cambridge University Press, 1990)", "Elena Poniatowska, La noche de Tlatelolco (Ediciones Era, 1971)", "Kate Doyle, The Dead of Tlatelolco: Using the Archives to Exhume the Past (National Security Archive Electronic Briefing Book No. 201, 2006)"]
