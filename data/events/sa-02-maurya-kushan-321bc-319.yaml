# 남아시아 사건 2차 묶음(sa-02): 마우리아·슝가·인도-그리스·인도-스키타이·인도-파르티아·쿠샨·서 크샤트라파·사타바하나·데칸 여러 나라·타밀 세 왕국 (기원전 321 ~ 기원후 319년)
# 범위: 찬드라굽타와 마우리아의 성립, 인더스 태수령의 해체와 서북 장악, 셀레우코스와의 조약, 빈두사라·아소카(칼링가·담마·제3결집과 스리랑카 전도)·마우리아의 끝,
#   슝가와 칸바, 데메트리오스에서 메난드로스까지 인도-그리스, 인도-스키타이·인도-파르티아, 쿠샨(카니슈카와 쿠샨샤르), 서 크샤트라파(나하파나·차스타나·루드라다만),
#   사타바하나(시무카·고타미푸트라·야즈냐 슈리)와 카라벨라, 3세기 데칸(이크슈바쿠·아비라·추투·바카타카·팔라바), 상감 시대 타밀 세 왕국과 로마 교역, 스리랑카의 두타가마니와 마힌다.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 같은 일을 둘로 쪼개지 않고 작은 일은 큰 사건 한 문장으로 합쳤다. 간다라·마투라 미술과 대승 불교는 따로 한 사건으로 썼다.
# 날짜: 모두 그레고리력이다. 기원전 연도는 천문 연도(기원전 N년 = 1−N)로 year에 넣고 본문에는 '기원전 N년'으로 적었다. 고대 연대가 갈리는 일(칸바·사타바하나의 시작, 카니슈카의 즉위, 카라벨라)은 범위나 두 학설로, 확실하지 않은 해는 '무렵'으로 적었다.
#   군주의 재위는 위키백과 영어판 왕조 문서의 목록을 따랐고, 푸라나·불교 연대기가 전하는 이름은 전승이라고 밝혔다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 나라 이름은 항목 이름('마우리아 제국', '슝가 제국', '서 크샤트라파')을 따르되 본문에서는 마우리아·슝가처럼 줄여 쓰기도 했다.
#   민감한 일(푸샤미트라의 불교 박해 전승, 칼링가의 숫자)은 주어와 사료, 숫자만 적었다.
# 다른 파일 사건과의 관계: 알렉산드로스의 원정, 셀레우코스 1세와 찬드라굽타의 조약, 안티오코스 3세, 장건, 반초, 불교의 한 전래, 사산의 종교는 다시 쓰지 않고 「제목」으로 가리켰다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성했다. 출처는 표준 개설서와 사료의 원서 위주(한국어 번역본은 쓰지 않음).

- id: maurya-founding-321bc
  year: -320
  title:
    ko: "찬드라굽타와 마우리아 제국의 성립(기원전 321년 무렵)"
  summary:
    ko: "난다 왕조 말기의 마가다는 갠지스 평원을 넓게 거느렸지만, 마지막 왕 다나 난다는 인심을 잃었다고 후대 전승이 전한다. 이 틈에 찬드라굽타가 난다를 무너뜨리고 마우리아 왕조를 열어 파탈리푸트라를 도읍으로 삼았다. 전승은 세 갈래다. 불교 전승은 난다에게 쫓겨난 브라만 차나키아가 찬드라굽타를 키워 쉽게 이겼다고 하고, 자이나와 힌두 전승은 오랜 싸움 끝에 파탈리푸트라가 포위되어 떨어졌다고 하며, 후대 희곡 『무드라락샤사』는 차나키아의 복수를 줄거리로 삼는다. 다나 난다가 쫓겨났는지 죽었는지도 전승마다 다르다. 차나키아를 『아르타샤스트라』의 저자 카우틸랴와 같은 사람으로 보는 것도 나중의 일이고, 오늘날 많은 학자는 이 책이 마우리아 때가 아니라 기원후 1~3세기 무렵에 지금 꼴을 갖췄다고 본다. 알렉산드로스가 죽은 뒤 서북 인도에서 그리스인 총독들이 밀려난 일(「알렉산드로스의 인더스 원정: 히다스페스 전투와 회군, 태수령(기원전 326~325)」, 앞의 사건)과 난다 타도 가운데 어느 쪽이 먼저였는지도 사료가 갈린다. 즉위는 기원전 322~319년으로 보는 설이 통설이고 기원전 311~305년으로 늦추는 견해도 있어, 여기서는 기원전 321년 무렵으로 적는다. 찬드라굽타가 말년에 왕위를 내놓고 남쪽에서 단식으로 생을 마쳤다는 자이나 전승은 훨씬 뒤에 굳어진 이야기로 본다. 찬드라굽타는 기원전 298년 무렵까지 다스렸다고 보며, 마가다의 새 왕조는 난다가 갖춘 세금 제도와 군대, 도읍을 그대로 물려받아 서쪽의 알렉산드로스 후계 세력과 맞섰다. 마우리아라는 이름도 공작(마유라)을 기르던 사람들에서 왔다는 설, 모리야 씨족에서 왔다는 설 등으로 전승마다 다르다. 「마하파드마 난다와 난다 왕조: 시슈나가 왕조의 끝과 갠지스 평원의 통합(기원전 345~322 무렵)」(앞의 사건)에서 다룬 난다의 땅은 이 사건으로 마우리아에 넘어갔다."
  subjects: [maurya-empire, nanda-empire]
  links:
    - { from: maurya-empire, to: nanda-empire, note: "찬드라굽타가 난다 왕조를 무너뜨리고 마가다를 차지함 (기원전 321 무렵)" }
  tags: [politics, war]
  sources: ["Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: punjab-satrapies-317bc
  year: -316
  endYear: -314
  title:
    ko: "알렉산드로스 뒤 인더스 태수령의 해체와 찬드라굽타의 서북 장악(기원전 317~315년 무렵)"
  summary:
    ko: "알렉산드로스는 기원전 326~325년 인더스 원정 뒤 펀자브와 신드에 마케도니아 태수를 두고, 포로스 같은 현지 왕에게도 실권을 맡겼다(「알렉산드로스의 인더스 원정: 히다스페스 전투와 회군, 태수령(기원전 326~325)」, 앞의 사건). 태수 필리포스는 이미 기원전 325년 병사들에게 살해되었고, 알렉산드로스가 기원전 323년 죽자 태수령은 곧 무너졌다. 에우데모스는 포로스를 죽인 뒤 기원전 317년 무렵 코끼리 120마리를 이끌고 인도를 떠나 후계자 전쟁에 뛰어들었으며, 페이톤은 기원전 316년 무렵 아라코시아로 물러났다. 남은 땅은 힘의 공백이 되었고, 그 틈을 찬드라굽타가 파고들었다. 그리스 쪽 기록은 이 과정을 단편으로만 전하고, 인도 쪽 전승은 이 시기를 따로 적지 않아 정확한 순서는 알기 어렵다. 어느 쪽이든 기원전 315년 무렵에는 간다라와 펀자브가 마우리아의 손에 들어와 있었던 것으로 보이며, 이로써 마우리아는 인더스강 건너 서북 변경까지 닿는 나라가 되었다. 이 땅은 얼마 뒤 셀레우코스 1세와의 다툼에서 다시 시험대에 오른다(「찬드라굽타와 셀레우코스 1세의 조약, 메가스테네스의 사행(기원전 305~302년 무렵)」, 뒤의 사건). 디오도로스에 따르면 알렉산드로스가 죽은 뒤 기원전 321년의 트리파라데이소스 분할에서 포로스와 탁실레스가 각자의 땅을 그대로 맡고 페이톤이 인도 서북 쪽 태수령을 받았다고 적는다. 아리아노스(포티오스 요약)는 포로스에게 인더스 땅과 파탈라, 탁실레스에게 히다스페스 땅, 페이톤에게 파라파미소스 접경 땅을 준 것으로 적어, 사료에 따라 받은 땅이 갈린다. 이 체제는 후계자들끼리 싸우는 동안 유지될 수 없었고, 서쪽 전쟁에 군대를 빼 가면서 인도 쪽 방비가 얇아졌다. 마케도니아 본국의 후계자 전쟁은 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」을 가리킨다."
  subjects: [maurya-empire, macedonia-kingdom]
  tags: [politics, war]
  sources: ["Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Diodorus Siculus, Bibliotheke 18.39 (C. Bradford Welles 영역, Loeb, 1963)"]

- id: chandragupta-seleucus-305bc
  year: -304
  endYear: -302
  title:
    ko: "찬드라굽타와 셀레우코스 1세의 조약, 메가스테네스의 사행(기원전 305~302년 무렵)"
  summary:
    ko: "알렉산드로스 뒤 동방 총독으로 힘을 키운 셀레우코스 1세는 기원전 305년 무렵 인더스강을 건너 마우리아의 땅을 시험했다. 싸움의 자세한 경과는 그리스·로마 저자들(스트라본·아피아노스·유스티누스)의 짧은 기록뿐이고, 누가 이겼는지는 고대 저자 누구도 분명히 적지 않았으며 인도 쪽 사료에는 이 일이 없다. 결과는 조약으로 남았다. 셀레우코스는 간다라와 파로파미사다이, 게드로시아 동부를 찬드라굽타에게 넘기고, 아라코시아와 아리아(헤라트까지)는 넘겼는지 학설이 갈리며, 대신 전투 코끼리 500마리를 받았다. 두 왕가가 혼인 동맹을 맺었다는 기록도 있으나 누구와 누구였는지는 알 수 없다. 조약 해는 기원전 303~302년 무렵으로 보며 남아시아 쪽 일만 여기서 쓰고 서쪽의 일은 「셀레우코스 1세와 제국의 성립: 바빌론 회복(기원전 312)·셀레우키아·찬드라굽타와의 조약(기원전 303 무렵)·안티오키아(기원전 300 무렵)」를 가리킨다. 이 코끼리는 기원전 301년 입소스 전투에서 안티고노스를 꺾는 데 쓰였다. 셀레우코스는 사절 메가스테네스를 파탈리푸트라 궁정에 보냈다. 그의 『인도지』는 사라지고 스트라본·아리아노스·디오도로스가 인용한 조각만 전하며, 인도 사회를 일곱 신분으로 나누어 적은 대목으로 유명하다. 이후 두 나라 사이의 국경은 오래 안정되었다. 플루타르코스와 유스티누스는 찬드라굽타를 안드로코토스·산드로코토스라 부르고 60만 대군을 거느렸다고 적었는데 수는 과장일 수 있다. 인도가 코끼리 전투에서 앞섰다는 점은 이 조약이 보여 주는 가장 분명한 사실이다. 이 조약으로 마우리아의 서북 국경은 힌두쿠시 산맥 쪽으로 닿게 되었고, 칸다하르에서 아소카의 그리스어 칙령이 나온 사실과도 맞는다."
  subjects: [maurya-empire, seleucid-empire]
  links:
    - { from: seleucid-empire, to: maurya-empire, note: "간다라·파로파미사다이·게드로시아 동부를 넘기고 코끼리 500마리를 받음 (기원전 303 무렵)" }
  tags: [diplomacy, war]
  sources: ["Strabo, Geographika 15.2.9 (Horace Leonard Jones 영역, Loeb, 1930)", "Appian, Syriake 55 (Horace White 영역, Loeb, 1912)", "Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)"]

- id: maurya-state-300bc
  year: -299
  endYear: -231
  title:
    ko: "마우리아의 통치 체제: 파탈리푸트라와 지방 총독, 군대와 관리(기원전 300~232년 무렵)"
  summary:
    ko: "마우리아는 한 사람의 왕이 갠지스 평원의 도읍 파탈리푸트라에서 인더스강에서 데칸 북부에 이르는 땅을 다스리는 나라였다. 메가스테네스의 조각난 기록은 큰 도읍과 긴 성벽, 왕 곁의 큰 군대와 코끼리 부대를 전하고, 아소카의 칙령은 이 틀이 실제로 어떻게 돌아갔는지 보여 준다. 중심의 마가다 둘레는 왕이 직접 다스리고, 먼 지방에는 왕자나 왕족을 총독으로 보냈다. 아소카는 즉위 전에 서북의 탁실라와 서쪽의 우자인 총독이었고, 비문은 탁실라·우자인·토살리·수바르나기리 같은 도시를 지방 거점으로 들며, 그 아래 고위 관리와 지방 관리가 곡식 거둠·재판·감찰을 맡았다고 적는다. 칙령은 길가에 우물과 나무, 쉼터를 두라는 지시도 남겼다. 이렇게 닿는 땅은 넓었으나 곳곳에서 말이 다르고 교통이 느려 왕의 힘이 도시와 간선 길 둘레에서 가장 강했을 것으로 본다. 『아르타샤스트라』가 그리는 촘촘한 관료제는 이 책의 연대가 마우리아보다 늦다고 보는 학자가 많아 마우리아 때의 실제 모습이라 단정하지 않는다. 아소카 칙령이 새겨진 사암 기둥과 바위 칙령은 이 나라가 문자와 길로 땅을 이었음을 보여 주는 가장 확실한 증거다. 기둥 위의 사자 조각과 윤을 낸 사암 기둥과 그 위의 사자·황소 조각은 궁정이 부린 장인의 솜씨로 본다. 마우리아 시대에는 펀치 마크를 찍은 은화가 널리 쓰여 세금과 교역에 쓰였고, 파트나 쿰라하르에서 나온 기둥 홀 터를 마우리아 궁정과 이어서 보는 학자도 있다. 다만 이 터를 마우리아 것으로 단정할 근거는 약하다고 보는 견해도 있다. 아소카 칙령은 서북에서는 카로슈티 문자와 아람 문자, 그리스 문자로, 나머지 땅에서는 브라흐미 문자로 새겨져 마우리아가 지역마다 다른 글자와 말로 칙령을 알렸음을 보여 준다."
  subjects: [maurya-empire]
  tags: [politics, society]
  sources: ["Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Strabo, Geographika 15.1~15.3 (Horace Leonard Jones 영역, Loeb, 1930)", "Eugen Hultzsch, Inscriptions of Asoka (Clarendon Press, 1925)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: bindusara-297bc
  year: -296
  endYear: -273
  title:
    ko: "빈두사라의 치세와 마우리아의 남진 전승(기원전 297~273년 무렵)"
  summary:
    ko: "찬드라굽타의 아들 빈두사라는 기원전 297년 무렵부터 273년 무렵까지 마우리아를 다스렸다. 그리스 저자들은 그를 아미트로카테스라 불렀는데 '적을 죽이는 자'를 뜻하는 산스크리트어 칭호에서 왔다고 본다. 그의 시대를 다룬 사료는 불교·자이나·푸라나 전승과 그리스 기록이 거의 전부이고 모두 수백 년 뒤의 것이다. 17세기 초 티베트 학자 타라나타(『인도 불교사』, 1608년)는 빈두사라가 두 바다 사이의 땅을 차지했다고 적었는데, 이를 두고 빈두사라가 데칸 남쪽까지 넓혔다는 설과 아버지가 물려준 땅을 지켰을 뿐이라는 설이 갈린다. 이후 아소카 칙령이 칼링가만 빼고 데칸 대부분을 이미 마우리아 땅으로 전제하므로 이 시기에 마우리아의 힘이 남쪽으로 닿았을 가능성은 크다. 탁실라에서 반란이 두 번 일어났다고 전하며, 처음에는 아소카가 진압하러 가고 두 번째에는 맏아들 수시마가 실패했다고 한다. 외교로는 셀레우코스 왕 안티오코스 1세가 사절 데이마코스를 보냈고, 빈두사라가 안티오코스에게 달콤한 포도주와 말린 무화과, 그리고 궤변가 한 명을 청했다는 일화가 전한다. 종교로는 아지비카교를 후원했다고 보는 학자가 있다. 그가 죽은 뒤 아들들 사이에 왕위 다툼이 있었다는 이야기가 전하지만 사료마다 다르다. 데이마코스는 『인도에 관하여』라는 책을 썼다고 스트라본이 인용하나 책은 전하지 않는다. 스리랑카 연대기에는 아소카가 아버지의 명으로 우자인 총독을 지냈다는 이야기도 있다. 그가 죽은 해(기원전 273년 무렵)와 아소카의 대관(기원전 269년 무렵) 사이의 4년은 왕위 다툼 때문이라는 설명이 널리 인용되지만, 이 이야기는 불교 문헌의 극적 서술에 크게 기대고 있어 사료로 쓸 때 조심해야 한다."
  subjects: [maurya-empire, seleucid-empire]
  tags: [politics, diplomacy]
  sources: ["Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "A. L. Basham, History and Doctrines of the Ajivikas (Luzac, 1951)"]

- id: ashoka-kalinga-261bc
  year: -260
  title:
    ko: "아소카의 칼링가 정복과 마음의 변화(기원전 261년 무렵)"
  summary:
    ko: "아소카의 재위는 기원전 268년 무렵부터로 세며(대관은 269년 무렵으로 보기도 한다), 대관 8년째인 기원전 261년 무렵에 동해안의 칼링가를 쳤다. 칼링가는 난다가 한때 다스렸으나 난다가 무너진 뒤 독립해 마우리아가 오래 손대지 못한 땅이었다. 이 싸움은 아소카 바위 칙령 13에 본인 목소리로 적혀 있다. 비문에 따르면 15만 명이 끌려가고 10만 명이 죽었으며 그보다 많은 사람이 다른 이유로 죽었다. 비문은 이 일을 두고 왕이 깊이 뉘우쳤다고 말하며, 앞으로는 무력이 아니라 '담마'로 이겨야 한다고 적는다. 이 비문은 왕이 자신의 행동을 스스로 평가한 드문 사료다. 칙령의 숫자는 왕이 직접 새긴 것이어서 사료로서 값지지만, 선전용 글의 과장일 수 있다는 점을 학자들은 지적한다. 칼링가 지방에 새긴 따로 만든 칙령에는 이 뉘우침 대목이 빠져 있어, 새로 얻은 땅의 백성에게 보내는 글은 어조가 달랐음을 알 수 있다. 칼링가는 이후 마우리아 땅이 되었으나 아소카 사후 어떻게 되었는지는 알 수 없다. 바위 칙령 13은 서북의 샤바즈가리와 만세라, 서쪽의 기르나르, 북쪽의 칼시, 남쪽의 예라구디처럼 마우리아 땅 곳곳에 새겨졌다. 칼링가 지방 도살리와 자우가다에는 따로 지은 칙령이 있어, 관리에게 백성을 자식처럼 대하라고 당부하는 내용이 이어진다. 칼링가 전쟁이 아소카를 실제로 어떻게 바꿨는지는 이 칙령 한 편에 기대고 있다. 아소카가 그전부터 불교에 기울고 있었다고 보는 학자도 있어, 전쟁이 유일한 원인이었는지는 학설이 갈린다. 아소카는 이후 정복을 그만두고 담마 정책을 펼쳤으며, 그 내용은 「아소카의 담마와 칙령, 그리스 왕들과의 교류(기원전 258~232년 무렵)」(뒤의 사건)에서 다룬다."
  subjects: [maurya-empire]
  tags: [war, politics]
  sources: ["Eugen Hultzsch, Inscriptions of Asoka (Clarendon Press, 1925)", "Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: tamil-three-kingdoms-260bc
  year: -259
  endYear: -257
  title:
    ko: "아소카 칙령에 이름이 나오는 남인도 세 왕국: 촐라·판디아·체라(기원전 260년 무렵)"
  summary:
    ko: "아소카의 바위 칙령 2와 13은 마우리아 영토 밖의 이웃 나라를 든다. 남쪽에서는 촐라(초다), 판디아(파다), 사티야푸트라, 케랄라푸트라가 있고 더 남쪽에 탐바판니(스리랑카의 아누라다푸라 왕국 쪽으로 읽는다)가 있다. 케랄라푸트라를 체라로 읽고 사티야푸트라는 남부의 다른 세력으로 보는 것이 흔한 해석이다. 이 칙령은 세 왕국의 이름이 처음 나오는 문헌 증거일 뿐 그 전에 이 나라들이 없었다는 뜻은 아니며, 아소카가 사람과 가축을 위한 약초와 길가 나무·우물을 그 나라들에도 두었다고 적는다. 칙령은 이 나라들이 마우리아의 신하가 아니라 이웃이었음을 전제하며, 이들이 어떤 정치 체제였는지는 말하지 않는다. 세 왕국의 모습은 이보다 뒤에 나온 타밀 상감 문헌의 시와 비문, 화폐에서 더 밝혀진다(「상감 시대의 타밀 세 왕국: 체라·촐라·판디아와 타밀 문학(기원전 1세기~기원후 3세기)」, 뒤의 사건). 연대는 상감 문헌 전체를 기원전 300~기원후 300년 무렵으로 넓게 잡는 설과 기원전 100~기원후 250년으로 좁히는 설이 있다. 칼링가의 카라벨라 비문에 나오는 타밀 나라들의 연합도 이 지역의 정치 단위가 일찍부터 있었음을 알려 준다. 세 왕국이 서로 다투고 무역과 농업으로 힘을 키운 일은 이후의 일이며, 칙령의 기록이 있다고 해서 이 해에 세 왕국이 새로 생겼다는 뜻은 아니다. 후대 시와 전승은 촐라가 우라이유르, 판디아가 마두라이, 체라가 반지를 도읍으로 삼았다고 전하지만 이 위치의 비정은 학설이 갈린다. 아소카 칙령은 그리스 왕들과 남쪽 나라들을 똑같이 '이웃'으로 불러 마우리아의 외교 시야가 넓었음을 보여 준다. 탐바판니는 뒤에 그리스 지리가들이 섬 이름으로 쓴 타프로바네와 이어지는 이름이며, 칙령의 이름들을 읽는 일은 해석이라 케랄라푸트라가 체라인지도 확정은 아니다."
  subjects: [chera-dynasty, chola-dynasty, pandya-dynasty, maurya-empire, anuradhapura-kingdom]
  tags: [politics, diplomacy]
  sources: ["Eugen Hultzsch, Inscriptions of Asoka (Clarendon Press, 1925)", "K. A. Nilakanta Sastri, A History of South India from Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Kamil V. Zvelebil, Companion Studies to the History of Tamil Literature (Brill, 1992)"]

- id: ashoka-dhamma-258bc
  year: -257
  endYear: -232
  title:
    ko: "아소카의 담마와 칙령, 그리스 왕들과의 교류(기원전 258~232년 무렵)"
  summary:
    ko: "칼링가 뒤 마우리아의 아소카는 바위와 돌기둥에 칙령을 새겨 '담마'를 알렸다. 담마는 특정 종교의 교리가 아니라 부모와 어른을 공경하고 생명을 아끼며 다른 신앙을 존중하라는 폭넓은 생활 도덕이다. 아소카 자신은 불교를 따랐으나, 비문은 브라만교와 자이나, 아지비카교도 함께 돌보라고 적는다. 대관 20년째(기원전 249년 무렵)에는 룸비니를 찾아 기둥을 세웠다고 룸비니 기둥 비문에 적혀 있다. 칙령은 지방에 담마를 맡은 특별 관리를 둔 일, 사람과 짐승을 위한 의원과 약초밭, 길가 나무와 우물 같은 복지를 말한다. 바위 칙령 13에는 그리스 왕들이 이웃으로 나오는데 셀레우코스 왕 안티오코스 2세, 이집트의 프톨레마이오스 2세, 마케도니아 왕 안티고노스 고나타스, 마가스, 알렉산드로스(에피로스나 코린토스의 왕으로 본다) 이름이 있어 아소카의 재위를 헬레니즘 연대와 맞추는 열쇠가 된다. 칸다하르에서 나온 그리스어 칙령은 서북 변경의 그리스 주민에게 같은 말을 그들의 글로 전했다. 스리랑카 연대기에 따르면 아소카는 파탈리푸트라에서 불교 결집을 열고 아들 마힌다를 보냈다(「제3결집과 마힌다의 스리랑카 전도(기원전 250~247년 무렵)」, 뒤의 사건). 이 이야기는 북인도 전승에는 없고, 칙령에도 직접 나오지 않는다. 바위 칙령 1은 궁정 부엌에서 하루에 수많은 동물을 잡던 일을 이제는 세 마리(공작 둘과 사슴 하나)만 잡으며 이마저도 그만두겠다고 적었고, 칙령 12는 모든 종파의 핵심을 키우라고 권한다. 이처럼 왕 자신이 신민에게 직접 말하는 글은 고대 인도에서 드문 사료다. 칙령 3은 지방 관리가 5년마다 순시하며 담마를 알리라고 지시한다. 룸비니 기둥은 부처가 태어난 이 마을의 세금을 줄여 준다고도 적는다."
  subjects: [maurya-empire, seleucid-empire, ptolemaic-kingdom, macedonia-kingdom]
  tags: [religion, politics, diplomacy]
  sources: ["Eugen Hultzsch, Inscriptions of Asoka (Clarendon Press, 1925)", "Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: third-council-mahinda-250bc
  year: -249
  endYear: -246
  title:
    ko: "제3결집과 마힌다의 스리랑카 전도(기원전 250~247년 무렵)"
  summary:
    ko: "스리랑카 연대기 『디파밤사』와 『마하밤사』에 따르면 아소카는 파탈리푸트라에서 목갈리풋타 티사를 중심으로 제3차 불교 결집을 열었고, 그 뒤 여러 지방에 전도사를 보냈다. 이 가운데 마힌다가 기원전 250~247년 무렵 스리랑카에 닿아 아누라다푸라의 데바남피야 티사 왕(재위 기원전 250~210년 무렵)을 불교로 이끌었다고 전한다. 같은 기록에 따르면 마힌다의 누이 상가미타가 비구니 승단을 세우려고 건너오면서 보리수 가지를 가져왔고, 그 가지는 아누라다푸라의 마하메가 동산에 심겼다. 왕은 이곳에 대사원을 세워 승단에 바쳤다. 다만 이 이야기는 『마하밤사』가 5세기에 쓰였고 북인도의 전승에는 제3결집도 마힌다도 나오지 않는다는 점, 아소카 칙령에 스리랑카 전도가 직접 나오지 않는다는 점 때문에 마힌다가 아소카의 아들이었는지는 역사로 확인할 수 없다는 지적이 있다. 어느 쪽이든 아누라다푸라가 기원전 3세기 무렵 인도의 불교와 접촉하며 승가와 왕권이 손을 잡은 것은 이후 스리랑카 역사의 큰 줄기가 되었다. 연대기는 마힌다가 아누라다푸라 동쪽 미힌탈레에서 사슴 사냥 중이던 왕을 만나 처음 설법했다고 전한다. 왕의 아버지 무타시바가 가꾼 마하메가 동산이 승단에 바쳐졌고, 『디파밤사』는 4세기 무렵 쓰인 더 이른 연대기로 두 책을 함께 읽는다. 연대기는 이 뒤 아누라다푸라에서 팔리어 경전이 대대로 외워 전해지다 기원전 1세기 무렵 처음 글로 적혔다고 전한다. 마힌다는 섬에서 오래 머물다 죽었고, 그의 이름을 딴 미힌탈레가 지금도 순례지로 남았다. 마우리아 쪽 사정은 「아소카의 담마와 칙령, 그리스 왕들과의 교류(기원전 258~232년 무렵)」(앞의 사건)을 가리킨다."
  subjects: [maurya-empire, anuradhapura-kingdom]
  tags: [religion, politics]
  sources: ["Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)"]

- id: maurya-decline-232bc
  year: -231
  endYear: -184
  title:
    ko: "아소카 뒤 마우리아의 약화와 끝(기원전 232~185년 무렵)"
  summary:
    ko: "아소카는 기원전 232년 무렵 죽었고, 이어서 위키백과 영어판이 정리한 목록을 따르면 손자 다샤라타(기원전 232~224)와 삼프라티(224~215), 샬리슈카(215~202), 데바바르만(202~195), 샤타다느반(195~187), 마지막 왕 브리하드라타(187~185)가 차례로 왕위에 올랐다. 이 순서와 재위는 푸라나와 불교·자이나 전승마다 이름과 해가 갈려 확정된 것이 아니다. 삼프라티를 자이나교를 후원한 왕으로 전하는 자이나 전승도 있다. 이 시기의 마우리아가 어떤 땅을 잃었는지 직접 알려 주는 사료는 없다. 칼링가와 데칸, 서북 간다라 쪽이 어느 때 마우리아의 손을 떠났는지는 범위를 알 수 없고, 서북에서는 기원전 206년 무렵 셀레우코스의 안티오코스 3세가 힌두쿠시를 넘어 인도의 왕과 맹약을 맺었다고 그리스 사가 폴리비오스가 적었으나 그 왕이 마우리아의 누구였는지는 확실하지 않다(「안티오코스 3세의 제국 재건(기원전 223~195): 몰론과 아카이오스의 반란, 라피아와 파니온, 아르메니아」). 기원전 185년 무렵 군대 사열 자리에서 장군 푸샤미트라 슝가가 브리하드라타를 죽이고 스스로 왕이 되었다고 푸라나와 후대 문헌이 전하며, 이 해를 기원전 180년으로 보는 견해도 있다. 왕위 찬탈이 마우리아를 곧 없앤 것은 아니고, 이미 지방이 떨어져 나가 힘이 약해진 터에 일어난 마지막 일격으로 본다. 아소카 뒤 마우리아가 이렇게 약해진 원인으로는 넓은 땅을 지키는 비용, 관료와 군대 유지의 부담, 지방의 독립 움직임 같은 여러 설이 있으며 어느 하나로 단정하기 어렵다. 푸샤미트라의 쿠데타는 푸라나 외에 7세기 바나의 『하르샤차리타』에도 군대 사열 중 일어난 일로 나온다. 한편 『가르기 상히타』의 유가 푸라나는 야바나가 파탈리푸트라까지 이르렀다고 적으나, 연대와 사건의 성격은 확실하지 않다."
  subjects: [maurya-empire, shunga-empire]
  tags: [politics]
  sources: ["Romila Thapar, Asoka and the Decline of the Mauryas (Oxford University Press, 1961)", "Polybius, Historiai 11.34 (W. R. Paton 영역, Loeb, 1925)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: demetrius-indo-greek-200bc
  year: -199
  endYear: -179
  title:
    ko: "데메트리오스 1세와 인도-그리스 왕국의 시작(기원전 200~180년 무렵)"
  summary:
    ko: "박트리아의 에우티데모스 1세의 아들 데메트리오스는 재위(기원전 200~180년 무렵) 중 힌두쿠시를 넘어 아라코시아와 카불 계곡으로 내려갔다. 이 땅은 한때 마우리아가 차지했던 곳으로, 아소카 이후 마우리아의 힘이 약해진 사정과 맞물렸다(「아소카 뒤 마우리아의 약화와 끝(기원전 232~185년 무렵)」, 앞의 사건). 데메트리오스의 화폐가 이 지역에서 나오는 것이 가장 직접적인 증거이며, 그가 헬레니즘 세계의 군주로 인도 쪽에 나라를 연 첫 그리스 왕으로 평가된다. 일부 학자는 그가 야바나 기년(기원전 186~185년 무렵)을 열었다고 보지만 확정되지 않았다. 기원전 185~170년 무렵에는 아가토클레스와 판탈레온이 그리스어와 인도 브라흐미 글자를 함께 새긴 이중 언어 화폐를 처음 찍어, 그 화폐가 탁실라까지 나온다. 기원전 180~175년 무렵에는 아폴로도토스 1세가 박트리아 밖에서 독립한 첫 인도-그리스 왕으로 서서 간다라 쪽에서 나라를 다졌다. 박트리아 본국에서는 에우크라티데스가 반란을 일으켜 데메트리오스 계통과 싸웠고, 그 결과 박트리아와 인도 쪽 그리스 세력이 갈라져 서로 다른 왕통으로 나아갔다. 이 갈림은 사료가 화폐와 짧은 기록뿐이라 왕들의 순서와 해에 학자마다 차이가 크다. 아버지 에우티데모스 1세가 기원전 208~206년 안티오코스 3세에게 포위당한 뒤 화친할 때 안티오코스가 딸을 데메트리오스에게 주기로 약속했다고 폴리비오스가 적는다. 이런 헬레니즘 세계와의 연결 속에서 데메트리오스의 인도 진출이 이뤄졌다. 이 지역에서 나온 데메트리오스의 화폐에는 코끼리 가죽 모자를 쓴 초상이 새겨져 인도와의 관련을 상징한다."
  subjects: [indo-greek-kingdom, maurya-empire]
  tags: [politics, war]
  sources: ["A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: shunga-pushyamitra-185bc
  year: -184
  endYear: -149
  title:
    ko: "푸샤미트라 슝가와 슝가 제국의 성립(기원전 185~151년 무렵)"
  summary:
    ko: "푸샤미트라는 마우리아의 장군으로 기원전 185년 무렵 마지막 왕을 죽이고 슝가 왕조를 열어 36년 가까이 다스렸다(재위 기원전 185~151년 무렵으로 본다). 슝가는 도읍을 파탈리푸트라에 두면서 말와 동부의 비디샤를 거점으로 삼았고, 갠지스 평원과 말와 동부를 다스렸다. 아요디아에서 나온 비문은 푸샤미트라가 말을 바치는 제사인 아슈바메다를 두 번 올렸다고 적어, 그가 베다 의례를 되살린 왕으로 기억되었음을 보여 준다. 파탄잘리의 『마하바샤』는 야바나(그리스인)가 사케타와 마디야미카를 쳤다고 적고, 후대 희곡 『말라비카그니미트라』는 푸샤미트라의 손자가 인더스강 가에서 야바나 군을 물리쳤다고 그린다. 두 기록 모두 인도-그리스 세력이 서북에서 갠지스 평원 가까이 들어왔음을 보여 주나 사건의 해는 확실하지 않다. 불교 전승(『아소카바다나』 등 후대 문헌)은 푸샤미트라가 불교 사원을 부수고 승려를 죽였다고 전하지만, 이는 수백 년 뒤 불교 문헌의 서술이고 같은 때의 발굴이나 비문이 그 일을 확인해 주지 않는다. 한편 바르후트 탑의 난간과 산치 탑의 확장은 슝가 때에 불교 시설도 계속 세워졌음을 보여 준다. 아들 아그니미트라(기원전 151~141년 무렵)가 비디샤 총독으로 있다가 왕위를 이었다고 푸라나가 전한다. 슝가는 마우리아처럼 넓은 땅을 하나로 묶지는 못했고 그 힘은 갠지스 평원과 말와 동부에 그쳤다. 바르후트 탑 난간의 비문은 '슝가의 치세에' 다나부티가 문을 바쳤다고 적어, 슝가 시기에 불교 시설이 후원되었음을 보여 주는 가장 직접적인 증거다. 도읍 파탈리푸트라는 슝가 때에도 마가다의 중심이었지만 비문과 유물이 많이 나오는 곳은 비디샤·아요디아·카우삼비다."
  subjects: [shunga-empire, maurya-empire, indo-greek-kingdom]
  tags: [politics, religion]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)"]

- id: menander-milinda-165bc
  year: -164
  endYear: -130
  title:
    ko: "메난드로스와 『밀린다팡하』: 인도-그리스 왕국의 전성(기원전 165~130년 무렵)"
  summary:
    ko: "메난드로스 1세는 인도-그리스 왕들 가운데 가장 넓은 땅을 다스리고 화폐도 가장 많이 남긴 왕이다. 재위는 기원전 165년 무렵에서 130년 무렵 또는 155년 무렵에서 130년 무렵으로 학설이 갈린다. 도읍은 사갈라(지금 파키스탄 시알코트로 본다)였다. 같은 때 갠지스 평원을 다스리던 슝가는 야바나와 여러 차례 부딪쳤다고 전한다. 그의 화폐는 그리스어와 카로슈티 문자 이중 언어로 '구원자 왕'이라 새기고 불교 법륜이 든 것도 있어, 그가 불교에 호의적이었음을 시사한다. 마투라 원정과 파탈리푸트라까지의 진격은 그리스 지리학자 스트라본이 전하고 인도의 『유가푸라나』에도 야바나의 진격이 나오지만, 결과는 확실하지 않다. 그리스 저자 플루타르코스는 메난드로스가 군영에서 죽자 여러 도시가 유골을 나눠 가졌다고 적는다. 불교 경전 『밀린다팡하』는 '밀린다 왕'이 승려 나가세나와 영혼·윤회·업을 묻고 답하는 대화로, 메난드로스가 불교에 귀의했다고 전하지만 이 책의 현재 꼴은 뒤에 다듬어진 것이다. 이 시기 박트리아에서는 에우크라티데스와 헬리오클레스가 맞섰고, 메난드로스가 죽은 뒤 나라가 쪼개지면서 야우데야·아르주나야나·아우둠바라 같은 이웃 공화국이 라비강 동쪽에서 일어났다. 『밀린다팡하』는 팔리어 경전 판본과 4세기 무렵 중국에서 번역된 『나선비구경』이 전해 두 판본의 차이가 연구 대상이다. 메난드로스의 화폐는 카불에서 마투라까지 넓게 나와 그의 힘이 미친 범위를 가늠하게 해 준다. 그가 불교에 귀의했다는 이야기는 『밀린다팡하』에 크게 기대고 있어, 일부 학자는 그가 불교를 후원했을 뿐 개종은 아니었다고 본다. 화폐의 불교 법륜도 왕의 신앙보다 인도 백성을 의식한 상징이라는 해석이 있다. 스트라본은 메난드로스가 알렉산드로스보다 더 많은 부족을 정복했다고 전하나 이 말은 과장으로 본다."
  subjects: [indo-greek-kingdom, shunga-empire]
  tags: [politics, religion, culture]
  sources: ["A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Strabo, Geographika 11.11.1 (Horace Leonard Jones 영역, Loeb, 1928)"]

- id: dutthagamani-161bc
  year: -160
  endYear: -136
  title:
    ko: "엘라라와 두타가마니: 스리랑카의 통일(기원전 161~137년 무렵)"
  summary:
    ko: "스리랑카 연대기 『마하밤사』에 따르면 기원전 205년 무렵 남인도 촐라 출신으로 알려진 엘라라가 아누라다푸라를 차지하고 기원전 161년 무렵까지 다스렸다. 연대기는 그를 정의로운 왕으로 그리지만 불교도의 눈에서는 외지 사람이었다. 남쪽 루후나의 왕자 두타가마니(두투가무누로도 적는다)는 기원전 161년 무렵 엘라라와 싸워 이기고 섬 전체를 하나로 묶었으며 기원전 137년 무렵까지 다스렸다. 연대기는 이 싸움을 신앙과 민족의 대결로 그리지만, 연대기가 5세기에 불교 승려가 쓴 것이고 승단이 왕권을 보는 눈이 들어 있음을 학자들은 지적한다. 두타가마니는 루완웰리사야 대탑과 청동 궁전을 세웠다고 전한다. 그의 동생 삿다 티사(재위 기원전 137~119 무렵)가 뒤를 이었다. 이 사건으로 아누라다푸라는 남인도와 맞서면서도 계속 관계를 맺는 나라가 되었고, 남인도 타밀 왕국과의 싸움과 교류는 이후에도 이어진다. 섬의 북쪽과 남쪽이 서로 다른 세력이었다가 이때 하나가 되었다는 점은 스리랑카 역사의 한 갈래로 길게 기억된다. 연대기에 따르면 엘라라는 44년을 다스렸고, 두타가마니는 엘라라가 죽은 터에 비석을 세워 그 앞을 지나는 이는 누구나 말에서 내리게 했다고 한다. 이는 승단이 쓴 연대기 속에서도 상대 왕을 정의롭다고 평가한 대목이다. 연대기의 영웅담은 후대에 다듬어졌지만 아누라다푸라 발굴은 이 도읍의 오랜 역사를 뒷받침한다. 다만 기원전 2세기 중엽 섬 전체가 실제로 한 사람의 손에 통일되었는지는 고고학 자료로 따로 확인해야 한다. 연대기는 두타가마니가 거느린 열 명의 큰 장수를 영웅으로 그린다. 그가 왕이 되기 전 형제 사이의 다툼도 연대기에 길게 나온다."
  subjects: [anuradhapura-kingdom, chola-dynasty]
  tags: [politics, war]
  sources: ["Wilhelm Geiger (trans.), The Mahavamsa, or the Great Chronicle of Ceylon (Pali Text Society, 1912)", "K. M. de Silva, A History of Sri Lanka (University of California Press, 1981)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: shunga-later-kings-149bc
  year: -148
  endYear: -73
  title:
    ko: "슝가의 뒤를 이은 왕들과 헬리오도로스 기둥(기원전 149~74년 무렵)"
  summary:
    ko: "아그니미트라 뒤에도 슝가 왕통은 이어졌다. 푸라나는 푸샤미트라·아그니미트라·수제스타·바수미트라·아르드라카·풀린다카·고샤바수·바즈라미트라·바가바타·데바부티의 열 왕을 든다. 위키백과 영어판이 재위 연도를 적은 것은 아그니미트라(기원전 151~141)와 바수미트라(기원전 131~124), 마지막 왕 데바부티(기원전 83~73)뿐이고 나머지는 이름만 전한다. 이 시기의 가장 뚜렷한 기록이 비디샤 곁 베스나가르의 '헬리오도로스 기둥'이다. 간다라 탁실라 사람 헬리오도로스는 인도-그리스 왕 안티알키다스의 사절로 비디샤의 왕 바가바드라(푸라나의 바가바타와 같은 사람인지는 확실하지 않다)의 궁정에 와서 비슈누의 한 모습인 바수데바에게 이 기둥을 바쳤다고 스스로 적었다. 연대는 기원전 110년 무렵에서 100년 무렵으로 보며, 이 기둥은 그리스인이 인도 신을 섬긴 증거이자 슝가와 서북 인도-그리스 왕 사이의 외교 증거로 읽힌다. 같은 때 칼링가의 카라벨라가 슝가와 마가다를 쳤다고 하는 비문이 있고(「카라벨라와 하티굼파 비문(기원전 2~1세기)」, 뒤의 사건) 바르후트와 산치 탑의 장식도 이 시기에 이어졌다. 슝가는 이처럼 힘이 약해지면서 데칸과 서쪽에서 사타바하나·인도-그리스 같은 세력과 부딪쳤다. 산치 대탑의 돌난간과 문에는 승려·상인·왕의 관리 같은 많은 보시자의 이름이 새겨져 이 시기 비디샤 일대의 상인 사회와 불교 후원의 모습을 보여 준다. 아그니미트라의 비디샤 총독 시절을 그린 희곡 『말라비카그니미트라』는 수백 년 뒤 칼리다사가 쓴 것이어서 역사 자료로는 한계가 있다. 푸라나가 든 이름은 필사본마다 달라 열 명이라는 숫자도 확정은 아니다."
  subjects: [shunga-empire, indo-greek-kingdom]
  tags: [politics, diplomacy, religion]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)"]

- id: indo-greek-fragmentation-130bc
  year: -129
  endYear: -100
  title:
    ko: "메난드로스 뒤 인도-그리스 왕국의 분열(기원전 130~100년 무렵)"
  summary:
    ko: "메난드로스가 죽은 기원전 130년 무렵 인도-그리스는 여러 왕통으로 나뉘었다. 같은 때 박트리아에서는 중앙아시아 유목민이 내려와 그리스인 박트리아 왕국이 끝났고, 인도 쪽 그리스 왕들은 힌두쿠시 남쪽에서 따로 살아남았다. 일부 기록은 메난드로스의 아들 스트라톤 1세가 어머니 아가토클레이아를 섭정으로 삼아 왕위에 올랐다고 하며, 이후 조일로스, 뤼시아스, 안티알키다스, 필록세노스 같은 왕들이 각각 간다라·카불·탁실라 등을 맡았다. 이 왕들은 화폐로만 확인되며 서로의 선후와 다스린 땅은 학자마다 달리 본다. 이 시기 인도-그리스 세력은 라비강 동쪽에서 일어난 야우데야·아르주나야나·아우둠바라 같은 토착 공화국과 부딪쳤다. 안티알키다스의 사절 헬리오도로스가 슝가의 바가바드라 궁정에 기둥을 바친 일은 서로 맞서면서도 교류가 있었음을 보여 준다(「슝가의 뒤를 이은 왕들과 헬리오도로스 기둥(기원전 149~74년 무렵)」). 기원전 110~100년 무렵의 왕으로는 헬리오클레스 2세가 꼽힌다. 이 분열 속에서 인도-그리스의 땅은 서쪽에서 사카의 압력을 받아 줄어들기 시작한다. 이 시기 화폐는 그리스 신과 인도 동물(코끼리·혹소)을 함께 새기고 그리스어와 카로슈티 글을 나란히 써서 두 문화의 만남을 보여 준다. 기원전 1세기에는 디오메데스, 헤르마이오스, 아폴로도토스 2세, 히포스트라토스 같은 왕이 이어지는데 그 순서는 학설마다 다르다. 라비강 동쪽의 아우둠바라 공화국은 화폐에 자기 이름을 새겨 독자 세력임을 알렸고, 야우데야 공화국도 자기 화폐를 남겼다. 왕들의 순서와 해는 화폐에 덧새긴 흔적과 출토지로 맞추는데, 새 화폐가 나올 때마다 바뀔 수 있다."
  subjects: [indo-greek-kingdom, shunga-empire]
  tags: [politics]
  sources: ["A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)"]

- id: kharavela-hathigumpha-100bc
  year: -99
  title:
    ko: "카라벨라와 하티굼파 비문(기원전 2~1세기)"
  summary:
    ko: "오리사의 우다야기리 언덕 하티굼파 동굴에는 칼링가 왕 카라벨라의 업적을 연대순으로 적은 비문이 있다. 비문에는 해가 적혀 있지 않아 카라벨라의 연대는 기원전 2세기 말에서 1세기 사이로 학설이 갈리며, 여기서는 가운데쯤의 기원전 100년 무렵으로 잡는다(서체로는 기원전 1세기 중엽~기원후 1세기 초로 보는 견해도 있다). 비문은 즉위 2년에 사타바하나 왕가의 사타카르니를 무시하고 서쪽으로 군대를 보냈다고 적는데 이를 사타카르니를 위협한 것으로 읽는 설과 둘이 우호적이었다는 설이 있다. 8~9년에는 군대가 라자그리하를 쳤고, 이때 '야바나 왕'이 마투라로 물러났다는 읽기가 있으나 판독이 갈리고 왕의 정체도 논쟁이다. 12년에는 마가다의 왕 브리하스파티미트라를 꺾어 난다 왕이 가져간 지나상을 되찾았다. 마가다 왕을 푸샤미트라 슝가와 같은 사람으로 보는 옛 해석은 지금 받아들여지지 않는다. 판디아 왕이 진주와 보석을 조공했다고 하는 대목도 있다. 사타카르니는 「사타바하나 왕조의 성립: 시무카와 사타카르니 1세(기원전 100~70년 무렵)」에서 다룬다. 카라벨라는 자이나교를 따랐으며 비문 첫머리가 자이나 만트라와 비슷하나, 모든 신앙의 신전을 보살폈다고도 적는다. 이 비문은 마우리아 뒤 동해안과 남쪽, 슝가와 마가다, 서북의 그리스인(인도-그리스)이 얽힌 사정을 한 장면으로 보여 주는 드문 자료다. 비문은 즉위 첫해에 폭풍으로 무너진 도성을 고쳤고 5년에 난다 왕이 판 수로를 도성까지 이었다고 적는다. 우다야기리·칸다기리의 동굴군은 카라벨라가 자이나 수행자들에게 만들어 바친 거처로 전한다. 비문이 전하는 업적은 왕 스스로의 선전이어서 정복의 실제 규모는 확인되지 않는다. 비문은 즉위 몇 년째라는 식으로 사건을 줄 세우며, 13년째에는 자이나 고행자들의 모임이 나온다. 난다 왕이 가져간 지나상을 되찾았다는 대목은 칼링가가 난다 때 마가다에 속했던 일(「마하파드마 난다와 난다 왕조: 시슈나가 왕조의 끝과 갠지스 평원의 통합(기원전 345~322 무렵)」, 앞의 사건)과 이어진다."
  subjects: [shunga-empire, satavahana-dynasty, pandya-dynasty, indo-greek-kingdom]
  tags: [politics, war, religion]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: satavahana-founding-100bc
  year: -99
  endYear: -69
  title:
    ko: "사타바하나 왕조의 성립: 시무카와 사타카르니 1세(기원전 100~70년 무렵)"
  summary:
    ko: "사타바하나는 마우리아와 슝가 뒤 데칸 서북부에서 일어난 왕조다. 시작 연대는 푸라나가 말하는 기원전 3세기 말부터 기원전 1세기까지 학설이 여럿이며, 지금은 기원전 2세기 말에서 1세기 사이로 보는 쪽이 우세하고 이 항목은 기원전 100년 무렵으로 적는다. 마우리아가 약해진 뒤 데칸이 누구의 땅이었는지는 사료가 없어 알 수 없다. 첫 왕 시무카는 기원전 100~70년 무렵 다스렸고, 형제 칸하(기원전 70~60 무렵으로 본다)와 아들 사타카르니 1세(기원전 70~60 무렵)가 이었다. 위키백과 영어판은 이 연대를 쓰나 칸하와 사타카르니 1세의 순서와 해는 학설마다 다르다. 사타카르니 1세의 왕비 나가니카가 새긴 나네가트 비문은 왕이 아슈바메다와 라자수야 같은 큰 제사를 지냈다고 적어, 사타바하나가 베다 의례를 따르는 왕통임을 보여 준다. 기원전 70년 무렵 사타카르니 1세는 서쪽으로 말와와 비다르바까지 영향력을 넓혔다. 산치 탑 남문의 봉헌 비문에는 사타바하나 왕 휘하 장인의 이름이 있다. 이 시기 사타바하나의 힘은 나식과 푸네 일대 서쪽에서 안드라 쪽 동쪽으로 서서히 뻗어 간다. 서해안에서 데칸 고원으로 오르는 산길 나네가트에는 사타바하나 왕들의 초상 조각이 있었다고 하나 지금은 거의 부서졌다. 푸라나는 안드라 왕을 서른 명 남짓 세고 재위 합을 400년 넘게 적지만 이 숫자는 학자마다 다르게 읽는다. 사타바하나 왕은 '고타미푸트라'처럼 어머니의 이름을 앞에 붙여 부르는 관례가 있었다. 나네가트 비문이 적은 제사 보시에는 소와 말, 금화 같은 수가 길게 나와 왕실의 부와 의례의 규모를 보여 준다. 이 연대 논쟁은 푸라나의 왕 이름과 비문, 화폐를 맞추는 작업에서 나온다. 카라벨라 비문이 적은 사타카르니와의 관계는 「카라벨라와 하티굼파 비문(기원전 2~1세기)」에서 다룬다."
  subjects: [satavahana-dynasty, shunga-empire]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: maues-saka-85bc
  year: -84
  endYear: -54
  title:
    ko: "사카의 남하와 인도-스키타이 왕국의 성립(기원전 85~55년 무렵)"
  summary:
    ko: "중앙아시아 초원의 유목민 사카(스키타이)는 월지에 밀려 서쪽과 남쪽으로 내려가 시스탄을 거쳐 인더스강 유역에 닿았다. 마우에스는 기원전 85년 무렵부터 60년 무렵까지 다스린 첫 인도-스키타이 왕으로, 기원전 80년 무렵 간다라와 탁실라를 차지했다. 그의 화폐는 그리스 신 이미지에 그리스어와 카로슈티 문자를 새겨 이미 있던 인도-그리스 전통을 이었다. 보노네스(기원전 75~65 무렵)와 스팔리리세스가 그와 함께 또는 이어서 다스렸고, 아제스 1세(기원전 60~20 무렵)가 기원전 55년 무렵 인도-그리스 왕 히포스트라토스를 쳐서 서북 인도를 잡았다. 인도-스키타이는 큰 중앙 권력 없이 마투라의 태수 가문 같은 여러 태수를 거느린 느슨한 나라였고, 그리스인 관리와 군인이 계속 쓰였다. 서북 인도의 그리스 세력은 이때부터 펀자브 동쪽 한 줄기로 줄어들었다. 아제스를 기원으로 하는 기년이 따로 있었다고 하나 어느 해에 시작했는지는 학설이 갈린다. 사카는 아케메네스 시기부터 페르시아 비문에 나오는 중앙아시아 초원의 집단이며, 그들이 자리 잡은 지역이 사카스타나, 곧 시스탄이라는 이름이 되었다. 아제스 1세의 화폐에는 '왕 중 왕'이라는 칭호가 새겨져 파르티아의 왕 칭호를 따랐음을 알려 준다. 그 뒤를 아질리세스와 아제스 2세가 이어 인도-스키타이의 마지막 큰 왕으로 서북 인도를 다스렸다고 화폐 연구는 본다. 마우에스의 화폐에는 포세이돈과 니케 같은 그리스 신, 코끼리와 혹소 같은 인도 동물이 새겨져 인도-그리스의 도상을 이었다. 탁실라 시르캅 발굴 층에서 나온 화폐가 이 시기 도시의 지배자를 가늠하게 한다. 마우에스는 탁실라 동판 비문에도 '모가'라는 이름으로 나온다."
  subjects: [indo-scythian-kingdom, indo-greek-kingdom]
  tags: [politics, war]
  sources: ["A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kanva-end-73bc
  year: -72
  endYear: -27
  title:
    ko: "칸바 왕조와 슝가 계통의 끝(기원전 73~28년 무렵)"
  summary:
    ko: "푸라나는 슝가의 마지막 왕 데바부티가 기원전 73년 무렵 신하 바수데바 칸바에게 죽었고 바수데바가 칸바 왕조를 열었다고 전한다. 칸바는 바수데바·부미미트라·나라야나·수샤르만의 네 왕으로 이어졌다고 푸라나가 전하며, 모두 짧은 치세였던 것으로 보인다. 칸바 시기의 사료는 푸라나와 일부 화폐뿐이고 네 왕의 재위 연도는 확실하지 않다. 위키백과 영어판은 칸바를 기원전 75~26년 무렵으로 적는다. 마지막 왕 수샤르만은 기원전 28년 무렵 안드라(사타바하나) 왕에게 무너졌다고 푸라나는 전하며, 이 대목은 사타바하나가 일찍 마가다까지 닿았다는 뜻인지 아니면 칸바를 이은 약한 슝가 잔당을 비디샤에서 없앤 것인지 학자마다 해석이 갈린다. 사타바하나의 시작 연대를 어떻게 잡느냐에 따라 이 푸라나 서술의 값이 달라지며, 일부 학자는 칸바의 몰락을 기원전 30년 무렵으로 본다. 어느 쪽이든 이 무렵 갠지스 평원에는 슝가·칸바 같은 약한 왕조가 이어지다 끝났고, 그 뒤 마가다에는 한동안 큰 나라가 서지 않아 이 지역은 서북에서 온 인도-스키타이와 쿠샨의 압력을 받게 된다. 푸라나는 칸바의 네 왕 재위를 바수데바 9년, 부미미트라 14년, 나라야나 12년, 수샤르만 10년으로 적어 합이 45년이 되는데, 이는 위 연대 폭과 대체로 맞는다. 푸라나는 이 일들을 미래에 일어날 일의 예언 형식으로 서술해 사료로 읽을 때 조심해야 한다. 칸바가 다스린 곳은 마가다 중심에 그쳤고 갠지스 평원 위쪽은 이미 다른 세력의 손에 있었을 수 있다. 같은 때 판찰라와 코살라 일대에서는 이름만 전하는 작은 왕들이 따로 화폐를 찍었다. 푸라나는 칸바 왕가를 브라만 가문으로 적는다."
  subjects: [shunga-empire, satavahana-dynasty]
  tags: [politics]
  sources: ["Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)"]

- id: rajuvula-gondophares-10
  year: 10
  endYear: 19
  title:
    ko: "마지막 그리스인 왕과 라주불라, 곤도파레스의 등장(10~19년 무렵)"
  summary:
    ko: "기원후 10년 무렵 인도-스키타이 태수 라주불라는 펀자브에 남은 마지막 그리스인 왕 스트라톤 2세와 그 뒤를 이은 3세(함께 기원전 25~기원후 10 무렵)를 꺾었고, 이로써 인도-그리스 왕통이 끝났다. 라주불라는 마투라를 근거지로 삼았고, 마투라 사자 기둥머리에 새긴 카로슈티 봉헌문에는 라주불라와 그의 비 그리고 그 가문 사람들이 불교 사원에 보시한 일이 적혀 있고, 이 보시는 설일체유부 승단에 바친 것으로 읽는다. 이 기둥머리는 마투라에서 나온 인도-스키타이 시대의 대표 유물로 꼽힌다. 이 때 마투라 일대에는 카라호스테스 같은 태수도 있었다. 이 느슨한 연합은 기원후 19년 무렵 서쪽 시스탄의 곤도파레스에게 서북 인도를 내주고 흔들렸다. 곤도파레스는 파르티아 제국에서 독립해 시스탄을 거점으로 인도 서북까지 땅을 넓힌 왕이다. 인도-스키타이 왕통은 이로써 서북에서 끝났고, 그 일족은 마투라와 서인도, 데칸 서쪽에서 태수로 이어졌다. 이 땅의 새 주인은 「곤도파레스와 인도-파르티아 왕국(19~75년 무렵)」(뒤의 사건)에서 다룬다. 인도-그리스, 인도-스키타이, 인도-파르티아가 모두 화폐와 짧은 비문에 의존하는 만큼 이 시기 서북 인도의 왕 이름과 순서는 학자마다 다르다. 아제스 1세 이후 아질리세스와 아제스 2세가 이었고, 라주불라는 스트라톤 화폐를 본뜬 화폐를 찍어 그리스인 왕의 전통도 이었다. 이 화폐 연구는 인도-스키타이 왕통이 한 사람의 큰 왕 아래 정리되지 않았다는 점을 보여 준다. 서북 인도에서 인도-그리스, 인도-스키타이, 인도-파르티아가 차례로 이어진 순서는 한 왕통이 다음 왕통을 일직선으로 밀어낸 것이 아니라 겹쳐 있던 여러 세력이 힘을 겨룬 과정으로 본다."
  subjects: [indo-greek-kingdom, indo-scythian-kingdom, indo-parthian-kingdom]
  tags: [politics]
  sources: ["A. K. Narain, The Indo-Greeks (Clarendon Press, 1957)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)"]

- id: gondophares-19
  year: 19
  endYear: 75
  title:
    ko: "곤도파레스와 인도-파르티아 왕국(19~75년 무렵)"
  summary:
    ko: "곤도파레스 1세(재위 19~46년 무렵)는 파르티아 제국의 종주권에서 벗어나 시스탄을 거점으로 카불 계곡과 간다라, 펀자브까지 땅을 넓혔다. 탁트이바히 비문에는 '구두바라 대왕 즉위 26년, 기원 103년'이 적혀 있는데, 이 기원을 비크라마력(기원전 57년)으로 보면 곤도파레스의 즉위는 기원후 20년 무렵이 된다. 그의 조카 아브다가세스는 펀자브를 맡아 다스렸고, 곤도파레스 2세 사르페도네스, 곤도파레스 3세 구다나(옛 이름 오르타그네스), 곤도파레스 4세 사세스, 우보우자네스, 파코레스가 이어 다스렸다고 화폐로 확인한다. 이 왕통은 한 사람의 큰 왕 아래 하나로 묶인 나라가 아니었고, 곤도파레스를 중심으로 한 가문이 땅을 갈라 맡았다. 외경 『도마 행전』은 사도 도마가 '구드나파르'라는 왕의 궁정에서 일했다고 전하며, 이 왕을 곤도파레스 가운데 한 사람과 같다고 보는 견해가 있으나 도마가 실제 인도에 왔는지는 사료로 확인되지 않는다. 이 왕통의 전승은 서쪽으로 이어져 인도 케랄라의 도마 기독교인 전승에도 이름이 남았다. 곤도파레스의 이름은 화폐에 '왕 중 왕'과 '독재자'라는 그리스어 칭호로 새겨졌다. 곤도파레스의 이름은 그리스어 화폐에서 '곤도파로스', 카로슈티 비문에서 '구두바라'로 적혀 같은 이름이 글자마다 다르게 옮겨졌다. 화폐 출토지는 곤도파레스가 시스탄에서 아라코시아와 카불 계곡을 거쳐 간다라로 내려왔음을 보여 준다. 기원후 1세기 중엽 이후 쿠샨이 북쪽에서 내려오며 인도-파르티아의 인도 땅을 차츰 빼앗았고 기원후 75년 무렵에는 간다라와 펀자브를 잃었다(「쿠샨의 성립: 월지에서 쿠줄라 카드피세스까지(30~80년 무렵)」)."
  subjects: [indo-parthian-kingdom, parthian-empire, kushan-empire]
  tags: [politics]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kushan-founding-30
  year: 30
  endYear: 80
  title:
    ko: "쿠샨의 성립: 월지에서 쿠줄라 카드피세스까지(30~80년 무렵)"
  summary:
    ko: "쿠샨은 중국 사료가 대월지라 부른 유목 집단의 한 갈래다. 월지는 흉노에 밀려 서쪽으로 옮겼고 기원전 2세기 후반에 박트리아에 자리 잡았다. 『후한서』는 월지가 다섯 흡후로 나뉘었다가 구취각(쿠줄라 카드피세스로 본다)이 이를 합쳐 왕이 되었다고 적는다. 화폐에는 헤라이오스(기원후 1~30년 무렵)가 처음 쿠샨이라는 이름을 새겼고, 쿠줄라 카드피세스는 기원후 50~90년 무렵(25~85년으로 보는 견해도 있다)에 카불 계곡과 간다라 쪽으로 힘을 뻗었다. 쿠샨의 성립을 30년 무렵으로 잡는 것은 헤라이오스 뒤 월지가 쿠줄라 아래 묶였다고 보는 해이고, 쿠줄라 자신의 재위는 50~90년 또는 25~85년으로 갈린다. 아들 비마 탁토가 기원후 90~113년 무렵 다스렸고, 이어 비마 카드피세스(113~127 무렵)가 금화를 대량으로 찍었다고 하나 이 해들은 사료마다 차이가 크다. 기원후 75년 무렵 쿠샨은 인도-파르티아의 간다라와 펀자브를 차지했고 기원후 100년 무렵 마투라 쪽까지 닿았다고 학자들은 본다. 쿠샨의 성립은 인도-파르티아와 인도-스키타이가 쇠퇴하고, 후한이 서역을 경영하던 때와 겹친다(「반초의 서역 경영(73~102)과 감영의 사행(97)」). 장건이 기원전 129년 무렵 대월지가 박트리아에 있다고 보고한 일은 「장건의 서역 사행(기원전 139~126)과 비단길」에 나온다. 쿠줄라 카드피세스는 로마 황제의 흉상을 본뜬 구리 화폐를 찍어 로마 세계와의 접촉을 보여 준다. 『후한서』는 구취각이 안식(파르티아)과 고부(카불)를 쳤다고 적는데, 이 서술의 실제 범위는 화폐 분포와 맞춰 읽어야 한다. 이 시기 쿠샨 화폐는 그리스 문자로 박트리아어를 적은 것이 많았다. 쿠줄라 카드피세스는 중국 사서의 구취각과 같은 사람으로 본다. 쿠샨의 전성은 카니슈카 때 이른다(「카니슈카와 쿠샨의 전성(127~150년 무렵)」, 뒤의 사건)."
  subjects: [kushan-empire, indo-parthian-kingdom, eastern-han]
  tags: [politics, war]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Harry Falk, ‘The Yuga of Sphujiddhvaja and the Era of the Kuṣāṇas’, Silk Road Art and Archaeology 7 (2001)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kshaharata-nahapana-35
  year: 35
  endYear: 124
  title:
    ko: "서 크샤트라파의 성립: 부마카와 나하파나(35~124년 무렵)"
  summary:
    ko: "서 크샤트라파는 서인도에서 사카 계통 태수들이 세운 나라로, 칭호는 대태수를 뜻하는 마하크샤트라파였다. 첫 가문은 카하라타 가문으로, 부마카에 이어 나하파나가 가장 힘센 왕이었다. 나하파나의 땅은 말와와 구자라트, 북콘칸에 이르렀고 은화를 찍었으며, 『에리트라 해 항해기』가 로마 상선이 드나드는 큰 항구로 기록한 바리가자(지금 바룩)가 그 영향권에 있었다. 사위이자 총독 우샤바다타는 나식 일대의 불교 동굴에 많은 재물을 바쳤고, 카를라 대차이티야 홀은 기원후 120년 무렵 바쳐졌다고 한다. 나하파나는 불교와 힌두 제도를 가리지 않고 후원했다. 이 땅은 본래 사타바하나가 다스리던 곳이어서 사타바하나의 고타미푸트라가 나하파나를 꺾고 되찾았다고 하며 그 흔적은 나하파나의 화폐 위에 고타미푸트라의 이름을 덧새긴 화폐로 보인다(「고타미푸트라 사타카르니의 나하파나 격파(124년 무렵)」, 뒤의 사건). 서 크샤트라파는 나하파나 뒤 카르다마카 가문이 이어 다시 일어나게 된다(「카르다마카 가문의 차스타나와 서 크샤트라파의 재기(130년 무렵)」). 부마카와 나하파나의 정확한 연대는 학자마다 다르게 본다. 우샤바다타는 비문에서 소 30만 마리와 금, 마을을 보시했다고 자랑하는데 수는 과장일 수 있다. 같은 비문에는 여러 강의 나루터를 무료로 한 일 같은 공공사업도 적혀 있다. 카하라타 가문의 기원은 분명하지 않고 사카 계통이라는 점도 이름과 칭호로 추정할 뿐이다. 비문에 적힌 해가 어느 기원인지에 따라 연대가 달라져 이 항목의 해도 대략이다. 나하파나의 화폐에는 그리스·브라흐미·카로슈티 세 문자가 함께 쓰였다. 우샤바다타의 아내 닥샤미트라는 나하파나의 딸로 비문에 나온다."
  subjects: [western-satraps, satavahana-dynasty]
  tags: [politics, economy]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Lionel Casson (ed. and trans.), The Periplus Maris Erythraei (Princeton University Press, 1989)"]

- id: gandhara-mathura-art-50
  year: 50
  endYear: 250
  title:
    ko: "간다라 미술과 마투라 미술, 대승 불교의 성장(1~3세기)"
  summary:
    ko: "쿠샨 시대에는 부처를 사람 모습으로 새기는 불상이 퍼졌다. 이전에는 보리수, 법륜, 발자국 같은 상징으로 부처를 나타냈다. 간다라(지금 파키스탄 서북부와 아프가니스탄 동부)의 불상은 헬레니즘과 로마 조각의 영향을 받은 옷 주름과 곱슬머리가 특징이며, 마투라(지금 우타르프라데시)의 불상은 인도 전통의 빨간 사암 조각에서 발전했다. 최초의 불상이 어느 쪽에서 나왔는지는 학자들이 오래 다퉈 왔고, 두 곳이 거의 같은 때 서로 영향을 주고받으며 발전했다고 보는 견해가 많다. 불상 말고도 보살과 힌두 신을 새긴 조각이 쿠샨 때 마투라에서 대량으로 만들어졌다. 사상으로는 중생을 구제하는 보살을 이상으로 삼는 대승 불교가 이 시기에 자리를 잡았고, 이전 부파 불교를 소승이라 불러 구분했다. 용수(나가르주나)는 전승에 따라 사타바하나 왕의 후원을 받았다고 하며 공(空)을 중심으로 중관 사상을 세운 사람으로 알려져 있다. 불교는 비단길을 따라 중앙아시아와 중국으로 퍼졌고, 후한에 불교가 들어온 일도 이 흐름과 이어진다(「불교의 전래와 초기 번역(65~170 무렵)」). 불상과 대승의 시작 연대는 학설이 갈리므로 1~3세기라는 큰 범위로 적는다. 아마라바티의 대리석 불탑 부조는 사타바하나 시기부터 이어져 남인도 불교 미술을 대표하고, 페샤와르의 카니슈카 대탑 터에서 1908년 나온 카니슈카 사리함은 쿠샨 불교 미술의 대표작이다. 마투라에서는 쿠샨 왕의 입상도 만들어져 왕을 기리는 사당 전통을 보여 주며, 붉은 사암 불상은 간다라의 회색 편암 불상과 재료부터 다르다. 봉헌 비문은 불교 미술의 후원자로 왕뿐 아니라 상인과 승려, 여성 신자도 있었다고 전한다."
  subjects: [kushan-empire, satavahana-dynasty]
  tags: [culture, religion]
  sources: ["Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "Xinru Liu, Ancient India and Ancient China: Trade and Religious Exchanges, AD 1–600 (Oxford University Press, 1988)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: indo-roman-trade-60
  year: 60
  endYear: 200
  title:
    ko: "로마와 인도의 바다 무역: 바리가자와 무지리스(1~2세기)"
  summary:
    ko: "기원후 1세기 이집트의 그리스인 상인이 쓴 것으로 보이는 안내서 『에리트라 해 항해기』는 홍해에서 인도 서해안으로 가는 길과 항구, 상품을 적었다. 인도에서는 서쪽의 바리가자(서 크샤트라파와 사타바하나 영향권)와 남서쪽 체라 왕국의 무지리스, 판디아의 항구가 로마 상인의 목적지였다. 로마 쪽에서 가져간 것은 금화와 은화, 포도주, 산호, 유리와 구리·주석·납이었고, 인도에서 나온 것은 후추와 진주, 보석, 상아, 향료와 비단이었다. 2세기의 '무지리스 파피루스'는 알렉산드리아의 수입 상인이 후추 같은 화물을 실은 배 '헤르마폴론'을 담보로 돈을 빌린 계약을 적고 그 화물의 값을 약 900만 세스테르티우스로 평가한다. 체라 왕국에서는 상감 시가 금을 받고 후추를 보낸 야바나 배를 노래했고, 체라 왕을 로마 쪽 기록은 '케로보트라'로 적었다. 이 무역은 서 크샤트라파·사타바하나·체라·판디아를 부유하게 했다. 케랄라 파타남에서 2007년부터 나온 발굴이 무지리스 터인지는 학자들 사이에 의견이 갈린다. 로마 사람은 이 교역으로 금이 인도로 흘러간다고 불평했다고 하나 그 숫자는 확실하지 않다. 『항해기』는 히팔로스라는 선장이 여름 계절풍을 이용해 바다를 곧장 건너는 길을 알렸다고 적는다. 대 플리니우스는 인도와 중국, 아라비아로 해마다 1억 세스테르티우스가 빠진다고 불평했고 다른 대목에서는 인도 몫만 5천만으로 적었다. 남인도의 아리카메두(푸두체리 근처)에서는 로마 암포라와 구슬이 나와 항구 유적으로 알려졌으나 해석에는 의견 차이가 있다. 인도 남부에서 로마 금화가 많이 나오는 것은 거래 규모를 보여 주지만 대부분 땅속 매장 보물이어서 거래 방식을 직접 말해 주지는 않는다."
  subjects: [chera-dynasty, pandya-dynasty, western-satraps, satavahana-dynasty, roman-empire]
  tags: [economy, diplomacy]
  sources: ["Lionel Casson (ed. and trans.), The Periplus Maris Erythraei (Princeton University Press, 1989)", "Roberta Tomber, Indo-Roman Trade: From Pots to Pepper (Duckworth, 2008)", "Kamil V. Zvelebil, Companion Studies to the History of Tamil Literature (Brill, 1992)"]

- id: sangam-age-100
  year: 100
  endYear: 250
  title:
    ko: "상감 시대의 타밀 세 왕국: 체라·촐라·판디아와 타밀 문학(기원전 1세기~기원후 3세기)"
  summary:
    ko: "상감 시대는 기원전 300년 무렵에서 기원후 300년 무렵까지, 좁게는 기원전 100년 무렵에서 기원후 250년 무렵까지로 잡는 타밀 문학과 사회의 시대다. 체라(케랄라와 콩구), 촐라(카베리강 삼각주), 판디아(마두라이 둘레)가 서로 다투며 벨 같은 토착 수장을 거느렸다. 『톨카피얌』은 가장 오래된 타밀 문법서이고 『에투토카이』(여덟 시집)와 『파투파투』(열 노래)는 전쟁과 사랑, 왕의 칭송을 노래한 시를 모았다. 『파티나파팔라이』는 촐라의 카리칼란 왕이 카베리강 어귀 항구 카베리파티남을 도읍으로 삼은 번영을 그리고, 후대의 서사시 『실라파티카람』은 체라의 쳉구투반과 판디아의 네두은젤리얀를 소재로 삼으며 스리랑카 왕 가자바후가 나오는 것을 두고 학자들이 연대를 맞춰 보지만 확실하지 않다. 아누라다푸라의 가자바후 1세(재위 114~136 무렵)가 이 가자바후와 같다고 보는 견해가 널리 알려졌으나, 이는 문학 속 이야기를 사료로 삼는 것이어서 조심해야 한다. 세 왕국은 서양과의 무역으로 이익을 얻었고(「로마와 인도의 바다 무역: 바리가자와 무지리스(1~2세기)」) 비문과 화폐, 영웅석이 이 시기 사회를 알려 준다. 상감 시대 뒤 3세기 중엽부터 칼라브라라 불리는 세력이 타밀 땅을 차지해 세 왕국의 기록이 끊긴다. 카리칼란이 카베리강에 둑을 쌓았다는 전승이 있지만 문학 속 왕들의 재위가 비문이나 화폐로 확인된 경우는 드물다. 그래서 상감 시대의 왕 이름과 재위는 문학에 나오는 것으로 얘기하되 연대는 조심한다. 영웅석(전사를 기리는 돌)과 문학 속 농경·사냥·항구 생활이 이 시대의 사회를 알려 주는 단서다. 그리스 지리가 스트라본은 판디온이라는 인도 왕이 아우구스투스에게 사절을 보냈다고 적어, 판디아가 로마 세계에도 알려졌음을 보여 준다."
  subjects: [chera-dynasty, chola-dynasty, pandya-dynasty, anuradhapura-kingdom]
  tags: [culture, politics]
  sources: ["K. A. Nilakanta Sastri, A History of South India from Prehistoric Times to the Fall of Vijayanagar (Oxford University Press, 1955)", "Kamil V. Zvelebil, Companion Studies to the History of Tamil Literature (Brill, 1992)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: gautamiputra-124
  year: 124
  title:
    ko: "고타미푸트라 사타카르니의 나하파나 격파(124년 무렵)"
  summary:
    ko: "고타미푸트라 사타카르니는 사타바하나의 가장 이름난 왕이다. 재위는 학자마다 60~85년, 103~127년, 106~130년 등으로 크게 갈려 있고, 이 항목은 124년 무렵으로 적는다. 어머니 고타미 발라스리가 아들이 죽고 20년 뒤 나식의 동굴에 새긴 비문은 그가 사카·야바나·팔라바를 꺾고 나하파나 가문을 없앴으며 사타바하나의 가문 영예를 되살렸다고 자랑한다. 나하파나의 은화 위에 고타미푸트라의 이름과 칭호를 덧새긴 화폐가 많이 나오는 점이 이 승리를 뒷받침한다. 이로써 사타바하나는 말와와 서쪽 콘칸, 나식·푸네 일대를 되찾았다. 비문은 그를 '유일한 브라만'이라 부르는데 이 말의 뜻은 학자마다 다르다. 이 승리는 이어 루드라다만의 반격으로 다시 흔들린다(「루드라다만과 주나가드 비문(150년 무렵)」). 일부 학자는 고타미푸트라의 승리를 기원후 78년으로 보고 그 해를 사카력의 시작과 이으나, 이는 소수설이다. 사카력은 뒤에 인도에서 널리 쓰인 달력이 되었다. 비문은 그의 말들이 세 바다의 물을 마셨다고 자랑한다. 20세기 초 나식 근처 조갈템비에서는 나하파나의 은화가 대량으로 나왔는데 대부분 고타미푸트라가 덧새긴 것이라 이 승리를 눈에 보이게 한다. 비문은 그가 사카·야바나·팔라바를 꺾었다고 자랑해, 서인도에 이 외래 세력이 얼마나 자리 잡았는지를 보여 준다. 나식 동굴의 승려들에게 땅을 보시한 기록도 이 비문에 함께 남았다. 그의 재위를 60~85년으로 보는 학자는 이 승리를 1세기 후반으로 올려 보며, 그러면 나하파나와 이어지는 서 크샤트라파 부흥의 연대도 함께 앞당겨진다. 이 연대 논쟁은 사카력 78년의 기원과 얽혀 있어 아직 결론이 나지 않았다."
  subjects: [satavahana-dynasty, western-satraps]
  links:
    - { from: satavahana-dynasty, to: western-satraps, note: "고타미푸트라가 나하파나를 꺾고 말와·콘칸·나식 일대를 되찾음 (124 무렵)" }
  tags: [war, politics]
  sources: ["K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: kushan-kanishka-127
  year: 127
  endYear: 150
  title:
    ko: "카니슈카와 쿠샨의 전성(127~150년 무렵)"
  summary:
    ko: "카니슈카 1세는 비마 카드피세스의 아들로 127년 무렵 즉위해 151년 무렵까지 다스렸다고 본다. 즉위 해에는 오래된 논쟁이 있어 기원후 78년(사카력과 같다는 설), 100년 앞뒤, 127년 무렵 등이 거론되었고, 최근에는 하리 팔크의 연구가 힘을 얻어 127년을 따르는 학자가 많으며 이 항목도 그에 따른다. 1993년 아프가니스탄 라바탁에서 발견된 박트리아어 비문은 카니슈카 시대 초에 새겨졌고 그의 가계를 증조부 쿠줄라 카드피세스까지 올려 적으며, 그가 지배한 도시로 우자인·쿤디나·사케타·카우삼비·파탈리푸트라를 든다. 이 도시 목록은 쿠샨의 영향이 갠지스 평원까지 닿았음을 보여 주지만 직접 지배했는지는 학자마다 달리 본다. 카니슈카는 푸루샤푸라(페샤와르)와 마투라를 중심으로 다스렸고, 금화에 그리스·이란·인도 신을 새겨 여러 문화를 아울렀다. 불교 전승은 그가 카슈미르에서 결집을 열었다고 하고, 시인 아슈바고샤와 의학자 차라카를 후원했다고도 전한다. 이 이야기의 대부분은 후대 전승이다. 이 시기 쿠샨은 서북 인도와 중앙아시아를 잇는 큰 나라로 후한과 로마 사이의 비단길 교역을 중개했다. 라바탁 비문은 카니슈카가 그리스어를 놓고 '아리아 말'(박트리아어)을 공식어로 삼았다고 적은 것으로 유명하다. 법현과 현장 같은 중국 순례자들은 카니슈카가 페샤와르에 큰 탑을 세웠다고 전한다. 카니슈카의 금화는 로마 금화의 무게 표준을 따랐다고 설명하며 쿠샨이 서쪽 세계와 경제적으로 이어졌음을 보여 준다. 카니슈카의 연대는 사타바하나와 서 크샤트라파의 연대에도 영향을 주어 인도 고대사 연대 논쟁의 중심에 있다. 카니슈카의 뒤는 「카니슈카 뒤의 쿠샨: 후비슈카와 바수데바 1세(150~230년 무렵)」(뒤의 사건)을 가리킨다."
  subjects: [kushan-empire, western-satraps]
  tags: [politics, religion]
  sources: ["Harry Falk, ‘The Yuga of Sphujiddhvaja and the Era of the Kuṣāṇas’, Silk Road Art and Archaeology 7 (2001)", "Nicholas Sims-Williams·Joe Cribb, ‘A New Bactrian Inscription of Kanishka the Great’, Silk Road Art and Archaeology 4 (1995/6)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: indo-parthian-fall-127
  year: 127
  endYear: 226
  title:
    ko: "인도-파르티아 왕국의 마지막 100년과 사산의 정복(127~226년 무렵)"
  summary:
    ko: "1세기 후반 쿠샨에 인도의 땅을 빼앗긴 뒤 인도-파르티아 왕국은 시스탄과 신드·마크란 해안 쪽으로 줄어들었다. 2세기에는 쿠샨이 카니슈카 때 신드 북부까지 들어오고(「카니슈카와 쿠샨의 전성(127~150년 무렵)」), 서 크샤트라파가 하부 신드를 차지해 인도-파르티아에는 마크란 해안 일대가 남았다. 이 시기 왕들은 화폐로만 확인되며 우보우자네스와 파코레스 뒤의 왕계는 불분명하다. 마지막으로 이름이 전하는 왕은 파른 사산(재위 210~226 무렵)이다. 3세기 초 사산 제국의 아르다시르 1세가 파르티아를 무너뜨린 뒤(224년 무렵) 사산은 시스탄을 차지했고, 이슬람 사가 타바리는 투란과 시스탄이 기원후 230년 무렵 아르다시르에게 복종했다고 적는다. 이 항목은 인도-파르티아의 끝을 226년으로 잡으며, 사료마다 224~230년 무렵으로 차이가 난다. 발루치스탄의 지역 왕조 파라타라자는 262년 무렵 사산의 영향 아래 들어갔다. 『에리트라 해 항해기』는 인더스 하구 일대를 서로 몰아내며 싸우는 파르티아 군주들의 땅으로 적었다. 마크란과 발루치스탄 쪽은 사료가 거의 없어 화폐 몇 점으로만 정치 지형을 짐작한다. 서 크샤트라파와 쿠샨 사이에 끼어 신드·마크란의 작은 세력으로 줄어든 이 왕통이 어디까지 남았는지는 고고학 자료가 부족하다. 226년은 사산의 성립과 파르티아의 끝을 기준으로 한 대략이다. 마크란 해안의 항구와 사막 길은 인도양 무역로의 일부여서 이 땅의 주인이 누구냐는 쿠샨과 사산 모두에게 중요했다. 아르다시르와 샤푸르 1세가 쿠샨의 서쪽 땅을 흡수하는 이야기는 「사산의 쿠샨 땅 진출과 쿠샨샤 왕국(231~286년 무렵)」(뒤의 사건)에서 이어진다."
  subjects: [indo-parthian-kingdom, kushan-empire, western-satraps, sasanian-empire]
  tags: [politics, war]
  sources: ["Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques: Catalogue raisonné (Bibliothèque nationale, 1991)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: chastana-kardamaka-130
  year: 130
  title:
    ko: "카르다마카 가문의 차스타나와 서 크샤트라파의 재기(130년 무렵)"
  summary:
    ko: "나하파나 뒤 서 크샤트라파는 사타바하나에게 쫓겨 한동안 힘을 잃었다(「고타미푸트라 사타카르니의 나하파나 격파(124년 무렵)」, 앞의 사건). 이를 되살린 것은 카르다마카 가문의 차스타나였다. 차스타나는 우자인을 근거지로 삼아 서 크샤트라파의 땅을 다시 모았고, 프톨레마이오스의 『지리학』이 '오제네(우자인)의 티아스테네스'로 적은 인물과 같다고 본다. 그의 손자 루드라다만 1세가 130년 무렵 마하크샤트라파가 되어 서쪽 쿠치와 하부 신드까지 땅을 넓혔다. 차스타나 가문은 사카 계통이지만 이미 인도화되어 이름에 인도 이름이 섞이고 비문에 산스크리트를 쓰기 시작했다. 일부 학자는 78년에 시작하는 사카력을 차스타나의 즉위로 보지만 카니슈카의 즉위로 보는 견해와 사타바하나의 승리로 보는 견해도 있어 학설이 갈린다. 사카력은 뒤에 서 크샤트라파가 쓰며 인도의 대표적인 달력이 되었다. 차스타나와 아들 자야다만은 화폐에 함께 이름을 새겨 공동으로 다스린 것으로 본다. 쿠치 안다우에서 나온 사카력 52년(기원후 130년) 비문은 차스타나와 손자 루드라다만의 이름을 함께 적는다. 서 크샤트라파의 이 시기 왕통은 같은 이름이 반복되고 화폐 연호가 사카력으로 적혀, 비문과 화폐를 맞춰야 연대를 얻는다. 우자인이 도읍이 되면서 내륙 말와와 구자라트 항구들이 한 나라로 묶였다. 차스타나라는 이름은 프톨레마이오스의 철자에서 복원한 것이어서 읽기에 따라 다르다. 사카력은 서 크샤트라파가 계속 써서 화폐와 비문에 연호가 그대로 남았고, 이 점이 이 가문의 연대를 다른 왕조보다 촘촘히 맞추게 해 준다. 루드라다만의 전성은 「루드라다만과 주나가드 비문(150년 무렵)」(뒤의 사건)에서 이어진다."
  subjects: [western-satraps, satavahana-dynasty]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: rudradaman-150
  year: 150
  title:
    ko: "루드라다만과 주나가드 비문(150년 무렵)"
  summary:
    ko: "루드라다만 1세는 130년 무렵부터 150년 무렵까지 서 크샤트라파를 다스린 가장 이름난 마하크샤트라파다. 구자라트 기르나르 바위에 새긴 주나가드 비문은 사카력 72년(기원후 150년)에 새겼고, 산스크리트로 쓴 가장 긴 초기 비문으로 꼽힌다. 비문에 따르면 루드라다만은 말와와 아파란타, 신드, 사우라슈트라, 쿠쿠라, 아누파를 아우르고 야우데야 같은 부족을 꺾었으며, 사타바하나의 사타카르니를 두 번 꺾었으나 혼인으로 맺은 사이여서 죽이지 않았다고 한다. 이 사타카르니가 누구인지는 학설이 갈리며, 고타미푸트라의 아들 풀루마비나 그 다음 바시슈티푸트라 사타카르니로 보는 설이 있다. 비문의 또 다른 주제는 수다르샨 호수다. 이 호수는 마우리아 때 찬드라굽타의 총독 푸샤굽타가 쌓았고 아소카 때 야바나 왕 투샤스파가 수로를 더했다고 비문이 적으며, 루드라다만이 그 둑이 터진 것을 백성에게서 세금을 더 걷지 않고 자기 재물로 고쳤다고 자랑한다. 이 비문은 마우리아의 총독 아래 그리스인 관리가 있었다는 드문 증거이기도 하다. 루드라다만은 비문에서 문법과 음악, 논리와 말·코끼리 다루기에 능통하다고 자랑한다. 이처럼 외래 사카 출신의 왕이 산스크리트 문학의 이상을 앞세운 것은 서인도에서 사카 지배층이 인도 문화 속에 녹아든 과정을 보여 준다. 비문이 든 땅 이름 가운데 아파란타(북콘칸)와 아누파(나르마다강 유역), 쿠쿠라(구자라트 북부)는 위치 비정이 학설마다 다르다. 우자인이 도읍이었다는 점은 프톨레마이오스의 기록과 맞는다. 주나가드 바위에는 아소카 칙령이 먼저 새겨져 있고, 그 곁에 루드라다만의 비문, 뒤에 스칸다굽타의 비문이 이어져 세 시대의 기록이 한 바위에 남았다."
  subjects: [western-satraps, satavahana-dynasty]
  links:
    - { from: western-satraps, to: satavahana-dynasty, note: "루드라다만이 사타바하나를 두 번 꺾고 말와·콘칸 일대를 되찾음 (150 무렵)" }
  tags: [war, politics, culture]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: kushan-successors-150
  year: 150
  endYear: 230
  title:
    ko: "카니슈카 뒤의 쿠샨: 후비슈카와 바수데바 1세(150~230년 무렵)"
  summary:
    ko: "카니슈카가 151년 무렵 죽은 뒤 쿠샨은 후비슈카(151~190 무렵)가 이었고, 바수데바 1세(190~230 무렵)가 '대쿠샨'의 마지막 왕이다. 위키백과 영어판은 바수데바 1세의 재위를 190~230년 또는 191~225년으로 적어 본문과 표 사이에 차이가 있다. 이름 가운데 바수데바가 인도식 이름(비슈누의 이름)이라는 점은 쿠샨 왕가가 이 무렵 인도화했음을 보여 준다. 후비슈카의 화폐에는 시바와 그리스·이란의 신들이 함께 나오며 마투라에서 나온 비문이 이어진다. 후비슈카 때 쿠샨은 카불에서 마투라까지 이어진 땅을 지켰지만, 뒤 왕인 카니슈카 2세(230~247 무렵), 바시슈카(247~267 무렵), 카니슈카 3세(267~270 무렵)로 이어지면서 힘이 약해졌다는 것이 연구자들의 대체적 견해다. 중국 사서는 기원후 229년 대월지 왕 파조(바수데바로 본다)가 위에 사신을 보냈다고 적는다. 바수데바 1세가 죽은 뒤 제국은 동서로 나뉘었고 서쪽은 사산에게 흡수된다(「사산의 쿠샨 땅 진출과 쿠샨샤 왕국(231~286년 무렵)」). 후비슈카는 마투라에 큰 승원을 세웠다고 비문이 전하며, 후비슈카 이후 금화의 질은 점차 떨어졌다고 화폐 연구가 본다. 이 무렵 간다라에서는 카로슈티 글자로 불경이 필사되었다. 후비슈카의 화폐에는 시바(오에쇼)와 마하세나, 그리스 신 세라피스까지 나와 쿠샨 지배층이 여러 신을 한꺼번에 내세웠음을 보여 준다. 그 뒤 왕들 아래에서 두 갈래가 더 굳어졌다는 설명이 일반적이다. 후비슈카의 이름은 마투라와 카불 쪽 비문에 모두 나온다. 쿠샨의 전성은 「카니슈카와 쿠샨의 전성(127~150년 무렵)」(앞의 사건)에서 다룬다."
  subjects: [kushan-empire, sasanian-empire]
  tags: [politics]
  sources: ["Harry Falk, ‘The Yuga of Sphujiddhvaja and the Era of the Kuṣāṇas’, Silk Road Art and Archaeology 7 (2001)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: satavahana-revival-180
  year: 180
  endYear: 224
  title:
    ko: "야즈냐 슈리 사타카르니와 사타바하나의 회복과 끝(180~224년 무렵)"
  summary:
    ko: "루드라다만에게 말와와 나식·푸네를 잃은 사타바하나는 2세기 후반에 다시 일어났다. 고타미푸트라 뒤에는 바시슈티푸트라 풀루마비(학설에 따라 96~119년 무렵 또는 85~125년 무렵)와 바시슈티푸트라 사타카르니(120~149 무렵 또는 138~145 무렵)가 이었고, 후자가 루드라다만의 딸과 혼인했다고 보는 해석이 있다. 푸라나가 마지막 큰 왕으로 부르는 야즈냐 슈리 사타카르니(170~199 무렵, 학설에 따라 181년 무렵에 끝났다고도 한다) 때 서 크샤트라파에게 잃었던 남쪽 땅을 되찾은 것으로 본다. 그의 화폐는 안드라 남부 해안과 서쪽 콘칸, 구자라트에서 함께 나와 사타바하나의 힘이 동서 해안에 걸쳤음을 보여 주고, 선박 무늬가 든 화폐는 코로만델 해안의 바다 무역을 알려 준다(「로마와 인도의 바다 무역: 바리가자와 무지리스(1~2세기)」). 사타바하나는 납과 구리 합금 화폐를 널리 썼고 은화는 서 크샤트라파의 은화를 본뜨거나 덧새긴 것이 대부분이다. 도읍은 서쪽의 프라티슈타나(지금 파이탄)와 동쪽의 아마라바티(다난야카타카)로 알려지며, 서해안 무역의 이익이 파이탄과 테르 같은 도시의 번영과 이어졌다. 데칸의 암각 사원이 이 시기에 만들어지고, 하라(할라)가 짓거나 모은 것으로 전하는 프라크리트 시집 『가타 삽타샤티』가 이 시기의 생활과 마음을 노래한다. 이 시집의 시구는 농부와 연인, 장사꾼의 일상을 짧게 그린다. 현재 꼴은 뒤에 다듬어졌다. 야즈냐 슈리 뒤에는 푸라나가 비자야, 찬다 슈리, 풀루마비 4세를 들며, 위키백과 영어판은 풀루마비 4세(217~224 무렵)를 본줄기의 마지막 왕으로 적는다. 이들 아래에서 땅은 줄어들었고, 3세기 초 왕권이 약해진 끝에 224년 무렵 나라가 여러 갈래로 나뉜다."
  subjects: [satavahana-dynasty, western-satraps]
  tags: [politics, culture]
  sources: ["K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)"]

- id: deccan-dynasties-225
  year: 225
  endYear: 275
  title:
    ko: "사타바하나 뒤의 데칸: 이크슈바쿠·아비라·추투·바카타카·팔라바(225~275년 무렵)"
  summary:
    ko: "사타바하나는 마지막 왕 풀루마비 4세(217~224 무렵) 뒤 224년 무렵 끝나고 땅이 여러 갈래로 나뉘었다. 크리슈나강 아래쪽에서는 안드라 이크슈바쿠 가문이 나가르주나콘다를 중심으로 나라를 세웠고, 북콘칸과 나식·푸네 쪽에서는 아비라 왕국이, 바나바시(지금 카르나타카 북서부) 둘레에서는 추투 왕국이 일어났다. 세 나라 모두 사타바하나 시기의 관리나 지방 세력이 독립한 것으로 보며 비문이나 화폐가 몇 건뿐이어서 연대와 경계는 대략이다. 250년 무렵에는 빈디야샥티가 바카타카 왕조를 열어 비다르바와 사트푸라 남쪽 기슭을 다스렸다. 재위는 250~270년 또는 250~275년 무렵이며, 아들 프라바라세나 1세(270~330 또는 275~335 무렵)는 바카타카 왕들 가운데 유일하게 '삼라트(황제)'를 칭했다. 275년 무렵 안드라 남부 넬로르 둘레에서 팔라바가 일어났다. 가장 이른 팔라바 기록은 프라크리트로 쓴 마이다볼루·히라하다갈리 동판이며 이 가운데 시바스칸다바르만의 8년(283년 무렵) 기록에 그의 아버지 바파데바의 이름이 나온다. 팔라바의 기원은 학설이 갈리며 촐라 왕자 톤다이만 일란디라이얀을 시조로 삼는 타밀 전승도 있다. 추투 왕들은 사타카르니라는 이름을 이어 썼고(하리티푸트라 비슈누카다 추투쿨라난다 사타카르니), 이는 사타바하나의 후계를 자처한 것으로 읽는다. 이크슈바쿠의 시리 찬타물라(산타물라) 왕은 나가르주나콘다에서 베다 제사를 올렸고 왕가 여성들은 불교 사원을 후원했다. 이 다섯 갈래의 땅은 이후 굽타 시대에 사무드라굽타의 남방 원정로와 겹친다(「찬드라굽타 1세와 굽타 제국의 성립(320~335)」, 뒤의 사건). 사타바하나의 끝은 「야즈냐 슈리 사타카르니와 사타바하나의 회복과 끝(180~224년 무렵)」(앞의 사건)에서 이어진다."
  subjects: [andhra-ikshvaku-dynasty, abhira-kingdom, chutu-kingdom, vakataka-dynasty, pallava-dynasty]
  tags: [politics]
  sources: ["K. A. Nilakanta Sastri (ed.), A Comprehensive History of India, vol. 2: The Mauryas and Satavahanas (Orient Longmans, 1957)", "Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Upinder Singh, A History of Ancient and Early Medieval India: From the Stone Age to the 12th Century (Pearson Education, 2008)"]

- id: kushanshahr-231
  year: 231
  endYear: 286
  title:
    ko: "사산의 쿠샨 땅 진출과 쿠샨샤 왕국(231~286년 무렵)"
  summary:
    ko: "바수데바 1세가 죽은 뒤 쿠샨은 동서로 나뉘었고, 서쪽인 박트리아는 3세기 초 새로 일어난 사산 제국의 아르다시르 1세(재위 224~242)에게 넘어갔다. 이슬람 사가 타바리는 쿠샨과 투란 군주들이 230년 무렵 그에게 복종했다고 적는다. 아들 샤푸르 1세(재위 240~270)의 카바이 자르두슈트 비문은 샤푸르의 영토를 '쿠샨의 나라, 푸루샤푸라(페샤와르)까지'라 적고 투란과 마크란도 들었다고 하나 이는 사산 쪽의 주장이며 실제 지배의 범위는 확인되지 않는다. 사산은 쿠샨 땅을 직접 다스리기보다 왕가의 인물을 '쿠샨샤'로 앉히는 방식을 썼다. 이 쿠샨샤들은 쿠샨의 칭호와 박트리아어 화폐를 이어 썼고 이들의 나라를 쿠샨샤르 왕국이라 부른다. 호르미즈드 1세 쿠샨샤(277~286 무렵)는 힘을 키워 사산에 맞서 반란을 일으켰다. 동쪽의 쿠샨은 바수데바 2세(270~300 무렵)부터 '작은 쿠샨'으로 불리며 펀자브와 탁실라를 중심으로 이어졌다. 쿠샨샤르는 360년 무렵 키다라에 간다라를 잃을 때까지 이어진다. 샤푸르 1세의 비문은 페르세폴리스 곁 낙쉐 로스탐의 카바이 자르두슈트에 새겨진 것이다. 이 비문은 사산 쪽 선전이어서 실제 지배 범위는 화폐와 비문으로 따로 확인해야 한다. 쿠샨샤르가 어떤 정치 구조였는지는 쿠샨샤 화폐의 도상과 박트리아어 문서에서 알 수 있다. 사산이 직접 점령했는지 쿠샨 쪽이 복속을 받아들였는지는 자료마다 다르게 읽는다. 남아시아 쪽 땅은 페샤와르 분지와 탁실라에 걸쳤다. 샤푸르 1세는 아들들을 아르메니아와 시스탄의 왕으로 앉힌 사례가 있어 쿠샨샤도 같은 방식의 지방 왕으로 읽는다. 사산의 종교 사정은 「사산의 종교: 마니교의 등장과 사제 카르티르(242~293)」를 가리킨다."
  subjects: [kushan-empire, kushano-sasanian-kingdom, sasanian-empire]
  links:
    - { from: sasanian-empire, to: kushan-empire, note: "아르다시르 1세와 샤푸르 1세가 쿠샨의 서부를 차지하고 쿠샨샤를 세움 (231~240 무렵)" }
  tags: [politics, war]
  sources: ["Richard Salomon, Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages (Oxford University Press, 1998)", "Romila Thapar, Early India: From the Origins to AD 1300 (University of California Press, 2002)", "Harry Falk, ‘The Yuga of Sphujiddhvaja and the Era of the Kuṣāṇas’, Silk Road Art and Archaeology 7 (2001)"]
