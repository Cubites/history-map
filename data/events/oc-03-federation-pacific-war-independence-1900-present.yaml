# 오세아니아 사건: 연방·자치령, 위임 통치, 태평양 전쟁, 독립과 현대 (1900 ~ 현재)
# 범위: (1900년~1945년) 1900년 통가 보호령부터 1945년 일본 항복과 파푸아·뉴기니 행정 통합까지(오스트레일리아 연방과 이민 제한법, 파푸아 법과 뉴헤브리디스 공동 통치, 뉴질랜드 자치령, 캔버라와 노던 준주, 독일령 점령, 앤잭 기념일, 서사모아의 인플루엔자와 마우 운동, 국제 연맹 위임 통치, 코니스턴 학살, 뉴기니 고지대, 웨스트민스터 헌장 수락, 애도의 날, 라바울·산호해·코코다·과달카날·타라와·마리아나 전투, 일본 항복) (1946년~현재) 1946년 비키니 환초 핵실험부터 2023년 투발루·오스트레일리아 연합 협정까지(태평양 핵실험과 비핵 운동, 독립과 자유 연합, 헌정·원주민 권리·난민 정책, 기후 변화).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 해: (1900년~1945년) 모두 기원후 연도라 천문 연도와 같다. 연방 선포 1901-01-01, 파푸아 법 시행 1906-09-01(1905년 법·1902년 특허장은 따로), 뉴헤브리디스 협약 서명 1906-10-20·효력 1907, 뉴질랜드 자치령 포고 1907-09-09·효력 1907-09-26, 웨스트민스터 헌장(1931) 오스트레일리아 수락 재가 1942-10-09(1939-09-03으로 소급)·뉴질랜드 1947-11-25, 파푸아·뉴기니 행정 통합 1949-07-01. 인구·사망자는 누구의 값인지 글에 밝혔다. (1946년~현재) 모두 기원후라 천문 연도와 같다. 항목 해와 사건 해가 다른 곳은 글에서 '무렵'과 다른 해를 함께 밝혔다(뉴질랜드의 독립 해 1907·1947·1986, 마셜 제도·미크로네시아 연방 1986 발효와 1990 신탁 통치 끝, 키리바시 1979).
# 날짜: (1900년~1945년) 모두 그레고리력. 날짜변경선 가까운 곳(사모아·길버트)의 날짜는 현지 날짜. (1946년~현재) 모두 그레고리력. 날짜변경선 양쪽의 같은 날은 현지 날짜로 썼다(사모아 2011-12-30을 건너뜀, 키리바시 1995 날짜변경선 이동).
# 이름 규칙: (1900년~1945년) 항목 이름(통가 왕국·오스트레일리아·뉴사우스웨일스 식민지·반디먼즈랜드·웨스턴오스트레일리아 식민지·사우스오스트레일리아 식민지·빅토리아 식민지·퀸즐랜드 식민지·영국령 뉴기니·파푸아 준주·뉴헤브리디스 공동 통치령·뉴질랜드 식민지·뉴질랜드·독일령 사모아·독일령 뉴기니·서사모아·뉴기니 위임 통치령·파푸아뉴기니 준주·오스트레일리아 원주민·파푸아인·영국령 솔로몬 제도·미크로네시아인·차모로인)을 글자 그대로 썼다. (1946년~현재) 항목 이름(서사모아·사모아·나우루·피지 식민지·피지·통가 왕국·파푸아뉴기니 준주·파푸아뉴기니·영국령 솔로몬 제도·솔로몬 제도·투발루·키리바시·뉴헤브리디스 공동 통치령·바누아투·마셜 제도·미크로네시아 연방·팔라우·누벨칼레도니·프랑스령 폴리네시아·미크로네시아인·오스트레일리아 원주민·토레스 해협 제도 원주민)을 글자 그대로 썼다.
# 지도 결정과의 관계: (1900년~1945년) 오스트레일리아와 뉴질랜드는 영국 제국 안의 자치령으로 적었고(영국 연방이라는 말은 웨스트민스터 헌장 이야기에서만), 원주민 사회는 땅 없는 항목이라 links 없이 subjects만 썼다. 민감한 사건(코니스턴 학살·검은 토요일·일본 점령)은 사실과 숫자만 쓰고 숫자가 갈리면 범위와 누구의 값인지를 밝혔다. (1946년~현재) 오스트레일리아·뉴질랜드는 '영국 제국 안의 자치령'에서 웨스트민스터 헌장 수락과 헌법법을 거치며 독립 국가가 된 과정을 글로 풀었고, 자유 연합 협정은 국방이 미국 몫이라는 점을 글로 밝혔다. 분쟁·민감한 일(부건빌·누벨칼레도니·피지 쿠데타·핵실험 피해·아이 떼어 냄)은 일어난 일과 숫자 범위만 적었다.
# 한국사와 닿는 점: (1900년~1945년) 타라와에서 조선인 노무자 129명이 포로가 된 일 한 구절. 그 밖에는 한국사와 억지로 잇지 않음. (1946년~현재) 앤저스 조약 사건에서 6·25 전쟁 파병을 한 구절로 가리킨다.
# 가리킨 기존 사건: (1900년~1945년) 「전쟁의 확대와 갈리폴리 전투」, 「아일랜드 자유국과 웨스트민스터 헌장」, 「태평양 전쟁 발발」과 같은 파일 사건, 앞 파일의 고정 사건. (1946년~현재) 「6·25 전쟁 발발」, 「서뉴기니 분쟁과 뉴욕 협정(1961~1969)」과 같은 파일 안 고정 사건.

- id: tonga-protectorate-1900
  year: 1900
  endYear: 1905
  title:
    ko: "통가의 영국 보호령과 서태평양 고등판무관(1900~1905)"
  summary:
    ko: "1900년 5월 18일 통가 왕국과 영국은 우호 보호 조약을 맺었고, 통가는 외교를 영국에 맡기는 보호령이 되었다. 통가 왕국은 조지 투포우 1세(1845~1893년 재위)가 섬들을 하나로 묶고 1875년 헌법을 만들어 틀을 갖춘 나라였는데(「조지 투포우 1세의 통가 통일과 1875년 헌법(1845~1875)」(앞의 사건)), 1893년 2월 18일 왕위를 이은 조지 투포우 2세(대관식은 1893년 7월 17일로 적히나 위키백과 영어판 첫머리에는 3월 17일이라는 서술도 있다. 1918년 4월 5일까지 재위) 때에는 정부의 부패와 비효율이 문제가 되었다. 위키백과 영어판은 유럽인 정착민과 경쟁하는 통가 추장들이 왕을 몰아내려다 실패한 끝에 보호령이 되었다고 설명하고, 1900년 의회가 왕의 회계를 여러 차례 감사해 수천 파운드의 차액을 찾아냈다고 적는다. 조약은 통가의 주권과 왕정을 그대로 두면서 영국이 외교를 맡는 것이었고, 영국이 둘 수 있는 상주 대표는 영사 한 사람으로 정해져 이 자리가 1901년부터 1970년까지 이어졌다. 영사는 영국령 피지에 자리한 서태평양 고등판무관의 감독 아래 일했는데, 이 자리는 영국이 태평양 섬 일을 다루려고 1877년에 만들어 피지 총독이 겸하게 한 것이다. 1905년에는 보충 협정으로 영국 영사가 통가 정부의 재정과 외국인 문제를 살피는 몫이 넓어졌다. 그래서 통가는 식민지가 되지 않고 보호를 받는 왕국으로 남았고, 오늘날까지 태평양 섬나라 가운데 군주정을 지킨 유일한 나라로 꼽힌다. 조지 투포우 2세가 결핵으로 43세에 숨지자 딸 살로테 투포우 3세가 왕위를 이어 1965년 12월 16일까지 재위했다."
  subjects: [kingdom-of-tonga]
  tags: [politics, diplomacy, colonization]
  sources: ["위키백과 영어판 Tonga", "위키백과 영어판 George Tupou II", "위키백과 영어판 Western Pacific High Commission"]

- id: federation-1901
  year: 1901
  endYear: 1901
  title:
    ko: "오스트레일리아 연방과 이민 제한법(1901)"
  summary:
    ko: "1901년 1월 1일 시드니 센테니얼 공원에서 연방 선포식이 열리고 헌법이 효력을 얻어 뉴사우스웨일스 식민지, 빅토리아 식민지, 퀸즐랜드 식민지, 사우스오스트레일리아 식민지, 웨스턴오스트레일리아 식민지, 태즈메이니아(1856년까지 반디먼즈랜드)의 여섯 식민지가 하나의 오스트레일리아 연방을 이루는 주가 되었다(영국 의회가 1900년 7월 5일 헌법을 통과시켜 7월 9일 재가한 과정은 「연방 헌법 회의와 오스트레일리아 연방 헌법(1891~1900)」(앞의 사건)). 오스트레일리아는 영국 왕을 국가 원수로 두는 영국 제국 안의 자치령이 되었다. 에드먼드 바턴이 1월 1일 아홉 명의 임시 내각을 이끄는 첫 총리로 취임했고(1903년 9월 24일까지), 3월 선거 뒤에도 과반 없이 총리직에 남았다. 첫 연방 의회는 멜버른 왕립 전시관에서 5월 9일 열렸고, 새 수도가 지어질 때까지 멜버른이 임시 수도 구실을 했다. 이때 오스트레일리아 인구는 380만 명 안팎으로 어림된다. 새 정부는 곧 '백호주의'라 불린 이민 정책의 틀을 법으로 만들었다. 바턴이 6월 5일 처음 올린 이민 제한법은 1901년 12월 23일 재가되어, 이민 심사관이 들어오려는 사람에게 관리가 정한 유럽 언어로 50단어를 받아쓰게 하고 서명하게 할 수 있도록 했다. 1902~1909년에 이 시험을 본 1,359명 가운데 통과한 사람은 52명뿐이었다. 같은 1901년의 태평양 섬 노동자법은 퀸즐랜드 식민지 사탕수수 농장에 들어오던 태평양 섬 노동자의 새 모집을 1904년 이후 막고 1906년 뒤 이미 와 있던 이들을 돌려보내게 했다(노동 이주의 내력은 「블랙버딩과 태평양 노동 이주(1863~1904)」(앞의 사건)). 오늘날의 노던 준주 땅은 1901년에도 사우스오스트레일리아 식민지의 몫이었고 1911년에야 연방 정부 아래로 넘어간다(「노던 준주 이관과 캔버라 수도(1911~1913)」(뒤의 사건))."
  subjects: [australia, new-south-wales, van-diemens-land, western-australia, south-australia, victoria, queensland]
  tags: [politics, colonization, society]
  sources: ["위키백과 영어판 Federation of Australia", "위키백과 영어판 Immigration Restriction Act 1901", "위키백과 영어판 List of prime ministers of Australia", "위키백과 영어판 Pacific Island Labourers Act 1901"]

- id: papua-new-hebrides-1906
  year: 1906
  endYear: 1907
  title:
    ko: "파푸아 법과 뉴헤브리디스 공동 통치(1906~1907)"
  summary:
    ko: "1884년 보호령으로 출발한 영국령 뉴기니(분할의 내력은 「뉴기니 분할: 독일령 뉴기니와 영국령 뉴기니(1884~1886)」(앞의 사건))는 1902년 3월 18일 영국의 특허장으로 오스트레일리아 연방의 권한 아래 놓였고, 1905년 파푸아 법이 1906년 9월 1일 효력을 얻으면서 사라졌다. 그 자리에 오스트레일리아의 외부 영토인 파푸아 준주가 들어섰고 수도는 포트모르즈비였고, 영토는 뉴기니섬 남동부를 차지했다. 위키백과는 1902년부터 1906년까지를 '공백기'라 부르고, 1906년의 왕립 위원회가 행정 비위를 조사해 고위 관리 대부분을 물러나게 하라고 권고했다고 적는다. 물러나야 할 고위 관리에는 조사를 요청했던 행정관 본인도 들어 있었다. 1861년 12월 29일 시드니에서 태어난 휴버트 머리는 1904년 최고 사법관이 되고 1907년 총독 대행을 맡았으며, 행정이 작았던 탓에 사법·행정·입법의 일을 두루 맡다가 1908년 11월 23일 부총독이 되어 1940년 2월 27일 파푸아의 사마라이에서 숨질 때까지 이 영토를 다스렸다. 한편 1906년 10월 20일 영국과 프랑스는 협약(의정서)을 맺어 뉴헤브리디스 공동 통치령을 세웠고, 효력은 이듬해인 1907년에 났다. 영국과 프랑스는 각자 주재 판무관을 따로 두었고(첫 판무관은 영국 쪽 어니스트 레이슨이 1906~1907년, 프랑스 쪽 샤를 보르가 1906~1908년 재임), 경찰·보건·교육·화폐도 둘로 나뉘어 운영되었다. 합동 법원에는 영국인 판사와 프랑스인 판사에 더해 스페인 국왕이 지명한 제3의 판사가 들어갔다. 이렇게 같은 일을 두 번씩 하다 보니 비판하는 사람들은 이 체제를 '판데모니엄(대혼란)'이라 불렀다."
  subjects: [british-new-guinea, territory-of-papua, new-hebrides]
  tags: [politics, colonization, diplomacy]
  sources: ["위키백과 영어판 Territory of Papua", "위키백과 영어판 Hubert Murray", "위키백과 영어판 New Hebrides"]

- id: dominion-nz-1907
  year: 1907
  endYear: 1907
  title:
    ko: "뉴질랜드 자치령(1907)"
  summary:
    ko: "1907년 9월 26일 뉴질랜드는 영국 제국 안의 자치령이 되었다. 에드워드 7세의 포고가 9월 9일 버킹엄 궁에서 내려졌고, 효력이 난 26일 웰링턴에서 첫 총독 플런킷 경이 이를 선포했으며 총리 조지프 워드가 국회 계단에서 포고문을 읽었다고 위키백과 영어판은 전한다. 그때까지 이 땅은 1840년 와이탕이 조약 뒤 영국 식민지로 세워진 뉴질랜드 식민지였고(「와이탕이 조약과 뉴질랜드 식민지(1840~1841)」(앞의 사건)), 이날부터 이름이 뉴질랜드가 되었다. 자치령은 내정을 스스로 맡고 영국 왕을 국가 원수로 두는 지위였으며, 이미 1856년부터 식민지 의회가 책임 정부 아래 내정을 꾸려 오고 있었다. 1893년부터 총리였던 리처드 세던이 1906년 6월 10일 숨지고 윌리엄 홀존스가 6월 21일부터 8월 6일까지 짧게 이끈 뒤, 워드가 8월 6일 총리가 되어 1912년 3월 12일까지 자리를 지켰고, 자치령이 된 뒤 첫 총리로 기록된다. 이때 인구는 100만 명이 채 안 되었다. 워드는 새 칭호를 앞장서 밀었고, 뉴질랜드가 오스트레일리아의 일부가 아님을 세계에 분명히 하려는 뜻도 있었다고 위키백과 영어판은 적는다. 뉴질랜드는 1901년 오스트레일리아 연방에 참여하지 않기로 했기에(「오스트레일리아 연방과 이민 제한법(1901)」(앞의 사건)) 바다 건너 이웃과 따로 영국 제국의 한 자치령이 되었다. 9월 26일은 '자치령의 날'로 기념되었으나 오늘날에는 사우스캔터베리 지방의 9월 셋째 월요일 지방 기념일로만 남아 있다. 뉴질랜드가 영국 의회의 법에서 완전히 벗어나는 웨스트민스터 헌장 수락은 한참 뒤인 1947년 11월 25일에 이뤄진다."
  subjects: [colony-of-new-zealand, new-zealand]
  tags: [politics, colonization, independence]
  sources: ["위키백과 영어판 Dominion of New Zealand", "위키백과 영어판 List of prime ministers of New Zealand"]

- id: canberra-1911
  year: 1911
  endYear: 1913
  title:
    ko: "노던 준주 이관과 캔버라 수도(1911~1913)"
  summary:
    ko: "연방이 세워진 오스트레일리아에서는 시드니와 멜버른이 서로 수도 자리를 다퉈, 두 도시 사이 뉴사우스웨일스 땅에, 헌법 규정에 따라 시드니에서 100마일(약 160킬로미터) 넘게 떨어진 곳으로 새 수도를 짓는 타협을 했다. 1904년의 법이 달갈티를 지명했으나 뉴사우스웨일스 쪽이 땅을 내놓기를 거부했고, 1906년 뉴사우스웨일스가 예스-캔버라 지역 땅을 넘기기로 하여 1908년 캔버라 터가 정해졌으며, 1911년에 그 땅이 연방 수도 구역이 되었다. 같은 1911년 1월 1일에는 사우스오스트레일리아 의회의 이관 법과 연방의 1910년 인수법에 따라 노던 준주가 사우스오스트레일리아에서 떨어져 연방 정부의 직접 통치 아래 들어갔다. 이 땅은 1863년 사우스오스트레일리아에 붙었던 곳이고(「퀸즐랜드 분리와 식민지 경계 다시 긋기(1859~1863)」(앞의 사건)), 인수 때 인구는 3,031명이었다. 연방 정부가 임명하는 행정관이 장관의 지시를 받으며 이곳을 맡았다. 이 땅에는 응우나왈과 응암브리 사람들이 오래전부터 살아 왔고, 유럽인으로는 1823년 조슈아 존 무어가 목장 이름을 '캔베리'로 붙인 것이 이름의 앞선 꼴이다. 1911년 4월 국제 설계 공모가 발표되었고, 137점이 응모한 끝에 1912년 5월 23일 건축가 월터 벌리 그리핀과 그의 아내가 낸 안이 뽑혔다. 그 안은 부부가 함께 그려 낸 것으로, 아내가 도면 그림을 맡았다. 1913년 3월 12일 총독 부인 덴먼 부인이 새 수도의 이름을 '캔버라'라고 발표했다. 연방 의회가 캔버라로 옮겨 온 것은 1927년 5월 9일이었으며 지금의 영구 의사당은 1988년에 문을 열었다."
  subjects: [australia]
  tags: [politics, society]
  sources: ["위키백과 영어판 Canberra", "위키백과 영어판 History of the Northern Territory", "위키백과 영어판 Walter Burley Griffin"]

- id: german-colonies-1914
  year: 1914
  endYear: 1919
  title:
    ko: "오스트레일리아·뉴질랜드의 독일령 점령(1914~1919)"
  summary:
    ko: "제1차 세계 대전이 터지자 영국의 요청으로 두 자치령이 태평양의 독일 식민지를 차지했다. 1914년 8월 29일 뉴질랜드 원정군(약 1,413명, 순양함 여섯 척의 지원)이 독일령 사모아의 아피아에 저항 없이 올랐다(맞선 쪽은 피타피타라 불린 현지 민병 약 100명뿐이었고 싸움은 없었다). 독일 총독 에리히 슐츠에버트는 저항하지 않겠으나 공식으로 항복하지는 않겠다고 밝혔고, 8월 30일 영국 국기가 올랐으며 로버트 로건 대령이 군정 책임자가 되어 1919년까지 이 땅을 다스렸다. 오스트레일리아는 해군·육군 원정대(AN&MEF)를 꾸려 독일령 뉴기니로 보냈는데, 이는 오스트레일리아가 독자로 치른 첫 군사 작전이었다. 9월 11일 비타 파카의 무선 기지 싸움에서 오스트레일리아군은 7명이 죽고 5명이 다쳤으며 독일인 1명과 멜라네시아인 약 30명이 숨졌다. 이날 죽은 오스트레일리아 군인들은 이 전쟁의 첫 전사자로 꼽히지만, 해군 병사 빌리 윌리엄스와 군의관 브라이언 포클리 가운데 누가 먼저인지는 자료가 엇갈린다. 독일 쪽은 9월 15일 에두아르트 하버 총독이 홈스 대령과 만나 17일 항복 조건에 서명했고 남은 병력 약 150명은 21일 항복했으며, 마당은 9월 24일 저항 없이 넘어갔다. 나우루는 11월 6일까지, 독일령 미크로네시아의 섬들은 일본이 9월 29일 잘루이트 환초부터 차지해 마지막 로타섬이 10월 21일 넘어갔다. 독일령 뉴기니의 헤르만 데트츠너 중위는 전쟁이 끝날 때까지 붙잡히지 않았다. 점령한 땅의 처분은 1919년 베르사유 조약으로 정해졌고(「국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)」(뒤의 사건)), 군단의 갈리폴리 상륙과 그 기억은 「앤잭 기념일과 오스트레일리아·뉴질랜드의 전쟁 기억(1915~1916)」(뒤의 사건)에서 다룬다."
  subjects: [australia, new-zealand, german-samoa, german-new-guinea]
  tags: [war, colonization]
  sources: ["위키백과 영어판 Occupation of German New Guinea", "위키백과 영어판 Occupation of German Samoa", "위키백과 영어판 Battle of Bita Paka"]

- id: anzac-1915
  year: 1915
  endYear: 1916
  title:
    ko: "앤잭 기념일과 오스트레일리아·뉴질랜드의 전쟁 기억(1915~1916)"
  summary:
    ko: "1915년 4월 25일 오스트레일리아·뉴질랜드 군단이 갈리폴리반도에 오른 싸움은 「전쟁의 확대와 갈리폴리 전투」(앞의 사건)에서 다룬다. 갈리폴리에서 숨진 사람은 오스트레일리아 8,709명, 뉴질랜드 2,721명이라고 위키백과 영어판은 적는다(누가 센 값인지는 밝히지 않았고 연합군 전체 사망자는 5만 6,000명이 넘는다). 이 전쟁에서 오스트레일리아는 약 6만 명, 뉴질랜드는 약 1만 8,000명의 전사자를 냈다고 한다. 첫 기념은 1916년에 이뤄졌다. 그해 1월 10일 퀸즐랜드의 공공 집회가 4월 25일을 '앤잭 기념일'로 부르기로 결의했고, 4월 25일 오스트레일리아와 뉴질랜드, 런던에서 행사가 열렸다. 런던에서는 오스트레일리아·뉴질랜드 병사 2,000명이 넘게 거리를 행진했고 시드니에서는 매쿼리 거리를 따라 행진이 있었으며, 이집트에서는 존 모너시 장군이 부대를 사열했다. 뉴질랜드는 1916년 이날을 반나절 휴일로 정했고, 1920년 앤잭 기념일 법으로 공휴일을 삼았다. 오스트레일리아에서는 1921년 주 총리 회의가 해마다 4월 25일을 기념하기로 했고 1922년 주 정부들이 연방과 함께 지켜 달라는 요청을 받았으며, 1927년에 처음으로 모든 주가 이날을 공휴일로 지켰다. 기념일은 징병 논쟁과도 얽혔다. 총리 빌리 휴스가 밀어붙인 해외 징병안은 1916년 10월 28일 국민 투표에서 반대 51.61퍼센트(약 116만 표) 대 찬성 48.39퍼센트(약 108만 8,000표)로 부결되었고, 1917년 말의 두 번째 투표에서도 거부되었다. 뉴질랜드는 상륙 소식이 처음 닿은 1915년 4월 30일에도 반나절 휴일을 선포한 바 있다."
  subjects: [australia, new-zealand]
  tags: [war, society, culture]
  sources: ["위키백과 영어판 Anzac Day", "위키백과 영어판 1916 Australian conscription referendum"]

- id: samoa-influenza-1918
  year: 1918
  endYear: 1919
  title:
    ko: "서사모아의 인플루엔자(1918~1919)"
  summary:
    ko: "인플루엔자가 번진 뉴질랜드의 오클랜드에서 온 탈룬호가 1918년 11월 7일 아피아에 닿았을 때 이 배는 검역 없이 항구에 대는 것이 허락되었다. 이때 이 땅은 독일령 사모아라는 이름 그대로 뉴질랜드 군정(로건 대령, 1914~1919) 아래에 있었다(점령의 내력은 「오스트레일리아·뉴질랜드의 독일령 점령(1914~1919)」(앞의 사건)). 병은 일주일 안에 우폴루섬에서 유행병이 되어 온 땅에 퍼졌다. 당시 조사 위원회는 사망자를 약 8,500명, 곧 서사모아 인구의 약 22퍼센트로 어림했고, 위키백과 영어판은 주민의 약 5분의 1이 숨졌다고 적으며 정확한 사망자 수는 자료마다 다르다(위키백과 마우 운동 문서는 이 유행을 1919년의 일로 적기도 한다). 마우 운동 쪽 서술은 피해의 큰 몫이 행정부가 유행을 막지 못한 탓이라고 본다. 이 땅은 1920년 서사모아가 되어 뉴질랜드의 위임 통치를 받았다(「국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)」(뒤의 사건)). 같은 사모아 제도의 아메리칸사모아는 배의 입항을 막아 인플루엔자 사망자가 없었던 것으로 알려져 이웃과 대조되었다. 뉴질랜드 군정이 환자를 격리하지 않고 도움 요청에 늦게 답했다는 비판은 사모아 사람들의 불만을 키웠고, 1920년대 마우 운동의 불씨가 되었다(「서사모아의 마우 운동과 '검은 토요일'(1925~1929)」(뒤의 사건)). 2002년 뉴질랜드 총리 헬렌 클라크는 사모아를 찾아 탈룬호를 검역하지 않은 일을 비롯해 뉴질랜드 통치가 저지른 잘못을 공식으로 사과했다. 사모아의 인플루엔자 유행은 20세기 초 감염병이 태평양 섬 사회에 입힌 피해 가운데 가장 큰 축에 든다."
  subjects: [german-samoa, new-zealand]
  tags: [society, colonization]
  sources: ["위키백과 영어판 Western Samoa Trust Territory", "위키백과 영어판 Mau movement"]

- id: mandates-1920
  year: 1920
  endYear: 1922
  title:
    ko: "국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)"
  summary:
    ko: "1920년 12월 17일 국제 연맹은 독일이 잃은 식민지를 C식 위임 통치로 승전국에 맡겼다. 독일령 사모아는 뉴질랜드가 맡는 서사모아가 되었고(1920~1962), 독일령 뉴기니는 오스트레일리아가 맡는 뉴기니 위임 통치령이 되었다(「오스트레일리아·뉴질랜드의 독일령 점령(1914~1919)」(앞의 사건)). C식은 위임국이 자기 영토에 가깝게 다스릴 수 있는 가장 느슨한 형태였고, 인광석이 나는 나우루도 같은 틀로 영국 제국이 위임받아 오스트레일리아가 중심이 되어 관리했다. 뉴기니 위임 통치령에서는 1921년까지 이어진 군정 뒤 1920년의 뉴기니 법에 따라 민정이 들어섰고, 독일인 정착민의 재산은 1921년부터 대부분 몰수되고 이들은 내보내졌으나 일부 선교사는 남았다. 수도 라바울은 1937년 6월 6일 화산 폭발로 507명이 숨진 뒤 라에로 옮겨졌고, 와우 금광이 경제를 이끌었다. 서사모아에서는 군정을 맡았던 로건 대령(1914~1919)에 이어 로버트 테이트(1919~1923), 조지 리처드슨(1923~1928)이 행정관으로 일했다. 적도 북쪽의 독일령 미크로네시아(괌을 뺀 마리아나 제도·캐롤라인 제도·마셜 제도, 팔라우 포함)는 일본이 같은 C식으로 위임받았다. 위키백과 영어판은 섬들의 인구가 1920년 4,000명이 안 되었다가 1930년 약 7만 명, 1933년 8만 명을 넘었고 1935년에는 일본인만 5만 명이 넘었다고 적는다(문서 안에서도 기준이 맞지 않는다). 1939년 인구 조사에서는 12만 9,104명 가운데 일본인(조선인·중국계 포함)이 7만 7,257명, 섬 원주민이 5만 1,723명이었다. 민정 본부는 1921년 코로르로 옮겨 갔고, 1922년 4월 사이판·팔라우·야프·트루크·폰페이·잘루이트의 여섯 지구에 해군 수비대장 아래 민정 부서가 설치되었다. 일본은 1933년 연맹 탈퇴를 통고했고 1935년 효력이 났으나 섬들을 계속 다스렸다."
  subjects: [german-samoa, german-new-guinea, western-samoa, territory-of-new-guinea, australia, new-zealand]
  tags: [politics, colonization, diplomacy]
  sources: ["위키백과 영어판 Territory of New Guinea", "위키백과 영어판 Western Samoa Trust Territory", "위키백과 영어판 South Seas Mandate", "위키백과 영어판 Rabaul"]

- id: mau-1925
  year: 1925
  endYear: 1929
  title:
    ko: "서사모아의 마우 운동과 '검은 토요일'(1925~1929)"
  summary:
    ko: "마우는 '사모아인의 사모아'를 내세운 비폭력 독립 운동이다. 뿌리는 독일 통치기인 1908년 사바이섬에서 라우아키가 이끈 마우 아 풀레로, 독일 당국은 1909년 지도자들을 추방했다. 뉴질랜드 군정 아래 1918~1919년 유행병으로 인구의 5분의 1이 넘게 숨진 일(「서사모아의 인플루엔자(1918~1919)」(앞의 사건))이 불신을 키웠고 이 땅이 위임 통치를 받는 서사모아가 된(「국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)」(앞의 사건)) 뒤인 1926년 올라프 넬슨이 사모아 연맹 '오 레 마우'를 만들면서 운동이 커졌다. 마을 위원회가 전통 마타이 지도자 체제 위에 서서 수입품을 보이콧하고 세금을 내지 않으며 자체 경찰까지 두었고, 1920년대 말에는 사모아인의 85퍼센트 가까이가 공공연한 저항에 나섰다고 위키백과는 적는다. 행정관 조지 리처드슨(1923~1928)과 스티븐 앨런(1928~1931) 아래에서 약 400명이 체포되었으나 운동은 이어졌다. 1929년 12월 28일(위키백과는 본문에서 29일로도 적는다) 아피아의 마우 시위에서 경찰이 마우 지도자 타마세세 레알로피 3세를 체포하려다 총격이 일어나 타마세세가 뒤에서 총에 맞아 숨졌다. 사모아 쪽 사망자는 위키백과 서술에 따라 타마세세를 포함해 11명 안팎으로 적히고 부상자는 약 50명이었으며 뉴질랜드 경관 1명도 죽어 '검은 토요일'이라 불린다. 1930년 3월에 휴전이 이뤄졌고, 1935년 뉴질랜드에 노동당 정부가 들어서면서 탄압이 누그러졌고, 1946년 사모아 의회(포노)는 신탁 통치 협정안을 거부했다. 이 흐름은 1962년 독립으로 이어졌다(「서사모아의 독립(1962)」(뒤의 사건))."
  subjects: [western-samoa, new-zealand]
  tags: [politics, society, colonization]
  sources: ["위키백과 영어판 Mau movement", "위키백과 영어판 Western Samoa Trust Territory"]

- id: coniston-1928
  year: 1928
  endYear: 1928
  title:
    ko: "코니스턴 학살과 원주민 보호 정책(1928)"
  summary:
    ko: "1928년 8월부터 10월까지 노던 준주 중부 코니스턴 목장 일대에서 경찰 순찰대가 오스트레일리아 원주민을 잇달아 죽였다. 오스트레일리아에서 정부 승인을 받은 마지막 대규모 학살로 불리는 사건이다. 발단은 8월 7일 무렵 딩고 사냥꾼 프레드 브룩스가 유쿠루라는 물웅덩이에서 죽은 일로, 위키백과는 원주민 남성들이 죽였다고 적으면서 까닭에 대해서는 서로 어긋나는 설명이 있다고 덧붙인다. 윌리엄 조지 머리 경관이 이끈 순찰대는 와를피리·안마티예르·카이티티 사람들을 죽였는데, 가뭄 속에서 물과 소 떼를 둘러싼 갈등이 배경이었다. 머리의 공식 보고는 사망자 31명이었으나 문서·유해·구술사를 따른 어림은 70~300명으로 갈리고 최근 연구는 90명 안팎으로 본다. 브룩스 살해로 기소된 원주민 두 사람은 재판이 무너져 풀려났고, 1929년의 조사 위원회는 죽임이 정당했다고 결론 내려 비판자들에게 '덮어 주기'라는 말을 들었다. 2003년에는 75주년 기념행사가 열렸고 2013년 1월 ABC에서 이 일을 다룬 기록 드라마 『코니스턴』이 방영되었다. 살아남은 이들과 후손은 이때를 '죽임의 시간'이라 부르며 구술과 미술로 기억해 왔다. 1910년 노던 준주 원주민 법은 보호관을 원주민과 혼혈 아이 18세까지의 법적 후견인으로 삼았고 1918년 원주민 법령은 보호관의 권한을 더 넓혔으며, 뉴사우스웨일스에서는 1915년부터 이유를 법정에서 증명하지 않고도 아이를 데려갈 수 있었다. 이렇게 아이를 가족에게서 떼어 낸 일을 '도둑맞은 세대'라 하고, 1905년 무렵부터 1960년대 말(일부는 1970년대)까지 이어졌다(1997년 『그들을 집으로』 보고서는 아이 열 명 가운데 한 명에서 셋 가운데 한 명꼴로 떼어졌다고 보았고 이를 곱하면 최소 10만 명이며, 로버트 매니는 2만~2만 5,000명으로 어림했다)."
  subjects: [aboriginal-australians, australia]
  tags: [war, society, politics]
  sources: ["위키백과 영어판 Coniston massacre", "위키백과 영어판 Stolen Generations"]

- id: highlands-1930
  year: 1930
  endYear: 1935
  title:
    ko: "뉴기니 고지대의 '첫 만남'과 금광(1930~1935)"
  summary:
    ko: "마이클(믹) 리히는 1901년 퀸즐랜드 투움바에서 태어나 철도 사무원과 벌목꾼으로 일했고, 1926년 에디 크리크에서 금이 나오자 많은 금 탐사꾼이 뉴기니로 몰려들었는데 그도 그중 한 사람이었다. 뉴기니 위임 통치령에서는 1937~1938년에 융커스 G 31 수송기 네 대가 라에와 와우 사이에 나른 항공 화물이 세계의 나머지를 합친 것보다 많았다고 위키백과는 적는다. 리히는 1930년 마이클 드와이어와 함께 섬을 가로질러, 안쪽이 비어 있다는 믿음과 달리 사람이 살고 있음을 확인했다. 1934년에는 길루웨산 등정에 나선 최초의 유럽인 가운데 하나가 되었으나 잭 하이즈도 같은 공을 주장한다. 1933년 그는 동생 대니얼과 함께(리히 형제) 서부 고지대로 들어갔고 항공 정찰로 와기 계곡을 찾아냈다. 이곳의 파푸아인 사회는 바깥 세계와 닿지 않은 채 고구마 농사와 돼지 사육으로 살고 있었고, 위키백과 서술은 고지대 인구를 나중에 100만 명 가까이로 헤아린다고 전한다. 여기서 '발견'은 유럽인의 시점일 뿐 고지대 사람들에게는 낯선 방문객과의 첫 만남이었다. 리히의 일기는 1930년부터 1934년까지 그의 일행이 벌인 일로 41명이 숨졌다고 적었고, 1936년의 조사는 그가 자기방어로 행동했다고 결론 내렸다. 이 첫 만남을 찍은 필름은 1983년 다큐멘터리 『퍼스트 콘택트』의 바탕이 되었고, 영상은 고지대 사람들이 낯선 사람들을 어떻게 맞았는지를 그들의 증언과 함께 보여 준다. 리히는 1936년 머치슨 상을 받았고 2차 대전에는 오스트레일리아 공군에서 일했으며 1948년 미국 자유 훈장을, 1952년 대영 제국 훈장(MBE)을 받고 1959년 탐험가 클럽 명예 회원이 된 뒤 1979년 뉴기니에서 숨졌다."
  subjects: [territory-of-new-guinea, papuans]
  tags: [society, colonization, economy]
  sources: ["위키백과 영어판 Mick Leahy (explorer)", "위키백과 영어판 Territory of New Guinea"]

- id: westminster-1931
  year: 1931
  endYear: 1942
  title:
    ko: "웨스트민스터 헌장과 오스트레일리아·뉴질랜드의 늦은 수락(1931~1942)"
  summary:
    ko: "1926년 제국 회의의 밸푸어 선언이 자치령을 영국과 동등한 지위로 규정했고, 1931년 12월 11일 영국 의회가 웨스트민스터 헌장을 통과시켜 그 지위를 법으로 정했다(헌장의 내용과 아일랜드·캐나다 쪽은 「아일랜드 자유국과 웨스트민스터 헌장」(앞의 사건)). 그러나 오스트레일리아와 뉴질랜드는 헌장을 받아들여야 영국 의회의 법에서 풀려나는 구조였고, 둘 다 서둘러 수락하지 않았다. 오스트레일리아에서는 1937년 라이언스 정부가 로버트 멘지스 법무 장관을 내세워 수락안을 올렸으나 2차 독회를 지난 뒤 선거 때문에 의회가 해산되며 흐지부지되었다. 그 뒤로도 영국 해군이 지켜 줄 것이라는 믿음 속에서 수락은 우선순위에서 밀렸다. 1941~1942년 영국 전함 프린스 오브 웨일스와 순양전함 리펄스가 가라앉고 싱가포르가 함락되자(「일본의 동남아 침공과 싱가포르 함락(1941~1942)」(뒤의 사건)) 존 커틴 총리와 허버트 에바트 외무 장관은 미국과의 협력으로 방향을 틀었다. 직접 계기로는 중순양함 오스트레일리아호에서 일어난 살인으로 선원 둘이 사형 선고를 받았을 때 영국 제국의 법을 오스트레일리아가 고칠 수 없다는 점이 드러난 일이 꼽힌다. 웨스트민스터 헌장 수락법은 조항이 셋뿐인 짧은 법으로 1942년 10월 9일 재가되었고, 효력은 오스트레일리아가 2차 대전에 들어선 1939년 9월 3일로 소급되었다(1939년 9월 3일 오스트레일리아는 영국을 따라 독일과 전쟁에 들어갔다). 뉴질랜드는 1947년 11월 25일 헌장 수락법으로 같은 길을 갔다. 두 나라는 이때부터 영국 의회의 법이 본국 동의 없이는 자기 나라에 효력을 갖지 않는 영국 연방(커먼웰스)의 한 나라가 되었다."
  subjects: [australia, new-zealand]
  tags: [politics, independence, diplomacy]
  sources: ["위키백과 영어판 Statute of Westminster Adoption Act 1942", "위키백과 영어판 Dominion of New Zealand"]

- id: day-of-mourning-1938
  year: 1938
  endYear: 1938
  title:
    ko: "'애도의 날'과 원주민 권리 운동(1938)"
  summary:
    ko: "1938년 1월 26일은 1788년 제1함대가 시드니에 닿은 지 150년이 되는 날이었다(「제1함대와 뉴사우스웨일스 식민지(1788~1792)」(앞의 사건)). 시드니에서는 오스트레일리아 기념 행사가 크게 열렸는데, 오스트레일리아 원주민은 같은 날 '애도의 날'을 열어 맞섰다. 시드니의 원주민 진보 협회를 이끈 잭 패턴과 윌리엄 퍼거슨이 행사를 꾸렸고(두 단체는 서로 다른 도시에서 활동한 별개 조직이었으나 이날은 함께했다), 멜버른에서 윌리엄 쿠퍼가 이끈 오스트레일리아 원주민 연맹이 힘을 보탰다. 행진은 오스트레일리아 회관으로 이어졌으며, 시드니 시청을 쓰지 못해 마련한 이 모임은 원주민만 참가하는 회의로 열려 약 100명이 모였다. 참석자들은 원주민이 받아 온 학대에 만장일치로 항의하고 '완전한 시민 지위와 공동체 안의 평등'을 요구하는 결의를 채택했다. 1월 31일 대표 약 스무 명이 라이언스 정부(1932~1939)의 총리 조지프 라이언스와 내무 장관 존 매큐언을 만났고 패턴이 열 개 항의 정책 성명을 냈는데, 이 압력은 문화적 동화를 조건으로 시민권으로 가는 길을 열어 주는 원주민 새 정책(뉴딜)에 영향을 주었으나 시행은 정체했고 많은 권고가 몇십 년 뒤에야 이뤄졌다. 같은 해 4월에는 짧게 이어진 신문 『오스트레일리안 애보 콜』이 나왔고, 협회는 뒤에 서로 맞선 두 갈래로 나뉘었다. 1987년 잭 호너와 마르시아 랭턴의 검토는 이 시위를 '강한 상징이었으나 변화는 적었다'고 평가했다. 1998년 60주년에는 행진이 재현되었고, 오늘날에도 1월 26일에는 이날을 '침략의 날'이나 '생존의 날'이라 부르며 항의하는 행사가 이어진다."
  subjects: [aboriginal-australians, australia]
  tags: [society, politics, resistance]
  sources: ["위키백과 영어판 Day of Mourning (Australia)", "위키백과 영어판 William Cooper (Aboriginal Australian)"]

- id: rabaul-coral-sea-1942
  year: 1942
  endYear: 1942
  title:
    ko: "일본의 라바울 점령과 산호해 해전(1942)"
  summary:
    ko: "진주만 공격 뒤(「태평양 전쟁 발발」(앞의 사건)) 일본은 뉴기니 위임 통치령의 중심 라바울을 노렸다. 1942년 1월 20일부터 일본 항공모함 함재기가 라바울을 폭격했고, 1월 23일 일본군이 뉴브리튼섬 라바울과 뉴아일랜드섬에 올랐다. 지키던 라크 부대는 존 스캔런 중령 아래 2/22대대를 비롯해 약 1,400명이었고 맞선 일본은 항공모함 네 척을 거느린 이노우에 시게요시 중장의 함대가 뒤를 받쳤고, 육군 남해지대는 호리이 도미타로 소장이 이끌어 병력이 약 1만 5,000명에 이르렀다. 오스트레일리아군은 '각자 알아서 빠져나가라'는 명령을 받았고 많은 병사가 정글에서 사로잡혀, 1,000명 넘게 포로가 되었다(전사 28명, 항공 요원 6명, 일본군은 16명 전사·49명 부상). 2월 4일 무렵 토르 농장에서 포로 약 160명이 죽임을 당했고, 7월 1일 포로와 민간인을 일본으로 싣고 가던 몬테비데오 마루가 루손 앞바다에서 가라앉아 적어도 800명의 군인과 200명의 민간인이 숨졌다. 라바울은 일본의 가장 큰 뉴기니 기지가 되었고 연합군은 이곳을 공략하지 않고 고립시켰다. 2월 19일 일본은 함재기 188대와 육상 기지 항공기 54대, 모두 242대로 오스트레일리아 북부 다윈을 폭격해 236~250명 안팎(위원회 추산 약 250명)을 죽였고, 1943년 11월까지 북부에 100번 안팎 공습이 이어졌다. 일본의 포트모르즈비 공략(MO 작전)은 5월 4~8일 산호해 해전에서 막혔다. 이 싸움은 항공모함끼리 맞붙은 첫 해전이자 두 함대가 서로 모습을 보지도 쏘지도 않은 첫 해전이었고, 미국은 렉싱턴호를 잃고 일본은 경항모 쇼호를 잃었다. 전사자는 연합군 715명, 일본 966명이었으며, 포트모르즈비 해상 상륙은 미뤄졌다."
  subjects: [territory-of-new-guinea, australia, japan, usa]
  tags: [war]
  sources: ["위키백과 영어판 Battle of Rabaul (1942)", "위키백과 영어판 Battle of the Coral Sea", "위키백과 영어판 Bombing of Darwin"]

- id: kokoda-1942
  year: 1942
  endYear: 1943
  title:
    ko: "코코다 트랙과 밀른만(1942~1943)"
  summary:
    ko: "산호해에서 바닷길이 막히자(「일본의 라바울 점령과 산호해 해전(1942)」(앞의 사건)) 일본군은 육로로 포트모르즈비를 치기로 했다. 1942년 7월 21일 호리이 도미타로 소장의 남해지대가 파푸아 준주의 부나와 고나에 올라 7월 29일 코코다와 활주로를 차지하고 오언스탠리산맥을 넘는 코코다 트랙으로 밀고 내려왔다. 베테랑 21여단을 포함한 오스트레일리아군은 이수라바·이오라 개울·브리게이드 힐을 거쳐 이오리바이와까지 밀렸다가 이밀타 능선에서 버텼고, 9월 말 일본군은 보급선이 늘어나고 과달카날 전투가 급해진 탓에 물러났다. 오스트레일리아군은 11월 2일 코코다를 되찾고 11월 4~11일 오이비·고라리 싸움에서 이겼으며 부나–고나 일대의 일본군은 1943년 1월 22일까지 버텼다. 길이 험해 보급은 공중 투하와 파푸아인 운반인에게 의존했고, 오스트레일리아 병사들이 이들을 '퍼지 워지 엔젤'이라 불렀다. 말라리아와 이질이 양쪽을 괴롭혔다. 사망자는 자료마다 다르게 적히는데 위키백과는 한 값으로 오스트레일리아군 625명 전사·1,055명 부상·병자 4,000명이 넘는다는 집계를 싣는다. 코코다 트랙 싸움은 오스트레일리아군의 교리·훈련·장비에 큰 영향을 주어 앤잭 전설의 한 부분이 되었으나, 훨씬 적은 병력이 막았다는 이야기는 뒤에 의문이 제기되었다. 파푸아 준주 동쪽 끝 밀른만에서는 8월 25일 일본 해군 육전대 약 1,250명이 활주로를 노리고 올랐으나, 오스트레일리아군과 미군 공병·대공 부대가 울트라 암호 해독으로 미리 경고를 받아 수비를 늘려 9월 7일까지 일본군을 물리쳤다. 오스트레일리아군 사망·실종은 167명(부상 206명), 미군 사망은 14명이었다. 밀른만 싸움은 연합군이 일본 지상군을 뚜렷하게 이긴 첫 큰 싸움으로 평가된다."
  subjects: [territory-of-papua, australia, japan]
  tags: [war]
  sources: ["위키백과 영어판 Kokoda Track campaign", "위키백과 영어판 Battle of Milne Bay"]

- id: guadalcanal-1942
  year: 1942
  endYear: 1943
  title:
    ko: "과달카날 전투(1942~1943)"
  summary:
    ko: "영국령 솔로몬 제도에 속한 과달카날섬은 1942년 일본군이 활주로를 닦기 시작하면서 전장이 되었다. 이 싸움은 연합군의 첫 큰 지상 공세로 꼽히고 연합군의 승리로 끝났으며 8월부터 이듬해 2월까지 여섯 달 남짓 이어졌다. 미국은 '워치타워 작전'이라는 이름으로 8월 7일 해병대를 과달카날과 툴라기, 플로리다섬에 올려 보냈고(「일본의 라바울 점령과 산호해 해전(1942)」(앞의 사건)에 이은 반격), 과달카날의 일본군은 처음에 거의 저항하지 않았고 해병대는 8일까지 룽가 곶의 활주로를 차지해 12일 헨더슨 비행장이라 이름 붙였다. 8~9일 밤 사보섬 해전에서 미카와 군이치 중장의 일본 순양함대가 연합군 호위 함대를 이기는 바람에 수송선이 짐을 다 내리지 못하고 물러나 해병대는 병력과 물자가 모자랐다. 이 싸움에서는 섬 주민의 몫이 컸다. 오스트레일리아 연안 감시원들이 부건빌과 뉴조지아에서 일본 공습을 미리 알려 주었고, 솔로몬 제도 감시원 겸 정찰병 제이컵 보자는 8월 21일 이치키 기요나오 연대가 테나루강에서 공격하기 몇 분 전 해병대에 이를 알렸다. 일본은 12월에 과달카날을 포기하기로 하고 1943년 2월 9일까지 병력을 빼냈다(케 작전). 위키백과 영어판에 따르면 연합군 전사자는 약 7,100명, 부상자는 7,789명이 넘는다. 일본 육군 사망자는 1만 9,200명으로 적히지만 그 가운데 전투에서 죽은 사람은 8,500명이고 나머지는 대부분 병과 굶주림으로 숨졌으므로, 이 값을 전사자 수로 읽으면 전투 사망이 부풀려진다. 위키백과 영어판은 영국령 솔로몬 제도의 부대도 연합군 쪽에 이름이 올라 있다고 적는다."
  subjects: [british-solomon-islands, usa, japan]
  tags: [war]
  sources: ["위키백과 영어판 Guadalcanal campaign", "위키백과 영어판 Jacob Vouza"]

- id: tarawa-1943
  year: 1943
  endYear: 1943
  title:
    ko: "길버트 제도의 타라와 전투(1943)"
  summary:
    ko: "길버트 제도는 영국의 길버트·엘리스 제도 식민지에 속한 곳으로 이곳 주민은 미크로네시아인이다. 일본군은 1941년 12월 10일 마킨섬을 차지했고 같은 날 일본 배가 타라와에 들러 유럽인들을 붙잡았으며, 타라와는 1942년 9월 15일 점령되어 일본군은 베티오섬을 요새화하고 활주로를 지었다. 바나바(오션섬)의 주민 대부분은 나우루·타라와·트루크·코스라에로 끌려갔고 1945년 8월 20일 일본군이 바나바에서 주민 약 150명을 죽이는 일이 일어났다. 1943년 11월 20일부터 23일까지 미군은 타라와 환초의 베티오섬(오늘날 키리바시 땅)에 상륙했다. 일본군은 토치카와 목책 500개, 해안포 14문, 포 40문을 두었고 지휘관 시바자키 게이지 소장은 첫날 함포 사격에 죽었다. 썰물 때라 물이 얕아 일반 상륙정이 산호초를 넘지 못해 궤도 수륙양용차만 올랐고, 첫날 상륙한 해병대 약 5,000명 가운데 약 1,500명이 사상자가 되었다. 해병대는 나흘에 걸쳐 섬을 점령했으며 23일 오후 1시 30분 점령이 선언되었다. 미국 해병대는 1,009명이 죽고 2,101명이 다쳤다고 위키백과 영어판 정보 상자는 적는다(같은 정보 상자의 해군 사망 687명은 타라와 싸움에서 난 것인지 분명하지 않고, 본문은 해병대 전사 894명과 나중에 숨진 84명으로 적어 값이 갈린다). 일본군과 조선인 노무자를 합친 사망자는 약 4,690명으로, 포로는 일본군 17명과 조선인 노무자 129명뿐이었다. 큰 희생에 미국 여론이 반발했고 홀랜드 스미스는 타라와를 치기로 한 결정을 비판했으나 니미츠는 이를 옹호했으며, 작전명은 갤버닉이었고, 미국은 베티오의 활주로가 마셜 제도와 하와이 사이를 끊는 위치에 있어 마리아나를 치기 전에 없애야 한다고 보았다. 이 싸움은 수중 폭파팀 창설과 뒤의 상륙 작전 전술에 영향을 주었다. 이로써 길버트 제도의 일본 점령은 11월 23일 끝났다."
  subjects: [micronesian-culture, usa, japan]
  tags: [war]
  sources: ["위키백과 영어판 Battle of Tarawa", "위키백과 영어판 Japanese occupation of the Gilbert Islands"]

- id: marianas-1944
  year: 1944
  endYear: 1944
  title:
    ko: "마리아나 탈환과 괌·팔라우(1944)"
  summary:
    ko: "일본은 1941년 12월 10일 괌을 차지했고, 미국 수비대가 항복하자 대부분의 미군은 일본으로 끌려갔다. 일본군은 미군이 닥치기 전부터 섬 주민 차모로인을 동쪽과 남쪽의 마넹곤 같은 수용소로 몰아넣었는데 이곳은 식량·잠자리·위생이 모자랐다. 1944년 7월 12일 사제 헤수스 바사 두에냐스와 남자 세 명이 고문과 심문 끝에 목이 잘리는 일도 있었다. 미국의 목표는 일본 본토를 폭격할 기지를 얻고 필리핀 진격을 돕는 것이었고, 니미츠가 총지휘하는 상륙군은 12만 7,000명이 넘었다. 미군은 1944년 6월 15일 사이판에 올랐고(7월 9일까지), 6월 19~20일 필리핀해 해전에서 일본 해군이 큰 타격을 입었다. 사이판에서 미군 지상군은 3,100~3,225명이 죽고 1만 3,000여 명이 다쳤으며, 일본군은 8월 15일까지 적어도 2만 5,144명이 죽었다. 사이판 민간인은 2만 6,000~2만 8,000명으로 대부분 오키나와와 조선 출신 등 일본 신민이었고 차모로인은 소수였으며, 민간인 사망자는 8,000~1만 명으로 추산된다. 괌에는 7월 21일 아산(제3해병사단)과 아가트(제1임시해병여단)로 올라 8월 10일 조직적인 저항이 끝났다. 미군 사망은 1,760명, 일본군 사망은 1만 8,377명으로 적히며 괌 민간인 사망자는 600명이 넘는다(위키백과 정보 상자의 값). 팔라우에서는 9월 펠렐리우와 앙가우르에 상륙해 11월까지 두 섬을 확보했고, 코로르의 일본군 주력은 건너뛰어 1945년 8월 항복했다. 미국은 사이판과 티니안에 새 활주로를 닦아 B-29를 띄웠고 그 가운데는 1945년 히로시마·나가사키 원폭 임무기도 있었다. 이 작전의 미군 사망·실종은 8,125명, 일본군 사상은 6만 7,000명이 넘는다."
  subjects: [chamorro, usa, japan]
  tags: [war]
  sources: ["위키백과 영어판 Mariana and Palau Islands campaign", "위키백과 영어판 Battle of Guam (1944)", "위키백과 영어판 Battle of Saipan"]

- id: japan-surrender-papua-1945
  year: 1945
  endYear: 1949
  title:
    ko: "일본 항복과 파푸아·뉴기니 행정 통합(1945~1949)"
  summary:
    ko: "1945년 7월 26일 포츠담 선언이 무조건 항복을 요구했고, 8월 6일과 9일 히로시마와 나가사키에 원자 폭탄이 떨어진 뒤 8월 15일 일왕이 항복을 알렸으며 9월 2일 도쿄만 미주리호에서 항복 문서가 서명되어 태평양 전쟁이 끝났다(「태평양 전쟁 발발」(앞의 사건)). 뉴기니 쪽에서는 연합군이 라바울을 공략하지 않고 고립시켜 둔 터라(「일본의 라바울 점령과 산호해 해전(1942)」(앞의 사건)) 그곳을 비롯한 뉴기니·뉴브리튼·솔로몬 일대에 일본 육해군 약 13만 9,000명이 남아 있었고, 일본 제8방면군의 항복은 9월 6일 라바울 앞바다 영국 항공모함 글로리호에서 이마무라 히토시 사령관이 서명하고 오스트레일리아 제1군 사령관 스터디 중장이 받는 것으로 이뤄졌다. 전쟁이 끝나자 오스트레일리아는 전쟁으로 무너진 두 영토를 하나로 묶어 다스리기로 했다. 파푸아 준주는 1902년부터 오스트레일리아의 땅이었고 뉴기니 위임 통치령은 1914년부터 오스트레일리아 관할이었으며(「국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)」(앞의 사건)), 1946년 위임 통치령은 유엔 신탁 통치 지역이 되었다. 1945~1946년 임시 행정법으로 먼저 두 땅의 행정이 합쳐졌고, 1949년 파푸아·뉴기니 법이 1949년 7월 1일 효력을 얻어 두 땅을 파푸아뉴기니 준주로 묶었다. 두 영토의 법적 지위는 달랐으므로 결합은 행정에 한정되었고 신탁 통치 지역은 법적으로 구별된 채 남았다. 수도는 포트모르즈비였고, 오스트레일리아 연방 부서의 지시를 받는 행정관이 통치했다. 1951년 자문 기능의 입법 평의회가 만들어졌고 1960년대에 선거로 뽑는 하원으로 바뀌었다. 파푸아뉴기니 준주는 1971년 이름이 파푸아뉴기니로 바뀌었고 이 땅의 독립은 1975년에 이뤄진다."
  subjects: [territory-of-papua, territory-of-new-guinea, territory-of-papua-and-new-guinea, australia]
  tags: [politics, colonization]
  sources: ["위키백과 영어판 Territory of Papua and New Guinea", "위키백과 영어판 Surrender of Japan", "위키백과 영어판 Rabaul"]

- id: bikini-1946
  year: 1946
  endYear: 1958
  title:
    ko: "비키니 환초 핵실험과 주민 이주(1946~1958)"
  summary:
    ko: "마셜 제도의 비키니 환초에서는 1946년 3월 7일 주민 167명이 미국 해군 상륙함에 실려 동쪽 약 200km(125마일) 떨어진 롱게릭 환초로 옮겨졌다. 같은 해 7월 미국은 이곳에서 크로스로드 작전을 시작해 핵폭탄을 시험했고, 크로스로드 작전은 7월 1일의 공중 폭발과 25일의 수중 폭발 두 번이었고 표적으로 낡은 군함 등 90여 척이 놓였다. 미국이 1958년까지 비키니 환초에서 터뜨린 장치는 23개, 위력은 모두 합쳐 약 77메가톤으로 집계된다. 마셜 제도 전체의 핵실험은 67회로 알려져 있으며 엔웨타크 환초에서도 많은 시험이 있었다. 쫓겨난 미크로네시아인 주민은 롱게릭 환초의 식량이 모자라 어려움을 겪었다고 하며 뒤에 킬리섬 등으로 다시 옮겨 살았다. 1947년 미국은 유엔에 미크로네시아를 전략 신탁 통치령으로 지정하게 해 미국 해군이 관리를 맡았고, 1951년부터는 내무부가 사이판에서 맡았다. 1954년 3월 1일의 캐슬 브라보 시험은 위력이 15메가톤으로 과학자들의 예상(4~8메가톤)을 크게 넘었다. 낙진은 비키니 동쪽의 롱겔라프 환초 등 이웃 환초 주민에게 쏟아졌고, 그 바깥 바다에서 조업하던 일본 어선 제5후쿠류마루 선원들도 피폭되어 일본에서 핵실험에 대한 반발이 크게 일었다. 이 사건들은 미국의 신탁 통치 아래에서 마셜 제도 사람들이 자기 땅에 대한 결정권을 갖지 못한 채 시험장이 된 일로 오래 기억된다. 이후 비키니 사람들의 보상과 귀환 문제는 오래 이어졌으며 마셜 제도가 미국과 맺은 뒤의 협정인 「자유 연합 협정: 마셜 제도·미크로네시아 연방·팔라우(1986~1994)」(뒤의 사건)와도 얽혀 있다."
  subjects: [micronesian-culture, usa]
  tags: [war, society]
  sources: ["위키백과 영어판 Bikini Atoll", "위키백과 영어판 Operation Crossroads", "위키백과 영어판 Castle Bravo", "위키백과 영어판 Nuclear testing at Bikini Atoll"]

- id: spc-1947
  year: 1947
  endYear: 1949
  title:
    ko: "남태평양 위원회와 뉴질랜드의 웨스트민스터 헌장 수락(1947~1949)"
  summary:
    ko: "1947년 2월 6일 캔버라에서 당시 뉴질랜드 총리 피터 프레이저가 이끌던 노동당 정부를 포함해 오스트레일리아·프랑스·네덜란드·뉴질랜드·영국·미국 여섯 정부가 캔버라 협정을 맺어 남태평양 위원회를 세웠다. 아직 식민 통치 아래 있던 태평양 섬들의 경제와 보건·사회 발전을 함께 논의하는 자문 기구로, 본부는 1949년 누벨칼레도니의 누메아에 자리 잡았다. 이 기구는 뒷날 이름이 바뀌어 지금은 태평양 공동체라 불리며, 독립한 섬나라들도 회원이 되었다. 위원회는 정치와 안보 문제는 다루지 않고 경제·사회 문제에 그친다는 선을 두었다. 같은 해 11월 25일 뉴질랜드 의회는 웨스트민스터 헌장을 받아들이는 법을 통과시켜 헌장의 규정이 뉴질랜드에도 적용되도록 했다. 오스트레일리아가 1942년 헌장을 받아들이며 1939년으로 소급한 경위는 「웨스트민스터 헌장과 오스트레일리아·뉴질랜드의 늦은 수락(1931~1942)」(앞의 사건)이 다룬다. 뉴질랜드가 '독립'한 해는 무엇을 기준으로 삼느냐에 따라 갈린다. 「뉴질랜드 자치령(1907)」(앞의 사건)으로 자치령이 된 1907년을 꼽기도 하고, 헌장을 받아들인 1947년을 꼽기도 하며, 영국 의회가 뉴질랜드를 위해 입법할 권한을 완전히 내려놓은 1986년 헌법법을 꼽기도 한다. 이 수락은 뒤에 뉴질랜드가 영국 의회에 기대지 않고 스스로 헌법을 고칠 수 있게 되는 첫걸음이었다. 1948년에는 영국 국적과 뉴질랜드 시민권을 따로 정하는 국적법이 만들어져 1949년 1월 1일부터 시행되었다. 이렇게 오스트레일리아와 뉴질랜드는 영국 제국 안의 자치령에서 차츰 독립 국가로 옮겨 갔고, 두 나라는 태평양 섬들의 후견 노릇을 함께 맡는 모습을 보였다."
  subjects: [new-zealand, australia]
  tags: [diplomacy, politics]
  sources: ["위키백과 영어판 South Pacific Commission", "위키백과 영어판 Statute of Westminster Adoption Act 1947", "위키백과 영어판 Constitution Act 1986", "위키백과 영어판 New Zealand nationality law"]

- id: anzus-1951
  year: 1951
  endYear: 1952
  title:
    ko: "앤저스 조약(1951~1952)"
  summary:
    ko: "앤저스는 오스트레일리아(Australia)·뉴질랜드(New Zealand)·미국(United States)의 머리글자를 딴 말로, 세 나라의 집단 안보 조약이다. 1951년 9월 1일 샌프란시스코에서 서명되었고 비준 절차를 거쳐 1952년 4월 29일 발효했다. 미국은 같은 해 8월 30일 필리핀과도 상호방위조약을 맺었고, 앤저스 조약은 외무 장관들이 모이는 앤저스 이사회를 두었다. 오스트레일리아와 뉴질랜드는 제2차 세계 대전 때 일본의 진출을 겪은 터라 일본과의 강화 조약이 일본의 재무장으로 이어질까 걱정했고, 미국의 안보 약속을 얻는 대가로 1951년 9월 8일 샌프란시스코에서 서명된 대일 강화 조약을 받아들이는 길을 택했다. 미국은 처음에는 소극적이었으나 1949년 중국 공산당의 승리와 1950년 6월의 6·25 전쟁이 판단을 바꾸었다(「6·25 전쟁 발발」). 오스트레일리아는 영국보다 먼저 지상군 파병을 결정했고, 뉴질랜드는 영연방군의 일원으로 싸웠다. 조약은 한 나라가 태평양에서 무장 공격을 받으면 나머지가 각자의 헌법 절차에 따라 공동의 위험에 맞서겠다고 정한다. 이 틀은 냉전 내내 이어지다 1984년 뉴질랜드에서 노동당 정부가 핵무기를 싣거나 핵 추진 배가 항구에 들어오지 못하게 하면서 흔들렸다. 미국이 핵 탑재 여부를 밝히지 않는다는 방침을 고수했고 1985년 2월 뉴질랜드가 군함 뷰캐넌호의 입항을 거절하자, 1986년 미국은 뉴질랜드에 대한 조약 의무를 정지했다. 오스트레일리아와 미국, 오스트레일리아와 뉴질랜드 사이의 조약 관계는 그대로 유지되었고 뉴질랜드는 1987년 핵 없는 지대 법을 만들었다."
  subjects: [australia, new-zealand, usa]
  tags: [diplomacy, war]
  sources: ["위키백과 영어판 ANZUS", "위키백과 영어판 Treaty of San Francisco", "위키백과 영어판 New Zealand nuclear-free zone"]

- id: maralinga-1952
  year: 1952
  endYear: 1963
  title:
    ko: "영국의 오스트레일리아 핵실험: 몬테벨로와 마랄링가(1952~1963)"
  summary:
    ko: "당시 오스트레일리아 총리 로버트 멘지스의 정부는 영국의 요청을 받아들였고, 영국은 1952년 10월 3일 오스트레일리아 북서쪽 앞바다의 몬테벨로 제도에서 허리케인 작전으로 첫 핵실험을 해 미국·소련에 이은 세 번째 핵보유국이 되었다(위력은 25킬로톤으로 알려져 있다). 1953년에는 오스트레일리아 남부 사막의 에뮤 필드에서 토템 작전으로 두 번의 시험이 이어졌다. 1956년 9월 27일부터 마랄링가에서 버펄로 작전이 시작되어 핵분열 폭탄 네 개를 터뜨렸고 그 가운데 하나는 영국 공군 발리언트 폭격기에서 투하되어 영국 최초의 공중 투하 핵무기가 되었다. 1957년 안틀러 작전에서는 뇌관·기폭 장치 시험이 세 번 있었고 위력은 1·6·25킬로톤이었다. 이후 1963년까지는 폭발 없이 플루토늄 등을 흩뜨리는 작은 시험들이 이어졌다. 시험 지역은 이 땅에서 오래 살아온 아낭우, 곧 오스트레일리아 원주민이 사는 곳과 가까웠고 이들은 시험장 둘레에서 쫓겨나거나 접근을 막혔다. 토템 시험 뒤 낙진이 가라앉은 일을 둘러싸고 아낭우 사람들은 '검은 안개'라 불리는 구름이 지나간 뒤 앓았다고 증언했다. 영국과 오스트레일리아 군인도 실험 때 낙진에 일부러 노출되었다는 지적이 있다. 1984~1985년 맥클렐런드 왕립 위원회는 일부 지역에 방사능 오염이 상당히 남아 있음을 밝혔고, 1985년 1월 땅의 소유권이 마랄링가 자라루 사람들에게 돌아갔다. 이들은 1985년 3월 오크밸리로 옮겼고, 1994년 오스트레일리아 정부는 핵실험 관련 청구를 모두 마무리하는 값으로 1,350만 달러를 주었으며 1995년 영국과의 합의에 따라 정화 작업이 이뤄졌다."
  subjects: [australia, aboriginal-australians]
  tags: [war, society]
  sources: ["위키백과 영어판 Maralinga", "위키백과 영어판 Operation Hurricane", "위키백과 영어판 British nuclear tests at Maralinga", "위키백과 영어판 Operation Totem"]

- id: samoa-independence-1962
  year: 1962
  endYear: 1962
  title:
    ko: "서사모아의 독립(1962)"
  summary:
    ko: "1900년대 초부터 독일령과 뉴질랜드의 위임 통치를 거치며 자치 요구가 이어졌고 1920~1930년대 마우 운동이 그 줄기를 이루었다. 1962년 1월 1일 서사모아는 뉴질랜드의 서사모아법(1961)에 따라 독립했다. 태평양 작은 섬나라 가운데 처음이었다. 이 땅은 1920년 국제 연맹 위임 통치령이 되었고(「국제 연맹 위임 통치: 뉴기니·서사모아·나우루와 남양 군도(1920~1922)」(앞의 사건)) 1946년 이후 유엔 신탁 통치 아래 뉴질랜드가 맡았다. 독립 직후 맺은 우호 조약에 따라 외교와 국방에서 뉴질랜드와 협의하기로 했다. 독립은 1959~1960년 헌법 회의를 거쳐 만들어진 헌법을 1961년 국민 투표에 붙여 확정한 뒤 이뤄졌다. 헌법은 마타이, 곧 가족 우두머리 제도를 이어 갔다. 마타이만 투표하고 마타이만 의원이 될 수 있었으며 보통 선거는 1990년 국민 투표로 정해져 1991년 선거부터 적용되었다. 국가 원수는 투푸아 타마세세 메아올레와 말리에토아 타누마필리 2세 둘이 종신으로 함께 맡았고 1963년 타마세세가 숨진 뒤 타누마필리 2세 혼자 2007년까지 국가 원수였다. 초대 총리는 피아메 마타아파 파우무이나 물리누우 2세였다. 서사모아라는 이름은 1997년 7월 4일 헌법을 고쳐 앞의 서쪽을 뗀 사모아로 바뀌었다. 2011년에는 시간대를 협정 세계시(UTC) -11시간에서 +13시간으로 옮기며 12월 30일 금요일을 건너뛰어 날짜변경선이 사모아 동쪽으로 옮겨진 셈이 되었다. 섬이 독일령 사모아와 미국령으로 갈린 앞서의 일은 「사모아 삼국 협정과 독일령 사모아(1899~1900)」(앞의 사건)에 있다."
  subjects: [western-samoa, samoa, new-zealand]
  tags: [politics, diplomacy]
  sources: ["위키백과 영어판 Samoa", "위키백과 영어판 History of Samoa", "위키백과 영어판 Western Samoa Trust Territory", "위키백과 영어판 Fiamē Mataʻafa Faumuina Mulinuʻu II"]

- id: moruroa-1966
  year: 1966
  endYear: 1996
  title:
    ko: "무루로아 핵실험과 레인보 워리어호, 라로통가 조약(1966~1996)"
  summary:
    ko: "프랑스는 1960년 2월 알제리 사하라에서 첫 핵실험을 했으나 1962년 알제리 독립으로 시험장을 잃은 뒤 1963년 프랑스령 폴리네시아에 태평양 실험 센터를 세워 무루로아와 팡가타우파 환초를 시험장으로 삼았다. 1966년 7월 2일 무루로아에서 첫 시험인 알데바란이 있었고, 1966~1974년 대기 중 시험이 41회 있었다. 1974년 9월 14일 마지막 대기 중 시험 뒤 1975년 6월부터는 환초 아래 화산암에 구멍을 뚫고 땅속에서 시험했다. 위키백과는 무루로아의 폭발을 모두 181회로 적지만 현지에서 일한 과학자들은 175회라 주장해 숫자가 갈린다. 1973년 오스트레일리아와 뉴질랜드는 국제사법재판소에 프랑스의 대기 중 시험을 막아 달라는 소송을 냈고, 재판소는 1974년 프랑스가 대기 중 시험을 그치겠다고 밝혔다는 이유로 더 다룰 일이 없다고 보았다. 1985년 7월 10일 밤 오클랜드 항 마스던 부두에 정박한 그린피스의 레인보 워리어호가 프랑스 대외 안보총국 요원이 놓은 폭탄 둘로 가라앉았고 포르투갈 태생 사진가 페르난두 페레이라가 숨졌다. 그 배는 무루로아 시험에 항의하러 가던 길이었다. 요원 둘은 과실 치사를 인정해 징역 10년을 받았으나 2년이 못 되어 풀려났고 프랑스는 뒤에 보상했다. 시험이 폴리네시아 주민 건강에 끼친 영향은 지금도 논쟁이 있고, 프랑스는 2010년 피해자 보상법을 만들었다. 폭파 한 달쯤 뒤인 1985년 8월 6일 쿡 제도 라로통가에서 남태평양 비핵 지대 조약, 곧 라로통가 조약이 서명되었고 1986년 12월 11일 발효했다. 1995년 시라크 대통령이 시험 재개를 알리자 폴리네시아에서 소요가 일고 세계적 항의가 있었으며, 무루로아의 마지막 시험은 1995년 12월 27일, 프랑스 전체의 마지막은 1996년 1월 27일 팡가타우파에서 있었다."
  subjects: [french-polynesia, new-zealand]
  tags: [war, diplomacy]
  sources: ["위키백과 영어판 Mururoa", "위키백과 영어판 Sinking of the Rainbow Warrior", "위키백과 영어판 South Pacific Nuclear Free Zone Treaty", "국제사법재판소 사건 기록 Nuclear Tests (New Zealand v. France) https://www.icj-cij.org/case/59"]

- id: referendum-1967
  year: 1967
  endYear: 1967
  title:
    ko: "1967년 국민 투표와 오스트레일리아 원주민(1967)"
  summary:
    ko: "1967년 5월 27일 오스트레일리아는 해럴드 홀트 정부가 올린 헌법 개정안을 국민 투표에 부쳐 유효표의 90.77퍼센트가 찬성하는 압도적 결과를 얻었다. 여섯 주 모두에서 찬성이 이겼고 가장 낮은 웨스턴오스트레일리아에서도 80.95퍼센트였다. 개정은 두 군데였다. 연방이 특정 인종을 위한 법을 만들 수 있다는 헌법 51조 26항에서 '어느 주의 오스트레일리아 원주민을 제외한다'는 문구를 빼 연방이 원주민 정책에 입법할 권한을 갖게 했고, 인구를 셀 때 오스트레일리아 원주민을 빼도록 한 127조를 없앴다. 흔한 오해와 달리 이 투표가 원주민에게 시민권이나 투표권을 준 것은 아니었다. 연방 선거 투표는 1962년부터 원주민에게 선택 사항으로 열려 있었고 의무가 된 것은 1983년이었다. 개정 전에는 원주민 정책을 주 정부들이 맡았고 연방이 직접 맡은 곳은 북부 준주 같은 연방 땅뿐이었다. 투표는 오래 쌓인 운동의 결과였다. 1965년 찰스 퍼킨스가 이끈 학생들의 프리덤 라이드는 시골 마을의 수영장과 재향군인 클럽 같은 곳의 차별을 드러냈다. 1966년 8월 빈센트 링기아리가 이끈 웨이브힐 목장의 구르인지 사람들이 임금과 땅을 요구하며 일터를 떠난 파업은 1975년 휘틀럼 총리가 흙을 링기아리의 손에 부어 주는 땅 반환의 상징으로 이어졌고, 1976년 북부 준주 원주민 토지권법이 만들어졌다. 이 개정은 그 뒤 연방이 원주민 정책에 나서는 헌법상의 길을 열었다는 점에서 지금도 기억된다. 흔히 이 투표를 원주민이 시민으로 인정받은 날로 말하지만 사실은 연방이 원주민에 관한 법을 만들 수 있게 하고 인구 조사에 넣도록 한 헌법 개정이라는 점을 구분해야 한다."
  subjects: [aboriginal-australians, australia]
  tags: [politics, society]
  sources: ["위키백과 영어판 1967 Australian referendum (Aboriginals)", "위키백과 영어판 Freedom Ride (Australia)", "위키백과 영어판 Wave Hill walk-off", "위키백과 영어판 Charles Perkins (Aboriginal activist)"]

- id: nauru-fiji-1968
  year: 1968
  endYear: 1970
  title:
    ko: "나우루의 독립과 피지·통가의 독립(1968~1970)"
  summary:
    ko: "1968년 1월 31일 나우루는 오스트레일리아·뉴질랜드·영국이 1947년부터 함께 맡은 유엔 신탁 통치(실제 행정은 오스트레일리아)에서 벗어나 독립했고 독립 운동을 이끈 해머 디로버트가 초대 대통령이 되었다. 나우루는 1888년 독일이 병합했고 1914년 오스트레일리아군이 점령했으며 1920년 위임 통치령이 되었고 1942~1945년에는 일본이 점령했다. 섬은 인광석 수출로 한때 소득이 매우 높을 만큼 부유해졌으나 땅이 크게 파괴되었고 매장량은 1990년대에 거의 바닥났다. 통가는 영국이 외교를 맡는 보호국이었다가 살로테 여왕이 마련한 길에 따라 보호 조약이 1970년 6월 4일 끝나면서 통가 왕국이 외교를 되찾았다. 통가는 1845년 이후 이어진 왕정을 그대로 유지했고 당시 국왕은 1965~2006년 재위한 타우파아하우 투포우 4세였다. 피지 식민지는 1874년 10월 10일 족장들이 할양 증서에 서명해 영국령이 되었고(「카코바우 정부와 피지의 영국 할양(1871~1874)」(앞의 사건)), 꼭 96년 뒤인 1970년 10월 10일 영국에서 독립해 피지가 되었다. 독립 때는 영국 여왕을 국가 원수로 하는 자치령이었고 초대 총리는 라투 카미세세 마라였고 그는 1970년 10월 10일부터 1987년 4월 13일까지 총리였다. 피지에는 그 뒤 인도 계약 노동자가 사탕수수 농장 일로 건너와 정착했는데, 그 자손과 피지 원주민 사이의 정치적 균형과 땅 문제가 뒤의 정치를 좌우했다. 독립 뒤에도 피지는 한동안 영국 여왕을 국가 원수로 두었다. 나우루 독립은 오스트레일리아의 신탁 통치가 끝난 일이고, 피지 독립은 영국 식민지 해체, 통가는 보호국 지위의 종료로 서로 성격이 다르다."
  subjects: [nauru, fiji-colony, fiji, kingdom-of-tonga]
  tags: [politics, diplomacy]
  sources: ["위키백과 영어판 Nauru", "위키백과 영어판 Fiji", "위키백과 영어판 Tonga", "위키백과 영어판 Hammer DeRoburt", "위키백과 영어판 Kamisese Mara"]

- id: png-independence-1975
  year: 1975
  endYear: 1975
  title:
    ko: "파푸아뉴기니의 독립(1975)"
  summary:
    ko: "1975년 9월 16일 파푸아뉴기니는 오스트레일리아에서 독립했다. 두 땅이 오스트레일리아의 한 행정 단위인 파푸아뉴기니 준주로 합쳐진 것은 1949년이었고(「일본 항복과 파푸아·뉴기니 행정 통합(1945~1949)」(앞의 사건)), 이후 의회는 1964년 선거로 뽑은 하원에서 시작되어 차츰 넓어졌다. 자치는 1973년 12월 1일에 시작되었고 오스트레일리아 휘틀럼 정부가 독립을 서둘렀다. 마이클 소마레는 자치 정부 수석 장관에서 독립 뒤 첫 총리로 이어 갔고, 독립 헌법은 제헌 의회가 만들어 영국 여왕을 국가 원수로 하되 총독이 대리하는 입헌 군주제를 택했다. 1884년 독일령과 영국령으로 갈린 땅(「뉴기니 분할: 독일령 뉴기니와 영국령 뉴기니(1884~1886)」(앞의 사건))이 1949년에야 한 준주로 묶였으므로 이 나라는 식민 행정의 틀이 하나가 된 지 30년도 못 되어 독립한 셈이었다. 새 나라는 800개가 넘는 언어가 쓰이고 산악과 섬으로 갈라진 나라였고 독립 직후 통일을 지키는 것이 큰 숙제였다. 독립 보름 전인 1975년 9월 1일 부건빌 지방 정부는 북솔로몬 공화국이라는 이름으로 독립을 선언했다. 중앙 정부가 지방에 보내던 돈을 끊어 대응했고 1976년 8월의 합의로 이 첫 선언은 가라앉았으나 갈등은 뒤에 「부건빌 위기와 내전(1988~2001)」(뒤의 사건)으로 이어진다. 뉴기니섬 서쪽 절반이 네덜란드에서 인도네시아로 넘어간 과정은 「서뉴기니 분쟁과 뉴욕 협정(1961~1969)」(앞의 사건)이 다룬다. 독립한 뒤에도 오스트레일리아는 오랫동안 파푸아뉴기니에 가장 큰 원조 제공국이었고 두 나라의 관계는 행정과 국방의 여러 갈래로 이어졌다."
  subjects: [territory-of-papua-and-new-guinea, papua-new-guinea, australia]
  tags: [politics, diplomacy]
  sources: ["위키백과 영어판 Papua New Guinea", "위키백과 영어판 History of Papua New Guinea", "위키백과 영어판 Michael Somare", "위키백과 영어판 Bougainville Civil War"]

- id: whitlam-1975
  year: 1975
  endYear: 1975
  title:
    ko: "휘틀럼 해임과 오스트레일리아 헌정 위기(1975)"
  summary:
    ko: "1972년 12월 고프 휘틀럼의 노동당이 선거에서 이겨 23년 만에 정권이 바뀌었고, 1974년 5월 18일 조기 선거에서도 노동당이 다시 이겼으나 상원 다수는 얻지 못했다. 휘틀럼 정부는 중국과 수교하고 징병을 없애고 1973년 백호주의의 남은 흔적을 걷어 내는 등 빠른 개혁을 밀어붙였다. 그러나 상원에서 다수가 아닌 노동당은 법안마다 야당의 방해에 부딪혔고, 1975년 10월 16~17일 야당이 장악한 상원은 정부 예산안의 표결을 미뤄 정부의 돈줄을 막았다. 야당 지도자 프레이저는 경제 불황과 물가 상승, 정부의 해외 차입 시도를 둘러싼 스캔들을 앞세워 예산을 막았다. 오스트레일리아는 영국 여왕을 국가 원수로 두고 그를 대신해 총독이 있는 나라였는데, 1974년 7월 11일 휘틀럼의 건의로 취임한 존 커 총독은 1975년 11월 11일 휘틀럼 총리를 해임하고 야당 대표 맬컴 프레이저를 임시 총리로 임명했다. 그 직후 하원은 프레이저에게 불신임을 의결하고 휘틀럼을 다시 임명하라고 총독에게 요청하기로 했으나, 총독은 그 요청을 받아들이지 않고 프레이저의 건의에 따라 의회 해산을 선포했다. 프레이저는 예산이 통과되도록 한 뒤 상·하원을 함께 해산하는 선거를 조언했다. 1975년 12월 13일 선거에서 연합(자유당·국민당)은 하원 91석을 얻어 36석의 노동당을 크게 이겼고 상원에서도 35 대 27로 다수를 차지했다. 총독이 선거로 뽑히지 않았으면서 선거로 뽑힌 하원 다수의 총리를 해임할 권한이 헌법에 있는지가 논쟁이 되었고, 지지자와 비판자가 오래 갈렸다. 해임은 오스트레일리아 정치사에서 가장 큰 헌정 충돌로 남았다. 커 총독은 1977년 물러났고, 1986년의 오스트레일리아 법으로 영국이 오스트레일리아에 갖던 마지막 법적 권한이 사라졌다."
  subjects: [australia]
  tags: [politics]
  sources: ["위키백과 영어판 1975 Australian constitutional crisis", "위키백과 영어판 Gough Whitlam", "위키백과 영어판 John Kerr (governor-general)", "위키백과 영어판 Australia Act 1986"]

- id: solomons-tuvalu-kiribati-1978
  year: 1978
  endYear: 1979
  title:
    ko: "솔로몬 제도·투발루와 키리바시의 독립(1978~1979)"
  summary:
    ko: "1893년 영국 보호령이 된 영국령 솔로몬 제도는 1976년 완전 자치를 이룬 뒤 1977년 런던 회의에서 독립을 합의했고, 1978년 7월 7일 솔로몬 제도가 독립했다. 독립 헌법은 영국 여왕을 국가 원수로 하는 입헌 군주제였고 초대 총리는 피터 케닐로레아였고(2차 대전 뒤 마라이타섬의 마아시나 룰 운동이 독립 요구의 한 뿌리로 꼽힌다) 수도는 과달카날섬의 호니아라다. 길버트 엘리스 제도 식민지에서는 폴리네시아계 엘리스 제도 사람들이 미크로네시아계 길버트 제도 사람들과 따로 가기를 원해 1974년 주민 투표를 했고, 1975년 10월 1일 투발루라는 이름의 별도 직할 식민지가 되었으며 1976년 1월 1일 행정이 갈라졌다. 투발루는 1978년 10월 1일 영국에서 독립했고 '여덟 섬이 함께 서 있다'는 뜻의 이름을 가졌고 아홉 섬 가운데 여덟 섬에 사람이 살며 여왕을 국가 원수로 하는 입헌 군주제를 택했다. 길버트 제도는 이어서 1979년 7월 12일 키리바시라는 이름으로 독립했고 이에레미아 타바이가 초대 대통령이 되었다. 키리바시라는 이름은 길버트를 현지 말로 읽은 것이고, 키리바시는 공화국이 되어 대통령이 국가 원수다. 33개 환초와 섬이 길버트·피닉스·라인 세 군도에 걸쳐 약 350만 제곱킬로미터의 바다에 흩어져 있다. 길버트 제도 가운데 바나바섬(오션섬)은 영국 회사가 인광석을 파낸 곳으로, 주민 일부는 1945년 피지의 라비섬으로 옮겨 갔고 독립 때 바나바 사람들이 따로 갈라지기를 요구했으나 받아들여지지 않았다. 키리바시는 1995년 1월 1일 날짜변경선을 동쪽 끝섬까지 돌려 나라 전체가 같은 날을 쓰게 했으며 그때 현지에서는 1994년 12월 31일이 건너뛰어졌다."
  subjects: [british-solomon-islands, solomon-islands, tuvalu, kiribati]
  tags: [politics, diplomacy]
  sources: ["위키백과 영어판 Solomon Islands", "위키백과 영어판 Tuvalu", "위키백과 영어판 Kiribati", "위키백과 영어판 Gilbert and Ellice Islands", "위키백과 영어판 Peter Kenilorea"]

- id: vanuatu-1980
  year: 1980
  endYear: 1980
  title:
    ko: "바누아투의 독립과 코코넛 전쟁(1980)"
  summary:
    ko: "뉴헤브리디스 공동 통치령은 1906년부터 영국과 프랑스가 함께 다스린 곳으로 그 짜임은 「파푸아 법과 뉴헤브리디스 공동 통치(1906~1907)」(앞의 사건)가 다룬다. 현지 사람은 어느 쪽 시민권도 받지 못한 채 법적으로 무국적이었다. 1971년 월터 리니가 세운 정당(처음 이름은 뉴헤브리디스 문화 협회였다가 뉴헤브리디스 국민당이 되었고 1977년 바누아아쿠당으로 이름을 바꿨다. 영어권 개신교 쪽 지지가 많았다)이 즉각 독립을 요구했고 프랑스어를 쓰고 가톨릭인 온건파 정당들은 천천히 가기를 원했다. 이 정당은 1975년 11월 총회 선거에서 이겼으나 온건파가 결과를 다퉜고, 1977년 이름을 바꾼 바누아아쿠당이 3월 런던 회의와 11월 선거를 보이콧하며 따로 인민 임시 정부를 세웠다. 1979년 11월 선거에서 바누아아쿠당이 크게 이겨 독립 날짜가 1980년 7월 30일로 정해졌고, 영국 성공회 신부 출신 월터 리니가 초대 총리가 되었고 조지 소코마누가 첫 대통령이 되었다. 독립 뒤에도 영어·프랑스어·비슬라마가 공용어로 쓰였다. 독립을 앞두고 에스피리투산토섬에서 지미 스티븐스가 이끄는 1960년대 정착민 농장 확대에 맞서 땅을 지키려고 생긴 나그리아멜 운동과 온건파 활동가들이 분리를 선언하고 베마라나 공화국이라 불렀다(선포 날짜는 문서마다 갈린다). 프랑스계 정착민과 미국의 사업가 단체가 뒤에서 도왔다는 설이 있지만 확인된 바는 갈린다. 1980년 7월 영국·프랑스 군이 분리를 막으려고 보내졌으나 프랑스 쪽이 힘을 쓰지 못하게 해 약탈이 이어졌고 두 나라 군이 8월에 물러난 뒤 리니 정부는 파푸아뉴기니에 군대를 청했고 파푸아뉴기니 군이 큰 싸움 없이 곧 반란을 눌러, 스티븐스는 9월 1일 항복해 감옥에 갔다. 당시 인구는 11만 명 안팎이었고 수도는 에파테섬의 포트빌라다. 이 반란과 진압을 합쳐 코코넛 전쟁이라 부른다. 리니는 1991년까지 총리 자리에 있으며 비동맹 노선을 걸었고, 독립한 나라의 이름은 바누아투가 되었다."
  subjects: [new-hebrides, vanuatu]
  tags: [politics, diplomacy, war]
  sources: ["위키백과 영어판 Vanuatu", "위키백과 영어판 Coconut War", "위키백과 영어판 New Hebrides", "위키백과 영어판 Walter Lini"]

- id: free-association-1986
  year: 1986
  endYear: 1994
  title:
    ko: "자유 연합 협정: 마셜 제도·미크로네시아 연방·팔라우(1986~1994)"
  summary:
    ko: "미국이 1947년부터 전략 신탁 통치령으로 맡은 서태평양 섬들은 1970년대에 여러 갈래로 나뉘었다. 북마리아나 제도는 미국 자치령(코먼웰스)으로 가기로 했고 1986년 효력이 났으며, 마셜 제도·미크로네시아 연방·팔라우는 미국과 자유 연합 협정을 맺는 길을 택했다. 마셜 제도는 1979년 헌법으로 아마타 카부아가, 미크로네시아 연방은 같은 해 헌법으로 토시오 나카야마가 첫 대통령이 되었다. 협정에서는 세 나라가 내정과 외교의 주권을 갖되 국방은 미국이 책임지고 미국이 군사 시설을 쓸 수 있으며, 미국은 경제 원조를 주고 주민은 미국에 자유롭게 오가고 일할 수 있다. 미크로네시아 연방은 1982년 10월 1일, 마셜 제도는 1983년 6월 25일 협정에 서명했고 협정은 마셜 제도에서 1986년 10월 21일, 미크로네시아 연방에서 1986년 11월 3일 발효했다. 1990년 유엔 안전 보장 이사회는 이 두 나라와 북마리아나의 신탁 통치를 끝냈다. 팔라우의 길은 달랐다. 1979년 헌법이 핵 물질의 반입을 금지했고 이를 풀려면 투표의 75퍼센트 찬성이 필요했는데, 협정은 이 헌법 규정과 부딪쳤다. 1986년 1월 10일 서명한 뒤 이 문제로 주민 투표가 여러 차례 되풀이되었고 핵 조항의 문턱을 낮추는 투표를 거쳐 마침내 1994년 10월 1일 협정이 발효하며 쿠니오 나카무라 대통령의 팔라우는 독립했다. 세 나라는 1991~1994년 유엔에 가입했다. 비키니 등 핵실험 피해 보상은 협정과 함께 따로 다뤄졌고(「비키니 환초 핵실험과 주민 이주(1946~1958)」(앞의 사건)) 마셜 제도의 콰절린 환초는 지금도 미국의 미사일 시험장으로 쓰인다."
  subjects: [marshall-islands, micronesia, palau, usa]
  tags: [diplomacy, politics]
  sources: ["위키백과 영어판 Compact of Free Association", "위키백과 영어판 Trust Territory of the Pacific Islands", "위키백과 영어판 Palau", "위키백과 영어판 Marshall Islands"]

- id: fiji-coups-1987
  year: 1987
  endYear: 2006
  title:
    ko: "피지의 쿠데타(1987~2006)"
  summary:
    ko: "1987년 4월 선거에서 인도계 의원이 많이 지지한 노동당과 국민연합당의 연합 정부가 피지 원주민 정당이 17년간 잡은 정권을 이어받아 티모시 바바드라가 총리가 되었다. 한 달 뒤인 5월 14일 시티베니 람부카 중령이 쿠데타로 이 정부를 무너뜨렸다. 람부카는 이어 9월 25일 두 번째 쿠데타로 정치 합의를 무산시켰고, 10월 초 공화국을 선포했으며 이 과정에서 영연방 회원 자격을 잃었다(공화국 선포일은 6~10일로 문서마다 다르다). 바바드라 총리 자리는 5월 14일부터 12월 5일까지 비었다가 라투 마라가 총리로 돌아왔다. 1990년 헌법은 70석 가운데 원주민에 37석, 인도계에 27석을 배정하는 식으로 원주민의 정치 우위를 정했고 쿠데타 뒤 많은 인도계 주민이 나라를 떠났다. 그러나 1997년 헌법은 인도계 차별을 줄이는 쪽으로 고쳐졌고 피지는 1997년 영연방에 돌아왔다. 1999년 첫 인도계 총리 마헨드라 초드리가 취임했으나 2000년 5월 조지 스페이트(뒤에 사형이 종신형으로 감형되었다)와 원주민 민족주의 세력이 의회에서 총리 일행을 인질로 잡고 정부를 무너뜨리려 했고 이 위기 속에서 1997년 헌법이 폐지되었다. 2006년 12월 5일 프랭크 바이니마라마 준장이 화해 법안 등을 이유로 군을 이끌고 정부를 내쫓았고 영연방은 피지의 회원 자격을 우선 정지했다가 2009년 9월 1일 완전히 정지했다. 인종별로 의석을 나누는 제도는 이 기간 내내 정치 다툼의 중심이었다. 이 사건들의 밑에는 1879~1916년 이주한 계약 노동자의 후손이 인구 절반 가까이를 차지한 데서 생긴 원주민과 인도계의 땅·권력 다툼이 있다는 해석이 널리 있다. 람부카는 1992년 6월 2일 마라에 이어 총리가 되어 1999년 5월까지 지냈고 2022년 12월 다시 총리가 되었다."
  subjects: [fiji]
  tags: [politics, society]
  sources: ["위키백과 영어판 1987 Fijian coups d'état", "위키백과 영어판 2006 Fijian coup d'état", "위키백과 영어판 Fiji", "위키백과 영어판 Sitiveni Rabuka"]

- id: matignon-1988
  year: 1988
  endYear: 1998
  title:
    ko: "누벨칼레도니의 우베아 사건과 마티뇽·누메아 협정(1988~1998)"
  summary:
    ko: "누벨칼레도니에서는 1984~1988년 프랑스 정부와 카나크 독립 운동 사이의 충돌이 이어져 '사건들'이라 불린다. 카나크 사회주의 민족 해방 전선(장마리 치바우)은 1984년 임시 정부를 세웠다. 1984년 11월 독립파가 선거를 보이콧했고 1987년 9월 13일 프랑스 잔류를 묻는 주민 투표가 독립파 불참 속에 압도적 찬성으로 끝났다. 1988년 4월 22일 우베아섬에서 카나크 독립파가 헌병대를 습격해 헌병 넷이 숨지고 인질을 동굴에 가두었다. 프랑스 대통령 결선 투표를 사흘 앞둔 5월 4~5일 프랑스군이 동굴을 급습했고 인질범 19명과 군인 2명이 숨졌다. 이후 1988년 6월 26일 프랑스 총리 미셸 로카르가 마티뇽 협정을 중재해 독립 운동가와 반독립파가 섬을 북부·남부·로열티 제도 세 지방으로 나눠 지방 선거와 자치를 약속했고 이는 같은 해 11월 프랑스 전국 국민 투표에서 승인되어 10년 가까운 안정을 가져왔다. 1989년 5월 4일 치바우는 같은 독립파 일부의 총에 암살되었다. 1998년 5월 5일 누메아 협정이 서명되어 20년에 걸친 이행 기간 동안 권한을 지방 정부로 차츰 넘기기로 하고 마지막에 독립 주민 투표를 하게 했다. 2018년 11월 4일 첫 투표에서는 56.7~56.9퍼센트(문서마다 다름)가 프랑스 잔류를 택했고 2020년 10월 4일에는 53.3~53.4퍼센트가 잔류였으며, 2021년 12월 12일 세 번째 투표는 독립파가 보이콧해 약 96퍼센트가 잔류했다. 투표 결과를 인정하는 정도와 선거인 명부의 범위는 지금도 논쟁이다. 사건의 배경으로는 1853년부터의 프랑스 지배와 카나크 땅 문제가 흔히 꼽힌다."
  subjects: [new-caledonia]
  tags: [politics, war]
  sources: ["위키백과 영어판 New Caledonia", "위키백과 영어판 Ouvéa cave hostage taking", "위키백과 영어판 Matignon Agreements (1988)", "위키백과 영어판 Nouméa Accord"]

- id: bougainville-1988
  year: 1988
  endYear: 2001
  title:
    ko: "부건빌 위기와 내전(1988~2001)"
  summary:
    ko: "부건빌섬은 지리와 문화에서 파푸아뉴기니 본토보다 솔로몬 제도 주민에 가깝다고 흔히 말하는 땅으로, 식민지 때 경계가 그어져 파푸아뉴기니에 속했다. 1975년 독립 때 일으킨 첫 분리 선언(「파푸아뉴기니의 독립(1975)」(앞의 사건))은 가라앉았으나 1972년부터 파낸 팡구나 구리·금 광산의 수익과 환경 피해를 둘러싼 불만이 커졌다. 1988년 말(위키백과는 12월 1일로 적는다) 프랜시스 오나가 이끄는 광산 지주들의 반대가 무장 충돌로 번져 부건빌 혁명군이 생겼고 광산은 1989년 문을 닫았다. 혁명군은 1990년 5월 독립을 선언했고 중앙 정부는 섬을 봉쇄했다. 오스트레일리아가 파푸아뉴기니군에 헬리콥터를 빌려준 일은 논란이 되었다. 1991년 1월 솔로몬 제도 호니아라에서 파푸아뉴기니와 혁명군이 선언에 서명했으나 오래 이어지지 못했다. 죽은 사람 수는 추산이 갈려 오스트레일리아 정부는 1만 5,000~2만 명, 보수적인 추산은 전투 사망 1,000~2,000명, 폭력과 병으로 약 1만 명이라는 서술도 있다. 1997년 1월 파푸아뉴기니 정부가 용병 회사 샌드라인을 고용하려 한 일은 군 사령관 제리 싱기록의 반대로 무너져 줄리어스 챈 총리가 물러나는 위기로 번졌다. 1997년 뉴질랜드의 번햄에서 열린 회담의 휴전과 비무장 휴전 감시단, 1998년 1월 링컨 협정으로 무장 해제가 시작되었고, 2001년 8월 30일 부건빌 평화 협정이 맺어져 자치 정부가 생겼고 2005년 첫 선거로 조지프 카부이가 자치 정부 대통령이 되었다. 2019년 11~12월 독립 의견을 묻는 투표에서 약 97.7퍼센트가 찬성했고, 2021년 합의는 독립을 2027년 무렵으로 잡았으나 파푸아뉴기니 의회의 승인이 필요하다."
  subjects: [papua-new-guinea]
  tags: [war, politics]
  sources: ["위키백과 영어판 Bougainville Civil War", "위키백과 영어판 Panguna mine", "위키백과 영어판 Autonomous Region of Bougainville", "위키백과 영어판 2019 Bougainvillean independence referendum"]

- id: mabo-1992
  year: 1992
  endYear: 1993
  title:
    ko: "마보 판결과 원주민 토지 권리(1992~1993)"
  summary:
    ko: "토레스 해협 동쪽 메르섬(영어 이름 머리섬)에 사는 메리암 사람 에디 코이키 마보와 몇몇 주민은 1982년 퀸즐랜드 주를 상대로 자기 땅에 대한 권리를 인정해 달라는 소송을 냈다. 1988년의 첫 판결에서는 퀸즐랜드가 1985년 만든 법이 인종차별금지법에 어긋난다는 판단이 나왔고, 1992년 6월 3일 연방 고등법원은 6 대 1로 본안 판결을 내렸다. 판결의 핵심은 식민지 시절 영국 법이 오스트레일리아를 주인 없는 땅, 곧 테라 눌리우스로 보았던 생각을 버린 데 있다. 다수 의견은 영국의 영유권 선언 이전부터 이 땅의 원주민 집단이 법과 관습에 따라 땅과 이어져 있었고, 그 권리인 원주민 권원이 이후 정부의 조치로 없어지지 않았다면 보통법에서도 인정된다고 판단했다. 정부가 땅을 이미 개인에게 넘기는 등으로 권원이 사라진 곳은 되살릴 수 없었다. 마보는 판결이 나오기 다섯 달쯤 앞서인 1992년 1월 암으로 숨졌고 이 소식을 보지 못했다. 1992년 12월 키팅 총리는 시드니 레드펀에서 한 연설에서 비원주민이 원주민에게 저지른 일을 인정했다. 키팅 정부는 이 판결을 받아 1993년 원주민 권원법을 만들어 권원을 가려내는 국가 권원 재판소를 두었다. 법은 1993년 말 통과되어 1994년 1월 효력이 났다. 1996년 윅 판결은 목축 임차지에서도 원주민 권원이 함께 있을 수 있다고 보았고, 이어 하워드 정부가 1998년 법을 고쳐 임차지 권리를 조정했다. 오스트레일리아 원주민과 토레스 해협 제도 원주민의 땅 권리가 처음으로 보통법의 틀 안에서 인정받은 이 판결은 이 대륙에서 식민 이후의 땅 문제를 따지는 기준점이 되었다."
  subjects: [aboriginal-australians, torres-strait-islanders, australia]
  tags: [politics, society]
  sources: ["위키백과 영어판 Mabo v Queensland (No 2)", "위키백과 영어판 Eddie Mabo", "위키백과 영어판 Native Title Act 1993", "위키백과 영어판 Wik Peoples v Queensland"]

- id: pacific-solution-2001
  year: 2001
  endYear: 2008
  title:
    ko: "탐파호 사건과 '태평양 해법'(2001~2008)"
  summary:
    ko: "2001년 8월 말 노르웨이 화물선 탐파호는 인도양에서 가라앉는 어선의 사람 433명(대부분 아프가니스탄 사람)을 구조했으나 오스트레일리아 정부는 크리스마스섬에 들어오는 것을 막았다. 존 하워드 총리 정부는 군 특수부대를 보내 배를 막았고, 구조된 사람들은 다른 배로 옮겨 나우루 등으로 보내졌다. 이어 2001년 9월 27일 이민법을 고치는 법안이 통과되고 9월 28일 필립 러덕 이민 장관이 시행에 들어갔다. 탐파호 사건은 2001년 9월 11일 미국 동시 다발 테러 직전에 터져 총선 분위기와 겹쳤다. 이 정책은 '태평양 해법'이라 불린다. 크리스마스섬 등 여러 섬을 이민법상의 입국 지역에서 빼고, 배로 오는 난민 신청자를 나우루와 파푸아뉴기니 마누스섬의 수용소에서 심사한다는 것이 뼈대였고, 나우루는 그 대가로 오스트레일리아에서 원조를 받았다. 총선은 2001년 11월 10일이었다. 정책이 시작된 뒤 배로 도착한 사람은 2001년 5,516명에서 2002년 한 명으로 줄었고 2008년까지 해마다 150명을 넘지 않았으며, 비용은 2001~2007년 적어도 10억 오스트레일리아 달러였다. 정부는 이것이 밀입국 사업과 바다에서의 죽음을 막는다고 설명했고, 인권 단체와 유엔 기구는 수용 환경과 정신 건강 문제를 비판했다. 2007년 선거에서 이긴 케빈 러드 정부는 정책을 접어 2008년 2월 나우루 수용소가 문을 닫았다. 그러나 줄리아 길러드 정부 아래 2012년 8월 16일 법안이 통과되어 나우루와 마누스섬의 수용소가 다시 열렸고, 파푸아뉴기니 대법원이 2016년 마누스 수용소가 위헌이라 판단했으며 수용소는 2017년 닫혔다."
  subjects: [australia, nauru, papua-new-guinea]
  tags: [politics, society]
  sources: ["위키백과 영어판 Pacific Solution", "위키백과 영어판 MV Tampa", "위키백과 영어판 Manus Regional Processing Centre", "위키백과 영어판 Nauru Regional Processing Centre"]

- id: apology-2008
  year: 2008
  endYear: 2008
  title:
    ko: "국가의 사과와 도둑맞은 세대(2008)"
  summary:
    ko: "1905년 무렵부터 1960년대 말까지 오스트레일리아 연방과 주 정부, 교회와 복지 기관은 법과 정책에 따라 많은 오스트레일리아 원주민과 토레스 해협 제도 원주민 아이를 가족에게서 떼어 시설과 백인 가정으로 보냈다(이 일을 도둑맞은 세대라 부르는 내력은 「코니스턴 학살과 원주민 보호 정책(1928)」(앞의 사건)에 있다). 키팅 정부의 의뢰로 1997년 5월 의회에 제출된 『그들을 집으로』(Bringing Them Home) 보고서는 이 일을 조사해 1910~1970년 사이 아이 열 명 가운데 한 명에서 셋 가운데 한 명꼴로 떼어졌다고 추산했고 공식 사과를 권고했다. 이 추산은 그 시기와 지역에 따라 달라 지금도 논의가 이어진다. 1998년 5월 26일 첫 사죄의 날 행사가 열렸으나 존 하워드 정부는 '사과'라는 말을 피한 채 1999년 화해 결의를 통과시켜 유감을 밝혔다. 2008년 2월 13일 케빈 러드 총리는 국회에서 역대 의회와 정부가 법과 정책으로 깊은 슬픔과 고통, 상실을 준 일을 사과하는 결의안을 발의했고 하원은 만장일치로 통과시켰다. 야당 지도자 브렌던 넬슨도 초당적 지지를 밝혔으나 방청석 일부는 그의 연설 때 등을 돌리거나 자리를 떠났다. 사과문은 원주민과 비원주민 사이의 기대 수명·교육·경제 격차를 줄이겠다는 약속을 담았고, 이 약속은 같은 해 연방과 주의 격차 줄이기 합의로 이어졌다. 격차 줄이기 합의는 해마다 정부 보고서로 점검되었고 기대 수명 등 여러 목표가 제때 달성되지 못했다는 평가가 나왔다. 사과가 보상으로 이어지지 않았다는 점은 비판과 논쟁의 대상으로 남았다. 원주민은 오스트레일리아 인구의 3퍼센트 안팎이다. 국가와 원주민 사이의 관계에서 사과는 인정의 상징이 되었으나 이후의 정책 성과를 둘러싼 평가는 갈린다."
  subjects: [aboriginal-australians, australia]
  tags: [society, politics]
  sources: ["위키백과 영어판 Apology to Australia's Indigenous peoples", "위키백과 영어판 Bringing Them Home", "위키백과 영어판 Stolen Generations", "위키백과 영어판 Closing the Gap"]

- id: climate-tuvalu-kiribati-2009
  year: 2009
  endYear: 2023
  title:
    ko: "기후 변화와 투발루·키리바시(2009~2023)"
  summary:
    ko: "투발루와 키리바시는 산호초 위에 얹힌 낮은 섬들로 이뤄져 해수면이 오르면 땅이 짠물에 잠기고 식수와 농사가 어려워진다. 투발루의 가장 높은 곳은 니울라키타섬의 4.6미터이고 평균 높이는 2미터 안팎이라고 흔히 말한다. 키리바시는 2008년 아노테 통 대통령이 '돌아올 수 없는 지점'에 이르렀다고 말했고 2013년에는 해수면 상승을 피할 수 없다고 했다. 2009년 12월 코펜하겐 당사국 총회에서는 투발루 대표가 법적 구속력 있는 합의를 요구하며 회의 진행을 멈춰 세운 일로 작은 섬나라의 목소리가 알려졌다. 키리바시는 2012년 피지 바누아레부섬의 나토아바투 농장 2,200헥타르를 사들이는 절차에 들어가 2014년 5월 대통령실이 약 5,460에이커를 930만 오스트레일리아 달러에 샀다고 확인했는데, 식량과 피난처로 쓰려는 뜻이었다. 키리바시는 일찍부터 '존엄을 지키는 이주' 정책을 내세워 외국에서 일할 수 있게 기술 교육을 늘렸다. 2015년 12월 파리 협정이 채택될 때 태평양 섬나라들은 기온 상승 한도를 1.5도로 낮추자고 앞장섰다. 투발루 외무 장관 사이먼 코페는 2021년 11월 바닷물에 무릎까지 잠긴 채 총회에 영상을 보냈고 2022년 11월에는 나라의 땅과 문화를 디지털 공간에 옮기겠다는 계획을 밝혔다. 2023년 11월 9일 오스트레일리아와 투발루는 팔레필리 연합 조약에 서명했는데, 기후 변화와 안보를 함께 다루며 해마다 투발루 시민 280명이 오스트레일리아로 옮겨 살 길을 열었다. 조약은 2024년 8월 28일에 발효했고, 투발루가 다른 나라와 안보 협정을 맺을 때 오스트레일리아와 협의해야 한다는 조항은 주권 논란을 낳았다."
  subjects: [tuvalu, kiribati, fiji]
  tags: [society, diplomacy]
  sources: ["위키백과 영어판 Kiribati", "위키백과 영어판 Tuvalu", "위키백과 영어판 Falepili Union", "위키백과 영어판 Paris Agreement"]
