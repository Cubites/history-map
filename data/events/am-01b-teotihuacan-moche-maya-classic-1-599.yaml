# 아메리카 사건 3묶음 갈래 01b: 조상 푸에블로인·모체·티와나쿠·마야 고전기·테오티우아칸의 전성과 버려짐·와리의 시작 (기원후 1년 ~ 599년)
# 범위: 바스켓메이커와 조상 푸에블로인, 모체 문화, 티와나쿠, 마야 고전기 초(장기력 석비·시야흐 칵의 티칼 도착·코판 왕조·칼라크물의 티칼 격파), 테오티우아칸의 전성과 중심부 화재, 호호캄, 타이노인의 조상, 와리 문화의 시작(1~599년 시작 사건).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: year는 천문 연도이고 이 갈래는 기원후라 글의 해와 같다. 고고 문화의 연대는 방사성 탄소 연대·층위로 잡은 것이라 '무렵'을 붙였고, 문서마다 갈리는 해는 한 구절로 밝혔다. 항목의 시작 해와 문서의 해가 다른 곳(티와나쿠 110년 무렵, 호호캄 300년 무렵, 와리 500년 무렵, 테오티우아칸 버려짐 650년 무렵)은 글에 다른 학설을 함께 적었다.
# 달력: 마야 장기력을 옮긴 날짜는 상관 상수에 따라 날이 갈리므로 달까지만 적었다(378년 1월·379년 9월). 그 밖의 연대는 연 단위의 근사값이다.
# 이름 규칙: 항목 이름(조상 푸에블로인·모체 문화·티와나쿠·마야 문명·테오티우아칸·호호캄·타이노인·와리 문화)을 글자 그대로 썼다. 그 밖의 유적·인물 이름은 위키백과 한국어판 표제, 없으면 저장소 표기 사전과 외래어 표기법을 따랐다.
# 지도 결정과의 관계: 이 시기 항목은 모두 땅을 그리지 않는 항목이라 subjects에만 두고 links는 쓰지 않았다. 마야 도시(티칼·칼라크물·코판)는 따로 항목이 없어 마야 문명 아래의 글로 다루었다.
# 가리킨 기존 사건: 없음(같은 갈래 안과 다른 갈래 고정 사건만 가리킴).

- id: basketmaker-1
  year: 1
  endYear: 500
  title:
    ko: "바스켓메이커와 조상 푸에블로인의 시작(1~500)"
  summary:
    ko: "조상 푸에블로인은 오늘날 미국의 유타 남동부, 애리조나 북동부, 뉴멕시코 북서부, 콜로라도 남서부가 만나는 포코너스 일대에 살던 사람들이다. 이들의 앞 시기를 바스켓메이커라 부르는데, 유적에서 바구니가 아주 많이 나와서 붙은 이름이다. 옥수수 농사는 기원전 1500년 무렵 시작된 이른 바스켓메이커 II에 이미 있었고, 기원후 1년에서 500년 사이는 늦은 바스켓메이커 II가 앞부분을 차지한다(문서에 따라 이른 시기와 늦은 시기의 경계를 기원후 50년으로 둔다). 늦은 바스켓메이커 II의 사람들은 수풀과 통나무, 흙으로 얕은 수혈 주거를 지어 한곳에 오래 머물기 시작했다. 옥수수가 식생활의 큰 몫이 되었어도 사냥은 이어졌고, 그때는 창과 투창기가 쓰였다. 구운 토기는 늦은 바스켓메이커 II의 뒷부분에 나타났다. 500년에서 750년까지의 바스켓메이커 III에 들면 활과 화살이 투창기를 대신해 사냥이 한결 쉬워졌다. 이어지는 푸에블로 I기는 750년에서 900년까지로 잡는데, 푸에블로 I기와 II기를 합쳐 700년에서 1130년으로 묶는 문서도 있다. 처음의 토기는 무늬 없는 회색 그릇이었고, 북쪽 지역에서는 500년 무렵부터 1300년까지 흰 바탕에 검은 무늬를 얹은 토기가 이어졌다. 같은 문서의 다른 대목은 이 문화의 출현을 기원전 12세기로 적는다. 이 시기 구분은 1927년의 페코스 분류에서 비롯한 것으로 고고학의 약속이지 사람들이 스스로 부른 이름이 아니다. 이 사회가 절벽 주거를 짓고 1300년 무렵 포코너스를 떠나는 일은 「메사버드의 절벽 주거와 포코너스의 포기(1190~1300)」(뒤의 사건)에서 다룬다."
  subjects: [ancestral-puebloan-culture]
  tags: [society, culture]
  sources: ["Stephen H. Lekson, A History of the Ancient Southwest (School for Advanced Research Press, 2008)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: moche-100
  year: 100
  endYear: 600
  title:
    ko: "모체 문화의 와카와 시판의 군주(100~600)"
  summary:
    ko: "페루 북부 해안의 모체·치카마·비루·산타·네페냐 같은 여러 계곡에서는 100년 무렵부터 800년 무렵까지 모체 문화가 이어졌다. 이 문화권은 해안선을 따라 약 400킬로미터, 안쪽으로 최대 80킬로미터에 걸쳤고, 100~300년의 이른 시기, 300~600년의 중기, 500~800년의 늦은 시기로 나눈다. 비가 거의 오지 않는 해안 사막에서 사람들은 안데스에서 내려오는 강물을 수로로 끌어 농사를 지었는데, 아스코페 수도교와 라쿰브레 수로 같은 시설은 지금도 쓰인다. 남쪽 모체 사회의 중심은 모체 계곡의 태양의 와카와 달의 와카 일대로 보인다. 태양의 와카는 흙벽돌로 쌓은 페루의 콜럼버스 이전 건물 가운데 가장 크다고 하고, 달의 와카는 1세기부터 9세기까지 쓰였으며 새 단을 헌 단 위에 약 100년마다 덧쌓아 여섯 세기에 걸쳐 키웠다. 달의 와카에는 약 1만 제곱미터에 이르는 벽화가 있고, 바위 앞의 의례 마당에서는 머리를 크게 맞은 성인 남성의 유해가 많이 나와 인신 공양의 자리로 해석한다. 1987년(문서 하나는 1986년) 도굴을 알린 경찰의 신고로 시판에서 손대지 않은 모체 무덤이 발굴되었다. 300년 무렵의 것으로 측정된 이 무덤에는 미라가 된 높은 신분의 남성과 다른 여섯 사람, 동물, 금과 은의 유물이 있었고, 주인을 시판의 군주라 부른다. 실제 인물의 얼굴을 닮게 빚은 인물 토기도 모체 미술의 특징이다. 남쪽 모체와 그 북쪽의 피우라·람바예케·헤케테페케 일대를 하나의 제국이 아니라 같은 문화를 나눈 여러 자치 정치체로 보는 학자가 많다. 이 사회의 끝은 「모체 문화와 나스카 문화의 끝(600~800)」(뒤의 사건)에서 다룬다."
  subjects: [moche-culture]
  tags: [society, culture]
  sources: ["Garth Bawden, The Moche (Blackwell, 1996)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)"]

- id: tiwanaku-110
  year: 110
  endYear: 600
  title:
    ko: "티와나쿠의 성장과 티티카카호 남쪽의 도시(110~600)"
  summary:
    ko: "볼리비아 서부, 티티카카호 남쪽 오늘날의 라파스에서 약 70킬로미터 떨어진 곳에서 티와나쿠가 도시로 자랐다. 방사성 탄소 연대를 통계로 다시 따진 연구는 이 도시의 창건을 110년 무렵(50~170년 사이일 확률 68퍼센트)으로 보며, 기원전 1580년이라는 옛 값은 믿기 어렵다고 한다. 한 고고학 잡지의 2024년 글은 창건을 150년 무렵으로 적고, 600년 무렵 남부 안데스 곳곳의 이주민이 이 도시로 몰려들었다고 쓴다. 티와나쿠의 힘은 200~500년에 티티카카 분지에서 커졌고 500~600년에 정점에 올랐다는 설명이 있으며, 문서에 따라 도시의 전성기를 375~700년으로 잡는다. 지표에 드러난 유적은 약 4제곱킬로미터이고, 2016년의 드론 조사는 411헥타르에 걸친 구조물을 찾아냈는데 17헥타르짜리 돌 신전과 둥글거나 네모난 건축 100여 곳이 들었다. 아카파나는 너비 257미터에 높이 16.5미터이고, 푸마푼쿠는 남북 167미터, 동서 117미터에 높이 5미터이며 가장 큰 돌덩이는 131톤으로 어림한다. 칼라사사야의 가장 큰 돌은 약 27톤, 베넷 석상은 높이 7.3미터로 안데스에서 발견된 가장 큰 석비이다. 분지는 낙타과 동물의 대상 교역망으로 이어졌다고 본다. 분지에서는 돋운 밭이 쓰였다. 전성기 인구는 1만 명을 넘었고, 800년 무렵 1만~2만 명으로 보는 보수적 추산이 있다. 이 유적은 1549년 페드로 시에사 데 레온이 적어 알렸고 2000년 유네스코 세계유산이 되었다. 이웃 와리와의 관계는 「와리 문화의 시작과 아야쿠초 분지(500~600)」(뒤의 사건)에, 쇠퇴는 「와리 문화와 티와나쿠의 쇠퇴(900~1000)」(뒤의 사건)에 있다."
  subjects: [tiwanaku]
  tags: [society, culture]
  sources: ["Alan L. Kolata, The Tiwanaku: Portrait of an Andean Civilization (Blackwell, 1993)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)"]

- id: maya-classic-250
  year: 250
  endYear: 378
  title:
    ko: "마야 고전기의 시작: 왕과 석비, 장기력(250~378)"
  summary:
    ko: "마야 저지대의 고전기는 250년 무렵 시작되었다고 본다. 고전기는 250년부터 900년까지로 잡고 250~600년을 이른 시기, 600~900년을 늦은 시기로 나눈다. 고전기는 장기력 날짜를 새긴 기념물을 세우는 일로 크게 규정되고, 그 앞의 종말 선고전기는 159년부터 250년까지로 잡는다. 장기력은 한 기점부터 지난 날수를 자리마다 세는 방식이라 기념물 하나가 연대를 정확히 알려 준다. 석비를 세우는 전통 자체는 훨씬 오래되어, 기원전 400년 무렵에 벌써 초기 마야 지배자들이 석비를 세웠다. 마야 저지대에서 지금까지 남은 가장 이른 장기력 날짜는 티칼 29호 석비의 8.12.14.8.15이고 이는 292년에 해당한다. 고전기의 마야 문명은 하나의 나라가 아니라 여러 도시 국가가 바뀌는 동맹과 다툼으로 엮인 땅이었다. 연구자들은 이 모습을 르네상스 이탈리아나 고전 그리스에 견준다. 각 도시의 중심에는 신성한 왕이 있어 사람과 초자연의 세계를 잇는 중개자 구실을 했고, 으뜸가는 왕은 '신성한' 주군이라는 뜻의 칭호를 이름 앞에 붙였다. 이 칭호는 처음에는 가장 오래되고 이름 높은 왕가에만 허락되었다. 페텐 분지에서는 티칼과 칼라크물이 큰 맞수로, 저마다 동맹과 속국의 연결망을 쌓았고 한쪽이 번성하면 다른 쪽이 기우는 일이 되풀이되었다. 마야 저지대 첫 마을들의 이야기는 「옥수수 농경의 정착과 마야 문명의 첫 마을(기원전 2000~기원전 1000)」(앞의 사건)에서 다루었다. 이 고전기 초의 질서는 378년 테오티우아칸과 이어진 인물이 티칼에 들어오면서 바뀌는데, 그 일은 「시야흐 칵의 티칼 도착과 테오티우아칸(378~379)」(뒤의 사건)에서 다룬다."
  subjects: [maya-civilization]
  tags: [politics, culture]
  sources: ["Michael D. Coe, The Maya (Thames & Hudson)", "Simon Martin, Nikolai Grube, Chronicle of the Maya Kings and Queens (Thames & Hudson, 2000)"]

- id: teotihuacan-zenith-300
  year: 300
  endYear: 550
  title:
    ko: "테오티우아칸의 전성과 메소아메리카 교류(300~550)"
  summary:
    ko: "테오티우아칸은 3세기 앞뒤부터 6세기 중반까지 메소아메리카에서 가장 큰 도시였고, 350~650년을 도시의 제3기로 묶는 문서도 있다. 큰 기념 건축이 앞 시기에 세워진 뒤 이 도시는 사는 사람의 출신이 여럿인 도시가 되었다. 오아하카 사람 구역인 틀라일로틀라칸에서는 사포텍 양식의 유물과 앞방이 딸린 무덤이 나왔고, 동위원소 분석은 그곳 사람들이 오아하카로 거듭 오갔음을 시사한다. 상인 구역에서는 둥근 흙벽돌 건물과 멕시코만 연안과 이어지는 토기가 나왔고, 스트론튬 동위원소 값은 적지 않은 이주민이 있었음을 가리킨다. 가구마다 5~10명이 살았고, 이 도시가 중미 흑요석 교역을 사실상 독점했다고 보며 그 제품은 몬테알반과 티칼에까지 닿았다. 벽화는 450~650년에 가장 많이 그려졌으며 사제의 행렬, 재규어, 폭풍우 신, 선물을 내미는 여신이 되풀이해 나온다. 많은 연구자는 큰 여신을 으뜸 신으로 보고 종교 지도자가 정치 지도자였다고 본다. 조지 카울길은 권력이 한 사람에게 쏠리지 않고 갈수록 합의로 옮겨 갔다고 보았다. 마야 지역과의 관계는 378년 티칼의 일에서 가장 두드러지는데, 경사진 벽 위에 수직 판을 얹는 건축 양식이 티칼과 카미날후유에 퍼졌다. 이것이 테오티우아칸의 직접 지배인지 문화 교류인지는 학자들이 다툰다. 경사 벽 위에 판을 얹는 이 양식은 선고전기 틀락스칼라·푸에블라 지역에서 생겼고 테오티우아칸의 영향만으로 퍼진 것은 아니라는 설명이 있다. 전성기(450년 무렵) 인구는 밀론의 어림으로 12만 5천 명 안팎이고, 이 도시를 당시 세계에서 여섯째로 큰 도시로 꼽는 서술도 있다. 도시의 성립은 「테오티우아칸의 성립과 태양의 피라미드(기원전 100~기원후 250)」(앞의 사건), 끝은 「테오티우아칸 중심부의 화재와 버려짐(550~650)」(뒤의 사건)에 있다."
  subjects: [teotihuacan]
  tags: [society, economy]
  sources: ["George L. Cowgill, Ancient Teotihuacan (Cambridge University Press, 2015)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)"]

- id: hohokam-300
  year: 300
  endYear: 750
  title:
    ko: "호호캄의 수로와 소노라 사막의 마을(300~750)"
  summary:
    ko: "북아메리카 남서부 소노라 사막의 솔트강과 힐라강 유역에서는 300년 무렵부터 호호캄의 마을이 뚜렷해졌다. 문서마다 시작이 갈려, 앞 단계를 기원전 300년 무렵까지 올려 보는 설이 있고, 기원후 1년부터 750년까지를 개척기로 묶는 구분도 쓰인다. 중부 애리조나에 정착 농사가 기원전 1000~500년에 있었다는 설명도 있다. 토기는 300년 바로 앞에 나타났고, 300~500년 무렵에 면화·테파리콩·쿠샤호박·비름이 더해졌으며 600년 무렵부터 용설란을 길렀다. 토기가 갑자기 나타난 것을 두고 교역이나 이주의 결과라는 설과 토착 발전이라는 설이 갈린다. 이들의 가장 큰 일은 강물을 끌어온 수로이다. 피닉스 일대의 수로망은 콜럼버스 이전 서반구에서 가장 복잡하다고 일컬어지고, 1마일에 몇 피트만 떨어지게 경사를 맞추었다. 큰 수로망이 널리 퍼진 때는 800~1400년이므로 이 사건의 수로는 그 앞 모습이다. 스네이크타운은 기원전 300년 무렵부터 기원후 1050년 무렵까지 사람이 산 마을로, 1930년대와 1960년대에 발굴되었고 공놀이 마당 둘과 수백 채의 움집이 있었다. 호호캄 건축은 600년 무렵에 이르러 메소아메리카와 닮은 점이 보이는데 공놀이 마당이 그 예이다. 이 마당은 돌이 아니라 땅을 9피트(약 2.7미터)까지 파서 만들었고 파낸 흙더미는 길이 250피트, 너비 90피트에 이르기도 했다. 이 닮음을 두고 대부분의 고고학자는 호호캄이 이곳에서 생겼거나 메소아메리카에서 왔다고 보며 북쪽 푸에블로의 영향도 따진다. 다른 학자들은 많은 특징이 이미 이곳 토착 농경 마을에 있었다고 한다. 호호캄의 끝은 「카호키아의 쇠퇴와 호호캄의 끝(1350~1450)」(뒤의 사건)에서 다룬다."
  subjects: [hohokam-culture]
  tags: [society, economy]
  sources: ["Emil W. Haury, The Hohokam: Desert Farmers and Craftsmen: Excavations at Snaketown, 1964–1965 (University of Arizona Press, 1976)", "Stephen H. Lekson, A History of the Ancient Southwest (School for Advanced Research Press, 2008)"]

- id: siyaj-kak-378
  year: 378
  endYear: 379
  title:
    ko: "시야흐 칵의 티칼 도착과 테오티우아칸(378~379)"
  summary:
    ko: "티칼 31호 석비는 시야흐 칵이 378년 1월에 마야 문명의 도시 엘 페루와 티칼에 도착했다고 적었다. 그해 1월에 티칼의 14대 왕 착 토크 이착 1세가 죽었고, 시야흐 칵은 이 도시를 손에 넣었다. 그는 테오티우아칸 사람이었거나 그 도시와 아주 가까운 동맹이었다고 보며, 테오티우아칸의 전투 복장을 한 모습으로 그려진다. 일부 연구자는 그를 '창 던지는 올빼미'라는 이름의 인물의 장군으로 보는데, 이 올빼미는 테오티우아칸의 통치자였을 가능성이 있다. 378~379년에 티칼과 이웃 도시 우악삭툰에서 왕이 바뀌었고 새 왕들은 창 던지는 올빼미의 후손이라고 주장했다. 티칼의 새 왕은 15대 약스 누운 아인 1세로 '곱슬코'라는 별칭으로도 불리며, 379년 9월에 즉위했다. 약스 누운 아인 1세는 404년 앞뒤까지 다스렸다고 적히며 죽은 해는 분명하지 않다. 406년 의식을 이름만 전하는 시야흐 찬 키니치가 주관했고, 411년 시야흐 찬 카위일 2세가 즉위하기까지 그가 섭정을 맡았을 수 있다는 해석이 있다. 그를 거쳐 즉위한 시야흐 찬 카위일 2세는 표에 411~456년 재위로 적힌다. 31호 석비는 시야흐 찬 카위일 2세가 즉위를 기념해 세운 것으로, 양옆에 아버지 약스 누운 아인 1세를 테오티우아칸 전사의 차림에 비의 신 틀랄록의 얼굴이 새겨진 방패를 든 젊은이로 새겼다. 그보다 두 해 앞선 376년 날짜의 39호 석비가 이미 티칼의 잃어버린 세계 복합에 세워져 있었다. 이 사건을 테오티우아칸이 마야 도시를 직접 지배한 증거로 보는 연구자와 문화 교류와 동맹의 증거로 보는 연구자가 맞선다. 시야흐 칵은 5세기 초에 죽었다고 한다. 앞의 질서는 「마야 고전기의 시작: 왕과 석비, 장기력(250~378)」(앞의 사건)에서, 테오티우아칸 쪽 사정은 「테오티우아칸의 전성과 메소아메리카 교류(300~550)」(앞의 사건)에서 다루었다."
  subjects: [maya-civilization, teotihuacan]
  tags: [politics, war]
  sources: ["Simon Martin, Nikolai Grube, Chronicle of the Maya Kings and Queens (Thames & Hudson, 2000)", "Michael D. Coe, The Maya (Thames & Hudson)"]

- id: taino-400
  year: 400
  endYear: 600
  title:
    ko: "타이노인 조상의 대앤틸리스 확산(400~600)"
  summary:
    ko: "타이노인의 조상은 남아메리카 북동부에서 바다를 건너 카리브해의 섬으로 들어온 아라와크어 쓰는 농경민이라고 본다. 출신을 두고 아마존 중부에서 오리노코 골짜기를 거쳤다는 설과 콜롬비아 안데스에서 왔다는 환카리브설이 갈린다. 유전자 연구는 토기를 쓰는 이 농경민이 약 2,500년 전 남아메리카 북동부에서 카리브해로 들어왔다고 말하며, 이들이 마주친 앞 시기 사람들은 6,000~7,000년 전에 건너왔다. 고고학에서는 이 이주를 살라도이드 문화라 부르는데, 오리노코강 하류에서 일어나 작은 앤틸리스와 푸에르토리코, 히스파니올라로 번지며 앞서 살던 오르토이로이드 문화를 대신했고 기원전 500년부터 기원후 545년까지로 잡는다. 대앤틸리스로의 확산은 기원전 500~280년 무렵에 시작되었고, 400~600년 무렵은 살라도이드의 끝 단계에서 오스티오노이드로 넘어가는 때다. 이 이름은 베네수엘라의 살라데로 마을에서 처음 알려진 토기 양식에서 왔다. 살라도이드 사람들은 원예 농사와 토기 제작을 하며 붙박이 마을에서 살았고, 붉은 바탕에 흰색·주황색·검은색 흙물을 입힌 토기를 남겼다. 이들은 홍옥수와 청금석 같은 먼 곳의 돌로 맹금 모양의 장신구를 만들었고 이 장신구는 600년 무렵까지 교환되었다. 600년 무렵부터 토기 양식이 바뀌어 고고학은 이를 오스티오노이드라 부르고, 훗날 타이노인이 이 전통의 끝 단계라고 보지만, 오스티오노이드가 살라도이드에서 이어졌는지 앞 시기 사람들에서 생겼는지는 갈린다. 콜럼버스 무렵의 서술로는 타이노인의 주식이 카사바(둔덕 밭)였고 마을의 큰 원형 집에 10~15가구가 살았으며 통나무배는 2명에서 150명까지 태웠다. 쿠바 서부에는 앞 시기 사람들이 900년 무렵까지 살아남았을지 모른다는 증거도 있다. 이 뒤의 카시케 사회는 「타이노 카시케 사회와 칼리나고의 작은 앤틸리스 이주(1200~1250)」(뒤의 사건)에서 다룬다."
  subjects: [taino-culture]
  tags: [society, culture]
  sources: ["Irving Rouse, The Tainos: Rise and Decline of the People Who Greeted Columbus (Yale University Press, 1992)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)"]

- id: copan-426
  year: 426
  endYear: 437
  title:
    ko: "약스 쿡 모와 코판 왕조(426~437)"
  summary:
    ko: "온두라스 서부의 코판은 마야 문명의 큰 도시로, 426년 약스 쿡 모가 왕으로 세워지며 새 왕조가 시작되었다. 비문은 그를 '서쪽의 주군'이라는 칭호를 얻고 새 왕명을 받은 전사 쿡 모 아하우로 적으며, 그가 티칼 출신이라고 읽는다. 이 정권 교체는 티칼에서 꾸민 것으로 보이고, 티칼 왕 시야흐 찬 카위일 2세가 뒷배를 댔다고 본다. 약스 쿡 모를 테오티우아칸에서 왔거나 멕시코 중부 풍을 받아들인 마야 사람으로 보는 학자도 있는데, 그가 지은 건축이 테오티우아칸 양식과 티칼 양식을 함께 보이기 때문이다. 왕 목록은 16명이며 가짜 왕일 수 있는 17번째 인물을 더하기도 한다. 약스 쿡 모의 재위는 426년부터 437년 무렵까지이고 2대는 약스 쿡 모의 뒤를 이은 키니치 포폴 홀로 437년 무렵으로 적힌다. 16번째 왕 약스 파삭 찬 요팟은 763년에 올라 810년 뒤까지 자리에 있었다. 16호 신전의 가장 이른 단계인 후날은 경사 벽에 판을 얹은 테오티우아칸 풍으로 지었고, 그 바닥의 천장 얹은 지하 무덤에서 비취 공물과 함께 한 사람이 나왔다. 이 무덤은 1995년 로버트 샤러와 데이비드 세데트 팀이 찾았고, 위치로 보아 약스 쿡 모의 것으로 보며, 뼈 분석은 이 사람이 코판 태생이 아님을 가리켰다. 16호 신전에서 가장 잘 남은 로살릴라 단계는 리카르도 아구르시아가 찾았고 헌정 계단의 571년 날짜로 보아 10대 왕 달 재규어(553~578년 재위) 때의 것이다. 776년 약스 파삭 찬 요팟이 신전 밑에 세운 제단 Q는 16명의 왕이 저마다 이름 글자 위에 앉은 모습을 새겼고, 윗면의 글은 426~427년의 왕조 창건을 적는다. 앞 시기의 흐름은 「시야흐 칵의 티칼 도착과 테오티우아칸(378~379)」(앞의 사건)에 있다."
  subjects: [maya-civilization]
  tags: [politics, culture]
  sources: ["Simon Martin, Nikolai Grube, Chronicle of the Maya Kings and Queens (Thames & Hudson, 2000)", "Michael D. Coe, The Maya (Thames & Hudson)"]

- id: wari-500
  year: 500
  endYear: 600
  title:
    ko: "와리 문화의 시작과 아야쿠초 분지(500~600)"
  summary:
    ko: "와리 문화는 페루 남부 안데스의 아야쿠초 분지에서 일어나 500년 무렵부터 1000년 무렵까지 이어졌다고 본다. 수도 와리는 오늘날의 아야쿠초 시에서 북동쪽으로 약 11킬로미터 떨어진 곳에 있었다. 와리 도시 가까이의 콘초파타 유적은 약 10킬로미터 거리에 있었고, 한때는 도공의 마을로 여겨졌으나 200명이 넘는 무덤의 주인이 하인과 중간 계층, 엘리트, 어쩌면 낮은 왕이나 총독이었음이 드러나 토기 생산 중심이자 사람을 바친 흔적이 있는 D자 모양 신전의 터로 보게 되었다. 같은 유적의 두개골을 조사한 연구는 어른 가운데 26퍼센트가 뒤통수에 상처가 있었다고 적는다. 와리 앞 시기의 우아르파 문화에서 이어졌다고 보는 설명이 있다. 와리를 '제국'이라 부르는 글이 많지만 문자 기록이 없어 지배 방식이 잘 알려지지 않았고, 중앙 해안을 직접 다스렸는지 교역으로 이었는지는 논쟁이 있다. 와리는 남쪽의 티와나쿠와 같은 때에 이웃해 있었다. 와리의 지방 유적 가운데 일부가 뒤의 잉카 길 곁에서 나와 비슷한 길망을 썼으리라는 짐작이 있다. 와리의 시작을 600년 무렵으로 잡는 개설서도 있는데, 600년 무렵은 와리가 이웃 계곡으로 퍼지기 시작한 때이기도 하며 그 팽창은 다음 시기의 일이다. 지방 행정 중심지는 건축 양식이 뚜렷하지만 계획이 정연하지는 않았다고 한다. 와리와 앞 시기 북쪽 해안의 모체는 「모체 문화의 와카와 시판의 군주(100~600)」(앞의 사건), 와리와 이웃 티와나쿠는 「티와나쿠의 성장과 티티카카호 남쪽의 도시(110~600)」(앞의 사건)에서 다루었다. 와리의 쇠퇴는 「와리 문화와 티와나쿠의 쇠퇴(900~1000)」(뒤의 사건)에서 다룬다."
  subjects: [wari]
  tags: [politics, society]
  sources: ["William H. Isbell, Gordon F. McEwan (eds.), Huari Administrative Structure: Prehistoric Monumental Architecture and State Government (Dumbarton Oaks, 1991)", "Michael E. Moseley, The Incas and Their Ancestors (Thames & Hudson, 1992)"]

- id: teotihuacan-fall-550
  year: 550
  endYear: 650
  title:
    ko: "테오티우아칸 중심부의 화재와 버려짐(550~650)"
  summary:
    ko: "테오티우아칸의 큰 기념물은 550년 무렵 약탈당하고 불탔다. 예전 연구자들은 침입자가 도시 전체를 약탈하고 불태웠다고 보았지만, 새 증거는 파괴가 죽은 자의 길을 따라 늘어선 공공 건물과 지배층의 집에 몰렸음을 보여 준다. 유적에서는 외부 침입의 흔적이 보이지 않는다고 한다. 불탄 곳이 지배층에 몰렸고 6세기에 인구가 줄기 시작했으므로 안에서 일어난 반란을 드는 학자들이 있다. 이들은 내부 갈등, 끊긴 공물 관계, 깊어진 신분 차이, 지배층 사이의 권력 다툼을 원인으로 든다. 다른 연구자들은 535~536년의 기후 이변, 어쩌면 일로팡고 화산 분출이 부른 가뭄과 굶주림을 든다. 6세기 아이들의 뼈에 영양 부족이 늘었다는 증거가 있고, 이 설들은 서로 배타적이지 않다. 시기에 대해서도 문서마다 갈려, 쇠퇴가 600~700년에 걸쳤다고 보거나 도시 제4기를 650~750년으로 잡는다. 도시가 버려진 해는 자료에 따라 600년·650년·750년 무렵으로 갈린다. 제4기(650~750년)에 이 도시는 메소아메리카의 큰 세력으로서의 지위를 잃었다. 도시는 그 뒤에도 사람이 살았으나 옛 인구를 되찾지 못했다. 촐룰라·소치칼코·카카슈틀라의 미술은 테오티우아칸의 형식을 따르되 마야 지역 등 다른 곳의 모티프를 섞었다. 힘의 빈자리는 촐룰라와 소치칼코, 카카슈틀라가 다투어 메웠고, 소치칼코는 900년에 약탈당해 불탔으며 툴라도 1150년 무렵 비슷한 운명을 겪었다. 같은 6세기 중반 티칼의 패배는 「칼라크물의 티칼 격파(562)」(뒤의 사건)에서 다룬다. 도시의 전성은 「테오티우아칸의 전성과 메소아메리카 교류(300~550)」(앞의 사건)에 있다."
  subjects: [teotihuacan]
  tags: [society, politics]
  sources: ["George L. Cowgill, Ancient Teotihuacan (Cambridge University Press, 2015)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson)"]

- id: calakmul-tikal-562
  year: 562
  endYear: 562
  title:
    ko: "칼라크물의 티칼 격파(562)"
  summary:
    ko: "562년 마야 문명의 큰 맞수였던 칼라크물의 왕이 티칼을 꺾고 그 왕 와크 찬 카위일을 사로잡아 제물로 바쳤다. 이 일은 카라콜에서 나온 훼손된 비문이 전한다. 칼라크물의 왕은 '하늘의 증인'이라는 뜻의 이름으로 불리며, 이때 이긴 쪽은 카라콜도 속국으로 삼았다. 카라콜은 그 앞까지 티칼에 딸린 도시였다. 카라콜 문서는 카라콜의 군주 '물의 군주'가 562년 티칼의 와크 찬 카위일을 이겼다고 적어, 이 승전의 주체를 칼라크물의 왕으로 읽는 서술과 갈린다. 카안(뱀) 왕조는 처음부터 칼라크물에 있었던 것이 아니다. 카안 왕조의 이름이 읽히는 가장 이른 글은 훨씬 북쪽 킨타나로오주의 지반체에서 나오며, 계단에 새긴 글에는 유크눔 체엔 1세라는 왕 이름이 있지만 앞뒤 사정과 연대는 분명하지 않다. 왕조가 7세기에 칼라크물로 옮겼다고 보는 설명도 있어, 562년의 칼라크물 왕을 카안 왕조로 읽는 일 자체가 학설이다. 승전 이후 티칼은 오랜 침체에 들었다. 칼라크물 문서는 이 휴지기를 130년이라 적지만, 티칼 문서는 682년 자사우 찬 카위일 1세가 120년 만에 날짜가 든 기념물을 세운 때를 끝으로 본다. 칼라크물의 중심부는 약 2제곱킬로미터에 건물 1천여 곳이 모였고 높이 45미터가 넘는 2호 건물이 솟았으며, 바깥 20제곱킬로미터 넘는 곳에서 건물 약 6,250곳이 확인되었다. 도시는 약 70제곱킬로미터에 걸쳤고 고전기 후기 정점에 사람이 5만 명쯤 살았다는 어림이 있다. 칼라크물을 중심으로 한 지역 국가는 약 1만 3천 제곱킬로미터에 걸쳤고 시골까지 합한 인구가 약 175만 명이었다는 추산이 있으나 이 값들은 562년이 아니라 뒤 시기의 것이다. 이 맞수의 앞선 사정은 「마야 고전기의 시작: 왕과 석비, 장기력(250~378)」(앞의 사건)에서 다루었다."
  subjects: [maya-civilization]
  tags: [war, politics]
  sources: ["Simon Martin, Nikolai Grube, Chronicle of the Maya Kings and Queens (Thames & Hudson, 2000)", "Michael D. Coe, The Maya (Thames & Hudson)"]
