- id: cenepa-war-1995
  year: 1995
  endYear: 1998
  title:
    ko: "세네파 전쟁과 브라질리아 의정서(1995~1998)"
  summary:
    ko: "에콰도르와 페루는 아마존 상류 코르디예라델콘도르 산악 지대의 국경, 곧 경계가 한 번도 확정되지 않은 약 78 km 구간을 두고 오래 다퉜다. 1941년 전쟁 뒤 1942년 리우 의정서가 국경 조건을 정했고 아르헨티나·브라질·칠레·미국이 보증국이 되었으나, 세네파 강 발원지 일대의 경계 확정은 1940년대 말부터 막혔고 1981년에는 파키샤에서 두 나라가 부딪쳤다. 에콰도르는 1960년 이 의정서가 시행할 수 없다고 선언한 바 있었다. 1995년 에콰도르가 세네파 발원지 일대에 전초 기지를 세우고 페루가 병력을 늘린 가운데, 1월 26일 에콰도르 특수 부대가 페루 전초를 공격하면서 전쟁이 시작되었다. 당시 대통령은 페루가 알베르토 후지모리, 에콰도르가 식스토 두란 바옌이었다. 해발 1,061m의 티위엔사가 싸움의 상징이 되었다. 2월 17일 이타마라티 선언이 휴전을 정하고 군사 감시단(MOMEP)을 만들었으며, 2월 28일 몬테비데오 선언이 이어졌다. 페루군이 에콰도르가 차지했던 진지에서 에콰도르 병력을 밀어냈다. 사망자는 공식 집계로 94명이라는 수치가 있고, 다른 자료는 모두 약 500명으로 추산한다. 이후 보증국 네 나라의 중재로 협상이 이어졌고, 1998년 10월 26일 브라질리아에서 페루 대통령 후지모리와 에콰도르 대통령 자밀 마우아드가 브라질리아 대통령 의정서에 서명해 분쟁을 끝냈다. 에콰도르는 아마존으로 나가는 항로를 낼 출구를 요구해 왔는데, 이 문제도 그 합의에서 다뤄졌다. 티위엔사는 페루 땅으로 인정되었고, 에콰도르는 이곳 약 1 km²에 기념용(군사용이 아닌) 사유지를 얻었으나 주권은 갖지 않는다. 국경 표시는 1999년 5월 13일 효력을 얻었다."
  subjects: [ecuador, peru]
  links: []
  tags: [war, diplomacy]
  sources: ["Beth A. Simmons, Territorial Disputes and Their Resolution: The Case of Ecuador and Peru (United States Institute of Peace, 1999)", "Protocolo de Paz, Amistad y Límites entre Perú y Ecuador (Río de Janeiro, 1942)"]
  places:
    - { name: 티위엔사, at: [-78.2522, -3.4723], year: 1995 }

- id: chavez-1999
  year: 1999
  endYear: 2013
  title:
    ko: "차베스와 볼리바르 혁명(1999~2013)"
  summary:
    ko: "베네수엘라는 카를로스 안드레스 페레스(1989~1993) 뒤 임시 대통령 두 사람(옥타비오 레파헤, 라몬 벨라스케스)을 거쳐 1994년 취임한 라파엘 칼데라(~1999) 때 경제 위기와 기존 정당 정치에 대한 불신을 겪었다. 군인 우고 차베스는 1992년 2월 4일 쿠데타를 시도했다가 실패해 감옥에 갔고, 풀려난 뒤 정치에 나섰다. 1998년 12월 선거에서 56.2%를 얻어 당선했고(투표율 63%), 1999년 2월 2일 취임했다. 12월 헌법 국민 투표가 72%의 찬성으로 새 헌법을 통과시켜 나라 이름이 베네수엘라 볼리바르 공화국이 되었다. 차베스는 이를 시몬 볼리바르의 이상을 따르는 '볼리바르 혁명'이라 불렀다. 2000년 59.8%, 2006년 62.8%, 2012년 55.1%의 득표로 거듭 당선했다. 2002년 4월 11일 대통령궁으로 향한 행진에서 19명이 숨지고 150여 명이 다친 뒤 기업인 페드로 카르모나가 임시 대통령을 자처했으나 하루 남짓 만에 무너졌고 차베스는 14일 복귀했다. 디오스다도 카베요가 몇 시간 동안 대통령직을 맡았다. 2002년 말부터 석유 업계 총파업이 이어졌고, 2004년에는 소환 투표에서 직을 지켰다. 석유 수입이 늘던 2003~2007년에는 식량·주택·의료·교육을 넓히는 '미시온' 사업으로 빈곤과 문맹이 줄고 소득 불평등이 잠시 완화되었으나, 구조 변화가 따르지 않아 유가가 떨어지자 경제가 흔들렸다. 차베스는 암 치료 끝에 2013년 3월 5일 카라카스에서 58세로 숨졌고 니콜라스 마두로가 뒤를 이었다. 마두로 정부 아래에서는 경제 위기가 깊어졌고 2019년 1월 후안 과이도가 임시 대통령을 자처하는 정치 대립이 있었다."
  subjects: [venezuela]
  links: []
  tags: [politics, economy]
  sources: ["Richard Gott, Hugo Chávez and the Bolivarian Revolution (Verso, 2005)", "Javier Corrales and Michael Penfold, Dragon in the Tropics: Hugo Chávez and the Political Economy of Revolution in Venezuela (Brookings Institution Press, 2011)"]

- id: september-11-2001
  year: 2001
  endYear: 2001
  title:
    ko: "9·11 테러와 미국(2001)"
  summary:
    ko: "2001년 9월 11일 아침 오사마 빈라덴이 이끄는 알카에다의 조직원 19명이 여객기 네 대를 납치했다. 아메리칸 항공 11편과 유나이티드 항공 175편은 뉴욕 세계 무역 센터의 쌍둥이 빌딩에 차례로 부딪쳤고, 아메리칸 항공 77편은 워싱턴 근교 버지니아 주 알링턴의 국방부 청사(펜타곤)에 부딪쳤다. 두 빌딩은 그날 안에 모두 무너져 내렸고, 구조에 나선 소방관과 경찰도 많이 숨졌다. 미국의 항공 교통은 며칠 동안 멈추었다. 유나이티드 항공 93편은 승객들이 맞서 싸운 끝에 펜실베이니아 주 섕크스빌 근처 들판에 추락했다. 이 공격으로 희생자 2,977명(납치범 19명을 더하면 2,996명)이 숨졌고, 부상자는 6,000명에서 2만 5,000명 이상으로 추산되며, 이후 유독 먼지 등으로 인한 건강 문제로 숨진 사람이 9,000명을 넘는다는 추산도 있다. 조지 W. 부시 대통령은 9월 20일 의회 연설에서 테러와의 전쟁을 선언했다. 북대서양 조약 기구는 조약 5조를 처음으로 발동해 동맹국에 알카에다에 맞서 싸울 것을 요청했다. 10월 26일 미국 애국법이 만들어져 수사와 감시 권한이 넓어졌고, 2002년 국토 안보부가 세워져 여러 기관이 한 부서로 묶였다. 알카에다가 근거지를 둔 아프가니스탄에 대한 공격은 10월에 시작되었다(「미국의 아프가니스탄 전쟁과 이슬람 공화국(2001~2021)」(뒤의 사건)). 빈라덴은 2011년 5월 미국 특수 부대의 작전으로 사살되었다. 이 사건은 미국이 본토가 직접 공격받은 가장 큰 사건으로, 안보 정책과 대외 정책, 이민·공항 보안, 시민 자유 논쟁에 오래 영향을 미쳤다. 사건 뒤 이슬람교도에 대한 증오 범죄가 늘었다는 보고도 많다."
  subjects: [usa]
  links: []
  tags: [war, politics]
  sources: ["National Commission on Terrorist Attacks Upon the United States, The 9/11 Commission Report: Final Report of the National Commission on Terrorist Attacks Upon the United States (W. W. Norton, 2004)", "Lawrence Wright, The Looming Tower: Al-Qaeda and the Road to 9/11 (Alfred A. Knopf, 2006)"]
