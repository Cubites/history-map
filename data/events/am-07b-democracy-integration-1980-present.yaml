# 아메리카 사건 1묶음 07b: 민주화와 통합의 시대 — 퀘벡 주권 투표·카리브 리워드 제도의 독립·포클랜드 전쟁·채무 위기·민정 이양·메르코수르와 북미 자유 무역 협정·누나부트·세네파 전쟁·차베스·9·11·아이티 지진·콜롬비아 평화 협정·쿠바–미국 국교 정상화 (1980 ~ 2026년 기준)
# 범위: 퀘벡 두 차례 주권 투표, 앤티가 바부다·세인트키츠 네비스의 독립, 캐나다 헌법 이관, 포클랜드 전쟁, 라틴아메리카 채무 위기, 미국의 그레나다·파나마 침공, 브라질·칠레의 민정 이양,
#   메르코수르, 북미 자유 무역 협정, 누나부트 준주의 출범, 사파티스타 봉기, 에콰도르–페루 세네파 전쟁, 차베스 시기의 베네수엘라, 9·11 테러, 아이티 지진, 콜롬비아 평화 협정, 쿠바–미국 국교 정상화.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다. 진행 중인 일은 확인한 마지막 사실까지만 적고 시점('2026년 기준')을 밝혔으며 내다보는 말을 쓰지 않았다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 교과서의 굳은 표기를 따랐다. 이름만 바뀐 나라는 그때 이름으로 쓰고 항목 이름을 한 번 함께 적었다.
#   사망자·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다.
# 지도 결정과의 관계: 포클랜드 제도의 아르헨티나 점령(1982-04~06)은 몇 달 동안의 일이라 글로만 적었다. 앵귈라는 세인트키츠 네비스 땅으로 그리지 않고 글에서 갈라져 나간 일만 밝혔다. 남부 연합 등 이 시기 앞의 결정은 닿지 않는다.
# 한국사와 닿는 점: 없음. 한국사 파일의 글은 고치지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서·공식 문서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(석유 파동과 신자유주의·미국의 아프가니스탄 전쟁과 이슬람 공화국).
