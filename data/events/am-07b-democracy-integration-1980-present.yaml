    - { name: 레오간, at: [-72.63, 18.51], year: 2010 }

- id: colombia-peace-2012
  year: 2012
  endYear: 2016
  title:
    ko: "콜롬비아 정부와 FARC의 평화 협정(2012~2016)"
  summary:
    ko: "콜롬비아에서는 1948년 보고타소 이후 '폭력 시대'라 불리는 정치 폭력이 이어졌고, 1964년 콜롬비아 무장 혁명군(FARC)과 민족 해방군(ELN)이 만들어지면서 무장 투쟁이 본격화되었다. 이 분쟁으로 숨진 사람은 국가 기억 센터의 2013년 보고서가 약 22만 명(1958~2012년)으로 추산한다. 2012년 10월 18일 후안 마누엘 산토스 정부와 FARC의 회담이 노르웨이 오슬로에서 공식으로 시작되었고, 11월부터 쿠바 아바나에서 이어졌다. 쿠바와 노르웨이가 보증국을 맡았다(쿠바 혁명은 「쿠바 혁명과 피그스만 침공(1953~1961)」(앞의 사건)). 협상 의제는 농촌 개발, 정치 참여, 무장 해제와 전투 종결, 마약 문제, 피해자, 합의 이행과 검증의 여섯 가지였고, 산토스는 앞서 우리베 정부의 국방 장관을 지낸 사람이다. 4년 가까운 협상 끝에 2016년 합의문이 나왔다. 산토스 정부는 합의를 국민 투표에 부쳤고, 10월 2일 투표에서 반대 50.2%, 찬성 49.8%로 부결되었다. 투표율은 37.4%였다. 알바로 우리베 전 대통령을 비롯한 반대 쪽은 FARC 지도부의 처벌이 가볍고 정당을 만들 수 있게 한 점을 문제 삼았다. 정부와 FARC는 합의문을 고쳐 11월 24일 다시 서명했고, 이번에는 국민 투표를 거치지 않고 의회 비준을 받았다. 상원은 11월 29일 75 대 0, 하원은 이튿날 130 대 0으로 승인했다. 유엔 감시 아래 FARC가 무기를 내놓는 절차는 약 180일에 걸쳐 이루어졌고, FARC는 뒤에 정당으로 바뀌었다. 산토스는 2016년 노벨 평화상을 받았다. 다른 무장 집단과 마약 거래를 둘러싼 폭력은 합의 뒤에도 이어졌다."
  subjects: [colombia, cuba]
  links: []
  tags: [politics, diplomacy]
  sources: ["Acuerdo final para la terminación del conflicto y la construcción de una paz estable y duradera (Gobierno de Colombia y FARC-EP, 24 de noviembre de 2016)", "Centro Nacional de Memoria Histórica, ¡Basta ya! Colombia: memorias de guerra y dignidad (2013)"]

- id: cuba-us-thaw-2014
  year: 2014
  endYear: 2016
  title:
    ko: "쿠바–미국 국교 정상화(2014~2016)"
  summary:
    ko: "쿠바 혁명 뒤 미국의 금수 조치는 1962년 존 F. 케네디 대통령이 무역 금지를 넓히며 굳어졌다(「쿠바 혁명과 피그스만 침공(1953~1961)」(앞의 사건)). 이 금수 조치는 이후 형태를 바꾸며 이어졌고, 1996년 법으로 굳어 의회 동의 없이 풀기 어려웠다. 쿠바는 1959년부터 관타나모만 미국 해군 기지를 불법이라 보았는데, 이 기지는 플랫 수정안에 따라 1903년 임대로 생겼다(「플랫 수정안과 쿠바 공화국의 출범(1901~1903)」(앞의 사건)). 2008년 라울 카스트로가 형 피델의 뒤를 이었다. 교황 프란치스코가 중재하고 캐나다와 바티칸에서 열린 비밀 협상 끝에, 2014년 12월 17일 버락 오바마 대통령과 라울 카스트로 의장이 관계 정상화를 발표했다. 쿠바는 2009년 체포되어 수감 중이던 알란 그로스와 미국 정보 기관에서 일한 쿠바인을 풀어 주었고, 미국은 쿠바 5인 가운데 남은 세 명을 석방했다. 2015년 5월 미국은 쿠바를 테러 지원국 명단에서 뺐고, 7월 20일 외교 관계가 회복되어 워싱턴과 아바나에 대사관이 문을 열었다. 2016년에는 정기 직항 항공편도 다시 열렸다. 3월 오바마가 아바나를 찾아 88년 만에 쿠바를 방문한 현직 미국 대통령이 되었다. 그러나 도널드 트럼프 정부가 2017년 11월 사업·여행 제한을 되살렸고 2019년 6월 여행 제한을 새로 발표했다. 2021년 1월 12일 쿠바는 다시 테러 지원국 명단에 올랐고, 조 바이든 정부는 임기가 끝나기 엿새 전인 2025년 1월 14일 쿠바를 명단에서 빼겠다고 밝혔으나 1월 20일 도널드 트럼프 정부가 이를 되돌렸다. 금수 조치 자체는 이 과정에서 풀리지 않았다."
  subjects: [cuba, usa]
  links: []
  tags: [diplomacy, politics]
  sources: ["William M. LeoGrande and Peter Kornbluh, Back Channel to Cuba: The Hidden History of Negotiations between Washington and Havana (University of North Carolina Press, 2014)", "Louis A. Pérez Jr., Cuba: Between Reform and Revolution (5th ed., Oxford University Press, 2015)"]
