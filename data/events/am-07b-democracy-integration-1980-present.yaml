- id: quebec-referendum-1980
  year: 1980
  endYear: 1995
  title:
    ko: "퀘벡 주권 투표(1980~1995)"
  summary:
    ko: "1960년대 '조용한 혁명' 이후 퀘벡에서는 교회가 맡던 교육·복지를 주 정부가 넘겨받아 복지 국가를 세웠고, 프랑스어를 쓰는 다수가 경제의 중심에 서야 한다는 요구가 커지면서 정치가 연방 유지파와 주권파로 갈렸다. 1976년 선거에서 르네 레베크의 퀘벡당이 집권했고, 1980년 5월 20일 주 정부는 캐나다와 새 합의를 협상할 권한을 달라는 질문으로 주민 투표를 부쳤다. 투표율은 85.6%(등록 유권자 4,367,584명)였고 반대 59.56%(2,187,991표), 찬성 40.44%(1,485,852표)로 부결되었다. 레베크가 찬성 쪽을, 퀘벡 자유당 대표 클로드 라이언이 반대 쪽을 이끌었고, 연방 총리 피에르 트뤼도는 투표 엿새 전 집회에서 반대표가 연방 제도의 쇄신과 헌법 개정을 뜻한다고 말했다. 이 말이 어떤 약속이었는지는 지금도 해석이 갈린다. 그 뒤의 헌법 개정은 「캐나다 헌법 이관과 권리와 자유 헌장(1982)」(뒤의 사건)에서 다룬다. 두 번째 투표는 1995년 10월 30일에 열렸다. 질문은 캐나다에 경제·정치 동반자 관계를 제안한 뒤 퀘벡이 주권국이 되어야 하느냐는 것이었고, 투표율은 93.52%(등록 유권자 5,087,009명)로 퀘벡 역사상 가장 높았다. 결과는 반대 50.58%(2,362,648표), 찬성 49.42%(2,308,360표)로 54,288표 차이였다. 자크 파리조 주 총리가 찬성 위원회를 이끌었고, 연방 의회의 블록 퀘벡 대표 뤼시앵 부샤르가 투표 3주 전 협상 대표로 임명되었으며, 총리 장 크레티앵(트뤼도 뒤 존 터너·브라이언 멀로니·킴 캠벨을 거쳐 1993년 11월 취임)과 퀘벡 자유당 대표 대니얼 존슨 2세가 반대 쪽에 섰다. 파리조는 다음 날 총리 직에서 물러나겠다고 밝혔다. 연방 정부의 질의를 받은 캐나다 대법원은 퀘벡이 일방적으로 갈라설 수 없다고 판단했다."
  subjects: [canada]
  links: []
  tags: [politics, society]
  sources: ["Kenneth McRoberts, Quebec: Social Change and Political Crisis (3rd ed., McClelland & Stewart, 1988)", "Peter H. Russell, Constitutional Odyssey: Can Canadians Become a Sovereign People? (3rd ed., University of Toronto Press, 2004)"]

- id: leeward-independence-1981
  year: 1981
  endYear: 1983
  title:
    ko: "앤티가 바부다와 세인트키츠 네비스의 독립(1981~1983)"
  summary:
    ko: "리워드 제도의 앤티가와 세인트키츠는 17세기부터 영국이 다스린 식민지였고, 1958년부터 1962년까지 서인도 연방에 들었다(「서인도 연방과 트리니다드 토바고·바베이도스의 독립(1958~1966)」(앞의 사건)). 1967년 2월 27일 두 식민지는 서인도 연합주가 되었다(「서인도 연합주와 그레나다·도미니카 연방·세인트루시아·세인트빈센트 그레나딘의 독립(1967~1979)」(앞의 사건)). 앤티가에서는 비어 버드의 노동당이 1967~1971년과 1976년부터 독립 때까지 자치 정부를 이끌었고, 인구가 적은 바부다 섬은 1976년부터 바부다 평의회를 두었다. 1981년 11월 1일 앤티가 바부다가 영연방 왕국으로 독립했다. 헌법은 이날 채택되어 영국 여왕을 국가 원수로 하고 윌프레드 제이콥스 경을 초대 총독, 버드를 초대 총리로 했으며, 바부다 평의회를 헌법에 명시하고 바부다 지방 정부법을 평의회 동의 없이는 고칠 수 없게 해 두 섬의 관계를 분명히 했다. 바부다의 분리 요구는 그 뒤에도 이어졌다. 세인트키츠 쪽은 1882년 네비스·앵귈라와 한 식민지로 묶였고, 1940년대 로버트 브래드쇼가 세인트키츠 네비스 앵귈라 노동당을 세워 1966~1978년 자치 정부를 이끌었다. 앵귈라는 1967년 연합주에서 떨어져 나가 1980년 영국 속령이 되었다. 브래드쇼 뒤 두 사람을 거쳐 1980년 케네디 시먼즈의 인민 행동 운동이 집권해 총리가 되었고, 1983년 9월 19일 세인트키츠 네비스가 독립해 시먼즈가 초대 총리가 되었다. 헌법은 네비스에 따로 총리와 의회를 주었고, 주민 투표에서 3분의 2가 찬성하면 일방적으로 갈라설 권리를 인정했다. 1998년 투표에서는 약 62%가 찬성했으나 3분의 2에 못 미쳤다."
  subjects: [antigua-and-barbuda, saint-kitts-and-nevis, uk]
  links:
    - { from: uk, to: antigua-and-barbuda, note: "독립을 승인하고 주권을 넘김 (1981-11-01)" }
    - { from: uk, to: saint-kitts-and-nevis, note: "독립을 승인하고 주권을 넘김 (1983-09-19)" }
  tags: [politics, diplomacy]
  sources: ["Paget Henry, Peripheral Capitalism and Underdevelopment in Antigua (Transaction Books, 1985)", "Vincent K. Hubbard, A History of St. Kitts: The Sweet Trade (Macmillan Caribbean, 2002)"]

- id: canada-constitution-1982
  year: 1982
  endYear: 1982
  title:
    ko: "캐나다 헌법 이관과 권리와 자유 헌장(1982)"
  summary:
    ko: "1867년의 헌법법 이래 캐나다의 헌법은 영국 의회가 만든 법이었고, 고치려면 영국 의회를 거쳐야 했다. 피에르 트뤼도 총리는 이 헌법을 캐나다로 가져오고 시민의 권리를 적은 헌장을 넣으려 했으며, 1980년 퀘벡 투표에서 주권안이 부결된 뒤(「퀘벡 주권 투표(1980~1995)」(앞의 사건)) 개정을 밀어붙였다. 연방 정부가 주 총리들의 동의 없이 영국에 요청하려 하자 여러 주가 소송을 냈고, 1981년 9월 28일 대법원은 연방이 법적으로는 단독으로 나아갈 수 있으나(7대 2), 헌법 관행상 상당수 주의 동의가 필요하다(6대 3)고 판단했다. 11월 4일 밤 오타와 회의장 바깥에서 법무 장관 장 크레티앵이 서스캐처원·온타리오의 법무 장관과 타협안을 짰다. 이 이른바 '부엌 합의'에는 헌장의 일부 조항을 주 의회가 한시적으로 적용하지 않을 수 있는 예외 조항과 개정 공식이 들어 있었다. 퀘벡 총리 르네 레베크는 합의를 거부하고 회의장을 떠났고, 퀘벡은 11월 25일 거부권을 선언했으나 1982년 12월 6일 대법원은 퀘벡에 그런 거부권이 없다고 판단했다. 영국 의회가 캐나다법을 통과시켜 1982년 3월 29일 엘리자베스 2세가 재가했고, 4월 17일 오타와에서 여왕이 「1982년 헌법법」을 선포했다. 이로써 헌법을 고칠 권한이 캐나다에 넘어왔고, 헌법법에 권리와 자유 헌장이 담겼다. 헌장은 기본적 자유, 이동의 자유, 법적 권리, 평등권, 영어와 프랑스어의 공용어 지위, 소수 언어 교육권을 보장했다. 트뤼도는 1968년부터 총리였고 1979년 6월~1980년 3월 조 클라크 내각을 사이에 두고 다시 총리가 되어 이 개헌을 이끌었다. 퀘벡 정부는 이 헌법에 서명하지 않았다. 퀘벡을 합의에 끌어들이려 한 1987년 미치 호수 합의는 필요한 승인을 모두 얻지 못해 무산되었다."
  subjects: [canada, uk]
  links:
    - { from: uk, to: canada, note: "헌법 개정권을 넘김 (1982-04-17)" }
  tags: [politics, society]
  sources: ["Peter H. Russell, Constitutional Odyssey: Can Canadians Become a Sovereign People? (3rd ed., University of Toronto Press, 2004)", "Kenneth McRoberts, Quebec: Social Change and Political Crisis (3rd ed., McClelland & Stewart, 1988)"]

- id: falklands-war-1982
  year: 1982
  endYear: 1982
  title:
    ko: "포클랜드 전쟁(1982)"
  summary:
    ko: "포클랜드 제도(스페인어 이름 말비나스)는 1833년 영국이 다시 장악한 뒤 영국이 다스렸으나(「베르네의 정착지와 영국의 포클랜드 재장악(1829~1833)」(앞의 사건)) 아르헨티나는 이 섬이 자기 땅이라는 주장을 이어 갔다. 경제 위기와 인권 탄압으로 흔들리던 아르헨티나 군사 정권은 레오폴도 갈티에리 장군이 군정의 대통령이던 1982년 4월 2일 섬에 상륙해 점령했고, 다음 날 사우스조지아 섬에도 상륙했다. 군사 행동은 해군 총사령관 호르헤 아나야 제독이 가장 앞장서 추진했다. 유엔 안전 보장 이사회는 4월 3일 결의 502호(찬성 10, 반대 1, 기권 4)로 즉각 철수를 요구했다. 영국의 마거릿 대처 총리는 4월 6일 전시 내각을 꾸려 기동 부대를 보냈다. 5월 2일 영국 잠수함이 순양함 헤네랄 벨그라노호를 격침해 승무원 321명과 민간인 2명이 숨졌고, 5월 4일에는 영국 구축함 셰필드호가 엑조세 미사일에 맞아 10일 가라앉았다. 영국군은 5월 21일 산카를로스 만에 상륙해 6월 14일 스탠리에서 아르헨티나군의 항복을 받았다. 74일의 싸움으로 아르헨티나군 649명과 영국군 255명이 숨졌고 섬 주민 3명이 포격에 숨졌으며, 아르헨티나군 11,313명이 포로가 되었다. 부상자는 아르헨티나군 1,657명, 영국군 775명이었다. 패전으로 갈티에리는 물러났고 레이날도 비뇨네 장군의 군정이 이어지다가, 1983년 10월 선거를 거쳐 12월 라울 알폰신이 대통령에 취임해 민정이 돌아왔다. 대처 정부는 승전으로 힘을 얻었다(「석유 파동과 신자유주의」(앞의 사건)). 섬의 주권을 둘러싼 두 나라의 다툼은 지금도 이어지고 있다."
