- id: mercosur-1991
  year: 1991
  endYear: 1995
  title:
    ko: "메르코수르(1991~1995)"
  summary:
    ko: "아르헨티나와 브라질은 군사 정권이 물러난 뒤 오랜 경쟁을 접고 가까워졌다. 1985년 말 브라질 대통령 주제 사르네이와 아르헨티나 대통령 라울 알폰신이 이과수 선언에 서명해 경제 통합의 길을 열었다. 1991년 3월 26일 아르헨티나·브라질·파라과이·우루과이 네 나라가 파라과이 수도 아순시온에서 조약을 맺어 남쪽 공동 시장, 곧 메르코수르를 만들었다. 이 조약은 1988년 아르헨티나와 브라질이 맺은 통합·협력·개발 조약 위에 섰다. 조약은 나라 사이 상품·서비스·생산 요소의 자유로운 이동, 공동 대외 관세, 공동 무역 정책을 목표로 했고 1994년 12월 31일까지의 이행기 안에 공동 시장을 세운다고 정했다. 창설 때 대통령은 브라질이 페르난두 콜로르, 아르헨티나가 카를로스 메넴, 우루과이가 루이스 알베르토 라카예, 파라과이가 안드레스 로드리게스였다. 1994년 12월 16일 오루프레투 의정서가 기구의 짜임을 정했고, 1995년 1월 1일 공동 대외 관세를 두는 관세 동맹이 효력을 얻었다. 베네수엘라는 2004년 7월 8일 준회원이 되었고 2012년 7월 31일 정회원이 되었으나 2016년 12월 1일부터 자격이 정지되었다. 파라과이는 2012년 6월 29일 페르난도 루고 대통령이 물러난 일로 회원 자격이 정지되었고 2013년 4월 대통령 선거까지 정지가 이어지도록 정해졌다. 볼리비아는 2012년 12월 7일 가입 의정서에 서명했고 2024년 7월 8일 정회원이 되었다. 구매력 평가 기준 2024년 이 공동체의 생산은 약 6조 6,800억 달러, 인구는 약 2억 9,500만 명으로 추산된다. 같은 시기 북쪽에서는 미국·캐나다·멕시코가 다른 길로 통합을 시도했다(「북미 자유 무역 협정(1992~1994)」(뒤의 사건))."
  subjects: [brazil, argentina, uruguay, paraguay]
  links: []
  tags: [economy, diplomacy]
  sources: ["Tratado de Asunción para la constitución de un Mercado Común entre la República Argentina, la República Federativa del Brasil, la República del Paraguay y la República Oriental del Uruguay (1991)", "Protocolo adicional al Tratado de Asunción sobre la estructura institucional del MERCOSUR — Protocolo de Ouro Preto (1994)"]

- id: nafta-1992
  year: 1992
  endYear: 1994
  title:
    ko: "북미 자유 무역 협정(1992~1994)"
  summary:
    ko: "미국과 캐나다는 1988년 자유 무역 협정을 맺었고(1989년 발효), 멕시코 대통령 카를로스 살리나스 데 고르타리가 미국에 비슷한 협정을 제안하면서 캐나다가 협상에 합류했다. 로널드 레이건이 1980년 선거 운동에서 내놓은 북미 시장 구상이 뿌리라고 한다. 1992년 12월 17일 조지 H. W. 부시 대통령, 브라이언 멀로니 총리, 살리나스가 협정에 서명했다. 이어 미국 대통령이 된 빌 클린턴이 노동·환경 부속 협정을 더했고, 미국 하원은 1993년 11월 17일, 상원은 20일 이행법을 통과시켰으며 멕시코 상원은 22일 협정을 승인했다. 클린턴은 12월 8일 이행법에 서명했다. 캐나다와 멕시코 모두 미국이 가장 큰 무역 상대였고 협정은 세 나라를 하나의 무역권으로 묶었다. 캐나다에서는 1993년 11월 총리가 된 장 크레티앵이 협정을 이어받았다. 협정은 1994년 1월 1일 발효했다. 멕시코 수출품의 절반이 넘는 품목의 대미 관세가 곧바로 없어졌고, 나머지 미국–멕시코 관세는 10년 안에, 일부 농산물은 15년에 걸쳐 없애기로 했다. 11장은 투자자가 정부를 상대로 보상을 요구할 수 있게 했고, 19장은 반덤핑·상계 관세 결정을 양국 패널이 다시 보게 했다. 발효일 멕시코 치아파스에서는 원주민 무장 조직이 봉기했다(「사파티스타 봉기(1994)」(뒤의 사건)). 대부분의 경제 분석은 협정이 전체로는 이로웠으나 무역에 노출된 업종의 일부 노동자에게는 해로웠다고 본다. 일자리와 환경, 멕시코 농민에 미친 영향은 지금도 논쟁이 이어진다. 2018년 9월 세 나라는 협정을 대신할 미국·멕시코·캐나다 협정(USMCA)에 합의했고, 이 협정은 2020년 7월 1일 효력을 얻었다."
  subjects: [usa, canada, mexico]
  links: []
  tags: [economy, diplomacy]
  sources: ["Gary Clyde Hufbauer and Jeffrey J. Schott, NAFTA Revisited: Achievements and Challenges (Institute for International Economics, 2005)", "Maxwell A. Cameron and Brian W. Tomlin, The Making of NAFTA: How the Deal Was Done (Cornell University Press, 2000)"]

- id: nunavut-1993
  year: 1993
  endYear: 1999
  title:
    ko: "누나부트 준주의 탄생(1993~1999)"
  summary:
    ko: "캐나다 북극의 동쪽과 중부에는 이누이트가 오래 살아 왔고, 이 땅은 북서 준주에 속해 있었다. 누나부트는 이누이트어로 우리 땅을 뜻한다. 이누이트는 북서 준주를 둘로 나눠 자신들이 다수인 준주를 따로 세우고 땅에 대한 권리를 인정받으려 했다. 1982년 4월 14일 북서 준주 전체에서 나눔에 대한 주민 투표가 열려 과반이 찬성했다. 이누이트 협상 단체인 누나부트 퉁가비크 연맹(Tunngavik Federation of Nunavut)이 연방 정부와 협상해 1992년 9월 토지 청구 협정을 마무리했고, 이 협정은 주민 투표에서 85%에 가까운 찬성으로 승인되었다. 협정은 이누이트에게 약 35만 km²의 땅 소유권과 보상금을 주었다. 1993년 7월 9일 연방 의회가 누나부트법과 누나부트 토지 청구 협정법을 통과시켜 협정을 이행하고 새 준주를 만들 길을 열었다. 이어 준주 의회와 정부를 세우는 준비가 6년 가까이 이어졌다. 준주 의회는 정당 없이 합의제로 운영되고, 공용어에 이누이트어(이누크티투트어와 이누이나크툰어)가 들어간다. 1995년 수도를 정하는 주민 투표에서 바핀섬의 이칼루이트가 뽑혔다. 1999년 첫 선거에서 폴 오칼릭이 첫 준주 총리(프리미어)가 되었고, 4월 1일 누나부트 준주가 정식으로 출범했다. 넓이는 약 209만 km²로 캐나다 땅의 5분의 1이 넘고, 2021년 인구 조사에서 인구는 36,858명(2016년 35,944명)이며 그 가운데 이누이트가 84.3%(30,865명)다. 준주 정부는 공공 정부의 형태이면서 이누이트가 다수를 이루어, 이누이트의 언어와 지식을 정부 운영에 반영하는 길을 열었다는 평가를 받는다. 캐나다 안 원주민이 토지 청구 협정으로 자치 정부에 가까운 틀을 얻은 대표적 사례로 꼽힌다."
  subjects: [canada]
  links: []
  tags: [politics, society]
  sources: ["Jens Dahl, Jack Hicks and Peter Jull (eds.), Nunavut: Inuit Regain Control of Their Lands and Their Lives (International Work Group for Indigenous Affairs, 2000)", "Agreement Between the Inuit of the Nunavut Settlement Area and Her Majesty the Queen in Right of Canada (1993)"]

- id: zapatista-1994
  year: 1994
  endYear: 1994
  title:
    ko: "사파티스타 봉기(1994)"
  summary:
    ko: "멕시코 남부 치아파스 주는 마야계 원주민 농민이 많이 살고 토지와 가난 문제가 쌓인 곳이었다. 1983년 11월 17일 사파티스타 민족 해방군(EZLN)이 세워졌고, 1992년 헌법 개정으로 농민 공유지 분배의 길이 닫힌 일 등이 불만을 키웠다. 1994년 1월 1일 북미 자유 무역 협정이 발효한 날(「북미 자유 무역 협정(1992~1994)」(앞의 사건)) 약 3,000명의 무장 대원이 치아파스 고지의 여러 도시와 마을(자료에 따라 4~7곳)을 점령했고, 연방군이 반격에 나서자 숲으로 물러났다. 이들은 첫 선언(라칸도나 정글 선언)에서 정부에 선전 포고했고, 부사령관 마르코스가 대변인으로 나섰고 2014년 5월 그 자리에서 물러난다고 밝혔다. 이들은 중심지를 카라콜이라 불렀다. 1월 12일(봉기 12일째) 휴전이 이루어졌고, 사무엘 루이스 주교와 마누엘 카마초 솔리스가 중재한 대화가 이어졌다. 당시 대통령은 카를로스 살리나스였고 1994년 12월 에르네스토 세디요가 취임했는데, 세디요는 1995년 2월 군사 공세를 벌였다가 거두고 외교 해법으로 돌아섰다. 1996년 2월 16일 원주민 권리와 문화에 관한 산안드레스 협정이 서명되었으나 정부가 법으로 완전히 이행하지 않아 갈등이 이어졌다. 1994년 12월에는 페소화 위기가 겹쳤다. 봉기 소식은 언론과 인터넷을 타고 국제적으로 퍼져 시민 단체의 연대를 불렀고, 2001년 3월 사파티스타 대표단이 멕시코시티까지 행진해 의회에서 발언했다. 사파티스타 운동은 '모두를 위한 모든 것, 우리에게는 아무것도'라는 구호와 원주민 자치, 반신자유주의를 내세우며 정당이 아닌 방식으로 지역 자치 공동체를 꾸렸다. 2023년 11월 반란 사파티스타 자치 시를 지방 자치 정부로 다시 짰다."
  subjects: [mexico]
  links: []
  tags: [politics, society]
  sources: ["Neil Harvey, The Chiapas Rebellion: The Struggle for Land and Democracy (Duke University Press, 1998)", "Subcomandante Marcos, Ya Basta! Ten Years of the Zapatista Uprising (AK Press, 2005)"]
