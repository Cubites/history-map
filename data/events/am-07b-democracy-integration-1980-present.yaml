- id: haiti-earthquake-2010
  year: 2010
  endYear: 2010
  title:
    ko: "아이티 지진(2010)"
  summary:
    ko: "1804년 독립한 아이티(「베르티에르 전투와 아이티의 독립(1803~1806)」(앞의 사건))는 2004년부터 유엔 아이티 안정화 임무단(MINUSTAH)의 평화 유지군이 머물렀고, 2010년에는 르네 프레발이 두 번째 임기(2006~2011) 중이었다. 2010년 1월 12일 현지 시각 오후 4시 53분 규모 7.0의 지진이 일어났다. 진앙은 수도 포르토프랭스에서 서남서쪽으로 약 25 km 떨어진 레오간 근처이고 깊이는 13 km였다. 엔리키요–플랜테인 가든 단층계에 이어진 숨은 역단층에서 일어난 얕은 지진이라 흔들림이 컸다. 사망자 추산은 약 10만~16만 명이고 아이티 정부는 최대 31만 6천 명이라고 발표했으나, 이 숫자는 논란이 있다. 공개되지 않은 미국 국제 개발처의 초안 보고서는 4만 6천~8만 5천 명이라고 추산했다. 약 300만 명이 피해를 입었고, 정부 추산으로 주택 25만 채와 상업 건물 3만 채가 무너지거나 크게 부서졌다. 대통령궁, 국회, 포르토프랭스 대성당과 유엔 임무단 본부가 무너졌고 임무단 대표 헤디 아나비를 포함해 유엔 직원이 85명 이상 숨졌다. 1월 24일까지 규모 4.5 이상 여진이 52번 넘게 이어졌고, 1월 20일 가장 큰 5.9 여진이 있었다. 2012년 1월 미국 국제 개발처는 약 150만 명이 집을 잃었고 그 가운데 55만 명이 아직 영구 주거지가 없다고 보고했다. 여러 나라가 구조대와 기금을 보냈고 '희망을 아이티에' 모금 방송이 5,800만 달러를 모았으나, 공항의 혼잡과 미국의 항공 통제 문제로 구호가 늦어졌다. 2010년 10월에는 콜레라가 퍼졌다. 프레발 뒤 미셸 마르텔리(2011~2016)와 임시 대통령 조슬렐름 프리베르(2016년 2월~2017년 2월)를 거쳐 2017년 2월 조브넬 모이즈가 취임했고, 모이즈는 2021년 7월 7일 암살되었다."
  subjects: [haiti]
  links: []
  tags: [society, politics]
  sources: ["Jonathan M. Katz, The Big Truck That Went By: How the World Came to Save Haiti and Left Behind a Disaster (Palgrave Macmillan, 2013)", "Alex Dupuy, Haiti: From Revolutionary Slaves to Powerless Citizens: Essays on the Politics and Economics of Underdevelopment, 1804–2013 (Routledge, 2014)"]
