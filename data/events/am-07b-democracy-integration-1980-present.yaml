- id: brazil-democracy-1984
  year: 1984
  endYear: 1988
  title:
    ko: "직선제 운동과 브라질 민정 이양(1984~1988)"
  summary:
    ko: "브라질은 1964년 군부가 쿠데타로 정권을 잡은 뒤 군인 대통령이 이어지는 체제였다(「브라질 군사 쿠데타와 군정(1964~1974)」(앞의 사건)). 1979년 3월 15일 취임한 주앙 피게이레두 때 경제가 나빠져 1983년 물가 상승률이 239%에 이르렀고 노조와 시민의 불만이 커졌다. 1983년 3월 31일 페르남부쿠 주 아브레우 이 리마에서 첫 집회가 열린 뒤 대통령 직선제를 요구하는 '지금 직선을(디레타스 자)' 운동이 번졌고, 1984년 4월 16일 상파울루 아냥가바우 계곡에는 150만 명으로 추산되는 사람이 모였다. 그러나 4월 25일 직선제 개헌안(단테 지 올리베이라 수정안)은 찬성 298표 대 반대 65표였고 여당 의원 약 110명이 표결에 불참·기권해 개헌에 필요한 3분의 2에 못 미쳐 부결되었다. 대통령은 선거인단이 뽑는 방식으로 남았고, 1985년 1월 야당의 탄크레두 네베스가 선거인단 투표에서 군부 쪽 후보 파울루 말루피를 이겼다. 그러나 네베스는 취임식 전날 쓰러져 4월 21일 숨졌고, 부통령 당선자 주제 사르네이가 3월 15일부터 직무를 대행하다 대통령이 되어 1990년 3월 15일까지 재임했다. 사르네이는 1986년 물가 동결책(크루자두 계획)을 폈으나 물가를 잡지 못했다. 1986년 선거로 뽑힌 의원들이 1987년부터 새 헌법을 만들었고, 1988년 10월 5일 공포된 헌법은 1989년에 대통령 직선을 치르도록 정했다. 이 선거에서 페르난두 콜로르 지 멜루가 당선해 1990년 3월 15일 취임했다. 이로써 군부에서 민간으로 정권이 돌아왔다. 콜로르는 1992년 12월 29일 사임했고 이타마르 프랑쿠가 이어받았다."
  subjects: [brazil]
  links: []
  tags: [politics, society]
  sources: ["Thomas E. Skidmore, The Politics of Military Rule in Brazil, 1964–85 (Oxford University Press, 1988)", "Alfred Stepan (ed.), Democratizing Brazil: Problems of Transition and Consolidation (Oxford University Press, 1989)"]

- id: chile-democracy-1988
  year: 1988
  endYear: 1990
  title:
    ko: "국민 투표와 칠레의 민주화(1988~1990)"
  summary:
    ko: "1973년 쿠데타로 정권을 잡은 아우구스토 피노체트의 군사 정권은(「아옌데의 인민 연합과 1973년 칠레 쿠데타(1970~1973)」(앞의 사건)) 1980년 국민 투표에서 약 67%의 찬성으로 새 헌법을 통과시켰는데, 투표가 공정하지 않았다는 평가가 있다. 이 헌법은 8년의 과도기를 두고 1988년에 피노체트의 8년 더 집권 여부를 국민 투표에 부치도록 했다. 1988년 8월 30일 피노체트가 후보로 지명되었고, 이 투표 운동에서 처음으로 양쪽에 방송 시간이 주어졌다. '아니오' 쪽은 무지개를 상징으로 삼고 밝은 노래를 쓰고 고문 피해자의 증언을 실었으며, 미국의 민주주의 지원 기구들이 이쪽에 100만 달러를 보태고 참관인을 보냈다고 전한다. 야당 정당들은 '아니오'를 위해 손잡았고 이 연합(콘세르타시온)이 이듬해 아일윈을 후보로 냈다. 1988년 10월 5일 투표율 97.61%(등록 유권자 7,429,404명)에서 '아니오'가 55.99%(3,967,579표), '예'가 44.01%(3,119,110표)로 이겼다. 피노체트가 자체 쿠데타를 생각했다고 하나 공군·해군·경찰 총사령관이 반대했고 그는 결과를 받아들였다. 1989년 헌법 개정안이 91%의 찬성을 얻었고, 그해 12월 대통령 선거에서 기독교 민주당의 파트리시오 아일윈이 약 55%로 당선해 1990년 3월 11일 취임했다. 아일윈 정부는 군사 정권 때의 인권 침해를 조사하는 위원회를 세웠다. 피노체트는 대통령에서 물러난 뒤에도 육군 총사령관으로 남았고, 1998년 10월 영국 런던에서 체포되었다. 아일윈 뒤 1994년 에두아르도 프레이 루이스타글레, 2000년 리카르도 라고스가 이어 대통령이 되었다."
  subjects: [chile]
  links: []
  tags: [politics, society]
  sources: ["Brian Loveman, Chile: The Legacy of Hispanic Capitalism (4th ed., Oxford University Press, 2001)", "Arturo Valenzuela and J. Samuel Valenzuela (eds.), Military Rule in Chile: Dictatorship and Oppositions (Johns Hopkins University Press, 1986)"]

- id: panama-invasion-1989
  year: 1989
  endYear: 1999
  title:
    ko: "미국의 파나마 침공과 운하 반환(1989~1999)"
  summary:
    ko: "1903년 미국의 지원 속에 콜롬비아에서 갈라져 나온 파나마는 운하 지대를 미국에 내주었고(「파나마의 분리 독립과 운하 조약(1903~1904)」(앞의 사건)), 이 지대의 주권은 오래도록 두 나라 사이의 갈등거리였다. 1977년 토리호스–카터 조약이 운하 반환 절차를 정했다(「국기 사건과 토리호스–카터 조약(1964~1979)」(앞의 사건)). 마누엘 노리에가는 1967년부터 미국 중앙 정보국에서 돈을 받은 정보원이었고 1980년대 초 파나마의 실권자가 되었다. 1988년 미국 연방 대배심이 마약 밀매 등의 혐의로 그를 기소했고, 1989년 5월 선거에서 야당 후보 기예르모 엔다라가 이긴 것으로 보이자 노리에가가 선거를 무효로 했다. 12월 15일 파나마 입법부가 미국과 전쟁 상태를 선언했고 16일 미국 해병 장교가 파나마 방위군 검문소에서 총에 맞아 숨졌다. 12월 20일 0시 46분(현지) '정의의 명분 작전'이 시작되어 미국군 약 27,000명이 방위군 약 16,000명과 맞붙었다. 엔다라는 침공이 시작되고 몇 시간 뒤 대통령에 취임했다. 교황청 대사관으로 피했던 노리에가는 1990년 1월 3일 투항했고, 미국에서 재판을 받아 40년형(뒤에 30년으로 줄어듦)을 받았다. 사망자는 미국군 23명, 파나마군 314명(미국 국방부 집계, 미국 육군 내부 문서의 추산은 총 약 1,000명)이고, 민간인은 미국 국방부 202명, 아메리카스 워치 약 300명, 유엔 500명 등으로 집계가 갈리고, 가톨릭 교회는 군인과 민간인을 합쳐 673명이 숨졌다고 했다. 12월 29일 유엔 총회는 75 대 20(기권 40)으로 침공을 규탄했고, 철군을 요구한 안전 보장 이사회 결의안은 미국·영국·프랑스의 거부권에 막혔다. 1977년 조약에 따라 운하는 1999년 12월 31일 파나마에 완전히 넘어갔다."
  subjects: [panama, usa]
  links:
    - { from: usa, to: panama, note: "노리에가 정권을 무너뜨리려 침공 (1989-12-20)" }
    - { from: usa, to: panama, note: "운하를 넘김 (1999-12-31)" }
  tags: [war, diplomacy]
  sources: ["Thomas Donnelly, Margaret Roth and Caleb Baker, Operation Just Cause: The Storming of Panama (Lexington Books, 1991)", "Michael L. Conniff, Panama and the United States: The End of the Alliance (3rd ed., University of Georgia Press, 2012)"]
