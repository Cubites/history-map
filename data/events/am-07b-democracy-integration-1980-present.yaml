- id: debt-crisis-1982
  year: 1982
  endYear: 1989
  title:
    ko: "라틴아메리카 채무 위기(1982~1989)"
  summary:
    ko: "1960~1970년대 브라질·아르헨티나·멕시코는 공업화와 사회 기반 시설을 위해 많은 돈을 빌렸다. 1973년 석유 가격이 오른 뒤(「석유 파동과 신자유주의」(앞의 사건)) 산유국의 돈이 은행으로 흘러들었고, 은행은 그 가운데 상당액을 라틴아메리카 정부에 빌려 주었다. 대부분 단기였고 멕시코는 앞으로 올 석유 수입을 믿고 달러로 빌렸다. 1979년부터 미국과 유럽의 금리가 오르고 달러가 강해지며 원자재 값이 떨어지자 이자 부담이 커졌다. 외채는 1975년 약 750억 달러에서 1983년 3,150억 달러를 넘어 지역 생산의 약 절반에 이르렀고, 원리금 상환액은 1975년 120억 달러에서 1982년 660억 달러로 늘었다. 1982년 8월 멕시코 재무 장관 헤수스 실바 에르소그가 빚을 갚을 수 없다고 밝히고 90일 동안 일방적으로 상환을 미룬다고 발표하면서 위기가 터졌다. 미겔 데 라 마드리드 정부가 12월 들어섰고, 다른 나라들도 줄줄이 상환 조건을 다시 협상했다. 국제 통화 기금은 상환 일정을 조정하는 대신 정부 지출 삭감을 요구했고, 이는 실업과 실질 임금 하락을 불렀다. 1982~1985년 이 지역이 갚은 돈은 1,080억 달러에 이르렀다. 1985년 미국 재무 장관 제임스 베이커가 제안한 계획(베이커 계획)은 큰 빚을 진 나라에 새 대출을 늘려 성장으로 갚게 하려 했으나 효과가 작았고, 1989년 니컬러스 브래디 재무 장관의 계획(브래디 계획)이 빚의 일부를 줄여 주고 채권으로 바꾸는 길을 열었다. 이 시기를 '잃어버린 10년'이라 부른다. 1980년 뒤 10년 사이 도시 실질 임금은 20~40% 내렸고 1980~1985년 지역 생산은 연 2.3% 늘었으나 1인당 생산은 9% 가까이 줄었다. 아르헨티나·브라질 등에서는 물가가 연 수천 퍼센트까지 오르는 초인플레이션이 일어났다(추산)."
  subjects: [mexico, brazil, argentina]
  links: []
  tags: [economy, politics]
  sources: ["Jeffry A. Frieden, Debt, Development, and Democracy: Modern Political Economy and Latin America, 1965–1985 (Princeton University Press, 1991)", "Rosemary Thorp, Progress, Poverty and Exclusion: An Economic History of Latin America in the 20th Century (Inter-American Development Bank, 1998)"]

- id: grenada-invasion-1983
  year: 1983
  endYear: 1983
  title:
    ko: "미국의 그레나다 침공(1983)"
  summary:
    ko: "그레나다는 1974년 영국에서 독립했고(「서인도 연합주와 그레나다·도미니카 연방·세인트루시아·세인트빈센트 그레나딘의 독립(1967~1979)」(앞의 사건)), 1979년 3월 13일 모리스 비숍이 이끈 신보석 운동이 거의 피를 흘리지 않고 정권을 잡았다. 비숍 정부는 쿠바와 가까웠고 섬 남쪽에 큰 공항을 짓는 일에 쿠바 건설 노동자들이 참여했다. 1983년 10월 신보석 운동 안에서 버나드 코드를 따르는 쪽이 비숍을 가택 연금했고, 19일 군중이 그를 풀어 주었으나 군이 다시 붙잡아 포트루퍼트에서 지지자 일곱 명과 함께 처형했다. 허드슨 오스틴 장군의 군이 평의회를 세워 나라를 다스렸고 총독 폴 스쿤은 가택 연금되었다. 동카리브 국가 기구(OECS)와 바베이도스·자메이카가 도움을 청하자 10월 25일 새벽 미국군 7,000~8,000명과 카리브 평화군 353명가량이 상륙했다(우르젠트 퓨리 작전). 맞선 쪽은 그레나다 인민 혁명군 약 1,300~1,500명과 쿠바인 784명가량(건설 노동자 약 630명)이었다. 조직적 저항은 며칠 만에 끝났고 미국은 11월 3일 임무 완료를 선언했으며 12월 초 전투 병력을 뺐다. 사망자는 미국군 19~24명, 그레나다군 21~45명, 쿠바인 24~25명, 민간인 24명 이상(정신 병원 폭격으로 18명)으로 집계가 갈린다. 11월 2일 유엔 총회는 108 대 9(기권 27)로 이 침공을 국제법의 중대한 위반이라고 개탄했고, 안전 보장 이사회의 비슷한 결의안은 미국이 거부권으로 막았다. 이 작전은 미군 안의 합동 작전 문제를 드러내 군 개편의 한 배경이 되었다. 스쿤이 자문 위원회를 세웠고 1984년 12월 선거에서 신국민당이 이겨 허버트 블레이즈가 총리가 되었다."
  subjects: [grenada, usa]
  links:
    - { from: usa, to: grenada, note: "군사 평의회를 무너뜨리려 침공 (1983-10-25)" }
  tags: [war, politics]
  sources: ["Mark Adkin, Urgent Fury: The Battle for Grenada (Lexington Books, 1989)", "Gary Williams, US-Grenada Relations: Revolution and Intervention in the Backyard (Palgrave Macmillan, 2007)"]
