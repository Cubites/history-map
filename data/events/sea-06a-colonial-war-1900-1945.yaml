# 동남아시아 사건 1묶음 앞 절반(sea-06a): 식민 지배 아래의 민족 운동, 일본의 침공과 점령, 1945년의 독립 선언 (1900 ~ 1945년)
# 범위: 네덜란드의 윤리 정책·인도네시아 민족 운동과 공산당·국민당, 미국의 모로 지배와 필리핀 통치·연방, 프랑스–시암 조약과 영국–시암 조약, 동유 운동·옌바이 봉기·인도차이나 공산당,
#   사야 산 반란과 영국령 버마의 분리, 시암의 입헌 혁명, 일본의 인도차이나 진주·프랑스–타이 전쟁, 일본의 침공과 점령, 임팔 작전과 버마 탈환, 1945년 3월 9일 정변과 북부 기근,
#   8월 혁명과 인도네시아 독립 선언.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 연속된 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다.
# 날짜: 모두 그레고리력(불기·자와력·히즈라력은 쓰지 않음). 확실하지 않은 날짜는 '무렵'으로 적었다. 조약은 서명 해와 발효 해를 가렸다.
# 이름 규칙: 버마는 1989년 앞 '버마', 시암은 1939년 앞 '시암'(처음 한 번 '지금 타이'), 도시는 그때 이름(랑군(지금 양곤)·바타비아). 표기는 표기 사전과 위키백과 한국어판 표제를 따랐고,
#   콘바웅·말라카·떠이선·응우옌은 저장소 기존 꼴이다. 베트남 인명은 성조 없이 띄어 썼다. 사망자·피해는 추산과 범위로 적고, 분쟁·민족 문제(1945년 기근, 숙칭, 보번디굴 등)는 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 일본 점령 1942~1945는 영토 그대로 두고 점령 관계만 글로 적었고,
#   1941년 도쿄 조약분만 타이 땅이며 1943년 말레이 네 주·샨 두 주의 편입은 글로만 적었다. 이중 정권은 법적 국경(1945년 베트남 민주 공화국·인도네시아 공화국의 선언은 사건 글로 설명).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(영국-프랑스 협상과 모로코 위기, 1935년 인도 통치법과 1937년 선거, 태평양 전쟁 발발, 한국광복군의 연합 작전과 국내 진공 작전 준비).
#   한국사와 닿는 점은 임팔 작전의 한국광복군 공작대와 조선인 군속 포로 감시원 문장으로 엮었다.

- id: ethical-policy-1901
  year: 1901
  endYear: 1912
  title:
    ko: "네덜란드의 윤리 정책과 인도네시아 민족 운동의 시작(1901~1912)"
  summary:
    ko: "네덜란드는 19세기 내내 식민지 네덜란드령 동인도의 자와에서 강제 재배 제도로 거둔 이익을 본국 재정에 쏟았다. 1899년 법률가 판 데펜터가 잡지에 「명예의 빚」을 실어, 식민지에서 가져간 부를 원주민의 복지로 돌려주어야 한다고 주장했다. 1901년 9월 17일 빌헬미나 여왕이 의회 연설에서 식민지 주민의 복지를 돌볼 도덕적 의무를 밝히면서 윤리 정책이 공식 정책이 되었다. 정책은 관개, 이주, 교육 세 기둥으로 이루어졌다. 그러나 1900년 유럽식 학교에 다니는 원주민은 1,500명으로 유럽인 1만 3천 명보다 적었고, 1905년에 시작된 자와 인구의 바깥섬 이주도 인구 증가분의 극히 일부만 옮겼다. 예산은 늘 모자랐고 관리들은 점점 환멸을 느꼈다. 그래도 서양식 교육을 받은 새 지식층이 자라났다. 1908년 5월 20일 의학교 학생들이 세운 부디 우토모가 자와 지식인의 첫 근대 단체가 되었고, 1911년 자와 중부 솔로의 이슬람 배틱 상인 조합에서 출발한 단체가 1912년 사레캇 이슬람이 되어 초크로아미노토 아래 대중 조직으로 커졌다. 1912년에는 유럽계·혼혈·자와인 지식인이 인도 당을 세워 처음으로 독립을 정치 목표로 내세웠다가 지도자들이 1913년 유배되었다. 자와 귀족 가문의 딸 카르티니(1879~1904)가 여성 교육을 호소한 편지는 죽은 뒤 1911년 책으로 묶여 큰 반향을 일으켰다. 「강제 재배 제도(1830~1870)」(앞의 사건)와 「아체 전쟁(1873~1904)」(앞의 사건)으로 굳어진 지배를 도덕적 의무로 다듬은 이 정책은 뜻하지 않게 민족 운동의 도구가 된 교육 받은 세대를 길러 냈다."
  subjects: [dutch-east-indies, netherlands]
  links:
    - { from: netherlands, to: dutch-east-indies, note: "윤리 정책을 선언함 (1901)" }
  tags: [politics, society]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 3rd ed., 2001)", "Robert Cribb and Audrey Kahin, Historical Dictionary of Indonesia (Scarecrow Press, 2nd ed., 2004)"]

- id: moro-sulu-1903
  year: 1903
  endYear: 1915
  title:
    ko: "미국의 모로 지배와 술루 술탄국의 끝(1903~1915)"
  summary:
    ko: "1898년 파리 조약으로 필리핀을 넘겨받은 미국은 북쪽 루손에서 필리핀 공화국과 싸우는 동안 남쪽 이슬람 지역에서는 술루 술탄국과 1899년 키람–베이츠 조약을 맺어 충돌을 피했다. 이 조약은 1904년 미국 쪽이 무효로 선언했다. 1903년 6월 1일 법 787호로 민다나오와 술루 군도를 묶은 모로주가 세워져 군인 총독이 직접 다스렸다. 총독은 레너드 우드(1903~1906), 태스커 블리스(1906~1909)를 거쳐 존 퍼싱(1909~1913)에 이르렀다. 노예제와 지방 수장(다투)의 권력, 무기 소지를 없애려는 정책은 거듭된 저항을 불렀다. 1906년 3월 홀로섬의 화산 부드 다후에서 모로 수백 명이 미군에게 포위되어 학살되었는데, 사망자는 6백 명이 넘고 여성과 아이가 많았다. 1913년 6월 부드 바그삭 전투를 마지막으로 큰 무장 저항이 가라앉았다. 같은 해 12월 민정 총독 프랭크 카펜터가 부임했고 1914년 7월 23일 모로주는 민다나오·술루 부로 바뀌었다. 술탄 자말룰 키람 2세(재위 1894~1915)는 1915년 3월 22일 카펜터 협정에 서명해 세속 권력을 내려놓고 종교 지도자의 지위만 지녔다. 이로써 15세기 무렵 시작된 술루 술탄국의 다스림이 끝났고 술루의 옛 땅은 미국의 완전한 주권 아래 들어갔다. 키람 2세는 칭호를 지닌 채 1931~1934년 필리핀 상원 의원을 지냈고 1936년 6월 7일 아들 없이 죽었다. 이 과정은 「말롤로스 공화국과 필리핀–미국 전쟁(1899~1902)」(앞의 사건) 뒤 미국이 필리핀 전체를 식민지로 틀어쥐는 마지막 단계였고, 북쪽의 통치는 「미국의 필리핀 통치와 필리핀 의회(1901~1916)」(앞의 사건)에서 다룬다."
  subjects: [american-philippines, sulu-sultanate, usa]
  links:
    - { from: usa, to: sulu-sultanate, note: "카펜터 협정으로 술탄의 세속 권력을 없앰 (1915)" }
  tags: [politics, war]
  sources: ["Peter Gordon Gowing, Mandate in Moroland: The American Government of Muslim Filipinos, 1899–1920 (Philippine Center for Advanced Studies, 1977)", "Cesar Adib Majul, Muslims in the Philippines (University of the Philippines Press, 1973)"]
  places: [{ name: 부드 다후, at: [121.05, 6.0], year: 1906 }]

- id: american-philippines-1901
  year: 1901
  endYear: 1916
  title:
    ko: "미국의 필리핀 통치와 필리핀 의회(1901~1916)"
  summary:
    ko: "1900년 3월 태프트 위원회가 필리핀 민정 위원회로 임명되었고, 1901년 7월 4일 윌리엄 하워드 태프트가 첫 민정 총독에 올랐다. 1902년 7월 1일 필리핀 조직법이 발효되어 미국 의회가 통치의 틀을 정했고, 필리핀 사람 대표 둘을 미국 하원에 상주 위원으로 보내게 했다. 이후 네 명의 총독을 거쳐 1913년 프랜시스 버턴 해리슨이 부임했다. 위원회는 1900년 9월 입법 권한을 받아 법을 만들기 시작했고, 조직법은 인구 조사를 마친 뒤 2년 안에 선거로 뽑는 의회를 열도록 했다. 1907년에는 선거로 뽑는 필리핀 의회가 하원으로 열려 필리핀 사람이 처음 입법에 참여했고 즉각 독립을 내세운 나시오날리스타당이 다수를 차지했으며, 미국인이 다수인 위원회가 상원 구실을 했다. 미국은 영어로 가르치는 공립학교를 늘리고 도로·위생·관료 제도를 갖추고 1908년에는 필리핀 대학을 세웠으며, 1909~1913년의 관세법으로 미국과 필리핀 사이의 교역이 대부분 무관세가 되어 설탕·코프라·마닐라삼 수출이 커졌다. 이는 땅을 가진 엘리트가 의회와 경제에서 힘을 굳히는 바탕이 되었다. 해리슨 총독은 관직의 '필리핀화'를 밀어붙여 필리핀인 관료가 빠르게 늘었고 위원회에서도 필리핀 사람이 다수가 되었다. 1916년 8월 29일 존스법(필리핀 자치법)이 조직법을 대신해 상원과 하원을 모두 선거로 뽑게 했고, 안정된 정부가 서면 독립을 줄 뜻을 밝혔다. 같은 시기 남쪽 이슬람 지역은 따로 군인 총독이 다스렸다(「미국의 모로 지배와 술루 술탄국의 끝(1903~1915)」(뒤의 사건)). 이 통치의 틀 위에서 1934년 연방이 출범한다(「필리핀 연방(커먼웰스)의 출범(1934~1941)」(뒤의 사건))."
  subjects: [american-philippines, usa]
  links:
    - { from: usa, to: american-philippines, note: "조직법으로 민정을 폄 (1902)" }
  tags: [politics]
  sources: ["H. W. Brands, Bound to Empire: The United States and the Philippines (Oxford University Press, 1992)", "Stanley Karnow, In Our Image: America's Empire in the Philippines (Random House, 1989)"]

- id: franco-siamese-treaties-1904
  year: 1904
  endYear: 1907
  title:
    ko: "1904년 파리 조약과 1907년 방콕 조약(1904~1907)"
  summary:
    ko: "1893년 파크남 사건으로 메콩강 왼쪽 기슭을 프랑스에 내준 시암(지금 타이)은 그 뒤에도 강 오른쪽 기슭과 캄보디아 서북부를 두고 프랑스와 맞섰다(「파크남 사건과 프랑스–시암 조약, 라오스 보호령(1893)」(앞의 사건)). 1904년 2월 13일 파리 조약으로 시암은 루앙프라방 맞은편의 사야부리 일대와 참파삭 쪽 메콩강 오른쪽 기슭 땅을 프랑스령 라오스에 넘기고, 프랑스는 1893년 위기 뒤 담보처럼 점령해 온 짠타부리를 돌려주기로 했다. 메콩강이 시암과 프랑스령 라오스의 경계가 되어 같은 라오인 마을이 강 양쪽으로 갈렸다. 같은 해 참파삭 왕국도 프랑스령 라오스에 들어 왕국이 끝났고 왕가는 지사로 남았다. 영국과 프랑스가 같은 해 4월 협상으로 시암 안의 세력권을 가르고 시암 자체는 두 세력 사이의 완충 지대로 두기로 한 것과 맞물린 합의였다(「영국-프랑스 협상과 모로코 위기」). 캄보디아에서는 4월 노로돔 왕이 죽고 동생 시소왓이 즉위했으며, 루앙프라방에서도 1904년 자카린 왕이 죽고 시사왕웡이 즉위했다. 1907년 3월 23일 방콕 조약에서 시암은 바탐방, 시엠레아프, 시소폰 일대를 프랑스령 캄보디아로 넘겼고, 프랑스는 트라트와 단사이에서 물러났다. 새로 캄보디아에 든 땅에는 앙코르 유적이 있는 시엠레아프가 있었다. 프랑스령 아시아 신민에 대한 치외 법권도 일부 줄었다. 쭐랄롱꼰(라마 5세) 정부는 이렇게 변경의 땅을 내주는 대가로 독립을 지켜 냈고, 1909년에는 영국에도 말레이 북부의 땅을 넘기게 된다(「1909년 방콕 조약과 말레이 북부 네 주(1909)」(뒤의 사건)). 이 거래는 시암 안에서 잃어버린 땅의 기억으로 남아 뒤의 민족주의에 쓰였다."
  subjects: [thailand, laos, cambodia, champasak-kingdom, france]
  links:
    - { from: thailand, to: laos, note: "메콩강 오른쪽 기슭을 프랑스령 라오스에 넘김 (1904)" }
    - { from: thailand, to: cambodia, note: "바탐방·시엠레아프·시소폰을 넘김 (1907)" }
  tags: [diplomacy, politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 2nd ed., 2003)", "Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "David P. Chandler, A History of Cambodia (Westview Press, 4th ed., 2008)"]

- id: dong-du-1905
  year: 1905
  endYear: 1912
  title:
    ko: "판 보이 쩌우와 동유 운동, 판 쭈 찐(1905~1912)"
  summary:
    ko: "20세기 초 안남·통킹 보호령과 코친차이나로 나뉘어 프랑스의 지배를 받던 베트남 지식인들은 왕조를 되살리자는 쪽과 근대 개혁으로 나아가자는 쪽으로 갈려 새 길을 찾았다. 응에안 출신 판 보이 쩌우(1867~1940)는 1904년 황족 끄엉 데를 회장으로 삼아 유신회를 세워 프랑스를 몰아내고 입헌 군주제를 세우자고 했고, 1905년 일본으로 건너가 요코하마에서 중국 개혁가 량치차오와 만났고, 이때 쓴 『월남망국사』는 중국과 대한제국에서도 읽혔다(1906년 번역). 일본으로 건너간 유학생은 많아야 2백 명 안팎(추산)이었다. 그의 권유로 베트남 청년들이 일본으로 유학하는 동유 운동이 일어나 1908년까지 이어졌다. 한편 중부 꽝남의 판 쭈 찐(1872~1926)은 무장 투쟁에 반대하고 프랑스의 틀 안에서 서양식 교육과 민주 제도를 들여오자고 했으며, 1907년 하노이에 동경의숙이 세워지는 데 함께했다. 1908년 중부에서 세금과 부역에 항의하는 농민 시위가 번지자 프랑스는 두 사람의 지지자들을 가려 잡았고 판 쭈 찐은 꼰다오 섬에 갇혔다가 1911년 풀려나 프랑스로 건너갔다. 안남 보호령에서는 1907년 프랑스가 타인타이 황제를 몰아내고 일곱 살 주이떤 황제를 세웠다. 같은 해 일본이 프랑스와 협약을 맺은 뒤 유학생을 쫓아내기 시작했고 1909년에는 판 보이 쩌우도 일본에서 추방되었다. 신해혁명에 자극을 받은 그는 1912년 광저우에서 유신회를 해산하고 공화제를 내세운 베트남 광복회를 만들었다. 이 시기 운동은 지식인과 소수 유학생 중심이어서 대중과 이어지지 못했으나, 군주제와 개량의 두 길을 모두 시험해 이후 민족 운동의 방향을 가르는 기준이 되었다."
  subjects: [tonkin-protectorate, annam-protectorate, cochinchina, japan, france]
  tags: [politics, society]
  sources: ["David G. Marr, Vietnamese Anticolonialism, 1885–1925 (University of California Press, 1971)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]

- id: anglo-siamese-treaty-1909
  year: 1909
  title:
    ko: "1909년 방콕 조약과 말레이 북부 네 주(1909)"
  summary:
    ko: "1909년 3월 10일 방콕에서 시암(지금 타이)과 영국이 맺은 조약(7월 9일 발효)으로 시암은 말레이 반도 북부의 크다, 프를리스, 클란탄, 트렝가누 네 술탄국에 대한 종주권과 보호·행정권, 딸린 섬을 영국에 넘겼다. 네 술탄국은 오랫동안 시암에 3년마다 금과 은으로 만든 꽃을 바치는 조공을 해 왔지만 내정은 스스로 다스렸다. 영국은 이미 1890년대에 페락·슬랑오르·느그리슴빌란·파항을 연합 말레이 주로 묶어 간접 통치하고 있었고, 이 조약으로 반도 북부까지 영향력을 넓혔다. 시암은 대가로 철도 건설 차관(400만 파운드)을 받고 영국 아시아계 신민에 대한 치외 법권을 일부 풀었다. 쭐랄롱꼰(라마 5세)의 정부는 앞서 란나와 파타니를 몬톤으로 묶어 중앙의 통제를 굳혔는데(「몬톤 제도와 란나·파타니의 편입(1892~1902)」(앞의 사건)), 파타니는 시암 본토에 속해 이 조약에서 빠졌다. 네 술탄국은 영국인 고문을 받으며 연합 말레이 주보다 느슨하게 다스려지는 비연합 말레이 주가 되었고, 1914년에는 조호르도 영국인 고문을 받아들여 비연합 주에 들었다. 이때 정해진 선이 지금의 타이–말레이시아 국경의 바탕이 되었고, 영국은 반도 남쪽 끝에서 북쪽 국경까지를 모두 영향권에 두게 되었다. 연합 말레이 주는 1896년 7월 1일 발효된 틀에서 영국인 주재관이 실권을 쥐었고, 네 술탄국은 합쳐 3만 8천 km²쯤으로 어림된다. 쭐랄롱꼰은 1910년 10월 죽고 와치라웃(라마 6세)이 이어받았다. 이 땅은 1943년 일본의 승인 아래 잠시 타이에 다시 편입되었다가 1945년 일본의 항복과 함께 영국에 되돌려졌다."
  subjects: [thailand, kedah-perlis, kelantan-sultanate, terengganu-sultanate, uk]
  links:
    - { from: thailand, to: uk, note: "크다·프를리스·클란탄·트렝가누의 종주권을 넘김 (1909)" }
  tags: [diplomacy, politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 2nd ed., 2003)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave, 2nd ed., 2001)"]

- id: indonesian-communists-1920
  year: 1920
  endYear: 1927
  title:
    ko: "인도네시아 공산당과 1926~1927년 봉기, 보번디굴(1920~1927)"
  summary:
    ko: "1914년 네덜란드 사회주의자들이 세운 인도 사회민주 연맹은 자와의 철도·항만 노동자와 사레캇 이슬람 안의 급진파를 끌어들이며 자랐다. 1920년 5월 스마랑 대회에서 연맹은 인도 공산당 연합으로 이름을 바꾸고 세마운을 의장으로 삼아 아시아에서 가장 일찍 코민테른에 든 공산당이 되었으며, 1924년 인도네시아 공산당이라 불렀다. 1921년 사레캇 이슬람이 두 당 가입을 금지하자 공산당원은 그 조직에서 떠났고, 세마운은 1922년 모스크바 회의에 다녀와 노동조합을 조직했다. 1923년 철도 파업이 꺾이고 지도부 다수가 추방되자 남은 당원들은 무장 봉기를 요구했다. 코민테른의 동남아 대표 탄 말라카는 대중의 지지가 모자란다며 반대했으나 1925년 말 프람바난에서 봉기가 결정되었다. 1926년 11월 12일 바타비아에서 먼저 터진 봉기는 서자와 반튼과 수라바야 등으로 번졌지만 바타비아에서는 하루 이틀 만에, 다른 곳에서는 몇 주 만에 진압되었고, 1927년 1월에는 서수마트라에서도 봉기가 있었다. 네덜란드령 동인도 정부는 약 1만 3천 명을 체포해 4,500명을 감옥에 넣고 1,308명을 억류했으며 823명을 서뉴기니 오지의 보번디굴 수용소로 보냈다. 수용소에서 여러 명이 죽었다. 당은 1927년 금지되어 지하로 들어갔고, 탄 말라카는 해외로 달아나 1927년 6월 방콕에서 인도네시아 공화당을 세웠다. 보번디굴 수용소는 일본의 진출을 우려한 네덜란드가 수감자를 오스트레일리아로 옮긴 1943년까지 이어졌다. 한편 1926년 1월에는 자와 전통 이슬람 학자들이 나흐다툴 울라마를 세웠다. 공산당이 꺾인 자리에서 비공산 민족주의가 나왔다(「수카르노와 인도네시아 국민당, 청년 서약(1927~1934)」(뒤의 사건))."
  subjects: [dutch-east-indies]
  tags: [politics, society]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 3rd ed., 2001)", "Ruth T. McVey, The Rise of Indonesian Communism (Cornell University Press, 1965)"]

- id: sukarno-pni-1927
  year: 1927
  endYear: 1934
  title:
    ko: "수카르노와 인도네시아 국민당, 청년 서약(1927~1934)"
  summary:
    ko: "1926~1927년 공산당 봉기가 진압된 뒤 비공산 민족주의가 무대에 나왔다. 반둥에서 공학을 공부한 수카르노는 1927년 7월 4일 인도네시아 국민 연합을 세웠고 1928년 5월 이를 인도네시아 국민당으로 바꾸어, 네덜란드와의 협력을 거부하고 독립을 목표로 하는 첫 전국적 세속 정당으로 키웠다. 같은 해 10월 28일 바타비아의 제2차 청년 회의가 하나의 조국, 하나의 민족, 하나의 언어를 내세운 청년 서약을 채택했고, 이 자리에서 국가 「인도네시아 라야」가 처음 연주되었고, 각 지역 청년 단체가 말레이어에 바탕한 인도네시아어를 통일 언어로 삼기로 뜻을 모았다. 국민당 당원은 1929년 1만 명 안팎(추산)으로 늘었다. 네덜란드령 동인도 정부는 국민당의 성장을 위협으로 보아 1929년 12월 수카르노와 간부 일곱 명을 체포했고, 1930년 반둥 법정에서 수카르노는 변론 「인도네시아는 고발한다」로 식민 지배를 비판했으나 유죄 판결로 가장 무거운 형을 받았다. 1931년 4월 25일 국민당은 해산되어 인도네시아당(파르틴도)과, 하타를 중심으로 교육을 앞세운 새 국민당으로 갈렸다. 하타는 네덜란드 유학 시절 인도네시아 유학생 단체의 의장이었다. 수카르노는 1931년 말 풀려나 파르틴도를 이끌다 1933년 다시 체포되어 1934년 플로레스섬 엔데로 유배되었고 1938년 벵쿨루로 옮겨졌다가 1942년 일본군이 들어오자 풀려났으며, 하타와 동료들도 1934년 체포되었다. 이 시기 정당은 대중 정치의 틀을 만들었지만 식민 정부의 단속으로 모두 꺾였고, 독립은 일본의 점령을 거친 뒤에야 선언된다(「인도네시아 독립 선언(1945)」(뒤의 사건))."
  subjects: [dutch-east-indies, netherlands]
  tags: [politics, society]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 3rd ed., 2001)", "John Ingleson, Road to Exile: The Indonesian Nationalist Movement, 1927–1934 (Heinemann Educational Books, 1979)"]

- id: yen-bai-1930
  year: 1930
  endYear: 1931
  title:
    ko: "옌바이 봉기와 인도차이나 공산당, 응에띤 소비에트(1930~1931)"
  summary:
    ko: "1920년대 후반 프랑스에 맞선 베트남 민족주의는 중국 국민당을 본뜬 베트남 국민당(응우옌 타이 혹이 이끎)과 공산주의 흐름으로 나뉘어 있었다. 1929년 2월 프랑스 노무 모집관 바쟁이 암살되자 프랑스는 국민당을 크게 단속해 1천 명 가까이 체포했다. 궁지에 몰린 국민당은 2월 15일로 미룬 봉기 명령이 한 곳에 전해지지 않은 채 1930년 2월 10일 새벽 하노이 서북쪽 옌바이에서 베트남인 병사와 당원이 프랑스 장교를 죽이며 일어났다. 봉기는 곧 꺾여 2월 22일 끝난 것으로 선언되었고, 프랑스는 2월 16일 근거지 꼬암 마을을 폭격해 주로 민간인 약 200명이 죽었다. 통킹 형사 위원회는 547명을 기소해 80건의 사형을 선고했고, 그중 만 27세의 응우옌 타이 혹을 포함한 13명이 6월 17일 기요틴으로 처형되었다. 국민당은 사실상 무너졌다. 프랑스는 통킹 베트남인 병사 약 1만 명을 다른 곳으로 옮겼고, 5월 22일 파리 엘리제궁 앞에서는 1천 명 넘는 사람이 처형에 항의했다. 한편 1930년 2월 홍콩에서 호찌민(당시 응우옌 아이 꾸옥)이 베트남의 공산주의 조직 셋을 합쳐 당을 세웠고, 10월 인도차이나 공산당으로 이름을 바꾸며 쩐 푸를 서기장으로 삼았으나 그는 1931년 9월 감옥에서 죽었다. 1930년 5월 노동절 파업에 이어 9월부터 안남 보호령의 응에안과 하띤 농민이 세금과 지주에 맞서 행동했고 일부 마을에는 농민 정권(소비에트)이 세워졌다. 프랑스는 군대와 비행기로 1931년까지 이를 진압했으며 사망자는 천여~수천 명으로 추산이 갈린다. 이후 반식민 운동의 중심은 공산당 쪽으로 옮겨 갔다."
  subjects: [tonkin-protectorate, annam-protectorate, france]
  tags: [politics, war]
  sources: ["David G. Marr, Vietnamese Tradition on Trial, 1920–1945 (University of California Press, 1981)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]
  places: [{ name: 옌바이 봉기, at: [104.87, 21.7], year: 1930 }]

- id: saya-san-1930
  year: 1930
  endYear: 1937
  title:
    ko: "사야 산 반란과 타킨 운동, 영국령 버마의 분리(1930~1937)"
  summary:
    ko: "1930년 세계 대공황으로 쌀값이 폭락하자 이라와디 델타의 농민은 빚과 세금에 짓눌렸다. 전직 승려이자 전통 의술가인 사야 산(1876~1931)은 1930년 10월 스스로 왕(투파나카 갈론 라자)에 올라 불교 왕권을 되살리자며 갈론(금시조) 군대를 모았고, 12월 22일 밤 타라와디 지역에서 봉기했다. 문신이 총알을 막아 준다고 믿은 농민 반란군을 영국 식민 정부는 인도에서 군대를 불러 1932년 말까지 진압했는데, 반란군 1천 명이 넘게 죽고 약 9천 명이 항복하거나 잡혔다. 사야 산은 1931년 8월 2일 샨 지방 관리들에게 붙잡혀 11월 28일 교수형을 당했고 모두 126명이 사형당했으며 약 1,400명이 징역이나 유배를 받았다. 이 재판에서 변호를 맡은 사람이 변호사 바 모였다. 같은 해 5월 랑군 부두에서는 인도인 노동자와 버마인의 충돌이 있어 반인도 감정이 커졌다. 같은 해 5월 랑군(지금 양곤)에서 결성된 도바마 아시아욘(우리 버마 협회)은 회원이 서로를 영국인에게 쓰던 호칭 타킨(주인)으로 불러 타킨 운동으로 알려졌다. 1936년 랑군 대학 학생 파업에서 아웅 산과 우 누가 두각을 나타냈고 이들이 1937년 타킨 운동을 되살렸다. 영국은 1935년 인도 통치법에 따라 버마를 영국령 인도에서 갈라, 1937년 4월 1일 영국령 버마를 총독 아래 직할 식민지로 만들었다(「1935년 인도 통치법과 1937년 선거, 버마의 분리(1935~1937)」(뒤의 사건)). 바 모가 첫 총리(1937~1939)가 되어 내정 일부를 맡았고 총독은 아치볼드 코크레인(1936~1941)이었으며, 샨 국과 카레니 국 같은 변경은 총독이 따로 다스렸다."
  subjects: [british-raj, british-burma, uk]
  links:
    - { from: british-raj, to: british-burma, note: "버마를 갈라 따로 식민지로 내줌 (1937)" }
  tags: [politics, society]
  sources: ["Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Robert H. Taylor, The State in Myanmar (Hurst, 2009)", "Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Farrar, Straus and Giroux, 2006)"]
