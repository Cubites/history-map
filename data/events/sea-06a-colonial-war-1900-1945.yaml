- id: august-revolution-1945
  year: 1945
  title:
    ko: "8월 혁명과 베트남 민주 공화국의 독립 선언(1945)"
  summary:
    ko: "1945년 8월 15일 일본이 항복하자 인도차이나에는 권력의 공백이 생겼다. 만 55세의 호찌민은 베트민을 이끌고 있었다. 베트민(베트남 독립 동맹)은 이미 8월 13일 인도차이나 공산당 중앙위원회와 함께 전국 봉기 위원회를 만들어 총봉기령을 내렸고, 16일 북부 산악 지대 딴짜오의 국민 대회가 호찌민을 위원장으로 하는 민족 해방 위원회를 꾸렸다. 통킹의 하노이를 19일, 안남의 후에를 23일 장악했고, 코친차이나의 사이공에서는 24일 남부 행정 위원회가 세워졌다. 일본군은 개입하지 않기로 했다. 25일 바오다이 황제가 퇴위를 알렸고 30일 후에에서 옥새와 보검을 넘기면서 응우옌 왕조의 황제 자리가 끝났다. 그는 퇴위하며 노예 나라의 황제보다 독립 나라의 시민이 낫다고 밝혔고 시민 빈투이로 새 정부의 고문이 되었다. 28일 임시 정부가 성립했고, 9월 2일 호찌민이 하노이 바딘 광장에서 베트남 민주 공화국의 독립을 선언했다. 선언문은 모든 사람은 평등하게 태어났다는 구절로 시작하며 미국 독립 선언과 프랑스 인권 선언의 구절을 인용하고, 기근으로 200만 명이 죽은 책임을 프랑스와 일본에 물었다(「3월 9일 정변과 베트남 제국, 북부 기근(1945)」(앞의 사건)). 그러나 7월 포츠담에서 연합국이 정한 대로 16도선 북쪽은 9월 중순부터 들어온 중화민국군이, 남쪽은 영국군이 일본군의 무장을 해제하러 들어왔다. 영국군 사령관 그레이시가 9월 중순 사이공에 들어온 뒤 9월 23일 프랑스가 사이공에서 권력을 되찾으려 움직였다. 이후의 전쟁은 「제1차 인도차이나 전쟁의 시작과 프랑스 연합(1946~1950)」(뒤의 사건)으로 이어진다."
  subjects: [vietnam, annam-protectorate, tonkin-protectorate, cochinchina, japan, france]
  tags: [politics, war]
  sources: ["David G. Marr, Vietnam 1945: The Quest for Power (University of California Press, 1995)", "Stein Tønnesson, The Vietnamese Revolution of 1945: Roosevelt, Ho Chi Minh and de Gaulle in a World at War (SAGE, 1991)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]

- id: indonesia-proclamation-1945
  year: 1945
  title:
    ko: "인도네시아 독립 선언(1945)"
  summary:
    ko: "1944년 9월 7일 일본의 고이소 총리가 인도네시아에 장차 독립을 허락하겠다고 밝혔고, 1945년 봄 독립 준비 조사회가 만들어졌다. 5~6월 회의에서 수카르노는 6월 1일 판차실라(민족주의, 국제주의, 민주주의, 사회 복지, 신에 대한 믿음)를 국가 이념으로 내놓았고, 합의 과정을 거쳐 순서와 문구가 바뀐 다섯 원칙이 1945년 헌법 서문에 실렸다. 8월 7일 독립 준비 위원회가 생겼고, 9일 수카르노와 하타는 베트남 달랏에서 데라우치 원수에게 독립 약속을 받았다. 15일 일본이 항복하자 젊은 활동가들은 일본의 허락을 기다리지 말고 선언하라고 요구하며 16일 두 사람을 렝가스덴클록으로 데려갔다가, 협상 끝에 자카르타로 돌아와 마에다 제독의 집에서 문안을 다듬었다. 8월 17일 오전 10시 수카르노가 페가싱안 동로 56번지 자택에서 하타와 함께 짧은 문안으로 독립을 선언했다. 날짜는 일본 기원 2605년의 05로 적혔다. 18일 위원회가 1945년 헌법을 채택하고 수카르노를 대통령, 하타를 부통령으로 뽑았다. 네덜란드는 네덜란드령 동인도를 되찾으려 했으므로 이를 인정하지 않았다. 9월 말 연합군이 자와에 들어오자 10월 25일 수라바야에 영국령 인도군 약 6천 명이 상륙했고, 30일 맬러비 준장이 죽은 뒤 11월 10일 영국군이 총공격에 나서 약 3주 동안 싸움이 이어졌다. 인도네시아 쪽 사망자는 6천 3백~1만 5천 명(1만 6천 명 넘는다는 추산도 있음)이고 약 20만 명이 도시를 떠났다. 이날은 지금도 영웅의 날로 기린다. 네덜란드는 2023년에야 8월 17일을 독립일로 인정했으나 주권 이양은 1949년으로 본다. 이어진 싸움은 「인도네시아 독립 전쟁(1946~1949)」(뒤의 사건)에서 다루고, 같은 시기 여러 식민지의 독립은 「인도의 독립과 탈식민지화의 시작」(뒤의 사건)에서 이어진다."
  subjects: [indonesia, dutch-east-indies, japan, uk, netherlands]
  tags: [politics, war]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 3rd ed., 2001)", "Benedict R. O'G. Anderson, Java in a Time of Revolution: Occupation and Resistance, 1944–1946 (Cornell University Press, 1972)", "Robert Cribb, Gangsters and Revolutionaries: The Jakarta People's Militia and the Indonesian Revolution, 1945–1949 (Asian Studies Association of Australia, 1991)"]
