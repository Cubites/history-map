- id: japanese-occupation-1942
  year: 1942
  endYear: 1945
  title:
    ko: "일본의 동남아 점령(1942~1945)"
  summary:
    ko: "일본군은 1942년 초 동남아 대부분을 차지하고 군정을 폈다. 육군 제25군이 말레이와 수마트라를, 제16군이 자와를 맡았고 해군이 보르네오·술라웨시·몰루카를 다스렸다. 네덜란드령 동인도의 바타비아는 1942년 자카르타로, 해협 식민지의 싱가포르는 쇼난으로 이름이 바뀌었다. 라오스와 캄보디아를 포함한 프랑스령 인도차이나는 비시 프랑스의 행정이 1945년 3월까지 이어졌고(「일본의 프랑스령 인도차이나 진주(1940~1941)」(앞의 사건)), 타이는 도쿄 조약(「프랑스–타이 전쟁과 도쿄 조약(1940~1941)」(앞의 사건))으로 얻은 땅을 지닌 채 동맹으로 일본에 협력했다. 일본은 석유·고무·쌀을 가져가고 동남아 사람을 강제로 동원했다. 자와에서는 400만~1천만 명이 일에 동원되었고 그중 20만~50만 명이 자와 밖으로 보내졌다는 추산이 있다. 타이–버마 철도(415km)는 1942년 9월 착공해 1943년 10월 17일 이어졌는데, 동남아 노동자 25만 명 이상이 동원되어 9만 명 넘게 죽었고 연합군 포로 약 6만 명 가운데 약 1만 2천 명이 죽었다. 이 포로 감시원으로 조선인 군속 3천여 명이 배치되기도 했다. 일본은 호응을 얻으려 독립을 내걸었다. 1943년 8월 1일 바 모를 국가 원수로 한 버마국, 10월 14일 호세 라우렐이 대통령인 제2 필리핀 공화국이 세워졌고, 11월 5~6일 도쿄의 대동아 회의에 두 사람과 타이 대표가 참석했다. 그 사이 8월 타이는 일본의 승인으로 말레이 북부 크다·프를리스·클란탄·트렝가누와 샨 국의 켕퉁·몽판을 편입했으나 1945년 8월 일본의 항복과 함께 물러났다. 자와에서는 1943년 조국 방위군이 만들어졌고 1944년 9월 7일 고이소 총리가 인도네시아에 장차 독립을 허락한다고 밝혔다. 필리핀에서는 1942년 3월 후크발라합 같은 게릴라가 일어났고, 1945년 2월 미군의 마닐라 탈환전에서 민간인 약 10만 명이 죽었다. 군정은 1945년 8월 15일 항복으로 끝났다(「일본의 동남아 침공과 싱가포르 함락(1941~1942)」(앞의 사건))."
