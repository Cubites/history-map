- id: franco-thai-war-1940
  year: 1940
  endYear: 1941
  title:
    ko: "프랑스–타이 전쟁과 도쿄 조약(1940~1941)"
  summary:
    ko: "1940년 6월 프랑스가 독일에 항복하자 타이의 피분송크람 정부는 1893년·1904년·1907년에 프랑스에 내준 메콩강 유역(1893년은 왼쪽, 1904년은 오른쪽 기슭)과 캄보디아 서북부를 되찾을 기회로 보았다. 1939년 나라 이름을 타이로 바꾼 피분송크람은 타이족 모두의 나라를 내세우며 신문과 집회로 잃은 땅을 되찾자는 여론을 일으키고 있었다. 프랑스령 인도차이나는 총독 드쿠가 비시 정부 아래에서 지휘했다. 프랑스와 6월 12일 불가침 조약을 맺고도 타이는 비시 정부가 땅 반환을 거부하자 1940년 가을부터 국경을 넘어 공격과 폭격을 이어 갔다. 일본이 북부에 진주(「일본의 프랑스령 인도차이나 진주(1940~1941)」(앞의 사건))한 뒤라 프랑스는 압력에 약했다. 육지에서는 타이군이 우세한 곳이 많았고 프랑스군은 1월 국경에서 반격했으나 1941년 1월 17일 꼬창 앞바다 해전에서는 프랑스 함대가 전술적으로 이겼다. 일본은 두 나라를 중재하며 1월 28일 휴전을 이끌어 냈고, 5월 9일 도쿄에서 조약이 맺어졌다. 프랑스는 캄보디아의 바탐방과 시엠레아프 일대, 라오스의 메콩강 오른쪽 기슭 두 곳을 타이에 넘겼다. 타이는 이 땅을 프라타봉, 피분송크람, 란창, 참파삭 같은 새 주로 편성했다. 1904·1907년 조약으로 잃은 땅 대부분을 되찾은 셈이었으나 일본의 압력 아래 이루어져 자유 프랑스는 인정하지 않았다(「1904년 파리 조약과 1907년 방콕 조약(1904~1907)」(앞의 사건)). 1941년 12월 일본군이 타이에 상륙해 21일 동맹이 맺어지면서 타이는 일본 편에 섰고, 전쟁이 끝난 1946년 유엔 가입을 앞두고 연합국의 압력 속에 이 땅을 프랑스에 돌려주었다."
  subjects: [thailand, laos, cambodia, france, japan]
  links:
    - { from: france, to: thailand, note: "도쿄 조약으로 캄보디아·라오스 일부를 넘김 (1941)" }
  tags: [war, diplomacy]
  sources: ["E. Bruce Reynolds, Thailand and Japan's Southern Advance, 1940–1945 (St. Martin's Press, 1994)", "David K. Wyatt, Thailand: A Short History (Yale University Press, 2nd ed., 2003)"]
  places: [{ name: 꼬창 해전, at: [102.35, 12.0], year: 1941 }]

- id: japanese-invasion-1941
  year: 1941
  endYear: 1942
  title:
    ko: "일본의 동남아 침공과 싱가포르 함락(1941~1942)"
  summary:
    ko: "1941년 12월 8일 일본 육군 제25군이 말레이 반도 북동 해안의 코타바루와 타이 남부 송클라·파타니에 상륙했고, 같은 날 일본은 하와이 진주만의 미국 해군 기지를 공격해 태평양 전쟁이 시작되었다(「태평양 전쟁 발발」(앞의 사건)). 타이는 몇 시간 저항하다 일본군의 통과를 허용했고 12월 21일 동맹을 맺었다. 12월 10일 일본 육상 항공대가 영국 전함 프린스 오브 웨일스와 순양전함 리펄스를 가라앉혀 영국의 해군력은 동남아에서 사라졌다. 야마시타 도모유키가 이끈 3만~3만 6천 명의 일본군은 자전거와 전차로 영국·인도·오스트레일리아군을 거듭 우회해 1942년 1월 11일 쿠알라룸푸르를 얻었고, 1월 31일 조호르 해협 건너 싱가포르 앞에 이르렀다. 영국의 해협 식민지에 속한 싱가포르는 2월 8~9일 해협을 건넌 일본군 앞에서 2월 15일 아서 퍼시벌 중장이 약 8만 명과 함께 무조건 항복했다. 말레이에서 잡힌 5만 명을 더하면 포로가 약 13만 명이었다. 일본은 싱가포르를 쇼난이라 불렀고, 중국계 주민을 가려내 죽인 숙청으로 추산 5천~5만 명이 죽었다. 12월 16일에는 보르네오 북부 사라왁에, 25일에는 홍콩에 일본군이 닿았다. 미국령 필리핀에서는 12월 8일 클라크 공군 기지 폭격과 22일 링가옌 상륙 뒤 맥아더가 바탄으로 물러났다가 3월 호주로 떠났고, 1942년 1월 2일 마닐라가 점령되었으며 4월 9일 바탄, 5월 코레히도르가 항복했다. 네덜란드령 동인도에서는 2월 27일 자와해 해전에서 연합 함대가 무너지고 3월 9일 네덜란드군이 항복했다. 영국령 버마에서는 3월 랑군(지금 양곤)이 함락되었다."
