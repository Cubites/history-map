- id: burma-campaign-1944
  year: 1944
  endYear: 1945
  title:
    ko: "임팔 작전과 버마 탈환(1944~1945)"
  summary:
    ko: "1942년 일본에 쫓겨 영국령 인도로 물러난 영국은 1944년 3월 일본 제15군(무타구치 렌야)의 선제 공세 우고 작전과 맞섰다. 일본군은 인도 아삼 쪽의 임팔과 코히마를 차지해 버마 방어를 굳히려 했고, 수바스 찬드라 보스의 인도 국민군 두 여단이 함께했다. 영국 쪽에서 코히마 수비대는 일본 제31사단의 공격을 4월 3~16일 버텼다. 그러나 보급선이 지나치게 늘어난 일본군은 4월 코히마 능선에서 막혔고 임팔 평원 둘레의 방어선도 뚫지 못했다. 6월 22일 코히마–임팔 도로가 열려 포위가 풀렸고 무타구치는 7월 3일 작전을 중지했다. 일본군은 굶주림과 질병 속에 친드윈강 쪽으로 물러나며 사상자 6만여 명(사망 1만 3천~3만 명 이상으로 자료가 갈림)을 냈고, 영국·인도군 사상자는 약 1만 7천 명이었다. 한국광복군도 영국군의 요청으로 이 전선에 선전 공작대를 보냈다(「한국광복군의 연합 작전과 국내 진공 작전 준비」(앞의 사건)). 윌리엄 슬림의 영국 제14군은 1945년 초 이라와디강을 건너 3월 메이크틸라에서 일본군 후방을 끊었고, 5월 2일 몬순이 시작되기 직전 랑군(지금 양곤)을 거의 저항 없이 되찾았다. 미국·중국군은 북쪽에서 레도 도로를 열며 1944년 8월 미치나를 얻었다. 아웅 산은 1940년 일본으로 건너가 서른 동지로 훈련받고 1941~1942년 일본군과 함께 버마에 들어왔다. 그러나 일본이 세운 버마국 아래에서 그가 이끈 버마 국민군은 1944년 8월 비밀리 결성된 반파시스트 단체(뒤의 반파시스트 인민 자유 연맹)와 손잡고 1945년 3월 27일 일본에 맞서 일어났다. 바 모는 일본으로 달아났다."
  subjects: [british-burma, british-raj, uk, japan]
