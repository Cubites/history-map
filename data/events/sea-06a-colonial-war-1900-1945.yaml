- id: siamese-revolution-1932
  year: 1932
  endYear: 1939
  title:
    ko: "시암의 입헌 혁명(1932~1939)"
  summary:
    ko: "1932년 6월 24일 새벽 방콕에서 인민당의 군인·문관 지도부가 무혈 쿠데타를 일으켜 짜끄리 왕조의 절대 군주제를 끝냈다(시암은 지금의 타이). 쭐랄롱꼰의 개혁(「쭐랄롱꼰의 개혁과 노예제 폐지(1868~1905)」(앞의 사건)) 이래 중앙집권 관료제가 자랐지만 대공황 속 재정난과 유학 출신 엘리트의 불만이 쌓였기 때문이다. 인민당은 독립, 안전, 경제, 평등, 자유, 교육의 여섯 원칙을 내세웠고, 쿠데타 때 국왕은 후아힌에 머물고 있었다. 문관 쪽의 중심은 파리에서 법을 공부한 쁘리디 파놈용이었고, 군 쪽의 중심은 쁘라야 파혼과 피분송크람이었다. 국왕 쁘라짜티뽁(라마 7세)은 6월 27일 잠정 헌법에 서명했고, 12월 10일 왕권을 조금 남긴 영구 헌법이 공포되었다. 임명된 의원 70명이 첫 의회를 이루었다. 첫 총리 쁘라야 마노빠꼰은 1933년 6월 군부 쿠데타로 물러나 쁘라야 파혼이 1938년까지 총리를 맡았다. 1933년 쁘리디의 경제 계획이 왕당파의 반발을 사 쁘리디는 프랑스로 떠났고, 10월 왕족 보워라뎃이 일으킨 왕당파 반란은 방콕 북쪽 돈므앙 앞에서 진압되었다. 1934년에는 쁘리디가 세운 탐마삿 대학이 문을 열었다. 1934년 영국으로 떠난 쁘라짜티뽁은 정부와 왕권의 제한을 두고 맞서다 1935년 3월 2일 퇴위했고, 스위스 로잔에서 공부하던 아홉 살 조카 아난타마히돈(라마 8세)이 즉위해 섭정단이 일을 맡았다. 1937년에는 처음으로 직접 선거가 치러졌다. 1938년 12월 피분송크람이 총리가 되어 군부 중심의 민족주의로 기울었고, 1939년 6월 24일 나라 이름이 시암에서 타이로 바뀌었다. 이름만 바뀐 같은 나라이다."
  subjects: [thailand]
  tags: [politics]
  sources: ["Benjamin A. Batson, The End of the Absolute Monarchy in Siam (Oxford University Press, 1984)", "David K. Wyatt, Thailand: A Short History (Yale University Press, 2nd ed., 2003)"]

- id: philippine-commonwealth-1934
  year: 1934
  endYear: 1941
  title:
    ko: "필리핀 연방(커먼웰스)의 출범(1934~1941)"
  summary:
    ko: "필리핀 안에서는 독립을 서두르라는 목소리가 컸고, 미국 안에서도 대공황 속에 필리핀산 설탕과 이민을 막으려는 이해가 맞물려 1934년 3월 24일 타이딩스–맥더피법(필리핀 독립법)이 통과되었다. 이에 앞서 1933년 하레–호스–커팅법은 케손이 이끈 필리핀 의회가 거부했다. 새 법은 10년의 이행기 동안 필리핀 연방 정부를 두고 1946년 7월 4일 독립을 주기로 했다. 필리핀 사람들이 만든 헌법을 1935년 5월 14일 국민 투표로 인준했고, 9월 16일 선거에서 에밀리오 아기날도를 누르고 마누엘 케손이 약 68%로 대통령, 세르히오 오스메냐가 부통령이 되었다. 연방은 1935년 11월 15일 마닐라에서 출범했다. 필리핀산 설탕과 코프라는 정해진 양 안에서 계속 관세 없이 미국에 들어갔다. 미국은 필리핀인의 미국 이민을 해마다 50명으로 제한하고 외교와 국방, 통화를 쥐었으며 고등판무관(프랭크 머피, 폴 맥너트, 프랜시스 세이어)을 두었다. 케손 정부는 1937년 여성 참정권과 타갈로그어를 바탕으로 한 국어 제정, 사회 정의 정책, 더글러스 맥아더를 군사 고문으로 삼은 방위군 창설에 힘썼다. 1935년 5월에는 중부 루손에서 소농이 중심이 된 사칼당 봉기로 약 1백 명이 죽었다. 1940년 헌법 개정으로 대통령 재선이 허용되어 케손은 1941년 약 82%로 이겼다. 1941년 12월 8일 일본군이 침공하면서 연방 정부는 1942년 망명길에 올랐고 독립의 일정은 전쟁 뒤로 미뤄졌다(「일본의 동남아 침공과 싱가포르 함락(1941~1942)」(뒤의 사건)). 앞 시기의 통치는 「미국의 필리핀 통치와 필리핀 의회(1901~1916)」(앞의 사건)에서 다룬다."
  subjects: [american-philippines, usa]
  links:
    - { from: usa, to: american-philippines, note: "연방 정부를 허용하고 10년 뒤 독립을 약속함 (1934)" }
  tags: [politics]
  sources: ["H. W. Brands, Bound to Empire: The United States and the Philippines (Oxford University Press, 1992)", "Stanley Karnow, In Our Image: America's Empire in the Philippines (Random House, 1989)"]

- id: japan-indochina-1940
  year: 1940
  endYear: 1941
  title:
    ko: "일본의 프랑스령 인도차이나 진주(1940~1941)"
  summary:
    ko: "1940년 6월 프랑스가 독일에 패하자 일본은 중국으로 가는 보급로를 끊는다며 프랑스령 인도차이나 총독 카트루에게 최후통첩을 보내고 곧 국경 검문과 기지 사용을 요구했다. 비시 정부는 7월 해군 제독 장 드쿠를 새 총독으로 보냈다. 9월 22일 하노이에서 프랑스와 일본이 협정을 맺었지만 일본군 일부가 합의 전에 국경을 넘으면서 22~26일 랑선과 동당 일대에서 전투가 벌어졌고 랑선 수비대는 25일 항복했다. 일본은 26일 하이퐁 남쪽에 상륙했으나 10월 5일 공식 사과했고 북부 주둔 병력은 처음 요구한 2만 5천 명에서 6천 명으로 제한되었다. 일본은 9월 27일 독일·이탈리아와 삼국 동맹을 맺었다. 같은 시기 북부 박선(9월)과 코친차이나(11월)에서 베트남 사람들이 봉기했고 프랑스가 이를 진압했다. 12월 9일 협정으로 프랑스는 군대와 행정권을 유지하되 일본군이 인도차이나를 기지로 쓰는 것을 허용했다. 1941년 7월 28일 일본은 남부 인도차이나에 진주했고(진주 병력은 4만~14만 명으로 자료가 갈린다. 공동 방위 의정서는 29일), 캄란만과 사이공 일대의 기지에서 말레이와 네덜란드령 동인도를 노렸다. 같은 시기 타이도 프랑스에 땅을 요구해 전쟁을 벌였다(「프랑스–타이 전쟁과 도쿄 조약(1940~1941)」(뒤의 사건)). 미국은 7월 26일 일본의 미국 내 자산을 동결하고 8월 석유 수출을 끊어 대응했다. 비시 프랑스가 행정을 맡고 일본이 군대를 두는 겹친 지배는 1945년 3월 9일 일본의 정변으로 끝난다(「3월 9일 정변과 베트남 제국, 북부 기근(1945)」(뒤의 사건)). 안남·통킹·코친차이나와 캄보디아·라오스의 왕들도 같은 틀 안에 있었다."
  subjects: [tonkin-protectorate, annam-protectorate, cochinchina, cambodia, laos, japan, france]
  links:
    - { from: japan, to: tonkin-protectorate, note: "북부에 진주함 (1940)" }
    - { from: japan, to: cochinchina, note: "남부에 진주함 (1941)" }
  tags: [war, politics]
  sources: ["Stein Tønnesson, The Vietnamese Revolution of 1945: Roosevelt, Ho Chi Minh and de Gaulle in a World at War (SAGE, 1991)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]
