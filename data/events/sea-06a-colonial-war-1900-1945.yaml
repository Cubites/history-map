- id: japanese-coup-indochina-1945
  year: 1945
  title:
    ko: "3월 9일 정변과 베트남 제국, 북부 기근(1945)"
  summary:
    ko: "비시 프랑스 아래 일본과 공존하던 인도차이나 총독부는 1944년 8월 파리가 해방되고 드골 정부가 들어서자 일본의 의심을 샀다(「일본의 프랑스령 인도차이나 진주(1940~1941)」(앞의 사건)). 1945년 3월 9일 저녁 일본군은 최후통첩을 총독 드쿠에게 내밀고 답을 얻지 못하자 인도차이나 전역에서 프랑스군과 행정부를 공격했다. 총독을 비롯한 프랑스 지도부는 대부분 붙잡혔다. 프랑스 쪽 약 4,200명이 죽고 1만 5천 명이 잡히거나 억류되었으며 일본은 사상자 약 1천 명을 냈고 인도차이나 민간인 5천 명 이상이 죽었다. 랑선에서만 유럽인 544명이 죽었고 그중 387명은 붙잡힌 뒤 처형되었다. 사바티에 장군의 통킹 사단은 중국 국경으로 물러났다. 일본은 3월 11일 후에의 바오다이 황제가 베트남 독립을 선언하게 했고, 4월에 역사학자 쩐 쫑 낌을 총리로 하는 베트남 제국이 세워졌고, 제국은 안남과 통킹을 다스렸으며 코친차이나는 8월에야 넘겨받았다. 캄보디아에서는 3월 시아누크 왕이, 라오스에서는 4월 8일 루앙프라방의 시사왕웡 왕이 독립을 선언했다. 이 정권들은 외교와 군사를 일본에 기댄 명목상의 독립이었고, 일본이 항복한 뒤 프랑스가 돌아오며 싸움이 이어졌다(「제1차 인도차이나 전쟁의 시작과 프랑스 연합(1946~1950)」(뒤의 사건)). 이 시기 북부 베트남에서는 1944년 10월부터 1945년 후반까지 큰 기근이 번졌다. 일본군과 프랑스 당국이 쌀을 의무로 사들이고 벼 대신 황마를 심게 했으며, 미군 폭격으로 철도가 끊겨 남쪽 쌀이 북으로 가지 못하고 1944년 8~9월 홍수로 제방도 터졌다. 사망자는 40만~200만 명으로 추산이 갈린다(1945년 5월 북부 20개 성 보고 약 40만, 프랑스 군 당국 10월 약 50만, 드쿠 회고록 약 100만, 호찌민은 독립 선언에서 200만). 베트민은 곡창을 습격하라고 농민을 이끌어 세력을 키웠다."
