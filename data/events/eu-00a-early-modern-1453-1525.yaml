  sources: ["Colin Imber, The Ottoman Empire, 1300–1650 (2002)", "Brian L. Davies, Warfare, State and Society on the Black Sea Steppe, 1500–1700 (2007)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
