# 유럽 근세 사건 2차 묶음 (1): 콘스탄티노폴리스 함락에서 프로이센 공국까지 (1453 ~ 1525, 작업 EVD2)
# 범위: 오스만의 콘스탄티노폴리스 정복과 발칸·아나톨리아 진출, 백년 전쟁의 끝과 장미 전쟁, 인쇄술, 부르고뉴 전쟁,
#   이반 3세·바실리 3세의 루스 통합, 에스파냐의 통합과 그라나다 함락, 신항로 개척(유럽 쪽 서술), 이탈리아 전쟁과 르네상스,
#   셀림 1세·술레이만 1세의 정복, 루터의 종교 개혁, 카를 5세, 칼마르 동맹의 해체, 독일 농민 전쟁, 프로이센 공국.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 지도에 있는 나라가 생기고 끝난 일(세르비아 전제공국 1459·모레아 1460·트레비존드 1461·
#   보스니아 1463·레저 동맹 1479·에스파냐 1479·부르고뉴 1482·헤르체고비나 1482·노브고로드 1478·트베리 1485·그라나다 1492·
#   나폴리 왕국 1501·나바라 1512·로도스 기사단국 1522·칼마르 동맹 1523·튜턴 기사단국 1525 등)을 더함 (docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 인쇄술은 고려의 『직지심체요절』(04번)과 견주어 서술에서만 언급했다.
# 동로마(비잔티움) 제국은 1453년 5월 멸망해 지도 항목이 없으므로(EUROPE_DRAFT.md 7.9 D4-⑭) subjects에 넣지 않고 서술로 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 9~10일 차이가 나므로 달까지만 적는다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다.
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본). 운영자 검수 필요.

# ── 1453년: 비잔티움의 끝과 백년 전쟁의 끝 (1453 ~ 1466) ──────

- id: constantinople-1453
  year: 1453
  title:
    ko: 콘스탄티노폴리스 함락과 비잔티움 제국의 멸망
  summary:
    ko: "오스만 제국의 술탄 메흐메트 2세는 1453년 4월부터 수만 명의 대군과 큰 대포로 비잔티움(동로마) 제국의 수도 콘스탄티노폴리스를 에워쌌다. 황제 콘스탄티노스 11세의 수비군은 7천 명 안팎이었고, 제노바의 용병대장 주스티니아니가 데려온 병사와 베네치아 거류민도 성벽을 지켰다. 오스만군은 거포로 육지 쪽 성벽을 두드리고 배를 언덕 너머로 끌어 금각만에 들여보냈으며, 5월 말 총공격으로 도시를 함락했다. 황제는 마지막 싸움에서 죽은 것으로 전하며, 오스만군은 사흘 동안 도시를 약탈하며 많은 주민을 죽이거나 노예로 끌고 갔다. 메흐메트 2세는 도시를 새 수도(이스탄불)로 삼아 다른 곳의 주민을 옮겨 살게 하고, 정교회 총대주교를 세워 정교도 공동체를 맡겼다. 천 년 넘게 이어진 비잔티움 제국은 이로써 끝났고, 남은 모레아 전제공국과 트레비존드 제국도 몇 해 뒤 정복되었다. 동지중해 무역의 길목을 오스만이 쥐자 베네치아와 제노바는 술탄과 협상해 상권을 지키려 했다. 비잔티움 학자 일부가 고전 사본을 들고 이탈리아로 건너간 일(함락 전부터 이어짐)은 르네상스 인문주의에 힘을 보탰다."
  subjects: [ottoman, venice, genoa]
  tags: [war, politics]
  sources: ["스티븐 런치만, 『1453 콘스탄티노플 최후의 날』(이순호 옮김, 갈라파고스, 2004)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
