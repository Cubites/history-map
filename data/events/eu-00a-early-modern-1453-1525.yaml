- id: vasily3-1510
  year: 1510
  endYear: 1522
  title:
    ko: 바실리 3세의 프스코프·스몰렌스크·랴잔 병합
  summary:
    ko: "이반 3세의 아들 바실리 3세(재위 1505~1533)는 아버지의 통합 사업을 이어, 1510년 프스코프 공화국의 민회 종을 떼어 가고 모스크바 대공국에 합쳤으며 유력 가문 300가구를 모스크바 쪽으로 옮겼다. 리투아니아 대공국과는 이반 3세 때의 전쟁(1500~1503)으로 세베르스크 땅을 얻은 데 이어 다시 싸워(1512~1522), 1514년 7월 스몰렌스크를 차지했다. 같은 해 9월 폴란드 왕을 겸한 지그문트 1세의 리투아니아·폴란드 왕국 연합군이 오르샤 전투에서 모스크바군을 크게 무찔렀으나 스몰렌스크는 되찾지 못했고, 1522년 휴전으로 모스크바가 스몰렌스크를 지켰다. 1521년에는 크림 칸국과 손잡으려던 랴잔 대공국도 합쳤다. 같은 해 크림 칸 메흐메트 1세 기레이가 카잔 칸국의 군대와 함께 모스크바 가까이까지 쳐들어와 많은 주민을 포로로 끌고 갔다. 이로써 모스크바는 북동 루스를 거의 하나로 묶었다."
  subjects: [grand-duchy-of-moscow, pskov-republic, lithuania-grand-duchy, poland-kingdom, ryazan, crimean-khanate, kazan-khanate]
