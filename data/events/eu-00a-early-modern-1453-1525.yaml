- id: ottoman-mamluk-1485
  year: 1485
  endYear: 1491
  title:
    ko: 오스만-맘루크 전쟁과 카라만 베이국의 끝
  summary:
    ko: "바예지트 2세가 술탄이 되자(1481) 동생 젬이 이집트의 맘루크 술탄국으로 달아났고, 두 나라는 킬리키아에서 말라티아에 이르는 아나톨리아 남동부의 튀르크멘 베이국들(카라만·둘카디르·라마잔)을 두고 다투었다. 메흐메트 2세가 1468~1474년 카라만 베이국의 중심지를 차지한 뒤에도 카라만 가문의 후손들은 맘루크의 보호를 받으며 킬리키아 쪽에서 버텼다. 1485년 둘카디르의 베이 보즈쿠르트가 오스만의 지원을 받아 맘루크의 말라티아를 치면서 전쟁이 시작되었다. 오스만군은 카라괴즈 메흐메트 파샤의 지휘로 킬리키아의 요새 몇 곳을 차지했으나, 1486년 2월과 3월 아다나 근처에서 맘루크 술탄 카이트바이(재위 1468~1496)의 군대에 잇따라 져 헤르세크자데 아흐메트 파샤가 붙잡혔다. 1487년 대재상 코자 다우드 파샤는 큰 군대를 이끌고도 맘루크와 맞서지 않고 튀르크멘 부족의 반란을 눌렀다. 카라만 베이국의 마지막 베이 투르구트오울루 마흐무드 2세(재위 1483~1487) 때 카라만 가문의 나라가 1487년 무렵 끝나 오스만은 그 땅에 카라만 에얄레트를 두었다(끝나는 과정은 자료마다 다르다. 지도는 카라만을 1474년까지만, 둘카디르를 오스만 종주 아래 있던 1515~1521년만 그리므로 이 사건 기간의 지도에는 두 항목의 땅이 없다). 1488년 8월 아다나 근처의 전투에서 맘루크가 이기고 아다나를 에워싸 차지했으며, 1490년 맘루크군이 카이세리를 에워쌌다가 물러났다. 두 나라는 기근과 역병, 비용에 지쳐 1491년 5월 강화해 국경을 퀼렉(킬리키아 문) 고개로 정하고 킬리키아 평원을 맘루크에 남겼다. 오스만은 맘루크를 이기지 못했으나 이 싸움에서 얻은 경험이 30여 년 뒤 셀림 1세의 맘루크 정복(「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 뒤의 사건)으로 이어졌다."
  subjects: [ottoman, karaman-beylik, dulkadir-beylik]
  tags: [war]
  sources: ["Carl F. Petry, Twilight of Majesty: The Reigns of the Mamlūk Sultans al-Ashrāf Qāytbāy and Qānṣūh al-Ghawrī in Egypt (1993)", "Colin Imber, The Ottoman Empire, 1300–1650 (2002)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
  places: [{ name: "아다나", at: [35.32, 37.0], year: [1486, 1488] }]

- id: cyprus-venice-1473
  year: 1473
  endYear: 1489
  title:
    ko: 카테리나 코르나로와 키프로스의 베네치아 편입
  summary:
    ko: "키프로스 왕국은 1192년 뤼지냥 가문이 세운 섬 왕국으로 1426년부터 맘루크 술탄국에 공물을 바쳤다. 1458년 요한 2세가 죽자 그의 딸 샤를로트와 서자 자크 2세가 왕위를 두고 다투었고, 맘루크의 인정을 받은 자크가 1464년 무렵까지 샤를로트를 몰아냈다. 그는 베네치아와 손잡으려 1468년 7월 베네치아 귀족의 딸 카테리나 코르나로와 대리 혼인을 맺었다(1472년 11월 키프로스에서 직접 혼례). 베네치아는 카테리나를 공화국의 딸로 삼아 섬에 영향력을 키웠다. 자크 2세가 1473년 죽고 갓난 아들 자크 3세도 1474년 죽자 카테리나가 여왕이 되었으나 실권은 베네치아가 보낸 감독관들이 쥐었다. 1488년 베네치아는 오스만의 바예지트 2세가 섬을 노릴 것과 나폴리 왕가가 카테리나를 혼인시켜 섬을 차지하려는 움직임을 걱정해 그녀를 불러들이고 섬을 합치기로 했다. 카테리나는 1489년 2월 권리를 도제(베네치아 공화국의 원수)에게 넘기고 3월 섬을 떠나 아솔로 영주 칭호를 받았다(왕비 칭호는 유지). 지도는 1489년부터 키프로스를 베네치아 땅으로 그린다. 섬은 1570~1571년 오스만에 정복되었다(「오스만의 키프로스 정복과 레판토 해전」, 뒤의 사건)."
  subjects: [cyprus-kingdom, venice, ottoman, naples-kingdom]
  links:
    - { from: venice, to: cyprus-kingdom, note: "카테리나의 양위와 편입 (1489)" }
  tags: [politics]
  sources: ["Kenneth M. Setton, The Papacy and the Levant (1204–1571), Vol. 2 (1978)", "로저 크롤리, 『부의 도시, 베네치아』(우태영 옮김, 다른세상, 2012)"]

- id: granada-1492
  year: 1492
  title:
    ko: 그라나다 함락과 레콩키스타의 끝, 유대인 추방
  summary:
    ko: "1481년 말 그라나다 에미르국의 군대가 카스티야의 국경 도시 사아라를 기습해 주민을 포로로 끌고 가자, 이듬해 카스티야가 알아마를 빼앗으며 그라나다 전쟁(1482~1491)이 시작되었다. 나스르 왕가의 내분(무함마드 12세 보압딜과 숙부의 다툼)을 이용한 에스파냐의 가톨릭 공동 왕은 론다(1485)·말라가(1487)·바사·알메리아(1489)를 차례로 빼앗았고, 말라가를 함락한 뒤에는 주민 대부분을 노예로 삼았다. 1491년 11월 그라나다 조약에 따라 1492년 1월 초 보압딜이 그라나다를 넘기며, 711년부터 이어진 이베리아반도의 이슬람 왕국이 사라지고 레콩키스타(국토 회복 운동)가 끝났다. 조약은 무슬림의 신앙과 재산을 보장했으나 1499년부터 강제 개종이 이루어져 알푸하라스 반란(1499~1501)이 일어났고, 1502년 카스티야는 무슬림에게 개종과 추방 가운데 하나를 고르게 했다. 1492년 3월에는 알람브라 칙령으로 개종하지 않은 유대인을 7월 말까지 내보내기로 해, 수만 명이 포르투갈·북아프리카·이탈리아·오스만 제국으로 떠났다(학자에 따라 4만~10만 명, 카먼 등)."
  subjects: [spain, granada]
  links:
