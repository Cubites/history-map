- id: stockholm-bloodbath-1520
  year: 1520
  endYear: 1524
  title:
    ko: 스톡홀름 피바다와 구스타브 바사, 칼마르 동맹의 해체
  summary:
    ko: "칼마르 동맹(1397)으로 덴마크·노르웨이와 한 왕을 받든 스웨덴은 15세기 중엽부터 대부분 스투레 가문 등의 섭정이 따로 다스렸다. 동맹의 왕인 덴마크의 크리스티안 2세는 1520년 섭정 스텐 스투레(소)를 무찌르고 11월 스톡홀름에서 스웨덴 왕으로 대관했으나, 며칠 뒤 대주교 구스타브 트롤레와 함께 반대파 귀족·성직자·시민 80여 명을 이단으로 몰아 처형했다(스톡홀름 피바다). 이때 아버지를 잃은 귀족 구스타브 에릭손(바사)이 달라르나 농민을 모아 봉기했고, 뤼베크의 도움으로 덴마크군을 몰아내 1523년 6월 스웨덴 왕(구스타브 1세)으로 뽑혔다. 같은 해 덴마크에서도 크리스티안 2세가 귀족에게 쫓겨나고 숙부 프레데리크 1세가 왕이 되어 덴마크-노르웨이로 이어졌으며, 1524년 말뫼 협정으로 두 왕은 서로를 인정해 칼마르 동맹이 끝났다. 구스타브 1세는 1527년 베스테로스 의회에서 교회 재산을 거두어들여 루터파 종교 개혁을 시작하고 왕권을 다졌다."
  subjects: [kalmar-union, sweden-medieval, sweden-kingdom, denmark-norway]
  links:
    - { from: kalmar-union, to: sweden-medieval, note: "크리스티안 2세의 정복, 스톡홀름 피바다 (1520)" }
    - { from: denmark-norway, to: sweden-kingdom, note: "말뫼 협정, 구스타브 1세 인정 (1524)" }
  tags: [politics, war]
  sources: ["Michael Roberts, The Early Vasas: A History of Sweden 1523–1611 (1968)"]

- id: peasants-war-1524
  year: 1524
  endYear: 1525
  title:
    ko: 독일 농민 전쟁
  summary:
    ko: "루터의 종교 개혁이 퍼지던 1524년 여름 신성 로마 제국 남서부에서 시작된 농민 봉기는 1525년 봄 슈바벤·프랑켄·튀링겐·알자스·티롤로 번졌다. 농민들은 1525년 3월 「12개 조항」에서 성서를 근거로 농노제 폐지, 숲·사냥·어로의 권리, 십일조의 바른 사용과 목사 선출권을 요구했다. 1525년 4월 바인스베르크에서 봉기군이 헬펜슈타인 백작과 기사들을 붙잡아 창을 든 대열 사이로 달리게 해 죽였고, 곳곳에서 수도원과 성이 불타고 약탈되었다. 처음에 농민의 요구에 일부 공감하던 루터는 봉기가 과격해지자 「살인하고 강도질하는 농민 무리에 반대하여」를 써서 제후들에게 진압을 촉구했다. 슈바벤 동맹과 제후들의 군대는 곳곳에서 봉기군을 무찔렀고(1525년 5월 프랑켄하우젠에서는 헤센·작센 제후군이 토마스 뮌처가 이끈 봉기군을 무찌름), 달아나거나 항복한 농민까지 학살했고, 뮌처는 처형되었다. 봉기와 진압으로 7만~10만 명이 죽은 것으로 추산된다(학자에 따라 더 많이 보기도 함). 이 뒤로 루터파 종교 개혁은 제후가 이끄는 방향으로 나아갔다."
  subjects: [holy-roman-empire]
  tags: [war, society]
  sources: ["「12개 조항」(1525)", "마르틴 루터, 「살인하고 강도질하는 농민 무리에 반대하여」(1525)", "Peter Blickle, The Revolution of 1525 (1981)"]
  places: [{ name: "프랑켄하우젠", at: [11.1, 51.36], year: 1525 }]

- id: ducal-prussia-1525
  year: 1525
  title:
    ko: 크라쿠프 조약과 프로이센 공국
  summary:
    ko: "튜턴 기사단국은 13년 전쟁 뒤 폴란드 왕의 봉신이 되었으나 신하의 맹세를 미루었고, 단장 알브레히트(호엔촐레른 가문, 폴란드 왕 지그문트 1세의 조카)는 폴란드 왕국과 다시 싸웠다(1519~1521). 휴전 중 루터의 권유를 받은 알브레히트는 1525년 4월 크라쿠프 조약으로 기사단국을 세속 공국으로 바꾸고 스스로 세습 공작이 되어 폴란드 왕에게서 봉토로 받았다. 그는 크라쿠프 광장에서 지그문트 1세에게 신하의 예를 올렸고(프로이센의 신종), 프로이센 공국은 루터파를 공식 종교로 삼은 첫 나라가 되었다. 공국은 1618년 같은 호엔촐레른 가문의 브란덴부르크 선제후에게 넘어가 뒷날 프로이센 왕국의 뿌리가 되었다."
  subjects: [teutonic-order, ducal-prussia, poland-kingdom]
  links:
    - { from: poland-kingdom, to: ducal-prussia, note: "크라쿠프 조약, 봉토로 줌 (1525)" }
  tags: [politics, diplomacy]
  sources: ["「크라쿠프 조약」(1525)", "크리스토퍼 클라크, 『강철왕국 프로이센』(박병화 옮김, 마티, 2020)"]
