- id: muscovy-lithuania-1492
  year: 1492
  endYear: 1503
  title:
    ko: 이반 3세의 리투아니아 전쟁과 1494년 평화, 1503년 휴전
  summary:
    ko: "1492년 6월 폴란드 왕이자 리투아니아 대공이던 카지미에시 4세가 죽자 아들 알렉산데르가 리투아니아 대공이, 얀 1세 올브라흐트가 폴란드 왕이 되어 두 나라가 한 군주를 모시는 체제가 끊겼다. 이 틈에 이반 3세는 그해 8월 선전 포고 없이 오카강 상류의 므첸스크·류부츠크·세르페이스크·메샤브스크를 치고 뱌지마 공들의 땅을 공격했다. 정교도 공들은 종교 차별을 피해 모스크바 쪽으로 넘어왔고, 크림 칸 멩글리 기레이는 모스크바의 동맹이었다. 1493년 정식으로 전쟁이 시작되었으나 곧 끝나 1494년 2월 5일 영구 평화가 맺어졌다. 리투아니아는 뱌지마 공국과 오카강 상류 땅을 잃었고(약 8만 7천 km²로 추산), 알렉산데르는 이반 3세의 딸 옐레나와 약혼했다(혼인은 1495년). 1500년 5월 이반 3세는 폴란드·헝가리가 오스만과 싸우려 한 틈을 타 정교도 박해를 구실로 전쟁을 다시 일으켰다. 1500년 7월 14일 베드로샤 전투에서 대헤트만 콘스탄티 오스트로스키가 붙잡힐 만큼 리투아니아군이 크게 졌고, 리투아니아는 1501년 11월 므스티슬라우에서도 졌다(그해 12월 알렉산데르는 형 얀 1세를 이어 폴란드 왕도 겸했다). 1502년 크림 칸국이 리투아니아의 동맹이던 대오르다를 무너뜨렸고(「대오르다의 마지막 시기와 아스트라한 칸국」, 앞의 사건), 1502~1503년 무렵 크림군이 리투아니아의 슬루츠크 등을 약탈했다. 1503년 3월 25일 알렉산데르가 헝가리 왕 블라디슬라프 2세(알렉산데르의 형)에게 중재를 청해 맺은 6년 휴전으로 리투아니아는 체르니히우·노브호로드시베르스키·스타로두프 등 세베르스크 땅과 오카강 상류 땅을 잃었고(영토의 약 3분의 1, 21만 km² 안팎으로 추산) 이반 3세의 '전 루스의 군주' 칭호도 인정했다. 지도는 이 휴전에 맞춰 세베르스크와 브랸스크·토로페츠 일대(자료마다 휴전에서 넘어간 범위가 다름)를 모스크바 대공국 땅으로 그린다. 같은 1503년 랴잔에서는 이반 3세의 조카(누이 안나의 아들)인 분령 군주 표도르 바실리예비치가 자식 없이 죽으며 자기 땅을 이반 3세에게 남겼고(어린 랴잔 대공 이반 이바노비치(이반 5세)와 그 어머니가 이를 되돌리려다 실패했다), 툴라 일대(오카강 중류 남쪽, 랴잔 대공국의 서쪽 땅)도 이 무렵 모스크바에 합쳐졌다고 러시아 쪽 자료가 전한다. 지도는 이 근사로 랴잔의 땅을 1503년에 줄여 그린다(리투아니아와의 휴전과는 다른 일이며, 툴라가 이 유증에 들었는지는 확인하지 못했다. 랴잔 대공국 자체는 1521년 합쳐진다). 되찾으려는 리투아니아와 모스크바의 싸움은 바실리 3세 때 이어진다(「바실리 3세의 프스코프·스몰렌스크·랴잔 병합」, 뒤의 사건)."
  subjects: [grand-duchy-of-moscow, lithuania-grand-duchy, ryazan, crimean-khanate, poland-kingdom, golden-horde]
