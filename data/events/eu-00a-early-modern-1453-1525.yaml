- id: ottoman-balkans-1456
  year: 1456
  endYear: 1463
  title:
    ko: 메흐메트 2세의 발칸·흑해 정복
  summary:
    ko: "콘스탄티노폴리스를 차지한 메흐메트 2세는 발칸과 흑해 연안의 남은 나라들을 차례로 정복했다. 1456년 7월 그는 헝가리 왕국의 남쪽 관문 베오그라드를 에워쌌으나, 후녀디 야노시가 이끈 헝가리군과 수도사 카페스트라노의 요한이 모은 십자군에 막혀 물러났다(후녀디는 곧 전염병으로 죽음). 그러나 세르비아 전제공국은 1459년 수도 스메데레보를 내주어 무너졌고, 중부 그리스에서는 아차이우올리 가문의 아테네 공국이 1456년 아테네 시와 1458년 아크로폴리스를 잃어 끝났고(테베는 1460년까지 가문의 프랑코가 술탄의 신하로 다스림), 비잔티움 황족이 다스리던 모레아 전제공국(1460), 흑해 남쪽 기슭의 잔다르 베이국(시노프)과 트레비존드 제국(1461)도 차례로 오스만 제국에 넘어갔다. 1461년 겨울~1462년 왈라키아 공 블라드 3세는 도나우강 남쪽의 오스만 땅을 습격하고 많은 포로를 말뚝에 꿰어 죽이며 맞섰으나 1462년 메흐메트 2세의 원정에 쫓겨났다. 1463년에는 보스니아 왕국을 정복하고 항복한 마지막 왕 스테판 토마셰비치를 처형했으며, 같은 해 말 헝가리 왕 마티아스 코르비누스가 야이체를 되찾아 보스니아 북부를 지켰다. 오스만군은 정복지에서 많은 주민을 포로로 끌고 가거나 이스탄불로 옮겨 살게 했고, 그리스도교도 소년을 데려가 개종시켜 예니체리 등으로 키우는 데브시르메 제도를 넓혔다."
