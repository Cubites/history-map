- id: renaissance-1504
  year: 1504
  endYear: 1516
  title:
    ko: 르네상스의 전성기와 인문주의 (『군주론』·『유토피아』)
  summary:
    ko: "14세기 이탈리아에서 시작된 르네상스는 고대 그리스·로마의 학문과 예술을 되살려 인간과 현세의 삶을 중시한 문화 운동이었다. 상업과 금융으로 부를 쌓은 피렌체에서는 메디치 가문이 학자와 예술가를 후원했고, 15세기 말부터는 교황들이 로마를 새 중심지로 만들었다. 1504년 미켈란젤로의 「다비드」가 피렌체 시청 앞에 세워졌고, 레오나르도 다빈치는 이 무렵 「모나리자」를 그리기 시작했다. 교황 율리우스 2세는 성 베드로 대성당을 새로 짓기 시작하고(1506) 미켈란젤로에게 시스티나 예배당 천장화(1508~1512)를, 라파엘로에게 바티칸 궁의 벽화(「아테네 학당」)를 맡겼다. 1512년 8월 에스파냐군은 피렌체 근처 프라토를 약탈하며 주민 수천 명(당대 기록으로 2천~6천 명)을 죽였고, 이에 겁먹은 피렌체는 메디치 가문을 다시 받아들였다. 이때 공직을 잃은 피렌체의 마키아벨리는 1513년 『군주론』을 써서, 군주는 종교·도덕과 떨어져 나라를 지키는 힘과 계산으로 다스려야 한다고 주장했다. 알프스 북쪽에서는 성서와 초기 교회를 연구하는 인문주의가 일어나, 네덜란드 출신 에라스뮈스는 『우신 예찬』(1511)으로 성직자와 신학자의 위선을 풍자했고, 잉글랜드의 토머스 모어는 『유토피아』(1516)에서 사유 재산이 없는 이상 사회를 그려 당시 사회를 비판했다."
  subjects: [florence, papal-states, spain, habsburg-netherlands, england]
  tags: [culture]
  sources: ["니콜로 마키아벨리, 『군주론』(강정인·김경희 옮김, 까치, 2015)", "토머스 모어, 『유토피아』(주경철 옮김, 을유문화사, 2007)", "야콥 부르크하르트, 『이탈리아 르네상스의 문화』(안인희 옮김, 푸른숲, 1999)"]

- id: holy-league-1508
  year: 1508
  endYear: 1516
  title:
    ko: 캉브레 동맹과 신성 동맹 전쟁, 마리냐노 전투
  summary:
    ko: "1508년 12월 프랑스와 신성 로마 황제 막시밀리안 1세가 캉브레 동맹을 맺고 에스파냐와 교황 율리우스 2세가 가담해, 로마냐 등지로 세력을 넓힌 베네치아 공화국을 쳤다. 1509년 5월 아냐델로 전투에서 프랑스군에 진 베네치아는 본토 땅 대부분을 잃었다가 동맹이 갈라진 틈에 되찾았다. 프랑스의 힘이 커지자 율리우스 2세는 외국 군대를 이탈리아에서 몰아내자며 베네치아·에스파냐·잉글랜드·스위스와 신성 동맹(1511)을 맺었다. 프랑스군은 1512년 4월 라벤나 전투에서 이기고 도시를 약탈했으나 지휘관 가스통 드 푸아를 잃고 스위스군에 밀려 밀라노에서 물러났다. 같은 해 여름 에스파냐의 페르난도 2세는 프랑스와 가까운 나바라 왕국의 피레네산맥 남쪽 땅을 정복해 1515년 카스티야에 합쳤다. 1515년 9월 프랑스의 새 왕 프랑수아 1세는 마리냐노 전투에서 스위스 용병을 무찌르고 밀라노를 되찾았으며, 1516년 스위스와 영구 평화를, 교황 레오 10세와 볼로냐 정교 협약을 맺어 프랑스 주교의 임명권을 얻었다."
