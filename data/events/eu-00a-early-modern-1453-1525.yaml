- id: matthias-olomouc-1469
  year: 1469
  endYear: 1490
  title:
    ko: 마티아스 코르비누스의 보헤미아 전쟁과 올로모우츠 조약
  summary:
    ko: "헝가리 왕 마티아스 코르비누스(재위 1458~1490)는 후스파 왕 이르지 포데브라디를 치라는 교황의 부름에 따라 1468년 보헤미아로 쳐들어갔고, 1469년 올로모우츠에서 가톨릭 귀족들에게 보헤미아 왕으로 뽑혔다. 이르지가 죽고(1471) 폴란드 왕 카지미에시 4세의 아들 블라디슬라프 2세가 보헤미아 왕이 된 뒤에도 전쟁은 모라비아·슐레지엔·라우지츠를 두고 이어졌다. 1478년 브르노에서 맺은 강화에 이어 1479년 올로모우츠 조약에서 두 사람이 함께 보헤미아 왕을 칭하되 블라디슬라프는 보헤미아 본토를, 마티아스는 모라비아·슐레지엔·라우지츠를 갖기로 했고, 마티아스가 죽으면 블라디슬라프가 40만 플로린을 내고 되살 수 있게 했다. 지도는 이 해부터 세 땅을 헝가리 왕국 땅으로 그린다. 마티아스는 신성 로마 황제 프리드리히 3세와도 싸워 1485년 6월 빈을, 1487년 비너노이슈타트를 차지하고 오스트리아 세습령 동부까지 눌렀다(지도는 이 점령을 그리지 않는다). 그가 1490년 4월 빈에서 적자 없이 죽자 헝가리 귀족들은 7월 블라디슬라프 2세를 헝가리 왕으로 뽑았고, 그가 두 나라를 함께 다스리게 되면서 세 땅은 보헤미아 왕관으로 돌아갔다. 막시밀리안 1세(프리드리히 3세의 아들)는 오스트리아를 되찾았고, 1491년 프레스부르크(포조니) 조약으로 블라디슬라프가 후사 없이 죽으면 헝가리 왕위를 잇기로 했다(이 약속은 1526년 합스부르크가 헝가리 왕위를 잇는 근거의 하나가 됨)."
  subjects: [hungary-kingdom, bohemia-kingdom, habsburg-austria, holy-roman-empire, poland-kingdom]
  links:
