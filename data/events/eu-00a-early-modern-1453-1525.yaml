  tags: [war, politics]
  sources: ["Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)", "Miklós Molnár, A Concise History of Hungary (2001)"]

- id: ivan3-unification-1478
  year: 1471
  endYear: 1489
  title:
    ko: 이반 3세의 대페름·노브고로드 병합과 우그라강 대치
  summary:
    ko: "모스크바 대공국의 이반 3세(재위 1462~1505)는 루스의 공국과 도시 공화국을 하나씩 합쳤다. 리투아니아 대공국에 기대려던 노브고로드 공화국을 1471년 7월 셸론강 전투로 굴복시켰다. 8월 코로스틴 조약에서 노브고로드는 리투아니아와 손을 끊고 배상금을 내며 모스크바 대공의 종주를 인정했고, 조약이 적은 노브고로드 볼로스트 목록에는 백해 콜라반도 남쪽 기슭의 테르(테르스키 해안)도 들어 있었다(지도는 1471년부터 테르스키 해안을 노브고로드 땅으로 그린다). 또 노브고로드에 형식상 속해 있던 카마강 위쪽의 대페름(코미-페르먀크 공국)은 1472년 표도르 팔레츠키의 원정으로 모스크바 대공의 종주 아래 들었다(공 미하일 예르몰라예비치는 대공의 신하로 남아 1481년 죽었고 아들 마트베이가 이었으며, 공국은 1505년 총독이 보내지며 없어진다. 지도는 1472년부터 모스크바 땅으로 그린다). 이반 3세는 1478년 1월 노브고로드의 항복을 받아 민회(베체)의 종을 모스크바로 가져가고 자치를 없앴다. 이어 노브고로드의 귀족·상인 가문 수천 명을 다른 곳으로 옮기고 그 땅을 모스크바의 군인에게 나눠 주었다. 15세기에 킵차크 칸국에서는 카잔(1438 무렵)·크림(1441)·아스트라한(1466 무렵) 칸국이 갈라져 나가 볼가강·돈강 사이의 대오르다만 남아 있었다. 1480년 대오르다의 아흐마드 칸이 공물을 거부한 모스크바를 치려 리투아니아의 카지미에시 4세와 손잡고 쳐들어왔으나, 크림 칸국이 모스크바 편에서 리투아니아를 견제했고 리투아니아의 원군은 오지 않았다. 두 군대는 가을 내내 오카강의 지류 우그라강을 사이에 두고 맞서다 11월 아흐마드가 물러났다. 이 '우그라강 대치'로 모스크바는 2세기 넘게 이어진 몽골(타타르)의 지배에서 벗어난 것으로 본다. 이반 3세는 리투아니아와 손잡으려던 트베리 대공국을 1485년 9월 에워싸 합치고, 1487년 카잔 칸국을 쳐 자기 편 칸을 세웠으며, 1489년 뱌트카 땅도 차지했다. 그는 비잔티움 마지막 황제의 조카딸 소피아와 혼인하고(1472) 쌍두 독수리 문장을 쓰며 '전 루스의 군주'를 칭했다. 대오르다는 1502년 크림 칸에게 무너졌다."
  subjects: [grand-duchy-of-moscow, novgorod-republic, lithuania-grand-duchy, golden-horde, crimean-khanate, astrakhan-khanate, tver, kazan-khanate, vyatka, great-perm]
