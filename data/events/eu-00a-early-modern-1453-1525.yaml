# 유럽 근세 사건 2차 묶음 (1): 콘스탄티노폴리스 함락에서 프로이센 공국까지 (1453 ~ 1525, 작업 EVD2)
# 범위: 오스만의 콘스탄티노폴리스 정복과 발칸·아나톨리아 진출, 백년 전쟁의 끝과 장미 전쟁, 인쇄술, 부르고뉴 전쟁,
#   이반 3세·바실리 3세의 루스 통합, 에스파냐의 통합과 그라나다 함락, 신항로 개척(유럽 쪽 서술), 이탈리아 전쟁과 르네상스,
#   셀림 1세·술레이만 1세의 정복, 루터의 종교 개혁, 카를 5세, 칼마르 동맹의 해체, 독일 농민 전쟁, 프로이센 공국.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 지도에 있는 나라가 생기고 끝난 일(세르비아 전제공국 1459·모레아 1460·트레비존드 1461·
#   보스니아 1463·레저 동맹 1479·에스파냐 1479·부르고뉴 1482·헤르체고비나 1482·노브고로드 1478·트베리 1485·그라나다 1492·
#   나폴리 왕국 1501·나바라 1512·로도스 기사단국 1522·칼마르 동맹 1523·튜턴 기사단국 1525 등)을 더함 (docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 인쇄술은 고려의 『직지심체요절』(04번)과 견주어 서술에서만 언급했다.
# 동로마(비잔티움) 제국은 1453년 5월 멸망했다. 1400~1452년 지도에는 `byzantine-empire` 항목이 있어(EUROPE_DRAFT.md 8.7 M1-⑥, 작업 EVM1) 1453년 사건(`constantinople-1453`)의
#   subjects에 넣었고, 그 뒤 사건은 항목이 없어(D4-⑭) subjects에 넣지 않고 서술로 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 9~10일 차이가 나므로 달까지만 적는다.
