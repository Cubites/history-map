- id: great-horde-1466
  year: 1466
  endYear: 1502
  title:
    ko: 대오르다의 마지막 시기와 아스트라한 칸국
  summary:
    ko: "킵차크 칸국에서 카잔(1438 무렵)과 크림(1441)이 떨어져 나간 뒤 볼가강과 돈강 사이에 남은 칸국을 대오르다라 부른다. 칸 퀴췩 무함마드가 1459년 죽자 아들 마흐무드와 아흐마드가 갈렸고, 1465년 아흐마드가 형을 몰아내자 마흐무드는 볼가강 하구의 아스트라한으로 가 따로 자리 잡았다. 1466년 마흐무드가 아스트라한을 유산으로 주장한 편지가 남아 있어 이 해를 아스트라한 칸국의 시작으로 보며, 칸국을 세운 이는 마흐무드 또는 그의 아들 카심이라고 한다. 1470년 8월 대오르다 군(칸의 동생과 아들이 이끌었다고 전함)이 몰다비아의 슈테판 대공에게 리프니치에서 졌고(연도와 승패는 자료마다 갈린다), 아흐마드 칸은 1480년 우그라강 대치에서 모스크바를 굴복시키지 못해 물러났다(「이반 3세의 대페름·노브고로드 병합과 우그라강 대치」, 뒤의 사건). 그는 1481년 1월 시비르 칸국의 이박과 노가이 무리에게 도네츠강 어귀 가까이에서 죽임을 당했다. 이어 아들 무르타자와 샤이흐 아흐마드가 크림 칸국의 멩글리 기레이와 싸웠는데(1486~1491) 리투아니아가 대오르다를, 모스크바가 크림 칸국을 편들었다. 멩글리 기레이는 1502년 6월 대오르다의 수도 사라이를 약탈해 샤이흐 아흐마드를 몰아냈다. 샤이흐 아흐마드는 리투아니아로 달아났다가 갇혔고, 대오르다는 사라졌다. 그 땅은 크림 칸국과 노가이 오르다, 아스트라한 칸국이 나누어 차지해 갔다. 지도는 1466년 대오르다의 땅에서 아스트라한 일대(볼가강 하구와 서쪽 초원)를 떼어 아스트라한 칸국에 주고, 1502년 쿠반·아조프 쪽 초원을 크림 칸국에 붙이며, 나머지 볼가·돈 초원은 주인이 분명하지 않아 비워 둔다."
  subjects: [golden-horde, astrakhan-khanate, crimean-khanate, grand-duchy-of-moscow, lithuania-grand-duchy, nogai-horde, kazan-khanate, moldavia]
  links:
    - { from: astrakhan-khanate, to: golden-horde, note: "마흐무드의 분리 (1465~1466)" }
    - { from: lithuania-grand-duchy, to: golden-horde, note: "크림에 맞선 지원 (1486~1491)" }
    - { from: crimean-khanate, to: golden-horde, note: "사라이 약탈 (1502)" }
  tags: [war, politics]
  sources: ["Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (2002)", "Alan W. Fisher, The Crimean Tatars (1978)", "Janet Martin, Medieval Russia 980–1584 (2판, 2007)"]

- id: spain-union-1479
  year: 1479
  title:
    ko: 카스티야와 아라곤의 연합, 에스파냐의 성립
  summary:
    ko: "카스티야 왕국의 왕녀 이사벨과 아라곤 연합 왕국의 왕위 계승자이자 시칠리아 왕인 페르난도는 1469년 혼인했다. 1474년 이사벨이 카스티야 여왕에 오르자 엔리케 4세의 딸 후아나를 내세운 포르투갈의 아폰수 5세가 쳐들어와 카스티야 왕위 계승 전쟁이 벌어졌는데, 1479년 9월 알카소바스 조약으로 포르투갈은 이사벨의 왕위를 인정하고 대신 카나리아 제도를 뺀 대서양의 섬과 서아프리카 해안의 권리를 얻었다. 같은 해 페르난도가 아라곤 왕위를 이어 두 왕국이 같은 부부 왕(가톨릭 공동 왕) 아래 놓였다. 두 왕국은 의회·법·화폐를 따로 두었으나 외교와 전쟁을 함께 하며 에스파냐 통합의 바탕이 되었다. 부부 왕은 귀족을 누르고 도시 치안대(산타 에르만다드)를 두었으며, 교황의 허락(1478)을 받아 왕이 직접 관할하는 종교 재판소를 세웠다. 1480년 세비야에서 활동을 시작한 종교 재판소는 몰래 유대교를 지킨다고 의심받은 개종 유대인(콘베르소)을 주로 심문해, 1530년 무렵까지 약 2천 명을 화형에 처한 것으로 추산된다(카먼, 추산 폭이 큼)."
  subjects: [castile, aragon, spain, portugal]
  links:
    - { from: portugal, to: castile, note: "카스티야 왕위 계승 전쟁, 알카소바스 조약 (1479)" }
