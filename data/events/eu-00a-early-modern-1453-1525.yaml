- id: constantinople-1453
  year: 1453
  title:
    ko: 콘스탄티노폴리스 함락과 비잔티움 제국의 멸망
  summary:
    ko: "오스만 제국의 술탄 메흐메트 2세는 1453년 4월부터 수만 명의 대군과 큰 대포로 비잔티움(동로마) 제국의 수도 콘스탄티노폴리스를 에워쌌다. 황제 콘스탄티노스 11세의 수비군은 7천 명 안팎이었고, 제노바의 용병대장 주스티니아니가 데려온 병사와 베네치아 거류민도 성벽을 지켰다. 오스만군은 거포로 육지 쪽 성벽을 두드리고 배를 언덕 너머로 끌어 금각만에 들여보냈으며, 5월 말 총공격으로 도시를 함락했다. 황제는 마지막 싸움에서 죽은 것으로 전하며, 오스만군은 사흘 동안 도시를 약탈하며 많은 주민을 죽이거나 노예로 끌고 갔다. 메흐메트 2세는 도시를 새 수도(이스탄불)로 삼아 다른 곳의 주민을 옮겨 살게 하고, 정교회 총대주교를 세워 정교도 공동체를 맡겼다. 천 년 넘게 이어진 비잔티움 제국은 이로써 끝났고, 황제의 동생 토마스와 데메트리오스가 나눠 다스린 모레아 전제공국(지도는 이 해부터 모레아를 동로마 제국에서 떼어 모레아 전제공국 항목으로 그린다)과 트레비존드 제국도 몇 해 뒤 정복되었다(「메흐메트 2세의 발칸·흑해 정복」, 뒤의 사건). 동지중해 무역의 길목을 오스만이 쥐자 베네치아와 제노바는 술탄과 협상해 상권을 지키려 했다. 비잔티움 학자 일부가 고전 사본을 들고 이탈리아로 건너간 일(함락 전부터 이어짐)은 르네상스 인문주의에 힘을 보탰다."
  subjects: [ottoman, byzantine-empire, venice, genoa, morea-despotate]
  links:
    - { from: ottoman, to: byzantine-empire, note: "콘스탄티노폴리스 함락 (1453)" }
  tags: [war, politics]
  sources: ["스티븐 런치만, 『1453 콘스탄티노플 최후의 날』(이순호 옮김, 갈라파고스, 2004)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
