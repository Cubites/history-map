# ── 이탈리아 전쟁과 르네상스, 동유럽의 변화 (1494 ~ 1522) ──────

- id: italian-wars-1494
  year: 1494
  endYear: 1504
  title:
    ko: 이탈리아 전쟁의 시작과 나폴리 왕국의 끝
  summary:
    ko: "이탈리아는 로디 화약(1454) 뒤 밀라노·베네치아·피렌체·교황령·나폴리 다섯 나라가 세력 균형을 이루고 있었으나, 1494년 프랑스의 샤를 8세가 나폴리 왕위를 내세워 대군을 이끌고 알프스를 넘으면서 이탈리아 전쟁(1494~1559)이 시작되었다. 프랑스군은 남쪽으로 가는 길에 몬테산조반니 등 항복하지 않은 성의 수비대와 주민을 학살했다. 프랑스군이 지나가자 피렌체에서는 메디치 가문이 쫓겨나고 수도사 사보나롤라가 엄격한 신정 정치를 폈다(1498년 처형). 1495년 2월 나폴리 왕국을 차지한 샤를 8세는 베네치아·밀라노·교황·에스파냐·신성 로마 제국의 막시밀리안 1세가 맺은 동맹에 밀려 7월 포르노보 전투를 치르며 프랑스로 물러났다. 뒤를 이은 루이 12세는 1499년 밀라노 공국을 정복하고, 1500년 그라나다 조약으로 에스파냐의 페르난도 2세와 나폴리 왕국을 나누기로 해 1501년 나폴리 왕 페데리코를 물러나게 했다. 두 나라는 곧 나폴리를 두고 싸웠는데, 에스파냐의 곤살로 데 코르도바가 1503년 체리뇰라와 가릴리아노에서 화승총 부대로 프랑스군을 이겨, 1504년 리옹 조약으로 나폴리는 에스파냐, 밀라노는 프랑스의 땅이 되었다. 이로써 이탈리아는 프랑스와 에스파냐가 다투는 싸움터가 되었고, 대포와 화승총, 용병 부대가 전쟁의 모습을 바꾸었다."
