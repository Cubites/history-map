  sources: ["「알카소바스 조약」(1479)", "존 H. 엘리엇, 『스페인 제국사 1469~1716』(김원중 옮김, 까치, 2000)", "Henry Kamen, The Spanish Inquisition: A Historical Revision (4판, 2014)"]

- id: rhodes-otranto-1480
  year: 1480
  endYear: 1482
  title:
    ko: 로도스 포위와 오트란토 점령
  summary:
    ko: "메흐메트 2세는 1480년 지중해로 눈을 돌려 로도스섬의 성 요한 기사단(로도스 기사단국)을 에워쌌으나, 석 달 가까운 포위 끝에 물러났다. 같은 해 8월에는 오스만군이 이탈리아 남부 나폴리 왕국의 오트란토를 함락했는데, 이때 많은 주민이 죽거나 노예로 끌려갔고 개종을 거부한 주민 수백 명(전승으로는 약 800명)이 처형되었다. 이탈리아 여러 나라는 크게 놀랐으나, 1481년 5월 메흐메트 2세가 죽고 아들 바예지트 2세와 젬이 왕위를 다투자 나폴리군이 9월 오트란토를 되찾았다. 왕위 다툼에 진 젬은 1482년 로도스 기사단에 몸을 맡겼고, 기사단과 뒤에 그를 넘겨받은 교황청은 그를 붙잡아 두는 대가로 바예지트 2세에게서 해마다 돈을 받았다. 1482년에는 헤르체고비나 공국의 마지막 거점 헤르체그노비도 오스만에 함락되어 공국이 끝났다."
  subjects: [ottoman, knights-hospitaller, naples-kingdom, papal-states, herzegovina]
