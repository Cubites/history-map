- id: tudor-1485
  year: 1485
  title:
    ko: 장미 전쟁과 튜더 왕조의 시작
  summary:
    ko: "백년 전쟁에서 진 뒤 잉글랜드에서는 왕위를 두고 랭커스터 가문(붉은 장미)과 요크 가문(흰 장미)이 싸운 장미 전쟁(1455~1487)이 이어졌다. 요크 가문의 에드워드 4세가 랭커스터 가문의 헨리 6세를 몰아냈으나, 그가 죽은(1483) 뒤 동생 리처드 3세가 어린 조카 에드워드 5세를 밀어내고 왕이 되었다. 1485년 8월 랭커스터 쪽 상속자 헨리 튜더가 프랑스의 지원을 받아 웨일스에 상륙해 보즈워스 전투에서 리처드 3세를 죽이고 헨리 7세로 즉위했다. 그는 요크 가문의 엘리자베스와 혼인해 두 가문을 합치고 1487년 스토크 전투로 마지막 반란을 눌렀다. 오랜 싸움 속에 많은 대귀족이 죽거나 땅을 잃었고, 헨리 7세는 귀족의 사병을 줄이고 왕의 평의회를 통한 재판과 왕실 재정을 강화해 튜더 왕조(1485~1603)의 기틀을 놓았다."
  subjects: [england, france]
  links:
    - { from: france, to: england, note: "헨리 튜더 지원 (1485)" }
  tags: [war, politics]
  sources: ["Charles Ross, The Wars of the Roses: A Concise History (1976)", "S. B. Chrimes, Henry VII (1972)"]
  places: [{ name: "보즈워스", at: [-1.41, 52.59] }]

- id: granada-1492
  year: 1492
  title:
    ko: 그라나다 함락과 레콩키스타의 끝, 유대인 추방
  summary:
    ko: "1481년 말 그라나다 에미르국의 군대가 카스티야의 국경 도시 사아라를 기습해 주민을 포로로 끌고 가자, 이듬해 카스티야가 알아마를 빼앗으며 그라나다 전쟁(1482~1491)이 시작되었다. 나스르 왕가의 내분(무함마드 12세 보압딜과 숙부의 다툼)을 이용한 에스파냐의 가톨릭 공동 왕은 론다(1485)·말라가(1487)·바사·알메리아(1489)를 차례로 빼앗았고, 말라가를 함락한 뒤에는 주민 대부분을 노예로 삼았다. 1491년 11월 그라나다 조약에 따라 1492년 1월 초 보압딜이 그라나다를 넘기며, 711년부터 이어진 이베리아반도의 이슬람 왕국이 사라지고 레콩키스타(국토 회복 운동)가 끝났다. 조약은 무슬림의 신앙과 재산을 보장했으나 1499년부터 강제 개종이 이루어져 알푸하라스 반란(1499~1501)이 일어났고, 1502년 카스티야는 무슬림에게 개종과 추방 가운데 하나를 고르게 했다. 1492년 3월에는 알람브라 칙령으로 개종하지 않은 유대인을 7월 말까지 내보내기로 해, 수만 명이 포르투갈·북아프리카·이탈리아·오스만 제국으로 떠났다(학자에 따라 4만~10만 명, 카먼 등)."
  subjects: [spain, granada]
  links:
