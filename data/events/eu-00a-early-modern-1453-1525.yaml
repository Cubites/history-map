- id: burgundian-wars-1474
  year: 1474
  endYear: 1482
  title:
    ko: 부르고뉴 전쟁과 아라스 조약
  summary:
    ko: "부르고뉴 공국의 샤를(대담공)은 부르고뉴와 저지대(네덜란드) 사이의 땅을 이어 왕국을 세우려 로렌 공국과 알자스로 세력을 넓혔다. 프랑스의 루이 11세가 돈을 대어 스위스 연방과 알자스 도시들, 로렌 공을 그에게 맞서게 하자 부르고뉴 전쟁이 일어났다. 1476년 샤를은 그랑송 성을 함락하고 항복한 스위스 수비대를 처형했으나 곧 그랑송(3월)과 무르텐(6월) 전투에서 스위스군에 크게 졌고, 무르텐에서 스위스군은 달아나는 부르고뉴 병사를 대거 죽였다. 1477년 1월 샤를은 로렌 공 르네 2세와 스위스 연합군에 맞선 낭시 전투에서 전사했다. 루이 11세는 부르고뉴 공작령과 피카르디·아르투아·프랑슈콩테를 차지했고, 샤를의 딸 마리는 신성 로마 황제의 아들 막시밀리안과 혼인해 저지대를 지켰다(1479 갱가트 전투). 마리가 죽은 뒤 1482년 12월 아라스 조약으로 부르고뉴 공작령과 피카르디는 프랑스에 남고, 저지대는 아들 필리프가 이어 합스부르크령 네덜란드가 되었다(아르투아·프랑슈콩테는 1493년 상리스 조약으로 합스부르크에 돌아감). 이로써 프랑스와 합스부르크 가문의 오랜 대립이 시작되었다. 같은 무렵 루이 11세는 1481년 앙주 가문의 프로방스 백국도 물려받아 왕령을 넓혔다."
