- id: new-sea-routes-1492
  year: 1492
  endYear: 1498
  title:
    ko: 콜럼버스와 다가마, 신항로 개척
  summary:
    ko: "포르투갈은 엔히크 왕자 때부터 아프리카 서해안을 따라 내려가 1488년 디아스가 희망봉에 이르렀다. 포르투갈 상인은 1440년대부터 서아프리카 해안에서 붙잡거나 사들인 아프리카인을 노예로 팔기 시작했다. 지구 둘레를 실제보다 작게 어림하고 서쪽으로 가면 아시아에 더 빨리 닿는다고 믿은 제노바 출신 콜럼버스는 에스파냐의 이사벨 여왕에게 지원을 받아 1492년 8월 팔로스항을 떠나 10월 바하마 제도의 섬에 닿았다. 그는 죽을 때까지 그곳을 아시아로 여겼다. 1493년 교황 알렉산데르 6세가 칙서로 두 나라의 경계를 정하자 포르투갈이 반발했고, 1494년 6월 토르데시야스 조약으로 두 나라는 카보베르데 제도 서쪽 370레구아의 경선을 기준으로 서쪽은 에스파냐, 동쪽은 포르투갈의 몫으로 나누었다(뒤에 브라질이 포르투갈 몫이 됨). 1498년 포르투갈의 바스쿠 다가마는 희망봉을 돌아 인도의 캘리컷에 닿아 유럽과 아시아를 바다로 바로 잇는 길을 열었다. 신항로 개척으로 유럽 무역의 중심은 지중해에서 대서양 연안으로 옮겨 가기 시작했다. 아메리카에서는 에스파냐인의 정복과 강제 노동, 유럽인이 옮긴 전염병으로 원주민 인구가 크게 줄었다(카리브해의 타이노인은 수십 년 만에 거의 사라짐)."
  subjects: [spain, portugal, papal-states]
  links:
