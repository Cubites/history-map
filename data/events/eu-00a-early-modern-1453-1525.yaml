- id: spain-union-1479
  year: 1479
  title:
    ko: 카스티야와 아라곤의 연합, 에스파냐의 성립
  summary:
    ko: "카스티야 왕국의 왕녀 이사벨과 아라곤 연합 왕국의 왕위 계승자이자 시칠리아 왕인 페르난도는 1469년 혼인했다. 1474년 이사벨이 카스티야 여왕에 오르자 엔리케 4세의 딸 후아나를 내세운 포르투갈의 아폰수 5세가 쳐들어와 카스티야 왕위 계승 전쟁이 벌어졌는데, 1479년 9월 알카소바스 조약으로 포르투갈은 이사벨의 왕위를 인정하고 대신 카나리아 제도를 뺀 대서양의 섬과 서아프리카 해안의 권리를 얻었다. 같은 해 페르난도가 아라곤 왕위를 이어 두 왕국이 같은 부부 왕(가톨릭 공동 왕) 아래 놓였다. 두 왕국은 의회·법·화폐를 따로 두었으나 외교와 전쟁을 함께 하며 에스파냐 통합의 바탕이 되었다. 부부 왕은 귀족을 누르고 도시 치안대(산타 에르만다드)를 두었으며, 교황의 허락(1478)을 받아 왕이 직접 관할하는 종교 재판소를 세웠다. 1480년 세비야에서 활동을 시작한 종교 재판소는 몰래 유대교를 지킨다고 의심받은 개종 유대인(콘베르소)을 주로 심문해, 1530년 무렵까지 약 2천 명을 화형에 처한 것으로 추산된다(카먼, 추산 폭이 큼)."
  subjects: [castile, aragon, spain, portugal]
  links:
