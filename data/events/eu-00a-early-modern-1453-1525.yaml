  tags: [politics]
  sources: ["「리베 조약」과 자유 헌장(1460)", "Knud J. V. Jespersen, A History of Denmark (2판, 2011)"]

# ── 오스만의 지중해 진출과 서유럽 왕권의 성장 (1463 ~ 1492) ──────

- id: venice-ottoman-war-1463
  year: 1463
  endYear: 1479
  title:
    ko: 베네치아-오스만 전쟁과 스칸데르베그의 알바니아
  summary:
    ko: "보스니아 정복 무렵 베네치아 공화국은 펠로폰네소스와 에게해의 거점을 지키려 오스만 제국과 전쟁을 시작했다(1463). 베네치아는 헝가리 왕국, 알바니아의 스칸데르베그, 아나톨리아의 카라만 베이국, 동쪽의 아크코윤루(우준 하산)와 손잡으려 했다. 그러나 오스만은 1470년 에게해의 거점 네그로폰테(에우보이아)를 함락하며 수비대와 주민을 죽였고, 1473년 오틀룩벨리 전투에서 우준 하산을 무찔렀으며, 1468년과 1474년 카라만 베이국의 중심지와 해안을 차지했다(남은 세력은 1487년 무렵 끝남). 베네치아 함대도 1472년 스미르나(이즈미르) 등 아나톨리아 해안 도시를 불태우며 주민을 죽이거나 끌고 갔다. 스칸데르베그가 이끈 레저 동맹은 크루여에서 오스만의 공격을 여러 차례 막아 냈으나, 그가 죽은(1468) 뒤 베네치아 수비대에 기대다 1478년 크루여를 잃었다. 오스만 기병은 1477~1478년 베네치아 본토의 프리울리까지 휩쓸었다. 1479년 1월 콘스탄티노폴리스 조약으로 베네치아는 슈코드라·렘노스 등을 넘기고 네그로폰테·크루여를 포기했으며, 10만 두카트(밀린 채무 청산 명목)와 해마다 1만 두카트를 내는 대신 오스만 땅에서 장사할 권리를 되찾았다. 같은 1479년 오스만 해군(제독 게디크 아흐메트 파샤)은 이오니아해의 레프카다·케팔로니아·자킨토스를 다스리던 토코 가문의 레오나르도 3세를 몰아내 에피루스 전제공국(1449년 아르타를 잃고 1460년 남은 본토 요새도 잃어 이오니아해 섬들과 몇몇 요새만 남았던 나라)을 끝냈다(레오나르도는 나폴리로 달아났고, 자킨토스는 1480년대, 케팔로니아는 1500년 베네치아로 넘어갔다). 이 뒤 베네치아는 동지중해의 남은 거점을 지키는 데 힘써, 1489년 키프로스 왕국의 여왕 카테리나 코르나로에게서 섬을 넘겨받았다(「카테리나 코르나로와 키프로스의 베네치아 편입」, 뒤의 사건)."
  subjects: [venice, ottoman, hungary-kingdom, albanian-league, karaman-beylik, cyprus-kingdom, epirus-despotate]
