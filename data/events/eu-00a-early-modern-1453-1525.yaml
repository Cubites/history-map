- id: black-sea-1484
  year: 1484
  endYear: 1492
  title:
    ko: 킬리아·아케르만 점령과 크림 칸국의 드니프로강 어귀
  summary:
    ko: "몰다비아 공국(슈테판 대공, 재위 1457~1504)은 도나우강 어귀의 킬리아와 드니스테르강 어귀의 아케르만(체타테아 알베)으로 흑해에 닿았고, 두 항구는 폴란드·리투아니아 쪽과 흑해 무역을 잇는 길목이었다. 오스만은 1475년 카파 등 크림반도 남쪽 기슭을 차지하고 크림 칸국이 1478년부터 오스만의 종주권을 받아들이게 해 흑해 북쪽에 발판을 두었다. 바예지트 2세는 1484년 7월 킬리아를, 8월 아케르만을 차지했다. 슈테판은 1485년 폴란드 왕 카지미에시 4세에게 신종을 맹세하고 맞섰으나 두 항구를 되찾지 못했고, 킬리아·아케르만은 오스만 땅으로 굳어졌다(몰다비아 쪽 기록은 1486년의 강화로 확인되었다고 하나 강화의 해는 자료마다 갈린다). 지도는 두 항구를 함락한 1484년부터 두 항구와 그 배후지(드니스테르강과 부크강 사이 흑해 북안, 리투아니아 대공국이 닿아 있던 곳 포함)를 오스만 땅으로 그린다. 오스만의 종주를 받은 크림 칸 멩글리 기레이는 1490년대 초 리투아니아와 맞서 드니프로강 어귀 쪽으로 나아가 1492년 오차키우 요새를 쌓았다고 전하나, 일부 자료는 리투아니아 쪽 요새를 이은 것이라 하고 이듬해 리투아니아 쪽 코사크가 이곳을 빼앗았다는 기록도 있어 해와 모양이 확실하지 않다. 지도는 1492년부터 부크강과 드니프로강 사이 들판을 크림 칸국 땅으로 그린다. 이 일대는 이후 오래도록 리투아니아와 오스만, 크림 칸국이 다투는 땅이 되었다."
  subjects: [ottoman, moldavia, lithuania-grand-duchy, crimean-khanate, poland-kingdom]
  links:
