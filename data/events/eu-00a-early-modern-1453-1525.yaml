- id: ribe-1460
  year: 1460
  title:
    ko: 리베 조약과 슐레스비히·홀슈타인
  summary:
    ko: "슐레스비히 공작이자 홀슈타인 백작이던 아돌프 8세가 1459년 12월 아들 없이 죽자, 슐레스비히 공작령(덴마크 왕의 봉토)과 홀슈타인 백작령(신성 로마 제국의 봉토)을 누가 잇느냐가 문제가 되었다. 두 땅의 귀족과 도시는 땅이 갈라지는 것을 바라지 않았고, 아돌프의 누이 헤드비히의 아들인 덴마크 왕 크리스티안 1세(올덴부르크 가문, 덴마크 왕 1448년~, 노르웨이 왕 1450년~, 스웨덴 왕 1457~1464)를 새 주인으로 골랐다. 1460년 3월 2일 리베에서 귀족들이 그를 뽑고 5일 크리스티안은 두 땅이 영원히 나뉘지 않고 함께 남는다는 내용의 자유 헌장을 내렸다(저지 독일어로 영원히 갈라지지 않는다는 뜻의 문구가 뒤에 슐레스비히·홀슈타인의 표어가 됨). 슐레스비히는 덴마크 왕의 봉토라 왕이 공작으로서 자기 자신의 신하가 되었고, 홀슈타인은 덴마크 왕국에 합쳐지지 않고 계속 제국의 봉토로 남아 1474년 황제 프리드리히 3세가 크리스티안을 홀슈타인 공작으로 올려 주었다. 지도는 1460년부터 홀슈타인을 칼마르 동맹의 땅으로 그린다(지도 항목은 덴마크·노르웨이만 덮는다)."
  subjects: [kalmar-union, holy-roman-empire, sweden-medieval]
  links:
