- id: georgia-split-1463
  year: 1463
  endYear: 1490
  title:
    ko: 조지아 왕국의 내전과 세 왕국으로의 분열
  summary:
    ko: "조지아 왕국은 동로마 제국(1453)과 트레비존드 제국(1461)이 오스만에 무너져 흑해 쪽 후원자를 잃은 데다, 삼츠헤의 아타베그(자켈리 가문) 같은 큰 영주가 사실상 따로 움직여 흔들리고 있었다. 1463년부터 왕 게오르기 8세와 서쪽 이메레티를 바탕으로 왕위를 주장한 바그라트 6세 사이에 내전이 벌어졌고, 1465년 게오르기 8세가 삼츠헤의 크바르크바레 2세 자켈리에게 붙잡혀 밀려나자 바그라트가 왕위를 이었다(바그라트가 왕위에 오른 해는 1465년 또는 1466년으로 자료가 갈린다). 풀려난 게오르기는 동쪽 카헤티로 가 왕을 칭하며 1476년 죽을 때까지 따로 다스렸다(카헤티 왕국의 시작, 자료에 따라 1465년 또는 1466년). 이 틈에 아크코윤루의 우준 하산이 1466년과 1472년 두 차례 쳐들어와 바그라트는 1466년 트빌리시를 내주고 강화했다. 1478년 우준 하산이 죽자 트빌리시를 되찾고 콘스탄티네 2세(재위 1478~1505)가 왕위에 올랐으나 서쪽 이메레티는 바그라트의 아들 알렉산드레 2세가 차지했다 잃기를 되풀이하다 1484년 무렵(또는 1489년 이후)부터 따로 다스렸고, 1488년 겨울 아크코윤루가 다시 트빌리시를 에워싸 1489년 2월 함락했다. 1490년 무렵부터 1493년 사이에 콘스탄티네 2세는 게오르기 8세의 아들 알렉산드레 1세(카헤티)와 알렉산드레 2세(이메레티)를 독립 군주로 인정할 수밖에 없었고(자료마다 1490~1493년), 이로써 조지아는 카르틀리·카헤티·이메레티 세 왕국으로 나뉘었다. 지도는 1490년부터 조지아 왕국을 이 세 항목으로 나눠 그린다. 세 왕국은 오스만과 사파비 사이에 끼어 서로 다른 길을 걷게 된다(「아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼」, 뒤의 사건)."
  subjects: [georgia-kingdom, kakheti, kartli, imereti, ottoman]
  links:
