- id: hundred-years-war-end-1453
  year: 1453
  title:
    ko: 카스티용 전투와 백년 전쟁의 끝
  summary:
    ko: "1337년에 시작된 잉글랜드와 프랑스의 백년 전쟁은 잔 다르크가 오를레앙을 구한(1429) 뒤 프랑스 쪽으로 기울었다. 샤를 7세는 왕이 직접 거느리는 상비군과 대포 부대를 갖추어 노르망디(1450)와 기옌(1451)을 되찾았다. 이듬해 보르도 시민이 잉글랜드군을 다시 불러들였으나, 1453년 7월 카스티용 전투에서 프랑스군이 대포로 탤벗이 이끈 잉글랜드군을 무찔렀고 10월 보르도가 항복했다. 잉글랜드는 칼레만 남기고 대륙의 땅을 모두 잃었다(칼레는 1558년 프랑스에 넘어감). 강화 조약 없이 끝난 이 전쟁으로 프랑스 왕은 상비군과 왕국 전체에서 거두는 세금(타유)을 바탕으로 힘을 키웠고, 잉글랜드에서는 패전의 책임과 정신 질환을 앓던 헨리 6세의 섭정 자리를 두고 귀족 다툼이 커져 1455년 장미 전쟁이 일어났다."
  subjects: [france, england]
  links:
    - { from: france, to: england, note: "기옌 정복, 카스티용 전투 (1453)" }
  tags: [war]
  sources: ["Christopher Allmand, The Hundred Years War: England and France at War c.1300–c.1450 (1988)"]
  places: [{ name: "카스티용", at: [-0.04, 44.85] }]

- id: printing-press-1455
  year: 1455
  title:
    ko: 구텐베르크의 활판 인쇄술
  summary:
    ko: "신성 로마 제국의 도시 마인츠에서 금세공인 요하네스 구텐베르크는 1440년대부터 같은 모양의 금속 활자를 많이 부어 내는 주조 틀, 금속 활자에 맞는 기름 잉크, 압착기를 고친 인쇄기를 합쳐 활판 인쇄술을 만들었다. 1455년 무렵 그의 공방은 라틴어 성서(42행 성서)를 180부 안팎 찍어 냈다(추산). 인쇄술은 빠르게 퍼져 1500년까지 유럽 250곳 넘는 도시에 인쇄소가 서고 수만 종의 책이 나왔으며(추산), 베네치아가 큰 출판 중심지가 되었다. 책값이 내려가고 같은 내용이 널리 퍼지면서 인문주의와 과학 지식이 전해졌고, 뒤에 루터의 종교 개혁이 빠르게 번지는 바탕이 되었다. 현재 남아 있는 가장 오래된 금속 활자본은 고려의 『직지심체요절』(1377)로 구텐베르크보다 앞서지만, 구텐베르크의 방식은 활자 주조와 인쇄를 한 공정으로 묶어 책의 대량 생산을 열었다는 점에서 의미가 크다."
  subjects: [holy-roman-empire, venice]
  tags: [culture]
  sources: ["엘리자베스 L. 아이젠슈타인, 『근대 유럽의 인쇄 미디어 혁명』(전영표 옮김, 커뮤니케이션북스, 2008)", "뤼시앵 페브르·앙리장 마르탱, 『책의 탄생』(강주헌·배영란 옮김, 돌베개, 2014)"]

- id: thirteen-years-war-1454
  year: 1454
  endYear: 1466
  title:
    ko: 13년 전쟁과 제2차 토룬 조약
  summary:
    ko: "튜턴 기사단국의 지배에 불만을 품은 프로이센의 도시(단치히·토룬·엘빙)와 기사들이 만든 프로이센 연합이 1454년 2월 들고일어나 폴란드 왕 카지미에시 4세에게 의탁하자, 폴란드 왕국과 튜턴 기사단국 사이에 13년 전쟁이 벌어졌다. 폴란드군은 1454년 호이니체 전투에서 졌으나, 기사단은 용병에게 급료를 주지 못해 수도 마리엔부르크(말보르크) 등을 담보로 넘겼고(1454~1455), 1457년 용병들이 이 성을 폴란드 왕에게 팔았다. 1462년 스비에치노 전투에서 폴란드군이 이기고 이듬해 기사단 함대가 져서 전쟁이 판가름 났다. 1466년 10월 제2차 토룬 조약으로 포메렐리아(단치히)·헤움노 땅·말보르크·엘블롱크·바르미아는 '왕령 프로이센'으로 폴란드 왕국에 넘어갔고, 쾨니히스베르크로 중심을 옮긴 기사단의 나머지 땅은 폴란드 왕의 봉토가 되었다. 오랜 전쟁과 양쪽 용병의 약탈로 프로이센의 많은 마을이 황폐해졌다."
  subjects: [poland-kingdom, teutonic-order]
  links:
    - { from: poland-kingdom, to: teutonic-order, note: "제2차 토룬 조약, 왕령 프로이센 획득 (1466)" }
  tags: [war, diplomacy]
  sources: ["「제2차 토룬 조약」(1466)", "Norman Davies, God's Playground: A History of Poland, Vol. 1 (개정판, 2005)"]
  places: [{ name: "호이니체", at: [17.56, 53.7], year: 1454 }, { name: "스비에치노", at: [18.09, 54.79], year: 1462 }]

- id: ottoman-balkans-1456
  year: 1456
  endYear: 1463
  title:
    ko: 메흐메트 2세의 발칸·흑해 정복
  summary:
    ko: "콘스탄티노폴리스를 차지한 메흐메트 2세는 발칸과 흑해 연안의 남은 나라들을 차례로 정복했다. 1456년 7월 그는 헝가리 왕국의 남쪽 관문 베오그라드를 에워쌌으나, 후녀디 야노시가 이끈 헝가리군과 수도사 카페스트라노의 요한이 모은 십자군에 막혀 물러났다(후녀디는 곧 전염병으로 죽음). 그러나 세르비아 전제공국은 1459년 수도 스메데레보를 내주어 무너졌고, 비잔티움 황족이 다스리던 모레아 전제공국(1460), 흑해 남쪽 기슭의 잔다르 베이국(시노프)과 트레비존드 제국(1461)도 차례로 오스만 제국에 넘어갔다. 1462년 왈라키아 공 블라드 3세는 도나우강 남쪽의 오스만 땅을 습격하고 많은 포로를 말뚝에 꿰어 죽이며 맞섰으나 메흐메트 2세의 원정에 쫓겨났다. 1463년에는 보스니아 왕국을 정복하고 항복한 마지막 왕 스테판 토마셰비치를 처형했으며, 같은 해 말 헝가리 왕 마티아스 코르비누스가 야이체를 되찾아 보스니아 북부를 지켰다. 오스만군은 정복지에서 많은 주민을 포로로 끌고 가거나 이스탄불로 옮겨 살게 했고, 그리스도교도 소년을 데려가 개종시켜 예니체리 등으로 키우는 데브시르메 제도를 넓혔다."
