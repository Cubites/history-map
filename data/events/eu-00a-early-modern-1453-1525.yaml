# ── 종교 개혁의 시작과 카를 5세 (1517 ~ 1525) ──────────

- id: luther-1517
  year: 1517
  endYear: 1521
  title:
    ko: 루터의 95개조 반박문과 종교 개혁의 시작
  summary:
    ko: "교황 레오 10세가 성 베드로 대성당을 짓는 데 쓸 돈을 모으려 내린 면벌부(대사) 판매가 신성 로마 제국에서 크게 벌어지자, 작센 선제후령의 비텐베르크 대학 신학 교수 마르틴 루터는 1517년 10월 면벌부의 효력을 묻는 「95개조 반박문」을 내놓았다. 인쇄물로 빠르게 퍼진 그의 주장은 사람은 선행이 아니라 믿음으로 구원받고, 신앙의 근거는 교회의 전통이 아니라 성서뿐이라는 데까지 나아갔다. 1519년 라이프치히 논쟁에서 교황과 공의회의 권위도 부정한 루터는 1520년 「독일 그리스도인 귀족에게 고함」 등을 냈고, 파문을 경고한 교황의 칙서를 공개적으로 불태웠다. 1521년 1월 파문된 그는 4월 보름스 제국 의회에서 황제 카를 5세 앞에서도 주장을 굽히지 않아 제국 추방령을 받았으나, 작센 선제후 프리드리히의 보호로 바르트부르크성에 숨어 신약 성서를 독일어로 옮겼다(1522 출간). 루터의 개혁은 교황청과 교회 재산에 불만을 가진 제후와 도시들의 지지를 얻어 북독일과 북유럽으로 퍼졌다."
  subjects: [holy-roman-empire, papal-states]
  links:
    - { from: papal-states, to: holy-roman-empire, note: "루터 파문 (1521)" }
  tags: [culture, politics]
  sources: ["마르틴 루터, 「95개조 반박문」(1517)", "「보름스 칙령」(1521)", "디아메이드 맥클로흐, 『종교개혁의 역사』(이은재·조상원 옮김, CLC, 2011)"]

- id: charles-v-1519
  year: 1519
  endYear: 1525
  title:
    ko: 카를 5세의 황제 선출과 파비아 전투
  summary:
    ko: "합스부르크 가문의 카를은 아버지 쪽에서 부르고뉴 공작 가문의 유산인 네덜란드(1506)와 오스트리아(1519)를, 어머니 후아나(가톨릭 공동 왕의 딸) 쪽에서 에스파냐와 나폴리·시칠리아·아메리카 식민지(1516)를 물려받았다. 1519년 6월 그는 프랑스의 프랑수아 1세와 다툰 선거에서 푸거 가문에게 빌린 돈으로 선제후들을 매수해 신성 로마 황제로 뽑혔다(카를 5세). 그는 이에 앞서 1518년 에스파냐 왕으로서 마젤란의 서쪽 항해를 후원했는데, 1519년 9월 떠난 함대는 마젤란을 필리핀에서 잃은 뒤 1522년 세계를 한 바퀴 돌아 돌아왔다. 에스파냐에서는 외국인 신하를 거느린 카를에 맞선 카스티야 도시들의 코무네로스 반란(1520~1521)이 진압되었고, 1521~1522년 카를은 오스트리아의 세습령을 동생 페르디난트에게 넘겼다. 사방이 합스부르크 땅에 둘러싸인 프랑스는 이탈리아에서 맞섰으나, 1525년 2월 파비아 전투에서 프랑수아 1세가 황제군에 사로잡혔다. 그는 이듬해 마드리드 조약으로 부르고뉴와 밀라노를 내놓기로 하고 풀려났으나, 돌아가자마자 조약을 지키지 않았다."
  subjects: [spain, holy-roman-empire, habsburg-netherlands, habsburg-austria, france, milan]
  links:
    - { from: spain, to: france, note: "파비아 전투, 프랑수아 1세 포로 (1525)" }
  tags: [politics, war]
  sources: ["「마드리드 조약」(1526)", "Geoffrey Parker, Emperor: A New Life of Charles V (2019)"]
