    ko: 서울 올림픽과 북방 외교
  summary:
    ko: "노태우 정부 때 서울 올림픽이 동서 진영이 함께 참가한 가운데 열렸다. 정부는 공산권 나라들과 관계를 넓히는 북방 외교를 추진해 헝가리·소련(1990)·중국(1992)과 수교했다. 또 7·7 선언(1988)으로 북한을 대결 상대가 아닌 동반자로 규정했고, 자주·평화·민주의 원칙에 따른 한민족 공동체 통일 방안(1989)을 제시했다."
  subjects: [rok, soviet-union]
  links:
    - { from: rok, to: soviet-union, note: "북방 외교" }
  tags: [diplomacy, culture]
  sources: ["국사편찬위원회 『한국사』"]

