  summary:
    ko: 3정보를 상한으로 유상 매수·유상 분배하는 농지 개혁법이 제정되어(1949) 1950년부터 시행되었다. 자영농이 늘었지만 대상에서 산림·임야는 빠졌다. 같은 해(1949) 김구가 암살되었다. 귀속 재산 처리법도 제정되었다.
  subjects: [rok]
  tags: [economy, politics]
  sources: ["「농지 개혁법」", "「귀속 재산 처리법」"]

