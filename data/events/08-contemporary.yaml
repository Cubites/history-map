# 8번 묶음: 현대 (1945 ~ 현재)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 자료. 운영자 검수 필요.
# 8·15 광복은 7번 묶음에 있다. 1945~1948년 남쪽 사건은 'usamgik'(미군정기 남한), 북쪽 사건은 'soviet-north'에 둔다.

# ── 광복과 정부 수립 (1945 ~ 1948) ──────────────────────

- id: division-1945
  year: 1945
  title:
    ko: 건국 준비 위원회와 38도선 분할
  summary:
    ko: 광복 직후 여운형·안재홍이 조선 건국 준비 위원회를 만들어 치안을 맡고 조선 인민 공화국을 선포했다. 미국과 소련은 일본군의 무장 해제를 이유로 북위 38도선을 경계로 남북을 나누어 점령했다. 미군정은 조선 인민 공화국과 대한민국 임시정부를 인정하지 않았다.
  subjects: [usamgik, soviet-north, usa, soviet-union]
  links:
    - { from: usa, to: usamgik, note: "38도선 이남 점령, 미군정" }
    - { from: soviet-union, to: soviet-north, note: "38도선 이북 점령" }
  tags: [politics]
  sources: ["「맥아더 포고 제1호」", "국사편찬위원회 『한국사』"]

- id: moscow-conference-1945
  year: 1945
  endYear: 1946
  title:
    ko: 모스크바 3국 외상 회의와 신탁 통치 논쟁
  summary:
    ko: 미국·영국·소련 외상이 모여 한국에 임시 민주 정부를 세우고, 이를 위해 미소 공동 위원회를 열며, 최대 5년간 신탁 통치를 실시하기로 했다. 우익은 반탁 운동을 벌였고 좌익은 결정을 총체적으로 지지하는 쪽으로 돌아서 좌우 대립이 심해졌다.
  subjects: [usamgik, soviet-north, usa, soviet-union, uk]
  links:
    - { from: usa, to: usamgik, note: "임시 정부 수립·신탁 통치 결정" }
    - { from: soviet-union, to: soviet-north, note: "임시 정부 수립·신탁 통치 결정" }
  tags: [diplomacy, politics]
  sources: ["「모스크바 3국 외상 회의 결정서」"]

- id: joint-commission-1946
  year: 1946
  endYear: 1947
  title:
    ko: 미소 공동 위원회와 좌우 합작 운동
  summary:
    ko: "1차 미소 공동 위원회가 협의 대상 단체 문제로 결렬되자(1946), 이승만은 정읍에서 남한만의 단독 정부 수립을 주장했다. 여운형·김규식은 좌우 합작 위원회를 만들어 좌우 합작 7원칙을 발표했으나, 여운형이 암살되고 2차 미소 공동 위원회도 결렬되었다(1947). 미군정은 좌우 합작을 지원하며 김규식을 의장으로 한 남조선 과도 입법 의원(1946)을 열었고, 이어 안재홍을 민정 장관으로 한 남조선 과도 정부(1947)를 출범시켰다."
  subjects: [usamgik, usa, soviet-union]
  links:
    - { from: usa, to: soviet-union, note: "미소 공동 위원회" }
  tags: [politics]
  sources: ["「좌우 합작 7원칙」", "국사편찬위원회 『한국사』"]

- id: north-land-reform-1946
