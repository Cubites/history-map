- id: geneva-1994
  year: 1994
  title:
    ko: 김일성 사망과 북미 제네바 합의
  summary:
    ko: 1차 북핵 위기 속에 남북 정상 회담을 앞두고 김일성이 사망했고 김정일이 권력을 이었다. 북한과 미국은 북한의 핵 동결 대가로 경수로를 지어 주기로 한 제네바 합의를 맺었다.
  subjects: [dprk, usa]
  links:
