  endYear: 1996
  title:
    ko: 김영삼 정부의 개혁
  summary:
    ko: 32년 만의 문민정부로 금융 실명제를 실시하고(1993), 하나회를 해체했으며, 지방 자치제를 전면 실시했다(1995). 역사 바로 세우기로 조선 총독부 건물을 철거하고 전두환·노태우를 구속했다. 경제 협력 개발 기구(OECD)에 가입했다(1996).
  subjects: [rok]
  tags: [politics, economy]
