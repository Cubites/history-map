  summary:
    ko: 북쪽에서는 김일성을 위원장으로 북조선 임시 인민 위원회가 세워지고, 무상 몰수·무상 분배 방식의 토지 개혁과 주요 산업 국유화를 추진했다.
  subjects: [soviet-north, soviet-union]
  links:
    - { from: soviet-union, to: soviet-north, note: "북조선 임시 인민 위원회 지원" }
  tags: [politics, economy]
  sources: ["「북조선 토지 개혁에 대한 법령」"]

- id: un-transfer-1947
  year: 1947
  title:
    ko: 한국 문제의 유엔 이관
  summary:
    ko: "미소 공동 위원회가 결렬되자 미국이 한국 문제를 유엔에 넘겼다. 유엔 총회는 인구 비례에 따른 남북한 총선거를 결의하고 유엔 한국 임시 위원단을 보냈으나, 소련이 위원단의 북한 입국을 거부했다. 이에 유엔 소총회는 선거가 가능한 지역, 곧 남한에서만 총선거를 실시하기로 결의했다(1948.2)."
  subjects: [usamgik, soviet-north, usa, soviet-union]
  links:
    - { from: usa, to: usamgik, note: "한국 문제 유엔 이관" }
    - { from: soviet-union, to: soviet-north, note: "유엔 위원단 입북 거부" }
  tags: [diplomacy]
  sources: ["유엔 총회 결의 제112호"]

- id: jeju-april-3-1948
  year: 1948
  endYear: 1954
  title:
    ko: 제주 4·3 사건
  summary:
    ko: 남한 단독 선거 반대와 경찰·서북 청년회의 탄압에 맞서 제주도의 좌익 세력이 봉기했고, 진압 과정에서 많은 주민이 희생되었다. 2000년 제주 4·3 특별법이 제정되어 진상 규명과 명예 회복이 시작되었다.
  subjects: [usamgik, rok]
  tags: [society]
  sources: ["「제주 4·3 사건 진상 조사 보고서」 (2003)"]

