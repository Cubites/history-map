- id: rok-founded-1948
  year: 1948
  title:
    ko: 5·10 총선거와 대한민국 정부 수립
  summary:
    ko: "우리나라 최초의 민주 선거인 5·10 총선거(보통·직접·평등·비밀 선거)로 제헌 국회가 구성되었다. 제헌 국회는 대통령 중심제와 국회 간선제를 담은 헌법을 공포하고, 이승만을 대통령으로 뽑았다. 8월 15일 대한민국 정부가 수립되었고, 12월 유엔 총회에서 한반도의 유일한 합법 정부로 승인받았다. 김구·김규식 등 남북 협상파와 좌익 세력은 선거에 참여하지 않았고, 제주도에서는 4·3 사건으로 2개 선거구의 선거가 무효가 되었다. 제헌 국회 의원의 임기는 2년이었다."
  subjects: [usamgik, rok, usa]
  links:
    - { from: usamgik, to: rok, note: "정부 수립" }
  tags: [politics]
  sources: ["「대한민국 헌법」 (1948)", "유엔 총회 결의 제195호"]

