  tags: [diplomacy]
  sources: ["「북미 기본 합의문」"]

- id: imf-crisis-1997
  year: 1997
  endYear: 2001
  title:
    ko: 외환 위기와 극복
  summary:
    ko: "외환 보유액이 바닥나 국제 통화 기금(IMF)의 구제 금융을 받았다. 김대중 정부는 금 모으기 운동, 노사정 위원회, 기업·금융 구조 조정으로 위기를 극복하고 2001년 구제 금융을 모두 갚았으나, 실업과 비정규직이 늘었다. 실업과 빈곤층이 늘자 국민 기초 생활 보장법(1999)을 제정해 최저 생활을 국가가 보장하도록 했다."
  subjects: [rok]
  tags: [economy]
  sources: ["국사편찬위원회 『한국사』"]

- id: june-15-2000
  year: 1998
  endYear: 2000
  title:
    ko: 햇볕 정책과 6·15 남북 공동 선언
  summary:
    ko: 김대중 정부가 대북 화해·협력 정책(햇볕 정책)을 펴서 정주영의 소 떼 방북과 금강산 관광(1998)이 이루어졌다. 2000년 평양에서 첫 남북 정상 회담이 열려 6·15 남북 공동 선언을 발표했고, 이산가족 상봉과 경의선 복구, 개성 공단 건설(2003 착공)로 이어졌다.
  subjects: [rok, dprk]
