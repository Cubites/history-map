- id: us-military-government-1945
  year: 1945
  endYear: 1948
  title:
    ko: "미군정의 실시와 경제 정책"
  summary:
    ko: "미군은 태평양 미국 육군 총사령관 포고 제1호(1945.9)에 따라 38도선 이남에 군정을 실시하고 서울에 미군정청을 두었다. 미군정은 조선 총독부의 관리와 경찰을 그대로 쓰는 직접 통치를 폈는데, 북쪽의 소련군이 인민 위원회를 내세워 간접 통치한 것과 달랐다. 쌀의 자유 거래를 허용했다가 쌀값이 폭등하자 미곡 수집령(1946)으로 다시 쌀을 거두었고, 신한공사(1946)를 세워 동양 척식 주식회사 등 일본인이 가졌던 토지를 관리하게 했다."
  subjects: [usamgik, usa]
  links:
    - { from: usa, to: usamgik, note: "군정 실시 (직접 통치)" }
  tags: [politics, economy]
  sources: ["「태평양 미국 육군 총사령관 포고 제1호」 (1945)", "국사편찬위원회 『신편 한국사』 52 대한민국의 성립"]

- id: august-faction-1956
  year: 1956
  title:
    ko: "8월 종파 사건과 김일성 1인 지배 체제"
  summary:
    ko: "소련에서 스탈린 격하 운동이 일어난 뒤, 연안파와 소련파 인사들이 조선 노동당 전원 회의에서 김일성의 개인숭배와 중공업 우선 정책을 비판했으나 실패했다(8월 종파 사건). 김일성은 6·25 전쟁 뒤 박헌영 등 남조선 노동당 계열을 숙청한 데 이어 이들까지 몰아내 1인 지배 체제를 굳혔다. 이후 1960년대 후반부터 주체사상을 내세워 김일성 유일 지배 체제를 강화해 나갔다."
  subjects: [dprk]
  links:
    - { from: soviet-union, to: dprk, note: "스탈린 격하 운동(1956)의 영향" }
  tags: [politics]
  sources: ["국사편찬위원회 『한국사』", "통일부 국립통일교육원 『북한 이해』"]

- id: chang-myon-cabinet-1960
  year: 1960
  endYear: 1961
  title:
    ko: "장면 내각 (제2 공화국)"
  summary:
    ko: "4·19 혁명 뒤 내각 책임제와 양원제(민의원·참의원)를 담은 개헌이 이루어지고, 7·29 총선거에서 민주당이 크게 이겨 윤보선이 대통령, 장면이 국무총리가 되었다. 장면 내각은 3·15 부정 선거 관련자와 부정 축재자를 처벌하기 위한 소급 입법 개헌을 했고, 시·도지사까지 주민이 뽑는 지방 자치 선거를 실시했으며, 경제 개발 5개년 계획을 세웠으나 5·16 군사 정변으로 실행하지 못했다. 학생과 혁신 세력이 중립화 통일론과 남북 학생 회담을 주장하는 등 통일 운동이 활발했으나, 민주당 신·구파의 갈등으로 정국은 불안했다."
  subjects: [rok]
  tags: [politics]
  sources: ["「대한민국 헌법」 제3·4차 개정 (1960)", "국사편찬위원회 『한국사』"]

- id: gwangju-housing-1971
  year: 1971
  title:
    ko: "광주 대단지 사건"
  summary:
    ko: "서울시가 청계천 등지의 무허가 판자촌 주민을 경기도 광주군(지금의 성남시)의 대단지로 집단 이주시켰으나, 일자리와 상하수도 같은 기반 시설이 갖추어지지 않았고 땅값 일시 상환과 세금까지 요구했다. 1971년 8월 10일 주민 수만 명이 생존권 보장을 요구하며 관공서를 점거하는 등 항의하자 정부는 요구를 일부 받아들였다(8·10 성남 민권 운동). 급속한 산업화·도시화가 낳은 도시 빈민 문제를 드러낸 사건으로, 이 지역은 1973년 성남시가 되었다."
  subjects: [rok]
  tags: [society]
  sources: ["성남시 『성남시사』", "민주화운동기념사업회 『한국민주화운동사』"]

- id: family-reunion-broadcast-1983
  year: 1983
  title:
    ko: "KBS 이산가족 찾기 방송"
  summary:
    ko: "한국 방송 공사(KBS)가 1983년 6월 30일부터 11월 14일까지 138일 동안 특별 생방송 「이산가족을 찾습니다」를 진행해 1만여 이산가족이 다시 만났다. 6·25 전쟁과 분단이 남긴 아픔을 널리 일깨웠고, 이어 1985년 분단 이후 처음으로 남북 이산가족 고향 방문이 이루어졌다. 방송 기록물은 2015년 유네스코 세계 기록 유산에 등재되었다."
  subjects: [rok]
  tags: [society, culture]
  sources: ["KBS 특별 생방송 「이산가족을 찾습니다」 기록물 (2015 유네스코 세계 기록 유산)", "국가유산청 세계 기록 유산 해설"]

- id: dprk-joint-venture-1984
  year: 1984
  endYear: 2002
  title:
    ko: "합영법과 북한의 제한적 개방"
  summary:
    ko: "사회주의 경제가 침체하자 북한은 외국 기업과의 합작 투자를 허용하는 합영법을 제정했다(1984). 1991년에는 나진·선봉을 자유 경제 무역 지대로 정했고, 2002년에는 가격과 임금을 현실화한 7·1 경제 관리 개선 조치를 발표하며 신의주 특별 행정구와 개성 공업 지구를 지정했다. 그러나 체제 유지를 우선해 개방은 제한적이었다."
  subjects: [dprk]
  tags: [economy]
  sources: ["「조선민주주의인민공화국 합영법」 (1984)", "통일부 국립통일교육원 『북한 이해』"]

- id: workers-struggle-1987
  year: 1987
  title:
    ko: "1987년 노동자 대투쟁"
  summary:
    ko: "6월 민주 항쟁 직후인 1987년 7~9월, 울산의 현대 계열 공장에서 시작된 노동 쟁의가 전국으로 번져 3천 건이 넘는 파업과 농성이 일어났다(노동자 대투쟁). 노동자들은 노동조합 결성의 자유, 임금 인상, 작업 환경 개선과 인간다운 대우를 요구했고, 이 과정에서 많은 민주 노조가 생겨났다. 이 흐름은 전국 노동조합 협의회(1990)를 거쳐 전국 민주 노동조합 총연맹(1995) 결성으로 이어졌다."
  subjects: [rok]
  tags: [society]
  sources: ["민주화운동기념사업회 『한국민주화운동사』", "국사편찬위원회 『한국사』"]

- id: three-party-merger-1988
  year: 1988
  endYear: 1991
  title:
    ko: "여소야대 국회와 3당 합당"
  summary:
    ko: "13대 국회의원 선거(1988)에서 여당인 민주 정의당이 과반 의석을 얻지 못해 여소야대 국회가 되었다. 국회는 5공 비리와 5·18 민주화 운동의 진상을 따지는 청문회를 열었고, 전두환은 백담사로 물러났다. 노태우 대통령은 1990년 김영삼의 통일 민주당, 김종필의 신민주 공화당과 합당해 거대 여당 민주 자유당을 만들었다(3당 합당). 1991년 지방 의회 선거가 치러져 30년 만에 지방 자치제가 부분적으로 되살아났다."
  subjects: [rok]
  tags: [politics]
  sources: ["중앙선거관리위원회 『대한민국 선거사』", "국사편찬위원회 『한국사』"]
