    ko: 이승만의 정읍 발언
  summary:
    ko: 제1차 미소 공동 위원회가 결렬된 뒤 이승만이 전북 정읍에서 남한만이라도 임시 정부를 세워야 한다고 주장했다. 이에 맞서 여운형·김규식 등은 좌우 합작 운동을 벌였다.
  subjects: [usamgik]
