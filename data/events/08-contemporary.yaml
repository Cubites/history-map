  summary:
    ko: 제헌 국회가 반민족 행위 처벌법을 만들고 반민족 행위 특별 조사 위원회(반민 특위)를 두어 친일파를 조사했다. 이승만 정부의 비협조와 국회 프락치 사건, 경찰의 반민 특위 습격으로 활동이 크게 위축되어 친일 청산은 제대로 이루어지지 못했다.
