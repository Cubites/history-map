  title:
    ko: "나파타 쿠시 왕국의 성립(기원전 785 무렵~728)"
  summary:
    ko: "이집트 신왕국이 무너진 뒤 누비아에서는 나파타를 거점으로 한 독립 세력이 일어났다. 기원전 1070년 무렵 독립했다고 보는 견해도 있으나, 이름이 알려진 첫 왕은 알라라(재위 기원전 800~760년 무렵으로 전통적으로 본다)이며 이 왕이 나파타에서 왕조를 세웠다고 한다. 그의 생존 시기의 비문이 남아 있지 않아 알라라의 업적은 후대에 이집트 아몬 신앙 중심의 왕국을 세웠다는 평가에 기댄다. 쿠시 왕국은 케르마 왕국과 이어졌는지 불분명한데, 두 나라 사이에는 7백 년 남짓의 공백이 있다. 이 나라의 첫 해는 알라라가 왕조를 세운 기원전 785년 무렵으로 본다. 왕들은 나파타의 게벨 바르칼을 아몬의 성산으로 받들었고 엘쿠루에 왕릉을 두었다. 알라라와 형제였다고 흔히 보나 직접 증거는 없는 카슈타(재위 기원전 760~747년 무렵)는 북쪽으로 세력을 넓혀 엘레판티네와 테베에까지 영향을 미쳤다. 이집트가 이 무렵 리비아계 왕조들로 갈라져 있던 사정은 「이집트 제3중간기의 분열: 리비아계 왕조들(기원전 800 무렵~)과 카슈타의 상이집트 진출(기원전 750 무렵)」(앞의 사건)에 있다. 카슈타의 아들 피예는 이집트 원정에 나서 승전비를 남겼고, 그 일은 「피예의 이집트 원정(기원전 728~725 무렵)과 승전비」(뒤의 사건)에서 다룬다. 게벨 바르칼에는 이집트 신왕국 때부터 아몬 신전이 있어 쿠시 왕들은 그 신앙의 터전을 이어받은 것으로 본다. 나파타 독립의 때와 알라라의 재위는 학자마다 달라, 건국을 기원전 780년 무렵으로 적는 문헌도 있다. 피예의 재위는 기원전 747~716년 무렵으로 보는 견해가 있다. 쿠시 왕들은 스스로를 이집트 파라오의 전통을 잇는 왕으로 내세웠고 이집트식 신전과 상형문자를 썼다."
  subjects: [kush-napata]
  tags: [politics]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "László Török, The Kingdom of Kush: Handbook of the Napatan-Meroitic Civilization (Brill, 1997)"
    - "Charles Bonnet·Dominique Valbelle, The Nubian Pharaohs (American University in Cairo Press, 2006)"
    - "위키백과 Kingdom of Kush (https://en.wikipedia.org/wiki/Kingdom_of_Kush)"

- id: napata-after-egypt-656bc
  year: -655
  endYear: -269
  title:
    ko: "이집트를 잃은 뒤의 나파타 쿠시 왕국(기원전 656~270 무렵)"
  summary:
    ko: "기원전 656년 프삼티크 1세가 테베를 손에 넣어 쿠시는 이집트 지배를 마쳤다(「쿠시 왕조의 끝(기원전 664~656): 타누타문과 테베의 약탈, 상이집트의 상실」, 앞의 사건). 그러나 쿠시 왕국은 나일강 중류의 나라로 이어졌다. 타누타문 뒤에는 아틀라네르사와 센카마니스켄, 안라마니를 거쳐 아스펠타가 섰다. 기원전 593년 무렵 이집트의 프삼티크 2세가 누비아로 쳐들어와 나파타 가까이까지 닿았다(「프삼티크 2세의 누비아 원정(기원전 593 무렵)과 쿠시의 남하」, 뒤의 사건). 아스펠타 이후 왕들은 대개 이름과 재위 순서만 전하며 아라마틀레코·말로나켄·아날마예·카르카마니 같은 이름이 목록에 이어지는데 재위 연대는 대체로 어림이다. 이 왕조가 도읍을 남쪽 메로에로 옮긴 때는 기원전 591년 무렵이라는 견해가 있으나 불확실하며, 나파타는 그 뒤에도 아몬 신앙의 성지였다. 헤로도토스는 『역사』에서 페르시아의 캄비세스가 기원전 525년 이집트를 차지한 뒤 에티오피아 사람들을 치러 갔다가 식량이 떨어져 돌아섰다고 적었다. 그러나 도르기나르티의 고고 발굴은 페르시아의 남쪽 경계가 그곳이었음을 보여 이 원정이 실제로 있었는지는 학자들이 갈린다. 목록은 이어 아마니나타킬레브테·아마니아스타바르카·시아스피카·나사크마·탈라카마니·아마니바키 같은 왕을 올리나 순서는 학자마다 조금씩 다르다. 기원전 5~4세기에는 쿠시가 다시 힘을 되찾았다고 본다. 아문 신전을 새로 짓고 하르시오테프(기원전 400년 무렵)와 나스타센(기원전 325년 무렵) 같은 왕들이 비문을 남겼다. 나스타센은 누리의 왕릉에 묻힌 마지막 왕이다. 그 뒤 왕실 무덤은 남쪽 메로에로 옮겨 간다."
  subjects: [kush-napata]
  tags: [politics]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "László Török, The Kingdom of Kush: Handbook of the Napatan-Meroitic Civilization (Brill, 1997)"
    - "헤로도토스, 『역사』 3권 17~25절"
    - "위키백과 Kingdom of Kush (https://en.wikipedia.org/wiki/Kingdom_of_Kush)"

- id: nok-500bc
  year: -499
  endYear: 200
  title:
    ko: "노크 문화의 테라코타와 서아프리카의 철 제련(기원전 500 무렵~기원후 200 무렵)"
  summary:
    ko: "노크 문화는 오늘날 나이지리아 중부, 카두나주 남부의 노크 마을 둘레에서 이름이 붙은 문화다. 1928년 주석 광산에서 땅속 7미터 깊이에서 처음 테라코타 조각이 나왔고, 1943년에는 광산 직원이 조각 머리를 허수아비로 쓰는 것을 고고학을 공부한 행정관 버나드 파그가 알아보면서 조사가 시작되었다. 조각은 속이 빈, 둥글게 감아 올린 점토로 만든 사람과 동물이며, 큰 것은 실물 크기에 가깝고 머리와 장신구를 정교하게 꾸몄다. 쓰임새는 조상의 초상, 무덤 표지, 부적 등으로 보는 견해가 갈린다. 유적 연대로 보면 노크 문화는 기원전 1500년 무렵부터 기원후 1세기 무렵까지 이어졌고, 조각은 기원전 900년 무렵의 것이 가장 이르다고 본다. 판와리 유적에서는 진주기장과 동부콩을 기르고 야생 식물을 거둔 흔적이 나온다. 1961년 타루가에서 8일간 시험 발굴을 하여 철 찌꺼기와 송풍관 조각이 나왔고, 자기 탐사로 찾은 61곳 가운데 아홉 곳에서 제련로 벽과 바닥이 확인되었다. 이로써 노크 문화는 철기 시대의 문화로 분류된다. 철 제련이 서아프리카에서 따로 시작했다고 보는 견해는 기원전 8~6세기를 드는데 이 연대는 논쟁이다. 노크 사람들은 작은 마을을 이루었고 도시나 계층의 증거는 없으며, 뒤의 요루바·이페 전통과 이어진다는 견해가 있다. 기원전 300년부터 1년 무렵까지의 후기 노크 유적은 드물고 토기도 거의 남지 않았으며, 쇠퇴의 까닭은 알려져 있지 않다. 1994년 뒤 도굴이 늘어 많은 유적이 파괴되었다. 뒤를 이은 문화로 쿠와라라파를 드는 견해가 있다. 이른바 철기 시대 사하라 이남 아프리카의 가장 이른 철기 문화의 하나로 꼽힌다."
  subjects: [sub-saharan-iron-age]
  tags: [culture, society]
  sources:
    - "Bernard Fagg, 'The Nok Culture: Excavations at Taruga', West African Archaeological Newsletter 6 (1962)"
    - "Peter Breunig(편), Nok: African Sculpture in Archaeological Context (Africa Magna Verlag, 2014)"
    - "The Cambridge History of Africa, Vol. 2: From c. 500 BC to AD 1050 (Cambridge University Press, 1978)"
    - "위키백과 Nok culture (https://en.wikipedia.org/wiki/Nok_culture)"

- id: urewe-great-lakes-500bc
  year: -499
  endYear: 500
  title:
    ko: "대호수 지역의 우레웨 토기와 철 제련(기원전 500 무렵~기원후 500 무렵)"
  summary:
    ko: "우레웨는 빅토리아 호수 둘레, 케냐 서부의 유적 이름을 딴 토기 전통이다. 가장 이른 연대의 유물은 탄자니아 카게라 지방에서 나왔다고 본다. 유적 연대로는 기원전 5세기부터 기원후 6세기까지로 보며, 문화는 기원전 1000년 무렵 둘레에서 비롯되었고 기원후 1~6세기에 가장 넓게 퍼졌다고 본다. 서쪽으로 콩고 민주 공화국 키부 지역, 북쪽으로 우간다·르완다·부룬디, 동쪽으로 케냐의 니안자와 서부로 이어졌고, 르완다와 부룬디에서는 해발 1,300~1,700미터의 점토질 언덕에 자리 잡았다. 토기는 키 30~36센티미터쯤의 단지와 작은 단지, 열린 사발의 세 꼴이 주를 이루며 보조개 무늬와 동심선, 띠 무늬로 꾸몄다. 제련로는 초록 나뭇가지를 깐 바닥이 슬래그를 거르고 그 위에 점토로 굴뚝 모양 통을 쌓은 꼴이었다. 철광석과 땔나무가 넉넉했고, 새 나무로 만든 숯은 방사성 탄소 연대를 비교적 믿을 만하게 한다. 이 지역은 사하라 이남에서 가장 이른 철 제련 중심지의 하나로 꼽히고, 기원전 1세기에 이미 탄소를 섞은 강철을 만들 만한 단조 기술이 있었다고 본다. 이곳 사람들은 원시 대호수 반투어를 쓴 동쪽 반투어 갈래로 보며, 소 치기와 기장·수수 농사를 지었을 것이라고 한다(「반투어 사람들의 확산과 사하라 이남의 철기(기원전 1000 무렵~500 무렵)」, 앞의 사건). 다만 이 제련로의 효율은 아직 분석으로 밝혀지지 않았고, 시작이 기원전 5세기인지 기원전 1000년 무렵인지는 문헌마다 갈린다. 단지가 먼저 생기고 사발이 나중에 생겼다는 가설이 있다. 이른바 철기 시대 사하라 이남 아프리카의 철 제련을 가장 풍부하게 보여 주는 곳이다. 우레웨 공동체 가운데 일부는 14세기까지도 고립된 곳에서 남아 있었다."
  subjects: [sub-saharan-iron-age]
  tags: [society, economy]
  sources:
    - "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 1995)"
    - "Peter Schmidt, Iron Technology in East Africa: Symbolism, Science, and Archaeology (Indiana University Press, 1997)"
    - "위키백과 Urewe (https://en.wikipedia.org/wiki/Urewe)"
    - "위키백과 Bantu expansion (https://en.wikipedia.org/wiki/Bantu_expansion)"

- id: meroe-270bc
  year: -269
  endYear: 100
  title:
    ko: "메로에 시대의 쿠시 왕국: 왕릉과 철, 메로에 문자(기원전 270 무렵~기원후 100 무렵)"
  summary:
    ko: "기원전 300년 무렵부터 쿠시 왕들은 나파타 대신 남쪽 메로에에 묻혔다. 메로에는 여름 강우대 가장자리에 있어 철광석과 단단한 목재가 풍부했고 홍해로 가는 교역로에 닿아 있었다. 왕들이 나파타 신관들에게서 벗어나려 했기 때문이라는 설명도 있다. 디오도로스는 왕 에르가메네스가 신관을 도륙해 신관의 권력을 끊었다고 전하는데, 이 이야기는 아르카마니 1세(기원전 270년 무렵)나 아르카마니 2세 때의 일을 한데 섞은 것일 수 있다. 기원전 275~274년 무렵 프톨레마이오스 왕국의 프톨레마이오스 2세가 쿠시를 쳐 국경 일부를 이집트에 넣었다고 한다. 쿠시는 이어 지중해 세계와 교역과 외교를 이어 갔다. 메로에 왕실은 피라미드를 쌓은 것으로 이름나서 수단에 이집트보다 많은 약 2백 기의 피라미드가 남았다. 기원전 205년 무렵 프톨레마이오스 4세 때 상이집트에서 반란이 일어나 쿠시가 아래 누비아를 되찾았고, 프톨레마이오스 5세가 필라이에 새겨진 아르카마니 2세의 이름을 지웠을 수 있다고 본다. 이 시기에는 이집트 문자를 바탕으로 한 메로에 문자가 나타났다. 상형문자와 흘림체 두 가지가 있는데 글자 소리는 읽을 수 있어도 말 뜻은 아직 다 풀지 못했다. 메로에에는 철 찌꺼기 더미가 곳곳에 쌓여 한때 ‘아프리카의 버밍엄’이라 부르기도 했으나, 철 산업의 규모를 과장했다는 비판이 있어 지금은 범위를 좁혀 본다. 이 시기에는 여왕이 칸다케라는 칭호로 이름난다. 아포예데마크 신전이 있는 무사와라트 에스수파라와 나가 같은 큰 신전 유적도 이 시기의 것이다. 1세기 중엽 나타카마니와 아마니토레 때에는 메로에와 나가에 큰 신전이 세워졌다. 쿠시는 기원전 25년에서 20년 사이 로마와 싸우게 된다(「아마니레나스와 로마–쿠시 전쟁, 사모스 조약(기원전 25~20)」, 뒤의 사건)."
  subjects: [kush-napata, ptolemaic-kingdom]
  tags: [politics, culture, economy]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "László Török, The Kingdom of Kush: Handbook of the Napatan-Meroitic Civilization (Brill, 1997)"
    - "디오도로스 시켈로스, 『역사 총서』 3권 6절"
    - "위키백과 Kingdom of Kush (https://en.wikipedia.org/wiki/Kingdom_of_Kush)"

- id: djenne-jeno-250bc
  year: -249
  endYear: 800
  title:
    ko: "젠네-제노와 니제르강 내륙 삼각주의 첫 도시(기원전 250 무렵~기원후 800 무렵)"
  summary:
    ko: "젠네-제노는 오늘날 말리의 니제르강 내륙 삼각주에 있는 유적으로, 지금의 도시 젠네에서 3킬로미터쯤 떨어져 있다. 1977년 처음 지도를 그렸을 때 33헥타르에 높이 6미터의 취락 둔덕이었다. 로더릭 매킨토시와 수전 매킨토시 부부가 1977년과 1981년에 발굴해, 유적 연대로 기원전 250년 무렵부터 사람이 눌러살았다고 본다. 첫 단계(기원전 250년 무렵~기원후 50년 무렵)에서 서아프리카에서 가장 이른 철 제련의 증거와 길들인 쌀이 함께 나온다. 이 쌀은 이 일대에서 따로 길들인 아프리카 쌀로 보며, 물이 불고 빠지는 철을 따른 쌀·수수 농사와 소·양·염소 치기가 인구를 키웠다고 본다. 둘째 단계에는 테라코타 조각이 나오고, 400~900년 무렵의 셋째 단계에는 공동묘지가 빽빽하고 집터 퇴적이 깊어 인구가 더 늘었음을 보인다. 이때 약 2킬로미터를 두른 흙벽돌 성벽이 쌓였다는 보고가 있다. 800년 무렵에는 주변까지 합쳐 1만~2만 7천 명이 살았다고 본다. 쌀은 사하라의 소금·구리·말린 물고기와 바뀌어 교역망을 이루었고, 기원전 3세기의 유리 구슬이 나와 이슬람 이전부터 사하라 건너 교역이 있었음을 보여 준다. 유적 둘레 4킬로미터 안에 40개쯤의 둔덕이 있어 장인 마을들이 따로 서면서 서로 물건을 오갔고, 지배층의 증거는 찾지 못했다. 국가 없이도 도시가 자랐다는 보기로 꼽힌다. 이 터를 세운 이들을 보조 사람의 조상인 만데 계통 집단으로 보는 견해가 있고, 구전은 기원전 900년 무렵부터 있던 디아의 이주민이 세웠다고 전한다. 이른바 철기 시대 사하라 이남 아프리카의 첫 도시들 가운데 하나다. 젠네-제노는 900~1400년 사이에 서서히 쇠퇴해 버려졌다."
  subjects: [sub-saharan-iron-age]
  tags: [society, economy]
  sources:
    - "Roderick J. McIntosh, The Peoples of the Middle Niger: The Island of Gold (Blackwell, 1998)"
    - "Susan Keech McIntosh·Roderick J. McIntosh, Prehistoric Investigations in the Region of Jenné, Mali (BAR, 1980)"
    - "위키백과 Djenné-Djenno (https://en.wikipedia.org/wiki/Djenné-Djenno)"

- id: garamantes-sahara-100bc
  year: -99
  endYear: 300
  title:
    ko: "가라만테스와 사하라 교역, 낙타의 보급(기원전 100 무렵~기원후 300 무렵)"
  summary:
    ko: "가라만테스는 오늘날 리비아 남서부 페잔을 터전으로 한 사람들로, 기원전 1000년 무렵부터 이곳에 살았다고 본다. 도읍 가라마(지금의 게르마)에는 약 4천 명이 살았고 둘레 마을까지 합쳐 6천 명쯤이 더 있었다고 본다. 이들은 땅속 물길 포가라(수평 우물)로 물을 끌어 대추야자 농사를 지었다. 포가라의 연대는 기원전 200년에서 기원후 200년까지로 학설이 갈리며 7세기까지 쓰였다. 헤로도토스는 『역사』에서 가라만테스가 네 마리 말이 끄는 전차로 ‘동굴 에티오피아인’을 사냥한다고 적었다. 이를 사하라 남쪽 사람들을 노예로 잡은 이야기로 읽는 이도 있으나 추측이라는 비판이 있다. 로마와는 부딪쳤다. 플리니우스는 기원전 19년 루키우스 코르넬리우스 발부스가 가라만테스의 마을 열다섯을 차지했다고 적는다. 타키투스는 가라만테스가 반란자 타크파리나스를 도왔다고 쓴다. 이 뒤 로마 상인은 렙티스 마그나에서 사하라를 건너온 금과 노예를 샀고, 가라만테스 왕은 니제르강 굽이에서 차드 호수에 이르는 길을 쥐었다. 로마 사람 율리우스 마테르누스는 가라만테스 왕의 원정에 따라 아기심바까지 넉 달 길을 갔다고 한다. 낙타가 사하라 교역에 쓰이기 시작한 때는 학설이 갈리며, 낙타 덕에 이 교역이 크게 자란 것은 기원후 처음 몇 세기라고 본다. 가라만테스의 말은 닐로사하라어일 수 있다는 견해가 있으나 확정되지 않았다. 리비아 즐리텐 부근 별장(다르 부크 암메라)의 모자이크에는 가라만테스 포로가 처형되는 장면이 있다. 2세기 무렵의 것으로 보며 69~70년의 가라만테스 격퇴와 잇는 해석이 있다. 202년 셉티미우스 세베루스가 가라마를 차지했고, 지하수가 줄고 기후가 나빠지며 이 나라는 7세기 말 끝났다. 이들이 이른바 철기 시대 사하라 이남 아프리카와 어떻게 교역했는지는 사료가 적다."
  subjects: [garamantes, sub-saharan-iron-age, roman-empire]
  tags: [economy, society]
  sources:
    - "David Mattingly 외, The Archaeology of Fazzan, Vol. 1: Synthesis (Society for Libyan Studies, 2003)"
    - "헤로도토스, 『역사』 4권 183절"
    - "플리니우스, 『박물지』 5권 5장"
    - "타키투스, 『연대기』 3~4권"
    - "위키백과 Garamantes (https://en.wikipedia.org/wiki/Garamantes)"

- id: kush-rome-25bc
  year: -24
  endYear: -19
  title:
    ko: "아마니레나스와 로마–쿠시 전쟁, 사모스 조약(기원전 25~20)"
  summary:
    ko: "로마는 기원전 30년 이집트를 속주로 삼았고(「로마의 이집트 속주(기원전 30~기원후 14): 아우구스투스의 직할지와 곡창」, 앞의 사건) 남쪽 경계를 아스완에 두었다. 쿠시에서는 ‘칸다케’라 불린 여왕 아마니레나스가 나라를 이끌었다. 칸다케는 쿠시어로 여왕을 뜻하는 칭호인데, 스트라본이 이를 한 여왕의 이름처럼 적어 로마 사람들에게 굳었다. 스트라본에 따르면 이집트 총독 아일리우스 갈루스가 아라비아 원정에 나선 기원전 25년 무렵 쿠시군이 상이집트 변경을 쳐서 시에네·엘레판티네·필라이를 빼앗고 주민을 끌어갔으며 아우구스투스의 조각상을 부쉈다. 갈루스의 뒤를 이은 총독 가이우스 페트로니우스는 스트라본이 적기로 보병 1만 미만과 기병 8백으로 쿠시 3만 명을 맞아 이겼다. 그는 펠키스와 프렘니스를 차례로 얻고 쿠시의 나파타를 쳐 허물었다고 전한다. 이 숫자는 로마 쪽 서술이라 그대로 받기 어렵다. 쿠시는 기원전 22년 무렵 프렘니스(지금의 카스르 이브림)를 다시 쳤으나 페트로니우스가 먼저 들어가 지켰다. 이어 쿠시 사절이 협상에 나서 페트로니우스가 이들을 사모스섬의 아우구스투스에게 데려갔다고 한다. 아우구스투스는 공물을 더는 요구하지 않았고, 조약 시기는 대체로 기원전 21~20년 사이로 본다. 로마는 국경을 마하라카(히에라 시카미노스) 둘레로 정했으며, 이 평화는 3세기 말까지 이어졌다고 본다. 전쟁의 까닭은 스트라본이 이집트 지방관들과의 분쟁이라고 밝힌 것 밖에는 분명하지 않다. 아마니레나스의 남편은 테리테카스, 아들은 아키니다드로 보는 견해가 많으나 확정되지 않았다. 메로에에서는 청동 아우구스투스 상의 머리가 나왔고, 함다브 석비는 아마니레나스와 아들 아키니다드의 이름을 새겨 이 전쟁을 말하는 것으로 읽힌다."
  subjects: [kush-napata, roman-empire]
  links:
    - { from: kush-napata, to: roman-empire, note: "상이집트 변경의 시에네·엘레판티네·필라이 습격 (기원전 25년 무렵)" }
  tags: [war, diplomacy]
  places:
