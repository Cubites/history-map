- id: azania-coast-40
  year: 40
  endYear: 300
  title:
    ko: "『에리트레아 해 안내서』의 아자니아 해안과 랍타(40 무렵~300 무렵)"
  summary:
    ko: "1세기 중엽 무렵 이집트의 그리스어 상인이 쓴 『에리트레아 해 안내서』는 홍해와 인도양 항구를 안내하는 글이다. 이 글은 아프리카 뿔에서 남쪽으로 이어지는 해안을 ‘아자니아’라 부르고, 그 끝의 상관을 랍타라 적는다. 랍타는 ‘아자니아의 마지막 교역항’이며 메누티아스 제도(탄자니아 앞바다의 섬)에서 이틀 길을 가면 닿는다. 책에 따르면 이곳은 남아라비아 힘야르 왕국의 제후로서 ‘마파리티스 족장’이 다스렸고, 아라비아 상인들이 배를 대고 현지 여자를 아내로 맞아 말을 익혔다고 한다. 이 책이 꼽는 상품은 상아와 거북 등딱지뿐이지만, 이것이 다른 교역품이 없었다는 뜻은 아니다. 2세기 프톨레마이오스의 『지리학』은 상인 디오게네스가 인도에서 돌아오다 바람에 밀려 스물닷새 남쪽으로 내려가 랍타에 닿았다고 전하고 랍타를 ‘바르바리아의 수도’라 부른다. 프톨레마이오스는 그리스인 선장 테오필로스가 아프리카 뿔에서 랍타까지 스무 날이 걸렸다고 했다는 이야기도 전한다. 『에리트레아 해 안내서』의 지은 때는 대체로 1세기 중엽으로 보나 정확한 해는 논쟁이 있다. 랍타의 자리는 확정되지 않았다. 판가니·탕가·루피지강 하구를 꼽는 견해와 마피아섬 및 루피지 하구 맞은편 본토의 로마 시대 교역 유적을 근거로 드는 견해가 있다. 한편 고고학은 1세기 앞뒤 동아프리카 해안에 철을 쓰고 농사짓는 반투어 사람들이 이르렀음을 보여 준다. 탄자니아 미사사와 케냐 퀘일레 같은 유적은 기원전 1세기에서 기원후 3세기 사이로 본다. 이른바 철기 시대 사하라 이남 아프리카의 농경 정착이 해안에 닿은 것이다. 이들은 해안의 사냥·채집 사람들과 섞여 살았고, 이 접촉이 뒤 스와힐리 해안의 바탕이 되었다고 본다."
  subjects: [sub-saharan-iron-age]
  tags: [economy, society]
  sources:
    - "『에리트레아 해 안내서』"
    - "프톨레마이오스, 『지리학』 1권 9장"
    - "The Cambridge History of Africa, Vol. 2: From c. 500 BC to AD 1050 (Cambridge University Press, 1978)"
    - "위키백과 Rhapta (https://en.wikipedia.org/wiki/Rhapta)"

- id: aksum-rise-100
  year: 100
  endYear: 299
  title:
    ko: "악숨 왕국의 성립과 홍해 교역(100 무렵~300 무렵)"
  summary:
    ko: "악숨 왕국은 에리트레아 고원과 티그라이 고원에서 일어났다. 앞서 기원전 980년 무렵부터 400년 무렵까지 이 일대에는 다아마트라는 나라가 있었고, 사바 사람의 영향은 작았다고 본다. 악숨의 시작은 1세기로 보며, 100년 무렵부터로 잡는다. 고고학은 이 나라가 기원전 150년에서 기원후 150년 사이에 모습을 갖추었다고 본다. 1세기 중엽 무렵의 『에리트레아 해 안내서』는 악숨과 항구 아둘리스, 이 일대를 다스리는 왕 조스칼레스를 적고 상아·코뿔소 뿔 같은 상품을 꼽는다. 이로써 악숨이 로마 이집트와 인도양 교역을 잇는 홍해의 항구를 쥐었음을 안다. 2세기 말에서 3세기 초에는 게다라(GDRT)라는 왕이 남아라비아에 간섭해 예멘 서부 일부를 한동안 다스렸으나, 사바와 힘야르의 압박으로 물러났다고 본다. 250년 무렵에는 셈브루테스가 다스렸고, 재위 24년째 날짜가 적힌 그리스어 비문이 남아 있다. 3세기 후반 마니는 세상의 큰 나라로 로마·페르시아·중국과 함께 악숨을 들었다. 엔두비스는 270년 무렵부터 300년 무렵까지 다스렸다고 보며(악숨 왕 목록은 295~310년 무렵으로 적는다), 악숨 최초로 금·은·동 주화를 찍은 왕으로 알려진다. 주화에는 해와 초승달 무늬와 그리스어 글이 새겨져, 악숨이 지중해 세계의 화폐 문화에 참여했음을 말해 준다. 수도 악숨에는 큰 돌기둥 석비와 왕릉이 서고, 이는 이 시기 왕권을 보여 주는 유적으로 꼽힌다. 216년에서 274년 사이를 산 마니가 악숨을 큰 나라로 꼽았다는 사실은 3세기 후반 악숨의 이름이 로마 밖 세계에까지 알려졌음을 보여 준다. 엔두비스 주화의 연대를 227~235년으로 보는 설도 있다. 왕명록에는 에자나조차 오르지 않아 왕의 순서는 주화와 비문으로 맞춘다. 『에리트레아 해 안내서』의 조스칼레스를 뒤 왕명록에 이어 보는 데는 학설이 갈린다."
  subjects: [aksum, roman-empire]
  tags: [politics, economy]
  sources:
    - "『에리트레아 해 안내서』"
    - "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (Edinburgh University Press, 1991)"
    - "Stanley M. Burstein, Ancient African Civilizations: Kush and Axum (Markus Wiener, 1998)"
    - "위키백과 Kingdom of Aksum (https://en.wikipedia.org/wiki/Kingdom_of_Aksum)"

- id: aksum-coinage-270
  year: 270
  endYear: 330
  title:
    ko: "악숨의 주화와 홍해·인도양 교역의 전성(270 무렵~330 무렵)"
  summary:
    ko: "악숨은 3세기 후반부터 4세기 초에 걸쳐 홍해와 인도양 교역의 한 축으로 자랐다. 이 나라의 금화·은화·동화에는 왕의 얼굴과 그리스어 글이 새겨졌다. 이 글은 지중해와 아라비아의 상인이 읽을 수 있는 말이었다. 금화는 로마의 금화와 무게를 견주어 만들어졌다는 견해가 있고, 은과 동으로 만든 작은 주화는 나라 안에서도 쓰였다고 본다. 악숨 왕 가운데 주화로만 이름이 알려진 이들이 있어, 아필라스(310년 무렵~320년대 초) 같은 이름은 왕명록보다 주화에서 먼저 확인된다. 항구 아둘리스는 홍해 쪽 문이었고, 상아·코뿔소 뿔·거북 등딱지·금과 향료가 이곳을 거쳐 이집트와 인도로 갔다고 본다. 6세기 초 아둘리스를 찾은 상인 코스마스 인디코플레우스테스는 이곳 비문을 베껴 적었고, 이 ‘아둘리스 비문’은 악숨 쪽 지배 범위를 보여 주는 사료로 쓰인다. 코스마스는 또 악숨 왕이 아가우 지방의 총독을 두어 남쪽 대상로를 지키게 했다고 적는다. 에자나의 주화는 해와 초승달 무늬에서 십자가로 바뀌고, 한 주화에는 ‘이것이 나라의 마음에 들기를’이라는 뜻의 그리스어 글이 새겨졌다. 악숨 왕 목록은 와제바를 330년대 말의 왕으로, 에자나를 340년대 중반부터 380년까지 다스린 왕으로 적는다. 주화는 악숨과 아둘리스 유적에서 가장 많이 나온다. 칼레브의 얼굴을 새긴 주화도 남아 6세기까지 주화 전통이 이어졌음을 보여 준다. 왕명록이 없는 시기가 길어, 주화는 왕의 순서를 맞추는 거의 유일한 근거 구실을 한다. 주화 제작은 7세기에 끝났다고도, 8세기 초까지 이어졌다고도 하여 학설이 갈린다. 악숨이 지중해와 인도양 사이의 중개 노릇을 한 것은 이 시기의 가장 두드러진 특징이다."
  subjects: [aksum]
  tags: [economy]
  sources:
    - "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (Edinburgh University Press, 1991)"
    - "Stuart Munro-Hay·Bernard Juel-Jensen, Aksumite Coinage (Spink, 1995)"
    - "Stanley M. Burstein, Ancient African Civilizations: Kush and Axum (Markus Wiener, 1998)"
    - "코스마스 인디코플레우스테스, 『기독교 지형학』"
    - "위키백과 Kingdom of Aksum (https://en.wikipedia.org/wiki/Kingdom_of_Aksum)"

- id: bantu-south-300
  year: 300
  endYear: 600
  title:
    ko: "반투어 사람들의 동·남아프리카 확산과 림포포강 도달(300 무렵~600 무렵)"
  summary:
    ko: "동아프리카 해안의 이른 정착은 「『에리트레아 해 안내서』의 아자니아 해안과 랍타(40 무렵~300 무렵)」(앞의 사건)에서 다룬다. 반투어 사람들의 확산은 대체로 기원전 4000년 무렵부터 기원후 500년 무렵까지의 일로 보며, 이들은 중앙아프리카 숲의 피그미 계통 사냥·채집민과도 어울려 살았고 혼인이 흔했다고 본다. 대호수 지역에서 남쪽으로 퍼진 갈래는 300년 무렵 오늘날 남아프리카 콰줄루나탈에 닿았다고 보며, 500년 무렵에는 림포포강 둘레에 이르렀다고 본다. 이때가 이른바 철기 시대 사하라 이남 아프리카의 끝 무렵이다. 이들은 마을을 이루어 수수·기장 농사를 짓고 소·양·염소를 쳤으며 철제 연장과 토기를 만들었다. 남부 아프리카에는 이미 사냥·채집을 하던 코이산어 사람들과 유목을 하던 사람들이 살았다. 두 집단은 오랫동안 섞였고, 남부 반투어에 코이산어의 흡착음이 들어 있는 것이 그 증거로 꼽힌다. 유전학 연구도 서로 섞인 흔적을 보인다. 구전은 일부 지역에서 싸움이 있었음을 전하나, 앙골라 같은 곳에서 사람들이 완전히 바뀌었는지 섞였는지는 아직 정해지지 않았다. 반투어 사람들의 확산을 한 번의 대이동으로 보지 않고 여러 갈래로 나뉜 여러 번의 흩어짐으로 본다. 가장 이른 토기가 나온 곳을 곧 반투어 사람들이 처음 이른 곳으로 보는 것은 순환 논법이라는 지적도 있다. 서쪽 갈래는 앙골라 중부에 기원전 500년 무렵 닿았다고 보며, 서쪽과 동쪽 갈래가 갈라진 때를 기원전 2500~1200년 사이로 보는 치아 연구도 있다. ‘반투’라는 말은 본디 언어학 용어였으나 뒤에 사회적·인종적 뜻이 얹혔다는 지적이 있다. 이 확산은 수백 년에 걸쳐 일어난 느린 과정이었다. 이 확산으로 사하라 이남 아프리카의 남쪽 대부분에서 반투어를 쓰는 농경·철기 사회가 바탕을 이루게 되었다."
  subjects: [sub-saharan-iron-age]
  tags: [society]
  sources:
    - "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 1995)"
    - "The Cambridge History of Africa, Vol. 2: From c. 500 BC to AD 1050 (Cambridge University Press, 1978)"
    - "Christopher Ehret, The Civilizations of Africa: A History to 1800 (University Press of Virginia, 2002)"
    - "위키백과 Bantu expansion (https://en.wikipedia.org/wiki/Bantu_expansion)"

- id: ezana-meroe-330
  year: 330
  endYear: 360
  title:
    ko: "에자나의 개종과 메로에 원정, 쿠시 왕국의 끝(330 무렵~360 무렵)"
  summary:
    ko: "에자나는 320년대에서 360년 무렵까지 악숨을 다스린 왕으로(재위를 340년대 중반~380년으로 적는 왕 목록도 있다), 아버지는 우사나스(엘라 아미다)다. 왕이 어렸을 때는 어머니 소피아가 섭정했다고 전한다. 프루멘티우스가 에자나를 가르쳐 기독교로 이끌었고 330년 무렵 주교가 되었다고 본다. 개종 시기는 324년, 325년·328년, 340년 무렵으로 학설이 갈리는데, 주화의 해와 초승달 무늬가 십자가로 바뀐 때는 340년 무렵으로 본다. 로마 제국의 황제 콘스탄티우스 2세는 에자나와 동생 사이자나에게 편지를 보내 프루멘티우스를 알렉산드리아로 보내 시험받게 하라고 요구했다. 에자나 비문은 왕이 노바와 베자, 카수 같은 이웃을 친 일을 새겼다. 메로에에서는 에자나나 그 앞의 우사나스가 새겼다고 보는 게에즈 비문 둘이 나와 4세기 악숨의 원정을 알게 한다. 이를 메로에 왕국의 파괴로 읽는 이도 있고, 300년 무렵부터 메로에가 이미 기울어 있었거나 악숨이 노바의 반란을 도운 것으로 보는 이도 있어 증거는 결정적이지 않다. 메로에 시대 쿠시 왕국은 350년 무렵 끝났다고 본다. 노바의 침입, 기후 악화, 안의 반란, 홍해 교역로의 변화 같은 원인이 함께 꼽히나 무게는 합의되지 않았다. 메로에의 마지막 피라미드와 일반 무덤은 4세기 중엽의 것으로 본다. 에자나의 칭호에는 악숨과 힘야르, 라이단, 사바, 베자, 카수의 왕이라는 말이 들어 있어 이 무렵 그가 내세운 세력 범위를 말해 준다. 쿠시의 뒤를 이어 누비아에는 세 나라가 선다(「쿠시 뒤의 누비아: 노바티아·마쿠리아·알로디아의 성립(350 무렵~550 무렵)」, 뒤의 사건). 에티오피아 정교회는 에자나와 사이자나를 성인으로 받든다."
  subjects: [aksum, kush-napata, roman-empire]
  tags: [religion, war]
  sources:
    - "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (Edinburgh University Press, 1991)"
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "위키백과 Ezana of Axum (https://en.wikipedia.org/wiki/Ezana_of_Axum)"
    - "위키백과 Kingdom of Kush (https://en.wikipedia.org/wiki/Kingdom_of_Kush)"

- id: nubian-kingdoms-350
  year: 350
  endYear: 550
  title:
    ko: "쿠시 뒤의 누비아: 노바티아·마쿠리아·알로디아의 성립(350 무렵~550 무렵)"
  summary:
    ko: "메로에의 쿠시 왕국이 350년 무렵 끝난 뒤 나일강 유역에는 세 나라가 섰다. 북쪽은 노바티아, 가운데는 마쿠리아, 남쪽은 알로디아다. 노바티아는 디오클레티아누스 황제가 297년 노바 사람을 아래 누비아에 불러 앉혔다는 이야기에서 시작하나, 나라의 모습은 400년 무렵부터 뚜렷하다. 쿠스툴과 발라나의 왕릉이 이 나라의 것으로 보이며 이른바 X 그룹 문화와 이어진다. 노바티아는 동쪽 사막의 블렘미에스를 물리치고 제2 폭포와 제3 폭포 사이로 땅을 넓혔다. 450년 무렵의 왕 실코는 그리스어 이름 바실리스코스로 서명한 칼라브샤 비문에서 블렘미에스를 사막으로 몰아냈다고 자랑했다. 수도는 파라스(파코라스)에 두었다. 마쿠리아는 5세기에 일어나 제3 폭포에서 남쪽으로 이어진 땅에 자리했고, 5세기 말 왕이 힘의 근거를 나파타에서 동골라 요새로 옮겨 500년 무렵 동골라가 도읍이 되었다고 본다. 알로디아는 350년 무렵 쿠시가 무너진 뒤 청나일강과 백나일강이 만나는 곳 둘레 소바를 도읍으로 일어났다고 본다. 어떻게 생겼는지는 알려져 있지 않으며 569년 에페소스의 요한의 『교회사』가 처음 언급한다. 마쿠리아는 동로마 제국과 일찍부터 접촉했고, 유스티니아누스는 530년대에 사산 페르시아에 맞설 기독교 동맹을 바라 이곳에 다가갔다고 본다. 세 나라의 처음은 사료가 적어 쿠시가 무너지기 앞서 이미 자치를 누리던 지방 세력에서 자랐다고 보는 견해도 있다. 세 나라는 동로마 제국과 이집트 교회의 영향 속에서 기독교를 받아들였다(「누비아 세 나라의 기독교 수용(543~580)」, 뒤의 사건). 이 세 나라는 모두 7세기 이후 이슬람 세계와 마주한다."
  subjects: [nobatia, makuria, alodia, byzantine-empire]
  tags: [politics, society]
  sources:
    - "Derek A. Welsby, Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)"
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "에페소스의 요한, 『교회사』"
    - "위키백과 Nobatia (https://en.wikipedia.org/wiki/Nobatia)"
    - "위키백과 Alodia (https://en.wikipedia.org/wiki/Alodia)"
    - "위키백과 Makuria (https://en.wikipedia.org/wiki/Makuria)"

- id: aksum-nine-saints-480
  year: 480
  endYear: 550
  title:
    ko: "아홉 성인과 악숨 기독교의 정착(480 무렵~550 무렵)"
  summary:
    ko: "에자나 이후에도 기독교는 한동안 아둘리스에서 악숨에 이르는 대상로 둘레의 좁은 지대에 머물러 있었다. 에티오피아 전승은 5세기 말 아홉 성인이 와서 신앙을 넓혔다고 전한다. 아바 아프체, 아바 알레프, 아바 아라가위, 아바 가리마, 아바 구바, 아바 리카노스, 아바 판텔레온, 아바 차흐마, 아바 예마타라고 하며, 흔히 시리아에서 왔다고 하나 시리아 출신은 둘이나 셋뿐이고 나머지는 콘스탄티노폴리스·아나톨리아·로마에서 왔다는 견해도 있다. 칼케돈 공의회(451년) 뒤 단성론파에 대한 박해를 피해 왔을 것이라는 추측이 있으나 확증은 없다. 이들은 파코미오스의 규칙을 따르는 수도원을 세웠다고 전한다. 아프체는 예하, 알레프는 비이사, 아라가위는 데브레 다모, 가리마는 아드와 북쪽의 가리마 수도원, 구바는 마다라, 차흐마는 세데냐, 예마타는 가르알타에 자리했다고 한다. 방사성 탄소 연대는 『가리마 복음서』가 5~6세기의 것임을 보여 가리마가 5세기 말에 닿았다는 전승과 크게 어긋나지 않는다고 보며, 가리마가 썼다고 전하는 이 책은 세계에서 가장 이른 삽화 기독교 필사본으로 꼽히고 에티오피아에 남은 가장 오랜 필사본이기도 하다. 아홉 성인을 유대계 기독교인으로 보아 에티오피아 기독교의 유대적 색채를 설명하는 견해도 있다. 칼레브(재위 514~534년으로 보는 견해와 542년까지로 보는 견해가 있다) 때에는 아가우 부족들이 통합되어 악숨의 영역이 와그와 라스타로 넓어졌다고 본다. 530년에는 동로마 사절 노논노소스가 칼레브를 만났다. 칼레브가 힘야르를 친 일은 「두 누와스와 나지란의 학살(523 무렵), 악숨의 예멘 정복(525)」(뒤의 사건)에서 다룬다. 에티오피아 전승은 칼레브가 말년에 왕관을 예루살렘으로 보내고 수도원에 들었다고 전한다."
  subjects: [aksum, byzantine-empire]
  tags: [religion, society]
  sources:
    - "Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (Edinburgh University Press, 1991)"
    - "Taddesse Tamrat, Church and State in Ethiopia 1270–1527 (Clarendon Press, 1972)"
    - "Paul B. Henze, Layers of Time: A History of Ethiopia (Hurst, 2000)"
    - "위키백과 Nine Saints (https://en.wikipedia.org/wiki/Nine_Saints)"
    - "위키백과 Kaleb of Axum (https://en.wikipedia.org/wiki/Kaleb_of_Axum)"

- id: nubia-christian-543
  year: 543
  endYear: 580
  title:
    ko: "누비아 세 나라의 기독교 수용(543~580)"
  summary:
    ko: "필라이의 이시스 신전은 535~538년 사이 문을 닫았고, 누비아에는 이집트 교회의 선교사들이 닿기 시작했다. 에페소스의 요한의 『교회사』에 따르면 동로마 제국의 유스티니아누스 황제와 그의 아내 테오도라 황후는 서로 다른 교리를 앞세워 누비아에 선교사를 보내려 했다. 유스티니아누스는 칼케돈파, 테오도라는 단성론(미아피시스파)이었다. 유스티니아누스의 칼케돈파 선교단은 노바티아 왕이 더 남쪽으로 보내지 않았고, 543년 테오도라가 보낸 율리아노스와 필라이의 테오도로스가 노바티아에서 선교를 시작했다. 이 해를 노바티아의 공식 개종으로 본다. 그 앞서 아래 누비아에서는 필라이의 이시스 신앙이 국가 종교 구실을 했다. 노바티아가 받아들인 것은 칼케돈파가 아니라 이집트 교회의 비칼케돈 신앙이었다. 551년에 이 선교는 한때 끊겼다. 롱기노스는 유스티니아누스의 명으로 콘스탄티노폴리스에 갇혀 있다가 567년 달아나 이집트로 돌아왔고, 569년 노바티아에 와서 여섯 해를 머물며 누비아 최초의 교회를 세우고 성직자와 예배 의식을 갖추었다고 한다. 575년 그는 알렉산드리아로 돌아갔다가 총대주교 후계 다툼에서 밀려 아라비아로 유배되었다. 580년 알로디아의 왕이 노바티아 왕에게 편지를 보내 노바티아를 개종시킨 주교를 보내 달라고 청하자 롱기노스가 돌아왔다. 그는 칼케돈파를 받아들인 마쿠리아를 피해 코로스코 길로 동쪽 사막을 건너 알로디아에 이르렀고, 왕과 가족, 귀족에게 세례를 주었다고 전한다. 마쿠리아는 6세기 전반 고고학상으로, 또는 568년 무렵 요한 비클라렌시스의 기록으로 기독교를 받았다고 보며 칼케돈파를 따랐다. 뒤에 마쿠리아는 단성론을 공식 신앙으로 삼게 된다."
  subjects: [nobatia, makuria, alodia, byzantine-empire]
  tags: [religion, diplomacy]
