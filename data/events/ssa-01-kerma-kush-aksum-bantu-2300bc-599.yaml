# 사하라 이남 사건 2묶음 갈래 01: 케르마·쿠시·악숨·반투어 사람들의 확산 (기원전 2333 ~ 599년)
# 범위: 기원전 2300 무렵~기원후 599. 천문 연도 −2299~599. 케르마와 이집트의 누비아 교역·신왕국의 누비아 정복, 반투어 사람들의 확산과 철기, 나파타와 메로에의 쿠시 왕국, 로마–쿠시 전쟁, 노크 문화와 젠네-제노,
#   가라만테스와 사하라 교역, 동아프리카 해안의 아자니아, 악숨 왕국의 성립·주화·전성·개종·메로에 원정, 아홉 성인, 노바티아·마쿠리아·알로디아의 성립과 기독교 수용.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 주변 구역(누비아 사막·사하라 남부)의 이른 시대 일은 사료가 적어도 800자를 채우도록 가까운 사건과 합치지 않고 따로 썼다.
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N)로 넣고 본문·제목에는 '기원전 N년'으로 적었다. 사건 id 끝 '-Nbc'와 제목의 첫 해는 그 사건 year의 기원전 해이다.
#   학설이 갈리는 해(쿠시의 시작, 악숨의 시작, 에자나의 개종)는 하나를 골라 '~로 본다'로 적고 다른 학설은 한 구절만 덧붙였다. 쿠시는 기원전 785년 무렵부터, 악숨은 100년 무렵부터, 쿠시의 끝은 350년 무렵으로 적었다.
# 달력: 1582년 앞 날짜는 해·달까지만 적었다. 전승·구술·왕명록은 '~라고 전한다'로, 고고학 연대(방사성 탄소·열발광)는 '유적 연대로 ~로 본다'로 근거의 성격을 밝혔다.
# 이름 규칙: 항목 이름(케르마 왕국·쿠시 왕국·악숨 왕국·노바티아·마쿠리아·알로디아)과 '철기 시대 사하라 이남 아프리카'를 그대로 썼고, 저장소 서아시아 사건 글의 꼴(피예·카슈타·타하르카·투트모세)을 따랐다.
# 이집트와의 관계: 이집트 신왕국의 누비아 정복과 지배는 일어난 일 그대로 적고, 이집트 항목은 subjects·links에 쓰지 않았다. 이집트 제25왕조의 일은 서아시아 사건을 「제목」으로 가리켰다.
# 다른 파일 사건과의 관계: 「이집트 제3중간기의 분열: …」「피예의 이집트 원정…」「쿠시 왕조의 끝…」「프삼티크 2세의 누비아 원정…」「로마의 이집트 속주…」「두 누와스와 나지란의 학살…」을 가리키고 다시 쓰지 않았다.
# 한국사와 닿는 점: 없음.

- id: kerma-early-2300bc
  year: -2299
  endYear: -1749
  title:
    ko: "초기·중기 케르마 문화와 이집트의 누비아 교역(기원전 2300 무렵~1750 무렵)"
  summary:
    ko: "케르마는 나일강 제3 폭포 남쪽에서 일어난 문화로, 기원전 2500년 무렵부터 2000년 무렵까지를 초기, 그 뒤 기원전 1750년 무렵까지를 중기로 나눈다. 같은 자리에는 기원전 3500년 무렵부터 케르마 앞 시기의 마을이 있었다고 본다. 초기에 요새로 두른 작은 마을이던 곳은 중기에 성곽을 둘러 3헥타르 남짓으로 컸고, 이것이 뒤에 케르마 왕국의 도읍이 되었다. 이 무렵 이집트는 제1 폭포와 제2 폭포 사이의 아래 누비아에 힘을 뻗었다. 고왕국 때에는 아스완의 관리들이 상류의 ‘이암’이라는 땅까지 올라가 흑단·상아·향료를 구해 오는 길을 텄다고 그들의 무덤 비문이 전하며, 이암을 케르마 둘레로 보는 견해가 많으나 위치는 확정되지 않았다. 중왕국의 왕들은 기원전 1990년 무렵부터 1725년 무렵까지(아멘엠하트 1세에서 세베크호테프 4세까지로 본다) 아래 누비아로 원정을 되풀이했고, 세누스레트 1세는 이쿠르·쿠반·아니바·부헨·코르에 요새를 쌓았다. 쿠반의 요새는 금광을 지켰다. 이에 케르마는 제2 폭포 남쪽의 사이섬을 굳게 지켜 경계로 삼았다. 이집트 기록은 이 남쪽 땅을 ‘쿠시’라 불러 적었다. 케르마 유적에는 이집트산 물건과 누비아의 얇은 검은 테두리 토기가 함께 나오고, 이로써 금과 상아가 이집트로 가고 이집트의 장인과 물자가 남으로 들어온 교역의 흔적을 읽는다. 20세기 초 발굴자 라이스너는 케르마를 이집트의 교역 거점으로 보았으나, 뒤의 발굴은 이곳이 현지에 뿌리를 둔 큰 도시였음을 보였다. 고왕국 때 이집트가 아래 누비아를 쥐고 있었고, 누비아 지배자들은 처음에는 이집트 왕에게 충성한 것으로 보인다. 에리트레아와 수단 동부의 가슈 문화도 케르마와 오래 교류한 교역 상대였다."
  subjects: [kerma]
  tags: [society, economy]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "Charles Bonnet·Dominique Valbelle, The Nubian Pharaohs (American University in Cairo Press, 2006)"
    - "The Cambridge History of Africa, Vol. 1: From the Earliest Times to c. 500 BC (Cambridge University Press, 1982)"
    - "위키백과 Kerma culture (https://en.wikipedia.org/wiki/Kerma_culture)"

- id: classic-kerma-1750bc
  year: -1749
  endYear: -1549
  title:
    ko: "고전기 케르마 왕국: 상누비아의 통일과 이집트와의 맞섬(기원전 1750 무렵~1550 무렵)"
  summary:
    ko: "기원전 1750년 무렵부터 1500년 무렵까지를 고전 케르마라 부른다. 이 무렵 케르마는 25헥타르 남짓의 도시로 자랐고, 중심에는 흙벽돌로 쌓은 큰 신전 서쪽 데푸파가 섰다. 케르마의 지배자는 제1 폭포에서 제4 폭포 사이의 상누비아를 다스린 왕으로 보며, 이 나라를 케르마 왕국이라 부른다. 왕의 무덤은 지름 수십 미터의 봉분으로 쌓았고, 흰 석영 조각을 덮은 것이 있으며, 왕과 함께 많은 사람이 순장된 흔적이 나온다. 이집트에서는 중왕국이 기울어 제13왕조의 통제가 약해진 틈에 케르마가 아래 누비아의 요새들을 차지해 갔다고 본다. 이집트는 이 무렵 북쪽의 힉소스와 남쪽의 쿠시로 둘러싸였다. 카모세가 새긴 비문은 자신이 아시아인과 누비아인 사이에 끼여 앉았다고 한탄했다고 전하고, 힉소스가 케르마에 사신을 보냈다는 내용도 담는다. 네켄의 총독 세베크나크트 2세의 무덤 비문은 케르마 군이 기원전 1575년에서 1550년 사이 이집트 깊숙이까지 쳐들어왔다고 적는데, 이것을 이집트에 큰 타격을 준 일로 보는 견해가 있다. 케르마와 힉소스가 실제로 손잡았는지는 학설이 갈린다. 이집트 글은 케르마와 그 둘레를 ‘쿠시’라 불렀다. 케르마 사람들의 말은 쿠시계 아프로아시아어라는 견해와 동수단어 계통의 닐로사하라어라는 견해가 맞선다. 케르마는 금·소·흑단·향·상아를 이집트에 내다 팔았고, 중앙 아프리카 안쪽의 사치품이 이집트로 가는 길목이기도 했다고 본다. 2003년 스위스 조사단은 케르마에서 제25왕조 타하르카와 타누타문의 검은 화강암 상을 찾아냈는데, 쿠시 왕들이 뒤에도 케르마를 이어 쓴 자취로 읽는다. 기원전 1550년 무렵 이집트가 힉소스를 몰아낸 뒤 칼끝은 남쪽 케르마로 향한다(「이집트 신왕국의 누비아 정복과 케르마 왕국의 끝(기원전 1550 무렵~1450 무렵)」, 뒤의 사건)."
  subjects: [kerma]
  tags: [politics, war]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "Charles Bonnet·Dominique Valbelle, The Nubian Pharaohs (American University in Cairo Press, 2006)"
    - "Stuart Tyson Smith, Wretched Kush: Ethnic Identities and Boundaries in Egypt's Nubian Empire (Routledge, 2003)"
    - "위키백과 Kerma culture (https://en.wikipedia.org/wiki/Kerma_culture)"

- id: new-kingdom-nubia-1550bc
  year: -1549
  endYear: -1449
  title:
    ko: "이집트 신왕국의 누비아 정복과 케르마 왕국의 끝(기원전 1550 무렵~1450 무렵)"
  summary:
    ko: "이집트 제18왕조의 왕들은 힉소스를 몰아낸 뒤 남쪽 누비아로 눈을 돌렸다. 아흐모세 1세가 누비아로 원정했다고 보며, 아멘호테프 1세를 거쳐 투트모세 1세(재위 기원전 1506~1493년으로 보는 견해가 많다)가 서자 누비아가 반란을 일으켰다. 해군 군인 아흐모세 이븐 에바나의 무덤 자서전은 투트모세가 직접 누비아의 왕을 쓰러뜨려 그 주검을 배 앞머리에 매달았다고 전한다. 즉위 2년째의 톰보스 석비는 제3 폭포 가까이에 요새를 지었다고 적고, 3년째에는 제1 폭포의 수로를 쳐내 배가 오르기 쉽게 했다. 4년째 다시 반란이 일자 이집트의 영향은 제4 폭포 남쪽 쿠르구스까지 닿았다. 이 일련의 원정으로 케르마 왕국은 기원전 1504년 무렵 이집트에 병합되어 끝났다고 본다. 투트모세는 투리를 ‘쿠시의 왕자’라 불리는 총독으로 앉혔고, 이 직책이 이집트의 누비아 지배를 맡았다. 이집트 사람들은 누비아에 요새와 신전을 세웠고 사이섬·세데인가·솔렙이 그 가운데 있다. 투트모세 3세 때에는 나일강 제4 폭포 가까운 나파타의 게벨 바르칼이 아문 신앙의 남쪽 중심이 되었다. 하트셉수트의 푼트 원정(기원전 1470년 무렵)으로 대표되는 홍해 교역도 이 시기 이집트의 남쪽 진출과 이어진다. 투트모세 1세가 죽은 뒤에도 반란이 되풀이되어 이집트는 기원전 1300년 무렵까지 2백 년 남짓 누비아의 안정에 힘을 쏟았다고 본다. 투트모세 1세의 쿠르구스 비문과 하가르 엘메르와의 부조는 이집트 세력이 가장 남쪽까지 닿은 자취다. 누비아의 지배층 자제는 이집트 궁정에서 자라 이집트식 이름과 풍습을 받아들였고, 이집트 신전과 관료·군에 들어간 누비아 사람도 많았다고 본다. 이 뒤 누비아는 이집트의 한 속주로 4백 년 남짓 이집트 문화를 받아들였다."
  subjects: [kerma]
  tags: [politics, war]
  sources:
    - "Derek A. Welsby, The Kingdom of Kush: The Napatan and Meroitic Empires (British Museum Press, 1996)"
    - "Stuart Tyson Smith, Wretched Kush: Ethnic Identities and Boundaries in Egypt's Nubian Empire (Routledge, 2003)"
    - "Charles Bonnet·Dominique Valbelle, The Nubian Pharaohs (American University in Cairo Press, 2006)"
    - "위키백과 Thutmose I (https://en.wikipedia.org/wiki/Thutmose_I)"

- id: bantu-iron-1000bc
  year: -999
  endYear: -499
  title:
    ko: "반투어 사람들의 확산과 사하라 이남의 철기(기원전 1000 무렵~500 무렵)"
  summary:
    ko: "반투어는 카메룬과 나이지리아 사이 고원에서 갈라져 나온 말로, 이 말을 쓰는 사람들이 적도 아프리카와 동·남아프리카로 퍼진 일을 반투어 사람들의 확산이라 한다. 시작 연대는 학설마다 갈려 기원전 3천년기 무렵으로 보는 견해가 많다. 서쪽 갈래는 우거진 숲 속을 천천히 남쪽으로 나아가 기원전 1500년 무렵 카메룬 중부에 닿았고 기원전 500년 무렵 숲 남쪽 끝에 이르렀다고 본다. 동쪽 갈래는 숲 북쪽 가장자리를 따라 동으로 나아가 기원전 500년 무렵 빅토리아 호수 서쪽에 닿았고, 우레웨 토기가 그 흔적이다. 이 시기 사하라 이남에서는 철이 널리 쓰이기 시작했다. 이른바 철기 시대 사하라 이남 아프리카의 시작이다. 철을 처음 만든 곳과 시기는 아직 논쟁이다. 이집트와 쿠시에서 건너왔다는 견해, 서아프리카 노크 문화 둘레에서 따로 시작했다는 견해, 대호수 지역에서 시작했다는 견해가 맞선다. 철을 확실히 쓴 흔적은 기원전 400년 무렵부터 나타나며, 이것은 반투어 사람들이 처음부터 철을 지니고 퍼진 것은 아니라는 뜻이다. 반투어의 뿌리가 된 말을 쓰던 사람들은 마을에 살며 기름야자와 견과, 곡식을 기르고 염소와 뿔닭을 쳤다고 본다. 철제 도끼는 숲을 밀어 농사지을 땅을 넓혔고 철제 창과 화살촉은 사냥과 싸움을 바꾸었다. 서쪽 갈래의 걸음이 더뎠던 까닭을 숲을 헤칠 철 연장이 없어서라고 보는 설명이 있다. 반투어 사람들이 오기 앞서 이 땅에는 피그미 계통 사냥·채집민과 코이산어 사냥·채집민, 닐로사하라어 목축민, 쿠시계 목축민이 살았다. 크리스토퍼 에레트는 서아프리카에서 철 제련이 기원전 9~8세기에 따로 발명되었을 가능성을 제안하는데, 이는 정설이 아니다. 이 확산을 전쟁이나 인구 압력만으로 설명하는 견해는 지금은 설득력을 잃었다."
  subjects: [sub-saharan-iron-age]
  tags: [society, economy]
  sources:
    - "John Iliffe, Africans: The History of a Continent (Cambridge University Press, 1995)"
    - "The Cambridge History of Africa, Vol. 2: From c. 500 BC to AD 1050 (Cambridge University Press, 1978)"
    - "Christopher Ehret, The Civilizations of Africa: A History to 1800 (University Press of Virginia, 2002)"
    - "위키백과 Bantu expansion (https://en.wikipedia.org/wiki/Bantu_expansion)"

