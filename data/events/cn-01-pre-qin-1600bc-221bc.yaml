- id: qin-yan-jingke-227bc
  year: -226
  endYear: -221
  precision: year
  title:
    ko: "형가의 진왕 암살 시도(기원전 227)와 연의 멸망(기원전 226~222)"
  summary:
    ko: "연의 태자 단은 어려서 조 한단에서 진왕 정과 함께 지냈으나 진(秦)에 인질로 갔다가 박대를 받고 기원전 232년 달아났다. 진이 한과 조를 무너뜨리고 연 국경에 다가오자 단은 자객 형가에게 진왕을 죽이도록 부탁했다. 형가는 진에서 연으로 망명한 장군 번오기의 목과 연의 비옥한 땅 독항의 지도를 바치는 사신으로 꾸며 진왕에게 접근했다. 독항은 지금 허베이성 줘저우와 구안 둘레의 땅으로 알려졌다. 기원전 227년 함양궁에서 지도 끝에 감춘 비수로 진왕을 찔렀으나 실패했고 형가는 죽임을 당했다(『사기』 자객열전). 진왕은 칼이 칼집에서 잘 빠지지 않아 기둥을 돌며 달아났고, 시의 하무차가 약주머니를 던져 형가를 막았다고 한다. 형가를 전송한 고점리가 뒤에 축을 연주하다 진시황을 치려 했으나 붙잡혀 죽었다는 이야기도 전한다. 이 일을 구실로 진은 연 정벌을 서둘렀다. 기원전 227년 진군은 역수 서쪽에서 연과 대의 연합군을 깨뜨렸고, 이듬해(기원전 226년) 도읍 계를 함락했다. 계는 지금 베이징 서남쪽 광안먼 둘레로 추정된다. 연왕 희와 태자 단은 요동으로 달아났고, 연왕은 진의 압박에 단의 목을 베어 진에 바쳤다. 기원전 222년 왕분이 요동을 공격해 연왕 희를 사로잡아 연이 멸망했고, 같은 해 대왕 가도 평정되었다. 연이 진개 이래 요동을 차지하며 고조선과 맞닿았던 일(앞의 사건 「연 진개의 침입과 중심지 이동」)은 이때 진의 몫으로 넘어갔다. 요동에서 연이 사라진 뒤 진과 접하게 된 고조선의 부왕은 진을 경계해 형식적으로 복속했다고 전한다(뒤의 사건 「부왕·준왕의 왕위 세습과 관직 정비」). 형가와 연 태자 단의 이야기는 뒷날 협객의 상징이 되었고 시와 이야기로 오래 전해졌다."
  subjects: [qin-state, yan-state, gojoseon]
  links:
    - { from: qin-state, to: yan-state, note: "계를 함락하고 요동의 연을 멸함(기원전 226~222)" }
  tags: [war, politics]
  sources: ["『사기』 자객열전", "『사기』 진시황본기", "『사기』 연소공세가", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-wei-chu-225bc
  year: -224
  endYear: -221
  precision: year
  title:
    ko: "위의 멸망(기원전 225)과 초의 멸망(기원전 223)"
  summary:
    ko: "기원전 225년 진(秦)의 왕분은 위의 도읍 대량을 포위하고 황허강과 홍구의 물을 끌어들여 석 달 만에 성벽을 무너뜨렸다. 위왕 가가 항복해 위가 멸망했다(『사기』 진시황본기·위세가). 위는 양왕(애왕, 재위 기원전 318~296), 소왕(295~277), 안리왕(276~243), 경민왕(242~228)을 거쳐 마지막 왕 가(227~225)에 이르렀다. 기원전 242년 동군을 잃은 뒤 쇠약해졌고, 가는 즉위 3년 만에 항복했다. 초는 고열왕(재위 기원전 262~238) 뒤 유왕(기원전 237~228), 애왕(기원전 228), 부추(기원전 227~223)로 왕이 잇따라 바뀌었다. 같은 무렵(기원전 225~224년) 진은 이신과 몽염에게 20만 병력을 주어 초를 쳤으나 초의 장수 항연이 이신을 크게 깨뜨렸다. 진왕은 노장 왕전을 다시 불렀고, 왕전은 60만 병력을 요구해 얻은 뒤 기원전 224년 초 땅 깊이 들어가 오래 지구전을 벌였다. 초군이 지쳐 동쪽으로 움직이자 추격해 기남에서 크게 이겼다. 기원전 223년 진은 도읍 수춘을 함락하고 초왕 부추를 사로잡았다(『사기』 초세가). 항연은 창평군을 초왕으로 세워 회남에서 저항하다 죽었다고 하며 죽은 해는 사료마다 다르다. 항연은 뒷날 진에 맞서 일어난 항량의 아버지이자 항우의 할아버지라고 『사기』 항우본기는 적는다. 왕전은 이어 창장강 이남으로 진군해 월의 군장을 항복시키고 회계군을 두었다(기원전 222). 왕분은 왕전의 아들로, 부자가 각각 위와 초 전선을 맡았다. 두 전쟁으로 진은 화북 평원과 창장강 유역을 함께 얻어 통일의 마지막 단계로 나아갔다. 초는 영토가 가장 넓고 오랜 대국이었으나, 왕이 잇따라 바뀐 혼란과 장수의 패배 속에서 무너졌다. 대량이 물에 잠겨 무너진 일은 기술과 인력을 크게 동원한 통일 전쟁의 성격을 보여 준다."
  subjects: [qin-state, wei-state, chu-state]
  links:
    - { from: qin-state, to: wei-state, note: "대량을 수공으로 함락해 위를 멸함(기원전 225)" }
    - { from: qin-state, to: chu-state, note: "수춘을 함락해 초를 멸함(기원전 223)" }
  tags: [war]
  sources: ["『사기』 진시황본기", "『사기』 백기왕전열전", "『사기』 위세가", "『사기』 초세가", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-qi-221bc
  year: -221
  endYear: -220
  precision: year
  title:
    ko: "제의 항복과 천하의 통일(기원전 222~221)"
  summary:
    ko: "제는 민왕 뒤 양왕(재위 기원전 283~265)을 거쳐 왕 건(재위 기원전 264~221)이 이었다. 건은 즉위 초 어머니 군왕후와 상 후승이 정사를 이끌었고, 이 기간 제는 진(秦)을 섬기는 일에 정성을 다하며 다른 나라와 합종하지 않았다. 『사기』 전경중완세가는 진이 다섯 나라를 차례로 무너뜨리는 동안 제는 구원하지 않았다고 적는다. 진이 후승과 빈객에게 금을 주어 매수했다는 전언도 있다. 한·조·위·초·연이 차례로 무너진 뒤에야 제는 서쪽 국경에 군대를 모았으나, 기원전 221년 진의 왕분은 연의 요동을 평정한 군대를 이끌고 연 땅에서 남쪽으로 내려와 방비가 없는 쪽에서 임치로 들어갔다(『사기』 전경중완세가). 제는 싸움다운 싸움 없이 왕 건이 항복했다. 임치는 소진이 7만 호가 있다고 말한 큰 도시였다(『사기』 소진열전). 건은 공 땅으로 옮겨져 굶어 죽었고, 제 사람들은 건을 소나무와 잣나무 사이에 살게 한 이가 빈객이 아니냐고 노래했다고 한다. 진은 제 땅에 제군과 낭야군을 두었다. 이로써 진은 나머지 여섯 나라를 모두 무너뜨리고 천하를 통일했다. 제를 뺀 다섯 나라가 이미 무너지고 연의 요동과 대의 평정(기원전 222)으로 저항이 거의 끝난 터라 제의 항복은 마지막 한 걸음이었다. 기원전 230년 한을 시작으로 9년 만에 여섯 나라가 차례로 무너졌다. 먼 나라와 사귀고 가까운 나라를 치는 원교근공의 연장선에서 이 순서를 설명하기도 한다. 진왕 정은 스스로 시황제라 칭했다(군현제와 문자·도량형의 통일 같은 제국의 제도는 뒤의 사건 「진 시황제의 통일 제국: 황제 칭호와 군현제, 문자·도량형·화폐의 통일(기원전 221~210)」에서 다룬다). 이 무렵 고조선에서는 부왕이 진을 경계해 형식적으로 복속했다고 전한다(뒤의 사건 「부왕·준왕의 왕위 세습과 관직 정비」)."
  subjects: [qin-state, qin, qi-state, gojoseon]
  links:
    - { from: qin, to: qi-state, note: "임치에 들어가 제를 항복시키고 천하를 통일함(기원전 221)" }
  tags: [war, politics]
  sources: ["『사기』 진시황본기", "『사기』 전경중완세가", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: hundred-schools-479bc
  year: -478
  endYear: -220
  precision: year
  title:
    ko: "제자백가의 등장"
  summary:
    ko: "공자가 죽은 뒤(기원전 479) 진(秦)의 통일(기원전 221)까지 여러 사상가가 나와 서로 다른 주장을 펼쳤고, 이들을 제자백가라 한다. 철기와 전쟁으로 신분 질서가 흔들리면서 학식을 가진 사(士)가 여러 나라 군주를 찾아다니며 유세하는 길이 열렸다. 『한서』 예문지는 유가·도가·음양가·법가·명가·묵가·종횡가·잡가·농가 같은 갈래로 나눈다. 유가는 공자의 가르침을 이었으나 맹자(성선설과 왕도, 제와 위(魏) 등을 다님)와 순자(성악설과 예치, 제 직하학궁의 좨주)로 갈렸다. 공자 이후 유가가 정리한 『시』·『서』·『예』·『역』·『춘추』의 틀은 한나라 이후 국가 교육의 바탕이 되었다. 묵자(묵적)는 모든 사람을 차별 없이 사랑하라는 겸애와 침략 전쟁을 반대하는 비공을 주장하며 조직적 집단을 이끌었다. 『한비자』 현학편은 전국 말에 가장 이름난 학파로 유가와 묵가를 꼽는다. 도가는 노자와 송의 몽 출신 장자가 대표로 자연에 따르는 삶을 말했다. 법가는 위의 이회, 진(秦)의 상앙, 한의 신불해(뒤의 사건 「한(韓)의 정 병합(기원전 375)과 신불해의 개혁」)를 거쳐 한비가 『한비자』에서 법·술·세를 종합했다. 병가에는 손자와 손빈, 명가에는 공손룡과 혜시, 음양가에는 추연, 종횡가에는 소진과 장의가 있었다. 추연은 오행이 차례로 이기는 순환으로 왕조 교체를 설명했고, 이 생각은 뒷날 왕조마다 덕을 정하는 데 쓰였다. 제의 직하학궁은 임치 성문 곁에서 선왕 때 수많은 학자를 모아 열대부라 부르며 대우한 곳으로 알려졌다. 초에서는 굴원의 시 같은 초사가 나와 중원과 다른 남방 문화를 보였다. 이 가르침들은 천하를 어떻게 다스릴 것인가에 대한 답이었고, 진은 법가를 채택했다가 한나라 때 유가 중심으로 바뀐다."
  subjects: [qi-state, qin-state, wei-state, song-state, han-state, chu-state]
  tags: [culture, politics]
  sources: ["『한서』 예문지", "『사기』 맹자순경열전", "『사기』 노자한비열전", "『사기』 상군열전", "Yuri Pines, Envisioning Eternal Empire: Chinese Political Thought of the Warring States Era (University of Hawaii Press, 2009)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: iron-ox-irrigation-594bc
  year: -593
  endYear: -245
  precision: century
  title:
    ko: "철기와 우경, 수리와 화폐: 춘추 전국 시대의 변화"
  summary:
    ko: "중국에서 철기는 이르면 기원전 8세기 무렵에 나타났고 기원전 5세기 이후 널리 퍼졌다. 『국어』 제어에서 관중은 좋은 쇠(청동)로는 무기를, 나쁜 쇠(철)로는 호미와 낫을 만든다고 했다. 기원전 513년 진(晉)이 법을 새긴 쇠솥(형정)을 만들자 공자는 귀족의 질서가 무너진다고 비판했다(『춘추좌씨전』 소공 29년). 철제 쟁기날과 소를 이용한 우경이 퍼지며 깊이갈이와 거름이 늘고 농업 생산이 올랐다. 이에 따라 큰 하천을 이용한 수리 공사가 활발했다. 초 장왕 때 손숙오가 작피(지금 안후이성 서우셴)를 만들었다고 전하고, 위의 업에서는 서문표가 수로를 팠으며, 진(秦)에서는 기원전 3세기 중엽 이빙이 민장강에 도강언을 만들었고 정국이 징허강에서 정국거를 놓았다(뒤의 사건 「여불위의 진(秦)과 동쪽 진출(기원전 251~237)」). 화폐도 다양해, 주·한·위에서는 삽 모양의 포전, 제·연·조에서는 칼 모양의 도전, 진(秦)에서는 둥근 원전, 초에서는 조개 모양의 의비전을 썼다. 제의 임치는 소진이 수레바퀴통이 부딪치고 사람의 어깨가 닿을 만큼 붐빈다고 말했다고 『전국책』은 전한다. 토지와 호구에 직접 세금을 매기는 제도도 나타나 노(魯)는 기원전 594년 땅의 넓이에 따라 세를 매기는 초세무를 시행했고, 진(秦)은 기원전 375년 호적을 만들어 5가를 묶었다(『사기』 진본기). 군현도 늘어나 군주 직속 관료제의 기초가 되었다. 『맹자』는 정전제를 이상으로 그려 한 가구가 100무의 밭을 받는다고 했는데, 이 제도가 실제로 어떻게 운영되었는지는 학계에서 논쟁이 이어진다. 한국사와 닿는 점으로 연의 명도전과 철기가 고조선 지역으로 전해졌다(뒤의 사건 「철기 문화의 보급과 독자적인 청동기 문화」)."
  subjects: [qin-state, qi-state, wei-state, chu-state, yan-state, jin-chunqiu, gojoseon]
  tags: [economy, society]
