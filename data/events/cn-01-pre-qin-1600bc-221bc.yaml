- id: guoren-gonghe-841bc
  year: -876
  endYear: -826
  precision: year
  title:
    ko: "국인 폭동과 공화(기원전 841), 선왕의 즉위(기원전 827)"
  summary:
    ko: "서주 중기 이후 주는 왕이 직접 쓸 수 있는 땅과 재원이 줄고 서쪽 융과 북쪽 험윤의 압박이 커졌다. 하상주 단대공정 연표로 기원전 877년에 즉위한 여왕(厲王)은 영이공을 기용해 산과 못의 이익을 왕실이 독점하려 했고, 비방하는 이를 위나라 무당을 시켜 감시해 죽였다. 이 때문에 사람들이 길에서 눈빛만 나눌 뿐 말을 하지 못했다고 『사기』는 적는다. 그에 앞서 서주 중기에는 청동기에 새긴 명문(금문)이 많아져, 왕이 신하에게 관직과 땅, 수레를 내리는 책명 의식이 자주 기록되었다. 소왕은 남쪽 정벌에서 한수이강에서 목숨을 잃었다고 『죽서기년』은 적고, 목왕이 서쪽을 멀리 순행했다는 이야기는 『목천자전』에 전한다. 이렇게 왕이 직접 군대를 이끌고 나가는 일은 줄어들고 왕실 재정은 제후와 귀족의 공납에 기울었다. 소 목공은 백성의 입을 막는 것은 강을 막는 것보다 위험하다고 간언했으나(『국어』 주어), 여왕은 듣지 않았다. 기원전 841년 도읍 호경의 국인(도읍에 사는 평민과 하급 귀족)이 들고일어나자 여왕은 체(彘, 지금 산시성(山西) 훠저우)로 달아났다. 그 뒤 기원전 828년까지 14년을 공화(共和)라 한다. 『사기』는 주 정공과 소 목공이 함께 다스렸다고 읽었으나, 『죽서기년』은 공백(共伯) 화가 왕위를 대행했다고 적어 두 설이 갈린다. 소 목공은 태자 정(靜)을 자기 집에 숨겨 지켰고, 여왕이 체에서 죽자 정이 선왕(宣王, 즉위는 단대공정 연표로 기원전 827)이 되었다. 선왕은 험윤과 회이를 치고 왕실 권위를 되살려 중흥이라 불리지만, 기원전 789년 무렵에는 강융에게 크게 졌다고 전한다. 공화 원년인 기원전 841년은 『사기』가 연대를 해마다 이어 적을 수 있는 가장 이른 해이므로 중국사 연표의 기점으로 쓰인다."
  subjects: [western-zhou]
  tags: [politics, society]
  sources: ["『사기』 주본기", "『사기』 십이제후연표", "『국어』 주어", "『죽서기년』", "하상주 단대공정 연표(2000)", "Li Feng, Landscape and Power in Early China: The Crisis and Fall of the Western Zhou, 1045–771 BC (Cambridge University Press, 2006)"]

- id: haojing-fall-771bc
  year: -770
  endYear: -769
  precision: year
  title:
    ko: "호경 함락과 동주 천도(기원전 771~770)"
  summary:
    ko: "유왕(幽王, 재위는 단대공정 연표로 기원전 781~771)의 시기에는 가뭄과 지진이 겹쳐 기원전 780년 무렵 웨이허강·징허강·뤄허강이 모두 흔들렸다고 『국어』는 적는다. 『국어』는 백양보가 이 일을 두고 주가 곧 망할 것이라 말했다고 전한다. 유왕은 왕후 신씨와 태자 의구를 내치고 총애하던 포사와 그 아들 백복을 세우려 했다. 이에 왕후의 아버지 신후(申侯)가 증(繒)과 견융의 힘을 빌려 호경을 쳤고, 유왕은 여산 아래에서 죽었다고 『사기』는 전한다. 봉화를 올려 제후를 속이다 정작 위급할 때 아무도 오지 않았다는 이야기는 『사기』에 보이고 『여씨춘추』에도 북을 쳐서 제후를 속였다는 비슷한 이야기가 있으나 전설로 본다. 제후들은 의구를 평왕으로 세웠고, 평왕은 기원전 770년 견융의 위협이 가까운 호경을 버리고 낙읍(성주)으로 도읍을 옮겼다. 이때 정(鄭)의 무공, 진(晉)의 문후, 진(秦)의 양공이 평왕을 도와 호위했다고 한다. 특히 진(秦)의 양공은 호위한 공으로 제후가 되어 기산 서쪽 땅을 받았다. 다만 『죽서기년』은 왕자 여신이 휴왕(携王)으로 따로 서서 평왕과 약 20년 맞섰고 진(晉) 문후가 휴왕을 죽여 끝났다고 적는다. 천도 뒤 주의 직접 다스리는 땅은 낙읍 둘레로 줄었고, 호경이 있던 관중은 사실상 진(秦)이 차지했다. 천도 뒤를 동주라 하며, 천자는 이름뿐인 존재로 남아 제후들의 시대가 열렸다. 유왕 때 서주의 안팎 사정을 전하는 『국어』·『사기』·『죽서기년』의 기록은 서로 달라, 왕위 계승을 둘러싼 갈등이 어떻게 전개되었는지는 의견이 갈린다. 서주의 마지막 왕 유왕의 아들이 도읍을 옮긴 것이므로 천도는 도피의 성격도 있었다."
  subjects: [western-zhou, eastern-zhou, qin-state, jin-chunqiu]
  tags: [politics, war]
  sources: ["『사기』 주본기", "『사기』 진본기", "『국어』 주어", "『죽서기년』", "하상주 단대공정 연표(2000)", "Li Feng, Landscape and Power in Early China: The Crisis and Fall of the Western Zhou, 1045–771 BC (Cambridge University Press, 2006)"]

- id: chunqiu-opening-770bc
  year: -769
  endYear: -705
  precision: year
  title:
    ko: "춘추 시대의 개막: 천자의 쇠퇴와 제후국들"
  summary:
    ko: "『춘추』는 기원전 722년부터 481년까지를 기록했고, 동주가 시작한 기원전 770년부터 전국 시대 앞까지를 보통 춘추 시대라 부른다. 천도 뒤 주 왕실은 직접 다스리는 땅이 낙읍 둘레로 줄어 제후국의 공납과 병력에 기대야 했고, 기원전 707년 환왕이 정(鄭)을 치려다 수갈 싸움에서 정 장공의 군대에 패하고 어깨에 화살을 맞은 일(『춘추좌씨전』)은 천자의 권위가 얼마나 떨어졌는지를 보여 준다. 정 장공(재위 기원전 743~701)은 이웃을 누르며 초기의 강국이 되었다. 동쪽의 제(齊)는 희공(재위 기원전 730~698) 때 북융의 침입을 받아 정에 도움을 청해 막아 냈다(기원전 706, 『춘추좌씨전』). 북쪽의 연(燕)은 소공 석의 후손이 다스렸으나 중원에서 멀고 산융·동호와 접해 이 시기에는 사료가 거의 남지 않았다. 서쪽에서는 진(秦)이 평왕에게서 받은 기산 서쪽 땅을 서융과 싸우며 차지하는 데 힘을 쏟았고, 문공이 기원전 750년 융을 물리쳐 기산까지 땅을 넓혔다고 한다. 남쪽에서는 초가 한수이강 유역의 작은 나라들을 하나씩 병합하며 힘을 키웠다. 진(晉)은 도읍 익의 군주와 곡옥의 분가가 오래 다투었다(뒤의 사건). 『춘추』에 이름이 나오는 나라는 140여 개에 이르지만 대부분은 소국이었고, 전쟁이 잦아지면서 병합이 이어졌다. 송은 상 왕족 미자의 후손이 상추 둘레를 다스렸고, 노는 주공의 아들 백금의 후손이 곡부에 있었으며, 위(衛)는 은 옛 땅에 세운 제후국이었다. 중원의 이런 나라들은 주 왕실과의 혈연이나 옛 인연으로 이어진 제하(諸夏)를 이루었고, 남쪽의 초와 서쪽의 융, 북쪽의 적은 흔히 이와 구별되었다. 『춘추』는 노의 연대기로, 은공 원년(기원전 722)부터 애공 14년(기원전 481)까지 242년을 기록한다."
  subjects: [eastern-zhou, qi-state, yan-state, qin-state, jin-chunqiu, chu-state]
  tags: [politics, war]
  sources: ["『춘추좌씨전』", "『사기』 주본기", "『사기』 진본기", "『사기』 십이제후연표", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: jin-quwo-745bc
  year: -744
  endYear: -677
  precision: year
  title:
    ko: "진(晉)의 곡옥 분가와 곡옥 무공의 진 병합(기원전 745~678)"
  summary:
    ko: "진(晉)의 소후(昭侯)는 기원전 745년 숙부 성사(成師)를 곡옥에 봉했는데, 곡옥은 도읍 익보다 컸다. 곡옥을 이어받은 환숙은 힘을 키웠고, 기원전 739년 진의 대부 반보가 소후를 죽이고 환숙을 맞이하려 했으나 진 사람들이 막아 환숙은 곡옥으로 돌아갔다(『사기』 진세가). 이후 진 본가의 효후·악후·애후·소자후·민후와 곡옥의 환숙·장백·무공이 대를 이어 여러 차례 싸웠다. 『사기』 진세가는 기원전 724년 곡옥 장백이 효후를 죽였다고 적고, 『춘추좌씨전』은 기원전 709년 곡옥 무공이 애후를 사로잡아 이듬해 죽였으며 기원전 705년 소자후를 유인해 죽였다고 전한다(『사기』는 소자후의 죽음을 기원전 706년으로 적는다). 환숙의 손자인 곡옥 무공은 기원전 679년 진후 민(緡)을 죽이고 진을 병합한 뒤 진의 보물을 주 왕실에 바쳤고, 주 희왕은 기원전 678년 곡옥 무공을 진후로 인정하고 1군을 갖는 지위를 주었다(『춘추좌씨전』 장공 16년). 무공이 이듬해 죽고 아들 헌공(재위 기원전 676~651)이 즉위했다. 헌공은 공자들이 세력을 키울까 두려워 기원전 669년 여러 공자를 죽이게 하고 도읍을 강으로 옮겼다. 이 때문에 공족이 크게 줄었고, 뒤에는 경대부 가문이 군대를 쥐게 되어 진(晉)의 삼분(뒤의 사건)으로 이어졌다. 진(晉)의 첫 도읍으로 전하는 곳은 당이고 뒤에 익(지금 산시성(山西) 이청 둘레)으로 옮겼으며, 곡옥은 그곳과 같은 분지권에서 멀지 않았다. 곡옥 무공이 본가를 대신해 군주가 된 일은 뒷날 경대부 가문이 군주를 대신하는 선례로 읽히기도 한다. 『사기』는 무공이 곡옥을 이어받은 지 37년째에 진을 병합했다고 센다. 이 일은 주 천자가 제후를 책봉하는 형식이 남아 있으나 실제로는 무력으로 군주 자리가 바뀌는 시대가 되었음을 보여 준다."
  subjects: [jin-chunqiu, eastern-zhou]
  tags: [politics, war]
  sources: ["『사기』 진세가", "『춘추좌씨전』 환공·장공", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: chu-wuwang-704bc
  year: -703
  endYear: -670
  precision: year
  title:
    ko: "초의 성장: 무왕의 칭왕(기원전 704)과 문왕의 영 천도(기원전 689)"
  summary:
    ko: "초는 창장강 중류와 한수이강 유역 형만 땅에서 일어났다. 주에 처음 책봉된 지위는 가장 낮은 자남이었다. 무왕(웅통, 재위 기원전 740~690)은 기원전 706년 수(隨)를 치고 주 왕실에 더 높은 작위를 달라고 요구했으나 거절당하자 기원전 704년 스스로 왕을 칭했다(『사기』 초세가). 천자만 쓰던 왕 칭호를 제후가 쓴 것으로, 이후 초 군주는 왕으로 불렸다. 『사기』 초세가는 이보다 앞서 웅거가 기원전 9세기 중엽 창장강 중류에서 세력을 넓히며 세 아들을 왕으로 삼았다가 주 여왕을 꺼려 그만두었다고도 적는다. 무왕이 수 정벌 중 세상을 떠나자 문왕이 기원전 689년 도읍을 영(郢, 지금 후베이성 징저우 둘레)으로 옮겼다. 문왕은 기원전 688년 남양 분지의 신(申)을 멸하고, 그 뒤 식(息)과 채(蔡)를 압박했다. 문왕은 기원전 680년 식을 멸하고 그 군주의 부인 식규를 데려갔는데, 식규는 초 왕궁에서 말을 하지 않았다는 이야기가 『춘추좌씨전』 장공 14년에 전한다. 『춘추좌씨전』은 한수이강 북쪽의 희성(姬姓) 제후국을 초가 모두 없앴다고 평한다. 문왕이 기원전 677년 죽자 아들 도오(웅간)가 이었으나 5년 만에 아우 성왕에게 죽임을 당했다. 성왕(재위 기원전 672~626, 671부터로 보기도 함)은 즉위해 제후들과 옛 우호를 맺고 사신을 주에 보냈는데, 주 천자는 제사 고기를 내려 남쪽 이월의 난을 누르고 중원을 침범하지 말라고 일렀다고 한다(『사기』 초세가, 기원전 671). 곧 초는 중원 제후와 맞서는 강국이 되어 제 환공의 북진을 막는 상대가 되었다. 초 군주가 스스로를 만이(蠻夷)라 부르며 중원의 칭호를 따르지 않겠다고 말한 대목(『사기』 초세가)처럼 문화적으로 구별되기도 했으나, 점차 한자와 예제를 받아들여 중원 문화권에 들어왔다."
  subjects: [chu-state, eastern-zhou]
  tags: [politics, war]
  sources: ["『사기』 초세가", "『춘추좌씨전』 장공·희공", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qi-huangong-685bc
  year: -684
  endYear: -642
  precision: year
  title:
    ko: "제 환공과 관중의 패업: 가 회맹(기원전 681)에서 규구 회맹(기원전 651)까지"
  summary:
    ko: "제 양공이 기원전 686년 사촌 공손무지에게 죽자 아우 규(糾)와 소백(小白)이 각각 노와 거(莒)에서 돌아오려 다퉜다. 먼저 돌아온 소백이 기원전 685년 환공(재위 기원전 685~643)이 되었고, 노가 지지한 규는 죽었다. 환공은 포숙아의 천거로 규의 편에 섰던 관중을 재상으로 삼았다. 관중은 도읍(국)과 지방(비)을 나누어 군사 조직과 행정을 맞물리게 하고, 신분을 사·농·공·상으로 나누어 살게 하며, 소금과 철 정책으로 재정을 늘렸다고 『국어』와 『관자』는 전한다(『관자』는 후대에 엮였다). 환공은 기원전 681년 가(柯)에서 노와 맹약하고 기원전 679년 견에서 회맹해 처음 패자로 인정받았다. 기원전 664년 산융이 연(燕)을 치자 환공은 구원해 산융을 물리치고 고죽국 둘레까지 갔다가, 연이 주 왕실에 공납을 바치게 했다. 『관자』에는 제가 고조선 쪽을 가리키는 것으로 보이는 발조선의 무늬 있는 가죽을 귀한 물건으로 다룬 대목이 있다(앞의 사건 「춘추 시대 기록에 나오는 숙신·동호·예맥과 발조선」). 기원전 656년 환공은 여덟 나라 군대를 이끌고 초를 쳐 소릉에서 맹약했다. 초가 포모(띠풀) 공납을 소홀히 한 일과 소왕이 남쪽 정벌에서 돌아오지 못한 일을 환공이 따지자, 초는 공납을 약속하고 물러났다. 기원전 651년 규구 회맹에서는 주 양왕이 제사 고기를 내려 환공을 패자로 대우했다. 환공은 존왕양이, 곧 천자를 받들고 바깥 세력을 물리친다는 명분을 내세웠고, 이 명분은 뒤의 패자들도 이어 썼다. 『맹자』는 규구 맹약의 조항으로 불효자를 벌하고 적자를 바꾸지 말며 첩을 아내로 삼지 말 것, 현자를 높일 것, 늙은이와 어린이를 돌볼 것, 관직을 세습하지 말고 대부를 함부로 죽이지 말 것, 제방을 함부로 막거나 곡식 수출을 막지 말 것 같은 다섯 가지를 전한다. 관중이 죽은 기원전 645년 뒤 환공은 총신 수조·역아·개방을 가까이했고, 기원전 643년 환공이 죽자 아들들이 왕위를 다투어 장례가 67일 동안 미뤄졌다고 『사기』는 적는다."
  subjects: [qi-state, yan-state, chu-state, eastern-zhou, gojoseon]
  links:
    - { from: qi-state, to: chu-state, note: "소릉 회맹으로 초의 북진을 막음(기원전 656)" }
  tags: [politics, war, diplomacy]
  sources: ["『사기』 제태공세가", "『춘추좌씨전』 희공 4년", "『국어』 제어", "『관자』", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: jin-xiangong-661bc
  year: -660
  endYear: -650
  precision: year
  title:
    ko: "진(晉) 헌공의 팽창(기원전 661~655)과 여희의 난(기원전 651)"
  summary:
    ko: "헌공(재위 기원전 676~651)은 기원전 661년 2군을 편성해 곽·경·위(魏)를 쳐서 없앴다. 경을 장수 조숙에게, 위를 필만에게 준 일은 뒤에 조와 위의 뿌리가 되었다(『사기』 진세가). 다음으로 황허강 남쪽의 괵과 우를 노렸다. 대부 순식은 굴산의 말과 수극의 벽옥을 우공에게 뇌물로 바쳐 괵을 칠 길을 빌리게 했다. 우의 대부 궁지기는 입술이 없으면 이가 시리다며 막았으나 우공은 듣지 않았다. 진은 기원전 658년 괵의 하양을 빼앗았고, 기원전 655년 괵의 도읍 상양(지금 싼먼샤 서쪽)을 함락한 뒤 돌아오는 길에 우도 멸했다(가도멸괵, 『춘추좌씨전』 희공 2·5년). 『사기』 진세가는 이때 우의 대부 백리해가 사로잡혀 헌공의 딸 목희의 혼수에 딸려 진(秦)으로 보내졌다고 적는다(『춘추좌씨전』은 우공과 정백이 혼수가 되었다고 적는다). 안으로는 헌공이 총애한 여희가 자기 아들 해제를 세우려고 기원전 656년 태자 신생을 모함해 자살하게 했고, 공자 중이(뒤의 문공)와 이오(뒤의 혜공)는 나라 밖으로 달아났다. 헌공이 죽은 기원전 651년 대부 이극이 해제와 탁자를 죽이는 난이 일어났고, 이오가 진(秦) 목공의 도움으로 이듬해 돌아와 혜공이 되었다. 이 사건들로 진(晉)은 황허강 양쪽 땅을 넓혔으나 공자들을 내몰고 신하의 세력이 커지는 길을 열었다. 괵을 멸한 일로 진의 영역은 황허강 남안, 곧 낙읍과 가까운 곳까지 이르렀고, 이 발판이 뒷날 진이 주 왕실을 돕는 위치에 설 수 있게 한 바탕이 되었다(뒤의 사건 「진(晉) 문공의 귀국(기원전 636)과 성복 전투(기원전 632)」). 헌공은 맏아들 신생과 중이, 이오 같은 여러 아들을 두었으나 여희의 아들을 세우려는 총애 속에서 형제들이 차례로 밀려났다."
  subjects: [jin-chunqiu, qin-state]
  tags: [war, politics]
  sources: ["『사기』 진세가", "『춘추좌씨전』 희공 2년·5년·9년", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: qin-wugong-688bc
  year: -687
  endYear: -620
  precision: year
  title:
    ko: "진(秦)의 서쪽 성장: 무공의 현 설치(기원전 688)에서 목공의 서융 제패(기원전 623)까지"
  summary:
    ko: "진(秦)은 기원전 770년 평왕에게서 기산 서쪽 땅을 받은 뒤 서융과 싸우며 관중을 차지해 갔다. 무공(재위 기원전 697~678)은 기원전 688년 규융과 기융을 쳐서 그 땅에 처음으로 현을 두었고, 이듬해 두(杜)·정(鄭)에도 현을 두고 소괵을 멸했다고 『사기』 진본기는 적는다. 무공이 죽자 66명이 순장되었다. 기원전 677년 덕공이 도읍을 옹(雍, 지금 산시성(陝西) 펑샹)으로 옮겨 이후 약 300년 동안 도읍이 되었다. 무공 뒤로 덕공(재위 기원전 677~676), 선공(기원전 675~664), 성공(기원전 663~660)이 차례로 이었고, 목공은 성공의 아우로 즉위했다. 목공(재위 기원전 659~621)은 진(晉) 헌공의 딸을 맞아 혼인했고, 우에서 끌려온 백리해를 양가죽 다섯 장을 주고 사들여 중용했다고 전한다. 기원전 647년 진(晉)에 흉년이 들자 곡식을 배로 실어 보냈으나 이듬해 진(秦)에 흉년이 들었을 때 진(晉) 혜공이 곡식을 팔지 않자 목공은 기원전 645년 한원 싸움에서 혜공을 사로잡았다가 풀어 주었다. 기원전 636년에는 중이를 군대로 호송해 문공이 되게 했다. 문공이 죽은 뒤 목공이 정을 습격하려다 기원전 627년 효산에서 진(晉)에게 대패하고 세 장수가 포로가 되자, 방향을 서쪽으로 돌려 기원전 623년 서융 12국(『사기』의 수)을 병합하고 천 리 땅을 넓혀 서융의 패자가 되었다. 주 천자는 금고(金鼓)를 보내 이를 축하했다고 한다. 서융의 입장에서는 이 과정이 자기 땅과 부락이 진(秦)에 편입되는 일이었다. 기원전 621년 목공이 죽자 177명이 순장되었고, 진 사람들은 시 「황조」를 지어 그 죽음을 슬퍼했다."
  subjects: [qin-state, jin-chunqiu, eastern-zhou]
  tags: [war, politics]
  sources: ["『사기』 진본기", "『춘추좌씨전』 희공 15년·33년", "『시경』 진풍 황조", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: chengpu-636bc
  year: -635
  endYear: -631
  precision: year
  title:
    ko: "진(晉) 문공의 귀국(기원전 636)과 성복 전투(기원전 632)"
  summary:
    ko: "진(晉) 헌공의 아들 중이는 여희의 난을 피해 기원전 655년 나라를 떠나 적, 제, 송, 정, 초를 거치며 19년 동안 떠돌았다. 초 성왕이 후하게 대접하자 중이는 훗날 전쟁터에서 마주치면 3사(약 90리)를 물러나겠다고 말했다고 한다. 마지막에 들른 진(秦)의 목공이 군대를 붙여 호송해 중이는 기원전 636년 귀국해 문공이 되었다. 문공은 이듬해 왕자 대의 난으로 정에 피난한 주 양왕을 낙읍으로 돌려보내고 남양 땅을 받았다. 기원전 633년 초가 송을 포위하자 송이 도움을 청했고, 문공은 3군을 갖춰 초의 동맹인 조와 위를 쳐서 송의 포위를 풀려 했다. 초의 영윤 자옥(성득신)이 물러나지 않자 문공은 제·진(秦)·송과 연합해 기원전 632년 음력 4월 성복에서 초의 군대와 마주했다. 진군은 약속대로 3사를 물러났다가 서신이 이끈 하군이 먼저 초의 우군(진(陳)·채)을 깨뜨리고 호모·호언의 상군과 선진의 중군이 초의 좌군을 깨뜨렸고, 자옥의 중군은 피해를 줄이고 물러났다. 성복의 위치는 지금 산둥성 쥐안청 서남쪽 둘레라는 설과 허난성 천류 둘레라는 설이 있다. 같은 해 음력 5월 천토에서 문공은 여러 제후와 회맹했고, 주 양왕은 문공에게 후백(제후의 우두머리)의 지위를 내렸다. 이로써 문공은 제 환공 다음의 패자가 되었다. 이때 주 양왕은 수레와 갑옷, 활과 화살도 내렸다고 『춘추좌씨전』은 적는다. 자옥은 돌아가는 길에 초왕의 질책을 받고 스스로 목숨을 끊었다고 한다. 중이가 떠돌던 19년 동안 곁을 지킨 호언과 조쇠, 개자추 같은 신하들은 귀국 뒤 진(晉)의 중심 세력이 되었다. 초는 이 패배로 북쪽 진출이 꺾였으나, 이후에도 진(晉)과 오래 겨루었다(뒤의 사건)."
  subjects: [jin-chunqiu, chu-state, qin-state, qi-state, song-state, eastern-zhou]
  links:
    - { from: jin-chunqiu, to: chu-state, note: "성복 전투에서 초군을 물리침(기원전 632)" }
  tags: [war, politics, diplomacy]
  sources: ["『사기』 진세가", "『춘추좌씨전』 희공 23~28년", "『국어』 진어", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: pan-jin-chu-613bc
  year: -612
  endYear: -574
  precision: year
  title:
    ko: "진(晉)과 초의 패권 다툼: 필 전투(기원전 597), 적적 병합과 안 전투(기원전 594~589), 언릉 전투(기원전 575)"
  summary:
    ko: "초 장왕(재위 기원전 613~591)은 즉위 뒤 몇 해 동안 정사를 돌보지 않다가 오거와 소종의 간언 끝에 일어나 한 번 울면 사람을 놀라게 한다는 말을 낳았다(『사기』 초세가). 기원전 606년 육혼의 융을 친 뒤 주 경계에서 열병하고 구정의 크기와 무게를 묻자(문정), 주의 왕손만은 천명은 솥이 아니라 덕에 있다고 답했다. 기원전 597년 장왕은 정을 석 달 포위해 항복시키고, 구원하러 온 진(晉)의 순림보 군대를 필에서 크게 이겼다. 이 승리로 장왕은 패자가 되었다. 필에서는 진의 선곡이 독단으로 황허강을 건너 싸움을 시작했다가 진(晉)에 돌아와 처형되고 가문이 멸족되었다(『춘추좌씨전』 선공 13년). 그 뒤 초는 송을 기원전 595년부터 아홉 달 포위했다가 송의 화원과 맹약하고 물러났다. 진(晉)은 경공(재위 기원전 599~581) 때 북쪽을 넓혔다. 기원전 594년 산시성(山西) 동남부 상당 둘레의 적적 노씨를 멸하고 이듬해 갑씨와 유우도 병합했다. 적적은 이 지역에 살던 사람들로 진의 땅에 편입되었다. 기원전 589년에는 제가 노·위를 침공하자 극극이 이끄는 진군이 안에서 제군을 크게 이겨 제 경공이 달아났다. 이후 제 경공은 어머니를 인질로 내라는 진의 요구를 거절하고 땅을 돌려주는 조건으로 화의했다. 진은 기원전 585년 도읍을 신전(지금 허우마)으로 옮겼다. 두 강국은 정을 두고 거듭 겨뤘다. 기원전 579년 송의 화원이 주선해 진과 초가 화평을 약속했으나(미병의 회) 오래가지 못했고, 기원전 575년 언릉에서 진 여공이 초 공왕의 군대를 쳐 이겼으나 공왕의 눈에 화살이 맞았다고 전한다. 승부가 나지 않자 기원전 546년 송에서 열린 미병 회의로 이어졌다."
  subjects: [chu-state, jin-chunqiu, qi-state, song-state, eastern-zhou]
  tags: [war, politics]
  sources: ["『사기』 초세가", "『사기』 진세가", "『춘추좌씨전』 선공 3년·12년·15년, 성공 2년·16년", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: wu-rise-585bc
  year: -584
  endYear: -516
  precision: year
  title:
    ko: "오의 등장: 수몽의 칭왕(기원전 585)과 계찰의 순방(기원전 544)"
  summary:
    ko: "오는 창장강 하류 타이후호 둘레에서 일어난 나라로, 『사기』 오태백세가는 주 태왕의 아들 태백과 중옹이 형만 땅으로 내려와 세웠다고 적는다. 중원 사료에 거의 나오지 않다가 수몽(재위 기원전 585~561, 586년부터로 보기도 함)이 기원전 585년 왕을 칭한 뒤 모습이 드러난다. 기원전 584년 초에서 도망한 대부 무신(巫臣)이 진(晉)의 사신으로 오에 가서 전차와 활쏘기, 진법을 가르쳤고 아들 호용을 오에 남겼다. 오가 초의 동북쪽 변경을 거듭 치게 되자 초의 자중과 자반은 한 해에 일곱 번 명령을 받아 뛰어다녔다고 한다(『춘추좌씨전』 성공 7년). 오는 이렇게 진(晉)과 손잡고 초를 뒤에서 흔들었다. 『사기』 오태백세가는 태백에서 수몽까지 19대의 계보를 적는다. 오 사람들은 머리를 짧게 자르고 몸에 문신을 새겼다고 하며, 물이 많은 땅에서 배를 잘 다뤘다. 오의 중심지는 처음 매리(지금 우시 둘레)였고 뒤에 고소로 옮겼다고 전한다. 장쑤성 일대에서 나온 청동기와 원시자기, 토돈묘 유적은 중원과 다른 독자적인 문화를 보여 준다. 기원전 548년 제번이 초의 소를 치다 화살에 맞아 죽었다고 『춘추좌씨전』은 적는다. 수몽의 뒤를 제번(재위 기원전 560~548), 여제(547~544 무렵), 여말(543~527 무렵), 요(僚, 526~515)가 이었다(재위는 자료마다 조금 다르다). 막내 계찰은 왕위를 사양했다고 전하며, 기원전 544년 노·제·정·위(衛)·진(晉)을 두루 다니며 노에서는 주나라 음악을 듣고 평했다. 계찰은 진(晉)에서 정권이 한·위·조 세 집안으로 돌아갈 것이라고 내다보았다고 한다(『춘추좌씨전』 양공 29년). 오는 중원과 교류하면서 전차 전술과 병법을 받아들였고, 기원전 515년 공자 광(합려)이 요를 죽이고 즉위할 때까지 초와의 싸움을 이어 갔다."
  subjects: [wu-state, chu-state, jin-chunqiu]
  tags: [politics, war]
  sources: ["『사기』 오태백세가", "『춘추좌씨전』 성공 7년, 양공 29년", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: wu-baiju-515bc
  year: -514
  endYear: -503
  precision: year
  title:
    ko: "합려와 오자서, 백거 전투(기원전 506)와 영 함락"
  summary:
    ko: "기원전 515년 공자 광이 자객 전제를 시켜 왕 요를 죽이고 합려로 즉위했다. 합려는 아버지와 형이 초 평왕에게 죽임당해 달아난 오자서를 가까이 두고, 도읍 고소를 쌓았다. 『사기』 손자열전은 병법가 손무가 합려 앞에서 궁녀를 훈련했다고 전하지만 『춘추좌씨전』에는 손무가 나오지 않아 역사성에는 논란이 있다. 오자서는 기원전 512년부터 군대를 나눠 번갈아 초를 괴롭히는 전략을 썼다고 한다. 기원전 510년에는 오가 처음으로 월에 군대를 보냈다. 기원전 506년 합려는 동생 부개와 오자서, 그리고 초에 불만이 있던 채와 당을 끌어들여 한수이강 유역으로 진출했다. 초의 영윤 낭와가 한수이강을 사이에 두고 맞섰으나, 오군은 동쪽으로 물러나는 초군을 따라 소별산과 대별산 사이에서 세 번 싸워 이겼고, 부개가 합려의 허락 없이 먼저 쳐서 백거에서 초군을 무너뜨렸다. 오군은 다섯 번 싸워 모두 이기고 초의 도읍 영(郢)에 입성했으며, 초 소왕은 달아났다. 소왕은 달아나는 길에 운몽택에서 도적의 습격을 받고 운(鄖)과 수(隨)로 옮겨 다녔으며, 오가 수에 소왕을 내놓으라고 요구했으나 수 사람들이 거절했다고 『춘추좌씨전』은 전한다. 오자서가 평왕의 무덤을 파서 시신에 채찍질했다는 이야기는 『사기』에만 전한다. 초의 대부 신포서는 진(秦)의 궁정 앞에서 이레 동안 울며 구원을 청했고, 진(秦)은 기원전 505년 전차 500승을 보냈다. 같은 때 월이 오의 후방을 치고 부개가 돌아가 스스로 왕을 칭하자 합려는 철군해 부개를 쳤다. 소왕은 돌아왔으나 오의 압박을 피해 이듬해 도읍을 약으로 옮겼다. 백거의 위치는 지금 후베이성 마청 둘레로 보는 설이 있으나 확실하지 않다. 오는 이 시기 가장 강한 나라가 되었다."
  subjects: [wu-state, chu-state, yue-state, qin-state]
  links:
    - { from: wu-state, to: chu-state, note: "백거 전투 뒤 영을 점령(기원전 506)" }
  tags: [war, politics]
  sources: ["『사기』 오태백세가", "『사기』 오자서열전", "『춘추좌씨전』 정공 4년·5년", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: wu-yue-496bc
  year: -495
  endYear: -472
  precision: year
  title:
    ko: "오월 전쟁: 취리 전투(기원전 496)에서 오의 멸망(기원전 473)까지"
  summary:
    ko: "월은 저장성 북부 회계(지금 사오싱) 둘레의 나라로 기원전 510년 오와 싸운 기록이 처음 나온다. 기원전 496년 월왕 구천이 즉위하자 합려가 월을 쳤으나 취리에서 월군에 크게 져 발가락을 다친 합려는 얼마 뒤 죽었다. 아들 부차는 사람을 세워 아버지를 죽인 원수를 잊었느냐고 묻게 했고 잊지 않겠다고 답했다고 전한다. 기원전 494년 부차는 부초에서 월군을 크게 이기고 회계산에서 구천을 포위했다. 구천은 재상 문종이 오의 백비에게 뇌물을 바쳐 화의를 얻었고, 오자서가 강하게 반대했다. 구천은 3년 동안 오에서 신하 노릇을 했다. 오자서는 월이 10년 동안 인구를 늘리고 10년 동안 백성을 가르치면 20년 뒤 오가 못이 될 것이라고 경고했다고 『춘추좌씨전』은 적는다. 월로 돌아온 구천은 범려와 문종의 도움을 받아 힘을 길렀다. 부차는 기원전 486년 한구 운하를 파서 창장강과 화이허강을 이었고, 기원전 484년 애릉에서 제를 크게 이겼다. 같은 해 부차는 제 정벌에 반대한 오자서에게 검을 내려 자결하게 했다. 기원전 482년 부차가 군대를 이끌고 황지에서 진(晉)과 맹주 자리를 다투는 사이, 월이 빈 도읍을 쳐서 태자 우를 죽였다. 이후 월의 공격이 이어져 기원전 475년부터 고소를 포위했고 기원전 473년 오는 멸망했다. 부차는 오자서를 볼 낯이 없다며 얼굴을 가리고 자결했다고 한다. 구천은 오의 땅을 병합하고 화이허강 이북의 땅을 초에 넘겼다. 『사기』는 구천이 이어서 제·진(晉) 같은 제후들과 서주(徐州)에서 회맹했다고 적고, 도읍을 낭야로 옮겼다는 전승도 있다. 범려는 구천 곁을 떠났고 문종은 뒤에 구천에게 죽임당했다고 전한다. 황지 회맹에서 오와 진(晉) 가운데 누가 먼저 맹약의 피를 바를지는 『춘추좌씨전』과 『국어』의 기록이 달라, 진이 먼저였다는 쪽과 오가 먼저였다는 쪽으로 나뉜다."
  subjects: [wu-state, yue-state, qi-state, jin-chunqiu, chu-state]
  links:
    - { from: yue-state, to: wu-state, note: "오를 멸하고 고소를 함락함(기원전 473)" }
  tags: [war, politics]
  sources: ["『사기』 오태백세가", "『사기』 월왕구천세가", "『춘추좌씨전』 정공 14년, 애공 1년·11년·13년", "『국어』 오어·월어", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: confucius-551bc
  year: -550
  endYear: -478
  precision: year
  title:
    ko: "공자의 생애와 유가의 시작(기원전 551~479)"
  summary:
    ko: "공자(이름은 구, 자는 중니)는 기원전 551년 노(魯)의 추읍에서 몰락한 사(士) 계층 집안에 태어났다고 『사기』는 적는다. 젊어서 창고 관리 같은 낮은 일을 하며 예(禮)를 익혔고, 『논어』에서 스스로 열다섯에 학문에 뜻을 두고 서른에 자립했다고 돌아보았다. 기원전 517년 노에서 소공이 쫓겨나 제로 달아나자 공자도 제에 갔고, 제 경공에게 임금은 임금답고 신하는 신하다워야 한다고 말했다고 전한다. 기원전 501년 중도재가 되고 이듬해 사구에 올라, 기원전 498년 무렵 세력이 큰 세 대부 집안(삼환)의 성을 허무는 일을 꾀했으나 끝내 이루지 못했다. 기원전 497년부터 14년 동안 제자들과 위, 조, 송, 정, 진(陳), 채, 초를 돌아다니며 덕으로 다스리는 정치를 설득했으나 뜻을 받아들이는 군주는 없었다. 진과 채 사이에서는 양식이 떨어지는 곤경도 겪었다고 한다. 기원전 484년 노로 돌아와 제자를 가르치고 옛 글을 정리하는 데 힘썼다. 『시』, 『서』, 『춘추』를 정리했다는 전승이 있으나 어디까지가 공자의 손을 거친 것인지는 의견이 갈린다. 공자는 주 왕실의 권위가 흔들리던 시대에 주공이 세운 예악 제도를 이상으로 삼아 질서를 되살리려 했다. 신분을 가리지 않고 제자를 받아(유교무류) 제자가 3천이라고 『사기』는 전하며, 안회와 자로, 자공이 이름났다. 공자는 기원전 479년에 죽었다. 『논어』는 공자와 제자들의 문답을 뒷날 엮은 책이며 공자 자신이 쓴 책은 아니다. 공자가 죽은 이듬해 노에서 공자의 옛집을 사당으로 삼았다고 전한다. 인(仁)과 예, 정명(正名), 덕치를 내세운 그의 가르침은 제자들에 의해 이어져 유가가 되었고, 뒤에 맹자와 순자가 각각 갈래를 열었다(뒤의 사건 「제자백가의 등장」)."
  subjects: [qi-state, chu-state, eastern-zhou]
  tags: [culture, society]
  sources: ["『사기』 공자세가", "『논어』", "『춘추좌씨전』 애공 14년~16년", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: jin-six-ministers-497bc
  year: -496
  endYear: -452
  precision: year
  title:
    ko: "진(晉)의 육경 쟁탈과 지씨의 멸망(기원전 497~453)"
  summary:
    ko: "헌공이 공자들을 내몬 뒤(앞의 사건) 진(晉)의 공실은 힘을 잃고 군대를 쥔 경대부 가문이 정치를 맡았다. 경대부 가문은 저마다 영지와 사병을 가졌고 상군·중군·하군의 장군 자리를 육경이 나누어 맡았다. 기원전 514년 기씨와 양설씨가 무너진 뒤에는 범씨·중행씨·지씨·한씨·조씨·위씨 여섯 집안(육경)이 남았다. 기원전 513년 조앙과 순인이 법을 새긴 쇠솥을 만든 일(앞의 사건 「철기와 우경, 수리와 화폐: 춘추 전국 시대의 변화」)은 귀족이 군주 대신 법을 공개한 사례로 꼽힌다. 기원전 497년 조씨의 조앙(조간자)이 범씨·중행씨와 충돌한 것이 육경 사이의 싸움으로 번졌다. 조앙은 진양(지금 타이위안)에 근거를 두고 버텼고, 지씨·한씨·위씨가 조씨 편에 서면서 범씨와 중행씨는 밀려나 제로 달아났다(기원전 490년 무렵, 『춘추좌씨전』 애공 5년). 남은 네 집안 가운데 지씨의 요(지백)가 가장 강했다. 요는 한강자와 위환자에게서 땅을 받아 냈으나 조양자(조간자의 아들)에게 요구했을 때는 거절당했다. 이에 지백은 한과 위를 끌어들여 기원전 455년 진양을 포위했고, 펀허강의 물을 끌어들여 성을 잠기게 했다. 성벽이 석 판 높이만 남을 만큼 물이 찼다고 『전국책』은 전한다. 조양자의 신하 장맹담이 한강자와 위환자를 몰래 설득해 입술이 없으면 이가 시리다는 이치를 일깨웠고, 기원전 453년 한과 위가 갑자기 돌아서 지백을 죽이고 지씨를 멸했다. 조양자는 이보다 앞선 기원전 475년(458년 무렵으로 보는 설도 있다) 북쪽의 대(代)를 병합해 영토를 넓혀 놓았다(『사기』 조세가). 이로써 진(晉)의 땅은 사실상 한·조·위 세 집안이 나누어 가졌고, 진의 공은 이름만 남았다. 계찰이 기원전 544년 진(晉)에서 정권이 세 집안으로 돌아가리라 내다보았다는 이야기(앞의 사건)는 이런 흐름을 뒤에서 읽은 것이다."
  subjects: [jin-chunqiu, han-state, zhao-state, wei-state]
  tags: [politics, war]
  sources: ["『사기』 진세가", "『사기』 조세가", "『전국책』 조책", "『춘추좌씨전』 정공·애공", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: early-warring-states-475bc
  year: -474
  endYear: -402
  precision: year
  title:
    ko: "전국 시대의 시작: 기원전 475년과 403년, 두 구분"
  summary:
    ko: "전국 시대를 어느 해부터 잡을지는 책마다 다르다. 『사기』 육국연표는 주 원왕 원년인 기원전 475년부터 여러 나라를 한 표에 적었고, 사마광의 『자치통감』은 주 위열왕이 한·조·위를 제후로 인정한 기원전 403년부터 서술을 시작한다. 기원전 453년 진(晉)의 삼분을 시작으로 보는 학자도 있다. 끝은 진(秦)이 제를 무너뜨린 기원전 221년으로 모두 같다. 전국이라는 이름은 한나라 유향이 엮은 『전국책』에서 왔다. 이 70여 년은 춘추 시대의 질서가 눈에 띄게 무너진 때였다. 제에서는 기원전 481년 전상이 군주 간공을 죽이고 전씨가 정권을 쥐었고, 초는 기원전 479년 진(陳)을 병합한 데 이어 기원전 445년 기(杞)를 멸하고 사수 둘레까지 땅을 넓혔으며 기원전 431년 거(莒)를 멸했다. 거 땅은 뒤에 제가 차지했다고 하나 시기는 분명하지 않다. 오는 기원전 473년 월에게 무너졌고, 월은 창장강 하류의 강국이 되었다. 송은 지금 상추 둘레에서 이어 갔고, 중산은 선우 계통 사람들이 타이항산 동쪽에 세운 나라로 조와 이웃했다. 연은 북쪽에서 산융·동호와 맞닿았고, 진(秦)은 관중에서 서융과 다투며 힘을 키웠다. 동주 왕실은 기원전 440년 무렵 왕의 아우가 하남에 봉해져 나라가 갈라지기 시작했다고 『사기』 주본기는 적는다. 이 시기에는 철제 농기구와 소를 이용한 농사가 퍼져 생산이 늘었고(앞의 사건 「철기와 우경, 수리와 화폐: 춘추 전국 시대의 변화」), 큰 나라가 작은 나라를 삼키는 병합 전쟁이 이어졌다. 전쟁은 전차 중심에서 보병 중심으로 바뀌고 병력은 수만에서 수십만으로 늘었으며, 군주는 귀족 대신 관료와 장군을 임용하는 쪽으로 나아갔다는 설명이 일반적이다."
  subjects: [eastern-zhou, jin-chunqiu, qi-state, chu-state, wu-state, yue-state, song-state, zhongshan-state, yan-state, qin-state]
  tags: [politics, society]
  sources: ["『사기』 육국연표", "『사기』 주본기", "『자치통감』 주기", "『전국책』", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: zhongshan-506bc
  year: -505
  endYear: -295
  precision: year
  title:
    ko: "중산국의 흥망(기원전 506~296)"
  summary:
    ko: "중산은 타이항산 동쪽 기슭(지금 허베이성 중부)에 백적 계통의 선우(鮮虞) 사람들이 세운 나라로, 중산이라는 이름은 기원전 506년 진(晉)과의 관계에서 처음 나온다. 이름은 성 안에 산이 있다는 데서 나왔다는 설명이 전한다. 『사기』는 북적과 연결지어 적지만 화하와 다른 계통의 사람들이 중원 문화를 받아들인 나라로 볼 수 있다. 기원전 414년 무공이 고(顧, 지금 딩저우)에 도읍을 두었다고 전한다. 기원전 407~406년 위(魏) 문후가 악양을 장군으로 보내 3년 가까이 도읍을 포위해 중산을 무너뜨렸다. 악양이 아들을 삶은 국을 먹은 일화가 『전국책』에 전한다. 문후는 아들 격(뒤의 무후)에게 중산을 맡겼고, 위의 지배는 25년 가까이 이어졌다. 기원전 380년 무렵 중산은 독립을 되찾아 영수(지금 핑산)로 도읍을 옮기고 다시 일어섰다. 기원전 323년 무렵 위·한·연과 함께 서로 왕으로 인정했고(오국상왕, 조의 무령왕은 왕 칭호를 쓰지 않고 군이라 불렀다고 한다), 왕 착(재위 기원전 323~309 무렵) 때에는 연을 쳤다고 왕 착의 청동 항아리 명문이 전한다. 이 청동기들은 핑산현 중산왕릉에서 1970년대에 나왔고 긴 글을 새긴 솥과 항아리가 이름났다. 왕릉에서 나온 동판 「조역도」에는 왕과 왕후의 능묘와 궁전의 계획이 새겨져 있어 중산이 도시와 능묘를 정교하게 계획했음을 보여 준다. 한편 조는 중산이 자기 땅을 둘로 가르고 있어 가장 큰 걸림돌로 여겼고, 무령왕이 기원전 307년부터 거의 해마다 쳐서 기원전 301년 무렵 중산 왕은 제로 피했고, 기원전 296년 병합 뒤 『사기』 조세가는 왕을 부시로 옮겼다고 적는다. 중산 스스로 남긴 문헌은 거의 없고 청동기 명문이 주요 자료여서, 이 나라가 어떤 사람들이었는지는 지금도 논쟁이 이어진다."
  subjects: [zhongshan-state, jin-chunqiu, wei-state, zhao-state, yan-state]
  links:
    - { from: zhao-state, to: zhongshan-state, note: "조(주부 무령왕)가 중산을 병합(기원전 296)" }
  tags: [politics, war]
  sources: ["『사기』 조세가", "『사기』 위세가", "『전국책』 중산책", "『춘추좌씨전』 정공 4년", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: jin-partition-403bc
  year: -402
  endYear: -375
  precision: year
  title:
    ko: "진(晉)의 삼분: 한·조·위의 승인(기원전 403)과 진의 소멸(기원전 376)"
  summary:
    ko: "지씨가 무너진 뒤에도 한·조·위는 한동안 진(晉)의 공을 명목상 군주로 두었다. 기원전 404년 삼진은 힘을 합쳐 제를 쳐서 제의 장성 안으로 쳐들어가 제 강공을 사로잡고 함께 주 왕을 알현했다고 『자치통감』은 적는다. 이런 군사적 성과 직후인 기원전 403년 주 위열왕이 한건·조적·위사를 제후로 삼았다(『사기』 주본기·육국연표). 신하들이 군주의 땅을 나눈 일을 천자가 추인한 셈이어서, 『자치통감』을 쓴 사마광은 이것을 예가 무너진 신호로 보아 책의 첫머리에 놓았다. 이후 세 나라는 각기 독립한 영토 국가로 틀을 갖췄다. 조는 기원전 386년 도읍을 진양에서 한단으로 옮겼다(『사기』 조세가). 한은 평양에서 양적으로, 위는 안읍에 두었던 도읍을 뒤에 대량으로 옮겼다. 진(晉)의 공은 곡옥 둘레의 작은 땅만 남은 채 이어지다가, 『사기』 진세가에 따르면 기원전 376년 한·조·위가 마지막 군주 정공(靖公)을 평민으로 내리고 남은 땅을 나누었다(『죽서기년』은 기원전 369년 무렵으로 본다). 제에서도 같은 일이 벌어졌다. 기원전 481년 이래 정권을 쥔 전씨의 전화가 기원전 386년 주 안왕에게 제후로 인정받았고(『사기』 전경중완세가), 강씨의 마지막 군주 강공은 바닷가 작은 땅에서 기원전 379년 무렵 죽어 강씨의 제사가 끊겼다. 이렇게 진(晉)과 제에서 신하가 군주의 자리를 대신한 일을 '삼진의 분립'과 '전씨대제'라 부른다. 한이 정을 멸한 일(뒤의 사건 「한(韓)의 정 병합(기원전 375)과 신불해의 개혁」)은 진(晉)의 소멸과 같은 무렵의 일이다. 삼진과 전씨 제의 승인으로 천자의 권위는 제후를 통제하지 못하게 되었고, 이후 큰 나라들이 차례로 왕을 칭하는 길이 열렸다(뒤의 사건)."
  subjects: [jin-chunqiu, han-state, zhao-state, wei-state, eastern-zhou, qi-state]
  tags: [politics]
  sources: ["『사기』 주본기", "『사기』 진세가", "『사기』 조세가", "『사기』 전경중완세가", "『자치통감』 주기", "『죽서기년』", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: wei-wenhou-445bc
  year: -444
  endYear: -395
  precision: year
  title:
    ko: "위 문후의 개혁과 하서 획득(기원전 445~396)"
  summary:
    ko: "위(魏)의 문후(이름은 사, 재위는 『사기』 연표로 기원전 445~396이고 424~387로 보는 설도 있다)는 한·조와 함께 진(晉)을 나눈 뒤 전국 초에 가장 먼저 강국이 된 군주다. 스승으로 자하와 전자방, 단간목을 예우해 학문을 숭상하는 풍을 일으켰다고 『사기』 위세가는 적는다. 재상 이회는 법을 정비해 『법경』 6편(도·적·수·포·잡·구)을 엮고, 땅의 힘을 다 쓰는 농사(진지력지교)와 풍흉에 따라 곡식을 사고파는 평적법으로 농민과 곡가를 안정시켰다고 전한다. 업의 수령 서문표는 하백(황허강 신)에게 처녀를 바친다는 풍속을 없애고 수로를 파서 농사를 도왔다. 서문표가 다스린 업은 지금 허베이성 린장 둘레로, 장허강의 물을 끌어들이는 수리 사업이 이름났다. 병법가 오기는 서하(황허강 서쪽)의 수령이 되어 진(秦)과 싸웠고, 기원전 409년 위는 진의 임진과 원리 같은 성을 빼앗아 하서 땅(뤄허강 동쪽, 서하군)을 차지했다. 하서 획득(기원전 409)과 중산 정복(기원전 406)의 해는 『사기』 연표가 아니라 현대 연구의 환산이다. 위의 무졸은 갑옷과 무기를 갖추고 하루 100리를 가는 정예병으로 이름났다고 한다. 기원전 406년 악양과 오기 등이 중산을 무너뜨려 위는 중산까지 영역을 넓혔고(앞의 사건 「중산국의 흥망(기원전 506~296)」), 기원전 403년 문후는 한·조와 함께 주 위열왕에게 제후로 인정받았다(뒤의 사건 「진(晉)의 삼분: 한·조·위의 승인(기원전 403)과 진의 소멸(기원전 376)」). 문후가 죽고(기원전 396) 무후가 이었다. 이런 개혁은 신분보다 능력을 보고 관리를 쓰는 길을 열었고 뒤에 상앙과 오기의 변법으로 이어졌다. 그러나 하서와 중산은 위의 중심에서 멀리 떨어진 땅이어서 위는 한 세대 뒤에 이를 지키기 어렵게 되었다."
  subjects: [wei-state, qin-state, zhongshan-state, eastern-zhou]
  tags: [politics, war, society]
  sources: ["『사기』 위세가", "『사기』 오기열전", "『한서』 식화지", "『전국책』 위책", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: chu-daowang-wuqi-382bc
  year: -381
  endYear: -380
  precision: year
  title:
    ko: "초 도왕과 오기의 변법(기원전 382 무렵)과 그 좌절(기원전 381)"
  summary:
    ko: "병법가 오기는 위(衛) 출신으로 노에서 벼슬하다 위(魏) 문후를 섬겨 서하 수령이 되었으나, 문후가 죽고 무후가 의심하자 초로 떠났다. 초 도왕(재위는 『사기』로 기원전 401~381)은 오기가 현명하다는 말을 듣고 곧 상(相)에 앉혔다. 오기가 초에 온 해는 기원전 390년대 말에서 384년 사이로 갈리고, 변법은 도왕 말년까지 이어졌다고 본다. 오기는 법령을 분명히 하고 쓸모없는 관직을 없앴으며, 왕족 가운데 먼 친척의 봉록을 없애 그 재원으로 전사를 길렀다. 3대가 지난 귀족의 작록을 거두고 귀족들을 땅이 넓고 사람이 적은 곳으로 옮겨 개간하게 했다고 『한비자』와 『여씨춘추』는 전한다. 한편 종횡가의 유세를 막고 무력을 키웠다. 그 결과 초는 남쪽의 백월을 평정하고 둥팅호와 창오 일대로 땅을 넓혔으며, 북쪽으로는 진(陳)과 채 땅을 굳히고 삼진을 물리치고 서쪽으로 진(秦)을 쳤다고 『사기』와 『후한서』는 적는다. 그러나 개혁으로 특권을 잃은 귀족들의 불만이 컸다. 기원전 381년 도왕이 죽자 귀족들이 오기를 공격했고, 오기는 도왕의 시신에 엎드렸지만 쏜 화살이 시신에도 꽂혔다. 뒤에 숙왕이 즉위해 도왕의 시신을 해친 죄를 물어 70여 가문이 멸족당했다고 한다. 초는 도왕 뒤로 숙왕(재위 기원전 380~370), 선왕(기원전 369~340), 위왕(기원전 339~329), 회왕으로 이어졌다. 초에는 봉군(封君)이라 불리는 귀족들이 큰 영지와 사병을 가졌고 영윤과 사마 같은 높은 벼슬을 번갈아 맡는 구조가 있었는데, 오기는 이 틀을 흔들려 했다. 그러나 오기의 변법은 한 명의 군주에 기대어 왕이 죽자 무너졌고, 초는 큰 땅을 가지면서도 귀족 중심 체제에 머물렀다. 비슷한 시기 위에서 이회, 한에서 신불해, 진(秦)에서 상앙이 이끈 변법이 이어진 것과 대비된다."
  subjects: [chu-state, wei-state, qin-state]
  tags: [politics, war]
  sources: ["『사기』 오기열전", "『한비자』 화씨", "『여씨춘추』 귀졸", "『후한서』 남만서남이열전", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: han-shen-buhai-375bc
  year: -374
  endYear: -336
  precision: year
  title:
    ko: "한(韓)의 정 병합(기원전 375)과 신불해의 개혁"
  summary:
    ko: "한(韓)은 삼진 가운데 땅이 가장 좁고 사방이 이웃 나라와 맞닿아 있었다. 기원전 375년 한 애후(재위 기원전 376~374)가 이웃의 정(鄭)을 멸하고 도읍을 신정으로 옮겼다(『사기』 한세가). 신정은 옛 정의 도읍으로 지금 허난성 신정시에 해당한다. 정은 서주 말에 선왕의 아우 환공이 봉해진 나라로, 평왕의 천도를 도운 정 무공과 수갈 싸움의 정 장공으로 이름났다(앞의 사건 「춘추 시대의 개막: 천자의 쇠퇴와 제후국들」). 전국 시대에 정은 한과 위 사이에 낀 약한 나라가 되어 있었다. 애후 뒤 의후(재위 기원전 374~363)를 거쳐 소후(재위 기원전 362~333, 『사기』 구 연표로는 358~333)가 이었고, 그 소후 때 정 출신 신불해가 재상이 되었다(소후 8년, 『사기』 연표로 기원전 351). 신불해는 군주가 신하를 평가하고 다스리는 기술인 '술'을 강조한 법가로, 15년 동안 나라가 다스려지고 군대가 강해서 한을 넘보는 나라가 없었다고 『사기』는 전한다. 상앙이 '법'을 앞세운 것과 달리 신불해는 신하가 군주를 속이지 못하게 하는 '술'을 중시했고, 이 둘을 한비가 뒤에 종합했다. 한비는 한의 공자로, 기원전 233년 진(秦)에 사신으로 갔다가 갇혀 죽었다(뒤의 사건 「진(秦)의 한·조 정복(기원전 230~228)」). 신불해는 기원전 337년 무렵 죽었다. 신불해가 쓴 『신자』는 지금 일부만 전한다. 소후 뒤로 선혜왕(재위 기원전 332~312), 양왕(기원전 311~296), 희왕(기원전 295~273), 환혜왕(기원전 272~239), 왕 안(기원전 238~230)이 이었다. 한은 기원전 323년 무렵 왕을 칭하고 쇠뇌와 칼 같은 무기로 이름났으나, 서쪽의 진(秦)과 땅이 맞닿아 있어 이후 땅을 자주 빼앗기게 되었다."
  subjects: [han-state, qin-state]
  tags: [politics]
  sources: ["『사기』 한세가", "『사기』 노자한비열전", "『전국책』 한책", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: guiling-maling-353bc
  year: -352
  endYear: -341
  precision: year
  title:
    ko: "계릉 전투(기원전 353)와 마릉 전투(기원전 342)"
  summary:
    ko: "위(魏) 혜왕은 문후와 무후가 일군 강성을 이어받아 중원 진출을 꾀하며 도읍을 안읍에서 대량(지금 카이펑)으로 옮겼다. 천도 연대는 『죽서기년』으로는 기원전 361년이고 『사기』는 기원전 340년 무렵으로 적어 갈린다. 기원전 354년 위가 장군 방연을 보내 조의 한단을 포위하자 조는 제에 구원을 청했고, 제 위왕은 전기를 장군으로, 손빈을 군사(軍師)로 보냈다. 손빈은 한단으로 곧장 가지 않고 위 도읍 대량을 치는 모양을 보여 급히 돌아오는 방연을 기원전 353년 계릉에서 크게 이겼다(위위구조). 위는 한단을 점령했다가 몇 해 뒤 돌려주었다. 기원전 342년 위가 한(韓)을 치자 한이 제에 도움을 청했고, 전기와 손빈은 다시 대량을 겨냥했다. 손빈은 부뚜막 수를 하루씩 줄여 군사가 달아나는 듯 꾸몄고, 방연이 가벼운 병력으로 쫓다가 마릉의 좁은 길에서 매복에 걸려 크게 졌다. 방연은 자결했다고 하며 위의 태자 신은 사로잡혔다. 손빈은 방연이 모함해 두 발이 잘렸다고 전한다. 계릉의 위치는 산둥성 허쩌와 허난성 창위안 두 설이 있고, 마릉은 허베이성 다밍과 산둥성 선현 같은 여러 곳이 거론되어 정해지지 않았다. 손빈을 제 위왕에게 추천한 사람이 전기였다고 『사기』는 적는다. 1972년 산둥성 린이 은작산 한묘에서 『손빈병법』이 죽간으로 나와, 『손자병법』의 손무와 별개의 인물임이 확인되었다. 마릉 이후 위의 패권은 꺾였고, 같은 시기 변법으로 힘을 키운 진(秦)이 위를 쳐서 하서를 되찾았다(앞의 사건 「상앙의 변법(기원전 356·350)과 진(秦)의 하서 회복(기원전 330~328)」). 기원전 334년 무렵 위 혜왕은 서주(徐州)에서 제 위왕과 만나 서로를 왕으로 인정했다."
  subjects: [wei-state, qi-state, zhao-state, han-state, qin-state]
  links:
    - { from: qi-state, to: wei-state, note: "계릉·마릉 전투에서 위군을 물리침(기원전 353·342)" }
  tags: [war, diplomacy]
  sources: ["『사기』 손자오기열전", "『사기』 위세가", "『사기』 전경중완세가", "『전국책』 제책", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)"]

- id: shang-yang-356bc
  year: -355
  endYear: -327
  precision: year
  title:
    ko: "상앙의 변법(기원전 356·350)과 진(秦)의 하서 회복(기원전 330~328)"
  summary:
    ko: "진(秦)은 위에게 하서를 잃은 뒤(앞의 사건 「위 문후의 개혁과 하서 획득(기원전 445~396)」) 국력이 약했다. 기원전 361년 즉위한 효공은 인재를 구하는 포고를 내렸고, 위(衛)의 공손앙(상앙)이 이에 응했다. 상앙은 기원전 359년 효공 앞에서 구법을 고수하자는 감룡·두지와 논쟁해 변법을 이끌었다. 기원전 356년 첫 변법은 5가를 묶어 서로 감시하고 죄를 함께 묻게 하는 연좌제, 전공에 따라 작위를 주는 20등급 군공작, 아들이 둘 이상이면 분가시키는 규정, 농사와 베 짜기를 장려하는 정책이었다. 법을 믿게 하려고 남문의 나무 기둥을 옮기면 상을 준 일화도 전한다. 태자가 법을 어기자 그 스승들에게 벌을 주었다. 기원전 350년 도읍을 함양으로 옮기고 군현제를 넓히며 정전의 경계(천맥)를 트고 토지를 사고팔 수 있게 한 2차 변법을 했다고 전한다. 기원전 344년 무렵 만든 상앙방승으로 도량형을 통일했다. 기원전 340년(341년설도 있음) 상앙은 위를 쳐서 공자 앙을 속여 사로잡고 위군을 대파했다. 위는 하서 일부를 바쳤고 『사기』 상군열전은 이때 도읍을 대량으로 옮겼다고 적는다. 상앙은 상(商)·어(於) 15읍에 봉해져 상군이라 불렸다. 효공이 죽자 기원전 338년 혜문군이 상앙을 거열형으로 처형했으나 법은 그대로 이어졌다. 기원전 330년 위가 하서를 바쳤고, 기원전 328년에는 상군 15현을 바쳐 진은 하서와 상군을 되찾았다. 혜문군은 기원전 325년 무렵 왕을 칭했다. 효공의 아버지 헌공은 기원전 384년 순장을 금지하고 기원전 383년 도읍을 옹에서 역양으로 옮겼으며 기원전 364년 석문에서 위군 6만을 벴다고 한다. 『사기』에 전하는 효공의 포고에는 제후들이 진을 얕본다는 한탄이 담겨 있다."
  subjects: [qin-state, wei-state]
  links:
    - { from: qin-state, to: wei-state, note: "하서(기원전 330)와 상군(기원전 328)을 되찾음" }
  tags: [politics, war]
  sources: ["『사기』 상군열전", "『사기』 진본기", "『사기』 위세가", "Cho-yun Hsu, Ancient China in Transition: An Analysis of Social Mobility, 722–222 B.C. (Stanford University Press, 1965)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: hezong-lianheng-334bc
  year: -333
  endYear: -295
  precision: year
  title:
    ko: "합종과 연횡: 서주(徐州) 상왕(기원전 334)에서 맹상군의 함곡관 공격(기원전 298~296)까지"
  summary:
    ko: "기원전 334년 위 혜왕과 제 위왕이 서주(徐州, 지금 산둥성 텅저우 둘레)에서 서로를 왕으로 인정한 일(서주(徐州) 상왕)을 계기로 큰 나라들이 잇달아 왕을 칭했다. 진(秦) 혜문군은 기원전 325년 무렵 왕을 칭했고, 기원전 323년 무렵에는 위의 공손연(서수)이 주도해 위·한·연·중산이 서로 왕으로 인정했다(오국상왕, 『전국책』 중산책). 조의 무령왕은 왕 칭호를 쓰지 않고 군이라 불렀다고 『사기』 조세가는 적는다. 이때 연이 왕을 칭하자 고조선의 지배자도 왕을 칭하고 연을 치려 했다고 전한다(뒤의 사건 「고조선의 왕 칭호와 연과의 대립」). 강해진 진(秦)에 맞서 동쪽 나라들이 남북으로 손잡자는 주장이 합종이고, 진(秦)과 하나씩 손잡아 동서로 이어지자는 주장이 연횡이다. 『사기』 소진열전은 소진이 연·조·한·위·제·초를 설득해 6국의 합종을 이루었다고 적고, 장의가 진의 재상이 되어 이를 깼다고 한다. 그러나 1973년 마왕퇴 한묘에서 나온 『전국종횡가서』는 소진의 활동 시기가 장의보다 뒤로 연 소왕(재위 기원전 311~279) 때임을 보여 주어, 『사기』의 연대를 그대로 믿기 어렵다는 연구가 많다. 장의는 위 출신으로 기원전 328년 진의 재상이 되었고, 기원전 313년 초 회왕에게 제와 끊으면 상·어 땅 600리를 주겠다고 속여 초와 제의 동맹을 깼다(뒤의 사건 「진(秦)의 파·촉 정복(기원전 316)과 한중(기원전 312)」). 기원전 318년에는 한·조·위·연·제와 흉노까지 가담한 연합군(흉노를 의거로 읽는 연구도 있다)이 진을 쳤으나 수어에서 졌다고 『사기』 진본기는 적는다(초 회왕이 합종의 우두머리였다는 기록은 초세가). 기원전 298년 제의 맹상군 전문이 제·한·위 군대를 이끌고 함곡관에 이르렀고, 기원전 296년 진은 하북 땅과 봉릉을 한·위에 돌려주고 화의했다(『사기』 맹상군열전·진본기). 합종은 진이 동쪽으로 뻗는 것을 늦췄으나 나라마다 이해가 달라 오래가지 못했다."
  subjects: [qin-state, qi-state, chu-state, yan-state, zhao-state, wei-state, han-state, zhongshan-state, xiongnu, gojoseon]
  tags: [diplomacy, politics, war]
  sources: ["『사기』 소진열전", "『사기』 장의열전", "『사기』 맹상군열전", "『사기』 진본기", "『전국책』 중산책", "Yuri Pines, Envisioning Eternal Empire: Chinese Political Thought of the Warring States Era (University of Hawaii Press, 2009)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: chu-conquers-yue-333bc
  year: -332
  endYear: -332
  precision: year
  title:
    ko: "초의 월 정복과 월 왕족의 흩어짐(기원전 333)"
  summary:
    ko: "기원전 473년 오를 병합한 월은 구천(기원전 465년 졸)이 죽은 뒤 석여·불수·옹·예 같은 여러 왕을 거치며 점차 쇠약해졌다. 『사기』 월왕구천세가는 구천의 후손 가운데 무강 때에 월이 북으로 제를, 서로 초를 치며 중원 나라들과 다투었다고 적는다. 『사기』는 제 위왕이 사신을 보내 월왕을 설득했는데, 월이 초를 공격하게 만들어 제가 한숨 돌리려는 계산이었다고 전한다. 월은 제를 두고 초를 쳤다가 초 위왕(재위 기원전 339~329)에게 크게 졌고, 무강은 죽임을 당했다. 이 무렵 제 위왕은 기원전 334년 서주(徐州) 상왕으로 위와 서로 왕을 인정하며 손잡은 직후였다(앞의 사건 「합종과 연횡: 서주(徐州) 상왕(기원전 334)에서 맹상군의 함곡관 공격(기원전 298~296)까지」). 초는 옛 오 땅에서 저장성 북부에 이르는 땅을 차지해 창장강 하류까지 영역을 넓혔다. 연대는 한 가지로 정해지지 않았다. 흔한 환산은 초 위왕 7년인 기원전 333년이고 『자치통감』은 334년, 양콴은 기원전 306년(회왕 23년)으로 본다. 월의 왕족과 귀족은 흩어져 저장 남부와 푸젠 바닷가에서 군장이 되었다. 『사기』는 무강 뒤 여러 족자가 다투어 왕이나 군이 되어 강남 바닷가에서 초에 조공했다고 짧게 적는다. 이들의 후예는 한나라 때 동구와 민월로 이어졌다고 전한다. 월의 청동기와 원시청자는 저장성 사오싱과 닝보 둘레에서 많이 나오며, 두드려 무늬를 찍은 인문도도 월 문화의 특색으로 널리 퍼졌다. 월 사람들은 머리를 짧게 자르고 몸에 문신을 새기며 배와 청동 칼을 잘 다룬 것으로 알려졌다. 1965년 후베이성 장링 망산 1호 묘에서 '월왕 구천' 글자를 새긴 청동 검이 나왔다. 월이라는 이름은 이후에도 남쪽 여러 사람들(백월)을 부르는 말로 쓰였다. 월을 누른 초는 창장강 중·하류를 아우르는 대국이 되었다."
  subjects: [yue-state, chu-state, qi-state]
  links:
    - { from: chu-state, to: yue-state, note: "월을 정복해 옛 오 땅과 저장 북부를 차지함(기원전 333)" }
  tags: [war, politics]
  sources: ["『사기』 월왕구천세가", "『사기』 초세가", "『죽서기년』", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: zhao-wuling-307bc
  year: -306
  endYear: -294
  precision: year
  title:
    ko: "조 무령왕의 호복기사(기원전 307)와 중산 병합(기원전 296)"
  summary:
    ko: "조 무령왕(재위 기원전 325~299)의 나라는 서쪽에 진(秦), 북쪽에 임호·누번 같은 유목 집단, 동쪽과 가운데에 중산을 두고 있었다. 『사기』 조세가는 무령왕이 오국상왕 때 처음부터 왕 칭호를 쓰지 않고 군이라 부르게 했다고 적는다(기원전 318년 진에 크게 진 뒤 칭호를 거두었다는 설도 있다). 기원전 307년 무령왕은 소매 넓은 옷과 전차 전투 대신 소매가 좁은 짧은 옷과 바지를 입고 말 위에서 활을 쏘는 법을 받아들이자고 했다(호복기사). 귀족과 종실이 옛 법을 따라야 한다고 반대하자, 무령왕은 풍속은 나라를 이롭게 하면 된다고 설득했다고 『사기』 조세가는 전한다. 이 개혁으로 조는 기병을 키웠고 기원전 306년에는 임호와 누번을 쳐서 복속시키고 북쪽 땅을 넓혔다. 전차 대신 기병이 중요해지자 다른 나라도 기병을 갖추었고, 전국 후반에는 기병이 주요 병종이 되었다. 임호와 누번은 오르도스와 산시성(山西) 북부에 살던 집단으로 남은 기록은 대부분 조의 쪽에서 쓴 것이다. 『사기』 조세가는 기원전 300년 무렵 조의 땅이 북으로 연·대, 서로 운중·구원에 이르렀다고 적고, 『사기』 흉노열전은 이때 대에서 음산 아래 고궐까지 장성을 쌓고 운중·안문·대군을 두었다고 적는다. 기원전 299년 무령왕은 아들 혜문왕에게 왕위를 물려주고 스스로 주부라 칭하며 군사를 맡았다. 기원전 296년 조는 중산을 병합하고 중산의 왕을 부시로 옮겼다(앞의 사건 「중산국의 흥망(기원전 506~296)」). 무령왕은 첫 왕후의 아들 장을 세웠다가 총애하던 오광의 딸 맹요가 낳은 아들 하(뒤의 혜문왕)로 후계를 바꿨다. 이에 장의 불만이 쌓여 기원전 295년 사구궁의 난이 일어났고, 무령왕은 궁에 갇혀 석 달가량 뒤 굶어 죽었다."
  subjects: [zhao-state, zhongshan-state, qin-state]
  links:
    - { from: zhao-state, to: zhongshan-state, note: "중산을 병합함(기원전 296)" }
  tags: [politics, war]
  sources: ["『사기』 조세가", "『사기』 흉노열전", "『전국책』 조책", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-bashu-316bc
  year: -315
  endYear: -311
  precision: year
  title:
    ko: "진(秦)의 파·촉 정복(기원전 316)과 한중(기원전 312)"
  summary:
    ko: "쓰촨 분지에는 독자적 청동기 문화가 일찍이 있었고, 전국 시대에는 촉(蜀)이 개명씨 왕조를 이어 가며 파(巴, 지금 충칭 둘레)와 이웃했다. 싼싱두이 유적에서 나온 큰 청동 입상과 황금 가면은 상·서주와 같은 때의 것이지만, 문자 기록이 없어 『화양국지』에 전하는 고촉 왕조와 곧바로 이을 수는 없다. 기원전 316년 무렵 촉왕이 아우 저후(苴侯)를 치자 저후는 파로 달아났고 파가 진에 구원을 청했다고 하며, 진은 이를 기회로 삼았다. 진 조정에서는 장의가 한을 쳐서 주 왕실을 위협하고 구정을 차지하자고 주장했고 사마착은 촉을 병합해 재원을 얻은 뒤 동쪽을 치자고 주장했다. 혜문왕은 사마착의 계획을 따랐고(『사기』 장의열전), 진군은 촉왕을 무양까지 쫓아 죽였고(최후의 모습은 사료마다 갈린다) 이어 파를 병합해 파왕과 저후를 사로잡았다. 진은 촉왕의 아들을 촉후로 두었다가 반란을 거듭 진압한 끝에 직접 군을 두었다. 쓰촨은 곡식이 많이 나는 천부의 땅이 되어, 뒤에 이빙이 도강언을 만들어(소양왕 말기) 이 땅을 더 풍요롭게 했고 진이 통일 전쟁의 병참 기지로 삼았다. 기원전 312년에는 진의 서장 위장이 단양에서 초군을 크게 이겨 초의 장수 굴개를 사로잡고 한중 땅 600리를 빼앗았다고 『사기』 진본기와 초세가는 적는다(초군 8만 참수). 초 회왕은 분노해 군대를 다시 모아 남전으로 진군했으나 크게 졌고, 한과 위가 초의 후방을 치자 물러났다. 한중군을 둔 진은 이로써 쓰촨과 한중, 관중을 모두 가진 서쪽 대국이 되었다. 파·촉 정복의 계기와 시기에 대해서는 『화양국지』와 『사기』의 전승이 조금 다르다. 한중은 한수이강 상류 분지로 관중과 쓰촨 사이의 길목이어서, 이 땅을 얻은 진은 초를 서쪽에서 압박할 수 있게 되었다."
  subjects: [qin-state, chu-state, han-state]
  links:
    - { from: qin-state, to: chu-state, note: "단양 전투에서 한중을 빼앗음(기원전 312)" }
  tags: [war, politics]
  sources: ["『사기』 진본기", "『사기』 장의열전", "『사기』 초세가", "『화양국지』 촉지", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-yiyang-307bc
  year: -306
  endYear: -300
  precision: year
  title:
    ko: "의양 함락(기원전 307)에서 수사 전투(기원전 301)까지"
  summary:
    ko: "기원전 307년 진(秦) 무왕은 감무를 보내 한의 의양(지금 허난성 이양 서쪽)을 쳐서 6만 명을 베고 함락시켰다(『사기』 진본기). 의양은 한의 철 산지이자 뤄양으로 가는 길목이었다. 『전국책』 진책에 따르면 의양 공격은 다섯 달이 걸렸고 도중에 반대가 많아 무왕이 식양에서 감무와 맺은 약속을 상기시켜 계속 밀어붙였다. 의양을 잃은 한은 서쪽 방어선이 약해졌고, 진은 뤄양 둘레를 직접 압박할 수 있게 되었다. 무왕은 힘이 센 장사 임비와 오획 같은 이들을 가까이 두었는데, 주 왕실이 있는 뤄양에서 구정을 들어 보다 정강이가 부러져 그해 죽었다. 아들이 없어 이복동생 소양왕(소왕, 재위 기원전 306~251)이 어린 나이에 즉위하자 어머니 선태후(초 출신 미팔자)가 섭정했고 선태후와 어머니가 같은 아우 위염이 정치를 이끌었다. 선태후가 초 출신이어서 즉위 초에는 진과 초의 관계가 가까웠고, 공자 장이 일으킨 계군의 난은 진압되었다. 소양왕은 56년 동안 재위했다. 진은 기원전 304년 초 회왕과 황극에서 만나 상용을 돌려주고 화친했으나, 그 뒤 초의 태자가 진에서 대부를 죽이고 달아난 일로 관계가 다시 깨졌다. 기원전 301년 진은 제·한·위와 연합해 초를 쳤다. 수사에서 초의 장수 당매가 전사했고(『사기』 초세가), 초는 중구를 비롯한 북쪽 땅을 잃었고, 완(宛)·섭(葉) 이북의 땅은 한과 위가 나누어 차지했다고 전한다. 진은 한과 위를 앞세워 초를 치고, 초가 약해지자 다시 한·위를 압박하는 방식으로 동쪽 나라들을 하나씩 누르는 길을 닦았다. 이 시기는 기원전 299년 진이 초 회왕을 무관 회맹에 불러 억류하는 사건(뒤의 사건 「초 회왕의 억류(기원전 299)와 영 함락(기원전 278)」)으로 이어졌다."
  subjects: [qin-state, han-state, chu-state, qi-state, wei-state, eastern-zhou]
  links:
    - { from: qin-state, to: han-state, note: "의양을 함락해 차지함(기원전 307)" }
  tags: [war, politics]
  sources: ["『사기』 진본기", "『사기』 초세가", "『사기』 한세가", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: yique-293bc
  year: -292
  endYear: -289
  precision: year
  title:
    ko: "이궐 전투(기원전 293)와 진(秦)의 하동 확보(기원전 290)"
  summary:
    ko: "소양왕 때 진(秦)은 백기를 장군으로 삼아 동쪽으로 나갔다. 백기는 미(郿) 출신으로 기원전 294년 한의 신성을 공격했고, 이듬해 한·위 연합군과 이궐에서 맞섰다. 이궐은 뤄양 남쪽 이허강이 산 사이를 지나는 좁은 협곡(지금 룽먼)으로 뤄양 방면의 요충이다. 동서 두 산이 마주 선 이 협곡에는 훗날 룽먼 석굴이 조성되었다. 이궐 이전 진의 동진은 의양 함락(앞의 사건 「의양 함락(기원전 307)에서 수사 전투(기원전 301)까지」)에서 시작되었다. 『사기』 진본기와 백기열전은 백기가 이 싸움에서 24만 명을 베고 연합군 장수 공손희를 사로잡고 5개 성을 빼앗았다고 적는다. 참수 수는 사료가 과장했을 가능성이 크지만, 이 싸움은 한과 위가 진을 막을 힘이 없다는 것을 보여 주었다. 이 싸움에 관한 서술은 대부분 진 쪽 사료에 기대고 있다. 『사기』 진본기는 기원전 292년 백기가 위의 원을 빼앗았다가 돌려주고 초의 완(宛)을 차지했다고 적지만, 한세가는 기원전 291년 진이 한의 완을 빼앗았다고 적어 갈린다(수사 전투 뒤 완은 한이 가졌다고 본다). 진 소양왕이 기원전 288년 서제를 칭하고 제 민왕이 동제를 칭했다가 곧 취소한 일(뒤의 사건 「제 민왕의 송 병합(기원전 286)과 5국 연합의 제 공격(기원전 284)」)도 이 무렵 진의 위세를 보여 준다. 진의 압력은 계속되어 기원전 290년 위는 하동 땅 400리를 진에 바쳤고(『사기』 위세가) 한은 무수 땅 200리를 바쳤다(『사기』 한세가). 하동은 위의 옛 도읍 안읍이 있던 황허강 동쪽 땅이고 무수는 한의 서쪽 요충으로, 둘 다 진과 맞닿은 방어선이었다. 백기는 이궐 이후 진의 가장 이름난 장군으로 자리를 굳혔다. 진은 이 땅을 발판으로 황허강 동쪽으로 본격 진출해 뤄양과 대량 사이의 길을 위협하게 되었다."
  subjects: [qin-state, han-state, wei-state]
  links:
    - { from: wei-state, to: qin-state, note: "하동 땅 400리를 바침(기원전 290)" }
    - { from: han-state, to: qin-state, note: "무수 땅 200리를 바침(기원전 290)" }
  tags: [war, diplomacy]
  sources: ["『사기』 진본기", "『사기』 백기왕전열전", "『사기』 위세가", "『사기』 한세가"]
  places:
    - { name: "이궐 전투 (룽먼)", at: [112.47, 34.556], year: -292 }

- id: qi-song-286bc
  year: -285
  endYear: -278
  precision: year
  title:
    ko: "제 민왕의 송 병합(기원전 286)과 5국 연합의 제 공격(기원전 284)"
  summary:
    ko: "송 강왕(언)은 기원전 318년 왕을 칭하고 제·초·위를 두루 쳤으나 『사기』 송미자세가는 그를 하늘을 쏘고 땅을 때렸다는 이야기로 폭군(걸송)처럼 그린다. 제 민왕(재위 기원전 300~284)은 선왕 때 커진 힘을 믿고 기원전 288년 진 소양왕이 서제를 칭하자 동제를 칭했다가 곧 취소했다. 기원전 286년 제가 송을 쳐서 멸했고 송 왕은 위 땅 온에서 죽었다. 제는 송 땅을 독차지하려 했으나 초와 위도 몫을 요구해 균형이 흔들렸다. 연 소왕(재위 기원전 311~279)은 자지의 선양 소동 뒤 제 선왕에게 점령당한 일(기원전 314)의 치욕을 씻기 위해 곽외의 건의를 받아 황금대를 쌓아 인재를 모으고 악의를 상장군으로 삼았다. 기원전 284년 악의는 연·진(秦)·한·조·위 군대를 이끌고 제서에서 제군을 깨뜨린 뒤 연군만으로 임치를 점령하고 제의 70여 성을 차지했다(『사기』 악의열전). 민왕은 거로 달아났다가 구원하러 온 초의 요치에게 살해되었다. 제에는 거와 즉묵만 남았고, 거 사람들은 민왕의 아들 법장을 양왕(재위 기원전 283~265)으로 세웠다. 기원전 279년 즉묵의 전단이 소 수백 마리 꼬리에 불을 붙여 연군에 돌진하게 하는 화우계로 70여 성을 되찾자 양왕이 임치로 돌아왔다. 이후 제는 다시 패권을 쥐지 못했고, 송 땅은 위와 초가 나누어 가졌다. 제 민왕은 송을 얻은 뒤 남쪽으로 초의 회북, 서쪽으로 삼진을 침입하고 주 왕실을 병합하려 했다고 『사기』는 적는다. 제 민왕과 불화한 맹상군은 위로 가서 위의 재상이 되어 연합을 도왔다고 한다. 같은 무렵 연은 진개를 보내 동호를 물리치고 장성을 쌓았으며 고조선의 서쪽 땅을 빼앗았다(뒤의 사건 「연 진개의 침입과 중심지 이동」)."
  subjects: [qi-state, song-state, yan-state, wei-state, chu-state, qin-state, zhao-state, han-state, gojoseon, donghu]
  links:
    - { from: qi-state, to: song-state, note: "송을 병합함(기원전 286)" }
    - { from: yan-state, to: qi-state, note: "악의가 제를 쳐서 임치를 점령함(기원전 284)" }
  tags: [war, politics]
  sources: ["『사기』 송미자세가", "『사기』 악의열전", "『사기』 전단열전", "『사기』 전경중완세가", "『사기』 연소공세가", "『전국책』 제책"]

- id: chu-ying-299bc
  year: -298
  endYear: -277
  precision: year
  title:
    ko: "초 회왕의 억류(기원전 299)와 영 함락(기원전 278)"
  summary:
    ko: "초 회왕(재위 기원전 329~299)은 기원전 313년 장의에게 속아 제와 끊고 진과 싸워 잇따라 졌다(앞의 사건). 기원전 299년 진(秦) 소양왕이 무관에서 만나 화친하자고 제안하자 시인이자 대부인 굴원은 가면 안 된다고 했으나 회왕의 막내아들 자란이 권해 회왕이 갔다. 굴원은 앞서 회왕이 믿던 좌도(左徒)로 제와 연합하는 정책을 지지했으나 상관대부 근상 등의 참소로 멀어졌다고 『사기』 굴원가생열전은 적는다. 진은 회왕을 붙잡아 땅을 떼어 달라고 요구했고 회왕은 거절했다. 회왕은 기원전 297년 도망쳤으나 조가 받아 주지 않아 다시 진에 끌려갔고, 이듬해 진에서 죽었다. 이 사이 초는 제에 인질로 가 있던 태자 횡을 맞아 경양왕(재위 기원전 298~263)으로 세웠다. 경양왕 때 초는 북방의 진에 계속 밀렸고, 기원전 280년 한북과 상용 땅을 진에 바쳤다. 기원전 279년 백기가 언·등·서릉을 차지했는데, 언에서는 강물을 끌어 성을 잠기게 해 수십만이 죽었다고 한다. 기원전 278년 백기는 도읍 영(郢)을 함락하고 이릉의 선왕 무덤을 불살랐다. 영의 터로 알려진 기남성 유적(지금 후베이성 징저우)은 성벽 둘레가 16km 가까이 이르는 큰 도시였다. 진은 영 땅에 남군을 두었다. 경양왕은 도읍을 동북쪽 진(陳)으로 옮겼고(『사기』 초세가), 초는 이후 크게 힘을 잃었으며 고열왕 때 거양을 거쳐 기원전 241년 도읍을 다시 수춘으로 옮겼다. 굴원은 영이 함락된 뒤 절망해 멱라강에 몸을 던졌다고 전하며, 그의 시 「이소」는 초사의 대표작으로 남았다. 영이 무너진 뒤에도 초는 화이허강 유역과 창장강 하류의 넓은 땅을 지켜, 진은 통일 전쟁에서 초를 마지막 큰 싸움 상대로 맞게 된다."
  subjects: [chu-state, qin-state]
  links:
    - { from: qin-state, to: chu-state, note: "백기가 영을 함락하고 남군을 둠(기원전 278)" }
  tags: [war, politics]
  sources: ["『사기』 초세가", "『사기』 굴원가생열전", "『사기』 백기왕전열전", "『사기』 진본기", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: yiqu-272bc
  year: -271
  endYear: -271
  precision: year
  title:
    ko: "진(秦) 선태후와 의거의 멸망(기원전 272)"
  summary:
    ko: "의거는 지금 닝샤 남부와 간쑤 동부, 산시성(陝西) 북부 일대에 살던 융 계통 사람들의 나라로, 도읍은 간쑤성 닝현·칭양 둘레로 추정한다. 청동기에는 오르도스와 북방 초원의 요소가 섞여 있다. 의거는 진(秦)의 서북에서 오래 맞선 세력으로, 진 혜문군 때(기원전 327) 의거의 군주가 진에 신하로 복속했다는 기록이 있으나 이후에도 복속과 반란이 되풀이되었다. 『사기』 흉노열전은 소양왕의 어머니 선태후가 의거 왕과 정을 통해 두 아들을 낳았다고 적는다. 기원전 272년 선태후는 의거 왕을 감천궁으로 불러 죽이고 군대를 일으켜 의거를 멸했다. 일부 학자는 소양왕이 직접 명령한 일을 어머니의 이야기로 꾸민 것이라고 본다. 『사기』 흉노열전은 룽산 서쪽에 면제·곤융·적·환의 융이, 기산과 량산, 징허강과 칠수 북쪽에 의거·대려·오씨·구연의 융이 있었다고 적는다. 진은 의거 땅에 『사기』 흉노열전에 따르면 농서군, 북지군, 상군을 두고 장성을 쌓아 북쪽 호(胡)를 막았다. 이로써 서북이 안정된 진은 동쪽으로 전력을 돌릴 수 있었다. 의거를 멸한 뒤 진은 서북의 융과 호를 장성을 사이에 두고 마주하게 되었다. 의거 쪽에서 남긴 문헌이 없어 이 이야기는 모두 진과 한나라 쪽 기록에 의존한다는 점을 염두에 둘 필요가 있다. 의거 문화로 추정되는 유적에서 청동 칼과 마구, 수레 장식, 짐승 무늬가 나온다는 보고가 있으나 어느 유적이 의거의 것인지는 학자마다 다르다. 이 무렵 진의 정치는 선태후와 그의 어머니가 같은 아우 위염이 쥐고 있었다. 기원전 266년에는 범저가 선태후와 그 일파를 내쫓고 먼 나라와 사귀고 가까운 나라를 치는 원교근공책을 내세워 상국이 되었다고 한다."
  subjects: [qin-state]
  tags: [war, politics]
  sources: ["『사기』 흉노열전", "『사기』 진본기", "『사기』 범저채택열전", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: changping-260bc
  year: -261
  endYear: -256
  precision: year
  title:
    ko: "장평 전투(기원전 260)와 한단 포위(기원전 259~257)"
  summary:
    ko: "기원전 262년 진(秦)이 한의 야왕을 쳐서 상당 지역을 한 본토와 끊자, 상당 태수 풍정은 진에 항복하지 않고 17개 성을 조에 바쳤다. 조 효성왕이 이를 받아들이면서 진과 조의 전면전이 시작되었다. 조는 염파를 보내 장평(지금 산시성(山西) 가오핑 북서쪽)에 방어선을 쌓았고, 염파는 보루를 굳게 지키며 2년 남짓 버텼다. 진은 범저의 계책으로(『사기』 백기열전) 진이 두려워하는 것은 조괄뿐이라는 소문을 퍼뜨렸고, 효성왕은 염파를 조괄로 바꿨다. 진은 비밀리에 백기를 상장군으로 보냈다. 조괄은 진군이 물러나는 척하자 추격하다 두 갈래로 포위되어 46일 동안 식량이 끊긴 끝에 돌파를 시도하다 전사했다. 『사기』 백기열전은 백기가 투항한 조군 40만을 땅에 묻어 죽이고 어린 병사 240명만 돌려보냈으며, 앞뒤로 45만을 베거나 사로잡았다고 적는데, 이는 과장일 가능성이 크다. 진도 손실이 커서 소양왕이 직접 하내에서 15세 이상을 징발했다고 한다. 기원전 259년 진은 조의 도읍 한단을 포위했다. 평원군은 식객 모수 등 20명을 이끌고 초에 가 원군을 청했고(모수자천) 초의 춘신군이 군대를 보냈다. 위의 신릉군(무기)은 위왕의 병부를 훔쳐 진비의 군대를 이끌고 기원전 257년 진군을 물리쳤다(절부구조). 백기는 한단 공격에 반대하다 소양왕과 갈라서 두우에서 자결했다. 이 싸움으로 조는 크게 쇠퇴했고 한도 상당을 잃었다. 조괄의 아버지 조사는 알여 싸움에서 진군을 이긴 이름난 장군이었고, 조괄은 병서를 잘 읽었으나 실전 경험이 없었다는 데서 종이 위의 병법(지상담병)이라는 말이 나왔다. 조괄의 어머니가 아들을 장군으로 쓰지 말라고 간청했다는 이야기도 『사기』 염파인상여열전에 전한다."
  subjects: [qin-state, zhao-state, han-state, wei-state, chu-state]
  links:
    - { from: qin-state, to: zhao-state, note: "장평 전투에서 조군을 격파함(기원전 260)" }
  tags: [war]
  sources: ["『사기』 백기왕전열전", "『사기』 염파인상여열전", "『사기』 위공자열전", "『사기』 조세가", "『전국책』 조책"]
  places:
    - { name: "장평 전투", at: [112.924, 35.798], year: -259 }

- id: eastern-zhou-end-256bc
  year: -255
  endYear: -248
  precision: year
  title:
    ko: "주 왕실의 소멸: 서주공의 항복(기원전 256)과 동주군 병합(기원전 249)"
  summary:
    ko: "동주 시기 천자의 직할지는 계속 줄었다. 기원전 440년 무렵 고왕이 아우를 하남에 봉해 서주국의 환공이 되었고, 그 손자 때인 기원전 367년 무렵 서주국 혜공이 막내아들을 공에 봉해 동주국의 혜공이 되면서 주는 서주국과 동주국으로 나뉘었다(『사기』 주본기). 현왕(재위 기원전 368~321)은 기원전 343년 진 효공에게 제후의 우두머리인 백의 지위를 내렸고(『사기』 진본기), 신정왕(재위 기원전 320~315)을 거쳐 난왕(재위 기원전 314~256)이 이었다. 난왕은 서주국의 왕성에 살며 서주공에게 기댔다. 전국 시대에 진이 구정을 요구하며 군대를 주 도읍에 보내자 주 군주가 제의 도움을 청해 막았다는 이야기가 『전국책』 주책에 전한다. 기원전 307년 진(秦)이 의양을 함락한 뒤 압박이 커졌다. 기원전 256년 진 소양왕은 서주공이 제후들과 합종을 꾀했다는 이유로 장군 규를 보내 서주국을 쳤다. 서주공은 진에 가 죄를 빌며 36읍과 인구 3만을 바쳤고, 난왕은 그해 죽었다. 난왕이 군대를 모으려고 빚을 냈다가 갚지 못해 높은 대로 피했다는 데서 채대고축이라는 말이 나왔다고 한다. 이듬해(기원전 255년) 진은 구정과 보기를 가져갔고 구정 하나는 사수에 빠졌다고 전한다. 하상주 단대공정 연표로 따지면 서주 시대 약 275년과 동주 시대 약 515년을 합해 790년 가까이 이어진 왕조가 끝난 것이다. 동주공은 한동안 남아 기원전 249년 제후들과 진에 맞설 계획을 세웠으나, 진 장양왕이 상국 여불위를 보내 동주를 없애고 양인 땅을 주공에게 주어 제사만 잇게 했다(『사기』 진본기). 주 왕실은 춘추 시대부터 이름뿐인 권위를 이어 왔고, 이로써 그 이름마저 사라졌다."
  subjects: [eastern-zhou, qin-state]
  links:
    - { from: qin-state, to: eastern-zhou, note: "서주공의 항복을 받고 동주를 병합함(기원전 256~249)" }
  tags: [politics, war]
  sources: ["『사기』 주본기", "『사기』 진본기", "하상주 단대공정 연표(2000)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-lvbuwei-251bc
  year: -250
  endYear: -236
  precision: year
  title:
    ko: "여불위의 진(秦)과 동쪽 진출(기원전 251~237)"
  summary:
    ko: "기원전 251년 소양왕이 죽자 효문왕이 이어 즉위했으나 곧 죽었고(『사기』는 즉위 사흘 만이라 적는다), 조 한단에 인질로 가 있던 아들 자초가 장양왕으로 즉위했다(재위 기원전 250~247). 자초의 귀국을 도운 상인 여불위는 상국이 되어 중부(仲父)라 불렸다. 장양왕이 죽고 13세(만 12세) 정(政, 뒤의 시황제)이 이었다. 기원전 249년 몽오가 한의 성고와 형양을 빼앗아 삼천군을 두었고, 기원전 247년에는 조의 유차·신성·낭맹 등 37성을 차지해 태원군을 두었다(『사기』 진본기). 같은 해 위의 신릉군이 한·조·위·초·연 5국 군대를 이끌고 하외에서 진군을 물리치고 함곡관까지 이르렀다. 기원전 246년 한은 진의 힘을 빼려고 수공 정국을 진에 보내 징허강에서 물을 끌어오는 큰 수로 공사를 시켰다. 속셈이 드러났으나 진은 공사를 계속했고, 정국거는 관중의 땅을 크게 기름지게 만들었다(『사기』 하거서). 기원전 242년 몽오가 위의 20성을 빼앗아 동군을 두었다. 초는 기원전 249년 노를 병합했고 이듬해 춘신군을 옛 오 땅에 봉했으며, 기원전 241년 5국 합종군이 다시 진을 쳤다가 실패한 뒤 도읍을 수춘으로 옮겼다. 여불위는 식객을 모아 『여씨춘추』를 엮었고(기원전 239), 정은 기원전 238년 친정을 시작하며 노애의 난을 평정했다. 이듬해 외국 출신 관료를 쫓아내라는 축객령이 내려졌다가 이사의 상소로 철회되었고, 여불위는 밀려났다(기원전 235 자결). 이사와 위료는 6국을 이간하고 차례로 정복하는 전략을 건의했다. 이 무렵 진은 관중의 수로와 쓰촨의 곡식, 한중의 자원에 힘입어 동쪽 6국을 압도하는 재정과 병력을 갖추었다."
  subjects: [qin-state, wei-state, zhao-state, han-state, chu-state]
  links:
    - { from: qin-state, to: han-state, note: "성고·형양을 얻어 삼천군을 둠(기원전 249)" }
    - { from: qin-state, to: zhao-state, note: "유차·신성·낭맹 등을 얻어 태원군을 둠(기원전 247)" }
    - { from: qin-state, to: wei-state, note: "위의 20성을 얻어 동군을 둠(기원전 242)" }
  tags: [politics, war]
  sources: ["『사기』 진시황본기", "『사기』 진본기", "『사기』 여불위열전", "『사기』 하거서", "『사기』 이사열전", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: qin-han-zhao-230bc
  year: -229
  endYear: -227
  precision: year
  title:
    ko: "진(秦)의 한·조 정복(기원전 230~228)"
  summary:
    ko: "한의 공자 한비는 기원전 233년 진(秦)에 사신으로 갔다가 이사와 요가의 모함으로 옥에서 죽었다(앞의 사건 「한(韓)의 정 병합(기원전 375)과 신불해의 개혁」). 한비는 한의 약함을 걱정해 한왕에게 여러 번 글을 올렸으나 쓰이지 않았다고 『사기』 노자한비열전은 전한다. 한은 기원전 231년 남양 땅을 진에 바쳤다고 하며(『사기』 진시황본기), 기원전 230년 진의 내사 등이 한의 도읍 신정을 함락하고 왕 안을 사로잡아 한을 멸했으며 그 땅에 영천군을 두었다. 영천군은 위의 도읍 대량과 초의 북쪽 변경을 향한 발판이 되었다. 한의 옛 땅에서 뒤에 일어난 반란 뒤 왕 안이 처형되었다고 전한다. 이어 진은 조를 겨냥했다. 조는 장평 이후 힘이 줄었고, 효성왕(재위 기원전 266~245)과 도양왕(기원전 244~236)을 거쳐 유목왕 천(기원전 235~228) 때에 이르렀다. 진의 환의는 기원전 234년 평양에서 조군 10만을 벴다고 하나(『사기』 진시황본기), 이듬해 이목이 환의의 군대를 의안에서 물리치는 등 조는 한동안 버텼다. 기원전 229년 왕전의 군대가 조를 치자 이목과 사마상이 맞섰는데, 진은 조왕 천(유목왕)의 총신 곽개에게 뇌물을 주어 이목과 사마상이 반역하려 한다고 모함하게 했고 천은 이목을 죽였다(『사기』 염파인상여열전). 기원전 228년 왕전이 한단을 함락하고 천을 사로잡아 조는 멸망했다. 이때 진왕은 한단에 와서 어머니 집안과 원한이 있던 사람들을 구덩이에 묻었다고 전한다. 천의 형 공자 가는 수백 명을 이끌고 북쪽의 대로 달아나 대왕을 칭했고 연과 손잡아 상곡에 군대를 두었다. 그 저항은 기원전 222년 왕분이 대를 평정할 때까지 이어졌다. 이 무렵 진의 장군으로는 왕전과 이신, 몽염, 왕분 같은 이들이 이름을 날렸다. 한과 조는 진과 맞닿은 이웃이어서 통일 전쟁의 첫 표적이 되었다."
  subjects: [qin-state, han-state, zhao-state, yan-state]
  links:
    - { from: qin-state, to: han-state, note: "신정을 함락해 한을 멸함(기원전 230)" }
    - { from: qin-state, to: zhao-state, note: "한단을 함락해 조를 멸함(기원전 228)" }
