# 중국 사건 1차 묶음(cn-01): 상·주·춘추·전국 (기원전 1600 ~ 기원전 221)
# 범위: 상의 성립과 은허(갑골문·청동기), 목야 전투와 주의 상 정복, 주공의 섭정과 봉건, 국인 폭동과 공화, 호경 함락과 동주 천도, 춘추 시대(곡옥의 진(晉) 병합, 초의 칭왕,
#   제 환공과 관중, 진(晉) 헌공의 괵·우 병합, 진(秦) 무공·목공, 성복 전투, 초 장왕과 필 전투, 오·월의 흥망, 공자), 진(晉)의 육경 쟁탈과 삼분, 전국 시대 초기의 변화(중산, 위 문후, 오기의 변법),
#   한의 정 병합과 신불해, 계릉·마릉 전투, 상앙의 변법, 합종연횡, 초의 월 정복, 조 무령왕의 호복기사, 진(秦)의 파·촉과 한중 정복, 이궐·장평 전투, 제의 송 병합과 연의 제 공격,
#   초 회왕과 영 함락, 의거 병합, 동주의 소멸, 진(秦)의 통일 전쟁(한·조·연·위·초·제), 제자백가와 철기·우경.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 기원전 1600~221년 지도에서 생기거나 끝난 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음(docs/guides/event.md 3절).
# 해: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 221년 = −220)로 넣고 본문에는 '기원전 221년'처럼 적었다. 상·서주의 해는 하상주 단대공정 연표(상 기원전 1600~1046, 서주 기원전 1046~771, 동주 기원전 770~256)를 따랐고
#   다른 설은 본문에 한 줄 밝혔다. 사료의 해가 갈리는 곳(진(晉) 멸절 376·369, 초의 월 정복 333·306, 위 대량 천도 361·340 무렵)은 두 설을 함께 적었다.
# 날짜: 1912년 전 중국 사건이라 달력은 음력이다. 본문에서 달을 적을 때는 '음력'을 밝히거나 달까지만 적었고, 확실하지 않은 일은 '무렵'으로 적었다.
# 이름: 신해혁명(1911) 전 인물은 한자음, 지금 쓰지 않는 옛 지명은 한자음(호경·낙읍·임치·대량·한단 등), 지금도 쓰는 이름은 중국어 표기(뤄양·카이펑·사오싱 등). 강은 황허강·창장강·화이허강·웨이허강·한수이강·펀허강.
#   나라 이름은 항목 이름과 맞추고 동음은 한자를 붙였다(진(晉)·진(秦), 위(魏)·위(衛), 한(韓)). 중국 기록의 병력·사상자 수는 과장이 많아 사료의 수임을 밝혔다.
# 한국사와 닿는 점: 제 환공의 발조선 기록, 연의 왕 칭호와 고조선(`gojoseon-king-322`), 연 진개의 침입(`jingae-281`), 철기와 명도전(`iron-age`), 진의 통일과 부왕(`bu-jun-kings-220`)을 한두 문장씩 견주었다.
#   한국사 파일(01~08)에 이미 있는 사건은 다시 만들지 않고 「제목」으로 가리켰다.
# places: 전쟁 보기가 없는 싸움 가운데 위치가 분명한 이궐·장평에만 달았다. 나머지 싸움은 위치가 다투어져 달지 않았다.
# 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 운영자 검수 필요.

- id: shang-founding-1600bc
  year: -1599
  endYear: -1300
  precision: decade
  title:
    ko: "상의 성립과 초기 상: 탕의 하 정벌 전승과 정저우 상성(기원전 1600 무렵)"
  summary:
    ko: "『사기』 은본기는 설(契)에서 탕(湯)에 이르는 상(商)의 계보를 적고, 탕이 재상 이윤의 도움으로 하(夏)의 마지막 왕 걸을 명조에서 물리치고 천자가 되었다고 전한다. 하상주 단대공정 연표는 이 일을 기원전 1600년 무렵으로 잡는다(한나라 유흠은 기원전 1766년, 『죽서기년』 옛 글은 기원전 1523년 무렵으로 보았다). 고고학에서는 허난성 정저우의 상성(얼리강 문화 유적)이 이른 시기 상의 중심이었다고 보는 견해가 널리 받아들여진다. 이곳에서는 둘레 약 7km의 판축 성벽과 청동 제기·무기를 만든 공방 터가 나왔고, 비슷한 유물이 황허강 중하류 곳곳과 창장강 중류의 판룽청(지금 우한 북쪽)에서도 확인된다. 다만 하가 실재한 왕조인지, 그보다 앞선 얼리터우 유적을 하로 볼 수 있는지는 같은 때의 문자 자료가 없어 학계 의견이 갈린다. 상은 땅을 하나로 빈틈없이 다스리는 영토 국가라기보다, 왕이 직접 다스린 중심 지역과 복속한 방국들이 느슨하게 이어진 체제였다. 왕은 점을 쳐 조상과 상제의 뜻을 묻고 제사를 올리는 일로 권위를 세웠다. 『사기』 은본기는 탕에서 마지막 왕 제신까지 30명 안팎의 왕을 적는데, 은허 갑골문에 나오는 상 왕의 이름이 이 계보와 대체로 맞아 『사기』가 상 왕실에 관한 믿을 만한 기록을 담았음을 보여 주었다. 상의 청동기는 구리와 주석, 납을 섞는 합금 기술로 만들어졌고, 제사에 쓰는 술잔과 솥에 짐승 무늬를 새긴 것이 많다. 상의 도읍은 자주 옮겨졌고(『서경』 반경편은 상이 도읍을 다섯 번 옮겼다고 말한다), 정저우 상성 역시 기원전 15세기 말에서 14세기 초에는 쇠퇴했다. 이 뒤의 일은 「반경의 은 천도와 은허의 상」(뒤의 사건)에서 이어진다."
  subjects: [shang]
  tags: [politics, culture]
  sources: ["『사기』 은본기", "하상주 단대공정 연표(2000)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)", "Robert L. Thorp, China in the Early Bronze Age: Shang Civilization (University of Pennsylvania Press, 2006)"]

- id: yinxu-1300bc
  year: -1299
  endYear: -1045
  precision: decade
  title:
    ko: "반경의 은 천도와 은허의 상"
  summary:
    ko: "『죽서기년』은 반경이 도읍을 은(殷, 지금 허난성 안양)으로 옮긴 뒤 상이 망할 때까지 도읍을 바꾸지 않았다고 적으며, 하상주 단대공정 연표는 그 시기를 기원전 1300년 무렵으로 본다. 도읍을 옮긴 이유는 황허강의 수해, 왕위를 둘러싼 다툼, 귀족의 세력 등 여러 설이 있다. 은허는 1928년 발굴이 시작된 유적으로, 궁전과 종묘 터, 왕릉으로 보이는 큰 무덤, 청동기와 옥기를 만든 공방이 나왔고 2006년 유네스코 세계유산에 올랐다. 은허에서 나온 약 15만 편의 갑골(거북 배딱지와 소 어깨뼈)에는 왕이 전쟁·제사·사냥·날씨·질병을 점친 내용이 새겨져 있다. 이는 중국에서 문자 체계를 갖춘 가장 이른 기록으로, 글자는 수천 자에 이르고 뜻이 풀린 것은 그 일부이다. 갑골 점복에 나오는 방국(方)의 이름과 전쟁 기록은 상이 서쪽의 강방, 북쪽의 귀방, 동쪽의 인방 같은 이웃과 오래 다퉜음을 보여 준다. 은허에는 제사에 희생으로 바친 사람과 짐승을 묻은 구덩이도 많아 제사 규모가 컸음을 짐작하게 한다. 서쪽의 주(周)도 상에서 보면 이런 방국의 하나였다. 은허 유적이 분포한 범위는 약 30km²에 이른다. 무정(武丁, 단대공정 연표로 재위 기원전 1250~1192 무렵) 때에 가장 번성해 여러 방국을 정벌했고, 무정의 배우자 부호(婦好)의 무덤에서는 청동기 468점과 옥기 700여 점(755점이라는 집계도 있다)이 나왔다. 후모무 큰 솥(옛 이름 사모무)은 무게가 약 832kg으로, 부호의 무덤이 아니라 1939년 안양의 밭에서 따로 나온 상 후기의 대표적인 청동기다. 상 말기의 제을과 제신(주왕)은 동쪽 회이 계통 세력과 오랜 전쟁을 벌여 국력이 소모되었다고 전한다. 이 기록들은 대부분 왕실 의례를 중심으로 하여 상 사회의 평민 생활은 잘 보여 주지 못한다."
  subjects: [shang]
  tags: [culture, politics]
  sources: ["『사기』 은본기", "『죽서기년』", "하상주 단대공정 연표(2000)", "Robert L. Thorp, China in the Early Bronze Age: Shang Civilization (University of Pennsylvania Press, 2006)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: muye-1046bc
  year: -1045
  endYear: -1042
  precision: year
  title:
    ko: "목야 전투와 주의 상 정복(기원전 1046)"
  summary:
    ko: "웨이허강 유역의 주(周)는 문왕(서백 창)이 힘을 키웠고, 문왕이 죽은 뒤(기원전 1050년 무렵) 아들 무왕이 군대를 일으켜 동쪽으로 나아갔다. 『상서』 목서에 따르면 무왕은 용·촉·강·무 같은 서쪽 방국의 병력을 모아 목야(지금 허난성 중북부)에서 맹세했다. 『사기』 주본기는 주의 전차 300승과 병사 수만, 상의 병력 70만이라고 적지만 상의 수는 과장으로 본다. 『춘추좌씨전』은 상의 마지막 왕 제신(주왕)이 동이를 정벌하느라 힘을 소모했다고 전한다. 하상주 단대공정 연표는 이 싸움을 기원전 1046년으로 잡는다. 상군이 무너지자 제신은 녹대에 올라 몸을 불살랐다고 전하며, 상은 이로써 무너졌다. 무왕은 제신의 아들 무경을 은(殷)의 옛 땅에 봉하고 아우 관숙·채숙·곽숙(삼감)에게 지키게 했다. 공신 태공망(여상)은 동쪽 영구에 봉해 제(齊)의 시조가 되었고, 소공 석은 북쪽 연(燕)에 봉해졌다고 전한다(소공 본인은 서쪽에 남고 아들이 연으로 갔다는 견해가 있다). 베이징 팡산 류리허 유적은 초기 연의 중심으로 알려졌다. 무왕은 2~3년 뒤인 기원전 1043년 무렵 세상을 떠났다. 『상서』 목서는 싸움이 갑자일 새벽에 벌어졌다고 적는다. 목야의 위치는 지금 허난성 신샹 둘레나 치현 둘레로 전해지나 정확하지 않다. 무왕은 웨이허강 유역의 풍에서 호경으로 도읍을 옮겨 서쪽을 다스렸고, 상을 완전히 없애지 않고 은 옛 땅에 무경을 두어 상의 제사를 잇게 하는 방식으로 동방을 안정시키려 했다. 이 방식은 곧 삼감의 난으로 이어졌다(뒤의 사건). 목야 전투의 연대는 한 가지로 정해지지 않았고, 기원전 1122년(유흠)이나 기원전 1027년(『죽서기년』 옛 글)으로 보는 설도 있다."
  subjects: [shang, western-zhou, qi-state, yan-state]
  links:
    - { from: western-zhou, to: shang, note: "목야 전투로 상을 무너뜨림(기원전 1046)" }
  tags: [war, politics]
  sources: ["『사기』 주본기", "『사기』 제태공세가", "『사기』 연소공세가", "『상서』 목서", "『춘추좌씨전』", "하상주 단대공정 연표(2000)", "The Cambridge History of Ancient China: From the Origins of Civilization to 221 B.C. (Michael Loewe·Edward L. Shaughnessy 편, Cambridge University Press, 1999)"]

- id: zhougong-fengjian-1042bc
  year: -1041
  endYear: -1029
  precision: year
  title:
    ko: "주공의 섭정과 삼감의 난, 봉건: 낙읍 건설과 제후국 분봉(기원전 1042~1030 무렵)"
  summary:
    ko: "무왕이 죽자 어린 성왕(재위는 단대공정 연표로 기원전 1042~1021)을 대신해 숙부 주공 단이 섭정했다. 이를 두고 관숙·채숙이 주공을 의심해 상의 왕자 무경, 동쪽의 엄·박고·서·회이 같은 세력과 손잡고 난을 일으켰다(삼감의 난). 주공은 동쪽으로 원정해 수년에 걸쳐 난을 눌렀고, 무경은 죽었다. 이어 동쪽 요충에 낙읍(성주, 지금 뤄양)을 세워 상의 유민을 옮기고 동방을 다스리는 거점으로 삼았다. 청동기 하준의 명문에는 '이 중국(中國)에 거처한다'는 구절이 있는데 '중국'이라는 말이 보이는 가장 이른 사례로 알려졌다. 그 뒤 주는 왕의 친족과 공신을 요충에 제후로 봉해 둘레를 지키게 했다. 『춘추좌씨전』 희공 24년은 '친척을 봉건하여 주를 울타리처럼 지켰다'고 적는다. 상의 제사를 이은 송(宋)에는 미자 계가, 당(唐)에는 성왕의 아우 숙우가 봉해졌고, 숙우의 아들 때 나라 이름이 진(晉)으로 바뀌었다고 한다. 제(齊)는 태공망이, 노는 주공의 아들 백금이, 연은 소공 석의 일족이 맡았다. 남쪽 형만 땅에서는 초(楚)의 웅역이 성왕에게 자남의 작위와 땅을 받았다고 하나, 『춘추좌씨전』은 초가 헐벗은 수레를 몰고 풀숲을 개간했다고 하여 중원 제후국과는 처지가 달랐음을 시사한다. 이런 봉건은 천자를 정점으로 한 종법 질서를 이루었다. 연대는 대체로 단대공정 연표를 따랐다. 주공이 왕위를 노렸다고 의심한 관숙·채숙의 시각과 어린 왕을 대신해 나랏일을 맡았다는 전승은 서로 달라, 『상서』의 금등·대고·낙고 같은 글이 주공의 처지를 설명한다(후대에 정리된 글이라 구성에는 논란이 있다). 낙읍은 동방 제후의 조회와 상 유민의 감시를 맡은 동쪽 중심으로, 서주(西周)는 호경과 낙읍 두 도읍을 가졌다."
  subjects: [western-zhou, song-state, jin-chunqiu, qi-state, yan-state, chu-state]
  tags: [politics]
