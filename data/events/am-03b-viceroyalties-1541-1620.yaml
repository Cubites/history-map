# 아메리카 사건 2묶음 갈래 03b: 부왕령의 정착과 북아메리카 식민의 시작 (1541 ~ 1620년)
# 범위: 칠레 정복과 아라우코 전쟁, 신법과 페루 부왕령, 포토시와 톨레도의 개혁·신잉카국의 끝, 중북부 멕시코 은광과 치치메카 전쟁, 포르투갈령 브라질 총독부, 베네수엘라, 차르카스·키토 아우디엔시아, 플로리다, 영국·프랑스·네덜란드의 북아메리카 첫 정착, 누에보멕시코, 유카탄 총사령부(1541~1620 전체).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 1582-10-15 앞은 율리우스력 날짜를 따르는 문서가 많아 월·일은 위키 정보 상자 날짜 그대로 쓰고, 확실하지 않은 날짜는 '무렵'. 영국 쪽 사건은 율리우스력(1752년까지)임을 적었다.
# 이름 규칙: 항목 이름(페루 부왕령·포르투갈령 브라질 등)을 그대로 쓰고 옛 이름(누에바카스티야 총독부·누에바에스파냐 왕국·과테말라 아우디엔시아)은 처음에 항목 이름과 함께 밝혔다. 원주민 사회(마푸체·치치메카·투피·티무쿠아 등)는 항목이 없어 subjects 없이 글로만 썼다.
# 지도 결정과의 관계: 점령·분쟁·원주민 땅·조약선은 일어난 일을 사실대로만 적었다.
# 한국사와 닿는 점: 포토시 은의 태평양 흐름만 「레가스피의 세부 정착과 마닐라 건설(1565~1572)」으로 가리켰다.
# 가리킨 기존 사건: 「레가스피의 세부 정착과 마닐라 건설(1565~1572)」.

- id: valdivia-chile-1541
  year: 1541
  endYear: 1567
  title:
    ko: "발디비아의 칠레 정복과 아라우코 전쟁의 시작(1541~1567)"
  summary:
    ko: "1541년 2월 12일 페드로 데 발디비아는 칠레 중부 산타루시아 언덕 기슭에 산티아고를 세웠다. 이 도시는 그해 9월 11일 원주민 연합군의 공격으로 거의 불탔으나 다시 세워졌다. 그는 누에바카스티야 총독부(1542년부터 페루 부왕령)를 다스리던 프란시스코 피사로의 허가를 받아 1540년 쿠스코에서 남쪽으로 내려온 원정대 지휘자로, 1540년 부총독으로 임명되었고 1541년 산티아고 시의회가 총독으로 추대했으며 1549년 7월 총독 자리를 다시 확인받았다. 그는 1550년 10월 5일 콘셉시온을 세우고 1551~1552년 사이 라임페리알·발디비아 같은 남쪽 도시를 더했으며, 원주민 마을을 엔코미엔다로 나눠 금 채취와 농사에 부렸다. 마푸체 사람들은 이에 맞서 싸웠다. 발디비아의 시종으로 자란 마푸체 청년 라우타로는 스페인식 전술을 익혀 돌아가 1553년 투카펠 전투에서 스페인군을 쳐부쉈고, 발디비아는 1553년 12월 25일 그 싸움 끝에 죽었다. 발디비아가 죽은 뒤 총독 자리는 로드리고 데 키로가(1553년 12월~1555년 2월)와 도시 의회들의 다툼(1555~1556)을 거쳐 프란시스코 데 비야그라(1556년 5월~1557년 4월)에게 넘어갔다. 라우타로는 1557년 4월 말(29일 또는 30일) 마타키토에서 비야그라가 이끈 스페인군의 새벽 기습으로 죽었다. 이 사이 4월 23일 새 총독 가르시아 우르타도 데 멘도사가 라세레나에 상륙해 6월 하순 콘셉시온에 닿았다. 그는 페루 부왕 카녜테 후작 안드레스 우르타도 데 멘도사(1556~1561)의 아들이다. 이 사이 칠레 총독은 페루 부왕과 아우디엔시아의 지휘를 받았다. 1567년 마르틴 루이스 데 감보아가 남쪽 칠로에섬에 카스트로를 세워 스페인의 지배가 섬까지 닿았다. 비오비오강 남쪽 땅은 마푸체가 지켰고 싸움은 1598년 쿠랄라바 전투까지 이어졌다(「쿠랄라바 전투와 일곱 도시의 파괴(1598~1604)」(뒤의 사건)). 아라우코 전쟁은 마푸체의 저항이 스페인 정복을 오래 가로막은 보기로 꼽힌다."
  subjects: [peru-viceroyalty, spain]
  tags: [war, politics]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]
