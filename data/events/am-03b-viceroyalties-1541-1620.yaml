- id: new-laws-1542
  year: 1542
  endYear: 1551
  title:
    ko: "신법과 바야돌리드 논쟁, 페루 부왕령(1542~1551)"
  summary:
    ko: "1542년 11월 20일 스페인 왕 카를로스 1세(카를 5세)는 인디아스의 원주민 대우를 고치려는 신법을 선포했다. 도미니코회 수사 바르톨로메 데 라스 카사스 등이 엔코미엔다 아래의 가혹한 노동과 원주민 인구 감소를 알린 일이 배경이었다. 신법은 원주민을 노예로 삼는 것을 막고, 엔코미엔다를 상속하지 못하게 해 주인이 죽으면 왕에게 돌려주게 했으며, 공납의 한도를 정했다. 이 법과 함께 누에바카스티야 총독부가 페루 부왕령이 되었다. 총독 바카 데 카스트로가 1542년 8월부터 다스린 뒤 첫 부왕 블라스코 누녜스 벨라가 1544년 5월 부임해 신법을 시행하려 했으나 엔코미엔다 주인들이 곤살로 피사로를 앞세워 반발했고, 부왕은 1546년 1월 18일 키토 곁의 아냐키토 전투에서 죽었다. 1547년 4월부터 아우디엔시아 의장 페드로 데 라 가스카가 반란을 누르고 1548년 4월 10일 곤살로 피사로를 처형했다. 왕은 1545년 상속 금지 조항을 이미 거두어들였다. 누에바에스파냐 부왕령에서는 부왕 안토니오 데 멘도사(1535~1550)가 엔코미엔다 주인들의 반발을 고려해 신법의 급한 시행을 미루도록 청했다. 중앙아메리카에서는 과테말라 아우디엔시아(1609년부터 과테말라 총사령부)를 포함하는 '경계 아우디엔시아'가 신법으로 정해져 1543~1544년 자리를 잡았다. 1550~1551년 바야돌리드에서 라스 카사스와 후안 히네스 데 세풀베다가 정복의 정당성을 두고 맞붙었으나 뚜렷한 판정은 나오지 않았다. 신법은 이렇게 시행 과정에서 크게 약해졌지만 원주민 보호를 왕의 책임으로 내세운 포괄적인 법이었다. 라스 카사스는 1542년에 쓴 글을 1552년 『인디아스 파괴에 관한 간략한 보고서』(원제 Brevísima relación de la destrucción de las Indias)로 펴냈다."
  subjects: [peru-viceroyalty, new-spain-viceroyalty, guatemala-captaincy, spain]
  links:
    - { from: spain, to: peru-viceroyalty, note: "1542년 11월 20일 스페인 왕이 부왕령을 설치함" }
  tags: [politics, society]
  sources: ["Lewis Hanke, The Spanish Struggle for Justice in the Conquest of America (University of Pennsylvania Press, 1949)", "Bartolomé de las Casas, Brevísima relación de la destrucción de las Indias (1552)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]

- id: potosi-toledo-1545
  year: 1545
  endYear: 1575
  title:
    ko: "포토시 은광과 톨레도 부왕의 개혁, 빌카밤바 함락(1545~1575)"
  summary:
    ko: "1545년 안데스 고지의 세로리코(부유한 언덕)에서 은이 발견되어 그 기슭에 광산 도시 포토시가 생겼다. 도시 인구는 16세기 말에서 17세기 초에 10만 명을 넘었다는 추산이 있다. 1563년 우앙카벨리카에서 수은이 나오고 1570년대 초 수은 아말감법이 들어오면서 은 생산이 크게 늘었다. 1569년 11월 페루 부왕령의 새 부왕 프란시스코 데 톨레도가 부임했다. 그 앞의 부왕은 안토니오 데 멘도사(1551~1552), 카녜테 후작 안드레스 우르타도 데 멘도사(1556~1561), 니에바 백작 디에고 로페스 데 수니가(1561~1564)였고, 그 사이에는 아우디엔시아 의장들이 대리했는데, 특히 니에바 백작이 죽은 1564년부터 톨레도가 오기 전 1569년까지는 후안 데 사아베드라에 이어 로페 가르시아 데 카스트로가 다스렸다. 톨레도는 흩어진 원주민 마을을 큰 마을로 모으는 레두크시온을 벌이고, 마을마다 성인 남자 일부를 광산으로 보내는 미타를 1573년 체계화했다. 그는 1570~1575년 부왕령을 직접 돌아보는 일반 시찰(비시타 헤네랄)도 벌였다. 7분의 1이라는 설명이 널리 쓰이지만 정확한 숫자는 추산이고, 미타는 광산 사고와 수은 중독으로 많은 사람의 목숨을 빼앗았다. 한편 빌카밤바에는 망코 잉카 유팡키가 세운 신잉카국이 남아 있었다. 망코 잉카의 아들 사이리 투팍과 티투 쿠시가 이어 다스렸고(「망코 잉카 유팡키의 봉기와 신잉카국, 라스살리나스 전투(1536~1538)」(앞의 사건)), 1571년 티투 쿠시가 죽자 형제 투팍 아마루가 뒤를 이었다. 톨레도는 스페인 사절 둘이 죽은 일을 구실로 1572년 4월 14일 전쟁을 선포했고, 6월 24일 스페인군이 빈 빌카밤바에 들어섰다. 붙잡힌 투팍 아마루(만 27세)는 9월 21일 쿠스코로 끌려와 9월 24일 처형되었고, 톨레도가 권한을 넘었다는 비판이 있다. 포토시의 은은 대서양뿐 아니라 태평양을 건너 아시아로도 흘렀다(「레가스피의 세부 정착과 마닐라 건설(1565~1572)」(뒤의 사건))."
  subjects: [neo-inca-state, peru-viceroyalty]
  tags: [economy, politics, war]
  sources: ["Peter Bakewell, Miners of the Red Mountain: Indian Labor in Potosí, 1545–1650 (University of New Mexico Press, 1984)", "John Hemming, The Conquest of the Incas (Harcourt Brace Jovanovich, 1970)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: zacatecas-chichimeca-1546
  year: 1546
  endYear: 1592
  title:
    ko: "사카테카스 은광과 치치메카 전쟁(1546~1592)"
  summary:
    ko: "1546년 9월 8일 후안 데 톨로사가 원주민의 안내로 사카테카스의 세로데라부파 곁에서 은이 많은 광석을 보았다고 전한다. 이 소식이 퍼지자 스페인 사람들이 북쪽으로 몰려와 사카테카스와 그 둘레에 광산 도시가 생겼다. 북쪽에서는 사카테코·과차칠레 같은 치치메카 사람들이 이 길과 마을을 덮쳤고, 스페인 쪽에는 오토미 같은 동맹 원주민이 섰으며 정착민은 광산에서 부릴 노예를 얻으려고 원주민 사냥에 나서 싸움이 번졌다. 치치메카 전쟁은 1550년 무렵부터 1590년대까지 이어졌고, 1561년 말까지 스페인 사람과 원주민 동맹군 4,000명 넘게 죽었다는 추산이 있다. 1574년 도미니코회는 이 전쟁이 스페인의 침략에서 비롯해 부당하다고 밝혔다. 1586년 누에바에스파냐 부왕령의 부왕 알바로 마리케 데 수니가가 변경 군대를 줄이고 도구·식량·옷·땅을 주는 협상에 나섰고, 스페인·과차칠레 혼혈 지휘관 미겔 칼데라가 협상에서 큰 몫을 했다. 이 '평화를 사는' 정책은 1590년 시작되었고, 1591년 부왕 루이스 데 벨라스코 2세(1590~1595, 1550~1564년 부왕의 아들)는 틀락스칼라 가족 400가량을 변경에 보내 마을 여덟을 세우게 했다. 한편 북쪽에서는 1562년 프란시스코 데 이바라가 누에바비스카야로 들어갔고, 1579년 루이스 데 카르바할이 왕과 협약을 맺어 1582년 무렵 누에보레온 왕국의 정착을 시작했으며, 1592년에는 산루이스포토시에서 은광이 열렸다. 남쪽 유카탄에서는 1542년 메리다가 세워지고 1546~1547년 동부의 큰 반란이 진압되면서 정복이 마무리되었다. 이 무렵 부왕은 루이스 데 벨라스코 1세(1550~1564)였고, 아우디엔시아의 대리(1564~1566)와 가스톤 데 페랄타(1566년 10월~1567년 11월)를 거쳐 마르틴 엔리케스 데 알만사(1568~1580)가 맡았다."
  subjects: [new-spain-viceroyalty]
  tags: [economy, war]
  sources: ["Philip Wayne Powell, Soldiers, Indians, and Silver: The Northward Advance of New Spain, 1550–1600 (University of California Press, 1952)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: brazil-governorate-1549
  year: 1549
  endYear: 1554
  title:
    ko: "토메 드 소자의 총독부와 사우바도르, 예수회의 상파울루(1549~1554)"
  summary:
    ko: "포르투갈 왕 주앙 3세는 세습 카피타니아의 혼란을 막으려 브라질에 중앙 총독부를 두기로 하고(「브라질의 세습 카피타니아(1534~1548)」(앞의 사건)) 토메 드 소자를 초대 총독으로 보냈다. 총독은 1549년 3월 말 바이아에 닿아 사우바도르를 세워 포르투갈령 브라질의 첫 수도로 삼았고, 이 도시는 1763년까지 수도였다. 총독의 일은 왕의 재정과 방어, 카피타니아 사이의 조정이었다. 바이아의 카피타니아는 왕이 사들여 왕령으로 삼았다. 이 선단에는 마누엘 다 노브레가가 이끄는 예수회 사제 여섯 명이 함께 있었다. 예수회는 원주민을 모아 마을을 이루고 가톨릭으로 이끄는 일에 나섰고, 이는 원주민을 노예로 부리려는 정착민의 이해와 자주 부딪혔다. 1551년에는 사우바도르에 주교구가 세워졌다. 토메 드 소자는 1553년 5월 두아르트 다 코스타에게 총독을 넘겼고, 다 코스타(1553~1558)는 뒤에 멩 드 사(1558~1572)에게 자리를 넘겼다. 1554년 1월 25일 노브레가와 신부들은 투피 사람들의 땅 피라티닝가 고원에 학교와 선교 마을을 세웠다. 이곳이 뒷날의 상파울루다. 근처 투피니킴의 지도자 티비리사는 예수회와 손을 잡은 원주민으로 알려져 있다. 해안의 투피남바 사람들은 브라질나무 교역으로 프랑스 상인과도 거래하며 포르투갈에 맞섰고, 바이아와 페르남부쿠에서는 사탕수수 제분소(엥제뉴)가 늘어 갔다. 1565년 3월 1일 멩 드 사의 조카 에스타시우 드 사가 리우데자네이루를 세웠고, 멩 드 사가 보낸 증원을 받은 에스타시우가 1567년 1월 20일 싸움에서 프랑스인을 몰아냈다. 해안의 사탕수수 농장은 원주민과 아프리카에서 데려온 노예를 부렸고, 이 노동력의 비중은 시간이 흐르며 아프리카 노예 쪽으로 기울었다."
  subjects: [portuguese-brazil, portugal]
  tags: [politics, society]
  sources: ["Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society: Bahia, 1550–1835 (Cambridge University Press, 1985)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: venezuela-1546
  year: 1546
  endYear: 1568
  title:
    ko: "벨저 양허의 끝과 카라카스·쿠마나, 베네수엘라 주(1546~1568)"
  summary:
    ko: "1528년 카를로스 1세는 독일 아우크스부르크의 은행가 가문 벨저(벨저 가문, 독일어로 클라인베네디히 곧 '작은 베네치아'라 불린 양허)에게 오늘날 베네수엘라 해안을 개발할 양허를 주었다. 황제는 1519년 선출 때 벨저와 푸거 가문의 돈을 쓴 터라 이들에게 큰 빚을 지고 있었다. 벨저 쪽 총독은 암브로시우스 에힝어(1529~1533, 1533년 독화살 상처로 죽음), 니콜라우스 페더만(1533~1535 부총독), 게오르크 호헤무트 폰 슈파이어(1535~1540)에 이어 1540년 12월 필리프 폰 후텐이 총독 겸 사령관이 되었다. 이들은 금을 찾아 내륙을 헤매며 원주민을 잡아 노예로 팔았고, 정착은 거의 이루지 못했다. 진주 채취로 이름난 쿠바구아섬과 마르가리타섬에는 1520년대부터 스페인 정착지가 있었다. 1546년 산토도밍고 아우디엔시아(행정상 누에바에스파냐 부왕령에 속함)가 보낸 후안 데 카르바할이 벨저 쪽 필리프 폰 후텐과 바르톨로메우스 벨저 6세를 처형했다. 양허는 사실상 끝나 왕의 직접 지배로 넘어갔다. 1550년 무렵 산타페데보고타에 아우디엔시아가 설치되었고(페루 부왕령에 속함), 이쪽 서부의 메리다는 1558년 후안 로드리게스 수아레스가 세웠다. 이렇게 베네수엘라는 동쪽과 서쪽이 서로 다른 관할에 놓였다. 동쪽의 카라카스는 1567년 7월 25일 디에고 데 로사다가 세웠다. 이 땅에서는 카라카스 골짜기의 원주민 지도자 과이카이푸로를 비롯한 토착 사회가 오래 맞섰다고 전하며, 과이카이푸로는 1568년 무렵 죽었다고 한다. 1568~1569년 디에고 페르난데스 데 세르파는 쿠마나 일대 누에바안달루시아를 받아 정착을 시도했으나 이내 원주민의 반격을 맞았다."
  subjects: [new-spain-viceroyalty, peru-viceroyalty]
  tags: [politics, economy]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]

- id: charcas-quito-1559
  year: 1559
  endYear: 1564
  title:
    ko: "차르카스·키토 아우디엔시아와 코스타리카 정복(1559~1564)"
  summary:
    ko: "1559년 9월 4일 펠리페 2세는 칙령으로 차르카스 아우디엔시아를 세웠다. 자리는 라플라타(오늘날 수크레)였고 1538년에 세워진 도시로 포토시 은광과 가까웠으며 관할은 차르카스 총독령, 파라과이, 리오데라플라타 총독령에 이르렀으며 포토시 은광도 그 안에 있었다. 첫 의장은 페드로 라미레스 데 키뇨네스(1559~1572)였다. 이 아우디엔시아는 페루 부왕령에 속했고 북쪽으로는 리마, 남쪽으로는 칠레 아우디엔시아와 닿았다. 라플라타 쪽에서는 1553년 산티아고델에스테로, 1561년 멘도사, 1565년 투쿠만 같은 도시가 칠레와 페루 양쪽에서 내려온 정착민의 손으로 생겼다. 산티아고델에스테로는 칠레 쪽에서 프란시스코 데 아기레가, 멘도사는 칠레 총독 가르시아 우르타도 데 멘도사의 명으로 페드로 델 카스티요가 세웠다. 1563년에는 키토 아우디엔시아가 세워져 오늘날의 에콰도르와 남콜롬비아 일부를 맡았다. 같은 때 중앙아메리카에서는 후안 바스케스 데 코로나도가 1562년부터 코스타리카 정복을 이어 받아 1563년 카르타고(코스타리카)를 세웠다. 코스타리카는 과테말라 총사령부(1543년의 과테말라 아우디엔시아가 1609년 총사령부가 됨)에 속했고, 원주민 인구는 정복 뒤 질병과 노역으로 줄었다. 이 무렵 페루 부왕은 니에바 백작 디에고 로페스 데 수니가(1561~1564)였고, 그가 죽은 뒤 후안 데 사아베드라와 로페 가르시아 데 카스트로 같은 아우디엔시아 의장이 대리했다. 차르카스 관할은 오늘날 볼리비아·파라과이·우루과이와 아르헨티나 북부에 걸친 넓은 땅이었다. 이 세 아우디엔시아가 스페인령 남아메리카와 중앙아메리카의 재판과 행정을 나누어 맡았다."
  subjects: [peru-viceroyalty, guatemala-captaincy]
  tags: [politics]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]

- id: st-augustine-1565
  year: 1565
  endYear: 1568
  title:
    ko: "포르 카롤린과 세인트오거스틴 건설(1565~1568)"
  summary:
    ko: "프랑스에서 종교 전쟁이 벌어지던 시기에 위그노(프랑스 개신교도)는 아메리카에서 피난처를 찾았다. 1562년 장 리보는 지금의 사우스캐롤라이나에 샤를포르를 세웠고, 1564년 르네 드 로도니에르가 플로리다 북동부 세인트존스강(그가 '5월의 강'이라 불렀다)가에 포르 카롤린을 세웠다. 플로리다는 1513년 폰세 데 레온의 도착 뒤로 스페인이 청구한 땅이었고(「폰세 데 레온의 플로리다와 발보아의 태평양(1513~1521)」(앞의 사건)) 펠리페 2세는 위그노의 정착을 용납하지 않았고, 원정은 프랑스 개신교 거점을 겨냥한 것이기도 했다. 왕은 해군 지휘관 페드로 메넨데스 데 아빌레스를 플로리다 총독으로 삼아 보냈고, 메넨데스는 1565년 8월 28일 해안을 보고 9월 6~8일 무렵 세인트오거스틴에 상륙해(성 아우구스티누스 축일이 도시 이름이 되었다) 요새를 쌓았다(기록에 따라 날짜가 다르다). 9월 20일 그는 포르 카롤린을 기습해 남자들을 죽이고 산마테오로 이름을 바꾸었다. 폭풍에 밀려 해안에 닿은 리보와 프랑스인 150~350명(자료마다 갈린다)은 마탄사스 하구에서 항복했으나 거의 모두 처형되었다. 이 일로 스페인령 플로리다는 지금의 미국 땅에서 이어져 온 가장 오래된 유럽인 도시 세인트오거스틴을 얻었다. 포르 카롤린에는 그해 8월 리보의 증원 함대가 닿았으나 폭풍을 만났고, 1566년에는 예수회의 선교가 시작되었다. 1568년 도미니크 드 구르그가 프랑스인 병력을 이끌고 와 산마테오를 무너뜨렸고, 그 보복으로 스페인 군인들이 처형되었다. 지역 원주민 티무쿠아 사람들은 프랑스와 스페인 사이에서 동맹과 적대를 오가며 영향을 받았다."
  subjects: [spanish-florida, france]
  tags: [war, politics]
  sources: ["Michael Gannon, The Cross in the Sand: The Early Catholic Church in Florida, 1513–1870 (University of Florida Press, 1965)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]
  places: [{ name: 세인트오거스틴, at: [-81.31, 29.89], year: 1565 }]

- id: drake-1577
  year: 1577
  endYear: 1580
  title:
    ko: "드레이크의 세계 일주와 스페인령 아메리카 습격(1577~1580)"
  summary:
    ko: "잉글랜드 왕국의 선장 프랜시스 드레이크는 이미 1572~1573년 파나마의 놈브레데디오스를 습격하고, 스페인 쪽에서 도망친 노예의 후손인 시마론 사람들의 도움으로 1573년 4월 1일 은을 실은 노새 행렬을 덮쳤다. 스페인 쪽은 이런 사략 행위를 해적질로 보았고 잉글랜드 쪽은 여왕 엘리자베스 1세가 후원한 전쟁의 일부로 보았다. 1577년 12월 13일(율리우스력) 드레이크는 골든하인드호를 포함한 함대를 이끌고 플리머스를 떠나 1578년 9월 마젤란 해협을 지나 태평양으로 들어갔다. 그 사이 7월 2일 항해에 동행한 토머스 더티를 반역죄로 처형했다. 스페인은 태평양 쪽 해안을 거의 방어하지 않았기에 그는 칠레 발파라이소와 페루 해안의 항구를 털고, 1579년 초 카야오 앞바다에서 은 수송선 카카푸에고호를 붙잡았다. 이 배가 실은 은과 금은 막대한 값이었다(정확한 값은 자료마다 다르다). 그는 북쪽으로 올라가 1579년 6월 5일 북아메리카 서해안에 처음 닿았고 6월 17일 보호된 만에 내려 그곳을 뉴앨비언이라 불러 잉글랜드 땅으로 선언했으나 정확한 상륙 지점은 학설이 갈린다. 그곳 원주민과 교류했다고 전한다. 1579년 7월 23일 이곳을 떠나 태평양과 인도양을 건너 1580년 9월 26일 플리머스로 돌아왔는데, 출발한 다섯 척 가운데 돌아온 배는 골든하인드호 한 척뿐이었다. 그는 1581년 4월 4일 기사 작위를 받았다. 1585~1586년에는 카리브해로 돌아가 산토도밍고와 카르타헤나를 공격하고 1586년 6월 6일 세인트오거스틴을 불태웠다(「포르 카롤린과 세인트오거스틴 건설(1565~1568)」(앞의 사건)). 이 습격들은 스페인과 잉글랜드의 전쟁으로 이어졌다(「스페인 무적함대의 패배」(뒤의 사건))."
  subjects: [england, spain]
  tags: [war, economy]
  sources: ["Harry Kelsey, Sir Francis Drake: The Queen's Pirate (Yale University Press, 1998)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]
  places: [{ name: 뉴앨비언 상륙지(학설 갈림), at: [-124.39, 43.31], year: 1579 }]

- id: iberian-union-1580
  year: 1580
  endYear: 1640
  title:
    ko: "이베리아 연합과 아메리카 식민지(1580~1640)"
  summary:
    ko: "1580년 포르투갈 왕가가 끊기자 스페인의 펠리페 2세가 포르투갈 왕위를 이었다(유럽 쪽 일은 「스페인 무적함대의 패배」(뒤의 사건)가 이어서 다룬다). 1581년 토마르 의회가 그를 포르투갈 왕으로 받아들였다. 이로써 한 왕이 스페인령 아메리카와 포르투갈령 브라질을 함께 다스렸지만 두 나라의 기관과 법은 따로 두었고, 토르데시야스 조약의 경계선도 행정상 그대로 있었다. 이 시기 브라질에서는 사탕수수 농장과 앙골라에서 온 아프리카 노예의 수입이 늘어 유럽에 설탕을 가장 많이 대는 곳이 되었고, 포르투갈 사람들은 토르데시야스 선 서쪽의 아마존 하구로도 나아가 1616년 벨렝을 세웠으며 포르투갈 상인들은 스페인령 아메리카와 무역할 길을 넓혔다. 1595년 1월 30일 포르투갈 상인 페드루 고메스 헤이넬이 스페인 식민지에 노예를 공급하는 독점 계약인 아시엔토를 맡아 1601년까지 이어 갔고, 이 계약은 그 뒤에도 포르투갈 상인들의 손에 놓였다가 1640년 포르투갈의 반란으로 한 시기가 끝났다. 같은 때 후안 데 가라이는 1580년 라플라타강가에 부에노스아이레스를 다시 세웠고, 이 항구는 포토시 은과 밀수 무역의 통로로 자라났다. 포르투갈계 상인 가운데는 개종한 유대인의 후손이 많았고 리마의 종교 재판소는 1635년에 이들을 크게 단속했다. 스페인이 포르투갈 왕을 겸하자 스페인의 적이던 네덜란드와 잉글랜드, 프랑스가 포르투갈령 아프리카·아시아·브라질을 공격할 구실을 얻었다. 포르투갈은 스페인의 전쟁에 끌려 들어갔고 식민지 방어가 약해졌다는 불만이 쌓였다. 1640년 12월 1일 리스본의 반란으로 연합은 끝났다(「카탈루냐 반란과 포르투갈의 독립 회복」(뒤의 사건))."
  subjects: [spain, portugal]
  tags: [politics, economy]
  sources: ["Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society: Bahia, 1550–1835 (Cambridge University Press, 1985)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: roanoke-1584
  year: 1584
  endYear: 1590
  title:
    ko: "로어노크 식민지(1584~1590)"
  summary:
    ko: "1584년 3월 25일(율리우스력) 엘리자베스 1세는 월터 롤리에게 아직 유럽인이 차지하지 않은 땅에 식민지를 세울 특허장을 주었다. 롤리가 보낸 탐사대는 4월 27일 잉글랜드를 떠나 7월 13일 오늘날 노스캐롤라이나 해안에 닿았고, 원주민 두 사람 만테오와 완체세를 데리고 돌아왔다. 땅은 '처녀 여왕'을 기려 버지니아라 불렸다. 롤리는 이복형 험프리 길버트가 1583년 뉴펀들랜드를 청구하고 돌아오다 숨지자 그 특허를 이어받은 사람이었다. 1585년 4월 9일 플리머스를 떠난 랠프 레인의 첫 정착 집단이 로어노크섬에 자리 잡았다. 이들은 식량을 원주민 지도자 윙기나의 마을에 기댔고, 관계가 나빠지자 1586년 6월 레인의 부하들이 윙기나를 죽였다. 그때 마침 드레이크의 함대가 들러 정착민을 태워 잉글랜드로 돌아갔다(「드레이크의 세계 일주와 스페인령 아메리카 습격(1577~1580)」(앞의 사건)). 1587년 존 화이트가 이끈 둘째 집단은 여자와 아이를 포함한 100여 명으로, 7월 25일 섬에 내렸고 8월 18일 화이트의 손녀 버지니아 데어가 영국인 부모에게서 아메리카에서 처음 태어난 아이가 되었다. 화이트는 식량을 구하려 8월 27일 잉글랜드로 떠났으나 1588년 스페인과의 전쟁(「스페인 무적함대의 패배」(뒤의 사건)) 때문에 한동안 돌아가지 못했다. 1590년 8월 18일 그가 돌아와 보니 정착지는 비어 있었고 기둥에 '크로아토안'이라는 글자가 새겨져 있었다. 크로아토안은 원주민이 사는 섬의 이름이었다. 정착민이 어디로 갔는지는 지금도 확실하지 않으며 원주민과 섞여 살았을 가능성이 거론된다. 잉글랜드의 다음 영구 정착 시도는 1607년 제임스타운이 된다(「제임스타운과 포우하탄 연맹(1607~1614)」(뒤의 사건))."
  subjects: [england]
  tags: [society, politics]
  sources: ["David Beers Quinn, Set Fair for Roanoke: Voyages and Colonies, 1584–1606 (University of North Carolina Press, 1985)", "Alan Taylor, American Colonies (Viking, 2001)"]
  places: [{ name: 로어노크섬 정착지, at: [-75.7, 35.94], year: 1587 }]

- id: guayana-1591
  year: 1591
  endYear: 1596
  title:
    ko: "베리오의 과야나 원정과 롤리의 엘도라도(1591~1596)"
  summary:
    ko: "1580년대 안토니오 데 베리오는 곤살로 히메네스 데 케사다의 조카딸과 혼인해 그의 엘도라도 탐험권을 이어받은 뒤 산타페데보고타 아우디엔시아(페루 부왕령 소속)에서 출발해 오리노코강 쪽을 몇 차례 탐사했다. 그는 1580년부터 트리니다드섬 총독이기도 했다. 그는 1584년 1월 1일 첫 원정을 떠나 이듬해 보고타로 돌아왔고, 1587년부터 두 해 넘게 두 번째 원정을 했으며, 1590년 세 번째 원정에서 오리노코강을 따라 내려가 카로니강에 이르렀다. 1591년 3월 그는 마르가리타섬으로 가 사람과 물자를 모았고, 이 무렵 오리노코 하류에 산토토메데과야나 요새가 세워졌다. 엘도라도는 마노아라는 황금 도시가 있다는 소문에서 나온 말로(본래는 보고타 고원 무이스카 지도자가 구아타비타 호수에서 금가루를 몸에 바르고 치른 의식 이야기에서 비롯했다), 원주민이 먼 땅의 이야기를 들려주자 유럽인이 이를 황금 나라로 받아들인 것으로 보인다. 이런 소문은 16세기 내내 안데스 북부에서 새 원정을 불렀다. 오리노코 유역에는 아라와크와 카리브계 여러 사회가 살았고 베리오의 원정은 이들에게 노예 사냥과 질병의 피해를 가져왔다. 1595년 4월 월터 롤리가 이끄는 잉글랜드 함대가 트리니다드섬의 산호세데오루냐를 점령하고 베리오를 붙잡았다. 베리오는 6월 말 쿠마나 가까이에서 포로 교환으로 풀려났다. 롤리는 오리노코를 거슬러 올라가 탐사했으나 황금 도시를 찾지 못했고, 1596년 『기아나의 발견』을 펴내 이곳이 부유한 제국이라 선전했다. 이 책은 영국에서 기아나에 대한 관심을 부추겼다. 베리오는 1597년 산토토메데과야나에서 아들 페르난도가 증원군과 닿은 며칠 뒤 숨졌다."
  subjects: [peru-viceroyalty]
  tags: [politics, society]
  sources: ["John Hemming, The Search for El Dorado (Michael Joseph, 1978)", "Walter Raleigh, The Discoverie of the Large, Rich, and Bewtiful Empyre of Guiana (1596)", "J. H. Elliott, Empires of the Atlantic World (Yale University Press, 2006)"]

- id: new-mexico-1598
  year: 1598
  endYear: 1610
  title:
    ko: "오냐테의 누에보멕시코 원정과 아코마, 산타페(1598~1610)"
  summary:
    ko: "1595년 9월 21일 누에바에스파냐 부왕령의 부왕 루이스 데 벨라스코(2세)가 후안 데 오냐테와 리오그란데 상류의 땅을 차지해 식민지를 세우라는 계약을 맺었고, 그해 11월 부임한 후임 부왕 몬테레이 백작 가스파르 데 수니가가 1596년 5월 조건을 고쳐 출발이 1598년으로 늦어졌다. 오냐테는 1598년 3월 수백 명의 정착민과 가축을 이끌고 북쪽으로 떠나 4월 말 리오그란데를 건넜고, 4월 30일 건너편 땅을 스페인 왕의 이름으로 청구했다. 일행에는 프란치스코회 수사들이 함께했고, 1600년 거점은 산가브리엘로 옮겨졌다. 그곳은 이미 테와·케레스·주니·호피처럼 서로 다른 말을 쓰는 푸에블로 사람들이 오래 농사를 지으며 살던 땅이었다. 오냐테는 테와 사람들의 마을 오카이 오윙에를 산후안데로스카바예로스로 이름 바꾸어 첫 거점으로 삼았다. 푸에블로 사람들에게는 공납과 노동이 요구되었다. 1598년 12월 4일 아코마 푸에블로에서 충돌이 일어나 오냐테의 조카 후안 데 살디바르를 포함한 스페인 사람 열두 명 안팎(자료마다 12~14명)이 죽었다. 1599년 1월 오냐테는 보복으로 후안의 형제 비센테 데 살디바르에게 아코마를 공격하게 했고(총공격은 1월 22일 시작) 아코마 사람 800명가량이 죽었다는 추산이 있다(자료마다 갈린다). 살아남은 이들은 20년의 노역을 선고받았고, 발을 자르는 형벌이 실제로 있었는지는 최근 연구가 의문을 제기한다. 1606년 오냐테는 멕시코시티로 불려 가 사임했고 원주민과 정착민에 대한 가혹함을 이유로 유죄를 받아 뉴멕시코에서 추방되었다(판결 시기는 자료마다 갈린다). 1610년 무렵 후임 총독 페드로 데 페랄타가 산타페를 세워 수도로 삼았다(1607년 무렵 계획했다는 기록도 있다). 이 지방은 누에바에스파냐 부왕령의 북쪽 끝 변경으로 남았다. 산타페는 지금도 미국에서 가장 오래된 주 수도로 꼽힌다."
  subjects: [new-spain-viceroyalty]
  tags: [politics, war, society]
  sources: ["Marc Simmons, The Last Conquistador: Juan de Oñate and the Settling of the Far Southwest (University of Oklahoma Press, 1991)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]
  places: [{ name: 아코마 푸에블로, at: [-107.57, 34.9], year: 1599 }]

- id: curalaba-1598
  year: 1598
  endYear: 1604
  title:
    ko: "쿠랄라바 전투와 일곱 도시의 파괴(1598~1604)"
  summary:
    ko: "1598년 12월 23일 칠레 총독 마르틴 가르시아 오녜스 데 로욜라는 앙골에서 가까운 쿠랄라바에서 마푸체 지도자 펠란타로가 이끄는 마푸체 전사 600명가량의 기습을 받았다. 마푸체 사회는 왕 없이 마을 연합이 전쟁 때만 총사령인 토키를 뽑는 구조였고 펠란타로는 그런 토키였다. 총독 곁에는 스페인 병사 50명과 원주민 보조병 300명이 있었는데 스페인 사람은 두 명을 빼고 모두 죽었고 보조병 대부분도 죽었다. 칠레 총독이 마푸체에게 죽은 것은 이때가 두 번째였다(첫 번째는 1553년 발디비아, 「발디비아의 칠레 정복과 아라우코 전쟁의 시작(1541~1567)」(앞의 사건)). 이 승리로 마푸체의 반격이 남쪽 전역으로 번져 1599~1604년 사이 산타크루스데코야·앙골·발디비아·라임페리알·비야리카·오소르노 같은 남쪽 도시가 포위되거나 버려졌고, 일곱 도시가 무너졌다는 말이 전한다(어느 도시를 일곱으로 꼽는지는 자료마다 다르다). 총독이 죽은 뒤 페드로 데 비스카라가 임시로 맡았고(1598년 12월~1599년 5월), 1599년 5월 프란시스코 데 키뇨네스가 총독으로 증원을 이끌고 왔으나 남쪽 정착지의 파괴를 막지 못했다. 이때 페루 부왕령의 부왕은 루이스 데 벨라스코(1596~1604)로, 1590~1595년 누에바에스파냐 부왕을 지낸 같은 사람이다. 스페인 정착민 가운데 많은 이가 포로가 되거나 죽었고, 이후 비오비오강이 스페인과 마푸체의 사실상 경계가 되었다. 스페인 왕은 칠레 방어를 위해 1604년 무렵 아라우코 상비군을 만들었는데 이것은 아메리카의 스페인령에서 드문 직업 군대였다. 마푸체는 1883년까지 독립을 지켰다. 스페인은 1641년 킬린 의회에서 사실상 이 경계를 인정하게 된다(「킬린 의회와 마푸체 아라우카니아, 발디비아 재건(1641~1647)」(뒤의 사건))."
  subjects: [peru-viceroyalty, spain]
  tags: [war]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)"]
  places: [{ name: 쿠랄라바 전투, at: [-72.88, -37.92], year: 1598 }]

- id: acadia-1604
  year: 1604
  endYear: 1613
  title:
    ko: "생트크루아섬과 포르루아얄: 아카디아의 시작(1604~1613)"
  summary:
    ko: "1603년 프랑스 왕 앙리 4세는 피에르 뒤가 드 몽에게 세인트로런스강 남쪽 땅을 '라카디'라 부르며 모피 교역을 독점할 특허를 주었다. 1604년 드 몽과 사뮈엘 드 샹플랭이 이끈 가톨릭과 위그노(프랑스 개신교도)가 섞인 약 80명이 지금의 캐나다와 미국 사이 세인트크로이강 하구의 생트크루아섬에서 겨울을 보내다 괴혈병으로 절반 가까이 죽었다고 한다. 샹플랭은 1604~1607년 해안을 측량해 지도를 남겼다. 이듬해 1605년 정착지는 펀디만 건너편 포르루아얄로 옮겨 아카디아의 첫 수도가 되었다. 이 땅의 주인은 미크맥 사람들이었고 그들의 지도자 멤베르투는 프랑스인과 교역하며 동맹을 맺었다. 미크맥은 16세기 어부와 모피 상인을 통해 이미 유럽 물건과 거래하고 있었다. 1607년 앙리 4세는 비용 대비 수입이 적다는 이유로 드 몽의 독점을 거두었고 8월에 프랑스 정착민이 포르루아얄을 떠나며 미크맥에게 건물을 맡겼다. 1610년 장 드 비앵쿠르 드 푸트랭쿠르가 돌아와 건물이 그대로 있음을 보았고, 이 무렵 멤베르투는 가톨릭 세례를 받았다. 1613년에는 잉글랜드 버지니아에서 온 새뮤얼 아걸이 이끄는 함대가 아카디아의 프랑스 거점을 공격해 불태웠다. 이 일은 영국과 프랑스가 북아메리카 동북 해안을 두고 겨루는 오랜 싸움의 시작이었다. 아카디아는 뒤에 영국과 번갈아 점령되다가 1713년 위트레흐트 조약으로 영국에 넘어간다(「앤 여왕 전쟁과 위트레흐트 조약의 북아메리카: 아카디아에서 노바스코샤로(1701~1714)」(뒤의 사건)). 같은 샹플랭이 1608년 더 서쪽에 세운 퀘벡(「샹플랭의 퀘벡 건설(1608~1615)」(뒤의 사건))이 누벨프랑스의 중심이 된다."
  subjects: [acadia, france]
  tags: [politics, society]
  sources: ["Naomi E. S. Griffiths, From Migrant to Acadian: A North American Border People, 1604–1755 (McGill-Queen's University Press, 2005)", "Alan Taylor, American Colonies (Viking, 2001)"]
  places: [{ name: 포르루아얄 정착지, at: [-65.62, 44.7], year: 1605 }]

- id: jamestown-1607
  year: 1607
  endYear: 1614
  title:
    ko: "제임스타운과 포우하탄 연맹(1607~1614)"
  summary:
    ko: "1606년 4월 잉글랜드 왕 제임스 1세는 런던의 버지니아 회사에 아메리카 식민의 특허장을 내렸다. 회사의 배 세 척 수전콘스턴트호·갓스피드호·디스커버리호는 그해 12월 런던을 떠나 1607년 4월 26일(율리우스력) 체서피크만 입구 케이프헨리에 닿았고, 5월 14일(율리우스력 5월 4일) 제임스강가에 요새를 세웠다. 정착민은 남자와 소년 104명으로, 대부분 신사와 장인이어서 농사에 서툴렀다. 이것이 잉글랜드 왕국이 아메리카에 처음으로 세워 이어 간 정착지 제임스타운이다. 이 땅은 포우하탄 연맹의 땅이었다. 포우하탄(와훈세나카)은 30여 부족을 거느린 지도자였고 정착민은 교역과 식량에서 그에게 기댔다. 1608년 존 스미스가 의장이 되어 '일하지 않는 자는 먹지 말라'고 규율을 세웠으나 1609년 가을 부상으로 돌아갔다. 1609~1610년 겨울의 '굶주림의 시기'에 정착민의 대부분이 굶거나 병들어 죽어 60명 안팎만 남았다고 전한다. 1610년 6월 10일 새 총독 델라웨어 경(토머스 웨스트)이 도착해 철수하려던 사람들을 붙잡았다. 이어 토머스 데일의 엄격한 규율 아래 1610~1614년 제1차 영국-포우하탄 전쟁이 벌어졌고, 1613년 포우하탄의 딸 포카혼타스가 붙잡혔다. 1614년 4월 그녀는 존 롤프와 혼인했고 이 혼인은 평화를 가져왔다. 롤프는 1612년께 서인도의 담배 품종을 심기 시작해 이를 수출 작물로 키웠고, 담배는 식민지를 살린 돈줄이 되었다. 포카혼타스는 1617년 영국에서 숨졌다. 이 식민지는 뒷날 버지니아 식민지가 되고(「버지니아 하원과 첫 아프리카인, 왕령 식민지로(1619~1624)」(뒤의 사건)) 담배 농장의 노동력 수요가 노예제의 바탕이 되었다."
  subjects: [virginia-colony, england]
  links:
    - { from: england, to: virginia-colony, note: "1607년 5월 제임스타운에 정착지를 세움" }
  tags: [politics, society]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Helen C. Rountree, Pocahontas, Powhatan, Opechancanough: Three Indian Lives Changed by Jamestown (University of Virginia Press, 2005)"]
  places: [{ name: 제임스타운, at: [-76.78, 37.21], year: 1607 }]

- id: quebec-1608
  year: 1608
  endYear: 1615
  title:
    ko: "샹플랭의 퀘벡 건설(1608~1615)"
  summary:
    ko: "1608년 7월 3일 사뮈엘 드 샹플랭은 세인트로런스강이 좁아지는 곳(알곤킨어로 '강이 좁아지는 곳'을 뜻하는 말에서 퀘벡이라는 이름이 왔다)에 모피 교역소와 숙소 '아비타시옹'을 세웠다. 이는 아카디아에서 겪은 일(「생트크루아섬과 포르루아얄: 아카디아의 시작(1604~1613)」(앞의 사건)) 뒤 더 안쪽 강가에 자리를 잡은 것으로, 오랫동안 누벨프랑스 캐나다의 중심 도시가 되었다. 첫 겨울에 괴혈병과 이질로 정착민 28명 가운데 대다수가 죽었다고 전한다. 샹플랭은 모피를 얻으려고 세인트로런스 유역의 원주민 사회와 동맹을 맺었다. 그는 휴런(와덴트), 알곤킨, 몽타녜(이누) 사람들과 손잡았고, 1609년 7월 29~30일 지금의 샹플랭호 일대에서 이들과 함께 이로쿼이 연맹(하우데노사우니)의 전사들과 싸워 화승총으로 이겼다. 이 일은 이로쿼이 연맹과 프랑스의 오랜 적대를 낳았다. 1610년 그는 청년 에티엔 브륄레를 휴런 땅에 보내 말과 풍습을 익히게 했고, 1613년에는 오타와강을 탐사했다. 1615년 봄 샹플랭은 레콜렉회 수사 네 명과 함께 돌아와 휴런 사이의 선교를 시작했고, 그해 9월 1일 휴런 마을 카이아게에서 이로쿼이 연맹을 치는 군사 행동에 나섰으나 크게 이기지 못하고 겨울을 휴런 땅에서 보냈다. 샹플랭은 1612년 콩데 공의 부왕 대리가 되어 식민지 일을 맡았다. 퀘벡의 정착민은 매우 적었고 1630년대에도 수백 명에 못 미쳤다. 프랑스 왕은 모피 교역권을 회사에 맡기고 대신 정착민을 보낼 것을 요구했으나 이 의무는 오래 지켜지지 못했다. 누벨프랑스는 모피 교역 중심의 작은 식민지로 자랐고, 농사를 지을 사람이 늘어난 것은 17세기 중반 이후다."
  subjects: [new-france-canada, france]
  tags: [politics, society]
  sources: ["Samuel de Champlain, Les Voyages du Sieur de Champlain Xaintongeois (1613)", "Alan Taylor, American Colonies (Viking, 2001)"]
  places: [{ name: 퀘벡 건설, at: [-71.2, 46.81], year: 1608 }]

- id: hudson-cupids-1609
  year: 1609
  endYear: 1614
  title:
    ko: "허드슨의 항해와 쿠퍼스 코브, 뉴네덜란드의 상관(1609~1614)"
  summary:
    ko: "잉글랜드 선장 헨리 허드슨은 1609년 네덜란드 동인도 회사의 배 할베마인호를 타고 4월 4일 암스테르담을 떠나 북동쪽 항로를 찾다 뜻을 바꿔 서쪽으로 가서 9월 3일 오늘날 허드슨강 하구에 닿았다. 그는 9월 12일 레나페 사람들의 카누와 만나 굴과 콩을 바꾸었고, 9월 12~22일 무렵 강을 거슬러 올랐다. 이 항해는 네덜란드 공화국이 이 땅을 청구하고 모피 교역을 시작하는 바탕이 되었다. 허드슨은 귀로에 잉글랜드 다트머스에서 억류되었다. 이보다 앞서 허드슨은 1607년 5월 1일 무스코비 회사의 호프웰호로, 1608년 4월 22일 다시 같은 배로 북쪽 항로를 찾아 떠났다가 1608년 8월 26일 돌아온 적이 있다. 이듬해 1610년 그는 잉글랜드 후원자들의 배 디스커버리호를 타고 다시 북서쪽으로 가 8월 2일 허드슨만에 들어갔다. 배는 겨울에 제임스만에서 얼음에 갇혔고, 1611년 6월 선원들이 반란을 일으켜 허드슨과 아들, 그 밖의 일곱 명을 작은 배에 태워 바다에 내버렸다. 이들은 다시 보이지 않았다. 같은 1610년에 존 가이가 뉴펀들랜드 회사의 정착민을 이끌고 쿠퍼스 코브(지금의 쿠피드)에 닿았다. 이곳은 영국이 지금의 캐나다 땅에 세워 끊기지 않고 이어진 정착지 가운데 가장 오래된 곳으로 꼽힌다. 그 섬에는 베오투크 사람들이 살았고, 어부와 정착민의 충돌은 뒷날 이들의 쇠퇴로 이어졌다. 뉴네덜란드에서는 1614년 네덜란드 의회가 뉴네덜란드 회사에 교역 특허를 주었고, 상인들이 허드슨강 상류 올버니 근처에 나사우 요새를 세웠다. 아드리안 블록은 롱아일랜드 해협을 탐사했다. 이 상관은 레나페와 모히칸, 모호크 사람들과의 모피 교역에 기대었다."
  subjects: [newfoundland, new-netherland, england, dutch-republic]
  tags: [economy, politics]
  sources: ["Peter C. Mancall, Hakluyt's Promise (Yale University Press, 2007)", "Russell Shorto, The Island at the Center of the World (Doubleday, 2004)", "Alan Taylor, American Colonies (Viking, 2001)"]
  places: [{ name: 허드슨강 하구, at: [-74.04, 40.69], year: 1609 }, { name: 쿠퍼스 코브, at: [-53.2, 47.55], year: 1610 }]

- id: yucatan-sonora-1614
  year: 1614
  endYear: 1617
  title:
    ko: "유카탄 총사령부의 분리와 소노라 선교(1614~1617)"
  summary:
    ko: "유카탄은 1617년 총독이 총사령관을 겸하는 총사령부로 올라섰다. 앞서 이곳은 멕시코 아우디엔시아의 재판 아래 놓인 지방 총독령으로, 1527년부터 몬테호 부자가 이끈 정복의 땅이었다. 마야 사람들은 엔코미엔다 아래 면포·밀랍·옥수수를 공납으로 바치고 전염병으로 인구가 크게 줄었지만 마을 공동체와 마야어는 오래 이어졌으며, 1562년 프란치스코회 지방 장관 디에고 데 란다는 마니에서 마야 서적과 신상을 불태우는 종교 재판을 열었다. 한편 이 땅은 누에바에스파냐 부왕령에 머물러 부왕(1612~1621년의 디에고 페르난데스 데 코르도바, 과달카사르 후작)의 감독을 받았다. 총사령부가 된 뒤에도 재판 항소는 멕시코 아우디엔시아가 맡았다. 총사령부의 중심은 메리다였고 이곳에는 스페인 사람과 메스티소, 마야 사람이 함께 살았다. 총사령부의 목적은 카리브해 해안의 방어를 맡기는 것이었고, 총독이 군사 문제에서 독자성을 얻었다. 그러나 유카탄 남쪽 페텐에는 이차 마야 왕국이 1697년까지 독립을 지켰다. 같은 시기 서북쪽 소노라 쪽에서는 예수회가 1591년 7월 곤살로 데 타피아와 마르틴 페레스가 시날로아에 들어간 것을 시작으로 북쪽으로 나아갔고, 1614년 마요강 유역의 마요 사람들 사이에 선교 마을을 열었으며(첫 선교는 1613년이라는 자료도 있다) 1617년에는 더 북쪽 야키강 유역의 야키 사람들 사이로 들어갔다(첫 선교 자리와 해는 자료마다 조금 다르다). 이 선교 마을은 은광이 아니라 원주민을 모아 가톨릭과 농사로 이끄는 방식이었고, 부왕령 북서 변경의 지배를 넓혔다. 두 일은 누에바에스파냐 부왕령의 북쪽과 남쪽 끝이 서로 다른 방식으로 굳어 간 모습을 보여 준다."
  subjects: [yucatan-captaincy, new-spain-viceroyalty]
  tags: [politics, society]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Nancy M. Farriss, Maya Society under Colonial Rule (Princeton University Press, 1984)", "Edward H. Spicer, Cycles of Conquest (University of Arizona Press, 1962)"]

- id: virginia-assembly-1619
  year: 1619
  endYear: 1624
  title:
    ko: "버지니아 하원과 첫 아프리카인, 왕령 식민지로(1619~1624)"
  summary:
    ko: "회사 재무관 에드윈 샌디스가 개혁을 이끌던 1619년 7월 30일 버지니아 식민지 총독 조지 예들리는 제임스타운섬의 새 목조 교회에서 식민지 총회를 열었다. 열한 지역에서 둘씩 뽑힌 의원 22명이 총독과 회사가 임명한 평의회와 함께 앉았고, 이것이 버지니아 하원이다. 모임은 말라리아로 닷새 만에 끝났고, 원주민과의 관계와 담배 값 같은 지방 문제를 다루었다. 회사는 1618년 이주를 늘리려고 일정 규모의 땅을 주는 방식을 내놓았고, 총회에 앞서 폴란드 장인들은 처음 투표권을 받지 못하자 일손을 멈추었고, 회사는 7월 21일 이들에게 다른 정착민과 같은 자유 신분(투표권)을 주기로 했다. 같은 8월 영국 사략선이 포르투갈 노예선에서 빼앗은 아프리카인 20여 명(앙골라 출신으로 전한다)을 포인트컴포트에 내려 식량과 바꾸었다. 이들이 노예였는지 계약 하인에 가까웠는지는 학설이 갈리며, 아프리카인의 신분이 종신 노예로 법에 굳어진 것은 17세기 중엽이다. 담배 재배가 번지며 식민지는 노동력을 더 필요로 했다. 1622년 4월 1일(율리우스력 3월 22일) 포우하탄 연맹의 지도자 오페찬카노가 이끈 공격으로 정착민 340~400명 가까이가 죽었고(자료마다 갈린다) 이어 전염병과 총독·평의회의 독단이 이어졌다. 1607~1624년에 건너온 약 6,000명 가운데 1624~1625년에 살아 있던 사람은 1,200명가량이라는 추산이 있다(자료마다 갈린다). 1624년 왕은 버지니아 회사의 헌장을 거두어 식민지를 국왕이 총독과 평의회를 임명하는 왕령 식민지로 삼았다. 그래도 하원은 사라지지 않고 이어져, 영국 식민지에서 대표를 선출하는 의회의 선례가 되었다(「제임스타운과 포우하탄 연맹(1607~1614)」(앞의 사건)). 잉글랜드 왕국은 이 식민지에서 담배 관세를 얻었다."
  subjects: [virginia-colony, england]
  tags: [politics, society]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Edmund S. Morgan, American Slavery, American Freedom (W. W. Norton, 1975)"]

- id: mayflower-1620
  year: 1620
  endYear: 1627
  title:
    ko: "메이플라워 서약과 플리머스 식민지(1620~1627)"
  summary:
    ko: "1620년 가을 잉글랜드 왕국의 국교회에서 갈라선 분리파 신자들(뒷날 필그림이라 불렸다)과 다른 이주민(분리파가 아닌 사람들은 스트레인저스라 불렸다)을 태운 메이플라워호는 승객 102명(항해 중 한 명이 죽고 한 명이 태어나 도착했을 때도 같은 수였다)을 싣고 대서양을 건넜다. 원래 허드슨강 쪽으로 가려 했으나 11월 21일(율리우스력 11월 11일) 케이프코드 끝의 프로빈스타운 항구에 닻을 내렸다. 그 땅은 버지니아 회사 특허장의 범위 밖이어서 배 안의 남자 41명이 같은 날 메이플라워 서약에 서명해 스스로 법과 직책을 정해 따르기로 했다. 이 서약은 왕에 대한 충성을 유지한 채 공동체를 세운다는 약속이었다. 이들이 12월에 내린 플리머스 일대는 원래 파투섯이라는 왐파노아그 마을이 있던 땅으로, 1616~1619년 무렵 전염병으로 주민 대부분이 죽어 마을이 비어 있었다. 첫 겨울에 이주민의 절반가량이 굶주림과 병으로 죽었다. 1621년 3월 왐파노아그의 지도자 마사소잇이 이주민과 동맹을 맺었고, 영어를 아는 스콴토(티스콴툼)가 통역과 농사를 도왔다. 그해 가을 첫 수확을 함께 나눈 일이 오늘날 추수 감사절의 뿌리로 꼽힌다. 총독은 존 카버가 죽은 뒤 윌리엄 브래드퍼드가 맡았다. 이주민은 런던 투자자들에게 빚을 졌으나 1627년 투자자의 권리를 사들여 땅과 장사를 이주민 스스로 소유하게 되었다. 이 식민지는 1691년 매사추세츠에 합쳐졌고, 1629년에는 이보다 큰 청교도 식민지가 북쪽에서 시작된다(「매사추세츠만 식민지와 코네티컷, 피쿼트 전쟁(1629~1641)」(뒤의 사건)). 왐파노아그의 땅은 이주민이 늘며 점점 줄었다."
  subjects: [england]
  tags: [politics, society]
  sources: ["Nathaniel Philbrick, Mayflower: A Story of Courage, Community, and War (Viking, 2006)", "William Bradford, Of Plymouth Plantation (1651 manuscript)", "Alan Taylor, American Colonies (Viking, 2001)"]
