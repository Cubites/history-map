# 서아시아·북아프리카 사건 8차 묶음(me-08): 위임 통치에서 오늘까지 — 독립·이스라엘과 중동 전쟁·석유·이란 혁명·걸프 전쟁·아랍의 봄 (1918 ~ 2026년 기준)
# 범위: 무드로스 휴전과 점령지 행정·산레모 회의와 위임 통치·이라크 왕국과 트란스요르단, 이븐 사우드의 정복과 사우디아라비아·예멘 무타와킬 왕국과 아시르·오만 이맘국,
#   이집트의 1919년 혁명·독립·자유 장교단과 나세르·아랍 연합 공화국·사다트와 캠프 데이비드·무바라크와 2011년 혁명, 시리아·레바논의 위임 통치와 독립·바트당과 하페즈 알아사드·레바논 내전·시리아 내전,
#   팔레스타인 위임 통치와 아랍 대봉기·1948년 전쟁·6일 전쟁과 점령·4차 중동 전쟁·인티파다와 오슬로·가자 전쟁, 요르단 왕국과 검은 9월, 이라크의 왕정·1958년 혁명·바트당·이란–이라크 전쟁·걸프 전쟁·이라크 전쟁과 이슬람 국가,
#   이란의 레자 샤·모사데크와 1953년 정변·1979년 혁명, 걸프 토후국의 독립과 석유, 예멘의 혁명·남예멘의 독립·통일·내전, 리비아의 재정복과 독립·카다피와 2011년 내전,
#   튀니지·모로코·알제리의 독립과 알제리 내전, 리프 전쟁, 서사하라와 모리타니, 아랍의 봄.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1918~2025년 지도에서 생기거나 끝난 항목과 1만 km²(주변 등급 땅은 5만 km²)를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   긴 과정은 한 사건에 여러 나라를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 1970년대 중동 건설과 석유 파동, 2004~2008년 이라크 자이툰 부대를 한두 문장으로 견주고 대한민국 항목을 subjects로 이었다. 한국사 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다.
#   유럽 파일의 휴전·세브르 조약과 로잔 조약·국제 연맹·스페인 내전·스탈린그라드 전투·철의 장막과 이란 위기·인도의 독립과 팔레스타인 분할·알제리 전쟁·수에즈 위기·석유 파동은 다시 쓰지 않고 「제목」으로 가리켰다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었고 2026년 기준으로 진행 중인 일은 확인한 마지막 사실까지만 적었다.
# 이름 규칙: 아랍어·페르시아어·히브리어 인명은 국립국어원 용례와 교과서의 굳은 표기를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며, 이름이 갈리는 일(1948년 전쟁의 '독립 전쟁'과 '나크바', 6일 전쟁의 '선제 방어'와 '침략', 4차 중동 전쟁의 '욤 키푸르 전쟁'과 '라마단 전쟁')은 양쪽 이름을 함께 적었다.
#   땅은 지도 결정과 같은 사실 말(서안·가자·골란은 점령, 서사하라는 귀속 논쟁)로 썼다. 사망자·난민·피해는 정부·당사자 발표와 다른 추산을 범위와 출처로 함께 적었고 한 숫자로 못 박지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).

- id: mudros-occupation-1918
  year: 1918
  endYear: 1920
  title:
    ko: "무드로스 휴전과 아랍 지방의 점령 행정(1918~1920)"
  summary:
    ko: "1918년 10월 30일 에게해 무드로스 항에 정박한 영국 군함에서 오스만 제국과 연합국이 휴전 협정에 서명했다. 협정은 해협의 요새와 항구·철도를 연합국이 차지하고 오스만군을 해산하며 아랍 지방의 수비대가 항복하도록 정했다. 전선의 경과는 「1차 세계 대전의 중동 전선(1914~1918)」이, 아랍 반란과 비밀 협정은 「후세인–맥마흔 서한과 아랍 반란, 사이크스–피코 협정과 밸푸어 선언(1915~1918)」(앞의 사건)이, 독일과의 휴전은 「독일 11월 혁명과 휴전」(같은 시기의 사건)이 다루므로 여기서는 휴전 뒤의 일만 쓴다. 연합국은 점령지를 법적으로는 오스만의 땅으로 둔 채 1918년 10월 23일 앨런비가 점령지 행정(OETA)을 남·서·동 셋으로 나누었고(서부는 처음 '북부'라 불렸다) 12월에 킬리키아에 북부를 더해 군정을 폈다. 남부(팔레스타인)는 영국 군정관이, 서부(레바논 산과 시리아 해안)는 프랑스 군정관이 맡았고, 동부(시리아 내륙과 요르단강 동쪽)는 영국군 최고 지휘 아래 파이살의 아랍 정부가 다스렸다. 메소포타미아에서는 영국군이 바스라·바그다드에 이어 휴전 뒤 모술에 들어가 아널드 윌슨 같은 영국 민정관들이 인도 행정 방식으로 다스렸다. 메디나의 오스만 수비대는 1919년 1월에야 항복했고 히자즈 왕국은 마안과 아카바 쪽까지 영향권에 넣었다. 1919년 파리 강화 회의에서 파이살은 아랍의 독립을 호소했고, 미국의 킹-크레인 위원회(1919)가 시리아 주민의 뜻을 물었다. 1919년 11월 영국군이 내륙에서 물러나자 프랑스가 베카와 해안을 맡았고, 1920년 3월 8일 시리아 국민 회의가 파이살을 시리아 아랍 왕국의 왕으로 추대했다. 그러나 4월 산레모 회의가 시리아를 프랑스에 배정했고, 7월 24일 마이살룬 전투에서 프랑스군이 유수프 알아즈마가 이끈 시리아군을 깨뜨리고 다마스쿠스를 차지해 파이살은 떠났다. 같은 시기 점령지 행정 남부의 팔레스타인은 7월 1일 민간 행정으로 바뀌었다."
