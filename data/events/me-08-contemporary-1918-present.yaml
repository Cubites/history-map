- id: syria-baath-1949
  year: 1949
  endYear: 2000
  title:
    ko: "시리아의 쿠데타와 바트당, 하페즈 알아사드(1949~2000)"
  summary:
    ko: "1948년 전쟁에 졌다는 불만 속에서 시리아 공화국은 1949년 한 해에 세 번의 군사 쿠데타(3월 후스니 알자임, 8월 사미 알힌나위, 12월 아디브 알시샤클리)를 겪었다. 1947년 다마스쿠스에서 미셸 아플라크와 살라 알딘 알비타르가 세운 바트당(아랍 사회주의 부흥당)은 아랍 통일과 사회주의를 내세워 군 장교들 사이에서 세력을 얻었다. 1951년 시샤클리가 다시 정변으로 정권을 쥐었다가 1954년 쫓겨났고 1955년 슈크리 알쿠와틀리가 대통령이 되었으며, 1958년 2월 이집트와 합쳐 아랍 연합 공화국이 되면서 바트당은 해산되었고 이집트 중심 통합에 대한 불만 끝에 1961년 9월 28일 군의 쿠데타로 갈라졌다. 분리 뒤의 정부들을 거쳐 1963년 3월 8일 바트당 계열 장교들이 정권을 잡았고(아민 알하피즈가 이끌었다) 1966년 2월 살라 자디드의 급진파가 쿠데타로 이를 갈아엎었다. 국방 장관 하페즈 알아사드는 1967년 6일 전쟁에서 골란 고원을 잃은 뒤 1970년 11월 자디드를 몰아내고(교정 운동) 1971년 3월 대통령에 취임했다. 알라위파 출신인 그는 군·정보 기관·바트당을 쥐고 1973년 헌법을 두었고 같은 해 10월 이집트와 함께 이스라엘을 공격했다. 1976년 레바논 내전에 군대를 보냈고 1979~1982년 무슬림 형제단 계열의 무장 투쟁에 맞섰다. 1982년 2월 하마에서 군이 도시를 포위·진압했는데 사망자는 추산이 크게 갈려 당시 서방 외교 전문은 1,000명 안팎, 인권 단체·연구자는 5,000명에서 4만 명 안팎(휴먼 라이츠 워치 5,000~1만 명, 시리아 인권 단체 약 3만~4만 명)을 들며 시리아 정부는 정확한 수를 밝히지 않았다. 1980년대 이란–이라크 전쟁에서는 이란과 손잡고 이라크의 바트당 정권에 맞서 아랍 안에서 고립되었다. 1991년 걸프 전쟁에서는 다국적군에 참여하고 마드리드 회담에 나섰으나 이스라엘과 골란 문제로 평화 협상이 풀리지 않았다. 2000년 6월 10일 그가 죽자 헌법을 고쳐 아들 바샤르 알아사드가 대통령이 되었다."
  subjects: [syria-republic, united-arab-republic, syria, israel]
