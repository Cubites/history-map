- id: yemen-mutawakkilite-1918
  year: 1918
  endYear: 1934
  title:
    ko: "예멘 무타와킬 왕국과 아시르·호데이다, 타이프 조약(1918~1934)"
  summary:
    ko: "자이드파 이맘 야흐야는 1918년 10월 말 무드로스 휴전으로 오스만의 지배가 끝나자(오스만 부대는 이듬해 초까지 남았다는 설명이 있다) 사나를 중심으로 한 예멘 북부 고지를 이어받아 독립을 선언하고 무타와킬 왕국을 이루었다. 야흐야는 자이드파 부족 군대를 바탕으로 국경 밖 땅까지 자기 몫이라 주장했으나, 아랍 반란 때 영국과 손잡았던 이웃들과 충돌했다. 홍해 쪽 티하마 해안에서는 무함마드 알이드리스(1923년 죽음) 뒤를 알리 알이드리스(재위 1923~1926)와 하산 알이드리스가 이은 이드리스 가의 아시르 에미르국이 있었다. 이드리스 가의 아시르 에미르국은 도읍이 사비야였고 수피 교단을 이끈 이드리스 가문이 다스렸으며 1915년 영국과 조약을 맺어 오스만에 맞섰다. 호데이다 항은 1918년 말부터 영국군이 점령했다가 1921년 이드리스 가에 넘겼는데, 1924~1925년 이맘 군이 이를 빼앗아 티하마를 무타와킬 왕국 땅으로 만들었다. 북쪽에서는 네지드의 압둘아지즈(이븐 사우드)가 1920년 아시르 고원을 차지한 데 이어 이드리스 가의 지배를 압박했고, 이드리스 가의 아미르 하산 알이드리스는 1926년 메카 조약으로 사우디의 종주권을 받아들였다. 1930년 그 땅은 히자즈·네지드 왕국의 보호령으로 편입되었으며, 1932~1933년 이드리스 가 일족의 반란이 진압되었다. 이맘 야흐야는 이때 나지란과 아시르 땅을 두고 사우디와 맞섰고, 1934년 봄 사우디군이 호데이다를 포위하자 휴전을 청했다. 1934년 5~6월 타이프 조약은 사우디가 호데이다 점령지를 돌려주는 대신 나지란과 지잔을 포함한 아시르의 귀속을 사우디에 인정하게 했다. 타이프 조약의 국경 조항은 20년 기한으로 맺어져 뒤에 갱신되었다. 이로써 이드리스 가 땅의 귀속이 사우디 쪽으로 굳어졌고 에미르국의 이름도 사라졌으며 사우디아라비아의 남쪽 경계가 정해졌다. 같은 해 야흐야는 영국과 사나 조약을 맺어 아덴 보호령과의 경계를 그대로 두었고 이후 바깥 세계와의 교류를 줄인 채 왕국을 다스렸다."
