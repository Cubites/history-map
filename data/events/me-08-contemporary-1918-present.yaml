- id: egypt-revolution-1919
  year: 1919
  endYear: 1936
  title:
    ko: "이집트 1919년 혁명과 1922년 독립, 1936년 영국-이집트 조약(1919~1936)"
  summary:
    ko: "1차 대전 동안 영국의 보호국이던 이집트는 군수 징발과 노동 징용으로 농민이 큰 짐을 졌다. 1918년 11월 사드 자글룰 등이 파리 강화 회의에 대표단(와프드)을 보내겠다고 영국 고등 판무관에게 요구했고, 영국이 1919년 3월 자글룰을 몰타로 추방하자 학생·공무원·농민이 가담한 전국적 시위와 봉기가 일어났고 3월 16일에는 이집트 여성들도 처음으로 거리에 나섰다. 영국군의 진압으로 1919년 7월까지 이집트인 약 800명이 죽고 1,600명이 다쳤다는 집계(이집트 쪽 주장은 3,000명 안팎)가 있고 영국군 29명과 유럽 민간인 31명도 죽었는데, 영국은 4월 앨런비를 보내 자글룰을 풀어 주었다. 영국이 12월 보낸 밀너 위원회는 이집트인의 보이콧을 받았고 1921년 12월 자글룰은 다시 세이셸로 추방되었다. 1922년 2월 28일 영국은 보호국 체제를 끝내고 이집트의 독립을 일방적으로 선언했으나 수에즈 운하의 안전·국방·외국인 보호·수단 문제를 영국이 유보했다. 3월 15일 술탄 푸아드 1세가 왕을 칭했고 1923년 헌법이 입헌 군주제를 정했다. 와프드당은 선거에서 이겼으나 왕과 영국, 반와프드 정당들 사이의 다툼이 되풀이되었고 1924년 영국군 사령관 리 스택 암살 사건 뒤 영국은 이집트군을 수단에서 철수시켰다. 1930년에는 시드키 총리가 헌법을 고쳐 와프드를 누르려 했다. 1936년 4월 푸아드 1세가 죽고 열여섯 살의 파루크가 뒤를 이었으며, 이탈리아의 에티오피아 침공으로 위협을 느낀 영국과 와프드 정부가 8월 영국-이집트 조약을 맺었다. 조약은 영국군을 수에즈 운하 지대로 모아 20년간 둘 수 있게 했고 영국 고등 판무관을 대사로 바꾸었다. 그러나 점령의 실질은 이어졌고 이는 뒤의 자유 장교단 혁명으로 이어지는 불만의 바탕이 되었다."
  subjects: [british-egypt, egypt, uk]
  links:
    - { from: uk, to: egypt, note: "일방적 독립 선언과 네 가지 유보 (1922)" }
  tags: [politics, diplomacy, society]
  sources: ["The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)", "Joel Beinin·Zachary Lockman, Workers on the Nile: Nationalism, Communism, Islam, and the Egyptian Working Class, 1882–1954 (Princeton University Press, 1987)", "Afaf Lutfi al-Sayyid Marsot, A History of Egypt: From the Arab Conquest to the Present (Cambridge University Press, 2007)"]

- id: algeria-interwar-1919
  year: 1919
  endYear: 1945
  title:
    ko: "종나르 법과 알제리 민족주의의 성장, 세티프 학살(1919~1945)"
  summary:
    ko: "프랑스령 알제리의 무슬림 주민은 1914~1918년 병사만 17만 명 넘게(자료에 따라 24만 명 안팎, 노동자까지 더하면 훨씬 많게) 동원되어 프랑스를 위해 싸웠으나, 시민권을 얻으려면 이슬람 신분법을 버려야 하는 원주민법 체제 아래 있었다. 1916년 오레스 지방에서는 징집에 맞선 봉기가 일어났다. 1919년 2월 종나르 법은 일정한 자격을 갖춘 무슬림에게 지방 선거권을 넓혔지만 유럽계 정착민(피에누아르)이 쥔 의회의 힘은 그대로였다. 1926년 파리에서 메살리 하지가 북아프리카의 별(ENA)을 세워 독립을 요구했고, 1931년 압델하미드 벤 바디스가 이슬람 개혁 운동인 울라마 협회를 만들었으며, 1930년 프랑스는 정복 100주년을 성대히 기념해 원성을 샀다. 페르하트 아바스는 처음엔 프랑스와의 동화를 주장했으나 1943년 알제리 인민 선언으로 자치로 돌아섰다. 1937년 메살리 하지가 알제리 인민당을 세웠으나 프랑스는 1939년 이를 금지했다. 1936년 블룸-비올레트 법안은 소수 무슬림에게 시민권을 주려 했으나 정착민의 반대로 의회를 통과하지 못했다. 2차 대전 중 비시 프랑스에 이어 1942년 11월 연합군이 상륙해 알제리는 자유 프랑스의 근거지가 되었다. 1945년 5월 8일 유럽의 전승일에 동북부 세티프와 겔마에서 독립을 요구하는 행진이 폭력으로 번져 봉기한 이들의 습격으로 유럽계 주민 약 100명이 죽었고, 프랑스군과 정착민 민병은 수 주에 걸쳐 보복했다. 이때 숨진 알제리인은 프랑스 당국 집계 1,000~1,500명에서 연구자 추산 3,000~3만 명(역사가 아주롱은 5,000~6,000명), 알제리 정부 쪽 주장 4만 5,000명까지 크게 갈린다. 이 사건은 뒤에 독립 전쟁을 일으킨 세대가 무장 투쟁을 택하는 계기로 꼽힌다. 알제리 전쟁 자체는 「알제리 전쟁」(뒤의 사건)이 다룬다."
  subjects: [french-algeria, france]
  links: []
  tags: [politics, society, war]
  sources: ["Benjamin Stora, Algeria, 1830–2000: A Short History (Jane Marie Todd 옮김, Cornell University Press, 2001)", "Charles-Robert Ageron, Modern Algeria: A History from 1830 to the Present (Michael Brett 옮김, Hurst & Company, 1991)", "Jean-Pierre Peyroulou 외, Histoire de l'Algérie à la période coloniale, 1830–1962 (La Découverte, 2012)"]

- id: san-remo-mandates-1920
  year: 1920
  endYear: 1923
  title:
    ko: "산레모 회의와 위임 통치의 시작(1920~1923)"
  summary:
    ko: "1920년 4월 이탈리아 산레모에서 열린 연합국 회의는 오스만의 아랍 지방을 국제 연맹의 위임 통치로 나누어 시리아와 레바논은 프랑스에, 메소포타미아(이라크)와 팔레스타인은 영국에 맡기기로 했다. 같은 해 8월의 세브르 조약은 이를 확인했으나 조약 자체는 「세브르 조약과 튀르키예 독립 전쟁」(앞의 사건)이 다루고, 로잔 조약(1923)은 「로잔 조약과 튀르키예 공화국」(뒤의 사건)이 다룬다. 국제 연맹은 이 체제를 「국제 연맹」(같은 시기의 사건)의 틀에서 승인했다. 프랑스는 1920년 7월 마이살룬 전투 뒤 시리아 내륙의 점령지 행정 동부 지역을 차지했고, 8월 31일 구로 장군의 칙령으로 점령지 행정 서부를 끝내며 9월 1일 마론파 지도층이 바라던 대레바논을 세웠다. 팔레스타인에서는 7월 1일 점령지 행정 남부가 끝나고 허버트 새뮤얼의 민간 행정이 시작되었다. 이라크에서는 위임 통치 배정에 맞서 1920년 6월 유프라테스 중류의 루마이타에서 시작된 대반란이 시아파 부족과 수니파 도시 지도층을 아우르며 번졌고 영국군이 10월까지 진압했다. 이 반란에서 영국군 사망은 영국 집계 400여 명에서 1,000명 안팎 추산까지, 이라크인 사망은 약 2,000~1만 명 추산까지 갈린다. 영국은 1921년 3월 카이로 회의에서 처칠 장관 아래 지역 지배를 비용이 적은 방식으로 고쳤다. 파이살을 이라크 왕으로 세워 8월 23일 즉위시켰고, 요르단강 동쪽에는 파이살의 형 압둘라를 세워 4월 11일 트란스요르단의 첫 정부가 암만에 섰다. 1922년 영국-이라크 조약과 1922년 7월 국제 연맹의 팔레스타인·시리아 위임 통치 규약 승인, 1923년 9월 29일 규약의 발효로 체제가 법적으로 굳었다. 위임 통치는 형식상 주민의 자치 준비를 맡긴다고 했으나 실제로는 유럽 두 나라의 지배였고 아랍 민족주의자들은 이를 약속의 배신으로 받아들였다."
  subjects: [french-mandate-syria, greater-lebanon, mandatory-palestine, british-mesopotamia, iraq-kingdom, transjordan, oeta-south, oeta-west, oeta-east, uk, france]
