- id: reza-khan-1921
  year: 1921
  endYear: 1941
  title:
    ko: "레자 칸의 정변과 팔라비 왕조, 1941년 영·소 침공(1921~1941)"
  summary:
    ko: "1차 대전 뒤 이란은 중앙 정부가 약해져 지방 세력이 갈라졌고 북쪽 길란에는 소비에트 공화국이 섰으며 영국은 1919년 협정으로 이란을 영국의 보호 아래 두려 했다. 1921년 2월 21일 카자크 여단장 레자 칸이 언론인 세이이드 지야 앗딘 타바타바이와 함께 테헤란에 들어가 정변을 일으켰다. 레자 칸은 곧 국방 장관이 되어 군을 키우고 1923년 총리가 되었으며, 1925년 10월 31일 의회가 아흐마드 샤의 폐위를 결의하자 제헌 의회가 12월 12일 그를 샤로 정해 12월 15일 즉위했다. 이로써 카자르 왕조가 끝나고 레자 샤(재위 1925~1941)의 팔라비 왕조가 섰다. 레자 샤는 징병제 군대와 중앙 관료제, 세속 법원과 근대 학교, 1935년의 테헤란 대학과 종단 철도(1927~1938)를 갖추었고 외국인의 치외 법권을 폐지했다. 1932년에는 영국계 앵글로-페르시아 석유 회사의 이권을 취소했다가 이듬해 조건을 고쳐 다시 맺었다. 1935년 외국에 나라 이름을 페르시아가 아닌 이란으로 부르라고 요청했고 1936년에는 공공장소의 베일 착용을 금지해 울라마와 도시 신자들의 반발을 샀다. 1935년 7월 마슈하드 이맘 레자 성소의 시위는 군의 발포로 진압되었다. 1939년 2차 대전이 터지자 이란은 중립을 선언했으나 독일 기술자가 많았고, 영국과 소련은 이란 철도로 군수품을 소련에 보내려 했다. 1941년 8월 25일 영국군과 소련군이 남북에서 침공해 9월 16일 레자 샤를 물러나게 했고 스물한 살의 아들 무함마드 레자가 샤가 되었다. 소련군의 이란 북부 주둔은 전후 「철의 장막 연설과 트루먼 독트린」(뒤의 사건)이 다룬 위기로 이어진다."
  subjects: [qajar-iran, pahlavi-iran, uk, soviet-union]
  links:
    - { from: pahlavi-iran, to: qajar-iran, note: "카자르 왕조 폐위와 팔라비 왕조 즉위 (1925)" }
  tags: [politics, war, society]
  sources: ["Ervand Abrahamian, Iran between Two Revolutions (Princeton University Press, 1982)", "The Cambridge History of Iran, vol. 7: From Nadir Shah to the Islamic Republic (Peter Avery·Gavin Hambly·Charles Melville 편, Cambridge University Press, 1991)", "Ervand Abrahamian, A History of Modern Iran (Cambridge University Press, 2008)"]

- id: rif-war-1921
  year: 1921
  endYear: 1934
  title:
    ko: "리프 전쟁과 압드 엘크림, 모로코 평정의 끝(1921~1934)"
  summary:
    ko: "스페인은 1912년 보호 조약으로 모로코 북부를 맡았으나 산악 지대인 리프에서는 부족들이 저항해 해안 거점 밖의 지배가 약했다. 1921년 7월 아누알 전투에서 스페인군 수천 명이 베르베르 계열 리프 부족의 매복에 무너졌고 사망자는 스페인 쪽 추산 8,000명 안팎으로 알려진다. 이 싸움을 이끈 압드 엘크림(무함마드 이븐 압드 알카림 알카타비)은 법관 출신 지도자로 부족들을 묶어 1921년 9월부터 독립을 내세웠고 1923년 리프 공화국의 체제를 갖추었다. 스페인은 1923년 뒤 독일에서 들여온 독가스(겨자탄 등)를 비행기와 대포로 퍼부었고 1924년에는 거점을 줄여 해안으로 물러났는데, 독가스는 리프 주민의 건강에 장기적인 피해를 남겼다고 연구자들은 본다. 1925년 4월 압드 엘크림이 프랑스령 쪽 와르가강 유역으로 군을 보내자 프랑스가 개입했다. 9월 필리프 페탱 원수가 프랑스군 사령관이 되었고 스페인과 프랑스가 알우세이마 상륙으로 손을 잡았으며 병력은 두 나라 합쳐 수십만 명에 이르렀다. 압드 엘크림은 1926년 5월 프랑스군에게 항복해 인도양 레위니옹섬에 유배되었다. 이 싸움은 북아프리카 독립 운동가들에게 모범이 되었고 스페인군 장교 프랑코 같은 '아프리카주의자'들이 군의 정치 참여를 키우는 계기가 되었다고 평가되며 「스페인 내전」(뒤의 사건)의 한 배경이다. 프랑스는 1930년대 초 아틀라스 산악 지대와 남부 가장자리의 마지막 부족 지역을 평정해 1934년에야 보호령 전체를 지배하게 되었다. 스페인도 같은 해 이프니와 스페인령 사하라(서사하라)의 내륙 거점을 차지하며 해안 거점 중심이던 지배를 안쪽으로 넓혔다. 이 평정에서 마지막까지 맞선 산악 부족과 사막 유목민의 저항은 보호령 사회에 오래 기억되었다."
  subjects: [spanish-morocco, french-morocco, spanish-sahara, spain, france]
  links: []
  tags: [war, politics]
  sources: ["David S. Woolman, Rebels in the Rif: Abd el Krim and the Rif Rebellion (Stanford University Press, 1968)", "Susan Gilson Miller, A History of Modern Morocco (Cambridge University Press, 2013)", "Sebastian Balfour, Deadly Embrace: Morocco and the Road to the Spanish Civil War (Oxford University Press, 2002)"]

- id: libya-resistance-1922
  year: 1922
  endYear: 1932
  title:
    ko: "이탈리아의 리비아 재정복과 오마르 무크타르(1922~1932)"
  summary:
    ko: "이탈리아는 1912년 오스만에게서 리비아를 넘겨받았지만 1차 대전 중에는 해안의 몇몇 도시만 지켰고, 트리폴리타니아에서는 1918년 공화국이 선포되었으며 키레나이카에서는 사누시 교단의 이드리스가 1920년 이탈리아와 협정을 맺고 자치를 인정받았다. 1922년 파시스트 정권이 들어서자 트리폴리타니아의 재정복이 시작되어 북부와 나푸사 산지를 차지했고, 1922년 11월 트리폴리타니아 지도자들이 이드리스에게 두 지방의 아미르가 되어 달라고 요청해 그는 수락했으나, 이탈리아의 압박 속에 12월 이집트로 떠나 키레나이카 저항의 지휘를 오마르 무크타르에게 맡겼다. 이탈리아는 1923년부터 키레나이카에서 사누시와의 협정을 깨고 재점령을 시작했지만 대규모 공세는 1928년 이후에 이루어졌다. 무크타르는 쿠란 교사 출신으로 수피 교단 사누시를 따라 산악 지대 제벨 아크다르에서 게릴라전을 이끌었다. 1929년 피에트로 바돌리오가 트리폴리타니아·키레나이카 총독이 되어 철저한 진압을 시작했고 로돌포 그라치아니가 현지 사령관으로 쓰였다. 1930년 6월부터 이탈리아군은 키레나이카의 유목민을 사막 수용소로 몰았고 같은 해 페잔을 점령했으며 1931년 1월 쿠프라를 차지했다. 이집트 국경에는 270~300km의 철조망이 쳐졌다. 수용소의 사망자는 연구자에 따라 약 2만~7만 명(4만 명 안팎이 많이 인용된다)으로 갈리고 리비아 쪽에서는 그보다 많게 말하며 가축의 대부분이 죽었다. 1931년 9월 11일 일흔 살이 넘은 무크타르가 붙잡혀 9월 16일 공개 교수형을 당했고 1932년 1월 이탈리아는 평정을 선언했다. 무크타르는 오늘날 리비아와 아랍 세계에서 반식민 저항의 상징으로 기억된다."
  subjects: [italian-libya, italy]
  links:
    - { from: italy, to: italian-libya, note: "트리폴리타니아·키레나이카·페잔 재정복 (1922~1931)" }
  tags: [war, politics, society]
  sources: ["Ali Abdullatif Ahmida, The Making of Modern Libya: State Formation, Colonization, and Resistance (2nd ed., State University of New York Press, 2009)", "Giorgio Rochat, Le guerre italiane in Libia e in Etiopia dal 1896 al 1939 (Gaspari, 2009)", "Dirk Vandewalle, A History of Modern Libya (2nd ed., Cambridge University Press, 2012)"]

- id: iraq-kingdom-1925
  year: 1925
  endYear: 1956
  title:
    ko: "이라크 왕국의 독립과 1941년 정변(1925~1956)"
  summary:
    ko: "이라크 왕국은 위임 통치 아래 영국의 고문과 군대를 받아들였다. 모술 주를 두고 튀르키예와 다툰 문제는 국제 연맹이 1925년 이를 이라크에 붙이기로 결정했고 1926년 6월 영국·이라크·튀르키예 조약으로 정리되었으며, 튀르키예는 25년간 석유 사용료 일부를 받았다. 1927년 키르쿠크에서 큰 유전이 터졌고 이라크 석유 회사(영국·프랑스·미국 자본)가 이권을 쥐었다. 1930년 영국-이라크 조약이 군사 기지와 외교 협력을 정했으며 1932년 10월 3일 이라크는 독립해 국제 연맹에 가입했다. 1933년 파이살 1세가 죽고 아들 가지(재위 1933~1939)가, 그가 사고로 죽은 뒤 어린 파이살 2세를 대신해 섭정 압둘일라가 다스렸다. 1933년 8월 시마일에서 바크르 시드키가 이끈 정규군과 아랍·쿠르드 부족 비정규병이 아시리아인 마을을 공격해 약탈하고 죽였는데, 사망자는 영국 쪽 추산 300~600명, 아시리아 쪽 주장 3,000~6,000명으로 갈리고 2만 명 넘는 아시리아인이 피란했다. 1936년 바크르 시드키의 정변은 아랍 세계 최초의 군사 쿠데타로 꼽히며 이후 군부가 정치에 개입했다. 1941년 4월 라시드 알리 알가일라니가 친독 정변을 일으키자 영국군이 5월 바스라와 하바니야에서 개입해 한 달 만에 진압했고, 6월 1~2일 바그다드에서 '파르후드'라는 이름의 유대인 학살이 일어나 사망자는 이라크 조사 위원회 집계 130명(유대인·무슬림 합계), 유대인 공동체가 확인한 희생자 약 180명, 다른 추산 수백~1,000명 이상으로 갈린다. 1948~1949년 이라크군은 팔레스타인 전쟁에 참가했다가 돌아왔는데 이 일은 왕정에 대한 장교들의 불만을 키웠다. 1948년에는 영국과 새 조약에 맞선 시위(와트바)가 터졌고, 1950~1951년 이라크 유대인 약 12만 명이 이스라엘로 이주했다. 누리 알사이드 총리는 1955년 바그다드 조약으로 영국·튀르키예·이란·파키스탄과 군사 동맹을 맺었으나 1956년 수에즈 위기 때 반영 시위가 번졌다."
  subjects: [iraq-kingdom, uk, turkey]
  links: []
  tags: [politics, war, society]
  sources: ["Charles Tripp, A History of Iraq (3rd ed., Cambridge University Press, 2007)", "Hanna Batatu, The Old Social Classes and the Revolutionary Movements of Iraq (Princeton University Press, 1978)", "Peter Sluglett, Britain in Iraq: Contriving King and Country (Columbia University Press, 2007)"]

- id: mandate-syria-lebanon-1925
  year: 1925
  endYear: 1946
  title:
    ko: "시리아 대반란과 위임 통치기 시리아·레바논의 독립(1925~1946)"
  summary:
    ko: "프랑스는 위임 통치 아래 시리아를 다마스쿠스·알레포·알라위·드루즈 같은 여러 국가로 나누어 다스렸고 레바논에서는 마론파를 우대해 종파 정치를 굳혔다. 알라위와 드루즈 국은 1936년 시리아에 합쳐졌다. 1925년 7월 자발 드루즈의 술탄 알아트라시가 프랑스 판무관 사라일의 정책에 맞서 봉기했고 곧 다마스쿠스와 하마 등으로 번져 시리아 대반란이 되었다. 프랑스군은 1925년 10월과 1926년 5월 다마스쿠스를 포격했고 1927년까지 반란을 눌렀으며 시리아 쪽 사망자는 수천 명으로 추산한다. 1926년 5월 23일 대레바논은 헌법으로 레바논 공화국이 되었고 1930년 시리아도 공화국 헌법을 받았다. 1936년 블룸 정부가 시리아·레바논과 독립을 약속한 조약을 맺었으나 프랑스 의회가 비준하지 않았고, 1939년 프랑스는 알렉산드레타(하타이)를 튀르키예에 넘겼다. 1940년 프랑스가 독일에 패한 뒤 비시 정부 아래 있던 시리아·레바논에 1941년 6~7월 영국군과 자유 프랑스군이 들어가 비시군을 눌렀고, 자유 프랑스의 카트루는 1941년 시리아와 레바논의 독립을 선언했으나 실제 철수는 미루어졌다. 레바논에서는 1943년 8~9월 선거 뒤 마론파 대통령 비샤라 알쿠리와 수니파 총리 리야드 알솔호가 정부를 세우고 종파별로 권력을 나누는 국민 협약(불문)을 맺었다. 11월 11일 프랑스가 이들을 가두자 시위가 번졌고 22일 풀려나면서 레바논의 독립이 받아들여졌다. 시리아에서는 1945년 5월 프랑스군이 다마스쿠스를 포격해 영국이 개입했고, 1946년 4월 17일 프랑스군이 모두 물러나 시리아 공화국이 사실상 독립했다. 레바논에서는 1946년 12월 프랑스군이 철수를 마쳤다."
  subjects: [french-mandate-syria, greater-lebanon, lebanon, syria-republic, france, uk, turkey]
  links:
    - { from: france, to: french-mandate-syria, note: "대반란 진압 (1925~1927)" }
    - { from: turkey, to: french-mandate-syria, note: "알렉산드레타(하타이) 편입 (1939)" }
  tags: [politics, war, diplomacy]
  sources: ["Philip S. Khoury, Syria and the French Mandate: The Politics of Arab Nationalism, 1920–1945 (Princeton University Press, 1987)", "Fawwaz Traboulsi, A History of Modern Lebanon (Pluto Press, 2007)", "Kamal Salibi, A House of Many Mansions: The History of Lebanon Reconsidered (I. B. Tauris, 1988)"]

- id: saudi-oil-1932
  year: 1932
  endYear: 1973
  title:
    ko: "사우디아라비아 왕국의 선포와 석유, 석유 수출국 기구(1932~1973)"
  summary:
    ko: "압둘아지즈는 1932년 9월 23일 히자즈·네지드 왕국의 이름을 사우디아라비아 왕국으로 바꾸었고, 가난한 순례 수입에 기대던 재정은 1933년 5월 석유 이권으로 바뀌었다. 미국의 스탠더드 오일 오브 캘리포니아가 60년 이권을 따냈고 1938년 3월 담맘 7호 유정에서 상업 규모의 원유가 터졌다. 1944년 회사는 아라비안 아메리칸 석유 회사(아람코)가 되었고 1945년 2월 압둘아지즈는 미국 군함 퀸시호에서 루스벨트 대통령을 만나 안보와 석유의 관계를 세웠다. 1950년 아람코와 이익을 반씩 나누는 협약을 맺었으며 왕은 1953년 죽고 아들 사우드가, 1964년 파이살이 이어받았다. 사우드는 1953년 각료 회의를 처음 구성해 석유 수입으로 정부 부처를 키웠고 파이살은 1958년 총리로서 재정 긴축을 주도했다. 1960년 9월 바그다드에서 이란(팔라비 왕조), 이라크, 쿠웨이트, 사우디아라비아, 베네수엘라가 석유 수출국 기구(OPEC)를 만들어 국제 석유 회사의 가격 결정에 맞섰다. 뒤에 리비아가 들어왔고 1971년 테헤란·트리폴리 협정은 산유국의 세금과 가격 몫을 올렸으며, 1972년 이라크가 이라크 석유 회사를 국유화하고 사우디도 아람코 지분을 단계적으로 사들이기 시작했다. 1973년 10월 아랍 산유국들이 이스라엘을 지원한 나라에 석유를 금수하자 유가가 몇 달 만에 크게 올랐는데 이는 「석유 파동과 신자유주의」(뒤의 사건)가 다룬다. 한국 경제는 같은 시기 「중화학 공업 육성과 석유 파동」(뒤의 사건)에서 보듯 충격을 받았고 대한민국의 건설 업체는 1973년 삼환기업의 도로 공사를 시작으로 사우디아라비아에 진출해 이후 중동 건설 붐을 이루었다."
  subjects: [saudi-arabia, pahlavi-iran, iraq, kuwait, libya, usa, rok]
  links: []
  tags: [economy, politics, diplomacy]
  sources: ["Daniel Yergin, The Prize: The Epic Quest for Oil, Money, and Power (Simon & Schuster, 1991)", "Madawi Al-Rasheed, A History of Saudi Arabia (2nd ed., Cambridge University Press, 2010)", "Robert Vitalis, America's Kingdom: Mythmaking on the Saudi Oil Frontier (Stanford University Press, 2007)"]

- id: libya-independence-1943
  year: 1943
  endYear: 1951
  title:
    ko: "리비아의 영·프 군정과 독립(1943~1951)"
  summary:
    ko: "2차 대전 북아프리카 전역에서 1943년 1월 영국 제8군이 트리폴리를 차지하고 자유 프랑스군이 차드에서 올라와 페잔을 점령하면서 이탈리아의 지배가 끝났다. 전쟁 전체의 흐름은 「스탈린그라드 전투와 전세의 역전」(앞의 사건)이 다룬다. 영국은 트리폴리타니아와 키레나이카에, 프랑스는 페잔과 가다메스에 군정을 폈다. 이탈리아는 1947년 2월 평화 조약으로 식민지 권리를 버렸고 처리는 영·프·미·소 네 나라가 1년 안에 합의하지 못하면 유엔에 맡기기로 했다. 1949년 영국 외무 장관 베빈과 이탈리아 외무 장관 스포르차의 계획(이탈리아·영국·프랑스의 신탁 통치안)이 유엔 총회에서 부결되자, 1949년 11월 21일 총회는 결의 289호로 1952년 1월 1일 전에 리비아를 독립시키기로 했다. 유엔 위원 아드리안 펠트가 세 지방 대표가 참여한 국민 회의가 구성되도록 도왔고 키레나이카에는 1949년 영국이 사누시 교단의 이드리스가 이끄는 자치 정부를 인정해 두었고 6월 1일 이드리스는 에미르국의 독립을 선포했다. 트리폴리타니아에서는 이탈리아의 복귀를 막는 문제와 키레나이카와의 통합을 두고 정당들이 갈렸고, 페잔에는 프랑스가 영향력을 남기려 했으나 1951년 리비아에 들어왔다. 연방제를 택한 헌법이 1951년 10월 채택되었으며 12월 24일 사누시 교단 창시자의 손자 이드리스 1세가 왕으로 리비아 연합 왕국이 독립했다. 새 나라는 트리폴리타니아·키레나이카·페잔 세 주로 이루어졌고 도읍이 트리폴리와 벵가지 두 곳이었다. 독립 때 리비아는 1인당 소득이 세계에서 가장 낮은 축에 들었고 영국과 미국의 군사 기지 사용료와 원조에 기대었다."
  subjects: [italian-libya, libya-british-admin, libya-french-fezzan, libya, italy, uk, france]
  links:
    - { from: libya-british-admin, to: libya, note: "영국 군정 지역의 독립 (1951)" }
    - { from: libya-french-fezzan, to: libya, note: "페잔·가다메스의 합류 (1951)" }
  tags: [politics, diplomacy, war]
  sources: ["Dirk Vandewalle, A History of Modern Libya (2nd ed., Cambridge University Press, 2012)", "Ali Abdullatif Ahmida, The Making of Modern Libya (2nd ed., State University of New York Press, 2009)", "Adrian Pelt, Libyan Independence and the United Nations: A Case of Planned Decolonization (Yale University Press, 1970)", "유엔 총회, 「결의 289호」(1949년 11월 21일 채택)"]

- id: jordan-kingdom-1946
  year: 1946
  endYear: 1971
  title:
    ko: "요르단 왕국의 독립과 서안 병합, 검은 9월(1946~1971)"
  summary:
    ko: "영국과 트란스요르단은 1946년 3월 런던 조약으로 위임 통치를 끝내기로 했고 5월 25일 압둘라가 왕으로 하심 왕국을 선포했다. 압둘라 1세의 군대인 아랍 군단은 영국인 장교 글럽 파샤가 지휘했다. 1948년 전쟁에서 아랍 군단은 서안과 동예루살렘 구시가를 차지했고 12월 예리코 회의에서 서안 지도자들이 병합을 요청했으며, 1950년 4월 요르단 의회가 서안과의 합병을 의결했다. 아랍 군단은 1948년 라트룬 전투에서 이스라엘군을 막고 예루살렘 구시가를 지켰다. 영국 등 몇 나라만 병합을 승인했고 아랍 연맹의 다른 나라들은 팔레스타인인 몫의 임시 신탁이라며 반대했다. 요르단은 서안 주민과 팔레스타인 난민에게 시민권을 주었고 인구가 크게 늘었다. 1951년 7월 20일 압둘라는 예루살렘 알아크사 사원에서 팔레스타인 민족주의자에게 암살되었고 아들 탈랄이 이었다가 정신 질환으로 1952년 8월 물러났고 열여섯 살의 후세인이 왕이 되어 1953년 5월 친정을 시작했다. 후세인은 1956년 3월 글럽 파샤를 해임해 군의 아랍화를 이루었고 1958년 2월 이라크와 아랍 연방을 맺었으나 같은 해 7월 이라크 혁명으로 끝났다. 1967년 6일 전쟁으로 서안을 잃은 뒤 팔레스타인 해방 기구(PLO) 계열 무장 조직(페다인)이 요르단에서 이스라엘을 공격하며 국가 안의 국가처럼 되었다. 1970년 9월 요르단군이 이들을 진압하며 충돌이 벌어진 '검은 9월'에서 사망자는 팔레스타인 쪽 연구자 추산 약 2,000~3,400명이고 요르단군 사망자는 약 540명이며 아라파트는 2만 5,000명을 주장해 크게 갈린다. 9월 27일 나세르의 중재로 카이로 협정이 맺어졌고 1971년 7월 마지막 근거지 아즐룬에서 PLO가 물러나 레바논으로 옮겨 갔다."
  subjects: [transjordan, jordan, west-bank, uk]
  links:
    - { from: jordan, to: west-bank, note: "서안 병합 선언 (1950)" }
  tags: [politics, war, diplomacy]
  sources: ["Avi Shlaim, Lion of Jordan: The Life of King Hussein in War and Peace (Allen Lane, 2007)", "Eugene L. Rogan·Avi Shlaim 편, The War for Palestine: Rewriting the History of 1948 (2nd ed., Cambridge University Press, 2007)", "Kamal Salibi, The Modern History of Jordan (I. B. Tauris, 1993)"]

- id: palestine-war-1947
  year: 1947
  endYear: 1949
  title:
    ko: "분할안에서 1948년 전쟁까지: 이스라엘의 건국과 나크바(1947~1949)"
  summary:
    ko: "영국은 1947년 팔레스타인 문제를 유엔에 넘겼는데, 같은 해 인도의 분할 독립과 이어진 탈식민지화의 흐름은 「인도의 독립과 탈식민지화의 시작」(같은 시기의 사건)이 다룬다. 11월 29일 유엔 총회가 결의 181호로 유대인 국가·아랍 국가·국제 관리의 예루살렘으로 나누는 분할안을 채택했다. 유대인 지도부는 이를 받아들였고 아랍 고등 위원회와 아랍 나라들은 거부했다. 안이 채택된 직후부터 유대인과 아랍 무장 세력 사이의 내전이 벌어졌고 1948년 4월 9일 예루살렘 근처 데이르 야신 마을에서 이르군·레히 대원이 민간인 100여 명을 죽인 사건을 비롯해 양쪽의 공격이 민간인 피해를 낳았다. 4월 13일에는 아랍 무장대가 예루살렘 하다사 병원으로 가던 호송대를 공격해 약 80명이 죽었다. 하이파와 야파 등에서 아랍 주민이 대거 떠나기 시작했다. 1948년 5월 14일 영국 위임 통치가 끝나는 날 벤구리온이 이스라엘의 독립을 선언했고, 15일 이집트·트란스요르단(요르단)·시리아·이라크 군이 팔레스타인에 들어오고 레바논도 소규모로 참여해 전쟁이 이어졌다. 이스라엘에서는 이를 독립 전쟁, 팔레스타인인은 나크바(대재앙)라 부른다. 이스라엘군은 1948년 7월 리다·람라에서 주민 약 6만 명을 쫓아냈고, 휴전 중 무기를 보강해 10월 이후 공세로 갈릴리·네게브를 차지했다. 1949년 2월 이집트(24일), 3월 레바논(23일), 4월 요르단(3일), 7월 시리아(20일)와 휴전 협정을 맺었다. 이스라엘은 위임 통치령의 약 78%를 지배했고 서안은 요르단이, 가자 지구는 이집트가 차지했다. 이스라엘 쪽 사망자는 약 6,000명(인구의 1%), 아랍 쪽은 정확한 집계가 없고 5,000명에서 2만 명(팔레스타인 중앙 통계국은 약 1만 5,000명)으로 추산된다. 팔레스타인 난민은 유엔 조정 위원회 추산 약 71만 명이고 이스라엘 쪽 연구자 추산은 약 55만~60만 명대에서 모리스처럼 70만 명 안팎까지, 팔레스타인 쪽은 75만 명 이상을 든다. 1948년 12월 총회 결의 194호는 귀환과 보상을 말했지만 이스라엘은 대규모 귀환을 받아들이지 않았다. 이어진 몇 해 동안 아랍 나라들에서는 유대인 수십만 명이 떠나거나 쫓겨났다. 이주의 원인(추방과 폭력, 전쟁의 공포, 팔레스타인 지도층의 붕괴와 일부 지도자들의 가족 대피 등)과 그 비중은 연구자에 따라 달리 해석되지만 폭력과 추방, 그에 대한 공포가 주된 요인이었다는 해석이 다수다."
