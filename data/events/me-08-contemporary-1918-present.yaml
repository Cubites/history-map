  tags: [politics, war]
  sources: ["Patrick Seale, Asad of Syria: The Struggle for the Middle East (University of California Press, 1989)", "Raymond Hinnebusch, Syria: Revolution from Above (Routledge, 2001)", "Hanna Batatu, Syria's Peasantry, the Descendants of Its Lesser Rural Notables, and Their Politics (Princeton University Press, 1999)"]

- id: mossadegh-1951
  year: 1951
  endYear: 1954
  title:
    ko: "이란 석유 국유화와 모사데크, 1953년 정변(1951~1954)"
  summary:
    ko: "영국의 앵글로-이란 석유 회사(AIOC)는 이란의 석유를 쥐고도 이란 정부에 낮은 사용료만 주어 불만이 컸다. 1949년 보충 협정으로 사용료를 조금 올리려 했으나 의회가 받아들이지 않았고, 1951년 3월 국유화에 반대하던 총리 라즈마라가 암살되었다. 1951년 3월 의회가 석유 산업 국유화를 의결했고 4월 28일 민족 전선의 무함마드 모사데크가 총리가 되어 아바단 정유소를 이란 국영 회사가 맡게 했다. 영국은 이란 석유의 수출을 막는 봉쇄를 하고 해군을 보내 압박했으며, 국제 사법 재판소에 제소했으나 1952년 7월 재판소는 관할권이 없다고 판단했다. 1952년 10월 이란은 영국과 외교 관계를 끊었다. 석유 수입이 끊겨 재정이 어려워지고 모사데크와 샤 무함마드 레자, 군부와 일부 울라마 사이의 갈등이 깊어졌다. 영국의 요청으로 미국 중앙 정보국(CIA)과 영국 비밀 정보국(MI6)이 계획한 작전에 따라 1953년 8월 샤가 모사데크 해임 칙령을 내렸으나 15~16일 칙령 전달 시도가 실패하고 모사데크가 이를 받아들이지 않아 샤는 한때 나라를 떠났다. 8월 19일 군 장교들과 거리 시위대가 모사데크 정부를 무너뜨렸고 샤는 22일 돌아왔으며 파즐롤라 자헤디 장군이 총리가 되었다. 모사데크는 3년 형을 받고 죽을 때까지 연금되었다. 1954년 영국석유(BP)와 미국 회사들이 참여한 국제 컨소시엄이 석유 생산을 맡는 협정이 맺어졌다. 이후 미국 정부는 2013년에 정변에서 CIA가 한 역할을 공개 문서로 인정했다. 이후 이란에서는 샤의 권력이 강해졌으나 1953년의 기억은 미국에 대한 불신으로 남았고, 연구자들은 이를 「이란 혁명과 이슬람 공화국의 성립, 미국 대사관 인질 사건(1978~1981)」(뒤의 사건)의 한 배경으로 본다."
  subjects: [pahlavi-iran, uk, usa]
  links: []
  tags: [politics, economy, diplomacy]
  sources: ["Ervand Abrahamian, The Coup: 1953, the CIA, and the Roots of Modern U.S.-Iranian Relations (The New Press, 2013)", "Mark J. Gasiorowski·Malcolm Byrne 편, Mohammad Mosaddeq and the 1953 Coup in Iran (Syracuse University Press, 2004)", "Ervand Abrahamian, A History of Modern Iran (Cambridge University Press, 2008)"]

- id: free-officers-1952
  year: 1952
  endYear: 1961
  title:
    ko: "자유 장교단 혁명과 나세르, 아랍 연합 공화국(1952~1961)"
  summary:
    ko: "1948년 전쟁의 패배와 영국의 존속, 왕실의 부패에 분노한 군 장교들이 가말 압델 나세르를 중심으로 자유 장교단을 이루었다. 1952년 1월 카이로 대화재 뒤 정국이 불안해지자 7월 23일 자유 장교단이 정변을 일으켰고 파루크는 7월 26일 갓난 아들 푸아드 2세에게 왕위를 넘기고 떠났다. 명목상 지도자는 무함마드 나기브 장군이었고 9월 토지 개혁법이 한 사람이 가질 수 있는 땅을 200페단(약 84헥타르)으로 제한했다. 1953년 6월 18일 왕정이 폐지되고 공화국이 되었다. 1954년 10월 영국과 수에즈 운하 지대에서 군대를 20개월 안에 철수시키는 협정(영국은 7년간 기지를 다시 쓸 권리를 가졌다)을 맺었으며 같은 달 무슬림 형제단 단원의 나세르 암살 시도로 형제단이 탄압받았고 11월 나기브가 물러나 나세르가 실권을 쥐었다. 1956년 6월 국민 투표로 대통령이 된 나세르는 7월 수에즈 운하를 국유화했는데 이 위기와 영국·프랑스·이스라엘의 군사 개입은 「수에즈 위기」(뒤의 사건)가 다룬다. 이 일로 나세르는 아랍 민족주의의 상징이 되었는데, 앞서 1955년 그는 반둥 회의에 참가하고 체코슬로바키아에서 무기를 사들였다. 시리아에서는 쿠데타가 되풀이되는 가운데 바트당과 군 장교들이 이집트와의 통합을 요청해 1958년 2월 1일 이집트와 시리아가 합쳐 아랍 연합 공화국이 섰고, 국민 투표로 나세르가 대통령이 되었다. 3월 예멘의 무타와킬 왕국이 이 공화국과 아랍 국가 연합(아랍 합중국)을 맺었다. 시리아의 정당들은 해산되고 이집트 중심의 중앙 집권이 시리아의 상인층과 군 장교의 불만을 키워 1961년 9월 28일 다마스쿠스의 쿠데타로 시리아가 떨어져 나갔다."
  subjects: [egypt, syria-republic, united-arab-republic, syria, yemen-kingdom, uk]
  links:
    - { from: egypt, to: syria-republic, note: "합쳐서 아랍 연합 공화국 수립 (1958)" }
  tags: [politics, diplomacy, war]
  sources: ["The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)", "Joel Gordon, Nasser's Blessed Movement: Egypt's Free Officers and the July Revolution (Oxford University Press, 1992)", "Malcolm H. Kerr, The Arab Cold War: Gamal 'Abd al-Nasir and His Rivals, 1958–1970 (3rd ed., Oxford University Press, 1971)"]

- id: tunisia-independence-1952
  year: 1952
  endYear: 1963
  title:
    ko: "튀니지의 독립과 부르기바, 비제르트 위기(1952~1963)"
  summary:
    ko: "튀니지의 독립 운동은 1934년 하비브 부르기바가 데스투르당에서 갈라져 나와 세운 네오데스투르당이 이끌었다. 2차 대전 뒤 프랑스가 개혁을 미루자 1952년 1월 부르기바가 체포되었고 파업과 시위, '펠라가'라 불린 농촌 게릴라의 습격이 이어졌다. 1952년 12월 노조 지도자 파르하트 하셰드가 프랑스인 비밀 무장 조직 '붉은 손'에게 암살되었다. 1954년 7월 프랑스 총리 망데스 프랑스가 카르타고에서 내부 자치를 약속했고 1955년 6월 협약으로 자치가 시작되었으나 부르기바와 살라 벤 유세프(아랍주의와 무장 투쟁 지속을 내세움)가 갈라졌다. 1956년 3월 20일 프랑스가 의정서로 독립을 인정했고 3월 선거에서 네오데스투르당이 압승해 부르기바가 총리가 되었으며 베이 무함마드 8세 알아민 아래 입헌 군주제 독립국이 선 뒤 8월 13일 일부다처 금지와 여성의 이혼권을 담은 개인 신분법이 공포되었다. 독립 뒤 정부는 이슬람 법원을 폐지하고 법체계를 하나로 통합했다. 1957년 7월 25일 제헌 의회가 군주제를 폐지해 부르기바가 대통령이 되었고 1959년 헌법이 대통령 중심 체제를 정했다. 프랑스는 비제르트 해군 기지를 계속 두었는데 1961년 7월 튀니지가 기지 주변 봉쇄와 사하라 국경 문제로 충돌했다. 이 비제르트 위기에서 튀니지 쪽 사망자는 수백에서 1,000명 이상(튀니지 쪽 주장)으로 갈리고 프랑스군 사망자는 20여 명이다. 유엔이 휴전을 촉구했고 프랑스군은 1963년 10월에야 비제르트에서 철수했다. 알제리 전쟁 중이던 이웃 알제리 독립운동가들은 튀니지의 국경 지대를 근거지로 삼았고 이는 프랑스와의 갈등 요인이었다."
  subjects: [french-tunisia, tunisia, france]
  links: []
  tags: [politics, diplomacy, society]
  sources: ["Kenneth Perkins, A History of Modern Tunisia (2nd ed., Cambridge University Press, 2014)", "Lisa Anderson, The State and Social Transformation in Tunisia and Libya, 1830–1980 (Princeton University Press, 1986)"]

- id: morocco-independence-1953
  year: 1953
  endYear: 1961
  title:
    ko: "모로코의 독립과 무함마드 5세, 모리타니의 독립(1953~1961)"
  summary:
    ko: "1944년 이스티클랄(독립)당이 독립 선언서를 낸 뒤 술탄 무함마드 5세는 독립 요구를 받아들이는 쪽으로 기울었고 프랑스 총주재관은 이를 막으려 했다. 1947년 탕헤르에서 술탄이 아랍 민족주의 색채의 연설을 한 뒤 프랑스와의 사이가 더 나빠졌다. 1953년 8월 20일 프랑스는 그를 폐위해 코르시카로, 뒤에 마다가스카르로 보냈고 먼 친척 이븐 아라파를 세웠지만 도시의 폭탄 공격과 농촌·산악 지대의 해방군 활동이 이어졌고 1955년 8월 20일에는 리프와 우에드 자임에서 봉기가 일어났다. 1955년 11월 프랑스는 술탄을 돌려보냈고 1956년 3월 2일 프랑스-모로코 공동 선언으로 모로코의 독립이 인정되었다. 4월 7일 스페인이 북부 보호령을 넘겼으며 탕헤르의 국제 관리는 10월 끝났다. 1957년 8월 무함마드 5세는 술탄 대신 왕을 칭했다. 스페인령 남부(타르파야)는 1958년 4월 조약으로 돌려받았으나, 이프니 지역에서는 1957~1958년 모로코 해방군과 스페인-프랑스군이 싸웠고 이프니는 뒤에야 돌아왔다. 모로코의 일부 민족주의자들은 모리타니와 서사하라, 알제리 서부까지 '대모로코'라 주장했다. 모리타니는 프랑스령 서아프리카의 일부였다가 1958년 자치 공화국이 되었고 모크타르 울드 다다가 이끈 독립 운동이 1960년 11월 28일 독립으로 이어졌다. 모로코는 이를 인정하지 않고 유엔 가입(1961년)에도 반대했으며 한참 뒤에야 인정했다. 1956년 왕자 하산은 왕립군 참모 총장이 되어 있었고, 1961년 2월 26일 무함마드 5세가 죽자 하산 2세가 왕위를 이었다. 하산 2세는 이후 국왕 중심의 권위주의 체제를 굳혔다."
  subjects: [french-morocco, spanish-morocco, morocco, mauritania, french-mauritania, spanish-sahara, france, spain]
  links:
    - { from: france, to: morocco, note: "공동 선언으로 독립 인정 (1956)" }
    - { from: spain, to: morocco, note: "북부 보호령 반환 (1956)" }
  tags: [politics, diplomacy, society]
  sources: ["Susan Gilson Miller, A History of Modern Morocco (Cambridge University Press, 2013)", "C. R. Pennell, Morocco since 1830: A History (Hurst & Company, 2000)", "Anthony G. Pazzanita, Historical Dictionary of Mauritania (3rd ed., Scarecrow Press, 2008)"]

- id: iraq-revolution-1958
  year: 1958
  endYear: 1979
  title:
    ko: "1958년 이라크 혁명과 바트당의 집권, 사담 후세인의 등장(1958~1979)"
  summary:
    ko: "1958년 7월 14일 압드 알카림 카심과 압드 알살람 아리프가 이끈 자유 장교단이 왕정을 무너뜨렸고 왕 파이살 2세와 왕세자 압둘일라(1953년까지 섭정)가 죽었고 총리 누리 알사이드는 15일 살해되었다. 카심은 공화국의 총리가 되어 1959년 바그다드 조약에서 물러나고 토지 개혁을 폈다. 1959년 3월 모술에서 공산당 지지자와 민족주의 장교들이 충돌해 수백 명이 죽었고 10월 카심 암살 시도에는 젊은 바트당원 사담 후세인이 가담했다. 카심은 공산당과 아랍 민족주의자, 쿠르드 지도자 무스타파 바르자니 사이를 오가다 힘을 잃었다. 1961년 쿠웨이트가 독립하자 카심이 쿠웨이트는 이라크의 일부라고 주장해 영국군이 들어왔고 곧 아랍 연맹군이 이를 대신했다. 같은 해 9월 쿠르드의 무장 투쟁이 시작되었다. 1963년 2월 8일 바트당과 아리프 계열 군이 쿠데타로 카심을 처형했고 아리프 형제(압드 알살람, 1966년 사고사 뒤 동생 압드 알라흐만)가 이었다. 1968년 7월 17일 아흐마드 하산 알바크르의 바트당이 다시 정권을 잡아 군·보안 기관·당을 한데 묶는 체제를 세웠다. 1970년 3월 쿠르드 자치 협정을 맺었으나 지켜지지 않아 1974년 전투가 되살아났고, 1972년 이라크 석유 회사를 국유화해 늘어난 석유 수입으로 복지와 군비를 키웠다. 1975년 3월 알제 협정에서 이란의 샤가 쿠르드 지원을 끊는 대신 샤트알아랍 강의 경계를 강 가운데로 정했고 쿠르드의 반란은 꺾였다. 1979년 7월 16일 바크르가 물러나 부통령 사담 후세인이 대통령이 되었고, 며칠 뒤 당 간부 수십 명을 반역자로 몰아 일부를 처형하며 권력을 굳혔다. 바트당 정권 아래 쿠르드 마을의 이주와 아랍화 정책도 이어졌다."
  subjects: [iraq-kingdom, iraq, kuwait, pahlavi-iran]
  links:
    - { from: iraq, to: pahlavi-iran, note: "알제 협정으로 샤트알아랍 경계를 강 가운데로 조정 (1975)" }
  tags: [politics, war]
  sources: ["Charles Tripp, A History of Iraq (3rd ed., Cambridge University Press, 2007)", "Hanna Batatu, The Old Social Classes and the Revolutionary Movements of Iraq (Princeton University Press, 1978)", "David McDowall, A Modern History of the Kurds (3rd ed., I. B. Tauris, 2004)"]

- id: gulf-independence-1961
  year: 1961
  endYear: 1971
  title:
    ko: "쿠웨이트의 독립과 영국의 걸프 철수, 바레인·카타르·아랍에미리트(1961~1971)"
  summary:
    ko: "쿠웨이트는 1899년 이래 영국의 보호를 받아 왔고 1961년 6월 19일 보호 협정을 끝내며 독립했다. 이라크의 카심이 쿠웨이트가 이라크의 땅이라고 주장하자 영국군이 들어와 막았고, 9월 아랍 연맹군으로 대체되었다. 1963년 이라크는 쿠웨이트의 독립을 인정했다. 쿠웨이트는 1962년 헌법으로 국민 의회를 두어 걸프에서 가장 일찍 의회 제도를 갖추었다. 1968년 1월 영국 정부가 1971년 말까지 수에즈 동쪽의 군대를 거두겠다고 발표하자 바레인·카타르와 일곱 트루셜 토후국(아부다비·두바이·샤르자·아지만·움알쿠와인·라스알카이마·푸자이라)이 아홉 토후국의 연합을 논의했으나 이해가 달라 갈라졌다. 영국이 떠나기로 한 데는 파운드화 위기 뒤의 재정난이 있었고, 아홉 토후국의 연합 구상은 바레인과 카타르가 의석 배분과 지도권 문제로 빠지며 무산되었다. 이란은 바레인이 자기 땅이라 주장했는데 1970년 유엔 특사의 조사에서 주민들이 독립을 바란다고 확인되어 이란이 주장을 접었다. 바레인은 1971년 8월 15일, 카타르는 9월 3일 독립했다. 1971년 12월 2일 아부다비·두바이·샤르자·아지만·움알쿠와인·푸자이라가 아랍에미리트를 세웠고 라스알카이마는 이듬해 2월 합류했다. 연방의 첫 대통령은 아부다비의 셰이크 자이드였다. 아부다비에서는 1958년 석유가 발견되어 1962년 첫 수출이 시작되었고 1966년 자이드가 형을 대신해 토후가 되어 연방 구상을 이끌었다. 1971년 11월 30일 이란이 아부무사 섬과 대툰브·소툰브 섬을 차지했는데 이 섬들의 귀속은 2026년 기준으로도 아랍에미리트와 이란 사이에 다툼이 이어진다. 이 토후국들은 석유 수입으로 빠르게 달라졌고 이주 노동자가 크게 늘었다."
  subjects: [kuwait, bahrain, qatar, trucial-states, united-arab-emirates, iraq, pahlavi-iran, uk]
  links:
    - { from: trucial-states, to: united-arab-emirates, note: "영국과의 조약이 끝나고 연방 수립 (1971)" }
  tags: [politics, diplomacy]
  sources: ["Rosemarie Said Zahlan, The Making of the Modern Gulf States: Kuwait, Bahrain, Qatar, the United Arab Emirates and Oman (rev. ed., Ithaca Press, 1998)", "Jill Crystal, Kuwait: The Transformation of an Oil State (Westview Press, 1992)", "Malcolm C. Peck, The United Arab Emirates: A Venture in Unity (Westview Press, 1986)"]

- id: algerian-independence-1962
  year: 1962
  endYear: 1965
  title:
    ko: "알제리의 독립과 벤 벨라, 부메디엔의 쿠데타(1962~1965)"
  summary:
    ko: "알제리 전쟁은 「알제리 전쟁」(앞의 사건)이 다루므로 여기서는 독립 뒤의 일을 쓴다. 1962년 3월 18일 에비앙 협정이 서명되어 이튿날 휴전이 되었고 7월 1일 국민 투표에서 압도적 찬성으로 독립이 정해졌으며, 7월 3일 프랑스가 이를 인정하고 7월 5일 알제리가 독립을 선포했다. 독립 직후 알제리는 인구 약 1,000만 명 가운데 대부분이 농촌 빈민이었고 행정과 전문직 인력이 유럽인과 함께 떠나 공백이 컸다. 이 무렵 비밀 군사 조직(OAS)의 폭탄 공격·암살과 그에 맞선 보복으로 유럽계 주민 약 70만~100만 명이 프랑스로 떠났다. 7월 5일 오랑에서는 유럽계 주민 수십에서 수백 명이 납치·살해되었는데 사망자 수는 프랑스 쪽 집계와 알제리 쪽 집계가 크게 다르다. 프랑스군에 협력한 하르키는 독립 뒤 보복으로 죽임을 당했는데 연구자에 따라 적어도 3만 명에서 많게는 15만 명(가족 포함)까지 갈린다. 여름의 민족 해방 전선(FLN) 내부 권력 다툼에서 벤 벨라와 군 지휘관 후아리 부메디엔의 연합이 임시 정부를 눌렀고 9월 벤 벨라가 총리, 1963년 9월 대통령이 되었다. 1963년 헌법은 FLN 일당 체제를 정했고 벤 벨라는 유럽인이 떠난 농장을 자주 관리 제도로 넘기며 1964년 이후 쿠바·소련과 가까워졌다. 1963년 10월 모로코와 틴두프 국경을 두고 모래 전쟁이 벌어졌으며 아프리카 단결 기구의 중재로 1964년 휴전했다. 카빌리에서는 후세인 아이트 아흐마드의 사회주의 세력 전선(FFS)이 반란을 일으켰다. 1965년 6월 19일 부메디엔이 무혈 쿠데타로 벤 벨라를 몰아내 혁명 평의회를 세웠다. 이 체제는 석유·가스 수입으로 공업화를 밀어붙였다."
  subjects: [french-algeria, algeria, morocco, france]
  links:
    - { from: france, to: algeria, note: "에비앙 협정과 국민 투표 뒤 독립 인정 (1962)" }
  tags: [politics, war, society]
  sources: ["Benjamin Stora, Algeria, 1830–2000: A Short History (Jane Marie Todd 옮김, Cornell University Press, 2001)", "Alistair Horne, A Savage War of Peace: Algeria 1954–1962 (Macmillan, 1977)", "Mohammed Harbi·Benjamin Stora 편, La guerre d'Algérie, 1954–2004: la fin de l'amnésie (Robert Laffont, 2004)"]

- id: yemen-republic-1962
  year: 1962
  endYear: 1970
  title:
    ko: "1962년 예멘 혁명과 북예멘 내전(1962~1970)"
  summary:
    ko: "1948년 아버지 야흐야가 암살되고 알와지르 가문이 세운 이맘이 수 주 만에 무너진 뒤 이맘이 된 아흐마드가 1962년 9월 죽고 아들 바드르가 이맘이 된 지 일주일 만인 9월 26일, 이맘 근위대를 지휘하던 압둘라 알살랄 등 군 장교들이 혁명을 일으켜 무타와킬 왕국을 무너뜨리고 예멘 아랍 공화국을 선포했다. 혁명 지도부는 나세르의 영향을 받은 장교들이 중심이었고 이맘 제도와 자이드파 명문가의 특권을 비판했으며, 공화국은 곧 임시 헌법을 마련했다. 미국은 12월 공화국을 승인했다. 바드르는 북쪽 산악 지대로 가서 부족을 모아 왕당파의 저항을 이끌었고 왕당파는 사아다·하자 일대에서, 공화파는 사나·호데이다·타이즈에서 버텼다. 나세르의 이집트는 공화국을 돕겠다며 군대를 보내 한때 최대 7만 명(추산)에 이르렀고, 사우디아라비아와 요르단은 왕당파에 무기와 자금을 댔으며 영국은 아덴을 통해 왕당파를 돕는다는 의혹을 받았다. 이는 나세르 계열 아랍 민족주의와 왕정 사이의 이른바 아랍 냉전의 한 부분이었다. 1963년부터 1967년 사이 이집트군이 독가스를 썼다는 보고가 이어져 국제 적십자가 우려를 밝혔다. 1965년 8월 나세르와 사우디의 파이살 왕이 지다에서 휴전과 철군에 합의했으나 이듬해 깨졌다. 1967년 6일 전쟁에서 진 이집트군이 8월 하르툼 정상 회담 뒤 철수했고 11월 살랄이 쫓겨나 압둘라흐만 알이르야니가 대통령이 되었다. 12월부터 1968년 2월까지 왕당파와 일부 부족이 사나를 포위했으나 공화파가 막아 냈다. 사망자는 추산이 크게 갈려 이집트군 사망만 1만 5,000~2만 6,000명이고 예멘인 전체로는 10만 명 이상을 든다. 1970년 사우디아라비아가 공화국을 승인해 전쟁이 끝났고 왕당파 인사 일부가 정부에 들어갔다."
  subjects: [yemen-kingdom, yemen-arab-republic, united-arab-republic, saudi-arabia, jordan, uk]
  links:
    - { from: yemen-arab-republic, to: yemen-kingdom, note: "군사 혁명으로 왕정 타도 (1962)" }
  tags: [politics, war]
  sources: ["Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "Fred Halliday, Arabia without Sultans (Penguin Books, 1974)", "Malcolm H. Kerr, The Arab Cold War: Gamal 'Abd al-Nasir and His Rivals, 1958–1970 (3rd ed., Oxford University Press, 1971)"]

- id: aden-independence-1963
  year: 1963
  endYear: 1994
  title:
    ko: "아덴 비상 사태와 남예멘의 독립, 예멘의 통일과 1994년 내전(1963~1994)"
  summary:
    ko: "영국은 1959년부터 아덴 둘레의 술탄국과 아미르국을 모아 연방을 만들게 했고 1963년 1월 아덴 식민지가 남아라비아 연방에 합류했다. 같은 해 10월 라드판 산악 지대에서 시작된 무장 투쟁은 12월 아덴에 비상 사태가 선포되는 데 이르렀다. 1960년대 중반에는 이집트가 후원하는 점령 남예멘 해방 전선(FLOSY)과 사회주의 성향의 민족 해방 전선(NLF)이 서로 싸우며 영국군과 맞섰다. 영국은 1966년 2월 백서에서 1968년까지 철수하겠다고 밝혔고 1967년 6월 20일 아덴 크레이터에서 영국군 20여 명이 죽는 사건 뒤 영국은 철수를 서둘렀고 라헤즈 술탄국을 포함한 연방의 술탄들은 힘을 잃었다. 1967년 11월 30일 NLF가 남예멘 인민 공화국의 독립을 선포했다. 1970년 예멘 인민 민주 공화국으로 이름을 바꾸어 소련·동독·쿠바와 가까워졌고 농지 개혁과 국유화를 밀어붙였다. 1986년 1월 집권당 내 두 파의 충돌이 벌어져 수천에서 1만 명 이상이 죽었고 알리 살림 알베이드가 당을 이끌었다. 1989~1990년 소련의 후원이 흔들리고 석유 발견으로 두 예멘이 협상해 1990년 5월 22일 예멘 아랍 공화국(북)과 남예멘이 통일해 예멘 공화국이 되었고 북의 알리 압둘라 살레가 대통령, 알베이드가 부통령이 되었다. 1990년 걸프 전쟁 때 예멘은 이라크를 비판하지 않아 사우디아라비아와 쿠웨이트에서 많은 예멘인 노동자가 쫓겨났다. 1993년 선거 뒤 북남 정치 세력의 갈등이 깊어졌고 1994년 5월 5일 내전이 벌어져 알베이드 세력이 분리 선언을 했으나 7월 7일 북의 군이 아덴을 차지해 끝났다. 이 내전의 사망자는 수천 명으로 추산된다."
  subjects: [aden-protectorate, lahej-sultanate, south-yemen, yemen-arab-republic, yemen, uk, soviet-union]
  links:
    - { from: yemen-arab-republic, to: south-yemen, note: "통일로 예멘 공화국 수립 (1990)" }
  tags: [politics, war]
  sources: ["Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)", "Fred Halliday, Revolution and Foreign Policy: The Case of South Yemen, 1967–1987 (Cambridge University Press, 1990)", "Stephen Day, Regionalism and Rebellion in Yemen: A Troubled National Union (Cambridge University Press, 2012)"]

- id: six-day-war-1967
  year: 1967
  endYear: 1970
  title:
    ko: "6일 전쟁과 이스라엘의 점령, 소모전(1967~1970)"
  summary:
    ko: "1967년 5월 이집트의 나세르가 시나이의 유엔 긴급군에 철수를 요구하고(16~19일) 티란 해협을 이스라엘 선박에 닫았으며(22일) 30일 요르단과 방위 조약을 맺었다. 6월 5일 이스라엘이 이집트 공군 기지를 먼저 공격해 6일 전쟁이 시작되었고(이스라엘은 선제 방어, 아랍 쪽은 침략이라 부른다) 요르단과 시리아가 참전했으나 6월 10일 휴전까지 이스라엘이 시나이반도·가자 지구·요르단강 서안과 동예루살렘·골란 고원을 점령했다. 사망자는 이집트 약 1만~1만 5,000명(사망·실종), 요르단 약 700명, 시리아 1,000~2,500명으로 추산되는 반면 이스라엘 쪽은 약 800~980명이다. 서안에서 약 28만~32만 명, 골란에서 약 10만 명이 피란했거나 쫓겨났다(추산). 이스라엘은 6월 27일 예루살렘에 이스라엘 법을 적용했고 점령지에 정착촌을 세우기 시작했는데, 이는 유엔 안전 보장 이사회와 국제 사법 재판소가 국제법에 어긋난다고 해석했으며 이스라엘 정부는 이를 받아들이지 않았다. 아랍 연맹은 8~9월 하르툼 정상 회담에서 평화·승인·협상을 하지 않는다는 이른바 세 가지 거부를 결의했다. 11월 22일 안전 보장 이사회 결의 242호는 점령지에서의 이스라엘군 철수와 지역 모든 나라의 안전한 국경을 함께 요구했는데 영문과 프랑스어 문안의 차이로 철수 범위는 해석이 갈린다. 1968~1970년 수에즈 운하를 사이에 둔 소모전에서는 1970년 8월 미국의 로저스 안에 따라 휴전이 되었다. 같은 해 9월 28일 나세르가 죽어 사다트가 뒤를 이었다. 팔레스타인인 사이에서는 이 패배로 아랍 나라들에 대한 기대가 줄고 팔레스타인 해방 기구 같은 독자적인 무장 조직의 비중이 커졌다."
  subjects: [israel, united-arab-republic, jordan, syria, west-bank, gaza-strip, sinai-israeli-occupation, soviet-union, usa]
  links:
