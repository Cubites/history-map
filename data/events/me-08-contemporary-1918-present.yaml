- id: libya-qaddafi-1969
  year: 1969
  endYear: 2020
  title:
    ko: "카다피의 리비아와 2011년 내전(1969~2020)"
  summary:
    ko: "1969년 9월 1일 스물일곱 살의 군 장교 카다피와 자유 장교단이 쿠데타로 이드리스 1세를 몰아냈다. 혁명 지휘 평의회는 1970년 영국·미국 기지를 철수시키고 이탈리아인 정착민을 추방했으며 1971년 이후 석유 회사를 국유화했다. 카다피는 『녹색 서』에서 대의제를 부정하는 직접 민주주의를 내세워 1977년 3월 사회주의 인민 리비아 아랍 자마히리야를 선포했으나 실제 권력은 그와 혁명 위원회·보안 기관이 쥐었다. 1973년에는 차드 북부 아우주 띠를 점령했는데 이는 1994년 국제 사법 재판소 판결로 차드에 돌아갔다. 1986년 4월 서베를린 디스코 폭탄 공격(미군 2명 포함 3명 사망)을 리비아의 소행이라 본 미국이 트리폴리와 벵가지를 폭격했고 1988년 12월 팬암 103편 폭파(승객·승무원 259명과 지상 11명, 모두 270명 사망)의 용의자로 리비아 정보 요원들이 지목되어 1992년 유엔 제재가 시작되었다. 1999년 용의자를 넘기고 2003년 대량 살상 무기 계획을 포기하면서 제재가 풀렸다. 2011년 2월 17일 벵가지의 시위가 무장 충돌로 번져 내전이 되었고, 3월 17일 유엔 안보리 결의 1973호가 민간인 보호를 이유로 비행 금지 구역을 허용하자 북대서양 조약 기구가 군사 개입을 했다. 8월 트리폴리가 함락되었고 10월 20일 카다피는 시르테에서 붙잡혀 숨졌다. 내전 사망자는 확인 집계 약 6,000명에서 임시 정부 쪽 주장 3만 명 이상까지 추산이 갈린다. 이후 2014년 5월 하프타르 장군의 군이 벵가지에서 작전을 벌이며 동부의 토브룩 의회와 서부 트리폴리의 정부로 나라가 나뉘었다. 2019년 4월 하프타르 쪽이 트리폴리를 공격했으나 튀르키예가 도운 트리폴리 정부가 막았고, 2020년 10월 23일 영구 휴전이 합의되었다. 2014~2020년 전투의 사망자는 한 집계로 최소 1만 4,000여 명이다."
  subjects: [libya, usa, uk]
  links: []
  tags: [politics, war]
  sources: ["Dirk Vandewalle, A History of Modern Libya (2nd ed., Cambridge University Press, 2012)", "Ronald Bruce St John, Libya: From Colony to Revolution (rev. ed., Oneworld Publications, 2012)", "Jason Pack 편, The 2011 Libyan Uprisings and the Struggle for the Post-Qadhafi Future (Palgrave Macmillan, 2013)", "Muammar al-Qaddafi, The Green Book (Public Establishment for Publishing, Advertising and Distribution, Tripoli, 1975–1981)", "유엔 안전 보장 이사회, 「결의 1973호」(2011년 3월 17일 채택)"]

- id: sadat-egypt-1970
  year: 1970
  endYear: 1982
  title:
    ko: "사다트의 이집트와 캠프 데이비드 협정, 시나이 반환(1970~1982)"
  summary:
    ko: "1970년 9월 28일 나세르가 죽고 부통령 안와르 사다트가 대통령이 되었다. 사다트는 1971년 5월 나세르계 정치인을 숙청하고 9월 나라 이름을 이집트 아랍 공화국으로 바꾸어 아랍 연합 공화국이라는 이름을 버렸다. 1971년 5월 소련과 우호 협력 조약을 맺었으나 1972년 7월 소련 군사 고문단을 내보냈고(조약은 1976년 파기) 1973년 10월 이스라엘을 공격했는데 전쟁은 「4차 중동 전쟁(1973~1974)」(뒤의 사건)이 다룬다. 1974년 경제 개방(인피타) 정책으로 외국 자본을 들이고 보조금을 줄이자 1977년 1월 빵값 폭동이 일어나 수십 명이 죽었다. 1977년 11월 사다트는 예루살렘을 방문해 이스라엘 의회에서 연설했고 1978년 9월 미국 대통령 카터의 중재로 이스라엘 총리 베긴과 캠프 데이비드 협정에 합의했다. 1979년 3월 26일 워싱턴에서 이집트-이스라엘 평화 조약이 서명되어 이스라엘이 시나이반도를 3년에 걸쳐 돌려주고 이집트가 이스라엘을 승인하기로 했다. 조약은 팔레스타인의 자치 문제를 구체화하지 않아 아랍 연맹이 이집트의 자격을 정지하고 본부를 카이로에서 튀니스로 옮겼으며, 팔레스타인인과 많은 아랍인은 이를 배신으로 받아들였다. 1980년 이집트와 이스라엘은 대사를 교환했고 1978년 사다트와 베긴은 노벨 평화상을 받았다. 1980년 1월 이집트가 엘아리시선까지 돌려받는 단계가 지나고 1981년 9월 사다트가 반대파를 대거 체포했다. 1981년 10월 6일 열병식에서 이슬람 지하드 계열 군인들이 사다트를 암살해 호스니 무바라크가 뒤를 이었다. 1982년 4월 25일 이스라엘이 타바를 뺀 시나이반도에서 마지막으로 철수했다."
  subjects: [united-arab-republic, arab-republic-of-egypt, sinai-israeli-occupation, israel, usa, soviet-union]
  links:
    - { from: israel, to: arab-republic-of-egypt, note: "평화 조약에 따른 시나이 단계적 반환 (1979~1982)" }
  tags: [politics, diplomacy, war]
  sources: ["The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)", "William B. Quandt, Camp David: Peacemaking and Politics (Brookings Institution, 1986)", "Avi Shlaim, The Iron Wall: Israel and the Arab World (W. W. Norton, 2000)"]

- id: october-war-1973
  year: 1973
  endYear: 1974
  title:
    ko: "4차 중동 전쟁(1973~1974)"
  summary:
    ko: "1973년 10월 6일 이집트와 시리아가 이스라엘이 6일 전쟁에서 차지한 땅을 되찾으려 각각 수에즈 운하와 골란 고원에서 기습 공격을 시작했다. 이스라엘에서는 이 날이 유대교의 속죄일(욤 키푸르)이어서 욤 키푸르 전쟁, 아랍에서는 라마단 전쟁(10월 전쟁)이라 부른다. 이집트군은 이스라엘이 운하 동쪽에 쌓은 바르레브 방어선을 건너 시나이 안쪽으로 전진했고 시리아군은 골란에서 한때 큰 성과를 올렸으나 이스라엘이 예비군을 동원해 막았다. 이스라엘은 반격으로 운하를 건너 이집트 3군을 포위했다. 전쟁 전 사다트는 시리아의 하페즈 알아사드와 함께 이스라엘의 방심을 노려 공격을 준비했다. 미국은 이스라엘에 공중 수송으로 무기를 보냈고 소련은 이집트·시리아를 지원해 두 나라가 긴장했다. 10월 22일 유엔 안보리 결의 338호가 휴전을 요구했고 25일 휴전이 자리잡았다. 사망자는 이스라엘 약 2,600~2,800명, 이집트 약 5,000~15,000명, 시리아 약 3,500~8,000명으로 추산이 크게 갈린다. 10월 17일 아랍 석유 수출국 기구(OAPEC)가 사우디아라비아를 포함해 이스라엘을 지원한 나라에 석유 수출을 줄이는 결정을 했고 이는 「석유 파동과 신자유주의」(같은 시기의 사건)가 다룬다. 미국 국무 장관 키신저의 왕복 외교로 1974년 1월 시나이 군대 분리 협정, 5월 골란 군대 분리 협정이 맺어졌다. 이스라엘은 군사적으로 이겼으나 개전 초의 정보 실패를 조사한 아그라나트 위원회의 결과로 1974년 4월 골다 메이어 총리가 물러났고 이집트는 전쟁에서 얻은 자신감으로 협상에 나설 수 있었다. 아랍 세계에서는 이 전쟁이 6일 전쟁의 패배를 어느 정도 만회한 일로 받아들여졌다."
  subjects: [arab-republic-of-egypt, syria, israel, sinai-israeli-occupation, saudi-arabia, usa, soviet-union]
  links: []
  tags: [war, diplomacy, economy]
  sources: ["Abraham Rabinovich, The Yom Kippur War: The Epic Encounter That Transformed the Middle East (Schocken Books, 2004)", "William B. Quandt, Peace Process: American Diplomacy and the Arab-Israeli Conflict since 1967 (3rd ed., Brookings Institution Press, 2005)", "Avi Shlaim, The Iron Wall: Israel and the Arab World (W. W. Norton, 2000)", "유엔 안전 보장 이사회, 「결의 338호」(1973년 10월 22일 채택)"]

- id: lebanon-civil-war-1975
  year: 1975
  endYear: 1990
  title:
    ko: "레바논 내전과 타이프 협정(1975~1990)"
  summary:
    ko: "레바논은 종파별로 권력을 나눈 국민 협약 위에 서 있었고, 1960년대 말부터 팔레스타인 해방 기구(PLO) 무장 조직이 남부를 근거지로 삼으며 이를 받아들이는 문제를 두고 마론파 중심의 보수 세력과 이슬람·좌파 세력이 갈라졌다. 1975년 4월 13일 베이루트 아인 알루마네에서 팔레스타인인 버스가 공격받은 사건을 시작으로 내전이 터졌다. 1976년 시리아가 군대를 보냈고 처음에는 PLO에 맞섰으며 이후 아랍 억지군의 이름으로 머물렀다. 1978년 이스라엘이 남부를 침공해 유엔 레바논 임시군(UNIFIL)이 설치되었고, 1982년 6월 이스라엘이 PLO를 몰아내려 베이루트까지 진격하자 PLO는 8월 레바논을 떠나 튀니스로 옮겼다. 9월 14일 대통령 당선자 바시르 제마옐이 암살된 뒤 16~18일 사브라와 샤틸라 난민촌에서 팔랑헤당 중심의 마론파 민병대가 팔레스타인·레바논 민간인을 학살했고 이스라엘군은 난민촌 외곽을 막고 조명탄으로 지원했다. 사망자는 레바논 군 검찰 460명, 이스라엘 정보기관 700~800명, 팔레스타인 적신월사 2,000명 넘게 등으로 갈리고 연구자 추산은 3,500명까지 이른다. 이스라엘 조사 위원회는 이스라엘 지휘부에 간접 책임이 있다고 판단하고 샤론 국방 장관의 개인 책임도 물어 퇴임을 권고했다. 1983년 베이루트의 미국 해병대·프랑스군 병영 자살 폭탄 공격으로 미군 241명과 프랑스군 58명이 죽었고 다국적군은 철수했다. 이스라엘군은 1985년 남부 일부에 안전 지대를 두고 그곳에 계속 머물렀다. 이란의 도움으로 시아파 정당이자 무장 조직 헤즈볼라가 힘을 얻었다. 1989년 10월 사우디아라비아의 중재로 타이프 협정이 맺어져 의석을 기독교와 이슬람에 같게 나누고 총리 권한을 키웠다. 11월 대통령 르네 무아와드가 당선 17일 만에 암살되고 엘리아스 흐라위가 뒤를 이었으며, 1990년 10월 시리아군이 미셸 아운의 저항을 눌러 내전이 끝났다. 사망자는 12만~15만 명으로 추산되며 1만 7,000명 안팎이 실종되었다. 헤즈볼라를 뺀 민병대가 해산되었다."
  subjects: [lebanon, syria, israel, usa]
  links: []
  tags: [war, politics, society]
  sources: ["Fawwaz Traboulsi, A History of Modern Lebanon (Pluto Press, 2007)", "Kamal Salibi, A House of Many Mansions: The History of Lebanon Reconsidered (I. B. Tauris, 1988)", "Robert Fisk, Pity the Nation: The Abduction of Lebanon (Nation Books, 2002)", "「타이프 협정」(1989년 10월 22일 합의)"]

- id: western-sahara-1975
  year: 1975
  endYear: 2026
  title:
    ko: "서사하라: 녹색 행진과 마드리드 협정, 사하라 아랍 민주 공화국, 모래 둑(1975~2026)"
  summary:
    ko: "스페인령 사하라는 인광석과 대서양 어장이 있는 땅으로, 1973년 폴리사리오 전선이 스페인에 맞선 독립 투쟁을 시작했다. 모로코와 모리타니가 옛 영유권을 주장하자 국제 사법 재판소는 1975년 10월 16일 권고 의견에서 두 나라와의 옛 유대가 영토 주권은 아니라고 했다. 1975년 11월 6일 모로코는 국민 수십만 명(모로코 쪽 추산 35만 명)을 평화 행진(녹색 행진)에 동원해 경계를 넘게 했고 11월 14일 스페인·모로코·모리타니가 마드리드 협정으로 스페인의 철수와 행정의 이양을 합의했다. 스페인은 1976년 2월 26일 철수했고 이튿날 폴리사리오 전선이 사하라 아랍 민주 공화국을 선포했다. 모로코가 북쪽 3분의 2, 모리타니가 남쪽을 차지했으며 알제리가 폴리사리오 전선을 후원했다. 사하라위 주민 상당수는 알제리 틴두프 근처 난민촌으로 옮겨 갔고 난민 수는 모로코와 폴리사리오 사이에 크게 다르게 주장된다. 모리타니는 1978년 쿠데타 뒤 1979년 8월 폴리사리오와 평화 협정을 맺고 물러났으며 모로코가 그 몫도 차지했다. 모로코는 1980년부터 1987년까지 여섯 단계로 사막에 모래 둑(모로코 장벽)을 쌓았다. 아프리카 단결 기구가 1984년 사하라 아랍 민주 공화국을 받아들이자 모로코는 기구에서 탈퇴했다. 1991년 9월 유엔 중재로 휴전했고 주민 투표를 준비할 유엔 서사하라 주민 투표 지원단(MINURSO)이 파견되었으나 유권자 자격을 두고 의견이 달라 투표는 열리지 않았다. 1975~1991년 전쟁 사망자는 약 1만 4,000~2만 1,000명으로 추산된다. 모로코는 이 땅을 자국의 일부로 보고 자치안을 내놓았고 폴리사리오 전선은 자결권과 주민 투표를 요구하며, 유엔은 이 땅을 비자치 지역으로 둔다. 2020년 11월 휴전이 깨져 장벽 일대의 전투가 되살아났고 12월 미국이 모로코의 주권을 인정했다. 2025년 10월 31일 유엔 안전 보장 이사회 결의 2797호(찬성 11, 기권 3: 중국·러시아·파키스탄, 알제리는 표결에 참여하지 않음)는 서사하라 주민 투표 지원단의 임기를 2026년 10월 31일까지 한 해 늘리고, 모로코의 자치안을 협상의 바탕으로 삼아 진정한 자치가 가장 현실적인 결과일 수 있다고 밝혔다. 프랑스는 서사하라의 현재와 미래가 모로코 주권의 틀 안에 있다고 말했고 폴리사리오 전선은 이 결의가 모로코의 주권을 인정하는 것이 아니라고 말했다. 2026년 10월 30일 안전 보장 이사회는 미국이 낸 안(찬성 11, 러시아의 거부권 행사, 기권 3)과 임기를 2027년 10월 31일까지 늘리자는 러시아의 안(찬성 3, 미국 반대, 기권 11)을 모두 채택하지 못했고, 10월 31일 임기가 끝나는 지원단의 앞날은 유엔 기록 기준으로 정해지지 않은 채 남았다."
  subjects: [spanish-sahara, western-sahara-disputed, western-sahara-free-zone, sahrawi-republic, morocco, mauritania, spain, algeria]
  links: []
  tags: [politics, war, diplomacy]
  sources: ["Stephen Zunes·Jacob Mundy, Western Sahara: War, Nationalism, and Conflict Irresolution (Syracuse University Press, 2010)", "Tony Hodges, Western Sahara: The Roots of a Desert War (Lawrence Hill, 1983)", "국제 사법 재판소, 「Western Sahara, Advisory Opinion, I.C.J. Reports 1975」", "「마드리드 협정」(1975년 11월 14일 서명)", "유엔 안전 보장 이사회, 「결의 2797호」(2025년 10월 31일 채택)", "유엔 안전 보장 이사회 제10126차 회의 보도 자료 SC/16498(2026년 10월 30일)"]

- id: iran-revolution-1978
  year: 1978
  endYear: 1981
  title:
    ko: "이란 혁명과 이슬람 공화국의 성립, 미국 대사관 인질 사건(1978~1981)"
  summary:
    ko: "무함마드 레자 샤는 1963년 토지 개혁과 여성 참정권 등 백색 혁명을 밀어붙였고 석유 수입으로 군과 근대 사업을 키웠으나 비밀경찰(사바크)과 소수 계층의 부, 서구화에 대한 반발이 쌓였다. 1964년 샤를 비판하다 추방된 호메이니는 이라크 나자프를 거쳐 1978년 10월 파리로 갔다. 1978년 1월 쿰의 시위를 시작으로 40일 주기의 추모 시위가 전국으로 번졌다. 8월 아바단 렉스 극장 화재로 400여 명이 죽자 샤의 책임이 의심되었고, 9월 8일 테헤란 잘레 광장에서 군이 시위대에 발포했다(사망자는 정부 발표 86명, 혁명 세력 주장은 수천 명으로 크게 달랐으나 뒤의 조사는 90명 안팎(잘레 광장 64명, 테헤란 전체 88명 안팎)으로 본다). 가을에 석유 노동자들의 파업이 경제를 멈추었다. 1979년 1월 16일 샤가 나라를 떠났고 2월 1일 호메이니가 돌아왔고 수백만 명이 테헤란 거리에 나왔으며 2월 11일 군이 중립을 선언해 바크티아르 정부가 무너지면서 팔라비 왕조가 끝났다. 4월 1일 국민 투표(찬성 98% 안팎으로 발표)로 이슬람 공화국이 선포되었다. 11월 4일 학생들이 미국 대사관을 점거해 52명을 444일 동안 억류했고 이는 1981년 1월 20일 풀려났다. 미국은 인질 사건 뒤 이란 자산을 동결했고 1980년 4월 군사 구출 작전이 실패했다. 12월에 헌법이 이슬람 법학자의 통치(벨라야테 파키흐)와 최고 지도자 제도를 정했다. 온건파 바자르간 정부는 11월 사퇴했고 1980년 대통령이 된 바니사드르는 1981년 6월 탄핵되었다. 인민 무자헤딘 같은 무장 반대 세력의 암살·폭탄 공격과 정부의 탄압이 맞물리는 가운데 혁명 법원의 처형이 샤 정권 관리에서 반대파로 번져 수천 명이 처형되었다는 추산이 있으나 집계는 단체마다 크게 갈린다."
  subjects: [pahlavi-iran, iran, usa]
  links:
    - { from: iran, to: pahlavi-iran, note: "혁명으로 왕정 타도, 이슬람 공화국 선포 (1979)" }
  tags: [politics, religion, society]
  sources: ["Ervand Abrahamian, A History of Modern Iran (Cambridge University Press, 2008)", "Nikki R. Keddie, Modern Iran: Roots and Results of Revolution (Yale University Press, 2003)", "Ervand Abrahamian, Iran between Two Revolutions (Princeton University Press, 1982)"]

- id: iran-iraq-war-1980
  year: 1980
  endYear: 1988
  title:
    ko: "이란–이라크 전쟁과 할라브자(1980~1988)"
  summary:
    ko: "이란 혁명 뒤 이란의 군 지휘부가 흔들리자 1980년 9월 이란(14일)과 이라크(17일)가 잇따라 1975년 알제 협정을 파기한다고 선언했고 사담 후세인은 샤트알아랍 강과 후제스탄을 차지하려 했다. 1980년 4월 이라크가 시아파 지도자 바키르 알사드르를 처형하자 두 나라 국경에서 포격과 상호 비난이 커졌고, 이란은 미국 대사관 인질 사건으로 국제적으로 고립되어 있었다. 이라크는 1980년 9월 22일 이란을 침공했으나 이란이 1982년 5~6월 호람샤르를 되찾고 반격해 전선이 이라크 안쪽으로 옮겨 갔다. 이후 몇 해 동안 이란은 혁명 수비대와 지원병을 앞세운 인해 전술로 바스라를 공격했고 이라크는 겨자탄·신경가스 같은 화학 무기를 이란군과 쿠르드 마을에 썼다. 1981년 이스라엘이 이라크의 오시라크 원자로를 폭격했고 1986년 이란-콘트라 사건으로 미국이 이란에 비밀리에 무기를 판 일이 드러났다. 1984년부터는 유조선을 공격하는 유조선 전쟁이 벌어져 미국 군함이 쿠웨이트 유조선을 호위했고 1988년 7월 미국 군함 빈센스호가 이란 항공 655편을 격추해 승객·승무원 290명이 죽었다. 사우디아라비아와 쿠웨이트 등 걸프 나라는 이라크에 자금을 댔고 소련과 서방도 이라크에 무기를 팔았다. 1988년 3월 16일 이라크 쿠르드 도시 할라브자에서 이라크군이 화학 무기를 써서 3,200~5,000명이 죽었다는 추산이 있다. 1988년 이라크 정부의 알안팔 작전에서는 쿠르드인 5만~18만 2,000명이 죽거나 사라졌다는 추산이 인권 단체와 쿠르드 쪽에서 나온다. 이란은 유엔 안보리 결의 598호(1987)를 1988년 7월 받아들였고 8월 20일 휴전했으며 국경은 전쟁 전과 거의 같았다. 사망자는 양쪽을 합쳐 약 50만 명(추산 45만~100만 명)으로 추산이 크게 갈린다."
  subjects: [iran, iraq, kuwait, saudi-arabia, usa, soviet-union]
  links: []
  tags: [war, politics]
  sources: ["Efraim Karsh, The Iran–Iraq War, 1980–1988 (Osprey Publishing, 2002)", "Charles Tripp, A History of Iraq (3rd ed., Cambridge University Press, 2007)", "Human Rights Watch, Genocide in Iraq: The Anfal Campaign against the Kurds (1993)", "유엔 안전 보장 이사회, 「결의 598호」(1987년 7월 20일 채택)"]

- id: mubarak-egypt-1981
  year: 1981
  endYear: 2014
  title:
    ko: "무바라크 시대와 2011년 혁명, 무르시와 2013년 정변(1981~2014)"
  summary:
    ko: "호스니 무바라크는 1981년 10월 사다트 암살 뒤 임시 대통령 수피 아부 탈레브가 8일 동안 자리를 지킨 다음 대통령이 되어 비상 사태법으로 반대파를 누르며 약 30년을 집권했다. 이집트는 이스라엘과의 평화 조약을 지키고 미국의 군사·경제 원조를 받았으며 1990~1991년 걸프 전쟁에는 다국적군으로 참가했다. 1990년대에는 이슬람 무장 단체가 정부와 외국인 관광객을 공격해 1997년 룩소르에서 외국인 관광객 등 약 60명이 죽었다. 2000년대에는 빈부 격차와 청년 실업이 커졌고 2005년 처음으로 복수 후보가 대통령 선거에 나왔으나 야당 후보가 탄압받았다. 2011년 1월 25일 튀니지 혁명에 힘입은 청년들이 카이로 타흐리르 광장에서 시위를 시작해 18일 만인 2월 11일 무바라크가 물러났다. 조사 위원회는 이 18일 동안 시위대 800여 명이 죽었다고 보았다. 군 최고 평의회가 과도 통치를 맡았고 2012년 6월 무슬림 형제단의 무함마드 무르시가 첫 자유 선거로 대통령이 되었다. 무르시가 2012년 11월 사법부를 제한하는 선언을 내놓고 이슬람주의에 치우친 헌법을 밀어붙이자 반발이 커져 2013년 6월 30일 대규모 시위가 일어났고 7월 3일 국방 장관 압델 파타 알시시가 이끄는 군이 무르시를 몰아냈고 헌법 재판소장 아들리 만수르가 임시 대통령을 맡았다. 지지자들은 이를 쿠데타라 불렀고 정부는 시민의 요구에 따른 군의 개입이라 불렀다. 8월 14일 카이로의 라바와 알나흐다 농성장을 보안군이 해산하며 정부 발표 638명(경찰 43명 포함), 인권 단체 휴먼 라이츠 워치 집계 최소 817명(라바 광장), 무슬림 형제단 쪽 주장 약 2,600명이 죽었다. 이집트 정부는 12월 무슬림 형제단을 테러 단체로 지정했고 2014년 5월 알시시가 대통령에 뽑혔다. 아랍의 봄 전체는 「아랍의 봄(2010~2012)」(뒤의 사건)이 다룬다."
  subjects: [arab-republic-of-egypt, israel, usa]
  links: []
  tags: [politics, society]
  sources: ["The Cambridge History of Egypt, vol. 2: Modern Egypt, from 1517 to the End of the Twentieth Century (M. W. Daly 편, Cambridge University Press, 1998)", "Human Rights Watch, All According to Plan: The Rab'a Massacre and Mass Killings of Protesters in Egypt (2014)", "Jason Brownlee·Tarek Masoud·Andrew Reynolds, The Arab Spring: Pathways of Repression and Reform (Oxford University Press, 2015)"]

- id: intifada-1987
  year: 1987
  endYear: 1995
  title:
    ko: "1차 인티파다와 독립 선언, 오슬로 협정(1987~1995)"
  summary:
    ko: "1967년부터 점령 아래 있던 서안과 가자에서 1987년 12월 8일 가자 에레즈 검문소 근처에서 이스라엘 트럭이 팔레스타인 노동자들의 차량을 덮쳐 4명이 죽은 일을 계기로 이튿날 자발리야 난민촌에서 시위가 터졌고, 대규모 시민 불복종과 투석, 파업이 번져 1차 인티파다(봉기)가 되었다. 지역에서 조직된 통합 민족 지도부와 같은 달 세워진 하마스가 이를 이끌었고 PLO 지도부는 튀니스에 있었다. 인티파다 기간 이스라엘 쪽 인권 단체 베첼렘은 팔레스타인인 약 1,100명이 이스라엘 보안군에 죽었다고 집계하고 이스라엘인 약 160~200명이 죽었다고 하며(1987년 12월~1993년 9월) 팔레스타인인끼리 협력자로 몰려 죽은 사람도 770~940명(추산)이다. 1988년 7월 요르단의 후세인이 서안과의 법적·행정적 관계를 끊었고 11월 15일 알제에서 PLO의 팔레스타인 민족 의회가 독립을 선언하며 유엔 결의 181호와 242호를 받아들였다. 이 선언은 이스라엘을 사실상 승인한 것으로 읽혔다. 걸프 전쟁 때 PLO가 이라크 쪽에 선 뒤 약해진 입지에서 1991년 10월 마드리드 회담에 참여했다. 노르웨이에서 비밀리에 진행된 협상 끝에 1993년 9월 13일 워싱턴에서 오슬로 협정(원칙 선언)이 서명되어 아라파트와 라빈이 악수했다. 이스라엘과 PLO는 서로를 승인했고 1994년 5월 카이로에서 맺은 가자·예리코 협정으로 팔레스타인 자치 정부가 서고 1994년 10월 이스라엘과 요르단은 평화 조약을 맺었다. 1995년 9월 오슬로 2 협정이 서안을 A·B·C 구역으로 나누었는데 C구역은 이스라엘이 행정과 안보를 맡았다. 하마스 등의 자살 폭탄 공격으로 이스라엘 민간인이 죽었고 1995년 11월 4일 라빈이 이스라엘 극우 청년에게 암살되었다. 협정의 최종 지위 문제(예루살렘·난민·정착촌·국경)는 미뤄져 풀리지 않았고 그 사이 서안의 이스라엘 정착민은 계속 늘었다."
  subjects: [palestine, west-bank, gaza-strip, israel, jordan, arab-republic-of-egypt]
  links: []
  tags: [politics, war, diplomacy]
  sources: ["Rashid Khalidi, The Iron Cage: The Story of the Palestinian Struggle for Statehood (Beacon Press, 2006)", "Avi Shlaim, The Iron Wall: Israel and the Arab World (W. W. Norton, 2000)", "Zachary Lockman·Joel Beinin 편, Intifada: The Palestinian Uprising against Israeli Occupation (South End Press, 1989)", "「원칙 선언」(오슬로 협정, 1993년 9월 13일 서명)", "유엔 총회 「결의 181호」(1947년 11월 29일 채택)와 안전 보장 이사회 「결의 242호」(1967년 11월 22일 채택)", "「팔레스타인 독립 선언」(1988년 11월 15일 알제 선포)"]

- id: gulf-war-1990
  year: 1990
  endYear: 1991
  title:
    ko: "이라크의 쿠웨이트 침공과 걸프 전쟁(1990~1991)"
  summary:
    ko: "이란과의 전쟁으로 큰 빚을 진 이라크는 쿠웨이트의 대출 상환 요구와 유가를 떨어뜨리는 증산, 국경 유전의 석유 채굴을 문제 삼았다. 1990년 8월 2일 이라크군이 쿠웨이트를 침공해 점령했고 8월 8일 쿠웨이트의 합병을 선언하고 28일 이라크의 19번째 주로 삼았다. 유엔 안전 보장 이사회는 즉시 철수를 요구하고(결의 660호) 경제 제재를 결의했으며(661호) 11월 29일 1991년 1월 15일까지 철수하지 않으면 무력을 쓸 수 있다고 결의했다(678호). 미국이 주도한 30여 개 나라의 다국적군에는 사우디아라비아·이집트·시리아가 참가했고 요르단·예멘·PLO는 이라크에 동정적이거나 중립이었다. 미국은 1990년 8월부터 사우디아라비아에 50만 명 안팎의 병력을 모았다. 1991년 1월 17일 공습으로 시작된 사막의 폭풍 작전은 2월 24일 지상전으로 이어져 100시간 만에 쿠웨이트가 되찾아졌다. 이라크는 이스라엘과 사우디아라비아를 스커드 미사일로 공격했고 후퇴하며 쿠웨이트의 유정 수백 곳에 불을 질렀다. 다국적군의 전사자는 300명 안팎이고 이라크군 사망자는 2만~5만 명 안팎으로 추산되고, 전쟁과 뒤의 봉기를 합친 이라크 사망이 14만~20만 명이라는 추산(의학 단체 메닥트)도 있다. 전쟁 뒤 3월 이라크 남부 시아파와 북부 쿠르드인이 봉기했으나 정부군에게 짓눌려 수만 명이 죽었고 100만 명 넘는 난민이 생겼으며, 연합국은 북부와 남부에 비행 금지 구역을 두었다. 결의 687호는 이라크의 대량 살상 무기를 없애도록 하고 유엔 사찰을 정했으며 제재는 이어져 이라크 민간인의 삶에 큰 피해를 주었다는 평가를 받는다. 쿠웨이트는 전쟁 때 나간 팔레스타인인 노동자 20만 명 안팎이 뒤에 쫓겨나는 일도 겪었다."
  subjects: [iraq, kuwait, saudi-arabia, syria, israel, usa]
  links:
    - { from: iraq, to: kuwait, note: "침공과 병합 선언 (1990)" }
  tags: [war, diplomacy, politics]
  sources: ["Lawrence Freedman·Efraim Karsh, The Gulf Conflict, 1990–1991: Diplomacy and War in the New World Order (Princeton University Press, 1993)", "Charles Tripp, A History of Iraq (3rd ed., Cambridge University Press, 2007)", "Michael R. Gordon·Bernard E. Trainor, The Generals' War: The Inside Story of the Conflict in the Gulf (Little, Brown, 1995)", "유엔 안전 보장 이사회, 「결의 660호」(1990년 8월 2일 채택)·「결의 661호」(1990년 8월 6일)·「결의 678호」(1990년 11월 29일)·「결의 687호」(1991년 4월 3일)"]

- id: algeria-civil-war-1991
  year: 1991
  endYear: 2002
  title:
    ko: "알제리 선거 중단과 1990년대 내전(1991~2002)"
  summary:
    ko: "1988년 10월 식량 부족에 항의하는 시위가 진압되어 수백 명이 죽은 뒤 알제리는 1989년 헌법으로 복수 정당을 허용했다. 1989년 헌법과 정당법으로 합법화된 이슬람 구국 전선(FIS)이 1990년 6월 지방 선거에서 이기고 1991년 12월 26일 국회 의원 선거 1차 투표에서 가장 많은 의석을 얻었다. 1992년 1월 군이 샤들리 벤제디드 대통령을 물러나게 하고 선거를 중단했으며 FIS를 해산했다. 군은 최고 국가 위원회를 세워 2월 비상 사태를 선포하고 FIS 지지자 수천 명을 사하라의 수용소에 가두었다. 그러자 이슬람 무장 단체의 공격이 시작되어 1992년 6월 무함마드 부디아프 최고 국가 위원회 의장이 암살되고 알리 카피가 뒤를 이었다. 군 주도의 정부와 이슬람 구국군(AIS), 더 급진적인 무장 이슬람 단체(GIA)가 맞서 1990년대 중반 민간인 학살이 잇따랐고 1997년 9월 벤탈하 등에서 수백 명이 죽었다. 학살의 책임을 두고 GIA의 소행이라는 정부 쪽 설명과 보안군이 연루되었다는 의혹을 제기하는 연구자·인권 단체 사이에 논쟁이 이어진다. 사망자 추산은 연구자에 따라 4만~5만 명에서 15만~20만 명까지 크게 갈리고 실종자는 7,000~1만 8,000명이라는 집계가 있다. 1993년 이후 언론인과 지식인의 암살이 잇따랐다. 1994년 1월 리아민 제루알이 국가 원수가 되어 1995년 선거로 대통령에 뽑혔고, 1999년 압델아지즈 부테플리카가 대통령이 되었으며, 1996년 개정 헌법은 종교에 바탕을 둔 정당을 금지했다. 1999년 시민 화합법은 무기를 내려놓은 이들에게 사면을 주었다. GIA는 1994년 이후 외국인도 겨냥했으나 2002년 2월 지도자 안타르 주아브리의 사망 등으로 힘을 잃어 폭력이 크게 줄었다."
  subjects: [algeria]
  links: []
  tags: [politics, war, society]
  sources: ["Benjamin Stora, Algeria, 1830–2000: A Short History (Jane Marie Todd 옮김, Cornell University Press, 2001)", "Luis Martinez, The Algerian Civil War, 1990–1998 (Jonathan Derrick 옮김, Columbia University Press, 2000)", "Hugh Roberts, The Battlefield: Algeria 1988–2002: Studies in a Broken Polity (Verso, 2003)"]

- id: gaza-2000
  year: 2000
  endYear: 2022
  title:
    ko: "2차 인티파다와 가자 철수, 하마스의 가자 장악(2000~2022)"
  summary:
    ko: "2000년 7월 캠프 데이비드 정상 회담이 최종 지위 문제에서 합의 없이 끝난 뒤 9월 28일 아리엘 샤론이 예루살렘 성전산(하람 알샤리프)을 찾은 일을 계기로 2차 인티파다가 일어났다. 시위는 곧 무장 충돌과 팔레스타인 무장 조직의 자살 폭탄 공격, 이스라엘군의 서안 재점령(2002년 방어의 방패 작전)과 분리 장벽 건설로 번졌다. 2000~2005년 집계로 팔레스타인인 약 3,000~3,350명과 이스라엘인 약 1,000명이 죽었다. 2004년 11월 아라파트가 죽어 마흐무드 아바스가 이듬해 팔레스타인 자치 정부 수반이 되었다. 2005년 8~9월 이스라엘은 가자의 정착촌 21곳과 군을 철수시켰다. 2006년 1월 의회 선거에서 하마스가 이겨 파타와 갈등이 격해졌고 2007년 6월 하마스가 가자에서 파타 세력을 몰아내 가자 지구는 하마스, 서안의 자치 지역은 파타가 이끄는 자치 정부가 나누어 다스리게 되었다. 이스라엘과 이집트는 가자의 국경을 봉쇄했다. 2008년 12월~2009년 1월 가자에서 이스라엘 남부로 로켓이 이어지자 이스라엘이 캐스트 리드 작전으로 가자를 공격했고 팔레스타인인 1,100~1,400명과 이스라엘인 13명이 죽었다. 2012년 11월 29일 유엔 총회는 팔레스타인을 비회원 옵서버 국가로 올렸고, 2014년 7~8월 하마스 등의 로켓 발사와 이스라엘의 공습·지상전이 맞선 전쟁에서 유엔 집계로 팔레스타인인 2,251명(대부분이 민간인이라고 유엔은 집계)과 이스라엘인 73명이 죽었다. 2021년 5월 11일간의 충돌에서도 팔레스타인인 250명 안팎과 이스라엘인 13명이 죽었다. 2022년 8월에는 이스라엘군과 가자의 이슬람 지하드가 사흘 동안 맞서 싸웠다. 서안의 이스라엘 정착촌은 국제법에 어긋난다는 안보리와 국제 사법 재판소의 판단에도 이스라엘 정부는 이를 받아들이지 않은 채 늘렸고 정착민은 수십만 명이 되었다."
  subjects: [palestine, west-bank, gaza-strip, israel, arab-republic-of-egypt]
  links: []
  tags: [war, politics, society]
  sources: ["Rashid Khalidi, The Hundred Years' War on Palestine: A History of Settler Colonialism and Resistance, 1917–2017 (Metropolitan Books, 2020)", "Sara Roy, Hamas and Civil Society in Gaza: Engaging the Islamist Social Sector (Princeton University Press, 2011)", "Avi Shlaim, The Iron Wall: Israel and the Arab World (W. W. Norton, 2000)", "국제 사법 재판소, 「Legal Consequences of the Construction of a Wall in the Occupied Palestinian Territory」(권고 의견, 2004년 7월 9일)", "유엔 안전 보장 이사회, 「결의 2334호」(2016년 12월 23일 채택)"]

- id: iraq-war-2003
  year: 2003
  endYear: 2017
  title:
    ko: "이라크 전쟁과 이슬람 국가(2003~2017)"
  summary:
    ko: "미국과 영국은 이라크가 대량 살상 무기를 숨기고 있다며 유엔 안보리의 새 결의 없이 2003년 3월 20일 침공했고 4월 9일 바그다드가 함락되었다. 침공 뒤 대량 살상 무기는 발견되지 않았고 2004년 미국의 조사 보고서는 이라크가 1991년 뒤 그 계획을 폐기했다고 결론지었다. 연합군 임시 행정처(CPA)의 폴 브리머가 5월 바트당 간부 배제와 군 해산을 명령하자 많은 군인과 관리가 반발해 무장 저항이 거세졌고, 연합군의 작전과 2004년 폭로된 아부 그라이브 수용소의 포로 학대도 반미 감정을 키웠다. 2003년 12월 사담 후세인이 붙잡혀 2006년 12월 30일 처형되었다. 2005년 헌법이 연방제를 정했고 2006년 2월 사마라 시아파 성지 폭파 뒤 수니·시아 종파 폭력이 커졌다. 2007년 미군 증파와 수니 부족의 각성 운동으로 폭력이 줄었고 미군은 2011년 12월 철수했다. 대한민국은 2004년 9월 쿠르드 지역 아르빌에 자이툰 부대를 보내 약 3,000명 규모로 재건과 치안을 맡았다가 2008년 12월 철수했다. 사망자 추산은 이라크 보디 카운트가 보도로 확인한 민간인 폭력 사망 10만~11만 4,000명(2011년까지)에서, 의학 학술지 플로스 메디신 연구의 초과 사망 약 40만 5,000명(2011년 6월까지, 불확실 구간 4만 8,000~75만 1,000명, 폭력 사망 약 60%), 랜싯의 초과 사망 65만 명 안팎(2006년 7월까지)까지 갈린다. 미군은 4,400명 넘게 죽었다. 이라크 알카에다에서 갈라진 이슬람 국가(IS)는 2014년 6월 모술을 차지하고 6월 29일 칼리프국을 선포했고 이라크 서부와 시리아 동부를 지배하며 소수 종파 야지디인을 학살·납치했다. 이라크 정부군과 시아파 민병대, 페슈메르가와 미국이 이끄는 연합군의 공습이 맞서 2017년 7월 모술을 되찾았고 12월 9일 이라크 정부는 IS에 대한 승리를 선언했다."
  subjects: [iraq, usa, uk, rok, syria]
  links: []
  tags: [war, politics, society]
  sources: ["Charles Tripp, A History of Iraq (3rd ed., Cambridge University Press, 2007)", "Thomas E. Ricks, Fiasco: The American Military Adventure in Iraq (Penguin Press, 2006)", "William McCants, The ISIS Apocalypse: The History, Strategy, and Doomsday Vision of the Islamic State (St. Martin's Press, 2015)", "Charles Duelfer, Comprehensive Report of the Special Advisor to the DCI on Iraq's WMD (Central Intelligence Agency, 2004)"]

- id: arab-spring-2010
  year: 2010
  endYear: 2012
  title:
    ko: "아랍의 봄(2010~2012)"
  summary:
    ko: "2010년 12월 17일 튀니지 중부 시디부지드에서 노점상 무함마드 부아지지가 당국의 단속에 항의해 분신했고(2011년 1월 4일 숨짐) 실업과 부패에 분노한 시위가 전국으로 번졌다. 벤 알리 대통령은 2011년 1월 14일 사우디아라비아로 떠나 23년 집권을 마쳤다. 이 시위는 SNS와 위성 방송을 타고 아랍 세계로 번졌으며 이집트에서는 1월 25일에 시작되어 2월 11일 호스니 무바라크가 물러났고 이는 「무바라크 시대와 2011년 혁명, 무르시와 2013년 정변(1981~2014)」(앞의 사건)이 다룬다. 리비아에서는 2월 17일 시위가 내전으로 번져 카다피가 10월 숨졌고, 이는 「카다피의 리비아와 2011년 내전(1969~2020)」(앞의 사건)이 다룬다. 예멘에서는 1월부터 시위가 이어져 살레가 걸프 협력 회의의 중재안을 11월 받아들였고 2012년 2월 부통령 하디에게 권력을 넘겼다. 바레인에서는 2월 14일 진주 광장 시위를 걸프 협력 회의 군대(사우디아라비아군 등)가 3월 진압했는데 정부는 이를 외부 개입이 아닌 요청에 따른 지원이라 했고 야권은 외국군의 점령이라 불렀다. 시리아에서는 3월 시위가 내전으로 이어졌고 모로코에서는 2월 20일 운동 뒤 7월 국민 투표로 헌법이 고쳐져 국왕이 실권을 지켰다. 알제리와 요르단은 부분적 정치·경제 양보로 시위를 가라앉혔고 알제리는 2월 비상 사태를 풀었다. 튀니지에서는 2011년 10월 제헌 의회 선거에서 이슬람 정당 엔나흐다가 제1당이 되었다. 시위로 숨진 사람은 튀니지 300여 명, 이집트 800여 명, 예멘 2,000명 안팎, 바레인 수십 명으로 집계에 차이가 있다. 이후 결과는 나라마다 크게 달라 민주화가 이어진 곳, 권위주의가 돌아온 곳, 내전이 된 곳으로 갈렸다."
  subjects: [tunisia, arab-republic-of-egypt, libya, yemen, syria, bahrain, morocco, algeria, saudi-arabia]
  links: []
  tags: [politics, society]
  sources: ["Marc Lynch, The Arab Uprising: The Unfinished Revolutions of the New Middle East (PublicAffairs, 2012)", "Jason Brownlee·Tarek Masoud·Andrew Reynolds, The Arab Spring: Pathways of Repression and Reform (Oxford University Press, 2015)", "Kenneth Perkins, A History of Modern Tunisia (2nd ed., Cambridge University Press, 2014)"]

- id: syria-war-2011
  year: 2011
  endYear: 2026
  title:
    ko: "시리아 내전과 아사드 정권의 몰락(2011~2026)"
  summary:
    ko: "2011년 3월 남부 다라에서 낙서를 한 아이들이 체포된 일을 계기로 시위가 전국으로 번졌고 바샤르 알아사드 정부가 무력으로 진압하자 무장 저항이 일어나 내전이 되었다. 정부군에 맞선 반군(자유 시리아군 등)과 이슬람주의 세력이 갈렸고 유엔 조사 위원회와 인권 단체는 정부군의 통폭탄 공격과 구금자 고문·사망, IS와 일부 반군 세력의 민간인 학살과 납치를 함께 기록했고 2014년에는 이슬람 국가(IS)가 라카를 거점으로 이라크 북서부와 시리아 동부를 차지했다. 2013년 8월 21일 다마스쿠스 근교 구타에서 사린 가스 공격으로 수백에서 1,400명 이상(추산이 갈림)이 죽었고 유엔 조사단은 사린이 쓰였다고 확인했다. 2015년 9월 러시아가 정부 쪽에서 공습으로 개입했고 이란과 레바논 헤즈볼라, 이란계 민병대도 도왔다. 쿠르드 중심의 시리아 민주군(SDF)은 미국의 도움으로 IS와 싸워 2017년 라카, 2019년 3월 바구즈를 차지했다. 사망자 추산은 시리아 인권 관측소가 2025년 기준 약 65만 6,000명(민간인 20만 명 넘게), 유엔 인권 최고 대표 사무소가 2011년 3월~2021년 3월 민간인 30만 6,887명이 직접 죽었다고 추산하며 유엔 집계에는 굶주림·의료 붕괴 같은 간접 사망이 빠져 있다. 2021년 3월 기준 난민 약 660만 명과 국내 실향민 약 670만 명이 생겼다. 2024년 11월 27일 하이야트 타흐리르 알샴(HTS)이 서북부에서 공세를 시작해 12월 8일 다마스쿠스가 함락되었고 아사드는 러시아로 떠났다. 2025년 1월 29일 HTS 지도자 아흐마드 알샤라가 과도기 대통령에 임명되었으며 3월 13일 5년 과도기를 정하는 헌법 선언이 서명되었다. 3월 6~12일 시리아 연안 지방에서 아사드 지지 무장 세력이 정부 건물과 보안군을 공격하자 정부군과 동맹 무장 세력이 알라위파 민간인을 대거 죽이는 충돌이 일어났고, 민간인 사망자는 시리아 인권 네트워크 집계 823명에서 시리아 인권 관측소 집계 1,700명까지 갈리며 정부 쪽 보안군과 아사드 지지 무장 세력도 수백 명이 죽었다. 3월 10일 SDF를 정부 구조에 통합하는 합의가 서명되었다. 7월에는 남부 스웨이다에서 드루즈 무장 세력과 베두인 무장 세력, 정부군이 충돌했고 이스라엘이 다마스쿠스 등을 공습했다. 2026년 1월 13~30일 정부군이 SDF와 싸워 라카와 데이르에조르를 차지했고 1월 18일과 30일 휴전과 통합 합의가 맺어졌다."
  subjects: [syria, iraq, lebanon]
  links: []
  tags: [war, politics, society]
  sources: ["Charles Lister, The Syrian Jihad: Al-Qaeda, the Islamic State and the Evolution of an Insurgency (Hurst, 2015)", "Lisa Wedeen, Authoritarian Apprehensions: Ideology, Judgment, and Mourning in Syria (University of Chicago Press, 2019)", "Raymond Hinnebusch, Syria: Revolution from Above (Routledge, 2001)", "유엔 인권 최고 대표 사무소, Report on Civilian Deaths in the Syrian Arab Republic (2022년 6월)"]

- id: yemen-war-2014
  year: 2014
  endYear: 2026
  title:
    ko: "예멘 내전과 사우디아라비아가 이끈 연합군의 개입(2014~2026)"
  summary:
    ko: "아랍의 봄 뒤 예멘에서는 2012년 압드라보 만수르 하디가 대통령이 되었으나 경제난과 지역 불만 속에서 자이드파 계열의 후티(안사르 알라) 무장 세력이 북부에서 힘을 키웠다. 후티는 2014년 9월 21일 사나를 장악했고 하디는 이듬해 3월 아덴을 거쳐 사우디아라비아로 떠났다. 2015년 3월 26일 사우디아라비아와 아랍에미리트가 이끄는 연합군이 하디 정부를 돕겠다며 공습을 시작했다. 연합군의 공습으로 민간인이 죽고 민간 시설이 피해를 입었고 후티도 도시를 포격하고 사람들을 구금했으며 사우디아라비아를 향해 미사일과 드론을 쏘았다. 양쪽의 지뢰와 소년병 사용이 유엔 전문가 보고서에서 지적되었다. 후티는 이란의 지원을 받는다고 연합군과 미국이 말하고 후티와 이란은 이를 부인하는 가운데 전선은 홍해 항구 호데이다와 타이즈, 마리브에서 굳었다. 2017년 12월 후티와 갈라선 전 대통령 살레가 후티에게 살해되었다. 남부에서는 2019년 8월 남부 과도 위원회(STC)가 아덴을 차지했고 11월 리야드 협정으로 정부와 나누어 권한을 쥐기로 했으나 갈등이 이어졌다. 2018년 12월 스웨덴에서 호데이다 휴전이 합의되었다. 2022년 4월 2일 유엔 중재 휴전이 시작되었고 4월 7일 하디가 권한을 대통령 지도 위원회(의장 라샤드 알알리미)에 넘겼으며 휴전은 10월 만료되었으나 전면 전투는 대부분 멈추었다. 유엔 개발 계획은 2021년 말까지 직접·간접 사망자를 모형으로 추정해 37만 7,000명(약 60%는 굶주림·질병 같은 간접 사망)으로 보았고 이 가운데 약 15만 명이 폭력으로 죽었다. 기근과 콜레라가 퍼져 2025년 인도주의 대응 계획에서 유엔은 1,950만 명이 도움이 필요하다고 밝혔다. 2023년 가자 전쟁이 시작된 뒤 후티는 홍해를 지나는 배를 공격했고 미국과 영국이 공습으로 맞섰다. 2025년 12월 STC가 남동부 하드라마우트와 마흐라를 차지했으나 2026년 1월 사우디아라비아가 지원한 정부군이 두 주를 되찾았고, 1월 9일 리야드의 STC 간부들이 해산을 발표했으나 아랍에미리트의 대변인과 간부들은 이를 거부했다."
  subjects: [yemen, saudi-arabia, united-arab-emirates, iran, usa, uk]
  links: []
  tags: [war, politics, society]
  sources: ["Stacey Philbrick Yadav, Islamists and the State: Legitimacy and Institutions in Yemen and Lebanon (I. B. Tauris, 2013)", "Helen Lackner, Yemen in Crisis: Autocracy, Neo-liberalism and the Disintegration of a State (Saqi Books, 2017)", "Paul Dresch, A History of Modern Yemen (Cambridge University Press, 2000)"]

- id: gaza-war-2023
  year: 2023
  endYear: 2026
  title:
    ko: "2023년 10월 7일 공격과 가자 전쟁(2023~2026)"
  summary:
    ko: "2023년 10월 7일 하마스가 이끈 무장 세력이 가자 지구에서 이스라엘 남부로 들어가 공격해 이스라엘 쪽 집계로 약 1,200명이 죽고 251명이 인질로 끌려갔다. 죽은 사람의 다수가 민간인이었고 이스라엘군도 포함되었다. 이스라엘군은 지상 작전 뒤 병사 460여 명이 죽었다고 밝혔다. 이스라엘은 가자 공습과 10월 27일 지상군 투입으로 맞서 하마스를 무너뜨리고 인질을 되찾겠다고 했다. 가자 보건부 집계로 사망자는 2025년 10월 15일 무렵 6만 7,938명(유엔 인도주의 업무 조정국 인용)에 이르렀고 휴전 뒤에도 늘었으며 다수가 여성과 어린이라고 보건부는 밝히나 이스라엘은 사망자 가운데 하마스 전투원이 큰 몫이라고 주장한다. 의학 학술지 랜싯의 연구들은 보건부의 집계가 사망 규모를 낮게 잡았을 가능성을 제기했다. 가자 인구 약 220만 명 가운데 대부분이 피란을 겪었고 유엔 기구가 지원하는 식량 위기 분류(IPC)는 2025년 8월 가자 주(가자시와 주변)에 기근을 선언했다. 이스라엘은 이를 반박했고, IPC는 휴전 뒤 12월 19일 가자에서 기근 기준에 더는 해당하지 않는다고 발표했으나 식량 위기는 여전히 심각하다고 밝혔다. 2023년 11월 24일 일주일 휴전으로 인질 100여 명이 풀려났고 2025년 1월 휴전이 3월 깨졌으며 10월 10일 미국이 이집트·카타르 등과 중재한 계획의 1단계로 휴전이 발효되어 생존 인질 20명이 10월 13일 풀려났다. 11월 17일 유엔 안전 보장 이사회 결의 2803호(찬성 13, 기권 2: 중국·러시아)는 이 계획을 지지하고 평화 위원회와 국제 안정화군의 설치를 허가했다. 2026년 1월 15일 미국 대통령 트럼프가 평화 위원회의 구성을 알렸고 22일 다보스에서 19개국 대표가 헌장에 서명했으며 니콜라이 믈라데노프가 가자 고위 대표를 맡았다. 2024년 1월 남아프리카 공화국의 제소로 국제 사법 재판소가 이스라엘에 집단 학살 방지 조치를 명령했고 11월 국제 형사 재판소는 네타냐후 이스라엘 총리와 갈란트 전 국방 장관, 하마스 군사 지도자 무함마드 데이프에게 체포 영장을 발부했다(데이프의 영장은 2025년 2월 사망이 확인되어 효력을 잃었다). 2025년 9월 유엔 인권 이사회가 세운 독립 국제 조사 위원회는 이스라엘이 집단 학살 협약이 정한 행위 다섯 가운데 넷을 저질렀다고 결론지었고, 같은 위원회는 2024년 6월 보고서에서 하마스 등 팔레스타인 무장 단체의 10월 7일 공격과 인질 억류도 전쟁 범죄라고 판단했다. 이스라엘 정부는 이 판단을 받아들이지 않았다. 앞의 사건 「2차 인티파다와 가자 철수, 하마스의 가자 장악(2000~2022)」이 이 전쟁의 배경을 다룬다."
  subjects: [gaza-strip, israel, arab-republic-of-egypt, usa]
  links: []
  tags: [war, politics, society]
