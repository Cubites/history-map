- id: oman-sib-treaty-1920
  year: 1920
  endYear: 1976
  title:
    ko: "시브 조약과 오만 이맘국, 도파르 반란과 카부스(1920~1976)"
  summary:
    ko: "오만은 해안의 부사이드 가문 술탄과 내륙 이바드파 이맘이 갈려 있었다. 영국이 1891년 이래 술탄을 보호했고, 1913년 내륙 부족들이 살림 알하루시를 이맘으로 세워 술탄 타이무르(재위 1913~1932)에 맞서 봉기했다. 이맘 군은 1915년 무스카트 가까이 바이트 알팔라즈까지 쳐들어갔으나 영국령 인도군에게 막혔고, 1920년 이맘 알하루시가 암살되어 무함마드 알칼릴리가 뒤를 이은 가운데, 9월 25일 영국 정치 대표의 중재로 술탄과 이맘 사이에 시브 조약이 맺어졌다. 조약은 술탄이 해안과 대외 관계를, 내륙 고원(다힐리야·자히라·북샤르키야)이 부족 자치를 지니도록 나눈 것으로 이해되었다. 술탄 타이무르가 1932년 물러나고 아들 사이드 빈 타이무르(재위 1932~1970)가 이어받았다. 1954년 이맘 무함마드 알칼릴리가 죽고 갈립 이맘이 석유 탐사권을 둘러싸고 독립을 내세워 술탄·영국과 다시 다투자 술탄군이 그해 파하드 유전 지대를, 1955년 니즈와를 차지했으나 1957년 7월 이맘 쪽이 다시 일어났다. 1957~1959년 술탄군과 영국군은 자발 아크다르 산지로 물러난 이맘 쪽을 쳐서 1959년 1월 이맘국을 무너뜨렸고 갈립은 사우디아라비아로 망명했다. 사이드는 학교·병원 같은 근대 시설과 외부 교류를 막은 폐쇄 정책을 폈고 남쪽 도파르에서는 1962년 반란이 일어났으며, 1967년 남예멘이 독립한 뒤에는 남예멘의 도움을 받은 마르크스주의 계열 인민 해방 전선이 번졌다. 1970년 7월 23일 사이드의 아들 카부스가 영국의 도움 속에 아버지를 몰아내고 술탄이 되어 나라 이름을 오만 술탄국으로 바꾸었다. 카부스는 석유 수입으로 학교·병원·도로를 세우고 이란과 요르단의 도움을 받아 1975~1976년 도파르 반란을 누르고 그 뒤를 평정했다."
  subjects: [oman, oman-imamate, uk, south-yemen]
  links: []
  tags: [politics, war, religion]
  sources: ["J. E. Peterson, Oman in the Twentieth Century: Political Foundations of an Emerging State (Croom Helm, 1978)", "Calvin H. Allen Jr.·W. Lynn Rigsbee II, Oman under Qaboos: From Coup to Constitution, 1970–1996 (Frank Cass, 2000)", "Fred Halliday, Arabia without Sultans (Penguin Books, 1974)"]

- id: palestine-mandate-1921
  year: 1921
  endYear: 1939
  title:
    ko: "팔레스타인 위임 통치와 유대인 이주, 아랍 대봉기(1921~1939)"
  summary:
    ko: "위임 통치 규약에는 영국이 유대인 민족 고향을 세우도록 돕는다는 「밸푸어 선언」의 내용이 들어 있었고, 이는 「후세인–맥마흔 서한과 아랍 반란, 사이크스–피코 협정과 밸푸어 선언(1915~1918)」(앞의 사건)이 다룬 일이다. 위임 통치기 팔레스타인의 인구는 1922년 영국 인구 조사에서 약 76만 명으로 유대인이 약 11%였으나 1930년대 말에는 유대인이 30% 안팎으로 늘었다. 1921년 5월 야파의 충돌과 1929년 8월 서벽 문제에서 시작된 충돌(예루살렘·헤브론·사페드)에서 유대인과 아랍인 양쪽에서 수백 명이 죽었다. 1922년 6월 처칠 백서는 유대인 민족 고향이 팔레스타인 전체를 뜻하지 않는다고 밝혔고 9월 국제 연맹 이사회가 승인한 트란스요르단 각서는 요르단강 동쪽(트란스요르단)을 유대인 민족 고향 조항에서 뺐으며, 유대인 기관은 토지 구입과 농업 정착촌을 늘렸고 유대인 공동체(이슈브)는 자치 조직을 키웠다. 아랍 쪽에서는 예루살렘의 무프티 하지 아민 알후세이니가 최고 이슬람 위원회를 이끌었다. 1933년 이후 나치 독일의 박해를 피한 유대인 이민이 급증했고 1935년 한 해에만 약 6만 명이 들어왔다. 1936년 4월 총파업이 시작되고 아랍 고등 위원회가 이를 이끌며 시작된 대봉기(1936~1939)는 영국의 위임 통치, 토지 매각과 이민 증가에 맞선 농민 중심의 무장 항쟁이었다. 영국은 필 위원회(1937)의 분할안을 거두고 대규모 군을 보내 진압했는데, 이 과정에서 아랍인 사망자는 영국 집계 2,000여 명(전투 사망)에서 칼리디의 5,000명 안팎까지 갈리고 아랍 지도층 다수가 추방되거나 구금되었다. 유대인은 약 500명, 영국 보안군도 260여 명이 죽었으며 하가나 같은 유대인 무장 조직의 영국군 협력과 이르군의 보복 폭력도 있었다. 1939년 5월 백서는 유대인 이민을 5년 동안 7만 5,000명으로 제한하고 토지 매입을 막았으며 10년 안에 독립 팔레스타인을 세우기로 했으나 양쪽 모두의 반발을 샀다."
  subjects: [mandatory-palestine, transjordan, uk]
  links: []
  tags: [politics, society, war]
