- id: ibn-saud-conquests-1919
  year: 1919
  endYear: 1927
  title:
    ko: "이븐 사우드의 하일 병합과 히자즈 정복, 히자즈·네지드 왕국(1919~1927)"
  summary:
    ko: "압둘아지즈(이븐 사우드)는 1차 대전 중 영국과 다린 조약(1915)을 맺어 보호를 받았지만 샤리프 후세인이 이끄는 히자즈와 오스만 제국 편에 섰던 하일의 자발 샴마르 라시드 가문이라는 두 경쟁자가 남아 있었다. 그의 군대의 중심은 와하브 운동의 가르침에 따라 정착촌에 모인 부족민 이흐완이었다. 1919년 5월 투라바에서 이흐완이 샤리프 후세인의 아들 압둘라(훗날 압둘라 1세)의 군대를 크게 깨뜨렸고, 1920년에는 아시르 고원의 아브하를 차지했다. 같은 해 쿠웨이트 쪽 자흐라에서는 이흐완이 쿠웨이트 군에 막혔다. 1921년 11월 2일 하일이 항복해 자발 샴마르가 네지드에 병합되었고 압둘아지즈는 네지드의 술탄을 칭했으며, 1922년에는 자우프와 북부 국경 지대를 차지했다. 1922년 12월 우카이르 의정서에서 영국 고등 판무관 퍼시 콕스가 중재자로 네지드·이라크·쿠웨이트의 경계와 두 곳의 중립 지대를 정했다. 영국은 1915년 이래 압둘아지즈에게 주던 보조금을 1924년 끊었다. 1924년 3월 튀르키예 공화국이 칼리프 제도를 없애자 후세인이 칼리프를 칭했고, 이는 이슬람 세계에서 반발을 샀다. 1924년 이흐완과 네지드군이 9월 타이프를 차지했고 10월 메카에 들어갔으며 후세인은 아들 알리에게 히자즈 왕위를 넘기고 떠났다. 1925년 마안과 아카바 쪽 땅은 트란스요르단의 압둘라가 접수했고, 12월 메디나와 제다가 항복해 히자즈 왕국이 끝났다. 1926년 1월 8일 압둘아지즈는 메카에서 히자즈 왕으로 즉위해 히자즈·네지드 왕국을 이루었다. 정복지의 성묘 참배 방식과 이흐완의 폭력은 순례객과 이웃 나라의 불만을 샀다. 영국은 1927년 지다 조약으로 압둘아지즈의 완전한 독립을 인정했다."
