- id: rama-i-bangkok-1782
  year: 1782
  endYear: 1795
  title:
    ko: "짜끄리 왕조의 성립과 방콕 천도(1782~1795)"
  summary:
    ko: "딱신은 말년에 정신이 흐려졌다는 기록과 함께 관료·승려와 사이가 벌어졌고, 1781년 말 톤부리에서 반란이 일어났다. 캄보디아 원정에서 돌아온 장군 짜오프라야 짜끄리(통두앙)가 반란을 눌렀고, 딱신은 1782년 4월 처형되었다. 짜끄리는 1782년 4월 6일 라마 1세로 즉위해 짜끄리 왕조(재위 1782~1809)를 열었다. 그는 강 서쪽의 톤부리가 버마의 공격에 약하다고 보아 강 동쪽 방콕(라따나꼬신)으로 수도를 옮겼고 왕궁은 1782년부터 짓기 시작했다. 에메랄드 불상은 1784년 새 왕궁의 사원에 모셨다. 이 불상은 딱신 때 비엔티안에서 가져온 것이다(1779년). 동생 수라시는 부왕(앞 궁)으로 군대를 맡았다. 1785년 말 콘바웅 왕조의 보도퍼야가 아홉 갈래로 군대를 보내 시암(지금의 타이)을 쳤으나(‘아홉 군대의 전쟁’, 1785~1786), 시암군이 이를 물리쳤고 이후 버마의 시암 원정은 되풀이되지 않았다. 라오스 쪽에서는 딱신 때 1778년과 1779년 사이 시암에 복속한 루앙프라방, 비엔티안, 참파삭이 짜끄리 왕조 아래에서도 속국으로 남았고, 1792년에는 우본이 방콕 직속의 도시가 되어 참파삭의 서쪽 땅이 시암 직할로 넘어왔다. 캄보디아에서는 방콕에서 자란 앙 엥이 1794년 왕으로 세워졌고, 그 대가로 시암은 바탐방과 시엠레아프를 직접 다스리게 되었다. 라마 1세는 아유타야의 법을 모아 1805년 삼인법전으로 정리하고 불경을 다시 엮는 등 나라의 틀을 아유타야의 전통 위에 세웠다. 대외적으로는 청에 조공 사절을 보내며 중국과의 무역도 이어 갔다. 이 사건은 「콘바웅 왕조의 아라칸 정복과 므라우우 왕국의 끝(1784~1785)」(뒤의 사건)과 같은 시기 버마의 팽창이 시암으로 향한 결과이기도 하다."
  subjects: [thailand, konbaung-dynasty, cambodia, luang-prabang-kingdom, vientiane-kingdom, champasak-kingdom]
  links:
    - { from: thailand, to: champasak-kingdom, note: "우본을 직속 도시로 삼아 서쪽 땅을 차지함 (1792)" }
    - { from: thailand, to: cambodia, note: "바탐방과 시엠레아프를 직접 다스리게 됨 (1794)" }
