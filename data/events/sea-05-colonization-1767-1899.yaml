- id: cambodia-protectorate-1863
  year: 1863
  endYear: 1867
  title:
    ko: "노로돔과 캄보디아의 프랑스 보호령(1863~1867)"
  summary:
    ko: "캄보디아는 17세기 이후 시암(지금의 타이)과 베트남 사이에서 두 나라의 종주권을 함께 받는 약한 왕국이었다. 앙두옹(재위 1848~1860) 때까지 이 틀이 이어졌고, 1860년 앙두옹이 죽자 그의 아들 노로돔(재위 1860~1904)이 왕위에 올랐으나 이복동생의 반란과 시암의 개입으로 어려움을 겪었다. 그는 프랑스가 사이공에 자리 잡은 사실을 이용하려 했다. 프랑스의 두다르 드 라그레 대령은 1863년 8월 11일 우동에서 노로돔과 보호 조약을 맺었다. 프랑스는 외교와 무역, 군사를 맡고 왕은 내정을 맡는 형식이었다. 하지만 노로돔은 시암에도 종속을 인정하는 비밀 조약을 맺어 두 나라 사이에 균형을 잡으려 했다. 시암이 가지고 있던 왕관을 둘러싼 갈등 끝에 노로돔은 1864년 6월 프랑스와 시암 대표가 함께 참석한 가운데 즉위식을 올렸다. 1866년에는 수도를 우동에서 프놈펜으로 옮겼다. 프놈펜은 메콩강, 톤레삽강, 바싹강이 만나는 곳이어서 무역에 알맞았다. 프랑스인 박물학자 앙리 무오는 1860년 앙코르 와트를 찾아 이를 유럽에 알렸고, 그의 사후 책(1863)이 나오면서 앙코르는 서양에서 널리 알려졌다. 1867년 7월 프랑스–시암 조약으로 시암은 프랑스의 보호를 인정하고, 프랑스는 바탐방과 시엠레아프가 시암 땅임을 인정했다. 이 두 주는 1907년에야 캄보디아에 돌아온다. 1884년 6월 총독 톰슨이 노로돔을 압박해 조약에 서명하게 했고 이에 반발한 봉기(1885~1887)가 일어났다. 보호령은 1884년 조약으로 프랑스가 직접 행정을 맡게 되었고 1887년 프랑스령 인도차이나 연방에 들어갔다(「껀브엉 운동과 프랑스령 인도차이나 연방(1885~1899)」(뒤의 사건))."
  subjects: [cambodia, thailand, france]
  links:
    - { from: thailand, to: cambodia, note: "프랑스–시암 조약으로 바탐방과 시엠레아프 지배를 인정받음 (1867)" }
  tags: [diplomacy, politics]
  sources: ["David Chandler, A History of Cambodia (Westview Press, 2008)", "Milton Osborne, The French Presence in Cochinchina and Cambodia: Rule and Response (1859–1905) (Cornell University Press, 1969)", "Henri Mouhot, Travels in the Central Parts of Indo-China (Siam), Cambodia, and Laos (John Murray, 1864)"]

- id: chulalongkorn-reforms-1868
  year: 1868
  endYear: 1905
  title:
    ko: "쭐랄롱꼰의 개혁과 노예제 폐지(1868~1905)"
  summary:
    ko: "쭐랄롱꼰(라마 5세)은 1868년 열다섯 살로 왕위에 올랐고(재위 1868~1910), 1873년 성년이 될 때까지 섭정 스리수리야웡이 나라를 맡았다. 그는 즉위 직후 서양 학자와 관리를 가까이 하며 왕궁 앞에서 엎드려 절하는 관례를 없앴다. 1874년에는 국무 회의와 추밀원을 두어 귀족의 독점을 줄이려 했으나, 부왕(앞 궁)을 두고 벌어진 갈등(1874~1875)으로 개혁은 한동안 늦춰졌다. 노예제는 1874년 법으로 1868년 이후 노예에게서 태어난 아이를 스물한 살에 풀어 주는 방식으로 줄여 갔고, 1905년 4월 1일 노예법으로 남은 노예를 모두 풀어 주었다. 평민에게 지우던 부역(프라이)은 인두세와 군 복무로 바뀌었다. 1892년에는 정부를 열두 개 부로 나눈 근대식 내각을 만들고 동생 담롱 라자누바프를 내무부 장관으로 삼았다. 지방은 몬톤 제도(「몬톤 제도와 란나·파타니의 편입(1892~1902)」(뒤의 사건))로 방콕의 직할로 묶었고, 철도는 1893년 방콕–팍남 노선을 시작으로 놓았으며 학교와 병원, 우편과 전신이 들어섰다. 쭐랄롱꼰은 1897년 유럽을 순방했다. 그 사이 시암(지금의 타이)은 영국과 프랑스 사이에 끼어 메콩 동쪽(1893)과 서쪽 땅(「1904년 파리 조약과 1907년 방콕 조약(1904~1907)」(뒤의 사건))을 잃고, 말레이 북부 네 주도 넘겼으나(「1909년 방콕 조약과 말레이 북부 네 주(1909)」(뒤의 사건)) 독립을 지켰다. 개혁은 왕권 강화와 영토 방위를 함께 노린 것이었다. 앞서 몽꿋이 연 개방(「몽꿋 왕과 보링 조약, 시암의 개방(1855~1868)」(앞의 사건))이 이 개혁의 바탕이 되었다."
  subjects: [thailand]
  tags: [politics, society]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Tamara Loos, Subject Siam: Family, Law, and Colonial Modernity in Thailand (Cornell University Press, 2006)"]

- id: aceh-war-1873
  year: 1873
  endYear: 1904
  title:
    ko: "아체 전쟁(1873~1904)"
  summary:
    ko: "아체 술탄국은 17세기 이스칸다르 무다 때 말라카 해협의 강국이었고 수마트라 북단에서 후추와 해협 무역으로 번영했으며, 1824년 영국–네덜란드 조약은 아체의 독립을 존중한다는 조항을 두었다. 1871년 수마트라 조약으로 영국이 이 조항을 풀자 네덜란드가 아체를 칠 길이 열렸다. 술탄이 싱가포르의 미국 영사와 접촉하자 네덜란드는 이를 구실로 1873년 3월 26일 선전했다. 첫 원정은 쾰러 장군이 전사하고 네덜란드군이 물러나면서 실패했다. 1873~1874년 두 번째 원정은 수도 쿠타라자(지금 반다아체)와 술탄 궁을 점령했고, 술탄 마흐무드 샤는 1874년 1월 콜레라로 숨졌다. 네덜란드는 술탄국이 끝났다고 선언했으나 아체 사람들은 알라웃딘 이브라힘 만수르 샤(재위 1857~1870)의 손자 무함마드 다우드 샤를 술탄으로 세워 항전했다. 이슬람 학자(울라마)와 귀족(울레발랑) 지도자들은 게릴라전으로 맞섰고 네덜란드는 1880년대에 요새선을 두고 방어에 머물렀다. 네덜란드의 이슬람 학자 스누크 후르흐론여가 아체 사회를 연구해 귀족과 손잡고 울라마를 누르라고 조언했고, 1898년 총독이 된 판 회츠(재임 1898~1904)가 이를 따라 작전을 폈다. 다우드 샤는 1903년 항복했고, 1904년 판 달런 대령의 군대가 가요와 알라스 지방에서 마을을 휩쓸었다. 사망자는 아체 쪽 약 5만~7만 명이고 네덜란드 쪽은 전투 2천여 명, 질병까지 합쳐 3만 5천 명 안팎으로 추산된다. 정부는 1904년을 평정의 해로 보지만 게릴라 저항은 1912년과 그 뒤까지 이어졌다(「네덜란드의 윤리 정책과 인도네시아 민족 운동의 시작(1901~1912)」(뒤의 사건)). 아체는 이후 네덜란드령 동인도에 완전히 편입되었다."
  subjects: [aceh-sultanate, dutch-east-indies, uk]
  links:
    - { from: dutch-east-indies, to: aceh-sultanate, note: "아체를 정복하고 술탄국을 없앰 (1873~1904)" }
  tags: [war, politics]
  places: [{ name: 쿠타라자 공격, at: [95.32, 5.55], year: 1874 }]
  sources: ["Anthony Reid, The Contest for North Sumatra: Atjeh, the Netherlands and Britain, 1858–1898 (Oxford University Press, 1969)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Paul van 't Veer, De Atjeh-oorlog (Arbeiderspers, 1969)"]

- id: pangkor-treaty-1874
  year: 1874
  endYear: 1896
  title:
    ko: "팡코르 조약과 영국 주재관, 연합 말레이 주(1874~1896)"
  summary:
    ko: "1870년대 페락의 라룻 지구에서는 주석 광산을 두고 중국인 비밀 결사(기힌과 하이산)가 싸웠고, 술탄 알리가 1871년 숨지자 왕위를 두고 라자 압둘라와 라자 이스마일이 맞섰다. 라룻의 주석 광산에서는 중국인 광부 수만 명이 일했고, 싱가포르의 중국인 상인과 말레이 정치인들이 각 파에 무기와 자금을 댔다. 해협 식민지 상인들은 질서를 바랐고, 총독 앤드루 클라크는 런던의 방침을 넓게 해석해 개입했다. 1874년 1월 20일 팡코르 섬 앞 증기선에서 맺은 조약으로 압둘라가 술탄으로 인정되었고, 그는 영국 주재관을 받아들였다. 주재관의 조언은 말레이 종교와 관습을 뺀 모든 일에 따라야 하고 비용은 페락 수입으로 댔다. 이 간접 통치는 이후 말레이 반도 영국령의 기본 틀이 되었다. 이스마일은 이를 인정하지 않았다. 초대 주재관 J. W. W. 버치는 세금 걷는 일을 영국이 맡으려 해 반발을 샀고, 1875년 11월 파시르 살락에서 살해되었다. 영국은 군대를 보냈고 1875~1876년 페락 전쟁에서 지도자들을 처벌해 압둘라를 세이셸로 보냈다. 페락은 이후 라자 유수프의 섭정을 거쳐 1886년 그를 술탄으로 세웠다. 같은 방식이 1874~1875년 슬랑오르와 슝가이 우종에 퍼졌고, 파항은 1888년 주재관을 받아들였다. 영국은 1895년 조약을 맺어 페락, 슬랑오르, 느그리슴빌란, 파항을 하나로 묶었다. 연합 말레이 주는 1896년 7월 1일 발효해 쿠알라룸푸르에 수도를 두고 총주재관(초대 프랭크 스웨트넘)이 통제했다. 술탄들은 이름뿐인 군주로 남았고 주석과 고무로 경제가 커지며 중국인과 인도인 이민자가 늘었다. 조호르를 비롯한 다른 주는 연합에 들지 않았다."
  subjects: [perak-sultanate, selangor-negeri-sembilan, pahang-sultanate, straits-settlements, uk]
  links:
    - { from: straits-settlements, to: perak-sultanate, note: "주재관을 두고 내정을 이끌게 됨 (1874)" }
  tags: [diplomacy, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "C. D. Cowan, Nineteenth-Century Malaya: The Origins of British Political Control (Oxford University Press, 1961)", "Khoo Kay Kim, The Western Malay States, 1850–1873 (Oxford University Press, 1972)"]

- id: north-borneo-brunei-1877
  year: 1877
  endYear: 1890
  title:
    ko: "북보르네오 회사와 브루나이의 영국 보호령(1877~1890)"
  summary:
    ko: "19세기 중엽 브루나이는 사라왁에 땅을 내주며 줄어들었고, 술탄 압둘 모민(재위 1852~1885)은 재정난에 시달렸다. 북보르네오는 17세기부터 브루나이와 술루가 영향권을 다투던 땅으로 인구가 적고 숲이 깊었다. 홍콩 주재 오스트리아 영사 오버벡 남작과 영국 상인 앨프리드 데이트는 1877년 12월 브루나이 술탄에게서 북보르네오 서해안 일대를 연금을 주는 조건으로 양허받았고, 1878년 1월 술루 술탄에게서 동해안 일대를 임차 또는 양도(문서 해석이 갈린다)받았다. 이 양도는 스페인의 반발을 샀으나 영국·독일·스페인이 1885년 마드리드 의정서로 이를 정리했다(「스페인의 술루 원정과 1851·1878년 협정(1848~1878)」(앞의 사건)). 데이트는 영국 정부로부터 1881년 11월 특허장을 받았고 북보르네오 회사가 1882년 출범해 산다칸을 중심으로 담배와 목재, 고무를 키웠다. 초기에는 담배 농장에 중국인 노동자를 들여왔다. 회사는 사라왁과 달리 영국 정부의 특허장을 받은 사기업으로서 안쪽 행정을 맡았고, 1888년 보호 조약 뒤로는 외교를 영국 정부가 맡았다. 회사는 사바를 1946년까지 다스렸고 그해 영국 직할 식민지가 되었다. 1882년에는 사라왁이 바람강 유역을 얻었고, 1884년 트루산에도 손을 뻗어 브루나이는 남은 땅이 더 줄었다. 영국은 1888년 브루나이, 사라왁, 북보르네오와 보호 조약을 맺어 이들의 외교권을 영국이 갖게 했다. 그러나 브루나이는 1890년 사라왁이 림방을 병합하면서 두 동강이 났다. 오늘날의 브루나이가 작은 나라로 남은 뿌리가 이 시기에 있다(「제임스 브룩과 사라왁 라자국(1841~1868)」(앞의 사건))."
  subjects: [north-borneo, brunei, sarawak, sulu-sultanate, uk]
  links:
    - { from: north-borneo, to: brunei, note: "서해안 양허를 얻음 (1877~1878)" }
    - { from: sarawak, to: brunei, note: "림방을 병합함 (1890)" }
  tags: [politics, diplomacy, economy]
  sources: ["Nicholas Tarling, Britain, the Brookes and Brunei (Oxford University Press, 1971)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "K. G. Tregonning, A History of Modern Sabah, 1881–1963 (University of Malaya Press, 1965)"]

- id: hue-treaties-1883
  year: 1883
  endYear: 1884
  title:
    ko: "후에 조약과 안남·통킹 보호령(1883~1884)"
  summary:
    ko: "뜨득 황제는 1883년 7월 후사 없이 죽었고, 궁정에서는 섭정 똔 텃 투옛과 응우옌 반 뜨엉이 황제를 세우고 갈아치웠다. 뜨득은 36년 재위 동안 프랑스의 압박과 가뭄, 반란에 시달렸다. 뜨득의 조카 죽득은 즉위한 지 사흘 만에 쫓겨나 옥사했고, 동생 히엡화가 이어받아 넉 달쯤 앉았다가(1883년 7월 30일~11월 29일) 독살되었다. 이 틈을 타 프랑스는 8월 20일 투언안 요새를 공격했고, 히엡화 정부는 1883년 8월 25일 하르망 조약(제1차 후에 조약)을 맺었다. 이로써 베트남 중북부는 안남과 통킹의 보호령이 되어 프랑스가 외교와 군사를 맡았다. 조약은 남쪽 빈투언을 코친차이나에 붙이고 응에안, 하띤, 타인호아를 통킹에 붙이는 내용도 담았다. 히엡화가 죽은 뒤 끼엔푹(1883~1884)이 올랐으나 몇 달 만에 병으로 숨졌고, 이어 어린 함응이가 1884년 8월 올랐다. 프랑스는 1884년 6월 6일 파트노트르 조약(제2차 후에 조약)으로 베트남이 청의 종주권을 벗고 프랑스의 보호를 받는다는 내용을 확정했다. 통킹과 안남에는 프랑스 주재관이 오고 안남에서는 황제가 내정을 유지하되 프랑스 감독 아래 놓였다. 이 조약으로 응우옌 왕조의 독립은 형식만 남았다. 조약은 베트남이 청 황제에게 받은 인장을 반환하게 했고 프랑스는 청과의 전쟁(「청불 전쟁과 톈진 조약(1883~1885)」(뒤의 사건))으로 이를 굳혔다. 응우옌 왕조 영토는 이제 코친차이나가 떨어져 나간 데 이어 안남 보호령과 통킹 보호령으로 나뉘어 프랑스가 직접 통치하는 몫이 늘어났다. 이 일은 곧 조정 안의 저항(「껀브엉 운동과 프랑스령 인도차이나 연방(1885~1899)」(뒤의 사건))을 낳는다."
  subjects: [nguyen-dynasty, annam-protectorate, tonkin-protectorate, france, qing]
  links:
    - { from: nguyen-dynasty, to: annam-protectorate, note: "안남을 프랑스의 보호령으로 내줌 (1883~1884)" }
    - { from: nguyen-dynasty, to: tonkin-protectorate, note: "통킹을 프랑스의 보호령으로 내줌 (1884)" }
  tags: [diplomacy, politics, war]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Pierre Brocheux and Daniel Hémery, Indochina: An Ambiguous Colonization, 1858–1954 (University of California Press, 2009)", "「하르망 조약」(1883)", "「파트노트르 조약」(1884)"]

- id: krakatoa-1883
  year: 1883
  title:
    ko: "크라카타우 화산 폭발(1883)"
  summary:
    ko: "순다 해협의 크라카타우 섬 화산은 1883년 5월 20일 분화를 시작해 여름 내내 재와 증기를 뿜었다. 이 섬은 북쪽의 페르부와탄, 가운데 다난, 남쪽의 라카타 세 화산 봉우리가 한 섬을 이룬 것이었다. 8월 26일 오후 1시 무렵부터 폭발이 거세졌고 27일 아침에 가장 큰 폭발이 연이어 일어나 섬 대부분이 사라졌다. 화산재 기둥은 27~80킬로미터 높이(자료에 따라 갈림)까지 솟았다고 한다. 폭발음은 3천 킬로미터 넘게 떨어진 서오스트레일리아 퍼스와 4천 8백 킬로미터 떨어진 로드리게스 섬에서도 들렸다고 기록되어 가장 큰 소리로 꼽힌다. 해일이 해협 양쪽 해안을 덮쳤다. 폭발 소식은 막 깔린 전신선을 타고 몇 시간 안에 유럽에 알려졌다. 서자와 반튼의 메락은 높이 수십 미터의 파도에 파괴되었다고 하며, 수마트라 람풍 해안에서도 마을이 쓸려 갔다. 네덜란드 당국이 낸 공식 사망자 수는 3만 6천 4백 17명(반튼 약 2만 1천 6백 명, 람풍 약 1만 2천 5백 명, 바타비아 약 2천 3백 명 등)이고, 추산에 따라 이보다 적거나 많다. 마을 165곳이 파괴되고 132곳이 큰 피해를 입었다고 한다. 대기 중 화산재와 황산 에어로졸은 여러 해 동안 석양을 붉게 물들였고 북반구 여름 기온이 이듬해 약 0.4도 내려갔다. 폭발이 일으킨 기압파는 지구를 여러 바퀴 돌았다. 서자와 해안은 오래 황폐해졌고 해안 주민이 줄었다. 일부 학자는 이 재난이 반튼에서 이슬람 지도자의 영향력을 키워 1888년 질레곤 반란의 배경이 되었다고 본다. 네덜란드령 동인도 정부는 구호와 복구를 맡았으나 피해 지역의 회복은 느렸고, 1927년 폭발 자리에서 새 화산 아낙 크라카타우가 솟아올랐다."
  subjects: [dutch-east-indies]
  tags: [society]
  places: [{ name: 크라카타우 폭발, at: [105.42, -6.1], year: 1883 }]
  sources: ["Simon Winchester, Krakatoa: The Day the World Exploded, August 27, 1883 (HarperCollins, 2003)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Tom Simkin and Richard S. Fiske, Krakatau 1883: The Volcanic Eruption and Its Effects (Smithsonian Institution Press, 1983)"]

- id: third-anglo-burmese-war-1885
  year: 1885
  endYear: 1886
  title:
    ko: "제3차 영국–버마 전쟁과 콘바웅 왕조의 끝(1885~1886)"
  summary:
    ko: "민돈의 뒤를 이은 티보(재위 1878~1885)는 즉위하면서 경쟁이 될 왕족을 대거 죽였다고 전해지고, 왕비 수파야랏이 궁정을 쥐고 있었다. 하버마의 영국 상인과 영국 정부는 상버마 시장과 티크 목재, 그리고 중국으로 가는 길을 노렸으며, 티보 정부가 프랑스와 통상 조약을 협상한 일(1885)이 불안을 키웠다. 1885년 영국계 봄베이 버마 무역 회사가 티크 벌채 대금을 속였다며 버마 정부가 벌금을 매기자 영국은 10월 22일 영국인 주재관을 받고 대외 관계를 영국에 맡기라는 최후통첩을 보냈다. 티보가 거부하자 해리 프렌더가스트 장군이 이끄는 영국과 인도의 군대 약 9천 명(영국군 약 3천, 인도 세포이 약 6천)이 11월 14일 무렵 이라와디강을 거슬러 올라갔다. 버마군은 11월 17일 민흘라에서 패했고 11월 28일 영국군이 만달레이에 들어와 티보를 붙잡았다(항복 교섭은 26~27일부터). 티보와 왕비는 인도 서해안 라트나기리로 유배되었다. 티보는 1916년 거기서 숨졌고, 왕비 수파야랏은 1919년 랑군으로 돌아와 1925년 숨졌다. 인도 총독 더퍼린은 1886년 1월 1일 상버마를 영국령 인도에 합친다고 선포했다. 버마는 인도의 한 주가 되었고 왕정은 폐지되었다. 그러나 영국군이 맞닥뜨린 저항은 이후 10년 가까이 이어졌고 지방의 승려와 옛 관리, 농민이 게릴라전을 벌여 영국은 경찰 초소와 이동 부대로 진압했다. 영국은 약탈품을 상납하거나 경매에 부쳤고 만달레이 궁은 더퍼린 요새가 되었다. 샨 국의 사오파들은 1887년 영국의 종주권을 받아들였다. 콘바웅 왕조는 1752년 알라웅브야 이래 11명의 왕으로 이어진 133년 만에 끝났다(「제2차 영국–버마 전쟁과 민돈 왕의 개혁(1852~1878)」(앞의 사건)에서 시작된 영국의 잠식이 마무리된 것이다). 버마는 1937년에야 인도에서 갈라진다."
  subjects: [konbaung-dynasty, british-raj, uk]
  links:
    - { from: british-raj, to: konbaung-dynasty, note: "상버마를 병합함 (1886)" }
  tags: [war, politics]
  places: [{ name: 만달레이 함락, at: [96.08, 21.97], year: 1885 }]
  sources: ["Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)", "Michael Charney, A History of Modern Burma (Cambridge University Press, 2009)", "Alister McCrae, Burma: The Final Phase (1885–1886) (Heinemann, 1985)"]

- id: can-vuong-1885
  year: 1885
  endYear: 1899
  title:
    ko: "껀브엉 운동과 프랑스령 인도차이나 연방(1885~1899)"
  summary:
    ko: "1884년 파트노트르 조약 뒤에도 후에 조정의 실권자 똔 텃 투옛과 응우옌 반 뜨엉은 프랑스에 맞설 계획을 버리지 않았다. 프랑스군 사령관 드 쿠르시가 후에에 오자 1885년 7월 5일 밤 이들은 프랑스 진영을 기습했으나 실패했고, 열세 살의 함응이 황제를 데리고 산속으로 달아났다. 7월에 함응이의 이름으로 ‘황제를 도우라’는 조칙(껀브엉)이 나가자 학자와 관리, 농민이 호응해 봉기가 퍼졌다. 프랑스는 함응이의 형 동카인(재위 1885~1889)을 황제로 세웠다. 1886~1887년 바딘 요새 포위와 1885~1896년 판 딘 풍의 후옹케 근거지가 대표적 거점이었다. 함응이는 1888년 붙잡혀 알제리로 유배되었다. 이 운동은 신사 계층을 중심으로 일어났으나 지휘가 통일되지 못했고, 껀브엉 쪽 병력과 주민이 1885년 7~9월 가톨릭 신자를 대거 죽였고 희생자가 4만 명쯤이라는 추산이 있다(수치는 논쟁 중이다). 판 딘 풍이 1895년 숨지고 1896년 근거지가 무너지면서 운동은 끝났으나, 호앙 호아 탐은 1913년까지 북부 옌테에서 싸웠다. 프랑스는 그 사이 1887년 10월 17일 코친차이나, 안남, 통킹, 캄보디아를 묶은 인도차이나 연방을 만들었다. 1889년 안남에는 중부 고원이 편입되었고, 동카인이 죽은 뒤 어린 타인타이(재위 1889~1907)가 올랐다. 1898년에는 청에서 광저우만을 조차했고, 라오스는 1899년 연방에 합쳐졌다(「파크남 사건과 프랑스–시암 조약, 라오스 보호령(1893)」(뒤의 사건)에서 보호령이 된 땅이다). 1897년 총독 폴 두메르는 재정과 행정을 중앙에서 통제하는 제도를 만들었다. 이 사건은 「후에 조약과 안남·통킹 보호령(1883~1884)」(앞의 사건)에서 이어진 저항이자 20세기 민족 운동의 전사였다."
  subjects: [annam-protectorate, tonkin-protectorate, cochinchina, cambodia, laos, france]
  tags: [war, politics, society]
  places: [{ name: 바딘 요새, at: [105.93, 19.97], year: 1886 }]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Pierre Brocheux and Daniel Hémery, Indochina: An Ambiguous Colonization, 1858–1954 (University of California Press, 2009)", "David G. Marr, Vietnamese Anticolonialism, 1885–1925 (University of California Press, 1971)"]

- id: monthon-reform-1892
  year: 1892
  endYear: 1902
  title:
    ko: "몬톤 제도와 란나·파타니의 편입(1892~1902)"
  summary:
    ko: "쭐랄롱꼰 때 시암(지금의 타이)은 영국과 프랑스에 둘러싸여 국경이 불안했고, 속국에 맡겨 둔 변두리를 왕이 직접 다스리는 체제가 필요했다. 내무부 장관 담롱 라자누바프 왕자는 1890년대 초 여러 지방을 ‘몬톤’(구역)으로 묶어 방콕이 보낸 고등 판무관이 다스리게 했다. 이 개혁은 1892년 정부를 열두 개 부로 나눈 조치와 함께 이루어졌다. 란나는 그 앞까지 시암에 3년마다 금은 나무를 바치는 조공을 해 왔다. 1890년부터 이산의 라오 지방에 몬톤이 세워졌고 1893년 이산의 여러 몬톤이 정비되었다. 메콩강 동쪽의 루앙프라방 왕국은 이때까지 시암의 속국이었으나 1893년 프랑스의 보호령이 된다(「파크남 사건과 프랑스–시암 조약, 라오스 보호령(1893)」(뒤의 사건)). 란나에서는 영국이 티크 목재 이권에 얽혀 1874년 영국–시암 조약으로 치앙마이 재판 제도에 개입했고, 시암은 이를 계기로 란나에 고등 판무관을 보냈다. 치앙마이의 마지막 힘 있는 통치자 인타위차이야논(재위 1873~1897)이 숨지자 시암은 1899년 12월 몬톤 파얍으로 란나의 직할 통치를 시작했다. 남부의 파타니 술탄국은 1785~1786년 시암에 정복된 뒤 1808년 일곱 주로 나뉘었는데, 1902년 파타니의 술탄 압둘 카디르가 폐위되었고, 일곱 주는 1901년 '일곱 지방 구역'으로 묶였다가 1906년 몬톤 파타니로 편성되었다. 이 지역 주민은 대부분 말레이어를 쓰는 무슬림이었다. 이로써 파타니 술탄국은 1902년 끝났다. 말레이 북부의 크다, 클란탄, 트렝가누, 프를리스는 1909년 조약으로 영국으로 넘어갔고(「1909년 방콕 조약과 말레이 북부 네 주(1909)」(뒤의 사건)), 파타니는 시암에 남았다. 몬톤 제도는 지방 행정을 방콕이 직접 맡는 틀이 되었고, 영토 국가로서의 시암을 만드는 중요한 단계였다. 란나와 파타니에서는 이후 지방 군주의 권한이 줄고 방콕이 정한 행정과 교육이 자리를 잡았다."
  subjects: [thailand, lan-na, patani-sultanate, luang-prabang-kingdom, uk]
  links:
