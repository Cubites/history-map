  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Thongchai Winichakul, Siam Mapped: A History of the Geo-Body of a Nation (University of Hawaii Press, 1994)", "Tamara Loos, Subject Siam: Family, Law, and Colonial Modernity in Thailand (Cornell University Press, 2006)"]

- id: paknam-1893
  year: 1893
  title:
    ko: "파크남 사건과 프랑스–시암 조약, 라오스 보호령(1893)"
  summary:
    ko: "프랑스는 베트남을 차지한 뒤 메콩강 동쪽 라오 지역까지 보호령을 넓히려 했고, 방콕 주재 영사 오귀스트 파비는 그 선봉이었다. 이 위기는 시암에서 ‘라따나꼬신 112년의 사건’이라 부른다. 시암(지금의 타이)은 이 지역의 루앙프라방과 참파삭을 속국으로 두고 있었고, 1892~1893년 양쪽 군대가 메콩 동쪽에서 맞닥뜨렸다. 1893년 3월 파비가 시암의 철수를 요구하며 프랑스 포함을 방콕으로 보냈다. 6월 초 키엔켓에서 시암군이 프랑스 검열관 그로스귀랭과 베트남 병사들을 죽이자 프랑스는 이를 구실로 삼았다. 7월 13일 프랑스 군함 두 척이 파크남 요새의 포격을 뚫고 짜오프라야강을 거슬러 방콕에 닿았다. 프랑스는 7월 20일 최후통첩으로 메콩 동쪽 땅의 양도와 배상금 300만 프랑, 책임자 처벌을 요구했고 거부당하자 해안을 봉쇄했다. 영국의 지원이 없다고 본 시암은 굴복했다. 1893년 10월 3일 프랑스–시암 조약으로 시암은 메콩강 왼쪽 기슭과 섬에 대한 모든 권리를 포기했고, 오른쪽 기슭의 25킬로미터 구역은 비무장 지대가 되었다. 프랑스는 짠타부리를 담보로 점령했다. 루앙프라방의 운캄 왕(재위 1872~1895)은 프랑스의 보호를 받아들였고, 이렇게 라오스가 프랑스의 보호령이 되었다. 참파삭도 왼쪽 기슭 땅이 이때 떨어져 나갔다. 전투 사상자는 프랑스 쪽 전사 3명, 시암 쪽 16명 안팎으로 알려져 있다. 영국은 1896년 영국–프랑스 선언으로 짜오프라야강 유역을 완충 지대로 삼았고, 시암의 땅 상실은 1904년과 1907년 조약(「1904년 파리 조약과 1907년 방콕 조약(1904~1907)」(뒤의 사건))으로 이어졌다."
  subjects: [thailand, laos, champasak-kingdom, france]
  links:
    - { from: thailand, to: laos, note: "메콩강 왼쪽 기슭을 프랑스에 넘김 (1893)" }
  tags: [war, diplomacy]
  places: [{ name: 파크남 사건, at: [100.58, 13.54], year: 1893 }]
  sources: ["Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "Christopher E. Goscha, Vietnam: A New History (Basic Books, 2016)"]

- id: philippine-revolution-1896
  year: 1896
  endYear: 1897
  title:
    ko: "카티푸난과 필리핀 혁명(1896~1897)"
  summary:
    ko: "스페인은 1565년 이래 필리핀을 다스렸고 가톨릭 수도회가 땅과 교육을 쥐고 있었다. 19세기 말 필리핀에서는 스페인 수도회의 큰 땅 소유와 세금, 강제 노동에 대한 불만이 커졌고, 호세 리살(1861~1896)은 소설 『나를 건드리지 마라』(1887)로 이를 고발했다. 1872년 카비테 반란 뒤 처형된 사제 세 명(고메스, 부르고스, 사모라)은 개혁 운동의 기억이 되었다. 리살이 개혁을 바라며 만든 필리핀 연맹이 1892년 해체되자 안드레스 보니파시오는 같은 해 비밀 결사 카티푸난을 세워 무장 독립을 노렸다. 1896년 8월 카티푸난의 존재가 드러나자 보니파시오 일행은 마닐라 북쪽에서 문서를 찢고 봉기를 선언했다(발린타왁의 외침, 8월 하순). 스페인은 계엄령을 선포했고 반란에 관여하지 않았다고 주장한 리살도 붙잡혀 군법 재판 끝에 1896년 12월 30일 바구바양(지금 리살 공원)에서 총살되었다. 카비테에서는 에밀리오 아기날도의 마그달로와 마리아노 알바레스의 마그디왕 파벌이 전과를 올렸다. 1897년 3월 테헤로스 대회에서 아기날도가 대통령으로 뽑혔고, 보니파시오는 반역 혐의로 1897년 5월 처형되었다. 스페인군은 총독 카밀로 데 폴라비에하와 페르난도 프리모 데 리베라가 반격해 카비테를 되찾았다. 그러자 아기날도의 정부는 비악나바토 산지로 물러났고, 1897년 12월 14일 스페인과 비악나바토 협정을 맺어 배상금을 받고 홍콩으로 떠났다. 전투 사망자는 혁명군 쪽 약 2만 8천 6백 명(전사·부상 사망), 스페인군 쪽 약 260명 전사라는 추산이 있고 질병과 민간인 희생까지 합치면 더 많다. 혁명은 1898년 미국과 스페인의 전쟁(「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」(뒤의 사건))으로 이어졌다."
  subjects: [spanish-philippines]
  tags: [war, politics, society]
  places: [{ name: 리살 처형, at: [120.98, 14.58], year: 1896 }]
  sources: ["Luis H. Francia, A History of the Philippines: From Indios Bravos to Filipinos (Overlook Press, 2010)", "Reynaldo C. Ileto, Pasyon and Revolution: Popular Movements in the Philippines, 1840–1910 (Ateneo de Manila University Press, 1979)", "Benedict Anderson, Under Three Flags: Anarchism and the Anti-Colonial Imagination (Verso, 2005)"]

- id: spanish-american-war-1898
  year: 1898
  title:
    ko: "미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)"
  summary:
    ko: "1898년 2월 하바나 항에서 미국 군함 메인호가 폭발해 가라앉자 미국 여론은 스페인을 비난했고, 의회는 4월 쿠바 문제로 스페인과 전쟁에 들어갔다. 스페인은 1895년부터 쿠바 반란을 진압하느라 재정과 병력을 쏟고 있었다. 필리핀에서는 조지 듀이 제독이 지휘하는 미국 아시아 함대가 5월 1일 마닐라만에서 스페인 함대를 부쉈다. 낡은 군함 일곱 척이 모두 가라앉거나 불탔다. 미국 쪽 전사자는 없었다. 홍콩에 가 있던 에밀리오 아기날도는 미국 군함으로 돌아와 5월 19일 필리핀에 닿았고 혁명군을 다시 모았다. 그는 듀이에게서 독립을 약속받았다고 주장했으나 미국은 이를 부인했다. 필리핀 독립 선언은 1898년 6월 12일 카비테의 카윗에서 낭독되었고(이어 9월 말롤로스 의회가 열렸다), 미국은 이를 인정하지 않았다. 마닐라의 스페인군은 해상과 육상에서 포위되었으나 필리핀군의 입성을 막으려 8월 13일 미국군과 짜고 형식만 전투를 한 뒤 항복했다. 마닐라는 미국군이 맡았고 필리핀군은 도시 밖에 진을 쳤다. 1898년 12월 10일 스페인과 미국은 파리 조약을 맺었다. 스페인은 필리핀, 괌, 푸에르토리코를 미국에 넘기고 쿠바에 대한 주권을 포기했으며, 미국은 필리핀 값으로 2천만 달러를 냈다. 필리핀 대표는 협상에서 배제되었다. 조약은 미국 상원이 1899년 2월 6일 57 대 27로 비준해 간신히 필요한 3분의 2를 넘겼고, 비준서 교환(1899년 4월 11일)으로 발효했다. 맥킨리 대통령은 12월 21일 ‘자비로운 동화’ 선언으로 필리핀을 미국이 다스리겠다고 밝혔다. 이에 필리핀 공화국과 미국의 충돌이 불가피해졌다(「말롤로스 공화국과 필리핀–미국 전쟁(1899~1902)」(뒤의 사건))."
  subjects: [american-philippines, spain, usa]
  links:
    - { from: spain, to: usa, note: "파리 조약으로 필리핀을 넘김 (1898)" }
  tags: [war, diplomacy, politics]
  places: [{ name: 마닐라만 해전, at: [120.8, 14.5], year: 1898 }]
  sources: ["Luis H. Francia, A History of the Philippines: From Indios Bravos to Filipinos (Overlook Press, 2010)", "Stanley Karnow, In Our Image: America's Empire in the Philippines (Random House, 1989)", "「파리 조약」(1898)"]

- id: philippine-american-war-1899
  year: 1899
  endYear: 1902
  title:
    ko: "말롤로스 공화국과 필리핀–미국 전쟁(1899~1902)"
  summary:
    ko: "1899년 1월 21일 말롤로스 헌법이 공포되고 1월 23일 에밀리오 아기날도를 대통령으로 하는 필리핀 제1공화국이 출범했다. 미국은 이 정부를 인정하지 않았고, 마닐라에서는 두 나라 군대가 마주 서 있었다. 2월 4일 밤 미국 병사가 필리핀 병사에게 총을 쏘는 사건이 일어나 전투가 시작되었다. 필리핀군은 정규전으로 맞섰으나 장비가 부족해 3월 말 수도 말롤로스를 잃었고, 군사 지도자 안토니오 루나는 6월 필리핀 군 내부 갈등 끝에 살해되었다. 1899년 11월 아기날도는 게릴라전으로 바꿨고 12월 티라드 고개 전투에서 그레고리오 델 필라르가 전사했다. 아기날도는 1901년 3월 23일 팔라난에서 속임수 작전으로 붙잡혀 4월 1일 미국에 충성을 맹세했다. 그해 9월 사마르 섬 발랑기가에서 필리핀 주민이 미군을 습격하자 미군은 보복으로 사마르를 초토화했다. 1902년 4월 미겔 말바르가 항복했고, 미국 대통령 시어도어 루스벨트는 1902년 7월 4일 전쟁이 끝났다고 선언했다. 그 뒤에도 일부 무장 집단이 싸웠고 남부 모로 지방에서는 별도의 충돌이 이어졌다. 미국 쪽 전사자는 약 4천 2백 명, 필리핀 군인 사망은 약 2만 명으로 추산되고, 민간인은 굶주림과 질병, 집단 수용소 등으로 20만~25만 명이 숨졌다는 추산이 있다. 술루의 술탄은 1899년 8월 베이츠 조약으로 미국과 관계를 맺고 자치를 인정받았다(「미국의 모로 지배와 술루 술탄국의 끝(1903~1915)」(뒤의 사건)). 이 전쟁은 스페인에 맞서 세운 공화국이 미국의 식민지로 바뀐 과정이었고, 미국 안에서도 제국주의 논쟁을 일으켰다. 1898년 만들어진 반제국주의 연맹은 합병을 반대했다."
  subjects: [american-philippines, sulu-sultanate, usa]
  links:
    - { from: american-philippines, to: sulu-sultanate, note: "베이츠 조약으로 술탄의 자치를 인정함 (1899)" }
  tags: [war, politics]
  places: [{ name: 마닐라 전투, at: [120.98, 14.6], year: 1899 }, { name: 팔라난 아기날도 체포, at: [122.43, 17.05], year: 1901 }]
  sources: ["Brian McAllister Linn, The Philippine War, 1899–1902 (University Press of Kansas, 2000)", "Stanley Karnow, In Our Image: America's Empire in the Philippines (Random House, 1989)", "Luis H. Francia, A History of the Philippines: From Indios Bravos to Filipinos (Overlook Press, 2010)"]
