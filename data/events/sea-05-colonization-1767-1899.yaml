  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Martin Stuart-Fox, A Short History of China and Southeast Asia (Allen & Unwin, 2003)"]

- id: arakan-conquest-1784
  year: 1784
  endYear: 1785
  title:
    ko: "콘바웅 왕조의 아라칸 정복과 므라우우 왕국의 끝(1784~1785)"
  summary:
    ko: "아라칸(라카인)은 15세기 이래 벵골만 해안에서 므라우우 왕국이 다스렸고, 므라우우는 1430년 무렵 나라가 재건된 뒤 벵골 술탄국, 포르투갈 용병, 이슬람 상인과 교류한 항구 왕국이기도 했으며, 18세기 중엽에는 왕위 다툼과 반란으로 약해져 있었다. 콘바웅 왕조의 싱구(재위 1776~1782)가 죽자 아들 퐁까가 닷새쯤 앉았다 쫓겨났고, 알라웅브야의 아들 보도퍼야가 1782년 왕위에 올랐다(재위 1782~1819). 보도퍼야는 왕위를 굳히자 서쪽의 아라칸을 노렸다. 아라칸의 한 귀족이 버마에 도움을 청한 일이 구실이 되었다고 전한다. 1784년 말 아들 타도 민소가 이끄는 군대가 육로와 바닷길로 아라칸에 들어갔다. 므라우우는 1785년 1월 2일 함락되었고, 마지막 왕 마하 타마다(다마다)는 포로가 되어 버마로 끌려갔다. 버마군은 궁전에서 마하무니 불상을 비롯한 보물을 가져갔다. 이 불상은 아마라푸라로 옮겨져 지금까지 버마 불교에서 가장 신성한 불상 가운데 하나로 모셔진다. 수많은 아라칸 사람이 포로로 끌려갔고, 정복 뒤 총독이 다스리는 버마의 한 지방이 되었다. 가혹한 지배와 부역에 시달린 아라칸 사람들은 영국령 벵골의 치타공으로 도망쳤고, 1790년대부터 반란과 국경 분쟁이 이어졌다. 이 갈등은 훗날 「제1차 영국–버마 전쟁과 얀다보 조약, 아삼·마니푸르(1824~1826)」(뒤의 사건)의 한 원인이 되었다. 콘바웅 왕조는 이 정복으로 영토를 벵골만까지 넓혔으나, 영국 동인도 회사와 맞닿는 국경이 생겼다. 「짜끄리 왕조의 성립과 방콕 천도(1782~1795)」(앞의 사건)에서 보듯 보도퍼야는 같은 시기에 시암도 공격했다."
  subjects: [konbaung-dynasty, mrauk-u]
  links:
    - { from: konbaung-dynasty, to: mrauk-u, note: "아라칸을 정복하고 므라우우 왕국을 없앰 (1785)" }
  tags: [war, politics]
  places: [{ name: 므라우우 함락, at: [93.2, 20.6], year: 1785 }]
  sources: ["Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)", "Michael W. Charney, Where Jambudipa and Islamdom Converged: Religious Change and the Emergence of Buddhist Communalism in Early Modern Arakan (University of Michigan, 1999)", "Victor B. Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: tay-son-north-1786
  year: 1786
  endYear: 1789
  title:
    ko: "떠이선의 북진과 후 레 왕조의 끝, 응옥호이–동다 전투(1786~1789)"
  summary:
    ko: "북부에서는 후 레 왕조의 황제가 이름뿐이었고 찐 씨가 실권을 쥐고 있었다. 찐 씨는 17세기 초부터 후 레 황제를 내세워 북부를 다스린 가문이었다. 찐 섬(1767~1782)이 숨진 뒤 찐 깐과 찐 카이를 거쳐 찐 봉이 1786년 정권을 이었으나, 궁정은 파벌 다툼으로 흔들렸다. 1786년 6월 떠이선의 응우옌 후에는 푸쑤언을 점령한 뒤 ‘레 왕조를 받들고 찐 씨를 친다’는 명분으로 북진해 7월 탕롱(하노이)에 들어갔다. 찐 씨 정권은 이때 무너졌고, 응우옌 후에는 레 히엔 똥(재위 1740~1786)의 딸을 아내로 맞았다. 히엔 똥은 1786년 숨졌고, 그의 손자 레 찌에우 통이 1787년 즉위했다. 떠이선은 북부에 장수 응우옌 후우 찐을 남기고 물러났으나 그가 1787년 숨지자 찌에우 통은 떠이선과 갈라섰다. 찌에우 통은 청에 구원을 청했고, 건륭제는 쑨스이가 이끄는 군대를 보내 1788년 말 탕롱을 점령했다(「건륭제의 십전무공(1747~1792)」(앞의 사건)에 이 원정도 포함된다). 응우옌 후에는 1788년 12월 황제를 칭해 광쭝이라 하고 푸쑤언에서 즉위식을 올린 뒤, 군대를 이끌고 북으로 올라가 음력 설 무렵인 1789년 1월 말에서 2월 초 응옥호이와 동다에서 청군을 크게 무찔렀다. 이 전투에서 광쭝은 코끼리 부대를 앞세웠다고 전한다. 청군은 베트남을 떠났고 청은 얼마 뒤 광쭝을 안남 국왕으로 인정했다. 찌에우 통은 청으로 건너갔고, 후 레 왕조는 이렇게 끝났다. 광쭝은 승리 뒤 청과의 관계를 조심스럽게 풀어 갔으나 1792년 숨졌고, 어린 아들 꽝또안이 뒤를 이었다. 청의 개입과 이 전투는 베트남이 중국의 직접 지배에 저항해 온 오랜 역사에서 자주 되돌아보는 장면이다."
  subjects: [tay-son-dynasty, later-le-dynasty, qing]
  links:
    - { from: tay-son-dynasty, to: later-le-dynasty, note: "탕롱을 점령하고 찐 씨 정권을 무너뜨림 (1786)" }
    - { from: tay-son-dynasty, to: qing, note: "응옥호이와 동다에서 청군을 물리침 (1789)" }
  tags: [war, politics]
  places: [{ name: 응옥호이–동다 전투, at: [105.84, 21.01], year: 1789 }]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "George Dutton, The Tây Sơn Uprising: Society and Rebellion in Eighteenth-Century Vietnam (University of Hawai'i Press, 2006)"]

- id: penang-1786
  year: 1786
  endYear: 1800
  title:
    ko: "프랜시스 라이트의 페낭 점유(1786~1800)"
  summary:
    ko: "18세기 후반 영국 동인도 회사는 인도에서 중국으로 가는 배를 쉬게 하고 수리할 항구가 필요했고, 영국 상인 프랜시스 라이트는 말레이 반도 서북 해안의 작은 섬 페낭을 후보로 꼽았다. 해협 서쪽 입구에 있는 이 섬은 인도에서 오는 배가 몬순을 기다리며 쉬기 좋았고, 영국은 프랑스 함대의 벵골만 활동을 견제할 기지도 필요했다. 이 섬은 크다 술탄국의 땅이었다. 크다의 술탄 압둘라는 이웃 시암(지금의 타이)과 버마에 시달리고 있어, 영국의 군사 원조를 기대하며 섬을 내주기로 했다. 라이트는 1786년 8월 11일 페낭에 상륙해 영국 깃발을 올리고 섬을 ‘웨일스 공의 섬’이라 불렀으며, 도시는 조지타운이 되었다. 회사는 해마다 6천 스페인 달러를 술탄에게 내기로 했으나, 라이트가 술탄에게 군사 지원을 약속한 것은 회사의 뜻이 아니었다. 회사가 약속을 지키지 않자 술탄은 1791년 섬을 되찾으려 군대를 모았으나 라이트에게 격퇴되었다. 이후 회사와 술탄은 연금을 올리는 조약을 맺고 섬을 영국 소유로 인정하는 데 합의했다. 섬에는 처음 말레이 어민 몇이 살았으나 라이트는 중국인과 인도인 이주를 장려했다. 페낭은 자유 무역항을 내걸어 중국, 인도, 말레이 상인이 모여 1795년에는 인구가 2만 명쯤이 되었고, 라이트는 1794년 말라리아로 숨졌다. 회사는 1800년 크다 술탄과 새 조약을 맺어 섬 맞은편 본토 해안의 좁은 땅(웰즐리 주)을 얻고 연금을 더 올렸다. 이 항구는 곧 1819년 싱가포르, 1824~1825년 말라카와 함께 해협 식민지의 바탕이 되었다. 페낭은 1805년 인도 총독부 아래의 독립된 관구가 되었다. 시암이 크다에 영향력을 키우던 시기에 영국이 말레이 반도에 처음 발판을 놓았다는 점도 중요하다."
  subjects: [straits-settlements, kedah-perlis, company-india, thailand]
  links:
    - { from: straits-settlements, to: kedah-perlis, note: "페낭 섬을 빌려 차지함 (1786)" }
  tags: [politics, economy]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Nicholas Tarling, ed., The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: gia-long-1787
  year: 1787
  endYear: 1804
  title:
    ko: "응우옌 아인의 반격과 응우옌 왕조의 성립(1787~1804)"
  summary:
    ko: "응우옌 주의 후손 응우옌 푹 아인(응우옌 아인)은 떠이선에 쫓겨 푸꾸옥 섬과 시암(지금의 타이)을 떠돌았다. 그는 프랑스인 선교사 피뇨 드 베엔(아드랑 주교)에게 도움을 청했고, 피뇨는 1784년 말 어린 아들 응우옌 푹 까인을 데리고 프랑스로 떠났다. 피뇨가 프랑스 궁정과 맺은 1787년 11월의 베르사유 조약은 군사 지원의 대가로 다낭과 꼰다오 섬을 프랑스에 주기로 했으나, 총독이 따르지 않아 이행되지 않았다. 응우옌 아인은 1788년 9월 사이공을 되찾았고, 피뇨는 1789년 사사로이 모은 배와 서양인 장교를 데리고 돌아왔다. 응우옌 아인은 이후 해마다 계절풍을 타고 북으로 올라가는 전쟁을 벌였다. 그는 서양식 요새와 대포, 배를 갖추고 세금과 쌀로 병력을 먹였다. 1793~1794년 꾸이년과 냐짱 방면 원정은 떠이선의 반격으로 물러났으나, 1799년 꾸이년을 점령했고 피뇨 드 베엔은 그해 숨졌다. 광쭝이 죽은 뒤 떠이선은 안으로 분열했고, 1801년 6월 응우옌 아인이 푸쑤언을 되찾았으며 1802년 6월 1일 황제에 올라 연호를 자롱으로 정했다. 같은 해 7월 하노이를 함락해 떠이선을 무너뜨렸고, 마지막 떠이선 황제 꽝또안을 처형했다. 1802년 청에 책봉을 청하고 국호를 ‘남월’로 하려 했으나, 청은 1804년 ‘월남(베트남)’으로 정해 책봉했다. 응우옌 왕조는 남북을 처음으로 하나의 나라로 묶었고 수도는 후에가 되었다. 이 영토는 북쪽 중국 국경에서 남쪽 하띠엔에 이르러 지금의 베트남과 거의 같아졌다. 응우옌 아인은 즉위 뒤 청의 법을 본떠 법전 『황월률례』를 만들게 했다(1815년 반포). 응우옌 주의 후손이 이끈 세력은 1801년 푸쑤언을 되찾으며 되살아나 응우옌 왕조로 이어졌고, 떠이선 왕조는 1802년 끝났다. 시암은 응우옌 아인이 몸을 피한 동안 그를 도왔고, 청은 책봉으로 새 왕조를 인정했다."
  subjects: [nguyen-lords, tay-son-dynasty, nguyen-dynasty, thailand, france, qing]
  links:
