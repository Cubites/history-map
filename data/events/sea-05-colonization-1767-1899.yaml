# 동남아 사건 1묶음 갈래 B(se-05): 식민화와 왕조 교체 — 톤부리·짜끄리 왕조·떠이선·응우옌 왕조·콘바웅 왕조의 팽창과 끝, 해협 식민지·네덜란드령 동인도·사라왁·코친차이나와 보호령·필리핀 혁명 (1767 ~ 1899년)
# 범위: 아유타야의 함락과 톤부리·짜끄리 왕조·란나와 라오 왕국들의 시암 종속·아라칸 정복·떠이선 봉기와 응우옌 왕조의 성립·페낭과 싱가포르·영국–네덜란드 조약·자와 전쟁과 강제 재배 제도·파드리 전쟁·아체 전쟁·사라왁과 북보르네오·
#   제2차·제3차 영국–버마 전쟁·시암의 개방과 쭐랄롱꼰의 개혁·프랑스의 코친차이나 점령과 안남·통킹 보호령·껀브엉 운동과 인도차이나 연방·파크남 사건·필리핀 혁명과 미국–스페인 전쟁·필리핀–미국 전쟁의 시작.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(톤부리 때 갈라진 지방 정권·말롤로스 공화국·파드리 세력 등)은 글로만 다뤘다.
# 날짜: 1582년 뒤라 그레고리력이다. 조약은 서명한 해와 비준·발효한 해를 가렸고, 확실하지 않은 날짜는 '무렵'으로 적었다. 불기·자와력은 쓰지 않았다.
# 이름 규칙: 버마는 이 시기 내내 '버마', 시암은 '시암'이다. 표기 사전을 따라 콘바웅 왕조·말라카·떠이선 왕조·응우옌·딱신·싱뷰싱·띠버·팡코르 조약·디파느가라로 적었다. 도시는 그때 이름(랑군(지금 양곤)·사이공·바타비아·탕롱(하노이))을 썼고, 베트남 인명은 성조 없이 띄어 썼다.
#   사망자·병력은 '추산'과 범위로 적고 정부 발표와 다른 추산을 함께 두었다. 분쟁과 식민 지배는 어느 쪽 시각도 따르지 않고 일어난 일과 숫자만 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 시작 해가 1767~1899인 사건을 이 파일이 맡는다.
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(건륭제의 십전무공, 달하우지의 실권 원칙 병합, 청불 전쟁과 톈진 조약, 네덜란드 동인도 회사의 설립). 제1차 영국–버마 전쟁(남아시아 파일)은 콘바웅 쪽 문장만 더했다.
#   한국사와 닿는 점은 이 시기에 억지로 잇지 않았다.

- id: thonburi-1767
  year: 1767
  endYear: 1770
  title:
    ko: "아유타야의 함락과 딱신의 톤부리 왕국(1767~1770)"
  summary:
    ko: "콘바웅 왕조의 싱뷰싱은 1765년 두 갈래 군대를 보내 아유타야를 에워쌌고, 도성은 1767년 4월 7일 무렵 함락되어 불타고 약탈당했다. 아유타야 왕국은 1351년 이래 33명의 왕이 이어 온 나라였고, 포위는 1766년 초부터 1년 남짓 이어졌다. 에까탓 왕은 도망쳐 숨었다가 숨졌고 왕족과 많은 주민이 포로로 버마에 끌려갔다. 청과의 전쟁(「건륭제의 십전무공(1747~1792)」(앞의 사건))으로 버마 본군이 북쪽으로 불려 가자 아유타야에는 수비대만 남았다. 이때 딱 지방의 장수 신(뒷날의 딱신)은 포위된 도성을 빠져나와 동쪽 해안의 짠타부리로 가서 병력과 배를 모았고, 1767년 가을 아유타야의 버마 수비대를 몰아냈다. 딱신은 포위를 뚫고 나갈 때 부하 500명 안팎을 이끌었다고 전한다. 그러나 도성이 너무 많이 부서져 있어 짜오프라야강 하구에 가까운 톤부리를 새 도읍으로 삼고 1767년 12월 즉위했다. 중국계 아버지와 타이인 어머니 사이에서 태어난 딱신은 아유타야의 옛 영토가 여러 세력으로 갈라져 있던 것을 되찾아야 했다. 피마이, 피사눌록, 나콘시탐마랏, 팡 같은 곳에는 왕족이나 승려, 지방 장관이 따로 정권을 세웠고, 딱신은 1768년부터 1770년까지 이들을 차례로 눌러 옛 영토 대부분을 하나로 묶었다. 1769년에는 캄보디아의 왕위 다툼에 군대를 보냈고(~1771), 북쪽의 란나는 여전히 버마의 총독 아래에 있었다. 아유타야가 사라진 뒤 이 나라는 아유타야의 법과 관직을 이어받았으나 수도와 왕가가 모두 새로 시작되었다는 점에서 새 왕국이었다. 톤부리 왕국은 1782년까지 이어졌고 딱신의 뒤를 이은 일은 「짜끄리 왕조의 성립과 방콕 천도(1782~1795)」(뒤의 사건)에서 다룬다."
  subjects: [thailand, konbaung-dynasty, lan-na, cambodia]
  links:
    - { from: thailand, to: konbaung-dynasty, note: "아유타야에서 버마 수비대를 몰아냄 (1767)" }
    - { from: thailand, to: cambodia, note: "캄보디아 왕위 다툼에 군대를 보냄 (1769~1771)" }
  tags: [war, politics]
  places: [{ name: 아유타야 함락, at: [100.56, 14.35], year: 1767 }]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)"]

- id: tay-son-rising-1771
  year: 1771
  endYear: 1785
  title:
    ko: "떠이선 봉기와 응우옌 주의 몰락(1771~1785)"
  summary:
    ko: "남부의 응우옌 주는 1760년대에 외척 쯔엉 푸억 로안이 권력을 쥐고 세금을 무겁게 거두어 민심을 잃고 있었다. 이 정권은 17세기 초부터 중부 베트남 남쪽에 터를 잡고 남진하며 메콩 삼각주를 개척해 온 나라였다. 1771년 꾸이년 서쪽 떠이선 마을에서 응우옌 냑, 응우옌 르, 응우옌 후에 삼형제가 봉기해 가난한 농민과 산악 지대 주민을 모았고, 1773년 꾸이년을 차지했다. 이때 북쪽의 찐 씨(후 레 왕조의 실권자)가 틈을 노려 1774년 말 잔강을 건너 남하했고 1775년 초 응우옌 주의 도읍 푸쑤언을 점령했다. 응우옌 주의 주 응우옌 푹 투언은 남쪽으로 달아났고, 떠이선은 찐 씨에 일단 복종하는 체하며 남부의 응우옌 주와 싸웠다. 1777년 응우옌 후에가 자딘(지금의 사이공 일대)을 함락하고 응우옌 푹 투언을 죽이니 응우옌 주의 중심이 무너졌다. 응우옌 푹 투언의 조카 응우옌 푹 아인만 살아남아 달아났다. 1778년 응우옌 냑은 황제를 칭하며 떠이선 왕조를 세웠다. 도읍은 꾸이년 북쪽의 도반에 두었다. 응우옌 푹 아인은 1778년부터 1782년 사이 자딘을 되찾았다가 다시 빼앗기기를 되풀이했고 1783년 푸꾸옥 섬으로 밀려났다. 그는 시암(지금의 타이)의 도움을 얻으려 했고, 1784년 시암군 2만 명 안팎(추산)이 메콩 삼각주에 들어왔다. 그러나 응우옌 후에가 1785년 1월 락검과 쏘아이뭇에서 이 군대를 크게 무찔렀다. 응우옌 푹 아인은 시암으로 몸을 피했고, 남부와 중부는 떠이선이 차지했다. 이렇게 200년 넘게 남쪽을 다스린 응우옌 주의 정권은 무너졌고 후 레 왕조와 찐 씨의 북부와는 새 싸움이 시작되었다. 이 사건은 「응우옌 아인의 반격과 응우옌 왕조의 성립(1787~1804)」(뒤의 사건)으로 이어진다."
  subjects: [tay-son-dynasty, nguyen-lords, later-le-dynasty, thailand]
  links:
    - { from: tay-son-dynasty, to: nguyen-lords, note: "자딘을 함락하고 응우옌 주를 무너뜨림 (1777)" }
    - { from: later-le-dynasty, to: nguyen-lords, note: "찐 씨가 푸쑤언을 점령함 (1775)" }
  tags: [war, politics, society]
  places: [{ name: 락검–쏘아이뭇 전투, at: [106.35, 10.35], year: 1785 }]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "George Dutton, The Tây Sơn Uprising: Society and Rebellion in Eighteenth-Century Vietnam (University of Hawai'i Press, 2006)"]

- id: chiang-mai-1774
  year: 1774
  endYear: 1776
  title:
    ko: "치앙마이 탈환과 란나의 시암 종속(1774~1776)"
  summary:
    ko: "란나 왕국은 1558년부터 버마의 지배를 받았고, 1767년 아유타야가 무너졌을 때도 치앙마이에는 버마의 총독이 있었다. 란나는 1292년 몽라이가 세운 나라로 한때 북부 타이의 중심이었으나 1558년 버마에 복속된 뒤 200년 넘게 버마 왕의 이름 아래 있었다. 콘바웅 왕조는 1760년대 후반 란나 사람들에게 군대와 물자를 무겁게 요구했다. 1771년 무렵부터 불만이 쌓였고, 1774년 치앙마이의 귀족 짜반(분마)과 람빵의 지도자 카윌라가 버마에 등을 돌렸다. 두 사람은 톤부리의 딱신에게 도움을 청했고, 시암군은 1775년 1월 이들과 함께 치앙마이를 에워싸 버마 수비대를 몰아냈다. 시암군은 짜오프라야 짜끄리와 동생 수라시가 이끌었다. 이때부터 란나는 시암의 영향 아래에 놓였다. 시암은 짜반을 치앙마이의 통치자로 세웠으나 1777년 버마군이 다시 쳐들어오자 짜반은 남쪽으로 물러났고(1779년 톤부리로 갔다가 갇혀 그곳에서 숨졌다), 치앙마이는 20년 가까이 사람이 거의 살지 않는 도시가 되었다. 카윌라는 람빵을 거점으로 버티다 1797년 치앙마이를 다시 세웠고(1782년부터 치앙마이 총독, 1802~1816년 왕), 버마의 거점이던 치앙센은 1804년 시암과 란나 연합군이 되찾았다. 이후 란나의 여러 도시는 시암의 속국으로서 자치를 누렸고, 1899년 시암이 직할 행정 구역으로 바꿀 때까지 이 관계가 이어졌다(「몬톤 제도와 란나·파타니의 편입(1892~1902)」(뒤의 사건)). 이 일은 단순한 지배자 교체가 아니라 버마와 시암이 북쪽 도시를 두고 벌인 오랜 경쟁이 시암 쪽으로 기운 전환점이었다. 또한 란나 사람들은 두 나라 사이에서 군역과 부역에 시달렸고, 많은 주민이 강제로 옮겨져 인구가 줄었다. 두 나라의 전쟁을 피해 남쪽으로 옮겨 간 란나 사람도 많았다."
  subjects: [lan-na, konbaung-dynasty, thailand]
  links:
    - { from: thailand, to: lan-na, note: "버마 수비대를 몰아내고 란나를 종속시킴 (1775)" }
  tags: [war, politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "David K. Wyatt and Aroonrut Wichienkeeo, The Chiang Mai Chronicle (Silkworm Books, 1998)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)"]

- id: voc-borneo-1779
  year: 1779
  endYear: 1787
  title:
    ko: "네덜란드 동인도 회사의 보르네오 진출: 폰티아낙 협정과 반자르의 봉토화(1779~1787)"
  summary:
    ko: "18세기 후반 네덜란드 동인도 회사는 이미 기울고 있었지만, 자와 밖의 항구와 광산을 지키려고 보르네오의 해안 왕국들과 조약을 맺었다. 서칼리만탄에서는 1771년 아랍계 하드라마우트 출신 샤리프 압두라흐만이 폰티아낙을 세웠고, 말레이 술탄들과 다야크 수장들 사이에서 금광을 캐던 중국인 광부 조합들이 힘을 키우고 있었다. 회사는 1779년 7월 5일 폰티아낙의 술탄과 협정을 맺어 상관을 두고 무역을 독점하려 했다. 회사는 17세기 후반 마카사르(1667년)와 반텐(1682년)을 눌러 군도의 향신료와 후추 무역을 장악했으나, 보르네오에서는 해안의 몇 항구에 머물러 있었다. 이 협정은 폰티아낙을 가운데에 놓고 삼바스, 란닥, 멤파와 같은 이웃 나라들에 영향력을 넓히는 발판이 되었다. 폰티아낙은 지금도 서칼리만탄의 중심 도시이다. 남쪽에서는 반자르 술탄국이 후추와 금, 다이아몬드를 팔아 번영했으나 17세기부터 회사와 맺은 조약으로 후추 무역이 묶여 있었다. 1787년 반자르의 술탄 타미둘라 2세가 왕위 다툼에서 회사의 도움을 받은 대가로 술탄국이 회사의 봉토라는 조약을 받아들였고, 회사는 술탄을 대신해 일부 땅과 항구를 관리했다. 그러나 이들 땅의 내륙은 여전히 다야크와 현지 수장들의 영향 아래에 있어 회사의 지배는 해안과 강 하구에 한정되었다. 또한 회사는 1780~1784년 영국과의 전쟁으로 재정이 나빠져 보르네오에 많은 군대를 둘 수 없었고, 1799년 회사가 사라진 뒤에는 이 조약들이 그대로 네덜란드령 동인도로 넘어갔다(「네덜란드 동인도 회사의 해산과 네덜란드령 동인도(1795~1800)」(뒤의 사건)). 이 일은 19세기에 네덜란드가 바깥섬을 하나씩 점령해 가는 첫걸음으로서 의미가 있다."
  subjects: [voc]
  tags: [diplomacy, economy]
