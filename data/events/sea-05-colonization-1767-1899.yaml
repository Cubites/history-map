- id: java-war-1825
  year: 1825
  endYear: 1830
  title:
    ko: "디파느가라와 자와 전쟁(1825~1830)"
  summary:
    ko: "욕야카르타의 왕자 디파느가라(1785~1855)는 술탄 하멩쿠부워노 3세의 맏아들이었으나 궁정 생활을 멀리하고 이슬람 수행과 농촌 생활을 택해 백성의 존경을 받았다. 1812년 영국이 욕야카르타를 약탈한 뒤 궁정은 네덜란드 관리의 영향 아래 놓였고, 땅을 빌려 농장을 하는 유럽인과 중국인 징세 청부업자가 늘어 농민이 시달렸다. 1825년 7월 네덜란드가 디파느가라의 땅 테갈레조에 도로를 내려 하자 충돌이 일어났고(7월 20일), 그는 7월 21일 반란을 선언했다. 디파느가라는 자신을 정의로운 왕(라투 아딜)이라 하며 농민과 이슬람 지도자, 귀족을 모았고 센톳 프라위로디르조 같은 젊은 장수가 게릴라전을 이끌었다. 이슬람 학자 키아이 마자가 정신적 조언자였다. 네덜란드령 동인도 정부는 1826년 이후 헨드릭 메르쿠스 더 코크 장군 아래에서 요새를 잇는 방식으로 활동 범위를 좁혔고, 반란 지도자들을 하나씩 항복시켰다. 이 요새 제도(벤테 스텔셀)는 반란군의 이동을 막는 데 쓰였다. 디파느가라는 1830년 3월 28일 마겔랑에서 협상 자리에서 붙잡혀 마나도로, 이어 마카사르로 유배되어 1855년 숨졌다. 전사자는 네덜란드 쪽이 약 1만 5천 명(유럽인 약 8천 명)이라고 하고, 자와 사람은 최소 20만 명이 폭력과 굶주림, 질병으로 죽었다는 추산이 있다. 전쟁 뒤 욕야카르타와 수라카르타의 군주는 변두리 땅을 네덜란드에 넘겨 힘을 잃었고, 수라카르타의 파쿠부워노 6세는 1830년 폐위되어 암본으로 보내졌다. 전쟁 비용(약 2천만~2천5백만 길더)을 메우려는 필요가 이듬해 시작된 강제 재배 제도(「강제 재배 제도(1830~1870)」(뒤의 사건))로 이어졌다."
  subjects: [dutch-east-indies]
  tags: [war, politics]
  places: [{ name: 디파느가라 체포(마겔랑), at: [110.22, -7.47], year: 1830 }]
  sources: ["Peter Carey, The Power of Prophecy: Prince Dipanagara and the End of an Old Order in Java, 1785–1855 (KITLV Press, 2007)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)"]

- id: anouvong-1826
  year: 1826
  endYear: 1828
  title:
    ko: "아누웡의 봉기와 비엔티안 왕국의 끝(1826~1828)"
  summary:
    ko: "란쌍 왕국이 1707년 갈라진 뒤 비엔티안은 1779년 시암(지금의 타이) 장군 짜오프라야 짜끄리(뒷날의 라마 1세)에게 정복되어 시암의 속국이 되었고, 아누웡은 1805년 비엔티안의 왕이 되어 형인 전 왕 난타센이 시암에 끌려가 죽은 일을 기억하고 있었다. 그는 짜끄리 왕조의 라마 2세가 죽고 라마 3세가 오른 1824년 이후 시암이 영국–버마 전쟁에 마음을 쓰는 틈을 노려 란쌍을 되살리려 했다. 아누웡은 봉기 전에 베트남 응우옌 왕조에 사절을 보내 후원을 청했다고 전한다. 1826년 아누웡은 시암에 여러 요구를 하며 병력을 모았고, 1827년 초 코랏(나콘랏차시마)까지 내려가 이를 점령했다. 점령한 도시의 주민 수천 명을 메콩 쪽으로 옮기려 했다고 전한다. 그러나 코랏의 시암 관리들은 주민을 이끌고 버텼고, 시암군이 반격에 나서 1827년 3월 사므릿 평원과 농부아람푸에서 라오 군을 무찔렀다. 아누웡은 비엔티안을 버리고 베트남 응에안으로 달아났다가 돌아왔으나, 시암군이 1827년 비엔티안을 함락하고 불태웠다. 그는 붙잡혀 방콕으로 끌려갔고 1828~1829년 감옥에서 숨졌다. 죽음의 경위는 사료마다 다르다. 시암은 비엔티안 왕국을 폐지하고 주민 수만 명을 메콩 서쪽의 이산 지역으로 강제로 옮겼다. 루앙프라방 왕은 시암 편에 서서 봉기에 가담하지 않았고, 참파삭과 이산의 일부 도시는 봉기에 호응했다가 무너졌다. 이 일로 메콩 왼쪽 기슭 비엔티안 평야는 인구가 크게 줄었고 1893년 프랑스가 들어오기 전까지 시암의 직접 지배를 받았다. 응우옌 왕조는 아누웡을 감싸다 시암과 긴장했고, 이후 시암과 베트남은 라오스를 두고 맞서게 된다. 라오스에서는 지금도 아누웡을 민족의 영웅으로 기린다."
  subjects: [vientiane-kingdom, thailand, luang-prabang-kingdom, champasak-kingdom, nguyen-dynasty]
  links:
    - { from: thailand, to: vientiane-kingdom, note: "비엔티안을 함락하고 왕국을 없앰 (1827~1828)" }
  tags: [war, politics]
  places: [{ name: 농부아람푸 전투, at: [102.44, 17.2], year: 1827 }]
  sources: ["Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "Mayoury Ngaosyvathn and Pheuiphanh Ngaosyvathn, Paths to Conflagration: Fifty Years of Diplomacy and Warfare in Laos, Thailand, and Vietnam, 1778–1828 (Cornell Southeast Asia Program, 1998)", "David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)"]

- id: cultivation-system-1830
  year: 1830
  endYear: 1870
  title:
    ko: "강제 재배 제도(1830~1870)"
  summary:
    ko: "자와 전쟁과 벨기에 혁명으로 네덜란드 재정이 바닥나자 네덜란드령 동인도 총독 요하네스 판 덴 보스(재임 1830~1833)는 1830년 농민에게 수출 작물을 재배하게 하는 제도를 내놓았다. 규정으로는 마을이 땅의 5분의 1을 사탕수수, 인디고, 커피 같은 수출 작물에 쓰거나 해마다 66일 동안 정부 농장에서 일해야 했다. 수확물은 정해진 값으로 정부에 넘겼고, 이를 1824년 세워진 네덜란드 무역 회사(NHM)가 유럽에 팔았다. 그러나 실제로는 많은 마을이 규정을 넘는 땅을 내놓아 쌀 농사가 줄었고, 작물을 키우기에 적합하지 않은 땅에서도 억지로 재배가 이루어졌다. 현지 지배층과 관리가 수확물에 따라 수당을 받아 압박을 더했다. 수출 작물을 심은 땅의 세금은 면제한다고 했으나 흉작이어도 부담은 줄지 않았다. 이 제도로 네덜란드는 빠르게 이익을 올려 1831년 식민지 재정을 흑자로 돌렸고, 한때 국가 수입의 절반 안팎, 수십 년 동안 8억 길더 넘는 이익을 올렸다고 한다. 그 이익으로 네덜란드는 빚을 갚고 철도를 놓았다. 반면 자와에서는 1840년대 후반 중부 자와의 데막과 그로보간에서 기근과 전염병이 퍼졌고 사망률이 크게 올랐다. 에두아르트 다우어스 데커르가 ‘물타툴리’라는 필명으로 1860년에 낸 『막스 하벨라르』는 제도의 폐해를 고발해 네덜란드 여론을 움직였다. 자유주의 정치인들은 사기업에 땅을 열라고 요구했고, 1870년 농지법(아흐라리스허 베트)과 설탕법이 제도를 단계적으로 없애는 길을 열었다. 커피 강제 재배는 서부 자와에서 1917년까지 이어졌다. 이 제도는 자와의 경제를 수출용 작물에 묶고 식민지 재정의 틀을 만든 시기였다."
  subjects: [dutch-east-indies, netherlands]
  links:
    - { from: netherlands, to: dutch-east-indies, note: "강제 재배로 막대한 이익을 거둬들임 (1830~1870)" }
  tags: [economy, society, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Robert Elson, Village Java under the Cultivation System, 1830–1870 (Allen & Unwin, 1994)", "Multatuli, Max Havelaar of de koffieveilingen der Nederlandsche Handel-Maatschappij (1860)"]

- id: brooke-sarawak-1841
  year: 1841
  endYear: 1868
  title:
    ko: "제임스 브룩과 사라왁 라자국(1841~1868)"
  summary:
    ko: "제임스 브룩(1803~1868)은 동인도 회사의 군인이었다가 물려받은 재산으로 배를 사서 1838년 보르네오로 갔다. 1839년 쿠칭에 닿았을 때 브루나이 술탄 오마르 알리 사이푸딘 2세의 숙부 파겡란 무다 하심은 사라왁의 반란에 시달리고 있었다. 브룩은 반란을 진압하는 일을 도왔고, 하심은 그 대가로 사라왁의 통치를 약속했다. 술탄은 1841년 9월 24일 그를 사라왁의 라자로 인정했고, 이 지위는 1842년 8월 18일 공식으로 선포되었다. 처음 영토는 탄중 다투에서 사마라한강까지 좁은 해안 지대였다. 브룩은 1840년대 이반족 해적을 소탕한다며 영국 해군과 함께 싸웠고, 영국 의회에서 학살이라는 비판이 일자 싱가포르의 조사 위원회가 혐의를 벗겼다. 1846년 브루나이 술탄은 라부안 섬을 영국에 넘겼고 브룩은 1848년 라부안의 초대 총독이 되었다. 사라왁은 1850년대 초 사리바스와 스크랑, 1861년 라장강 유역과 빈툴루를 브루나이에서 넘겨받아 넓어졌고, 1857년에는 금을 캐던 중국인 광부들의 반란(리우 샨 방이 이끎)을 눌렀다. 영국은 1864년 사라왁을 독립국으로 인정했다. 브룩은 1868년 6월 11일 영국에서 숨졌고, 조카 찰스 브룩이 이어받았다. 찰스는 1917년까지 다스렸고, 그 뒤 비너 브룩이 1946년까지 이었다. 브룩 가문이 다스린 사라왁은 ‘백인 라자’의 나라로 불렸으며, 라자가 다야크와 말레이, 중국인 사이의 균형을 이용했다는 평가와 함께 영토를 늘려 간 과정이 브루나이 쪽에서는 영토 상실로 기억된다. 이 사건은 「북보르네오 회사와 브루나이의 영국 보호령(1877~1890)」(뒤의 사건)으로 이어진다."
  subjects: [sarawak, brunei, uk]
  links:
    - { from: sarawak, to: brunei, note: "사마라한강 서쪽을 라자의 땅으로 받음 (1841)" }
    - { from: sarawak, to: brunei, note: "라장강 유역과 빈툴루를 넘겨받음 (1861)" }
  tags: [politics, diplomacy]
  sources: ["Steven Runciman, The White Rajahs: A History of Sarawak from 1841 to 1946 (Cambridge University Press, 1960)", "Nicholas Tarling, Piracy and Politics in the Malay World: A Study of British Imperialism in Nineteenth-Century South-East Asia (F. W. Cheshire, 1963)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)"]

- id: outer-islands-1846
  year: 1846
  endYear: 1863
  title:
    ko: "네덜란드의 바깥섬 원정: 발리와 반자르마신(1846~1863)"
  summary:
    ko: "19세기 중엽까지 네덜란드령 동인도의 실제 지배는 자와와 말루쿠, 수마트라 서해안에 한정되었고, 보르네오와 발리, 술라웨시 같은 바깥섬 대부분은 현지 군주의 땅이었다. 네덜란드는 영국과 프랑스가 해적 소탕과 통상을 구실로 진출하는 일을 막고 강제 재배 제도로 쌓은 재원을 쓰려고 이들 섬에 군대를 보냈다. 자와 전쟁(1825~1830)으로 재정이 바닥난 시기에는 바깥섬에 군대를 보낼 여유가 없었다. 발리에서는 1844년 난파선의 화물을 둘러싼 분쟁을 구실로 1846년 부렐렝과 카랑가셈을 공격했다. 1848년 두 번째 원정은 자가라가에서 크게 졌으나 1849년 4월 자가라가 요새를 함락했고, 그 결과 부렐렝을 비롯한 북부 발리가 네덜란드의 지배 아래 들어갔다. 발리에서는 힌두 왕국들이 관개 조직 수박을 바탕으로 쌀농사를 해 왔다. 발리 남부의 쿨룽쿵과 바둥은 1906년과 1908년 전사들의 집단 자결(푸푸탄)로 끝난 전쟁까지 독립을 유지했다. 남부 칼리만탄에서는 1859년 4월 반자르 술탄국의 왕위 다툼에 네덜란드가 개입했다가 석탄 광산 습격(페가롱)이 일어나 반자르마신 전쟁이 시작되었다. 술탄 탐지둘라 2세는 폐위되고 반자르 술탄국은 1860년 6월 폐지되었으며, 왕자 안타사리는 1862년 10월 천연두로 숨질 때까지 다야크와 함께 싸웠다. 1858년에는 수마트라 동해안의 시악 술탄국이 네덜란드의 종주권을 받아들이는 조약을 맺었고, 1862년에는 델리가 계약으로 네덜란드의 보호 아래 들어갔다. 이렇게 네덜란드는 1840~1860년대에 남은 바깥섬 왕국들을 하나씩 계약과 군사 행동으로 묶어 갔다. 지배는 해안에서 내륙으로 천천히 넓어졌고, 아체(「아체 전쟁(1873~1904)」(뒤의 사건))가 가장 오래 버틴 곳이 되었다."
  subjects: [dutch-east-indies, banjar-sultanate]
  tags: [war, politics]
  places: [{ name: 자가라가 요새 함락, at: [115.15, -8.15], year: 1849 }]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Adrian Vickers, Bali: A Paradise Created (Periplus, 1989)", "Jean Gelman Taylor, Indonesia: Peoples and Histories (Yale University Press, 2003)"]

- id: spain-sulu-1848
  year: 1848
  endYear: 1878
  title:
    ko: "스페인의 술루 원정과 1851·1878년 협정(1848~1878)"
  summary:
    ko: "술루 술탄국은 15세기 초부터 술루 군도와 보르네오 북동부 해안까지 영향력을 가진 이슬람 나라로, 술루 쪽은 노예 교역을 위해 필리핀 해안을 습격했고 스페인은 이에 맞서 술루를 거듭 공격해 오랫동안 싸워 왔다. 스페인은 1565년 레가스피가 세부에 정착한 뒤 북부와 중부 필리핀을 차지했으나 남부의 술루와 민다나오 이슬람 세력은 정복하지 못했다. 스페인이 증기선을 도입하면서 사정이 바뀌었다. 1848년 총독 클라베리아는 술루 군도의 발랑긴기 섬(사말족의 거점)을 증기선으로 공격해 점령했다. 1851년 4월 스페인은 술탄 무함마드 풀랄룬과 협정을 맺어 스페인의 종주권을 인정받았고, 술루 쪽은 이를 보호 관계로 읽었다. 이후에도 술탄국은 영국·독일과 직접 거래를 이어 갔다. 스페인은 1876년 2월 해군 제독 말캄포의 원정군으로 술루의 수도 졸로(홀로)를 점령하고 성채와 주둔군을 두었다. 졸로는 술루 군도 중심 섬의 도시로 술탄이 거처하던 곳이다. 술탄 자말룰 알람은 1878년 7월 스페인과 협정을 맺었다. 스페인어 문서에서는 스페인의 주권을 인정하는 것으로, 타우수그어 문서에서는 보호령 관계로 읽혀 두 해석이 달랐다. 술탄은 같은 해 보르네오 북부의 땅(지금 사바)을 오버벡과 데이트에게 임대한 1878년 계약(「북보르네오 회사와 브루나이의 영국 보호령(1877~1890)」(뒤의 사건))도 맺어 스페인의 영향권을 약화시키려 했다. 영국·독일·스페인은 1885년 마드리드 의정서로 스페인의 술루 주권을 인정하고 스페인이 북보르네오 요구를 접는 데 합의했다. 그러나 실제로 스페인의 통제는 졸로 주변에 한정되었고, 술탄국은 1915년까지 이름을 이어 갔다(「미국의 모로 지배와 술루 술탄국의 끝(1903~1915)」(뒤의 사건))."
  subjects: [spanish-philippines, sulu-sultanate]
  links:
    - { from: spanish-philippines, to: sulu-sultanate, note: "졸로를 점령하고 주권을 주장함 (1876~1878)" }
  tags: [war, diplomacy]
  sources: ["James Francis Warren, The Sulu Zone, 1768–1898: The Dynamics of External Trade, Slavery, and Ethnicity in the Transformation of a Southeast Asian Maritime State (NUS Press, 2007)", "Luis H. Francia, A History of the Philippines: From Indios Bravos to Filipinos (Overlook Press, 2010)", "「스페인–술루 협정」(1851·1878)"]

- id: second-anglo-burmese-war-1852
  year: 1852
  endYear: 1878
  title:
    ko: "제2차 영국–버마 전쟁과 민돈 왕의 개혁(1852~1878)"
  summary:
    ko: "1826년 얀다보 조약 뒤 콘바웅 왕조는 바지도(재위 1819~1837), 타라와디(1837~1846), 파간(1846~1853)을 거쳐 영국과 긴장을 이어 갔고, 랑군(지금 양곤)에서 영국 상인의 선장 둘이 현지 총독에게 벌금을 물게 된 일이 구실이 되었다. 인도 총독 달하우지(「달하우지의 실권 원칙 병합: 사타라·나그푸르·아와드(1848~1856)」(앞의 사건))는 1851년 해군을 보냈고 전쟁은 1852년 4월 시작되었다. 영국군은 마르타반(4월 5일)과 랑군(4월 12일)을 차지한 뒤 바세인과 페구(6월 3일)를 점령했고, 10월에는 프롬을 얻었다. 달하우지는 조약 없이 버마 남부를 영국령 인도에 넣는다는 포고를 1853년 1월 20일 냈다. 버마 궁정에서는 1853년 2월 18일 파간 왕이 이복형제 민돈에게 밀려났다. 민돈(재위 1853~1878)은 하버마 병합을 인정하는 조약에는 끝내 서명하지 않았으나 더는 싸우지도 않았다. 그는 1857년 만달레이를 새 도읍으로 세우기 시작했고, 사찰과 학교를 키우며 1871년 제5차 불교 결집을 열었다. 외교관을 유럽에 보내고 증기선과 무기 공장을 도입했으며 1862년과 1867년 영국과 통상 조약을 맺었다. 그러나 1866년 왕자들의 쿠데타 시도(왕세제 카나웅이 살해됨)가 일어나 궁정이 흔들렸고, 상버마는 바다에서 막혀 하버마의 쌀 무역으로 번성하던 영국과 격차가 커졌다. 영국령 버마(하버마)는 처음 동인도 회사령 인도에, 1858년 뒤에는 영국령 인도에 속했으며, 민돈이 죽은 1878년 티보가 오르며 위기가 닥친다(「제3차 영국–버마 전쟁과 콘바웅 왕조의 끝(1885~1886)」(뒤의 사건))."
  subjects: [konbaung-dynasty, company-india, british-raj]
  links:
    - { from: company-india, to: konbaung-dynasty, note: "하버마를 점령하고 병합함 (1852~1853)" }
  tags: [war, politics]
  places: [{ name: 랑군 점령, at: [96.16, 16.8], year: 1852 }]
  sources: ["Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)", "Michael Charney, A History of Modern Burma (Cambridge University Press, 2009)", "D. G. E. Hall, A History of South-East Asia (Macmillan, 1955)"]

- id: johor-pahang-1853
  year: 1853
  endYear: 1863
  title:
    ko: "조호르와 파항의 갈라짐, 파항 내전(1853~1863)"
  summary:
    ko: "조호르–리아우 술탄국은 1824년 영국–네덜란드 조약으로 반도의 조호르와 네덜란드 쪽의 리아우–링가로 나뉘었다. 반도의 조호르에서는 술탄 후세인이 1835년 숨진 뒤 아들 알리가 이어받았으나 실권은 싱가포르에 있던 테멩공 이브라힘에게 있었다. 이브라힘은 1840년대 이후 싱가포르에서 후추와 감비르 재배를 키워 재정을 불렸다. 후세인은 1819년 래플스와 조약을 맺은 그 사람이다(「래플스의 싱가포르 건설(1819~1824)」(앞의 사건)). 파항은 술탄이 임명한 벤다하라(재상)가 다스리는 땅이었는데, 벤다하라 툰 알리가 1853년 무렵 독립을 선언하고 조호르와 따로 서 갔다. 벤다하라 가문은 말라카 시대 이래 술탄 다음가는 재상 가문이었다. 1855년 3월 알리 술탄은 영국 해협 식민지 총독의 중재로 조호르 본토 대부분(무아르 제외)을 테멩공 이브라힘에 넘기는 조약을 맺었다. 이로써 조호르의 실제 지배자는 테멩공이 되었고(이브라힘 1862년 죽음, 아들 아부 바카르가 이어받음), 알리는 무아르만 다스렸다. 파항에서는 1857년 툰 알리가 죽고 아들 툰 무타히르가 벤다하라가 되자 동생 완 아흐마드가 형과 맞서 파항 내전(1857~1863)이 일어났다. 완 아흐마드는 1863년 무타히르를 몰아내고 벤다하라가 되었다. 그는 뒷날 1881년 술탄의 칭호를 쓰게 되고 1888년 영국의 보호를 받아들인다. 싱가포르의 해협 식민지 정부는 직접 개입하지 않았으나, 조호르의 테멩공 이브라힘과 그 아들 아부 바카르(1862년 테멩공, 1885년 술탄)는 싱가포르 상인들과 이어져 툰 무타히르를 도왔고, 조호르의 술탄 알리와 트렝가누의 술탄은 완 아흐마드를 도왔다고 전한다. 이 사건은 조호르와 파항이 하나의 술탄국에서 두 나라로 서는 과정이었다."
  subjects: [pahang-sultanate, johor-sultanate, straits-settlements]
  links:
    - { from: pahang-sultanate, to: johor-sultanate, note: "벤다하라 툰 알리가 독립을 선언함 (1853)" }
  tags: [politics, war]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Nicholas Tarling, ed., The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: bowring-treaty-1855
  year: 1855
  endYear: 1868
  title:
    ko: "몽꿋 왕과 보링 조약, 시암의 개방(1855~1868)"
  summary:
    ko: "몽꿋(라마 4세, 재위 1851~1868)은 왕위에 오르기 전 27년을 승려로 지내며 라틴어와 영어, 천문학을 배웠고 불교 개혁(탐마윳 파)을 이끌었다. 즉위 뒤에는 영어 가정교사를 들여 왕자들에게 서양 학문을 가르쳤다. 그는 1820년대 영국–버마 전쟁에서 드러난 영국의 힘을 알았기에, 시암(지금의 타이)을 지키려면 서양과 무역을 열어야 한다고 보았다. 시암은 1826년 헨리 버니가 맺은 조약으로 영국과 제한된 통상을 허용했으나 왕실 독점은 그대로였고, 1850년대 후반 영국과 프랑스가 청과 베트남을 압박하는 소식도 몽꿋의 판단에 영향을 주었다. 1855년 4월 18일 홍콩 총독 존 보링이 방콕에서 시암과 우호 통상 조약을 맺었다. 조약으로 영국 신민은 영사 재판권(치외 법권)을 얻었고, 왕실이 틀어쥔 무역 독점과 선박 크기에 따른 관세를 없애고 수입품에 일률로 약 3퍼센트 관세를 매기기로 했다. 아편은 정부의 징세 청부업자를 통해서만 들일 수 있었다. 영국 신민은 방콕 둘레에서 땅을 가지고 여행할 권리도 얻었다. 영국 여왕의 법률 고문이 조항이 모호하다고 지적해 해리 파크스가 방콕으로 와서 1856년 5월 보충 협정을 맺었고, 조약은 1856년 4월 비준서를 교환해 이튿날 시행되었다. 미국(1856년 5월)과 프랑스(1856년 8월)를 비롯한 여러 나라도 비슷한 조약을 서둘러 체결했다. 그 결과 쌀 수출이 크게 늘고 시암 경제가 세계 시장과 이어졌으나, 왕실의 관세 수입이 줄고 치외 법권으로 사법권이 제한되었다. 몽꿋은 1868년 8월의 일식을 예측하다 얻은 말라리아로 같은 해 10월 숨졌고 아들 쭐랄롱꼰이 이어받았다(「쭐랄롱꼰의 개혁과 노예제 폐지(1868~1905)」(뒤의 사건))."
  subjects: [thailand, uk]
  links:
    - { from: uk, to: thailand, note: "통상 조약으로 치외 법권과 관세 특권을 얻음 (1855)" }
  tags: [diplomacy, economy]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "「영국–시암 우호 통상 조약(보링 조약)」(1855)"]

- id: saigon-treaty-1858
  year: 1858
  endYear: 1874
  title:
    ko: "프랑스의 다낭 공격과 사이공 조약, 코친차이나 식민지(1858~1874)"
  summary:
    ko: "프랑스는 뜨득 황제(재위 1847~1883)가 가톨릭 선교사를 박해한다는 이유와 통상 확대를 구실로 베트남에 군대를 보냈다. 스페인도 선교사 처형에 항의해 필리핀 병력을 보냈다. 프랑스–스페인 연합 함대는 1858년 9월 1일 다낭을 공격했으나 전염병과 베트남군의 방어로 오래 버티지 못했다. 이에 프랑스군은 목표를 쌀 산지인 남부로 바꿔 1859년 2월 사이공을 점령했다. 1860년 중국의 일에 힘이 묶였다가 돌아온 프랑스군은 1861년 사이공 둘레의 반격을 눌렀고, 뜨득 황제는 1862년 6월 사이공 조약을 맺었다. 조약으로 비엔호아, 자딘, 딘뜨엉 세 성과 꼰다오 섬을 프랑스에 넘기고 전쟁 배상금을 내며 기독교 포교를 허용하고 다낭 등을 열기로 했다. 다낭은 이때 프랑스 상선에 열렸다. 프랑스는 이 땅을 코친차이나로 묶어 직접 다스렸고(식민지 체제는 1864년에 갖추었다고 본다), 1867년 6월 제독 라 그랑디에르가 서쪽 세 성(빈롱, 안장, 하띠엔)을 조약 없이 점령해 병합했다. 서쪽 세 성을 맡던 대신 판 타인 잔은 이때 음독으로 숨졌다. 1873년 프랑스인 가르니에가 통킹의 하노이를 점령했으나 흑기군에게 죽었고, 프랑스는 1874년 3월 15일 제2차 사이공 조약으로 철수하는 대신 남부 여섯 성에 대한 지배를 인정받고 홍강을 열게 했다. 이 조약으로 프랑스는 베트남의 대외 관계를 이끌 권한도 얻었다고 주장했다. 코친차이나는 1879년 처음으로 민간인 총독을 맞았고 쌀 수출이 크게 늘었다. 이렇게 코친차이나는 응우옌 왕조의 영토에서 떨어져 나가 프랑스가 직접 다스리는 식민지가 되었다. 청과의 관계는 「청불 전쟁과 톈진 조약(1883~1885)」(뒤의 사건)에서 이어진다."
  subjects: [nguyen-dynasty, cochinchina, france, spain]
  links:
    - { from: nguyen-dynasty, to: cochinchina, note: "동부 세 성과 꼰다오를 프랑스에 넘김 (1862)" }
    - { from: cochinchina, to: nguyen-dynasty, note: "서부 세 성을 병합함 (1867)" }
  tags: [war, diplomacy, politics]
