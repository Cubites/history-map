- id: voc-dissolution-1795
  year: 1795
  endYear: 1800
  title:
    ko: "네덜란드 동인도 회사의 해산과 네덜란드령 동인도(1795~1800)"
  summary:
    ko: "네덜란드 동인도 회사는 17세기에 향신료 무역을 독점해 막대한 이익을 올렸으나, 18세기 후반에는 부패와 사무역, 값싼 영국 상품과의 경쟁으로 기울었다. 영국과의 제4차 전쟁(1780~1784)에서 배와 무역로를 잃었고, 이익이 줄었는데도 배당을 빚으로 계속 주어 부채가 불어났다. 회사는 한때 세계 최대 규모의 무역 회사였고, 1669년에는 상선 150척과 군함 40척, 병사 1만 명을 갖추었다. 1795년 1월 프랑스 혁명군이 네덜란드 공화국을 점령하고 바타비아 공화국을 세우자 오라녜 공 빌럼 5세는 영국으로 망명했고, 그가 2월에 쓴 큐 서한은 식민지 총독들에게 프랑스의 손에 넘어가지 않도록 영국에 협력하라고 지시했다. 영국은 이에 따라 1795년 8월 말라카를 점령했고 1796년에는 암본과 반다를 차지했다. 케이프 식민지도 1795년 영국 손에 들어갔다. 그러나 바타비아의 총독부는 대체로 이를 따르지 않았고 자와는 네덜란드 손에 남았다. 바타비아 공화국은 1796년 회사를 국가 관리 아래 두고 1799년 12월 31일 특허가 끝나자 회사의 영토와 빚(약 1억 3천만 길더 안팎)을 넘겨받았다. 이로써 1602년에 세운 회사는 사라졌다(「네덜란드 동인도 회사의 설립」(앞의 사건)). 이듬해 1800년 1월 1일부터 자와, 말루쿠, 술라웨시 일부 등 회사가 다스리던 땅은 정부가 직접 다스리는 네덜란드령 동인도가 되었다. 총독은 회사 시절의 관료 틀을 이어 일했으나, 영국의 해상 봉쇄로 무역이 막혀 재정은 오히려 나빠졌다. 이 점에서 1800년의 전환은 회사의 시대가 끝나고 국가가 식민지를 직접 다스리는 시대가 시작된 때로 볼 수 있다."
  subjects: [voc, dutch-east-indies, batavian-republic, dutch-republic, uk]
  links:
    - { from: dutch-east-indies, to: voc, note: "회사의 영토와 빚을 이어받음 (1800)" }
    - { from: uk, to: voc, note: "큐 서한에 따라 말라카를 점령함 (1795)" }
  tags: [politics, economy]
  sources: ["Femme S. Gaastra, The Dutch East India Company: Expansion and Decline (Walburg Pers, 2003)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Jean Gelman Taylor, Indonesia: Peoples and Histories (Yale University Press, 2003)"]

- id: british-java-1811
  year: 1811
  endYear: 1816
  title:
    ko: "영국의 자와 점령과 래플스(1811~1816)"
  summary:
    ko: "나폴레옹 전쟁 중 네덜란드가 프랑스의 영향 아래 들어가자 총독 헤르만 빌럼 다엔덜스(재임 1808~1811)는 영국의 공격에 대비해 자와의 도로와 요새를 정비했다. 그는 서쪽 끝 안예르에서 동쪽 끝 파나루칸까지 이어지는 대우편로를 놓으며 강제 노동을 썼고, 후임 얀선스는 병력이 부족했다. 인도 총독 민토 경이 보낸 영국군 1만 2천 명 안팎이 1811년 6월 말라카를 떠나 8월 4일 바타비아 가까이에 상륙해 도시를 차지했고, 8월 26일 메이스터르 코르넬리스 요새를 무너뜨렸다. 얀선스는 9월 18일 퉁탕에서 항복했다. 민토는 토머스 스탬퍼드 래플스를 자와 부총독(재임 1811~1816)으로 임명했다. 래플스는 동인도 회사가 인도에서 시행한 토지세 제도를 본떠 농민이 직접 세금을 내게 하고 강제 공납을 줄이려 했으나, 제도는 자리를 잡지 못했다. 1812년 6월 영국군은 욕야카르타의 술탄 하멩쿠부워노 2세를 폐위하고 궁정을 약탈했으며, 이듬해 파쿠알람 영지를 세워 술탄의 땅을 쪼갰다. 래플스는 이 시기 자와 사회를 다룬 『자와의 역사』(1817)를 썼다. 그는 1814년 코르넬리우스에게 명해 중부 자와 밀림에 묻혀 있던 보로부두르를 조사하게 했고, 1812년에는 팔렘방 술탄을 폐위하고 방카 섬을 차지했다가 1816년 돌려주었다. 1814년 런던 조약으로 영국은 네덜란드의 식민지를 돌려주기로 했고, 자와는 1816년 8월 네덜란드 대표단에 넘겨졌다. 영국의 점령기는 5년에 불과했지만 래플스는 이 경험으로 싱가포르 건설(「래플스의 싱가포르 건설(1819~1824)」(뒤의 사건))과 동남아에서 영국 세력을 넓히는 데 큰 역할을 했다. 말루쿠는 1810년부터 1817년까지 영국이 점령했다가 돌려주었다. 자와 서쪽 끝의 반튼 술탄국은 1808년 다엔덜스 치하에서 네덜란드에 흡수되었고(대우편로 공사의 강제 노동 요구를 둘러싼 갈등이 있었다고 전한다), 1813년 래플스가 술탄 무함마드 샤피우딘을 퇴위시켜 술탄국을 폐지했다."
  subjects: [dutch-east-indies, uk, company-india, banten-sultanate]
  links:
    - { from: uk, to: dutch-east-indies, note: "자와를 점령했다가 돌려줌 (1811~1816)" }
  tags: [war, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Thomas Stamford Raffles, The History of Java (Black, Parbury, and Allen, 1817)", "John Bastin, The British in West Sumatra (1685–1825) (University of Malaya Press, 1965)"]

- id: singapore-1819
  year: 1819
  endYear: 1824
  title:
    ko: "래플스의 싱가포르 건설(1819~1824)"
  summary:
    ko: "싱가포르는 14세기부터 알려진 항구였으나 19세기 초에는 조호르 술탄국에 딸린 작은 어촌이었다. 싱가푸라(사자의 도시)라는 이름은 산스크리트어에서 왔고 14세기에는 테마섹이라는 이름으로 알려졌다. 토머스 스탬퍼드 래플스는 네덜란드가 말라카 해협 무역을 틀어쥐고 있다고 보고, 영국의 거점을 말라카 해협 남쪽 입구에 마련하려 했다. 그는 윌리엄 파쿠하르와 함께 1819년 1월 29일 싱가포르에 상륙했다. 당시 조호르 술탄국은 1812년 술탄 마흐무드 3세가 죽은 뒤 갈라져, 리아우에는 네덜란드와 부기스의 도움을 받은 동생 압둘 라만이 술탄으로 앉았고 정통 후계자 툰쿠 후세인은 밀려나 있었다. 래플스는 섬을 다스리던 테멩공(같은 이름의 압둘 라만)과 협의해 후세인을 조호르 술탄으로 세웠고, 1819년 2월 6일 조약으로 회사가 술탄과 테멩공에게 해마다 5천 달러와 3천 달러를 주는 대가로 섬에 상관을 두는 권리를 얻었다. 항구는 관세 없는 자유 무역항이 되었고 중국, 인도, 말레이, 부기스 상인이 몰려 1824년에는 인구가 1만 명을 넘었다. 1819년 래플스가 상륙했을 때 섬에는 말레이인과 중국인 1천 명 안팎이 살았다고 한다. 래플스는 1822년 민족별 구역을 나눈 도시 계획을 세웠다. 네덜란드는 이 점유에 항의했고, 영국 안에서도 의견이 갈렸다. 그러나 1824년 3월 영국–네덜란드 조약(「영국–네덜란드 조약과 해협 식민지의 성립(1824~1826)」(뒤의 사건))이 네덜란드의 반대를 거두었고, 그해 8월 술탄과 테멩공이 섬 전체를 회사에 넘기는 조약을 맺었다. 이후 싱가포르는 페낭과 말라카를 앞서 해협 식민지의 중심이 된다. 파쿠하르는 1823년까지 초대 주재관으로 일했고, 래플스는 그해 섬을 떠나 영국에서 1826년 7월 숨졌다."
  subjects: [johor-sultanate, straits-settlements, company-india]
  links:
    - { from: straits-settlements, to: johor-sultanate, note: "싱가포르 섬을 조약으로 넘겨받음 (1819~1824)" }
  tags: [politics, economy, diplomacy]
  sources: ["Constance Mary Turnbull, A History of Modern Singapore, 1819–2005 (NUS Press, 2009)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Carl A. Trocki, Singapore: Wealth, Power and the Culture of Control (Routledge, 2006)"]

- id: minh-mang-1820
  year: 1820
  endYear: 1847
  title:
    ko: "민망 황제의 중앙 집권과 참파·캄보디아(1820~1847)"
  summary:
    ko: "자롱 황제의 넷째 아들 민망은 1820년 즉위해 1841년까지 다스렸다(재위 1820~1841). 그는 유교 관료제를 모범으로 삼아 중앙 집권을 밀어붙였다. 자롱 때 북부와 남부에 두었던 총독부(북성, 자딘성)를 1831~1832년 폐지하고 전국을 30개 남짓한 성으로 나눠 중앙에서 관료를 보냈다. 관리는 과거 시험으로 뽑는 일을 늘렸고, 1838년에는 나라 이름을 대남(大南)으로 바꾸었다. 특히 남부에서 큰 세력을 이루던 레 반 주옛이 1832년 죽자 그의 세력을 뿌리뽑으려 했고, 이에 맞서 일어난 레 반 코이의 반란(1833~1835)이 사이공 성을 거점으로 2년 넘게 이어졌다. 1832년에는 오래 남아 있던 참파의 마지막 자치 정권(판랑 일대)을 없애고 영토를 성으로 편입했다. 민망은 가톨릭을 위험하게 여겨 1825년부터 선교사의 입국을 막고 1833년 이후에는 금교령을 강화했다. 서쪽에서는 시암(지금의 타이)과 캄보디아를 두고 맞섰다. 시암이 레 반 코이의 반란을 틈타 1833년 말 침공했으나 1834년 초 응우옌 쪽에 크게 졌고, 베트남은 1835년 캄보디아에 쩐떠이성을 두고 앙메이 여왕을 허수아비로 세워 직접 다스리려 했다. 이 지배는 캄보디아 사람들의 저항을 낳아 1840년 이후 무너졌다. 민망의 뒤를 이은 티에우찌 황제(재위 1841~1847)는 1841~1845년 시암–베트남 전쟁을 치르고 캄보디아에서 철수한 뒤 앙두옹을 두 나라의 종주권 아래 왕으로 인정했으며, 1847년 다낭에서 프랑스 군함의 포격을 받았다. 이어 뜨득 황제(재위 1847~1883)가 올랐다. 이 기간 응우옌 왕조는 영토가 가장 넓었으나 서양의 압박이 높아지고 있었다."
  subjects: [nguyen-dynasty, cambodia, thailand, france, champa]
  links:
    - { from: nguyen-dynasty, to: cambodia, note: "쩐떠이성을 두어 직접 다스리려 함 (1835~1840)" }
  tags: [politics, war, religion]
  sources: ["Choi Byung Wook, Southern Vietnam under the Reign of Minh Mạng (1820–1841) (Cornell Southeast Asia Program, 2004)", "Alexander Woodside, Vietnam and the Chinese Model (Harvard University Press, 1971)", "David Chandler, A History of Cambodia (Westview Press, 2008)", "Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)"]

- id: padri-war-1821
  year: 1821
  endYear: 1838
  title:
    ko: "미낭카바우의 파드리 전쟁(1821~1838)"
  summary:
    ko: "서수마트라의 미낭카바우 사회는 어머니 쪽으로 혈통을 잇는 관습(아닷)을 지켜 왔다. 19세기 초 메카에서 돌아온 하지들은 와하비 운동의 영향으로 투계, 도박, 아편, 모계 상속 같은 관습을 이슬람에 어긋난다고 보고 이를 뜯어고치려 했고, 이들을 파드리라 불렀다. 투안쿠 낭 렌체와 투안쿠 임암 본졸 등이 이름난 지도자였고, 1815년에는 파드리가 미낭카바우 왕실의 중심 파가루융을 공격해 많은 왕족이 죽었다. 1803년 무렵부터 파드리와 관습을 지키는 귀족·수장들 사이에 싸움이 벌어졌고 파드리가 우세해지자 아닷 쪽의 지도자들은 네덜란드에 도움을 청했다. 1821년 2월 파당에서 아닷 지도자들이 네덜란드와 협정을 맺었고 4월 네덜란드군이 파드리 거점을 공격했다. 하지만 1825년부터 자와 전쟁(「디파느가라와 자와 전쟁(1825~1830)」(뒤의 사건))이 터져 네덜란드는 이곳에서 군대를 빼야 했다. 네덜란드는 1833년 ‘긴 선언문’(플라캇 판장)을 발표해 장세 없이 평화를 지키겠다고 했으나 실제로는 강제 커피 재배를 퍼뜨렸다. 이 무렵 파드리의 지도자 투안쿠 임암 본졸은 이전의 급진 노선에서 물러나 관습 지도자들과 화해하려 했다. 네덜란드는 1837년 본졸 요새를 포위해 8월 16일 함락했고, 투안쿠 임암 본졸은 그해 붙잡혀 서부 자와의 치안주르, 암본, 마나도로 유배되었다. 1838년 마지막 요새 달루달루가 무너지면서 전쟁은 끝났다. 이 전쟁으로 미낭카바우 고지대는 네덜란드령 동인도에 편입되어 커피 재배지가 되었다. 한편 파드리가 요구한 이슬람 규범과 모계 전통은 이후 ‘아닷은 이슬람에 기대고 이슬람 율법은 꾸란에 기댄다’는 합의로 이어졌다."
  subjects: [dutch-east-indies]
  tags: [war, religion, society]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Christine Dobbin, Islamic Revivalism in a Changing Peasant Economy: Central Sumatra, 1784–1847 (Curzon Press, 1983)", "Jean Gelman Taylor, Indonesia: Peoples and Histories (Yale University Press, 2003)"]

- id: anglo-dutch-treaty-1824
  year: 1824
  endYear: 1826
  title:
    ko: "영국–네덜란드 조약과 해협 식민지의 성립(1824~1826)"
  summary:
    ko: "싱가포르를 둘러싼 갈등으로 영국과 네덜란드는 말라카 해협 양쪽의 세력권을 새로 나눌 필요가 생겼다. 영국은 1811~1816년 자와를 점령했다가 돌려주었고(「영국의 자와 점령과 래플스(1811~1816)」(앞의 사건)), 1819년 래플스가 싱가포르에 상관을 열자(「래플스의 싱가포르 건설(1819~1824)」(앞의 사건)) 네덜란드가 항의하면서 협상이 시작되었다. 두 나라는 1824년 3월 17일 런던에서 조약을 맺었고, 영국은 4월 30일, 네덜란드는 6월 2일 비준하여 6월 8일 비준서를 교환했다. 조약에서 네덜란드는 말라카의 성과 도시를 영국에 넘기고 말레이 반도에 상관을 두거나 군주와 조약을 맺지 않기로 했으며, 싱가포르에 영국이 자리 잡는 것을 반대하지 않기로 했다. 영국은 수마트라의 벵쿨루와 그곳의 영국 거점을 네덜란드에 넘기고 수마트라에 새 상관을 두거나 그곳 군주와 조약을 맺지 않겠다고 약속했으며, 싱가포르 해협 남쪽의 섬들에도 상관을 두지 않기로 했다. 이로써 옛 조호르 술탄국은 반도의 조호르와 네덜란드 쪽의 리아우–링가로 갈라져, 말레이 세계가 영국령 말레이와 네덜란드령 동인도로 나뉘는 선이 그어졌다. 조약은 아체의 독립을 존중한다는 조항도 담았는데, 이는 1871년 수마트라 조약으로 폐기되어 네덜란드가 아체를 칠 길이 열린다(「아체 전쟁(1873~1904)」(뒤의 사건)). 말라카는 1825년 영국령이 되었다. 영국 동인도 회사는 이에 따라 1826년 페낭, 싱가포르, 말라카를 하나의 행정 단위로 묶어 해협 식민지로 삼았고, 처음에는 페낭이 중심이었다. 네덜란드는 곧 리아우–링가에 주재관을 두어 영향력을 굳혔다. 이 조약은 오늘날 인도네시아와 말레이시아의 국경 가운데 해협 부분의 뿌리가 되었다."
  subjects: [uk, netherlands, dutch-east-indies, straits-settlements, johor-sultanate, aceh-sultanate, company-india]
