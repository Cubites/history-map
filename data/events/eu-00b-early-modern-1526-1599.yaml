  sources: ["Roger M. Savory, Iran under the Safavids (1980)", "「아마시아 조약」(1555)", "「콘스탄티노폴리스 조약」(1590)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
