- id: elizabeth-1558
  year: 1558
  endYear: 1563
  title:
    ko: 엘리자베스 1세와 영국 국교회의 확립
  summary:
    ko: "헨리 8세의 아들 에드워드 6세 때 개신교 개혁이 진행되었으나, 뒤를 이은 메리 1세(재위 1553~1558, 에스파냐 펠리페 2세의 아내)는 가톨릭을 되살리며 개신교도 약 280명을 화형에 처했다. 그녀가 에스파냐 편에서 뛰어든 프랑스와의 전쟁에서 잉글랜드는 1558년 1월 대륙의 마지막 거점 칼레를 잃었다. 1558년 11월 즉위한 엘리자베스 1세는 1559년 수장법으로 국왕을 교회의 '최고 통치자'로 삼고 통일법으로 공동 기도서에 따른 예배를 강제했으며, 1563년 '39개 신조'로 교리를 정했다. 영국 국교회는 교리는 개신교(칼뱅파에 가까움)이면서 주교제와 예식은 가톨릭의 모습을 많이 남긴 절충이었다. 1570년 교황이 엘리자베스를 파문한 뒤 잉글랜드 정부는 몰래 활동한 가톨릭 사제와 신자 약 180~200명을 반역죄로 처형했다(추산). 1560년에는 잉글랜드가 스코틀랜드의 개신교 귀족을 도와 프랑스와 에든버러 조약을 맺어 스코틀랜드에서 프랑스군을 철수시켰고, 같은 해 스코틀랜드 의회는 녹스가 이끈 칼뱅파 개혁을 받아들였다(뒤의 장로교회)."
  subjects: [england, france, spain, papal-states, scotland]
  links:
    - { from: france, to: england, note: "칼레 탈환 (1558)" }
    - { from: england, to: scotland, note: "에든버러 조약, 프랑스군 철수 (1560)" }
  tags: [politics, culture]
  sources: ["「수장법」·「통일법」(1559)", "「39개 신조」(1563)", "디아메이드 맥클로흐, 『종교개혁의 역사』(이은재·조상원 옮김, CLC, 2011)"]

- id: livonian-war-1558
  year: 1558
  endYear: 1561
  title:
    ko: 리보니아 전쟁의 시작과 리보니아 연맹의 해체
  summary:
    ko: "러시아의 이반 4세는 발트해로 나가는 길을 얻으려 1558년 1월 리보니아 연맹(리보니아 기사단과 주교령들)으로 쳐들어가 나르바와 타르투(도르파트)를 차지했다. 러시아군은 리보니아의 마을을 불태우고 주민을 죽이거나 끌고 갔다. 힘이 약한 연맹은 이웃 나라에 기대며 흩어졌다. 1559년 외셀과 쿠를란트의 주교는 땅을 덴마크-노르웨이 왕에게 팔았고(왕의 동생 마그누스가 받음), 1561년 레발(탈린)과 북에스토니아는 스웨덴에 복종했으며, 같은 해 11월 빌뉴스 조약으로 기사단장 케틀러와 리가 대주교는 리보니아를 리투아니아 대공국의 보호 아래 두었다. 기사단은 해체되고 케틀러는 다우가바강 남쪽 쿠를란트 공국의 공작이 되었다(리투아니아의 봉토). 이로써 리보니아 전쟁은 러시아·리투아니아(1569년부터 폴란드-리투아니아 연방)·스웨덴·덴마크가 발트해 동쪽 기슭을 두고 다투는 싸움으로 커졌다."
  subjects: [russia-tsardom, livonian-confederation, denmark-norway, sweden-kingdom, lithuania-grand-duchy, courland]
  links:
