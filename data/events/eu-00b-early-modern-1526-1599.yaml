- id: copernicus-1543
  year: 1543
  title:
    ko: 코페르니쿠스의 지동설과 베살리우스의 해부학
  summary:
    ko: "폴란드 왕국의 왕령 프로이센에 속한 프롬보르크 대성당의 참사회원이던 천문학자 코페르니쿠스는 1543년 『천체의 회전에 관하여』를 펴냈다. 그는 지구가 우주의 중심에 멈춰 있고 해와 행성이 그 둘레를 돈다는 프톨레마이오스의 천동설 대신, 해를 중심에 두고 지구가 하루에 한 번 자전하며 해 둘레를 돈다는 지동설을 내놓았다. 책은 그가 죽기 직전 신성 로마 제국의 뉘른베르크에서 인쇄되었는데, 신학자 오지안더가 이를 계산을 위한 가설일 뿐이라고 적은 머리말을 이름 없이 붙였다. 같은 해 스위스의 바젤에서는 베살리우스가 직접 해부한 결과를 바탕으로 『인체의 구조에 관하여』를 펴내 고대 갈레노스의 오류를 바로잡았다. 지동설은 처음에 일부 천문학자만 받아들였으나 케플러·갈릴레이·뉴턴으로 이어지는 과학 혁명의 출발점이 되었다."
  subjects: [poland-kingdom, holy-roman-empire, switzerland]
  tags: [culture]
  sources: ["니콜라우스 코페르니쿠스, 『천체의 회전에 관하여』(민영기·최원재 옮김, 서해문집, 1998)", "스티븐 샤핀, 『과학혁명』(한영덕 옮김, 영림카디널, 2003)"]

- id: portuguese-japan-1543
  year: 1543
  endYear: 1549
  title:
    ko: 포르투갈 상인의 일본 도착과 화승총(조총)의 전래
  summary:
    ko: "포르투갈은 다가마의 항해 뒤 인도의 고아(1510)와 말라카(1511)를 차지하고 동아시아 바다로 나아갔다. 1543년(일설에는 1542년) 포르투갈 상인들이 탄 중국 배가 일본 규슈 남쪽의 다네가시마에 닿았는데, 섬의 영주가 그들의 화승총 두 자루를 사들여 대장장이에게 본떠 만들게 했다. 일본에서 '뎃포'라 불린 화승총은 전국 시대의 싸움 속에 빠르게 퍼져 오다 노부나가 등이 대량으로 썼다. 1549년에는 포르투갈 왕의 후원을 받은 예수회 선교사 프란치스코 하비에르가 가고시마에 와서 가톨릭을 전했고, 포르투갈 상인은 1557년 무렵 명에게서 마카오에 머무는 것을 허락받아 마카오와 일본을 잇는 중개 무역(남만 무역)으로 큰 이익을 얻었다. 일본이 익힌 조총은 1592년 임진왜란 때 조선을 침략한 일본군의 주력 무기가 되었고, 조선은 전쟁 중 훈련도감을 두어 조총을 다루는 포수를 길렀다."
  subjects: [portugal, japan]
  links:
    - { from: portugal, to: japan, note: "화승총 전래 (1543), 하비에르의 선교 (1549)" }
  tags: [economy, culture]
  sources: ["「철포기(鐵炮記)」(1606)", "C. R. Boxer, The Christian Century in Japan 1549–1650 (1951)"]

- id: trent-1545
  year: 1545
  endYear: 1563
  title:
    ko: "가톨릭 개혁: 예수회와 트리엔트 공의회"
  summary:
    ko: "종교 개혁에 맞서 가톨릭교회도 안으로부터 개혁에 나섰다. 1540년 교황 바오로 3세는 에스파냐 귀족 출신 이그나티우스 데 로욜라가 세운 예수회를 승인했다. 교황에게 순명을 맹세한 예수회는 학교를 세워 교육에 힘쓰고 해외 선교에 앞장서, 하비에르는 인도와 일본(1549)으로, 뒤에 마테오 리치는 명(1582년 마카오 도착)으로 갔다. 1542년에는 로마 종교 재판소가 세워졌다. 바오로 3세가 1545년 12월 신성 로마 제국에 속한 북이탈리아의 트리엔트(트렌토)에서 연 공의회는 전쟁과 교황·황제의 다툼으로 두 차례 오래 멈추며 1563년 12월까지 이어졌다. 공의회는 성서와 함께 교회의 전통도 신앙의 근거임을 확인하고, 일곱 성사와 믿음과 선행을 함께 강조한 구원론을 정했으며, 성직 매매와 주교의 겸직을 금하고 교구마다 신학교를 세우게 했다. 교황청은 1559년 금서 목록을 펴냈다. 이 가톨릭 개혁(반종교 개혁)으로 남유럽과 폴란드·남독일 등은 가톨릭을 지키거나 되찾았다. 공의회를 연 1545년, 바오로 3세는 아들 피에르 루이지 파르네세에게 교황령의 파르마·피아첸차를 떼어 공국으로 주었다. 같은 해 파르마·피아첸차 공국이 생기면서 지도의 이탈리아 소국들 묶음(에스테 가문의 페라라·모데나·레조 공국과 루카 공화국 등)도 파르마·모데나·루카 묶음으로 이름을 바꾼다(같은 색)."
  subjects: [papal-states, holy-roman-empire, parma-modena-lucca, italian-minor-states]
  tags: [culture, politics]
  sources: ["「트리엔트 공의회 교령」(1545~1563)", "John W. O'Malley, Trent: What Happened at the Council (2013)"]

# ── 카를 5세의 퇴위와 동유럽의 재편 (1546 ~ 1570) ──────────

- id: augsburg-1555
  year: 1546
  endYear: 1556
  title:
    ko: 슈말칼덴 전쟁과 아우크스부르크 화의, 카를 5세의 퇴위
  summary:
    ko: "루터파 제후와 도시들이 1531년 슈말칼덴 동맹을 맺자, 황제 카를 5세는 오스만·프랑스와의 싸움이 잠잠해진 틈에 1546년 전쟁을 일으켜 1547년 4월 뮐베르크 전투에서 동맹군을 무찌르고 작센 선제후를 사로잡았다. 그러나 1552년 작센의 모리츠 등 신교 제후들이 프랑스의 앙리 2세와 손잡고 반기를 들었고, 앙리 2세는 그 대가로 메스·툴·베르됭 세 주교령을 차지했다(카를 5세의 메스 포위는 실패). 결국 1555년 9월 아우크스부르크 화의로 신성 로마 제국의 제후는 가톨릭과 루터파 가운데 자기 영지의 종교를 고를 수 있게 되었다. 주민은 영주의 종교를 따르거나 떠나야 했고 칼뱅파는 인정되지 않았다. 지친 카를 5세는 1555~1556년 물러나며 네덜란드(합스부르크령 네덜란드)와 에스파냐·이탈리아의 땅·아메리카 식민지는 아들 펠리페 2세에게, 황제 자리는 이미 오스트리아·보헤미아·헝가리(합스부르크 군주국)를 다스리던 동생 페르디난트 1세에게 물려주어(1558년 정식 승계), 합스부르크 가문은 에스파냐계와 오스트리아계로 갈라졌다."
  subjects: [holy-roman-empire, france, spain, habsburg-netherlands, habsburg-monarchy]
  links:
    - { from: france, to: holy-roman-empire, note: "메스·툴·베르됭 차지 (1552)" }
