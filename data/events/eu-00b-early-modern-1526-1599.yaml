- id: sack-of-rome-1527
  year: 1526
  endYear: 1530
  title:
    ko: 로마 약탈과 피렌체 공화국의 끝
  summary:
    ko: "파비아 전투 뒤 황제 카를 5세의 힘이 커지자 교황 클레멘스 7세(메디치 가문)는 1526년 프랑스·베네치아·밀라노·피렌체와 코냐크 동맹을 맺었다. 이듬해 봉급을 받지 못한 황제군(독일 란츠크네히트 용병과 에스파냐 병사)이 1527년 5월 로마에 쳐들어가 몇 달 동안 약탈하며 많은 시민과 성직자를 죽이거나 고문했고, 교황은 산탄젤로성에 갇혔다(로마 약탈). 학살로만 약 6천~1만 2천 명이 죽은 것으로 추산되며, 이어진 역병과 굶주림으로 피해가 더 커졌다. 루터파 용병이 많았던 이 일은 르네상스 로마의 번영이 꺾인 사건으로 여겨진다. 이 틈에 피렌체 시민은 메디치 가문을 다시 몰아내고 공화국을 세웠다. 1529년 프랑스와 황제는 캉브레 화약(귀부인의 평화)으로 싸움을 멈추었고, 교황과 화해한 카를 5세는 1530년 2월 볼로냐에서 교황에게 황제관을 받았다. 같은 해 8월 황제군이 열 달 가까운 포위 끝에 피렌체를 함락해 메디치 가문이 돌아왔고(1532년 알레산드로가 공작), 밀라노는 스포르차 가문에 돌려주었다."
  subjects: [holy-roman-empire, spain, papal-states, france, venice, milan, florence]
