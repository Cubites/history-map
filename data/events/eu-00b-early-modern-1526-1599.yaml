- id: prevesa-1538
  year: 1535
  endYear: 1540
  title:
    ko: 튀니스 원정과 밀라노 공국의 끝, 프레베자 해전
  summary:
    ko: "술레이만 1세가 해적 출신 하이레딘(바르바로사)을 함대 사령관으로 삼아 지중해 서쪽까지 나아가자, 하이레딘 함대는 이탈리아 해안을 습격해 주민을 노예로 끌고 갔다(1534 등). 황제 카를 5세는 1535년 하이레딘이 차지한 튀니스를 쳐서 빼앗았는데, 이때 황제군도 도시를 약탈하며 많은 주민을 죽이거나 노예로 삼았다. 같은 해 밀라노 공 프란체스코 2세 스포르차가 후사 없이 죽자 카를 5세는 밀라노 공국을 차지했고(뒤에 아들 펠리페에게 봉토로 줌), 이를 두고 프랑스의 프랑수아 1세가 다시 전쟁을 일으키며 오스만 제국과 손잡았다(1536). 1538년 교황·베네치아·카를 5세가 신성 동맹을 맺어 연합 함대를 모았으나, 9월 그리스 서해안의 프레베자 해전에서 하이레딘의 오스만 함대에 졌다. 이로써 오스만은 30여 년 동안 지중해 동부의 바다를 주름잡았고, 베네치아는 1540년 강화로 펠로폰네소스의 나우플리아·모넴바시아와 에게해의 섬들을 내주고 30만 두카트를 냈다."
