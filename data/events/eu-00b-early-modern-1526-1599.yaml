- id: mohacs-1526
  year: 1526
  endYear: 1529
  title:
    ko: 모하치 전투와 빈 포위, 합스부르크 군주국의 성립
  summary:
    ko: "술레이만 1세는 1526년 대군을 이끌고 헝가리 왕국으로 쳐들어와 8월 모하치 전투에서 헝가리군을 두 시간 만에 무찔렀다. 보헤미아 왕을 겸하던 젊은 왕 러요시 2세는 달아나다 물에 빠져 죽었고 귀족과 주교 다수가 전사했다. 오스만군은 부다를 약탈하고 물러가면서 많은 주민을 포로로 끌고 갔다. 왕이 후사 없이 죽자 헝가리 귀족 다수는 트란실바니아 총독(보이보드) 서포여이 야노시를 왕으로 뽑았고(11월), 러요시 2세의 누이와 혼인한 합스부르크 가문의 오스트리아 대공 페르디난트는 보헤미아 왕(10월)에 이어 헝가리 왕(12월)으로도 뽑혔다. 이로써 오스트리아 세습령과 보헤미아·헝가리를 한 군주가 다스리는 합스부르크 군주국이 생겼다. 페르디난트에게 밀린 야노시가 오스만의 종주를 받아들이자(동헝가리 왕국), 술레이만은 1529년 다시 원정해 부다를 그에게 맡기고 9~10월 빈을 에워쌌으나 수비대의 저항과 추위, 보급난으로 물러났다. 헝가리는 이후 150년 넘게 합스부르크와 오스만의 싸움터가 되었다."
  subjects: [ottoman, hungary-kingdom, bohemia-kingdom, habsburg-austria, habsburg-monarchy, eastern-hungarian-kingdom]
