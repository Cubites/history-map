- id: siberia-forts-1586
  year: 1586
  endYear: 1598
  title:
    ko: 서시베리아의 요새와 시비르 칸국의 끝
  summary:
    ko: "예르마크의 코사크는 1582년 시비르 칸국의 수도 이스케르(카슐릭)를 차지했으나, 예르마크가 1584~1585년 쿠춤 칸 쪽의 기습으로 죽자 코사크는 이스케르에서 물러났다(「리보니아 전쟁의 끝과 예르마크의 시베리아 원정」, 앞의 사건). 러시아는 이번에는 요새를 세우며 나아갔다. 1586년 투라강에 튜멘을, 1587년 이르티시강과 토볼강이 만나는 곳에 토볼스크를 세웠고(바실리 수킨·이반 먀스노이, 다닐라 출코프), 1588년에는 시비르 칸국의 옛 왕가인 타이부기드 가문의 사이드 아흐마드(예르마크가 죽은 뒤 이스케르를 차지했던 인물)를 붙잡았다. 1592~1595년에는 펠림·베료조프·수르구트·타라·오브도르스크가 세워져 오비강 아래·가운데 지방과 야말에 이르렀고, 1596~1598년 무렵 나림이, 이어 케츠크가 세워졌다(케츠크가 선 해는 1596~1602년으로 자료가 갈린다). 1598년 8월 안드레이 보이에이코프가 오비강 가에서 쿠춤의 군대를 무찔러 쿠춤은 노가이 오르다 쪽으로 달아났고(1600년 뒤 죽음) 시비르 칸국은 끝났다. 칸국의 타타르와 한티·만시·셀쿠프 사람들은 모피 공물(야삭)을 내고 인질(아마나트)을 내놓아야 했으며, 요새 둘레에는 러시아 군인과 농민이 들어왔다. 현지 사람들의 저항과 이주도 이어졌다. 지도는 시베리아 진출을 요새를 세운 해로 나눠 1586년 튜멘·토볼스크 일대, 1594년 오비강 아래·가운데, 1598년 나림·케츠크 일대를 러시아 땅으로 그린다(모두 대략)."
  subjects: [russia-tsardom, nogai-horde]
  tags: [war, politics]
  sources: ["W. Bruce Lincoln, The Conquest of a Continent: Siberia and the Russians (1994)", "Yuri Slezkine, Arctic Mirrors: Russia and the Small Peoples of the North (1994)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)"]

- id: spanish-armada-1588
  year: 1588
  title:
    ko: 에스파냐 무적함대의 패배
  summary:
    ko: "1578년 알카세르키비르 전투에서 포르투갈 왕 세바스티앙이 죽고 뒤를 이은 늙은 추기경 엔히크 왕마저 1580년 죽어 왕가가 끊기자, 에스파냐의 펠리페 2세는 군대를 보내 포르투갈 왕을 겸했다(이베리아 연합, 1580~1640). 이로써 그는 아시아·아메리카에 걸친 두 식민 제국을 거느렸다. 네덜란드 반란을 돕고 드레이크 같은 사략선으로 에스파냐 배를 털던 잉글랜드에 맞서 그는 침공을 준비했고, 1587년 잉글랜드의 엘리자베스 1세가 가톨릭인 전 스코틀랜드 여왕 메리 스튜어트를 처형하자 결심을 굳혔다. 1588년 5월 리스본을 떠난 무적함대(아르마다) 약 130척은 네덜란드에 있던 파르마의 군대를 실어 잉글랜드에 상륙하려 했으나, 7~8월(양력) 영국 해협에서 빠르고 포격이 강한 잉글랜드 함선에 시달리고 칼레 앞바다에서 화공선에 대열이 흩어진 뒤 그라블린 해전에서 졌다. 북해로 밀려난 함대는 스코틀랜드와 아일랜드를 돌아 돌아가다 폭풍에 많은 배를 잃어, 배 3분의 1 넘게와 병사 1만 5천~2만 명을 잃었다(추산). 아일랜드 해안에 닿은 에스파냐 병사 상당수는 잉글랜드 관리와 병사에게 처형되었다. 전쟁은 1604년까지 이어졌고 에스파냐는 해군을 다시 세웠으나, 이 패배는 잉글랜드와 네덜란드가 바다로 나아가는 계기가 되었다."
  subjects: [spain, portugal, england]
  links:
    - { from: spain, to: england, note: "무적함대 침공 시도 (1588)" }
  tags: [war]
  sources: ["개릿 매팅리, 『아르마다』(콜린 박·지소철 옮김, 너머북스, 2012)", "Colin Martin·Geoffrey Parker, The Spanish Armada (1988)"]
  places: [{ name: "그라블린 해전", at: [2.1, 51.05] }]

- id: teusina-1590
  year: 1590
  endYear: 1595
  title:
    ko: 러시아-스웨덴 전쟁과 테우시나 조약
  summary:
    ko: "1583년 플류사 휴전으로 나르바·이반고로드 등 핀란드만 연안을 스웨덴에 내준(「리보니아 전쟁의 끝과 예르마크의 시베리아 원정」, 앞의 사건) 러시아에서는 표도르 1세(재위 1584~1598)의 처남 보리스 고두노프가 이를 되찾으려 했다. 1590년 1월 러시아군(차르 표도르 1세와 고두노프가 직접 출정)이 공세에 나서 이반고로드 쪽에서 스웨덴군을 깨고 나르바를 에워쌌으나 얻지 못했고, 얌은 1월 말 항복했으며, 2월 25일 스웨덴 총독이 1년 휴전에 서명해 얌·코포리에·이반고로드를 러시아에 넘겼다. 스웨덴에서는 요한 3세가 1592년 죽고 폴란드-리투아니아 연방의 왕을 겸한 아들 지그문트 3세 바사가 왕위를 이었으며(재위 1592~1599), 1594년 지그문트가 폴란드로 돌아간 뒤 숙부 카를 공이 섭정으로 스웨덴을 이끌었다. 전쟁은 큰 싸움 없이 이어지다 1595년 5월 18일 테우시나(타브지노)에서 조약을 맺었다. 이 조약은 얌·이반고로드·코포리에 등 잉그리아의 땅을 러시아 것으로 확인하고 케크스홀름(코렐라)과 그 일대를 더해 돌려주었으며, 러시아는 에스토니아(나르바 포함)에 대한 요구를 버리고 스웨덴이 1561년부터 지배한 에스토니아가 인정되었다. 국경선은 시스테르배크강 어귀에서 사이마호와 이나리호를 거쳐 북극해 쪽까지 이어졌고, 사미(라프) 사람들이 살던 북쪽 땅을 가로질러 그어졌다(사미는 스웨덴·러시아·덴마크-노르웨이 왕에게 모두 공물을 내기도 했다). 지도는 이 조약으로 카이누·북사보·북오스트로보트니아 동쪽 내륙을 스웨덴 땅으로 그린다(그전은 주인이 분명치 않아 비움)."
  subjects: [russia-tsardom, sweden-kingdom, polish-lithuanian-commonwealth, denmark-norway]
  links:
    - { from: russia-tsardom, to: sweden-kingdom, note: "잉그리아·케크스홀름 되찾음, 테우시나 조약 (1595)" }
  tags: [war, diplomacy]
  sources: ["「테우시나 조약」(1595)", "Robert I. Frost, The Northern Wars 1558–1721 (2000)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)"]

- id: long-war-1593
  year: 1593
  endYear: 1596
  title:
    ko: 긴 전쟁의 시작과 에게르 함락, 메조케레스테시 전투
  summary:
    ko: "1590년대 헝가리 변경에서 오스만 변방 군대의 습격과 합스부르크 쪽의 반격이 거듭되다가, 1592년 오스만이 크로아티아 쪽 비하치를 차지하고 1593년 6월 시사크 전투에서 합스부르크·크로아티아군이 오스만 군을 무찔러 지휘관 하산 파샤가 죽자 술탄 무라드 3세는 대재상 코자 시난 파샤를 보내 전쟁을 선포했다. 이 긴 전쟁(1593~1606)의 앞부분에서 오스만은 1594년 죄르를 얻었으나 합스부르크 군주국은 1593년 11월 퓔레크(필랴코보)와 1594년 3월 노그라드를, 1595년 에스테르곰을 되찾았다. 교황 클레멘스 8세의 주선으로 트란실바니아 공 지그몬드 버토리와 왈라키아 공 미하이(용감공), 몰다비아 공이 1594~1595년 합스부르크 쪽 동맹에 들어 오스만에 맞섰다. 1596년에는 새 술탄 메흐메트 3세(재위 1595~1603)가 직접 원정에 나서 10월 에게르를 함락하고, 하순 메조케레스테시에서 합스부르크·트란실바니아 연합군을 무찔렀다. 이긴 쪽은 오스만이었으나 전쟁의 판세를 끝내 가르지는 못해 싸움은 이어졌다. 지도는 이 앞부분의 결과를 1596년의 근사로 그려, 비하치 쪽 우나·사나 지방과 에게르 일대를 오스만 땅으로, 노그라드 쪽을 합스부르크 땅으로 둔다(1606년까지 이어진 전쟁 가운데 점령과 되찾음은 그리지 않는다)."
  subjects: [ottoman, habsburg-monarchy, transylvania, wallachia, moldavia]
  links:
