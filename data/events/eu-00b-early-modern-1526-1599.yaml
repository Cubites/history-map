- id: ivan4-tsar-1547
  year: 1547
  endYear: 1556
  title:
    ko: 이반 4세의 차르 대관과 카잔·아스트라한 정복
  summary:
    ko: "세 살에 모스크바 대공이 된 이반 4세는 대귀족(보야르) 가문들의 다툼 속에 자라, 1547년 1월 열여섯 살에 '차르'로 대관했다. 이로써 모스크바 대공국은 러시아 차르국이 되었다. 그는 전국 회의(젬스키 소보르, 1549)를 열고 법전(1550)을 새로 펴냈으며, 화승총으로 무장한 상비 보병(스트렐치)을 두었다. 이어 볼가강의 카잔 칸국을 쳐 1552년 10월 화약으로 성벽을 무너뜨리고 카잔을 함락했다. 러시아군은 성안의 무장한 남자를 거의 모두 죽이고 여자와 아이를 포로로 삼았으며, 카잔에 노예로 잡혀 있던 많은 러시아인을 풀어 주었다(카잔 칸국은 그전부터 러시아 변경을 습격해 주민을 끌고 가 노예로 팔았음). 이를 기념해 모스크바 붉은 광장에 성 바실리 대성당을 세웠다. 1556년에는 볼가강 하구의 아스트라한 칸국도 합쳐, 러시아는 볼가강 전체를 차지하고 카스피해로 가는 길을 열었으며 여러 민족을 거느린 나라가 되었다. 카잔 쪽 주민의 저항은 정복 뒤에도 여러 해 이어졌다. 지도는 1556년부터 아스트라한과 볼가강 아래쪽(볼고그라드의 볼가강 쪽까지)을 러시아 땅으로 그리고, 그 서쪽 돈강 쪽의 돈 코사크 땅은 이들이 처음 차르에게 충성을 서약한 1671년(「스텐카 라진의 반란과 돈 코사크의 서약」, 뒤의 사건)까지 비워 둔다."
