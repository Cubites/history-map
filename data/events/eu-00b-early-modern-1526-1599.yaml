- id: edict-of-nantes-1598
  year: 1589
  endYear: 1598
  title:
    ko: 앙리 4세와 낭트 칙령
  summary:
    ko: "성 바르톨로메오 축일의 학살 뒤에도 위그노 전쟁은 이어졌다. 가톨릭 동맹(리그)을 이끈 기즈 공작이 앙리 3세의 명으로 살해되고(1588), 이듬해 앙리 3세도 가톨릭 수도사에게 암살되자 발루아 왕가가 끊겼다. 왕위를 이은 부르봉 가문의 앙리 4세(나바라 왕 앙리)가 위그노였으므로 가톨릭 동맹과 그를 돕는 에스파냐가 맞섰다. 그는 1590년 이브리 전투에서 이겼으나 파리를 차지하지 못하다가, 1593년 가톨릭으로 개종하고 이듬해 파리에 들어갔다. 1598년 4월 그는 낭트 칙령을 내려 가톨릭을 국교로 두되 위그노에게 신앙의 자유와 공직에 오를 권리, 일정 기간 요새 도시를 지킬 권리를 주었고, 5월 베르뱅 조약으로 에스파냐와 강화했다. 30여 년의 종교 전쟁과 그에 따른 기근·전염병으로 약 200만~400만 명이 죽은 것으로 추산된다. 앙리 4세는 재무 총감 쉴리와 함께 재정을 되살려 부르봉 왕조의 절대 왕정을 준비했다."
  subjects: [france, spain]
  links:
