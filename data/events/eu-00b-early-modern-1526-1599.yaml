    - { from: sweden-kingdom, to: livonian-confederation, note: "레발·북에스토니아 (1561)" }
    - { from: lithuania-grand-duchy, to: livonian-confederation, note: "빌뉴스 조약, 보호 (1561)" }
  tags: [war, diplomacy]
  sources: ["「빌뉴스 조약」(1561)", "Robert I. Frost, The Northern Wars 1558–1721 (2000)"]
