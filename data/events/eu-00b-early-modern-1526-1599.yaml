- id: livonian-war-end-1577
  year: 1577
  endYear: 1583
  title:
    ko: 리보니아 전쟁의 끝과 예르마크의 시베리아 원정
  summary:
    ko: "리보니아 전쟁 중 러시아의 이반 4세는 1565년 나라를 둘로 나눠 직할지(오프리치니나)를 두고 친위대를 시켜 대귀족과 반대파를 숙청했으며, 1570년에는 반역 혐의로 노브고로드를 습격해 많은 주민을 죽였다. 그는 1577년 리보니아 대부분을 다시 차지했으나, 폴란드-리투아니아 연방의 새 왕 스테판 바토리가 반격해 1579년 폴로츠크를 되찾고 1581~1582년 프스코프를 에워쌌다. 같은 무렵 스웨덴군은 1581년 나르바를 함락하며 러시아인 수비대와 주민 수천 명을 죽였다. 1582년 1월 얌자폴스키 휴전으로 러시아는 리보니아를 폴란드-리투아니아에 넘기고 폴로츠크를 포기했으며, 1583년 플류사 휴전으로 나르바·이반고로드 등 핀란드만 연안을 스웨덴에 내주었다. 25년 동안의 전쟁과 오프리치니나로 러시아 북서부는 크게 황폐해졌다. 한편 상인 스트로가노프 가문의 지원을 받은 코사크 예르마크가 우랄산맥을 넘어 1582년 시비르 칸국의 수도를 차지해 러시아의 시베리아 진출이 시작되었다."
  subjects: [russia-tsardom, polish-lithuanian-commonwealth, sweden-kingdom]
