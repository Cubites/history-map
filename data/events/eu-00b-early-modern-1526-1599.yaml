- id: spanish-armada-1588
  year: 1588
  title:
    ko: 에스파냐 무적함대의 패배
  summary:
    ko: "1578년 알카세르키비르 전투에서 포르투갈 왕 세바스티앙이 죽고 뒤를 이은 늙은 추기경 엔히크 왕마저 1580년 죽어 왕가가 끊기자, 에스파냐의 펠리페 2세는 군대를 보내 포르투갈 왕을 겸했다(이베리아 연합, 1580~1640). 이로써 그는 아시아·아메리카에 걸친 두 식민 제국을 거느렸다. 네덜란드 반란을 돕고 드레이크 같은 사략선으로 에스파냐 배를 털던 잉글랜드에 맞서 그는 침공을 준비했고, 1587년 잉글랜드의 엘리자베스 1세가 가톨릭인 전 스코틀랜드 여왕 메리 스튜어트를 처형하자 결심을 굳혔다. 1588년 5월 리스본을 떠난 무적함대(아르마다) 약 130척은 네덜란드에 있던 파르마의 군대를 실어 잉글랜드에 상륙하려 했으나, 7~8월(양력) 영국 해협에서 빠르고 포격이 강한 잉글랜드 함선에 시달리고 칼레 앞바다에서 화공선에 대열이 흩어진 뒤 그라블린 해전에서 졌다. 북해로 밀려난 함대는 스코틀랜드와 아일랜드를 돌아 돌아가다 폭풍에 많은 배를 잃어, 배 3분의 1 넘게와 병사 1만 5천~2만 명을 잃었다(추산). 아일랜드 해안에 닿은 에스파냐 병사 상당수는 잉글랜드 관리와 병사에게 처형되었다. 전쟁은 1604년까지 이어졌고 에스파냐는 해군을 다시 세웠으나, 이 패배는 잉글랜드와 네덜란드가 바다로 나아가는 계기가 되었다."
  subjects: [spain, portugal, england]
