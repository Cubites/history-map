    - { from: russia-tsardom, to: astrakhan-khanate, note: "병합 (1556)" }
  tags: [war, politics]
  sources: ["니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "Janet Martin, Medieval Russia 980–1584 (2판, 2007)"]
  places: [{ name: "카잔", at: [49.12, 55.79], year: 1552 }, { name: "아스트라한", at: [48.03, 46.35], year: 1556 }]

- id: siena-1554
  year: 1554
  endYear: 1559
  title:
    ko: 시에나 공화국의 끝과 카토캉브레지 조약
  summary:
    ko: "이탈리아 전쟁의 마지막 단계에서 시에나 공화국은 에스파냐 수비대를 몰아내고 프랑스와 손잡았다(1552). 이에 피렌체 공국의 코시모 1세 데 메디치와 황제 카를 5세의 군대가 1554년 시에나를 에워싸 8월 마르차노 전투에서 프랑스·시에나군을 무찌르고, 굶주린 도시의 항복을 받았다(1555년 4월). 포위 동안 수비 쪽이 식량을 아끼려 성 밖으로 내보낸 노인·아이 등 주민 다수는 포위군에 막혀 굶어 죽거나 죽임을 당했다. 망명한 공화파는 몬탈치노에서 1559년까지 버텼다. 1557년 에스파냐의 펠리페 2세는 해안의 요새(프레시디 국가)를 남기고 시에나를 코시모에게 봉토로 넘겼고, 1569년 교황 비오 5세가 코시모를 토스카나 대공으로 올려 피렌체 공국은 토스카나 대공국이 되었다. 1559년 4월 프랑스와 에스파냐는 카토캉브레지 조약을 맺어 65년 동안의 이탈리아 전쟁을 끝냈고, 에스파냐는 밀라노·나폴리·시칠리아·사르데냐를 차지해 이탈리아에서 우위를 굳혔다."
  subjects: [siena, florence, spain, france, holy-roman-empire]
  links:
