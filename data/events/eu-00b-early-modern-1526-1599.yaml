- id: huguenot-wars-1562
  year: 1562
  endYear: 1572
  title:
    ko: 위그노 전쟁과 성 바르톨로메오 축일의 학살
  summary:
    ko: "프랑스에서는 칼뱅파 신교도(위그노)가 귀족과 도시민 사이에 퍼져 1560년 무렵 인구의 약 10%에 이르렀다. 1562년 3월 기즈 공작의 병사들이 바시에서 예배하던 위그노를 습격해 수십 명을 죽이자 위그노 전쟁(1562~1598)이 시작되었다. 왕권이 약한 가운데 가톨릭 쪽(기즈 가문)과 위그노 쪽(부르봉 가문·콜리니 제독) 귀족이 싸웠고, 양쪽 모두 상대 신자를 학살하고 교회와 성상을 부쉈다. 1567년 님에서는 위그노가 가톨릭 사제와 주민 수십 명을 죽였다(미슐라드). 섭정을 했던 왕의 어머니 카트린 드 메디시스는 화해를 꾀해 딸 마르그리트를 위그노인 나바라 왕 앙리와 혼인시켰는데, 1572년 8월 결혼식에 모인 콜리니 등 위그노 지도자들을 왕실이 죽이기로 하면서 파리의 가톨릭 민병과 군중이 위그노를 학살했다(성 바르톨로메오 축일의 학살). 학살은 지방으로 번져 10월까지 이어졌고, 프랑스 전체에서 위그노 약 5천~3만 명이 죽은 것으로 추산된다(파리에서만 2천~3천 명 안팎). 교황 그레고리오 13세는 감사 미사를 드렸고, 위그노는 폭군에 저항할 권리를 주장하는 이론을 내놓았다."
  subjects: [france, papal-states]
  tags: [war, society]
  sources: ["「앙부아즈 칙령」(1563)", "Mack P. Holt, The French Wars of Religion, 1562–1629 (2판, 2005)"]
  places: [{ name: "드뢰", at: [1.39, 48.68], year: 1562 }]

- id: dutch-revolt-1566
  year: 1566
  endYear: 1572
  title:
    ko: 네덜란드 독립 전쟁의 시작
  summary:
    ko: "에스파냐 왕 펠리페 2세가 다스린 네덜란드 17주에서는 무거운 세금, 현지 귀족을 무시하는 통치, 칼뱅파에 대한 종교 재판에 대한 불만이 커졌다. 1566년 여름 칼뱅파 군중이 교회의 성상과 제단을 부수는 성상 파괴 운동이 번지자, 펠리페 2세는 알바 공작을 군대와 함께 보냈다. 알바는 '소요 재판소'(시민들은 '피의 재판소'라 부름)를 열어 1천여 명을 처형하고 수많은 사람의 재산을 빼앗았으며, 1568년 귀족 지도자 에흐몬트와 호른을 처형했다. 독일로 피한 오라녜 공 빌럼(침묵공)이 1568년 군대를 일으키면서 80년 전쟁(1568~1648)이 시작되었다. 1572년 4월 '바다의 거지'라 불린 칼뱅파 해적이 브릴을 차지한 뒤 홀란트·제일란트의 도시들이 반란에 가담했다. 반란군은 브릴에서 고르쿰의 가톨릭 사제와 수도자 19명을 처형하는 등 가톨릭 성직자를 죽였고, 에스파냐군은 메헬렌·주트펀·나르던 등을 함락하며 주민을 학살했다."
  subjects: [spain]
  tags: [war, politics]
  sources: ["Geoffrey Parker, The Dutch Revolt (개정판, 1985)"]
  places: [{ name: "헤일리헤를레이", at: [7.0, 53.16], year: 1568 }, { name: "브릴", at: [4.16, 51.9], year: 1572 }]

- id: szigetvar-speyer-1566
  year: 1566
  endYear: 1570
  title:
    ko: 시게트바르 함락과 트란실바니아 공국의 성립
  summary:
    ko: "술레이만 1세는 1566년 마지막 원정에 나서 헝가리 남서부의 시게트바르를 에워쌌다. 크로아티아 총독을 지낸 귀족 즈리니 미클로시(크로아티아어로 니콜라 즈린스키)가 이끈 수비대는 한 달 넘게 버티다 9월 성이 불타자 마지막 돌격에 나서 거의 모두 전사했고, 술레이만은 함락 직전 진중에서 죽었다. 1568년 아드리아노플 조약으로 합스부르크 군주국의 막시밀리안 2세는 해마다 3만 두카트를 바치며 오스만 제국이 차지한 땅을 인정했다. 오스만의 종주 아래 있던 동헝가리 왕국의 야노시 지그몬드는 합스부르크와 다투다 1570년 슈파이어 조약(이듬해 비준)에서 '헝가리 왕' 칭호를 내놓고 '트란실바니아 공'이 되어, 그의 나라는 트란실바니아 공국이 되었다. 트란실바니아의 1568년 토르더 의회는 설교자가 자기 믿음을 자유롭게 전할 수 있게 해, 유럽에서 이른 종교 관용의 예로 꼽힌다."
  subjects: [ottoman, habsburg-monarchy, eastern-hungarian-kingdom, transylvania]
  links:
    - { from: ottoman, to: habsburg-monarchy, note: "시게트바르 함락 (1566), 아드리아노플 조약 (1568)" }
    - { from: habsburg-monarchy, to: eastern-hungarian-kingdom, note: "슈파이어 조약, 왕 칭호 포기 (1570)" }
  tags: [war, diplomacy]
  sources: ["「아드리아노플 조약」(1568)", "「슈파이어 조약」(1570)", "Miklós Molnár, A Concise History of Hungary (2001)"]
