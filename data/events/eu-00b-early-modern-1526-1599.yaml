# 유럽 근세 사건 2차 묶음 (2): 모하치 전투에서 낭트 칙령까지 (1526 ~ 1599, 작업 EVD2)
# 범위: 모하치 전투와 헝가리의 3분, 빈 포위, 로마 약탈, 종교 개혁의 확산(칼뱅·영국 국교회·아우크스부르크 화의)과 가톨릭 개혁
#   (예수회·트리엔트 공의회), 프레베자·레판토 해전, 이반 4세(차르 대관·카잔·아스트라한·리보니아 전쟁), 루블린 연합,
#   위그노 전쟁, 네덜란드 독립 전쟁, 에스파냐 무적함대, 코페르니쿠스, 포르투갈 상인과 화승총의 일본 전래.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 지도에 있는 나라가 생기고 끝난 일(합스부르크 군주국·동헝가리 왕국 1526·브르타뉴 1532·
#   밀라노 1535·아일랜드 왕국 1542·파르마 1545·러시아 차르국 1547·카잔 1552·아스트라한 1556·합스부르크령 네덜란드 1556·시에나 1557·
#   리보니아 연맹과 쿠를란트 1561·폴란드-리투아니아 1569·트란실바니아 1570·네덜란드 공화국 1581 등)을 더함 (docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 포르투갈 상인이 일본에 전한 화승총(조총)은 임진왜란(06번 imjin-war-1592) 때 일본군의 주력 무기가 되었다(서술로 이음).
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜와 그 뒤 율리우스력을 계속 쓴 나라(잉글랜드·스웨덴·러시아·독일 신교 지역)의 날짜는
#   달까지만 적거나 양력(그레고리력)으로 적는다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다.
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본). 운영자 검수 필요.

# ── 합스부르크와 오스만, 종교 개혁의 확산 (1526 ~ 1547) ──────

- id: mohacs-1526
  year: 1526
  endYear: 1529
  title:
    ko: 모하치 전투와 빈 포위, 합스부르크 군주국의 성립
  summary:
    ko: "술레이만 1세는 1526년 대군을 이끌고 헝가리 왕국으로 쳐들어와 8월 모하치 전투에서 헝가리군을 두 시간 만에 무찔렀다. 보헤미아 왕을 겸하던 젊은 왕 러요시 2세는 달아나다 물에 빠져 죽었고 귀족과 주교 다수가 전사했다. 오스만군은 부다를 약탈하고 물러가면서 많은 주민을 포로로 끌고 갔다. 왕이 후사 없이 죽자 헝가리 귀족 다수는 트란실바니아 총독(보이보드) 서포여이 야노시를 왕으로 뽑았고(11월), 러요시 2세의 누이와 혼인한 합스부르크 가문의 오스트리아 대공 페르디난트는 보헤미아 왕(10월)에 이어 헝가리 왕(12월)으로도 뽑혔다. 이로써 오스트리아 세습령과 보헤미아·헝가리를 한 군주가 다스리는 합스부르크 군주국이 생겼다. 페르디난트에게 밀린 야노시가 오스만의 종주를 받아들이자(동헝가리 왕국), 술레이만은 1529년 다시 원정해 부다를 그에게 맡기고 9~10월 빈을 에워쌌으나 수비대의 저항과 추위, 보급난으로 물러났다. 헝가리는 이후 150년 넘게 합스부르크와 오스만의 싸움터가 되었다."
  subjects: [ottoman, hungary-kingdom, bohemia-kingdom, habsburg-austria, habsburg-monarchy, eastern-hungarian-kingdom]
