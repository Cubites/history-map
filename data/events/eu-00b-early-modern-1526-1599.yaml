- id: lublin-union-1569
  year: 1569
  endYear: 1573
  title:
    ko: 루블린 연합과 폴란드-리투아니아 연방
  summary:
    ko: "폴란드 왕국과 리투아니아 대공국은 1386년부터 대체로 한 군주(야기에우워 가문)를 받들었으나 따로 나라를 이루고 있었다. 리보니아 전쟁에서 러시아에 밀리던 리투아니아는 폴란드의 도움이 필요했고, 후사가 없는 지그문트 2세 아우구스트도 두 나라를 묶으려 했다. 1569년 7월 루블린 의회에서 맺은 연합으로 두 나라는 한 왕(선출)과 한 의회(세임)를 둔 폴란드-리투아니아 연방이 되었고, 리투아니아는 이름과 정부·군대·법·재정을 따로 지켰다. 연합에 앞서 리투아니아 대공국의 포들라시에·볼히니아·키이우 지역은 폴란드 왕관령에 넘어갔다. 1572년 지그문트 2세가 죽어 야기에우워 왕조가 끝나자 귀족(슐라흐타)이 모두 모여 왕을 뽑는 선거 왕정이 시작되었다. 1573년 바르샤바 연맹 협약은 종교가 다른 귀족 사이의 평화를 약속해 종교 관용을 보장했고, 첫 선출 왕 앙리(뒤의 프랑스 왕 앙리 3세)는 왕권을 제한하는 '헨리크 조항'을 받아들여야 했다."
  subjects: [poland-kingdom, lithuania-grand-duchy, polish-lithuanian-commonwealth]
  links:
    - { from: poland-kingdom, to: lithuania-grand-duchy, note: "포들라시에·볼히니아·키이우 편입 (1569)" }
  tags: [politics]
  sources: ["「루블린 연합 문서」(1569)", "「바르샤바 연맹 협약」(1573)", "Norman Davies, God's Playground: A History of Poland, Vol. 1 (개정판, 2005)"]

# ── 레판토에서 낭트 칙령까지 (1570 ~ 1598) ──────────

- id: lepanto-1571
  year: 1570
  endYear: 1571
  title:
    ko: 오스만의 키프로스 정복과 레판토 해전
  summary:
    ko: "술탄 셀림 2세는 1570년 베네치아 공화국의 키프로스섬을 쳐서 9월 니코시아를 함락하고 주민 다수를 죽이거나 노예로 삼았다. 1571년 8월 열 달 넘게 버틴 파마구스타도 항복했는데, 오스만군 사령관 랄라 무스타파 파샤는 약속을 어기고 베네치아 사령관 브라가딘을 산 채로 가죽을 벗겨 죽였다. 교황 비오 5세가 주선해 에스파냐·베네치아·교황청 등이 신성 동맹을 맺었고, 1571년 10월 펠리페 2세의 이복동생 돈 후안이 이끈 연합 함대가 그리스 서쪽 레판토(나프팍토스) 앞바다에서 오스만 함대를 크게 무찔렀다. 오스만 쪽은 함선 대부분과 2만~3만 명을 잃었고(추산, 연합 함대 쪽도 약 7,500~1만 명 전사), 오스만 갤리선에서 노를 젓던 그리스도교도 노예 1만 명 넘게가 풀려난 반면 오스만 쪽 포로 수천 명은 노예가 되었다. 이 승리로 오스만 해군이 무적이라는 믿음은 깨졌으나, 오스만은 이듬해 함대를 다시 지었고 1573년 베네치아는 키프로스를 넘기는 강화를 맺었다."
  subjects: [ottoman, venice, spain, papal-states]
