- id: dutch-republic-1579
  year: 1579
  endYear: 1585
  title:
    ko: 위트레흐트 동맹과 네덜란드 공화국의 성립
  summary:
    ko: "1576년 11월 봉급을 받지 못한 에스파냐군이 안트베르펜을 약탈해 7천 명 넘게(많게는 1만 7천 명으로 추산) 죽이자(에스파냐의 광포), 17주는 헨트 화약으로 함께 에스파냐군을 몰아내기로 했다. 그러나 새 총독 파르마 공 알레산드로 파르네세가 가톨릭 귀족을 달래자, 1579년 1월 남부의 가톨릭 주들은 아라스 연합으로 에스파냐 왕에게 돌아갔고, 북부의 홀란트·제일란트·위트레흐트 등은 위트레흐트 동맹을 맺어 함께 싸우기로 했다. 1581년 7월 북부 주들은 철회령으로 펠리페 2세를 군주로 인정하지 않는다고 선언해, 사실상 네덜란드 공화국(연합 주)이 섰다. 1584년 7월 오라녜 공 빌럼이 펠리페 2세가 현상금을 건 가톨릭교도에게 암살되었고, 1585년 8월 파르마가 1년 넘는 포위 끝에 안트베르펜을 되찾았다. 안트베르펜의 개신교도 상인과 장인 상당수가 북쪽으로 떠나면서 암스테르담이 새 무역 중심지로 커졌다. 같은 해 잉글랜드의 엘리자베스 1세는 논서치 조약으로 네덜란드 공화국에 군대를 보내기로 해, 에스파냐와 잉글랜드의 전쟁이 시작되었다."
  subjects: [spain, dutch-republic, england]
  links:
