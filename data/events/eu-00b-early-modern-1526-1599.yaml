- id: francis-i-1532
  year: 1532
  endYear: 1539
  title:
    ko: 프랑수아 1세의 왕권 강화와 브르타뉴 합병
  summary:
    ko: "프랑수아 1세(재위 1515~1547)는 이탈리아 전쟁을 치르면서도 왕권을 다졌다. 1532년 8월 왕비 클로드를 거쳐 왕실에 들어온 브르타뉴 공국을 합병 칙령으로 프랑스 왕국에 합쳤고(브르타뉴의 신분회와 특권은 인정), 1539년 빌레르코트레 칙령으로 재판과 공문서에 라틴어 대신 프랑스어를 쓰게 하고 교구마다 세례 기록을 남기게 했다. 1516년 볼로냐 정교 협약으로 얻은 주교 임명권은 왕이 교회를 장악하는 바탕이 되었다. 그는 레오나르도 다빈치를 앙부아즈로 불러들이고(1516) 왕립 강사단(뒤의 콜레주 드 프랑스, 1530)을 세우는 등 르네상스 문화를 후원했다. 처음에 인문주의자에 너그럽던 그는 1534년 10월 가톨릭 미사를 공격하는 벽보가 왕의 거처에까지 붙자(벽보 사건) 개신교도를 탄압해 수십 명을 화형에 처했고, 장 칼뱅도 이 무렵 프랑스를 떠났다."
  subjects: [france, brittany]
  links:
    - { from: france, to: brittany, note: "합병 칙령 (1532)" }
  tags: [politics, culture]
  sources: ["「빌레르코트레 칙령」(1539)", "R. J. Knecht, Renaissance Warrior and Patron: The Reign of Francis I (1994)"]

- id: henry-viii-1534
  year: 1534
  endYear: 1542
  title:
    ko: 헨리 8세의 수장법과 영국 국교회, 아일랜드 왕국
  summary:
    ko: "잉글랜드의 헨리 8세는 아들을 얻지 못하자 에스파냐 출신 왕비 캐서린(카를 5세의 이모)과의 혼인을 무효로 해 달라고 교황에게 청했으나, 카를 5세의 영향 아래 있던 교황 클레멘스 7세는 받아들이지 않았다. 헨리는 1533년 1월 앤 불린과 몰래 혼인했고, 5월 캔터베리 대주교 크랜머가 캐서린과의 혼인이 무효라고 선언하게 했다. 이어 1534년 수장법으로 국왕을 잉글랜드 교회의 '지상의 유일한 최고 수장'으로 삼아 로마 교황청과 갈라섰다(영국 국교회의 시작). 이를 인정하지 않은 토머스 모어와 주교 피셔는 처형되었다. 1536~1540년에는 수도원을 해산하고 그 땅을 팔아 왕실 재정을 채우고 지지 세력을 넓혔다. 이에 맞서 잉글랜드 북부에서 일어난 '은총의 순례'(1536~1537)는 진압되어 지도자와 참가자 200명 넘게 처형되었다. 교리와 예배는 한동안 가톨릭에 가까웠고, 개신교 교리는 아들 에드워드 6세 때 크게 들어왔다. 헨리는 1541년 아일랜드 의회에서 아일랜드 왕국법을 통과시켜 아일랜드 영주 대신 아일랜드 왕을 칭하고, 페일 밖을 다스리던 게일계 영주들에게 땅을 왕에게 바쳤다가 다시 받게 하는 '항복과 재수여' 정책으로 지배를 넓혔다(오닐이 1542년 티론 백작, 오브라이언이 1543년 토먼드 백작이 됨)."
  subjects: [england, papal-states, lordship-of-ireland, ireland-kingdom, gaelic-irish-lordships]
