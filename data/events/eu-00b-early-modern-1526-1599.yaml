- id: lappmark-1553
  year: 1553
  title:
    ko: 구스타브 바사의 라프마르크 직접 과세
  summary:
    ko: "스웨덴 북부의 라프마르크(라플란드)는 사미 사람들이 순록 사냥과 유목, 고기잡이로 살아가던 땅이었다. 사미는 씨다라는 공동체 단위로 자기 땅을 다스렸고, 늦어도 14세기 초(1328년 첫 기록)부터(13세기부터라는 설도 있다) 비르카를이라 불린 상인들이 스웨덴 왕의 묵인 아래 사미에게서 모피 공물을 거두고 교역을 독점했다. 스웨덴 왕 구스타브 1세 바사(재위 1523~1560)는 1550년대 초 비르카를의 특권을 거두어 왕실이 직접 세금을 걷게 하고 지역에 라프 징세관을 두었다(특권을 거둔 해는 1550·1552·1553년으로 자료가 갈린다). 라프마르크의 첫 세금 대장은 1553년부터 남아 있다. 이로써 스웨덴 왕권의 과세가 라프마르크 안쪽까지 미쳤으나, 사미는 덴마크-노르웨이 왕과 러시아에도 공물을 바치는 일이 있어 이 지역의 국경은 오랫동안 분명하지 않았다(1751년 스트룀스타드 조약과 그 부속 문서인 라프 부록에서야 스웨덴과 노르웨이의 국경이 정해지고 사미의 이동권이 인정되었다). 지도는 라프마르크(라플란드와 노를란드 북부 내륙)를 1553년부터 스웨덴 왕국 땅으로 그리고 그전은 비워 둔다."
  subjects: [sweden-kingdom, denmark-norway]
  tags: [politics]
  sources: ["Lars Ivar Hansen·Bjørnar Olsen, Hunters in Transition: An Outline of Early Sámi History (2014)", "Michael Roberts, The Early Vasas: A History of Sweden, 1523–1611 (1968)"]

- id: siena-1554
  year: 1554
  endYear: 1569
  title:
    ko: 시에나 공화국의 끝, 카토캉브레지 조약과 토스카나 대공국
  summary:
    ko: "이탈리아 전쟁의 마지막 단계에서 시에나 공화국은 에스파냐 수비대를 몰아내고 프랑스와 손잡았다(1552). 이에 피렌체 공국의 코시모 1세 데 메디치와 황제 카를 5세의 군대가 1554년 시에나를 에워싸 8월 마르차노 전투에서 프랑스·시에나군을 무찌르고, 굶주린 도시의 항복을 받았다(1555년 4월). 포위 동안 수비 쪽이 식량을 아끼려 성 밖으로 내보낸 노인·아이 등 주민 다수는 포위군에 막혀 굶어 죽거나 죽임을 당했다. 망명한 공화파는 몬탈치노에서 1559년까지 버텼다. 1557년 에스파냐의 펠리페 2세는 해안의 요새(프레시디 국가)를 남기고 시에나를 코시모에게 봉토로 넘겼고, 1569년 교황 비오 5세가 코시모를 토스카나 대공으로 올려 피렌체 공국은 토스카나 대공국이 되었다(황제 막시밀리안 2세와 펠리페 2세는 처음에 이를 인정하지 않다가 각각 1575년과 1576년에 인정했다. 지도는 1569년부터 피렌체를 토스카나 대공국 항목으로 그린다, 같은 색). 1559년 4월 프랑스와 에스파냐는 카토캉브레지 조약을 맺어 65년 동안의 이탈리아 전쟁을 끝냈고, 에스파냐는 밀라노·나폴리·시칠리아·사르데냐를 차지해 이탈리아에서 우위를 굳혔다."
  subjects: [siena, florence, spain, france, holy-roman-empire, tuscany]
  links:
