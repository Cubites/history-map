- id: southern-steppe-1570
  year: 1570
  endYear: 1596
  title:
    ko: 크림 칸국의 습격과 러시아의 남쪽 요새선
  summary:
    ko: "모스크바 남쪽의 들판은 크림 칸국과 노가이 오르다의 기마 무리가 해마다 습격해 포로를 끌고 가던 변경이었다(러시아와 코사크도 크림 쪽 땅을 습격했다). 크림 칸 데블레트 1세 기레이는 1571년 5월 모스크바를 불태웠다(크렘린은 남음). 이듬해 7~8월 몰로디 전투에서 미하일 보로틴스키 공이 이끈 러시아군이 크림군을 크게 무찔렀고, 러시아는 이 뒤 남쪽 변경에 요새와 방벽을 쌓는 일에 힘을 쏟았다. 돈강 하류의 코사크는 1550년대부터 모스크바의 원정에 가담하다가(1552 카잔, 1556 아스트라한) 1570년 무렵 이반 4세와 공식 관계를 맺었다는 전승이 있으나, 1570년 1월의 칙서와 5월의 서약이라는 날짜는 19세기 돈 지방 기록(1870년 돈군 300주년 기념 무렵)에서 처음 나오고 당대 문서가 없다는 연구가 있다. 보리스 고두노프가 섭정으로 실권을 쥔 표도르 1세(재위 1584~1598) 때 러시아는 보로네시(1585~1586), 리브니·쿠르스크(1586), 오스콜·발루이키(1593), 벨고로드(1593~1596)에 요새를 세워 남쪽 요새선을 넓혔다. 이 요새선은 러시아가 남쪽으로 농경지와 변경 통제를 넓히는 발판이 되었고, 들판의 유목민과 코사크는 이 선 밖으로 밀려났다. 지도는 1586년에 보로네시 일대를, 1596년에 벨고로드·하르키우 일대를 러시아 땅으로 그린다. 1570년의 칙서는 북도네츠의 코사크에게 아조프로 가는 사절 노보실체프를 도와 달라고 청한 것이고, 돈 코사크는 이 뒤에도 급료를 받고 봉사하며 스스로 다스렸으므로 지도는 돈강 초원(로스토프·루한스크·도네츠크 북부와 볼고그라드 서쪽의 호표르강·메드베디차강·돈강 굽이)을 이들이 처음 차르에게 충성을 서약한 1671년(「스텐카 라진의 반란과 돈 코사크의 서약」, 뒤의 사건)까지 비워 둔다."
  subjects: [russia-tsardom, crimean-khanate, nogai-horde]
  links:
    - { from: crimean-khanate, to: russia-tsardom, note: "모스크바 습격 (1571)" }
    - { from: russia-tsardom, to: crimean-khanate, note: "몰로디 전투 (1572)" }
  tags: [war, politics]
  sources: ["니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "Brian L. Davies, Warfare, State and Society on the Black Sea Steppe, 1500–1700 (2007)", "「돈 코사크군」, 『군사 백과사전』(시틴, 1911~1915)", "А. А. Волвенко, «Существование Донского войска считать с 3 января 1570 г.» или рождение 300-летнего юбилея, Новое прошлое / The New Past, 2020, № 2"]

- id: livonian-war-end-1577
  year: 1577
  endYear: 1583
  title:
    ko: 리보니아 전쟁의 끝과 예르마크의 시베리아 원정
  summary:
    ko: "리보니아 전쟁 중 러시아의 이반 4세는 1565년 나라를 둘로 나눠 직할지(오프리치니나)를 두고 친위대를 시켜 대귀족과 반대파를 숙청했으며, 1570년에는 반역 혐의로 노브고로드를 습격해 많은 주민을 죽였다. 그는 1577년 리보니아 대부분을 다시 차지했으나, 폴란드-리투아니아 연방의 새 왕 스테판 바토리가 반격해 1579년 폴로츠크를 되찾고 1581~1582년 프스코프를 에워쌌다. 같은 무렵 스웨덴군은 1581년 나르바를 함락하며 러시아인 수비대와 주민 수천 명을 죽였다. 1582년 1월 얌자폴스키 휴전으로 러시아는 리보니아를 폴란드-리투아니아에 넘기고 폴로츠크를 포기했으며, 1583년 플류사 휴전으로 나르바·이반고로드 등 핀란드만 연안을 스웨덴에 내주었다. 25년 동안의 전쟁과 오프리치니나로 러시아 북서부는 크게 황폐해졌다. 한편 상인 스트로가노프 가문의 지원을 받은 코사크 예르마크가 우랄산맥을 넘어 1582년 시비르 칸국의 수도를 차지해 러시아의 시베리아 진출이 시작되었다."
  subjects: [russia-tsardom, polish-lithuanian-commonwealth, sweden-kingdom]
  links:
