- id: habsburg-ottoman-1551
  year: 1551
  endYear: 1562
  title:
    ko: 합스부르크-오스만 전쟁과 테메슈바르 점령, 1562년 강화
  summary:
    ko: "1541년 부다가 오스만 직할령이 되어 헝가리가 셋으로 나뉜 뒤, 서·북부는 합스부르크 군주국(페르디난트 1세)이 가졌고 동헝가리 왕국(트란실바니아와 티서강 동쪽)은 서포여이 야노시의 아들 야노시 지그몬드와 어머니 이자벨라가 오스만의 종주 아래 다스렸다. 실권자인 추기경 죄르지 프라테르(마르티누지)는 오스만과 합스부르크 사이에서 줄타기하다 1551년 7월 이자벨라가 트란실바니아를 페르디난트 1세에게 넘기게 했고(바이센부르크 조약, 7월 19일. 오스만은 인정하지 않음), 12월 합스부르크 쪽 장군 카스탈도의 부하들에게 살해되었다. 테메슈바르·리포바·솔노크는 이 조약 뒤 페르디난트 쪽 수비대가 지키고 있었다. 술레이만 1세는 이에 맞서 1552년 두 갈래로 군대를 올려 보내 7월 테메슈바르(티미쇼아라)를 함락하고 리포바와 솔노크 같은 요새를 차지했다. 그러나 에게르는 도보 이슈트반이 이끈 수비대가 39일 동안 버텨 지켜 냈다. 오스만은 테메슈바르를 중심으로 여러 산자크를 묶은 테메슈바르 에얄레트를 두었다. 이자벨라와 지그몬드는 1556년 오스만의 도움으로 트란실바니아에 돌아왔고, 국경 요새를 두고 싸움은 이어졌다. 1562년 페르디난트 1세와 술레이만 1세가 콘스탄티노폴리스에서 강화해, 오스만은 중부 헝가리와 1552년 차지한 땅을 그대로 두고 합스부르크는 서·북부를 지켰으며 합스부르크가 1547년 휴전 이래 해마다 바치던 돈(「오스만의 부다 점령과 헝가리의 3분」, 앞의 사건)도 이어졌다고 전한다. 지도는 이 땅들을 동헝가리 땅으로 두었다가 1562년 테메슈바르 일대(바나트)와 솔노크, 슬라보니아의 비로비티차·차즈마, 북부의 노그라드·세체니 쪽을 오스만 땅으로 그린다(요새마다 넘어간 해는 근사). 이 헝가리 전선은 1566년 시게트바르 원정(「시게트바르 함락과 트란실바니아 공국의 성립」, 뒤의 사건)으로 이어졌다."
  subjects: [ottoman, habsburg-monarchy, eastern-hungarian-kingdom]
  links:
    - { from: ottoman, to: habsburg-monarchy, note: "에게르 포위 실패 (1552), 1562년 강화" }
    - { from: ottoman, to: eastern-hungarian-kingdom, note: "테메슈바르·리포바·솔노크 점령 (1552), 지도는 1562" }
  tags: [war, diplomacy]
  sources: ["Miklós Molnár, A Concise History of Hungary (2001)", "Gábor Ágoston, Guns for the Sultan: Military Power and the Weapons Industry in the Ottoman Empire (2005)", "「콘스탄티노폴리스 조약」(1562)"]
