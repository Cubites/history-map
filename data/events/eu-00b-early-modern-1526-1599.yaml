- id: calvin-1536
  year: 1536
  endYear: 1541
  title:
    ko: 츠빙글리와 칼뱅의 종교 개혁
  summary:
    ko: "스위스 연방에서는 취리히의 츠빙글리가 1520년대에 성서에 근거가 없는 미사·성상·사순절 단식 등을 없애는 개혁을 이끌었다. 성찬에 대한 해석 차이로 루터와 손잡지 못한 그는 가톨릭을 지킨 중부 칸톤들과 싸운 카펠 전투(1531)에서 전사했다. 프랑스의 탄압을 피해 바젤에 머물던 장 칼뱅은 1536년 『기독교 강요』를 펴냈고, 같은 해 베른의 도움으로 주교와 사보이아 공작의 지배에서 벗어나 개혁을 받아들인 제네바에 자리 잡았다. 한때 쫓겨났던 그는 1541년 돌아와 교회 법령을 만들고, 목사와 평신도 장로로 이루어진 치리회가 시민의 신앙과 생활을 감독하게 했다. 칼뱅은 구원받을 사람은 신이 미리 정했다는 예정설을 내세우고 근면한 노동과 검소한 생활을 강조해 상공 시민층의 지지를 얻었다. 제네바는 이단을 엄하게 다스려 1553년 삼위일체를 부정한 세르베투스를 화형에 처했다. 칼뱅파는 프랑스(위그노)·네덜란드(고이센)·스코틀랜드(장로파)·잉글랜드(청교도)로 퍼졌다."
  subjects: [switzerland, savoy]
  tags: [culture, politics]
  sources: ["장 칼뱅, 『기독교 강요』(1536. 문병호 옮김, 생명의말씀사, 2009)", "디아메이드 맥클로흐, 『종교개혁의 역사』(이은재·조상원 옮김, CLC, 2011)"]

- id: netherlands-gelderland-1536
  year: 1536
  endYear: 1543
  title:
    ko: 카를 5세의 저지대 통합과 벤로 조약
  summary:
    ko: "합스부르크령 네덜란드의 군주 카를 5세는 북쪽의 독립 성향 지방을 하나씩 손에 넣어 저지대를 한 덩어리로 묶었다. 1524년 프리슬란트에 이어 1528년 위트레흐트 주교가 세속 통치권을 넘겨 위트레흐트와 오버레이설이 합쳐졌고, 1536년 흐로닝언 시와 오멜란던, 드렌터가 카를의 지배를 받아들였다. 가장 오래 맞선 곳은 헬데른(헬데를란트)과 쥐트펀이었다. 헬데른 공 카럴 판 에흐몬트가 1538년 후사 없이 죽자 신분 의회는 율리히-클레베-베르크 공 빌헬름('부유공')을 새 공으로 뽑았고, 빌헬름은 프랑스 왕 프랑수아 1세와 손잡았다. 카를 5세는 1543년 8월 뒤렌을 쳐서 함락하며 빌헬름을 굴복시켰고, 9월 7일 벤로 조약으로 빌헬름은 헬데른과 쥐트펀을 카를에게 넘기되 클레베·율리히는 지켰다. 이로써 17개 주가 모두 합스부르크 아래 모였고, 카를은 1548년 아우크스부르크 제국 의회에서 이를 부르고뉴 관구로 제국 안에 묶고 1549년 국사 조칙으로 상속 때 나뉘지 않게 했다. 지도는 흐로닝언·드렌터·위트레흐트·오버레이설과 헬데른을 1543년에 한꺼번에 합스부르크령 네덜란드 땅으로 그린다. 카를이 물러난 뒤(1555~1556) 이 땅들은 에스파냐 왕 펠리페 2세에게 넘어갔고, 이는 네덜란드 독립 전쟁(「네덜란드 독립 전쟁의 시작」, 뒤의 사건)의 바탕이 되었다."
  subjects: [habsburg-netherlands, holy-roman-empire, france, spain]
  links:
    - { from: habsburg-netherlands, to: holy-roman-empire, note: "헬데른·쥐트펀 병합, 벤로 조약 (1543)" }
  tags: [war, politics]
  sources: ["「벤로 조약」(1543)", "Jonathan I. Israel, The Dutch Republic: Its Rise, Greatness, and Fall 1477–1806 (1995)", "Geoffrey Parker, The Dutch Revolt (개정판, 1985)"]
  places: [{ name: "뒤렌", at: [6.48, 50.8], year: 1543 }, { name: "벤로", at: [6.17, 51.37], year: 1543 }]

- id: buda-1541
  year: 1541
  endYear: 1547
  title:
    ko: 오스만의 부다 점령과 헝가리의 3분
  summary:
    ko: "서포여이 야노시와 페르디난트 1세는 1538년 너지바러드 조약으로 헝가리를 나누고, 야노시가 죽으면 페르디난트가 전부를 잇기로 몰래 약속했다. 그러나 1540년 야노시가 죽고 갓난아들 야노시 지그몬드가 왕으로 뽑히자 페르디난트의 군대가 부다를 에워쌌다. 술레이만 1세는 1541년 8월 원정해 이를 물리치고 부다를 차지해 직할령으로 삼았으며, 티서강 동쪽과 트란실바니아는 야노시 지그몬드와 어머니 이자벨라에게 맡겼다. 이로써 헝가리는 합스부르크 군주국이 다스리는 서·북부(왕령 헝가리), 오스만 직할의 중부, 오스만 종주 아래의 동헝가리 왕국(뒤의 트란실바니아 공국)으로 셋으로 나뉘었다. 오스만군은 이후 에스테르곰(1543) 등 요새를 더 빼앗았고, 1547년 아드리아노플 휴전으로 페르디난트와 카를 5세는 해마다 3만 두카트를 오스만에 바치며 이 나눔을 받아들였다."
  subjects: [ottoman, habsburg-monarchy, eastern-hungarian-kingdom]
  links:
