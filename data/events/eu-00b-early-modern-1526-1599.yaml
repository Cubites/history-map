- id: ottoman-safavid-1555
  year: 1555
  endYear: 1590
  title:
    ko: "아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼"
  summary:
    ko: "오스만 제국과 이란의 사파비 왕조는 아나톨리아 동쪽과 이라크, 캅카스를 두고 오래 다투었다(셀림 1세의 찰디란 전투는 「셀림 1세의 맘루크 정복과 술레이만 1세의 베오그라드·로도스 점령」, 앞의 사건에 있다). 술레이만 1세와 샤 타흐마스프 1세는 1532~1555년의 전쟁 끝에 1555년 5월 29일 아마시아에서 강화했다. 아마시아 조약은 이라크(바그다드)와 서아르메니아·서조지아를 오스만 쪽에, 타브리즈·아제르바이잔·다게스탄과 동아르메니아·동조지아를 사파비 쪽에 두고 카르스는 요새를 허문 중립지로 두었다(에르주룸·반 쪽 완충 지대는 해석이 갈리며 지도는 반·바야지트를 오스만 땅으로 그린다). 그래서 조지아에서는 카르틀리·카헤티가 사파비의 세력권에, 이메레티와 서조지아 공국들이 오스만의 세력권에 들었다. 20여 년의 평화 뒤 오스만의 무라드 3세(재위 1574~1595)는 사파비의 계승 다툼(타흐마스프가 1576년 죽은 뒤 이스마일 2세, 무함마드 호다반다가 차례로 샤가 됨)을 틈타 1578년 랄라 무스타파 파샤를 보내 8월 칠드르에서 사파비군을 무찌르고 트빌리시와 시르반을 차지했다. 전쟁은 12년 동안 이어져 1585년 9월 오스만군이 타브리즈를 차지했고, 1587년 호다반다가 아들 아바스 1세(재위 1587~1629)에게 밀려난 뒤 1588년 파르하트 파샤가 조지아를 거쳐 카라바흐로 나아갔다. 1590년 3월 21일 콘스탄티노폴리스 조약으로 아바스 1세는 아제르바이잔(타브리즈 포함)·카라바흐·간자·다게스탄·조지아 일부·루리스탄·쿠르디스탄을 오스만에 넘겼다. 조약은 조지아의 카르틀리·카헤티 두 왕국도 오스만 쪽에 넘겼다(병합으로 적는 자료도 있다). 그러나 오스만이 실제로 다스린 곳은 파샬르크로 삼은 트빌리시와 산자크로 삼은 고리 등 요새의 수비대에 그쳤고, 카르틀리의 시몬 1세는 해마다 공물을 바치는 대가로 자치를 인정받았으며 카헤티의 알렉산드레 2세도 1578년부터 오스만의 종주를 받아들인 채 왕위를 지켜 두 왕국은 종속국으로 이어졌다. 그래서 지도는 1590년 아제르바이잔·아르메니아·삼츠헤·카르스와 아자리아(이메레티 항목이 가졌던 구리아 공국 땅)를 오스만 땅으로 그리고, 카르틀리·카헤티는 왕국으로 둔 채 1611년까지 오스만의 종속국으로 표시한다(트빌리시·고리의 수비대는 근사. 이메레티 본토와 서조지아 공국들도 오스만의 종주 아래 이메레티 항목으로 그대로 두며, 아바스 1세는 1603년부터 땅을 되찾기 시작한다)."
  subjects: [ottoman, kartli, kakheti, imereti]
  links:
