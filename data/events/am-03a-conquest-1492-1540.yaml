# 아메리카 사건 2묶음 갈래 03a: 카리브해의 첫 식민지와 정복의 시대 (1492 ~ 1540년)
# 범위: 히스파니올라·쿠바·플로리다·파나마 식민, 아즈텍·타라스코·잉카·무이스카 정복과 신잉카국, 과테말라·유카탄·브라질·라플라타·북아메리카 내륙 탐험(1492~1540 시작 사건).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 1582년 앞 날짜는 율리우스력(스페인·포르투갈 달력). 문서가 날짜를 갈리게 적은 것은 갈림을 글에 밝혔고, 확실하지 않은 날짜는 '무렵'.
# 이름 규칙: 항목 이름(산토도밍고 총사령부·쿠바 총사령부·누에바에스파냐 부왕령·페루 부왕령·과테말라 총사령부 등)을 쓰되, 정복기 이름(쿠바 총독령·누에바에스파냐 왕국·누에바카스티야 총독부·과테말라 아우디엔시아)은 그때 이름으로 쓰고 항목 이름을 한 번 함께 적었다. 원주민 사회(타이노·틀락스칼라·키체 등)는 글에만 썼다.
# 지도 결정과의 관계: 정복기 단위는 사료 성립 해로 이름 줄을 글에서 풀었고, 영국·프랑스의 북아메리카 항해와 점령은 글에서 사실대로만 다뤘다. 북아메리카 1492~1564년과 파나마 1519~1541년의 땅은 글에서만 다뤘다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 「콜럼버스와 다가마, 신항로 개척」, 「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」, 「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」.

- id: hispaniola-1493
  year: 1493
  endYear: 1500
  title:
    ko: "라 이사벨라와 산토도밍고: 히스파니올라의 첫 식민지(1493~1500)"
  summary:
    ko: "1492년 12월 첫 항해 때 콜럼버스가 히스파니올라섬 북안에 남긴 라나비다드 요새는 이듬해 11월 두 번째 항해 선단이 돌아왔을 때 이미 무너지고 남은 사람들도 숨진 뒤였다(첫 항해와 토르데시야스 조약은 「콜럼버스와 다가마, 신항로 개척」(앞의 사건)). 콜럼버스는 큰 선단과 1천 명이 넘는 사람을 이끌고 와 1494년 1월 무렵 북안에 라 이사벨라를 세웠으나, 질병과 식량 부족에 기대보다 적은 금이 겹쳐 정착지는 곧 어려워졌다. 스페인 사람들은 금을 찾아 내륙의 타이노 족장들에게 금이나 솜을 공물로 바치게 했고, 이에 맞선 타이노 사람들과 1495년 무렵 싸움이 이어졌다. 콜럼버스의 동생 바르톨로메 콜럼버스는 1496년 섬 남안 오자마강 동쪽에 새 거점을 세웠고(1498년을 공식 창건으로 보는 설명도 있다) 이곳이 뒷날 산토도밍고로 불리며 산토도밍고 총사령부 땅이 되는 스페인 식민지의 중심이 되었다. 1497년 프란시스코 롤단이 섬 서쪽에서 콜럼버스 형제의 통치에 맞서 반란을 일으켰고, 1498년 세 번째 항해로 돌아온 콜럼버스는 그와 타협했다. 1500년 8월 23일 왕이 보낸 프란시스코 데 보바디야가 산토도밍고에 닿아 총독 자리를 넘겨받았고, 9월 콜럼버스와 바르톨로메를 붙잡아 10월 초 스페인으로 보냈다. 롤단은 사면되었다. 보바디야는 1502년 니콜라스 데 오반도로 교체되었고, 콜럼버스는 그해 네 번째 항해에서 산토도밍고 입항을 오반도에게 거절당했다. 이 몇 해 사이 타이노 인구는 학살과 강제 노동, 유럽에서 옮겨 온 전염병으로 급감했다. 섬의 타이노 인구가 40만 명 이상이었다가 1507~1508년 약 6만 명으로 줄었다는 추산이 있으나 추산은 학설마다 크게 갈린다."
  subjects: [santo-domingo-captaincy, spain]
  links:
    - { from: spain, to: santo-domingo-captaincy, note: "1493~1496년 라 이사벨라와 산토도밍고를 세워 히스파니올라에 첫 식민지를 둠" }
  tags: [politics, society]
  sources: ["Hugh Thomas, Rivers of Gold: The Rise of the Spanish Empire (Random House, 2003)", "J. H. Elliott, Empires of the Atlantic World: Britain and Spain in America 1492–1830 (Yale University Press, 2006)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: cabot-1497
  year: 1497
  endYear: 1498
  title:
    ko: "존 캐벗의 북대서양 항해(1497~1498)"
  summary:
    ko: "이탈리아 출신 항해가 조반니 카보토, 곧 존 캐벗(아들 세바스천은 아버지가 제노바 출신이라 했으나 가에타 등 다른 설도 있다)은 잉글랜드 브리스틀을 근거지로 삼아 북쪽 길로 아시아에 닿을 방법을 찾았다. 잉글랜드 왕 헨리 7세는 1496년 3월 5일 캐벗과 그의 세 아들에게 새로 찾는 땅을 잉글랜드 왕의 이름으로 차지할 권리를 담은 특허장을 주었는데, 이 특허장에 함께 이름이 오른 세 아들은 루도비코·세바스천·산초였다. 1497년 캐벗은 50톤쯤의 작은 배 매슈호를 타고 5월 2일 브리스틀을 떠나 6월 24일 육지에 닿았고, 그곳에서 해안을 따라 살핀 뒤 8월 6일 돌아왔다. 상륙한 곳이 어디인지는 학설이 갈린다. 캐나다와 영국 정부는 500주년 행사에서 뉴펀들랜드 섬의 보나비스타곶을 기념지로 삼았지만 케이프브레턴섬이나 래브라도, 그 밖의 곳을 드는 견해도 있고, 존 데이의 편지가 발견된 뒤에는 뉴펀들랜드 또는 케이프브레턴이 가장 유력하다고 본다. 왕은 8월 10일 캐벗에게 10파운드를 상으로 주었다. 캐벗은 그곳에 사는 사람들을 만난 자취를 거의 남기지 않았고, 동행한 사람들은 바다에 물고기가 가득하다고 전했다고 하는데, 이 소문은 뒷날 유럽 어선들이 북대서양의 대구 어장으로 몰려드는 배경이 되었다. 1498년 5월 무렵 캐벗은 배 다섯 척을 이끌고 다시 브리스틀을 떠났다. 한 척은 폭풍으로 아일랜드에 닿았고 나머지 네 척은 서쪽으로 나아갔으나, 항해의 결과를 알려 주는 기록이 오랫동안 알려지지 않아 선단이 바다에서 사라졌다고 믿어 왔다. 최근 연구는 캐벗이 1500년 5월에는 런던에 있었다고 주장하기도 한다. 캐벗의 아들 세바스천 캐벗도 뒷날 항해가로 이름을 떨쳤다. 이 항해는 잉글랜드가 북아메리카를 청구하는 뒷날의 근거가 되었으나 잉글랜드의 정착은 한 세기가 지나서야 시작되었다."
  subjects: [england]
  tags: [politics, economy]
  sources: ["Samuel Eliot Morison, The European Discovery of America: The Northern Voyages (Oxford University Press, 1971)", "J. H. Elliott, Empires of the Atlantic World: Britain and Spain in America 1492–1830 (Yale University Press, 2006)"]

- id: cabral-1500
  year: 1500
  endYear: 1502
  title:
    ko: "카브랄의 브라질 도착과 아메리고 베스푸치(1500~1502)"
  summary:
    ko: "포르투갈 왕 마누엘 1세는 바스쿠 다가마의 뒤를 이어 인도로 보내는 큰 선단의 지휘를 페드루 알바르스 카브랄에게 맡겼다. 배 13척과 약 1,500명을 실은 선단은 1500년 3월 9일 리스본을 떠나 대서양 서쪽으로 크게 돌다가 4월 22일 오늘날 브라질 동해안의 몬테파스쿠알 앞바다에 닿았다. 카브랄은 24일 포르투세구루에 닻을 내렸고 26일 미사를 올렸으며, 그 땅이 1494년 토르데시야스 조약의 경계(「콜럼버스와 다가마, 신항로 개척」(앞의 사건)) 동쪽의 포르투갈 몫이라고 판단해 '베라크루스섬'이라 이름 붙였다. 선단은 열흘쯤 머문 뒤 5월 2일 무렵 인도로 떠났고, 보급선 한 척이 왕에게 소식을 전하러 돌아갔다. 그 땅의 원주민을 만난 일은 서기 페루 바스 드 카미냐가 왕에게 쓴 편지에 남았다. 이 땅에서 붉은 염료로 쓰이는 '파우브라질', 곧 브라질나무가 많이 난다는 사실이 알려지면서 뒤에 나라 이름이 되었다. 한편 피렌체 출신 아메리고 베스푸치는 1499년 5월 18일 스페인을 떠난 알론소 데 오헤다의 원정에 참여해 남아메리카 북쪽 해안을 보았고, 1501년 5월 포르투갈 왕의 후원으로 곤살루 코엘류의 함대를 따라 브라질에 이르렀다. 이 함대는 8월 17일 브라질에 닿았고 1502년 1월 1일 한 만을 리우데자네이루라 불렀으며 2월 13일 해안을 떠났다. 베스푸치가 쓴 것으로 알려진 『신세계』는 1503년 무렵 널리 읽혔다. 1507년 4월 마르틴 발트제뮐러와 마티아스 링만은 생디에의 학자 모임에서 낸 『우주학 입문』과 세계 지도에서 이 신세계를 베스푸치의 이름을 따 '아메리카'라 부르자고 제안했고, 이 이름이 뒤에 널리 퍼졌다."
  subjects: [portugal]
  tags: [politics, economy]
  sources: ["Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society: Bahia, 1550–1835 (Cambridge University Press, 1985)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: moctezuma-1502
  year: 1502
  endYear: 1519
  title:
    ko: "몬테수마 2세의 아즈텍 삼각 동맹(1502~1519)"
  summary:
    ko: "아즈텍 삼각 동맹은 테노치티틀란·텍스코코·틀라코판 세 도시가 맺은 동맹으로, 멕시코 중부 분지를 중심으로 공물을 거두며 영역을 넓혔다. 몬테수마 2세는 삼촌 아우이소틀의 뒤를 이어 1502년(1503년이라는 견해도 있다) 틀라토아니, 곧 왕으로 올랐다. 그는 귀족 중심의 위계를 굳히고 정복지에서 공물을 더 걷었다. 공물은 옥수수와 면직물, 카카오, 깃털, 금 따위였다고 전하며, 호수 위 섬 도시인 테노치티틀란의 인구는 20만 명 안팎이라는 추산이 많다. 1505년 무렵 가뭄이 시작되어 세 해쯤 흉작이 이어졌고, 아마케메칸 같은 분지 안 도시국가는 돌과 목재를 더 바쳐야 했다. 주변의 틀락스칼라와 우에호친고는 동맹에 끝까지 맞섰으며, 1450년대 중반(1454년 무렵)에 시작된 '꽃의 전쟁'이라는 의례 전쟁에서 포로를 서로 잡았다. 아틀릭스코에서 우에호친고와 싸워 양쪽이 큰 손실을 입은 일(1503년 무렵, 디에고 두란은 1507년으로 적었다) 뒤 오아하카 여러 곳이 아즈텍이 약해졌다고 보고 반란을 일으켰다고 풀이한다. 서쪽의 타라스코 왕국과는 1514년 무렵 싸워 양쪽 모두 큰 사상자를 냈으나 영토를 얻지 못했다. 틀락스칼라가 가장 큰 적수가 된 것은 1518~1519년 무렵이다. 스페인 쪽에서는 1517년 에르난데스 데 코르도바가 유카탄 해안을 처음 살폈고, 1518년 후안 데 그리할바가 멕시코만 해안에서 아즈텍 사절을 만나 소식이 몬테수마에게 닿았다. 1519년 코르테스의 원정군이 나타나며 이 동맹의 체제는 크게 흔들리기 시작했다(「코르테스의 원정과 테노치티틀란 함락(1519~1521)」(뒤의 사건)). 아즈텍 세계의 전쟁과 인신 공희는 정복자들의 기록에 과장되기도 해 연대기마다 시각이 갈리니 몬테수마 시기의 숫자는 어림으로만 읽어야 한다."
  subjects: [aztec, tarascan]
  tags: [politics, war]
  sources: ["Inga Clendinnen, Aztecs: An Interpretation (Cambridge University Press, 1991)", "Hugh Thomas, Conquest: Montezuma, Cortés, and the Fall of Old Mexico (Simon & Schuster, 1993)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)"]

- id: encomienda-1503
  year: 1503
  endYear: 1513
  title:
    ko: "엔코미엔다와 부르고스법, 히스파니올라에서 푸에르토리코·자메이카로(1503~1513)"
  summary:
    ko: "1502년 히스파니올라 총독이 된 니콜라스 데 오반도는 스페인 왕실의 뜻에 따라 이듬해 무렵 엔코미엔다 제도를 본격으로 열었다. 이 제도는 원주민 공동체를 스페인 식민자에게 맡겨 노동과 공물을 얻게 하는 대신 식민자가 그들을 보호하고 기독교를 가르치게 했으나, 실제로는 강제 노동과 다르지 않았다. 타이노 인구는 「라 이사벨라와 산토도밍고: 히스파니올라의 첫 식민지(1493~1500)」(앞의 사건)에서 다룬 길로 줄어들었고 식민자들은 일손을 찾아 바하마 제도의 사람들을 데려오기도 했다. 1508년 7월 12일 후안 폰세 데 레온이 약 50명을 이끌고 히스파니올라를 떠나 푸에르토리코의 산후안만에 이르러 카파라를 세웠다. 1509년에는 콜럼버스의 아들 디에고 콜럼버스가 산토도밍고에 부임해 총독이 되었고, 같은 해 후안 데 에스키벨이 자메이카에 첫 정착지를 세워 이 섬은 히스파니올라 총독의 관할 아래 놓였다(뒷날 산토도밍고 총사령부로 이어지는 단위). 1511년 12월 도미니코회 수사 안토니오 데 몬테시노스는 산토도밍고에서 원주민을 학대하는 식민자를 꾸짖는 설교를 했고, 이 일은 왕실이 엔코미엔다 개혁에 나서는 계기가 되었다. 1512년 12월 27일 왕은 부르고스에서 부르고스법 35조를 반포해 원주민의 노동 시간과 처우, 개종을 정했다(1513년 7월 28일 바야돌리드에서 보완). 1513년에는 법학자 팔라시오스 루비오스가 쓴 '요구문'(레케리미엔토)이 정복 원정에서 읽혀, 원주민이 스페인 왕에게 복종하지 않으면 전쟁을 정당하다고 선언하게 했다. 이 법들은 실제로는 잘 지켜지지 않았고, 1542년 신법이 나올 때까지 논쟁이 이어졌다(「신법과 바야돌리드 논쟁, 페루 부왕령(1542~1551)」(뒤의 사건))."
  subjects: [santo-domingo-captaincy, spain]
  tags: [society, politics]
  sources: ["Hugh Thomas, Rivers of Gold: The Rise of the Spanish Empire (Random House, 2003)", "Lesley Byrd Simpson, The Encomienda in New Spain (University of California Press, 1929)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: cuba-conquest-1511
  year: 1511
  endYear: 1515
  title:
    ko: "벨라스케스의 쿠바 정복과 아투에이(1511~1515)"
  summary:
    ko: "스페인 왕실의 승인 아래 히스파니올라 총독 디에고 콜럼버스의 명령으로 디에고 벨라스케스 데 쿠에야르는 1511년 1월 쿠바 동쪽 끝에 상륙했다. 8월 무렵 바라코아에 첫 정착지가 생겼고, 1511년 11월 벨라스케스는 쿠바 총사령부(1607년 앞에는 총독이 다스림)가 될 이 땅의 총독이 되어 1524년 6월까지 자리를 지켰다. 히스파니올라에서 건너온 타이노 족장 아투에이는 쿠바 동부에서 저항을 이끌다 붙잡혀 산 채로 불태워졌다고 라스 카사스가 전했으며, 처형을 1512년으로 적는 서술이 많다. 1513년 판필로 데 나르바에스는 병력을 이끌고 쿠바 중부를 지났고 이 과정에서 카오나오에서 원주민 학살이 일어났다고 라스 카사스는 적었다. 같은 해 벨라스케스는 세 갈래로 서쪽 원정대를 보냈다. 1513년 바야모, 1514년 트리니다드와 산크리스토발데라아바나(아바나)와 산크티스피리투스가 생겼고, 1515년 카마궤이(푸에르토프린시페)가 세워졌으며 1515년 7월 산티아고데쿠바가 새 수도가 되었다. 이 일곱 도시는 쿠바 식민지의 뼈대가 되었고, 쿠바에서도 엔코미엔다가 나뉘어 금 채굴과 목축에 원주민이 동원되었다. 나르바에스의 원정에 군목으로 따라간 라스 카사스는 1514년 자신의 엔코미엔다를 내놓고 원주민 보호에 나섰다. 타이노 인구는 학살과 강제 노동, 천연두와 홍역 같은 전염병으로 히스파니올라에서와 같은 길을 밟아 빠르게 줄었다. 벨라스케스는 1518년 후안 데 그리할바의 멕시코만 원정을 보냈고 이어 1519년 2월 에르난 코르테스가 벨라스케스의 원정 철회 명령을 어기고 아바나에서 떠났다(「코르테스의 원정과 테노치티틀란 함락(1519~1521)」(뒤의 사건)). 쿠바는 이후 멕시코와 플로리다 원정의 출발지가 되었고, 섬의 금과 목축 수입은 곧 줄어 식민자들이 대륙으로 눈을 돌리는 계기가 되었다."
  subjects: [cuba-captaincy-general, spain]
  links:
    - { from: spain, to: cuba-captaincy-general, note: "1511~1515년 쿠바를 정복해 식민지로 삼음" }
  tags: [war, politics]
  sources: ["Hugh Thomas, Rivers of Gold: The Rise of the Spanish Empire (Random House, 2003)", "Bartolomé de las Casas, Brevísima relación de la destrucción de las Indias (1552)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: florida-balboa-1513
  year: 1513
  endYear: 1521
  title:
    ko: "폰세 데 레온의 플로리다와 발보아의 태평양(1513~1521)"
  summary:
    ko: "푸에르토리코 총독을 지낸 후안 폰세 데 레온은 1513년 3월 푸에르토리코에서 북쪽으로 배를 몰아 4월 2일 육지를 보고 섬이라 여겨 라플로리다라 이름 붙였다. 이튿날 3일 상륙한 곳은 플로리다 대서양 쪽 해안이라는 견해가 많고(안내인 알라미노스가 4월 2일 북위 30도 8분이라 적었다. 세인트오거스틴 둘레에서 멜버른비치까지 여러 곳이 거론되어 학설이 갈린다), 부활절(3월 27일 무렵)에 이미 육지를 보았다는 기록도 있다. 이 땅이 뒷날 스페인령 플로리다가 되지만 정착은 1565년에야 시작되었다. 그는 1512년 왕에게서 '비미니'라는 섬을 찾아 다스릴 허가를 받았다(젊음의 샘 이야기는 뒷날 만들어진 전설이라는 견해가 많다). 폰세 데 레온은 1521년 3월 식민지를 세우려고 두 번째 원정을 이끌고 플로리다 서남 해안(샬럿 하버 일대라는 견해가 많다)에 닿았으나 칼루사 사람들의 공격을 받아 허벅지에 화살을 맞았고, 원정대는 쿠바로 물러났다. 그는 7월 첫 주 아바나에서 상처 감염으로 숨졌다. 한편 파나마 지협에서는 1510년 9월 산타마리아라안티과델다리엔이 세워졌고, 바스코 누녜스 데 발보아가 그곳 지도자가 되었다. 발보아는 현지 원주민 지도자들과 동맹을 맺으며 탐사했고, 1513년 9월 25일 산 위에서 새 바다를 보고 29일 산미겔만에 이르러 스페인 왕의 이름으로 그 바다를 차지한다고 선언했다. 스페인은 이를 '남쪽 바다'라 불렀고, 이 바다는 뒷날 마젤란이 이름 붙인 태평양과 같은 바다이다. 1514년 페드라리아스 다빌라가 대규모 선단과 함께 새 총독으로 도착해 이 땅을 카스티야 델 오로라 부르며 다스렸다. 그는 발보아를 1519년 1월 처형했다(날짜는 12일·15일·21일로 자료마다 갈린다). 페드라리아스는 1519년 8월 15일 태평양 쪽 연안에 파나마시티를 세워 뒷날 페루 원정의 기지가 되게 했다."
  subjects: [spanish-florida, spain]
  links:
    - { from: spain, to: spanish-florida, note: "1513년 폰세 데 레온이 플로리다를 스페인의 이름으로 찾아냄" }
  tags: [politics, society]
  sources: ["David J. Weber, The Spanish Frontier in North America (Yale University Press, 1992)", "Hugh Thomas, Rivers of Gold: The Rise of the Spanish Empire (Random House, 2003)", "Michael Gannon, ed., The New History of Florida (University Press of Florida, 1996)"]

- id: slave-license-1518
  year: 1518
  endYear: 1522
  title:
    ko: "아프리카인 노예 수입 허가와 1521년 히스파니올라 봉기(1518~1522)"
  summary:
    ko: "히스파니올라의 타이노 인구가 급감하자 식민자들은 일손을 아프리카에서 데려온 사람들로 채우려 했다. 스페인 왕실은 1517년 식민자 한 사람이 열두 명의 노예를 들여올 수 있게 허락했고, 1518년에는 카를로스 1세가 아프리카에서 카리브로 직접 노예를 싣는 큰 규모의 허가(약 4천 명으로 전하나 문서마다 갈린다)를 내주었다. 카리브에서 노예로 부려진 사람은 타이노·바하마 원주민과 아프리카에서 온 사람이 섞여 있었다. 히스파니올라에서는 사탕수수 재배와 물레방아로 돌리는 제당소가 생겼고, 산토도밍고 둘레의 제당소에서 아프리카인 노동이 중요해졌다. 1521년 크리스마스 무렵(25일이나 26일) 산토도밍고 근처 총독 디에고 콜럼버스 소유의 누에바이사벨라 제당소에서 노예로 부려지던 월로프 사람들이 일으킨 봉기는 아메리카에서 기록된 가장 이른 노예 반란으로 알려져 있다. 구전은 마리아 올로파와 곤살로 만딩가를 지도자로 꼽으나 이는 문서가 아닌 구전이며, 봉기에 참여한 사람의 수는 문서에 없다. 스페인 지원군이 곧 와서 봉기를 진압했다. 1522년 1월 6일 총독 디에고 콜럼버스는 노예의 이동을 제한하고 무기를 갖지 못하게 하며 엄한 처벌을 정하는 법을 내놓았고, 월로프의 수입을 막는 왕의 명령도 이어졌다고 한다. 이는 신세계에서 노예를 통제하는 가장 이른 법의 하나로 여겨진다. 이 일은 카리브의 노예 노동이 아프리카에서 이어 오는 노예 무역으로 옮겨 가는 출발점의 하나였으나, 이 무역이 가장 커진 때는 훨씬 뒤이다(「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(뒤의 사건)). 이 무렵 히스파니올라는 산토도밍고 총사령부의 땅으로, 스페인 식민지 가운데 가장 이른 노예제 사회의 하나였다."
  subjects: [santo-domingo-captaincy, spain]
  tags: [society, economy]
  sources: ["Hugh Thomas, The Slave Trade: The Story of the Atlantic Slave Trade, 1440–1870 (Simon & Schuster, 1997)", "Stuart B. Schwartz, ed., Tropical Babylons: Sugar and the Making of the Atlantic World, 1450–1680 (University of North Carolina Press, 2004)"]

- id: tenochtitlan-1519
  year: 1519
  endYear: 1521
  title:
    ko: "코르테스의 원정과 테노치티틀란 함락(1519~1521)"
  summary:
    ko: "에르난 코르테스는 쿠바 총독 벨라스케스가 원정 허가를 거두려 했는데도 1519년 2월 10일 쿠바를 떠났고, 4월 멕시코만 해안에 상륙해 베라크루스에 도시를 세웠다. 그는 원주민 여성 말린체의 통역을 받으며 내륙으로 올라갔다. 틀락스칼라는 아즈텍 삼각 동맹에 오래 맞서 온 나라여서 18일 동안 스페인군과 싸운 끝에 9월 평화를 맺고 동맹을 맺었다. 10월 스페인군과 동맹군이 촐룰라에서 많은 사람을 학살했고, 11월 8일 코르테스는 테노치티틀란에서 몬테수마 2세를 만났다. 그러나 1520년 5월 부하 페드로 데 알바라도가 톡스카틀 축제에서 귀족을 학살하자 도시가 들고일어나 6월 말 몬테수마가 죽었고(스페인 쪽 기록과 멕시카 쪽 기록이 달라 누가 죽였는지는 갈린다), 6월 30일 '슬픈 밤'에 스페인군은 많은 사람을 잃고 도시를 빠져나가 7월 7일 오툼바에서 추격군을 물리쳤다. 10월부터 12월 사이 천연두가 퍼졌고 몬테수마의 뒤를 이은 쿠이틀라우악이 12월 4일 숨졌으며, 이 전염병으로 숨진 사람의 수는 추산이 크게 갈려 수백만 명이라는 주장도 있다. 1521년 1월 말 쿠아우테목이 왕으로 뽑혔고, 코르테스는 호수에 띄울 범선 열세 척을 만들어 5월 10일 도시를 포위했다. 원정 전체에 따른 스페인 보병은 2,500~3,000명 안팎(기병 90~100명)이었으나 틀락스칼라를 비롯한 원주민 동맹군은 수만에서 수십만 명에 이른다는 추산이 있어 무너뜨린 쪽의 대부분은 원주민이었다. 1521년 8월 13일 테노치티틀란이 항복하고 쿠아우테목이 붙잡혔으며, 이곳에서 누에바에스파냐 왕국(1535년부터 누에바에스파냐 부왕령)이 시작되었다. 이로써 아즈텍 삼각 동맹은 무너졌고 도시의 많은 사람이 전투와 굶주림, 질병으로 숨졌다."
  subjects: [aztec, new-spain-viceroyalty, spain]
  links:
    - { from: spain, to: aztec, note: "1521년 8월 13일 테노치티틀란을 함락시켜 아즈텍 삼각 동맹을 무너뜨림" }
  tags: [war, politics]
  sources: ["Hugh Thomas, Conquest: Montezuma, Cortés, and the Fall of Old Mexico (Simon & Schuster, 1993)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)", "Inga Clendinnen, Aztecs: An Interpretation (Cambridge University Press, 1991)"]
  places: [{ name: 테노치티틀란 함락, at: [-99.13, 19.43], year: 1521 }]

- id: magellan-strait-1519
  year: 1519
  endYear: 1522
  title:
    ko: "마젤란 함대의 남아메리카 항해와 마젤란 해협(1519~1522)"
  summary:
    ko: "포르투갈 출신 항해가 페르디난드 마젤란은 스페인 왕 카를로스 1세의 후원을 받아 서쪽으로 가는 길로 향료 제도에 닿으려 했다. 배 다섯 척 트리니다드·산안토니오·콘셉시온·빅토리아·산티아고에는 여러 나라 출신 선원이 섞여 있었고 기록자 안토니오 피가페타는 이탈리아 사람이었다. 선단은 1519년 9월 20일 안달루시아의 산루카르데바라메다를 떠났다. 함대는 브라질 해안을 따라 내려가 그해 12월 오늘날의 리우데자네이루 만에 닿았고 1520년 라플라타강 하구를 살폈다. 겨울을 난 산훌리안에서는 1520년 4월 선장 몇 명이 마젤란에 맞서 반란을 일으켰으나 진압되었다. 산티아고는 해협을 찾으러 나갔다가 폭풍으로 부서졌다. 10월 말 함대는 대서양에서 태평양으로 이어지는 해협의 어귀에 들어섰고, 마젤란은 11월 1일 만성인의 날에 닿아 처음에는 '만성인 해협'이라 불렀다. 해협을 지나는 데는 38일이 걸렸다고 전한다. 이 길에서 산안토니오는 탐사를 나갔다가 함대에 돌아오지 않고 스페인으로 되돌아갔다. 마젤란은 해안에 사는 원주민을 파타고네스라 불렀고, 이 말에서 파타고니아라는 이름이 나왔다. 그 땅에는 테우엘체와 셀크남, 야간, 카웨스카르 같은 사람들이 살고 있었다. 11월 말 함대는 처음 보는 큰 바다로 나아갔고 마젤란은 이를 태평양이라 불렀다. 마젤란은 이후 서쪽으로 건너 1521년 필리핀에서 숨졌다(이어지는 항해와 귀환은 「마젤란 함대의 필리핀 도착과 막탄 전투(1521)」(뒤의 사건)). 승무원은 약 270명이었고 6할쯤이 스페인 사람이었으며 포르투갈 사람과 이탈리아 사람이 그다음이었다. 태평양을 건너는 데는 석 달 스무 날이 걸렸다."
  subjects: [spain]
  tags: [politics, society]
  sources: ["Laurence Bergreen, Over the Edge of the World: Magellan's Terrifying Circumnavigation of the Globe (William Morrow, 2003)", "Antonio Pigafetta, Relazione del primo viaggio intorno al mondo"]

- id: oaxaca-mixteca-1521
  year: 1521
  endYear: 1529
  title:
    ko: "오악사카 정복과 믹스텍·사포텍 나라들(1521~1529)"
  summary:
    ko: "1521년 8월 테노치티틀란이 항복한 뒤 스페인 사람들은 곧 남쪽 오악사카로 눈을 돌렸다(「코르테스의 원정과 테노치티틀란 함락(1519~1521)」(앞의 사건)). 위키백과 영어판 오악사카 역사는 곤살로 데 산도발과 프란시스코 데 오로스코, 페드로 데 알바라도가 아즈텍 쪽의 큰 군사 거점을 테노치티틀란이 무너진 지 넉 달 만에 누른 것으로 적고, 오로스코가 사제 후안 디아스와 함께 오악사카 계곡에 들어가 첫 성당을 지었다고 한다. 사포텍 지도자들은 아즈텍 제국이 무너졌다는 소식을 듣고 스페인에 동맹을 제안했다고 전한다. 믹스텍 쪽의 큰 나라는 태평양 해안의 투투테펙이었다. 8사슴 재규어 발톱이 1083년 무렵 이 나라를 다스리기 시작했다고 전하며(앞 일은 「믹스텍 나라들과 8사슴 재규어 발톱(900~1115)」(앞의 사건)), 영향권은 2만 5천 km²를 넘었다고 한다. 알바라도는 코르테스가 보낸 군대와 함께 1522년 1월 테우안테펙의 사포텍 동맹군의 도움을 받았고 2월 투투테펙에 들어가 3월 초 무렵까지 이 나라를 눌렀다. 마지막 통치자 코악신테쿠틀리는 사로잡혀 금 3만 페소를 내놓은 뒤 갇힌 채 죽었다고 한다. 믹스텍 나라들이 끝난 해는 이 1522년으로 보지만 위키백과 한국어판은 1523년으로 적는다. 투투테펙을 비롯한 믹스텍 나라들은 스페인 지배 아래 들어갔고, 오악사카 계곡과 둘레는 코르테스의 영지가 되었다. 1529년 7월 6일 왕의 칙서가 코르테스에게 오악사카 계곡 후작이라는 칭호를 내렸고, 7월 27일 새 칙서가 이 영지를 한 사람에게만 물려주는 한사상속으로 세우는 일을 허락했으며, 이 제도가 실제로 세워진 때는 1535년 1월 9일이다. 영지는 약 2만 3천 명의 봉신과 1만 1,500 km² 넘는 땅으로 오악사카·모렐로스·베라크루스·미초아칸·멕시코주에 흩어져 있었다(원주민 공동체를 스페인 사람에게 맡기는 엔코미엔다는 「엔코미엔다와 부르고스법, 히스파니올라에서 푸에르토리코·자메이카로(1503~1513)」(앞의 사건)). 이 땅은 누에바에스파냐 왕국(1535년부터 누에바에스파냐 부왕령)에 들어갔고, 도미니코회가 1528년 오악사카에 자리를 잡아 1535년 주교구가 섰다. 미헤 사람들의 마지막 큰 반란은 1570년이었다. 한 서술은 오악사카 원주민 인구가 1520년 약 150만 명에서 1650년 약 15만 명으로 줄었다고 어림한다. 알바라도의 다음 원정은 「알바라도의 과테말라 정복과 치아파스(1524~1530)」(뒤의 사건)로 이어진다."
  subjects: [mixtec, new-spain-viceroyalty]
  tags: [war, politics]
  sources: ["Ronald Spores, The Mixtecs in Ancient and Colonial Times (University of Oklahoma Press, 1984)", "Hugh Thomas, Conquest: Montezuma, Cortés, and the Fall of Old Mexico (Simon & Schuster, 1993)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)", "위키백과 영어판 History of Oaxaca·Tututepec·Marquesado del Valle de Oaxaca", "위키백과 한국어판 미슈텍인"]

- id: alvarado-guatemala-1524
  year: 1524
  endYear: 1530
  title:
    ko: "알바라도의 과테말라 정복과 치아파스(1524~1530)"
  summary:
    ko: "페드로 데 알바라도는 코르테스의 부하로 멕시코 정복에 참여한 뒤 1523년 말 테노치티틀란을 떠나 약 400명의 스페인 병사와 틀락스칼라·촐룰라·멕시카 동맹군을 이끌고(출발 때 동맹군은 3백여 명이었고 진군 중 불어나 최대 2만 명에 이르렀다는 어림도 있다) 남쪽으로 내려갔다. 1524년 2월 12일 키체의 전사들이 좁은 길목에서 기습했으나 스페인 기병이 이를 물리쳤고, 2월 18일 올린테페케 전투에서 키체 군을 이겼다. 전승은 키체의 지도자 테쿤우만이 이 싸움에서 숨졌다고 전하나 스페인 쪽 기록은 다른 지도자들이 앞서 죽었다고 하며 장소도 확실하지 않다. 3월 알바라도는 키체의 도시 쿠마르카흐에서 초대받아 지도자들을 붙잡아 불태우고 도시도 불살랐다. 4월 14일 이식심체에서 카크치켈 지도자 벨레헤 카트와 카이 이목스는 키체와 추투힐에 맞서려고 스페인과 동맹을 맺었다. 알바라도는 1524년 7월 27일 이곳을 첫 수도 산티아고데로스카바예로스데과테말라로 선포했다. 동맹한 카크치켈의 이해는 키체·추투힐과의 오랜 경쟁에 있었으나 그들도 곧 공물과 노역에 시달렸다. 같은 해 8월 말 카크치켈이 도시를 떠나 스페인과 맞서 반란이 일어났고 1530년 5월 9일 그들이 항복할 때까지 계속되었다. 1527년 알바라도가 왕에게서 아델란타도(정복 총독) 칭호를 받아 돌아온 뒤 스페인 사람들은 알모롱가 골짜기(오늘날의 시우다드비에하 근처)에 수도를 옮겼다. 1528년 무렵 디에고 데 마사리에고스가 이끈 원정이 누에바에스파냐 왕국(1535년부터 누에바에스파냐 부왕령) 쪽에서 치아파스를 정복했다. 1530년 무렵 엘살바도르와 온두라스 내륙까지 원정이 이어져 과테말라 아우디엔시아(1543년 설치, 1609년부터 과테말라 총사령부) 땅이 되는 곳이 대부분 스페인의 지배 아래 놓였다."
  subjects: [guatemala-captaincy, new-spain-viceroyalty]
  links:
    - { from: spain, to: guatemala-captaincy, note: "1524년부터 알바라도가 과테말라를 정복해 1527년 새 도시를 세움" }
  tags: [war, politics]
  sources: ["Matthew Restall and Florine Asselbergs, Invading Guatemala: Spanish, Nahua, and Maya Accounts of the Conquest Wars (Pennsylvania State University Press, 2007)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: council-of-indies-1524
  year: 1524
  endYear: 1535
  title:
    ko: "인디아스 위원회와 누에바에스파냐 부왕령의 설치(1524~1535)"
  summary:
    ko: "스페인 왕 카를로스 1세는 1520년대에 갈수록 넓어지는 아메리카 땅을 직접 다스리기 위해 인디아스 위원회를 두었다(1523~1524년에 갖춰졌고 1524년 8월 1일을 정식 설치일로 드는 서술이 많다). 이 위원회는 왕을 도와 식민지 법과 관리 임명, 재판을 맡았고 의장은 가르시아 데 로아이사 추기경이었으며, 중요한 민사 사건은 아메리카의 아우디엔시아에서 이 위원회로 상소할 수 있었고 위원회는 1503년 세비야에 세운 통상원을 감독했다. 멕시코에서는 1521년 8월 13일부터 코르테스가 총독 구실을 했고 1524년 10월 12일 자리를 넘겼다. 그 뒤 알론소 데 에스트라다·로드리고 데 알보르노스·알론소 데 수아소, 이어 곤살로 데 살라사르와 페드로 알미데스 치리노 같은 관리가 번갈아 맡았고, 1526년 7월 루이스 폰세 데 레온이 부임했으나 며칠 만에 숨져 마르코스 데 아길라르(1526~1527)가 이었으며, 1527~1528년에는 에스트라다가 다시 맡았다. 1528년 12월 9일 첫 아우디엔시아가 통치를 맡았다. 이 아우디엔시아의 의장 누뇨 베르트란 데 구스만과 판사들은 원주민과 코르테스 일파를 학대한다는 비난을 받아 1531년 1월 10일 두 번째 아우디엔시아로 갈렸고, 이 아우디엔시아는 세바스티안 라미레스 데 푸엔레알과 바스코 데 키로가 같은 사람들이 이끌어 1535년 4월까지 나라를 안정시켰다. 1535년 4월 17일 안토니오 데 멘도사가 바르셀로나에서 첫 부왕으로 임명되어 같은 해 11월 14일 부임했고 1550년 11월 25일까지 다스렸다. 이때 누에바에스파냐 왕국이 누에바에스파냐 부왕령으로 이름만 바뀌었고 같은 땅이 이어졌다. 부왕은 왕을 대신하는 최고 관리였으며 부왕령은 아우디엔시아와 지방 관리를 이끌었다. 이 체제는 1542년 뒤 페루 부왕령에도 되풀이되었고, 아메리카의 스페인 식민지를 다스리는 기본 틀이 되었다."
  subjects: [new-spain-viceroyalty, spain]
  tags: [politics]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "J. H. Elliott, Empires of the Atlantic World: Britain and Spain in America 1492–1830 (Yale University Press, 2006)"]

- id: yucatan-montejo-1527
  year: 1527
  endYear: 1546
  title:
    ko: "몬테호 부자의 유카탄 정복(1527~1546)"
  summary:
    ko: "유카탄 반도는 마야 도시국가들이 여러 정치 단위로 나뉘어 있었고, 1517년 에르난데스 데 코르도바 이래 스페인 사람들이 해안을 살펴 왔다. 1527년 프란시스코 데 몬테호는 아델란타도(왕이 정복을 허가한 총독) 자격으로 스페인에서 작은 선단을 이끌고 와 동쪽 해안에 수비대를 두고 반도 북동부를 굴복시켰다. 1528년 그는 코닐에서 두 달 동안 버텼다. 1531년 스페인 사람들은 캄페체로 근거지를 옮겨 마야의 큰 공격을 물리치고 치첸이트사에도 도시를 세웠다. 그러나 1533년 중반 마야 사람들이 일어나 작은 스페인 수비대를 포위해 쫓아냈고, 1534년 말이나 1535년 초 스페인 사람들은 캄페체에서 베라크루스로 물러났다. 1535년 프란치스코회의 평화적 선교도 챔포톤에서 군사 활동이 되살아나면서 실패했다. 몬테호의 아들 프란시스코 데 몬테호 2세는 1540년대에 정복을 다시 이끌었고 사촌 프란시스코 데 몬테호(조카)가 합류했다. 1541~1542년 캄페체와 메리다에 첫 영구 시의회가 세워졌다. 메리다는 1542년 1월 6일 마야 도시 티호 자리에 세워졌다고 전한다. 마니의 투툴 시우 가문 같은 마야 지배자가 스페인과 동맹했고, 이는 정복의 중요한 요인이었다. 1546년 11월 동쪽 지방들이 동맹해 일으킨 반란은 이듬해 3월까지 이어진 싸움 끝에 진압되어 북쪽 반도의 정복이 사실상 끝났다. 이 일이 있은 뒤에도 남부 숲의 이차 왕국 등은 17세기까지 독립을 지켰다. 유카탄 지방은 누에바에스파냐 왕국(뒷날 누에바에스파냐 부왕령)의 관할 아래 놓였다(유카탄 총사령부는 「유카탄 총사령부의 분리와 소노라 선교(1614~1617)」(뒤의 사건))."
  subjects: [new-spain-viceroyalty]
  tags: [war, politics]
  sources: ["Inga Clendinnen, Ambivalent Conquests: Maya and Spaniard in Yucatan, 1517–1570 (Cambridge University Press, 1987)", "Matthew Restall, The Maya World: Yucatec Culture and Society, 1550–1850 (Stanford University Press, 1997)"]

- id: nuno-guzman-1529
  year: 1529
  endYear: 1531
  title:
    ko: "누뇨 데 구스만의 서부 원정과 타라스코 왕국의 끝(1529~1531)"
  summary:
    ko: "타라스코 왕국은 오늘날 미초아칸의 파츠쿠아로 호수 둘레에서 친춘찬을 수도로 삼았고, 아즈텍 삼각 동맹의 팽창을 막아 낸 나라였다. 타라스코는 구리와 청동 금속 기술, 깃털 공예로 이름났고 아즈텍 군대를 여러 번 물리쳤다고 전한다. 아즈텍이 무너진 뒤 타라스코의 왕 탕가시안 2세(친치차)는 1522년 코르테스의 부하 크리스토발 데 올리드의 군대 앞에서 스페인에 복종을 약속했고 세례를 받아 프란시스코라는 이름을 얻었다고 전한다. 1528년 12월 첫 아우디엔시아의 의장이 된 누뇨 베르트란 데 구스만은 1529년 12월 21일 스페인 군인 300~400명과 나우아 동맹군 5천~8천 명을 이끌고 서쪽으로 떠났다. 그는 탕가시안 2세에게서 금과 은을 빼앗으려 했고, 1530년 2월 14일 왕을 말에 끌고 가 고문한 뒤 산 채로 불태웠다. 이 일로 타라스코 왕국은 무너졌다. 구스만이 얻은 서쪽 땅은 1531년 1월 25일 왕의 칙령으로 누에바갈리시아라는 이름을 받았고, 그해 9월 29일 산미겔데쿨리아칸이 세워졌다. 과달라하라는 1531년 크리스토발 데 오냐테가 처음 세웠고 1533년 5월 24일 토날라로 옮겼다. 원정은 학살과 원주민 노예화로 두 아우디엔시아의 판사들과 프란치스코회 수사들에게서 비난을 받았다. 그가 이끈 첫 아우디엔시아는 1531년 1월 10일 두 번째 아우디엔시아로 대체되었고, 바스코 데 키로가는 판사로 타라스코 사람들을 보호하며 병원 마을을 세웠다. 구스만은 1533~1534년에 총독 자리에서 쫓겨나 1536~1537년 스페인으로 불려가 반역으로 고소되었다. 누에바에스파냐 왕국(1535년부터 누에바에스파냐 부왕령)의 땅은 이 서부 원정으로 서쪽 바다 가까이 넓어졌다."
  subjects: [tarascan, new-spain-viceroyalty]
  links:
    - { from: new-spain-viceroyalty, to: tarascan, note: "1530년 2월 탕가시안 2세를 처형하고 타라스코 왕국을 무너뜨림" }
  tags: [war, politics]
  sources: ["J. Benedict Warren, The Conquest of Michoacán: The Spanish Domination of the Tarascan Kingdom in Western Mexico, 1521–1530 (University of Oklahoma Press, 1985)", "Hugh Thomas, Conquest: Montezuma, Cortés, and the Fall of Old Mexico (Simon & Schuster, 1993)"]

- id: inca-conquest-1529
  year: 1529
  endYear: 1533
  title:
    ko: "톨레도 협약에서 쿠스코 입성까지: 피사로의 잉카 정복(1529~1533)"
  summary:
    ko: "잉카 제국은 쿠스코를 중심으로 안데스를 따라 도로망으로 이어진 나라였고, 그 왕 우아이나 카팍이 1528년 무렵 숨지자 아들 우아스카르와 아타우알파 사이에 내전이 일어났다. 1529년 7월 프란시스코 피사로는 스페인 왕실과 톨레도 협약을 맺고 페루 정복의 권리와 누에바카스티야 총독부(1542년부터 페루 부왕령)의 총독 자리를 얻었다. 그는 1531년 파나마를 떠나 세 번째 원정에 나서 1532년 산미겔데피우라를 세우고 내륙으로 올라갔다. 아타우알파의 장군들이 우아스카르를 사로잡아 내전은 아타우알파의 승리로 기울었고, 그는 카하마르카에 머물고 있었다. 1532년 11월 16일 피사로는 병사 168명(보병 106명, 기병 62명)으로 광장에 모인 비무장 수행원 수천 명 사이에서 아타우알파를 사로잡았고 약 2천 명이 숨졌으나 스페인 쪽은 한 명이 다쳤을 뿐이라고 전한다. 아타우알파는 방 하나를 금으로, 두 배를 은으로 채우겠다고 몸값을 약속했고 1532년 12월 20일부터 1533년 5월 3일까지 보물이 모였으나 피사로는 풀어 주지 않았다. 아타우알파는 우아스카르를 죽이게 한 뒤 1533년 7월 26일 교살형에 처해졌다(8월 29일로 적는 서술도 있다). 피사로는 아타우알파의 형제 투팍 우알파를 허수아비 왕으로 세웠으나 그가 곧 죽자 1533년 만 열일곱 살쯤의 망코 잉카를 세웠다. 1533년 11월 15일 스페인군은 잉카의 수도 쿠스코에 들어갔고 잉카 제국의 중심이 무너졌다. 이 정복은 스페인 병사와 반(反)쿠스코 원주민 집단과 전염병이 함께 만든 결과였고, 피사로 형제 에르난도·곤살로·후안과 동료 디에고 데 알마그로도 함께했다."
  subjects: [inca, peru-viceroyalty, spain]
  links:
    - { from: spain, to: inca, note: "1532년 카하마르카에서 아타우알파를 사로잡고 1533년 쿠스코에 입성해 잉카 제국을 무너뜨림" }
  tags: [war, politics]
  sources: ["John Hemming, The Conquest of the Incas (Harcourt Brace Jovanovich, 1970)", "Matthew Restall, Seven Myths of the Spanish Conquest (Oxford University Press, 2003)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]
  places: [{ name: 카하마르카 전투, at: [-78.51, -7.16], year: 1532 }]

- id: brazil-captaincies-1534
  year: 1534
  endYear: 1548
  title:
    ko: "브라질의 세습 카피타니아(1534~1548)"
  summary:
    ko: "카브랄이 닿은 뒤 포르투갈은 해안에서 브라질나무를 실어 가는 데 그쳤으나 프랑스 상선이 들어오자 영구 정착의 필요가 커졌다. 마르팀 아폰수 드 소자는 1530년 원정을 이끌어 1532년 상비센트에 첫 영구 정착지를 세웠다. 왕 주앙 3세는 식민 사업의 돈과 위험을 개인 귀족과 관리에게 넘겨 1534년 9월 24일 페르남부쿠를 시작으로 해안선을 가로로 나눈 땅을 대물림하는 영지로 주었다. 이 방식은 마데이라·아소르스 제도에서 쓰인 포르투갈의 식민 방식을 본뜬 것이었다. 이 영지는 카피타니아라 불렸고 원래 15개를 12명의 도나타리오(받은 사람)에게 나누어 주었다. 영주는 땅을 나누어 주고 도시를 세우고 사법과 세금에 대해 권한을 가졌다. 그러나 대부분은 자금이 모자라고 왕실의 도움도 적었으며, 네 영주는 땅을 차지하지도 못했고 네 곳은 원주민(투피 계열)의 반격으로 곧 무너졌다. 성공한 곳은 사탕수수 재배가 자리 잡은 페르남부쿠(영주 두아르트 코엘류, 올린다 1535년 무렵 건설)와 상비센트 정도였다. 1549년 이후까지 이어진 곳은 상비센트와 페르남부쿠, 일레우스, 포르투세구루 네 곳뿐이다. 1548년 바이아의 영주 프란시스쿠 페레이라 쿠티뉴가 정착민과 함께 투피남바 사람들의 공격으로 죽자 바이아는 왕실로 돌아왔다. 이 실패 뒤 왕은 총독을 보내기로 했다(「토메 드 소자의 총독부와 사우바도르, 예수회의 상파울루(1549~1554)」(뒤의 사건)). 이 영지 가운데 개인이 쥔 마지막 카피타니아는 1754년에야 왕실로 돌아갔다. 영지 제도는 이 땅의 사탕수수와 원주민 노예, 뒷날의 아프리카인 노예 노동의 바탕이 되었다."
  subjects: [portugal]
  tags: [politics, economy]
  sources: ["Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society: Bahia, 1550–1835 (Cambridge University Press, 1985)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: cartier-1534
  year: 1534
  endYear: 1542
  title:
    ko: "자크 카르티에의 세인트로렌스강 탐사(1534~1542)"
  summary:
    ko: "생말로 출신 항해가 자크 카르티에는 프랑스 왕 프랑수아 1세의 명령으로 서쪽 길로 아시아에 닿는 방법을 찾으러 1534년 4월 20일 생말로를 떠났다. 그는 뉴펀들랜드와 세인트로렌스만 해안을 살폈고 7월 24일 가스페만에 10미터가량의 십자가를 세워 프랑스 왕의 땅이라고 선언했다. 그곳에 있던 이로쿼이 계열 지도자 도나코나의 두 아들을 데리고 9월에 돌아갔다. 1535년 5월 19일 배 세 척과 110명을 이끌고 다시 출발한 카르티에는 도나코나의 아들들이 안내하는 대로 세인트로렌스강을 거슬러 올라 스타다코나(오늘날 퀘벡 자리)에 이르렀고, 10월 2일 오셸라가(오늘날 몬트리올 자리)에 닿았다. 그들이 마을을 가리켜 쓴 말 '카나타'를 카르티에가 지역 이름으로 받아 적은 것이 '캐나다'의 기원이라고 한다. 겨울에 배가 얼음에 갇혔고 괴혈병으로 위기에 빠졌으나 원주민이 일러 준 나무껍질 달인 물 덕에 110명 가운데 85명이 살아남았다. 1536년 5월 초 카르티에는 도나코나를 비롯한 원주민 몇 명을 붙잡아 7월 16일 생말로로 돌아갔다. 1541년 5월 23일 세 번째 항해에서는 장 프랑수아 드 라로크 드 로베르발이 총독 겸 부사령관이 되어 식민지 건설을 맡았고 카르티에는 항해 지휘를 맡았다. 카르티에는 오늘날 캡루주에 샤를부르루아얄을 세웠으나 겨울에 이로쿼이와의 충돌로 약 35명이 숨졌다고 전한다. 카르티에는 1542년 6월 로베르발의 지시를 어기고 돌아갔고, 로베르발은 1543년 이 정착지를 버렸다. 프랑스의 지속적인 정착은 1608년의 퀘벡 건설까지 기다려야 했다(「샹플랭의 퀘벡 건설(1608~1615)」(뒤의 사건))."
  subjects: [france]
  tags: [politics, society]
  sources: ["Marcel Trudel, Histoire de la Nouvelle-France, vol. 1 (Fides, 1963)", "Alan Taylor, American Colonies: The Settling of North America (Viking, 2001)", "Samuel Eliot Morison, The European Discovery of America: The Northern Voyages (Oxford University Press, 1971)"]

- id: buenos-aires-1536
  year: 1536
  endYear: 1541
  title:
    ko: "멘도사의 부에노스아이레스 첫 건설과 아순시온(1536~1541)"
  summary:
    ko: "페드로 데 멘도사는 카를로스 1세(곧 카를 5세)의 궁정에서 일했고 1527년 로마 약탈에도 참여한 스페인 군인으로, 1534년 라플라타강 일대의 아델란타도(정복을 허가받은 총독)가 되어 큰 선단과 많은 사람을 약속받았다. 선단은 폭풍으로 흩어졌으나 1535년 라플라타강 하구에 닿았고, 1536년 2월 2일 멘도사는 강 서안에 '누에스트라세뇨라산타마리아델부엔아이레'(좋은 바람의 성모 산타마리아)라는 도시를 세웠다. 이곳이 뒷날의 부에노스아이레스이다. 라플라타(은의 강)라는 이름은 이 강 유역에서 은을 얻으리라는 기대에서 나왔고, 1526~1530년 세바스티안 카보토가 먼저 탐사해 산크티스피리투스 요새를 세웠으나 곧 버려졌다. 정착지는 곧 식량이 모자라 굶주림에 시달렸고 케란디 사람들의 거듭된 공격으로 마을이 여러 번 불탔다. 병이 깊어진 멘도사는 후안 데 아욜라스를 총사령관으로 삼은 뒤 스페인으로 돌아가다 1537년 6월 23일 바다에서 죽었다. 아욜라스 일행은 파라나강과 파라과이강을 거슬러 올라가 과라니 사람들의 땅에 닿았고, 1537년 파라과이강 가에 아순시온이 세워졌다(세운 사람은 후안 데 살라사르 또는 아욜라스로 자료마다 갈린다). 과라니 사람들은 스페인 사람과 동맹해 식량을 대고 여자를 맞아들이는 관계를 맺었는데, 이 관계가 아순시온의 터전을 안정시켰다. 1541년 정착민은 부에노스아이레스를 버리고 아순시온으로 옮겼다. 부에노스아이레스는 1580년 후안 데 가라이가 다시 세웠다. 이 일은 스페인이 대서양 쪽에서 라플라타강을 따라 내륙으로 들어가는 길을 먼저 연 것이었고, 은이 나는 페루를 바다 쪽에서 닿는 길을 찾는 것이 큰 목표였다. 아순시온은 그 뒤 라플라타 지역 스페인 사람들의 근거지가 되었다."
  subjects: [spain]
  tags: [politics, society]
  sources: ["The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)", "David Rock, Argentina 1516–1987 (University of California Press, 1985)"]

- id: manco-inca-1536
  year: 1536
  endYear: 1538
  title:
    ko: "망코 잉카 유팡키의 봉기와 신잉카국, 라스살리나스 전투(1536~1538)"
  summary:
    ko: "망코 잉카 유팡키는 1515년 무렵 쿠스코에서 태어난 우아이나 카팍의 아들이자 우아스카르의 동생으로, 1533년 11월 피사로에게 세워져 잉카 황제 자리에 올랐으나 누에바카스티야 총독부(1542년부터 페루 부왕령)를 다스리는 피사로 형제의 학대와 약탈 앞에서 스페인 사람을 구원자로 본 처음의 생각을 버렸다. 1535년 한 번 도망쳤다 붙잡혔다가 다시 탈출했다. 1536년 초 디에고 데 알마그로가 1535년부터 칠레 원정(큰 소득 없이 1537년 끝남)에 나가 비운 사이 망코는 쿠스코를 포위했고, 이 포위는 약 열 달 계속되었다. 병사 수는 수만에서 20만 명으로 자료마다 갈린다. 쿠스코 위의 삭사이와만 성채를 둘러싼 싸움에서 후안 피사로가 죽었으나 스페인 쪽은 버텼다. 1537년 1월 망코는 오얀타이탐보를 지키다 비트코스를 거쳐 빌카밤바로 물러나 신잉카국을 세웠고 이 나라는 1572년까지 이어졌다. 같은 해 쿠스코에서는 스페인의 꼭두각시 파울류 잉카가 황제로 세워졌다. 칠레 원정에서 돌아온 알마그로는 1537년 4월 쿠스코를 차지하고 에르난도·곤살로 피사로를 가두었다. 1538년 4월 6일 라스살리나스 전투에서 에르난도 피사로가 이끈 쪽이 알마그로를 이겼고 알마그로는 그해 7월 8일 처형되었다. 이 싸움 뒤 피사로 쪽 군대는 남쪽의 콜랴오와 차르카스로 나아가 오늘날 볼리비아 서쪽을 스페인의 지배 아래 두었다. 망코는 1539년 아내이자 누이 쿠라 오클로가 스페인 사람들에게 살해되는 아픔을 겪었고, 1544년 비트코스에서 알마그로파 피난민에게 살해되었다. 신잉카국은 그 아들 사이리 투팍이 이었다(「포토시 은광과 톨레도 부왕의 개혁, 빌카밤바 함락(1545~1575)」(뒤의 사건))."
  subjects: [neo-inca-state, peru-viceroyalty]
  tags: [war, politics]
  sources: ["John Hemming, The Conquest of the Incas (Harcourt Brace Jovanovich, 1970)", "Kim MacQuarrie, The Last Days of the Incas (Simon & Schuster, 2007)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: muisca-conquest-1537
  year: 1537
  endYear: 1540
  title:
    ko: "히메네스 데 케사다의 무이스카 정복과 산타페데보고타(1537~1540)"
  summary:
    ko: "무이스카 연맹은 콜롬비아 동부 안데스 고원에서 옥수수와 감자를 키우고 소금과 에메랄드, 금 공예로 이름난 사람들이 이룬 연맹으로, 남쪽의 시파(바카타를 다스림)와 북쪽의 사케(훈사를 다스림)가 중심이었고 그 아래에 지방 족장들이 있었다. 소금과 면직물 교환도 중요했다. 1536년 곤살로 히메네스 데 케사다는 카리브 해안의 산타마르타에서 마그달레나강을 거슬러 올라 고원으로 가는 원정대를 이끌었다. 이 원정대는 출발할 때 800~900명이었으나 고원에 닿았을 때 180명 안팎만 남았다고 전한다. 1537년 3월 이들은 고원의 가장자리 치파타에 닿았고, 소금과 에메랄드를 얻으며 올라갔다. 4월 보고타 평원에서 남쪽 시파 티스케수사의 군대를 꺾었고 시파는 이 무렵 숨졌다고 전한다. 8월 20일 북쪽 훈사에서 사케 케무엔차토차를 붙잡았다. 금과 에메랄드를 빼앗는 약탈로 고원 마을들이 큰 고통을 겪었다고 전한다. 케사다는 1538년 8월 6일 바카타 근처에 산타페데보고타를 세웠다. 이 이름은 고향 그라나다 가까운 산타페에서 따온 것이다. 1538년 말 독일 출신 니콜라우스 페데르만이 베네수엘라에서, 세바스티안 데 벨랄카사르가 페루 쪽 키토에서 고원에 닿아 세 원정대가 한 곳에서 만났다. 1539년 7월 케사다는 페데르만과 함께 카르타헤나에서 스페인으로 떠났고, 무이스카의 마지막 사케 아키민사케는 1540년 처형되어 무이스카 연맹의 정치 체제는 끝났다. 정복자들은 과타비타 호수의 금 의식 이야기를 따라 '엘도라도'(금빛 사람)를 찾아 헤맸으며 케사다도 1569년부터 1572년까지 동쪽 평원을 뒤졌으나 얻은 것은 없었다. 산타페데보고타는 뒷날 누에바그라나다의 중심이 되었다."
  subjects: [muisca, spain]
  tags: [war, politics]
  sources: ["Juan Friede, Descubrimiento y conquista del Nuevo Reino de Granada (Banco de la República, 1960)", "The Cambridge History of Latin America, vol. 1 (Cambridge University Press, 1984)"]

- id: de-soto-1539
  year: 1539
  endYear: 1543
  title:
    ko: "데 소토와 코로나도의 북아메리카 내륙 원정(1539~1543)"
  summary:
    ko: "북아메리카 내륙은 1539년에도 스페인 사람에게 낯선 땅이었다. 에르난도 데 소토는 쿠바 총독을 지낸 뒤 플로리다를 정복하는 허가를 얻어 1539년 5월 플로리다 서안(탬파만 일대라는 견해가 많으나 샬럿 하버라는 견해도 있다)에 배 아홉 척과 620명 이상, 말 200여 필을 이끌고 상륙했다. 이들은 아팔라치 사람들의 도시 안하이카에서 1539~1540년 겨울을 났고, 조지아·캐롤라이나·앨라배마를 지나며 미시시피 문화의 족장 사회를 만났다. 1540년 10월 18일 마빌라에서 벌어진 싸움에서 스페인 쪽은 20명 안팎에서 200명까지(자료마다 크게 갈린다) 죽고 150명 안팎이 다쳤으며, 원주민은 2,000~6,000명이 죽었다고 추산한다. 1541년 5월 8일 일행은 미시시피강에 닿았고 한 달가량 평저선을 만든 뒤 강을 건넜다. 데 소토는 1542년 5월 21일 열병으로 구아초야 마을에서 죽었고, 루이스 데 모스코소가 남은 사람들을 이끌어 1543년 파누코강에 닿았다. 살아남은 사람은 300~350명(흔히 311명)이다. 한편 누에바에스파냐 부왕령의 초대 부왕 안토니오 데 멘도사는 프란시스코 바스케스 데 코로나도를 보내 1540년 2월 23일 콤포스텔라를 떠나게 했는데, 여기에는 유럽 군인 약 400명과 멕시코 원주민 동맹군 1,300~2,000명이 따랐다. 일행은 시볼라의 주니 마을들에서 싸웠고, 1540~1541년 겨울 리오그란데의 푸에블로 사람들과 티구에스 전쟁을 치렀으며, 1541년 7월 29일 퀴비라(오늘날 캔자스)에 닿았으나 금은 없었다. 1542년 4월 돌아선 코로나도는 빈털터리가 되었고, 두 원정 모두 스페인의 북아메리카 내륙 지배로 이어지지 못했다. 플로리다 정착은 1565년에야 시작된다."
  subjects: [spanish-florida, new-spain-viceroyalty]
  tags: [war, society]
  sources: ["Charles Hudson, Knights of Spain, Warriors of the Sun: Hernando de Soto and the South's Ancient Chiefdoms (University of Georgia Press, 1997)", "David J. Weber, The Spanish Frontier in North America (Yale University Press, 1992)", "Richard Flint, No Settlement, No Conquest: A History of the Coronado Entrada (University of New Mexico Press, 2008)"]
