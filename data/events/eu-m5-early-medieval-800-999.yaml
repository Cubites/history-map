- id: basil-samuel-976
  year: 976
  endYear: 997
  title:
    ko: "바실리오스 2세의 즉위(976)와 사무일의 불가리아: 트라야누스 관문(986)에서 스페르케이오스(997)까지"
  summary:
    ko: "동로마 제국의 요안니스 1세 치미스키스가 976년 1월 죽자 어린 바실리오스 2세(재위 976~1025)가 동생 콘스탄티노스 8세와 함께 공동 황제가 되었고, 실권은 환관 바실리오스 레카페노스가 쥐었다. 아나톨리아의 바르다스 스클레로스가 976년 반란을 일으켰으나 979년 다비트 3세(타오-클라르제티)의 이베리아 기병의 도움으로 눌렸다. 987년 바르다스 포카스가 일어나자 바실리오스는 키예프 루스의 블라디미르에게 군사를 청해(6천 명, 바랑기아 근위대의 시작) 989년 4월 아비도스에서 포카스가 죽은 뒤 스클레로스가 반란을 이어받았다가 곧 굴복하며 반란이 끝났다. 불가리아 제1제국은 971년 동부를 잃은 뒤 970년대에 코메토풀로이(서불가리아 총독 니콜라스의 네 아들 다비트·모세·아론·사무일)의 봉기를 맞았다(연대는 970년부터 976년까지 갈린다). 형제들이 차례로 죽은 뒤(아론은 사무일에게 죽었고 그 해는 976년 또는 987~988년으로 갈린다) 사무일이 실권을 쥐었고(명목상 황제는 페타르 1세의 아들 로만, 재위 977~997) 오흐리드와 프레스파를 중심으로 라리사와 테살리아를 차지했다(라리사 함락은 986년설이 많고 지도는 986년). 986년 8월 바실리오스가 세르디카를 포위하다 돌아가는 길에 트라야누스 관문에서 매복에 당해 크게 졌다. 사무일은 로만이 죽은 997년 차르를 칭했고 두클랴 같은 남슬라브 공국들을 복속시켰다(997~998). 라리사와 코린토스를 위협하며 남쪽으로 내려온 사무일은 997년 7월 스페르케이오스강에서 니케포로스 우라노스의 기습에 져 군대를 거의 잃고 달아났다(지도는 997년부터 테살리아를 다시 동로마 땅으로 그린다). 바실리오스는 1014년 클레이디온에서 이 싸움을 끝낸다(뒤의 사건)."
