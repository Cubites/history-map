- id: otto-i-empire-936
  year: 936
  endYear: 973
  title:
    ko: "오토 1세: 레히펠트(955)와 황제 대관(962)"
  summary:
    ko: "936년 8월 아헨에서 오토 1세(재위 936~973)가 왕으로 대관했다(같은 해 한반도에서는 고려가 후삼국을 통일했다, `unification-936`). 937~941년 공작들과 동생 하인리히의 반란을 눌렀고, 변경백 게로(동쪽)와 헤르만 빌룽(북쪽)에게 서슬라브 부족과 맞댄 변경을 맡겼다. 게로는 939년 슬라브 족장 서른 명을 잔치에서 죽였다고 비두킨트는 전한다. 948년 하벨베르크와 브란덴부르크 주교구를 세웠고 950년 보헤미아 공 볼레슬라프 1세를 복종시켰다. 951년 이탈리아 왕 로타르 2세의 미망인 아델라이데의 청으로 이탈리아에 들어가 그와 혼인하고 롬바르드 왕을 칭했으며, 952년 아우크스부르크 회의에서 베렌가리오 2세를 봉신으로 삼고 베로나와 아퀼레이아를 바이에른에 붙였다(지도는 952년). 953~954년 아들 리우돌프와 사위 콘라트의 반란 속에 마자르가 독일 깊이 들어왔고, 955년 8월 10일 아우크스부르크 가까운 레히펠트에서 오토는 마자르를 크게 이겼다. 같은 해 보헤미아의 볼레슬라프 1세는 모라비아·슐레지엔·크라쿠프를 얻은 것으로 지도에 그렸다(근거가 갈림, 지도는 955년). 959년 동생 브루노가 로타링기아를 상·하로렌으로 나눴다(지도는 959년 로렌 공국). 961~962년 교황 요한 12세가 베렌가리오 2세에 맞설 도움을 청하자 이탈리아로 가 962년 2월 2일 로마에서 황제로 대관했고, 교황령을 보장하는 오토 특허장(2월 13일)을 내렸다(지도는 962년에 동프랑크를 신성 로마 제국으로, 이탈리아 왕국을 이탈리아 소국들로 바꾼다). 963년 요한 12세를 폐위했고 게로가 라우지츠를 얻었다(지도는 965년). 968년 마그데부르크 대주교구를 세웠으며, 972년 아들 오토 2세가 동로마 황제 요안니스 1세 치미스키스의 조카딸 테오파누와 혼인했다. 오토는 973년 5월 죽었다."
