- id: volga-route-870
  year: 870
  endYear: 922
  title:
    ko: "볼가 교역로와 루스 상인: 이븐 후르다드베의 『도로와 왕국 총람』에서 이븐 파들란(922)까지"
  summary:
    ko: "9세기 중엽 이후 스칸디나비아에서 라도가와 볼가강을 따라 이어진 교역로로 루스(바랴그, 882년 뒤에는 키예프 루스) 상인이 모피와 노예를 싣고 하자르 칸국의 이틸과 카스피해를 거쳐 바그다드까지 갔다. 바그다드의 관리 이븐 후르다드베의 『도로와 왕국 총람』(초판은 846년에서 870년 무렵 사이로 연대가 갈리고 885년 무렵 고쳐 씀)은 '슬라브의 한 갈래'인 루스 상인이 비버 가죽과 검은 여우 가죽을 가지고 동로마 제국 황제에게 십일세를 내고 팔거나, 하자르 통치자에게 십일세를 내고 이틸을 지나 카스피해로 간다고 적었다. 같은 책은 중국 동쪽 끝에 알실라(신라)가 있다고 적어, 금이 많고 공기가 좋아 이곳에 간 무슬림이 눌러산다고 했다. 9세기 중엽 신라에서는 장보고의 청해진(`cheonghaejin-828`)이 당·일본과의 바닷길 무역을 이끌다 846년 그가 피살되었다(`jang-bogo-846`). 스웨덴 고틀란드와 러시아·발트 일대의 보물 더미에서 나온 많은 아랍 은화(디르함)가 이 교역의 규모를 보여 준다. 921년 칼리프 알무크타디르의 사절 이븐 파들란은 볼가강 중류의 불가르인에게 가서 922년 5월 알무시 왕을 만났다. 알무시는 하자르에 공물을 바치다 칼리프의 보호를 청해 이슬람을 받아들였고(볼가 불가리아, 지도는 922년), 이븐 파들란은 볼가강에서 본 루스 상인의 모습과, 족장의 배 장례에서 노예 소녀를 죽이는 의식을 자세히 적었다. 루스 상인은 모피·꿀·밀랍과 함께 동슬라브 부족과 핀우그르 부족 사람을 잡아 노예로 팔았다."
  subjects: [rurikid-rus, kievan-rus, khazar-khaganate, volga-bulgaria, east-slavic-tribes, finnic-tribes, byzantine-empire, silla]
  links:
    - { from: kievan-rus, to: khazar-khaganate, note: "이틸의 십일세와 카스피해 교역" }
    - { from: volga-bulgaria, to: khazar-khaganate, note: "공납과 칼리프의 보호 요청(922)" }
  tags: [economy, society]
  sources: ["Paul Lunde·Caroline Stone 옮김, Ibn Fadlan and the Land of Darkness: Arab Travellers in the Far North (2012)", "Simon Franklin·Jonathan Shepard, The Emergence of Rus, 750–1200 (1996)", "Thomas S. Noonan, Why Dirhams First Reached Russia: The Role of Arab-Khazar Relations in the Development of the Earliest Islamic Trade with Eastern Europe (Archivum Eurasiae Medii Aevi 4, 1984)", "Ibn Khurdadhbih, Kitab al-Masalik wa'l-Mamalik (M. J. de Goeje 엮음, 1889)"]

- id: bohemia-premyslids-870
  year: 870
  endYear: 995
  title:
    ko: "보헤미아 공국: 보르지보이 1세(870 무렵)에서 슬라브니크 가문의 몰락(995)까지"
  summary:
    ko: "프르제미슬 가문의 보르지보이 1세는 870년 무렵 보헤미아를 다스리기 시작해 875~880년 무렵 프라하 성으로 근거를 옮겼고(지도는 870년부터 서슬라브 부족의 땅에서 보헤미아 공국을 떼어 그린다), 죽을 때까지(888~890년 무렵) 대모라비아의 스바토플루크의 신하였다(890년 아르눌프도 보헤미아를 스바토플루크 몫으로 인정했다). 아들 슈피티흐녜프 1세(재위 894~915)가 895년 레겐스부르크에서 동프랑크의 아르눌프에게 신서했고, 동생 브라티슬라프 1세(재위 915~921)가 이었다. 그 아들 바츨라프(재위 921~935 무렵)는 929년 무렵 하인리히 1세에게 공물을 약속했고, 동생 볼레슬라프 1세(재위 935~972)에게 살해되었다(바츨라프는 곧 성인으로 기려져 체코의 수호성인이 되었다). 볼레슬라프 1세는 오토 1세와 싸우다 950년 복종했고 955년 레히펠트에서 마자르를 상대로 오토 편에 섰으며, 그 뒤 모라비아·슐레지엔·크라쿠프를 얻은 것으로 지도에 그렸다(근거가 갈림, 지도는 955년). 이브라힘 이븐 야쿠브는 965년 무렵 프라하를 노예·주석·모피의 큰 시장으로 적었다. 973년 프라하에 주교구가 서 신성 로마 제국의 마인츠 대주교구에 속했다. 볼레슬라프 2세(재위 972~999)는 976년 바이에른의 하인리히 2세를 편들었고, 990년 폴란드의 미에슈코 1세와 슐레지엔을 두고 다투다 슐레지엔 서부를 폴란드에 넘겼다(985년 무렵부터라는 설도 있고, 지도는 990년). 995년 9월 프르제미슬 가문은 경쟁 가문인 슬라브니크 가문의 근거지 리비체를 습격해 프라하 주교 아달베르트의 형제들을 죽였다. 아달베르트는 997년 프로이센에서 순교했다. 999년 볼레스와프 1세 용감공이 크라쿠프와 모라비아를 차지했다(지도는 999년, 뒤의 사건)."
  subjects: [bohemia-duchy, great-moravia, east-francia, holy-roman-empire, magyars, piast-poland, slavic-tribes]
