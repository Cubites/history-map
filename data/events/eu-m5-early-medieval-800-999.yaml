- id: great-moravia-833
  year: 833
  endYear: 907
  title:
    ko: "대모라비아: 모이미르 1세(833)에서 프레스부르크 전투(907)까지, 키릴로스와 메토디오스(863)"
  summary:
    ko: "모이미르 1세는 833년 니트라의 프리비나를 쫓아내고 모라비아와 니트라를 합쳐 서슬라브 부족의 큰 나라 대모라비아의 바탕을 이루었다(지도는 833년). 846년 독일인 루트비히가 그를 몰아내고 조카 라스티슬라프(재위 846~870)를 세웠으나, 라스티슬라프는 동프랑크의 간섭에서 벗어나려 862년 동로마 황제 미카엘 3세에게 슬라브어로 가르칠 사람을 청했다. 863년 테살로니키의 콘스탄티노스(키릴로스)와 메토디오스 형제가 글라골 문자와 슬라브어 전례를 가지고 왔고(콘스탄티노스는 그에 앞서 860~861년 하자르 칸국에 사절로 갔다), 869년 키릴로스가 로마에서 죽은 뒤 메토디오스는 대주교가 되었으나 바이에른 주교들에게 870~873년 갇혔다. 870년 라스티슬라프는 조카 스바토플루크의 배신으로 동프랑크에 사로잡혔다(눈이 멀었다고 전한다). 스바토플루크 1세(재위 870~894)는 874년 포르히하임 화약으로 공물을 바친다는 조건 아래 사실상 독립을 지키고 보헤미아(보르지보이 1세, 지도는 870년부터 보헤미아 공국)·비슬라니에·판노니아까지 넓혔으며(884년 툴른 부근에서 카를 3세 비만왕과 만나 신서했고, 지도는 884년에 판노니아를 대모라비아 땅으로 옮긴다), 885년 메토디오스가 죽고 교황 스테파노 5세가 슬라브어 전례를 금하자 제자들은 쫓겨나 불가리아 제1제국으로 갔다. 894년 스바토플루크가 죽은 뒤 아들들이 다투었고, 아르눌프가 끌어들인 마자르가 침입해 902~906년 대모라비아를 무너뜨렸다. 907년 7월 4~6일 프레스부르크 전투에서 마자르가 바이에른군을 크게 이겼다(싸움터는 브라티슬라바설과 잘라바르설이 갈리고, 지도는 907년). 도읍의 위치와 영역은 고고학과 사료로 논쟁 중이다."
  subjects: [great-moravia, east-francia, bohemia-duchy, slavic-tribes, byzantine-empire, papal-states, magyars, first-bulgarian-empire, khazar-khaganate]
