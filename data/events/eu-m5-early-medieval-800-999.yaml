- id: photios-macedonian-843
  year: 843
  endYear: 886
  title:
    ko: "성상 파괴의 끝(843)에서 포티오스 분열과 마케도니아 왕조(867), 남이탈리아의 회복(886)까지"
  summary:
    ko: "843년 3월 섭정 테오도라가 성상 공경을 되살려 두 차례(726~787, 815~843)에 걸친 성상 파괴 논쟁을 끝냈다(정교회가 '정교의 승리'로 기리는 날이다). 855~856년 미카엘 3세와 삼촌 바르다스가 실권을 잡았고, 858년 총대주교 이그나티오스가 밀려난 자리에 평신도 학자 포티오스가 올랐다. 교황 니콜라우스 1세는 이를 인정하지 않았고 불가리아 제1제국의 교구를 두고 로마와 콘스탄티노폴리스가 다투면서(864년 보리스 1세의 개종) 갈등이 커져, 867년 포티오스는 '필리오케'를 비판하며 교황을 단죄했다. 같은 해 9월 바실리오스(1세)가 미카엘 3세를 죽이고 황제가 되어 마케도니아 왕조(867~1056)를 열었다. 그는 이그나티오스를 복위시켰다가 877년 포티오스를 다시 세웠고 879~880년 공의회에서 서방과 화해했다(이 분열은 1054년 동서 교회 분열과 다른 일이다). 바실리오스 1세가 886년 죽고 아들 레온 6세(재위 886~912)가 이어 포티오스를 다시 물러나게 했다. 860년 6월에는 루스의 배들이 콘스탄티노폴리스를 습격했다고 포티오스가 설교에서 전한다. 남이탈리아에서는 바실리오스가 이탈리아 왕국의 루도비코 2세와 손잡았고 루도비코가 바리를 함락했으나(871) 시칠리아의 시라쿠사를 잃었다(878). 그 뒤 동로마 장군들이 876년 바리, 880년 타란토, 885~886년 칼라브리아와 루카니아를 되찾았다(지도는 877·880·886년 버전). 이 지역의 롬바르드·캄파니아 공국들은 동로마와 시칠리아 토후국 사이에서 움직였다."
  subjects: [byzantine-empire, papal-states, first-bulgarian-empire, lombard-principalities, sicily-emirate, italy-carolingian]
  links:
    - { from: papal-states, to: byzantine-empire, note: "포티오스 분열(867)" }
    - { from: byzantine-empire, to: lombard-principalities, note: "바리(876)·타란토(880)·칼라브리아(886) 회복" }
  tags: [politics, culture]
  sources: ["게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)", "Francis Dvornik, The Photian Schism: History and Legend (1948)", "Warren Treadgold, A History of the Byzantine State and Society (1997)", "Jonathan Shepard 엮음, The Cambridge History of the Byzantine Empire, c. 500–1492 (2008)"]
  places: [{ name: 타란토, at: [17.24, 40.47], year: 880 }]

- id: west-francia-principalities-843
  year: 843
  endYear: 898
  title:
    ko: "서프랑크 대봉토의 형성: 샤를 대머리왕에서 오도까지(843~898)"
  summary:
    ko: "843년 서프랑크를 받은 샤를 대머리왕(재위 843~877)은 바이킹과 브르타뉴·아키텐의 반란에 시달렸고, 왕이 지켜 주지 못한 변경에서 지방의 군사 지도자들이 세습 영지를 쌓았다. 플랑드르에서는 보두앵 1세 철완이 861년 말 왕의 딸 주디트를 데리고 달아났다가 863년 10월 왕과 화해하고 12월 혼인했고, 아들 보두앵 2세(재위 879~918)가 아르투아까지 넓혔다. 아키텐에서는 푸아티에 백작 가문이 힘을 키워 라눌프 2세가 888년 아키텐 왕을 칭했고 경건공 기욤(893~918)이 공작이 되었다. 가스코뉴는 864년 무렵 산초 미타라 같은 공작들의 땅으로 전하고, 툴루즈의 레몽 가문은 셉티마니아(고티아)를 아울렀으며, 바르셀로나에서는 878년 기프레 1세(털보)가 바르셀로나와 지로나 백작이 되어 백령을 세습으로 이었다. 앙주는 870년 무렵부터 백작령으로 자라 929년 무렵 붉은 풀크가 백작이 되었다. 샤를 대머리왕이 877년 죽은 뒤 말더듬이 루이 2세(877~879), 그 아들 루이 3세(879~882)와 카를로만 2세(879~884), 동프랑크의 카를 3세 비만왕(884~887)이 차례로 서프랑크를 맡았으나 봉토의 자립을 막지 못했다. 로베르 가문의 강건공 로베르가 866년 바이킹과 싸우다 죽었고 아들 오도가 파리를 지켜(885~886) 888년 초 귀족들이 오도를 서프랑크 왕으로 뽑았다. 지도는 이 888년부터 플랑드르·아키텐·가스코뉴·툴루즈(고티아 포함)·바르셀로나를 서프랑크에서 떼어 따로 그리고 앙주는 930년 버전으로 그린다(브르타뉴는 851년부터). 898년 오도가 죽자 샤를 단순왕이 이었다."
  subjects: [west-francia, flanders, aquitaine, gascony-duchy, county-of-toulouse, anjou, barcelona-county, brittany-kingdom]
  links:
    - { from: west-francia, to: flanders, note: "보두앵 1세와 주디트의 혼인(862~863)" }
    - { from: west-francia, to: aquitaine, note: "라눌프 2세의 아키텐 왕 칭호(888)" }
    - { from: west-francia, to: barcelona-county, note: "기프레 1세의 백작령(878)" }
  tags: [politics]
  sources: ["Janet L. Nelson, Charles the Bald (1992)", "Jean Dunbabin, France in the Making, 843–1180 (2판, 2000)", "Pierre Riché, The Carolingians: A Family Who Forged Europe (Michael Idomir Allen 옮김, 1993)", "Rosamond McKitterick, The Frankish Kingdoms under the Carolingians, 751–987 (1983)"]

- id: vikings-francia-845
  year: 845
  endYear: 933
  title:
    ko: "센강의 바이킹: 파리 습격(845)과 포위(885~886)에서 노르망디 공국(911)까지"
  summary:
    ko: "데인인과 노르드인은 9세기 초부터 프랑크 해안을 노렸다. 834~837년 도레스타트가 해마다 약탈당했고, 841년 5월 루앙, 843년 6월 낭트가 습격받았다. 845년 3월 지도자(전승은 라그나르라 한다)가 120척으로 센강을 올라 파리를 차지하자 샤를 대머리왕은 은 7,000리브르를 주고 돌려보냈다(『생베르탱 연대기』). 같은 해 덴마크 왕 호리크 1세의 함대가 함부르크를 불태웠다. 바이킹은 수도원과 도시를 약탈하고 사람을 잡아 몸값을 받거나 팔았다. 프랑크 왕들도 중프랑크의 로타르 1세가 바이킹 로리크에게 프리슬란트를 봉토로 주는 식으로 한쪽을 끌어들였고 돈을 주고 돌려보냈다. 881년 사쿠르에서 서프랑크의 루이 3세가, 891년 루뱅에서 동프랑크의 아르눌프가 바이킹 군대를 꺾었다. 885년 11월부터 886년 10월까지 이어진 파리 포위에서는 백작 오도와 주교 고즐랭이 도시를 지켰고(아보는 바이킹이 700척이라 적었으나 과장으로 본다), 황제 카를 3세 비만왕은 886년 10월 바이킹을 치지 않고 센강 위쪽 부르고뉴를 약탈하도록 놓아두었고 이듬해 봄 은 700리브르를 주어 비난받았다. 바이킹은 브르타뉴 왕국도 짓밟았다(919~936). 911년 샤를 단순왕은 생클레르쉬르엡트에서 롤로에게 루앙 일대를 맡기고 세례를 받게 했다(지도는 911년부터 노르망디 공국). 924년 라울이 베생과 이에무아를, 933년 롤로의 아들 기욤 장검공이 코탕탱과 아브랑섕을 받았다(지도는 924·933년)."
  subjects: [west-francia, east-francia, middle-francia, normandy-duchy, brittany-kingdom, denmark-early]
  links:
    - { from: denmark-early, to: west-francia, note: "센강 원정(845·885~886)" }
    - { from: west-francia, to: normandy-duchy, note: "생클레르쉬르엡트 조약(911)" }
  tags: [war, politics]
  sources: ["Janet L. Nelson 옮김, The Annals of St-Bertin (1991)", "Janet L. Nelson, Charles the Bald (1992)", "Abbo of Saint-Germain-des-Prés, Viking Attacks on Paris: The Bella parisiacae urbis of Abbo of Saint-Germain-des-Prés (Nirmal Dass 옮김, 2007)", "Dudo of Saint-Quentin, History of the Normans (Eric Christiansen 옮김, 1998)", "David Bates, Normandy before 1066 (1982)"]
  places: [{ name: 파리(첫 점령), at: [2.35, 48.86], year: 845 }, { name: 파리 포위, at: [2.35, 48.86], year: [885, 886] }]

- id: brittany-nominoe-845
  year: 845
  endYear: 939
  title:
    ko: "브르타뉴 왕국: 노미노에의 발롱 전투(845)에서 알랭 2세의 공국(939)까지"
  summary:
    ko: "브르타뉴는 799년 프랑크에 복속했으나, 831년 루트비히 경건왕이 앉힌 노미노에가 845년 11월 발롱에서 샤를 대머리왕을 꺾고 자립을 굳혔다. 851년 노미노에의 아들 에리스포에가 제앙글랑 전투(8월)에서 샤를을 꺾은 뒤 앙제 조약으로 왕관과 렌·낭트·레츠를 받았다(지도는 851년부터 브르타뉴 왕국). 857년 사촌 살로몽이 에리스포에를 죽이고 왕이 되어 863년 앙트람 조약으로 앙주 서부를, 867년 콩피에뉴 조약으로 코탕탱과 아브랑섕을 얻었다(지도는 867년). 874년 살로몽이 살해된 뒤 내분이 이어졌고 알랭 대왕(888~907)이 다시 묶었다. 907년 알랭이 죽은 뒤 바이킹이 919년 낭트를 차지하고 브르타뉴를 짓밟아 사제들은 성인의 유해를 안고 피난했다(지도는 바이킹이 점령한 919~936년도 브르타뉴 땅으로 그린다). 933년 코탕탱과 아브랑섕은 노르망디로 넘어갔다. 잉글랜드에서 애설스탠의 궁정에 머물던 알랭 2세(바르브토르트)는 936년 돌아와 바이킹과 싸워 938년 공(dux)으로 뽑혔고 939년 8월 트랑스라포레에서 노르드인을 꺾었다(지도는 939년부터 브르타뉴 공국). 이 시기 브르타뉴와 맞닿은 앙주는 870년 무렵부터 백작령으로 자랐고, 서프랑크 왕의 힘은 브르타뉴에 거의 미치지 못했다."
  subjects: [brittany-kingdom, brittany, west-francia, normandy-duchy, anjou, england]
