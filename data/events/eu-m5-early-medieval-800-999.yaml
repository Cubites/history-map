- id: croatia-serbia-800
  year: 800
  endYear: 960
  title:
    ko: "크로아티아와 세르비아: 크로아티아 공국(800)에서 토미슬라브의 왕국(925)과 차슬라프(960 무렵)까지"
  summary:
    ko: "달마티아 내륙의 크로아티아인은 비셰슬라브(800 무렵)와 보르나(재위 810 무렵~821) 때 카롤루스 제국(프랑크)의 종주를 받아들였다. 자다르·스플리트·트로기르·라구사 같은 해안 도시는 동로마 땅으로 남았다(지도는 크로아티아 공국을 800년부터 그리고 도시는 근사). 819~823년 판노니아의 류데비트가 프랑크의 종주에 맞서 봉기했으나 눌렸다. 트르피미르(845 무렵~864)가 트르피미로비치 가문을 열었고, 도마고이(864~876)의 뒤를 이은 즈데슬라브(878~879)는 동로마의 도움을 받았다. 887년 베네치아 도제 피에트로 칸디아노 1세가 네레트바 해적과 싸우다 죽었다. 879년 교황 요한 8세가 브라니미르를 공으로 인정한 편지는 자립의 증거로 꼽힌다. 토미슬라브(재위 910 무렵~928 무렵)는 판노니아 쪽 일부를(범위는 학자마다 갈린다) 아울러 924~925년 무렵 왕이 되었고(지도는 925년부터 크로아티아 왕국), 925년 교황 요한 10세의 편지가 그를 '크로아티아인의 왕'으로 불렀으며 925년과 928년 스플리트에서 교회 회의가 열렸다. 926년 무렵 시메온의 불가리아군을 동보스니아 쪽에서 무너뜨렸다고 전하고, 마자르와의 싸움은 사료마다 승패가 갈린다. 세르비아는 블라스티미르(830년대~850 무렵)가 불가리아 제1제국의 프레시안을 막았고(839~842), 924년 시메온이 세르비아를 정복했으나(지도는 924년) 927~933년 사이(연구마다 갈린다) 차슬라프가 동로마의 도움으로 되살렸다(지도는 933년 라스를 남슬라브 공국들로 돌린다). 콘스탄티노스 7세의 『제국 통치론』은 차슬라프의 세르비아가 트라부니아·자훔리예·네레트바와 보스니아에 미쳤다고 적는다. 『두클랴 사제 연대기』의 전승은 960년 무렵 차슬라프가 죽자 보스니아가 크로아티아로 넘어갔다고 전한다(지도는 960년). 라스는 971년 동로마 땅이 되고, 지도는 976년부터 사무일의 불가리아 땅으로 그린다(사무일의 남슬라브 공국들 복속을 997~998년 무렵으로 적은 사건과 해가 다르다)."
