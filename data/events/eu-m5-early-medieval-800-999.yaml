- id: asturias-leon-800
  year: 800
  endYear: 951
  title:
    ko: "아스투리아스에서 레온으로: 알폰소 2세에서 라미로 2세까지의 재정주(800~951)"
  summary:
    ko: "아스투리아스 왕 알폰소 2세(재위 791~842)는 오비에도를 도읍으로 삼고 갈리시아의 산티아고 무덤 발견 전승(9세기 초)을 후원했다. 라미로 1세(재위 842~850)에 이어 오르도뇨 1세(재위 850~866)는 854년 아스토르가, 856년 레온을 다시 채웠고(재정주), 알폰소 3세 대왕(재위 866~910)은 두에로강 쪽으로 밀고 내려가 868년 포르투, 878년 코임브라, 893년 사모라, 899년 시망카스를 재정주했다(지도는 868·878·893·900년 버전). 코르도바 아미르국은 880~928년 무왈라드(이베리아 출신 개종자)와 호족의 반란으로 흔들려 이를 막지 못했다. 910년 알폰소 3세가 아들들에게 밀려나자 왕국은 가르시아 1세(레온)·오르도뇨(갈리시아)·프루엘라(아스투리아스)로 나뉘었고, 가르시아가 도읍을 레온으로 옮겨 레온 왕국이 되었다(지도는 910년에 이름만 바꾼다). 914년 오르도뇨 2세(재위 914~924)가 갈리시아와 레온을 합쳤다. 912년 압드 알라흐만 3세가 즉위한 뒤 두에로강 선이 다시 다투어졌고(지도는 912년 오스마 일대를 아미르국에서 레온으로), 오르도뇨 2세는 917년 산에스테반 데 고르마스에서 이겼으나 920년 발데훈케라에서 레온·나바라 연합군이 졌다. 프루엘라 2세(924~925)와 알폰소 4세(925~931)를 거쳐 931년 라미로 2세(재위 931~951)가 즉위했고 카스티야 백작 페르난 곤살레스가 따로 움직이기 시작했다(지도는 931년부터 카스티야 백국). 939년 시망카스에서 라미로 2세와 페르난 곤살레스, 나바라 왕 가르시아 산체스 1세가 압드 알라흐만 3세의 후우마이야 칼리프국군을 꺾었고(칼리프가 간신히 달아났다), 940년 살라망카를 다시 채웠다(지도는 940년). 양쪽 모두 원정에서 약탈하고 포로를 잡아 노예로 삼았다. 북쪽으로 올라온 모사라베 그리스도교인이 재정주 지역을 채웠다."
  subjects: [asturias, leon, cordoba-emirate, cordoba-caliphate, castile-county, navarre]
  links:
