- id: wessex-alfred-800
  year: 800
  endYear: 899
  title:
    ko: "웨식스의 에그버트에서 앨프레드 대왕까지: 엘렌던(825)·대이교도군(865)·에딩턴(878)"
  summary:
    ko: "웨식스 왕 에그버트(재위 802~839)는 825년 엘렌던에서 머시아 왕 베오른울프를 꺾어 켄트·서식스·서리·에식스를 얻었고(지도는 825년), 829년 머시아를 한때 정복했으나 이듬해 위글라프가 되찾았다(지도는 829·830년). 838년 힝스턴 다운에서 콘월 사람과 데인인의 연합군을 물리쳐 콘월을 굳혔다(지도는 근사로 콘월과 데번을 800년부터 웨식스 땅으로 그려 브리튼인 왕국들(덤노니아) 항목이 800년에 끝난다). 839년 에그버트가 죽은 뒤 아들 애설울프(재위 839~858)와 그의 아들들인 애설발드·애설버트·애설레드 1세(재위 865~871)가 차례로 이었다. 바이킹은 835년 무렵부터 수도원과 해안을 거듭 약탈하고 사람을 잡아 노예로 팔았고, 865년 이바르·하프단 형제 등이 이끈 '대이교도군'이 동앵글리아에 상륙해 866년 11월 요크를 차지해(지도는 867년) 867년 3월 요크 전투에서 노섬브리아의 두 왕이 죽었고, 869년 동앵글리아를 차지했다(동앵글리아 왕 에드먼드는 그때 죽어 훗날 성인이 되었다). 874년 머시아 왕 버레드가 쫓겨난 뒤 877년 데인인이 머시아를 나눠 동쪽을 차지하자 앵글로색슨 왕국들(머시아·노섬브리아·동앵글리아 등) 가운데 웨식스만 온전히 남았다. 애설레드 1세의 동생으로 871년 왕이 된 앨프레드(재위 871~899)는 878년 5월 에딩턴에서 구트럼을 꺾었고, 세례를 받은 구트럼은 880년 동앵글리아에 정착했다(지도는 에식스를 880년 데인로로 옮긴다). 886년 앨프레드가 런던을 되찾고 구트럼과 템스강·리강·베드퍼드·우즈강·와틀링가도를 경계로 하는 조약을 맺었다(조약 연대는 880년설과 886년 뒤설이 갈린다)(머시아 서부는 신하 애설레드가 맡아 지도는 886년 웨식스 땅). 웨일스 공국들의 일부 왕도 앨프레드의 신종을 받아들였고, 그는 요새도시(버)와 민병·함대로 방어를 짜고 학문을 장려했다."
