- id: svyatoslav-khazars-bulgaria-964
  year: 964
  endYear: 972
  title:
    ko: "스뱌토슬라프의 원정: 하자르 칸국의 몰락(965~969)과 불가리아 원정(968~971)"
  summary:
    ko: "키예프 루스의 스뱌토슬라프는 945년 아버지 이고리가 죽었을 때 어렸고 962년 무렵부터 직접 군대를 이끌었다. 964년 오카강 쪽에서 동슬라브 부족 뱌티치를 만났고 공납은 966년에 받았다고 하며(지도는 966년), 965년 무렵(연대는 논쟁이 있다) 하자르 칸국을 공격해 사르켈(벨라야 베자)을 점령했다(『원초 연대기』). 968~969년에는 이틸과 세멘데르, 볼가 불가리아의 도시 불가르도 무너졌다고 이븐 하우칼은 적는다. 하자르 칸국의 중심은 사라졌고 그 초원은 지도에서 페체네그에 넘어간다(돈강 지역 965년, 볼가강 하류 969년). 다만 스뱌토슬라프가 하자르 소멸의 유일한 원인이었는지는 학자마다 달리 본다. 968년 동로마 황제 니케포로스 2세 포카스는 사절 칼로키로스에게 금을 주어 스뱌토슬라프가 불가리아 제1제국을 치도록 부추겼고, 그가 다뉴브강의 페레야슬라베츠에 이르렀으나 페체네그가 키예프를 포위해 돌아왔다. 969년 어머니 올가가 죽자 아들들에게 루스를 나눠 맡기고(야로폴크 키예프, 올레그 드레블랴네, 블라디미르 노브고로드, 『원초 연대기』는 970년) 다시 불가리아로 가 프레슬라프를 차지하고 보리스 2세를 사실상 손에 넣었다. 969~970년 트라키아로 들어가 필리포폴리스를 점령하고 주민 2만 명을 꼬챙이에 꿰었다고 비잔티움 사료는 적는다(과장으로 본다). 971년 4월 요안니스 1세 치미스키스가 프레슬라프를 점령해 루스 수비대를 거의 죽였고, 4월부터 7월까지 도로스톨론(실리스트라)을 포위한 끝에 화약을 맺어 스뱌토슬라프는 물러났다. 불가리아 동부는 동로마 땅이 되었고(지도는 971년), 라스의 남슬라브 공국들 땅도 동로마 카테파노령이 되었다. 스뱌토슬라프는 972년 봄 드니프로강 급류에서 페체네그에게 죽었고, 연대기는 그 두개골이 술잔이 되었다고 전한다."
  subjects: [kievan-rus, khazar-khaganate, pecheneg-tribes, east-slavic-tribes, volga-bulgaria, first-bulgarian-empire, byzantine-empire, south-slavic-principalities]
