  sources: ["Widukind of Corvey, Deeds of the Saxons (Bernard S. Bachrach·David S. Bachrach 옮김, 2014)", "Timothy Reuter, Germany in the Early Middle Ages, c. 800–1056 (1991)", "Karl J. Leyser, Rule and Conflict in an Early Medieval Society: Ottonian Saxony (1979)"]
