  sources: ["Samuel Hazzard Cross·Olgerd P. Sherbowitz-Wetzor 옮김, The Russian Primary Chronicle: Laurentian Text (1953)", "Simon Franklin·Jonathan Shepard, The Emergence of Rus, 750–1200 (1996)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "세르히 플로히, 『유럽의 문 우크라이나: 독립과 생존을 위한 투쟁의 역사』(허승철 옮김, 한길사, 2022)"]
