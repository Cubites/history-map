- id: krum-omurtag-803
  year: 803
  endYear: 842
  title:
    ko: "크룸에서 오무르타그까지: 불가리아 제1제국의 팽창(803~842)"
  summary:
    ko: "불가르인의 칸 크룸(재위 803 무렵~814)은 805년 무렵 동쪽에 남은 아바르 칸국의 땅(티서강 평원과 바나트)을 차지해 영토를 다뉴브강 중류까지 넓혔고(지도는 805년 버전, 아바르 칸국의 항목은 822년에 끝난다), 809년 세르디카(소피아)를 빼앗고 수비대를 죽였다(6천 명이라 전한다). 811년 7월 니케포로스 1세가 플리스카를 불태우자 크룸은 고개에서 퇴로를 막아 황제를 죽였고, 동로마 사료는 그 두개골에 은을 입혀 술잔으로 썼다고 전한다. 812년 데벨토스·메셈브리아, 813년 6월 베르시니키아에서 미카엘 1세를 이긴 뒤 아드리아노폴리스를 함락해 수비병과 주민 1만 명 안팎(전하는 수)을 다뉴브강 북쪽으로 끌고 갔다. 크룸은 814년 4월 콘스탄티노폴리스를 치려 준비하다 죽었다. 오무르타그(재위 814~831)는 815 또는 816년 레온 5세와 30년 화약을 맺고(지도는 자고라를 816년부터 불가리아 땅으로 그린다) 822년 무렵 미카엘 2세를 도왔으며, 827~829년 도나우강을 따라 판노니아로 나아가 슬라브 부족들을 복속시켰다(카롤루스 제국의 땅이던 스렘·베오그라드 일대는 지도에서 827년부터 불가리아 땅). 9세기 중엽 말라미르(재위 831~836)와 프레시안(재위 836~852) 때 필리포폴리스 일대(지도는 836년)와 마케도니아·코소보 쪽 슬라브 땅(지도는 842년)이 불가리아로 넘어와 남슬라브 공국들의 땅이 줄었다."
  subjects: [first-bulgarian-empire, byzantine-empire, avar-khaganate, south-slavic-principalities, carolingian-empire]
  links:
    - { from: first-bulgarian-empire, to: byzantine-empire, note: "플리스카(811)·베르시니키아(813)와 30년 화약(816)" }
    - { from: first-bulgarian-empire, to: avar-khaganate, note: "동쪽 아바르 정복(805 무렵)" }
  tags: [war, politics]
  sources: ["John V. A. Fine Jr., The Early Medieval Balkans: A Critical Survey from the Sixth to the Late Twelfth Century (1983)", "Florin Curta, Southeastern Europe in the Middle Ages, 500–1250 (2006)", "Cyril Mango·Roger Scott 옮김, The Chronicle of Theophanes Confessor (1997)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
