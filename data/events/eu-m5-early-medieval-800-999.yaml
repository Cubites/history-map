- id: caliphate-almanzor-880
  year: 880
  endYear: 1000
  title:
    ko: "압드 알라흐만 3세의 칼리프 선언(929)과 알만수르(알만소르)의 원정(981~997)"
  summary:
    ko: "코르도바 아미르국은 880년 무렵부터 보바스트로의 이븐 하프순을 비롯한 무왈라드와 호족의 반란에 시달렸다. 이븐 하프순은 899년 무렵 그리스도교로 개종했다고 하며 917년 죽었다. 912년 즉위한 압드 알라흐만 3세는 928년 이븐 하프순의 아들 하프스의 항복으로 보바스트로를 얻어 반란을 끝내고 929년 1월 16일 '신자들의 지도자', 곧 칼리프를 칭했다(지도는 929년에 후우마이야 칼리프국으로 이름만 바꾼다). 이프리키야의 파티마 왕조와 바그다드의 아바스 왕조에 맞선 선언이었다. 코르도바는 서유럽에서 가장 큰 도시 가운데 하나로 자랐고 936년부터 교외에 궁성 메디나 아자하라를 지었다. 939년 시망카스에서 졌으나(앞의 사건) 북쪽 왕국들에게서 공납을 받았다. 하캄 2세(재위 961~976) 때 학문이 꽃피었고, 아들 히샴 2세(재위 976~1009)가 어려 시종 무함마드 이븐 아비 아미르, 곧 알만수르(알만소르)가 981년부터 실권을 쥐었다. 알만수르는 50여 차례 원정을 했다고 전한다. 985년 바르셀로나를 약탈해 주민을 죽이거나 포로로 끌고 갔고, 987년 코임브라를 차지했으며(지도는 987년에 코임브라 일대를 레온 왕국에서 칼리프국으로 옮긴다), 988년 레온을 약탈하고 997년 산티아고 데 콤포스텔라 대성당을 파괴했다. 이때 포로가 된 그리스도교인이 성당의 종을 코르도바까지 날랐다고 전한다. 베르베르와 슬라브(사카리바) 병사를 중심으로 한 군대는 북쪽의 레온 왕국·나바라 왕국·카스티야 백국·바르셀로나 백국을 눌렀으나, 그가 1002년 죽자 곧 내란이 시작되었다(뒤의 사건)."
  subjects: [cordoba-emirate, cordoba-caliphate, leon, navarre, castile-county, barcelona-county]
  links:
    - { from: cordoba-caliphate, to: barcelona-county, note: "바르셀로나 약탈(985)" }
    - { from: cordoba-caliphate, to: leon, note: "코임브라(987)와 레온(988)" }
  tags: [politics, war]
  sources: ["Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)", "Maribel Fierro, Abd al-Rahman III: The First Cordoban Caliph (2005)", "Roger Collins, Early Medieval Spain: Unity in Diversity, 400–1000 (2판, 1995)"]
  places: [{ name: 보바스트로, at: [-4.78, 36.90], year: 928 }, { name: 바르셀로나, at: [2.17, 41.39], year: 985 }, { name: 코임브라, at: [-8.42, 40.21], year: 987 }, { name: 산티아고 데 콤포스텔라, at: [-8.54, 42.88], year: 997 }]

- id: west-francia-capetian-888
  year: 888
  endYear: 987
  title:
    ko: "서프랑크의 오도에서 위그 카페까지: 카롤링거와 로베르 가문의 왕위 다툼(888~987)"
  summary:
    ko: "888년 서프랑크 귀족들은 파리 백작 오도를 왕으로 뽑았고, 893년 반대파가 카롤링거의 샤를 단순왕(재위 898~922)을 세웠다. 922년 오도의 동생 로베르 1세가 왕이 되었다가 923년 6월 수아송 전투에서 죽었고(샤를은 사로잡혀 929년 갇힌 채 죽었다), 사위인 부르고뉴 공 라울(재위 923~936)이 이었다. 936년 잉글랜드로 망명했던 샤를의 아들 루이 4세가 위그 대공(로베르 1세의 아들)에게 불려 와 즉위했다(재위 936~954). 왕이 직접 다스린 곳은 카롤링거 왕의 랑과 로베르 가문의 파리·오를레앙 둘레 같은 작은 땅뿐이었고 플랑드르·아키텐·가스코뉴·툴루즈 같은 큰 봉토는 거의 독립해 있었다. 911년 노르망디 공국이 서고(지도는 911·924·933년), 929년 무렵 앙주 백국이 자랐으며(지도는 930년), 933년 상부르군트의 루돌프 2세가 위그(아를)에게서 프로방스를 받아 프로방스 왕국과 합쳐 부르군트 왕국(아를 왕국)을 이루었다(지도는 933년). 925년 로타링기아는 동프랑크로 넘어갔고 959년 상·하로렌으로 나뉘어 로렌 공국이 생겼다(뒤의 사건). 954년 즉위한 로테르(재위 954~986)는 오토 1세의 조카였으나 로렌을 두고 오토 가문과 다투었다(978년 아헨 습격은 뒤의 사건). 987년 5월 그의 아들 루이 5세가 사냥 사고로 죽자 랭스 대주교 아달베롱이 위그 대공의 아들 위그 카페를 추천했고, 7월 위그가 누아용에서 왕이 되었다. 카롤링거 계통의 숙부 로렌 공 샤를은 맞섰으나 991년 잡혔다. 위그는 987년 12월 아들 로베르를 공동 왕으로 세워 세습을 굳혔다(지도는 987년에 서프랑크 왕국을 프랑스 왕국으로 이름만 바꾼다)."
  subjects: [west-francia, france, normandy-duchy, flanders, anjou, aquitaine, county-of-toulouse, gascony-duchy, burgundy-kingdom, provence-kingdom, lorraine, east-francia]
