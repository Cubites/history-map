- id: piast-mieszko-960
  year: 960
  endYear: 992
  title:
    ko: "미에슈코 1세와 피아스트 폴란드의 성립: 세례(966)에서 '다고메 이우덱스'(991)까지"
  summary:
    ko: "피아스트 가문의 미에슈코 1세(재위 960 무렵~992)는 폴란인의 땅(그니에즈노·포즈난)을 다스렸고, 963년 비두킨트의 『작센인의 업적』에 오토 1세(962년부터 신성 로마 제국의 황제)의 '친구'이자 바르타강까지의 공납자로 처음 나온다(지도는 960년부터 피아스트 폴란드). 965년 보헤미아 공 볼레슬라프 1세의 딸 도브라바와 혼인했고 966년(전승은 4월 14일 부활절) 세례를 받았으며, 첫 주교 요르단이 포즈난에 왔다(968년이라는 설이 많다). 안달루스 출신 유대인 상인 이브라힘 이븐 야쿠브는 965~966년 프라하를 거쳐 '메스코'가 3천 명의 중무장한 병사를 거느렸다고 적었다. 지도는 966년에 대폴란드·쿠야비아·마조프셰와 렌디치 땅을 서슬라브 부족에서 폴란드로 옮긴다. 972년 6월 24일 미에슈코는 체디니아에서 오토 1세의 변경백 호도를 이겼고, 979년 무렵 작센 변경백 디트리히의 딸 오다와 혼인했다. 981년 『원초 연대기』는 키예프 루스의 블라디미르가 폴란드인의 체르벤 도시들을 쳤다고 적는다(뒤의 사건). 990년 미에슈코는 슐레지엔을 두고 보헤미아의 볼레슬라프 2세와 다투어 슐레지엔을 차지했고(985년 무렵부터라는 설도 있다), 그단스크 일대 포메렐리아는 별도로 일찍부터 복속시킨 것으로 본다(지도는 슐레지엔 서부와 포메렐리아를 990년에 폴란드로 옮긴다). 991년 무렵 '다고메 이우덱스' 문서로 자기 나라를 성 베드로(교황)에게 바쳐 보호를 청하고 경계를 적었는데, 사본이 후대의 것이라 해석이 갈린다. 미에슈코는 포메른의 슬라브 부족과 발트 부족인 프로이센인과도 싸웠고, 992년 죽어 맏아들 볼레스와프 1세가 이었다."
  subjects: [piast-poland, slavic-tribes, bohemia-duchy, holy-roman-empire, papal-states, kievan-rus, baltic-tribes]
