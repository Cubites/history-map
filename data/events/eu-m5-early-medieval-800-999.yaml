- id: vladimir-baptism-977
  year: 977
  endYear: 992
  title:
    ko: "블라디미르 1세: 키예프 루스의 확장(980~992)과 세례(988)"
  summary:
    ko: "키예프 루스의 스뱌토슬라프가 죽은(972) 뒤 아들들이 다투어 야로폴크가 977년(『원초 연대기』의 연도이며 현대 개설은 976년으로 본다) 동생 올레그를 쳐 죽이자 노브고로드의 블라디미르는 스칸디나비아로 달아났다. 그는 980년(현대 개설은 978년) 바랴그 용병과 돌아와 폴로츠크의 로그볼로드와 아들들을 죽이고 딸 로그네다를 아내로 삼았으며, 키예프를 차지해 야로폴크를 죽였다. 블라디미르는 페룬을 비롯한 이교 신상을 세웠고, 연대기는 983년 야트빙기아 원정 뒤 제비로 뽑힌 그리스도교인 바랴그인 부자가 제물이 되기를 거부해 군중에게 살해되었다고 전한다. 981~982년 체르벤 도시들(볼히니아)을 폴란드에게서 빼앗고(지도는 981년), 뱌티치를 다시 복속시켰으며, 983년에는 발트 부족인 야트빙기아인을 쳤고(지도는 983년), 984년 라디미치를 다시 복속시켰으며, 985년 볼가 불가리아를 쳐 화약을 맺었다. 『원초 연대기』는 986년 불가르(이슬람)·독일(로마 교회)·하자르(유대교)·그리스(정교)의 사절이 믿음을 권했고 블라디미르가 그리스를 골랐다고 전한다(설화이다). 실제로는 987년 바르다스 포카스의 반란에 몰린 동로마 제국의 바실리오스 2세가 블라디미르에게 군사를 청해(안티오키아의 야히야는 6천 명이라 적는다) 바랑기아 근위대가 생겼고, 그 대가로 황제의 누이 안나와 혼인하기로 했다. 블라디미르는 988년(989년으로 보기도 한다) 크림의 케르소네소스(코르순)를 포위해 차지하고 세례를 받았으며, 키예프 사람들을 드니프로강에서 세례했다. 이교 신상은 부서졌고 십일조 교회가 세워졌다. 992년 하얀 크로아티아인(서우크라이나)을 복속시키면서 지도는 동슬라브 부족 항목을 마치고 키예프 루스로 이어 쓴다. 블라디미르는 페체네그의 습격에 맞서 드니프로강 둘레에 성채선을 쌓았다."
