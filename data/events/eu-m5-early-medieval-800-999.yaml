# 유럽 중세 사건 5차 묶음: 카롤루스의 황제 대관에서 바실리오스 2세·알만수르·블라디미르의 세례까지 (800 ~ 999, 작업 EVM5)
# 범위: 카롤루스의 황제 대관과 아헨 화약, 루트비히 경건왕과 아들들·베르됭·메르센·리베몽 조약과 카를 3세 비만왕, 서프랑크 대봉토와 카페 왕조의 등장, 바이킹의 센강 습격과 노르망디·브르타뉴,
#   클뤼니 수도원, 동프랑크의 작센 왕조·레히펠트·오토 1세의 황제 대관과 오토 2세·3세, 웨식스의 잉글랜드 통일과 데인로·스코틀랜드의 형성, 덴마크·스웨덴·노르웨이와 아이슬란드 정착,
#   키예프 루스(류리크·올레그·올가·스뱌토슬라프·블라디미르)와 하자르 칸국의 몰락·볼가 교역로, 마자르의 정착, 대모라비아와 키릴로스·메토디오스, 불가리아 제1제국(크룸·보리스 1세·시메온·사무일), 크로아티아·세르비아,
#   피아스트 폴란드와 보헤미아 공국, 동로마의 성상 파괴 끝·포티오스 분열·마케도니아 왕조의 반격(크레타·안티오크)·바실리오스 2세의 즉위, 아랍의 시칠리아 정복, 캅카스 왕조들,
#   아스투리아스에서 레온으로·나바라·카스티야·바르셀로나, 후우마이야 칼리프국과 알만수르.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 800~999년 지도에서 생기거나 끝난 유럽 항목(카롤루스 제국·크로아티아 공국 800, 타오-클라르제티 813, 아바르 칸국 822, 나바라 824, 크레타 토후국 827, 스웨덴 829,
#   시칠리아 토후국 831, 대모라비아 833, 마자르 공국 838, 스코틀랜드·서프랑크·동프랑크·중프랑크 843, 브르타뉴 왕국 851, 이탈리아 왕국·프로방스 왕국 855, 아키텐 860, 플랑드르 862, 루스 862, 가스코뉴 864, 데인로 867,
#   앙주·보헤미아 870, 노르웨이 872, 바르셀로나 878, 키예프 루스 882, 아르메니아 왕국들 885, 부르군트 왕국 888, 페체네그 890, 레온 910, 노르망디 911, 볼가 불가리아 922, 크로아티아 왕국 925, 잉글랜드 927,
#   후우마이야 칼리프국 929, 아이슬란드 930, 카스티야 931, 덴마크 936, 브르타뉴 공국 939, 데인로의 끝 954, 덴마크 왕국 958, 로렌 959, 폴란드 960, 신성 로마 제국 962, 하자르 칸국 969, 프랑스 987 등)을
#   subjects로 이음(docs/REGION_GUIDE.md §5, 점검 방식은 EVM1~EVM4의 성립·소멸 점검과 같음). 지도의 큰 변화(1만 km² 넘는 유럽 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 볼가 교역로의 이븐 후르다드베가 적은 신라(알실라)를 silla로 subjects에 잇고, 청해진(`cheonghaejin-828`)·장보고 피살(`jang-bogo-846`)은 서술로 이었다. 936년 고려의 후삼국 통일(`unification-936`)과
#   발해 멸망(`balhae-falls-926`)은 서술로만 같은 시기임을 적었다. 03·04번 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 6~10일 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 사료와 표준 개설서(한국어 번역본이 확인된 것만 번역본으로). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: charlemagne-emperor-800
  year: 800
  endYear: 814
  title:
    ko: "카롤루스의 황제 대관(800)과 아헨 화약(812): 서방 제국과 동로마의 인정"
  summary:
    ko: "799년 4월 로마 귀족들에게 습격당한 교황 레오 3세가 프랑크 왕 카롤루스에게 몸을 맡겼고, 카롤루스는 800년 11월 로마에 와서 12월 23일 교황이 맹세로 혐의를 씻는 자리를 이끌었다. 12월 25일 성탄절 미사에서 교황이 그에게 황제의 관을 씌웠다(아인하르트는 그가 미리 알았다면 그날 성당에 들어가지 않았을 것이라고 했다고 전한다). 476년 서로마 황제가 사라진 뒤 서방의 첫 황제로, 카롤루스는 스스로를 '로마 제국을 다스리는 황제'라 불렀고 지도는 800년에 프랑크 왕국을 카롤루스 제국으로 이름만 바꿔 그린다. 동로마는 황제가 둘이 되는 것에 반발했고(802년 니케포로스 1세가 여제 이레네를 몰아냈다), 810년 카롤루스의 아들 이탈리아 왕 피핀의 베네치아 원정은 실패했다. 810년 피핀이 죽은 뒤 이어진 협상 끝에 812년 아헨에서 미카엘 1세의 사절이 카롤루스를 '바실레우스'로 불러 칭호를 인정했다('로마인의 황제'는 동로마 황제만 쓰기로 했다). 베네치아와 달마티아의 해안 도시·섬은 동로마 몫으로 남았고 달마티아 내륙의 크로아티아는 프랑크의 영역으로 확인되었으나 경계가 분명하지 않아 817년 레온 5세의 사절이 다시 아헨에 왔다. 남이탈리아의 롬바르드·캄파니아 공국들(베네벤토 등)은 카롤루스에게 공납을 바쳤고, 달마티아 내륙의 크로아티아 공국(지도는 800년부터)도 프랑크의 종주 아래 있었다. 변경에서는 801년 4월 아들 루트비히(뒤의 경건왕)가 코르도바 아미르국에게서 바르셀로나를 얻어 에스파냐 변경령을 세웠고(지도는 805년 버전), 806년 팜플로나가 복속했다(지도는 806년 버전). 806년 카롤루스는 제국을 세 아들에게 나눌 계획을 세웠으나 피핀(810)과 샤를(811)이 먼저 죽어, 813년 9월 아헨에서 루트비히를 공동 황제로 세웠고 814년 1월 28일 죽었다."
