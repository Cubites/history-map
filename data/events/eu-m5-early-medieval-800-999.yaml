- id: england-unification-899
  year: 899
  endYear: 954
  title:
    ko: "웨식스의 잉글랜드 통일: 에드워드와 애설플레드(910~918), 애설스탠의 브루넌버(937), 요크 왕국의 끝(954)"
  summary:
    ko: "앨프레드의 아들 에드워드 장형왕(재위 899~924)은 누이인 머시아의 애설플레드와 함께 데인로를 되찾았다. 910년 8월 테튼홀에서 노섬브리아의 데인군을 크게 이겼고, 917년 템스퍼드와 콜체스터를 차지해 동앵글리아의 데인군을 복속시켰다(지도는 917년에 동앵글리아와 에식스를 웨식스 땅으로). 애설플레드는 917년 더비를 얻고 918년 레스터의 항복을 받은 뒤 6월 죽었으며, 에드워드는 918년 스탬퍼드와 노팅엄을 얻고 남부 데인로(베드퍼드·노샘프턴)를 거두어 머시아까지 아울렀다(다섯 버러 가운데 링컨은 기록이 불분명하며, 지도는 918년에 다섯 버러(레스터·노팅엄·더비·링컨·스탬퍼드)와 남부 데인로를 웨식스 땅으로 그린다). 애설스탠(재위 924~939)은 927년 요크를 얻고 7월 이먼트에서 스코틀랜드 왕 콘스탄틴 2세, 웨일스 공국들의 하이웰, 밤버러의 이얼드레드의 신종을 받았다(지도는 927년에 웨식스를 잉글랜드 왕국으로 이름만 바꾸고 앵글로색슨 왕국들 항목이 끝난다). 937년 브루넌버에서 애설스탠은 더블린의 올라프 구트프리트손(아일랜드 왕국들의 노르드 도시 왕)과 스코틀랜드·스트래스클라이드 왕의 동맹군을 꺾었다(『앵글로색슨 연대기』는 다섯 왕과 일곱 백작이 전사했다고 노래하나 사망자 수는 과장일 수 있다). 939년 애설스탠이 죽자 올라프가 요크를 되찾았고(지도는 939년), 940년 다섯 버러도 얻었으나 941년 죽었다(지도는 940년). 애설스탠의 이복동생 에드먼드(재위 939~946)가 942년 다섯 버러를, 944년 요크를 되찾았다. 947년 노르웨이의 에이리크 피도끼왕이 요크에 올랐다가 948년 에드먼드의 동생 에드레드(재위 946~955)에게 쫓겨났고, 949년 올라프 시흐트릭손이 돌아왔다가 952년 다시 에이리크에게 밀렸다. 954년 에이리크가 쫓겨나 죽으면서 요크 왕국이 끝나고 노섬브리아는 잉글랜드 왕의 땅이 되었다(지도는 954년에 데인로 항목이 끝난다)."
