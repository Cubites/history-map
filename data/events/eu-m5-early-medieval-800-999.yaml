- id: magyars-838
  year: 838
  endYear: 955
  title:
    ko: "마자르의 이주와 습격: 에텔쾨즈(838 무렵)에서 카르파티아 분지의 정착(895)과 레히펠트(955)까지"
  summary:
    ko: "마자르는 하자르 칸국에 속한 서쪽 초원 에텔쾨즈(드니프로강에서 프루트강 사이)에서 살았다. 동로마 『게오르기오스 수도사 연대기』의 이어쓴이가 837~838년 무렵 이들을 '우그로이'로 적은 것이 가장 이른 기록으로 꼽히고(지도는 838년부터 마자르 공국), 862년 『생베르탱 연대기』는 동프랑크에 처음 쳐들어온 '운그리'를 전한다. 894~895년 마자르가 동로마의 청으로 불가리아 제1제국을 친 사이 시메온과 손잡은 페체네그가 에텔쾨즈를 차지했고(지도는 895년), 아르파드가 이끄는 일곱 부족은 카바르 세 부족과 함께 베레츠케 고개를 넘어 카르파티아 분지로 들어왔다. 900년에는 판노니아, 902~906년에는 대모라비아를 차지했고 907년 프레스부르크에서 바이에른군을 이겼다(지도는 900·907년). 마자르의 경기병은 899년 브렌타강에서 이탈리아 왕국의 베렌가리오 1세를 꺾은 뒤 이탈리아, 작센, 바이에른, 부르군트, 프로방스까지 나아가 수도원과 도시를 약탈하고 사람을 잡아 팔았다. 동프랑크의 하인리히 1세는 924~926년 무렵 공물을 주고 휴전을 산 뒤 성을 쌓고 기병을 길러 933년 3월 리아데에서 이겼다. 955년 8월 레히펠트에서 오토 1세가 마자르의 대군을 꺾었고(뒤의 사건) 지도자 불추와 슈르 등이 처형되었다고 전한다. 이후 서방 원정은 그쳤고 탁소니(955 무렵~972 무렵)에 이어 게저 대공(972~997)이 정착과 개종을 이끌었다. 같은 시기 동쪽 초원 끝에서는 거란의 야율아보기가 916년 황제에 올라(지도는 916년부터 요) 926년 발해를 멸망시켰다(`balhae-falls-926`)."
  subjects: [magyars, pecheneg-tribes, khazar-khaganate, first-bulgarian-empire, great-moravia, east-francia, byzantine-empire, italy-carolingian]
