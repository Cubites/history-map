- id: bulgaria-boris-simeon-864
  year: 864
  endYear: 933
  title:
    ko: "보리스 1세의 개종(864)에서 시메온 1세의 불가리아(893~927)까지"
  summary:
    ko: "불가리아 제1제국의 칸 보리스 1세(재위 852~889)는 864년 무렵 동로마 황제 미카엘 3세를 대부로 세례를 받았다(동로마군의 침공과 기근이 압박이었다고 전한다). 그는 866년 교황 니콜라우스 1세에게 질문서를 보냈으나, 870년 콘스탄티노폴리스 공의회가 불가리아 교회를 콘스탄티노폴리스에 속하게 했다. 대모라비아에서 쫓겨난 메토디오스의 제자들이 885~886년 불가리아로 오자 보리스는 이들을 받아들여 플리스카와 오흐리드에서 슬라브어 문헌을 만들게 했다. 889년 물러났다가 893년 돌아와 아들 블라디미르를 눈멀게 하고 시메온을 세웠으며, 프레슬라프 회의는 슬라브어를 교회어로 정했다. 시메온 1세(재위 893~927)는 894년 교역 문제로 레온 6세(재위 886~912)의 동로마와 싸웠고, 동로마가 끌어들인 마자르를 페체네그와 손잡고 몰아냈다(마자르가 불가리아를 친 사이 페체네그가 에텔쾨즈를 차지해 지도는 895년 다뉴브강 북쪽을 페체네그 땅으로 옮긴다). 896년 8월 불가로피곤에서 동로마군을 크게 이겼다. 904년 아랍 함대가 테살로니키를 약탈한 해 동로마는 화약으로 중앙 마케도니아를 넘겼고(지도는 904년 나라쉬 경계), 913년 콘스탄티노폴리스 앞에서 황제와 같은 예우를 받았으며, 917년 8월 아켈로오스에서 동로마군을 무너뜨린 뒤 '불가르인과 로마인의 차르'를 칭했다. 924년 세르비아를 정복했으나(지도는 924년) 926년 무렵 크로아티아의 토미슬라브에게 군대를 잃었다고 전한다. 927년 시메온이 죽자 아들 페타르 1세가 동로마와 화해해 차르 칭호와 총대주교구를 인정받았고(황제의 손녀 마리아 레카페네와 혼인), 927~933년 사이(연구마다 갈리고 시메온이 죽은 927년 뒤로 보는 설이 최근 힘을 얻는다) 차슬라프가 동로마의 도움으로 세르비아를 되살려 지도는 933년에 라스를 남슬라브 공국들로 돌린다."
  subjects: [first-bulgarian-empire, byzantine-empire, papal-states, south-slavic-principalities, croatia-kingdom, magyars, pecheneg-tribes, great-moravia]
