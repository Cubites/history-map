- id: rus-formation-862
  year: 862
  endYear: 964
  title:
    ko: "루스의 형성: 류리크와 올레그(862~882), 이고리와 올가(912~957)"
  summary:
    ko: "『원초 연대기』(12세기 초 편찬)는 862년 일멘 슬로베네·크리비치·추드·메랴가 바랴그인 류리크를 불러 노브고로드(라도가)에 세웠고 그 형제와 부하들이 벨로오제로·이즈보르스크·폴로츠크·로스토프·무롬을 맡았다고 전한다(설화적이며 연도는 연대기가 맞춘 것이다. 지도는 862년부터 이 땅을 루스로 그리고, 메랴·베스 같은 핀우그르 부족의 땅도 862년에 루스로 옮긴다). 882년 올레그가 키예프를 차지하고 아스콜드와 디르를 죽여 키예프 루스가 되었으며(지도는 882년), 883년 드레블랴네, 884년 세베랴네, 885년 라디미치가 공납을 바치게 되었다(지도는 해마다 넓힌다). 남쪽 동슬라브 부족은 하자르 칸국에 공물을 바치던 터였다. 907년 올레그의 콘스탄티노폴리스 원정(동로마 사료에는 없다)과 911년 조약으로 루스 상인이 무역 특권을 얻었다고 한다(지도는 907년 드레고비치, 940년 울리치·티베르치). 941년 이고리의 함대가 콘스탄티노폴리스를 쳤으나 동로마의 '그리스의 불'에 졌고(사료의 배 수는 1천 척에서 1만 척으로 과장), 이고리는 페체네그를 끌어들여 944년 조약을 맺었다. 945년 이고리는 드레블랴네에 공물을 거듭 거두러 갔다가 살해되었다(레오 부제는 휘어진 두 나무에 묶어 찢었다고 적는다). 아내 올가는 어린 스뱌토슬라프를 대신해 복수에 나서 사절을 죽이고 도시 이스코로스텐을 불태웠다고 전한다(설화적이다). 이어 공물을 정하고 걷는 곳(포고스트)을 두었다. 올가는 957년 무렵 콘스탄티노폴리스에서 세례를 받았고, 959년 오토 1세(962년부터 신성 로마 황제)에게 선교사를 청했으나 960년대 초 온 주교 아달베르트는 성과 없이 돌아갔다."
  subjects: [rurikid-rus, kievan-rus, east-slavic-tribes, finnic-tribes, khazar-khaganate, byzantine-empire, pecheneg-tribes, holy-roman-empire]
