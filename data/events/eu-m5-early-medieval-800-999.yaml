  sources: ["Roger Collins, Early Medieval Spain: Unity in Diversity, 400–1000 (2판, 1995)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)", "Kenneth Baxter Wolf 옮김, Conquerors and Chroniclers of Early Medieval Spain (2판, 1999)"]
