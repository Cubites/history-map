- id: middle-francia-meerssen-855
  year: 855
  endYear: 888
  title:
    ko: "중프랑크의 분할: 프륌 조약(855)에서 메르센(870)·리베몽(880) 조약과 카를 3세 비만왕의 재통일·폐위(884~888)까지"
  summary:
    ko: "855년 9월 로타르 1세가 프륌 수도원에서 죽으며 중프랑크를 세 아들에게 나눴다. 루도비코 2세는 이탈리아와 황제 칭호를, 로타르 2세는 북해에서 알자스까지의 로타링기아를, 막내 샤를은 프로방스와 리옹·비엔을 받았다(지도는 855년에 이탈리아 왕국·프로방스 왕국을 세운다). 859년 로타르 2세가 제네바·로잔·시옹의 트란스유라를 루도비코 2세에게 넘겼고(지도는 859년), 863년 샤를이 죽어 프로방스는 루도비코 2세에게, 리옹·비엔은 로타르 2세에게 갔다(지도는 863년). 로타르 2세는 아내 테우트베르가와 이혼하려다 교황과 맞섰고 869년 후계자 없이 죽었다. 샤를 대머리왕이 로타링기아 왕으로 대관했으나 독일인 루트비히와 맞서 870년 8월 메르센 조약으로 리옹·비엔·브장송·툴·베르됭 등 서쪽을, 루트비히가 아헨·쾰른·트리어·위트레흐트·알자스 등 동쪽을 나눠 가졌다(지도는 870년). 875년 성탄절 샤를이 황제관을 받았고 877년 죽었다. 그 앞 876년 독일인 루트비히가 죽자 동프랑크는 아들 카를로만(바이에른)·루트비히 젊은왕(작센·프랑켄)·카를(슈바벤, 뒤의 카를 3세)이 셋으로 나눠 가졌다. 879년 만텔 회의에서 보소가 프로방스 왕으로 뽑혔고(지도는 879년), 880년 리베몽 조약으로 서프랑크의 루이 3세와 카를로만 2세가 로타링기아 서쪽마저 동프랑크의 루트비히 젊은왕에게 넘겼다(지도는 880년). 884년 12월 카를로만 2세가 사냥 사고로 죽자 서프랑크 귀족들은 카를 3세 비만왕(뚱보 샤를)을 불러 885년 왕으로 받아들였고, 보소의 프로방스를 뺀 옛 카롤루스 제국을 한 사람이 다스렸다(881년 황제 대관). 그러나 비만왕은 파리 포위(앞의 사건)에서 바이킹과 돈으로 화해해 신망을 잃고 887년 11월 트리부르에서 폐위되어 888년 1월 죽었다. 888년 서프랑크(오도)·동프랑크(아르눌프)·이탈리아(베렌가리오 1세)·상부르군트(루돌프 1세)가 각자 왕을 세웠고 제국은 다시 합쳐지지 않았다(지도는 888년 트란스유라와 브장송을 상부르군트에 넣는다)."
  subjects: [middle-francia, west-francia, east-francia, italy-carolingian, provence-kingdom, burgundy-kingdom]
  links:
