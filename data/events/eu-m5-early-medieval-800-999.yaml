- id: macedonian-reconquest-934
  year: 934
  endYear: 969
  title:
    ko: "마케도니아 왕조의 반격: 멜리테네(934)에서 크레타(961)·안티오크(969)까지"
  summary:
    ko: "로마노스 1세 레카페노스(재위 920~944) 아래 장군 요안니스 쿠르쿠아스가 동쪽 변경의 아랍 토후국들을 쳐 934년 5월 멜리테네(말라티아)를 얻었다(지도는 934년). 지도는 949년 버전에 테오도시오폴리스(에르주룸)와 하르푸트·에르진잔 일대를 동로마 땅으로 옮기고, 콘스탄티노스 7세(단독 통치 945~959) 때인 958년 요안니스 치미스키스가 사모사타를 되찾았다. 로마노스 2세(재위 959~963)가 보낸 원정군을 니케포로스 포카스가 이끌어 960년 크레타에 상륙했고, 칸닥스(이라클리오)를 960년 여름부터 961년 3월까지 여덟아홉 달 포위한 끝에 함락시켰다. 도시는 약탈되고 많은 사람이 노예가 되었으며 크레타 토후국은 끝났다(지도는 961년). 그는 962년 12월 알레포를 약탈했고, 963년 로마노스 2세가 죽은 뒤 황제 니케포로스 2세가 되어 965년 킬리키아의 타르소스와 몹수에스티아를 얻고 키프로스도 되찾았다(지도는 965년). 966~968년 타론 공국의 바그라투니 가문이 땅을 동로마에 넘겼다(지도는 966년, 아르메니아 왕국들 묶음의 한 몫). 같은 시기 시칠리아에서는 965년 로메타가 시칠리아 토후국에 넘어가 섬 전체가 이슬람 땅이 되었다. 969년 10월 안티오크가 동로마로 돌아왔고(지도는 969년) 니케포로스는 그해 12월 치미스키스 등의 음모로 죽었다. 이 반격으로 동로마는 동쪽 국경을 유프라테스강 쪽으로 밀었고, 688년부터 이어진 키프로스의 공동 통치도 끝났다."
