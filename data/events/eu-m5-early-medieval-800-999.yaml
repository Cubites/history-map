- id: otto-ii-iii-973
  year: 973
  endYear: 999
  title:
    ko: "오토 2세와 오토 3세: 케른텐 분리와 오스트마르크(976), 슬라브 대반란(983), 로마의 황제(996)"
  summary:
    ko: "오토 2세(재위 973~983)는 974년 사촌 바이에른 공 하인리히 2세의 반란을 맞았고 같은 해 덴마크 왕 하랄 푸른이빨에게서 다네비르케를 빼앗았다(983년 하랄이 되찾았다). 976년 하인리히 2세를 폐위하고 케른텐을 바이에른에서 떼어 따로 공작령으로 삼았으며 동쪽 변경에는 바벤베르크 가문의 레오폴트 1세를 변경백으로 앉혔다(지도는 976년에 비너발트 동쪽을 마자르에서 신성 로마 제국으로 옮긴다). 978년 서프랑크의 로타르가 아헨을 기습하자 오토는 파리까지 쫓아갔고 980년 마르귀 조약으로 로렌을 확정했다. 이탈리아 소국들과 남이탈리아를 두고 동로마·시칠리아 토후국과 맞섰으나, 982년 7월 칼라브리아 콜로네 곶에서 칼브 가문 토후국군에게 크게 졌고 983년 12월 로마에서 죽었다. 그해 여름 엘베강 건너 슬라브 부족(류티치 등)이 봉기해 하벨베르크와 브란덴부르크 주교구를 불태우고 사제들을 내쫓았다(슬라브 대반란, 지도는 983년에 브란덴부르크 일대를 서슬라브 땅으로 돌린다). 세 살 오토 3세(재위 983~1002)는 어머니 테오파누와 할머니 아델라이데의 섭정을 받았다. 990년 폴란드와 보헤미아가 슐레지엔을 다투었고(앞의 사건), 996년 오토 3세는 로마에서 황제로 대관하며 사촌 브루노를 첫 독일인 교황 그레고리오 5세로 세웠고 999년에는 제르베르를 교황 실베스테르 2세로 세웠다. 오토 3세는 1000년 그니에즈노를 순례했다(뒤의 사건)."
  subjects: [holy-roman-empire, slavic-tribes, magyars, denmark-medieval, west-francia, lorraine, italian-minor-states, papal-states, byzantine-empire, sicily-emirate, piast-poland, bohemia-duchy]
