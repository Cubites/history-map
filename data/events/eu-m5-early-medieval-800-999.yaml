- id: scandinavia-denmark-sweden-804
  year: 804
  endYear: 995
  title:
    ko: "덴마크와 스웨덴 왕국의 형성: 구드프레드의 아이더강 국경(811)에서 하랄 푸른이빨의 옐링과 승리왕 에리크까지"
  summary:
    ko: "『프랑크 왕국 연대기』는 804년 덴마크 왕 구드프레드를 처음 적는다. 구드프레드는 808년 오보트리트의 교역도시 레리크를 부수고 상인들을 헤데비로 옮겼으며 남쪽 국경에 다네비르케를 쌓았고, 810년 프리슬란트를 약탈한 뒤 암살되었다. 811년 후임 헤밍이 아이더강을 카롤루스 제국과의 경계로 정했다. 826년 하랄 클라크가 루트비히 경건왕 앞에서 세례를 받고 수도사 안스가르가 선교에 나섰으나 이교는 오래 남았다. 854년 호리크 1세가 죽은 뒤 왕위 다툼이 이어졌고 10세기 초 헤데비는 스웨덴 계통으로 보는 올라프 가문이 다스렸다(934년 동프랑크의 하인리히 1세가 쳐서 변경령을 두었다). 지도는 800년부터 덴마크를 하나로 그리고 이런 분열은 그리지 않는다. 고름 노왕(936 무렵~958 무렵)이 덴마크를 다시 묶었고 아들 하랄 푸른이빨(재위 958 무렵~986 무렵)은 옐링에 룬석비를 세워 '덴마크 전체와 노르웨이를 얻고 덴마크인을 그리스도교인으로 만들었다'고 새겼다(세례는 965년 무렵, 지도는 958년에 덴마크 왕국으로 이름을 바꾼다). 974년 신성 로마 제국의 오토 2세가 다네비르케를 빼앗았으나 983년 슬라브 반란 때 하랄이 되찾았다(뒤의 사건). 하랄은 970년 무렵 노르웨이 서부의 호콘 백작을 종주 아래 두었다(지도는 970~974년). 하랄은 986년 무렵 아들 스벤 포크비어드에게 쫓겨났다. 스웨덴은 829년 안스가르가 비르카의 비에른 왕에게 간 일을 『안스가르 전기』가 전하고(지도는 829년부터 스베알란드를 스웨덴 땅으로 그린다), 839년 『생베르탱 연대기』는 동로마 사절과 함께 온 '로스' 사람들이 스웨덴 사람임을 적는다. 970년 무렵 승리왕 에리크가 예탈란드까지 다스렸고(지도는 970년), 아들 올로프 쇠트코눙(재위 995 무렵~1022)이 이었다."
  subjects: [denmark-early, denmark, denmark-medieval, sweden-early, norway-medieval, carolingian-empire, east-francia, holy-roman-empire]
  links:
    - { from: carolingian-empire, to: denmark-early, note: "아이더강 국경(811)" }
    - { from: holy-roman-empire, to: denmark-medieval, note: "다네비르케(974)" }
  tags: [politics]
  sources: ["Birgit Sawyer·Peter Sawyer, Medieval Scandinavia: From Conversion to Reformation, circa 800–1500 (1993)", "Anders Winroth, The Conversion of Scandinavia: Vikings, Merchants, and Missionaries in the Remaking of Northern Europe (2012)", "Bernhard Walter Scholz 옮김, Carolingian Chronicles: Royal Frankish Annals and Nithard's Histories (1970)", "Janet L. Nelson 옮김, The Annals of St-Bertin (1991)"]

- id: caucasus-kingdoms-813
  year: 813
  endYear: 981
  title:
    ko: "캅카스의 기독교 왕조들: 아쇼트 쿠로팔라테스(813)에서 바그라트 3세(978~981)까지"
  summary:
    ko: "아랍 칼리프국이 다스리던 카르틀리(트빌리시 토후국)에서 바그라티오니 가문의 아쇼트 1세가 813년 무렵 남서쪽 타오·클라르제티로 옮겨 '이베리아 수석공'에 오르고(칼리프의 인정은 818년 무렵) 동로마가 준 '쿠로팔라테스' 칭호를 받아 조지아인의 나라를 이루었다(지도는 813년부터 타오-클라르제티). 888년 아다르나세 4세는 '이베리아인의 왕'을 칭하며 카르틀리를 다스렸다. 서쪽의 아브하지아 왕국은 8세기 말 레온 2세가 동로마에서 자립해 세웠고, 904~908년 무렵 콘스탄티네 3세가 카르틀리를 얻었다(지도는 904년). 동쪽 카헤티-헤레티(코레피스코포스 공국)는 따로 남았다. 아르메니아에서는 바그라투니 가문의 아쇼트 1세가 885년 칼리프와 동로마 황제에게서 왕관을 받았다(지도는 885년부터 아르메니아 왕국들 묶음). 아르츠루니 가문은 908년 바스푸라칸 왕국을 세웠고, 909~914년 아제르바이잔의 사지드 왕조가 침입해 아르메니아를 짓밟았다(지도는 그리지 않는다). 타론 공국의 바그라투니 가문(그레고리와 바그라트 형제)은 966~968년 땅을 동로마에 넘겼다(지도는 966년). 다비트 3세(쿠로팔라테스, 재위 966~1000 또는 1001)는 979년 동로마 황제 바실리오스 2세를 도와 반란자 바르다스 스클레로스를 누르고 그 대가로 땅을 얻었다. 그러나 987~989년 바르다스 포카스의 반란에는 포카스 편에 섰고, 패한 뒤 990년 무렵 자기가 죽으면 영토를 동로마에 넘기기로 약속했다(뒤의 사건에서 약속대로 넘어간다). 978년 바그라트 3세가 외가인 아브하지아의 왕위를 이어 서조지아와 삼츠헤 쪽을 한 왕관 아래 두었다(지도는 981년 버전). 이 흐름이 1008년 조지아 왕국으로 이어진다(뒤의 사건)."
  subjects: [tao-klarjeti, abkhazia-kingdom, kakheti-hereti, armenian-kingdoms, byzantine-empire]
  links:
    - { from: byzantine-empire, to: armenian-kingdoms, note: "타론의 양도(966 무렵)" }
    - { from: tao-klarjeti, to: byzantine-empire, note: "다비트 3세의 군사 지원(979)" }
  tags: [politics]
  sources: ["Ronald Grigor Suny, The Making of the Georgian Nation (2판, 1994)", "Donald Rayfield, Edge of Empires: A History of Georgia (2012)", "Richard G. Hovannisian 엮음, The Armenian People from Ancient to Modern Times, vol. 1 (1997)"]

- id: louis-pious-verdun-814
  year: 814
  endYear: 843
  title:
    ko: "루트비히 경건왕과 아들들의 내전: 퐁트누아(841)에서 베르됭 조약(843)까지"
  summary:
    ko: "루트비히 경건왕(재위 814~840)은 817년 제국 계승령으로 맏아들 로타르를 공동 황제로 세우고 피핀과 독일인 루트비히에게 아키텐과 바이에른을 주었다. 그러나 823년 둘째 부인에게서 샤를(뒤의 대머리왕)이 태어나 몫을 다시 나누려 하자 아들들이 되풀이해 반란했고, 833년 6월 '거짓말의 들판'에서 군대가 황제를 버려 로타르가 아버지를 폐위했다(834년 복위). 변경에서는 822년 프랑크푸르트 회의에 아바르 사절이 온 것이 이 칸국의 마지막 기록이 되었고(지도는 822년에 아바르 칸국을 끝낸다), 824년 론세스바예스에서 프랑크군이 바스크인에게 져 이니고 아리스타가 팜플로나를 이끌게 되었다(지도는 824년부터 나바라 왕국). 같은 해 로타르는 로마에서 황제의 사절이 지켜보는 가운데 교황을 뽑게 하는 로마 헌장을 정했다. 840년 6월 경건왕이 죽자 로타르가 제국 전체를 노렸고, 독일인 루트비히와 샤를이 맞서 841년 6월 25일 퐁트누아에서 로타르와 조카 피핀 2세를 꺾었다(사료가 전하는 사망자 수는 과장으로 본다). 842년 2월 두 동생은 스트라스부르에서 군대 앞에서 맹세를 주고받았다(고대 독일어·고대 프랑스어로 적힌 서약문). 843년 8월 베르됭 조약으로 로타르는 이탈리아와 아헨·로마를 잇는 가운데 땅과 황제 칭호를, 샤를은 스헬더·뫼즈·손·론강의 서쪽을, 루트비히는 라인강 동쪽을 받았다. 지도는 843년에 카롤루스 제국을 서프랑크·중프랑크·동프랑크로 나눈다."
  subjects: [carolingian-empire, west-francia, middle-francia, east-francia, navarre, papal-states, avar-khaganate]
