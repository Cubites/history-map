- id: norway-atlantic-872
  year: 872
  endYear: 985
  title:
    ko: "하프르스피오르(872 무렵)에서 그린란드(985 무렵)까지: 노르웨이 왕국과 북대서양의 정착"
  summary:
    ko: "『헤임스크링글라』는 하랄 미발왕이 하프르스피오르 해전에서 서노르웨이의 작은 왕들을 꺾고 노르웨이를 하나로 묶었다고 전한다(연대는 학자마다 870년대에서 900년 무렵까지 갈리며, 지도는 872년부터 노르웨이 왕국을 그린다). 이에 반발한 족장 가운데 일부가 아이슬란드, 오크니, 헤브리디스, 맨섬, 아일랜드로 옮겨 갔다고 한다. 『정착의 책』은 잉골푸르 아르나르손이 874년 무렵 레이캬비크에 자리 잡았다고 전하고, 정착은 930년 무렵까지 이어졌다(이주민 가운데에는 아일랜드와 스코틀랜드 출신의 여자와 노예도 많았다고 본다). 지도는 헤브리디스와 맨섬을 872년부터 노르웨이 땅으로 그리며, 이곳과 더블린의 노르드 사람들이 아일랜드 왕국들의 해안 도시를 이루었다. 930년 족장(고디)들이 싱그베틀리르에 모여 알팅을 열고 왕 없이 법으로 다스리는 아이슬란드 자유국이 시작되었다. 노르웨이에서는 하랄의 아들 에이리크 피도끼왕이 934년 이복동생 호콘 선량왕(잉글랜드 애설스탠의 궁정에서 자랐다)에게 쫓겨나 먼저 오크니로 갔다가 잉글랜드로 가 요크의 왕(데인로)이 되었다가 954년 쫓겨났다. 호콘이 961년 피트야르 전투의 상처로 죽은 뒤 에이리크의 아들들이 이었고, 970년 무렵 덴마크 왕국의 하랄 푸른이빨이 라데의 호콘 시구르손을 서·북 노르웨이의 백작으로 세웠다(지도는 970~974년 덴마크의 종주 관계로 적는다). 아이슬란드에서 살인죄로 쫓겨난 붉은 에이리크는 982년 무렵 서쪽 땅을 탐험했고 985년 무렵 그린란드에 정착지를 세웠다(그린란드는 지도에 없다)."
  subjects: [norway-medieval, iceland-commonwealth, scotland, irish-kingdoms, denmark-medieval, england, danelaw]
  links:
    - { from: norway-medieval, to: iceland-commonwealth, note: "아이슬란드 정착(874 무렵~930)" }
    - { from: denmark-medieval, to: norway-medieval, note: "호콘 백작의 종주 관계(970~974)" }
  tags: [society, politics]
  sources: ["Lee M. Hollander 옮김, Snorri Sturluson, Heimskringla: History of the Kings of Norway (1964)", "Hermann Pálsson·Paul Edwards 옮김, The Book of Settlements: Landnámabók (1972)", "Jesse L. Byock, Viking Age Iceland (2001)", "Birgit Sawyer·Peter Sawyer, Medieval Scandinavia: From Conversion to Reformation, circa 800–1500 (1993)"]
