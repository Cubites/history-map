- id: navarre-castile-barcelona-824
  year: 824
  endYear: 988
  title:
    ko: "팜플로나(나바라)·카스티야·바르셀로나: 이니고 아리스타(824)에서 보렐 2세(988)까지"
  summary:
    ko: "824년 론세스바예스에서 프랑크군이 바스크인에게 진 뒤 이니고 아리스타(재위 824 무렵~852)가 팜플로나를 이끌었다(앞의 사건). 그는 코르도바 아미르국의 변경 가문 바누 카시와 혼인으로 얽혔다. 산초 가르세스 1세(재위 905~925)가 새 왕조를 열어 923년 무렵 나헤라 쪽으로 나아갔다(지도는 924년 라리오하를 나바라 땅으로). 924년 압드 알라흐만 3세는 팜플로나를 약탈하고 도시를 허물었다. 카스티야는 레온 왕국의 동쪽 변경으로, 페르난 곤살레스(재위 931 무렵~970)가 백작령을 하나로 묶어 939년 시망카스에서 싸웠고(앞의 사건) 레온 왕과 갈라서고 화해하기를 거듭하며 사실상 자립했다(지도는 931년부터 카스티야 백국). 아들 가르시 페르난데스(970~995)가 이었다. 팜플로나에서는 산초 가르세스 1세의 아들 가르시아 산체스 1세(재위 925~970)와 그 아들 산초 2세 아바르카(재위 970~994)가 이었다. 동쪽 히스파니아 변경에서는 카롤루스 제국이 801년 바르셀로나를 얻어 에스파냐 변경령을 세웠고, 878년 기프레 1세(털보)가 바르셀로나·지로나·우르헬·세르다냐를 모아 백작령을 세습으로 이었다(지도는 888년부터 바르셀로나 백국). 보렐 2세(재위 947~993)는 985년 알만수르의 원정으로 바르셀로나가 약탈당하자(뒤의 사건) 서프랑크 왕에게 도움을 청했으나 얻지 못했고, 987~988년 위그 카페가 원조를 약속한 편지에 답하지 않고 새로 충성을 서약하지도 않았다. 이것이 카탈루냐 백령이 프랑크 왕관에서 떨어져 나간 일로 흔히 꼽힌다. 세 변경 모두 레온과 코르도바 사이에서 균형을 잡으며 독립 왕국·백국으로 자랐다."
  subjects: [navarre, castile-county, barcelona-county, leon, cordoba-emirate, cordoba-caliphate, west-francia, carolingian-empire]
  links:
    - { from: cordoba-emirate, to: navarre, note: "팜플로나 약탈(924)" }
    - { from: west-francia, to: barcelona-county, note: "보렐 2세의 충성 서약 거부(988)" }
  tags: [politics]
  sources: ["Roger Collins, Early Medieval Spain: Unity in Diversity, 400–1000 (2판, 1995)", "Thomas N. Bisson, The Medieval Crown of Aragon: A Short History (1986)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)"]

- id: sicily-conquest-827
  year: 827
  endYear: 902
  title:
    ko: "아랍의 시칠리아 정복과 크레타(827~902), 바리 토후국과 루도비코 2세(847~871)"
  summary:
    ko: "아글라브 왕조(이프리키야)의 군대가 827년 6월 동로마 반란자 에우페미오스의 청을 받아 시칠리아 마자라에 상륙했다. 시라쿠사 포위는 실패했으나 831년 팔레르모, 843년 메시나, 859년 엔나, 878년 5월 시라쿠사(아홉 달 포위), 902년 타오르미나가 차례로 떨어졌다(지도는 시칠리아 토후국을 831년 팔레르모, 842년 아그리젠토, 843년 메시나, 859년 엔나, 878년 시라쿠사로 넓힌다). 정복은 약탈과 포로 노예 무역을 낳았고, 시라쿠사 함락을 겪은 수사 테오도시오스의 편지는 주민의 학살과 끌려간 포로를 적는다. 한편 코르도바 아미르국에서 쫓겨난 안달루스 사람들이 824~828년 사이 크레타를 차지해 칸닥스를 중심으로 토후국을 세웠다(지도는 827년부터 크레타 토후국). 남이탈리아에서는 840년 무렵 타란토를 얻은 무슬림이 아드리아해까지 위협해 베네치아 함대도 크게 졌다고 베네치아 연대기는 적으며, 847년 무렵 바리에 토후국이 섰다. 846년 무슬림 습격대가 로마 성벽 밖의 성 베드로 대성당을 약탈하자 교황 레오 4세는 레오 성벽을 쌓았다. 871년 2월 이탈리아 왕국의 황제 루도비코 2세가 바리를 함락했고(동로마 함대도 869년부터 포위에 함께했다) 두 제국은 공을 두고 다투었다(지도는 바리를 876년 동로마 땅으로, 877년 버전). 880년 타란토가 동로마로 돌아왔고, 롬바르드·캄파니아 공국들(베네벤토·살레르노·나폴리 등)은 서로 싸우며 무슬림 용병을 쓰기도 했다. 아글라브 왕조가 909년 파티마 왕조에 무너진 뒤에도 토후국은 이어졌고 965년 로메타를 끝으로 섬 전체가 이슬람 땅이 되었다."
