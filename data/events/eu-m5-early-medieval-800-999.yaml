  sources: ["Janet L. Nelson, Charles the Bald (1992)", "Bernhard Walter Scholz 옮김, Carolingian Chronicles: Royal Frankish Annals and Nithard's Histories (1970)", "Rosamond McKitterick, The Frankish Kingdoms under the Carolingians, 751–987 (1983)"]
