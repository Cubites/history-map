- id: scotland-kenneth-843
  year: 843
  endYear: 976
  title:
    ko: "스코틀랜드 왕국의 형성: 케네스 1세(843 무렵)에서 로디언(973)까지"
  summary:
    ko: "포스강 북쪽에는 픽트인의 왕국(포트리우)이 있었고 서쪽 아가일의 달 리아타는 9세기 초 픽트 왕가의 영향 아래 있었다고 보나 직접 지배했는지는 견해가 갈린다. 839년 픽트가 바이킹에게 크게 져 왕 에오가난이 죽었다. 그 뒤 달 리아타 왕 알핀의 아들로 전하는 케네스 1세(키나에드 막 알핀)가 840~841년 달 리아타 왕이 되고 픽트 왕위도 차지했다(어머니나 아내를 통한 픽트 혈통 주장이 있다)(후대의 왕명록은 843년이라 하며, 지도도 이해에 픽트 왕국을 스코틀랜드 왕국으로 이름만 바꾼다). 870년 더블린의 노르드 왕 올라프와 이바르가 클라이드강의 덤바턴 바위(알트 클루트)를 넉 달 포위해 무너뜨리고 많은 사람을 포로로 끌고 갔으며, 스트래스클라이드 왕국은 중심을 고반으로 옮겼다. 헤브리디스와 맨섬은 872년부터 노르웨이 땅으로 그린다(지도). 10세기에 알바 왕들은 잉글랜드 왕과 얽혔다. 콘스탄틴 2세(재위 900~943)는 927년 이먼트에서 애설스탠에게 신종했고 937년 브루넌버에서 더블린의 올라프 구트프리트손과 손잡았다가 졌다(뒤의 사건). 945년 에드먼드가 컴브리아를 맬컴 1세에게 주면서 스트래스클라이드 왕국의 항목이 끝나고 그 땅은 알바 왕가의 하위 왕국이 되었다. 954~962년 인둘프가 에든버러를 차지했고, 후대 스코틀랜드 전승은 973년 체스터에서 에드거를 만난 케네스 2세가 로디언을 넘겨받았다고 전한다(지도는 976년 버전)."
  subjects: [picts, scotland, strathclyde, england, norway-medieval]
  links:
    - { from: england, to: scotland, note: "컴브리아(945)와 로디언(973)" }
    - { from: norway-medieval, to: scotland, note: "헤브리디스와 맨섬의 노르드인(872)" }
  tags: [politics]
  sources: ["Alex Woolf, From Pictland to Alba, 789–1070 (2007)", "Alfred P. Smyth, Warlords and Holy Men: Scotland AD 80–1000 (1984)", "The Anglo-Saxon Chronicle (Michael Swanton 영역, 1996)"]
