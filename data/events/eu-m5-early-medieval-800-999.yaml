- id: cluny-910
  year: 910
  endYear: 994
  title:
    ko: "클뤼니 수도원(910)과 수도원 개혁: 베르노에서 마이욜까지"
  summary:
    ko: "910년 9월 아키텐 공작이자 오베르뉴 백작인 경건공 기욤은 서프랑크 왕국 안 부르고뉴의 클뤼니에 자기 땅을 내놓아 수도원을 세웠다. 설립 증서는 수도원을 베네딕토 규칙에 따라 운영하게 하고, 세속 영주나 지방 주교가 아니라 사도 베드로와 바울, 곧 교황에게만 속하게 했으며, 수도사들이 원장을 직접 뽑게 했다. 첫 원장 베르노(재위 910~927)와 오도(927~942)는 이탈리아의 수도원들(로마와 수비아코 등)까지 개혁했고, 아이마르·마이욜(954~994)·오딜로(994~1049)로 이어지는 긴 임기의 원장들이 클뤼니의 영향을 넓혔다. 수도사들은 하루 대부분을 전례와 죽은 이를 위한 기도에 썼고, 많은 귀족이 기도를 바라며 땅을 바쳤다. 마이욜은 오토 1세(962년부터 신성 로마 황제)와 황후 아델라이데의 존경을 받았다. 그는 972년 또는 973년 알프스를 넘다가 부르군트 왕국(아를 왕국) 프로방스 해안의 프락시네툼에 근거를 둔 무슬림 약탈자들에게 붙잡혀 몸값을 치르고 풀려났고, 이 일은 프로방스 영주들이 973년 무렵 그 근거지를 없애는 계기가 되었다. 왕과 제후의 힘이 약한 때에 교황 직속의 독립된 수도원이 자라난 것이 클뤼니의 특징이며, 12세기에는 분원이 수백 곳(314곳이라는 셈도 있다)에 이르렀다고 한다."
  subjects: [west-francia, aquitaine, papal-states, holy-roman-empire, burgundy-kingdom]
  links:
    - { from: aquitaine, to: papal-states, note: "경건공 기욤의 클뤼니 기증(910)" }
  tags: [culture, society]
  sources: ["Barbara H. Rosenwein, To Be the Neighbor of Saint Peter: The Social Meaning of Cluny's Property, 909–1049 (1989)", "C. H. Lawrence, Medieval Monasticism: Forms of Religious Life in Western Europe in the Middle Ages (3판, 2001)", "H. E. J. Cowdrey, The Cluniacs and the Gregorian Reform (1970)"]

- id: henry-fowler-911
  year: 911
  endYear: 936
  title:
    ko: "작센 왕조의 성립: 콘라트 1세(911)와 하인리히 1세(919~936)"
  summary:
    ko: "911년 9월 루트비히 4세 어린이왕이 죽어 동프랑크의 카롤링거 계통이 끊기자 귀족들은 프랑켄 공 콘라트 1세를 왕으로 뽑았고, 로타링기아 귀족들은 서프랑크의 샤를 단순왕을 택했다(지도는 911년에 로타링기아 전체(아헨·쾰른 포함)를 서프랑크 땅으로 옮기고 알자스는 근사로 동프랑크에 둔다). 콘라트는 슈바벤·바이에른 공작들을 누르지 못한 채 918년 죽으며 오랜 적수 작센 공 하인리히를 후계로 지명했다. 하인리히 1세(재위 919~936)는 919년 프리츨라르에서 왕으로 뽑혀 공작들에게 자치를 인정하고 921년 서프랑크 왕과 본에서 대등한 협정을 맺었다. 923년 샤를 단순왕이 사로잡히자 925년 로타링기아가 동프랑크로 돌아왔다(지도는 925년). 924~926년 무렵 마자르에게 공물을 주고 휴전을 산 뒤 성(부르크)을 쌓고 기병을 길러 933년 3월 리아데에서 이겼다. 928~929년 겨울 서슬라브 부족인 헤벨리의 브레나보르(브란덴부르크)를 차지했고, 929년 달레민치의 가나를 함락해 어른 남자를 모두 죽이고 여자와 아이를 끌고 갔다고 비두킨트는 전한다. 9월 렌첸에서 오보트리트 연합을 꺾었고, 보헤미아 공 바츨라프는 프라하가 포위되자 공물을 약속했다(929년 무렵, 지도는 929년에 브란덴부르크와 마이센 일대를 동프랑크 땅으로 옮긴다). 934년에는 덴마크의 헤데비 일대를 쳐 변경령을 두었다. 936년 7월 하인리히가 죽자 아들 오토가 이었다."
