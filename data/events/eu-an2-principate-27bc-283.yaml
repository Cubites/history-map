  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 53.26, 54.9 (Earnest Cary 영역, Loeb, 1914~1927)", "Strabo(스트라본), Geographica(『지리지』) 12.1~12.3, 14.5 (H. L. Jones 영역, Loeb, 1917~1932)", "Tacitus(타키투스), Annales(『연대기』) 2.42 (John Jackson 영역, Loeb, 1931~1937)", "Stephen Mitchell, Anatolia: Land, Men, and Gods in Asia Minor, vol. 1 (1993)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)"]

- id: julio-claudians-14
  year: 14
  endYear: 68
  title:
    ko: "율리우스-클라우디우스 왕조: 티베리우스·칼리굴라·클라우디우스·네로(14~68)"
  summary:
    ko: "로마 제국의 두 번째 황제인 아우구스투스의 양자 티베리우스(재위 14~37)는 게르마니쿠스를 동방에 보내 아르메니아에 왕을 세우게 했고(17~19), 19년 마로보두우스를 쫓아낸 카투알다마저 밀려나자 로마는 그 추종자들을 도나우강 북쪽에 정착시키고 반니우스를 콰디의 왕으로 세웠다(타키투스 『연대기』 2.62~63. 지도는 이 땅을 게르만 부족 묶음에 둔다). 20년 무렵 사르마티아계 이아지게스가 도나우강과 티서강 사이 평원에 자리 잡았다(지도는 20년 이 평원을 다키아 부족 묶음에서 사르마티아·알란 부족 묶음으로 옮겨 그린다). 티베리우스는 26년부터 카프리섬에 머물며 친위대장관 세야누스에게 정무를 맡기다 31년 그를 처형했고 37년 3월에 죽었다. 칼리굴라(37~41)는 38년 콤마게네를 안티오코스 4세에게 돌려주었으나 원로원과 틀어졌고 41년 1월 24일 근위대 장교들에게 암살되었다. 근위대는 그의 숙부 클라우디우스(41~54)를 황제로 세웠다. 클라우디우스는 관료제를 정비하고 43년 브리타니아를 정복했으며(뒤의 사건) 54년 10월 죽었는데 아내 아그리피나의 독살설이 전한다. 아그리피나의 아들이자 클라우디우스의 양자 네로(54~68)는 초기에 스승 세네카와 친위대장관 부루스의 도움을 받았으나 59년 어머니를 죽이게 했고, 64년 대화재(뒤의 사건) 뒤 황금 궁전을 지었으며, 65년 피소 음모를 진압하며 세네카를 자결하게 했다. 68년 3월 갈리아 총독 빈덱스가, 이어 히스파니아 총독 갈바가 들고일어나자 원로원이 네로를 공적으로 선언했고, 6월 9일 그는 도망치다 자결했다. 이로써 아우구스투스 가문의 황제가 끊겼다."
  subjects: [roman-empire, sarmatian-alan-tribes, dacian-tribes, germanic-tribes, commagene, arsacid-armenia]
  tags: [politics]
  sources: ["Tacitus(타키투스), Annales(『연대기』) 2.42, 2.56, 2.62~63, 4.1~2, 6.50, 12.66~69, 14.1~13, 15.60~74, 16.17~35 (John Jackson 영역, Loeb, 1931~1937)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『티베리우스』『칼리굴라』『클라우디우스』『네로』 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 57~63 (Earnest Cary 영역, Loeb, 1914~1927)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)", "Miriam T. Griffin, Nero: The End of a Dynasty (1984)"]

- id: claudian-conquest-britain-43
  year: 43
  endYear: 60
  title:
    ko: "클라우디우스의 브리타니아 정복(43)과 포스 길 선(47)"
  summary:
    ko: "카이사르가 기원전 55~54년 두 번 건너고도 눌러앉지 못한 브리타니아를 클라우디우스는 43년 아울루스 플라우티우스가 이끄는 4개 군단 안팎과 보조군(합 약 4만으로 어림)으로 건너가 정복했다. 로마군은 켄트의 메드웨이강에서 카투벨라우니의 카라타쿠스와 토고두므누스를 꺾고 템스강을 건넌 뒤, 황제가 합류하자 중심 도시 카물로두눔(콜체스터)을 차지했다. 클라우디우스가 브리타니아에 머문 날은 16일이라고 카시우스 디오가 적는다(60.21). 그의 개선문 비문은 브리튼 왕 열한 명이 항복했다고 전한다. 47년 총독 오스토리우스 스카풀라가 엑서터에서 링컨에 이르는 포스 길 선까지 차지하고 웨일스 접경 부족을 쳤으며, 카라타쿠스는 50년 또는 51년 웨일스에서 패한 뒤 브리간테스 여왕 카르티만두아가 넘겨주어 로마로 끌려갔다가 클라우디우스에게 용서받았다(타키투스 『연대기』 12.33~38). 남쪽의 코기둡누스(레그니)와 이케니 왕 프라수타구스, 북쪽의 브리간테스 여왕 카르티만두아는 로마와 손잡은 종속 왕이었다(지도는 이들을 브리타니아의 종속 왕국들 묶음으로 그린다). 지도는 43년 남동부를, 47년 포스 길 선 이남을 켈트 부족 묶음에서 로마로 옮겨 그린다."
  subjects: [roman-empire, celtic-tribes, british-client-kingdoms]
