- id: boudica-revolt-60
  year: 60
  endYear: 62
  title:
    ko: "부디카의 반란(60 또는 61)"
  summary:
    ko: "이케니의 왕 프라수타구스는 죽으면서 왕국을 두 딸과 황제 네로에게 함께 물려주려 했으나 로마는 유언을 무시하고 왕국을 병합했다. 타키투스에 따르면 로마 관리들이 왕비 부디카를 매질하고 딸들을 욕보였으며, 카시우스 디오는 빌려준 돈의 회수 같은 다른 원인도 든다. 총독 가이우스 수에토니우스 파울리누스가 앵글시섬(모나)의 드루이드를 치러 간 사이 60년(61년이라는 설도 있다) 부디카가 이케니와 트리노반테스를 이끌고 들고일어나 퇴역병 식민시 카물로두눔을 불태우고 구원하러 온 9군단을 꺾었으며, 론디니움(런던)과 베룰라미움(세인트올번스)도 파괴했다. 타키투스는 이 세 곳에서 로마 시민과 동맹한 브리튼 사람 7만 명 남짓이, 카시우스 디오는 8만 명이 반란군에게 학살되었다고 적는다. 파울리누스는 군사 약 1만 명으로 몇 곱절의 반란군을 쳐부쉈다(싸움터의 위치는 알 수 없다). 타키투스는 브리튼 쪽 8만 명에 로마 쪽 400명이 죽었다고 하나 모두 부풀린 숫자로 본다. 부디카는 독약을 먹었다고(타키투스) 또는 병들어 죽었다고(디오) 한다. 반란을 누르는 과정의 로마군 보복이 가혹해 속주가 굶주렸고, 네로는 61~62년 무렵 파울리누스를 소환해 온건한 총독으로 바꿨다. 지도는 브리타니아의 종속 왕국들 묶음 가운데 이케니 땅을 64년부터 로마로, 반란에 가담한 트리노반테스의 땅(에식스)은 43년부터 로마로 그린다. 웨일스와 스코틀랜드는 켈트 부족 묶음에 남는다."
  subjects: [roman-empire, british-client-kingdoms, celtic-tribes]
  links:
    - { from: british-client-kingdoms, to: roman-empire, note: "이케니의 반란(60~61)" }
  tags: [war]
  sources: ["Tacitus(타키투스), Annales(『연대기』) 14.29~39 (John Jackson 영역, Loeb, 1931~1937)", "Tacitus(타키투스), Agricola(『아그리콜라』) 15~16 (M. Hutton 영역, R. M. Ogilvie 개정, Loeb, 1970)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 62.1~12 (Earnest Cary 영역, Loeb, 1914~1927)", "Richard Hingley·Christina Unwin, Boudica: Iron Age Warrior Queen (2005)", "Sheppard Frere, Britannia: A History of Roman Britain (3판, 1987)"]
