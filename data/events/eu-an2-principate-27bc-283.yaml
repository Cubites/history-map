- id: armenia-corbulo-rhandeia-54
  year: 54
  endYear: 66
  title:
    ko: "네로 때의 아르메니아: 코르불로와 란데이아 협정(63), 티리다테스의 대관(66)"
  summary:
    ko: "아르메니아는 로마와 파르티아가 서로 제 편 왕을 앉히려던 완충 지대였다. 51년 이베리아(카르틀리) 왕 파라스마네스 1세의 아들 라다미스투스가 아르메니아 왕 미트리다테스를 죽이고 왕이 되었다가, 52년 파르티아 왕 볼로가세스 1세가 그를 쫓아내고 아우 티리다테스를 앉혔다(타키투스 『연대기』 12.44~51). 네로는 즉위(54) 뒤 코르불로를 동방 사령관에 앉혔고, 코르불로는 58년 아르메니아로 쳐들어가 아르탁사타(58)와 티그라노케르타(59)를 차지하고 로마가 세운 티그라네스 6세를 왕으로 앉혔다. 그러나 62년 카파도키아에서 아르메니아를 맡은 파이투스가 란데이아에서 파르티아군에 포위되어 항복하고 물러났다. 63년 란데이아에서 코르불로와 티리다테스(볼로가세스의 아우)가 만나 타협했는데, 티리다테스가 아르메니아 왕이 되되 로마 황제에게서 왕관을 받는다는 조건이었다. 66년 티리다테스 1세는 로마로 와 네로 앞에서 왕관을 받았고(카시우스 디오 63.1~7), 이로써 아르메니아는 파르티아 왕가(아르사케스) 출신 왕이 로마의 승인으로 다스리는 나라가 되어 두 제국 사이에 약 50년의 평화가 이어졌다. 지도는 란데이아 타협으로 땅이 바뀌지 않는 것으로 보고 아르메니아를 한 왕국으로 그린다."
  subjects: [roman-empire, arsacid-armenia, iberia-kingdom]
  links:
    - { from: roman-empire, to: arsacid-armenia, note: "티리다테스 1세의 대관(66)" }
  tags: [diplomacy, war]
  sources: ["Tacitus(타키투스), Annales(『연대기』) 12.44~51, 13.34~41, 14.23~26, 15.1~31 (John Jackson 영역, Loeb, 1931~1937)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 62.19~23, 63.1~7 (Earnest Cary 영역, Loeb, 1914~1927)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Robert H. Hewsen, Armenia: A Historical Atlas (2001)"]

- id: clients-annexed-38-72
  year: 37
  endYear: 72
  title:
    ko: "종속 왕국의 병합 2: 리키아(43)·트라키아(46)·코티우스 알프스(63)·폰토스(64)·콤마게네(72)"
  summary:
    ko: "37년 즉위한 칼리굴라는 친구 안티오코스 4세에게 콤마게네와 킬리키아 트라케이아의 해안을 주었다. 요세푸스는 37년, 카시우스 디오는 38년으로 적고, 지도는 38년 콤마게네를 되살리고 킬리키아 트라케이아를 카파도키아 왕국에서 콤마게네로 옮겨 그린다. 43년 클라우디우스는 리키아 동맹 안에서 내분이 벌어지자 리키아를 속주로 삼았고(수에토니우스 『클라우디우스』 25), 46년 트라키아 왕 로이메탈케스 3세가 죽고 반란이 일자 트라키아도 속주가 되었다(지도는 46년). 63년 코티우스 2세가 죽자 네로가 코티우스 알프스를 거두었고, 62~64년 사이(통설은 64년) 폰토스 왕 폴레몬 2세가 네로의 뜻으로 물러나자 폰토스 동부(젤라·카비라 쪽 포함)와 콜키스 해안이 로마에 들어갔다(지도는 두 곳을 64년 버전에 묶는다). 72년 베스파시아누스는 시리아 총독 파이투스를 보내 콤마게네 왕 안티오코스 4세를 폐위하고 콤마게네를 시리아 속주에 합쳤다. 요세푸스에 따르면 파이투스는 안티오코스와 아들이 파르티아와 내통한다고 보고했는데, 요세푸스는 이것이 사실인지 모함인지 분명하지 않다고 한다(『유대 전쟁사』 7.219~243). 이로써 소아시아와 알프스의 종속 왕국은 거의 사라졌고, 흑해에는 보스포로스가, 동방에는 아르메니아·이베리아·오스로에네와 나바테아(106년 병합)·에메사·유대의 아그리파 2세 등이 남았다."
  subjects: [roman-empire, commagene, cappadocia-kingdom, lycian-league, odrysian-kingdom, cottian-alps, polemonid-pontus]
  links:
    - { from: roman-empire, to: commagene, note: "콤마게네 병합(72)" }
    - { from: roman-empire, to: odrysian-kingdom, note: "트라키아 병합(46)" }
  tags: [politics]
  sources: ["Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『클라우디우스』 25 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 7.219~243 (H. St. J. Thackeray 영역, Loeb, 1927~1928)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 59.8, 60.8, 60.17 (Earnest Cary 영역, Loeb, 1914~1927)", "Tacitus(타키투스), Annales(『연대기』) 15.1~5 (John Jackson 영역, Loeb, 1931~1937)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)"]

- id: rome-fire-64
  year: 64
  title:
    ko: "로마 대화재(64)와 네로의 그리스도교 박해"
  summary:
    ko: "64년 7월 18일 밤 키르쿠스 막시무스 부근 상점가에서 불이 나 번졌다. 수에토니우스는 엿새 낮 이레 밤을 탔다고 적고, 타키투스는 엿샛날 에스퀼리누스 기슭에서 잡혔던 불이 다시 번졌다고 쓴다. 타키투스에 따르면 로마 14개 구역 가운데 셋이 완전히 타고 일곱이 크게 상했다. 안티움에 있던 네로는 서둘러 돌아와 이재민을 마르스 들판 등에 수용하고 곡물 값을 낮췄으나, 그가 불을 질렀다는 소문이 돌았다. 불탄 터 한가운데에 황금 궁전(도무스 아우레아)을 지으며 의심이 굳어지자 네로는 책임을 로마 사람들이 이미 미워하던 '크리스티아누스'에게 돌렸다. 타키투스는 그리스도(크리스투스)가 티베리우스 때 유대 총독(타키투스는 procurator라 적는다) 폰티우스 필라투스(빌라도)에게 처형되었다고 적으며, 네로의 명으로 붙잡힌 신자들이 짐승 가죽을 쓰고 개에게 찢기거나 십자가에 못 박히거나 밤의 불빛으로 불태워져 죽었고, 이들이 방화죄보다 '인류에 대한 미움' 때문에 벌을 받는다는 이유로 대중이 동정하기도 했다고 쓴다. 수에토니우스는 네로가 새롭고 해로운 미신에 빠진 이 무리를 벌했다고만 짧게 적는다. 기독교 전승은 베드로와 바울이 네로 때 로마에서 순교했다고 하나 해는 64~67년으로 갈린다. 이 박해는 로마 시에 한정되었다고 보는 견해가 많고, 제국 전체 신자에 대한 박해는 250년 데키우스 때에 이른다(뒤의 사건). 화재가 방화인지 사고인지는 타키투스도 사료가 갈린다고 적는다."
  subjects: [roman-empire]
  tags: [society, religion]
  sources: ["Tacitus(타키투스), Annales(『연대기』) 15.38~44 (John Jackson 영역, Loeb, 1931~1937)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『네로』 16, 38 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 62.16~18 (Earnest Cary 영역, Loeb, 1914~1927)", "Miriam T. Griffin, Nero: The End of a Dynasty (1984)", "W. H. C. Frend, Martyrdom and Persecution in the Early Church (1965)"]

- id: jewish-war-66
  year: 66
  endYear: 73
  title:
    ko: "유대 전쟁(66~73): 예루살렘 함락과 성전 파괴(70), 마사다"
  summary:
    ko: "총독 게시우스 플로루스의 가혹한 통치와 카이사레아의 그리스인·유대인 충돌, 성전 금고의 약탈에 맞서 66년 예루살렘에서 반란이 일어났고 시리아 총독 케스티우스 갈루스가 벳호론 고갯길에서 크게 졌다. 67년 네로가 보낸 베스파시아누스가 갈릴래아를 평정하며 요타파타를 함락시켰는데, 이곳 지휘관이던 요세푸스는 로마에 항복한 뒤 플라비우스 가문의 후원 아래 『유대 전쟁사』를 썼다. 68~69년 로마의 내전으로 공격이 멈췄다가, 황제가 된 아버지를 대신해 아들 티투스가 70년 봄부터 예루살렘을 에워쌌다. 도시 안에서는 파벌이 서로 싸웠다. 그해 8월 성전이 불탔고(전통 날짜는 아브월 9일 무렵) 9월 도시가 함락되었다. 요세푸스는 예루살렘에서 110만 명이 죽고 9만 7천 명이 로마군에 사로잡혔다고 쓰는데(굶주림과 파벌 싸움, 로마군의 학살이 겹쳤다) 현대 학계는 숫자가 훨씬 부풀려졌다고 본다. 71년 로마에서 티투스와 베스파시아누스의 개선식이 열렸고(티투스 개선문에 성전의 기물이 새겨짐), 유대인에게는 유피테르 신전에 바치는 세금(피스쿠스 유다이쿠스)이 매겨졌다. 마지막 거점 마사다는 73년(74년이라는 설도 있다) 총독 플라비우스 실바가 함락했고, 요세푸스는 안에 있던 960명이 항복 대신 집단 자결했다고 적는데 이는 그의 서술에만 의존하며 고고학 증거와의 관계를 둘러싼 논쟁이 있다."
  subjects: [roman-empire]
  tags: [war]
  sources: ["Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 2~7 (H. St. J. Thackeray 영역, Loeb, 1927~1928)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 65.4~7 (Earnest Cary 영역, Loeb, 1914~1927)", "Martin Goodman, Rome and Jerusalem: The Clash of Ancient Civilizations (2007)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)"]
