- id: crisis-third-century-235
  year: 235
  endYear: 283
  title:
    ko: "3세기의 위기와 군인 황제들(235~284)"
  summary:
    ko: "235년 알렉산데르 세베루스가 라인강 군단의 반란으로 죽은 뒤 약 50년 동안 군대가 황제를 세우고 죽이는 '군인 황제' 시대가 이어졌다. 막시미누스 트락스(235~238), 고르디아누스 1·2세(238, 몇 주)와 푸피에누스·발비누스(238), 고르디아누스 3세(238~244), 필리푸스 아라브스(244~249), 데키우스(249~251, 아브리투스에서 전사), 트레보니아누스 갈루스(251~253), 아이밀리아누스(253), 발레리아누스(253~260)와 아들 갈리에누스(253~268), 클라우디우스 2세(268~270), 퀸틸루스(270), 아우렐리아누스(270~275), 타키투스(275~276), 플로리아누스(276), 프로부스(276~282), 카루스(282~283)가 차례로 섰고(공동 황제 필리푸스 2세·헤렌니우스·호스틸리아누스·볼루시아누스 등은 줄였다), 283년 카루스가 페르시아 원정 중 죽자 아들 카리누스와 누메리아누스가 이었다(284년은 뒤의 사건). 이 밖에도 황제를 칭한 찬탈자가 많아 『로마 황제 열전』은 '서른 명의 참주'를 꼽는다. 안팎의 위기가 겹쳤다. 라인·도나우 국경에는 알레만인·프랑크·고트 같은 게르만 부족의 침입이, 동방에는 사산 왕조의 공격이 이어졌고(사산 왕조는 앞의 사건, 고트족은 뒤의 사건), 249년 이집트에서 시작해 251년 로마에 이른 키프리아누스 역병(통설 249~262)이 번졌으며, 군대 급료를 대려 은화의 은 함량을 거의 없앨 만큼 줄이면서 물가가 치솟았다. 260년대에는 제국이 서쪽의 갈리아 제국과 동쪽의 팔미라로 사실상 갈라졌다가(뒤의 사건) 아우렐리아누스가 다시 통일했다. 위기가 얼마나 깊었는지는 지역마다 달라 학자들은 피해가 고르지 않았다고 본다. 같은 때 동아시아에서는 위가 263년 촉을 멸했고, 265년 사마씨의 서진이 위를 이어 280년 오를 멸해 통일했다."
  subjects: [roman-empire, germanic-tribes, gallic-empire, cao-wei, shu, wu, western-jin]
  links:
