- id: aurelian-restoration-270
  year: 270
  endYear: 275
  title:
    ko: "아우렐리아누스의 제국 재통일(270~275)과 다키아 포기(271)"
  summary:
    ko: "클라우디우스 2세가 270년 역병으로 죽자 동생 퀸틸루스가 잠시 황제를 칭했으나 도나우 군단이 추대한 아우렐리아누스가 몇 달 안에 제위를 잡았다. 그는 270~271년 유튼기와 반달, 사르마티아인(지도의 사르마티아·알란 부족 묶음)을 막았고, 271년 북이탈리아로 쳐들어온 유튼기에게 한 번 패한 뒤 이겨 몰아냈으며, 로마 시에 둘레 19km의 '아우렐리아누스 성벽'을 쌓기 시작했다(271~275). 같은 해 도나우강 북쪽의 다키아 속주를 버리고 군대와 행정관, 주민 일부를 도나우 남쪽으로 옮겼다(에우트로피우스 9.15. 해에 대해서는 274~275년이라는 설도 있다. 지도는 271년 트란실바니아·올테니아·몰다비아를 고트·게피드·타이팔리 등이 든 게르만 부족 묶음으로(카르피 같은 다키아계 부족도 지도에서는 이 묶음에 합친다), 바나트 산지를 사르마티아로 그린다). 다키아에 남은 주민의 로마화와 중세 루마니아인의 기원을 둘러싼 논쟁은 지금도 이어진다. 272~273년 팔미라를, 274년 갈리아 제국을 되찾아(앞의 사건) '세계의 복원자'로 불렸고, 274년 로마에 '불패의 태양신(솔 인빅투스)'의 신전을 세웠다. 275년 가을 트라키아 원정길에 비서 에로스의 거짓말에 속은 근위대 장교들에게 암살되었다."
  subjects: [roman-empire, dacian-tribes, germanic-tribes, sarmatian-alan-tribes, gallic-empire]
