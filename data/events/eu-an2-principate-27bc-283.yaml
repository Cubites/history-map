- id: antonine-plague-165
  year: 165
  endYear: 180
  title:
    ko: "안토니누스 역병(165~180)"
  summary:
    ko: "165년 소아시아 스미르나에서 처음 기록되었고, 루키우스 베루스의 파르티아 원정군이 셀레우키아를 에워싼 165~166년 겨울 전염병이 군대에 퍼져 군대를 따라 제국 전역으로 번졌다(166년 로마, 172년 대부분의 지방). 의사 갈레노스가 증상을 적었는데 열과 설사, 피부 발진이 나타났다고 하며 천연두였을 가능성이 크지만 확정하지는 못했다(홍역이라는 설도 있다). 사망자는 학자에 따라 150만에서 2천 500만 명까지 갈리며 흔히 500만~1천만 명으로, 인구의 10% 안팎(도시와 군대는 15% 가량)으로 어림한다. 169년 1~2월 알티눔(아퀼레이아 서남쪽)에서 죽은 루키우스 베루스를 역병 탓으로 보는 설도 있다(졸중이라는 기록도 있다). 마르쿠스 아우렐리우스도 180년 죽었는데 역병이 원인인지는 분명하지 않다. 카시우스 디오는 189년 로마에서 역병이 다시 퍼져 하루 2천 명이 죽었다고 적는다. 역병은 군단의 결원과 마르코만니 전쟁 때의 충원난(『로마 황제 열전』은 마르쿠스가 검투사와 노예, 도적까지 징집했다고 적는다)과 이어지며 인도양 교역의 쇠퇴와도 이어 보지만, 제국 쇠퇴의 원인이었는지는 학자들이 다툰다."
  subjects: [roman-empire]
  tags: [society]
  sources: ["Galen(갈레노스), Methodus Medendi(『치료법』) 5.12", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 72.14, 73.14 (Earnest Cary 영역, Loeb, 1914~1927)", "Historia Augusta(『로마 황제 열전』) 『마르쿠스 아우렐리우스』 17, 21 (David Magie 영역, Loeb, 1921~1932)", "Kyle Harper, The Fate of Rome: Climate, Disease, and the End of an Empire (2017)", "R. P. Duncan-Jones, 'The Impact of the Antonine Plague', Journal of Roman Archaeology 9 (1996)"]

- id: rome-han-silk-road-27bc
  year: -26
  endYear: 166
  title:
    ko: "로마와 한: 비단길의 교역과 감영(97)·대진왕 안돈의 사절(166)"
  summary:
    ko: "전한 무제 때 장건이 서역으로 가는 길을 연 뒤(기원전 138~126) 한은 기원전 60년 서역도호부를 두어 오아시스 도시들을 관리했다. 로마인은 비단을 '세레스의 천'이라 부르며 사들였고 아우구스투스 때부터 퍼졌다. 16년 원로원이 남자의 비단옷을 금지했고(타키투스 『연대기』 2.33), 대플리니우스는 해마다 인도·세레스·아라비아로 빠져나가는 돈이 적게 잡아도 1억 세스테르티우스라며 사치를 탓했다(『박물지』 12.84). 로마와 한이 직접 이어진 것은 아니어서 파르티아 상인이 중간에서 이익을 보았다. 왕망의 신(9~23)이 들어선 뒤 한과 서역의 관계가 끊겼다가 후한(25~220)이 선 뒤 반초가 73년부터 서역을 되찾아 91년 서역도호가 되었고, 북흉노는 89~91년 후한군에 쫓겨 서쪽으로 갔다. 97년 반초가 부하 감영을 대진(로마)에 보냈으나 감영은 페르시아만 가까운 조지에서, 바닷길이 순풍이면 석 달이고 아니면 2년이 걸린다는 안식(파르티아) 뱃사람의 말을 듣고 되돌아왔다. 『후한서』는 166년 대진왕 안돈(安敦)이 일남 변경으로 사신을 보내 상아·무소뿔·바다거북 껍질을 바쳤다고 적는다. 안돈은 안토니누스(안토니누스 피우스 또는 마르쿠스 아우렐리우스)로 보는 설이 많으나 황제가 보낸 사절이 아니라 상인이었을 것이라고 보는 학자도 있다. 같은 때 한반도 북부에서는 낙랑군이 이어졌고 고구려는 56년 옥저를 복속시켰다(`taejo-okjeo-56`)."
  subjects: [roman-empire, western-han, xin, eastern-han, xiongnu, nangnang, goguryeo, okjeo]
