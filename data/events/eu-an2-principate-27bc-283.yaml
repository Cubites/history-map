- id: trajan-parthian-war-113
  year: 113
  endYear: 117
  title:
    ko: "트라야누스의 파르티아 원정(113~117)과 최대 판도: 아르메니아·메소포타미아 속주"
  summary:
    ko: "파르티아 왕 오스로에스 1세가 로마의 동의 없이 조카 파르타마시리스를 아르메니아 왕에 앉히자, 트라야누스는 이를 구실로 113년 원정에 나섰다(카시우스 디오는 영광을 바란 것이라 평한다). 114년 아르메니아를 속주로 삼았고(지도는 114~116년 아르메니아를 로마 땅으로 그린다), 115~116년 북메소포타미아와 오스로에네를 차지해 속주 메소포타미아를 세웠으며 116년 파르티아의 수도 크테시폰을 함락시키고 페르시아만까지 내려갔다. 이때 로마 제국의 영토가 가장 넓었다(약 500만 km²). 그러나 115~117년 키레나이카·이집트·키프로스·메소포타미아에서 디아스포라 유대인의 큰 반란이 터졌고 점령지에서도 반란이 일어났다. 117년 하트라 포위가 실패했고 트라야누스는 8월 8일 무렵 킬리키아의 셀리누스에서 죽었다. 뒤를 이은 하드리아누스는 새 속주를 포기했다(뒤의 사건). 흑해 동안에 대해 아리아노스(『흑해 주항기』 11, 131년 무렵 하드리아누스에게 보낸 글)는 라지인의 왕 말라사스가 하드리아누스에게서, 압실리아인의 왕 율리아누스가 트라야누스에게서 왕위를 받았다고 적는다(지도는 이를 근거로 117년부터 서조지아를 라지카 왕국으로 그린다)."
  subjects: [roman-empire, arsacid-armenia, lazica]
  links:
    - { from: roman-empire, to: arsacid-armenia, note: "아르메니아 속주(114~117)" }
