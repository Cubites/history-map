  sources: ["Eutropius(에우트로피우스), Breviarium(『로마사 요약』) 9.13~15 (H. W. Bird 영역, 1993)", "Historia Augusta(『로마 황제 열전』) 『아우렐리아누스』 (David Magie 영역, Loeb, 1921~1932)", "Zosimus(조시모스), New History(『새 역사』) 1.48~62 (Ronald T. Ridley 영역, 1982)", "Dietmar Kienast, Römische Kaisertabelle (3판, 2004)", "Alan K. Bowman·Peter Garnsey·Averil Cameron 엮음, The Cambridge Ancient History XII (2판, 2005)"]

- id: bosporus-crimean-scythia-14bc
  year: -13
  endYear: 256
  title:
    ko: "보스포로스 왕국과 크림 스키타이(기원전 14~기원후 256)"
  summary:
    ko: "흑해 북안의 보스포로스 왕국(케르치 해협 양쪽)은 기원전 63년 미트리다테스 6세가 죽은 뒤 로마와 손잡은 왕들이 이어 다스렸다. 기원전 14년(카시우스 디오 54.24에 따른 해) 아그리파가 폰토스의 폴레몬 1세를 보스포로스에 앉혔으나 현지의 반발로 폴레몬은 기원전 8년 무렵 아스푸르기아니족에게 붙잡혀 살해되었다(스트라본). 그 뒤 폴레몬의 아내이자 아산드로스의 미망인인 여왕 디나미스가 기원후 7~8년 무렵까지 다스렸고, 그 아들 아스푸르고스가 이어받아 14년 아우구스투스와 원로원의 승인을 받았다. 이 가문은 로마식 이름(티베리우스 율리우스)을 썼다. 45년 무렵 클라우디우스는 칼리굴라가 39년 세운 왕 미트리다테스를 폐하고 그의 아우 코튀스를 세웠다. 49년 미트리다테스가 아오르시 등 사르마티아·알란 계통 부족과 함께 돌아오자 로마 보조군이 코튀스를 도와 우스페를 포위해 항복받았다(타키투스 『연대기』 12.15~21). 이후 보스포로스는 로마의 종속 왕국으로 3세기까지 이어졌다. 크림 안쪽의 크림 스키타이 왕국(수도 네아폴리스, 지금의 심페로폴 부근)은 기원전 2세기 스킬루로스 때 전성기를 누린 뒤 보스포로스의 압박 속에 버텼고, 63년 무렵 케르소네소스를 에워싼 스키타이를 로마 총독 플라우티우스 실바누스가 막았다. 256년 무렵 고트족과 보라니의 습격으로 네아폴리스가 불타 스키타이 왕국이 끝났다(지도는 256년 크림을 고트로 그린다). 보스포로스 왕국은 4세기 후반 사료에서 사라진다(훈의 진출과 겹친다. 뒤의 사건)."
  subjects: [bosporan-kingdom, crimean-scythia, roman-empire, sarmatian-alan-tribes]
