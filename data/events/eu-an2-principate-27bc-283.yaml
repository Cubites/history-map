- id: severan-dynasty-193
  year: 193
  endYear: 235
  title:
    ko: "세베루스 왕조(193~235)와 카라칼라의 시민권 칙령(212)"
  summary:
    ko: "192년 콤모두스가 암살된 뒤 페르티낙스는 석 달 만에 근위대에 죽었고 제위를 산 디디우스 율리아누스도 곧 쫓겨났다. 판노니아 군단이 환호한 셉티미우스 세베루스는 193년 로마에 들어와 동방의 페스켄니우스 니게르(194년 이수스에서 패함)와 브리타니아의 클로디우스 알비누스(197년 2월 루그두눔에서 패함)를 꺾고 홀로 황제가 되었다(193~211). 군인 급료를 올려 군대를 후원했고, 195년과 198년 파르티아로 쳐들어가 크테시폰을 약탈하고 북메소포타미아에 속주를 세웠다(지도는 195년 마르딘과 디야르바크르 일대를 파르티아 직할지와 아르메니아 왕국에서 로마 땅으로 옮겨 그린다). 208~211년 아들들과 브리타니아에서 칼레도니아 원정에 나섰다가 211년 2월 4일 에보라쿰에서 죽었다. 198년부터 아버지와 공동 황제였던 카라칼라(단독 211~217)는 209년부터 공동 황제이던 동생 게타를 211년 12월 살해하고 212년 제국의 모든 자유민에게 로마 시민권을 준 안토니누스 칙령을 냈다. 카시우스 디오는 세금을 더 거두려는 속셈이라 했지만 학자들은 이유를 달리 짐작한다. 213년 오스로에네 왕 아브가르 9세를 아들과 함께 로마로 불러 죽이고(디오는 213년경으로 적는다) 214년 왕국을 속주에 병합했으며(지도는 214년) 217년 4월 카라이 부근에서 암살되었다. 마크리누스(217~218, 아들 디아두메니아누스와 공동)·엘라가발루스(218~222)·알렉산데르 세베루스(222~235)가 이었고 235년 알렉산데르가 병사들 손에 죽으며 왕조가 끝났다. 224년 사산 왕조가 일어난 일은 뒤의 사건이다. 같은 무렵 동아시아에서는 후한이 220년 황제 자리를 위에 넘기며 끝났고 이듬해 촉(221), 그다음 해 오(222)가 일어나 삼국 시대가 열렸다."
