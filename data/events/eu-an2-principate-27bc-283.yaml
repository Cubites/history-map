- id: hadrian-117
  year: 117
  endYear: 138
  title:
    ko: "하드리아누스의 후퇴와 제국의 정비(117~138)"
  summary:
    ko: "트라야누스가 117년 죽자 시리아 총독 하드리아누스가 군대의 환호로 황제가 되었다(트라야누스의 아내 플로티나가 입양을 꾸몄다는 이야기가 전한다). 그는 메소포타미아와 아르메니아 속주를 포기하고 파르티아와 강화했으며(지도는 117년 아르메니아를 왕국으로 되돌린다), 118년에는 다키아 속주 동쪽의 무테니아(왈라키아)를 버렸다(지도는 118년 이 땅을 다키아 부족으로 돌려놓는다. 올테니아와 트란실바니아는 유지). 118년 트라야누스의 장군 넷이 반역죄로 처형되어 원로원과 사이가 틀어졌다. 121~132년 제국을 두루 순시하며 군대를 훈련시키고 국경에 방벽과 요새를 쌓았다(브리타니아의 방벽은 뒤의 사건). 그리스 문화를 사랑해 아테네에 올림피아 제우스 신전을 완성했고 로마에서는 판테온을 새로 지었다(126년 무렵 완공). 130년 이집트에서 총애하던 안티노오스가 나일강에서 죽자 도시를 세우고 신으로 모셨다. 132년 유대 반란이 일어났고(뒤의 사건) 135년 진압되었다. 136년 후계로 삼은 루키우스 아일리우스가 138년 1월 죽자 안토니누스(피우스)를 양자로 세우되 그가 마르쿠스 아우렐리우스와 루키우스 베루스를 입양하도록 했고, 138년 7월 10일 바이아이에서 죽었다."
  subjects: [roman-empire, arsacid-armenia, dacian-tribes]
  tags: [politics]
  sources: ["Historia Augusta(『로마 황제 열전』) 『하드리아누스』 (David Magie 영역, Loeb, 1921~1932)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 69 (Earnest Cary 영역, Loeb, 1914~1927)", "Anthony R. Birley, Hadrian: The Restless Emperor (1997)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: british-walls-105
  year: 105
  endYear: 162
  title:
    ko: "스코틀랜드 저지대의 포기(105 무렵)와 하드리아누스 방벽(122), 안토니누스 방벽(142~162)"
  summary:
    ko: "아그리콜라가 놓은 스코틀랜드 저지대의 요새선은 105년 무렵 뉴스테드 같은 요새가 불타면서 버려졌고, 로마의 경계는 타인강과 솔웨이만을 잇는 스타네게이트 길의 요새선으로 물러났다(지도는 105년 저지대를 켈트 부족 땅으로 돌린다). 122년 하드리아누스가 브리타니아를 찾아오자 총독 아울루스 플라토리우스 네포스가 로마인과 이민족을 가르는 방벽을 쌓기 시작했다(『로마 황제 열전』 『하드리아누스』 11). 방벽은 서쪽 솔웨이에서 동쪽 타인강 어귀까지 80로마마일(약 118km)이며 돌과 뗏장으로 쌓고 일정한 간격으로 마일 요새와 보루, 요새를 두었다. 142년 안토니누스 피우스는 총독 퀸투스 롤리우스 우르비쿠스에게 북쪽으로 포스강과 클라이드강 사이에 뗏장 방벽(길이 약 60km)을 쌓게 했다(지도는 142년 저지대를 로마 땅으로 그린다). 160년대 초(지도는 162년) 로마는 이 방벽을 버리고 하드리아누스 방벽으로 물러났다. 208~211년 셉티미우스 세베루스가 칼레도니아에 원정했으나 땅을 차지하지는 못했다(뒤의 사건). 방벽의 목적(방어 장벽인지, 사람과 물자를 통제하는 선인지)과 안토니누스 방벽을 버린 이유는 지금도 논쟁거리다."
  subjects: [roman-empire, celtic-tribes]
  tags: [politics, war]
  sources: ["Historia Augusta(『로마 황제 열전』) 『하드리아누스』 11 (David Magie 영역, Loeb, 1921~1932)", "Historia Augusta(『로마 황제 열전』) 『안토니누스 피우스』 5 (David Magie 영역, Loeb, 1921~1932)", "David J. Breeze·Brian Dobson, Hadrian's Wall (4판, 2000)", "David J. Breeze, The Frontiers of Imperial Rome (2011)", "Sheppard Frere, Britannia: A History of Roman Britain (3판, 1987)"]

- id: bar-kokhba-revolt-132
  year: 132
  endYear: 136
  title:
    ko: "바르 코크바 반란(132~136)과 유대 땅의 변화"
  summary:
    ko: "카시우스 디오에 따르면 하드리아누스가 예루살렘을 로마 식민시 아일리아 카피톨리나로 다시 짓고 유피테르 신전을 세우려는 데 분노한 유대인이 132년 시몬 바르 코시바(바르 코크바)를 중심으로 들고일어났다. 『로마 황제 열전』은 할례 금지를 원인으로 꼽지만 이것이 반란 전의 조치인지 뒤의 처벌인지, 사료를 믿을 수 있는지 학자들이 다툰다. 반란군은 한때 유대 땅 대부분을 쥐고 동전과 편지에서 시몬을 '이스라엘의 나시(지도자)'라 불렀다(편지의 이름은 코시바이고, 별의 아들이라는 뜻의 바르 코크바는 기독교 사료에만 나온다). 하드리아누스는 브리타니아 총독 섹스투스 율리우스 세베루스를 불러 진압을 맡겼고 로마군은 최소 9개 군단의 병력을 모아 마을과 요새를 하나씩 쳐 나갔다. 135년 마지막 거점 베타르가 함락되어 바르 코크바가 죽었다. 디오는 마을 985곳과 요새 50곳이 부서지고 58만 명이 죽었다고 적는데 과장된 수로 보며, 포로가 되어 노예로 팔린 이도 많았고 로마군의 손실도 컸다. 전쟁 뒤 유대인은 예루살렘 출입을 금지당했고 유대 속주는 시리아 팔레스티나로 이름이 바뀌었으며 랍비 아키바 같은 지도자가 처형되었다. 금지의 일부는 하드리아누스가 죽은 뒤 풀렸다."
  subjects: [roman-empire]
  tags: [war]
  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 69.12~14 (Earnest Cary 영역, Loeb, 1914~1927)", "Historia Augusta(『로마 황제 열전』) 『하드리아누스』 14 (David Magie 영역, Loeb, 1921~1932)", "Peter Schäfer, The Bar Kokhba War Reconsidered (2003)", "Hanan Eshel, 'The Bar Kokhba Revolt, 132–135', The Cambridge History of Judaism IV (2006)", "Anthony R. Birley, Hadrian: The Restless Emperor (1997)"]
  places:
    - { name: 베타르(바티르), at: [35.14, 31.72], year: 135 }

- id: five-good-emperors-96
  year: 96
  endYear: 192
  title:
    ko: "오현제의 시대(96~180)와 입양 계승의 끝, 콤모두스(180~192)"
  summary:
    ko: "도미티아누스가 암살된 96년 원로원 의원 네르바가 황제가 되었고, 97년 10월 군대에서 인기 있던 트라야누스를 양자로 세우고 98년 1월 죽었다. 이후 트라야누스(98~117), 하드리아누스(117~138), 안토니누스 피우스(138~161), 마르쿠스 아우렐리우스(161~180, 161~169년에는 루키우스 베루스와, 177년부터는 아들 콤모두스와 공동 황제)까지 다섯 황제가 혈통이 아니라 가장 뛰어난 사람을 양자로 세워 이었다(아들이 없었거나 먼저 죽은 경우가 많았고 하드리아누스의 입양에는 논란이 있다). 마키아벨리가 『로마사 논고』에서 이들을 '다섯 선한 황제'라 부른 데서 오현제라는 말이 나왔다. 기번은 『로마 제국 쇠망사』 3장에서 도미티아누스가 죽은 때부터 콤모두스의 즉위까지를 인류사에서 가장 행복하고 번영한 시기로 꼽았다. 이 시기 지중해 둘레에 도시와 도로가 늘었다. 112년 무렵 소 플리니우스가 비티니아 총독으로서 그리스도교도를 어떻게 다룰지 트라야누스에게 묻자 황제는 일부러 찾아내지는 말되 고발되어 끝내 제사를 거부하는 이는 벌하라고 답했다(『서간집』 10.96~97). 양자 계승은 마르쿠스가 친아들 콤모두스에게 제위를 물려주며 끝났고, 콤모두스(단독 180~192)는 검투 경기에 직접 나서는 등 기행으로 원로원과 틀어지다 192년 12월 31일 밤 암살되었다. 이듬해의 내전은 뒤의 사건이다."
  subjects: [roman-empire]
  tags: [politics]
  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 68~73 (Earnest Cary 영역, Loeb, 1914~1927)", "Pliny the Younger(소 플리니우스), Epistulae(『서간집』) 10.96~97 (Betty Radice 영역, Loeb, 1969)", "Edward Gibbon, The History of the Decline and Fall of the Roman Empire, 3장 (1776)", "Niccolò Machiavelli, Discorsi sopra la prima Deca di Tito Livio(『로마사 논고』) 1.10 (1531)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI (2판, 2000)"]

- id: marcomannic-wars-166
  year: 166
  endYear: 180
  title:
    ko: "마르코만니 전쟁(166~180)과 마르쿠스 아우렐리우스"
  summary:
    ko: "161년 마르쿠스 아우렐리우스가 루키우스 베루스와 공동 황제가 되었고, 베루스가 동방에서 파르티아와 싸우는 동안(161~166) 도나우강 국경이 흔들렸다. 166년 롬바르드와 오비이 6천 명이 판노니아를 넘었다가 격퇴되었고, 이어 마르코만니와 콰디를 비롯한 여러 부족이 도나우강을 넘어 노리쿰을 거쳐 북이탈리아로 들어와 오데르조를 불태우고 아퀼레이아를 에워쌌다(침입 해는 167년 또는 170년으로 갈린다). 기원전 101년 킴브리 이후 처음으로 이탈리아에 들어온 적이었다. 마르쿠스는 169년 1월 베루스가 죽은 뒤 홀로 황제가 되어 새 군단을 모으고 이탈리아·알프스 방어선을 쌓았으며, 171~172년 이들을 몰아내 마르코만니·콰디와 강화하고 '게르마니쿠스' 칭호를 얻었다. 이아지게스(지도는 사르마티아·알란 부족 묶음)는 175년 항복해 마르쿠스에게 '사르마티쿠스' 칭호를 안겼고 기병 8천을 보조군으로 내놓았다. 175년 동방의 아비디우스 카시우스 반란으로 잠시 멈췄다가 177~180년 마르코만니와 콰디가 다시 일어났다. 『로마 황제 열전』은 마르쿠스가 도나우 북쪽에 마르코만니아와 사르마티아 속주를 세우려 했다고 전하나, 그는 180년 3월 17일 빈도보나(시르미움이라는 설도 있다)에서 죽었고 콤모두스가 강화하고 물러났다. 『명상록』 일부는 이 진중에서 쓰였다. 171년 하스딩 반달이 지금의 우크라이나 서부 갈리치아의 코스토보키 땅으로 들어왔다(카시우스 디오 72.12. 지도는 171년 이 땅을 다키아 부족 묶음에서 게르만 부족 묶음으로 옮겨 그린다)."
