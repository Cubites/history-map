- id: palmyra-zenobia-267
  year: 267
  endYear: 273
  title:
    ko: "팔미라의 오데나투스와 제노비아(260년대~273)"
  summary:
    ko: "팔미라는 시리아 사막에서 대상 무역으로 번성한 도시였다. 260년 발레리아누스가 사산에 사로잡힌 뒤 팔미라의 귀족 셉티미우스 오데나투스가 로마 편에서 사산군을 쳐 크테시폰 앞까지 갔고, 갈리에누스에게서 동방 전체의 지휘를 맡았다. 267년(268년이라는 설도 있다) 오데나투스가 암살되자 아내 제노비아가 어린 아들 바발라투스를 앞세워 섭정으로 실권을 쥐었다. 제노비아는 270년 이집트를 차지하고 소아시아의 안키라까지 군대를 보냈으며 272년 초(271년 말이라는 설도 있다) 아들을 '아우구스투스'로 칭하며 로마에서 떨어져 나가려 했다. 272년 아우렐리아누스가 소아시아를 되찾고 시리아에서 이마이와 에메사의 두 전투에서 이긴 뒤 팔미라를 에워싸 제노비아를 사로잡았다. 273년 팔미라가 다시 반란하자 아우렐리아누스가 도시를 파괴했다. 제노비아는 274년 개선식에 끌려 나왔고 그 뒤 로마 근교에서 살았다고 전한다. 팔미라는 지도 권역 밖에 있어 그리지 않았다."
  subjects: [roman-empire]
  tags: [war, politics]
  sources: ["Historia Augusta(『로마 황제 열전』) 『서른 명의 참주』 15~17·30, 『아우렐리아누스』 22~35 (David Magie 영역, Loeb, 1921~1932)", "Zosimus(조시모스), New History(『새 역사』) 1.39~61 (Ronald T. Ridley 영역, 1982)", "Fergus Millar, The Roman Near East, 31 B.C.–A.D. 337 (1993)", "Pat Southern, Empress Zenobia: Palmyra's Rebel Queen (2008)"]
