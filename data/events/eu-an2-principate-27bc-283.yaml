- id: anatolian-clients-annexed-25bc
  year: -24
  endYear: 17
  title:
    ko: "소아시아 종속 왕국의 병합 1: 갈라티아(기원전 25)·파플라고니아(기원전 6)·폰토스 갈라티쿠스(기원전 3)·카파도키아와 콤마게네(17)"
  summary:
    ko: "소아시아 안쪽의 왕국은 악티움 뒤 아우구스투스가 세우거나 인정한 왕들이 다스렸고, 왕이 죽으면 속주로 거두어졌다. 기원전 25년 갈라티아 왕 아민타스가 킬리키아의 산악 부족을 치다 죽자 아우구스투스는 갈라티아와 리카오니아·피시디아·팜필리아를 속주 갈라티아로 삼았다(킬리키아 트라케이아의 산악 해안은 카파도키아 왕 아르켈라오스에게 주었다). 기원전 6년 무렵 파플라고니아의 왕 데이오타로스 필라델포스가 죽자 그 땅이 갈라티아 속주에 편입되었고, 기원전 3~2년 무렵 폰토스 왕국(폴레몬 왕조)의 서부 일부(아마세이아와 세바스토폴리스 일대, 이른바 '폰토스 갈라티쿠스'. 범위와 해는 학자마다 다르다)도 같은 속주로 들어갔다. 폰토스 동부(폴레모니아쿠스·트라페주스)와 콜키스는 폴레몬 1세의 가문이 64년까지 다스렸고, 스트라본은 젤라와 카비라(세바스테)도 피토도리스의 땅으로 적는다(12.3.31·37). 17년에는 티베리우스와 사이가 틀어져 로마로 불려 온 카파도키아 왕 아르켈라오스가 죽자(타키투스 『연대기』 2.42) 카파도키아가 속주가 되었고 티베리우스는 그 세수로 로마의 1% 매매세를 절반으로 내렸다. 같은 해 콤마게네 왕 안티오코스 3세(와 킬리키아 왕 필로파토르)도 죽었고 콤마게네는 시리아 속주에 들어갔다(38년의 복위는 뒤의 사건). 지도는 갈라티아를 기원전 25년, 파플라고니아를 기원전 6년, 폰토스 갈라티쿠스(아마시아도 쪽)를 기원전 3년, 카파도키아와 콤마게네를 17년에 로마로 그리고, 젤라·카비라·코마나가 있는 토카트도는 64년까지 폰토스 왕국(폴레몬 왕조)으로 둔다(토카트도 안의 세바스토폴리스와 34/35년에 들어간 코마나는 근사)."
  subjects: [roman-empire, galatia-kingdom, paphlagonia-kingdom, polemonid-pontus, cappadocia-kingdom, commagene]
