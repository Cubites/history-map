- id: sasanian-rise-224
  year: 224
  endYear: 260
  title:
    ko: "사산 왕조의 등장(224~226)과 샤푸르 1세: 발레리아누스의 패배(260)"
  summary:
    ko: "파르티아(아르사케스 왕조)는 2세기 말 로마의 침공과 내분으로 약해졌고, 파르스의 영주 아르다시르 1세가 224년 호르미즈드간에서 마지막 왕 아르타바누스 4세를 꺾고 226년 크테시폰에서 왕이 되어 사산 왕조를 세웠다. 아르다시르는 조로아스터교를 나라의 종교로 삼으려 했고 로마가 차지한 메소포타미아를 되찾으려 했다. 아들 샤푸르 1세(공동 통치 240, 재위 242~270)는 243~244년 고르디아누스 3세의 반격을 받았고 244년 미시케 전투 뒤 고르디아누스가 죽었다(로마 쪽 사료는 부하 필리푸스 아라브스의 음모로, 샤푸르의 비문은 로마가 패했다고 새긴다). 필리푸스는 배상금(50만 데나리우스라고 한다)을 주고 강화했다. 252년 샤푸르가 아르메니아를 차지하고(지도는 252년 대아르메니아를 사산의 아르메니아 왕이 다스린다 보아 비운다), 253년 안티오키아를 약탈했다. 260년 에데사 부근에서 발레리아누스가 샤푸르에게 패해 사로잡혔으니, 로마 황제로는 처음이었다. 샤푸르는 나크셰 로스탐에 『샤푸르의 업적』(Res Gestae Divi Saporis)을 새겨 바르발리소스(253)에서 로마군 6만 명을 쳐부수고 260년에는 황제 발레리아누스를 제 손으로 사로잡았다고 자랑했다. 발레리아누스의 최후는 락탄티우스가 전하는 수모(발판으로 쓰이다 죽은 뒤 가죽을 벗겨 짚을 채움)와 후한 대접을 받았다는 이야기가 갈린다. 샤푸르가 포로를 데려다 도시를 세우고 수로를 놓았다고도 전한다."
  subjects: [roman-empire, arsacid-armenia]
  tags: [war, politics]
