# 유럽 고대 사건 2차 묶음: 아우구스투스의 원수정에서 3세기 위기와 아우렐리아누스까지 (기원전 27 ~ 기원후 283, 작업 EVA2)
# 범위: 아우구스투스의 원수정(기원전 27)과 정복(칸타브리아 전쟁, 알프스·노리쿰·라이티아, 판노니아·일리리쿰과 대반란, 모이시아), 게르마니아 원정과 토이토부르크(9),
#   종속 왕국의 병합(갈라티아 기원전 25·카파도키아와 콤마게네 17·리키아 43·트라키아 46·코티우스 알프스 63·폰토스 64·콤마게네 72·오스로에네 214), 율리우스-클라우디우스 왕조,
#   브리타니아 정복(43)·부디카의 반란(60/61)·아그리콜라와 몬스 그라우피우스(83)·하드리아누스 방벽(122)과 안토니누스 방벽(142~162), 로마 대화재와 네로의 박해(64), 네 황제의 해(69)와 플라비우스 왕조,
#   유대 전쟁(66~73)과 바르 코크바 반란(132~136), 베수비오 분화(79), 다키아 전쟁(85~106)과 트라야누스의 파르티아 원정(113~117), 하드리아누스의 후퇴, 오현제와 마르코만니 전쟁(166~180)·안토니누스 역병,
#   세베루스 왕조와 카라칼라 칙령(212), 사산 왕조의 등장(224)과 발레리아누스의 패배(260), 3세기 위기와 데키우스·발레리아누스의 박해, 고트족의 흑해 북안 진출과 습격,
#   갈리아 제국(260~274)·팔미라(267~273)·아우렐리아누스의 재통일과 다키아 포기(271), 아그리 데쿠마테스(74~260), 보스포로스 왕국과 크림 스키타이, 타키투스의 『게르마니아』(98), 로마와 한의 접촉.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 기원전 27~기원후 283년 지도에서 생기거나 끝난 유럽 항목과 1만 km²를 넘게 바뀐 유럽 버전 해를 ±2년 기준으로 subjects에 이음(docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 로마와 한의 접촉 사건(비단길, 반초와 감영 97, 대진왕 안돈 166)에서 같은 때의 낙랑군·고구려의 옥저 복속(56, `taejo-okjeo-56`)을 한 문장으로 견주었고,
#   세베루스 왕조 사건(후한 220 끝, 삼국 시대)과 3세기 위기 사건(위·촉·오와 서진)에서 같은 때의 중국을 한 문장씩 견주었다. 01·02번 파일의 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 27년 = −26)로 넣고 본문에는 '기원전 27년'처럼 적었다.
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 며칠 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 고대 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: augustus-principate-27bc
  year: -26
  endYear: 14
  title:
    ko: "아우구스투스의 원수정(기원전 27)과 제국의 틀"
  summary:
    ko: "기원전 31년 악티움 해전과 30년 이집트 정복으로 내전을 끝낸 옥타비아누스는(앞 시기의 일) 기원전 27년 1월 13일 원로원에서 비상 권한을 내놓겠다고 선언했다. 원로원은 군대가 머무는 변경 속주(히스파니아·갈리아·시리아 등)의 10년 통치권을 그에게 맡기고 1월 16일 '아우구스투스'라는 존칭을 바쳤다. 그는 스스로 '제1시민(프린켑스)'이라 부르며 집정관 같은 공화정의 관직과 원로원을 남겼으나 군대와 속주 재정은 사실상 그가 쥐었고, 이때를 로마 제정(원수정)의 시작으로 본다(지도는 이 해에 로마 공화정을 끝내고 로마 제국으로 이어 그린다). 그리스는 마케도니아에서 갈라낸 아카이아 속주가 되었고 아테네나 로도스 같은 옛 도시는 자유시의 지위를 이었다(지도는 그리스 도시국가 묶음과 로도스를 이 해에 끝내고, 이베리아·리구리아 부족 묶음의 땅도 속주와 종속 왕국으로 이어 그린다. 트라키아 부족 묶음의 로도페·세르디카 쪽과 게타이의 하이모스산맥 북쪽·도브루자는 로이메탈케스 1세가 트라키아를 묶은 기원전 11년에 트라키아 왕국으로 옮긴다). 내전 뒤 50여 개이던 군단은 28개로 줄여 라인강·도나우강·동방 변경에 두었다(토이토부르크 뒤 25개). 아직 로마 밖에는 브리타니아와 알프스 산악, 히스파니아 북서부(켈트 부족), 라인강 너머의 게르만 부족과 도나우강 너머의 다키아 부족이 있었다. 제국 둘레에는 로마가 인정한 종속 왕국이 많았다: 노리쿰, 트라키아(오드리사이), 갈라티아, 카파도키아, 폰토스 왕국(폴레몬 왕조), 파플라고니아, 콤마게네, 흑해 북안의 보스포로스 왕국, 캅카스의 이베리아 왕국, 로마와 파르티아 사이의 아르메니아 왕국. 아우구스투스는 이들을 변경 방어에 쓰다 왕이 죽으면 속주로 삼았다(뒤의 사건). 기원후 14년 8월 19일 아우구스투스가 놀라에서 죽자 양자 티베리우스가 뒤를 이었다. 그가 남긴 『업적록』은 앙카라(고대 안키라)의 신전 벽에 새겨진 사본으로 전한다."
  subjects: [roman-empire, roman-republic, greek-city-states, rhodes, iberian-tribes, ligurian-tribes, thracian-tribes, celtic-tribes, germanic-tribes, dacian-tribes, odrysian-kingdom, noricum-kingdom, galatia-kingdom, cappadocia-kingdom, polemonid-pontus, paphlagonia-kingdom, commagene, bosporan-kingdom, iberia-kingdom, arsacid-armenia]
  tags: [politics]
  sources: ["Augustus(아우구스투스), Res Gestae Divi Augusti(『업적록』) (P. A. Brunt·J. M. Moore 엮음, 1967)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 53.1~17 (Earnest Cary 영역, Loeb, 1914~1927)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『아우구스투스』 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X: The Augustan Empire, 43 B.C.–A.D. 69 (2판, 1996)", "Adrian Goldsworthy, Augustus: From Revolutionary to Emperor (2014)"]

- id: cantabrian-wars-26bc
  year: -25
  endYear: -18
  title:
    ko: "칸타브리아 전쟁(기원전 26~19)과 이베리아 반도 북서부의 정복"
  summary:
    ko: "이베리아 반도 북쪽 산악의 칸타브리아인과 아스투리아인은 기원전 29년 무렵부터 로마와 싸웠고, 기원전 26년 아우구스투스가 직접 와서 세기사마를 근거지로 삼아 칸타브리아를 쳤으나 병이 나 타라코로 물러났다. 기원전 25년 그의 부장들이 아스투리아의 거점 란키아 등을 함락시켰지만 산악 부족은 그 뒤로도 거듭 들고일어났고, 기원전 19년 아그리파가 마지막 반란을 눌렀다. 카시우스 디오는 아그리파가 전투 연령의 남자를 거의 죽이고 남은 이의 무기를 빼앗아 산에서 평지로 옮겨 살게 했다고 적는다(54.11). 이 정복으로 이베리아 반도 전체가 로마 땅이 되었다. 칸타브리아인·아스투리아인·갈라이키인이 켈트계인지는 학계에서 의견이 갈리지만, 지도는 이들의 땅(지금의 칸타브리아·아스투리아스·레온·루고·라코루냐)을 기원전 19년까지 켈트 부족 묶음으로, 그 뒤 로마 제국으로 그린다."
  subjects: [roman-empire, celtic-tribes]
  links:
