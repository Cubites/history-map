- id: gallic-empire-260
  year: 260
  endYear: 274
  title:
    ko: "갈리아 제국(260~274): 포스투무스에서 테트리쿠스까지"
  summary:
    ko: "260년 발레리아누스가 사산에 사로잡힌 뒤 라인강 군단이 총독 마르쿠스 카시아누스 라티니우스 포스투무스를 황제로 환호했다. 포스투무스는 쾰른에서 갈리에누스의 아들 살로니누스를 죽이고, 갈리아·게르마니아·브리타니아·히스파니아를 아우르는 나라를 세웠다. 수도는 처음 쾰른, 271년부터 트리어였으며 로마와 같은 원로원과 집정관을 두고 라인강 국경을 지켰다. 스스로 로마의 정통 황제임을 자처했으나 이탈리아를 공격하지는 않았다. 269년 마인츠에서 군단이 라엘리아누스를 황제로 환호하자 포스투무스가 도시를 되찾아 그를 죽였으나, 병사들의 약탈을 막았다가 제 군대에 살해되었고, 마리우스를 거쳐 빅토리누스(269~271)가 이었으며 그가 암살된 뒤 도미티아누스라는 이름도 전하는 짧은 찬탈 끝에 테트리쿠스 1세(271~274)가 올랐다(아들 테트리쿠스 2세는 273년 카이사르가 되어 함께 항복했다고 전한다). 히스파니아는 269년 무렵 클라우디우스 2세에게 돌아갔다. 274년 아우렐리아누스가 갈리아로 쳐들어와 샬롱 부근에서 맞붙었는데, 테트리쿠스는 전투 중 군대를 버리고 아우렐리아누스에게 항복했다고 전한다. 아우렐리아누스는 그를 개선식에 끌고 간 뒤 이탈리아의 행정직(『로마 황제 열전』은 루카니아 총독이라 적는다)을 맡겼다. 지도는 갈리아 제국을 260년 갈리아·브리타니아·라인강 서쪽 게르마니아·헬베티아와 히스파니아(269년까지)로 그린다."
  subjects: [roman-empire, gallic-empire]
  links:
    - { from: roman-empire, to: gallic-empire, note: "아우렐리아누스의 회복(274)" }
  tags: [politics, war]
  sources: ["Aurelius Victor(아우렐리우스 빅토르), De Caesaribus(『황제들에 관하여』) 33 (H. W. Bird 영역, 1994)", "Eutropius(에우트로피우스), Breviarium(『로마사 요약』) 9.9~13 (H. W. Bird 영역, 1993)", "Historia Augusta(『로마 황제 열전』) 『서른 명의 참주』 3~6, 24 (David Magie 영역, Loeb, 1921~1932)", "John F. Drinkwater, The Gallic Empire: Separatism and Continuity in the North-Western Provinces of the Roman Empire, A.D. 260–274 (1987)", "Alan K. Bowman·Peter Garnsey·Averil Cameron 엮음, The Cambridge Ancient History XII (2판, 2005)"]
  places:
