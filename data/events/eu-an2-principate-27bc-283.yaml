  sources: ["Jordanes(요르다네스), The Gothic History of Jordanes(『게티카』) 4, 16~20 (Charles C. Mierow 영역, 1915)", "Zosimus(조시모스), New History(『새 역사』) 1.23~46 (Ronald T. Ridley 영역, 1982)", "Historia Augusta(『로마 황제 열전』) 『막시무스와 발비누스』 16, 『클라우디우스』 (David Magie 영역, Loeb, 1921~1932)", "Peter Heather, The Goths (1996)", "Herwig Wolfram, History of the Goths (Thomas J. Dunlap 영역, 1988)"]
