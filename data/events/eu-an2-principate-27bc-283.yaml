- id: four-emperors-flavians-68
  year: 68
  endYear: 96
  title:
    ko: "네 황제의 해(69)와 플라비우스 왕조(69~96)"
  summary:
    ko: "68년 네로가 죽은 뒤 갈바가 황제가 되었으나 69년 1월 근위대가 오토를 세우며 그를 죽였다. 라인강 군단은 비텔리우스를 황제로 환호했고, 오토는 4월 베드리아쿰 전투에서 진 뒤 자결했다. 7월에는 유대 전쟁을 맡고 있던 베스파시아누스를 동방 군단이 황제로 환호했고, 12월 그의 군대가 로마에 들어와 비텔리우스가 죽었다. 이 '네 황제의 해'에 라인강 하구의 바타비 족장 율리우스 키빌리스가 반란을 일으켜 70년까지 이어졌다. 베스파시아누스(69~79)는 재정을 바로잡고 콜로세움 건설을 시작했으며, 아들 티투스(79~81)가 80년 문을 열었다. 티투스 때 베수비오 화산이 터지고(뒤의 사건) 80년 로마에 큰 불이 났다. 동생 도미티아누스(81~96)는 83~85년 카티족과 싸워 게르마니아의 경계를 다졌고(뒤의 사건) 다키아와 싸웠으며(뒤의 사건), 원로원과 사이가 나빠져 공포 정치를 폈다는 평을 받다 96년 9월 18일 궁정 음모로 암살되었다. 이로써 플라비우스 왕조가 끝났다."
  subjects: [roman-empire]
  tags: [politics]
  sources: ["Tacitus(타키투스), Historiae(『역사』) 1~4 (Clifford H. Moore 영역, Loeb, 1925~1931)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『갈바』『오토』『비텔리우스』『베스파시아누스』『티투스』『도미티아누스』 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 64~67 (Earnest Cary 영역, Loeb, 1914~1927)", "Brian W. Jones, The Emperor Domitian (1992)", "Alan K. Bowman·Peter Garnsey·Dominic Rathbone 엮음, The Cambridge Ancient History XI: The High Empire, A.D. 70–192 (2판, 2000)"]

- id: vesuvius-79
  year: 79
  title:
    ko: "베수비오 화산 폭발(79)"
  summary:
    ko: "79년 베수비오 화산이 폭발해 나폴리만의 폼페이·헤르쿨라네움·스타비아이가 화산재와 화쇄류에 묻혔다. 전통 날짜는 8월 24일이지만, 2018년 폼페이에서 10월 17일을 가리키는 숯 글씨가 발견되고 가을 과일 같은 증거가 있어 가을이라는 주장이 힘을 얻는다. 유일한 목격담은 소 플리니우스가 약 25년 뒤 역사가 타키투스에게 보낸 편지 두 통(『서간집』 6.16·6.20)으로, 미세눔에서 소나무 모양의 구름과 거듭된 지진을 보았고, 함대를 이끌고 구조하러 갔던 외삼촌 대플리니우스가 스타비아이에서 숨졌다고 적는다. 폼페이에서는 1천여 구, 헤르쿨라네움에서는 300여 구의 유해가 나왔으나 전체 희생자 수는 알 수 없고 학자들은 수천 명 안팎으로 어림한다. 로마 제국 황제 티투스(재위 79~81)는 구호 위원을 보내 재건을 도왔다고 수에토니우스가 전한다."
  subjects: [roman-empire]
  tags: [society]
  sources: ["Pliny the Younger(소 플리니우스), Epistulae(『서간집』) 6.16, 6.20 (Betty Radice 영역, Loeb, 1969)", "Suetonius(수에토니우스), De vita Caesarum(『열두 황제 전기』) 『티투스』 8 (J. C. Rolfe 영역, Loeb, 1913~1914)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 66.21~24 (Earnest Cary 영역, Loeb, 1914~1927)", "Mary Beard, Pompeii: The Life of a Roman Town (2008)", "Alex Butterworth·Ray Laurence, Pompeii: The Living City (2005)"]

- id: flavian-britain-69
  year: 69
  endYear: 87
  title:
    ko: "플라비우스 왕조의 브리타니아: 케리알리스와 아그리콜라, 몬스 그라우피우스(83)"
  summary:
    ko: "69년 내전의 혼란 속에 브리간테스의 베누티우스가 로마가 지지하던 여왕 카르티만두아를 몰아냈고(지도는 69년 브리간테스 땅을 브리타니아의 종속 왕국들 묶음에서 켈트 부족 묶음으로 되돌린다), 71년 총독 퀸투스 페틸리우스 케리알리스가 브리간테스를 정복하고 에보라쿰(요크)에 군단 기지를 놓았다. 74~77년 섹스투스 율리우스 프론티누스가 웨일스 남부의 실루레스를 눌렀고, 77년(78년이라는 설도 있다) 부임한 그나이우스 율리우스 아그리콜라(타키투스의 장인)는 웨일스 북서부의 오르도비케스와 모나(앵글시섬)를 치고 북쪽으로 진출해 79년 테이강에 이르렀으며 80년 포스강과 클라이드강 사이의 잘록한 땅에 요새선을 놓았다(부임을 78년으로 보면 연도가 한 해씩 늦다. 지도는 78년 웨일스와 레그니 땅을 켈트 부족 묶음과 종속 왕국 묶음에서, 80년 스코틀랜드 저지대를 켈트 부족 묶음에서 로마로 옮겨 그린다). 83년(78년 부임설로는 84년) 몬스 그라우피우스에서 칼레도니아 부족의 칼가쿠스가 이끈 군대를 꺾었다고 타키투스는 쓰는데, 위치는 확실하지 않고 스코틀랜드 북동부로 본다. 타키투스는 칼가쿠스의 입을 빌려 로마가 '황무지를 만들고는 평화라 부른다'고 쓴다. 아그리콜라는 84년 도미티아누스가 소환했고, 군단이 도나우강으로 빠지면서 85~87년 무렵 인치투실의 군단 요새를 비우고 테이강 북쪽을 포기했다."
  subjects: [roman-empire, celtic-tribes, british-client-kingdoms]
  links:
    - { from: roman-empire, to: british-client-kingdoms, note: "레그니 땅의 병합(78 무렵)" }
  tags: [war]
  sources: ["Tacitus(타키투스), Agricola(『아그리콜라』) 17~40 (M. Hutton 영역, R. M. Ogilvie 개정, Loeb, 1970)", "Tacitus(타키투스), Historiae(『역사』) 3.45 (Clifford H. Moore 영역, Loeb, 1925~1931)", "Sheppard Frere, Britannia: A History of Roman Britain (3판, 1987)", "David J. Breeze, The Frontiers of Imperial Rome (2011)"]

- id: agri-decumates-74
  year: 74
  endYear: 260
  title:
    ko: "아그리 데쿠마테스: 흑림 길(74)에서 리메스의 포기(259~260)까지"
  summary:
    ko: "라인강 상류와 도나우강 상류 사이로 튀어나온 땅(지금의 바덴뷔르템베르크 도나우강 북쪽 대부분과 헤센 남부, 바이에른 북서부 일부)을 로마는 '아그리 데쿠마테스'라 불렀다. 이름은 타키투스(『게르마니아』 29)에 남았는데 뜻은 분명하지 않다. 73~74년 베스파시아누스 때 사령관 그나이우스 피나리우스 클레멘스가 아르겐토라툼(스트라스부르) 쪽에서 흑림을 지나 도나우 상류로 가는 길을 놓아 라인-도나우 사이 거리를 줄였고, 83~85년 도미티아누스가 카티족을 친 뒤 방어선(리메스)을 쌓기 시작해 2세기 중엽 바깥으로 옮겼다(상게르마니아-라이티아 리메스는 약 550km). 213년 카라칼라가 리메스에서 알레만인과 싸웠다고 카시우스 디오가 적는데(78.13), 통설로는 알레만인이 사료에 처음 나오는 대목이나, 이름이 후대 어휘의 영향이라는 이견도 있다. 3세기 중엽 알레만인과 유튼기·프랑크의 침입이 거듭되었고, 259~260년 갈리에누스의 혼란기에 로마는 리메스를 비웠다. 이후 이 땅은 알레만인의 손에 들어갔다. 지도는 74년부터 이 땅을 로마로 그리다 260년 게르만 부족으로 돌리고, 같은 해 라인강 서쪽 갈리아·브리타니아·히스파니아를 갈리아 제국으로 그린다."
  subjects: [roman-empire, germanic-tribes, gallic-empire]
  tags: [war, politics]
  sources: ["Tacitus(타키투스), Germania(『게르마니아』) 29 (M. Hutton 영역, R. M. Ogilvie 개정, Loeb, 1970)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 67.4, 78.13 (Earnest Cary 영역, Loeb, 1914~1927)", "Sextus Julius Frontinus(프론티누스), Strategemata(『전략』) 1.3.10, 2.11.7", "David J. Breeze, The Frontiers of Imperial Rome (2011)", "Dietwulf Baatz·Fritz-Rudolf Herrmann 엮음, Die Römer in Hessen (1982)"]

- id: tacitus-germania-98
  year: 98
  title:
    ko: "타키투스의 『게르마니아』와 『아그리콜라』(98)"
  summary:
    ko: "98년 역사가 타키투스는 장인 아그리콜라의 전기 『아그리콜라』와 라인·도나우강 너머 여러 부족을 소개한 『게르마니아』를 펴냈다. 『게르마니아』는 게르만인이 다른 민족과 섞이지 않은 토박이라고 쓰고 부족을 하나씩 짚으며 콰디·마르코만니·루기이·고토네스 같은 이름을 남겼다. 바다 한가운데에 함대가 강한 수이오네스가, 발트해 연안에 호박을 줍는 아이스티가 있다고 적고, 가장 먼 곳에는 사냥으로 가난하게 사는 펜니가 있다고 한다(『게르마니아』 44~46). 타키투스가 타락한 로마 사회를 꾸짖으려고 소박하고 강한 게르만인의 모습을 이상화했다는 비판도 크다. 『아그리콜라』 24는 아일랜드를 군단 하나와 보조군으로 정복할 수 있다고 아그리콜라가 생각했고 쫓겨난 아일랜드의 '소왕'이 그를 찾아왔다고 쓴다. 지도는 이 기록을 근거로 98년부터 스웨덴 남부(스코네·할란드·블레킹에)를 게르만 부족 묶음으로 칠하되(『게르마니아』 44는 수이오네스를 바다 한가운데라고만 적어 위치는 어림이다) 발트 부족 묶음, 핀우그르 부족 묶음, 아일랜드 왕국들 묶음을 그린다. 『아그리콜라』에는 아그리콜라가 맞선 칼레도니아의 켈트 부족도 나온다."
  subjects: [germanic-tribes, baltic-tribes, finnic-tribes, irish-kingdoms, celtic-tribes, roman-empire]
  tags: [culture]
  sources: ["Tacitus(타키투스), Germania(『게르마니아』) 2, 40, 44~46 (M. Hutton 영역, R. M. Ogilvie 개정, Loeb, 1970)", "Tacitus(타키투스), Agricola(『아그리콜라』) 24 (M. Hutton 영역, R. M. Ogilvie 개정, Loeb, 1970)", "Allan A. Lund, Zum Germanenbild der Römer (1990)", "Christopher B. Krebs, A Most Dangerous Book: Tacitus's Germania from the Roman Empire to the Third Reich (2011)"]

- id: dacian-wars-85
  year: 85
  endYear: 106
  title:
    ko: "다키아 전쟁(85~106): 데케발루스와 도미티아누스·트라야누스, 다키아 속주"
  summary:
    ko: "부레비스타 뒤 여러 왕을 거쳐 갈라졌던 다키아를 데케발루스가 87년 무렵 왕이 되어 다시 모았다(지도는 다키아 왕국을 기원전 82년(천문 연도 −81)부터 그린다). 85~86년 다키아군이 도나우강을 건너 모이시아를 덮쳐 총독 오피우스 사비누스가 죽자 도미티아누스가 반격했으나 86년 초 친위대장관 코르넬리우스 푸스쿠스가 다키아에서 전사해 군기를 잃었고, 87년 다시 쳐들어간 테티우스 율리아누스가 88년 타파이에서 이겼으나 마르코만니·콰디·이아지게스와도 싸우느라 89년 데케발루스와 강화했다. 로마는 해마다 돈과 기술자를 주었고 데케발루스는 로마의 종속 왕이 되었다. 98년 즉위한 트라야누스는 이 협정을 받아들이지 않고 101년 도나우강을 건너 타파이에서 이겼으며 102년 수도 사르미제게투사를 에워싸 데케발루스를 강화로 몰아넣었다. 데케발루스가 105년 다시 맞서자 트라야누스는 아폴로도로스가 설계한 도나우강 다리(길이 1km 남짓)를 놓아 106년 사르미제게투사를 함락시켰고, 데케발루스는 사로잡히기 전에 자결했다. 106년 다키아 속주가 세워져(지도는 106년 트란실바니아·올테니아·바나트 산지를 로마로 그린다) 에우트로피우스에 따르면 제국 곳곳에서 식민자를 데려왔다. 로마의 정복은 많은 다키아인의 죽음과 노예화를 낳았고, 후대 요안니스 리도스는 트라야누스의 의사 크리톤의 글을 옮겨 포로 50만 명이라 전하나 믿기 어렵다. 전리품으로 로마에 트라야누스 광장이 세워졌고 승전 기둥은 113년 봉헌되었다."
  subjects: [roman-empire, dacian-kingdom, dacian-tribes]
  links:
    - { from: roman-empire, to: dacian-kingdom, note: "다키아 속주화(106)" }
  tags: [war]
  sources: ["Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 67.6~7, 68.6~14 (Earnest Cary 영역, Loeb, 1914~1927)", "Eutropius(에우트로피우스), Breviarium(『로마사 요약』) 8.2, 8.6 (H. W. Bird 영역, 1993)", "Jordanes(요르다네스), The Gothic History of Jordanes(『게티카』) 13 (Charles C. Mierow 영역, 1915)", "Julian Bennett, Trajan: Optimus Princeps (1997)", "Ioan Piso, An der Nordgrenze des Römischen Reiches: Ausgewählte Studien (1972–2003) (Franz Steiner, 2005)"]
