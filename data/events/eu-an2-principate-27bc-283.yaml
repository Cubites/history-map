- id: alpine-conquest-25bc
  year: -24
  endYear: -5
  title:
    ko: "알프스 정복: 살라시(기원전 25), 노리쿰·라이티아·빈델리키아(기원전 16~15), 알프스 승전비(기원전 7~6)"
  summary:
    ko: "알프스 고갯길은 이탈리아와 갈리아·도나우 지역을 잇는 길이라 아우구스투스가 차례로 눌렀다. 기원전 25년 테렌티우스 바로가 아오스타 골짜기의 살라시를 꺾었고, 스트라본에 따르면 사로잡힌 이는 무장 남자 8천 명에 그 밖의 사람 3만 6천 명(합 약 4만 4천)이었고 바로가 이들을 모두 이브레아에서 노예로 팔았으며 그 땅에 아우구스타 프라이토리아(아오스타)가 세워졌다(지도는 기원전 25년 이 땅을 켈트 부족 묶음에서 로마로 옮겨 그린다). 기원전 16년 판노니아 사람이 노리쿰 사람과 함께 이스트리아를 덮치자 푸블리우스 실리우스 네르바가 막았고, 이 무렵 노리쿰 왕국이 로마에 편입되었다(경위는 사료가 적어 평화적 병합이라는 견해가 많다. 지도는 노리쿰 왕국을 도나우강 남쪽에만 그리고 기원전 16년에 끝낸다). 같은 해 실리우스는 알프스의 카무니와 베노네테스도 꺾었다(카시우스 디오 54.20. 지도는 발텔리나(손드리오)를 기원전 16년부터 켈트 부족 묶음에서 로마로 옮겨 그린다). 기원전 15년 의붓아들 드루수스와 티베리우스가 두 갈래로 라이티아와 빈델리키아를 쳐 보덴호 쪽에서 만났고 도나우강 상류 둘레가 로마 땅이 되었다(지도는 기원전 15년 스위스 동부·티롤·바이에른 남부·오버슈바벤을 켈트 부족 묶음에서 로마로 옮겨 그린다). 기원전 14년에는 해양 알프스 부족도 눌렀다. 기원전 7~6년 지금의 라 튀르비에 세운 '알프스 승전비'에는 정복한 알프스 부족 46곳의 이름이 새겨졌다고 대플리니우스가 옮겨 적었다. 수사 골짜기의 코티우스는 로마와 우호를 맺고 기원전 9~8년 수사 개선문을 세웠으며 그의 왕국은 63년 손자 코티우스 2세가 죽을 때까지 로마의 속국이었다."
  subjects: [roman-empire, noricum-kingdom, celtic-tribes, cottian-alps]
  tags: [war]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 4.6.7 (H. L. Jones 영역, Loeb, 1917~1932)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 53.25, 54.20, 54.22 (Earnest Cary 영역, Loeb, 1914~1927)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 3.136~137 (H. Rackham 외 영역, Loeb, 1938~1963)", "Augustus(아우구스투스), Res Gestae Divi Augusti(『업적록』) 26 (P. A. Brunt·J. M. Moore 엮음, 1967)", "Alan K. Bowman·Edward Champlin·Andrew Lintott 엮음, The Cambridge Ancient History X (2판, 1996)"]

- id: pannonia-illyricum-12bc
  year: -11
  endYear: 9
  title:
    ko: "판노니아·일리리쿰 정복(기원전 12~9)과 대반란(6~9), 도나우 국경과 모이시아"
  summary:
    ko: "기원전 35~33년 옥타비아누스가 이아피데스와 시스키아를 차지한 뒤(앞 시기의 일), 기원전 13년 판노니아에 반란이 일어나 아그리파가 갔다가 기원전 12년 3월 캄파니아에서 병으로 죽자 티베리우스가 뒤를 이어 기원전 9년까지 브레우키·스코르디스키·델마타이를 눌러 도나우강 중류에 닿았다. 『업적록』 30은 일리리쿰의 경계를 도나우강 기슭까지 넓혔다고 쓴다(지도는 기원전 9년 판노니아와 달마티아 내륙을 로마로 그리고 일리리아·판노니아 부족 묶음을 끝낸다). 더 아래쪽 모이시아는 기원전 29~28년 크라수스가 모이시 등을 눌렀고 첫 총독 기록은 기원후 6년의 카이키나 세베루스다(지도는 모이시아를 기원전 28년부터 로마로 그린다). 같은 무렵 트라키아에서는 기원전 13~11년 베시의 디오니소스 사제 볼로가이세스가 들고일어나 사파이오이 왕 라스쿠포리스를 죽이고 그 숙부 로이메탈케스 1세를 쫓아냈으나, 팜필리아 총독이던 루키우스 칼푸르니우스 피소가 불려 와 반란을 눌렀다(카시우스 디오 54.34. 벨레이우스 2.98은 세 해를 싸웠다고 적는다). 로이메탈케스 1세는 그 뒤 로마의 종속 왕으로 트라키아 전체를 다스렸다(지도는 기원전 11년부터 트라키아 왕국을 헤브로스강 골짜기 밖의 로도페·서트라키아·세르디카와 하이모스산맥 북쪽의 도나우강 기슭·도브루자까지 넓혀 46년까지 그리고, 그전은 기원전 264~28년처럼 트라키아 부족 묶음과 게타이(다키아 부족 묶음)로 둔다). 기원후 6년 티베리우스가 마르코만니를 칠 군대를 모으자 징집에 시달리던 달마티아의 바토(데시티아테스)와 판노니아 브레우키의 바토가 들고일어났다. 수에토니우스는 카르타고 전쟁 뒤 가장 위험한 대외 전쟁이었다고 평했고, 벨레이우스 파테르쿨루스는 반란군이 보병 20만에 기병 9천이라 적었으나 부풀린 수로 본다. 로마는 한때 군단 10개를 모았고 8년 브레우키의 바토가 달마티아의 바토에게 넘겨져 처형되었으며, 9년 안데트리온 포위와 아르두바 함락(주민이 내분 끝에 싸우다 죽거나 스스로 목숨을 끊었다고 디오는 쓴다) 뒤 달마티아의 바토도 항복해 전쟁이 끝났다. 로마군은 일부를 노예로 팔거나 옮겼고 일리리쿰은 9~10년 무렵 판노니아와 달마티아 두 속주로 나뉘었다."
