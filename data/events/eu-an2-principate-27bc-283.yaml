- id: germania-teutoburg-12bc
  year: -11
  endYear: 16
  title:
    ko: "게르마니아 원정(기원전 12~기원후 16)과 토이토부르크 숲 전투(9)"
  summary:
    ko: "라인강 너머를 속주로 삼으려던 아우구스투스의 계획에 따라 의붓아들 드루수스가 기원전 12~9년 라인강을 건너 프리시·카티·케루스키를 치고 엘베강에 이르렀으나(기원전 9년 낙마 사고로 죽음), 티베리우스가 기원전 8~7년과 기원후 4~5년 원정을 이었다. 그동안 마르코만니는 마로보두우스를 따라 보헤미아로 옮겨 갔고(벨레이우스 2.108), 콰디도 그 동쪽 모라비아·슬로바키아 서부에 자리 잡았다(지도는 보헤미아와 도나우강 북쪽의 뮐피어텔을 기원전 8년, 모라비아·슬로바키아 서부와 발트피어텔·바인피어텔을 기원전 7년부터 켈트 부족 묶음에서 게르만 부족 묶음으로 옮겨 그린다). 기원후 7년 푸블리우스 퀸크틸리우스 바루스가 게르마니아 총독이 되어 세금과 로마법을 들이대자, 로마 보조군 장교이던 케루스키 귀족 아르미니우스가 반란을 꾸며 9년 9월 토이토부르크 숲의 길에서 바루스의 군단 셋(17·18·19군단)과 보조 부대를 매복으로 쳤다. 바루스는 자결했고 로마 쪽 희생은 현대 학자 어림으로 1만 5천~2만 명이며, 일부는 노예가 되거나 몸값을 주고 풀려났다. 발굴 터인 칼크리제 언덕 부근이 유력하나 확정은 아니다. 수에토니우스는 아우구스투스가 '바루스여, 내 군단을 돌려다오' 하고 탄식했다고 적는다. 14~16년 게르마니쿠스가 세 해에 걸쳐 원정해 독수리 군기 둘을 되찾았지만(셋째는 41년 클라우디우스 때 찾음) 16년 티베리우스가 그를 불러들였고, 로마는 라인강을 경계로 삼았다. 지도는 라인강~엘베강을 로마가 점령했다 되돌려진 땅이라 게르만 부족 묶음으로 그리고 로마의 경계를 라인강으로 둔다."
  subjects: [roman-empire, germanic-tribes, celtic-tribes]
