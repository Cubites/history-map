- id: decius-valerian-persecutions-250
  year: 250
  endYear: 261
  title:
    ko: "데키우스(250)와 발레리아누스(257~258)의 그리스도교 박해, 갈리에누스의 관용(260~261)"
  summary:
    ko: "그전의 박해는 네로의 로마 시 박해(64)나 총독이 신자를 개별적으로 벌한 데 그쳤다. 249년 황제가 된 데키우스는 250년 초 제국의 모든 주민이 신들에게 제사를 올리고 증명서(리벨루스)를 받게 하는 칙령을 내렸다. 신자만 겨눈 칙령은 아니었으나 거부한 이들은 투옥·고문·처형을 당했고 로마 주교 파비아누스(250년 1월)가 순교했다. 오리게네스는 고문 후유증으로 몇 해 뒤 죽었다. 많은 신자가 증명서를 사거나 제사를 올려 모면했고 이들을 교회에서 다시 받아들일지가 교회를 갈랐다. 251년 데키우스가 아브리투스에서 죽자 박해가 멎었다. 발레리아누스는 257년 성직자에게 제사를 올리게 하고 모임을 금했으며(거부하면 유배), 258년에는 성직자를 즉시 처형하고 신자 원로원 의원과 기사는 신분과 재산을 잃게 했다. 카르타고 주교 키프리아누스가 258년 9월 14일 참수되었다. 260년 발레리아누스가 사로잡히자 아들 갈리에누스가 칙령을 거두어 교회의 재산과 모임 장소를 돌려주었다(260~261). 이후 303년 대박해까지 40여 년 큰 박해가 없었다(뒤의 사건)."
  subjects: [roman-empire]
  tags: [society, religion]
  sources: ["Eusebius(에우세비오스), Historia Ecclesiastica(『교회사』) 6.39~41, 7.10~13 (G. A. Williamson 영역, 1965)", "Cyprian(키프리아누스), De lapsis(『배교자들』)·Epistulae(『서간집』)", "W. H. C. Frend, Martyrdom and Persecution in the Early Church (1965)", "G. E. M. de Ste. Croix, Christian Persecution, Martyrdom, and Orthodoxy (Michael Whitby·Joseph Streeter 엮음, 2006)", "Alan K. Bowman·Peter Garnsey·Averil Cameron 엮음, The Cambridge Ancient History XII (2판, 2005)"]

- id: goths-black-sea-238
  year: 238
  endYear: 271
  title:
    ko: "고트족의 흑해 북안 진출과 도나우·바다 습격(238~271): 아브리투스 전투(251)"
  summary:
    ko: "스칸디나비아에서 비스와강 하구를 거쳐 흑해로 왔다는 요르다네스의 전설과 달리, 고고학은 3세기 초 흑해 북안 숲초원에 자리 잡은 고트족을 체르냐호우 문화와 이어 본다. 238년 고트족과 카르피가 도나우강 어귀의 히스트리아를 약탈했다(『로마 황제 열전』. 지도는 238년 흑해 북쪽 숲초원과 드니스테르강~드니프로강 초원을 사르마티아·알란 부족 묶음에서 게르만 부족 묶음의 고트로 옮겨 그린다). 250~251년 고트 왕 크니바가 도나우강을 건너 모이시아를 휩쓸고 필리포폴리스를 함락시켰으며, 251년 여름 아브리투스(지금의 불가리아 라즈그라드 부근) 습지에서 데키우스와 아들 헤렌니우스 에트루스쿠스가 이끈 로마군을 매복으로 무찔렀다. 로마 쪽 사료로는 로마 황제가 외적과의 싸움에서 죽은 첫 일이었다. 새 황제 트레보니아누스 갈루스는 고트족이 약탈품과 포로를 가지고 돌아가게 두는 조약을 맺었다. 256~257년 보라니와 고트족이 흑해를 배로 건너 피티우스와 트라페주스를 약탈했고(조시모스 1.31~33) 이 무렵 크림 스키타이 왕국의 수도 네아폴리스가 불탄 것으로 본다(지도는 256년 크림을 고트로 그린다). 267년 헤룰리가 아테네를 약탈했다. 268년(또는 269년) 클라우디우스 2세가 나이수스에서 고트족을 크게 꺾어 '고티쿠스'라는 별명을 얻었다. 271년 아우렐리아누스는 도나우강 북쪽의 고트 왕 카니나바우데스를 꺾고 다키아를 버렸다(뒤의 사건)."
  subjects: [roman-empire, germanic-tribes, sarmatian-alan-tribes, dacian-tribes, crimean-scythia]
  links:
    - { from: germanic-tribes, to: roman-empire, note: "아브리투스 전투(251)와 도나우 습격" }
