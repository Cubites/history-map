# 중국 사건 8차 묶음: 위안스카이의 집권에서 시진핑 체제까지 (1912 ~ 2023, 작업 cn-08)
# 범위: 위안스카이의 집권과 제정 시도, 신문화 운동과 5·4 운동, 군벌 시대, 중국 공산당 창당, 제1차 국공 합작과 북벌, 장시 소비에트, 난징 국민 정부, 상하이 사변과 탕구 정전 협정,
#   만주국의 건국과 통치, 장정, 시안 사건, 상하이 전투와 난징 대학살, 충칭 정부의 지구전, 제2차 국공 합작과 항일 근거지, 이치고 작전, 일본의 항복과 접수, 몽골 독립의 승인,
#   2·28 사건과 중화민국의 타이완 이전, 3대 전역, 신중국 초기의 토지 개혁과 반혁명 진압, 중소 동맹과 제1차 5개년 계획, 백화제방과 반우파 투쟁, 중소 분쟁, 대약진 운동과 대기근,
#   티베트 봉기, 중인 국경 전쟁, 문화 대혁명과 린뱌오 사건, 미중 화해와 유엔 대표권, 개혁 개방, 중월 전쟁, 한 자녀 정책, 타이완의 민주화, 톈안먼 시위, 남순강화,
#   홍콩·마카오 반환, WTO 가입, 신장 문제, 베이징 올림픽, 남중국해 분쟁, 시진핑 체제와 일대일로, 코로나19.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 지도에서 생기거나 끝난 항목(중화민국·만주국·일본군 점령지·몽골·중화인민공화국)과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이었다.
#   최근 일은 확정된 해까지 사실 위주로 썼고, 사망자·피해 규모는 범위와 출처(추산)를 함께 적었다. 정부 발표와 다른 추산이 있는 사건은 둘을 나란히 적었다.
# 한국사와 닿는 점: 5·4 운동 사건에서 「3·1 운동」, 상하이 사변 사건에서 「한인 애국단의 이봉창·윤봉길 의거」, 만주국 사건에서 「만주 사변과 만주국」·「동북 항일 연군과 보천보 전투」,
#   난징 대학살 사건에서 「중일 전쟁과 민족 말살 통치」·「중일 전쟁과 일본군 점령지」, 충칭 정부 사건에서 「태평양 전쟁 발발」, 일본의 항복 사건에서 「얄타 회담」,
#   몽골 사건에서 「몽골 인민 혁명과 몽골의 성립」, 신중국 초기·티베트 사건에서 「중국군 참전과 흥남 철수」·「중화인민공화국의 티베트 병합과 맥마흔선」·「6·25 전쟁 발발」,
#   중월 전쟁 사건에서 「베트남의 분단과 베트남 공화국 수립」, 타이완 민주화·남순강화 사건에서 「한중 수교」, 베이징 올림픽 사건에서 「서울 올림픽과 북방 외교」를 가리켰다.
#   「국공 내전과 중화인민공화국 수립」·「일본의 21개조 요구」·「파리 강화 회의와 베르사유 조약」·「워싱턴 회의」·「쿠바 미사일 위기」·「1989년 동유럽 혁명」·「소련의 해체」 같은
#   한국사·유럽 파일의 사건은 다시 만들지 않고 글에서 이름만 가리켰다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도로 넣고, 본문의 연도는 모두 서기이다.
# 달력: 1912년부터 모든 날짜는 양력이다.
# 이름 규칙: 신해혁명(1911) 뒤 인물은 중국어 표기(쑨원·위안스카이·장제스·마오쩌둥·저우언라이·덩샤오핑), 같은 소리 이름은 한자를 붙였다(천이(陳儀)·천이(陳毅)·우한(吳晗)).
#   지금도 쓰는 지명은 중국어 표기(난징·충칭·우한·타이베이·선전), 정당·단체·사건 이름은 한자음(국민당·홍군·환난 사변·백단 대전). 나라 이름은 항목 이름과 맞췄다.
# 서술은 새로 작성. 출처는 개설서와 연구서, 조약·공동 성명 같은 1차 문서이다. 병력·사상자·인구 숫자는 집계가 갈리므로 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: yuan-shikai-1912
  year: 1912
  endYear: 1916
  title:
    ko: "위안스카이의 집권과 제정 시도(1912~1916)"
  summary:
    ko: "1912년 2월 선통제가 물러나자 쑨원은 임시 대총통 자리를 위안스카이에게 넘겼고, 위안스카이는 3월 10일 베이징에서 임시 대총통에 취임했다. 임시약법은 의회와 내각의 권한을 크게 두었으나, 위안스카이는 북양군과 관료 조직을 쥐고 이를 줄여 나갔다. 쑹자오런이 이끈 국민당이 총선에서 의회 제1당이 되었는데, 1913년 3월 20일 쑹자오런이 상하이 역에서 총에 맞아 이틀 뒤 숨졌다. 위안스카이 쪽의 관여를 의심하는 견해가 우세하나 진상은 학설이 갈린다. 위안스카이는 4월 의회 승인 없이 5개국 은행단과 선후 대차관 계약을 맺었다. 국민당 계열 도독들이 7월 장시·장쑤 등에서 이른바 2차 혁명을 일으켰으나 두어 달 만에 진압되었고 쑨원은 일본으로 망명했다. 위안스카이는 10월 6일 국회에서 정식 대총통으로 뽑혔고, 11월 국민당을 해산시켜 소속 의원의 자격을 빼앗았으며 이듬해 1월 국회를 해산했다. 1914년 5월에는 신약법(중화민국 약법)으로 내각제를 대총통제로 바꾸었고, 12월 대총통 선거법을 고쳐 임기를 10년으로 하고 연임을 제한하지 않았다. 1915년 5월에는 일본의 21개조 요구를 받아들였다(「일본의 21개조 요구」(뒤의 사건)). 그 뒤 주안회 등이 군주제를 부추겼고, 참정원의 추대를 받은 위안스카이는 12월 12일 황제 자리를 받아들인다고 알리고 연호를 홍헌으로 정했다. 일본을 비롯한 열강도 이를 환영하지 않았고, 12월 25일 윈난의 차이어와 탕지야오가 독립을 선포하며 호국 전쟁이 시작되어 남쪽 여러 성이 잇달아 호응했다. 북양군 안에서도 돤치루이 등이 거리를 두자 위안스카이는 1916년 3월 22일 제정을 취소했고, 6월 6일 만 56세로 숨졌다. 부총통 리위안훙이 대총통을 이어 돤치루이를 국무총리로 삼았으나 베이징 정부의 권위는 되살아나지 않았고, 군을 쥔 우두머리들이 각 지방을 차지하는 「군벌 시대」(뒤의 사건)가 열렸다."
  subjects: [roc, japan]
  tags: [politics]
  sources: ["The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)", "Ernest P. Young, The Presidency of Yuan Shih-k'ai: Liberalism and Dictatorship in Early Republican China (University of Michigan Press, 1977)", "『중화민국 임시약법』(1912)"]

- id: new-culture-1915
  year: 1915
  endYear: 1919
  title:
    ko: "신문화 운동(1915~1919)"
  summary:
    ko: "1915년 9월 천두슈는 상하이에서 잡지 『청년잡지』를 펴냈고, 이 잡지는 이듬해 『신청년』으로 이름을 바꾸었다. 천두슈는 첫 호에서 젊은이들에게 낡은 관습을 버리고 자주적이고 진보적이며 과학적인 사람이 되라고 외쳤다. 이 잡지는 뒤에 민주(데 선생)와 과학(싸이 선생)을 새 중국의 기둥으로 내세웠다. 위안스카이의 제정 시도(「위안스카이의 집권과 제정 시도」(앞의 사건))와 1917년 장쉰의 복벽 소동을 겪으며 중화민국의 공화정이 이름뿐이라는 실망 속에서 유교 윤리가 전제 정치를 떠받쳤다는 비판이 힘을 얻었다. 1917년 차이위안페이가 베이징 대학 총장이 되어 학문의 자유와 여러 사상을 받아들이는 학풍을 세웠고, 천두슈가 문과 학장으로 불려 가면서 『신청년』의 본거지도 베이징으로 옮겨졌다. 후스는 1917년 1월 『신청년』에 「문학 개량 추의」를 실어 구어체인 백화문으로 글을 쓰자고 했고, 천두슈가 이어 「문학 혁명론」으로 힘을 보탰다. 1918년 루쉰은 『신청년』에 소설 「광인일기」를 실어 유교 도덕이 사람을 억누르는 모습을 ‘사람을 잡아먹는’ 일에 빗댔다. 리다자오는 러시아 혁명을 소개하며 마르크스주의를 중국에 알렸다. 이들은 공자를 받드는 풍조와 대가족 제도, 정절과 효를 앞세우는 도덕을 비판했고 여성의 해방과 자유 연애도 논했다. 반면 린수 같은 고전 문인과 구훙밍 등은 전통 문화를 지켜야 한다고 맞서, 서양의 가치를 어디까지 받아들일지를 두고 논쟁이 이어졌다. 앞 시기의 양무운동이 서양의 기술을, 변법운동이 제도를 들여오려 했다면 이 운동은 사상과 문화 전반을 바꾸자고 요구했다. 백화문은 뒤에 교육부가 초등 국어 교과서에 쓰게 하면서 널리 퍼졌다. 이 운동에서 자란 학생과 도시 지식인은 1919년 「5·4 운동」(뒤의 사건)의 주력이 되었다."
  subjects: [roc]
  tags: [culture, society]
  sources: ["Chow Tse-tung, The May Fourth Movement: Intellectual Revolution in Modern China (Harvard University Press, 1960)", "The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)", "『신청년』(1915~)"]

- id: warlord-era-1916
  year: 1916
  endYear: 1928
  title:
    ko: "군벌 시대(1916~1928)"
  summary:
    ko: "위안스카이가 죽은(1916년 6월 6일) 뒤 중화민국의 베이징 정부는 대총통 리위안훙과 국무총리 돤치루이의 대립 속에 흔들렸고, 지방에서는 군대를 쥔 우두머리들이 성을 나누어 다스렸다. 이 시기를 군벌 시대라 부른다. 군벌은 북양군에서 갈라진 안후이파(돤치루이)와 즈리파(펑궈장에 이어 차오쿤·우페이푸), 만주의 펑톈파(장쭤린)가 중심이었고, 산시(山西)의 옌시산과 광시의 리쭝런 같은 지방 세력도 따로 있었다. 1917년 7월 1일 장쉰이 베이징에 들어가 선통제(푸이)의 복위를 선언했으나 돤치루이가 군을 모아 열이틀 만에 진압했다. 이 사건으로 리위안훙이 물러나자 부총통 펑궈장이 대총통 직무를 이었다. 돤치루이 정부는 일본의 차관을 받으며 1917년 8월 독일에 선전 포고를 했고, 쑨원은 임시약법을 지키겠다며 9월 광저우에서 군정부를 세워 대원수가 되었다(호법 운동). 1918년 10월에는 펑궈장의 뒤를 이어 쉬스창이 대총통이 되었다. 1920년 7월 즈리파가 펑톈파와 손잡고 안후이파를 꺾었으며(즈완 전쟁), 1922년 4~5월 즈리파가 펑톈파를 만주로 몰아냈다(제1차 즈펑 전쟁). 이 무렵 쉬스창이 물러나고 리위안훙이 대총통에 복귀했으나 1923년 6월 쫓겨났고, 같은 해 10월 차오쿤이 의원들에게 뇌물을 주고 대총통에 올랐다. 1924년 9~11월 제2차 즈펑 전쟁에서 즈리파의 펑위샹이 등을 돌려 10월 베이징을 장악하고 차오쿤을 가두었다. 차오쿤이 물러난 자리는 황푸가 잠시 대총통 직무로 메웠고, 승자들은 11월 돤치루이를 임시 집정으로 앉혔다. 1926년 3월 18일에는 집정부 위병이 시위 군중에 총을 쏘아 학생 등 47명이 숨졌다. 4월 돤치루이가 물러난 뒤에는 섭정 내각이 잇따랐고, 1927년 6월에는 장쭤린이 베이징에서 대원수를 칭하며 군정부를 세웠다. 베이징 정부는 열강의 승인을 받는 중앙 정부로 남았으나 세수는 지방이 거두어 가고 군벌 사이의 싸움이 끊이지 않아 농촌은 징발과 세금, 약탈에 시달렸다. 안후이파와 펑톈파는 일본의, 즈리파는 영국과 미국의 지원을 받는다고 알려졌다. 군벌 전쟁은 1926년 시작된 「북벌과 국공 분열」(뒤의 사건)로 정리되었고, 1928년 12월 장쉐량이 난징 국민 정부를 따르면서 형식상의 통일이 이루어졌다."
  subjects: [roc, japan, uk, usa]
  tags: [politics, war]
  sources: ["Hsi-sheng Ch'i, Warlord Politics in China, 1916–1928 (Stanford University Press, 1976)", "The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)"]

- id: may-fourth-1919
  year: 1919
  title:
    ko: "5·4 운동(1919)"
  summary:
    ko: "1919년 1월 파리 강화 회의가 열리자 중화민국은 승전국으로서 산둥에 있던 독일의 권익을 돌려받기를 기대했다. 그러나 일본이 칭다오를 점령하고 있었고, 1915년 「일본의 21개조 요구」(앞의 사건) 뒤 맺은 조약과 1918년 돤치루이 정부가 일본과 주고받은 문서가 근거로 내세워져, 4월 말 미국·영국·프랑스는 독일의 산둥 권익을 일본에 넘기는 쪽으로 기울었다. 소식이 알려지자 5월 4일 베이징의 대학생 3,000여 명이 톈안먼 앞에 모여 밖으로는 주권을 지키고 안으로는 매국노를 물리치자고 외치며 친일 관료로 지목된 차오루린·장쭝샹·루쭝위를 규탄했다. 학생들은 차오루린의 집에 불을 질렀고 경찰은 학생 30여 명을 붙잡았다. 정부가 학생을 억누르자 6월 3일부터 더 많은 학생이 거리로 나섰고 이들이 대량 검거되자 상하이의 상인들이 가게 문을 닫고 노동자들이 6월 5일부터 파업에 들어갔다. 6월 10일 무렵 세 관료가 면직되었으며, 파리의 중국 대표단은 6월 28일 베르사유 조약에 서명하지 않았다(「파리 강화 회의와 베르사유 조약」(앞의 사건)). 산둥 문제는 뒤에 「워싱턴 회의」(뒤의 사건)에서 일본이 산둥 권익을 돌려주기로 하면서 풀렸다. 좁은 뜻의 5·4 운동은 이날의 시위지만, 넓게는 신문화 운동(「신문화 운동」(앞의 사건))을 이어 이후 몇 해 동안 번진 사상·사회 운동 전체를 가리킨다. 그해 3월 한국의 「3·1 운동」(앞의 사건) 소식이 중국 지식인에게 알려져 영향을 주었다는 평가도 있다. 학생과 상인, 노동자가 함께 나선 경험은 민중을 끌어들이는 정치의 길을 열었다. 마르크스주의를 받아들이는 지식인이 늘어 「중국 공산당의 창당」(뒤의 사건)으로 이어졌고, 쑨원도 10월 중화혁명당을 중국 국민당으로 고쳐 대중에 뿌리를 둔 정당을 꾀했다."
  subjects: [roc, japan, usa, uk, france, occupied-korea]
  tags: [politics, society, diplomacy]
  sources: ["Chow Tse-tung, The May Fourth Movement: Intellectual Revolution in Modern China (Harvard University Press, 1960)", "The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)", "「베르사유 조약」(1919)"]

- id: ccp-founding-1921
  year: 1921
  endYear: 1923
  title:
    ko: "중국 공산당의 창당(1921~1923)"
  summary:
    ko: "러시아 혁명의 영향과 5·4 운동 뒤 마르크스주의 연구 모임이 베이징과 상하이를 비롯한 여러 곳에서 생겼고, 코민테른이 보낸 보이틴스키와 마링(네덜란드 사람 스네이블리트) 같은 사람들이 이들을 이었다. 천두슈와 리다자오가 중심이 되어 1921년 7월 23일 상하이 프랑스 조계의 한 학교 건물에서 중국 공산당 제1차 전국 대표 대회가 열렸다. 천두슈와 리다자오는 참석하지 못했고, 각지 모임을 대표한 13명(마오쩌둥·둥비우 등)과 코민테른 사람들이 모였다. 이때 당원은 전국에 50여 명(57명으로 집계하기도 한다)이었다고 한다. 회의 도중 조계 경찰이 수색에 나서자 대표들은 흩어져 저장성 자싱 난후에 띄운 배에서 회의를 마쳤다. 대회는 프롤레타리아 독재와 생산 수단의 사회적 소유를 강령으로 내걸고, 다른 정당과 손잡지 않는다는 방침을 정했으며, 천두슈를 책임자(중앙국 서기)로 뽑았다. 대회 날짜가 분명하지 않았기에 창립 기념일은 뒤에 7월 1일로 정해졌다. 1922년 7월 제2차 대회는 코민테른 가입을 결정하고 제국주의와 군벌을 타도하는 민주주의 혁명을 당면 목표로 정했으며, 마링의 권유로 국민당과 협력하는 방안이 논의되어 1923년 6월 제3차 대회에서 공산당원이 개인 자격으로 국민당에 들어가기로 했다(「제1차 국공 합작」(뒤의 사건)). 당시 중화민국에서 노동자는 극소수였고 초기 공산당은 지식인 중심의 작은 단체였다. 철도와 광산에서 노동 운동을 이끌며 뿌리를 내렸으나 1923년 2월 7일 징한 철도 파업이 군벌 우페이푸에게 진압되어 큰 타격을 입었다. 코민테른의 지도와 소련의 지원 아래 활동한 당은 작은 규모를 벗어나기 위해 국민당과의 협력을 택했다."
  subjects: [roc, soviet-union]
  tags: [politics]
  sources: ["Arif Dirlik, The Origins of Chinese Communism (Oxford University Press, 1989)", "Tony Saich, The Rise to Power of the Chinese Communist Party: Documents and Analysis (M. E. Sharpe, 1996)", "The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)"]

- id: first-united-front-1923
  year: 1923
  endYear: 1925
  title:
    ko: "제1차 국공 합작(1923~1925)"
  summary:
    ko: "1923년 1월 쑨원은 상하이에서 소련 대표 요페와 공동 선언을 내어, 중국에 소비에트 제도를 그대로 들여올 수 없다는 데 뜻을 모으고 소련이 중국의 통일과 독립을 돕겠다는 약속을 받았다. 쑨원은 군벌과 맺은 연합이 번번이 깨진 경험 끝에 소련의 군사·정치 도움과 공산당의 조직력을 받아들이기로 했다. 코민테른 고문 보로딘이 국민당 개조를 도왔고, 1924년 1월 광저우에서 열린 국민당 제1차 전국 대표 대회는 소련과 연합하고(연소) 공산당을 받아들이며(용공) 농민과 노동자를 돕는다(부조농공)는 방향을 정하고 삼민주의를 새로 풀이했다. 공산당원 리다자오와 마오쩌둥 등이 개인 자격으로 국민당 중앙에 들어갔다. 이것이 제1차 국공 합작이다. 1924년 6월 광저우 황푸의 창저우섬에 소련의 도움으로 군관 학교를 세워 장제스가 교장이 되었고, 저우언라이도 그해 말 정치부에 합류했다. 졸업생은 국민혁명군의 중심이 되었다. 쑨원은 1924년 11월 북쪽으로 올라가 군벌과의 협상으로 통일을 꾀했으나 병이 깊어져 1925년 3월 12일 베이징에서 숨졌다. 그해 5월 30일 상하이에서 공공 조계 경찰이 일본인 공장 노동자의 죽음에 항의하던 군중에게 총을 쏴 10여 명이 숨지는 5·30 사건이 일어나 반제국주의 파업이 홍콩과 광저우까지 번졌고, 6월 23일 광저우에서도 샤몐 조계의 영국·프랑스 군이 맞은편 샤지 거리의 시위대에 사격해 50명 안팎이 숨졌다. 이 운동 속에서 국민당과 공산당의 조직이 크게 늘었고, 7월 1일 광저우에 중화민국 국민 정부가 세워졌다. 그러나 합작 안에는 국민당 우파와 공산당 사이의 불신이 깊었고, 쑨원이 죽자 후계를 둘러싼 갈등이 커져 합작은 「북벌과 국공 분열」(뒤의 사건) 도중에 깨졌다."
  subjects: [roc, soviet-union, uk, france]
  tags: [politics]
  sources: ["The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)", "「쑨원-요페 선언」(1923)", "C. Martin Wilbur, Sun Yat-sen: Frustrated Patriot (Columbia University Press, 1976)"]

- id: northern-expedition-1926
  year: 1926
  endYear: 1928
  title:
    ko: "북벌과 국공 분열(1926~1928)"
  summary:
    ko: "1926년 7월 장제스는 중화민국 국민 정부의 국민혁명군 총사령관으로 북벌을 시작했다. 10만 명 안팎의 군이 소련 고문의 도움을 받으며 군벌 우페이푸·쑨촨팡·장쭤린을 차례로 겨냥했다. 국민혁명군은 후난을 거쳐 10월 우창을 함락시켜 우페이푸를 꺾고, 이어 쑨촨팡의 장시·장쑤·저장 지역을 무너뜨렸다. 농민과 노동자의 지원 속에 싸움이 빨랐다. 정부는 1926년 말 우한으로 옮겼으나 장제스는 난창에 머물며 왕징웨이·보로딘·공산당이 이끄는 우한 정부와 맞섰다. 1927년 3월 상하이에서 노동자의 무장 봉기에 이어 국민혁명군이 들어왔고, 3월 24일 난징에서 국민혁명군 병사들이 외국인을 습격하자 영국·미국 군함이 포격하는 난징 사건이 일어났다. 4월 12일 장제스는 상하이에서 공산당원과 노조 활동가를 체포하고 죽였으며(4·12 정변) 이어진 며칠 동안 희생자가 더 늘었다. 4월 18일에는 난징에 따로 국민 정부를 세웠다. 우한 정부도 7월 공산당과 갈라서고 9월 난징 쪽과 합쳤다. 이로써 「제1차 국공 합작」(앞의 사건)이 끝났다. 공산당은 8월 1일 난창 봉기를 일으켰고(이날은 훗날 인민해방군 창군 기념일이 되었다), 마오쩌둥은 9월 추수 봉기에 이어 징강산으로 들어갔다. 12월 광저우 봉기는 며칠 만에 진압되었다. 장제스는 8월 총사령관에서 물러났다가 이듬해 복귀해 4월 북벌을 다시 시작했다. 5월 지난에서는 일본군이 산둥에 출병해 국민혁명군과 충돌했다(지난 사건). 6월 4일 퇴각하던 장쭤린이 탄 열차가 선양 근처 황구툰에서 폭파되어 그가 숨졌다. 관동군 참모 고모토 다이사쿠가 꾸민 일로 보는 견해가 일반적이다. 6월 초 옌시산의 군이 베이징에 들어가 북벌은 사실상 끝났고, 베이징은 베이핑으로 이름이 바뀌었다. 12월 29일 장쭤린의 아들 장쉐량이 둥베이의 깃발을 청천백일기로 바꾸어(동북역치) 난징 정부를 따르면서 형식상의 통일이 이루어졌다."
  subjects: [roc, soviet-union, uk, usa, japan]
  tags: [war, politics]
  sources: ["The Cambridge History of China, vol. 12: Republican China 1912–1949, Part 1 (John K. Fairbank 편, Cambridge University Press, 1983)", "Jonathan D. Spence, The Search for Modern China (W. W. Norton, 1990)", "Harold R. Isaacs, The Tragedy of the Chinese Revolution (Stanford University Press, 1961)"]

- id: jiangxi-soviet-1927
  year: 1927
  endYear: 1934
  title:
    ko: "징강산에서 장시 소비에트까지(1927~1934)"
  summary:
    ko: "4·12 정변 뒤 국민당의 탄압으로 도시의 공산당 조직이 무너지자 공산당은 농촌에서 무장 투쟁을 이어 갔다. 마오쩌둥은 1927년 가을 추수 봉기에 실패한 군을 이끌고 후난·장시 경계의 징강산에 들어갔고, 1928년 4월 난창 봉기의 잔여를 이끈 주더의 군대와 합쳐 홍군 제4군을 꾸렸다. 이들은 지주의 땅을 몰수해 농민에게 나누어 주며 군대와 농민의 지지를 얻는 근거지를 넓혔다. 1929년 말 구톈 회의에서는 당이 군을 이끈다는 원칙이 확인되었다. 1931년 11월 7일 장시성 루이진에서 중화 소비에트 공화국 임시 중앙 정부가 세워져 마오쩌둥이 주석이 되었다. 소비에트 지구는 장시와 푸젠 일대에 걸쳐 인구가 수백만 명에 이르렀다고 한다. 소비에트에서는 토지 재분배와 세금 감면, 혼인법 같은 시책이 추진되었으나 지주와 부농에 대한 폭력, 반혁명 혐의로 인한 숙청도 심했다. 중화민국의 국민당 정부는 1930년 12월부터 네 차례 포위 토벌을 벌였으나 홍군을 몰아내지 못했다. 마오쩌둥은 적을 깊숙이 끌어들여 치는 유격전을 폈다. 그러나 1931년 상하이의 당 중앙이 무너지자 보구 같은 중앙 간부와 코민테른 군사 고문 오토 브라운이 장시로 들어와(1933년) 진지전을 폈고, 마오쩌둥은 이미 1932년 군사 지휘권을 잃은 상태였다. 장제스가 독일인 군사 고문의 건의로 토치카를 이어 쌓으며 천천히 조여 오는 제5차 포위 토벌(1933년 9월~)에서 홍군은 큰 피해를 입었다. 1934년 10월 중앙 홍군은 소비에트 지구를 버리고 떠났다(「장정과 쭌이 회의」(뒤의 사건)). 소비에트 시기의 경험은 농민 동원과 토지 개혁, 군과 정치를 결합하는 방식으로 뒷날 공산당 노선에 영향을 주었다."
  subjects: [roc]
  tags: [war, politics]
  sources: ["The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)", "Tony Saich, The Rise to Power of the Chinese Communist Party: Documents and Analysis (M. E. Sharpe, 1996)", "Jonathan D. Spence, The Search for Modern China (W. W. Norton, 1990)"]

- id: nanjing-government-1928
  year: 1928
  endYear: 1937
  title:
    ko: "난징 국민 정부의 10년(1928~1937)"
  summary:
    ko: "북벌로 형식상의 통일을 이룬 중화민국의 난징 국민 정부는 1928년 10월 쑨원이 구상한 군정·훈정·헌정 가운데 훈정, 곧 국민당이 국민을 이끄는 단계에 들어선다고 선언하고 국민당 중앙이 정부를 이끌게 했다. 입법·행정·사법·고시·감찰의 5원 제도를 갖추었고, 장제스가 국민 정부 주석과 군사 위원회 위원장을 겸하며 군을 쥐었다. 정부는 열강과 협정을 맺어 관세 자주권을 되찾는 데 힘썼고(1928~1930), 치외 법권 회수는 이루지 못했다. 그러나 장제스의 통일은 군벌을 없앤 것이 아니었다. 펑위샹·옌시산·리쭝런 등은 군대 감축에 반발했고, 1930년 5월부터 11월까지 펑위샹·옌시산이 왕징웨이와 손잡고 장제스에 맞선 중원 대전이 벌어졌다. 장쉐량이 9월 장제스 편에 서면서 끝났다. 1931년 5월에는 후한민의 구금을 계기로 광저우에 따로 정부가 세워졌다. 소련과는 1929년 중동 철도를 회수하려다 군사 충돌을 빚었고 싸움에서 졌다. 경제에서는 1935년 11월 법폐 개혁으로 중앙·중국·교통 은행이 내는 지폐만 법정 통화로 삼고 은을 국유화했다. 영국인 고문 리스로스가 이를 도왔다. 1929~1936년 사이 철도·도로·전신과 근대 산업이 늘었고 상하이와 난징은 근대 도시의 모습을 갖추었다는 평가가 있다. 그러나 대공황의 여파로 은값이 오르며 은이 해외로 빠져나가 불황이 닥쳤고, 농촌은 지주와 고리대, 세금과 전쟁에 시달렸다. 장제스는 1934년 신생활 운동으로 예의와 염치, 위생을 앞세워 유교 도덕을 되살리려 했다. 일본의 침략(「만주 사변과 만주국」(뒤의 사건))이 이어지는 동안에도 먼저 공산당을 토벌해 나라 안을 평정한 뒤 밖을 물리친다는(안내양외) 방침을 고집해 비판이 커졌다. 공산당과의 싸움은 「징강산에서 장시 소비에트까지」(앞의 사건)를 지나 1930년대 중반 「장정과 쭌이 회의」(뒤의 사건)으로 이어졌다."
  subjects: [roc, soviet-union, uk, japan]
  tags: [politics, economy]
  sources: ["Lloyd E. Eastman, The Abortive Revolution: China under Nationalist Rule, 1927–1937 (Harvard University Press, 1974)", "The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)"]

- id: shanghai-tanggu-1932
  year: 1932
  endYear: 1935
  title:
    ko: "상하이 사변과 탕구 정전 협정, 화북 분리 공작(1932~1935)"
  summary:
    ko: "만주 사변(「만주 사변과 만주국」(앞의 사건)) 뒤 일본은 중국 본토로도 군사 압력을 넓혔다. 1932년 1월 28일 일본 해군 육전대가 상하이 자베이에 들어가 중국 제19로군(차이팅카이·장광나이)과 싸웠다(1·28 상하이 사변). 일본이 육군을 더 보내자 중국군이 물러났고, 5월 5일 상하이 정전 협정으로 중국군이 상하이 일대에 주둔하지 않는 대신 일본군도 원래 위치로 돌아가기로 했다. 4월 29일에는 훙커우 공원에서 윤봉길이 일본 군인과 관리를 겨냥해 폭탄을 던졌다(「한인 애국단의 이봉창·윤봉길 의거」(뒤의 사건)). 1933년 1월 일본군은 산하이관을 점령했고, 2월 말부터 러허성(열하)을 공격해 3월 초 청더를 차지했다. 러허성은 만주국에 편입되었다. 5월 31일 탕구 정전 협정으로 중국군은 베이핑·톈진 둘레 동부 허베이의 넓은 지역에서 물러나 비무장 지대가 생겼고, 일본군은 화북에 손쉽게 닿게 되었다. 이 협정은 사실상 만주국을 묵인했다는 비판을 받았다. 비무장 지대에서는 일본이 뒤에서 도운 친일 정권이 세워졌고, 중국에서는 이런 움직임을 화북 분리 공작이라 불렀다. 1935년 6월에는 허메이 협정(허잉친·우메즈 요시지로)으로 허베이성의 국민당 기관과 군대가 물러났고, 같은 달 친도 협정으로 차하얼성에서도 중국군이 철수했으며, 11월에는 일본의 후원을 받은 인루겅의 지둥 방공 자치 위원회가 세워졌다. 중화민국 국민 정부는 먼저 공산당을 토벌해 나라 안을 평정한 뒤 일본을 물리치겠다는 방침이었기에 군사 충돌을 피하고 협상으로 풀려 했다. 이에 대한 반발이 커져 1935년 12월 9일 베이핑 학생들이 화북 자치 반대와 항일 구국을 외치며 시위를 벌였고(12·9 운동), 항일 여론이 전국으로 번졌다. 같은 시기 장제스는 독일 군사 고문단의 도움을 받아 군대를 고치고 국방 공업을 키우는 일에 나섰다."
  subjects: [roc, japan, manchukuo]
  links:
    - { from: manchukuo, to: roc, note: "열하 작전, 러허성 편입 (1933)" }
  tags: [war, diplomacy]
  sources: ["The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)", "「상하이 정전 협정」(1932)", "「탕구 정전 협정」(1933)", "『리턴 조사단 보고서』"]

- id: manchukuo-1932
  year: 1932
  endYear: 1945
  title:
    ko: "만주국의 건국과 통치(1932~1945)"
  summary:
    ko: "1931년 9월 관동군이 만주 사변을 일으켜 둥베이 지역을 차지하자(「만주 사변과 만주국」(앞의 사건)) 일본은 이곳을 중화민국에서 떼어 낸 새 나라를 세우려 했다. 1932년 3월 1일 만주국의 건국이 선언되었고 수도는 창춘을 고쳐 부른 신경으로 정해졌다. 3월 9일에는 일본군이 톈진에서 뤼순으로 데려가 두었던 청의 마지막 황제 푸이를 창춘으로 불러 집정으로 앉혔다. 국가 이념은 일본인·한족·조선인·만주인·몽골인이 함께한다는 오족협화와 왕도낙토로 포장되었다. 그러나 실권은 관동군 사령관과 일본인 관료에게 있었다. 9월 일만 의정서로 일본군의 주둔이 인정되었고 총무장관을 비롯한 요직은 일본인이 차지했다. 1934년 3월 제정으로 바뀌어 푸이는 황제(연호 강덕)가 되었으나 관동군의 허수아비였다는 평가가 일반적이다. 정치 조직인 협화회가 주민 동원을 맡았고, 항일 활동은 가혹하게 탄압되었다. 경제에서는 남만주 철도와 만주중공업개발회사를 중심으로 철도·광산·제철·군수 공업이 성장하여 만주는 일본의 대륙 병참 기지가 되었다. 1936년 이후 일본 농민의 집단 이민이 추진되어 개척단으로 수십만 명이 들어왔고, 이 과정에서 현지 농민의 땅이 헐값으로 수용되어 불만이 커졌다. 국제 연맹은 리턴 조사단 보고서(1932년 10월)를 바탕으로 1933년 2월 만주국을 인정하지 않는 권고안을 채택했고 일본은 연맹을 떠났다. 만주국을 승인한 나라는 일본과 1930년대 후반의 독일·이탈리아 등 일부에 그쳤다. 만주의 중국인과 조선인들은 동북 항일 연군 같은 무장 조직을 만들어 맞섰다(「동북 항일 연군과 보천보 전투」(뒤의 사건)). 1945년 8월 9일 소련군이 만주로 밀고 들어오면서 만주국은 무너졌고, 푸이는 퇴위 문서에 서명한 뒤 소련군에 붙잡혔다(「중일 전쟁과 일본군 점령지」(뒤의 사건))."
  subjects: [manchukuo, japan, roc, soviet-union]
  links:
    - { from: japan, to: manchukuo, note: "관동군의 건국 주도, 실권 장악 (1932)" }
  tags: [politics, war]
  sources: ["Prasenjit Duara, Sovereignty and Authenticity: Manchukuo and the East Asian Modern (Rowman & Littlefield, 2003)", "Louise Young, Japan's Total Empire: Manchuria and the Culture of Wartime Imperialism (University of California Press, 1998)", "『리턴 조사단 보고서』", "「일만 의정서」(1932)"]

- id: long-march-1934
  year: 1934
  endYear: 1936
  title:
    ko: "장정과 쭌이 회의(1934~1936)"
  summary:
    ko: "1934년 10월 중앙 홍군은 중화민국 국민 정부의 제5차 포위 토벌에 밀려 장시의 소비에트 지구(「징강산에서 장시 소비에트까지」(앞의 사건))를 버리고 떠났다. 10월 16일 위두 일대에서 출발한 부대는 8만 6천 명 안팎이었다고 하며(자료에 따라 7만~13만 명으로 갈린다), 군과 함께 당 간부와 짐 행렬이 길게 이어졌다. 국민당군이 쌓은 봉쇄선을 뚫고 후난·광시 경계의 샹장강을 건너려던 11월 말부터 12월 초 사이에 홍군은 3만 명 안팎으로 줄어 병력의 절반 넘게를 잃었다. 이 패배로 보구와 오토 브라운의 지휘에 대한 불만이 커졌고, 1935년 1월 15~17일 구이저우 쭌이에서 열린 정치국 확대 회의는 군사 지휘의 잘못을 비판했다. 이 회의에서 보구는 당 책임에서 밀려나 장원톈이 뒤를 이었고, 마오쩌둥은 군사 지휘에 다시 참여했으며 저우언라이는 군사 지휘의 최종 책임을 쥔 채 마오를 지지했다. 마오는 그해 11월 산베이에서 세워진 서북 혁명 군사 위원회의 주석이 되었으나 아직 당의 최고 직책을 맡지는 않았기에, 당시 마오의 권한이 어디까지였는지는 학자들 사이에 논쟁이 있다. 홍군은 5월 진사강을 건너고 5월 29일 다두허의 루딩교를 차지해(이 전투가 얼마나 격렬했는지는 근래 연구에서 논쟁이 있다) 쓰촨 서부의 설산과 습지를 넘어갔다. 6월 쓰촨 서북부에서 장궈타오가 이끄는 제4방면군과 합쳤으나 이후 진로를 두고 의견이 갈려 8~9월 두 부대는 다시 갈라섰다. 마오쩌둥이 이끈 제1방면군은 10월 19일 산시(陝西) 북부 우치진에 닿았다. 처음 출발한 병력 가운데 남은 사람은 8천 명 안팎, 많아야 1만 명이었다고 한다. 1936년 10월 제4방면군이 간쑤 후이닝에서 제1방면군과 만났고 제2방면군도 장타이바오 일대에서 합류했다. 마오가 주장한 행군 거리는 2만 5천 리(약 1만 2,500km)였지만 근래 연구는 이보다 짧게 본다. 홍군은 이족·티베트족·창족 등 소수 민족 지역을 지나며 식량을 구해야 했다. 공산당은 이후 옌안을 근거지로 삼았다. 장정은 훗날 공산당 신화의 핵심이 되었고 마오쩌둥의 지도력이 세워진 계기였다는 평가가 일반적이다."
  subjects: [roc]
  tags: [war, politics]
  sources: ["The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)", "Harrison E. Salisbury, The Long March: The Untold Story (Harper & Row, 1985)", "Sun Shuyun, The Long March: The True History of Communist China's Founding Myth (Doubleday, 2007)"]

- id: xian-incident-1936
  year: 1936
  title:
    ko: "시안 사건(1936)"
  summary:
    ko: "일본의 압박(「상하이 사변과 탕구 정전 협정, 화북 분리 공작」(앞의 사건))이 이어지고 12·9 운동으로 항일 여론이 높아졌으나 장제스는 먼저 공산당을 토벌한다는 방침을 고집했다. 장제스는 1936년 12월 4일 시안에 와서 장쉐량의 둥베이군과 양후청의 시베이군에 홍군 공격을 재촉했다. 장쉐량은 아버지 장쭤린이 일본군에게 목숨을 잃고(「북벌과 국공 분열」(앞의 사건)) 둥베이 땅을 빼앗긴 뒤 항일이 우선이라 생각해 홍군과 비밀리에 접촉하고 있었다. 12월 12일 새벽 장쉐량과 양후청의 군대는 시안 근교 화칭츠에 머물던 장제스를 붙잡았다(시안 사건, 이른바 병간). 두 사람은 내전 중지, 정부 개편, 정치범 석방, 민중의 애국 운동 허용, 항일 구국 등을 요구했다. 난징의 중화민국 정부 안에서는 시안을 군사적으로 치자는 주장과 협상하자는 주장이 맞섰다. 공산당 안에는 장제스를 재판하자는 의견도 있었으나 저우언라이가 시안에 가서 협상에 나섰고, 소련도 항일 통일 전선을 위해 장제스를 해치지 않기를 바랐다는 설명이 있다. 장제스의 부인 쑹메이링과 처남 쑹쯔원이 시안으로 와서 협상에 참여했고 12월 25일 장제스가 풀려나 이튿날 난징에 닿았다. 합의의 세부 내용은 공개되지 않았으나 장제스가 공산군 토벌을 멈추고 항일로 방향을 바꾸는 쪽으로 기울었다는 평가가 많다. 장쉐량은 장제스를 따라 난징에 가서 처벌을 자청했고 군법 재판에서 징역형을 선고받은 뒤 특별 사면되었으나 오랫동안 연금되었다. 양후청은 뒤에 체포되어 오랜 구금 끝에 살해되었다. 이 사건은 내전을 멈추고 국민당과 공산당이 일본에 함께 맞서는 길을 열었고(「제2차 국공 합작과 항일 근거지」(뒤의 사건)), 항일 전쟁이 터지자 합작이 실현되었다."
  subjects: [roc, japan, soviet-union]
  tags: [politics, war]
