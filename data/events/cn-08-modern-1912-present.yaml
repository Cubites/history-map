- id: shanghai-nanjing-1937
  year: 1937
  endYear: 1938
  title:
    ko: "상하이 전투와 난징 대학살(1937~1938)"
  summary:
    ko: "1937년 7월 루거우차오 사건으로 시작된 전면전(「중일 전쟁과 민족 말살 통치」(앞의 사건))은 8월 13일 상하이로 번졌다. 상하이에서 중국은 독일 고문단이 훈련한 정예 부대를 투입했고, 장제스는 국제 도시 상하이에서 일본군에 맞서는 모습을 열강에 보이려 했다. 석 달 동안 이어진 싸움에서 일본군은 11월 5일 항저우만에 상륙해 중국군의 뒤를 돌았고, 11월 12일 상하이가 함락되었다. 중국군 사상자는 20만 명 안팎으로 추산되며 일본군도 4만 명 가까운 사상자를 냈다고 한다. 중화민국 국민 정부는 11월 20일 충칭으로 수도를 옮긴다고 선언했다. 일본군은 난징으로 밀고 올라가 탕성즈의 수비군과 싸운 끝에 12월 13일 도시에 들어갔다. 이후 일본군은 중국군 포로와 패잔병, 민간인을 대량으로 학살하고 약탈과 방화, 집단 강간을 저질렀다. 난징 안전구 국제 위원회는 존 라베(독일 사업가) 등 외국인 선교사와 교수들이 꾸려 난민 20만 명 안팎을 보호했다고 평가된다. 일본군 지휘관으로는 중지나 방면군 사령관 마쓰이 이와네, 상하이 파견군을 이끈 황족 아사카노미야 야스히코 왕, 사단장 나카지마 게사고 등이 거론된다. 학살은 6주가량 집중되었고 난징 일대의 가해는 이듬해 3월까지 이어졌다고도 본다. 피해자 수는 집계 범위(지역과 기간)와 방법에 따라 크게 갈린다. 전후 극동 국제 군사 재판은 20만 명 넘게, 중국 정부는 30만 명 넘게 보며, 일본 학계의 추산은 수만 명에서 20만 명 안팎까지 나뉜다. 성폭행 피해도 수천 건에서 수만 건 사이로 추산이 갈리는데 2만 건 안팎이 자주 인용된다. 일본에서는 사건의 규모와 성격을 부정하거나 줄이려는 주장도 나와 논쟁이 이어지고 있다. 이 학살은 중국인의 항전 의지를 오히려 높였고, 훗날 중국에서 일본의 침략을 기억하는 중심 사건이 되었다. 난징 함락 뒤의 점령은 「중일 전쟁과 일본군 점령지」(뒤의 사건)에서 다룬다."
  subjects: [roc, japan, occupied-china]
  links:
    - { from: japan, to: roc, note: "상하이 전투, 난징 공략과 학살 (1937~1938)" }
  tags: [war]
  sources: ["Hans van de Ven, China at War: Triumph and Tragedy in the Emergence of the New China, 1937–1952 (Harvard University Press, 2018)", "Joshua A. Fogel 편, The Nanjing Massacre in History and Historiography (University of California Press, 2000)", "Rana Mitter, Forgotten Ally: China's World War II, 1937–1945 (Houghton Mifflin Harcourt, 2013)"]

- id: anti-japanese-bases-1937
  year: 1937
  endYear: 1945
  title:
    ko: "제2차 국공 합작과 항일 근거지(1937~1945)"
  summary:
    ko: "「시안 사건」(앞의 사건) 뒤 협상이 이어진 끝에, 루거우차오 사건 직후인 1937년 9월 공산당이 국공 합작 선언을 발표했고 중화민국 정부의 장제스가 담화로 이를 받아들이면서 제2차 국공 합작이 이루어졌다. 소비에트 정부는 해산되어 산간닝 변구 정부로 바뀌었고, 홍군은 국민혁명군 제8로군(주더·펑더화이)으로, 남쪽에 남은 부대는 신편 제4군(신사군, 예팅·샹잉)으로 고쳐 편성되었다. 그러나 공산당은 독자적인 지휘권과 조직을 유지했다. 제8로군은 1937년 9월 25일 산시(山西) 핑싱관에서 일본군 수송대를 습격해 이름을 알렸고, 일본군이 대도시와 철도를 점령한 사이 농촌에서 유격전을 펴며 화북과 화중의 점령지 뒤에 근거지를 넓혔다. 1940년 8월부터 12월까지 펑더화이가 지휘한 백단 대전에서는 100여 개 연대가 화북의 철도와 탄광을 일제히 공격했다. 일본군은 보복으로 근거지를 불태우고 농민을 죽이거나 끌고 가는 소탕 작전을 벌였고, 중국에서는 이를 삼광(三光) 작전이라 부른다. 국민당과의 관계는 점차 나빠져, 1941년 1월 안후이 남부 마오린에서 국민당군이 창장강 남쪽에서 북쪽으로 옮기던 신사군 지휘 본부 부대를 포위 공격해 많은 병사가 죽고 샹잉이 숨지고 예팅이 붙잡혔다(환난 사변). 합작은 형식만 남았다. 마오쩌둥은 1942년 옌안에서 정풍 운동을 벌여 당 안의 다른 노선을 정리하고 자신의 사상을 당의 지도 이념으로 세웠으며, 그 과정에서 간첩 혐의로 사람들을 몰아붙이는 일도 있었다. 근거지에서는 소작료와 이자를 낮추고 생산 운동을 벌여 농민의 지지를 얻었다. 당원은 1937년 4만 명 안팎에서 1945년 4월 제7차 당 대회 때 120만 명 안팎으로 늘었다고 한다. 국민당은 공산당이 항일보다 세력 확장에 힘썼다고 비판했고, 공산당은 국민당이 소극적이었다고 비판했다."
  subjects: [roc, japan, occupied-china]
  tags: [war, politics]
  sources: ["Chalmers A. Johnson, Peasant Nationalism and Communist Power: The Emergence of Revolutionary China, 1937–1945 (Stanford University Press, 1962)", "Hans van de Ven, China at War: Triumph and Tragedy in the Emergence of the New China, 1937–1952 (Harvard University Press, 2018)", "The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)"]

- id: chongqing-resistance-1938
  year: 1938
  endYear: 1941
  title:
    ko: "우한 함락과 충칭 정부의 지구전(1938~1941)"
  summary:
    ko: "1938년 일본군은 쉬저우를 거쳐 우한으로 진격했다. 3월부터 4월까지 산둥 타이얼좡에서 리쭝런 등이 이끈 중국군이 일본군 일부를 막아 낸 승리는 사기를 높였으나, 5월 19일 쉬저우를 빼앗겼다. 6월 일본군이 정저우 쪽으로 다가오자 중국군은 정저우 북쪽 화위안커우에서 황허강 남쪽 제방을 허물었다. 장제스가 승인한 이 조치로 일본군의 진격은 늦어졌고 우한 방어에 시간을 벌었으나, 홍수는 허난·안후이·장쑤의 농민들에게 큰 재앙이었다. 직접 익사한 사람은 3만~9만 명, 뒤이은 기근과 전염병까지 합친 희생은 자료마다 크게 갈려 40만~90만 명 안팎으로 추산되며 난민은 수백만 명에 이르렀다. 일본군은 10월 광저우(21일)와 우한(25~27일)을 점령했다. 중화민국 국민 정부는 충칭을 임시 수도로 삼고 공장과 학교, 정부 기관을 서남부로 옮겼다. 일본은 충칭을 폭격해 1938년부터 여러 해 동안 수천 명에서 1만 명 넘는 민간인이 희생되었다고 한다. 중국은 일본군이 도시와 철도를 가졌어도 농촌 전부를 다스릴 수 없다는 점을 이용해 땅을 내주며 시간을 버는 지구전으로 맞섰다. 일본 점령지에서는 1938년 12월 충칭을 빠져나온 왕징웨이가 일본과 타협하는 평화 운동을 펴 1940년 3월 난징에 ‘국민 정부’를 세웠고, 이 정권은 일본의 괴뢰로 간주된다(「중일 전쟁과 일본군 점령지」(앞의 사건)). 남쪽으로는 영국령 버마와 이어지는 도로가 1938년 말 열려 외부 물자가 들어왔다. 1939년 말에서 1940년 초 광시 쿤룬관에서는 중국군이 일본군을 몰아냈다. 1940년 7월 일본이 영국을 압박해 버마 공로가 석 달 동안 닫히기도 했다. 소련은 1938년부터 중국에 차관과 무기를 지원했고, 미국은 1941년 무기 대여법을 중국에 적용했다. 1941년 12월 태평양 전쟁이 터지자(「태평양 전쟁 발발」(뒤의 사건)) 중국은 연합국의 일원으로 일본에 정식으로 선전 포고를 했다."
  subjects: [roc, japan, occupied-china, soviet-union, uk, usa]
  links:
    - { from: japan, to: roc, note: "우한·광저우 공략 (1938)" }
  tags: [war]
  sources: ["Rana Mitter, Forgotten Ally: China's World War II, 1937–1945 (Houghton Mifflin Harcourt, 2013)", "Hans van de Ven, China at War: Triumph and Tragedy in the Emergence of the New China, 1937–1952 (Harvard University Press, 2018)", "The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)"]

- id: ichigo-1944
  year: 1944
  endYear: 1945
  title:
    ko: "이치고 작전과 스틸웰 소환(1944~1945)"
  summary:
    ko: "1944년 4월 일본군은 중국 대륙을 남북으로 잇는 철도를 확보하고, 중국 남부의 미군 항공 기지(구이린·류저우 등)를 없애려는 이치고 작전(대륙 타통 작전)을 시작했다. 51만 명 안팎이 동원된 이 작전은 일본 육군 역사상 가장 큰 작전으로 꼽힌다. 4월 허난에서 시작해 5월 25일 뤄양을 차지했고, 이어 후난으로 밀고 내려가 6월 18일 창사, 8월 8일 헝양을 점령했다. 헝양의 중국군은 47일 동안 포위 속에서 싸웠다. 가을에는 광시로 들어가 11월 구이린과 류저우 등을 차지했고 12월에는 프랑스령 인도차이나 쪽과 이어지는 철도를 연결했다. 미군은 기지를 잃고 서쪽으로 옮겨야 했다. 중국군의 패배는 병력과 보급의 부실, 부패, 앞선 대기근의 피해 때문으로 설명되며, 허난에서는 1942~1943년 대기근을 겪은 주민이 중국군에 적대적이었다는 증언도 있다. 중국군 사상자는 자료에 따라 30만~60만 명 안팎(70만까지 보는 자료도 있다)으로 갈리고 난민은 수백만 명에 이르렀다. 미국은 중화민국 충칭 정부의 능력에 실망했다. 중국 전구 참모장 스틸웰은 장제스에게 중국군 지휘권을 미국인 장군에게 넘기도록 압박하다가 10월 중순 소환되었고 후임으로 웨더마이어가 왔다. 한편 공산당이 다스리는 근거지는 늘어났고 옌안을 찾은 미국 관찰단 일부는 공산당의 군사력을 긍정적으로 보았다. 일본군은 점령지를 가장 넓게 늘렸으나 점령선이 길어지고 병력이 모자라 1945년 중반부터 차츰 물러났다. 미군은 이 무렵 마리아나 제도에서 일본 본토를 폭격할 수 있게 되어 중국 기지의 가치가 줄어들던 참이었다. 이치고 작전은 중국 전선에서 일본의 마지막 큰 승리였지만 태평양에서 일본이 이미 밀리고 있었기에 전쟁의 흐름을 바꾸지 못했다."
  subjects: [roc, japan, occupied-china, usa]
  links:
    - { from: japan, to: roc, note: "이치고 작전, 허난·후난·광시 점령 (1944)" }
  tags: [war]
  sources: ["Hans van de Ven, China at War: Triumph and Tragedy in the Emergence of the New China, 1937–1952 (Harvard University Press, 2018)", "Rana Mitter, Forgotten Ally: China's World War II, 1937–1945 (Houghton Mifflin Harcourt, 2013)", "Barbara W. Tuchman, Stilwell and the American Experience in China, 1911–45 (Macmillan, 1971)"]

- id: xinjiang-1944
  year: 1944
  endYear: 2022
  title:
    ko: "신장의 편입과 위구르 문제(1944~2022)"
  summary:
    ko: "신장은 청이 18세기에 복속시켰고 1884년 성으로 삼은 지역으로, 위구르·카자흐·한족·후이족 등이 산다. 신해혁명 뒤에는 양쩡신(1912~1928)·진수런(1928~1933)·성스차이(1933~1944)가 차례로 성을 다스렸다. 1944년 11월 소련의 영향권에서 이닝(쿨자) 등 북부 3구(이리·타청·알타이)에 반란이 일어나 동투르키스탄 공화국이 세워졌고, 소련이 무기와 무역으로 이를 도왔다. 이 정권은 1946년 6월 중화민국 정부와 연립 정부를 세우기로 합의했으나 1947년 8월 무너졌다. 1949년 9월 신장의 국민당 쪽 지도자들이 인민해방군에 투항하고 10월 군대가 들어오면서 신장은 중화인민공화국에 편입되었다(「국공 내전과 중화인민공화국 수립」(뒤의 사건)). 이닝 정권의 지도자들은 그해 8월 소련을 거쳐 베이징으로 가던 중 비행기 추락으로 숨졌다고 발표되었으나, 소련이 관여한 암살이라는 설도 있다. 1954년 생산 건설 병단이 세워져 군대가 황무지를 개간하며 한족 이주를 이끌었고, 1955년 10월 1일 신장 위구르 자치구가 성립했다. 한족 인구는 1949년 전체의 7% 안팎에서 1970년대 말 40% 안팎으로 늘었다. 중국 정부는 신장이 오래전부터 중국의 일부이고 개발과 안정을 가져왔다고 하며, 위구르 사회의 일부와 해외 단체는 문화와 종교의 억압, 이주 정책, 경제적 차별을 비판한다. 1962년에는 이닝 등지에서 6만여 명이 소련 쪽으로 넘어가는 이타 사건이 있었다(「중소 분쟁의 시작과 전바오섬 충돌」(뒤의 사건)). 1990년 바런 향 사건, 1997년 이닝 사건 같은 충돌이 이어졌고, 2009년 7월 5일 우루무치에서 폭력 사태가 일어나 중국 정부는 197명이 숨졌으며 대부분 한족이라고 발표했고, 위구르 단체들은 위구르인 희생이 더 많다고 주장했다. 2013~2014년 베이징·쿤밍·우루무치 등에서 위구르 분리주의자의 소행이라고 발표된 공격이 이어졌고(2014년 3월 쿤밍 역 칼부림으로 31명 사망), 중국 정부는 2014년 5월 엄타로 불리는 반테러 단속을 시작했다. 2017년 무렵부터 직업 기능 교육 훈련 센터라 부르는 시설에 위구르 등 이슬람계 주민을 대규모로 수용했고, 인권 단체와 연구자는 100만 명 안팎 또는 그 이상이 갇혔다고 추산한다. 중국 정부는 이 시설을 극단주의를 막는 직업 교육이라 설명하며 2019년 12월 교육생이 모두 수료했다고 발표했다. 2022년 8월 31일 유엔 인권 최고 대표 사무소는 신장 평가서에서 자의적이고 차별적인 구금 등이 국제 범죄, 특히 반인도 범죄에 해당할 수 있다고 평가했고, 중국은 이를 강하게 반박했다. 그해 10월 6일 유엔 인권 이사회는 이 평가서를 두고 토론을 열자는 안을 19대 17(기권 11)로 부결했다."
  subjects: [prc, roc, soviet-union]
  tags: [politics, society]
  sources: ["James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "UN 인권 최고 대표 사무소, 「신장 위구르 자치구 인권 우려 평가」(OHCHR Assessment of human rights concerns in the Xinjiang Uyghur Autonomous Region, 2022)"]

- id: japan-surrender-1945
  year: 1945
  endYear: 1946
  title:
    ko: "일본의 항복과 중국의 전후 접수(1945~1946)"
  summary:
    ko: "1945년 8월 8일 소련이 일본에 선전 포고를 하고 이튿날 만주로 진격했으며, 일본은 8월 15일 항복을 알렸다. 이에 앞서 8월 14일 충칭 정부와 소련은 모스크바에서 중소 우호 동맹 조약을 맺어 소련이 국민 정부만을 중국의 정부로 인정하고 만주를 중국에 돌려주기로 했다. 중국은 중국과 상의 없이 얄타에서 정해진 내용(「얄타 회담」(앞의 사건))에 따라 뤼순을 해군 기지로 소련과 함께 쓰고 다롄을 자유항으로 하며 창춘 철도를 소련과 공동 관리하는 데 동의했다. 9월 9일 난징에서 중국 전구의 항복 접수식이 열렸고, 10월 25일에는 타이베이에서 타이완 지역 일본군의 항복 접수가 이루어져 50년 만에 타이완이 중화민국의 행정 아래로 돌아왔다. 일본군이 차지한 점령지(「중일 전쟁과 일본군 점령지」(앞의 사건))와 만주국의 접수를 두고 국민당과 공산당이 서로 먼저 차지하려 다퉜다. 미국은 항공기와 선박으로 국민당군을 베이핑과 상하이 같은 도시로 실어 날랐고, 공산군은 화북 농촌과 만주로 나아갔다. 소련군은 1946년 봄에야 만주에서 철수했는데, 그동안 공장 설비를 뜯어 갔고 일본군 무기 일부가 공산군에게 넘어가는 것을 눈감았다는 설명이 있다. 마오쩌둥은 8월 28일 충칭으로 가서 장제스와 직접 협상에 들어갔고(충칭 담판), 10월 10일 정치 협상 회의를 열기로 하는 쌍십 협정을 발표했다. 미국은 12월 마셜을 특사로 보내 중재했고 1946년 1월 10일 정전 협정이 맺어졌으며, 같은 날 열린 정치 협상 회의는 헌법 개정과 연립 정부 구성을 논의했다. 그러나 만주를 둘러싼 군사 충돌이 계속되어 합의는 지켜지지 않았고 1946년 6월 전면적인 내전이 시작되었다(「국공 내전과 중화인민공화국 수립」(뒤의 사건)). 8년에 걸친 전쟁으로 중국은 군인과 민간인을 합쳐 1,000만 명에서 2,000만 명 안팎이 죽은 것으로 추산되며, 중화민국은 4대 강국의 하나로 대접받았으나 경제는 극심한 인플레와 폐허 속에 있었다."
  subjects: [roc, japan, soviet-union, usa, occupied-china, manchukuo]
  links:
    - { from: japan, to: roc, note: "타이완 반환 (1945)" }
  tags: [diplomacy, war]
  sources: ["Odd Arne Westad, Decisive Encounters: The Chinese Civil War, 1946–1950 (Stanford University Press, 2003)", "Hans van de Ven, China at War: Triumph and Tragedy in the Emergence of the New China, 1937–1952 (Harvard University Press, 2018)", "「중소 우호 동맹 조약」(1945)"]

- id: mongolia-independence-1945
  year: 1945
  endYear: 1946
  title:
    ko: "얄타 비밀 협정과 몽골 독립의 승인(1945~1946)"
  summary:
    ko: "외몽골은 1911년 청이 흔들릴 때 독립을 선언했으나 1915년 캬흐타 조약으로 중국의 종주권 아래 자치를 얻는 데 그쳤고, 1919년 중화민국이 자치를 없앴다. 1921년 혁명으로 소련의 영향 아래 사실상 독립한 상태가 되었다(「몽골 인민 혁명과 몽골의 성립」(앞의 사건)). 그러나 중화민국은 이를 인정하지 않았고, 1924년 선포된 몽골 인민 공화국을 국제적으로 인정한 나라도 소련 말고는 드물었다. 1930년대 몽골은 소련과 상호 원조 의정서(1936)를 맺었고 일본·만주국과의 노몬한 사건(1939)에서 소련과 함께 싸웠다. 1945년 2월 얄타에서 미국·영국·소련은 소련이 대일전에 참전하는 조건으로 외몽골의 현상 유지를 비밀리에 약속했다(「얄타 회담」(앞의 사건)). 소련은 이 약속을 근거로 8월 14일 중소 우호 동맹 조약과 함께 교환된 공문에서 중화민국이 일본이 패하면 외몽골 주민의 국민 투표 결과를 받아들이기로 하게 했다. 몽골은 8월 10일 일본에 선전 포고를 하고 소련군과 함께 내몽골과 러허성 쪽으로 진격했다. 이 작전에서 소련·몽골 기병 기계화 집단이 고비 사막을 건너 일본군 후방으로 들어갔다. 일본이 패한 뒤에도 내몽골은 중국에 남았다. 10월 20일 몽골에서 국민 투표가 실시되어 공식 결과는 유효표 48만 7천여 표 전부가 독립에 찬성한 것이었다. 이 투표는 소련의 영향이 컸고 일당이 지배하던 상황에서 치러졌다는 점이 지적된다. 1946년 1월 5일 중화민국 정부가 몽골의 독립을 공식 승인했다. 중화인민공화국은 수립 직후 몽골을 승인했고, 타이완으로 옮긴 중화민국은 훗날 중소 조약을 폐기하며 이 승인을 철회했다. 이를 두고 열강의 흥정으로 이루어진 결과로 보는 시각과, 몽골 사람들이 오래 바라 온 자주가 인정된 것으로 보는 시각이 함께 있다."
  subjects: [roc, mongolia, soviet-union, usa, uk, japan]
  links:
    - { from: roc, to: mongolia, note: "독립 승인 (1946)" }
  tags: [diplomacy, politics]
  sources: ["Robert A. Rupen, Mongols of the Twentieth Century (Indiana University, 1964)", "Odd Arne Westad, Decisive Encounters: The Chinese Civil War, 1946–1950 (Stanford University Press, 2003)", "「중소 우호 동맹 조약」(1945)"]

- id: taiwan-228-1947
  year: 1947
  endYear: 1987
  title:
    ko: "2·28 사건과 중화민국 정부의 타이완 이전, 계엄 체제(1947~1987)"
  summary:
    ko: "1945년 10월 일본의 패전으로 타이완이 중화민국에 돌아오고 천이(陳儀)가 행정장관으로 부임했다(「일본의 항복과 중국의 전후 접수」(앞의 사건)). 그러나 대륙에서 온 관리의 부패와 차별, 물자 부족과 인플레, 전매 제도 때문에 타이완 사람들의 불만이 쌓였다. 1947년 2월 27일 타이베이에서 전매국 단속원이 암시장 담배를 팔던 여성을 때리고 군중에게 발포한 일이 도화선이 되어 28일 시위가 벌어졌고, 행정장관 공서 앞에서 군경이 발포하자 항의가 섬 전체로 번졌다. 타이완 사람들은 처리 위원회를 꾸려 자치 확대 등을 요구했으나 천이는 대륙에 증원을 요청했고, 3월 8일 푸젠에서 온 헌병대와 21사단 등이 지룽에 상륙해 진압에 나섰다. 이 과정에서 지식인과 지역 유지를 포함한 많은 사람이 죽거나 사라졌다. 사망자는 훗날 타이완 행정원의 연구 보고가 1만 8천~2만 8천 명으로 추산했으나 집계는 수천 명에서 2만 명 넘게까지 크게 갈린다. 타이완 출신(본성인)과 1945년 뒤 대륙에서 온 사람들(외성인) 사이의 골이 깊어졌다. 국공 내전에서 밀린 중화민국 정부는 1949년 5월 19일 타이완에 계엄령을 선포했고, 10월 1일 중화인민공화국이 세워진 뒤 10월 말에는 진먼의 구닝터우에서 공산군의 상륙을 막아 냈다. 12월 7일 정부가 타이베이로 옮겨 오고 군인과 공무원, 민간인 수십만 명에서 100만 명 넘는 사람들이 대륙에서 건너왔다(「3대 전역과 인민해방군의 도강」(뒤의 사건)). 장제스는 1950년 3월 총통에 복직했다. 같은 해 6월 6·25 전쟁이 터지자 미국은 제7함대를 타이완 해협에 보내 중립화했다(「6·25 전쟁 발발」(뒤의 사건)). 계엄 아래서 국민당 정부는 공산당 관련자와 정부 비판자를 체포·처형하는 이른바 백색 테러를 벌였다. 투옥된 사람은 수만 명에서 10만 명 넘게, 처형된 사람은 1천 명 안팎에서 수천 명으로 집계가 갈린다. 계엄령은 1987년 7월 해제될 때까지 38년 동안 이어졌고, 이 기간 정당 결성과 언론, 집회가 제한되었다."
  subjects: [roc, prc, japan, usa]
  tags: [politics, society]
  sources: ["Murray A. Rubinstein 편, Taiwan: A New History (M. E. Sharpe, 1999)", "Steven E. Phillips, Between Assimilation and Independence: The Taiwanese Encounter Nationalist China, 1945–1950 (Stanford University Press, 2003)", "행정원 연구 2·28 사건 소조, 『2·28 사건 연구 보고』(1992)"]

- id: three-campaigns-1948
  year: 1948
  endYear: 1949
  title:
    ko: "3대 전역과 인민해방군의 도강(1948~1949)"
  summary:
    ko: "1946년 6월 전면 내전이 시작된(「국공 내전과 중화인민공화국 수립」(앞의 사건)) 뒤 국민당군은 처음에는 병력과 장비에서 앞서 1947년 3월 공산당의 옌안을 차지했다. 그러나 점령한 도시와 철도를 지키느라 병력이 흩어졌고, 공산군은 농촌 근거지에서 병력을 키웠다. 공산당이 해방구에서 시행한 토지 개혁도 농민의 지지를 모으는 데 도움이 되었다. 국민당 정부는 지출을 지폐로 메워 물가가 폭등했고 1948년 8월 금원권을 내놓았으나 오래 가지 못해 민심을 잃었다. 1948년 가을 인민해방군은 세 차례의 큰 전역으로 승부를 갈랐다. 9월부터 11월까지 랴오선 전역에서 린뱌오의 동북 야전군이 10월 15일 진저우를 점령하고 창춘(10월 21일 국민당군 투항)과 선양(11월 2일)을 차지해 만주 전체를 장악했다. 11월 초부터 1949년 1월까지는 쉬저우를 중심으로 화이하이 전역이 벌어졌다. 천이(陳毅)·쑤위·류보청·덩샤오핑이 이끈 공산군이 국민당군 주력을 포위해 두위밍을 붙잡았다. 11월 말부터 1949년 1월까지 핑진 전역에서는 린뱌오·뤄룽환·녜룽전이 베이핑과 톈진을 에워쌌고, 톈진은 1월 15일 전투 끝에 함락되었으며 푸쭤이는 1월 하순 협상에 응해 31일 인민해방군이 베이핑에 들어왔다. 공산당은 이 세 전역에서 국민당군 150만 명 안팎을 없앴다고 집계한다. 장제스는 1949년 1월 총통에서 물러났고 리쭝런이 대리했다. 4월 인민해방군은 창장강을 건너(도강 전역) 4월 23일 난징을 차지했고 5월 상하이, 10월 광저우, 11월 충칭을 얻었다. 10월 1일 마오쩌둥이 베이징 톈안먼에서 중화인민공화국 수립을 선포했으며, 12월 국민당 정부는 타이완으로 옮겼다(「2·28 사건과 중화민국 정부의 타이완 이전, 계엄 체제」(앞의 사건))."
  subjects: [roc, prc]
  links:
    - { from: prc, to: roc, note: "3대 전역, 도강 전역, 본토 장악 (1948~1949)" }
  tags: [war, politics]
  sources: ["Odd Arne Westad, Decisive Encounters: The Chinese Civil War, 1946–1950 (Stanford University Press, 2003)", "Suzanne Pepper, Civil War in China: The Political Struggle, 1945–1949 (University of California Press, 1978)", "The Cambridge History of China, vol. 13: Republican China 1912–1949, Part 2 (John K. Fairbank·Albert Feuerwerker 편, Cambridge University Press, 1986)"]

- id: prc-early-reforms-1949
  year: 1949
  endYear: 1953
  title:
    ko: "신중국 초기의 토지 개혁과 반혁명 진압 운동(1949~1953)"
  summary:
    ko: "1949년 9월 중국 인민 정치 협상 회의는 임시 헌법 구실을 할 공동 강령을 채택했고, 10월 1일 마오쩌둥이 베이징 톈안먼에서 중화인민공화국 수립을 선포했다(「국공 내전과 중화인민공화국 수립」(앞의 사건)). 중앙 인민 정부 주석은 마오쩌둥, 정무원 총리는 저우언라이였다. 새 정부는 먼저 내전 말기의 인플레를 잡고 재정을 통일하는 일에 힘써 1950년 봄부터 물가가 안정되기 시작했다. 1950년 6월 토지 개혁법이 공포되어 지주의 토지와 농기구, 가옥 가운데 일부를 몰수해 땅이 없거나 적은 농민에게 나누어 주었다. 농촌 주민은 지주·부농·중농·빈농 같은 계급 성분으로 나뉘었고, 마을마다 열린 비판 대회에서 지주가 고발당했으며 일부는 처형되었다. 1952년 말까지 대부분 지역에서 토지 개혁이 끝나 약 3억 명의 농민이 땅을 얻었다고 한다. 토지 개혁 중에 숨진 사람은 연구자에 따라 20만 명에서 수백만 명까지 추산이 크게 갈린다. 1950년 3월 지시로 시작된 반혁명 진압 운동은 국민당과 중화민국 정부 관련자, 비밀 결사, 옛 관료와 지주 등을 겨냥했다. 공안부 부부장이 뒤에 보고한 공식 집계는 처형 71만 2천 명, 투옥 129만 명, 관제 120만 명이었고, 연구자들은 실제 규모가 더 컸다고 보며 처형자를 수십만 명에서 수백만 명까지 추산한다. 1951~1952년에는 공무원의 부패와 낭비를 단속하는 삼반 운동, 사영 기업가의 뇌물과 탈세를 단속하는 오반 운동이 벌어져 많은 상공업자와 관리가 비판받았고 스스로 목숨을 끊은 사람도 적지 않았다. 1950년 5월 혼인법이 시행되어 일부일처제와 자유 혼인, 남녀 평등을 내세우고 강제 혼인과 첩 제도, 매매혼을 금지했다. 1950년 10월 중국은 6·25 전쟁에 군대를 보냈고(「중국군 참전과 흥남 철수」(뒤의 사건)) 같은 달 티베트 동부의 창두를 점령했다(「중화인민공화국의 티베트 병합과 맥마흔선」(뒤의 사건)). 전쟁이라는 긴장 속에서 정권은 사회 통제를 강화했고, 이 운동들은 새 정권이 도시와 농촌을 장악하는 수단이 되었다."
  subjects: [prc, roc]
  tags: [politics, society]
  sources: ["The Cambridge History of China, vol. 14: The People's Republic, Part 1: The Emergence of Revolutionary China, 1949–1965 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1987)", "「중화인민공화국 토지 개혁법」(1950)", "「중화인민공화국 혼인법」(1950)"]

- id: five-year-plan-1950
  year: 1950
  endYear: 1957
  title:
    ko: "중소 우호 동맹 조약과 제1차 5개년 계획, 사회주의 개조(1950~1957)"
  summary:
    ko: "새로 세워진 중화인민공화국의 지도자 마오쩌둥은 1949년 12월부터 1950년 2월까지 모스크바를 찾아 스탈린과 담판을 벌였고, 2월 14일 중소 우호 동맹 상호 원조 조약이 맺어졌다. 조약은 일본 또는 일본과 손잡은 나라의 침략에 맞서 서로 돕는다고 정했고, 소련은 중국에 3억 달러의 차관을 주기로 했고, 창춘 철도는 늦어도 1952년까지 돌려주며 뤼순에서는 대일 평화 조약이 맺어진 뒤 철수하기로 했다. 중국은 소련 진영에 서는 ‘한쪽으로 기우는’ 외교를 택했고, 소련은 중공업 중심의 소련식 발전 모델과 기술자를 중국에 보냈다. 6·25 전쟁 참전 뒤인 1953년부터 제1차 5개년 계획(1953~1957)이 시행되었고 1955년에야 정식 계획으로 채택되었다. 소련이 기술을 도운 156개 대형 사업을 중심으로 철강·기계·자동차·에너지 같은 중공업이 우선 투자를 받았고, 공식 통계로는 5년 동안 공업 총생산액이 두 배 넘게 늘었다고 한다. 농업은 개인 농가에서 호조조, 초급 합작사, 고급 합작사로 단계적으로 묶였다. 1955년 마오쩌둥이 농촌의 사회주의 고조를 재촉하자 합작화가 빨라져 1956년 말에는 대부분의 농가가 합작사에 들어갔다. 농민에게서는 곡물 통일 구매·판매 제도(1953)로 곡물을 거두어 도시와 공업에 돌렸기에 농민의 부담이 컸다. 도시에서는 사영 공상업이 정부와 함께 경영하는 공사합영을 거쳐 1956년 초 사실상 국유화되었다. 1954년 9월 첫 전국 인민 대표 대회가 열려 헌법을 채택했고 마오쩌둥을 국가 주석으로 뽑았다. 같은 해 저우언라이는 제네바 회의에 참석해 중국이 국제 무대에 오르는 계기를 마련했다(「제네바 회의(1954)와 한국 문제」(뒤의 사건)). 1956년 9월 제8차 당 대회는 사회주의 개조가 기본적으로 끝났다고 선언하고 앞으로는 사회주의 건설이 중심 과제라고 정리했다. 이 시기의 높은 성장은 소련의 원조와 농업 잉여를 공업에 돌리는 체제에 기댄 것이었다. 소련과의 관계는 1956년 이후 틈이 벌어졌다(「중소 분쟁의 시작과 전바오섬 충돌」(뒤의 사건))."
  subjects: [prc, soviet-union, japan]
  tags: [economy, politics, diplomacy]
  sources: ["The Cambridge History of China, vol. 14: The People's Republic, Part 1: The Emergence of Revolutionary China, 1949–1965 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1987)", "Chen Jian, Mao's China and the Cold War (University of North Carolina Press, 2001)", "「중소 우호 동맹 상호 원조 조약」(1950)"]

- id: hundred-flowers-1956
  year: 1956
  endYear: 1957
  title:
    ko: "백화제방과 반우파 투쟁(1956~1957)"
  summary:
    ko: "1956년 4월 마오쩌둥은 중화인민공화국 안에서 예술은 백화제방, 학술에서는 백가쟁명이라는 방침을 내세웠고, 5월 26일 선전부장 루딩이가 공개 연설로 이를 알려 지식인이 의견을 자유롭게 말하도록 권했다. 그해 2월 흐루쇼프의 스탈린 비판(「스탈린의 죽음과 흐루쇼프의 스탈린 비판」(앞의 사건))과 10월의 폴란드·헝가리 사태(「헝가리 혁명」(뒤의 사건))는 당과 민중의 관계를 살펴야 한다는 생각과 당이 흔들릴 수 있다는 걱정을 함께 불러일으켰다. 1957년 2월 마오쩌둥은 「인민 내부의 모순을 올바로 처리하는 문제에 대하여」라는 연설에서 인민 내부의 모순과 적과 인민 사이의 모순을 구별하고, 당의 잘못을 바로잡는 정풍 운동을 벌이겠다고 밝혔다. 4월 말 당이 바깥의 비판을 요청하자 5월 중순부터 베이징 대학 같은 곳의 학생과 교수, 민주 당파 인사들이 당의 독점적 지위와 관료주의, 소련식 정책 등을 비판했다. 민주 당파 지도자 장보쥔과 뤄룽지, 신문 편집자 추안핑 등이 당이 천하를 독점한다는 취지의 비판을 했다고 전해진다. 비판이 정권 자체에 대한 의문으로 번진다고 본 마오쩌둥은 6월 8일 『인민일보』 사설 「이것은 무엇 때문인가」와 당 내부 지시로 방향을 바꾸어 이를 부르주아 우파의 공격으로 규정하고 반격에 나섰다. 반우파 투쟁에서 공식적으로 우파 분자로 지목된 사람은 55만 2,877명이었고, 연구자들은 가족까지 불이익을 받은 사람이 훨씬 많다고 본다. 당 총서기 덩샤오핑이 이 운동의 실무를 맡았고 지식인과 학자, 작가들이 직장에서 쫓겨나거나 노동 개조를 받았다. 우파로 지목된 사람은 대부분 마오쩌둥이 죽은 뒤 복권되었다. 이후 지식인과 당 간부가 정책에 반대 의견을 내기 어려워졌고, 이는 곧 이어진 「대약진 운동과 대기근」(뒤의 사건)의 무리한 추진에 제동이 걸리지 못한 배경의 하나로 지적된다."
  subjects: [prc, soviet-union]
  tags: [politics, society]
  sources: ["The Cambridge History of China, vol. 14: The People's Republic, Part 1: The Emergence of Revolutionary China, 1949–1965 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1987)", "Roderick MacFarquhar, The Origins of the Cultural Revolution, vol. 1: Contradictions among the People, 1956–1957 (Columbia University Press, 1974)"]

- id: sino-soviet-split-1956
  year: 1956
  endYear: 1969
  title:
    ko: "중소 분쟁의 시작과 전바오섬 충돌(1956~1969)"
  summary:
    ko: "중화인민공화국과 소련은 1950년 동맹을 맺었으나(「중소 우호 동맹 조약과 제1차 5개년 계획, 사회주의 개조」(앞의 사건)), 1956년 흐루쇼프가 스탈린을 비판하고 서방과의 평화 공존을 내세우면서 사이가 벌어지기 시작했다. 마오쩌둥은 스탈린에게 실수가 있어도 위대한 마르크스주의자라고 했고, 1957년 모스크바 회의에서는 핵전쟁이 나도 중국은 살아남을 것이라는 취지로 말해 소련 지도부를 놀라게 했다. 1958년 소련이 중국 해안에 장파 라디오 기지를 함께 짓고 공동 함대를 꾸리자고 제안하자 마오쩌둥은 주권을 침해한다며 거절했다. 흐루쇼프는 그해 여름 비밀리에 베이징을 찾아 달랬으나 풀리지 않았고, 8월 23일 중국이 진먼을 포격한 제2차 타이완 해협 위기를 소련에 미리 알리지 않은 것도 불신을 키웠다. 1959년 소련은 원자탄 제조 기술 제공 약속을 접었고, 같은 해 흐루쇼프가 미국을 방문한 뒤 10월 2일 베이징에서 마오쩌둥과 마지막으로 마주 앉았다. 1960년 소련은 중국에 보낸 전문가 약 1,390명을 불러들였고(중국 쪽 기록) 수백 건의 협력 계약이 멈추어, 대약진 운동의 실패와 겹쳐 중국 경제에 큰 타격이 되었다(「대약진 운동과 대기근」(뒤의 사건)). 양국 공산당은 1960년 11월 모스크바에서 열린 81개국 공산당 회의 등에서 맞섰다. 1962년에는 신장 이닝 등지에서 6만 명 이상이 소련 쪽으로 넘어가는 이타 사건이 일어났다. 1963년 7월 모스크바 회담이 결렬되었고, 1963년 9월부터 이듬해 7월까지 중국 공산당 중앙은 『인민일보』와 『홍기』에 소련 공산당을 공개 비판하는 글 아홉 편을 실었다. 중국은 1964년 10월 16일 첫 원자탄 실험에 성공했다. 같은 달 흐루쇼프가 실각했으나 관계는 풀리지 않았고, 문화 대혁명 때는 베이징의 소련 대사관 앞에서 시위가 벌어지고 소련을 ‘사회 제국주의’라 부르는 일이 잦아졌다. 1969년 3월 2일과 15일 우수리강의 전바오섬(러시아 이름 다만스키섬)에서 양국 국경 수비대가 충돌해 양쪽에서 사상자가 났고, 8월에는 신장 국경에서도 충돌이 있었다. 9월 11일 소련 총리 코시긴이 호찌민 장례식에 갔다 오는 길에 베이징 공항에서 저우언라이를 만나 긴장이 가라앉았다. 이 충돌 뒤 중국은 소련을 가장 큰 위협으로 보게 되었고, 이는 「핑퐁 외교에서 미중 수교까지」(뒤의 사건)로 이어지는 외교 전환의 배경이 되었다."
  subjects: [prc, soviet-union, usa]
  tags: [diplomacy, politics]
  sources: ["Lorenz M. Lüthi, The Sino-Soviet Split: Cold War in the Communist World (Princeton University Press, 2008)", "Chen Jian, Mao's China and the Cold War (University of North Carolina Press, 2001)"]

- id: great-leap-1958
  year: 1958
  endYear: 1962
  title:
    ko: "대약진 운동과 대기근(1958~1962)"
  summary:
    ko: "중화인민공화국의 제1차 5개년 계획이 끝난 뒤 마오쩌둥은 1958년 5월 제8차 당 대회 2차 회의에서 많이, 빨리, 좋게, 아끼며 사회주의를 건설한다는 총노선을 내세우고, 철강 등의 생산을 급속히 늘려 영국을 앞지르자는 구호를 외쳤다. 농촌에서는 8월 베이다이허 회의의 결정으로 농업 합작사를 합쳐 생산과 행정, 민병을 아우르는 인민공사를 세웠고, 1958년 말까지 대부분의 농가가 약 2만 6천 개 공사에 들어갔다. 공동 식당이 생기고 사적인 텃밭과 가축은 줄었다. 철강 생산량을 1957년의 두 배인 1,070만 톤으로 늘린다는 목표를 위해 수천만 명이 마을마다 흙 용광로를 세워 쇠를 녹였으나 쓸모없는 쇠가 많았고, 일손이 빠지면서 수확이 제때 이루어지지 않는 곳이 생겼다. 간부들은 윗선의 압력으로 곡물 생산을 부풀려 보고했고 국가는 과장된 수치를 바탕으로 곡물을 거두고 수출까지 했다. 1959년 7~8월 루산 회의에서 국방부장 펑더화이가 대약진의 문제를 지적하는 편지를 쓰자 마오쩌둥은 이를 반당 행위로 몰아 펑더화이를 해임했고(후임 린뱌오), 이어진 반우경 운동으로 정책은 더욱 밀어붙여졌다. 1959~1961년에 심각한 기근이 닥쳤다. 홍수와 가뭄도 있었고 1960년 소련이 전문가를 불러들이고 채무 변제를 독촉한 일도 영향을 주었으나(「중소 분쟁의 시작과 전바오섬 충돌」(앞의 사건)), 학자들은 정책의 잘못과 곡물 징수를 주된 원인으로 본다. 사망자 추산은 연구마다 크게 갈려 대략 1,500만 명에서 5,500만 명 사이이며(위시광은 약 5,500만 명으로 본다), 양지성은 약 3,600만 명, 프랭크 디쾨터는 4,500만 명 이상, 차오수지는 약 3,250만 명으로 본다. 안후이·쓰촨·구이저우·후난·간쑤·허난 등이 특히 큰 피해를 입었다고 한다. 중국 정부는 이 시기를 ‘3년 곤란 시기’라 부르며 자연재해와 정책 오류를 함께 언급하고, 훗날 당의 공식 결의는 대약진 운동을 좌경 오류로 규정했다. 1962년 1~2월 7천인 대회에서 류사오치는 기근의 원인을 ‘3할은 천재, 7할은 인재’라고 말했다. 마오쩌둥은 자기비판을 하고 일상의 정책 결정에서 한발 물러섰으나, 이 일은 마오와 류사오치·덩샤오핑 사이의 노선 대립으로 남아 「문화 대혁명의 시작과 홍위병」(뒤의 사건)의 한 배경이 되었다."
  subjects: [prc, soviet-union]
  tags: [economy, society, politics]
  sources: ["Yang Jisheng, Tombstone: The Great Chinese Famine, 1958–1962 (Stacy Mosher·Guo Jian 옮김, Farrar, Straus and Giroux, 2012)", "Frank Dikötter, Mao's Great Famine: The History of China's Most Devastating Catastrophe, 1958–1962 (Walker & Company, 2010)", "The Cambridge History of China, vol. 14: The People's Republic, Part 1: The Emergence of Revolutionary China, 1949–1965 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1987)", "「건국 이래 당의 약간의 역사 문제에 관한 결의」(1981)"]

- id: tibet-uprising-1959
  year: 1959
  endYear: 1965
  title:
    ko: "티베트 봉기와 달라이 라마의 망명(1959~1965)"
  summary:
    ko: "1951년 「17개조 협의」로 티베트 지방 정부와 달라이 라마의 지위는 유지되었으나(「중화인민공화국의 티베트 병합과 맥마흔선」(앞의 사건)), 1950년대 중반 쓰촨·칭하이·간쑤에 속한 티베트족 지역(캄과 암도)에서 사회주의 개조와 이른바 민주 개혁이 추진되자 반발이 커져 무장 저항이 일어났다. 인민해방군의 진압 속에 많은 난민이 라싸로 몰려들었고, 미국 중앙정보국이 저항 세력을 비밀리에 지원했다는 사실이 뒷날 알려졌다. 1959년 3월 10일 라싸에서 인민해방군 사령부가 달라이 라마를 공연에 초대했다는 소식이 퍼지자, 그가 연행될까 걱정한 시민 수만 명이 여름 궁전 노르불링카를 에워쌌다. 시위는 중국의 지배에 반대하는 봉기로 번졌다. 3월 17일 밤 달라이 라마는 몰래 라싸를 떠나 3월 말 인도 국경을 넘었고 인도는 그를 받아들였다. 인민해방군은 3월 20일부터 라싸에서 무력 진압에 나서 봉기를 며칠 만에 눌렀고 노르불링카와 사원이 큰 피해를 입었다. 사상자 수는 양쪽의 주장이 크게 달라서, 티베트 망명 정부는 중국군 문서를 근거로 8만 명 넘는 희생을 말하나 검증이 어렵고, 오슬로 평화 연구소의 추산은 티베트인 약 1만 명과 인민해방군 약 2천 명이며, 중국 정부는 반란 진압 과정의 사상자를 훨씬 적게 밝힌다. 3월 28일 국무원은 티베트 지방 정부의 해산을 명령하고 판첸 라마를 대행으로 하는 티베트 자치구 준비 위원회를 앞세웠다. 이후 농노제 폐지를 내세운 민주 개혁이 시행되어 토지가 재분배되었고, 중국 정부는 이를 해방으로 평가한다. 망명 티베트인 사회와 많은 연구자는 종교와 문화에 대한 억압, 인명 피해를 지적한다. 달라이 라마를 따라 약 8만 명이 인도와 네팔 등으로 망명했고, 달라이 라마는 인도 북부 다람살라에 망명 정부를 세웠다(1960). 이 일은 중국과 인도의 관계를 악화시켜 1962년 국경 전쟁의 한 배경이 되었다(「중인 국경 전쟁」(뒤의 사건)). 1965년 9월 티베트 자치구가 정식으로 세워졌다."
  subjects: [prc, usa]
  tags: [politics, war]
  sources: ["Carole McGranahan, Arrested Histories: Tibet, the CIA, and Memories of a Forgotten War (Duke University Press, 2010)", "Tsering Shakya, The Dragon in the Land of Snows: A History of Modern Tibet since 1947 (Columbia University Press, 1999)", "「중앙 인민 정부와 티베트 지방 정부의 티베트 평화 해방 방법에 관한 협의」(17개조 협의, 1951)"]

- id: sino-indian-war-1962
  year: 1962
  title:
    ko: "중인 국경 전쟁(1962)"
  summary:
    ko: "인도와 중국 사이의 국경은 서쪽의 악사이친과 동쪽의 맥마흔선 남쪽(지금의 아루나찰프라데시)을 둘러싸고 분명하지 않았다. 인도는 존슨 선과 맥마흔선을 국경으로 주장했고 중국은 맥마흔선을 인정하지 않았다(「중화인민공화국의 티베트 병합과 맥마흔선」(앞의 사건)). 중국은 1956~1957년 신장과 티베트를 잇는 도로를 악사이친에 닦았고 인도는 이를 1958년에 알았다. 1959년 티베트 봉기 뒤 인도가 달라이 라마의 망명을 받아들이자(「티베트 봉기와 달라이 라마의 망명」(앞의 사건)) 관계가 급격히 나빠졌다. 1959년 8월과 10월에 국경에서 충돌이 일어났고, 1960년 저우언라이와 네루의 회담도 합의에 이르지 못했다. 인도는 1961년 말부터 분쟁 지역에 초소를 세우는 전진 정책을 폈고 중국은 이를 땅을 조금씩 차지하려는 시도로 보았다. 1962년 10월 20일 중국군은 동쪽의 나무카추와 서쪽 라다크에서 동시에 공격을 시작해 인도군을 크게 이겼다. 동쪽에서는 타왕을 차지했고 서쪽에서는 팡공호 일대와 칩찹 계곡을 차지했으며 레자 라 전투가 가장 치열했다. 그때 세계의 눈은 쿠바 미사일 위기(「쿠바 미사일 위기」(앞의 사건))에 쏠려 있었다. 11월 20일 중국은 일방적으로 정전을 선언하고, 12월부터 1959년 11월 당시의 실질 통제선에서 20km 뒤로 물러났다. 전사자는 중국이 700여 명, 인도가 1,380여 명(자료에 따라 최대 3,250명)이고 인도 쪽 실종 1,690여 명과 포로 3,900여 명이 있었다고 알려졌다. 군사적으로는 중국의 승리였으나 중국은 악사이친을 유지한 채 동쪽에서는 군대를 물렸다. 인도에서는 패전이 큰 충격이어서 국방 개혁과 군비 증강이 이어졌고, 소련이 인도에 무기를 파는 일도 늘었다. 국경 문제는 그 뒤로도 해결되지 않았다."
  subjects: [prc, soviet-union]
  tags: [war, diplomacy]
  sources: ["Neville Maxwell, India's China War (Jonathan Cape, 1970)", "John W. Garver, Protracted Contest: Sino-Indian Rivalry in the Twentieth Century (University of Washington Press, 2001)", "「영국-티베트 국경 각서」(맥마흔선 지도·각서 교환, 1914)"]

- id: cultural-revolution-1966
  year: 1966
  endYear: 1969
  title:
    ko: "문화 대혁명의 시작과 홍위병(1966~1969)"
  summary:
    ko: "중화인민공화국에서 대약진이 실패한 뒤 류사오치와 덩샤오핑이 경제를 조정하자 마오쩌둥은 당 안에 수정주의가 자란다고 의심했다(「대약진 운동과 대기근」(앞의 사건)). 1965년 11월 야오원위안이 베이징 부시장 우한(吳晗)의 역사극 『해서의 파면』을 마오쩌둥 비판으로 몰아 공격하면서 불이 붙었다. 1966년 5월 16일 중앙 정치국 확대 회의가 통지를 채택하고 베이징 시장 펑전이 이끈 5인 소조를 해산하며 새 소조를 두기로 했고, 5월 말 천보다를 조장으로 하고 장칭·캉성·장춘차오·야오원위안을 포함한 중앙 문화 혁명 소조가 꾸려졌다. 8월 1일부터 열린 제8기 중앙 위원회 제11차 전체 회의에서 마오쩌둥은 「사령부를 포격하라」는 대자보를 써서 류사오치·덩샤오핑 등을 겨냥했고, 회의는 문화 대혁명의 방침을 담은 16조를 정했다. 학생들로 이루어진 홍위병이 8월부터 4구(낡은 사상·문화·풍속·습관) 타파를 내세워 교사와 지식인, 옛 지도자를 공개 비판하고 폭행했으며 문화재를 부쉈다. 마오쩌둥은 그해 말까지 여덟 차례에 걸쳐 톈안먼 광장에서 1,100만 명 안팎의 홍위병을 접견했다. 1967년 1월 상하이에서 노동자 조직이 시 정부의 권력을 빼앗는 1월 폭풍이 일어났고, 각지에서 기존의 당과 정부 기관을 대신하는 혁명위원회가 세워졌다. 홍위병과 조반파 조직이 서로 갈라져 무장 투쟁이 벌어지기도 했고, 군이 개입해 질서를 세웠다. 1968년 10월 류사오치는 당에서 영구 제명되어 이듬해 11월 카이펑에서 병사했다. 홍위병은 해체되었고 1968년 12월부터 도시 청년들이 농촌으로 내려가는 하방이 이어졌다. 1969년 4월 제9차 당 대회는 린뱌오를 마오쩌둥의 후계자로 당헌에 올렸다. 희생자 수는 추산이 갈려, 비정상적으로 사망한 사람은 50만 명에서 200만 명 안팎으로 보고(월더가 현과 시의 연감을 조사해 낸 추산은 110만~160만 명), 박해받은 사람은 이보다 훨씬 많다고 본다. 훗날 당의 공식 결의는 이 시기를 당과 국가와 인민에게 심각한 재난을 안겨 준 내란이라고 규정했다. 전통 문화와 지식인이 입은 피해, 교육과 연구의 중단도 컸다. 마오쩌둥이 이 운동을 일으킨 동기를 두고는 권력 투쟁, 이념적 신념, 관료화에 대한 우려 등 여러 해석이 있다."
  subjects: [prc]
  tags: [politics, society]
  sources: ["Roderick MacFarquhar·Michael Schoenhals, Mao's Last Revolution (Harvard University Press, 2006)", "The Cambridge History of China, vol. 15: The People's Republic, Part 2: Revolutions within the Chinese Revolution, 1966–1982 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1991)", "「건국 이래 당의 약간의 역사 문제에 관한 결의」(1981)"]

- id: lin-biao-1969
  year: 1969
  endYear: 1976
  title:
    ko: "린뱌오 사건과 문화 대혁명의 끝(1969~1976)"
  summary:
    ko: "1969년 제9차 당 대회에서 후계자로 정해진 린뱌오는 군을 쥐고 있었으나(「문화 대혁명의 시작과 홍위병」(앞의 사건)), 1970년 8월 루산 제2차 전체 회의에서 국가 주석 자리를 두고 마오쩌둥과 어긋났다. 마오는 린뱌오에게 가까운 천보다를 비판하며 그의 세력을 견제했다. 1971년 9월 13일 린뱌오와 부인 예췬, 아들 린리궈 등 9명이 탄 비행기가 몽골 운두르한 부근에 추락해 모두 숨졌다. 중화인민공화국 정부는 마오쩌둥을 암살하려던 계획(571 공정)이 드러나자 소련으로 도망치려다 일어난 일이라고 발표했고 몽골과 소련도 현장을 조사했으나, 사건의 진상에는 아직 풀리지 않은 부분이 많다. 린뱌오의 몰락은 문화 대혁명에 대한 환멸을 키웠다. 저우언라이가 정무를 맡아 질서를 회복하는 사이 1973년 덩샤오핑이 복귀했으나, 1973~1974년의 비림비공 운동은 린뱌오와 공자를 함께 비판하며 사실상 저우언라이를 겨냥했다고 해석된다. 1975년 1월 저우언라이는 공업·농업·국방·과학 기술의 4개 현대화를 내세웠고 덩샤오핑이 경제 정비에 나섰다. 장칭·장춘차오·야오원위안·왕훙원, 이른바 4인방은 이에 맞서 문화 대혁명의 성과를 지킨다고 주장했다. 1976년 1월 8일 저우언라이가 죽자 청명절인 4월 4~5일에 베이징 톈안먼 광장에서 시민들이 화환을 놓으며 그를 기리는 시위를 벌였다(4·5 톈안먼 사건). 4월 5일 밤 경찰과 민병이 광장을 정리했고, 이틀 뒤 정치국은 덩샤오핑을 모든 직무에서 해임하고 화궈펑을 총리로 임명했다. 7월 28일 허베이 탕산 지진으로 공식 집계 24만여 명이 숨졌다. 9월 9일 마오쩌둥이 82세로 숨졌다. 10월 6일 화궈펑과 예젠잉·왕둥싱 등이 4인방을 체포했고 화궈펑이 당 주석에 올랐다. 이로써 문화 대혁명은 끝났다."
  subjects: [prc, mongolia, soviet-union]
  tags: [politics]
  sources: ["Roderick MacFarquhar·Michael Schoenhals, Mao's Last Revolution (Harvard University Press, 2006)", "The Cambridge History of China, vol. 15: The People's Republic, Part 2: Revolutions within the Chinese Revolution, 1966–1982 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1991)"]

- id: us-china-1971
  year: 1971
  endYear: 1979
  title:
    ko: "핑퐁 외교에서 미중 수교까지(1971~1979)"
  summary:
    ko: "중소 분쟁(「중소 분쟁의 시작과 전바오섬 충돌」(앞의 사건))으로 소련을 가장 큰 위협으로 본 중국과, 베트남 전쟁의 출구를 찾던 미국은 서로 가까워졌다. 1971년 4월 일본 나고야 세계 탁구 선수권에 참가했던 미국 선수단이 중국의 초청으로 방중해 핑퐁 외교가 시작되었다. 7월 9~11일 닉슨 대통령의 안보 보좌관 키신저가 파키스탄을 거쳐 비밀리에 베이징을 찾았고, 닉슨은 7월 15일 이를 발표했다. 10월 25일 유엔 총회는 결의 2758호로 중화인민공화국 정부의 대표를 중국의 유일한 합법적 대표로 인정하고 중화민국(타이완) 대표를 쫓아내기로 결의했다(찬성 76, 반대 35, 기권 17). 중화민국 대표단은 표결 전에 스스로 자리를 떴다. 1972년 2월 21일부터 28일까지 닉슨이 베이징과 항저우, 상하이를 방문해 마오쩌둥·저우언라이와 만났고 27일 상하이 공동 성명을 발표했다. 성명에서 중국은 타이완 문제가 가장 중요한 쟁점이라 밝혔고, 미국은 타이완 해협 양쪽의 모든 중국인이 중국은 하나이고 타이완은 중국의 일부라고 주장한다는 것을 인식하며 이에 이의를 제기하지 않겠다고 했다. 같은 해 9월 29일 일본 총리 다나카 가쿠에이와 저우언라이가 공동 성명을 발표해 일본이 중화인민공화국을 중국의 유일한 합법 정부로 인정하고 중화민국과 외교 관계를 끊으며 국교를 정상화했다. 1978년 12월 15일 미국과 중국은 이듬해 1월 1일 외교 관계를 맺는다고 발표했고, 1979년 1월 덩샤오핑이 미국을 방문했다. 미국은 중화민국과의 외교 관계를 끝내고 방위 조약도 종료하기로 했으나, 4월 미국 의회는 타이완 관계법을 제정해 타이완에 방어용 무기를 파는 일과 비공식 관계의 근거를 마련했다. 이 변화로 동아시아의 냉전 구도가 바뀌었고, 중국은 국제 사회에 복귀해 「개혁 개방의 시작」(뒤의 사건)에 필요한 외교 환경을 얻었다. 한국은 오랫동안 중화민국과 외교 관계를 이어 가다가 뒤에 중화인민공화국과 수교했다(「한중 수교」(뒤의 사건))."
  subjects: [prc, roc, usa, japan, soviet-union, rok]
  tags: [diplomacy]
  sources: ["Margaret MacMillan, Nixon and Mao: The Week That Changed the World (Random House, 2007)", "「상하이 공동 성명」(1972)", "「중일 공동 성명」(1972)", "「미중 국교 수립 공동 성명」(1978)", "「타이완 관계법」(1979)"]

- id: south-china-sea-1974
  year: 1974
  endYear: 2016
  title:
    ko: "남중국해 분쟁(1974~2016)"
  summary:
    ko: "남중국해의 파라셀 군도(시사 군도)와 스프래틀리 군도(난사 군도)는 중국·베트남·필리핀·말레이시아·브루나이·타이완이 서로 주권이나 해양 권리를 주장하는 바다이다. 중국이 근거로 내세우는 이른바 9단선은 1947년 중화민국 정부가 낸 지도의 11단선에서 비롯되어 1949년 뒤 중화인민공화국 지도에 이어졌다. 1974년 1월 19~20일 중국은 파라셀 군도의 크레센트 군도(융러 군도)를 두고 남베트남군과 싸워 군도 전체를 차지했다. 베트남 공화국(남베트남)은 군함 여러 척이 파손되고 병사 수십 명이 숨지거나 포로가 되었다. 통일 뒤의 베트남도 파라셀 군도의 주권을 계속 주장했다. 1988년 3월 14일 중국군과 베트남군이 스프래틀리 군도의 존슨 남 암초 근처에서 충돌해 베트남 병사 수십 명이 숨졌고 중국은 암초 몇 곳을 차지했다. 1995년에는 필리핀이 주장하는 해역의 미스치프 암초를 점거해 필리핀과 갈등이 커졌다. 2002년 중국과 아세안은 분쟁을 평화적으로 풀고 자제하자는 행동 선언을 채택했으나 법적 구속력이 없었다. 2012년 4월 스카버러 암초에서 중국과 필리핀 선박이 대치한 뒤 중국이 이 암초를 사실상 통제했다. 필리핀은 2013년 1월 22일 유엔 해양법 협약에 따라 중재 재판을 제기했고 중국은 재판에 참여하지 않았다. 2013년부터 중국은 스프래틀리 군도의 암초 일곱 곳을 매립해 인공섬을 짓고 활주로와 군사 시설을 세웠다. 2016년 7월 12일 상설 중재 재판소의 판정은 9단선 안의 자원에 대한 역사적 권리가 해양법 협약이 정한 범위를 넘으면 법적 효력이 없다고 판단했고, 스프래틀리 군도의 어떤 지형도 200해리 경제 수역을 가진 섬이 아니라고 했으며, 미스치프 암초와 제2 토머스 암초가 필리핀의 경제 수역 안에 있다고 판단했다. 판정은 영토 주권이나 해양 경계를 정하지는 않았다. 중국은 판정을 받아들이지 않는다고 밝혔고 무효라고 했으며, 타이완도 타이핑다오(이투아바)를 암초로 본 판단에 반발했다."
  subjects: [prc, south-vietnam, roc]
  tags: [diplomacy, war]
  sources: ["「남중국해 중재 판정」(PCA Case No. 2013-19, 2016)", "Bill Hayton, The South China Sea: The Struggle for Power in Asia (Yale University Press, 2014)", "Ian Storey·Cheng-yi Lin 편, The South China Sea Dispute: Navigating Diplomatic and Strategic Tensions (ISEAS–Yusof Ishak Institute, 2016)"]

- id: reform-opening-1978
  year: 1978
  endYear: 1984
  title:
    ko: "개혁 개방의 시작(1978~1984)"
  summary:
    ko: "중화인민공화국에서 문화 대혁명이 끝난 뒤 화궈펑은 마오쩌둥의 결정과 지시를 모두 지킨다는 이른바 두 개의 무릇을 내세웠으나, 1978년 5월 실천이 진리를 검증하는 유일한 기준이라는 논설이 나와 논쟁이 벌어졌고 덩샤오핑을 지지하는 쪽이 힘을 얻었다. 덩샤오핑은 1977년 복직하여 1978년 말 사실상의 최고 지도자가 되었다. 1978년 12월 18~22일 제11기 중앙 위원회 제3차 전체 회의는 계급 투쟁을 중심에 두던 노선을 접고 경제 건설을 중심 과제로 삼으며 개혁과 대외 개방을 추진하기로 했다. 개혁은 농촌에서 먼저 시작되었다. 안후이성 펑양현 샤오강촌의 농민 18가구가 1978년 말 비밀리에 땅을 가구별로 나누어 맡는 방식을 시도한 일이 알려지면서, 가구가 정해진 몫을 국가에 내고 나머지를 갖는 가정 연산 승포 책임제가 퍼졌고 1982년 중앙이 이를 공인했다. 그 결과 곡물 생산이 1978년 약 3억 톤에서 1984년 4억 톤을 넘었다고 한다. 인민공사는 1983~1984년 해체되기 시작했다. 대외 개방은 1979년 7월 광둥과 푸젠에 특별 정책을 주기로 하며 시작되어 1980년 선전·주하이·산터우·샤먼에 경제특구가 세워졌고 1984년에는 14개 연해 도시가 개방되었다. 1984년 10월 제12기 3중전회는 도시 경제 체제 개혁을 결정했다. 정치 면에서는 1980~1981년 4인방과 린뱌오 집단에 대한 재판이 열려 장칭과 장춘차오가 사형 집행 유예를 받았고(「린뱌오 사건과 문화 대혁명의 끝」(앞의 사건)), 1981년 6월 11기 6중전회의 「건국 이래 당의 약간의 역사 문제에 관한 결의」는 문화 대혁명을 전면 부정하고 마오쩌둥의 공적이 주요하고 과오는 부차적이라고 평가했다. 후야오방이 당 주석(1981)에 이어 총서기(1982)가 되었고 자오쯔양이 총리가 되었다(1980). 덩샤오핑은 1962년에 했다는 검은 고양이든 흰 고양이든 쥐를 잡으면 좋은 고양이라는 말로 실용주의를 상징하는 인물로 알려졌다. 개혁은 소득 격차와 인플레, 부패 문제를 낳았고, 이 문제들은 1980년대 말 정치 갈등의 배경이 되었다(「톈안먼 시위와 6·4 진압」(뒤의 사건))."
  subjects: [prc]
  tags: [economy, politics]
  sources: ["Ezra F. Vogel, Deng Xiaoping and the Transformation of China (Belknap Press of Harvard University Press, 2011)", "The Cambridge History of China, vol. 15: The People's Republic, Part 2: Revolutions within the Chinese Revolution, 1966–1982 (Roderick MacFarquhar·John K. Fairbank 편, Cambridge University Press, 1991)", "「건국 이래 당의 약간의 역사 문제에 관한 결의」(1981)"]

- id: sino-vietnamese-war-1979
  year: 1979
  endYear: 1991
  title:
    ko: "중월 전쟁과 국경 분쟁(1979~1991)"
  summary:
    ko: "1970년대 후반 중화인민공화국과 베트남의 관계는 급속히 나빠졌다. 1975년 베트남이 통일을 이루고(「베트남의 분단과 베트남 공화국 수립」(앞의 사건)) 소련과 가까워지는 한편, 중국은 캄보디아의 크메르 루주 정권을 지원했다. 베트남이 1978년 화교를 압박해 많은 화교가 중국으로 떠났고 국경에서도 충돌이 늘었다. 1978년 11월 베트남이 소련과 우호 협력 조약을 맺었고, 12월 25일 캄보디아를 침공해 이듬해 1월 크메르 루주를 몰아냈다. 중국은 이를 소련이 뒤에서 이끄는 포위로 받아들였다. 덩샤오핑은 1979년 1월 말에서 2월 초 미국을 방문한 뒤(「핑퐁 외교에서 미중 수교까지」(앞의 사건)) 2월 17일 20만 명 안팎의 군대를 베트남 북부 국경에 투입해 공격했다. 중국은 이를 자위 반격전이라 불렀고 덩샤오핑은 베트남에 교훈을 주겠다고 말했다. 싸움은 까오방·라오까이·랑선 일대에서 벌어졌고, 베트남은 정규군 주력을 캄보디아에 둔 채 지방군과 민병으로 맞서 완강히 저항했다. 중국군은 3월 6일 랑선을 점령하고 교훈을 주는 목적을 이루었다며 철수를 선언해 3월 16일까지 국경 밖으로 물러났다. 사상자 수는 양쪽의 주장이 다르다. 중국 쪽 전사자는 7천 명 안팎으로, 유출된 중국군 자료로는 6,954명, 다른 집계로는 8,500여 명이며, 베트남 쪽 피해는 수만 명으로 추산되나 베트남이 공식 수치를 내지 않아 집계가 크게 갈린다. 양쪽 모두 승리를 주장했다. 중국은 베트남을 캄보디아에서 물러나게 하지 못했고, 베트남은 1989년에야 캄보디아에서 철수했다. 국경 충돌은 1980년대 내내 이어졌고 두 나라 관계는 1991년에야 정상화되었다. 이 전쟁은 중국이 미국과 가까워진 직후 소련의 동맹을 겨눈 군사 행동이었고, 중국군의 현대화가 필요하다는 인식을 낳아 1980년대 군 개혁으로 이어졌다는 평가가 있다."
  subjects: [prc, soviet-union, usa]
  tags: [war, diplomacy]
  sources: ["Edward C. O'Dowd, Chinese Military Strategy in the Third Indochina War: The Last Maoist War (Routledge, 2007)", "Xiaoming Zhang, Deng Xiaoping's Long War: The Military Conflict between China and Vietnam, 1979–1991 (University of North Carolina Press, 2015)"]

- id: taiwan-democratization-1979
  year: 1979
  endYear: 2000
  title:
    ko: "타이완의 민주화(1979~2000)"
  summary:
    ko: "1975년 장제스가 죽은 뒤 부총통 옌자간이 총통직을 이었고, 아들 장징궈는 국민당 주석(1975)에 이어 1978년 총통에 올라 경제 발전을 이끌었고, 타이완은 수출 중심 산업화로 아시아의 네 마리 용 가운데 하나가 되었다. 1971년 유엔에서 쫓겨나고(「핑퐁 외교에서 미중 수교까지」(앞의 사건)) 1979년 미국과 단교하자 국민당 정부의 정통성에 대한 의문과 민주화 요구가 커졌다. 1979년 12월 10일 세계 인권의 날에 가오슝에서 잡지 『메이리다오』 관계자들이 연 집회가 경찰과 충돌했고(메이리다오 사건), 정부는 야당 인사들을 군사 법정에 세웠다. 이 재판은 오히려 민주화 운동의 상징이 되었다. 1986년 9월 28일 야당 민주진보당이 창당을 선언했고, 장징궈는 1987년 7월 15일 38년 동안 이어진 계엄령을 풀고 11월 대륙 친지 방문을 허용했다(「2·28 사건과 중화민국 정부의 타이완 이전, 계엄 체제」(앞의 사건)). 1988년 1월 장징궈가 죽자 부총통 리덩후이가 타이완 출신으로는 처음 총통에 올랐다. 1991년 동원 감란 시기 임시 조항을 없애고 1992년 입법원 의원을 전면 선거로 뽑으면서 대륙에서 선출된 뒤 수십 년 동안 자리를 지켜 온 의원들이 물러났다. 1992년 홍콩에서 타이완과 대륙의 민간 기구가 접촉한 일에 근거한 이른바 92 합의는 하나의 중국 원칙의 해석을 두고 양쪽 입장이 갈려, 합의의 존재와 의미를 둘러싼 논쟁이 이어진다. 같은 해 한국이 중화인민공화국과 수교하며 타이완과 단교했다(「한중 수교」(뒤의 사건)). 1995년 리덩후이가 정부를 대표해 2·28 사건의 희생자에게 공개 사과했다. 같은 해 6월 리덩후이가 미국을 방문하자 중국이 7월부터 타이완 근해에 미사일을 쏘며 위협했고, 1996년 3월 미국이 항공모함 전단을 보냈다(제3차 타이완 해협 위기, 1995~1996). 1996년 3월 23일 처음으로 총통을 국민이 직접 뽑는 선거가 치러져 리덩후이가 당선되었다. 2000년 3월 민진당의 천수이볜이 당선되어 5월 20일 취임했고, 국민당은 55년 만에 처음 여당 자리를 내려놓았다. 타이완의 민주화는 중국과의 관계와 정체성을 둘러싼 논쟁 속에서 진행되었다. 중화인민공화국은 타이완을 중국의 일부로 보며 무력 사용 가능성을 포기하지 않는다는 입장이고, 타이완 안에서는 현상 유지와 통일, 독립을 두고 의견이 갈린다."
  subjects: [roc, prc, usa, rok]
  tags: [politics]
  sources: ["Murray A. Rubinstein 편, Taiwan: A New History (M. E. Sharpe, 1999)", "Shelley Rigger, Politics in Taiwan: Voting for Democracy (Routledge, 1999)", "Denny Roy, Taiwan: A Political History (Cornell University Press, 2003)"]

- id: one-child-1979
  year: 1979
  endYear: 2021
  title:
    ko: "한 자녀 정책과 그 전환(1979~2021)"
  summary:
    ko: "1970년대 초부터 중화인민공화국 정부는 늦게, 드물게, 적게 낳으라는 산아 제한을 펴 합계 출산율이 크게 내려갔지만, 1970년대 말 지도부는 인구 증가가 경제 목표를 가로막는다고 보았다. 1979년 천윈 등이 부부당 한 자녀 정책을 제안했고, 1980년 9월 공산당 중앙의 공개 서한이 한 쌍의 부부가 한 자녀만 낳자고 호소하며 이 정책이 본격화되었다. 1982년 계획 생육은 기본 국책으로 헌법에 올랐다. 도시 주민에게는 엄격했으나 농촌에서는 첫째가 딸이면 둘째를 허용하는 곳이 많았고(1984년 이후 널리 퍼졌다), 소수 민족에게는 더 느슨한 규정이 있었다. 한 자녀를 넘겨 낳으면 사회 부양비라는 벌금이 매겨졌고 호적 등록과 학교·직장에서 불이익이 따르기도 했다. 지방 간부들은 출산 목표를 채우라는 압력을 받았고 일부 지역에서 강제 낙태와 불임 시술이 있었다는 보고와 비판이 이어졌다. 정부는 이 정책으로 약 4억 명의 출생을 막았다고 주장하지만, 학자들은 정책 이전부터 출산율이 내려가고 있었고 경제 발전도 영향을 주었다며 효과를 두고 논쟁한다. 합계 출산율은 1979년 2.8 안팎에서 1990년대 중반 이후 1.5~1.8 안팎으로 내려갔다(집계에 따라 다르다). 아들을 선호하는 풍조와 겹쳐 공식 통계의 출생 성비가 2000년대 중반 여아 100명당 남아 120명 안팎까지 치솟아(출생 신고 누락 때문에 집계에 따라 다르다는 지적도 있다) 결혼 시장의 불균형이 우려되었다. 부부 한 쌍이 아이 한 명과 조부모 네 명을 부양하는 구조가 늘며 고령화도 빨라졌다. 정책은 2013년 부부 한쪽이 외동이면 둘째를 허용하는 쪽으로 풀렸고, 2015년 10월 모든 부부에게 두 자녀를 허용하기로 해 2016년 1월 시행되었다. 2021년 5월에는 세 자녀까지 허용하기로 했고, 이어 벌금인 사회 부양비를 없애 출산 제한을 사실상 풀었다. 그러나 출생아 수는 계속 줄어 2021년 1천만 명 남짓이었다."
  subjects: [prc]
  tags: [society, politics]
  sources: ["Susan Greenhalgh, Just One Child: Science and Policy in Deng's China (University of California Press, 2008)", "Mei Fong, One Child: The Story of China's Most Radical Experiment (Houghton Mifflin Harcourt, 2016)"]

- id: hongkong-macau-1984
  year: 1984
  endYear: 1999
  title:
    ko: "홍콩·마카오 반환과 일국양제(1984~1999)"
  summary:
    ko: "홍콩은 1842년 난징 조약으로 홍콩섬이, 1860년 베이징 조약으로 주룽 남부가 영국에 넘어갔고(「아편 전쟁과 난징 조약」(앞의 사건), 「제2차 아편 전쟁과 베이징 조약」(앞의 사건)), 1898년에는 신계가 99년 동안 조차되었다. 조차 기한이 가까워지자 영국 총리 대처가 1982년 9월 베이징을 방문해 덩샤오핑과 홍콩의 앞날을 논의했다. 덩샤오핑은 주권 문제는 협상 대상이 아니라고 했고, 중국은 1997년에 홍콩 전체를 되찾겠다는 뜻을 분명히 했다. 두 나라 협상 끝에 1984년 12월 19일 베이징에서 자오쯔양 총리와 대처 총리가 중영 공동 성명에 서명했고 1985년 5월 27일 발효했다. 성명은 중국이 1997년 7월 1일 홍콩에 주권을 행사하고, 홍콩이 외교와 국방을 뺀 고도의 자치를 누리며 자본주의 제도와 생활 방식을 50년 동안 바꾸지 않는다고 정했다. 이 구상이 일국양제로, 본래 타이완 통일을 염두에 두고 덩샤오핑이 제시한 방안이다. 1990년 4월 4일 전국 인민 대표 대회가 홍콩 기본법을 채택했고, 기본법은 행정장관을 점차 보통 선거로 뽑는 것을 궁극적 목표로 한다고 정했다. 톈안먼 사건(「톈안먼 시위와 6·4 진압」(뒤의 사건)) 뒤 홍콩 사람들의 불안이 커져 이민이 늘었다. 1992년 부임한 마지막 총독 크리스 패튼이 선거 제도를 넓히려 하자 중국은 이에 반발해 영국과 갈등을 빚었고, 따로 임시 입법회를 꾸렸다. 1997년 6월 30일 밤부터 7월 1일 새벽에 걸친 의식으로 홍콩이 반환되어 약 650만 명이 중화인민공화국 홍콩 특별 행정구의 주민이 되었다. 초대 행정장관은 둥젠화였다. 마카오는 16세기 중반부터 포르투갈이 거주했고 1887년 청과 포르투갈이 맺은 조약으로 영구 점유가 인정되었다. 1974년 포르투갈 혁명 뒤 포르투갈은 마카오를 포르투갈이 관리하는 중국 영토로 보았다. 1987년 4월 13일 중국과 포르투갈이 공동 성명에 서명했고, 1999년 12월 20일 마카오가 반환되어 같은 방식으로 50년 동안 높은 자치를 보장받았다."
  subjects: [prc, uk, portugal]
  links:
    - { from: uk, to: prc, note: "홍콩 반환 (1997)" }
    - { from: portugal, to: prc, note: "마카오 반환 (1999)" }
  tags: [diplomacy, politics]
  sources: ["Steve Tsang, A Modern History of Hong Kong (I. B. Tauris, 2004)", "「중영 공동 성명」(1984)", "「중포 공동 성명」(1987)", "「홍콩 특별 행정구 기본법」(1990)"]

- id: wto-1986
  year: 1986
  endYear: 2001
  title:
    ko: "중국의 세계 무역 기구(WTO) 가입(1986~2001)"
  summary:
    ko: "중화인민공화국은 개혁 개방과 함께 국제 무역 체제에 들어가려 했다(「개혁 개방의 시작」(앞의 사건)). 1986년 7월 관세 및 무역에 관한 일반 협정(GATT)의 체약국 지위를 되찾겠다고 신청했고, 1989년 톈안먼 사건(「톈안먼 시위와 6·4 진압」(뒤의 사건)) 뒤 협상이 한동안 멈추었다. 1995년 WTO가 출범한 뒤에는 WTO 가입 협상으로 이어졌다. 쟁점은 관세 인하, 서비스와 금융 시장 개방, 국유 기업 보조금, 지적 재산권, 중국을 시장 경제로 볼지 여부였다. 1999년 4월 주룽지 총리가 미국을 방문했고 11월 15일 중국과 미국이 양자 협상을 타결했다. 2000년 미국 의회가 중국에 항구적 정상 무역 관계 지위를 주는 법을 통과시켰다. 2001년 11월 10일 카타르 도하의 WTO 각료 회의가 중국의 가입을 승인했고 12월 11일 중국이 143번째 회원국이 되었다. 중국은 관세를 낮추고 시장을 열며 지적 재산권을 보호하기로 약속했다. 가입 의정서에는 일정 기간 중국산 상품이 갑자기 늘어 피해가 생길 때 쓰는 특별 안전 장치와, 중국을 시장 경제로 보지 않고 반덤핑 관세를 매기는 방식에 관한 조항이 포함되었다. 2001년 중국의 대외 무역액은 약 5,100억 달러였다. 가입 뒤 중국은 세계의 공장으로 불리며 수출 중심 성장을 이어 갔다. 값싼 중국 상품이 소비자에게는 이로웠으나 선진국 일부에서는 제조업 일자리가 줄었다는 비판이 나와 이를 둘러싼 논쟁이 이어졌다. 중화민국 정부가 타이완·펑후·진먼·마쭈 독립 관세 영역 이름으로 낸 가입 신청도 같은 시기 승인되어 뒤이어 회원이 되었다. 가입 협상은 중국 시장 경제로의 전환을 국제 규범으로 묶는 계기였다는 평가와, 중국이 약속을 충분히 지키지 않았다는 비판이 함께 있다."
  subjects: [prc, usa, roc]
  tags: [economy, diplomacy]
  sources: ["Nicholas R. Lardy, Integrating China into the Global Economy (Brookings Institution Press, 2002)", "Barry Naughton, The Chinese Economy: Transitions and Growth (MIT Press, 2007)", "「중화인민공화국의 WTO 가입 의정서」(2001)"]

- id: tiananmen-1989
  year: 1989
  title:
    ko: "톈안먼 시위와 6·4 진압(1989)"
  summary:
    ko: "1980년대 중화인민공화국은 개혁 개방으로 성장했으나(「개혁 개방의 시작」(앞의 사건)) 인플레와 관료의 부패·특권, 정치 개혁이 늦어지는 데 대한 불만이 쌓였다. 1987년 학생 시위의 책임을 지고 물러난 개혁파 후야오방 전 총서기가 1989년 4월 15일 숨지자 베이징의 대학생들이 추모와 함께 언론 자유, 부패 척결, 정치 개혁을 요구하며 톈안먼 광장에 모였다. 4월 26일 『인민일보』 사설이 이를 동란으로 규정하자 반발이 커졌고, 5월 중순 소련 고르바초프의 방중을 앞두고 학생들이 단식 농성에 들어가자 지지하는 시민과 노동자가 늘어 시위는 전국의 여러 도시로 번졌다. 총서기 자오쯔양은 대화로 풀자는 쪽이었으나 5월 20일 총리 리펑이 계엄령을 발표했고 덩샤오핑 등 원로들이 이를 지지했다. 시민들이 군대의 진입을 막아서기도 했다. 6월 3일 밤에서 4일 새벽 사이 인민해방군이 무장한 채 베이징 중심으로 들어와 도심의 큰길을 따라 광장 쪽으로 진입했고, 시민과 학생이 총에 맞거나 장갑차에 치여 숨졌다. 대부분의 사망은 광장 안이 아니라 광장으로 이어지는 거리에서 일어났다. 사망자 수는 집계가 크게 갈린다. 중국 정부는 대변인 위안무가 6월 6일 300명 안팎이라 했고 뒤에 241명(민간 218명, 군경 23명)이라는 집계를 내놓았으며, 톈안먼 어머니회는 202명의 신원을 확인했으며, 병원 기록에 근거한 집계는 400명대이다. 국제 앰네스티는 최대 1,000명을 이야기했고 영국 대사의 외교 전문이 전한 1만 명 안팎이라는 말과 일부 초기 추산은 수천 명 이상을 거론했으나 신뢰성을 두고 논란이 있다. 학자들은 대체로 수백 명에서 수천 명으로 본다. 이후 자오쯔양은 총서기에서 해임되어 오랫동안 가택 연금되었고 상하이 당서기 장쩌민이 후임이 되었다. 대규모 검거가 이어졌고 서방 여러 나라는 무기 금수 등 제재를 가했다. 중국 정부는 이 사건을 1989년 봄여름 사이의 정치 풍파라고 부르며 안정과 경제 발전을 위해 불가피한 조치였다는 입장이고, 국내에서는 이 일을 공개적으로 논의하는 것이 제한된다. 같은 해 유럽에서는 공산 정권이 잇따라 무너졌다(「1989년 동유럽 혁명」(뒤의 사건)). 중국은 이후 덩샤오핑의 남순을 계기로 시장 경제 개혁을 다시 밀고 나갔다(「남순강화와 사회주의 시장 경제」(뒤의 사건))."
  subjects: [prc, soviet-union]
  tags: [politics, society]
  sources: ["Timothy Brook, Quelling the People: The Military Suppression of the Beijing Democracy Movement (Oxford University Press, 1992)", "Joseph Fewsmith, China Since Tiananmen: From Deng Xiaoping to Hu Jintao (Cambridge University Press, 2008)", "Merle Goldman, From Comrade to Citizen: The Struggle for Political Rights in China (Harvard University Press, 2005)"]

- id: southern-tour-1992
  year: 1992
  endYear: 1994
  title:
    ko: "남순강화와 사회주의 시장 경제(1992~1994)"
  summary:
    ko: "톈안먼 사건 뒤(「톈안먼 시위와 6·4 진압」(앞의 사건)) 중화인민공화국은 경제 개혁의 속도를 늦추고 보수적인 정책으로 돌아섰다. 1991년 소련이 해체되자(「소련의 해체」(앞의 사건)) 개혁의 방향을 두고 당 안의 논쟁이 이어졌다. 1992년 1월 18일부터 2월 21일까지 덩샤오핑은 우창과 선전, 주하이, 상하이를 돌며 남순강화를 했다. 그는 발전이 확고한 도리이고 계획이냐 시장이냐는 사회주의와 자본주의를 가르는 기준이 아니며, 생산력 발전에 이로운지가 기준이 되어야 한다는 취지로 말했다. 개혁을 더디게 하는 사람은 물러나야 한다는 말도 했다. 이 강화의 정신은 그해 10월 제14차 당 대회에 반영되어 사회주의 시장 경제 체제를 개혁의 목표로 정했다. 1993년 11월 제14기 3중전회가 이 체제를 세우는 결정을 채택했고, 1994년 1월 1일 분세제 개혁으로 중앙과 지방의 세수를 나누고 부가가치세를 도입했으며 이중 환율을 하나로 합쳤다. 국유 기업은 현대적 기업 제도로 바꾸는 방향으로 개혁이 시작되었다. 1990년 상하이 푸둥 개발이 발표된 데 이어 1990~1991년 상하이와 선전에 증권 거래소가 문을 열었다. 외국인 투자가 급증해 연안 지역을 중심으로 수출 주도 성장이 이어졌고, 공식 통계로 1992~1994년 경제 성장률은 해마다 13~14%대였다. 그 부작용으로 1994년 물가 상승률이 20%를 넘었고, 연안과 내륙, 도시와 농촌 사이의 소득 격차와 부패가 문제가 되었다. 대외 관계도 넓어져 한국은 중국의 시장 개방과 함께 중요한 투자·교역 상대로 떠올라 1992년 8월 수교했다(「한중 수교」(뒤의 사건)). 정치 면에서는 1989년 총서기에 오른 장쩌민이 1993년 3월 국가 주석을 겸하며 당·정·군을 모두 이끌게 되었다."
  subjects: [prc, rok]
  tags: [economy, politics]
  sources: ["Ezra F. Vogel, Deng Xiaoping and the Transformation of China (Belknap Press of Harvard University Press, 2011)", "Barry Naughton, The Chinese Economy: Transitions and Growth (MIT Press, 2007)", "Joseph Fewsmith, China Since Tiananmen: From Deng Xiaoping to Hu Jintao (Cambridge University Press, 2008)"]

- id: beijing-2008
  year: 2008
  title:
    ko: "티베트 소요, 쓰촨 대지진, 베이징 올림픽(2008)"
  summary:
    ko: "2008년 3월 10일 라싸에서 승려들의 시위가 시작되었고 14일 폭력 사태로 번졌다. 중화인민공화국 정부는 민간인 18명과 경찰관 1명이 숨졌다고 발표했고, 티베트 망명 정부는 이보다 훨씬 많은 사망자를 주장했다. 시위는 쓰촨·간쑤·칭하이 등 티베트족 지역으로 번졌다(「티베트 봉기와 달라이 라마의 망명」(앞의 사건)). 4월에는 베이징 올림픽 성화 봉송 길에 런던과 파리 등지에서 티베트 문제와 인권을 내세운 항의가 벌어졌고, 중국 안팎에서 민족주의 반응이 일어났다. 5월 12일 14시 28분 쓰촨성 원촨현에서 규모 8.0(Ms)의 대지진이 일어났다. 중국 정부 집계로 사망 약 6만 9천 명, 실종 약 1만 8천 명이었고 약 37만 명이 다쳤으며 500만 명 안팎이 집을 잃었다. 학교 건물이 무너져 많은 학생이 숨졌다는 비판이 일었고, 정부는 이듬해 5월 학생 사망·실종자를 5,335명이라고 발표했다. 부실 공사를 지적한 시민과 조사 활동가는 압박을 받았다. 정부와 군, 자원봉사자의 구조 활동으로 사회의 연대감이 커졌다는 평가도 있다. 8월 8일 베이징 올림픽이 개막하여 24일까지 열렸다. 장이머우가 연출한 개막식이 화제가 되었고 중국은 금메달 51개로 종합 1위를 했다. 도쿄(1964)와 서울(1988)에 이은 아시아의 세 번째 하계 올림픽이었다(「서울 올림픽과 북방 외교」(앞의 사건)). 올림픽은 중국의 성장을 세계에 보여 준 행사였고 후진타오 정부는 조화로운 사회를 내세웠다. 한편 인권과 언론 자유, 티베트 문제를 두고 국제 사회의 비판도 받았다. 9월 미국의 리먼 브러더스가 파산하며 세계 금융 위기가 닥치자 중국은 11월 4조 위안 규모의 경기 부양책을 발표했고, 이는 위기 속에서 중국 경제의 성장을 떠받쳤으나 부채 증가도 낳았다."
  subjects: [prc, usa]
  tags: [society, politics]
  sources: ["쓰촨성 정부의 원촨 지진 학생 사망·실종자 집계 발표(2009)", "Xu Guoqi, Olympic Dreams: China and Sports, 1895–2008 (Harvard University Press, 2008)"]

- id: xi-belt-road-2012
  year: 2012
  endYear: 2023
  title:
    ko: "시진핑 체제의 출범과 일대일로(2012~2023)"
  summary:
    ko: "2012년 11월 제18차 당 대회에서 시진핑이 총서기와 중앙 군사 위원회 주석에 올랐고, 2013년 3월 국가 주석이 되었다. 중화인민공화국의 시진핑 지도부는 중화민족의 위대한 부흥, 곧 중국몽을 내세웠다. 2012년 말부터 당은 반부패 운동을 벌여 호랑이(고위 간부)와 파리(하급 관리)를 함께 잡겠다고 했고, 2022년 10월 중앙 기율 검사 위원회는 10년 동안 입건한 사건이 460만 건을 넘는다고 밝혔다. 전 중앙 정치국 상무위원 저우융캉과 충칭 당서기였던 보시라이 등이 처벌받았으며, 비판자들은 이 운동이 정치적 경쟁자를 제거하는 수단이 되기도 했다고 본다. 2013년 9월 시진핑은 카자흐스탄에서 실크로드 경제 벨트를, 10월 인도네시아에서 21세기 해상 실크로드를 제안했고 이 둘을 합쳐 일대일로라 부른다. 중국은 철도와 항만, 발전소 같은 사회 기반 시설에 투자하고 금융을 지원하는 방식으로 아시아·아프리카·유럽의 여러 나라와 협력했다. 2015년 12월에는 중국의 제안으로 아시아 인프라 투자 은행이 출범했다. 2017년 5월과 2019년 4월, 2023년 10월 베이징에서 일대일로 국제 협력 정상 포럼이 열렸고 중국 정부는 150개국 안팎이 협력 문서에 서명했다고 밝혔다. 파키스탄의 중국-파키스탄 경제 회랑, 라오스 철도(2021년 12월 개통), 스리랑카 함반토타항(2017년 중국 기업이 99년 운영권을 얻음) 같은 사례가 알려져 있다. 지지하는 쪽은 개발 도상국의 사회 기반 시설 수요를 채워 준다고 평가하나, 비판하는 쪽은 부채 부담과 불투명한 계약, 환경과 노동 문제를 지적하며 이른바 부채의 함정을 거론한다. 중국은 이를 반박하며 상생 협력이라고 설명한다. 정치 면에서는 2017년 10월 19차 당 대회가 시진핑 사상을 당헌에 올렸고, 2018년 3월 헌법에서 국가 주석 연임 제한 규정이 삭제되었다. 2022년 10월 20차 당 대회에서 시진핑이 총서기에 세 번째로 선출되었다. 같은 시기 미국과의 무역 분쟁과 기술 경쟁이 커졌고, 홍콩과 신장 문제를 둘러싼 갈등도 이어졌다(「신장의 편입과 위구르 문제」(앞의 사건))."
  subjects: [prc, usa]
  tags: [politics, economy]
  sources: ["Elizabeth C. Economy, The Third Revolution: Xi Jinping and the New Chinese State (Oxford University Press, 2018)", "Nadège Rolland, China's Eurasian Century? Political and Strategic Implications of the Belt and Road Initiative (National Bureau of Asian Research, 2017)"]

- id: covid-2019
  year: 2019
  endYear: 2023
  title:
    ko: "코로나19와 제로 코로나 정책(2019~2023)"
  summary:
    ko: "2019년 12월 중화인민공화국 후베이성 우한에서 원인을 알 수 없는 폐렴 환자가 보고되었고, 12월 31일 우한시 보건 당국이 이를 공표했으며 2020년 1월 신종 코로나바이러스가 확인되었다. 초기에 병을 경고했던 의사 리원량은 지역 경찰의 훈계를 받았고 2020년 2월 7일 감염으로 숨져 정보 공개를 둘러싼 비판과 추모가 이어졌다. 1월 23일 중국 정부는 우한을 봉쇄해 4월 8일까지 76일 동안 도시를 닫았고, 전국에서 이동 제한과 격리, 접촉자 추적, 건강 코드를 이용한 관리를 시행했다. 이 조치로 2020년 봄 중국의 신규 감염이 크게 줄었으나 방역의 강제성과 사생활 침해를 두고 비판도 있었다. 세계 보건 기구는 2020년 3월 11일 팬데믹을 선언했다. 바이러스의 기원을 두고는 국제 조사와 논쟁이 이어졌고 중국은 정치화에 반대한다는 입장이다. 중국은 2020~2021년 확진자를 낮게 유지하며 경제 활동을 일찍 회복했고, 국산 백신을 개발해 해외에도 공급했다. 이후 전염력이 높은 오미크론 변이가 퍼지자 도시 봉쇄와 대규모 검사를 되풀이하는 제로 코로나 정책을 이어 갔다. 2022년 4~5월 상하이는 두 달 가까이 봉쇄되어 주민이 식량과 의료를 구하는 데 어려움을 겪었고 경제와 일상이 큰 타격을 입었다. 2022년 11월 신장 우루무치의 아파트 화재로 사망자가 나온 뒤(「신장의 편입과 위구르 문제」(앞의 사건)) 방역에 항의하는 시위가 여러 도시와 대학에서 벌어졌다. 12월 7일 정부는 이른바 신10조로 격리와 검사를 크게 줄이며 방역을 완화했고 곧 감염이 급증했다. 2023년 1월 8일에는 입국자 격리를 없앴다. 이 시기의 사망자 수는 공식 발표와 외부 추산 사이에 큰 차이가 있다. 중국은 2022년 12월 8일부터 2023년 1월 12일 사이 병원에서 숨진 코로나 관련 사망자가 약 6만 명이라고 발표했는데, 이는 12월 20일 코로나 사망의 기준을 폐렴이나 호흡 부전으로 숨진 경우로 좁힌 뒤의 집계이다. 이 기간의 초과 사망을 추산한 연구들은 도시 주민만 센 추산 90만 명 안팎부터 30세 이상 전체를 센 추산 190만 명 가까이까지로 연구마다 크게 갈린다."
  subjects: [prc]
  tags: [society, politics]
  sources: ["중국 국무원 신문 판공실, 『코로나19에 맞서는 중국의 행동』 백서(2020)", "세계 보건 기구(WHO) 사무총장의 코로나19 팬데믹 선언 발언(2020년 3월 11일)", "Estimated Excess Deaths Due to COVID-19 Among the Urban Population of Mainland China, December 2022 to January 2023 (Epidemiology, Marc Lipsitch 등 공저)"]
