# 중앙아시아 사건 ca-01: 옥수스 문명에서 에프탈·이스테미 야브구국까지 — 박트리아·소그디아나·호라즘·페르가나·타림 분지 (기원전 2300년 무렵 ~ 기원후 603년)
# 범위: 옥수스 문명(박트리아-마르기아나 복합체)·신타시타와 안드로노보 문화·철기 시대 오아시스와 조로아스터교의 고향·사카와 마사게타이·키루스 2세의 동방 원정·다리우스 1세의 동부 지방과 사카 원정·호라즘 왕국과 알렉산드로스·박트리아와 소그디아나 정복·셀레우코스 왕국의 동방·디오도토스의 독립·에우티데모스 1세와 안티오코스 3세·월지의 서진과 대월지의 박트리아·그리스-박트리아의 끝·아이하눔·타림 분지 오아시스 나라들과 한·오손과 강거와 대완·한 무제의 대완 원정·위·진과 전량의 서역·메르브의 종교들·사산의 소그디아나 진출 주장과 강거의 끝·호라즘과 토프락칼라·소그드 옛 편지·북위의 서역 교섭·북량 잔당의 고창·에프탈의 성립과 전성·쿠차와 키질 석굴·이스테미 야브구의 서방 경영·북주와 수의 소그드 이주민
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(마사게타이·사카 여러 집단·고거·오아시스 도시)과 땅 없는 문화(옥수스 문명)는 글로만 다뤘다. 이미 있는 다른 파일 사건(스키타이 왕국·키루스 2세와 아케메네스 제국의 성립·알렉산드로스·셀레우코스 1세·찬드라굽타와의 조약·안티오코스 3세·데메트리오스 1세·묵돌 선우·장건·서역도호부·쿠샨·사산·알촌·키다라·구마라집·반초)는 다시 쓰지 않고 「제목」으로 가리켰다.
# 날짜: 기원전 연도는 글에 '기원전 N년'으로 적고, 저장소 year는 천문 연도(기원전 N년 = 1−N)다. 출처 달력 그대로, 확실하지 않은 해는 '무렵'으로, 학설이 갈리는 해(그리스-박트리아의 독립, 에우티데모스 1세의 즉위, 장건의 귀환, 마니의 죽음, 소그디아나의 에프탈 점령 등)는 범위나 한 구절로 적었다. 저장소의 하한(기원전 2333년)보다 앞선 일은 없다.
# 이름 규칙: 인명·지명은 표기 사전과 저장소 기존 표기(키루스 2세·다리우스 1세·알렉산드로스·셀레우코스 1세·안티오코스 3세)를 따랐고, 항목이 있는 나라는 항목 이름으로 적었다. 중국 사서의 이름은 한국 한자음으로 적고 필요하면 한자를 병기했다. 군주의 재위는 위키백과의 군주 목록과 정보 상자를 맞춰 보고 갈리는 쪽은 괄호로 함께 적었다.
# 사건 연도 규칙: subjects의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 영토가 있는 기간만 links에 썼다. 한국사와 닿는 점은 한반도로 퍼진 한역 불경을 한 문장으로 적었을 뿐 따로 짓지 않았다.

- id: oxus-civilization-2300bc
  year: -2299
  endYear: -1699
  title:
    ko: "옥수스 문명(박트리아-마르기아나 복합체, 기원전 2300~1700 무렵)"
  summary:
    ko: "아무다리야 상류와 무르가브강 삼각주, 곧 지금의 투르크메니스탄 동부·아프가니스탄 북부·우즈베키스탄 남부·타지키스탄 서부에 걸쳐 기원전 2300년 무렵부터 성벽을 두른 큰 정착지들이 나타났다. 소련의 고고학자 빅토르 사리아니디가 1970년대에 아프가니스탄 북부와 투르크메니스탄에서 발굴하며 이 문화에 박트리아-마르기아나 복합체라는 이름을 붙였다. 무르가브의 고누르 데페에는 한 변이 150미터쯤 되는 궁전 터가 있고, 토골록에는 140×100미터 규모의 신전 터가 있다. 사람들은 밀과 보리를 키웠고 발달한 수로로 물을 댔으며, 청동·구리·은·금을 다루는 금속 기술이 뛰어났다. 고누르와 알틴 데페에서는 인더스 문명의 인장이 나왔고 아무다리야 가의 쇼르투가이에는 인더스 문명 사람들의 교역 거점이 있어서, 서쪽 이란 고원과 남쪽 인더스 문명 사이를 잇는 교역망의 한 갈래였음을 알 수 있다. 낙타를 길들인 일도 이 문화권에서 확인된다. 기원전 1900년 무렵부터 큰 중심지들이 쪼그라들고 오아시스마다 제각기 토기를 쓰게 되었으며, 초원 쪽 안드로노보 계통 토기가 시골에 퍼졌다. 이 문화의 사람들이 어떤 말을 썼는지, 뒤에 인도-이란어를 쓰는 사람들과 어떻게 이어지는지는 지금도 학자들 사이에 논쟁이 있다. 도시 단계를 언제로 잡을지도 연구자마다 달라서, 살바토리는 기원전 2400~1950년 무렵으로, 두보바와 리오네는 기원전 2250~1700년 무렵으로 본다. 아나우에서 나온 인장 하나의 무늬를 글자로 보자는 의견이 있었으나 증거는 그 인장 하나뿐이다. 아프가니스탄 쪽 박트리아의 사팔리 테페 무덤들은 기원전 1700~1500년 무렵으로 보며, 이란 북동부까지 퍼진 이 문화를 '대호라산 문명'이라 부르자는 제안도 있다."
  subjects: [indus-civilization]
  tags: [society, culture]
  sources: ["Fredrik T. Hiebert, Origins of the Bronze Age Oasis Civilization in Central Asia (Peabody Museum, 1994)", "Viktor Sarianidi, Margiana and Protozoroastrism (Kapon Editions, 1998)", "J. P. Mallory and Douglas Q. Adams, The Encyclopedia of Indo-European Culture (Fitzroy Dearborn, 1997)", "David W. Anthony, The Horse, the Wheel, and Language (Princeton University Press, 2007)"]

- id: sintashta-andronovo-2200bc
  year: -2199
  endYear: -999
  title:
    ko: "신타시타·안드로노보 문화와 인도-이란계 집단의 초원 이동(기원전 2200~1000 무렵)"
  summary:
    ko: "우랄산맥 남쪽의 신타시타 문화(기원전 2200~1900 무렵)는 성벽을 두른 마을과 바퀴살 달린 전차의 가장 오래된 흔적으로 알려져 있다. 신타시타 무덤에서는 말과 전차를 함께 묻은 흔적이 나왔다. 그 뒤를 이어 카자흐스탄 초원에서 시베리아 서남부까지 퍼진 안드로노보 문화는 알라쿨·페도로보 같은 지역 유형으로 나뉘며, 목축을 바탕으로 구리와 청동을 캐고 다루었다. 소와 양과 말을 기르는 이 문화의 사람들은 대체로 초기 인도-이란어를 쓴 집단으로 보지만, 이 문화가 인도-이란계인지부터 따지는 연구자들도 있다. 이들의 일부는 기원전 2000년 무렵 이후 남쪽으로 내려가 옥수스 문명의 오아시스 근처에서 살았고, 안드로노보 계통 토기가 오아시스 시골에서 나타나는 시기는 옥수스 문명의 큰 중심지가 줄어드는 때와 겹친다. 유전자 연구들도 이 이동의 경로와 오아시스 주민과의 섞임을 따지는 근거로 쓰이지만 해석은 아직 갈린다. 남아시아 쪽의 일은 「인도-아리아어 사용 집단의 남아시아 이주(기원전 2000~1500 무렵)」(뒤의 사건)에서 다룬다. 이 이동의 연대와 경로는 학자마다 크게 다르다. 인더스 문명 쪽의 쇠퇴나 베다 시대 인도의 형성과 어떻게 이어지는지도 아직 열린 문제다. 알라쿨 유형은 기원전 1900~1500년 무렵, 페도로보 유형은 기원전 1900~1300년 무렵, 그 뒤 북카자흐스탄의 알렉세예프카-사르가리 유형은 기원전 1500~1000년 무렵으로 본다. 카자흐스탄의 세미야르카 같은 큰 마을은 기원전 1600년 무렵으로 보고, 알타이산맥에서는 기원전 14세기 무렵부터 구리 광석을 캤다. 같은 시기 볼가강 쪽에서는 스루브나야 문화가 겹쳐 있었다."
  subjects: [indus-civilization, vedic-india]
  tags: [society, culture]
  sources: ["David W. Anthony, The Horse, the Wheel, and Language (Princeton University Press, 2007)", "Elena E. Kuzmina, The Origin of the Indo-Iranians (Brill, 2007)", "Vagheesh M. Narasimhan et al., The formation of human populations in South and Central Asia (Science, 2019)", "J. P. Mallory and Douglas Q. Adams, The Encyclopedia of Indo-European Culture (Fitzroy Dearborn, 1997)"]

- id: iron-age-oases-1000bc
  year: -999
  endYear: -549
  title:
    ko: "철기 시대의 호라즘·소그디아나·박트리아와 조로아스터교의 고향(기원전 1000~550 무렵)"
  summary:
    ko: "기원전 1000년 무렵부터 아무다리야와 시르다리야 유역, 호라즘 오아시스, 자라프샨강과 카슈카다리야 골짜기에서는 철을 쓰는 농경·목축 사회가 자랐다. 사람들은 수로를 내어 곡식을 길렀고, 곳곳에 토성과 요새로 둘러싼 농장을 세웠다. 동이란 계통의 말을 쓰는 이 사람들 사이에서 불을 중시하는 종교가 자랐다고 본다. 『아베스타』의 가장 오래된 부분인 가타가 지어진 곳과 예언자 자라투스트라가 산 곳이 어디인지는 학자들 사이에 논쟁이 있으나, 동이란, 곧 지금의 아프가니스탄·투르크메니스탄·우즈베키스탄 일대를 꼽는 견해가 흔하다. 『아베스타』에 나오는 전설의 고향 에이리야네 바이자(아리아인의 땅)를 호라즘으로 보는 학자도 있고, 더 남쪽 아프가니스탄으로 보는 학자도 있다. 오아시스마다 작은 왕과 부족장이 다스리던 이 땅은 기원전 6세기 중엽 키루스 2세의 아케메네스 제국이 동쪽으로 뻗어 오면서 하나의 큰 제국에 편입되었다. 그 일은 「키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)」(뒤의 사건)와 이어지며, 제국 안의 조로아스터교는 「조로아스터교와 아케메네스 제국의 종교(기원전 6~4세기)」(뒤의 사건)에서 따로 다룬다. 이 시기를 적은 글이 없어 고고학과 『아베스타』의 언어에 기대어 추정할 수밖에 없으므로 연대는 대략적이다. 헤로도토스는 호라즘 사람을 파르티아·소그드·아리아 사람과 함께 아케메네스 제국의 제16 태수령에 묶어 적었다. 말로리와 애덤스는 옥수스 문명과 안드로노보 문화, 야즈 문화를 인도-이란계 집단의 이동과 잇는 견해를 내놓았다. 같은 말이 쓰인 동이란 오아시스들은 뒤에 소그드 도시국가와 호라즘 왕국으로 나뉘어 이어진다."
  subjects: [achaemenid-empire]
  tags: [religion, society]
  sources: ["Mary Boyce, A History of Zoroastrianism, vol. 1 (Brill, 1975)", "Michael Witzel, 'The Home of the Aryans,' in Anusantatyai: Festschrift für Johanna Narten (Röll, 2000)", "Elton L. Daniel, The History of Iran, 2nd ed. (Greenwood, 2012)", "Christoph Baumer, The History of Central Asia, vol. 1: The Age of the Steppe Warriors (I. B. Tauris, 2012)"]

- id: saka-massagetae-700bc
  year: -699
  endYear: -199
  title:
    ko: "사카와 마사게타이: 중앙아시아 초원과 오아시스 가장자리의 유목 사회(기원전 7~3세기)"
  summary:
    ko: "아케메네스의 비문은 중앙아시아 초원의 유목민을 사카라고 부르며 몇 갈래로 가른다. 뾰족한 모자를 쓴 사카(티그라카우다)는 호라즘 둘레와 아무다리야·시르다리야 사이의 키질쿰, 아랄해 둘레에 살았고 그리스 사람들이 마사게타이라 부른 집단과 같은 사람들로 보는 학자가 있다. 하오마를 만드는 사카(하우마바르가)는 파미르와 페르가나 골짜기 쪽에 있었다. 이들은 말을 타고 활을 쏘는 기병이었으며, 조상의 무덤 위에 쿠르간이라 부르는 흙무덤을 쌓았다. 카자흐스탄 알마티 근처 이식 쿠르간에서는 기원전 400~200년 무렵의 황금 갑옷 입은 젊은 무덤 주인이 나와 황금을 다루는 솜씨와 동물 무늬를 보여 준다. 알타이 우코크 고원의 파지리크 무덤들에서는 얼어붙은 덕에 양탄자와 문신한 시신이 남아 있다. 이들은 서쪽 흑해 북쪽의 스키타이 왕국과 문화가 닮은 동물 양식을 쓰는 같은 초원 세계에 속했다. 한편 이 초원 세계는 아케메네스 제국과 이어져 있었다. 사카 기병은 제국 군대의 기마 궁수 부대를 맡았고, 페르세폴리스 아파다나 계단에는 사카의 조공 행렬이 새겨져 있다. 키루스 2세의 동방 원정과 다리우스 1세의 원정은 「키루스 2세의 동방 원정과 토미리스(기원전 545~530 무렵)」(뒤의 사건)·「다리우스 1세의 동부 지방 평정과 사카 원정(기원전 522~518 무렵)」(뒤의 사건)에서 다룬다. 이 유목민들은 글을 남기지 않아 남은 것은 무덤과 그리스·페르시아·한의 기록뿐이다. 사카 계통 집단은 알타이·몽골·신장·타림 분지까지 퍼져 있었다. 기원전 140~130년 무렵 월지에 밀린 사카가 시르다리야를 건너 박트리아로 들어왔고, 일부는 파미르와 카슈미르로, 일부는 타림 분지의 오아시스로 옮겨 갔으며, 기원전 100년 무렵 시스탄에 자리 잡았다고 한다."
  subjects: [scythian-kingdom, achaemenid-empire]
  tags: [society, culture]
  sources: ["Herodotos, Historiai (Loeb Classical Library, 1920~1925)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Eisenbrauns, 2002)", "Christoph Baumer, The History of Central Asia, vol. 1: The Age of the Steppe Warriors (I. B. Tauris, 2012)", "Karl Jettmar, Art of the Steppes (Crown, 1967)"]

- id: cyrus-eastern-campaigns-545bc
  year: -544
  endYear: -529
  title:
    ko: "키루스 2세의 동방 원정과 토미리스(기원전 545~530 무렵)"
  summary:
    ko: "메디아를 무너뜨리고 아케메네스 제국을 세운 키루스 2세(재위 기원전 559~530 무렵)는 메디아가 거느리던 동쪽 땅의 반란을 누르려 기원전 540년대에 박트리아와 초원의 사카 쪽으로 군대를 보냈고, 오아시스 가장자리에 요새 도시를 세웠다고 전한다. 그러나 이 원정의 해와 경로는 후대 그리스 저술에 기댄 것이라 불확실하다. 마지막 원정은 마사게타이(사카의 한 갈래)에 맞선 것이다. 헤로도토스에 따르면 키루스 2세는 마사게타이의 여왕 토미리스에게 청혼했다가 거절당하자 아락세스강(시르다리야 또는 아무다리야로 본다) 건너로 군대를 몰았다. 키루스 2세는 술과 음식을 가득 두고 물러나는 계략으로 마사게타이 군의 3분의 1을 쓰러뜨리고 토미리스의 아들 스파르가피세스를 사로잡았다. 스파르가피세스는 술이 깨자 풀어 달라 청한 뒤 스스로 목숨을 끊었고, 토미리스는 다시 싸워 키루스 2세를 죽인 뒤 그 머리를 피가 가득 든 가죽 부대에 넣었다고 한다. 이 죽음의 이야기는 갈린다. 크테시아스는 키루스 2세가 데르비케스 사람들과 싸우다 상처를 입고 사흘 뒤 숨졌다고 적었다. 어느 쪽이든 죽음은 기원전 530년 무렵이며, 키루스 2세가 죽은 뒤 작은아들 바르디야가 중앙아시아의 큰 땅을 받았다고 한다. 제국의 성립은 「키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)」(앞의 사건)에서 다룬다. 헤로도토스는 키루스 2세가 리디아의 옛 왕 크로이소스의 충고를 받아 강을 건넜다고 하고, 토미리스는 그 머리에 대고 피를 실컷 마시라고 말했다고 전한다. 크테시아스는 아미르기아 왕 아모르게스가 페르시아 쪽을 도와 이겼다고 적었다."
  subjects: [achaemenid-empire]
  tags: [war, politics]
  sources: ["Herodotos, Historiai, 1권 201~214 (Loeb Classical Library, 1920)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Eisenbrauns, 2002)", "Maria Brosius, The Persians: An Introduction (Routledge, 2006)", "Christoph Baumer, The History of Central Asia, vol. 1: The Age of the Steppe Warriors (I. B. Tauris, 2012)", "Lloyd Llewellyn-Jones and James Robson, Ctesias' History of Persia: Tales of the Orient (Routledge, 2010)"]

- id: darius-eastern-satrapies-522bc
  year: -521
  endYear: -517
  title:
    ko: "다리우스 1세의 동부 지방 평정과 사카 원정(기원전 522~518 무렵)"
  summary:
    ko: "기원전 522년 캄비세스 2세가 죽은 뒤 제위를 두고 다툼이 일자 다리우스 1세는 여러 지방의 반란과 싸워 기원전 521년 12월 무렵까지 마무리했다. 그가 베히스툰 바위에 새긴 비문은 반란을 누른 일을 적고, 다스리는 나라 가운데 박트리아·소그디아나·호라즘·아리아(헤라트 일대)·드랑기아나(시스탄)·아라코시아(칸다하르 일대)·간다라·사카를 꼽는다. 그 가운데 마르기아나에서는 프라다라는 사람이 마르기아나의 왕이라 자처하며 일어났다가 진압되었다. 제국은 이 동쪽 땅을 태수령(사트라피)으로 나누어 태수를 보냈고, 박트리아는 그 가운데 가장 중요한 곳이었다. 다리우스 1세는 기원전 520~518년 무렵 사카를 쳐서 그 임금 스쿤하를 사로잡았고, 베히스툰 비문 옆에는 스쿤하가 묶여 끌려오는 모습이 뒤늦게 새겨졌다. 다리우스 1세는 스쿤하 대신 제국에 충성하는 사람을 세웠다고 한다. 사카 가운데 한 갈래는 이후 제국 군대에 기마 궁수를 대었다. 페르세폴리스의 아파다나 계단에는 박트리아·소그디아나·호라즘·아리아·사카 같은 동쪽 땅 사절이 공물을 들고 줄지은 모습이 새겨져 있다. 간다라와 힌두시 지배는 「아케메네스의 간다라와 힌두시 지배(기원전 518~330)」(뒤의 사건)에서 다룬다. 아케메네스 동부의 지방 행정과 정확한 경계는 학자마다 다르다. 비문은 고대 페르시아어·엘람어·바빌로니아어 세 말로 새겼고, 다리우스 1세는 한 해 동안 열아홉 번 싸웠다고 적는다. 베히스툰이 적은 나라는 모두 스물세 곳이다. 부조에는 다리우스 1세가 거짓 왕이라 불린 인물을 밟고 서고 아홉 반란 지도자가 줄줄이 묶여 끌려오며, 위에 아후라 마즈다의 상징이 떠 있는 모습이 새겨졌다. 이 부조는 비문 가운데 가장 널리 알려진 장면이다."
  subjects: [achaemenid-empire]
  tags: [war, politics]
  sources: ["Rüdiger Schmitt, The Bisitun Inscriptions of Darius the Great: Old Persian Text (School of Oriental and African Studies, 1991)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Eisenbrauns, 2002)", "Maria Brosius, The Persians: An Introduction (Routledge, 2006)"]

- id: khwarazm-independence-336bc
  year: -335
  endYear: -327
  title:
    ko: "호라즘 왕국의 자립과 알렉산드로스와의 접촉(기원전 336~328 무렵)"
  summary:
    ko: "호라즘은 다리우스 1세 때 아케메네스 제국에 들어와 비문에 후바라즈미시(우바라즈미야)라는 이름으로 오른다. 호라즘 병사는 크세르크세스 1세의 그리스 원정군에 들어갔다고 전한다. 그러나 다리우스 3세(재위 기원전 336~330) 무렵에는 호라즘이 제국에서 떨어져 나와 독립 왕국으로 있었다고 본다. 따라서 기원전 336년 무렵부터를 호라즘 왕국의 시작으로 보지만, 자립이 정확히 언제 일어났는지는 사료가 없어 정할 수 없다. 기원전 328년 호라즘의 왕이 박트리아 지방에서 마케도니아 왕국의 알렉산드로스에게 사절을 보내 우호를 청했다고 하며, 아리아노스는 그 왕을 파라스마네스라 적고 1,500기의 기병을 이끌고 왔다고 전한다. 파라스마네스는 알렉산드로스가 흑해 쪽으로 정복하려 한다면 길 안내를 하겠다고 했으나, 알렉산드로스는 우선 인도를 정복하겠다며 거절했다고 한다. 알렉산드로스는 호라즘을 직접 다스리지 않았고, 이후에도 호라즘은 셀레우코스·그리스-박트리아·파르티아 시대에 걸쳐 대체로 독립을 지켰다. 아무다리야 하류의 호라즘 오아시스에는 코이 크릴간 칼라·아야즈 칼라 같은 요새와 신전이 기원전 4~3세기부터 서 있었고 그 수가 많아 '쉰 개의 요새 오아시스'라 불렸다. 훗날 호라즘의 화폐는 에우크라티데스 1세의 주화를 본뜬 것에서 출발해 1세기 무렵부터는 독자적인 꼴로 바뀐다. 알렉산드로스의 원정은 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」(뒤의 사건)에서 다룬다. 호라즘 사람은 동이란어 계통인 호라즘어를 썼고, 기원후 2세기 무렵 파흘라비 문자에서 따온 첫 고유 문자가 생겼다고 본다. 뒤에 알비루니는 호라즘의 아프리그 왕조가 기원후 305년부터 호라즘샤였다고 적었다."
  subjects: [khwarazm-kingdom, achaemenid-empire, macedonia-kingdom]
  tags: [politics, diplomacy]
  sources: ["Arrianos, Anabasis Alexandrou, 4권 15장 (Loeb Classical Library, 1983)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Eisenbrauns, 2002)", "Elton L. Daniel, The History of Iran, 2nd ed. (Greenwood, 2012)", "Christoph Baumer, The History of Central Asia, vol. 1: The Age of the Steppe Warriors (I. B. Tauris, 2012)"]

- id: alexander-bactria-sogdiana-329bc
  year: -328
  endYear: -326
  title:
    ko: "알렉산드로스의 박트리아·소그디아나 정복과 록사네(기원전 329~327)"
  summary:
    ko: "가우가멜라에서 이긴 알렉산드로스는 페르세폴리스를 지나 동쪽으로 달려 기원전 329년 힌두쿠시를 넘어 박트리아에 들어섰다. 다리우스 3세를 죽이고 스스로 왕이라 일컬은 박트리아 태수 베소스는 소그디아나로 달아났으나 스피타메네스 등 소그디아나 귀족이 그를 붙잡아 넘겼다고 한다. 알렉산드로스는 마라칸다(사마르칸트)를 거쳐 시르다리야 가에 알렉산드리아 에스카테('가장 먼 알렉산드리아', 지금의 호젠트 근처)를 세웠다. 그 사이 스피타메네스가 소그디아나를 들쑤셔 마라칸다의 마케도니아 수비대를 에워쌌고, 알렉산드로스가 보낸 구원군은 자라프샨 강가에서 큰 피해를 입었다. 알렉산드로스는 소그디아나 마을들을 불태우는 가혹한 진압으로 맞섰고, 스피타메네스는 기원전 328년 겨울 가바이 싸움에서 장군 코이노스에게 졌다가 유목민 손에 죽어 머리가 알렉산드로스에게 보내졌다. 알렉산드로스는 기원전 327년 초봄 소그디아나 바위산 요새를 쳐서 박트리아 귀족 옥시아르테스의 가족을 붙잡았고, 그 딸 록사네와 결혼했다. 현지 귀족과 맺는 이 결혼은 정복한 땅을 다스리려는 정책이었다. 이로써 아케메네스 제국의 동쪽이 알렉산드로스 아래 들어갔고, 정복 뒤에도 박트리아와 소그디아나에 정착한 그리스·마케도니아 병사들이 불만을 품었다고 전한다. 알렉산드로스는 같은 해(기원전 327년) 여름 인도로 떠났다. 앞의 일은 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」(앞의 사건)과 이어지며 그 뒤 박트리아의 일은 셀레우코스 왕조 시대로 넘어간다. 알렉산드로스가 마라칸다의 술자리에서 친구 클레이토스를 죽인 일도 기원전 328년의 일이다. 소그디아나 쪽으로 보낸 파르누케스의 군대는 보병 2천 명 이상과 기병 300명 이상을 잃고 무너졌고, 스피타메네스는 박트리아를 쳤으나 태수 아르타바조스 2세에게 막혔다. 스피타메네스의 딸 아파마는 기원전 324년 셀레우코스 1세와 혼인했다."
  subjects: [macedonia-kingdom, achaemenid-empire]
  tags: [war, politics]
  sources: ["Arrianos, Anabasis Alexandrou, 3~4권 (Loeb Classical Library, 1983)", "Frank L. Holt, Into the Land of Bones: Alexander the Great in Afghanistan (University of California Press, 2005)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Eisenbrauns, 2002)", "Waldemar Heckel, The Conquests of Alexander the Great (Cambridge University Press, 2008)"]

- id: seleucid-east-bactria-304bc
  year: -303
  endYear: -250
  title:
    ko: "셀레우코스 왕국의 동방 총독령과 박트리아·소그디아나(기원전 304~251 무렵)"
  summary:
    ko: "알렉산드로스가 죽은 뒤 디아도코이 전쟁을 거치며 동쪽을 차지한 셀레우코스 1세는 기원전 305~303년 무렵 인도로 들어가 찬드라굽타와 맞섰다. 기원전 303년 무렵 조약으로 아라코시아·게드로시아·파로파미사다이 일부를 마우리아 제국에 내주고 전투 코끼리 약 500마리를 받았다는 이야기가 전한다. 이 조약과 메가스테네스의 사행은 「찬드라굽타와 셀레우코스 1세의 조약, 메가스테네스의 사행(기원전 305~302년 무렵)」(앞의 사건)에서 다룬다. 그 뒤 셀레우코스 제국의 동방은 이렇게 이어졌다. 셀레우코스 1세는 소그디아나 귀족 스피타메네스의 딸 아파마와 맺은 혼인으로 동방 귀족과 인연을 맺었다. 아들 안티오코스 1세는 기원전 292년 공동왕이 되어 동쪽 지방의 총독 구실을 맡았다. 셀레우코스 왕국은 박트리아와 소그디아나에 그리스풍 도시와 요새를 세웠고, 그리스·마케도니아 이주민과 병사를 정착시켰고, 안티오코스 1세는 마르기아나 오아시스의 도시를 성벽으로 두르고 안티오키아라는 이름을 붙였다고 전한다. 이런 정책의 결과 박트리아에는 그리스계 지배층과 도시 문화가 자리 잡았다. 그러나 셀레우코스 왕국은 서쪽의 이집트 프톨레마이오스 왕국과의 시리아 전쟁에 힘을 쏟느라 동쪽에는 소홀했다. 다만 이 동방 지배가 어떻게 이루어졌는지는 직접 전하는 기록이 적어 화폐와 고고학 발굴에 기대는 부분이 크다. 셀레우코스 1세의 즉위와 제국의 성립은 「셀레우코스 1세와 제국의 성립: 바빌론 회복(기원전 312)·셀레우키아·찬드라굽타와의 조약(기원전 303 무렵)·안티오키아(기원전 300 무렵)」(앞의 사건)에서 다룬다. 아피아노스가 적은 셀레우코스 1세의 영토 목록에는 박트리아와 소그디아나가 들어 있고, 일부 학자는 아파마가 이를 다스리는 데 도움을 주었으리라 본다."
  subjects: [seleucid-empire, maurya-empire]
  links:
    - { from: maurya-empire, to: seleucid-empire, note: "조약으로 아라코시아 등 동부 땅 확보 (기원전 303 무렵)" }
  tags: [politics, diplomacy]
  sources: ["Getzel M. Cohen, The Hellenistic Settlements in the East from Armenia and Mesopotamia to Bactria and India (University of California Press, 2013)", "Sherwin-White and Kuhrt, From Samarkhand to Sardis: A New Approach to the Seleucid Empire (University of California Press, 1993)", "Frank L. Holt, Thundering Zeus: The Making of Hellenistic Bactria (University of California Press, 1999)"]

- id: ai-khanoum-300bc
  year: -299
  endYear: -144
  title:
    ko: "아이하눔: 아무다리야 가의 그리스 도시와 헬레니즘 문화(기원전 300 무렵~145 무렵)"
  summary:
    ko: "아프가니스탄 북동부 타하르주의 아이하눔은 아무다리야와 그 지류 코크차강이 만나는 곳에 선 헬레니즘 도시다. 1961년에 발견되어 1964년부터 1978년까지 프랑스 아프가니스탄 고고학 사절단이 다니엘 슐럼버제와 폴 베르나르의 지휘 아래 발굴했고, 소련의 아프가니스탄 침공 직전에 중단되었으며 뒤에 심하게 도굴되었다. 도시는 기원전 300~285년 무렵 셀레우코스 1세나 안티오코스 1세를 대신한 관리가 세운 것으로 보며, 한때는 알렉산드로스가 세운 알렉산드리아로 여겼으나 지금은 의심한다. 넓은 궁전과 김나시온(체육관), 5천~6천 석쯤 되는 극장, 무기고, 키네아스의 사당(헤로온)과 보물 창고 같은 건물이 나왔다. 키네아스의 사당 터에서는 델포이의 격언을 새긴 비석과 클레아르코스의 시가 나왔고, 플라톤의 이데아론을 다룬 철학 글이 적힌 파피루스 조각도 나왔는데 아리스토텔레스의 잃어버린 글일 수 있다고 본다. 건물에는 그리스식 기둥머리와 함께 동방식 구조가 섞여 있어, 그리스 이주민이 현지 전통과 만나 만든 문화를 보여 준다. 기원전 145년 무렵 그리스-박트리아 왕국이 흔들리자 도시는 사카 유목민의 습격으로 불타 버렸고, '통치 24년'이 새겨진 항아리와 보물 창고의 명문이 에우크라티데스 1세 때를 가리켜 연대의 단서가 된다. 기원전 130년 무렵 또 한 차례 침입이 있었다고 본다. 박트리아의 그리스 문화가 어떻게 이어졌는지는 이 발굴로 처음 구체적으로 알려졌지만, 도시의 옛 이름과 설립자는 아직 확정되지 않았다. 클레아르코스가 소로이의 철학자 클레아르코스라는 루이 로베르의 주장은 뒤에 받아들여지지 않았다. 일부 학자는 도시의 원래 이름이 오스코바라였을 수 있다고 본다."
  subjects: [greco-bactrian-kingdom, seleucid-empire]
  tags: [culture, society]
  sources: ["Paul Bernard, Fouilles d'Aï Khanoum, 1~8 (Mémoires de la Délégation archéologique française en Afghanistan, 1973~2010)", "Frank L. Holt, Thundering Zeus: The Making of Hellenistic Bactria (University of California Press, 1999)", "Rachel Mairs, The Hellenistic Far East: Archaeology, Language, and Identity in Greek Central Asia (University of California Press, 2014)"]

- id: diodotus-greco-bactria-250bc
  year: -249
  endYear: -229
  title:
    ko: "디오도토스의 독립과 그리스-박트리아 왕국의 성립(기원전 250 무렵~230 무렵)"
  summary:
    ko: "셀레우코스 왕국의 박트리아 총독 디오도토스가 독립 군주로 나선 해는 높은 연표로 기원전 255년 무렵, 낮은 연표로 기원전 246~245년 무렵이다. 이 책은 두 설의 가운데인 기원전 250년 무렵을 따른다. 시리아 전쟁으로 셀레우코스 안티오코스 2세가 서쪽에 묶인 틈을 탄 것으로 본다. 디오도토스 1세는 자기 이름이 든 화폐를 찍고 제우스가 번개를 던지는 모습을 새겼다. 아들 디오도토스 2세는 파르티아를 일으킨 아르사케스 1세와 동맹을 맺어 셀레우코스 군에 맞섰다고 하며, 파르티아의 일은 「아르사케스 1세와 파르티아의 성립(기원전 247~228)」(뒤의 사건)에서 다룬다. 두 디오도토스의 재위는 디오도토스 1세가 기원전 255~235년 무렵이라는 설이 널리 알려져 있으나, 2세의 재위 연대는 알려진 바가 없다. 디오도토스 2세는 에우티데모스에게 자리를 빼앗겼다고 한다. 이 사건 이후 박트리아는 그리스계 왕들이 이끌며 인도와 소그디아나 쪽으로 힘을 뻗는다. 디오도토스 일가의 지배는 박트리아와 소그디아나에 더해 마르기아나·아리아(헤라트 일대)까지 미쳤다고 보나 해는 분명치 않다. 이 왕국을 흔히 그리스-박트리아 왕국이라 부르지만 당시 사람들이 그렇게 불렀는지는 알 수 없다. 같은 무렵 이란 고원 동북쪽에서는 파르티아도 셀레우코스 왕국에서 떨어져 나갔다. 높은 연표와 낮은 연표로 갈리는 것은 화폐의 양식과 후대 기록의 연대를 잇는 방식이 학자마다 다르기 때문이다. 박트리아가 셀레우코스 왕국에서 떨어져 나간 뒤에도 그리스인 이주민과 병사는 셀레우코스 시대의 도시와 요새에 머물며 그리스어를 공식 문자로 썼고, 그 아래 박트리아의 현지 귀족과 농민이 함께 살았다."
  subjects: [greco-bactrian-kingdom, seleucid-empire, parthian-empire]
  links:
    - { from: greco-bactrian-kingdom, to: seleucid-empire, note: "박트리아의 독립 (기원전 250 무렵)" }
  tags: [politics, war]
  sources: ["Frank L. Holt, Thundering Zeus: The Making of Hellenistic Bactria (University of California Press, 1999)", "William W. Tarn, The Greeks in Bactria and India, 2nd ed. (Cambridge University Press, 1951)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques (Bibliothèque nationale, 1991)"]

- id: euthydemus-antiochus-iii-230bc
  year: -229
  endYear: -205
  title:
    ko: "에우티데모스 1세와 안티오코스 3세의 박트리아 원정(기원전 230 무렵~206 무렵)"
  summary:
    ko: "에우티데모스 1세는 마그네시아 출신 그리스인으로, 소그디아나의 태수였다가 디오도토스 2세를 몰아내고 박트리아의 왕이 되었다고 본다. 그의 즉위는 기원전 230년 무렵으로 보기도 하고 기원전 224년이라는 기록도 있다. 그는 어느 왕보다 많은 금·은·동화를 찍었고, 소그디아나로 땅을 넓히며 요새를 지었다. 기원전 208년 무렵 셀레우코스의 안티오코스 3세가 잃은 동쪽을 되찾으러 박트리아로 쳐들어왔다. 에우티데모스 1세는 아리우스강(헤리루드)에서 약 1만 기병을 이끌고도 졌으나 수도 박트라에서 세 해 가까이 포위를 견뎠다. 폴리비오스는 에우티데모스 1세가 유목민의 침입에 맞서 그리스 문명을 지킨다는 논리로 안티오코스 3세와 화해했다고 적었다. 기원전 206년 무렵의 강화로 에우티데모스 1세는 왕의 칭호를 인정받았고, 안티오코스 3세에게 전투 코끼리를 주었으며, 아들 데메트리오스 1세에게 셀레우코스 공주를 주겠다는 약속을 받았다고 전한다. 안티오코스 3세는 이어 힌두쿠시를 넘어 인도 쪽으로 갔다. 에우티데모스 1세는 기원전 200~195년 무렵 죽었고, 아들 데메트리오스 1세가 뒤를 이었다. 안티오코스 3세의 전체 원정은 「안티오코스 3세의 제국 재건(기원전 223~195): 몰론과 아카이오스의 반란, 라피아와 파니온, 아르메니아」(뒤의 사건)에서 다루며, 데메트리오스 1세의 인도 원정은 「데메트리오스 1세와 인도-그리스 왕국의 시작(기원전 200~180년 무렵)」(뒤의 사건)에서 다룬다. 이 시기 연대는 책마다 몇 해씩 다르다. 그는 소그디아나 서쪽 철문(데르벤트)의 협곡에도 성벽을 쌓았다고 하나 그 방향과 쓰임을 두고 논쟁이 있다. 에우티데모스 1세의 화폐에는 네 가지 초상이 나온다."
  subjects: [greco-bactrian-kingdom, seleucid-empire]
  links:
    - { from: seleucid-empire, to: greco-bactrian-kingdom, note: "안티오코스 3세의 박트리아 포위와 강화 (기원전 208~206 무렵)" }
  tags: [war, diplomacy]
  sources: ["Polybios, Historiai, 10권 49장 (Loeb Classical Library, 2011)", "Frank L. Holt, Thundering Zeus: The Making of Hellenistic Bactria (University of California Press, 1999)", "William W. Tarn, The Greeks in Bactria and India, 2nd ed. (Cambridge University Press, 1951)"]

- id: tarim-khotan-oasis-states-223bc
  year: -223
  endYear: -106
  title:
    ko: "타림 분지의 오아시스 나라들과 호탄의 시작, 흉노의 지배와 한의 진출(기원전 3세기~107)"
  summary:
    ko: "타림 분지의 가장자리에는 눈 녹은 물이 모이는 곳마다 선선(누란)·쿠차·카슈가르·호탄 같은 오아시스 도시 나라들이 자라, 남쪽의 호탄에서는 곤륜산의 옥이, 북쪽 길에서는 구리와 곡식이 오갔다. 중국에서 서쪽으로 가는 비단길의 앞 모습이 이 도시 사이 길이다. 호탄(우전) 왕국은 기원전 3세기 무렵 마우리아의 아소카 왕 아들과 신하들이 이끈 이주민이 세웠다는 전설이 있으나, 이를 후대에 인도와 중국 영향을 설명하려고 만든 이야기로 보는 학자도 있다. 호탄의 시작은 기원전 300년 무렵이라거나 기원전 224년이라는 기록이 있어 해가 정해지지 않는다. 호탄 사람의 말은 동이란어 계통의 호탄 사카어였고, 한서는 호탄이 3,300호 1만 9천여 명에 군사 2,400명이라고 적는다. 『한서』는 서역의 나라를 처음 서른여섯 나라로 적는다. 기원전 3세기 말부터 힘을 키운 흉노는 기원전 176년 무렵 묵돌 선우가 한 문제에게 보낸 편지에서 월지를 쳐부수고 누란·오손·호게(呼揭)와 그 이웃 스물여섯 나라를 평정했다고 자랑했다. 그 일은 「묵돌 선우의 흉노 제국: 좌우 현왕 체제와 월지의 서쪽 이동(기원전 209~161)」(뒤의 사건)에서 다룬다. 이에 맞서 한 무제는 장건 이후 서역 길을 열고자 했고, 기원전 108년 무렵 장군 조파노가 누란을 치고 차사 쪽으로 군대를 보냈다고 한다. 차사국은 투루판 분지의 오아시스 나라로 흉노와 한이 오랫동안 다투는 자리가 된다. 이 시기의 사료는 한서와 사기뿐이라 나라 숫자와 위치에는 학설이 갈린다. 곤륜산의 옥은 상나라 무덤에서도 나올 만큼 오래 거래되었고, 『관자』는 월지가 옥을 댔다고 적는다. 호탄에 불교가 들어온 때는 기원전 84년 무렵이라는 연표도 있고 기원후 2세기 중엽이라는 학설도 있다."
  subjects: [khotan-kingdom, tarim-oasis-states, jushi-kingdom, xiongnu, western-han]
  tags: [society, politics]
  sources: ["Ban Gu, Hanshu 96권 「서역전」 (Hulsewé and Loewe, China in Central Asia: The Early Stage, Brill, 1979)", "Sima Qian, Records of the Grand Historian: Han Dynasty II, trans. Burton Watson (Columbia University Press, 1993)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Christoph Baumer, The History of Central Asia, vol. 2: The Age of the Silk Roads (I. B. Tauris, 2014)"]

- id: yuezhi-westward-175bc
  year: -175
  endYear: -125
  title:
    ko: "월지의 서진과 오손·사카, 장건의 방문(기원전 176~126 무렵)"
  summary:
    ko: "간쑤 서쪽의 월지는 타림 분지의 옥을 중국에 넘기는 일로 이름이 났으나 흉노가 힘을 키우며 기원전 176년 무렵 크게 졌다. 월지의 왕이 죽고 왕비가 자리를 이었다고 하며, 기원전 176년 무렵 묵돌 선우가 한 문제에게 보낸 편지는 월지를 쳐부수었다고 자랑한다. 이 흉노의 팽창은 「묵돌 선우의 흉노 제국: 좌우 현왕 체제와 월지의 서쪽 이동(기원전 209~161)」(앞의 사건)에서 다룬다. 큰 월지는 기원전 173년 무렵 오손을 쳐서 그 왕 난두미를 죽였고, 오손은 어린 렵교미를 흉노의 도움으로 키웠다. 월지는 기원전 160년대 일리 골짜기로 옮겨 그곳의 사카 유목민을 남쪽으로 밀어냈다. 기원전 132년 무렵 흉노와 손잡은 오손의 곤막 렵교미가 월지를 일리에서 몰아냈고, 월지는 페르가나(대완)를 지나 서남쪽으로 옮겨 아무다리야 북쪽, 곧 박트리아 북부에 자리 잡았다. 한 무제가 월지와 손잡아 흉노를 누르려고 보낸 장건은 기원전 139년 무렵 출발해 흉노에 10여 년 붙잡혔다가 탈출해 대완과 강거를 거쳐 월지에 닿았다. 월지는 이미 평화로운 삶에 만족해 동맹 제안을 받아들이지 않았고, 장건은 기원전 126년 무렵(125년으로 보기도 한다) 돌아왔다. 그가 전한 월지는 활 쏘는 군사 10만~20만을 거느렸고, 이웃은 대하(박트리아)·안식(파르티아)·강거였다. 이 사행은 「장건의 서역 사행(기원전 139~126)과 비단길」(뒤의 사건)에서 다룬다. 월지의 서진은 박트리아의 그리스 왕조를 무너뜨리는 일로 이어졌으며, 월지는 『한서』가 적은 대로 휴밀·귀상·쌍미·힐돈·도밀의 다섯 흡후로 갈라졌다가 훗날 쿠샨으로 이어진다. 오손·월지의 옛 위치와 이주 연대에는 학설이 갈린다. 오손의 렵교미는 어릴 때 늑대와 까마귀가 돌보았다는 이야기가 있고 흉노 선우가 거두어 키웠다고 한다. 월지의 한 갈래인 작은 월지는 남쪽 치롄산맥의 강족 곁으로 갔다."
  subjects: [yuezhi, wusun, xiongnu, western-han, ferghana-kingdom, kangju]
  tags: [society, politics]
  sources: ["Sima Qian, Records of the Grand Historian: Han Dynasty II, trans. Burton Watson (Columbia University Press, 1993)", "Craig G. R. Benjamin, The Yuezhi: Origin, Migration and the Conquest of Northern Bactria (Brepols, 2007)", "Ban Gu, Hanshu 96권 「서역전」 (Hulsewé and Loewe, China in Central Asia: The Early Stage, Brill, 1979)", "Christoph Baumer, The History of Central Asia, vol. 1: The Age of the Steppe Warriors (I. B. Tauris, 2012)"]

- id: greco-bactria-end-170bc
  year: -170
  endYear: -128
  title:
    ko: "에우크라티데스 1세와 그리스-박트리아의 끝(기원전 171~129 무렵)"
  summary:
    ko: "에우티데모스 1세의 뒤를 이은 데메트리오스 1세는 기원전 200~180년 무렵 인도 북서부로 진출했다. 그 뒤 에우티데모스 2세·아가토클레스·판탈레온이 기원전 190~180년 무렵, 안티마코스가 기원전 185~170년 무렵 박트리아와 인도 쪽을 나누어 다스렸다고 하며 화폐로만 이름이 알려진다. 에우크라티데스 1세는 기원전 171년 무렵 안티마코스를 몰아내고 박트리아를 차지하여 기원전 145년 무렵까지 다스렸고, 그 아들에게 죽었다고 전한다. 기원전 145년 무렵 아이하눔은 사카 유목민 침입으로 불탔고, 기원전 140~130년 무렵 사카가 시르다리야를 건너 박트리아로 들어왔다. 뒤이어 일리에서 쫓겨난 월지가 기원전 130년 무렵 아무다리야 북쪽 박트리아에 자리 잡았다. 장건은 기원전 128년 무렵 박트리아를 찾아 도시는 많으나 큰 임금이 없고 작은 우두머리들이 다스리며 장사에 밝다고 적었다. 그의 아들 에우크라티데스 2세와 헬리오클레스 1세가 기원전 145~130년 무렵 뒤를 이었다고 보며, 박트리아의 마지막 그리스 왕은 헬리오클레스 1세로서 그는 월지에게 박트리아를 잃었다. 헬리오클레스 1세의 재위는 기원전 145~130년 무렵으로 보지만 145~120년으로 보는 계산도 있다. 그리스 왕조의 박트리아 지배는 기원전 130년 무렵을 끝으로 보는 견해가 널리 받아들여진다. 그 뒤 인도 쪽의 그리스 왕조, 곧 인도-그리스 왕국은 「데메트리오스 1세와 인도-그리스 왕국의 시작(기원전 200~180년 무렵)」(앞의 사건)에서 이어지고 사카는 「사카의 남하와 인도-스키타이 왕국의 성립(기원전 85~55년 무렵)」(뒤의 사건)에서 이어진다."
  subjects: [greco-bactrian-kingdom, indo-greek-kingdom, yuezhi]
  tags: [politics, war]
  sources: ["Frank L. Holt, Thundering Zeus: The Making of Hellenistic Bactria (University of California Press, 1999)", "Osmund Bopearachchi, Monnaies gréco-bactriennes et indo-grecques (Bibliothèque nationale, 1991)", "Sima Qian, 『사기』 「대완열전」(장건의 보고)", "Craig G. R. Benjamin, The Yuezhi: Origin, Migration and the Conquest of Northern Bactria (Brepols, 2007)"]

- id: dayuan-li-guangli-104bc
  year: -103
  endYear: -100
  title:
    ko: "한 무제의 대완 원정(기원전 104~101)"
  summary:
    ko: "장건이 전한 페르가나(대완)의 이른바 '피땀 흘리는 말'(한혈마)을 얻으려 한 무제는 대완에 사신과 금을 보냈으나, 대완은 말을 내주지 않았고 사신을 죽였다. 한 무제는 이사장군 이광리를 보내 기원전 104년 가을 기병 6천과 보병 수만을 이끌고 원정에 나서게 했다. 이광리는 오아시스 나라들이 식량을 대 주지 않아 굶주렸고 욱성 싸움에서 크게 져서 둔황으로 되돌아갔다. 두 번째 원정은 기원전 102년 가을 보병 6만과 말 3만을 비롯한 큰 군대였다. 한군은 도중의 윤대가 항복하지 않자 성을 에워싸 무너뜨리고 주민을 죽였다고 『사기』는 적으며, 욱성을 지나 대완의 도읍 귀산성을 에워싸 40일 동안 물길을 끊었다. 대완의 귀족들은 왕 무과를 죽이고 좋은 말 3천 필가량을 바치며 항복했고, 이광리는 매채를 새 왕으로 세웠다. 오손은 2천 기병을 보냈으나 싸움에 끼지 않았다는 기록이 있고, 강거는 대완을 도우려는 뜻이 있었으나 욱성 임금을 한군에 넘겼다고 한다. 이광리는 겨우 1만 명가량과 말 1천 필가량을 이끌고 돌아왔으며, 지나친 희생과 군수 부패가 지적된다. 대완에서는 매채가 한 해 남짓 뒤 귀족에게 죽고 무과의 아우 선봉이 왕이 되어 아들을 한에 인질로 보냈다. 이 일로 한의 위세가 서역에 닿았으며, 뒤의 서역도호부 설치로 이어진다. 그 뒤 일은 「한과 오손의 흉노 협공(기원전 71)과 서역도호부 설치(기원전 60)」(뒤의 사건)에서 다룬다. 이광리는 훗날 흉노에 항복한다. 이 원정의 연대는 사기와 한서가 몇 해씩 엇갈려 기원전 103~102년으로 적는 책도 있다. 장건이 전한 대완의 포도주와 알팔파는 이 시기를 전후해 한에 들어왔다고 한다. 원정으로 얻은 말과 대완 쪽 소식은 뒤에 서역 사행이 늘어나는 바탕이 되었다."
  subjects: [ferghana-kingdom, western-han, kangju, wusun, xiongnu]
  links:
    - { from: western-han, to: ferghana-kingdom, note: "이광리의 대완 원정 (기원전 104~101)" }
  tags: [war, politics]
  sources: ["Sima Qian, Records of the Grand Historian: Han Dynasty II, trans. Burton Watson (Columbia University Press, 1993)", "Ban Gu, Hanshu 61권 「이광리전」 (Hulsewé and Loewe, China in Central Asia: The Early Stage, Brill, 1979)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Christoph Baumer, The History of Central Asia, vol. 2: The Age of the Silk Roads (I. B. Tauris, 2014)"]

- id: yuezhi-bactria-101bc
  year: -100
  endYear: 30
  title:
    ko: "대월지의 박트리아와 다섯 흡후: 쿠샨이 서기까지(기원전 101~기원후 30 무렵)"
  summary:
    ko: "흉노 묵돌 선우에게 기원전 176년 무렵 꺾인 월지는 서쪽으로 옮겨 가다 오손에게 일리 골짜기에서도 밀려났고(「묵돌 선우의 흉노 제국: 좌우 현왕 체제와 월지의 서쪽 이동(기원전 209~161)」(앞의 사건)), 기원전 132~130년 무렵 아무다리야 북쪽의 박트리아에 자리 잡았다. 그리스인의 도시 알렉산드리아 옥소스(아이하눔)는 기원전 145년 무렵 불탔고 그리스-박트리아 왕국은 기원전 140~130년 무렵 유목민에게 무너졌다고 보는데(월지의 서진은 「월지의 서진과 오손·사카, 장건의 방문(기원전 176~126 무렵)」(앞의 사건), 왕국의 끝은 「에우크라티데스 1세와 그리스-박트리아의 끝(기원전 171~129 무렵)」(앞의 사건)), 스트라본은 아시오이·파시아노이·토하로이·사카라울로이가 박트리아를 빼앗았다고 적었고 이 가운데 토하로이를 월지와 이어 보는 견해가 많다. 기원전 129년 무렵 이곳에 이른 장건은 월지가 기름진 땅에 눌러앉아 흉노에게 복수할 마음이 없다고 보고했다(「장건의 서역 사행(기원전 139~126)과 비단길」(앞의 사건)). 『한서』 서역전은 대월지가 호수 10만, 인구 약 40만, 군사 10만이며 휴밀·쌍미·귀상·힐돈·도밀의 다섯 흡후(翕侯, 부족 우두머리)가 땅을 나누어 다스린다고 적었고. 남쪽 카불과 간다라에는 인도-그리스 왕국의 왕들이 아직 남아 있었으나 기원전 1세기 중엽 사카가 밀고 내려왔다(「사카의 남하와 인도-스키타이 왕국의 성립(기원전 85~55년 무렵)」(뒤의 사건)). 『후한서』는 그 뒤 약 한 세기가 지나 귀상 흡후 구취각(丘就卻, 쿠줄라 카드피세스)이 나머지 네 흡후를 쳐서 왕이 되었고, 나이 여든이 넘어 죽자 아들 염고진(閻膏珍, 비마 탁토)이 이었다고 적는다. 이것이 쿠샨 제국의 출발이며 그 뒤는 「쿠샨의 성립: 월지에서 쿠줄라 카드피세스까지(30~80년 무렵)」(뒤의 사건)로 이어진다. 1978년 아프가니스탄 북부 틸랴 테페에서 나온 무덤들의 금제 장신구는 기원전 1세기~기원후 1세기의 것으로, 월지나 초기 쿠샨 사람들의 것으로 본다. 오손과 강거 쪽은 「오손·강거·대완: 한의 혼인 동맹과 질지 선우의 죽음(기원전 101~36)」(같은 해의 사건)에, 호라즘 쪽은 「호라즘 왕국과 토프락칼라: 아프리그 왕조의 성립까지(기원전 101~기원후 305 무렵)」(같은 해의 사건)에 있다. 기원전 2년에 월지 사절이 불경을 구두로 전했다는 이야기는 「월지·강거·파르티아 출신 승려와 비단길의 불교(기원전 2~기원후 3세기 말)」(뒤의 사건)에서 다룬다."
  subjects: [yuezhi, kangju, indo-greek-kingdom, kushan-empire]
  tags: [politics, society]
  sources: ["班固, 『漢書』 西域傳 (大月氏條)", "范曄, 『後漢書』 西域傳 (貴霜條)", "Étienne de la Vaissière, 'The Steppe World and the Rise of the Huns' 및 Craig Benjamin, The Yuezhi: Origin, Migration and the Conquest of Northern Bactria (Brepols, 2007)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: wusun-kangju-dayuan-101bc
  year: -100
  endYear: -35
  title:
    ko: "오손·강거·대완: 한의 혼인 동맹과 질지 선우의 죽음(기원전 101~36)"
  summary:
    ko: "일리 골짜기와 이식쿨 호수 둘레의 오손은 『한서』에 호수 12만, 인구 63만, 군사 18만 8천으로 적힌 큰 유목 나라였고, 곤미(昆彌)라 부른 왕의 궁정은 이식쿨로 이어지는 골짜기의 적곡성(赤谷城)에 있었다. 기원전 105년 무렵(전하는 해는 학설에 따라 조금 다르다) 한은 공주 유세군을 곤미 렵교미에게 시집보냈고, 그 뒤 해우 공주가 잠추·옹귀미·니미 세 곤미를 차례로 남편으로 맞아 오손에서 50년 가까이 살다가 기원전 51년 한으로 돌아가 기원전 49년에 죽었다. 곤미는 렵교미에서 잠추를 거쳐 사촌 옹귀미로 이어졌고, 잠추의 아들 니미(광왕이라 불렸다)가 오취도에게 살해된 뒤에는 원귀미가 대곤미, 오취도가 소곤미가 되어 나라가 갈라졌다. 오아시스 나라들 쪽은 「타림 분지의 오아시스 나라들과 한: 도호부에서 서역장사까지(기원전 101~기원후 195 무렵)」(같은 해의 사건)에 있다. 한과 오손은 기원전 72~71년에 흉노를 함께 쳤다(「한과 오손의 흉노 협공(기원전 71)과 서역도호부 설치(기원전 60)」(뒤의 사건)). 시르다리야 중류의 강거는 『한서』에 인구 60만, 군사 12만으로 적혔고, 겨울 도성 비톈과 말을 달려 이레 걸리는 여름 본영을 오갔다. 장건의 보고는 강거가 남쪽의 월지에 복속한다고 했으나 한과의 관계는 이어졌다. 페르가나의 대완은 기원전 101년 한의 이사장군 이광리에게 포위되자 강거와 손잡고 버티다가, 귀족들이 왕을 죽이고 말을 바치자 한군이 물러났다(「한 무제의 대완 원정(기원전 104~101)」(앞의 사건)). 기원전 1세기 중엽 강거는 북쪽 흉노와 손잡고 오손을 압박하며 혼인으로 흉노 왕가와 이어졌는데, 서쪽으로 도망친 질지 선우가 강거에 몸을 붙였다가 기원전 36년 진탕과 감연수의 한군에게 탈라스에서 죽자 강거 왕은 아들을 한에 인질로 보냈다(「흉노의 분열과 호한야 선우의 입조(기원전 51), 질지 선우의 죽음(기원전 36)과 왕소군(기원전 33)」(뒤의 사건))."
  subjects: [wusun, kangju, ferghana-kingdom, western-han, xiongnu, yuezhi]
  tags: [politics, diplomacy]
  sources: ["班固, 『漢書』 西域傳·張騫李廣利傳", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Yu Taishan, A History of the Relationships between the Western and Eastern Han, Wei, Jin, Northern and Southern Dynasties and the Western Regions (Sino-Platonic Papers 131, 2004)"]

- id: western-regions-oases-101bc
  year: -100
  endYear: 195
  title:
    ko: "타림 분지의 오아시스 나라들과 한: 도호부에서 서역장사까지(기원전 101~기원후 195 무렵)"
  summary:
    ko: "타림 분지 둘레의 오아시스에는 처음 서른여섯 나라가 있었다고 『한서』는 적는다. 이 가운데 투루판 분지의 차사국(車師)은 앞뒤 두 나라로 갈려 한과 흉노 사이를 오갔고, 호탄(우전)은 옥을 파는 남쪽 길의 큰 나라였다(그 앞은 「타림 분지의 오아시스 나라들과 호탄의 시작, 흉노의 지배와 한의 진출(기원전 3세기~107)」(앞의 사건)). 한이 기원전 60년 무렵(59년이라는 글도 있다) 정길을 서역도호로 삼아 오루성에 부(府)를 둔 일은 「한과 오손의 흉노 협공(기원전 71)과 서역도호부 설치(기원전 60)」(뒤의 사건)에서 다룬다. 왕망의 신 때 서역 나라들은 한에서 떨어져 나가 도호부가 끊겼고, 마지막 도호는 23년 무렵 죽었다고 한다. 후한은 74년 진목을 도호로 세웠으나 곧 흔들렸고, 91년 반초가 도호가 되어 서역을 되찾았다(「반초의 서역 경영(73~102)과 감영의 사행(97)」(뒤의 사건)). 서역장사는 도호보다 낮은 직으로, 91년 도호가 된 반초가 서간을 처음 앉혔다고 한다. 84년 무렵 강거가 카슈가르 왕의 반란을 돕자 반초는 쿠샨(월지)의 도움으로 이를 물리쳤는데, 월지는 강거와 막 혼인을 맺은 터라 한이 선물을 보내 움직였다고 『후한서』는 적는다. 90년에는 쿠샨이 한 공주와의 혼인을 거절당하자 반초를 쳤다가 패했다. 호탄은 56년 무렵 야르칸드(사차)에 병합되었다가 맞서 일어나, 왕 휴막패와 광덕이 61년 무렵 야르칸드를 눌러 둘레 나라들에 힘을 미쳤고 광덕은 73년 한에 복속했다. 한은 107년 도호 단희가 죽고 강족이 일어나자 도호부를 거두었다가, 123~124년 반초의 아들 반용이 서역장사로서 다시 서역을 되찾았다. 이후 호탄은 한의 서역 관리와 부딪혀 2세기 중엽 왕이 죽는 일(151년 무렵 왕 건 — 연도는 글마다 갈린다)을 겪었으나, 한이 흔들린 2세기 말 한에서 벗어났다(195년 무렵). 1~2세기 호탄 주화에는 한자와 카로슈티 문자가 함께 새겨져 중국과 인도 두 문명 사이에 놓인 모습을 보여 준다."
  subjects: [tarim-oasis-states, khotan-kingdom, jushi-kingdom, western-han, eastern-han, kushan-empire, xiongnu]
  tags: [politics, society]
  sources: ["班固, 『漢書』 西域傳", "范曄, 『後漢書』 西域傳·班超傳", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Yu Taishan, A History of the Relationships between the Western and Eastern Han, Wei, Jin, Northern and Southern Dynasties and the Western Regions (Sino-Platonic Papers 131, 2004)"]

- id: khwarazm-toprak-kala-101bc
  year: -100
  endYear: 305
  title:
    ko: "호라즘 왕국과 토프락칼라: 아프리그 왕조의 성립까지(기원전 101~기원후 305 무렵)"
  summary:
    ko: "아무다리야 하류의 호라즘 오아시스는 기원전 4~3세기에 쌓은 코이 크릴간 칼라와 아야즈 칼라 같은 요새를 바탕으로(그 앞은 「호라즘 왕국의 자립과 알렉산드로스와의 접촉(기원전 336~328 무렵)」(앞의 사건)) 물길을 끌어 농사를 짓던 곳이다. 기원전 1세기 무렵부터 이곳 왕들은 그리스-박트리아·파르티아·인도-스키타이 주화를 본뜬 자기 주화를 찍기 시작했고, 칠피크에는 조로아스터교도가 죽은 사람을 놓아두던 침묵의 탑이 기원전 1세기~기원후 1세기에 지어졌다. 이웃 강거의 주화가 호라즘 주화와 닮았다는 점은 두 나라 사이의 가까운 관계를 보여 준다. 1~2세기에는 궁정 도시 토프락칼라가 서 있었고 왕 아르타브(아르타바노스)가 쿠샨 주화를 본뜬 주화를 찍었으며, 비마 카드피세스와 카니슈카의 주화가 함께 나오는 데서 호라즘이 쿠샨 문화권에 들어갔음을 짐작한다(「카니슈카와 쿠샨의 전성(127~150년 무렵)」(뒤의 사건)). 3세기 토프락칼라의 문서고에서는 아람 문자에서 나온 호라즘 문자로 쓴 문서가 나온다. 키질 칼라 같은 흙벽돌 요새는 1~4세기에 지어졌다. 조로아스터교도는 시신을 탑에 두어 뼈만 남으면 납골 용기에 담았는데, 이런 납골 용기 묘지는 6~8세기 토크 칼라에서 널리 나온다. 사산 제국은 3세기 초~중반에 호라즘에 영향을 미쳤다고 하나 직접 지배한 정도는 분명하지 않다. 비루니의 『고대 민족들의 연대기』는 305년을 아프리그 가문이 호라즘의 샤로 선 해로 적는다. 월지와 강거의 이야기는 「대월지의 박트리아와 다섯 흡후: 쿠샨이 서기까지(기원전 101~기원후 30 무렵)」(같은 해의 사건)에 있다. 이 아프리그 왕조는 995년 마문 왕조에게 무너질 때까지 이어졌고, 그 사이 쿠샨·에프탈·돌궐 같은 큰 세력의 영향권에 들면서도 샤라는 칭호를 이어 갔다고 한다. 호라즘 왕국이 아프리그 왕조로 이어진 때의 자세한 사정은 전하지 않는다."
  subjects: [khwarazm-kingdom, afrighid-dynasty, kangju, kushan-empire, sasanian-empire]
  tags: [politics, culture]
  sources: ["Abu Rayhan al-Biruni, The Chronology of Ancient Nations (C. Edward Sachau 영역, 1879)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Sergei P. Tolstov, Auf den Spuren der altchoresmischen Kultur (Aufbau-Verlag, 1953)"]

- id: buddhism-yuezhi-monks-2bc
  year: -1
  endYear: 290
  title:
    ko: "월지·강거·파르티아 출신 승려와 비단길의 불교(기원전 2~기원후 3세기 말)"
  summary:
    ko: "『삼국지』 주에 실린 『위략』은 기원전 2년 월지 왕의 사신 이존(伊存)이 박사제자 경로(景盧)에게 부도경을 말로 전했다고 한다. 불교가 비단길을 따라 퍼진 첫 기록으로 꼽히는 이야기다. 타림 분지 남쪽의 호탄은 기원전 1세기에 불교를 받아들였다는 설이 있으나 73년 반초가 본 풍습은 불교보다 마즈다교나 샤먼 신앙에 가까웠다고 하니 시기는 갈린다. 호탄은 5세기까지 간다라어를 카로슈티 문자로 적어 공용어로 썼고, 호탄의 전승은 비자야 크리티 왕이 127년 무렵 카니슈카의 사케트 원정을 도왔다고 하나 전설이 섞인 이야기로 본다. 쿠샨이 카니슈카 때 불교를 후원한 일은 「카니슈카와 쿠샨의 전성(127~150년 무렵)」(뒤의 사건)에 있다. 5세기 초 호탄을 지난 법현이 호탄을 불교가 번성한 나라로 적은 일은 「법현의 천축 순례(399~412)」(뒤의 사건)에 있다. 이 길로 중앙아시아 출신 승려들이 후한의 낙양과 남쪽으로 건너가 경전을 옮겼다. 파르티아 왕자 출신이라는 안세고는 148년 무렵 낙양에서 번역을 시작했고, 월지 사람으로 보는 지루가참은 178~189년 사이에 대승 경전을 한문으로 옮겼으며, 강거 상인의 아들로 교지에서 난 강승회는 오나라 수도 건업에 와서 포교했다(247년 무렵). 서진 때에는 대대로 돈황에 살던 월지계 승려 축법호가 265~313년께 많은 경전을 번역했다. 이름 앞의 안(安)·지(支)·강(康)·축(竺)은 각각 파르티아·월지·강거·인도 출신을 나타내는 성으로, 승려 대부분이 출신 나라 이름을 성으로 삼았다. 한어로 번역된 경전은 다시 한반도와 일본으로 퍼졌으니 중앙아시아의 불교는 동아시아 불교의 바탕이 된 셈이다."
  subjects: [yuezhi, khotan-kingdom, tarim-oasis-states, kangju, kushan-empire, parthian-empire, eastern-han, western-jin]
  tags: [religion, culture]
  sources: ["魚豢, 『魏略』 西戎傳 (『三國志』 裴松之注 所引)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Xinru Liu, The Silk Road in World History (Oxford University Press, 2010)"]

- id: wei-jin-liang-western-regions-220
  year: 220
  endYear: 376
  title:
    ko: "위·진과 전량의 서역: 서역장사와 고창군(220~376)"
  summary:
    ko: "후한이 무너진 뒤 위(220~265)는 돈황 서쪽에 서역장사를 두어 타림 분지 오아시스 나라들과 이어 갔고, 서진(265~316)도 이를 이어받았다. 3세기 위나라 사람 어환이 쓴 『위략』은 서역으로 가는 남도·중도·신북도의 세 길과 오손·강거 같은 나라를 적었는데, 강거는 예전과 같아 커지지도 줄지도 않았다고 한다. 서진 때에도 대완(페르가나 왕국)이 사절을 보냈다고 전한다. 서진은 311년 흉노에게 낙양을 빼앗기고 316년 무너졌다(「소그드 상인의 옛 편지와 소그디아나 도시들(313 무렵~479 무렵)」(뒤의 사건)). 서진이 무너지는 사이 서쪽 양주에서는 장궤가 301년 양주자사가 되어 고장(姑臧)을 거점으로 삼았고, 장실이 314년 이를 이어 서진이 무너진 뒤에도 그 마지막 황제의 연호 건흥을 계속 쓰며 자립에 가깝게 다스렸으며, 장무(320~324)를 거쳐 장준(324~346)에 이르러 전량(前涼)은 전성기를 맞았다. 장준은 327년 투루판에 고창군을 두고 중국식 군현을 심었고(투루판은 옛 차사국의 땅), 335년에는 군대를 이끌고 사막을 건너 구자 같은 서역 오아시스 나라들을 복속시키며 고창에 도호부를 되살렸다. 서역장사 이백이 언기왕에게 보낸 편지(이백문서)도 이 무렵의 것으로 전한다. 장준은 345년 스스로 양왕이라 일컬었으나 동진의 신하라는 형식은 버리지 않았다. 그 뒤 여러 군주를 거쳐 장천석(363~376) 때 전진에 항복하여 전량은 376년에 끝났다. 돈황의 막고굴은 전량 때인 366년 승려 낙준이 처음 팠다고 전한다. 전량 아래 고창군의 한인 이주민은 뒤에 투루판 고창국의 바탕이 되었다(「북량 잔당의 고창 이주와 차사국의 끝: 국씨 고창국의 성립까지(439~501)」(뒤의 사건))."
  subjects: [cao-wei, western-jin, former-liang, tarim-oasis-states, jushi-kingdom, kangju, ferghana-kingdom]
  tags: [politics, society]
  sources: ["魚豢, 『魏略』 西戎傳", "房玄齡 等, 『晉書』 張軌傳·張駿傳", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Yu Taishan, A History of the Relationships between the Western and Eastern Han, Wei, Jin, Northern and Southern Dynasties and the Western Regions (Sino-Platonic Papers 131, 2004)"]

- id: merv-religions-220
  year: 220
  endYear: 565
  title:
    ko: "메르브의 종교들: 사산 아래 조로아스터교·불교·마니교·경교(220~565)"
  summary:
    ko: "아무다리야 남쪽 메르브(마르기아나의 오아시스 도시)는 220~240년 무렵 아르다시르 1세가 파르티아 제국에게서 빼앗아 차지했고(「아르다시르 1세의 이란 통일: 종속 왕국의 병합(222~240)」(뒤의 사건)) 그곳에서 찍은 주화는 거의 4세기 가까이 이어진 사산의 지배를 보여 준다. 사산의 국교는 조로아스터교였지만 메르브에는 불교도와 마니교도, 동방 교회(경교) 신자가 함께 살았다. 마니교의 창시자 마니(216~274 또는 277)는 샤푸르 1세에게 『샤부라간』을 바쳐 포교를 허락받았다고 하며, 제자 마르 암모를 동쪽 이란과 박트리아 쪽으로 보내 교세를 넓혔다고 한다. 마니는 바흐람 1세에게 옥에 갇혀 죽었다. 메르브의 첫 동방 교회 주교로 바르샤바가 360년 또는 424년에 나온다고 하나 해는 분명하지 않다. 동방 교회는 410년 셀레우키아-크테시폰 공의회에서 가톨리코스를 선출하는 길을 열었고 424년에는 신학과 규율 문제를 바깥 권력에 묻지 않기로 결의해 사산 제국 안에서 독립한 조직을 갖추었다. 이 교회는 5세기부터 11세기까지 메르브에 대주교구를 두었고, 5세기 말에서 6세기 중엽 교회가 미치는 범위에는 박트리아와 히르카니아도 든다고 적혔다. 가우르 칼라와 바이라말리의 불교 사원과 탑은 이슬람이 퍼지기까지 오래 남았다. 5세기 말부터 565년까지는 에프탈이 메르브를 점령해 사산의 지배가 한동안 끊겼다. 에프탈 사람 가운데에도 마니교·조로아스터교·경교를 믿는 이가 있었다고 한다(「에프탈의 전성: 토하리스탄과 송운의 사행, 사산·돌궐의 협공(484~565 무렵)」(뒤의 사건)). 이 종교들은 뒷날 소그드 상인과 위구르를 통해 투루판과 중국 쪽으로 퍼졌다(「소그드 상인과 비단길의 종교·도시 문화(600~750 무렵)」(뒤의 사건))."
  subjects: [sasanian-empire, parthian-empire, hephthalites]
  tags: [religion, society]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Samuel N. C. Lieu, Manichaeism in the Later Roman Empire and Medieval China (Mohr Siebeck, 1992)", "Christoph Baumer, The History of Central Asia, vol. 2 (I.B. Tauris, 2014)"]

- id: sasanian-sogdiana-kangju-260
  year: 260
  endYear: 275
  title:
    ko: "사산의 소그디아나 진출 주장과 강거의 끝(260~270 무렵)"
  summary:
    ko: "사산 제국의 샤푸르 1세는 260년 무렵 이란 남서부 낙쉐 루스탐 가까운 카바이 자르두슈트의 비문에서 자신의 땅이 동쪽으로 쿠샨 왕들의 나라를 지나 페샤와르, 카슈가르와 소그디아나를 넘어 타슈켄트의 산까지 이른다고 적었다. 이 말을 그대로 믿을지는 갈리는데, 사산이 아무다리야 북쪽까지 직접 다스렸다는 증거는 약하고 박트리아와 쿠샨 땅에는 사산 사람이 샤로 나서는 쿠샨샤르 왕국이 따로 섰다(「사산의 쿠샨 땅 진출과 쿠샨샤 왕국(231~286년 무렵)」(앞의 사건)). 소그디아나와 쿠샨의 힘겨루기는 오랜 일이어서, 84년 강거가 카슈가르 왕의 반란을 돕자 쿠샨이 반초의 편에서 이를 막은 적이 있다(「반초의 서역 경영(73~102)과 감영의 사행(97)」(앞의 사건)). 소그디아나는 이 무렵 사산의 속주로 들어갔다는 견해도 있으나, 도시들은 저마다 왕을 두는 틀을 이어 갔다. 시르다리야 중류의 강거는 『위략』이 예전 그대로 커지지도 줄지도 않는다고 적었고, 『후한서』는 2세기 전반 소그디아나 쪽 속익(소그디아나로 보는 견해)과 엄채(아오르소이로 보는 견해), 엄, 북오익(후잔드로 보는 견해)이 강거에 딸린다고 적었다. 강거란 이름은 소그디아나의 다른 이름으로 보는 견해가 많고, 이 나라 사람들은 소그드어와 같거나 가까운 동이란계 말을 쓴 것으로 본다. 강거는 3세기 들어 힘이 빠졌고 270년 무렵 이른바 크시오네스(훈 계통 유목민)에게 복속되어 에프탈에 흡수되었다는 설이 널리 알려져 있으나, 끝 해를 5세기로 보는 글도 있다. 사산 샤푸르 2세가 359~360년 크시오네스와 함께 아미다를 포위한 일은 「쿠샨샤르의 끝과 키다라 왕국, 쿠샨의 마지막(360~375 무렵)」(뒤의 사건) 쪽에 있다."
  subjects: [sasanian-empire, kangju, kushano-sasanian-kingdom, kushan-empire]
  tags: [politics]
  sources: ["魚豢, 『魏略』 西戎傳", "范曄, 『後漢書』 西域傳", "Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: kucha-kizil-300
  year: 300
  endYear: 649
  title:
    ko: "쿠차의 토하라어와 키질 석굴(300 무렵~649)"
  summary:
    ko: "타림 분지 북쪽 길의 쿠차(구자)는 무자트강 북안에서 서쪽으로 65킬로미터쯤 떨어진 키질에 석굴 사원을 팠다. 석굴은 모두 236개로 길이 2킬로미터쯤의 절벽에 늘어섰고 135개가 비교적 온전하다. 이 가운데 3분의 2는 벽화 없는 승려의 방이다. 가장 이른 굴은 방사성탄소 연대로 300년 무렵으로 보며, 8세기 초 당의 영향이 닿은 뒤 버려졌다는 견해가 많으나 연대는 아직 다툼이 있다. 벽화는 간다라의 영향을 받아 갈색과 주황·녹색을 쓴 첫째 양식과, 청금석 파랑을 강하게 쓰고 사산의 영향이 보이는 둘째 양식으로 나뉜다. 쿠차 둘레에는 쿰트라 석굴과 심심 석굴도 있다. 쿠차는 설일체유부가 중심이고 법장부가 소수였다. 굴에서는 토하라어 문서와 산스크리트 명문이 나왔고 그 가운데 왕의 이름이 적힌 것도 있다. 토하라어는 쿠차에서 쓴 B형(쿠차어)과 언기(카라샤르) 쪽의 A형이 있는데, 이름은 박트리아의 토하리스탄에서 따왔으나 둘이 이어진다는 근거는 약하다. 구마라집(344~413)은 카슈미르 출신 아버지와 쿠차 왕족인 어머니 사이에서 나서 쿠차에서 자랐고 뒷날 장안에서 경전을 옮겼다(「구마라집의 장안 역경(401~413)」(뒤의 사건)). 568년 북주 무제의 황후가 된 돌궐 공주를 따라 쿠차의 악사 소지파가 중원에 들어와 쿠차 음악의 음계 이론을 전했다고 한다. 쿠차 음악은 뒷날 수·당 궁정의 십부기에 들어갔다. 당군은 648년 쿠차를 에워싸 이듬해 초 항복을 받았다(「당의 서역 진출: 고창 멸망과 안서도호부, 구자 정복과 안서 4진(640~649)」(뒤의 사건)). 키질 석굴은 1902~1904년 오타니 탐험대, 1906~1907년 그륀베델의 독일 탐험대, 1913~1914년 르 콕 쪽이 파 가거나 벽화를 떼어 가 많이 사라졌고 지금은 벽화 5천 제곱미터쯤이 남는다."
  subjects: [tarim-oasis-states]
  tags: [culture, religion]
  sources: ["Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "UNESCO 세계유산 「실크로드: 장안-톈산 회랑의 교역망」 등재 자료(2014)", "隋書 音樂志 (蘇祗婆 條)"]

- id: sogdian-letters-313
  year: 313
  endYear: 479
  title:
    ko: "소그드 상인의 옛 편지와 소그디아나 도시들(313 무렵~479 무렵)"
  summary:
    ko: "1907년 아우렐 스타인은 돈황과 누란을 잇는, 타림 분지 오아시스 나라들로 가는 길목을 지키던 만리장성 쪽 감시탑 터에서 소그드 문자로 쓴 편지 여러 통을 찾았다. 이른바 소그드 옛 편지다. 헨닝은 이 편지에 황제가 낙양을 떠났다거나 흉노와 싸운다는 소문이 적힌 점을 311년 흉노의 낙양 함락(서진의 수도가 무너진 일)과 이어 312~313년 무렵의 것으로 보았고 이 견해가 널리 받아들여지지만, 2세기 후반으로 보는 소수설도 있다. 한 편지는 낙양에서 인도 사람과 소그드 사람들이 굶주렸다고 알리며, 사마르칸트의 상인들에게 낙양 소요 뒤로는 장사할 만한 것이 없다고 일러 주었다. 나나이반다크라는 상인이 사마르칸트의 나나이투아르에게 쓴 편지가 있고, 미우나이라는 여인이 남편에게 버림받은 사정을 알리는 편지도 있다. 소그드 상인이 돈황·금성·낙양 같은 중국 도시에 뿌리를 내려 고향과 편지를 주고받으며 장사를 이은 모습이 이 편지들에 드러난다. 중국 사서는 소그디아나 사람을 속특이라 부르고 사마르칸트 출신은 강(康), 부하라 출신은 안(安) 같은 성으로 적었다. 사산이 260년 무렵 소그디아나를 속주로 삼았다는 견해는 「사산의 소그디아나 진출 주장과 강거의 끝(260~270 무렵)」(앞의 사건)에서 다룬다. 5세기까지 소그디아나의 사마르칸트·부하라·판자켄트 같은 도시는 저마다 왕을 두었는데, 에프탈이 479년 무렵(509년이라는 글도 있다) 소그디아나를 차지했다. 479년은 소그드 쪽에서 중국에 사절을 보낸 마지막 기록의 해와 겹친다. 그 뒤 소그디아나는 에프탈 아래 있다가 돌궐에게 넘어갔다(「이스테미 야브구의 서방 경영과 소그드 상인(553~603)」(뒤의 사건)). 7~8세기 소그드 상인의 문화는 「소그드 상인과 비단길의 종교·도시 문화(600~750 무렵)」(뒤의 사건)로 이어진다."
  subjects: [sogdian-city-states, hephthalites, western-jin, tarim-oasis-states]
  tags: [economy, society]
  sources: ["Nicholas Sims-Williams, 'The Sogdian Ancient Letters', in Encyclopaedia Iranica", "Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Walter B. Henning, 'The Date of the Sogdian Ancient Letters', Bulletin of the School of Oriental and African Studies 12 (1948)"]

- id: northern-wei-western-regions-436
  year: 436
  endYear: 457
  title:
    ko: "북위의 서역 교섭과 오손의 마지막 기록(436~457 무렵)"
  summary:
    ko: "북위는 439년 북량의 도읍 고장을 함락해 북량 왕 저거목건을 사로잡고 화북을 하나로 합쳤다(「북위 태무제의 화북 통일과 남북조 시대」(뒤의 사건)). 그 전에도 북위는 서역으로 사절을 보냈다. 『위서』는 437년 무렵 동완과 고명이 타림 분지 오아시스 나라들을 비롯한 서역에 가서 여러 나라와 통했다고 적는데, 이 사행으로 길이 열렸다고 전한다. 그 뒤에도 서역에 사절을 자주 보냈다. 서역으로 가는 길목은 북쪽의 유연이 자주 막았다. 유연은 5세기 초 에프탈을 신하로 두었던 유목 세력이고 북위와 오래 싸웠다. 중국 사서에 오손의 사절이 마지막으로 오른 해는 436년이다. 오손은 그 뒤 유연에게 눌려 파미르 쪽으로 옮겼다가 에프탈 같은 다른 세력에 흡수되었다고 보는데, 이 마지막 두 세기의 사정은 거의 전하지 않는다. 에프탈은 456~457년 북위에 처음으로 사절을 보냈는데, 북위 사람들은 이들을 엽달이라 적었다. 이 사절은 곧 서쪽의 새 강자가 나타났음을 북위에 알린 셈이다(「에프탈의 성립과 키다라의 끝, 페로즈 1세의 죽음(450~484)」(뒤의 사건)). 북량이 무너지자 북량의 잔당이 투루판으로 달아나 고창을 차지했다(「북량 잔당의 고창 이주와 차사국의 끝: 국씨 고창국의 성립까지(439~501)」(뒤의 사건)). 북위의 북량은 고장에서 서역과 교역하며 불경 번역을 후원했는데 이 길도 439년에 끊겼다. 오손은 74년 한의 도호에게 공물을 바쳤고 80년 반초가 쿠차를 칠 때 도움을 청해 관계를 되살렸으나 2세기에 쇠퇴했다. 서쪽 나라들과 한동안 끊겼던 사절 왕래는 북위가 화북을 하나로 합친 5세기 중엽에야 다시 이어졌다고 보며, 사산 쪽 사절도 이 무렵 북위에 이르렀다고 전한다."
  subjects: [northern-wei, northern-liang, rouran, wusun, hephthalites, tarim-oasis-states]
  tags: [diplomacy, politics]
  sources: ["魏收, 『魏書』 西域傳·世祖紀", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)"]

- id: turfan-gaochang-439
  year: 439
  endYear: 501
  title:
    ko: "북량 잔당의 고창 이주와 차사국의 끝: 국씨 고창국의 성립까지(439~501)"
  summary:
    ko: "북위가 439년 북량의 도읍 고장을 함락하자(「북위 태무제의 화북 통일과 남북조 시대」(같은 해의 사건), 그 주민과 승려의 이주는 「북위의 불교: 북량 승려의 이주(439), 태무제의 폐불(446), 윈강 석굴(460 무렵)」(같은 해의 사건)) 저거씨의 형제 저거무휘와 저거안주는 흩어져 달아났다. 안주는 처음 토욕혼으로 갔다가 441년 겨울 돈황의 무휘와 만났고, 무휘는 안주를 보내 타림 분지 오아시스 나라들 가운데 선선을 치게 했으나 처음에는 이기지 못했다. 442년 무휘가 직접 가자 선선 왕이 달아나 성을 얻었고, 그해 안에 고창으로 옮겨 갔다. 투루판 분지에는 한과 흉노 사이를 오가던 옛 차사국의 땅이 있었고 327년 전량이 이곳에 고창군을 둔 뒤 한인이 많이 살았는데(「위·진과 전량의 서역: 서역장사와 고창군(220~376)」(앞의 사건)), 북량 잔당이 고창을 차지하자 투루판 분지에서 차사국은 밀려났고, 450년 저거안주가 교하성을 함락해 차사 왕이 언기로 달아났다고 한다. 무휘가 444년 죽고 안주가 이어 송 문제에게서 하서왕에 봉해졌으며, 연호 승평(承平)을 쓰고 유연과도 사이를 유지하려 했다. 그러나 460년 유연이 고창을 쳐서 안주와 그 일족을 죽이고 한인 감백주를 왕으로 세웠다. 이때 고창에는 한인이 1만 호가 넘었다고 하며, 이곳은 소그드어로 중국 사람의 마을이라 불렸다. 투루판 고창 일대의 불교 석굴(베제클릭 석굴 따위)은 6세기 초부터 만들기 시작했다고 본다. 감백주 뒤에는 감의성과 감수귀(477년 무렵~)가 있었는데, 유연에 맞서 일어난 고거(高車, 철륵)의 왕 아복지라가 감수귀를 죽이고 돈황 출신 한인 장맹명을 왕으로 세웠다(488~491년 무렵). 장맹명은 현지 사람들의 반란으로 죽었고(496년 무렵) 마유가 이었으나 그도 501년 무렵 죽임을 당했다. 사람들은 금성 출신 국가(麴嘉)를 왕으로 세웠고, 이 국씨 왕조의 고창국이 640년 당에 멸망할 때까지 이어졌다."
  subjects: [jushi-kingdom, qu-gaochang, northern-liang, northern-wei, rouran, tuyuhun, tarim-oasis-states]
  tags: [politics, society]
  sources: ["魏收, 『魏書』 高昌傳·沮渠蒙遜傳", "房玄齡 等, 『晉書』", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Yu Taishan, A History of the Relationships between the Western and Eastern Han, Wei, Jin, Northern and Southern Dynasties and the Western Regions (Sino-Platonic Papers 131, 2004)"]

- id: hephthalite-rise-450
  year: 450
  endYear: 484
  title:
    ko: "에프탈의 성립과 키다라의 끝, 페로즈 1세의 죽음(450~484)"
  summary:
    ko: "에프탈은 스스로 '에보달로'라 불렀고 중국 사서는 엽달(嚈噠)·활(滑) 같은 이름으로 적은 유목 집단이다. 기원은 이란계설과 튀르크계설 등으로 갈리며, 알타이 쪽에서 350~360년 무렵 옮겨 왔다고 보기도 한다. 5세기 초에는 유연의 신하였고, 440년대에서 450년 무렵 힘을 키워 세력이 되었다. 456~457년 북위에 처음 사절을 보냈다(「북위의 서역 교섭과 오손의 마지막 기록(436~457 무렵)」(앞의 사건)). 459년 페로즈 1세가 형 호르미즈드 3세를 누르고 사산의 왕위에 올랐는데 후대 페르시아 전승은 에프탈이 도왔다고 전하며, 에프탈은 466~467년 무렵 사산의 도움을 받아 박트리아의 키다라 왕국을 무너뜨렸고, 그 땅에는 알촌 훈족이 나타났다(「알촌 훈족의 성립과 키다라의 끝(460~470)」(뒤의 사건)). 그러나 페로즈는 474년부터 에프탈과 세 차례 싸웠다. 두 번 사로잡혀 몸값을 치렀고 아들 카바드를 인질로 보냈으며, 사산은 이때부터 6세기 중엽까지 에프탈에 공물을 바쳤다고 한다. 484년 페로즈 1세는 에프탈과의 싸움에서 패해 죽었는데(헤라트나 발흐 가까이로 보는 글이 있다) 군대는 크게 꺾였다. 에프탈은 474년 무렵부터 박트리아를 정식으로 다스렸고, 소그디아나는 479년 무렵(509년이라는 글도 있다) 차지했다(「소그드 상인의 옛 편지와 소그디아나 도시들(313 무렵~479 무렵)」(앞의 사건)). 에프탈 왕의 이름은 거의 전하지 않아 아흐슌와르 같은 이름만 나온다. 박트리아어로 쓴 로브 왕국의 문서 가운데 483~484년의 세금 영수증이 남아 있어 박트리아어가 행정 언어였음을 보여 준다. 사산이 에프탈의 도움으로 카바드 1세를 복위시킨 488년의 일은 「카바드 1세와 마즈다크 운동(488~531)」(뒤의 사건)으로 이어진다."
  subjects: [hephthalites, sasanian-empire, kidarite-kingdom, alchon-huns, rouran, northern-wei, sogdian-city-states]
  tags: [politics, war]
  sources: ["Procopius, De Bello Persico I.3-4 (H. B. Dewing 영역, Loeb Classical Library)", "Nicholas Sims-Williams, Bactrian Documents from Northern Afghanistan (Oxford University Press, 2000~2012)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Étienne de la Vaissière, 'Is There a \"Nationality of the Hephthalites\"?', Bulletin of the Asia Institute 17 (2003)"]

- id: hephthalite-tokharistan-484
  year: 484
  endYear: 565
  title:
    ko: "에프탈의 전성: 토하리스탄과 송운의 사행, 사산·돌궐의 협공(484~565 무렵)"
  summary:
    ko: "페로즈가 죽은 뒤 에프탈은 힌두쿠시 북쪽 박트리아(토하리스탄)를 중심으로 500년 무렵에는 파미르와 아프가니스탄 일부까지 차지했고, 타림 분지 투루판까지 영향을 미쳤다고 한다. 도읍은 쿤두즈로 보는 견해가 있고 발흐를 꼽기도 한다. 카바드 1세는 496~498년 에프탈 궁정으로 달아났다가 군사를 얻는 대가로 차가니얀을 넘겨주었다(「카바드 1세와 마즈다크 운동(488~531)」(뒤의 사건)). 에프탈 주화는 페로즈 1세의 주화를 본뜨거나 덧도장을 찍은 것이고 왕의 이름을 새기지 않았다. 힌두쿠시 남쪽에서는 알촌 훈족이 인도로 들어갔다(「토라마나의 인도 진출과 에란 전투(500~515)」(뒤의 사건)). 북위 승려 송운과 혜생은 518년 낙양을 떠나 파미르를 넘어 에프탈 왕을 만났는데, 왕은 사십여 나라를 거느렸고 북위의 조서를 무릎 꿇고 받았다고 기록했다. 520년 간다라에 이른 이들은 그곳 에프탈 지배자를 포악하다고 적어 에프탈이 불교를 박해했다는 인상의 근거가 되었다. 송운은 521~522년 경전 170부를 갖고 돌아왔다. 토하리스탄의 발랄릭 테페와 타프카 쿠르간의 벽화에는 에프탈식 차림의 기증자와 잔치 장면이 남았고, 바미얀의 38미터 불상은 544~595년께의 것으로 본다. 에프탈 사람 가운데에는 마니교·조로아스터교·경교를 믿는 이도 있었다고 한다. 560년을 전후해 사산이 돌궐과 손잡고 에프탈을 쳐서 562년 이기고, 565년 카르시 근처에서 에프탈이 져서 박트리아로 물러났다(「알촌 훈족의 쇠퇴와 사산·돌궐(542~565)」(뒤의 사건)). 이후 차가니얀 같은 에프탈 후예의 공국은 서돌궐 아래에서 이어졌고, 돌궐의 서쪽을 맡은 이스테미 야브구국이 이들과 맞닿았다(「이스테미 야브구의 서방 경영과 소그드 상인(553~603)」(뒤의 사건))."
  subjects: [hephthalites, sasanian-empire, northern-wei, gokturk, istami-yabghu-state, tarim-oasis-states, alchon-huns]
  tags: [politics, culture, religion]
  sources: ["洛陽伽藍記 (楊衒之) 卷五 宋雲行紀", "Nicholas Sims-Williams, Bactrian Documents from Northern Afghanistan (Oxford University Press, 2000~2012)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Étienne de la Vaissière, 'Is There a \"Nationality of the Hephthalites\"?', Bulletin of the Asia Institute 17 (2003)"]

- id: istami-western-turks-553
  year: 553
  endYear: 603
  title:
    ko: "이스테미 야브구의 서방 경영과 소그드 상인(553~603)"
  summary:
    ko: "돌궐 제1 카간국을 세운 부민 카간(552)은 553년 아우 이스테미에게 서쪽을 맡겨 야브구로 삼았고, 이렇게 선 이스테미 야브구국은 서쪽 초원과 오아시스를 다스렸다. 이스테미는 554년 무렵부터 서쪽으로 군대를 움직여 큰 저항 없이 555년 무렵 아랄해 가까이에 이르렀다. 에프탈을 치는 데에는 사산과 손잡았는데 해는 557~560년 무렵이라는 글과 560~565년이라는 글이 갈린다(「알촌 훈족의 쇠퇴와 사산·돌궐(542~565)」(앞의 사건)). 562년 또는 564년에 타슈켄트를 얻었고 568년 무렵 박트리아 일부를 차지했다. 돌궐은 비단길 중개를 맡은 소그디아나 도시 군주국들의 상인을 앞세워 사산을 거치지 않고 서쪽과 교역하려 했다. 소그드 사람 마니아크가 이끄는 돌궐·소그드 사절이 568년 콘스탄티노폴리스에 이르러 비단을 바치고 동로마 제국의 유스티노스 2세와 동맹을 맺었다(「돌궐의 성립(552)과 아바르의 서진: 게피드의 멸망(567)과 동로마-돌궐 동맹(568)」(앞의 사건)). 사산은 돌궐과 갈라서 569~571년 싸웠고 돌궐은 메르브 근처에서 졌다. 571년 아무다리야가 두 나라의 경계로 정해지면서 돌궐은 소그드 도시들과 중앙 비단길을 쥐게 되었다. 575년 또는 576년 이스테미가 죽자 아들 타르두가 이었다. 581년 돌궐이 동서로 갈라질 때 서쪽은 한때 동쪽 카간국 아래 한 지방으로 쳐졌고(「수의 이간책과 돌궐의 동서 분열: 사발략 카간에서 계민 카간까지(581~603)」(뒤의 사건)), 타르두는 동돌궐의 내분에 끼어들었으며, 588~589년 헤라트와 박트리아에서 사산에 패했다. 593~603년 싸움 끝에 서돌궐 카간국이 603년 따로 섰다(「서돌궐 아래의 오아시스 나라들과 고창국(600~640)」(뒤의 사건))."
  subjects: [istami-yabghu-state, gokturk, hephthalites, sogdian-city-states, sasanian-empire, western-turkic-khaganate, byzantine-empire]
  tags: [politics, diplomacy, economy]
  sources: ["Menander Protector, History (R. C. Blockley 영역, 1985)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Denis Sinor 편, The Cambridge History of Early Inner Asia (Cambridge University Press, 1990)"]

- id: sogdian-sabao-china-557
  year: 557
  endYear: 592
  title:
    ko: "북주·수의 소그드 이주민: 살보와 안가·사군·우홍의 묘(557~592)"
  summary:
    ko: "소그드 상인은 고향에서 먼 중국 도시에도 마을을 이루었고, 북조 때 그 마을을 이끄는 우두머리를 살보(薩保)라 불렀다. 살보는 소그드어 칭호에서 나온 말로 나라가 임명한 이주민 공동체의 지도자를 뜻한다. 이 직함이 사료에 나오는 때는 북주(557~581)에 몰려 있다는 글이 있어 북제와 어떻게 달랐는지는 갈린다. 시안에서 2001년 도굴되지 않은 채 발굴된 안가(518~579)의 묘가 이 사정을 보여 준다. 무덤에서 나온 글에 따르면 안가는 부하라 귀족 집안 출신으로 북주 동주(同州)에서 중앙아시아 상인의 일과 조로아스터교 일을 맡았다. 묘 안 그림에는 돌궐 사람들이 여럿 그려져 있어 돌궐이 주요 거래 상대였음을 짐작하게 한다. 579년 지어진 이 묘는 소그드 상인이 돌궐 우두머리와 앉은 장면을 새겼다. 시안의 사군(史君, 소그드 이름 위르카크) 묘는 579년 86세로 죽은 그가 580년 아들들이 지은 석실에 묻힌 것으로, 소그드 상인이 석실 장구와 조로아스터교 장례 양식을 이어 갔음을 보여 준다. 안가 묘의 석제 침상에는 잔치와 사냥 장면이 새겨졌고 사군 묘의 석실에는 조로아스터교의 불 제단과 사제가 새겨졌다. 타이위안의 우홍(虞弘)은 북주 때 살보부를 검교하는 일을 맡아 592년 59세로 죽었다. 이 무덤들은 모두 북주~수 때의 것으로, 소그드 사람들이 돌궐과 중국 사이를 이어 주던 모습을 말해 준다(앞 시대의 소그디아나 쪽 사정은 「이스테미 야브구의 서방 경영과 소그드 상인(553~603)」(앞의 사건)). 7~8세기의 사정은 「소그드 상인과 비단길의 종교·도시 문화(600~750 무렵)」(뒤의 사건)로 이어진다."
  subjects: [sogdian-city-states, northern-zhou, northern-qi, sui, gokturk]
  tags: [society, economy, religion]
  sources: ["Étienne de la Vaissière 및 Éric Trombert 편, Les Sogdiens en Chine (École française d'Extrême-Orient, 2005)", "Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Judith A. Lerner, 'Aspects of Assimilation: The Funerary Practices and Furnishings of Central Asians in China' (Sino-Platonic Papers 168, 2005)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)"]
