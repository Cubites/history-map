- id: cromwell-ireland-1649
  year: 1649
  endYear: 1658
  title:
    ko: 크롬웰의 공화정과 아일랜드·스코틀랜드 정복
  summary:
    ko: "1649년 찰스 1세를 처형한 잉글랜드 의회는 왕정과 귀족원을 없애고 공화국(코먼웰스)을 선포했다. 아일랜드에서는 1641년 가톨릭교도가 봉기해 얼스터의 개신교 정착민 수천 명을 죽이거나 내쫓은 뒤 가톨릭 연맹이 섬 대부분을 다스리고 있었다. 1649년 8월 아일랜드에 상륙한 크롬웰의 의회군은 드로이다와 웩스퍼드를 함락하며 수비대와 가톨릭 사제, 일부 주민 등 수천 명을 죽였다(민간인 희생 규모는 연구자마다 다툼이 있음). 정복 전쟁(1649~1653)과 뒤따른 기근·전염병으로 아일랜드 인구가 크게 줄었고(추산 폭이 큼), 가톨릭 지주의 땅 대부분이 몰수되어 잉글랜드 군인과 투자자에게 넘어갔다. 찰스 2세를 왕으로 내세운 스코틀랜드도 던바(1650)·우스터(1651) 전투 뒤 정복되었다. 1653년 크롬웰은 의회를 해산하고 통치 헌장에 따라 호국경이 되어 군대를 바탕으로 세 나라를 다스렸다. 1658년 크롬웰이 죽자 정국은 혼란에 빠졌다."
  subjects: [england, ireland-kingdom, scotland]
  links:
