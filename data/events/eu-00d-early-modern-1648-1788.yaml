- id: prussia-kingdom-1701
  year: 1701
  title:
    ko: 프로이센 왕국의 성립
  summary:
    ko: "30년 전쟁 뒤 '대선제후' 프리드리히 빌헬름(재위 1640~1688)은 상비군과 관료제를 키우고, 벨라우 조약(1657)으로 프로이센 공국을 폴란드의 봉토에서 벗어나게 했다. 그의 아들 브란덴부르크 선제후 프리드리히 3세는 에스파냐 왕위 계승 문제로 군대가 필요한 황제 레오폴트 1세에게 병력을 보내기로 하고 왕위를 인정받아(1700년 11월 왕관 조약), 1701년 1월 18일 쾨니히스베르크에서 스스로 왕관을 쓰고 프리드리히 1세가 되었다. 제국 안에서는 보헤미아 말고는 왕국을 둘 수 없었으므로 제국 밖의 프로이센 공국을 왕국의 이름으로 삼았고, 서프로이센은 아직 폴란드 땅이었으므로 '프로이센의 왕'이 아닌 '프로이센에서의 왕'을 칭했다. 그의 아들 프리드리히 빌헬름 1세(재위 1713~1740)는 '군인 왕'이라 불릴 만큼 군대를 키우고 재정을 아껴, 아들 프리드리히 2세가 강국으로 키울 바탕을 마련했다."
  subjects: [brandenburg-prussia, prussia, holy-roman-empire, habsburg-monarchy, polish-lithuanian-commonwealth]
