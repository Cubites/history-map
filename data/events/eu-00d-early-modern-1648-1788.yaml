- id: russo-turkish-war-1736
  year: 1736
  endYear: 1739
  title:
    ko: 러시아·오스트리아와 오스만의 전쟁, 베오그라드 조약
  summary:
    ko: "크림 타타르는 러시아 남부와 우크라이나를 자주 습격해 주민을 노예로 끌고 갔다. 러시아는 이를 구실로 1735년 가을 크림 원정에 나섰고, 1736년 본격적으로 오스만 제국과 싸워 아조프를 차지했다. 같은 해 크림반도로 들어간 러시아군(뮌니히)은 칸의 수도 바흐치사라이 등 도시와 마을을 불태웠다. 1737년 오스트리아도 러시아 편으로 참전했다. 러시아군은 오차키우를 차지하고(1737) 몰다비아의 스타우차니에서 이긴 뒤 호틴과 야시에 들어갔으나(1739), 오스트리아군은 잇달아 졌다. 1739년 9월 프랑스의 중재로 맺은 베오그라드 조약으로 오스트리아는 파사로비츠 조약(1718)으로 얻은 세르비아 북부와 베오그라드, 올테니아(왈라키아 서부)를 오스만에 돌려주었고, 러시아는 아조프를 얻었으나 요새를 허물고 흑해에 함대를 둘 수 없게 되었다."
