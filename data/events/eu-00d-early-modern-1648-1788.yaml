- id: russo-turkish-war-1768
  year: 1768
  endYear: 1774
  title:
    ko: 러시아-튀르크 전쟁과 퀴췩카이나르자 조약
  summary:
    ko: "러시아의 폴란드 간섭에 맞선 바르 연맹(1768)이 일어난 가운데, 바르 연맹 쪽을 쫓던 하이다마키 반란군(콜리우시치나)이 오스만령 발타를 습격하자(발타 사건, 오스만은 러시아가 시킨 일로 봄), 프랑스의 부추김도 받은 오스만 제국은 1768년 10월 러시아 대사를 가두고 선전 포고했다. 러시아군은 라르가·카굴 전투(1770)에서 이겨 몰다비아·왈라키아를 점령하고 크림반도도 차지했으며(1771), 발트해에서 지중해로 돌아 들어간 러시아 함대는 체슈메에서 오스만 함대를 불태웠다(1770). 1774년 7월 퀴췩카이나르자 조약으로 크림 칸국은 오스만에게서 독립했고, 러시아는 아조프, 케르치·예니칼레, 킨부른과 드니프로강·남부흐강 사이 초원, 카바르다를 얻고 흑해 항해권과 상선의 해협 통과권을 얻었다. 오스만 영내 정교도에 대한 조항은 뒤에 러시아가 정교도 보호권을 내세우는 근거가 되었다. 이듬해 오스트리아는 몰다비아 북부 부코비나를 오스만에게서 받아 냈다(1775)."
  subjects: [russia, ottoman, crimean-khanate, moldavia, wallachia, habsburg-monarchy, polish-lithuanian-commonwealth]
