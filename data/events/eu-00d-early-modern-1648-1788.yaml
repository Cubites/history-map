- id: rakoczi-1703
  year: 1703
  endYear: 1711
  title:
    ko: 라코치 독립 전쟁과 서트마르 강화
  summary:
    ko: "카를로비츠 조약 뒤 바나트를 뺀 헝가리 대부분을 다스리게 된 합스부르크 왕가는 무거운 세금과 군대 주둔, 신교 억압으로 반발을 샀다. 에스파냐 왕위 계승 전쟁으로 합스부르크군이 서쪽에 묶이자, 1703년 트란실바니아 공 집안 출신의 라코치 페렌츠 2세가 농민과 귀족을 모아 독립 전쟁을 일으켰다(쿠루츠 봉기). 그는 1704년 트란실바니아 공으로 추대되었고, 1707년 오노드 의회는 합스부르크 왕가를 헝가리 왕위에서 폐위했다. 싸움 동안 봉기군(쿠루츠)과 합스부르크 쪽 군대(러번츠와 세르비아계 국경 민병)는 서로 상대 편 마을을 약탈하고 불태워 주민의 피해가 컸다. 프랑스의 지원은 적었고, 블렌하임(1704)에서 프랑스·바이에른군이 져 서로 손잡을 길이 막힌 데다 트렌친(1708)에서 봉기군이 지면서 봉기는 약해졌다. 1711년 서트마르 강화로 봉기군은 사면과 헝가리 신분제 의회의 권리 보장을 받고 무기를 내려놓았고, 강화를 받아들이지 않은 라코치는 망명해 오스만 제국에서 죽었다(1735). 트란실바니아는 합스부르크가 다스리는 공국으로 남았다(1765년 대공국)."
  subjects: [habsburg-monarchy, transylvania, france, ottoman]
  links:
