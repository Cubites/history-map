# ── 루이 14세의 전쟁과 영국 혁명, 오스만의 후퇴 (1672 ~ 1697) ──

- id: dutch-war-1672
  year: 1672
  endYear: 1678
  title:
    ko: 네덜란드 전쟁과 네이메헌 조약
  summary:
    ko: "루이 14세는 왕비의 상속권을 내세운 상속 전쟁(1667~1668)으로 에스파냐령 네덜란드의 릴 등을 얻은 뒤, 이를 막아선 네덜란드 공화국을 치려고 잉글랜드 왕 찰스 2세와 비밀 조약을 맺고(도버 밀약, 1670) 1672년 침공했다. 네덜란드에서 '재난의 해'라 부르는 이 해에 프랑스군이 위트레흐트까지 들어오자, 네덜란드는 둑을 열어 땅을 물에 잠기게 해 홀란트를 지켰다. 오라녜 공 빌럼 3세가 총독이 되어 저항을 이끌었고(7월), 정부를 이끌던 얀 더 빗과 형 코르넬리스는 성난 군중에게 살해되었다(8월). 황제와 에스파냐, 브란덴부르크가 네덜란드 편에 섰고 잉글랜드는 1674년 전쟁에서 빠졌다. 프랑스와 동맹한 스웨덴은 브란덴부르크를 공격했으나 페르벨린 전투(1675)에서 졌다. 네이메헌 조약(1678~1679)으로 프랑스는 에스파냐에게서 프랑슈콩테와 플랑드르의 도시 몇 곳을 얻었고, 네덜란드는 땅을 잃지 않았다."
  subjects: [france, dutch-republic, spain, england, holy-roman-empire, habsburg-monarchy, brandenburg-prussia, sweden-kingdom]
