- id: spanish-succession-1701
  year: 1701
  endYear: 1714
  title:
    ko: 에스파냐 왕위 계승 전쟁
  summary:
    ko: "1700년 11월 자식 없이 죽은 에스파냐 왕 카를로스 2세가 유언으로 루이 14세의 손자 앙주 공 필리프를 후계자로 정하자, 필리프는 펠리페 5세로 즉위했다. 프랑스와 에스파냐가 한 왕가 아래 합쳐질 것을 우려한 황제 레오폴트 1세는 1701년 여름 북이탈리아에서 프랑스군과 싸움을 시작했고, 9월 잉글랜드·네덜란드와 대동맹을 맺어 아들 카를 대공을 에스파냐 왕으로 내세웠다. 동맹국들은 1702년 5월 정식으로 선전 포고했다. 프로이센·포르투갈·사보이아도 동맹에 가세했고 바이에른은 프랑스 편에 섰다. 잉글랜드(1707년부터 영국)의 말버러 공작과 황제군의 오이겐 공자가 블렌하임(1704)·라미이(1706)·토리노(1706)·아우데나르더(1708)에서 프랑스군을 이겼고, 동맹군은 지브롤터(1704)와 메노르카(1708)를 차지했다. 에스파냐 안에서는 카스티야가 펠리페를, 아라곤 연합 왕국(아라곤·카탈루냐·발렌시아 등)의 상당 부분이 카를 대공을 지지해 내전이 벌어졌다. 펠리페 5세는 이 나라들을 차례로 누르며 자치 제도를 없앴고(누에바 플란타 칙령, 1707~1716), 1714년 바르셀로나를 함락했다. 1711년 카를 대공이 황제(카를 6세)가 되자 영국은 에스파냐와 오스트리아가 한 군주 아래 합쳐지는 것도 원하지 않아 프랑스와 따로 협상에 나섰다."
  subjects: [spain, france, habsburg-monarchy, holy-roman-empire, england, uk, dutch-republic, portugal, savoy, prussia]
