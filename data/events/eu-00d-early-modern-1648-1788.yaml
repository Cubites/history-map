- id: peter-grand-embassy-1697
  year: 1697
  endYear: 1698
  title:
    ko: 표트르 대제의 서유럽 사절단과 개혁
  summary:
    ko: "1682년 아홉 살에 이복형 이반 5세와 함께 차르가 된 표트르 1세는 1689년 섭정 소피야를 몰아내고 1694년 무렵부터 직접 다스렸으며, 1697~1698년 대사절단을 꾸려 네덜란드·잉글랜드 등 서유럽을 둘러보았다. 그는 신분을 감춘 채 조선소에서 배 만드는 기술을 배웠다. 1698년 근위 총병대(스트렐치)가 반란을 일으켰다는 소식에 서둘러 돌아와, 이미 진압된 반란 가담자를 고문하고 대거 처형했다. 이어 귀족에게 수염을 깎고 서양식 옷을 입게 했다. 그 뒤 서력 기원과 1월 1일 새해(1700), 징병제에 바탕을 둔 상비군과 해군, 원로원(1711), 행정 기관인 참의회(1718), 교회를 국가 아래 둔 신성 종무원(1721), 출신보다 근무와 능력으로 관직을 오르게 한 관등표(1722)를 도입해 러시아를 서구식 강국으로 바꾸려 했다. 개혁과 전쟁의 비용은 무거운 세금과 인두세(1724년부터 징수)로 농민에게 돌아갔다."
