# 유럽 근세 사건 1차 묶음: 베스트팔렌 체제에서 프랑스 혁명 직전까지 (1648 ~ 1788, 작업 EVD1)
# 범위: 베스트팔렌 체제, 루이 14세의 절대 왕정과 전쟁, 영국 혁명(왕정복고·명예혁명), 오스만의 빈 포위와 카를로비츠 조약,
#   표트르 대제와 대북방 전쟁, 프로이센의 성장(오스트리아 왕위 계승 전쟁·7년 전쟁), 계몽사상과 계몽 군주, 1차 폴란드 분할,
#   영국 산업 혁명의 시작, 미국 독립 혁명의 유럽 쪽.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 지도에 있는 나라가 생기고 끝난 일(프로이센 왕국 1701·영국 1707·사르데냐 왕국 1720·
#   러시아 제국 1721·양시칠리아 1735·코사크 헤트만국 1764·로렌 1766·크림 칸국 1783 등)과 한국사와 닿는 사건을 더함 (docs/REGION_GUIDE.md §5).
# 한국사 묶음(06번)에 이미 있는 사건은 다시 만들지 않고 서술에서만 언급했다: 하멜 표류(1653)·나선 정벌(1654·1658)·시헌력 채택(1653)·
#   홍대용의 연행(1765)·이승훈의 세례(1784). 06번의 하멜 표류에는 네덜란드 공화국, 나선 정벌에는 러시아 차르국을 subjects로 이었다.
# 청교도 혁명(1642~1649)과 1453~1647년 사건은 다음 묶음에서 다룬다(EUROPE_DRAFT.md 7.10).
# 사건 연도 규칙(2026-10-06): subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
#   그래서 기간 중에 나라가 바뀐 사건에는 앞뒤 항목을 함께 넣었다(예: 에스파냐 왕위 계승 전쟁의 잉글랜드와 영국).
# 날짜는 양력(그레고리력). 영국(1752년까지)·러시아는 율리우스력을 썼으므로 날짜가 갈리는 곳은 달까지만 적거나 양력으로 적는다.
# 나라 id는 그때 있던 항목을 쓴다: 1701년 전 브란덴부르크-프로이센 → 프로이센 왕국, 1707년 전 잉글랜드·스코틀랜드 → 영국,
#   1720년 전 사보이아 공국 → 사르데냐 왕국, 1721년 전 러시아 차르국 → 러시아 제국. 바이에른·작센·하노버 등은 신성 로마 제국(영방 묶음).
# places의 year(2026-10-06): 기간이 긴 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다(사건 기간 밖의 해는 적지 않고 이름에 적음, 예: 알바진).
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본). 운영자 검수 필요.

# ── 베스트팔렌 체제와 17세기 중엽 (1648 ~ 1669) ──────────

- id: westphalia-1648
  year: 1648
  title:
    ko: 베스트팔렌 조약과 30년 전쟁의 끝
  summary:
    ko: "보헤미아 반란(1618)에서 시작해 신성 로마 제국의 신교·구교 제후와 덴마크·스웨덴·프랑스가 차례로 뛰어든 30년 전쟁이 1648년 10월 뮌스터와 오스나브뤼크에서 맺은 베스트팔렌 조약으로 끝났다. 오랜 싸움과 약탈, 굶주림, 전염병으로 독일 땅은 크게 황폐해졌는데, 제국 인구가 얼마나 줄었는지는 추산에 따라 약 15%에서 3분의 1 넘게까지 갈린다(지역마다 차이가 큼). 조약은 아우크스부르크 화의(1555)를 이어 칼뱅파도 인정하고, 영방 제후가 황제와 제국을 겨누지 않는 한 외국과 동맹을 맺을 권리를 확인해, 제국은 수백 개 영방의 느슨한 연합이 되었다. 스웨덴은 서포메른·비스마르·브레멘-페르덴을, 프랑스는 메스·툴·베르됭을 확인받고 알자스의 합스부르크 땅을 얻었으며, 브란덴부르크는 동포메른·민덴·할버슈타트를 얻었다. 스위스가 제국에서 벗어난 것도 인정되었고, 같은 해 1월 에스파냐는 뮌스터 조약으로 네덜란드 공화국의 독립을 인정해 80년 전쟁을 끝냈다. 주권 국가들이 모여 조약으로 질서를 정한 이 체제를 흔히 베스트팔렌 체제라 부르며 근대 국제 질서의 출발점으로 본다. 프랑스와 에스파냐의 전쟁은 1659년까지 이어졌다."
  subjects: [holy-roman-empire, habsburg-monarchy, france, sweden-kingdom, spain, dutch-republic, switzerland, brandenburg-prussia]
