# ── 18세기 중엽: 프로이센의 성장과 계몽사상 (1733 ~ 1763) ─────

- id: polish-succession-1733
  year: 1733
  endYear: 1738
  title:
    ko: 폴란드 왕위 계승 전쟁과 빈 조약
  summary:
    ko: "1733년 아우구스트 2세가 죽자 폴란드 귀족 다수는 루이 15세의 장인 스타니스와프 레슈친스키를 다시 왕으로 뽑았으나, 러시아와 오스트리아는 작센 선제후 아우구스트 3세를 밀어 러시아군이 그를 왕위에 앉혔다. 프랑스는 에스파냐·사르데냐와 손잡고 라인강과 이탈리아에서 오스트리아를 공격했다. 러시아군이 단치히를 포위해 함락하자(1734) 스타니스와프는 달아났다. 빈 예비 조약(1735)과 빈 조약(1738)으로 아우구스트 3세가 폴란드 왕으로 인정되었고, 스타니스와프는 로렌 공국을 평생 받아 그가 죽은 1766년 로렌은 프랑스에 합쳐졌다. 대가로 로렌 공작 프란츠 슈테판(마리아 테레지아의 남편)은 메디치 가문이 끊긴 토스카나 대공국을 받았다(1737). 에스파냐 왕자 카를로스는 오스트리아가 가졌던 나폴리와 시칠리아의 왕이 되어 부르봉 왕조를 열었고(1734~1735, 지도에서는 양시칠리아 왕국), 오스트리아는 그 대신 파르마를 받았으며, 사르데냐는 밀라노 서쪽의 노바라·토르토나를 얻었다."
