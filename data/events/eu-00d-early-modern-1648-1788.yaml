- id: austrian-succession-1740
  year: 1740
  endYear: 1748
  title:
    ko: 오스트리아 왕위 계승 전쟁
  summary:
    ko: "아들이 없던 황제 카를 6세는 국사 조칙(1713)으로 딸 마리아 테레지아가 합스부르크 영지 전체를 잇게 하고 여러 나라의 승인을 받아 두었다. 그러나 1740년 10월 카를 6세가 죽자, 같은 해 즉위한 프로이센 왕 프리드리히 2세가 12월 부유한 슐레지엔을 기습 점령했다. 바이에른 선제후 카를 알브레히트는 프랑스·에스파냐·작센의 지원을 받아 상속권을 주장하고 황제 카를 7세로 뽑혔다(1742). 마리아 테레지아는 헝가리 귀족의 지지와 영국·네덜란드의 원조로 버텨 냈으나, 브레슬라우·베를린 조약(1742)과 드레스덴 조약(1745)으로 슐레지엔을 프로이센에 넘겼다. 카를 7세가 죽은 뒤(1745년 1월) 마리아 테레지아의 남편 프란츠 슈테판이 그해 황제(프란츠 1세)로 뽑혔다. 전쟁은 영국과 프랑스의 인도·북아메리카 식민지 싸움으로도 번졌다. 1748년 아헨 조약으로 대부분 전쟁 전 상태로 돌아갔으나, 프로이센의 슐레지엔 차지가 인정되고, 에스파냐 왕자 펠리페가 파르마·피아첸차를, 오스트리아 편에 섰던 사르데냐가 마조레 호수 서쪽 등 밀라노 서부의 땅을 받았다."
  subjects: [habsburg-monarchy, prussia, france, spain, uk, holy-roman-empire, dutch-republic, sardinia, parma-modena-lucca]
