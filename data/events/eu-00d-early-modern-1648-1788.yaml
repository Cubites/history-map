- id: frederick-ii-1740
  year: 1740
  title:
    ko: 프리드리히 2세와 계몽 전제 정치
  summary:
    ko: "1740년 즉위한 프로이센 왕 프리드리히 2세(대왕, 재위 1740~1786)는 볼테르와 편지를 주고받고 포츠담에 그를 머물게 한(1750~1753) 계몽사상의 애호가였다. 그는 군주는 '국가의 첫째 머슴'이라 하며, 즉위하자 고문을 대부분 없애고 종교적 관용을 넓혔으며 사법 개혁과 법전 편찬, 황무지 개간과 감자 재배 장려에 힘썼다. 그러나 귀족(융커)의 특권과 농노제는 그대로 두었고, 군대와 관료제를 키워 영토를 넓히는 데 힘을 쏟았다. 이처럼 군주가 위로부터 개혁해 나라를 강하게 하려 한 정치를 계몽 전제 정치라 한다. 그가 시작한 일반 국법(프로이센 일반 란트법)은 그가 죽은 뒤인 1794년에 공포되었다."
  subjects: [prussia]
  tags: [politics]
  sources: ["프리드리히 2세, 『반마키아벨리론』(1740)", "크리스토퍼 클라크, 『강철왕국 프로이센』(박병화 옮김, 마티, 2020)"]

- id: enlightenment-1748
  year: 1748
  endYear: 1762
  title:
    ko: 계몽사상과 『백과전서』
  summary:
    ko: "18세기 유럽에서는 과학 혁명의 성과를 이어받아 이성으로 낡은 관습과 권위를 비판하고 인류의 진보를 믿는 계몽사상이 퍼졌다. 몽테스키외는 『법의 정신』(1748)에서 입법·행정·사법의 권력 분립을 주장했고, 볼테르는 종교적 관용과 표현의 자유를 내세워 교회와 특권을 비판했다. 디드로와 달랑베르가 펴낸 『백과전서』(1751~1772)는 과학·기술과 새로운 사상을 모아 정부와 교회의 검열 속에서도 널리 읽혔다. 루소는 『사회계약론』(1762)에서 주권은 인민에게 있다는 인민 주권론을 폈다. 경제에서는 케네 등 중농주의자와 애덤 스미스가 국가의 간섭을 줄인 자유로운 경제 활동을 주장했다. 계몽사상은 살롱과 커피하우스, 신문과 책을 통해 퍼져 계몽 전제 군주의 개혁과 미국 혁명, 프랑스 혁명에 영향을 주었다."
  subjects: [france, uk]
  tags: [culture]
  sources: ["몽테스키외, 『법의 정신』(1748)", "장자크 루소, 『사회계약론』(1762)", "디드로·달랑베르 엮음, 『백과전서』(1751~1772)"]

- id: lisbon-earthquake-1755
  year: 1755
  title:
    ko: 리스본 대지진
  summary:
    ko: "1755년 11월 1일 만성절 아침, 포르투갈 앞바다에서 일어난 큰 지진(규모 8.5~9.0으로 추정)과 뒤이은 쓰나미, 화재로 수도 리스본이 크게 파괴되었다. 리스본에서 약 3만~4만 명(포르투갈·에스파냐·모로코를 합치면 약 4만~5만 명)이 죽은 것으로 보이며, 추산의 폭이 크다. 외무·전쟁 담당 국무 장관 세바스티앙 주제 드 카르발류 이 멜루(뒤의 폼발 후작)가 복구를 이끌어, 지진에 견디는 구조를 갖춘 격자형 시가지(바이샤)를 새로 지었다. 이 재난은 '이 세계는 가능한 최선의 세계'라는 낙관론을 두고 논쟁을 일으켜, 볼테르는 「리스본 재난에 관한 시」(1756)와 소설 『캉디드』(1759)로 신의 섭리를 내세운 낙관론을 비판했다. 카르발류는 그 뒤 귀족과 예수회를 누르고 포르투갈과 식민지에서 예수회를 쫓아냈다(1759)."
  subjects: [portugal]
  tags: [society, culture]
  sources: ["볼테르, 「리스본 재난에 관한 시」(1756)", "볼테르, 『캉디드』(1759)"]

- id: seven-years-war-1756
  year: 1756
  endYear: 1763
  title:
    ko: 외교 혁명과 7년 전쟁
  summary:
    ko: "1756년 1월 영국이 프로이센과 손잡자(웨스트민스터 협약), 슐레지엔을 되찾으려던 마리아 테레지아는 재상 카우니츠의 주도로 오랜 적 프랑스와 동맹을 맺었고(5월, 외교 혁명), 러시아의 옐리자베타 여제도 이에 가세했다. 포위될 것을 우려한 프리드리히 2세가 1756년 8월 작센을 먼저 침공하면서 전쟁이 시작되었다. 스웨덴도 프로이센령 포메른으로 쳐들어갔다(포메른 전쟁, 1757~1762). 프로이센은 로스바흐에서 프랑스·제국군을, 로이텐에서 오스트리아군을 이겼으나(1757), 쿠너스도르프에서 러시아·오스트리아군에게 크게 지는 등(1759) 무너지기 직전까지 몰렸다. 1762년 옐리자베타가 죽고 프리드리히를 존경하던 표트르 3세가 즉위해 러시아가 전쟁에서 빠지면서 프로이센은 살아남았다. 1762년에는 프랑스와 손잡은 에스파냐가 영국의 동맹국 포르투갈을 침공했으나, 영국군의 지원을 받은 포르투갈이 막아 냈다. 1763년 2월 후베르투스부르크 조약으로 프로이센은 슐레지엔을 지켰다. 같은 달 파리 조약으로 영국은 프랑스에게서 캐나다와 미시시피강 동쪽을, 에스파냐에게서 플로리다를 얻고 인도에서도 우위를 굳혀(플라시 전투, 1757) 식민지 경쟁에서 이겼다. 그러나 막대한 전쟁 빚은 영국과 프랑스 모두에 짐이 되어 미국 혁명과 프랑스 혁명의 한 배경이 되었다."
