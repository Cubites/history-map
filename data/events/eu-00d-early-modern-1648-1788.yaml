- id: acts-of-union-1707
  year: 1707
  title:
    ko: 잉글랜드와 스코틀랜드의 합병(연합법)
  summary:
    ko: "1603년부터 같은 왕을 모신 잉글랜드와 스코틀랜드는 의회와 법, 교회가 따로였다. 스코틀랜드는 파나마 지협에 식민지를 세우려던 다리엔 계획(1698~1700)이 실패해 큰 손실을 입었고, 잉글랜드는 앤 여왕 뒤 스코틀랜드가 망명한 가톨릭 스튜어트 왕가 쪽 왕을 고를까 우려했다. 두 나라 위원들이 맺은 합병 조약(1706)을 두 의회가 각각 연합법으로 승인해 1707년 5월 1일(율리우스력, 양력 5월 12일) 그레이트브리튼 왕국이 생겼다. 스코틀랜드 의회는 없어지고 런던의 그레이트브리튼 의회에 스코틀랜드 하원 의원 45명과 귀족 대표 16명이 들어갔으며, 스코틀랜드는 장로교 교회와 법률·교육 제도를 지키고 잉글랜드와 식민지에 자유롭게 교역할 수 있게 되었다. 스코틀랜드에서는 반대 여론도 컸고, 스튜어트 왕가를 되살리려는 재커바이트 봉기가 1715년과 1745년에 일어났다(1746년 컬로든 전투에서 진압)."
  subjects: [england, scotland, uk]
  links:
    - { from: england, to: scotland, note: "연합법, 그레이트브리튼 왕국 (1707.5)" }
