- id: louis-xiv-1659
  year: 1659
  endYear: 1661
  title:
    ko: 피레네 조약과 루이 14세의 절대 왕정
  summary:
    ko: "네 살에 즉위한 루이 14세(재위 1643~1715)의 섭정기에, 재상 마자랭의 세금 정책에 맞서 파리 고등 법원과 귀족이 일으킨 프롱드의 난(1648~1653)이 진압되었다. 프랑스는 1659년 피레네 조약으로 에스파냐와의 오랜 전쟁을 끝내고 루시용과 아르투아 등을 얻었으며, 이듬해 루이 14세는 에스파냐 왕녀 마리 테레즈와 결혼했다. 1661년 마자랭이 죽자 루이 14세는 재상을 두지 않고 직접 다스렸다(친정). 그는 왕권은 신이 내려 준 것이라는 왕권신수설을 내세우고, 관료제와 상비군을 키워 귀족과 지방 세력을 눌렀다. 재무 총감 콜베르(1665~)는 관세를 높이고 왕립 매뉴팩처를 키우며 동인도 회사(1664)를 세우는 중상주의 정책으로 재정을 받쳤다. 1682년 궁정을 옮긴 베르사유 궁전은 귀족을 왕 곁에 묶어 두는 무대이자 절대 왕정의 상징이 되었고, 루이 14세는 이 힘으로 영토를 넓히려는 전쟁을 거듭했다."
  subjects: [france, spain]
  links:
    - { from: france, to: spain, note: "피레네 조약, 루시용·아르투아 획득 (1659)" }
  tags: [politics, diplomacy]
  sources: ["「피레네 조약」(1659)", "Peter Burke, The Fabrication of Louis XIV (1992)"]

- id: restoration-1660
  year: 1660
  title:
    ko: 왕정복고
  summary:
    ko: "크롬웰이 죽은 뒤 아들 리처드가 호국경 자리를 지키지 못하고 물러나자(1659), 스코틀랜드 주둔군 사령관 멍크가 런던에 들어와 1648년에 쫓겨난 의원들을 복귀시켜 장기 의회를 되살렸고, 이 의회는 새 선거를 정하고 해산했다(1660년 3월). 망명 중이던 찰스 2세가 브레다 선언(1660년 4월)으로 사면과 종교적 관용, 몰수 토지 문제를 의회에 맡기겠다고 약속하자 새로 뽑힌 컨벤션 의회(왕의 소집 없이 모인 의회)가 그를 왕으로 맞아들였다(1660년 5월). 왕정과 국교회, 귀족원이 되살아났고, 스코틀랜드와 아일랜드도 다시 따로 의회를 둔 왕국이 되었다. 찰스 1세 처형에 가담한 사람들 가운데 일부는 처형되었고, 국교회를 따르지 않는 신교도(비국교도)는 클래런던 법전(1661~1665)으로 차별받았다. 1670년대 말 왕의 가톨릭 동생 제임스의 왕위 계승을 막으려는 쪽(휘그)과 지지하는 쪽(토리)이 맞서면서 정당의 기원이 되었고, 1679년에는 이유 없이 사람을 가두지 못하게 한 인신 보호법이 만들어졌다."
  subjects: [england, scotland, ireland-kingdom]
  tags: [politics]
  sources: ["「브레다 선언」(1660)", "「인신 보호법」(1679)"]

- id: andrusovo-1667
  year: 1667
  title:
    ko: 안드루소보 휴전과 우크라이나의 분할
  summary:
    ko: "페레야슬라우 회의(1654) 뒤 러시아는 폴란드-리투아니아 연방과 전쟁을 벌여 스몰렌스크와 리투아니아 대부분을 점령했다(1654~1655). 흐멜니츠키가 죽은 뒤(1657) 코사크 지도부는 폴란드 쪽과 러시아 쪽으로 갈라져 서로 싸웠고, 우크라이나는 '파멸'이라 불리는 내전과 외국군의 약탈을 겪었다. 1667년 2월 안드루소보 휴전으로 러시아는 스몰렌스크·세베르스크와 드니프로강 왼쪽(동쪽) 우크라이나를 얻고, 키이우도 2년 동안 차지하기로 했다. 드니프로강 오른쪽은 폴란드 땅으로 남았다. 러시아는 키이우를 돌려주지 않았고, 1686년 '영원한 평화' 조약으로 폴란드가 키이우를 러시아 땅으로 인정했다. 동유럽의 힘의 중심이 폴란드에서 러시아로 옮겨 가는 계기가 되었다."
  subjects: [russia-tsardom, polish-lithuanian-commonwealth, cossack-hetmanate]
  links:
