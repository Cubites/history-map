- id: jesuit-suppression-1773
  year: 1773
  title:
    ko: 예수회 해산
  summary:
    ko: "가톨릭 개혁기에 세워진 예수회(1540)는 교육과 해외 선교로 큰 영향력을 가졌으나, 18세기 중엽 왕권 강화를 꾀하던 각국 정부, 계몽사상가들과 부딪쳤다. 포르투갈(1759)·프랑스(1764)·에스파냐와 나폴리(1767) 등이 잇달아 예수회를 쫓아내거나 금지했고, 부르봉 왕가의 압력을 받은 교황 클레멘스 14세는 1773년 예수회를 해산했다. 교황의 명령을 공포하지 않은 프로이센과 러시아에서는 예수회가 남았고, 예수회는 1814년 다시 세워졌다. 중국에서는 마테오 리치 이래 예수회 선교사들이 천문·역법으로 청 조정에서 일했고, 해산 뒤에도 베이징의 옛 예수회 선교사들은 활동을 이어 갔다. 1784년 조선의 이승훈은 베이징 북당에서 프랑스 출신의 옛 예수회 선교사 그라몽에게 세례를 받고 돌아와 조선의 천주교 신앙 공동체를 만들었다."
  subjects: [papal-states, portugal, france, spain, two-sicilies, prussia, russia]
  tags: [culture, politics]
  sources: ["교황 클레멘스 14세, 「주님이시며 구세주」(Dominus ac Redemptor, 1773)", "샤를 달레, 『한국천주교회사』(안응렬·최석우 역주, 분도출판사, 1979~1980)"]

- id: pugachev-1773
  year: 1773
  endYear: 1775
  title:
    ko: 푸가초프의 반란
  summary:
    ko: "1773년 돈 코사크 출신의 예멜리얀 푸가초프가 죽은 황제 표트르 3세를 자칭하며 야이크강(지금의 우랄강) 코사크와 함께 봉기했다. 농노제와 무거운 세금, 징병에 시달리던 농노, 우랄의 광산·공장 노동자, 바시키르 등 비러시아계 민족이 가세해 반란은 볼가강과 우랄 일대로 번졌고, 반란군은 1774년 카잔을 불태웠다. 반란군은 귀족 지주와 관리, 성직자와 그 가족 수천 명을 죽였고, 정부군도 진압 과정과 그 뒤에 반란 가담자를 처형하고 마을을 벌했다. 오스만과의 전쟁을 끝내고 군대를 돌린 정부가 반란을 진압했고, 푸가초프는 1775년 1월 모스크바에서 처형되었다. 예카테리나 2세는 이 뒤 지방 행정을 개편해(1775) 귀족을 통한 지방 지배를 강화했다."
  subjects: [russia]
  tags: [society, war]
  sources: ["니콜라이 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』(조호연 옮김, 까치, 2011)"]
  places: [{ name: "카잔", at: [49.12, 55.79], year: 1774 }]

- id: american-revolution-1775
  year: 1775
  endYear: 1783
  title:
    ko: 미국 독립 혁명과 유럽
  summary:
    ko: "7년 전쟁의 빚을 갚으려는 영국 의회가 인지세법(1765)과 차세 등으로 북아메리카 13개 식민지에 세금을 매기자, 식민지 사람들은 '대표 없이 과세 없다'며 맞섰다. 1775년 4월 렉싱턴·콩코드에서 무력 충돌이 일어났고, 1776년 7월 4일 대륙 회의는 계몽사상의 자연권과 저항권을 담은 독립 선언서를 채택했다. 사라토가 전투(1777)의 승리 뒤 프랑스가 동맹을 맺고 참전했으며(1778), 에스파냐(1779)와 네덜란드(1780)도 영국과 싸웠다. 러시아의 예카테리나 2세가 이끈 무장 중립 동맹(1780)은 중립국 선박에 대한 영국의 단속에 맞섰다. 1781년 요크타운에서 영국군이 항복한 뒤 1783년 9월 파리 조약으로 영국은 미국의 독립을 인정했다. 같은 날 베르사유 조약으로 에스파냐는 메노르카와 플로리다를 되찾았으나, 지브롤터 대포위(1779~1783)는 실패했다. 전쟁에 많은 돈을 쓴 프랑스는 재정 위기에 빠졌고, 혁명에 참여한 라파예트 등을 통해 자유와 공화정의 이상이 유럽에 퍼졌다."
