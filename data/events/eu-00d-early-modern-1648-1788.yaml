- id: great-turkish-war-1684
  year: 1684
  endYear: 1699
  title:
    ko: 대튀르크 전쟁과 카를로비츠 조약
  summary:
    ko: "빈 포위가 풀린 뒤 교황 인노첸시오 11세의 주선으로 황제와 폴란드, 베네치아가 신성 동맹을 맺었고(1684) 러시아도 뒤에 합류했다(1686). 이 무렵의 싸움에서는 양쪽 모두 민간인에게 큰 해를 끼쳤다. 앞서 1683년 빈으로 진군한 오스만군과 크림 타타르군은 오스트리아 마을들을 약탈하고 주민을 죽이거나 노예로 끌고 갔고, 1686년 145년 만에 부다를 되찾은 합스부르크 쪽 군대는 함락 때 무슬림과 유대인 주민 수천 명을 죽였다. 합스부르크군은 모하치 부근(1687)과 젠타(1697, 사보이아의 오이겐 공자)에서 이겼고, 베네치아는 펠로폰네소스(모레아)를 정복했다(1687년 아테네 공격 때 파르테논 신전이 포격으로 크게 부서짐). 1699년 1월 카를로비츠 조약으로 오스만 제국은 바나트를 뺀 헝가리와 트란실바니아를 합스부르크에, 포딜리아를 폴란드에, 모레아와 달마티아 일부를 베네치아에 넘겼다. 러시아는 1696년 표트르 1세가 차지한 아조프를 콘스탄티노폴리스 조약(1700)으로 얻었다. 오스만 제국이 처음으로 넓은 땅을 조약으로 내준 일로, 흔히 오스만 후퇴의 이정표로 본다."
