- id: poltava-1709
  year: 1709
  title:
    ko: 폴타바 전투
  summary:
    ko: "폴란드에서 아우구스트 2세를 물러나게 한 카를 12세는 1708년 모스크바를 향해 러시아로 쳐들어갔다. 러시아군이 땅을 비우며 물러나 보급이 바닥나자 그는 남쪽 우크라이나로 방향을 돌렸고, 뒤따르던 보급 부대는 레스나에서 격파되었다(1708년 10월). 코사크 헤트만 이반 마제파가 러시아에서 벗어나려고 스웨덴과 손잡자, 러시아군은 1708년 11월 헤트만의 수도 바투린을 함락하고 수비대와 주민을 죽였다(희생자 추산 약 9천~1만 5천 명). 스웨덴군도 우크라이나 마을에서 식량과 말을 강제로 거두어 주민의 피해가 컸다. 혹독한 겨울을 나며 약해진 스웨덴군은 1709년 7월 폴타바에서 표트르 1세가 이끈 러시아군에게 크게 졌고, 카를 12세와 마제파는 오스만 제국의 벤데르로 달아났다. 이 전투로 스웨덴의 발트해 패권이 기울고 러시아가 북유럽의 강국으로 올라섰으며, 아우구스트 2세는 폴란드 왕위를 되찾았다. 카를 12세의 부추김을 받은 오스만 제국은 1711년 프루트강에서 표트르의 군대를 포위해 아조프를 되찾았다."
  subjects: [sweden-kingdom, russia-tsardom, cossack-hetmanate, ottoman, polish-lithuanian-commonwealth]
