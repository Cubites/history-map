- id: nerchinsk-1689
  year: 1689
  title:
    ko: 네르친스크 조약
  summary:
    ko: "17세기 러시아의 코사크와 모피 상인은 시베리아를 가로질러 1640년대 흑룡강(아무르강) 유역에 이르렀다. 이들이 원주민에게 모피세를 걷고 약탈하자 청은 이를 막으려 했고, 청의 요청을 받은 조선은 두 차례 조총 부대를 보내 흑룡강·쑹화강 일대에서 러시아군과 싸웠다(나선 정벌, 1654·1658). 러시아가 알바진에 요새를 다시 쌓자(1665) 청의 강희제는 1685년 알바진을 포위해 항복을 받았고, 러시아가 곧 요새를 다시 쌓자 1686년 다시 포위했다. 두 나라는 1689년 네르친스크에서 협상해 아르군강과 스타노보이(외흥안령) 산맥을 경계로 정하고, 알바진을 허물며 교역을 허락하기로 했다. 청 쪽 통역은 예수회 선교사 제르비용과 페레이라가 맡았고 라틴어 문서가 정본이 되었다. 청이 유럽 나라와 맺은 첫 조약으로, 이 국경은 1858년 아이훈 조약 때까지 이어졌다."
  subjects: [russia-tsardom, qing]
