- id: vienna-1683
  year: 1683
  title:
    ko: 오스만 제국의 빈 포위
  summary:
    ko: "합스부르크 지배에 맞선 헝가리 귀족 퇴쾨이 임레가 오스만의 보호를 받자, 이를 계기로 대재상 카라 무스타파 파샤가 이끈 오스만군이 1683년 7월 빈을 포위했다. 크림 칸국의 군대도 함께했다. 두 달 가까운 포위로 성벽이 무너지기 직전이던 9월 12일, 폴란드 왕 얀 3세 소비에스키가 이끈 폴란드군과 로렌 공작 카를 5세의 황제군, 바이에른·작센 등 독일 제후군이 합친 구원군이 빈 서북쪽 칼렌베르크 언덕에서 내려와 오스만군을 무찔렀다. 패전의 책임을 진 카라 무스타파는 그해 12월 베오그라드에서 술탄의 명으로 처형되었다. 오스만 제국이 중부 유럽으로 가장 깊이 들어온 이 공격이 실패하면서 힘의 균형이 합스부르크 쪽으로 기울었다."
  subjects: [ottoman, habsburg-monarchy, polish-lithuanian-commonwealth, holy-roman-empire, crimean-khanate]
