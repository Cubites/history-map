- id: nantes-revocation-1685
  year: 1685
  title:
    ko: 낭트 칙령 폐지와 위그노의 망명
  summary:
    ko: "루이 14세는 '하나의 왕, 하나의 법, 하나의 신앙'을 내세워 1681년부터 군대를 신교도(위그노) 집에 묵게 해 개종을 강요하는 '용기병 박해'로 압박하다가, 1685년 10월 퐁텐블로 칙령으로 앙리 4세의 낭트 칙령(1598)을 폐지했다. 신교 예배와 학교가 금지되고 목사는 추방되었다. 나라를 떠나는 것이 금지되었는데도 약 15만~20만 명의 위그노가 네덜란드·잉글랜드·브란덴부르크·스위스 등으로 빠져나갔다. 브란덴부르크 선제후 프리드리히 빌헬름은 곧바로 포츠담 칙령(1685년 11월, 율리우스력 10월 29일)을 내려 이들을 받아들였고, 숙련 기술자와 상인이 많았던 위그노는 베를린의 산업과 문화를 키웠다. 칙령 폐지는 신교 나라들의 반프랑스 감정을 키웠다."
  subjects: [france, brandenburg-prussia, dutch-republic, england, switzerland]
  links:
