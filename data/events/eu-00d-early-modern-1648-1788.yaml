  tags: [war, diplomacy]
  sources: ["「안드루소보 휴전 조약」(1667)", "「영원한 평화 조약」(1686)", "니콜라이 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』(조호연 옮김, 까치, 2011)"]

- id: candia-1669
  year: 1669
  title:
    ko: 칸디아 함락과 베네치아의 크레타 상실
  summary:
    ko: "오스만 제국은 1645년 베네치아가 다스리던 크레타섬에 상륙해 대부분을 차지했으나, 섬의 중심 도시 칸디아(지금의 이라클리오)는 베네치아와 유럽 각지에서 온 지원군의 방어로 20년 넘게 버텼다. 1656년부터 대재상을 맡은 쾨프륄뤼 가문은 재정과 군대를 다잡아 제국의 힘을 되살렸고, 대재상 쾨프륄뤼 파즐 아흐메트 파샤가 직접 공격을 이끈 끝에 1669년 9월 칸디아가 항복했다. 베네치아는 크레타의 작은 섬 요새 세 곳만 지켰다. 되살아난 오스만의 힘은 뒤에 빈 공격으로 이어졌다."
  subjects: [ottoman, venice]
  links:
    - { from: ottoman, to: venice, note: "크레타 정복, 칸디아 함락 (1669)" }
  tags: [war]
  sources: ["「칸디아 강화」(1669)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
