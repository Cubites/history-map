- id: newton-principia-1687
  year: 1687
  title:
    ko: 과학 혁명과 뉴턴의 『프린키피아』
  summary:
    ko: "16~17세기 코페르니쿠스·케플러·갈릴레이가 지구 중심의 우주관을 무너뜨리며, 관찰과 실험, 수학으로 자연을 설명하려는 과학 혁명이 일어났다. 잉글랜드의 왕립 학회(1660)와 프랑스 과학 아카데미(1666)는 학자들의 연구와 교류를 이끌었다. 1687년 아이작 뉴턴은 『자연 철학의 수학적 원리』(프린키피아)에서 운동 법칙과 만유인력 법칙으로 땅 위와 하늘의 운동을 함께 설명했다. 자연은 이성으로 알 수 있는 법칙을 따른다는 믿음은 18세기 계몽사상의 바탕이 되었다. 17세기 중엽 베이징의 예수회 선교사들은 서양 천문학과 역법을 청에 전했고, 조선은 이를 바탕으로 만든 시헌력을 1653년부터 썼다. 18세기에는 연행 사신을 따라간 조선 학자들이 베이징 천주당의 선교사를 찾아가 서양 과학을 접했다(홍대용, 1765~1766)."
  subjects: [england, france]
  tags: [culture]
  sources: ["아이작 뉴턴, 『프린키피아』(1687)", "스티븐 샤핀, 『과학혁명』(한영덕 옮김, 영림카디널, 2003)"]

- id: glorious-revolution-1688
  year: 1688
  endYear: 1689
  title:
    ko: 명예혁명과 권리 장전
  summary:
    ko: "찰스 2세의 뒤를 이은 가톨릭 신자 제임스 2세는 가톨릭교도를 관직과 군대에 앉히고 상비군을 키웠다. 1688년 6월 그의 아들이 태어나 가톨릭 왕조가 이어질 것을 걱정한 휘그·토리 지도자 일곱 명은 그의 사위인 네덜란드 총독 빌럼 3세(오라녜 공)를 불러들였다. 11월 빌럼이 네덜란드군을 이끌고 잉글랜드 남서부에 상륙하자, 군대가 흩어지는 가운데 제임스 2세는 프랑스로 달아났다. 1689년 2월 의회는 권리 선언을 받아들인 빌럼(윌리엄 3세)과 그의 아내 메리 2세를 공동 왕으로 세웠고, 12월 이를 법으로 만든 권리 장전을 통과시켰다. 권리 장전은 의회의 동의 없는 법의 정지와 과세, 평화 시 상비군 유지를 금하고 의회 선거와 토론의 자유를 보장해 입헌 군주정의 기틀이 되었다. 같은 해 관용법으로 비국교 신교도의 예배가 허용되었다. 큰 유혈 없이 이루어졌다고 해 명예혁명이라 부르지만, 아일랜드와 스코틀랜드에서는 제임스 지지파(재커바이트)와의 싸움이 이어졌다. 명예혁명 직후 나온 존 로크의 『통치론』(1689년 말 출간, 속표지 1690)은 정부는 생명·자유·재산을 지키려는 사람들의 동의로 세워진다고 해, 이 변화를 정당화하는 글로 읽혔다."
  subjects: [england, dutch-republic, scotland, ireland-kingdom, france]
  links:
    - { from: dutch-republic, to: england, note: "빌럼 3세의 상륙 (1688.11)" }
  tags: [politics]
  sources: ["「권리 장전」(1689)", "「관용법」(1689)", "존 로크, 『통치론』(강정인·문지영 옮김, 까치, 1996)"]

- id: nine-years-war-1688
  year: 1688
  endYear: 1697
  title:
    ko: 9년 전쟁과 레이스베이크 조약
  summary:
    ko: "루이 14세는 네이메헌 조약 뒤 법원의 판결을 내세워 국경 지대의 도시와 마을을 차례로 프랑스에 합치고(재통합 정책) 1681년 제국 자유시 스트라스부르를 차지했다. 이에 맞서 황제와 독일 제후, 에스파냐, 스웨덴 등이 아우크스부르크 동맹(1686)을 맺었다. 1688년 9월 프랑스가 라인강 쪽 팔츠를 침공하자 전쟁이 시작되었고, 명예혁명으로 잉글랜드 왕이 된 윌리엄 3세가 이끈 잉글랜드와 네덜란드도 황제와 대동맹(1689)을 맺어 가세했고, 사보이아 공국도 1690년 대동맹에 들어왔다가 1696년 프랑스와 따로 강화했다. 프랑스군은 1689년 하이델베르크·만하임 등 팔츠의 도시와 마을을 불태우고 파괴했다. 전쟁은 아일랜드와 바다, 아메리카 식민지로도 번져, 아일랜드에서는 윌리엄 3세가 보인강 전투(1690)에서 프랑스의 지원을 받은 제임스 2세를 이겼다. 1697년 레이스베이크 조약으로 프랑스는 스트라스부르를 지켰으나 다른 재통합 땅 대부분과 로렌을 돌려주고 윌리엄 3세를 잉글랜드 왕으로 인정했다."
