# ── 계몽 군주와 혁명 직전 (1762 ~ 1788) ──────────────

- id: catherine-ii-1762
  year: 1762
  endYear: 1767
  title:
    ko: 예카테리나 2세의 즉위와 계몽 전제
  summary:
    ko: "독일 작은 공국의 공녀 출신인 예카테리나는 1762년 7월 근위대의 쿠데타로 남편 표트르 3세를 몰아내고 여제가 되었다(표트르 3세는 며칠 뒤 갇힌 채 죽음). 볼테르·디드로와 편지를 주고받은 그는 몽테스키외 등의 사상을 따른 '훈령'(나카스)을 쓰고, 1767년 귀족·도시민·국유지 농민 등의 대표를 모은 법전 편찬 위원회를 열었으나 새 법전은 만들지 못했다. 1764년에는 교회 토지를 국가로 넘기고, 우크라이나의 코사크 헤트만 자리를 없애 자치를 줄였다(1775년 자포로자 시치 해체, 1783년 옛 헤트만국 땅에도 농노제 확대). 귀족에 기대어 다스린 그의 시대에 농노제는 오히려 강해졌고, 1785년 귀족 특권 칙허장으로 귀족의 특권이 보장되었다. 대외적으로는 오스만 제국과 폴란드로 영토를 크게 넓혔다."
  subjects: [russia, cossack-hetmanate]
  links:
    - { from: russia, to: cossack-hetmanate, note: "헤트만 자리 폐지 (1764)" }
