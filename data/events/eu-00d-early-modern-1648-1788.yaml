- id: sardinia-kingdom-1718
  year: 1718
  endYear: 1720
  title:
    ko: 4국 동맹 전쟁과 사르데냐 왕국
  summary:
    ko: "위트레흐트 체제를 뒤집으려던 에스파냐의 펠리페 5세와 재상 알베로니는 1717년 사르데냐, 1718년 시칠리아를 기습 점령했다. 영국·프랑스·오스트리아 등이 4국 동맹(1718)을 맺어 맞섰고, 영국 함대가 시칠리아의 파사로곶 앞바다에서 에스파냐 함대를 무찔렀다(1718). 1720년 헤이그 조약으로 에스파냐는 두 섬에서 물러났고, 시칠리아 왕이던 사보이아 공작 비토리오 아메데오 2세는 시칠리아를 오스트리아에 넘기는 대신 사르데냐를 받았다. 이로써 사보이아 왕가의 나라는 사르데냐 왕국이 되어 토리노를 수도로 피에몬테·사보이아·니스와 사르데냐섬을 다스렸고, 이 나라가 19세기에 이탈리아 통일을 이끌었다."
  subjects: [spain, savoy, sardinia, habsburg-monarchy, uk, france]
