- id: nystad-1721
  year: 1721
  title:
    ko: 뉘스타드 조약과 러시아 제국
  summary:
    ko: "폴타바 패배 뒤에도 버티던 스웨덴은 카를 12세가 노르웨이의 프레드릭스텐 요새를 공격하다 전사하자(1718) 강화에 나섰다. 스톡홀름 조약(1719·1720)으로 하노버에 브레멘-페르덴을, 프로이센에 슈테틴과 포메른 남부를 넘겼고 덴마크와도 강화했다. 러시아 함대가 스웨덴 해안을 거듭 습격한 끝에 1721년 9월 뉘스타드 조약으로 스웨덴은 리보니아·에스토니아·잉그리아와 카렐리야 일부를 러시아에 넘기고 그 대가로 200만 릭스달레르를 받았으며, 러시아가 점령했던 핀란드 대부분을 돌려받았다. 러시아 원로원은 표트르 1세에게 '전 러시아의 황제'와 '대제' 칭호를 바쳤고(1721년 11월), 러시아 차르국은 러시아 제국이 되었다. 스웨덴은 강국의 지위를 잃고 의회가 권력을 쥐는 '자유의 시대'(1719~1772)로 들어섰다."
  subjects: [russia-tsardom, russia, sweden-kingdom, prussia, denmark-norway, holy-roman-empire]
