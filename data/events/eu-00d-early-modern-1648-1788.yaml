- id: narva-1700
  year: 1700
  title:
    ko: 대북방 전쟁의 시작과 나르바 전투
  summary:
    ko: "발트해를 둘러싼 스웨덴의 패권을 꺾으려고 러시아의 표트르 1세, 작센 선제후이자 폴란드 왕인 아우구스트 2세, 덴마크-노르웨이 왕 프레데리크 4세가 동맹을 맺고 1700년 스웨덴을 공격했다(대북방 전쟁, 1700~1721). 열여덟 살의 스웨덴 왕 카를 12세는 먼저 코펜하겐 가까이에 상륙해 덴마크를 전쟁에서 빼낸 뒤(트라벤달 조약, 8월), 11월 에스토니아의 나르바를 포위한 러시아군을 눈보라 속에 기습해 크게 이겼다. 이어 카를 12세는 폴란드로 쳐들어가 1704년 스타니스와프 레슈친스키를 폴란드 왕으로 세우고, 1706년 작센까지 들어가 아우구스트 2세를 폴란드 왕위에서 물러나게 했다(알트란슈테트 조약). 표트르는 나르바의 패배 뒤 교회 종을 녹여 대포를 만들고 군대를 다시 길렀다."
