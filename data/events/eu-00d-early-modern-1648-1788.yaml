- id: joseph-ii-1780
  year: 1780
  endYear: 1790
  title:
    ko: 마리아 테레지아와 요제프 2세의 개혁
  summary:
    ko: "마리아 테레지아는 오스트리아 왕위 계승 전쟁 뒤 행정과 군대, 세제를 고치고 일반 학교령(1774)으로 의무 교육을 도입했다. 1780년 어머니가 죽은 뒤 혼자 다스리게 된 아들 요제프 2세(1765년부터 황제이자 공동 통치자)는 계몽 전제 군주로서 더 과감한 개혁을 폈다. 1781년 관용 칙령으로 신교도와 정교도의 신앙을 허용하고(유대인에게도 1781~1782년 지역별 관용 칙령), 같은 해 보헤미아 등에서 농노의 인신 예속(결혼·이주·직업 선택의 제한)을 없앴다. 관상 수도원 수백 곳을 닫고, 독일어를 행정 언어로 정하며 지방의 특권을 무시한 중앙 집권 개혁을 밀어붙였다. 이에 헝가리 귀족과 오스트리아령 네덜란드(브라반트 혁명, 1789)가 크게 반발했고, 요제프 2세는 죽기 직전(1790) 헝가리에 대한 개혁 대부분을 거두었다. 위로부터의 개혁이 가진 한계를 보여 준 사례로 꼽힌다."
  subjects: [habsburg-monarchy, holy-roman-empire]
  tags: [politics, society]
  sources: ["「관용 칙령」(1781)", "「농노 해방 칙령」(1781)"]

- id: crimea-annexation-1783
  year: 1783
  title:
    ko: 러시아의 크림 칸국 병합
  summary:
    ko: "퀴췩카이나르자 조약(1774)으로 오스만에게서 독립한 크림 칸국은 러시아가 밀어 세운 칸 샤힌 기레이의 개혁에 맞선 반란과 러시아군의 개입이 되풀이되며 사실상 러시아의 영향 아래 놓였다. 1783년 4월 예카테리나 2세는 포툠킨의 건의로 크림 칸국의 병합을 선언했다. 같은 해 동조지아의 카르틀리-카헤티 왕국도 게오르기옙스크 조약으로 러시아의 보호를 받았고, 러시아는 세바스토폴에 흑해 함대의 기지를 세웠다. 같은 해 쿠반의 노가이인이 병합에 맞서 봉기하자 수보로프가 이끈 러시아군이 진압하며 많은 사람을 죽였다. 오스만 제국은 1784년 병합을 인정했으나, 이를 되돌리려고 다시 러시아와 전쟁을 벌였다(1787~1792). 병합 뒤 많은 크림 타타르인이 땅을 잃거나 오스만 제국으로 떠났다. 1800년 무렵까지의 첫 이주 물결은 8만 명을 넘지 않았다는 추산(마르케비치)부터 30만 명이라는 19세기 추산까지 크게 갈린다."
  subjects: [russia, crimean-khanate, ottoman]
  links:
    - { from: russia, to: crimean-khanate, note: "병합 (1783.4)" }
  tags: [politics, war]
  sources: ["「크림 병합 선언」(1783)", "「게오르기옙스크 조약」(1783)", "Alan W. Fisher, The Crimean Tatars (1978)", "А. И. Маркевич, «Переселения крымских татар в Турцию в связи с движением населения в Крыму» (1928)"]
