- id: industrial-revolution-1769
  year: 1769
  title:
    ko: 영국 산업 혁명의 시작
  summary:
    ko: "18세기 영국은 인클로저와 농업 개량으로 식량 생산이 늘고 농촌을 떠난 사람들이 도시로 모였으며, 해외 무역과 식민지로 자본과 시장을 얻었고, 석탄과 철이 풍부했다. 면직물 수요가 늘자 케이의 나는 북(1733)에 이어 하그리브스의 제니 방적기(1764 무렵), 아크라이트의 수력 방적기(1769년 특허), 크럼프턴의 뮬 방적기(1779)가 잇달아 나왔고, 아크라이트는 크롬퍼드에 물레방아로 돌아가는 방적 공장을 세웠다(1771). 제임스 와트는 1769년 뉴커먼의 증기 기관을 개량한 분리 응축기로 특허를 얻었고, 1780년대에는 회전 운동을 내는 증기 기관으로 공장 기계를 돌릴 수 있게 되었다. 기계와 공장 생산이 퍼지며 경제와 사회가 크게 바뀐 이 변화를 산업 혁명이라 한다. 애덤 스미스는 『국부론』(1776)에서 분업과 자유로운 시장이 나라의 부를 늘린다고 주장했다. 공장의 긴 노동 시간과 아동 노동 같은 문제는 19세기에 더 커졌다."
  subjects: [uk]
  tags: [economy, society]
  sources: ["애덤 스미스, 『국부론』(1776)", "E. J. 홉스봄, 『혁명의 시대』(정도영·차명수 옮김, 한길사, 1998)"]

- id: polish-partition-1772
  year: 1772
  title:
    ko: 1차 폴란드 분할
  summary:
    ko: "18세기 폴란드-리투아니아 연방은 귀족 의회의 자유 거부권과 외국의 간섭으로 약해져 있었다. 러시아의 예카테리나 2세는 스타니스와프 아우구스트 포니아토프스키를 왕으로 세우고(1764) 정교도·신교도의 권리 문제를 내세워 내정에 간섭했다. 이에 맞선 귀족들의 바르 연맹(1768~1772)이 진압되는 가운데, 러시아가 오스만과의 전쟁으로 남쪽으로 커지는 것을 경계한 프로이센과 오스트리아가 보상을 요구해, 1772년 8월 세 나라가 폴란드 땅을 나눠 갖기로 합의했다. 연방은 영토의 약 30%와 인구의 약 3분의 1을 잃었다. 프로이센은 단치히·토룬을 뺀 왕령 프로이센(서프로이센)을 얻어 브란덴부르크와 동프로이센을 이었고, 오스트리아는 갈리치아를, 러시아는 폴란드령 리보니아와 드비나강·드니프로강 동쪽의 벨라루스 땅을 얻었다. 폴란드 의회는 1773년 세 나라의 군대가 있는 가운데 분할을 승인했다. 충격을 받은 폴란드에서는 흔히 유럽 최초의 교육부로 불리는 국민 교육 위원회(1773)를 세우는 등 개혁이 시작되었다."
  subjects: [polish-lithuanian-commonwealth, russia, prussia, habsburg-monarchy]
  links:
