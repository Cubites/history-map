- id: navigation-act-1651
  year: 1651
  endYear: 1654
  title:
    ko: 항해법과 영국-네덜란드 전쟁
  summary:
    ko: "17세기 중엽 네덜란드 공화국은 암스테르담을 중심으로 유럽의 해운과 중계 무역을 이끌었고, 네덜란드 동인도 회사(1602)는 바타비아(자카르타)를 거점으로 아시아 무역을 쥐었다. 1651년 잉글랜드 공화국은 아시아·아프리카·아메리카의 상품은 잉글랜드 배로만, 유럽 상품은 잉글랜드 배나 생산국의 배로만 들여오게 한 항해법을 만들어 네덜란드의 중계 무역을 겨냥했다. 이를 계기로 1차 영국-네덜란드 전쟁(1652~1654)이 일어났다. 2차 전쟁(1665~1667) 직전인 1664년 잉글랜드는 북아메리카의 뉴암스테르담을 차지해 뉴욕으로 이름을 바꿨고 브레다 조약(1667)으로 이를 굳혔으며, 3차 전쟁(1672~1674)까지 이어진 경쟁 끝에 바다의 주도권은 점차 영국으로 넘어갔다. 동인도 회사는 일본 나가사키의 데지마에서 유럽 세력으로는 유일하게 무역을 허락받았는데, 1653년 타이완에서 나가사키로 가던 이 회사의 배 스페르베르호가 제주도에 표류했다(하멜 표류)."
  subjects: [england, dutch-republic]
  links:
    - { from: england, to: dutch-republic, note: "항해법, 1차 영국-네덜란드 전쟁" }
  tags: [economy, war]
  sources: ["「항해법」(1651)", "「브레다 조약」(1667)", "헨드릭 하멜, 『하멜 표류기』(김태진 옮김, 서해문집, 2003)"]

- id: deluge-1655
  year: 1655
  endYear: 1660
  title:
    ko: 스웨덴의 폴란드 침공(대홍수)과 올리바 조약
  summary:
    ko: "러시아군이 리투아니아와 벨라루스로 밀고 들어온 가운데(1654~1655), 스웨덴 왕 카를 10세 구스타브도 1655년 폴란드를 침공해 바르샤바와 크라쿠프를 차지했다. 폴란드 역사에서 '대홍수'라 부르는 이 시기에 많은 귀족이 스웨덴 편에 섰으나, 쳉스토호바의 야스나구라 수도원이 포위를 버텨 낸 뒤 저항이 번졌다. 폴란드는 벨라우 조약(1657)으로 프로이센 공국에 대한 종주권을 내놓아 스웨덴 편이던 브란덴부르크 선제후를 자기 편으로 돌렸다. 덴마크가 스웨덴에 선전 포고하자 카를 10세는 얼어붙은 해협을 건너 코펜하겐을 위협해 로스킬레 조약(1658)으로 스코네·블레킹에·할란드·보후슬렌·트뢴델라그·보른홀름을 얻었다. 1660년 올리바 조약으로 폴란드는 리보니아 대부분에 대한 스웨덴의 지배를 인정했고, 같은 해 코펜하겐 조약으로 덴마크는 트뢴델라그·보른홀름을 되찾았다. 연방은 잇단 전쟁과 전염병으로 인구와 경제가 크게 무너졌다."
  subjects: [polish-lithuanian-commonwealth, sweden-kingdom, brandenburg-prussia, denmark-norway, russia-tsardom]
