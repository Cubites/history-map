- id: khmelnytsky-1648
  year: 1648
  endYear: 1654
  title:
    ko: 흐멜니츠키 봉기와 페레야슬라우 회의
  summary:
    ko: "폴란드-리투아니아 연방의 우크라이나 땅에서는 대귀족 영지의 확대와 농민의 부역, 정교회에 대한 압박, 등록 코사크 수의 제한에 대한 불만이 쌓여 있었다. 1648년 자포로자 코사크의 보흐단 흐멜니츠키가 크림 칸국과 손잡고 봉기해 조우티보디·코르순에서 연방군을 무찌르자 봉기는 농민 전쟁으로 번졌다. 봉기군과 농민은 폴란드 귀족과 가톨릭 성직자, 그리고 유대인 공동체를 대거 학살했고(유대인 희생자 추산은 약 2만 명에서 10만 명 넘게까지 크게 갈림), 예레미 비시니오비에츠키 공의 사병 등 연방 쪽 군대도 봉기 지역의 마을을 불태우고 주민을 처형하며 보복했다. 봉기군과 동맹한 크림 타타르군은 싸움터의 주민을 포로(야시르)로 끌고 가 노예로 팔았다. 즈보리우 조약(1649)으로 키이우·브라츨라우·체르니히우 세 주에 코사크 헤트만국이 섰다. 그러나 흐멜니츠키는 베레스테치코에서 지고(1651) 빌라체르크바 조약으로 땅이 줄어들었다. 다시 싸움을 이어 가던 그는 1654년 1월 페레야슬라우 회의에서 러시아 차르 알렉세이의 보호를 받기로 했다. 이 결정의 성격을 두고 우크라이나 쪽은 조건부 보호 동맹으로, 러시아 쪽은 통합으로 해석해 왔다. 이를 계기로 러시아와 폴란드의 전쟁(1654~1667)이 일어났다."
  subjects: [polish-lithuanian-commonwealth, cossack-hetmanate, crimean-khanate, russia-tsardom]
