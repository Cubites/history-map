- id: passarowitz-1716
  year: 1716
  endYear: 1718
  title:
    ko: 파사로비츠 조약
  summary:
    ko: "오스만 제국은 1715년 베네치아에게서 모레아(펠로폰네소스)를 되찾은 데 이어, 베네치아와 동맹한 오스트리아와도 전쟁을 벌였다(1716). 사보이아의 오이겐 공자가 이끈 합스부르크군은 페터바라딘(1716)에서 이기고 테메슈바르(1716)와 베오그라드(1717)를 차지했다. 1718년 7월 파사로비츠 조약으로 오스트리아는 바나트와 베오그라드를 포함한 세르비아 북부, 왈라키아 서부(올테니아), 보스니아 북쪽 기슭을 얻어 동남쪽 영토가 가장 넓어졌다. 베네치아는 모레아를 잃었으나 이오니아 제도를 지키고 달마티아에서 땅을 조금 넓혔다. 이 뒤 오스만 제국에서는 서유럽 문물에 관심을 보인 '튤립 시대'(1718~1730)가 이어졌다."
  subjects: [ottoman, habsburg-monarchy, venice, wallachia]
  links:
