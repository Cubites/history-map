- id: st-petersburg-1703
  year: 1703
  title:
    ko: 상트페테르부르크 건설
  summary:
    ko: "대북방 전쟁 중 스웨덴 땅이던 잉그리아를 점령한 표트르 1세는 1703년 5월 네바강 하구에 페트로파블롭스크 요새를 세우며 상트페테르부르크 건설을 시작했다. 늪지에 도시를 세우려고 해마다 수만 명의 농민과 스웨덴군 포로를 강제로 동원했고, 질병과 고된 노동으로 많은 사람이 죽었다(사망자 추산은 수천 명에서 10만 명까지 크게 갈림). 표트르는 1712년 무렵 수도를 모스크바에서 이곳으로 옮기고 귀족과 상인에게 이주를 명했다. 서유럽식으로 지은 이 도시는 '유럽으로 열린 창'이라 불리며 러시아 서구화의 상징이 되었다. 잉그리아는 뉘스타드 조약(1721)으로 러시아 땅이 되었다."
  subjects: [russia-tsardom, sweden-kingdom]
  links:
    - { from: russia-tsardom, to: sweden-kingdom, note: "잉그리아 점령, 도시 건설 (1703)" }
