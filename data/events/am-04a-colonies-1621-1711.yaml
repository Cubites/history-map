  sources: ["Philip P. Boucher, France and the American Tropics to 1700 (Johns Hopkins University Press, 2008)", "Philip P. Boucher, Les Nouvelles Frances: France in America, 1500–1815 (John Carter Brown Library, 1989)", "Alan Taylor, American Colonies (Viking, 2001)"]

- id: araucania-quilin-1641
  year: 1641
  endYear: 1647
  title:
    ko: "킬린 의회와 마푸체 아라우카니아, 발디비아 재건(1641~1647)"
  summary:
    ko: "마푸체 사람들은 1598년 쿠랄라바 전투 이래 비오비오강 남쪽의 일곱 도시를 무너뜨리고 스페인 군대에 맞서 왔다(「쿠랄라바 전투와 일곱 도시의 파괴(1598~1604)」(앞의 사건)). 스페인은 칠레에서 오랜 아라우코 전쟁을 거듭하며 군비를 감당하기 어려웠고, 유럽에서는 카탈루냐 반란과 맞서야 해 전쟁을 끝내려 했다. 마푸체가 데리고 있던 스페인 포로의 송환도 이 의회에서 시작되었으나 포로 모두가 돌아가기를 원하지는 않았다. 1640년 야이마 화산의 폭발도 양쪽이 평화를 생각하게 한 한 요인이라고 전한다. 1641년 1월 6일 칠레 총독 바이데스 후작이 마푸체 지도자들과 킬린 들판에서 만나 의회를 열고 비오비오강 남쪽을 마푸체의 땅으로 두는 경계를 받아들이는 협정을 맺었으며(이후에도 두 쪽은 몇십 년 간격으로 의회를 열어 협정을 되풀이했다), 마푸체는 외국 세력에 맞서 스페인 왕에게 충성한다는 약속을 했다. 펠리페 4세는 1643년 4월 29일 이 협정을 비준했다. 이 협정이 마푸체의 주권을 인정한 것인지, 스페인 왕에 대한 충성 아래의 자치를 인정한 것인지는 학자마다 해석이 갈리며, 주권이 절대적이지는 않았다는 해석이 널리 받아들여진다. 1643년 네덜란드는 헨드릭 브라우어르의 선단을 보내 발디비아에 닿았으나 마푸체의 호응을 얻지 못했고 곧 물러났다. 이에 놀란 스페인은 페루 부왕령에서 병력과 자금을 대어 1645년 발디비아를 요새로 다시 세웠다. 발디비아는 이 뒤 칠레 안에서도 페루 부왕령에서 재정을 대는 군사 기지로 이어졌다. 처음의 정복은 「발디비아의 칠레 정복과 아라우코 전쟁의 시작(1541~1567)」(앞의 사건)에 있다."
  subjects: [mapuche-araucania, peru-viceroyalty, spain]
  links:
    - { from: spain, to: mapuche-araucania, note: "1641년 킬린 의회에서 비오비오강 남쪽 경계를 받아들이는 협정을 맺음" }
  tags: [diplomacy, war]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Jorge Pinto Rodríguez, La formación del Estado y la nación, y el pueblo mapuche (DIBAM, 2003)", "José Bengoa, Historia del pueblo mapuche (LOM, 2000)"]

- id: pernambuco-1644
  year: 1644
  endYear: 1661
  title:
    ko: "페르남부쿠 반란과 네덜란드령 브라질의 끝, 헤이그 조약(1644~1661)"
  summary:
    ko: "1644년 서인도 회사는 요한 마우리츠를 유럽으로 불러들였고, 같은 해 상루이스의 네덜란드 수비대는 마라냥 주 사람들의 반란에 밀려 물러났다. 1640년 스페인에서 다시 독립한 포르투갈 왕 주앙 4세는 네덜란드와 휴전 중이었으므로 공식으로 반란을 돕지 못했으나, 1645년 6월부터 8월 사이 설탕 농장주들이 반란을 일으켜 헤시피 바깥에서 네덜란드군을 꺾었다. 반란군에는 지주 주앙 페르난드스 비에이라와 함께 흑인 부대를 이끈 엔히크 지아스, 원주민 부대를 이끈 필리피 카마랑 같은 지휘관들이 있어, 포르투갈 사람과 원주민, 아프리카 출신 사람들이 함께 싸웠다. 포르투갈 쪽은 1648년 4월과 1649년 2월 두 차례 과라라페스 전투에서 이겼고, 1648년에는 앙골라의 루안다도 되찾았다. 한편 1652년 영국과 네덜란드가 전쟁에 들어가면서(「항해법과 영국-네덜란드 전쟁」(뒤의 사건)) 본국의 지원이 끊겨 회사는 2년 가까운 포위를 견디지 못하고 1654년 1월 26일 헤시피에서 항복했다. 이로써 네덜란드령 브라질은 끝났고, 같은 1654년 9월 초 유대인 23명이 뉴암스테르담에 닿았는데, 헤시피에서 쫓겨난 사람들이라는 설명이 널리 알려졌으나 경로는 논란이 있다. 1656년 세아라가 마라냥 주에서 떼어져 페르남부쿠 쪽에 붙었고, 포르투갈령 브라질은 북동쪽 해안을 되찾았으며 남쪽 해안에서도 1648년 파라나구아가 도시로 오르는 등 땅을 넓혀 갔다. 1661년 8월 6일 헤이그 조약에서 네덜란드는 브라질에 대한 권리를 포기하고 포르투갈의 주권을 인정했으며, 포르투갈은 보상금을 16년에 걸쳐 치르기로 했다(값은 자료마다 갈려, 포르투갈 화폐로 400만 레이스(200만 카롤리 길더에 해당)라는 서술이 있고 800만 길더로 적은 글도 있다). 식민지 경영을 잃은 네덜란드 상인들은 카리브 해로 설탕 기술을 옮겨 갔다."
  subjects: [dutch-brazil, portuguese-brazil, state-of-maranhao, portugal, dutch-republic]
  links:
    - { from: portugal, to: dutch-brazil, note: "1654년 헤시피의 항복을 받아 네덜란드령 브라질을 끝냄" }
  tags: [war, diplomacy]
  sources: ["C. R. Boxer, The Dutch in Brazil, 1624–1654 (Clarendon Press, 1957)", "Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society (Cambridge University Press, 1985)", "Evaldo Cabral de Mello, Olinda restaurada (Topbooks, 1998)"]
