- id: kirke-quebec-1629
  year: 1629
  endYear: 1632
  title:
    ko: "커크 형제의 퀘벡 점령과 생제르맹앙레 조약(1629~1632)"
  summary:
    ko: "1627년 프랑스의 리슐리외 추기경은 누벨프랑스 캐나다의 개발과 가톨릭 이주민 모집을 100명의 출자자에게 맡긴다는 백인 회사를 세워 15년 동안 이주민 4,000명을 보내기로 약속했으나, 같은 해 라로셸의 개신교도를 둘러싸고 시작된 잉글랜드와 프랑스의 전쟁이 이 계획을 흔들었다. 잉글랜드 상인 집안의 커크 형제 가운데 데이비드 커크는 1628년 세인트로렌스강을 올라가 퀘벡으로 가는 보급선들을 가로막았고, 굶주린 사뮈엘 드 샹플랭의 수비대는 1629년 7월 19일(자료에 따라 20일) 항복했고, 샹플랭은 잉글랜드를 거쳐 프랑스로 돌려보내졌다. 커크는 그 뒤 퀘벡을 모피 교역의 거점으로 삼아 1632년까지 점령을 이어 갔으며, 훗날 1637년에는 뉴펀들랜드 땅을 받아 그곳 정착을 이끌었다. 이 점령은 두 나라가 1629년 4월 24일 수사 조약으로 전쟁을 끝낸 뒤에 일어난 일이어서 프랑스 쪽은 불법이라 보았다. 같은 해 스코틀랜드 이주민도 훗날 노바스코샤라 불릴 땅에 정착을 시도했으나 큰 성과는 없었다. 두 나라는 협상 끝에 1632년 3월 29일 생제르맹앙레 조약을 맺어 퀘벡과 아카디아, 케이프브레턴섬을 프랑스에 돌려주고 점령 때 빼앗은 물자의 보상을 정했다. 이로써 누벨프랑스 캐나다와 아카디아는 프랑스 손에 남았고, 점령 기간 3년 동안 식민지의 인구와 투자는 크게 줄었다고 평가된다. 샹플랭은 1633년 5월 퀘벡으로 돌아와 1635년 12월 25일 숨질 때까지 식민지를 이끌었다. 이 땅은 본래 휴런·알곤킨·미크맥 같은 원주민의 땅이었고, 모피 거래가 그들 사이의 동맹과 다툼의 바탕이었다. 퀘벡의 첫 건설은 「샹플랭의 퀘벡 건설(1608~1615)」(앞의 사건)을 본다."
  subjects: [new-france-canada, acadia, england, france]
  tags: [war, diplomacy]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)", "Gilles Havard·Cécile Vidal, Histoire de l'Amérique française (Flammarion, 2003)"]

- id: dutch-brazil-1630
  year: 1630
  endYear: 1641
  title:
    ko: "네덜란드령 브라질과 요한 마우리츠(1630~1641)"
  summary:
    ko: "서인도 회사는 1624년 사우바도르를 한 해 만에 잃은 뒤 설탕의 중심지인 페르남부쿠로 눈을 돌렸다. 1630년 2월 16일 헨드릭 로엔크가 이끄는 함대가 올린다를 차지했고 3월 3일까지 헤시피와 안토니우 바스섬도 손에 넣어 네덜란드령 브라질이 시작되었다. 포르투갈 쪽 마티아스 드 알부케르키는 내륙에서 버텼으나 1635년 아라이알 두 봉 제주스 요새와 포르투 칼부가 무너지며 저항이 꺾였고, 포르투갈령 브라질은 페르남부쿠를 잃은 채 사우바도르 쪽만 이었다. 1630년대 안에 파라이바와 히우그란지두노르치로 땅이 넓어졌고 세아라도 네덜란드 손에 들어갔다(세아라의 점령 해는 자료마다 1630년대 중반에서 후반으로 갈린다). 1637년 1월 23일 총독으로 온 요한 마우리츠 판 나사우는 헤시피 곁에 마우리츠스타트를 세우고 포르투갈 지주에게도 비교적 관용을 보이며 다리·관측소·기상 관측소를 지었으며, 화가와 학자를 데려와 브라질의 자연을 기록하게 했다. 설탕 공장 상당수를 이어받은 회사는 일손을 아프리카 사람에게서 구했고, 이를 위해 1637년 황금 해안의 엘미나를 차지하고 1641년 앙골라의 루안다도 점령했다. 1640년 포르투갈이 스페인에서 다시 독립하며 1641년 네덜란드와 휴전이 맺어졌으나, 같은 해 회사는 마라냥 주의 상루이스도 점령해 아마존강 어귀에서 상프란시스쿠강까지 펼쳐지는 땅을 얻었다. 헤시피에는 유대인 상인 공동체도 자리 잡아 약 700명(인구의 약 5%)에 이르렀다. 이 흐름은 「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(뒤의 사건)의 노예 무역과 이어지며, 네덜란드 공화국 본국이 아닌 서인도 회사가 이 땅을 다스렸다."
  subjects: [dutch-brazil, portuguese-brazil, state-of-maranhao, dutch-republic]
  links:
    - { from: dutch-republic, to: dutch-brazil, note: "1630년 서인도 회사가 올린다와 헤시피를 점령해 식민지를 시작함" }
  tags: [war, economy, society]
  sources: ["C. R. Boxer, The Dutch in Brazil, 1624–1654 (Clarendon Press, 1957)", "Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society (Cambridge University Press, 1985)", "Evaldo Cabral de Mello, Olinda restaurada (Topbooks, 1998)"]

- id: maryland-1632
  year: 1632
  endYear: 1649
  title:
    ko: "메릴랜드 식민지와 관용법(1632~1649)"
  summary:
    ko: "가톨릭 신자였던 초대 볼티모어 남작 조지 캘버트는 가톨릭 신자를 위한 식민지를 꿈꾸었으나 1632년 4월 숨졌고, 1632년 6월 20일(율리우스력) 찰스 1세는 그의 아들 세실 캘버트(제2대 볼티모어 남작)에게 포토맥강 북쪽 체서피크만 일대를 주는 헌장을 내렸다. 헌장은 영주에게 법을 만들고 관리를 임명할 넓은 권한을 주었다. 왕은 잉글랜드 가톨릭의 피난처를 인정하는 한편 이곳에 영국의 권리를 세워 네덜란드의 북상을 막으려는 속셈도 있었다. 세실은 영국에 머물며 땅을 다스렸고, 동생 레너드 캘버트가 총독으로 1634년 3월 25일 방주호와 비둘기호를 이끌고 세인트클레먼츠섬에 상륙했다. 정착민 대부분은 개신교도였고, 이들은 현지 야오코미코 사람들에게서 옷감·도끼·괭이를 주고 땅을 얻은 뒤 옥수수·콩·호박 농사를 배웠다. 첫 수도는 세인트메리스시티였다. 식민지는 담배 농사로 자리 잡았고, 1631년 체서피크만 케임섬에 교역소를 세운 버지니아의 윌리엄 클레이본은 헌장을 인정하지 않아 1635년 4월 23일 바다에서 싸움이 벌어졌으며 1638년 레너드가 섬을 되찾았고 1644년 반란 때 클레이본이 섬을 다시 차지해 다툼은 1657년에야 정리되었다. 이주민 가운데 많은 사람은 몇 해 동안 일하기로 계약한 계약 노동자였고 1640년대부터는 아프리카에서 끌려온 노예도 들어왔다. 세실 캘버트는 1675년 숨질 때까지 영주였다. 1649년 9월 21일 식민지 의회는 종교에 관한 법(관용법)을 통과시켜 삼위일체를 믿는 그리스도교 신자를 종교 때문에 괴롭히지 못하게 했다. 이는 영국령 아메리카에서 처음으로 종교 관용을 법으로 정한 것으로 평가받지만, 그 범위는 삼위일체를 믿는 사람에 한정되었다."
  subjects: [maryland-colony, england]
  links:
    - { from: england, to: maryland-colony, note: "1632년 헌장으로 볼티모어 남작에게 땅과 통치권을 줌" }
  tags: [politics, religion]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Lois Green Carr·Philip D. Morgan·Jean B. Russo 엮음, Colonial Chesapeake Society (University of North Carolina Press, 1988)", "Russell R. Menard, Migrants, Servants and Slaves: Unfree Labor in Colonial British America (Ashgate, 2001)"]

- id: french-antilles-1635
  year: 1635
  endYear: 1665
  title:
    ko: "프랑스의 앤틸리스·카옌 정착과 생도맹그의 시작(1635~1665)"
  summary:
    ko: "프랑스는 1620년대 세인트키츠에서 카리브 해 진출을 시작했고, 1635년 리슐리외의 아메리카 제도 회사 아래 피에르 벨랭 데스낭뷕이 마르티니크에, 샤를 리에나르 드 올리브와 장 뒤플레시가 과들루프에 정착했다. 이 섬들의 원주민 칼리나고(카리브) 사람들은 싸움과 질병 속에서 점차 밀려났고, 1660년 협정으로 도미니카와 세인트빈센트를 자기 땅으로 인정받았다. 1643년에는 남아메리카 북동 해안의 카옌에 프랑스 식민이 이루어졌는데, 프랑스의 지속적인 정착은 이때 비로소 시작되었다. 이 프랑스령 기아나는 1653년 말 프랑스 정착민이 떠난 뒤 네덜란드가 차지했다가(점령 시작은 1654~1658년으로 자료마다 갈린다) 1664년 5월 15일 프랑스가 되찾았고, 1667년 영국의 짧은 점령을 거치며 어렵게 이어졌다. 한편 이스파니올라섬에서는 스페인이 동쪽의 산토도밍고 총사령부에 눈을 두는 사이 서쪽의 토르투가섬과 북쪽 해안에 프랑스·영국·네덜란드 사람들이 모여들었다. 이들 가운데 사냥으로 소를 잡아 훈제 고기를 팔던 부카니에르와 약탈에 나선 버커니어의 근거지 토르투가는 1625년 프랑스 사람들이 자리 잡았고 1659년 루이 14세 아래에서 공식 식민지가 되었다. 1664년 프랑스 서인도 회사가 세워지고 이듬해 1665년 베르트랑 도주롱이 토르투가와 이스파니올라 서쪽 해안의 총독이 되어 담배 농사와 이주를 이끌면서 오늘날 생도맹그의 바탕이 놓였다. 프랑스의 지배는 1697년 레이스베이크 조약에서 스페인이 섬 서쪽 3분의 1을 프랑스 땅으로 인정하면서 굳었고, 이 조약은 「9년 전쟁과 레이스베이크 조약」(뒤의 사건)에서 다룬다. 1640년대부터 마르티니크와 과들루프에는 네덜란드 상인을 거쳐 사탕수수가 퍼졌고, 이들 설탕 섬의 일손은 계약 노동자에서 아프리카 노예로 바뀌어 갔다."
  subjects: [french-guiana, saint-domingue, santo-domingo-captaincy, france]
  links:
    - { from: france, to: saint-domingue, note: "1665년 도주롱을 총독으로 보내 이스파니올라 서쪽 해안을 다스림" }
    - { from: france, to: french-guiana, note: "1643년 카옌에 식민을 시작함" }
