- id: carolina-bahamas-1663
  year: 1663
  endYear: 1670
  title:
    ko: "캐롤라이나 영주 식민지와 바하마(1663~1670)"
  summary:
    ko: "스튜어트 왕조가 복고된 잉글랜드 왕국에서 찰스 2세는 왕의 편에 선 귀족 여덟 명(클래런던 백작, 앨버말 공작 조지 몽크, 크레이븐 백작, 존 버클리, 윌리엄 버클리, 조지 카터릿, 존 콜턴, 앤서니 애슐리 쿠퍼)을 영주로 삼아 1663년 3월 24일(율리우스력) 캐롤라이나 식민지(라틴어로 찰스를 뜻하는 카롤루스에서 딴 이름)의 헌장을 주었고, 1665년 6월 30일 제2차 헌장으로 경계가 북위 36도 30분에서 29도까지로 넓어졌다. 이들 가운데 애슐리 경(훗날 샤프츠베리 백작) 앤서니 쿠퍼는 1669년 철학자 존 로크의 도움을 받아 캐롤라이나 기본 헌법을 만들어 귀족 제도와 큰 농장 중심의 사회를 그렸으나, 이 헌법은 노예 소유자에게 노예에 대한 절대적 권한을 준다는 조항도 담았고 실제로는 거의 시행되지 않았다. 북쪽에서는 버지니아 사람들이 1653년 무렵부터 앨버말 정착지를 이루어 살고 있었고, 남쪽에서는 1670년 바베이도스에서 온 이주민이 애슐리강 하구에 닿아 찰스타운을 세웠다(1680년 지금의 반도로 옮겼다). 찰스타운은 바베이도스 사람들의 농장 기술을 바탕으로 쌀과 가죽, 그리고 원주민 포로를 붙잡아 카리브 해로 파는 교역으로 커져 갔는데, 포로 수는 수만 명으로 추산된다. 같은 1670년 영주들은 바하마 제도에 대한 특허도 받았다. 바하마에는 1648년 버뮤다에서 종교 문제로 떠나온 엘류세라 모험 상인들이 섬 하나에 정착해 있었고, 원래 살던 루카요 사람들은 16세기 초 스페인이 이스파니올라로 끌고 가면서 거의 사라진 뒤였다. 캐롤라이나의 남북 분리는 「투스커로라·야마시 전쟁과 캐롤라이나의 분리, 조지아 식민지(1711~1733)」(뒤의 사건)에서 이어진다."
  subjects: [province-of-carolina, bahamas, england]
  links:
    - { from: england, to: province-of-carolina, note: "1663년 헌장으로 여덟 영주에게 캐롤라이나 땅을 줌" }
    - { from: england, to: bahamas, note: "1670년 캐롤라이나 영주들에게 바하마 제도의 특허를 줌" }
  tags: [politics, society]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Alan Gallay, The Indian Slave Trade: The Rise of the English Empire in the American South, 1670–1717 (Yale University Press, 2002)", "Michael Craton·Gail Saunders, Islanders in the Stream: A History of the Bahamian People, vol. 1 (University of Georgia Press, 1992)"]

- id: breda-1664
  year: 1664
  endYear: 1667
  title:
    ko: "뉴네덜란드의 끝과 브레다 조약: 뉴욕·뉴저지와 수리남(1664~1667)"
  summary:
    ko: "1664년 3월 잉글랜드 왕국의 찰스 2세는 아우 요크 공작 제임스에게 허드슨강과 델라웨어강 일대를 주었고, 공작은 그해 6월 허드슨강과 델라웨어강 사이 땅을 존 버클리와 조지 카터릿에게 다시 나누어 주어 뉴저지 식민지의 바탕이 되었다. 같은 해 영국 함대가 뉴암스테르담 앞바다에 나타나자 1647년부터 뉴네덜란드를 이끈 총독 페터르 스타위베산트는 인구 1,500명 안팎의 도시를 두고 싸우지 않고 1664년 9월 8일(율리우스력 8월 29일) 항복했다. 항복 조건 문서는 9월 6일(율리우스력 8월 27일)에 서명되었고, 도시는 요크 공작의 이름을 따 뉴욕이 되었으며 뉴네덜란드는 뉴욕 식민지로 넘어갔다. 항복 조건은 주민의 재산과 신앙을 보장하는 것이었다. 영국은 올버니를 비롯한 상류 마을까지 차지했고, 델라웨어강 쪽 네덜란드 정착지도 함께 영국 손에 들어갔다. 이 일은 영국과 네덜란드의 전쟁(「항해법과 영국-네덜란드 전쟁」(앞의 사건))으로 번졌는데, 남아메리카에서는 1667년 2월 네덜란드 함대가 영국 정착지를 쳐서 수리남을 차지했다. 1667년 7월 31일 브레다 조약은 점령한 땅을 그대로 두는 원칙을 따라 영국이 뉴네덜란드를, 네덜란드가 수리남을 가지게 하여 흔히 뉴욕과 수리남의 맞바꿈이라 부른다. 같은 조약에서 영국은 1654년에 차지했던 아카디아를 프랑스에 돌려주기로 했으나 실제 반환은 1670년으로 늦어졌다. 네덜란드는 1673년 뉴욕을 다시 점령했다가 1674년 웨스트민스터 조약으로 도로 돌려주었다. 뉴저지 식민지와 뉴욕 식민지의 원주민 땅은 레나페와 이로쿼이 연맹의 영향 아래 있던 곳이었다. 이로써 뉴네덜란드는 끝났으며, 네덜란드가 지킨 수리남에서는 설탕 농장과 노예 노동이 자라났다."
  subjects: [new-netherland, province-of-new-york, province-of-new-jersey, dutch-suriname, england, dutch-republic]
  links:
    - { from: england, to: new-netherland, note: "1664년 스타위베산트의 항복을 받아 뉴네덜란드를 차지함" }
    - { from: dutch-republic, to: dutch-suriname, note: "1667년 수리남을 점령하고 브레다 조약으로 지킴" }
  tags: [war, diplomacy]
  sources: ["Russell Shorto, The Island at the Center of the World (Doubleday, 2004)", "Jonathan Israel, The Dutch Republic: Its Rise, Greatness, and Fall 1477–1806 (Oxford University Press, 1995)", "Alan Taylor, American Colonies (Viking, 2001)"]

- id: hbc-1670
  year: 1670
  endYear: 1686
  title:
    ko: "허드슨 베이 회사와 루퍼츠랜드(1670~1686)"
  summary:
    ko: "프랑스 모피 상인 피에르에스프리 라디송과 메다르 데 그로세예는 크리 사람들에게서 슈피리어호 북쪽과 서쪽이 모피가 많은 땅이고 그 북쪽에 얼어붙은 바다가 있다는 이야기를 들었다. 프랑스 당국이 이들의 계획을 받아들이지 않자 두 사람은 잉글랜드 왕당파 귀족과 상인의 후원을 얻어 1668년 6월 선단을 보냈고, 그 가운데 재커라이어 길럼이 지휘한 논서치호가 제임스만에 닿아 1668년 찰스 요새(훗날 루퍼트 하우스)를 세운 뒤 1669년 10월 모피를 싣고 돌아왔다. 1670년 5월 2일(율리우스력) 찰스 2세는 허드슨만에서 교역하는 잉글랜드 모험 상인들의 총독과 회사에 허드슨만으로 흘러드는 모든 강 유역에 대한 교역 독점권을 주는 특허장을 내렸다. 후원자였던 왕의 사촌 루퍼트 공이 회사의 첫 총독이 되었고, 그의 이름을 딴 땅이 루퍼츠랜드다. 회사는 왕실이 아니라 런던의 귀족과 상인 출자자들이 소유했다. 특허가 가리킨 범위는 오늘날 캐나다의 3분의 1이 넘는 약 386만 제곱킬로미터에 달했지만, 이 땅은 실제로는 크리를 비롯한 원주민의 땅이었고 회사는 해안에 교역소를 두어 비버 가죽을 사들이는 방식으로 활동했고, 크리 사람들은 내륙의 다른 부족과 회사를 잇는 중개 상인 구실을 했다. 교역소는 1668년의 루퍼트 하우스에 이어 1673년 무스 팩토리, 1679년 올버니 요새, 1684년 허드슨만 서쪽의 요크팩토리로 이어졌다. 누벨프랑스 캐나다는 이를 위협으로 보아 1686년 3월 슈발리에 드 트루아가 이끈 원정대가 육로로 1,300킬로미터를 넘어 제임스만의 회사 교역소들을 빼앗았고, 이 땅은 「위트레흐트 조약과 라슈타트 조약」(뒤의 사건)에서야 영국에 확정되었다."
  subjects: [ruperts-land, england, new-france-canada]
  links:
    - { from: england, to: ruperts-land, note: "1670년 특허장으로 허드슨 베이 회사에 허드슨만 유역의 독점권을 줌" }
  tags: [economy, politics]
  sources: ["E. E. Rich, The History of the Hudson's Bay Company 1670–1870, vol. 1 (Hudson's Bay Record Society, 1958)", "Arthur J. Ray, Indians in the Fur Trade (University of Toronto Press, 1974)", "Peter C. Newman, Company of Adventurers (Viking, 1985)"]

- id: bandeirantes-palmares-1671
  year: 1671
  endYear: 1709
  title:
    ko: "반데이란치와 팔마르스의 끝, 미나스제라이스의 금(1671~1709)"
  summary:
    ko: "상파울루를 중심으로 한 포르투갈령 브라질의 개척자 반데이란치는 17세기 내내 내륙으로 원정을 떠나 원주민을 붙잡아 노예로 팔거나 금과 은을 찾았다. 예수회와 상파울루 사람들의 갈등은 1640년 예수회 추방 소동으로 번진 적도 있다. 그들의 원정은 남쪽의 예수회 선교 마을 지역과 북쪽 내륙까지 뻗었으며, 1674년 무렵에는 가축 목장이 상프란시스쿠강을 따라 피아우이까지 퍼졌다. 북동쪽 페르남부쿠 내륙의 팔마르스는 17세기 초부터 도망친 노예들이 만든 공동체로, 인구는 약 1만 1천 명에서 2만 명 사이로 추산된다. 1676~1677년 포르투갈 쪽의 공격을 받은 지도자 강가 줌바가 1678년 무렵 평화에 합의했으나 조카 줌비를 따르는 쪽의 반발로 무너졌고, 포르투갈은 1680년부터 1686년까지 여섯 차례 원정을 보냈으나 모두 실패했다. 줌비는 포르투갈의 조건을 거부하고 싸움을 이어 갔다. 1694년 초 도밍구스 조르즈 벨류가 이끄는 상파울루 출신 반데이란치와 베르나르두 비에이라 지 멜루의 원정대가 중심지 세르카 두 마카쿠를 무너뜨렸고, 줌비는 1695년 11월 20일 배신으로 붙잡혀 목이 잘렸다. 한편 1690년대 중반 상파울루 사람들은 내륙에서 금을 찾아냈고(처음 발견된 해는 자료마다 1693년에서 1698년 사이로 갈린다), 몰려든 포르투갈 이주민과 상파울루 사람들 사이에 1707년부터 1709년까지 엠보아바스 전쟁이 일어났다. 1709년 왕실은 상파울루와 미나스두오루 카피타니아를 세워 광산 지대를 직접 다스리기 시작했다. 이 금은 이후 노예 노동으로 채굴되었으며, 노예 무역의 흐름은 「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(앞의 사건)과 이어진다."
  subjects: [portuguese-brazil]
  tags: [society, war, economy]
  sources: ["Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society (Cambridge University Press, 1985)", "John Monteiro, Negros da terra: Índios e bandeirantes nas origens de São Paulo (Companhia das Letras, 1994)", "Charles R. Boxer, The Golden Age of Brazil, 1695–1750 (University of California Press, 1962)"]

- id: mississippi-1673
  year: 1673
  endYear: 1699
  title:
    ko: "마르케트·졸리와 라살의 미시시피강, 프랑스령 루이지애나의 시작(1673~1699)"
  summary:
    ko: "1673년 5월 17일 예수회 사제 자크 마르케트와 상인 루이 졸리는 누벨프랑스 캐나다에서 출발해 위스콘신강을 따라 미시시피강에 닿았고, 강을 따라 내려가 아칸소강 어귀 근처에서 이 강이 멕시코만으로 흐른다는 확신을 안은 채 돌아섰다. 마르케트는 도중에 일리노이 사람들에게서 환대를 받았다고 적었고 1675년 귀환길에 숨졌다. 프랑스의 모피 상인이자 탐험가 르네로베르 카블리에 드 라살은 1682년 4월 9일 미시시피강 하구에 이르러 강 유역 전체를 루이 14세의 이름을 따 루이지애나라 부르며 프랑스 땅이라고 선언했고(1683년 프랑스로 돌아간 그는 하구에 식민지를 세울 계획을 왕에게 올렸다), 이 선언이 프랑스령 루이지애나의 시작이다. 이 땅에는 일리노이·쿼포·나체즈 같은 원주민이 살고 있었다. 라살은 1684년 프랑스에서 배 네 척과 이주민 300명 안팎을 이끌고 출발해 미시시피강 하구를 찾으려 했으나 해적과 난파로 배를 잃고 지금의 텍사스 해안에 내려 1685년 2월 이른바 생루이 요새를 세웠다. 식민지는 배가 진흙에 가라앉고 질병과 원주민과의 충돌이 이어지면서 무너졌고, 1687년 3월 19일 라살은 부하 피에르 뒤오에게 피살되었다. 스페인은 프랑스의 이 시도를 경계해 텍사스 선교를 서둘렀다. 1699년 피에르 르무안 디베르빌이 이끈 원정대가 3월 미시시피강 하구를 확인하고 4월 빌럭시 만에 모르파 요새를 세웠고, 동생 장바티스트 르무안 드 비엔빌이 부지휘관으로 함께했다. 이로써 이 땅에 처음으로 지속적인 프랑스 정착지가 마련되었다. 이 땅의 뒤를 이은 사건으로 「크로자의 특허와 미시시피 회사, 뉴올리언스 건설(1712~1722)」(뒤의 사건)이 있다."
  subjects: [french-louisiana, new-france-canada, france]
  links:
    - { from: france, to: french-louisiana, note: "1682년 라살이 미시시피강 유역을 프랑스 땅으로 선언함" }
  tags: [politics, society]
  sources: ["W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)", "Alan Taylor, American Colonies (Viking, 2001)", "Daniel H. Usner Jr., Indians, Settlers, and Slaves in a Frontier Exchange Economy (University of North Carolina Press, 1992)"]

- id: king-philips-1675
  year: 1675
  endYear: 1692
  title:
    ko: "필립 왕 전쟁과 뉴햄프셔 식민지, 매사추세츠 새 헌장(1675~1692)"
  summary:
    ko: "왐파노아그의 지도자 메타콤(영국 사람들이 필립 왕이라 부른 사람)은 1661년 아버지 마사소잇이 죽은 뒤 형 왐수타(영국 이름 알렉산더)가 이었으나 이듬해 숨져, 1662년 지도자가 된 뒤 늘어나는 영국인 정착촌 때문에 땅과 자치를 잃어 가고 있었다. 전쟁 전 뉴잉글랜드의 영국인 이주민은 6만 5천 명 안팎이었고, 원주민 인구는 이미 전염병으로 크게 줄어 있었다. 1675년 6월 영국 법정이 세 왐파노아그 사람을 교수형에 처하자 6월 20일(율리우스력) 스완지 습격으로 전쟁이 시작되었다. 12월 19일 식민지 연합군이 내러갠싯의 큰 늪 요새를 불살라 600명 안팎을 죽였고, 메타콤은 1676년 8월 12일 마운트호프에서 죽었으며 전쟁은 메인에서 1678년 4월 12일 캐스코 조약으로 끝났다. 식민지 쪽 사망은 600~800명(자료에 따라 1,000명가량까지), 원주민 쪽 사망은 약 3,000명으로 어림되며(처형·노예 포함 여부와 추산마다 갈린다), 인구 대비로는 미국 역사에서 가장 치명적인 전쟁으로 꼽힌다. 식민지 마을 열두 곳이 무너졌다. 붙잡힌 원주민 수백 명은 처형되거나 노예로 팔려 갔다. 전쟁이 끝난 뒤 영국 왕은 뉴잉글랜드에 직접 손을 뻗기 시작해 1679년 뉴햄프셔를 매사추세츠에서 떼어 왕령 식민지 뉴햄프셔로 만들었다. 1686년 5월 조지프 더들리를 의장으로 세워 출범한 뉴잉글랜드 자치령은 그해 12월 20일 부임한 에드먼드 앤드로스 총독 아래 매사추세츠·플리머스 등을 하나로 묶었으나, 1688~1689년 명예혁명 소식에 보스턴 사람들이 1689년 4월 18일 봉기해 앤드로스를 몰아냈다. 1691년 10월 새 헌장은 매사추세츠만 식민지에 플리머스와 메인을 합쳐 왕이 총독을 임명하는 매사추세츠 주로 바꾸었고, 1692년 세일럼 마녀재판에서 19명이 교수형을 당했다. 1689년부터는 「9년 전쟁과 레이스베이크 조약」(뒤의 사건)과 이어진 윌리엄 왕 전쟁이 변경을 흔들었다."
  subjects: [new-hampshire, massachusetts-bay, england]
  links:
    - { from: england, to: new-hampshire, note: "1679년 왕령 식민지로 뉴햄프셔를 매사추세츠에서 떼어 냄" }
  tags: [war, politics]
  sources: ["Jill Lepore, The Name of War: King Philip's War and the Origins of American Identity (Alfred A. Knopf, 1998)", "Alan Taylor, American Colonies (Viking, 2001)", "Daniel R. Mandell, King Philip's War: Colonial Expansion, Native Resistance, and the End of Indian Sovereignty (Johns Hopkins University Press, 2010)"]
