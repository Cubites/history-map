  tags: [war, politics, religion]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Andrew Lipman, The Saltwater Frontier: Indians and the Contest for the American Coast (Yale University Press, 2015)", "Francis J. Bremer, John Winthrop: America's Forgotten Founding Father (Oxford University Press, 2003)"]
