- id: new-england-1629
  year: 1629
  endYear: 1641
  title:
    ko: "매사추세츠만 식민지와 코네티컷, 피쿼트 전쟁(1629~1641)"
  summary:
    ko: "플리머스에 이은 청교도 식민은 1629년 3월 4일(율리우스력, 당시 잉글랜드 연도로는 1628년) 왕 찰스 1세가 매사추세츠만 회사에 헌장을 주면서 크게 열렸다. 회사의 이사진이 영국을 떠나 헌장을 새 땅으로 가져갈 수 있었기에 식민지는 사실상 스스로 다스리는 신앙 공동체가 되었다. 1630년 존 윈스럽이 이끈 선단이 700명 넘는 사람을 싣고 도착해 세일럼에 닿은 뒤 보스턴을 세웠고, 이후 10년 동안 청교도 약 2만 명이 매사추세츠와 이웃 식민지로 건너온 이른바 대이주가 이어졌다(이주 규모는 자료마다 갈린다). 교회 문제로 1635년 쫓겨난 로저 윌리엄스는 이듬해 프로비던스를 세웠고, 코네티컷강 유역에는 윈저와 웨더스필드 같은 마을이 먼저 생겨 있었으며, 같은 무렵 토머스 후커의 신도들은 코네티컷강 유역으로 옮겨 하트퍼드를 세워 1636년 코네티컷 식민지가 시작되었으며, 1639년 코네티컷 기본 조례를 만들었다. 이 땅은 본디 피쿼트·모히건 같은 원주민의 땅이었다. 1636년 매사추세츠 쪽의 보복 원정으로 긴장이 높아지자 전쟁이 일어났고, 1637년 5월 26일 식민지 군대와 모히건(운커스)·내러갠싯 동맹군은 미스틱의 피쿼트 요새를 불태워 수백 명(추산 약 500명)을 죽였다. 전쟁이 끝난 1638년 9월 21일 하트퍼드 조약은 살아남은 피쿼트 사람들을 모히건과 내러갠싯에 나누어 맡기고 피쿼트라는 이름을 쓰지 못하게 했다. 매사추세츠만 식민지는 1641년 뉴햄프셔의 마을들을 자기 아래에 두었고 그해 시민과 형사 법규 백 가지를 담은 자유 법전을 채택했다. 플리머스 쪽은 「메이플라워 서약과 플리머스 식민지(1620~1627)」(앞의 사건)를 본다."
  subjects: [massachusetts-bay, connecticut-colony, england]
  links:
