- id: tuscarora-georgia-1711
  year: 1711
  endYear: 1733
  title:
    ko: "투스커로라·야마시 전쟁과 캐롤라이나의 분리, 조지아 식민지(1711~1733)"
  summary:
    ko: "캐롤라이나 식민지 북쪽에서는 1710년 스위스·팔라틴 이주민이 뉴번을 세우는 등 정착촌이 넓어지며 투스커로라 사람들의 땅이 줄어들었고, 1711년 9월 투스커로라 사람들이 변경을 습격하면서 투스커로라 전쟁이 시작되었다. 이웃 사우스캐롤라이나가 원주민 동맹군을 모아 1712년과 1713년 두 차례 원정을 보내 전쟁을 끝냈고, 투스커로라 사람들은 이후 북쪽으로 올라가 1722년 이로쿼이 연맹의 여섯 번째 민족으로 받아들여졌다. 전쟁에서 투스커로라 사람 다수가 죽거나 노예로 팔렸다. 이 사이 1712년에는 캐롤라이나 식민지의 남북에 따로 총독이 두어져 노스캐롤라이나 식민지와 사우스캐롤라이나 식민지가 나뉘었다. 1715년 4월 15일 포코탈리고에서 야마시 사람들이 캐롤라이나 사절을 죽이면서 야마시 전쟁이 터져 1717년까지 이어졌다. 크리크 사람들이 야마시와 손잡아 큰 위협이 되었으나 1716년 체로키가 영국 쪽에 서면서 판세가 바뀌었다. 사우스캐롤라이나 정착민의 약 7퍼센트가 죽었고 현지에 나가 있던 상인 약 100명 가운데 90명이 첫 몇 주 안에 목숨을 잃었으며, 야마시는 첫해에 인구의 4분의 1가량을 잃었다. 영국 정착민과 그 동맹이 1715년까지 노예로 삼은 원주민은 최대 5만 명으로 추산되며, 이 교역은 「캐롤라이나 영주 식민지와 바하마(1663~1670)」(앞의 사건)에서 본 찰스타운에서 시작되었다. 영주들의 방어 실패로 1719년 정착민이 영주 정부를 뒤엎었고 1729년 영주 일곱 명이 지분을 왕에게 팔아 두 식민지는 왕령이 되었다. 한편 영국은 스페인령 플로리다에 맞서는 방벽으로 1732년 6월 조지아 헌장을 주었고, 제임스 오글소프가 1733년 2월 서배너를 세웠다. 이렇게 캐롤라이나 식민지는 사라지고 조지아 식민지가 시작되었다."
  subjects: [province-of-carolina, north-carolina, south-carolina, province-of-georgia, uk]
