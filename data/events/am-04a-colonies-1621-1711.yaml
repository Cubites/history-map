- id: pueblo-revolt-1680
  year: 1680
  endYear: 1697
  title:
    ko: "푸에블로 반란과 북쪽 선교 변경: 피메리아알타·바하칼리포르니아(1680~1697)"
  summary:
    ko: "누에바에스파냐 부왕령의 북쪽 끝 뉴멕시코에서는 1598년 후안 데 오냐테가 들어온 이래 푸에블로 사람들이 스페인의 엔코미엔다와 강제 노동, 가톨릭 개종 강요, 고유 종교 탄압을 겪어 왔다(오냐테가 닿을 무렵 푸에블로 인구는 약 4만 명으로 추산된다). 산후안 푸에블로의 종교 지도자 포페는 여러 푸에블로를 묶어 1680년 8월 11일 봉기를 계획했으나 계획이 새어 나가 하루 앞선 8월 10일 반란이 터졌다. 스페인 사람 약 400명(여성과 아이 포함)이 죽었고 그 가운데는 뉴멕시코 프란치스코회 선교사 33명 중 21명이 들어 있었으며, 푸에블로 쪽도 600명 넘게 숨졌다. 총독 안토니오 데 오테르민은 살아남은 사람들을 이끌고 8월 21일 남쪽 엘파소델노르테로 물러났고, 9월 6일 소코로에서 모인 생존자는 1,946명(그 가운데 약 500명은 원주민 노예)이었다. 난민 일부는 엘파소 근처에 정착했고, 스페인이 두고 간 말은 푸에블로를 거쳐 대평원 쪽 집단으로 퍼져 갔다는 평가가 있다. 뉴멕시코는 12년 동안 푸에블로 사람들의 손에 있었고, 1692년 9월 13일 디에고 데 바르가스가 산타페에 들어가 이튿날 재정복을 선언했으며, 1693년 12월 다시 돌아와 푸에블로 전사 70명을 처형하고 여성과 아이 약 400명을 10년 동안 노예로 삼았다. 1696년에는 푸에블로 열네 곳이 다시 반란을 일으켜 선교사 5명과 이주민 34명이 죽었다. 이 무렵 북서쪽 변경에서는 예수회 사제 에우제비오 키노가 1687년 소노라 북쪽 피메리아알타에 선교 마을을 세웠고, 1697년에는 후안 마리아 데 살바티에라가 바하칼리포르니아에 로레토 선교를 열었다."
  subjects: [new-spain-viceroyalty]
  tags: [war, religion, society]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Andrew L. Knaut, The Pueblo Revolt of 1680: Conquest and Resistance in Seventeenth-Century New Mexico (University of Oklahoma Press, 1995)", "David J. Weber, The Spanish Frontier in North America (Yale University Press, 1992)"]
  places: [{ name: 푸에블로 반란, at: [-105.94, 35.69], year: 1680 }]

- id: colonia-sacramento-1680
  year: 1680
  endYear: 1737
  title:
    ko: "콜로니아델사크라멘토와 브라질의 남쪽 경계(1680~1737)"
  summary:
    ko: "포르투갈은 스페인의 부에노스아이레스 맞은편 라플라타강 건너편에 발판을 마련하려고 마누엘 로부가 이끈 원정대를 보냈고, 이들은 1680년 1월 20일 산가브리엘섬에 닿아 28일 콜로니아델사크라멘토에 요새를 세웠다. 토르데시야스 조약(「콜럼버스와 다가마, 신항로 개척」(앞의 사건))의 경계선이 라플라타강 어귀를 지나는지를 두고 두 나라의 계산이 갈린 것이 다툼의 바탕이었다. 이곳은 포토시의 은과 노예, 상품이 오가는 밀무역의 창구가 되었고, 스페인은 이를 자기 영토의 침범으로 보았다. 1680년 8월 6~7일 부에노스아이레스 총독 호세 데 가로가 보낸 군대가 도시를 빼앗았고(이 싸움에는 과라니 선교 마을의 원주민 병력도 가담했다), 1681년 두 나라의 잠정 조약으로 포르투갈에 돌려주었다. 1704년 10월부터 1705년 3월까지 스페인이 이 도시를 포위하자 주민은 포르투갈 배로 철수했고, 1713~1715년 위트레흐트에서 맺은 포르투갈과 스페인의 조약에 따라 포르투갈은 다시 이곳을 돌려받아 1718년 2월 10일 마누엘 고메스 바르보사가 접수했다. 스페인은 맞은편에 몬테비데오를 세워(1724년 요새로 시작해 1726년 12월 24일 도시로 공식 건설) 맞섰고, 1735년부터 1737년까지 다시 포위했으나 리우데자네이루에서 온 포르투갈 증원군에 막혀 도시를 얻지 못했다. 이 동안 포르투갈령 브라질은 남쪽 해안에서 눈길을 돌려 1737년 리우그란지 어귀에 요새를 세워 오늘날 리우그란지두술의 문을 열었다. 이 도시를 둘러싼 다툼은 1750년의 조약으로 이어지며, 그 내용은 「마투그로수·고이아스와 마드리드 조약, 과라니 전쟁(1746~1756)」(뒤의 사건)에서 다룬다."
  subjects: [portuguese-brazil, spain, portugal]
  tags: [war, diplomacy]
  sources: ["Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society (Cambridge University Press, 1985)", "Luiz Felipe de Alencastro, O trato dos viventes (Companhia das Letras, 2000)"]

- id: pennsylvania-1681
  year: 1681
  endYear: 1683
  title:
    ko: "윌리엄 펜의 펜실베이니아(1681~1683)"
  summary:
    ko: "퀘이커교도 윌리엄 펜은 해군 제독이던 아버지 윌리엄 펜 경에게 왕실이 진 빚을 갚는 방식으로 1681년 3월 4일(율리우스력) 잉글랜드 왕국의 찰스 2세에게서 델라웨어강 서쪽의 넓은 땅을 헌장으로 받았다. 이 땅은 왕이 아버지를 기려 숲의 땅이라는 뜻으로 펜실베이니아라 이름 지었는데(펜은 독일어·네덜란드어·프랑스어로도 식민지 소개서를 펴내 이주민을 모았다), 펜은 자기 성이 붙는 것을 마뜩잖아 했다고 전한다. 영국에서 퀘이커교도는 1660년대 이후 벌금과 투옥에 시달리고 있었고, 펜은 퀘이커교도를 비롯해 박해받는 여러 신앙의 사람이 모여 사는 펜실베이니아 식민지를 '거룩한 실험'의 터로 삼으려 했다. 1682년 12월 4~7일 첫 식민지 의회가 체스터에서 열려 첫 법을 정했고, 필라델피아(그리스어로 형제애의 도시)가 토머스 홈의 측량으로 델라웨어강과 스쿨킬강 사이에 계획 도시로 세워졌다. 펜은 1682년 10월 델라웨어강에 닿았고, 1682년 첫 정부 구상(정부의 틀)은 1683년 고쳐져 총독과 의회, 종교 자유를 규정했으며, 1682년에는 요크 공작에게서 델라웨어강 하류의 땅(오늘날 델라웨어)도 얻어 합쳤다. 땅의 본디 주인 레나페 사람들과는 샤카맥슨 나무 아래에서 우정 조약을 맺었다는 전승이 있으나 사료로는 불확실하다. 이후 독일과 웨일스, 아일랜드의 이주민이 줄지어 몰려들어 펜실베이니아는 빠르게 커졌다. 한편 메릴랜드의 볼티모어 남작과는 경계를 두고 1684년부터 다툼이 시작되어 1767년 측량으로 대부분 정리되었다. 이 식민지는 필라델피아라는 큰 항구와 곡물 수출로 번성했고, 1776년 독립 선언 때는 열세 식민지 가운데 인구가 가장 많은 축에 들었다."
  subjects: [province-of-pennsylvania, england]
  links:
    - { from: england, to: province-of-pennsylvania, note: "1681년 헌장으로 윌리엄 펜에게 델라웨어강 서쪽 땅을 줌" }
  tags: [politics, religion]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Gary B. Nash, Quakers and Politics: Pennsylvania, 1681–1726 (Princeton University Press, 1968)", "Mary Maples Dunn·Richard S. Dunn 엮음, The Papers of William Penn, vol. 2 (University of Pennsylvania Press, 1982)"]

- id: itza-nojpeten-1695
  year: 1695
  endYear: 1697
  title:
    ko: "이차 왕국과 노즈페텐 함락(1695~1697)"
  summary:
    ko: "유카탄에서 밀려난 이차 마야 사람들은 페텐 호수의 섬 도시 노즈페텐(스페인 글에는 타야살로 나옴)에서 칸 에크 왕가를 중심으로 독립을 지켰다. 에르난 코르테스는 온두라스 원정 길에 이곳을 지나며 이차 왕 칸 에크를 만났다고 하는데(자료마다 1523~1525년으로 갈린다), 이차는 스페인 정복 이후에도 오랫동안 스페인 지배 밖에 있어 마야 문명의 마지막 독립 왕국이 되었다. 섬 도시라 방어에 유리했던 노즈페텐에서는 마야 문서와 달력과 의례가 이어졌고, 17세기 전반 스페인 원정이 몇 차례 이곳에서 실패했다. 1618년 프란치스코회 사제들이 선교하러 노즈페텐을 찾았으나 이차 사람들은 개종을 받아들이지 않았다. 1695년 유카탄 총독 마르틴 데 우르수아는 캄페체에서 페텐으로 가는 길을 내며 원정을 시작했고, 이듬해 안드레스 데 아벤다뇨 같은 사제들이 노즈페텐에 이르러 칸 에크를 만났다. 마야력으로 한 시대가 끝나는 때가 다가오자 이차 쪽에서는 스스로 스페인에 복속하는 것이 예언에 맞는다고 보는 목소리도 있었다고 전한다. 칸 에크는 1696년 스페인 왕에게 복속하겠다고 약속했으나 지켜지지 않았고, 1697년 3월 13일 우르수아는 호수에 갤리선을 띄워 노즈페텐을 공격했으며 이차 왕국은 스페인 지배에 복속했다. 스페인 군은 도시의 신상과 의례 도구를 부수었다고 전하며, 칸 에크와 이차 귀족은 이후 스페인의 통제 아래 놓였다. 이후 페텐은 과테말라 총사령부(과테말라 아우디엔시아가 1609년 이름을 바꾼 것) 쪽에 속했으며, 이차 사람들은 전염병과 강제 이주로 크게 줄었다. 이로써 1492년 첫 항해로부터 2백 년이 넘어서 마지막 독립 마야 나라가 끝났다."
  subjects: [guatemala-captaincy, maya-civilization]
  tags: [war, society]
  sources: ["Grant D. Jones, The Conquest of the Last Maya Kingdom (Stanford University Press, 1998)", "Nancy M. Farriss, Maya Society under Colonial Rule: The Collective Enterprise of Survival (Princeton University Press, 1984)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: queen-anne-utrecht-1701
  year: 1701
  endYear: 1714
  title:
    ko: "앤 여왕 전쟁과 위트레흐트 조약의 북아메리카: 아카디아에서 노바스코샤로(1701~1714)"
  summary:
    ko: "1701년 누벨프랑스 캐나다는 이로쿼이 연맹(5부족) 등 여러 원주민 집단과 몬트리올에서 대평화를 맺었고, 이 약속은 이어진 전쟁 동안 이로쿼이를 대체로 중립에 머물게 했다. 같은 해 7월 24일 앙투안 로메 드 라모트 카디야크가 퐁샤르트랭 요새(오늘날 디트로이트)를 세워 오대호 중부의 모피 교역을 쥐려 했다. 1701년 유럽에서 시작된 스페인 왕위 계승 전쟁은 1702년 북아메리카에서 앤 여왕 전쟁(1702~1713)으로 번져 1713년 7월까지 이어졌다. 프랑스와 아베나키 사람들은 1704년 2월 매사추세츠의 변경 마을 디어필드를 습격해 100명 넘게 붙잡아 갔고, 1710년 10월 프랜시스 니컬슨이 이끈 영국 군인과 식민지 민병 약 3,600명이 일주일의 포위 끝에 아카디아의 중심 포르루아얄을 차지했으며 도시는 아나폴리스로열이 되었다. 1713년 4월 11일 위트레흐트 조약에서 영국은 아카디아 반도를 노바스코샤라는 이름으로 얻었고(경계는 뚜렷하지 않았다), 프랑스는 케이프브레턴섬과 세인트로렌스만의 섬들을 지켜 일루아얄이라 부르며 1719년부터 루이스버그를 요새 도시로 지었다. 프랑스는 아카디아 사람들을 일루아얄로 불러 모으려 했으나 대부분은 영국 지배 아래 남아 프랑스어와 가톨릭 신앙을 이어 갔다. 같은 날 포르투갈과 프랑스의 위트레흐트 조약은 아마존강 북쪽 경계를 정해 마라냥 주의 북쪽 끝이 아마파까지 닿게 했으나, 경계가 되는 강의 이름을 두고 다툼이 이어졌다. 유럽 쪽 조항과 아시엔토는 「위트레흐트 조약과 라슈타트 조약」(뒤의 사건)에 있고, 이 전쟁의 앞선 1689~1697년의 흐름은 「9년 전쟁과 레이스베이크 조약」(앞의 사건)을 본다."
  subjects: [acadia, nova-scotia, ile-royale, new-france-canada, state-of-maranhao, uk, france]
