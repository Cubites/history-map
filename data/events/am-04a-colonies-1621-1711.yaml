  tags: [war, politics, society]
  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "Alan Gallay, The Indian Slave Trade: The Rise of the English Empire in the American South, 1670–1717 (Yale University Press, 2002)", "Steven C. Hahn, The Invention of the Creek Nation, 1670–1763 (University of Nebraska Press, 2004)"]
