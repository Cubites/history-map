- id: jamaica-buccaneers-1655
  year: 1655
  endYear: 1676
  title:
    ko: "영국의 자메이카 점령과 버커니어, 마라카이보·파나마 습격(1655~1676)"
  summary:
    ko: "잉글랜드 공화국(1649~1660)의 호국경 올리버 크롬웰은 1654년 이른바 서방 계획으로 스페인의 카리브 해 땅을 빼앗으려 윌리엄 펜 제독과 로버트 베너블스 장군이 이끄는 함대를 보냈다. 이 함대는 1655년 4월 산토도밍고 공략에 실패하자 방향을 바꾸어 5월 스페인 사람이 몇 안 살던 자메이카에 상륙해 이곳을 차지했다. 스페인 정착민과 그들이 부리던 노예의 일부는 산악 지대로 달아나 마룬이라 불리는 자유 공동체의 뿌리가 되었다. 영국은 포트로열을 중심으로 섬을 키웠고, 이곳은 스페인 배를 노리는 버커니어(사략선 선원)의 근거지가 되어 한때 카리브 해에서 가장 이름난 항구가 되었다. 대표 인물 헨리 모건은 1668년 7월 11일(율리우스력) 포르토벨로를, 1669년 마라카이보 호수 일대를, 1671년 1월 파나마를 습격했다. 1670년 7월 8일 마드리드 조약에서 스페인은 영국이 카리브 해에서 차지한 땅을 사실상 인정했으나, 모건의 파나마 습격은 조약 뒤에 일어나 영국 정부가 그를 1672년 런던으로 불러들이는 계기가 되었다(1674년 기사 작위를 받고 이듬해 자메이카 부총독으로 돌아갔다). 스페인은 이런 약탈에 맞서 방어를 고쳐 1676년 12월 31일 마라카이보를 메리다·라그리타와 묶어 산타페데보고타 아우디엔시아 관할의 한 주로 세웠다. 이 주는 페루 부왕령에 속했고, 같은 시기 카라카스·쿠마나는 산토도밍고 총사령부의 아우디엔시아 아래 누에바에스파냐 부왕령에 속했다. 영국은 크롬웰의 정책에 따라 영국·아일랜드·바베이도스와 세인트키츠에서 이주민을 모아 섬을 채우려 했고, 자메이카는 이후 사탕수수 농장과 노예 노동의 섬으로 바뀌어 1660년대부터 아프리카 서해안에서 끌려온 노예의 수가 빠르게 늘었다."
  subjects: [jamaica, santo-domingo-captaincy, new-spain-viceroyalty, peru-viceroyalty, england]
  links:
    - { from: england, to: jamaica, note: "1655년 서방 계획 함대가 스페인령 자메이카를 점령함" }
  tags: [war, politics]
  sources: ["Carla Gardina Pestana, The English Conquest of Jamaica (Harvard University Press, 2017)", "Alan Taylor, American Colonies (Viking, 2001)", "Peter Earle, The Sack of Panamá (Viking, 1981)"]
