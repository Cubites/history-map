# 아메리카 사건 2묶음 갈래 04a: 식민 사회의 자리잡기와 열강의 다툼 (1621 ~ 1711년)
# 범위: 마라냥 주·네덜란드 서인도 회사·뉴잉글랜드·네덜란드령 브라질·메릴랜드·프랑스령 앤틸리스와 카옌·마푸체 아라우카니아·자메이카·캐롤라이나·뉴네덜란드의 끝·허드슨 베이 회사·미시시피강과 프랑스령 루이지애나·펜실베이니아·앤 여왕 전쟁과 아카디아·조지아까지 1621~1711년 아메리카 식민지의 성립과 변동.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 영국 쪽 날짜(1752년 앞)는 율리우스력이 기준이라 사건마다 처음 나오는 날짜에 '(율리우스력)'을 한 번 밝혔고, 그 밖 날짜는 위키백과 정보 상자의 날짜를 따랐다. 확실하지 않은 날짜는 '무렵', 원주민 구전·학설이 갈리는 숫자는 '추산'과 범위로 적었다.
# 이름 규칙: 항목 이름(마라냥 주·네덜란드령 에세키보·버비스·뉴네덜란드·매사추세츠만 식민지·코네티컷 식민지·누벨프랑스 캐나다·아카디아 등)을 본문에 그대로 썼다. 이름이 바뀐 나라(마라냥 주 → 그랑파라·마라냥 주)는 처음에 한 번 밝혔다.
# 지도 결정과의 관계: 점령은 글로만 다뤘고(바이아 1624~1625·아카디아 1654~1670 등), 원주민 땅은 사실대로 적었으며, 마푸체 아라우카니아는 킬린 의회 해석이 갈린다는 점을 함께 적었다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 「콜럼버스와 다가마, 신항로 개척」, 「항해법과 영국-네덜란드 전쟁」, 「9년 전쟁과 레이스베이크 조약」, 「위트레흐트 조약과 라슈타트 조약」, 「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」.

- id: maranhao-state-1621
  year: 1621
  endYear: 1625
  title:
    ko: "마라냥 주의 설치와 아마존 하구(1621~1625)"
  summary:
    ko: "1612년 프랑스 사람들은 적도 가까운 마라냥섬에 상루이스를 세우고 현지 투피남바 사람들과 손잡아 이른바 적도 프랑스를 꾀했으나, 포르투갈은 1614년 과센두바 전투 뒤 1615년 이들을 몰아내고 상루이스를 차지했다. 이듬해인 1616년에는 프란시스쿠 칼데이라 카스텔루 브랑쿠가 아마존강 어귀 가까이에 요새를 지어 오늘날 벨렝의 첫 터를 닦았다. 이 북쪽 해안은 무역풍과 해류 때문에 사우바도르에서 배로 오가기보다 리스본과 곧바로 잇는 편이 쉬웠고, 1621년 6월 13일 포르투갈 왕은 칙령으로 마라냥 주를 세워 사우바도르가 다스리는 브라질 주에서 떼어 냈다. 수도는 상루이스였으며, 마라냥 주는 브라질과 따로 리스본의 왕실에 곧바로 보고하는 자리가 되었고, 땅은 오늘날 브라질의 마라냥·파라·세아라 일대에 걸쳤다. 1621~1622년 마라냥의 대장(카피탕모르)은 도밍구스 다 코스타 마샤두였다. 이 무렵 아마존 하구와 그 지류에서는 네덜란드와 영국 상인들이 담배와 염료를 사려고 작은 교역 요새를 세워 두고 있었는데, 포르투갈 원정대는 1623년부터 1625년 사이 이 요새들을 차례로 무너뜨리며 하구 일대를 포르투갈 쪽으로 굳혔다. 이 땅은 원래 투피남바 같은 원주민의 땅이었고, 포르투갈 사람들은 원주민을 노예로 삼거나 마을로 옮겨 일을 시키는 식으로 하구의 노동력을 마련했고, 선교사들은 원주민을 선교 마을에 모으는 일을 두고 식민 당국과 노동력을 다투곤 했다. 마라냥 주는 1652년 없어졌다가 1654년 다시 세워졌으며, 1751년 이름이 그랑파라·마라냥 주로 바뀐다. 이 뒤의 일은 「폼발의 아마존 개혁과 그랑파라·마라냥(1751~1775)」(뒤의 사건)에서 다룬다."
  subjects: [state-of-maranhao, portugal]
  links:
    - { from: portugal, to: state-of-maranhao, note: "1621년 칙령으로 브라질 주에서 떼어 마라냥 주를 세움" }
  tags: [politics, society]
  sources: ["The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Stuart B. Schwartz, Sugar Plantations in the Formation of Brazilian Society (Cambridge University Press, 1985)", "Leslie Bethell 엮음, Colonial Brazil (Cambridge University Press, 1987)"]

- id: wic-1621
  year: 1621
  endYear: 1626
  title:
    ko: "네덜란드 서인도 회사와 에세키보, 뉴암스테르담(1621~1626)"
  summary:
    ko: "1621년 6월 3일 네덜란드 연방 의회는 서인도 회사에 대서양 건너편 무역을 24년 동안 독점하게 하는 특허장을 주었고, 이 일은 빌럼 우셀링크스와 레이니르 파우 같은 사람들이 앞장섰다. 회사는 열아홉 명의 이사가 모인 회의가 이끌고 암스테르담·젤란트 등 다섯 지부로 나뉘었으며, 1623년 자금을 갖추고 일을 시작해 아프리카 서해안과 아메리카에서 스페인·포르투갈과 맞섰다. 가이아나 해안에서는 에세키보강 어귀에 1616년부터 키크오버랄 요새가 지어지고 있었고, 1621년 이곳이 서인도 회사의 식민지가 되어 원주민과 담배·염료를 거래하는 거점이 되면서 네덜란드령 에세키보·버비스의 첫 모습이 갖추어졌다(옆 강 버비스의 정착은 1627년). 북쪽에서는 1624년 5월 회사가 서른 가구 가까운 이주민을 허드슨강의 오렌지 요새와 노튼 에일란트(오늘날 거버너스섬)에 내려놓아 뉴네덜란드의 정착을 시작했다. 회사의 현지 책임자는 코르넬리스 야코브스 메이에 이어 1625년 빌럼 페르휠스트가 맡았고, 1626년 페터르 미노이트가 뒤를 이었다. 미노이트는 1626년 5월 24일 맨해튼을 60길더 값의 물건으로 얻은 것으로 전하며, 암스테르담 요새를 짓자 그 둘레가 뉴암스테르담이 되었다. 거래한 원주민 쪽이 이를 땅의 영구 양도로 보았는지는 분명하지 않다는 해석이 있다. 한편 회사 함대는 1624년 사우바도르를 점령했으나 이듬해 포르투갈·스페인 연합 함대가 되찾았고, 이 일은 「네덜란드령 브라질과 요한 마우리츠(1630~1641)」(뒤의 사건)로 이어진다. 회사는 노예 무역으로도 이름을 떨쳤는데, 그 흐름은 「대서양 노예 무역의 정점(1650 무렵~1800 무렵)」(뒤의 사건)에 있다."
  subjects: [dutch-essequibo-berbice, new-netherland, dutch-republic]
  links:
    - { from: dutch-republic, to: dutch-essequibo-berbice, note: "1621년 서인도 회사가 에세키보강 어귀 식민지를 맡음" }
