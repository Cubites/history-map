  sources: ["Alan Taylor, American Colonies (Viking, 2001)", "W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)", "Naomi E. S. Griffiths, From Migrant to Acadian: A North American Border People, 1604–1755 (McGill-Queen's University Press, 2005)"]
