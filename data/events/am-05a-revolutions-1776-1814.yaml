- id: venezuela-first-republic-1811
  year: 1811
  endYear: 1814
  title:
    ko: "베네수엘라 독립 선언과 제1·제2공화국(1811~1814)"
  summary:
    ko: "1810년 4월 19일 카라카스 시의회는 스페인의 왕 페르난도 7세의 이름으로 최고 평의회를 세우고 베네수엘라 총사령부의 총사령관 비센테 에만파란을 물러나게 했다. 평의회가 서고 얼마 뒤 오래 망명했던 프란시스코 데 미란다가 돌아와 의회 의원이 되어 독립을 밀어붙였고, 1811년 7월 5일 의회는 독립을 선언해 베네수엘라는 스페인령 아메리카에서 처음으로 독립을 선언한 땅이 되었다. 그해 12월 21일 후안 헤르만 로시오가 대부분 쓴 헌법이 승인되었다. 새 공화국은 1812년 3월 26일 지진으로 큰 피해를 입었고 사람들이 왕당파 쪽으로 돌아섰다. 3월 초 코로에 닿은 스페인 해군 장교 도밍고 데 몬테베르데는 7월 중순 발렌시아를 차지했고, 7월 25일 미란다는 산마테오에서 항복 조약에 서명해 공화국이 끝났다. 몬테베르데는 8월 1일 카라카스에 들어갔고, 미란다는 곧 붙잡혔다. 1813년 시몬 볼리바르는 옛 누에바그라나다 부왕령 땅에서 군을 모아 서쪽에서 베네수엘라로 들어가 몬테베르데를 꺾었고, 이 찬탄할 전역 끝에 8월 7일 공화국을 되살렸다. 산티아고 마리뇨는 동쪽에서 따로 싸웠다. 이 제2공화국은 그러나 호세 토마스 보베스가 이끄는 왕당파 군대에 잇달아 졌고, 1814년 7월 16일 왕당파가 카라카스를 다시 차지하면서 끝났다. 공화국이 무너진 데는 지진과 함께, 크리오요 지주의 지배에 반발한 야노스의 가난한 사람들이 왕당파를 따른 일이 겹쳤다. 베네수엘라가 다시 일어서는 것은 1819년의 일이다(「보야카 전투와 그란콜롬비아의 성립(1819~1822)」(뒤의 사건)). 1812년 정부는 미란다에게 군 지휘와 연방 지도를 맡겼으나 그는 싸움의 흐름을 되돌리지 못했다."
  subjects: [venezuela-captaincy-general, new-granada-viceroyalty, spain]
  tags: [war, politics]
  sources: ["John Lynch, Simón Bolívar: A Life (Yale University Press, 2006)", "John Lynch, The Spanish American Revolutions 1808–1826 (W. W. Norton, 1973)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)"]

- id: anglo-american-war-1812
  year: 1812
  endYear: 1815
  title:
    ko: "1812년 전쟁과 서플로리다(1812~1815)"
  summary:
    ko: "나폴레옹 전쟁 동안 영국은 중립국 미국의 무역을 막는 추밀원 칙령을 내리고 미국 선원을 강제로 징발했으며, 오하이오강 북서쪽에서 원주민의 저항을 도왔다. 제임스 매디슨 대통령이 1812년 6월 18일 선전 포고에 서명했고, 하원은 79 대 49, 상원은 19 대 13으로 당파에 따라 갈려 가결했다. 8월 16일 윌리엄 헐은 어퍼캐나다를 침공했다가 디트로이트를 아이작 브록에게 넘겨주었고, 로어캐나다의 프랑스계 민병도 영국 쪽에서 싸웠다. 쇼니 지도자 테쿰세는 영국 편에서 원주민 연합을 이끌었으나 1813년 10월 템스강 전투에서 숨졌다. 1814년 8월 영국군은 워싱턴을 점령해 불태웠고, 9월 볼티모어와 플래츠버그에서 미국이 막아 냈다. 남쪽에서는 레드스틱이라 불린 크리크 일파가 미국과 동맹 원주민에게 꺾였다. 1814년 12월 24일 겐트에서 존 퀸시 애덤스 등이 조약에 서명했고, 조약은 전쟁 전 국경과 상태로 되돌린다는 원칙(전쟁 전 상태)을 확인했다. 비준은 1815년 2월 16~17일에 끝났는데, 앤드루 잭슨은 소식이 닿기 전인 1815년 1월 8일 뉴올리언스에서 영국군을 막아 영웅이 되었다. 조약 9조는 두 나라가 원주민과 화평을 맺고 1811년 때의 권리를 되돌려 준다고 했으나 미국은 원주민 완충국을 받아들이지 않았다. 한 추산으로 미국은 전사 약 2,200명을 포함해 병으로 죽은 사람까지 최대 1만 5천 명을 잃었고, 영국은 전투에서 약 2,700명, 모두 합쳐 약 1만 명을 잃었다. 한편 스페인령 플로리다의 서쪽 땅에서는 1810년 9월 23일 필레몬 토머스가 이끄는 반란군이 배턴루지의 산카를로스 요새를 차지하고 총독 드라수스를 사로잡아 9월 26일 독립을 선언했다. 매디슨은 10월 27일 루이지애나 매입에 속한 땅이라며 점령을 선포했고, 12월 6일 윌리엄 클레이본이 군을 이끌고 들어와 12월 10일 배턴루지 수비대가 항복했다. 이 땅은 1812년 8월 4일 루이지애나에 더해졌고, 1813년 4월 제임스 윌킨슨이 모빌에서 스페인의 항복을 받았다. 겐트 조약 뒤에도 미국은 퍼디도강 서쪽의 점령지를 지켰다."
