  sources: ["Laurent Dubois, Avengers of the New World: The Story of the Haitian Revolution (Belknap Press of Harvard University Press, 2004)", "C. L. R. James, The Black Jacobins (Secker & Warburg, 1938)", "David Geggus, Haitian Revolutionary Studies (Indiana University Press, 2002)"]

- id: pinckney-treaty-1795
  year: 1795
  endYear: 1798
  title:
    ko: "핑크니 조약과 미시시피강 항행(1795~1798)"
  summary:
    ko: "미국은 서쪽으로 늘어난 켄터키·테네시 주민이 물건을 내보낼 길로 미시시피강과 그 하구의 뉴올리언스가 꼭 필요했다. 그러나 강 하구는 스페인령 루이지애나에 속했고, 북쪽 경계도 스페인은 북위 32도 28분까지를 자기 땅이라 주장해 오랫동안 다툼이 이어졌다. 1794년 영국과 미국의 제이 조약을 본 스페인은 두 나라가 가까워질까 걱정했고, 프랑스와도 1795년 바젤 조약으로 전쟁을 끝낸 참이었다. 이런 사정에서 토머스 핑크니와 스페인 재상 마누엘 데 고도이는 1795년 10월 27일 산로렌소 데 엘에스코리알에서 조약에 서명했다. 조약은 북위 31도선을 미국과 스페인령 플로리다의 경계로 확인했고, 두 나라 사람이 미시시피강을 자유롭게 오가도록 했으며, 미국 상인이 뉴올리언스에 화물을 내려 보관할 수 있는 예치권을 3년 동안 주었다. 비준서는 1796년 4월 25일 교환되었다. 스페인군은 나체즈 등 31도선 위의 요새에서 곧바로 물러나지 않다가 1798년 봄에야 철수했고, 의회는 1798년 4월 7일 미시시피 준주를 세워 나체즈를 도읍으로 삼았다. 이 땅에는 촉토와 치커소, 크리크 등 원주민 나라가 살고 있었으나 조약 협상에서 목소리를 낼 수 없었다. 예치권은 뒤에도 흔들려 1800년대 초 위기로 이어졌다(「산일데폰소 조약과 루이지애나 매입(1800~1804)」(뒤의 사건)). 조약은 두 나라가 각자의 땅에 사는 원주민이 상대를 공격하지 않도록 막는다는 약속도 담았다. 고도이는 같은 해 바젤 평화로 '평화의 공'이라는 칭호를 받았고, 미국 상원은 1796년 3월 7일 조약을 비준해 서부 정착민의 환영을 받았다. 토머스 핑크니는 영국 주재 공사로 있다가 1794년 특사로 마드리드에 파견되었다."
  subjects: [usa, spain, spanish-florida, spanish-louisiana]
  links:
    - { from: spain, to: usa, note: "1795년 북위 31도선과 미시시피강 항행·예치권을 인정함" }
  tags: [diplomacy]
  sources: ["Samuel Flagg Bemis, Pinckney's Treaty: America's Advantage from Europe's Distress, 1783–1800 (Yale University Press, 1960)", "Arthur P. Whitaker, The Mississippi Question, 1795–1803 (D. Appleton-Century, 1934)", "Alan Taylor, American Republics: A Continental History of the United States, 1783–1850 (W. W. Norton, 2021)"]

- id: belize-1798
  year: 1798
  endYear: 1798
  title:
    ko: "세인트조지스 케이 전투와 벨리즈의 베이맨 정착지(1798)"
  summary:
    ko: "17세기 중엽부터 영국 출신 벌목꾼들, 곧 베이맨은 지금 벨리즈 해안에서 염료로 쓰는 로그우드를 베어 냈다. 땅은 스페인의 주권 아래 있었으므로 영국은 1763년 파리 조약으로 벌목할 권리를 얻는 데 그쳤고, 1783년 베르사유 조약은 벨리즈강과 혼도강 사이로, 1786년 런던 협약은 시분강까지 그 권리를 넓혔다. 영국은 그 대가로 모스키토 해안과 로아탄 등 다른 정착지를 포기했다. 노예로 부려진 아프리카 출신 사람들이 이 벌목의 일손이었다. 1798년 9월 유카탄 총독 아르투로 오닐이 지휘하는 스페인 함대가 해안에 닿아 이 정착지를 없애려 했고, 영국 쪽은 머린호 함장 존 무스와 작은 배를 포함한 열세 척, 병사 약 700명, 정착민 지원병 354명, 무장한 노예 병사로 맞섰다고 전한다. 9월 3일부터 시작된 교전은 9월 10일 세인트조지스 케이 앞바다에서 스페인 함대가 물러나면서 끝났다. 이 싸움 뒤 스페인은 다시는 정착지를 공격하지 않았으나 영국은 주권을 인정받지 못했고, 과테말라 총사령부와 뒷날 과테말라가 주권을 주장하는 근거가 남았다. 정착지는 1862년 영국령 온두라스 식민지가 되었고 지금 이름은 벨리즈다. 벨리즈는 9월 10일을 국경일로 기린다. 정착지 감독관 토머스 배로는 육지 방어에 무게를 두자고 했으나 싸움이 끝나 갈 무렵에야 도착했다. 스페인 쪽은 배 30여 척과 병력 약 2천 명이라고 하나 영국 쪽 기록과 숫자가 갈린다. 스페인은 이 정착지를 쫓아내려 여섯 차례 시도했고 가장 최근 것이 1779년이었지만 땅을 실제로 차지하지는 않았다. 1798년 7월 스페인 함대가 코수멜에 닿자 정착민은 노예를 무장시키기로 했는데, 스페인이 앞서 자유를 약속해 일부 벌목 노예를 꾀어 간 일이 있어 이 결정이 싸움의 결과에 영향을 주었다고 한다. 정착지 100주년인 1898년 식민 정부가 9~10일을 공휴일로 삼았다."
