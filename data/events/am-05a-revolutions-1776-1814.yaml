- id: haiti-independence-1803
  year: 1803
  endYear: 1806
  title:
    ko: "베르티에르 전투와 아이티의 독립(1803~1806)"
  summary:
    ko: "르클레르가 1802년 11월 황열병으로 죽은 뒤 후임 로샹보는 가혹한 탄압으로 반발을 키웠고, 이에 장자크 데살린과 알렉상드르 페티옹 등 옛 프랑스군 장교들도 반란군에 서서 하나로 모였다. 1803년 11월 18일 북부 카프프랑세 가까운 베르티에르에서 데살린의 군대가 프랑스군을 꺾었다. 로샹보는 이튿날인 11월 19일 항복 협상에 나서 열흘 안에 군대를 배에 태워 떠나기로 했다. 1804년 1월 1일 데살린은 고나이브에서 독립을 선언했으며, 이 땅의 옛 타이노 말 이름 아이티(산이 많은 땅)를 새 나라 이름으로 삼았다. 이로써 생도맹그는 사라졌고, 노예가 스스로 나라를 세운 첫 사례가 되었다. 데살린은 1804년 9월 22일 장군들에게 황제 자크 1세로 추대되어 10월 8일(6일이라는 기록도 있다) 즉위식을 올렸다. 1804년 2월부터 4월 사이 남아 있던 프랑스인과 백인 가운데 약 3천~5천 명이 학살되었다고 추산된다. 1805년 5월 20일 제정 헌법은 모든 아이티 사람을 흑인이라 부르고 백인이 땅을 갖지 못하게 했다. 데살린은 가혹한 노동 정책과 땅 문제로 불만을 사서 1806년 10월 17일 포르토프랭스 북쪽에서 암살되었다. 영국과 미국은 새 나라를 곧바로 승인하지 않았고, 미국은 1862년에야 승인했다. 1805년 3월 데살린은 섬 동쪽 산토도밍고를 공격했으나 성공하지 못했다. 암살에는 페티옹과 크리스토프 등 부하 장교들이 관련되었다고 전해진다. 데살린은 1758년 9월 20일 북부 그랑리비에르 가까운 농장에서 노예로 태어났고, 1803년 5월 18일 원주민군 총사령관에 올랐다. 1802년 3월 크레트아피에로 전투에서도 프랑스군과 싸웠다."
  subjects: [haiti, saint-domingue, france, uk]
  links:
    - { from: haiti, to: france, note: "1803년 베르티에르에서 프랑스군을 꺾고 1804년 독립을 선언함" }
  tags: [war, politics]
  sources: ["Laurent Dubois, Avengers of the New World: The Story of the Haitian Revolution (Belknap Press of Harvard University Press, 2004)", "Philippe R. Girard, The Slaves Who Defeated Napoleon: Toussaint Louverture and the Haitian War of Independence, 1801–1804 (University of Alabama Press, 2011)", "David Geggus, Haitian Revolutionary Studies (Indiana University Press, 2002)"]
