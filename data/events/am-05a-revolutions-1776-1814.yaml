- id: russian-america-1799
  year: 1799
  endYear: 1812
  title:
    ko: "러시아-아메리카 회사와 러시아령 아메리카(1799~1812)"
  summary:
    ko: "러시아 상인들은 18세기 중엽부터 알류샨 열도를 따라 해달 모피를 찾아 동쪽으로 나아갔다. 그리고리 셸리호프가 1784년 코디액섬에 정착지를 세웠고, 그 사업을 이어받은 알렉산드르 바라노프가 1790년부터 책임자로 일했다. 1799년 7월 8일 황제 파벨 1세는 셸리호프와 골리코프의 사업을 하나로 묶어 러시아-아메리카 회사에 헌장을 주고 북위 55도 위쪽 해안과 알류샨 열도에서 모피 거래를 독점하게 했다. 이것이 러시아령 아메리카의 시작이다. 바라노프는 회사의 책임자이자 식민지 우두머리가 되었고, 1799년 지금 싯카 부근에 성 대천사 미카엘 보루(미하일롭스크)를 세웠다. 원주민은 이를 받아들이지 않았다. 틀링깃족은 1802년 이 보루를 불태우고 사람들을 죽였으며, 바라노프는 1804년 군함 네바호와 알류트 카약 부대를 데려와 싸움 끝에 이곳을 차지하고 노보아르한겔스크를 세워 뒷날 도읍으로 삼았다. 알류트인은 가족을 인질로 잡히고 사냥을 강요받았고, 병과 학대로 첫 두 세대에 인구의 대부분을 잃은 것으로 추산된다. 러시아 사람은 많아도 수백 명뿐이어서 실효 지배는 해안의 몇몇 거점에 그쳤다. 1812년 회사는 캘리포니아 소노마 해안에 로스 요새를 세워 식량 공급지로 삼았다. 바라노프는 1818년까지 식민지를 이끌었다. 알류트인은 러시아 사람과 만났을 때 약 1만 2천~2만 5천 명으로 추산되는데(자료마다 갈린다), 틀링깃족은 싯카 밖 해안 여러 곳에서 오랫동안 독립을 지켰다. 1801년 본부는 이르쿠츠크에서 상트페테르부르크로 옮겨졌고 상인 대신 귀족이 큰 주주가 되었으며, 정부는 니콜라이 레자노프를 첫 회사 대리인으로 두었다. 알류트와 알루틱 남자들이 세 해씩 징용되어 해달 사냥을 맡았고, 1797~1821년 회사와 앞선 사업이 거둔 해달 모피는 7만 2,894장에 이른다. 1805~1812년 바라노프는 알류트 일꾼을 미국 배 열 척에 빌려주어 캘리포니아 앞바다에서 2만 2천 장이 넘는 모피를 잡게 했다. 레자노프는 식량을 구하려고 1806년 알타칼리포르니아로 갔으나 합의 없이 돌아섰고, 회사는 1812년 5월 2일 존 제이컵 애스터의 회사와 4년짜리 거래를 맺었다."
  subjects: [russian-america, russia]
  links:
    - { from: russia, to: russian-america, note: "1799년 헌장으로 러시아-아메리카 회사에 독점권을 줌" }
  tags: [economy, politics, society]
  sources: ["Lydia T. Black, Russians in Alaska, 1732–1867 (University of Alaska Press, 2004)", "James R. Gibson, Imperial Russia in Frontier America (Oxford University Press, 1976)", "S. Frederick Starr (ed.), Russia's American Colony (Duke University Press, 1987)"]
