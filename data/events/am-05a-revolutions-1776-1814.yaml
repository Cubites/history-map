- id: rio-de-la-plata-1776
  year: 1776
  endYear: 1778
  title:
    ko: "리오데라플라타 부왕령의 설치와 산일데폰소 조약(1776~1778)"
  summary:
    ko: "스페인 왕 카를로스 3세는 포르투갈령 브라질의 남쪽 압박을 막고 포토시 은광이 있는 알토페루를 페루 부왕령에서 떼어 내려고, 1776년 8월 1일 페드로 데 세바요스에게 리오데라플라타 부왕령의 임시 지배권을 주었다. 세바요스는 대군을 이끌고 와 1777년 포르투갈령 산타카타리나섬과 콜로니아델사크라멘토를 차지했다. 1777년 10월 1일 제1차 산일데폰소 조약에서 포르투갈은 콜로니아델사크라멘토와 산가브리엘섬에 대한 스페인의 주권을 인정했고, 스페인은 산타카타리나섬과 리우그란데의 땅을 돌려주었다. 1778년 3월 11일 엘 파르도 조약이 이 합의를 거듭 확인하면서 포르투갈은 아프리카 기니만의 페르난도포·아노본 두 섬에 대한 권리를 스페인에 넘겼다. 왕은 1777년 10월 27일 부왕령을 정식으로 세웠고, 세바요스는 1778년 6월 28일 후안 호세 데 비에르티스에게 자리를 넘겼다. 부왕령은 라플라타강 둘레와 투쿠만·쿠요, 파라과이, 몬테비데오, 차르카스 아우디엔시아(알토페루)를 아울렀다. 같은 해 10월 자유 무역 규정이 부에노스아이레스를 비롯한 항구에 스페인 안 다른 항구와의 직접 교역을 열어 주었다. 다만 팜파스 남쪽과 파타고니아, 그란차코는 원주민이 다스렸고 부왕령은 요새선 안쪽만 실제로 지배했다. 콜로니아델사크라멘토는 1680년 포르투갈이 라플라타강 건너에 세운 거점으로 오래도록 스페인 식민지 무역의 밀수 통로였다. 비에르티스는 1780년 부에노스아이레스에 인쇄소를 세우는 등 도시를 키웠고, 포토시의 은이 리마가 아니라 부에노스아이레스를 거쳐 나가는 길이 열렸다. 부에노스아이레스는 그 뒤 수십 년 사이 작은 변방 항구에서 남대서양의 중심 도시로 컸다."
  subjects: [rio-de-la-plata-viceroyalty, peru-viceroyalty, portuguese-brazil, spain, portugal]
  links:
    - { from: spain, to: rio-de-la-plata-viceroyalty, note: "1776년 페루 부왕령에서 갈라 세움(정식 설치 1777년 10월)" }
  tags: [politics, diplomacy, war]
  sources: ["The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)", "John Lynch, Bourbon Spain 1700–1808 (Basil Blackwell, 1989)", "David Rock, Argentina 1516–1987 (University of California Press, 1985)"]

- id: bourbon-captaincies-1777
  year: 1777
  endYear: 1789
  title:
    ko: "부르봉 개혁과 베네수엘라·칠레 총사령부(1777~1789)"
  summary:
    ko: "카를로스 3세의 스페인은 7년 전쟁에서 겪은 패배 뒤 식민지를 더 촘촘하게 다스리고 세금을 늘리려는 부르봉 개혁에 나섰다. 개혁의 한 갈래는 왕이 보낸 관리인 인텐덴트가 한 지방의 재정과 행정을 맡는 인텐덴시아 제도로, 1782년 리오데라플라타에서 시작해 페루(1784)와 칠레(1786)로 넓어졌다. 1777년 9월 8일 왕의 칙령은 베네수엘라(카라카스), 쿠마나, 마라카이보, 과야나, 마르가리타, 트리니다드를 베네수엘라 총사령부 하나로 묶었다. 이 땅은 이제 누에바그라나다 부왕령에 흩어져 속하지 않았고, 초대 총사령관 루이스 데 운사가는 1782년까지 일했으며 1786년 카라카스에 아우디엔시아가 생겼다. 칠레는 오래전부터 총사령관이 다스리는 지방이었지만 모든 일을 페루 부왕령에 보고했다. 총사령관 암브로시오 오히긴스가 일한 1788~1796년에 부왕에게서 사실상 떨어져 나왔다는 해로 1789년이 흔히 꼽히고, 1778년이나 그 밖의 해를 드는 자료도 있어 연도가 갈린다. 암브로시오 오히긴스는 뒷날 페루 부왕(1796~1801)이 되었고, 그의 아들이 칠레 독립의 지도자 베르나르도 오히긴스다. 이 개혁은 세금과 관직을 두고 아메리카에서 태어난 크리오요의 불만을 키웠다. 누에바그라나다에서는 세금 인상에 맞선 코무네로스 반란이 1781년 일어났고, 칠레의 두 인텐덴시아는 산티아고와 콘셉시온이었다. 한편 1779년 이후 스페인이 미국 독립 전쟁에 프랑스 편으로 참전하면서 아메리카 방어비와 세금 부담이 한층 커졌다. 베네수엘라는 카카오 수출과 야노스의 소 목축으로 부유해졌고 카라카스의 크리오요 대지주들이 힘을 키웠다."
  subjects: [venezuela-captaincy-general, chile-captaincy-general, new-granada-viceroyalty, peru-viceroyalty, spain]
  links:
    - { from: spain, to: venezuela-captaincy-general, note: "1777년 칙령으로 총사령부를 세움" }
  tags: [politics, society]
  sources: ["John Lynch, Bourbon Spain 1700–1808 (Basil Blackwell, 1989)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)"]

- id: tupac-amaru-1780
  year: 1780
  endYear: 1783
  title:
    ko: "투팍 아마루 2세의 반란(1780~1783)"
  summary:
    ko: "부르봉 개혁이 세금과 관세를 올리고 원주민의 강제 노동(미타)과 강매(레파르토)를 이어 가자 안데스에서 불만이 커졌다. 잉카 왕가의 후손이라 알려진 쿠라카(토착 지도자) 호세 가브리엘 콘도르칸키는 투팍 아마루 2세라 이름하고, 1780년 11월 4일 틴타에서 지방관 안토니오 데 아리아가를 붙잡아 처형했다. 그는 아내 미카엘라 바스티다스와 함께 반란을 이끌었고, 11월 18일 산가라라에서 성당에 몰린 스페인 쪽 병사 300~576명이 숨졌다(자료마다 갈린다). 그러나 반란군은 1781년 초 쿠스코를 치지 못했고, 투팍 아마루는 부하의 배신으로 붙잡혀 1781년 5월 18일 쿠스코 광장에서 처형되었다. 아내도 같이 처형되었다. 반란은 남쪽으로 번졌다. 아이마라 지도자 훌리안 아파사, 곧 투팍 카타리는 부인 바르톨리나 시사와 함께 1781년 라파스를 109일 동안 포위했으나 그해 11월 9일 붙잡혀 13일(15일이라는 기록도 있다) 처형되었다. 반란은 1783년 무렵까지 이어졌다. 이 일로 스페인은 쿠스코에 아우디엔시아를 세우고 투팍 아마루를 떠올리는 의복과 문서를 금지했다. 라파스는 리오데라플라타 부왕령, 쿠스코는 페루 부왕령에 속했다. 반란군에는 원주민과 메스티소, 일부 크리오요가 섞여 있었으나 학살이 커지자 크리오요 대부분이 스페인 쪽으로 돌아섰다. 투팍 아마루의 아들 이폴리토와 여러 친척도 함께 처형되었고, 막내 페르난도는 스페인으로 추방되었다. 투팍 아마루가 처형된 뒤에도 안데스 여러 곳에서 소규모 반란과 소문이 1780년대 내내 이어졌다. 재판은 쿠스코에서 감찰관 호세 안토니오 데 아레체의 지휘로 열렸다."
  subjects: [peru-viceroyalty, rio-de-la-plata-viceroyalty]
  tags: [war, society]
  sources: ["Charles F. Walker, The Tupac Amaru Rebellion (Harvard University Press, 2014)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)", "Sinclair Thomson, We Alone Will Rule: Native Andean Politics in the Age of Insurgency (University of Wisconsin Press, 2002)"]

- id: treaty-of-paris-1783
  year: 1783
  endYear: 1784
  title:
    ko: "파리 조약과 영국령 북아메리카의 재편(1783~1784)"
  summary:
    ko: "1783년 9월 3일 파리에서 영국의 데이비드 하틀리와 미국의 존 애덤스·벤저민 프랭클린·존 제이가 조약에 서명해 영국은 미국의 독립을 인정했다(유럽 쪽 평화는 「미국 독립 혁명과 유럽」(앞의 사건)). 국경은 오대호 한가운데와 레이크오브더우즈, 미시시피강, 북위 31도선, 메인의 세인트크로이강으로 정해졌다. 이는 오하이오강 북쪽의 땅을 퀘벡 주에서 떼어 미국에 주는 일이었고, 그 땅에 살던 쇼니와 델라웨어 등 원주민 나라들은 협상에 참여하지 못했다. 같은 날 따로 맺은 조약으로 영국은 영국령 플로리다(동·서플로리다)를 스페인에 돌려주었고, 그 땅은 스페인령 플로리다가 되었다. 허드슨 베이 회사의 루퍼츠랜드는 새 국경선 북쪽에 남았다. 조약은 로열리스트(영국 왕에게 충성한 사람들)의 재산 반환을 각 주에 권고했으나 주들은 대부분 따르지 않았고, 약 6만~8만 명이 미국을 떠났다. 그 가운데 상당수가 노바스코샤와 퀘벡 주로 가자 영국은 1784년 6월 18일 노바스코샤에서 뉴브런즈윅을 갈라 세웠고 초대 총독은 토머스 칼턴이었다. 케이프브레턴섬도 따로 식민지가 되었고, 1784년 10월 헤일디먼드 포고로 모호크의 조지프 브랜트가 이끄는 이로쿼이 일부가 그랜드강 유역에 땅을 받았다. 영국은 디트로이트와 나이아가라 같은 서북쪽 요새를 조약 뒤에도 쥐고 있다가 1794년 제이 조약에 따라 1796년에 넘겼다. 조약이 말한 세인트크로이강이 어느 강인지는 오래 다투다 1842년 웹스터–애시버턴 조약으로 정리되었다. 이 조약선은 이후 영미 사이 모든 국경 교섭의 출발점이 되었다. 조약이 모호하게 남긴 북서쪽 국경은 1818년 협약에서 북위 49도선으로 다시 정해졌다."
  subjects: [usa, uk, spain, british-florida, spanish-florida, province-of-quebec, ruperts-land, nova-scotia, new-brunswick]
