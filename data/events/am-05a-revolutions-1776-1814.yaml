- id: us-constitution-1787
  year: 1787
  endYear: 1789
  title:
    ko: "북서부 조례와 미국 헌법(1787~1789)"
  summary:
    ko: "연합 규약 아래의 중앙 정부는 세금을 걷거나 상업을 규제할 힘이 없어 빚과 반란에 흔들렸다. 1786~1787년 매사추세츠에서 대니얼 셰이스를 따르는 채무 농민들이 봉기하자 지도자들은 개편을 서둘렀다. 1787년 7월 13일 연합 의회는 북서부 조례를 채택해 오하이오강 북쪽 땅을 북서부 영토로 묶고, 거기서 3~5개 주를 세워 연방에 들이는 절차를 정했으며, 그 땅에서는 노예제를 금지했다. 조례는 원주민에게 최대한 성실하게 대한다고 밝혔으나 쇼니와 마이애미 등 원주민 나라들은 땅을 지키려 맞섰고 1790년대 초 북서부 원주민 연합과 미국의 전쟁으로 이어졌다. 한편 1787년 5월 25일부터 9월 17일까지 필라델피아에서 열린 제헌 회의는 조지 워싱턴을 의장으로 삼아 새 헌법을 만들었다. 헌법은 의회·대통령·법원으로 권력을 나누고, 하원 의석을 정하며 노예를 인구의 5분의 3으로 센다는 타협을 담았다. 델라웨어가 1787년 12월 7일 먼저 비준했고 1788년 6월 21일 뉴햄프셔가 아홉 번째로 비준해 헌법이 효력을 얻었다. 1789년 4월 30일 뉴욕에서 워싱턴이 초대 대통령으로 취임했고, 인권을 지키는 권리 장전 수정 조항이 곧 제안되었다. 헌법 제1조는 노예 수입 금지를 1808년까지 의회가 막지 못하게 했다. 첫 의회는 1789년 3월 뉴욕에서 열렸고, 1790년 5월 로드아일랜드가 열세 번째로 비준해 열세 주가 모두 헌법 아래에 모였다. 조지 워싱턴은 선거인단 표를 만장일치로 받았고 존 애덤스가 부통령이 되었다. 새 정부는 알렉산더 해밀턴을 재무 장관으로 삼아 국가 재정을 세워 나갔다. 비준을 두고 헌법을 지지한 연방주의자와 반대한 반연방주의자가 맞섰고, 해밀턴·매디슨·제이는 『연방주의자 논집』으로 헌법을 변호했다."
  subjects: [usa]
  tags: [politics]
  sources: ["Gordon S. Wood, The Creation of the American Republic, 1776–1787 (University of North Carolina Press, 1969)", "Richard Beeman, Plain, Honest Men: The Making of the American Constitution (Random House, 2009)", "Alan Taylor, American Revolutions: A Continental History, 1750–1804 (W. W. Norton, 2016)"]

- id: constitutional-act-1791
  year: 1791
  endYear: 1809
  title:
    ko: "1791년 헌법법과 어퍼캐나다·로어캐나다(1791~1809)"
  summary:
    ko: "미국이 독립한 뒤 로열리스트 수천 명이 오대호와 세인트로렌스강 위쪽에 자리 잡자 영어를 쓰는 개신교도와 프랑스어를 쓰는 가톨릭 주민이 한 식민지에서 함께 사는 일이 문제가 되었다. 영국 의회는 1791년 6월 10일 헌법법으로 퀘벡 주를 두 식민지로 나눴고, 법은 1791년 12월 26일 시행되었다. 서쪽은 어퍼캐나다로 영국식 법과 제도를 받았고, 동쪽은 로어캐나다로 1774년 「퀘벡 법」이 인정한 프랑스식 민법과 영주제 토지, 가톨릭 신앙과 교회의 특권을 지켰다. 퀘벡 주에는 전에 없던 선거 의회가 두 식민지에 생겼으나 총독과 임명 위원회의 힘이 여전히 세서 의회의 힘은 제한되었다. 영국 국교회를 지원하려고 두 식민지 땅의 7분의 1이 성직자 보유지로 따로 잡혔다. 어퍼캐나다의 첫 부총독 존 그레이브스 심코는 1793년 노예제를 단계로 줄이는 법을 만들었고 도읍을 나이아가라 쪽에서 요크(지금 토론토)로 옮겼다. 총독 도체스터 경이 둘을 아울렀다. 1809년에는 뉴펀들랜드 법으로 래브라도 해안이 로어캐나다에서 다시 뉴펀들랜드 관할로 돌아갔다. 이 분리는 뒷날 1837년 반란과 연합법으로 이어진다(「어퍼캐나다·로어캐나다 반란과 연합법(1837~1841)」(뒤의 사건)). 어퍼캐나다의 첫 의회는 1792년 9월 나이아가라의 뉴어크에서, 로어캐나다의 첫 의회는 1792년 12월 퀘벡에서 열렸다. 로어캐나다 의회는 프랑스계 의원이 다수였으나 임명 위원회는 영국계가 쥐어 두 집단의 다툼이 자랐다. 법은 총독이 법안에 거부권을 쓸 수 있게 했고 영국 왕이 최종 재가권을 쥐었다. 두 식민지는 1841년까지 따로 다스려졌다."
  subjects: [upper-canada, lower-canada, province-of-quebec, newfoundland, uk]
  links:
    - { from: uk, to: upper-canada, note: "1791년 헌법법으로 퀘벡 주를 나누어 세움" }
    - { from: uk, to: lower-canada, note: "1791년 헌법법으로 퀘벡 주를 나누어 세움" }
  tags: [politics, society]
  sources: ["Gerald M. Craig, Upper Canada: The Formative Years, 1784–1841 (McClelland & Stewart, 1963)", "Fernand Ouellet, Lower Canada, 1791–1840: Social Change and Nationalism (McClelland & Stewart, 1980)", "Phillip Buckner (ed.), Canada and the British Empire (Oxford University Press, 2008)"]

- id: haitian-revolution-1791
  year: 1791
  endYear: 1803
  title:
    ko: "생도맹그의 노예 봉기와 투생 루베르튀르(1791~1803)"
  summary:
    ko: "프랑스령 생도맹그(지금 아이티)는 세계 설탕·커피의 큰 몫을 내던 곳이었고, 주민 대부분은 아프리카에서 끌려왔거나 그 후손인 노예였다. 프랑스 혁명의 소식 속에서 1791년 8월 21일 밤 북부 평원에서 대규모 노예 봉기가 시작되었다. 8월 14일 보이카이만(부아카이망) 의식에서 부크만이 봉기를 다짐했다는 전승이 이어지나 이 일은 학설이 갈린다. 프랑스 위원 손토낙스가 1793년 북부의 해방을 선포하고 국민공회가 1794년 2월 식민지 전체의 노예제를 폐지하자, 처음 스페인 편에 섰던 투생 루베르튀르는 프랑스 쪽에 서서 영국과 스페인군을 물리쳤다. 1795년 바젤 조약으로 스페인이 섬 동쪽 산토도밍고 총사령부를 프랑스에 넘겼고, 영국은 1798년 철수했다. 투생은 1801년 1월 산토도밍고를 차지해 섬 전체를 장악했으며 7월 7일 종신 총독을 두는 헌법을 선포했다. 나폴레옹은 매부 르클레르가 이끄는 원정군을 1802년 초 보냈고, 투생은 6월 7일 붙잡혀 프랑스 쥐라산맥 기슭의 주 요새에서 1803년 4월 7일 숨졌다. 노예제를 되살리려는 시도는 거센 저항을 불렀고 황열병이 원정군을 쓰러뜨렸으며 르클레르도 1802년 11월 병으로 죽었다. 이 전쟁에서 흑인 약 20만 명과 프랑스군 5만 7천~7만 5천 명이 죽었다고 추산된다. 앞서 1790년 10월 자유 유색인의 권리를 요구하며 봉기한 뱅상 오제가 1791년 2월 6일 처형되어 갈등이 깊어져 있었다. 전쟁 동안 백인 농장주와 자유 유색인 수만 명이 섬을 떠나 쿠바 동쪽과 미국 루이지애나 등으로 흩어졌다. 봉기가 번진 북부의 카프프랑세는 당시 카리브해에서 가장 부유한 항구 가운데 하나였다. 투생은 노예로 태어나 1776년 무렵 자유를 얻은 것으로 전해진다."
  subjects: [saint-domingue, santo-domingo-captaincy, france, spain, uk]
  links:
