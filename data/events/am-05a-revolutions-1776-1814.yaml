# 아메리카 사건 1묶음 갈래 05a: 혁명과 새 질서의 시작 (1776 ~ 1814년)
# 범위: 미국 독립 전쟁과 헌법, 부르봉 개혁과 리오데라플라타 부왕령, 파리 조약과 영국령 북아메리카의 재편, 아이티 혁명, 루이지애나 매입, 러시아령 아메리카, 스페인령 아메리카 독립 운동의 시작(1776~1814 전체).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 모두 그레고리력. 확실하지 않은 날짜는 '무렵'. 원주민 구전·학설이 갈리는 연도는 갈림을 글에 밝혔다.
# 이름 규칙: 항목 이름(리오데라플라타 부왕령·퀘벡 주·어퍼캐나다·생도맹그 등)을 그대로 썼다. 한 이름이 둘 이상을 가리키는 경우(아이티·산토도밍고 등)는 처음에 밝혔다.
# 지도 결정과의 관계: 분쟁·공동 점유 띠와 원주민 땅은 글에서 일어난 일을 사실대로만 적었고, 영국령 온두라스는 1862년 이름이라 한 구절로만 다뤘다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 「미국 독립 혁명과 유럽」, 「킬 조약과 스웨덴-노르웨이 연합」.

- id: us-independence-war-1776
  year: 1776
  endYear: 1781
  title:
    ko: "독립 선언에서 요크타운까지(1776~1781)"
  summary:
    ko: "1775년 시작된 무력 충돌 속에서 대륙 회의는 1776년 7월 4일 토머스 제퍼슨이 초안을 쓴 「독립 선언서」를 채택해 13개 식민지가 영국 왕의 지배에서 벗어난다고 밝혔다. 이들은 새 나라 미국이 되었고, 대륙군 총사령관 조지 워싱턴은 1776년 겨울 델라웨어강을 건너 트렌턴을 기습하는 등 어려운 싸움을 이어 갔다. 1777년 11월 대륙 회의는 각 주가 주권을 지키는 느슨한 연합을 담은 연합 규약을 채택했으나 모든 주의 비준은 1781년 3월에야 끝났다. 1777년 10월 사라토가에서 영국군이 항복하자 프랑스가 1778년 2월 동맹과 통상 조약을 맺고 전쟁에 들어왔고, 군함과 병력, 돈이 미국을 도왔다(외교와 유럽 쪽 전쟁은 「미국 독립 혁명과 유럽」(앞의 사건)). 1778년 6월 영국군이 필라델피아를 비우고 뉴욕으로 물러나다 몬머스에서 싸웠고, 전쟁의 무게는 차츰 남부로 옮겨 갔다. 1780년 5월 찰스턴이 떨어져 미국군 약 5천 명이 항복했으나 같은 해 10월 킹스마운틴과 1781년 1월 카우펜스에서 이겨 전세가 뒤집혔다. 전쟁은 모두에게 같은 뜻이 아니었다. 영국 총독 던모어가 1775년 반란 주인의 노예에게 자유를 약속하자 많은 흑인이 영국 쪽으로 넘어갔고, 이로쿼이 연맹 여섯 나라는 갈려 대부분 영국 편에 서서 1779년 설리번 원정으로 마을과 밭을 잃었다. 1781년 10월 19일 워싱턴과 프랑스 장군 로샹보가 이끄는 연합군은 프랑스 함대가 바다를 막은 가운데 요크타운에서 콘월리스 경의 영국군 약 7천 명의 항복을 받았다. 이 패배로 영국 의회는 전쟁을 이어 갈 힘을 잃었다. 전쟁이 끝난 뒤에도 영국으로 떠난 로열리스트와 자유를 얻은 흑인의 앞날은 조약 협상에서 중요한 쟁점이 되었다."
  subjects: [usa, uk, france]
  links:
    - { from: usa, to: uk, note: "1776년 독립을 선언하고 1781년 요크타운에서 영국군의 항복을 받음" }
    - { from: france, to: usa, note: "1778년 동맹을 맺고 참전해 요크타운 포위에 힘을 보탬" }
  tags: [war, politics]
  sources: ["Gordon S. Wood, The American Revolution: A History (Modern Library, 2002)", "Alan Taylor, American Revolutions: A Continental History, 1750–1804 (W. W. Norton, 2016)", "Edmund S. Morgan, The Birth of the Republic, 1763–89 (University of Chicago Press, 1956)"]
