- id: kingdom-of-haiti-1806
  year: 1806
  endYear: 1820
  title:
    ko: "아이티의 남북 분열과 크리스토프의 북부 왕국(1806~1820)"
  summary:
    ko: "데살린이 암살된 1806년 10월 17일 아이티는 두 갈래로 갈렸다. 북부는 앙리 크리스토프가 이끌었고, 그는 1807년 2월 17일 헌법으로 아이티국 대통령이 되었다. 남부는 포르토프랭스에서 알렉상드르 페티옹이 대통령으로 공화국을 세웠다. 크리스토프는 1811년 3월 28일 왕을 선포해 아이티 북부 왕국을 세웠고 6월 2일 왕위에 올라 앙리 1세가 되었다. 그는 귀족 제도를 만들고 밀로의 상수시궁(1813년 무렵 대부분 완성)과 프랑스의 재침공에 맞서려는 산꼭대기 요새 라페리에르(시타델) 같은 건물을 세웠으며, 농장 제도를 이어 가려고 일꾼을 땅에 붙들어 두는 강한 규율을 폈다. 반면 페티옹은 땅을 나눠 가진 소농을 늘렸고, 1815~1816년 시몬 볼리바르에게 무기와 배를 대 주는 조건으로 노예 해방을 약속받았다. 두 나라는 서로 공격하지 못한 채 프랑스의 재침공을 두려워했다. 페티옹은 1818년 3월 29일 죽었고 장피에르 부아예가 대통령 자리를 이었다. 크리스토프는 1820년 8월 중풍으로 쓰러지고 생마르크에서 군이 반란을 일으키자 10월 8일 스스로 목숨을 끊었다고 전해진다. 부아예는 1820년 북부를 합쳐 아이티를 다시 하나로 만들었다. 크리스토프는 1812년 앙리 법전을 내려 농장 노동과 학교를 관리했다. 페티옹은 1816년 10월 9일 종신 대통령이 되었다. 크리스토프는 귀족을 87명에서 재위 말 134명으로 늘렸고, 영국과 서로 카리브 식민지를 위협하지 않기로 하는 합의를 맺어 영국 해군의 경고와 무역 수입을 얻었다. 1815년 1월에는 윌리엄 윌버포스에게 편지를 보냈다. 크리스토프가 죽고 열흘 뒤 아들이자 후계자 자크빅토르 앙리도 암살되었다."
  subjects: [kingdom-of-haiti, haiti]
  links:
    - { from: kingdom-of-haiti, to: haiti, note: "1807년 북부 아이티국을 세워 남부 공화국과 맞섬" }
    - { from: haiti, to: kingdom-of-haiti, note: "1820년 부아예가 북부 왕국을 합침" }
  tags: [politics, society]
  sources: ["Julia Gaffield, Haitian Connections in the Atlantic World: Recognition after Revolution (University of North Carolina Press, 2015)", "Marlene L. Daut, Tropics of Haiti (Liverpool University Press, 2015)", "Laurent Dubois, Haiti: The Aftershocks of History (Metropolitan Books, 2012)"]
