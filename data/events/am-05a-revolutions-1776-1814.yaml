  tags: [war, politics]
  sources: ["The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)", "John Lynch, The Spanish American Revolutions 1808–1826 (W. W. Norton, 1973)", "David Rock, Argentina 1516–1987 (University of California Press, 1985)"]
