- id: portuguese-court-1808
  year: 1808
  endYear: 1815
  title:
    ko: "포르투갈 왕실의 브라질 이전과 브라질 왕국(1808~1815)"
  summary:
    ko: "나폴레옹이 영국과 거래하는 항구를 막는 대륙 봉쇄령을 내리고 포르투갈에 군대를 보내자, 섭정 왕자 주앙은 영국의 보호를 받는 길을 골랐다. 포르투갈 대사 도밍고스 안토니우 드 소자 코치뉴가 런던에서 영국 해군의 보호를 받는 대가로 영국에 항구를 열고 마데이라 제도를 해군 기지로 내주기로 합의해 두었다. 1807년 11월 27일 왕실과 신하들이 배에 올랐고 선단은 11월 29일 리스본을 떠났으며, 함께 떠난 사람은 1만 명 가까이였다. 프랑스군이 포르투갈로 들어오기 직전이었다. 1808년 1월 22일 왕자는 사우바도르에 닿았고, 이 무렵 항구를 우방국 배에 열어 브라질이 포르투갈 상인을 거치지 않고 영국 같은 나라와 직접 거래하게 하는 칙령을 내렸다. 3월 7일 왕실은 리우데자네이루에 들어갔고, 4월 1일에는 브라질에서 공업을 세우는 일을 허용하는 허가장이 나왔다. 이로써 식민지 포르투갈령 브라질이 제국 전체를 다스리는 본거지가 되었고, 리우데자네이루는 궁정과 관청, 은행이 들어선 도시로 바뀌었다. 1815년 12월 16일 주앙은 포르투갈·브라질·알가르브 연합 왕국을 세워 브라질을 식민지가 아닌 한 왕국으로 올렸다. 1816년 어머니 마리아 1세 여왕이 죽자 주앙은 왕 주앙 6세가 되었고, 즉위식은 1818년 리우데자네이루에서 치러졌다. 그는 1821년 4월 포르투갈로 돌아갔으며, 아들 페드루가 남아 브라질의 독립을 이끌게 된다(「이피랑가의 외침과 브라질 제국의 독립(1822~1825)」(뒤의 사건)). 유럽 군주가 식민지에 자리 잡은 드문 사례로, 왕을 잃고 갈라진 스페인령 아메리카와 달리 브라질이 한 덩어리로 남는 바탕이 되었다고 평가된다."
  subjects: [portuguese-brazil, portugal, uk]
  links:
    - { from: portugal, to: portuguese-brazil, note: "1808년 왕실을 옮기고 1815년 연합 왕국으로 올림" }
  tags: [politics, economy]
  sources: ["Kirsten Schultz, Tropical Versailles: Empire, Monarchy, and the Portuguese Royal Court in Rio de Janeiro, 1808–1821 (Routledge, 2001)", "Lilia Moritz Schwarcz & Heloisa M. Starling, Brazil: A Biography (Farrar, Straus and Giroux, 2018)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)"]

- id: may-revolution-1810
  year: 1810
  endYear: 1811
  title:
    ko: "5월 혁명과 파라과이의 독립(1810~1811)"
  summary:
    ko: "1808년 나폴레옹은 스페인 왕 페르난도 7세를 물러나게 하고 형 조제프 보나파르트를 왕좌에 앉혔고, 스페인은 왕의 이름으로 중앙 평의회를 세워 맞섰다. 1810년 초 프랑스군이 세비야를 차지해 평의회가 흩어지고 카디스에 섭정 위원회가 세워졌다는 소식이 5월 중순 부에노스아이레스에 닿았다. 5월 22일 열린 카빌도에는 초청받은 약 450명 가운데 251명이 모였고, 23일 표결에서 리오데라플라타 부왕령의 부왕 시스네로스를 물러나게 하자는 쪽이 155 대 69로 이겼다. 시스네로스가 5월 25일 물러나자 코르넬리오 사아베드라를 의장으로 하는 제1 평의회가 세워졌다. 평의회는 페르난도 7세의 이름으로 다스린다고 밝혔고, 모든 지역이 이를 따르지는 않았다. 몬테비데오는 섭정 위원회를 지지했고 부왕령의 수도로 삼아졌으며, 리니에르스는 코르도바에서 반혁명을 일으켰으나 진압되었다. 1809년 추키사카와 라파스의 봉기가 스페인군에 꺾여 있던 알토페루에서는 1810년 11월 평의회군이 수이파차에서 이겼으나 1811년 6월 20일 와키 전투에서 지자 다시 페루 부왕령의 지휘 아래 놓였다. 아순시온은 섭정 위원회에 충성을 맹세하고 평의회를 거부했다. 마누엘 벨그라노가 이끄는 원정군은 1810년 12월 19일 파라나강을 건너 캄피추엘로에서 이겼으나 1811년 3월 9일 타쿠아리에서 크게 져 하루 안에 파라과이를 떠나기로 휴전했다. 5월 14~15일 페드로 후안 카바예로가 이끄는 장교들이 아순시온 병영을 장악해 총독 베르나르도 데 벨라스코의 지휘권을 빼앗았고, 6월 17일 첫 국민 회의가 열려 풀헨시오 예그로스를 우두머리로 하는 다섯 사람의 최고 평의회가 세워졌다. 파라과이는 부에노스아이레스에 종속되지 않겠다는 뜻을 밝히고 10월 12일 연합 조약을 맺었다. 한편 부왕 엘리오는 부에노스아이레스에 맞서려고 병력을 모으려 1811년 2월 13일 스페인령 포클랜드 제도의 푸에르토솔레다드 주민과 병사를 배로 몬테비데오로 옮겼고, 섬에는 페르난도 7세의 영유권을 알리는 납판이 남았다."
