- id: humboldt-1799
  year: 1799
  endYear: 1804
  title:
    ko: "훔볼트의 아메리카 탐사와 부르봉 말기의 부왕령(1799~1804)"
  summary:
    ko: "프로이센의 자연과학자 알렉산더 폰 훔볼트는 프랑스의 식물학자 에메 봉플랑과 함께 스페인 왕 카를로스 4세의 허가를 받아 1799년 6월 스페인을 떠났다. 두 사람은 1799년 7월 베네수엘라 총사령부의 쿠마나에 닿았고, 1800년 2~6월 약 2,776킬로미터의 오리노코강과 카시키아레 수로를 조사해 오리노코와 아마존이 이어진다는 것을 확인한 뒤 1800~1801년에는 쿠바 총사령부의 아바나에 머물렀다. 이어 1801년 7~9월 누에바그라나다 부왕령의 보고타에서 호세 셀레스티노 무티스를 만났으며, 1802년 침보라소산을 5,878미터 높이까지 올라 서양인으로서는 그때 기록을 세웠다. 페루 부왕령의 리마를 거친 뒤 1803년 2월 15일 아카풀코에 상륙해 약 1년 동안 누에바에스파냐 부왕령을 돌며 은광과 인구, 세금을 기록했고, 1804년 1월부터 4월까지 쿠바에 다시 들른 뒤 미국에서 토머스 제퍼슨 대통령을 만나고 8월 3일 프랑스 보르도에 닿았다. 훔볼트는 노예제와 원주민 노동의 가혹함을 날카롭게 비판했고, 그의 정치·지리 기록은 크리오요 지식인이 자기 땅을 하나로 보는 데 영향을 주었다. 이 시기에 스페인 왕실은 1802년 7월 15일 왕령으로 마이나스와 키호스 지방을 누에바그라나다 부왕령에서 떼어 페루 부왕령에 붙였다. 선교와 군사 방어의 편의가 이유였으나 이 칙령의 내용과 효력 범위는 자료마다 갈린다. 봉플랑은 약 6천 종의 식물 표본을 모았다. 1802년 1월 6일 키토에 닿았고, 같은 해 11월 9일 리마의 항구 카야오에서 수성이 태양 앞을 지나는 일을 관측하며 구아노가 비료로 쓰인다는 점도 연구했다."
  subjects: [new-spain-viceroyalty, new-granada-viceroyalty, peru-viceroyalty, venezuela-captaincy-general, cuba-captaincy-general, spain]
  tags: [culture, politics]
  sources: ["Andrea Wulf, The Invention of Nature: Alexander von Humboldt's New World (Alfred A. Knopf, 2015)", "Alexander von Humboldt, Personal Narrative of Travels to the Equinoctial Regions of the New Continent (Longman, 1814–1829)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)"]

- id: louisiana-purchase-1800
  year: 1800
  endYear: 1804
  title:
    ko: "산일데폰소 조약과 루이지애나 매입(1800~1804)"
  summary:
    ko: "스페인령 루이지애나는 1762년 프랑스가 스페인에 넘긴 땅이었으나 1800년 10월 1일 제3차 산일데폰소 조약으로 프랑스에 돌아갔다. 나폴레옹은 생도맹그의 설탕 식민지와 이 땅을 이어 아메리카 제국을 세우려 했다. 그러나 르클레르 원정군이 생도맹그에서 무너지고 영국과의 전쟁이 다가오자 계획을 버렸다(「생도맹그의 노예 봉기와 투생 루베르튀르(1791~1803)」(앞의 사건)). 토머스 제퍼슨 대통령은 뉴올리언스를 사려고 로버트 리빙스턴을 파리에 보냈고 제임스 먼로가 뒤따랐는데, 프랑스는 1803년 4월 11일 루이지애나 전체를 1,500만 달러에 팔겠다고 먼저 제안했다. 4월 30일 리빙스턴·먼로와 프랑스 재무 장관 바르베마르부아가 조약에 서명했고, 미국 상원은 10월 20일 24 대 7로 비준했다. 값 가운데 약 1,125만 달러는 프랑스에 주고 약 375만 달러는 미국 시민의 프랑스 채권을 대신 갚는 데 썼다. 스페인은 1803년 11월 30일 뉴올리언스에서 프랑스에 땅을 정식으로 넘겼고, 12월 20일 프랑스가 미국에 넘겼으며, 미주리강 쪽 윗녘 땅은 1804년 3월 9~10일 세인트루이스에서 넘겼다. 명목상 넓이는 약 214만 제곱킬로미터였으나 그 땅 대부분에는 오세이지·수·코만치 등 원주민 나라들이 살았고 이들은 매입 협상에 참여하지 못했다. 1804년 5월 메리웨더 루이스와 윌리엄 클라크가 탐험대를 이끌고 미주리강을 거슬러 올라 1806년 9월 돌아왔다. 서쪽 경계는 1819년 애덤스–오니스 조약에서야 정해졌다(「애덤스–오니스 조약과 플로리다 인계(1819~1821)」(뒤의 사건)). 제퍼슨은 헌법이 땅을 사는 권한을 따로 밝히지 않는다는 점을 고민했으나 조약을 받아들였다."
  subjects: [spanish-louisiana, usa, france, spain]
  links:
    - { from: france, to: usa, note: "1803년 매입 조약으로 루이지애나를 넘김" }
  tags: [diplomacy, politics]
  sources: ["Alexander DeConde, This Affair of Louisiana (Charles Scribner's Sons, 1976)", "Peter J. Kastor, The Nation's Crucible: The Louisiana Purchase and the Creation of America (Yale University Press, 2004)", "Alan Taylor, American Republics: A Continental History of the United States, 1783–1850 (W. W. Norton, 2021)"]

- id: british-guiana-1803
  year: 1803
  endYear: 1814
  title:
    ko: "영국의 데메라라·에세키보·버비스 점령과 런던 조약(1803~1814)"
  summary:
    ko: "남아메리카 북동쪽 해안의 에세키보와 데메라라, 버비스는 네덜란드령 식민지로 설탕과 면화 농장에서 아프리카 출신 노예를 부렸다. 프랑스 혁명 전쟁 중이던 1796년 영국이 이 세 곳을 싸우지 않고 점령했고, 1802년 아미앵 조약으로 네덜란드 바타비아 공화국에 돌려주었다. 전쟁이 다시 번지자 영국은 아미앵 조약 뒤 채 한 해가 못 되어 1803년 이 땅을 다시 차지했다. 영국은 점령 동안 네덜란드의 법과 제도를 크게 바꾸지 않고 농장주의 권리를 지켜 주었다. 1807년 영국 의회가 노예 무역을 금지하자 새 노예 수입은 끊겼고, 영국 정부는 노예 인구를 등록하고 관리하려 했다. 이웃 수리남도 1804년 영국이 점령했다가 1816년 네덜란드에 돌려주었다. 1814년 8월 13일 영국과 네덜란드가 런던에서 맺은 협약으로 네덜란드는 데메라라와 에세키보, 버비스를 영국에 넘겼고 같은 협약으로 케이프 식민지도 영국령이 되었다. 세 식민지는 1831년 영국령 기아나 한 식민지로 합쳐졌다. 영국은 이 대가로 네덜란드에 600만 파운드를 내기로 했다. 데메라라의 중심 도시 스타브룩은 1812년 조지타운으로 이름이 바뀌었고, 1823년 8월 18일부터 이틀 남짓 데메라라의 약 37개 농장에서 9천~1만 5천 명으로 추산되는 노예가 가담한 봉기가 일어났다. 이 땅의 경제는 오로지 사탕수수 재배에 기댔고 이익은 영국에 사는 부재 지주에게 많이 흘러갔다. 영국은 1833년 노예제 폐지법에 따라 1830년대에 식민지 노예를 해방했다. 베네수엘라는 에세키보강 서쪽 전체를 자기 땅이라 내세웠고, 1840년 쇼움부르크 선이 그어지면서 분쟁이 뚜렷해졌다."
  subjects: [british-guiana, dutch-essequibo-berbice, dutch-suriname, uk, batavian-republic]
