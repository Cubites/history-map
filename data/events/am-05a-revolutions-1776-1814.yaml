- id: grito-de-dolores-1810
  year: 1810
  endYear: 1815
  title:
    ko: "돌로레스의 외침과 이달고·모렐로스의 봉기(1810~1815)"
  summary:
    ko: "1808년 스페인 왕이 갈리면서 누에바에스파냐 부왕령에서도 누가 다스릴 것인지를 두고 갈등이 일었다. 부왕 호세 데 이투리가라이가 1808년 9월 물러난 뒤 부왕이 거듭 바뀌었고, 1810년 9월 14일 프란시스코 하비에르 베네가스가 부왕에 올랐다. 이틀 뒤인 1810년 9월 16일 돌로레스 마을의 사제 미겔 이달고는 성당의 종을 울려 사람들을 모으고 압제에 맞서 일어서자고 호소했다. 이 돌로레스의 외침으로 수백 명으로 시작한 무리는 원주민과 메스티소 농민을 끌어들이며 불어났다. 9월 28일 이달고의 군대는 몇 시간의 싸움 끝에 과나후아토의 알혼디가 데 그라나디타스를 차지했고, 10월 30일 멕시코시티 가까운 몬테데라스크루세스에서 왕당파군을 이겼으나 수도를 치지 않고 물러났다. 11월 7일 아쿨코에서 펠릭스 마리아 칼레하의 왕당파군에 져 많은 병사가 흩어졌고, 1811년 1월 과달라하라 가까운 칼데론 다리에서 크게 졌다. 이달고는 3월 21일 이그나시오 엘리손도의 배신으로 붙잡혀 사제직을 빼앗긴 뒤 7월 30일 치와와에서 총살되었다. 이달고의 옛 제자 호세 마리아 모렐로스는 1810년 10월 이달고를 만나 남쪽에서 싸우는 일을 맡았고, 1812년 쿠아우틀라에서 칼레하의 포위를 72일(2월 19일~5월 2일) 견딘 뒤 5월 2일 뚫고 나왔다. 그해 11월 25일 오악사카를 차지했고 1813년 9월 칠판싱고 의회를 열어 독립과 노예제 폐지, 인종 차별 철폐를 담은 「국민의 감정」을 받아들였다. 의회는 1813년 11월 6일 독립을 선언했고 1814년 10월 22일 아파칭간 헌법이 공화국을 선포했다. 그러나 1813년 3월 부왕이 된 칼레하의 압박 속에서 모렐로스는 1815년 11월 테말라카에서 붙잡혀 12월 22일 총살되었다. 비센테 게레로가 싸움을 이어 갔다."
  subjects: [new-spain-viceroyalty, spain]
  tags: [war, politics, society]
  sources: ["Eric Van Young, The Other Rebellion: Popular Violence, Ideology, and the Mexican Struggle for Independence, 1810–1821 (Stanford University Press, 2001)", "Timothy E. Anna, The Fall of the Royal Government in Mexico City (University of Nebraska Press, 1978)", "The Cambridge History of Latin America, vol. 3 (Cambridge University Press, 1985)"]
