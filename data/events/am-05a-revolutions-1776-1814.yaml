- id: british-invasions-1806
  year: 1806
  endYear: 1807
  title:
    ko: "영국의 리오데라플라타 침입(1806~1807)"
  summary:
    ko: "나폴레옹 전쟁 속에서 영국은 스페인 식민지 무역에 발판을 얻으려고 리오데라플라타 부왕령의 부에노스아이레스를 노렸다. 1806년 6월 25~27일 윌리엄 베레스퍼드가 이끄는 영국군이 퀼메스에 내려 부에노스아이레스를 차지했다. 부왕 라파엘 데 소브레몬테는 국고를 들고 코르도바로 달아나 비겁하다는 비난을 샀다. 몬테비데오에서 병력을 모은 프랑스 출신 장교 산티아고 데 리니에르스가 8월 4일 라스콘차스에 상륙해 열흘 남짓 만에 베레스퍼드의 항복을 받았고, 영국의 점령은 한 달 반쯤 이어졌다. 열린 카빌도(시의회)는 소브레몬테의 군사 권한을 리니에르스에게 넘겼으며, 소브레몬테는 끝내 부에노스아이레스로 돌아가지 못하고 몬테비데오로 갔다. 1807년 2월 3일 새뮤얼 오치뮤티와 해군 제독 찰스 스털링이 몬테비데오를 공격해 점령했고, 스페인 쪽 기록으로 약 600명이 죽거나 다치고 약 2,000명이 사로잡혔다. 같은 해 6월 27일 존 화이틀록 중장이 증원군을 이끌고 상륙해 약 1만 3천 명을 거느렸다. 그는 7월 초 미세레레에서 리니에르스를 꺾은 뒤 7월 4~5일 포병 없이 열두 갈래 종대로 시내에 들어갔으나, 민병과 시민이 지붕과 거리에서 맞서 크게 졌다. 영국군은 전사 약 300명, 부상 약 700명, 포로 1,600~1,800명으로 추산되며, 화이틀록은 7월 7일 리니에르스와 휴전을 맺어 두 달 안에 라플라타강 유역에서 물러나기로 했고, 영국군은 부에노스아이레스에서 곧, 몬테비데오에서 9월 9일까지 물러났다. 그는 영국으로 돌아가 군법회의에서 파면되었다. 스페인 왕은 이 공으로 리니에르스를 부왕에 임명했다. 이 싸움에서 파트리시오스·아리바뇨스·파르도·모레노 부대 같은 크리오요 민병대가 크게 자라 군사력과 정치적 발언권을 얻었고, 본국의 도움 없이 이긴 경험은 스스로 다스리려는 뜻을 키워 1810년 5월 혁명의 밑바탕이 되었다(「5월 혁명과 파라과이의 독립(1810~1811)」(뒤의 사건))."
  subjects: [rio-de-la-plata-viceroyalty, uk, spain]
  links:
