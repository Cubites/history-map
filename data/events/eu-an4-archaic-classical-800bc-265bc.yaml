    - { name: 쿠마이 앞바다, at: [14.05, 40.81], year: -473 }

- id: odrysian-kingdom-480bc
  year: -479
  endYear: -399
  title:
    ko: "오드리사이 왕국(기원전 480 무렵~400): 테레스 1세와 시탈케스, 트라키아의 첫 큰 나라"
  summary:
    ko: "트라키아는 부족들로 나뉜 땅이었다. 헤로도토스는 트라키아 사람들이 인도인 다음으로 큰 민족인데 한 사람의 지배 아래 뭉치면 당할 이가 없었을 것이라 적는다(5.3). 투키디데스는 테레스 1세가 기원전 480년 무렵 ‘큰 오드리사이 왕국’을 처음 세웠다고 한다(2.29). 페르시아가 유럽에서 물러난 기원전 479년과 맞물린다. 테레스의 아들 시탈케스(재위 431~424)는 아테네와 동맹을 맺고 기원전 429/428년 겨울 마케도니아를 침공했는데, 투키디데스는 군대가 15만 명(3분의 1이 기병)이었다고 적는다(2.95~101; 수는 과장일 수 있다). 그의 나라는 아브데라에서 이스트로스(도나우) 강어귀까지 바닷가를 아울렀고 그리스 도시가 공물을 냈다. 시탈케스가 424년 트리발로이와 싸우다 죽자 조카 세우테스 1세가 이었고, 이후 아마도코스 1세(메도코스)로 왕위가 이어졌다(목록에 따라 테레스와 시탈케스 사이에 스파라도코스를 넣기도 한다). 크세노폰이 기원전 400/399년에 만난 세우테스 2세는 메도코스의 궁정에서 자라 그에게 딸리면서 맞선 군주로 에게해와 프로폰티스 쪽 바닷가를 다스렸으며(『아나바시스』 7), 왕국이 갈라졌음을 보여 준다. 코티스 1세(384~360)와 케르소블렙테스, 세우테스 3세는 다루지 않고, 필리포스 2세의 정복(342)은 뒤의 사건이다. 지도는 오드리사이 왕국을 기원전 479년 에게해 북안 트라키아에, 430년 버전에 하이모스산맥 북쪽 바닷가에 그리고, 400년 갈라질 때 북쪽 바닷가를 다키아 부족 묶음으로 돌린다."
  subjects: [odrysian-kingdom, thracian-tribes, dacian-tribes, greek-city-states, macedonia-kingdom]
  links:
    - { from: odrysian-kingdom, to: macedonia-kingdom, note: "시탈케스의 침공(기원전 429/428)" }
  tags: [politics, war]
  sources: ["Thucydides(투키디데스), Historiai(『펠로폰네소스 전쟁사』) 2.29, 2.95~101 (Charles Forster Smith 영역, Loeb, 1919~1923)", "Xenophon(크세노폰), Anabasis(『아나바시스』) 7 (Carleton L. Brownson 영역, 개정 John Dillery, Loeb, 1998)", "Zofia Halina Archibald, The Odrysian Kingdom of Thrace: Orpheus Unmasked (1998)", "Herodotus(헤로도토스), Historiai(『역사』) 5.3~10 (A. D. Godley 영역, Loeb, 1920~1925)"]

- id: athens-pericles-461bc
  year: -460
  endYear: -428
  title:
    ko: "페리클레스의 아테네(기원전 461~429): 델로스 동맹의 제국화와 민주정, 철학과 ‘축의 시대’"
  summary:
    ko: "기원전 461년 에피알테스가 아레오파고스의 권한을 줄이는 개혁을 하고 암살된 뒤 페리클레스가 아테네 정치의 중심에 섰다. 아테네는 델로스 동맹의 금고를 기원전 454년 무렵 델로스에서 아테네로 옮겼고(연대는 논쟁이 있다) 그 돈으로 해군과 파르테논 신전(447~432)을 지었다. 동맹 도시는 공납을 내며 이탈하려 하면 군대로 눌렸다(타소스 465~463, 에우보이아 446, 사모스 440~439; 투키디데스 1.98~101, 1.114~117). 동맹이 아테네 제국으로 바뀐 이 강압은 스파르타와 그 동맹이 아테네를 두려워하는 까닭이 되었다. 아테네는 460~446년 펠로폰네소스 쪽과 싸운 끝에 446/445년 30년 평화를 맺었다. 페리클레스는 공직 수당 같은 제도로 민주정을 넓혔으나 시민은 성인 남성에 한했고(451년 시민권법으로 양쪽 부모가 시민이어야 했다) 여성·거류민·노예는 빠졌다. 이 시기 아테네에서 비극(아이스킬로스·소포클레스·에우리피데스), 역사(헤로도토스), 소피스트와 소크라테스(기원전 470~399)의 철학이 꽃폈다. 조금 앞서 중국에서는 공자(기원전 551~479)가 활동했고 같은 5세기에 인도에서는 부처가(생몰 연대는 기원전 5세기 안팎으로 논쟁) 가르침을 폈는데, 철학자 카를 야스퍼스는 이 무렵의 철학·종교 혁신을 ‘축의 시대’라 불렀다(서로 영향을 주었다는 뜻이 아니라 같은 시기의 병행이라는 개념이다). 고조선이 있던 한반도와 만주에서는 철기가 퍼지기 시작할 무렵이었다(`iron-age`). 지도는 델로스 동맹을 따로 그리지 않고 그리스 도시국가 묶음에 둔다."
  subjects: [greek-city-states, gojoseon]
  tags: [politics, culture]
  sources: ["Thucydides(투키디데스), Historiai(『펠로폰네소스 전쟁사』) 1.89~118, 2.12~65 (Charles Forster Smith 영역, Loeb, 1919~1923)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『페리클레스』 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "P. J. Rhodes, A History of the Classical Greek World 478–323 BC (2006)", "Karl Jaspers, Vom Ursprung und Ziel der Geschichte(『역사의 기원과 목표』) (1949)"]

- id: celtic-la-tene-450bc
  year: -449
  endYear: -334
  title:
    ko: "켈트인의 이동과 라 텐 문화(기원전 5세기 중엽~4세기): 포강 유역의 정착과 도나우 켈트"
  summary:
    ko: "켈트인은 철기 시대 중부 유럽의 할슈타트 문화(기원전 8~5세기)에서 자랐고, 기원전 5세기 중엽부터 라인강 중류·보헤미아·프랑스 동부에서 새 양식의 무기와 장신구를 남겼다(라 텐 문화, 이름은 스위스 뇌샤텔호의 유적에서). 켈트라는 이름은 헤로도토스가 쓴 그리스 말 ‘켈토이’에서 나왔고 하나의 민족을 뜻하지 않는다. 켈트어를 쓰는 여러 부족이 비슷한 철기 문화를 나누었을 뿐이다. 기원전 5세기 말~4세기 초 일부가 알프스를 넘어 포강 유역에 정착해 인수브레스·세노네스·보이이 같은 부족이 에트루리아 도시를 밀어냈다(폴리비오스 2.17). 리비우스(5.33~35)는 인수브레스의 도착을 6세기 초 타르퀴니우스 프리스쿠스 때 일로 적으나 실제 이동 연대는 논쟁이다. 이들의 이동은 용병 고용, 약탈, 인구 압력 같은 이유가 거론되지만 하나로 정해지지 않았다. 기원전 396년 무렵 켈트가 에트루리아의 멜품을 차지했다는 전승이 있다(뒤의 사건). 기원전 335년 마케도니아의 알렉산드로스가 도나우를 건널 때 아드리아해 가까운 곳의 켈트 사절이 찾아와 하늘이 무너지는 일 말고는 두려워할 것이 없다고 했다는 일화를 아리아노스가 전한다(1.4). 지도는 켈트 부족 묶음을 기원전 430년 알프스 너머 갈리아·남독일에, 396년 포강 유역에 그리고, 아리아노스가 도나우 중류의 켈트를 적은 335년에는 켈트 부족·다키아 부족·일리리아·판노니아 부족 묶음을 카르파티아 분지와 도나우 중류로 넓혀 칠한다."
  subjects: [celtic-tribes, etruscan-city-states, macedonia-kingdom, dacian-tribes, illyrian-tribes]
  links:
    - { from: celtic-tribes, to: etruscan-city-states, note: "포강 유역의 정착(기원전 396 무렵)" }
  tags: [society, culture]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 2.17~35 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Ab urbe condita(『로마사』) 5.33~35 (B. O. Foster 영역, Loeb, 1924)", "Arrian(아리아노스), Anabasis Alexandrou(『알렉산드로스 원정기』) 1.4 (P. A. Brunt 영역, Loeb, 1976)", "Barry Cunliffe, The Ancient Celts (1997)", "Simon James, The World of the Celts (1993)"]

- id: bosporan-spartocids-438bc
  year: -437
  endYear: -283
  title:
    ko: "보스포로스 왕국(기원전 438 무렵~): 스파르토코스 왕조와 아테네의 곡물"
  summary:
    ko: "흑해 북안 케르치 해협 양쪽에는 밀레투스인이 기원전 6세기에 세운 판티카파이온(케르치)과 기원전 543년 무렵 페르시아의 키루스를 피해 온 테오스인이 세운 파나고리아(타만) 같은 도시가 있었고, 기원전 480년 무렵부터 아르카이아낙티다이 가문이 다스렸다. 기원전 438년 스파르토코스 1세가 이를 몰아내고 보스포로스 왕국을 세웠다(디오도로스 12.31). 지도는 이 해를 성립으로 보고 430년 버전에 케르치·타만 일대를 그린다. 왕조는 스파르토코스 1세(재위 438~433), 사티로스 1세(433~389)와 셀레우코스(433~393 공동 통치), 레우콘 1세(389~349)와 아시아 쪽 고르기포스 1세, 스파르토코스 2세와 파이리사데스 1세(349~342 공동 통치), 파이리사데스 1세 단독(342~310), 사티로스 2세(310), 프리타니스(310~309), 에우멜로스(309~304), 스파르토코스 3세(304~284, 처음 ‘바실레우스’라 칭함)로 이어졌다(연대는 연구마다 몇 해 다르다). 왕의 군대는 대부분 스키타이 기병이었고 스키타이와는 교역과 혼인으로 얽혔으나 스키타이의 팽창에 눌려 사라진 그리스 정착지도 있었다. 이 나라의 밀은 아테네가 수입하는 곡식의 큰 몫이어서 레우콘 1세는 아테네 상선에 우선권과 면세를 주었고, 아테네는 영예로 답했다(데모스테네스 20 『레프티네스 반박』 29~33). 기원전 310년 파이리사데스가 죽자 아들들이 왕위를 다퉈 에우멜로스가 이겨 304년까지 다스렸다(디오도로스 20.22~26)."
  subjects: [bosporan-kingdom, greek-city-states, scythian-kingdom, scythian-tribes]
  links:
    - { from: bosporan-kingdom, to: greek-city-states, note: "곡물 수출(아테네)" }
  tags: [economy, politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 12.31, 20.22~26 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Demosthenes(데모스테네스), Against Leptines(『레프티네스 반박』) 20.29~33 (J. H. Vince 영역, Loeb, 1930)", "Gocha R. Tsetskhladze 엮음, North Pontic Archaeology: Recent Discoveries and Studies (2001)", "Renate Rolle, The World of the Scythians (1989)"]

- id: peloponnesian-war-431bc
  year: -430
  endYear: -403
  title:
    ko: "펠로폰네소스 전쟁(기원전 431~404): 아테네 역병, 멜로스, 시칠리아 원정(415~413), 아이고스포타미"
  summary:
    ko: "기원전 431년 봄 테베가 아테네와 동맹한 플라타이아를 기습하며 펠로폰네소스 전쟁이 시작되었다. 스파르타 왕 아르키다모스가 아티카를 침공하고 페리클레스의 아테네는 성벽 안에서 해군으로 맞섰다. 430년 아테네를 덮친 역병으로 시민이 크게 줄었고(투키디데스 2.47~54; 사망자 수는 확실하지 않다) 429년 페리클레스도 죽었다. 같은 해 에페이로스의 몰로소이·카오네스 등이 아카르나니아를 치다 졌다(2.80~82). 421년 니키아스의 평화는 곧 깨졌고, 416년 아테네는 중립을 지키던 멜로스를 점령해 성인 남자를 죽이고 여자와 아이를 노예로 팔았다(5.84~116). 415~413년 아테네의 시칠리아 원정은 시라쿠사를 포위하다 스파르타 장군 길리포스가 이끈 구원군에 져 함대와 육군이 전멸하고 포로 7천이 채석장에 갇혔다(6~7권). 413년부터 스파르타는 아티카의 데켈레이아에 요새를 두었고, 페르시아(아케메네스 제국)에서는 아르타크세르크세스 1세(465~424)에 이어 다리우스 2세(423~404)가 다스렸는데 그 총독들의 자금으로 함대를 길러 405년 아이고스포타미에서 아테네 함대를 꺾었다. 404년 4월 아테네가 항복해 성벽이 헐리고 30인 참주가 세워졌다(크세노폰 『헬레니카』 2.2~3). 408년 로도스 섬의 린도스·이알리소스·카메이로스가 합쳐 로도스시를 세웠다(디오도로스 13.75). 아테네 제국의 동맹시 강압과 스파르타의 헤일로타이 지배 위에서 벌어진 전쟁이라 양쪽 모두 그리스 도시국가들을 약탈하고 포로를 학살했다."
  subjects: [greek-city-states, syracuse, rhodes, epirus, achaemenid-empire]
  links:
    - { from: greek-city-states, to: syracuse, note: "시칠리아 원정(기원전 415~413)" }
  tags: [war]
  sources: ["Thucydides(투키디데스), Historiai(『펠로폰네소스 전쟁사』) (Charles Forster Smith 영역, Loeb, 1919~1923)", "Xenophon(크세노폰), Hellenika(『헬레니카』) 1~2 (Carleton L. Brownson 영역, Loeb, 1918)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 13 (C. H. Oldfather 영역, Loeb, 1950)", "Donald Kagan, The Peloponnesian War (2003)"]
  places:
    - { name: 플라타이아, at: [23.27, 38.22], year: -430 }
