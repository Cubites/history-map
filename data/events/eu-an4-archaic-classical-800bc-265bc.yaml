- id: alexander-granicus-issus-334bc
  year: -333
  endYear: -331
  title:
    ko: "알렉산드로스의 소아시아와 시리아 정복(기원전 334~332): 그라니코스, 이소스, 티레"
  summary:
    ko: "기원전 334년 봄 알렉산드로스는 안티파트로스를 마케도니아 섭정으로 남기고 보병 3만 남짓, 기병 5천 남짓의 군대(아리아노스 1.11, 수는 사료마다 다르다)로 헬레스폰토스를 건넜다. 5월 그라니코스강에서 아나톨리아 총독들의 기병과 그리스 용병을 꺾었고, 항복하지 않은 그리스 용병 약 2천 명을 사슬로 묶어 마케도니아로 보냈다(1.13~16). 이오니아의 도시 대부분을 풀어 주고 할리카르낫소스를 포위해 얻었다. 북서쪽 비티니아는 알렉산드로스의 지배가 미치지 않아 토착 왕공이 독립을 지켰다. 333년 고르디온에서 ‘고르디온의 매듭’ 일화를 남겼고, 11월 킬리키아의 이소스에서 아케메네스 왕 다리우스 3세(재위 336~330)의 군대를 꺾었다. 다리우스는 도망치고 어머니와 아내, 딸들이 포로가 되었다(2.6~12). 다리우스 3세 앞에는 아르타크세르크세스 3세(358~338)와 아르세스(338~336)가 있었다. 알렉산드로스는 이어 페니키아로 내려가 332년 1월부터 7월까지 티레를 7개월 포위해 함락하고 약 8천 명을 죽이고 3만 명을 노예로 팔았다(2.24). 이 기간의 땅은 마케도니아 왕국 항목의 버전으로 그린다. 지도는 알렉산드로스 제국의 권역 안 땅을 기원전 334년 소아시아 서부와 흑해 남안으로, 333년 고르디온·이소스 일대로 넓히고 그만큼 아케메네스의 땅을 줄인다."
  subjects: [macedonia-kingdom, achaemenid-empire, greek-city-states, bithynia-kingdom]
  links:
    - { from: macedonia-kingdom, to: achaemenid-empire, note: "그라니코스(기원전 334)와 이소스(333)" }
  tags: [war]
  sources: ["Arrian(아리아노스), Anabasis Alexandrou(『알렉산드로스 원정기』) 1.11~2.24 (P. A. Brunt 영역, Loeb, 1976)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 17.17~46 (C. Bradford Welles 영역, Loeb, 1963)", "Pierre Briant, Alexander the Great and His Empire (Amélie Kuhrt 영역, 2010)", "A. B. Bosworth, Conquest and Empire (1988)"]
  places:
