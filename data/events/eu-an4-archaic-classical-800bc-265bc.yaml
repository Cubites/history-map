- id: diadochi-ipsus-306bc
  year: -305
  endYear: -299
  title:
    ko: "후계자 전쟁 3: 왕 칭호(기원전 306~305), 로도스 포위, 입소스 전투(기원전 301)"
  summary:
    ko: "기원전 306년 데메트리오스가 키프로스의 살라미스 앞바다에서 프톨레마이오스의 함대를 꺾자 안티고노스 1세와 데메트리오스가 왕을 칭했고, 이어 305년 무렵 프톨레마이오스·셀레우코스·리시마코스·마케도니아의 카산드로스도 차례로 왕을 칭했다(플루타르코스 『데메트리오스』 17~18). 305~304년 데메트리오스가 로도스를 1년 포위했으나 로도스가 버텼고 프톨레마이오스는 로도스인에게 ‘소테르(구원자)’라 불렸다고 전한다(디오도로스 20.81~100). 301년 프리기아의 입소스에서 셀레우코스(인도에서 얻은 코끼리 수백 마리를 이끌었다)와 리시마코스의 연합군이 안티고노스를 꺾어, 여든 살이 넘은 안티고노스가 죽었다(플루타르코스 『데메트리오스』 28~29). 아들 데메트리오스는 그리스로 도망쳤다. 승자들은 아시아를 나눠 리시마코스가 소아시아 서부를 얻었고, 셀레우코스는 시리아와 동쪽을 쥐었다. 카파도키아에서는 아리아라테스 2세가 나라를 회복했고(디오도로스 31.19.4), 파플라고니아는 토착 왕공과 미트리다테스가 나눠 쥐었다고 전한다(지도는 리시마코스의 땅으로 근사). 지도는 안티고노스 1세의 왕국을 기원전 301년 버전에 끝내고 소아시아 땅을 리시마코스 왕국·셀레우코스 제국·카파도키아 왕국으로 나눠 그린다. 이 싸움은 알렉산드로스 제국이 하나로 이어질 가능성을 끝내고 헬레니즘 왕국들이 자리 잡는 계기가 되었다."
  subjects: [antigonid-asia, lysimachus-kingdom, seleucid-empire, ptolemaic-kingdom, macedonia-kingdom, rhodes, cappadocia-kingdom, paphlagonia-kingdom]
  links:
    - { from: seleucid-empire, to: antigonid-asia, note: "입소스 전투(기원전 301)" }
  tags: [war]
  sources: ["Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『데메트리오스』 (Bernadotte Perrin 영역, Loeb, 1920)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 20.81~100, 31.19 (Russel M. Geer 외 영역, Loeb, 1954~1957)", "Waldemar Heckel, The Wars of Alexander’s Successors 323–281 BC (2008)", "Richard A. Billows, Antigonos the One-Eyed (1990)"]
  places:
