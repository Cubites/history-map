- id: herodotus-peoples-430bc
  year: -429
  endYear: -424
  title:
    ko: "헤로도토스가 적은 변경의 부족들(기원전 430 무렵): 켈트·이베리아·리구리아·트라키아·게타이·스키타이, 이탈리아 부족의 남진"
  summary:
    ko: "『역사』를 쓴 헤로도토스(기원전 484 무렵~425 무렵)는 그리스 바깥 세계를 가장 자세히 적은 첫 저자이고, 지도는 그가 부족을 적은 기원전 430년 무렵부터 유럽 안쪽을 부족 묶음으로 칠한다. 그는 이스트로스(도나우)강이 켈트(켈토이)의 땅 피레네 도시 곁에서 시작해 유럽을 가로지르고 켈트는 헤라클레스의 기둥 밖에서 퀴네시오이와 이웃한다고 적는다(2.33, 4.49). 이베리아와 리구리아(5.9, 7.165), 트라키아 부족(인도인 다음으로 큰 민족이라 한다, 5.3), 이스트로스 아래의 게타이(불멸을 믿는다고 적는다, 4.93~94; 뒤에 다키아 부족이라 불린 무리), 트란실바니아의 아가티르소이(4.104), 곡식을 가꾸는 농경 스키타이와 풍습이 다른 사우로마타이(뒤의 사르마티아·알란 부족, 4.17~21), 일리리아의 에네토이(1.196)도 서술한다. 위치와 풍습은 상인과 식민 도시에서 들은 말이어서 막연하고 맞는 것과 어긋난 것이 섞여 있다. 헤로도토스는 풍속을 견주어 적었지만 그리스어를 쓰지 않는 사람들을 ‘바르바로이’로 묶어 그리스와 갈랐고, 그 편견은 감안해 읽어야 한다. 같은 무렵 이탈리아에서는 산악의 삼니움 등 오스키계 부족이 평야의 에트루리아와 해안의 그리스 도시로 내려왔다. 리비우스(4.37, 4.44)는 삼니움인이 기원전 424년 무렵 카푸아를, 421년 무렵 쿠마이를 차지했다고 적는다. 지도는 이 변화를 기원전 424년 이탈리아 부족 묶음이 카푸아를 얻은 것으로 그린다."
  subjects: [celtic-tribes, iberian-tribes, ligurian-tribes, thracian-tribes, dacian-tribes, scythian-tribes, sarmatian-alan-tribes, illyrian-tribes, italic-tribes, etruscan-city-states]
  tags: [culture, society]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 2.33, 4.17~21, 4.49, 4.93~104, 5.3~9, 7.165 (A. D. Godley 영역, Loeb, 1920~1925)", "Livy(리비우스), Ab urbe condita(『로마사』) 4.37, 4.44 (B. O. Foster 영역, Loeb, 1919~1924)", "François Hartog, Le miroir d’Hérodote(『헤로도토스의 거울』) (1980; Janet Lloyd 영역, 1988)", "Barry Cunliffe, The Ancient Celts (1997)"]

- id: dionysius-i-syracuse-405bc
  year: -404
  endYear: -366
  title:
    ko: "디오니시오스 1세의 시라쿠사(기원전 405~367)와 카르타고의 시칠리아 전쟁"
  summary:
    ko: "기원전 409년 카르타고 장군 한니발이 셀리누스와 히메라를 함락하고, 406년 한니발이 아크라가스(로마 시대의 아그리겐툼)를 포위하다 역병으로 죽고 뒤를 이은 힘밀코가 함락했으며 405년 힘밀코가 겔라를 포위하면서 시칠리아 서부와 남부의 그리스 도시가 위기에 빠졌다(디오도로스 13). 이 위기에서 시라쿠사의 장군 디오니시오스가 기원전 405년 권력을 잡아 참주가 되었고, 같은 해 카르타고와 강화해 셀리누스·히메라·아크라가스 등을 카르타고에 내주는 대신 시라쿠사의 독립을 지켰다(13.108~114). 그는 성채(오르티기아)를 쌓고 용병을 늘려 시칠리아 동부의 도시와 시켈로이를 눌렀고, 397년 카르타고령 모티아를 함락했다. 396년 카르타고가 반격해 시라쿠사를 포위했으나 진영에 퍼진 역병으로 물러났고, 392년 조약은 시켈로이를 디오니시오스 몫으로 하고 서부를 카르타고의 영향권으로 남겼다고 전한다(14.96). 디오니시오스는 이탈리아 남부에도 손을 뻗어 389~388년 카울로니아와 히포니온, 387/386년 레기온을 쳤다(디오도로스 14.106~112. 지도는 387년 버전). 그는 비극 작가로도 이름을 얻어 367년 죽기 직전 아테네의 비극 경연에서 이겼다고 전하며, 플라톤이 시라쿠사를 방문했다. 백성을 억압한 참주라는 평도, 카르타고를 막은 지도자라는 평도 함께 전한다. 뒤를 이은 아들 디오니시오스 2세(뒤의 사건)는 정치가 흔들렸다. 지도는 시라쿠사를 기원전 405년 항목으로 따로 그리고(392년 버전에 시칠리아 동부와 남부의 겔라·카마리나·아크라가스 일대를, 387년 버전에 레기온 일대를 더하는데, 남부는 근거가 약한 근사다), 카르타고를 405~393년 남부 도시를 공납으로 거느린 것으로 그린다."
  subjects: [syracuse, carthage, greek-city-states]
  links:
