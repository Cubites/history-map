- id: xerxes-greece-480bc
  year: -479
  endYear: -477
  title:
    ko: "크세르크세스 1세의 그리스 원정(기원전 480~479): 테르모필레·살라미스·플라타이아, 델로스 동맹(기원전 478)"
  summary:
    ko: "다리우스 1세가 기원전 486년 죽자 아들 크세르크세스 1세(고대 페르시아어 크샤야르샤)가 이집트와 바빌론의 반란을 누르고 기원전 480년 그리스 원정에 나섰다. 헤로도토스는 육군이 보병 170만, 기병 8만 등 전체 528만 명이라 적지만(7.60, 7.186) 크게 부풀린 수여서 현대 학자는 대체로 10만~30만 명 안팎으로 본다. 8월 테르모필레에서 스파르타 왕 레오니다스가 이끈 그리스 연합군 약 7천 명이 길목을 지켰고(7.202), 샛길이 알려져 둘러싸이자 스파르타 시민 300명 등이 끝까지 남아 전멸했다고 전한다. 페르시아군은 아테네를 점령해 아크로폴리스를 불태웠고(480), 9월 살라미스 해협에서 테미스토클레스의 유인책에 따라 그리스 함대(헤로도토스 8.48의 378척)가 페르시아 함대를 꺾었다(8.83~96). 남은 마르도니오스는 기원전 479년 아테네를 다시 불태웠으나 플라타이아에서 스파르타의 섭정 파우사니아스가 이끈 그리스군에 져 죽었고(9.19~70), 같은 때 미칼레에서 그리스 함대가 페르시아 해군을 격파해 페르시아는 유럽과 에게해 서안에서 물러났다. 기원전 478~477년 아테네를 맹주로 한 델로스 동맹이 만들어져 동맹 도시가 배나 공납금을 내고 델로스 섬에 금고를 두었다(투키디데스 1.96). 지도는 479년 아케메네스가 유럽에서 물러나 에게해 북안 트라키아를 오드리사이 왕국과 그리스 도시국가에 넘긴 것으로, 상부 마케도니아를 마케도니아로 그린다."
  subjects: [greek-city-states, achaemenid-empire, macedonia-kingdom, odrysian-kingdom]
  links:
    - { from: achaemenid-empire, to: greek-city-states, note: "크세르크세스의 원정(기원전 480~479)" }
  tags: [war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 7.1~9.122 (A. D. Godley 영역, Loeb, 1920~1925)", "Thucydides(투키디데스), Historiai(『펠로폰네소스 전쟁사』) 1.89~96 (Charles Forster Smith 영역, Loeb, 1919~1923)", "Peter Green, The Greco-Persian Wars (1996)", "Tom Holland, Persian Fire: The First World Empire and the Battle for the West (2005)"]
