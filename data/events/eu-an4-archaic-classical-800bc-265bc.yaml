    - { name: 만티네이아, at: [22.38, 37.65], year: -361 }

- id: cyrus-anabasis-401bc
  year: -400
  endYear: -398
  title:
    ko: "소 키루스의 반란과 1만 그리스 용병의 귀환(기원전 401~399), 킬리키아 왕국의 끝"
  summary:
    ko: "아케메네스 왕 다리우스 2세가 죽자 아르타크세르크세스 2세가 왕위에 올랐고, 아우 키루스(소 키루스)는 소아시아의 총독으로서 형을 몰아내려 했다. 기원전 401년 키루스는 그리스 용병(크세노폰은 보병 약 1만 400, 경무장 2천 500이라 적는다, 1.7.10)과 현지 병력을 이끌고 사르디스에서 킬리키아를 지나 바빌로니아로 진군했다. 킬리키아의 왕 시엔네시스는 키루스에게 돈을 주었고 왕비 에피악사가 그를 대접했다고 크세노폰은 적는다(1.2.12~27). 키루스는 9월 쿠낙사에서 형과 싸우다 죽었다(1.8). 협상 중 그리스 장군들이 붙잡혀 죽자 크세노폰 등이 새 지휘관으로 뽑혔고, 군대는 적지 한가운데의 아르메니아 산지를 지나 기원전 400년 초 흑해의 트라페주스(트라브존)에 닿아 ‘바다다! 바다다!’(탈라타! 탈라타!)라고 외쳤다(4.7.24). 가는 길에 콜키스계 부족과 모시노이코이·칼리베스 같은 독립 부족과 약탈을 주고받았고 식량을 빼앗기도 했다(4~5권). 지도는 트라페주스·케라수스·코티오라 같은 해안 도시 띠만 그리스 도시국가 묶음으로 그리고 이 부족들의 내륙은 비운다. 그 뒤 오드리사이 왕국 쪽 트라키아의 세우테스 2세를 돕다 기원전 399년 소아시아의 스파르타 군에 합류했다(7권). 킬리키아에서는 이 무렵 시엔네시스 왕조가 사라지고 총독이 다스리게 된 것으로 본다. 지도는 킬리키아 왕국을 기원전 585년에 세운 항목으로 그리고 545년부터 아케메네스의 종속, 400년 버전부터는 아케메네스 땅으로 그린다. 이 원정은 아케메네스 제국 한복판을 그리스 용병이 가로질러 나올 수 있다는 사실을 보여 주어 뒤의 알렉산드로스 원정에 영향을 준 사례로 흔히 꼽힌다."
  subjects: [achaemenid-empire, cilicia-kingdom, greek-city-states, colchis, odrysian-kingdom]
  links:
    - { from: achaemenid-empire, to: cilicia-kingdom, note: "킬리키아 왕국이 총독령으로(기원전 400 무렵)" }
  tags: [war]
  sources: ["Xenophon(크세노폰), Anabasis(『아나바시스』) 1~7 (Carleton L. Brownson 영역, 개정 John Dillery, Loeb, 1998)", "Pierre Briant, From Cyrus to Alexander (Peter T. Daniels 영역, 2002)", "Robin Lane Fox 엮음, The Long March: Xenophon and the Ten Thousand (2004)"]

- id: veii-gallic-sack-396bc
  year: -395
  endYear: -385
  title:
    ko: "베이이의 함락(기원전 396)과 갈리아인의 로마 약탈(전승 기원전 390)"
  summary:
    ko: "기원전 396년 독재관 마르쿠스 푸리우스 카밀루스가 에트루리아의 도시 베이이를 함락했다(리비우스 5.19~22). 10년 포위라는 전승은 트로이 전설을 본뜬 것으로 의심받는다. 로마는 베이이의 땅을 시민에게 나눠 영토가 크게 늘었다. 같은 무렵 포강 유역에서는 켈트 부족이 에트루리아 도시를 밀어내고 있었다(앞의 사건). 리비우스는 세노네스 갈리아인이 에트루리아의 클루시움을 포위하자 로마 사절이 싸움에 가담해 전쟁이 일어났다고 적는다. 바로의 연대로 기원전 390년(폴리비오스는 387/386년으로 적는다, 1.6) 7월 18일 알리아 강변에서 갈리아군이 로마군을 크게 이기고 로마 시를 약탈했는데 카피톨리움 언덕만 버텼다(리비우스 5.37~49). 갈리아인은 금 1천 파운드를 받고 물러났고, 브렌누스가 저울에 칼을 얹으며 ‘패자에게 화 있을진저’라 했다는 일화가 전하지만 승리를 윤색한 로마 쪽 전승이 섞였다. 로마는 도시의 성벽을 다시 쌓았고 이후 갈리아인에 대한 공포가 오래 남았다. 지도는 베이이 일대를 기원전 396년 로마 공화정 땅으로, 포강 유역을 같은 해 켈트 부족의 땅으로 옮겨 그린다. 약탈로 입은 피해는 땅으로 그리지 않는다."
  subjects: [roman-republic, etruscan-city-states, celtic-tribes]
  links:
    - { from: roman-republic, to: etruscan-city-states, note: "베이이의 함락(기원전 396)" }
    - { from: celtic-tribes, to: roman-republic, note: "알리아 전투와 로마 약탈(전승 기원전 390)" }
  tags: [war]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 5.1~49 (B. O. Foster 영역, Loeb, 1924)", "Polybius(폴리비오스), Historiai(『역사』) 1.6, 2.17~18 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『카밀루스』 (Bernadotte Perrin 영역, Loeb, 1914)", "Tim Cornell, The Beginnings of Rome (1995)"]
