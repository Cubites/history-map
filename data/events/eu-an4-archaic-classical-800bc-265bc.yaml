- id: sparta-thebes-404bc
  year: -403
  endYear: -361
  title:
    ko: "스파르타의 패권과 테베: 왕의 평화(기원전 387), 레욱트라(기원전 371), 만티네이아(기원전 362)"
  summary:
    ko: "기원전 404년 승리한 스파르타는 에게해의 여러 도시에 주둔군과 10인 과두정을 세워 아테네를 대신하는 패권을 쥐었으나 오래가지 못했다. 스파르타가 소아시아의 페르시아와 싸우자(아게실라오스, 396~394) 페르시아는 아테네·테베·코린토스·아르고스를 지원해 스파르타를 견제했고(코린토스 전쟁, 395~387), 기원전 387년 스파르타 사절 안탈키다스와 아르타크세르크세스 2세(재위 404~358)가 맺은 ‘왕의 평화’로 소아시아의 그리스 도시는 페르시아 왕의 몫이 되고 다른 그리스 도시는 자치를 갖는다고 정해졌다(크세노폰 『헬레니카』 5.1.31). 지도는 이오니아·아이올리스 해안을 기원전 479년 미칼레 뒤부터 388년까지 그리스 도시국가로, 387년 평화의 해부터 아케메네스로 그린다(실제로는 412/411년 스파르타가 페르시아와 이 해안을 넘기기로 한 조약을 맺은 뒤 페르시아의 영향이 되살아났으니 지도는 근사다, 투키디데스 8.18·8.37·8.58). 스파르타는 382년 테베의 카드메이아를 기습으로 차지했으나 379년 해방되었고, 371년 레욱트라에서 에파미논다스의 테베군이 스파르타 군을 꺾어 스파르타 왕 클레옴브로토스를 포함해 시민 약 400명이 전사했다(6.4). 테베는 펠로폰네소스에 들어가 메세니아를 헤일로타이의 굴레에서 풀어 주고(370/369) 메갈로폴리스를 세웠으나, 362년 만티네이아에서 에파미논다스가 죽은 뒤 패권이 끝났다. 이 무렵 아이톨리아 부족들이 동맹으로 뭉쳐 나타난다(항목은 기원전 367년부터, 지도의 땅은 기원전 358년 버전부터라 이 사건 기간에는 지도에 땅이 없다). 이 모든 사이에 그리스 도시국가들은 서로 싸우며 힘을 잃었고, 그 틈을 북쪽의 마케도니아가 파고들었다(뒤의 사건)."
  subjects: [greek-city-states, achaemenid-empire, aetolian-league]
  links:
    - { from: achaemenid-empire, to: greek-city-states, note: "왕의 평화(기원전 387)" }
  tags: [politics, war]
  sources: ["Xenophon(크세노폰), Hellenika(『헬레니카』) 3~7 (Carleton L. Brownson 영역, Loeb, 1918~1921)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『펠로피다스』 (Bernadotte Perrin 영역, Loeb, 1917)", "Paul Cartledge, Agesilaos and the Crisis of Sparta (1987)", "P. J. Rhodes, A History of the Classical Greek World 478–323 BC (2006)"]
  places:
