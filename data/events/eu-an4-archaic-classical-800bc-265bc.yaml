  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 13.43~114, 14.41~78, 14.95~111 (C. H. Oldfather 영역, Loeb, 1950~1954)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『디온』 (Bernadotte Perrin 영역, Loeb, 1918)", "Brian Caven, Dionysius I: War-Lord of Sicily (1990)", "Dexter Hoyos, The Carthaginians (2010)"]
