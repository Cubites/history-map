  tags: [society, war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 1.163~167 (A. D. Godley 영역, Loeb, 1920~1925)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 43.3~5 (J. C. Yardley 영역, 1994)", "Barry Cunliffe, Facing the Ocean: The Atlantic and Its Peoples 8000 BC–AD 1500 (2001)", "John Boardman, The Greeks Overseas (4판, 1999)"]
