# 유럽 고대 사건 4차 묶음(마지막): 그리스 식민과 폴리스에서 피로스 전쟁과 이탈리아 통일까지 (기원전 800 ~ 기원전 265, 작업 EVA4)
# 범위: 폴리스의 성립과 호메로스·알파벳, 그리스 식민(이탈리아·시칠리아 8세기, 에게해 북쪽·흑해 7세기, 마살리아 600 무렵), 페니키아와 카르타고(814·654·알랄리아),
#   로마 건국 전승(753)과 왕정, 로마 공화정의 성립(509)과 첫 로마-카르타고 조약, 에트루리아 도시국가, 우라르투·프리기아·리디아(547), 스키타이 왕국과 아테아스(339),
#   스파르타와 아테네(솔론·페이시스트라토스·클레이스테네스), 키루스 2세와 아케메네스 제국, 다리우스 1세의 스키타이 원정(513), 이오니아 반란과 마라톤(490), 크세르크세스의 원정(테르모필레·살라미스·플라타이아)과 델로스 동맹,
#   히메라(480)와 시라쿠사(디오니시오스 1세·티몰레온·아가토클레스), 오드리사이 왕국, 페리클레스의 아테네, 보스포로스 왕국, 헤로도토스의 부족들, 펠로폰네소스 전쟁(431~404), 켈트인의 이동과 갈리아인의 로마 약탈,
#   소 키루스와 1만 용병(401), 스파르타와 테베, 마케도니아 왕국과 필리포스 2세(카이로네이아 338), 삼니움 전쟁과 라티움 전쟁, 알렉산드로스(334~323), 후계자 전쟁 네 사건(바빌론·안티고노스·입소스·코루페디온),
#   피테아스(320), 아나톨리아와 캅카스의 왕국들, 켈트인의 발칸·델포이 침입(279)과 티리스·갈라티아, 피로스 전쟁과 이탈리아 통일(272), 헬레니즘 초기 그리스(아이톨리아·아카이아 동맹).
# 깊이: 고등학교 세계사 교과서 본문 수준에, 기원전 800~265년 지도에서 생기거나 끝난 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음(docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 폴리스·호메로스 사건에서 같은 때의 주의 동천과 한반도의 철기 보급, 스키타이 사건에서 초원길과 흉노, 페리클레스 사건에서 공자·부처와 이른바 ‘축의 시대’,
#   알렉산드로스 사건에서 고조선이 왕을 칭한 일(`gojoseon-king-322`), 코루페디온 사건에서 연 진개의 침입(`jingae-281`)을 한 문장씩 견주었다. 01·02번 파일의 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 800년 = −799)로 넣고 본문에는 '기원전 800년'처럼 적었다. 전승 연대(로마 753·카르타고 814·첫 올림피아 776)는 전승임을 밝혔다.
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 며칠 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건(식민, 왕국의 흥망 등)에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 고대 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: phoenicians-carthage-814bc
  year: -813
  endYear: -533
  title:
    ko: "페니키아인과 카르타고의 서지중해: 건국 전승(기원전 814), 에부수스(기원전 654 무렵), 알랄리아 무렵까지"
  summary:
    ko: "페니키아의 도시 티루스(티레)는 기원전 9세기 이후 지중해 곳곳에 교역 거점을 세웠다. 전승(티마이오스)은 티루스의 왕녀 엘리사(디도)가 기원전 814년 북아프리카 해안에 카르타고(카르트하다슈트, ‘새 도시’)를 세웠다고 하나, 확인되는 가장 이른 고고학 층은 기원전 8세기 중엽이다. 서쪽에는 가데스(카디스), 사르데냐의 노라·타로스·술키, 시칠리아 서쪽 끝의 모티아·파노르모스, 몰타 같은 거점이 있었다. 이비사(에부수스)는 디오도로스가 카르타고 건국 160년 뒤인 기원전 654년 무렵에 세워졌다고 적는다(5.16). 카르타고는 기원전 6세기에 티루스를 대신해 서쪽 거점들의 맹주가 되어 군대를 보내 시칠리아 서부와 사르데냐를 눌렀다고 하나, 이를 전하는 유스티누스(18~19)의 서술은 간략해 원정의 연대가 분명하지 않다. 기원전 540년 무렵(지도는 535년) 알랄리아 해전에서 카르타고와 에트루리아가 포카이아 그리스인과 싸운 일(뒤의 사건)은 서지중해를 에트루리아·카르타고의 영향권과 그리스 도시국가들의 영향권 사이로 가른 사건으로 꼽힌다. 사르데냐와 시칠리아 서부에 대한 카르타고의 지배가 사료에 분명히 나타나는 것은 기원전 509년의 첫 로마-카르타고 조약(뒤의 사건)이다. 지도는 카르타고 항목을 기원전 814년(전승)에 세우되 땅은 이비사(에부수스)를 기원전 650년 버전에 그린 것이 처음이고, 사르데냐·시칠리아 서부·몰타는 기원전 509년 버전에 그린다. 북아프리카 본토는 권역 밖이라 그리지 않는다."
  subjects: [carthage, greek-city-states, etruscan-city-states]
  links:
    - { from: carthage, to: etruscan-city-states, note: "서지중해의 동맹과 알랄리아(기원전 540 무렵)" }
  tags: [politics, economy]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 5.16, 5.35 (C. H. Oldfather 영역, Loeb, 1933~1967)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 18~19 (J. C. Yardley 영역, 1994)", "Herodotus(헤로도토스), Historiai(『역사』) 1.166 (A. D. Godley 영역, Loeb, 1920~1925)", "Dexter Hoyos, The Carthaginians (2010)", "Maria Eugenia Aubet, The Phoenicians and the West (2판, 2001)"]

- id: polis-olympia-homer-800bc
  year: -799
  endYear: -699
  title:
    ko: "폴리스의 성립과 첫 올림피아 제전(전승 기원전 776), 호메로스와 그리스 알파벳(기원전 8세기)"
  summary:
    ko: "기원전 8세기 그리스에서는 마을들이 한 도시로 모이는 일(시노이키스모스)이 이어지며 폴리스가 자리 잡았다. 폴리스는 신전과 광장(아고라)을 갖추고 시민이 직접 모여 일을 정하는 작은 공동체였고, 중장보병(호플리테스)이 시민군을 이루었다. 모겐스 한센은 고전기까지 지중해와 흑해에 폴리스가 1,000곳 남짓 있었다고 센다. 폴리스끼리 자주 싸웠지만 같은 말과 신을 나누었고 올림피아의 제우스 제전이 그 구심이었다. 전승은 첫 제전을 기원전 776년으로 잡는데, 5세기 엘리스의 히피아스가 만든 우승자 명부에서 거슬러 센 연대여서 믿을 만한 정도에 한계가 있다. 호메로스의 『일리아스』와 『오디세이아』는 기원전 8세기 후반~7세기 초에 지금 모습으로 굳은 것으로 보며, 시인이 한 사람이었는지는 논쟁이다. 이 무렵 그리스인은 페니키아 문자를 받아 모음 글자를 더한 알파벳을 만들었다. 가장 이른 글은 기원전 8세기 중엽 아테네의 디필론 항아리와 이스키아(피테쿠사이)에서 나온 ‘네스토르의 잔’ 명문이고, 이 글자가 에트루리아를 거쳐 로마의 라틴 문자가 되었다. 중국에서는 기원전 770년 주가 동쪽으로 도읍을 옮기며 춘추 시대가 열렸고, 고조선이 자리한 한반도와 만주에서는 철기가 기원전 5세기 무렵부터 퍼졌다(`iron-age`). 지도는 기원전 800년의 그리스 본토·섬·이오니아를 그리스 도시국가 묶음으로, 중부 이탈리아의 에트루리아를 에트루리아 도시국가 묶음으로 처음부터 그린다."
  subjects: [greek-city-states, etruscan-city-states, gojoseon]
  tags: [culture, politics]
  sources: ["Homer(호메로스), Ilias(『일리아스』) (A. T. Murray 영역, William F. Wyatt 개정, Loeb, 1999), Odysseia(『오디세이아』) (A. T. Murray 영역, George E. Dimock 개정, Loeb, 1995)", "Pausanias(파우사니아스), Hellados Periegesis(『그리스 안내기』) 5.7~9 (W. H. S. Jones 영역, Loeb, 1918~1935)", "Oswyn Murray, Early Greece (2판, 1993)", "Mogens Herman Hansen·Thomas Heine Nielsen 엮음, An Inventory of Archaic and Classical Poleis (2004)", "Barry B. Powell, Homer and the Origin of the Greek Alphabet (1991)"]

- id: urartu-phrygia-800bc
  year: -799
  endYear: -589
  title:
    ko: "아시리아 곁의 두 왕국: 우라르투(기원전 9세기~590 무렵)와 프리기아의 미다스(기원전 8세기~695 무렵)"
  summary:
    ko: "반호 둘레의 우라르투는 기원전 9세기 중엽 아시리아 비문에 ‘우루아트리’로 나타난다. 메누아(재위 810 무렵~785)와 아르기슈티 1세(785~763)가 에레부니(예레반, 기원전 782)를 세우고 아라라트 평야를 얻었고, 사르두리 2세(763~735) 때 가장 강했다. 그러나 기원전 743년 티글랏빌레세르 3세에게 지고, 루사 1세는 기원전 714년 사르곤 2세가 무사시르를 약탈한 원정에서 무너졌다고 아시리아 기록은 적는다. 우라르투는 아르기슈티 2세, 루사 2세와 3세를 거치며 킴메르인·스키타이와 아시리아·메디아의 압박 속에 약해져 기원전 590년 무렵 반 일대를 메디아에게 잃고 끝난다고 본다(키루스가 547년 끝냈다는 설도 있다). 서쪽의 프리기아는 고르디온을 도읍으로 했고, 아시리아 기록의 ‘무쉬키의 왕 미타’를 미다스로 보며 기원전 709년 무렵 사르곤 2세와 화해했다. 만지는 것이 금이 되는 이야기는 그리스 쪽 전설이다. 에우세비오스의 연대로는 킴메르인이 기원전 695년 무렵 프리기아를 무너뜨리고 미다스가 죽었으나, 고르디온의 큰 불탄 층은 예전에는 킴메르인의 약탈로 보았으나 방사성탄소 측정으로 기원전 800년 무렵까지 올라가 킴메르인과 잇기 어렵다는 견해가 퍼졌고, 미다스의 죽음도 고대 연대가 695년 무렵(에우세비오스)과 676년 무렵(아프리카누스)으로 갈리며, 프리기아 문화는 그 뒤에도 이어졌다. 지도는 프리기아를 기원전 695년에, 우라르투를 기원전 590년에 끝낸다."
  subjects: [urartu, phrygia]
  tags: [politics, war]
  sources: ["Paul Zimansky, Ecology and Empire: The Structure of the Urartian State (1985)", "Mirjo Salvini, Geschichte und Kultur der Urartäer (1995)", "Herodotus(헤로도토스), Historiai(『역사』) 1.14, 8.138 (A. D. Godley 영역, Loeb, 1920~1925)", "Strabo(스트라본), Geographica(『지리지』) 1.3.21 (H. L. Jones 영역, Loeb, 1917~1932)", "John Boardman 외 엮음, The Cambridge Ancient History III, Part 2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, 1991)"]

- id: etruscan-cities-800bc
  year: -799
  endYear: -473
  title:
    ko: "에트루리아 도시국가(기원전 8~5세기 초): 카이레·타르퀴니아·베이이, 포강 유역과 코르시카, 쿠마이 해전(474)"
  summary:
    ko: "에트루리아(라틴어 에트루스키, 그리스인은 티르세노이)의 도시들은 아르노강과 테베레강 사이 토스카나와 라치오 북부에서 기원전 9~8세기의 빌라노바 문화로부터 자랐다. 엘바섬과 토스카나의 금속, 그리스·페니키아와의 교역으로 기원전 7세기부터 카이레(체르베테리)·타르퀴니아·베이이·불치·볼시니 같은 도시가 부유해졌고, 그리스 알파벳을 바꾼 문자를 쓰며 화려한 무덤을 남겼다. 도시들은 하나의 나라가 아니라 12개 도시의 느슨한 모임이었다고 리비우스는 적는다(4.23, 5.1). 기원전 600년 무렵 남쪽 캄파니아의 카푸아를, 기원전 6세기 후반에는 아펜니노 북쪽 포강 유역의 펠시나(볼로냐)·스피나·만투아를 얻었고, 알랄리아 해전(기원전 540 무렵, 카르타고와 함께 포카이아 그리스인을 상대했다) 뒤 코르시카에서 공물을 받았다(디오도로스 5.13; 지도는 기원전 535년). 로마의 두 타르퀴니우스 왕도 에트루리아와 이어진 집안이었다고 한다(뒤의 사건). 기원전 5세기 초 그리스 쪽이 반격해 기원전 474년 시라쿠사의 히에론 1세가 쿠마이 앞바다에서 에트루리아 함대를 꺾었다(핀다로스 『퓌티아 송가』 1.71~75, 디오도로스 11.51). 에트루리아가 한꺼번에 무너진 것은 아니고, 삼니움·켈트·로마가 5세기 말~3세기에 차례로 잠식했다(뒤의 사건). 지도는 에트루리아 도시국가 묶음을 기원전 800년부터 토스카나와 라치오 북부로 그리고, 기원전 600년에 카푸아, 기원전 535년에 포강 유역과 코르시카를 더한다."
  subjects: [etruscan-city-states, greek-city-states, roman-kingdom, carthage]
  links:
    - { from: greek-city-states, to: etruscan-city-states, note: "쿠마이 해전(기원전 474)" }
  tags: [society, culture]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 1.34~35, 4.23, 5.1 (B. O. Foster 영역, Loeb, 1919~1924)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 5.13, 11.51 (C. H. Oldfather 영역, Loeb, 1933~1967)", "Pindar(핀다로스), Pythia(『퓌티아 송가』) 1 (William H. Race 영역, Loeb, 1997)", "Sybille Haynes, Etruscan Civilization: A Cultural History (2000)", "Tim Cornell, The Beginnings of Rome (1995)"]

- id: rome-kings-753bc
  year: -752
  endYear: -508
  title:
    ko: "로마 건국 전승(기원전 753)과 일곱 왕, 왕정의 끝(기원전 509)"
  summary:
    ko: "로마의 건국 전승은 기원전 753년 4월 21일 로물루스가 팔라티노 언덕에 도시를 세웠다고 한다(바로의 계산 연대). 실제로는 테베레강 둘레의 언덕 마을들이 기원전 8세기 안팎에 하나로 합쳐졌다고 보며, 일곱 왕의 이야기는 로마가 훨씬 뒤에 쓴 전승이라 신화가 섞여 있다. 전승의 왕은 로물루스(재위 753~716), 누마 폼필리우스(715~673), 툴루스 호스틸리우스(673~642), 안쿠스 마르키우스(642~617), 타르퀴니우스 프리스쿠스(616~579), 세르비우스 툴리우스(578~535), 타르퀴니우스 수페르부스(535~509)이다(재위는 바로의 연대). 프리스쿠스와 수페르부스는 에트루리아와 이어진 집안이라 전하며, 이 시기 로마는 포룸 정비, 카피톨리움의 유피테르 신전, 큰 하수도(클로아카 막시마), 시민을 재산에 따라 나눈 세르비우스의 개혁 같은 도시의 틀을 갖췄다고 한다. 기원전 509년 수페르부스가 쫓겨나 왕정이 끝났다고 전한다(리비우스 1.59~60, 뒤의 사건). 지도는 로마 왕국을 로마 시 둘레 라티움의 테베레강 동쪽·남쪽 땅으로 기원전 616년(타르퀴니우스 프리스쿠스의 해)부터 그리고, 기원전 509년에 로마 공화정이 이어받는다."
  subjects: [roman-kingdom, etruscan-city-states]
  tags: [politics]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 1~2 (B. O. Foster 영역, Loeb, 1919)", "Dionysius of Halicarnassus(할리카르낫소스의 디오니시오스), Romaike archaiologia(『로마 고대사』) 1~4 (Earnest Cary 영역, Loeb, 1937~1950)", "Tim Cornell, The Beginnings of Rome: Italy and Rome from the Bronze Age to the Punic Wars (c. 1000–264 BC) (1995)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII, Part 2: The Rise of Rome to 220 B.C. (2판, 1989)"]

- id: greek-colonization-west-750bc
  year: -749
  endYear: -699
  title:
    ko: "그리스 식민 1: 이탈리아와 시칠리아(기원전 8세기 중엽~700), 시라쿠사(전승 733)"
  summary:
    ko: "기원전 8세기 중엽부터 그리스 도시들은 땅 부족과 정치 다툼을 피해 이탈리아와 시칠리아로 사람을 보냈다. 가장 이른 거점은 에우보이아의 칼키스·에레트리아 사람들이 나폴리만의 섬 이스키아(피테쿠사이)에 세운 교역 기지이고 본토의 쿠마이(키메)가 이어 세워졌다(전승 연대는 기원전 750년대~740년대). 쿠마이는 에트루리아 도시국가들과 이웃해 그리스 문자가 에트루리아로 전해지는 통로가 되었다. 시칠리아에서는 투키디데스가 적은 순서(6.3~5)대로 낙소스가 기원전 734년, 코린토스인 아르키아스가 시라쿠사를 733년, 칼키스인이 카타네(카타니아)를 729년 무렵 세웠다. 남이탈리아에서는 아카이아인이 시바리스(720 무렵)와 크로톤(710 무렵)을, 스파르타의 파르테니아이가 타라스(706 무렵, 타렌툼)를 세웠다고 전한다(연대는 모두 후대 전승). 에게해 북쪽의 칼키디케에도 같은 무렵 칼키스인의 식민 도시가 생겼다. 식민은 모도시의 허락과 지도자(오이키스테스)를 받는 일이었지만 땅은 원주민의 것이어서, 시라쿠사는 시켈로이를 내륙으로 몰아냈다고 투키디데스는 적는다. 원주민이 노동력으로 묶인 곳도 있었다. 지도는 이 변화를 기원전 729년 버전(시칠리아 동부·쿠마이·칼키디케)과 기원전 706년 버전(시바리스·레기온·크로톤·타라스)으로 그리스 도시국가 묶음에 더하고, 시라쿠사는 전승 연대인 기원전 733년에 성립한 항목으로 둔다."
  subjects: [greek-city-states, syracuse, etruscan-city-states]
  tags: [society, economy]
  sources: ["Thucydides(투키디데스), Historiai(『펠로폰네소스 전쟁사』) 6.2~5 (Charles Forster Smith 영역, Loeb, 1919~1923)", "Strabo(스트라본), Geographica(『지리지』) 6.1~2 (H. L. Jones 영역, Loeb, 1917~1932)", "John Boardman, The Greeks Overseas (4판, 1999)", "Gocha R. Tsetskhladze 엮음, Greek Colonisation: An Account of Greek Colonies and Other Settlements Overseas (2권, 2006·2008)"]

- id: sparta-archaic-740bc
  year: -739
  endYear: -545
  title:
    ko: "스파르타: 두 왕과 헤일로타이, 메세니아 정복(기원전 8~7세기)과 펠로폰네소스 동맹(기원전 6세기 중엽)"
  summary:
    ko: "라코니아의 스파르타는 에우로타스 계곡의 마을들이 모여 이룬 폴리스로, 아기아다이와 에우리폰티다이 두 왕가에서 한 사람씩, 두 왕이 함께 다스렸다. 전승의 첫 메세니아 전쟁(기원전 8세기 후반)과 둘째 전쟁(7세기 중엽)으로 이웃 메세니아를 차지하고 주민을 헤일로타이(국가에 딸린 농노)로 삼았는데, 헤일로타이는 스파르타 시민보다 훨씬 많았다. 스파르타 시민(스파르티아타이)은 농사를 이들에게 맡기고 군사 훈련에 전념했고, 해마다 감독관(에포로이)이 헤일로타이에게 전쟁을 선포하는 형식을 취했다고 플루타르코스는 전한다(『리쿠르고스』 28). 전승은 입법자 리쿠르고스가 두 왕·원로원(게루시아)·민회·에포로이와 공동 식사 제도를 만들었다고 하나 실존과 연대는 분명하지 않다. 기원전 6세기 중엽 스파르타는 펠로폰네소스의 도시들과 개별 동맹을 맺어 펠로폰네소스 동맹의 틀을 만들었고, 기원전 546년 무렵 티레아 평원에서 아르고스와 ‘삼백 명의 대결’ 끝에 이겼다고 한다(헤로도토스 1.82). 이 시기 스파르타의 전쟁과 제도는 거의 후대 전승이라 한두 세대 어긋날 수 있다. 지도는 스파르타를 따로 칠하지 않고 그리스 도시국가 묶음에 둔다."
  subjects: [greek-city-states]
  tags: [politics, society]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 1.65~68, 1.82 (A. D. Godley 영역, Loeb, 1920~1925)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『리쿠르고스』 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Paul Cartledge, Sparta and Lakonia: A Regional History 1300–362 BC (2판, 2002)", "Oswyn Murray, Early Greece (2판, 1993)"]

- id: greek-colonization-black-sea-700bc
  year: -699
  endYear: -599
  title:
    ko: "그리스 식민 2: 에게해 북쪽과 흑해(기원전 7세기), 비잔티온·시노페·올비아와 콜키스(기원전 600 무렵)"
  summary:
    ko: "기원전 7세기에 식민은 에게해 북쪽과 흑해로 번졌다. 전승은 파로스 사람들이 타소스(680 무렵)를, 메가라인이 칼케돈(685 무렵)과 비잔티온(667 무렵)을 세웠다고 하고, 밀레투스는 이스트로스(657 무렵)·올비아(647 무렵)·시노페(631 무렵)를, 시노페는 흑해 남안의 트라페주스를 세웠다고 전한다(크세노폰 『아나바시스』 4.8.22). 연대는 에우세비오스·헤로도토스·스트라본이 전한 것이라 한두 세대 어긋날 수 있다. 식민 도시는 곡식·생선·금속·노예를 구했고 특히 흑해 북안 초원의 곡물이 중요했다. 올비아의 그리스인은 스키타이와 교역하며 그 풍습을 받아들여, 헤로도토스는 이들을 ‘그리스계 스키타이(칼리피다이)’라 부른다(4.17). 원주민과의 관계는 교역에서 땅의 점유, 노예 노동까지 갈렸다. 기원전 600년 무렵 흑해 동쪽 끝 파시스강 어귀의 콜키스에도 밀레투스인의 거점이 생겼다. 지도는 이 변화를 기원전 680년(타소스·칼케돈), 650년(비잔티온), 631년(시노페와 흑해 남안의 해안 도시 띠. 폰토스 산맥의 내륙 부족 땅은 비움), 616년(에피담노스·암브라키아), 600년 버전에 그리스 도시국가 묶음으로 더하고, 콜키스는 기원전 600년에 성립한 항목으로 따로 그린다."
  subjects: [greek-city-states, colchis, scythian-kingdom]
  tags: [society, economy]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 4.17~18, 4.144 (A. D. Godley 영역, Loeb, 1920~1925)", "Strabo(스트라본), Geographica(『지리지』) 7.3~6, 12.3 (H. L. Jones 영역, Loeb, 1917~1932)", "Gocha R. Tsetskhladze 엮음, Greek Colonisation: An Account of Greek Colonies and Other Settlements Overseas (2권, 2006·2008)", "John Boardman, The Greeks Overseas (4판, 1999)"]

- id: argead-macedonia-700bc
  year: -699
  endYear: -398
  title:
    ko: "마케도니아 왕국의 성립(기원전 700 무렵)과 아르게아다이 왕조: 알렉산드로스 1세에서 아르켈라오스까지"
  summary:
    ko: "마케도니아는 테르마이코스만 안쪽 에마티아 평야에서 일어난 왕국이다. 헤로도토스는 아르고스에서 온 테메노스의 후손 세 형제 가운데 막내 페르디카스가 왕조(아르게아다이)를 열었다고 전한다(8.137~139). 지도는 마케도니아를 기원전 700년 무렵부터 에마티아·피에리아 일대에 그리고, 투키디데스(2.99)가 ‘종속 동맹’이라 부른 상부 마케도니아를 기원전 479년부터 더한다. 기원전 6세기 말 아민타스 1세는 페르시아(아케메네스 제국)에 ‘흙과 물’을 바쳐 종속 왕국이 되었다(뒤의 사건). 아들 알렉산드로스 1세(재위 498 무렵~454, ‘필헬렌’)는 페르시아군이 그리스를 칠 때 페르시아 편에 서면서 플라타이아 전투 전날 아테네에 마르도니오스의 계획을 알렸다고 전한다(헤로도토스 9.44~45). 페르시아가 물러난 뒤 투키디데스(2.99)는 그가 에게해 쪽으로 땅을 넓혔다고 적는다. 페르디카스 2세(454~413)는 아테네와 스파르타 사이를 오가며 펠로폰네소스 전쟁을 넘겼고, 아르켈라오스(413~399)는 길을 닦고 요새를 쌓았고(투키디데스 2.100) 수도를 아이가이에서 펠라로 옮기고 에우리피데스를 초대했다고 전한다. 399년 아르켈라오스가 죽은 뒤 오레스테스·아에로포스 2세·파우사니아스·아민타스 2세 같은 왕들이 몇 해씩 이어졌고 아민타스 3세(393~369)가 안정을 되찾았다(디오도로스 14.37, 14.84; 연대는 한두 해 어긋난다). 필리포스 2세의 마케도니아는 뒤의 사건이다."
  subjects: [macedonia-kingdom, achaemenid-empire, greek-city-states]
  links:
