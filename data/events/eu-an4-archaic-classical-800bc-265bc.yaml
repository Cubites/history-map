- id: sicily-himera-480bc
  year: -479
  endYear: -473
  title:
    ko: "시칠리아의 그리스인과 카르타고: 겔론과 히메라 전투(기원전 480), 쿠마이 해전(기원전 474)"
  summary:
    ko: "시칠리아의 그리스 도시들은 서쪽 끝의 모티아·파노르모스 같은 페니키아 도시를 낀 카르타고와 마주하고 있었다. 기원전 485년 겔라의 참주 겔론이 시라쿠사를 차지하고 시칠리아 동부의 도시들을 합쳐 강대국을 이루었다. 헤로도토스는 히메라에서 쫓겨난 참주 테릴로스의 청으로 카르타고의 하밀카르가 쳐들어왔다고 적고(7.165), 시칠리아 사람들이 이 싸움을 살라미스와 같은 날이라 말한다고 전한다(7.166). 카르타고가 페르시아와 짜고 쳐들어왔다는 이야기는 디오도로스(11.1)가 전하는 에포로스 계통의 전승이라 현대 학자는 대체로 믿지 않는다. 디오도로스는 기원전 480년 하밀카르가 히메라를 포위하자 겔론이 아크라가스의 테론과 함께 구원해 크게 이기고 하밀카르는 죽었다고 한다(11.20~24, 카르타고군 30만이라는 수는 과장). 카르타고는 배상금을 물었고 409년 셀리누스를 칠 때까지 70년 가까이 시칠리아의 그리스 도시를 직접 치지 않았다. 겔론의 아우 히에론 1세는 기원전 474년 쿠마이 앞바다에서 에트루리아 함대를 꺾었다(핀다로스 『퓌티아 송가』 1.71~75). 시라쿠사의 참주는 겔론(485~478), 히에론 1세(478~466), 트라시불로스(466~465)로 이어졌고 그 뒤 시라쿠사는 민주정이 되었다. 시라쿠사의 땅은 디오니시오스 1세가 오르는 기원전 405년(뒤의 사건)까지는 지도에서 그리스 도시국가 묶음에 속한다."
  subjects: [syracuse, carthage, greek-city-states, etruscan-city-states]
  links:
    - { from: greek-city-states, to: carthage, note: "히메라 전투(기원전 480)" }
  tags: [war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 7.165~167 (A. D. Godley 영역, Loeb, 1920~1925)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 11.20~26, 11.51 (C. H. Oldfather 영역, Loeb, 1933~1967)", "Pindar(핀다로스), Pythia(『퓌티아 송가』) 1 (William H. Race 영역, Loeb, 1997)", "Dexter Hoyos, The Carthaginians (2010)"]
  places:
