- id: darius-scythia-thrace-513bc
  year: -512
  endYear: -511
  title:
    ko: "다리우스 1세의 스키타이 원정(기원전 513 무렵)과 트라키아·마케도니아의 종속"
  summary:
    ko: "다리우스 1세는 기원전 513년 무렵 유럽으로 건너가 스키타이를 쳤다(헤로도토스 4.83~144). 사모스 출신 건축가 만드로클레스가 보스포로스에 배다리를 놓았고, 군대는 트라키아를 지나 이스트로스(도나우)강을 이오니아 그리스인이 지키는 배다리로 건넜다. 스키타이는 정면 싸움을 피해 우물을 메우고 초지를 태우며 안쪽으로 물러나는 전술로 페르시아군을 지치게 했고, 헤로도토스는 다리우스가 아무것도 얻지 못하고 돌아왔다고 적는다(원정의 규모와 성과는 논쟁이 있다). 그러나 다리우스는 장군 메가바조스를 남겨 에게해 북쪽 바닷가의 트라키아(페린토스 등)와 파이오니아 일부를 차지하게 했고(5.1~16), 마케도니아의 아민타스 1세가 ‘흙과 물’을 바쳐 마케도니아는 약 512~479년 아케메네스의 종속 왕국이 되었다(5.17~21). 지도는 에게해 북안 트라키아를 기원전 513년 버전에 아케메네스의 땅으로, 마케도니아를 종속 관계(513~480년 버전)로 그린다. 스키타이 원정 자체는 결말이 되돌려진 원정이라 땅으로 그리지 않는다. 이렇게 에게해 북쪽에 놓인 페르시아의 발판은 뒤의 이오니아 반란과 그리스 원정으로 이어진다."
  subjects: [achaemenid-empire, scythian-kingdom, macedonia-kingdom, greek-city-states]
  links:
