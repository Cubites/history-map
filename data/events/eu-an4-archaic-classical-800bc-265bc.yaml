- id: scythian-kingdom-650bc
  year: -649
  endYear: -279
  title:
    ko: "스키타이 왕국(왕족 스키타이)의 흥망(기원전 650 무렵~280 무렵), 동물 양식과 초원길, 아테아스(기원전 339)"
  summary:
    ko: "스키타이는 흑해 북쪽 초원의 이란계 유목민이다. 헤로도토스는 그 가운데 ‘왕족 스키타이’가 가장 용맹하고 수가 많아 다른 스키타이를 자기 노예처럼 여겼다고 적는다(4.20). 그는 스키타이가 킴메르인을 쫓아 서아시아로 들어와 28년 동안 메디아를 지배했다고 전하며(1.103~106) 아시리아 기록에도 7세기에 ‘이슈쿠자’가 나온다. 지도는 스키타이 왕국을 기원전 650년 무렵부터 드니스테르강~돈강 초원과 크림에 그린다(켈레르메스·멜구노프 쿠르간 같은 7세기 고고학에 맞춘 근사). 왕이 죽으면 말과 측근을 함께 묻은 큰 쿠르간을 쌓았고, 짐승 모양의 금 장식(동물 양식)이 투바의 아르잔 쿠르간 같은 동쪽 초원까지 비슷하게 나타나 유라시아 초원을 따라 문화가 이어졌음을 보여 준다. 『사기』 「흉노열전」은 전국 시대에 진·조·연이 북쪽 변경에서 흉노와 맞닿았다고 적고, 지도는 흉노를 기원전 318년부터 그린다. 기원전 350년 무렵 아테아스 왕은 도나우강 하구의 도브루자(그전에는 게타이, 곧 다키아 부족 묶음의 땅)까지 차지했고, 마케도니아의 필리포스 2세와 다투다 기원전 339년 싸움에서 죽었는데(유스티누스 9.2; 뒤의 사건), 나이가 아흔 살 안팎이었다는 것은 루키아노스의 이름으로 전하는 『장수자들』 10에 나온다. 기원전 4세기 말~3세기 초 스키타이 왕국은 돈강 동쪽에서 밀려든 사르마티아 계통 유목민에게 초원을 내주며 무너졌고(뒤의 사건), 지도는 기원전 280년 무렵 이를 끝내고 그 땅을 스키타이 부족 묶음과 사르마티아·알란 부족 묶음으로 넘긴다."
  subjects: [scythian-kingdom, scythian-tribes, sarmatian-alan-tribes, dacian-tribes, xiongnu, macedonia-kingdom]
  links:
    - { from: macedonia-kingdom, to: scythian-kingdom, note: "아테아스와 필리포스 2세(기원전 339)" }
  tags: [society, culture]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 1.103~106, 4.1~144 (A. D. Godley 영역, Loeb, 1920~1925)", "Pseudo-Lucian(위(僞)루키아노스), Makrobioi(『장수자들』) 10 (Loeb 루키아노스 전집)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 9.2 (J. C. Yardley 영역, 1994)", "Renate Rolle, The World of the Scythians (1989)", "Sima Qian(사마천), Shiji(『사기』) 110 「흉노열전」 (Burton Watson 번역, Records of the Grand Historian: Han Dynasty II, 개정판 1993)"]

- id: massalia-alalia-600bc
  year: -599
  endYear: -533
  title:
    ko: "마살리아의 건설(기원전 600 무렵)과 포카이아인의 서지중해, 알랄리아 해전(기원전 540 무렵)"
  summary:
    ko: "소아시아 이오니아의 도시 포카이아 사람들이 기원전 600년 무렵 지금의 마르세유 자리에 마살리아(마실리아)를 세웠다고 전한다. 유스티누스(43.3)는 포카이아의 프로티스가 리구리아계 세고브리게스 부족 왕의 딸 기프티스와 혼인해 땅을 얻었다고 적는다. 마살리아는 론강 어귀와 지중해 연안에 엠포리온(에스파냐, 6세기 초) 같은 거점을 두고 켈트·리구리아 부족과 포도주와 도기를 교역하며 자랐고, 6세기 말의 빅스 같은 켈트 지도자의 무덤에 그리스 청동 그릇이 묻혔다. 기원전 546년 무렵 페르시아가 이오니아를 정복하자 포카이아 사람 상당수가 서쪽으로 떠나 565년 무렵 세워 둔 코르시카 동안의 알랄리아로 옮겼다. 이들의 해적질에 맞서 에트루리아(카이레)와 카르타고가 각 60척, 모두 120척으로 맞섰고, 포카이아의 60척은 40척을 잃고 나머지 20척도 쓰지 못하게 되는 ‘카드메이아식 승리’를 거두었으나 알랄리아를 버리고 남이탈리아의 엘레아(벨리아)로 옮겼다(헤로도토스 1.163~167). 연대는 기원전 540년 무렵이고 지도는 535년에 맞춘다. 이 무렵 서지중해는 에트루리아·카르타고와 그리스 도시국가 사이로 나뉘었다. 지도는 마살리아와 이탈리아 서안·남프랑스의 포카이아계 도시를 기원전 600년 버전에 그리스 도시국가 묶음으로 더하고, 코르시카를 알랄리아 해전 뒤인 기원전 535년부터 에트루리아로 그린다."
  subjects: [greek-city-states, etruscan-city-states, carthage]
  links:
