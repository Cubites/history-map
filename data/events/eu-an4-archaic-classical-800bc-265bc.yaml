- id: lydia-croesus-680bc
  year: -679
  endYear: -546
  title:
    ko: "리디아: 기게스에서 크로이소스까지(기원전 680 무렵~547), 최초의 동전과 사르디스의 함락"
  summary:
    ko: "리디아는 사르디스를 도읍으로 한 서아나톨리아 왕국이다. 헤로도토스는 기게스가 왕위를 얻어 메름나다이 왕조를 열었다고 적는다(1.8~14). 이 왕조의 왕은 기게스, 아르디스, 사디아테스, 알리아테스, 크로이소스 다섯이며 연대는 문헌마다 몇 해 다르다(기게스는 기원전 7세기 전반, 크로이소스는 기원전 560 무렵~547). 기게스는 킴메르인과 싸우다 죽었고 알리아테스는 킴메르인을 몰아내고 이오니아 도시들을 압박했다. 기원전 585년 5월 28일 일식 중에 메디아와 싸우던 리디아가 강화했으며 킬리키아의 시엔네시스와 바빌론의 왕이 중재했고 할리스강이 경계가 되었다(헤로도토스 1.74). 지도는 이 해에 리디아가 프리기아의 땅을 얻은 것으로 그리고, 킬리키아 왕국을 기원전 585년에 세운 항목으로 둔다. 크로이소스는 이오니아·카리아·비티니아를 복속시켜 그리스 도시에 공물을 받되 자치는 두었다. 리디아는 호박금(일렉트론) 동전을 처음 찍은 나라로 알려졌고(연대는 기원전 7세기 말~6세기 초로 논쟁), 크로이소스가 금화와 은화를 따로 만들었다고 한다. 크로이소스는 델포이에서 ‘큰 나라를 멸하리라’는 신탁을 듣고 페르시아(아케메네스 제국)의 키루스와 싸웠으나 졌고, 기원전 547년(546년이라는 설도) 사르디스가 함락되어 리디아가 끝났다(1.46~91, 뒤의 사건)."
