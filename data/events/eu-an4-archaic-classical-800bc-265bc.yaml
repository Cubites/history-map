- id: philip-ii-rise-359bc
  year: -358
  endYear: -347
  title:
    ko: "필리포스 2세의 즉위와 마케도니아의 성장(기원전 359~348): 바르딜리스, 암피폴리스, 신성 전쟁, 올린토스"
  summary:
    ko: "아민타스 3세 뒤 아들 알렉산드로스 2세, 프톨레마이오스 알로로스를 거쳐 왕이 된 페르디카스 3세는 기원전 359년 일리리아의 바르딜리스와 싸우다 병사 4천 명과 함께 전사했다(디오도로스 16.2). 어린 아들 아민타스 4세 대신 아우 필리포스가 왕위에 올랐다. 필리포스 2세는 일리리아·파이오니아·트라키아의 위협을 뇌물과 외교로 달래고, 기원전 358년 바르딜리스를 꺾어 오리드호 일대까지 땅을 넓히고 파이오니아를 복속시켰다(16.4). 그는 긴 창(사리사)으로 무장한 보병 밀집대를 새로 조련했다고 한다. 357년 암피폴리스, 356년 포티다이아와 광산 도시 크레니데스(필립피)를 얻어 금광에서 해마다 약 1천 탈란톤을 거뒀다(16.8). 그리스 도시국가들이 델포이 신전의 재물을 쓴 포키스를 벌하려 벌인 신성 전쟁(제3차, 356~346)에 개입해 기원전 352년 크로커스 평원에서 포키스군을 꺾고 테살리아를 얻었으나 테르모필레는 아테네가 막았다. 아테네에서는 데모스테네스가 필리포스를 경계하라고 연설했다(필리피카, 351 이후). 기원전 348년 필리포스는 칼키디케 동맹의 중심 올린토스를 함락해 파괴하고 주민을 노예로 팔았다(16.53). 지도는 상부 마케도니아를 이미 기원전 479년 버전부터 마케도니아 땅으로 그려 두었고(근사), 기원전 358년 버전에서 파이오니아(북마케도니아 일대)를 마케도니아의 종속 왕국으로, 다사레티스(알바니아 남동부)를 마케도니아 땅으로 더하며, 암피폴리스·크레니데스를 기원전 350년 버전에, 올린토스를 기원전 348년 버전에 마케도니아 땅으로 더해 그린다."
  subjects: [macedonia-kingdom, paeonia-kingdom, illyrian-tribes, thracian-tribes, greek-city-states]
  links:
