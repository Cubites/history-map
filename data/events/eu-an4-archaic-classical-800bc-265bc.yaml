- id: samnite-latin-wars-343bc
  year: -342
  endYear: -289
  title:
    ko: "삼니움 전쟁(기원전 343~290)과 라티움 전쟁(기원전 340~338): 라틴 동맹의 해체와 이탈리아 중부의 정복"
  summary:
    ko: "기원전 343년 캄파니아의 카푸아가 삼니움인에게 눌려 로마에 도움을 청하며 제1차 삼니움 전쟁(343~341)이 시작되었다(리비우스 7.29~). 이어 라틴 도시들이 로마에 맞서 일으킨 라티움 전쟁(340~338)에서 로마는 베세리스와 트리파눔에서 이기고 라틴 동맹을 해체해 도시마다 따로 조약을 맺었다(8.1~14). 로마는 어떤 도시에는 시민권을, 어떤 도시에는 동맹시의 지위를 주어 이탈리아의 맹주가 되어 갔다. 제2차 삼니움 전쟁(326~304)에서 기원전 321년 카우디움의 협곡에서 로마군이 포위되어 굴욕적인 항복(‘카우디움의 멍에’)을 했으나 이후 아피우스 가도(312)를 놓고 식민시를 세워 이겼다. 이 사이 에페이로스의 알렉산드로스 1세(필리포스 2세의 처남)가 334년 무렵부터 이탈리아 남부에서 루카니아·브루티이와 싸우다 331/330년 판도시아에서 죽었다. 제3차 삼니움 전쟁(298~290)에서 삼니움은 에트루리아·움브리아·켈트(갈리아)와 손잡았으나 기원전 295년 센티눔에서 로마가 이겼고(집정관 데키우스 무스 전사), 290년 마니우스 쿠리우스 덴타투스가 삼니움을 누르고 사비니를 병합했다(리비우스 10권, 290년의 일은 『요약』 11). 지도는 이 변화를 로마 공화정의 땅이 기원전 338년(캄파니아·라티움), 323년 버전(326년 그리스 도시 네아폴리스와의 조약), 317년(아풀리아), 290년(삼니움·사비니)으로 넓어진 것으로 그린다."
  subjects: [roman-republic, italic-tribes, etruscan-city-states, celtic-tribes, epirus, greek-city-states]
  links:
    - { from: roman-republic, to: italic-tribes, note: "삼니움 전쟁과 라티움 전쟁의 승리" }
  tags: [war]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 7.29~10.47 (B. O. Foster 외 영역, Loeb, 1926~1938)", "Tim Cornell, The Beginnings of Rome (1995)", "Stephen P. Oakley, A Commentary on Livy Books VI–X (4권, 1997~2005)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII, Part 2 (2판, 1989)"]
