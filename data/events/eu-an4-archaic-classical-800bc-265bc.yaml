- id: alexander-gaugamela-331bc
  year: -330
  endYear: -322
  title:
    ko: "알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)"
  summary:
    ko: "마케도니아의 알렉산드로스는 이집트를 얻은 뒤(알렉산드리아 건설 331) 기원전 331년 10월 1일 가우가멜라에서 다리우스 3세의 대군을 꺾었다. 아리아노스는 페르시아 보병 100만, 기병 4만이라 적으나(3.8) 크게 부풀린 수여서 현대 추정은 대략 5만~25만으로 폭이 넓다(5만~12만으로 좁히는 학자도 있다). 다리우스는 동쪽으로 달아났고 바빌론과 수사가 항복했다. 기원전 330년 1월 페르세폴리스를 차지해 보물을 얻었고 5월 궁전이 불탔다(디오도로스 17.70, 플루타르코스 『알렉산드로스』 38). 알렉산드로스가 취흥 속에 불을 질렀다고 하며 기원전 480년 아테네를 불태운 일의 보복이라 설명하나 동기는 논쟁이다. 같은 해 여름 다리우스는 박트리아 총독 베소스에게 살해되어 아케메네스 왕조가 끝났다. 알렉산드로스는 베소스를 쫓아 소그디아나에서 329~327년 힘든 게릴라전을 치르고 록사네와 혼인했으며(327), 326년 인도의 히다스페스강에서 포루스를 꺾었으나 병사들이 히파시스강에서 더 가기를 거부해 돌아섰다. 323년 6월 바빌론에서 서른두 살 나이로 죽었다. 그리스에서는 스파르타 왕 아기스 3세의 반란을 안티파트로스가 331/330년 메갈로폴리스에서 눌렀다. 지도는 가우가멜라의 해인 기원전 331년 버전에서 아르메니아·카파도키아·소아르메니아를 알렉산드로스의 직접 지배 밖의 땅으로 아케메네스에서 떼어 따로 그리고, 아케메네스 항목은 다리우스가 죽은 뒤 베소스가 왕을 칭하다 잡히는 기원전 329년에 끝낸다. 같은 무렵 동쪽 끝에서 연이 왕을 칭하자 고조선의 지배자도 왕을 칭하고 연을 치려 했다고 전한다(`gojoseon-king-322`)."
  subjects: [macedonia-kingdom, achaemenid-empire, arsacid-armenia, cappadocia-kingdom, lesser-armenia, greek-city-states, gojoseon, yan-state]
  links:
    - { from: macedonia-kingdom, to: greek-city-states, note: "아기스 3세의 반란 진압(기원전 331/330)" }
  tags: [war]
  sources: ["Arrian(아리아노스), Anabasis Alexandrou(『알렉산드로스 원정기』) 3~7 (P. A. Brunt 영역, Loeb, 1976·1983)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 17.53~118 (C. Bradford Welles 영역, Loeb, 1963)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『알렉산드로스』 (Bernadotte Perrin 영역, Loeb, 1919)", "A. B. Bosworth, Conquest and Empire (1988)", "『삼국지』 위서 동이전 주석 『위략』"]
  places:
    - { name: 가우가멜라, at: [43.43, 36.55], year: -330 }
