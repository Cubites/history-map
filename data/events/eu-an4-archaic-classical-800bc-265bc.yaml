- id: alexander-balkans-thebes-336bc
  year: -335
  endYear: -334
  title:
    ko: "알렉산드로스의 즉위(기원전 336)와 발칸 원정(기원전 335), 테베의 파괴"
  summary:
    ko: "필리포스 2세가 죽은 기원전 336년 스무 살의 알렉산드로스가 왕위에 올랐다. 그는 왕위를 다툴 만한 사촌들과 반대파 아탈로스 같은 이들을 제거해 자리를 굳혔다(플루타르코스 『알렉산드로스』 11). 기원전 335년 봄 알렉산드로스는 트라키아를 지나 하이모스산맥을 넘어 트리발로이(트라키아 부족)를 꺾고 도나우를 건너 게타이(다키아 부족 묶음)를 쳤다(아리아노스 1.2~4). 도나우 가까이에서 켈트 사절을 맞았고(앞의 사건), 일리리아 왕 클레이토스와 타울란티오이의 왕 글라우키아스가 일어나자 그들을 눌렀다(1.5~6). 그 사이 테베가 마케도니아 수비대를 몰아내려 반란을 일으켰다는 소식이 들리자 알렉산드로스는 서둘러 남쪽으로 내려와 335년 가을 테베를 함락하고 허물었다. 아리아노스는 학살을 주로 포키스인과 보이오티아의 플라타이아·테스피아이·오르코메노스 같은 테베의 적들이 했고(1.8) 도시를 어떻게 할지는 동맹국들에 맡겨 이들이 파괴를 결정했다고 적어 결정을 동맹국에 돌린다(1.9). 신전과 시인 핀다로스의 집은 남겼고, 약 6천 명이 죽고 3만 명이 노예로 팔렸다는 수는 디오도로스 17.14와 플루타르코스 『알렉산드로스』 11에 있다. 이후 그리스 도시국가는 한동안 순종했고, 알렉산드로스는 안티파트로스를 섭정으로 남기고 334년 봄 아시아로 떠났다(뒤의 사건). 지도는 기원전 335년 아리아노스가 적은 도나우 중류에서 켈트 부족·일리리아·판노니아 부족·다키아 부족 묶음을 넓혀 칠한다."
  subjects: [macedonia-kingdom, greek-city-states, celtic-tribes, illyrian-tribes, dacian-tribes, thracian-tribes]
  links:
