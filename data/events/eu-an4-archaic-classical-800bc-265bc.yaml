- id: rome-republic-509bc
  year: -508
  endYear: -492
  title:
    ko: "로마 공화정의 성립(전승 기원전 509)과 첫 로마-카르타고 조약, 라틴 동맹(기원전 493)"
  summary:
    ko: "전승에 따르면 기원전 509년 왕의 아들 섹스투스에게 능욕당한 루크레티아가 자결하자, 루키우스 유니우스 브루투스와 루키우스 타르퀴니우스 콜라티누스가 시민을 이끌어 타르퀴니우스 수페르부스를 몰아냈다. 이후 해마다 뽑는 집정관(콘술) 둘이 왕의 권한을 나눠 쥐었고 첫 집정관은 브루투스와 콜라티누스라고 한다(리비우스 1.57~60, 2.1). 쫓겨난 왕은 에트루리아 클루시움의 라르스 포르센나의 도움으로 복위하려 했으나 실패했다고 전한다. 같은 해(바로의 연대) 로마는 카르타고와 첫 조약을 맺었다. 폴리비오스는 이 조약이 로마의 첫 집정관 브루투스와 마르쿠스 호라티우스 때, 크세르크세스의 도해 28년 전의 일이라 적는다(3.22. 리비우스는 첫 집정관을 브루투스와 콜라티누스로 적는다). 조약은 로마와 그 동맹이 ‘아름다운 곶’ 서쪽으로 항해하지 못하게 하고 사르데냐와 리비아에서는 전령의 입회 아래에서만 거래하게 했으며, 카르타고는 라티움의 로마 동맹 도시를 해치거나 요새를 짓지 못하게 했다. 이 문서는 로마가 이미 라티움의 맹주였고 카르타고가 사르데냐를 쥐고 있었음을 보여 준다. 기원전 493년 카시우스 조약으로 로마는 라틴 도시들과 대등한 동맹을 맺었고(리비우스 2.33), 그 전해 채무에 시달린 평민이 도시를 떠나 호민관 제도가 생겼다고 전한다(‘신분 투쟁’의 시작). 지도는 로마 왕국을 기원전 509년에 로마 공화정으로 이어 그리고, 같은 해 카르타고가 사르데냐·시칠리아 서부·몰타를 가진 것으로 그린다."
  subjects: [roman-republic, roman-kingdom, carthage, etruscan-city-states]
  links:
    - { from: roman-republic, to: carthage, note: "첫 조약(기원전 509)" }
  tags: [politics, diplomacy]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 1.57~60, 2.1~33 (B. O. Foster 영역, Loeb, 1919)", "Polybius(폴리비오스), Historiai(『역사』) 3.22 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Tim Cornell, The Beginnings of Rome (1995)", "Dexter Hoyos, The Carthaginians (2010)"]

- id: ionian-revolt-marathon-499bc
  year: -498
  endYear: -489
  title:
    ko: "이오니아 반란(기원전 499~493)과 마라톤 전투(기원전 490)"
  summary:
    ko: "기원전 499년 밀레투스의 아리스타고라스가 이오니아의 그리스 도시국가들을 이끌어 페르시아(아케메네스 제국)에 맞서 들고일어났다(이오니아 반란). 아테네는 배 20척, 에레트리아는 5척을 보냈고 498년 연합군이 사르디스를 불태웠다(헤로도토스 5.99~102). 페르시아는 494년 라데 해전에서 이기고 밀레투스를 함락해 남자를 죽이고 여자와 아이를 노예로 삼았다(6.7~21). 반란을 도운 아테네와 에레트리아를 벌하려 다리우스 1세가 보낸 함대는 490년 에레트리아를 함락해 주민을 아시아로 끌어갔고, 아테네 동북쪽 마라톤에 상륙했다. 밀티아데스를 비롯한 장군들이 이끈 아테네 중장보병 약 1만 명과 플라타이아의 지원군(약 1천 명으로 전한다)이 9월에 페르시아군을 꺾었다. 헤로도토스는 전사자를 페르시아 6,400명, 아테네 192명이라 적는다(6.117). 스파르타 군은 종교 제전 때문에 늦게 도착했다. 앞서 492년 마르도니오스가 트라키아와 마케도니아를 다시 눌렀으나 함대가 아토스곶에서 폭풍을 만나 되돌아갔다(6.43~45). 마라톤의 승리는 아테네에 큰 자신감을 주었고, 페르시아의 다음 원정은 다리우스가 죽은 뒤 크세르크세스가 맡았다(뒤의 사건). 지도는 이오니아 반란과 마라톤을 결말이 되돌려진 원정과 반란으로 보아 땅을 바꾸지 않는다."
  subjects: [greek-city-states, achaemenid-empire, macedonia-kingdom]
  links:
    - { from: achaemenid-empire, to: greek-city-states, note: "사르디스 방화에 대한 원정과 마라톤(기원전 490)" }
  tags: [war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 5.28~6.140 (A. D. Godley 영역, Loeb, 1920~1925)", "Peter Green, The Greco-Persian Wars (1996)", "John Boardman 외 엮음, The Cambridge Ancient History IV (2판, 1988)"]
