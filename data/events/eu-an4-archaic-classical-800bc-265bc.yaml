- id: diadochi-corupedium-297bc
  year: -296
  endYear: -276
  title:
    ko: "후계자 전쟁 4: 마케도니아의 왕들(기원전 297~277), 코루페디온 전투(기원전 281)와 리시마코스의 끝"
  summary:
    ko: "기원전 297년 카산드로스가 죽자 아들 필리포스 4세가 몇 달 만에 죽고, 형제 안티파트로스와 알렉산드로스 5세가 나라를 두고 다투었다. 294년 데메트리오스가 알렉산드로스 5세를 살해하고 왕이 되었다(플루타르코스 『데메트리오스』 36~37). 288년 에페이로스의 피로스와 리시마코스가 데메트리오스를 몰아내고 마케도니아를 나눠 가졌고, 데메트리오스는 285년 셀레우코스에게 항복해 283년 포로로 죽었다. 285년 리시마코스가 피로스를 밀어내고 마케도니아 전체를 차지하면서 파이오니아도 합쳐졌다. 리시마코스는 아들 아가토클레스를 죽였다(284 무렵, 왕비 아르시노에의 사주라고 전한다). 소아시아에서는 리시마코스의 재정관 필레타이로스가 282년 페르가몬을 들고 셀레우코스에게 돌아섰고, 281년 초 리디아의 코루페디온에서 셀레우코스 1세가 리시마코스를 꺾어 리시마코스가 죽었다. 셀레우코스는 유럽으로 건너와 281년 9월 프톨레마이오스 1세의 아들 프톨레마이오스 케라우노스에게 살해되었다. 케라우노스는 마케도니아 왕을 칭했으나 279년 켈트와 싸우다 죽었고, 멜레아그로스(두 달)·안티파트로스 에테시아스(45일)·소스테네스(279~277, 왕호를 거절한 장군)를 거쳐 277년 데메트리오스의 아들 안티고노스 2세 고나타스가 왕이 되었고, 274~272년 피로스에게 마케도니아를 빼앗겼다가 272년 피로스가 죽은 뒤 안티고노스 왕조가 자리 잡았다. 같은 기원전 3세기 초 동쪽 끝에서는 연의 진개가 동호를 물리치고 고조선을 쳐 서쪽 땅을 빼앗았다고 전한다(`jingae-281`, 동호를 친 일은 『사기』 「흉노열전」). 지도는 리시마코스 왕국을 기원전 281년에 끝내고 그 땅을 셀레우코스 제국·폰토스 왕국·파플라고니아 왕국·비티니아 왕국·페르가몬 왕국으로 나눠 그린다."
  subjects: [macedonia-kingdom, lysimachus-kingdom, seleucid-empire, paeonia-kingdom, pergamon-kingdom, epirus, gojoseon, yan-state, donghu]
  links:
    - { from: seleucid-empire, to: lysimachus-kingdom, note: "코루페디온 전투(기원전 281)" }
  tags: [war, politics]
  sources: ["Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『데메트리오스』·『피로스』 (Bernadotte Perrin 영역, Loeb, 1920~1921)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 16~17, 24 (J. C. Yardley 영역, 1994)", "Waldemar Heckel, The Wars of Alexander’s Successors 323–281 BC (2008)", "Strabo(스트라본), Geographica(『지리지』) 13.4.1~2 (H. L. Jones 영역, Loeb, 1928)", "『삼국지』 위서 동이전 주석 『위략』", "Sima Qian(사마천), Shiji(『사기』) 110 「흉노열전」 (Burton Watson 번역, Records of the Grand Historian: Han Dynasty II, 개정판 1993)"]
