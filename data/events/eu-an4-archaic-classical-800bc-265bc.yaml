  tags: [politics, war]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 16.1~58 (C. L. Sherman 영역, Loeb, 1952)", "Demosthenes(데모스테네스), Olynthiacs·Philippics(『올린토스 연설』·『필리포스 연설』) (J. H. Vince 영역, Loeb, 1930)", "Ian Worthington, Philip II of Macedonia (2008)", "N. G. L. Hammond·G. T. Griffith, A History of Macedonia II (1979)"]
