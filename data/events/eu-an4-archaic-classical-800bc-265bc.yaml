- id: anatolian-kingdoms-331bc
  year: -330
  endYear: -277
  title:
    ko: "알렉산드로스 뒤의 아나톨리아와 캅카스: 카파도키아·아르메니아·비티니아·폰토스·페르가몬·이베리아"
  summary:
    ko: "알렉산드로스 제국이 쪼개진 뒤 아나톨리아 북부와 캅카스에서는 현지 왕조의 나라가 자랐다. 카파도키아는 아리아라테스 1세가 기원전 322년 페르디카스에게 져 죽은 뒤 마케도니아의 지배를 받다가, 301년 입소스 뒤 조카 아리아라테스 2세가 되찾았다(디오도로스 31.19.4). 아르메니아는 아케메네스 때 총독을 맡았던 오론티드 가문이 이어 다스렸다고 보며, 지도는 아르메니아·카파도키아·소아르메니아를 기원전 331년부터 따로 그린다. 비티니아의 토착 왕공 바스와 지포이테스 1세는 마케도니아에 복속하지 않았고, 지포이테스는 기원전 297년 왕을 칭했다. 폰토스에서는 미트리다테스 1세 크티스테스(‘건설자’)가 안티고노스를 피해 카파도키아 북부 산지에 자리 잡았다가 기원전 281년 무렵 왕을 칭했다고 하며, 파플라고니아는 토착 왕공과 미트리다테스가 나눠 쥐었다고 전하며, 지도는 301~282년을 리시마코스의 땅으로, 281년부터를 토착 왕공의 땅으로 그린다. 페르가몬은 리시마코스의 재정관 필레타이로스가 282년 셀레우코스 쪽으로 돌아선 데서 시작해 작은 도시국가로 자랐다. 캅카스의 이베리아(카르틀리)는 조지아 연대기가 파르나바즈 1세가 기원전 3세기 초에 세웠다고 전해(고고학적 근거는 약하다), 지도는 기원전 299년부터 그리며, 3세기부터 이베리아 땅이던 클라르제티(아르트빈도 북부, 2세기부터는 아르메니아와 다툼)도 이 해부터 콜키스에서 이베리아로 옮긴다. 이 나라들은 셀레우코스 제국과 리시마코스 왕국이 소아시아를 모두 쥐지 못한 틈에 자랐다."
  subjects: [cappadocia-kingdom, arsacid-armenia, lesser-armenia, bithynia-kingdom, pontus-kingdom, paphlagonia-kingdom, pergamon-kingdom, iberia-kingdom, seleucid-empire, lysimachus-kingdom]
  tags: [politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 18.16, 31.19 (Russel M. Geer 외 영역, Loeb, 1947~1957)", "Strabo(스트라본), Geographica(『지리지』) 12 (H. L. Jones 영역, Loeb, 1928)", "Stephen Mitchell, Anatolia: Land, Men, and Gods in Asia Minor I (1993)", "Waldemar Heckel, The Wars of Alexander’s Successors 323–281 BC (2008)", "Cyril Toumanoff, Studies in Christian Caucasian History (1963)"]

- id: diadochi-babylon-323bc
  year: -322
  endYear: -319
  title:
    ko: "알렉산드로스의 죽음과 바빌론 분할(기원전 323), 라미아 전쟁, 트리파라데이소스(기원전 320)"
  summary:
    ko: "기원전 323년 6월 알렉산드로스가 후계자를 정하지 않고 죽자 장군들은 이복동생 필리포스 3세 아리다이오스와 아직 태어나지 않은 아들(8월 출생, 알렉산드로스 4세)을 공동 왕으로 세우고 페르디카스를 섭정 격으로 삼았다. 바빌론의 분할로 프톨레마이오스가 이집트를, 리시마코스가 트라키아를, 안티고노스가 프리기아·리키아·팜필리아를, 에우메네스가 카파도키아와 파플라고니아를 맡았고 안티파트로스와 크라테로스가 마케도니아와 그리스를 맡았다(디오도로스 18.3). 아테네와 아이톨리아 동맹이 일어난 라미아 전쟁(323~322)은 322년 크란논 전투에서 안티파트로스가 이겨 끝났고 데모스테네스는 자결했다. 같은 해 페르디카스와 에우메네스가 카파도키아를 정복해 왕 아리아라테스 1세를 죽였다(18.16). 리시마코스는 트라키아의 세우테스 3세와 싸우며 자리를 다졌다(18.14). 기원전 321/320년 페르디카스가 이집트 원정에서 부하 장군들(페이톤·셀레우코스 등)에게 살해되고, 트리파라데이소스 회의에서 안티파트로스가 섭정이 되고 셀레우코스가 바빌로니아를 얻었으며 안티고노스가 에우메네스를 쫓는 아시아 사령관이 되었다. 지도는 이 변화를 기원전 323년에 리시마코스가 트라키아를 얻고, 322년 카파도키아를 마케도니아 왕국이 정복한 것으로 그린다. 프톨레마이오스의 이집트는 권역 밖이라 그리지 않고, 키프로스 등은 뒤의 사건이다."
  subjects: [macedonia-kingdom, lysimachus-kingdom, ptolemaic-kingdom, cappadocia-kingdom, odrysian-kingdom, aetolian-league, greek-city-states]
  links:
    - { from: macedonia-kingdom, to: cappadocia-kingdom, note: "카파도키아의 정복(기원전 322)" }
  tags: [war, politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 18 (Russel M. Geer 영역, Loeb, 1947)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 13 (J. C. Yardley 영역, 1994)", "Waldemar Heckel, The Wars of Alexander’s Successors 323–281 BC (2008)", "Richard A. Billows, Antigonos the One-Eyed and the Creation of the Hellenistic State (1990)"]
  places:
    - { name: 크란논, at: [22.3, 39.5], year: -321 }
    - { name: 라미아, at: [22.43, 38.9], year: -322 }

- id: pytheas-320bc
  year: -319
  title:
    ko: "마살리아의 피테아스의 북유럽 항해(기원전 320 무렵)"
  summary:
    ko: "마살리아의 그리스인 피테아스가 기원전 4세기 후반(흔히 325년 무렵으로 본다) 대서양 연안을 따라 북쪽으로 항해해 브리타니아를 돌아보고 북쪽의 ‘툴레’까지 갔다고 한다(툴레가 어디인지는 노르웨이 해안이나 아이슬란드, 오크니 제도 등으로 추측이 갈린다). 그의 책 『대양에 관하여』는 전해지지 않고 스트라본·플리니우스·폴리비오스가 인용한 토막으로만 남았으며, 스트라본은 그를 거짓말쟁이라고 깎아내렸다(2.4.1~2). 토막에는 콘월의 주석 교역, 브리타니아 사람들의 곡물 탈곡과 사는 모습, 호박이 나는 북해 연안의 부족(플리니우스는 이를 구토네스와 테우토네스라고 인용한다, 37.35~36), 한여름 밤이 짧아지는 지방, 얼어붙어 굳어 가는 바다가 나온다. 지도는 이 서술을 근거로 북독일·유틀란트·브리타니아를 기원전 320년 버전부터 게르만 부족 묶음과 켈트 부족 묶음으로 칠한다. 다만 사료가 이 정도로 얇은 곳을 부족 묶음으로 채운 것은 근사이고, 스칸디나비아·핀란드·러시아 숲은 사료가 없어 비워 둔다. 마살리아가 북쪽 호박과 주석 교역의 길목이었다는 점에서 이 항해를 상업 탐사로 보는 견해가 많다."
  subjects: [germanic-tribes, celtic-tribes, greek-city-states]
  links:
    - { from: greek-city-states, to: germanic-tribes, note: "피테아스의 기록(기원전 320 무렵)" }
  tags: [culture, economy]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 1.4, 2.4 (H. L. Jones 영역, Loeb, 1917~1932)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 37.35~36 (D. E. Eichholz 영역, Loeb, 1962)", "Barry Cunliffe, The Extraordinary Voyage of Pytheas the Greek (2002)", "Christina Horst Roseman, Pytheas of Massalia: On the Ocean (1994)"]

- id: diadochi-antigonus-320bc
  year: -319
  endYear: -310
  title:
    ko: "후계자 전쟁 2: 안티고노스의 아시아와 카산드로스의 마케도니아(기원전 320~311), 가자 전투와 311년 평화"
  summary:
    ko: "기원전 319년 안티파트로스가 죽자 섭정 폴리페르콘과 안티파트로스의 아들 카산드로스, 안티고노스, 에우메네스가 서로 싸웠다. 317년 올림피아스가 필리포스 3세와 그의 왕비 에우리디케를 죽였고, 카산드로스가 마케도니아에 들어가 316년 올림피아스를 처형했으며 알렉산드로스 4세와 어머니 록사네를 가뒀다. 에우메네스는 316년 부하의 배반으로 붙잡혀 안티고노스에게 죽었다(디오도로스 19). 안티고노스는 아시아의 강자가 되어 소아시아·시리아·메소포타미아 북부를 쥐었고, 315년 티레에서 그리스 도시의 자유를 선언하며 카산드로스와 맞섰다. 이에 프톨레마이오스·셀레우코스·리시마코스·카산드로스가 동맹했고 312년 가자에서 프톨레마이오스와 셀레우코스가 안티고노스의 아들 데메트리오스를 꺾었다. 셀레우코스는 바빌론으로 돌아갔고(셀레우코스 기원 312/311), 311년 평화는 카산드로스를 마케도니아 유럽 쪽의 장군으로, 리시마코스를 트라키아로, 프톨레마이오스를 이집트로, 안티고노스를 아시아 전체로 인정하되 어린 왕 알렉산드로스 4세가 성년이 될 때까지로 못박았다(셀레우코스는 이 평화에 들지 않았고 안티고노스와 311~309년 바빌론 전쟁을 치렀다). 알렉산드로스 4세와 록사네는 310년 무렵 카산드로스에게 살해되었다고 전한다(19.105; 연대는 309로도 본다). 지도는 안티고노스 1세의 왕국을 기원전 320년 소아시아로, 317년 시리아 북부·킬리키아·메소포타미아 북부로 그리고, 311년 버전에서 셀레우코스가 바빌론을 되찾아 지킨 메소포타미아를 셀레우코스의 땅으로, 프톨레마이오스가 쥐고 있던 키프로스를 프톨레마이오스의 땅으로 그린다."
  subjects: [macedonia-kingdom, antigonid-asia, seleucid-empire, ptolemaic-kingdom, lysimachus-kingdom, greek-city-states]
  links:
    - { from: antigonid-asia, to: ptolemaic-kingdom, note: "가자 전투(기원전 312)" }
  tags: [war, politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 19 (Russel M. Geer 영역, Loeb, 1947)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『에우메네스』·『데메트리오스』 (Bernadotte Perrin 영역, Loeb, 1919)", "Waldemar Heckel, The Wars of Alexander’s Successors 323–281 BC (2008)", "Richard A. Billows, Antigonos the One-Eyed and the Creation of the Hellenistic State (1990)"]
