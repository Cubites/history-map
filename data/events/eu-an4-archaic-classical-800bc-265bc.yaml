- id: timoleon-agathocles-350bc
  year: -349
  endYear: -288
  title:
    ko: "시라쿠사의 혼란과 티몰레온(기원전 344~337), 아가토클레스(기원전 317~289), 남이탈리아의 루카니아·브루티이"
  summary:
    ko: "디오니시오스 1세 뒤 아들 디오니시오스 2세(367~357)는 플라톤의 제자 디온에게 쫓겨났다. 디온이 죽은 뒤 칼리포스, 힙파리노스, 니사이오스가 차례로 시라쿠사를 쥐었고(디오도로스 16), 기원전 346년 디오니시오스 2세가 돌아왔다. 시라쿠사의 모도시 코린토스가 보낸 티몰레온이 기원전 344년 그의 항복을 받고 참주들을 몰아내 시칠리아의 그리스 도시를 재건했고, 339년(341년설도 있다) 크리미소스강에서 카르타고군을 꺾었다(플루타르코스 『티몰레온』 25~29). 티몰레온이 죽은 뒤(337) 불안한 시라쿠사에서 기원전 317년 아가토클레스가 군대를 쥐고 권력을 잡았다. 도공의 아들 출신이라 전한다. 그는 311년 히메라 강변에서 카르타고에 져 포위되자 310년 아프리카로 건너가 카르타고를 위협했다(디오도로스 20.3~18). 306년 강화로 시칠리아 동부를 쥐고 304년 왕을 칭했으며 이탈리아 남부와 코르키라까지 손댔다. 이탈리아 남부에서는 기원전 356년 무렵 루카니아에서 갈라져 나온 브루티이가 일어나 타렌툼·크로톤 같은 그리스 도시를 압박해, 타렌툼은 스파르타 왕 아르키다모스 3세(338 전사)와 에페이로스의 알렉산드로스를 불렀다(뒤의 사건). 289년 아가토클레스가 죽은 뒤 시라쿠사는 다시 혼란에 빠졌고(히케타스, 티니온과 소시스트라토스를 거쳐 피로스의 시칠리아 원정(278~276) 뒤 히에론 2세가 권력을 잡는다, 뒤의 사건), 그의 용병 마메르티니가 288년 메사나를 차지했다. 지도는 시라쿠사의 땅 약 2만 km²를 344년 그리스 도시국가 묶음으로 돌리고(티몰레온의 해방), 317년 아가토클레스가 동부를, 306년 남부를 얻은 것으로 넓히며, 289년 그의 죽음으로 줄이고 브루티이의 땅을 356년 이탈리아 부족 묶음으로 더한다."
  subjects: [syracuse, carthage, greek-city-states, italic-tribes]
  links:
    - { from: syracuse, to: carthage, note: "크리미소스(기원전 339)와 아프리카 원정(310)" }
  tags: [politics, war]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 16.5~20, 16.65~82, 19.2~20.101 (C. L. Sherman 1952, C. Bradford Welles 1963, Russel M. Geer 1947·1954 영역, Loeb)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『티몰레온』 (Bernadotte Perrin 영역, Loeb, 1918)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 요약』) 22 (J. C. Yardley 영역, 1994)"]

- id: philip-ii-chaeronea-346bc
  year: -345
  endYear: -335
  title:
    ko: "필리포스 2세의 패권(기원전 346~336): 테살리아·트라키아, 카이로네이아(기원전 338), 코린토스 동맹과 암살"
  summary:
    ko: "기원전 346년 필리포스 2세는 아테네와 ‘필로크라테스의 평화’를 맺고 델포이 신전을 지키는 암픽티오니아에 들어갔다. 기원전 352년 크로커스 평원의 승리 뒤 테살리아 동맹의 아르콘이 되었고(344년에 동맹 구조를 재편했다고 본다), 343/342년 에페이로스의 왕 아립바스를 몰아내고 아내 올림피아스의 오빠 알렉산드로스(에페이로스의 알렉산드로스 1세)를 그 자리에 세웠다. 기원전 342~340년 트라키아로 진군해 오드리사이의 케르소블렙테스를 눌러 공납국으로 만들고 필리포폴리스를 세웠다(디오도로스 16.71~72). 340년 페린토스와 비잔티온 포위는 실패했다. 339년에는 도나우강 하구 쪽(도브루자)에서 스키타이 왕 아테아스를 쳐 죽였다(앞의 사건). 기원전 338년 8월 카이로네이아에서 필리포스의 군대가 아테네와 테베 연합군을 꺾었다. 열여덟 살의 아들 알렉산드로스가 기병을 이끌었고 테베의 신성 부대는 전멸했다고 전한다(디오도로스 16.85~86, 플루타르코스 『펠로피다스』 18). 기원전 337년 코린토스에 모인 그리스 도시들(스파르타는 불참)은 필리포스를 ‘헤게몬’으로 하는 코린토스 동맹을 맺어 도시 사이의 평화와 페르시아(아케메네스 제국) 원정을 결의했다. 필리포스는 원정군을 먼저 소아시아로 보냈으나 기원전 336년 딸 클레오파트라의 혼례식 때 아이가이에서 근위병 파우사니아스에게 살해되었다. 지도는 테살리아·칼키디케를 기원전 344·348년, 트라키아 남부를 342년, 카이로네이아 뒤 그리스 남부와 케르소네소스를 338년 버전에 마케도니아 땅으로 더해 그린다."
  subjects: [macedonia-kingdom, greek-city-states, odrysian-kingdom, epirus, achaemenid-empire]
  links:
    - { from: macedonia-kingdom, to: greek-city-states, note: "카이로네이아(기원전 338)와 코린토스 동맹" }
  tags: [war, politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 16.59~95 (C. L. Sherman 영역 1952 [~16.65], C. Bradford Welles 영역 1963 [16.66~])", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『알렉산드로스』 9~11, 『펠로피다스』 18 (Bernadotte Perrin 영역, Loeb, 1917·1919)", "Ian Worthington, Philip II of Macedonia (2008)", "N. G. L. Hammond·F. W. Walbank, A History of Macedonia III: 336–167 B.C. (1988)"]
