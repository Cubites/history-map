  title:
    ko: "피로스 전쟁(기원전 280~275)과 이탈리아 통일(기원전 272 타렌툼)"
  summary:
    ko: "기원전 283년 로마는 아드리아해 쪽 세노네스 갈리아인(켈트 부족 묶음)의 땅 아게르 갈리쿠스를 차지했고, 280년에는 에트루리아 남부의 불키와 볼시니를 쳐 집정관 티베리우스 코룽카니우스가 개선식을 열었다. 기원전 281년 남이탈리아의 그리스 도시 타렌툼(타라스)이 로마에 맞서 에페이로스 왕 피로스를 불렀다. 피로스(재위 297~272, 한때 마케도니아 왕 288~285)는 280년 보병 2만, 기병 3천, 코끼리 20마리를 이끌고 건너와(플루타르코스 『피로스』 15) 헤라클레아에서 이겼으나 큰 손실을 입었고, 279년 아스쿨룸에서도 겨우 이겼다(‘피로스의 승리’). 로마와 카르타고는 279년 서로 도와 피로스에 맞서는 조약을 맺었다(폴리비오스 3.25). 시라쿠사를 비롯한 시칠리아의 그리스 도시가 부르자 피로스는 278년 건너가 카르타고를 에릭스까지 몰아냈으나 릴리바이온을 얻지 못했고 시칠리아 도시들과 틀어져 276년 이탈리아로 돌아왔다. 275년 베네벤툼에서 마니우스 쿠리우스 덴타투스에게 져 에페이로스로 물러났고, 마케도니아를 되찾으려다 272년 아르고스 시가전에서 죽었다. 같은 해 타렌툼이 로마에 항복했고 270년 레기온, 268년 피케눔, 266년 브룬디시움(메사피이)을 얻었으며 265년 시작된 볼시니 문제는 264년 함락으로 이어졌다(뒤의 사건). 로마는 점령한 도시를 시민권을 가진 시민, 라틴 동맹, 일반 동맹시의 층으로 묶고 요충지에 식민시를 세워 이탈리아반도 전역을 다스렸다. 지도는 이 변화를 에트루리아 남부(280년), 타렌툼·루카니아·브루티움(272년), 메사피이와 볼시니 일대(265년)가 차례로 로마 공화정 땅이 되고 카르타고가 시칠리아 남부를 얻은 것(276년의 일을 272년 버전에 묶음)으로 그린다."
