- id: athens-solon-594bc
  year: -593
  endYear: -506
  title:
    ko: "아테네: 솔론의 개혁(기원전 594), 페이시스트라토스 부자의 참주정, 클레이스테네스의 개혁(기원전 508/507)"
  summary:
    ko: "아테네는 아티카 전체를 한 폴리스로 묶은 곳으로, 기원전 7세기 말 귀족이 다스리는 가운데 빚진 농민이 노예로 떨어지는 문제가 커졌다. 드라콘이 기원전 621년 무렵 가혹한 법을 적어 두었다고 전한다. 기원전 594/3년 아르콘 솔론이 빚을 없애고(세이사크테이아) 빚 때문에 사람을 노예로 삼는 일을 금했으며 시민을 재산 등급 넷으로 나눠 정치 참여의 길을 넓혔다(아리스토텔레스 『아테나이인의 정치제도』 5~12). 갈등은 가라앉지 않아 페이시스트라토스가 기원전 561년 참주가 되었다. 그는 두 번 쫓겨났다 돌아와 546년부터 527년 죽을 때까지 다스렸다(헤로도토스 1.59~64). 아들 히피아스와 히파르코스가 뒤를 이었으나 히파르코스는 514년 하르모디오스와 아리스토게이톤에게 죽었고, 히피아스는 510년 알크메오니다이 가문의 청을 받은 스파르타 군에 쫓겨났다. 이어 이사고라스와 다툰 클레이스테네스가 기원전 508/507년 시민을 지역에 따른 10개 부족으로 새로 나누고 500인 평의회를 두어 민주정의 바탕을 놓았다(헤로도토스 5.66~73). 이때의 시민은 아테네 시민의 아들인 성인 남성이었고 여성·거류민·노예는 빠졌다. 지도는 아테네를 그리스 도시국가 묶음에 둔다."
  subjects: [greek-city-states]
  tags: [politics]
  sources: ["Aristotle(아리스토텔레스), Athenaion Politeia(『아테나이인의 정치제도』) 5~22 (H. Rackham 영역, Loeb, 1935)", "Herodotus(헤로도토스), Historiai(『역사』) 1.59~64, 5.55~78 (A. D. Godley 영역, Loeb, 1920~1925)", "P. J. Rhodes, A Commentary on the Aristotelian Athenaion Politeia (개정판, 1993)", "John Boardman 외 엮음, The Cambridge Ancient History IV: Persia, Greece and the Western Mediterranean, c. 525 to 479 B.C. (2판, 1988)"]

- id: cyrus-achaemenid-550bc
  year: -549
  endYear: -521
  title:
    ko: "키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)"
  summary:
    ko: "페르시아 왕 키루스 2세(고대 페르시아어 쿠루시, 아케메네스 제국의 창시자)는 기원전 550년 헤로도토스가 외할아버지라 적는 메디아 왕 아스티아게스를 꺾고 메디아 제국을 차지했다(1.123~130). 크로이소스가 먼저 할리스강을 건너 카파도키아를 치자 키루스가 맞서 팀브라 평원에서 이기고 기원전 547년(546년이라는 설도) 사르디스를 함락해 리디아를 끝냈다. 장군 하르파고스가 기원전 546~545년 이오니아의 그리스 도시와 카리아·리키아를 차지했다(1.162~176). 킬리키아의 시엔네시스 왕조는 복속한 채 이어졌고(3.90), 지도는 킬리키아 왕국을 기원전 545년부터 아케메네스의 종속 왕국으로 둔다. 기원전 539년 키루스는 바빌론을 얻었다(‘키루스 원통’, 바빌로니아 연대기). 기원전 530년 동쪽 초원의 마사게타이와 싸우다 죽었고(1.214) 아들 캄비세스 2세가 기원전 525년 이집트를 정복했다. 캄비세스가 죽자(522) 동생이라 자처한 바르디야(헤로도토스의 스메르디스)가 왕이 되었다가 다리우스 1세와 여섯 귀족에게 죽었다. 다리우스는 그가 동생을 사칭한 가우마타였다고 베히스툰 비문(고대 페르시아어·엘람어·바빌로니아어)에 새겼으나 다리우스에게 유리한 기록이라 진상은 논쟁이다. 다리우스 아래에서 제국은 총독령(사트라피)과 ‘왕의 길’, 금화 다릭으로 짜였다. 지도는 아케메네스 제국의 권역 안 땅을 기원전 550년 메디아의 땅이던 아나톨리아 동부, 547년 리디아, 545년 이오니아·카리아·리키아, 539년 시리아와 메소포타미아 북부로 넓혀 그린다."
