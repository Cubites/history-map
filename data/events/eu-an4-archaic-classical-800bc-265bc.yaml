- id: greece-leagues-290bc
  year: -289
  endYear: -259
  title:
    ko: "헬레니즘 초기 그리스: 아이톨리아·아카이아 동맹, 일리리아 왕국, 크레모니데스 전쟁(기원전 290~260)"
  summary:
    ko: "기원전 3세기 초 그리스 본토는 데메트리오스 1세(294~288)와 마케도니아 왕들의 지배, 에페이로스의 피로스, 북쪽 이웃들 사이에 놓여 있었다. 아이톨리아 부족 동맹은 델포이를 기원전 301년 무렵(연대는 논쟁)부터 쥐었고 델포이 암픽티오니아에 대표를 보낸 것은 278년부터라고 한다. 279년 켈트의 델포이 공격을 막은 뒤 소테리아 제전으로 위세를 높였다(뒤의 사건). 펠로폰네소스 북부 아카이아의 도시들은 데메트리오스와 카산드로스의 지배 속에 흩어졌다가 기원전 281/280년 디메·파트라이·트리타이아·파라이 등이 동맹을 다시 세운 것이 아카이아 동맹의 출발이다(폴리비오스 2.41). 아드리아해 쪽에서는 타울란티오이의 왕 모누니오스가 기원전 280년 무렵 디라키온에서 은화를 찍었고, 북쪽의 아르디아이오이는 플레우라토스 때부터 힘을 키워 일리리아·판노니아 부족 묶음 가운데 아드리아해 쪽을 모아 일리리아 왕국으로 자랐다(왕국이 커진 것은 3세기 중엽 이후라 지도는 일리리아 왕국을 기원전 260년 무렵부터 그리고 그전은 일리리아·판노니아 부족 묶음으로 둔다). 마케도니아에서는 277년 안티고노스 2세 고나타스가 켈트를 꺾고 왕위를 굳혔고, 272년 피로스가 죽은 뒤 그리스 본토에서 마케도니아의 영향이 되살아났다. 아테네와 스파르타는 이집트 프톨레마이오스 2세의 격려를 받아 기원전 268/267년 안티고노스에게 맞서 크레모니데스 전쟁(기원전 268/267~262/261)을 일으켰으나 패했고 262/261년 아테네가 항복했다. 지도는 아이톨리아 동맹의 델포이 쪽 확장을 기원전 290년 버전에 근사로 두고, 아카이아 동맹을 기원전 280년에, 일리리아 왕국을 기원전 260년에 성립한 항목으로 그린다."
  subjects: [aetolian-league, achaean-league, illyrian-kingdom, illyrian-tribes, epirus, macedonia-kingdom, greek-city-states]
  links:
    - { from: macedonia-kingdom, to: greek-city-states, note: "크레모니데스 전쟁(기원전 268/267~262/261)" }
  tags: [politics, war]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 2.37~42 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010)", "Pausanias(파우사니아스), Hellados Periegesis(『그리스 안내기』) 1.7, 10.15 (W. H. S. Jones 영역, Loeb, 1918~1935)", "Graham Shipley, The Greek World after Alexander 323–30 BC (2000)", "N. G. L. Hammond·F. W. Walbank, A History of Macedonia III (1988)", "John Wilkes, The Illyrians (1992)"]

- id: celts-balkans-delphi-280bc
  year: -279
  endYear: -264
  title:
    ko: "켈트인의 발칸·델포이 침입(기원전 280~279)과 티리스 켈트 왕국, 갈라티아(기원전 278~)"
  summary:
    ko: "기원전 280년 무렵 발칸으로 내려온 켈트(갈라타이) 무리가 마케도니아를 쳤다. 프톨레마이오스 케라우노스가 279년 초 켈트와 싸우다 죽으면서 마케도니아는 혼란에 빠졌다. 브렌노스가 이끈 무리는 그리스로 내려가 279년 가을 델포이를 노렸으나 아이톨리아와 포키스군에 막혔고 브렌노스는 부상으로 죽었다(파우사니아스 10.19~23; 그가 적은 15만 명 넘는 보병 수는 과장이다). 아이톨리아 동맹은 이를 기려 델포이에서 ‘소테리아’ 제전을 열었다. 일부는 트라키아에 남아 코몬토리오스가 세운 티리스 켈트 왕국이 되었고(폴리비오스 4.46), 지도는 티리스를 기원전 279년 헤브로스강 하류~흑해 쪽 트라키아 동남부에 그린다. 다른 무리 약 2만(무장한 사람은 그 절반, 톨리스토보기이·트로크미·텍토사게스, 리비우스 38.16)은 기원전 278~277년 비티니아 왕 니코메데스 1세의 용병으로 보스포로스를 건너 소아시아를 약탈하고 공납을 받았다. 셀레우코스 제국의 안티오코스 1세가 코끼리 부대를 앞세워 이긴 뒤(기원전 275~268년 사이로 연대는 논쟁) 이들은 안키라(앙카라) 둘레에 정착해 갈라티아가 되었다. 기원전 277년 안티고노스 2세 고나타스가 리시마키아에서 켈트를 꺾은 일이 그의 왕위를 굳혔다. 켈트의 침입은 그리스 쪽에 오래가는 공포를 남겼다. 지도는 갈라티아를 기원전 278년부터, 티리스를 279년부터 그리고, 리시마코스 이래 마케도니아가 쥐었던 트라키아 땅을 279년 버전에서 오드리사이 왕국과 티리스에 넘긴다."
