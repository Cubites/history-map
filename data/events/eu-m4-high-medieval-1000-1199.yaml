- id: cilicia-armenia-1080
  year: 1080
  endYear: 1198
  title:
    ko: "킬리키아의 아르메니아: 루벤 1세(1080)에서 레본 2세의 왕관(1198)까지"
  summary:
    ko: "킬리키아의 타우로스 산지에서는 아르메니아 귀족 루벤 1세가 1080년 무렵 독립 영주가 되었다(루벤 가문). 후손은 평야의 마미스트라·아다나·타르수스를 두고 동로마, 안티오크의 십자군, 룸 술탄국(셀주크)과 다투었다. 레본 1세는 1132년 평야를 얻었으나, 1137년 동로마 황제 요안니스 2세가 안티오크 원정길에 킬리키아를 점령해 레본을 콘스탄티노폴리스로 끌고 갔다(1140~1141년 감옥에서 죽음, 자료마다 다르다). 아들 토로스 2세가 1143년 무렵 탈출해 산지를 되찾았고 1151~1152년 평야까지 돌려받았다(지도는 1152년 평야를 킬리키아로 그린다). 1156년 토로스와 르노 드 샤티용(안티오크 공)이 키프로스를 약탈하자 마누일 1세가 1158~1159년 원정으로 토로스를 신하로 삼았다(지도는 1158년 평야를 동로마로). 토로스 2세가 죽은 뒤 아들 루벤 2세(1169~1170)가 잠시 있었고, 토로스의 동생 믈레흐가 1170년 이슬람 군주 누르 앗딘의 도움으로 권력을 잡아 1173년 킬리키아 평야를 차지했으며 1175년 살해되었다(지도는 1173년 평야와 메르신 지역을 킬리키아로 그린다). 신성 로마 황제 프리드리히 1세는 1190년 6월 십자군을 이끌고 킬리키아를 지나다 살레프강에서 익사했다. 루벤 3세(재위 1175~1187)를 거쳐 레본 2세(공 1187~1198, 왕 1198~1219, 왕으로는 레본 1세)는 1198년 1월 6일 타르수스에서 황제 하인리히 6세가 보낸 마인츠 대주교 콘라트의 손으로 왕관을 받아 '킬리키아 아르메니아 왕국'이 되었다. 지도는 킬리키아 아르메니아 공국을 1198년 왕국으로 이름만 바꿔 이어 그린다."
  subjects: [cilicia-principality, cilician-armenia, byzantine-empire, antioch, rum-sultanate, holy-roman-empire]
  links:
    - { from: byzantine-empire, to: cilicia-principality, note: "요안니스 2세의 정복(1137)과 마누일 1세의 원정(1158)" }
  tags: [politics, war]
  sources: ["Claude Mutafian, Le royaume arménien de Cilicie, XIIe–XIVe siècle (1993)", "Steven Runciman, A History of the Crusades, vol. 2: The Kingdom of Jerusalem and the Frankish East, 1100–1187 (1952)", "Paul Magdalino, The Empire of Manuel I Komnenos, 1143–1180 (1993)"]

- id: alexios-komnenos-1081
  year: 1081
  endYear: 1118
  title:
    ko: "알렉시오스 1세 콤네노스와 동로마의 회복: 디라키온(1081), 베네치아 금인칙서(1082), 레보우니온(1091)"
  summary:
    ko: "1081년 4월 알렉시오스 1세 콤네노스가 쿠데타로 제위에 올랐다. 그해 노르만 아풀리아 공작 로베르 기스카르가 아드리아해를 건너와 디라키온을 포위했고, 알렉시오스는 10월 18일 디라키온 앞에서 크게 졌다(바랑인 친위대가 큰 피해를 입었다). 그는 베네치아 함대의 도움을 받는 대가로 1082년 금인칙서를 내려 제국 안의 베네치아 상인에게 관세 면제 같은 특권을 주었다(연대에 이설이 있다). 로베르는 1085년 죽을 때까지 발칸을 노렸고, 알렉시오스는 1081년 룸의 쉴레이만과 드라콘강 경계 조약을 맺어 소아시아의 숨통을 틔웠다(지도는 1085년 안티오크, 1087년 마라시를 동로마에서 덜어 낸다). 도나우 북쪽에서는 페체네그가 1087년부터 트라키아를 휩쓸었으나, 1091년 4월 29일 레보우니온에서 쿠만 동맹군과 함께 이들을 거의 몰살시켰다(안나 콤니니는 포로까지 학살했다고 적는다). 세르비아의 라슈카 대주판 부칸은 1090년 무렵부터 코소보 일대를 습격하다 1093~1094년 화약을 맺었다. 알렉시오스는 1095년 피아첸차에서 교황에게 용병을 청했고 이것이 제1차 십자군으로 이어졌다(뒤의 사건). 1097년 6월 십자군과 함께 니카이아를 되찾고 요안니스 두카스를 시켜 서아나톨리아를 회복했다. 안티오크를 차지한 보에몽에게 1108년 데볼 조약으로 신종을 맺게 했으나 지켜지지 않았다. 1116~1117년 필로멜리온에서 룸의 군대를 꺾었고 1118년 8월 죽었다. 1092년 화폐를 고치고 군역과 맞바꾼 토지 수여(프로노이아)를 늘려 재정과 군사를 다시 세웠다고 본다. 딸 안나 콤니니가 『알렉시아스』를 남겼다."
  subjects: [byzantine-empire, venice, apulia-duchy, rum-sultanate, pecheneg-tribes, cuman-tribes, raska, antioch]
