- id: capetian-france-1031
  year: 1031
  endYear: 1199
  title:
    ko: "카페 왕가의 프랑스: 큰 봉토들 사이의 왕(1031~1199)"
  summary:
    ko: "카페 왕가는 파리와 오를레앙 둘레의 작은 왕령만 직접 다스렸고, 노르망디·앙주·아키텐·플랑드르·툴루즈·샹파뉴 같은 큰 봉토는 거의 독립해 있었다. 앙리 1세(재위 1031~1060)는 1047년 발레스뒤느에서 젊은 노르망디 공작 윌리엄을 도와 반란을 눌렀으나 곧 사이가 틀어져 모르테메르(1054)에서 졌다. 1063년 아키텐 공작 기조프루아(기욤 8세)가 가스코뉴 공국을 합쳤다(지도는 1063년 가스코뉴를 아키텐으로). 필리프 1세(재위 1060~1108)는 윌리엄의 잉글랜드 정복(1066)을 막지 못했다. 1102년 샹파뉴 백작 위그가 '샹파뉴 백작'을 칭하면서 독립 봉토로 굳었다(지도는 1102년). 루이 6세(재위 1108~1137)는 쉬제 수도원장의 도움으로 영주들의 성을 부수고 왕령을 다졌다. 루이 7세(재위 1137~1180)는 1137년 7월 아키텐 공작의 딸 엘레오노르와 혼인해 아키텐을 왕의 땅으로 삼았으나(지도는 1137년), 제2차 십자군(1147~1149) 뒤 사이가 틀어져 1152년 3월 혼인을 무효로 했고 두 달 뒤 엘레오노르가 헨리 플랜태저넷(뒤의 헨리 2세)과 재혼해 아키텐이 앙주 제국에 들어갔다(지도는 1152년에 아키텐을 아키텐 공국으로 따로 그리고 1154년에 잉글랜드 왕의 땅으로 옮긴다). 필리프 2세(재위 1180~1223)는 1180년 이자벨 드 에노와 혼인해 아르투아를 지참금으로 받았고(필리프 달자스가 죽은 1191년 뒤 왕령에 들어감, 지도는 1192년), 1189년 아제르리도 조약으로 헨리 2세가 오베르뉴에 대한 종주권 주장을 포기하고 이수됭·그라세를 넘기게 했다. 리처드 1세가 십자군에 가고 포로로 잡힌 1192~1194년 틈에 노르망디의 벡생을 차지했다. 1196년 리처드의 누이 잔이 툴루즈의 레몽 6세와 혼인하며 아그네를 지참금으로 가져갔다(지도는 1198년). 리처드는 1199년 4월 샬뤼에서 죽었다. 필리프의 노르망디·앙주 정복(1204)은 뒤의 사건으로 이어진다."
  subjects: [france, normandy-duchy, aquitaine, gascony-duchy, anjou, champagne, county-of-toulouse, flanders, england]
