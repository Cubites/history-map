    - { from: rum-sultanate, to: holy-roman-empire, note: "도릴라이온 전투(1147년 10월 25일)" }
  tags: [war, politics]
  sources: ["Jonathan Phillips, The Second Crusade: Extending the Frontiers of Christendom (2007)", "Odo of Deuil, De profectione Ludovici VII in Orientem (Virginia Gingerick Berry 영역, 1948)", "Otto of Freising, The Two Cities (Charles Christopher Mierow 영역, 1928)", "Steven Runciman, A History of the Crusades, vol. 2 (1952)"]
