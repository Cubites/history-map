- id: rum-sultanate-1077
  year: 1077
  endYear: 1192
  title:
    ko: "룸 술탄국의 성장: 쉴레이만(1077)에서 클르츠 아르슬란 2세(1192)까지"
  summary:
    ko: "룸 술탄국(코니아를 중심으로 한 셀주크 왕조)은 쉴레이만 이븐 쿠탈미시가 1075년 니카이아를 차지하고 1077년 술탄을 칭하며 서아나톨리아를 세력권으로 삼으면서 시작되었다. 쉴레이만은 1081년 알렉시오스 1세와 드라콘강 경계 조약을 맺었고 1084년 안티오크를 차지했으나 1086년 시리아에서 죽었다. 클르츠 아르슬란 1세(재위 1092~1107)는 니카이아를 도읍으로 삼았다가 1097년 6월 제1차 십자군과 동로마에 니카이아를 잃고, 7월 1일 도릴라이온 전투에서 지자 코니아로 옮겼다. 1101년 새로 온 십자군은 다니슈멘드와 함께 꺾었다. 동쪽의 다니슈멘드 베이국(시바스·토카트)은 1100년 안티오크의 보에몽을 사로잡을 만큼 강했고 1103년(1102년설도 있다) 말라티아도 차지했다. 말리크 샤(재위 1107~1116)를 거쳐 마수드 1세(재위 1116~1156)는 1147년 10월 제2차 십자군의 독일군을 도릴라이온에서 꺾었다. 클르츠 아르슬란 2세(재위 1156~1192)는 1176년 9월 17일 미리오케팔론의 산악 고개에서 마누일 1세의 동로마군을 크게 물리쳤고, 다니슈멘드의 시바스(1175)와 말라티아(1178)를 차지해 하나로 합쳤으며(지도는 1175·1178년 버전), 1182년 코티아이온과 소조폴리스를 얻었다. 1190년 5월 18일 신성 로마 황제 프리드리히 1세의 십자군이 코니아 앞에서 룸군을 쳐 코니아를 차지했으나 곧 물러났다. 클르츠 아르슬란 2세는 1192년 죽으면서 땅을 아들들에게 나눠 내전이 일어났다."
  subjects: [rum-sultanate, danishmendids, byzantine-empire, antioch, holy-roman-empire]
  links:
    - { from: rum-sultanate, to: byzantine-empire, note: "미리오케팔론 전투(1176)와 코티아이온·소조폴리스 점령(1182)" }
    - { from: rum-sultanate, to: danishmendids, note: "시바스(1175)와 말라티아(1178) 병합" }
  tags: [war, politics]
  sources: ["Claude Cahen, Pre-Ottoman Turkey: A General Survey of the Material and Spiritual Culture and History c. 1071–1330 (1968)", "Speros Vryonis, The Decline of Medieval Hellenism in Asia Minor and the Process of Islamization from the Eleventh through the Fifteenth Century (1971)", "Michael Angold, The Byzantine Empire, 1025–1204: A Political History (2판, 1997)", "Paul Magdalino, The Empire of Manuel I Komnenos, 1143–1180 (1993)"]
