- id: barbarossa-1152
  year: 1152
  endYear: 1190
  title:
    ko: "프리드리히 1세 바르바로사: 레냐노(1176), 콘스탄츠 화약(1183)과 하인리히 사자공의 몰락(1180)"
  summary:
    ko: "1152년 호엔슈타우펜 가문의 프리드리히 1세 바르바로사('붉은 수염')가 독일 왕으로 뽑혔다. 그는 1154~1155년 첫 이탈리아 원정에서 1155년 6월 교황 하드리아누스 4세에게 황제로 대관받았고, 1158년 론칼리아 제국 회의에서 롬바르디아 도시들의 황제 권리(레갈리아)를 되찾으려 했다. 1159년 교회가 알렉산데르 3세와 황제가 지지한 대립교황 빅토르 4세로 갈라졌다. 1162년 밀라노를 허물었다. 1167년 봄 도시들이 롬바르디아 동맹을 맺었고 그해 여름 로마에서 전염병이 제국군을 휩쓸었다. 1176년 5월 29일 레냐노에서 동맹군이 황제의 군대를 이기자 황제는 1177년 베네치아 화약으로 알렉산데르 3세를 인정했고, 1183년 6월 25일 콘스탄츠 화약으로 도시들의 자치를 인정하고 충성 서약과 세금을 받았다. 1156년 소특권장으로 오스트리아가 공국이 되었고 바이에른은 하인리히 사자공이 받았다. 사자공은 1176년 키아벤나에서 이탈리아 원정에 군대를 보내라는 황제의 요청을 거절했다고 전하며, 제후들의 소송 끝에 1180년 4월 겔른하우젠에서 작센과 바이에른 공작령을 빼앗겼다(바이에른은 비텔스바흐 가문 오토에게 갔고 슈타이어마르크는 공국으로 갈라졌다). 사자공은 1181년 에르푸르트에서 항복하고 잉글랜드로 떠났다. 1186년 아들 하인리히 6세가 시칠리아의 콘스탄체와 혼인했다(앞의 사건). 1189년 십자군을 이끌고 떠난 황제는 1190년 6월 10일 소아시아 살레프강에서 익사했다(뒤의 사건)."
  subjects: [holy-roman-empire, papal-states, italian-minor-states, venice, sicily-kingdom]
  links:
    - { from: holy-roman-empire, to: italian-minor-states, note: "롬바르디아 원정(1154~1186)" }
    - { from: italian-minor-states, to: holy-roman-empire, note: "레냐노 전투(1176)와 콘스탄츠 화약(1183)" }
  tags: [politics, war]
  sources: ["John B. Freed, Frederick Barbarossa: The Prince and the Myth (2016)", "Peter Munz, Frederick Barbarossa: A Study in Medieval Politics (1969)", "Karl Jordan, Henry the Lion: A Biography (P. S. Falla 영역, 1986)", "Benjamin Arnold, Medieval Germany, 500–1300: A Political Interpretation (1997)"]
