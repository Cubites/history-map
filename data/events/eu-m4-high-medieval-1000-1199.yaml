- id: schism-1054
  year: 1054
  title:
    ko: "동서 교회 분열(1054)"
  summary:
    ko: "1054년 7월 16일 교황 레오 9세의 사절 훔베르트 추기경이 콘스탄티노폴리스 하기아 소피아의 제단에 총대주교 미하일 케룰라리오스를 파문하는 교서를 놓았다. 갈등은 몇 해 전부터 쌓였다. 라틴 교회는 누룩 없는 빵을 성체에 쓰고 성령이 성부와 성자에게서 나온다는 '필리오케'를 신경에 넣었으며 로마 주교가 모든 교회 위에 있다고 주장했다. 동방 교회는 누룩 든 빵을 쓰고 총대주교들이 함께 이끄는 것을 중시했다. 남이탈리아의 노르만 아풀리아 공국에 맞서 교황과 동로마 황제 콘스탄티노스 9세 모노마코스는 손잡으려 했으나(앞의 사건), 케룰라리오스는 1053년 콘스탄티노폴리스의 라틴 교회들을 닫았다. 레오 9세는 1054년 4월 죽었고 협상에 실패한 사절들이 파문장을 놓고 떠나자, 케룰라리오스는 7월 20일에서 24일 사이(날짜는 자료마다 다르다) 공의회에서 그 사절들을 파문했다(교황이나 서방 교회 전체가 아니라 사절을 겨냥한 것이다). 당시 사람들은 이것을 두 교회의 결정적 결별로 느끼지 않았고, 서방 십자군이 쌓은 불신, 특히 1204년 콘스탄티노폴리스 약탈이 단절을 굳혔다고 본다. 1965년 12월 7일 교황 바오로 6세와 총대주교 아테나고라스가 1054년의 서로의 파문을 취소했다."
  subjects: [byzantine-empire, papal-states, apulia-duchy]
  links:
