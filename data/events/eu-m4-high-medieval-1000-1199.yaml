- id: arles-burgundy-1003
  year: 1003
  endYear: 1034
  title:
    ko: "아를(부르군트) 왕국의 분해와 신성 로마 제국 편입: 사보이아·도피네·프로방스"
  summary:
    ko: "부르군트 왕국(아를 왕국, 론강 유역에서 알프스 서쪽·프로방스까지)의 루돌프 3세(재위 993~1032)는 힘이 약해 지방 영주들을 누르지 못했다. 사보이아에서는 모리엔·샤블레를 모은 움베르토 1세 비앙카마노가 1003년 무렵 기록에 처음 나오고, 비엔누아(도피네)에서는 알봉의 백작 귀그 1세가 땅을 모았으며, 프로방스에서는 보소 가문이 후작령을 다스렸다. 자식이 없던 루돌프는 조카인 독일 왕 하인리히 2세를 후계자로 삼았고(1006년 바젤 회견, 1016년 확인), 하인리히가 죽자(1024) 새 독일 왕 콘라트 2세가 같은 권리를 이었다(콘라트의 아내 기젤라는 루돌프의 조카딸이다). 루돌프가 1032년 9월 죽자 블루아의 오도 2세가 왕위를 노렸으나, 콘라트 2세가 1033년 2월 파이에른에서 부르군트 왕으로 대관하고 오도를 물리쳐 1034년 제네바에서 귀족들의 충성을 받았다. 그 뒤 아를 왕국은 이름만 신성 로마 제국의 구성 왕국으로 남고 실제 정치는 프로방스 백국, 도피네, 사보이아, 프랑슈콩테 같은 지방 단위로 돌아갔다. 지도는 1033년에 부르군트 왕국을 없애고 이 땅을 프로방스 백국(보소 가문)·도피네·사보이아 백국·제국으로 나눠 그린다."
  subjects: [burgundy-kingdom, holy-roman-empire, savoy-county, dauphine, provence-early]
  links:
