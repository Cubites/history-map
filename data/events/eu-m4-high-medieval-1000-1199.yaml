  sources: ["Eric Christiansen, The Northern Crusades (2판, 1997)", "Karl Jordan, Henry the Lion: A Biography (P. S. Falla 영역, 1986)", "Helmold of Bosau, The Chronicle of the Slavs (Francis Joseph Tschan 영역, 1935)", "Saxo Grammaticus, Gesta Danorum: The History of the Danes (Peter Fisher 영역, 2015)"]
