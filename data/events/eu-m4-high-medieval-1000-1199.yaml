- id: ireland-normans-1166
  year: 1166
  endYear: 1185
  title:
    ko: "노르만의 아일랜드 진출: 디아르마이트의 도움 요청(1166)에서 아일랜드 영주령(1177)까지"
  summary:
    ko: "렌스터 왕 디아르마이트 맥 머로가 1166년 아일랜드 대왕 루아이드리 우아 콘호바이르와 브레프니의 티게르난 우아 루아이르크에게 쫓겨나 잉글랜드 왕 헨리 2세에게 도움을 청했다. 헨리는 군사 모집을 허락했고, 웨일스 변경의 노르만 기사들이 1169년 5월 배너 만에 상륙해 웩스퍼드를 얻었다. 1170년 펨브룩 백작 리처드 드 클레어(스트롱보우)가 8월 23일 상륙해 워터퍼드를 차지하고 디아르마이트의 딸 아오이페와 혼인했으며 9월 더블린을 얻었다. 디아르마이트가 1171년 5월 죽자 렌스터는 스트롱보우가 이었다. 헨리 2세는 신하가 독립 세력이 되는 것을 막으려 1171년 10월 17일 워터퍼드에 상륙해 아일랜드 왕과 영주 대부분의 신종을 받았다(더블린에서 겨울을 나고 이듬해 캐셜 교회 회의가 열렸다). 교황 하드리아누스 4세가 1155년 아일랜드 정복을 허락했다는 교서 '라우다빌리테르'는 진위 논쟁이 있다. 1175년 윈저 조약은 루아이드리를 코노트의 왕으로 인정하는 대신 공납을 정했으나 곧 깨졌다. 1177년 헨리가 아들 존에게 '아일랜드 영주' 칭호를 주고, 존 드 쿠르시가 얼스터 동부를, 마일스 드 코건과 로버트 피츠스티븐이 함께 데스먼드(코크 왕국)를 받았다. 1185년 존이 직접 건너왔으나 현지 영주들을 거스르고 돌아갔다. 지도는 1171년 아일랜드 왕국들을 아일랜드 영주령(렌스터·미스·더블린·워터퍼드)과 게일 영주들로 가르고, 1177년 얼스터 동부와 남부 먼스터를, 1185년 티퍼레리를 영주령으로 더한다. 아일랜드 왕들이 서로 다투던 틈을 노르만이 파고들었고 정복은 부분적이어서 게일 영주들이 많은 땅을 지켰다."
  subjects: [irish-kingdoms, lordship-of-ireland, gaelic-irish-lordships, england, welsh-principalities, papal-states]
