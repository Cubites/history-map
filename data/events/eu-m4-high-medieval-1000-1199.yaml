- id: iberia-sancho-ferdinand-1035
  year: 1035
  endYear: 1072
  title:
    ko: "산초 3세의 유증(1035)에서 산초 2세의 죽음(1072)까지: 나바라·아라곤·카스티야·레온과 타이파의 공물"
  summary:
    ko: "나바라의 산초 3세 대왕(재위 1004~1035)은 나바라에 더해 카스티야(백작 가르시아가 1029년 레온에서 살해된 뒤)와 아라곤·소브라르베·리바고르사까지 차지했다. 1035년 그가 죽자 아들들이 나눠 가졌다. 가르시아 3세는 나바라를, 페르난도는 카스티야를, 라미로 1세는 아라곤을 받아 아라곤이 왕국이 되었다(지도는 아라곤 왕국을 1035년부터 따로 그린다). 페르난도 1세는 1037년 9월 타마론 전투에서 처남인 레온 왕 베르무도 3세를 죽이고 아내 산차를 통해 레온 왕까지 되었으며, 1054년 아타푸에르카에서 형 가르시아 3세를 죽였다. 그는 1057~1064년 라메구·비제우·코임브라를 차지하고, 사라고사·톨레도·세비야·바다호스의 타이파들에게 공물(파리아)을 받았다. 1063년 라미로 1세가 그라우스에서 죽자 아라곤은 산초 라미레스가 이었다. 1065년 12월 페르난도가 죽자 아들 산초 2세는 카스티야를, 알폰소 6세는 레온을, 가르시아는 갈리시아를 받았다(지도는 갈리시아 왕국을 따로 그리지 않고 레온 땅으로 두며 카스티야는 1065년부터 왕국으로 그린다). 산초 2세는 형제들과 싸우다 1072년 10월 사모라를 포위하던 중 암살되었다. 남쪽에서는 후우마이야 칼리프국의 뒤를 이은 타이파들이 서로 다투며 북쪽 왕들에게 공물을 바쳤고, 사하라 남쪽에서는 1040년대 알모라비드 운동이 일어나 훗날 그 타이파들을 삼켰다(지도는 이베리아의 알모라비드 항목을 1040년부터 두되 땅은 1090년대부터 그린다)."
  subjects: [navarre, aragon-early, castile-county, castile-early, leon, taifas-first, almoravids]
  links:
    - { from: castile-county, to: leon, note: "타마론 전투(1037): 페르난도 1세의 레온 왕위" }
