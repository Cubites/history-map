- id: investiture-1075
  year: 1075
  endYear: 1125
  title:
    ko: "서임권 투쟁: 카노사(1077)에서 보름스 협약(1122)까지"
  summary:
    ko: "교황 그레고리우스 7세(재위 1073~1085)는 1075년 교황이 주교를 임명하고 황제도 폐위할 수 있다는 훈령('교황 훈령', Dictatus papae)을 적었고, 독일 왕 하인리히 4세(재위 1056~1106, 1084년 황제 대관)가 밀라노 대주교를 직접 임명하자 1076년 2월 그를 파문하며 신하들의 충성 맹세를 풀어 주었다. 독일 제후들이 1년 안에 풀려나지 못하면 폐위하겠다고 나서자, 하인리히는 한겨울 알프스를 넘어 토스카나의 마틸데(1046~1115)의 성 카노사에서 1077년 1월 25~28일 맨발로 참회해 사면받았다. 제후들은 반왕 루돌프를 세웠고, 1080년 그레고리우스가 하인리히를 다시 파문하자 하인리히는 대립교황 클레멘스 3세를 세워 1084년 로마에서 황제로 대관했다. 그레고리우스를 구하러 온 로베르 기스카르의 노르만군은 로마를 약탈했고(1084), 그레고리우스는 살레르노로 물러나 1085년 죽었다. 하인리히 4세는 아들들의 반란으로 1105년 물러나 1106년 죽었다. 잉글랜드와 프랑스에서는 비교적 타협으로 풀려(잉글랜드의 런던 협약, 1107) 갈등이 길지 않았다. 하인리히 5세와 교황 칼릭스투스 2세는 1122년 9월 23일 보름스 협약을 맺었다. 황제는 반지와 지팡이로 주교를 임명하는 서임을 포기했고, 독일에서는 황제 앞에서 선거하고 홀(笏)로 봉토를 받으며 이탈리아·부르군트에서는 6개월 안에 봉토를 받기로 했다. 1123년 제1차 라테란 공의회가 이를 확인했다. 하인리히 5세는 1125년 5월 아들 없이 죽어 잘리어 왕조가 끝났고 로타르 3세가 뽑혔다. 마틸데는 땅을 교황청에 남겼고 그 땅에서 피렌체가 1115년, 시에나가 1125년 지도에 코무네로 나타난다."
  subjects: [holy-roman-empire, papal-states, italian-minor-states, apulia-duchy, england, france, florence, siena]
  links:
    - { from: papal-states, to: holy-roman-empire, note: "하인리히 4세의 파문(1076·1080)" }
    - { from: holy-roman-empire, to: papal-states, note: "카노사의 참회(1077)와 보름스 협약(1122)" }
  tags: [politics, society]
  sources: ["I. S. Robinson, Henry IV of Germany, 1056–1106 (1999)", "H. E. J. Cowdrey, Pope Gregory VII, 1073–1085 (1998)", "Colin Morris, The Papal Monarchy: The Western Church from 1050 to 1250 (1989)", "Gerd Althoff, Heinrich IV. (2006)"]
