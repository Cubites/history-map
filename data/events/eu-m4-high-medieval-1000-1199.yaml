  sources: ["Amira K. Bennison, The Almoravid and Almohad Empires (2016)", "Maribel Fierro, The Almohad Revolution: Politics and Religion in the Islamic West during the Twelfth–Thirteenth Centuries (2012)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)", "Joseph F. O'Callaghan, A History of Medieval Spain (1975)"]
