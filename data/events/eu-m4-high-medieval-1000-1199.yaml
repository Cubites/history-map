- id: manuel-komnenos-1143
  year: 1143
  endYear: 1180
  title:
    ko: "마누일 1세 콤네노스의 동로마: 시르미움(1167)과 미리오케팔론(1176)"
  summary:
    ko: "마누일 1세 콤네노스(재위 1143~1180)는 서쪽과 동쪽에서 동시에 싸웠다. 1146년 독일 왕 콘라트 3세의 아내 게르트루트의 자매 베르타(폰 줄츠바흐)와 혼인하고, 1148년 로제르 2세에 맞선 군사 동맹을 맺어 1149년 로제르에게 빼앗긴 코르푸를 되찾았다. 1155~1158년 이탈리아 원정(안코나, 아풀리아)은 처음엔 성과를 냈으나 1156년 브린디시에서 시칠리아의 노르만군에게 졌다. 헝가리와 오래 싸워 1167년 시르미움(젬룬) 전투에서 이겨 달마티아·보스니아·스렘을 얻었다(지도는 1167년 베오그라드·스렘과 달마티아를 헝가리에서 동로마로 옮기고, 관계로는 보스니아 바나트를 1167~1179년 동로마의 신하로 둔다). 콘스탄티노폴리스에서 자란 헝가리의 벨러 3세가 1172년 즉위했고, 마누일이 죽자 1180년 달마티아와 스렘을 되찾았다(지도는 1180년 버전). 세르비아(라슈카)의 스테판 네마냐는 1172년 마누일에게 신종했다. 동쪽에서는 킬리키아의 토로스를 누르고 1159년 안티오크에 들어갔고(앞의 사건), 1169년 예루살렘 왕과 이집트를 치려다 실패했다. 1171년 3월 제국 안의 모든 베네치아인을 체포하고 재산을 몰수해 베네치아와 오래 갈라섰다. 1176년 9월 17일 미리오케팔론 고개에서 룸의 클르츠 아르슬란 2세에게 대패했다(위치는 불확실하며 마누일은 이를 만지케르트에 견주었다). 클르츠 아르슬란은 도릴라이온과 숩라이온 요새를 허물라는 조건으로 화약했다(마누일은 숩라이온만 허물었다고 전한다). 마누일이 1180년 9월 24일 죽자 어린 알렉시오스 2세 아래 섭정 다툼이 일었고, 1182년 4월 안드로니코스 1세가 수도를 장악하는 과정에서 군중이 콘스탄티노폴리스의 라틴 상인들을 학살했다. 안드로니코스는 1183년 공동 황제가 되어 1185년까지 다스렸다(지도는 1182년 코티아이온과 소조폴리스를 룸에 넘긴다)."
  subjects: [byzantine-empire, hungary-kingdom, bosnian-banate, raska, serbia-grand-principality, rum-sultanate, venice, sicily-kingdom, holy-roman-empire, antioch, cilicia-principality]
