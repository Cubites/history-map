- id: balkan-independence-1166
  year: 1166
  endYear: 1197
  title:
    ko: "발칸의 독립: 스테판 네마냐의 세르비아(1166~)와 아센·페타르의 불가리아(1185)"
  summary:
    ko: "동로마 황제 마누일 1세 아래 있던 세르비아에서는 라슈카의 스테판 네마냐가 1166년 무렵 형제들을 누르고 대주판(대공)이 되었다(지도는 1166년 라슈카를 세르비아 대공국으로 이름만 바꾼다). 그는 1172년 마누일에게 신종했으나 마누일이 죽은 1180년 뒤 독립해 1183년 헝가리의 벨러 3세와 손잡고 니시를 쳤고 1186년 무렵 두클랴(제타)를 차지했다(지도는 1186년 두클랴 땅을 세르비아로). 1189년 니시에서 프리드리히 1세 바르바로사를 만나 동맹을 청했고, 1190~1191년 이사키오스 2세 안겔로스에게 남모라바에서 져 화약하되 얻은 땅의 상당 부분을 지켰다(지도는 1190년 남모라바와 코소보를 세르비아로). 1196년 아들 스테판에게 자리를 물려주고 수도사가 되었다. 불가리아에서는 1185년 이사키오스 2세가 혼인 비용으로 세금을 거두자 아센·페타르 형제(이반 아센 1세와 테오도르, 뒤의 페타르 4세)가 터르노보에서 봉기해 10월 26일 성 데메트리오스 교회를 봉헌하며 독립을 선언했다. 같은 해 8월 시칠리아의 윌리엄 2세의 군대가 테살로니키를 함락해 약탈했고 안드로니코스 1세는 9월 군중에게 죽었다. 이사키오스 2세는 1187년 로베치 휴전으로 사실상 불가리아를 인정했으며, 아센·페타르는 쿠만의 도움을 받아 1190년 트랴브나 고개에서 동로마군을 꺾었다. 1195년 알렉시오스 3세가 이사키오스를 폐위한 뒤에도 불가리아는 소피아와 자고라 쪽으로 넓어졌다(지도는 1195년). 이반 아센 1세는 1196년 암살되었고 페타르가 다시 다스리다 1197년 죽은 뒤 막내 동생 칼로얀이 이었다(뒤의 사건). 지도는 도브루자 일대도 1185년부터 불가리아 땅으로 그린다."
  subjects: [serbia-grand-principality, duklja, byzantine-empire, bulgaria-second, hungary-kingdom, cuman-tribes, sicily-kingdom, holy-roman-empire]
  links:
    - { from: byzantine-empire, to: bulgaria-second, note: "아센·페타르의 봉기(1185)와 로베치 휴전(1187)" }
