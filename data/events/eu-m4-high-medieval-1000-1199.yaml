- id: norman-conquest-1066
  year: 1066
  endYear: 1087
  title:
    ko: "노르만 정복: 스탬퍼드 브리지·헤이스팅스(1066)와 북부 약탈, 둠즈데이 북(1086)"
  summary:
    ko: "1066년 1월 참회왕 에드워드가 죽자 해럴드 2세 고드윈슨이 왕이 되었고, 노르망디 공작 윌리엄과 노르웨이 왕 하랄 3세(하르드라다)가 왕위를 주장했다. 추방된 해럴드의 동생 토스티그와 손잡은 하랄은 9월 20일 풀퍼드에서 북부 백작들을 이기고 요크로 갔으나, 9월 25일 스탬퍼드 브리지에서 해럴드에게 져 하랄과 토스티그가 죽었다. 사흘 뒤 윌리엄이 남쪽 페븐지에 상륙했고, 해럴드가 급히 내려와 10월 14일 헤이스팅스에서 맞섰으나 전사했다. 윌리엄 1세는 크리스마스에 웨스트민스터에서 대관했다. 그는 잉글랜드 곳곳의 반란(1067~1070)을 성채와 노르만 영주로 누르고, 웨일스 변경에도 영주들을 세웠다. 1069년 요크의 반란에 덴마크 함대가 끼어들자 이를 진압하고 1069~1070년 겨울 요크셔에서 더럼까지 농토를 불태웠다(북부 약탈, 주어는 윌리엄의 군대). 둠즈데이 북은 이 땅 상당수를 '황폐'했다고 적는다. 연대기 작가 오데릭 비탈리스는 10만 명이 굶어 죽었다고 하나 과장으로 보며, 인구가 크게 줄었다는 것 말고 수는 알 수 없다. 스코틀랜드의 맬컴 3세는 1072년 윌리엄에게 신종했다. 윌리엄은 1085년 말 전국 토지를 조사시켜 1086년 둠즈데이 북을 만들었고, 8월 1일 솔즈베리에서 모든 영주에게 직접 충성을 맹세시켰다. 영주층과 주교는 대부분 노르만·프랑스계로 바뀌었다. 윌리엄은 1087년 9월 9일 루앙 근처에서 죽었다. 지도는 윌리엄이 잉글랜드 왕이 된 1066년부터 노르망디를 잉글랜드 색으로 그리고 1087년에 다시 나눈다."
