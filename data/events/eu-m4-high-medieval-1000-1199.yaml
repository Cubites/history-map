- id: sicily-kingdom-1127
  year: 1127
  endYear: 1198
  title:
    ko: "시칠리아 왕국: 로제르 2세의 대관(1130)에서 하인리히 6세의 정복(1194)까지"
  summary:
    ko: "아풀리아 공작 윌리엄 2세가 1127년 후계 없이 죽자 시칠리아 백작 로제르 2세가 아풀리아·칼라브리아 공작령을 차지했다(지도는 1128년 아풀리아 공국을 시칠리아 땅으로 합친다). 1130년 12월 25일 대립교황 아나클레투스 2세가 준 왕관으로 팔레르모에서 대관했고, 정통 교황 인노첸시오 2세와 독일 왕 로타르 3세(1133년부터 황제)에 맞서 싸웠고 1132년 7월 노체라에서 반란 영주들에게 크게 졌다. 1139년 7월 갈루치오에서 인노첸시오를 사로잡아 미냐노 조약으로 왕위를 인정받았고, 1140년까지 나폴리·카푸아와 아브루초를 차지해 롬바르드 공국들이 끝났다. 아랍·그리스·라틴 문화가 함께한 왕국에서 알이드리시의 지리서(1154)와 팔라티나 예배당이 나왔고, 로제르는 1146~1148년 북아프리카의 트리폴리·마디아와 동로마의 코르푸·테바이(1147)에 원정했다. 로제르가 1154년 죽자 윌리엄 1세(재위 1154~1166), 윌리엄 2세(재위 1166~1189)가 이었고, 윌리엄 2세가 후계 없이 죽자 로제르의 딸 콘스탄체의 남편 하인리히 6세와 서자 계통의 탕크레디가 맞섰고 탕크레디가 1190년 즉위했다. 하인리히는 1191년 나폴리를 포위했다가 전염병으로 물러났다. 1192년 말 귀환길의 잉글랜드 왕 리처드 1세가 오스트리아 공작 레오폴트 5세에게 잡혀 하인리히에게 넘겨졌고, 몸값 15만 마르크(1194년 2월 풀려남)가 하인리히의 정복 자금이 되었다. 탕크레디가 1194년 2월 죽어 어린 아들 윌리엄 3세가 잠시 왕이 되었으나, 하인리히는 그해 팔레르모에 들어가 크리스마스에 시칠리아 왕으로 대관했고, 다음 날 아들 프리드리히(뒤의 프리드리히 2세)가 태어났다. 이어 탕크레디의 가족을 가혹하게 다루었다. 하인리히가 1197년 9월 죽자 콘스탄체가 섭정했고 1198년 교황 인노첸시오 3세가 후견인이 되었다. 같은 해 교황령은 안코나와 스폴레토를 되찾았다(지도는 1198년 교황령 버전)."
