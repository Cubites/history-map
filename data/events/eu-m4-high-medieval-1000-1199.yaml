- id: scholasticism-universities-1088
  year: 1088
  endYear: 1200
  title:
    ko: "대학과 스콜라 철학의 탄생: 볼로냐·파리·옥스퍼드, 안셀무스와 아벨라르"
  summary:
    ko: "11세기 말~12세기 유럽에서는 도시의 성당 학교와 법학·신학 선생들을 둘러싸고 학생이 모여 대학이 생겼다. 볼로냐에서는 이르네리우스 같은 법학자들이 로마법 대전을 주해했고, 그라티아누스가 1140년 무렵 『교령집』(교회법 모순 조화집)을 엮었다. 볼로냐 대학의 시작으로 알려진 1088년은 19세기에 정한 기념 연도이며 실제 조직은 12세기에 서서히 갖춰졌다. 1158년 론칼리아 회의에서 프리드리히 1세는 '아우텐티카 하비타'로 학생들에게 특권을 주었다. 파리에서는 노트르담 성당 학교를 중심으로 아벨라르(1079~1142)가 『긍정과 부정』에서 교부들의 엇갈리는 말을 논리로 가리는 방법을 보여 주었고, 1118년 엘로이즈의 숙부 풀베르가 보낸 이들에게 거세당했으며, 1121년 수아송 공의회에서, 1141년에는 상스 공의회에서 베르나르의 반대로 단죄되었다. 안셀무스(1033~1109, 1093년 캔터베리 대주교)는 『프로슬로기온』에서 신 존재 논증을 폈다. 페트루스 롬바르두스의 『명제집』(1150년대)은 신학 교재가 되었다. 카스티야의 톨레도에서는 크레모나의 제라르드 등이 아랍어 책을 라틴어로 옮겨 아리스토텔레스와 아랍 학문이 들어왔다. 옥스퍼드는 1167년 잉글랜드 왕 헨리 2세가 학생의 프랑스 유학을 막으면서 학생이 모였다고 전한다. 1200년 필리프 2세는 파리 학생과 시민의 충돌을 계기로 학생과 선생의 특권을 허가했다."
  subjects: [italian-minor-states, holy-roman-empire, france, england, castile-early]
  tags: [culture]
  sources: ["Charles Homer Haskins, The Renaissance of the Twelfth Century (1927)", "Hastings Rashdall, The Universities of Europe in the Middle Ages (Powicke·Emden 엮음, 1936)", "Walter Rüegg 엮음, A History of the University in Europe, vol. 1: Universities in the Middle Ages (1992)", "R. W. Southern, Saint Anselm: A Portrait in a Landscape (1990)"]

- id: georgia-david-1089
  year: 1089
  endYear: 1195
  title:
    ko: "조지아의 도약: 다비트 4세 건설자(1089~1125)에서 타마르(1184~)의 샤므코르(1195)까지"
  summary:
    ko: "1070~1080년대 셀주크의 침입으로 조지아 왕국은 큰 피해를 입었고, 기오르기 2세는 말리크 샤에게 공물을 바쳤다. 1089년 열여섯 살의 다비트 4세(건설자)가 왕위를 이어받아 1099년 무렵 공물을 끊었다. 1104~1105년 카헤티-헤레티 왕국을 합쳐 동부를 통일했고(지도는 1105년), 1118년 로리의 아르메니아 왕국(타시르-조라게트)을 합쳤다. 1118년 이후 킵차크(쿠만) 약 4만 가구(약 20만 명이라 전하나 과장일 수 있다)를 정착시켜 상비군(4만 안팎이라 전한다)을 새로 만들었다. 1121년 8월 12일 디드고리 전투에서 이슬람 영주들의 연합군을 크게 이겼다(이슬람 쪽 병력을 연대기는 수십만 명이라 하나 과장이며 조지아군은 5만 6천 명 안팎이라 전한다). 1122년 트빌리시를 얻어 도읍으로 삼았다. 다비트는 1125년 죽었고, 데메트레 1세와 기오르기 3세(재위 1156~1184, 그 사이 다비트 5세가 1155년 몇 달 있었다)를 거쳐 1184년 기오르기 3세의 딸 타마르가 즉위했다(1178년부터 공동 통치). 아르메니아 시우니크 왕국은 1170년 셀주크 계열 세력에게 바게베르드 성을 잃고 끝났다(지도는 1171년 버전). 조지아 왕국은 아르메니아 귀족(자카리 가문)의 도움으로 북아르메니아로 나아갔고, 타마르 때인 1195년 샤므코르에서 아타벡 아부 바크르의 군대를 꺾었다."
  subjects: [georgia-kingdom, kakheti-hereti, armenian-kingdoms, cuman-tribes]
  links:
    - { from: georgia-kingdom, to: kakheti-hereti, note: "다비트 4세의 카헤티 병합(1104~1105)" }
    - { from: georgia-kingdom, to: armenian-kingdoms, note: "로리 병합(1118)" }
  tags: [war, politics]
  sources: ["Donald Rayfield, Edge of Empires: A History of Georgia (2012)", "Ronald Grigor Suny, The Making of the Georgian Nation (2판, 1994)", "Antony Eastmond, Royal Imagery in Medieval Georgia (1998)"]
