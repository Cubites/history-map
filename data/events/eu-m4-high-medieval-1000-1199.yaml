# 유럽 중세 사건 4차 묶음: 바실리오스 2세에서 제3차 십자군·이고리 원정까지 (1000 ~ 1199, 작업 EVM4)
# 범위: 바실리오스 2세의 불가리아 정복과 캅카스, 크누트의 북해 제국, 노르만 정복과 앙주 제국(무정부 시대·베킷·아일랜드), 카페 왕가의 프랑스, 아를 왕국의 분해, 폴란드(그니에즈노·카지미에시 1세·볼레스와프 3세의 분열),
#   헝가리(이슈트반 1세·크로아티아 동군)와 보헤미아의 왕관, 서임권 투쟁과 바르바로사, 노르만 남이탈리아·시칠리아 정복과 시칠리아 왕국, 동서 교회 분열, 만지케르트·룸 술탄국·콤네노스의 회복(알렉시오스 1세·마누일 1세),
#   킬리키아 아르메니아, 제1~3차 십자군과 십자군 국가·라인란트와 요크의 유대인 학살·벤드 십자군, 후우마이야 칼리프국의 해체와 타이파·톨레도·알모라비드·알모하드·포르투갈·아라곤-바르셀로나·카스티야와 레온의 분리,
#   조지아의 다비트 4세, 세르비아의 네마냐와 불가리아 제2제국, 키예프 루스(야로슬라프·모노마흐·분열)·노브고로드·안드레이 보골륩스키·이고리 원정과 갈리치아-볼히니아, 내전기 노르웨이·스웨덴·덴마크, 볼로냐·파리 대학과 스콜라 철학.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 1000~1199년 지도에서 생기거나 끝난 항목(헝가리 왕국·마자르 공국 1000, 사보이아 1003, 제노바 1005, 조지아 왕국 1008, 불가리아 제1제국 1018, 폴란드 왕국 1025, 타이파 1031, 부르군트 왕국 1033,
#   아라곤 1035, 알모라비드 1040, 아풀리아 공국 1042, 쿠만 1055, 가스코뉴 1063, 카스티야 1065, 룸 술탄국 1077, 킬리키아 1080, 포르투갈 백국 1096, 안티오크·에데사 1098, 샹파뉴·크로아티아 1102, 프로방스(바르셀로나 가문) 1112, 피렌체 1115,
#   시에나 1125, 시칠리아 왕국 1130, 루스 공국들 1132, 노브고로드 1136, 폴란드 공국들 1138, 포르투갈 1139, 제2차 타이파 1145, 알모하드 1147, 노르망디·아키텐·앙주 1154, 아라곤 연합 왕국 1164, 세르비아 1166, 아일랜드 영주령 1171,
#   불가리아 제2제국 1185, 키프로스 1192, 보헤미아 왕국 1198, 갈리치아-볼히니아 1199 등)를 모두 subjects로 이음(docs/REGION_GUIDE.md §5, 점검 방식은 EVM1~EVM3의 성립·소멸 점검과 같음). 지도의 큰 변화(1만 km² 넘는 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 바실리오스 2세의 불가리아 정복 완료(1018)와 고려의 귀주 대첩(`gwiju-1019`, 고려와 요를 subjects로), 제2차 십자군 소식의 '사제왕 요한'과 요의 멸망(`liao-falls-1125`)·서요·금(금을 subjects로).
#   04번 고려 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 6~10일 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 사료와 표준 개설서(한국어 번역본이 확인된 것만 번역본으로). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: basil-ii-1000
  year: 1000
  endYear: 1022
  title:
    ko: "바실리오스 2세의 정복: 불가리아 제1제국의 끝(1018)과 캅카스"
  summary:
    ko: "동로마 황제 바실리오스 2세(재위 976~1025)는 사무일(재위 997 무렵~1014)이 이끈 불가리아 제1제국을 오래 쳤다. 1001년 베로이아와 세르비아(그리스 쪽 도시 Servia, 오늘의 세르비아 나라와 다름), 1002년 비딘, 1004년 스코페를 얻었고 1005년 디라키온이 돌아왔다. 1014년 7월 29일 클레이디온 고개에서 불가리아군을 크게 이겨, 사로잡은 병사들을 눈멀게 하고 백 명마다 한쪽 눈만 상한 길잡이를 붙여 돌려보냈다고 한다(1만 4천~1만 5천 명으로 전하나 과장일 수 있다). 사무일은 그해 10월에 죽었고, 아들 가브릴 라도미르(재위 1014~1015)에 이어 그를 죽이고 오른 사촌 이반 블라디슬라프(재위 1015~1018)가 1018년 2월 디라키온을 포위하다 전사하자 귀족들이 항복했다. 오흐리드 대주교구는 자치를 인정받았고 지도는 동부 모이시아를 1000년부터, 중앙 마케도니아를 1001년, 비딘 일대를 1002년, 서부·마케도니아·알바니아를 1018년부터 동로마 영토로 그린다. 사무일은 동로마의 종주 아래 있던 세르비아·두클랴 같은 남슬라브 공국들도 복속시켰고(지도는 1000년에 이 묶음을 두클랴 등으로 나눠 그린다), 신종했던 두클랴의 요반 블라디미르는 1016년 이반 블라디슬라프에게 살해되었다고 전한다. 동쪽에서는 타오-클라르제티(이베리아인의 왕국)의 다비트 쿠로팔라테스가 1000년에 죽자 타오 땅이 약속대로 동로마에 넘어갔다. 1008년 바그라트 3세가 아브하지아와 카르틀리를 합쳐 조지아 왕국의 틀을 세웠고(지도는 아브하지아 왕국을 조지아 왕국으로 이어 그린다), 그 아들 기오르기 1세(재위 1014~1027)와 바실리오스 2세가 타오를 두고 1021~1022년 싸워 동로마가 이겼다. 1021년에는 아르메니아의 바스푸라칸 왕국(아르츠루니 가문)도 왕국을 동로마에 넘겼다(지도는 1022년 버전). 같은 때 동아시아에서는 거란(요)과 고려가 압록강 둘레의 여진 땅을 두고 다투다(`liao-second-invasion-1010`) 고려가 귀주 대첩(`gwiju-1019`)으로 거란 전쟁(993~1019)을 매듭지었다."
