- id: caliphate-fall-1002
  year: 1002
  endYear: 1031
  title:
    ko: "알만수르의 죽음(1002)에서 후우마이야 칼리프국의 끝(1031)까지"
  summary:
    ko: "후우마이야 칼리프국의 실권자 알만수르(알만소르)는 1002년 8월 죽었고, 아들 알무자파르(1008 죽음)와 그 동생 산추엘로가 이어 실권을 잡았으나 산추엘로가 1009년 쿠데타로 쓰러지면서 이른바 피트나(내란)가 시작되었다. 무함마드 2세, 히샴 2세, 베르베르 병사들(술라이만)이 번갈아 코르도바를 차지했고, 바르셀로나 백작 라몬 보렐과 우르헬 백작 에르멩골이 1010년 한 파를 도와 코르도바를 약탈했다. 1013년 베르베르군이 코르도바를 점령해 약탈했고, 메디나 아자하라 궁전은 1010~1013년 사이 폐허가 되었으며 많은 시민이 죽거나 떠났다. 1016년 이후는 함무드 가문이 칼리프를 칭하다 쫓겨나는 일이 되풀이되었고, 1031년 코르도바 귀족들이 마지막 칼리프 히샴 3세를 폐위하며 칼리프 제도를 없앴다. 이베리아는 세비야의 아바드 가문, 톨레도, 사라고사의 후드 가문, 바다호스의 아프타스 가문, 그라나다의 지리 가문, 발렌시아 같은 제1차 타이파(소왕국들)로 갈라졌다(지도는 1031년에 묶음 항목으로 바꾼다). 이 틈에 북쪽의 레온과 나바라가 자라났다. 한편 지중해에서는 데니아의 무자히드가 1015년 사르데냐에 상륙했다가 1016년 피사와 제노바의 함대에게 쫓겨났고, 두 해상 도시(제노바는 지도에서 1005년부터 그려진다)는 서지중해 상권을 넓히는 발판으로 삼았다. 이탈리아 소국들 가운데 사르데냐는 판관이 다스리는 작은 나라들로 남았다."
