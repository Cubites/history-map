- id: igor-galicia-1185
  year: 1185
  endYear: 1199
  title:
    ko: "이고리 원정(1185)과 갈리치아-볼히니아의 성립(1199)"
  summary:
    ko: "노브고로드-세베르스키 공 이고리 스뱌토슬라비치는 1185년 5월 쿠만(폴로베츠)의 칸 콘차크를 치려고 동생 프세볼로드·아들 블라디미르와 원정에 나섰다가 카얄라강 부근에서 크게 져 사로잡혔고 얼마 뒤 달아났다. 이는 키예프 대공 스뱌토슬라프 3세가 1183~1184년 쿠만을 이긴 뒤 이를 따르지 않고 나선 독자 원정이었다. 이를 노래한 고대 루스 문학 『이고리 원정기』가 있다(1790년대에 발견된 필사본은 1812년 모스크바 화재로 사라졌고 진위 논쟁이 있으나 학계 다수는 12세기 작품으로 본다). 쿠만은 루스 공들과 싸우면서도 혼인과 동맹으로 얽혀 이고리의 아들도 콘차크의 딸과 혼인했다(1188). 서남쪽 할리치(갈리치아)에서는 야로슬라프 오스모미슬이 1187년 죽자 서자 올레그가 먼저 이었다가 곧 죽었고(독살설이 있다) 아들 블라디미르도 쫓겨났으며, 헝가리 벨러 3세의 아들 언드라시가 1188년 할리치 공이 되었다. 1189년 블라디미르가 폴란드 카지미에시 2세의 도움으로 돌아왔다(지도는 1188년 헝가리, 1189년 루스로 그린다). 1199년 블라디미르가 죽자 볼히니아 공 로만 므스티슬라비치가 할리치를 합쳐 갈리치아-볼히니아가 서고(뒤의 사건), 지도는 1199년부터 갈리치아-볼히니아로 그린다."
  subjects: [rus-principalities, cuman-tribes, galicia-volhynia, hungary-kingdom, polish-duchies]
