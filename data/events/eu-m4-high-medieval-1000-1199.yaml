- id: almohads-1145
  year: 1145
  endYear: 1195
  title:
    ko: "알모하드와 제2차 타이파의 끝(1172), 알라르코스(1195)"
  summary:
    ko: "이븐 투마르트가 모로코 아틀라스에서 시작한 알모하드('유일신을 믿는 이들') 운동은 알모라비드의 해석을 비판했다. 압드 알무민이 1147년 마라케시를 차지해 알모라비드가 무너졌다. 이베리아에서는 1144~1145년 반란(제2차 타이파)이 일어나 이븐 카시(알가르브), 이븐 함딘(코르도바), 이븐 마르다니시('늑대왕', 발렌시아·무르시아, 1147~1172)가 갈라섰다. 알모하드는 1147년 세비야를 얻고 1148~1149년 코르도바, 1150년 바다호스, 1155년 그라나다, 1157년 알메리아를 차지했다(알모라비드는 1155년 이베리아에서 사라진다). 이븐 마르다니시는 카스티야·아라곤과 손잡고 버텼으나 그가 죽은 1172년 무르시아와 발렌시아가 알모하드에 들어가 타이파 시대가 끝났다. 알모하드는 딤미(유대인·기독교인)에게 개종하거나 떠나라고 요구해 많은 유대인이 달아났다(마이모니데스가 1148년 무렵 코르도바를 떠났다). 한편 이븐 투파일과 이븐 루시드(아베로에스)는 알모하드 궁정에서 일했다. 아부 야쿠브 유수프(재위 1163~1184)는 세비야 대모스크의 미나레트(훗날의 히랄다 탑)를 시작했다. 북쪽에서 카스티야의 알폰소 8세는 1177년 9월 쿠엥카를 얻었으나, 1195년 7월 18일 알라르코스에서 아부 유수프 야쿠브 알만수르에게 크게 졌고 레온과 나바라의 왕들은 돕지 않았다. 이 패배로 칼라트라바 일대를 잃었다. 지도는 1177년 쿠엥카를 카스티야로, 1195년 칼라트라바를 알모하드로 옮겨 그린다."
  subjects: [almohads, almoravids, taifas-second, castile-early, aragon, leon, navarre]
  links:
    - { from: almohads, to: taifas-second, note: "세비야(1147)·무르시아와 발렌시아(1172) 병합" }
    - { from: almohads, to: castile-early, note: "알라르코스 전투(1195)" }
