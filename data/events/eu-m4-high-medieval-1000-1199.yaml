  sources: ["Marie Therese Flanagan, Irish Society, Anglo-Norman Settlers, Angevin Kingship: Interactions in Ireland in the Late Twelfth Century (1989)", "Seán Duffy, Ireland in the Middle Ages (1997)", "A. B. Scott·F. X. Martin 엮음, Giraldus Cambrensis, Expugnatio Hibernica (1978)", "Robin Frame, Ireland and Britain, 1170–1450 (1998)"]
