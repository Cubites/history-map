- id: scandinavia-1130
  year: 1130
  endYear: 1184
  title:
    ko: "내전기의 노르웨이와 스웨덴·덴마크의 교회: 스베레의 피므레이테(1184)까지"
  summary:
    ko: "노르웨이는 1130년 시구르 '예루살렘 순례자' 왕이 죽은 뒤 약 한 세기의 내전 시대에 들어갔다. 왕위를 노리는 이복형제·사생아·조카가 서로 싸웠고, 하랄 길레(재위 1130~1136), 잉기 크로크리그(1136~1161) 곁에 시구르 문·에위스테인 2세·호콘 2세 같은 공동왕과 경쟁자가 있었고, 1161년부터 망누스 에를링손(~1184)이 이었다. 1152~1153년 교황 사절 니콜라스 브레이크스피어(뒤의 하드리아누스 4세)가 니다로스(트론헤임)에 대주교구를 세워 노르웨이 교회가 독립했다. 1163/64년 망누스는 대주교 에위스테인에게 대관을 받았다. 1177년 파로제 출신 스베레 시구르손이 시구르 문 왕의 아들이라 내세우며 '자작나무 다리 부대'(비르케바이네르)를 이끌고 나섰고(1178년 옘틀란드를 얻었다고 전하며 지도는 1178년부터 노르웨이 땅으로 그린다), 1184년 6월 15일 피므레이테 해전에서 망누스를 죽여 왕이 되었다. 스웨덴에서는 스베르케르 가문과 에리크 가문이 번갈아 왕위를 차지했고, 1164년 웁살라에 대주교구가 서면서 교회가 독립했다(지도는 1164년 스웨덴 왕국(초기)을 스웨덴 왕국(중세)으로 이름만 바꿈). 크누트 에릭손(재위 1167~1196)이 1173년 무렵부터 스웨덴 전체를 다스렸다고 하나 핀란드 쪽은 노브고로드와 스웨덴이 다투었다. 덴마크는 룬드 대주교구(1103/1104)에 이어 발데마르 1세(재위 1157~1182)와 압살론 대주교(1178)가 왕권과 교회를 모아 북독일 슬라브 땅으로 눈을 돌렸다(뒤의 사건: 벤드 십자군). 아이슬란드는 자치국으로 남았다."
  subjects: [norway-medieval, sweden-early, sweden-medieval, denmark-medieval, iceland-commonwealth, papal-states]
  tags: [politics, society]
  sources: ["Sverre Bagge, From Viking Stronghold to Christian Kingdom: State Formation in Norway, c. 900–1350 (2010)", "Birgit Sawyer·Peter Sawyer, Medieval Scandinavia: From Conversion to Reformation, circa 800–1500 (1993)", "Knut Helle 엮음, The Cambridge History of Scandinavia, vol. 1: Prehistory to 1520 (2003)"]
  places: [{ name: "피므레이테", at: [6.97, 61.15], year: 1184 }]

- id: anarchy-1135
  year: 1135
  endYear: 1154
  title:
    ko: "무정부 시대: 스티븐과 마틸다(1135~1153)와 더럼 조약(1139)"
  summary:
    ko: "헨리 1세가 1135년 12월 죽자, 딸 마틸다(황후, 앙주의 조프루아의 아내)를 후계자로 삼겠다던 귀족들의 맹세(1127)에도 불구하고, 누이 아델라의 아들인 블루아의 스티븐이 런던 시민과 교회의 지지로 12월 22일 대관했다. 스티븐은 1138년 로버트 오브 글로스터(마틸다의 이복 오빠)의 반란과, 마틸다의 외삼촌인 스코틀랜드 왕 데이비드 1세의 침공을 맞았다. 8월 22일 노덤턴 부근 '깃발 전투'에서 잉글랜드군이 스코틀랜드군을 꺾었으나, 1139년 더럼 조약으로 데이비드의 아들 헨리가 노섬벌랜드 백작이 되었다(지도는 1139년 컴브리아와 노섬벌랜드를 스코틀랜드로 그린다). 1139년 마틸다가 상륙해 내전이 되었고, 1141년 2월 2일 링컨에서 스티븐이 사로잡혔다. 마틸다는 4월 '잉글랜드 귀부인'으로 인정받았으나 런던 시민에게 쫓겨났고, 9월 윈체스터에서 로버트가 사로잡혀 포로 교환으로 스티븐이 풀려났다. 스티븐의 군대에는 플랑드르 용병이 많았고, 성채를 가진 귀족들은 어느 편에 서느냐에 따라 사사로이 싸웠다(『피터버러 연대기』는 '그리스도와 성인들이 잠들었다'고 적었다). 앙주의 조프루아는 1144년 노르망디를 차지해 공작이 되었다(지도는 1144년 노르망디를 따로 그린다). 마틸다는 1148년 노르망디로 물러났고, 아들 헨리가 1150년 노르망디 공작, 1151년 앙주 백작, 1152년 아키텐의 엘레오노르와 혼인하며 아키텐 공작이 되었다. 1153년 1월 헨리가 상륙했고 그해 11월 윈체스터 협정(월링퍼드 조약)으로 스티븐이 왕으로 남고 헨리를 후계자로 삼기로 했다. 스티븐이 1154년 10월 25일 죽자 12월 19일 헨리 2세가 대관했다."
  subjects: [england, normandy-duchy, anjou, aquitaine, scotland, flanders]
  links:
