    - { from: byzantine-empire, to: papal-states, note: "케룰라리오스의 사절 파문(7월 하순)" }
  tags: [politics, culture]
  sources: ["Steven Runciman, The Eastern Schism: A Study of the Papacy and the Eastern Churches during the XIth and XIIth Centuries (1955)", "Axel Bayer, Spaltung der Christenheit: Das sogenannte Morgenländische Schisma von 1054 (2002)", "Anthony Siecienski, The Filioque: History of a Doctrinal Controversy (2010)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]

- id: manzikert-1064
  year: 1064
  endYear: 1081
  title:
    ko: "알프 아르슬란과 만지케르트(1071): 셀주크의 아나톨리아 진출과 다니슈멘드"
  summary:
    ko: "셀주크 술탄 알프 아르슬란은 1064년 아르메니아의 아니를 함락했다(아랍 연대기가 학살을 전하나 수는 과장되었다). 카르스 왕국도 1065년 무렵 지도에서 사라진다. 동로마 황제 로마노스 4세 디오게네스(재위 1068~1071)는 동방 국경을 되찾으려고 1071년 대군을 이끌고 가서, 8월 26일 만지케르트(말라즈기르트)에서 알프 아르슬란에게 지고 사로잡혔다(양쪽 수만 명으로 추산하나 정확한 수는 모른다). 알프 아르슬란은 그를 풀어 주고 화약을 맺었다. 그러나 로마노스는 돌아가서 두카스 가문에 쫓겨나 눈이 멀고 1072년 죽었다. 이 전투 하나가 아나톨리아를 잃게 한 것은 아니었고, 이어진 동로마의 내전(1071~1081)이 국경 방어를 무너뜨려 투르크멘 무리와 지방 베이들이 아나톨리아로 퍼졌다고 본다. 에르주룸의 살투크, 에르진잔의 멩구예크, 시바스·토카트·아마시아의 다니슈멘드 가지(1071~1075 무렵 등장, 통치 1075~1084) 같은 베이국들이 서고, 쉴레이만 이븐 쿠탈미시가 1075년 니카이아를 차지해 1077년 룸 술탄국의 바탕을 놓았다(지도는 1071년 동아나톨리아를 베이국들에게, 1077년 중부를 룸에게 넘긴다). 1081년 알렉시오스 1세는 쉴레이만과 드라콘강을 경계로 하는 조약을 맺었다(뒤의 사건). 조지아 왕국도 셀주크의 침입을 받았으며, 1074~1075년 무렵 동로마의 타오·샤브셰티를 얻은 것으로 보아 지도는 1074년부터 조지아 땅으로 그린다(근사)."
