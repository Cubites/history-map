- id: first-crusade-1095
  year: 1095
  endYear: 1099
  title:
    ko: "제1차 십자군: 클레르몽(1095)에서 예루살렘 함락(1099)까지"
  summary:
    ko: "동로마 황제 알렉시오스 1세의 사절이 1095년 3월 피아첸차 공의회에서 도움을 청했고, 11월 27일 클레르몽 공의회에서 교황 우르바누스 2세가 예루살렘으로 가는 무장 순례를 호소했다(연설의 정확한 말은 전하지 않는다). 1096년 은자 피에르와 평민 무리가 먼저 떠났다가 10월 소아시아에서 룸의 클르츠 아르슬란 1세에게 전멸했다. 제후 군대(툴루즈의 레몽 4세, 부용의 고드프루아, 아풀리아 공작 로베르 기스카르의 아들 보에몽, 노르망디의 로베르, 플랑드르의 로베르, 프랑스 왕 필리프 1세의 동생 베르망두아의 위그)는 겨울에 콘스탄티노폴리스에 모였다. 십자군은 1097년 6월 니카이아를 동로마에 넘기고 7월 1일 도릴라이온에서 룸군을 꺾었으며, 1097년 10월부터 안티오크를 포위해 1098년 6월 3일 성안의 배반자 덕에 들어갔고, 곧 도착한 모술의 케르보가 군을 6월 28일 물리쳤다. 보두앵은 1098년 에데사를, 보에몽은 안티오크를 차지했다(십자군 국가, 뒤의 사건). 제노바 함대와 기술자가 합류한 예루살렘 포위 끝에 1099년 7월 15일 도시가 함락되었다. 십자군은 무슬림과 유대인 주민을 학살했다. 사망자 수는 연대기마다 크게 달라(라틴 연대기는 '피가 무릎까지'라고 하고 무슬림 연대기는 수만 명이라고 적었으나 과장으로 본다) 수천 명에서 그 이상으로 추산한다. 8월 12일 아스칼론에서 이집트 파티마 왕조의 군대를 물리쳤다. 고드프루아는 '성묘의 수호자'가 되었고 동생 보두앵 1세가 1100년 왕이 되었다. 동로마는 약속과 달리 안티오크를 돌려받지 못했다."
  subjects: [papal-states, byzantine-empire, rum-sultanate, france, flanders, normandy-duchy, county-of-toulouse, apulia-duchy, edessa-county, antioch, genoa]
