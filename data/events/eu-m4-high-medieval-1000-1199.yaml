- id: normans-south-italy-1017
  year: 1017
  endYear: 1091
  title:
    ko: "노르만의 남이탈리아와 시칠리아 정복: 멜피(1042)·치비타테(1053)·바리(1071)·노토(1091)"
  summary:
    ko: "1016~1017년 무렵 노르만 기사들이 남이탈리아에 용병으로 나타났다. 롬바르드 반란가 멜로를 도운 이들은 1018년 칸나이에서 동로마의 카테파노 바실리오스 보이오아네스에게 졌지만, 1030년 아베르사 백작령이 서고 오트빌(알타빌라) 가문의 형제들이 1041~1042년 아풀리아에서 동로마군을 물리쳐 멜피를 차지했다(윌리엄 철완이 1042년 아풀리아 백작이 됨). 1053년 6월 18일 치비타테에서 교황 레오 9세의 군대가 로베르 기스카르 등 노르만군에 크게 져 교황이 사로잡혔고, 1059년 교황 니콜라우스 2세는 멜피에서 로베르를 아풀리아·칼라브리아 공작으로 인정했다. 1060년 레조, 1071년 4월 바리(동로마의 마지막 거점, 3년 포위), 1077년 살레르노(롬바르드 공국들의 땅)가 떨어졌다(지도는 1042·1060·1071·1077년에 해당 땅을 노르만 공국으로 옮긴다). 로베르의 동생 로제르는 시칠리아 토후국이 내분에 빠진 틈에 1061년 메시나를 얻고 1072년 1월 로베르와 함께 팔레르모를 차지했으며, 시라쿠사(1086)·아그리젠토(1087)를 거쳐 1091년 2월 노토에서 섬 정복을 마쳤다(지도는 시칠리아 백국을 1071년부터 그린다). 로제르 1세는 아랍 관리를 쓰고 그리스·라틴 교회를 함께 두는 통치를 했으나 이슬람 주민 일부는 섬을 떠났다. 로베르는 1085년 죽었다. 같은 때 이탈리아 서쪽 바다에서는 교황이 1077년 코르시카를 피사 주교에게 맡기는 등 이탈리아 소국과 코무네들 가운데 피사·제노바가 성장했고, 사르데냐에서는 아르보레아 판관이 1070년 무렵 도읍을 타로스에서 오리스타노로 옮겼다."
