- id: bohemia-kingdom-1085
  year: 1085
  endYear: 1198
  title:
    ko: "보헤미아의 왕관: 브라티슬라프 2세(1085)·블라디슬라프 2세(1158)·오타카르 1세(1198)"
  summary:
    ko: "보헤미아는 프르셰미슬 가문이 다스리는 공국이었고, 신성 로마 제국의 제후국이면서 안에서는 거의 자치였다. 브라티슬라프 2세(재위 1061~1092)는 서임권 싸움에서 하인리히 4세 편에 서서 1085년 황제에게서 개인적인 왕관을 받았다(아들에게 이어지지는 않았다). 블라디슬라프 2세(공작 1140~1158, 왕 1158~1172)는 1158년 1월 레겐스부르크에서, 프리드리히 1세의 이탈리아 원정에 군대를 보낸 대가로 왕관을 받았다(역시 본인 한 대의 칭호였다). 그의 군대는 밀라노 포위에 참가했다. 1182년 모라비아는 황제에 직속하는 변경백령이 되었다. 오타카르 1세(재위 1192~1193, 1197~1230)는 독일의 왕위 다툼 속에서 슈바벤의 필리프 편에 서서 1198년 왕의 칭호를 받았고, 1212년 황제 프리드리히 2세의 시칠리아 금인칙서로 이 칭호가 세습으로 굳어진다. 지도는 보헤미아 공국을 1198년 보헤미아 왕국으로 이름만 바꿔 같은 색으로 이어 그린다."
  subjects: [bohemia-duchy, bohemia-kingdom, holy-roman-empire]
  links:
    - { from: holy-roman-empire, to: bohemia-kingdom, note: "왕관(1085 개인 칭호, 1158 개인 칭호, 1198 왕국)" }
  tags: [politics]
  sources: ["Nora Berend·Przemysław Urbańczyk·Przemysław Wiszewski, Central Europe in the High Middle Ages: Bohemia, Hungary and Poland, c. 900–c. 1300 (2013)", "Cosmas of Prague, The Chronicle of the Czechs (Lisa Wolverton 영역, 2009)", "Benjamin Arnold, Medieval Germany, 500–1300: A Political Interpretation (1997)"]

- id: almoravids-1086
  year: 1086
  endYear: 1147
  title:
    ko: "알모라비드의 안달루스 지배(1086~1147)와 타이파의 부활"
  summary:
    ko: "알모라비드(무라비트)는 사하라 산하자 부족 가운데 람투나 부족이 이슬람 개혁 운동으로 일으킨 왕조로, 1070년 무렵 마라케시를 세웠다. 유수프 이븐 타슈핀은 이베리아 타이파 왕들의 부름으로 건너와 1086년 사그라하스에서 알폰소 6세를 물리쳤다(앞의 사건). 그는 타이파 왕들의 무거운 세금을 비판하는 이슬람 법학자들의 지지를 얻어 1090년 그라나다와 말라가, 1091년 세비야·코르도바·알메리아·무르시아, 1094년 바다호스를 차례로 폐위하고 병합했다. 세비야의 알무타미드는 모로코로 끌려가 죽었다. 1102년 발렌시아, 1110년 사라고사도 차지했다. 알리 이븐 유수프(재위 1106~1143) 때는 말리크 법학의 엄격한 해석이 우세해, 알가잘리의 책을 1109년 코르도바에서 불태웠다는 전승이 있다. 1118년 아라곤의 알폰소 1세에게 사라고사를 빼앗겼고, 1125~1126년 알폰소가 안달루스 남부를 휩쓸자 알모라비드 정부가 협력자로 몬 모사라베(아랍화한 기독교인) 수천 명 이상을 북아프리카로 옮겼다고 한다. 그러나 모로코에서 이븐 투마르트가 시작한 알모하드가 1120년대부터 알모라비드를 압박해 1147년 마라케시를 차지했고, 이베리아에서는 1144~1145년 반란(제2차 타이파)이 일어나 무르시아·발렌시아·바다호스 등이 떨어져 나갔다. 지도는 이베리아 땅을 1091·1094년에 알모라비드로 옮기고, 1102·1104·1108·1110·1118년에는 발렌시아·알바라신·쿠엥카·사라고사 같은 땅이 카스티야·아라곤과 주고받으며, 1145년 제2차 타이파 묶음으로 바꾼다."
  subjects: [almoravids, taifas-first, taifas-second, almohads, aragon-early, castile-early]
  links:
    - { from: almoravids, to: taifas-first, note: "타이파 왕들의 폐위와 병합(1090~1094)" }
    - { from: aragon-early, to: almoravids, note: "사라고사 정복(1118)" }
  tags: [politics, war]
  sources: ["Amira K. Bennison, The Almoravid and Almohad Empires (2016)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)", "Bernard F. Reilly, The Contest of Christian and Muslim Spain, 1031–1157 (1992)", "Joseph F. O'Callaghan, A History of Medieval Spain (1975)"]

- id: normandy-england-1087
  year: 1087
  endYear: 1135
  title:
    ko: "정복왕의 아들들: 노르망디와 잉글랜드의 분할(1087), 탱슈브레(1106)와 헨리 1세"
  summary:
    ko: "윌리엄 1세는 1087년 죽으면서 노르망디를 맏아들 로베르 쿠르퇴즈에게, 잉글랜드를 셋째 윌리엄 2세 루퍼스에게 물려주고 막내 헨리에게는 은 5천 파운드를 주었다. 지도는 1087년에 노르망디를 잉글랜드에서 나눈다. 윌리엄 2세는 1088년 로베르를 지지한 귀족들의 반란을 누르고 1092년 스코틀랜드 왕국령이던 칼라일과 컴브리아를 차지했으며, 1093년 리스 압 투더가 죽은 뒤 노르만 영주들이 웨일스 남부(글러모건·펨브룩)를 차지했다(지도는 컴브리아와 웨일스 남부를 1097년에 잉글랜드로 옮긴다). 1096년 로베르가 제1차 십자군 비용으로 노르망디를 잡히자 윌리엄이 1100년까지 다스렸다. 윌리엄 2세는 1100년 8월 2일 사냥 중 화살에 맞아 죽었고 헨리 1세가 곧 즉위해 '자유 헌장'을 반포했다. 로베르는 돌아와 1101년 알턴 조약으로 타협했으나, 헨리는 1106년 9월 28일 탱슈브레에서 로베르를 사로잡아 노르망디를 합쳤고(로베르는 1134년까지 갇혀 있었다) 지도는 1106년에 노르망디를 잉글랜드로 옮긴다. 1110년 멘이 앙주의 풀크 5세에게 넘어갔고(지도는 1110년 버전), 1119년 8월 브레뮐에서 프랑스 왕 루이 6세를 이겼으나 1120년 11월 25일 화이트 십 침몰로 외아들 윌리엄 애설링이 익사했다. 헨리 1세는 딸 마틸다를 후계자로 삼게 하고 1128년 앙주의 조프루아와 혼인시켰다. 1107년 런던 협약으로 주교 서임 문제를 풀었고 재무부 제도를 정비했다. 1135년 12월 1일 헨리가 죽으며 아들 없는 왕위 계승이 무정부 시대로 이어졌다(뒤의 사건)."
  subjects: [england, normandy-duchy, anjou, france, scotland, welsh-principalities]
  links:
    - { from: england, to: normandy-duchy, note: "탱슈브레 전투(1106)와 노르망디 합병" }
  tags: [politics, war]
  sources: ["Judith A. Green, Henry I: King of England and Duke of Normandy (2006)", "Frank Barlow, William Rufus (1983)", "Robert Bartlett, England under the Norman and Angevin Kings, 1075–1225 (2000)", "David Carpenter, The Struggle for Mastery: Britain 1066–1284 (2003)"]
