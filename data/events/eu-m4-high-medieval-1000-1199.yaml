- id: crusade-pogroms-1096
  year: 1096
  endYear: 1190
  title:
    ko: "십자군과 유대인 학살: 라인란트(1096)에서 요크(1190)까지"
  summary:
    ko: "1096년 봄 제1차 십자군을 따르던 무리 가운데 플로니하임의 에미코(라이닝겐으로도 불림) 등의 무리가 라인강 유역의 유대인 공동체를 습격했다. 5월 3일 슈파이어에서 유대인 11~12명이 죽었고 주교 요한네스가 나머지를 보호했으며, 5월 18~25일 보름스에서 8백 명 안팎이, 5월 27일 마인츠에서 1천 명 안팎이 죽었다(대주교 루트하르트는 달아났다). 쾰른과 라인강 아래쪽 마을들에서도 학살이 이어졌다. 히브리어 연대기(솔로몬 바르 삼손 등)는 많은 유대인이 강제 개종을 거부해 가족을 죽이고 스스로 목숨을 끊었다고 전한다. 가해자는 십자군을 자처한 무리와 일부 도시민이었고, 주교들과 황제 하인리히 4세는 유대인을 보호하려 했으나 실패했다. 에미코의 무리는 헝가리에서 칼만 왕의 군대에게 흩어졌다. 하인리히 4세는 1097년 강제로 개종한 이들이 유대교로 돌아가는 것을 허락했다. 1146년 제2차 십자군을 앞두고도 라인란트에서 습격이 있었고 클레르보의 베르나르가 설교로 막았다. 잉글랜드에서는 1189년 9월 리처드 1세의 대관식 날 런던에서 유대인 사절이 맞아 죽는 소동이 번졌고, 이듬해 2~3월 노리치·스탬퍼드·링컨·베리세인트에드먼즈 같은 곳으로 퍼졌다. 1190년 3월 16~17일 요크의 유대인들은 왕의 성채(후대의 클리퍼드 탑 자리)로 피신했다가 포위당했고, 랍비 요므 토브의 권유에 따라 많은 이들이 스스로 목숨을 끊었으며 항복한 이들도 살해당했다(150명 안팎에서 500명까지 추산이 갈린다). 가해자 가운데에는 십자군 참가를 앞둔 빚 진 영주들이 있었고 습격자들은 요크 대성당에 보관된 차용 증서를 불태웠다. 왕실은 연루된 요크 사람들과 영주들에게 벌금을 물렸고, 1194년 이후 유대인 채권을 등록·보관하는 제도를 두었다."
  subjects: [holy-roman-empire, hungary-kingdom, england]
  tags: [society, politics]
  sources: ["Robert Chazan, European Jewry and the First Crusade (1987)", "Robert Chazan, In the Year 1096: The First Crusade and the Jews (1996)", "R. B. Dobson, The Jews of Medieval York and the Massacre of March 1190 (Borthwick Papers 45, 1974)", "Anna Sapir Abulafia, Christian–Jewish Relations, 1000–1300: Jews in the Service of Medieval Christendom (2011)"]

- id: portugal-1139
  year: 1096
  endYear: 1192
  title:
    ko: "포르투갈 백국에서 왕국으로: 상마메드(1128)·오리케(1139)·사모라(1143)·리스본(1147)"
  summary:
    ko: "알폰소 6세는 1096년 무렵 사위인 부르고뉴의 엔히크(앙리)에게 포르투갈 백작령을 맡겼다. 엔히크가 1112년 죽은 뒤 아내 테레사가 다스렸고, 아들 아폰수 엔히크스는 1128년 6월 24일 상마메드 전투에서 어머니와 갈리시아 귀족 세력을 꺾고 백작령을 쥐었다. 1139년 7월 오리케(오리크) 전투에서 이슬람군을 꺾고 병사들이 그를 왕으로 추대했다고 전하나(전승이며 장소는 확실하지 않다) 사촌인 레온·카스티야 왕 알폰소 7세는 이를 인정하지 않았다. 1143년 10월 사모라 회담에서 알폰소 7세가 아폰수를 왕으로 대접하기로 했다. 아폰수는 그해 12월 교황에게 서한을 보내 교황의 봉신이 되어 해마다 금 4온스를 바치겠다며 인정을 구했다(교황은 1179년에야 왕으로 인정했다). 알모라비드의 힘이 빠져 반란(제2차 타이파)이 일던 1147년 3월 산타렘을 기습으로 얻고, 제2차 십자군에 가던 잉글랜드·플랑드르·독일·프리슬란트 십자군의 도움으로 7월부터 리스본을 포위해 10월 24일 항복받았다(십자군과 포르투갈군이 약탈하고 주민을 살상했다고 전한다). 이후 알모하드와 싸워 1158년 알카세르두살, 1165년 에보라를 얻었으나(지도는 1160·1166년 버전) 1191~1192년 알모하드가 알카세르두살을 되찾았다(지도는 1192년 버전). 지도는 1096년 포르투갈 북부와 코임브라를 백작령으로, 1139년 이름만 포르투갈로 바꾸고 1147년 산타렘·리스본 일대를 더한다."
  subjects: [portugal-county, portugal, leon, castile-early, almoravids, taifas-second, almohads]
  links:
    - { from: portugal, to: taifas-second, note: "산타렘(1147년 3월)과 리스본(1147년 10월) 정복" }
    - { from: leon, to: portugal, note: "사모라 회담(1143): 알폰소 7세의 인정" }
  tags: [politics, war]
  sources: ["Harold Livermore, A New History of Portugal (2판, 1976)", "José Mattoso, D. Afonso Henriques (2006)", "Joseph F. O'Callaghan, A History of Medieval Spain (1975)", "Jonathan Phillips, The Second Crusade: Extending the Frontiers of Christendom (2007)"]
  places: [{ name: "상마메드(기마랑이스)", at: [-8.29, 41.44], year: 1128 }, { name: "산타렘", at: [-8.69, 39.24], year: 1147 }, { name: "리스본", at: [-9.14, 38.71], year: 1147 }]

- id: crusader-states-1098
  year: 1098
  endYear: 1150
  title:
    ko: "에데사 백국과 안티오크 공국(1098~1150): 십자군 국가와 에데사의 함락(1144)"
  summary:
    ko: "제1차 십자군이 세운 나라 가운데 지도 권역 안(오늘의 튀르키예 남동부)에 든 것은 에데사 백국과 안티오크 공국이다. 에데사에서는 보두앵(뒤의 예루살렘 왕 보두앵 1세)이 아르메니아계 지배자 토로스의 양자로 들어갔다가 1098년 3월 그가 살해되자 스스로 백작이 되어 최초의 십자군 국가를 세웠다. 안티오크는 1098년 6월 보에몽이 차지했다. 두 나라 모두 주민은 아르메니아·시리아 정교도와 무슬림이 다수였고 라틴 지배층은 소수였다. 에데사의 보두앵 2세와 보에몽은 1104년 5월 하란 전투에서 셀주크 연합군에 크게 졌고 보두앵은 사로잡혀 1108년 풀려났다. 보에몽은 1108년 데볼 조약으로 알렉시오스 1세의 신하가 되기로 했다. 1119년 6월 28일 '피의 들판'에서 안티오크의 로제르가 마르딘의 일가지에게 전사했다. 1132년 킬리키아의 레본 1세가 평야를 차지했다가 1137년 동로마 황제 요안니스 2세에게 빼앗겼고, 요안니스는 안티오크의 레몽에게 신종을 받아 냈다. 모술·알레포의 장기가 1144년 12월 24일 에데사를 점령했고(약 4주 포위) 이는 제2차 십자군의 계기가 되었다(뒤의 사건). 1146년 조슬랭 2세가 에데사를 기습으로 되찾으려 했으나 장기의 아들 누르 앗딘의 군대가 곧 도시를 되찾으며 주민을 학살하거나 쫓아냈다고 한다. 안티오크의 레몽은 1149년 6월 29일 이납 전투에서 누르 앗딘에게 전사했다. 1150년 조슬랭 2세가 사로잡히자 그의 아내가 남은 성들을 동로마에 팔았고 에데사 백국은 끝났다(지도는 1149~1150년 마라시·사모사타 일대를 룸 술탄국으로 넘긴다). 트리폴리 백국(1109)과 예루살렘 왕국은 권역 밖이라 지도에 그리지 않는다."
  subjects: [edessa-county, antioch, byzantine-empire, cilicia-principality, rum-sultanate]
  links:
    - { from: antioch, to: byzantine-empire, note: "데볼 조약(1108)" }
    - { from: byzantine-empire, to: antioch, note: "요안니스 2세의 종주권 요구(1137)" }
  tags: [war, politics]
  sources: ["Thomas Asbridge, The Creation of the Principality of Antioch, 1098–1130 (2000)", "Malcolm Barber, The Crusader States (2012)", "Steven Runciman, A History of the Crusades, vol. 2: The Kingdom of Jerusalem and the Frankish East, 1100–1187 (1952)", "Carole Hillenbrand, The Crusades: Islamic Perspectives (1999)"]
  places: [{ name: "하란", at: [39.03, 36.86], year: 1104 }, { name: "에데사(우르파)", at: [38.79, 37.16], year: 1144 }]

- id: boleslaw-iii-1102
  year: 1102
  endYear: 1138
  title:
    ko: "볼레스와프 3세 비뚤입과 폴란드의 분열(1138)"
  summary:
    ko: "브와디스와프 1세 헤르만이 1102년 죽자 아들 즈비그니에프(서자)와 볼레스와프 3세가 나라를 나눠 가졌다. 볼레스와프는 1107~1108년 겨울 형을 몰아낸 뒤 1112년 즈비그니에프를 눈멀게 했고(주어는 볼레스와프 3세와 그 측근이며, 그는 교회의 참회 요구를 받았다) 즈비그니에프는 곧 죽었다. 1109년 독일 왕 하인리히 5세가 슐레지엔으로 쳐들어왔으나 글로고프 포위를 풀지 못했고, 8월 24일 프시에폴레(브로츠와프 부근)에서 폴란드군이 이겼다고 전한다(후대 기록이라 실재를 의심하는 논쟁이 있다). 볼레스와프는 1116~1119년 포메렐리아(그단스크 일대)를, 1121년 슈체친을 차지해 서슬라브계 포메른 공 바르티스와프 1세를 신하로 삼고(봉신 관계는 1122년), 밤베르크 주교 오토를 불러 1124~1128년 포메른인들을 개종시켰다. 1135년 메르제부르크에서 로타르 3세에게 포메른과 뤼겐을 봉토로 받는 의례를 했는데 제국은 이를 신종으로 보았다. 1138년 10월 28일 볼레스와프는 나라를 아들들에게 나누는 유언을 남기고 죽었다. 맏아들 브와디스와프 2세는 슐레지엔을 받고 크라쿠프를 중심으로 하는 '대공령'과 포메른의 종주권을 맡았고, 나머지 아들들이 마조프셰, 대폴란드, 산도미에시 같은 몫을 받았다. 이후 형제의 다툼이 이어져 폴란드는 공국들로 갈라진 채 14세기에야 다시 하나가 된다. 지도는 1116년 포메렐리아(그단스크 일대)를 폴란드 땅으로 그리고, 1138년에 폴란드를 공국들 묶음으로 바꾼다."
  subjects: [piast-poland, polish-duchies, slavic-tribes, holy-roman-empire]
  links:
    - { from: piast-poland, to: slavic-tribes, note: "포메른 정복(1116~1121)" }
  tags: [politics, war]
  sources: ["Nora Berend·Przemysław Urbańczyk·Przemysław Wiszewski, Central Europe in the High Middle Ages: Bohemia, Hungary and Poland, c. 900–c. 1300 (2013)", "Jerzy Lukowski·Hubert Zawadzki, A Concise History of Poland (2판, 2006)", "Norman Davies, God's Playground: A History of Poland, vol. 1 (1981)"]
