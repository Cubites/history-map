- id: second-crusade-1145
  year: 1145
  endYear: 1149
  title:
    ko: "제2차 십자군(1147~1149)과 '사제왕 요한' 소식"
  summary:
    ko: "1144년 12월 에데사가 함락되자 교황 에우제니우스 3세는 1145년 12월 1일 교서 '크반툼 프라이데체소레스'로 새 십자군을 호소했고, 클레르보의 베르나르가 1146년 3월 베즐레에서 프랑스 왕 루이 7세 앞에서 설교했다. 독일 왕 콘라트 3세도 같은 해 12월 슈파이어에서 십자가를 받았다. 두 군대는 1147년 5월부터 헝가리와 동로마를 거쳐 갔고, 콘라트의 군대는 10월 25일 도릴라이온 부근에서 룸의 마수드 1세에게 크게 졌다. 루이의 군대도 소아시아를 건너며 1148년 1월 카드모스산에서 큰 피해를 입고 배로 안티오크에 닿았다. 안티오크의 레몽은 루이의 왕비 엘레오노르의 삼촌이었으나, 루이는 에데사 대신 다마스쿠스를 치기로 한 1148년 6월 아크레 회의의 결정에 따라 7월 24~28일 다마스쿠스를 포위했다가 물러났다. 콘라트는 1148년 9월 팔레스타인을 떠나 콘스탄티노폴리스에서 겨울을 나고 1149년 독일로 돌아갔고, 루이도 1149년 귀국했다. 같은 해 이베리아에서는 리스본(1147)·토르토사(1148) 정복이 십자군의 이름으로 이루어졌고(앞의 사건), 발트해 남쪽에서는 벤드 십자군이 있었다(뒤의 사건). 연대기들은 십자군이 동로마 땅에서 약탈했다고 적고, 동로마는 시칠리아의 로제르 2세가 1147년 코르푸·테바이·코린토스를 습격해 시달렸다. 프라이징의 오토는 『연대기』에서 야발라 주교 위그가 에우제니우스 3세에게 동방의 기독교 왕 '사제왕 요한'이 페르시아·메디아인을 이겼다고 전했다고 적었다. 이는 1141년 카트완 평원에서 셀주크의 산자르를 꺾은 야율대석(요의 황족으로 요가 망할 무렵(1124) 서쪽으로 가서 서요를 세움, `liao-falls-1125`)의 소식이 변형된 것이라고 흔히 본다."
  subjects: [holy-roman-empire, france, byzantine-empire, rum-sultanate, antioch, edessa-county, hungary-kingdom, papal-states, sicily-kingdom, jin]
  links:
