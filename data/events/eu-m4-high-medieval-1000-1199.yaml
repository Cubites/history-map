- id: stephen-hungary-1000
  year: 1000
  endYear: 1102
  title:
    ko: "이슈트반 1세의 대관(1000/1001)에서 칼만의 크로아티아 왕위(1102)까지: 헝가리 왕국의 형성"
  summary:
    ko: "카르파티아 분지의 마자르 공국(아르파드 가문)은 게저 대공(972~997)의 개종 정책 뒤 아들 이슈트반이 이었고, 이슈트반은 997년 이교도 친척 코퍼니를 물리쳤다. 그는 1000년 크리스마스(또는 1001년 1월 1일)에 교황이 보낸 왕관으로 대관했다(신성 로마 황제 오토 3세의 동의가 있었다고 본다). 이렇게 마자르 공국은 기독교 왕국이 되었고 에스테르곰 대주교구가 섰다. 1002~1003년 트란실바니아의 지배자 줄러를 사로잡았고(『힐데스하임 연대기』), 마로시강 아래쪽의 아이토니는 1020년대 말에 꺾었다는 설이 많지만 더 이르다는 설도 있으며 지도는 바나트를 처음부터 헝가리 땅으로 그린다(근사). 이슈트반이 1038년 죽은 뒤 왕위 다툼과 이교 반란(1046 바타)이 이어졌다. 1071년 무렵 솔로몬 왕(재위 1063~1074) 때 베오그라드와 스렘 일대를 차지했고(지도는 1071년부터 헝가리 땅), 라슬로 1세(재위 1077~1095)는 나라를 안정시킨 뒤 1091년 크로아티아의 슬라보니아를 얻고 1094년 자그레브 주교구를 두었다. 1097년 그보즈드산 전투에서 헝가리군이 크로아티아의 마지막 왕 페타르 스나치치를 꺾었고, 칼만(재위 1095~1116)은 1102년 크로아티아 왕으로 대관해 헝가리와 같은 왕이 다스리는 동군 연합을 이루었다(팍타 콘벤타라 불리는 합의문은 훗날 전해진 사본이라 진위가 논쟁된다). 지도는 크로아티아 왕국을 1102년에 헝가리 색으로 옮기고, 보스니아도 1102년부터 헝가리 땅으로 그린다."
