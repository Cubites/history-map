- id: poland-chrobry-1000
  year: 1000
  endYear: 1058
  title:
    ko: "그니에즈노 회합(1000)에서 카지미에시 1세의 재건(1058)까지: 용감공 볼레스와프 1세의 폴란드"
  summary:
    ko: "프라하 주교 아달베르트는 997년 프로이센에서 순교했고, 피아스트 가문의 볼레스와프 1세(재위 992~1025)는 시신을 사 와 그니에즈노에 묻었다. 1000년 신성 로마 황제 오토 3세가 그 무덤을 순례하러 그니에즈노에 와서 대주교구와 크라쿠프·브로츠와프·콜로브제크 주교구를 세웠다. 볼레스와프는 하인리히 2세와 1002~1018년 싸웠고(1018년 바우첸 화약으로 라우지츠와 밀스코를 얻음), 1003~1004년 보헤미아의 프라하를 차지했으나 곧 잃었다. 1018년에는 사위 스뱌토폴크를 도와 키예프를 차지했다(체르벤 도시들도 얻었다). 1025년 4월 왕으로 대관했고 그해 6월 죽었다. 아들 미에슈코 2세(재위 1025~1034)는 1031년 콘라트 2세와 키예프의 야로슬라프에게 동시에 공격받아 라우지츠와 체르벤 도시들을 잃고 보헤미아로 피신했다(보헤미아 공 오들리히가 가두고 거세했다고 전한다). 이복형 베즈프림이 1031~1032년 폴란드를 다스리다 살해되었고, 미에슈코는 1032년 풀려나 돌아와 7월 메르제부르크에서 영토를 나눠 받았다. 1034년 5월 그가 죽자 반란과 이교 부활이 이어졌고(지도는 마조프셰의 반란 정권을 그리지 않는다), 1039년(1038년설도 있다) 보헤미아의 브제티슬라프 1세가 그니에즈노를 약탈하고 아달베르트의 유해와 슐레지엔을 가져갔다. 포메렐리아(그단스크 일대)도 이 틈에 포메른 공들(서슬라브 부족)의 손에 들어갔다(지도는 1039년). 카지미에시 1세(재위 1039/1040~1058)가 돌아와 키예프(누이와 혼인했고 연도는 1039·1041·1043년설이 갈린다)와 제국의 도움으로 나라를 되찾았고, 1054년 퀘들린부르크 화해로 슐레지엔을 공물을 바치는 조건으로 되돌려 받았다. 지도는 모라비아를 1029년(1019년설도 있다) 브제티슬라프가 되찾을 때까지 폴란드 땅으로, 슐레지엔은 1039~1053년 보헤미아 땅으로 그린다."
