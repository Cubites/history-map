- id: monomakh-kievan-fall-1113
  year: 1113
  endYear: 1137
  title:
    ko: "블라디미르 모노마흐에서 노브고로드 공화국(1136)까지: 키예프 루스의 분열(1132)"
  summary:
    ko: "1097년 류베치 회의에서 루스의 공들은 '각자 제 땅을 지킨다'고 합의했으나 다툼은 그치지 않았다. 1113년 스뱌토폴크 2세가 죽자 키예프 시민이 고리대금업자에 대한 봉기를 일으키며 페레야슬라블 공 블라디미르 모노마흐(재위 1113~1125)를 키예프 대공으로 불렀다. 모노마흐는 쿠만(폴로베츠)을 거듭 원정으로 몰아내고(1103·1111년 등) 자녀에게 주는 『교훈서』를 남겼다. 일부 쿠만은 조지아의 다비트 4세에게 용병으로 갔다(앞의 사건). 아들 므스티슬라프(재위 1125~1132)는 1129년 폴로츠크 공들을 동로마로 보냈다. 1132년 4월 므스티슬라프가 죽자 키예프의 지위가 흔들려 올고비치 가문(체르니히우)과 모노마호비치 가문이 대공 자리를 두고 오래 다투었고, 루스는 여러 공국으로 갈라졌다(지도는 1132년에 키예프 루스를 루스 공국들 묶음으로 바꾼다). 스몰렌스크 공국은 1127년 모노마호비치 가문의 로스티슬라프 아래에서, 랴잔 공국은 1129년 무롬 쪽에서 따로 선 것으로 지도가 그린다. 노브고로드에서는 1136년 시민이 므스티슬라프의 아들 프세볼로드를 내쫓고 스스로 공을 초청하는 공화정(베체, 포사드니크)을 열어 노브고로드 공화국이 되었다. 1137년 스뱌토슬라프 올고비치의 헌장은 북쪽 자볼로체에 공납소(포고스트)를 두었다고 전한다. 연대기에는 1143·1149년 카렐리아인과 함께 한 원정이 보여, 지도는 1136년 핀우그르계 카렐리아인의 땅(핀란드 카렐리아)을, 1137년 북쪽 땅을 노브고로드로 그린다. 쿠만은 남러시아 초원을 차지하고 루스 공들과 싸우기도, 혼인과 동맹으로 손잡기도 했다."
  subjects: [kievan-rus, rus-principalities, smolensk-principality, ryazan, novgorod-republic, finnic-tribes, cuman-tribes, byzantine-empire]
  links:
    - { from: kievan-rus, to: cuman-tribes, note: "모노마흐의 쿠만 원정(1103·1111)" }
    - { from: novgorod-republic, to: finnic-tribes, note: "카렐리아 방면 진출(1143·1149)" }
  tags: [politics, war]
  sources: ["Janet Martin, Medieval Russia, 980–1584 (2판, 2007)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "Martin Dimnik, The Dynasty of Chernigov, 1054–1146 (1994)", "세르히 플로히, 『유럽의 문 우크라이나: 독립과 생존을 위한 투쟁의 역사』(허승철 옮김, 한길사, 2022)"]

- id: alfonso-vii-leon-castile-1126
  year: 1126
  endYear: 1157
  title:
    ko: "알폰소 7세의 황제 대관(1135)과 카스티야·레온의 분리(1157)"
  summary:
    ko: "우라카 여왕이 1126년 3월 죽자 아들 알폰소 7세가 레온·카스티야·갈리시아의 왕이 되었다(재위 1126~1157). 1135년 5월 레온에서 '전 에스파냐의 황제'로 대관했고, 나바라의 가르시아 라미레스와 바르셀로나 백작 라몬 베렝게르 4세, 몇몇 프랑스 영주와 무슬림 소군주(사파돌라)가 참석해 신종했다고 전한다. 1139년 이후 사촌 아폰수 엔히크스가 포르투갈의 왕을 칭하자 마땅찮아 했으나 1143년 사모라 회담에서 타협했다(앞의 사건). 알모라비드가 흔들리자 1147년 10월 제노바·바르셀로나의 도움으로 알메리아를 차지했고 칼라트라바도 얻었다(지도는 1147년 알메리아·칼라트라바를 카스티야 땅으로 그린다). 1157년 알모하드가 알메리아를 되찾았다. 같은 해 8월 21일 알폰소 7세는 귀환길에 죽으면서 유언으로 나라를 나눴다. 맏아들 산초 3세는 카스티야를, 둘째 페르난도 2세는 레온과 갈리시아를 받아 두 왕국이 갈라졌고(1230년 다시 합쳐진다), 티에라 데 캄포스는 카스티야 몫이 되었다(경계는 1158년 5월 사하군 조약에서 확정되었고 지도는 1157년으로 근사한다). 산초 3세가 1158년 죽고 두 살의 알폰소 8세가 이었다. 같은 해 칼라트라바 기사단이 세워졌다. 지도는 1157년에 카스티야와 레온을 따로 그린다."
  subjects: [leon, castile-early, navarre, barcelona-county, portugal, almoravids, almohads]
