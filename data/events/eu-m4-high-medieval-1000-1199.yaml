- id: yaroslav-wise-1015
  year: 1015
  endYear: 1055
  title:
    ko: "야로슬라프 현공과 키예프 루스의 전성: 형제 전쟁(1015~1019)에서 쿠만의 등장(1055)까지"
  summary:
    ko: "키예프 대공 블라디미르 1세가 1015년 7월 죽자 아들들이 싸웠다. 스뱌토폴크가 보리스와 글레프를 죽였고(두 형제는 훗날 성인이 되었다), 노브고로드의 야로슬라프가 1016년 스뱌토폴크를 쳐 키예프를 얻었으나, 스뱌토폴크가 장인인 폴란드의 볼레스와프 1세의 도움으로 1018년 키예프를 되찾았다. 1019년 야로슬라프가 알타강에서 스뱌토폴크를 완전히 물리쳤다. 1024~1026년 형제 므스티슬라프(트무타라칸·체르니히우)와 싸운 뒤 드니프로강을 경계로 땅을 나눴고, 므스티슬라프가 1036년 죽자 홀로 루스를 다스렸다. 같은 해 키예프를 포위한 페체네그를 물리쳐 쫓아냈고(그 자리에 성 소피아 대성당을 지었다고 전한다) 페체네그는 도나우 쪽으로 밀려났다. 1043년 아들 블라디미르가 이끈 함대가 콘스탄티노폴리스를 공격했으나 동로마의 '그리스의 불'에 지고 1046년 화평을 맺었다. 『루스 법전』(루스카야 프라브다)이 이 무렵 정리되었다고 하며, 1051년 루스 출신 일라리온이 키예프 수도대주교가 되었다. 그의 딸들은 프랑스의 앙리 1세(안나), 노르웨이의 하랄 3세(엘리자베타), 헝가리의 언드라시 1세(아나스타샤)와 혼인했고, 누이 도브로네가는 폴란드의 카지미에시 1세와 혼인했다. 야로슬라프는 1054년 2월 죽으면서 살아 있던 맏아들 이자슬라프(노브고로드의 블라디미르는 1052년에 먼저 죽었다)에게 키예프를, 스뱌토슬라프에게 체르니히우를, 프세볼로드에게 페레야슬라블을 주었고, 이 유언이 연장자 승계(사다리식 계승)의 바탕이 되었다. 1055년 연대기에 쿠만(폴로베츠)이 루스 국경에 처음 나타난다. 쿠만은 페체네그를 대신해 흑해 북쪽 초원의 주인이 되었다."
  subjects: [kievan-rus, pecheneg-tribes, cuman-tribes, byzantine-empire, piast-poland, france, norway-medieval, hungary-kingdom]
