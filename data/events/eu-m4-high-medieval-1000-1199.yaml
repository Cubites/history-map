- id: angevin-empire-1154
  year: 1154
  endYear: 1189
  title:
    ko: "헨리 2세의 앙주 제국과 토머스 베킷(1170)"
  summary:
    ko: "1154년 12월 19일 앙주 백작이자 노르망디 공작인 헨리 2세가 잉글랜드 왕으로 대관했다. 그는 어머니 마틸다에게서 잉글랜드와 노르망디를, 아버지에게서 앙주·멘·투렌을, 아내 아키텐의 엘레오노르에게서 아키텐·가스코뉴·푸아투를 이어받아 스코틀랜드 국경에서 피레네까지를 다스렸다('앙주 제국'은 훗날 역사가의 이름이며 영지마다 법과 관행이 달랐다). 1157년 스코틀랜드 왕 맬컴 4세에게서 노섬벌랜드와 컴브리아를 되찾았고(지도는 1157년), 1158년 동생이 죽자 낭트를 차지하고 1166년 브르타뉴 공 코낭 4세를 물러나게 해 아들 조프루아와 콘스탕스를 약혼시켰다(혼인은 1181년)(지도는 브르타뉴를 공국으로 계속 그린다). 1159년 툴루즈 원정은 도시 안에 있던 프랑스 왕 루이 7세를 직접 치기를 꺼려 실패했고, 1165년 웨일스 원정은 폭우와 웨일스 군주들의 연합에 막혀 실패했다. 법제로는 순회 재판과 재무부, 1166년 클래런던 법령으로 왕권을 키웠다. 교회와는 1164년 클래런던 헌장으로 성직자를 왕의 법정에 세우려다 캔터베리 대주교 토머스 베킷과 부딪쳤다. 베킷은 1164년 프랑스로 달아났다 1170년 돌아왔고, 12월 29일 헨리의 격노를 들은 기사 넷에게 캔터베리 대성당에서 살해되었다. 교황 알렉산데르 3세가 1173년 그를 성인으로 선포했고 헨리는 1174년 7월 대성당에서 참회했다. 아들들이 엘레오노르를 따라 루이 7세, 스코틀랜드 왕 윌리엄과 손잡고 일으킨 1173~1174년 대반란을 누르고, 7월 13일 앨닉에서 윌리엄을 사로잡아 12월 팔레즈 조약으로 신종을 받았다(리처드가 1189년 캔터베리 면제로 풀어 줌). 엘레오노르는 1189년까지 갇혀 지냈다. 1183년 맏아들 '젊은 왕' 헨리가, 1186년 조프루아가 먼저 죽었고, 1188~1189년 리처드가 필리프 2세와 손잡았다. 헨리 2세는 1189년 7월 6일 시농에서 죽었고 리처드가 이었다(뒤의 사건)."
  subjects: [england, france, scotland, brittany, county-of-toulouse, welsh-principalities, papal-states]
