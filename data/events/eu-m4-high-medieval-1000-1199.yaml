- id: alfonso-vi-toledo-1072
  year: 1072
  endYear: 1109
  title:
    ko: "알폰소 6세: 톨레도 함락(1085), 사그라하스(1086)와 엘 시드의 발렌시아(1094)"
  summary:
    ko: "산초 2세가 1072년 암살되자 알폰소 6세가 레온·카스티야·갈리시아를 모두 이어받았다. 1076년 나바라의 산초 4세가 암살되자 리오하와 비스카야를 차지해 영토를 넓혔고, 아라곤의 산초 라미레스는 나바라 본토를 얻었다. 그는 타이파들의 공물을 받으며 톨레도를 노렸고, 1085년 5월 톨레도를 차지했다(톨레도 왕 알카디르는 발렌시아를 받고 물러났다). 톨레도는 이후 카스티야의 중심이 되었고, 무슬림 주민의 예배를 보장하겠다던 약속은 톨레도 대주교 베르나르와 왕비 콘스탕스가 1086~1087년 대모스크를 성당으로 바꾸며 깨졌다. 세비야의 알무타미드 등 타이파 왕들은 위기를 느껴 알모라비드의 유수프 이븐 타슈핀을 불렀고, 알모라비드군은 1086년 10월 23일 사그라하스(아랍어로 살라카)에서 알폰소를 크게 물리쳤다. 카스티야 귀족 로드리고 디아스 데 비바르, 곧 엘 시드는 1081년 알폰소에게 쫓겨나 사라고사 타이파에서 용병으로 일하다 돌아왔고, 1094년 6월 발렌시아를 차지해 다스렸다(지도는 알폰소의 신하라는 명목에 따라 카스티야 색으로 그린다). 같은 해 10월 쿠아르테에서 알모라비드군을 꺾었으나 1099년 7월 죽었고, 아내 히메나가 버티다가 1102년 5월 알폰소가 발렌시아를 불태우고 떠나 알모라비드가 차지했다. 알폰소는 사위 부르고뉴의 엔히크에게 1096년 무렵 포르투갈 백작령을 맡겼다(뒤의 사건). 1108년 5월 29일 우클레스에서 알모라비드군에 져 아들 산초를 잃었고, 1109년 7월 죽었다. 지도는 톨레도를 1085년에, 발렌시아를 1094~1102년에, 쿠엥카·우클레스를 1108년에 옮겨 그린다."
  subjects: [castile-early, leon, navarre, aragon-early, taifas-first, almoravids, portugal-county]
  links:
