  sources: ["Janet Martin, Medieval Russia, 980–1584 (2판, 2007)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "세르히 플로히, 『유럽의 문 우크라이나: 독립과 생존을 위한 투쟁의 역사』(허승철 옮김, 한길사, 2022)", "Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)"]

- id: saladin-third-crusade-1187
  year: 1187
  endYear: 1192
  title:
    ko: "살라딘의 하틴(1187)과 예루살렘 탈환, 제3차 십자군(1189~1192)"
  summary:
    ko: "1187년 7월 4일 하틴(티베리아스 부근)에서 이집트·시리아의 술탄 살라딘(살라흐 앗딘)이 예루살렘 왕 기 드 뤼지냥의 십자군 야전군을 거의 전멸시켰다. 살라딘은 왕과 영주들을 사로잡고 진짜 십자가 유물을 빼앗았다. 사로잡힌 르노 드 샤티용은 살라딘이 직접 처형했고, 템플 기사단과 병원 기사단 포로 약 200명도 살라딘의 명령으로 처형되었다. 예루살렘은 9월 20일부터 포위되어 10월 2일 발리앙 디벨랭이 항복했다. 살라딘은 도시를 약탈하지 않고 몸값(남자 10디나르, 여자 5디나르, 아이 1디나르)을 받고 풀어 주었으나 몸값을 못 낸 수천 명은 노예가 되었다(1099년의 학살과 대조된다). 교황 그레고리우스 8세가 10월 교서 '아우디타 트레멘디'로 십자군을 호소했다. 1189년 8월 기 드 뤼지냥이 아크레를 포위해 2년 가까이 이어졌다. 신성 로마 황제 프리드리히 1세는 1189년 5월 육로로 출발해 헝가리와 동로마를 거쳤고 세르비아의 네마냐·불가리아와도 접촉했으며, 1190년 5월 코니아 앞에서 룸군을 이겼으나 6월 10일 살레프강에서 익사해 독일군 대부분이 돌아갔다(앞의 사건). 프랑스 왕 필리프 2세와 잉글랜드 왕 리처드 1세는 1190년 7월 베즐레를 떠나 시칠리아 메시나에서 겨울을 났다. 리처드는 1191년 5월 키프로스를 정복해 이사키오스 콤니노스를 몰아냈다(키프로스는 템플 기사단을 거쳐 1192년 기 드 뤼지냥의 영주령이 되었고(지도는 1192년부터 키프로스 항목), 기의 동생 아모리(에메리)가 1197년 왕관을 받아 왕국이 된다). 7월 12일 아크레가 항복했으나 몸값 지급이 늦어지자 리처드가 8월 20일 이슬람 포로 약 2,700명을 처형했다(살라딘 쪽도 프랑크인 포로를 처형한 적이 있다). 필리프는 8월 귀국했다. 리처드는 9월 7일 아르수프에서 살라딘을 이겼으나 예루살렘은 치지 못했고, 1192년 9월 2일 야파 휴전으로 해안 도시는 기독교 쪽이, 예루살렘 순례는 보장되는 선에서 끝냈다. 살라딘은 1193년 3월 죽었다."
