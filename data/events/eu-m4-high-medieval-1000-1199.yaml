  sources: ["Timothy Reuter, Germany in the Early Middle Ages, c. 800–1056 (1991)", "Benjamin Arnold, Medieval Germany, 500–1300: A Political Interpretation (1997)", "Constance Brittain Bouchard, 'Burgundy and Provence, 879–1032', The New Cambridge Medieval History vol. 3 (1999)"]

- id: cnut-north-sea-1013
  year: 1013
  endYear: 1035
  title:
    ko: "크누트의 북해 제국: 잉글랜드·덴마크·노르웨이(1013~1035)"
  summary:
    ko: "덴마크 왕 스벤 1세 튜구스케그는 1013년 잉글랜드를 정복해 1013년 12월에 왕으로 인정받았고, 쫓겨난 애설레드 2세는 노르망디로 달아났다. 스벤은 1014년 2월 죽었으나 아들 크누트가 1015년 다시 쳐들어와 애설레드의 아들 에드먼드 아이언사이드와 싸웠다. 1016년 10월 18일 애싱던(애산둔) 전투에서 크누트가 이기고 땅을 나눠 갖기로 했으나 에드먼드가 11월 말 죽어 크누트가 잉글랜드 전체의 왕이 되었다. 1017년 애설레드의 미망인 노르망디의 엠마와 혼인했고, 1018년에는 잉글랜드에서 8만 파운드가 넘는 데인겔드를 거둔 뒤 함대 대부분을 돌려보냈다. 같은 해 형 하랄 2세가 죽자 덴마크 왕위도 이었다(1018 무렵). 1026년 무렵 헬게오강에서 스웨덴·노르웨이 연합과 싸웠고(승패는 사료마다 갈린다), 1028년 노르웨이의 올라프 2세를 몰아내 노르웨이 왕이 되었다. 올라프는 돌아오다가 1030년 스티클레스타드에서 크누트 편에 선 노르웨이 농민군과 귀족에게 져 죽었다. 1031년에는 스코틀랜드 왕 맬컴 2세가 크누트에게 머리를 숙였다고 『앵글로색슨 연대기』가 적는다. 1035년 11월 크누트가 죽자 제국은 곧 갈라져, 노르웨이는 올라프의 아들 망누스가, 덴마크는 하르사크누트가, 잉글랜드는 해럴드 1세가 차지했다. 지도는 잉글랜드를 하나의 잉글랜드 항목으로, 덴마크와 노르웨이는 따로 그린다(동군 연합, 관계 종류가 없어 서술로만 적음)."
  subjects: [england, denmark-medieval, norway-medieval, sweden-early, scotland, normandy-duchy]
