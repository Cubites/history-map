- id: andrei-bogolyubsky-1157
  year: 1157
  endYear: 1181
  title:
    ko: "블라디미르-수즈달의 부상: 안드레이 보골륩스키의 키예프 약탈(1169)과 큰 둥지 프세볼로드"
  summary:
    ko: "유리 돌고루키(1157년 죽음, 모스크바는 1147년 연대기에 처음 나온다)의 아들 안드레이 보골륩스키(재위 1157~1174)는 수즈달 지방의 공이 되어 도읍을 로스토프에서 블라디미르로 옮기고 보골류보보에 궁을 지었다. 1164년과 1172년 볼가 불가리아 원정에 나섰다. 1169년 3월 그는 스몰렌스크의 로스티슬라비치 가문 등 11명의 공이 모인 연합군을 보내 키예프를 점령하고 사흘 동안 약탈하게 했다(성당과 수도원이 털렸고 주민이 포로가 되었다고 연대기가 적는다). 동생 글레프를 키예프 공에 앉히고 자신은 블라디미르에 머물렀는데, 키예프에 살지 않는 공이 대공 자리를 쥔 첫 사례였다. 1170년 초 노브고로드를 쳤다가 졌다(노브고로드 전승은 '징표의 성모' 성화상의 기적을 전한다). 안드레이는 1174년 6월 28~29일 보야르들에게 보골류보보에서 암살되었다. 동생 미하일(미할코, 1174~1176)을 거쳐 또 다른 동생 프세볼로드 3세 '큰 둥지'(재위 1176~1212)가 뒤를 이어 랴잔(1177~1178년 원정)과 노브고로드를 누르고 블라디미르-수즈달을 북동 루스의 중심으로 만들었다. 1178년 우스튜그가 연대기에 처음 나오고(지도는 1178년부터 루스 땅으로 그린다), 1181년 노브고로드 사람들이 뱌트카를 세웠다는 전승이 있다(지도는 1181년부터 뱌트카 땅)."
  subjects: [rus-principalities, novgorod-republic, smolensk-principality, ryazan, volga-bulgaria, vyatka]
