- id: aragon-barcelona-1112
  year: 1112
  endYear: 1164
  title:
    ko: "아라곤과 바르셀로나의 연합: 사라고사(1118)에서 페트로닐라의 혼인(1137)과 알폰스 2세(1164)까지"
  summary:
    ko: "1112년 바르셀로나 백작 라몬 베렝게르 3세가 프로방스의 상속녀 두스와 혼인하면서 프로방스 계승권을 얻었다(지도는 1112년에 프로방스 백국의 가문이 보소 가문에서 바르셀로나 가문으로 바뀐 것으로 그린다). 아라곤과 나바라의 왕 알폰소 1세 '전투왕'은 1118년 12월 십자군 지원병을 얻어 사라고사를 함락하고 도읍으로 삼았으며 1119년 투델라도 차지했다. 그는 1134년 7월 프라가에서 알모라비드에 져 그해 9월 죽으면서 왕국을 기사단들에게 남긴다는 유언을 했으나 귀족들이 따르지 않았다. 나바라는 가르시아 라미레스가 다시 일으켜 아라곤과 갈라섰다. 아라곤은 알폰소의 동생 수도사 라미로 2세(재위 1134~1137)가 이었고, 1136년 딸 페트로닐라가 태어나자 1137년 8월 바르셀로나 백작 라몬 베렝게르 4세와 약혼시켰다. 라몬 베렝게르는 '아라곤의 군주'로서 바르셀로나 백국과 아라곤 왕국을 함께 다스렸고(두 나라가 각자의 법을 유지한 동군 연합), 알모라비드가 무너지고 제2차 타이파가 선 틈에 1148년 12월 토르토사(제노바 십자군과 함께)와 1149년 10월 레리다를 빼앗아 에브로강 하류까지 넓혔다. 1162년 라몬이 죽은 뒤 페트로닐라가 1164년 아들 알폰스 2세에게 왕위를 넘겨 아라곤 연합 왕국이라는 이름이 굳었다. 지도는 바르셀로나 백국의 카탈루냐를 1137년에 아라곤 색으로, 토르토사를 1149년에, 테루엘을 1171년에 더한다."
  subjects: [aragon-early, aragon, barcelona-county, provence-early, provence-barcelona, navarre, almoravids, taifas-second]
