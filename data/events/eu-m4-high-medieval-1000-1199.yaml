- id: wendish-crusade-1147
  year: 1147
  endYear: 1185
  title:
    ko: "벤드 십자군과 엘베강 동쪽 슬라브의 정복: 도빈(1147)에서 아르코나(1168)·포메른(1181·1185)까지"
  summary:
    ko: "1147년 3월 프랑크푸르트 제국 회의에서 작센 제후들이 제2차 십자군에 가는 대신 엘베강 너머의 이교도 슬라브인(벤드)을 치기로 했고, 교황 에우제니우스 3세는 이를 십자군으로 인정했다. 베르나르는 편지에 '그들이 개종하거나 사라질 때까지'라고 썼다고 전한다. 작센 공작 하인리히 사자공, 브란덴부르크의 알브레히트 곰공, 브레멘 대주교, 덴마크의 스벤 3세와 크누드 5세, 폴란드의 미에슈코 3세 등이 참가해 1147년 여름 오보드리트의 도빈과 포메른의 데민을 포위했다. 슬라브인들은 이름뿐인 세례를 받았고 십자군은 큰 성과 없이 물러났다. 알브레히트는 1157년 브란덴부르크 변경백을 칭했다(지도는 1157년 헤벨리 땅을 제국으로 옮긴다). 하인리히 사자공은 1160년 오보드리트 공 니클로트가 죽자 메클렌부르크를 차지했고(지도는 1160년), 1167년 니클로트의 아들 프리비슬라프에게 영지로 돌려주었다. 덴마크 왕 발데마르 1세와 압살론 주교는 1168년 6월 뤼겐섬의 아르코나를 함락해 스반테비트 신전을 헐고 뤼겐의 군주 야로마르를 신하로 개종시켰다. 포메른 공 보기슬라프 1세는 1181년 제국 공작이 되었다가(지도는 1181년 서슬라브 부족 묶음을 끝낸다) 1185년 덴마크의 크누드 6세에게 신종했다. 이 과정에서 십자군과 제후의 군대는 서슬라브인의 신전과 마을을 파괴하고 주민을 강제로 개종시키거나 노예로 삼았다. 슬라브 해적도 덴마크와 작센 해안을 약탈했다. 홀슈타인의 아돌프 2세가 1143년 뤼베크를 세운 것처럼 독일계 이주민이 들어오는 동방 식민이 이어졌다."
  subjects: [slavic-tribes, holy-roman-empire, denmark-medieval, polish-duchies, papal-states]
  links:
