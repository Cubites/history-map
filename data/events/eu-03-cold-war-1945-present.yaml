- id: warsaw-pact-1955
  year: 1955
  title:
    ko: 서독의 나토 가입과 바르샤바 조약 기구
  summary:
    ko: "앞서 유럽 방위 공동체가 무산되자 서방은 1954년 10월 파리 협정을 맺어 서독의 점령 상태를 끝내고 서독군을 나토 안에서 창설하게 했다. 협정이 발효된 1955년 5월 5일 서독은 주권을 되찾았고 9일 나토에 가입했다(연방군 창설은 11월). 이에 맞서 소련은 5월 14일 폴란드·동독·체코슬로바키아·헝가리·루마니아·불가리아·알바니아와 바르샤바 조약을 맺고 통합 군사 사령부를 두었다. 하루 뒤인 5월 15일 미국·영국·프랑스·소련은 오스트리아 국가 조약에 서명해 점령을 끝냈고, 오스트리아는 10월 영세 중립을 선언했다. 7월에는 4개국 정상이 제네바에서 전후 처음 만났으나 독일 통일 문제는 풀리지 않았다. 9월 아데나워가 모스크바를 찾아 소련과 국교를 맺고, 소련에 남아 있던 독일군 포로 약 1만 명을 돌려받기로 했다. 10월에는 1947년부터 프랑스가 보호령으로 떼어 두었던 자르에서 파리 협정에 담긴 자르의 '유럽화' 규약이 주민 투표로 부결되어, 자르는 1957년 1월 서독의 주가 되었다. 유럽은 두 군사 동맹으로 나뉘었다."
