  title:
    ko: 체코와 슬로바키아의 분리 (벨벳 이혼)
  summary:
    ko: "벨벳 혁명(1989) 뒤 체코슬로바키아에서는 연방의 권한과 나라 이름(1990년 '하이픈 논쟁')을 두고 체코와 슬로바키아의 갈등이 커졌다. 1992년 6월 총선에서 체코에서는 빠른 시장 경제 전환을 내건 클라우스의 시민 민주당이, 슬로바키아에서는 더 큰 자치를 내건 메치아르의 민주 슬로바키아 운동이 이겼다. 두 지도자는 연방 유지에 합의하지 못했고, 7월 17일 슬로바키아 의회가 주권 선언을 채택하자 분리에 반대한 하벨 대통령은 물러났다. 9월 슬로바키아 헌법이 채택되고, 11월 25일 연방 의회가 연방 해체에 관한 헌법률을 통과시켜 1993년 1월 1일 체코 공화국과 슬로바키아 공화국이 평화롭게 갈라섰다. 국민 투표는 치르지 않았고, 여론 조사에서는 두 지역 모두 분리 찬성이 절반에 못 미쳤다. 두 나라는 연방 재산과 군대를 나누고 2월 화폐도 나눴으며, 1월 19일 함께 유엔에 가입했다. 하벨은 1월 체코 대통령으로 뽑혔다. 체코는 1999년, 슬로바키아는 2004년 북대서양 조약 기구에 들어갔고 두 나라 모두 2004년 유럽 연합에 가입했다. 한국은 1990년 체코슬로바키아와 수교했고, 1993년 두 나라와 각각 외교 관계를 이었다."
  subjects: [czechia, slovakia-republic]
  tags: [politics]
