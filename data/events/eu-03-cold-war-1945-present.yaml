- id: berlin-blockade-1948
  year: 1948
  endYear: 1949
  title:
    ko: 베를린 봉쇄와 공수 작전
  summary:
    ko: "독일 처리를 두고 4개국의 의견이 엇갈리자 미국·영국·프랑스는 서방 점령 지구를 묶어 서독 국가를 세우기로 하고, 1948년 6월 20일 서방 지구에서 새 화폐 도이치 마르크를 내놓는 화폐 개혁을 했다. 소련은 6월 24일 소련 지구 안에 섬처럼 놓인 서베를린으로 가는 철도·도로·수로를 모두 막았다(베를린 봉쇄). 미국·영국은 비행기로 식량과 석탄을 실어 나르는 공수 작전으로 맞섰다. 봉쇄 중이던 11월 30일에는 베를린 시 정부도 갈라져 소련 관리 구역(동베를린)에 따로 시 정부가 들어섰다. 서방이 물러서지 않자 소련은 1949년 5월 12일 봉쇄를 풀었고, 공수 작전은 그 뒤에도 9월까지 이어져 모두 27만여 차례 비행하며 230만 톤 넘는 물자를 날랐다. 봉쇄는 독일의 분단을 굳히고 서유럽이 미국과 군사 동맹을 맺는 계기가 되었다."
  subjects: [soviet-union, usa, uk, france, berlin-western-sectors, germany-zone-su, germany-zone-us, germany-zone-uk, germany-zone-fr, berlin-soviet-sector]
