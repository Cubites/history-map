- id: karabakh-movement-1988
  year: 1988
  endYear: 1991
  title:
    ko: 나고르노카라바흐 분쟁의 시작
  summary:
    ko: "나고르노카라바흐는 아르메니아계 주민이 4분의 3쯤 되는 산악 지대로, 1920년대 초 소련 당국이 아제르바이잔 SSR 안의 자치주로 정했다. 고르바초프의 개방 정책 속에 1988년 2월 20일 자치주 의회가 아르메니아 SSR로 옮겨 달라고 결의하고 예레반에서 대규모 시위가 일어났으나, 소련 지도부는 이를 받아들이지 않았다. 2월 27~29일 아제르바이잔의 숨가이트에서는 아제르바이잔인 폭도가 아르메니아인을 습격해 소련 공식 집계로 32명(아르메니아인 26명, 아제르바이잔인 6명)이 숨졌다(숨가이트 포그롬). 그 뒤 두 공화국에서 상대 민족을 몰아내는 일이 잇달아, 1988~1990년 아르메니아에서는 아르메니아인 폭도의 습격과 위협 속에 아제르바이잔인 약 17만~20만 명이 쫓겨났다(1988년 11월 구가르크 등에서 아제르바이잔인이 살해됨. 사망자 수는 소련 공식 집계와 아제르바이잔 쪽 주장이 크게 엇갈림. 추산). 아제르바이잔에서도 아제르바이잔인 폭도의 습격과 위협 속에 아르메니아인 약 30만~35만 명이 쫓겨났다(1988년 11월 키로바바드 등. 추산). 1990년 1월 12일부터 바쿠에서 아제르바이잔인 폭도가 아르메니아인을 공격해 수십 명(추산 48~90명)이 숨지자(바쿠 포그롬), 소련군이 1월 19~20일 바쿠에 들어와 아제르바이잔 인민 전선을 진압하며 시민 130~150명을 죽였다('검은 1월'). 1991년 4월 말부터 6월 무렵까지는 소련군과 아제르바이잔 내무군이 카라바흐 둘레의 아르메니아계 마을 주민 1만 7천여 명을 강제로 쫓아내며 수십 명을 죽였다(고리 작전). 소련이 무너지던 1991년 9월 2일 카라바흐의 아르메니아계 지도부는 '나고르노카라바흐 공화국'을 선포했고, 아제르바이잔은 11월 자치주를 없앴다. 12월 아제르바이잔계 주민이 참여하지 않은 주민 투표로 독립을 내세웠으나, 어느 나라도 승인하지 않았다."
  subjects: [soviet-union]
  tags: [politics, society]
  sources: ["휴먼 라이츠 워치 「Bloodshed in the Caucasus: Escalation of the Armed Conflict in Nagorno Karabakh」(1992)", "Thomas de Waal, Black Garden: Armenia and Azerbaijan through Peace and War"]

- id: revolutions-1989
  year: 1989
  title:
    ko: 1989년 동유럽 혁명
  summary:
    ko: "고르바초프의 소련이 개입하지 않겠다는 뜻을 보이자 동유럽 공산 정권이 잇따라 무너졌다. 폴란드에서는 2~4월 정부와 연대 노조가 원탁 회의를 열어 연대 노조를 다시 합법화하고 부분적 자유선거를 치르기로 했고, 6월 선거에서 연대 노조가 자유롭게 겨룬 의석을 거의 다 차지해 8월 마조비에츠키가 동유럽 첫 비공산당 총리가 되었다. 헝가리는 5월 오스트리아 국경의 철조망을 걷기 시작했고 6월 너지 임레의 장례를 다시 치렀으며, 9월 동독인들이 국경을 넘어 서방으로 가도록 허용했다. 동독에서도 탈출과 시위가 이어져 11월 9일 베를린 장벽이 열렸다. 체코슬로바키아에서는 11월 17일 프라하의 학생 시위를 경찰이 진압한 것을 계기로 대규모 시위와 총파업이 일어나 공산당이 권력을 내놓았고, 12월 하벨이 대통령에 뽑혔다(벨벳 혁명). 불가리아에서는 11월 지프코프가 물러났다. 루마니아에서는 12월 티미쇼아라의 시위를 보안 경찰과 군이 발포로 진압하자 반정부 봉기가 부쿠레슈티로 번졌고, 군이 시위대 편에 서면서 달아나던 차우셰스쿠 부부가 붙잡혀 12월 25일 군사 재판 뒤 총살되었다. 루마니아에서는 이 과정에서 1천 명 넘게 숨졌다. 소련 안에서도 8월 23일 독소 불가침 조약 50주년을 맞아 에스토니아·라트비아·리투아니아 주민 약 200만 명이 세 수도를 잇는 600km 넘는 인간 사슬(발트의 길)을 만들어 독립 회복을 요구했다. 12월 몰타에서 만난 미국의 부시 대통령과 고르바초프는 냉전 뒤의 새 관계를 이야기했다."
  subjects: [poland, hungary, east-germany, czechoslovakia, bulgaria, romania, austria-republic, soviet-union, usa, estonia, latvia, lithuania]
  links:
    - { from: hungary, to: austria-republic, note: "국경 철조망 철거 (1989.5)" }
    - { from: hungary, to: east-germany, note: "동독인의 서방 출국 허용 (1989.9)" }
