- id: geneva-conference-1954
  year: 1954
  title:
    ko: 제네바 회의(1954)와 한국 문제
  summary:
    ko: "6·25 전쟁의 정전 협정(1953)에 따라 한반도 문제를 정치적으로 풀기 위한 회의가 1954년 4월 26일 스위스 제네바에서 열렸다. 한국과 유엔 참전국 15개국, 북한·중국·소련 등 19개국이 참석했다. 변영태 외무 장관이 이끈 한국 대표단은 대한민국 헌법 절차에 따라 남북한 총선거를 치르고 중국군이 선거 한 달 전까지 물러나야 한다고 주장했고, 북한의 남일 외무상은 유엔을 빼고 남북이 같은 수로 꾸리는 '전조선 위원회'가 선거를 맡자고 맞섰다. 유엔의 권위와 외국군 철수를 두고 의견이 좁혀지지 않자 6월 15일 유엔 참전국들이 16개국 선언을 내고 회의를 끝냈으며, 한국 문제는 다시 유엔으로 넘어갔다. 같은 회의에서 다룬 인도차이나 문제는 5월 7일 디엔비엔푸 요새가 베트민군에 함락된 뒤 6월 프랑스에 들어선 망데스프랑스 내각이 협상을 서둘러, 7월 21일 북위 17도선을 경계로 베트남을 잠정적으로 나누고 2년 뒤 총선거로 통일한다는 휴전 협정이 맺어졌다. 미국과 베트남국은 최종 선언에 동의하지 않았고, 총선거는 치러지지 않았다."
