- id: ostpolitik-1969
  year: 1969
  endYear: 1973
  title:
    ko: 브란트의 동방 정책
  summary:
    ko: "1969년 10월 서독 총리가 된 사회 민주당의 브란트는 동독의 존재를 받아들이고 소련·동유럽과 관계를 개선해 분단의 고통을 줄이자는 동방 정책을 폈다('접근을 통한 변화'). 1970년 8월 소련과 모스크바 조약을, 12월 폴란드와 바르샤바 조약을 맺어 오데르-나이세선을 포함한 전후 국경을 무력으로 바꾸지 않겠다고 약속했다. 바르샤바를 찾은 브란트는 게토 봉기 기념비 앞에 무릎을 꿇어 나치 독일의 범죄를 사죄했다. 1971년 미국·영국·프랑스·소련은 베를린 4개국 협정으로 서베를린과 서독 사이의 통행을 보장했고, 1972년 12월 동서독은 기본 조약을 맺어 대등한 관계와 교류 확대에 합의했다(대사관 대신 상주 대표부를 둠). 1973년 9월 동서독은 유엔에 함께 가입했다. 브란트는 1971년 노벨 평화상을 받았다. 데탕트 속에 남북도 7·4 남북 공동 성명(1972)을 발표했고, 한국 정부는 6·23 선언(1973)으로 북한의 국제기구 참여와 남북한 유엔 동시 가입을 반대하지 않겠다고 밝혀, 서독의 할슈타인 원칙처럼 북한과 수교한 나라와는 관계를 맺지 않던 외교 원칙을 바꾸었다. 북한은 이것이 분단을 굳힌다며 반대했다."
