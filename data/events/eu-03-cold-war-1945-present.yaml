- id: karabakh-war-1992
  year: 1992
  endYear: 1994
  title:
    ko: 1차 나고르노카라바흐 전쟁
  summary:
    ko: "소련이 해체되자 카라바흐의 싸움은 독립한 아르메니아·아제르바이잔이 맞선 전쟁으로 커졌다(시작은 '나고르노카라바흐 분쟁의 시작' 참고). 1992년 2월 25~26일 카라바흐의 아르메니아계 무장 세력은 독립 국가 연합 제366 연대 일부의 지원을 받아 호잘리를 점령하며 피란하던 아제르바이잔인 주민을 학살했다(아제르바이잔 정부 집계 613명. 휴먼 라이츠 워치는 1994년 보고서에서 약 200명으로 보되 500~1,000명일 수도 있다고 함). 4월에는 아제르바이잔군이 마라가 마을의 아르메니아계 주민 수십 명을 학살했다. 아르메니아계 세력은 5월 슈샤를 점령하고 라친을 차지해 아르메니아와 잇는 길(라친 회랑)을 열었다. 아제르바이잔군이 1992년 여름 반격으로 북부 일부를 되찾았으나, 1993년 아르메니아계 세력이 켈바자르·아그담 등 카라바흐 밖의 아제르바이잔 땅 7개 구로 밀고 나가자 유엔 안전 보장 이사회는 네 차례 결의(822·853·874·884호)로 아제르바이잔의 영토 보전을 재확인하고 점령군의 철수를 요구했다. 아르메니아 정부는 카라바흐 주민의 자위라고 했으나 병력과 무기를 보냈다. 1994년 5월 러시아의 중재로 비슈케크 의정서가 나와 12일 휴전이 이루어졌다. 전쟁으로 2만~3만 명이 숨졌고, 카라바흐와 주변 구에서 쫓겨난 아제르바이잔인 60만 명 안팎을 비롯해 앞서 두 나라에서 서로 쫓겨난 사람까지 피란민은 100만 명을 넘었다(추산)."
