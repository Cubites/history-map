- id: nato-1949
  year: 1949
  endYear: 1952
  title:
    ko: 북대서양 조약 기구의 결성
  summary:
    ko: "체코슬로바키아 정변(1948년 2월)으로 소련의 위협을 느낀 서유럽은 3월 영국·프랑스와 베네룩스 3국의 브뤼셀 조약으로 서로 지키기로 했고, 베를린 봉쇄가 이어지자 미국을 끌어들이려 했다. 1949년 4월 4일 미국·캐나다와 서유럽 10개국(영국·프랑스·벨기에·네덜란드·룩셈부르크·이탈리아·포르투갈·덴마크·노르웨이·아이슬란드)이 워싱턴에서 북대서양 조약을 맺었다. 한 나라에 대한 무력 공격을 모두에 대한 공격으로 보고 함께 대응한다(5조)는 집단 방위 조약으로, 미국이 평화 시에 유럽과 맺은 첫 군사 동맹이었다. 1949년 8월 소련이 원자 폭탄 실험에 성공하고 1950년 6·25 전쟁이 터지자 동맹은 통합 군사 사령부를 갖춘 기구(NATO)로 커졌고, 1952년 그리스와 튀르키예가 가입했다. 6·25 전쟁은 서독을 재무장시켜 서방 방위에 참여시키는 문제를 서유럽의 큰 쟁점으로 만들었다."
  subjects: [usa, uk, france, belgium, netherlands, luxembourg, italy-republic, portugal, denmark, norway, iceland, greece, turkey, soviet-union, west-germany]
