# ── 냉전의 끝 (1985 ~ 1991) ─────────────────────

- id: perestroika-1985
  year: 1985
  endYear: 1991
  title:
    ko: 고르바초프의 개혁·개방과 신사고 외교
  summary:
    ko: "1985년 3월 소련 공산당 서기장이 된 고르바초프는 침체한 경제를 살리려 개혁(페레스트로이카)과 개방(글라스노스트)을 내걸었다. 1986년 4월 우크라이나 공화국의 체르노빌 원자력 발전소 폭발 사고를 처음에 숨기려다 비판받은 뒤 언론 통제를 크게 풀었고, 반체제 인사 사하로프를 유배에서 풀어 주었으며, 1989년에는 경쟁 선거로 인민 대표 대회를 뽑았다. 외교에서는 '신사고'를 내세워 1987년 12월 미국과 중거리 핵전력(INF) 조약을 맺어 한 종류의 핵미사일을 처음으로 모두 없애기로 했고, 1989년 2월 아프가니스탄에서 군대를 다 뺐으며, 동유럽 나라들이 스스로 길을 정하도록 내버려 두었다. 아시아에서도 블라디보스토크(1986)와 크라스노야르스크(1988) 연설로 관계 개선을 내세웠고, 서울 올림픽(1988)에 참가한 뒤 한국의 북방 외교에 응했다. 1990년 6월 샌프란시스코에서 노태우 대통령과 정상 회담을 하고 9월 초 셰바르드나제 외무 장관을 평양에 보내 수교 방침을 알렸으나, 북한은 김일성이 그를 만나 주지 않을 만큼 강하게 반발했다. 9월 30일 한소 수교가 이루어졌고, 한국은 1991년 1월 30억 달러 규모의 경제 협력 차관을 약속했으나 소련 해체로 14억 7천만 달러만 제공되었다. 1991년 4월 제주도를 찾은 고르바초프가 한국의 유엔 가입에 대한 이해를 밝히고, 중국도 5월 평양을 찾은 리펑 총리를 통해 거부권을 쓰지 않겠다는 뜻을 전하자, 북한도 5월 27일 유엔 가입 방침을 발표해 9월 남북한이 동시에 가입했다. 그러나 개혁 속에 소련 경제는 더 나빠졌고 공화국들의 독립 요구가 커졌다."
  subjects: [soviet-union, usa, rok, dprk]
