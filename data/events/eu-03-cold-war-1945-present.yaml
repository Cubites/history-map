- id: transnistria-war-1992
  year: 1992
  title:
    ko: 트란스니스트리아 전쟁
  summary:
    ko: "소련 말기 몰다비아 SSR에서 몰도바어(루마니아어)를 국어로 하고 라틴 문자로 쓰게 한 언어법(1989)이 만들어지고 루마니아와 합치자는 움직임이 일자, 러시아어를 쓰는 주민이 많은 드니스테르강 왼쪽(트란스니스트리아)과 남부의 가가우스인이 반발했다. 1990년 9월 트란스니스트리아 지도부는 '프리드네스트로비에 몰다비아 공화국'을 선포했고, 11월 두버사리에서 첫 유혈 충돌이 일어났다. 1991년 8월 몰도바가 독립을 선언한 뒤 몰도바 경찰·군과 트란스니스트리아 무장 세력의 싸움은 1992년 3월 전쟁으로 커졌다. 몰도바 쪽은 루마니아에서 무기와 의용병을, 분리 세력 쪽은 러시아의 카자크 의용병을 지원받았다. 6월 드니스테르강 오른쪽의 벤데르에서 큰 싸움이 벌어지자 그곳에 머물던 옛 소련 제14군(러시아군)이 분리 세력 편에서 끼어들어 몰도바군을 몰아냈다. 7월 21일 러시아의 옐친 대통령과 몰도바의 스네구르 대통령이 모스크바에서 휴전 협정을 맺어 러시아·몰도바·트란스니스트리아 평화 유지군과 공동 통제 위원회를 두었다. 이 전쟁으로 양쪽 합쳐 1천 명 안팎이 숨졌다(추산). 그 뒤 트란스니스트리아는 어느 유엔 회원국에게도 승인받지 못한 채 러시아군이 머무는 분리 지역으로 남았고, 러시아는 1999년 유럽 안보 협력 기구 이스탄불 정상 회의에서 군대와 무기를 빼겠다고 약속했으나 지키지 않았다. 유럽 인권 재판소는 일라슈쿠 판결(2004)에서 러시아가 이 지역을 실효적으로 지배한다고 보았고, 유엔 총회도 2018년 러시아군의 철수를 촉구했다. 몰도바는 1994년 헌법으로 남부의 가가우지아에 자치를 주었다. 2025년 1월 우크라이나를 거치는 러시아 가스 공급이 끊기자 트란스니스트리아는 큰 에너지 위기를 겪었다."
  subjects: [moldova, transnistria, russia-fed, romania]
