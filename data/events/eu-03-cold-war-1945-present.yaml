- id: decolonization-1947
  year: 1947
  endYear: 1949
  title:
    ko: 인도의 독립과 탈식민지화의 시작
  summary:
    ko: "2차 대전으로 힘이 빠진 영국은 인도의 독립 요구를 더 누를 수 없었다. 국민 회의와 무슬림의 나라를 따로 세우자는 무슬림 연맹이 맞서자, 마지막 인도 부왕(총독) 마운트배튼은 영국령 인도를 둘로 나누는 안을 내놓았고 1947년 8월 14일 파키스탄이, 15일 인도가 독립했다. 급히 그은 국경을 넘어 1,000만 명이 넘는 힌두교도·시크교도와 무슬림이 서로 반대쪽으로 피란하는 동안 종교 공동체 사이의 학살로 수십만에서 200만 명에 이르는 사람이 죽은 것으로 추산되며, 이듬해 1월 비폭력 운동을 이끈 간디도 힌두 민족주의자에게 암살되었다. 1948년에는 미얀마(버마)·스리랑카(실론)가 독립했다. 팔레스타인에서는 1947년 11월 유엔의 분할안 뒤 유대인과 아랍인 사이에 내전이 벌어졌고, 영국이 위임 통치를 끝내고 물러난 1948년 5월 이스라엘이 건국을 선포하자 주변 아랍 나라들과의 전쟁으로 번졌다. 1947년 말부터 1949년까지 팔레스타인 아랍인 70만여 명이 유대인 무장 조직과 이스라엘군에 쫓겨나거나 전쟁을 피해 고향을 떠났다(나크바). 인도네시아에서는 독립을 선포한 공화국과 네덜란드가 싸운 끝에 네덜란드가 1949년 12월 주권을 넘겼고, 프랑스는 1946년 말부터 베트남 독립 동맹(베트민)과 인도차이나 전쟁을 벌였다."
  subjects: [uk, netherlands, france]
  tags: [politics, war]
  sources: ["「인도 독립법」(1947)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: paris-peace-trieste-1947
  year: 1947
  endYear: 1954
  title:
    ko: 파리 강화 조약과 트리에스테 자유 지역
  summary:
    ko: "1947년 2월 10일 연합국은 파리에서 독일 편에 섰던 이탈리아·루마니아·헝가리·불가리아·핀란드와 강화 조약을 맺었다. 이탈리아는 식민지를 모두 내놓고 도데카니사 제도를 그리스에, 이스트라반도 대부분과 리예카·자다르를 유고슬라비아에, 탕드·라브리그를 프랑스에 넘겼으며 배상금을 물었다. 루마니아는 북트란실바니아를 되찾았으나 베사라비아·북부코비나를 소련에, 남도브루자를 불가리아에 넘긴 것이 확정되었고, 핀란드는 1940년의 할양에 더해 페차모를 소련에 내주었다. 이탈리아와 유고슬라비아가 다툰 트리에스테 일대에는 유엔 안전 보장 이사회가 보장하는 자유 지역을 세우기로 했으나, 총독을 누구로 할지 합의하지 못해 북쪽 A 구역(트리에스테 시)은 영국·미국 군정이, 남쪽 B 구역은 유고슬라비아 군정이 계속 다스렸다. 1948년 티토가 코민포름에서 쫓겨나 서방과 가까워지면서 문제는 서방과 유고슬라비아의 협상으로 바뀌었고, 1953년 이탈리아와 유고슬라비아가 국경에 군대를 모으는 위기를 거친 뒤 1954년 10월 런던 양해 각서로 A 구역은 이탈리아, B 구역은 유고슬라비아가 맡게 되었다. 국경은 1975년 오시모 조약으로 확정되었다. 앞서 이탈리아 파시스트 정권은 이 지역의 슬로베니아인·크로아트인을 억누르고 점령지에서 학살과 강제 수용을 벌였으며, 전쟁 끝 무렵에는 유고슬라비아 파르티잔과 보안 기관이 이탈리아계 등 수천 명(추산 3천~5천 명)을 죽였다(포이베 학살). 이스트라와 달마티아의 이탈리아계 주민 수십만 명은 유고슬라비아를 떠났다."
  subjects: [italy-republic, yugoslavia, trieste-zone-a, trieste-zone-b, uk, usa, greece, france]
