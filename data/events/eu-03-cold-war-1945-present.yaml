- id: russia-ukraine-war-2022
  year: 2022
  endYear: 2026
  title:
    ko: 러시아의 우크라이나 전면 침공
  summary:
    ko: "2022년 2월 21일 러시아는 도네츠크·루한스크 '인민 공화국'의 독립을 승인했고, 24일 푸틴 대통령은 '특별 군사 작전'을 선언하며 북쪽(벨라루스)·동쪽·남쪽(2014년 러시아가 병합을 선언한 크림)에서 우크라이나를 전면 침공했다. 젤렌스키 대통령의 우크라이나는 수도 키이우를 지켜 냈고, 3월 말 러시아군이 북부에서 물러난 뒤 부차 등에서 러시아군이 점령 중 민간인을 살해한 사실이 드러났다. 남부의 마리우폴은 석 달 가까운 포위와 폭격 끝에 5월 함락되었다. 9월 우크라이나군이 하르키우주 대부분을 되찾자, 러시아는 점령지에서 '주민 투표'를 치른 뒤 9월 30일 도네츠크·루한스크·자포리자·헤르손 4개 주의 병합을 선언했다. 유엔 총회는 10월 12일 이를 무효라고 결의했고(찬성 143), 11월 우크라이나군은 헤르손시를 되찾았다. 그 뒤 전선은 동부와 남부에서 소모전으로 굳어졌고, 2023년 5월 러시아군(바그너 그룹 포함)이 오랜 공방 끝에 바흐무트를 차지했다. 국제 형사 재판소는 2023년 3월 점령지의 어린이를 러시아로 불법 이송한 혐의로 푸틴에게 체포 영장을 냈다. 수백만 명이 나라 밖으로 피란했고, 미국과 유럽 나라들은 우크라이나에 무기와 자금을 지원하며 러시아를 제재했다. 핀란드(2023)와 스웨덴(2024)은 오랜 중립·비동맹을 버리고 나토에 가입했다. 2024년 6월 러시아와 북한은 한쪽이 공격받으면 군사 원조를 한다는 포괄적 전략 동반자 관계 조약을 맺었고, 북한은 그해 가을부터 1만여 명의 군대를 보내 우크라이나군이 진격해 들어온(2024년 8월~2025년 봄) 러시아 쿠르스크주의 싸움에 투입했다. 두 나라는 2025년 4월 파병을 공식 인정했고, 한국·미국 등은 북한이 포탄과 탄도 미사일도 넘겼다고 밝혔다. 포로 교환은 2022년부터 튀르키예·아랍 에미리트 등의 중재로 여러 차례 이루어졌다. 2025년부터는 미국이 협상을 중재했고(2026년 1~2월 아부다비·제네바 3자 회담 등), 2026년에는 부활절 휴전(4월), 미국이 중재한 사흘 휴전(5월), 미국 특사 방문 중 양국 수도 공습 중단(9월) 같은 짧은 휴전도 있었다. 그러나 2026년 10월 현재 전쟁은 끝나지 않았다."
