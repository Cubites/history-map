    - { from: soviet-union, to: west-germany, note: "2+4 조약, 통일 독일의 나토 잔류 수용 (1990)" }
    - { from: west-germany, to: poland, note: "2+4 조약, 오데르-나이세 국경 확정 (1990.9)" }
