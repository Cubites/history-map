- id: karabakh-exodus-2023
  year: 2023
  endYear: 2024
  title:
    ko: 아제르바이잔의 카라바흐 장악과 아르메니아계 주민의 이주
  summary:
    ko: "2022년 12월부터 아제르바이잔 정부의 지원을 받은 '환경 운동가'들이 카라바흐와 아르메니아를 잇는 라친 회랑을 막았고, 2023년 4월 아제르바이잔이 회랑 입구에 검문소를 세우면서 카라바흐의 아르메니아계 주민 약 12만 명은 식량·의약품·연료가 모자라는 고립 상태에 빠졌다. 국제 사법 재판소는 2023년 2월 아제르바이잔에 회랑의 자유로운 통행을 보장하라는 잠정 조치를 명령했고, 러시아 평화 유지군은 봉쇄를 막지 않았다. 9월 19일 아제르바이잔군이 '대테러 조치'를 내걸고 공세를 펴자 카라바흐 세력은 이튿날 휴전과 무장 해제를 받아들였다. 이 싸움으로 양쪽에서 400명 넘게 숨졌다. 그 뒤 일주일 남짓 사이에 주민 10만 명 넘게(인구의 거의 전부) 라친 회랑을 지나 아르메니아로 떠났고, 9월 25일에는 피란길에 나설 연료를 받으려는 사람들이 모인 연료 창고가 폭발해 200명 넘게 숨졌다. 아제르바이잔은 주민의 권리를 보장하겠다며 스스로 떠난 것이라고 했으나, 아르메니아와 여러 인권 단체는 봉쇄와 공격으로 주민을 몰아낸 인종 청소라고 비판했다. 카라바흐 세력의 샤흐라마냔 대통령은 9월 28일 모든 국가 기관을 2024년 1월 1일까지 해산한다는 포고에 서명했고, 옛 지도자들은 아제르바이잔에 붙잡혀 2026년 2월 바쿠 군사 법원에서 종신형·징역 20년 등을 선고받았다. 러시아 평화 유지군은 2024년 철수했다. 2025년 8월 8일 미국의 중재로 워싱턴에서 두 나라 정상이 공동 선언에 서명하고 외교 장관들이 평화 협정문에 가서명했으며, 유럽 안보 협력 기구의 민스크 그룹도 그해 해체되었다. 그러나 아제르바이잔이 아르메니아 헌법에서 카라바흐 관련 내용을 빼라고 요구하고 있어, 2026년 10월 현재 정식 서명은 이루어지지 않았다(아르메니아는 2026년 6월 총선 뒤에도 개헌 국민 투표 날짜를 잡지 못함)."
