- id: brexit-2016
  year: 2016
  endYear: 2020
  title:
    ko: 영국의 유럽 연합 탈퇴(브렉시트)
  summary:
    ko: "세계 금융 위기(2008)와 유로존 위기, 동유럽 출신 이주 노동자의 증가 속에 영국에서는 유럽 연합의 규제와 이민에 대한 불만이 커졌다. 보수당의 캐머런 총리가 약속한 국민 투표가 2016년 6월 23일 치러져 51.9%가 탈퇴를 지지했다. 잉글랜드·웨일스는 탈퇴, 스코틀랜드·북아일랜드와 런던은 잔류를 더 지지했다. 캐머런이 물러나고 메이 총리가 2017년 3월 탈퇴를 공식 통보했으나, 아일랜드와 북아일랜드 사이에 국경 검문을 되살리지 않는 문제 등으로 의회가 탈퇴 합의안을 거듭 부결했다. 존슨 총리가 새 합의를 맺고 2019년 12월 총선에서 이긴 뒤, 영국은 2020년 1월 31일 유럽 연합을 떠났고 그해 말 전환 기간이 끝났다. 1973년 가입한 지 47년 만이었고, 회원국이 유럽 연합을 탈퇴한 첫 사례였다."
  subjects: [uk, ireland, france, germany]
  tags: [politics, diplomacy]
  sources: ["「유럽 연합 조약」 제50조", "「영국의 유럽 연합·유럽 원자력 공동체 탈퇴 협정」(2019)"]

- id: prespa-agreement-2019
  year: 2019
  endYear: 2020
  title:
    ko: 프레스파 협정과 북마케도니아
  summary:
    ko: "1991년 유고슬라비아에서 독립한 마케도니아 공화국의 이름을 두고, 그리스는 같은 이름의 자기 북부 지방에 대한 영토 요구와 고대 마케도니아 역사의 독점으로 이어질 수 있다며 반대했다. 이 때문에 마케도니아는 '마케도니아 구유고슬라비아 공화국'이라는 임시 이름으로 1993년 유엔에 가입했고, 1995년 잠정 협정으로 그리스가 경제 봉쇄를 풀었다. 그리스의 반대로 나토 가입(2008)과 유럽 연합 가입 협상이 막히자, 2018년 6월 프레스파 호숫가에서 마케도니아의 자에프 총리와 그리스의 치프라스 총리가 함께한 가운데 두 나라 외교 장관이 나라 이름을 '북마케도니아 공화국'으로 바꾸는 대신 그리스가 가입 반대를 거두는 협정에 서명했다. 두 나라 안에서 거센 반대가 있었고 마케도니아의 국민 투표(2018년 9월)는 투표율이 낮아 효력을 얻지 못했으나, 마케도니아 의회가 헌법을 고치고 그리스 의회가 비준해 협정이 2019년 2월 12일 발효되었다. 북마케도니아는 2020년 3월 나토에 가입했다. 유럽 연합 가입 협상은 2022년 시작되었으나, 이번에는 불가리아의 요구에 따라 헌법에 불가리아인을 명시하는 개정이 조건으로 붙었고, 2024년 들어선 정부가 개헌을 거부해 2026년 10월 현재 본격적인 협상 분야는 하나도 열리지 않았다."
  subjects: [north-macedonia, macedonia-republic, greece]
