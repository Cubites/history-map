- id: malta-independence-1964
  year: 1964
  title:
    ko: 몰타의 독립
  summary:
    ko: "1800년부터 영국이 다스린 몰타는 지중해 영국 해군의 기지였고, 2차 대전 중 추축국의 폭격을 견뎌 1942년 섬 전체가 조지 십자 훈장을 받았다. 전후 자치를 얻은 몰타에서는 노동당의 민토프 정부가 영국과의 통합을 내걸고 1956년 국민 투표를 치렀으나, 국민당과 가톨릭교회가 투표 거부를 호소해 투표율이 60%에 못 미쳤고(찬성 77%) 통합은 이루어지지 않았다. 그 뒤 흐름은 독립으로 바뀌어, 국민당의 보르그 올리비에 정부가 1964년 5월 국민 투표(찬성 54.5%)를 거쳐 9월 21일 영국 연방 안의 나라로 독립을 이루었다. 영국과의 방위 협정으로 영국군 기지는 남았으나, 다시 집권한 민토프 정부는 1974년 공화국을 선포하고 1979년 3월 31일 영국군을 모두 내보냈다(자유의 날). 1989년 12월 미국의 부시와 소련의 고르바초프가 몰타 앞바다에서 정상 회담을 열었고, 몰타는 2004년 유럽 연합에 가입했다."
  subjects: [malta, uk]
  links:
    - { from: uk, to: malta, note: "독립 (1964.9), 기지 철수 (1979)" }
  tags: [politics]
  sources: ["「몰타 독립법」(1964)", "「몰타 헌법」(1964)", "Carmel Cassar, A Concise History of Malta"]

- id: east-berlin-affair-1967
  year: 1967
  endYear: 1970
  title:
    ko: 동백림 사건
  summary:
    ko: "1967년 7월 8일부터 중앙정보부는 서독·프랑스 등에 머물던 유학생·교민과 예술가·학자 등 194명이 동베를린의 북한 대사관을 드나들고 평양을 다녀오며 간첩 활동을 했다고 발표했다. 발표에 앞서 6월 중앙정보부 요원들은 현지 정부의 동의 없이 서독에서 16명, 프랑스에서 8명 등 30명을 한국으로 강제 연행했는데, 여기에는 작곡가 윤이상과 화가 이응노도 있었다. 서독 정부는 주권 침해라며 항의 각서를 보내고 한국 대사관 직원의 소환을 요구했으며 경제 협력 사업을 멈추기로 했고, 프랑스도 항의했다. 1·2심에서 사형 선고가 나왔고 대법원이 간첩죄 적용이 잘못되었다며 일부를 파기 환송했으나, 1969년 재상고심에서도 2명의 사형이 확정되었다. 서독 정부와 유럽 음악인들의 석방 요구 속에 이들도 감형되어 1970년 성탄절 특사까지 모두 풀려났다. 2006년 국가정보원 과거사건 진실규명을 통한 발전위원회는 일부 관련자의 북한 접촉은 있었으나 정부가 단순한 대북 접촉과 동조 행위에까지 간첩죄를 무리하게 적용해 사건을 부풀렸다고 밝히고, 불법 연행과 가혹 행위에 대한 사과를 권고했다. 2023년 서울고등법원은 윤이상의 불법 체포·감금을 인정해 재심 개시를 결정했고, 2024년 대법원이 이를 확정했다. 사건은 6·8 총선거의 부정을 규탄하는 시위가 이어지던 때 발표되었다."
  subjects: [rok, west-germany, france, east-germany, dprk]
  links:
