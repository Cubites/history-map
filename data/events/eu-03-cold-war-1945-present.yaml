- id: suez-crisis-1956
  year: 1956
  endYear: 1957
  title:
    ko: 수에즈 위기
  summary:
    ko: "이집트의 나세르 대통령은 미국·영국이 아스완 하이 댐 건설 자금 지원을 거두어들이자 1956년 7월 26일 영국·프랑스 자본이 운영하던 수에즈 운하 회사를 국유화했다. 운하를 되찾고 나세르를 무너뜨리려던 영국(이든 총리)과 프랑스(몰레 총리)는 이스라엘과 비밀리에 계획을 짜, 10월 29일 이스라엘이 시나이반도를 침공하자 이를 구실로 개입해 이집트 비행장을 폭격하고 11월 5~6일 포트사이드 일대에 상륙했다. 그러나 미국은 동맹국의 행동을 공개적으로 반대하며 파운드화를 지원하지 않겠다고 압박했고, 소련도 강경한 경고를 보냈다. 유엔 총회는 이미 11월 2일 휴전과 철수를 결의했고(제997호), 미국의 압박에 두 나라는 11월 6일 휴전하고 12월까지 군대를 뺐으며, 유엔 긴급군이 처음으로 배치되었다. 이든은 이듬해 1월 물러났다. 수에즈 위기는 영국·프랑스가 더는 미국의 뜻을 거스르며 세계 문제를 좌우할 수 없음을 보여 주었고, 아랍 민족주의의 상징이 된 나세르와 소련을 가깝게 했다."
  subjects: [uk, france, usa, soviet-union]
