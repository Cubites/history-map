- id: kosovo-independence-2008
  year: 2008
  endYear: 2013
  title:
    ko: 코소보의 독립 선언
  summary:
    ko: "1999년부터 유엔 임시 행정 아래 있던 코소보의 지위를 두고 유엔 특사 아티사리가 '국제 사회의 감독을 받는 독립'안(2007)을 냈으나, 세르비아가 거부하고 러시아가 안보리에서 반대해 합의가 이루어지지 않았다. 2008년 2월 17일 코소보 의회는 세르비아로부터의 독립을 선언했다. 미국·영국·프랑스·독일 등은 곧 이를 승인했으나, 세르비아는 자기 영토의 일부라며 인정하지 않았고 러시아·중국과 유럽 연합 회원국 가운데 에스파냐·그리스·루마니아·슬로바키아·키프로스도 승인하지 않았다. 승인한 나라는 유엔 회원국의 절반 안팎으로, 승인을 철회했다는 나라도 있어 그 수부터 다투어진다. 세르비아의 요청으로 유엔 총회가 의견을 구하자, 국제 사법 재판소는 2010년 7월 22일 독립 선언이 일반 국제법이나 안보리 결의 1244호를 어기지 않았다는 권고적 의견을 냈다(10 대 4). 다만 코소보가 국가인지, 다른 나라가 승인해야 하는지는 판단하지 않았다. 코소보는 유엔에 가입하지 못했고, 세르비아계가 많이 사는 북부에서는 세르비아의 영향력이 이어졌다. 유럽 연합의 중재로 2013년 4월 세르비아와 코소보는 세르비아계 다수 지자체 공동체를 두고 북부의 경찰·사법을 코소보 체계로 통합하기로 한 브뤼셀 합의를 맺었으나(공동체는 아직 만들어지지 않음), 서로의 지위에 대한 입장은 바뀌지 않았다."
  subjects: [kosovo, kosovo-disputed, serbia-republic, usa, uk, france, germany, russia-fed, spain, greece, romania, slovakia-republic, cyprus, kosovo-un]
