- id: algerian-war-1954
  year: 1954
  endYear: 1962
  title:
    ko: 알제리 전쟁
  summary:
    ko: "프랑스는 인도차이나에서 물러난 뒤에도 100만 명 가까운 유럽계 이주민(피에누아르)이 사는 알제리를 프랑스의 일부로 여겨 독립을 인정하지 않았다. 1954년 11월 1일 민족 해방 전선(FLN)이 각지에서 무장봉기를 일으키자 프랑스는 40만~50만 명에 이르는 군대를 보냈다. 1957년 알제 전투에서 프랑스 공수 부대는 고문과 즉결 처형을 일삼으며 FLN 조직을 무너뜨렸고 이 사실이 알려져 안팎의 비판을 받았으며, FLN도 유럽계 주민과 자신들을 따르지 않는 무슬림을 테러로 공격했다. 1958년 5월 알제리의 군과 유럽계 주민이 본국 정부에 반발해 들고일어나자 제4공화국은 위기에 빠졌고, 드골이 총리로 돌아왔다. 드골은 1959년 알제리의 민족 자결을 인정하는 쪽으로 돌아섰고, 이에 반대한 장군들의 반란(1961)과 비밀 군사 조직(OAS)의 테러가 이어졌다. 1961년 10월에는 파리 경찰이 알제리인 시위대를 진압하며 수십 명 넘게 숨지게 했다. 1962년 3월 에비앙 협정으로 휴전이 이루어졌고, 7월 국민 투표를 거쳐 알제리가 독립했다. 알제리인 사망자는 수십만 명으로 추산되며(알제리 정부는 150만 명이라 함), 독립 뒤 유럽계 주민 대부분이 프랑스로 떠났고 프랑스군에 협력했던 알제리인(하르키) 다수가 FLN 등의 보복으로 살해되었다. 1960년에는 프랑스의 서·중앙아프리카 식민지 등 아프리카 17개 나라가 독립해 '아프리카의 해'로 불렸다."
  subjects: [france]
  tags: [war, politics]
  sources: ["「에비앙 협정」(1962)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]
  places: [{ name: "알제", at: [3.06, 36.75] }]

- id: hungarian-revolution-1956
  year: 1956
  title:
    ko: 헝가리 혁명
  summary:
    ko: "스탈린 비판과 폴란드의 10월에 자극받아 1956년 10월 23일 부다페스트에서 학생과 시민들이 소련군 철수와 자유선거, 개혁파 너지 임레의 복귀를 요구하며 시위했다. 국가 보위대가 방송국 앞의 시위대에 총을 쏘자 시위는 무장봉기로 번졌고, 총리에 오른 너지는 소련군과 휴전하고 복수 정당제를 받아들였으며 11월 1일 바르샤바 조약 기구 탈퇴와 중립을 선언했다. 소련은 11월 4일 대규모 병력으로 부다페스트를 공격해 봉기를 진압하고 카다르 야노시를 앞세운 정부를 세웠다. 이 싸움에서 헝가리인 약 2,500명과 소련군 700여 명이 죽었고, 20만 명 가까운 헝가리인이 오스트리아 등으로 망명했다. 카다르 정권은 그 뒤 봉기 참가자를 200명 넘게 처형했고, 유고슬라비아 대사관에 피신했다가 소련군에 붙잡힌 너지도 1958년 비밀 재판에서 사형을 선고받고 처형되었다. 수에즈 위기에 쏠린 서방은 비난에 그쳤고, 소련이 동유럽의 이탈을 무력으로 막는다는 것이 분명해졌다."
