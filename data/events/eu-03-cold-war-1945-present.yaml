- id: crimea-donbas-2014
  year: 2014
  endYear: 2021
  title:
    ko: 유로마이단과 크림 병합 선언, 돈바스 전쟁
  summary:
    ko: "2013년 11월 우크라이나의 야누코비치 대통령이 유럽 연합과의 협력 협정 서명을 미루고 러시아 쪽으로 기울자 키이우의 독립 광장(마이단)에서 시위가 시작되었다. 1~2월 시위로 시위대 100여 명과 경찰 10여 명이 숨졌는데, 대부분 2월 18~20일 주로 보안군의 발포로 희생되었다. 그 뒤 야누코비치는 수도를 떠났고 의회는 그를 해임했다. 2월 말 표식 없는 러시아군이 크림반도의 의회와 주요 시설을 장악했고, 3월 16일 러시아군의 통제 아래 '주민 투표'가 치러진 뒤 러시아는 3월 18일 크림 병합을 선언했다. 유엔 총회는 3월 27일 우크라이나의 영토 보전을 확인하고 주민 투표가 효력이 없다고 결의했으며(찬성 100, 반대 11), 미국·유럽 연합 등은 러시아를 제재하고 G8에서 배제했다. 4월부터 도네츠크·루한스크주에서는 러시아의 지원을 받은 무장 세력이 '인민 공화국'을 선포하며 우크라이나 정부군과 전쟁을 벌였고, 8월부터는 러시아 정규군도 싸움에 들어와 일로바이스크에서 우크라이나군을 포위했다. 7월 17일 이 지역 상공에서 말레이시아 항공 17편 여객기가 격추되어 298명이 숨졌는데, 국제 합동 조사단은 러시아군 제53 방공 여단의 부크 미사일이 쏜 것이라고 밝혔다. 독일·프랑스가 중재한 민스크 협정(2014년 9월, 2015년 2월)으로 휴전선이 정해졌고 그사이 데발체베도 러시아 쪽 세력에 넘어갔으나, 싸움은 완전히 멈추지 않아, 2022년 초까지 1만 4천 명 넘게 숨졌다."
  subjects: [ukraine, russia-fed, crimea-disputed, donbas-separatist, germany, france, usa]
  links:
