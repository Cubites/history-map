- id: prague-spring-1968
  year: 1968
  endYear: 1969
  title:
    ko: 프라하의 봄
  summary:
    ko: "1968년 1월 체코슬로바키아 공산당 제1서기가 된 둡체크는 '인간의 얼굴을 한 사회주의'를 내걸고 검열을 없애고 언론·집회의 자유를 넓히며 경제 개혁과 연방제를 추진했다(프라하의 봄). 개혁이 공산당 일당 지배를 흔들 것을 걱정한 소련은 8월 20일 밤 폴란드·헝가리·불가리아와 함께 바르샤바 조약 기구 군대 수십만 명을 보내 체코슬로바키아를 점령했다(동독군은 국경에서 대기했다). 시민들은 대개 비폭력으로 저항했으나 침공군의 발포 등으로 그해에만 100명 넘게 숨졌고, 모스크바로 끌려간 둡체크 등 지도부는 개혁을 되돌리는 의정서에 서명해야 했다. 소련은 사회주의 진영 전체의 이익을 위해 한 나라의 주권을 제한할 수 있다고 내세웠다(브레즈네프 독트린). 1969년 1월 대학생 얀 팔라흐가 점령에 항의해 분신했고, 4월 둡체크가 물러난 뒤 후사크 아래에서 개혁파를 몰아내는 '정상화'가 이어졌다. 침공에 반대한 루마니아는 참가하지 않았고, 알바니아는 이를 계기로 바르샤바 조약 기구에서 탈퇴했다."
