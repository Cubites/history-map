- id: may-1968
  year: 1968
  title:
    ko: 68 운동
  summary:
    ko: "1960년대 후반 서유럽과 미국에서는 전후에 태어나 대학이 크게 늘어난 시대에 자란 젊은 세대가 권위주의적인 사회와 베트남 전쟁에 맞서 저항했다. 프랑스에서는 1968년 5월 파리 대학생들이 대학 개혁과 표현의 자유를 요구하며 거리에 바리케이드를 쳤고, 경찰의 강경 진압에 항의해 노동자들이 합류하면서 700만~1,000만 명이 참가한 총파업으로 번졌다. 정부는 최저 임금을 35% 올리는 그르넬 합의안을 내놓았고(현장 노동자들은 처음에 거부) 드골 대통령은 의회를 해산했으며, 6월 총선에서는 드골 지지파가 크게 이겼다. 서독에서는 1967년 6월 시위에 나온 대학생 오네조르크가 경찰의 총에 맞아 숨지고 1968년 4월 학생 운동 지도자 두치케가 피격되면서 시위가 거세졌고, 학생들은 비상사태법과 함께 나치 과거에 침묵한 부모 세대를 비판했다. 이탈리아에서도 학생 운동이 대학을 휩쓸고 1969년 대규모 노동 쟁의('뜨거운 가을')로 이어졌다. 미국에서는 반전 운동과 흑인 민권 운동이 이어졌고 4월 마틴 루서 킹이 암살되었다. 68 운동은 정권을 바꾸지는 못했으나 여성 운동·환경 운동·반권위주의 문화 같은 새로운 사회 운동의 출발점이 되었다."
