    - { from: azerbaijan, to: nagorno-karabakh, note: "4일 전쟁 (2016.4)" }
  tags: [diplomacy, war]
  sources: ["「비슈케크 의정서」(1994)", "「유럽 안보 협력 기구 민스크 그룹 공동 의장국 정상 성명」(2009, 라퀼라)", "유럽 인권 재판소 「치라고프 등 대 아르메니아 판결」(2015)", "유럽 인권 재판소 「사르키샨 대 아제르바이잔 판결」(2015)"]

- id: georgia-frozen-conflicts-1994
  year: 1994
  endYear: 2007
  title:
    ko: 조지아 분리 지역의 동결 (압하지야·남오세티야)
  summary:
    ko: "1994년 5월 모스크바 협정에 따라 6월부터 러시아군으로 이루어진 독립 국가 연합 평화 유지군이 압하지야와 조지아 본토 사이의 인구리강 양쪽에 자리 잡았고, 유엔 조지아 감시단(UNOMIG)이 이를 지켜보았다. 남오세티야에서는 1992년 소치 협정으로 생긴 러시아·조지아·북오세티야 평화 유지군과 공동 통제 위원회, 유럽 안보 협력 기구 사절단 아래 휴전이 이어졌다. 두 분리 세력은 조지아 정부의 통치를 받지 않았으나 어느 나라에게도 승인받지 못했고, 지위 협상은 진전이 없었다(얼어붙은 분쟁). 압하지야에서 쫓겨난 조지아계 주민 20만 명 넘게는 대부분 돌아가지 못했고, 일부가 돌아간 남쪽 갈리 지역에서는 1998년 5월 압하지야 세력과 조지아계 무장 단체의 싸움으로 주민 3만~4만 명이 다시 피란했다. 러시아는 2000년대 들어 두 지역 주민에게 러시아 여권을 대거 나눠 주며 영향력을 넓혔다. 2003년 장미 혁명으로 집권한 사카슈빌리 정부가 2004년 6월 남오세티야와의 경계에 있던 밀수 시장(에르그네티)을 닫자 긴장이 높아져, 8월 조지아군과 남오세티야 세력이 싸워 조지아 군인 12명 등이 숨진 뒤 휴전했다. 2006년 조지아는 압하지야 북동쪽 코도리 계곡 위쪽의 무장 세력을 몰아내고 그곳에 압하지야 망명 행정부를 두었고, 남오세티야 분리 세력이 11월 독립 주민 투표를 치르자 그 안의 조지아계 마을에 친조지아 임시 행정부를 세웠다(2007). 긴장이 높아지는 가운데 2008년 러시아-조지아 전쟁이 일어났다."
  subjects: [abkhazia, south-ossetia, georgia, russia-fed]
  links:
