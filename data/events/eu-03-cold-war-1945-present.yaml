  sources: ["「휴전과 병력 분리에 관한 모스크바 협정」(1994)", "유엔 안전 보장 이사회 결의 제937호(1994)", "유럽 연합 조지아 분쟁 독립 국제 조사 위원회 보고서(타글리아비니 보고서, 2009)"]

- id: kosovo-war-1998
  year: 1998
  endYear: 1999
  title:
    ko: 코소보 전쟁
  summary:
    ko: "알바니아계 주민이 대부분인 세르비아의 코소보 자치주는 1989년 밀로셰비치 정부에 자치권을 빼앗긴 뒤 비폭력 저항을 이어 왔다. 1998년 무장 단체 코소보 해방군(KLA)과 유고슬라비아 연방 공화국의 군·경찰 사이의 싸움이 커지면서 많은 알바니아계 주민이 집을 잃었다. 1999년 1월 라착 마을에서 알바니아계 주민 45명이 세르비아 보안군에게 살해된 뒤 랑부예 협상마저 결렬되자, 나토는 3월 24일 유엔 안보리의 승인 없이 유고슬라비아 연방 공화국을 공습하기 시작해 78일 동안 이어 갔다. 러시아는 공습에 강하게 반대했다. 공습 동안 유고슬라비아 군·경찰은 80만 명이 넘는 알바니아계 주민을 알바니아·마케도니아 등 코소보 밖으로 몰아냈고, 이 시기 알바니아계 민간인 7천여 명이 대부분 이들에게 살해되었으며, 나토의 폭격으로도 민간인 수백 명이 숨졌다. 6월 유고슬라비아가 군대를 빼기로 하자 유엔 안보리 결의 1244호에 따라 코소보는 유엔의 임시 행정과 나토 주도 평화 유지군(KFOR) 아래 놓였다. 전쟁 뒤에는 세르비아계와 로마(롬인) 주민 다수가 코소보 해방군 등 알바니아계의 살해·납치와 보복을 피해 떠났다. 밀로셰비치는 2000년 선거에 지고 물러난 뒤 구유고슬라비아 국제 형사 재판소에 넘겨졌다(2006년 재판 중 사망). 코소보의 지위 문제는 2008년의 독립 선언으로 이어졌다."
  subjects: [fr-yugoslavia, usa, uk, france, germany, italy-republic, russia-fed, albania, kosovo-un]
