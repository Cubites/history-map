- id: karabakh-war-2020
  year: 2020
  title:
    ko: 2차 나고르노카라바흐 전쟁(44일 전쟁)
  summary:
    ko: "협상이 멈춘 가운데 2020년 7월 국경 충돌에 이어 9월 27일 아제르바이잔군이 휴전선 전역에서 공세를 폈다. 아제르바이잔은 튀르키예의 지원을 받으며 튀르키예·이스라엘제 무인기를 앞세워 남쪽 평지부터 되찾았고(튀르키예가 시리아 용병을 데려왔다는 보도도 잇따랐다), 11월 8일 카라바흐의 중심 도시 스테파나케르트 바로 남쪽의 슈샤를 점령했다. 양쪽은 주거지에도 포격과 미사일 공격을 퍼부어, 아제르바이잔군은 스테파나케르트 등에 집속탄을 쏘았고 아르메니아군과 카라바흐 세력은 아제르바이잔의 간자에는 탄도 미사일을(네 차례, 32명 사망), 바르다에는 집속탄을(21명 사망) 쏘았다. 포로와 민간인을 처형한 사례도 양쪽에서 보고되었다. 11월 9~10일 러시아의 중재로 아르메니아·아제르바이잔·러시아 정상이 휴전 성명에 서명해, 아르메니아는 남은 아그담·켈바자르·라친 구를 돌려주고 러시아 평화 유지군 약 2천 명이 휴전선과 라친 회랑에 5년 동안 머물기로 했다. 44일 동안 양쪽 군인 6,700명 넘게(공식 집계로 아르메니아 쪽 약 3,800명, 아제르바이잔 약 2,900명)와 민간인 약 185명(아르메니아 쪽 약 85명, 아제르바이잔 100명)이 숨졌다. 아르메니아에서는 휴전에 반대하는 시위가 일어났으나 파시냔 총리는 2021년 총선에서 다시 이겼다."
  subjects: [azerbaijan, armenia, nagorno-karabakh, russia-fed, turkey]
  links:
