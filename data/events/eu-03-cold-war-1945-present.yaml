- id: stalin-death-1953
  year: 1953
  endYear: 1956
  title:
    ko: 스탈린의 죽음과 흐루쇼프의 스탈린 비판
  summary:
    ko: "1953년 3월 5일 스탈린이 죽은 뒤 소련 지도부는 집단 지도 체제를 내세워 비밀경찰 책임자 베리야를 체포·처형하고 강제 수용소(굴라크)의 수감자를 대거 풀어 주었다. 동독에서는 생산 할당량 인상에 반발한 노동자들이 6월 17일 베를린 등 각지에서 봉기했으나 소련군 전차에 진압되었다. 공산당 제1서기가 된 흐루쇼프는 1956년 2월 제20차 당 대회의 공개 보고(14일)에서 자본주의 나라들과의 '평화 공존'을 내세웠고, 25일 비공개 연설에서는 스탈린의 개인숭배와 대숙청 때의 불법적인 탄압을 비판했다. 연설 내용이 알려지자 동유럽이 크게 흔들렸다. 6월 폴란드 포즈난에서는 노동자 시위를 폴란드 군과 보안대가 진압해 수십 명이 죽었고, 10월에는 스탈린 시대에 숙청되었던 고무우카가 소련의 압력을 무릅쓰고 공산당 제1서기에 올라 농업 집단화를 멈추는 등 개혁을 폈다(폴란드의 10월). 스탈린 비판은 북한의 8월 종파 사건(1956)에도 영향을 주었다."
  subjects: [soviet-union, east-germany, poland, dprk]
