  title:
    ko: 마셜 계획과 코민포름
  summary:
    ko: "1947년 6월 5일 미국의 마셜 국무 장관은 하버드 대학 연설에서 전쟁으로 무너진 유럽의 경제 부흥을 돕겠다고 제안했다. 굶주림과 혼란이 공산주의를 키운다고 본 것이다. 7월 파리 회의에서 소련의 몰로토프 외무 장관은 미국의 간섭이라며 자리를 떴고, 참가하려던 폴란드·체코슬로바키아도 소련의 압력으로 물러섰다. 1948년 4월부터 1951년까지 미국은 유럽 경제 협력 기구(OEEC)에 모인 유럽 16개국과 독일 서방 점령 지구에 약 130억 달러를 원조했다(유럽 부흥 계획). 원조는 서유럽의 복구와 경제 협력을 앞당기고 서유럽을 미국 쪽에 묶었다. 소련은 1947년 9월 동유럽과 프랑스·이탈리아의 공산당을 모아 공산당 정보국(코민포름)을 만들어 서방에 맞섰고, 1949년 1월에는 동유럽 나라들과 경제 상호 원조 회의(코메콘)를 세웠다. 유럽은 경제적으로도 동서로 나뉘었다."
  subjects: [usa, soviet-union, uk, france, italy-republic, germany-zone-us, germany-zone-uk, germany-zone-fr, poland, czechoslovakia]
