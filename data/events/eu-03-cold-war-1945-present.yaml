- id: russo-georgian-war-2008
  year: 2008
  title:
    ko: 러시아-조지아 전쟁
  summary:
    ko: "조지아는 소련 해체 무렵부터 남오세티야·압하지야의 분리 세력과 싸웠고, 1990년대 초의 전쟁 뒤 두 지역은 러시아군이 포함된 평화 유지군이 머무는 가운데 조지아 정부의 통치를 받지 않았다. 2003년 장미 혁명으로 집권한 사카슈빌리 대통령은 나토 가입과 영토 회복을 추진했다. 2008년 8월 남오세티야에서 충돌이 잦아진 끝에 조지아군이 7일 밤 남오세티야의 중심 도시 츠힌발리를 포격하며 진격하자, 러시아(메드베데프 대통령, 푸틴 총리)는 자국 평화 유지군과 주민 보호를 내세워 대규모 병력을 보내 조지아군을 몰아내고, 압하지야 쪽에서도 공격하며 고리 등 조지아 본토 일부까지 들어갔다. 유럽 연합 의장국 프랑스의 사르코지 대통령이 중재해 8월 12일 6개항 휴전에 합의했다. 닷새 동안의 싸움으로 양쪽 군인과 민간인 800명 넘게 숨졌고, 남오세티야 민병대 등이 그 지역의 조지아계 마을을 불태우고 주민들을 쫓아냈다. 러시아는 8월 26일 남오세티야와 압하지야의 독립을 승인하고 군대를 두었으나, 대부분의 나라는 두 지역을 조지아 땅으로 본다. 유럽 연합의 조사 보고서(2009)는 조지아의 츠힌발리 공격으로 전쟁이 시작되었으나 국제법상 정당화될 수 없었고 러시아의 대응도 정당방위의 범위를 넘었다고 보았으며, 유럽 인권 재판소는 2021년 휴전 뒤 러시아가 두 지역을 실효적으로 지배(점령)하고 있다고 판단했다."
  subjects: [georgia, russia-fed, south-ossetia, abkhazia, france]
