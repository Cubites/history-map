- id: maastricht-1992
  year: 1992
  endYear: 2002
  title:
    ko: 마스트리흐트 조약과 유럽 연합, 유로
  summary:
    ko: "냉전이 끝나고 독일이 통일되자 서유럽은 통합을 더 깊게 하기로 했다. 1992년 2월 7일 유럽 공동체 12개국은 네덜란드 마스트리흐트에서 유럽 연합 조약을 맺었다. 경제 통화 동맹과 단일 통화, 공동 외교·안보 정책, 사법·내무 협력을 담고 회원국 국민에게 유럽 시민권을 주는 내용이었다. 덴마크는 1992년 6월 국민 투표로 비준을 거부했다가 일부 적용 예외를 인정받고 1993년 다시 투표해 통과시켰고, 프랑스에서도 51% 남짓한 찬성으로 겨우 비준되었다. 조약이 발효된 1993년 11월 1일 유럽 연합(EU)이 출범했다. 1995년에는 오스트리아·핀란드·스웨덴이 가입했고, 국경 검문을 없애는 솅겐 협정이 시행되기 시작했다. 1999년 1월 11개국이 단일 통화 유로를 도입했고, 2002년 1월 유로 지폐와 동전이 12개국에서 쓰이기 시작했다. 영국·덴마크·스웨덴은 유로를 받아들이지 않았다. 유로는 통화 정책을 하나로 묶었으나 재정은 나라마다 따로여서, 뒤에 2010년 무렵 그리스 등의 국가 부채 위기가 유로를 쓰는 나라 전체를 흔들었다."
