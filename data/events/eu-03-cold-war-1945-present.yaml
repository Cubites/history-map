- id: eu-enlargement-2004
  year: 2004
  endYear: 2013
  title:
    ko: 유럽 연합과 나토의 동쪽 확대
  summary:
    ko: "냉전이 끝난 뒤 옛 공산권 나라들은 민주주의와 시장 경제로 바꾸며 서방 기구에 들어가려 했다. 나토에는 1999년 폴란드·헝가리·체코가, 2004년 3월 발트 3국·슬로바키아·슬로베니아·루마니아·불가리아가 가입했다. 유럽 연합은 가입 조건(코펜하겐 기준, 1993)을 갖춘 나라를 받아들여, 2004년 5월 1일 폴란드·체코·헝가리·슬로바키아·슬로베니아·에스토니아·라트비아·리투아니아와 몰타·키프로스 10개국이 한꺼번에 가입했다(키프로스는 남북 통일안이 남쪽 주민 투표에서 부결되어 섬이 나뉜 채 가입했고, 튀르키예가 점령한 북부에는 유럽 연합 법의 적용이 유보되었다). 2007년 루마니아·불가리아, 2013년 크로아티아가 더해져 회원국은 28개국이 되었다. 2009년 발효한 리스본 조약은 상임 의장과 외교 대표를 두어 기구를 정비했다. 동쪽 확대로 서유럽 기업의 투자와 동유럽 노동자의 서쪽 이동이 늘었다. 러시아는 나토가 국경 가까이 오는 것에 거세게 반발했고, 2008년 나토 부쿠레슈티 정상 회의는 우크라이나와 조지아가 언젠가 회원국이 될 것이라고 밝혔다. 한국과 유럽 연합은 2010년 자유 무역 협정에 서명해 2011년 7월부터 잠정 적용했다."
