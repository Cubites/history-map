- id: montenegro-independence-2006
  year: 2006
  title:
    ko: 세르비아 몬테네그로와 몬테네그로의 독립
  summary:
    ko: "유고슬라비아 연방 공화국에 남은 몬테네그로에서는 1990년대 말 주카노비치 정부가 밀로셰비치와 멀어지며 독자 노선을 걸었다. 유럽 연합의 중재로 2002년 베오그라드 합의를 맺고 2003년 2월 헌법 헌장을 채택해 나라 이름을 '세르비아 몬테네그로'로 바꾸었다. 두 공화국이 경제와 관세를 따로 운영하는 느슨한 국가 연합이었고(몬테네그로는 독일 마르크에 이어 유로를 썼다), 3년이 지나면 어느 한쪽이 국민 투표로 떠날 수 있게 했다. 2006년 5월 21일 몬테네그로 국민 투표에서 유럽 연합이 정한 기준(찬성 55%)을 조금 넘는 55.5%가 독립에 찬성해, 6월 3일 몬테네그로 의회가 독립을 선언했다. 세르비아는 6월 5일 국가 연합의 국제법상 지위를 이어받는다고 밝혔고, 두 나라는 서로를 승인했다. 몬테네그로는 6월 유엔에 가입했고 2017년 나토에 들어갔다. 2003년 '유고슬라비아'라는 나라 이름이 사라진 데 이어, 몬테네그로의 독립으로 1918년에 생긴 남슬라브인의 나라는 완전히 해체되었다."
  subjects: [serbia-montenegro, montenegro-republic, serbia-republic]
