- id: fall-of-berlin-wall-1989
  year: 1989
  endYear: 1990
  title:
    ko: 베를린 장벽의 붕괴와 독일 통일
  summary:
    ko: "1989년 여름 헝가리와 체코슬로바키아를 거쳐 수만 명의 동독인이 서독으로 빠져나가고, 라이프치히 등에서 '우리가 국민이다'를 외치는 월요 시위가 커지자 10월 18일 호네커가 물러났다. 11월 9일 저녁 동독 공산당 대변인 샤보프스키가 새 출국 규정을 발표하며 '즉시' 시행한다고 잘못 말하자 시민들이 검문소로 몰려들었고, 밀려든 인파에 경비대가 문을 열어 베를린 장벽이 무너졌다. 서독의 콜 총리는 11월 말 통일을 향한 10개항 계획을 내놓았다. 1990년 3월 동독 최초의 자유선거에서 빠른 통일을 내건 기독교 민주 연합 중심의 '독일 연합'이 이겼고, 7월 서독 마르크를 동독에 도입하는 화폐·경제·사회 통합이 이루어졌다. 9월 12일 동서독과 미국·영국·프랑스·소련은 '2+4 조약'을 맺어 4개국의 권리를 끝내고 통일 독일의 나토 잔류와 병력 상한, 오데르-나이세선을 동쪽 국경으로 확정하는 것을 정했다. 10월 3일 동독이 서독 기본법에 따라 서독에 가입하는 방식으로 독일이 통일되었고, 11월 통일 독일과 폴란드는 국경 조약을 맺었다. 통일 뒤 동독 지역에서는 공장이 무더기로 문을 닫아 실업이 크게 늘었고, 서독 지역은 막대한 통일 비용을 떠안았다. 분단국인 한국에서는 독일 통일이 큰 관심을 끌어, 동서독 교류의 경험과 통일 뒤의 비용·사회 통합 문제가 남북 관계와 통일 방안을 논의할 때 자주 견주어졌다."
  subjects: [east-germany, west-germany, berlin-western-sectors, soviet-union, usa, uk, france, poland, rok]
  links:
