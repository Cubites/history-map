- id: uk-welfare-state-1945
  year: 1945
  endYear: 1951
  title:
    ko: 영국 노동당 정부와 복지 국가
  summary:
    ko: "1945년 7월 총선거에서 노동당이 크게 이겨 전쟁을 이끈 처칠(5월 거국 연립 내각이 끝난 뒤 보수당 중심의 과도 내각)이 물러나고, 전시 연립 내각의 부총리였던 노동당의 애틀리가 총리가 되었다. 노동당 정부는 전시에 나온 베버리지 보고서(1942)의 구상을 따라 국민 보험법(1946)으로 실업·질병·노령 연금을 하나로 묶고, 1948년 7월 누구나 무료로 진료받는 국민 보건 서비스(NHS)를 열었다(이른바 '요람에서 무덤까지'). 잉글랜드 은행(1946)과 석탄(1947)·철도(1948)·전기·가스·철강 등 주요 산업도 국유화했다. 전쟁으로 빚이 쌓인 영국은 미국의 차관(1946)에 기댔고 배급제는 1954년까지 이어졌다. 1951년 총선에서 보수당이 다시 집권했으나 복지 국가의 틀은 1970년대까지 두 당이 함께 이어 갔고(전후 합의), 서유럽 여러 나라도 사회 보장 제도를 넓혔다."
  subjects: [uk, usa]
  links:
    - { from: usa, to: uk, note: "전후 차관 (1946)" }
  tags: [politics, society, economy]
  sources: ["「베버리지 보고서(사회 보험과 관련 서비스)」(1942)", "「국민 보건 서비스법」(1946)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)"]

- id: eastern-bloc-1945
  year: 1945
  endYear: 1949
  title:
    ko: 동유럽의 공산화와 티토의 독자 노선
  summary:
    ko: "소련군이 해방하거나 점령한 동유럽에서는 처음에 공산당과 농민당·사회 민주당 등이 함께하는 연립 정부가 들어섰다. 공산당은 내무부와 경찰을 쥐고 반대파를 체포·재판하거나 다른 정당을 강제로 합치는 식으로 권력을 넓혀, 1947~1949년 사이 폴란드(부정 선거, 1947년 1월)·헝가리·루마니아·불가리아에 공산당이 이끄는 '인민 민주주의' 정권이 자리 잡았다(알바니아에서는 호자의 공산당이 해방 때부터 권력을 쥐었다). 1948년 2월 체코슬로바키아에서는 비공산계 장관들이 사퇴한 틈에 공산당이 경찰과 무장 민병을 앞세워 정권을 장악했고(2월 사건), 3월 외무 장관 얀 마사리크가 숨진 채 발견되었다. 한편 파르티잔이 주도해 나라를 해방한 유고슬라비아의 티토는 소련의 간섭을 거부하다 1948년 6월 코민포름에서 쫓겨났고, 서방의 원조를 받으며 독자 노선을 걸었다. 그러자 동유럽 각국에서는 '티토주의자'를 가려낸다며 공산당 지도자들까지 숙청하는 보여 주기 재판이 이어졌다(헝가리의 라이크 처형, 1949)."
  subjects: [soviet-union, poland, hungary, romania, bulgaria, czechoslovakia, yugoslavia, albania]
