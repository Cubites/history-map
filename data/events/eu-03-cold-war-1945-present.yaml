- id: ecsc-1950
  year: 1950
  endYear: 1954
  title:
    ko: 유럽 석탄 철강 공동체
  summary:
    ko: "1950년 5월 9일 프랑스의 슈만 외무 장관은 장 모네의 구상에 따라 프랑스와 서독의 석탄·철강 생산을 하나의 공동 기구 아래 두자고 제안했다(슈만 선언). 전쟁에 꼭 필요한 산업을 함께 관리해 두 나라 사이의 전쟁을 생각할 수도 없고 물질적으로도 불가능하게 만들자는 것이었다. 1951년 4월 프랑스·서독·이탈리아·벨기에·네덜란드·룩셈부르크 6개국이 파리 조약을 맺어 1952년 유럽 석탄 철강 공동체(ECSC)가 출범했고, 각국 정부에서 독립한 최고 기관(초대 의장 모네)이 공동 시장을 관리했다. 영국은 주권을 넘기는 데 반대해 참여하지 않았다. 같은 6개국은 서독의 재무장을 유럽 군대 안에서 하자는 유럽 방위 공동체 조약(1952)도 맺었으나, 1954년 8월 프랑스 국민 의회가 비준을 거부해 무산되었다."
  subjects: [france, west-germany, italy-republic, belgium, netherlands, luxembourg, uk]
  links:
