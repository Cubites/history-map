- id: karabakh-ceasefire-1994
  year: 1994
  endYear: 2019
  title:
    ko: 비슈케크 휴전과 얼어붙은 카라바흐 분쟁
  summary:
    ko: "1994년 5월 휴전 뒤 카라바흐의 아르메니아계 세력은 옛 자치주 대부분과 주변 7개 구를 아우르는 약 1.1만km²를 다스렸다. '나고르노카라바흐 공화국'은 아르메니아를 포함해 어느 유엔 회원국에게도 승인받지 못했으나, 아르메니아의 예산 지원과 군대에 기대 사실상 아르메니아와 한 몸처럼 움직였고, 카라바흐 출신의 코차랸과 사르키샨이 차례로 아르메니아 대통령이 되었다. 유럽 안보 협력 기구(OSCE)의 민스크 그룹(공동 의장국 미국·러시아·프랑스)이 협상을 이끌어, 점령지를 돌려주고 카라바흐의 최종 지위는 뒤에 주민의 의사 표현으로 정한다는 원칙(마드리드 원칙, 2007)을 내놓았으나 합의에 이르지 못했다. 쫓겨난 아제르바이잔인은 돌아가지 못했고 휴전선에서는 저격과 충돌이 이어졌다. 석유·가스 수출로 국방비를 크게 늘린 아제르바이잔은 2016년 4월 나흘 동안의 싸움에서 고지 몇 곳을 되찾았다. 유럽 인권 재판소는 2015년 치라고프 판결에서 아르메니아가 카라바흐와 주변 지역을 실효적으로 지배한다고 보았고, 같은 날 사르키샨 대 아제르바이잔 판결에서는 아제르바이잔이 휴전선의 굴리스탄 마을을 관할하며 그곳에서 쫓겨난 아르메니아인 피란민의 재산권 등을 침해했다고 보았다."
  subjects: [nagorno-karabakh, armenia, azerbaijan, russia-fed]
  links:
