- id: bosnian-war-1992
  year: 1992
  endYear: 1995
  title:
    ko: 보스니아 내전과 스레브레니차 학살
  summary:
    ko: "1992년 3월 보스니아 헤르체고비나가 국민 투표를 거쳐 독립을 선언하자, 이에 반대한 카라지치·믈라디치의 보스니아 세르비아계 세력이 유고슬라비아 연방 공화국(4월 세르비아와 몬테네그로가 세운 나라)의 지원을 받아 4월부터 싸움을 일으켜 그해 말까지 영토의 약 70%를 차지했다. 수도 사라예보는 1996년 2월까지 4년 가까이 세르비아계 군에 포위되어 그 포격과 저격으로 수천 명의 시민이 죽었다. 세르비아계 세력은 점령지의 보스니아크(무슬림)와 크로아트인을 죽이거나 수용소에 가두고 쫓아내는 인종 청소를 벌였고, 집단 성폭력도 저질렀다. 1993~1994년에는 크로아티아의 지원을 받은 보스니아 크로아트계 세력과 보스니아크 사이에도 전쟁이 벌어졌다. 1995년 7월 믈라디치가 이끄는 보스니아 세르비아계 군은 유엔이 '안전 지역'으로 정하고 네덜란드 평화 유지군이 지키던 스레브레니차를 점령한 뒤 보스니아크 남성과 소년 약 8천 명을 학살했다. 구유고슬라비아 국제 형사 재판소와 국제 사법 재판소는 이를 집단 살해(제노사이드)로 판정했다. 8월 사라예보 시장 포격을 계기로 나토가 세르비아계 군을 대규모로 공습했고, 크로아티아군은 폭풍 작전으로 크라이나의 세르비아계 지역을 장악했다(이때 세르비아계 주민 15만~20만 명이 피란했고, 남은 주민 수백 명이 크로아티아군 등에 살해되었다). 11월 미국의 중재로 데이턴 협정이 합의되어(12월 파리에서 서명) 보스니아 헤르체고비나는 보스니아크·크로아트계의 연방과 세르비아계의 스릅스카 공화국으로 이루어진 한 나라가 되었다. 내전으로 약 10만 명이 죽고 200만 명 넘게 집을 잃었다."
