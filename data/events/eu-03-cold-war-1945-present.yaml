- id: oil-shock-neoliberalism-1973
  year: 1973
  endYear: 1990
  title:
    ko: 석유 파동과 신자유주의
  summary:
    ko: "1971년 미국이 달러와 금의 교환을 멈추며(닉슨 쇼크) 전후의 고정 환율 체제(브레턴우즈 체제)가 무너졌고, 1973년 10월 4차 중동 전쟁 때 아랍 산유국들이 이스라엘을 지원한 나라에 석유 수출을 줄이자 유가가 몇 달 사이 네 배로 뛰었다(1차 석유 파동). 1979년 이란 혁명으로 2차 석유 파동이 닥치면서 서유럽은 물가가 오르는데 경기는 가라앉는 스태그플레이션에 빠졌고, 복지 국가와 정부의 경기 조절 정책에 대한 비판이 커졌다. 1979년 영국 총리가 된 보수당의 대처는 국영 기업의 민영화, 노동조합 규제, 세금과 정부 지출 축소로 시장의 역할을 넓히는 신자유주의 정책을 폈다. 1982년 4월 아르헨티나가 영국령 포클랜드 제도를 점령하자 대처 정부는 군대를 보내 되찾았고(포클랜드 전쟁), 탄광 폐쇄에 맞선 광부들의 1년 가까운 파업(1984~1985)은 실패로 끝났다. 미국의 레이건 정부도 비슷한 정책을 폈고, 1981년 집권한 프랑스 사회당의 미테랑 대통령도 국유화를 늘리던 정책을 1983년 긴축으로 바꾸었다. 한국 경제도 두 차례 석유 파동의 충격을 받았다."
  subjects: [uk, usa, france, west-germany]
  tags: [economy, politics]
  sources: ["토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: cyprus-1974
  year: 1974
  title:
    ko: 키프로스 쿠데타와 튀르키예군의 상륙, 섬의 분단
  summary:
    ko: "1974년 7월 15일 그리스 군사 정권의 지원을 받은 키프로스 국가 방위대와 EOKA-B가 그리스와의 통합을 내걸고 쿠데타를 일으켜 마카리오스 대통령을 몰아내고 삼프손을 내세웠다. 튀르키예는 보장 조약에 따른 개입이라며 7월 20일 키레니아 해안에 군대를 상륙시켰고, 같은 날 유엔 안보리는 결의 353호로 외국 군대의 철수를 요구했다. 쿠데타 정권은 곧 무너지고 그리스의 군사 정권도 7월 24일 물러났으나, 제네바 회담이 결렬되자 튀르키예군은 8월 14~16일 다시 진격해 섬 북부의 약 37%를 점령했다. 그리스계 주민 14만~20만 명(추산)이 남쪽으로 쫓겨나거나 피란했고, 튀르키예계 주민 수만 명(약 6만 명으로 추산)도 그 뒤 북쪽으로 옮겨 갔다. 싸움 속에 양쪽 모두 민간인과 포로를 죽였다. 8월 EOKA-B는 마라타·산탈라리스·알로다 마을의 튀르키예계 주민 126명과 토흐니 마을의 튀르키예계 남자 80여 명을 학살했고, 튀르키예군과 튀르키예계 무장 세력에게 붙잡힌 뒤 살해되거나 행방불명된 그리스계 민간인과 포로도 많았다. 유럽 인권 위원회(1976)는 튀르키예군이 엘리아 근처에서 민간인 12명을 죽인 일 등 더 넓은 범위의 민간인 살해와 성폭행에 튀르키예의 책임이 있다고 보았다. 1963년부터의 충돌을 합쳐 실종자는 그리스계 1,510명, 튀르키예계 492명이다(키프로스 실종자 위원회). 북쪽은 1975년 키프로스 튀르키예 연방국, 1983년 북키프로스 튀르키예 공화국의 수립을 일방적으로 선언했으나 튀르키예만 승인했고, 유엔 안보리는 결의 541호로 이를 법적으로 무효라고 했다. 유럽 인권 재판소는 키프로스 대 튀르키예 사건(2001)에서 실종자와 피란민 문제 등에 대한 튀르키예의 책임을 인정했다. 2004년 유엔의 통일안(아난 계획)은 튀르키예계 주민 투표에서 통과되었으나 그리스계 주민 투표에서 부결되어, 섬은 지금(2026년)도 유엔 완충 지대를 사이에 두고 나뉘어 있다."
  subjects: [cyprus, northern-cyprus, turkey, greece]
  links:
