# 유럽 3번 묶음: 냉전에서 지금까지 (1945 ~ 현재)
# 범위: 프랑스·영국·소련/러시아 연방·독일(4개 점령 지구 → 서독·동독 → 통일 독일)을 중심으로, 이들과 얽히는 미국·폴란드·헝가리·체코슬로바키아·유고슬라비아·우크라이나 등까지.
# 깊이: 고등학교 세계사 교과서 본문 수준에 한국사와 닿는 사건(소련군의 북한 진주와 소련 군정, 6·25 전쟁의 소련과 유럽의 유엔군, 제네바 회의(1954),
#   파독 광부·간호사, 동백림 사건, 동방 정책과 6·23 선언, 대한항공 007편 격추, 소련의 한반도 정책 전환, 독일 통일, 북한군의 러시아 파병 등)을 더함 (docs/REGION_GUIDE.md §5).
# 서술은 새로 작성. 출처는 조약·결의·판결 원문과 표준 개설서(번역본이 있으면 번역본 제목). 운영자 검수 필요.
# 1945년의 얄타·포츠담 회담, 독일의 항복, 국제 연합 창설은 앞 묶음 eu-02에 있다. 이 파일은 그 뒤부터.
# 한국사 묶음(07·08번)에 이미 있는 사건은 다시 만들지 않았다: 8·15 광복(1945), 38도선 분할·모스크바 3국 외상 회의(1945), 미소 공동 위원회(1946~1947), 북조선 임시 인민 위원회(1946),
#   유엔 이관(1947), 북한 정부 수립(1948), 6·25 전쟁의 각 국면과 정전 회담(1950~1953), 8월 종파 사건(1956), 베트남 파병(1964~1973), 7·4 남북 공동 성명(1972),
#   석유 파동(1973), 서울 올림픽과 북방 외교(1988), 한소 수교(1990), 남북한 유엔 동시 가입(1991) 등. 이 파일에서는 소련·유럽 쪽에서 본 내용만 적고 이름을 언급한다.
# 나라 id는 그해에 있는 항목을 쓴다: 1991년까지 소련 → 1991년부터 러시아 연방, 독일은 1945~1949 4개 점령 지구 → 1949~1990 서독·동독(서베를린은 연합국 관리 구역 항목) → 1990년부터 통일 독일,
#   이탈리아는 1946년부터 이탈리아 공화국, 유고슬라비아는 1992년까지 → 유고슬라비아 연방 공화국(1992~2003). 해체 뒤 나라(우크라이나·조지아 등)는 1991년부터. 한국은 1945~1948 소련군정기 북한·미군정기 남한.
#   이집트·알제리·인도·쿠바·베트남처럼 아직 나라 항목이 없는 곳은 subjects·화살표 없이 서술에만 적었다.
# 분쟁 지역은 작업 A의 표시 기준을 따른다(docs/EUROPE_DRAFT.md §6): 크림(2014~)·러시아 점령 우크라이나 동부·남부(2022~)·코소보(2008~)는 귀속 논쟁, 트란스니스트리아·압하지야·남오세티야는 점령.
#   서술도 병합·독립 '선언'과 국제기구·재판소의 판단을 함께 적고 귀속을 단정하지 않는다.
# 6·25 전쟁은 data/wars에 전쟁 보기가 있어 places를 적지 않는다. 그 밖에 싸운 곳은 places로 적었다.
# 지금 이어지는 러시아-우크라이나 전쟁은 2026-10-04까지 확인된 사실만 적었다. 끝나지 않은 사건의 endYear는 서술이 다룬 마지막 해(2026)로 두었으니, 전쟁이 끝나거나 해가 바뀌면 고친다.
# 2026-10-05(작업 EV4): 지도에 있으나 사건이 없던 나라·지역 항목을 채우려 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.
# 2026-10-05(작업 EV5): 항목마다 그 나라가 생기고 끝난 내력을 다룬 사건이 있는지 다시 점검해, 빠진 곳에 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.

# ── 전후 처리와 냉전의 시작 (1945 ~ 1949) ─────────────────────

- id: soviet-north-korea-1945
  year: 1945
  endYear: 1948
  title:
    ko: 소련군의 북한 진주와 소련 군정
  summary:
    ko: "얄타의 약속대로 소련은 1945년 8월 8일 일본에 선전 포고하고 9일 만주와 한반도 북부로 진공했다. 소련군은 8월 12일 웅기·나진에 상륙하고 13~16일 청진에서 일본군과 싸웠다. 일본이 항복한 뒤 미국이 제안한 38도선 분할을 8월 16일 받아들인 소련은 치스차코프가 이끄는 제25군을 8월 하순 평양에 들여보내고 8월 말~9월 초 38도선 이북을 모두 차지했다. 소련은 남쪽의 미군정과 달리 각지의 인민 위원회를 인정하고 그 뒤에서 통치했다. 스탈린은 9월 20일 북한에 소비에트 권력 기관을 세우지 말고 모든 반일 민주주의 정당·단체의 광범한 연합에 기초한 '부르주아 민주주의' 정권을 세우라고 지시했고, 소련 민정청과 연해주 군관구 군사 위원 스티코프가 김일성을 앞세워 북조선 임시 인민 위원회(1946)의 수립과 토지 개혁을 이끌었다. 미소 공동 위원회(1946~1947)에서 소련 대표 스티코프는 모스크바 3국 외상 회의의 결정(신탁 통치)에 반대하는 단체를 협의 대상에서 빼야 한다고 주장해 미국과 맞섰다. 회의가 결렬되고 미국이 한국 문제를 유엔에 넘기자 소련은 1947년 9월 미소 양군의 동시 철수를 제안했고, 북한 정부가 세워진 뒤 1948년 12월 철수를 마쳤다."
  subjects: [soviet-union, soviet-north, japan, usa, usamgik]
