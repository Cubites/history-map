- id: georgia-separatist-wars-1991
  year: 1991
  endYear: 1994
  title:
    ko: 남오세티야·압하지야 전쟁
  summary:
    ko: "소련 말기 조지아에서 민족주의가 거세지자 조지아 안의 소수 민족 자치 지역들이 반발했다. 1990년 12월 조지아 최고 회의가 남오세트 자치주의 자치를 없애자 1991년 1월 조지아 군경이 츠힌발리에 들어가며 오세트인 무장 세력과의 싸움이 벌어졌다. 1991년 4월 독립을 선언한 조지아에서는 1992년 1월 감사후르디아 대통령이 쫓겨나는 내전도 겹쳤다. 남오세티야의 싸움은 1992년 6월 러시아의 옐친 대통령과 조지아의 셰바르드나제 국가 평의회 의장이 맺은 소치 협정으로 멈추었고, 러시아·조지아·북오세티야 평화 유지군이 들어섰다. 이 싸움으로 1천 명 안팎이 숨지고 오세트인 4만 명 넘게와 조지아인 2만여 명이 피란했다(추산). 1992년 8월에는 흑해 연안의 압하지야 자치 공화국에 조지아 국가 방위대가 들어가며 전쟁이 시작되었다. 압하지야 세력은 북캅카스 의용병과 러시아군 일부의 지원을 받아 1993년 9월 수후미를 함락하고 조지아군을 몰아냈다. 양쪽 모두 민간인을 죽이고 약탈했으며, 압하지야 세력은 조지아계 주민 약 25만 명을 쫓아냈다(유럽 안보 협력 기구는 이를 인종 청소로 규탄함). 이 전쟁의 사망자는 1만~3만 명으로 추산 폭이 크다. 궁지에 몰린 조지아는 1993년 10월 독립 국가 연합 가입을 결정했고(12월 가입), 1994년 5월 14일 압하지야 세력과 모스크바 협정을 맺어 휴전과 병력 분리에 합의했다. 그 뒤 두 지역은 조지아 정부의 통치를 받지 않는 분리 지역으로 남았다('조지아 분리 지역의 동결'로 이어짐)."
