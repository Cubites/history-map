- id: helsinki-1975
  year: 1975
  endYear: 1977
  title:
    ko: 헬싱키 협정
  summary:
    ko: "데탕트 속에 미국과 소련은 1972년 전략 무기 제한 협정(SALT I)과 탄도탄 요격 미사일 조약을 맺었다. 소련이 오래 요구한 유럽 안보 회의가 1973년부터 열려, 1975년 8월 1일 핀란드 헬싱키에서 알바니아를 뺀 유럽 33개국과 미국·캐나다 35개국 정상이 유럽 안보 협력 회의(CSCE) 최종 의정서에 서명했다. 의정서는 국경 불가침과 내정 불간섭을 약속해 소련이 바라던 전후 국경의 사실상 인정을 담았고, 서방이 요구한 인권과 기본적 자유의 존중, 사람과 정보의 자유로운 교류도 담았다. 동유럽의 반체제 인사들은 이 인권 조항을 근거로 정부를 압박했다. 소련의 헬싱키 감시 그룹(1976)과 체코슬로바키아의 '77 헌장'(1977, 하벨 등)이 생겨났고, 이는 1980년대 동유럽 변화의 밑거름이 되었다."
  subjects: [usa, soviet-union, finland, west-germany, east-germany, uk, france, poland, czechoslovakia]
  links:
    - { from: soviet-union, to: usa, note: "전략 무기 제한 협정 (1972)" }
  tags: [diplomacy]
  sources: ["「유럽 안보 협력 회의 최종 의정서(헬싱키 최종 의정서)」(1975)", "「전략 무기 제한 잠정 협정(SALT I)」(1972)", "존 루이스 개디스, 『냉전의 역사』(에코리브르, 2010)"]

- id: new-cold-war-1979
  year: 1979
  endYear: 1985
  title:
    ko: 신냉전과 대한항공 007편 격추
  summary:
    ko: "1979년 12월 소련이 친소 공산 정권을 지키려 아프가니스탄을 침공하면서 데탕트가 끝났다. 미국은 곡물 수출을 줄이고 1980년 모스크바 올림픽을 서독·일본·한국 등과 함께 거부했으며, 소련과 동유럽 대부분은 1984년 로스앤젤레스 올림픽을 거부했다. 소련이 서부 국경 지대에 신형 중거리 미사일(SS-20)을 배치하자 나토는 1979년 12월 협상이 안 되면 서유럽에 미국 미사일을 배치하겠다고 결정했고(이중 결정), 1983년 말 실제로 퍼싱 II 미사일과 순항 미사일이 서독·영국·이탈리아 등에 들어오기 시작해 서유럽에서 대규모 반핵 시위가 일어났다. 미국의 레이건 대통령은 소련을 '악의 제국'이라 부르며 전략 방위 구상(SDI)을 내놓았다. 이런 긴장 속에 1983년 9월 1일 뉴욕을 떠나 앵커리지를 거쳐 서울로 오던 대한항공 007편 여객기가 항로를 벗어나 소련 영공에 들어갔다가 사할린 근처에서 소련 전투기의 미사일에 격추되어 승객과 승무원 269명이 모두 숨졌다. 소련은 처음에 격추를 부인하다가 첩보 비행이었다고 주장했고, 유엔 안보리의 규탄 결의안은 소련의 거부권으로 부결되었다. 1992년 11월 방한한 러시아의 옐친 대통령이 블랙박스와 관련 자료를 넘겼으나 핵심 기록의 원본은 빠져 있었고, 원본은 이듬해 국제 민간 항공 기구(ICAO)에 넘겨져 조사에 쓰였다."
  subjects: [soviet-union, usa, rok, japan, west-germany, uk, italy-republic]
