- id: italian-republic-1946
  year: 1946
  title:
    ko: 이탈리아의 국민 투표와 공화국 수립
  summary:
    ko: "파시즘 정권과 함께해 온 데다 1943년 휴전을 발표한 뒤 로마를 떠나 남쪽으로 피한 국왕 비토리오 에마누엘레 3세는 왕정에 대한 신뢰를 잃었다. 그는 1944년 6월 아들 움베르토에게 권한을 넘긴 데 이어 1946년 5월 9일 물러났고, 6월 2일 왕정을 남길지 공화국으로 할지를 묻는 국민 투표가 치러졌다. 여성이 처음으로 전국 선거에 참여한 이 투표에서 공화국이 54.3%(약 1,272만 표)로 왕정(45.7%)을 이겼다. 북부는 공화국, 남부는 왕정을 많이 찍어 나라가 둘로 갈린 결과였고, 왕정 지지자들은 개표에 이의를 제기했으나 움베르토 2세는 6월 13일 포르투갈로 떠났다. 같은 날 뽑힌 제헌 의회에서는 데가스페리의 기독교 민주당이 제1당이 되었고, 1948년 1월 1일 공화국 헌법이 시행되었다. 1947년 파리 강화 조약으로 이스트리아·도데카니사 등을 내놓은 이탈리아는 서방 진영에 서서 1949년 북대서양 조약 기구에 참여했다. 6·25 전쟁 때는 적십자 야전 병원을 보냈고, 1956년 한국과 수교했다."
  subjects: [italy, italy-republic]
  tags: [politics]
  sources: ["「이탈리아 제도 국민 투표」(1946)", "「이탈리아 공화국 헌법」(1948)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)", "크리스토퍼 듀건, 『미완의 통일 이탈리아사』(개마고원, 2001)"]

- id: iron-curtain-1946
  year: 1946
  endYear: 1947
  title:
    ko: 철의 장막 연설과 트루먼 독트린
  summary:
    ko: "전쟁이 끝나자 소련군이 머문 동유럽에서는 공산당이 경찰과 군을 쥐고 다른 정당을 밀어내기 시작했다. 1946년 3월 5일 영국의 전 총리 처칠(당시 야당 지도자)은 미국 미주리주 풀턴에서 발트해의 슈테틴에서 아드리아해의 트리에스테까지 유럽 대륙에 '철의 장막'이 내려졌다고 연설해 소련의 팽창을 경고했고, 스탈린은 이를 전쟁을 부추기는 말이라고 비난했다. 소련은 이란 북부에서 철군을 미루고(1946) 튀르키예에 해협의 공동 방위를 요구했으며, 그리스에서는 공산 게릴라와 정부군의 내전이 다시 불붙었다. 그리스를 돕던 영국이 재정난으로 지원을 끊겠다고 알리자, 1947년 3월 12일 미국의 트루먼 대통령은 의회에 그리스·튀르키예 원조 4억 달러를 요청하며 무장한 소수나 외부의 압력에 맞서는 자유민을 돕겠다고 선언했다(트루먼 독트린). 미국이 공산주의의 확산을 막는 봉쇄 정책으로 돌아서며 미국과 소련의 대립, 곧 냉전이 본격화했다. 그리스 내전은 미국의 지원을 받은 정부군이 1949년 이겼다."
