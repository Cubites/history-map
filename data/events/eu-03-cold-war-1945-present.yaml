- id: solidarity-1980
  year: 1980
  endYear: 1983
  title:
    ko: 폴란드 연대 자유 노조
  summary:
    ko: "1978년 폴란드 출신 교황 요한 바오로 2세가 즉위해 이듬해 고국을 찾자 수많은 군중이 모였다. 1980년 7월 정부가 고기값을 올리자 파업이 번졌고, 8월 그단스크의 레닌 조선소에서는 해고된 노동자의 복직 등을 요구한 파업을 전기공 바웬사가 이끌었다. 파업 위원회는 8월 31일 정부와 그단스크 협정을 맺어 공산권에서 처음으로 공산당에서 독립한 노동조합과 파업권을 인정받았다. 연대 자유 노조(솔리다르노시치)에는 1년 사이 노동자·농민·지식인 약 1천만 명이 들어왔다. 소련의 압력 속에 총리 겸 국방 장관이자 10월부터 공산당 제1서기를 겸한 야루젤스키는 1981년 12월 13일 계엄령을 선포하고 바웬사 등 수천 명을 가두었으며, 연대 노조는 1982년 불법화되었다. 그러나 연대 노조는 지하에서 활동을 이었고, 바웬사는 1983년 노벨 평화상을 받았다."
