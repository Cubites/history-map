- id: ec-enlargement-1973
  year: 1973
  endYear: 1986
  title:
    ko: 유럽 공동체의 확대와 남유럽의 민주화
  summary:
    ko: "드골이 물러난 뒤 1973년 1월 영국·아일랜드·덴마크가 유럽 공동체에 가입했다(노르웨이는 1972년 국민 투표로 가입을 거부). 남유럽에서는 독재가 잇따라 무너졌다. 포르투갈에서는 1974년 4월 청년 장교들의 무혈 쿠데타(카네이션 혁명)로 40년 넘게 이어진 독재가 끝나고 앙골라·모잠비크 등 아프리카 식민지가 독립했다. 그리스에서는 군사 정권이 뒤에서 일으킨 키프로스 정변과 이에 맞선 튀르키예군의 키프로스 북부 점령(1974)을 계기로 7년 동안의 군사 정권이 무너졌다. 에스파냐에서는 1975년 11월 프랑코가 죽은 뒤 국왕 후안 카를로스 1세와 수아레스 총리 아래 민주화가 진행되어 1978년 새 헌법이 만들어졌고, 1981년 일부 군인의 쿠데타 시도도 실패했다. 민주화를 이룬 그리스(1981)와 에스파냐·포르투갈(1986)이 차례로 유럽 공동체에 가입해 회원국은 12개국이 되었다. 1979년에는 유럽 의회 의원을 처음으로 주민이 직접 뽑았고, 1986년 단일 유럽 의정서로 1992년까지 사람·상품·자본·서비스가 자유롭게 오가는 단일 시장을 만들기로 했다."
