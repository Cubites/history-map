- id: treaty-of-rome-1957
  year: 1957
  endYear: 1968
  title:
    ko: 로마 조약과 유럽 공동체
  summary:
    ko: "유럽 방위 공동체가 무산된 뒤 6개국은 경제 통합에 힘을 모았다. 1957년 3월 25일 프랑스·서독·이탈리아·벨기에·네덜란드·룩셈부르크는 로마 조약을 맺어 유럽 경제 공동체(EEC)와 유럽 원자력 공동체(유라톰)를 만들었고(1958년 발효), 회원국 사이의 관세를 없애고 바깥에는 같은 관세를 매기는 관세 동맹과 공동 농업 정책을 추진했다. 1967년에는 석탄 철강 공동체를 포함한 세 공동체의 기구를 하나로 합쳐 유럽 공동체(EC)라 부르게 되었고, 관세 동맹은 예정보다 이른 1968년 7월 완성되었다. 주권을 넘기는 통합을 꺼린 영국은 1960년 스웨덴·덴마크·노르웨이·오스트리아·스위스·포르투갈과 유럽 자유 무역 연합(EFTA)을 만들었으나, 공동 시장이 빠르게 성장하자 EEC 가입을 신청했다. 그러나 영국이 미국과 너무 가깝다고 본 프랑스의 드골 대통령이 1963년과 1967년 두 번 거부했다."
  subjects: [france, west-germany, italy-republic, belgium, netherlands, luxembourg, uk, sweden, denmark, norway, austria-republic, switzerland, portugal]
  links:
    - { from: france, to: uk, note: "영국의 가입 거부 (1963·1967)" }
  tags: [diplomacy, economy]
  sources: ["「유럽 경제 공동체 설립 조약(로마 조약)」(1957)", "「통합 조약」(1965)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)"]

- id: sputnik-1957
  year: 1957
  endYear: 1969
  title:
    ko: 스푸트니크와 우주 경쟁
  summary:
    ko: "1957년 8월 대륙 간 탄도 미사일 시험에 성공한 소련은 10월 4일 그 로켓으로 첫 인공위성 스푸트니크 1호를 쏘아 올렸고, 11월에는 개 라이카를 태운 2호를 발사했다. 소련의 미사일이 미국 본토에 닿을 수 있다는 충격(스푸트니크 충격) 속에 미국은 1958년 1월 첫 위성을 올리고 항공 우주국(NASA)을 세우며 과학·수학 교육에 크게 투자했다. 1961년 4월 12일 소련의 가가린이 처음으로 지구 궤도를 돌자, 미국의 케네디 대통령은 10년 안에 사람을 달에 보내겠다고 선언했다(아폴로 계획). 1969년 7월 미국의 아폴로 11호가 처음으로 달에 사람을 내렸다. 우주 경쟁은 핵미사일 경쟁과 맞물려 있었고, 두 나라는 서로를 겨누는 핵무기를 크게 늘렸다."
  subjects: [soviet-union, usa]
  links:
    - { from: soviet-union, to: usa, note: "스푸트니크 충격 (1957)" }
  tags: [culture, diplomacy]
  sources: ["존 루이스 개디스, 『냉전의 역사』(에코리브르, 2010)", "에릭 홉스봄, 『극단의 시대』(까치, 1997)"]

- id: fifth-republic-1958
  year: 1958
  endYear: 1969
  title:
    ko: 드골과 프랑스 제5공화국
  summary:
    ko: "알제리 위기 속에 1958년 6월 총리가 된 드골은 대통령의 권한을 크게 강화한 새 헌법을 마련해 9월 국민 투표로 통과시켰다. 10월 제5공화국이 출범했고, 드골은 12월 대통령에 뽑혔다. 1962년에는 국민 투표로 대통령 직선제를 도입했다. 드골은 '프랑스의 위대함'을 내세워 미국에서 독립된 외교를 폈다. 1960년 사하라 사막에서 첫 핵실험을 해 핵무기를 가졌고, 1963년 1월 서독의 아데나워 총리와 엘리제 조약을 맺어 두 나라의 화해와 협력을 제도화했으며, 1964년 중화인민공화국을 승인하고, 1966년 나토의 통합 군사 기구에서 빠졌다(회원국 지위는 유지). 68 운동을 넘긴 드골은 1969년 4월 지방 제도·상원 개혁 국민 투표에서 지자 물러났다."
  subjects: [france, west-germany, usa, prc]
  links:
    - { from: france, to: west-germany, note: "엘리제 조약 (1963)" }
    - { from: france, to: prc, note: "국교 수립 (1964)" }
    - { from: france, to: usa, note: "나토 통합 군사 기구 탈퇴, 미군 기지 철수 요구 (1966)" }
  tags: [politics, diplomacy]
  sources: ["「프랑스 제5공화국 헌법」(1958)", "「엘리제 조약」(1963)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)"]

- id: cyprus-independence-1960
  year: 1960
  endYear: 1964
  title:
    ko: 키프로스의 독립과 두 공동체의 충돌
  summary:
    ko: "영국 식민지 키프로스에서는 1950년대 주민의 약 80%인 그리스계가 그리스와의 통합(에노시스)을 요구했고, 그리바스가 이끈 EOKA가 1955년부터 영국에 맞서 무장 투쟁을 벌였다. 튀르키예계 주민(약 18%)과 튀르키예는 섬의 분할을 내세웠고, 튀르키예계 무장 조직(TMT)도 생겨 두 공동체 사이의 폭력이 늘었다. 1959년 영국·그리스·튀르키예와 두 공동체 대표가 취리히·런던 협정을 맺어, 1960년 8월 16일 통합도 분할도 아닌 독립 공화국이 세워졌다(대통령 마카리오스, 부통령 퀴췩). 헌법은 대통령·부통령의 거부권과 공직·의석의 70대 30 배분 등으로 두 공동체가 권력을 나누게 했고, 영국·그리스·튀르키예는 보장 조약으로 이 질서를 보장하며 필요하면 행동할 권리를 가졌다. 영국은 아크로티리·데켈리아 기지를 주권 지역으로 남겼다. 그러나 헌법 운영을 둘러싼 갈등 끝에 1963년 11월 마카리오스가 그리스계에 유리한 13개 조 헌법 개정안을 내놓았고, 12월 21일 니코시아에서 그리스계 경찰의 검문 중 총격으로 튀르키예계 주민 2명이 숨진 것을 계기로, 그리스계 무장 대원과 튀르키예계 무장 조직(TMT)이 서로 공격하며 충돌이 섬 곳곳으로 번졌다(피의 크리스마스). 1964년 8월까지 튀르키예계 364명, 그리스계 174명이 죽었고, 튀르키예계 약 2만 5천 명이 집을 떠나 고립 지역(엔클레이브)으로 옮겨 갔다. 튀르키예계 각료·의원·공무원은 정부를 떠났다(튀르키예계는 쫓겨났다고, 그리스계는 스스로 물러났다고 본다). 니코시아에는 영국군 장교가 지도에 그은 녹색 선(그린 라인)으로 경계가 생겼고, 1964년 3월 유엔 안보리 결의 186호에 따라 유엔 키프로스 평화 유지군이 들어왔다. 한국은 1960년 키프로스를 승인했고 1995년 수교했다."
  subjects: [cyprus, uk, greece, turkey]
  links:
    - { from: uk, to: cyprus, note: "취리히·런던 협정, 독립 (1960.8)" }
  tags: [politics, diplomacy]
  sources: ["「키프로스 설립 조약」(1960)", "「보장 조약」(1960)", "「유엔 안전 보장 이사회 결의 186호」(1964)", "William Mallinson, Cyprus: A Modern History"]

- id: berlin-wall-1961
  year: 1961
  endYear: 1963
  title:
    ko: 베를린 장벽
  summary:
    ko: "서베를린은 동독 사람들이 서방으로 빠져나가는 통로가 되었다. 1949년부터 1961년까지 동독을 떠난 사람은 250만 명이 넘었고, 그 가운데 젊은 기술자와 전문직이 많아 동독 경제가 흔들렸다. 흐루쇼프가 서방 군대의 철수와 서베를린의 '자유시' 전환을 요구한 최후통첩(1958)으로 긴장이 높아진 끝에, 동독 정부는 소련의 승인 아래 1961년 8월 13일 새벽 동서 베를린 경계에 철조망을 치고 곧 콘크리트 장벽을 쌓았다. 10월에는 검문소 '체크포인트 찰리'에서 미국과 소련의 전차가 마주 서기도 했다. 1963년 6월 서베를린을 찾은 미국의 케네디 대통령은 '나는 베를린 시민이다'라고 연설해 서베를린을 지키겠다는 뜻을 밝혔다. 장벽은 가족과 이웃을 갈라놓았고, 1989년 무너질 때까지 장벽을 넘으려던 사람 등 적어도 140명이 동독 국경 경비대의 총격·사고 등으로 숨졌다(근무 중 숨진 경비병 포함). 베를린 장벽은 냉전과 독일 분단의 상징이 되었다."
  subjects: [east-germany, west-germany, berlin-western-sectors, soviet-union, usa]
  links:
    - { from: east-germany, to: berlin-western-sectors, note: "장벽 건설 (1961.8.13)" }
    - { from: soviet-union, to: usa, note: "베를린 최후통첩 (1958)" }
    - { from: usa, to: berlin-western-sectors, note: "서베를린 방위 약속 (케네디 연설, 1963)" }
  tags: [politics, diplomacy]
  sources: ["포츠담 현대사 연구 센터·베를린 장벽 재단, 『베를린 장벽의 희생자 1961~1989』(2009, 2017년 갱신)", "존 루이스 개디스, 『냉전의 역사』(에코리브르, 2010)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)"]

- id: cuban-missile-crisis-1962
  year: 1962
  endYear: 1963
  title:
    ko: 쿠바 미사일 위기
  summary:
    ko: "1959년 혁명으로 들어선 쿠바의 카스트로 정부가 소련에 가까워지고 미국의 지원을 받은 망명자들의 피그스만 침공(1961)이 실패하자, 흐루쇼프는 미국 바로 앞의 쿠바에 핵미사일을 비밀리에 배치했다. 1962년 10월 미국 정찰기가 미사일 기지를 찾아내자 케네디 대통령은 22일 쿠바 해상 봉쇄(격리)를 선언하고 미사일 철거를 요구했다. 핵전쟁 직전까지 간 13일 동안의 대치 끝에 흐루쇼프는 28일 미국이 쿠바를 침공하지 않는다는 약속을 받고 미사일을 철거하기로 했고, 미국은 튀르키예에 배치한 주피터 미사일을 비밀리에 거두기로 했다. 위기 뒤 두 나라는 정상 사이에 직통 전화(핫라인)를 놓고, 1963년 8월 영국과 함께 대기권·우주·수중 핵실험을 금지하는 부분적 핵실험 금지 조약을 맺었다."
  subjects: [soviet-union, usa, turkey, uk]
  links:
