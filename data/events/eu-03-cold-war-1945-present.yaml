- id: west-germany-miners-nurses-1963
  year: 1963
  endYear: 1977
  title:
    ko: 파독 광부와 간호사
  summary:
    ko: "일자리와 외화가 부족하던 한국은 같은 분단국 서독에 노동자를 보냈다. 서독은 1961년 12월 한국과 경제·기술 협조 의정서를 맺어 차관을 주기로 했고, 1963년 12월 한국 노동청과 독일 탄광 협회가 협정을 맺어 그달 첫 광부 247명이 두 차례에 나눠 서독의 탄광으로 떠났다. 광부들은 대개 3년 계약으로 깊은 지하 갱도에서 일했고, 1977년까지 약 8천 명이 건너갔다. 1964년 12월 서독을 방문한 박정희 대통령은 함보른 탄광에서 광부·간호사들을 만났다. 1966년부터는 간호사·간호조무사의 파견이 본격화해 1976년까지 1만여 명이 서독 병원에서 일했다. 이들이 보낸 돈은 외화가 모자라던 한국 경제에 보탬이 되었다. 계약을 마친 뒤 상당수는 독일에 남거나 다른 나라로 옮겨 재독 한인 사회를 이루었다. 서독은 일손이 모자라 1955년 이탈리아를 시작으로 튀르키예(1961) 등에서도 외국인 노동자(가스트아르바이터)를 받아들이고 있었다."
