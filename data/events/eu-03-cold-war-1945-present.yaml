  sources: ["「독일에 관한 최종 해결 조약(2+4 조약)」(1990)", "「통일 조약」(1990)", "토니 주트, 『전후 유럽 1945~2005』(열린책들, 2019)", "통일부 국립통일교육원 『통일문제 이해』"]

- id: soviet-dissolution-1991
  year: 1991
  title:
    ko: 소련의 해체
  summary:
    ko: "개혁 속에 공화국들의 독립 요구가 거세졌다. 1990년 3월 리투아니아가 가장 먼저 독립을 선언했고, 1991년 1월 소련군이 빌뉴스의 방송탑을 장악하며 시민 14명을 숨지게 했다. 3월 국민 투표에서는 다수가 개편된 연방의 유지에 찬성했으나 발트 3국 등 여섯 공화국은 투표를 거부했고, 6월 러시아 공화국 대통령으로 직선된 옐친이 개혁을 이끌었다. 공화국에 큰 권한을 넘기는 새 연방 조약의 서명을 앞둔 8월 19일, 공산당 보수파가 비상사태 위원회를 만들어 휴가 중인 고르바초프를 크림에 가두고 정변을 일으켰으나 옐친과 모스크바 시민들의 저항으로 사흘 만에 실패했다. 이 정변 중과 뒤에 에스토니아(8월 20일)·라트비아(21일)·우크라이나(24일)·벨라루스(25일)·몰도바(27일)·아제르바이잔(30일)이 잇달아 독립을 선언했고(조지아는 4월 9일, 아르메니아는 9월 21일 국민 투표로), 공산당의 활동은 정지되었으며, 9월 소련은 발트 3국의 독립을 인정했다. 12월 1일 우크라이나 국민 투표에서 90% 넘게 독립을 지지하자, 12월 8일 러시아·우크라이나·벨라루스 정상은 벨라베자 협정으로 소련이 더는 존재하지 않는다고 선언하고 독립 국가 연합(CIS)을 만들었다. 12월 21일 알마아타에서 8개 공화국이 더 참여해 11개 공화국이 독립 국가 연합을 이루었고(조지아와 발트 3국은 불참), 12월 25일 고르바초프가 대통령직에서 물러나 이튿날 소련이 해체되었다. 러시아 연방이 소련의 유엔 안보리 상임 이사국 자리를 이었다. 러시아의 옐친 정부는 급진적인 시장 경제 전환(충격 요법)을 폈으나 극심한 물가 상승과 생산 감소를 겪었고, 분리 독립을 내건 체첸과 두 차례 전쟁을 벌였다(1994~1996, 1999~2009)."
  subjects: [soviet-union, russia-fed, ukraine, belarus, estonia, latvia, lithuania, moldova, georgia, armenia, azerbaijan]
