- id: yugoslav-wars-1991
  year: 1991
  endYear: 1992
  title:
    ko: 유고슬라비아의 해체와 크로아티아 전쟁
  summary:
    ko: "티토가 죽은(1980) 뒤 유고슬라비아는 경제난과 민족 갈등에 시달렸고, 세르비아의 밀로셰비치는 세르비아 민족주의를 내세워 코소보·보이보디나의 자치권을 줄였다(1989~1990). 1991년 6월 25일 슬로베니아와 크로아티아가 독립을 선언하자 연방군(유고슬라비아 인민군)이 개입했다. 슬로베니아에서는 10일 만에 싸움이 끝나 연방군이 물러났으나, 세르비아계 주민이 많은 크로아티아에서는 세르비아계 무장 세력과 연방군이 영토의 약 3분의 1을 차지하며 전쟁이 벌어졌다. 석 달 가까이 포위된 부코바르가 11월 함락되자 연방군과 세르비아계 민병대는 병원에 있던 부상자 등 200명 가까운 사람을 끌고 가 학살했고, 연방군은 두브로브니크도 포격했다. 세르비아계 세력은 점령지에서 크로아트인을 몰아내는 '인종 청소'를 벌였고, 크로아티아 군·경찰도 고스피치 등지에서 세르비아계 주민을 살해했다. 1992년 1월 유엔 중재로 휴전이 이루어져 유엔 평화 유지군이 배치되었고, 앞서 독일이 승인을 서두른 가운데 유럽 공동체는 1월 슬로베니아·크로아티아의 독립을 승인했다. 1991년 9월 독립을 선언한 마케도니아는 전쟁 없이 떨어져 나갔고, 1992년 4월 세르비아와 몬테네그로는 유고슬라비아 연방 공화국을 세웠다."
