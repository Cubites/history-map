- id: two-germanies-1949
  year: 1949
  endYear: 1955
  title:
    ko: 서독과 동독의 수립
  summary:
    ko: "1949년 5월 23일 서방 3개국 점령 지구에서 독일 연방 공화국(서독)의 기본법이 공포되었다. 통일 때까지의 임시 헌법이라는 뜻에서 '헌법' 대신 '기본법'이라 불렀다. 8월 첫 연방 의회 선거에서 기독교 민주 연합이 제1당이 되어 9월 아데나워가 총리가 되었고, 수도는 본에 두었다. 소련 지구에서는 10월 7일 동베를린을 수도로 한 독일 민주 공화국(동독)이 세워져(서방 3국은 베를린 전체를 4개국 관리 지역으로 보아 이를 인정하지 않았다) 피크가 대통령, 그로테볼이 총리가 되었으나 실권은 사회주의 통일당(SED)의 울브리히트가 쥐었다. 아데나워 정부는 서방과의 통합을 앞세웠고, 에르하르트 경제 장관의 사회적 시장 경제 아래 서독은 1950년대에 빠르게 성장했다('라인강의 기적'). 서독은 자신만이 독일 전체를 대표한다며 동독을 승인하는 나라와는 국교를 맺지 않거나 끊는다는 원칙(할슈타인 원칙, 1955)을 내세웠다. 동독에서는 토지 개혁과 산업 국유화로 소련식 계획 경제가 자리 잡았다."
