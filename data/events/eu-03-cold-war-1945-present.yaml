- id: korean-war-un-europe-1950
  year: 1950
  endYear: 1953
  title:
    ko: 6·25 전쟁과 소련, 유럽의 유엔군
  summary:
    ko: "1949년 소련이 원자 폭탄을 갖고 중화인민공화국이 세워진 뒤, 스탈린은 1950년 4월 모스크바를 찾은 김일성의 무력 통일 계획을 마오쩌둥의 동의를 조건으로 승인하고 무기와 군사 고문을 보냈다. 소련은 중국 대표권 문제로 1950년 1월부터 유엔 안전 보장 이사회에 나오지 않고 있어서, 북한의 남침 직후 안보리가 북한군의 철수를 요구하고(6월 25일) 회원국의 한국 지원(6월 27일)과 미국이 지휘하는 통합 사령부 설치(7월 7일)를 결의할 때 거부권을 쓰지 못했다. 소련은 8월 안보리에 돌아왔고, 중국군이 참전한 뒤에는 공군(제64 전투 비행 군단)을 비밀리에 보내 압록강 일대 하늘에서 미군과 싸웠으며, 1951년 6월 정전 회담을 제의했다. 유럽에서는 영국(연인원 5만 6천여 명)·프랑스·튀르키예·그리스·네덜란드·벨기에·룩셈부르크가 전투 부대를, 스웨덴·덴마크·노르웨이·이탈리아가 의료 지원단을 보냈다. 튀르키예 여단은 군우리 전투(1950.11)에서 미군의 후퇴를 엄호하며 큰 피해를 입었고, 프랑스 대대는 미군과 함께 지평리 전투(1951.2)에서 중국군을 막아 냈으며, 영국군 글로스터 대대는 임진강의 설마리 전투(1951.4)에서 포위된 채 버텨 중국군의 진격을 늦췄다. 서독은 정전 뒤 부산에 적십자 병원을 열어(1954~1959) 2018년 의료 지원국으로 인정받았다. 전쟁은 서방의 재무장을 재촉해 나토가 커지고 서독 재무장 논의가 시작되는 계기가 되었다."
  subjects: [soviet-union, dprk, prc, rok, usa, uk, france, turkey, greece, netherlands, belgium, luxembourg, sweden, denmark, norway, italy-republic, west-germany]
