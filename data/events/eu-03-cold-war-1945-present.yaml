  sources: ["「6개항 휴전 합의」(2008)", "유럽 연합 조지아 분쟁 독립 국제 조사 위원회 보고서(타글리아비니 보고서, 2009)", "유럽 인권 재판소 「조지아 대 러시아(II) 판결」(2021)"]
