# 중앙아시아 사건 4차 묶음 뒤 절반(ca-04b): 망기트·두라니·러시아의 시대 — 부하라 토후국·히바·코칸트·카자흐·청의 신장·준가르의 끝·투르크멘·아프가니스탄 (1747 ~ 1864년)
# 범위: 망기트 가문의 부하라 지배와 부하라 토후국의 성립·두라니 제국의 성립과 북쪽 우즈베크 땅·준가르의 마지막 계승 다툼·투르크멘 부족과 메르브·청의 신장 통치와 카자흐·코칸트 교역·히바의 쿵그라트 가문·아블라이 칸·코칸트의 알림 칸과 우마르 칸·마드라사와 노예 시장·
#   바라크자이 형제들과 두라니 제국의 갈라짐·러시아의 「시베리아 키르기스 규정」·호자 자한기르의 전쟁과 코칸트–청 협정·케네사리의 봉기·페롭스키의 히바 원정과 스토더트·코널리의 처형·도스트 무함마드의 아프가니스탄 통합·후다야르 칸의 코칸트·러시아의 시르다리야선과 침켄트·투르키스탄 점령.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(투르크멘 부족·유누스 호자의 타슈켄트·동부 부하라의 벡국과 북부 우즈베크 소국·케네사리의 칸국·호자 정권 등)은 글로만 다뤘다.
# 날짜: 출처 달력 그대로 적었다. 히즈라력은 쓰지 않았고, 확실하지 않은 날짜는 '무렵'으로, 학설이 갈리는 해는 범위나 한 구절로 적었다. 러시아 쪽 날짜는 달까지만 적거나 그레고리력으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제를 따랐고, 부하라 칸국·부하라 토후국(첫 등장 '(에미르국)')·망기트 왕조·쿵그라트 왕조·두라니 제국·바라크자이 왕조·코칸트 칸국·카자흐(카자크와 구분)·키르기스·투루판·바다크샨으로 적었다.
#   준가르의 멸망·노예 무역·투르크멘의 약탈·호자 자한기르 전쟁 뒤의 청의 보복·케네사리 봉기의 진압처럼 민감한 내용은 어느 쪽 시각도 따르지 않고 일어난 일과 사료 사정만 적었으며, 숫자가 갈리면 범위로 적거나 싣지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(건륭제의 준가르 정벌과 신장 편입, 두라니의 펀자브·카슈미르 병합, 두라니의 인도 침입과 제3차 파니파트 전투, 무함마드 샤와 헤라트 문제, 제1차 아프가니스탄 전쟁 등).
#   한국사와 닿는 점은 청의 서역 경영과 조선 사신의 기록을 견주는 한 문장으로 한정했다.

- id: manghit-bukhara-1747
  year: 1747
  endYear: 1800
  title:
    ko: "망기트 가문의 실권과 부하라 토후국의 성립(1747~1800)"
  summary:
    ko: "부하라 칸국은 아프샤르 왕조 나디르 샤의 원정(「나디르 샤의 중앙아시아 원정(1737~1747)」, 앞의 사건)으로 칸 아불 파이즈가 이란에 복속한 뒤 이름뿐인 나라가 되었고, 실권은 망기트 부족 출신 아탈릭(후견인) 무함마드 하킴에게 넘어가 있었다(「샤이반 왕조의 끝과 잔 왕조의 부하라 칸국(1599~1711)」, 앞의 사건). 나디르 샤가 1747년 6월 죽자 하킴의 아들로 전하는 무함마드 라힘은 그해 아불 파이즈와 그 아들을 죽여 잔 왕조의 대를 끊고 부하라를 장악했다. 라힘은 한동안 칭기즈 가문의 명목상 칸을 앞에 세웠다가(이름과 재위는 목록마다 다르다) 1756년 무렵 스스로 칸 칭호를 썼고 1758년 죽었다. 망기트는 칭기즈 칸의 후손이 아니어서 칸 칭호를 쓰는 일이 드물었고, 라힘의 숙부인 다니얄 비(아탈릭, 재위 1758~1785)는 자신은 아탈릭 칭호만 쓰며 나라를 다스렸고, 명목상의 칸이 남아 있었는지는 목록에 따라 다르다. 다니얄 비의 아들 샤 무라드(재위 1785~1800, 1799로 적는 목록도 있다)는 1785년 아미르 칭호를 쓰고 실제로 왕위에 올랐고, 이때부터 나라를 부하라 토후국(에미르국)이라 부른다. 샤 무라드는 금욕적인 신앙인으로 알려졌고 '아미르 마숨'이라 불렸으며, 병력과 세금을 정비하고 1788~1789년 무렵 이란 쪽 메르브를 눌러 남쪽 국경을 안정시켰다. 같은 시기 히사르·쿨롭·카라테긴·다르바즈 같은 동부 산지의 벡들과 샤흐리삽즈·키타브의 우즈베크 벡들은 사실상 따로 서서 에미르에게 공물만 바치거나 어긋나곤 했다. 아무다리야 남쪽에서는 두라니 제국(「아흐마드 샤의 두라니 제국과 북쪽 우즈베크 땅(1747~1793)」, 같은 해의 사건)과 발흐와 카타간을 두고 부딪쳤다. 부하라는 사마르칸트와 부하라의 마드라사에서 이슬람 학문의 중심이라는 이름을 지켰으나 정치적으로는 칸의 권위가 무너지고 벡·부족장·울라마가 힘을 나누는 분권적 나라가 되었다."
  subjects: [bukhara-khanate, bukhara-emirate, afsharid-iran, durrani-empire]
  tags: [politics]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: durrani-afghanistan-1747
  year: 1747
  endYear: 1793
  title:
    ko: "아흐마드 샤의 두라니 제국과 북쪽 우즈베크 땅(1747~1793)"
  summary:
    ko: "아프샤르 왕조의 나디르 샤가 1747년 6월 암살되자 그의 근위대에서 복무하던 압달리 파슈툰 부족의 아흐마드 칸은 부대를 이끌고 칸다하르로 돌아갔다. 칸다하르 가까이에서 열린 부족 회의에서 그는 지도자로 뽑혀 샤가 되었고(재위 1747~1772) 칭호를 '두르이 두란(진주 중의 진주)'이라 하면서 부족 이름이 압달리에서 두라니로 바뀌었다. 아흐마드 샤는 해마다 원정을 나가 전리품으로 군대를 먹였고, 인도 쪽은 「두라니의 펀자브·카슈미르 병합과 무굴 제국의 서쪽 상실(1748~1756)」(뒤의 사건)과 「두라니의 인도 침입과 제3차 파니파트 전투(1757~1767)」(뒤의 사건)이 다루므로, 여기서는 북쪽과 서쪽을 본다. 그는 1750~1751년 무렵 헤라트를 차지했고, 1750~1752년 사이 발흐·마이마나·안드호이·시베르간·훌름·쿤두즈 같은 아무다리야 남쪽 우즈베크 소국들을 복속시켰으며, 바다크샨은 1768~1769년 무렵 차지했다고 전한다. 부하라와는 아무다리야를 경계로 삼기로 합의했다고 하나 그 해는 사료마다 달라 1750년대 초에서 1768년 무렵까지 걸친다. 아흐마드 샤는 청 건륭제와도 사절을 주고받았다. 1772년 10월 그가 죽자 술라이만 샤가 잠시 샤를 칭했으나 곧 티무르 샤(재위 1772~1793)가 샤가 되었다. 티무르 샤는 1776년 무렵 도읍을 칸다하르에서 카불로 옮겼고(페샤와르는 겨울 도읍이었다), 1780년대 후반 발흐와 카타간을 두고 부하라의 샤 무라드와 다투었다. 두라니의 우즈베크 땅 지배는 오래 가지 못했고 쿤두즈 같은 소국은 곧 거의 독립했다. 티무르 샤가 1793년 5월 죽은 뒤 아들들이 샤 자리를 놓고 싸워 나라는 점점 기울었다(「파테 칸의 죽음과 두라니 제국의 갈라짐, 바라크자이 형제들(1818~1839)」, 뒤의 사건)."
  subjects: [durrani-empire, afsharid-iran, bukhara-khanate, bukhara-emirate, qing]
  tags: [politics, war]
  sources: ["Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Ludwig W. Adamec, Dictionary of Afghan Wars, Revolutions, and Insurgencies (Scarecrow Press, 1996)", "Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)"]

- id: dzungar-succession-1747
  year: 1747
  endYear: 1757
  title:
    ko: "준가르 마지막 칸들의 계승 다툼과 카자흐(1747~1757)"
  summary:
    ko: "준가르 칸국은 훙타이지 갈단 체렝(재위 1727~1745)이 죽은 뒤 급히 기울었다. 그의 아들 체왕 도르지 나믈(재위 1746~1750)이 뒤를 이었으나 1750년 서자 라마 도르지(재위 1750~1753)에게 쫓겨났다. 라마 도르지도 1753년 다와치(재위 1753~1755)와 호이트 부의 아무르사나가 손잡고 일으킨 반란으로 쓰러졌다. 이 사이 여러 부의 우두머리가 서로 싸웠고, 1753~1754년 두르베트 부의 우두머리들을 비롯한 몇몇 부가 청에 투항했다. 천연두가 번져 사람이 많이 죽었다고 전한다. 준가르의 주변도 흔들렸다. 오랫동안 준가르에 시달리던 카자흐는 이 틈에 유목지를 되찾기 시작했다(「준가르의 카자흐 침공과 '대재앙'(1723~1730)」, 앞의 사건). 중주즈의 술탄 아블라이는 1752~1754년 다와치와 아무르사나를 도운 것으로 알려진다. 한때 준가르에 잡혀 있던 타림 분지의 호자들은 이리에 볼모로 남아 있었다. 다와치와 사이가 틀어진 아무르사나는 1754년 청에 투항했고, 이후는 「건륭제의 준가르 정벌과 신장 편입(1755~1759)」(뒤의 사건)이 다룬다. 1755년 청군이 이리를 차지해 다와치를 붙잡은 뒤 아무르사나는 반란을 일으켰다가 1756~1757년 청군에 밀려 카자흐 초원의 아블라이에게 몸을 의탁했다. 아블라이는 청군과 싸우다 1757년 물러나 사절을 베이징에 보냈고, 청은 이를 복속의 표시로 받아들였다. 아무르사나는 러시아로 달아났다가 1757년 천연두로 죽었다. 준가르의 멸망으로 중앙아시아 초원은 청과 러시아가 맞서는 구도로 바뀌었다. 준가르 귀족들은 서로를 칸으로 세웠다가 몰아내기를 되풀이하며 군대와 유목지를 갈라 놓았다. 이 내분이 청의 개입을 쉽게 한 바탕이었다."
  subjects: [dzungar-khanate, kazakh-khanate, qing, russia]
  tags: [politics, war]
  sources: ["Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)", "Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: turkmen-tribes-1750
  year: 1750
  endYear: 1860
  title:
    ko: "요무트·테케 투르크멘과 메르브 오아시스(1750~1860)"
  summary:
    ko: "투르크멘은 카스피해 동쪽 카라쿰 사막과 호라산 북쪽, 아무다리야 강가에 흩어져 산 유목·반유목 부족들로, 하나의 왕을 두지 않고 부족과 씨족의 장로·전쟁 지도자가 이끌었다. 나디르 샤와 아프샤르 왕조가 무너진 뒤(「나디르 샤의 중앙아시아 원정(1737~1747)」, 앞의 사건) 18세기 중엽부터 요무트·테케·사리크·살로르·에르사리 같은 부족이 이란과 부하라, 히바의 틈에서 힘을 키웠다. 요무트는 히바 칸국의 서쪽 호라즘 변두리와 카스피해 쪽에 살며 히바와 때로 손잡고 때로 맞섰고, 테케는 아할 오아시스와 메르브 쪽으로 옮겨 갔다. 1788~1789년 무렵 부하라의 샤 무라드가 메르브를 눌러 술탄반드 둑을 허물었다고 전하며, 테케는 1830년대 무렵부터 메르브 델타(무르가브)에 자리를 잡았다. 투르크멘의 알라만(약탈 원정)은 이란의 호라산·아스타라바드 쪽에서 사람을 사로잡아 히바와 부하라의 시장에 팔았고, 이는 카자르 왕조(「아가 무함마드 칸과 카자르 왕조의 성립(1779~1796)」, 뒤의 사건)와의 오랜 다툼이 되었다. 히바의 칸 무함마드 아민은 1855년 사라크스 쪽 원정에서 테케에게 사로잡혀 죽었고(죽은 곳과 사정은 사료마다 다르다), 이란은 1860~1861년 메르브 원정에서 크게 졌다고 전한다. 무함마드 아민 뒤에는 압둘라 칸이 반 년 만에 죽고 사이드 무함마드 칸(재위 1856~1864)이 이었다. 이 사건들로 투르크멘은 이란과 히바 어느 쪽에도 복속하지 않은 채 19세기 후반까지 독립을 지켰으나, 포로 거래를 둘러싼 러시아의 개입 명분이 되기도 했다(「러시아의 투르크멘 정복: 괵테페와 메르브(1879~1885)」, 뒤의 사건). 메르브 오아시스는 무르가브강 물을 둑으로 끌어 쓰는 농경지이자 옛 대상로의 요지여서 이란·부하라·히바가 서로 차지하려 했다. 투르크멘 부족 사이도 한 편이 아니어서 요무트와 테케가 서로 싸우기도 했다."
  subjects: [afsharid-iran, qajar-iran, khiva-khanate, bukhara-khanate, bukhara-emirate]
  tags: [politics, war]
  sources: ["Adrienne Edgar, Tribal Nation: The Making of Soviet Turkmenistan (Princeton University Press, 2004)", "Edmund O'Donovan, The Merv Oasis: Travels and Adventures East of the Caspian during the Years 1879–80–81 (Smith, Elder, 1882)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: qing-xinjiang-1759
  year: 1759
  endYear: 1820
  title:
    ko: "청의 신장 통치와 카자흐·코칸트 교역(1759~1820)"
  summary:
    ko: "준가르를 무너뜨리고 타림 분지의 호자 형제를 눌러(「건륭제의 준가르 정벌과 신장 편입(1755~1759)」, 앞의 사건) 새 영토를 얻은 청은 이곳을 신장이라 불렀고, 1762년 이리에 장군을 두어 군정을 맡겼다. 타림 분지의 오아시스는 위구르 벡이 맡아 보는 베그 제도로 다스렸고 청이 파견한 대신들이 이를 감독했다. 청은 군대를 먹이고 변방을 채우려 둔전을 일으켰고, 1760~1830년 한인 이주 농민이 약 15만 5천 명에 이른다는 한 연구의 추정이 있고, 이들은 준가르 땅의 국영 농장에 자리 잡았다. 1820년대에는 타림 분지의 위구르 타란치 약 1만 2천 가구가 이리 쪽으로 옮겨졌다고 한다. 북쪽 경계에는 카룬이라는 초소를 이어 두어 청의 영역이 오늘 카자흐스탄 동쪽 끝까지 닿았다. 카자흐 대주즈와 중주즈의 술탄들은 1750년대 말부터 청에 공납 사절을 보냈고, 청은 우루무치와 이리, 타르바가타이에서 카자흐의 말과 가축을 비단과 바꾸어 주었다. 이는 청이 군마를 얻고 카자흐가 비단을 얻는 교역이었다(「아블라이 칸과 세 주즈의 칸 추대(1771~1781)」, 뒤의 사건). 코칸트도 청과 관계를 맺어 상인들이 카슈가르와 야르칸드에서 무역했으며, 1809년 코칸트의 공식 사과로 관계가 다시 이어졌다고 전한다(「알림 칸과 우마르 칸의 코칸트 칸국(1798~1822)」, 뒤의 사건). 청의 통치가 가벼웠던 것은 아니어서 1765년에는 우시 투루판에서 관리들의 착취에 맞선 봉기가 일어나 진압되었다. 청의 서쪽 경영은 건륭제의 십전무공(「건륭제의 십전무공(1747~1792)」, 앞의 사건)의 한 갈래였고, 조선 연행 사신들이 청의 서쪽 변방 전쟁 소식을 전해 듣고 적기도 했다고 한다."
  subjects: [qing, kazakh-khanate, kokand-khanate]
  tags: [politics, economy]
  sources: ["James A. Millward, Beyond the Pass: Economy, Ethnicity, and Empire in Qing Central Asia, 1759–1864 (Stanford University Press, 1998)", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)", "Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)"]

- id: qungrat-khiva-1770
  year: 1770
  endYear: 1825
  title:
    ko: "쿵그라트 가문의 히바 칸국(1770~1825)"
  summary:
    ko: "히바 칸국은 1740년 아프샤르 왕조의 나디르 샤에게 정복되어 칸 일바르스 2세가 처형되었고(「나디르 샤의 중앙아시아 원정(1737~1747)」, 앞의 사건) 타히르가 이란의 지원으로 한동안 칸이 되었다. 나디르가 죽은 1747년 뒤 호라즘은 투르크멘의 반란과 우즈베크 부족장들의 다툼으로 어지러웠고, 쿵그라트 부족 출신 이나크(최고 부족장)들이 칭기즈 가문 칸을 앞에 세운 채 실권을 잡아 갔다. 무함마드 아민 이나크(재위 1762 무렵~1791, 목록마다 다르다)는 늦어도 1770년까지 히바를 점령하던 요무트 투르크멘을 몰아내 질서를 잡았고, 그 아들 아와즈 이나크(1790 무렵~1804)가 이어 투르크멘과 부하라에 맞서 나라를 지켰다. 1804년 아와즈의 아들 엘투자르가 칸 칭호를 쓰며 쿵그라트 왕조가 공식으로 서고(재위 1804~1806) 칭기즈 가문의 칸은 사라졌다. 엘투자르가 1806년 부하라 원정 중 죽자(죽은 방식은 전하는 바가 다르다) 동생 무함마드 라힘 1세(재위 1806~1825)가 이었고, 그는 강한 군주로 불렸다. 그는 우즈베크 부족과 투르크멘 일부를 눌러 힘을 모았고 1808~1813년 사이 초브두르 부족과 아무다리야 삼각주의 우즈베크 부족, 시르다리야 하류의 카자흐 부족을 차례로 복속시켰다. 이 무렵 러시아도 히바에 눈길을 돌려 1819~1820년 무라비요프의 사절이 히바와 투르크멘 땅을 다녀갔으나 소득은 없었다. 히바는 관개 농업과 목축, 대상 교역에 기대었고, 노예 노동도 큰 구실을 했다(「마드라사와 노예 시장: 부하라·히바·코칸트의 사회와 교역(1800~1860)」, 뒤의 사건). 궁정 역사가 무니스와 아가히는 쿵그라트 군주들의 연대기를 썼다. 쿵그라트 왕조는 일바르스(아랍샤) 가문 뒤를 이어 히바 칸국을 1920년까지 이끌었다(「일바르스 가문의 히바 칸국과 아불 가지 칸(1511~1663)」, 앞의 사건). 히바의 도읍은 그보다 앞선 17세기 초 무렵(1600~1619년 사이로 서술이 갈린다) 아무다리야 지류가 마르면서 우르겐치에서 옮겨 와 있었다."
  subjects: [khiva-khanate, afsharid-iran, bukhara-emirate, russia]
  tags: [politics]
  sources: ["Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: ablai-khan-1771
  year: 1771
  endYear: 1781
  title:
    ko: "아블라이 칸과 세 주즈의 칸 추대(1771~1781)"
  summary:
    ko: "아블라이(1711년 출생)는 아르긴 부의 아티가이 씨족 출신으로 젊어서 준가르와 싸웠고, 1741년 무렵부터 1743년까지는 갈단 체렝에게 사로잡혀 지냈다(「준가르의 카자흐 침공과 '대재앙'(1723~1730)」, 앞의 사건). 그 뒤 그는 중주즈의 술탄으로 힘을 키워 1740년 러시아에 서약한 중주즈 칸 아불마메트 곁에서 러시아와 청 사이를 저울질했다(「아부 알카이르 칸의 러시아 신속과 세 주즈(1731~1740)」, 앞의 사건). 준가르가 무너지는 동안 그는 1752~1754년 다와치와 아무르사나를 도왔고, 1755~1757년에는 청에 쫓기는 아무르사나를 보호하다 청군과 싸웠으나 1757년 물러나 베이징에 사절을 보냈다(「준가르 마지막 칸들의 계승 다툼과 카자흐(1747~1757)」, 앞의 사건). 청은 이를 복속의 표시로 보았으나 아블라이는 러시아 쪽에도 신속의 형식을 유지해 양쪽에 줄을 대었다. 남쪽에서는 코칸트의 이르다나 비와 타슈켄트와 대상로를 두고 1765~1768년 싸웠는데 승패는 엇갈렸다. 1771년 그는 중주즈뿐 아니라 세 주즈 전체의 칸으로 추대되었고, 이는 칭기즈 가문 술탄들의 뜻을 모은 상징적 즉위였다. 같은 해 볼가강의 칼미크가 동쪽으로 떠나면서 초원이 어지러워졌다. 아블라이는 1781년 타슈켄트 근처에서 죽었다고 전하며(5월 23일이라는 서술이 있으나 정확한 날짜는 갈린다), 아들 왈리가 중주즈 칸 자리를 이었고 러시아 여제 예카테리나 2세가 이를 인정했다. 그의 죽음으로 세 주즈는 다시 따로 놀았고, 카자흐 사학은 그를 마지막으로 초원을 하나로 묶으려 한 군주로 기억한다. 서로 다른 주즈의 술탄들이 그를 칸으로 모신 것은 초원의 힘이 러시아와 청 사이에서 약해져 가던 때의 일이었다."
  subjects: [kazakh-khanate, qing, russia, kokand-khanate]
  tags: [politics]
  sources: ["Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Peter C. Perdue, China Marches West: The Qing Conquest of Central Eurasia (Harvard University Press, 2005)"]

- id: kokand-alim-umar-1798
  year: 1798
  endYear: 1822
  title:
    ko: "알림 칸과 우마르 칸의 코칸트 칸국(1798~1822)"
  summary:
    ko: "코칸트의 이르다나 비(재위 1751~1752, 1753~1769)를 이어 술라이만 비(재위 1769~1770), 나르부타 비(재위 1770~1799)가 비 칭호로 나라를 다스렸다(「샤 루흐 비와 코칸트 칸국의 성립(1709~1770)」, 앞의 사건). 1799년 나르부타가 죽자 아들 알림이 칸 칭호를 쓰며 나라를 칸국으로 끌어올렸다(재위 1799~1811). 알림은 1809년 무렵(해는 서술마다 갈린다) 유누스 호자의 후손이 이끌던 타슈켄트를 합쳐 시르다리야 쪽으로 힘을 뻗었다. 유누스 호자의 타슈켄트는 1780년대 무렵 서서 코칸트와 부하라, 카자흐 사이에서 버텨 온 자치 도시 국가였다. 알림은 청과도 관계를 다졌는데, 1809년 코칸트의 공식 사과로 청과의 관계가 다시 이어졌다고 전한다. 알림이 1810~1811년 우마르 일파와의 다툼 속에서 죽은 뒤(재위를 1801~1810으로 적는 목록도 있다) 그의 동생 우마르(재위 1811~1822, 즉위를 1809·1810년으로 적는 목록도 있다)가 칸이 되었다. 우마르는 시인 후원으로 알려졌고, 그의 왕비 마흘라르 아이임(필명 나디라)도 시를 썼다. 우마르 때 코칸트는 시르다리야 아래쪽으로 나아가 카자흐 대주즈의 땅 투르키스탄 시를 칸국 경계에 넣었고(1810년 무렵으로 적는 서술도 있다) 1810년대 후반(1817년 무렵으로 적는 서술이 있다) 악메체트(지금 크질로르다)에 요새를 세우고 카자흐 유목민에게서 세금을 걷었다. 이 때문에 시르다리야 쪽 카자흐 땅의 주인이 코칸트로 바뀌었고(1810·1817년의 일), 카자흐 사학은 이를 괴롭고 억울한 시기로 적는다. 코칸트는 면화와 비단, 타슈켄트의 상업으로 힘이 커졌고 러시아와 청 양쪽과 교역했다(「마드라사와 노예 시장: 부하라·히바·코칸트의 사회와 교역(1800~1860)」, 뒤의 사건). 우마르가 1822년 죽자 마달리가 이어 코칸트는 청과의 전쟁에 접어든다(「호자 자한기르의 카슈가르 전쟁과 코칸트–청 협정(1826~1832)」, 뒤의 사건). 코칸트의 도읍은 1740년 무렵부터 코칸트 시에 있었다."
  subjects: [kokand-khanate, kazakh-khanate, qing, bukhara-emirate, russia]
  tags: [politics]
  sources: ["Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "James A. Millward, Beyond the Pass: Economy, Ethnicity, and Empire in Qing Central Asia, 1759–1864 (Stanford University Press, 1998)"]

- id: madrasa-slave-trade-1800
  year: 1800
  endYear: 1860
  title:
    ko: "마드라사와 노예 시장: 부하라·히바·코칸트의 사회와 교역(1800~1860)"
  summary:
    ko: "19세기 전반 부하라는 이슬람 학문의 도시로 이름이 높았다. 마드라사에는 중앙아시아와 볼가 지역, 시베리아의 학생이 모여들었고, 낙슈반디 교단과 호자 가문이 와크프(종교 기부 재산)와 학문 후원으로 큰 영향을 미쳤다. 사마르칸트의 레기스탄과 부하라의 옛 마드라사들도 이 시기 계속 쓰였다(「마드라사와 낙슈반디 교단, 대상 교역과 노예 무역(1550~1700)」, 앞의 사건). 대상 교역에서 부하라·히바·코칸트는 러시아와 청, 인도와 이란을 잇는 자리에 있었다. 러시아 오렌부르크와 세미팔라틴스크로 가는 대상이 철기와 직물을 들여왔고, 부하라는 생사·면화·카라쿨 모피·염료를 내다 팔았다. 코칸트는 청 쪽 차와 비단 교역을 맡았다. 인도 상인 공동체가 부하라와 히바에 자리 잡아 환전과 대금업을 맡았다. 노예 제도는 이 사회의 일부였다. 투르크멘의 알라만에 사로잡힌 카자르 왕조 이란 호라산의 시아파 주민이 히바와 부하라의 시장에 팔렸는데, 수니파 법학자 일부는 시아파를 이단으로 보아 노예로 삼는 것을 정당하다고 보았다. 카스피해와 카자흐 초원에서 잡힌 러시아인 포로도 거래되었다. 이 노예들은 농사와 수공업, 관개 공사에 쓰였다. 부하라의 노예는 1820년대 2만~4만 명, 1860년대 2만 명 안팎이라는 추정이 있으나 합계는 추정에 불과하다. 러시아는 노예 문제를 원정의 구실로 삼았고(「페롭스키의 히바 원정 실패(1839~1840)」, 뒤의 사건), 1873년 겐데미안 조약으로 히바에서 노예제 폐지가 정해졌다(부하라는 같은 해 조약으로 노예 무역만 금지되었다고 한다)(「러시아의 히바 원정과 겐데미안 조약(1873)」, 뒤의 사건). 코칸트와 타슈켄트에도 마드라사가 많았고 졸업생은 재판관과 교사가 되었다. 이 도시들의 교육과 교역이 맞물려 칸국들의 사회를 지탱했다."
  subjects: [bukhara-emirate, khiva-khanate, kokand-khanate, russia, qajar-iran, qing]
  tags: [society, economy]
  sources: ["Scott C. Levi, The Indian Diaspora in Central Asia and Its Trade, 1550–1900 (Brill, 2002)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: barakzai-1818
  year: 1818
  endYear: 1839
  title:
    ko: "파테 칸의 죽음과 두라니 제국의 갈라짐, 바라크자이 형제들(1818~1839)"
  summary:
    ko: "두라니 제국은 티무르 샤가 죽은 1793년 뒤 샤 자리를 놓고 아들들이 싸웠다(「아흐마드 샤의 두라니 제국과 북쪽 우즈베크 땅(1747~1793)」, 앞의 사건). 자만 샤(재위 1793~1801), 마흐무드(재위 1801~1803), 슈자(재위 1803~1809), 마흐무드(1809~1811), 아바스(1811), 마흐무드(1811~1818) 같은 샤가 차례로 바뀌었고 실권은 바라크자이 부족의 와지르 파테 칸이 쥐었다. 1818년 마흐무드의 아들 캄란이 파테 칸을 붙잡아 눈을 멀게 했고 그는 곧 죽었다(누가 죽였는지는 사료마다 다르다). 이에 파테 칸의 동생들이 들고일어나 마흐무드와 캄란은 헤라트로 물러났고, 알리(1818)와 아유브(1818~1823)가 카불에서 이름뿐인 샤를 지냈다. 그 뒤 제국은 헤라트의 마흐무드와 캄란(마흐무드는 1829년 죽었고 캄란이 이었다), 칸다하르의 사르다르(바라크자이 형제인 코한딜 칸 등), 카불로 갈라졌다. 카불에서는 아짐 칸이 1823년 죽은 뒤 권력 다툼이 이어졌고 도스트 무함마드가 1826년 카불을 차지했는데, 이 세력이 훗날 아프가니스탄의 중심이 되었다. 시크 제국의 란지트 싱은 이 틈에 물탄(1818)과 카슈미르(1819)를 차지했고 페샤와르 일대도 점점 압박했다(「란지트 싱의 시크 제국(1799~1839)」, 앞의 사건). 도스트 무함마드는 1834년 무렵 아미르 칭호를 쓰며 여러 샤를 쫓아냈으나 같은 해 시크가 페샤와르를 병합했고, 1837년 잠루드에서 시크와 싸웠다. 헤라트는 이란의 압박을 받았다(「무함마드 샤와 헤라트 문제, 영국–이란 전쟁(1834~1857)」, 뒤의 사건). 1839년 영국이 샤 슈자를 앞세워 카불을 차지하면서 이 시기가 끝났다(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 뒤의 사건)."
  subjects: [durrani-empire, afghanistan, herat-principality, kandahar-principality, sikh-empire]
  tags: [politics, war]
  sources: ["Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Christine Noelle, State and Tribe in Nineteenth-Century Afghanistan: The Reign of Amir Dost Muhammad Khan (1826–1863) (Curzon Press, 1997)", "Ludwig W. Adamec, Dictionary of Afghan Wars, Revolutions, and Insurgencies (Scarecrow Press, 1996)"]

- id: kazakh-steppe-russia-1822
  year: 1822
  endYear: 1836
  title:
    ko: "「시베리아 키르기스 규정」과 카자흐 칸 지위의 폐지(1822~1836)"
  summary:
    ko: "러시아의 초원 지배는 18세기 소주즈(1731)와 중주즈(1740)의 신속에서 비롯했으나(「아부 알카이르 칸의 러시아 신속과 세 주즈(1731~1740)」, 앞의 사건) 오랫동안 칸과 술탄의 이름뿐인 복속에 머물렀다. 이를 바꾼 것은 시베리아 총독을 지낸 스페란스키가 마련한 「시베리아 키르기스 규정」(1822)이다. 이 규정은 중주즈를 바깥 구역과 안쪽 구역(오크루그)으로 나누어 선출한 연장자 술탄이 다스리게 하고 칸 칭호를 없앴으며, 카자흐를 러시아 제국의 이민족 신분으로 분류했다. 왈리 칸(재위 1781~1819)의 아들 구바이둘라(1819~1822)가 마지막 중주즈 칸이었다고 전하나, 1816년 이후 중주즈에 칸이 둘 있었다는 서술도 있다. 1824년에는 오렌부르크에서 따로 정한 규정으로 소주즈 칸 지위도 없앴다. 1824년 코크체타우와 카르칼랄린스크, 1830년 악몰린스크에 구역 관청이 들어서면서 러시아 관리가 초원에서 직접 세금과 재판을 맡기 시작했다. 술탄과 부족장에게는 관직과 연금이 주어졌고, 카자흐 귀족 자제는 옴스크의 학교에서 러시아식 교육을 받았다. 한편 러시아의 요새선(「오렌부르크 원정과 요새선, 바시키르의 저항」, 앞의 사건)이 넓어지고 코사크 이주가 늘면서 유목민의 겨울 목지와 샘이 줄었다. 칸 지위의 폐지는 카자흐 칸국이 형식에서도 사라지는 걸음이었지만, 초원 남쪽 대주즈는 여전히 코칸트에 세금을 냈고(「알림 칸과 우마르 칸의 코칸트 칸국(1798~1822)」, 앞의 사건) 이는 1830년대 말 케네사리 봉기의 배경이 되었다(「케네사리 카심울리의 봉기(1837~1847)」, 뒤의 사건). 카자흐 사학은 이 조치를 형식으로나마 남아 있던 칸의 독립이 끝나는 분기점으로 본다."
  subjects: [russia, kazakh-khanate, kokand-khanate]
  tags: [politics]
  sources: ["Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)"]

- id: jahangir-khoja-1826
  year: 1826
  endYear: 1832
  title:
    ko: "호자 자한기르의 카슈가르 전쟁과 코칸트–청 협정(1826~1832)"
  summary:
    ko: "청이 1759년 타림 분지를 차지한 뒤(「갈단의 타림 분지 정복과 야르칸드 칸국의 끝(1678~1705)」, 앞의 사건) 이전에 이곳을 다스리던 아파크 호자의 후손들은 코칸트로 달아나 지냈다. 코칸트와 청은 이 후손들을 감시하고 내보내지 않기로 은밀히 합의했다고 전하며, 그 대가로 코칸트가 은과 차, 통상 특권을 받았다고 한다. 자한기르(1788년 출생)는 1826년 5월 이 합의를 어기고 코칸트를 빠져나와 카슈가르에 들어갔고, 키르기스의 도움으로 봉기를 일으켰다. 1827년 초 카슈가르의 굴바그 요새와 야르칸드·호탄·마랄바시 등 서부 여섯 도시를 차지했으나, 청은 1827년 9월 아크수에 약 7만~8만 명의 군대를 모아 1828년 1월 반격했다. 자한기르는 투만 강가에서 지고 1월 29일 알라이 계곡으로 달아났다. 청군이 카슈가르 주민을 학살했다고 전한다. 같은 해 그는 붙잡혀 베이징으로 끌려가 6월 25일 능지로 처형되었다. 코칸트의 마달리 칸은 이 일에 관여해 호자 유수프를 카슈가르의 지배자로 내세웠다는 서술이 있다. 유수프는 1830년 코칸트군을 이끌고 카슈가르를 점령하고(9월) 굴바그 요새를 포위하며 야르칸드로 나아갔으나 12월 말 물러났다. 1832년 1월 13일 코칸트와 청이 조약을 맺었다. 코칸트 상인은 카슈가르에서 관세 면제와 같은 통상 특권을 얻었고, 코칸트의 대표인 악사칼이 카슈가르에 머물며 상인을 관리하게 되었다. 이는 코칸트가 청의 신장 교역을 쥐는 계기였고, 호자 후손들이 일으킨 소요는 1850~1860년대까지 이어졌다(「서북 회민 봉기와 야쿱 벡, 좌종당의 신장 수복과 이리 문제(1862~1884)」, 뒤의 사건). 코칸트는 이 조약으로 타림 분지 여섯 도시의 교역에서 이익을 얻었으나 정치적으로는 청에 눌린 모양이 되었다."
  subjects: [kokand-khanate, qing]
  tags: [war, diplomacy]
  sources: ["James A. Millward, Beyond the Pass: Economy, Ethnicity, and Empire in Qing Central Asia, 1759–1864 (Stanford University Press, 1998)", "Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)", "Kim Hodong, Holy War in China: The Muslim Rebellion and State in Chinese Central Asia, 1864–1877 (Stanford University Press, 2004)"]

- id: kenesary-1837
  year: 1837
  endYear: 1847
  title:
    ko: "케네사리 카심울리의 봉기(1837~1847)"
  summary:
    ko: "케네사리(1802년 출생)는 아블라이 칸의 손자이자 술탄 카심의 아들로 칭기즈 가문 토레 계통이다(「아블라이 칸과 세 주즈의 칸 추대(1771~1781)」, 앞의 사건). 러시아가 초원에 구역과 요새를 늘려 목지가 줄고(「「시베리아 키르기스 규정」과 카자흐 칸 지위의 폐지(1822~1836)」, 앞의 사건) 남쪽 대주즈는 코칸트에 세금을 내자, 그는 1837년 러시아 요새와 코칸트 양쪽에 맞서 봉기했다. 그가 노린 것은 아블라이 시대처럼 칸이 이끄는 독립된 카자흐 국가였다. 1838년 5월에는 악몰린스크 요새를 차지했고, 러시아 당국에 보낸 사절은 붙잡혀 벌을 받았다. 1841년 그는 칸으로 추대되어 한동안 따로 선 칸국을 이끌며 세금을 걷고 법정을 열었다. 러시아는 오렌부르크와 시베리아에서 토벌대를 거듭 보냈고 협상도 시도했으나 끝내 어긋났다. 1840년대 중반 케네사리는 쫓겨 남쪽으로 내려가 코칸트가 세운 요새와 키르기스 땅을 두고 싸웠고, 1847년 키르기스 부족장들(만압)과 맞서다 죽었다. 그의 머리가 러시아에 보내졌다는 서술이 있다. 카자흐스탄에서는 이 봉기를 민족 해방 운동으로 기억하는 반면 소련 사학은 이를 반동적 봉건 운동으로 보았고, 평가는 지금도 갈린다. 케네사리가 죽고 봉기가 끝난 뒤 러시아는 시르다리야와 이르티시 쪽 요새선을 넓혔다(「러시아의 시르다리야선과 카자흐 칸국의 끝(1847~1854)」, 뒤의 사건). 그를 따른 사람들은 중주즈와 소주즈의 유목민이었으나 술탄과 부족장 가운데는 러시아 편에 선 이도 적지 않았다. 봉기군은 러시아 요새와 코칸트가 세운 요새를 가리지 않고 공격했고, 토벌대가 다가오면 초원 깊숙이 물러났다가 되돌아오는 방식으로 맞섰다."
  subjects: [kazakh-khanate, russia, kokand-khanate]
  tags: [war, politics]
  sources: ["Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Michael Khodarkovsky, Russia's Steppe Frontier: The Making of a Colonial Empire, 1500–1800 (Indiana University Press, 2002)"]

- id: nasrullah-stoddart-1838
  year: 1838
  endYear: 1842
  title:
    ko: "나스룰라 에미르와 스토더트·코널리의 처형(1838~1842)"
  summary:
    ko: "부하라 토후국의 에미르 하이다르(재위 1800~1826)가 죽은 뒤 후세인(재위 1826~1827)과 우마르(1827)를 거쳐 형제 사이의 다툼 끝에 나스룰라(재위 1827~1860)가 즉위했다(「망기트 가문의 실권과 부하라 토후국의 성립(1747~1800)」, 앞의 사건). 그는 신앙에 엄격하고 의심이 많은 군주로 알려졌고 동부 벡국들과 코칸트를 상대로 거듭 원정했다. 1838년 영국 동인도 회사 장교 찰스 스토더트가 에미르에게 러시아인 노예의 석방을 요구하고 영국과의 우호 조약을 맺으려 부하라에 왔다. 에미르는 그를 붙잡았다가 풀어 주었다가 다시 가두었다. 1841년 11월에는 아서 코널리 대위가 스토더트를 구하려 부하라에 들어왔으나 같은 길을 걸었다. 영국이 1839년부터 아프가니스탄을 차지했다가(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 같은 해의 사건) 1841년 말 카불에서 무너지자, 에미르가 영국 장교들의 값을 낮게 보았다고 하는 서술이 있다. 두 사람은 1842년 6월 24일 첩자라는 죄목으로 처형되었다. 영국에서는 이 일이 큰 충격이었고, 목사 조지프 울프가 1843~1845년 이들의 소식을 알아보려고 부하라에 가서 목숨을 간신히 건졌다. 1845년의 보고서가 두 사람의 이름을 영국 사회에 널리 알렸다. 이 사건은 영국이 중앙아시아 칸국들의 내부에 깊이 개입하지 않기로 하는 계기가 되었고, 러시아에는 영국이 이곳에서 힘이 없다는 인상을 주었다. 에미르 나스룰라는 같은 해 코칸트를 점령하는 데로 나아갔다(「부하라의 코칸트 점령과 후다야르 칸의 코칸트(1842~1865)」, 뒤의 사건)."
  subjects: [bukhara-emirate, uk, russia, company-india]
  tags: [diplomacy, politics]
  sources: ["Peter Hopkirk, The Great Game: On Secret Service in High Asia (John Murray, 1990)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Joseph Wolff, Narrative of a Mission to Bokhara, in the Years 1843–1845 (J. W. Parker, 1845)"]

- id: perovsky-khiva-1839
  year: 1839
  endYear: 1840
  title:
    ko: "페롭스키의 히바 원정 실패(1839~1840)"
  summary:
    ko: "러시아가 히바를 노린 것은 1717년 베코비치-체르카스키 원정의 패배 이래 처음 있는 큰 원정이었다. 직접 명분은 히바의 노예 거래였다. 러시아는 1836년 러시아 땅에서 히바 상인들을 붙잡았고, 히바의 칸 알라 쿨리(재위 1825~1842)는 1836년 대상이 이르자 러시아인 포로 25명(대부분 노인)만 풀어 주었다. 러시아 정부는 이 무렵 영국이 아프가니스탄에 군대를 보내는 것(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 앞의 사건)에 견주어 중앙아시아 쪽에서도 영향력을 키우려 했고, 노예 문제를 이유로 칸을 러시아에 우호적인 인물로 바꾸려 했다. 1839년 3월 차르가 승인했고 오렌부르크 총독 바실리 페롭스키가 1839년 11월 병력 약 5천 명(정보 상자는 6,651명)을 이끌고 출발했다. 기병 네 부대가 하루 이틀 간격으로 뒤따랐다. 혹한과 눈보라가 이어졌고 낙타가 줄줄이 쓰러졌다. 1840년 2월 페롭스키는 철수를 결정했고, 이달 말까지 모든 부대가 엠바강으로 돌아왔다. 러시아군 사망은 1천여 명에서 2천 5백여 명이며(자료마다 다름), 바시키르 마부와 말, 낙타 손실도 컸다. 이 원정은 히바에 닿지 못한 채 끝났으나, 영국이 히바에 보낸 리치먼드 섁스피어가 1840년 칸을 설득해 러시아인 노예 416명을 풀어 주게 했다. 페롭스키는 이 실패 뒤에도 지휘권을 지켜 1853년 악메체트를 차지했고(「러시아의 시르다리야선과 카자흐 칸국의 끝(1847~1854)」, 뒤의 사건), 히바는 1873년에야 러시아에 무릎을 꿇었다(「러시아의 히바 원정과 겐데미안 조약(1873)」, 뒤의 사건). 원정 비용은 170만 루블(지폐 값일 수 있다)에 이른 것으로 전한다."
  subjects: [russia, khiva-khanate, uk]
  tags: [war, diplomacy]
  sources: ["Peter Hopkirk, The Great Game: On Secret Service in High Asia (John Murray, 1990)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)"]

- id: dost-mohammad-return-1842
  year: 1842
  endYear: 1863
  title:
    ko: "도스트 무함마드의 복귀와 아프가니스탄 통합(1842~1863)"
  summary:
    ko: "제1차 아프가니스탄 전쟁에서 영국이 물러난 뒤 샤 슈자는 1842년 4월 살해되었고(「제1차 아프가니스탄 전쟁과 남아시아 쪽의 일(1838~1842)」, 앞의 사건), 1840년 영국에 항복해 인도로 유배되었던 도스트 무함마드는 1843년 카불로 돌아왔다(1842년으로 적는 책도 있다). 그는 이후 20년 동안 아프가니스탄의 여러 갈래를 하나로 묶었다. 먼저 하자라자트와 타가브를 눌렀고, 북쪽으로 1850년 무렵 발흐와 훌름을 차지했으며 1859년 무렵 쿤두즈까지 눌렀다. 남쪽 칸다하르는 1855년 코한딜 칸이 죽자 도스트의 아들들이 차지했다(1856년으로 적는 서술도 있다). 같은 해 3월 영국과 페샤와르에서 우호 조약을 맺었고, 1857년 1월 영국의 보조금을 받는 조약으로 이를 넓혔다. 도스트는 1857년 인도에서 대반란이 일어났을 때 영국을 치지 않았다. 헤라트는 카자르 왕조 이란의 압박을 받아 1856년 10월 이란군이 차지했다가 영국–이란 전쟁 뒤 물러났다(「무함마드 샤와 헤라트 문제, 영국–이란 전쟁(1834~1857)」, 앞의 사건). 도스트는 오랜 포위 끝에 1863년 5월 헤라트를 차지했으나 그해 6월 9일 그곳에서 죽었다. 이로써 카불·칸다하르·헤라트가 한 나라로 합쳐졌다. 이는 1818년 파테 칸의 죽음으로 갈라졌던 두라니 제국의 땅을 바라크자이 가문이 다시 모은 셈이다(「파테 칸의 죽음과 두라니 제국의 갈라짐, 바라크자이 형제들(1818~1839)」, 앞의 사건). 도스트의 아들들 사이의 계승 전쟁은 곧바로 시작되었다(「셰르 알리와 아프가니스탄의 계승 전쟁(1865~1878)」, 뒤의 사건). 도스트는 아들들을 각지의 총독으로 보내 땅을 맡겼고, 이 방식이 곧 아들들 사이의 경쟁으로 이어졌다."
  subjects: [afghanistan, kandahar-principality, herat-principality, uk, company-india, qajar-iran]
  tags: [politics, war]
  sources: ["Christine Noelle, State and Tribe in Nineteenth-Century Afghanistan: The Reign of Amir Dost Muhammad Khan (1826–1863) (Curzon Press, 1997)", "Jonathan L. Lee, Afghanistan: A History from 1260 to the Present (Reaktion Books, 2018)", "Ludwig W. Adamec, Dictionary of Afghan Wars, Revolutions, and Insurgencies (Scarecrow Press, 1996)"]

- id: kokand-khudayar-1842
  year: 1842
  endYear: 1865
  title:
    ko: "부하라의 코칸트 점령과 후다야르 칸의 코칸트(1842~1865)"
  summary:
    ko: "코칸트의 마달리 칸(재위 1822~1842)은 부하라의 에미르 나스룰라가 1842년 코칸트를 침공하자 붙잡혀 곧 처형되었고, 부하라의 점령 뒤 일어난 반란 속에서 코칸트 사람들이 6월 마달리의 사촌 시르 알리를 칸으로 세웠다(「나스룰라 에미르와 스토더트·코널리의 처형(1838~1842)」, 앞의 사건). 나스룰라는 코칸트를 점령한 채 오래 머물지 못했고, 시르 알리(재위 1842~1844)가 죽은 뒤 무라드(1844)를 거쳐 후다야르(재위 1844~1852)가 칸이 되었다. 어린 후다야르를 대신해 킵차크 출신 밍바시 무슬림쿨이 실권을 쥐었고, 킵차크와 토박이 사르트 사이의 다툼이 거세졌다. 1852년 후다야르가 무슬림쿨을 제거하는 과정에서 킵차크 사람들이 학살되었다는 서술이 있으나 희생자 수는 사료마다 크게 다르다. 후다야르(재위 1852~1858)는 다시 칸이 되었으나 이번에는 형제 말라(재위 1858~1862)에게 밀려났다. 말라 이후 샤 무라드(1862)를 거쳐 후다야르가 세 번째로 칸이 되었으나(1862~1863) 이번에는 킵차크와 키르기스의 지도자 알림쿨이 술탄 사이드(재위 1863~1865)를 내세웠다. 코칸트는 이 안에서 러시아에게 시르다리야 쪽 땅을 잇달아 내주었다(「러시아의 시르다리야선과 카자흐 칸국의 끝(1847~1854)」, 뒤의 사건). 알림쿨은 1865년 타슈켄트에서 러시아군과 싸우다 죽었고(「러시아의 타슈켄트 점령과 이르자르 전투(1865~1866)」, 뒤의 사건), 빌 바흐치의 짧은 재위(1865) 뒤 후다야르가 네 번째로 칸이 되었다(1865~1875). 타슈켄트의 상인 세력과 페르가나의 농민, 키르기스 유목민이 서로 다른 후보를 밀어 나라가 하나로 모이지 못했다."
  subjects: [kokand-khanate, bukhara-emirate, russia]
  tags: [politics]
  sources: ["Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)", "Seymour Becker, Russia's Protectorates in Central Asia: Bukhara and Khiva, 1865–1924 (Harvard University Press, 1968)", "Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)"]

- id: syr-darya-line-1847
  year: 1847
  endYear: 1854
  title:
    ko: "러시아의 시르다리야선과 카자흐 칸국의 끝(1847~1854)"
  summary:
    ko: "케네사리가 죽은 1847년(「케네사리 카심울리의 봉기(1837~1847)」, 앞의 사건) 러시아는 두 방향으로 요새선을 밀어 냈다. 동쪽에서는 발하시호 남동쪽에 코팔 요새를 세워 대주즈 카자흐를 러시아의 신민으로 받아들였고, 서쪽에서는 아랄해로 흘러드는 시르다리야 하구에 라임 요새를 지었는데, 이 요새는 히바 칸국의 아랄해 쪽 영향권을 가로막는 자리였다. 코칸트는 시르다리야 아래쪽 악메체트(지금 크질로르다)에 요새를 두고 있었다(「알림 칸과 우마르 칸의 코칸트 칸국(1798~1822)」, 앞의 사건). 1852년의 공격이 실패한 뒤 오렌부르크 총독 페롭스키가 1853년 악메체트를 차지해 페롭스키 요새로 고쳐 불렀고(「페롭스키의 히바 원정 실패(1839~1840)」, 앞의 사건) 뒤이어 근처에 요새를 잇달아 세웠다. 1854년에는 알마티 쪽에 베르니 요새를 세워 대주즈의 땅(세미레치예)까지 들어왔다. 이로써 오렌부르크선과 시베리아선 사이의 시르다리야선이 이어졌고, 카자흐 칸국이라 부를 만한 틀은 사라졌다. 카자흐는 목지의 겨울 숙영지와 샘을 요새와 코사크 이주민에게 내주었고, 러시아 관리가 구역 단위로 다스리면서 술탄들의 옛 권위는 형식만 남았다. 코칸트는 시르다리야 아래쪽을 잃고 투르키스탄과 타슈켄트 쪽으로 물러섰다(「침켄트·투르키스탄·아울리에아타 점령과 코칸트의 시르다리야 땅 상실(1864)」, 뒤의 사건). 이 선은 곧 이어질 러시아의 코칸트 칸국 정복의 발판이 되었다(「러시아의 타슈켄트 점령과 이르자르 전투(1865~1866)」, 뒤의 사건). 1851년에는 청과 러시아가 이리 쿨자 조약을 맺어 두 나라 상인이 이리와 타르바가타이에서 교역하게 되었다. 새 요새는 화약과 식량을 쌓는 병참 거점이 되었고, 요새 가까이의 목지를 쓰려면 카자흐 유목민도 러시아 관리의 허락을 받아야 했다."
  subjects: [russia, kazakh-khanate, kokand-khanate, khiva-khanate, qing]
  tags: [war, politics]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)"]

- id: kokand-russia-1864
  year: 1864
  endYear: 1864
  title:
    ko: "침켄트·투르키스탄·아울리에아타 점령과 코칸트의 시르다리야 땅 상실(1864)"
  summary:
    ko: "1850년대 말 러시아는 시르다리야선을 넘어 코칸트 땅을 잠식하고 있었다. 1850년대에 줄렉을 코칸트에게서 빼앗았고 1861년에는 야니쿠르간을 부수어 시르다리야 하류의 코칸트 거점을 허물었다. 1860년대 초 러시아는 미국 남북 전쟁으로 면화 값이 오르자 중앙아시아 면화를 얻으려는 뜻과 국경의 안전, 영국에 대한 견제를 앞세워 오렌부르크선과 시베리아선을 잇는 일에 나섰다. 1864년 6월 베료프킨의 부대가 시르다리야 하류의 투르키스탄(하즈라티 투르키스탄)을 차지했고 체르냐예프의 부대는 아울리에아타와 수자크를 차지했다. 두 부대가 이어져 시르다리야선이 닫혔다. 1864년 9월에는 침켄트도 러시아의 손에 들어갔다(「러시아의 타슈켄트 점령과 이르자르 전투(1865~1866)」, 뒤의 사건). 코칸트의 실권자 알림쿨은 그해 말 이칸에서 러시아군에게 지고 물러났다고 한다. 이로써 코칸트 칸국은 투르키스탄과 침켄트, 아울리에아타의 도시와 시르다리야 일대를 잃어 영토가 줄고 상업에서 큰 손실을 입었다(「부하라의 코칸트 점령과 후다야르 칸의 코칸트(1842~1865)」, 앞의 사건). 코칸트는 안으로도 킵차크와 사르트, 칸의 후보가 엇갈려 싸우느라 맞설 힘이 없었다. 타슈켄트는 다음 해 러시아의 손에 넘어갔으며, 이때부터 러시아의 중앙아시아 정복이 본격화되었다. 시르다리야 하류의 옛 코칸트 땅은 세금과 소금, 목축으로 수입을 내던 곳이었다. 대주즈의 카자흐 부족장 상당수는 이 무렵 코칸트에서 떠나 러시아 편에 섰다. 코칸트의 요새와 성벽은 대포와 소총을 갖춘 러시아 소부대 앞에서 오래 버티지 못했고, 이 해의 점령은 이듬해 타슈켄트를 치는 징검다리가 되었다."
  subjects: [russia, kokand-khanate]
  tags: [war]
  sources: ["Alexander Morrison, The Russian Conquest of Central Asia: A Study in Imperial Expansion, 1814–1914 (Cambridge University Press, 2021)", "Richard A. Pierce, Russian Central Asia, 1867–1917: A Study in Colonial Rule (University of California Press, 1960)", "Scott C. Levi, The Rise and Fall of Khoqand, 1709–1876 (University of Pittsburgh Press, 2017)"]
