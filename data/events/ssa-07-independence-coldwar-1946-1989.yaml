- id: rwanda-burundi-1959
  year: 1959
  endYear: 1962
  title:
    ko: "르완다 혁명과 르완다·부룬디의 독립(1959~1962)"
  summary:
    ko: "벨기에는 제1차 세계 대전 뒤 독일령 동아프리카의 서쪽을 루안다-우룬디로 다스렸고(「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」(앞의 사건)), 투치 엘리트를 앞세운 간접 통치 아래 후투와 투치의 신분 차이가 굳었다. 1959년 7월 르완다의 왕 무타라 3세가 갑자기 숨지고, 11월 1일 후투 정당 파르메후투 지지자 도미니크 음보뉴뭉트와가 투치 청년들에게 맞은 일을 계기로 후투 봉기가 번져 투치 지도자의 집이 불타고 투치 주민이 쫓겨났다. 벨기에는 대령 기 로지에스트를 보내 질서를 되찾으면서 후투를 지지하고 투치 족장 다수를 후투로 바꾸었다. 1961년 1월 28일 후투 지도자들이 공화국을 선포해 도미니크 음보뉴뭉트와를 임시 대통령으로 세웠고, 9월 총선과 같은 시기 국민 투표로 왕정이 폐지되었으며 10월 그레구아르 카이반다가 대통령이 되어 이끄는 파르메후투 정부가 들어섰다. 이 과정에서 투치 난민이 이웃 나라로 빠져나가 1964년 말까지 최소 수십만 명(공식 집계 33만 6천 명)이 되었다. 부룬디에서는 1961년 9월 총선에서 루이 르와가소레의 민족 진보 연합이 이겼으나 그가 10월 13일 암살되었다. 1962년 7월 1일 르완다는 공화국으로, 부룬디는 왕국으로 독립해 루안다-우룬디가 끝났다. 1990년대 내전과 집단 학살은 이 혁명이 낳은 난민 문제와 이어진다(「르완다 집단 학살(1994)」(뒤의 사건)). 1960년 6~7월 코뮌 선거에서 파르메후투가 크게 이겼고 왕 키겔리 5세는 7월 콩고로 떠났다가 돌아왔으나 1961년 10월 벨기에 당국에 추방되었다. 1963년 말부터 1964년 초 망명 투치의 부게세라 침공 뒤 투치 약 1만 명이 숨졌다고 한다. 부룬디는 1966년 왕정이 무너지고 공화국이 되었다. 1973년 7월에는 쥐베날 하비아리마나가 쿠데타로 카이반다를 몰아냈다."
  subjects: [belgium, ruanda-urundi, rwanda, burundi]
  links:
