- id: mali-federation-1959
  year: 1959
  endYear: 1960
  title:
    ko: "말리 연방과 세네갈·말리의 독립(1959~1960)"
  summary:
    ko: "1958년 프랑스 공동체 국민 투표 뒤(「프랑스 공동체 국민 투표와 기니의 독립(1958)」(앞의 사건)) 프랑스령 서아프리카의 정치 지도자들은 영토별로 쪼개지지 않고 하나의 연방으로 독립하려 했고, 1959년 4월 4일 프랑스령 세네갈과 프랑스령 수단(수단 공화국)이 말리 연방을 세웠다. 연방 의회 의장은 세네갈의 레오폴 세다르 상고르, 정부 수반은 수단의 모디보 케이타였고, 다호메이와 오트볼타도 가입을 검토했으나 코트디부아르의 우푸에부아니가 반대해 물러났다. 1960년 4월 프랑스와 이양 협정을 맺은 뒤 연방은 1960년 6월 20일 공동체 안에서 독립을 선포했다. 그러나 정치 노선이 달라 세네갈은 상고르와 마마두 디아의 온건 노선, 수단은 케이타의 사회주의 노선이었고, 대통령 선출을 둘러싼 갈등 끝에 1960년 8월 20일 세네갈 의회가 연방 이탈과 독립을 선언했다. 케이타는 연방 해체 뒤 1960년 9월 22일 수단 공화국을 말리 공화국으로 선포해 독립 국가 말리가 되었고, 세네갈과의 국경을 닫았다. 세네갈은 상고르가 대통령이 되어 1980년까지 이끌었고 말리는 1968년 쿠데타까지 케이타가 다스렸다. 말리라는 이름은 옛 말리 제국에서 땄다. 연방 헌법은 1959년 1월 다카르 회의에서 마련되었고 수도는 프랑스령 서아프리카의 옛 수도 다카르였다. 세네갈에서 총리 마마두 디아는 1962년 12월 쿠데타 혐의로 붙잡혀 정치에서 밀려났다. 세네갈은 항구 다카르를 가진 해안 상업 지역이었고 수단은 내륙의 농업·목축 지역이어서 이해가 달랐다. 이탈 직후 수단 쪽 대표는 봉인된 열차로 수단으로 보내졌다. 말리는 1962년 자체 화폐 말리 프랑을 도입했다."
  subjects: [france, french-senegal, french-sudan, senegal, mali]
  links:
    - { from: france, to: senegal, note: "프랑스령 세네갈의 독립을 승인 (1960-08-20)" }
    - { from: france, to: mali, note: "프랑스령 수단의 독립을 승인 (1960-09-22)" }
  tags: [politics]
