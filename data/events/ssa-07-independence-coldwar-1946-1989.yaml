- id: sierra-leone-gambia-1961
  year: 1961
  endYear: 1965
  title:
    ko: "시에라리온과 감비아의 독립(1961~1965)"
  summary:
    ko: "시에라리온은 18세기 말 해방된 흑인 정착민이 세운 프리타운 식민지와 19세기 말 영국이 선포한 내륙 보호령을 합친 시에라리온 식민지 및 보호령이었다(「노예 무역 금지와 시에라리온·감비아 식민지(1807~1821)」(앞의 사건)). 1951년 헌법으로 내륙 보호령 주민이 정치에 참여하게 되었고, 시에라리온 인민당의 밀턴 마르가이가 1954년 수석 장관이 되어 협상을 이끌었다. 시에라리온은 1961년 4월 27일 영연방 안에서 독립했고, 마르가이는 1964년 죽을 때까지 총리였으며 1971년 공화국이 되었다. 감비아는 감비아강 연안의 좁은 영국령 감비아로, 세네갈 안에 갇힌 모양이라 독립이 늦어졌다. 인민 진보당의 다우다 자와라가 1962년 총리가 되어 1965년 2월 18일 영연방 안에서 독립했고 1970년 4월 국민 투표로 공화국이 되었다. 감비아는 1982년부터 1989년까지 세네갈과 세네감비아 연합을 이루었고 다시 갈라졌다. 감비아의 독립으로 영국의 서아프리카 식민지는 모두 독립했다. 프리타운은 1787년 영국의 노예제 폐지론자들이 가난한 흑인들을 정착시킨 곳이고, 1792년 노바스코샤에서 온 해방 노예가 더해졌으며 이들의 후손을 크리올이라 부른다. 1827년 세워진 풀라 베이 칼리지는 서아프리카 최초의 대학으로 꼽힌다. 시에라리온은 1930년 코노 지방에서 발견된 다이아몬드가 주요 수출품이 되었고, 감비아는 땅콩 수출에 기대는 작은 경제였다. 시에라리온은 1967년 선거 뒤 군부가 개입한 끝에 1971년 시아카 스티븐스가 공화국 대통령이 되었고, 감비아의 자와라는 1994년 쿠데타로 쫓겨날 때까지 집권했다. 시에라리온은 1961년 9월 유엔에 가입했다."
  subjects: [uk, british-sierra-leone, british-gambia, sierra-leone, gambia]
  links:
    - { from: uk, to: sierra-leone, note: "시에라리온 식민지 및 보호령의 독립을 승인 (1961-04-27)" }
    - { from: uk, to: gambia, note: "영국령 감비아의 독립을 승인 (1965-02-18)" }
  tags: [politics]
  sources: ["Christopher Fyfe, A History of Sierra Leone (Oxford University Press, 1962)", "Arnold Hughes, David Perfect, A Political History of The Gambia, 1816–1994 (University of Rochester Press, 2006)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: east-africa-independence-1961
  year: 1961
  endYear: 1964
  title:
    ko: "탕가니카·우간다·케냐의 독립과 잔지바르 혁명, 탄자니아 연합(1961~1964)"
  summary:
    ko: "영국의 동아프리카 세 영토는 3년 사이에 차례로 독립했다. 줄리어스 니에레레가 이끈 탕가니카 아프리카 민족 연합(TANU)은 유엔 신탁 통치령인 영국령 탕가니카를 1961년 12월 9일 독립으로 이끌었고 니에레레는 1962년 공화국의 첫 대통령이 되었다. 우간다 보호령은 부간다 왕국의 왕당파 정당 카바카 예카와 밀턴 오보테의 우간다 인민 회의가 연합하여 1962년 10월 9일 독립했고 오보테가 총리였다. 케냐 식민지는 마우마우 봉기(「마우마우 봉기와 케냐 비상사태(1952~1960)」(앞의 사건)) 뒤 조모 케냐타의 케냐 아프리카 민족 동맹이 이끌어 1963년 12월 12일 독립했고 케냐타는 총리를 거쳐 1964년 공화국의 대통령이 되었다. 1963년 12월 10일 영국에서 독립한 잔지바르 술탄국은 1964년 1월 12일 존 오켈로와 아프로-시라지당의 혁명으로 술탄이 쫓겨났고 아베이드 카룸이 대통령이 되었으며 이 과정에서 아랍계와 남아시아계 주민이 많이 희생되었으나 집계가 갈린다. 1964년 1월 세 나라의 군대 반란은 영국군이 진압했고, 우간다는 1971년 1월 이디 아민의 정변을 겪는다. 1964년 4월 26일 탕가니카와 잔지바르는 합쳐 연합 공화국이 되었고 10월 29일 탄자니아로 이름을 바꾸었다. 잔지바르 술탄국은 이 혁명으로 끝났고, 혁명으로 선 잔지바르 정부는 4월 합병으로 탄자니아에 들어갔다(「사이드 빈 술탄의 죽음과 오만·잔지바르의 분리, 영국의 배타 협정(1856~1891)」(앞의 사건)). 케냐 북동부의 소말리인은 소말리아와 합치기를 바라 1963년 시프타 전쟁을 벌였다. 니에레레는 1967년 아루샤 선언으로 공동체 중심의 사회주의 노선 우자마를 내세웠다. 케냐타는 1978년까지, 니에레레는 1985년까지 각자의 나라를 이끌었다."
  subjects: [uk, british-tanganyika, british-uganda, british-kenya, sultanate-of-zanzibar, tanzania, uganda, kenya]
  links:
    - { from: uk, to: tanzania, note: "영국령 탕가니카의 독립을 승인 (1961-12-09)" }
    - { from: uk, to: uganda, note: "우간다 보호령의 독립을 승인 (1962-10-09)" }
    - { from: uk, to: kenya, note: "케냐 식민지의 독립을 승인 (1963-12-12)" }
  tags: [politics]
  sources: ["John Iliffe, A Modern History of Tanganyika (Cambridge University Press, 1979)", "Michael Twaddle, Kakungulu and the Creation of Uganda (James Currey, 1993)", "Bruce J. Berman, John Lonsdale, Unhappy Valley: Conflict in Kenya and Africa (James Currey, 1992)"]

- id: oau-1963
  year: 1963
  endYear: 1963
  title:
    ko: "아프리카 단결 기구의 창설(1963)"
  summary:
    ko: "1960년대 초 독립 아프리카는 이념과 노선이 갈렸다. 가나의 콰메 은크루마는 아프리카가 하나의 연합 정부로 모여야 한다고 주장했고 카사블랑카 그룹이 그를 따랐으며, 나이지리아·라이베리아·에티오피아와 프랑스어권 나라들은 느슨한 협력과 주권 존중을 내세운 몬로비아 그룹을 이루었다. 1963년 5월 25일 에티오피아의 아디스아바바에서 황제 하일레 셀라시에의 주최로 32개 독립 아프리카 국가가 모여 아프리카 단결 기구(OAU) 헌장에 서명했다. 헌장은 회원국의 주권 평등과 영토 보전, 식민주의 근절을 내세웠고, 본부는 아디스아바바에 두었으며 첫 사무총장은 기니의 디알로 텔리였다. 1964년 7월 카이로 정상 회의는 독립 때 이미 있던 국경을 존중하기로 했는데, 이는 식민지가 그은 경계가 민족과 맞지 않아도 국경 분쟁을 막으려는 결정이었다. 기구는 해방 위원회를 두어 포르투갈령 식민지와 남로디지아, 남아프리카 공화국의 백인 지배에 맞선 해방 운동을 도왔고, 프랑스와 전쟁(「알제리 전쟁」(앞의 사건))을 치르고 1962년 독립한 알제리도 회원이었다. 최고 기관은 해마다 열리는 국가 원수 정상 회의였고, 각료 이사회와 사무국, 조정·중재·화해 위원회가 있었다. 해방 위원회는 탄자니아의 다르에스살람에 본부를 두었다. 은크루마가 바란 대륙 단일 정부는 받아들여지지 않았다. 기구는 2002년 7월 더반에서 아프리카 연합으로 바뀌었다. 1969년에는 아프리카 난민 문제에 관한 협약을, 1981년에는 아프리카 인권 헌장을 채택했다. 5월 25일은 '아프리카의 날'로 기념되며, 하일레 셀라시에가 첫 의장을 맡았다. 기구는 1963년 10월 알제리와 모로코의 국경 충돌에서 중재에 나서기도 했다."
  subjects: [ethiopia, ghana, nigeria, liberia, guinea]
  links: []
  tags: [diplomacy, politics]
  sources: ["Zdenek Červenka, The Unfinished Quest for Unity: Africa and the OAU (Africana Publishing, 1977)", "Kwame Nkrumah, Africa Must Unite (Heinemann, 1963)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: rhodesia-udi-1965
  year: 1965
  endYear: 1980
  title:
    ko: "로디지아의 일방 독립 선언과 짐바브웨의 독립(1965~1980)"
  summary:
    ko: "로디지아는 1923년부터 영국 안의 자치 식민지로 소수의 백인이 지배한 남로디지아였고, 중앙아프리카 연방이 해체된 뒤(「로디지아 니아살랜드 연방과 잠비아·말라위의 독립(1953~1964)」(앞의 사건)) 1964년 이름을 로디지아로 바꾸었다. 영국은 아프리카인 다수 통치를 받아들이기 전에는 독립을 주지 않겠다고 했으나, 1964년 4월 총리가 된 이언 스미스의 로디지아 전선 정부는 1965년 11월 11일 일방 독립 선언을 했다. 영국은 선언을 반란으로 보았고 어떤 나라도 로디지아를 국가로 승인하지 않았으며, 유엔 안전 보장 이사회는 1966년 12월 16일 결의 232호로 강제 경제 제재를 결정했다. 로디지아는 남아프리카 공화국과 포르투갈령 모잠비크를 통해 제재를 우회했고 1970년 3월 공화국을 선포했다. 1966년 4월부터 조슈아 은코모의 짐바브웨 아프리카 인민 연합(ZAPU)과 로버트 무가베·은다바닝기 시톨레의 짐바브웨 아프리카 민족 연합(ZANU)이 무장 투쟁(부시 전쟁)을 벌였다. 1978년 3월 스미스는 아벨 무조레와 등 온건 흑인 지도자와 국내 합의를 맺었고 1979년 6월 1일 무조레와가 총리인 짐바브웨 로디지아가 세워졌으나 국제 승인이 없었다. 1979년 9월부터 12월 21일까지 런던 랭커스터 하우스 회담이 휴전과 새 헌법을 합의했고 1980년 2월 선거에서 ZANU가 이겼다. 1980년 4월 18일 짐바브웨가 독립했고 무가베가 총리가 되었다. 로디지아의 백인은 25만 명 안팎이었고 아프리카인은 수백만 명이었다. 영국 해군은 1966년부터 모잠비크 베이라 항 앞바다에서 석유 수송선을 막는 순찰을 벌였다. 1969년 국민 투표로 채택된 새 헌법은 아프리카인의 대표권을 제한했다."
  subjects: [uk, rhodesia, zimbabwe]
  links:
    - { from: uk, to: zimbabwe, note: "랭커스터 하우스 합의로 로디지아의 독립을 승인 (1980-04-18)" }
  tags: [politics, war]
  sources: ["Martin Meredith, Our Votes, Our Guns: Robert Mugabe and the Tragedy of Zimbabwe (PublicAffairs, 2002)", "Josiah Brownell, The Collapse of Rhodesia: Population Demographics and the Politics of Race (I. B. Tauris, 2011)", "Norma Kriger, Guerrilla Veterans in Post-War Zimbabwe (Cambridge University Press, 2003)"]

- id: southern-africa-independence-1966
  year: 1966
  endYear: 1968
  title:
    ko: "보츠와나·레소토·스와질란드의 독립(1966~1968)"
  summary:
    ko: "베추아날란드 보호령, 바수톨란드, 영국령 스와질란드는 남아프리카 연방에 둘러싸인 영국의 고등 판무관 영토로, 1909년 남아프리카 연방 헌법에 병합 가능성이 적혀 있었으나(「남아프리카 연방의 성립(1909~1910)」(앞의 사건)) 아파르트헤이트가 시작되자 주민은 병합을 반대했다. 베추아날란드의 세레체 카마는 1948년 영국인 루스 윌리엄스와 결혼했다가 영국이 추방했던 일(1951~1956)로 이름을 알렸고, 민주당(BDP)을 이끌어 1965년 총리가 되었다. 보츠와나는 1966년 9월 30일 독립해 카마가 대통령이 되었고 1967년 오라파에서 다이아몬드가 발견되어 경제 성장의 바탕이 되었다. 레소토는 1966년 10월 4일 독립해 왕 모쇼에쇼에 2세와 총리 레아부아 조나탄을 두었고, 조나탄은 1970년 선거에서 지자 헌법을 정지시켰다. 스와질란드(2018년부터 에스와티니)는 1968년 9월 6일 독립했으며 왕 소부자 2세가 전통 정치를 이어 갔고 1973년 정당 활동을 막았다. 세 나라는 모두 남아프리카 공화국과 경제적으로 깊이 얽힌 채 독립했다. 레소토는 면적이 3만 km² 남짓하고 전체가 남아프리카 공화국에 둘러싸여 있다. 소부자 2세는 1921년부터 1982년까지 스와질란드 왕이었다. 보츠와나는 독립 이후 정기 선거를 이어 온 드문 나라이고, 베추아날란드의 행정 중심이던 마페킹은 보호령 밖 남아프리카 땅이어서 1965년 가보로네로 옮겼다. 레소토의 조나탄은 1986년 군부 쿠데타로 쫓겨났고, 보츠와나의 카마는 1980년 숨질 때까지 대통령이었다. 스와질란드가 에스와티니로 이름을 바꾼 것은 2018년 4월 왕 음스와티 3세의 발표에서 비롯되었다."
  subjects: [uk, south-africa, bechuanaland, basutoland, swaziland-protectorate, botswana, lesotho, eswatini]
  links:
    - { from: uk, to: botswana, note: "베추아날란드 보호령의 독립을 승인 (1966-09-30)" }
    - { from: uk, to: lesotho, note: "바수톨란드의 독립을 승인 (1966-10-04)" }
    - { from: uk, to: eswatini, note: "영국령 스와질란드의 독립을 승인 (1968-09-06)" }
  tags: [politics]
  sources: ["Neil Parsons, Willie Henderson, Thomas Tlou, Seretse Khama, 1921–80 (Macmillan Botswana, 1995)", "Richard F. Weisfelder, Political Contention in Lesotho, 1952–1965 (Institute of Southern African Studies, 1999)", "Hugh Macmillan, Swaziland: Decolonisation and the Triumph of 'Tradition' (Journal of Modern African Studies 23권 4호, 1985)"]

- id: biafra-1967
  year: 1967
  endYear: 1970
  title:
    ko: "비아프라 전쟁(1967~1970)"
  summary:
    ko: "나이지리아는 독립 5년여 만인 1966년 1월 15일 소장파 장교들의 쿠데타로 문민 정부가 무너지고 육군 사령관 아이언시가 국가 원수가 되었다(「나이지리아 연방의 독립(1954~1960)」(앞의 사건)). 같은 해 2월에는 가나에서도 은크루마가 정변으로 쫓겨났다. 쿠데타 주역에 이그보족 장교가 많다는 의심이 퍼진 가운데 7월 29일 북부 장교들이 반란으로 아이언시를 죽이고 야쿠부 고원이 권력을 잡았으며, 그 뒤로 북부에서 이그보족을 노린 학살이 일어나 수만 명이 숨지고 많은 이가 동부로 피난했다. 1967년 1월 가나의 아부리에서 군사 지도자들이 합의를 시도했으나 실행되지 않았고, 동부 지역 군사 총독 오주쿠가 1967년 5월 30일 동부 지역의 비아프라 공화국 분리를 선언했다. 연방군은 7월에 공격을 시작했고 해안을 봉쇄했으며, 비아프라는 탄자니아·가봉·코트디부아르·잠비아·아이티의 승인을 얻었다. 봉쇄 속에서 굶주림이 퍼져 국제 적십자사의 구호 공수가 이어졌다. 사망자는 군인 4만 5천~10만 명과 민간인 50만~200만 명(대부분 굶주림)이라는 추산이 있고 일부 추산은 300만 명에 이른다. 1970년 1월 오주쿠가 코트디부아르로 떠나고 필립 에핑이 항복하여 1월 15일 전쟁이 끝났으며 고원은 '승자도 패자도 없다'고 선언했다. 동부는 1956년 발견된 석유의 산지여서 연방 정부는 분리를 막으려 했고, 고원은 1967년 5월 27일 나라를 열두 개 주로 나누었다. 영국과 소련이 연방에 무기를 팔았고 프랑스는 가봉과 코트디부아르를 통해 비아프라를 은밀히 도왔다고 한다. 항복 협상에서 연방군 사단을 이끈 올루세군 오바산조는 뒤에 국가 원수가 된다(1976~1979)."
  subjects: [nigeria]
  links: []
  tags: [war, politics]
  sources: ["Toyin Falola, Matthew M. Heaton, A History of Nigeria (Cambridge University Press, 2008)", "John de St. Jorre, The Nigerian Civil War (Hodder and Stoughton, 1972)", "Chinua Achebe, There Was a Country: A Personal History of Biafra (Penguin, 2012)"]

- id: mauritius-equatorial-guinea-1968
  year: 1968
  endYear: 1968
  title:
    ko: "모리셔스와 적도 기니의 독립(1968)"
  summary:
    ko: "모리셔스는 1810년 영국이 프랑스에게서 빼앗은 영국령 모리셔스로(「영국의 모리셔스 점령과 파리 조약(1810~1814)」(앞의 사건)), 사탕수수 농장에 들어온 인도계 계약 노동자의 후손이 인구의 다수를 이루었다. 1965년 11월 8일 영국은 차고스 제도를 모리셔스에서 떼어 영국령 인도양 지역으로 삼았고 모리셔스에 보상금을 주었으며, 차고스 제도 주민은 1967~1973년 디에고가르시아의 미군 기지 때문에 쫓겨났다. 이 분리는 오늘날까지 모리셔스와 영국의 분쟁으로 남았고 2019년 국제 사법 재판소는 이 분리가 합법적이지 않았다는 권고 의견을 냈다. 시부사거르 람굴람의 노동당이 1967년 총선에서 이겨, 모리셔스는 1968년 3월 12일 영연방 안에서 독립했고 람굴람이 총리가 되었다. 스페인령 기니는 비오코 섬과 리오무니로 이루어졌고 1963년 자치를 얻은 뒤 1968년 10월 12일 적도 기니로 독립했다. 프란시스코 마시아스 응게마가 대통령이 되어 곧 일당 독재를 폈고, 1979년 8월 조카 테오도로 오비앙 응게마가 쿠데타로 그를 쫓아냈다. 적도 기니는 사하라 이남에서 스페인어를 공용어로 쓰는 유일한 나라이다. 독립 직전 힌두 인도계와 크레올·프랑스계 주민 사이의 긴장이 커서 1968년 1월 폭동이 일어났고, 영국은 1966년 미국과 디에고가르시아 기지 이용을 합의했다. 독립 때 모리셔스의 인구는 약 80만 명이었고, 사탕수수에 기대던 경제는 뒤에 수출 가공 지대와 관광으로 넓어져 1992년 공화국이 되었다. 마시아스는 1972년 종신 대통령을 자처했고 1979년 9월 재판 끝에 처형되었다. 모리셔스라는 이름은 1598년 이 섬에 닿은 네덜란드 선단이 나사우의 마우리츠 공을 기려 붙인 것이다."
  subjects: [uk, spain, british-mauritius, spanish-guinea, mauritius, equatorial-guinea]
  links:
    - { from: uk, to: mauritius, note: "영국령 모리셔스의 독립을 승인 (1968-03-12)" }
    - { from: spain, to: equatorial-guinea, note: "스페인령 기니의 독립을 승인 (1968-10-12)" }
  tags: [politics]
  sources: ["Larry W. Bowman, Mauritius: Democracy and Development in the Indian Ocean (Westview Press, 1991)", "Sandra J. T. M. Evers, Marc Kooy (eds.), Eviction from the Chagos Islands: Displacement and Struggle for Identity against Two World Powers (Brill, 2011)", "Ibrahim K. Sundiata, Equatorial Guinea: Colonialism, State Terror, and the Search for Stability (Westview Press, 1990)"]

- id: zaire-mobutu-1971
  year: 1971
  endYear: 1977
  title:
    ko: "모부투의 자이르와 오텐티시테(1971~1977)"
  summary:
    ko: "1965년 쿠데타로 집권한 모부투 세세 세코는 1967년 혁명 인민 운동(MPR)을 세워 일당 체제를 굳혔다(「콩고의 독립과 콩고 위기(1960~1965)」(앞의 사건)). 1971년 10월 27일 그는 나라 이름을 콩고 민주 공화국에서 자이르로 바꾸고 강 이름도 자이르로 했으며(화폐는 1967년부터 자이르였다), 아프리카의 정체성을 되찾는다는 '오텐티시테' 운동을 펼쳐 서양식 이름과 옷을 버리게 했다. 모부투 자신도 1972년 이름을 바꾸었고, 레오폴드빌·스탠리빌·엘리자베트빌 같은 옛 도시 이름은 1966년 킨샤사·키상가니·루붐바시로 바뀌어 있었다. 1973년 외국인 소유 기업을 자이르 사람에게 넘기는 '자이르화' 조치가 경제를 흔들었고 1974~1975년 구리 가격이 떨어져 재정이 무너졌다. 앙골라의 독립 투쟁에서 모부투는 FNLA를 지원했으나 MPLA가 이겼고(「앙골라 내전과 쿠이토 쿠아나발레 전투(1975~1988)」(뒤의 사건)), 1977년 3월 앙골라에서 넘어온 카탕가 출신 전직 헌병들이 샤바(옛 카탕가) 주를 침공했으나 프랑스가 공수한 모로코군이 도와 5월에 물리쳤다(샤바 전쟁). 서방 국가는 냉전 속에서 모부투를 지원했고, 그의 정권은 1997년 무너질 때까지 이어졌다(「제1·2차 콩고 전쟁(1996~2003)」(뒤의 사건)). 나라 이름은 1997년 콩고 민주 공화국으로 돌아왔다. 모부투의 정권은 광산 수입을 개인 재산으로 삼는 부패로 악명 높아 도둑 정치라고 불렀다. 1974년에는 킨샤사에서 무함마드 알리와 조지 포먼의 세계 헤비급 권투 경기가 열려 자이르가 세계의 이목을 끌었다. 자이르화는 1975년 일부 되돌려졌고, 1978년 5월에는 샤바 주 콜웨지에서 비슷한 침공이 되풀이되었다."
  subjects: [dr-congo]
  links: []
  tags: [politics]
  sources: ["Crawford Young, Thomas Turner, The Rise and Decline of the Zairian State (University of Wisconsin Press, 1985)", "Michela Wrong, In the Footsteps of Mr. Kurtz: Living on the Brink of Disaster in Mobutu's Congo (Fourth Estate, 2000)", "Georges Nzongola-Ntalaja, The Congo from Leopold to Kabila: A People's History (Zed Books, 2002)"]

- id: aouzou-chad-libya-1973
  year: 1973
  endYear: 1994
  title:
    ko: "리비아의 아우주 띠 점령과 차드–리비아 분쟁(1973~1994)"
  summary:
    ko: "차드 북쪽 끝의 아우주 띠는 광물이 있다고 알려진 약 11만 4천 km²의 사막 지대로, 식민지 시대 프랑스와 이탈리아가 1935년 협정으로 경계를 정하려 했으나 비준되지 않아 소유가 모호했다. 1973년 무아마르 카다피의 리비아가 이곳을 점령해 병합했고 이는 차드의 프랑수아 톰발바예와 1972년 맺은 거래에서 비롯됐다고 한다. 차드는 1960년 독립 뒤(「프랑스령 적도 아프리카 네 나라의 독립: 차드·중앙아프리카·가봉·콩고(1958~1960)」(앞의 사건)) 북부 무슬림의 차드 국민해방전선(FROLINAT) 무장 투쟁과 내전을 겪었고, 1975년 4월 13일 톰발바예가 쿠데타로 죽은 뒤 펠릭스 말룸의 군사 정부(1975~1979)가 이어졌고, 그 뒤 구쿠니 웨데이와 히센 아브레가 갈등했다. 리비아는 구쿠니를 도와 1983년 북부를 점령했으나 프랑스가 15도선에 병력을 보냈고(만타 작전), 히센 아브레의 정부군이 1987년 초부터 8월까지 북부를 되찾으며 '토요타 전쟁'을 벌였다. 두 나라는 1987년 9월 휴전했고 1990년 이후 국제 사법 재판소에 사건을 넘겨, 1994년 2월 3일 재판소가 16대 1로 차드의 영유권을 인정했다. 협정에 따라 리비아군은 1994년 5월 30일 철수를 마쳤다. 1989년 8월 알제 협정으로 두 나라는 평화적 해결을 약속했고, 유엔은 철수를 감시하는 아우주 띠 감시단을 1994년 5월 두었다. 히센 아브레는 1990년 12월 이드리스 데비의 반군에게 쫓겨났다. 1980년 12월 리비아군이 구쿠니의 요청으로 은자메나에 들어갔다가 이듬해 철수했고 1982년 6월 아브레가 은자메나를 차지했다. 1984년 9월 프랑스와 리비아는 동시 철수에 합의했으나 리비아군은 북부에 남았다. 리비아는 아우주 띠가 자국 땅이라고 주장했다."
  subjects: [aouzou-strip, chad, libya, france]
  links: []
  tags: [war, diplomacy]
  sources: ["Mario J. Azevedo, Roots of Violence: A History of War in Chad (Gordon and Breach, 1998)", "Robert Buijtenhuijs, Le Frolinat et les révoltes populaires du Tchad, 1965–1976 (Mouton, 1978)", "Kenneth M. Pollack, Arabs at War: Military Effectiveness, 1948–1991 (University of Nebraska Press, 2002)"]

- id: carnation-lusophone-1974
  year: 1974
  endYear: 1975
  title:
    ko: "카네이션 혁명과 포르투갈령 아프리카 다섯 나라의 독립(1974~1975)"
  summary:
    ko: "포르투갈은 1961년 앙골라, 1963년 기니, 1964년 모잠비크에서 시작된 해방 전쟁을 13년 동안 치렀고, 군비 부담이 국내 정치를 흔들었다. 기니비사우에서는 아밀카르 카브랄이 이끄는 기니–카보베르데 독립 아프리카 당(PAIGC)이 영토 대부분을 장악했으나 카브랄이 1973년 1월 20일 암살되었고 PAIGC는 1973년 9월 24일 독립을 선언했다. 1974년 4월 25일 군부의 포르투갈 국군 운동이 쿠데타로 독재를 무너뜨렸고(카네이션 혁명) 새 정부는 식민지 해방을 받아들였다. 포르투갈령 기니는 1974년 9월 10일 포르투갈이 승인해 기니비사우가 되었고, 모잠비크는 1975년 6월 25일 사모라 마셸의 모잠비크 해방전선(FRELIMO) 아래 독립했으며, 포르투갈령 카보베르데는 7월 5일, 포르투갈령 상투메 프린시페는 7월 12일 독립해 카보베르데와 상투메 프린시페가 되었다. 포르투갈령 앙골라는 1975년 11월 11일 독립했는데 세 해방 운동이 갈려 독립과 동시에 내전이 이어졌다(「앙골라 내전과 쿠이토 쿠아나발레 전투(1975~1988)」(뒤의 사건)). 아고스티뉴 네투가 앙골라 인민 공화국의 첫 대통령이 되었다. 이 독립으로 포르투갈 제국의 아프리카 식민지는 모두 끝났다. 정변 직후 스피놀라 장군이 식민지를 포르투갈과 연방으로 묶자는 구상을 내놓았으나 해방 운동이 거부했다. 식민지에서 수십만 명의 포르투갈인이 본국으로 돌아왔다. 1976년 포르투갈은 새 헌법으로 민주 체제를 세웠다. 모잠비크 해방전선은 1962년 세워져 1964년 9월 무장 투쟁을 시작했고 첫 지도자는 1969년 암살되었다. 카네이션 혁명이라는 이름은 시민들이 군인의 총구에 붉은 카네이션을 꽂은 데서 왔다."
  subjects: [portugal, portuguese-guinea, portuguese-cape-verde, portuguese-sao-tome, portuguese-mozambique, portuguese-angola, guinea-bissau, cape-verde, sao-tome, mozambique, angola]
