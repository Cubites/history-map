- id: congo-crisis-1960
  year: 1960
  endYear: 1965
  title:
    ko: "콩고의 독립과 콩고 위기(1960~1965)"
  summary:
    ko: "벨기에령 콩고는 1960년 6월 30일 독립했다(「벨기에의 콩고 병합(1908)」(앞의 사건)). 조제프 카사부부가 대통령, 파트리스 루뭄바가 총리가 되었고, 독립 때 이름은 콩고 공화국이었으며 1964년 콩고 민주 공화국, 1971년 자이르로 바뀌었다. 독립 닷새 뒤 공안군(포르스 퓌블리크)이 반란을 일으키고 벨기에가 군대를 보내자, 1960년 7월 11일 모이즈 촘베가 광산이 많은 카탕가의 분리를 선언했고 8월에는 남카사이도 분리를 선언했다. 루뭄바는 유엔에 도움을 청해 유엔 콩고 작전(ONUC)이 7월 14일 결의로 파견되었으나, 소련에도 도움을 구하다 9월 5일 카사부부에게 해임되었고 9월 14일 군 참모장 조제프 데지레 모부투가 정변을 일으켰다. 루뭄바는 1961년 1월 17일 카탕가에서 살해되었다. 1961년 9월 18일에는 유엔 사무총장 다그 함마르셸드가 북로디지아 은돌라 근처에서 비행기 사고로 숨졌고, 1963년 1월 유엔군이 카탕가의 분리를 끝냈다. 1964년 동부에서 심바 반란이 일어나자 총리는 과도 정부를 거쳐 1961년 8월부터 1964년 6월까지 시릴 아둘라가 맡았고, 1964년 7월 총리가 된 촘베가 벨기에 낙하산 부대와 미국 수송기의 도움으로 반란군에 잡힌 스탠리빌의 인질을 구했다. 1965년 10월 카사부부가 촘베를 해임해 정치가 흔들리자 11월 24일 모부투가 정변으로 권력을 잡았고, 그의 지배는 30년 넘게 이어진다(「모부투의 자이르와 오텐티시테(1971~1977)」(뒤의 사건)). 카탕가에는 구리와 코발트 광산이 있어 벨기에 광산 회사의 이해가 걸려 있었고, 함마르셸드의 후임 우탕이 1961~1962년 유엔군의 군사 작전을 이어 갔다. 벨기에 의회 조사 위원회는 2001년 루뭄바의 죽음에 벨기에 정부 일부가 도덕적 책임이 있다고 결론 내렸다."
  subjects: [belgium, belgian-congo, dr-congo]
  links:
    - { from: belgium, to: dr-congo, note: "벨기에령 콩고의 독립을 승인 (1960-06-30)" }
  tags: [war, politics]
  sources: ["Georges Nzongola-Ntalaja, The Congo from Leopold to Kabila: A People's History (Zed Books, 2002)", "Ludo De Witte, The Assassination of Lumumba (Verso, 2001)", "Thomas Turner, The Congo Wars: Conflict, Myth and Reality (Zed Books, 2007)"]

- id: somalia-independence-1960
  year: 1960
  endYear: 1960
  title:
    ko: "소말릴란드와 소말리아 신탁 통치령의 독립과 통합(1960)"
  summary:
    ko: "소말리아 민족주의는 소말리인이 사는 다섯 곳, 곧 영국령 소말릴란드·이탈리아령 소말리아·프랑스령 지부티·에티오피아의 오가덴·케냐 북동부를 하나로 합치는 것을 목표로 삼았고, 이 뜻이 오성 깃발에 담겼다. 영국령 소말릴란드는 1960년 6월 26일 소말릴란드국으로 먼저 독립했고, 유엔이 10년 시한으로 이탈리아에 맡긴 소말리아 신탁 통치령은 닷새 뒤인 7월 1일 독립했다(「옛 이탈리아 식민지: 소말리아 신탁 통치와 에리트레아 연방, 병합(1949~1962)」(앞의 사건)). 두 곳은 같은 날 합쳐 소말리아 공화국이 되었고, 대통령은 아덴 압둘라 오스만 다르였고 압둘라히 이사에 이어 7월 12일 압디라시드 알리 셰르마르케가 총리가 되었다. 합쳐진 뒤 남부 중심의 행정에 북부 사람들의 불만이 컸고, 1961년 북부 군인이 반란을 일으키기도 했다. 소말리아는 에티오피아의 오가덴과 케냐 북동부를 되찾으려 하여 1963년부터 케냐 북동부에서 시프타 전쟁이 일어났다. 1967년 셰르마르케가 대통령이 되었으나 1969년 10월 15일 암살되었고 6일 뒤 시아드 바레가 정변으로 집권했다(「오가덴 전쟁(1977~1978)」(뒤의 사건)). 소말릴란드는 1991년 독립을 선언한다(「소말리아 정부의 붕괴와 소말릴란드 독립 선언(1991)」(뒤의 사건)). 독립 때 소말리아는 영어와 이탈리아어로 나뉜 행정·법률 제도를 통합해야 했고, 소말리어 문자는 1972년에야 정해졌다. 다섯 번째 별에 해당하는 프랑스령 소말리 해안(지부티)은 1977년 독립했다. 통일 소말리아의 수도는 모가디슈였고 두 지역 의회는 7월 1일 하나의 국민 의회가 되었다. 소말리아는 1960년 9월 유엔에 가입했다."
  subjects: [uk, british-somaliland, somalia-italian-trust, somalia]
  links:
    - { from: uk, to: somalia, note: "영국령 소말릴란드의 독립을 승인 (1960-06-26)" }
  tags: [politics]
  sources: ["I. M. Lewis, A Modern History of the Somali (James Currey, 4th ed., 2002)", "Abdi Ismail Samatar, Africa's First Democrats: Somalia's Aden A. Osman and Abdirazak H. Hussen (Indiana University Press, 2016)", "Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)"]

- id: sharpeville-1960
  year: 1960
  endYear: 1964
  title:
    ko: "샤프빌 학살과 리보니아 재판(1960~1964)"
  summary:
    ko: "1960년 2월 3일 영국 총리 해럴드 맥밀런은 케이프타운의 남아프리카 연방 의회에서 '바람의 변화' 연설을 하여 아프리카의 민족의식이 대륙에 퍼지고 있다고 밝혔다. 그해 3월 21일 로버트 소부퀘가 이끄는 범아프리카 회의(PAC)가 통행증 반대 운동을 벌이자 요하네스버그 남쪽 샤프빌 경찰서 앞에 모인 군중에게 경찰이 총을 쏘아 69명이 숨지고 약 180명이 다쳤다. 정부는 3월 30일 비상사태를 선포하고 4월 8일 아프리카 국민회의와 범아프리카 회의를 금지했다(「국민당 정부와 아파르트헤이트 법(1948~1953)」(앞의 사건)). 1960년 10월 백인 유권자의 국민 투표로 공화국이 결정되어 1961년 5월 31일 남아프리카 연방은 영연방을 떠나 남아프리카 공화국이 되었다. 1961년 12월 아프리카 국민회의는 무장 조직 움콘토 웨 시즈웨(민족의 창)를 만들어 시설 파괴 활동을 시작했고, 올리버 탐보는 해외에서 활동을 이끌었다. 1963년 7월 요하네스버그 북쪽 리보니아의 농장에서 간부들이 붙잡혔고, 1964년 6월 12일 넬슨 만델라와 월터 시술루 등 8명이 종신형을 선고받았다. 이후 총리 헨드릭 페르부르트가 1966년 피살되기까지 아파르트헤이트가 굳어졌고, 만델라는 1990년 풀려난다(「만델라 석방과 아파르트헤이트의 끝, 첫 전 인종 선거(1990~1994)」(뒤의 사건)). 소부퀘는 1960년 징역 3년을 받았으나 이른바 소부퀘 조항으로 1969년까지 로벤섬에 갇혔고 1978년 숨질 때까지 행동 제한을 받았다. 군중은 5천~7천 명으로 추산되며 희생자 다수가 등에 총을 맞았다는 증언이 있다. 유엔 안전 보장 이사회는 1960년 4월 1일 결의 134호로 이 학살을 규탄했다."
  subjects: [south-africa]
  links: []
  tags: [politics, society]
