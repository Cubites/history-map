- id: comoros-1974
  year: 1974
  endYear: 1976
  title:
    ko: "코모로의 독립 선언과 마요트(1974~1976)"
  summary:
    ko: "코모로 제도는 그랑드코모르·안주앙·모엘리·마요트 네 섬으로 이루어졌고 마요트는 1841년 프랑스가 처음 얻었으며 나머지 세 섬은 보호령을 거쳐 1912년 식민지가 되었다(「프랑스의 마요트 획득과 코모로 보호령(1841~1886)」(앞의 사건)). 프랑스령 코모로는 1946년 해외 영토가 되었다. 1974년 12월 22일 프랑스가 전 영토에서 치른 주민 투표에서 그랑드코모르·안주앙·모엘리 세 섬은 압도적으로 독립에 찬성했으나 마요트는 약 63.8%가 프랑스에 남기를 택했다. 프랑스는 섬마다 따로 결과를 보겠다고 했고, 1975년 7월 6일 아흐메트 압달라가 이끈 코모로 의회가 마요트를 포함하는 일방적 독립을 선언했다. 그 뒤 1975년 8월 3일 쿠데타로 압달라가 쫓겨나고 사이드 무함마드 자파르가 국가 수반을 맡았다가, 1976년 1월 3일 알리 솔리흐가 권력을 잡았다. 코모로는 1975년 11월 유엔에 가입했는데 유엔은 마요트를 포함하는 국가로 인정했다. 마요트는 1976년 2월 8일 주민 투표에서 약 99%가 프랑스에 남기를 거듭 택했고 4월에 한 번 더 확인했다. 이로써 프랑스령 코모로는 1975년에 끝났으나 마요트의 귀속은 코모로와 프랑스 사이의 분쟁으로 남았다. 알리 솔리흐 정권은 1978년 5월 13일 프랑스 용병 밥 드나르가 이끈 쿠데타로 무너지고 압달라가 돌아왔다. 프랑스는 2009년 마요트의 주민 투표(약 95% 찬성)를 거쳐 2011년 마요트를 해외 도로 삼았다. 코모로는 1997년 안주앙과 모엘리가 분리를 선언하는 등 불안을 겪다 2001년 새 헌법으로 연방 체제를 갖췄다. 유엔 총회는 이후 여러 차례 마요트가 코모로의 주권에 속한다는 결의를 채택했다. 코모로의 공용어는 코모로어·프랑스어·아랍어이다."
  subjects: [france, french-comoros, comoros, mayotte]
  links:
    - { from: france, to: comoros, note: "세 섬의 독립 선언을 받아들임 (1975-07-06)" }
  tags: [politics]
  sources: ["Iain Walker, Becoming the Other, Being Oneself: Constructing Identities in a Connected World (Cambridge Scholars, 2010)", "Malyn Newitt, The Comoro Islands: Struggle against Dependency in the Indian Ocean (Westview Press, 1984)", "Pierre Vérin, Les Comores (Karthala, 1994)"]

- id: ethiopian-revolution-1974
  year: 1974
  endYear: 1977
  title:
    ko: "에티오피아 혁명과 데르그(1974~1977)"
  summary:
    ko: "하일레 셀라시에 황제는 1930년부터 에티오피아를 다스렸고(「이탈리아의 에티오피아 점령과 저항(1936~1941)」(앞의 사건)) 1952년 에리트레아 연방과 1962년 병합으로 영토를 넓혔지만, 1973~1974년 북부 워로 지방의 기근에서 수만 명이 굶어 죽었다는 추산이 나왔다. 1974년 2월 군부대 반란과 물가 상승 시위로 정부가 무너졌고, 군 하급 장교들이 6월 군 조정 위원회(데르그)를 만들어 정치를 장악했다. 데르그는 1974년 9월 12일 황제를 폐위했고, 11월 23일 의장 아만 안돔이 살해되었으며 테페리 벤티가 의장이 되었다. 1975년 3월 토지를 국유화하는 토지 개혁 선언이 나왔고 군주제가 폐지되었으며, 하일레 셀라시에는 8월 27일 갇힌 채 숨졌다. 1977년 2월 3일 테페리 벤티가 살해되고 멩기스투 하일레 마리암이 권력을 잡았으며, 데르그는 사회주의 노선과 소련·쿠바와의 협력을 내세웠다. 이 무렵 데르그와 에티오피아 인민 혁명당이 서로 폭력으로 맞선 '붉은 테러'(1976~1978)에서 희생자는 3만~75만 명으로 추산이 크게 갈린다. 대내외 반발 속에서 에리트레아와 티그라이의 무장 투쟁이 커졌고, 소말리아의 침공을 맞는다(「오가덴 전쟁(1977~1978)」(뒤의 사건)). 1983~1985년의 대기근을 거쳐 데르그는 1991년 무너진다(「멩기스투 정권의 붕괴와 에리트레아의 독립(1991~1993)」(뒤의 사건)). 1975년에는 도시 학생 수만 명이 농촌 개발 운동(제메차)에 동원되어 토지 개혁을 알렸다. 1976~1977년 데르그에 맞선 세력으로 에티오피아 인민 혁명당과 에티오피아 민주 연합, 에리트레아 해방 전선이 있었다."
  subjects: [ethiopia]
  links: []
  tags: [politics, society]
  sources: ["Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed., 2001)", "Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)", "Donald N. Levine, Greater Ethiopia: The Evolution of a Multiethnic Society (University of Chicago Press, 2nd ed., 2000)"]

- id: angola-civil-war-1975
  year: 1975
  endYear: 1988
  title:
    ko: "앙골라 내전과 쿠이토 쿠아나발레 전투(1975~1988)"
  summary:
    ko: "앙골라의 세 해방 운동은 아고스티뉴 네투의 앙골라 해방 인민 운동(MPLA, 마르크스주의, 루안다와 음분두족 중심), 홀든 로베르투의 앙골라 민족 해방 전선(FNLA, 북부 콩고족 중심), 조나스 사빔비의 앙골라 완전 독립 민족 동맹(UNITA, 중남부 오빔분두족 중심)이었다(「카네이션 혁명과 포르투갈령 아프리카 다섯 나라의 독립(1974~1975)」(앞의 사건)). 1975년 1월 알보르 협정으로 과도 정부가 서려 했으나 곧 깨졌고, 1975년 11월 11일 MPLA가 루안다에서 앙골라 인민 공화국을 선포했다. 자이르는 FNLA를 도왔고 남아프리카 공화국은 1975년 10월 앙골라 남부를 침공해 UNITA 편에 섰으며, 쿠바는 소련의 지원을 받아 MPLA 편으로 군대를 보냈고 남아프리카군은 1976년 3월 철수했다. 남아프리카는 남서아프리카의 SWAPO 기지를 겨냥해 앙골라를 자주 공격했고, 1987년 11월~1988년 3월 앙골라 남동부 쿠이토 쿠아나발레에서 MPLA 정부군(FAPLA)과 쿠바군이 UNITA와 남아프리카군에 맞서 큰 전투를 벌여 서로 이겼다고 주장했다. 쿠바군은 총 5만 5천 명 안팎까지 늘었다고 한다. 1988년 12월 22일 뉴욕에서 앙골라·쿠바·남아프리카 공화국이 협정을 맺어 쿠바군이 철수하고 남서아프리카가 독립하는 길이 열렸다(「나미비아의 독립(1990)」(뒤의 사건)). 내전은 이후에도 이어져 2002년에야 끝났다. 네투가 1979년 숨진 뒤 주제 에두아르두 두스산투스가 2017년까지 대통령으로 정부를 이끌었다. 1991년 비세 협정으로 선거가 계획되었으나 1992년 선거 뒤 사빔비가 결과를 거부해 전쟁이 다시 시작되었다."
  subjects: [angola, south-west-africa, south-africa, soviet-union]
  links: []
  tags: [war, politics]
  sources: ["Piero Gleijeses, Conflicting Missions: Havana, Washington, and Africa, 1959–1976 (University of North Carolina Press, 2002)", "Piero Gleijeses, Visions of Freedom: Havana, Washington, Pretoria, and the Struggle for Southern Africa, 1976–1991 (University of North Carolina Press, 2013)", "Fernando Andresen Guimarães, The Origins of the Angolan Civil War: Foreign Intervention and Domestic Political Conflict (Macmillan, 1998)"]

- id: soweto-1976
  year: 1976
  endYear: 1976
  title:
    ko: "소웨토 봉기(1976)"
  summary:
    ko: "남아프리카 공화국 정부는 1974년 아프리카인 학교의 수업 일부를 아프리카너의 언어인 아프리칸스어로 하도록 정했고(「국민당 정부와 아파르트헤이트 법(1948~1953)」(앞의 사건)), 요하네스버그 서남쪽 흑인 거주 구역 소웨토의 학생들이 이에 반대했다. 1976년 6월 16일 학생들이 평화 행진에 나서자 경찰이 총을 쏘았고 12세 헥터 피터슨이 숨진 사진이 세계에 퍼졌다. 행진한 학생은 3천~2만 명으로 추산이 갈리고, 희생자는 공식으로 176명이라 하나 이듬해 2월까지 575명이라는 위원회 추산과 700명 넘는다는 추산이 있다. 소요는 전국으로 번졌고 수천 명의 청년이 해외로 나가 아프리카 국민회의의 무장 조직에 합류했다. 흑인 의식 운동의 지도자 스티브 비코는 1977년 8월 18일 경찰에 붙잡혀 9월 12일 구금 중 숨졌고, 10월 정부는 여러 흑인 의식 단체를 금지했다. 정부는 같은 1976년 10월 트란스케이를 첫 번째 '독립' 반투스탄으로 선포했으나 남아프리카 외의 어떤 나라도 이를 승인하지 않았다. 총리 발타자르 요하네스 포르스터는 1978년 물러나고 피터르 빌럼 보타가 총리가 되었다. 1980년대 중반 전국에 비상사태가 이어지고 서방의 제재가 강화되었다(「만델라 석방과 아파르트헤이트의 끝, 첫 전 인종 선거(1990~1994)」(뒤의 사건)). 정부 지침은 수학과 사회 과목을 아프리칸스어로 가르치도록 한 것이었고 학생과 교사 대부분은 이 언어에 익숙하지 않았다. 소웨토라는 이름은 남서부 타운십의 줄임말이다. 소요는 학교 거부와 총파업으로 이듬해까지 이어졌고 정부는 7월 아프리칸스어 수업 지침을 철회했다. 6월 16일은 남아프리카 공화국에서 청년의 날로 기념된다."
  subjects: [south-africa]
  links: []
  tags: [society, politics]
  sources: ["Sifiso Mxolisi Ndlovu, The Soweto Uprisings: Counter-Memories of June 1976 (Ravan Press, 1998)", "Baruch Hirson, Year of Fire, Year of Ash: The Soweto Revolt: Roots of a Revolution? (Zed Press, 1979)", "Leonard Thompson, A History of South Africa (Yale University Press, 4th ed., 2014)"]

- id: ogaden-war-1977
  year: 1977
  endYear: 1978
  title:
    ko: "오가덴 전쟁(1977~1978)"
  summary:
    ko: "오가덴은 소말리인이 많이 사는 에티오피아 동남부 지역으로, 1948년 영국의 시정이 끝나고 에티오피아에 반환된 뒤(「옛 이탈리아 식민지: 소말리아 신탁 통치와 에리트레아 연방, 병합(1949~1962)」(앞의 사건)) 소말리아가 되찾으려 했다(「소말릴란드와 소말리아 신탁 통치령의 독립과 통합(1960)」(앞의 사건)). 1969년 정변으로 집권한 시아드 바레는 1974년 소련과 우호 조약을 맺었고, 서소말리 해방 전선(WSLF)이 오가덴에서 무장 투쟁을 이어 갔다. 1974년 에티오피아에서 황제가 쫓겨나고(「에티오피아 혁명과 데르그(1974~1977)」(앞의 사건)) 멩기스투의 데르그가 혼란에 빠진 틈을 타 소말리아군은 1977년 7월 13일 오가덴을 침공했고, 한 달 만에 오가덴의 약 70%를 차지했다. 소련은 두 동맹 사이를 중재하다 실패해 에티오피아 편으로 돌아섰고, 쿠바군 1만 2천~1만 8천 명과 소련 고문단이 에티오피아를 도왔다. 소말리아는 1977년 11월 소련 고문단을 쫓아내고 쿠바와 단교한 뒤 서방과 가까워졌다. 에티오피아군은 1978년 3월 5일 지지가를 되찾았고 소말리아군은 3월 9일 철수를 선언했으며 3월 23일 에티오피아가 마지막 국경 초소를 되찾아 침공이 끝났다. 사망자는 에티오피아 5천~6천 명, 소말리아 5천~6천 명 안팎으로 보고되고 민간인 약 2만 5천 명이 숨졌다는 추산이 있으며, 약 50만 명이 피난했다. 국경은 그대로였으나 두 나라 관계는 오래 얼어붙었다. 소말리아가 내세운 대소말리아 구상에 맞서 아프리카 단결 기구는 국경 불변 원칙(「아프리카 단결 기구의 창설(1963)」(앞의 사건))을 들어 에티오피아의 영토 보전을 지지하는 쪽이 많았다. 이 승리로 멩기스투 정권은 소련과 쿠바의 지원 아래 입지를 굳혔다."
  subjects: [somalia, ethiopia, soviet-union]
  links: []
  tags: [war]
  sources: ["Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)", "Piero Gleijeses, Conflicting Missions: Havana, Washington, and Africa, 1959–1976 (University of North Carolina Press, 2002)", "I. M. Lewis, A Modern History of the Somali (James Currey, 4th ed., 2002)"]

- id: sankara-1983
  year: 1983
  endYear: 1987
  title:
    ko: "토마 상카라와 부르키나파소(1983~1987)"
  summary:
    ko: "오트볼타는 1960년 독립 뒤(「협상 회의 네 나라의 독립: 코트디부아르·다호메이·오트볼타·니제르(1960)」(앞의 사건)) 1966년 이후 쿠데타를 여러 차례 겪었다. 1982년 11월 쿠데타로 집권한 장바티스트 우에드라오고 정권에서 1983년 1월 군 장교 토마 상카라가 총리가 되었다가 5월에 연금되었고, 8월 4일 그의 동료 블레즈 콩파오레가 이끈 정변으로 상카라가 대통령이 되었다. 상카라는 국가 혁명 평의회와 혁명 방위 위원회를 두어 반부패, 문맹 퇴치, 여성 권리 신장, 식림, 예방 접종 운동을 폈고, 1984년 8월 4일 나라 이름을 오트볼타(1984년부터 부르키나파소)에서 '정직한 사람들의 땅'을 뜻하는 부르키나파소로 바꾸고 새 국기와 국가를 정했다. 그는 외국 원조에 기대는 개발을 비판하고 부채 상환 거부를 주장했으며, 1985년 12월 25일부터 약 닷새 동안 말리와 국경의 아가셰르 지대를 두고 전쟁을 벌였다. 개혁은 전통 지도자와 노조의 반발도 불렀다. 1987년 10월 15일 콩파오레가 정변을 일으켜 상카라를 살해했고, 콩파오레가 2014년까지 27년 가까이 집권했다. 그는 장관의 고급 차량을 처분하고 관용차를 소형 르노 5로 바꾸었으며 자신의 봉급을 낮췄다. 1984년에는 약 250만 명의 어린이에게 15일 동안 홍역·수막염·황열 예방 접종을 했고, 여성 할례와 강제 결혼에 반대하는 캠페인을 폈다. 1987년 7월 아프리카 단결 기구 회의에서 외채 상환 거부를 호소했다. 2022년 4월 군사 법원은 콩파오레에게 궐석으로 종신형을 선고했다. 1985년에는 시민이 노동으로 철도를 놓는 운동을 벌였다. 그는 흔히 아프리카의 체 게바라로 불리며, 유해로 추정되는 시신은 2015년 발굴되었다."
