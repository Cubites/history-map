    - { from: belgium, to: burundi, note: "루안다-우룬디 가운데 부룬디의 독립을 승인 (1962-07-01)" }
  tags: [politics, society]
  sources: ["Gérard Prunier, The Rwanda Crisis: History of a Genocide (Columbia University Press, 1995)", "René Lemarchand, Burundi: Ethnic Conflict and Genocide (Cambridge University Press, 1996)", "Catharine Newbury, The Cohesion of Oppression: Clientship and Ethnicity in Rwanda, 1860–1960 (Columbia University Press, 1988)"]

- id: entente-independence-1960
  year: 1960
  endYear: 1960
  title:
    ko: "협상 회의 네 나라의 독립: 코트디부아르·다호메이·오트볼타·니제르(1960)"
  summary:
    ko: "코트디부아르의 펠릭스 우푸에부아니는 말리 연방에 들지 않고 1959년 5월 프랑스령 코트디부아르·프랑스령 다호메이·프랑스령 오트볼타·프랑스령 니제르가 느슨하게 손잡은 협상 회의(콩세이 드 랑트)를 세웠다. 네 나라는 프랑스와 방위·경제 협정을 맺는 조건으로 1960년 8월에 차례로 독립했다. 다호메이(1975년부터 베냉)는 8월 1일 위베르 마가가 대통령이 되어, 니제르는 8월 3일 아마니 디오리가 대통령이 되어 독립했고, 오트볼타(1984년부터 부르키나파소)는 8월 5일 모리스 야메오고, 코트디부아르는 8월 7일 우푸에부아니가 대통령이 되었다. 프랑스령 서아프리카의 구성 영토 가운데 프랑스령 세네갈과 프랑스령 수단은 같은 해 말리 연방으로 독립했고(「말리 연방과 세네갈·말리의 독립(1959~1960)」(앞의 사건)), 모리타니는 11월 28일 독립해 서아프리카의 옛 프랑스 영토가 모두 독립국이 되었다(「모로코의 독립과 무함마드 5세, 모리타니의 독립(1953~1961)」(앞의 사건)). 코트디부아르는 카카오와 커피를 수출해 안정된 경제를 이루었고 우푸에부아니는 1993년 죽을 때까지 대통령으로 남았으나, 니제르·다호메이·오트볼타는 곧 군부와 문민 정부가 번갈아 들었다. 이 네 나라는 독립과 함께 식민지 행정 구역의 경계를 그대로 국경으로 삼았다. 다호메이에서는 1963년, 오트볼타에서는 1966년 상굴레 라미자나 장군, 니제르에서는 1974년 세이니 쿤체 장군이 쿠데타로 정권을 잡았다. 협상 회의는 공동 연대 기금을 두어 부유한 코트디부아르가 이웃을 지원하게 했다. 우푸에부아니는 1956~1959년 프랑스 정부의 장관을 지냈고 독립 뒤에도 프랑스와의 긴밀한 협력을 내세웠다."
  subjects: [france, french-ivory-coast, french-dahomey, french-upper-volta, french-niger, ivory-coast, benin, burkina-faso, niger]
  links:
    - { from: france, to: ivory-coast, note: "프랑스령 코트디부아르의 독립을 승인 (1960-08-07)" }
    - { from: france, to: benin, note: "프랑스령 다호메이의 독립을 승인 (1960-08-01)" }
    - { from: france, to: burkina-faso, note: "프랑스령 오트볼타의 독립을 승인 (1960-08-05)" }
    - { from: france, to: niger, note: "프랑스령 니제르의 독립을 승인 (1960-08-03)" }
