# 사하라 이남 사건 1묶음 갈래 07(ssa-07): 독립과 냉전 — 프랑스 연합과 마다가스카르 봉기·아파르트헤이트·옛 이탈리아 식민지·서아프리카·적도 아프리카·동아프리카·중앙아프리카·남부 아프리카의 독립·콩고 위기·비아프라 전쟁·아우주 띠·포르투갈령 아프리카의 독립·에티오피아 혁명·앙골라 내전·소웨토·오가덴 전쟁·상카라 (1946 ~ 1989년)
# 범위: 프랑스 연합과 오트볼타 복원·마다가스카르 봉기·국민당 정부와 아파르트헤이트 법·소말리아 신탁 통치와 에리트레아 연방·가나·마우마우 봉기·로디지아 니아살랜드 연방·수단·나이지리아·카메룬과 토고·기니·프랑스령 적도 아프리카·말리 연방·르완다 혁명·협상 회의 네 나라·콩고 위기·소말리아·샤프빌과 리보니아 재판·시에라리온과 감비아·동아프리카 세 나라와 잔지바르·
#   아프리카 단결 기구·로디지아의 일방 독립 선언·보츠와나 레소토 스와질란드·비아프라 전쟁·모리셔스와 적도 기니·모부투의 자이르·아우주 띠·카네이션 혁명과 포르투갈령 아프리카·코모로와 마요트·에티오피아 혁명·앙골라 내전·소웨토 봉기·오가덴 전쟁·상카라(사건 34개).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 한 나라의 긴 과정은 한 사건에 묶었고, 독립 사건 하나가 여러 나라의 탭 칸을 채우므로 본문에 그 나라 항목 이름을 모두 적었다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 저장소 기존 표기를 따랐다. 이름만 바뀐 나라는 그때 이름으로 쓰고 항목 이름을 함께 적었다
#   (다호메이(1975년부터 베냉), 오트볼타(1984년부터 부르키나파소), 스와질란드(2018년부터 에스와티니), 콩고 공화국(레오폴드빌)→콩고 민주 공화국→자이르(1971년부터 1997년까지)). 사망자·난민은 범위와 추산으로 적었고 한 숫자로 못 박지 않았다.
#   분쟁과 학살(아파르트헤이트, 마우마우 봉기, 비아프라 전쟁, 붉은 테러, 오가덴 전쟁, 마요트의 귀속)은 일어난 일과 숫자만 적었다.
# 지도 해와의 관계: 연방(로디지아 니아살랜드 연방·말리 연방·프랑스령 적도 아프리카)은 구성 단위별 항목으로 두고 연방 자체는 글로 적었다. 일방 독립 선언(로디지아 1965~1979)은 승인 여부를 사실대로 적었고, 카탕가와 비아프라의 분리는 '분리 선언'으로만 적었다.
#   차드 북부의 리비아 점령(1983~1987)은 글로만 적었고 links에 점령 줄을 쓰지 않았다. 반투스탄(트란스케이)은 글로만 적었다.
# 한국사와 닿는 점: 6·25 전쟁에 에티오피아(강뉴 부대)와 남아프리카 연방(공군 제2 비행대대)이 유엔군으로 참전한 일을 한 구절씩 적었다. 한국사 파일의 글은 고치지 않는다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(수단 재정복: 옴두르만 전투와 파쇼다 사건, 공동 통치 협정(1896~1899), 사이드 빈 술탄의 죽음과 오만·잔지바르의 분리, 영국의 배타 협정(1856~1891), 알제리 전쟁, 모로코의 독립과 무함마드 5세, 모리타니의 독립(1953~1961)).

- id: french-union-rda-1946
  year: 1946
  endYear: 1947
  title:
    ko: "프랑스 연합과 아프리카 민주 연합, 오트볼타 복원(1946~1947)"
  summary:
    ko: "1946년 10월 27일 공포된 프랑스 제4공화국 헌법은 본국과 해외 영토를 묶은 프랑스 연합을 세워, 서아프리카와 적도 아프리카의 주민을 프랑스 의회에 의원을 보내는 연합의 시민으로 삼았다. 이에 앞서 1946년 4월 11일 코트디부아르 의원 펠릭스 우푸에부아니가 발의한 법이 식민지의 강제 노동을 폐지했고, 5월 7일 세네갈 의원 라민 게예의 법은 해외 영토의 모든 주민에게 프랑스 시민의 지위를 주었다. 1946년 10월 바마코 대회에서 서아프리카와 적도 아프리카의 정치 세력이 아프리카 민주 연합(RDA)을 만들어 우푸에부아니가 의장을 맡았고, 이 단체는 프랑스 공산당과 한동안 손을 잡아 식민 행정의 탄압을 받았다. 1947년 9월 4일 프랑스는 1932년에 폐지해 이웃 영토에 나눠 붙였던 오트볼타를 다시 세웠다. 프랑스령 오트볼타는 프랑스령 코트디부아르와 프랑스령 니제르, 프랑스령 수단에 갈라 주었던 모시족의 땅을 돌려받았고, 이 때문에 세 영토의 경계가 바뀌었다. 연합은 식민지 주민에게 투표권과 대표권을 넓혀 주었으나 정책 결정은 파리가 쥐었고, 이 틀은 1958년 프랑스 공동체로 바뀐다(「프랑스 공동체 국민 투표와 기니의 독립(1958)」(뒤의 사건)). 연합의 기구로 연합 의회와 연합 고등 평의회가 있었으나 권한은 대체로 자문에 그쳤다. 우푸에부아니는 1950~1951년 RDA가 프랑스 공산당과의 협력을 끊도록 이끌었고 1956년 프랑스 정부의 장관이 되었다. 1956년 6월의 해외 영토 기본법(드페르 법)은 영토별 의회와 단일 선거인단 보통 선거를 도입하고 영토마다 정부 평의회를 두었다. 세네갈의 레오폴 세다르 상고르도 1945년부터 프랑스 의회 의원으로 활동했고, 오트볼타 복원에는 모시족 왕(모고 나바)의 요구가 영향을 주었다고 한다."
  subjects: [france, french-upper-volta, french-ivory-coast, french-niger, french-sudan]
  links:
    - { from: french-ivory-coast, to: french-upper-volta, note: "1932년에 붙은 땅 가운데 모시족 지역을 오트볼타 복원으로 돌려줌 (1947-09-04)" }
  tags: [politics, society]
  sources: ["Frederick Cooper, Citizenship between Empire and Nation: Remaking France and French Africa, 1945–1960 (Princeton University Press, 2014)", "Elizabeth Schmidt, Cold War and Decolonization in Guinea, 1946–1958 (Ohio University Press, 2007)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: madagascar-independence-1947
  year: 1947
  endYear: 1960
  title:
    ko: "마다가스카르 봉기와 말라가시 공화국의 독립(1947~1960)"
  summary:
    ko: "1947년 3월 29일 밤 마다가스카르 동부의 모라망가와 마나카라 일대에서 민주 쇄신 마다가스카르 운동(MDRM)과 가까운 민족주의 세력이 프랑스 농장과 군 시설을 공격하며 봉기했다. 프랑스는 MDRM 의원들을 의회 면책 특권을 풀어 체포했고, 1947년 4월 약 1만 8천 명이던 병력을 1948년 약 3만 명으로 늘려 봉기를 눌렀으며 무장 저항은 1948년 말에서 1949년 초 사이에 잦아들었다(끝난 날은 자료마다 1948년 12월과 1949년 2월로 갈린다). 말라가시 쪽 사망자는 식민 정부가 1950년 집계한 약 1만 1천 3백 명부터 첫 공식 추산 8만 9천 명까지 갈리고, 학자 프레미가치는 3만~4만 명으로 추산하며, 프랑스인과 현지 보조병도 수백~2천여 명이 숨졌다. 1948년 7월~10월 재판에서 의원 조제프 라보앙지와 조제프 라세타는 사형, 자크 라베마난자라는 종신형을 받았는데 사형은 1949년 7월 감형되었고 라세타는 1955년 8월 병으로 풀려났다. 프랑스는 1956년 기본법(드페르 법)으로 자치를 넓혔고, 1958년 10월 14일 말라가시 공화국이 프랑스 공동체 안의 자치국으로 선포되어 필리베르 치라나나가 이끌었다. 1960년 6월 26일 프랑스령 마다가스카르는 끝나고 마다가스카르가 독립했다. 봉기 뒤 MDRM은 해산되었고 정치는 1956년 기본법 아래 치라나나의 마다가스카르 사회 민주당이 이끌었다. 1967년 치라나나 정부는 3월 29일을 추도일이자 공휴일로 정했고, 1972년 농민과 학생이 일으킨 로타카 시위로 그의 정부가 무너졌다. 마다가스카르는 1897년 메리나 왕정이 폐지된 뒤 프랑스령이 되었다(「프랑스의 마다가스카르 정복과 메리나 왕국의 끝(1895~1897)」(앞의 사건))."
  subjects: [france, french-madagascar, madagascar]
  links:
    - { from: france, to: madagascar, note: "독립을 승인 (1960-06-26)" }
  tags: [war, politics]
  sources: ["Solofo Randrianja, Stephen Ellis, Madagascar: A Short History (University of Chicago Press, 2009)", "Jacques Tronchon, L'insurrection malgache de 1947 (Karthala, 1986)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: apartheid-1948
  year: 1948
  endYear: 1953
  title:
    ko: "국민당 정부와 아파르트헤이트 법(1948~1953)"
  summary:
    ko: "1948년 5월 총선에서 다니엘 말란이 이끄는 국민당이 얀 스뮈츠의 통합당을 누르고 이겼고, 말란은 남아프리카 연방의 총리가 되어 '아파르트헤이트'(분리·격리) 정책을 내세웠다(「남아프리카 연방의 성립(1909~1910)」(앞의 사건)). 1949년 혼합 혼인 금지법이 서로 다른 인종 사이의 결혼을 막았고, 1950년에는 인구 등록법이 모든 주민을 백인·유색인·아프리카인(반투)·인도인 등으로 나누어 등록하게 했으며 집단 지구법이 인종별 거주 구역을 갈랐다. 1950년 공산주의 억압법은 정부에 반대하는 세력을 금지할 권한을 주었고, 1953년 반투 교육법은 아프리카인 학교를 정부 통제 아래 두어 따로 교육 과정을 정했으며 같은 해 분리 시설 예약법이 공공 시설의 인종 분리를 허용했다. 이에 맞서 아프리카 국민회의는 1952년 불복종 운동을 벌였는데 이때 넬슨 만델라가 이름을 알렸다. 1948년부터 1954년까지 말란이 총리였고 뒤를 요하네스 스트레이돔(1954~1958), 헨드릭 페르부르트(1958~1966)가 이었으며, 남아프리카 연방은 6·25 전쟁에 공군 제2 비행대대 '플라잉 치타'를 유엔군으로 보내 1950년 11월부터 1953년까지 싸웠다. 이 법들은 1990년대 초까지 이어졌다(「만델라 석방과 아파르트헤이트의 끝, 첫 전 인종 선거(1990~1994)」(뒤의 사건)). 1948년 총선에서 국민당 계열은 득표수로는 통합당에 뒤졌으나 농촌 선거구에 유리한 의석 배분으로 의석이 더 많았다. 1951년 반투 당국법은 아프리카인 보호구에 부족 당국을 세웠고, 1952년 통행증 관련 법은 모든 성인 아프리카인이 신분 증명 문서를 지니도록 했다."
  subjects: [south-africa]
  links: []
  tags: [politics, society]
  sources: ["Leonard Thompson, A History of South Africa (Yale University Press, 4th ed., 2014)", "Hermann Giliomee, The Afrikaners: Biography of a People (Hurst, 2003)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: ex-italian-colonies-1949
  year: 1949
  endYear: 1962
  title:
    ko: "옛 이탈리아 식민지: 소말리아 신탁 통치와 에리트레아 연방, 병합(1949~1962)"
  summary:
    ko: "이탈리아는 1947년 2월 파리 강화 조약으로 리비아·에리트레아·소말리아의 식민지를 포기했으나 처분이 미뤄졌고, 영국이 1941년부터 군정을 편 에리트레아와 이탈리아령 소말리아(영국 군정)는 4대국이 합의하지 못해 유엔 총회로 넘어갔다. 1949년 11월 21일 총회 결의 289호는 소말리아를 10년 뒤 독립을 조건으로 이탈리아의 신탁 통치 아래 두기로 했고, 1950년 4월 1일 이탈리아령 소말리아(영국 군정)가 끝나고 소말리아 신탁 통치령이 시작되었다. 에리트레아는 1950년 12월 2일 총회 결의 390호 A로 에티오피아와 연방을 이루기로 했고, 1952년 9월 15일 영국 군정이 끝나고 자체 의회와 헌법을 지닌 에리트레아 연방이 에티오피아 제국 아래 들어섰다. 하일레 셀라시에 황제의 정부는 연방의 아랍어·티그리냐어 공용 지위와 의회 권한을 잠식하여 1950년대 말 연방 깃발과 공용어 지위를 없앴고, 1962년 11월 에리트레아 의회가 연방 해체를 의결해 에리트레아는 에티오피아의 한 주로 병합되었다. 이미 1961년 9월 1일 하미드 이드리스 아와테가 이끄는 무장 투쟁이 시작되어 30년 가까이 이어진다(「멩기스투 정권의 붕괴와 에리트레아의 독립(1991~1993)」(뒤의 사건)). 에티오피아는 6·25 전쟁에도 1951년부터 강뉴 부대를 순환 파병하여 수천 명을 유엔군으로 보냈다. 이탈리아는 모가디슈에 신탁 통치 행정청(이탈리아어 약칭 AFIS)을 두고 1960년 독립 때까지 소말리아를 다스렸다. 에리트레아 안에서는 에티오피아와의 합병을 바란 통합당과 독립을 바란 무슬림 연맹 등이 맞섰고, 유엔은 1950년 조사 위원회를 보내 의견을 들었다. 유엔 총회에 앞서 1947~1948년 4대국 위원회가 에리트레아를 조사했으나 의견이 갈렸다."
  subjects: [uk, ethiopia, somalia-british-admin, eritrea-british-admin, somalia-italian-trust, eritrea-federation]
  links:
    - { from: uk, to: ethiopia, note: "에리트레아 영국 군정을 끝내고 연방으로 넘김 (1952-09-15)" }
  tags: [politics, diplomacy]
  sources: ["Tekeste Negash, Eritrea and Ethiopia: The Federal Experience (Nordic Africa Institute, 1997)", "Gebru Tareke, The Ethiopian Revolution: War in the Horn of Africa (Yale University Press, 2009)", "I. M. Lewis, A Modern History of the Somali (James Currey, 4th ed., 2002)"]

- id: ghana-independence-1951
  year: 1951
  endYear: 1957
  title:
    ko: "은크루마와 가나의 독립(1951~1957)"
  summary:
    ko: "영국령 골드코스트에서는 1947년 연합 골드코스트 회의가 서고 1948년 아크라 소요가 일어난 뒤, 이 회의의 서기였던 콰메 은크루마가 1949년 6월 회의 인민당을 만들어 즉각적인 자치를 요구했다. 1950년 '적극 행동' 파업으로 은크루마가 갇혔으나 1951년 2월 총선에서 회의 인민당이 크게 이겨 감옥에서 나온 그가 정부 업무 지도자가 되었고, 1952년에는 총리가 되었다. 1954년과 1956년 총선에서도 회의 인민당이 이겼고, 이웃 아샨티 지역의 국민 해방 운동과 북부의 정당은 연방제를 주장했으나 받아들여지지 않았다. 국제 연맹의 위임 통치령에서 이어진 영국령 토골란드는 1956년 5월 9일 주민 투표에서 약 58%가 골드코스트와의 통합에 찬성해 1957년 3월 6일 골드코스트와 함께 독립 국가에 편입되었다(영국령 토골란드의 에웨족 일부는 통합에 반대했다). 1957년 3월 6일 영국령 골드코스트는 사하라 이남 아프리카에서 처음으로 독립해 가나가 되었고, 영국 여왕을 국가 원수로 하는 영연방 안의 나라로서 은크루마가 총리를 맡았다. 나라 이름은 서아프리카의 옛 가나 제국에서 따왔으나 영토는 옛 가나 제국과 다르다. 골드코스트는 코코아 수출로 식민지 아프리카에서 비교적 부유했으나, 1948년 2월 28일 아크라에서 제대 군인의 행진에 경찰이 발포해 3명이 숨지자 소요가 번져 수십 명이 숨졌다. 영국은 이를 계기로 쿠시 위원회를 꾸려 1949년 헌법 개정안을 마련했다. 1957년 3월 6일 자정 은크루마는 아크라의 구장에서 독립을 선포하며 가나의 독립은 아프리카 대륙 전체의 해방과 이어지지 않으면 의미가 없다고 연설했고, 가나는 곧 유엔에 가입했다."
  subjects: [uk, british-gold-coast, british-togoland, ghana]
  links:
    - { from: uk, to: ghana, note: "골드코스트와 영국령 토골란드의 독립을 승인 (1957-03-06)" }
  tags: [politics]
  sources: ["David Rooney, Kwame Nkrumah: Vision and Tragedy (Sub-Saharan Publishers, 2007)", "Dennis Austin, Politics in Ghana, 1946–1960 (Oxford University Press, 1964)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: mau-mau-1952
  year: 1952
  endYear: 1960
  title:
    ko: "마우마우 봉기와 케냐 비상사태(1952~1960)"
  summary:
    ko: "케냐 중부 고원의 키쿠유족은 백인 정착민이 차지한 땅과 소작 제한에 불만을 품었고, 1940년대 말부터 비밀 서약으로 뭉친 마우마우 운동이 정착민 농장과 정부에 협력한 키쿠유 지도자를 공격했다. 영국령 케냐 식민지 총독 에블린 베어링은 1952년 10월 20일 비상사태를 선포했고, 이튿날 아침 조모 케냐타 등을 붙잡아 1953년 4월 카펜구리아 재판에서 유죄를 선고받게 했다. 1953년 3월 라리 마을에서는 마우마우에 맞선 키쿠유 주민 70여 명이 살해되었고, 1954년 4월 나이로비 '앤빌 작전'으로 약 2만 명이 붙잡혔으며 수만 명이 수용소와 강제 마을로 보내졌다. 마우마우 지도자 데단 키마티는 1956년 10월 21일 붙잡혀 1957년 2월 처형되었고, 1959년 3월 홀라 수용소에서는 수감자 11명이 구타로 숨졌다. 전투와 수용소에서 숨진 사람의 수는 마우마우 쪽 1만 1천~2만 명 안팎이라는 추산부터 키쿠유 주민 10만 명 이상이라는 추산까지 크게 갈리며, 아프리카인 경찰·군인 약 3천 명과 영국군 95명도 숨졌다. 비상사태는 1960년 1월 풀렸고 케냐타는 1961년 8월 풀려나 독립을 이끌었다(「탕가니카·우간다·케냐의 독립과 잔지바르 혁명, 탄자니아 연합(1961~1964)」(뒤의 사건)). 2013년 영국 정부는 수용소 고문 피해 생존자 5천여 명에게 보상금을 주기로 했다. 마우마우라는 이름은 정착민과 정부가 붙인 것이고, 참가자들은 스스로를 케냐 토지 자유군이라 불렀다. 합법 정치를 이끈 케냐 아프리카 동맹(KAU)이 한계에 부딪힌 데다 농장에서 쫓겨난 소작인이 많아 불만이 컸다. 수용소에서는 서약을 버리도록 강요하는 재활 과정과 강제 노동이 따랐다."
  subjects: [uk, british-kenya]
  links: []
  tags: [war, society]
  sources: ["David Anderson, Histories of the Hanged: The Dirty War in Kenya and the End of Empire (W. W. Norton, 2005)", "Caroline Elkins, Imperial Reckoning: The Untold Story of Britain's Gulag in Kenya (Henry Holt, 2005)", "Bruce J. Berman, John Lonsdale, Unhappy Valley: Conflict in Kenya and Africa (James Currey, 1992)"]

- id: central-african-federation-1953
  year: 1953
  endYear: 1964
  title:
    ko: "로디지아 니아살랜드 연방과 잠비아·말라위의 독립(1953~1964)"
  summary:
    ko: "1953년 8월 1일 영국은 백인 이주민이 많은 남로디지아와 영국 보호령인 북로디지아·니아살랜드를 묶어 로디지아 니아살랜드 연방(중앙아프리카 연방)을 만들었다. 구리 광산이 있는 북로디지아와 노동력이 많은 니아살랜드를 남로디지아의 백인 지배 아래 두려는 구상이었고, 수도는 남로디지아의 솔즈베리였으며 총리는 고드프리 허긴스(1953~1956), 로이 웰렌스키(1956~1963)가 맡았다. 구성 단위는 연방 안에서도 각자 총독과 정부를 두었고(로디지아는 1964년까지 남로디지아로 불렸다), 아프리카인은 연방 의회에서 거의 대표되지 못했다. 이에 니아살랜드 아프리카 회의(1958년 귀국한 헤이스팅스 반다가 이끌었다)와 북로디지아의 케네스 카운다가 이끈 통일 민족 독립당이 연방에 반대했다. 1959년 3월 3일 니아살랜드에 비상사태가 선포되어 반다가 붙잡혔고, 영국 판사 패트릭 데블린의 보고서가 이를 '경찰국가'라 비판했다. 1960년 2월 3일 해럴드 맥밀런 총리가 케이프타운의 남아프리카 연방 의회에서 한 '바람의 변화' 연설은 영국이 아프리카인 다수 통치를 받아들이는 방향을 알렸고, 연방은 1963년 12월 31일 해체되었다. 니아살랜드는 1964년 7월 6일 말라위로 독립해 반다가 총리를 맡았고, 북로디지아는 1964년 10월 24일 잠비아로 독립해 카운다가 대통령이 되었다. 남로디지아의 백인 정부는 영국의 독립 허락을 받지 못하고 남았다(「로디지아의 일방 독립 선언과 짐바브웨의 독립(1965~1980)」(뒤의 사건)). 잠베지강에 1955~1959년 지은 카리바 댐은 연방의 대표 사업이었고, 호수가 생기며 통가족 수만 명이 옮겨 갔다. 솔즈베리에는 1955년 연방의 로디지아 니아살랜드 대학이 세워졌다."
  subjects: [uk, rhodesia, northern-rhodesia, nyasaland, zambia, malawi]
  links:
    - { from: uk, to: zambia, note: "북로디지아의 독립을 승인 (1964-10-24)" }
    - { from: uk, to: malawi, note: "니아살랜드의 독립을 승인 (1964-07-06)" }
  tags: [politics]
  sources: ["Philip Murphy (ed.), Central Africa: Part I, Closer Association, 1945–1958, British Documents on the End of Empire (HMSO, 2005)", "Robert I. Rotberg, The Rise of Nationalism in Central Africa: The Making of Malawi and Zambia, 1873–1964 (Harvard University Press, 1965)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: sudan-independence-1953
  year: 1953
  endYear: 1956
  title:
    ko: "수단의 독립(1953~1956)"
  summary:
    ko: "수단은 1899년 영국과 이집트의 공동 통치 협정으로 영국-이집트령 수단이 된 뒤(「수단 재정복: 옴두르만 전투와 파쇼다 사건, 공동 통치 협정(1896~1899)」(앞의 사건)) 형식은 공동 통치였으나 실제로는 영국이 다스렸다. 1952년 이집트에서 자유 장교단이 왕정을 무너뜨리자 새 정부가 수단 주민의 자결권을 인정하는 쪽으로 돌아섰고, 1953년 2월 12일 영국과 이집트는 자치 정부 수립과 3년 안의 자결을 정하는 협정을 맺었다. 1953년 말 총선에서 이스마일 알아즈하리의 국민 연합당이 이겨 1954년 1월 알아즈하리가 총리가 되었고 처음에는 이집트와의 결합을 내세웠으나 점차 독립으로 돌아섰다. 1955년 8월 18일 남부 에콰토리아에서 군인 반란(토리트 반란)이 일어나 남부의 불만이 폭발했고, 이는 1972년 아디스아바바 협정까지 이어지는 첫 번째 수단 내전의 시작이 되었다. 1955년 12월 19일 의회가 독립을 선언했고 1956년 1월 1일 수단이 독립해 영국-이집트령 수단은 끝났다. 영국과 이집트는 곧바로 이를 승인했고, 수단은 1956년 11월 12일 유엔에 가입했다. 이어 1958년 11월 이브라힘 압부드 장군이 쿠데타로 정권을 잡았다. 1953년 협정으로 총독의 권한은 다섯 명의 평의회로 넘어갔고 관료를 수단 사람으로 바꾸는 작업과 군대 철수 일정이 정해졌다. 이집트와의 결합을 바란 국민 연합당에 맞서 독립을 바란 움마당은 마흐디의 후손이 이끄는 안사르 교단의 지지를 받았다. 영국은 1930년대부터 1946년까지 남부를 따로 다스리는 남부 정책을 폈다가 1946년 이를 버리고 남북을 합쳤다. 압부드 정권은 1964년 10월 민중 봉기로 무너졌다."
  subjects: [uk, egypt, anglo-egyptian-sudan, sudan]
  links:
    - { from: uk, to: sudan, note: "영국-이집트령 수단의 독립을 승인 (1956-01-01)" }
    - { from: egypt, to: sudan, note: "영국-이집트령 수단의 독립을 승인 (1956-01-01)" }
  tags: [politics]
  sources: ["Peter Woodward, Sudan, 1898–1989: The Unstable State (Lynne Rienner, 1990)", "Robert O. Collins, A History of Modern Sudan (Cambridge University Press, 2008)", "Douglas H. Johnson, The Root Causes of Sudan's Civil Wars (James Currey, 2003)"]

- id: nigeria-independence-1954
  year: 1954
  endYear: 1960
  title:
    ko: "나이지리아 연방의 독립(1954~1960)"
  summary:
    ko: "영국은 1914년 합병한 북부·남부 보호령과 라고스 식민지를 나이지리아 식민지로 다스렸고(「라고스 합병과 나이지리아 통합(1906~1914)」(앞의 사건)), 1954년 식민 장관 올리버 리틀턴의 이름을 딴 헌법으로 북부·동부·서부 세 지역과 라고스 연방 직할지를 묶은 연방제를 시작했다. 북부는 아마두 벨로가 이끄는 북부 인민 회의(하우사·풀라니 중심), 동부는 은남디 아지키웨의 나이지리아·카메룬 국민 회의(이그보족 중심), 서부는 오바페미 아올로워의 행동 그룹(요루바족 중심)이 지배해 지역·민족에 따라 정치가 갈렸다. 서부와 동부는 1957년, 북부는 1959년 자치 정부가 되었고, 1957년 8월 아부바카르 타파와 발레와가 연방 총리가 되었다. 1956년에는 동부 올로이비에서 석유가 처음 상업적으로 발견되었다. 1960년 10월 1일 나이지리아 연방은 영연방 안에서 독립했고 영국 여왕을 국가 원수로 삼았으며(1963년 공화국으로 바뀌었고 아지키웨가 초대 대통령이 되었다), 독립 이듬해에는 영국령 카메룬 북부가 합쳐졌다(「카메룬·토고의 독립과 영국령 카메룬 주민 투표(1955~1961)」(뒤의 사건)). 독립 5년여 만에 군사 쿠데타가 일어나고 내전이 이어진다(「비아프라 전쟁(1967~1970)」(뒤의 사건)). 1959년 12월 총선에서 어느 정당도 과반을 얻지 못해 북부 인민 회의와 나이지리아·카메룬 국민 회의가 연립 정부를 이루었고 아올로워는 야당 지도자가 되었다. 독립 직후인 1960년 11월 아지키웨가 총독이 되었다. 지역 정당이 하우사·풀라니, 이그보, 요루바의 민족 기반 위에 서 있었다는 점이 독립 뒤 정치의 약점이 되었다. 독립 때 나이지리아는 아프리카에서 인구가 가장 많은 나라였다."
  subjects: [uk, british-nigeria, nigeria]
  links:
    - { from: uk, to: nigeria, note: "나이지리아 식민지의 독립을 승인 (1960-10-01)" }
  tags: [politics]
  sources: ["Toyin Falola, Matthew M. Heaton, A History of Nigeria (Cambridge University Press, 2008)", "James S. Coleman, Nigeria: Background to Nationalism (University of California Press, 1958)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: cameroon-togo-1955
  year: 1955
  endYear: 1961
  title:
    ko: "카메룬·토고의 독립과 영국령 카메룬 주민 투표(1955~1961)"
  summary:
    ko: "독일령 카메룬과 토골란드는 제1차 세계 대전 뒤 영국과 프랑스가 나누어 위임 통치했고(「베르사유 조약과 아프리카의 위임 통치령(1919~1922)」(앞의 사건)), 1946년부터 유엔 신탁 통치령이 되었다. 프랑스령 카메룬에서는 루벤 움 니오베의 카메룬 인민 연합(UPC)이 독립과 통일을 요구하다 1955년 5월 소요를 겪고 7월 금지되었고, 무장 투쟁이 이어져 움 니오베는 1958년 9월 13일 프랑스군에게 살해되었다. 1958년 총리가 된 아마두 아히조는 1960년 1월 1일 프랑스령 카메룬을 카메룬 공화국으로 독립시켰다. 프랑스령 토골란드는 1956년 8월 30일 자치 공화국이 되었고(10월 28일 주민 투표가 이를 승인했으나 유엔은 신탁 통치를 끝내지 않았다), 1958년 4월 유엔 감시 선거에서 실바누스 올랭피오가 이끈 토고 통일 위원회가 이겨 1960년 4월 27일 토고가 독립했다(올랭피오는 1963년 1월 쿠데타로 살해되었다). 영국령 카메룬은 나이지리아의 일부로 다스려졌는데, 1961년 2월 11일 유엔이 감독한 주민 투표에서 북부는 약 60%로 나이지리아와의 합병을, 남부는 약 70%로 카메룬과의 통합을 택했다. 북부는 1961년 6월 1일 나이지리아에 합쳐졌고 남부는 10월 1일 카메룬 공화국과 합쳐 카메룬 연방 공화국이 되었으며, 이로써 프랑스령 카메룬·프랑스령 토골란드·영국령 카메룬이 끝났다. 독립한 카메룬은 1972년 연방제를 폐지하고 통일 공화국이 되었으며, 토고는 1967년 군부의 에야데마가 집권했다. 영국령 카메룬 주민 투표의 선택지는 나이지리아 합병과 카메룬 통합 둘뿐이어서 독립 자체는 묻지 않았다는 비판이 있었다. 영국령 카메룬 남부에서는 카메룬과의 통합을 바란 존 응구 폰차의 정당이 나이지리아 합병을 바란 에마 엔델리를 눌렀다."
  subjects: [france, uk, french-cameroons, french-togoland, british-cameroons, cameroon, togo, nigeria]
  links:
    - { from: france, to: cameroon, note: "프랑스령 카메룬의 독립을 승인 (1960-01-01)" }
    - { from: france, to: togo, note: "프랑스령 토골란드의 독립을 승인 (1960-04-27)" }
    - { from: uk, to: nigeria, note: "영국령 카메룬 북부를 합병하도록 허용 (1961-06-01)" }
  tags: [politics, diplomacy]
  sources: ["Mark DeLancey, Rebecca Neh Mbuh, Mark Dike DeLancey, Historical Dictionary of the Republic of Cameroon (Rowman & Littlefield, 4th ed., 2019)", "Richard Joseph, Radical Nationalism in Cameroun: Social Origins of the U.P.C. Rebellion (Oxford University Press, 1977)", "The Cambridge History of Africa, vol. 8: From c. 1940 to c. 1975 (Cambridge University Press, 1984)"]

- id: guinea-1958
  year: 1958
  endYear: 1958
  title:
    ko: "프랑스 공동체 국민 투표와 기니의 독립(1958)"
  summary:
    ko: "1958년 프랑스에서 샤를 드골이 복귀해 제5공화국 헌법을 내놓았고, 이 헌법은 프랑스 연합(「프랑스 연합과 아프리카 민주 연합, 오트볼타 복원(1946~1947)」(앞의 사건))을 프랑스 공동체로 바꾸면서 해외 영토에 찬성하면 공동체 가입, 반대하면 즉시 독립이라는 선택을 국민 투표로 물었다. 1958년 8월 25일 드골이 콩크리를 찾았을 때 기니 민주당의 세쿠 투레는 연설에서 기니는 노예 상태의 부유함보다 자유 속의 가난을 택한다고 말했고, 9월 28일 투표에서 프랑스령 기니는 약 95%가 반대표를 던졌다. 서아프리카·적도 아프리카의 다른 영토는 모두 찬성했고, 기니만 공동체에 들지 않았다. 1958년 10월 2일 기니는 독립을 선포했고 투레가 대통령이 되었으며, 프랑스는 행정관과 기술자를 철수하고 일부 설비를 가져가 원조를 끊었다. 기니는 1958년 11월 가나와 연합을 선언하고 소련·동구권에 가까워졌으며 12월 유엔에 가입했다. 투레의 일당 지배는 1984년 그의 죽음까지 이어졌다. 기니의 독립은 이듬해 다른 프랑스 영토의 독립 협상을 앞당긴 계기가 되었다(「프랑스령 적도 아프리카 네 나라의 독립: 차드·중앙아프리카·가봉·콩고(1958~1960)」(뒤의 사건)). 투레의 기니 민주당은 RDA의 기니 지부였다. 기니와 프랑스의 외교 관계는 1965년 끊어졌다가 1975년에야 회복되었다. 드골은 콩크리에서 기니가 반대표를 던지면 독립할 수 있다고 답했다. 기니는 1960년 프랑 지역을 떠나 자체 화폐를 도입했다. 투레의 정권은 정치범 수용소 보이로 수용소로 악명이 높았고, 기니는 비동맹 노선을 내세우며 소련과 중국의 원조를 받았다."
  subjects: [france, french-guinea, guinea]
  links:
    - { from: france, to: guinea, note: "국민 투표 결과 프랑스령 기니의 독립을 받아들임 (1958-10-02)" }
  tags: [politics]
  sources: ["Elizabeth Schmidt, Cold War and Decolonization in Guinea, 1946–1958 (Ohio University Press, 2007)", "Frederick Cooper, Citizenship between Empire and Nation: Remaking France and French Africa, 1945–1960 (Princeton University Press, 2014)", "Tony Chafer, The End of Empire in French West Africa: France's Successful Decolonization? (Berg, 2002)"]

- id: aef-independence-1958
  year: 1958
  endYear: 1960
  title:
    ko: "프랑스령 적도 아프리카 네 나라의 독립: 차드·중앙아프리카·가봉·콩고(1958~1960)"
  summary:
    ko: "프랑스령 적도 아프리카는 1910년 가봉·중앙콩고·우방기샤리·차드를 묶어 만든 연방이었다(「우방기샤리와 프랑스령 적도 아프리카(1903~1910)」(앞의 사건)). 1958년 9월 국민 투표에서 네 영토는 모두 프랑스 공동체 가입에 찬성했고, 11월과 12월에 프랑스령 차드, 우방기샤리, 프랑스령 가봉, 프랑스령 중앙콩고는 공동체 안의 자치 공화국이 되었다. 우방기샤리는 1958년 12월 1일 중앙아프리카 공화국이 되었고, 중앙콩고는 콩고 공화국(수도 브라자빌)이 되었다. 중앙아프리카 공화국을 이끈 바르텔레미 보간다는 1959년 3월 비행기 사고로 숨져 다비드 다코가 뒤를 이었다. 1960년 6월 프랑스가 헌법을 고쳐 공동체 안의 나라가 독립할 길을 열자, 차드는 1960년 8월 11일, 중앙아프리카 공화국은 8월 13일, 콩고 공화국은 8월 15일, 가봉은 8월 17일 독립했다. 첫 지도자는 차드의 프랑수아 톰발바예, 중앙아프리카의 다코, 콩고의 풀베르 유루, 가봉의 레옹 음바였다. 이들은 독립 뒤에도 프랑스와 방위·경제 협정을 이어 갔다. 보간다는 네 영토를 하나의 중앙아프리카 공화국으로 묶으려 했으나 상대적으로 부유한 가봉과 콩고가 연방 분담금을 꺼려 무산되었다고 한다. 독립 뒤에는 콩고의 유루가 1963년 8월 시민 봉기로 쫓겨났고, 가봉의 음바는 1964년 2월 군부 쿠데타를 프랑스 낙하산 부대의 도움으로 이겨 냈으며, 중앙아프리카에서는 1965년 12월 말 장 베델 보카사의 쿠데타가 다코를 몰아냈다. 네 영토는 경제가 크게 달라 가봉은 석유와 망간, 중앙아프리카는 다이아몬드와 면화, 차드는 면화와 가축에 기대었다. 유루와 보간다는 모두 가톨릭 사제 출신이었다."
  subjects: [france, french-chad, french-ubangi-shari, french-gabon, french-middle-congo, chad, car, gabon, republic-of-congo]
  links:
    - { from: france, to: chad, note: "프랑스령 차드의 독립을 승인 (1960-08-11)" }
    - { from: france, to: car, note: "우방기샤리(중앙아프리카 공화국)의 독립을 승인 (1960-08-13)" }
    - { from: france, to: republic-of-congo, note: "프랑스령 중앙콩고(콩고 공화국)의 독립을 승인 (1960-08-15)" }
    - { from: france, to: gabon, note: "프랑스령 가봉의 독립을 승인 (1960-08-17)" }
