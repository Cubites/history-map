- id: mongol-central-europe-1241
  year: 1241
  endYear: 1242
  title:
    ko: "몽골의 폴란드·헝가리 침공: 레그니차와 모히(1241)"
  summary:
    ko: "키예프를 점령한 바투의 군대는 병력을 나눠 서쪽으로 들어갔다. 한 갈래는 폴란드로 들어가 1241년 2월 산도미에시를, 3월 크라쿠프를 불태웠다. 4월 9일 레그니차(독일어 리그니츠)에서 슐레지엔 공 헨리크 2세가 이끈 폴란드·독일 연합군(성전기사단과 튜턴 기사단도 있었다)이 대패하고 헨리크가 전사했다. 보헤미아 왕 바츨라프 1세의 군대가 합류하려고 오던 길에 하루쯤 늦었다고 전한다. 바투 자신은 3월 12일 카르파티아를 넘어 헝가리로 들어가 4월 11일 모히에서 샤요강을 사이에 두고 벨러 4세의 군대를 무찔렀다. 벨러는 오스트리아를 거쳐 아드리아해 연안의 트로기르 섬까지 쫓겨 갔다. 몽골은 헝가리 평원에서 1242년 봄까지 머물렀고, 헝가리는 인구의 상당 부분을 잃었다는 추산이 있다(연구자마다 15퍼센트에서 절반까지 크게 갈린다). 몽골에 쫓겨 헝가리로 들어와 있던 쿠만의 칸 쾨텐은 1241년 3월 페슈트에서 헝가리 귀족에게 살해되었다. 1241년 12월 대칸 오고타이가 죽자 황족들이 후계 문제로 돌아간 것이 철수의 이유로 흔히 꼽히지만, 헝가리 평원의 목초지가 대군에 모자랐고 돌로 쌓은 성을 쉽게 깨지 못했다는 설명도 있다. 1242년 바투는 볼가강 하류에 사라이를 두고 칸국을 세웠다(뒤의 사건). 벨러 4세는 돌로 지은 성을 쌓고 쿠만을 다시 불러들여 나라를 재건해 '제2의 건국자'로 불린다."
  subjects: [mongol-empire, hungary-kingdom, polish-duchies, bohemia-kingdom, holy-roman-empire, golden-horde, cuman-tribes, bulgaria-second]
