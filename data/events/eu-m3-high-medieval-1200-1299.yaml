- id: jaime-i-1229
  year: 1229
  endYear: 1285
  title:
    ko: "하이메 1세와 페드로 3세: 마요르카와 발렌시아 정복, 코르베유 조약, 안도라의 시작"
  summary:
    ko: "아라곤 왕 하이메 1세(재위 1213~1276)는 1229년 9월 마요르카에 상륙해 12월 31일 마디나 마유르카(오늘의 팔마)를 함락했다. 섬의 무슬림은 많이 노예가 되거나 쫓겨났고 카탈루냐 사람들이 이주했다. 메노르카는 1231년 공물을 바치는 속국이 되었다가 1287년 알폰소 3세가 정복했고, 이비사는 1235년 정복되었다. 이어 발렌시아 정복에 나서 1238년 9월 28일 발렌시아시를 얻고 1244년 샤티바(카스티야어 하티바)를 얻었다. 같은 해 3월 알미스라 조약으로 카스티야의 알폰소(훗날 10세)와 정복지의 경계를 정했다. 무슬림 농민의 반란은 1244~1245년, 1248년, 1276년에도 이어졌다. 1258년 5월 코르베유 조약으로 하이메는 몽펠리에를 뺀 옥시타니아 영유권을 포기했고, 프랑스 왕 루이 9세는 카탈루냐에 대한 종주권을 포기했다. 1266년 하이메는 사위 알폰소 10세의 무르시아 정복을 도왔다(뒤의 사건). 1276년 7월 그가 죽으며 왕국을 나누어, 아라곤·카탈루냐·발렌시아는 큰아들 페드로 3세에게, 마요르카·루시용·세르다냐·몽펠리에는 둘째 아들 하이메(마요르카 왕 하이메 2세)에게 주어 마요르카 왕국이 생겼다. 1278년 9월 8일 푸아 백작과 우르헬 주교가 안도라 계곡의 공동 영주권을 정하는 파리아주(공동 영주 조약)를 맺었다. 1282년 페드로 3세는 시칠리아의 왕이 되었다(뒤의 사건)."
  subjects: [aragon, majorca-kingdom, andorra, castile, france, provence-barcelona, taifas-third]
