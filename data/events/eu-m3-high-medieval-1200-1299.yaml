- id: rudolf-habsburg-1273
  year: 1273
  endYear: 1291
  title:
    ko: "루돌프 1세와 합스부르크의 오스트리아, 스위스 서약(1291)"
  summary:
    ko: "1273년 10월 1일 선제후들이 보헤미아 왕 오타카르 2세를 피해 합스부르크 백작 루돌프(재위 1273~1291)를 독일 왕으로 뽑았다. 오타카르는 선거에서 제외되었다는 이유로 그를 인정하지 않았다. 교황 그레고리우스 10세는 1274년 루돌프를 인정했고, 루돌프는 1278년 교황령에 대한 교황의 권리를 확인했다. 1276년 루돌프는 오타카르를 제국에서 추방하고 빈을 포위해 11월 빈 조약으로 오스트리아·슈타이어마르크·케른텐·크라인을 내놓게 했다. 오타카르는 다시 일어나 1278년 8월 26일 마르히펠트(뒤른크루트와 예덴스파이겐)에서 루돌프와 헝가리 왕 라슬로 4세의 연합군에 패해 전사했다. 헝가리의 쿠만 경기병이 큰 몫을 했다고 한다. 루돌프는 1282년 12월 아우크스부르크에서 아들 알브레히트와 루돌프 2세에게 오스트리아와 슈타이어마르크를 봉토로 주었고, 이후 합스부르크 가문은 600년 넘게 오스트리아를 다스렸다. 지도는 1276년 보헤미아에서 이 땅들을 덜어 내고 1282년 오스트리아를 합스부르크 항목으로 따로 둔다. 루돌프가 7월 15일 죽은 직후인 1291년 8월 초(전통적으로 8월 1일) 우리·슈비츠·운터발덴 세 골짜기 공동체가 서로 돕기로 하는 동맹 문서(연방 서약, Bundesbrief)를 맺었다. 고트하르트 길과 합스부르크의 세력 확대가 배경으로 꼽힌다. 이것이 스위스 연방의 시작으로 기억되지만, 빌헬름 텔과 뤼틀리 서약 이야기는 15세기 후반에야 기록된 전설이다."
  subjects: [holy-roman-empire, bohemia-kingdom, habsburg-austria, hungary-kingdom, papal-states, switzerland]
  links:
