    - { from: genoa, to: venice, note: "쿠르졸라 해전(1298)과 밀라노 화약(1299)" }
  tags: [war, economy]
  sources: ["로저 크롤리, 『부의 도시, 베네치아』(우태영 옮김, 다른세상, 2012)", "Steven A. Epstein, Genoa and the Genoese, 958–1528 (1996)", "Frederic C. Lane, Venice: A Maritime Republic (1973)"]
