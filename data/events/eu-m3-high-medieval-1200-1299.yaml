  sources: ["Peter Jackson, The Mongols and the West, 1221–1410 (2005)", "Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)", "Denis Sinor, 'The Mongols in the West', Journal of Asian History 33 (1999)"]
