- id: fernando-iii-1230
  year: 1230
  endYear: 1252
  title:
    ko: "페르난도 3세의 레콩키스타: 코르도바(1236)에서 세비야(1248)까지"
  summary:
    ko: "1217년 카스티야 왕이 된 페르난도 3세는 1230년 레온 왕 알폰소 9세(아버지)가 죽자 레온 왕위도 이어받아 두 나라를 합쳤고, 이후 카스티야와 레온은 다시 갈라지지 않았다. 알모하드가 무너져 이슬람 이베리아가 소국으로 갈린 틈을 타 남쪽으로 나갔다. 1236년 6월 29일 코르도바가 항복해 대모스크가 성당이 되었다. 이븐 알아마르(무함마드 1세)는 1232년 아르호나에서 일어나 1238년 그라나다를 도읍으로 나스르 왕조를 세웠다. 1243년 알카라스 조약으로 무르시아의 소국이 카스티야의 보호 아래 들어왔고, 1246년 하엔이 항복하면서 무함마드 1세는 카스티야의 신하가 되어 해마다 공물을 바치고 군사를 돕기로 했다(그라나다는 이렇게 속국으로 살아남았다). 1247년 8월부터 이어진 포위 끝에 1248년 11월 23일 세비야가 항복했다. 칸타브리아 함대가 과달키비르강의 배다리를 끊은 것이 결정적이었다. 무슬림 주민 상당수가 도시를 떠났고 그 자리에 기독교인이 이주했다. 포르투갈도 남쪽으로 나가 1249년 아폰수 3세가 파루를 차지하며 알가르브 정복을 마친 것으로 본다. 페르난도 3세는 1252년 5월 30일 세비야에서 죽었다. 정복지에 남은 무슬림(무데하르)은 기독교 왕 아래에서 종교와 법을 어느 정도 지킬 수 있었으나, 지배층은 토지를 잃고 점차 그라나다나 아프리카로 떠났다."
  subjects: [castile, leon, castile-early, granada, portugal, taifas-third]
