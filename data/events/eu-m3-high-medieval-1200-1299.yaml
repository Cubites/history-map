  sources: ["Donald M. Nicol, The Despotate of Epiros (Oxford: Blackwell, 1957)", "Michael Angold, A Byzantine Government in Exile: Government and Society under the Laskarids of Nicaea (1204–1261) (1975)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)", "Peter Lock, The Franks in the Aegean, 1204–1500 (1995)"]
