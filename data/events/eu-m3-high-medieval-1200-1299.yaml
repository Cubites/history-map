  tags: [politics, war]
  sources: ["Peter H. Wilson, Heart of Europe: A History of the Holy Roman Empire (2016)", "Thomas Maissen, Geschichte der Schweiz (2010)", "Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)"]
