- id: guelph-ghibelline-1250
  year: 1250
  endYear: 1293
  title:
    ko: "겔프와 기벨린: 몬타페르티(1260)에서 캄팔디노(1289)까지"
  summary:
    ko: "프리드리히 2세가 죽은(1250) 뒤 이탈리아 중북부 도시는 교황을 지지하는 겔프와 황제를 지지하는 기벨린으로 갈려 다투었다. 피렌체에서는 1250년 길드가 '제1 포폴로' 정부를 세웠다. 1260년 9월 4일 몬타페르티에서 시에나와 만프레디가 보낸 독일 기사, 피렌체 기벨린 망명자가 피렌체 겔프를 크게 물리쳐 겔프가 쫓겨났다. 그러나 1266년 만프레디가 죽자(뒤의 사건) 겔프가 돌아왔고, 앙주의 샤를이 토스카나의 조정자 노릇을 했다. 1269년 콜레 디 발델사에서 피렌체·앙주 군이 시에나 쪽을 이겼다. 1289년 6월 11일 캄팔디노에서 피렌체 겔프가 아레초 기벨린을 물리쳤고 젊은 단테도 기병으로 나갔다고 전한다. 피렌체는 1293년 '정의의 규약'으로 대귀족이 공직을 맡지 못하게 했다. 롬바르디아에서는 1277년 1월 21일 데지오 전투에서 밀라노 대주교 오토네 비스콘티가 델라 토레 가문을 꺾고 비스콘티의 지배를 시작했다(지도는 1277년 밀라노 시뇨리아 항목을 따로 둔다). 서쪽에서는 사보이아 가문의 피에몬테 영주 토마스 3세(당시 사보이아 백작은 숙부 필리프 1세)가 1280년 몬페라토의 굴리엘모 7세에게서 토리노를 넘겨받았고, 지도는 그해 토리노·쿠네오 일대 피에몬테를 이탈리아 소국들에서 사보이아 백국으로 옮겨 그린다. 피사에서는 1288년 우골리노 델라 게라르데스카가 대주교 루지에리 등에 의해 쫓겨나 1289년 아들·손자들과 함께 탑에 갇혀 굶어 죽었다(단테의 『신곡』 지옥편 33곡이 이를 다룬다). 이 갈등은 1300년 무렵 피렌체 겔프가 백당과 흑당으로 갈라지는 데로 이어진다(뒤의 사건)."
  subjects: [florence, siena, milan-signoria, italian-minor-states, papal-states, sicily-kingdom, naples-kingdom, holy-roman-empire, savoy-county]
