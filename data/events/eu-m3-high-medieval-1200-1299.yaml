- id: baltic-crusade-1202
  year: 1202
  endYear: 1238
  title:
    ko: "발트해 동쪽의 십자군: 검의 형제 기사단과 덴마크의 발데마르 2세"
  summary:
    ko: "1201년 알베르트 주교가 리가를 세웠고, 1202년 그를 돕는 검의 형제 기사단이 생겨 리보니아인·라트갈레인·셈갈레인을 정복하고 개종시키는 십자군이 이어졌다. 1207년 알베르트는 점령지를 신성 로마 제국의 봉토 '테라 마리아나(마리아의 땅)'로 받았다. 이 정복에서 십자군이 주민을 죽이고 강제로 개종시켰다는 점은 사제 하인리히의 『리보니아 연대기』에도 적혀 있다. 한편 덴마크 왕 발데마르 2세(재위 1202~1241)는 1201~1202년 홀슈타인·함부르크·뤼베크를 차지했다가 1223년 5월 슈베린 백작 하인리히에게 사로잡혀 1225년 막대한 몸값과 땅을 내놓고 풀려났고, 1227년 7월 22일 보른회베드 전투에서 북독일 연합군에 크게 져 북독일의 땅을 거의 잃었다. 덴마크는 눈을 동쪽으로 돌려 1219년 6월 15일 린다니세(오늘의 탈린)에 상륙해 에스토니아 북부를 차지했다('다네브로그' 깃발이 하늘에서 떨어졌다는 이야기는 훗날의 전설이다). 스웨덴은 1220년 서부 에스토니아에 건너갔으나 곧 쫓겨났다. 에스토니아인이 1223년 크게 일어났으나 진압되었고 기사단은 1224년 타르투를 얻고 1227년 사레마섬까지 점령했다. 그러나 1236년 9월 22일 사울레 전투에서 검의 형제 기사단이 리투아니아·셈갈레 연합군에게 크게 져 총장 폴크빈과 기사 수십 명이 죽었다. 이듬해 기사단은 튜턴 기사단의 리보니아 지부로 합쳐졌고(1237), 1238년 슈텐스뷔 조약으로 에스토니아 북부는 덴마크가, 나머지는 기사단이 갖기로 했다."
  subjects: [terra-mariana, denmark-medieval, teutonic-order, holy-roman-empire, sweden-medieval, finnic-tribes, baltic-tribes, lithuania-grand-duchy]
