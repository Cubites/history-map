- id: norway-iceland-1220
  year: 1220
  endYear: 1266
  title:
    ko: "호콘 4세의 노르웨이와 아이슬란드 자유국의 끝, 퍼스 조약(1266)"
  summary:
    ko: "노르웨이 왕 호콘 4세(재위 1217~1263)는 1240년 스쿨레 공의 반란을 누르고 내전을 끝낸 뒤 나라를 안정시켰고, 1247년 베르겐에서 교황 사절의 손으로 대관되었다. 아이슬란드에서는 1220년 무렵부터 족장(고디)들이 다투는 '스투를룽 시대'가 이어졌다. 호콘은 이 다툼에 개입했고 『에다』를 쓴 스노리 스투를루손은 1241년 9월 23일 호콘의 뜻을 받든 기수르 토르발드손 일행에게 살해되었다. 그린란드는 1261년 호콘에게 복속했다. 1262~1264년 아이슬란드 족장들은 '옛 계약(Gamli sáttmáli)'을 맺어 노르웨이 왕에게 세금을 내고 충성하는 대신 평화와 법, 노르웨이와의 교역을 보장받았고, 930년부터 이어진 아이슬란드 자유국은 끝났다. 호콘은 헤브리디스 제도를 두고 스코틀랜드 왕 알렉산더 3세와 다투다 1263년 대함대로 원정에 나섰으나 10월 2일 라그스에서 폭풍 속에 승패가 갈리지 않은 싸움을 벌이고 물러났고, 12월 15일 오크니에서 죽었다. 아들 마그누스 6세는 1266년 7월 2일 퍼스 조약으로 헤브리디스와 맨섬을 4천 마르크와 해마다 100마르크를 받고 스코틀랜드에 넘겼다. 지도는 1262년부터 아이슬란드를 노르웨이 왕국에 포함해 그린다."
