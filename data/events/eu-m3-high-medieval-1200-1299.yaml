  sources: ["플라노 드 카르피니·윌리엄 루브룩, 『몽골 제국 기행』(김호동 옮김, 까치, 2015)", "Peter Jackson·David Morgan 편, The Mission of Friar William of Rubruck (1990)", "Peter Jackson, The Mongols and the West, 1221–1410 (2005)", "Maurizio Riotto, 'Apropos of Solangi and Caule' (2015)"]

- id: sweden-finland-1248
  year: 1248
  endYear: 1299
  title:
    ko: "비르예르 야를과 폴쿵 가문의 스웨덴: 핀란드 진출과 비보리(1293)"
  summary:
    ko: "스웨덴은 13세기 중반 에리크 가문과 스베르케르 가문의 왕위 다툼이 잦아들고 폴쿵 가문이 들어섰다. 1248년 비르예르 야를(1248년부터 1266년까지 실권을 쥐었다)이 권력을 잡아 아들 발데마르를 1250년 왕으로 세웠다. 연대기에 따르면 비르예르는 1249~1250년 무렵 핀란드 남부 타바스트(헤메)의 이교도를 정복하는 '제2차 핀란드 십자군'을 이끌었다(연도는 불확실하다). 스톡홀름은 1252년 문헌에 처음 나오며 그의 시기에 도시로 자랐다. 마그누스 라둘로스(재위 1275~1290)는 1280년 알쇠 헌장으로 귀족에게 세금 면제 특권을 주었다. 1290년대 국정을 이끈 원수 토르길스 크누트손은 1293년 카렐리야 서부에 비보리(비푸리) 성을 세웠고, 이로써 스웨덴과 노브고로드 사이의 국경 다툼이 시작되었다(제3차 핀란드 십자군이라 부르기도 한다). 1300년에는 네바강에 란스크로나 성을 쌓았으나 1301년 노브고로드가 무너뜨렸다. 이 싸움은 1323년 노테보리 조약으로 이어진다(뒤의 사건). 지도는 1249년 스웨덴 왕국을 핀란드 쪽으로 넓히고, 1293년 노브고로드 공화국의 서쪽 땅 일부를 스웨덴에 옮긴다."
  subjects: [sweden-medieval, novgorod-republic, finnic-tribes]
  links:
