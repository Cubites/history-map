- id: mindaugas-1236
  year: 1236
  endYear: 1263
  title:
    ko: "민다우가스와 리투아니아 대공국의 성립: 사울레(1236)에서 대관(1253)과 두르베(1260)까지"
  summary:
    ko: "13세기 초 리투아니아의 공작들은 서로 다투다가 민다우가스(1203 무렵 출생)가 1236년 무렵부터 땅을 합쳐 대공이 되었다. 1236년 9월 22일 사울레에서 리투아니아·셈갈레 연합군이 검의 형제 기사단을 무찌른 일(앞의 사건)이 통합의 바탕이 되었다. 민다우가스는 1240년대 흑루테니아(오늘의 벨라루스 서부 일대)를 얻고, 1248~1249년 조카들과 갈리치아의 다닐로, 리보니아 기사단이 손잡은 반대 세력과 싸웠다. 1251년 그는 리보니아 기사단장의 도움으로 가톨릭 세례를 받았고, 교황 인노첸시오 4세의 승인으로 1253년(전통적으로 7월 6일) 왕으로 대관되었다. 그 대가로 사모기티아 등 일부 땅을 기사단에 넘기기로 약속했다. 1260년 7월 13일 두르베에서 사모기티아인과 쿠로니아인이 리보니아 기사단을 크게 물리쳤고(리보니아 운문 연대기는 기사 150명이 죽었다고 적는다), 이 승리가 프로이센의 대반란을 부추겼다. 민다우가스는 1261년 무렵 기독교를 버리고 이교로 돌아갔다고 하며 1263년 조카 트레니오타 등에게 살해되었다. 이후 리투아니아는 이교 대공들 아래 서쪽 루스 땅으로 영토를 넓혀 14세기에 대국이 된다. 지도는 1242년부터 리투아니아 대공국을 흑루테니아 쪽 남쪽으로 넓힌다."
  subjects: [lithuania-grand-duchy, terra-mariana, teutonic-order, galicia-volhynia, papal-states, baltic-tribes]
