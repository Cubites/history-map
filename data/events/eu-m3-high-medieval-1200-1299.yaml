- id: georgia-mongols-1220
  year: 1220
  endYear: 1259
  title:
    ko: "조지아와 몽골: 타마르의 전성기 뒤의 침공과 복속, 서조지아의 분리"
  summary:
    ko: "타마르 여왕(재위 1184~1213) 때 전성기를 누린 조지아는 몽골을 맞아 크게 흔들렸다. 1220~1222년 수부타이와 제베가 카스피해 서쪽을 돌며 조지아로 쳐들어와 쿠난 전투에서 조지 4세 라샤(재위 1213~1223)의 군대를 무찔렀다(전투 연도는 1220년 가을설과 1222년설이 갈린다). 1221년 1월 바르다브에서도 조지아군이 크게 졌다. 조지 4세는 이때 입은 상처로 죽은 것으로 전한다. 이어 여왕 루수단(재위 1223~1245)은 몽골을 피해 온 호라즘의 잘랄 앗딘에게 1226년 수도 트빌리시를 약탈당하고 서쪽 쿠타이시로 옮겨 갔다. 1236년부터 몽골 장군 초르마칸이 캅카스를 정복해 아니 등 도시를 차지했고(1239), 1243년 쾨세다으 전투 뒤 루수단은 몽골에 복속했다(앞의 사건). 루수단이 죽자 몽골은 1247년 루수단의 아들 다비드 6세 나린과 조카(조지 4세의 아들) 다비드 7세 울루를 공동 왕으로 세워 두고 공납과 병력 징발을 매겼다. 1259년 다비드 나린은 몽골의 지배에 맞서 서쪽의 이메레티로 옮겨 독자 왕국(서조지아)을 세웠고, 트빌리시 쪽 동조지아는 몽골의 간접 지배 아래 남았다. 지도는 1240년 몽골이 차지한 남쪽 땅을 조지아 왕국에서 덜어 내고, 1259년 서조지아 왕국을 따로 그린다."
  subjects: [georgia-kingdom, west-georgia-kingdom, mongol-empire, rum-sultanate, trebizond, cilician-armenia]
  links:
    - { from: mongol-empire, to: georgia-kingdom, note: "1220~1222 침공, 1236년 이후 정복, 1243년 이후 복속" }
