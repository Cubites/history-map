- id: edward-i-jews-1290
  year: 1275
  endYear: 1290
  title:
    ko: "잉글랜드의 유대인 추방(1290): 유대인 법령에서 추방 칙령까지"
  summary:
    ko: "중세 잉글랜드의 유대인은 왕의 보호를 받는 대신 왕에게 무거운 세금을 바쳤고 대출업이 주된 생계였다. 1215년 라테란 공의회(앞의 사건)의 구별 표지 규정은 잉글랜드에서 1218년부터 적용되었다. 1255년 링컨에서 소년 '휴'가 죽은 일로 유대인이 의식 살인을 했다는 소문(피의 비방)이 퍼져 유대인 90여 명이 체포되었고, 헨리 3세의 명으로 열여덟 명이 런던에서 처형되었다. 1264년에는 시몽 드 몽포르 편 군중이 런던 유대인 거리를 습격했다(앞의 사건). 에드워드 1세는 1275년 '유대인 법령'으로 이자 대출을 금지하고 농사와 상업으로 살게 했으나 현실적으로 어려웠다. 1278~1279년 동전 깎기 혐의로 수백 명이 붙잡혀, 왕의 법정이 런던에서만 유대인 200여 명 이상을 처형했다(수치는 연대기 293명, 국고 기록 269명 등으로 갈리며 같은 혐의의 기독교인은 대개 벌금형을 받았다. 근거 없는 혐의로 죽은 이가 많다고 본다). 1289년 에드워드는 가스코뉴에서 유대인을 내쫓았고, 1290년 7월 18일 잉글랜드에서 유대인을 추방한다는 칙령을 내려 11월 1일까지 떠나게 했다. 재산은 대부분 두고 가야 했으며, 수천 명(추산 2천~3천 명)이 프랑스·플랑드르·독일 등으로 떠났다. 같은 해 의회가 에드워드에게 막대한 세금을 허락한 때와 겹쳐 연구자들은 둘의 관계를 두고 논의한다. 유대인의 잉글랜드 거주가 사실상 다시 허용된 때는 1656년 무렵이다."
  subjects: [england, france]
  tags: [society, politics]
  sources: ["Robin R. Mundill, England's Jewish Solution: Experiment and Expulsion, 1262–1290 (1998)", "Robert C. Stacey, 'Parliamentary Negotiation and the Expulsion of the Jews from England', Thirteenth Century England 6 (1997)", "Robert Chazan, Church, State, and Jew in the Middle Ages (1980)"]

- id: sicilian-vespers-1282
  year: 1282
  endYear: 1302
  title:
    ko: "시칠리아 만종 전쟁: 아라곤의 시칠리아 확보와 나폴리 왕국의 분리"
  summary:
    ko: "1282년 3월 30일 부활절 월요일 저녁 팔레르모에서 앙주의 샤를 1세의 프랑스인 관리와 군인에 맞선 봉기가 터졌다. 무거운 세금과 외국인 관리에 대한 분노가 쌓여 있었고, 며칠 사이 시칠리아섬 곳곳에 번졌다. 봉기를 일으킨 쪽이 프랑스인과 그 편이라 여긴 사람들을 죽였다(연대기가 수천 명이라 하나 숫자는 확실하지 않다). 메시나는 샤를의 포위를 견뎌 냈고, 봉기 세력은 교황의 보호를 청했다가 거절당하자 만프레디의 딸 콘스탄사와 혼인한 아라곤 왕 페드로 3세를 불렀다. 그는 튀니스 원정을 구실로 모아 둔 함대로 8월 30일 트라파니에 상륙해 9월 팔레르모에서 왕으로 추대되었다. 샤를은 포위를 풀고 본토로 물러났다. 교황 마르티누스 4세는 페드로를 파문하고 아라곤의 왕위를 프랑스 왕자 발루아의 샤를에게 준다고 선언해 '아라곤 십자군'을 일으켰다. 1284년 6월 5일 나폴리만 해전에서 제독 루지에로 디 라우리아가 샤를 1세의 아들 샤를(살레르노 공)을 사로잡았고, 샤를 1세는 1285년 1월 죽었다. 프랑스 왕 필리프 3세가 마요르카 왕이 열어 준 길로 카탈루냐에 쳐들어갔으나(1285) 해전에 지고 페르피냥에서 병으로 죽었으며, 페드로 3세도 11월에 죽었다. 이로써 왕국은 본토의 나폴리 왕국과 섬의 시칠리아 왕국으로 갈라졌다. 1295년 아나니 조약에서 하이메 2세가 섬을 교황에 돌려주기로 했으나 시칠리아인들은 그의 동생 프리드리히 3세를 왕으로 세웠고(1296) 전쟁이 이어지다가, 1302년 8월 칼타벨로타 화약으로 프리드리히가 평생 '트리나크리아의 왕'으로 인정받았다. 이 화약으로 일자리를 잃은 아라곤계 용병이 동로마로 건너간 일은 뒤의 사건이다."
  subjects: [sicily-kingdom, naples-kingdom, aragon, france, papal-states, byzantine-empire, majorca-kingdom]
  links:
    - { from: aragon, to: sicily-kingdom, note: "페드로 3세의 시칠리아 왕위(1282)" }
    - { from: france, to: aragon, note: "아라곤 십자군(1285): 필리프 3세의 카탈루냐 침공" }
  tags: [war, politics]
  sources: ["Steven Runciman, The Sicilian Vespers: A History of the Mediterranean World in the Later Thirteenth Century (1958)", "David Abulafia, The Western Mediterranean Kingdoms 1200–1500: The Struggle for Dominion (1997)", "Joseph F. O'Callaghan, A History of Medieval Spain (1975)"]
