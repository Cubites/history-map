    - { from: france, to: flanders, note: "부빈 전투(1214): 페랑 백작 포로" }
  tags: [war, politics]
  sources: ["John W. Baldwin, The Government of Philip Augustus: Foundations of French Royal Power in the Middle Ages (1986)", "W. L. Warren, King John (1961)", "Georges Duby, The Legend of Bouvines (1990)"]
