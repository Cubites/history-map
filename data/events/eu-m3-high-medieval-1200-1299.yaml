- id: marco-polo-1271
  year: 1271
  endYear: 1299
  title:
    ko: "마르코 폴로의 동방 여행과 『세계의 서술』"
  summary:
    ko: "베네치아 상인 니콜로와 마페오 폴로 형제는 1260년 무렵 동방으로 나가 쿠빌라이 칸을 만나고 1269년 돌아왔다. 1271년 이들은 니콜로의 아들 마르코(17세 안팎)와 함께 아크레를 떠나 킬리키아 아르메니아의 아야스에서 아나톨리아·이란·파미르를 거쳐 1275년 쿠빌라이의 여름 도읍 상도에 닿았다. 마르코는 원 조정에서 17년쯤 일했다고 하나 맡은 직책의 실제는 불확실하다. 1291년 이후 일 칸국으로 시집가는 공주 코코친을 호송하는 배편으로 돌아오는 길에 올라 이란과 트레비존드, 콘스탄티노폴리스를 거쳐 1295년 베네치아에 돌아왔다. 1298년 무렵 제노바의 포로가 된 그는(쿠르졸라 해전에서 잡혔다는 전승이 있다, `venice-genoa-1256`) 감옥에서 피사 출신 작가 루스티켈로에게 이야기를 구술했고, 이것이 『세계의 서술』(흔히 『동방견문록』)이다. 책에는 원이 남송을 멸한 일(1279), 쿠빌라이의 일본 원정 실패, 항저우(킨사이)의 번영, 지폐의 사용 같은 이야기가 실려 있다. 같은 시기 고려는 원의 부마국이 되어 일본 정벌에 군사와 배를 냈다(`japan-expeditions-1274`, `jeongdong-haengseong-1280`). 필사본마다 내용이 달라 원전 확정이 어렵고, 프랜시스 우드(1995)처럼 폴로의 중국 체류를 의심하는 연구도 있지만 대다수 학자는 그가 실제로 중국까지 갔다고 본다. 카르피니와 루브룩(앞의 사건)의 기록이 몽골에 대한 정보를 주었다면, 폴로의 책은 원 제국의 도시와 물산까지 서유럽에 알렸다."
  subjects: [venice, genoa, yuan, song, goryeo, japan, trebizond, cilician-armenia, byzantine-empire]
