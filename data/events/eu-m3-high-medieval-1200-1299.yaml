  sources: ["John Fennell, The Crisis of Medieval Russia, 1200–1304 (1983)", "Janet Martin, Medieval Russia, 980–1584 (2판, 2007)", "Eric Christiansen, The Northern Crusades (2판, 1997)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)"]
