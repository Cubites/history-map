- id: karakorum-embassies-1245
  year: 1245
  endYear: 1255
  title:
    ko: "카르피니와 루브룩의 카라코룸 사행, 그 기록 속의 '솔랑가'와 '카울레'"
  summary:
    ko: "몽골의 폴란드·헝가리 침공에 놀란 교황 인노첸시오 4세는 1245년 리옹 공의회를 열면서 몽골 대칸에게 사절을 보냈다. 프란치스코회 수사 조반니 다 피안 델 카르피네(플라노 카르피니)는 1245년 4월 16일 리옹을 떠나 바투의 궁정을 거쳐 1246년 7월 22일 카라코룸 근처에 닿았고, 8월 24일 귀위크 칸의 즉위식에 참석했다. 귀위크의 답서는 교황과 왕들이 직접 와서 복속하라고 요구했다. 카르피니는 1247년 돌아와 『몽골인의 역사』를 남겼다. 그는 즉위식에 모인 사절 가운데 '솔랑가(Solangi)'의 우두머리가 있었다고 적었다. 1249년 프랑스 왕 루이 9세가 키프로스에서 보낸 앙드레 드 롱쥐모는 귀위크의 미망인 오굴 카이미시의 궁정에서 공물을 요구받았다. 1253년 프란치스코회 수사 기욤 드 뤼브룩(루브룩)은 루이 9세가 써 준 소개 편지를 들고 5월 콘스탄티노폴리스를 떠나 12월 27일 몽케 칸의 천막에 닿았고, 1254년 5월 30일 카라코룸에서 불교·이슬람·네스토리우스 교도와 종교 토론을 벌였다. 그는 칸의 궁정에 '카울레(Caule)'와 '만세' 사람들의 사절이 온다고 적었고(편집자들은 고려와 남중국으로 본다), 티베트 다음에 '롱가와 솔랑가'가 있다고도 썼다. '카울레'를 고려로 보는 데는 의견이 모이지만, '솔랑가'가 고려인지 만주 일대의 집단인지는 학계의 논쟁이 남아 있다. 이때 고려는 강화도에 조정을 두고 몽골의 5차(1253, `chungju-1253`)·6차(1254~1259) 침입을 겪고 있었다. 아르메니아 왕 헤툼 1세도 1254년 몽케 칸을 직접 찾아가 보호를 약속받았다."
  subjects: [papal-states, france, mongol-empire, golden-horde, cilician-armenia, cyprus-kingdom, latin-empire, goryeo]
