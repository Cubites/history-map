- id: interregnum-1250
  year: 1250
  endYear: 1273
  title:
    ko: "슈타우펜의 몰락과 대공위 시대: 오타카르 2세의 보헤미아"
  summary:
    ko: "프리드리히 2세가 죽은(1250) 뒤 아들 콘라트 4세는 이탈리아로 내려갔다가 1254년 5월 21일 열병으로 죽었다. 독일에서는 교황이 밀던 대립왕 홀란트 백작 빌럼이 1256년 프리슬란트에서 전사할 때까지 왕으로 인정받았다. 1257년 선제후들이 둘로 갈려 콘월 백작 리처드(잉글랜드 왕 헨리 3세의 동생)와 카스티야 왕 알폰소 10세를 각각 왕으로 뽑았다. 리처드는 아헨에서 대관했으나 독일에 머문 날이 몇 해에 불과했고 알폰소는 가지 않았다. 군주 없는 이 시기를 흔히 대공위 시대라 부르며, 1254년 라인강 도시들이 평화 유지를 위한 동맹을 맺고 일곱 선제후가 왕을 뽑는 관행이 굳어졌다. 한편 보헤미아 왕 오타카르 2세(재위 1253~1278)는 바벤베르크 가문이 끊긴 오스트리아를 1251년 차지하고, 1260년 7월 12일 크레센브룬 전투에서 헝가리 벨러 4세를 꺾어 슈타이어마르크를 얻었으며(1261년 빈 조약), 1269년 케른텐과 크라인을 물려받아 아드리아해 가까이까지 닿는 대국이 되었다. 1254~1255년에는 튜턴 기사단의 프로이센 십자군에 참여해 쾨니히스베르크(왕의 산)라는 이름을 남겼다. 지도는 1251년 오스트리아를 보헤미아에, 1254년 슈타이어마르크를 헝가리에 두었다가 1261년 보헤미아로 옮긴다. 1273년 10월 1일 선제후들은 합스부르크 백작 루돌프를 왕으로 뽑았다(뒤의 사건)."
  subjects: [holy-roman-empire, bohemia-kingdom, hungary-kingdom, papal-states, castile, england, teutonic-order]
