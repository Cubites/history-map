# 유럽 중세 사건 3차 묶음: 제4차 십자군에서 스코틀랜드 계승 위기까지 (1202 ~ 1299, 작업 EVM3)
# 범위: 제4차 십자군과 라틴 제국·니케아·에피루스·트레비존드, 불가리아 제2제국, 동로마의 복귀(1261), 앙주의 시칠리아와 시칠리아 만종, 몽골의 서방 원정(루스·폴란드·헝가리)과 킵차크 칸국,
#   알렉산드르 넵스키, 카르피니·루브룩·마르코 폴로, 레콩키스타(라스 나바스 데 톨로사·코르도바·세비야·발렌시아·알가르브), 필리프 2세의 노르망디 회복과 부빈,
#   마그나 카르타와 시몽 드 몽포르, 알비 십자군, 루이 9세와 파리 조약(1259), 필리프 4세와 가스코뉴 전쟁, 프리드리히 2세와 교황, 대공위 시대와 합스부르크, 스위스 서약,
#   튜턴 기사단의 프로이센·리보니아, 리투아니아의 통일, 웨일스 정복, 스코틀랜드 계승 위기, 룸 술탄국과 몽골, 조지아, 세르비아, 갈리치아-볼히니아, 헝가리,
#   노르웨이와 아이슬란드, 스웨덴의 핀란드 진출, 안티오크·아크레 함락, 베네치아와 제노바, 겔프와 기벨린, 한자, 제4차 라테란 공의회, 탁발 수도회와 대학, 잉글랜드의 유대인 추방.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 1200~1299년 지도에서 생기거나 끝난 항목(보헤미아 왕국·킬리키아 아르메니아 1198, 갈리치아-볼히니아 1199, 라틴 제국·니케아·트레비존드·테살로니키 1204,
#   에피루스·아카이아·아테네 1205, 테라 마리아나 1207, 세르비아 왕국 1217, 알모하드·제3차 타이파·동아나톨리아 베이국들 1228, 튜턴 기사단국·카스티야 1230, 리투아니아 1236, 그라나다 1238,
#   볼가 불가리아·쿠만 1241, 킵차크 칸국 1242, 프로방스 1246, 트베리 1247, 핀우그르 부족 1248, 카라만 1250, 서조지아 1259, 아이슬란드 1262, 테살리아·안티오크 1268, 툴루즈 1271, 마요르카 1276,
#   밀라노·아나톨리아 베이국들 1277, 안도라 1278, 송 1279, 오스트리아·나폴리 1282, 모스크바·웨일스 1283, 샹파뉴 1285, 발트 부족 1289, 스위스 1291, 잔다르 1292, 모나코 1297, 오스만 1299)를
#   모두 subjects로 이음(docs/REGION_GUIDE.md §5, 점검 방식은 EVD2·EVM1·EVM2의 성립·소멸 점검과 같음). 지도의 큰 변화(1만 km² 넘는 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 몽골의 고려 침입(1231~1259)과 같은 시기의 서방 원정(몽골의 루스 원정 사건에서 고려를 subjects로), 카르피니·루브룩의 몽골 여행과 그 기록의 '솔랑가'·'카울레'
#   (고려를 subjects로), 마르코 폴로와 원·고려·일본(subjects), 쾨세다으·조지아에서 몽골 제국의 확장을 이었다. 04번 고려 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 6~10일 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(한국어 번역본이 확인된 것만 번역본으로). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: fourth-crusade-1202
  year: 1202
  endYear: 1204
  title:
    ko: "제4차 십자군과 콘스탄티노폴리스 약탈"
  summary:
    ko: "1198년 교황 인노첸시오 3세가 새 십자군을 호소했고, 이집트를 치기로 한 십자군은 1201년 베네치아와 배삯 8만 5천 마르크를 주기로 계약했다. 그러나 모인 병력은 계약한 수에 크게 못 미쳐 약 3만 4천 마르크가 모자랐다. 도제 엔리코 단돌로는 빚 상환을 미뤄 주는 대신 십자군이 헝가리 왕의 보호 아래 있던 기독교 도시 자라(자다르)를 베네치아를 위해 치도록 했고, 십자군은 1202년 11월 자라를 함락했다(교황은 이를 파문으로 꾸짖었다). 이때 폐위된 동로마 황제 이사키오스 2세의 아들 알렉시오스 앙겔로스가 나타나, 아버지를 복위시켜 주면 거액의 군자금과 교회 합동, 군사 지원을 약속했다. 1203년 6월 함대가 콘스탄티노폴리스에 이르러 알렉시오스 3세를 쫓아내고 이사키오스 2세와 알렉시오스 4세를 공동 황제로 세웠으나, 약속한 돈을 댈 수 없었고 1204년 1월 민중의 반란 끝에 알렉시오스 5세가 알렉시오스 4세를 죽이고 제위를 차지했다. 십자군은 3월에 제국을 나눌 조약을 맺은 뒤, 4월 12일 두 번째 공격으로 도시에 들어갔다. 십자군 군사들은 사흘 동안 교회와 수도원, 시민의 집을 약탈하고 살상했다. 목격자인 동로마 관리 니케타스 코니아테스가 이를 기록했고, 성유물과 예술품이 서유럽과 베네치아로 흩어졌다(산마르코 대성당의 청동 말이 대표적이다). 교황은 약탈을 꾸짖으면서도 결과를 받아들였다. 5월 플랑드르 백작 보두앵이 라틴 제국의 황제로 즉위했고, 그리스인들은 니케아·에피루스·트레비존드로 갈라져 나라를 이었다(뒤의 사건)."
  subjects: [venice, byzantine-empire, papal-states, hungary-kingdom, france, flanders, champagne, holy-roman-empire, latin-empire, thessalonica-kingdom]
  links:
    - { from: venice, to: byzantine-empire, note: "자라 함락(1202)과 콘스탄티노폴리스 공격·약탈(1203~1204)" }
  tags: [war, politics]
  sources: ["Donald E. Queller·Thomas F. Madden, The Fourth Crusade: The Conquest of Constantinople, 1201–1204 (2판, 1997)", "Jonathan Phillips, The Fourth Crusade and the Sack of Constantinople (2004)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)", "로저 크롤리, 『부의 도시, 베네치아』(우태영 옮김, 다른세상, 2012)"]
