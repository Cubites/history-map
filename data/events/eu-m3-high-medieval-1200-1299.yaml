- id: mendicants-aquinas-1209
  year: 1209
  endYear: 1274
  title:
    ko: "탁발 수도회와 대학, 토마스 아퀴나스"
  summary:
    ko: "1209년 무렵 아시시의 프란체스코(1181/82~1226)는 청빈을 따르는 형제들의 규칙을 교황 인노첸시오 3세에게 구두로 승인받았고(1223년 호노리우스 3세가 확정했다), 1216년에는 도미니쿠스(1170 무렵~1221)의 설교자 수도회가 호노리우스 3세의 승인을 받았다. 이 탁발 수도회는 도시의 거리에서 설교하며 구걸로 살았고 이단 문제와 교육에 힘써 대학에도 들어갔다. 대학은 12~13세기에 교사와 학생의 조합으로 자랐다(볼로냐는 법학, 파리는 신학과 철학이 중심이었고, 옥스퍼드의 교사와 학생이 1209년 갈려 나와 케임브리지를 세웠으며, 1218년 레온 왕 알폰소 9세가 살라망카를, 1224년 프리드리히 2세가 나폴리를 세웠다). 도미니코회의 알베르투스 마그누스(1200 무렵~1280)와 그의 제자 토마스 아퀴나스(1225 무렵~1274)는 아랍어와 그리스어에서 옮겨진 아리스토텔레스의 저작을 기독교 신학과 맞추려 했다. 아퀴나스는 시칠리아 왕국의 로카세카에서 태어나 1244년 도미니코회에 들어갔고 파리와 쾰른에서 배운 뒤 1256년 파리 대학의 교수가 되었다. 『대이교도대전』(1259~1265 무렵)과 『신학대전』(1265/66~1273)을 썼고, 1273년 12월 신비 체험 뒤 집필을 멈춘 채 1274년 3월 7일 제2차 리옹 공의회에 가는 길에 포사노바 수도원에서 죽었다. 프란치스코회의 보나벤투라도 같은 해 리옹에서 죽었다. 1277년 파리 주교 탕피에는 아리스토텔레스주의 명제 219개를 단죄했는데 아퀴나스의 일부 견해와 겹치는 것도 있었다. 아퀴나스는 1323년 성인으로 선포되었다."
  subjects: [papal-states, france, england, sicily-kingdom, holy-roman-empire, castile, italian-minor-states]
  tags: [culture]
  sources: ["C. H. Lawrence, The Friars: The Impact of the Early Mendicant Movement on Western Society (1994)", "Jean-Pierre Torrell, Saint Thomas Aquinas, 1권: The Person and His Work (개정판, 2005)", "Hastings Rashdall, The Universities of Europe in the Middle Ages (개정판, 1936)"]

- id: las-navas-1212
  year: 1212
  endYear: 1228
  title:
    ko: "라스 나바스 데 톨로사 전투와 알모하드의 몰락"
  summary:
    ko: "1211년 알모하드의 칼리파 무함마드 안나시르가 카스티야의 살바티에라 성을 빼앗자 교황 인노첸시오 3세가 십자군을 선포했다. 카스티야 왕 알폰소 8세, 아라곤 왕 페드로 2세, 나바라 왕 산초 7세가 손잡았고 포르투갈과 레온에서 온 의용군이 합류했다(레온 왕은 불참했다). 피레네 너머의 기사들도 모였으나 대부분 돌아갔다. 1212년 7월 16일 시에라 모레나 기슭의 라스 나바스 데 톨로사(오늘의 하엔 주 산타엘레나 일대)에서 연합군이 알모하드군을 크게 무찔렀다. 한 목동이 샛길을 알려 주었다는 이야기는 전설에 가깝고, 연대기가 적은 무슬림 쪽 사망자 수(10만 명대)도 과장이 심해 믿기 어렵다. 이 승리로 알모하드는 안달루스를 지킬 힘을 잃었다. 안나시르는 1213년 죽고 어린 유수프 2세가 이었으며, 알폰소 8세는 1214년 죽었고, 페드로 2세는 1213년 무레 전투에서 죽었다(앞의 사건). 1220년대 알모하드 안에서 칼리파 자리를 둘러싼 다툼이 이어지는 동안 이븐 후드가 1228년 무르시아에서 독립하는 등 이베리아의 무슬림 땅은 여러 소국(제3차 타이파)으로 갈라졌다. 칼리파 이드리스 알마문은 1229년 아프리카로 떠났다. 지도는 1228년 알모하드의 이베리아 땅을 지우고 제3차 타이파 묶음을 둔다."
  subjects: [castile-early, leon, aragon, navarre, portugal, almohads, taifas-third, papal-states]
  links:
