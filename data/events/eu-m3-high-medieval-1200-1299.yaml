- id: magna-carta-montfort-1215
  year: 1215
  endYear: 1265
  title:
    ko: "마그나 카르타에서 시몽 드 몽포르까지: 잉글랜드 왕권과 귀족의 다툼"
  summary:
    ko: "존 왕은 1204년 이후 대륙 영지를 되찾으려 무거운 세금을 거두었고, 캔터베리 대주교 임명 문제로 교황과도 다투다 1213년 교황의 봉신이 되겠다며 굴복했다. 부빈의 패배(앞의 사건) 뒤 북부 귀족들이 반란을 일으켜 1215년 6월 15일 러니미드에서 '마그나 카르타'(대헌장, 63개 조항)를 받아 냈다. 법에 따르지 않고는 자유인을 잡거나 재산을 빼앗지 못한다는 조항(39조)이 후대에 널리 인용되었으나 당시에는 귀족과 교회의 권리가 중심이었고, 유대인 채무를 다룬 조항(10~11조)도 있었다. 교황 인노첸시오 3세가 8월 24일 이를 무효로 선언하자 내전(제1차 바론 전쟁)이 일어났다. 귀족들은 프랑스 왕자 루이(훗날 루이 8세)를 불러 1216년 런던을 차지했으나, 존이 10월에 죽고 아홉 살의 헨리 3세 아래 윌리엄 마셜이 대헌장을 고쳐 다시 반포하자 많은 귀족이 돌아섰고 1217년 5월 링컨 전투와 8월 샌드위치 해전으로 루이 쪽이 졌다. 1225년 재반포본이 이후 확정판이 되었다. 친정을 시작한 헨리 3세는 프랑스 출신 측근과 시칠리아 왕위 계획(1254)으로 빚을 지자 1258년 '옥스퍼드 조항'으로 귀족 위원회에 권력을 나누었다. 헨리가 이를 깨자 레스터 백작 시몽 드 몽포르가 이끈 귀족들이 일어나 1264년 5월 14일 루이스에서 헨리와 왕자 에드워드를 사로잡았다. 이 무렵 몽포르 편 군중이 런던 유대인 거리를 습격해 많은 유대인이 죽었다(숫자는 불확실하다. 몽포르는 이미 1231년 레스터에서 유대인을 내쫓은 적이 있다). 1265년 1월 몽포르는 기사와 도시 대표를 부른 의회를 열었으나, 탈출한 에드워드가 8월 4일 이브셤에서 그를 죽였다."
  subjects: [england, france, papal-states]
  links:
    - { from: papal-states, to: england, note: "대헌장 무효 선언(1215)" }
    - { from: france, to: england, note: "루이 왕자의 잉글랜드 상륙(1216)" }
  tags: [politics, war]
  sources: ["J. C. Holt, Magna Carta (3판, 2015)", "David Carpenter, The Reign of Henry III (1996)", "J. R. Maddicott, Simon de Montfort (1994)"]
