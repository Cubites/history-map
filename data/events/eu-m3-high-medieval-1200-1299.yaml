- id: alfonso-x-1252
  year: 1252
  endYear: 1284
  title:
    ko: "알폰소 10세: 학문의 후원자, 신성 로마 제국 왕위 도전과 무데하르 반란, 계승 위기"
  summary:
    ko: "알폰소 10세(재위 1252~1284)는 톨레도에서 기독교인·유대인·무슬림 학자들에게 아랍어와 히브리어 저작을 카스티야어로 옮기게 했고, 법전 『일곱 부분 법전』(1256년에 시작)과 천문표(1252~1272 무렵), 시가집 『성모 찬가집』, 『일반 역사』를 편찬하게 했다. 정치에서는 1257년 일부 선제후가 그를 로마인의 왕으로 뽑아 콘월 백작 리처드와 이중 선출이 되었으나 독일에 가지 않았고 1275년 교황 그레고리우스 10세의 압박으로 포기했다(앞의 사건). 남쪽에서는 1262년 니에블라와 카디스를 차지했으나, 1264년 무르시아와 안달루스의 무데하르가 반란을 일으켰고 그라나다의 무함마드 1세도 가담했다. 알폰소는 장인 아라곤 왕 하이메 1세의 도움으로 반란을 누르고 1266년 무르시아를 병합했고, 지도의 제3차 타이파 묶음은 이 해에 끝난다(그라나다는 카스티야의 속국으로 남았다). 알가르브는 포르투갈의 아폰수 3세와 다투다 1267년 바다호스 조약으로 과디아나강을 경계로 하는 데 합의했다. 1275년 북아프리카 마린 왕조의 침공에 맞서러 남쪽으로 가던 왕위 계승자 페르난도 데 라 세르다가 비야레알(오늘의 시우다드레알)에서 갑자기 죽자(날짜는 6월·7월·11월 설이 갈린다) 그의 아들과 동생 산초 사이의 계승 문제가 커졌고, 1282년 둘째 아들 산초가 반기를 들었다. 알폰소는 그를 폐적하는 유언을 남기고 1284년 세비야에서 죽었다."
