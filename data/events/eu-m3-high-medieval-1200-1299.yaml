- id: rum-sultanate-1204
  year: 1202
  endYear: 1277
  title:
    ko: "룸 술탄국의 전성과 몽골의 종주권: 쾨세다으(1243)에서 카라만(1277)까지"
  summary:
    ko: "룸 술탄국(코니아를 도읍으로 한 셀주크 왕조)은 13세기 초 소아시아의 중심이었다. 카이호스로 1세(재위 1192~1196, 1205~1211)는 1211년 니케아의 테오도로스 1세 라스카리스와 싸우다 죽었으나, 카이카우스 1세(재위 1211~1220)는 1214년 흑해 항구 시노페를 얻고 트레비존드 황제를 신하로 삼았다. 카이쿠바드 1세(재위 1220~1237)는 지중해 항구 알라냐(1221)를 얻고, 1228년 에르진잔 일대의 멩구예크 가문을 신하로 삼는 등 동아나톨리아의 베이국들을 거두었으며, 1230년 8월 야시차멘에서 호라즘의 잘랄 앗딘을 물리쳤다. 이 시기 코니아에는 몽골을 피한 학자와 신비가가 모였고, 페르시아어 시인 잘랄 앗딘 루미(1273 죽음)도 1228년 무렵 정착했다. 그러나 1240년 투르크멘의 바바이 반란으로 약해진 카이호스로 2세(재위 1237~1246)는 1243년 6월 26일 쾨세다으(동아나톨리아의 산악 고갯길로 정확한 위치는 불확실하다)에서 몽골 장군 바이주에게 크게 졌다. 조지아와 아르메니아 귀족의 군사는 몽골 편에서 싸웠고, 킬리키아 아르메니아의 헤툼 1세는 룸에 군사를 약속했으나 늦어 싸움에 나서지 않은 채 1244년 몽골에 신종했다. 트레비존드 황제도 뒤에 몽골에 신종했다. 술탄국은 몽골에 공물을 바치는 속국이 되어 술탄 형제들이 몽골의 승인으로 번갈아 왕위에 앉았다. 1250년 무렵 남쪽에서 카라만 가문이 일어났고, 1277년 이집트의 맘루크 술탄 바이바르스가 4월 15일 엘비스탄에서 몽골·룸 군을 물리쳤다. 이 틈에 카라만의 메흐메트 베이가 코니아를 차지하고 투르크어를 공식 언어로 삼았다고 전한다. 몽골이 곧 코니아를 되찾았으나 술탄국은 이름만 남았고 아나톨리아 베이국들이 갈라졌다. 지도는 1243년에 동쪽 땅을, 1277년에 서쪽 땅을 룸 술탄국에서 덜어 내 그린다."
  subjects: [rum-sultanate, eastern-anatolian-beyliks, mongol-empire, georgia-kingdom, trebizond, cilician-armenia, nicaea, karaman-beylik, anatolian-beyliks]
  links:
    - { from: mongol-empire, to: rum-sultanate, note: "쾨세다으 전투(1243): 몽골 종주권" }
    - { from: rum-sultanate, to: trebizond, note: "시노페 점령과 트레비존드 황제의 신종(1214)" }
  tags: [war, politics]
  sources: ["Claude Cahen, Pre-Ottoman Turkey: A General Survey of the Material and Spiritual Culture and History c. 1071–1330 (1968)", "Peter Jackson, The Mongols and the West, 1221–1410 (2005)", "Rustam Shukurov, The Byzantine Turks of Pontos (2016)"]
  places: [{ name: "시노페", at: [35.15, 42.03], year: 1214 }, { name: "쾨세다으(동아나톨리아 산악 지대, 정확한 위치는 불확실)", at: [39.59, 40.28], year: 1243 }]

- id: philip-augustus-1204
  year: 1202
  endYear: 1214
  title:
    ko: "필리프 2세의 노르망디 회복과 부빈 전투"
  summary:
    ko: "잉글랜드 왕 존은 1199년 형 리처드 1세의 뒤를 이었고, 노르망디·앙주·멘·투렌·푸아투·아키텐을 프랑스 왕의 봉신으로서 가지고 있었다. 1200년 뤼지냥 가문과의 분쟁(존이 앙굴렘의 이사벨을 가로챈 일) 끝에 필리프 2세가 1202년 존의 프랑스 영지를 몰수한다고 선언했다. 같은 해 조카 브르타뉴 공 아서가 미라보에서 존에게 사로잡혀 1203년 행방불명이 되자(살해되었다는 소문이 돌았다) 앙주와 브르타뉴의 귀족들이 돌아섰다. 필리프의 군대는 1203년 8월부터 에워싼 샤토 가이야르(리처드 1세가 지은 성)를 1204년 3월 6일 함락하고 6월 24일 루앙을 얻어 노르망디를 차지했다. 앙주·멘·투렌과 푸아투 북부도 넘어갔고, 존의 어머니 엘레오노르는 4월 1일 죽었다. 존은 아키텐 남부와 가스코뉴만 지켰다. 존은 이를 되찾으려 조카인 신성 로마 황제 오토 4세, 플랑드르 백작 페랑, 불로뉴 백작 등과 동맹을 맺었다. 1214년 7월 2일 라 로슈오모안에서 필리프의 아들 루이가 존을 물리쳤고, 7월 27일 부빈에서 필리프가 오토 4세와 페랑이 이끈 연합군을 무찔렀다(양쪽 모두 수천 명에서 1만 명 남짓이라고 추산한다). 오토 4세는 힘을 잃어 프리드리히 2세가 독일을 장악했고, 존은 귀족의 불만 속에서 이듬해 마그나 카르타를 받아들이게 된다(뒤의 사건). 지도는 1204년에 노르망디·앙주·멘·투렌 등을 잉글랜드 왕에게서 프랑스 왕의 땅으로 옮긴다."
  subjects: [france, england, flanders, brittany, champagne, holy-roman-empire]
  links:
