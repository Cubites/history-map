- id: galicia-volhynia-1205
  year: 1205
  endYear: 1264
  title:
    ko: "갈리치아-볼히니아: 로만의 죽음에서 다닐로의 대관(1253)까지"
  summary:
    ko: "1199년 로만 므스티슬라비치가 갈리치아와 볼히니아를 합쳐 키예프 루스 서쪽의 큰 공국을 이뤘으나, 1205년 6월 19일 폴란드 자비호스트에서 전사하자 어린 두 아들 다닐로(4세)와 바실코만 남았다. 헝가리 왕 언드라시 2세와 폴란드의 레셰크가 땅을 노렸고, 1214년 스피슈 협정으로 헝가리 왕자 콜로만이 갈리치아의 왕으로 나섰다(1215 대관). 지도는 1214년부터 1221년까지 갈리치아의 일부를 헝가리 왕국에 둔다. 1219년 므스티슬라프 므스티슬라비치가 콜로만을 쫓아냈고, 그는 1223년 5월 31일 칼카강에서 루스·쿠만 연합군과 함께 수부타이의 몽골군에 패했다. 다닐로는 1229년 볼히니아, 1238년 갈리치아를 되찾았으나 1240~1241년 몽골의 침공으로 볼로디미르와 할리치가 크게 부서졌다. 1245년 8월 야로슬라우 전투에서 헝가리·폴란드와 손잡은 경쟁자 로스티슬라프를 물리쳐 갈리치아를 지켰고, 같은 해 무렵 바투를 찾아가 신종했다. 1253년 도로히친에서 교황 사절이 다닐로에게 왕관을 씌웠는데(몽골에 맞서는 십자군을 기대했으나 서방의 도움은 오지 않아 관계가 식었다), 1256년 무렵 아들 레프의 이름을 딴 리비우를 세웠다. 1259년 몽골 장군 부룬다이가 다닐로에게 요새를 헐라고 강요했다. 다닐로가 1264년 죽은 뒤에도 공국은 14세기 중반(1349)까지 이어졌다."
  subjects: [galicia-volhynia, hungary-kingdom, polish-duchies, lithuania-grand-duchy, rus-principalities, golden-horde, mongol-empire, papal-states, cuman-tribes]
  links:
