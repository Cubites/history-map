- id: scotland-succession-1286
  year: 1286
  endYear: 1298
  title:
    ko: "스코틀랜드 계승 위기: 알렉산더 3세의 죽음에서 스털링 브리지와 포커크까지"
  summary:
    ko: "1286년 3월 19일 알렉산더 3세가 킹혼 근처에서 말에서 떨어져 죽자 후계자는 노르웨이 왕 에이리크 2세의 어린 딸 '노르웨이의 처녀' 마거릿(알렉산더 3세의 손녀)뿐이었다. 1290년 7월 버햄 조약으로 에드워드 1세의 아들과 혼인하되 스코틀랜드의 독립을 지킨다는 약속이 있었으나, 마거릿이 그해 가을 오크니에서 죽자 왕위를 노리는 이들이 나섰다('대심판'). 스코틀랜드의 수호자들이 에드워드 1세를 심판관으로 청하자 그는 1291년 5월 노럼에서 종주권을 인정하라고 요구했다. 1292년 11월 17일 존 베일리얼이 뽑혀 30일 스콘에서 대관했다. 에드워드가 항소를 받고 1294년 프랑스 전쟁에 군사를 내라고 요구하자, 1295년 스코틀랜드의 귀족 위원회가 10월 23일 프랑스와 동맹을 맺었다. 이에 에드워드는 1296년 3월 30일 베릭을 쳤고, 그의 군대가 주민을 학살했다(연대기가 수천에서 1만 명이 넘는 사망자를 적지만 과장으로 본다). 4월 27일 던바에서 스코틀랜드군을 꺾고 7월 베일리얼을 퇴위시켰으며, 스콘의 돌이 웨스트민스터로 옮겨졌다. 잉글랜드의 직접 지배가 시작되자 1297년 9월 11일 윌리엄 월러스와 앤드루 머리가 스털링 브리지에서 잉글랜드군을 물리쳤다(머리는 그해 부상으로 죽었다). 월러스는 1298년 7월 22일 포커크에서 에드워드에게 졌다. 독립 전쟁은 1303년 이후로 이어진다(뒤의 사건)."
