- id: hanse-lubeck-1241
  year: 1241
  endYear: 1299
  title:
    ko: "한자의 시작: 뤼베크와 함부르크의 약속(1241)에서 상관 무역으로"
  summary:
    ko: "한자는 13세기 북독일 상인들의 연합에서 비롯했다. 뤼베크는 1226년 프리드리히 2세에게 제국 자유 도시의 지위를 얻었고, 1241년 뤼베크와 함부르크가 육로와 바닷길에서 서로 안전을 지켜 주기로 약속했다. 이름이 된 '한자(Hansa, 무리)'는 이미 12세기 쾰른 상인들이 런던에서 쓰고 있었고, 1267년 잉글랜드 왕 헨리 3세가 함부르크와 뤼베크 상인에게도 특권장을 내리면서 독일 상인들의 모임으로 모였다. 상인들은 고틀란드(스웨덴 왕국의 섬)의 비스비를 중계지로 발트해(모피·밀랍·곡물·청어)와 북해(플랑드르 모직물·소금) 무역을 이었고, 노브고로드의 '페터호프', 브뤼허, 런던의 '스틸야드'에 상관을 두었다. 1284~1285년 뤼베크와 벤트 도시들은 노르웨이 왕 에이리크 2세를 무역 봉쇄로 압박해 베르겐에서의 특권을 얻었다고 전한다. 다만 13세기의 한자는 이후와 달리 느슨한 도시와 상인의 연합이었고, '한자 동맹'이라는 이름의 조직이 뚜렷해지는 때는 14세기 이후로 본다. 덴마크 왕 발데마르 2세가 1227년 보른회베드에서 패한 일(앞의 사건)은 북독일 도시가 덴마크의 지배에서 벗어나 발트해 무역을 장악할 바탕이 되었다. 리가와 레발(탈린) 같은 리보니아의 도시도 13세기 말 한자 상인의 중계지로 자랐다."
  subjects: [holy-roman-empire, denmark-medieval, norway-medieval, sweden-medieval, novgorod-republic, flanders, england, teutonic-order, terra-mariana]
