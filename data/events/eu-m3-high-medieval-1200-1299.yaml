- id: nevsky-1240
  year: 1240
  endYear: 1263
  title:
    ko: "알렉산드르 넵스키: 네바 전투와 추드호 얼음 전투, 몽골에 대한 복종"
  summary:
    ko: "노브고로드 공 알렉산드르 야로슬라비치(1221년 출생)는 1240년 7월 15일 네바강 어귀에서 스웨덴군을 물리쳤고, 이 승리로 '넵스키'(네바의)라 불린다. 스웨덴 쪽 사료에는 이 싸움이 보이지 않아 규모와 상대 지휘관은 알기 어렵다. 그는 노브고로드 귀족과 불화해 떠났다가, 1240년 리보니아 기사단과 도르파트(타르투) 주교가 프스코프를 차지하자 1241년 돌아와 코포리예를, 이어 프스코프를 되찾았다(프스코프 수복은 1241년설과 1242년 초 겨울 원정설이 갈린다). 1242년 4월 5일 얼어붙은 페이푸스호(추드호)에서 도르파트 주교의 군대와 리보니아 기사단이 그에게 패했다('얼음 전투'). 리보니아 운문 연대기는 기사 20명이 죽고 6명이 사로잡혔다고 적고 노브고로드 연대기는 독일군 400명이 죽고 50명이 포로가 되었다고 적어 숫자가 맞지 않는다. 얼음이 깨져 기사들이 빠졌다는 이야기는 사료에 없는 후대의 이야기다. 알렉산드르는 서쪽의 가톨릭 이웃과 싸웠지만 동쪽의 몽골에게는 순종하는 길을 택했다. 1247~1249년 사라이와 카라코룸을 다녀왔고, 동생 안드레이가 몽골에 맞서다 1252년 쫓겨나자 칸의 허락장으로 블라디미르 대공이 되었다. 1259년 호구 조사에 반발한 노브고로드를 설득해 공납을 받아들이게 했고, 1263년 11월 14일 사라이에서 돌아오는 길에 고로데츠에서 죽었다. 러시아 교회는 1547년 그를 성인으로 올렸다."
  subjects: [novgorod-republic, sweden-medieval, teutonic-order, terra-mariana, golden-horde, rus-principalities, mongol-empire]
  links:
