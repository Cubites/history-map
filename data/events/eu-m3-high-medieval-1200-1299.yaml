- id: philip-iv-1285
  year: 1285
  endYear: 1299
  title:
    ko: "필리프 4세의 즉위와 가스코뉴 전쟁: 샹파뉴·나바라와 플랑드르"
  summary:
    ko: "1285년 10월 필리프 3세가 아라곤 십자군 도중 페르피냥에서 죽자(앞의 사건) 열일곱 살의 필리프 4세가 왕이 되었다. 그는 1284년 나바라 여왕이자 샹파뉴 여백작인 후아나 1세와 혼인해 샹파뉴를 아내의 이름으로 다스리게 되었고 나바라 왕위도 겸했다(후아나는 1305년까지 백작 자리에 있었다). 지도는 1285년부터 샹파뉴를 프랑스 땅으로 그린다. 필리프는 법률가들을 중용해 왕권을 키웠다. 1293년 노르망디 선원과 바욘 선원의 충돌을 구실로 아키텐 공으로서 프랑스 왕의 신하였던 잉글랜드 왕 에드워드 1세를 파리 법정에 소환했고, 에드워드가 응하지 않자 1294년 5월 가스코뉴를 몰수한다고 선언해 전쟁이 시작되었다. 에드워드는 독일 왕 아돌프와 플랑드르 백작 기 드 담피에르 등과 동맹했고, 필리프는 1295년 10월 스코틀랜드와 동맹을 맺었다(훗날의 올드 얼라이언스). 1297년 플랑드르가 잉글랜드 편에 서자 프랑스군이 쳐들어가 8월 퓌르네(오늘의 벨기에 뵈르너)에서 이겼고, 휴전이 이어졌다. 1299년 몽트뢰유 조약으로 에드워드가 필리프의 이복누이 마거릿과 혼인하고 가스코뉴를 돌려받기로 했으나 실행은 1303년 파리 조약에서 이루어졌다(뒤의 사건). 플랑드르 문제는 1302년 코르트레이크(프랑스어 쿠르트레) 전투로 번진다. 지도는 1294년부터 가스코뉴를 프랑스 땅으로 그리고 1303년에 되돌린다."
