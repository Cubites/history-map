- id: lateran-iv-1215
  year: 1215
  title:
    ko: "제4차 라테란 공의회: 화체설, 연 1회 고해, 유대인·무슬림의 구별 복장"
  summary:
    ko: "1215년 11월 11일부터 30일까지 로마의 라테란에서 교황 인노첸시오 3세가 소집한 공의회에는 총대주교·대주교 70여 명, 주교 400여 명, 수도원장 수백 명이 모였다. 공의회는 71개 교령을 냈다. 교령 1은 성체 안에 그리스도가 실제로 계신다는 '화체설'을 신조로 정했고, 교령 21은 신자가 해마다 한 번 고해하고 부활절에 영성체하도록 했다. 교령 3은 이단을 다루는 방식을 정했다. 공의회는 또 알비 십자군(앞의 사건)에서 이단을 비호했다는 이유로 툴루즈 백작 레몽 6세의 땅을 시몽 드 몽포르에게 인정했다. 교령 13은 새 수도회 설립을 막으려 했으나, 곧 프란치스코회와 도미니코회가 인가되면서 사실상 비껴갔다(앞의 사건). 교령 67~70은 유대인에 관한 것으로, 유대인의 이자를 제한하고, 유대인과 무슬림이 옷으로 기독교인과 구별되게 하며(68조), 유대인이 공직을 맡거나 성주간에 거리에 나오는 것을 금지했다. 이 구별 복장은 나라마다 시행 시기와 모양이 달랐다(잉글랜드는 1218년 두 개의 하얀 판, 프랑스는 1269년 노란 바퀴 모양). 교령 71은 새 십자군(제5차)을 호소했고, 공의회는 프리드리히 2세를 독일 왕으로 승인했다. 이 결정들은 중세 후기 교회와 유대인·무슬림 소수자의 관계에 오래 영향을 끼쳤다."
  subjects: [papal-states, england, france, county-of-toulouse, holy-roman-empire]
  links:
    - { from: papal-states, to: county-of-toulouse, note: "레몽 6세의 땅을 몽포르에게 인정(1215)" }
  tags: [politics, society]
  sources: ["Norman P. Tanner 편, Decrees of the Ecumenical Councils, 1권 (1990)", "Robert Chazan, Church, State, and Jew in the Middle Ages (1980)", "Brenda Bolton, Innocent III: Studies on Papal Authority and Pastoral Care (1995)"]

- id: serbia-nemanjic-1217
  year: 1217
  endYear: 1299
  title:
    ko: "세르비아 왕국의 성립: 스테판 1세의 대관과 사바의 교회, 밀루틴의 남진"
  summary:
    ko: "스테판 네마니치(대주파 재위 1196~1217, 왕 재위 1217~1228)는 1217년 교황 호노리우스 3세가 보낸 왕관으로 왕이 되어 '최초로 왕관을 쓴 이'로 불린다. 아들 스테판 라도슬라프가 에피루스의 테오도로스의 사위가 되는 등 그의 후계자들은 가까운 그리스 군주들과 혼인으로 얽혔다. 아토스산에서 수도사로 지낸 동생 사바(라스트코)는 1219년 니케아에서 총대주교에게 세르비아 교회의 자치 대주교로 서임되어 지차 수도원에 자리 잡았다. 이로써 세르비아는 로마와 콘스탄티노폴리스 사이에서 교회의 독립을 얻었다. 지차에서 정교회식으로 다시 대관한 연도는 1219년 또는 1220년으로 학자마다 다르다. 우로시 1세(재위 1243~1276)는 헝가리와 독일 쪽에서 온 광부(작센인)를 들여 은 광산을 열고 상업 도시를 키웠다. 그의 아들 드라구틴은 헝가리 왕 이슈트반 5세의 사위로서 헝가리의 도움으로 1276년 아버지를 몰아내고 왕이 되었으나 1282년 말에서 떨어져 다친 뒤 동생 밀루틴에게 왕위를 넘기고 헝가리가 준 북쪽 땅(스렘과 베오그라드 일대, 1284)을 맡았다. 밀루틴(재위 1282~1321)은 1282년 동로마의 스코페(위스퀴프)를 차지한 뒤 마케도니아 북부로 땅을 넓혔고, 1299년 안드로니코스 2세와 평화를 맺으면서 어린 시모니스 공주와 혼인해 얻은 땅을 인정받았다. 지도는 1282년부터 세르비아 왕국을 남쪽으로, 1284년부터 북쪽으로 넓혀 그린다."
  subjects: [serbia-medieval, serbia-grand-principality, byzantine-empire, nicaea, bulgaria-second, hungary-kingdom, epirus-despotate]
  links:
    - { from: nicaea, to: serbia-medieval, note: "사바의 자치 대주교 서임(1219)" }
    - { from: serbia-medieval, to: byzantine-empire, note: "스코페 점령(1282)과 1299년 평화·혼인" }
  tags: [politics, war]
  sources: ["John V. A. Fine Jr., The Late Medieval Balkans: A Critical Survey from the Late Twelfth Century to the Ottoman Conquest (1987)", "마크 마조워, 『발칸의 역사』(이순호 옮김, 을유문화사, 2014)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)"]

- id: ivan-asen-1230
  year: 1218
  endYear: 1246
  title:
    ko: "이반 아센 2세와 클로코트니차: 불가리아 제2제국의 전성"
  summary:
    ko: "칼로얀(재위 1197~1207)과 보릴(재위 1207~1218)의 뒤를 이어, 보릴을 몰아낸 이반 아센 2세(재위 1218~1241)가 터르노보에서 불가리아를 이끌었다. 그는 에피루스의 테오도로스가 라틴 제국의 콘스탄티노폴리스를 노리고 북쪽으로 올라오자, 1230년 3월 9일 클로코트니차(하스코보 지방)에서 그를 물리치고 사로잡았다. 이반 아센은 터르노보의 '40인 순교자 교회' 기둥에 이 승리를 새겼는데, 비문은 그가 아드리아노폴리스에서 두러스(디라키온)까지 그리스와 알바니아, 세르비아 땅을 차지했고 라틴인에게는 콘스탄티노폴리스 주변 도시만 남았다고 자랑한다(과장이 섞인 선전이다). 트라키아·마케도니아의 상당 부분과 알바니아 쪽이 불가리아 아래 놓였고, 에피루스는 크게 줄었다. 세르비아 왕 스테판 블라디슬라프가 그의 딸 벨로슬라바와 혼인했을 만큼 이웃 나라에 영향력이 컸다. 이반 아센은 1235년 니케아의 요한 3세 바타치스와 손잡고 라틴 제국을 압박하며 불가리아 총대주교구를 회복했고(1235), 두 군대가 1235~1236년 콘스탄티노폴리스를 에워쌌으나 이기지 못했으며, 1237년 그는 동맹을 깼다. 1241년 이반 아센이 죽자 불가리아는 어린 후계자들 아래 약해졌고, 1242년 몽골이 침공해 칼리만 1세(재위 1241~1246)가 공물을 바쳤다. 니케아의 요한 3세는 불가리아의 마케도니아 땅을 빼앗고 1246년 테살로니키를 병합해 에게해 북부 일대로 세력을 넓혔다. 이렇게 니케아는 라틴 제국을 에워싸며 1261년 콘스탄티노폴리스를 되찾을 바탕을 닦았다."
  subjects: [bulgaria-second, epirus-despotate, nicaea, latin-empire, thessalonica-kingdom, hungary-kingdom, serbia-medieval, mongol-empire, golden-horde]
  links:
    - { from: bulgaria-second, to: epirus-despotate, note: "클로코트니차 전투(1230)" }
    - { from: nicaea, to: bulgaria-second, note: "마케도니아·서트라키아 병합(1246)" }
  tags: [war, politics]
  sources: ["John V. A. Fine Jr., The Late Medieval Balkans: A Critical Survey from the Late Twelfth Century to the Ottoman Conquest (1987)", "Donald M. Nicol, The Despotate of Epiros (Oxford: Blackwell, 1957)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
