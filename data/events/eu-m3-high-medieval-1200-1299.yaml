- id: hungary-golden-bull-1205
  year: 1205
  endYear: 1270
  title:
    ko: "언드라시 2세의 황금 문서(1222)와 벨러 4세의 재건"
  summary:
    ko: "언드라시 2세(재위 1205~1235)는 왕실 땅을 귀족에게 나눠 주어 왕권이 약해졌다. 1217~1218년 제5차 십자군으로 아크레까지 갔으나 곧 돌아왔다. 1222년 세케슈페헤르바르에서 귀족의 압박으로 '황금 문서'(헝가리어 Aranybulla)를 반포했다. 31개 조항으로 귀족의 자의적 체포를 막고 세금 면제를 인정했으며, 왕이 약속을 어기면 저항할 권리(31조)를 담았다(이 저항권은 1231년 개정판에서 빠졌다). 1224년에는 트란실바니아의 독일계 이주민(작센인)에게 자치를 보장하는 안드레아눔 칙허장을 내렸다. 튜턴 기사단은 1211년 부르첸란트(브라쇼브 일대)에 자리 잡았으나 독립하려 하자 1225년 쫓겨나 프로이센으로 향했다(뒤의 사건). 벨러 4세(재위 1235~1270)는 쿠만 족장을 받아들이는 문제로 귀족과 갈등했고 1241년 모히에서 몽골에 크게 졌다(뒤의 사건). 몽골이 떠난 뒤 그는 돌로 지은 성을 쌓고 도시에 특권을 주며 1247년 부더 성 건설을 시작해 '제2의 건국자'로 불린다. 1254년 오타카르 2세와 맺은 조약으로 슈타이어마르크를 얻었으나 1260년 크레센브룬에서 지고 1261년 내주었다(뒤의 사건). 말년에는 아들 이슈트반과 내전을 치렀고(1262~1266) 1266년 화해했다. 이슈트반 5세가 1270년 뒤를 이었다. 지도는 1214~1221년 갈리치아의 일부를 헝가리가 가진 것으로 그린다."
  subjects: [hungary-kingdom, galicia-volhynia, teutonic-order, bohemia-kingdom, cuman-tribes, mongol-empire]
  tags: [politics]
  sources: ["Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)", "Martyn Rady, Nobility, Land and Service in Medieval Hungary (2000)"]

- id: albigensian-1209
  year: 1209
  endYear: 1229
  title:
    ko: "알비 십자군: 베지에(1209)에서 파리 조약(1229)까지"
  summary:
    ko: "옥시타니아(랑그도크)에서 카타리파(이원론적 교리를 가진 이단으로 몰린 이들)가 퍼지자, 교황 인노첸시오 3세는 사절 피에르 드 카스텔노가 1208년 1월 살해된 일을 계기로 십자군을 선포했다. 1209년 7월 22일 십자군이 베지에를 공격하자 항복을 거부한 도시에서 십자군 병사들이 많은 시민을 죽였다. 교황 사절 아르노 아말리크는 2만 명이 죽었다고 보고했으나 과장으로 보며 현대 추산은 수천 명이고, '모두 죽여라, 하느님이 알아보실 것이다'라는 말은 훗날의 기록이라 사실 여부가 불확실하다. 이어 카르카손도 8월에 항복했고, 젊은 영주 레몽 로제 트랑카벨은 감옥에서 죽었다. 지도자가 된 시몽 드 몽포르는 1213년 9월 12일 무레에서 더 적은 병력으로 툴루즈 백작 레몽 6세를 돕던 아라곤 왕 페드로 2세를 무찌르고 왕을 죽여, 아라곤의 옥시타니아 개입이 끝났다. 1215년 라테란 공의회(뒤의 사건)가 레몽 6세의 땅을 몽포르에게 넘겼으나 1218년 몽포르는 툴루즈 포위 중 죽었다. 이후 프랑스 왕이 직접 나서 루이 8세가 1226년 원정을 이끌었고(그해 가을 병으로 죽었다), 1229년 4월 12일 파리 조약(모 조약)으로 레몽 7세가 툴루즈를 지키되 딸 잔을 루이 9세의 동생 알퐁스에게 시집보내기로 하고 랑그도크 해안 지방을 왕에게 넘겼다. 이후 교회는 이단 심문을 도미니코회에 맡겨(1233) 이단 색출을 이어 갔고, 1244년 3월 몽세귀르 성이 함락되자 왕의 군대와 교회가 투항을 거부한 카타리파 200여 명을 화형에 처했다."
  subjects: [county-of-toulouse, france, aragon, papal-states, provence-barcelona]
  links:
    - { from: papal-states, to: county-of-toulouse, note: "십자군 선포(1208~1209)" }
    - { from: france, to: county-of-toulouse, note: "1229년 파리 조약: 랑그도크 해안 병합과 알퐁스의 상속" }
  tags: [war, society]
  sources: ["Jonathan Sumption, The Albigensian Crusade (1978)", "Malcolm Barber, The Cathars: Dualist Heretics in Languedoc in the High Middle Ages (2000)", "Joseph R. Strayer, The Albigensian Crusades (1971)"]
