- id: teutonic-prussia-1230
  year: 1230
  endYear: 1290
  title:
    ko: "튜턴 기사단의 프로이센 정복과 리보니아: 쿨머란트(1230)에서 수도비아·셈갈리아(1283~1290)까지"
  summary:
    ko: "1226년 마조프셰 공 콘라트 1세는 프로이센인의 약탈에 맞서 튜턴 기사단을 불렀고, 황제 프리드리히 2세는 같은 해 리미니 금인칙서로 기사단에 정복할 땅의 권리를 주었다. 총장 헤르만 폰 잘차의 기사단은 1230년 콘라트와 협약을 맺어 비스와강 오른쪽 기슭의 쿨머란트를 얻고, 1231년 토룬, 1233년 마리엔베르더 등 성을 쌓으며 프로이센 부족들을 하나씩 정복해 갔다. 1243년 교황 사절이 프로이센을 네 주교구로 나누었고, 1249년 크리스트부르크 화약으로 프로이센인이 세례를 받으면 자유를 인정받는 대신 기사단의 지배를 받아들였다. 1255년 보헤미아 왕 오타카르 2세의 십자군이 삼란트까지 와서 쾨니히스베르크 성이 세워졌다. 1260~1274년 '대(大)프로이센 반란'이 일어나 기사단이 위기를 겪었으나(1260년 7월 13일에는 리보니아 지부가 두르베에서 크게 졌다) 결국 진압했고, 1283년 수도비아(야트비아) 정복을 마친 것으로 본다. 정복 과정에서 기사단과 십자군이 프로이센인을 죽이고 노예로 삼으며 강제로 개종시켰고, 독일과 폴란드에서 온 이주민이 땅에 자리 잡았다. 프로이센어는 17~18세기에 사라졌다. 리보니아의 기사단(테라 마리아나)도 1267년 쿠로니아, 1290년 셈갈리아를 점령해 발트 부족의 땅은 거의 기사단의 손에 들어갔다. 이후 기사단은 리투아니아와의 오랜 싸움에 들어간다. 지도는 1230년 튜턴 기사단국을 쿨머란트에서 시작해 1240년 북쪽으로, 1255년 삼란트까지 넓힌다."
  subjects: [teutonic-order, baltic-tribes, polish-duchies, poland-kingdom, holy-roman-empire, papal-states, bohemia-kingdom, lithuania-grand-duchy, terra-mariana]
  links:
    - { from: teutonic-order, to: baltic-tribes, note: "프로이센 정복(1230~1283)과 셈갈리아 점령(1290)" }
  tags: [war, politics]
  sources: ["William Urban, The Teutonic Knights: A Military History (2003)", "Eric Christiansen, The Northern Crusades (2판, 1997)", "Norman Davies, God's Playground: A History of Poland, 1권 (1981)"]

- id: ireland-connacht-1235
  year: 1235
  endYear: 1264
  title:
    ko: "아일랜드 영주령의 서진과 게일 영주들의 반격: 코노트 정복(1235)에서 칼란(1261)까지"
  summary:
    ko: "1171년 헨리 2세가 세운 아일랜드 영주령은 13세기 전반에도 안글로노르만 영주들이 서쪽으로 땅을 넓혔다. 1227년 헨리 3세는 리처드 모르 드 버르를 코노트 영주로 임명했고, 그는 1235년 코노트 왕 펠림 오 코노르를 몰아내 코노트 동부를 차지했다(오 코노르 가문은 땅 일부를 지켰다). 이 확장은 땅을 장원과 성, 도시로 바꾸는 식민 사업이었다. 월터 드 버르는 1264년 얼스터 백작이 되었다. 그러나 1260년대에는 게일 영주들이 반격했다. 1260년 다운에서 얼스터의 오닐 가문 브라이언이 안글로노르만 군에게 패해 죽었고(그의 머리가 잉글랜드 왕에게 보내졌다고 한다), 1261년 칼란(케리)에서 데스몬드의 핀긴 막 카르타이그가 존 피츠토마스를 아들과 함께 죽여 남서부의 안글로노르만 세력을 꺾었다. 이로써 영주령의 팽창은 멈추었고, 이후 게일 영주들의 세력이 되살아난다. 지도는 1235년 영주령에 코노트 동부를 더해 그린다. 1315년 에드워드 브루스의 침공(뒤의 사건)은 이 영주령의 약해진 기반 위에서 일어났다."
