- id: golden-horde-1242
  year: 1242
  endYear: 1283
  title:
    ko: "킵차크 칸국의 성립과 루스의 공납: 바투에서 모스크바 공국의 분립까지"
  summary:
    ko: "바투는 1242년 헝가리에서 돌아와 볼가강 하류에 사라이를 두었고, 이 땅은 훗날 킵차크 칸국(러시아 사료의 '황금 오르다')으로 불린다. 몽골은 루스를 직접 다스리지 않고 공후들이 사라이에서 칸의 허락장(야를릭)을 받아 대공 자리를 얻게 하고 공납을 바치게 했다. 블라디미르 대공 야로슬라프 2세는 1243년 바투에게 가서 신종했고, 갈리치아의 다닐로도 1245년 무렵 찾아갔다. 야로슬라프는 1246년 카라코룸에서 죽었다(독살설이 있다). 1257~1259년의 호구 조사가 공납의 바탕이 되었고, 노브고로드는 이에 반발해 소요를 일으켰다(1259, 앞의 사건). 공납은 처음엔 칸의 징세 청부인과 몽골 관리(바스카크)가 거두다가 1260년대 이후 점차 공후들이 맡았다. 바투의 동생 베르케(재위 1257~1266)는 이슬람으로 개종해 이란의 훌라구 칸과 싸웠고, 칸국은 1260년대에 사실상 대칸에서 독립했다. 루스 땅은 공후 가문마다 갈라졌다. 1247년 알렉산드르 넵스키의 동생 야로슬라프가 트베리 공국을 세웠고, 알렉산드르의 막내아들 다닐은 1263년 무렵 모스크바를 영지로 받았고 직접 다스리기 시작한 때는 1283년 무렵으로 보며, 지도는 1283년부터 모스크바 대공국을 따로 둔다. 몽골 지배가 루스에 끼친 영향을 두고는 '타타르의 멍에'라는 전통적인 평가와 몽골이 교회를 보호하고 공후 사이의 경쟁을 이용했다는 평가가 맞서 있다."
  subjects: [golden-horde, rus-principalities, ryazan, tver, grand-duchy-of-moscow, novgorod-republic, galicia-volhynia, smolensk-principality, lithuania-grand-duchy, mongol-empire]
