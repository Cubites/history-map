- id: manfred-charles-1258
  year: 1258
  endYear: 1281
  title:
    ko: "만프레디에서 앙주의 샤를로: 시칠리아 왕국의 주인이 바뀌다"
  summary:
    ko: "프리드리히 2세가 죽은(1250) 뒤 아들 콘라트 4세가 1254년 죽고 서자 만프레디가 왕국을 맡다가 1258년 팔레르모에서 왕으로 즉위했다. 교황 우르바누스 4세는 그를 막으려 프랑스 왕 루이 9세의 동생 앙주 백작 샤를에게 시칠리아 왕위를 제안했고(1263), 샤를은 1266년 1월 로마에서 대관받았다. 만프레디는 1266년 2월 26일 베네벤토에서 샤를에게 패해 전사했다. 1268년 8월 23일 탈리아코초에서 만프레디의 조카 콘라딘(콘라트 4세의 아들, 16세)이 패해 사로잡혔고 10월 29일 나폴리에서 처형되어 슈타우펜 가문의 적통 남자 혈통이 끊어졌다. 샤를은 프로방스 백작이기도 해서 지중해 서쪽에 걸친 큰 세력이 되었고, 1270년 루이 9세의 튀니스 십자군을 도와 튀니스에서 공물을 받아 냈다. 눈은 발칸으로 향했다. 만프레디가 1259년 에피루스 군주의 딸과 혼인해 얻은 알바니아 해안을 이어받아 1272년 '알바니아 왕국'을 선포했고, 1267년 비테르보 조약으로 라틴 황제 보두앵 2세와 아카이아 공국의 종주권을 얻었다. 동로마 황제 미하일 8세는 1274년 리옹 공의회에서 교회 합동을 받아들여 교황의 중재로 샤를을 막으려 했다. 그러나 1281년 교황 마르티누스 4세(샤를의 편이었다)가 미하일 8세를 파문했고, 같은 해 샤를의 군대는 알바니아의 베라트에서 패했다. 이듬해 샤를의 시칠리아 지배는 흔들렸다(뒤의 사건). 지도는 1259년부터 시칠리아 왕국에 알바니아 해안을 그리고, 1281년 베라트 패전 뒤 남알바니아를 동로마로 옮기며 남은 해안은 1282년 나폴리 왕국으로 넘긴다."
  subjects: [sicily-kingdom, papal-states, holy-roman-empire, provence, france, byzantine-empire, achaea, epirus-despotate, thessaly, florence, aragon]
  links:
    - { from: papal-states, to: sicily-kingdom, note: "1263 샤를에게 왕위 제안, 1266 대관" }
    - { from: sicily-kingdom, to: byzantine-empire, note: "알바니아 왕국(1272)과 동로마 원정 계획(1281 베라트 패전)" }
  tags: [war, politics, diplomacy]
  sources: ["Steven Runciman, The Sicilian Vespers: A History of the Mediterranean World in the Later Thirteenth Century (1958)", "David Abulafia, The Western Mediterranean Kingdoms 1200–1500: The Struggle for Dominion (1997)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)"]
  places: [{ name: "베네벤토", at: [14.78, 41.13], year: 1266 }, { name: "탈리아코초 들판(스쿠르콜라 마르시카나 일대)", at: [13.3, 42.04], year: 1268 }]

- id: byzantine-restoration-1261
  year: 1259
  endYear: 1261
  title:
    ko: "펠라고니아에서 콘스탄티노폴리스 탈환까지: 동로마 제국의 복귀"
  summary:
    ko: "니케아에서 어린 요한 4세의 섭정으로 떠올라 1259년 공동 황제가 된 미하일 8세 팔라이올로고스는 서쪽의 연합을 맞아야 했다. 에피루스의 미하일 2세, 아카이아의 기욤 2세 빌라르두앵, 시칠리아 왕 만프레디(미하일 2세의 사위)가 손잡고 일어났다. 1259년(여름에서 가을 사이) 펠라고니아 평원에서 미하일 8세의 동생 요한 팔라이올로고스가 이 연합군을 무찔렀고, 기욤은 포로가 되어 1262년 모레아의 미스트라·모넴바시아 등 요새를 내주고 풀려났다. 1261년 3월 미하일 8세는 제노바와 님파이온 조약을 맺어, 제노바가 함대로 도와 주는 대신 제국 안의 무역 특권을 얻게 했다(베네치아의 독점을 깨려는 것이었다). 그런데 7월 25일 장군 알렉시오스 스트라테고풀로스가 소수의 군사로 이른바 비밀 통로를 따라 콘스탄티노폴리스에 들어갔다. 라틴 제국의 함대는 마침 도시를 비우고 있었고 황제 보두앵 2세는 서둘러 달아났다. 8월 15일 미하일 8세가 도시에 정식으로 입성하고 대관식을 올렸다. 그러나 12월 25일 어린 요한 4세의 눈을 멀게 해 폐위했고, 이 일로 총대주교 아르세니오스가 그를 파문하는 등 교회가 오랫동안 갈라졌다. 동로마는 회복했지만 이전의 크기를 되찾지는 못했다. 서쪽에서는 만프레디의 뒤를 이어 앙주의 샤를이 군대를 보내기 시작했다(앞의 사건)."
  subjects: [nicaea, latin-empire, byzantine-empire, epirus-despotate, achaea, sicily-kingdom, genoa, venice, bulgaria-second]
  links:
    - { from: nicaea, to: latin-empire, note: "콘스탄티노폴리스 탈환(1261)" }
    - { from: genoa, to: nicaea, note: "님파이온 조약(1261): 무역 특권과 해군 지원" }
  tags: [war, politics]
  sources: ["Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "Deno J. Geanakoplos, Emperor Michael Palaeologus and the West, 1258–1282 (1959)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
  places: [{ name: "펠라고니아 평원(정확한 위치는 갈림)", at: [21.57, 40.82], year: 1259 }, { name: "콘스탄티노폴리스", at: [28.96, 41.01], year: 1261 }]

- id: acre-1291
  year: 1260
  endYear: 1291
  title:
    ko: "안티오크 함락(1268)에서 아크레 함락(1291)까지: 십자군 국가의 해안 거점 상실"
  summary:
    ko: "1260년 아인 잘루트에서 이집트의 맘루크가 몽골군을 꺾은 뒤, 술탄 바이바르스(재위 1260~1277)는 시리아 해안의 십자군 국가와 그 이웃을 차례로 공략했다. 안티오크 공 보에몽 6세는 아르메니아 왕 헤툼 1세처럼 몽골에 신종해 표적이 되었고, 1268년 5월 18일 바이바르스가 안티오크를 함락해 안티오크 공국은 끝났다. 바이바르스는 주민이 대부분 죽거나 포로가 되었다고 자랑한 편지를 보냈으나 숫자는 선전의 과장으로 본다. 1270년 프랑스 왕 루이 9세가 튀니스 십자군에서 죽었고(앞의 사건), 훗날 잉글랜드 왕 에드워드 1세가 되는 왕자는 1271~1272년 아크레에 와서 맘루크와 10년 휴전을 맺었다. 앙주의 샤를은 1277년 예루살렘 왕위에 대한 권리를 사들였으나 1282년 시칠리아 봉기로 뜻을 펴지 못했다(뒤의 사건). 맘루크 술탄 칼라운은 1289년 4월 트리폴리를 함락했고, 그의 아들 알아슈라프 칼릴은 1291년 4월 6일부터 5월 18일까지 아크레를 포위해 함락했다. 성전기사단 총장 기욤 드 보죄가 전사했고 많은 주민이 죽거나 노예가 되었다. 티레·시돈·베이루트 등은 그해 안에 항복하거나 버려졌으며 8월에는 성전기사단의 아틀릿 성채가 비워졌다. 십자군은 이후 키프로스의 뤼지냥 왕국을 거점 삼아 해안을 습격했지만, 본토 해안의 십자군 국가들은 되살아나지 않았다. 키프로스 왕 앙리 2세는 예루살렘 왕이라는 이름을 이었고, 튜턴 기사단은 본부를 베네치아로 옮겼다가 1309년 프로이센의 마리엔부르크로 다시 옮겼다(뒤의 일)."
  subjects: [antioch, cyprus-kingdom, cilician-armenia, mongol-empire, france, england, teutonic-order, sicily-kingdom]
  links:
    - { from: mongol-empire, to: cilician-armenia, note: "1260년 무렵 헤툼 1세의 신종과 동맹" }
  tags: [war]
  sources: ["Steven Runciman, A History of the Crusades, 3권: The Kingdom of Acre and the Later Crusades (1954)", "Peter W. Edbury, The Kingdom of Cyprus and the Crusades, 1191–1374 (1991)", "Peter Jackson, The Mongols and the West, 1221–1410 (2005)"]
  places: [{ name: "안티오크(안타키아)", at: [36.16, 36.2], year: 1268 }, { name: "아크레(아코)", at: [35.07, 32.92], year: 1291 }]

- id: wales-1277
  year: 1267
  endYear: 1284
  title:
    ko: "에드워드 1세의 웨일스 정복: 몽고메리 조약(1267)에서 러들란 법령(1284)까지"
  summary:
    ko: "1267년 9월 29일 몽고메리 조약으로 헨리 3세는 귀네드의 지도자 리웰린 압 그루피드를 '웨일스 공'으로 인정하고 그의 신종을 받았다. 그러나 에드워드 1세(재위 1272~1307)가 즉위한 뒤 리웰린이 신종 의례를 거부하자, 에드워드는 1277년 군대를 보내 리웰린을 귀네드 서북부로 몰아넣고 11월 아버콘위 조약을 맺게 했다. 에드워드는 플린트와 러들란 같은 곳에 성을 쌓기 시작했다. 1282년 3월 리웰린의 동생 다피드 압 그루피드가 반란을 일으키고 리웰린도 가담했으나, 12월 11일 리웰린이 빌스 근처 칠메리에서 전사했다. 다피드는 1283년 6월 사로잡혀 10월 3일 슈루즈베리에서 반역죄로 교수형·사지 절단형에 처해졌다. 1284년 러들란 법령으로 웨일스 북서부에 앵글시·카나번·메리오네스 같은 주가 설치되어 잉글랜드법이 적용되었다. 에드워드는 콘위·카나번·하를레크 등에 큰 성과 잉글랜드인 정착촌(성곽 도시)을 지어 지배를 굳혔다. 웨일스 공 칭호는 1301년 에드워드의 아들(카나번의 에드워드)에게 주어졌고 이후 잉글랜드 왕세자의 칭호가 되었다. 웨일스 공국들 항목은 지도에서 1283년에 끝난다."
  subjects: [england, welsh-principalities]
  links:
    - { from: england, to: welsh-principalities, note: "아버콘위 조약(1277)과 1282~1283년 정복, 러들란 법령(1284)" }
