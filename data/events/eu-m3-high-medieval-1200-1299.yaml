- id: mongol-rus-1236
  year: 1236
  endYear: 1240
  title:
    ko: "몽골의 루스 원정: 랴잔·블라디미르(1237~1238)에서 키예프(1240)까지"
  summary:
    ko: "1235년 쿠릴타이에서 서방 원정이 결정되어, 바투가 총사령관으로 나서고 노장 수부타이가 작전을 이끌었다. 1236년 볼가강 중류의 볼가 불가리아가 무너졌고, 쿠만(킵차크) 부족들은 서쪽으로 쫓겨 갔다. 1237년 12월 21일 랴잔이 엿새 포위 끝에 함락되었다. 이어 콜롬나에서 유리 2세가 보낸 아들 프세볼로드의 블라디미르군(랴잔의 남은 군대가 합류했다)을 꺾고 1238년 2월 7일 블라디미르를 함락했으며, 유리 2세는 북쪽 시티강 쪽에서 새 병력을 모으다가 3월 4일 그곳에서 전사했다. 3월 토르조크를 두 주 동안 에워싸 점령한 뒤 노브고로드까지 100베르스타 안팎을 남기고 되돌아갔다(봄의 진창 때문이라는 설과 병력·보급이 모자랐다는 설이 있다). 코젤스크는 일곱 주를 버텨 몽골이 '악한 도시'라 부르게 했다. 1239년에는 페레야슬라블과 체르니히우를 쳤고, 1240년 12월 6일(통설)에 키예프가 함락되어 이 땅의 중심이 무너졌다. 연대기는 도시마다 주민이 몰살되었다고 적지만 고고학 조사는 피해의 정도가 도시마다 달랐음을 보여 준다(스몰렌스크와 노브고로드는 화를 면했다). 몽골군 규모는 사료에 '수십만'으로 나오지만 과장이며, 현대 연구는 대개 수만 명으로 본다. 1246년 이곳을 지난 카르피니는 키예프 들판에 해골과 뼈가 수없이 널려 있었다고 기록했다. 같은 시기 동쪽 끝에서는 별개의 몽골군이 고려를 침입하고 있었다(`mongol-third-invasion-1235`)."
  subjects: [mongol-empire, rus-principalities, ryazan, novgorod-republic, galicia-volhynia, volga-bulgaria, cuman-tribes, smolensk-principality, goryeo]
