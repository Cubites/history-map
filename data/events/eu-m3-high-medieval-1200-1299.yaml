- id: latin-greek-states-1204
  year: 1204
  endYear: 1225
  title:
    ko: "라틴 제국과 그리스 계승국들: 니케아·에피루스·트레비존드"
  summary:
    ko: "콘스탄티노폴리스를 차지한 십자군은 제국을 황제가 4분의 1, 베네치아와 십자군 제후가 각각 8분의 3씩 갖는 식으로 나누기로 했으나 실제로 지배한 땅은 좁았다. 황제 보두앵 1세는 1205년 4월 아드리아노폴리스에서 불가리아 차르 칼로얀에게 크게 패해 사로잡혔고(곧 죽었다), 동생 앙리가 1206년부터 황제로 라틴 제국을 지켰다. 몬페라토의 보니파초는 테살로니키 왕국을 세웠으나 1207년 불가리아와 싸우다 죽었다. 그리스에서는 샹플리트의 기욤과 빌라르두앵의 조프루아가 모레아를 정복해 아카이아 공국을 세웠고(1205~1209년 무렵), 오통 드 라 로슈는 아테네와 테바이를 차지했다. 그리스인의 나라도 일어났다. 알렉시오스 1세와 다비드 콤니노스는 십자군이 도시를 얻기 직전인 1204년 4월 흑해 연안에서 트레비존드를 세웠다(조지아 여왕 타마르의 도움을 받았다고 전한다). 테오도로스 1세 라스카리스는 니케아에서 1205년 황제를 자처해 1208년 총대주교에게 대관받았고, 미하일 1세 콤니노스 두카스는 에피루스에 자리 잡았다. 앙리는 1211년 린다코스에서 니케아를 꺾고 1214년 님파이온 조약으로 소아시아 북서부를 얻었으나 1216년 죽었고, 이후 라틴 제국은 약해졌다. 에피루스의 테오도로스는 1224년 테살로니키를 빼앗아 왕국을 없앴고, 같은 해 니케아의 요한 3세 바타치스가 포이마네논에서 라틴군을 물리쳐 소아시아의 라틴 땅을 거의 차지했다. 라틴 제국은 콘스탄티노폴리스와 주변 땅만 남았다."
  subjects: [latin-empire, nicaea, trebizond, epirus-despotate, thessalonica-kingdom, achaea, duchy-of-athens, bulgaria-second, venice, byzantine-empire, georgia-kingdom, rum-sultanate]
