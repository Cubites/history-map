  tags: [politics, war]
  sources: ["세르히 플로히, 『유럽의 문 우크라이나: 독립과 생존을 위한 투쟁의 역사』(허승철 옮김, 한길사, 2022)", "Paul Robert Magocsi, A History of Ukraine (2판, 2010)", "John Fennell, The Crisis of Medieval Russia, 1200–1304 (1983)"]
