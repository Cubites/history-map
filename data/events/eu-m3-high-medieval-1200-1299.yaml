- id: louis-ix-1259
  year: 1226
  endYear: 1270
  title:
    ko: "루이 9세와 파리 조약(1259): 프랑스 왕권의 확대와 알퐁스의 툴루즈"
  summary:
    ko: "루이 9세는 1226년 열두 살에 왕이 되었고 어머니 블랑슈 드 카스티유가 섭정을 맡았다. 1242년 타유부르에서 잉글랜드 왕 헨리 3세와 뤼지냥 가문의 연합군을 물리쳤다. 1240년 파리에서 열린 탈무드 논쟁 뒤 1242년 파리에서 탈무드 필사본 수십 수레가 불태워졌고, 1253~1254년에는 유대인 추방령을 내렸으나 실제로는 오래 지켜지지 않았으며, 1269년에는 유대인에게 노란 바퀴 모양 표지를 달게 했다. 1246년 동생 앙주의 샤를이 프로방스 여백작 베아트리스와 혼인해 프로방스를 차지했다(바르셀로나 가문의 프로방스 백국은 이때 끝났다). 샤를은 교황의 제안을 받아들여 1266년 시칠리아 왕이 되었다(뒤의 사건). 루이는 1248~1254년 이집트·팔레스타인 십자군을 이끌어 1250년 포로가 되었다가 몸값을 내고 풀려났다. 1258년 코르베유 조약으로 아라곤 왕과 옥시타니아·카탈루냐 영유권을 서로 포기했고(뒤의 사건), 1259년 12월 4일 파리 조약으로 헨리 3세가 노르망디·앙주·멘·투렌·푸아투에 대한 권리를 포기하는 대신 가스코뉴를 프랑스 왕의 봉토로 받고, 루이가 리무쟁·페리고르·케르시 등의 일부를 내주었다. 그는 1270년 8월 튀니스 십자군 도중 병으로 죽었다. 동생 알퐁스는 1249년부터 툴루즈 백작으로 있었고(앞의 사건), 1271년 8월 자식 없이 죽으면서 툴루즈 백국이 왕령으로 합쳐졌다. 루이는 1297년 성인으로 시성되었다."
