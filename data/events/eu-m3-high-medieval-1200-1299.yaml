- id: frederick-ii-1212
  year: 1212
  endYear: 1250
  title:
    ko: "프리드리히 2세와 교황: 시칠리아 왕국과 신성 로마 제국"
  summary:
    ko: "시칠리아 왕이자 하인리히 6세의 아들인 프리드리히 2세는 1212년 교황 인노첸시오 3세의 지원으로 독일에 가서 오토 4세에 맞섰다. 보헤미아의 오타카르 1세에게 1212년 시칠리아 금인칙서로 세습 왕위를 인정했고, 오토 4세가 부빈(앞의 사건)에서 진 뒤 독일의 지배자가 되었다. 1220년 11월 22일 로마에서 황제로 대관받았다. 그는 시칠리아 왕국을 중앙 집권적으로 다스려 1224년 나폴리 대학을 세우고 1231년 멜피 헌장을 반포했으며, 반란을 일으킨 시칠리아 무슬림을 본토의 루체라로 옮겨 살게 했다. 십자군 출정을 거듭 미루다 1227년 교황 그레고리우스 9세에게 파문당했으나 1228~1229년 제6차 십자군을 이끌어, 싸우지 않고 이집트 술탄 알카밀과 협상해 예루살렘과 베들레헴, 나자레트를 10년 동안 얻고 1229년 3월 18일 예루살렘 왕으로 스스로 관을 썼다. 롬바르디아 도시들은 롬바르디아 동맹을 되살려 맞섰으나 1237년 11월 27일 코르테누오바에서 프리드리히에게 크게 졌다. 1239년 다시 파문당했고 1245년 리옹 공의회에서 교황 인노첸시오 4세가 폐위를 선언했다. 프리드리히는 1248년 파르마 포위에서 진영이 무너지는 패배를 겪었고 1250년 12월 13일 푸글리아의 카스텔 피오렌티노에서 죽었다. 그의 충실한 조언자였던 튜턴 기사단 총장 헤르만 폰 잘차는 1226년 리미니 금인칙서로 프로이센 정복의 법적 바탕을 얻었다(뒤의 사건). 프리드리히가 죽자 슈타우펜 가문은 빠르게 무너졌고(뒤의 사건), 신성 로마 제국은 군주 없는 시기에 들어섰다."
  subjects: [holy-roman-empire, sicily-kingdom, papal-states, bohemia-kingdom, teutonic-order, italian-minor-states, france]
  links:
    - { from: papal-states, to: holy-roman-empire, note: "1227·1239 파문, 1245 리옹 공의회의 폐위 선언" }
    - { from: holy-roman-empire, to: italian-minor-states, note: "코르테누오바 전투(1237): 롬바르디아 동맹 격파" }
  tags: [politics, war, diplomacy]
  sources: ["David Abulafia, Frederick II: A Medieval Emperor (1988)", "Ernst Kantorowicz, Frederick the Second, 1194–1250 (영역판, 1931)", "Wolfgang Stürner, Friedrich II. (전2권, 1992·2000)"]
