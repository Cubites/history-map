- id: venice-genoa-1256
  year: 1256
  endYear: 1299
  title:
    ko: "베네치아와 제노바: 성 사바 전쟁에서 쿠르졸라 해전(1298)까지"
  summary:
    ko: "아크레의 성 사바 수도원 소유권 다툼에서 시작된 성 사바 전쟁(1256~1270)에서 베네치아와 제노바는 동지중해 무역권을 두고 싸웠다. 제노바는 1261년 님파이온 조약(뒤의 사건)으로 니케아와 손잡아 베네치아가 라틴 제국에서 누리던 독점을 깼고, 동로마가 콘스탄티노폴리스를 되찾자 베네치아는 특권을 잃었다가 1268년 휴전으로 일부를 되찾았다. 제노바는 콘스탄티노폴리스 맞은편의 갈라타(페라)를 얻고(1267), 1266년 무렵 킵차크 칸국의 허락으로 크림에 카파를 세워 흑해 무역에 뛰어들었다. 서지중해에서는 제노바가 피사와 싸웠고, 1284년 8월 6일 멜로리아 해전에서 제노바가 피사 함대를 크게 물리쳐 수천 명의 포로를 잡았다(연대기마다 7천 명에서 9천 명 이상으로 달라 확실하지 않다). 피사의 해상 세력은 이후 기울었다. 1297년 1월 8일 제노바에서 쫓겨난 겔프 망명자 프란체스코 그리말디가 수사로 변장해 모나코 바위 요새를 차지했고(모나코 그리말디 가문의 시작), 같은 해 베네치아에서는 대평의회의 자격을 기존 가문에 제한하는 '세라타' 개혁이 시작되었다(1323년에 굳어졌다). 1298년 9월 쿠르졸라 섬 앞바다에서 람바 도리아의 제노바 함대가 안드레아 단돌로의 베네치아 함대를 무찔러 많은 배와 수천 명의 포로를 잡았다(마르코 폴로도 포로가 되었다는 전승이 있다, 뒤의 사건). 1299년 5월 25일 밀라노의 비스콘티가 중재한 화약으로 전쟁이 끝났다."
  subjects: [venice, genoa, byzantine-empire, nicaea, latin-empire, golden-horde, monaco, milan-signoria, italian-minor-states]
  links:
