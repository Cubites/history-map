- id: anatolia-frontier-1282
  year: 1282
  endYear: 1299
  title:
    ko: "안드로니코스 2세의 즉위와 소아시아 변경: 투르크멘 베이국들의 부상"
  summary:
    ko: "1282년 12월 미하일 8세가 죽고 안드로니코스 2세(재위 1282~1328, 아버지 생전에 공동 황제였다)가 홀로 제위에 올랐다. 그는 아버지가 맺은 서방과의 교회 합동을 파기했다. 동로마는 1261년 콘스탄티노폴리스를 되찾은 뒤에도 서쪽의 앙주 세력과 발칸 이웃들에게 힘을 쏟았고, 소아시아 방위는 뒷전이었다. 그동안 룸 술탄국은 일 칸국의 종주권 아래 이름만 남았고, 몽골의 군정과 압박을 피한 투르크멘 유목민이 서쪽 변경으로 밀려들어 동로마 땅 쪽에 자리 잡았다. 지도는 1282년부터 아나톨리아 베이국들 묶음을 서쪽으로 넓히고, 1292년에는 흑해 쪽에 잔다르(이스펜디야르) 베이국을 따로 둔다. 14세기 초에는 메네셰·아이든·사루한·게르미얀·카라시 같은 베이국이 에게해 쪽 연안과 마이안드로스 골짜기까지 이르렀으나, 이름과 성립 연도는 자료에 따라 다르다. 같은 때 비티니아 변경에서 오스만의 집단이 자랐고, 전통적으로 1299년을 오스만 나라의 시작으로 삼는다(오스만의 생애는 한 세기 뒤의 연대기에 기댄 것이라 연대가 불확실하다). 오스만 1세와 오르한이 동로마의 비티니아를 정복해 가는 과정은 뒤의 사건에서 이어진다."
  subjects: [byzantine-empire, anatolian-beyliks, rum-sultanate, karaman-beylik, candar-beylik, ottoman, trebizond, cilician-armenia]
