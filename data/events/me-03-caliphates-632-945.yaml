# 서아시아·북아프리카 사건 3차 묶음(me-03): 정통 칼리프·우마이야·아바스, 마그레브의 왕조들, 이란·이라크·이집트·예멘의 지방 왕조, 파티마의 흥기 (632 ~ 945)
# 범위: 아부 바크르의 선출과 리다 전쟁, 아랍의 이라크·이란 정복과 사산 제국의 끝, 우마르의 통치 제도, 이집트 정복과 푸스타트, 우스만과 쿠란 정본, 제1차 내전과 알리,
#   무아위야와 우마이야 칼리프국, 카르발라와 시아의 형성, 제2차 내전, 압드 알말리크의 개혁, 카스피해 남안의 다부이·바반드, 마그레브 정복과 베르베르의 저항(쿠사일라·카히나),
#   베르베르 대반란과 바르가와타, 피흐르 토후국, 아바스 혁명과 바그다드 건설, 미드라르·루스탐·이드리스·아글라브, 하룬 알라시드, 오만 이바드 이맘국, 알마문과 지방 왕조의 시작,
#   번역 운동, 예멘의 지야드·유피르·자이드파, 사마라 천도와 혼란, 사파르·알리 가문(타바리스탄)·툴룬·잔지 반란, 아바스의 회복과 쇠퇴, 카르마트와 흑석 탈취,
#   함단·사지·살라르·사만·지야르·일리아스·부와이 왕조, 아미르 알우마라 제도, 파티마 칼리프국의 성립과 팽창, 이흐시드 왕조.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 632~945년 지도에서 생기거나 끝난 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
#   긴 과정은 한 사건에 여러 왕조를 함께 묶고 실제 과정의 기간만 잡았다.
# 한국사와 닿는 점: 이 시대 서아시아와 직접 닿는 한국 항목은 없어 subjects로 잇지 않았다.
#   유럽·중국 파일의 아랍의 정복과 동로마·콘스탄티노폴리스 포위·우마이야의 이베리아 정복·코르도바 아미르국·카롤루스의 황제 대관·시칠리아 정복·마케도니아 왕조의 반격·탈라스 전투는
#   다시 쓰지 않고 「제목」으로 가리켰다. 부와이의 바그다드 입성(945/946) 뒤와 파티마의 이집트 정복(969)은 다음 묶음의 몫이다.
# 날짜: 1582년 전이라 율리우스력이다. 히즈라력 날짜는 양력 해로 바꾸어 적었고 확실하지 않은 날짜는 '무렵'으로 적었다. 사료마다 해가 갈리는 일(카디시야·바그다드 입성 등)은 갈린다고 밝혔다.
# 이름 규칙: 아랍어·페르시아어 인명은 국립국어원 용례와 교과서의 굳은 표기(무함마드·칼리프·쿠란·하룬 알라시드)를 따르고 정관사는 뒤 낱말에 붙여 '알'로 적으며, 지명은 지금도 쓰는 이름은 지금 나라 말(바그다드·다마스쿠스·카이라완·시라즈),
#   옛 도시는 굳은 표기(크테시폰·푸스타트). 종파 이름은 저장소 기존 표기(카리지파·이바드파·수프리파)로 맞췄고 나라 이름은 항목 이름을 따랐다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 서술은 새로 작성. 출처는 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음).
#   병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 피정복민·소수자와 종파 서술은 한쪽 입장만 따르지 않고 전승과 학설을 구분했다.

- id: abu-bakr-ridda-632
  year: 632
  endYear: 634
  title:
    ko: "아부 바크르의 선출과 리다 전쟁(632~634)"
  summary:
    ko: "632년 6월 무함마드가 메디나에서 죽자 공동체는 후계 문제에 부딪혔다. 메디나의 안사르(무함마드를 맞아 준 메디나 사람들)가 사키파에서 따로 모였을 때 우마르와 아부 우바이다가 아부 바크르에게 충성을 맹세해 그가 '신의 사도의 후계자', 곧 칼리프로 인정되었다. 알리와 일부 하심 가문 사람들은 한동안 맹세를 미뤘다고 전승이 전하며, 수니파는 아부 바크르를 첫 칼리프로 보고 시아파는 알리가 정당한 후계자였다고 본다. 아부 바크르는 무함마드가 죽기 전 꾸려 둔 우사마 이븐 자이드의 시리아 원정군을 그대로 보냈다. 이어 아라비아 여러 부족이 자카트(공동체에 내는 세)를 거부하거나 무함마드와 맺은 동맹을 끊었는데, 뒤의 사료는 이를 '리다'(배교)라 부른다. 부족 쪽에서는 신앙을 버린 것이 아니라 메디나에 세를 바치는 일을 거부한 것이라는 해석이 있고, 현대 학자들도 종교와 정치·재정 문제가 얽혔다고 본다. 아사드 부족의 투라이하, 야마마의 무사일리마, 타밈 부족의 여성 사자 같은 이들이 스스로 예언자를 칭하며 일어났다. 아부 바크르는 여러 갈래의 군을 보냈고, 할리드 이븐 알왈리드가 632년 12월 무렵(사료에 따라 633년 초) 야마마의 아크라바에서 무사일리마를 물리쳤다(쿠란을 외우던 이들이 이 싸움에서 많이 죽자 우마르가 쿠란을 모아 적자고 권했다고 전승은 전한다). 633년 안에 바레인·오만·예멘·하드라마우트가 다시 메디나 아래로 들어와 아라비아가 하나로 묶였고, 이 힘은 곧 이라크와 시리아로 향했다. 아부 바크르는 무함마드의 오랜 동료이자 아내 아이샤의 아버지였고, 무함마드가 병든 동안 예배를 대신 이끌었다는 일이 후계의 근거로 거론되었다고 전승은 전한다. 이 선출과 리다 전쟁을 거치며 메디나의 공동체는 부족 연합이 아니라 세금을 거두고 군대를 보내는 국가의 모습을 갖추기 시작했다. 이로써 아부 바크르에서 알리까지 네 칼리프가 차례로 이끈 정통 칼리프국의 시대가 열렸다. 634년 8월 아부 바크르는 병으로 죽으며 우마르를 후계로 지명했다."
  subjects: [rashidun-caliphate]
  tags: [politics, war, religion]
  sources: ["Wilferd Madelung, The Succession to Muhammad: A Study of the Early Caliphate (Cambridge University Press, 1997)", "Fred M. Donner, The Early Islamic Conquests (1981)", "Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: arab-iraq-conquest-633
  year: 633
  endYear: 642
  title:
    ko: "아랍의 이라크 정복: 카디시야와 크테시폰(633~642)"
  summary:
    ko: "사산 제국은 628~632년 사이 왕이 여러 번 바뀌는 내분을 겪은 끝에 632년 어린 야즈데게르드 3세를 왕으로 세운 참이었다. 633년 무렵 무타나 이븐 하리사와 할리드 이븐 알왈리드가 이끄는 아랍군이 이라크 남부 국경을 넘어 알히라 둘레의 도시들과 공납 협정을 맺었다. 할리드가 시리아로 옮겨 간 뒤 아랍군은 634년 다리 전투에서 졌으나 같은 해 부와이브에서 만회했다. 사령관 사드 이븐 아비 와카스가 이끈 카디시야 전투(636년 또는 637년, 사료마다 갈린다)에서 사산의 장군 로스탐 파루흐자드가 죽었다. 양쪽 병력은 사료가 크게 부풀려 믿기 어렵다. 이어 아랍군은 티그리스강을 건너 637년 사산의 도읍 크테시폰을 차지했고, 야즈데게르드 3세는 이란 고원의 훌완 쪽으로 물러났다. 잘룰라 전투(637~638)와 이어진 싸움으로 이라크 전역이 아랍 손에 들어갔다. 정복자들은 선주민을 쫓아내지 않고 바스라와 쿠파 같은 군영 도시를 새로 세워 군인을 따로 모아 살게 했고, 이라크의 농민과 기독교·유대교·조로아스터교 공동체는 세금을 내고 신앙을 지켰다. 639~640년에는 이야드 이븐 가놈이 자지라 북부의 라카·에데사 같은 도시를 협정으로 얻었는데, 이 도시들은 사산이 아니라 동로마 땅이었다. 후제스탄에서는 638년부터 이어진 싸움 끝에 마르즈반 호르무잔이 642년 무렵 항복했다. 정통 칼리프국의 군대는 대부분 아랍 부족 병사였고, 낙타의 기동력으로 사막 가장자리와 강 사이를 오가며 싸웠다. 사산 제국은 628년까지 이어진 동로마와의 긴 전쟁으로 재정과 군대가 지친 데다 귀족들이 왕위를 두고 갈라져 있었다. 알히라 같은 이라크 남부의 아랍계 주민 가운데는 아랍군과 협정을 맺거나 그 편에 선 부족도 있었다고 사료는 적는다. 시리아와 동로마 쪽의 일은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(뒤의 사건)에 있다."
  subjects: [rashidun-caliphate, sasanian-empire]
  links:
    - { from: rashidun-caliphate, to: sasanian-empire, note: "이라크 정복 (633~642)" }
  tags: [war, politics]
  sources: ["Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)", "Fred M. Donner, The Early Islamic Conquests (1981)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "al-Balādhurī, Futūḥ al-buldān (영역: The Origins of the Islamic State, Philip K. Hitti·Francis C. Murgotten 옮김, Columbia University, 1916~1924)"]

- id: umar-administration-634
  year: 634
  endYear: 644
  title:
    ko: "우마르의 통치와 군영 도시·디완(634~644)"
  summary:
    ko: "아부 바크르의 지명으로 칼리프에 오른 우마르는 634년부터 644년까지 이라크·시리아·이집트가 한꺼번에 공동체 아래로 들어온 시기를 다스렸다. 그는 '아미르 알무미닌'(신자들의 지휘자)을 칭했다고 전하며, 정복지의 땅을 군인에게 나누어 주지 않고 공동체의 몫으로 두어 농민에게 세금(하라즈)을 걷고 비무슬림 성인 남자에게 인두세(지즈야)를 매기는 틀을 세웠다. 아랍 군인은 바스라와 쿠파 같은 군영 도시와 뒤의 푸스타트에 모여 살며 정복지 농민과 섞이지 않았고, 전승에 따르면 디완(군인 명부와 재정 관청)에 이름이 오른 이들은 전리품과 세금에서 나오는 연금을 받았다. 디완은 사산과 동로마의 행정 관행을 이어받았다고 보며, 언제 만들었는지는 학자마다 다르다. 우마르는 정복한 도시에 협정으로 신앙과 재산을 보장해 주었다고 전하는데, 이른바 「우마르 협정」(비무슬림의 의무를 적은 문서)은 후대에 다듬어졌다는 견해가 많다. 638~639년에는 아라비아에 가뭄과 기근이 들어 우마르가 시리아와 이라크에서 곡식을 들여왔고, 이어 시리아에 아므와스의 역병이 번져 군인과 주민이 크게 죽었다. 전승은 우마르가 총독들의 재산을 조사해 불어난 재산을 나누게 했고, 아랍인이 정복지의 땅을 사들이는 것도 제한했다고 전한다. 정통 칼리프국의 재정과 군사 제도는 이렇게 정복과 함께 한꺼번에 만들어졌다. 히즈라(622년)를 원년으로 한 히즈라력도 그의 시기에 쓰이기 시작했다고 전한다. 644년 11월 메디나의 모스크에서 페르시아 출신 노예 아부 루울루아의 칼에 찔려 죽기 전 우마르는 여섯 사람의 협의체가 후계를 정하게 했다. 야르무크와 시리아·예루살렘의 정복은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(같은 시기의 사건)에 있다."
  subjects: [rashidun-caliphate]
  tags: [politics, society]
  sources: ["Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Fred M. Donner, The Early Islamic Conquests (1981)", "Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: amr-egypt-conquest-639
  year: 639
  endYear: 647
  title:
    ko: "아므르 이븐 알아스의 이집트 정복과 푸스타트(639~647)"
  summary:
    ko: "아므르 이븐 알아스는 639년 말에서 640년 초 사이 수천 명의 군을 이끌고 시나이를 지나 이집트로 들어갔다. 640년 7월 헬리오폴리스에서 동로마 군을 이기고 바빌론 요새를 포위해 641년 4월 얻었으며, 641년 알렉산드리아 총대주교 키로스와 맺은 협정으로 알렉산드리아가 열려 642년 9월 아므르가 입성했다. 조건은 공납과 일정 기간의 휴전이었고, 동로마 제국의 군대는 배로 떠났다. 아므르는 바빌론 요새 곁에 군영 도시 푸스타트를 세웠고, 그곳의 모스크가 이집트 이슬람의 첫 중심이 되었다. 푸스타트는 750년 아바스가 도읍을 이웃의 알아스카르로 옮긴 뒤에도 경제와 행정의 중심으로 남아 969년 카이로가 서기까지 이어졌다. 이집트 주민 대다수는 콥트 교회를 따르는 기독교도였고, 협정 아래 지즈야와 토지세를 내며 신앙을 지켰다. 동로마 황제가 지지한 칼케돈 신조를 따르지 않던 콥트 교회가 아랍 지배를 오히려 받아들였다는 해석과, 협정과 세금이 주된 이유였다는 해석이 함께 있다. 642~643년 아므르는 키레나이카와 트리폴리 쪽으로 나아갔다. 우스만이 아므르를 해임하고 압둘라 이븐 사아드를 앉히자(645년 무렵) 동로마 함대가 알렉산드리아를 잠시 되찾았고(645/646년), 아므르가 복귀해 니키우에서 이기고 도시를 되찾았다고 전한다. 647년에는 후임 총독 압둘라 이븐 사아드가 이프리키야로 원정해 수페툴라 둘레에서 동로마 총독 그레고리오스를 물리쳤으나 아랍군은 곧 이집트로 돌아갔다. 이 정복은 정통 칼리프국이 동로마 제국에서 가장 값진 곡창을 빼앗은 일이었다. 알렉산드리아의 곡물은 오래도록 콘스탄티노폴리스의 식량을 지탱했다. 그 뒤 이집트의 세금과 곡물은 아랍 군인의 연금과 메디나의 식량으로 쓰였고, 우마르가 이집트의 곡물을 홍해 쪽으로 보내려고 옛 운하를 다시 파게 했다고 전한다."
  subjects: [rashidun-caliphate, byzantine-empire]
  links:
    - { from: rashidun-caliphate, to: byzantine-empire, note: "이집트·키레나이카·트리폴리타니아 해안 정복 (639~647)" }
  tags: [war, politics]
  sources: ["Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)", "Fred M. Donner, The Early Islamic Conquests (1981)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)"]

- id: nihavand-iran-conquest-642
  year: 642
  endYear: 651
  title:
    ko: "니하반드 전투와 이란 정복, 야즈데게르드 3세의 죽음(642~651)"
  summary:
    ko: "642년 사산 군이 이란 고원 서부 니하반드에서 아랍군에 졌다. 아랍 쪽 사령관 누만 이븐 무카린이 이 싸움에서 죽었고, 아랍 사료는 이를 '승리 중의 승리'라 불렀다. 야즈데게르드 3세는 이스파한·케르만·시스탄을 거쳐 동쪽 메르브 쪽으로 물러났고, 아랍군은 뒤를 쫓아 지방별로 협정 또는 공략으로 이란 고원을 차지해 갔다. 라이와 하마단, 이스파한이 642~643년 무렵 넘어갔고, 644년 무렵 아제르바이잔이 아랍의 종주 아래 들어갔다. 우스만 시기인 650년 무렵 압둘라 이븐 아미르가 이끈 군이 파르스의 이스타크르를 차지했다. 이어 케르만과 시스탄이 협정으로 넘어갔고 651년에는 호라산의 니샤푸르·메르브가 열렸다. 정통 칼리프국이 이란 고원을 얻은 데에는 병력만이 아니라 협정이 컸다. 도시마다 사정이 달라 조약(술흐)으로 공납을 정하고 항복한 곳과 힘으로 점령된 곳의 대우가 갈렸다. 아랍군은 정복한 지방에 군영을 두어 이란 고원으로 나가는 거점으로 삼았다. 이란의 지방 귀족과 조로아스터교 사제 계층은 한동안 지방 행정을 맡았고, 세금 체계는 사산 제국의 틀을 대부분 이어받았다. 많은 도시와 지방 귀족(데흐칸)은 공납과 지즈야를 약속하고 땅과 신앙을 지켰으며, 조로아스터교의 불의 신전은 한동안 그대로 남았다. 정복 뒤에도 서부와 파르스에서는 아랍 총독에 맞선 반란이 이어졌다. 651년 야즈데게르드 3세가 메르브 가까이에서 죽었다. 방앗간 주인에게 살해되었다는 이야기가 널리 퍼져 있으나 사료마다 죽음의 경위가 다르고, 이로써 사산 제국이 끝났다. 카스피해 남쪽 산악의 다부이 왕조와 타바리스탄의 영주들은 협정으로 아랍군이 들어오지 못하게 막았다. 이 시기 이란 정복의 병력과 연대는 사료마다 차이가 커서 한 해로 못 박기 어렵다."
  subjects: [rashidun-caliphate, sasanian-empire, dabuyid-dynasty]
  links:
    - { from: rashidun-caliphate, to: sasanian-empire, note: "니하반드 전투와 이란 고원 정복 (642~651)" }
  tags: [war, politics]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)", "Fred M. Donner, The Early Islamic Conquests (1981)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]
