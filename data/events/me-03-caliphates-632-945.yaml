- id: mansur-baghdad-754
  year: 754
  endYear: 775
  title:
    ko: "알만수르와 바그다드의 건설(754~775)"
  summary:
    ko: "754년 알사파흐가 죽고 동생 알만수르가 칼리프에 올랐다. 숙부 압둘라 이븐 알리가 자기가 후계자라며 일어났으나 아부 무슬림이 이를 꺾었고, 알만수르는 755년 공을 세운 아부 무슬림마저 불러들여 죽였다. 호라산에서는 그를 따르던 이들의 반란이 이어졌다. 알리 가문 쪽에서는 762년 무함마드 알나프스 알자키야가 메디나에서, 그의 동생 이브라힘이 바스라에서 일어났으나 763년 모두 꺾였다. 알만수르는 이런 반란의 무대가 되기 쉬운 쿠파를 떠나 762년 티그리스강 서안에 원형 도시 '평화의 도시'(마디나트 알살람), 곧 아바스 칼리프국의 새 도읍 바그다드를 세우기 시작해 766년 무렵 완성했다. 바그다드는 이라크의 곡창과 운하·강의 교통을 쥔 자리에 있었다. 도시는 지름 2킬로미터 남짓의 원형 성벽 안에 궁전과 대모스크, 관청과 근위대 병영을 모으고 바깥에 시장과 주택가가 이어지게 지었다. 건설에는 시리아·이란·이라크 각지에서 일꾼과 장인이 모였다고 하며 그 수는 사료마다 다르다. 759년에 군을 보내 760~761년 무렵 타바리스탄의 다부이 왕조를 끝냈고, 이프리키야는 761~762년 무렵 되찾았다. 알만수르는 이란 출신 관료 가문인 바르마크 가문의 할리드를 곁에 두었고, 재상·재정·우편·정보를 맡는 관청을 정비해 칼리프가 다스리는 체제를 다졌다. 775년 10월 메카 순례길에 죽었다. 알만수르는 검소하고 재정에 엄한 칼리프로 알려졌으며, 그의 시기 아바스 칼리프국의 땅은 동쪽의 호라산에서 서쪽의 이프리키야까지 닿았다. 764년 알만수르가 조카 이사 이븐 무사를 제치고 아들 알마흐디를 후계자로 올려 부자 상속이 자리 잡았다. 이후 바그다드는 이슬람 세계에서 가장 큰 도시로 자랐으나 인구 추산은 사료마다 크게 다르다."
  subjects: [abbasid-caliphate, dabuyid-dynasty]
  tags: [politics, war]
  sources: ["Hugh Kennedy, The Early Abbasid Caliphate: A Political History (Croom Helm, 1981)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Elton L. Daniel, The Political and Social History of Khurasan under Abbasid Rule, 747–820 (Bibliotheca Islamica, 1979)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: kharijite-states-maghreb-758
  year: 758
  endYear: 909
  title:
    ko: "마그레브 내륙의 카리지파 국가: 시질마사의 미드라르 왕조와 타헤르트의 루스탐 이맘국(758~909)"
  summary:
    ko: "카리지파는 공동체의 지도자를 혈통이 아니라 신앙과 덕으로 뽑아야 한다고 주장했고, 이 가르침은 마그레브의 베르베르 사이에 널리 퍼졌다. 757~758년 무렵 수프리파 카리지 베르베르(미크나사 부족)가 사하라 대상로의 북쪽 끝 시질마사를 세우고 삼구 이븐 와술(아부 알카심)이 이끌었다. 미드라르 왕조의 이름은 823~824년 무렵 이곳에 자리 잡은 미드라르 이븐 야사에서 왔으며 두 계보가 어떻게 이어지는지는 분명하지 않다. 시질마사는 사하라 남쪽의 금과 소금, 노예를 지중해 쪽으로 보내는 대상 무역의 길목이어서 번영했다. 한편 이바드파 카리지는 이프리키야에서 아바스에 밀린 뒤 761년 무렵 페르시아 출신 압드 알라흐만 이븐 루스탐이 타헤르트(지금 알제리 티아렛 둘레)를 세웠고, 777년 무렵 이바드파 이맘으로 뽑혔다. 루스탐 이맘국은 공동체가 이맘을 뽑는다는 이바드파의 원칙을 내세웠으나 실제로는 루스탐 가문에서 이맘이 이어졌고, 873~874년 무렵 후계 다툼을 겪었다. 타헤르트는 상인과 학자의 도시로 사하라 교역을 이바드파 상인 망으로 묶었다. 이 두 나라는 베르베르 사람들이 아랍 총독의 지배에서 벗어나 이슬람의 틀 안에서 스스로 지도자를 세운 모습이며, 사하라 이남의 금과 소금 교역이 경제를 떠받쳤다. 타헤르트의 이맘은 이웃 나라들과 사절을 주고받았고 코르도바의 우마이야 아미르와도 우호 관계를 맺었다고 전한다. 루스탐 이맘국은 아글라브 왕조·이드리스 왕조와 맞서거나 손잡으며 힘을 지켰으나 880년대에는 타헤르트 둘레로 줄어들었다. 909년 훗날 파티마 칼리프국을 세우게 되는 아부 압둘라 알시이의 쿠타마 군이 타헤르트를 차지해 이맘국이 끝났고, 이바드파 공동체는 사하라의 우아르글라 쪽으로 옮겨 갔다. 같은 해 시질마사에서는 감옥에 있던 이스마일파 마흐디가 아부 압둘라의 도움으로 풀려났다고 전한다."
  subjects: [midrarid-dynasty, rustamid-imamate, aghlabid-dynasty, idrisid-dynasty, fatimid-caliphate]
  tags: [politics, religion, economy]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "John C. Wilkinson, The Imamate Tradition of Oman (Cambridge University Press, 1987)", "Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)"]

- id: idrisid-fez-788
  year: 788
  endYear: 921
  title:
    ko: "이드리스 왕조와 페스(788~921)"
  summary:
    ko: "786년 메카 가까이 파크흐에서 알리 가문의 후사인 이븐 알리가 아바스 칼리프국의 칼리프 알하디에 맞서 일어났다가 졌다. 이 싸움에서 살아남은 이드리스 이븐 압둘라(무함마드의 외손자 하산의 증손)는 마그레브로 달아나 788년 옛 로마 도시 볼루빌리스, 곧 왈릴리에 자리 잡았다. 그곳의 베르베르 아우라바 부족이 그를 이맘으로 받들어 모로코 북부에 이드리스 왕조가 섰다. 이드리스는 아우라바 부족의 지지를 얻어 이맘으로 추대되었고 주변의 다른 베르베르 부족에게도 영향을 넓혔다. 이 왕조는 알리와 파티마의 후손이 마그레브에 세운 첫 나라로서 이슬람의 정통성을 둘러싼 논쟁의 중심에 있었다. 이드리스는 789년 페스를 세웠다고 전하나 791년 아바스 칼리프 하룬 알라시드가 보냈다는 사자에게 독살되었다는 전승이 있다. 이드리스 2세는 아버지가 죽은 뒤 태어났고 아우라바 사람들의 보호 아래 자라 802년 무렵 이맘으로 추대되었으며 809년 도읍을 왈릴리에서 페스로 옮겼다. 그는 안달루스와 이프리키야에서 온 이주민을 받아들여 페스를 이슬람 학문과 상업의 중심으로 키웠고, 모로코의 이슬람화가 이 시기에 크게 나아갔다. 828년 이드리스 2세가 죽자 아들 무함마드가 땅을 형제들에게 나누어 주어 왕조의 힘이 흩어졌다. 10세기에는 이프리키야의 파티마 칼리프국과 코르도바의 우마이야 사이에 끼여 이드리스 가문은 두 쪽의 가신 노릇을 해야 했다. 9세기 중엽 페스에는 카이라완에서 온 이주민 구역과 안달루스에서 온 이주민 구역이 나뉘어 생겼고, 파티마 알피흐리가 859년 카라위인 모스크를 세웠다고 전한다. 무함마드 이후 알리 1세·야히야 1세·야히야 2세·알리 2세·야히야 3세를 거쳐 야히야 4세에 이르렀고, 파티마의 쿠타마 장군 마살라 이븐 후부스가 페스를 차지해 야히야 4세를 폐위한 뒤 미크나사의 무사 이븐 아비 알아피야에게 서부를 맡겼다(해는 917~922년 사이로 사료마다 갈린다). 이드리스 가문은 리프와 북부 산지로 밀려났다."
  subjects: [idrisid-dynasty, abbasid-caliphate, fatimid-caliphate]
  tags: [politics, religion]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus"]

- id: harun-al-rashid-786
  year: 786
  endYear: 809
  title:
    ko: "하룬 알라시드의 통치와 아바스의 전성기(786~809)"
  summary:
    ko: "하룬 알라시드는 알마흐디의 아들로, 786년 형 알하디가 죽은 뒤 아바스 칼리프국의 다섯째 칼리프에 올랐다. 초기에는 바르마크 가문의 야흐야 이븐 할리드가 재상으로 국정을 이끌었고 그의 아들 파들과 자파르가 요직을 맡았다. 하룬은 796년 무렵 유프라테스 강가의 라카에 궁정을 옮겨 오래 머물렀다. 803년 1월 그는 자파르를 죽이고 바르마크 가문의 권력을 거두었는데 이유는 사료마다 다르다. 동로마 제국과는 해마다 변경에서 싸웠고, 806년 하룬이 직접 소아시아로 들어가 헤라클레아를 공략하자 동로마 제국의 황제 니케포로스 1세가 공물을 약속했다. 이 시기 바그다드는 상업과 학문의 중심으로 커 가고 있었고 하룬의 궁정에는 시인과 음악가, 학자가 모였다. 하룬이 보낸 코끼리 아불 아바스가 800년 황제로 대관한 카롤루스에게 802년 닿았다고 프랑크 연대기는 적는다(「카롤루스의 황제 대관(800)과 아헨 화약(812): 서방 제국과 동로마의 인정」(뒤의 사건)). 하룬은 제국을 아들들에게 나누어 물려줄 계획을 세워 802년 메카 카바에 문서를 걸게 했다. 알아민을 첫째 후계자로, 알마문을 둘째 후계자(호라산 총독)로, 알무타만(알카심)을 셋째 후계자로 정하는 내용이었다. 이 약속은 하룬이 죽은 뒤 내전의 씨앗이 되었다. 하룬의 궁정은 후대에 『천일야화』의 하룬 이야기로 전해졌으나 그 이야기들은 역사와 거리가 먼 설화다. 한편 먼 땅은 이미 칼리프의 손을 떠나고 있었다. 788년 모로코에서는 이드리스가 이맘으로 추대되었고 793년에는 오만에서 이맘국이 서서 총독의 지배를 벗어났다. 800년에는 이프리키야 총독 이브라힘 이븐 알아글라브에게 총독 자리를 세습하게 했다. 809년 3월 하룬은 호라산의 반란을 누르러 가다 투스에서 죽었다."
  subjects: [abbasid-caliphate, byzantine-empire]
  tags: [politics, diplomacy, war]
  sources: ["Hugh Kennedy, The Early Abbasid Caliphate: A Political History (Croom Helm, 1981)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: oman-ibadi-imamate-793
  year: 793
  endYear: 897
  title:
    ko: "오만 이바드 이맘국의 성립과 아바스의 정복(793~897)"
  summary:
    ko: "오만 이바드 이맘국이 선 오만은 아라비아 남동쪽 끝에서 이바드파를 받아들인 땅이다. 이바드파는 카리지파에서 갈라진 온건한 갈래로, 이맘은 혈통이 아니라 공동체가 뽑으며 학식과 덕을 갖춰야 하고 옳지 못하면 물러나야 한다고 본다. 749~751년 무렵 줄란다 이븐 마수드가 첫 이맘으로 뽑혔으나 아바스 칼리프국의 군에게 꺾였다. 793년 무함마드 이븐 아비 아판이 이맘으로 뽑혀 둘째 이맘국이 서고 오만 내륙의 니즈와가 중심이 되었다. 801년 무렵에는 와리스 이븐 카으브 알카루시가 이맘이 되었다. 9세기 내내 이맘들은 내륙 부족 연합의 지지를 받아 오만을 다스렸다. 893년 아바스 칼리프국의 칼리프 알무타디드의 군이 오만을 정복해 마지막 이맘 아잔 이븐 타밈이 죽고 둘째 이맘국이 끝났고 893~896년에는 아바스 총독이 다스렸다. 그러나 897년 이바드파 공동체가 새 이맘을 세워 셋째 이맘국이 서면서 오만은 다시 이맘국의 땅이 되었다. 오만 내륙의 이맘국은 해안의 항구 도시들을 통해 인도양 교역과 이어져 있었다. 오만의 이바드파 상인은 인도와 동아프리카 해안으로 퍼져 공동체를 넓혔다고 본다. 이맘은 부족 지도자와 학자의 협의로 뽑혔고, 이맘이 공동체의 정의를 지키지 못하면 폐위할 수 있다는 원칙은 때로 이맘의 권위를 약하게 하고 이맘국을 흔들었다. 오만에는 이바드파 말고도 수니파 주민과 해안의 상인 사회가 있었고 이맘국의 힘이 해안까지 미치는지는 시기마다 달랐다. 이바드파 이맘국은 오만의 정치 질서를 이웃 이슬람 나라들과 다르게 만들었고 오만 사람들의 정체성에도 이바드파가 깊이 새겨졌다. 오만 이바드파의 이맘 제도는 마그레브의 루스탐 이맘국과 같은 이바드파 신학을 공유하며 뒤에도 오만 정치의 바탕이 되었다."
