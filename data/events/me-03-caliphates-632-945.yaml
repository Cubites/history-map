- id: karbala-680
  year: 680
  endYear: 687
  title:
    ko: "카르발라(680)와 시아의 형성(680~687)"
  summary:
    ko: "680년 무아위야가 죽고 야지드 1세가 칼리프가 되자 알리의 아들 후사인은 충성 맹세를 거부하고 메디나에서 메카로 옮겼다. 쿠파 사람들이 편지로 그를 이맘으로 청하자 후사인은 사촌 무슬림 이븐 아낄을 먼저 보내고 가족과 추종자 일흔 명 안팎을 이끌고 쿠파로 향했다. 쿠파 총독 우바이드 알라 이븐 지야드가 무슬림을 죽이고 도시를 눌러 지지가 사라졌다. 680년 10월 10일(무하람월 10일, 아슈라) 후사인 일행은 유프라테스 서안의 카르발라에서 우마르 이븐 사드가 이끈 수천 명의 우마이야 칼리프국 군에게 둘러싸여 후사인과 남자들이 거의 다 죽었다. 여자와 아이들은 쿠파를 거쳐 다마스쿠스로 끌려갔다가 뒤에 야지드가 메디나로 돌려보냈다고 전한다. 이 일은 알리를 따르던 이들에게 깊은 죄책감을 남겼다. 684년 '속죄자들'(타와분)이 쿠파를 떠나 우마이야 군과 싸우다 쓰러졌고, 685~687년에는 무크타르 이븐 아비 우바이드가 쿠파에서 알리의 아들 무함마드 이븐 알하나피야를 이맘으로 내세워 후사인의 복수를 내걸고 비아랍 개종자들까지 모아 우마이야 쪽을 쳤으나 687년 바스라에서 온 이븐 알주바이르 쪽 무스압의 군에게 죽었다. 후사인의 머리가 쿠파 총독 앞과 다마스쿠스의 야지드 앞에 보내졌다는 이야기가 전하며 사료마다 세부가 다르다. 야지드가 이 일을 얼마나 지시했는지는 학자들 사이에서도 갈린다. 683년에는 메디나 사람들이 야지드에게 반기를 들었으나 알하라 싸움에서 우마이야 군에게 꺾였고 도시가 약탈당했다. 뒤에 시아파는 아슈라의 애도 의례와 알리의 후손을 이맘으로 받드는 교리를 다듬어 갔고, 수니파는 후사인을 순교한 무함마드의 외손자로 존경하면서 야지드의 책임을 둘러싸고 의견이 갈린다."
  subjects: [umayyad-caliphate]
  tags: [war, religion, politics]
  sources: ["Wilferd Madelung, The Succession to Muhammad: A Study of the Early Caliphate (Cambridge University Press, 1997)", "G. R. Hawting, The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (Routledge, 1986)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]
