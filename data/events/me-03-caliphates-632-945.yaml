- id: aghlabid-ifriqiya-800
  year: 800
  endYear: 909
  title:
    ko: "아글라브 왕조와 이프리키야(800~909)"
  summary:
    ko: "800년 아바스 칼리프국의 칼리프 하룬 알라시드는 이프리키야 총독이던 이브라힘 이븐 알아글라브에게 총독 자리를 세습하게 하고 해마다 정해진 금액(80만 디르함이라는 수치가 전한다)을 바치게 했다. 이로써 카이라완을 근거로 한 아글라브 왕조가 섰다. 아미르는 금요 예배와 화폐에 칼리프의 이름을 쓰면서 사실상 독립해 다스렸다. 이브라힘은 카이라완 가까이에 새 궁정 도시 알아바시야를 세웠다. 이브라힘 1세(800~812)와 아들 압둘라 1세(812~817)에 이어 오른 지야다트 알라 1세(817~838) 때 군인의 반란을 누르고 827년 시칠리아 정복을 시작했다(「아랍의 시칠리아 정복과 크레타(827~902), 바리 토후국과 루도비코 2세(847~871)」(뒤의 사건)). 시칠리아는 뒤에 아글라브 아미르가 보낸 총독들이 다스렸고 909년 아글라브 왕조가 무너진 뒤에도 시칠리아 토후국으로 이어졌다. 836년 무렵 지야다트 알라 1세가 카이라완 대모스크를 오늘의 모습으로 크게 다시 지었다. 학자 사흐눈이 정리한 말리크 법학파의 『무다우와나』가 이프리키야에서 마그레브 서쪽과 뒤에 안달루스까지 말리크파가 퍼지는 바탕이 되었다. 이 왕조는 카리지파 베르베르, 이웃한 루스탐 이맘국과 맞서는 한편 동로마 제국과 시칠리아·남이탈리아에서 싸웠다. 아글라브 왕조의 군대는 아랍계 군인과 노예 병사, 베르베르 부족병으로 이루어졌고 아랍 군인의 불만과 반란이 자주 일어났다. 재정은 이프리키야의 올리브와 곡물 농업, 지중해와 사하라 교역, 시칠리아 원정의 전리품에 기댔다. 지야다트 알라 1세 뒤 알아글라브·무함마드 1세·아흐마드·지야다트 알라 2세·무함마드 2세를 거쳐 이브라힘 2세(875~902)가 올랐다. 이브라힘 2세는 시칠리아를 마저 공략했으나 902년 칼라브리아 원정 중에 죽었고, 아들 압둘라 2세가 이었으나 903년 암살되어 그의 아들 지야다트 알라 3세가 올랐다. 지야다트 알라 3세는 909년 3월 쿠타마 베르베르를 이끈 이스마일파 선교사 아부 압둘라 알시이에게 라카다를 내주고 동쪽으로 달아나 왕조가 끝났다. 이프리키야는 파티마 칼리프국에 넘어갔다."
  subjects: [aghlabid-dynasty, abbasid-caliphate, sicily-emirate, byzantine-empire, rustamid-imamate, fatimid-caliphate]
  tags: [politics, war, religion]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)"]

- id: mamun-civil-war-809
  year: 809
  endYear: 833
  title:
    ko: "알아민과 알마문의 내전, 알마문의 칼리프국과 지방 총독 왕조의 시작(809~833)"
  summary:
    ko: "809년 하룬이 죽자 칼리프 알아민과 호라산 총독 알마문 사이에 아버지가 정한 상속이 어긋나기 시작했다. 알아민이 810년 자기 아들을 후계자로 세우려 하자 알마문이 이를 거부했고 811년 전쟁이 터졌다. 알마문의 장군 타히르 이븐 후사인이 811년 라이에서 알아민의 군을 크게 이겼고 812~813년 바그다드를 포위했으며, 알아민은 813년 9월 붙잡혀 죽었다. 이 싸움으로 바그다드는 큰 피해를 입었다. 내전 동안 바그다드 시민들은 스스로 무기를 들고 알마문의 군에 맞서기도 했다. 알마문 시기에 아바스 칼리프국은 먼 땅의 총독에게 세습 권한을 내주고 그 대신 세금과 충성을 받는 방식으로 제국을 다스리는 길에 접어들었다. 알마문은 메르브에 머물며 칼리프가 되었고 817년 알리 가문의 알리 알리다를 후계자로 지명해 시아파와 화해하려 했다. 이에 바그다드의 아바스 가문이 반발해 이브라힘 이븐 알마흐디를 칼리프로 세웠고, 알리 알리다가 818년 죽자 알마문은 819년 바그다드로 돌아왔다. 알마문은 821년 타히르를 호라산 총독에 앉혔고 타히르 가문은 호라산을 세습하며 이름뿐인 아바스의 종주를 인정했다(타히르 왕조). 라피 이븐 알라이스의 반란(806~810년 무렵)을 누르는 데 공을 세운 사만 가문의 네 형제 누흐·아흐마드·야흐야·일리야스에게 819년 무렵 호라산 총독이 사마르칸트·페르가나·샤시·헤라트를 맡겼고, 이는 사만 왕조의 출발점이 되었다. 같은 때 예멘의 반란을 누르러 알마문이 보낸 무함마드 이븐 지야드는 티하마에 자비드를 세워 지야드 왕조를 열었다. 알마문은 학문을 후원했으나 833년 무타질라 신학을 국가가 내세워 쿠란이 창조되었다는 교리를 관리와 법관에게 강요하기 시작했다(미흐나). 알마문은 833년 8월 동로마 원정 중 죽었다."
  subjects: [abbasid-caliphate, tahirid-dynasty, samanid-empire, ziyadid-dynasty]
  tags: [war, politics, religion]
  sources: ["Hugh Kennedy, The Early Abbasid Caliphate: A Political History (Croom Helm, 1981)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)"]
  places: [{ name: 바그다드 포위, at: [44.37, 33.33], year: 813 }]

- id: baghdad-translation-movement-754
  year: 754
  endYear: 850
  title:
    ko: "바그다드의 번역 운동과 지혜의 집(754~850)"
  summary:
    ko: "아바스 칼리프국은 그리스·페르시아·인도의 학문을 아랍어로 옮기는 큰 작업을 후원했다. 알만수르 때 바그다드가 서면서 사산 궁정의 문헌과 인도 천문학서가 번역되었고, 이븐 알무카파가 팔레비어 우화집 『칼릴라와 딤나』를 아랍어로 옮겼다고 전한다. 종이를 만드는 법은 751년 탈라스 전투에서 사로잡힌 당 포로가 사마르칸트에 전했다는 전승이 있으나 학계는 이를 의심하며 종이가 그 전부터 중앙아시아에서 쓰였다고 본다(「고선지의 서역 원정과 탈라스 전투(747~755)」(앞의 사건)). 하룬 때 바그다드에 종이 공방이 생겼다고 한다. 값싼 종이는 책을 베끼는 일을 크게 늘렸다. 알마문은 바그다드의 '지혜의 집'(바이트 알히크마, 책을 모으고 옮기는 기관)을 후원해 번역을 이끌었다고 알려지나, 이 기관의 규모와 성격은 뒤에 부풀려졌다는 견해가 있다. 번역을 이끈 이로는 네스토리우스파 기독교도 의사 후나인 이븐 이스하크가 이름 높고, 갈레노스와 히포크라테스, 플라톤과 아리스토텔레스의 글이 그와 제자들의 손을 거쳐 아랍어로 옮겨졌다. 이 번역의 큰 줄기는 850년 무렵까지 이루어졌다. 바누 무사 형제 같은 부유한 후원자들이 동로마 제국 영토에서 그리스어 사본을 구해 오게 했다. 알콰리즈미는 인도 숫자와 방정식 풀이를 다룬 책을 써서 대수학(알자브르)의 이름이 되었고, 알킨디는 그리스 철학을 이슬람 사상과 맞추려 했다. 이 작업은 이슬람 세계의 의학·천문학·수학·철학의 바탕이 되었고 뒤에 아랍어에서 라틴어로 옮겨져 유럽의 학문에도 영향을 주었다. 번역과 학문의 후원에는 칼리프의 궁정뿐 아니라 바그다드의 관료와 상인 가문의 개인 후원도 컸다. 번역은 칼리프와 관료의 필요, 이슬람 이전 학문의 자산, 기독교도·유대교도·조로아스터교도 학자의 협력이 겹쳐 이루어졌다."
  subjects: [abbasid-caliphate, byzantine-empire]
  tags: [culture, society]
  sources: ["Dimitri Gutas, Greek Thought, Arabic Culture: The Graeco-Arabic Translation Movement in Baghdad and Early ʿAbbāsid Society (Routledge, 1998)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)"]

- id: yemen-ziyadid-zaydi-819
  year: 819
  endYear: 897
  title:
    ko: "예멘의 지야드 왕조와 유피르 왕조, 자이드파 이맘국의 성립(819~897)"
  summary:
    ko: "예멘은 이슬람 이전에 힘야르와 악숨의 지배를 겪고 무함마드 시기에 공동체에 들어온 땅이다. 아바스 시기 중앙의 힘이 약해지자 예멘은 지역별로 쪼개졌다. 819~820년 무렵 알마문이 보낸 무함마드 이븐 지야드가 홍해 쪽 티하마의 반란을 누르고 자비드를 세워 지야드 왕조를 열었다. 지야드 왕조는 아바스 칼리프국의 칼리프를 받들면서 사실상 독립해 자비드를 도읍으로 삼았고, 티하마는 홍해 교역과 학문의 중심이 되었다. 자비드에는 법학과 신학을 가르치는 학교가 서서 예멘 학문의 중심으로 자랐다. 예멘의 땅은 티하마 평야와 중부 고지, 북쪽 산악, 하드라마우트로 나뉘어 중앙 권력이 닿기 어려웠고 이 지형이 지역 왕조들이 따로 서는 바탕이 되었다. 한편 예멘 고지에서는 847년 무렵 힘야르 계통을 내세운 유피르 가문(유피르 이븐 아브드 알라흐만)이 사나 북서쪽의 산성을 근거지로 일어나 사나와 주변 고지를 다스리는 유피르 왕조가 되었고, 형식으로는 아바스 칼리프를 받들면서도 한때 자비드의 지야드 군주에게 자신의 종주권을 인정하게 했다. 북쪽 사다에서는 부족 사이의 다툼이 길어지자 897년 알리의 후손 알하디 일라 알하크 야흐야 이븐 알후사인이 부족 지도자들의 초청으로 사다에 들어와 이맘으로 추대되었다. 알하디는 자이드파 학자 알카심 알라시의 손자로, 이맘은 알리와 파티마의 후손 가운데 학식과 무력을 갖춘 사람이 나서서 선언하고 부족이 지지할 때 선다는 자이드파 이맘국의 틀을 만들었다. 이 이맘국은 사다 둘레에서 부족 분쟁을 중재하는 역할로 뿌리내렸다. 세 세력의 근거지인 티하마와 사나, 사다는 서로 다른 지형과 부족 사회 위에 서 있었다. 이 세 세력은 한 곳에 모이지 못한 채 서로 다투었다."
  subjects: [ziyadid-dynasty, yufirid-dynasty, zaydi-imamate, abbasid-caliphate]
  tags: [politics, religion]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Wilferd Madelung, The Succession to Muhammad: A Study of the Early Caliphate (Cambridge University Press, 1997)"]

- id: samarra-turkish-guards-833
  year: 833
  endYear: 861
  title:
    ko: "알무타심의 투르크 군인과 사마라 천도(833~861)"
  summary:
    ko: "833년 알마문이 죽고 동생 알무타심이 아바스 칼리프국의 칼리프가 되었다. 알무타심은 중앙아시아에서 사들인 투르크 노예 군인(굴람)을 대규모로 모아 직속 군대로 삼았는데, 이들이 바그다드 주민과 자주 부딪히자 836년 바그다드에서 티그리스강을 따라 120킬로미터쯤 올라간 곳에 사마라를 세워 도읍을 옮겼다. 사마라는 50년 넘게 칼리프의 도읍이었고 궁궐과 병영, 대모스크가 들어섰다. 알무타심은 837~838년 아제르바이잔에서 오래 저항한 바박(후라미야파)을 쳐서 이겼고 838년 동로마 제국의 아모리온을 함락시켰다. 알와티크(842~847)에 이어 알무타와킬(847~861)은 알마문 때부터 이어진 미흐나를 848~851년 무렵 거두고 수니 법학자들과 화해했으며, 사마라에 나선형 첨탑 말위야가 있는 대모스크를 세웠다. 사마라는 바그다드와 달리 칼리프와 군인만을 위한 새 도시여서 투르크·페르가나·이집트 병사 같은 출신별 구역이 나뉘어 있었다고 한다. 도시 건설에 든 큰 비용은 재정에 부담이 되었다. 이 시기 칼리프국의 동쪽에서는 타히르 왕조가 호라산을 세습해 다스렸고, 이집트와 이프리키야, 예멘에서도 총독들이 점점 자립의 길을 걸었다. 투르크 군인 지휘관들은 칼리프보다 강해졌다. 861년 12월 알무타와킬은 아들 알문타시르와 투르크 장군들의 음모로 암살되었다. 칼리프가 군인에게 기대는 구조는 투르크 군인의 봉급과 정복의 전리품에 달려 있었다. 이 군대를 유지할 재정은 점점 기울었고 지방 총독과 장군의 세력이 커졌다. 알무타와킬은 투르크 장군들의 힘을 줄이려다 반감을 샀다고 한다. 이로써 장군들이 칼리프를 세우고 폐하는 사마라의 혼란이 시작되었다."
  subjects: [abbasid-caliphate, tahirid-dynasty, byzantine-empire]
  tags: [politics, war]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Hugh Kennedy, The Armies of the Caliphs: Military and Society in the Early Islamic State (Routledge, 2001)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: samarra-anarchy-861
  year: 861
  endYear: 892
  title:
    ko: "사마라의 혼란과 알무와파크, 지방 총독의 자립(861~892)"
  summary:
    ko: "861년 알무타와킬이 암살된 뒤 약 10년 동안 투르크 장군들이 칼리프를 세우고 폐했다. 알문타시르(861~862)가 반년 만에 죽은 뒤 알무스타인(862~866)이 즉위해 투르크 군의 압력을 피해 바그다드로 옮겼다가 폐위되었고, 알무타즈(866~869)와 알무흐타디(869~870)도 차례로 폐위되어 죽었다. 재정이 바닥나 군인에게 봉급을 제때 주지 못한 일이 되풀이되었다. 870년 즉위한 알무타미드(870~892)는 이름뿐인 칼리프였고, 실권은 동생 알무와파크가 쥐고 이라크를 지켰다. 이 시기 아바스 칼리프국의 군대는 아랍 부족병이 아니라 투르크 노예 군인이 중심이었고 이들의 봉급은 이라크와 이란의 세금으로 충당되었다. 세금이 줄면 봉급이 밀리고 군인이 반란을 일으키는 악순환이 이어졌으며, 지방 총독들은 칼리프에게 보내는 몫을 줄이거나 끊었다. 이 틈에 총독들이 자립했다. 이란 서부 카라지와 이스파한에서는 둘라프 왕조가 사마라의 혼란 때부터 사실상 독립한 채 칼리프를 받들었고, 동쪽 시스탄에서는 사파르 왕조의 야쿠브 이븐 알라이스가 일어났다. 이집트에서는 868년 툴룬 왕조의 아흐마드 이븐 툴룬이 자리를 잡았고, 이라크 남부에서는 869년 잔지 반란이 터졌다. 한편 호라산에서는 타히르 왕조가 873년 사파르 왕조에 무너졌다. 알무와파크는 잔지 반란을 883년 누르는 등 칼리프국을 지키는 군인 정치가 노릇을 했다. 알무와파크는 투르크 군인과 아프리카 출신 군인, 이란 출신 군인을 아우르는 직속 군대를 키웠고 사파르 왕조 야쿠브의 바그다드 진군(876)을 막아 냈다. 그의 아들 알무타디드가 892년 칼리프가 되어 도읍을 바그다드로 확정했다."
  subjects: [abbasid-caliphate, dulafid-dynasty, saffarid-dynasty, tulunid-dynasty, tahirid-dynasty]
  tags: [politics, society]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: saffarid-yaqub-861
  year: 861
  endYear: 902
  title:
    ko: "야쿠브 이븐 알라이스와 사파르 왕조(861~902)"
  summary:
    ko: "구리 장인(사파르) 집안의 야쿠브 이븐 알라이스는 시스탄에서 치안을 지키던 의용 무리(아이야룬)의 우두머리가 되어 861년 시스탄을 장악하고 아미르가 되었다. 그는 아바스 칼리프국의 칼리프를 받든다고 내세우면서 동쪽의 헤라트와 보스트 쪽으로, 서쪽으로는 케르만(867년 무렵)과 파르스(869~870년 무렵)로 땅을 넓혀 사파르 왕조를 이루었다. 사파르 군대는 시스탄의 의용 무리 출신 병사들로 이루어졌고 야쿠브는 병사들과 같은 음식을 먹으며 지냈다는 일화가 전한다. 이 정복으로 이란 동부와 남부의 대부분이 아바스의 직접 통제 밖으로 나갔다. 873년에는 니샤푸르에 들어가 타히르 왕조의 마지막 군주 무함마드 이븐 타히르를 사로잡아 타히르 왕조를 끝내고 호라산을 차지했다. 칼리프에게서 호라산 총독 임명을 받지 못하자 876년 바그다드로 진군했으나 디르 알아쿨 싸움에서 알무와파크에게 졌고, 879년 후제스탄의 군디샤푸르에서 죽었다. 동생 아므르 이븐 알라이스(879~901)는 칼리프와 화해해 호라산과 파르스, 케르만, 시스탄, 신드의 총독으로 인정받았다. 그러나 트란스옥시아나를 다스리던 사만 가문의 이스마일 이븐 아흐마드와 호라산을 놓고 부딪혀 900년 발크 가까이에서 져 사로잡혔고, 바그다드로 끌려가 902년 처형되었다. 호라산은 사만 왕조에 넘어갔고 사파르 가문의 땅은 시스탄과 파르스·케르만 일부로 줄어들었다. 야쿠브의 군사 정복은 이란 고원 동부와 남부에서 아랍 총독과 지방 귀족의 옛 질서를 흔들었다. 야쿠브가 궁정시인에게 아랍어를 못 알아듣는 자기 앞에서 페르시아어로 시를 지으라 했다는 일화가 전하는데, 이는 페르시아어가 다시 글말로 쓰이던 분위기를 보여 준다."
  subjects: [saffarid-dynasty, tahirid-dynasty, abbasid-caliphate, samanid-empire]
  links:
    - { from: saffarid-dynasty, to: tahirid-dynasty, note: "니샤푸르 점령과 타히르 왕조 정복 (873)" }
    - { from: samanid-empire, to: saffarid-dynasty, note: "발크 전투와 호라산 병합 (900)" }
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: alid-tabaristan-864
  year: 864
  endYear: 928
  title:
    ko: "타바리스탄의 자이드파 알리 가문 토후국(864~928)"
  summary:
    ko: "9세기 중엽 타히르 왕조의 총독들이 호라산과 함께 타바리스탄을 다스리며 세금을 무겁게 걷고 토지를 빼앗자 산지 사람들의 불만이 커졌다. 864년 하산 이븐 자이드가 아물에서 자이드파 이맘으로 추대되어 타히르 가문 총독을 몰아냈고, 이로써 알리 가문의 자이드파 이맘들이 타바리스탄과 길란에 세운 타바리스탄 알리 가문 토후국이 섰다. 하산(864~884)은 알다이 일라 알하크('진리로 부르는 이')라 불렸고, 869년과 874년의 침공을 피해 다일람으로 잠시 물러난 일도 있었다. 자이드파는 알리와 파티마의 후손 가운데 무력으로 일어나 공동체를 이끌 자격을 갖춘 사람을 이맘으로 보는 시아파의 한 갈래다. 타바리스탄의 이맘들은 법학과 신학에서 독자 전통을 세웠고 이맘 아래에서 지방 법관과 징세 체계도 갖추었다. 884년 하산이 죽은 뒤 동생 무함마드 이븐 자이드가 이었으나 900년 호라산으로 나아가려다 사만의 이스마일이 보낸 군에게 져서 죽었고, 사만 왕조가 타바리스탄을 차지하자 알리 가문은 다일람으로 피했다. 914년 하산 이븐 알리 알웃루쉬(나시르)가 돌아와 타바리스탄을 되찾고 다일람 사람들을 자이드파로 이끌었다. 917년 그가 죽은 뒤 알웃루쉬의 아들들과 하산 이븐 알카심 알다이가 번갈아 이맘을 칭했고 다일람 장수들의 다툼으로 나라가 약해졌고, 928년 무렵 사만 왕조와 아바스 칼리프의 이름이 다시 예배에 오르면서 알리 가문의 독립 통치가 끝났다. 산지의 영주들과 다일람 사람들이 알리 가문의 군대에 합류하면서 이슬람이 카스피해 남쪽 산악까지 퍼졌고, 자이드파는 이 지방과 예멘에서 오래 이어지는 시아파의 한 갈래가 되었다. 이 지방에는 이슬람 이전의 조로아스터교 전통이 오래 남아 있어 알리 가문의 포교는 지방 영주와 협력하는 가운데 진행되었다."
  subjects: [alid-tabaristan, tahirid-dynasty, samanid-empire]
  links:
    - { from: samanid-empire, to: alid-tabaristan, note: "타바리스탄 정복과 알리 가문의 망명 (900)" }
  tags: [politics, religion]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Wilferd Madelung, Religious Trends in Early Islamic Iran (Bibliotheca Persica, 1988)"]

- id: tulunid-egypt-868
  year: 868
  endYear: 905
  title:
    ko: "아흐마드 이븐 툴룬과 툴룬 왕조(868~905)"
  summary:
    ko: "툴룬 왕조를 연 투르크 군인 출신 아흐마드 이븐 툴룬(툴룬은 부하라에서 칼리프 알마문에게 바쳐진 노예였던 아버지의 이름이다)은 868년 9월 이집트 총독의 부총독으로 푸스타트에 들어왔다. 사마라의 혼란 속에 아바스 칼리프국의 통제가 약해진 때였다. 그는 투르크 군에 더해 노예 병사들로 직속 군대를 만들고 이집트의 세금을 거두어 일부만 칼리프에게 보냈다. 아흐마드는 이집트 농업을 되살리려 관개를 정비했다고 전하며, 이집트의 풍부한 세수는 시리아 원정과 대규모 건설을 뒷받침했다. 870년 푸스타트 북동쪽에 새 도읍 알카타이를 지었고 876~879년 그곳에 이븐 툴룬 모스크를 세웠다. 878년 시리아 남부를 차지해 이집트와 시리아를 함께 다스렸다. 아흐마드는 알무와파크와 갈등을 겪었고 877년 칼리프국이 군대를 보내 압박했으나 이듬해 시리아를 차지해 오히려 힘을 넓혔다. 금요 예배와 화폐에 칼리프의 이름을 두었지만 사실상 세습 왕조의 시작이었다. 884년 아흐마드가 죽고 아들 쿠마라와이가 이었으며, 886년 12월 아바스 쪽이 쿠마라와이를 이집트와 시리아 총독으로 인정하고 30년 동안 후손에게 물려줄 수 있게 했다(해마다 공물을 바치는 조건). 쿠마라와이는 궁정을 호화롭게 꾸며 재정이 기울었다. 896년 쿠마라와이가 죽은 뒤 아들 자이시와 하룬이 이었으나 군인들이 실권을 쥐었고, 알무타디드가 북시리아를 되찾아 알레포·킨나스린이 칼리프 손에 돌아갔다(898년 무렵). 아흐마드의 군대는 투르크 군인과 아프리카 출신 흑인 병사, 그리스 출신 병사로 이루어져 칼리프의 군대와 따로 선 힘이 되었다. 마지막 아미르 샤이반 때인 905년 1월 아바스 장군 무함마드 이븐 술라이만이 푸스타트에 들어와 툴룬 가문을 바그다드로 끌고 갔고, 이집트는 다시 칼리프 직할이 되었다."
  subjects: [tulunid-dynasty, abbasid-caliphate]
  links:
    - { from: abbasid-caliphate, to: tulunid-dynasty, note: "푸스타트 점령과 이집트 직할 회복 (905)" }
  tags: [politics, economy]
  sources: ["The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)"]

- id: zanj-revolt-869
  year: 869
  endYear: 883
  title:
    ko: "잔지 반란(869~883)"
  summary:
    ko: "이라크 남부 바스라 둘레의 소금기 낀 늪지에서는 동아프리카 출신 흑인 노예(잔지)들이 땅의 소금 껍질을 걷어내는 고된 노동을 했다. 869년 9월 알리 이븐 무함마드가 이들을 이끌고 일어났다. 그는 자신이 알리 가문의 후손이라 내세웠고 카리지파의 평등 사상을 빌렸다고 하나, 반란군도 포로를 노예로 부렸다. 이들은 동아프리카 해안에서 사들여진 사람들이었고 먹는 것과 처우가 매우 나빴다고 사료는 적는다. 알리 이븐 무함마드는 노예들에게 자유와 땅을 약속했고 반란군에는 노예뿐 아니라 가난한 농민과 일부 베두인도 합류했다고 하며, 잔지가 참가자의 다수였는지를 포함해 구성은 학자마다 달리 본다. 반란은 바스라 남쪽 늪지에서 번져 871년 바스라를 약탈해 큰 학살과 파괴를 일으켰고, 와시트와 아흐와즈 같은 도시도 한때 반란군 손에 들어갔다. 지도자 알리는 스스로 아미르를 칭하고 화폐를 만들었다고 전한다. 반란군은 알무크타라라는 요새 도시를 근거지로 삼아 칼리프의 군대를 여러 번 꺾었다. 칼리프 쪽 사료는 반란군의 잔혹함을 강조하지만 진압군도 포로와 주민에게 가혹했다고 전한다. 알무타미드의 동생 알무와파크가 879년 말부터 아들 알무타디드와 함께 반격에 나서 881년 요새를 포위해 883년 8월 알무크타라가 무너지고 알리가 죽어 반란이 끝났다. 반란의 규모와 노예의 수는 사료가 정확히 알려 주지 않고 사료가 전하는 사망자 수도 50만에서 250만 명까지 크게 갈려 현대 학자들은 크게 부풀려졌다고 보며, 사료도 칼리프 쪽 기록이 대부분이다. 이 반란은 같은 시기 사파르 왕조의 진군과 함께 아바스 칼리프국을 안팎에서 흔들었고 툴룬 왕조와 사파르 왕조가 자리를 굳힐 틈을 키웠다. 알리 이븐 무함마드는 바스라 남쪽 늪지의 갈대밭을 근거로 삼아 칼리프 군의 접근을 어렵게 했다. 이 반란으로 이라크 남부의 농업과 바스라의 번영이 크게 해쳐졌고 칼리프국의 재정이 기울었다."
  subjects: [abbasid-caliphate]
  tags: [war, society]
  sources: ["Alexandre Popovic, The Revolt of African Slaves in Iraq in the 3rd/9th Century (Markus Wiener, 1999)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: mutadid-muktafi-recovery-892
  year: 892
  endYear: 908
  title:
    ko: "알무타디드와 알무크타피의 회복(892~908)"
  summary:
    ko: "892년 즉위한 알무타디드(892~902)는 사마라의 혼란 속에 흩어진 칼리프의 권위를 되찾으려 했다. 그는 도읍을 바그다드로 확정하고 재정을 다잡아 군대를 유지하며 자립한 총독들을 하나씩 눌렀다. 893년에는 쿠마라와이가 이집트와 시리아를 맡는 것을 다시 인정하고 해마다 공물을 받기로 했다. 이 시기 아바스 칼리프국은 이라크와 서부 이란(지발·라이·이스파한)을 직접 다스리는 땅으로 되돌렸고 이집트와 시리아는 툴룬 가문의 아미르가 조공을 바치는 조건으로 이어서 맡았으며, 호라산과 이란 동부는 사만 왕조의 몫이었다. 893년에는 오만에 군을 보냈고, 896년에는 이스파한의 둘라프 왕조를 몰아내고 아바스 총독을 앉혔다. 마지막 둘라프 가문 사람은 897~898년 싸움에서 죽었다고 전한다. 900년 호라산에서는 사파르 왕조의 아므르가 사만 왕조의 이스마일에게 져서 사로잡혀 바그다드로 압송되었다. 한편 899년 바레인 지방에서 카르마트 국가가 일어나 906년 순례 행렬을 습격하는 등 칼리프국의 새 위협이 되었다. 알무크타피(902~908)는 905년 장군 무함마드 이븐 술라이만을 보내 툴룬 왕조를 무너뜨리고 이집트를 다시 칼리프가 직접 다스리는 땅으로 되돌렸다. 사파르 가문은 호라산을 사만에 잃고 파르스·케르만·시스탄으로 줄어들었다. 이 회복은 칼리프 개인의 능력에 기대어 짧았다. 알무타디드 시기 바그다드에서는 궁전과 관청을 새로 짓는 사업이 활발했고, 궁정 관료제는 재상과 재정 관청, 우편·정보 기관으로 짜여 있었다. 이 시기 바그다드는 인구가 늘고 시장과 학문이 번성해 이슬람 세계에서 가장 큰 도시로 자랐다. 908년 알무크타피가 죽고 열세 살의 알무크타디르가 칼리프에 올랐다."
  subjects: [abbasid-caliphate, dulafid-dynasty, saffarid-dynasty, samanid-empire, tulunid-dynasty, qarmatian-state]
  tags: [politics, war]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)"]

- id: qarmatian-bahrain-899
  year: 899
  endYear: 930
  title:
    ko: "카르마트 국가와 메카의 흑석 탈취(899~930)"
  summary:
    ko: "카르마트는 이스마일파에서 갈라진 한 갈래다. 쿠파 둘레에서 함단 카르마트가 이끈 포교가 퍼진 뒤, 이스마일파의 이맘 계승을 둘러싼 갈등 속에서 899년 일부 신도들이 이맘의 자리를 주장하는 우바이드 알라(뒤의 파티마 칼리프국의 첫 칼리프)를 인정하지 않고 갈라섰다. 아부 사이드 알잔나비는 899년까지 아라비아 동부 알하사를 비롯한 바레인 지방 대부분을 장악하고 903년 무렵 하자르를 차지해 카르마트 국가를 세웠다. 이 공동체는 재산을 함께 쓰고 신도끼리 평등하게 대하는 이상을 내세웠다고 전하나, 학자들은 얼마나 실천했는지에 의견이 갈린다. 906년 카르마트가 이라크로 돌아가던 순례 행렬을 습격해 많은 사람이 죽었다(사료가 적은 수는 수천에서 2만 명까지 크게 다르고 부풀려졌을 수 있다). 아부 사이드가 913년 무렵 피살되자 큰아들 아부 알카심 사이드가 잠시 이었고, 막내 아부 타히르 알잔나비가 923년 무렵 권력을 쥐어 그해 바스라를 습격했다. 이어 926~927년 쿠파를 약탈하고 928년 바그다드 둘레까지 나아가 위협했다. 930년 1월 아부 타히르는 순례철의 메카를 쳐서 순례자를 죽이고 카바 신전의 흑석을 뽑아 바레인 지방으로 가져갔다. 카르마트 공동체는 임명된 대리인들이 생산과 분배를 맡았다고 하나 적대하는 쪽 사료의 서술이라 확실하지 않고, 바레인 지방의 농업과 대상 교역, 순례 행렬에서 받는 몫으로 재정을 마련했다고 전한다. 이들은 아바스 칼리프국과 수니파를 불의한 지배자로 보았고 바그다드를 위협해 칼리프에게 공물을 요구했다고 전한다. 메카 습격 뒤 몇 해 동안 순례가 끊기다시피 했다. 카르마트의 바레인 지방은 대추야자 농업과 진주잡이, 걸프 교역이 이어지는 땅이었고 이 부가 군사력의 바탕이 되었다. 카르마트의 평등 이상은 가난한 농민과 상인에게 호소력이 있었다고 한다. 이 일은 아바스 칼리프국과 파티마 칼리프국 모두를 향한 도전이었고 이슬람 세계에 큰 충격을 주었다."
  subjects: [qarmatian-state, abbasid-caliphate, fatimid-caliphate]
  tags: [war, religion]
  sources: ["Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)"]

- id: hamdanid-mosul-aleppo-890
  year: 890
  endYear: 945
  title:
    ko: "함단 왕조: 모술에서 알레포까지(890~945)"
  summary:
    ko: "함단 왕조는 아랍 타글리브 부족의 함단 이븐 함둔이 890년대 초 마르딘 둘레에서 세력을 이룬 데서 시작되었다. 함단은 892년 무렵 마르딘을 차지해 근거지로 삼았으나 아바스 칼리프국 군에 꺾였다. 그의 아들 후사인과 형제들은 아바스 군의 장군이 되었고, 아부 알하이자 압둘라 이븐 함단이 905~906년 무렵 모술 총독이 되면서 이 가문의 근거지가 모술로 옮겨졌다. 929년 압둘라의 아들 나시르 앗다울라 하산이 모술과 디야르 라비아 총독이 되어 자지라 북부를 다스렸고, 아바스 칼리프가 약해지자 바그다드 정치에도 끼어들었다. 942년 봄부터 943년 5월까지 나시르 앗다울라는 바그다드에서 아미르 알우마라 자리에 있었으나 투르크 군인들의 반란으로 쫓겨났다. 그의 동생 사이프 앗다울라(알리)는 944~945년 무렵 알레포를 차지해 북시리아에 함단 가문의 두 번째 나라를 세웠다. 이 땅을 두고 이집트의 이흐시드 왕조 무함마드 이븐 투그즈와 다퉈 사이프는 다마스쿠스까지 나아갔으나 945년 이흐시드에게 밀려 알레포 둘레로 물러났다. 모술의 함단 가문은 쿠르드와 아랍 부족을 아우르는 군대로 자지라 북부의 세금을 걷었고, 알레포의 함단 가문은 동로마 제국과 맞서는 변경의 수호자로 이슬람 세계에서 이름을 얻었다. 두 가문은 서로 돕기도 하고 다투기도 했다. 모술은 티그리스강 상류의 교역 도시로 곡창인 자지라 북부를 끼고 있어 함단 가문의 재정 기반이 되었다. 모술의 아미르 자리는 아바스 칼리프가 임명했으나 함단 가문은 세금을 바치지 않거나 군사를 보내는 일로 자주 칼리프와 부딪혔다. 두 갈래의 함단 가문은 동로마 제국과도 싸웠다(「마케도니아 왕조의 반격: 멜리테네(934)에서 크레타(961)·안티오크(969)까지」(뒤의 사건))."
  subjects: [hamdanid-dynasty, abbasid-caliphate, ikhshidid-dynasty, byzantine-empire]
  tags: [politics, war]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)"]

- id: azerbaijan-sajid-sallarid-889
  year: 889
  endYear: 941
  title:
    ko: "아제르바이잔의 사지 왕조와 살라르 왕조(889~941)"
  summary:
    ko: "아제르바이잔은 이란 고원 북서쪽, 아라스강 남쪽의 땅이다. 889년 아바스 칼리프국의 칼리프가 중앙아시아 우스루샤나 출신 군인 가문의 무함마드 이븐 아비 앗사지를 이곳 총독으로 보냈다. 그는 마라가를 근거지로 칼리프에게 조공을 바치면서 아르메니아 쪽까지 힘을 뻗었고 이로써 사지 왕조가 섰다. 이 땅은 아르메니아 왕국과 조지아·아란의 영주들이 얽힌 정치 지형 속에 있었다. 사지 가문은 칼리프에게서 총독으로 임명받으면서도 칼리프에 맞서 반란을 일으킨 일이 있었다. 901년 무렵 무함마드의 아들 데브다드가 잠깐 이은 뒤 무함마드의 동생 유수프 이븐 아비 앗사지가 올라 캅카스 쪽으로 더 넓게 나아가 아르메니아 왕 스므바트 1세를 사로잡아 처형하기도 했다(914 무렵). 유수프가 아바스에 붙잡혀 있던 919~922년에는 수북이 대신 다스렸고 유수프는 돌아와 928년까지 다스렸다. 그의 아들 파트가 928~929년 다스리다 아르다빌에서 노예에게 독살되어 929년 사지 왕조가 끝났다. 이어 아제르바이잔은 다일람 출신 군인들과 쿠르드 출신 다이삼 같은 세력이 다투는 땅이 되었다. 한편 다일람 산지 타롬에서는 무함마드 이븐 무사피르가 919년 무렵 자립해 살라르 왕조를 열었다. 아제르바이잔의 아르다빌과 마라가, 타브리즈는 이란 고원에서 캅카스와 아나톨리아로 나가는 길목의 교역 도시였다. 이 지방에는 이란계와 쿠르드, 아랍 주민이 섞여 살았고 카스피해 쪽의 다일람 사람들이 산악에서 내려와 군인으로 일했다. 사지 왕조는 처음에는 마라가와 바르다아를, 나중에는 아르다빌을 도읍으로 삼았다. 살라르 왕조는 타롬과 잔잔 일대를 근거지로 삼았고, 941년 무함마드 이븐 무사피르의 아들 와흐수단과 마르즈반이 아버지를 가두었다. 마르즈반은 다이삼에게서 아제르바이잔을 빼앗아 살라르 왕조가 이 지방의 주인이 되었다."
  subjects: [sajid-dynasty, sallarid-dynasty, abbasid-caliphate]
  tags: [politics]
  sources: ["C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)"]

- id: samanid-iran-900
  year: 900
  endYear: 943
  title:
    ko: "사만 왕조의 호라산과 이란(900~943)"
  summary:
    ko: "사만 왕조는 부하라와 사마르칸트를 중심으로 트란스옥시아나를 다스린 이란계 왕조다. 이 사건은 그 가운데 지금 이란 땅에 닿은 일을 본다. 892~907년 이스마일 이븐 아흐마드가 부하라를 도읍으로 사만 가문을 하나로 묶었다. 900년 발크 가까이에서 사파르 왕조의 아므르를 이기자 아바스 칼리프는 이스마일에게 호라산 총독의 지위를 주었다. 같은 해 사만의 군대가 타바리스탄을 차지해 타바리스탄 알리 가문 토후국을 다일람으로 몰아냈고, 정복을 이끈 장군이 반란을 일으키자 이스마일이 901년 타바리스탄과 고르간을 다시 차지했다. 아흐마드 이븐 이스마일(907~914)은 910년대 초 시스탄을 사만의 땅으로 넣었으나 914년 투르크 노예 군인들에게 살해되었다. 여덟 살의 나스르 2세(914~943)가 이어 오래 다스렸다. 이 시기 사만 궁정은 페르시아어 시인 루다키를 후원해 페르시아어 문학이 꽃피기 시작했고 호라산의 이슬람 학문과 상업도 번성했다. 사만 왕조의 호라산은 니샤푸르·메르브·헤라트 같은 도시가 교역과 학문으로 번성한 땅이었다. 사만 군대의 핵심은 투르크 노예 군인과 호라산의 지방 기병이었다. 사만 왕조는 교역과 세금으로 부유해져 부하라에서 은화를 대량으로 만들었고, 이 은화는 볼가강을 따라 북유럽까지 퍼진 것이 발견된다. 이 왕조는 아바스 칼리프를 받들며 수니파 정통을 후원했다. 사만 왕조의 관료는 이란 귀족과 페르시아어 서기관 전통에 기대어 세금과 우편 제도를 운영했다. 타바리스탄은 928~930년 사만의 지배 아래 돌아왔다가 930년대 초 다일람 장수들의 손으로 넘어갔고 지야르 왕조의 마르다비즈가 그곳의 힘센 주인이 되었다."
  subjects: [samanid-empire, saffarid-dynasty, alid-tabaristan, ziyarid-dynasty]
  links:
    - { from: samanid-empire, to: saffarid-dynasty, note: "호라산 병합과 시스탄 편입 (900~910년대 초)" }
  tags: [politics, culture]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: fatimid-rise-893
  year: 893
  endYear: 910
  title:
    ko: "아부 압둘라 알시이와 파티마 칼리프국의 성립(893~910)"
  summary:
    ko: "이스마일파는 알리의 후손인 이맘이 숨어 있다가 마흐디로 나타난다고 믿었다. 893년 예멘 출신 이스마일파 선교사 아부 압둘라 알시이가 이프리키야 서쪽 이크잔의 쿠타마 베르베르 사이에 자리 잡았다. 쿠타마는 아글라브 왕조의 세금과 징병에 불만이 컸고, 아부 압둘라는 이들을 군대로 모아 902~909년 사이 밀라·세티프 같은 도시를 차례로 차지했다. 아부 압둘라는 소박한 생활과 정의를 내세워 쿠타마의 신뢰를 얻었고 병사들에게 전리품을 고르게 나누어 주었다고 한다. 아글라브 왕조의 마지막 아미르 지야다트 알라 3세는 궁정의 쾌락에 빠졌다는 비난을 받았고 전투에서 거듭 졌다. 이스마일파는 이맘의 이름을 숨기는 비밀 조직으로 선교사(다이)를 보내 포교했고 북아프리카와 예멘, 이집트가 그 거점이었다. 한편 시리아 살라미야에 있던 이스마일파 이맘 우바이드 알라(알마흐디)는 아바스의 추적을 피해 이집트를 거쳐 마그레브로 향했다. 909년 3월 아부 압둘라의 군이 아글라브 왕조의 궁정 도시 라카다에 들어가 아글라브 왕조가 끝났다. 같은 해 타헤르트의 루스탐 이맘국이 쿠타마 군에게 무너졌다. 알마흐디는 시질마사의 미드라르 왕조 군주에게 억류되어 있다가 아부 압둘라가 가서 풀어 주었다고 전하며, 910년 1월 라카다에서 칼리프로 선포되었다. 이로써 아바스 칼리프국과 맞서는 이스마일파의 파티마 칼리프국이 섰다. 이 선교는 공동체가 이맘의 지도를 받아야 한다고 보는 시아파의 한 갈래인 이스마일파의 교리에 기대고 있었다. 우바이드 알라가 알리와 파티마의 후손이라는 주장은 아바스 쪽과 수니파 학자들이 의심했고 지금도 학계에 논쟁이 있다."
  subjects: [fatimid-caliphate, aghlabid-dynasty, rustamid-imamate, midrarid-dynasty, abbasid-caliphate]
  links:
    - { from: fatimid-caliphate, to: aghlabid-dynasty, note: "라카다 점령과 이프리키야 정복 (909)" }
    - { from: fatimid-caliphate, to: rustamid-imamate, note: "타헤르트 정복과 이맘국의 끝 (909)" }
  tags: [politics, religion, war]
  sources: ["Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: fatimid-mahdiya-910
  year: 910
  endYear: 934
  title:
    ko: "마흐디야의 건설과 파티마의 팽창(910~934)"
  summary:
    ko: "910년 파티마 칼리프국의 첫 칼리프에 오른 우바이드 알마흐디는 911년 자신을 세운 공로자 아부 압둘라 알시이를 처형했고, 이에 반발한 쿠타마의 반란을 눌렀다. 이집트는 파티마가 노리던 땅이어서 913~915년과 919~921년 두 차례 원정군을 보냈으나 아바스 칼리프국의 군에 막혔다. 916년 알마흐디는 라카다 남동쪽 해안 반도에 새 도읍 마흐디야를 세우기 시작해 921년 2월 낙성했다. 마흐디야는 성벽과 항구를 갖춘 요새 도시로 파티마 함대의 근거지였다. 알마흐디는 시칠리아에 총독을 두어 다스리게 했고 파티마 함대는 이탈리아 남부와 지중해 서쪽 해안을 습격했다. 새 화폐를 만들고 이스마일파 선교사들을 사방으로 보내 아바스 칼리프국 안의 이스마일파 신도에게도 영향을 넓혔다. 서쪽에서는 쿠타마 장군 마살라 이븐 후부스가 921년 무렵 페스를 차지해 이드리스 가문의 야히야 4세를 폐위하고 미크나사의 무사 이븐 아비 알아피야에게 서부를 맡겨 이드리스 왕조를 가신으로 눌렀으나 이 땅의 지배는 오래가지 못했다. 932년 무렵 미크나사의 무사 이븐 아비 알아피야가 코르도바 쪽으로 돌아서 파티마는 모로코를 잃었다. 929년 후우마이야 칼리프국의 압드 알라흐만 3세가 코르도바에서 칼리프를 칭하자(「압드 알라흐만 3세의 칼리프 선언(929)과 알만수르(알만소르)의 원정(981~997)」(앞의 사건)) 바그다드·마흐디야·코르도바에 칼리프가 나란히 서는 일이 벌어졌다. 카르마트 국가가 930년 메카에서 흑석을 가져간 일도 파티마의 이스마일파 권위에 부담이 되었다. 마흐디야는 바다로 튀어나온 반도에 서서 방어가 튼튼했고 육지 쪽으로는 성문 하나만 두었다고 전한다. 마흐디야는 완성된 뒤 파티마 칼리프국의 도읍으로 기능했다. 934년 3월 알마흐디가 죽고 아들 알카임이 이었다."
  subjects: [fatimid-caliphate, abbasid-caliphate, idrisid-dynasty, cordoba-caliphate, qarmatian-state]
  links:
    - { from: fatimid-caliphate, to: idrisid-dynasty, note: "페스 점령과 이드리스 왕조의 가신화 (921)" }
  tags: [politics, war, religion]
  sources: ["Heinz Halm, The Empire of the Mahdi: The Rise of the Fatimids (Brill, 1996)", "Farhad Daftary, The Ismāʿīlīs: Their History and Doctrines (Cambridge University Press, 1990)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: ziyarid-mardavij-928
  year: 928
  endYear: 935
  title:
    ko: "마르다비즈와 지야르 왕조, 일리아스 왕조(928~935)"
  summary:
    ko: "사만 왕조의 지배가 타바리스탄 알리 가문 토후국을 끝낸 뒤 다일람 출신 장수들이 이 지방의 힘센 자리를 차지했다. 아스파르 이븐 시루야는 928~930년 사이 타바리스탄과 고르간을 차지했으나 부하이던 길란 출신 마르다비즈 이븐 지야르가 그를 쓰러뜨리고 지야르 왕조를 열었다. 마르다비즈는 930~931년 무렵 아바스 칼리프국이 다스리던 이스파한·하마단·디나바르를 차지해 이란 서부와 중부를 아우르고 아흐와즈까지 나아가 칼리프를 위협했다. 마르다비즈는 다일람 군대와 투르크 군대 사이의 갈등을 다스리지 못했고 투르크 군인에 대한 거친 처우가 그가 살해된 한 원인이었다고 한다. 이 시기 이란 서부는 사만 왕조와 아바스 칼리프국, 다일람 장수들이 맞부딪히는 무대였다. 그는 옛 사산의 영광을 되살려 이스파한을 도읍 삼아 왕관 쓴 군주로 행세하려 했다고 전한다. 군대는 다일람 보병과 투르크 노예 기병으로 이루어졌고 훗날 부와이 왕조를 세우는 알리·하산·아흐마드 삼형제도 한동안 그의 장수로 일했다(932년 알리는 카라지를 영지로 받았으나 마르다비즈의 암살 계획을 피해 달아났다). 한편 929년 쿠데타가 실패한 뒤 사만을 떠난 군인 무함마드 이븐 일리아스는 남쪽으로 달아나 932년 케르만에 자리 잡고 일리아스 왕조를 열었고, 사만과 부와이 사이에서 자립을 지켰다. 935년 마르다비즈가 투르크 군인들에게 살해되자 지야르 왕조는 흔들렸다. 지야르 왕조의 확장은 이란 서부 도시들의 세금과 투르크 군인의 봉급을 둘러싼 갈등을 키웠다. 지야르 왕조의 군대는 길란과 다일람 산악에서 모은 보병이 바탕이었다. 동생 보슈마기르가 라이에서 왕위에 올랐으나 부와이 형제가 이스파한·파르스·후제스탄을 차지해 갔다."
  subjects: [ziyarid-dynasty, ilyasid-dynasty, buyid-dynasty, samanid-empire, alid-tabaristan, abbasid-caliphate]
  links:
    - { from: ziyarid-dynasty, to: abbasid-caliphate, note: "이스파한·하마단 등 지발 점령 (930~931년 무렵)" }
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)"]

- id: buyid-rise-934
  year: 934
  endYear: 945
  title:
    ko: "부와이 형제의 흥기: 이란 서부의 장악(934~945)"
  summary:
    ko: "부와이 왕조를 세운 가문은 다일람 산지 출신으로 아버지 부야가 어부였다는 전승이 있다. 이 가문의 세 아들 알리·하산·아흐마드가 일어섰다. 다일람 사람들은 이슬람을 비교적 늦게 받아들였고 알리 가문의 자이드파 포교로 시아파에 가까워졌다고 한다. 알리는 마르다비즈 밑에서 일하다 932년 카라지를 영지로 받아 다일람 병사를 모았고, 934년 파르스를 차지해 시라즈를 도읍으로 삼았다. 이때 알리는 아바스 칼리프에게서 총독 지위를 받아 형식상 칼리프의 신하로 행세했다. 935년 마르다비즈가 죽자 알리와 아흐마드는 후제스탄을, 하산은 이스파한을 차지했다. 하산은 938년 지야르 왕조의 보슈마기르에게 이스파한을 빼앗겼으나 943년 라이를 차지했다. 세 형제가 '이마드 앗다울라'(나라의 기둥)·'룩큰 앗다울라'(나라의 버팀목)·'무이즈 앗다울라'(나라의 지원자)의 칭호를 받은 해는 934~935년과 945년으로 사료가 갈린다. 보슈마기르는 사만 왕조의 도움에 기대어 버텼다. 부와이 형제는 다일람 보병과 투르크 기병을 아우르는 군대로 이란 서부와 남부를 차례로 차지했고, 이 두 부대의 대립을 다스리는 일이 큰 과제였다. 형제는 이란 서부의 세금과 곡창 지대로 군대의 봉급을 마련했고 지역을 나누어 맡으면서도 맏형 알리를 가장 높은 어른으로 인정했다. 아흐마드는 945년 12월 무렵(946년 1월설도 있음) 군을 이끌고 바그다드에 들어갔다. 마르다비즈의 죽음과 지야르 왕조의 동요는 「마르다비즈와 지야르 왕조, 일리아스 왕조(928~935)」(앞의 사건)에, 바그다드의 혼란은 「아미르 알우마라 제도와 칼리프의 무력화(936~945)」(같은 시기의 사건)에 있다. 부와이 형제는 시아파를 따랐지만 아바스 칼리프국의 칼리프를 없애지 않고 칼리프의 이름으로 정치를 이어 갔다."
  subjects: [buyid-dynasty, ziyarid-dynasty, samanid-empire, abbasid-caliphate]
  links:
    - { from: buyid-dynasty, to: ziyarid-dynasty, note: "라이 점령 (943)" }
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: muqtadir-decline-908
  year: 908
  endYear: 936
  title:
    ko: "알무크타디르와 칼리프 정권의 쇠퇴(908~936)"
  summary:
    ko: "908년 열세 살의 알무크타디르가 아바스 칼리프국의 칼리프에 오르자 재상들과 궁정의 여인, 환관 장군들이 실권을 나눠 가졌다. 어머니 샤그브와 환관 군사령관 무니스, 재상 이븐 알푸라트 같은 이들이 맞서 재상이 여러 번 바뀌었다. 징세를 청부에 맡기는 일이 늘면서 재정이 기울었다. 알무크타디르는 낭비가 심하고 정사를 어머니와 환관들에게 맡긴다는 비판을 받았으며, 이 서술에는 그를 폐위한 쪽의 시각이 섞여 있다. 908년 12월 이븐 알무으타즈가 하루 칼리프로 추대되었다가 진압되었고, 929년 2월에는 궁정 쿠데타로 알카히르가 잠깐 세워졌다가 알무크타디르가 며칠 만에 복위했다. 멀리서는 910년 이프리키야에서 파티마 칼리프국의 칼리프가, 929년 코르도바에서 후우마이야 칼리프국의 압드 알라흐만 3세가 칼리프를 칭해 바그다드 칼리프의 권위를 정면으로 부정했다. 이라크 안에서는 카르마트 국가가 923년 바스라, 927년 쿠파를 약탈했고 930년에는 메카의 흑석까지 가져갔다. 929년 함단 왕조의 나시르 앗다울라가 모술을 맡았고 931년 무렵 지야르 왕조의 마르다비즈가 이란 서부를 차지했으며 934년에는 부와이 왕조의 형제가 파르스를 차지했다. 932년 10월 무니스가 군을 이끌고 바그다드로 진군하자 칼리프가 맞서 싸우다 죽었고, 무니스는 알카히르(932~934)를 세웠다. 알카히르는 곧 무니스를 죽이고(933) 934년 폐위되어 눈이 멀었다. 알라디(934~940)가 이었으나 이라크의 세금이 바그다드에 제대로 들어오지 않았다. 935년 이집트에서는 이흐시드 왕조의 무함마드 이븐 투그즈가 총독으로 들어가 칼리프에게 명목상의 충성만 보냈다. 이 기간 칼리프의 권위가 약해진 배경에는 지방 총독이 세금을 보내지 않고 자립하는 오랜 흐름이 있었다. 이 시기 칼리프가 직접 다스리는 땅은 바그다드와 이라크 중부로 줄었다."
  subjects: [abbasid-caliphate, fatimid-caliphate, cordoba-caliphate, qarmatian-state, hamdanid-dynasty, ziyarid-dynasty, buyid-dynasty, ikhshidid-dynasty]
  tags: [politics]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)"]

- id: amir-al-umara-936
  year: 936
  endYear: 945
  title:
    ko: "아미르 알우마라 제도와 칼리프의 무력화(936~945)"
  summary:
    ko: "936년 아바스 칼리프국의 칼리프 알라디는 군을 쥐고 있던 장군 이븐 라이크를 '아미르 알우마라'(아미르들의 아미르)로 임명했다. 이 자리는 재정과 군사를 맡고 금요 예배에서 칼리프와 함께 이름이 불리는 최고 권력자였고, 칼리프는 종교의 상징으로 남았다. 칼리프가 직접 다스리는 땅은 사실상 이라크 중부로 줄었다. 아미르 알우마라가 된 사람은 바그다드의 세금을 거두고 군인에게 봉급을 주는 일을 모두 맡아 칼리프가 쥐고 있던 재상 자리도 눌렀다. 이 제도는 지방 총독이 칼리프를 이름으로만 받들고 실제로는 자립한 현실이 바그다드 안에도 들어온 모습이다. 938년 투르크 장군 바지캄이 이븐 라이크를 몰아내고 이 자리를 차지했다. 940년 즉위한 알무타키는 바지캄이 길러 낸 칼리프였다. 941년 쿠란키지가 잠시 자리를 차지했다가 이븐 라이크가 되돌아왔고, 942년 봄부터 943년 5월까지 함단 왕조의 나시르 앗다울라가 이 자리에 있었으나 투르크 군인들의 반란으로 쫓겨났다. 943년 투르크 장군 투준이 아미르 알우마라가 되었다. 알무타키는 바그다드를 떠나 함단 왕조와 이흐시드 왕조의 도움을 구했으나 944년 투준에게 폐위되어 눈이 멀었고, 알무스타크피(944~946)가 올랐다. 945년 투준이 죽자 그의 서기관 이븐 시르자드가 자리를 이었다. 이 혼란 속에 다일람의 부와이 왕조 아흐마드가 945년 12월 무렵(946년 1월설도 있음) 바그다드에 들어갔다. 아미르 알우마라 자리를 둘러싼 다툼은 투르크 군인과 다일람 군인, 아랍 부족 군대가 서로 다른 후보를 밀며 격화되었다. 아미르 알우마라에 대한 충성은 칼리프의 이름으로 표현되어 칼리프는 정치의 상징으로 계속 인정받았다. 이로써 칼리프는 그 뒤 이름뿐인 존재가 되었다."
  subjects: [abbasid-caliphate, hamdanid-dynasty, ikhshidid-dynasty, buyid-dynasty]
  tags: [politics]
  sources: ["Hugh Kennedy, When Baghdad Ruled the Muslim World: The Rise and Fall of Islam's Greatest Dynasty (Da Capo Press, 2004)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Roy P. Mottahedeh, Loyalty and Leadership in an Early Islamic Society (Princeton University Press, 1980)"]

- id: ikhshidid-egypt-935
  year: 935
  endYear: 945
  title:
    ko: "이흐시드 왕조의 이집트와 시리아(935~945)"
  summary:
    ko: "투르크 계통의 무함마드 이븐 투그즈는 아버지 때부터 아바스 칼리프국의 군에서 일했고 933년 이집트 총독에 임명되었으나 부임하지 못하다가 935년 8월 푸스타트에 들어왔다. 툴룬 왕조가 무너진 뒤 이집트는 총독이 자주 바뀌고 파티마의 침공(「마흐디야의 건설과 파티마의 팽창(910~934)」(앞의 사건))을 거듭 받아 혼란했는데, 그는 군대를 가다듬어 질서를 되찾았다. 939년 7월 칼리프에게서 '이흐시드' 칭호(중앙아시아 페르가나 군주들이 쓰던 칭호로 그의 선조가 그 지방에서 왔음을 보여 준다)를 공식으로 인정받아 이흐시드 왕조라 부른다. 939년 아바스의 아미르 알우마라 이븐 라이크가 시리아를 차지하자 이흐시드와 이븐 라이크는 라믈라와 티베리아 사이를 경계로 나누어 가졌고, 이후 이흐시드는 다마스쿠스 쪽으로 힘을 넓혔다. 944년 아바스 칼리프가 이집트와 시리아, 히자즈의 총독 자리를 그의 가문에 30년 동안 맡기기로 했다. 이흐시드는 알레포를 차지한 함단 왕조의 사이프 앗다울라와 북시리아를 두고 다투었고, 945년 다마스쿠스 둘레에서 사이프를 물리쳤다. 이흐시드 가문은 칼리프를 받드는 모습을 유지해 금요 예배와 화폐에 바그다드 칼리프의 이름을 올렸다. 이집트의 풍부한 세수로 큰 군대를 유지했고 푸스타트는 상업과 학문의 도시로 번성했다. 이흐시드의 이집트는 서쪽의 파티마 칼리프국과 동쪽의 바그다드 칼리프, 북쪽의 함단 왕조 사이에 있어 사방을 경계해야 했다. 이집트 행정에서는 콥트 교회를 따르는 기독교도 서기관들이 오랜 전통대로 재정을 맡았다고 한다. 이집트는 바그다드에서 멀리 떨어진 채 이흐시드 가문의 군이 지켰다."
  subjects: [ikhshidid-dynasty, abbasid-caliphate, hamdanid-dynasty]
  tags: [politics, war]
  sources: ["The Cambridge History of Egypt, vol. 1: Islamic Egypt, 640–1517 (Carl F. Petry 편, Cambridge University Press, 1998)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)"]
