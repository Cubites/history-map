- id: second-fitna-683
  year: 683
  endYear: 692
  title:
    ko: "제2차 내전: 이븐 알주바이르와 마르완 가문의 승리(683~692)"
  summary:
    ko: "683년 야지드 1세가 죽자 우마이야 칼리프국은 흔들렸다. 어린 아들 무아위야 2세는 몇 주에서 두어 달 만에 죽었고(물러났다는 전승도 있다) 후계를 지명하지 않았다. 메카에서 일찍부터 야지드에게 맞서 온 압둘라 이븐 알주바이르가 칼리프를 칭하자 히자즈와 이라크, 이집트의 많은 곳이 그를 받아들였다. 683년 야지드의 군이 메카를 포위해 카바 신전이 불에 상했으나, 야지드가 그해 11월 죽자 포위군은 물러났다. 시리아에서는 부족 연합이 갈렸다. 684년 8월 마르즈 라히트에서 우마이야 가문의 마르완 1세가 칼브 부족을 중심으로 한 이들과 함께 카이스 부족 쪽을 물리쳐 칼리프로 인정받았다. 마르완은 685년 이집트를 되찾고 곧 죽었으며 아들 압드 알말리크가 이었다. 한편 쿠파에서는 685~687년 무크타르가 일어났다가 이븐 알주바이르의 동생 무스압에게 꺾였다. 압드 알말리크는 691년 이라크로 쳐들어가 마스킨 전투에서 무스압을 죽였고, 이어 장군 하자즈 이븐 유수프가 692년 3월부터 메카를 포위해 10~11월 이븐 알주바이르를 쓰러뜨렸다. 이로써 우마이야 칼리프국이 마르완 가문의 손으로 다시 하나가 되었다. 내전 내내 카리지파는 이라크와 이란 남부에서 따로 싸웠다. 이븐 알주바이르는 메카에서 칼리프를 칭했을 때 알리 가문이나 카리지파와도 다른 길을 걸었고 히자즈의 지지를 받았다. 이 내전에서는 정복의 이익을 나누는 방식과 누가 칼리프가 될 자격이 있는지를 둘러싼 물음이 한꺼번에 터져 나왔다. 이 내전은 시리아의 아랍 부족 군대가 칼리프 자리를 좌우한다는 사실과 부족 사이의 대립이 오래 남는다는 사실을 보였다."
  subjects: [umayyad-caliphate]
  tags: [war, politics]
  sources: ["G. R. Hawting, The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (Routledge, 1986)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: abd-al-malik-reforms-692
  year: 692
  endYear: 705
  title:
    ko: "압드 알말리크의 개혁: 바위의 돔·아랍어 행정·화폐(692~705)"
  summary:
    ko: "내전을 이긴 압드 알말리크(685~705)는 제국의 체제를 다시 짰다. 692년 무렵 예루살렘 성전산에 바위의 돔이 완성되었다. 지금 남은 가장 오래된 이슬람 기념 건축으로 팔각 구조에 쿠란 구절과 무함마드를 가리키는 비문이 둘려 있다. 같은 시기 비잔티움식 모양을 따르던 금화와 사산식 은화를 대신해 십자가나 사람 모습이 없고 아랍어 신앙 문구를 새긴 디나르(696~697년 무렵)와 디르함(698~699년 무렵)이 새로 만들어졌다. 이는 동로마 제국의 황제 유스티니아노스 2세와의 긴장 속에서 나온 조치로 해석된다. 바위의 돔이 선 곳은 유대교의 옛 성전이 있던 성전산이며 무함마드가 하늘에 올랐다고 전해지는 밤의 여행과 이어진다. 예루살렘 기독교의 성묘 교회와 견줄 만한 크기로 지어져 이슬람의 존재를 드러내려는 뜻이 있었다고 해석된다. 이 개혁은 서기관에게 아랍어를 아는 것을 요구해 비아랍 개종자(마와알리)의 몫과 지위 문제를 더 키우기도 했다. 행정 언어도 바뀌었다. 700년 무렵부터 이라크의 디완에서 페르시아어가, 시리아와 이집트의 디완에서 그리스어와 콥트어가 차례로 아랍어로 바뀌어 갔다. 이라크 총독 하자즈 이븐 유수프는 와시트를 새 군영 도시로 세우고(702년 무렵) 개종한 비아랍인을 도시에서 마을로 돌려보내 개종자에게도 지즈야를 거두었다고 사료는 적는데, 그를 가혹하게 그린 서술에는 뒤의 아바스 쪽 시각이 섞였다는 평가도 있다. 우편 제도(바리드)도 정비되었다. 이 개혁으로 우마이야 칼리프국은 부족 군대의 연합에서 아랍어와 이슬람 상징을 내세운 제국으로 바뀌었다는 평가가 널리 받아들여지나, 일부 학자는 변화가 더 점진적이었다고 본다. 압드 알말리크는 내전으로 흩어진 총독과 부족을 다시 묶어야 했고, 이 개혁은 칼리프국이 왕조 국가의 제도를 갖추는 과정이었다. 압드 알말리크가 705년 10월 죽고 아들 알왈리드 1세가 이었다."
  subjects: [umayyad-caliphate, byzantine-empire]
  tags: [politics, culture, economy]
  sources: ["G. R. Hawting, The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (Routledge, 1986)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)"]

- id: tabaristan-dabuyid-642
  year: 642
  endYear: 761
  title:
    ko: "카스피해 남안의 다부이 왕조와 바반드 왕조: 아랍에 맞선 산악 영주들(642~761)"
  summary:
    ko: "사산 제국이 무너진 뒤에도 카스피해 남쪽의 산악과 해안, 곧 길란·다일람·타바리스탄 일대는 아랍군에게 쉽게 열리지 않았다. 이 지방에서는 길 가브바라가 642년 무렵부터 이스파바드(옛 이란의 군사 칭호)를 칭하며 다스리기 시작했고, 그의 가문인 다부이 가문이 조로아스터교를 지키며 타바리스탄을 이어서 다스렸다. 가문은 자신들이 사산 왕가의 한 갈래라는 전승을 내세웠다. 지방 귀족들은 아랍군이 허락 없이 들어오지 않는다는 협정을 맺고 필요할 때 공물을 보내며 자립을 지켰다. 카스피해 남쪽의 숲과 알보르즈 산맥은 사산 시대에도 방어에 유리해 자립하는 귀족을 길러 냈고, 말을 탄 군대가 들어가기 어려운 지형이었다. 길 가브바라에서 다부야를 거쳐 이름 높은 파로한 대왕에 이르기까지 군주가 이어졌고, 파로한은 716~717년 우마이야 칼리프국의 장군 야지드 이븐 알무할랍이 고르간을 거쳐 쳐들어온 것을 물리쳤다. 파로한 대왕 뒤에는 다드부르즈미흐르와 섭정 파로한 소를 거쳐 쿠르시드가 올랐다. 651년 무렵 시작되었다고 전하는 바반드 왕조(전설상의 시조 바브)도 산지의 영주로 자리를 잡았다. 이 가문은 사산 왕 카바드 1세의 아들 카우스의 후손이라 내세웠으나 역사가들은 이를 의심한다. 이슬람은 이 지방에 느리게 퍼졌다. 아바스 칼리프국의 칼리프 알만수르는 호라산 반란을 구실로 759년 군을 보내 마지막 이스파바드 쿠르시드를 불시에 쳤고, 쿠르시드는 길란으로 달아났다가 760~761년 사로잡혔으며 그의 가족은 스스로 목숨을 끊었다고 전한다. 이로써 다부이 왕조가 끝나고 타바리스탄은 아바스 칼리프국의 지배 아래 들어왔다. 바반드 가문은 아바스 지배 아래에서도 산지에서 힘을 이어 갔다."
  subjects: [dabuyid-dynasty, bavandid-dynasty, abbasid-caliphate, umayyad-caliphate]
  links:
    - { from: abbasid-caliphate, to: dabuyid-dynasty, note: "타바리스탄 정복과 다부이 왕조의 끝 (759~760)" }
  tags: [politics, war]
  sources: ["The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (R. N. Frye 편, Cambridge University Press, 1975)", "C. E. Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Hugh Kennedy, The Early Abbasid Caliphate: A Political History (Croom Helm, 1981)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: ifriqiya-kairouan-665
  year: 665
  endYear: 688
  title:
    ko: "우크바 이븐 나피와 카이라완의 건설, 쿠사일라의 저항(665~688)"
  summary:
    ko: "이집트에서 서쪽으로 나아간 아랍군은 이프리키야(지금의 튀니지와 알제리 동부)에서 동로마 제국의 총독령과 베르베르 부족들을 상대해야 했다. 665년 무렵 무아위야 이븐 후다이즈가 이프리키야를 원정해 동로마군을 쳤고, 670년 우크바 이븐 나피 알피흐리가 해안에서 떨어진 내륙에 군영 도시 카이라완을 세웠다. 바다에서 오는 동로마 함대의 공격을 피하고 군인을 모아 둘 수 있는 자리였다. 이프리키야는 옛 카르타고 이래 지중해의 곡창으로 동로마 제국에 중요한 땅이어서 카르타고와 해안 도시는 오래도록 동로마의 손에 남았다. 우마이야 칼리프국의 총독들이 해안이 아니라 내륙의 카이라완을 거점으로 삼은 까닭이다. 군영 도시 카이라완은 곧 모스크와 학문의 도시가 되어 뒤에 마그레브 이슬람의 중심이 되었다. 전승에 따르면 우크바는 이에 앞서 페잔의 가라마 둘레까지 원정했다고 한다. 674~675년 무렵 우크바가 물러나고 아부 알무하지르 디나르가 총독이 되어 베르베르 지도자 쿠사일라를 사로잡았다가 풀어 주고 이슬람을 받아들이게 했다. 681년 우크바가 총독으로 되돌아와 서쪽으로 나아가 대서양 해안까지 이르렀다고 전하나 이 이야기는 훨씬 뒤의 사료에 담겨 있다. 683년 우크바는 돌아오는 길에 비스크라 가까운 타후다에서 쿠사일라가 이끄는 베르베르와 동로마 병사들에게 둘러싸여 죽었다. 쿠사일라는 본래 그리스도교를 믿은 베르베르 왕으로 전하며, 아우라바 부족의 지도자이자 알타바 왕국의 왕이었다고 보는 견해가 있다. 그는 카이라완을 차지해 683년부터 몇 해 동안 이프리키야를 다스렸고 이 기간 아랍군은 키레나이카의 바르카까지 물러났다. 우크바가 카이라완에 남겨 두었던 주하이르 이븐 카이스가 총독이 되어 686~688년 무렵(690년설도 있다) 맘마에서 쿠사일라를 쳐 죽였고, 주하이르는 688년 바르카에서 동로마 습격대에게 죽었다. 이 사건들은 이슬람이 마그레브에 뿌리내리는 일이 베르베르 지도자들과의 관계에 크게 달려 있음을 보였다."
  subjects: [umayyad-caliphate, altava-kingdom, byzantine-empire]
  tags: [war, politics]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus", "Hugh Kennedy, The Great Arab Conquests: How the Spread of Islam Changed the World We Live In (2007)"]

- id: kahina-maghreb-693
  year: 693
  endYear: 711
  title:
    ko: "카히나의 저항과 마그레브 정복의 완성(693~711)"
  summary:
    ko: "693년 무렵 압드 알말리크는 하산 이븐 알누만을 이프리키야 총독으로 보내 다시 서쪽을 공략하게 했다. 하산이 카르타고를 차지한 일(698)은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(앞의 사건)에 있다. 이 승리 뒤 하산은 베르베르의 저항에 부딪혔다. 아우레스 산지의 자나타 계통 자라와 부족(앗티자니는 루와타라고 한다)을 이끌던 여왕 디히야(아랍 이름 알카히나)가 하산의 군을 한때 물리쳐 키레나이카 쪽으로 물러나게 했다고 전한다. 디히야가 유대교를 믿었다는 전승이 있으나 현대 학자들은 그리스도교 신자였을 가능성을 가장 높게 보거나 토착 신앙으로 보며 정하지 못한다. 원군을 얻은 하산이 703년 무렵 디히야를 쓰러뜨려 아우레스 왕국이 끝났다. 아랍 사료는 디히야가 자기 땅을 불태워 아랍군이 얻을 것이 없게 했다고 적는데, 이는 정복자 쪽의 서술이다. 700년대 초 무사 이븐 누사이르가 총독이 되어 마그레브 중부와 서부를 눌렀고 708년 알타바 왕국이 우마이야 칼리프국에 합쳐졌다. 무사는 베르베르 사람들을 이슬람으로 이끌어 병사로 받아들였고 타리크 이븐 지야드를 탕헤르 총독으로 두었다. 페잔의 가라만테스는 오아시스 도시 가라마를 중심으로 독자 왕국을 이어 갔으나 지하수가 줄어드는 가운데 아랍에 굴복했고 700년 무렵 왕국이 사라졌다. 아랍 정복이 마무리된 뒤 베르베르 사람들은 점차 이슬람으로 돌아섰고 많은 이들이 아랍 군대에서 병사로 복무했다. 그러나 개종한 베르베르는 마와알리로 취급되어 세금과 전리품 분배에서 차별받는다고 느꼈고, 이 불만이 뒤에 카리지파 사상과 만나 터져 나왔다. 이 무렵 마그레브 서쪽 끝까지 아랍 총독의 손이 닿았고, 711년 타리크가 이베리아로 건너가는 길이 열렸다(「우마이야의 이베리아 정복: 과달레테(711)·나르본(720)과 아스투리아스의 시작(코바동가 718)」(뒤의 사건))."
  subjects: [umayyad-caliphate, aures-kingdom, altava-kingdom, garamantes]
  links:
