  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)"]

- id: berber-great-revolt-739
  year: 739
  endYear: 744
  title:
    ko: "베르베르 대반란과 바르가와타 연합(739~744)"
  summary:
    ko: "이슬람으로 돌아선 베르베르 사람들은 우마이야 총독들의 세금 압박과 차별에 불만이 컸다. 개종한 이들은 마와알리(비아랍 개종자)로 불리며 아랍 군인보다 낮은 대접을 받았고, 전승에 따르면 일부 총독은 개종자에게도 인두세를 물리고 노예로 삼을 베르베르 사람들을 요구했다. 740년(사료에 따라 739년 말) 탕헤르에서 마이사라 알마트가리가 일어나 카리지파 가운데 수프리파의 평등 사상을 내걸고 서쪽 마그레브를 휩쓸었다. 마이사라는 곧 자기 편에게 쫓겨 죽었고, 할리드 이븐 하미드 알자나티가 이어 같은 해 '귀족들의 전투'에서 아랍군을 크게 이겼다. 741년 2월 우마이야 칼리프 히샴이 칼툼 이븐 이야드에게 시리아·이집트 군 3만 명 안팎(사료의 수치)을 주어 보냈으나 칼툼은 그해 10~11월 바구라 전투에서 크게 져 죽었고 살아남은 발즈 이븐 비슈르의 군은 세우타에 갇혔다가 이베리아로 건너가 그곳의 베르베르 반란을 눌렀다(「우마이야의 이베리아 정복: 과달레테(711)·나르본(720)과 아스투리아스의 시작(코바동가 718)」(앞의 사건)). 그 뒤 히샴이 보낸 핸달라 이븐 사프완이 742년 알카른과 알아스남에서 베르베르 군을 물리쳐 카이라완을 지켰다. 이 반란에서 베르베르 사람들은 이슬람을 버린 것이 아니라 카리지파의 평등 사상으로 이슬람을 자기 것으로 만들었다. 이 반란으로 마그레브 서부는 우마이야 칼리프국의 손을 떠났고 카리지파 베르베르 국가들이 서는 길이 열렸다. 744년 모로코 대서양 평야의 타메스나에서는 바르가와타 연합을 이루고 살리흐 이븐 타리프가 베르베르어로 된 경전을 내세운 독자 종교를 폈다고 후대 아랍 사료는 전한다. 이 사료들은 적대 쪽에서 쓴 것이라 서술에 편견이 섞여 있다."
  subjects: [umayyad-caliphate, barghawata-confederacy]
  tags: [war, society, religion]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "G. R. Hawting, The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (Routledge, 1986)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus"]

- id: fihrid-emirate-745
  year: 745
  endYear: 772
  title:
    ko: "피흐르 토후국과 아바스의 이프리키야 회복(745~772)"
  summary:
    ko: "우마이야 칼리프국이 무너져 가던 744년 말 압드 알라흐만 이븐 하비브 알피흐리가 튀니스에서 이프리키야의 아미르를 칭했고, 총독 핸달라는 745년 2월 다마스쿠스로 돌아갔다. 압드 알라흐만은 정복자 우크바 이븐 나피의 증손이며 피흐르 토후국을 열었다. 피흐르 가문은 정복자의 후손이라는 권위로 이프리키야의 아랍 군인 사회를 이끌었으나 아바스 칼리프와 이프리키야의 베르베르 사이에서 어느 쪽에도 뿌리내리지 못했다. 이 시기 마그레브 서쪽에서는 카리지파 베르베르의 나라들이 하나씩 서고 있었다. 750년 아바스 칼리프국이 우마이야 칼리프국을 무너뜨리자 그는 금요 예배에서 아바스 칼리프의 이름을 부르지 않았다. 755년 동생 일리아스가 그를 카이라완에서 암살했고 뒤에 압드 알라흐만의 아들 하비브가 일리아스를 죽였다. 757년 카리지파 베르베르 와르판주마와 수프리파 동맹이 카이라완을 차지해 하비브가 죽고 피흐르 토후국이 끝났다. 이듬해 이바드파 아부 알카타브 알마아피리가 트리폴리와 카이라완을 차지했다. 아바스의 알만수르는 761~762년 무렵 장군 무함마드 이븐 알아슈아스를 보내 이프리키야를 되찾았다(이븐 알아슈아스는 762~765년 총독). 그 뒤 알아글라브 이븐 살림(765~767년, 아글라브 가문의 선조) 같은 총독이 짧게 거쳤고 카이라완은 베르베르의 공격을 되풀이해 받았다. 768년 무렵 총독 우마르 이븐 하프스 때 반란이 이어지다 771년 그가 죽자 야지드 이븐 하팀 알무할라비가 대군을 이끌고 와서 772년 이바드파를 물리치고 지도자 아부 하팀을 죽여 도시를 안정시켰다. 무할라브 가문 사람들이 그 뒤 20년 남짓 이프리키야를 맡았다. 카이라완은 이 혼란 속에서도 학자와 상인의 도시로 이어졌고 아랍 정주민과 베르베르 부족 사이의 긴장은 가라앉지 않았다. 이 일은 아바스가 먼 이프리키야를 직접 다스리기 어렵다는 사실을 보였다."
  subjects: [fihrid-emirate, abbasid-caliphate, umayyad-caliphate]
  tags: [politics, war]
  sources: ["Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Abdallah Laroui, The History of the Maghrib: An Interpretive Essay (Princeton University Press, 1977)", "Hugh Kennedy, The Early Abbasid Caliphate: A Political History (Croom Helm, 1981)", "Ibn ʿAbd al-Ḥakam, Futūḥ Miṣr wa-l-Maghrib wa-l-Andalus"]

- id: abbasid-revolution-747
  year: 747
  endYear: 750
  title:
    ko: "아바스 혁명과 우마이야 칼리프국의 몰락(747~750)"
  summary:
    ko: "우마이야 칼리프국은 말기에 부족 사이의 대립과 내전으로 힘이 줄었고, 호라산의 아랍 이주민과 비아랍 개종자는 불만이 컸다. 아바스 가문(무함마드의 숙부 아바스의 후손)은 이를 이용해 '무함마드 가문에서 나올 마흐디'를 내세워 은밀히 포교했고 출신이 분명하지 않으나 페르시아계로 전해지는 아부 무슬림이 이 일을 맡았다. 선전은 '무함마드 가문의 마흐디'라는 모호한 구호로 알리 가문 지지자와 아바스 가문 지지자를 한데 모았다. 호라산의 군대는 아랍 이주민과 이란 출신 개종자가 섞여 있었고 우마이야가 이란을 아랍 중심으로 다스린다는 불만이 컸다. 747년 6월 아부 무슬림이 메르브 둘레에서 검은 깃발을 올렸고 748년 메르브를 차지했다. 카흐타바 이븐 샤비브가 서쪽으로 군을 이끌어 이란 고원을 거쳐 이라크로 나아갔으나 749년 8월 유프라테스 가까이에서 죽었고, 그의 아들 하산이 749년 9월 쿠파에 들어갔다. 749년 말 아부 알아바스 알사파흐가 쿠파에서 칼리프로 선언되었다. 750년 1월 자브강 전투에서 우마이야의 마지막 칼리프 마르완 2세가 졌고 마르완은 이집트로 달아나 같은 해 8월 죽었다. 이어 우마이야 일족이 널리 학살되었다. 살아남은 압드 알라흐만은 이베리아로 건너가 코르도바 아미르국을 세웠다(「압드 알라흐만 1세와 코르도바 아미르국(756), 카롤루스의 스페인 원정과 론세스바예스(778)」(뒤의 사건)). 아바스 칼리프국은 알리 가문을 기대한 시아파 지지자들에게는 실망을 주어 반발을 낳았다. 이 혁명으로 아바스 칼리프국은 아랍 부족 귀족 중심에서 이란 출신 관료와 비아랍 개종자를 아우르는 체제로 바뀌었다고 평가된다. 아바스 칼리프국의 군대는 751년 중앙아시아의 탈라스에서 당군과 만났다(「고선지의 서역 원정과 탈라스 전투(747~755)」(같은 시기의 사건))."
