- id: uthman-quran-644
  year: 644
  endYear: 656
  title:
    ko: "우스만의 칼리프 시대와 쿠란 정본(644~656)"
  summary:
    ko: "644년 11월 우마르가 죽은 뒤 여섯 사람의 협의체가 알리와 우스만을 두고 의견을 모아 우스만 이븐 아판을 칼리프로 뽑았다. 우마이야 가문 출신인 우스만의 12년 동안 파르스(650년 무렵)와 호라산(651)이 열렸고 시리아 총독 무아위야는 649년 키프로스로 함대를 보냈다. 655년 무렵 아랍 함대는 동로마 제국의 황제 콘스탄스 2세의 함대를 소아시아 남해안에서 물리쳤다(돛대 전투). 함대는 이집트와 시리아의 조선소에서 만들어졌고 이곳의 기독교도 선원이 많이 움직였다고 한다. 정통 칼리프국의 수도 메디나에는 정복지에서 거둔 재물이 쌓였으나 그 분배를 두고 말이 많았다. 이 시기 가장 이름난 일은 쿠란 정본이다. 전승에 따르면 우스만이 자이드 이븐 사비트 등에게 쿠란 필사본을 하나로 맞추게 하고(650년 무렵) 그 사본을 쿠파·바스라·다마스쿠스 같은 중심 도시에 보내 다른 본문을 불태우게 했다. 현대 학자들은 정본이 이루어진 시기와 과정을 놓고 더 이르다거나 더 늦다는 의견을 내며, 무함마드 생전에 이미 정리되었다고 보는 견해도 있고 시아파가 이를 받아들인다. 한편 우스만이 친족을 총독 자리에 앉히고(시리아의 무아위야, 쿠파의 알왈리드 이븐 우크바, 이집트의 압둘라 이븐 사아드) 전리품을 불공평하게 나눈다는 불만이 쿠파·바스라·이집트의 군인들 사이에 쌓였다. 656년 6월 이집트에서 온 반란자들이 메디나로 들어와 집을 에워싸고 우스만을 죽였다. 수니파는 우스만을 셋째 정통 칼리프로 꼽고, 시아파는 그의 정책을 비판하며, 뒤에 카리지파가 되는 이들은 우스만과 알리를 둘 다 비난했다. 동로마와의 전쟁은 「아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국」(앞의 사건)에 이어진다."
  subjects: [rashidun-caliphate, byzantine-empire]
  tags: [politics, religion, war]
  sources: ["Wilferd Madelung, The Succession to Muhammad: A Study of the Early Caliphate (Cambridge University Press, 1997)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "Fred M. Donner, The Early Islamic Conquests (1981)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: first-fitna-656
  year: 656
  endYear: 661
  title:
    ko: "알리와 제1차 내전: 낙타 전투·시핀·카리지파(656~661)"
  summary:
    ko: "656년 6월 우스만이 살해된 뒤 메디나에서 알리 이븐 아비 탈리브가 칼리프로 추대되었다. 우스만의 피를 갚으라는 요구로 탈하와 주바이르, 무함마드의 아내 아이샤가 바스라로 가서 맞섰고, 656년 12월 바스라 근처의 낙타 전투에서 알리가 이겼다(탈하와 주바이르가 죽었고 아이샤는 메디나로 돌려보내졌다). 알리는 쿠파를 새 근거지로 삼았다. 우스만의 친족인 시리아 총독 무아위야는 알리의 즉위를 인정하지 않고 우스만의 복수를 내세웠다. 657년 7월 유프라테스 상류의 시핀에서 두 군이 맞붙어 여러 날 싸운 끝에 무아위야 쪽이 쿠란 구절을 창끝에 걸어 중재를 청했다. 중재(타크킴)를 받아들이자 알리의 진영에서 '판결은 오직 신의 몫'이라며 이탈한 사람들이 나왔는데, 이들이 카리지파다. 알리는 658년 나흐라완에서 이들을 쳤으나 그 뒤로도 카리지파는 두 편 모두를 불의하다고 보며 저항했다. 이 내전으로 정통 칼리프국의 중심은 메디나가 아니라 이라크의 쿠파로 옮겨 갔고 싸움의 무대는 시리아와 이라크가 되었다. 알리를 지지한 사람들(뒤의 시아파)과 알리를 떠난 카리지파, 우스만의 가문과 시리아 군을 이끈 무아위야의 세력으로 이슬람 공동체의 큰 갈래가 이때 그어졌다. 658년 아므르 이븐 알아스가 무아위야를 위해 이집트를 차지했고, 660년 무아위야는 예루살렘에서 칼리프로 인정받았다고 전한다. 661년 1월 쿠파에서 카리지파 이븐 물잠이 알리를 칼로 쳐 알리가 죽자, 알리의 맏아들 하산이 잠시 칼리프로 인정되었다가 같은 해 무아위야와 협정을 맺고 물러났다. 이로써 정통 칼리프국의 시대가 끝나고 무아위야의 우마이야 칼리프국이 열렸다. 수니파는 알리를 넷째 정통 칼리프로, 시아파는 첫째 이맘으로 받든다."
  subjects: [rashidun-caliphate, umayyad-caliphate]
  links:
    - { from: umayyad-caliphate, to: rashidun-caliphate, note: "알리 암살과 하산의 양위로 칼리프 자리 이어받음 (661)" }
  tags: [war, politics, religion]
  sources: ["Wilferd Madelung, The Succession to Muhammad: A Study of the Early Caliphate (Cambridge University Press, 1997)", "Hugh Kennedy, The Prophet and the Age of the Caliphates: The Islamic Near East from the 6th to the 11th Century (Longman, 1986)", "G. R. Hawting, The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (Routledge, 1986)", "al-Ṭabarī, Taʾrīkh al-rusul wa-l-mulūk (영역: The History of al-Ṭabarī, 전 40권, State University of New York Press, 1985~2007)"]

- id: muawiya-umayyad-661
  year: 661
  endYear: 680
  title:
    ko: "무아위야와 우마이야 칼리프국의 성립(661~680)"
  summary:
    ko: "661년 알리가 죽고 하산이 물러난 뒤 시리아 총독이던 무아위야 이븐 아비 수프얀이 칼리프로 인정받았다. 무아위야는 우스만과 같은 우마이야 가문 출신이며, 다마스쿠스를 도읍으로 삼아 우마이야 칼리프국을 열었다. 무아위야의 힘은 시리아의 아랍 부족 군대에서 나왔고 특히 칼브 부족과 혼인으로 이어져 있었다. 661년은 훗날 '공동체가 하나가 된 해'(아므 알자마아)로 불렸다. 무아위야는 아라비아의 유력 가문을 후한 선물로 달래면서 시리아의 아랍 부족 군대를 기둥으로 삼았고, 무함마드의 동료들이 모인 메디나는 더 이상 정치의 중심이 아니었다. 그는 동로마의 행정 관행과 그리스어를 쓰는 관리들을 그대로 두었고 기독교도 관리를 곁에 두었다. 이라크는 지야드 이븐 아비히 같은 총독이 엄하게 다스렸고, 이프리키야에서는 670년 우크바 이븐 나피가 카이라완을 세웠다. 호라산 총독들은 트란스옥시아나로 원정했다. 동로마 제국과는 해마다 변경을 다투었고 674~678년 콘스탄티노폴리스를 포위하기에 이르렀다(「아랍의 콘스탄티노폴리스 포위(674~678·717~718)와 그리스의 불」(뒤의 사건)). 무아위야는 676년 무렵 아들 야지드를 후계자로 정해 사람들의 맹세를 받게 했다. 칼리프 자리를 아들에게 물려주려는 이 시도에 메디나와 메카의 유력자들이 반발했고, 후대의 비판자들은 이것을 칼리프 제도가 왕조로 바뀐 시작으로 본다. 반면 수니 쪽 전승은 무아위야를 무함마드의 동료이자 유능한 통치자로 평가한다. 680년 4월 무아위야가 죽고 야지드 1세가 뒤를 이었다. 무아위야 시기에 우마이야 칼리프국은 동쪽으로 호라산, 서쪽으로 이프리키야까지 넓어졌고 세금과 징병은 지방 총독이 맡았다. 알리의 아들 후사인은 맹세를 거부했다."
  subjects: [umayyad-caliphate, byzantine-empire]
  tags: [politics]
