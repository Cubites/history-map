    - { from: lithuania-grand-duchy, to: teutonic-order, note: "사모기티아의 평생 양도 (1411)" }
  tags: [war, diplomacy]
  sources: ["William Urban, Tannenberg and After: Lithuania, Poland and the Teutonic Order in Search of Immortality (개정판, 2003)", "Norman Davies, God's Playground: A History of Poland, Vol. 1 (개정판, 2005)"]
