- id: kalmar-breakup-1439
  year: 1439
  endYear: 1450
  title:
    ko: 에리크 7세의 폐위와 칼마르 동맹의 분리
  summary:
    ko: "엥엘브렉트 봉기 뒤에도 에리크 7세는 세금과 전쟁 정책으로 신뢰를 잃었다. 1439년 6월 덴마크 귀족이, 9월 스웨덴 귀족이 그를 폐위했다. 그는 발트해의 고틀란드 섬(비스뷔)으로 물러나 1449년까지 버텼다. 세 나라는 조카 바이에른의 크리스토페르를 차례로 왕으로 뽑았다(덴마크 1440, 스웨덴 1441, 노르웨이 1442). 그가 1448년 1월 후사 없이 죽자 동맹은 갈라졌다. 스웨덴은 6월 귀족 카를 크누트손(카를 8세)을, 덴마크는 9월 올덴부르크 백작 크리스티안 1세를 뽑았다. 노르웨이는 1449년 카를을 왕으로 뽑았으나 1450년 카를이 노르웨이 왕위 주장을 거두어 크리스티안이 노르웨이 왕이 되었고, 덴마크-노르웨이의 연합이 이어졌다. 스웨덴은 이후 카를 크누트손(세 차례 왕이 됨)과 섭정 스텐 스투레 같은 귀족이 다스렸고, 크리스티안 1세는 1457년에야 스웨덴 왕이 되었다(1464년까지). 따라서 칼마르 동맹은 이름만 남고 덴마크-노르웨이 연합(1814년까지)과 스웨덴이 따로 서는 틀이 이때 굳었다. 이 갈라짐은 1523년 구스타브 바사의 즉위로 마무리된다(eu-00a의 스톡홀름 피바다 사건)."
  subjects: [kalmar-union-three-kingdoms, kalmar-union, sweden-medieval]
  tags: [politics]
  sources: ["Franklin D. Scott, Sweden: The Nation's History (개정판, 1988)", "Knud J. V. Jespersen, A History of Denmark (2판, 2011)"]

- id: serbia-fall-1439
  year: 1439
  endYear: 1444
  title:
    ko: 세르비아 전제공국의 몰락과 회복
  summary:
    ko: "주라지 브란코비치(전제공 1427~1456)는 오스만과 헝가리 양쪽에 공물을 바치며 줄타기를 했고 딸 마라를 술탄 무라드 2세에게 시집보냈다(1435). 그러나 무라드가 1439년 세르비아를 쳐 8월 수도 스메데레보가 함락되자 주라지는 헝가리로 달아났고 나라는 오스만의 직접 지배를 받았다. 1440년 무라드가 베오그라드를 에워쌌으나 헝가리가 지켜 냈다(약 반년의 포위 끝에 물러남). 1441년에는 은광 도시 노보브르도가 함락되었고, 무라드는 주라지의 두 아들 그르구르와 스테판의 눈을 멀게 했다(반역을 의심한 탓이라 전한다). 1443년 후녀디가 이끈 '긴 원정'이 소피아까지 이르자 오스만이 평화를 청해 1444년 6월 에디르네와 8월 세게드에서 맺은 10년 화약으로 세르비아가 복구되고 주라지가 스메데레보에 돌아왔다(눈먼 두 아들도 풀려남). 주라지는 이후 오스만의 신하로 남으면서 헝가리와도 연락하는 줄타기를 이어 갔다. 1444년 바르나 십자군 때는 중립을 지켰으나 1448년 코소보에서는 후녀디를 막고 사로잡았다(뒤의 사건). 세르비아 전제공국은 주라지가 죽고(1456) 1459년 스메데레보가 함락되면서 사라졌다(eu-00a의 메흐메트 2세 정복 사건)."
  subjects: [serbian-despotate, ottoman, hungary-kingdom]
