- id: rumeli-hisari-1452
  year: 1451
  endYear: 1452
  title:
    ko: 메흐메트 2세의 즉위와 루멜리 히사르
  summary:
    ko: "무라드 2세가 1451년 2월 죽고 열여덟 살쯤의 메흐메트 2세가 두 번째로 술탄이 되었다. 처음에는 동로마 황제 콘스탄티노스 11세와 평화를 확인했고 헝가리와도 3년 휴전을 맺었으나, 오스만 왕자 오르한의 부양비 문제로 동로마와 사이가 틀어지자 콘스탄티노폴리스 공략을 서둘렀다. 1452년 4월 그는 보스포루스 해협이 가장 좁은 유럽 쪽 기슭에 루멜리 히사르(보아즈케센, '해협을 끊는 자')를 쌓게 했다. 앞서 바예지트 1세가 아시아 쪽에 세운 아나돌루 히사르와 마주 보는 이 요새는 동원된 일꾼 수천 명(추산)이 몇 달 만에 마무리해(8월) 흑해에서 오는 곡물과 제노바·베네치아 배를 대포로 막을 수 있게 되었다. 동로마 황제는 사신을 보내 항의했으나 받아들여지지 않았고, 이 무렵 동로마를 섬기던 헝가리 출신 대포 장인 우르반(오르반)은 급료를 받지 못하자 메흐메트에게 가 큰 대포를 만들어 주었다. 11월에는 베네치아 배가 해협을 지나려다 포격을 받아 가라앉았고 선장이 처형되었다고 전한다. 콘스탄티노스는 서방의 원조를 기대하며 1452년 12월 하기아 소피아에서 피렌체 공의회의 교회 합동(1439)을 다시 선포했으나 시민의 반발만 샀고 큰 원조는 오지 않았다. 이렇게 1453년 포위(콘스탄티노폴리스 함락, eu-00a의 사건)의 준비가 끝났다. 같은 무렵 조선에서는 문종이 1451년 화차(여러 신기전을 한꺼번에 쏘는 수레)를 개량하게 했다."
  subjects: [ottoman, byzantine-empire, venice, genoa, papal-states, hungary-kingdom]
  links:
    - { from: ottoman, to: byzantine-empire, note: "루멜리 히사르 축조, 해협 봉쇄 (1452)" }
  tags: [war, politics]
  sources: ["스티븐 런치만, 『1453 콘스탄티노플 최후의 날』(이순호 옮김, 갈라파고스, 2004)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)"]
