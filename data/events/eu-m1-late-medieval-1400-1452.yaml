- id: aragon-succession-1409
  year: 1409
  endYear: 1420
  title:
    ko: 시칠리아·사르데냐와 카스페 타협(아라곤 왕위 계승)
  summary:
    ko: "아라곤 왕 마르티노 1세(재위 1396~1410)는 시칠리아 왕이던 아들 마르티노 2세와 함께 사르데냐의 아르보레아 판관국(14세기 후반 엘레오노라 판관 시대에 섬 대부분을 차지)을 쳤다. 마르티노 2세는 1409년 6월 사누리 전투에서 아르보레아와 나르본 자작 기욤 3세의 군대를 무찔렀으나 한 달 뒤 카글리아리에서 열병으로 죽었고, 아버지가 시칠리아를 이어받아 왕국을 아라곤 왕관령에 직접 두었다. 이듬해 오리스타노가 항복해 아라곤의 봉신인 오리스타노 후작령이 되었다. 마르티노 1세마저 1410년 5월 적자 없이 죽자 아라곤은 두 해 동안 왕이 없었고, 1412년 6월 카스페에서 아라곤·카탈루냐·발렌시아 대표 아홉 사람이 모여 카스티야 왕가의 페르난도(안테케라의 페르난도, 마르티노 1세의 누이의 아들)를 왕으로 뽑았다(카스페 타협). 이로써 카스티야의 트라스타마라 가문이 아라곤 왕위를 이었고, 그의 아들 알폰소 5세(재위 1416~1458)가 1420년 나르본 자작에게서 사르데냐에 남은 권리를 사들여 아르보레아의 마지막 흔적이 사라졌다. 시칠리아는 왕국 이름을 이었으나 이후 아라곤 왕이 직접 다스렸고, 이탈리아 남부 진출의 거점으로 알폰소 5세의 나폴리 정복(1442)으로 이어졌다."
  subjects: [aragon, castile, sicily-kingdom, arborea]
