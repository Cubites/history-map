- id: swiss-confederation-1411
  year: 1411
  endYear: 1451
  title:
    ko: 스위스 동맹의 확대와 옛 취리히 전쟁
  summary:
    ko: "스위스 동맹은 1291년 우리·슈비츠·운터발덴 세 숲 주의 맹약에서 시작해 15세기에 합스부르크 가문과 맞서며 넓어졌다. 1411년 아펜첼이 장크트갈렌 수도원장에 맞서 싸우다 베른을 뺀 옛 일곱 주와 시민권·방위 동맹을 맺었다(1452년 갱신으로 준회원이 됨). 1415년 콘스탄츠 공의회에서 황제 지기스문트가 교황 요한 23세의 탈출을 도운 합스부르크의 프리드리히 4세를 제국에서 추방하자 베른이 아르가우를 점령하고, 루체른·취리히 등이 다른 땅을 나눠 공동으로 다스렸다. 1416년 발레 고지(오버발리스)의 고름스 구가 루체른·우리·운터발덴과 시민권 동맹을 맺었다(1417년 지도 반영). 1436년 토겐부르크 백작이 죽자 그 유산을 두고 슈비츠·글라루스와 취리히 사이에 옛 취리히 전쟁(1440~1450)이 일어났다. 취리히가 합스부르크의 프리드리히 3세와 손잡자(1442) 동맹 쪽이 취리히를 에워쌌고, 1443년 장크트야코프 안 데어 질 전투에서 취리히 시장 루돌프 슈튀시가 죽었다. 1444년 5월 동맹군이 항복한 그라이펜제 성의 수비병 64명 가운데 62명을 처형한 일도 있었다. 프리드리히 3세는 프랑스 왕 샤를 7세에게서 군대를 빌렸는데, 왕세자 루이(뒤의 루이 11세)가 이끈 아르마냐크 용병단(에코르쉬르)이 1444년 8월 바젤 근처 장크트야코프 안 데어 비르스에서 스위스 병사 1,500명 안팎과 맞붙었다. 용병단은 수만 명(추산)이었다. 스위스군은 거의 모두 죽었지만 용병단도 큰 피해를 입어 왕세자는 라인강을 건너지 않고 알자스를 약탈한 뒤 물러났다. 전쟁은 1446년 휴전을 거쳐 1450년 취리히가 동맹에 남는 것으로 끝났고, 1451년 장크트갈렌 수도원이 동맹과 손잡았다. 스위스 보병의 창과 미늘창 전술은 이 싸움들에서 단련되어 뒤의 부르고뉴 전쟁(1470년대)에서 이름을 떨쳤다."
  subjects: [switzerland, habsburg-austria, holy-roman-empire, france]
  links:
