- id: lombardy-wars-1423
  year: 1423
  endYear: 1454
  title:
    ko: 롬바르디아 전쟁과 로디 화약
  summary:
    ko: "14세기 말 잔갈레아초 비스콘티가 북이탈리아로 넓힌 밀라노 공국은 그가 죽은 뒤(1402) 흩어졌다가 아들 필리포 마리아 비스콘티(공작 1412~1447)가 되찾았다. 그가 1421년 제노바를 얻고 토스카나로 눈을 돌리자 피렌체가 베네치아에 도움을 청했고, 베네치아는 1425년 동맹하여 밀라노에서 넘어온 용병대장 카르마뇰라를 앞세워 1426년 브레시아를 차지했다. 1427년 10월 마클로디오 전투에서 밀라노군을 이긴 베네치아는 1428년 페라라 화약으로 브레시아와 베르가모를 얻었다(사보이아 공작 아메데오 8세도 베네치아 편에 서서 베르첼리를 얻었다. 카르마뇰라는 뒤에 베네치아에서 반역 혐의로 처형됨, 1432). 이어 1431~1433년, 1435~1441년 전쟁에서 용병대장 프란체스코 스포르차는 때에 따라 밀라노·교황·피렌체·베네치아 편에서 싸웠고, 1441년 크레모나 화약으로 아다강이 밀라노와 베네치아의 경계가 되었다(기아라다다는 앞선 전쟁에서 대부분 베네치아가 얻었고 크레마는 1448~1449년 무렵 들어왔다). 스포르차는 그해 필리포 마리아의 딸 비앙카 마리아와 혼인했다. 1447년 필리포 마리아가 아들 없이 죽자 밀라노 시민은 암브로시오 공화국을 세웠고(1447~1450), 스포르차는 처음 공화국을 위해 싸워 1448년 9월 카라바조에서 베네치아군을 이겼다가 곧 베네치아와 손잡고 밀라노를 굶겨 항복시켜 1450년 2월 공작이 되었다. 이 새 공작을 두고 피렌체의 코시모 데 메디치가 베네치아·나폴리 대신 밀라노와 손잡으면서(이른바 '외교 혁명') 1454년 4월 로디 화약이 맺어졌고, 이어 베네치아·밀라노·피렌체·교황·나폴리가 이탈리아 동맹(1454~1455)을 맺었다. 이 균형은 1494년 프랑스의 침입까지 40년 동안 이어졌다. 도시가 고용한 용병대장(콘도티에리)이 이끈 이 전쟁들은 뒷날 마키아벨리에게 비판받았다."
  subjects: [milan, venice, florence, genoa, naples-kingdom, papal-states, savoy]
  links:
