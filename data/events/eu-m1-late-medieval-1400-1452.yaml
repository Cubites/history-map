- id: ceuta-henry-1415
  year: 1415
  endYear: 1460
  title:
    ko: 세우타 정복과 엔히크 왕자의 항해
  summary:
    ko: "포르투갈 왕 주앙 1세는 1415년 8월 세 아들 두아르트·페드루·엔히크와 함께 함대를 보내 모로코 해안의 이슬람 항구 세우타(마리니드 왕조의 도시)를 하루 만에 차지했다. 포르투갈이 아프리카에 얻은 첫 거점이다. 왕자 엔히크(1394~1460)는 이 싸움으로 이름을 얻은 뒤 그리스도 기사단 단장·알가르브 총독으로 대서양 탐험을 후원했다(그가 사그레스에 항해 학교를 세웠다는 이야기는 후대의 과장으로 본다). 포르투갈 선장들은 1418~1420년 포르투 산투와 마데이라, 1427년 무렵 아조레스에 닿았고(정착은 1439년부터), 1434년 질 에아네스가 보자도르곶을 넘었으며, 1440년대에는 카라벨 범선으로 서아프리카 해안을 따라 내려갔다. 1441년 포르투갈 선장들이 서아프리카 해안에서 사람들을 붙잡아 포르투갈로 데려오기 시작했고, 1444년 라고스에서 붙잡힌 아프리카인 235명이 나뉘어 팔렸다(연대기 작가 주라라의 기록). 이 노예 무역은 이후 수백 년 이어졌다. 1437년 탕헤르 공격은 실패했고 왕자 페르난두가 인질로 잡혀 1443년 죽었다. 교황 니콜라우스 5세는 1452년과 1455년의 칙서로 포르투갈 왕에게 서아프리카 독점과 비신자의 노예화를 허용했다. 카스티야는 카나리아 제도를 두고 포르투갈과 다투었다(1424년 엔히크가 보낸 원정이 정복에 실패). 같은 시기 동아시아에서는 명이 정화의 대함대를 1405년부터 1433년까지 일곱 차례 인도양으로 보냈고(뒤에는 동아프리카 연안까지), 조선은 1419년 쓰시마를 정벌하고 1426년 3포를 열어 일본과의 교역과 왜구 문제를 정리했다. 서로 닿지 않았지만 15세기 전반 바다로 뻗은 서로 다른 길이었다."
  subjects: [portugal, castile]
  tags: [war, economy, society]
  sources: ["Peter Russell, Prince Henry 'the Navigator': A Life (2000)", "Bailey W. Diffie·George D. Winius, Foundations of the Portuguese Empire, 1415–1580 (1977)"]
  places: [{ name: "세우타", at: [-5.31, 35.89], year: 1415 }, { name: "탕헤르", at: [-5.8, 35.77], year: 1437 }]

- id: hussite-wars-1419
  year: 1419
  endYear: 1436
  title:
    ko: 후스 전쟁
  summary:
    ko: "1419년 7월 프라하에서 후스파 설교자 얀 젤리프스키가 이끈 군중이 신시가 시청의 시의원 몇 사람을 창밖으로 던져 죽였고(제1차 프라하 창밖 투척), 보름 남짓 뒤 보헤미아 왕 바츨라프 4세가 죽자 이복동생 지기스문트(헝가리 왕)가 상속자가 되었으나 후스파는 그를 왕으로 받지 않았다. 교황 마르티노 5세는 이단을 치는 십자군을 선포했고 1420~1431년 다섯 차례 십자군이 보헤미아로 쳐들어왔다. 후스파는 양형 영성체·말씀의 자유로운 선포·성직자의 세속 재산 금지·공개적 죄의 처벌을 요구하는 프라하 4개조(1420년 7월)를 내걸었고, 같은 달 얀 지슈카가 프라하 비트코프 언덕에서 첫 십자군을 막았다. 지슈카는 짐수레를 둘러 방벽으로 삼고 그 안에서 화승총과 작은 대포를 쏘는 전술로 기사 중심의 십자군을 거듭 물리쳤고, 그가 죽은(1424) 뒤에는 큰 프로코프가 이어 1426년 아우시히, 1431년 도마즐리체(타우스)에서 이겼다. 후스파는 1428년부터 작센·슐레지엔·프랑켄·헝가리까지 '아름다운 원정'을 벌여 가톨릭 마을과 수도원을 약탈하고 불태웠다. 십자군과 가톨릭 시민도 후스파 신자를 처형하고 마을을 불태웠다. 오스트리아에서는 알브레히트 5세 공작이 유대인이 후스파를 도왔다는 구실로 1420년 5월 유대인을 붙잡아 재산을 빼앗고 1421년 3월 빈에서 남은 이들을 화형시켰다(빈 게세라)(쿠트나호라에서는 후스파 수백 명 이상이 광산 구덩이에 던져졌다고 전한다). 후스파는 한때 폴란드 왕과 비타우타스에게 보헤미아 왕관을 권했고 요가일라의 조카 지기스문트 코리부트가 비타우타스의 뜻으로 1422~1423년, 다시 1424~1427년 프라하에 머물렀다. 후스파 안에서는 온건한 성배파(우트라키스트)와 급진 타보르파·고아파가 갈렸고, 1433년 바젤 공의회와 협정(콤팍타타)을 맺은 온건파와 가톨릭 귀족이 1434년 5월 리파니 전투에서 급진파를 무찔렀다(프로코프 전사). 1436년 지글라바에서 콤팍타타가 확인되고 지기스문트가 보헤미아 왕으로 인정받으며 전쟁이 끝났다."
  subjects: [bohemia-kingdom, holy-roman-empire, hungary-kingdom, papal-states, poland-kingdom, lithuania-grand-duchy]
  links:
    - { from: holy-roman-empire, to: bohemia-kingdom, note: "교황이 선포한 십자군 다섯 차례 (1420~1431)" }
  tags: [war, society]
  sources: ["Thomas A. Fudge, The Crusade against Heretics in Bohemia, 1418–1437 (2002)", "Howard Kaminsky, A History of the Hussite Revolution (1967)"]
