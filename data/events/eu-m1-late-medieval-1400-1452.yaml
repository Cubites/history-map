- id: varna-1444
  year: 1441
  endYear: 1444
  title:
    ko: 후녀디 야노시와 바르나 십자군
  summary:
    ko: "트란실바니아 출신 기사 후녀디 야노시(1406년 무렵~1456)는 1441년 트란실바니아 총독(보이보드)과 베오그라드 지휘관이 되어 헝가리의 오스만 방어를 이끌었다. 1442년 3월 헤르만슈타트(시비우) 근처와 9월 철문 고개에서 오스만군을 이겼고, 1443년 11월 폴란드 왕이자 헝가리 왕인 브와디스와프 3세(헝가리 이름 울라슬로 1세)와 함께 니시와 소피아까지 쳐들어간 '긴 원정'을 했으나 겨울 산악의 즐라티차 고개에서 막혔다. 술탄 무라드 2세는 1444년 에디르네에서 10년 화약을 맺고 세르비아를 전제공 주라지에게 돌려주기로 했으며(8월 세게드에서 헝가리 왕이 맹세), 열두 살 난 아들 메흐메트 2세에게 왕위를 넘기고 물러났다. 그러나 교황 특사 체사리니 추기경은 이교도와의 맹세는 지킬 의무가 없다며 왕을 설득했고, 베네치아·교황 함대가 해협을 막으리라는 기대 속에 십자군(헝가리·폴란드·왈라키아 등 2만 명 안팎으로 추산)이 맹세를 깨고 다시 다뉴브강을 건너 흑해 연안으로 내려갔다. 무라드 2세는 대신들의 간청으로 복위해 제노바 상선의 도움으로 보스포루스를 건너(약속된 해협 봉쇄는 실패했다) 11월 바르나에서 십자군을 크게 이겼다(오스만군은 몇 배 많았다는 추산). 브와디스와프 3세와 체사리니는 죽고 후녀디는 겨우 달아났다. 이 패배로 오스만은 발칸의 주도권을 되찾았고 동로마는 서방 원조의 희망을 잃었다. 후녀디는 1446년 헝가리의 섭정이 되었고 1448년 코소보에서 다시 졌으나(뒤의 사건) 1456년 베오그라드를 지켜 냈다(eu-00a). 같은 시기 조선의 세종은 1443년 훈민정음을 만들어 1446년 반포했다."
  subjects: [hungary-kingdom, poland-kingdom, ottoman, serbian-despotate, wallachia, venice]
  links:
    - { from: hungary-kingdom, to: ottoman, note: "긴 원정과 세게드 화약 (1443~1444)" }
    - { from: ottoman, to: hungary-kingdom, note: "바르나 전투 (1444)" }
  tags: [war, diplomacy]
  sources: ["Colin Imber, The Crusade of Varna, 1443–45 (2006)", "Miklós Molnár, A Concise History of Hungary (2001)", "Kenneth M. Setton, The Papacy and the Levant (1204–1571), Vol. 2: The Fifteenth Century (1978)"]
