- id: murad2-anatolia-1421
  year: 1421
  endYear: 1429
  title:
    ko: 무라드 2세의 즉위와 아나톨리아 재병합
  summary:
    ko: "메흐메트 1세가 1421년 5월 죽고 열일곱 살쯤의 아들 무라드 2세가 술탄이 되자(재위 1421~1444·1446~1451) 동로마 황제 마누엘 2세는 바예지트의 아들이라 자처한 '가짜 무스타파'(뒤쉬메제 무스타파)를 풀어 주어 오스만을 흔들려 했다. 무스타파는 유럽 쪽 영토를 차지했다가 1422년 초 붙잡혀 죽었다. 이어 무라드는 1422년 6월 콘스탄티노폴리스를 포위했으나 아나톨리아에서 동생 '작은 무스타파'가 동로마와 아나톨리아 베이들의 지원으로 반란을 일으키자 9월 포위를 풀었다(동생은 1423년 잡혀 죽음). 1424년 공동 황제 요한네스 8세는 해마다 공물을 바치기로 하고 흑해·마르마라 해안의 여러 도시를 내주었다. 아나톨리아에서는 앙카라 전투 뒤 되살아났던 베이국들을 무라드가 하나씩 다시 합쳤다(사루한은 1410년에 이미 합쳐짐). 테케와 하미드가 1423, 멘테셰가 1424, 아이든이 1425년에 넘어왔고, 게르미얀은 마지막 베이 야쿱 2세의 유언으로 1429년에 오스만에 들어왔다. 카라만과 잔다르 베이국은 따로 남아 오스만의 종주권을 인정하면서 독립을 이어 갔다. 무라드 2세 아래 오스만은 앙카라 이전의 판도를 되찾고 발칸 진출을 다시 시작했다(테살로니키 함락, 바르나 전투, 코소보)."
  subjects: [ottoman, anatolian-beyliks, byzantine-empire, karaman-beylik, candar-beylik]
  links:
    - { from: ottoman, to: anatolian-beyliks, note: "아나톨리아 베이국의 재병합 (1423~1429)" }
  tags: [war, politics]
  sources: ["Dimitris J. Kastritsis, The Sons of Bayezid (2007)", "Halil İnalcık, The Ottoman Empire: The Classical Age 1300–1600 (1973)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
