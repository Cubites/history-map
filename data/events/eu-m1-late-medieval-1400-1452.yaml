- id: melno-1422
  year: 1422
  endYear: 1440
  title:
    ko: 멜노 호 평화와 튜턴 기사단국의 쇠퇴
  summary:
    ko: "그룬발트 이후에도 기사단은 사모기티아와 접경 땅을 두고 폴란드·리투아니아와 다투었다. 1422년 7월 폴란드 왕 요가일라가 쳐들어오고 비타우타스가 가세한 골룹 전쟁에서 기사단은 큰 싸움 없이 밀려 9월 멜노 호숫가에서 강화를 맺었다. 이 멜노 조약으로 기사단은 사모기티아를 영구히 리투아니아에 넘기고(네만강 어귀의 클라이페다 일대만 남김) 폴란드에는 접경 땅 일부를 내주었다. 기사단은 이후 남은 땅을 지켰으나 용병에 기댄 재정이 무너지고 세금이 늘며 도시와 기사들의 불만이 커졌다. 1435년 리투아니아 내전에서 기사단의 동맹군(리보니아 기사단)이 비우코미에시에서 지자(뒤의 사건) 폴란드와 브셰시치쿠야비스키 평화를 맺었고(1435), 1440년 3월 프로이센의 도시와 기사 단체가 크비진(마리엔베르더)에서 프로이센 연합을 만들어 기사단장에게 맞섰다. 이 연합은 1454년 폴란드 왕에게 의탁해 13년 전쟁을 일으킨다. 리보니아에서는 기사단·주교·도시가 15세기 초부터 발크에서 신분 의회를 열었고(1422년 의회를 지도는 리보니아 연맹의 시작으로 본다), 리보니아 기사단은 프로이센의 기사단과 따로 움직이며 리투아니아 내전 때 스비트리가일라 편에 섰다."
  subjects: [teutonic-order, poland-kingdom, lithuania-grand-duchy, terra-mariana, livonian-confederation]
