# 유럽 중세 사건 1차 묶음: 앙카라 전투에서 루멜리 히사르까지 (1400 ~ 1452, 작업 EVM1)
# 범위: 앙카라 전투와 오스만 공백기, 갈리폴리 조약, 베네치아의 테라페르마와 달마티아, 그룬발트와 제1차 토룬 조약, 콘스탄츠 공의회와 대분열의 끝, 얀 후스와 후스 전쟁,
#   아쟁쿠르와 트루아 조약, 잔 다르크와 아라스 조약, 포르미니와 노르망디·기옌의 회복, 세우타 정복과 엔히크 왕자, 칼마르 동맹의 흔들림,
#   피렌체의 초기 르네상스, 롬바르디아 전쟁, 알폰소 5세의 나폴리, 바젤·피렌체 공의회, 바르나 십자군과 코소보, 세르비아 전제공국,
#   비타우타스와 리투아니아 내전, 킵차크 칸국의 분열, 모스크바의 계승 전쟁, 부르고뉴의 저지대, 테살로니키 함락, 루멜리 히사르.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 1400~1452년 지도에서 생기거나 끝난 항목(세르비아 전제공국 1402·모라바 세르비아 1402·
#   스몰렌스크 1404·시칠리아 왕국 1409·브란코비치 영지 1412·사보이아 1416·아르보레아 1420·리보니아 연맹 1422·아나톨리아 베이국들 1429·
#   아카이아 1432·카잔 1438·노가이 1440·크림 1441·레저 동맹 1444·칼마르 동맹 1447/1448·헤르체고비나 1448·동로마 1453)를 모두 subjects로 이음
#   (docs/REGION_GUIDE.md §5, 점검 방식은 EVD2의 성립·소멸 점검과 같음).
# 한국사와 닿는 점: 티무르의 죽음(1405)과 정화의 원정은 앙카라 사건에서 명을 subjects로 이었다. 세종 시대(1418~1450)와 같은 시기의 일
#   (「혼일강리역대국도지도」·갑인자와 자격루·훈민정음·화차)은 서술로만 견주었고, 05번 조선 초기 파일에 있는 사건은 다시 만들지 않았다.
# 동로마(비잔티움) 제국은 1400~1452년 지도에 `byzantine-empire` 항목이 있어 subjects에 넣었다. 1453년 함락은 eu-00a의 `constantinople-1453`이 다룬다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 9~10일 차이가 나므로 달까지만 적는다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본). 병력·사상자·인구는 연구자마다 크게 달라 범위와 '추산'으로 적었다. 운영자 검수 필요.

# ── 1402 ~ 1413년: 앙카라 전투와 공백기, 세르비아의 전제공국, 스몰렌스크 ──────

- id: ankara-1402
  year: 1402
  endYear: 1413
  title:
    ko: 앙카라 전투와 오스만 공백기
  summary:
    ko: "1402년 7월 아나톨리아 중부 앙카라 근처에서 티무르(사마르칸트를 중심으로 중앙아시아·이란·이라크를 정복한 군주)의 군대가 오스만 술탄 바예지트 1세의 군대를 무찌르고 술탄을 사로잡았다(바예지트는 이듬해 3월 포로 신세로 죽음). 바예지트가 병합했던 아나톨리아 베이국들의 병사는 싸움 도중 티무르 쪽으로 넘어갔고, 세르비아 영주 스테판 라자레비치의 중기병은 끝까지 술탄 곁에서 싸웠다. 티무르는 서아나톨리아를 휩쓸며 스미르나(이즈미르)를 로도스 기사단에게서 빼앗고(12월) 게르미얀·아이든·사루한·멘테셰·테케 같은 베이국과 카라만을 되살리고 잔다르(이스펜디야르)가 땅을 되찾게 한 뒤 물러났다. 그 뒤 1413년까지 바예지트의 아들들(에디르네의 쉴레이만, 부르사의 이사, 아마시아의 메흐메트, 뒤에 무사)이 술탄 자리를 놓고 싸운 시기를 오스만의 공백기(페트레트 데브리)라 부른다. 쉴레이만은 1403년 갈리폴리 조약(뒤의 사건)으로 유럽 쪽 이웃과 화해했으나 1411년 무사에게 져 죽었고, 왈라키아의 미르체아 1세의 도움을 받은 무사도 1413년 7월 차무를루 전투에서 메흐메트와 그를 지지한 동로마 황제 마누엘 2세·세르비아 스테판의 연합에 져 죽었다. 승자 메흐메트 1세는 나라를 다시 하나로 모아 1421년까지 다스렸다. 이 혼란 덕에 오스만의 콘스탄티노폴리스 봉쇄(1394~1402)가 풀려 동로마는 반세기 가까이 더 이어졌다. 티무르는 1404년 말 명 원정에 나섰다가 1405년 2월 오트라르에서 죽었다. 같은 1405년 명의 영락제는 정화의 첫 대원정을 내보냈고, 조선에서는 태종이 1402년 「혼일강리역대국도지도」를 만들어 원 대 지도를 바탕으로 유럽과 아프리카까지 그려 넣었다."
  subjects: [ottoman, byzantine-empire, anatolian-beyliks, karaman-beylik, candar-beylik, wallachia, ming]
  links:
    - { from: anatolian-beyliks, to: ottoman, note: "앙카라 전투 중 병사 이탈, 뒤에 다시 병합 (1402~1429)" }
  tags: [war, politics]
  sources: ["Dimitris J. Kastritsis, The Sons of Bayezid: Empire Building and Representation in the Ottoman Civil War of 1402–13 (2007)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (1989)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
  places: [{ name: "앙카라", at: [32.86, 39.93], year: 1402 }, { name: "차무를루(사모코프 근처)", at: [23.55, 42.34], year: 1413 }]

- id: serbian-despotate-1402
  year: 1402
  endYear: 1427
  title:
    ko: 스테판 라자레비치와 세르비아 전제공국의 성립
  summary:
    ko: "1389년 코소보 전투에서 아버지 라자르 공이 죽은 뒤 어린 스테판 라자레비치는 오스만 술탄의 봉신으로 모라바강 유역의 세르비아(모라바 세르비아)를 다스렸다. 그는 1396년 니코폴리스와 1402년 앙카라에서 술탄 바예지트 곁에서 싸웠고, 앙카라에서 진 뒤 콘스탄티노폴리스로 가 동로마 황제 요한네스 7세에게서 전제공(데스포트) 칭호를 받았다. 이때부터 그의 나라를 세르비아 전제공국이라 부른다. 오스만 왕자들이 술탄 자리를 놓고 싸우는 동안 스테판은 헝가리 왕 지기스문트에게 신서해(1403~1404년) 베오그라드와 마치바를 봉토로 받았고 베오그라드를 새 수도로 삼았으며(1408년 지기스문트의 용 기사단에도 들었다), 1413년에는 스테판의 세르비아군(조카 주라지 휘하 부대 포함)이 메흐메트 쪽에서 무사를 무찌르는 데 보탰다. 코소보와 시에니차·노비파자르 쪽은 부크 브란코비치의 아들들(그르구르·주라지·라자르)의 영지로 오스만의 봉신이었는데, 스테판과 다투던 주라지가 1412년 그와 화해하면서 이 영지도 전제공국 쪽으로 돌아섰다. 노보브르도 같은 광산의 은 수입이 나라의 밑천이었고, 스테판은 시와 글을 쓴 학자 군주이기도 했다. 1426년 무렵 그는 헝가리 왕과 합의해 자식 없는 자신의 뒤를 조카 주라지 브란코비치가 잇도록 했고, 1427년 스테판이 죽자 베오그라드를 헝가리에 돌려준 뒤 주라지가 전제공이 되어 새 수도 스메데레보(1430년 완공)를 쌓았다."
  subjects: [moravian-serbia, serbian-despotate, brankovic-lands, ottoman, byzantine-empire, hungary-kingdom]
  links:
    - { from: hungary-kingdom, to: serbian-despotate, note: "스테판의 신서와 베오그라드·마치바 봉토 (1403~1404)" }
  tags: [politics, diplomacy]
  sources: ["John V. A. Fine Jr., The Late Medieval Balkans: A Critical Survey from the Late Twelfth Century to the Ottoman Conquest (1987)", "Sima Ćirković, The Serbs (2004)", "마크 마조워, 『발칸의 역사』(이순호 옮김, 을유문화사, 2014)"]

- id: gallipoli-treaty-1403
  year: 1403
  title:
    ko: 갈리폴리 조약과 동로마의 회복
  summary:
    ko: "앙카라 전투로 오스만이 무너지자 바예지트의 큰아들 쉴레이만은 유럽 쪽 영토(루멜리아)를 지키려고 1403년 초 갈리폴리에서 동로마(황제 마누엘 2세가 서유럽을 돌고 있는 동안 조카이자 섭정인 요한네스 7세)와 베네치아·제노바·로도스 기사단·낙소스 공작과 화약을 맺었다. 오스만은 동로마에 물리던 공물(1373년부터)을 없애고 테살로니키와 칼라마리아(그 둘레의 마케도니아 땅), 마르마라해와 흑해에 면한 트라키아 해안(대략 파니도스에서 메셈브리아), 스키로스 등 에게해의 섬과 마그네시아 쪽 해안, 아나톨리아 쪽 성채 몇 곳을 돌려주었다. 쉴레이만은 마누엘 2세를 '아버지'로 모시며 형제들과 싸울 동안 뒤를 지켜 주기를 바랐다. 동로마는 이 땅으로 콘스탄티노폴리스의 식량 공급선과 숨 돌릴 틈을 얻었으나 힘이 약해 오래 지키지 못했다. 1422년 무라드 2세가 콘스탄티노폴리스를 포위한 뒤 1424년 강화에서 다시 공물을 바치기로 하며 흑해·마르마라 해안의 대부분을 내주었고, 테살로니키는 1423년 베네치아에 넘겼다가 1430년 오스만에 떨어졌다(뒤의 사건)."
  subjects: [ottoman, byzantine-empire, venice, genoa, knights-hospitaller]
  links:
    - { from: ottoman, to: byzantine-empire, note: "테살로니키와 해안 땅 반환, 공물 면제 (1403)" }
  tags: [diplomacy, politics]
  sources: ["Dimitris J. Kastritsis, The Sons of Bayezid (2007)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]

- id: vytautas-smolensk-1401
  year: 1401
  endYear: 1413
  title:
    ko: 비타우타스의 스몰렌스크 병합과 호로들로 연합
  summary:
    ko: "리투아니아 대공 비타우타스(재위 1392~1430)는 폴란드 왕 요가일라(야기에우워)의 사촌이자 협력자로 동슬라브 땅을 넓혔다. 스몰렌스크는 1395년 그가 한 번 차지했으나 1401년 공후 유리 스뱌토슬라비치가 랴잔의 도움으로 되찾았고(사건의 시작), 1404년 비타우타스가 도시를 에워싸 다시 차지하면서 스몰렌스크 공국은 리투아니아 대공국에 합쳐졌다(뱌지마는 1403년). 이어 사위인 모스크바 대공 바실리 1세와 1406~1408년 전쟁을 벌였으나 우그라강 가에서 서로 맞서다 강화해 우그라강을 경계로 삼았다. 그의 시대 리투아니아는 발트해에서 흑해 쪽 초원까지 닿았지만 1399년 보르스클라강 가에서 에디게이가 이끈 대오르다 군대에 크게 졌다. 비타우타스는 1410년 그룬발트에서 튜턴 기사단을 꺾고(뒤의 사건) 1413년 호로들로(폴란드와 리투아니아의 접경)에서 두 나라 귀족이 맺은 연합 조약으로 리투아니아의 가톨릭 귀족이 폴란드 귀족과 같은 권리를 누리고 폴란드 문장 가문에 들어가게 했다. 비타우타스가 죽으면 리투아니아 귀족이 폴란드 왕과 협의해 새 대공을 뽑기로도 했다. 정교회 루스인이 다수인 나라에서 이 조약은 가톨릭 귀족과 정교 귀족의 권리 차이라는 숙제를 남겼다(뒤의 리투아니아 내전의 그로드노 특권으로 이어짐)."
  subjects: [lithuania-grand-duchy, smolensk-principality, grand-duchy-of-moscow, poland-kingdom, ryazan, golden-horde]
