# ── 1437 ~ 1452년: 킵차크 칸국의 분열, 칼마르 동맹, 바르나와 코소보, 노르망디·기옌, 루멜리 히사르 ──────

- id: golden-horde-breakup-1437
  year: 1437
  endYear: 1445
  title:
    ko: "킵차크 칸국의 분열: 카잔·크림·노가이"
  summary:
    ko: "14세기 말 티무르에게 크게 진 뒤(1395) 킵차크 칸국(대오르다)은 귀족 에디게이 등이 칸의 자리를 두고 갈려 싸우다 15세기 초 중앙 권력을 잃었다. 1437년 쿠추크 무함마드에게 사라이에서 쫓겨난 칸 울루그 무함마드는 그해 말 벨료프 근처에서 모스크바군을 이긴 뒤 1438년 볼가강 가운데의 카잔을 차지해 카잔 칸국을 세웠다. 크림반도에서는 1441년 하지 기레이가 리투아니아의 지원으로 칸이 되어 기레이 왕조(크림 칸국)를 열었다. 에디게이의 후손이 속한 망기트 부족은 볼가강과 우랄강 사이에서 칸을 두지 않고 비(귀족)와 미르자가 다스리는 노가이 오르다를 이루었다(1440 무렵). 사라이의 대오르다는 쿠추크 무함마드와 그 자손이 이었으나 힘이 약해졌다. 모스크바는 이 분열을 이용하면서도 칸국의 압박을 받았고, 칸국들도 모스크바의 계승 전쟁(1445년 수즈달 전투에서 대공 바실리 2세를 붙잡음)과 리투아니아의 내전에 끼어들었다. 1480년 우그라강 대치로 모스크바가 대오르다의 종주권에서 벗어나고 1502년 크림 칸이 대오르다를 무너뜨린다(eu-00a의 이반 3세 사건). 유라시아 초원 세력이 여러 칸국으로 갈라지는 출발이 이 시기였다."
  subjects: [golden-horde, kazan-khanate, crimean-khanate, nogai-horde, grand-duchy-of-moscow, lithuania-grand-duchy]
  links:
    - { from: golden-horde, to: kazan-khanate, note: "울루그 무함마드의 카잔 건국 (1438)" }
    - { from: golden-horde, to: crimean-khanate, note: "하지 기레이의 크림 칸국 (1441)" }
  tags: [politics, war]
  sources: ["Charles J. Halperin, Russia and the Golden Horde: The Mongol Impact on Medieval Russian History (1985)", "Dariusz Kołodziejczyk, The Crimean Khanate and Poland-Lithuania (2011)", "Janet Martin, Medieval Russia 980–1584 (2판, 2007)"]
