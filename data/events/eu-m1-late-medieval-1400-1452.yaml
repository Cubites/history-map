- id: arras-1435
  year: 1435
  endYear: 1436
  title:
    ko: 아라스 조약
  summary:
    ko: "필리프 선량공은 아버지를 죽인 왕세자 쪽에 복수하려 잉글랜드와 손잡았으나(트루아 조약), 잉글랜드 왕의 숙부 글로스터 공작 험프리가 필리프의 사촌 야코바와 혼인해 에노를 노리는 등(1424~1425) 동맹 사이에 불신이 쌓였고, 전쟁이 길어질수록 프랑스 왕과 싸우는 부담도 컸다. 1435년 8월부터 아라스에서 교황 특사 알베르가티 추기경과 바젤 공의회 특사의 중재로 잉글랜드·프랑스·부르고뉴 대표가 모였으나 잉글랜드는 협상장에서 물러났다. 9월 프랑스 왕 샤를 7세와 필리프는 조약을 맺었다. 샤를은 몽트로 다리에서의 장 암살(1419)을 유감으로 표하고, 필리프에게 마콩 백작령·오세르 백작령과 솜강 변 도시들(페론·루아·몽디디에·아미앵 등)과 퐁티외 백작령 같은 땅을 주며 평생 신종 의무를 면해 주기로 했다. 필리프는 이로써 잉글랜드 편에서 프랑스 왕 쪽으로 돌아섰다. 잉글랜드의 프랑스 섭정 베드퍼드 공작이 9월 루앙에서 죽은 뒤 잉글랜드의 프랑스 지배는 빠르게 흔들렸다. 1436년 4월 파리 시민이 성문을 열어 아르튀르 드 리슈몽 원수의 프랑스군을 받아들였고, 필리프는 7월 잉글랜드의 칼레를 공격했으나 실패했다. 샤를 7세는 이후 상비군과 대포, 세금 개혁으로 전쟁을 끝내는 길을 닦는다."
  subjects: [france, burgundy, england]
  links:
