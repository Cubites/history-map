# ── 1414 ~ 1436년: 콘스탄츠 공의회, 후스 전쟁, 백년 전쟁의 마지막 불꽃 ──────

- id: constance-1414
  year: 1414
  endYear: 1418
  title:
    ko: 콘스탄츠 공의회와 교회 대분열의 끝
  summary:
    ko: "1378년 이래 서유럽 교회는 로마와 아비뇽에 교황이 따로 서 있었고(교회 대분열), 1409년 피사 공의회가 두 교황을 폐위하고 세 번째 교황을 세웠으나 둘이 물러나지 않아 교황이 셋이 되었다. 독일 왕 지기스문트(헝가리 왕이기도 했고 1433년 황제로 대관)의 압력으로 피사 계열의 교황 요한 23세가 1414년 11월 콘스탄츠에서 공의회를 열었다. 요한 23세는 1415년 3월 콘스탄츠를 빠져나갔다가 5월 폐위되었고, 로마 교황 그레고리오 12세는 7월 스스로 물러났으며, 끝까지 버틴 아비뇽 계열의 베네딕토 13세는 아라곤·카스티야·나바라 왕이 지지를 거두자(1415년 나르본 협정) 1417년 7월 폐위되었다. 공의회는 11월 오도네 콜론나를 교황 마르티노 5세로 뽑아 40년 가까운 분열을 끝냈다. 공의회는 교황보다 공의회가 위라는 교령 『하에크 상크타』(1415)와 10년마다 공의회를 열도록 한 『프레쿠엔스』(1417)를 냈지만 교황청은 뒤에 이를 따르지 않았다. 같은 공의회에서 보헤미아의 얀 후스가 화형을 당했고(뒤의 사건) 위클리프의 글이 단죄되었다. 지기스문트가 합스부르크의 프리드리히 4세를 제국에서 추방한 일은 스위스의 아르가우 정복으로 이어졌다. 1417년 무렵부터 북독일 항구들에, 1418년에는 남독일·스위스 도시들에 '이집트인'이라 불린 로마(집시)가 나타나 지기스문트의 통행증을 내세웠다(전하는 통행증 가운데 위조로 밝혀진 것이 있다). 1416년 2월 지기스문트는 샹베리에서 사보이아 백작 아메데오 8세를 공작으로 올렸고, 이어 프랑스와 잉글랜드를 오가며 백년 전쟁을 중재하려 했으나 이루지 못했다. 공의회는 1418년 4월 막을 내렸다. 조선에서는 이해(1418) 세종이 즉위했다."
  subjects: [papal-states, holy-roman-empire, hungary-kingdom, aragon, castile, navarre, savoy-county, savoy, england, france]
