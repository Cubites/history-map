- id: moscow-succession-1425
  year: 1425
  endYear: 1453
  title:
    ko: 모스크바의 계승 전쟁과 바실리 2세
  summary:
    ko: "모스크바 대공 바실리 1세가 1425년 죽자 열 살의 아들 바실리 2세와, 형제가 잇는 옛 관행을 내세운 숙부 유리(즈베니고로드·갈리치 공)가 대공 자리를 두고 다투었다. 바실리 2세의 외할아버지인 리투아니아의 비타우타스가 1430년까지 그를 보호했고, 1432년 대오르다의 칸이 바실리 2세에게 대공 칭호를 확인해 주었다. 유리는 1433년과 1434년 모스크바를 차지했으나 곧 죽었고, 그의 아들들(바실리 코소이와 드미트리 셰먀카)이 싸움을 이었다. 바실리 2세는 1436년 코소이를 붙잡아 눈을 멀게 했다. 1445년 7월 바실리 2세는 수즈달 근처에서 카잔 칸국 칸 울루그 무함마드의 아들들에게 져 사로잡혔다가 큰 몸값을 약속하고 풀려났고, 이를 구실로 셰먀카가 1446년 2월 그를 붙잡아 눈을 멀게 한 뒤(그래서 '눈먼 자'라 불린다) 모스크바를 차지했다. 바실리는 트베리 대공 보리스의 도움과 귀족들의 지지로 1447년 모스크바로 돌아왔고, 셰먀카는 1450년 패해 노브고로드로 달아났다가 1453년 죽었다(독살로 전한다). 이 기간 모스크바 교회도 갈라졌다. 1439년 피렌체 공의회의 교회 합동에 서명한 키예프 대주교 이시도르(그리스 출신)를 바실리 2세가 1441년 가두었고, 1448년 러시아 주교들이 콘스탄티노폴리스의 승인 없이 요나를 대주교로 뽑아 모스크바 교회가 사실상 독립했다. 계승 전쟁 끝에 부자 상속이 굳어지고 갈라졌던 영지가 대공 아래 모여 아들 이반 3세의 통합(eu-00a의 이반 3세 사건)의 바탕이 되었다. 바실리 2세가 타타르 왕족 카심 칸에게 오카강 가의 땅을 준 일(1452년 무렵, 카시모프 칸국의 시초)은 모스크바와 타타르의 얽힌 관계를 보여 준다."
  subjects: [grand-duchy-of-moscow, novgorod-republic, tver, kazan-khanate, golden-horde, lithuania-grand-duchy]
  links:
    - { from: kazan-khanate, to: grand-duchy-of-moscow, note: "수즈달 전투, 바실리 2세 포로 (1445)" }
  tags: [war, politics]
  sources: ["Janet Martin, Medieval Russia 980–1584 (2판, 2007)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)", "Charles J. Halperin, Russia and the Golden Horde: The Mongol Impact on Medieval Russian History (1985)"]
