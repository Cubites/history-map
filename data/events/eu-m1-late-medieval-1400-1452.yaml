  sources: ["Joycelyne G. Dickinson, The Congress of Arras, 1435: A Study in Medieval Diplomacy (1955)", "Richard Vaughan, Philip the Good: The Apogee of Burgundy (1970)", "Christopher Allmand, The Hundred Years War: England and France at War c.1300–c.1450 (1988)"]
