  tags: [politics, diplomacy]
  sources: ["Phillip H. Stump, The Reforms of the Council of Constance (1414–1418) (1994)", "Louise Ropes Loomis, The Council of Constance: The Unification of the Church (1961)"]

- id: jan-hus-1415
  year: 1415
  title:
    ko: 얀 후스의 화형
  summary:
    ko: "프라하 대학 총장을 지낸 신학자 얀 후스(1370년 무렵~1415)는 프라하 베들레헴 예배당의 체코어 설교로 이름을 얻었고, 잉글랜드 신학자 위클리프의 사상을 이어받아 교회의 부와 면죄부 판매를 비판했다. 1409년 쿠트나호라 칙령으로 대학에서 체코인의 표수가 늘자 독일인 교수와 학생이 라이프치히로 떠났고, 1411년 후스는 파문당했으며, 1412년 면죄부 판매에 반대한 뒤 프라하를 떠나 보헤미아 남부에서 글을 썼다. 1414년 지기스문트의 안전 통행증을 받아 콘스탄츠 공의회에 나갔으나 곧 갇혔고, 1415년 6월 심문에서 자신이 가르친 적 없다고 한 조목까지 철회하라는 요구를 거부해 7월 이단으로 화형되었다. 이듬해 5월 그의 동료 프라하의 예로님도 화형되었다. 안전 통행증이 지켜지지 않은 데에 항의해 보헤미아와 모라비아의 귀족 452명이 서한을 보냈고(1415년 9월), 후스는 체코 민족 의식의 상징이 되어 후스 전쟁(1419~1436)의 불씨가 되었다. 후스를 따르는 사람들(후스파)은 평신도에게도 잔을 주는 양형 영성체를 요구했다."
  subjects: [bohemia-kingdom, holy-roman-empire, papal-states]
  tags: [politics, society]
  sources: ["Matthew Spinka, John Hus: A Biography (1968)", "Thomas A. Fudge, Jan Hus: Religious Reform and Social Revolution in Bohemia (2010)"]

- id: agincourt-troyes-1415
  year: 1415
  endYear: 1425
  title:
    ko: 아쟁쿠르 전투와 트루아 조약
  summary:
    ko: "프랑스 왕 샤를 6세가 정신 질환으로 정사를 돌보지 못하자 오를레앙 공작 루이와 부르고뉴 공작 장 상 푀르('두려움 없는 장', 용맹공)가 섭정 자리를 두고 다투었고, 1407년 장이 루이를 암살하면서 오를레앙파(아르마냐크파)와 부르고뉴파가 갈라져 내전을 벌였다. 이 틈에 잉글랜드 왕 헨리 5세가 프랑스 왕위 계승권을 내세워 1415년 8월 센강 어귀에 상륙해 9월 아르플뢰르를 점령한 뒤 칼레로 향하다가, 10월 아쟁쿠르에서 훨씬 많은 프랑스군(추산 1만 2천~3만 6천 명, 잉글랜드군 6천~9천 명)과 마주쳤다. 진창이 된 좁은 들판에서 잉글랜드 장궁병이 프랑스 중기병의 돌격을 무너뜨렸다. 프랑스 쪽은 총사령관 달브레와 브라반트 공작 등 대귀족이 많이 죽었고(전사 4천~1만 명 추산), 오를레앙 공작 샤를은 포로가 되어 25년 가까이 잉글랜드에서 지냈다. 헨리 5세는 전투 중 포로를 죽이라고 명령했다(정황은 기록마다 다르다). 이어 헨리는 노르망디를 정복했고(1417~1419) 1419년 9월 몽트로 다리에서 왕세자 샤를 쪽 사람들이 장을 죽이자 그의 아들 필리프(선량공)가 잉글랜드와 손잡았다. 1420년 5월 트루아 조약으로 샤를 6세는 왕세자를 상속에서 빼고 헨리 5세를 섭정이자 상속자로 삼았으며 딸 카트린을 헨리에게 시집보냈다. 1422년 8월 헨리 5세가, 두 달 뒤 샤를 6세가 죽자 갓난 헨리 6세가 잉글랜드와 프랑스 두 나라의 왕이 되었고(랭커스터 이중 왕국) 베드퍼드 공작이 프랑스 섭정을 맡았다. 왕세자 샤를은 루아르강 남쪽에서 스스로 샤를 7세라 칭하며 맞섰고, 1421년 보제에서는 스코틀랜드 지원군과 함께 잉글랜드군을 이겼다. 그러나 베드퍼드는 1424년 베르뇌유에서 프랑스·스코틀랜드 연합군을 꺾고 1425년 멘을 차지해 이중 왕국의 땅을 가장 넓혔다."
  subjects: [england, france, burgundy, scotland]
  links:
    - { from: england, to: france, note: "아쟁쿠르 전투와 트루아 조약, 노르망디 정복 (1415~1420)" }
    - { from: burgundy, to: england, note: "필리프 선량공의 동맹 (1419~1420)" }
  tags: [war, diplomacy]
  sources: ["Anne Curry, Agincourt: A New History (2005)", "Christopher Allmand, Henry V (1992)", "Christopher Allmand, The Hundred Years War: England and France at War c.1300–c.1450 (1988)"]
