- id: grunwald-1410
  year: 1410
  endYear: 1411
  title:
    ko: 그룬발트(탄넨베르크) 전투와 제1차 토룬 조약
  summary:
    ko: "사모기티아(리투아니아 서쪽의 저지)는 1398년 살리나스 조약으로 튜턴 기사단이 차지하고 있었으나 1409년 주민이 봉기하고 비타우타스가 돕자 기사단이 폴란드 왕국과 리투아니아에 선전해 1409~1411년의 대전쟁이 일어났다. 1410년 7월 프로이센 남부(지금의 폴란드 북동부, 오스트루다 근처) 그룬발트(독일어 탄넨베르크) 들판에서 폴란드 왕 브와디스와프 2세 야기에우워와 비타우타스가 이끈 폴란드·리투아니아·루스·타타르 군(체코·몰다비아 파견대 포함)이 기사단장 울리히 폰 융깅겐의 기사단군(서유럽에서 온 용병과 십자군 지원병 포함)과 맞섰다. 기사단군이 크게 지고 융깅겐과 많은 고위 기사가 죽었다. 양쪽 병력은 합쳐 5만~7만 명 안팎으로 추산하지만 수치는 연구자마다 크게 다르다. 연합군은 기사단의 수도 마리엔부르크(말보르크)를 두 달가량 포위했으나 하인리히 폰 플라우엔의 방어에 막혀 물러났다. 1411년 2월 제1차 토룬 조약으로 기사단은 도브진 땅을 폴란드에 돌려주고, 사모기티아는 요가일라와 비타우타스가 살아 있는 동안만 두 사람에게 맡기며, 배상금으로 프라하 그로셴 은화 10만 코파를 여러 해에 나눠 내기로 했다. 기사단은 이 배상금을 마련하려고 도시와 영지에 무거운 세금을 매겨 불만을 키웠고, 이것이 프로이센 연합(1440)과 13년 전쟁(1454)의 밑바탕이 되었다."
  subjects: [poland-kingdom, lithuania-grand-duchy, teutonic-order]
  links:
