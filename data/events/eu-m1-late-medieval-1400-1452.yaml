- id: thessalonica-1430
  year: 1430
  title:
    ko: 테살로니키 함락
  summary:
    ko: "1403년 갈리폴리 조약으로 동로마가 되찾은 테살로니키(데살로니가)는 제국 제2의 도시였다. 1422년 무라드 2세가 도시를 에워쌌고, 1423년 전제공 안드로니코스 팔라이올로고스는 지킬 힘이 없자 도시를 베네치아에 넘겼다. 오스만과 베네치아의 전쟁(1425~1430) 중 도시는 식량과 병력이 모자라 주민과 베네치아 지휘관의 사이가 나빠졌고, 1430년 3월 무라드 2세가 직접 대군을 이끌고 와 성벽을 뚫고 도시를 차지했다. 오스만군은 약탈하고 주민 수천 명을 노예로 끌고 갔다고 동로마 연대기(요한네스 아나그노스테스)는 전한다. 노예가 된 주민 일부는 몸값을 내고 돌아왔고 오스만은 튀르크 이주민을 들여 도시를 다시 채웠다. 같은 해 10월 에피루스의 요아니나도 오스만에 들어갔다. 베네치아는 강화로 도시를 단념했다. 동로마는 이 도시를 잃어 콘스탄티노폴리스와 펠로폰네소스 정도만 남게 되었다."
  subjects: [ottoman, venice, byzantine-empire, epirus-despotate]
  links:
    - { from: ottoman, to: venice, note: "테살로니키 함락 (1430)" }
  tags: [war]
  sources: ["Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "Apostolos E. Vacalopoulos, History of Macedonia 1354–1833 (1973)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
  places: [{ name: "테살로니키", at: [22.94, 40.64] }]

- id: lithuanian-civil-war-1430
  year: 1430
  endYear: 1438
  title:
    ko: 비타우타스의 죽음과 리투아니아 내전
  summary:
    ko: "비타우타스는 1429년 루츠크 회의에서 황제 지기스문트가 제안한 왕관을 받아들여 폴란드에서 독립한 리투아니아 왕국을 세우려 했다. 폴란드의 크라쿠프 주교 올레시니츠키와 귀족들이 반대해 왕관을 가져오던 사절을 막았고(1430년 9월), 비타우타스는 왕관 없이 1430년 10월 트라카이에서 죽었다. 폴란드 왕 요가일라는 아우 스비트리가일라(비타우타스의 오랜 경쟁자)를 대공으로 세웠으나 스비트리가일라는 폴란드의 영향을 거부하며 서포딜리아(포돌리아)를 두고 폴란드와 부딪쳤다(폴란드가 서포딜리아를 차지). 1432년 9월 리투아니아 귀족들이 비타우타스의 동생 지기몬타스 케스투타이티스를 대공으로 세우자 스비트리가일라는 폴로츠크·비쳅스크·볼히니아 등 동쪽 루스 땅의 정교 귀족과 튜턴 기사단·리보니아 기사단의 도움으로 맞섰다. 1432년 그로드노 합동에 이어 1434년 지기몬타스가 정교 귀족에게도 가톨릭 귀족과 같은 권리를 준 특권을 내렸고, 1435년 9월 비우코미에시(빌코미르) 전투에서 지기몬타스 쪽(폴란드군이 가세)이 스비트리가일라와 리보니아 기사단군을 크게 이겼다. 스비트리가일라는 패배한 뒤에도 얼마간 저항하다 볼히니아(루츠크)로 물러나 그곳을 다스렸고(1438년 무렵부터) 1452년 루츠크에서 죽었다. 지기몬타스는 1440년 트라카이에서 암살되었고(배후는 자료마다 다르다) 요가일라의 아들 카지미에시가 대공이 되었다. 내전을 거치며 리투아니아는 폴란드와 더 가까워졌으나 정교 귀족의 불만은 이어졌다."
  subjects: [lithuania-grand-duchy, poland-kingdom, teutonic-order, livonian-confederation]
  links:
    - { from: poland-kingdom, to: lithuania-grand-duchy, note: "비타우타스 사후 서포딜리아 점령과 내전 개입 (1430~1435)" }
  tags: [war, politics]
  sources: ["Zigmantas Kiaupa·Jūratė Kiaupienė·Albinas Kunevičius, The History of Lithuania before 1795 (2000)", "Norman Davies, God's Playground: A History of Poland, Vol. 1 (개정판, 2005)"]
  places: [{ name: "비우코미에시(빌코미르)", at: [24.77, 55.25], year: 1435 }]

- id: councils-basel-florence-1431
  year: 1431
  endYear: 1439
  title:
    ko: 바젤·페라라·피렌체 공의회와 교회 합동
  summary:
    ko: "콘스탄츠 공의회가 약속한 새 공의회가 1431년 7월 바젤에서 열렸다. 공의회는 교황 에우제니오 4세가 해산하라고 한 뒤에도 버티며 공의회가 교황보다 위라는 주장(공의회 수위설)을 이어 갔고 후스파와도 협정(콤팍타타, 1433)을 맺었다. 로마에서 쫓겨난 에우제니오 4세는 1434년부터 피렌체에 머물렀다. 동로마 황제 요한네스 8세는 오스만에 맞설 서방의 군사 원조를 바라고 교회 합동을 받아들였는데, 교황과 바젤 공의회가 합동 협상의 주도권을 다투다 황제가 교황 쪽을 택하자 교황을 따르는 쪽이 페라라(1438)를 거쳐 피렌체(1439년 1월)로 공의회를 옮겼고, 바젤에는 다수가 남았다. 황제와 총대주교 요세프 2세(피렌체에서 6월 죽음), 키예프 대주교 이시도르, 니케아 대주교 베사리온 등 동로마 대표 700명 안팎이 서방에 왔다. 1439년 7월 교령 『라이텐투르 카엘리』로 성령이 성부와 성자에게서 나온다는 로마 교회의 교리와 교황의 수위권을 받아들이는 합동이 선포되었고, 에페소스 대주교 마르코스 에우게니코스만 서명을 거부했다. 그러나 콘스탄티노폴리스의 시민과 사제 다수는 합동을 받아들이지 않았고 모스크바도 이시도르를 내쫓았다. 서방의 원조도 바르나 십자군(1444)의 패배로 끝나, 합동은 1452년 12월 하기아 소피아에서 다시 선포되었으나(오스만의 포위 직전) 정교회의 반발만 키웠다. 한편 바젤에 남은 이들은 1439년 에우제니오를 폐위하고 사보이아 공작 아메데오 8세를 대립 교황 펠릭스 5세로 세웠다(1449년 물러남). 피렌체에 온 동로마 학자들(게미스토스 플레톤 등)은 플라톤 연구를 이탈리아에 퍼뜨려 르네상스 인문주의에 영향을 주었다."
  subjects: [papal-states, byzantine-empire, holy-roman-empire, savoy, florence, grand-duchy-of-moscow, bohemia-kingdom]
  links:
    - { from: byzantine-empire, to: papal-states, note: "교회 합동 선포 (1439)" }
  tags: [politics, diplomacy]
  sources: ["Joseph Gill, The Council of Florence (1959)", "Anthony Black, Council and Commune: The Conciliar Movement and the Fifteenth-Century Heritage (1979)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]

- id: engelbrekt-1434
  year: 1434
  endYear: 1436
  title:
    ko: 엥엘브렉트의 봉기
  summary:
    ko: "마르그레테 1세가 이룬 칼마르 동맹(1397)의 왕 에리크 7세(포메른의 에리크)는 홀슈타인 백작들 및 한자 도시들과의 긴 전쟁(1426~1435)에 쓸 돈을 대려고 세금을 올리고 스웨덴의 철 수출을 통제했으며, 성을 외국인(덴마크·독일 출신) 지방관에게 맡겨 스웨덴 광부와 농민의 불만이 쌓였다. 1434년 베리슬라겐(달라르나 일대) 광산 소유주 엥엘브렉트 엥엘브렉트손이 광부와 농민을 이끌고 일어나 왕이 보낸 지방관을 몰아내고 여러 성을 차지했다. 스웨덴 귀족 회의(리크스로드)도 곧 가세해 왕에게 충성을 거두겠다고 선언했고, 1435년 초 아르보가에 귀족·성직자·시민·농민의 대표가 모여 엥엘브렉트를 '왕국의 총사령관'으로 삼은 것이 스웨덴 신분 의회(릭스다그)의 시초로 꼽힌다. 그러나 엥엘브렉트는 1436년 5월 개인적인 원한 때문에 귀족 몬스 벵츠손에게 살해되었고, 귀족 카를 크누트손이 뒤를 이어 저항을 이끌었다. 에리크는 양보하는 척했으나 끝내 신뢰를 되찾지 못하고 1439년 덴마크와 스웨덴에서 폐위된다(노르웨이는 1442년 무렵 후임 크리스토페르를 왕으로 맞았다. 뒤의 칼마르 동맹 사건). 엥엘브렉트는 훗날 스웨덴 민족의 영웅으로 기억된다."
  subjects: [kalmar-union-three-kingdoms, sweden-medieval]
  tags: [politics, society]
  sources: ["Franklin D. Scott, Sweden: The Nation's History (개정판, 1988)", "Knud J. V. Jespersen, A History of Denmark (2판, 2011)"]

- id: medici-1434
  year: 1434
  endYear: 1436
  title:
    ko: 코시모 데 메디치의 귀환과 피렌체의 초기 르네상스
  summary:
    ko: "피렌체 공화국은 길드 상인 가문들이 차례로 정치를 맡았다. 은행가 코시모 데 메디치(1389~1464)는 아버지 조반니(1429년 사망)가 키운 메디치 은행(로마·베네치아·나폴리·제네바 등에 지점을 두었고, 코시모 때 브뤼허·런던 등으로 넓혔다)을 이어받았고, 1433년 경쟁 가문 알비치파가 그를 가두었다가 베네치아로 추방했다. 1434년 9월 메디치에 우호적인 시뇨리아가 뽑히자 코시모는 10월 돌아왔고 알비치파가 추방되었다. 그는 공식 직책 없이 은행의 돈과 후원 관계, 선거 자격 명부의 조정으로 시정을 좌우하는 체제를 만들어 피렌체를 30년 동안 이끌었고(사후 '국부'), 공화국의 틀 안에서 메디치 가문이 사실상 지배하는 길을 열었다. 이 시기 피렌체에서는 고전 학문을 되살리려는 인문주의자들(레오나르도 브루니, 포조 브라촐리니 등)과 예술가가 후원을 받았다. 브루넬레스키가 설계한 산타 마리아 델 피오레 대성당의 돔(1420년 착공, 1436년 완성되어 교황이 봉헌)은 나무 받침 없이 이중 껍질로 올린 건축으로 '르네상스 건축의 시작'으로 꼽힌다. 마사초는 원근법으로 공간을 그렸고 알베르티는 『회화론』(1435)에서 원근법을 이론으로 정리했다. 에우제니오 4세가 로마에서 쫓겨나 피렌체에 머문 때(1434~1436)와 겹쳐 돔 봉헌이 이루어졌고, 이어 공의회(1439)가 피렌체에서 열렸다. 같은 1434년 조선에서는 세종이 구리 활자 갑인자를 만들고 물시계 자격루를 완성했으며 『삼강행실도』를 펴냈다. 두 지역은 서로 알지 못했으나 같은 해 양쪽에서 문화와 기술의 큰 성과가 나왔다."
  subjects: [florence, papal-states, venice]
  tags: [politics, culture, economy]
  sources: ["야콥 부르크하르트, 『이탈리아 르네상스의 문화』(안인희 옮김, 푸른숲, 1999)", "Dale Kent, Cosimo de' Medici and the Florentine Renaissance (2000)", "Ross King, Brunelleschi's Dome (2000)"]

- id: alfonso-naples-1435
  year: 1435
  endYear: 1443
  title:
    ko: 알폰소 5세의 나폴리 정복
  summary:
    ko: "나폴리 여왕 조반나 2세가 1435년 2월 죽자 유언의 상속자인 프로방스의 앙주 가문 르네(르네 당주)와, 조반나가 한때 양자로 삼았던 아라곤 왕 알폰소 5세가 나폴리 왕위를 다투었다. 알폰소는 1435년 8월 폰차 앞바다에서 제노바 함대(밀라노 공작 필리포 마리아 비스콘티의 지배 아래)에 져 포로가 되었으나, 비스콘티는 프랑스 세력이 나폴리에서 커지는 것을 피하려고 그를 풀어 주고 동맹을 맺었다. 르네(1438년 도착)와 알폰소의 나폴리 전쟁은 교황 에우제니오 4세가 르네 편에서 알폰소 편으로 돌아서는 등 곡절을 겪다가 1442년 6월 알폰소의 군대가 수로를 따라 도시로 들어가 나폴리를 차지했다. 1443년 2월 알폰소는 개선 입성했고 6월 에우제니오 4세가 테라치나에서 그를 나폴리 왕으로 인정했다. 알폰소는 궁정을 나폴리로 옮겨 인문주의자(로렌초 발라 등)를 후원했다. 그가 죽자(1458) 아라곤·카탈루냐·시칠리아·사르데냐는 동생 후안 2세에게, 나폴리는 서자 페란테에게 갈렸다. 아라곤 왕가의 이탈리아 개입은 훗날 프랑스와의 이탈리아 전쟁(1494~)의 씨가 되었다."
  subjects: [aragon, naples-kingdom, papal-states, genoa, milan]
