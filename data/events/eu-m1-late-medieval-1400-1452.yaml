  tags: [war, politics]
  sources: ["Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "Kenneth M. Setton, The Papacy and the Levant (1204–1571), Vol. 2: The Fifteenth Century (1978)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
