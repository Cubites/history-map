  tags: [war, politics]
  sources: ["Zigmantas Kiaupa·Jūratė Kiaupienė·Albinas Kunevičius, The History of Lithuania before 1795 (2000)", "Janet Martin, Medieval Russia 980–1584 (2판, 2007)"]
