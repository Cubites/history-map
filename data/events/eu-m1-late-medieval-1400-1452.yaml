- id: skanderbeg-1443
  year: 1443
  endYear: 1451
  title:
    ko: 스칸데르베그와 레저 동맹
  summary:
    ko: "알바니아 귀족 카스트리오티 가문의 게르기(1405년 무렵~1468)는 어려서 오스만 궁정에 인질로 보내져 이슬람으로 개종하고 이스칸데르 베이(스칸데르베그)라는 이름으로 오스만의 장군이 되었다. 1443년 11월 후녀디의 '긴 원정'이 닥치자 니시 근처에서 군대를 이탈해 가짜 칙령으로 크루여 성을 얻고 가톨릭으로 돌아갔다. 1444년 3월 레저에서 알바니아 귀족들(아리아니티·두카기니·자하리아·무자카·스판 등)이 모여 그를 지도자로 세우는 동맹(레저 동맹)을 맺었다. 그는 오스만군을 여러 번 물리쳤는데(1444년 6월 토르비올 등) 1450년 무라드 2세가 직접 이끈 크루여 포위도 막아 냈다. 알바니아 영주들은 서로 의심하고 다투는 일이 잦았고 스칸데르베그는 베네치아와도 1447~1448년 싸웠다(스쿠타리 일대의 전쟁). 1451년에는 나폴리 왕 알폰소 5세와 가에타 조약을 맺어 그의 신하로서 원조를 받기로 했다. 이 싸움은 15세기 중반 오스만의 서진을 늦춘 예로 전해지지만, 그가 죽으면(1468) 동맹은 곧 무너진다(eu-00a의 베네치아-오스만 전쟁 사건)."
  subjects: [albanian-league, albanian-principalities, ottoman, venice, naples-kingdom]
  links:
    - { from: albanian-league, to: ottoman, note: "토르비올 전투와 크루여 방어 (1444~1450)" }
    - { from: naples-kingdom, to: albanian-league, note: "가에타 조약, 알폰소 5세의 원조 (1451)" }
  tags: [war, politics]
  sources: ["Oliver Jens Schmitt, Skanderbeg: Der neue Alexander auf dem Balkan (2009)", "Colin Imber, The Crusade of Varna, 1443–45 (2006)"]
