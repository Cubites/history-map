    - { from: milan, to: venice, note: "로디 화약 (1454)" }
  tags: [war, diplomacy]
  sources: ["Michael Mallett, Mercenaries and Their Masters: Warfare in Renaissance Italy (1974)", "Michael Mallett·J. R. Hale, The Military Organisation of a Renaissance State: Venice c. 1400 to 1617 (1984)"]
