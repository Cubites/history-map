- id: herzegovina-1448
  year: 1448
  title:
    ko: 스테판 코사차와 헤르체고비나의 성립
  summary:
    ko: "보스니아 왕국은 14세기 말 트브르트코 1세 때 가장 넓어졌으나 15세기 전반 귀족 가문이 힘을 키워 왕권이 약해졌다. 스테판 부크치치 코사차(재위 1435~1466)는 보스니아 대공(큰 보이보드)이자 훔(남부 보스니아와 지금의 헤르체고비나) 땅의 영주로, 왕 스테판 토마시(재위 1443~1461) 및 라구사와 때로 다투면서 아드리아해 연안에 이르는 영지를 키웠다. 1448년 그는 '훔과 해안의 헤르체그(공작)'를 칭했고, 이듬해부터는 성 사바의 유골을 모신 밀레셰바 수도원이 자기 땅에 있다는 점을 내세워 '성 사바의 헤르체그'라는 칭호를 썼다(칭호를 바꾼 해는 자료마다 조금 다르다). 이 칭호(독일어 헤르초크에서 유래)에서 헤르체고비나라는 이름이 나왔다. 지도에서는 이 해부터 보스니아 왕국과 따로 헤르체고비나 공국을 그린다. 코사차는 형식으로는 보스니아 왕의 신하였으나 자주 독립에 가까운 영주였고, 오스만의 공물 요구와 신성 로마 황제·나폴리 왕 같은 가톨릭 군주들과의 관계를 오가며 줄타기를 했다. 그가 죽은(1466) 뒤 오스만이 땅 대부분을 차지했고(1465~1466), 아들 블라트코가 지키던 헤르체그노비가 1482년 함락되어 공국은 끝났다(eu-00a의 로도스·오트란토 사건 참조)."
  subjects: [herzegovina, bosnia-kingdom, ragusa, ottoman, venice]
  tags: [politics]
  sources: ["Noel Malcolm, Bosnia: A Short History (개정판, 1996)", "마크 마조워, 『발칸의 역사』(이순호 옮김, 을유문화사, 2014)"]

- id: formigny-1450
  year: 1449
  endYear: 1451
  title:
    ko: 포르미니 전투와 노르망디·기옌의 회복
  summary:
    ko: "트루아 조약의 랭커스터 이중 왕국이 무너진 뒤에도 잉글랜드는 노르망디를 쥐고 있었다. 샤를 7세는 1444년 투르 휴전과 1445년 잉글랜드 왕 헨리 6세와 앙주의 마르그리트의 혼인으로 시간을 번 사이 상비군(기병 중대와 자유 궁수)과 장·가스파르 뷔로 형제의 포병을 키웠다. 1449년 3월 잉글랜드 쪽 용병대장 프랑수아 드 쉬렌이 브르타뉴의 푸제르를 습격해 약탈하자 휴전이 깨졌고(브르타뉴 공작은 프랑스 왕에게 도움을 청했다), 프랑스군은 몇 달 만에 루앙(1449년 10월) 등 노르망디 도시를 되찾았다. 1450년 4월 노르망디 서부 포르미니에서 잉글랜드 구원군 4천 명 안팎이 프랑스군과 브르타뉴군에 둘러싸여 크게 졌고(잉글랜드 전사 2천5백~3천7백 명 안팎 추산), 8월 셰르부르가 항복하면서 노르망디 전체가 다시 프랑스 땅이 되었다. 1451년에는 기옌의 보르도(6월)와 바욘(8월)이 항복해 잉글랜드는 1152년 이래 약 3백 년 쥐고 있던 기옌을 잃었다. 보르도는 이듬해 잉글랜드군을 불러들였으나 1453년 카스티용 전투(eu-00a의 사건)로 끝난다. 이 전쟁의 끝무렵 대포가 성벽 공략과 야전에서 결정적인 힘이 되었다. 잉글랜드 안에서는 패전의 책임을 둘러싼 다툼이 장미 전쟁(1455~)의 원인 가운데 하나가 되었다."
  subjects: [france, england, brittany]
  links:
    - { from: france, to: england, note: "노르망디와 기옌의 회복 (1449~1451)" }
  tags: [war]
  sources: ["Christopher Allmand, The Hundred Years War: England and France at War c.1300–c.1450 (1988)", "Philippe Contamine, War in the Middle Ages (1984)"]
