- id: burgundy-netherlands-1428
  year: 1428
  endYear: 1443
  title:
    ko: 필리프 선량공의 부르고뉴와 저지대 통합
  summary:
    ko: "발루아 부르고뉴 공작 필리프 3세(선량공, 재위 1419~1467)는 아버지가 암살당한 뒤 잉글랜드와 손잡았다가 아라스 조약(1435)으로 프랑스 왕과 화해하는 사이, 상속·매입·조약으로 저지대(지금의 벨기에·네덜란드·룩셈부르크)를 차례로 모았다. 사촌 바이에른의 야코바가 다스린 에노·홀란트·제일란트는 1428년 델프트 조약에서 필리프를 섭정이자 상속자로 인정했고 1433년 야코바가 권리를 넘겨 실제로 그의 땅이 되었다. 나뮈르는 백작 요한 3세와 1421년 사들이기로 계약해 1429년 이어받았고, 브라반트 공작 필리프 드 생폴이 후사 없이 죽자 1430년 브라반트와 림뷔르흐를 상속했다. 룩셈부르크는 엘리자베트 폰 괴를리츠의 권리를 사들여(1441) 1443년 점령했다. 1430년 이사벨 드 포르투갈과 혼인하며 금양모 기사단을 세웠고, 직물과 금융의 도시 브뤼허·헨트 등을 거느려 서유럽에서 가장 화려한 궁정을 이루었다. 1425년부터 필리프의 궁정 화가였던 얀 반 에이크가 『헨트 제단화』(1432)를 완성했다(주문은 헨트의 요스 페이트 부부). 공작은 프랑스 왕(플랑드르·아르투아의 종주)과 신성 로마 황제(브라반트·홀란트 등의 종주) 양쪽의 봉신이었고, 법·세금·언어가 다른 땅을 한 나라로 묶는 일에 평생 매달렸다. 1447년 헨트가 소금세를 거부하며 시작된 갈등은 1449~1453년 헨트 전쟁으로 번져 1453년 가베레 전투로 진압되었다. 하위징아는 이 궁정 문화를 『중세의 가을』로 그렸다."
  subjects: [burgundy, holy-roman-empire, france, england]
  tags: [politics, economy]
  sources: ["Richard Vaughan, Philip the Good: The Apogee of Burgundy (1970)", "Walter Prevenier·Wim Blockmans, The Burgundian Netherlands (1986)", "요한 하위징아, 『중세의 가을』(이종인 옮김, 연암서가, 2012)"]

- id: joan-of-arc-1429
  year: 1429
  endYear: 1431
  title:
    ko: 잔 다르크와 오를레앙 해방, 랭스 대관
  summary:
    ko: "트루아 조약(1420) 뒤 잉글랜드는 1428년 10월 루아르강의 요충 오를레앙을 에워쌌다. 왕세자 샤를(샤를 7세)은 대관도 못 한 채 '부르주의 왕'이라 불리며 돈과 병력이 모자랐다. 로렌의 농촌 처녀 잔 다르크(1412년 무렵~1431)는 신의 목소리를 들었다며 1429년 3월 시농으로 왕세자를 찾아갔고 성직자들의 심문(푸아티에)을 거쳐 군대에 합류했다. 4월 말 오를레앙에 들어가 5월 초 포위를 풀게 했고, 6월 파테 전투에서 프랑스군이 잉글랜드 장궁병을 무찔렀으며(탤벗 포로), 7월 랭스 대성당에서 샤를 7세가 대관했다. 9월 파리 공격은 실패했고 1430년 5월 콩피에뉴에서 부르고뉴군의 포로가 되었다. 부르고뉴는 그를 잉글랜드에 넘겼고, 잉글랜드와 손잡은 보베 주교 피에르 코숑이 맡은 루앙 종교 재판이 이단·남장 혐의로 심문해 1431년 5월 말 루앙에서 화형에 처했다. 샤를 7세는 그를 구하려 하지 않았다. 1455~1456년 복권 재판에서 앞선 재판이 무효로 선언되었다. 잔의 승리는 군사 균형을 뒤집었다기보다 프랑스 왕의 정통성과 사기를 되살린 일이었고, 샤를 7세는 이후 아라스 조약(1435)과 상비군 개혁으로 전쟁을 끝내는 길로 나아갔다."
  subjects: [france, england, burgundy]
  links:
    - { from: burgundy, to: england, note: "잔 다르크를 잉글랜드에 넘김 (1430)" }
  tags: [war, politics]
  sources: ["Régine Pernoud·Marie-Véronique Clin, Joan of Arc: Her Story (1998)", "Christopher Allmand, The Hundred Years War: England and France at War c.1300–c.1450 (1988)"]
