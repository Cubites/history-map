- id: venice-terraferma-1404
  year: 1404
  endYear: 1420
  title:
    ko: 베네치아의 테라페르마와 달마티아 확장
  summary:
    ko: "잔갈레아초 비스콘티가 1402년 죽자 그가 모았던 북이탈리아의 밀라노 세력이 흩어졌고, 베네치아는 이 틈에 해상 공화국에서 본토(테라페르마)를 가진 나라로 넓어졌다. 1404년 비첸차가 베네치아에 몸을 맡겼고(같은 해 벨루노·페르트레도), 1405년 6월 베로나에 이어 파도바의 영주 카라라 가문(프란체스코 노벨로)과 싸워 11월 파도바를 에워싸 항복시켰다. 카라라는 1406년 베네치아에 붙잡혀 두 아들과 함께 교살되었다. 한편 달마티아에서는 헝가리와 나폴리의 왕위 다툼 끝에 1409년 나폴리 왕 라디슬라오가 자다르·노비그라드·브라나·파그 등의 권리를 베네치아에 팔았고(10만 두카트로 전한다), 헝가리 왕 지기스문트와의 전쟁(1411~1413)이 휴전으로 끝났다. 지기스문트가 후스 문제와 공의회로 바빠진 틈에 베네치아는 1418~1420년 프리울리를 다스리던 아퀼레이아 총대주교령을 쳐서 우디네 등을 차지하고(1420), 달마티아 해안과 섬(트로기르·스플리트·시베니크 등)도 실효 지배에 넣었다. 이 확장으로 베네치아는 베로나·비첸차까지 얻어 밀라노령 롬바르디아(브레시아·베르가모 쪽)와 맞닿게 되었고, 그 긴장이 1423년부터의 롬바르디아 전쟁(뒤의 사건)으로 이어진다. 지도에서는 비첸차·벨루노(1404)를 1405년 버전에 묶었고 1420년에 프리울리와 달마티아가 더해진다."
