- id: kosovo-1448
  year: 1448
  title:
    ko: 제2차 코소보 전투
  summary:
    ko: "바르나에서 진 뒤에도 후녀디는 1446년 헝가리의 섭정이 되어 다시 원정을 준비했다. 1448년 가을 그는 헝가리·왈라키아 등의 군대(2만~3만 명 안팎으로 추산)를 거느리고 다뉴브강을 건너 세르비아를 가로질러 알바니아의 스칸데르베그와 합류하려 했다. 세르비아 전제공 주라지 브란코비치는 오스만의 신하라는 이유로 후녀디를 말렸고 스칸데르베그의 길도 막았다. 10월 코소보 폴례에서 술탄 무라드 2세의 군대(헝가리 쪽의 두 배 안팎이라는 추산)와 맞붙은 후녀디는 사흘 동안 버텼으나 왈라키아 부대가 오스만 쪽으로 넘어갔다는 전승과 함께 보병과 수레 방진이 무너져 크게 졌다. 후녀디는 달아나다 주라지에게 붙잡혀 스메데레보에 갇혔다가 몸값과 보상을 약속한 뒤 이듬해 초 풀려났다. 스칸데르베그는 늦게 도착해 세르비아 땅을 약탈하며 돌아갔다. 이 전투는 발칸 중부의 오스만 지배를 굳히고 콘스탄티노폴리스를 도울 외부 세력이 더는 없음을 보여 주었다. 헝가리와 오스만은 1451년 3년간 휴전했다."
  subjects: [hungary-kingdom, ottoman, serbian-despotate, wallachia, albanian-league]
  links:
    - { from: ottoman, to: hungary-kingdom, note: "코소보 폴례 전투 (1448)" }
  tags: [war]
  sources: ["Colin Imber, The Crusade of Varna, 1443–45 (2006)", "Miklós Molnár, A Concise History of Hungary (2001)", "John V. A. Fine Jr., The Late Medieval Balkans (1987)"]
