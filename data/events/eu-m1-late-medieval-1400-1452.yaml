- id: morea-despotate-1427
  year: 1427
  endYear: 1449
  title:
    ko: 모레아 전제공국의 확장과 헥사밀리온
  summary:
    ko: "펠로폰네소스에서는 동로마 황족이 다스린 모레아 전제공국(수도 미스트라스, 지도에서는 1452년까지 동로마 땅으로 칠함)이 프랑크 십자군의 후손이 세운 아카이아 공국의 남은 땅을 차례로 차지했다. 전제공 테오도로스 2세의 동생 콘스탄티노스(뒤의 콘스탄티노스 11세)는 1427년 에키나데스 해전에서 에피루스와 케팔로니아 영주 카를로 1세 토코를 이긴 뒤 1428년 토코 집안의 마달레나(테오도라)와 혼인해 토코가 펠로폰네소스에 가졌던 땅을 지참금으로 받았고, 1429년 디메 근처에서 아카이아 공 첸투리오네 2세 차카리아를 무찔렀다. 콘스탄티노스는 1429년 파트라스 도시를, 1430년 그 성채를 차지했고 막내 토마스는 차카리아의 딸 카타리나와 혼인했으며, 1432년 첸투리오네가 죽어 아카이아 공국은 끝났다. 1443년 콘스탄티노스는 코린토스 지협을 가로지르는 성벽 헥사밀리온을 다시 쌓았고 1444년에는 중부 그리스로 올라가 아테네 공국의 아치아이우올리 가문에게서 조공을 받았다. 그러나 바르나 십자군이 지자(1444) 1446년 12월 무라드 2세가 대포로 헥사밀리온을 무너뜨리고 모레아를 약탈했다. 수만 명이 노예로 끌려갔다고 전하지만 수치는 자료마다 크게 달라 과장되었을 수 있다. 모레아는 이후 오스만에 공물을 바치는 처지가 되었다. 한편 에피루스의 토코 가문은 1430년 요아니나에 이어 1449년 아르타를 오스만에 잃어 섬(케팔로니아·레프카다)만 남았다. 1448년 10월 요한네스 8세가 죽자 콘스탄티노스가 1449년 1월 미스트라스에서 황제로 즉위했고 모레아는 동생 토마스와 데메트리오스가 나눠 다스렸다. 두 사람은 1460년 메흐메트 2세에게 정복당한다(eu-00a의 메흐메트 2세 정복 사건)."
  subjects: [morea-despotate, byzantine-empire, achaea, duchy-of-athens, epirus-despotate, ottoman, venice]
