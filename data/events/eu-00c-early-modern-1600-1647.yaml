- id: portuguese-restoration-1640
  year: 1640
  title:
    ko: 카탈루냐 반란과 포르투갈의 독립 회복
  summary:
    ko: "에스파냐의 재상 올리바레스가 30년 전쟁과 프랑스와의 전쟁 비용을 여러 왕국에 고루 지우려 하자, 1640년 6월 카탈루냐에서 농민 반란(수확자의 전쟁)이 일어나 바르셀로나에서 총독이 살해되었고 카탈루냐는 이듬해 1월 프랑스 왕을 바르셀로나 백작으로 받들었다. 12월 1일에는 포르투갈 귀족들이 리스본에서 에스파냐의 총독 정부를 몰아내고 브라간사 공작을 주앙 4세로 왕위에 올려 60년 동안의 이베리아 연합(1580~1640)을 끝냈다. 포르투갈은 프랑스·잉글랜드의 도움을 받으며 긴 독립 전쟁(1640~1668)을 치른 끝에 1668년 리스본 조약으로 에스파냐의 인정을 받았다. 카탈루냐는 1652년 에스파냐에 다시 굴복했으나 루시용은 피레네 조약(1659)으로 프랑스에 넘어갔다. 이 반란들로 에스파냐의 국력은 크게 기울었다."
  subjects: [portugal, spain, france]
  links:
