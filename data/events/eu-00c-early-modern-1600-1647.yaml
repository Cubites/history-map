# ── 30년 전쟁 (1618 ~ 1645) ──────────────────────

- id: bohemian-revolt-1618
  year: 1618
  endYear: 1620
  title:
    ko: 보헤미아 반란과 빌라호라 전투, 30년 전쟁의 시작
  summary:
    ko: "합스부르크 군주국의 군주로 보헤미아 왕을 겸한 황제 마티아스가 루돌프 2세의 칙서(1609)로 보장된 신교도의 권리를 줄이고 열렬한 가톨릭교도 페르디난트(뒤의 황제 페르디난트 2세)를 왕위 계승자로 세우자, 1618년 5월 프라하의 신교 귀족들이 왕의 대리인 두 명과 서기를 왕궁 창밖으로 던졌다(프라하 창밖 투척). 반란을 일으킨 보헤미아 신분회는 1619년 페르디난트를 폐위하고 칼뱅파인 팔츠 선제후 프리드리히 5세를 왕으로 뽑았으며, 트란실바니아 공 베틀렌 가보르도 반란 편에서 헝가리로 쳐들어갔다. 그러나 1620년 11월 프라하 근처 빌라호라(백산) 전투에서 황제군과 바이에른이 이끈 가톨릭 연맹군이 반란군을 무찔러, 프리드리히는 한 겨울만 다스린 '겨울왕'이 되어 달아났다. 1621년 6월 프라하 구시가 광장에서 반란 지도자 27명이 처형되고 반란에 가담한 귀족의 땅이 몰수되었다. 이어 1627년 개정 영방 조례로 가톨릭만 허용되자 개종하지 않은 귀족과 시민 수만 명이 나라를 떠났다. 이 반란에서 신성 로마 제국 전체를 휩쓴 30년 전쟁(1618~1648)이 시작되었고, 싸움은 팔츠로 번져 에스파냐군과 가톨릭 연맹군이 팔츠를 차지했다(1620~1622)."
  subjects: [habsburg-monarchy, holy-roman-empire, transylvania, spain]
