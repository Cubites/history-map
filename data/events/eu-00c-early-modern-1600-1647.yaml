- id: english-civil-war-1642
  year: 1642
  endYear: 1649
  title:
    ko: 영국 내전(청교도 혁명)과 찰스 1세의 처형
  summary:
    ko: "잉글랜드의 찰스 1세는 왕권신수설을 내세워 의회의 동의 없이 세금을 거두고 반대자를 가두었다. 1628년 의회가 이를 금하는 권리 청원을 내자 승인했으나 이듬해 의회를 해산하고 11년 동안 의회 없이 다스렸다. 국교회식 기도서를 스코틀랜드에 강요하다 장로파의 반란(주교 전쟁, 1639~1640)을 부르자 전비를 얻으려 1640년 두 차례 의회를 열었는데, 11월에 열린 장기 의회는 왕의 측근 스트래퍼드를 처형하고(1641) 왕의 권한을 제한했다. 1641년 10월 아일랜드에서 가톨릭교도가 봉기해 얼스터의 개신교 정착민 약 4천 명(최대 1만 2천 명으로 보는 추산도 있음)을 죽였고, 정착민과 정부군도 보복으로 가톨릭 주민을 학살했다. 진압군의 지휘권을 두고 왕과 의회의 대립이 커져, 1642년 여름 왕이 노팅엄에서 군대를 일으키면서(율리우스력 8월 22일, 양력 9월 1일) 내전이 시작되었다(청교도 혁명). 젠트리와 런던 상인, 청교도가 많은 의회파는 1642년 가을 에지힐 전투에서 승부를 내지 못했으나, 스코틀랜드와 손잡고 1644년 마스턴무어에서, 1645년 6월 페어팩스가 총사령관을 맡고 크롬웰이 기병을 이끈 신형군으로 네이즈비에서 왕당파를 무찔렀다. 왕당파군은 1644년 볼턴을 함락하며 수비대와 주민을 학살했고(사망자는 교구 기록 78명에서 당대 주장 1,600명까지), 의회파 병사들은 네이즈비 전투 뒤 왕당파 진영을 따르던 여성 100여 명을 죽였다. 스코틀랜드군에 몸을 맡긴 찰스는 의회에 넘겨졌다가 달아나 2차 내전(1648)을 일으켰으나 다시 졌다. 군대는 1648년 12월 왕과 타협하려던 장로파 의원을 의회에서 몰아냈고(프라이드의 숙청), 남은 의원들(잔부 의회)이 세운 특별 법정은 찰스 1세를 반역자로 판결해 1649년 1월 30일(율리우스력, 양력 2월 9일) 처형했다(그 뒤는 '크롬웰의 공화정과 아일랜드·스코틀랜드 정복' 참고). 1642~1651년 내전과 그에 따른 질병으로 잉글랜드에서만 약 19만~23만 명이 죽은 것으로 추산된다(칼턴, 1992·2011)."
  subjects: [england, scotland, ireland-kingdom]
