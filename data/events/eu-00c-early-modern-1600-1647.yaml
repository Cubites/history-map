- id: weltevree-1627
  year: 1627
  title:
    ko: 벨테브레이(박연)의 조선 표류
  summary:
    ko: "네덜란드 동인도 회사의 배를 타고 동아시아에 온 네덜란드 공화국 출신 선원 얀 얀스 벨테브레이는 1627년 동료 두 명과 함께 제주도에 닿아, 물을 구하러 뭍에 올랐다가 조선 관헌에게 붙잡혔다. 서울로 옮겨진 그들은 훈련도감에 소속되어 서양식 대포를 만들고 다루는 일을 도왔고, 벨테브레이는 '박연'이라는 이름으로 조선 여인과 혼인해 살았다. 함께 온 두 동료는 병자호란(1636~1637) 때 싸우다 죽었다. 1653년 네덜란드인 하멜 일행이 제주도에 표류하자 박연이 통역을 맡았고(한국사 '하멜 표류' 참고), 하멜이 남긴 기록으로 그의 행적이 유럽에 알려졌다."
  subjects: [dutch-republic, joseon]
  tags: [diplomacy, society]
  sources: ["헨드릭 하멜, 『하멜 표류기』(김태진 옮김, 서해문집, 2003)", "한국학중앙연구원 『한국민족문화대백과사전』 '박연'"]

- id: thirty-years-war-swedish-1630
  year: 1630
  endYear: 1635
  title:
    ko: 30년 전쟁의 스웨덴 단계와 마그데부르크 약탈, 프라하 평화
  summary:
    ko: "폴란드-리투아니아 연방과 맺은 알트마르크 휴전(1629)으로 리보니아를 확보하고 프로이센 항구의 관세를 얻은 스웨덴 왕 구스타브 2세 아돌프는 1630년 7월 북독일 포메른에 상륙했고, 이듬해 프랑스와 조약을 맺어 전쟁 자금을 받았다. 신교 제후들이 머뭇거리는 사이 1631년 5월 틸리와 파펜하임의 황제·가톨릭 연맹군이 신교 도시 마그데부르크를 함락하고 약탈했는데, 화재와 학살로 약 2만 5천 명이던 주민 가운데 2만 명 안팎이 죽은 것으로 추산된다(마그데부르크 약탈). 이를 계기로 브란덴부르크·작센이 스웨덴 편에 섰고, 구스타브 2세는 9월 브라이텐펠트에서 틸리를 크게 무찌르고 남독일까지 나아갔다. 스웨덴군도 바이에른 등 점령지에서 약탈하고 주민을 고문해 재물을 빼앗았다. 다시 불려 나온 발렌슈타인과 맞선 1632년 11월 뤼첸 전투에서 스웨덴군은 이겼으나 구스타브 2세가 전사했다. 발렌슈타인은 황제 몰래 협상한다는 의심을 받아 1634년 암살되었고, 같은 해 9월 뇌르틀링겐에서 황제군과 에스파냐군이 스웨덴군을 크게 무찔렀다. 1635년 5월 황제는 프라하 평화 조약으로 복원 칙령을 사실상 거두어들이고 작센 등 루터파 제후와 화해했으며, 합스부르크 군주국은 라우지츠를 작센에 넘겼다."
  subjects: [sweden-kingdom, holy-roman-empire, habsburg-monarchy, brandenburg-prussia, spain, france, polish-lithuanian-commonwealth]
  links:
