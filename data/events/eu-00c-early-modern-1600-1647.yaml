- id: ottoman-safavid-war-1603
  year: 1603
  endYear: 1618
  title:
    ko: 오스만-사파비 전쟁과 나수흐 파샤 조약, 동조지아
  summary:
    ko: "1590년 콘스탄티노폴리스 조약으로 오스만 제국에 북서 이란과 캅카스를 내준 사파비 왕조의 샤 아바스 1세는 오스만이 중부 유럽의 긴 전쟁과 아나톨리아의 반란(젤랄리 반란)으로 흔들리던 1603년 다시 싸움을 일으켜 타브리즈 등을 되찾았다. 앞 사정은 「아마시아 조약에서 1590년 강화까지: 오스만과 사파비의 캅카스 다툼」·「긴 전쟁의 시작과 에게르 함락, 메조케레스테시 전투」(앞의 사건)에 나온다. 술탄 아흐메트 1세 때 대재상 나수흐 파샤가 1612년 11월 조약을 맺어 오스만은 1555년 아마시아 평화 조약의 경계로 물러나고 캅카스에 대한 사파비의 종주권을 인정했으며, 사파비는 해마다 비단 200점(약 59톤)을 바치기로 했다. 그러나 아바스가 공납을 거부해 1615년 싸움이 다시 일어났고, 1618년 9월 세라브(사라브) 조약으로 경계는 거의 그대로 두고 해마다 바칠 비단을 100점으로 줄였다. 이 사이 동조지아의 카르틀리 왕국과 카헤티 왕국은 오스만의 영향에서 벗어나 사파비의 종주를 받았다. 아바스는 두 왕국이 뜻대로 움직이지 않자 1614~1617년 여러 차례 쳐들어가 카헤티에서 많은 사람을 죽이거나 이란 안쪽으로 끌고 갔다(추산은 카헤티에서만 죽은 사람 6만~7만 명, 이란으로 끌려간 사람 10만 명 남짓에서 조지아 전체의 피해를 더 크게 잡는 것까지 크게 갈림). 지도는 오스만의 아르메니아·아제르바이잔 땅을 1612년에 페르시아에 돌려 비우고(페르시아는 지도에 없는 나라), 1590년부터 왕국으로 둔 채 오스만의 종속국으로 표시하던 카르틀리와 카헤티를 1612년부터 그 표시 없이 그린다."
  subjects: [ottoman, kartli, kakheti]
  tags: [war, diplomacy]
  sources: ["「나수흐 파샤 조약」(1612)", "Roger Savory, Iran under the Safavids (1980)", "Ronald Grigor Suny, The Making of the Georgian Nation (2nd ed., 1994)"]

- id: time-of-troubles-1604
  year: 1604
  endYear: 1612
  title:
    ko: 러시아의 동란 시대와 폴란드의 모스크바 점령
  summary:
    ko: "1598년 이반 4세의 아들 표도르 1세가 후사 없이 죽어 류리크 왕조가 끊기자 처남 보리스 고두노프가 차르가 되었으나, 1601~1603년 대기근으로 수많은 사람이 굶어 죽고 민심이 흔들렸다. 1604년 어려서 죽은 이반 4세의 아들 드미트리를 자칭한 사람(가짜 드미트리 1세)이 폴란드 귀족의 지원을 받아 쳐들어와 1605년 차르가 되었으나 이듬해 살해되었다. 이어 대귀족 바실리 슈이스키가 차르가 되었지만 농민·코사크의 볼로트니코프 봉기와 또 다른 가짜 드미트리가 일어나 나라가 갈라졌다(동란 시대, 1598~1613). 슈이스키가 스웨덴의 도움을 받자 폴란드-리투아니아 연방의 지그문트 3세가 쳐들어와 1609년 스몰렌스크를 에워싸고 1610년 클루시노 전투에서 이겼다. 모스크바의 대귀족들은 슈이스키를 몰아내고 지그문트의 아들 브와디스와프를 차르로 받아들이기로 했고, 폴란드군이 크렘린에 들어왔다. 스몰렌스크는 1611년 함락되었고, 스웨덴군은 같은 해 노브고로드를 차지했다. 1611~1612년 니즈니노브고로드의 상인 미닌과 공작 포자르스키가 이끈 국민군이 일어나 1612년 가을 크렘린의 폴란드 수비대를 굶겨 항복시켰다. 이 시기 여러 군대와 무리가 약탈을 일삼아 많은 주민이 죽거나 흩어졌다."
