- id: time-of-troubles-1604
  year: 1604
  endYear: 1612
  title:
    ko: 러시아의 동란 시대와 폴란드의 모스크바 점령
  summary:
    ko: "1598년 이반 4세의 아들 표도르 1세가 후사 없이 죽어 류리크 왕조가 끊기자 처남 보리스 고두노프가 차르가 되었으나, 1601~1603년 대기근으로 수많은 사람이 굶어 죽고 민심이 흔들렸다. 1604년 어려서 죽은 이반 4세의 아들 드미트리를 자칭한 사람(가짜 드미트리 1세)이 폴란드 귀족의 지원을 받아 쳐들어와 1605년 차르가 되었으나 이듬해 살해되었다. 이어 대귀족 바실리 슈이스키가 차르가 되었지만 농민·코사크의 볼로트니코프 봉기와 또 다른 가짜 드미트리가 일어나 나라가 갈라졌다(동란 시대, 1598~1613). 슈이스키가 스웨덴의 도움을 받자 폴란드-리투아니아 연방의 지그문트 3세가 쳐들어와 1609년 스몰렌스크를 에워싸고 1610년 클루시노 전투에서 이겼다. 모스크바의 대귀족들은 슈이스키를 몰아내고 지그문트의 아들 브와디스와프를 차르로 받아들이기로 했고, 폴란드군이 크렘린에 들어왔다. 스몰렌스크는 1611년 함락되었고, 스웨덴군은 같은 해 노브고로드를 차지했다. 1611~1612년 니즈니노브고로드의 상인 미닌과 공작 포자르스키가 이끈 국민군이 일어나 1612년 가을 크렘린의 폴란드 수비대를 굶겨 항복시켰다. 이 시기 여러 군대와 무리가 약탈을 일삼아 많은 주민이 죽거나 흩어졌다."
