- id: torstensson-war-1643
  year: 1643
  endYear: 1645
  title:
    ko: 토르스텐손 전쟁과 브룀세브로 조약
  summary:
    ko: "30년 전쟁에서 독일 북부에 자리 잡은 스웨덴은 외레순 해협의 통행세를 거두며 발트해 무역을 쥔 덴마크-노르웨이를 경계했다. 1643년 12월 스웨덴의 토르스텐손 장군은 선전 포고 없이 독일에서 유틀란트반도로 쳐들어갔고(토르스텐손 전쟁), 이듬해 다른 스웨덴군은 덴마크령 스코네를 공격했다. 크리스티안 4세는 1644년 7월 콜베르거 하이데 해전에서 직접 싸우며 버텼으나, 네덜란드 공화국에서 빌린 배를 더한 스웨덴 함대가 10월 페마른 해전에서 덴마크 함대를 무찔렀다. 1645년 8월 브룀세브로 조약으로 덴마크-노르웨이는 고틀란드·외셀섬과 노르웨이의 옘틀란드·헤리에달렌을 넘기고 할란드를 30년 동안 스웨덴에 맡겼으며, 스웨덴 배는 해협 통행세를 면제받았다. 이로써 발트해의 주도권은 스웨덴으로 넘어갔다."
  subjects: [sweden-kingdom, denmark-norway, dutch-republic]
