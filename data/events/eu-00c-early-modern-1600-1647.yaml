- id: transylvania-seven-counties-1621
  year: 1621
  endYear: 1648
  title:
    ko: 트란실바니아의 베틀렌 가보르와 라코치 죄르지 1세, 헝가리 북동부 일곱 주
  summary:
    ko: "오스만 제국의 종주권 아래 있던 트란실바니아 공국은 합스부르크 군주국의 군주(황제)와 오스만 사이에서 헝가리 개신교의 방패가 되었다. 칼뱅파 제후 베틀렌 가보르(재위 1613~1629)는 보헤미아 반란(「보헤미아 반란과 빌라호라 전투, 30년 전쟁의 시작」(앞의 사건))에 호응해 1619년 헝가리로 쳐들어갔고 1620년 8월 헝가리 의회에서 왕으로 뽑혔으나 왕관은 쓰지 않았다. 1621년 12월 31일 니콜스부르크 조약으로 그는 왕 칭호를 버리는 대신 헝가리 개신교의 신앙 자유를 확인받고, 헝가리 북동부 일곱 주(어버우이·베레그·보르쇼드·서볼치·서트마르·우고처·젬플렌)를 사는 동안 다스릴 권리와 슐레지엔의 공작령을 얻었다(지도는 1622년부터 일곱 주를 트란실바니아 땅으로 그림). 1629년 11월 베틀렌이 죽자 일곱 주는 합스부르크로 돌아갔다. 그의 아내 카타리나와 동생 이슈트반을 거쳐 1630년 제후가 된 라코치 죄르지 1세(재위 1630~1648)는 1644~1645년 스웨덴·프랑스와 손잡고 합스부르크를 공격했고, 술탄의 중지 명령을 따르지 않았다. 1645년 12월 16일 린츠 조약으로 같은 일곱 주를 얻었으나 1648년 10월 그가 죽자 다섯 주가 합스부르크로 돌아갔다(서볼치·서트마르는 린츠 조약이 아들 죄르지 2세도 이을 수 있게 정해 그가 죽는 1660년까지 트란실바니아 쪽에 남았다가 합스부르크로 넘어간 것으로 지도는 그린다)."
  subjects: [transylvania, habsburg-monarchy, ottoman, sweden-kingdom, france]
  links:
    - { from: transylvania, to: habsburg-monarchy, note: "일곱 주 평생 보유 (니콜스부르크 1621, 린츠 1645)" }
    - { from: sweden-kingdom, to: transylvania, note: "라코치와 연합 (1644~1645)" }
