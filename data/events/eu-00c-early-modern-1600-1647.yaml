- id: thirty-years-war-danish-1625
  year: 1625
  endYear: 1629
  title:
    ko: 30년 전쟁의 덴마크 단계와 복원 칙령
  summary:
    ko: "신교 쪽이 밀리자 홀슈타인 공작으로 제국 제후이기도 한 덴마크-노르웨이의 왕 크리스티안 4세가 잉글랜드·네덜란드 공화국의 지원 약속을 받고 북독일에 군대를 보냈다(1625). 황제 페르디난트 2세는 보헤미아 귀족 발렌슈타인에게 스스로 모은 대군을 맡겼는데, 그의 군대는 점령지에서 군세를 거두어 군대를 먹이는 방식으로 주민에게 큰 부담을 지웠다. 1626년 루터 전투에서 가톨릭 연맹군의 틸리가 덴마크군을 무찔렀고, 황제군은 유틀란트반도까지 휩쓸었다. 1629년 3월 황제는 복원 칙령으로 1552년 뒤 신교도가 차지한 교회 땅을 되돌리라고 명했고, 같은 해 뤼베크 조약으로 크리스티안 4세는 땅을 잃지 않는 대신 제국 일에 다시 끼어들지 않기로 했다. 황제의 권력이 지나치게 커지자 가톨릭 제후들도 반발해 1630년 발렌슈타인은 물러났다."
  subjects: [denmark-norway, holy-roman-empire, habsburg-monarchy, england, dutch-republic]
