  tags: [war, diplomacy]
  sources: ["「알트마르크 휴전 조약」(1629)", "「프라하 평화 조약」(1635)", "Peter H. Wilson, Europe's Tragedy: A History of the Thirty Years War (2009)", "C. V. 웨지우드, 『30년 전쟁 1618~1648』(남경태 옮김, 휴머니스트, 2011)"]
