- id: galileo-1633
  year: 1633
  title:
    ko: 갈릴레이의 종교 재판과 과학 혁명
  summary:
    ko: "17세기 초 과학 혁명이 크게 나아갔다. 독일의 케플러는 행성이 해를 한 초점으로 하는 타원 궤도를 돈다는 법칙 등을 밝혔고(1609·1619), 피사 출신으로 토스카나 대공국의 궁정 수학자가 된 갈릴레이는 1609~1610년 스스로 만든 망원경으로 달의 산과 목성의 위성, 금성의 위상 변화를 관측해 지동설을 뒷받침했다. 교황청은 1616년 코페르니쿠스의 책을 고칠 때까지 읽지 못하게 하고 갈릴레이에게 지동설을 옹호하지 말라고 경고했다. 갈릴레이가 1632년 피렌체에서 『두 우주 체계에 관한 대화』를 펴내자, 로마의 종교 재판소는 1633년 그를 재판해 지동설을 철회하게 하고 평생 가택 연금에 처했다(1992년 교황 요한 바오로 2세가 재판의 잘못을 인정). 잉글랜드의 베이컨은 관찰과 실험에서 법칙을 끌어내는 귀납법을(『신기관』, 1620), 프랑스의 데카르트는 수학처럼 확실한 원리에서 추론해 가는 연역법을(『방법서설』, 1637) 내세웠다. 같은 무렵 1630년 명에 진주사로 간 조선의 정두원은 이듬해(1631) 등주에서 예수회 선교사 로드리게스(육약한)에게 천리경(망원경)·자명종·서양 화포와 천문서 등을 받아 돌아와 인조에게 바쳤다."
  subjects: [papal-states, tuscany, ming, joseon]
  links:
    - { from: ming, to: joseon, note: "정두원의 천리경 전래 (1631)" }
  tags: [culture]
  sources: ["갈릴레오 갈릴레이, 『대화: 천동설과 지동설, 두 체계에 관하여』(이무현 옮김, 사이언스북스, 2016)", "스티븐 샤핀, 『과학혁명』(한영덕 옮김, 영림카디널, 2003)", "『인조실록』 인조 9년"]

- id: thirty-years-war-french-1635
  year: 1635
  endYear: 1643
  title:
    ko: 리슐리외와 30년 전쟁의 프랑스 단계, 로크루아 전투
  summary:
    ko: "프랑스의 재상 리슐리외 추기경(재임 1624~1642)은 안으로는 왕권을 강화해 1628년 위그노의 거점 라로셸을 1년 넘는 포위로 굶겨 항복시키고(주민 2만 7천여 명 가운데 약 5천 명만 살아남은 것으로 추산) 알레 칙령(1629)으로 위그노의 정치·군사 특권을 없앴다. 밖으로는 가톨릭 국가이면서도 합스부르크 가문을 누르려고 스웨덴과 독일 신교 제후를 도왔다. 프라하 평화로 전쟁이 끝날 듯하자 프랑스는 1635년 5월 에스파냐에 선전 포고하고 직접 30년 전쟁에 뛰어들었다. 1636년 에스파냐군이 코르비를 차지해 파리가 위협받기도 했으나, 프랑스가 돈을 대던 작센바이마르 공 베른하르트의 군대는 1638년 라인강의 요새 브라이자흐를 차지했다. 1640년 에스파냐에서 카탈루냐와 포르투갈이 반란을 일으켜 에스파냐의 힘이 흩어졌다. 1642년 리슐리외에 이어 이듬해 5월 루이 13세도 죽어 네 살의 루이 14세가 즉위하고 마자랭이 정치를 맡았는데, 며칠 뒤 앙갱 공작(뒤의 콩데 공)이 이끈 프랑스군이 로크루아 전투에서 에스파냐의 정예 보병을 무찔렀다. 이 무렵 신성 로마 제국의 땅은 오랜 전쟁과 양쪽 군대의 약탈, 굶주림, 전염병으로 크게 황폐해졌다(인구 감소는 '베스트팔렌 조약과 30년 전쟁의 끝' 참고)."
  subjects: [france, spain, sweden-kingdom, holy-roman-empire, habsburg-monarchy]
  links:
