- id: brandenburg-prussia-1618
  year: 1609
  endYear: 1618
  title:
    ko: 브란덴부르크의 클레베 상속과 프로이센 공국 계승
  summary:
    ko: "신성 로마 제국의 선제후국 브란덴부르크를 다스린 호엔촐레른 가문은 혼인과 상속으로 땅을 넓혔다. 1609년 라인강 쪽 윌리히-클레베 공작 가문이 끊기자 브란덴부르크와 팔츠-노이부르크가 상속을 다투었는데, 1614년 크산텐 조약으로 브란덴부르크는 클레베·마르크·라벤스베르크를 얻었다. 1618년 8월에는 프로이센 공국의 공작 알브레히트 프리드리히가 아들 없이 죽어 사위인 브란덴부르크 선제후 요한 지기스문트가 폴란드 왕의 승인을 받아 공작 자리를 이었다. 이로써 라인강에서 네만강까지 흩어진 땅을 한 군주가 다스리는 브란덴부르크-프로이센이 생겼다. 프로이센 공국은 여전히 폴란드-리투아니아 연방 왕의 봉토였으나 1657년 벨라우 조약으로 벗어났고, 1701년 프로이센 왕국이 되었다. 요한 지기스문트는 1613년 칼뱅파로 바꾸었으나 루터파 신민에게 개종을 강요하지 않았다."
  subjects: [holy-roman-empire, brandenburg-prussia, ducal-prussia, polish-lithuanian-commonwealth]
