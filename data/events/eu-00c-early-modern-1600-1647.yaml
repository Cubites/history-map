# 작업 H1b(2026-10-11): 지도에서 항목이 생기거나 끝나는 해, 1만 km² 넘게 바뀐 버전 해 ±2년 안에 사건이 없던 곳을 이으려고 시베리아 진출 2개, 아일랜드 9년 전쟁, 오스만-사파비 전쟁과 동조지아, 트란실바니아 일곱 주, 칼미크와 노가이 사건을 더했다.

# ── 17세기 초: 아시아로 간 유럽과 러시아의 동란 (1601 ~ 1618) ──────

- id: siberia-mangazeya-1600
  year: 1600
  endYear: 1619
  title:
    ko: 만가제야에서 예니세이스크까지, 러시아의 시베리아 중부 진출
  summary:
    ko: "1598년 시비르 칸국의 쿠춤 칸이 진 일은 「서시베리아의 요새와 시비르 칸국의 끝」(앞의 사건)에 나온다. 그 뒤 러시아 차르국은 담비 등 모피를 거두는 요새와 월동지를 강줄기를 따라 동쪽으로 세워 나갔다. 1601년 타즈강 가에 만가제야가 서서 사모예드계 주민(네네츠 등)에게서 모피세(야삭)를 거두고 모피를 모으는 거점이 되었고, 17세기 첫 사반세기에 전성기를 맞았고 상주 주민은 1607년 무렵 약 750명, 장이 서는 철에는 1~2천 명이 모였다. 1604년에는 톰스크 타타르 수장이 이웃 세력에 맞설 보호를 청한 일을 계기로 톰강(오비강의 지류) 가에 톰스크가 섰고, 1607년 예니세이강 하류에 투루한스크 월동지가 생겼다. 1618년 쿠즈네츠크, 1619년 예니세이스크가 서면서 러시아의 세력은 오비강 유역에서 예니세이강 유역으로 넘어갔다. 정부는 1619~1620년 바닷길로 만가제야에 오가는 것을 막았다(처음에는 외국 상인, 이어 러시아 상인에게도). 요새를 세운 쪽은 주민 우두머리를 인질(아마나트)로 잡아 모피세를 받아 냈고, 이는 뒤에 더 큰 저항과 피해를 불렀다(「크라스노야르스크에서 아나디리까지, 러시아의 시베리아 동쪽 진출」(뒤의 사건)). 지도는 러시아 차르국의 땅을 1600년에 오비강 하류와 타즈강 쪽으로, 1604·1607·1618·1619년에 오비강 중류와 예니세이강 쪽으로 넓혀 그리는데, 요새를 세운 해를 기준으로 한 대략적인 추정이다."
  subjects: [russia-tsardom]
  tags: [politics, economy]
  sources: ["W. Bruce Lincoln, The Conquest of a Continent: Siberia and the Russians (1994)", "Yuri Slezkine, Arctic Mirrors: Russia and the Small Peoples of the North (1994)", "니콜라스 V. 랴자놉스키·마크 D. 스타인버그, 『러시아의 역사』 상(조호연 옮김, 까치, 2011)"]

- id: matteo-ricci-1601
  year: 1601
  endYear: 1610
  title:
    ko: 마테오 리치의 베이징 선교와 『천주실의』
  summary:
    ko: "교황령의 마체라타에서 태어난 예수회 선교사 마테오 리치는 포르투갈 왕의 후원을 받는 예수회 선교망을 따라 고아를 거쳐 1582년 포르투갈의 거점 마카오에 왔다. 그는 중국어와 유교 경전을 익히고 유학자의 옷을 입어 사대부와 사귀며 선교하는 '적응' 방식을 썼고, 1601년 명의 만력제에게 자명종 등을 바쳐 베이징에 머물 수 있게 되었다. 1602년 이지조와 함께 세계 지도 「곤여만국전도」를 만들고, 1603년 천주교 교리를 유교의 말로 풀이한 『천주실의』를 펴냈으며, 서광계와 함께 유클리드 기하학을 『기하원본』으로 옮겼다(1607). 그는 1610년 베이징에서 죽었다. 이러한 한문 서학서와 지도는 명에 간 조선 사신을 통해 조선에도 전해져, 1603년 사신 이광정·권희가 「곤여만국전도」를 가져왔고, 이수광은 『지봉유설』(1614)에서 『천주실의』와 유럽 여러 나라를 소개했다(한국사 '이수광의 『지봉유설』' 참고). 서학은 처음에 학문으로 연구되다가 18세기 후반 일부 남인 학자 사이에서 신앙으로 받아들여졌다."
  subjects: [ming, papal-states, portugal, joseon]
  links:
    - { from: ming, to: joseon, note: "「곤여만국전도」 전래 (1603)" }
  tags: [culture, diplomacy]
  sources: ["마테오 리치, 『천주실의』(송영배 외 옮김, 서울대학교출판부, 1999)", "이수광, 『지봉유설』", "히라카와 스케히로, 『마테오 리치: 동서문명교류의 인문학 서사시』(노영희 옮김, 동아시아, 2002)"]

- id: irish-nine-years-war-1601
  year: 1601
  endYear: 1609
  title:
    ko: 아일랜드 9년 전쟁의 끝, 백작들의 도주와 얼스터 식민
  summary:
    ko: "아일랜드 왕국을 다스리던 잉글랜드 여왕 엘리자베스 1세의 지배가 얼스터로 넓어지자, 티론 백작 휴 오닐과 티르코널의 레드 휴 오도널이 이끈 게일 영주들이 9년 전쟁(1594~1603)을 벌였다. 1601년 9월 말(율리우스력) 에스파냐 왕 펠리페 3세가 보낸 군대 약 3천 5백 명이 남부 킨세일에 상륙하자 두 사람은 북쪽에서 내려왔으나, 1601년 12월 말(율리우스력) 아일랜드 총독 마운트조이가 이끈 잉글랜드군에 크게 졌다. 오도널은 에스파냐로 건너가 1602년 죽었다. 얼스터에서는 잉글랜드군의 곡식 파괴와 기근이 겹쳐 많은 사람이 죽었고, 전쟁 전체의 사망자는 기근과 질병을 포함해 적어도 10만 명으로 추산한다. 엘리자베스가 죽은 지 엿새 뒤인 1603년 3월 30일(율리우스력) 오닐은 멜리폰트 조약으로 항복했는데, 마운트조이가 여왕의 죽음을 4월 5일까지 숨겨 오닐은 이를 모르고 있었다. 그는 게일의 칭호와 사병을 버리고 왕에게 충성하는 대신 백작 지위와 땅을 지켰고(뒤이은 왕 제임스 1세는 스코틀랜드 왕 제임스 6세였다), 오도널의 동생 루어리도 티르코널 백작이 되었다. 1607년 9월 두 백작은 체포 소문 속에 식솔과 함께 대륙으로 떠났고(백작들의 도주), 잉글랜드의 법과 관리가 들어오며 게일 영주들의 옛 질서는 무너졌다. 그들의 땅은 몰수되어 스코틀랜드와 잉글랜드의 정착민이 들어오는 얼스터 식민의 바탕이 되었다. 항목 설명은 게일 영주들을 이 조약이 맺어진 1603년까지로 보지만, 지도는 1542년의 항복과 재수여(1541년 아일랜드 왕국법) 뒤로 그 땅을 아일랜드 왕국으로 그린다(그래서 이 사건 기간의 지도에는 게일 영주들 땅이 없다)."
  subjects: [gaelic-irish-lordships, ireland-kingdom, england, scotland, spain]
  links:
    - { from: spain, to: ireland-kingdom, note: "킨세일 상륙 (1601)" }
    - { from: england, to: ireland-kingdom, note: "킨세일 승리, 멜리폰트 조약 (1601~1603)" }
  tags: [war, politics]
  sources: ["「멜리폰트 조약」(1603)", "Nicholas Canny, Making Ireland British, 1580–1650 (2001)", "Steven G. Ellis, Ireland in the Age of the Tudors, 1447–1603 (1998)"]
  places: [{ name: "킨세일", at: [-8.52, 51.7], year: 1601 }]

- id: dutch-east-india-company-1602
  year: 1602
  title:
    ko: 네덜란드 동인도 회사의 설립
  summary:
    ko: "네덜란드 공화국의 상인들은 포르투갈이 쥐고 있던 아시아 향신료 무역에 뛰어들려고 여러 회사를 세웠는데, 1602년 3월 연방 의회는 이를 하나로 묶어 연합 동인도 회사(VOC)를 세우고 희망봉 동쪽 무역의 독점권과 함께 요새를 짓고 군대를 두며 조약을 맺을 권한을 주었다. 회사는 누구나 주식을 사서 이익을 나누는 방식으로 큰 자본을 모았고, 그 주식이 거래된 암스테르담은 유럽 금융의 중심지가 되었다. 회사는 1605년 포르투갈에게서 몰루카 제도의 암본을 빼앗고, 1609년 일본 히라도에 상관을 열었으며, 1619년 자와섬의 자카르타를 차지해 바타비아로 삼았다. 1621년 총독 쿤은 육두구를 독점하려 반다 제도를 정복하며 주민 다수를 죽이거나 노예로 팔고 쫓아냈다(1만 5천 명 안팎이던 주민 가운데 섬에 남은 사람은 1천 명 남짓, 해나 등의 추산). 1641년부터 회사는 나가사키의 데지마에서 유럽 나라 가운데 홀로 일본과 무역했다."
  subjects: [dutch-republic, portugal, japan]
  links:
    - { from: dutch-republic, to: portugal, note: "아시아 거점 공격 (암본 1605 등)" }
