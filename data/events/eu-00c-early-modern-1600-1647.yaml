  sources: ["「알레 칙령」(1629)", "J. H. Elliott, Richelieu and Olivares (1984)", "Peter H. Wilson, Europe's Tragedy: A History of the Thirty Years War (2009)", "C. V. 웨지우드, 『30년 전쟁 1618~1648』(남경태 옮김, 휴머니스트, 2011)"]
