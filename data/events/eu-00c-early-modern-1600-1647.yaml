# 유럽 근세 사건 2차 묶음 (3): 동인도 회사에서 영국 내전까지 (1600 ~ 1647, 작업 EVD2)
# 범위: 마테오 리치와 서학, 네덜란드 동인도 회사, 러시아 동란 시대와 로마노프 왕조, 브란덴부르크-프로이센, 30년 전쟁
#   (보헤미아 반란·덴마크 단계·스웨덴 단계·프랑스 단계를 나눔), 갈릴레이와 과학 혁명, 포르투갈의 독립 회복,
#   토르스텐손 전쟁과 브룀세브로 조약, 영국 혁명 전반부(1642~1649, 찰스 1세 처형까지).
# 30년 전쟁의 끝(베스트팔렌 조약)과 크롬웰의 공화정은 1차 묶음(eu-00d-early-modern-1648-1788.yaml)에 있다.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 지도에 있는 나라가 생기고 끝난 일(브란덴부르크-프로이센 1618·프로이센 공국 1618)과
#   한국사와 닿는 사건을 더함 (docs/REGION_GUIDE.md §5).
# 한국사와 닿는 점: 마테오 리치의 「곤여만국전도」(1603 전래)와 『천주실의』, 벨테브레이(박연)의 표류(1627), 정두원의 천리경(1631).
#   한국사 묶음(06번)의 이수광 『지봉유설』(1614)·하멜 표류(1653)는 다시 만들지 않고 서술에서만 언급했다(소현 세자의 귀국(1645)은 이 묶음의 사건 기간 밖이라 다루지 않음).
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜는 양력(그레고리력). 잉글랜드·스웨덴·러시아와 독일 신교 지역은 율리우스력을 썼으므로 날짜가 갈리는 곳은 달까지만 적거나 양력으로 적는다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다.
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(번역본이 있으면 번역본). 운영자 검수 필요.

# ── 17세기 초: 아시아로 간 유럽과 러시아의 동란 (1601 ~ 1618) ──────

- id: matteo-ricci-1601
  year: 1601
  endYear: 1610
  title:
    ko: 마테오 리치의 베이징 선교와 『천주실의』
  summary:
    ko: "교황령의 마체라타에서 태어난 예수회 선교사 마테오 리치는 포르투갈 왕의 후원을 받는 예수회 선교망을 따라 고아를 거쳐 1582년 포르투갈의 거점 마카오에 왔다. 그는 중국어와 유교 경전을 익히고 유학자의 옷을 입어 사대부와 사귀며 선교하는 '적응' 방식을 썼고, 1601년 명의 만력제에게 자명종 등을 바쳐 베이징에 머물 수 있게 되었다. 1602년 이지조와 함께 세계 지도 「곤여만국전도」를 만들고, 1603년 천주교 교리를 유교의 말로 풀이한 『천주실의』를 펴냈으며, 서광계와 함께 유클리드 기하학을 『기하원본』으로 옮겼다(1607). 그는 1610년 베이징에서 죽었다. 이러한 한문 서학서와 지도는 명에 간 조선 사신을 통해 조선에도 전해져, 1603년 사신 이광정·권희가 「곤여만국전도」를 가져왔고, 이수광은 『지봉유설』(1614)에서 『천주실의』와 유럽 여러 나라를 소개했다(한국사 '이수광의 『지봉유설』' 참고). 서학은 처음에 학문으로 연구되다가 18세기 후반 일부 남인 학자 사이에서 신앙으로 받아들여졌다."
  subjects: [ming, papal-states, portugal, joseon]
  links:
