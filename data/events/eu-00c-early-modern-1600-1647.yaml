  sources: ["마테오 리치, 『천주실의』(송영배 외 옮김, 서울대학교출판부, 1999)", "이수광, 『지봉유설』", "히라카와 스케히로, 『마테오 리치: 동서문명교류의 인문학 서사시』(노영희 옮김, 동아시아, 2002)"]

- id: dutch-east-india-company-1602
  year: 1602
  title:
    ko: 네덜란드 동인도 회사의 설립
  summary:
    ko: "네덜란드 공화국의 상인들은 포르투갈이 쥐고 있던 아시아 향신료 무역에 뛰어들려고 여러 회사를 세웠는데, 1602년 3월 연방 의회는 이를 하나로 묶어 연합 동인도 회사(VOC)를 세우고 희망봉 동쪽 무역의 독점권과 함께 요새를 짓고 군대를 두며 조약을 맺을 권한을 주었다. 회사는 누구나 주식을 사서 이익을 나누는 방식으로 큰 자본을 모았고, 그 주식이 거래된 암스테르담은 유럽 금융의 중심지가 되었다. 회사는 1605년 포르투갈에게서 몰루카 제도의 암본을 빼앗고, 1609년 일본 히라도에 상관을 열었으며, 1619년 자와섬의 자카르타를 차지해 바타비아로 삼았다. 1621년 총독 쿤은 육두구를 독점하려 반다 제도를 정복하며 주민 다수를 죽이거나 노예로 팔고 쫓아냈다(1만 5천 명 안팎이던 주민 가운데 섬에 남은 사람은 1천 명 남짓, 해나 등의 추산). 1641년부터 회사는 나가사키의 데지마에서 유럽 나라 가운데 홀로 일본과 무역했다."
  subjects: [dutch-republic, portugal, japan]
