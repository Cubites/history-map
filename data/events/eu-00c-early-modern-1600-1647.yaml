- id: romanov-1613
  year: 1613
  endYear: 1618
  title:
    ko: 로마노프 왕조의 시작과 스톨보보·데울리노 강화
  summary:
    ko: "폴란드군이 물러난 뒤 1613년 초 모스크바에서 열린 전국 회의(젬스키 소보르)는 열여섯 살의 미하일 로마노프를 차르로 뽑아 로마노프 왕조(1613~1917)가 시작되었다. 폴란드에 포로로 잡혀 있던 그의 아버지 필라레트는 1619년 돌아와 총대주교로서 아들과 함께 나라를 다스렸다. 새 정부는 전쟁을 끝내려 1617년 초 스웨덴과 스톨보보 조약을 맺어 노브고로드를 돌려받는 대신 잉그리아와 케크스홀름을 넘겨 발트해로 나가는 길을 잃었고, 1618년 12월 폴란드-리투아니아 연방과 데울리노 휴전을 맺어 스몰렌스크와 세베르스크 땅을 넘겼다. 브와디스와프는 러시아 차르 칭호를 고집하다 1634년에야 내려놓았다. 이 시기에도 러시아는 시베리아로 꾸준히 나아가 1632년 레나강 가에 야쿠츠크를 세웠다."
