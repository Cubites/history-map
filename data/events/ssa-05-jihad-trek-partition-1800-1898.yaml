  tags: [war, colonization]
  sources: ["Edna G. Bay, Wives of the Leopard: Gender, Politics, and Culture in the Kingdom of Dahomey (University Press of Virginia, 1998)", "Stanley B. Alpern, Amazons of Black Sparta: The Women Warriors of Dahomey (New York University Press, 1998)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
