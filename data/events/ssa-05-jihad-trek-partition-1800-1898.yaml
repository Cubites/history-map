- id: samori-guinea-1882
  year: 1882
  endYear: 1898
  title:
    ko: "사모리 투레의 저항과 프랑스령 기니·코트디부아르(1882~1898)"
  summary:
    ko: "사모리 투레는 1830년 무렵 지금의 기니 동부에서 태어난 디울라 상인 출신으로, 1866년부터 토론 지방으로 세력을 넓혔고 1873년 비산두구를 근거지로 삼아 와술루 제국을 세웠으며, 1875년 칸칸의 바테 제국과 동맹했다. 와술루는 오늘날 기니·말리·코트디부아르·시에라리온·부르키나파소 일부에 걸쳤다. 그는 1878년 스스로 파마(군사 지도자)를 칭했고 1884년 이슬람을 국교로 삼으며 알마미 칭호를 썼다. 프랑스는 1882년 기니 해안의 리비에르뒤쉬드를 따로 식민지로 삼았고, 내륙에서 니제르 상류로 진출하던 군대는 1882년 2월 사모리와 사마야에서 처음 부딪쳤다. 사모리는 한편으로 프랑스와 1886년 3월 28일 케니에바쿠라 조약, 1887년 3월 23일 비산두구 조약, 1889년 니아코 조약을 맺어 싸움을 늦추었고, 1887년 4월부터 약 15개월 시카소 성을 포위했으나 끝내 함락하지 못했다. 프랑스군은 1891년 4월 11일 칸칸을 차지했고, 1893년 사모리는 프랑스의 보급 차단을 피해 동쪽으로 옮겨 1895년 콩을 차지하고 지금의 코트디부아르 북부에 새 영토를 얻었으나 1897년 5월 23일 콩을 스스로 불태우고, 8월 20일 부나에서 프랑스의 브로 종대를 몰살시켰다. 프랑스는 이 지역을 1893년 프랑스령 코트디부아르 식민지로 삼아 해안에서 내륙으로 밀고 들어갔다. 푸타잘롱 이맘국은 1896년 프랑스의 보호 아래 놓이며 끝났다. 시카소가 1898년 5월 1일 프랑스에 떨어졌고, 사모리는 1898년 9월 29일 프랑스령 수단 소속 구로 대위의 부대에 겔레무에서 붙잡혀 가봉으로 유배되어 1900년 6월 2일 병으로 숨졌다."
  subjects: [french-guinea, french-ivory-coast, fouta-djallon, french-sudan]
  tags: [war, colonization, resistance]
  sources: ["Yves Person, Samori: Une révolution dyula (IFAN, 1968~1975)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 겔레무, at: [-8.0, 7.9], year: 1898 }]

- id: german-protectorates-1884
  year: 1884
  endYear: 1885
  title:
    ko: "독일의 아프리카 보호령: 토골란드·카메룬·남서아프리카·동아프리카(1884~1885)"
  summary:
    ko: "독일 제국의 총리 비스마르크는 오랫동안 식민지에 회의적이었으나 1884년 무역 상인들의 요구를 받아들여 해외 보호령을 허락했다. 가장 먼저 움직인 것은 브레멘의 상인 아돌프 뤼데리츠로, 남서아프리카 해안의 앙그라 페케냐(훗날 뤼데리츠)를 사들이고 영국에 보호를 청했다가 거절당한 뒤 독일에 보호를 청했고, 1884년 4월 이 거점이 독일 보호 아래 놓였다. 월비스베이는 영국 땅으로 남았다. 독일 제국 서아프리카 해안 판무관으로 1884년 3월 임명된 구스타브 나흐티갈은 1884년 7월 기니만의 토골란드 해안과 카메룬 해안에서 현지 지배자들(카메룬에서는 두알라 추장 벨과 아크와가 서명했다고 전한다)과 조약을 맺어 두 곳을 보호령으로 삼았다. 영국은 카메룬의 일부를 노려 협상을 서둘렀으나 독일이 며칠 앞섰다. 1885년 2월 칼 페터스는 독일 식민 협회를 위해 동아프리카 내륙에서 모은 땅 요구를 토대로 같은 달 27일 황제의 보호장(칙허)을 얻어 독일 동아프리카 회사를 세웠다. 같은 해 4월 덴하르트 형제는 케냐 해안의 위투를 차지했다. 잔지바르 술탄은 반발했으나 1886년 영독 협정으로 해안의 16킬로미터 띠를 인정받는 데 그쳤다. 1884년 11월부터 1885년 2월까지 베를린 회의가 열려 이런 식민 확보의 규칙을 정했으며 이 회의는 「아프리카 분할과 베를린 서아프리카 회의」(앞의 사건)에 적혀 있다. 독일 의회가 식민지 경영 비용을 걱정해 비스마르크는 통치를 개인 회사에 맡기는 방식을 선호했다. 독일령 동아프리카의 넓이는 훗날 약 99만 5,000제곱킬로미터에 이르렀고, 이 보호령들은 이후 독일 식민지가 되었다."
  subjects: [german-togoland, german-kamerun, german-south-west-africa, german-east-africa, german-empire]
  tags: [colonization, diplomacy]
  sources: ["Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)", "Woodruff D. Smith, The German Colonial Empire (University of North Carolina Press, 1978)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 앙그라 페케냐, at: [15.16, -26.64], year: 1884 }]

- id: congo-free-state-1885
  year: 1885
  endYear: 1904
  title:
    ko: "레오폴드 2세의 콩고 자유국과 고무 수탈(1885~1904)"
  summary:
    ko: "벨기에 국왕 레오폴드 2세는 개인 재산으로 탐험가 헨리 모턴 스탠리를 후원해 1879년부터 콩고강 유역에서 현지 추장들과 조약을 맺게 했고, 이 땅을 '국제 아프리카 협회'의 자선 사업이라 내세워 열강의 인정을 받으려 했다. 미국이 가장 먼저 그 주장을 인정했으며, 1884~1885년 베를린 회의의 결과(「아프리카 분할과 베를린 서아프리카 회의」(앞의 사건))를 발판으로 콩고 자유국은 1885년 7월 1일 레오폴드를 군주로 하여 선포되었다. 이 나라는 벨기에와 국왕을 통해서만 이어졌을 뿐 벨기에 정부의 소유가 아니었고, 면적은 약 234만 5,000제곱킬로미터에 이르렀다. 자유국은 상아에 이어 1890년대 자전거 타이어 같은 수요로 값이 오른 야생 고무를 국가 독점과 특허 회사를 통해 거두었고, 마을마다 할당량을 채우지 못하면 벌을 주었다. 이를 집행한 병력은 공안군(포르스 퓌블리크)이었으며, 죽은 사람의 증거로 잘린 손을 가져오게 했다는 증언이 남아 있다. 1892~1894년에는 스와힐리 상인 세력과 아랍–스와힐리 전쟁을 벌여 동부를 장악했다. 1894년 영국과 맺은 조약으로 라도 지역을 빌렸고, 같은 해 프랑스와는 우방기강 일대 경계를 맺어 프랑스령 콩고와 맞닿았다. 자유국의 장교와 관리는 벨기에인 외에 이탈리아·스칸디나비아·영국 출신도 있었다. 희생자 수는 기록이 부족해 수백만에서 천만 명 남짓까지 추산이 갈리며, 가장 높은 추정은 고무 산지 인구의 절반이 줄었다고 본다. 1904년 영국 영사 로저 케이스먼트의 보고서와 개혁 운동이 국제 여론을 일으켰고, 1908년의 병합은 「벨기에의 콩고 병합(1908)」(뒤의 사건)이 다룬다."
  subjects: [congo-free-state, french-congo]
  tags: [colonization, politics, society]
  sources: ["Adam Hochschild, King Leopold's Ghost (Houghton Mifflin, 1998)", "Jan Vansina, Being Colonized: The Kuba Experience in Rural Congo, 1880–1960 (University of Wisconsin Press, 2010)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 레오폴드빌(지금 킨샤사), at: [15.3, -4.32], year: 1885 }]

- id: bechuanaland-1885
  year: 1885
  endYear: 1895
  title:
    ko: "베추아날란드 보호령과 영국령 베추아날란드(1885~1895)"
  summary:
    ko: "칼라하리 사막 가장자리의 베추아날란드는 츠와나 추장국들이 흩어져 있는 땅으로, 남아프리카 내륙으로 가는 선교사와 상인의 '선교사의 길'이 지나는 길목이었다. 1880년대 초 트란스발 보어인 의용군이 남쪽 츠와나 땅에 스텔라랜드(1882년)와 고센 두 작은 공화국을 세우자 영국은 크게 놀랐다. 보어인이 이 길을 막으면 북쪽 내륙 진출이 끊기고, 독일이 1884년 남서아프리카를 얻어 서쪽에서 트란스발과 이어질 위험도 있었기 때문이다. 영국은 찰스 워런 장군의 원정군을 1884년 말 보내 스텔라랜드와 고센을 해체했고, 1885년 3월 31일 이 일대에 베추아날란드 보호령을 선포했고, 9월에는 남쪽 땅을 직할 식민지 영국령 베추아날란드로 갈라 내고 보호령을 북쪽으로 넓혔다. 영국령 베추아날란드는 넓이가 약 13만 3,000제곱킬로미터였고, 해체된 스텔라랜드는 약 15,500제곱킬로미터, 고센은 약 10,400제곱킬로미터였다. 워런의 원정군은 4,000명쯤이었다고 한다. 1890년 영국 남아프리카 회사의 개척대는 이 땅 동쪽을 지나 북쪽 마쇼나랜드로 올라갔다. 사업가 세실 로즈는 이 길을 '내륙으로 통하는 수에즈 운하'라 불렀다고 전한다. 영국령 베추아날란드는 직할 식민지로 1895년까지 이어지다 케이프 식민지에 합쳐졌다. 보호령은 북쪽에서 따로 남아, 로즈의 영국 남아프리카 회사가 이 땅을 넘겨받으려 하자 1895년 세 추장 카마 3세, 세첼레, 바토엔이 런던으로 건너가 반대 청원을 냈다. 영국 정부는 추장들의 요청을 받아들여 보호령을 회사에 넘기지 않고 직접 맡았다. 이 보호령은 훗날 1966년 보츠와나로 독립한다."
  subjects: [bechuanaland, british-bechuanaland, cape-colony]
  links:
    - { from: cape-colony, to: british-bechuanaland, note: "1895년 합병함" }
  tags: [colonization, diplomacy]
  sources: ["Anthony Sillery, The Bechuanaland Protectorate (Oxford University Press, 1952)", "Neil Parsons, A New History of Southern Africa (Macmillan, 2nd ed. 1993)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]

- id: portuguese-interior-1885
  year: 1885
  endYear: 1891
  title:
    ko: "포르투갈의 '분홍 지도'와 영국의 최후통첩(1885~1891)"
  summary:
    ko: "포르투갈은 15세기 이래 앙골라와 모잠비크의 해안 몇 곳에 닻을 내리고 있었으나, 내륙 대부분은 실제로 다스리지 못했다. 1884~1885년 베를린 회의가 '실효 점유'를 새 식민 기준으로 내걸자 포르투갈은 해안 거점을 내륙으로 이어 앙골라에서 모잠비크까지 대륙을 가로지르는 띠를 잇겠다는 구상을 서둘렀고, 1884년 영국과 콩고 하구를 두고 맺으려던 조약은 비준되지 못했다. 1886년 포르투갈은 프랑스·독일과 각각 앙골라·모잠비크 경계를 맺고, 두 식민지 사이 땅을 분홍색으로 칠한 이른바 '분홍 지도'를 냈다. 분홍 지도가 덮은 땅은 오늘날 잠비아·짐바브웨·말라위 일대였다. 1887년 포르투갈은 분홍 지도 구상을 영국과 프랑스 정부에 알렸으나 영국은 받아들이지 않았다. 그러나 케이프에서 카이로까지 영국 영토를 잇는 일을 꿈꾸던 세실 로즈 쪽과 이해가 맞부딪혔고, 1889년 포르투갈 탐험가 세르파 핀투가 시레 고원에서 영국 보호를 청한 마콜롤로 추장들을 무력으로 치자 영국 정부는 1890년 1월 11일 포르투갈에 군대 철수를 요구하는 최후통첩을 보냈다. 포르투갈은 다음 날 요구를 받아들였고, 리스본에서는 반영 시위가 일어났고 훗날 국가가 되는 노래 '아 포르투게자'가 이 무렵 지어졌다. 왕실에 대한 신뢰가 떨어져 이 일은 1910년 왕정 붕괴의 한 배경으로 꼽힌다. 1890년 8월 조약은 의회가 비준하지 못했고, 1891년 6월 11일 새 조약으로 포르투갈은 마니카 지방 일부를 영국에 내주고 앙골라와 모잠비크 경계를 인정받는 대신 분홍 지도의 꿈을 접었다. 앙골라 남동 쪽 로지 왕국과의 경계는 훗날 1905년 이탈리아 국왕의 중재로 다시 다루어졌다."
  subjects: [portuguese-angola, portuguese-mozambique, uk]
  tags: [diplomacy, colonization]
  sources: ["Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)", "Malyn Newitt, Portugal in Africa: The Last Hundred Years (Longman, 1981)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]

- id: witwatersrand-1886
  year: 1886
  endYear: 1896
  title:
    ko: "비트바테르스란트 금광과 제임슨 습격(1886~1896)"
  summary:
    ko: "트란스발 공화국은 1884년 런던 협약으로 독립을 얻은 뒤에도 가난한 농업국이었으나, 1884년 광산 기사 반체스와 스트루벤 형제가 지금의 요하네스버그 둘레에서 금 광맥의 첫 조짐을 찾았고 1886년에는 거대한 주 광맥이 확인되었다. 비트바테르스란트의 금은 얕은 곳에서 곡괭이로 캐는 사금이 아니라 깊이 묻힌 광맥에서 캐야 했으므로 큰 자본과 기술이 필요했고, 영국과 유럽 자본의 광산 대기업들이 몰려들었다. 도시 요하네스버그는 1886년 광산촌으로 세워졌고 몇 해 만에 수만 명이 사는 도시가 되었다. 1896년 무렵 영국인이 대부분인 외국인 노동자와 투자자, 이른바 위틀란더는 약 6만 명으로 보어인 성인 남자 약 3만 명의 두 배였으나 시민권과 선거권은 오래 거주해야 얻을 수 있었다. 이 광산 지대는 곧 세계에서 가장 큰 금 산지가 되었고, 1894년 델라고아만 철도가 열려 인도양 항구와 이어졌다. 폴 크뤼거의 정부는 다이너마이트 독점과 높은 세금으로 불만을 키웠다. 케이프 식민지 총리 세실 로즈는 이를 이용해 공화국을 뒤집으려는 계획을 세웠고, 1895년 12월 29일 영국 남아프리카 회사 경찰 약 500~600명을 이끈 리언더 스타 제임슨이 트란스발로 쳐들어갔다. 이들은 1896년 1월 2일 도른코프에서 피트 크로녜의 보어 민병대에 항복했다. 독일 황제 빌헬름 2세는 크뤼거에게 승리를 축하하는 전보를 보내 영국과 독일 사이가 나빠졌다. 로즈는 케이프 총리에서 물러났고, 이 사건은 보어인의 경계심과 영국 식민장관 조지프 체임벌린의 압박을 키워 「제2차 보어 전쟁과 베르니이헝 조약(1899~1902)」(뒤의 사건)으로 이어진다."
  subjects: [south-african-republic, cape-colony]
  tags: [trade, politics, war]
  sources: ["Charles van Onselen, Studies in the Social and Economic History of the Witwatersrand 1886–1914 (Longman, 1982)", "Elizabeth Longford, Jameson's Raid: The Prelude to the Boer War (Weidenfeld & Nicolson, 1960)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 요하네스버그, at: [28.05, -26.2], year: 1886 }]

- id: ibea-uganda-1888
  year: 1888
  endYear: 1895
  title:
    ko: "제국 영국 동아프리카 회사와 우간다·동아프리카 보호령(1888~1895)"
  summary:
    ko: "제국 영국 동아프리카 회사는 1888년 4월 18일 런던에서 스코틀랜드 출신 해운업자 윌리엄 매키넌이 이끄는 상인 협회로 출발했고, 같은 해 9월 6일 영국 왕실의 칙허장을 얻어 오늘날 케냐 해안과 내륙의 통상과 행정을 맡았다. 이 회사는 잔지바르 술탄에게서 해안의 땅을 빌려 몸바사를 거점으로 삼았고, 1890년 몸바사에서 내륙으로 가는 매키넌–스클레이터 도로를 닦기 시작했다. 1890년 7월 1일 영국과 독일이 맺은 헬골란트–잔지바르 조약에서 영국은 독일에 헬골란트를 넘기는 대신 잔지바르 보호와 우간다 쪽 영향권을 얻었으므로, 회사는 프레더릭 루가드를 내륙으로 보내 부간다 왕국의 카바카 왕 음왕가 2세와 협정을 맺었다. 부간다에서는 가톨릭과 개신교, 이슬람 세력이 서로 싸웠고 1892년 1월 내전이 터지자 루가드는 맥심 기관총으로 개신교 편을 도왔다. 음왕가는 협정을 맺고도 프랑스 가톨릭 선교사와 영국 개신교 선교사 사이에서 흔들렸다. 회사는 이 원정으로 재정이 바닥나 1893년 영국 정부에 행정권을 넘겼고, 영국 정부 대표 제럴드 포털이 몸바사에서 부간다로 올라가 압박했다. 영국은 1894년 우간다 보호령을 선포해 부간다 왕국의 독립이 끝났고, 1895년 7월 1일에는 내륙과 해안을 묶어 동아프리카 보호령(훗날 케냐 식민지)을 세웠으며 회사는 같은 해 문을 닫았다. 정부는 1896~1901년 몸바사에서 빅토리아호 연안 키수무까지 우간다 철도를 놓았고, 이 길은 영국 지배의 뼈대이자 인도계 노동자 이주의 통로가 되었다. 영국 의회에서는 이 철도를 비웃어 미친 열차라 불렀고 건설비는 약 500만 파운드 이상이 들었다."
  subjects: [ibea-company, british-uganda, british-kenya, buganda, uk]
  links:
    - { from: uk, to: buganda, note: "1894년 우간다 보호령을 선포해 왕국의 독립을 끝냄" }
  tags: [colonization, trade, diplomacy]
  sources: ["John S. Galbraith, Mackinnon and East Africa 1878–1895 (Cambridge University Press, 1972)", "Roland Oliver, The Missionary Factor in East Africa (Longmans, 1952)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
