  sources: ["David Robinson, The Holy War of Umar Tal: The Western Sudan in the Mid-Nineteenth Century (Clarendon Press, 1985)", "Yves Person, Samori: Une révolution dyula (IFAN, 1968~1975)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
