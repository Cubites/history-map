- id: liberia-1822
  year: 1822
  endYear: 1847
  title:
    ko: "아메리카 식민 협회와 라이베리아의 독립(1822~1847)"
  summary:
    ko: "아메리카 식민 협회는 1816년 찰스 머서와 로버트 핀리 같은 인사들이 자유 흑인을 아프리카로 보내자는 뜻으로 세운 단체로, 노예제 폐지론자와 노예 소유자가 서로 다른 속셈으로 함께했다. 1820년 2월 6일 배 엘리자베스호가 뉴욕을 떠나 이민자 86명(88명이라는 기록도 있다)을 실어 날랐다. 건너온 이들은 대개 미국에서 자유를 얻은 흑인이었고 침례교 목사 로트 캐리 같은 지도자도 있었다. 협회는 1821년 12월 케이프메수라도 일대를 현지 수장 '피터 왕'에게서 사들였다. 정착지는 1822년 이곳에 자리 잡았고 1824년 미국 대통령 먼로의 이름을 따 먼로비아라 불렸다. 1822년 12월에는 정착지가 이웃 주민의 공격을 받았으나 가까스로 버텨 냈다. 1820년부터 1843년까지 건너온 이민자 4,571명 가운데 1,819명(39.8퍼센트)만 살아남을 만큼 말라리아 같은 열병이 심했고, 내륙의 현지 주민과 땅을 둘러싼 충돌이 이어졌다. 1838~1839년 여러 정착지가 묶여 라이베리아 연방이 되었고, 협회의 지배에 불만이 커지자 1847년 7월 26일 정착민 대표 11명이 독립을 선언하고 조지프 젠킨스 로버츠를 초대 대통령으로 뽑았다. 헌법은 미국 헌법을 본떠 대통령과 상원·하원을 두었고 국기도 미국 성조기와 닮았다. 영국은 1848년, 프랑스는 1852년에 새 나라를 인정했으나 미국은 1862년에야 외교 관계를 맺었다. 메릴랜드 정착지는 1854년 독립을 선언했다가 그레보인과 크루인의 압박 속에 라이베리아로 합쳐졌다. 정착민과 그 후손이 나라의 정치를 쥐고 내륙 토착민을 시민에서 사실상 비껴 놓는 구조가 오래 이어졌으며, 라이베리아는 에티오피아와 함께 아프리카 분할기에 식민 지배를 받지 않은 나라로 남았다."
  subjects: [liberia, usa]
  tags: [politics, migration, independence]
  sources: ["Amos J. Beyan, The American Colonization Society and the Creation of the Liberian State (University Press of America, 1991)", "Tom W. Shick, Behold the Promised Land: A History of Afro-American Settler Society in Nineteenth-Century Liberia (Johns Hopkins University Press, 1977)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 먼로비아, at: [-10.8, 6.3], year: 1822 }]

- id: anglo-asante-1824
  year: 1824
  endYear: 1874
  title:
    ko: "영국–아샨티 전쟁과 골드코스트 식민지(1824~1874)"
  summary:
    ko: "아샨티 제국은 쿠마시를 도읍으로 금과 노예 무역을 쥐고 내륙에서 해안 판테 연맹 땅까지 세력을 뻗었고, 해안의 영국 상관과 그 보호를 받는 판테 사이에서 부딪혔다. 아샨티 왕 오세이 보누수(재위 1804~1824)의 군대가 1823년 영국 식민군의 병사 한 명이 죽은 일을 계기로 해안에 이르렀고, 1824년 1월 21일 은삼마코 전투에서 아샨티 지휘관 아만콰티아의 군대에 맞서던 영국 총독 찰스 맥카시가 전사했다. 영국과 동맹군은 1826년 8월 7일 도도와에서 아샨티군을 꺾었으며, 1831년 프라강을 경계로 하는 합의가 맺어졌다. 그 뒤 해안 상관을 맡은 조지 매클린이 판테 수장들과 1844년의 서약으로 영국의 재판권을 넓혔다. 아샨티가 프라강을 건너 도망자를 쫓은 일로 1863~1864년 전쟁이 벌어졌으나 승패 없이 끝났다. 1872년 네덜란드의 골드코스트 상관이 영국에 넘어가자 엘미나를 지키던 아샨티가 1873년 초 해안으로 내려왔고, 영국은 가넷 울슬리를 보내 반격했다. 울슬리군은 1874년 1월 31일 아모아풀 전투를 이기고 2월 4일 쿠마시에 들어가 비어 있던 왕궁을 부쉈다. 코피 카리카리 왕은 1874년 2월 13일 폼페나 조약에서 금 5만 온스의 배상, 판테·덴키라 등 해안 쪽 종속국에 대한 권리 포기, 쿠마시와 해안을 잇는 길의 개방에 동의했고, 영국은 그해 7월 골드코스트 식민지를 선포했다. 코피 카리카리는 그해 10월 자리에서 쫓겨났다. 아샨티 왕은 오세이 보누수 뒤 오세이 야우 아코토(재위 1824~1834), 콰쿠 두아 1세(1834~1867), 코피 카리카리(1867~1874) 순으로 이어졌다."
  subjects: [asante, british-gold-coast, uk]
  links:
    - { from: uk, to: asante, note: "1874년 쿠마시를 점령하고 폼페나 조약을 맺음" }
  tags: [war, colonization]
  sources: ["Ivor Wilks, Asante in the Nineteenth Century (Cambridge University Press, 1975)", "W. E. F. Ward, A History of Ghana (Allen & Unwin, 1958)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 쿠마시, at: [-1.62, 6.69], year: 1874 }]

- id: great-trek-1835
  year: 1835
  endYear: 1843
  title:
    ko: "그레이트 트렉과 블러드강 전투, 나탈리아 공화국(1835~1843)"
  summary:
    ko: "케이프 식민지의 네덜란드계 농민은 영국이 1834년 노예제를 폐지하고 변경 정책에서 코사 사람과의 관계를 달리 다루자 불만을 키웠고, 1835년 무렵부터 가축과 마차를 몰고 식민지 밖으로 떠났다. 이들은 보어인 가운데에서도 '보르트레커'라 불렸으며, 첫 물결에 약 6,000명, 전체로 약 12,000명이 나섰다고 한다. 지도자로는 헨드릭 포트히터, 헤릿 마리츠, 피트 위스, 피트 레티프 등이 있었고 서로 방향과 지도권을 두고 다투기도 했다. 포트히터 무리는 북쪽 트란스발 쪽으로 올라가 은데벨레와 맞섰고, 레티프가 이끈 무리는 나탈 쪽으로 향했다. 영국 정부는 이들이 영국 신민이라 내세웠으나 실제로 막지 못했다. 줄루 왕 딩가네는 1838년 2월 협상 자리에서 레티프 일행을 죽였다. 줄루 군대는 며칠 뒤 위넨 일대의 야영지를 쳐 보어인과 하인 532명을 죽였는데, 그 가운데 보어인이 282명이었다. 1838년 12월 16일 안드리스 프레토리위스가 이끈 보어 마차 진영이 블러드강 가에서 줄루군을 막아 크게 이겼고, 이 일은 훗날 보어인의 기념일이 되었다. 줄루 쪽 사망은 3,000명 안팎으로 추산하나 숫자는 전하는 이에 따라 다르다. 1839년 보어인은 나탈리아 공화국을 세우고 피터마리츠버그를 도읍으로 삼았으며, 1840년 딩가네가 아우인 음판데에게 밀려 숨지자 음판데와 손잡았다. 영국은 포트나탈 항구의 지배권을 놓지 않았고 1842년 콩겔라 전투 뒤 영국군이 보어인을 눌렀다. 1843년 영국은 나탈리아를 병합해 나탈 식민지로 삼았고, 많은 보어인은 다시 드라켄즈버그 산맥 너머로 옮겨 갔다. 이들이 세운 두 공화국의 승인은 「오렌지강 주권령과 두 보어 공화국의 승인(1848~1854)」(뒤의 사건)이 다룬다."
  subjects: [natalia, natal, zulu, cape-colony]
  links:
    - { from: uk, to: natalia, note: "1843년 병합해 나탈 식민지로 삼음" }
  tags: [migration, war, politics]
  sources: ["Norman Etherington, The Great Treks (Longman, 2001)", "Leonard Thompson, A History of South Africa (Yale University Press, 4th ed. 2014)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 블러드강 전투지, at: [30.35, -28.1], year: 1838 }]

- id: zanzibar-said-1840
  year: 1840
  endYear: 1873
  title:
    ko: "사이드 빈 술탄의 잔지바르와 정향·노예 무역(1840~1873)"
  summary:
    ko: "오만의 부사이드 왕조를 다스린 사이드 빈 술탄은 인도양 서쪽 끝 잔지바르를 주요 근거지로 삼아 1832년 또는 1840년 궁정을 마스카트에서 잔지바르 스톤타운으로 옮겼다(해는 자료마다 갈린다). 그는 정향 재배를 장려했고, 아랍계 지주가 노예 노동으로 일구는 정향 농장이 웅구자와 펨바 섬에 퍼졌다. 상인들은 내륙 도시 타보라와 우지지까지 상아와 노예를 모으는 대상로를 뻗었고, 인도 상인 공동체가 자리 잡아 정향과 상아 무역의 자금을 댔다. 영국·미국·프랑스는 잇달아 통상 조약을 맺고 잔지바르에 영사를 두었으며, 영국은 노예 무역 단속을 이유로 인도양 해군을 움직였다. 1822년 모레스비 조약으로 술탄의 영토에서 기독교 나라에 노예를 파는 일이 막혔고, 1845년 해밀턴 조약으로 아프리카 영토에서 아시아 영토로 노예를 내보내는 일이 금지되었다(시행 1847년). 1856년 사이드가 숨지자 오만과 잔지바르는 갈라졌고 아들 마지드가 잔지바르의 초대 술탄(재위 1856~1870)이 되었고, 1861년 인도 총독 캐닝의 판정 뒤 오만에 해마다 보조금을 주게 되었다. 이 분리와 영국의 배타 협정은 「사이드 빈 술탄의 죽음과 오만·잔지바르의 분리, 영국의 배타 협정(1856~1891)」(뒤의 사건)이 다룬다. 마지드의 아우 바르가시가 1870년 즉위한 뒤 영국은 노예 무역 금지를 압박했고, 1873년 영국 특사 바틀 프리어가 이끈 교섭 끝에 바르가시가 노예 해상 수출을 금지하는 조약을 맺어 스톤타운의 공개 노예 시장이 닫혔다. 잔지바르 시장을 거친 노예는 해마다 수만 명으로 추산하며, 공개 시장이 닫힌 뒤에도 정향 농장의 노예제는 1897년까지 이어졌다. 이 시기 잔지바르는 동아프리카 해안과 내륙 교역의 중심 항구였다."
  subjects: [sultanate-of-zanzibar, busaid-oman, uk]
  tags: [trade, slavery, politics]
  sources: ["Abdul Sheriff, Slaves, Spices and Ivory in Zanzibar (James Currey, 1987)", "Edward A. Alpers, Ivory and Slaves in East Central Africa (Heinemann, 1975)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 스톤타운, at: [39.19, -6.16], year: 1840 }]

- id: comoros-mayotte-1841
  year: 1841
  endYear: 1886
  title:
    ko: "프랑스의 마요트 획득과 코모로 보호령(1841~1886)"
  summary:
    ko: "코모로 제도는 모잠비크 해협 북쪽 어귀에 네 개의 큰 섬이 늘어선 곳으로, 15~16세기 시라지 상인과 하드라마우트 출신 가문이 술탄 가문을 세워 동아프리카 해안과 마다가스카르 사이의 무역 중계지 구실을 했다. 가장 큰 섬 그랑드코모르(응가지자)는 열두 개 안팎의 작은 왕국으로 갈라져 있었고, 안주안(은즈와니)은 대체로 한 술탄 아래 있었다. 섬 주민은 아랍 상인의 시라지 전통과 마다가스카르에서 온 사칼라바 이주민, 아프리카 해안에서 온 반투 계통 어민이 섞여 있었고 말은 스와힐리어와 가까운 코모로어였다. 섬들은 통치자가 여럿으로 갈려 서로 다투는 일이 잦아 외국 세력이 끼어들 틈이 컸다. 프랑스는 1840년 마다가스카르 북서쪽 노지베 섬을 얻은 데 이어 이듬해 마요트로 눈을 돌렸다. 마다가스카르에서 메리나 왕국의 압박에 쫓겨 마요트에 온 술탄 안드리안초울리는 마다가스카르 북서부 사칼라바 왕가 출신으로 이웃 섬 통치자들과 메리나의 위협을 막으려 프랑스에 의지했다고 전하며, 제독 드 엘과의 교섭 끝에 1841년 이 섬을 프랑스에 넘겼다. 마요트는 프랑스의 첫 코모로 거점이 되어 사탕수수 농장이 생겼고, 1848년 프랑스 식민지에서 노예제가 폐지된 뒤에는 계약 노동자가 농장 일을 맡았다. 한편 영국은 1848년부터 1866년까지 영사 윌리엄 선리를 안주안에 두고 그 술탄에게 영향을 끼쳤다. 프랑스는 이웃 섬들에도 차례로 손을 뻗어, 1886년 그랑드코모르·안주안·모엘리의 지배자들과 보호 조약을 맺었다. 이로써 마요트를 뺀 세 섬은 프랑스령 코모로가 되었고, 이 보호령은 1908년 마다가스카르 식민지에 붙었다가 1912년 마지막 술탄이 물러나면서 완전한 식민지가 되었다."
  subjects: [mayotte, french-comoros, france]
  tags: [colonization, diplomacy]
  sources: ["Malyn Newitt, The Comoro Islands: Struggle against Dependency in the Indian Ocean (Westview Press, 1984)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 마요트, at: [45.17, -12.8], year: 1841 }]

- id: kololo-1845
  year: 1845
  endYear: 1864
  title:
    ko: "세벳와네의 콜롤로 왕국과 로지 왕국의 복귀(1845~1864)"
  summary:
    ko: "콜롤로는 오늘날 레소토와 프리스테이트 쪽 고원에서 살던 소토–츠와나계 무리로, 줄루 세력이 퍼지던 1820년대의 혼란 속에서 지도자 세벳와네의 지휘 아래 1823년 무렵부터 북쪽으로 옮겨 갔다. 그들은 1826년 바응와케체 사람들에게 디투바루바에서 크게 졌으나 1835년 오카방고 삼각주의 바타와나를 이겼고, 잠베지강을 건너 로지 사람들이 사는 잠베지 상류 범람원으로 들어섰다. 로지 왕국은 1600년 무렵부터 이곳의 물가 평원에서 번영해 온 나라였는데, 세벳와네는 이를 정복해 1845년 무렵에는 바로체랜드의 왕이 되었다. 콜롤로는 소토 말을 퍼뜨렸고 이 말은 로지 말에 섞여 오늘날 실로지어에 흔적을 남겼다. 1851년 스코틀랜드 출신 선교사 데이비드 리빙스턴이 세벳와네를 찾아 만났고, 세벳와네는 그해 숨졌다. 딸 마모치사네가 뒤를 이었다가 이복형제 세켈레투에게 왕위를 넘겼다. 세켈레투는 1854~1856년 리빙스턴이 루안다에서 인도양 연안 켈리마느까지 대륙을 가로지를 때 짐꾼을 대 주었다. 콜롤로의 지배는 열병으로 병력이 줄고 정복당한 로지 귀족이 반발하면서 흔들렸으며, 세켈레투가 죽은 1863~1864년 사이 계승 다툼이 벌어졌다. 1864년 로지 사람들이 봉기해 콜롤로 지배자들을 죽이거나 쫓아냈고, 시포파 루탕가가 왕이 되어 '제2왕국'이라 부르는 로지 왕국이 되살아났다. 1855년 11월 리빙스턴은 세켈레투 사람들의 안내로 잠베지강의 폭포를 보고 빅토리아 폭포라 이름 붙였다. 세벳와네는 정복한 로지 사람과 이웃 민족을 군대에 받아들이는 데 너그러웠다고 전한다. 이후 로지 왕국은 1890년대까지 이어져 영국의 보호 아래 놓인다."
  subjects: [kololo-kingdom, lozi-kingdom]
  links:
    - { from: kololo-kingdom, to: lozi-kingdom, note: "1840년대 로지 왕국을 정복해 지배함" }
