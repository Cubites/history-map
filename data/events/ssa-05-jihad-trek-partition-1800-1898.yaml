- id: rabih-bornu-1893
  year: 1893
  endYear: 1902
  title:
    ko: "라바의 보르누 정복과 쿠세리 전투, 보르누의 분할(1893~1902)"
  summary:
    ko: "라바 아즈주바이르는 수단 상인 주바이르 라마가 이끌던 사병 집단의 장교였다. 1878년 고든 정부에 맞선 반란이 진압되자 서쪽으로 달아나 1879년 부하들에게 지도자로 추대되었고, 남쪽 바르엘가잘에서 서쪽 차드호 일대로 들어와 바기르미를 쳤다. 1892년 마세냐에서 바기르미 왕 고랑 2세를 내쫓고 바기르미와 와다이의 연합군을 무찔렀으며, 1893년 중반 보르누로 들어가 암자와 레카라와 전투에서 이기고 쿠카와를 약탈했다. 라바는 1893년 10월 2일부터 보르누를 다스린다고 선언해 라바 국가를 세웠고 도읍을 쿠카와에서 디크와로 옮겼다. 이로써 800년 넘게 이어진 카넴-보르누 제국의 왕조는 껍데기만 남았다. 프랑스는 알제리에서 출발한 푸로–라미 원정대와 콩고 쪽에서 올라온 젠틸 원정대를 차드호 일대로 보냈고 둘은 그곳에서 합류했으며, 푸로–라미 원정은 「프랑스의 사하라 진출과 알제리 남부 영토(1881~1905)」(앞의 사건)와 이어진다. 1899년 토그바오에서 라바군이 브레토네의 프랑스 소부대를 무찔렀으나, 1900년 4월 22일 차드호 남쪽 쿠세리에서 프랑스 영토 원정대가 보르누와 바기르미 병력의 도움을 받아 라바군을 꺾었고, 라미는 치명상을 입었으며 라바는 달아나다 옛 부하 압둘라이 디알로에게 죽었고, 디알로가 벤 그의 목은 그해 말 파리로 보내졌다고 한다. 라바는 이슬람의 이름을 내세웠으나 노예 사냥과 약탈로 이 일대를 황폐하게 했다고 비판받는다. 아들 파들랄라는 1901년 8월 23일 구지바에서 프랑스군에게 죽었다. 카넴-보르누 제국은 1902년에 끝났고 옛 보르누 땅은 영국령 나이지리아와 독일령 카메룬, 프랑스령 차드로 나뉘었다."
  subjects: [rabih-state, kanem-bornu, french-chad, german-kamerun]
  links:
    - { from: rabih-state, to: kanem-bornu, note: "1893년 쿠카와를 점령해 보르누를 차지함" }
  tags: [war, politics, colonization]
  sources: ["Dennis D. Cordell, Dar al-Kuti and the Last Years of the Trans-Saharan Slave Trade (University of Wisconsin Press, 1985)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 쿠세리, at: [15.03, 12.08], year: 1900 }]

- id: gaza-1895
  year: 1895
  endYear: 1895
  title:
    ko: "포르투갈의 가자 제국 정복(1895)"
  summary:
    ko: "가자 제국은 1820년대 므페카네의 혼란 속에서 소샹가네가 오늘날 모잠비크 가자주 일대 림포포강 유역에 세운 나구니 계통의 나라로, 한때 모잠비크 남부와 짐바브웨 동부에 걸치는 땅을 지배하고 해안의 포르투갈 거점과 교역했다. 가자는 소샹가네 후손 사이의 계승 다툼으로 힘이 약해졌고 한때 포르투갈에 형식상 조공을 바쳤다. 소샹가네(재위 1824~1858)의 손자이자 음질라(재위 1861~1884)의 아들 응궁구냐네는 1884년 즉위해 도읍을 만들라카지 쪽으로 옮겼고, 포르투갈과 영국 사이에서 줄타기를 하며 세력을 지켰고, 1890년대 초에는 영국 빅토리아 여왕에게 보호를 청하는 사절을 보냈다고 전한다. 1890~1891년 영국과 포르투갈이 맺은 경계 조약이 가자 땅을 둘로 갈랐고, 포르투갈은 1894년 특별 판무관 안토니우 에네스를 보내 내륙 지배에 나섰고, 영국과 맺은 조약으로 영국 몫이 된 땅을 뺀 남부의 질서를 되찾겠다는 구실을 내세웠다. 포르투갈군은 1895년 2월 마라쿠에네에서 응궁구냐네의 군대를 꺾었고, 11월 7일 쿠올렐라(코올렐라) 전투에서 가자군을 무찔렀는데, 포르투갈군은 수백 명, 가자군은 수천 명이었다고 전한다. 이어 군인 무지뉴 지 알부케르케가 소수 기병으로 1895년 12월 28일 샤이미테의 도읍에서 응궁구냐네를 사로잡아 가자 제국이 끝났다. 응궁구냐네는 사슬에 묶인 채 리스본으로 끌려가 구경거리가 되었다가 아조레스 제도로 유배되어 1906년 숨졌다. 이 정복은 영국 남아프리카 회사가 마쇼나랜드에서 힘을 키우던 때에 일어나 포르투갈의 모잠비크 남부 지배를 굳혔고, 무지뉴는 포르투갈에서 영웅으로 칭송받았다."
  subjects: [gaza, portuguese-mozambique]
  tags: [war, colonization]
  sources: ["Malyn Newitt, A History of Mozambique (C. Hurst, 1995)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 샤이미테, at: [32.8, -24.2], year: 1895 }]

- id: madagascar-1895
  year: 1895
  endYear: 1897
  title:
    ko: "프랑스의 마다가스카르 정복과 메리나 왕국의 끝(1895~1897)"
  summary:
    ko: "메리나 왕국은 19세기 후반 마다가스카르 고원과 섬 대부분을 다스렸으나 프랑스의 압박을 받았다. 프랑스는 1883~1885년 프랑스–메리나 전쟁을 벌인 끝에 1885년 조약으로 메리나의 외교권과 북부 디에고수아레스 항구에 대한 이권을 얻었으나 이를 보호령으로 굳히려 했다. 총리 라이닐라이아리부니는 여왕 세 명의 남편 겸 총리로 30년 가까이 나라를 이끌며 영국 고문과 근대식 군대로 버티려 했고, 프랑스는 1894년 말 약 1만 5,000명의 원정군을 보내 마장가에 상륙했다. 이 군대는 길이 없어 보급이 막히고 사망자 대부분이 질병으로 죽었다는 설명이 있을 만큼 큰 피해를 입었으나 1895년 9월 30일 안타나나리보를 포격해 함락시켰다. 여왕 라나발로나 3세는 자리에 남았으나 프랑스가 외교권을 가진 보호 체제가 되었고, 총리 라이닐라이아리부니는 1896년 알제로 유배되었다. 1896년 10월 메리나 귀족 일부가 처형되기도 했다. 메날람바('붉은 천을 두른 자들')라 불린 반프랑스 봉기는 선교사와 외국인도 공격 대상으로 삼았으며 1895년 중반 퍼졌고, 1896년 8월 프랑스 의회는 마다가스카르를 식민지로 병합한다고 선포했다. 이 봉기를 진압하러 1896년 9월 조제프 갈리에니가 총독(1905년까지 재임)으로 와서 군사 통치를 폈고, 라나발로나 3세는 1897년 2월 폐위되어 레위니옹을 거쳐 알제리로 유배되었고 1917년 알제에서 숨졌다. 메리나 왕국은 이 폐위로 끝났다. 갈리에니는 노예제 폐지를 선포하고 길을 닦으며 섬 전체의 통치를 확립했다. 이 정복으로 프랑스령 마다가스카르가 성립했고, 20세기 중반까지 프랑스의 식민 통치가 이어진다."
  subjects: [merina-kingdom, french-madagascar, france]
  links:
    - { from: france, to: merina-kingdom, note: "1895년 안타나나리보를 함락하고 1897년 왕정을 폐지함" }
  tags: [war, colonization]
  sources: ["Mervyn Brown, A History of Madagascar (Damien Tunnacliffe, 2000)", "Solofo Randrianja and Stephen Ellis, Madagascar: A Short History (University of Chicago Press, 2009)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 안타나나리보, at: [47.52, -18.91], year: 1895 }]

- id: omdurman-fashoda-1896
  year: 1896
  endYear: 1899
  title:
    ko: "수단 재정복: 옴두르만 전투와 파쇼다 사건, 공동 통치 협정(1896~1899)"
  summary:
    ko: "마흐디 국가는 1885년 마흐디 무함마드 아흐마드가 죽은 뒤 칼리프 압둘라히 아래에서 에티오피아·이집트와 싸우며 버텼으나 1890년대에는 기근과 잇단 패배로 약해졌다. 영국은 1896년 이탈리아가 카살라 일대에서 마흐디군에 밀리자 이를 돕는다는 구실로 이집트군을 앞세운 원정을 결정했다. 사령관 허버트 키치너는 이집트군과 영국군을 이끌고 1896년 동골라를 차지했고, 철도를 놓으며 나일강을 따라 올라가 1897년 8월 7일 아부하메드를 차지했다. 1889년 토스키에서 이집트 침공이 꺾인 뒤 칼리프의 확장은 멈춰 있었다. 1898년 아트바라 전투에서 이기고, 1898년 9월 2일 마흐디 국가의 도읍 옴두르만에서 영국–이집트군 약 2만 5,000명이 나일강 군선의 포격 지원 속에 마흐디군 약 5만 명을 무찔렀으며 마흐디군 쪽 사망은 1만 명 안팎으로 추산한다. 프랑스 탐험대를 이끈 장바티스트 마르샹은 그해 7월 10일 나일 상류 파쇼다에 닿았고, 9월 18~19일 그곳에 온 키치너와 마주쳤다. 두 나라는 외교로 풀어 프랑스 정부가 11월 3일 철수를 명령했으며 1899년 3월 영불 협정으로 경계를 정했다. 1899년 1월 19일 영국과 이집트가 맺은 공동 통치 협정으로 영국-이집트령 수단이 성립했다. 키치너는 마흐디의 무덤을 부수게 했고 옴두르만의 21창기병 연대 돌격에는 젊은 윈스턴 처칠이 참가했다. 칼리프 압둘라히는 1899년 11월 24일 움 디와이카라트에서 전사했다. 에티오피아의 메넬리크 2세도 1897~1898년 이 일대로 세력을 넓혀 수단과의 경계를 마주했다. 영국의 이집트 지배는 「영국의 이집트 지배와 보호국 선포(1883~1914)」(앞의 사건)에 적혀 있다."
  subjects: [mahdist-state, anglo-egyptian-sudan, ethiopia, uk, france]
  links:
    - { from: uk, to: mahdist-state, note: "1898년 옴두르만에서 꺾고 1899년 공동 통치 협정을 맺음" }
  tags: [war, diplomacy, colonization]
  sources: ["Winston S. Churchill, The River War (Longmans, Green, 1899)", "P. M. Holt, The Mahdist State in the Sudan 1881–1898 (Clarendon Press, 2nd ed. 1970)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 옴두르만, at: [32.48, 15.65], year: 1898 }]
