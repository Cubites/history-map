- id: tewodros-1855
  year: 1855
  endYear: 1868
  title:
    ko: "테오도로스 2세와 마그달라 원정(1855~1868)"
  summary:
    ko: "에티오피아는 18세기 중엽부터 황제가 이름뿐이고 지방 영주들이 서로 다투는 '왕들의 시대'를 겪었다. 1855년 2월 11일 군벌 카사 하일루가 데레스게 전투에서 티그라이의 우베를 꺾고 아부나 살라마 3세에게서 황제로 즉위하며 테오도로스 2세를 칭해 이 시대를 끝냈다. 근대 에티오피아의 시작으로 보는 그의 통치에서 테오도로스는 상비군과 월급을 받는 지방관·재판관을 두고 세금을 정비하려 했으나 교회와 지방 영주의 반발에 부딪혔다. 군대를 먹이려 지방에서 거둔 부담이 커지면서 말기에는 곳곳에서 반란이 일어나 곁에 남은 병력이 크게 줄었다고 한다. 1855년 이후 데브레타보르를 중심으로 삼아 몇 해 안에 셰와를 눌렀고 셰와 왕자 사흘레 마리암(훗날 메넬리크 2세)을 마그달라 요새에 가뒀다. 테오도로스는 1862년 영국 빅토리아 여왕에게 보낸 편지에 답이 없자 이를 모욕으로 여겨 영사 찰스 캐머런과 선교사들을 가두었고, 협상하러 온 호르무즈드 라삼 일행도 함께 갇혔다. 선교사 장인들을 부려 대포를 만들게 해 거대한 대포 세바스토폴을 얻기도 했다. 영국은 로버트 네이피어를 사령관으로 인도에서 병력 약 13,000명, 지원 인원을 합쳐 3만 명 넘는 원정군을 보냈고, 이들은 1868년 4월 10일 아로게에서 에티오피아군을 꺾은 뒤 마그달라를 공격했다. 포로는 풀려났고 황후 티루워크는 해안으로 가는 길에 숨졌으며 테오도로스는 4월 중순 요새 안에서 스스로 목숨을 끊었다. 아들 알레마유는 영국으로 가서 1879년 열여덟 살로 죽었다. 영국군은 곧 물러났고 황제 자리는 테클레 기요르기스 2세를 거쳐 요하네스 4세에게 돌아갔다."
  subjects: [ethiopia, uk]
  links:
    - { from: uk, to: ethiopia, note: "1868년 원정군을 보내 마그달라를 공략" }
  tags: [war, politics, diplomacy]
  sources: ["Sven Rubenson, King of Kings: Tewodros of Ethiopia (Haile Selassie I University Press, 1966)", "Harold G. Marcus, A History of Ethiopia (University of California Press, 1994)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 마그달라, at: [39.1, 11.6], year: 1868 }]

- id: turkiyya-sudan-1838
  year: 1838
  endYear: 1879
  title:
    ko: "투르코-이집트 수단의 팽창: 타카·남부·다르푸르(1838~1879)"
  summary:
    ko: "이집트는 1821년 수단을 얻은 뒤 하르툼을 행정 중심으로 삼았고, 알리 쿠르시드 파샤가 1826년부터 1838년까지 총독으로 있는 동안 하르툼은 벽돌집 500여 채가 서는 도시로 컸다. 1838~1839년 무함마드 알리가 직접 수단을 찾았고 곧 백나일을 거슬러 올라가는 원정대를 거듭 보냈다. 1839~1842년 살림 카푸단이 이끈 세 차례 백나일 원정은 오늘날 남수단 줄바 근처까지 닿았으나 늪지대에 막혔다. 1840년에는 홍해 쪽 타카(카살라)가 이집트 영토에 더해졌다. 이 시기 수단에서 노예 무역은 가장 큰 이익을 내는 사업이었고 1860년대에야 서서히 단속되기 시작했다. 1863년 이스마일이 이집트 통치자가 되면서 수단 사업은 다시 힘을 얻었고, 1852년에서 1865년 사이 수단 주둔 이집트군은 약 18,000명에서 27,000명이 넘게 늘었고, 1863년 1월에는 수단 병사 447명이 멕시코로 보내졌다. 1865년 오스만 제국이 홍해 연안과 항구를 이집트에 넘겼으며 1867년 술탄은 이스마일에게 '헤디브' 칭호를 인정했다. 영국인 새뮤얼 베이커(1869~1873년 남부 원정)와 이어 찰스 고든(1874년 적도 지방 총독)이 상나일 남쪽으로 지배를 넓혔고, 1874년에는 상나일·바르엘가잘·적도 지방이 새 주로 편제되었다. 서쪽에서는 상인 주바이르 라마가 사병을 이끌고 바르엘가잘을 장악했고, 1874년 이집트군이 다르푸르 술탄국을 무너뜨려 이 땅을 병합했다. 북동쪽 에티오피아를 노린 1875~1876년 원정은 패배로 끝났다. 이스마일의 채무 문제는 「수에즈 운하와 헤디브 이스마일의 부채(1854~1879)」(뒤의 사건)가 다룬다. 이스마일이 1879년 물러나자 팽창은 멈췄다."
  subjects: [egyptian-sudan, darfur, muhammad-ali-egypt]
  links:
    - { from: egyptian-sudan, to: darfur, note: "1874년 정복해 병합함" }
  tags: [war, politics, slavery]
  sources: ["Richard Hill, Egypt in the Sudan 1820–1881 (Oxford University Press, 1959)", "P. M. Holt and M. W. Daly, A History of the Sudan (Longman, 6th ed. 2011)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: griqualand-diamonds-1867
  year: 1867
  endYear: 1880
  title:
    ko: "킴벌리 다이아몬드와 그리콸란드 웨스트(1867~1880)"
  summary:
    ko: "오렌지강과 바알강이 만나는 곳 가까이에는 그리콰 사람들이 있었다. 이들은 보어인과 코이코이 사람, 노예 후손이 섞여 생긴 집단으로, 케이프 식민지 서쪽에서 북쪽으로 올라와 19세기에 이곳에 자리 잡았다. 1867년 호프타운 부근에서 아이가 주운 반짝이는 돌이 다이아몬드로 밝혀지면서 사정이 바뀌었고, 1869년 오렌지강변에서 발견된 83캐럿의 '남아프리카의 별'이 소문을 키웠고, 곧 바알강 일대와 이른바 콜레스버그 코프예(훗날 킴벌리의 빅 홀)에서 큰 광맥이 발견되어 수만 명이 몰려들었다. 이 땅은 그리콸란드 웨스트의 넓이가 약 4만 제곱킬로미터에 이르렀고, 그리콰의 지도자 니콜라스 워터보어, 오라녀 자유국, 트란스발 공화국, 인근 츠와나 추장들이 서로 자기 땅이라 주장하던 곳이었다. 킴벌리라는 이름은 1873년 영국 식민장관 킴벌리 경에서 땄다. 워터보어는 영국의 보호를 청했다고 한다. 영국은 1871년 10월 27일 이곳을 영국령으로 선포했고 케이프 식민지와 따로 그리콸란드 웨스트라 불렀으며, 1873년 왕령 식민지로 삼았다. 오라녀 자유국은 영국과 오래 다툰 끝에 1876년 보상금 9만 파운드를 받고 요구를 접었다고 한다. 1872년 책임 정부를 얻은 케이프 식민지는 1877년 이 땅의 병합 법을 의결했고 1880년 10월 18일 합병이 발효되어 그리콸란드 웨스트는 식민지 서부 주가 되었다. 광산촌에는 아프리카인 노동자가 주로 기숙사에서 계약으로 일했고, 1880년대에는 세실 로즈의 디비어스 회사가 광산 대부분을 사들여 독점을 굳혔다. 이 광물 수입은 훗날 비트바테르스란트 금광과 함께 남아프리카 산업화의 밑거름이 되었다."
  subjects: [griqualand-west, cape-colony, orange-free-state]
  links:
    - { from: cape-colony, to: griqualand-west, note: "1880년 합병함" }
  tags: [trade, colonization, politics]
  sources: ["William H. Worger, South Africa's City of Diamonds: Mine Workers and Monopoly Capitalism in Kimberley, 1867–1895 (Yale University Press, 1987)", "Leonard Thompson, A History of South Africa (Yale University Press, 4th ed. 2014)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 킴벌리, at: [24.76, -28.74], year: 1871 }]

- id: yohannes-menelik-1872
  year: 1872
  endYear: 1889
  title:
    ko: "요하네스 4세와 메넬리크: 에티오피아의 통일과 팽창(1872~1889)"
  summary:
    ko: "테오도로스 2세가 죽은 뒤 테클레 기요르기스 2세(1868~1871)가 황제가 되었으나, 티그라이의 영주 카사 메르차가 영국의 마그달라 원정을 도운 대가로 얻은 무기로 힘을 키워 1871년 7월 11일 그를 아드와에서 꺾고 요하네스 4세로 즉위했고, 1872년 1월 악숨에서 대관식을 치렀다. 같은 무렵 남쪽 셰와에서는 테오도로스에게 붙잡혔던 사흘레 마리암이 탈출해 1866년 셰와의 왕이 되어 메넬리크라는 이름으로 힘을 길렀다. 요하네스는 이집트의 이스마일이 홍해 연안에서 고원으로 밀고 들어오자 1875년 11월 군데트, 1876년 3월 구라에서 이집트군을 물리쳤다. 1878년 보루메다 회의에서 요하네스는 이슬람 신자에게 기독교로 개종하라고 요구했다고 한다. 1878년 3월 20일 메넬리크가 요하네스에게 복속하자 요하네스는 그를 셰와의 왕으로 인정하고 3월 26일 다시 즉위시켰다. 1879년부터 1884년까지 메넬리크는 남쪽과 서쪽 오로모 땅으로 첫 원정을 벌였고, 1881년 요하네스는 테클레 하이마노트를 고잠과 카파의 왕으로 세웠다. 1885년 이탈리아가 홍해 항구 마사와를 차지하면서 요하네스는 북쪽 해안에서 새 적을 맞았고 1887년 1월 도갈리에서 에티오피아군이 이탈리아 증원대 400여 명을 죽였다고 한다. 메넬리크가 차지한 오로모 땅의 상아와 커피, 노예 교역은 그의 재정과 소총 수입을 뒷받침했다. 메넬리크는 1886년 아르시 땅을 복속시키고 아디스아바바를 도읍으로 삼았으며 1887년 1월 6일 첼렝코 전투에서 이겨 하라르 이슬람 토후국을 병합했다. 정교회의 수호자를 자처한 요하네스는 1889년 3월 마흐디 국가 군대와 싸우다 메템마에서 전사했고, 메넬리크가 황제 자리를 잇는다."
  subjects: [ethiopia]
  tags: [war, politics]
  sources: ["Harold G. Marcus, The Life and Times of Menelik II: Ethiopia 1844–1913 (Clarendon Press, 1975)", "Zewde Gebre-Sellassie, Yohannes IV of Ethiopia: A Political Biography (Clarendon Press, 1975)", "Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed. 2001)"]

- id: transvaal-1877
  year: 1877
  endYear: 1881
  title:
    ko: "영국의 트란스발 병합과 제1차 보어 전쟁(1877~1881)"
  summary:
    ko: "트란스발 공화국은 1870년대에 재정이 바닥나고 북동쪽 페디 왕국의 세쿠쿠네와의 전쟁에서 이기지 못해 흔들렸다. 영국은 이를 틈타 남아프리카를 영국 주도의 연방으로 묶으려던 구상에 따라, 원주민 담당관이던 셰프스톤을 보내 1877년 4월 12일 프리토리아 교회 광장에서 트란스발 병합을 선포했다. 병합 직후 영국군은 1879년 세쿠쿠네의 페디 요새를 치고 줄루 왕국과도 싸웠다. 보어인은 처음에는 외교로 맞섰으나 병합 뒤 세금과 영국 관리의 간섭에 반발했고, 폴 크뤼거와 프레토리위스, 요우베르트 세 사람이 이끌었다. 1880년 11월 피트 베자위덴하우트의 마차를 세금 때문에 압류하려던 일이 무장 충돌로 번졌고, 12월 파르데크라알 집회에서 보어인은 공화국 복원을 선언했다. 1880년 12월 16일 포체프스트룸에서 총성이 오가며 전쟁이 시작되었고, 12월 20일 브론크호르스트스프라위트에서 보어 저격병이 영국 종대를 매복해 영국군 56명이 죽었다. 영국군은 1881년 1월 28일 라잉스 넥에서, 2월 8일 스하윈스회흐터에서 밀렸고, 2월 27일 마주바 언덕에서 사령관 조지 콜리가 전사하는 대패를 당했다. 영국 총리 글래드스턴은 더 싸우기를 마다하고 1881년 3월 6일 휴전, 23일 평화 조약에 이르렀으며, 8월 3일 프리토리아 협약으로 트란스발은 영국의 종주권 아래 자치를 되찾았고 협약은 10월 25일 트란스발 의회가 비준했다. 전쟁 전체에서 영국군 사망은 409명, 보어 쪽은 43명으로 알려진다. 1884년 런던 협약은 종주권이란 말을 걷어 내고 외교만 영국이 통제하는 독립을 보장했고, 공식 이름은 남아프리카 공화국이 되었다."
  subjects: [transvaal-territory, south-african-republic, uk]
  links:
