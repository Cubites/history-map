  sources: ["Leonard Thompson, A History of South Africa (Yale University Press, 4th ed. 2014)", "Thomas Pakenham, The Boer War (Weidenfeld & Nicolson, 1979)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
