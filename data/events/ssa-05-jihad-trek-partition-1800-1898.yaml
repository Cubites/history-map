- id: sokoto-jihad-1804
  year: 1804
  endYear: 1837
  title:
    ko: "우스만 단 포디오의 지하드와 소코토 칼리프국(1804~1837)"
  summary:
    ko: "하우사어를 쓰는 여러 도시 국가가 늘어선 서아프리카 내륙에서, 풀라니 출신 이슬람 학자 우스만 단 포디오는 18세기 말부터 고비르 왕국 안에서 설교를 하며 추종자를 모았다. 우스만이 추종자를 이끌고 구두로 옮겨 가 신자들의 공동체를 세우자 고비르의 왕 윤파가 1804년 2월 21일 그와 추종자를 치겠다고 선포했고, 이 충돌이 지하드의 시작이자 소코토 칼리프국의 성립으로 꼽힌다. 전쟁은 풀라니 목축민과 억눌린 하우사 농민을 끌어들여 번졌고, 1808년 고비르의 도읍 알칼라와가 함락되어 윤파가 전사했다. 우스만은 각지에 깃발을 내려 에미르를 임명했고, 이 깃발 체제가 칼리프국의 지방 통치 틀이 되었다. 동쪽 보르누에서는 풀라니군이 1808년 도읍을 불태웠으나 이슬람 학자 무함마드 알아민 알카네미가 이를 막아 냈고, 그는 훗날 보르누의 실권자가 되었다. 알카네미는 무함마드 벨로와 편지를 주고받으며 같은 무슬림 나라인 보르누를 칠 명분이 없다고 따졌다. 카노·카치나·자자우(지금 자리아) 같은 하우사 도시 국가들은 풀라니 에미르가 다스리는 에미르국으로 바뀌었다. 우스만은 1817년 4월 숨을 거두었고, 영토는 둘로 나뉘어 동쪽은 아들 무함마드 벨로가 칼리프로서 소코토에서 다스렸으며 서쪽 귀완두는 동생 압둘라히가 맡았다. 벨로는 지하드의 정당성을 밝히는 글을 여럿 남긴 학자이기도 했다. 무함마드 벨로는 1809년 무렵 소코토를 세웠고 1837년 숨질 때까지 재위하면서 에미르국을 정비하고 반란을 눌렀다. 같은 무렵 북부 요루바의 일로린은 풀라니와 손잡은 세력이 차지해 에미르국이 되었고, 이것이 오요 제국 무너짐의 한 갈래가 되었다. 벨로 뒤로는 아부바카르 아티쿠가 칼리프가 되었다. 칼리프국은 19세기 중엽 서쪽 니제르강 굽이에서 동쪽 아다마와 고원까지 수십 개 에미르국을 거느린 큰 나라였다."
  subjects: [sokoto-caliphate, kanem-bornu, oyo-empire]
  links:
    - { from: sokoto-caliphate, to: kanem-bornu, note: "1808년 보르누 도읍을 공격했으나 알카네미가 막아 냄" }
  tags: [war, religion, politics]
  sources: ["Murray Last, The Sokoto Caliphate (Longmans, 1967)", "Mervyn Hiskett, The Sword of Truth: The Life and Times of the Shehu Usuman dan Fodio (Oxford University Press, 1973)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
