- id: bsac-rhodesia-1889
  year: 1889
  endYear: 1893
  title:
    ko: "영국 남아프리카 회사의 마쇼나랜드 점령과 니아살랜드, 마타벨레 전쟁(1889~1893)"
  summary:
    ko: "세실 로즈는 1888년 은데벨레 왕 로벵굴라에게서 광산 이권(러드 이권)을 받아 낸 것을 바탕으로 영국 정부에 특허를 청해 1889년 12월 영국 남아프리카 회사의 칙허가 발효되도록 했다. 러드 이권은 매달 100파운드와 소총 1,000정 등을 대가로 광물권을 주는 내용이었는데, 로벵굴라는 자기 뜻과 다르다고 주장했다. 1890년 개척대 약 200명과 호송 경찰 500명 안팎이 은데벨레 땅 북동쪽 마쇼나랜드로 올라가 솔즈베리(지금 하라레) 요새를 세웠고, 이 땅은 훗날 남로디지아가 된다. 요새 이름은 당시 영국 총리 솔즈베리 후작에서 땄다. 1890년 7월 1일 영국과 독일이 맺은 헬골란트–잔지바르 조약은 독일령 남서아프리카의 카프리비 회랑과 독일령 동아프리카의 경계를 정했다. 1891년 5월 9일 영국은 마쇼날랜드 보호령 칙령을 내렸고, 같은 해 해리 존스턴이 오늘날 말라위의 영국령 중앙아프리카 보호령(훗날 니아살랜드)을 선포해 시레 고원을 지켰다. 1893년 7월 회사가 마쇼나 족장을 징벌한다며 은데벨레 전사들이 쫓아온 사건을 구실로 일으킨 충돌이 확대되어 마타벨레 전쟁이 터졌다. 약 700명의 원정대는 맥심 기관총 다섯 정으로 샹가니강과 벰베지에서 은데벨레 군대를 크게 쳤고, 로벵굴라는 도읍 불라와요를 불태운 채 달아났다. 1893년 12월 앨런 윌슨의 척후대 34명이 강물이 불어난 사이 고립되어 거의 전멸했고, 로벵굴라는 1894년 1월 천연두로 숨져 은데벨레 왕국은 1893년을 끝으로 회사의 통치에 편입되었다. 이 땅은 1895년 세실 로즈의 이름을 딴 로디지아라는 이름을 얻었고, 회사의 통치는 1920년대 초까지 이어졌다. 1895년 12월 29일에는 회사 행정관 리앤더 스타 제임슨이 회사 경찰 등 500~600명을 이끌고 트란스발로 쳐들어갔다가 1896년 1월 2일 항복했고(제임슨 습격), 이 일로 로즈는 1896년 케이프 총리에서 물러났다."
  subjects: [bsac-southern-rhodesia, nyasaland, ndebele-kingdom, german-south-west-africa, german-east-africa]
  links:
    - { from: bsac-southern-rhodesia, to: ndebele-kingdom, note: "1893년 전쟁에서 꺾어 영토를 차지함" }
  tags: [colonization, war]
  sources: ["Terence Ranger, Revolt in Southern Rhodesia 1896–97 (Heinemann, 1967)", "Robert I. Rotberg, The Founder: Cecil Rhodes and the Pursuit of Power (Oxford University Press, 1988)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 불라와요, at: [28.58, -20.15], year: 1893 }]

- id: ucciale-adwa-1889
  year: 1889
  endYear: 1896
  title:
    ko: "우찰레 조약과 이탈리아령 에리트레아, 아두와 전투(1889~1896)"
  summary:
    ko: "이탈리아는 1869년 해운 회사가 홍해 연안의 아사브를 사들인 데서 출발해 1882년 아사브를 정부 관할로 인수했고 1885년 마사와를 차지했다. 에티오피아의 요하네스 4세가 1889년 3월 죽자 새 황제가 된 메넬리크 2세는 1889년 5월 2일 이탈리아와 우찰레 조약을 맺었다. 이탈리아어 본과 암하라어 본의 17조가 달라, 이탈리아는 에티오피아가 외교에서 이탈리아의 중개를 거친다고 해석해 보호령으로 주장한 반면 메넬리크는 '할 수 있다'는 뜻으로 읽어 1893년 조약을 폐기했다. 이탈리아는 이 조약으로 에티오피아를 보호령으로 삼았다고 열강에 통보했다. 이탈리아는 1890년 1월 1일 홍해 연안 영토를 이탈리아령 에리트레아로 선포하고 아스마라를 향해 올라갔으며, 이탈리아령 소말리아 쪽에서도 1893년 메르카와 모가디슈를 차지했다. 1895년 12월 7일 암바 알라기에서 이탈리아 분견대가 패했고 1896년 1월 메켈레 요새도 빼앗겼다. 사령관 오레스테 바라티에리는 정부의 압박을 받고 진격했고, 지도가 부정확해 부대들이 길을 잃고 흩어졌다는 설명도 있다. 1896년 3월 1일 아두와에서 에티오피아군 7만 3,000~10만 명이 이탈리아군 약 1만 4,500~1만 7,800명을 쳐서 이탈리아 쪽이 약 6,000명 전사, 약 3,800명 포로라는 큰 피해를 입었다. 이탈리아 쪽 사령관 바라티에리는 살아남았으나 장군 다보르미다와 아리몬디는 전사하고 알베르토네는 포로가 되었다. 에티오피아군은 황후 타이투 베툴과 라스 마코넨이 이끌었다. 총리 프란체스코 크리스피의 정부가 무너졌고 1896년 10월 아디스아바바 조약으로 이탈리아는 에티오피아의 독립을 인정했으나 에리트레아는 계속 가졌다."
  subjects: [italian-eritrea, ethiopia, italy, italian-somaliland]
  tags: [war, diplomacy, colonization]
  sources: ["Harold G. Marcus, The Life and Times of Menelik II: Ethiopia 1844–1913 (Clarendon Press, 1975)", "Richard Caulk, 'Between the Jaws of Hyenas': A Diplomatic History of Ethiopia 1876–1896 (Harrassowitz, 2002)", "Bahru Zewde, A History of Modern Ethiopia, 1855–1991 (James Currey, 2nd ed. 2001)"]
  places: [{ name: 아두와, at: [38.9, 14.17], year: 1896 }]

- id: oil-rivers-niger-company-1884
  year: 1884
  endYear: 1897
  title:
    ko: "오일 리버스 보호령과 왕립 니제르 회사, 베닌 원정(1884~1897)"
  summary:
    ko: "니제르강 삼각주는 19세기 중반까지 야자유를 사 가는 영국 상인과 현지 항구 도시 국가들이 맞물려 교역하던 곳으로, 영국은 이 일대를 '오일 리버스'라 불렀다. 1884년 영국 영사 에드워드 휴잇이 삼각주의 여러 추장과 보호 조약을 맺었고, 이 땅은 오일 리버스 보호령으로 선포되었으며 훗날 남나이지리아 보호령이 된다. 영국은 이 땅에서 사실상 통치자 구실을 했다. 1893년에는 이름을 니제르 코스트 보호령으로 바꾸었다. 삼각주에는 보니·브라스·칼라바르·오포보 같은 도시 국가가 있었고 상인 왕들이 야자유 교역을 쥐었다. 한편 사업가 조지 골디는 1884년 프랑스 상사를 사들이는 등 영국 회사들을 합쳐 니제르강 하류와 중류의 교역을 쥐었고, 이 회사는 1886년 영국 왕실의 칙허를 얻어 왕립 니제르 회사가 되어 베를린 회의 이후 니제르강의 통상과 행정을 맡았다. 회사는 북쪽 소코토 칼리프국의 추장들과도 조약을 맺었다고 주장했고 1895년 1월 삼각주 서쪽 아카사의 회사 창고가 현지 주민의 습격을 받는 등 반발도 있었다. 삼각주의 강한 상인 왕 자자는 1887년 영국에 잡혀 서인도 제도로 유배되었다. 1897년 1월 회사는 소코토 칼리프국에 속하던 비다와 일로린을 공격해 차지했다. 같은 해 1월 영국 부영사 필립스 일행이 베닌 왕국 수도로 가다 학살되자, 영국은 1897년 2월 원정군으로 베닌시티를 불태우고 오바 오본라므웬을 폐위해 칼라바르로 유배했으며 궁정의 청동 조각을 가져갔다. 이 일로 베닌 왕국은 사라졌고 회사의 통치는 1900년 영국 정부에 넘어간다. 서쪽 라고스 식민지와 이어진 이 땅의 보호령 체제가 굳어졌다."
  subjects: [southern-nigeria-protectorate, royal-niger-company, benin-kingdom, sokoto-caliphate, lagos-colony, uk]
  links:
    - { from: uk, to: benin-kingdom, note: "1897년 원정군을 보내 베닌시티를 점령하고 오바를 폐위함" }
  tags: [colonization, trade, war]
  sources: ["John E. Flint, Sir George Goldie and the Making of Nigeria (Oxford University Press, 1960)", "A. G. Hopkins, An Economic History of West Africa (Longman, 1973)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 베닌시티, at: [5.63, 6.34], year: 1897 }]

- id: barotseland-1890
  year: 1890
  endYear: 1899
  title:
    ko: "레와니카의 로지 왕국과 바로체랜드 보호령(1890~1899)"
  summary:
    ko: "잠베지강 상류의 범람원에 자리 잡은 로지 왕국은 콜롤로의 지배를 1864년 벗어난 뒤 내분을 겪었다. 레와니카는 1878년 왕위에 올랐다가 1884년 쫓겨났고 1885년 되찾았으며, 이웃 은데벨레와 포르투갈, 보어인에 둘러싸인 상황에서 영국 선교사와 상인의 도움으로 나라를 지키려 했다. 1890년 6월 영국 남아프리카 회사의 대리인 프랭크 로크너가 레와니카와 이권 조약을 맺어 광물권과 교역권을 회사에 넘기게 했고, 레와니카는 해마다 2,000파운드를 받고 이를 영국 왕실의 보호를 얻는 수단으로 이해했다. 왕국은 해마다 홍수철에 왕이 고지대 별궁으로 옮겨 가는 쿠옴보카 의례로 이름났다. 1891년 영국–포르투갈 조약은 로지 왕국 서쪽 경계를 분명히 하지 못했다. 1897년 회사의 대표 로버트 코린던이 왕궁이 있던 레알루이에 주재하면서 회사의 통제가 커졌고, 1899년 11월 28일 추밀원령이 이 땅을 회사의 행정 아래 두는 법적 틀을 만들었다. 이때부터 로지 왕국은 바로체랜드 보호령이라 불렸고, 영국 남아프리카 회사령 북로디지아의 한 부분이 되었다. 1899년 칙령 뒤 회사는 북서부와 북동부를 따로 다스리다 1911년 합쳐 북로디지아로 삼는다. 로지 왕국은 왕과 귀족 회의, 관직 위계를 갖춘 나라였고 노예제도 있었다. 레와니카는 1900년 이권을 다시 맺어 1902년 에드워드 7세 대관식에도 참석했고 연금과 지방 자치를 인정받았다. 서쪽 경계는 훗날 1905년 이탈리아 국왕의 중재로 앙골라와 나뉘었다. 이 보호 체제 덕분에 로지 왕국은 이름과 왕위를 이어 가는 간접 통치의 모범이 되었으나, 회사에게 광물과 노동력을 내주고 말았다."
  subjects: [lozi-kingdom, bsac-northern-rhodesia]
  links:
    - { from: bsac-northern-rhodesia, to: lozi-kingdom, note: "1890년 이권 조약 뒤 1899년 보호령 체제로 편입" }
  tags: [colonization, diplomacy]
  sources: ["Gerald L. Caplan, The Elites of Barotseland 1878–1969 (C. Hurst, 1970)", "Mutumba Mainga, Bulozi under the Luyana Kings (Longman, 1973)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]

- id: dahomey-war-1890
  year: 1890
  endYear: 1894
  title:
    ko: "프랑스–다호메이 전쟁과 다호메이 왕국의 끝(1890~1894)"
  summary:
    ko: "다호메이 왕국은 게조(재위 1818~1858)와 글렐레(1858~1889) 때를 거치며 17세기 이래 아보메를 도읍으로 노예 무역과 야자유를 다루며 이웃 나라들을 무찌른 군사 국가로, 여자 전사 부대로 유명했다. 다호메이는 1727년 해안의 와이다를 정복해 노예 무역 항구를 쥐었으나, 프랑스는 1863년부터 포르토노보를 보호했고 1868년 글렐레에게서 코토누에 대한 권리를 얻었다고 주장했다. 이 두 해안 땅을 두고 프랑스와 맞서면서 충돌이 시작되었다. 베한진은 1889년 글렐레 왕이 죽은 뒤 왕위를 이었고 독일제 소총으로 군대를 무장시켰으며, 프랑스가 1890년 코토누와 포르토노보를 보호하자 이를 실력으로 막으려 했다. 1890년의 제1차 전쟁은 코토누 일대의 전투와 휴전 조약으로 끝났고, 프랑스는 코토누를 지키며 다호메이에 해마다 돈을 내기로 했다. 그러나 조약은 곧 깨졌고 1892년 제2차 전쟁이 터졌다. 알프레드 도즈 대령이 이끈 프랑스군은 세네갈 병사들과 함께 1892년 11월 아보메로 진격해 도읍을 차지했고, 베한진은 도읍에 불을 지르고 북쪽으로 물러나 1894년 1월 항복했다. 프랑스는 그를 마르티니크로 유배했고 뒤에 알제리로 옮겼으며, 아고리아그보를 이름뿐인 왕으로 세워 1900년까지 두었다. 프랑스군이 아마조네스라 부른 다호메이의 여성 부대는 수천 명이라 전하며 이 전쟁에서 큰 피해를 입었다. 다호메이 왕국은 이로써 끝났고, 프랑스는 1894년 이 땅을 프랑스령 다호메이로 묶었다. 이 땅은 훗날 다호메이 공화국을 거쳐 1975년 베냉이 된다. 베한진은 1906년 12월 10일 유배지 알제에서 숨졌다."
  subjects: [dahomey, french-dahomey, france]
  links:
