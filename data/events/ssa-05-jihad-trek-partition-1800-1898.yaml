  sources: ["Mutumba Mainga, Bulozi under the Luyana Kings (Longman, 1973)", "Gwyn Prins, The Hidden Hippopotamus: Reappraisal in African History (Cambridge University Press, 1980)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: xhosa-kaffraria-1846
  year: 1846
  endYear: 1866
  title:
    ko: "도끼 전쟁과 소 죽이기, 영국령 카프라리아(1846~1866)"
  summary:
    ko: "케이프 식민지 동쪽 변경에서 영국군과 코사 사람은 소와 땅을 두고 18세기 말부터 되풀이해 싸웠고, 1846~1847년 제7차 변경 전쟁(아마톨라 전쟁, 도끼 전쟁이라고도 부른다)은 한 코사 사람이 훔친 도끼를 두고 일어난 충돌로 번졌다. 전쟁은 케이강을 건너 코사 땅 깊이까지 이어졌고 1847년 12월 17일 총독 해리 스미스는 키스카마강과 케이강 사이를 영국령 카프라리아로 병합했다. 스미스는 스스로 코사 추장들의 대추장을 자처했고, 이곳 앞 꼴은 1835년 영국이 잠깐 병합했다가 거둔 퀸애들레이드 주였다. 도읍은 킹윌리엄스타운이었고 추장들은 영국 지방관의 감독을 받았다. 1850~1853년 예언자 음란제니와 추장 산딜레 등이 일으킨 제8차 변경 전쟁(음란제니 전쟁)이 터져 영국군과 코사 사이의 싸움은 몇 해 더 이어졌다. 1856년 농콰우세라는 젊은 여자가 조상의 영이 나타나 소를 죽이고 곡식을 버리면 영국 침입자가 바다로 사라지고 가축과 곡식이 되돌아온다고 말했다고 전한다. 숙부 음할라카자가 이를 퍼뜨렸고 코사 사람들은 1856~1857년 소를 수십만 마리 죽였으며 약속한 날에는 아무 일도 일어나지 않았다. 굶주림으로 수만 명이 목숨을 잃었다고 하며 숫자는 추산마다 다르고, 살아남은 많은 이가 식민지로 일하러 떠났다. 영국은 1858~1859년 독일계 이민자를 정착시켰고, 카프라리아의 인구는 1858년 5만 2,535명이었다. 케이프 총독 조지 그레이는 이 위기를 틈타 추장의 힘을 줄이고 이 땅을 식민지의 노동력 공급지로 삼으려 했다는 평가가 있다. 카프라리아는 1866년 4월 17일 케이프 식민지에 다시 합쳐졌다."
  subjects: [british-kaffraria, cape-colony]
  links:
    - { from: cape-colony, to: british-kaffraria, note: "1866년 영국령 카프라리아를 다시 합침" }
  tags: [war, society, colonization]
  sources: ["J. B. Peires, The Dead Will Arise: Nongqawuse and the Great Xhosa Cattle-Killing Movement of 1856–7 (Ravan Press, 1989)", "Noel Mostert, Frontiers: The Epic of South Africa's Creation and the Tragedy of the Xhosa People (Knopf, 1992)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 킹윌리엄스타운, at: [27.39, -32.88], year: 1847 }]

- id: boer-republics-1848
  year: 1848
  endYear: 1854
  title:
    ko: "오렌지강 주권령과 두 보어 공화국의 승인(1848~1854)"
  summary:
    ko: "그레이트 트렉으로 오렌지강과 바알강 사이 고원에 보어인 농민이 흩어져 살게 되자, 케이프 총독 해리 스미스는 1848년 2월 이 땅을 오렌지강 주권령으로 선포해 영국 주권 아래 두었다. 상주 대표 헨리 더글러스 워든은 블룸폰테인(워든이 1846년 세운 영국 요새 마을)을 도읍으로 삼았고, 1848년 8월 29일 안드리스 프레토리위스가 이끈 보어인이 부머플라츠에서 영국군과 맞붙었으나 패해 바알강 북쪽으로 물러났다. 그러나 주권령 관리는 병력이 모자라 소토족 추장 모쇼에쇼에와 그 이웃 집단의 싸움을 다스리지 못했고, 모쇼에쇼에는 1851년 프레토리위스를 불러들여 영국에 맞서도록 도왔다. 1852년 6월 유럽인 주민 대회는 영국 통치 유지에 찬성했으나 영국은 이미 이 땅을 포기하기로 정한 뒤였고, 유지 비용도 부담이었다. 영국은 이 땅에 얽매이기를 포기하고 1852년 1월 17일 샌드강 협약으로 바알강 이북 보어인의 독립을 인정했다. 이것이 트란스발 공화국(남아프리카 공화국)의 성립으로 꼽힌다. 오렌지강 주권령은 특별 판무관 조지 러셀 클러크가 파견되어 마련한 협상 끝에 1854년 1월 30일 여왕이 '모든 지배권을 버리고 포기한다'는 선언을 내렸고, 1854년 2월 23일 블룸폰테인 협약으로 독립이 승인되어 오라녀 자유국이 되었다. 오라녀 자유국의 초대 대통령은 협상 위원회를 이끈 호프만이 맡았고 이어 보스호프가 뒤를 이었다. 트란스발 쪽에서는 안드리스 프레토리위스가 1853년 숨지고 아들 마르타누스 베셀 프레토리위스가 1857년 대통령이 되었다. 두 공화국은 영국 식민지 밖에서 농장과 사냥, 흑인 이웃과의 관계를 스스로 정해 나갔다."
  subjects: [orange-river-sovereignty, south-african-republic, orange-free-state, uk]
  links:
    - { from: uk, to: south-african-republic, note: "1852년 샌드강 협약으로 독립을 인정" }
    - { from: uk, to: orange-free-state, note: "1854년 블룸폰테인 협약으로 독립을 인정" }
  tags: [politics, diplomacy, migration]
  sources: ["Leonard Thompson, A History of South Africa (Yale University Press, 4th ed. 2014)", "T. R. H. Davenport and Christopher Saunders, South Africa: A Modern History (Macmillan, 5th ed. 2000)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: french-congo-1849
  year: 1849
  endYear: 1886
  title:
    ko: "리브르빌에서 브라자까지: 프랑스령 콩고의 성립(1849~1886)"
  summary:
    ko: "프랑스는 기니만 안쪽 가봉 하구에서 1839년과 1841년 현지 음퐁궤 추장들과 조약을 맺고 해안 거점을 얻었다고 전한다. 1849년 프랑스 해군은 노예선에서 풀려난 사람들을 하구의 한 곳에 정착시켰고 이곳이 리브르빌('자유의 도시')이 되었다. 이 거점은 노예 무역 단속을 이유로 한 프랑스 해군 기지이자 교역 거점이었으나 내륙 개척은 느렸다. 상황을 바꾼 것은 이탈리아 출신 프랑스 해군 장교 피에르 사보르냥 드 브라자가 1875년부터 오고웨강 일대를 탐사한 일이었다. 같은 무렵 헨리 모턴 스탠리가 레오폴드 2세의 후원으로 콩고강 하류를 개척하자 프랑스는 경쟁에 뛰어들었고, 브라자는 1880년 9월 10일 콩고강 북안 스탕리풀 건너편 평원에서 바테케 사람들의 왕 일루 1세(마코코)와 보호 조약을 맺었다. 일루 1세는 1892년에 숨졌고, 왕비 응갈리푸루는 조약 뒤에도 프랑스와의 관계를 이어 갔다고 전한다. 스탠리는 같은 강 남안에 레오폴드빌(지금 킨샤사)을 세워 두 도시가 강을 사이에 두고 마주 보게 되었다. 프랑스는 1882년 11월 30일 이 조약을 비준하며 프랑스령 콩고를 공식으로 세웠다. 도시는 브라자의 이름을 따 브라자빌이라 불렸고, 리브르빌과 브라자빌은 오늘날 각각 가봉과 콩고 공화국의 수도이다. 1884~1885년 베를린 회의는 프랑스의 콩고강 북안 지배를 인정하고 콩고 자유국과 경계를 짓게 했고, 이후 10년 동안 앙골라의 카빈다·카메룬·콩고 자유국과 경계 조약이 이어졌으며 1891년 가봉이 공식으로 더해졌다. 1886년 브라자는 프랑스령 가봉과 콩고를 아우르는 식민지의 총판무관에 올랐다. 프랑스령 콩고는 훗날 프랑스령 적도 아프리카의 한 축이 된다."
  subjects: [french-congo, france]
  links:
    - { from: france, to: french-congo, note: "1880년 마코코 조약을 맺고 1882년 비준해 식민지로 삼음" }
  tags: [colonization, diplomacy]
  sources: ["Thomas Pakenham, The Scramble for Africa (Weidenfeld & Nicolson, 1991)", "Henri Brunschwig, Brazza explorateur (Mouton, 1966)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 브라자빌, at: [15.28, -4.27], year: 1880 }]

- id: lagos-1851
  year: 1851
  endYear: 1861
  title:
    ko: "영국의 라고스 개입과 라고스 식민지(1851~1861)"
  summary:
    ko: "라고스는 요루바 땅 남서쪽 석호 연안의 섬 도시로, 바다 쪽 사주를 넘으면 석호 안에서 내륙 물길과 이어지는 곳이었고, 19세기 중엽까지 노예 무역의 큰 항구였으며 다른 한편으로 야자유 무역이 자라고 있었다. 오바 자리를 두고 코소코와 삼촌 아키토예가 다투다가 코소코가 1845년 무렵 아키토예를 쫓아내자 아키토예는 영국 선교사와 영사 존 비크로프트의 도움을 청했다. 영국은 1851년 12월 해군을 보내 라고스를 포격해 코소코를 폐위하고 아키토예를 앉혔으며, 1852년 1월 1일 영국–라고스 조약으로 노예 무역을 불법으로 만들었다. 코소코는 달아나 이웃 에페에서 힘을 기르며 복귀를 노렸으나 1853년 라고스를 되찾으려던 시도는 실패했다. 아키토예는 1853년 숨졌고 아들 도숨무가 뒤를 이었다. 1861년 8월 6일 영국은 군함 프로메테우스호의 함장 베딩필드가 대리 영사 윌리엄 매코스크리와 함께 도숨무를 압박해 11일 동안 버티던 그를 설득해 라고스 할양 조약에 서명하게 했고, 영국은 이로써 라고스를 병합했다. 병합 전 라고스에는 영국 상인과 선교사 외에 시에라리온과 브라질에서 돌아온 해방 노예의 후손들이 섞여 살았다고 전한다. 영국은 병합의 까닭으로 노예 무역을 뿌리 뽑고 야자유 같은 합법 교역을 키운다는 점을 내세웠다. 식민지는 1862년 3월 5일 공식으로 선포되었고 정식 초대 총독은 헨리 스탠호프 프리먼(재임 1862년 1월 22일~1865년 4월)이었고, 그 앞에 대리 영사 매코스크리가 1861년 8월~1862년 1월 임시로 맡았다. 라고스 식민지는 1886년 독립 식민지가 되기까지 시에라리온과 골드코스트에 딸려 있었으며 1906년 남나이지리아 보호령과 합쳐지며, 1914년 1월 나이지리아 보호령의 수도가 된다."
  subjects: [lagos-colony, uk]
  links:
    - { from: uk, to: lagos-colony, note: "1861년 도숨무에게서 할양받아 식민지로 삼음" }
  tags: [colonization, trade, slavery]
  sources: ["A. B. Aderibigbe (ed.), Lagos: The Development of an African City (Longman Nigeria, 1975)", "Kristin Mann, Slavery and the Birth of an African City: Lagos, 1760–1900 (Indiana University Press, 2007)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 라고스, at: [3.39, 6.45], year: 1851 }]

- id: umar-tal-1852
  year: 1852
  endYear: 1893
  title:
    ko: "알하지 우마르 탈의 투쿨로르 제국과 프랑스의 정복(1852~1893)"
  summary:
    ko: "푸타토로 출신 이슬람 학자 알하지 우마르 탈은 1830년 메카 순례에서 돌아와 티자니야 교단의 칼리프 칭호를 받았고, 1840년대에 푸타잘롱으로 옮겨 무장 활동을 준비했다. 그는 1851년 딩기라예에 근거지를 세웠으며 1852년 9월 탐바의 왕 얌비가 공격해 오자 이를 물리치고 이것이 지하드의 시작이 되었다. 1855년 4월에는 카르타 왕국의 도읍 니오로를 차지해 중심지로 삼았다. 그는 세네갈강 상류 메디나의 프랑스 요새를 1857년 7월 18일 포위했으나 총독 루이 페데르브가 구원군을 데리고 와 실패했다. 1860년 프랑스와 맺은 합의에서 프랑스는 우마르가 세네갈강 동쪽의 카르타와 세구 땅을 차지하는 것을 인정했다. 우마르는 이교도 밤바라 왕국뿐 아니라 같은 무슬림 나라 마시나까지 공격해 신앙인 사이의 지하드라는 논란을 빚었다. 우마르는 1861년 3월 10일 세구에서 밤바라 군을 꺾고 도읍으로 삼았고, 1862년에는 젠네에 이어 마시나의 하므달라히를 차지했다. 그러나 정복당한 이들의 반란이 이어졌고 1864년 2월 하므달라히가 반란군에 함락되어 우마르는 달아나다 죽었다. 아들 아마두 탈이 1864년부터 다스렸으나 사촌 티디아니 탈과 다투었고, 1870년대에는 아마두의 형제들이 니오로와 코니아카리에서 일으킨 반란이 진압되었다. 1884년 무탄가 탈이 반란을 일으키자 아마두는 궁정을 니오로로 옮겼다. 1880년 프랑스는 상세네갈 군사 구역(훗날 프랑스령 수단)을 세워 내륙으로 전진했다. 1890년 세구를 거쳐 1891년 니오로가 프랑스에 함락되었고, 1893년 반디아가라가 무너져 아마두는 소코토로 망명했다. 이 땅은 1903년 2월 프랑스령 서아프리카로 공식 편입되었다."
  subjects: [tukulor-empire, french-sudan, french-senegal]
  links:
    - { from: french-senegal, to: tukulor-empire, note: "1857년 메디나 방어 뒤 1890~1893년 정복" }
