- id: hobyo-somali-coast-1878
  year: 1878
  endYear: 1889
  title:
    ko: "호비오 술탄국과 소말리 해안의 보호 조약(1878~1889)"
  summary:
    ko: "아프리카의 뿔 동쪽, 인도양과 아덴만을 낀 소말리 해안에는 무역 도시와 유목민 씨족이 모자이크처럼 얽혀 있었다. 북동부에는 마제르테인 술탄국이 있었고, 그 왕가의 일원 유수프 알리 케나디드는 계승 싸움에서 밀려나 1878년 무렵 남쪽 호비오 일대에서 따로 술탄국을 세웠다(연대는 1870년대 또는 1884년이라는 서술이 갈린다). 1869년 이탈리아 해운 회사가 에리트레아의 아사브를 산 뒤 영국은 수에즈 운하 개통으로 아덴과 이어지는 소말리 해안의 가치를 크게 보게 되었다. 소말리 사회는 거의 모두 유목 씨족 사회였고, 아덴 주둔군에 양고기를 대는 일이 영국에게 소말리 해안의 큰 쓸모였다. 영국은 이집트군이 1884년 베르베라와 제일라에서 물러나자 그 일대 씨족 수장들과 보호 조약을 맺었고, 이로써 영국령 소말릴란드가 비롯되었다(1888년 조약으로 보호령이 굳어진다). 프랑스는 1862년 오보크를 산 뒤 1884년 5월 20일 이곳을 식민지로 삼고 1885년 3월 가다부르시와 이사 씨족과 보호 조약을 맺었으며 이 땅은 훗날 지부티가 된다. 이탈리아는 1889년 2월 8일 호비오 술탄국, 4월 7일 마제르테인 술탄국과 보호 조약을 맺어 이탈리아령 소말리아의 바탕을 놓았고, 1893년 메르카와 모가디슈를 차지해 1905년 3월 19일 베나디르 식민지를 세운다. 술탄들은 이를 외세에 맞서 이웃 씨족을 누르는 방패로 삼으려 했으나 이탈리아는 곧 지배를 넓히려 했다. 영국과 이탈리아는 1894년 5월 5일 의정서로 각자의 세력 범위를 맞추었다. 이 조약들은 소말리 해안과 내륙이 영국·프랑스·이탈리아 세 나라와 에티오피아 쪽으로 나뉘는 첫걸음이 되었다."
  subjects: [sultanate-of-hobyo, british-somaliland, djibouti, italian-somaliland, majeerteen-sultanate]
  tags: [diplomacy, colonization]
  sources: ["I. M. Lewis, A Modern History of the Somali (James Currey, 4th ed. 2002)", "Robert L. Hess, Italian Colonialism in Somalia (University of Chicago Press, 1966)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]

- id: zulu-war-1879
  year: 1879
  endYear: 1897
  title:
    ko: "줄루 전쟁과 줄루란드 병합(1879~1897)"
  summary:
    ko: "케치와요가 이끈 줄루 왕국은 1870년대 말 트란스발 병합 이후 남아프리카 연방 구상을 서두르던 영국 고등판무관 바틀 프리어에게 걸림돌이 되었다. 본국 정부의 승인 없이 최후통첩을 냈다는 비난이 영국 안에서 일었던 프리어는 1878년 12월 11일 케치와요에게 군대를 해산하고 영국 주재관을 받으라는 최후통첩을 내밀었고, 시한이 지난 1879년 1월 11일 영국군 약 17,000명이 다섯 종대로 나뉘어 버펄로강을 건넜다. 1879년 1월 22일 이산들와나에서는 줄루 병력 2만 명 가까이가 영국 종대를 거의 무너뜨렸으나, 이어 로크스드리프트의 작은 초소는 약 10시간 싸움 끝에 버텨 냈다. 영국은 증원군을 보냈고, 두 번째 침공에는 영국군과 아프리카 보조병 합쳐 2만 3,000~2만 5,000명이 나섰다. 전쟁 전체에서 줄루 쪽 사망은 7,000명 안팎으로 추산한다. 영국은 3월 말 캄불라와 4월 징긴들로부에서 줄루군을 막은 뒤 1879년 7월 4일 울룬디에서 줄루 도읍을 점령했다. 케치와요는 8월 28일 붙잡혔다. 가넷 울슬리는 줄루란드를 추장 열세 명이 나눠 다스리는 체제로 갈라 줄루 왕의 자리를 없앴고(열한 명은 줄루, 둘은 비줄루였다), 이는 내분의 씨앗이 되어 추장들의 다툼이 곧 내전으로 번졌다. 영국은 1882년 케치와요를 되돌려 보내기로 했고 1883년 복위한 그는 7월 22일 지비브후가 이끄는 만들라카지 세력의 공격을 받아 쫓겨났고 1884년 숨졌다. 아들 디누줄루는 트란스발의 보어 의용대와 손잡았다가 이들이 세운 '새 공화국'의 압박을 받았다. 영국은 1887년 줄루란드를 병합했고 1897년 이를 나탈 식민지에 합쳐 줄루 왕국의 이름을 지웠다."
  subjects: [zulu, natal, uk]
  links:
    - { from: uk, to: zulu, note: "1879년 전쟁 뒤 1887년 병합, 1897년 나탈에 합침" }
  tags: [war, colonization]
  sources: ["Jeff Guy, The Destruction of the Zulu Kingdom: The Civil War in Zululand, 1879–1884 (Longman, 1979)", "Ian Knight, The Anglo-Zulu War (Osprey, 1989)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
  places: [{ name: 이산들와나, at: [30.65, -28.35], year: 1879 }]

- id: mahdi-1881
  year: 1881
  endYear: 1885
  title:
    ko: "마흐디의 봉기와 하르툼 함락(1881~1885)"
  summary:
    ko: "투르코-이집트 수단은 1870년대 이스마일의 파산과 영국 출신 관리 고든의 노예 무역 단속으로 흔들리고 있었다. 노예 무역에 의지하던 상인과 세금에 시달리던 농민이 불만을 품은 가운데, 나일강의 아바 섬에서 지내던 이슬람 신비주의 지도자 무함마드 아흐마드는 1881년 자신을 '마흐디'(인도받은 이)로 칭하고 이집트 관리를 몰아내라고 호소했다. 마흐디 운동에는 바가라 유목민과 자알린 상인, 다르푸르 사람이 가담했다. 1881년 8월 아바 전투에서 이집트 진압대가 패했고 1883년 엘오베이드가 함락되어 코르도판이 마흐디 세력에 넘어갔다. 영국이 이집트를 점령한 뒤 보낸 이집트군은 윌리엄 힉스의 지휘 아래 1883년 11월 3~4일 샤이칸에서 몰살당했다. 힉스의 병력 1만 명 안팎은 소수만 살아남았다고 전한다. 영국 정부는 수단을 포기하기로 하고 고든을 하르툼에 보내 주민과 군대를 철수시키게 했으나, 영국은 수단을 지킬 힘도 뜻도 모자랐다. 고든은 1884년 2월 18일 하르툼에 들어갔으나 3월부터 포위 속에 갇혔고, 마흐디는 하르툼 맞은편 옴두르만에 진을 쳤다. 영국에서는 고든을 구하자는 여론이 들끓어 울슬리가 구원군을 이끌었다. 1885년 1월 26일 하르툼이 함락되면서 고든이 죽었고 구원군은 이틀 늦게 닿았으며 하르툼에서는 많은 주민이 학살당했다. 이로써 투르코-이집트 수단이 끝나고 마흐디 국가가 섰으며 도읍은 옴두르만이었다. 마흐디는 1885년 6월 숨졌고 칼리프 압둘라히가 뒤를 이었다. 이 봉기 이야기는 영국의 이집트 지배(「영국의 이집트 지배와 보호국 선포(1883~1914)」(뒤의 사건))와도 이어진다."
  subjects: [egyptian-sudan, mahdist-state, uk]
  links:
    - { from: mahdist-state, to: egyptian-sudan, note: "1885년 하르툼을 함락해 이집트 통치를 끝냄" }
  tags: [war, religion, politics]
  sources: ["P. M. Holt, The Mahdist State in the Sudan 1881–1898 (Clarendon Press, 2nd ed. 1970)", "P. M. Holt and M. W. Daly, A History of the Sudan (Longman, 6th ed. 2011)", "The Cambridge History of Africa, vol. 6 (Cambridge University Press, 1985)"]
