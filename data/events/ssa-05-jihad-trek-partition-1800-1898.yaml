# 사하라 이남 사건 1묶음 갈래 05: 지하드와 대이동, 아프리카 분할 (1800 ~ 1898년)
# 범위: 소코토 지하드, 케이프 영구 점령, 시에라리온·감비아, 모리셔스, 줄루 왕국과 므페카네 (1800~1898 전체 중 앞부분 — 나머지는 이어서 더함).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 모두 그레고리력. 확실하지 않은 날짜는 '무렵'. 전승과 기록이 갈리면 '전한다'로 성격을 밝혔다.
# 이름 규칙: 항목 이름(소코토 칼리프국·줄루 왕국·케이프 식민지 등)을 그대로 썼고, 분쟁·민족 문제는 일어난 일과 숫자 범위만 적었다. 므페카네는 학설이 갈린다는 점을 글에 밝혔다.
