- id: shaka-zulu-1816
  year: 1816
  endYear: 1828
  title:
    ko: "샤카와 줄루 왕국의 성장(1816~1828)"
  summary:
    ko: "줄루는 나탈 북부 작은 추장국이었고, 샤카는 추장 센잔가코나의 서자로 어머니 난디와 함께 쫓겨나 음테트와 연맹의 딩기스와요 밑에서 자랐다. 아버지가 죽자 딩기스와요의 도움으로 1816년 줄루의 지도자 자리에 올랐다. 딩기스와요가 은드와은드웨의 즈위데에게 죽은 뒤(1816~1818년 사이로 전하며 자료가 갈린다) 샤카는 음테트와 연맹을 이어받았다. 즈위데의 첫 공격은 1818년 곡글리 언덕에서 막혔고, 1820년 음라투제강에서 즈위데를 꺾어 은드와은드웨 연맹을 흩었다. 샤카는 짧은 찌르는 창 이클와와 가죽 방패, 양쪽 날개로 적을 에워싸는 '소의 뿔' 진형, 연령별 군단 체제로 군대를 새롭게 짜고 정복한 집단을 병사와 주민으로 흡수했다. 1824년 무렵 나탈 해안에 영국 상인 헨리 프랜시스 핀과 프랜시스 페어웰이 자리 잡았고, 샤카는 암살 시도로 다쳤을 때 핀의 치료를 받았다. 어머니 난디가 1827년 죽자 샤카가 애도를 강요하며 많은 사람을 죽였다고 전한다. 샤카는 1828년 이복형제 딩가네와 음랑가나, 신하 음보파에게 암살당했고, 딩가네가 음랑가나를 죽이고 왕위에 올랐다. 샤카의 시신은 두쿠자 부근에 묻혔다고 전한다. 이때 줄루의 힘은 지금 남아프리카 공화국 콰줄루나탈 북부 일대에 미쳤고, 딩가네(1828~1840)는 뒤에 이주해 온 보어인과 맞서게 된다(「그레이트 트렉과 블러드강 전투, 나탈리아 공화국(1835~1843)」(뒤의 사건)). 샤카 시대의 줄루 군대는 이웃 집단이 흩어지고 이동하는 큰 변동의 한 원인으로 꼽혔으나, 오늘날 학자들은 그 책임을 샤카 한 사람에게만 돌리는 설명을 대체로 받아들이지 않는다."
  subjects: [zulu]
  tags: [war, politics]
  sources: ["Donald R. Morris, The Washing of the Spears (Simon and Schuster, 1965)", "Carolyn Hamilton ed., The Mfecane Aftermath (Witwatersrand University Press, 1995)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: mfecane-1818
  year: 1818
  endYear: 1840
  title:
    ko: "므페카네: 남부 아프리카의 전쟁과 새 나라들(1818~1840)"
  summary:
    ko: "므페카네(소토어로 디파카네, '강제로 흩어짐')는 1810년대부터 1840년대 사이 남부 아프리카에서 전쟁과 집단 이동이 잇따라 일어나 새 나라가 생긴 시기를 가리킨다. 원인으로는 정치 체제의 중앙집권화, 상아와 노예 무역, 1809년과 1815년 화산 폭발이 부른 가뭄, 유럽인의 진출이 꼽힌다. 줄루 왕국의 성장으로 은드와은드웨 연맹이 무너지자 그 지도자들이 북쪽과 서쪽으로 흩어졌다. 소샹가네는 무리를 이끌고 모잠비크로 가서 1824년 무렵 가자를 세웠고, 1827년 림포포강 하류로 옮겼고, 1858년 숨질 때까지 가자를 다스렸다. 음질리카지는 샤카에게 맞선 뒤 트란스발에서 나라를 세웠고, 1837~1838년 보어인의 공격을 받아 림포포강 북쪽으로 가서 마타벨레랜드에 자리 잡고 불라와요를 도읍으로 삼아 은데벨레 왕국을 이루었다. 이 나라는 1840년 무렵 틀이 잡혔다. 드라켄즈버그 산지에서는 모쇼에쇼에가 1824년 탑 모양 산 타바 보시우로 무리를 옮겨 바소토 왕국을 일구었고, 훗날 바수톨란드의 바탕이 되었다. 스와지의 소부자도 1830년대 초 사비강 쪽으로 영토를 넓혔다. 모쇼에쇼에는 1843년 케이프 총독과 조약을 맺어 영국과 손잡았다. 모쇼에쇼에는 전란을 피해 온 여러 집단을 받아들이며 힘을 키웠고, 타바 보시우는 방어하기 좋은 요새로 쓰였다. 희생자는 전통 설명이 100만~200만 명으로 추산했으나, 이 숫자와 샤카 한 사람을 원인으로 보는 설명은 1988년 줄리언 코빙이 비판한 뒤 학계에서 논쟁이 이어지고 있다. 코빙은 폭력의 뿌리를 케이프와 델라고아만의 노예 무역과 노예 습격에서 찾았고, 엘드리지는 그 가운데 일부를 받아들이면서도 줄루 중심 설명을 믿기 어렵다는 데에는 동의했다."
  subjects: [zulu, basutoland, gaza, ndebele-kingdom]
  tags: [war, society]
  sources: ["Julian Cobbing, 'The Mfecane as Alibi', Journal of African History 29 (1988)", "Elizabeth A. Eldredge, 'Sources of Conflict in Southern Africa, c. 1800–30', Journal of African History 33 (1992)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: oyo-collapse-1817
  year: 1817
  endYear: 1836
  title:
    ko: "일로린의 이탈과 오요 제국의 무너짐(1817~1836)"
  summary:
    ko: "오요 제국은 서아프리카 기니 해안 가까운 요루바 땅에서 기병을 앞세워 이웃 나라들에 공물을 받던 큰 나라였으나, 18세기 말부터 도읍의 왕 알라핀과 군 사령관 아레 오나 카캉포(군 사령관) 사이의 다툼으로 흔들렸다. 일로린에 자리 잡은 카캉포 아폰자가 1796년 무렵 알라핀 아워레(재위 1789~1796)에게 퇴위를 요구하자 아워레는 스스로 목숨을 끊었다. 이어 아데보(1796~1797)와 마쿠(1797)가 잇따라 짧게 재위했고, 1797~1802년에는 바소룬이 섭정을 했으며, 1802년부터 마조투가 1830년 무렵까지 알라핀 자리에 있었다고 하나 연대는 자료마다 갈린다. 아폰자는 이슬람 학자 알리미와 오요의 무슬림 군인들의 도움을 받아 1817년 일로린을 오요에서 떼어 냈으나, 곧 알리미 쪽과 사이가 틀어졌고 1823년 무렵 아폰자가 동맹이던 알리미 세력과 솔라그베루에게 죽임을 당했다. 알리미의 아들 압둘살람은 소코토 칼리프국에 충성을 맹세해 일로린을 소코토 깃발 아래 에미르국으로 만들었다. 같은 1823년에는 남쪽의 다호메이 왕국이 오요의 보호를 받던 마을들을 습격했고, 오요군이 크게 져 다호메이에 공물을 받던 지위를 잃었다. 1825년 영국 탐험가 휴 클래퍼턴이 알라핀 마조투를 찾았을 때 오요는 일로린에 맞서 영국과 베닌의 도움을 구하고 있었다. 1830년 무렵에는 오요의 지휘관들이 이바단을 전쟁 진지로 세워 요루바 세력의 무게가 남쪽으로 옮겨 갔다. 1835년 일로린이 오요의 도읍 오요일레를 무너뜨렸고, 사료는 이 해를 오요 제국의 끝으로 적는 일이 많으며 정보 상자는 1836년 무렵으로 잡는다. 1840년 압둘살람이 바다 쪽으로 지하드를 벌였으나 오쇼그보에서 이바단군에게 막혔다. 도읍을 잃은 알라핀 가문은 남쪽으로 옮겨 새 오요를 세웠고, 이 뒤 요루바 땅은 이바단·아베오쿠타 같은 도시와 일로린이 겨루는 여러 세력으로 나뉘었다."
  subjects: [oyo-empire, sokoto-caliphate, dahomey]
  links:
    - { from: sokoto-caliphate, to: oyo-empire, note: "일로린 에미르국을 통해 오요의 도읍을 무너뜨림" }
  tags: [war, politics, religion]
  sources: ["Robin Law, The Oyo Empire c. 1600–c. 1836 (Oxford University Press, 1977)", "Samuel Johnson, The History of the Yorubas (1921)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: radama-merina-1817
  year: 1817
  endYear: 1828
  title:
    ko: "라다마 1세와 메리나 왕국의 확장(1817~1828)"
  summary:
    ko: "마다가스카르 중앙 고원의 메리나 왕국은 18세기 말 안드리아남포이니메리나가 이메리나 지방의 작은 영주들을 하나로 묶어 힘을 키웠다. 그가 1810년 숨지자 아들 라다마 1세가 열일곱 살 안팎에 왕위를 이었다. 인도양의 모리셔스 섬을 1810년 프랑스에서 빼앗은 영국의 총독 로버트 타운센드 파쿼는 노예 무역을 막으려고 1816년 상인 샤르두노를 라다마에게 보냈고, 이어 퇴역 군인 제임스 헤이스티가 교섭을 맡아 1817년 10월 23일 영국–메리나 조약이 맺어졌다. 영국은 라다마를 '마다가스카르의 왕'으로 인정하고 말과 군복 같은 물자를 대 주었으며, 라다마는 노예 수출을 그만두겠다고 약속했으나 실제로는 노예 무역이 1850년대까지 이어졌다. 영국인 교관에게서 서양식 훈련을 받은 라다마의 군대는 1817년 동해안 토아마시나, 1820~1822년 메나베 지방, 1823년 북동 해안, 1826년 안탈라오트라, 1827년 안테사카로 차례로 나아가 섬의 3분의 2 가까이를 하나로 묶었다. 헤이스티는 1820년 영국 상주 대표가 되었고 런던 선교회의 웨일스 선교사 데이비드 존스와 데이비드 그리피스가 학교를 열어, 1년 만에 학교 23곳에 학생 2,300명이 다녔다고 한다. 말라가시어를 로마자로 적는 일도 이 무렵 시작되었다. 라다마는 1828년 7월 27일 서른다섯 살에 숨졌고 공식 사인은 과음이나 기록이 갈린다. 후계를 정해 두지 않아 장교들의 지지를 받은 왕비 라마보가 라나발로나 1세로 즉위해 영국과의 협력에서 물러섰고 1835년에는 기독교 신앙을 금지했다. 이 뒤 메리나 왕국은 1895년 프랑스의 정복을 받을 때까지 고원의 안타나나리보를 도읍으로 섬 대부분을 다스렸다."
  subjects: [merina-kingdom, uk]
  links:
    - { from: uk, to: merina-kingdom, note: "1817년 조약으로 메리나 왕을 '마다가스카르의 왕'으로 인정" }
  tags: [politics, diplomacy, war]
  sources: ["Mervyn Brown, A History of Madagascar (Damien Tunnacliffe, 2000)", "Gwyn Campbell, An Economic History of Imperial Madagascar, 1750–1895 (Cambridge University Press, 2005)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: egypt-sudan-conquest-1820
  year: 1820
  endYear: 1824
  title:
    ko: "이집트의 수단 정복과 푼지 술탄국의 끝(1820~1824)"
  summary:
    ko: "이집트의 무함마드 알리는 금과 노예를 얻어 새로 만든 상비군을 채우려고 1820년 아들 이스마일 카밀 파샤에게 약 4,000명의 군대를 주어 나일강을 따라 남쪽 수단으로 보냈다. 푼지 술탄국은 17세기 중엽 바디 2세(재위 1644년 또는 1645년~1681년) 때부터 센나르를 고정 도읍으로 청나일과 백나일 사이 게지라 땅을 다스렸으나 이 무렵에는 함라즈 섭정의 손에 실권이 있었고 안에서 반란이 잦았다. 원정군에 맞서려던 함라즈 섭정 무함마드 아들란은 1821년 초 센나르 근처에서 암살되었고, 이어 마지막 술탄 바디 7세는 1821년 6월 14일 이집트에 항복했다. 이로써 1504년 무렵 세워진 푼지 술탄국은 사라지고 그 땅은 투르코-이집트 수단의 핵심이 되었다. 정복 뒤 첫 한 해 동안 수단인 약 3만 명이 군대에 끌려갔다고 하며, 이집트 총독 무함마드 알리가 바란 금을 얻겠다는 기대는 남쪽 산지에서 금이 거의 나지 않아 크게 어긋났다고 한다. 같은 무렵 무함마드 알리의 사위 무함마드 베이 데프테르다르가 코르도판으로 진출해 서쪽의 다르푸르 술탄국 군대를 꺾고 이 땅을 차지했으며, 다르푸르 술탄국 자체는 1874년까지 독립을 지켰다. 1822년 신디에서 이스마일이 현지 수장 멕 님르에게 살해되자 데프테르다르가 가혹한 보복에 나서 많은 주민이 숨지고 노예로 끌려갔다. 이 무렵부터 이집트 총독들은 청나일과 백나일이 만나는 곳의 하르툼을 중심 도읍으로 삼아 행정을 다졌고, 하르툼은 1834년 인구 약 15,000명의 도시가 되었다. 이집트 쪽 정복 경과는 「수단 정복과 두 차례 이집트–오스만 전쟁(1820~1841)」(앞의 사건)이 다루며, 이 사건은 푼지 술탄국이 무너지고 수단 땅이 이집트 총독령으로 편입된 과정을 적는다."
  subjects: [funj-sultanate, egyptian-sudan, darfur, muhammad-ali-egypt]
  links:
    - { from: muhammad-ali-egypt, to: funj-sultanate, note: "1820~1821년 군대를 보내 항복시킴" }
  tags: [war, politics]
  sources: ["Richard Hill, Egypt in the Sudan 1820–1881 (Oxford University Press, 1959)", "P. M. Holt and M. W. Daly, A History of the Sudan (Longman, 6th ed. 2011)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
