- id: cape-british-1806
  year: 1806
  endYear: 1820
  title:
    ko: "영국의 케이프 영구 점령과 1820년 이주민(1806~1820)"
  summary:
    ko: "케이프 식민지는 1652년 네덜란드 동인도 회사가 세운 보급 기지에서 비롯되었다. 영국은 프랑스 혁명 전쟁 중이던 1795년 케이프를 처음 점령했다가 1803년 아미앵 조약의 결과로 바타비아 공화국에 돌려주었고, 나폴레옹 전쟁이 다시 번지자 1806년 1월 8일 블라우베르흐 전투에서 네덜란드군을 꺾고 케이프타운을 차지했다. 1814년 8월 13일 런던에서 맺은 영국–네덜란드 협약으로 영국은 600만 파운드를 내고 케이프 식민지의 지배를 공식으로 인정받았다. 1807년 노예 무역 폐지법이 케이프에도 적용되어 새 노예의 수입은 끊겼으나 노예제 자체는 1834년 법으로 폐지가 시작될 때까지 이어졌다. 동쪽 변경에서는 보어인 농민과 코사 사람이 목초지를 두고 부딪혔다. 1811~1812년 제4차 변경 전쟁에서 영국군이 주르벨트에서 코사 사람을 피시강 너머로 몰아냈고, 1815~1816년에는 변경 보어인 일부가 총독의 권한에 맞서 일으킨 슬라흐터스넥 반란이 진압되어 주모자 다섯이 교수형을 당했으며, 1818~1819년 제5차 전쟁에서는 코사 예언자 마칸다가 1819년 4월 22일 그레이엄스타운을 공격했다가 패했다. 영국 정부는 변경을 두텁게 하려고 이주를 장려했고, 1819년 영국 의회가 5만 파운드의 지원금을 승인한 이주 계획에 따라 1820년 약 4천 명의 이주민이 배편으로 도착해 알바니 지구에 자리 잡았다. 총독 소머싯 경(1814~1826)은 영어를 공용어로 삼는 정책을 폈으나 로마–네덜란드 법은 그대로 두었다. 1806년 1월 18일 네덜란드 총독 얀선스가 항복하면서 식민지는 영국의 손에 넘어갔고, 케이프타운은 인도로 가는 길목의 해군 기지가 되었다."
  subjects: [cape-colony, uk]
  links:
    - { from: uk, to: cape-colony, note: "1806년 점령, 1814년 협약으로 지배를 인정받음" }
  tags: [war, politics, society]
  sources: ["Hermann Giliomee, The Afrikaners: Biography of a People (University of Virginia Press, 2003)", "The Oxford History of South Africa, vol. 1 (Clarendon Press, 1969)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]
  places: [{ name: 블라우베르흐 전투, at: [18.46, -33.8], year: 1806 }]

- id: sierra-leone-gambia-1807
  year: 1807
  endYear: 1821
  title:
    ko: "노예 무역 금지와 시에라리온·감비아 식민지(1807~1821)"
  summary:
    ko: "영국 의회는 윌버포스와 클라크슨 등이 이끈 폐지 운동 끝에 1807년 3월 노예 무역 폐지법을 통과시켜 영국 선박의 노예 무역을 금지했다. 시에라리온은 1787년 런던의 가난한 흑인들을 데려와 세운 정착지에서 비롯되었고, 1792년 노바스코샤에서 온 흑인 충성파들이 프리타운을 세웠다. 이곳을 경영하던 시에라리온 회사가 재정난을 겪자 영국 정부가 1808년 1월 1일 인수해 왕령 식민지로 삼았고, 이것이 뒷날 시에라리온 식민지 및 보호령으로 불리는 영국령의 시작이다. 이 법은 1808년 3월 1일부터 영국령에 노예를 들여오는 일도 금지했다. 같은 해 서아프리카 함대가 꾸려져 노예선을 붙잡았고, 풀려난 사람들을 프리타운에 내려놓아 '해방 아프리카인'이라는 새 주민층이 생겼고, 선교회는 1827년 프리타운에 푸라 베이 칼리지를 세웠다. 함대가 1860년대까지 풀어 준 사람은 대략 15만 명 안팎으로 추산된다. 감비아강 어귀에서는 1816년 알렉산더 그랜트 대위가 요새를 짓고 당시 식민지 장관 바서스트 경의 이름을 따 바서스트(지금 방줄)라 불렀다. 1821년 바서스트를 비롯한 감비아 영토는 시에라리온 총독 아래 서아프리카 영국 정착지로 묶였다. 이 감비아 영토가 영국령 감비아의 시작이다. 영국의 금지에도 다른 나라 선박의 노예 무역은 이어졌고, 서아프리카 함대의 단속도 여러 차례 외교 분쟁을 낳았다. 감비아와 시에라리온 식민지의 총독이던 찰스 맥카시는 1824년 아샨티군과 싸우다 전사했다(「영국–아샨티 전쟁과 골드코스트 식민지(1824~1874)」(뒤의 사건)). 시에라리온 식민지의 주민 가운데 해방 아프리카인과 그 자녀는 선교 학교에서 영어 교육을 받으며 식민지 행정과 교역의 중간층으로 자랐다."
  subjects: [british-sierra-leone, british-gambia, uk]
  links:
    - { from: uk, to: british-sierra-leone, note: "1808년 시에라리온 회사에서 인수해 왕령 식민지로 삼음" }
  tags: [politics, society]
  sources: ["John D. Fage, A History of West Africa (Cambridge University Press, 1969)", "Christopher Fyfe, A History of Sierra Leone (Oxford University Press, 1962)", "The Cambridge History of Africa, vol. 5 (Cambridge University Press, 1976)"]

- id: mauritius-seychelles-1810
  year: 1810
  endYear: 1814
  title:
    ko: "영국의 모리셔스 점령과 파리 조약(1810~1814)"
  summary:
    ko: "인도양 마스카렌 제도의 모리셔스는 프랑스령 일드프랑스로, 1715년 프랑스가 차지한 뒤 사탕수수 농장과 노예 노동으로 번영했다. 나폴레옹 전쟁 중 이곳은 영국 동인도 회사 선박을 노리는 프랑스 사략선의 기지였고(로베르 쉬르쿠프가 그 가운데 이름난 선장이다), 영국은 1810년 7월 먼저 부르봉섬(지금 레위니옹)을 차지했다. 1810년 8월 20일부터 27일 사이 그랑포르 해전에서 프랑스 함대가 영국 함대를 꺾었으나(이 승리는 파리 개선문에 이름이 새겨졌다), 같은 해 11월 29일 영국군이 섬 북쪽에 상륙했고 나폴레옹이 1803년 보낸 총독 샤를 드캉은 12월 3일 항복했다. 항복 조건에 따라 섬 주민은 프랑스어와 종교, 재산과 법을 그대로 지켰다. 이 무렵 섬에는 항해가 매슈 플린더스가 1803년부터 억류되어 있다가 1810년 6월 풀려났다. 영국군은 모리셔스를 차지한 뒤 포트루이스를 총독부 소재지로 삼았다. 1814년 5월 30일 파리 조약에서 프랑스는 모리셔스와 로드리게스, 세이셸을 영국에 넘겼고 레위니옹은 돌려받았다. 프랑스 제도 가운데 나폴레옹 법전은 그대로 남아 영국령 모리셔스 법의 바탕이 되었다. 세이셸은 1770년 프랑스 정착이 시작된 군도로 프랑스가 1756년 영유를 선언한 곳이며, 이때부터 영국령 모리셔스의 속령이 되었다. 초대 총독 로버트 타운센드 파쿼(1810~1823)는 노예 무역 금지를 단속하는 데 미온적이었다는 비판을 받았다. 영국은 1809년 로드리게스를 먼저 점령해 부르봉섬 공격의 발판으로 삼았다. 노예제는 1835년에 폐지되었고, 그 뒤 인도에서 계약 노동자가 대거 들어와 사탕수수 농장을 맡았다."
  subjects: [french-mauritius, british-mauritius, seychelles, reunion, france, uk]
  links:
    - { from: uk, to: french-mauritius, note: "1810년 12월 점령" }
    - { from: france, to: british-mauritius, note: "1814년 파리 조약으로 넘김" }
  tags: [war, politics]
  sources: ["Auguste Toussaint, History of Mauritius (Macmillan, 1977)", "Sydney Selvon, A Comprehensive History of Mauritius (Mauritius Printing Specialists, 2005)"]
