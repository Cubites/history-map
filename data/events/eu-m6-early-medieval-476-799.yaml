- id: constantinople-sieges-674
  year: 674
  endYear: 718
  title:
    ko: "아랍의 콘스탄티노폴리스 포위(674~678·717~718)와 그리스의 불"
  summary:
    ko: "우마이야의 무아위야는 674년부터 해마다 콘스탄티노폴리스 앞에 함대를 보냈다(키지코스를 겨울 기지로 삼아 봄마다 도시를 공격했다고 테오파네스는 적는데, 지속 포위를 의심하는 설과 667~669년설도 있다). 동로마는 시리아 출신 기술자 칼리니코스가 만든 것으로 전하는 '그리스의 불'(불붙는 액체를 뿜는 무기)로 아랍 함대를 막았다. 678년 콘스탄티노스 4세와 30년 화약을 맺었고 우마이야가 해마다 금과 노예, 말을 바쳤다고 테오파네스는 적는다(아랍 사료는 이를 적지 않는다). 717년 7~8월 칼리프 술라이만의 동생 마슬라마가 대군(수는 사료마다 크게 다르고 현대 학자는 수만 명으로 본다)과 함대를 이끌고 다시 도시를 에워쌌다. 그해 3월 갓 황제가 된 레온 3세는 불가리아 제1제국의 칸 테르벨과 맺은 동맹으로 아랍 야영지를 뒤에서 쳤고, 겨울의 혹한과 굶주림, 역병, 그리스의 불로 약해진 아랍군은 새 칼리프 우마르 2세(717~720)의 명으로 718년 8월 15일(테오파네스의 연대) 포위를 풀었다(돌아가던 함대는 폭풍에 많이 잃었다). 술라이만은 포위 중 죽었다. 이 방어는 도시를 지켰고 아나톨리아가 칼리프국 손에 넘어가는 것을 막았다. 지도는 포위로 영토가 바뀌지 않아 따로 그리지 않는다."
  subjects: [byzantine-empire, umayyad-caliphate, first-bulgarian-empire]
