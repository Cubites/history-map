  sources: ["Paul Fouracre, The Age of Charles Martel (2000)", "The Fourth Book of the Chronicle of Fredegar with Its Continuations (J. M. Wallace-Hadrill 영역, 1960)", "Roger Collins, The Arab Conquest of Spain, 710–797 (1989)", "Pierre Riché, The Carolingians: A Family Who Forged Europe (Michael Idomir Allen 옮김, 1993)", "Kenneth Baxter Wolf 옮김, Conquerors and Chroniclers of Early Medieval Spain (2판, 1999)"]
