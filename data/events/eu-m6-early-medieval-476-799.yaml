- id: bavaria-agilolfings-555
  year: 555
  endYear: 788
  title:
    ko: "아길롤핑 가문의 바이에른 공국: 가리발트 1세(555 무렵)에서 타실로 3세의 폐위(788)까지"
  summary:
    ko: "바이에른 사람들은 6세기 중엽 사료에 처음 나타나고(요르다네스, 551), 555년 무렵 가리발트 1세가 프랑크의 종주 아래 첫 공(아길롤핑 가문인지는 학계가 다툰다)이 되어 레겐스부르크를 중심으로 다스렸다. 그의 딸 테오델린다는 롬바르드 왕 아우타리와 아길룰프의 왕비가 되었다. 타실로 1세(591 무렵~610 무렵)에 이어 700년 무렵 테오도 공은 잘츠부르크의 루페르트를 불러 교회를 세웠다고 전한다. 후그베르트(725~736 무렵)에 이은 오딜로 공(736~748)은 카롤루스 마르텔의 딸 힐트루트와 혼인했고, 739년 보니파티우스가 잘츠부르크·레겐스부르크·프라이징·파사우의 주교구를 정비했다. 마르텔이 죽은 뒤 맞서다 743년 레흐강에서 피핀과 카를로만에게 졌다. 오딜로가 죽자 피핀의 이복동생 그리포가 한때 바이에른을 차지했으나 피핀이 몰아냈고, 오딜로의 아들 타실로 3세(공 748~788)는 어려서 즉위해 피핀의 후견 아래 757년 콩피에뉴에서 신서했으나 763년 피핀의 아키텐 원정 중 군대를 이끌고 돌아가 버렸고(하리슬리츠), 롬바르드 왕 데시데리우스의 딸 리우트페르가와 혼인해 롬바르드와 이어졌다. 772년 카란타니아(알프스 슬라브, 지도는 남슬라브 공국들로 그린다)를 쳐서 보호 아래 두고 777년 크렘스뮌스터 수도원을 세웠다. 774년 롬바르드 왕국이 무너지자 고립된 그는 아바르와 손잡았다는 의심을 샀고, 788년 잉겔하임 제국 회의에서 카롤루스가 763년의 탈영과 반역 혐의로 사형을 선고했다가 수도원으로 보내는 것으로 바꾸었다. 바이에른은 카롤루스의 처남 게롤트가 맡는 프랑크 왕국의 속주가 되었다. 지도는 555~787년 바이에른 공국을 따로 그리고(772~787년 카란타니아 포함), 788년 프랑크 땅으로 그린다."
  subjects: [bavaria-duchy, frankish-kingdom, lombard-kingdom, avar-khaganate, south-slavic-principalities]
