# 유럽 중세 사건 6차 묶음: 서로마 제국의 끝에서 카롤루스의 정복 전쟁·성상 파괴·바이킹의 첫 습격까지 (476 ~ 799, 작업 EVM6)
# 범위: 서로마의 끝과 오도아케르·테오도리쿠스의 동고트 왕국, 클로비스와 메로빙거 분할·아우스트라시아와 네우스트리아·궁재의 시대·투르-푸아티에·피핀의 즉위와 기증,
#   카롤루스의 롬바르드 정복·작센 전쟁·바이에른 병합·아바르 원정·론세스바예스, 서고트의 톨레도 왕국과 유대인 정책, 우마이야의 이베리아 정복과 아스투리아스·코르도바 아미르국,
#   유스티니아노스의 재정복(아프리카·고트 전쟁)과 법전·니카 반란·하기아 소피아·역병, 롬바르드의 이탈리아, 스클라베니·아바르·사모, 헤라클레이오스와 사산 전쟁, 아랍의 정복과 콘스탄티노폴리스 포위,
#   쿠브라트와 불가리아 제1제국, 하자르 칸국, 캅카스의 이베리아·라지카, 성상 파괴와 이레네, 앵글로색슨 7왕국(오거스틴의 선교·휘트비 시노드·머시아의 오파), 아일랜드·스코틀랜드의 수도원,
#   브르타뉴, 프리지아 선교와 린디스판 습격, 돌궐의 성립과 아바르의 서진.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 476~799년 지도에서 생기거나 끝난 유럽 항목(서로마 제국 481, 수아송 왕국 487, 롬바르드 왕국 489, 동고트 왕국 493, 웨식스 519, 서슬라브·남슬라브 부족 527,
#   반달 왕국·부르군트 왕국 534, 바이에른 공국 555, 아바르 칸국 567, 이베리아 왕국 580, 수에비 왕국 585, 이베리아 공국 588, 사모 왕국 623, 대불가리아 632, 하자르 칸국 650, 우마이야 칼리프국 661,
#   아키텐 공국 670, 불가리아 제1제국 681, 베네치아 697, 덴마크 700, 아스투리아스 718, 서고트 왕국 끝 721, 달리어타 741, 이탈리아 소국들 752, 교황령·코르도바 아미르국 756, 툴루즈 백국·아브하지아 778,
#   카헤티-헤레티 787, 게르만 부족 798 등)을 subjects로 이음(docs/REGION_GUIDE.md §5, 점검 방식은 EVM1~EVM5의 성립·소멸 점검과 같음). 지도의 큰 변화(1만 km² 넘는 유럽 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 돌궐의 성립(552)과 아바르의 서진 사건에 고구려(551 돌궐의 신성 공격)·수(581)를, 헤라클레이오스와 사산 전쟁 사건에 수·당·고구려(살수 대첩 612)를, 아랍의 정복 사건에 당·신라
#   (혜초의 서역 기행 727, 탈라스 전투 751)를 subjects로 이었다. 02·03번 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 6~10일 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 서술은 새로 작성. 출처는 사료와 표준 개설서(한국어 번역본이 확인된 것만 번역본으로). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: western-empire-end-476
  year: 476
  endYear: 493
  title:
    ko: "서로마 제국의 끝: 오도아케르의 이탈리아(476)와 율리우스 네포스의 죽음(480)"
  summary:
    ko: "474~475년 서로마 황제 율리우스 네포스가 장군 오레스테스에게 쫓겨 달마티아로 달아나자, 오레스테스는 어린 아들 로물루스 아우구스툴루스를 황제로 세웠다. 476년 8월 이탈리아의 게르만계 용병들이 땅의 3분의 1을 달라고 요구했으나 오레스테스가 거부하자, 용병 지휘관 오도아케르가 군대의 추대로 왕에 올라 오레스테스를 죽이고 9월 4일 무렵 로물루스를 폐위해 캄파니아로 보냈다. 원로원은 동로마 황제 제논에게 사절을 보내 서쪽에는 따로 황제가 필요 없다고 알렸으나, 제논은 네포스가 합법적인 황제라 답하고 오도아케르에게는 파트리키오스 칭호를 주었다. 오도아케르는 제논의 이름 아래 원로원과 로마의 관직을 그대로 두고 다스렸다. 476년 말~477년 초 반달 왕에게 공납하는 조건으로 시칠리아를 넘겨받았고(릴리바이움은 제외), 480년 네포스가 달마티아에서 부하에게 살해되자 481~482년 달마티아를 차지했다. 같은 476년 갈리아에서는 서고트 왕 에우리크가 아를과 마르세유를 얻었다. 487~488년 오도아케르는 도나우강 북안의 루기인 같은 게르만 부족을 쳐서 노리쿰의 로마 주민을 이탈리아로 옮겼고, 489년 무렵 그 땅(루길란트)에 롬바르드가 들어왔다. 같은 해 제논의 승인을 받은 동고트 왕 테오도리쿠스가 쳐들어와 오도아케르는 493년 3월 라벤나에서 죽임을 당했다(뒤의 사건). 6세기의 연대기 작가 마르켈리누스 코메스는 476년을 서쪽 제국이 사라진 해로 꼽았으나 당시 사람들이 그 변화를 크게 느끼지 못했다고 보는 학자가 많다. 지도는 476~480년 서로마 제국을 네포스의 달마티아만으로 그리고(481년에 이 항목이 끝난다), 오도아케르의 이탈리아는 이탈리아·라이티아·노리쿰에 477년 시칠리아, 481년 달마티아를 더해 그린다."
  subjects: [western-roman-empire, odoacer-italy, byzantine-empire, vandal-kingdom, visigothic-kingdom, germanic-tribes, lombard-kingdom, ostrogothic-kingdom]
  links:
    - { from: byzantine-empire, to: western-roman-empire, note: "제논의 네포스 인정(~480)" }
    - { from: odoacer-italy, to: vandal-kingdom, note: "시칠리아를 받고 공납(477)" }
  tags: [politics]
  sources: ["The Chronicle of Marcellinus (Brian Croke 영역, 1995)", "Jordanes, The Gothic History of Jordanes (Charles C. Mierow 영역, 1915)", "Peter Heather, The Fall of the Roman Empire (2005)", "Paul the Deacon, History of the Lombards (William Dudley Foulke 영역, 1907)"]

- id: anglo-saxon-476
  year: 476
  endYear: 616
  title:
    ko: "앵글로색슨의 브리튼 정착과 오거스틴의 선교(597)"
  summary:
    ko: "로마가 410년 브리타니아를 떠난 뒤 앵글인·색슨인·유트인이 브리튼 동부와 남부에 자리 잡았다. 비드는 헹기스트와 호사가 449년 무렵 켄트에 상륙했다고 전하나, 고고학은 정착이 더 오래 점진적으로 이루어졌다고 본다. 브리튼인 쪽 기록인 길다스(6세기)는 500년 무렵 바던산에서 브리튼인이 이겨 한동안 평화가 있었다고 적고, 아서 이야기는 훨씬 뒤의 전설이다. 9세기에 엮은 『앵글로색슨 연대기』는 477년 앨레의 서식스 상륙, 495~519년 체르딕과 키네릭의 웨식스, 547년 이다의 밤버러(버니시아), 552년 세아로부르흐, 560년 앨레의 데이라, 571년 쿠스울프의 베드캔퍼드, 577년 디럼 전투(글로스터·사이렌세스터·바스)를 적는다(초기 연대는 전승이라 믿기 어려운 것이 많다). 지도는 템스강 어귀와 동앵글리아·린지는 476년부터 앵글로색슨 왕국들로 그리고, 서식스·서리 493년, 웨식스 523년, 버니시아 547년, 데이라 560년, 베드캔퍼드 572년, 디럼 582년, 머시아 585년으로 바꿔 그린다. 브리튼인 왕국들(묶음)은 웨일스 공국들과 콘월, 컴브리아, 아르모리카(브르타뉴)로 밀렸다. 켄트의 에설버트(재위 589 무렵~616, 비드의 560년 즉위는 전통 연대)는 프랑크 공주 베르타와 혼인했고, 교황 그레고리우스 1세가 보낸 수도사 오거스틴이 597년 켄트에 상륙해 에설버트에게 세례를 주고 캔터베리에 교회를 세웠다(오거스틴은 604년 무렵 죽었다). 616년 노섬브리아 왕 애설프리스가 체스터에서 브리튼인 군대를 쳐부수고 수도사 1,200명이 죽었다고 비드는 전한다."
  subjects: [anglo-saxon-kingdoms, brittonic-kingdoms, wessex, welsh-principalities]
  links:
    - { from: anglo-saxon-kingdoms, to: brittonic-kingdoms, note: "디럼(577)과 체스터(616)" }
  tags: [politics, war]
  sources: ["Bede, Ecclesiastical History of the English People (Leo Sherley-Price 영역, 1990)", "The Anglo-Saxon Chronicle (Michael Swanton 영역, 1996)", "Barbara Yorke, Kings and Kingdoms of Early Anglo-Saxon England (1990)", "Frank Stenton, Anglo-Saxon England (3판, 1971)", "Nicholas Brooks, The Early History of the Church of Canterbury (1984)"]
  places: [{ name: 디럼, at: [-2.4, 51.46], year: 577 }, { name: 체스터, at: [-2.89, 53.19], year: 616 }]

- id: clovis-franks-481
  year: 481
  endYear: 511
  title:
    ko: "클로비스 1세: 수아송(486)·세례·부예(507)와 프랑크 왕국의 성립"
  summary:
    ko: "킬데리크 1세의 아들 클로비스는 481년 열다섯 살 무렵 투르네의 살리 프랑크 왕이 되었다. 486년 수아송에서 로마 장군 시아그리우스를 꺾었다(시아그리우스는 서고트 왕 알라리크 2세에게 달아났다가 넘겨져 죽었다고 투르의 그레고리우스가 전한다). 493년 부르군트 왕 군도바드의 조카딸인 가톨릭 신자 클로틸데와 혼인했고, 알레만인과의 큰 싸움(전통은 톨비악, 496년 무렵이나 연대는 학자마다 갈린다)에서 이기면 세례를 받겠다고 맹세했다고 한다. 랭스 주교 레미기우스에게 세례를 받았고(전통은 496년 12월 25일, 498~508년설도 있다) 병사 3천여 명이 함께 받았다고 그레고리우스는 적는다. 동고트·서고트·부르군트 왕이 모두 아리우스파인 서방에서 가톨릭 신자 왕이 되어 갈리아 주교들의 지지를 얻었다. 506년 알레만인 같은 게르만 부족을 다시 눌러 알자스와 라인강 중류 일대를 얻었고, 507년 푸아티에 가까운 부예에서 알라리크 2세를 직접 죽이고(그레고리우스) 툴루즈의 보물과 아키텐을 차지했다. 508년 동고트의 장군 이바스가 아를 포위를 풀어 프로방스는 동고트가 지켰고, 서고트에는 셉티마니아가 남았다. 이해 클로비스는 동로마 황제 아나스타시우스 1세가 보낸 명예 집정관 칭호를 투르에서 받았다. 그는 파리를 도읍으로 삼았고, 라인강 가 리푸아리 프랑크 왕 시기베르트 부자가 죽은 뒤 쾰른 왕위도 얻었으며(그레고리우스는 클로비스가 다른 프랑크 왕들을 계략으로 제거했다고 적는다), 『살리카 법전』을 정리했다고 본다. 511년 7월 오를레앙 공의회를 열었고 11월 27일 파리에서 죽었다. 지도는 486년 수아송 왕국을, 506년 알레만인의 땅을, 507년 서고트의 아키텐을 프랑크 땅으로 그리며 쾰른 일대는 476년부터 프랑크 왕국으로 그린다."
  subjects: [frankish-kingdom, domain-of-soissons, visigothic-kingdom, burgundian-kingdom, ostrogothic-kingdom, byzantine-empire, germanic-tribes]
  links:
    - { from: frankish-kingdom, to: domain-of-soissons, note: "수아송 전투(486)" }
    - { from: frankish-kingdom, to: visigothic-kingdom, note: "부예 전투(507)" }
    - { from: ostrogothic-kingdom, to: frankish-kingdom, note: "아를 포위 격퇴(508)" }
  tags: [politics, war]
  sources: ["Gregory of Tours, The History of the Franks (Lewis Thorpe 영역, 1974)", "Ian Wood, The Merovingian Kingdoms 450–751 (1994)", "Patrick J. Geary, Before France and Germany: The Creation and Transformation of the Merovingian World (1988)", "Edward James, The Franks (1988)"]
  places: [{ name: 수아송, at: [3.32, 49.38], year: 486 }, { name: 톨비악(쥘피히), at: [6.65, 50.69], year: 496 }, { name: 부예, at: [0.33, 46.58], year: 507 }, { name: 아를, at: [4.63, 43.68], year: 508 }]

- id: theodoric-ostrogoths-489
  year: 489
  endYear: 535
  title:
    ko: "테오도리쿠스의 동고트 왕국: 이탈리아 정복(489~493)에서 보에티우스(524)와 아말라순타까지"
  summary:
    ko: "동고트 왕 테오도리쿠스(약 454~526)는 동로마 황제 제논의 승인을 받아 489년 이탈리아로 들어왔다(병사와 가족을 합쳐 4만~10만 명이라는 것이 학계의 추산이다). 489년 이손초강과 베로나, 490년 8월 아다강에서 오도아케르군을 이기고 라벤나를 포위하자 오도아케르의 이탈리아 왕국은 갇힌 처지가 되었고, 493년 2월 협정을 맺은 뒤 3월 15일 연회에서 테오도리쿠스가 오도아케르를 죽였다. 그는 고트인에게는 군역과 아리우스파 신앙을, 로마인에게는 민정과 가톨릭 신앙을 맡기는 이중 체제로 다스렸다(고트인이 받은 것이 토지인지 세수의 몫인지는 학자들이 다툰다). 카시오도루스의 공문서 모음 『바리아에』가 이 행정을 전한다. 504년 시르미움을 게피드에게서 얻었고, 507년 부예 전투 뒤 508년 프랑크와 부르군트의 아를 포위를 풀어 프로방스를 얻었으며, 523년 프랑크가 부르군트를 칠 때 뒤랑스강~이제르강 사이(아비뇽·발랑스 쪽)를 차지했다. 서고트에서는 507~511년 알라리크 2세의 서자 게살레크가 왕이 되었다가 이바스에게 격파되었고, 테오도리쿠스가 511년부터 외손자 아말라리크의 섭정을 맡았으며 혼인으로 프랑크·부르군트·반달·튀링겐 왕가와 이어졌다. 523년 동로마 황제 유스티노스 1세가 아리우스파를 누르자 관계가 나빠졌고, 원로원 귀족 보에티우스가 반역 혐의로 갇혀 524년 무렵(525년설도 있다) 처형되었다(그는 감옥에서 『철학의 위안』을 썼다). 동로마에 사절로 다녀온 교황 요한 1세도 526년 5월 라벤나 감옥에서 죽었다. 테오도리쿠스는 526년 8월 30일 죽었고 딸 아말라순타가 외손자 아탈라리크의 섭정을 맡았다. 534년 아탈라리크가 죽은 뒤 아말라순타가 사촌 테오다하드를 공동 왕으로 세웠으나 그에게 갇혀 535년 살해되었고, 유스티니아노스는 이를 구실로 고트 전쟁을 일으켰다(뒤의 사건). 같은 시기 529년 무렵 누르시아의 베네딕투스가 몬테카시노에 수도원을 세웠다고 전한다."
