- id: arab-conquests-634
  year: 634
  endYear: 751
  title:
    ko: "아랍의 정복과 동로마: 야르무크(636)·이집트·카르타고(698)와 우마이야 칼리프국"
  summary:
    ko: "622년 이슬람 공동체를 세운 무함마드가 632년 죽자 칼리프 아부 바크르와 우마르(634~644), 우스만(644~656) 아래 아랍군은 오랜 전쟁에 지친 두 제국을 빠르게 무너뜨렸다. 636년 8월 야르무크 강가에서 동로마군이 졌다(양쪽 병력은 사료에서 부풀려졌고 현대 학자는 각각 1만 5천~4만 명 안팎으로 본다). 637년 안티오키아와 예루살렘(총대주교 소프로니오스의 항복, 637년과 638년설이 갈린다)이 넘어갔고, 640~641년 아므르 이븐 알아스가 이집트를 차지해 641년 협정으로 알렉산드리아가 열려 642년 9월 아므르가 입성했다. 사산 제국은 642년 니하반드에서 무너져 651년 끝났다. 아르메니아 귀족 테오도로스 르슈투니가 653년 무아위야와 조약을 맺어 아르메니아가 아랍의 종주 아래 들어갔고, 649~654년 키프로스와 로도스가 공격받았다. 우스만이 죽은 뒤 알리(656~661)와 무아위야가 다툰 제1차 내전 끝에 661년 무아위야가 칼리프에 올라 다마스쿠스를 도읍으로 우마이야 칼리프국을 열었다. 688년 유스티니아노스 2세와 압드 알말리크가 키프로스를 공동 통치하기로 했고, 698년 카르타고가 우마이야에 넘어갔다(레온티오스(695~698)의 함대가 한때 되찾았다가 졌고, 그 패배로 일어난 반란에 티베리오스 3세(698~705)가 즉위했다). 703년 킬리키아(몹수에스티아)가 아랍의 변경이 되었다. 동로마의 세금 부담과 단성론파 교회에 대한 압박이 지역 주민이 아랍을 받아들이게 했다는 해석과, 협정으로 신앙과 자치를 지킨 곳이 많았다는 해석이 함께 있다. 이 뒤 동로마는 아나톨리아를 중심으로 군관구(테마) 제도를 갖춘 나라로 바뀌었다. 지도는 637년 안티오키아·키로스, 639년 에데사·아미다, 653년 서아르메니아, 688년 키프로스, 703년 킬리키아를 동로마 땅에서 뺀다. 동쪽 끝에서는 727년 신라 승려 혜초가 인도에서 돌아오며 페르시아를 지배하는 대식(아랍)을 적었고, 751년 탈라스 강가에서 당군(고구려 유민 출신 고선지가 이끌었다)이 아바스 군에게 졌다(지도에 없는 중앙아시아의 일이다)."
