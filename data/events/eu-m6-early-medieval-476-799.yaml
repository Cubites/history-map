- id: charlemagne-lombards-768
  year: 768
  endYear: 781
  title:
    ko: "카롤루스의 롬바르드 정복: 파비아의 함락(774)과 롬바르드 왕국의 끝"
  summary:
    ko: "768년 9월 피핀 3세가 죽자 왕국은 카롤루스(북서쪽의 네우스트리아와 아키텐 북부)와 카를로만(남동쪽의 부르군디아·프로방스·알자스)에게 나뉘었다. 카롤루스는 769년 후날드 2세의 아키텐 반란을 눌렀고(768년 와이파르 공이 살해되었고 지도는 768년부터 아키텐을 프랑크 땅으로 그린다), 771년 12월 카를로만이 죽자 홀로 왕이 되었다. 카롤루스가 770년 롬바르드 왕 데시데리우스의 딸과 혼인했다가 이듬해 돌려보내 사이가 틀어졌고, 데시데리우스는 카를로만의 미망인과 아들들을 감쌌다. 772년 교황 하드리아누스 1세가 롬바르드의 라벤나 일대 점령에 항의하며 도움을 청하자, 카롤루스는 773년 알프스를 넘어 키우사 고개의 롬바르드 방어선을 우회해 데시데리우스가 틀어박힌 파비아를 포위했다. 아들 아델키스는 베로나에서 바다를 건너 동로마로 달아났다. 카롤루스는 파비아를 포위하던 774년 4월 부활절에 로마에 가서 하드리아누스 1세와 피핀의 기증을 확인했고(그 범위는 학자마다 갈린다), 6월 파비아가 항복하자 데시데리우스를 코르비 수도원으로 보내고 '프랑크와 롬바르드의 왕'을 칭했다. 롬바르드 귀족은 법과 땅을 지켰으나 왕국은 사라졌다. 스폴레토 공은 교황에게 신서했으나 곧 프랑크의 영향 아래 들어갔고, 베네벤토 공 아리키스 2세는 '프린켑스'를 칭하며 독립을 이어 갔다(지도는 774년 베네벤토를 롬바르드·캄파니아 공국들로, 스폴레토를 프랑크로, 리에티(사비나)를 교황령으로 그린다). 776년 프리울리 공 흐로트가우트의 반란이 진압되었고, 781년 카롤루스는 아들 피핀을 이탈리아 왕, 루트비히를 아키텐 왕으로 세웠다."
  subjects: [frankish-kingdom, lombard-kingdom, papal-states, aquitaine-early, lombard-principalities, byzantine-empire]
