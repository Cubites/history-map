- id: kubrat-asparukh-632
  year: 632
  endYear: 777
  title:
    ko: "불가리아의 시작: 쿠브라트의 대불가리아(632)에서 아스파루흐(681)·테르벨(705)까지"
  summary:
    ko: "훈 제국이 무너진 뒤 흑해 북쪽 초원에는 쿠트리구르·우티구르·오노구르 같은 불가르계 유목민이 흩어져 있었다(지도는 이들을 훈·불가르계 유목민 묶음으로 그린다). 아바르에 눌려 있던 오노구르의 지도자 쿠브라트는 동로마 황제 헤라클레이오스와 손잡았고(총대주교 니케포로스는 황제가 그에게 파트리키오스 칭호를 주었다고 전한다), 632년 무렵 아바르에서 벗어나 아조프해와 쿠반강 둘레에 대불가리아를 세웠다. 쿠브라트가 죽은 665년 무렵 아들들이 하자르에 밀려 흩어졌고(지도는 668년에 이 항목을 끝낸다), 아스파루흐는 무리를 이끌고 다뉴브강 어귀로 옮겼다. 680년 콘스탄티노스 4세가 보낸 군대가 도나우강 삼각주의 오노글로스에서 졌고, 681년 동로마는 아스파루흐에게 해마다 공물을 바치기로 하고 모이시아 땅을 인정했다. 이로써 불가리아 제1제국이 생겼다(지도는 681년 모이시아와 도브루자·부자크·왈라키아를 불가리아로 그린다). 소수의 불가르 지배층 아래 일곱 슬라브 부족과 세베리가 있었다고 테오파네스는 적는다(지도는 이 슬라브 땅을 남슬라브 공국들로 그리다 681년 불가리아로 옮긴다). 695년 폐위되었다가 705년 불가리아 칸 테르벨의 도움으로 복위한 유스티니아노스 2세가 보답으로 자고라(스타라 플라니나 남쪽)를 넘기고 카이사르 칭호를 주었다(지도는 705년). 756년부터 콘스탄티노스 5세가 거듭 불가리아를 쳐서 763년 안키알로스에서 이겼고(지도는 763년 자고라를 동로마 땅으로 그린다), 불가리아에서는 칸이 자주 바뀌었다. 텔레리그(768~777)는 777년 동로마로 달아났고 카르담이 이었다. 803년 이후의 크룸은 뒤의 사건이다. 하자르는 650년 무렵 볼가강 하류에서 일어나 668년 쿠브라트의 옛 땅을 차지했다."
  subjects: [hunnic-bulgar-tribes, old-great-bulgaria, first-bulgarian-empire, khazar-khaganate, byzantine-empire, avar-khaganate, south-slavic-principalities]
