- id: vandal-africa-533
  year: 533
  endYear: 534
  title:
    ko: "유스티니아노스의 아프리카 재정복: 반달 왕국의 멸망(533~534)"
  summary:
    ko: "반달 왕 힐데리크가 530년 사촌 겔리메르에게 쫓겨나자 유스티니아노스는 이를 구실로 533년 6월 벨리사리우스에게 보병 1만, 기병 5천, 배 500척(프로코피우스의 수)을 주어 보냈다. 반달 군의 일부는 사르데냐에 가 있었고, 동고트의 아말라순타는 시칠리아에서 보급을 허락했다. 벨리사리우스는 9월 튀니지 연안에 상륙해 13일 아드 데키뭄에서 겔리메르의 군을 흩뜨리고 15일 카르타고에 들어갔다(도시는 거의 싸우지 않고 열렸다). 12월 트리카마룸에서 겔리메르의 마지막 군대가 졌고, 겔리메르는 누미디아의 산에서 겨울을 난 끝에 534년 3월 항복했다. 그는 콘스탄티노폴리스에서 벨리사리우스의 개선식에 끌려 나갔고 갈라티아에 땅을 받았다. 반달 병사 가운데 일부는 동로마 기병으로 뽑혀 동방으로 보내졌다. 동로마는 반달이 가톨릭 교회를 박해했다고 선전했고(가이세리크와 훈네리크 때의 박해는 사료에 있다), 534년 4월 아프리카 총독령을 세웠으나 마우리(베르베르) 부족의 저항과 군대의 반란으로 548년까지 전쟁이 이어졌다. 사르데냐와 코르시카, 발레아레스, 세우타는 534년 동로마에 들어왔다(지도는 534년 사르데냐·코르시카·발레아레스를 동로마 땅으로 그리고, 북아프리카 본토는 이 구간 지도에 없다)."
  subjects: [vandal-kingdom, byzantine-empire, ostrogothic-kingdom]
  links:
