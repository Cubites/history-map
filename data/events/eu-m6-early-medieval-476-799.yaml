- id: clovis-sons-511
  year: 511
  endYear: 561
  title:
    ko: "클로비스의 아들들: 메로빙거 분할(511)·튀링겐(531)·부르군트 왕국의 끝(534)·프로방스(537)"
  summary:
    ko: "클로비스가 죽은 511년 프랑크 왕국은 네 아들에게 나뉘었다: 테우데리크 1세(랭스·메스, 뒤의 아우스트라시아), 클로도메르(오를레앙), 킬데베르트 1세(파리), 클로타르 1세(수아송). 왕국을 아들들이 나눠 갖는 것이 프랑크의 관습이었고 왕국은 하나라는 생각은 이어졌다. 524년 부르군트 원정에서 클로도메르가 죽자 킬데베르트와 클로타르는 조카들을 죽이고 그 땅을 나눴다(막내 클로도알드만 살아남았다고 그레고리우스는 적는다). 531년 테우데리크와 클로타르가 튀링겐 왕 헤르만프리트를 쳐서 튀링겐 왕국(지도는 게르만 부족 묶음)이 무너졌고(지도는 마인강 상류의 프랑켄을 531년 프랑크 땅으로 그린다), 532년 오툉에서 이긴 킬데베르트와 클로타르가 534년 부르군트 왕 고도마르를 몰아내 왕국을 나눠 가졌다(지도는 534년). 동고트와 동로마가 고트 전쟁(535~)을 시작하자 양쪽 모두 프랑크의 도움을 구했고, 537년 동고트의 비티기스가 프로방스와 알레만니아·라이티아의 권리를 프랑크에 넘겼다(프로코피우스, 지도는 537년). 테우데리크의 아들 테우데베르트 1세(재위 533~548)는 539년 이탈리아로 쳐들어가 동고트와 동로마 양쪽을 털었고, 자기 이름을 새긴 금화를 찍었다. 아들 테우데발트(548~555)가 후사 없이 죽자 클로타르 1세가 아우스트라시아를 합쳤다. 이 무렵 바이에른 사람들이 처음 사료에 나타나고(요르다네스, 551), 555년 무렵 가리발트 1세가 프랑크의 종주 아래 아길롤핑 가문의 공이 되었다(지도는 555년부터 바이에른 공국을 따로 그린다). 558년 킬데베르트가 죽은 뒤 클로타르 1세가 왕국 전체를 다스리다 561년 죽었다."
  subjects: [frankish-kingdom, burgundian-kingdom, ostrogothic-kingdom, bavaria-duchy, germanic-tribes]
  links:
    - { from: frankish-kingdom, to: burgundian-kingdom, note: "부르군트 왕국 분할(534)" }
    - { from: ostrogothic-kingdom, to: frankish-kingdom, note: "프로방스 양도(537)" }
  tags: [politics, war]
  sources: ["Gregory of Tours, The History of the Franks (Lewis Thorpe 영역, 1974)", "Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Jordanes, The Gothic History of Jordanes (Charles C. Mierow 영역, 1915)", "Ian Wood, The Merovingian Kingdoms 450–751 (1994)"]

- id: justinian-532
  year: 527
  endYear: 565
  title:
    ko: "유스티니아노스 1세의 치세: 『로마법 대전』·니카 반란(532)·하기아 소피아(537)와 541년의 역병"
  summary:
    ko: "동로마 황제 유스티노스 1세의 조카 유스티니아노스는 527년 즉위해 565년까지 다스렸다. 황후 테오도라가 곁에서 정치를 도왔고, 법학자 트리보니아누스가 이끈 위원회가 529년 『칙법집』, 533년 『학설휘찬』과 『법학제요』를 펴냈다(뒤의 『신칙법』까지 합쳐 『로마법 대전』이라 부른다). 532년 1월 콘스탄티노폴리스 경주장의 파벌 청색당과 녹색당이 세금과 관리들에게 항의하는 '니카' 반란을 일으켜 히파티우스를 황제로 추대했다. 황제가 도망치려다 테오도라의 만류로 남았다고 전하며, 벨리사리우스와 문두스의 군대가 경주장에 갇힌 군중을 덮쳐 3만 명이 죽었다고 프로코피우스는 적는다(과장 가능성이 크다). 반란에 불탄 성당 자리에 트랄레스의 안테미오스와 밀레토스의 이시도로스가 지은 하기아 소피아는 537년 12월 27일 봉헌되었다. 529년에는 아테네의 플라톤 학원을 닫는 칙령도 냈다. 사산과는 540년 호스로 1세의 안티오키아 약탈 등으로 싸우다 562년 50년 화약을 맺었다. 541년 이집트 펠루시움에서 시작한 역병이 542년 콘스탄티노폴리스에 닿아 지중해 전역으로 퍼졌다. 프로코피우스는 하루 1만 명이 죽었다고 적으나 과장으로 보며, 이 첫 번째 역병 대유행(541~549, 750년 무렵까지 되풀이)은 유전자 분석으로 페스트균에 의한 것으로 확인되었지만 사망자 수는 학자마다 크게 갈린다(수천만 명 설과 영향이 작았다는 설). 거듭된 전쟁과 세금, 역병에 지친 제국은 565년 11월 유스티니아노스가 죽은 뒤 국경을 지킬 힘이 약해졌다. 아프리카와 이탈리아 재정복은 따로 있다(뒤의 사건)."
  subjects: [byzantine-empire]
  tags: [politics, society, culture]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "John Moorhead, Justinian (1994)", "Michael Maas 엮음, The Cambridge Companion to the Age of Justinian (2005)", "Lester K. Little 엮음, Plague and the End of Antiquity: The Pandemic of 541–750 (2007)", "윌리엄 H. 맥닐, 『전염병의 세계사』(김우영 옮김, 이산, 2005)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]

- id: slavs-sclaveni-527
  year: 527
  endYear: 602
  title:
    ko: "스클라베니와 안테스: 슬라브의 등장과 도나우강 방어선(527~602)"
  summary:
    ko: "6세기 사료는 도나우강 북쪽에서 '스클라베니'와 '안테스'가 갑자기 나타났다고 적는다. 요르다네스(551)는 비스와강 쪽의 베네티가 스클라베니와 안테스로 나뉜다고 했고, 프로코피우스는 유스티니아노스 때부터 두 무리가 도나우강을 넘어 트라키아와 일리리아를 약탈했다고 썼다. 545년 유스티니아노스는 안테스를 동맹으로 삼아 도나우강 북안을 맡겼고, 540년대 후반 스클라베니는 디라키온 가까이와 테살로니키 부근까지 이르렀다. 559년에는 쿠트리구르 같은 훈·불가르계 유목민이 얼어붙은 강을 건너 콘스탄티노폴리스 근처까지 닿았다. 고고학은 프라하-코르차크, 펜코프카 같은 문화를 슬라브인과 잇지만, 플로린 쿠르타 등은 '슬라브'라는 정체성이 도나우 국경에서 동로마와 주고받는 가운데 6세기에 만들어졌다고 본다. 567년 이후 아바르 칸국(게르만 부족의 땅이던 판노니아를 차지했다)이 이들 가운데 많은 무리를 부렸고, 『프레데가리우스 연대기』는 아바르가 슬라브인을 싸움의 앞줄에 세웠다고 적는다. 티베리오스 2세(578~582) 때인 570년대 말~581년(연도는 579·581설이 있다) 슬라브 약 10만 명이 트라키아를 휩쓸었다고 에페소스의 요한은 전한다(과장 가능성이 크다). 587년 슬라브가 펠로폰네소스에 자리 잡았다는 『모넴바시아 연대기』의 기사는 훗날 기록이라 믿을 수 있는지 논쟁이 있다. 590년대 황제 마우리키오스는 도나우강 너머로 원정을 보냈으나 602년 겨울을 강 북쪽에서 나라는 명령에 군대가 반란을 일으켜 그가 폐위되었다(뒤의 사건). 같은 602년 아바르가 안테스를 쳐서 사료에서 안테스가 사라진다(테오필락투스). 지도는 527년부터 폴란드와 비스와강 일대를 서슬라브 부족으로, 왈라키아 쪽을 남슬라브 공국들로, 드네스트르~드니프로강을 동슬라브 부족(안테스)으로 그리고, 568년 롬바르드가 이탈리아로 떠나자 엘베강 동쪽과 보헤미아·모라비아·슬로바키아의 게르만 부족 땅을 서슬라브 부족으로, 카란타니아를 남슬라브로 바꾸고, 587년 펠로폰네소스를 남슬라브로 바꾸며 602년 드네스트르~드니프로강의 숲초원을 비운다."
  subjects: [slavic-tribes, south-slavic-principalities, east-slavic-tribes, hunnic-bulgar-tribes, germanic-tribes, byzantine-empire, avar-khaganate]
