- id: brittany-578
  year: 578
  endYear: 799
  title:
    ko: "브르타뉴: 브리튼인의 이주와 프랑크의 브르타뉴 변경(799)"
  summary:
    ko: "로마가 브리타니아를 떠나고 앵글로색슨이 들어오자 5~7세기에 브리튼인이 바다를 건너 아르모리카(오늘의 브르타뉴)로 옮겨 가 돔노네·코르누아유·브로 와로크 같은 작은 나라를 세웠다. 투르의 그레고리우스는 578년 프랑크 왕 킬페리크 1세가 보낸 군대와 브로 와로크의 와로크 2세가 싸운 끝에 와로크가 벤느에 대한 프랑크의 주권을 인정하고 인질과 공납을 약속했다고 적으며, 589~590년 무렵 군트람의 원정군이 다시 와로크와 싸웠다고 적는다. 636년 무렵 돔노네의 유디카엘이 다고베르트 1세를 찾아 평화를 맺었다(『프레데가리우스 연대기』). 『메스 연대기』는 753년 피핀 3세가 벤느를 차지하고 브르타뉴를 복속시켰다고 적는데, 실제로는 벤느·렌·낭트를 낀 변경령을 세운 정도로 본다. 778년 론세스바예스에서 죽은 롤랑이 변경백이었다. 786년 집사 아다울프가 이끈 프랑크군이 브리튼인에게서 인질을 받았고, 799년 변경백 귀도(비도)가 브르타뉴의 우두머리들에게서 무기를 거두어 카롤루스에게 바쳤다고 『프랑크 왕국 연대기』는 적는다. 프랑크의 지배는 오래가지 못해 브르타뉴는 그 뒤에도 자립을 이어 갔다(뒤의 사건). 지도는 브르타뉴 서쪽(코트다르모르·피니스테르·모르비앙)을 799년 프랑크 땅으로 그리고 브리튼인 왕국들(묶음) 항목을 800년에 끝낸다."
  subjects: [brittonic-kingdoms, frankish-kingdom]
  links:
