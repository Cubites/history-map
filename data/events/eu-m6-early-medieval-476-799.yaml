  sources: ["Paul the Deacon, History of the Lombards (William Dudley Foulke 영역, 1907)", "Chris Wickham, Early Medieval Italy: Central Power and Local Society, 400–1000 (1981)", "Neil Christie, The Lombards: The Ancient Longobards (1995)", "Thomas F. X. Noble, The Republic of St. Peter: The Birth of the Papal State, 680–825 (1984)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
