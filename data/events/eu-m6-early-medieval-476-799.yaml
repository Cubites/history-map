- id: caucasus-580
  year: 580
  endYear: 787
  title:
    ko: "캅카스의 이베리아와 라지카: 사산·동로마·아랍 사이(580~787)"
  summary:
    ko: "카르틀리(동조지아, 이베리아)의 호스로이 왕조 왕국은 사산 페르시아의 종주 아래 있었고, 580년 호르미즈드 4세가 왕정을 없앴다. 588년 구아람 1세가 동로마 황제 마우리키오스에게서 쿠로팔라테스 칭호를 받아 이베리아 공국(대공 에리스타비)을 열었다. 591년 마우리키오스와 호스로 2세의 조약으로 동로마는 아르메니아 서부(타론·바그레반드·시라크)를 얻었다. 627년 헤라클레이오스가 하자르와 함께 트빌리시를 에워쌌고, 뒤에 카르틀리는 사산, 동로마, 아랍 칼리프국의 종주를 차례로 받았다. 서조지아의 라지카 왕국(에그리시)은 522년 차트 1세가 콘스탄티노폴리스에서 세례를 받고 동로마의 종주를 받았고, 라지카 전쟁(541~562)에서 페르시아가 541년 페트라를 차지했다가 550~551년 동로마가 되찾아 성벽을 허물었고, 562년 50년 화약은 라지카를 동로마의 종속국으로 인정했다. 736년 마르완 이븐 무함마드의 원정으로 트빌리시에 아랍 토후가 들어서자 이베리아 공국의 카르틀리·메스헤티·클라르제티는 지도에서 빈 땅이 되고(근사), 아르칠 공(후대 전승은 왕)은 카헤티로 물러나 786년 아랍에게 순교했다고 전한다. 787년 그리골이 카헤티 공국을 세웠다. 서쪽에서는 778년 무렵 라지카와 아바스기아의 레온 2세가 동로마의 종주에서 벗어나 아브하지아 왕을 칭하고 쿠타이시를 도읍으로 삼았다고 한다(하자르의 도움이 있었다는 전승이 있으며 연대는 780년대로 보기도 한다). 지도는 580년 이베리아 왕국을 지우고 588년 이베리아 공국을, 778년 라지카를 아브하지아 왕국으로, 787년 이베리아 공국을 카헤티-헤레티 왕국으로 바꿔 그린다."
  subjects: [iberia-kingdom, iberia-principate, lazica, abkhazia-kingdom, kakheti-hereti, byzantine-empire, khazar-khaganate]
  links:
