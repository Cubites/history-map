- id: avar-campaigns-791
  year: 791
  endYear: 803
  title:
    ko: "카롤루스의 아바르 원정(791~803): 링의 함락과 아바르 칸국의 몰락"
  summary:
    ko: "567년부터 판노니아를 차지한 아바르 칸국은 8세기 말 바이에른과 프리울리를 거듭 노렸고, 788년 바이에른 공 타실로가 폐위된 뒤 국경이 프랑크와 맞닿았다. 791년 카롤루스는 도나우강을 따라 아바르 땅으로 쳐들어가 엔스강을 넘어 라브강 근처까지 땅을 쑥대밭으로 만들었다(큰 싸움은 없었고 말 대부분이 병으로 죽었다고 전한다). 792년 작센의 반란으로 원정은 이어지지 못했다. 아바르 안에서는 카간과 유구루스가 살해되는 내분이 벌어졌고, 795년 프리울리 공 에리크가 아바르 지배층의 요새 '링'을 약탈해 보물을 아헨으로 보냈다. 796년 카롤루스의 아들 피핀이 다시 링을 무너뜨리고 막대한 전리품을 가져왔다(아인하르트는 수 세대에 걸쳐 모은 이 재물로 프랑크인이 부유해졌다고 쓴다). 795~796년 아바르 투둔이 카롤루스에게 사절을 보내 세례를 청했고, 796년 칸이 피핀에게 항복했으며, 803년 말 아바르와 슬라브의 수령들이 레겐스부르크에서 카롤루스에게 신서했다. 799년에는 바이에른 총독 게롤트도 아바르와 싸우다 전사했다. 지도는 791년 니더외스터라이히를, 796년 판노니아와 시르미움을 프랑크 땅으로 그리며 티서강 평원의 아바르 칸국은 800년 뒤까지 남긴다(뒤의 사건). 799년 에리크는 아드리아해의 타르사티카에서 주민의 매복으로 죽었다. 아바르가 6세기 이래 동로마·프랑크·롬바르드에 가한 약탈과 슬라브 신민에게 받은 공납, 프랑크군의 791년 파괴와 796년 전리품 반출이 모두 사료에 나온다."
