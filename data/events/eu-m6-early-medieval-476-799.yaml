- id: cordoba-emirate-756
  year: 756
  endYear: 799
  title:
    ko: "압드 알라흐만 1세와 코르도바 아미르국(756), 카롤루스의 에스파냐 원정과 론세스바예스(778)"
  summary:
    ko: "아바스 혁명(750)으로 다마스쿠스의 우마이야 가문이 몰살될 때 살아남은 압드 알라흐만 1세(731~788)는 북아프리카를 떠돌다 755년 알안달루스에 상륙했다. 756년 5월 코르도바 가까이에서 총독 유수프 알피흐리를 꺾고 아미르를 칭했으며 아바스 칼리프를 인정하지 않았다(그전까지 알안달루스는 칼리프국의 총독이 다스렸다). 763년에는 아바스가 보낸 원정군을 무찔렀다. 북쪽에서는 피핀이 759년 나르본을 차지했고(지도는 759년 나르본을 프랑크 땅으로 그린다), 777년 바르셀로나의 총독 술라이만 알아라비가 압드 알라흐만에 맞서 카롤루스에게 도움을 청했다. 778년 카롤루스는 팜플로나를 거쳐 사라고사로 나아갔으나 도시는 문을 열지 않았고, 그는 인질을 받고 돌아서며 팜플로나의 성벽을 허물었다. 8월 15일(전승) 피레네 산길 론세스바예스에서 후위가 습격당해 궁정 집사 에기하르트와 브르타뉴 변경백 흐루오틀란트(롤랑)가 죽었다. 습격한 쪽은 바스크인으로 적혔으나(아인하르트) 뒷날 『롤랑의 노래』는 사라센으로 바꾸었다. 카롤루스는 778년 툴루즈에 백작을 두었고 781년 아들 루트비히를 아키텐 왕으로 세워 에스파냐 변경을 맡겼다. 785년 지로나가 프랑크 쪽에 들었다(지도는 785년). 788년 압드 알라흐만이 죽은 뒤 히샴 1세(788~796)는 793년 셉티마니아로 쳐들어갔고 하캄 1세(796~822)가 이었으며, 799년 팜플로나 사람들이 코르도바가 세운 총독 무타리프를 죽여 지도는 그해 팜플로나를 비우고 하카 일대를 프랑크 땅으로 그린다."
  subjects: [cordoba-emirate, umayyad-caliphate, frankish-kingdom, county-of-toulouse]
  links:
    - { from: frankish-kingdom, to: cordoba-emirate, note: "사라고사 원정(778)" }
    - { from: cordoba-emirate, to: frankish-kingdom, note: "지로나(785)·팜플로나(799) 변경 다툼" }
  tags: [politics, war]
  sources: ["Roger Collins, The Arab Conquest of Spain, 710–797 (1989)", "Bernhard Walter Scholz 옮김, Carolingian Chronicles: Royal Frankish Annals and Nithard's Histories (1970)", "Einhard, Life of Charlemagne (Lewis Thorpe 영역, 1969)", "Hugh Kennedy, Muslim Spain and Portugal: A Political History of al-Andalus (1996)", "Roger Collins, Caliphs and Kings: Spain, 796–1031 (2012)"]
