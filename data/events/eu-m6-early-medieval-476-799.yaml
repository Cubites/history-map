- id: north-sea-690
  year: 690
  endYear: 795
  title:
    ko: "북해의 이교도 세계: 프리지아·데인인 선교(690)와 린디스판 습격(793)"
  summary:
    ko: "690년 노섬브리아 출신 수도사 윌리브로드가 열한 명의 동료와 프리지아로 건너가 선교를 시작했다. 피핀 2세가 689년 도레스타드에서 프리지아 왕 라드보드를 물리쳐 서프리지아를 얻은 터라 프랑크의 보호가 따랐고, 695년 윌리브로드는 로마에서 프리지아인의 대주교로 서임되어 위트레흐트에 주교좌를, 에흐테르나흐에 수도원(698)을 두었다(지도는 697년 도레스타드 일대를 프랑크 땅으로 그린다). 카롤루스 마르텔이 719년 라드보드가 죽은 뒤와 734년에 프리지아를 눌렀고(지도는 720·736년), 754년 보니파티우스가 도쿰에서 프리지아인에게 죽었다. 알쿠인의 『윌리브로드 전』은 윌리브로드가 700년 무렵 덴마크의 왕 옹겐두스를 찾았으나 '야수보다 사납고 돌보다 단단한' 왕이 개종하지 않았다고 적는다(지도는 700년 덴마크 왕국(초기)을 세우고 게르만 부족의 땅을 줄인다). 737년 무렵 데인인은 남쪽 경계에 다네비르케를 쌓기 시작했다. 777년 작센의 비두킨트가 덴마크 왕 시구프레드에게 달아났다. 793년 6월 8일(『앵글로색슨 연대기』의 날짜는 1월 8일이나 학계는 6월 8일의 잘못으로 본다) '이교도들'이 린디스판 수도원을 약탈하고 수도사들을 죽이거나 잡아갔다고 『앵글로색슨 연대기』는 적는다. 이듬해 자로와 몽크위어머스, 795년 아일랜드 왕국들의 북쪽 해안(렉루 섬)이 습격받았고 802년 아이오나가 불탔다. 알쿠인은 노섬브리아 왕에게 이런 공포는 앵글로색슨 왕국들이 사는 브리튼에 일찍이 없었다고 편지를 썼다. 습격자는 노르웨이 서부 쪽 사람들로 추정하나 확실하지 않으며, 이 습격이 '바이킹 시대'의 시작으로 꼽힌다(뒤의 사건)."
  subjects: [germanic-tribes, denmark-early, frankish-kingdom, anglo-saxon-kingdoms, irish-kingdoms]
  links:
