- id: celtic-north-563
  year: 563
  endYear: 741
  title:
    ko: "아일랜드와 스코틀랜드의 수도원: 콜룸바(563)·콜룸바누스·넥탄스미어(685)·달리어타의 끝(741)"
  summary:
    ko: "아일랜드는 5세기 파트리키오스의 선교 뒤 부족마다 수도원이 중심이 되는 교회로 자랐다. 563년 콜룸바(콜름 킬레)가 달리어타로 건너가 아이오나에 수도원을 세웠고 픽트 왕 브리데이를 찾았다고 아도마난의 『콜룸바 전』은 전한다. 아일랜드 수도사들은 '순례'로 바다를 건너 선교했다. 콜룸바누스(543 무렵~615)는 590년 프랑크 왕국의 갈리아로 가서 뤽쇠이 수도원을 세웠다가 610년 테우데리크 2세와 브룬힐데에게 쫓겨났고 614년 롬바르드 왕 아길룰프의 보호를 받아 보비오에 정착했다. 아이오나의 에이단은 635년 노섬브리아의 린디스판으로 갔다(뒤의 사건). 685년 넥탄스미어에서 픽트 왕 브리데이 막 벨리가 노섬브리아 왕 에크프리스를 죽여 노섬브리아의 북쪽 지배가 끝났다. 달리어타 왕국은 아일랜드 북동부의 왕가가 스코틀랜드 서해안에 세운 나라로, 741년 픽트 왕 앵거스 막 퍼구사(729년 드레스트를 이긴 뒤 732년 무렵부터 왕, ~761)가 정복했다(얼스터 연대기. 지도는 741년부터 아가일을 픽트 땅으로 그린다). 앵거스는 756년 노섬브리아와 함께 스트래스클라이드 왕국의 알트 클루트(덤바턴)를 에워싸 항복을 받았다. 아일랜드 왕국들(묶음)은 이 시기 우이 닐 가문의 대왕 자리를 두고 다투었고 수도원은 땅과 부를 쌓았다. 지도는 아일랜드 전체를 아일랜드 왕국들로, 스코틀랜드 북부를 픽트 왕국으로 그린다."
  subjects: [irish-kingdoms, picts, dal-riata, strathclyde, frankish-kingdom, lombard-kingdom]
