- id: lombard-italy-568
  year: 568
  endYear: 751
  title:
    ko: "롬바르드의 이탈리아(568)와 라벤나 총독령: 알보인에서 아이스툴프까지"
  summary:
    ko: "568년 4월 롬바르드의 알보인은 판노니아를 아바르에게 넘기고 이탈리아로 옮겼다(작센인 등 다른 무리도 따랐다고 파울루스 디아코누스는 전한다). 569년 9월 밀라노를 차지했고 파비아는 3년 포위 끝에 572년 항복해 도읍이 되었으며, 알보인은 572년 아내 로자문다가 꾸민 일로 살해되었고, 다음 왕 클레프(572~574)도 살해된 뒤 574~584년 왕 없이 공작들이 다스리다 프랑크의 위협 앞에 아우타리(584~590)가 왕권을 되살렸고, 아길룰프(591~616)와 가톨릭 왕비 테오델린다는 교황 그레고리우스 1세(590~604)와 화평을 오가며 이탈리아의 정세를 이끌었고, 아달로알드(616~626)와 아리오알드(626~636)가 이었다. 동로마는 롬바르드에 맞서 라벤나에 총독(엑사르코스)을 두어 군정과 민정을 맡겼다. 로타리(636~652)가 643년 리구리아를 얻고 법전을 펴냈다. 콘스탄스 2세는 그리모알트(662~671) 때인 663년 이탈리아에 원정했으나 베네벤토를 꺾지 못하고 시칠리아로 갔다. 베네벤토 공 로무알드 1세가 660년대 후반~670년대에 타란토와 브린디시를 얻었다(지도는 바리·타란토를 681년으로 그린다). 리우트프란드(712~744)는 727~728년 볼로냐 등을 차지하고 수트리 땅을 교황에게 넘겼다(수트리의 기증, 728). 라치스(744~749)에 이어 왕이 된 아이스툴프가 751년 라벤나 총독령을 끝냈다(뒤의 사건). 697년 베네치아 석호에서 첫 도제를 뽑았다는 전승이 있고, 베네치아는 동로마의 종주 아래 자치 공국으로 자랐다. 그레고리우스 1세의 편지는 롬바르드의 약탈과 살육, 동로마 관리의 무거운 세금, 로마의 굶주림을 하소연한다. 지도는 568년 알보인의 이탈리아를 시작으로 569·572·576·603·643·681·736·751년 롬바르드와 동로마의 경계를 바꿔 그린다."
  subjects: [lombard-kingdom, byzantine-empire, venice, avar-khaganate, frankish-kingdom]
  links:
    - { from: avar-khaganate, to: lombard-kingdom, note: "판노니아 양도와 롬바르드의 이주(568)" }
