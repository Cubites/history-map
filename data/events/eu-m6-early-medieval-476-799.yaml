- id: turks-avars-551
  year: 551
  endYear: 583
  title:
    ko: "돌궐의 성립(552)과 아바르의 서진: 게피드의 멸망(567)과 동로마-돌궐 동맹(568)"
  summary:
    ko: "552년 돌궐의 부민이 몽골 초원의 유연을 무너뜨렸고 유연 카간 아나괴는 자살했다. 부민이 죽자 아들 이식 카간(552~553)을 거쳐 목간 카간(553~572)이 유연의 남은 무리를 쫓아 초원의 주인이 되었고 부민의 동생 이스테미가 서쪽을 맡아 559년 무렵 사산과 손잡고 에프탈을 눌렀다. 551년 돌궐이 고구려의 신성과 백암성을 쳤다는 『삼국사기』의 기록이 있다(이해 고구려는 한강 유역을 백제·신라에 잃었다). 돌궐에 밀려난 일부 유목민이 서쪽으로 움직여 558년 아바르를 자처하는 무리가 콘스탄티노폴리스에 사절을 보내 땅과 선물을 청했다(아바르가 유연의 후예인지는 학계가 다툰다). 유스티니아노스는 이들로 훈·불가르계 유목민(우니구르·잘리·사비르 등, 메난드로스)을 누르게 했고, 아바르는 560년대 튀링겐까지 올라가 프랑크와 부딪쳤다. 567년 아바르는 롬바르드와 손잡고 게피드 왕국을 무너뜨렸고, 568년 알보인의 롬바르드가 이탈리아로 떠난 뒤 판노니아에 바얀 카간의 칸국을 세웠다(지도는 567년 시르미움을 동로마 땅으로, 568년 판노니아를 아바르 땅으로 그린다). 같은 568년 소그드인 마니아흐가 이끈 돌궐의 사절이 동로마 황제 유스티노스 2세를 찾았고, 동로마의 제마르코스가 돌궐 땅을 다녀와 사산에 맞서는 동맹을 맺었다(메난드로스). 576년 돌궐은 크림의 보스포로스를 차지했다(지도에는 그리지 않는다). 582년 바얀은 3년 포위 끝에 시르미움을 얻었다(지도는 582년). 동쪽에서는 581년 양견이 수를 세운 뒤 돌궐 안의 다툼을 부추겨 돌궐이 동과 서로 갈라졌다(지도는 582년에 돌궐을 끝내고 583년 동돌궐을 따로 그린다). 607년 수 양제가 동돌궐 계민 카간의 장막에서 고구려 사신을 보았다고 『수서』는 적는다."
  subjects: [gokturk, rouran, eastern-turks, avar-khaganate, gepid-kingdom, lombard-kingdom, byzantine-empire, hunnic-bulgar-tribes, sui, goguryeo]
  links:
    - { from: gokturk, to: byzantine-empire, note: "마니아흐와 제마르코스의 사절, 사산에 맞선 동맹(568~)" }
    - { from: avar-khaganate, to: gepid-kingdom, note: "게피드 멸망(567)" }
  tags: [war, diplomacy]
  sources: ["The History of Menander the Guardsman (R. C. Blockley 영역, 1985)", "Walter Pohl, The Avars: A Steppe Empire in Central Europe, 567–822 (2018)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (1992)", "『수서』 돌궐전", "『삼국사기』 고구려본기 양원왕 7년(551)"]

- id: toledo-kingdom-552
  year: 552
  endYear: 624
  title:
    ko: "서고트의 톨레도 왕국: 스파니아(552)·레오비길드와 수에비 병합(585)·레카레드의 개종(589)"
  summary:
    ko: "고트 왕 아길라 1세(549~554)에 맞선 귀족 아타나길드가 551년 반란을 일으키며 유스티니아노스에게 도움을 청했고, 동로마 장군 리베리우스의 군대가 552년 남동 해안에 상륙했다. 아타나길드(554~567)는 왕이 된 뒤에도 이들을 몰아내지 못했고, 카르타헤나와 말라가를 낀 동로마 속주 '스파니아'가 남았다(지도는 552년부터 남동 해안을 동로마 땅으로 그린다). 리우바 1세(567~572 무렵)의 아우 레오비길드(공동왕 568~, 단독 572~586)는 톨레도를 중심으로 왕국을 다시 모았다. 571~572년 아시도나와 코르도바 쪽 동로마 땅을 되찾았고(지도는 572년), 574년 칸타브리아의 아마야를 차지했으며(지도는 574년), 578년 아들 레카레드를 위해 도시 레코폴리스를 세웠다. 아들 헤르메네길드가 가톨릭으로 개종해 세비야에서 일으킨 반란(579~584)을 수에비는 도왔으나 동로마는 레오비길드에게 금화 3만을 받고 물러났고, 레오비길드가 눌렀고 헤르메네길드는 585년 처형되었다. 같은 585년 레오비길드는 수에비 왕국을 병합해 갈리시아를 차지했다. 레카레드 1세(586~601)는 589년 제3차 톨레도 공의회에서 서고트 왕국의 가톨릭 개종을 선언하고 아리우스파 주교들의 귀의를 받았다. 이 뒤 왕이 주교들과 함께 공의회에서 법을 정하는 체제가 굳었다. 리우바 2세·비테리크·군데마르·시세부트·레카레드 2세를 거친 수인틸라(621~631)는 624년 동로마의 마지막 스파니아 거점(카르타헤나로 본다)을 차지해 처음으로 반도 전체를 한 왕이 다스리게 했다(지도는 624년 스파니아를 서고트 땅으로 그린다)."
  subjects: [visigothic-kingdom, suebi-kingdom, byzantine-empire]
  links:
    - { from: byzantine-empire, to: visigothic-kingdom, note: "스파니아 속주(552~624)" }
    - { from: visigothic-kingdom, to: suebi-kingdom, note: "수에비 병합(585)" }
  tags: [politics, war]
  sources: ["Isidore of Seville, History of the Goths, Vandals, and Suevi (Guido Donini·Gordon B. Ford 영역, 2판, 1970)", "Roger Collins, Visigothic Spain, 409–711 (2004)", "E. A. Thompson, The Goths in Spain (1969)", "Roger Collins, Early Medieval Spain: Unity in Diversity, 400–1000 (2판, 1995)"]
