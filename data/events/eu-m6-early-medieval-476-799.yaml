- id: khazars-650
  year: 650
  endYear: 799
  title:
    ko: "하자르 칸국의 성립(650 무렵)과 아랍-하자르 전쟁, 동슬라브의 공납"
  summary:
    ko: "하자르는 서돌궐에서 갈라진 튀르크계 유목민으로 650년 무렵 볼가강 하류와 북캅카스 초원에서 일어났고, 668년 쿠브라트의 대불가리아가 흩어진 뒤 흑해 북쪽 초원을 차지했다(지도는 650년 볼가강 하류와 다게스탄 북쪽, 668년 대불가리아의 초원을 그린다). 627년 헤라클레이오스와 손잡았던 하자르는 아랍과 오래 싸웠다. 정통 칼리프 시기인 652년 발란자르에서 아랍군이 크게 졌고, 우마이야 칼리프국의 아랍군이 722~737년 데르벤트를 넘어 되풀이해 쳐들어왔으며 737년 마르완 이븐 무함마드가 하자르의 도읍 가까이에 이르러 카간에게 이슬람을 받아들이겠다는 약속을 받았다. 동로마와는 혼인 동맹을 맺어, 레온 3세의 아들 콘스탄티노스(뒤의 콘스탄티노스 5세)가 732~733년 하자르 공주(세례명 이레네)와 혼인했고 그 아들이 레온 4세이다. 하자르 지배층은 8세기 말~9세기 초 유대교를 받아들였다고 하나 연대는 갈린다. 『원초 연대기』는 폴랴네·세베랴네·뱌티치 같은 동슬라브 부족이 하자르에게 공납했다고 적는다(연대기는 이 공납을 859년 항목에 적으며 공납물은 판본마다 다르다). 지도는 700년부터 드니프로강 상류·일멘호·오카강의 숲 지대를 발트 부족(묶음)과 핀우그르 부족(묶음)에서 동슬라브 부족으로 바꿔 그리는데(7~8세기 슬라브 정착의 근사이며 연대기의 해는 없다), 키이우 쪽의 폴랴네와 세베랴네는 476년부터 동슬라브로 그린다. 크림 반도의 고트인 주교 요안니스가 하자르에 맞서 787년 반란을 일으켰다는 전승이 있다(지도는 787년 크림 고티아를 하자르 땅으로 그린다)."
  subjects: [khazar-khaganate, east-slavic-tribes, baltic-tribes, finnic-tribes, byzantine-empire, umayyad-caliphate]
  links:
    - { from: umayyad-caliphate, to: khazar-khaganate, note: "아랍-하자르 전쟁(722~737)" }
    - { from: khazar-khaganate, to: east-slavic-tribes, note: "공납(『원초 연대기』)" }
