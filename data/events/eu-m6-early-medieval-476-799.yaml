  sources: ["C. H. Talbot 옮김, The Anglo-Saxon Missionaries in Germany (1954)", "The Anglo-Saxon Chronicle (Michael Swanton 영역, 1996)", "Alcuin of York (Stephen Allott 영역, 1974)", "Ian N. Wood, The Missionary Life: Saints and the Evangelisation of Europe, 400–1050 (2001)", "Birgit Sawyer·Peter Sawyer, Medieval Scandinavia: From Conversion to Reformation, circa 800–1500 (1993)"]
