- id: mercia-offa-626
  year: 626
  endYear: 796
  title:
    ko: "머시아의 패권: 펜다에서 오파와 오파의 방벽까지"
  summary:
    ko: "앵글로색슨 왕국들의 하나인 머시아(트렌트강 상류, 탬워스)는 펜다(626 무렵~655)가 628년 사이렌세스터에서 웨식스와 맞붙어 휘시 땅(글로스터셔·우스터)을 얻으며 커졌다(지도는 632년). 이교도 펜다는 웨일스 공국들의 캐드월런과 손잡고 633년 노섬브리아의 에드윈을 죽였고 642년 오스월드를 죽였으나 655년 오스위에게 졌다. 아들 피다가 오스위의 도움으로 남머시아를 맡았다 656년 살해되었고 오스위가 658년까지 직접 다스렸다. 658년 웨식스의 쿠엔왈흐가 페온난에서 브리튼인 왕국들(묶음)을 쳐 도싯과 서머싯을 얻었고(지도는 659년), 펜다의 다른 아들 울프헤어(658~675)가 661년 웨식스를 눌러 템스강 상류와 칠턴 땅을 얻었다(지도는 668년). 웨식스의 이네(688~726)는 710년 브리튼인의 덤노니아 왕 게런트를 쳐 데번을 차지하고 법전을 펴냈다(지도는 711년). 머시아의 에설발드(716~757)는 험버강 남쪽의 여러 왕국을 복속시켰다고 베다가 쓸 만큼 컸으나 752년 버퍼드에서 웨식스에 졌고 757년 살해되었다. 베오른레드가 잠깐 왕이었다가 오파(757~796)가 쫓아내고 올랐다. 오파는 켄트·서식스·동앵글리아를 눌렀고 은화(페니)를 정비했으며 787년 릭필드 대주교구를 세웠다. 794년 동앵글리아 왕 에설베르트가 오파 쪽에 살해되었고, 796년 오파는 프랑크 왕국의 카롤루스와 서신을 주고받으며 상인 보호를 합의했다. 웨일스와의 경계를 따라 난 오파의 방벽(현존하고 이어지는 구간은 약 100~130km이고 바다에서 바다까지 이었다고 본 추정은 약 240km)은 어서의 『알프레드 전』이 오파가 쌓았다고 전하나, 얼마나 오파 때 만들어졌는지는 학자들이 다툰다. 오파가 죽은 뒤 머시아는 약해져 825년 엘렌던에서 웨식스에 졌다(뒤의 사건)."
  subjects: [anglo-saxon-kingdoms, wessex, brittonic-kingdoms, welsh-principalities, frankish-kingdom]
