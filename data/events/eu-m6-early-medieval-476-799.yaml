- id: austrasia-neustria-561
  year: 561
  endYear: 687
  title:
    ko: "아우스트라시아와 네우스트리아: 브룬힐데와 프레데군트에서 테르트리 전투(687)까지"
  summary:
    ko: "561년 클로타르 1세가 죽자 네 아들이 다시 왕국을 나눴다: 샤리베르트 1세(파리), 군트람(오를레앙·부르군디아), 시기베르트 1세(랭스·메스, 아우스트라시아), 킬페리크 1세(수아송, 네우스트리아). 시기베르트가 서고트 왕 아타나길드의 딸 브룬힐데와 혼인하자 킬페리크는 그 언니 갈스윈타를 맞았다가 그녀가 목 졸려 죽은 뒤(그레고리우스는 킬페리크가 죽였다고 적는다) 프레데군트와 혼인했고, 두 왕비를 둘러싼 원한이 반세기 가까이 싸움으로 이어졌다(시기베르트는 575년, 킬페리크는 584년에 살해되었다). 군트람이 592년 죽자 브룬힐데의 아들 킬데베르트 2세(575~595)가 아우스트라시아와 부르군디아를 이었고, 그가 죽은 뒤 브룬힐데는 손자 테우데베르트 2세·테우데리크 2세를 앞세워 다스렸으나, 613년 귀족들이 네우스트리아 왕 클로타르 2세 편에 서서 그녀를 넘겼고 클로타르는 그녀를 말에 매달아 죽였다(『프레데가리우스 연대기』). 614년 파리 칙령으로 귀족과 교회의 권리가 커졌다. 다고베르트 1세(629~639)는 마지막으로 힘 있는 메로빙거 왕이었으나 631년 슬라브 왕 사모에게 패했고(뒤의 사건), 이후 왕들은 어려서 즉위하거나 일찍 죽어 실권이 궁재에게 넘어갔다(아인하르트는 이 왕들을 소달구지를 타는 허수아비로 그린다). 아우스트라시아의 궁재 가문(랑덴의 피핀 1세, 메스의 아르눌프의 후손)은 656년 그리모알트의 쿠데타에 실패하고도 다시 일어서 네우스트리아의 궁재 에브루앵(658~673, 675~680)과 오래 다퉜다. 아키텐에서는 670년대 루푸스 공이 사실상 자립했다고 하나 왕에 대한 충성 여부는 학계에서 갈린다. 687년 테르트리 전투에서 아우스트라시아의 궁재 피핀 2세(헤르스탈)가 네우스트리아 왕 테우데리크 3세와 궁재 베르카르를 꺾어 프랑크 전체의 실권자가 되었다. 지도는 아우스트라시아·네우스트리아·부르군디아를 한 나라(프랑크 왕국)로 그리고, 아키텐은 718년부터 따로 그린다."
