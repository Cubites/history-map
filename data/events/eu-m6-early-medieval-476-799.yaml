- id: visigoth-jews-612
  year: 612
  endYear: 694
  title:
    ko: "서고트의 유대인 정책: 시세부트의 강제 개종(612)에서 톨레도 제17차 공의회(694)까지"
  summary:
    ko: "서고트 왕국의 유대인은 로마 시대부터 이베리아에 살았고, 아리우스파 왕들 아래서는 비교적 방해받지 않았다. 589년 레카레드의 가톨릭 개종 뒤 공의회와 왕들은 유대인을 공직과 기독교인 노예 소유에서 배제하기 시작했고, 시세부트(612~621)는 612년 무렵 칙령으로 유대인에게 세례를 받거나 떠나라고 명했다(많은 수가 세례를 받았고 일부는 떠났다고 한다). 633년 제4차 톨레도 공의회는 세비야의 이시도루스의 뜻에 따라 앞으로는 억지로 믿게 해서는 안 된다고 하면서도 이미 세례받은 이들이 유대교로 돌아가는 것은 막았다. 킨틸라(636~639) 때 638년 제6차 공의회가 개종한 유대인의 신앙 서약을 요구했고, 킨다스빈트(642~653)는 강제 개종을 다시 밀어붙였으며, 레세스빈트(653~672)의 『서고트 법』(654)은 유대교 의례(할례·유월절·음식 규정)와 기독교인과의 혼인을 금했다. 밤바(672~680)를 거쳐 에르비히(680~687)는 681년 제12차 공의회에서 유대인이 정해진 기한까지 세례를 받지 않으면 재산을 몰수하고 매질한 뒤 추방한다는 법을 냈다. 에기카(687~702)는 694년 제17차 공의회에서, 유대인이 바다 건너 같은 신앙인들과 짜고 왕국을 뒤엎으려 했다는 혐의(사실 여부는 알 수 없다)로 모든 유대인의 재산을 몰수하고 노예로 삼으며 일곱 살 넘는 아이들을 기독교인 가정에 맡기라고 명했다. 이 법들이 되풀이된 것은 집행이 고르지 않았음을 보여 준다고 보며, 711년 정복 때 유대인이 아랍을 도왔다는 전승은 뒷날 사료에서 나오고 학자들은 의심한다. 이 정책의 주체는 왕과 주교들이며 남은 기록도 교회와 왕실의 것이다."
  subjects: [visigothic-kingdom]
  tags: [society, politics]
  sources: ["Roger Collins, Visigothic Spain, 409–711 (2004)", "E. A. Thompson, The Goths in Spain (1969)", "Roger Collins, Early Medieval Spain: Unity in Diversity, 400–1000 (2판, 1995)"]

- id: northumbria-616
  year: 616
  endYear: 735
  title:
    ko: "노섬브리아의 시대: 에드윈에서 휘트비 시노드(664)와 베다(735)까지"
  summary:
    ko: "앵글로색슨 왕국들 가운데 노섬브리아에서 애설프리스를 이은 에드윈(616~633)은 엘멧을 차지하고 627년 파울리누스에게 세례를 받았으나 633년 해트필드 체이스에서 웨일스 공국들(귀네드)의 캐드월런과 머시아의 펜다에게 죽었다(지도는 623년 엘멧과 체스터 쪽을 앵글로색슨 땅으로 그린다). 버니시아의 에안프리스와 데이라의 오스릭이 이었으나 둘 다 634년까지 캐드월런에게 죽었고, 오스월드(634~642)가 하늘의 들판에서 캐드월런을 물리치고 아이오나의 수도사 에이단을 불러 린디스판에 수도원을 세우게 했다. 642년 오스월드가 펜다에게 죽은 뒤 동생 오스위(642~670)가 655년 위닌 강가에서 펜다를 죽여 우위를 되찾았다. 638년 노섬브리아가 에든버러를 포위해 로디언을 얻었고(지도는 638년), 오스위는 브리튼인 왕국들의 레게드(컴브리아)를 혼인으로 이은 것으로 본다. 664년 휘트비 시노드에서 오스위는 아일랜드 전통 대신 로마의 부활절 계산을 따르기로 했고, 669년 타르소스의 테오도로스가 캔터베리 대주교로 와서 교구를 정비했다. 685년 에크프리스가 넥탄스미어에서 픽트 왕국의 군대에 죽어 노섬브리아의 북쪽 팽창은 끝났다(앞의 사건). 8세기 노섬브리아는 학문의 중심이 되었다. 자로와 몽크위어머스 수도원의 베다(673 무렵~735)가 731년 『잉글랜드 교회사』를 마쳤고, 그는 그리스도 탄생 뒤로 해를 세는 방식을 널리 퍼뜨렸으며, 린디스판 복음서도 8세기 초에 만들어졌다. 노섬브리아는 8세기 중엽부터 왕위 다툼으로 약해졌고 머시아가 앞섰다(뒤의 사건)."
