- id: muslim-iberia-asturias-711
  year: 711
  endYear: 757
  title:
    ko: "우마이야의 이베리아 정복: 과달레테(711)·나르본(720)과 아스투리아스의 시작(코바동가 718)"
  summary:
    ko: "서고트 왕 로데리크는 710년 왕이 되었으나 앞 왕 위티자의 일가와 갈라져 있었다고 전한다. 북아프리카 총독 무사 이븐 누사이르의 부하 타리크 이븐 지야드(베르베르 출신)가 711년 4월 지브롤터(자발 타리크)에 상륙했고(병력은 7천 명에서 1만 2천 명으로 늘었다고 아랍 사료는 전한다), 7월 과달레테 부근에서 로데리크를 꺾었다. 로데리크는 죽고 타리크는 코르도바와 톨레도로 나아갔다. 712년 무사가 군대를 이끌고 건너와 세비야와 메리다(713년 항복)를 차지했으며, 713년 서고트 귀족 테오데미르가 무르시아 일대 일곱 도시를 지키는 대신 공물을 내는 조약을 맺었다. 정복은 항복 조약을 맺은 도시와 맞서다 약탈당한 도시가 섞여 이루어졌고, 항복한 이들은 신앙을 지키는 대신 세금을 냈다. 714년 사라고사와 북서부, 716~718년 바르셀로나와 타라고나를 차지했고 720년 나르본에서 서고트 왕국의 마지막 조각(셉티마니아의 아르도)이 사라졌다(지도는 711·713·714·718·720년 버전). 718년 귀족 펠라요가 아스투리아스에서 우마이야 총독 무누자에게 맞서 코바동가에서 알카마의 군대를 물리쳤다고 『알폰소 3세 연대기』는 전한다(718년과 722년 설이 갈리고 당시 아랍 사료는 거의 언급하지 않아 작은 충돌이었다고 본다). 펠라요는 737년 죽고 아들 파빌라(737~739)를 거쳐 사위 알폰소 1세(739~757)가 740~741년 베르베르인의 반란으로 북쪽 수비대가 빠진 틈에 갈리시아·레온·칸타브리아를 차례로 아울렀다(740년대~750년대에 걸친 일이며, 지도는 718년부터 아스투리아스를 그리고 741년 일괄 근사로 갈리시아·레온·칸타브리아를 그 땅에 더하며 두에로강 유역은 비운다. 이곳이 비었다는 '두에로강 사막' 설은 학계에서 논쟁 중이다). 756년 압드 알라흐만 1세가 코르도바 아미르국을 세워 총독 시대가 끝났다(뒤의 사건)."
