- id: saxon-wars-772
  year: 772
  endYear: 804
  title:
    ko: "카롤루스의 작센 전쟁(772~804): 베르덴 학살(782)과 강제 개종"
  summary:
    ko: "작센인(엥게른·베스트팔렌·오스트팔렌과 엘베강 북쪽의 노르달빙기아)은 프랑크 왕국 동북쪽의 이교도 부족으로 변경을 자주 침범했다. 카롤루스는 772년 에레스부르크를 차지하고 작센인이 받들던 이르민술 기둥을 허물며 30년 넘게 이어질 전쟁을 시작했다. 777년 파더보른 제국 회의에서 많은 작센 귀족이 신서했으나 비두킨트는 덴마크 왕 시구프레드에게 달아났다. 782년 비두킨트가 돌아와 쥔텔 산 기슭에서 프랑크군을 무찌르자(사절 아달기스·게일로와 백작 여럿이 전사했다) 카롤루스는 베르덴에서 작센인 4,500명의 목을 베게 했다(『프랑크 왕국 연대기』. 수와 성격에는 논쟁이 있다). 작센 전체가 봉기해 783년 데트몰트와 하제강에서 싸웠고, 785년 비두킨트가 아티니에서 세례를 받았다. 카롤루스는 이 무렵 『작센 지방 칙령』으로 세례를 거부하거나 교회를 해치면 사형에 처한다고 정했다. 학자 알쿠인은 796년 믿음은 강요할 수 없다고 비판했다. 793~799년에도 반란이 이어졌고 798년 프랑크 편에 선 오보드리트(지도는 서슬라브 부족 묶음)가 보른회베드에서 노르달빙기아의 작센인을 이겼다. 카롤루스는 반란 지역 주민을 가족째 프랑크 땅으로 옮겼고, 804년에는 엘베강 건너 작센인을 옮기고 그 땅을 오보드리트에게 주었다고 연대기는 적는다(후대 요약은 약 1만 명이라 하나 연대기에 수는 없다). 작센은 브레멘·파더보른 등 주교구와 백작령으로 프랑크 왕국에 들었다. 지도는 785년 작센을, 798년 노르달빙기아를 프랑크 땅으로 그리고 게르만 부족(묶음)이 798년에 끝난다."
  subjects: [frankish-kingdom, germanic-tribes, slavic-tribes, denmark-early]
