- id: heraclius-persia-602
  year: 602
  endYear: 628
  title:
    ko: "헤라클레이오스와 사산 전쟁(602~628): 예루살렘 함락과 콘스탄티노폴리스 포위(626)"
  summary:
    ko: "602년 군대가 반란을 일으켜 황제 마우리키오스를 죽이고 포카스를 세우자 사산의 호스로 2세는 '마우리키오스의 복수'를 내걸고 쳐들어왔다. 페르시아군은 604~605년 다라, 611~613년 안티오키아, 613년 다마스쿠스, 614년 예루살렘(성십자가를 가져갔고 『안티오코스 스트라테고스』는 수만 명이 죽었다고 적으나 과장 가능성이 크다), 619년 알렉산드리아를 차지했다. 610년 카르타고 총독의 아들 헤라클레이오스가 포카스를 쫓아내고 즉위했으나 몇 해 동안 막지 못했고 615년 페르시아군이 칼케돈까지 닿았다(617년 함락). 622년 헤라클레이오스는 반격에 나서 아르메니아와 캅카스를 거쳐 사산 땅 깊이 쳐들어가 624년 간자크의 불의 신전을 부수고 628년 초 다스타기르드의 궁을 약탈했다(동로마 쪽의 파괴도 있었다). 626년 페르시아군이 칼케돈에 머무는 가운데 6월 29일 아바르의 선봉(약 3만)이 성벽 앞에 이르고 7월 말~8월 초 카간과 슬라브인이 육지 성벽을 공격했을 때 총대주교 세르기오스와 귀족 보노스가 도시를 지켰다. 8월 6~8일 공격이 실패하고 슬라브의 통나무배는 동로마 함대가 부쉈으며 아바르는 물러났다. 627년 헤라클레이오스는 튀르크계 하자르의 지에벨과 손잡고 트빌리시를 에워쌌고, 12월 12일 니네베 가까이에서 페르시아군을 꺾었다. 628년 2월 호스로 2세가 아들 카바드 2세에게 죽고 평화가 맺어졌으며, 헤라클레이오스는 630년 3월 성십자가를 예루살렘에 되돌렸다. 두 제국은 20여 년의 전쟁으로 지쳤고 몇 해 뒤 아랍이 쳐들어왔다(뒤의 사건). 같은 때 동아시아에서는 수가 고구려를 침공했다가 612년 살수에서 크게 지고(살수 대첩) 618년 당에게 자리를 내주었다. 지도는 페르시아의 점령(611~626)을 그리지 않고 동로마의 동쪽 국경을 591년 아르메니아에서 637년 아랍 변경까지 그대로 둔다."
  subjects: [byzantine-empire, avar-khaganate, sui, tang, goguryeo]
  links:
    - { from: avar-khaganate, to: byzantine-empire, note: "콘스탄티노폴리스 포위(626)" }
  tags: [war]
  sources: ["Walter E. Kaegi, Heraclius, Emperor of Byzantium (2003)", "John F. Haldon, Byzantium in the Seventh Century: The Transformation of a Culture (개정판, 1997)", "Cyril Mango·Roger Scott 옮김, The Chronicle of Theophanes Confessor (1997)", "Michael Whitby·Mary Whitby 옮김, Chronicon Paschale 284–628 AD (1989)", "『수서』 양제기"]
