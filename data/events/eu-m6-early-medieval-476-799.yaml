- id: iconoclasm-726
  year: 726
  endYear: 797
  title:
    ko: "동로마의 성상 파괴(726~787)와 이레네: 제2차 니케아 공의회(787)"
  summary:
    ko: "레온 3세(717~741)는 726년 무렵 성상을 떼어 내기 시작했다고 전한다(테오파네스. 칙령의 연대와 규모는 학계가 의심하며 730년 설도 있다). 아랍에게 지는 것이 신의 벌이라는 믿음과 726년 에게해의 화산 분출이 계기였다고 전한다. 총대주교 게르마노스는 730년 물러났고, 다마스쿠스의 요한은 칼리프국 안에서 성상 공경을 옹호했다. 콘스탄티노스 5세(741~775)는 754년 히에리아 공의회(주교 338명)에서 성상 숭배를 이단으로 정하고 성상을 지지하는 수도원을 눌렀다(수도사 스테파노스는 765년 처형되었다). 교황은 이를 거부했고, 751년 라벤나 총독령이 무너져 동로마의 보호를 기대하기 어려워지자 교황은 프랑크 쪽으로 기울었다(뒤의 사건. 지도는 751년 라벤나, 752년 사르데냐를 동로마 땅에서 빼고 756년 로마 공국을 교황령으로 그린다). 콘스탄티노스 5세는 756년부터 불가리아 제1제국을 쳐서 763년 안키알로스에서 이겼다(앞의 사건. 지도는 763년 자고라를 동로마 땅으로 그린다). 레온 4세(775~780)가 죽자 황후 이레네가 어린 콘스탄티노스 6세의 섭정이 되었다. 783년 장군 스타우라키오스가 그리스의 슬라브를 공납국으로 만들었다(지도는 783년 그리스를 동로마 땅으로 그리고 남슬라브 공국들 범위를 줄인다). 8세기 중엽부터 사실상 자립한 나폴리 공국과 가에타를 지도는 774년 롬바르드·캄파니아 공국들로 옮긴다. 787년 니케아에서 열린 제2차 니케아 공의회(일곱 번째 공의회, 총대주교 타라시오스, 교황 사절 참석)가 성상 공경을 되살렸다. 카롤루스의 궁정은 그리스어 번역의 오류('숭배'와 '공경'의 구별)로 이 공의회를 비판해 『카롤루스의 책』(790 무렵)을 냈고 794년 프랑크푸르트 회의에서 이를 거부했다. 790년 콘스탄티노스 6세가 이레네를 밀어냈다가 792년 다시 공동 통치하게 되었고, 797년 8월 이레네는 아들의 눈을 멀게 하고 홀로 다스렸다(여성이 단독 황제가 된 첫 예). 성상 파괴는 815~843년 한 번 더 이어졌다(뒤의 사건)."
  subjects: [byzantine-empire, papal-states, frankish-kingdom, first-bulgarian-empire, south-slavic-principalities, lombard-principalities]
  links:
