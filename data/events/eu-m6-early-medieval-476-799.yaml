  tags: [politics, culture, society]
  sources: ["Cyril Mango·Roger Scott 옮김, The Chronicle of Theophanes Confessor (1997)", "Leslie Brubaker·John Haldon, Byzantium in the Iconoclast Era, c. 680–850: A History (2011)", "Warren Treadgold, A History of the Byzantine State and Society (1997)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]

- id: pippin-papal-states-741
  year: 741
  endYear: 756
  title:
    ko: "피핀 3세의 즉위(751)와 피핀의 기증(756): 카롤링거 왕조와 교황령의 시작"
  summary:
    ko: "카롤루스 마르텔이 죽자(741) 아들 카를로만(아우스트라시아)과 피핀 3세(네우스트리아·부르군디아)가 나눠 다스렸고, 이복형제 그리포는 몫을 요구하다 라옹에서 포위되어 갇혔다. 두 형제는 743년 메로빙거의 마지막 왕 킬데리크 3세를 세워 체면을 지키면서 아키텐의 후날드와 바이에른의 오딜로, 알레만인의 반란을 눌렀고, 웨식스 출신 선교사 보니파티우스와 함께 프랑크 교회를 정비했다. 747년 카를로만이 몬테카시노로 물러나 피핀이 홀로 서자, 749~750년 사절(부르카르트 주교와 풀라드)이 교황 자카리아스에게 '권력을 가진 자가 왕으로 불리는 것이 낫지 않느냐'고 물어 긍정의 답을 얻었고, 751년 11월 수아송에서 피핀이 왕으로 뽑혀 도유를 받고 킬데리크 3세는 수도원에 보내졌다. 같은 751년 무렵(750년설도 있다) 롬바르드 왕 아이스툴프가 라벤나를 차지해 동로마의 총독령이 끝났고(지도는 751년), 그는 로마까지 위협했다. 동로마가 돕지 못하자 교황 스테파누스 2세가 754년 알프스를 넘어 생드니에서 피핀과 두 아들에게 도유하고 그를 '로마인의 보호자'로 불렀다. 피핀은 755년과 756년 두 차례 롬바르드를 쳤고 756년 파비아 포위 끝에 아이스툴프가 빼앗은 라벤나 총독령과 펜타폴리스 등의 도시를 교황에게 넘기게 했다(피핀의 기증). 동로마 사절이 반환을 요구했으나 피핀은 거절했다. 이 땅이 교황령의 시작이 되었고, 지도는 로마 공국과 라벤나·펜타폴리스·페루자를 756년부터 교황령으로 그린다(774년부터 라벤나 쪽은 이탈리아 왕국 땅으로 바꾼다). 라벤나 총독령이 무너진 뒤 동로마 본토와 이어지기 어려워진 사르데냐는 지도에서 752년부터 이탈리아 소국들(묶음)로 그린다(근사)."
  subjects: [frankish-kingdom, papal-states, lombard-kingdom, byzantine-empire, italian-minor-states, bavaria-duchy, aquitaine-early]
