  tags: [war, politics, society]
  sources: ["Bernhard Walter Scholz 옮김, Carolingian Chronicles: Royal Frankish Annals and Nithard's Histories (1970)", "Einhard, Life of Charlemagne (Lewis Thorpe 영역, 1969)", "Rosamond McKitterick, Charlemagne: The Formation of a European Identity (2008)", "Alcuin of York (Stephen Allott 영역, 1974)", "Pierre Riché, The Carolingians: A Family Who Forged Europe (Michael Idomir Allen 옮김, 1993)"]
