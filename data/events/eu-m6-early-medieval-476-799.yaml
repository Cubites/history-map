- id: mayors-palace-687
  year: 687
  endYear: 741
  title:
    ko: "궁재의 시대: 카롤루스 마르텔과 투르-푸아티에(732)"
  summary:
    ko: "테르트리 전투(687) 뒤 프랑크의 실권을 쥔 피핀 2세는 714년 12월 죽었다. 과부 플렉트루데가 어린 손자들을 앞세워 권력을 지키려 하자 서자 카롤루스(뒷날 마르텔)가 감옥을 벗어나 715년 일어섰고, 717년 뱅시와 718년 수아송에서 네우스트리아의 왕 킬페리크 2세(715~721)와 궁재 라겐프리드를 꺾었다. 그는 717년 아우스트라시아에 클로타르 4세를 세웠고 721년 킬페리크 2세가 죽자 테우데리크 4세(721~737)를 세웠다. 킬페리크 2세와 손잡았던 아키텐의 오도(외드) 공은 사실상 독립했고(지도는 718년부터 아키텐 공국을 따로 그린다), 카롤루스는 프리지아인과 작센인 같은 게르만 부족, 알레만니아, 바이에른을 거듭 쳤다. 우마이야의 총독 알삼흐 이븐 말리크가 720년(719년설도 있다) 나르본을 차지하고 721년 툴루즈를 포위했으나 6월 9일 오도에게 패해 죽었다(교황에게 보낸 오도의 보고를 옮긴 『교황 열전』은 사라센 37만 5천 명이 죽었다고 적으나 터무니없는 과장이며, 같은 수가 뒤에 투르-푸아티에로 옮겨졌다). 732년 총독 압드 알라흐만 알가피키가 가론강에서 오도를 꺾고 보르도를 약탈하자 오도가 카롤루스에게 도움을 청했고, 10월 투르와 푸아티에 사이에서 카롤루스의 보병이 우마이야군을 막았다(알가피키 전사). 아랍 사료는 이곳을 '순교자들의 길'이라 부르며 패배를 짧게 적는다. 카롤루스는 군대를 키우려 교회 땅을 군인에게 나눠 주어 교회의 반발을 샀고, 736~739년 론강 가의 아비뇽과 프로방스를 되찾았으나 737년 나르본 포위는 실패했다. 737년 왕 테우데리크 4세가 죽은 뒤 왕을 세우지 않고 다스리다 741년 10월 22일 죽었다. 지도는 718년 아키텐을 프랑크에서 떼어 그리고, 720년 나르본 쪽 셉티마니아를 우마이야 땅으로 그린다."
  subjects: [frankish-kingdom, aquitaine-early, umayyad-caliphate, germanic-tribes, bavaria-duchy]
