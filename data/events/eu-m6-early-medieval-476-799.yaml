- id: gothic-war-535
  year: 535
  endYear: 554
  title:
    ko: "고트 전쟁(535~554): 벨리사리우스와 나르세스, 토틸라의 이탈리아"
  summary:
    ko: "동고트 왕 테오다하드가 아말라순타를 죽였다는 구실로 유스티니아노스는 535년 두 길로 군대를 보냈다. 벨리사리우스(군사 약 8천 명, 프로코피우스)는 535년 시칠리아를 차지하고 536년 나폴리(벨리사리우스의 군대가 약탈하자 그가 학살을 말렸다)와 12월 로마에 들어갔으며, 문두스는 달마티아의 살로나를 얻었다. 새 고트 왕 비티기스가 537년 3월부터 로마를 1년 가까이 포위했으나 풀지 못했고, 539년 프랑크의 테우데베르트 1세가 이탈리아에 들어와 양쪽을 털었다. 540년 벨리사리우스는 라벤나에 들어가 고트인이 내민 서쪽 황제 자리를 받아들이는 척하며 비티기스를 사로잡았다. 비티기스가 끌려간 뒤 고트인은 일디바드(540~541)와 에라리크를 거쳐 541년 가을 토틸라를 왕으로 뽑았고, 토틸라는 이탈리아 대부분을 되찾았고, 546년 12월 로마가 그에게 떨어지자 토틸라는 성벽 일부를 헐고 원로원 귀족들을 캄파니아로 보냈으며, 로마가 40일쯤 비었다는 전승이 있다(과장일 수 있다). 550년 로마를 다시 차지한 토틸라는 시칠리아도 노렸다. 547년 유스티니아노스는 롬바르드에게 판노니아와 노리쿰을 주어 힘을 보태게 했다(지도는 547년 이 땅을 게르만 부족에서 롬바르드 땅으로 그린다). 551년 환관 나르세스가 군을 맡아 552년 6월 부스타 갈로룸에서 토틸라를 죽였고 10월 몬스 락타리우스에서 마지막 고트 왕 테이아가 전사했다. 553~554년 프랑크·알레만인 부틸린과 로타리의 침입 가운데 로타리는 병으로 죽고 부틸린은 카실리눔(볼투르누스 강가)에서 졌고, 554년 유스티니아노스는 『국사 조칙』(프라그마티카 상크티오)으로 이탈리아의 행정을 정했다. 20년 가까운 전쟁으로 이탈리아는 황폐해졌고(『비사』가 말하는 인명 피해는 부풀려졌으나 도시 인구가 줄고 교역이 끊긴 것은 분명하다), 이는 롬바르드의 침입(568)으로 이어졌다. 지도는 535년 시칠리아·달마티아, 540년 라벤나·이스트리아, 552년 중부·남부, 554년 북부를 동로마 땅으로 그린다. 537년 게피드가 시르미움을 되찾은 것도 지도에 그려진다."
  subjects: [ostrogothic-kingdom, byzantine-empire, frankish-kingdom, lombard-kingdom, gepid-kingdom, germanic-tribes]
  links:
    - { from: byzantine-empire, to: ostrogothic-kingdom, note: "고트 전쟁(535~554)" }
    - { from: byzantine-empire, to: lombard-kingdom, note: "판노니아와 노리쿰 양도(547)" }
  tags: [war]
  sources: ["Procopius, History of the Wars (H. B. Dewing 영역, Loeb, 1914~1928)", "Peter Heather, The Restoration of Rome: Barbarian Popes and Imperial Pretenders (2013)", "Chris Wickham, Early Medieval Italy: Central Power and Local Society, 400–1000 (1981)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
