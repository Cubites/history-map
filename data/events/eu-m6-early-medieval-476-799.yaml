- id: balkan-samo-602
  year: 602
  endYear: 659
  title:
    ko: "도나우강 방어선의 붕괴(602~615)와 사모 왕국(623~658)"
  summary:
    ko: "602년 마우리키오스를 쫓아낸 포카스(602~610)가 사산과의 전쟁에 군대를 돌리자 도나우강 방어선이 무너졌다. 아바르와 슬라브는 발칸 안쪽까지 쳐들어와 614년 살로나(스플리트 곁, 피난민은 디오클레티아누스 궁전으로 갔다), 615년 나이수스(니시)와 세르디카(소피아)를 약탈하거나 차지했다. 테살로니키는 슬라브의 포위를 여러 번 견뎠다(『성 데메트리오스의 기적』). 이 뒤 내륙은 동로마가 실제로 다스리지 못하는 땅이 되어 슬라브 부족의 '스클라비니아'가 자리 잡았고(지도는 615년부터 발칸 내륙을 남슬라브 공국들로 그린다), 해안 도시는 동로마가 지켰다. 아바르에 눌려 있던 서쪽 슬라브는 623~624년 프랑크 상인 사모를 왕으로 추대해 아바르에 맞섰다(『프레데가리우스 연대기』). 사모는 35년을 다스렸고 631년 보가스티스부르크에서 다고베르트 1세의 프랑크군을 물리쳤으며 소르브인의 공 데르반이 그를 따랐다. 사모 왕국의 도읍과 영역은 확실하지 않아 학자들은 보헤미아와 모라비아 일대로 본다(지도는 623~658년 보헤미아와 모라비아를 사모 왕국으로 그리고 659년부터 다시 서슬라브 부족으로 그린다). 658년 무렵 사모가 죽자 나라는 흩어졌다. 사모에 관한 기록은 사실상 이 연대기뿐이다. 동로마 쪽에서는 콘스탄스 2세가 658년 슬라브 땅을 쳐서 많은 사람을 잡아 옮겼다고 테오파네스가 전한다."
  subjects: [south-slavic-principalities, slavic-tribes, samo-kingdom, byzantine-empire, avar-khaganate, frankish-kingdom]
  links:
    - { from: samo-kingdom, to: avar-khaganate, note: "슬라브의 반란과 독립(623~)" }
    - { from: samo-kingdom, to: frankish-kingdom, note: "보가스티스부르크 승리(631)" }
  tags: [war, politics]
  sources: ["The Fourth Book of the Chronicle of Fredegar with Its Continuations (J. M. Wallace-Hadrill 영역, 1960)", "Florin Curta, Southeastern Europe in the Middle Ages, 500–1250 (2006)", "John V. A. Fine Jr., The Early Medieval Balkans: A Critical Survey from the Sixth to the Late Twelfth Century (1983)", "Cyril Mango·Roger Scott 옮김, The Chronicle of Theophanes Confessor (1997)"]
