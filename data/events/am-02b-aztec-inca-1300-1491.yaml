# 아메리카 사건 3묶음 갈래 02b: 아즈텍·타라스코·잉카와 북아메리카 사회들 (1300 ~ 1491년)
# 범위: 1300년 무렵 타라스코 왕국의 시작부터 1491년 아메리카의 모습까지(타라스코·아즈텍 삼각 동맹·잉카 제국·치무의 왕들과 정복, 마야판의 몰락, 카호키아·호호캄의 끝, 노르드인 그린란드 정착의 끝, 이로쿼이 연맹의 성립).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 해: 사료가 전승이거나 학설이 갈리는 해는 '무렵'과 갈림을 글에 밝혔다(아즈텍 테노치티틀란 건설 1325년은 전승 해, 잉카 해는 로우 연대 하나, 이로쿼이 연맹의 성립은 1450년 무렵과 1142년 설).
# 날짜: 1582년 앞 날짜는 율리우스력. 이 파일은 날짜(일)를 거의 쓰지 않고 달 단위까지만 적었다.
# 이름 규칙: 항목 이름(타라스코 왕국·아즈텍 삼각 동맹·잉카 제국·치무·시칸 문화·찬카이 문화·마야판·마야 문명·믹스텍·호호캄·미시시피 문화·노르드인 그린란드 정착·이로쿼이 연맹·타이노인·카리브족·누에바에스파냐 부왕령)을 글자 그대로 썼다. 키체·칵치켈·틀락스칼라·콜랴·루파카·찬카·테파넥·투투테펙·사포텍·마푸체는 글에만 쓰고 subjects에 넣지 않았다.
# 지도 결정과의 관계: 아즈텍·타라스코·잉카·치무의 해(1440·1469·1486, 1435·1450, 1438·1463·1470·1481, 1375)를 사건 기간에 담았고, 땅이 없는 항목은 links 없이 subjects만 썼다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 「호콘 4세의 노르웨이와 아이슬란드 자유국의 끝, 퍼스 조약(1266)」, 「콜럼버스와 다가마, 신항로 개척」, 「몬테수마 2세의 아즈텍 삼각 동맹(1502~1519)」, 「톨레도 협약에서 쿠스코 입성까지: 피사로의 잉카 정복(1529~1533)」, 「데 소토와 코로나도의 북아메리카 내륙 원정(1539~1543)」, 「이차 왕국과 노즈페텐 함락(1695~1697)」, 「한스 에게데와 덴마크-노르웨이의 그린란드 식민(1721~1736)」, 「누뇨 데 구스만의 서부 원정과 타라스코 왕국의 끝(1529~1531)」.

- id: tariacuri-1300
  year: 1300
  endYear: 1350
  title:
    ko: "타리아쿠리와 타라스코 왕국의 시작(1300~1350)"
  summary:
    ko: "타라스코 왕국은 오늘날 멕시코 서부 미초아칸 고원의 파츠쿠아로 호수 둘레에서 푸레페차 사람들이 이룬 나라로, 스페인 사람들은 이들을 타라스코라 불렀다. 이 나라의 처음 모습은 1540년 무렵 프란치스코회 수사 헤로니모 데 알칼라가 푸레페차 귀족들의 이야기를 받아 적었다고 하는 『미초아칸 연대기』에 실려 전하는데, 신화와 가문 이야기가 섞인 글이어서 이 시기의 해는 모두 '무렵'으로 어림한 값이다. 연대기에 따르면 푸레페차 사람들은 호숫가 마을들에 흩어져 살았고 타리아쿠리가 그 마을들을 하나로 묶기 시작했다. 위키백과 영어판은 나라가 선 때와 타리아쿠리가 정복을 시작한 때를 1300년 무렵으로 적으면서도 그의 통치(이레차, 왕)는 1350년 무렵부터 1390년 무렵으로 적어, 한 문서 안에서도 해가 어긋나므로 1300~1350년은 전승으로 읽어야 한다. 타리아쿠리는 파츠쿠아로에서 다스렸고 이우아치오와 친춘찬에는 히리판과 탕가쑤안을 군주로 세웠다(위키백과 영어판 타라스코 왕국 문서는 두 사람을 아들이라, 타리아쿠리 문서는 조카라 적어 친족 관계가 갈린다). 이렇게 파츠쿠아로·친춘찬·이우아치오 세 도읍이 나란히 서는 틀이 처음 짜였고, 뒷날 친춘찬이 수도가 되었다. 연대기는 타리아쿠리가 아버지 파우아쿠메 2세가 다스리던 파츠쿠아로에서 일어나 우리추·에롱가리쿠아로·페차타로·하라쿠아로 같은 이웃 마을과 먼저 동맹을 맺고 호수 분지 전체로 퍼져 나갔으며, 쿠링과로 쪽 적의 공격에 한때 물러섰다가 다시 넓혔다고 전한다. 이 나라는 이웃의 아즈텍 삼각 동맹에 정복되지 않은 채 16세기를 맞았고, 도읍이 하나로 모이고 조공 체계가 서는 모습은 「탕가쑤안 1세와 타라스코 왕국의 확장(1435~1454)」(뒤의 사건)에서, 스페인 사람과의 만남과 끝은 「누뇨 데 구스만의 서부 원정과 타라스코 왕국의 끝(1529~1531)」(뒤의 사건)에서 이어진다."
  subjects: [tarascan]
  tags: [politics]
  sources: ["J. Benedict Warren, The Conquest of Michoacán: The Spanish Domination of the Tarascan Kingdom in Western Mexico, 1521–1530 (University of Oklahoma Press, 1985)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson, 7th ed. 2013)", "『미초아칸 연대기』(Relación de Michoacán, 1540년 무렵 헤로니모 데 알칼라가 푸레페차 귀족들의 이야기를 받아 적었다고 전함)", "위키백과 영어판 Tarascan state"]

- id: tenochtitlan-1325
  year: 1325
  endYear: 1428
  title:
    ko: "테노치티틀란 건설에서 아즈텍 삼각 동맹까지(1325~1428)"
  summary:
    ko: "아즈텍 사람들은 스스로를 멕시카라 불렀고, 전승은 이들이 북쪽 아스틀란이라는 곳에서 길을 떠나 오래 떠돈 끝에 멕시코 분지에 닿았다고 전한다. 위키백과 영어판은 멕시카가 1250년 무렵 분지에 들어왔을 때 좋은 농지는 이미 다른 도시들이 차지한 뒤였다고 적는다. 전승이 꼽는 테노치티틀란 건설의 해는 1325년(전승 해)으로, 텍스코코 호수 안의 섬에서 도시가 시작되었다고 한다. 첫 틀라토아니(왕) 아카마피츠틀리의 즉위는 문서마다 1367년·1372년·1376년으로 갈려, 초기 왕들의 해는 어림값일 뿐이다. 이 무렵 분지의 패권은 아스카포찰코의 테파넥 사람들이 쥐고 있었고 멕시카는 그 아래에서 군사를 내는 처지였다. 1426년 아스카포찰코의 왕 테소소목이 죽자 후계 다툼이 내전으로 번졌고, 멕시카의 왕 치말포포카도 곧 죽었다. 이츠코아틀(재위 1427~1440)이 왕이 된 테노치티틀란은 텍스코코·틀라코판과 손잡고 1428년 아스카포찰코를 꺾었다(우에호친고도 한편이었다는 서술이 있다). 세 도시의 동맹, 곧 아즈텍 삼각 동맹이 맺어진 해를 위키백과 영어판은 상자에서 1428년으로, 본문에서 1430년으로 적는다. 텍스코코에서는 네사우알코요틀(재위 1431~1472)이 왕이 되었다. 이츠코아틀은 1439년 분지 남쪽의 쿠아우나와크(지금의 쿠에르나바카)로 원정해 힘을 분지 밖으로 뻗기 시작했다. 이츠코아틀과 틀라카엘렐 아래에서 옛 기록을 불사르고 멕시카의 역사를 다시 썼다고 전하는데, 이는 뒷날 아즈텍 쪽 연대기의 눈으로 걸러진 이야기라는 점을 함께 읽어야 한다. 이 동맹이 분지 밖으로 공물을 거두며 퍼져 나가는 일은 「몬테수마 1세와 꽃의 전쟁(1440~1469)」(뒤의 사건)에서 이어진다."
  subjects: [aztec]
  tags: [politics, war]
  sources: ["Michael E. Smith, The Aztecs (Wiley-Blackwell, 3rd ed. 2012)", "Michael D. Coe, Mexico: From the Olmecs to the Aztecs (Thames & Hudson, 7th ed. 2013)", "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (University of Oklahoma Press, 1988)", "위키백과 영어판 Aztec Empire·Tlatoani"]

- id: cahokia-hohokam-1350
  year: 1350
  endYear: 1450
  title:
    ko: "카호키아의 쇠퇴와 호호캄의 끝(1350~1450)"
  summary:
    ko: "카호키아는 오늘날 미국 일리노이주 미시시피강 변에 있던 큰 도시로(성장과 정점은 「미시시피 문화와 카호키아(800~1200)」(앞의 사건)), 1050년 무렵부터 1350년 무렵까지 도시였고 마을로는 600년 무렵부터 이어졌다. 1350년 무렵(표에 따라 1400년까지)에는 버려졌다. 까닭으로는 홍수와 가뭄, 숲의 줄어듦, 전쟁, 영양 문제, 여러 말과 민족이 섞인 사회의 갈등이 거론되지만 하나로 정해진 설은 없고, 최근 연구는 사람 때문에 생긴 침식이나 홍수의 증거가 없다고 본다. 도시가 비고 난 뒤 이 둘레에는 1400~1600년 사이 큰 정착이 없었고, 더 넓은 지역의 인구는 다시 늘어 1650년 무렵 정점에 이르렀다고 2020년 연구는 적는다. 카호키아를 세운 미시시피 문화는 북쪽 중심지가 비어도 남동부의 족장 사회들로 이어져 1600년 무렵까지 이어졌고, 그 끝자락에서 만난 사람들은 「데 소토와 코로나도의 북아메리카 내륙 원정(1539~1543)」(뒤의 사건)이 전한다. 같은 시기 남서쪽 소노라 사막의 호호캄에서도 큰 마을들이 비었다. 호호캄은 1500년 무렵까지 이어졌다고 적는 문서가 있다(솔트강과 힐라강에서 끌어온 물길 농사는 「호호캄의 수로와 소노라 사막의 마을(300~750)」(앞의 사건)). 14세기 중반 되풀이된 홍수가 솔트강 바닥을 깎아 물길 어귀를 부수자 1350~1375년에 큰 마을이 비었고, 1375년 뒤 솔트강 아랫녘의 마을과 물길 대부분이 버려졌다. 1400~1450년 사이에 로스 호르노스가, 1400년 또는 1450년 무렵 카사그란데 마을이 대부분 비었고, 1450년 무렵 호호캄의 고전기가 끝났다. 1694년 키노 신부가 본 카사그란데는 이미 비어 있었다. 호호캄이 아키멜·토호노 오오담의 조상이라는 구전이 있으나 학자들은 둘이 이어지는지를 두고 갈린다."
  subjects: [mississippian-culture, hohokam-culture]
  tags: [society, culture]
  sources: ["Timothy R. Pauketat, Cahokia: Ancient America's Great City on the Mississippi (Viking, 2009)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "Linda S. Cordell·Maxine E. McBrinn, Archaeology of the Southwest (Left Coast Press, 3rd ed. 2012)", "위키백과 영어판 Cahokia·Hohokam"]

- id: chimu-sican-1375
  year: 1375
  endYear: 1400
  title:
    ko: "치무의 람바예케 정복과 시칸 문화의 끝(1375~1400)"
  summary:
    ko: "치무는 페루 북부 해안의 모체 골짜기에서 일어난 나라다(왕계와 도읍 찬찬은 「치무의 찬찬과 찬카이 문화(900~1100)」(앞의 사건)). 위키백과 영어판은 치무가 1320년 무렵 하케테페케 골짜기를 정복했고 시칸 문화는 정복으로 얻었다고 적는다. 그 해는 시칸 쪽 문서가 1375년 무렵으로 적고(시칸 문화의 길은 「시칸 문화와 바탄 그란데(750~1100)」(앞의 사건)), 정복한 왕의 이름은 적지 않아 마지막 왕 민찬카만(1462~1470)이 아니라 1370~1375년 무렵의 왕 난셈핀코의 시대와 때가 맞는다고만 말할 수 있다. 이 정복으로 치무는 현대 페루 해안선 기준으로 해안 약 1,000 km를 포괄하는 나라가 되었고 남쪽 끝이 카라바이요(리마 북쪽)라는 데는 뜻이 모이지만 어디까지 닿았는지는 역사가마다 갈린다. 사회는 위키백과 영어판이 네 단계의 위계 체계라 적은 대로 네 계층이었고 장인은 전문 분야별로 묶여 직업을 바꾸지 못했다. 치무의 농사는 수로와 우물에 기댄 집약 농경이었고, 수로 공사장의 깨진 그릇(케브라다 델 오소)은 나라가 노동자에게 음식을 댔음을 시사하며, 노동자는 나라의 비용으로 먹고 잤을 것으로 본다. 금·은·구리를 다루었는데 구리는 고지대에서 사흘 길을 들여왔고 비소를 섞어 단단하게 했으며, 세로 데 로스 세멘테리오스에는 제련 공방이 몰려 있었고 금속 공예는 후기 치무에 빠르게 늘었다. 람바예케 골짜기의 팜파그란데도 뒷날 치무의 지배를 받았으며, 치무는 1470년 무렵 잉카에 정복될 때까지 해안의 가장 큰 나라로 남았다(「투팍 잉카 유팡키의 북쪽 원정과 치무 정복(1463~1471)」(뒤의 사건))."
  subjects: [chimu, sican-culture]
  tags: [politics, war]
  sources: ["Michael E. Moseley·Alana Cordy-Collins 편, The Northern Dynasties: Kingship and Statecraft in Chimor (Dumbarton Oaks, 1990)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru (Thames & Hudson, rev. ed. 2001)", "위키백과 영어판 Chimú culture·Sican culture"]

- id: norse-greenland-end-1408
  year: 1408
  endYear: 1450
  title:
    ko: "흐발세이 결혼 기록과 노르드인 그린란드 정착의 끝(1408~1450)"
  summary:
    ko: "노르드인 그린란드 정착은 남서쪽 피오르 둘레의 동쪽 정착지와 그 북쪽의 서쪽 정착지로 이루어졌고, 1261년 노르웨이 왕에게 복속했다(「호콘 4세의 노르웨이와 아이슬란드 자유국의 끝, 퍼스 조약(1266)」(앞의 사건)). 정착지의 시작과 규모는 「붉은 에이리크의 그린란드 정착과 빈란드(985~1021)」(앞의 사건)가 다룬다. 끝은 서쪽에서 먼저 왔다. 1350년 이바르 바르다르손이 동쪽에서 서쪽 정착지로 갔을 때 사람이 살지 않았고, 1355년 스웨덴-노르웨이 원정대도 서쪽에서 노르드인을 찾지 못했다. 서쪽 정착지가 비게 된 해는 문서마다 갈려 위키백과 영어판은 1350~1400년 사이로도 적는다. 툴레인이 닿은 일은 「툴레인의 동쪽 이동과 도싯 문화의 끝(1000~1300)」(앞의 사건)이 다루며, 위키백과 영어판은 이들이 1300년 무렵 그린란드에서 가장 많은 사람이 되었다고 적는다. 1369년 그린란드 배의 마지막 항해가 기록되었고 1378년 마지막 주교가 죽은 뒤 후임은 부임하지 않았다. 글로 남은 마지막 일은 1408년 9월 14일 흐발세이 교회에서 열린 혼례다. 그 뒤 동쪽 정착지는 15세기 중반(1450년 무렵)에 사라졌고 마지막 방사성 탄소 연대는 1430년 무렵이다. 까닭으로는 15세기부터의 추위(소빙기), 가뭄과 땅 약화, 유럽에서 상아 값이 떨어져 바다코끼리 사냥의 값이 줄어든 일, 목재와 철을 들이던 교역의 쇠퇴, 이누이트(툴레인)와의 다툼, 이주 등이 거론되지만 어느 하나로 정해지지 않았고 흑사병은 1402~1404년 아이슬란드를 덮쳤으나 그린란드에 닿았다는 증거는 없어 추측에 그친다. 이 땅에 다시 유럽 사람이 정착하는 때는 「한스 에게데와 덴마크-노르웨이의 그린란드 식민(1721~1736)」(뒤의 사건)이다."
  subjects: [norse-greenland]
  tags: [society, economy]
  sources: ["Kirsten A. Seaver, The Frozen Echo: Greenland and the Exploration of North America ca. A.D. 1000–1500 (Stanford University Press, 1996)", "Jared Diamond, Collapse: How Societies Choose to Fail or Succeed (Viking, 2005)", "위키백과 영어판 Norse settlements in Greenland"]

- id: tangaxuan-1435
  year: 1435
  endYear: 1454
  title:
    ko: "탕가쑤안 1세와 타라스코 왕국의 확장(1435~1454)"
  summary:
    ko: "타라스코 왕국의 왕(이레차, 스페인 말로 카손시)은 위키백과 영어판의 목록으로 타리아쿠리(1350 무렵~1390 무렵), 히킹가헤(1390 무렵~1420 무렵, 물음표가 붙은 해), 히리판(1420 무렵~1435), 탕가쑤안 1세(1435~1454)로 이어지고 이 가운데 앞 세 사람의 해는 모두 어림값이다(타리아쿠리의 시작은 「타리아쿠리와 타라스코 왕국의 시작(1300~1350)」(앞의 사건)). 히리판과 탕가쑤안 1세의 시대에 나라는 조공 체계를 굳히고 관료 조직을 만들었으며, 귀족과 영주들에게 조공 책임을 나누어 맡겼다. 세력은 먼저 산악 지대로, 이어 발사스강까지 뻗었다. 도읍은 파츠쿠아로·이우아치오·친춘찬 세 곳이었으나 이 무렵부터 친춘찬이 수도 노릇을 했다. 위키백과 영어판은 1450년 무렵 나라의 넓이를 약 7만 5천 km²로 적고, 1519년 인구를 약 150만 명으로 어림하며 아즈텍 삼각 동맹 다음가는 메소아메리카 둘째 나라라고 한다. 나라 안의 땅을 누가 어떤 몫으로 다스렸는지, 곧 중앙이 얼마나 단단히 쥐었는지는 학자마다 달리 풀이하고, 이 글의 해도 모두 전승과 어림이 섞여 있다. 탕가쑤안 1세 뒤에는 치치판다쿠아레(1454~1479)가 이어 1460년 무렵 발사스강 하구 사카툴라에서 태평양에 닿았다고 적고, 그 뒤 주앙구아(1479~1520)가 이었다고 한다. 이 시대에 서쪽의 타라스코 왕국과 동쪽의 아즈텍 삼각 동맹이 맞닿으며, 위키백과 영어판 아즈텍 제국 문서는 1455년 푸레페차가 톨루카 계곡을 쳐들어갔다고, 타라스코 왕국 문서는 1460년 톨루카 계곡으로 전진했다고 적는다. 두 나라의 싸움은 「악사야카틀의 틀라텔롤코 합병과 타라스코 원정(1469~1481)」(뒤의 사건)에서 이어진다."
  subjects: [tarascan]
  tags: [politics]
  sources: ["J. Benedict Warren, The Conquest of Michoacán: The Spanish Domination of the Tarascan Kingdom in Western Mexico, 1521–1530 (University of Oklahoma Press, 1985)", "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (University of Oklahoma Press, 1988)", "위키백과 영어판 Tarascan state·Aztec Empire"]

- id: pachacuti-1438
  year: 1438
  endYear: 1463
  title:
    ko: "찬카 격파와 파차쿠티의 잉카 제국(1438~1463)"
  summary:
    ko: "잉카 사람들은 12세기 무렵 쿠스코 일대에서 목축을 하던 한 집단이었고, 위키백과 영어판은 1200년대 초 망코 카팍(전승 속 시조) 아래에서 쿠스코 왕국이 섰다고 적는다. 이 왕국의 아홉째 사파 잉카가 파차쿠티다. 이 글의 해는 존 로우의 연대(1438~1471, 미겔 카베요 발보아의 연대기에 바탕)를 따르며, 델 부스토는 1425~1471년, 다른 학자들은 1400~1448년, 1420~1477년 등으로 갈라 적고 방사성 탄소 연대는 치세가 15세기 초에 시작했을 수 있음을 시사한다. 찬카와의 싸움도 연도가 없는 이야기여서, 전승으로는 쿠스코가 위협받자 비라코차 잉카와 그의 공동 통치자 우르코가 달아났고 쿠시 유팡키가 쿠스코를 지켜 파차쿠티('세상을 뒤집는 이')라는 이름을 얻었다고 한다. 로우의 연대에서는 이것이 1438년의 일이고 델 부스토는 1424년에 두며, 역사가 가운데는 이 전쟁이 얼마나 사실이었는지부터 의심하는 사람도 있다. 파차쿠티는 쿠스코를 새로 짓고 도시를 수유(사방 지방)와 두 반쪽으로 나누었으며 태양 신전 코리칸차를 세웠다고 전한다. 티티카카 호수 둘레의 콜랴와 루파카를 먼저 정복해 콜랴 왕을 아야비리에서 사로잡고 하툰콜랴를 얻었는데 해는 문서에 없고, 뒤의 콜랴 반란은 장군들이 눌렀다. 충성스러운 사람을 옮겨 불안한 지방에 두는 미트마, 끈으로 셈과 역사를 적는 키푸, 카팍 냔이라 부른 도로망도 그의 이름과 이어지지만 시작 해는 전하지 않는다. 마추픽추는 그를 위한 별장이었다는 설이 우세하다. 1463년 로우는 아들 투팍이 군대 지휘를 맡았다고 보며, 이어지는 일은 「투팍 잉카 유팡키의 북쪽 원정과 치무 정복(1463~1471)」(뒤의 사건)에서 다룬다."
  subjects: [inca]
  tags: [politics, war]
  sources: ["Terence N. D'Altroy, The Incas (Wiley-Blackwell, 2nd ed. 2014)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru (Thames & Hudson, rev. ed. 2001)", "Charles C. Mann, 1491: New Revelations of the Americas Before Columbus (Knopf, 2005)", "Miguel Cabello de Balboa, Miscelánea Antártica (1586)", "위키백과 영어판 Pachacuti·Inca Empire·Sapa Inca"]

- id: moctezuma-i-1440
  year: 1440
  endYear: 1469
  title:
    ko: "몬테수마 1세와 꽃의 전쟁(1440~1469)"
  summary:
    ko: "몬테수마 1세는 이츠코아틀(1427~1440)의 뒤를 이어 1440년 귀족들이 뽑아 마흔두 살에 틀라토아니, 곧 '위대한 연설자'가 되었고 1469년(1468년이라는 서술도 있다)에 죽었다. 그의 동생 틀라카엘렐이 나라 안 일을 이끌었다고 전하며, 이츠코아틀 때 짜인 동맹의 틀 위에서 정복을 이어 갔다(「테노치티틀란 건설에서 아즈텍 삼각 동맹까지(1325~1428)」(앞의 사건)). 위키백과 영어판은 1440~1453년 평화를 지키며 신분마다 옷과 집, 교육, 법을 달리 정했다고 적는다. 같은 문서는 1445년 오악사카를 정복했다고 하지만 같은 사전의 아즈텍 제국 쪽 글은 오악사카 계곡의 정복에 해를 주지 않고 아우이소틀 때의 일로 적어, 오악사카 정복 해는 서술끼리 어긋난다. 1458년 무렵에는 믹스텍 사람들의 땅 코이스틀라우아카를 쳤다. 평화를 깬 것은 재난이었다. 1446년 메뚜기 떼, 1449년 텍스코코 호수의 범람, 1450~1454년 서리와 가뭄이 이어졌다. 아즈텍 쪽 구전은 이 가뭄 끝에 신들에게 바칠 포로를 얻으려 틀락스칼라·우에호친고·촐룰라와 싸움을 정기적으로 벌였다고 풀이하는데, 이것이 '꽃의 전쟁'이다(1450년대 중반인 1454년 무렵에 시작되었다고 전한다). 이 싸움이 의례냐 정치적 압박이냐를 두고는 연구자들이 갈린다. 동맹 안의 전리품은 테노치티틀란과 텍스코코가 2/5씩, 틀라코판이 1/5을 가졌다. 텍스코코의 네사우알코요틀(재위 1431~1472)과 함께 호수 가운데 도시에 물을 대는 이중 수로를 놓았고, 이 시기에 아즈텍 삼각 동맹의 공물 영역은 분지 밖 멕시코만 쪽까지 넓어졌다. 몬테수마 1세 뒤에는 손자 악사야카틀이 이었다(「악사야카틀의 틀라텔롤코 합병과 타라스코 원정(1469~1481)」(뒤의 사건))."
  subjects: [aztec, mixtec]
  tags: [politics, war]
  sources: ["Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (University of Oklahoma Press, 1988)", "Michael E. Smith, The Aztecs (Wiley-Blackwell, 3rd ed. 2012)", "Inga Clendinnen, Aztecs: An Interpretation (Cambridge University Press, 1991)", "위키백과 영어판 Moctezuma I·Aztec Empire"]

- id: mayapan-fall-1441
  year: 1441
  endYear: 1461
  title:
    ko: "마야판의 몰락과 유카탄의 작은 나라들(1441~1461)"
  summary:
    ko: "마야판은 유카탄 북부의 도시로, 1220년대부터 1440년대까지 이 땅의 정치와 문화의 중심이었다(성립과 코콤 가문은 「마야판의 성립과 코콤 가문(1220~1300)」(앞의 사건)). 도시의 크기와 인구도 그 사건이 다룬다. 마야판은 유카탄 북부 여러 도시의 동맹을 이끌며 온두라스·벨리즈·코수멜과 교역하고 멕시코 쪽과도 간접으로 닿았으며, 마야 문명의 후기 중심이던 이 도시의 끝은 그 동맹이 흩어지는 일이기도 했다. 글로 전하는 끝은 1441년이다. 슈 가문의 수장 아 슈 슈판이 코콤 가문에 맞서 일어났고, 거의 모든 코콤 사람이 죽었으며 한 사람만 교역을 하러 온두라스에 가 있어 살아남았다고 한다. 도시는 약탈당하고 불탄 뒤 버려졌다. 고고학은 이와 달리 새 제단과 매장 시설이 1461년 무렵 이후 없는 점을 들어 몰락을 1461년 무렵으로 보고, 카툰 8 아하우(1441~1461년 무렵)의 20년 사이에 무너졌다고 읽는 연구도 있어, 이 글은 두 해를 모두 적는다. 전염병이 도시를 비우는 데 거들었을 수 있다고도 한다. 마야판이 무너진 뒤 유카탄 북부는 여러 작은 정치 단위로 갈라졌고, 스페인 사람이 1527년 닿았을 때도 그렇게 나뉘어 있었다(「몬테호 부자의 유카탄 정복(1527~1546)」(뒤의 사건)). 이차 사람들과 이어진 치첸이트사 같은 유적은 1331년 무렵 버려졌다는 고고학 증거가 있고, 이차 사람들은 바칼라르·유카탄 북부·찬포톤으로 옮겨 다닌 끝에 15세기에 페텐 호수 둘레에 자리잡았으며 코콤·슈 가문과의 세력 다툼에서 졌다고 적힌다. 이들은 1697년까지 독립을 지켰다(「이차 왕국과 노즈페텐 함락(1695~1697)」(뒤의 사건))."
  subjects: [mayapan, maya-civilization]
  tags: [politics, society]
  sources: ["Michael D. Coe, The Maya (Thames & Hudson, 9th ed. 2015)", "Ralph L. Roys, The Political Geography of the Yucatan Maya (Carnegie Institution of Washington, 1957)", "위키백과 영어판 Mayapan·Itza people"]

- id: haudenosaunee-1450
  year: 1450
  endYear: 1450
  title:
    ko: "이로쿼이 연맹의 성립과 대평화법(1450 무렵)"
  summary:
    ko: "이로쿼이 연맹은 지금의 미국 뉴욕주 북부에서 이로쿼이어를 쓰는 다섯 나라, 곧 동쪽부터 모호크·오나이다·오논다가·카유가·세네카가 맺은 연맹으로, 스스로는 하우데노사우니, 곧 '긴 집(롱하우스)의 사람들'이라 부른다. 연맹은 전승으로 전하는 대평화법에 바탕을 두었다. 전승에 따르면 서로 싸우던 나라들에게 위대한 평화의 사람 데가나위다가 평화의 법을 가져왔고, 그의 동료 하이어와사와 함께 법을 전했으며, 모든 나라의 어머니라 불리는 여성 지곤사세의 집이 평화를 이야기하는 장소가 되었다. 데가나위다가 폭포 위 나무에서 떨어지고도 살아남아 권위를 보였다는 이야기도 전한다. 긴 집은 여러 가족이 함께 사는 집인데, 다섯 나라가 한 지붕 아래 사는 집이라는 비유가 연맹의 이름이 되었다. 연맹의 기구는 씨족을 대표하는 추장 쉰 명이 모이는 대회의로, 모호크는 동쪽 문의 지킴이, 세네카는 서쪽 문의 지킴이였다. 이 연맹이 언제 맺어졌는지는 합의가 없다. 위키백과 영어판은 1142년부터 1660년까지 넓게 열어 두는데, 1142년 8월의 일식에 맞추는 설이 한쪽 끝이고 많은 고고학자와 인류학자는 1450년 무렵으로 본다. 1450년 앞에는 고고학으로 만들 수 없다는 딘 스노의 반론도 있다. 이 글은 1450년 무렵을 따르고 1142년 설은 전승과 일식에 맞춘 해로만 적는다. 노래와 의례로 외워 전해 온 이 법과 연맹은 오늘까지 이어지며, 남쪽 캐롤라이나에서 북쪽으로 옮겨 온 투스카로라는 1722년 여섯째 나라로 받아들여져 여섯 나라가 되었다. 연맹이 유럽 사람과 맺은 관계는 「오하이오 영토의 요새와 올버니 회의(1753~1755)」(뒤의 사건)에서 이어진다."
  subjects: [haudenosaunee]
  tags: [politics, society]
  sources: ["Dean R. Snow, The Iroquois (Blackwell, 1994)", "Bruce E. Johansen·Barbara A. Mann 편, Encyclopedia of the Haudenosaunee (Iroquois Confederacy) (Greenwood Press, 2000)", "위키백과 영어판 Haudenosaunee"]

- id: tupac-inca-chimu-1463
  year: 1463
  endYear: 1471
  title:
    ko: "투팍 잉카 유팡키의 북쪽 원정과 치무 정복(1463~1471)"
  summary:
    ko: "파차쿠티의 아들 투팍 잉카 유팡키는 아버지 아래에서 '아우키'(왕위 계승자)로 군대를 이끌었다. 존 로우의 연대는 그가 1463년 군대 지휘를 맡았다고 보고, 호세 안토니오 델 부스토는 1440년에 태어나 1461년 무렵 첫 원정을 나섰다고 적는다. 북쪽으로 나아간 그의 군대는 하툰하우하와 봄본 고원, 와일라스를 굴복시켰다. 이 글은 저장소의 해를 따라 1463년부터 1470년까지 군대가 북쪽으로 치무 왕국과 키토를 정복했다고 적지만, 위키백과 영어판은 투팍 잉카 유팡키가 즉위한 1471년 뒤에 치무와 에콰도르를 정복했다고 적어 두 서술이 다르다. 치무 정복의 해는 위키백과 영어판 치무 문서에서 상자는 1470년이고 본문은 1470년대로 적는다. 치무 왕 민찬카만의 치세는 1462~1470년 또는 1450년 무렵~1470년으로 갈리며, 찬찬을 차지하며 치무는 사라졌다. 같은 시기 리마 북쪽의 찬카이 문화(1000~1470)도 잉카에 들어갔고(문화의 길은 「치무의 찬찬과 찬카이 문화(900~1100)」(앞의 사건)), 위키백과 영어판은 점령을 1450년 무렵으로도 적는다. 위키백과 영어판 치무 문서는 이 정복이 우아이나 카팍이 즉위하는 1493년에는 거의 끝났다고 적는다. 투팍 잉카 유팡키가 태평양으로 약 열 달 항해를 떠나 '니나춤피'와 '아와춤피'라는 섬들을 만났다는 이야기는 1470년 무렵의 일로 전하는데 만가레바나 이스터섬이라고 보는 사람이 있고 이 항해가 실제로 있었는지를 의심하는 역사가도 있다. 파차쿠티는 1471년 숨져 아들이 사파 잉카가 되었다(「찬카 격파와 파차쿠티의 잉카 제국(1438~1463)」(앞의 사건))."
  subjects: [inca, chimu, chancay-culture]
  tags: [politics, war]
  sources: ["Terence N. D'Altroy, The Incas (Wiley-Blackwell, 2nd ed. 2014)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru (Thames & Hudson, rev. ed. 2001)", "Michael E. Moseley·Alana Cordy-Collins 편, The Northern Dynasties: Kingship and Statecraft in Chimor (Dumbarton Oaks, 1990)", "위키백과 영어판 Chimú culture·Pachacuti·Topa Inca Yupanqui·Inca Empire"]

- id: axayacatl-1469
  year: 1469
  endYear: 1481
  title:
    ko: "악사야카틀의 틀라텔롤코 합병과 타라스코 원정(1469~1481)"
  summary:
    ko: "악사야카틀은 몬테수마 1세의 손자로 어머니는 아토토스틀리 2세다(앞 왕의 시대는 「몬테수마 1세와 꽃의 전쟁(1440~1469)」(앞의 사건)). 그는 할아버지가 죽은 1469년 형제인 티소크와 아우이소틀이 못마땅해하는 가운데 틀라토아니로 뽑혔다(할아버지의 죽음을 1468년으로 적는 서술도 있다). 위키백과 영어판은 그가 1473년 이웃한 틀라텔롤코를 쳐서 그곳 왕 모키우익스를 죽이고 군사 총독을 앉혔다고 적는다. 틀라텔롤코는 테노치티틀란과 같은 섬에 서서 큰 시장을 가진 멕시카의 도시였으나 이 일로 테노치티틀란에 합쳐졌다. 톨루카 계곡의 마틀라친카 사람들과 싸운 해를 '아즈텍 제국' 문서는 1472년으로, '악사야카틀' 문서는 1474년으로 적어 두 문서가 어긋나며, 앞서 1455~1460년 무렵 푸레페차 쪽이 이 계곡을 치기도 했다. 악사야카틀의 가장 큰 패배는 서쪽 타라스코 왕국과의 싸움이었다. 위키백과 영어판 악사야카틀 문서는 1476년으로, 아즈텍 제국 문서는 1479년으로 적는데, 후자는 아즈텍군 3만 2천 명이 5만 명의 푸레페차 군에게 크게 져 9할 넘게 죽거나 잡혔다고 한다. 타라스코 왕국 문서는 1470년대에 아즈텍이 국경 마을을 빼앗고 중심부에 다가갔다가 끝내 졌다고만 적는다. 이 패배는 그때까지 아즈텍 삼각 동맹이 겪은 가장 큰 패배로 전한다. 이 뒤 타라스코 왕국과 맞닿은 국경에는 두 나라의 요새가 마주 섰다. '태양의 돌'로 불리는 달력 돌도 악사야카틀의 지휘 아래 새겨졌다고 하나 해는 전하지 않는다. 그는 1480년 병이 들어 1481년 서른한 살 안팎으로 죽었고 형제 티소크가 뒤를 이었다(형제의 나이 순서는 위키백과 문서마다 갈린다). 티소크는 5년 뒤 죽어 「아우이소틀과 대신전 봉헌(1486~1502)」(뒤의 사건)으로 이어진다."
  subjects: [aztec, tarascan]
  tags: [politics, war]
  sources: ["Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (University of Oklahoma Press, 1988)", "Michael E. Smith, The Aztecs (Wiley-Blackwell, 3rd ed. 2012)", "위키백과 영어판 Axayacatl·Aztec Empire·Tarascan state"]

- id: tupac-inca-south-1471
  year: 1471
  endYear: 1493
  title:
    ko: "투팍 잉카 유팡키의 치세와 남쪽 정복(1471~1493)"
  summary:
    ko: "투팍 잉카 유팡키는 1471년 아버지 파차쿠티가 죽자 사파 잉카가 되어 1493년 무렵까지 다스렸다(위키백과 영어판 계통도에는 1441년 무렵~1493년 무렵이라는 다른 해도 적혀 있다). 그의 치세는 잉카 제국이 가장 넓게 뻗어 나가던 때로, 위키백과 영어판은 그가 안티수유(동쪽 숲 지대)를 정복하고 콜랴 사람들을 굴복시켰으며 에콰도르로 영토를 넓혀 키토를 쿠스코의 건축가들과 함께 다시 지었다고 적는다. 티티카카 호수의 루파카와 콜랴는 1473년 무렵(위키백과 루파카 문서) 반란을 일으켰다가 눌렸다. 남쪽에서는 콜랴수유 너머로 지금의 칠레 중부와 아르헨티나 북서부까지 닿았다. 칠레 쪽 한계는 마울레강이었다고 하는데, 마푸체 사람들과 마울레강에서 싸운 일을 전통 서술은 투팍 잉카 치세 말로 두지만 오스발도 실바 같은 역사가는 1532년 내전기의 일로 보아 해가 갈린다. 이 글의 1481년 무렵은 치세 가운데 해로 남쪽과 동쪽 정복이 이미 이루어진 때다. 파차쿠티는 처음 아들 아마루 유팡키를 공동 통치자로 삼았으나 군사 지휘에 맞지 않다고 보아 투팍 잉카 유팡키를 공동 통치자이자 후계자로 바꾸었고, 위키백과 영어판 파차쿠티 문서는 투팍의 공동 통치를 1467년으로 적어 1471년을 투팍의 시작으로 보는 로우의 연대와 다르다. 사크사이우아만의 큰 공사도 이 치세에 이루어졌다고 위키백과는 적는다. 말년의 계승을 둘러싼 이야기는 전승이다. 아내 추키 오클로가 아들 카팍 우아리 대신 티투 쿠시 우알파를 후계로 삼은 그를 독살했다고 전하며, 그가 1493년 무렵 친체로스에서 죽고 티투 쿠시 우알파가 우아이나 카팍으로 즉위했다. 우아이나 카팍의 치세와 내전, 피사로의 도착은 「톨레도 협약에서 쿠스코 입성까지: 피사로의 잉카 정복(1529~1533)」(뒤의 사건)이 다룬다."
  subjects: [inca]
  tags: [politics, war]
  sources: ["Terence N. D'Altroy, The Incas (Wiley-Blackwell, 2nd ed. 2014)", "Michael E. Moseley, The Incas and Their Ancestors: The Archaeology of Peru (Thames & Hudson, rev. ed. 2001)", "위키백과 영어판 Topa Inca Yupanqui·Inca Empire·Pachacuti"]

- id: ahuitzotl-1486
  year: 1486
  endYear: 1502
  title:
    ko: "아우이소틀과 대신전 봉헌(1486~1502)"
  summary:
    ko: "아우이소틀은 형 티소크(재위 1481~1486)의 뒤를 이어 1486년 틀라토아니가 되었다. 티소크는 영토를 크게 넓히지 못했다는 평을 받는다. 아우이소틀은 아즈텍 삼각 동맹의 힘으로 먼저 우아스텍카 사람들의 반란을 눌렀고, 위키백과 영어판은 그가 짧은 사이에 아즈텍의 지배 아래 있는 땅을 두 배 넘게 늘렸다고 적는다. 믹스텍과 사포텍을 비롯해 태평양 연안에서 과테말라 서부까지 이르는 여러 사회를 정복했다고 전하고, 오악사카 계곡의 우아시약 요새가 이 무렵(1486년 무렵) 세워졌다고도 한다. 투투테펙의 믹스텍 나라는 아즈텍과 직접 싸운 기록 없이 대리전을 벌였다는 서술이 있어 어느 쪽이 무엇을 얻었는지는 갈린다. 1487년 아우이소틀은 테노치티틀란의 대신전(템플로 마요르)을 넓혀 다시 열었다. 이 신전은 전쟁의 신 우이칠로포치틀리와 비와 농사의 신 틀랄록을 함께 모신 쌍둥이 신전으로, 봉헌을 새긴 기념 돌에는 두 틀라토아니가 팡케찰리스틀리의 마지막 날을 함께 기리는 모습과 아즈텍 달력의 8 아카틀 해 7 아카틀 날(1487년 12월 무렵)이 새겨져 있다. 이날 제물의 수는 두란이 적은 8만 400명에서 위키백과 영어판이 『텔레리아노-레멘시스 사본』의 값으로 전하는 약 4천 명까지 기록마다 크게 갈리고, 로스 하시그는 8만 400명을 과장으로 보아 1만~8만 400명으로 어림한다. 숫자가 갈리므로 수천 명 이상의 사람이 제물이 되었다는 정도만 읽을 수 있다. 위키백과 영어판은 아우이소틀과 티소크 가운데 누가 처음 우에이 틀라토아니(위대한 틀라토아니)라는 칭호를 썼는지 분명하지 않다고 적는다. 아우이소틀은 1502년 죽었고 조카 몬테수마 2세가 이었다(죽음의 까닭은 문서에 없다). 그 뒤는 「몬테수마 2세의 아즈텍 삼각 동맹(1502~1519)」(뒤의 사건)에서 이어진다."
  subjects: [aztec]
  tags: [politics, religion]
  sources: ["Michael E. Smith, The Aztecs (Wiley-Blackwell, 3rd ed. 2012)", "Inga Clendinnen, Aztecs: An Interpretation (Cambridge University Press, 1991)", "Ross Hassig, Aztec Warfare: Imperial Expansion and Political Control (University of Oklahoma Press, 1988)", "Diego Durán, The History of the Indies of New Spain (University of Oklahoma Press, 1994)", "위키백과 영어판 Ahuitzotl·Templo Mayor·Aztec Empire·Tututepec"]

- id: americas-1491
  year: 1491
  endYear: 1491
  title:
    ko: "1491년의 아메리카: 사람과 도시, 사회들(1491)"
  summary:
    ko: "1491년 아메리카에 얼마나 많은 사람이 살았는지는 학설마다 크게 갈려, 위키백과 영어판이 모은 추산은 800만 명에서 1억 1,200만 명에 걸친다. 1939년 크뢰버는 840만 명, 1954년 로젠블라트는 1,338만 명으로 낮게 보았고, 1966년 도빈스는 약 9,000만~1억 1,300만 명으로 매우 높게 보았으며, 1992년 데네번은 약 5,390만 명(멕시코 1,717만, 안데스 1,570만 등)으로 정리해 지금도 가장 널리 인용된다. 알촌(2003)은 4,650만~5,350만 명으로 잡았고 2018년과 2019년의 탄소 기록 연구는 6,000만 명을 넘는다고 보았다. 헤니지는 여러 추산이 자의적인 공식에서 나왔다고 비판했다. 사람이 가장 많이 모인 곳은 두 큰 나라였다. 위키백과 영어판은 아즈텍 삼각 동맹의 인구를 약 600만 명으로, 잉카 제국을 약 1,200만 명(추산 400만~3,700만 명, 대부분 600만~1,400만 명)으로, 마야 문명의 여러 나라를 500만~1,000만 명으로, 타라스코 왕국을 1519년 약 150만 명으로 적는다. 호수 위의 도시 테노치티틀란은 20만 명 안팎이라는 추산이 많다. 북아메리카 동부에서는 카호키아가 비었어도 미시시피 문화의 족장 사회가 남동부에 이어졌고, 뉴욕주 북부에는 1450년 무렵 맺은 이로쿼이 연맹이 있었다. 카리브 해에서는 대앤틸리스의 타이노인이 카시케가 다스리는 사회를 이루고 작은 앤틸리스에는 카리브족이 살았는데, 이들이 들어온 때는 「타이노 카시케 사회와 칼리나고의 작은 앤틸리스 이주(1200~1250)」(앞의 사건)가 1200~1250년 무렵으로 다루는데, 고대 DNA에 바탕을 둔 모형은 이 사회가 자리 잡는 때를 1450년 무렵으로 본다. 이듬해 콜럼버스가 닿으며 이 모든 세계가 새 길을 걷게 된다(「콜럼버스와 다가마, 신항로 개척」(뒤의 사건))."
  subjects: [aztec, inca, tarascan, taino-culture, carib, haudenosaunee, mississippian-culture, maya-civilization]
  tags: [society]
