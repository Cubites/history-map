# 서아시아·북아프리카 사건 1차 묶음(me-01): 신바빌로니아·이집트 사이스 왕조·아케메네스·헬레니즘 왕국·파르티아·유대·남아라비아·누미디아 (기원전 664 ~ 기원전 36)
# 범위: 나보폴라사르와 신바빌로니아·예루살렘 함락과 바빌론 유수·나보니두스, 이집트 사이스 왕조(프삼티크 1세·아마시스 2세)와 캄비세스 2세의 정복, 키레네의 건설과 바투스 왕조,
#   키루스의 칙령과 제2성전, 다리우스 1세의 제국 정비·조로아스터교·왕위 다툼·이집트의 독립(제28~30왕조)과 재정복, 알렉산드로스 뒤의 이집트와 키레네·아트로파테네·셀레우코스 1세,
#   프톨레마이오스 1~3세와 시리아 전쟁·키레나이카의 분리와 유증, 아르사케스 1세에서 미트리다테스 2세까지 파르티아의 흥기와 페르시스·엘리마이스·카라케네·아디아베네,
#   나바테아(페트라·아레타스 3세)·하스몬 왕국(시몬·히르카노스·얀나이오스)과 헤롯의 즉위·이투라이아, 남아라비아 향료 왕국(사바·카타반·하드라마우트·힘야르)과 리히얀,
#   마사이실리와 누미디아(시팍스·마시니사·유구르타·유바 1세)·마우레타니아의 바가와 보쿠스 1세.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 기원전 550~31년 지도에서 생기거나 끝난 서아시아·북아프리카 항목과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음. 남아라비아와 리히얀은 비문 연대가 어림이라 학설을 밝혔다.
# 연도: 데이터에는 천문 연도(기원전 N년 = 1−N, 기원전 626년 = −625)로 넣고 본문에는 '기원전 626년'처럼 적었다. 전승·학설 연대는 '무렵'이나 학설임을 밝혔다.
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 율리우스력이라 달까지만 적거나 통설의 날짜를 적었다. 바빌로니아 달력과 마케도니아 달력의 해 어긋남(셀레우코스 기년 등)은 본문에 밝혔다.
# 이름 규칙: 고대 페르시아 왕은 교과서 꼴(키루스·캄비세스·다리우스·크세르크세스·아르타크세르크세스), 파르티아 왕은 그리스·라틴 꼴(아르사케스·미트리다테스·프라아테스·오로데스), 지방 왕조 이름은 항목 이름을 따랐다.
#   이집트 왕은 저장소 기존 표기(프삼티크·아마시스·넥타네보), 로마·그리스 인물은 저장소 기존 표기, 옛 도시는 굳은 표기(안티오키아·셀레우키아·알렉산드리아·페트라·키르타·카르타고), 헤브라이 인명은 개역 성경 표기를 따랐다.
# 다른 파일 사건과의 관계: 알렉산드로스의 원정·후계자 전쟁·포에니 전쟁·마카베오 반란·폼페이우스의 동방·카레 전투·카이사르의 내전·안토니우스와 악티움은 다시 쓰지 않고 「제목」으로 가리켰다.
#   악티움과 프톨레마이오스의 끝(기원전 31~30)은 쓰지 않았고, 헤롯은 예루살렘 함락(기원전 37)까지만 썼다.
# 한국사와 닿는 점: 이 시대 서아시아·북아프리카 사건과 한국사 항목이 직접 닿는 곳은 없어 subjects로 잇지 않았다(한과 파르티아의 첫 접촉만 `western-han`으로 이음).
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 서술은 새로 작성. 출처는 고대 사료와 표준 개설서의 원서(한국어 번역본은 쓰지 않음). 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'·출처로 적었다. 운영자 검수 필요.

- id: psamtik-i-664bc
  year: -663
  endYear: -594
  title:
    ko: "프삼티크 1세의 이집트 재통일(기원전 664~)과 네코 2세(기원전 610~595)"
  summary:
    ko: "아시리아는 기원전 671년 이집트를 쳐서 누비아계 제25왕조를 몰아내고 삼각주의 사이스를 다스리던 네코 1세를 앞세웠다. 네코 1세가 기원전 664/665년 누비아의 타누타문에게 죽자 아들 프삼티크 1세가 아시리아의 후원을 받아 사이스의 왕이 되었고, 이 사이스 왕조(제26왕조)는 이집트 토착 왕조의 마지막 번영기를 열었다. 프삼티크는 아시리아가 바빌론과 엘람에 발이 묶인 틈을 타 삼각주의 리비아계 군소 통치자들을 누르고, 기원전 656년 딸 니토크리스를 테베의 ‘아몬 신의 아내’ 후계자로 입양시키는 방식으로 상이집트까지 평화롭게 손에 넣었다. 헤로도토스는 바다에서 온 ‘청동 사람들’, 곧 이오니아·카리아 용병의 도움으로 열두 왕을 물리쳤다고 전한다(2.152). 이 용병과 삼각주의 교역 거점 나우크라티스가 사이스 왕조의 군사·경제 바탕이 되었고, 예술에서는 고왕국의 양식을 되살리는 복고풍이 퍼졌다. 프삼티크는 54년을 다스리고 기원전 610년 무렵 죽었다. 아들 네코 2세는 무너져 가는 아시리아를 도우려 시리아로 나아가 기원전 609년 므깃도에서 유다의 요시야를 죽였고(열왕기 하 23장), 기원전 605년 카르케미시에서 신바빌로니아의 네부카드네자르에게 크게 졌다(『바빌로니아 연대기』). 헤로도토스는 네코가 나일강과 홍해를 잇는 운하를 파다가 12만 명이 죽자 그만두었다고 하고(2.158), 페니키아 선원들에게 아프리카를 한 바퀴 돌게 했다고도 전하나(4.42) 뒤의 이야기는 확인할 수 없다. 이집트는 이 무렵 시리아를 두고 바빌로니아와 맞서는 대국이었다. 사이스는 삼각주 서쪽의 도시로 여신 네이트를 모셨고 왕조가 이름을 얻은 곳이다. 엘레판티네의 수비대에 유대인 용병이 있었다는 것도 뒤의 문서로 알려진다."
  subjects: [saite-egypt, neo-babylonian-empire, neo-assyrian-empire, kushite-egypt, judah-kingdom]
  tags: [politics, war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 2.147~159, 4.42 (A. D. Godley 영역, Loeb, 1920~1925)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, 1991)"]

- id: cyrene-battiads-631bc
  year: -630
  endYear: -438
  title:
    ko: "키레네의 건설(기원전 631 무렵)과 바투스 왕조, 공화정으로(기원전 440 무렵)"
  summary:
    ko: "헤로도토스가 전하는 키레네의 건국담은 이렇다. 에게해의 테라섬이 7년 가뭄을 겪자 델포이 신탁이 리비아에 도시를 세우라고 했고, 바투스(본명 아리스토텔레스)가 이주민을 이끌고 바다를 건너 먼저 플라타이아 섬에 머문 뒤 리비아 본토의 키레네 샘 둘레에 자리를 잡았다(4.150~158). 연대는 기원전 631년 무렵으로 잡는다. 바투스 1세에서 아르케실라오스 4세까지 이어진 바투스 왕조는 8명(논란이 있는 레아르코스를 빼고 셈)의 왕이 번갈아 바투스와 아르케실라오스를 이름으로 썼다. 바투스 2세(재위 기원전 583~560) 때 델포이의 권유로 그리스 이주민이 크게 늘자 땅을 빼앗긴 리비아 사람들이 이집트 제26왕조(사이스 왕조)의 아프리에스에게 도움을 청했고, 이집트군은 기원전 570년 무렵 이라사에서 키레네군에게 크게 졌다. 이 패배가 이집트의 군인 아마시스가 아프리에스를 몰아내는 계기가 되었다고 헤로도토스는 적는다(4.159). 바르카와 에우에스페리데스(뒤의 벵가지)·타우케이라 같은 도시가 이어 생겨 키레네와 함께 뒤에 펜타폴리스(‘다섯 도시’)라 불린 키레나이카의 도시들을 이루었다. 키레네는 약초 실피움을 팔아 부유했고 주화에 그 모습을 새겼다. 아르케실라오스 3세(재위 기원전 530~515 무렵)는 기원전 525년 이집트를 정복한 캄비세스 2세에게 공물을 바쳐 키레네가 아케메네스 제국의 종속 상태에 들었다. 그가 바르카에서 죽은 뒤 어머니 페레티마가 페르시아 총독 아리안데스의 군대를 끌어와 바르카를 함락했다(4.200~205). 바투스 4세(재위 기원전 515~465 무렵)의 아들 아르케실라오스 4세(재위 기원전 465~440 무렵)는 기원전 462년 델포이의 전차 경주에서 이겨 핀다로스가 노래했으나, 기원전 440년 무렵 왕조가 무너지고 도시는 공화정이 되었다. 리비아 사람들의 눈으로 보면 이 건설은 땅을 잃는 일이었고, 헤로도토스도 키레네 이주민이 리비아 부족의 땅을 차지해 갔다고 적는다(4.159)."
  subjects: [cyrene-kingdom, saite-egypt, achaemenid-empire]
  tags: [politics, society]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 4.150~205, 3.13 (A. D. Godley 영역, Loeb, 1920~1925)", "François Chamoux, Cyrène sous la monarchie des Battiades (De Boccard, 1953)", "Shimon Applebaum, Jews and Greeks in Ancient Cyrene (Brill, 1979)", "John Boardman 외 엮음, The Cambridge Ancient History IV: Persia, Greece and the Western Mediterranean, c. 525 to 479 B.C. (2판, 1988)"]

- id: nabopolassar-626bc
  year: -625
  endYear: -604
  title:
    ko: "나보폴라사르와 신바빌로니아의 성립(기원전 626)·니네베의 함락(기원전 612)"
  summary:
    ko: "아시리아의 아슈르바니팔이 죽은 뒤(기원전 631년, 627년설도 있다) 아들 아슈르에틸일라니를 거쳐 신샤르이슈쿤이 이었으나 장군 신슈무리시르의 반란 등으로 제국은 흔들렸고, 바빌로니아에서 나보폴라사르가 기원전 626년 바빌론의 왕위에 올라 아시리아군을 물리쳤다. 출신은 분명하지 않아 갈대아 부족이라고도, 바빌론의 유력 가문이라고도 하며, 『바빌로니아 연대기』는 그가 626년 11월 바빌론에서 왕위에 올랐다고 적는다. 나보폴라사르는 기원전 616년부터 유프라테스강을 따라 올라가며 아시리아 땅을 쳤고, 이란 북서부에서 일어난 메디아의 키악사레스(후와크샤트라)와 손을 잡았다. 기원전 614년 메디아가 아시리아의 옛 도읍 아슈르를 차지했고, 두 나라는 그 자리에서 동맹을 맺었다고 한다. 뒤에 나온 전승(베로소스)은 키악사레스의 딸 아미티스가 나보폴라사르의 아들 네부카드네자르와 혼인했다고 전하나 사실 여부는 확인되지 않는다. 기원전 612년 8월 바빌로니아·메디아 연합군은 니네베를 석 달 포위한 끝에 함락했고 아시리아 왕 신샤르이슈쿤은 이때 죽은 것으로 본다. 아시리아의 마지막 왕 아슈르우발리트 2세는 하란으로 물러났으나 기원전 610년 말 포위당한 하란이 이듬해 초 무너졌고, 기원전 609년 이집트 제26왕조의 네코 2세가 하란을 되찾으려 도왔으나 실패했다. 아시리아 땅은 바빌로니아와 메디아가 나눠 가졌다. 기원전 605년 왕자 네부카드네자르가 카르케미시에서 이집트군을 꺾었고, 그해 8월 나보폴라사르가 죽자 곧 돌아와 왕위를 이었다. 이로써 바빌로니아가 시리아와 팔레스타인의 새 주인이 되었다. 아시리아의 도읍 니네베와 아슈르는 폐허가 되어 오랫동안 되살아나지 못했고, 이 몰락은 구약의 예언자 나훔이 니네베의 멸망을 노래한 배경으로도 읽힌다."
  subjects: [neo-babylonian-empire, saite-egypt, neo-assyrian-empire, media-kingdom]
  tags: [politics, war]
  sources: ["A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Amélie Kuhrt, The Ancient Near East c. 3000–330 BC (Routledge, 1995)", "John Boardman 외 엮음, The Cambridge Ancient History III.2: The Assyrian and Babylonian Empires and Other States of the Near East, from the Eighth to the Sixth Centuries B.C. (2판, 1991)"]

- id: nebuchadnezzar-exile-605bc
  year: -604
  endYear: -559
  title:
    ko: "네부카드네자르 2세: 예루살렘의 함락(기원전 587)과 바빌론 유수, 바빌론의 건설(기원전 605~561)"
  summary:
    ko: "네부카드네자르 2세(재위 기원전 605~562)는 즉위 뒤 해마다 ‘하티 땅’, 곧 시리아와 팔레스타인으로 원정해 공물을 거두었다. 기원전 601년 이집트와 벌인 싸움은 양쪽 모두 큰 손해를 보았다고 『바빌로니아 연대기』가 적는데, 이를 틈타 유다의 여호야김이 반기를 들었다. 기원전 597년 3월 16일 바빌로니아군이 예루살렘을 차지하고 새 왕 여호야긴을 바빌론으로 끌어갔으며, 성경은 이때 유다의 지배층 3,023명이 옮겨졌다고 전한다(예레미야 52장). 바빌로니아가 세운 시드기야가 이집트를 믿고 다시 반기를 들자 기원전 589/588년 포위가 시작되어 기원전 587년(586년이라는 설도 있다) 여름 성이 무너졌고 성전이 불탔다. 시드기야는 눈이 멀어 끌려갔고 지배층 일부가 다시 바빌론으로 옮겨졌다. 총독으로 세운 그달리야가 암살되자 일부는 예레미야를 데리고 이집트로 달아났다. 이 일련의 강제 이주가 ‘바빌론 유수’이며, 이 경험 속에서 성경 여러 책이 정리되고 유대교의 율법·안식일 중심 신앙이 굳어졌다고 본다. 네부카드네자르는 티레를 오래 포위했고(요세푸스는 13년이라 전한다), 이집트에도 원정했다는 단편 비문이 있다(기원전 568/567년 무렵, 성과는 불분명하다). 수도 바빌론에는 이슈타르 문과 행렬 도로, 마르두크의 신전 탑 에테메난키 같은 대공사를 일으켰다. 기원전 562년 그가 죽은 뒤 아들 아멜마르두크가 기원전 561년 갇혀 있던 여호야긴을 풀어 주었고(열왕기 하 25장, 바빌론 배급 명부), 매형 네리글리사르가 기원전 560년 아멜마르두크를 죽이고 왕이 되었다. 바빌론 유수는 한 번에 끝난 사건이 아니라 기원전 597년·587년·582년 무렵의 여러 차례 이주로 이루어졌다고 보며, 성경은 582년의 이주를 745명으로 적는다(예레미야 52장). 유다에는 더 많은 사람이 남았고 땅은 바빌로니아의 지방이 되었다."
  subjects: [neo-babylonian-empire, saite-egypt, judah-kingdom]
  tags: [politics, war, religion]
  sources: ["A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Oded Lipschits, The Fall and Rise of Jerusalem: Judah under Babylonian Rule (Eisenbrauns, 2005)", "Amélie Kuhrt, The Ancient Near East c. 3000–330 BC (Routledge, 1995)", "Josephus(요세푸스), Contra Apionem(『아피온 반박』) 1.128~160 (H. St. J. Thackeray 영역, Loeb, 1926)"]

- id: amasis-cambyses-570bc
  year: -569
  endYear: -524
  title:
    ko: "아마시스 2세(기원전 570~526)와 캄비세스 2세의 이집트 정복(기원전 525)"
  summary:
    ko: "네코 2세 뒤 프삼티크 2세(재위 기원전 595~589)는 남쪽 누비아를 쳐서 아부심벨 신전에 그리스·카리아 용병의 낙서를 남겼고, 아프리에스(재위 기원전 589~570)는 시돈을 쳐 페니키아를 눌렀으나 예루살렘을 돕는 일은 이루지 못한 뒤 리비아의 키레네 원정에서도 크게 졌다(앞의 사건 「키레네의 건설(기원전 631 무렵)과 바투스 왕조, 공화정으로(기원전 440 무렵)」). 이 패배로 군이 들끓자 장군 아마시스가 기원전 570년 왕이 되자 아프리에스는 달아났고, 기원전 567년 무렵 바빌로니아의 도움으로 돌아오려다 죽었다(헤로도토스는 사로잡혀 이집트인에게 교살되었다고 전한다). 아마시스 2세(재위 기원전 570~526)는 그리스 상인을 삼각주의 나우크라티스에만 두게 하고 그리스 용병과 이집트 군인 사이의 균형을 맞췄으며, 키레네와 동맹하고 키프로스를 차지하며 사모스의 폴리크라테스와도 손잡아 이집트에 마지막 번영을 안겼다고 헤로도토스는 전한다(2.172~182). 그러나 바빌론을 얻은 아케메네스의 키루스 2세가 서쪽으로 힘을 뻗쳤고, 아마시스가 죽은 뒤 아들 프삼티크 3세는 기원전 525년 캄비세스 2세에게 펠루시움에서 크게 졌다. 후대 저술가 폴리아이노스(『전략』, 기원후 2세기)는 캄비세스 군이 고양이 같은 성스러운 동물을 앞세워 이겼다고 전하나(헤로도토스에는 없다) 믿기 어렵다. 멤피스가 함락되고 프삼티크 3세는 사로잡혔다가 반란을 꾀한 죄로 죽었다. 이집트는 아케메네스 제국의 사트라피(총독령)가 되었고(제27왕조) 캄비세스는 파라오의 칭호를 썼다. 사제 우자호레스네트의 비문은 그가 페르시아 왕을 도와 신전을 지켰다고 적는다. 캄비세스의 누비아 원정과 시와 오아시스로 보낸 군대는 크게 실패했다고 헤로도토스는 전하나(3.25~26), 이 서술을 의심하고 누비아에서 어느 정도 성과가 있었다고 보는 학자도 있다. 헤로도토스는 아마시스의 옛 참모였던 할리카르낫소스 출신 파네스가 페르시아로 넘어가 캄비세스의 원정을 부추겼고(3.4), 펠루시움 싸움 앞서 이집트 쪽 그리스·카리아 용병들이 파네스의 아들들을 죽여 그 피를 마셨다고 전한다(3.11). 이 정복으로 이집트는 페니키아·키프로스와 함께 페르시아 함대의 바탕이 되었다."
  subjects: [saite-egypt, achaemenid-empire, cyrene-kingdom]
  tags: [politics, war]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 2.161~182, 3.1~26 (A. D. Godley 영역, Loeb, 1920~1925)", "Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"]

- id: nabonidus-556bc
  year: -555
  endYear: -538
  title:
    ko: "나보니두스와 신바빌로니아의 끝: 타이마 체류(기원전 553~543 무렵)와 바빌론의 항복(기원전 539)"
  summary:
    ko: "네부카드네자르 2세 뒤 왕위는 아멜마르두크(재위 기원전 562~560), 네리글리사르(560~556), 어린 라바시마르두크(556년 몇 달)를 거쳐 기원전 556년 나보니두스에게 넘어갔다. 나보니두스는 하란의 달신 신(Sîn)의 여사제 아다구피의 아들로 알려져 있고, 바빌론의 마르두크 사제단보다 달신을 앞세워 사제단의 미움을 샀다. 그는 기원전 553년 무렵 군대를 이끌고 아라비아로 가서 타이마 오아시스에 약 10년 머물렀고(『나보니두스 연대기』, ‘시 설화’), 그동안 바빌론의 정무는 아들 벨사르우추르(성경의 벨사살)가 맡았다. 무슨 까닭으로 떠났는지는 학설이 갈리나 향료 길과 아라비아 교역로를 얻으려 했다는 설이 유력하다. 이 사이 동쪽에서는 아케메네스의 키루스 2세가 기원전 550년 메디아를 얻고 기원전 547년 무렵 리디아를 쳐서 바빌로니아와 맞서게 되었다(뒤의 사건 「키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)」). 나보니두스는 기원전 543년 무렵 바빌론으로 돌아와 새해 의식을 다시 치렀다. 기원전 539년 9월 말에서 10월 초 키루스가 티그리스강의 오피스에서 바빌로니아군을 꺾었고, 10월에 시파르가 싸우지 않고 항복했으며, 곧이어 키루스의 장군 구바루(고브리아스)가 바빌론에 들어갔다. 키루스는 그달 말 직접 입성했고, 나보니두스는 사로잡혔다. 키루스 원통은 키루스가 마르두크의 뜻으로 평화롭게 들어가 신상들을 제자리로 돌려놓았다고 적는데, 승자 쪽의 선전문이다. 나보니두스를 헐뜯는 ‘시 설화’는 그가 마르두크 신앙을 저버렸다고 비난하나 키루스 쪽에서 쓴 글이어서 그대로 믿기 어렵다. 달신을 앞세워 사제단과 갈등한 것은 사실로 보이지만 그것만으로 바빌로니아가 안에서 무너졌다고 보기는 어렵다는 견해가 있다."
  subjects: [neo-babylonian-empire, achaemenid-empire, media-kingdom]
  tags: [politics, war]
  sources: ["Paul-Alain Beaulieu, The Reign of Nabonidus, King of Babylon 556–539 B.C. (Yale University Press, 1989)", "A. K. Grayson, Assyrian and Babylonian Chronicles (J. J. Augustin, 1975)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)"]

- id: south-arabia-550bc
  year: -549
  endYear: -401
  title:
    ko: "남아라비아의 향료 왕국: 사바의 패권과 카타반·하드라마우트의 자립(기원전 6~5세기)"
  summary:
    ko: "남아라비아의 향료 왕국들은 몬순 비와 와디(계절 강)의 물로 농사를 짓던 고원과 골짜기에 있었고, 사바(도읍 마리브)·마인(도읍 카르나우)·카타반(도읍 팀나)·하드라마우트(도읍 샤브와)가 대표적이다. 이들의 기록은 남아랍 문자로 새긴 비문뿐이어서 연대가 어림이고, 왕국의 시작을 높여 잡는 긴 연대와 낮춰 잡는 짧은 연대가 맞선다. 사바의 군주는 처음 ‘무카리브’(사제 왕)라 불렸고, 아시리아 센나케리브(재위 기원전 704~681)의 기록에 사바의 왕 카리빌루가 공물을 바친 이로 나오는데, 이를 카리브일 와타르로 보면 긴 연대로는 기원전 7세기 전반이 되고 짧은 연대로는 7세기 말~6세기 초가 된다. 사바는 마리브 오아시스에 댐과 수로를 만들고 알마카흐 신을 모신 신전을 세워 농사와 유향 교역으로 힘을 얻었다. 사바가 기원전 7~6세기에 가장 강했고 카타반과 하드라마우트가 한동안 그 영향 아래 있었다고 보며, 두 나라는 기원전 5세기 무렵 따로 비문을 새기며 자립한 것으로 본다. 이 무렵 사바 군주의 호칭이 ‘무카리브’에서 ‘말리크’(왕)로 바뀌었다는 설명도 있다. 그리스 저술가들은 유향이 아라비아에서만 난다고 적고(헤로도토스 3.107), 아라비아 사람들이 해마다 유향 1천 탈란톤을 다리우스에게 바쳤다고 한다(3.97). 향료를 실은 대상은 샤브와에서 팀나와 마리브를 거쳐 히자즈로 올라갔다. 이 교역이 남아라비아의 왕국들을 부유하게 했고, 나라마다 신전과 관개 시설을 세울 힘을 주었다. 이 시기의 정치사는 연대가 불분명하므로 위 서술의 시기는 대략의 틀로 읽는다. 마인은 와디 자우프에서 향료 대상 장사를 맡은 나라로 북쪽 데단에까지 거류지를 두었다고 한다. 비문에는 신전 건립과 관개 공사, 이웃 나라와의 전쟁이 적히며, 사바가 먼저 패권을 쥐었다가 여러 나라가 서로 견제하는 구도로 바뀌었다는 큰 줄기만 학자들이 받아들인다."
  subjects: [saba-kingdom, qataban, hadramawt-kingdom]
  tags: [politics, economy]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 3.97, 3.107~113 (A. D. Godley 영역, Loeb, 1920~1925)", "Jean-François Breton, Arabia Felix from the Time of the Queen of Sheba: Eighth Century B.C. to First Century A.D. (Albert LaFarge 영역, University of Notre Dame Press, 1999)", "Gus W. Van Beek, ‘Frankincense and Myrrh in Ancient South Arabia’, Journal of the American Oriental Society 78 (1958)"]

- id: return-from-exile-538bc
  year: -537
  endYear: -515
  title:
    ko: "키루스의 칙령과 유대인의 귀환·제2성전의 완공(기원전 538~516)"
  summary:
    ko: "기원전 539년 바빌론을 얻은 키루스 2세는 이듬해 바빌론에 끌려와 있던 사람들이 고향으로 돌아가 신전을 다시 짓도록 허락했다고 성경은 전한다(에스라 1장). 아람어로 된 공문 사본은 성전의 크기와 비용을 왕궁이 댄다고 적는다(에스라 6장). 키루스 원통은 유대인을 특정하지 않고 바빌로니아가 가둬 둔 신상들을 본래 신전으로 돌려보내고 끌려온 사람들을 고향에 돌려보냈다고 적어, 이 일이 제국 전체의 종교 정책의 하나였음을 보여 준다. 유다 왕가의 후손 세스바살이 성전 기물을 가지고 앞서 돌아왔고, 이어 스룹바벨과 대제사장 예수아(여호수아)가 이끄는 무리가 돌아왔다. 성경은 돌아온 사람 수를 4만 2천여 명이라 적으나(에스라 2장) 학자들은 그 가운데 상당수가 오랜 시간 몇 차례에 걸쳐 돌아온 수일 것으로 본다. 제단은 곧 다시 세웠으나, 근처에 살던 사람들의 방해와 가난으로 성전 공사는 중단되었다. 기원전 520년 다리우스 1세 2년에 예언자 학개와 스가랴가 재건을 재촉하자 공사가 다시 시작되어 기원전 516/515년 봄 제2성전이 완성되었다(에스라 6장). 유다는 아케메네스의 ‘강 건너’ 총독령의 한 주로서 총독 아래 자치적인 종교 공동체가 되었다. 돌아온 이들이 이룬 도시 예루살렘은 인구가 수천 명에 그쳤다는 것이 고고학의 추정이며, 바빌론에 남은 유대인 공동체도 오래 이어졌다. 성경 속 귀환 기록의 숫자와 순서는 뒷날의 편집을 거친 것이어서, 역사가들은 키루스 칙령의 정확한 내용과 귀환의 규모를 놓고 논쟁해 왔다. 예루살렘 성벽의 재건은 이때가 아니라 기원전 5세기 중엽 느헤미야의 일로 전한다. 돌아오지 않고 바빌로니아에 남은 유대인은 훨씬 많았고 그곳에서 상업과 학문의 공동체를 이루었다."
  subjects: [achaemenid-empire]
  tags: [religion, politics]
  sources: ["『히브리 성경』 에스라 1~6장, 학개, 스가랴", "Oded Lipschits, The Fall and Rise of Jerusalem: Judah under Babylonian Rule (Eisenbrauns, 2005)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)"]

- id: darius-i-administration-522bc
  year: -521
  endYear: -485
  title:
    ko: "다리우스 1세의 제국 정비: 「베히스툰 비문」·사트라피·왕의 길·페르세폴리스·화폐(기원전 522~486)"
  summary:
    ko: "앞의 사건 「키루스 2세와 아케메네스 제국의 성립(기원전 550~539), 캄비세스 2세와 다리우스 1세의 즉위(기원전 522)」에 이어, 다리우스 1세는 즉위 직후 바빌론·엘람·메디아 등지에서 터진 반란을 1년 남짓 만에 눌렀다. 이 승리는 베히스툰 절벽에 고대 페르시아어·엘람어·바빌로니아어로 새겨졌고, 「베히스툰 비문」은 다리우스가 아후라마즈다의 도움으로 ‘아홉 왕’을 이겼다고 선언한다. 다리우스는 제국을 20여 개의 사트라피(총독령)로 나누어 사트라프에게 세금과 치안을 맡기고, 왕실 서기관과 군사령관을 따로 두어 서로 견제하게 했다. 헤로도토스는 사트라피마다 정한 조공을 적으며 은으로 내는 곳 가운데 바빌로니아가 1천 탈란톤으로 가장 많았고 이집트는 700탈란톤을 냈으며 인도는 사금 360탈란톤을 내 모든 곳 가운데 가장 많았다고 한다(3.89~97). 사르디스에서 수사까지 이어진 ‘왕의 길’에는 역참이 111곳 있어 왕의 전령이 말을 바꿔 달렸다고 전한다(5.52~54). 다릭 금화와 시글로스 은화가 쓰이고 도량형이 통일되었으며 행정 문서에는 아람어를 두루 썼다. 다리우스는 수사에 궁전을, 기원전 518년 무렵 페르세폴리스에 계단식 기단과 아파다나(알현실)를 짓기 시작했고, 나일강과 홍해를 잇는 운하를 완성해 기념 비석을 세웠다. 인더스강 하류까지 군을 보냈고, 서쪽으로는 기원전 513년 무렵 스키타이 원정(뒤의 사건 「다리우스 1세의 스키타이 원정(기원전 513 무렵)과 트라키아·마케도니아의 종속」)과 그리스 도시들의 반란(뒤의 사건 「이오니아 반란(기원전 499~493)과 마라톤 전투(기원전 490)」)에 부딪혔다. 다리우스는 기원전 486년 죽고 아들 크세르크세스가 이었다."
  subjects: [achaemenid-empire]
  tags: [politics, economy, culture]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 3.88~97, 4.44, 5.49~54 (A. D. Godley 영역, Loeb, 1920~1925)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)", "Ilya Gershevitch 엮음, The Cambridge History of Iran II: The Median and Achaemenian Periods (1985)"]

- id: zoroastrianism-achaemenid-522bc
  year: -521
  endYear: -358
  title:
    ko: "조로아스터교와 아케메네스 제국의 종교(기원전 6~4세기)"
  summary:
    ko: "조로아스터교는 예언자 자라투스트라(조로아스터)의 가르침을 따르는 종교이고, 그의 시를 모은 『가타』가 가장 오래된 경전 『아베스타』의 핵심이다. 가타의 언어가 기원전 2천년기 후반의 동이란 말에 가까워 자라투스트라가 기원전 1500~1000년 무렵 동이란이나 중앙아시아에서 살았다고 보는 학자가 많지만, 조로아스터교 전승은 그를 알렉산드로스보다 258년 앞선 기원전 6세기 사람으로 두는 반면 그리스 저술가들은 크세르크세스의 침공(기원전 480)보다 6천 년 앞선다고 적어 연대는 풀리지 않았다. 아케메네스 왕들의 비문은 이 신앙을 보여 주는 가장 이른 기록이다. 다리우스 1세는 「베히스툰 비문」에서 아후라마즈다의 도움으로 왕이 되었다고 선언하고 반란자들을 ‘거짓(드루가)’을 따른 자로 몬다. 크세르크세스 1세는 「다이바 비문」에서 데바(옛 신)를 섬기던 곳을 없애고 아후라마즈다를 올바른 법도로 섬겼다고 적는다. 그러나 이 왕들이 가타를 따른 조로아스터교도였는지, 이란 고유의 다신교를 아후라마즈다 중심으로 정리했는지는 학설이 갈린다. 페르세폴리스의 행정 문서는 아후라마즈다 외에도 엘람과 바빌로니아의 신들에게 바친 제물을 기록하고, 아르타크세르크세스 2세(재위 기원전 404~358)의 비문은 아후라마즈다에 더해 미트라와 아나히타를 부른다. 헤로도토스는 페르시아인이 신상 없이 산꼭대기에서 제사하고 불을 섬기며 마기라 불린 사제가 제의를 맡는다고 적는다(1.131~140). 아케메네스 왕조는 이집트 신전, 예루살렘 성전, 바빌로니아 신전을 후원하며 믿음을 강요하지 않았다. 『아베스타』의 정리와 조로아스터교의 국가 종교화는 훨씬 뒤의 일이다. 페르세폴리스 요새 문서는 ‘마구시’라 불린 사제들이 제사를 맡았음을 보여 주나, 이를 곧 조로아스터교 사제 집단으로 단정하는 것은 하나의 학설이다. ‘낙원’을 뜻하는 낱말 파라다이스가 왕의 정원을 뜻하는 페르시아어에서 나온 것처럼 이란의 말과 관념은 이웃 종교에도 영향을 주었다고 본다."
  subjects: [achaemenid-empire]
  tags: [religion, culture]
  sources: ["Herodotus(헤로도토스), Historiai(『역사』) 1.131~140 (A. D. Godley 영역, Loeb, 1920~1925)", "Mary Boyce, A History of Zoroastrianism, vol. 2: Under the Achaemenians (Brill, 1982)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"]

- id: achaemenid-succession-465bc
  year: -464
  endYear: -403
  title:
    ko: "아케메네스 왕위 다툼: 크세르크세스 1세의 죽음(기원전 465)에서 다리우스 2세(기원전 423~404)까지"
  summary:
    ko: "앞의 사건 「크세르크세스 1세의 그리스 원정(기원전 480~479): 테르모필레·살라미스·플라타이아, 델로스 동맹(기원전 478)」 뒤, 아케메네스 제국의 크세르크세스 1세는 기원전 465년 8월 근위대장 아르타바누스와 환관 아스파미트레스에게 암살되었다고 크테시아스는 전한다. 아르타바누스가 어린 아르타크세르크세스를 속여 맏아들 다리우스를 죽이게 했으나 곧 음모가 드러나 아르타크세르크세스가 아르타바누스를 죽이고 왕위에 올랐다는 것이 디오도로스(11.69)와 크테시아스가 전하는 줄거리다. 아르타크세르크세스 1세(재위 기원전 465~424)는 박트리아에서 반란을 일으킨 동생 히스타스페스를 눌렀고, 아테네의 지원을 받은 이집트 이나로스의 반란(기원전 460~454)을 장군 메가비조스를 보내 가라앉혔다. 아테네와 맺은 칼리아스 화약(기원전 449 무렵)이 실제로 있었는지는 고대부터 논란이다. 성경이 전하는 에스라와 느헤미야의 유다 활동도 이 시기다. 기원전 424년 왕이 죽자 아들 크세르크세스 2세가 45일 만에 이복형제 소그디아노스에게 죽었고, 소그디아노스도 크테시아스에 따르면 반년 남짓 뒤 이복형제 오코스에게 죽임을 당했다. 오코스는 다리우스 2세(재위 기원전 423~404)로 이름을 바꿔 즉위했고 아내 파뤼사티스의 영향 아래 소아시아 총독들의 반란과 싸웠다. 아들 소 키루스를 사르디스 총독으로 보냈으며, 그가 죽는 기원전 404년 무렵 이집트가 반기를 들었다(뒤의 사건 「아미르타이오스의 독립(기원전 404)과 제28·29왕조, 넥타네보 1세의 방어(기원전 373)」). 이 기간의 왕 이름과 재위 연대는 크테시아스·디오도로스·바빌로니아 문서가 어긋나는 부분이 있다."
  subjects: [achaemenid-empire]
  tags: [politics]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 11.69, 12.64~71, 13.108 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Lloyd Llewellyn-Jones·James Robson, Ctesias’ History of Persia: Tales of the Orient (Routledge, 2010)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)", "Amélie Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"]

- id: egypt-independence-404bc
  year: -403
  endYear: -372
  title:
    ko: "아미르타이오스의 독립(기원전 404)과 제28·29왕조, 넥타네보 1세의 방어(기원전 373)"
  summary:
    ko: "아케메네스의 사트라피가 된 이집트는 아르타크세르크세스 1세 때 이나로스의 반란이 진압된 뒤에도 페르시아 아래 있었다. 그러나 다리우스 2세가 죽을 무렵인 기원전 404년 사이스의 아미르타이오스가 반기를 들고 파라오를 칭했다. 상이집트까지 페르시아의 지배가 끝난 것은 기원전 400년 무렵으로 보는데, 엘레판티네의 아람어 문서가 이 무렵을 마지막으로 페르시아 왕의 연대를 쓰기 때문이다(앞의 사건 「아케메네스 왕위 다툼: 크세르크세스 1세의 죽음(기원전 465)에서 다리우스 2세(기원전 423~404)까지」). 아미르타이오스가 제28왕조의 유일한 왕(재위 기원전 404~399)이다. 기원전 399년 멘데스의 네페리테스 1세가 그를 몰아내고 제29왕조를 열었고, 스파르타에 곡물 50만 메딤노스와 삼단노선 100척분의 자재를 보내 페르시아와 맞서게 했으나(기원전 396, 디오도로스 14.79), 이 물자는 로도스에서 페르시아 편 아테네 제독 코논에게 가로채였다. 하코르(재위 기원전 393~380, 사이에 프삼무티스가 1년 남짓 왕이 됨)는 키프로스의 에바고라스와 손잡고 페르시아의 침공을 막았고 카르낙과 메디네트 하부에 건물을 세웠다. 아들 네페리테스 2세는 몇 달 만에 쫓겨났고 세벤니토스 출신 장군 넥타네보 1세가 제30왕조를 열었다(재위 기원전 380~362). 기원전 373년 페르시아 총독 파르나바조스와 아테네 장군 이피크라테스가 이끈 대군이 삼각주로 쳐들어왔으나 두 사람의 불화와 나일강의 범람으로 물러났다고 디오도로스는 전한다(15.41~43). 넥타네보 1세는 필라이 섬의 이시스 신전을 비롯한 여러 신전을 짓고 넓혔다. 독립 이집트는 그리스 용병에 크게 기댔고, 페르시아는 소 키루스의 반란(뒤의 사건 「소 키루스의 반란과 1만 그리스 용병의 귀환(기원전 401~399), 킬리키아 왕국의 끝」)과 소아시아 문제에 발이 묶여 한동안 이집트를 되찾지 못했다."
  subjects: [egypt-late-dynasties, achaemenid-empire]
  tags: [politics, war]
