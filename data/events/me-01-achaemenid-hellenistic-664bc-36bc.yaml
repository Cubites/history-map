- id: incense-lihyan-400bc
  year: -399
  endYear: -247
  title:
    ko: "향료 길과 남아라비아·북서 아라비아: 마인 거류지와 리히얀 왕국(기원전 400~250 무렵)"
  summary:
    ko: "남아라비아의 향료를 지중해로 나르는 대상로는 히자즈의 오아시스들을 따라 올라갔다. 북서 아라비아 알울라 골짜기의 데단(지금의 알쿠라이바)은 이 길의 쉼터였고, 마인 상인의 거류지가 있어 마인의 신 왓드를 섬겼다고 비문이 전한다. 리히얀 왕국은 이 데단을 도읍으로 한 오아시스 왕국으로 데단 문자(리히얀 문자) 비문과 바위 무덤을 남겼다. 연대는 크게 논란이다. 전통적으로 기원전 4세기 무렵에 왕국이 섰다고 보지만 시작을 기원전 6세기 중반에서 4세기 중반 사이로 넓게 잡는 학설도 있고, 이 나라가 나바테아에 흡수된 때도 기원전 1세기라는 설과 훨씬 이르다는 설이 갈린다. 이름이 알려진 왕은 열두 명 남짓이다. 이웃의 타이마 오아시스는 기원전 6세기 중반 나보니두스가 머문 곳이어서 이 일대가 이미 바빌로니아의 눈길을 끌었음을 보여 준다(앞의 사건 「나보니두스와 신바빌로니아의 끝: 타이마 체류(기원전 553~543 무렵)와 바빌론의 항복(기원전 539)」). 헬레니즘 시대에 향료는 지중해의 큰 수요를 얻었다. 테오프라스토스는 향나무의 산지를 아라비아 남부로 적었고(『식물 탐구』 9.4), 프톨레마이오스 2세는 홍해 연안에 항구를 열어 향료 교역의 일부를 바닷길로 돌렸다. 남쪽에서는 카타반이 기원전 3세기에 남서 고지와 아덴 쪽으로 넓어진 것으로 보이고, 하드라마우트는 마흐라와 도파르 해안 쪽으로 영향을 넓힌 것으로 본다. 사바는 마리브의 댐과 교역 거점으로 이름을 지켰으나 두 이웃에게 밀려 힘이 줄었다. 이들 나라의 연대는 비문마다 달라 대략의 틀이다. 데단은 성경에서도 대상 교역지로 나오며(이사야 21장 13절 ‘데단 사람의 대상’, 에스겔 27장 20절 안장 깔개 장사), 이는 이 오아시스의 교역이 기원전 7~6세기부터 이름났음을 보여 준다."
  subjects: [lihyan, qataban, hadramawt-kingdom, saba-kingdom, ptolemaic-kingdom]
  tags: [economy, politics]
  sources: ["Jean-François Breton, Arabia Felix from the Time of the Queen of Sheba: Eighth Century B.C. to First Century A.D. (Albert LaFarge 영역, University of Notre Dame Press, 1999)", "F. V. Winnett·W. L. Reed, Ancient Records from North Arabia (University of Toronto Press, 1970)", "Gus W. Van Beek, ‘Frankincense and Myrrh in Ancient South Arabia’, Journal of the American Oriental Society 78 (1958)", "Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)"]

- id: artaxerxes-iii-358bc
  year: -357
  endYear: -335
  title:
    ko: "아르타크세르크세스 3세의 즉위(기원전 358)와 이집트 재정복(기원전 343), 바고아스와 다리우스 3세(기원전 336)"
  summary:
    ko: "아르타크세르크세스 2세(재위 기원전 404~358) 말년에 소아시아 총독들이 일으킨 반란(대 사트라프 반란, 기원전 366~360 무렵)과 이집트 타코스(제30왕조)의 시리아 원정은 모두 실패로 끝났다. 타코스는 기원전 360년 무렵 그리스 용병과 아게실라오스를 데리고 시리아로 갔으나 조카 넥타네보 2세의 반란으로 쫓겨났다. 기원전 358년 즉위한 아르타크세르크세스 3세(오코스, 재위 358~338)는 왕위를 굳히려 왕족 여럿을 죽였다고 전한다(유스티누스 10.3). 기원전 351/350년의 이집트 원정은 넥타네보 2세가 그리스 용병으로 막아냈고, 이 실패가 페니키아와 키프로스의 반란을 부추겼다. 시돈 왕 테네스가 일으킨 반란은 테네스가 시돈을 페르시아에 넘기면서 끝났고, 시돈은 불에 타 4만 명 남짓이 죽었다고 디오도로스는 전한다(16.40~45, 숫자는 과장일 수 있다). 기원전 343년 아르타크세르크세스 3세는 로도스 출신 용병대장 멘토르 등과 이집트에 쳐들어가 펠루시움을 얻고 멤피스로 나아갔다. 넥타네보 2세는 남쪽으로 달아났고 토착 왕조는 끝났다(제31왕조, 기원전 343~332). 그리스 저술가들은 왕이 신전을 약탈하고 성스러운 아피스 황소를 도살했다고 전하나 이집트 쪽 기록은 이를 뒷받침하지 않는다는 반론이 있다. 아르타크세르크세스 3세는 기원전 338년 환관 바고아스에게 독살되었다(디오도로스 17.5). 바고아스는 막내 아르세스(재위 기원전 338~336)를 세웠다가 336년 그도 죽이고 먼 친척 다리우스 3세(코도만노스, 재위 기원전 336~330)를 왕으로 앉혔으나 오히려 다리우스에게 독배를 받아 죽었다. 이 소란은 곧 알렉산드로스가 쳐들어오기 직전 제국의 약점이 되었다."
  subjects: [egypt-late-dynasties, achaemenid-empire]
  tags: [politics, war]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 15.90~93, 16.40~52, 17.5 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 10.3 (J. C. Yardley 영역, 1994)", "Alan B. Lloyd, ‘The Late Period, 664–323 BC’, B. G. Trigger 외, Ancient Egypt: A Social History (Cambridge University Press, 1983)", "Pierre Briant, From Cyrus to Alexander: A History of the Persian Empire (Peter T. Daniels 영역, 2002)"]

- id: ptolemy-egypt-332bc
  year: -331
  endYear: -320
  title:
    ko: "알렉산드로스의 이집트와 알렉산드리아의 건설(기원전 332~331), 프톨레마이오스의 이집트·키레네 장악(기원전 323~321)"
  summary:
    ko: "기원전 332년 말 마케도니아 왕 알렉산드로스가 이집트에 들어서자 페르시아 총독 마자케스는 싸우지 않고 펠루시움과 멤피스를 넘겼다(앞의 사건 「알렉산드로스의 소아시아와 시리아 정복(기원전 334~332): 그라니코스, 이소스, 티레」). 이집트인은 페르시아의 지배에 지쳐 있어 그를 해방자로 맞았다고 전한다. 알렉산드로스는 멤피스에서 이집트 신들에게 제사한 뒤 삼각주 서쪽 끝, 바다와 마레오티스 호수 사이에 그리스식 도시 알렉산드리아의 터를 잡게 했고(아리아노스 3.1), 이어 시와 오아시스의 아몬 신탁소를 찾아 ‘아몬의 아들’이라는 인정을 받았다고 한다(3.3~4). 기원전 331년 초 이집트를 떠났으며, 재정은 나우크라티스 출신 클레오메네스가 맡았다. 알렉산드로스가 기원전 323년 죽은 뒤 바빌론 분할에서 프톨레마이오스가 이집트를 맡았고(뒤의 사건 「알렉산드로스의 죽음과 바빌론 분할(기원전 323), 라미아 전쟁, 트리파라데이소스(기원전 320)」), 그는 클레오메네스를 처형하고 재정을 쥐었다. 같은 때 키레네에서는 기원전 324년 무렵부터 스파르타 용병대장 티브론이 하르팔로스의 도망병을 이끌고 도시를 공격했으나 기원전 322년 키레네 망명자들의 요청으로 온 프톨레마이오스의 장군 오펠라스에게 졌고(디오도로스 18.19~21), 이로써 키레네에 프톨레마이오스의 지배가 시작되어 바투스 왕조 이래 이어진 이 도시의 독립이 일단 끝났다. 기원전 321년 프톨레마이오스는 알렉산드로스의 시신을 실은 장례 행렬을 시리아에서 가로채 이집트로 가져왔다(18.28). 곧이어(기원전 321/320년) 섭정 페르디카스가 이집트를 쳤으나 나일강을 건너다 군을 잃고 부하들에게 살해되었다. 이집트는 이렇게 프톨레마이오스 왕국의 중심이 되었다."
  subjects: [macedonia-kingdom, ptolemaic-kingdom, cyrene-kingdom, achaemenid-empire]
  tags: [politics, war]
  sources: ["Arrian(아리아노스), Anabasis Alexandrou(『알렉산드로스 원정기』) 3.1~5 (P. A. Brunt 영역, Loeb, 1976~1983)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 18.19~21, 18.28~36 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII.1: The Hellenistic World (2판, 1984)"]

- id: atropatene-328bc
  year: -327
  endYear: -219
  title:
    ko: "아트로파테스와 아트로파테네 왕국(기원전 328~220 무렵)"
  summary:
    ko: "아트로파테스는 다리우스 3세 때 메디아 사람들을 이끌고 가우가멜라에서 싸운 페르시아 귀족이다. 항복한 뒤 마케도니아 왕 알렉산드로스는 기원전 328년 메디아 총독 옥시다테스를 면직하고 그를 메디아 총독에 앉혔다(아리아노스 4.18). 아트로파테스는 기원전 324년 반란을 꾀한 바리악세스를 붙잡아 넘겨 신임을 얻었고, 그의 딸은 수사의 합동 혼례(기원전 324)에서 장군 페르디카스와 혼인했다(7.4). 알렉산드로스가 죽은 뒤 바빌론 분할(기원전 323)에서 큰 메디아는 페이톤이 맡았으나 메디아 북쪽의 아트로파테스는 작은 지방을 지켰고, 스트라보는 이 땅이 그의 이름을 따라 아트로파테네로 불리게 되었다고 적는다(11.13.1). 이 왕국은 지금 이란 서·동아제르바이잔주 일대(도읍은 간자크)에 있었고, 그 이름은 오늘날 아제르바이잔이라는 이름의 뿌리가 되었다. 아트로파테스의 후손이 왕위를 이었고, 셀레우코스 제국이 세워진 뒤에도 안으로는 독립을 지켰다. 기원전 220년 안티오코스 3세는 반란을 일으킨 몰론을 누르고 메디아를 정리하는 길에 아트로파테네를 쳤고, 늙은 왕 아르타바자네스는 조약을 맺고 셀레우코스의 종주권을 받아들였다(폴리비오스 5.55). 이 왕국은 뒤에 파르티아의 종속 왕국으로 남았다가 사산 제국에 흡수되었다. 아트로파테네는 이란 고원의 서북쪽 길목에서 아르메니아와 메소포타미아를 잇는 구실을 했다. 아트로파테스라는 이름은 고대 페르시아어 ‘아타르파타’(불이 지키는 이)에서 나온 것으로 풀이한다. 스트라본은 이 나라가 산이 많고 추운 땅이며 기병 1만과 보병 4만을 낼 수 있다고 전한다(11.13.2). 아트로파테네 왕들의 주화와 비문은 거의 전하지 않아 이 왕국의 역사는 그리스·로마 저술가의 짧은 언급에 크게 기댄다."
  subjects: [atropatene, macedonia-kingdom, seleucid-empire]
  tags: [politics]
  sources: ["Arrian(아리아노스), Anabasis Alexandrou(『알렉산드로스 원정기』) 3.8, 4.18, 6.29, 7.4 (P. A. Brunt 영역, Loeb, 1976~1983)", "Strabo(스트라본), Geographica(『지리지』) 11.13.1~13 (H. L. Jones 영역, Loeb, 1917~1932)", "Polybius(폴리비오스), Historiai(『역사』) 5.40~55 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Ehsan Yarshater 엮음, The Cambridge History of Iran, vol. 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: seleucus-i-312bc
  year: -311
  endYear: -280
  title:
    ko: "셀레우코스 1세와 제국의 성립: 바빌론 회복(기원전 312)·셀레우키아·찬드라굽타와의 조약(기원전 303 무렵)·안티오키아(기원전 300 무렵)"
  summary:
    ko: "알렉산드로스 뒤 바빌로니아 총독이던 셀레우코스는 안티고노스 1세에게 쫓겨 기원전 316/315년 이집트의 프톨레마이오스에게 달아났다(앞의 사건 「후계자 전쟁 2: 안티고노스의 아시아와 카산드로스의 마케도니아(기원전 320~311), 가자 전투와 311년 평화」). 기원전 312년 프톨레마이오스가 가자에서 안티고노스의 아들 데메트리오스를 꺾자 셀레우코스는 소수의 병력으로 바빌론에 돌아가 주민의 환영 속에 도시를 되찾았다. 이 해가 셀레우코스 기년의 원년이다(바빌로니아 달력으로는 기원전 311년 봄, 마케도니아 달력으로는 312년 가을). 이어 안티고노스 1세의 왕국과 ‘바빌로니아 전쟁’(기원전 311~309)을 치러 이겼고, 그 뒤 여러 해(기원전 311~302년 무렵)에 걸쳐 이란 고원과 박트리아를 평정했다. 도읍으로는 바빌론 가까운 티그리스강 가에 새 도시 셀레우키아를 세웠다(기원전 305 무렵). 인도에서는 마우리아의 찬드라굽타와 싸우다가 기원전 303년 무렵 조약을 맺어 인더스강 서쪽 땅을 넘기고 코끼리 500마리를 받았다고 한다(스트라본 15.2.9, 유스티누스 15.4). 이 코끼리가 기원전 301년 입소스 전투에서 안티고노스를 꺾는 데 큰 몫을 했다(뒤의 사건 「후계자 전쟁 3: 왕 칭호(기원전 306~305), 로도스 포위, 입소스 전투(기원전 301)」). 입소스 뒤 시리아 북부를 차지한 셀레우코스는 기원전 300년 무렵 오론테스강 가에 안티오키아를, 같은 지방에 셀레우키아 피에리아·아파메이아·라오디키아를 세워 시리아를 도시들로 묶었다. 그는 기원전 281년 코루페디온에서 리시마코스를 꺾었으나(뒤의 사건 「후계자 전쟁 4: 마케도니아의 왕들(기원전 297~277), 코루페디온 전투(기원전 281)와 리시마코스의 끝」) 유럽으로 건너간 직후 프톨레마이오스 케라우노스에게 암살되었다."
  subjects: [seleucid-empire, antigonid-asia]
  tags: [politics, war, diplomacy]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 19.90~92, 19.100 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Strabo(스트라본), Geographica(『지리지』) 15.2.9 (H. L. Jones 영역, Loeb, 1917~1932)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 15.4 (J. C. Yardley 영역, 1994)", "Susan Sherwin-White·Amélie Kuhrt, From Samarkand to Sardis: A New Approach to the Seleucid Empire (Duckworth, 1993)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII.1: The Hellenistic World (2판, 1984)"]

- id: ptolemy-museum-305bc
  year: -304
  endYear: -271
  title:
    ko: "프톨레마이오스 1·2세의 이집트: 왕 칭호(기원전 305)와 알렉산드리아의 무세이온, 남매 혼인(기원전 275 무렵)"
  summary:
    ko: "안티고노스 부자가 기원전 306년 왕을 칭하자(같은 때의 사건 「후계자 전쟁 3: 왕 칭호(기원전 306~305), 로도스 포위, 입소스 전투(기원전 301)」) 프톨레마이오스 1세도 기원전 305년 무렵 자신을 왕이라 불렀다. 그가 시작한 프톨레마이오스 왕조는 알렉산드리아를 도읍으로 삼았고, 이집트는 그리스계 지배층과 이집트 농민으로 나뉜 사회가 되었다. 그리스인은 알렉산드리아·나우크라티스·프톨레마이스 같은 도시에 살며 그리스어로 행정을 했고, 이집트 신전의 사제단은 왕실의 후원과 감독을 함께 받았다. 프톨레마이오스 1세는 오시리스와 아피스의 성격에 그리스 신의 모습을 섞은 사라피스 신을 세워 두 집단이 함께 섬기게 했다고 한다(플루타르코스). 이집트의 사제 마네토는 그리스어로 『이집트사』를 써서 30개 왕조의 틀을 남겼다. 왕은 아테네의 철학자 팔레론의 데메트리오스의 권유로 학자를 모은 무세이온(학술 기관)과 도서관을 세웠다고 전하며(전승), 수학자 유클리드가 이 알렉산드리아에서 가르쳤다고 한다. 파로스 섬의 등대는 기원전 280년 무렵 완성되었다. 기원전 301년 입소스 뒤 프톨레마이오스가 코엘레시리아를 차지한 일은 셀레우코스와의 오랜 분쟁의 씨앗이 되었다. 그는 기원전 285년 맏아들 프톨레마이오스 케라우노스를 제치고 아들 프톨레마이오스 2세를 공동 통치자로 세웠고 기원전 283/282년 겨울 죽었다. 프톨레마이오스 2세(재위 기원전 283~246)는 누이 아르시노에 2세와 기원전 275년 무렵 혼인해 프톨레마이오스 왕가의 친남매 혼인 전통을 굳혔다. 이 시기 알렉산드리아는 지중해에서 가장 큰 교역·학문 도시로 자랐다. 무세이온에서는 학자들이 왕실의 지원을 받으며 함께 살며 연구했다. 프톨레마이오스 2세는 전투용 코끼리를 구하려고 홍해 연안과 아프리카 쪽에 사냥 원정대를 보내고 항구를 개척했다."
  subjects: [ptolemaic-kingdom, seleucid-empire]
  tags: [politics, culture, society]
  sources: ["Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII.1: The Hellenistic World (2판, 1984)", "Plutarch(플루타르코스), Moralia(『윤리론집』) 「이시스와 오시리스에 대하여」 28 (Frank Cole Babbitt 영역, Loeb, 1936)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 18.28~36, 20.53, 20.113 (C. H. Oldfather 외 영역, Loeb, 1933~1967)"]

- id: magas-syrian-wars-276bc
  year: -275
  endYear: -252
  title:
    ko: "마가스의 키레네 독립(기원전 276 무렵)과 제1·2차 시리아 전쟁(기원전 274~253)"
  summary:
    ko: "마가스는 프톨레마이오스 1세의 의붓아들로, 기원전 300년 무렵부터 키레네를 다스렸다. 어머니가 같은 아우 프톨레마이오스 2세가 즉위한 뒤 그는 기원전 276년 무렵(283~274년 사이 여러 설이 있다) 왕을 칭하고 이집트에서 갈라섰다. 마가스는 셀레우코스의 안티오코스 1세의 딸 아파마와 혼인해 동맹을 맺고 이집트를 서쪽에서 치려 했다고 한다(파우사니아스 1.7.3). 기원전 274년 안티오코스 1세가 프톨레마이오스의 코엘레시리아로 쳐들어오면서 제1차 시리아 전쟁(기원전 274~271)이 일어났다. 마가스는 군을 이끌고 이집트 서쪽 국경까지 나아갔으나 리비아의 마르마리다이족이 반기를 들자 되돌아갔고, 프톨레마이오스 2세는 침공을 막은 뒤 소아시아 남쪽 해안의 도시 여럿을 얻은 것으로 본다. 제2차 시리아 전쟁(기원전 260~253)에서는 안티오코스 2세가 에페소스와 밀레토스 같은 소아시아 도시를 되찾았고, 기원전 253년 무렵 프톨레마이오스 2세의 딸 베레니케가 안티오코스 2세와 혼인하는 조건으로 화약이 맺어졌다고 해석된다(『다니엘서』 11장 6절에 대한 히에로니무스의 주석). 이 사이에도 키레나이카는 이집트에서 따로 왕이 다스리는 땅으로 남았고, 이 지역은 지중해 쪽의 무역과 실피움으로 이름이 높았다. 셀레우코스와 프톨레마이오스의 코엘레시리아 다툼은 기원전 2세기 중엽까지 흔히 여섯 차례로 꼽는 시리아 전쟁으로 되풀이되었다. 두 번의 전쟁은 코엘레시리아와 소아시아 해안을 두고 프톨레마이오스의 해군과 셀레우코스의 육군이 맞선 싸움이었고, 프톨레마이오스 왕조는 이 시기에 에게해의 키클라데스 제도에도 영향력을 두었다고 본다. 테오크리토스의 17번 송가는 프톨레마이오스 2세가 코엘레시리아·페니키아·아라비아·리비아·에티오피아를 다스린다고 찬양하나 선전이 섞인 과장이다."
  subjects: [cyrenaica-kingdom, ptolemaic-kingdom, seleucid-empire]
  tags: [war, politics]
  sources: ["Pausanias(파우사니아스), Hellados periegesis(『그리스 안내기』) 1.7.1~3 (W. H. S. Jones 영역, Loeb, 1918~1935)", "John D. Grainger, The Syrian Wars (Brill, 2010, Mnemosyne Supplements 320)", "Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII.1: The Hellenistic World (2판, 1984)"]

- id: berenice-third-syrian-war-250bc
  year: -249
  endYear: -240
  title:
    ko: "마가스의 죽음(기원전 250 무렵)과 베레니케 2세, 제3차 시리아 전쟁(기원전 246~241)"
  summary:
    ko: "마가스는 기원전 250년 무렵 죽었고, 딸 베레니케를 프톨레마이오스 2세의 아들에게 시집보낸다는 약속이 있었으나 마가스의 아내 아파마가 이를 깨고 마케도니아 왕가의 데메트리오스(미남왕)를 불러들였다. 데메트리오스는 아파마와 가까워졌다가 베레니케를 따르는 이들에게 살해되었다(유스티누스 26.3). 기원전 246년 프톨레마이오스 2세가 죽고 아들 프톨레마이오스 3세가 즉위하면서 베레니케 2세와 혼인해 키레나이카가 다시 이집트와 합쳐졌고 키레나이카 왕국은 끝났다. 같은 해 셀레우코스의 안티오코스 2세가 죽자 왕위를 두고 전처 라오디케와 베레니케 페르노포로스(프톨레마이오스 2세의 딸)가 맞섰고, 라오디케의 아들 셀레우코스 2세가 즉위하며 베레니케와 어린 아들은 살해되었다. 프톨레마이오스 3세는 누이의 복수를 내세워 제3차 시리아 전쟁(라오디케 전쟁, 기원전 246~241)을 일으켜 시리아 북부와 안티오키아, 셀레우키아 피에리아를 차지했고, 아둘리스 비문은 그가 바빌로니아와 그 너머까지 이르렀다고 자랑한다(비문의 과장으로 본다). 이집트에서 불안이 일자 군을 돌렸고 기원전 241년 화약으로 프톨레마이오스는 셀레우키아 피에리아 등 시리아 해안을 얻었다. 셀레우코스 2세는 아우 안티오코스 히에락스와의 ‘형제 전쟁’에도 시달렸다. 프톨레마이오스 왕국은 이 시기 최대 판도를 이룬다고 본다. 아둘리스 비문은 프톨레마이오스 3세가 페르시아가 옛날 이집트에서 가져간 신상을 되찾아 왔다고 자랑하며, 이는 이집트 사제단의 환심을 사려는 이야기이기도 했다. 이 전쟁 뒤 프톨레마이오스 왕조는 에게해 연안과 트라키아 해안에도 거점을 얻어 해상 세력이 정점에 올랐다."
  subjects: [cyrenaica-kingdom, ptolemaic-kingdom, seleucid-empire]
  tags: [war, politics]
  sources: ["Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 26.3, 27.1 (J. C. Yardley 영역, 1994)", "John D. Grainger, The Syrian Wars (Brill, 2010, Mnemosyne Supplements 320)", "Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)", "F. W. Walbank 외 엮음, The Cambridge Ancient History VII.1: The Hellenistic World (2판, 1984)"]

- id: arsaces-parni-247bc
  year: -246
  endYear: -226
  title:
    ko: "아르사케스 1세와 파르티아의 성립(기원전 247~228)"
  summary:
    ko: "파르티아를 세운 아르사케스 왕조는 카스피해 동쪽 초원의 파르니(아파르니)족에서 나왔다. 스트라본은 아르사케스가 박트리아에서 온 사람이라는 말과 함께, 그가 파르니족을 이끌고 아파르니아에서 파르티아로 내려왔다고 전한다(11.9.2~3). 이때 셀레우코스의 파르티아 총독 안드라고라스는 박트리아의 디오도토스처럼 중앙의 힘이 약해진 틈에 자립해 있었는데, 셀레우코스 2세가 이집트와의 제3차 시리아 전쟁에 매였기 때문이다(앞의 사건 「마가스의 죽음(기원전 250 무렵)과 베레니케 2세, 제3차 시리아 전쟁(기원전 246~241)」). 아르사케스는 이 안드라고라스를 죽이고(기원전 238년 무렵으로 본다) 파르티아와 히르카니아를 차지했다(유스티누스 41.4~5). 아르사케스가 왕이 된 기원전 247년이 ‘아르사케스 기년’의 원년이 되어 뒤에 파르티아 문서의 연대로 쓰였다. 아리아노스의 『파르티카』는 아르사케스와 형제 티리다테스가 셀레우코스 총독 페레클레스의 모욕에 분노해 그를 죽였다고 전하나, 전설의 성격이 짙다. 기원전 228년 무렵(230~227년설도 있다) 셀레우코스 2세가 동방으로 돌아와 파르티아를 치려 했으나 소아시아에서 아우 안티오코스 히에락스와 싸워야 해 돌아갔고, 유스티누스는 아르사케스가 이 승리를 기념하는 날을 지켰다고 적는다(41.4). 아르사케스는 아사크에서 왕위에 올랐고 왕궁은 니사에 두었다고 전해지며, 이 왕국은 기원전 3세기 말까지 아직 작은 지방 왕국이었다. 그러나 파르티아는 셀레우코스 제국에서 떨어져 나온 첫 이란계 나라가 되어 뒤에 메소포타미아까지 아우르는 대국으로 자라는 바탕을 마련했다. ‘아르사케스’는 뒤에 이 왕조 모든 왕이 즉위 이름으로 쓰게 되어 왕조 이름이 되었다."
  subjects: [parthian-empire, seleucid-empire]
  tags: [politics, war]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 11.9.2~3 (H. L. Jones 영역, Loeb, 1917~1932)", "Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 41.4~5 (J. C. Yardley 영역, 1994)", "M. Rahim Shayegan, Arsacids and Sasanians: Political Ideology in Post-Hellenistic and Late Antique Persia (Cambridge University Press, 2011)", "Ehsan Yarshater 엮음, The Cambridge History of Iran, vol. 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: mauretania-baga-225bc
  year: -224
  endYear: -204
  title:
    ko: "마우레타니아의 바가: 마우리인의 왕국(기원전 225 무렵)과 마시니사의 귀환(기원전 206)"
  summary:
    ko: "마우리인은 지금 모로코 북부와 알제리 서부에 살던 베르베르 계통 사람들로, 서쪽 대서양에 닿은 이들의 땅을 마우레타니아라 불렀다. 대서양 해안에는 페니키아 사람들이 세운 릭수스·팅기스 같은 거점이 있었고, 카르타고는 이 사람들의 기병을 용병으로 썼다. 이 나라의 왕으로 이름이 전하는 첫 인물은 바가로, 리비우스가 제2차 포에니 전쟁 때의 일화에서 마우리인의 왕으로 적는다(29.30). 바가의 재위를 기원전 225년 무렵으로 잡는 견해가 있으나 이 연대는 사료에서 곧바로 나오지 않는다. 일화의 때는 기원전 206년이어서 바가가 20년 가까이 다스렸거나 225년이 재위가 아닌 활동 연대일 것이다. 일화에 따르면 마시니사가 히스파니아에서 아프리카로 돌아오는 길에 마사이실리의 땅을 지나는 대신 서쪽 마우리인의 땅을 골랐고, 바가는 기병 4천 명을 붙여 그를 자기 나라 국경까지 호위하게 했다. 일부 학자는 바가가 대서양에서 물루야강까지 이르는 넓은 땅을 다스린 ‘작지 않은 왕’이었다고 본다. 물루야강은 뒤에 마우레타니아와 누미디아의 경계가 되었다. 마우리인의 정치와 사회는 사료가 거의 없어 알려진 것이 적다. 다만 바가의 호위 일화는 마우리인 기병의 힘과, 카르타고와 로마, 마사이실리·마실리가 맞서는 틈에서 서쪽 이웃이 어느 편이든 정세를 좌우할 수 있었음을 보여 준다. 이 왕국은 뒤에 보쿠스 1세 때 누미디아의 서쪽 땅을 얻어 커졌다. 스트라본은 마우리인의 땅이 대서양에서 물루야강까지이며 땅이 비옥하고 말이 많다고 적고, 이들이 말을 고삐 없이 목에 줄만 걸고 탄다고 전한다(17.3.7). 마우레타니아라는 이름은 그리스어 ‘마우로이’(마우리인)에서 나왔고 영어 ‘무어’와 스페인어 ‘모로’의 뿌리가 된다. 이 일화는 마시니사 편에서 전해진 이야기에서 나왔을 가능성이 있어 바가의 힘을 그대로 믿기는 어렵다는 지적이 있다."
  subjects: [mauretania, masaesyli, numidia, carthage]
  tags: [politics]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 29.30 (B. O. Foster 외 영역, Loeb, 1919~1959)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Strabo(스트라본), Geographica(『지리지』) 17.3.2~7 (H. L. Jones 영역, Loeb, 1917~1932)"]

- id: numidia-two-kingdoms-220bc
  year: -219
  endYear: -201
  title:
    ko: "마사이실리와 누미디아: 시팍스·가이아·마시니사와 제2차 포에니 전쟁(기원전 220~202)"
  summary:
    ko: "기원전 3세기 후반 지금의 알제리와 튀니지 서부에는 두 누미디아 왕국이 있었다. 서쪽 마사이실리의 왕 시팍스는 시가를 도읍으로 지금 모로코 동북부에서 알제리 중부까지 텔 지대를 다스렸고, 동쪽 마실리의 왕 가이아는 알제리 동부를 다스렸고, 키르타는 뒤에 마시니사의 도읍이 되었다. 카르타고는 이 두 나라의 기병을 용병으로 쓰며 한쪽을 다른 쪽에 맞세웠다. 제2차 포에니 전쟁 중 시팍스는 기원전 213년 무렵 로마와 손잡고 카르타고와 싸웠고 로마 장교들이 그의 보병을 훈련시켰다고 리비우스는 전한다(24.48~49). 카르타고는 가이아의 아들 마시니사가 이끄는 마실리 기병과 함께 시팍스를 쳤다. 마시니사는 기원전 211~206년 카르타고 편으로 히스파니아에서 싸웠으나 기원전 206년 일리파 전투 뒤 스키피오와 손잡았다(뒤의 사건 「스키피오 아프리카누스: 히스파니아 정복(기원전 210~206)과 자마 전투(202), 포에니 전쟁의 끝」). 가이아가 기원전 206년 무렵 죽자 시팍스가 마실리 땅 상당 부분을 차지했고, 마시니사는 히스파니아에서 돌아와 아버지의 땅을 되찾으려 싸웠다. 시팍스는 기원전 206년 스키피오를 시가에서 맞았으나 카르타고 장군 하스드루발 기스코의 딸 소포니스바와 혼인(기원전 205 무렵)한 뒤 카르타고 편으로 돌아섰다(29.23). 기원전 204년 스키피오가 아프리카에 상륙하자 마시니사가 합류했고, 기원전 203년 대평원의 싸움에서 시팍스의 진영이 불탔고, 시팍스는 이어 키르타 근처 싸움에서 사로잡혀 로마로 끌려갔다(30.11~15). 마시니사는 소포니스바와 혼인했으나 스키피오가 그녀를 로마에 넘기라 요구하자 그녀가 독을 마셨다고 전한다. 이로써 마사이실리 왕국은 끝났고 땅은 마시니사에게 넘어갔다. 기원전 202년 자마의 승리 뒤 마시니사는 하나의 누미디아 왕으로 인정받았다. 마실리와 마사이실리 사람들은 말을 잘 타는 기병으로 이름이 높았고, 로마 쪽 저술가들은 이들이 안장과 고삐 없이 말을 탄다고 적었다."
  subjects: [masaesyli, numidia, carthage, roman-republic]
  tags: [war, politics]
  sources: ["Livy(리비우스), Ab urbe condita(『로마사』) 24.48~49, 28.17~18, 29.23, 29.28~35, 30.11~17, 30.44 (B. O. Foster 외 영역, Loeb, 1919~1959)", "Dexter Hoyos, Hannibal’s Dynasty: Power and Politics in the Western Mediterranean, 247–183 BC (2003)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "Dexter Hoyos, The Carthaginians (2010)"]

- id: masinissa-kingdom-202bc
  year: -201
  endYear: -147
  title:
    ko: "마시니사의 누미디아(기원전 202~148): 정착 농경과 엠포리아(기원전 162 무렵), 카르타고와의 분쟁"
  summary:
    ko: "앞의 사건 「마사이실리와 누미디아: 시팍스·가이아·마시니사와 제2차 포에니 전쟁(기원전 220~202)」 뒤, 기원전 202년 자마의 승리로 마시니사는 로마의 인정을 받아 시팍스의 땅까지 합친 하나의 누미디아 왕이 되었다. 그는 기원전 148년까지 키르타를 도읍으로 다스리며(재위 기원전 202~148) 유목하던 누미디아 사람들이 농사를 짓고 정착하도록 이끌었다고 스트라본은 전한다(17.3.15). 폴리비오스는 그가 아흔 살이 되도록 말을 타고 싸울 만큼 정정했다고 전한다(36.16). 마시니사는 카르타고가 로마의 허락 없이 전쟁하지 못하게 한 조약(기원전 201)을 이용해 카르타고의 변경 땅을 하나씩 차지했다. 리비우스는 기원전 193년 마시니사가 시르테 만의 엠포리아를 건드려 카르타고가 로마에 호소했다고 적고(34.62), 이 땅은 기원전 160년대에 마시니사의 손에 들어간 것으로 본다(폴리비오스 31.21, 아피아노스 『리비케』 67~68). 카르타고가 로마에 거듭 호소했으나 로마 사절의 판정은 대체로 마시니사에게 유리했다. 기원전 151/150년 오로스코파에서 카르타고군이 마시니사에게 크게 졌고, 카르타고가 조약을 어기고 군을 일으켰다는 구실로 로마는 기원전 149년 선전포고했다(뒤의 사건 「제3차 포에니 전쟁(기원전 149~146)과 카르타고의 파괴, 마케도니아 속주(148)와 코린토스의 파괴(146)」). 마시니사는 기원전 148년 죽었고 스키피오 아이밀리아누스가 그의 세 아들 미킵사·구룻사·마스타나발에게 나라를 나눠 맡겼다(아피아노스 『리비케』 106). 누미디아는 카르타고의 땅과 포에니 문화를 이어받아 라틴·포에니 문화가 섞인 왕국이 되었다."
  subjects: [numidia, carthage, roman-republic]
  tags: [politics, war, society]
  sources: ["Appian(아피아노스), Rhomaika(『로마사』) 『리비케』 67~106 (Horace White 영역, Loeb, 1912~1913)", "Polybius(폴리비오스), Historiai(『역사』) 31.21, 36.16 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Strabo(스트라본), Geographica(『지리지』) 17.3.9~15 (H. L. Jones 영역, Loeb, 1917~1932)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]

- id: persis-fratarakas-200bc
  year: -199
  endYear: -131
  title:
    ko: "페르시스의 프라타라카 왕조와 파르티아의 종속(기원전 200 무렵~132)"
  summary:
    ko: "페르세폴리스와 이스타크르가 있는 파르스(페르시스)는 아케메네스 왕가의 고향이었다. 알렉산드로스가 기원전 330년 페르세폴리스의 궁전을 불태운 뒤(앞의 사건 「알렉산드로스: 가우가멜라(기원전 331), 페르세폴리스와 아케메네스 제국의 끝, 동방 원정과 죽음(기원전 323)」) 이 지방은 마케도니아인 총독을 거쳐 셀레우코스 제국에 속했다. 기원전 3세기 말에서 2세기 초에 이스타크르(페르세폴리스에서 북쪽으로 5킬로미터쯤)를 근거로 한 지방 통치자들이 ‘프라타라카’(지도자 또는 총독이라는 뜻의 칭호)를 칭하며 은화를 찍기 시작했다. 바가닷, 아르다시르 1세, 와흐바르즈, 와드프라다드 1세·2세 같은 이름이 주화로 알려져 있으나 순서와 재위는 분명하지 않고, 주화에는 아람 문자 명문과 아케메네스 왕의 모습, 조로아스터교의 불의 제단이 새겨져 있다. 이 통치자들이 셀레우코스의 신하였는지 사실상 독립했는지는 학설이 갈린다. 기원전 187년 안티오코스 3세가 이웃 엘리마이스의 신전을 털다 죽은 뒤 셀레우코스의 영향력은 약해졌다. 기원전 140년 무렵 파르티아의 미트리다테스 1세가 이 지방을 차지했으나 지방 왕조는 종속 왕으로 남았다. 와드프라다드 2세(기원전 138 무렵)는 파르티아의 종주권 아래에서 주화를 찍었고, 기원전 132년 이후에는 다라얀 1세로 시작하는 ‘왕’ 호칭의 군주들이 이어졌다. 이 왕가는 뒤에 사산 제국을 낳는 가문이 되어 페르시스를 이란 정체성의 중심으로 지켜 냈다. 페르세폴리스의 폐허는 이 시기에도 사람들 눈에 남아 옛 영광의 상징 노릇을 했고, 지방 왕들이 주화에 새긴 모습도 아케메네스풍 머리 장식을 한 인물이어서 이란 왕권의 옛 모습을 되살리려는 뜻이 읽힌다고 본다."
  subjects: [persis-kingdom, seleucid-empire, parthian-empire]
  tags: [politics, culture]
