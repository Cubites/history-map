- id: mithridates-i-171bc
  year: -170
  endYear: -131
  title:
    ko: "미트리다테스 1세와 파르티아 제국의 성립: 메디아(기원전 148 무렵)·바빌로니아(141)·엘리마이스 정복, 데메트리오스 2세의 포로(기원전 139~138)"
  summary:
    ko: "미트리다테스 1세(재위 기원전 171~132, 165년부터라는 설도 있다)는 파르티아를 지방 왕국에서 제국으로 키운 왕이다. 셀레우코스의 안티오코스 4세가 죽은 뒤(기원전 164) 왕위 다툼으로 제국이 흔들리자(뒤의 사건 「셀레우코스 제국의 해체: 콤마게네·오스로에네의 이탈(기원전 163·132)과 파르티아의 메소포타미아(129), 왕위 다툼과 티그라네스(83~69)」) 그는 서쪽으로 나아갔다. 기원전 165년 무렵 카스피해 남쪽 마르디(마잔다란)를 얻었고, 기원전 148/147년 무렵(141년이라는 설도 있다) 메디아의 중심 엑바타나를 차지했다. 기원전 141년 셀레우키아에 들어갔다고 바빌로니아의 천문 일지는 적는다. 바빌로니아의 도시들은 큰 저항 없이 받아들인 것으로 보이며, 미트리다테스는 그리스어로 ‘필헬렌’(그리스를 사랑하는 자)을 새긴 주화를 찍어 그리스계 주민을 달랬다. 기원전 140년 무렵 엘리마이스와 페르시스를 복속시켰다. 셀레우코스의 데메트리오스 2세는 동방에서 군을 모아 되찾으려 했으나 기원전 139/138년 패해 포로가 되었고, 미트리다테스는 그를 후하게 대접하고 딸 로도구네와 혼인시켰다고 한다(유스티누스 36.1, 38.9, 요세푸스 『유대 고대사』 13.184~186). 이 정복으로 파르티아는 이란 고원에서 유프라테스강까지 아우르게 되었고, 정복지의 도시와 신전, 지방 왕조에는 큰 자치를 주었다. 미트리다테스 1세는 기원전 132년 죽어 아들 프라아테스 2세가 이었다. 이 왕 때부터 파르티아는 셀레우코스가 아니라 이란 고원과 메소포타미아의 새 주인이 되었다. 정복지의 그리스계 도시들은 세금을 내는 대신 시의회와 법을 지켰고 셀레우키아는 사실상 자치 도시로 남았다고 본다. 이 왕이 새긴 ‘대왕’ 칭호는 아케메네스 왕의 칭호를 잇는 것이기도 했다."
  subjects: [parthian-empire, seleucid-empire, elymais, persis-kingdom]
  tags: [war, politics]
  sources: ["Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 36.1, 38.9, 41.6 (J. C. Yardley 영역, 1994)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.184~186 (Ralph Marcus 영역, Loeb, 1943)", "A. J. Sachs·H. Hunger, Astronomical Diaries and Related Texts from Babylonia, vol. 3: Diaries from 164 B.C. to 61 B.C. (Austrian Academy of Sciences Press, 1996)", "M. Rahim Shayegan, Arsacids and Sasanians: Political Ideology in Post-Hellenistic and Late Antique Persia (Cambridge University Press, 2011)", "Ehsan Yarshater 엮음, The Cambridge History of Iran, vol. 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: nabataean-petra-168bc
  year: -167
  endYear: -90
  title:
    ko: "나바테아인의 페트라와 향료 길: 아레타스 1세(기원전 168 무렵)에서 오보다스 1세(기원전 93 무렵)까지"
  summary:
    ko: "나바테아인은 시리아 사막과 네게브 사이의 광야에서 유목하던 아랍계 사람들로, 바위산 요새 페트라를 근거지로 삼아 향료 대상로를 쥔 나라를 이루었다. 기원전 312년 안티고노스 1세의 군이 페트라를 쳤을 때 이들은 아직 집 없이 사는 유목민이었고 물구덩이를 숨겨 두어 사막 길을 지켰다고 카르디아의 히에로니모스는 적었다(디오도로스 19.94~100). 이들은 몇 세기에 걸쳐 정착하고 상업 사회로 바뀌었다. 『마카베오기』 2서는 기원전 169/168년 무렵 대제사장 이아손이 도망쳐 간 ‘아랍인의 폭군 아레타스’를 적는데(5장 8절), 이 아레타스 1세가 이름이 전하는 첫 나바테아 왕이다. 남아라비아의 유향과 몰약은 히자즈를 거쳐 페트라와 가자로 올라와 지중해로 나갔고, 나바테아는 대상에게 통행세와 물, 쉼터를 팔아 부를 쌓았다. 이들은 아람어를 쓰고 아람 문자를 바꾸어 썼으며, 이 나바테아 문자는 뒤에 아랍 문자의 바탕이 되었다. 아레타스 2세(재위 기원전 120~96 무렵)는 기원전 100~96년 사이 하스몬 왕 알렉산드로스 얀나이오스에게 포위된 가자(함락은 기원전 96년)의 호소를 받았으나 제때 구원하지 못했다고 요세푸스는 전한다(13.360). 오보다스 1세(재위 기원전 96~85 무렵, 뒤이은 라벨 1세의 자리는 목록마다 다르다)는 기원전 93년 무렵 골란 지방의 좁은 길에서 매복해 얀나이오스의 군을 크게 꺾었다(13.375). 오보다스는 죽은 뒤 신으로 모셔졌다. 이렇게 나바테아는 셀레우코스와 하스몬 사이에서 힘을 쌓아 곧 다마스쿠스 쪽으로 뻗어 나갔다(뒤의 사건 「아레타스 3세(기원전 87~62)와 다마스쿠스의 점령(기원전 85~82 무렵), 스카우루스의 페트라 원정(기원전 62)」). 페트라는 사암 절벽 사이로 난 좁은 골짜기(시크)로 들어가야 하는 천연 요새였고, 물을 가두는 저수조와 수로로 사막 속의 도시를 지탱했다."
  subjects: [nabataean-kingdom, hasmonean-judea, seleucid-empire]
  tags: [politics, economy]
  sources: ["Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 19.94~100 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.358~375 (Ralph Marcus 영역, Loeb, 1943)", "Jane Taylor, Petra and the Lost Kingdom of the Nabataeans (I. B. Tauris, 2001)", "G. W. Bowersock, Roman Arabia (Harvard University Press, 1983)"]

- id: cyrenaica-bequest-163bc
  year: -162
  endYear: -72
  title:
    ko: "키레나이카의 분리(기원전 163)와 아피온의 유증(기원전 96), 로마의 속주 키레나이카(기원전 74)"
  summary:
    ko: "앞의 사건 「프톨레마이오스 왕국과 로마: 에레우시스의 날(기원전 168)에서 키프로스 합병(58)과 프톨레마이오스 12세의 복위(55)까지」에서 다룬 로마의 중재 뒤, 기원전 163년 원로원은 프톨레마이오스 6세에게 이집트와 키프로스를, 아우 프톨레마이오스 8세에게 키레나이카를 맡기는 것으로 형제의 다툼을 가라앉혔다(폴리비오스 31.10). 8세는 키프로스를 요구하며 로마에 되풀이해 호소했고 원로원은 키프로스도 8세 몫이라 판단했으나, 8세는 힘으로 차지하지 못했다(기원전 154년 키프로스를 쳤다가 6세에게 사로잡혀 단념했다). 기원전 155년 그는 키레네에서 암살 시도를 겪은 뒤 자신이 후사 없이 죽으면 키레나이카를 로마에 남긴다는 유언을 비문에 새겼다고 전하나 이 비문의 진위를 의심하는 학자도 있다. 기원전 145년 6세가 죽자 8세는 이집트로 가서 왕이 되었고 키레나이카는 다시 이집트 왕의 땅이 되었다. 기원전 116년 8세가 죽자 서자 프톨레마이오스 아피온이 키레네를 맡아 키레나이카는 두 번째로 따로 왕을 두었고(별개 왕국이 된 때를 기원전 105~101년 무렵으로 보는 설도 있다), 이집트는 아내 클레오파트라 3세와 아들들이 이었다. 아피온(재위 기원전 116~96)은 기원전 96년 후사 없이 죽으며 나라를 로마에 넘긴다는 유언을 남겼다. 원로원은 도시들을 자유 도시로 선언하면서 왕령지를 로마의 것으로 삼았으나 직접 통치하지는 않았고, 도시들의 다툼과 왕령지를 둘러싼 갈등이 이어졌다. 로마는 기원전 74년 무렵 키레나이카를 속주로 편성한 것으로 본다. 키레네에는 유대인 공동체가 컸다. 이 지역은 이후 크레타와 묶여 하나의 속주가 되었다. 키레나이카의 펜타폴리스는 곡식과 말, 실피움으로 이름이 높았고 키레네는 철학과 의술로도 이름났다. 이 땅은 이집트와 지중해를 잇는 북아프리카 해안의 길목이어서 로마가 이를 차지한 데에는 이집트와 지중해 동부를 가까이 두려는 뜻도 있었다고 풀이한다."
  subjects: [cyrenaica-kingdom, ptolemaic-kingdom, roman-republic]
  tags: [politics, diplomacy]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 31.10, 31.17~18 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Livy(리비우스), Periochae(『요약』) 70 (Alfred C. Schlesinger·Russel M. Geer 엮음, Loeb, 1959)", "Günther Hölbl, A History of the Ptolemaic Empire (Tina Saavedra 영역, Routledge, 2001)", "Shimon Applebaum, Jews and Greeks in Ancient Cyrene (Brill, 1979)"]

- id: elymais-147bc
  year: -146
  endYear: -81
  title:
    ko: "엘리마이스: 신전과 수사, 캄나스키레스 1세의 자립(기원전 147)에서 파르티아의 종속(기원전 82)까지"
  summary:
    ko: "엘리마이스는 옛 엘람의 땅인 후제스탄(수사)과 자그로스 산맥 남쪽 산지에 있던 나라로, 주민은 산악의 부족 연합 성격이 강했다. 이곳의 신전은 부유해 기원전 187년 셀레우코스의 안티오코스 3세가 벨 신전의 재물을 털려다 주민에게 죽임을 당했다고 전한다(디오도로스 28.3, 스트라본 16.1.18). 안티오코스 4세도 기원전 164년 엘리마이스의 아르테미스 신전을 노리다 실패하고 돌아오는 길에 죽었다고 폴리비오스는 적고(31.9), 『마카베오기』 1서도 같은 이야기를 전한다(6장). 셀레우코스의 힘이 약해지자 캄나스키레스 1세 소테르가 기원전 147년 무렵 독립해 왕을 칭하고 그리스 문자와 아람 문자로 이름을 새긴 주화를 찍었다. 그러나 파르티아의 미트리다테스 1세가 기원전 140/139년 이곳을 차지해(앞의 사건 「미트리다테스 1세와 파르티아 제국의 성립: 메디아(기원전 148 무렵)·바빌로니아(141)·엘리마이스 정복, 데메트리오스 2세의 포로(기원전 139~138)」와 같은 때), 이후 반세기쯤 파르티아가 직접 다스렸다고 보나 정복 시기와 직접 지배의 길이는 학설이 갈린다. 기원전 82년 무렵 캄나스키레스 3세와 아내 안자제의 이름이 새겨진 주화가 나타나 엘리마이스가 다시 왕을 두고 파르티아의 종속 왕국이 되었다는 것을 알려 준다. 수사의 도시 문화는 그리스·이란·엘람의 전통이 섞여 있었고, 비문과 주화에 두 가지 문자가 함께 쓰였다. 스트라본은 엘리마이스 사람들을 활을 잘 쏘는 산악 사람들로 적는다(16.1.17). 엘리마이스의 신전들은 수사와 함께 재물이 모이는 곳이어서 왕권이 약해지는 때마다 약탈의 표적이 되었다. 엘리마이스라는 이름은 옛 엘람 문명의 이름이 그리스어로 바뀐 것이고, 이 땅은 엘람 이래 수사를 중심으로 한 고장이었다."
  subjects: [elymais, seleucid-empire, parthian-empire]
  tags: [politics, war]
  sources: ["Polybius(폴리비오스), Historiai(『역사』) 31.9 (W. R. Paton 영역, F. W. Walbank·Christian Habicht 개정, Loeb, 2010~2012)", "Strabo(스트라본), Geographica(『지리지』) 16.1.17~18 (H. L. Jones 영역, Loeb, 1917~1932)", "Diodorus Siculus(디오도로스), Bibliotheke historike(『역사 총서』) 28.3 (C. H. Oldfather 외 영역, Loeb, 1933~1967)", "Ehsan Yarshater 엮음, The Cambridge History of Iran, vol. 3(1): The Seleucid, Parthian and Sasanian Periods (1983)"]

- id: simon-hasmonean-142bc
  year: -141
  endYear: -102
  title:
    ko: "시몬과 요한 히르카노스 1세: 유대의 독립(기원전 142~140)과 하스몬 왕국의 팽창(기원전 135~103)"
  summary:
    ko: "앞의 사건 「마카베오 반란(기원전 167~141): 안티오코스 4세의 박해와 하스몬 가문의 독립」에서 유다 마카베오가 죽은 뒤 아우 요나단이 셀레우코스의 왕위 다툼을 이용해 대제사장이 되었으나, 기원전 143/142년 장군 트리폰에게 속아 죽었다. 형제 시몬(재위 기원전 142~135)이 뒤를 이어 데메트리오스 2세에게서 공물 면제를 얻었고, 성경은 이를 ‘이방인의 멍에를 벗었다’고 적는다(『마카베오기』 1서 13장 41절). 기원전 141년 시몬은 예루살렘에서 셀레우코스 수비대가 있던 성채 아크라를 차지했고, 기원전 140년 9월(141년이라는 설도 있다) 민회는 ‘충직한 예언자가 나타날 때까지’ 시몬을 대제사장·민족의 지도자·군 지휘자로 삼는다고 결의해 지위의 세습을 인정했다(1서 14장). 이것이 하스몬 왕국의 출발이다. 시몬은 로마와 우호를 새로 맺었다(1서 15장). 안티오코스 7세가 요빠·게제르 등의 반환을 요구하며 보낸 군은 시몬의 아들 유다와 요한이 물리쳤다(기원전 138~137). 기원전 135년 시몬은 사위 프톨레마이오스에게 여리고 근처에서 암살되었다. 아들 요한 히르카노스 1세(재위 기원전 135~104)는 안티오코스 7세의 예루살렘 포위(기원전 134~132)를 조공을 받아들이는 조건으로 넘겼고, 안티오코스가 죽은 뒤(기원전 129) 땅을 넓혔다. 기원전 112년 무렵 이두메아를 정복해 주민에게 유대교를 받아들이게 했고, 기원전 108년 무렵 사마리아를 무너뜨렸다. 아들 아리스토불로스 1세(재위 기원전 104~103)는 처음 왕관을 쓰고 이투라이아 사람들의 땅 일부를 합쳐 할례를 강요했다(요세푸스 13.318~319)."
  subjects: [hasmonean-judea, seleucid-empire, roman-republic]
  tags: [politics, war, religion]
  sources: ["Jonathan A. Goldstein, I Maccabees (Anchor Bible, 1976)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.213~318 (Ralph Marcus 영역, Loeb, 1943)", "Emil Schürer, The History of the Jewish People in the Age of Jesus Christ (175 B.C.–A.D. 135), 개정판 Geza Vermes·Fergus Millar·Matthew Black 엮음 (T&T Clark, 1973~1987)"]

- id: characene-sacae-130bc
  year: -129
  endYear: -123
  title:
    ko: "안티오코스 7세의 원정과 죽음(기원전 130~129), 사카의 침입과 카라케네의 자립(기원전 127~124)"
  summary:
    ko: "기원전 130년 셀레우코스의 안티오코스 7세가 대군을 이끌고 파르티아로 나섰다. 그는 티그리스강 가에서 세 번 이기고 바빌로니아와 메디아를 되찾았으며, 하스몬 왕국의 요한 히르카노스 1세도 그를 따라 종군했다(요세푸스 『유대 고대사』 13.250~253). 그러나 기원전 130/129년 겨울 군대를 도시마다 나누어 머물게 하자 주민의 반란이 일어났고, 파르티아의 프라아테스 2세가 기원전 129년 안티오코스를 메디아에서 쳐서 죽였다(유스티누스 38.10). 이 일로 하스몬 왕국은 셀레우코스의 감독에서 벗어났다. 프라아테스는 앞서 붙잡은 데메트리오스 2세를 풀어 시리아로 보내 셀레우코스를 흔들었다(앞의 사건 「셀레우코스 제국의 해체: 콤마게네·오스로에네의 이탈(기원전 163·132)과 파르티아의 메소포타미아(129), 왕위 다툼과 티그라네스(83~69)」). 프라아테스 2세는 기원전 128/127년 중앙아시아에서 밀려온 사카 용병과 싸우다 죽었고, 아르타바누스 1세(재위 기원전 127~124)도 토카리아 유목민과 싸우다 죽었다(유스티누스 42.1~2). 이 사이 티그리스·유프라테스 하구에서는 셀레우코스의 총독 히스파오시네스가 기원전 141년 무렵 셀레우코스에서 떨어져 나와 기원전 127년 무렵 왕을 칭했고, 홍수로 무너진 도시를 높은 둑 위에 다시 세워 ‘스파시누의 카락스’라 부르고 도읍으로 삼았다(플리니우스 6.138). 바빌로니아 천문 일지에 따르면 그는 기원전 127년 바빌론까지 차지했으나 곧 파르티아가 되찾았다. 기원전 124년 히스파오시네스가 85세쯤으로 죽고 아들 아포다코스가 파르티아의 종주권 아래 뒤를 이었으며, 미트리다테스 2세가 즉위해 질서를 되찾자 카라케네는 페르시아만과 인도를 잇는 교역으로 번영했다."
  subjects: [parthian-empire, seleucid-empire, characene, hasmonean-judea]
  tags: [war, politics]
  sources: ["Justin(유스티누스), Epitoma historiarum Philippicarum Pompei Trogi(『폼페이우스 트로구스 필리포스사 요약』) 38.9~10, 42.1~2 (J. C. Yardley 영역, 1994)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.236~253 (Ralph Marcus 영역, Loeb, 1943)", "A. J. Sachs·H. Hunger, Astronomical Diaries and Related Texts from Babylonia, vol. 3: Diaries from 164 B.C. to 61 B.C. (Austrian Academy of Sciences Press, 1996)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 6.138~139 (H. Rackham 외 영역, Loeb, 1938~1963)"]

- id: mithridates-ii-124bc
  year: -123
  endYear: -90
  title:
    ko: "미트리다테스 2세와 파르티아의 전성기(기원전 124~91): ‘왕 중의 왕’, 한과 로마와의 첫 접촉"
  summary:
    ko: "미트리다테스 2세(재위 기원전 124~91)는 사카와 토카리아 유목민의 침입으로 흔들린 파르티아를 다시 세워 ‘대왕’이라 불렸고, 기원전 109/108년 무렵부터 주화에 ‘왕 중의 왕’이라는 칭호를 늘 새긴 왕으로 알려져 있다(드물게는 미트리다테스 1세도 썼다). 그는 동쪽 국경의 사카 유목민을 누르고 수렌 가문 장군을 보내 사카스탄(뒤의 시스탄)을 되찾아 그에게 맡긴 것으로 본다. 서쪽으로는 바빌로니아와 카라케네에 대한 종주권을 굳혔고, 에데사(오스로에네)와 두라에우로포스 같은 도시를 아울러 유프라테스강까지 영향력을 넓혔다. 기원전 2세기 말(115년 무렵이라는 설이 흔하다) 한 무제가 장건 이후 안식(파르티아)에 사신을 보냈고, 『사기』 「대완열전」은 안식 왕이 국경에 기병 2만을 보내 영접하고 타조 알과 곡예사를 한에 보냈다고 적는다. 이것이 비단길로 이어지는 파르티아와 한의 첫 공식 접촉이다(뒤의 사건 「크라수스의 파르티아 원정과 카레 전투(기원전 53), 같은 때의 한과 흉노」). 기원전 95년 무렵 아르메니아에서는 파르티아에 인질로 있던 티그라네스가 ‘70개 골짜기’를 내주는 대가로 풀려나 왕위에 올랐다고 스트라본은 전한다(11.14.15). 기원전 96/95년에는 킬리키아 총독이던 로마의 술라가 유프라테스 강가에서 파르티아 사절 오로바조스를 만났고, 이것이 로마와 파르티아의 첫 접촉으로 꼽힌다(플루타르코스 『술라』 5). 오로바조스는 왕의 허락 없이 로마와 우호를 맺었다는 이유로 귀국 뒤 처형되었다고 한다. 미트리다테스 2세가 죽은 해는 기원전 91년으로 잡는 것이 일반적이나 기원전 88/87년이라는 설도 있다. 그의 주화에는 활을 든 파르티아 왕의 모습과 그리스어 명문이 쓰였고, 그리스계 도시와 이란 귀족과 종속 왕들을 함께 거느리는 연합 성격의 제국이었다고 본다."
  subjects: [parthian-empire, characene, osroene, arsacid-armenia, roman-republic, western-han]
  tags: [politics, diplomacy]
  sources: ["Sima Qian(사마천), Shiji(『사기』) 123 대완열전 (Burton Watson 번역, Records of the Grand Historian: Han Dynasty II, 개정판 1993)", "Strabo(스트라본), Geographica(『지리지』) 11.14.15 (H. L. Jones 영역, Loeb, 1917~1932)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『술라』 5 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "M. Rahim Shayegan, Arsacids and Sasanians: Political Ideology in Post-Hellenistic and Late Antique Persia (Cambridge University Press, 2011)"]

- id: jugurtha-bocchus-118bc
  year: -117
  endYear: -103
  title:
    ko: "유구르타와 보쿠스 1세: 누미디아의 왕위 다툼(기원전 118~)과 마우레타니아의 확장(기원전 105)"
  summary:
    ko: "마시니사의 아들 미킵사가 기원전 118년 죽자 친아들 히엠프살과 아데르발, 양자이자 조카뻘인 유구르타가 나라를 함께 물려받았다. 살루스티우스에 따르면 유구르타는 곧 히엠프살을 살해하게 했고(기원전 117/116), 아데르발은 로마로 달아나 호소했다. 로마 원로원이 보낸 위원회는 나라를 둘로 나눠 마우레타니아에 가까운 서쪽을 유구르타에게, 키르타가 있는 동쪽을 아데르발에게 주었다(『유구르타 전쟁』 16). 기원전 112년 유구르타가 키르타를 포위해 아데르발과 이탈리아 상인들을 죽이자 로마가 개입했다(뒤의 사건 「유구르타 전쟁(기원전 112~105)과 킴브리·테우토네스 전쟁(113~101), 마리우스의 부상」). 마우레타니아의 왕 보쿠스 1세는 유구르타의 장인으로 기원전 108년 무렵 사위 편에 서서 싸웠으나, 로마의 재무관 술라의 설득에 넘어가 기원전 105년 유구르타를 로마에 넘겼다(『유구르타 전쟁』 102~113). 유구르타는 기원전 104년 1월 1일 마리우스의 개선식에 끌려가 감옥에서 죽었다. 로마는 그 대가로 보쿠스에게 누미디아 서부의 땅 일부를 넘겼고(학설에 따라 물루야강에서 암프사가강까지), 마우레타니아는 이 땅을 더해 커졌다. 나머지 누미디아는 마스타나발의 아들 가우다에게 돌아갔다. 이 일로 누미디아 왕국은 로마의 감독 아래 놓였고, 마우레타니아는 로마에 협력해 땅을 얻는 길을 열었다. 보쿠스는 로마 원로원에서 ‘로마 인민의 친구’라는 지위를 얻었다고 한다(살루스티우스 104~105). 술라는 이 일을 새긴 반지를 썼다고 하며 이 일이 뒷날 마리우스와 술라가 갈라서는 불씨가 되었다고 전한다(플루타르코스 『마리우스』 10)."
  subjects: [numidia, mauretania, roman-republic]
  tags: [politics, war, diplomacy]
  sources: ["Sallust(살루스티우스), Bellum Iugurthinum(『유구르타 전쟁』) 5~114 (J. C. Rolfe 영역, Loeb, 1921)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)", "J. A. Crook·Andrew Lintott·Elizabeth Rawson 엮음, The Cambridge Ancient History IX: The Last Age of the Roman Republic, 146–43 B.C. (2판, 1994)"]

- id: himyar-110bc
  year: -109
  endYear: -99
  title:
    ko: "힘야르의 독립(기원전 110 무렵)과 카타반의 축소"
  summary:
    ko: "힘야르는 와디 바이한의 카타반에서 기원전 110년 무렵 떨어져 나왔다고 보는 남아라비아 고원의 나라다. 이 해(브리태니커는 기원전 115년 무렵으로 적는다)를 나라의 시작으로 잡는다. 건국 때의 사건을 직접 전하는 비문은 없고 건국 시기는 뒷날의 기록에서 거꾸로 셈한 것이어서 학설에 따라 몇십 년 어긋난다. 도읍은 자파르(지금 예멘 야림 가까운 고원 도시)였고 힘야르 왕들은 훗날 ‘두 라이단’이라는 칭호를 썼다. 힘야르가 일어난 바탕에는 카타반이 기원전 3세기에 남서 고지와 아덴 쪽으로 넓힌 땅을 한 나라가 지키기 어려워진 사정이 있었다고 본다. 힘야르가 떨어져 나가자 카타반은 팀나가 있는 와디 바이한 둘레로 줄어들었다. 힘야르가 차지한 남서 고지는 비가 많이 와 농사가 잘되고 홍해 입구의 항구에 가까워 인도양과 홍해를 잇는 장사의 길목이었다. 이 시기 힘야르는 아직 작은 고원 왕국이어서 마리브를 쥔 사바나 샤브와를 쥔 하드라마우트보다 약했다. 사바는 마리브의 댐과 오아시스 농사를 이으며 이웃 나라와 맞섰고, 하드라마우트는 유향 산지의 길목을 쥐고 있었다. 남아라비아의 정치 지형은 이렇게 사바·하드라마우트·카타반의 세 나라에 힘야르가 더해져 넷으로 바뀌었다. 힘야르가 남아라비아 전체를 아우르는 것은 먼 훗날의 일이다. 아덴 항구는 인도양과 홍해를 오가는 배의 기항지로 이름났다. 힘야르의 초기 비문은 사바 문자와 사바어로 쓰였고 뒤에야 힘야르어의 특색이 나타나, 이 나라는 사바 문화의 틀 안에서 자란 것으로 본다. 고원 도시 자파르는 해발 2천 미터가 훌쩍 넘는 서늘하고 비가 많은 곳이어서 보리와 수수 같은 곡식이 잘 자랐다."
  subjects: [himyarite-kingdom, qataban, saba-kingdom, hadramawt-kingdom]
  tags: [politics]
  sources: ["Jean-François Breton, Arabia Felix from the Time of the Queen of Sheba: Eighth Century B.C. to First Century A.D. (Albert LaFarge 영역, University of Notre Dame Press, 1999)", "Pliny the Elder(대플리니우스), Naturalis Historia(『박물지』) 6.153~162 (H. Rackham 외 영역, Loeb, 1938~1963)"]

- id: alexander-jannaeus-103bc
  year: -102
  endYear: -66
  title:
    ko: "알렉산드로스 얀나이오스와 살로메 알렉산드라(기원전 103~67): 하스몬 왕국의 전성기와 바리새파"
  summary:
    ko: "아리스토불로스 1세가 기원전 103년 죽자 아내 살로메 알렉산드라가 감옥에서 풀어 준 아우 알렉산드로스 얀나이오스(재위 기원전 103~76)가 왕위에 올랐다. 얀나이오스는 왕위를 굳히려 형제 하나를 죽였다고 요세푸스는 전한다. 그는 기원전 103~102년 키프로스에서 쳐들어온 프톨레마이오스 왕국의 프톨레마이오스 9세 라티로스와 싸워 요르단강 가 아소폰에서 크게 졌고(프톨레마이스는 얻지 못했다), 기원전 96년 가자를 함락한 뒤 해안 평원과 요르단강 동쪽을 차지해 하스몬 왕국의 영토를 가장 넓게 했다. 기원전 93년 무렵 골란에서 나바테아 오보다스 1세의 매복에 걸려 크게 졌다(앞의 사건 「나바테아인의 페트라와 향료 길: 아레타스 1세(기원전 168 무렵)에서 오보다스 1세(기원전 93 무렵)까지」). 율법 해석과 대제사장 직을 두고 바리새파가 왕에게 맞서면서 6년 남짓 내전이 이어졌고, 셀레우코스의 데메트리오스 3세가 반대파를 도왔다. 얀나이오스는 승리한 뒤 바리새인 800명을 십자가에 못 박았다고 요세푸스는 전한다(13.380). 그는 기원전 76년 죽으며 아내에게 바리새파와 화해하라고 일렀다고 한다. 살로메 알렉산드라(재위 기원전 76~67)는 바리새파를 정치에 받아들여 안정을 이루었고, 맏아들 히르카노스 2세를 대제사장으로, 둘째 아리스토불로스 2세를 군 지휘로 두었다. 그의 죽음(기원전 67) 뒤 두 아들이 왕위를 다투면서 하스몬 왕국은 로마를 끌어들이게 된다(뒤의 사건 「하스몬 왕국의 몰락과 헤롯의 즉위(기원전 67~37)」). 얀나이오스는 주화에 그리스어로 ‘왕 알렉산드로스’를, 히브리 문자로 ‘대제사장 요나탄’을 새겼고, 왕이 대제사장을 겸하는 것을 못마땅해한 바리새파의 반발이 이 때문에 커졌다고 본다."
  subjects: [hasmonean-judea, nabataean-kingdom, ptolemaic-kingdom, seleucid-empire]
  tags: [politics, war, religion]
  sources: ["Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.320~432 (Ralph Marcus 영역, Loeb, 1943)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 1.85~119 (H. St. J. Thackeray 영역, Loeb, 1927)", "Emil Schürer, The History of the Jewish People in the Age of Jesus Christ (175 B.C.–A.D. 135), 개정판 Geza Vermes·Fergus Millar·Matthew Black 엮음 (T&T Clark, 1973~1987)"]

- id: parthia-dynastic-struggle-91bc
  year: -90
  endYear: -69
  title:
    ko: "미트리다테스 2세 뒤 파르티아의 왕위 다툼(기원전 91~70)과 티그라네스의 팽창"
  summary:
    ko: "미트리다테스 2세가 죽은(기원전 91년) 뒤 파르티아는 한 세대 가까이 왕위 다툼에 빠졌다. 바빌로니아 점토판과 주화는 미트리다테스 2세의 아들로 보이는 고타르제스 1세(재위 기원전 91~87 무렵, 80년까지 보는 설도 있고 연대와 계보가 논란이다)와 오로데스 1세(기원전 90~80 무렵, 80~75년으로 보는 설도 있다)를 보여 주고 이름이 전하지 않는 왕들도 있어, 연구자마다 왕 목록과 재위가 크게 다르다. 그리스어 저술가 루키아노스의 『장수한 사람들』은 ‘시나트루케스’가 여든 살 무렵 사카 유목민의 도움으로 즉위해 7년 다스렸다고 전한다(기원전 77~70 무렵으로 보며 왕 목록마다 한두 해씩 다르다). 이 혼란 속에 아르메니아의 티그라네스 2세는 파르티아에 내주었던 ‘70개 골짜기’를 되찾고 아디아베네와 고르디에네, 니시비스 같은 북부 메소포타미아까지 얻었다(앞의 사건 「티그라네스 2세의 아르메니아(기원전 95~66): 소페네 병합과 시리아 점령, 티그라노케르타(69)」). 엘리마이스는 기원전 82년 무렵 다시 왕을 두고 파르티아의 종속 왕국이 되었다. 파르티아가 안으로 무너져 있던 때에 셀레우코스의 영토를 사실상 차지한 쪽은 파르티아가 아니라 아르메니아였다. 기원전 70년 무렵 프라아테스 3세가 즉위하면서 상황이 정리되었고(재위 기원전 70~57), 그는 바빌로니아의 천문 일지에도 이름이 나온다. 프라아테스 3세는 곧 로마와 아르메니아 사이에서 균형을 잡아야 하는 처지에 놓였다. 이 시기 바빌로니아 일지는 ‘왕 중의 왕’이라는 칭호를 쓰는 여러 군주가 서로 다른 지방을 쥐고 있었음을 보여 주어, 파르티아가 하나의 왕조 아래 일관되게 다스려졌다기보다 지방 군주들의 연합에 가까웠다는 해석이 있다. 이 시기에도 파르티아는 동쪽에서 사카의 압박을, 서쪽에서 아르메니아의 팽창을 받고 있었다."
  subjects: [parthian-empire, arsacid-armenia, elymais]
  tags: [politics]
  sources: ["Lucian(루키아노스), Macrobii(『장수한 사람들』) 15 (A. M. Harmon 영역, Loeb, 1913~1967)", "A. J. Sachs·H. Hunger, Astronomical Diaries and Related Texts from Babylonia, vol. 3: Diaries from 164 B.C. to 61 B.C. (Austrian Academy of Sciences Press, 1996)", "Strabo(스트라본), Geographica(『지리지』) 11.14.15 (H. L. Jones 영역, Loeb, 1917~1932)", "M. Rahim Shayegan, Arsacids and Sasanians: Political Ideology in Post-Hellenistic and Late Antique Persia (Cambridge University Press, 2011)"]

- id: aretas-iii-87bc
  year: -86
  endYear: -61
  title:
    ko: "아레타스 3세(기원전 87~62)와 다마스쿠스의 점령(기원전 85~82 무렵), 스카우루스의 페트라 원정(기원전 62)"
  summary:
    ko: "아레타스 3세(재위 기원전 87~62 무렵으로 보나 84년부터로 잡는 목록도 있으며, 오보다스 1세와 사이에 라벨 1세를 두는 목록도 있다)는 나바테아 왕국이 가장 넓어진 때의 왕이다. 앞의 사건 「나바테아인의 페트라와 향료 길: 아레타스 1세(기원전 168 무렵)에서 오보다스 1세(기원전 93 무렵)까지」에서 이어, 셀레우코스의 안티오코스 12세는 다마스쿠스에서 나바테아를 치다가 가나에서 죽었다(요세푸스 13.387~391). 죽은 해는 기원전 82년으로 보는 설이 우세하고 84년으로 적는 개설서도 있으며, 맞선 나바테아 왕을 아레타스가 아니라 오보다스 1세나 라벨 1세로 보는 학설도 있다. 다마스쿠스 사람들은 칼키스의 이투라이아 왕 프톨레마이오스 메나이오스가 두려워 아레타스를 불러 코일레시리아의 통치자로 세웠다(13.392). 아레타스는 이어 유대로 나아가 하스몬 왕 알렉산드로스 얀나이오스를 아디다에서 꺾고 조약을 맺었다. 기원전 72~69년 아르메니아의 티그라네스 2세가 다마스쿠스를 차지해 나바테아는 이 도시를 잃었다. 기원전 65년 하스몬 가문의 내전에서 이두메아 출신 안티파트로스가 히르카노스 2세를 아레타스에게 데려갔고, 아레타스는 대군으로 예루살렘의 아리스토불로스 2세를 포위했다. 그러나 폼페이우스의 부장 스카우루스가 아리스토불로스의 뇌물을 받고 철수를 명하자 아레타스는 물러났다(14.19~33). 기원전 62년 스카우루스는 페트라를 침공했고 아레타스는 300탈란톤을 내고 로마의 종주권을 받아들였다(요세푸스, 『유대 전쟁사』 1.159). 이로써 나바테아는 로마 아래 종속 왕국이 되어 이후 170년 가까이 이어졌다(뒤의 사건 「폼페이우스의 동방 정리(기원전 66~63): 폰토스의 끝, 셀레우코스의 끝(64), 유대(63)」). 아레타스는 다마스쿠스에서 ‘필헬렌’이라는 칭호를 새긴 은화를 찍어 그리스계 주민을 달랬다."
  subjects: [nabataean-kingdom, seleucid-empire, hasmonean-judea, ituraea, arsacid-armenia, roman-republic]
  tags: [politics, war, diplomacy]
  sources: ["Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.384~392, 14.14~33, 14.80~81 (Ralph Marcus 영역, Loeb, 1943)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 1.123~159 (H. St. J. Thackeray 영역, Loeb, 1927)", "G. W. Bowersock, Roman Arabia (Harvard University Press, 1983)"]

- id: ituraea-85bc
  year: -84
  endYear: -35
  title:
    ko: "이투라이아 왕국: 칼키스의 프톨레마이오스 메나이오스(기원전 85 무렵)에서 리사니아스의 죽음(기원전 36 무렵)까지"
  summary:
    ko: "이투라이아 사람들은 레바논 산맥과 안티레바논 산맥, 베카 골짜기에 살던 아랍계(아람계라는 설도 있다) 산악 사람들로, 칼키스를 중심으로 한 왕국을 세웠다. 이투라이아의 왕으로 사료에 처음 나오는 사람은 메나이오스의 아들 프톨레마이오스이며 기원전 85년 무렵부터 이곳을 다스렸다(스트라본 16.2.10~18). 하스몬 왕국의 아리스토불로스 1세는 기원전 104/103년 이투라이아의 땅 일부를 합치고 주민에게 할례를 강요했다(앞의 사건 「시몬과 요한 히르카노스 1세: 유대의 독립(기원전 142~140)과 하스몬 왕국의 팽창(기원전 135~103)」). 셀레우코스의 마지막 왕들이 다투는 사이 프톨레마이오스는 다마스쿠스를 노렸고, 이를 두려워한 다마스쿠스 사람들은 나바테아의 아레타스를 불러들였다(요세푸스 13.392). 기원전 64~63년 로마의 폼페이우스는 시리아에서 이투라이아의 산악 요새들을 무너뜨렸고 프톨레마이오스는 은 1천 탈란톤을 내고 벌을 면했다고 전한다(요세푸스 14.39, 스트라본 16.2.18). 프톨레마이오스는 기원전 40년 무렵 죽고 아들 리사니아스가 왕위를 이었다. 리사니아스는 안티고노스를 도운 파르티아의 시리아 침공에 편을 들었다(요세푸스 14.330~331). 안토니우스는 프톨레마이오스 왕국의 클레오파트라 7세의 요청에 따라 리사니아스를 처형하고 그의 땅을 몰수했다(요세푸스 15.92, 기원전 36년 무렵으로 보며 연도는 확정되지 않았다). 이 사람들은 궁수로 이름이 높았고 산악 요새를 근거로 한 약탈로 이웃의 미움을 샀다고 스트라본은 적는다. 칼키스는 레바논 베카 골짜기 안자르 둘레로 보는 설이 있으나 위치는 확정되지 않았다."
  subjects: [ituraea, nabataean-kingdom, hasmonean-judea, parthian-empire, roman-republic, seleucid-empire, ptolemaic-kingdom]
  tags: [politics]
  sources: ["Strabo(스트라본), Geographica(『지리지』) 16.2.10~20 (H. L. Jones 영역, Loeb, 1917~1932)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 13.384~392, 14.39, 14.330~331 (Ralph Marcus 영역, Loeb, 1943)", "Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 15.92 (Ralph Marcus·Allen Wikgren 영역, Loeb, 1963)"]

- id: adiabene-69bc
  year: -68
  endYear: -65
  title:
    ko: "아디아베네의 등장: 티그라노케르타 전투(기원전 69)와 로마·파르티아·아르메니아 사이(기원전 69~66)"
  summary:
    ko: "아디아베네는 티그리스강 동쪽, 대자브강과 소자브강 사이의 비옥한 평야에 있던 나라로 아르벨라(지금의 에르빌)를 도읍으로 했고 가우가멜라 평원이 이 땅에 있었다. 아시리아의 옛 땅이어서 스트라본은 이곳을 ‘아시리아’라 부른다(16.1.1~2). 주화로 보아 기원전 2세기 중엽부터 지방 왕조가 있었던 것으로 짐작되나, 사료에 아디아베네의 왕이 처음 나오는 것은 기원전 69년 티그라노케르타 전투에서 티그라네스의 편에 선 왕으로, 이름은 전하지 않는다. 이 전투는 기원전 69년 10월 6일 루쿨루스의 로마군이 티그라네스 2세의 대군을 꺾은 싸움이다(플루타르코스 『루쿨루스』 27). 이어 루쿨루스는 기원전 68년 아르메니아의 도읍 아르탁사타로 나아가려 했으나 병사들의 불만으로 물러났다. 기원전 66년 폼페이우스가 티그라네스를 항복시킬 때(뒤의 사건 「폼페이우스의 동방 정리(기원전 66~63): 폰토스의 끝, 셀레우코스의 끝(64), 유대(63)」) 파르티아의 프라아테스 3세는 로마와 아르메니아 사이에서 저울질하다 폼페이우스와 손잡고 아르메니아 북쪽을 공격했다(카시우스 디오 36.45). 아디아베네는 이 무렵부터 파르티아의 종속 왕국이었던 것으로 본다. 이 나라는 뒤에 왕실이 유대교로 개종한 것으로 알려진다. 암미아누스 마르켈리누스는 아디아베네가 두 강(디아바와 아디아바, 곧 대자브강과 소자브강)에서 이름을 얻었다고 적는다(23.6.20). 이 평원은 티그리스강 동쪽에서 메소포타미아와 이란 고원을 잇는 길목이어서 아르메니아·파르티아·로마가 되풀이해 노렸다. 플루타르코스는 티그라노케르타에서 티그라네스군을 22만 명 남짓으로, 로마군 전사자를 5명으로 적으나 과장이어서 믿기 어렵다."
  subjects: [adiabene, parthian-empire, arsacid-armenia, roman-republic]
  tags: [war, politics]
  sources: ["Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『루쿨루스』 24~36 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Strabo(스트라본), Geographica(『지리지』) 16.1.1~4 (H. L. Jones 영역, Loeb, 1917~1932)", "Cassius Dio(카시우스 디오), Historia Romana(『로마사』) 36.45 (Earnest Cary 영역, Loeb, 1914~1927)"]

- id: herod-accession-63bc
  year: -66
  endYear: -36
  title:
    ko: "하스몬 왕국의 몰락과 헤롯의 즉위(기원전 67~37)"
  summary:
    ko: "살로메 알렉산드라가 죽은 기원전 67년 뒤 맏아들 히르카노스 2세와 아우 아리스토불로스 2세가 왕위를 다퉜고, 이두메아 출신 안티파트로스가 히르카노스를 부추겨 나바테아 왕 아레타스 3세의 도움을 얻었다(앞의 사건 「아레타스 3세(기원전 87~62)와 다마스쿠스의 점령(기원전 85~82 무렵), 스카우루스의 페트라 원정(기원전 62)」). 기원전 63년 폼페이우스가 예루살렘을 차지해 아리스토불로스를 로마로 끌어가고 히르카노스를 대제사장·민족의 지도자로 세우되 왕 칭호는 주지 않았다(뒤의 사건 「폼페이우스의 동방 정리(기원전 66~63): 폰토스의 끝, 셀레우코스의 끝(64), 유대(63)」). 하스몬 왕국은 로마의 종속국이 되어 땅 상당 부분을 잃었다. 기원전 54년 크라수스는 성전의 재물을 약탈했다(요세푸스 14.105~109). 안티파트로스는 카이사르를 도와 기원전 48/47년 알렉산드리아 전투에서 공을 세워 총독 지위를 얻었고, 아들 헤롯은 기원전 47년 갈릴래아 총독이 되었다. 기원전 43년 안티파트로스가 독살된 뒤, 기원전 41년 안토니우스가 헤롯과 형 파사엘을 분봉왕(테트라르케스)으로 세웠다. 기원전 40년 파르티아의 왕자 파코로스와 총독 바르자파르네스가 시리아로 쳐들어오자 아리스토불로스 2세의 아들 안티고노스 2세 마타티아스가 이들의 도움으로 예루살렘을 차지해 왕이자 대제사장이 되었고, 히르카노스의 귀를 잘라 대제사장 자격을 없앴다. 파사엘이 죽고 헤롯은 도망쳐 나바테아에서 거절당한 뒤 로마로 가 기원전 40년(요세푸스 기준) 원로원에서 ‘유대의 왕’으로 선포되었다. 헤롯은 기원전 39년 돌아와 3년 가까운 싸움 끝에 로마 장군 소시우스와 함께 기원전 37년 예루살렘을 함락했고, 안티고노스는 안토니우스의 명으로 처형되어 하스몬 왕국이 끝났다(카시우스 디오 49.22)."
  subjects: [hasmonean-judea, herodian-judea, roman-republic, parthian-empire, nabataean-kingdom]
  links:
    - { from: herodian-judea, to: hasmonean-judea, note: "헤롯의 예루살렘 점령과 안티고노스 2세의 처형(기원전 37)" }
  tags: [politics, war]
  sources: ["Josephus(요세푸스), Antiquitates Judaicae(『유대 고대사』) 14.1~491 (Ralph Marcus 영역, Loeb, 1943)", "Josephus(요세푸스), Bellum Judaicum(『유대 전쟁사』) 1.120~357 (H. St. J. Thackeray 영역, Loeb, 1927)", "Peter Richardson, Herod: King of the Jews and Friend of the Romans (University of South Carolina Press, 1996)"]

- id: juba-thapsus-49bc
  year: -48
  endYear: -45
  title:
    ko: "유바 1세와 탑수스 전투(기원전 46): 누미디아의 끝과 아프리카 노바"
  summary:
    ko: "기원전 50년 로마의 호민관 쿠리오가 누미디아를 로마에 병합하자고 제안하자 누미디아 왕 유바 1세(재위 기원전 60~46)는 카이사르에게 적의를 품었고, 카이사르가 그의 수염을 잡아당긴 일이 있다는 이야기도 전한다(수에토니우스 『카이사르』 71). 기원전 49년 내전이 일어나자(같은 때의 사건 「카이사르의 내전(기원전 49~45)과 암살(44)」) 유바는 폼페이우스 편에 섰다. 카이사르의 부장 쿠리오는 아프리카에서 유바의 군에 몰려 바그라다스강 근처에서 군이 전멸하고 쿠리오도 죽었다(카이사르 『내전기』 2.38~42). 폼페이우스파의 스키피오와 카토는 우티카에 모였고, 기원전 46년 2월(개정 전 로마 달력으로는 4월 6일) 카이사르는 탑수스에서 이들을 크게 꺾었다(『아프리카 전기』). 이 싸움에서 스키피오 쪽 코끼리 부대가 놀라 제 편 진영으로 몰려 무너졌다고 전한다. 카토는 우티카에서 자결했고, 유바는 도망쳐 자마에서 시민에게 외면당한 뒤 페트레이우스와 서로 찔러 죽었다고 전한다. 카이사르는 누미디아의 동쪽을 ‘아프리카 노바’ 속주로 삼고 역사가 살루스티우스를 총독으로 보냈다. 누미디아의 서쪽과 키르타 둘레는 카이사르를 도운 무장 푸블리우스 시티우스에게 돌아갔고, 마우레타니아의 보쿠스 2세도 카이사르를 도와 누미디아 서쪽 땅을 얻었다. 유바의 어린 아들(뒤의 유바 2세)은 로마로 끌려가 카이사르의 개선식에서 행진한 뒤 로마에서 자랐다(플루타르코스 『카이사르』 55). 이로써 마시니사가 하나로 묶은 누미디아 왕국은 150여 년 만에 끝났다. 카이사르는 기원전 46년 아프리카 승리의 개선식에서 유바의 모습을 본뜬 상을 행렬에 내보냈다고 한다(아피아노스 『내전기』 2.101)."
  subjects: [numidia, mauretania, roman-republic]
  tags: [war, politics]
  sources: ["Julius Caesar(카이사르), Commentarii de bello civili(『내전기』) 2.23~44 (A. G. Peskett 영역, Loeb, 1914)", "Pseudo-Caesar, Bellum Africum(『아프리카 전기』) (A. G. Way 영역, Loeb, 1955)", "Plutarch(플루타르코스), Bioi paralleloi(『영웅전』) 『카이사르』 52~55 (Bernadotte Perrin 영역, Loeb, 1914~1926)", "Michael Brett·Elizabeth Fentress, The Berbers (Blackwell, 1996)"]
