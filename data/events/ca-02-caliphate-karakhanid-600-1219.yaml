- id: mukanna-776
  year: 776
  endYear: 783
  title:
    ko: "무칸나의 봉기와 하얀 옷의 사람들(776~783 무렵)"
  summary:
    ko: "호라산 출신(메르브 부근 마을로 전한다)의 하심은 얼굴을 가린 채 다녔다고 해서 '무칸나(가려진 자)'로 불렸고, 770년대 후반 아바스 칼리프 알마흐디(재위 775~785) 때 아무다리야 너머 카슈 일대에서 따르는 이들을 모아 일어섰다. 봉기의 시작은 776~777년으로 적는 글이 많고 끝은 783년에서 786년까지 갈린다. 무슬림 사료는 그가 예언자라고 주장했거나 신이 사람 몸으로 나타난 존재라고 했다고 적는데, 이 사료는 아바스 쪽의 적대적 서술이라 그대로 믿기 어렵다. 따르는 이들은 아바스 가문의 검은 옷에 맞서 흰 옷을 입어 '하얀 옷의 사람들'로 불렸고, 아바스 정권에 맞선 호라산의 호라미파 계통 신앙과 이어진 것으로 본다. 농촌 주민과 소그드 계통 지주 가운데 이에 호응한 이들이 있었다고 한다. 이 봉기를 전하는 가장 이른 책은 10세기 나르샤히의 『부하라의 역사』로, 부하라 쪽 시각에서 쓴 글이다. 아바스 쪽 사료는 무칸나의 교리를 '평등한 공동 소유' 따위로 그리나 호라미파를 깎아내린 서술일 수 있다. 호라미파는 이후 아제르바이잔의 바박(816~837 봉기)에게도 이어졌고 아프신 하이다르가 그를 진압하는 데 가담했다. 봉기군은 이슬람 도시들을 약탈했고, 칼리프는 여러 장군을 보내 진압에 나섰다. 포위된 무칸나는 카슈 부근 요새(사남)에서 집이 불타자 독이나 불로 죽었다고 전하며, 죽음은 783년 무렵으로 본다. 아부 무슬림이 살해된 755년 뒤 호라산에서 일어난 반발과 이어 보는 설명도 있다. 봉기는 진압되었으나 같은 계통의 호라미파 운동은 12세기까지 이어졌다. 이 일은 아바스 칼리프국의 호라산 지배가 아직 단단하지 않았음과, 이슬람 정복 뒤에도 옛 신앙이 오래 이어졌음을 보여 준다."
  subjects: [abbasid-caliphate]
  tags: [politics, religion, war]
  sources: ["R. N. Frye, ed., The Cambridge History of Iran, vol. 4 (Cambridge University Press, 1975)", "Abu Bakr Muhammad ibn Ja'far Narshakhi, The History of Bukhara, trans. Richard N. Frye (Medieval Academy of America, 1954)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: tibet-tarim-790
  year: 790
  endYear: 851
  title:
    ko: "토번의 타림 분지 진출과 위구르·카를루크(790~851)"
  summary:
    ko: "토번은 670년 대비천 전투에서 당군을 꺾고 안서 4진을 차지했으나 692년 당이 타림 분지를 되찾았고, 당의 4진은 이후 약 100년간 이어졌다. 755년 안사의 난 뒤 당이 서쪽을 비우자 토번은 허시 회랑을 차지하고 763년에는 장안을 보름 동안 점령하기도 하며 이 지역을 다시 압박했다. 토번은 타림 분지 남쪽 호탄과 마자르타그 같은 곳에 성채를 두었고, 이곳에서 티베트어 문서가 나왔다. 790년 토번이 북정(베슈발리크)을 함락해 당의 북정도호부가 끝났고, 북정을 지키던 당의 장수는 죽은 것으로 전한다. 790~791년 베슈발리크 부근에서 위구르와 토번이 싸웠는데 카를루크 야브구국도 토번 편으로 가담했다는 서술이 있다. 792년 토번이 서주(고창)를 정복했으나 곧 그 땅은 위구르의 손에 넘어가 북정과 고창 쪽이 위구르 몫이 되었다. 토번은 790년대 초 호탄을 차지했다. 이 기간 호탄은 토번의 종주권 아래 불교 왕국으로 이어졌다. 842년 토번 왕 랑다르마가 암살되어 토번 제국은 무너졌고(「위구르의 붕괴와 토번의 해체」(뒤의 사건)), 843년 위구르 피난민이 토번에게서 카라샤르와 쿠차를 빼앗았으며, 848년 허시 회랑의 장의조가 돈황을 되찾았다(「허시 회랑의 귀의군과 감주 위구르(848~926)」(뒤의 사건)). 851년 호탄이 다시 독립을 되찾아 중국식 칭호를 쓰는 왕이 이었다. 토번 쪽 사정은 티베트어 연대기와 돈황 사본에 남아 있다. 토번 제국의 끝은 842년 또는 848년으로 적는다. 북정과 안서를 잃은 당은 서쪽으로 가는 길을 한동안 쓰지 못했다. 이 100여 년 동안 타림 분지는 당·토번·위구르·카를루크가 번갈아 다투는 곳이었고, 비단길의 상인과 승려는 그 틈에서 교역을 이어 갔다."
  subjects: [tibet, tang, uyghur, karluk-yabgu-state, khotan-kingdom]
  tags: [war, politics]
  sources: ["Christopher I. Beckwith, The Tibetan Empire in Central Asia: A History of the Struggle for Great Power among Tibetans, Turks, Arabs, and Chinese during the Early Middle Ages (Princeton University Press, 1987)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)"]

- id: samanid-transoxiana-819
  year: 818
  endYear: 900
  title:
    ko: "사만 가문의 트란스옥시아나와 이스마일의 부하라(819~900)"
  summary:
    ko: "사만 가문은 발흐 부근의 호족 사만 쿠다가 일으킨 가문으로, 아들 아사드의 네 아들이 칼리프 알마문을 도운 상으로 819년 호라산 총독에게서 사마르칸트(누흐)·페르가나(아흐마드)·샤시(야흐야)·헤라트(일리야스)를 나누어 받았다. 이 해 페르가나 왕국의 이흐시드 왕가의 다스림이 끝났다. 사마르칸트의 누흐(819~841)와 이후 아흐마드(855~864) 사이는 목록에 빈 곳이 있다. 이 사이 호라산은 타히르 왕조(821~873)가 맡았고 아바스 칼리프는 이들에게 트란스옥시아나를 맡겼다. 나스르 1세(864~892)가 사마르칸트에 자리를 굳히고 861년 무렵 이후 일어난 사파르 왕조의 야쿠브가 힘을 키운 일은 「야쿠브 이븐 알라이스와 사파르 왕조(861~902)」(뒤의 사건)에 있다. 892년 나스르가 죽고 아우 이스마일 1세(892~907)가 즉위해 부하라를 도읍으로 삼아 힘을 모았다. 우스루샤나의 아프신 왕가는 아프신 하이다르(822년 아바스에 협력, 841년 체포)의 때 이후 쇠하다 마지막 군주 사이르 이븐 압둘라 때 끝났다(주화는 892년, 왕조의 끝은 893년으로 적기도 한다). 893년 이스마일은 카를루크 땅으로 들어가 탈라스를 차지하고 그곳 경교 교회를 모스크로 바꾸었다. 이 카를루크 세력이 훗날 카라한 왕조의 모체가 되었다고 본다(앞은 「키르기스의 위구르 정복과 카라한 왕조의 등장(840~893 무렵)」). 900년 이스마일은 발흐 부근에서 사파르 왕조의 아므르 이븐 알라이스를 꺾어 호라산까지 아울렀다(「사만 왕조의 호라산과 이란(900~943)」(뒤의 사건)). 이로써 사만 가문은 총독에서 사실상의 독립 군주가 되었다."
  subjects: [samanid-empire, abbasid-caliphate, ferghana-kingdom, ustrushana-afshins, tahirid-dynasty, saffarid-dynasty, karakhanid-dynasty]
  tags: [politics, war]
  sources: ["Richard N. Frye, The Golden Age of Persia (Weidenfeld & Nicolson, 1975)", "C. Edmund Bosworth, ed., The Cambridge History of Iran, vol. 4 (Cambridge University Press, 1975)", "W. Barthold, Turkestan Down to the Mongol Invasion (Luzac, 1928)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: karakhanid-rise-840
  year: 840
  endYear: 893
  title:
    ko: "키르기스의 위구르 정복과 카라한 왕조의 등장(840~893 무렵)"
  summary:
    ko: "840년 예니세이 키르기스가 위구르 카간국을 무너뜨렸다(「위구르의 붕괴와 토번의 해체」(앞의 사건)). 위구르 카간국과 손잡았던 카를루크 야브구국은 위구르의 몰락으로 후견을 잃었고, 위구르 난민은 남쪽 타림 분지 동쪽으로 옮겨 갔다(「고창 위구르 왕국의 성립과 마니교·불교(866~984 무렵)」). 일부 무슬림 역사가는 이때 최고 권위가 카를루크의 우두머리들에게 넘어가 그들이 카간 칭호를 썼다고 적으며, 이를 카라한 왕조의 시작으로 본다. 카라한 칸의 첫 인물로는 빌게 쿨 카디르 칸(목록에는 840~893년으로 적으나 한 사람의 재위로는 길어 후대 정리로 본다)을 들지만 그가 카를루크의 야브구 후손인지 야그마 부족 출신인지는 사료가 갈린다. '카라한'은 후대 학자가 붙인 이름이고 군주는 '카라 칸'·'일릭' 같은 칭호로 불렸다. 카라한은 치길·야그마·카를루크 같은 부족 연합으로, 동쪽의 '아르슬란 카라 카칸'과 서쪽의 '부그라 카라 카칸'이 갈라 다스리는 이중 체제가 특징이다. 사료가 적어 어느 칸이 언제 누구였는지 뚜렷하지 않다. 키르기스는 위구르의 옛 땅을 오래 차지하지 못하고 예니세이 쪽으로 물러났고, 서쪽 초원은 이 부족들 몫이 되었다. 중심지는 세미레치예의 발라사군과 카슈가르, 수야브·탈라스 일대였고 초원 전체를 다스렸다고 보기는 어렵다. 이 무렵 사만 쪽은 서남쪽에서 힘을 키웠고 893년에는 탈라스를 차지했다(「사만 가문의 트란스옥시아나와 이스마일의 부하라(819~900)」). 940년 무렵 야그마가 발라사군을 차지했다고 전한다. 카라한의 이후 일은 「사툭 부그라 칸과 카라한의 이슬람 수용(934~980 무렵)」(뒤의 사건)과 「카라한 왕조의 부하라 점령과 호탄 정복(999~1008)」(뒤의 사건)에 있다."
  subjects: [karluk-yabgu-state, karakhanid-dynasty, samanid-empire]
  tags: [politics, society]
  sources: ["Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Edinburgh University Press, 1996)"]

- id: qocho-uyghur-866
  year: 866
  endYear: 984
  title:
    ko: "고창 위구르 왕국의 성립과 마니교·불교(866~984 무렵)"
  summary:
    ko: "위구르 카간국이 무너진 뒤 일부 위구르 사람들은 방특근(팡텔레)을 따라 남쪽으로 내려와 843년 토번에게서 카라샤르와 쿠차를 빼앗았다. 856년 당은 이들에게 왕의 인정을 주었고, 그때 수도는 카라샤르였다. 866년 복고준(푸구 준)이 스스로 칸을 일컫고 '이디쿠트'라는 칭호를 쓰며 귀의군에게서 서주(고창)·정주(베슈발리크)·장바리크·룬타이를 빼앗아 고창을 도읍으로 삼았다(「허시 회랑의 귀의군과 감주 위구르(848~926)」(앞의 사건)). 고창은 겨울 수도, 베슈발리크는 여름 거처로 쓰였다. 869~870년 귀의군을 쳤으나 물러났고, 876년 이주(하미)를 차지했으며, 880년 사주(돈황)를 쳤다가 물러났다. 904년 귀의군의 장승봉이 이주와 서주를 차지해 911년 뒤까지 점령했다가 물러났다. 군주는 940~948년 이르디민 칸, 948~985년 아르슬란 칸으로 이어졌고, 954년 일릭 빌게 텡그리 같은 이름이 목록에 나오나 빈 대목이 많다. 지배 가문은 마니교를 주로 믿었다. 934~951년 마니교 승려가 사절단과 함께 다녔고, 960년대부터 불교가 후원을 받아 965~1022년 불교 승려가 사절단에 들었다. 불교 석굴 사원 베제클리크 같은 곳에 이 왕국의 벽화가 남았고, 20세기 초 투루판에서 나온 마니교 경전 조각들도 이 시대 것이 많다. 위구르는 소그드 문자를 받아들였고 소그드 사람과 다른 주민이 이 왕국에 녹아들었다. 981년 송에 조공을 시작했고 '서주 사자왕 아르슬란 칸'을 칭했으며, 송의 사절 왕연덕이 981년 길을 떠나 982년 고창에 닿았고 984년 돌아와 도시의 모습을 보고했다. 왕국은 이후 카라한 왕조와 부딪쳐 아크수·툼슈크·쿠차를 잃었다."
  subjects: [qocho-uyghur-kingdom, tang, guiyi]
  tags: [politics, religion, culture]
  sources: ["Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "『송사』 권490 「외국전」 가운데 고창"]

- id: samanid-culture-900
  year: 900
  endYear: 999
  title:
    ko: "사만 시대 부하라의 페르시아어 문예와 학문(900~999)"
  summary:
    ko: "사만 왕조의 부하라는 10세기 동방 이슬람 세계의 문화 중심지가 되었다. 군주는 이스마일(892~907)·아흐마드 사마니(907~914)·나스르 2세(914~943)·누흐 1세(943~954)·압둘 말리크 1세(954~961)·만수르 1세(961~976)·누흐 2세(976~997)·만수르 2세(997~999)로 이어졌다. 궁정은 신페르시아어를 궁정 언어와 문학 언어로 밀어 주었고, 아랍어는 종교와 학문의 언어로 남았다. 궁정 시인 루다키는 고전 페르시아 시의 창시자로 꼽히며, 재상 발아미의 『타리크나마(역사서)』는 가장 이른 페르시아어 산문 역사서 가운데 하나로 알려져 있다. 부하라에는 '지혜의 곳간(시완 알히크마)'이라 불린 도서관이 있었고, 부하라 가까이에서 980년 무렵 태어난 학자 이븐 시나(아비센나)도 젊은 날 이곳의 책을 읽었다고 전한다. 나르샤히의 『부하라의 역사』는 10세기 중반에 쓰여 이 도시의 옛일을 전한다. 사마르칸트는 8세기 이후 종이 생산지로 이름났다. 사만 영묘는 10세기 전반에 지어진 것으로 보며(892~943년 사이로 적는다) 이스마일이 묻힌 곳으로 벽돌을 엮어 쌓은 건물이 남아 있다. 군대에는 튀르크 노예 병사(굴람)가 많았다. 알프티긴처럼 튀르크 노예에서 총사령관에 오른 사람도 나왔다(「알프티긴의 가즈니와 사만 왕조의 쇠퇴(962~977)」(뒤의 사건)). 정치 쪽 일은 「사만 왕조의 호라산과 이란(900~943)」(같은 해의 사건), 「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(뒤의 사건)에서 다룬다. 사만 왕조의 번영은 비단길 교역과 초원의 튀르크 유목민과의 거래에 힘입었다."
  subjects: [samanid-empire]
  tags: [culture, society]
  sources: ["Richard N. Frye, The Golden Age of Persia (Weidenfeld & Nicolson, 1975)", "R. N. Frye, ed., The Cambridge History of Iran, vol. 4 (Cambridge University Press, 1975)", "M. S. Asimov and C. E. Bosworth, eds., History of Civilizations of Central Asia, vol. 4, Part One (UNESCO Publishing, 1998)"]

- id: satuq-bughra-934
  year: 934
  endYear: 980
  title:
    ko: "사툭 부그라 칸과 카라한의 이슬람 수용(934~980 무렵)"
  summary:
    ko: "카라한 왕가에서 처음 이슬람을 받아들인 칸은 사툭 부그라 칸이다. 그가 개종한 해는 932~942년 사이로 사료마다 달라 934년 무렵으로 본다. 그는 카슈가르를 차지했고, 960년 무렵 튀르크 부족의 집단 개종이 있었다고 전한다. 개종은 사만 왕조의 영향과 무슬림 상인·수피의 포교가 얽혀 일어난 것으로, 카라한 안에서도 동·서 두 칸 가문이 모두 이슬람을 받아들였다. 이후 카라한은 이슬람을 내세워 불교 도시 호탄과 오랫동안 싸웠고(10세기 중반부터), 970년 호탄이 카슈가르를 잠시 차지했다. 같은 무렵 동쪽의 고창 위구르는 마니교와 불교를 믿고 있어(「고창 위구르 왕국의 성립과 마니교·불교(866~984 무렵)」(앞의 사건)), 카라한의 개종으로 세미레치예와 타림 분지 일대는 종교로도 서쪽과 동쪽이 갈렸다. 개종 이야기는 후대 전승에 꾸밈이 많아 사료를 가려 읽어야 한다. 카라한 칸들은 일릭·테긴 같은 초원의 칭호와 이슬람식 칭호를 함께 썼다. 사툭 부그라 칸 뒤로는 후손들이 카슈가르·발라사군·우즈겐에 따로 거점을 두고 자리를 나누었으며, 칸 가문의 동·서 갈래는 서로 다투었다. 고창 위구르 쪽 기록에는 카라한의 한 칸이 밍락 지방의 불교 사원을 부쉈다는 말이 나오나 그가 사툭 부그라인지는 따져 봐야 한다. 이러한 땅 나눔(분봉) 체제 때문에 계승 다툼이 되풀이되었다. 960~980년대 카라한이 세미레치예에서 시르다리야와 페르가나 쪽으로 힘을 넓혀 갔다고 하나 세부는 사료가 적다. 개종 뒤 카라한의 영토는 이슬람 세계와 불교·마니교·경교의 접경이 되었다. 이 개종은 이후 튀르크 사람들이 이슬람 세계의 군인과 군주가 되는 길을 열었다(「카라한 왕조의 부하라 점령과 호탄 정복(999~1008)」(뒤의 사건))."
  subjects: [karakhanid-dynasty, samanid-empire, khotan-kingdom]
  tags: [religion, politics]
  sources: ["Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "C. Edmund Bosworth, The New Islamic Dynasties (Edinburgh University Press, 1996)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "W. Barthold, Turkestan Down to the Mongol Invasion (Luzac, 1928)"]

- id: alptigin-ghazna-962
  year: 962
  endYear: 977
  title:
    ko: "알프티긴의 가즈니와 사만 왕조의 쇠퇴(962~977)"
  summary:
    ko: "알프티긴은 910년 무렵 태어난 튀르크 노예 출신으로 부하라 궁정에서 자랐다. 누흐 1세(재위 943~954) 아래 근위대장이 되었고, 압둘 말리크 1세(954~961) 때 발흐 총독을 거쳐 961년에는 호라산의 사만 군 총사령관(시파살라르)이 되어 2월 10일 니샤푸르에 도착했다. 961년 11월 압둘 말리크가 죽자 알프티긴은 발아미와 함께 어린 나스르를 세우려 했으나 파이크 같은 이들이 만수르 1세를 밀었고, 만수르는 알프티긴을 호라산에서 내쳤다. 962년 4월 알프티긴은 발흐에서 만수르의 군대를 꺾고, 바미얀과 카불의 지배자들을 이기며 가즈니로 가서 아부 바크르 라위크에게서 가즈니를 빼앗았다. 사만 왕조의 임명장을 받아 가즈니의 총독이 되었다. 963년 9월 가즈니에서 죽자 아들 아부 이샤크 이브라힘이 뒤를 이었다. 그 사이 아부 이샤크 이브라힘(963~)·빌게테긴·피리 같은 튀르크 장군들이 차례로 가즈니를 쥐었다는 기록이 있다. 알프티긴의 진출 뒤 965년 무렵 힌두 샤히는 카불 골짜기를 잃고 인더스강 서쪽의 땅으로 물러난 것으로 본다. 가즈니는 힌두쿠시 남쪽에서 인도로 가는 길목의 교역 도시였다. 알프티긴이 사들인 노예 사북티긴은 977년 가즈니의 튀르크 병사들에게 우두머리로 추대되어 가즈니 왕조를 열었다(「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(뒤의 사건)). 힌두 샤히와의 그 뒤 싸움은 「자야팔라의 힌두 샤히와 가즈니의 사북티긴·마흐무드, 페샤와르 전투(986~1002)」(뒤의 사건)에 있다. 사만 왕조는 튀르크 장군들의 힘에 기대다 궁정 안 다툼 속에서 호라산의 통제를 잃어 갔다."
  subjects: [samanid-empire, hindu-shahi, ghaznavid-empire]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994:1040 (Edinburgh University Press, 1963)", "C. Edmund Bosworth, The New Islamic Dynasties (Edinburgh University Press, 1996)", "Richard N. Frye, The Golden Age of Persia (Weidenfeld & Nicolson, 1975)"]

- id: khwarazm-mamunid-995
  year: 995
  endYear: 1017
  title:
    ko: "호라즘 마문 왕조의 성립과 구르간지 궁정(995~1017)"
  summary:
    ko: "호라즘은 카트를 도읍으로 한 아프리그 왕조가 오래 다스렸다. 비루니는 이 왕조의 시작을 305년으로 적었으나 전설에 가깝다. 마지막 샤 아부 압둘라 무함마드(재위 967~995)는 995년 북쪽 구르간지의 아미르 마문 이븐 무함마드에게 쫓겨나 죽었고, 마문이 호라즘 샤 칭호를 쓰며 호라즘의 마문 왕조를 열었다. 마문 1세(995~997)에 이어 아부 알하산 알리(997~1008 또는 1009)와 마문 2세(1008~1009년에서 1017년)가 군주였고, 두 해는 문헌마다 다르다. 구르간지 궁정은 학문의 중심이 되어 이븐 시나(아비센나)·아부 사흘 알마시히·알타알리비 같은 학자가 머물렀고 비루니도 이곳의 궁정과 이어진 학자로 알려졌다. 마문 2세가 세운 것으로 전하는 첨탑이 오늘날까지 남아 있다. 1014년 가즈니의 마흐무드가 금요 설교에 자기 이름을 부르라고 요구하자 마문 2세가 따랐는데, 호라즘 귀족들이 이에 반발했다. 1017년 3월 총사령관 알프티긴이 반란을 일으켜 마문 2세를 죽이고 마문 가문의 아부 알하리스 무함마드를 세웠다. 마흐무드는 매부의 죽음을 구실로 쳐들어와 하자라스프에서 호라즘군을 꺾고 구르간지를 점령했으며, 호라즘을 병합했다. 이로써 마문 왕조는 끝났다(앞은 「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(앞의 사건)). 호라즘은 이후 마흐무드가 세운 총독이 다스렸고, 호라즘샤 칭호는 훗날 다른 가문에서 되살아난다(「호라즘샤 왕조의 성장: 아누슈티긴에서 테키시까지(1077~1200)」(뒤의 사건)). 이븐 시나는 1010년대 초 마흐무드의 요구를 피해 구르간지를 떠났다고 전한다."
  subjects: [afrighid-dynasty, mamunid-dynasty, ghaznavid-empire]
  links:
    - { from: ghaznavid-empire, to: mamunid-dynasty, note: "호라즘을 병합함 (1017)" }
  tags: [politics, war, culture]
  sources: ["C. Edmund Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994:1040 (Edinburgh University Press, 1963)", "C. Edmund Bosworth, The New Islamic Dynasties (Edinburgh University Press, 1996)", "W. Barthold, Turkestan Down to the Mongol Invasion (Luzac, 1928)"]

- id: karakhanid-bukhara-999
  year: 999
  endYear: 1008
  title:
    ko: "카라한 왕조의 부하라 점령과 호탄 정복(999~1008)"
  summary:
    ko: "사만 왕조는 누흐 2세(976~997) 뒤 만수르 2세(997~999)·압둘 말리크 2세(999~1000)·이스마일 2세 문타시르(1000~1005)로 이어지다 힘을 잃었다. 카라한의 하산 이븐 술레이만(하룬 부그라 칸)은 990~992년 무렵 사마르칸트와 부하라를 차지했으나 992년에 죽었고, 한때 사만이 부하라를 되찾았다. 사촌 알리 이븐 무사가 일을 이었고, 999년 알리의 아들 나스르(일릭 칸으로도 불림)가 샤시·사마르칸트·부하라를 차지하자 카라한은 트란스옥시아나를 얻었다(「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(앞의 사건)). 이때 호라산은 가즈니 왕조가 얻어 아무다리야가 두 나라의 경계가 되었다. 사만 가문의 마지막 이스마일 2세는 1005년까지 저항했다. 동쪽에서는 카라한이 오래 싸워 온 호탄을 향해 나아갔다. 호탄은 돈황과 가까이 지내며 중국식 칭호를 쓴 왕들이 다스렸고, 뽕나무 밭과 비단·카펫, 중국에 보내는 옥으로 이름난 오아시스 왕국으로, 호탄어와 간다라 프라크리트어를 쓰는 주민이 대승불교를 믿었다. 사툭 부그라 칸 뒤로 이어진 싸움에서 호탄이 970년 카슈가르를 잠시 차지하기도 했으나(「사툭 부그라 칸과 카라한의 이슬람 수용(934~980 무렵)」(앞의 사건)), 1006년 유수프 카디르 칸이 호탄을 정복해 독립이 끝났다. 호탄의 이슬람화는 한 번에 이루어지지 않았고 불교 문화는 11세기까지 이어졌다. 이로써 카라한은 서쪽 트란스옥시아나에서 동쪽 호탄까지 걸치는 나라가 되어, 비단길의 두 큰 오아시스 지대를 한 왕가의 갈래들이 나누어 다스리게 되었다."
  subjects: [karakhanid-dynasty, samanid-empire, khotan-kingdom, ghaznavid-empire]
  links:
    - { from: karakhanid-dynasty, to: samanid-empire, note: "부하라와 트란스옥시아나를 차지함 (999)" }
  tags: [politics, war, religion]
  sources: ["W. Barthold, Turkestan Down to the Mongol Invasion (Luzac, 1928)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "C. Edmund Bosworth, The New Islamic Dynasties (Edinburgh University Press, 1996)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)"]

- id: mawarannahr-learning-1000
  year: 1000
  endYear: 1048
  title:
    ko: "이븐 시나와 비루니: 마와란나흐르와 호라즘이 낳은 학자들(1000~1048)"
  summary:
    ko: "11세기 초 트란스옥시아나와 호라즘은 왕조가 바뀌는 어수선한 때였지만 학문은 이어졌다. 이븐 시나(980 무렵~1037)는 부하라 가까운 아프샤나에서 페르시아계 집안에 태어나 사만 왕조 궁정의 서고를 이용해 공부했고 십대 후반에 사만 군주 누흐 2세의 의사가 되었다. 사만 왕조가 999년 카라한 왕조에 무너지고 아버지도 죽은 뒤(1001년 이후) 그는 호라즘의 도읍 구르간지로 가 호라즘의 마문 왕조 군주 아부 알하산 알리의 궁정에 몸을 의탁했다(옮긴 해는 전하지 않는다). 1012년 호라즘을 떠나 호라산을 거쳐 고르간과 레이로 옮겨 다니며 이란 서부 궁정들에서 의학과 철학을 정리해 『치유의 서』(1014년 시작, 1020년 무렵 완성)와 『의학 정전』을 남겼고, 1037년 6월 하마단에서 죽었다. 비루니(973~1048)는 호라즘의 카트에서 태어나 995년 마문 왕조가 아프리그 왕조를 무너뜨리자 부하라로 옮겼고, 998년 카스피해 남쪽 타바리스탄의 군주 카부스의 궁정에서 1000년 무렵 『고대 민족들의 연대기』를 썼다. 그 뒤 구르간지로 돌아와 스승 아부 나스르 만수르와 함께 일했다. 구르간지 궁정은 「호라즘 마문 왕조의 성립과 구르간지 궁정(995~1017)」(앞의 사건)에도 나온다. 1017년 7월 가즈니 왕조의 마흐무드가 호라즘을 병합하자 비루니와 다른 학자들은 가즈니로 옮겨졌고(포로였다는 서술도 있다), 그는 궁정 점성가로 일하며 인도 원정에 따라갔다. 1030년 무렵 『인도지』를 완성했고 1037년 『마수드 정전』을 가즈니의 마수드에게 바쳤으며 1048년 12월 가즈니에서 죽었다(1050년 무렵이라는 서술도 있다). 두 사람 모두 그리스와 이슬람 학문을 아랍어로 정리했다. 이들의 이력은 사만 왕조의 부하라, 마문 왕조의 구르간지, 가즈니 궁정과 이란 서부의 궁정으로 이어지는 학자의 길을 보여 주며, 정치 권력이 바뀔 때마다 학자도 함께 옮겨 갔다."
  subjects: [mamunid-dynasty, ghaznavid-empire, karakhanid-dynasty]
  tags: [culture]
  sources: ["Dimitri Gutas, Avicenna and the Aristotelian Tradition: Introduction to Reading Avicenna's Philosophical Works (Brill, 1988)", "Edward C. Sachau, trans., Alberuni's India (Trübner, 1888)", "S. Frederick Starr, Lost Enlightenment: Central Asia's Golden Age from the Arab Conquest to Tamerlane (Princeton University Press, 2013)", "C. Edmund Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)"]

- id: oghuz-seljuk-1000
  year: 1000
  endYear: 1040
  title:
    ko: "오구즈 튀르크와 셀주크 집단의 남하(1000~1040 무렵)"
  summary:
    ko: "오구즈(구즈) 튀르크는 튀르크멘이라고도 불렸고, 시르다리야 하류와 아랄해 북쪽 초원에서 가축을 먹이며 계절 이동을 하던 튀르크 유목 집단이었다. 이 가운데 키닉 부족의 우두머리 셀주크는 985년 무렵 부족을 이끌고 시르다리야 하류의 잔드 근처로 옮겨 이슬람을 받아들였다고 전한다. 999년 카라한 왕조가 사만 왕조에게서 트란스옥시아나를 빼앗고 아무다리야강 남쪽을 가즈니 왕조가 쥐면서, 이 유목민은 두 이슬람 나라 사이의 땅에서 살게 되었다. 셀주크의 아들 아르슬란 이스라일은 가즈니의 마흐무드가 1025년 무렵 트란스옥시아나에 들어왔을 때 사로잡혀 갇힌 채 죽었다고 한다. 마흐무드는 오구즈 집단 일부를 호라산에 살게 했으나 이들이 약탈로 말썽을 일으키자 1028년 파라와 요새(리바트 이 파라와) 근처에서 직접 쳐서 물리쳤다. 1020~1040년 사이 셀주크의 아들 무사와 손자 투그릴·차그리가 이끄는 여러 오구즈 집단이 이란 쪽으로 옮겨 갔다. 1034년 무렵 투그릴과 차그리는 트란스옥시아나의 카라한 알리 테긴 가문과 틀어져 호라즘으로 피했고, 1035년 호라즘의 가즈니 총독 하룬이 암살되자 카라쿰 사막을 건너 남쪽으로 내려가 메르브와 니사를 거쳐 호라산 변경에 닿았다. 1037~1038년에는 메르브와 니샤푸르를 차지했고 1040년 단다나칸에서 마수드 1세의 가즈니군을 무찔렀다. 그 뒤의 일은 「투그릴 베그와 셀주크의 이란 정복: 단다나칸(1040)에서 바그다드 입성(1055)까지」(뒤의 사건)에 있다. 이 이동은 카라한의 트란스옥시아나와 가즈니의 호라산이 맞선 틈에서 일어난 일로, 중앙아시아 초원의 유목 집단이 이란 고원의 큰 나라로 이어지는 첫 갈래가 되었다."
  subjects: [seljuk-empire, ghaznavid-empire, karakhanid-dynasty]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: karakhanid-ghaznavid-1008
  year: 1008
  endYear: 1026
  title:
    ko: "카라한 왕조와 가즈니 마흐무드의 아무다리야강 다툼(1008~1026)"
  summary:
    ko: "카라한 왕조와 가즈니 왕조는 아무다리야강을 경계로 맞섰다. 가즈니의 마흐무드는 카라한의 일리크 칸 나스르의 딸과 혼인했고(신부가 999년 12월에 오고 혼인은 1000년에 맺어졌다), 한때 두 집안은 사돈이었다. 그러나 1006년 일리크 나스르와 카슈가르의 카디르 칸 유수프가 호라산을 쳐 발흐와 헤라트를 잠깐 차지했다가 그해 안에 마흐무드에게 쫓겨났다. 1008년 1월 두 칸은 수만 명의 군대로 아무다리야강을 건넜으나 마흐무드군에게 크게 졌다(카타르 전투 또는 발흐 전투라 부른다). 그 뒤 카라한 안에서는 칸들이 서로 다투었다. 1023년 아르슬란 칸이 죽은 뒤 카슈가르의 카디르 칸과 알리 테긴의 아우 투간 칸이 계승을 두고 맞섰다. 알리 테긴은 부하라와 사마르칸트 일대를 다스린 카라한의 지방 군주였다. 1024년 9월 마흐무드는 코끼리 부대를 이끌고 아무다리야강을 건너 사마르칸트로 나아갔고, 알리 테긴은 싸우지 않고 달아났다. 마흐무드는 그의 가족을 사로잡았으나 정중하게 대했다. 1025년 4월 29일 마흐무드는 카디르 칸과 서로의 딸을 주고받는 이중 혼인으로 동맹을 맺었다. 알리 테긴은 곧 돌아와 카디르 칸을 물리치고 사마르칸트를 되찾았으나, 마흐무드가 인도 소마나트 원정을 다녀온 뒤인 1026년 그의 장수 아부 바크르 하시리에게 져 화해했다. 마흐무드는 1030년에 죽었다. 가즈니는 카라한의 땅을 병합하지 않고 아무다리야강을 경계로 삼는 선에서 멈췄고, 카라한은 카슈가르의 칸 가문과 부하라·사마르칸트의 알리 테긴 가문으로 갈라진 채 1041년의 동서 분열로 향했다. 마흐무드의 팽창은 「가즈니 왕조의 성립과 마흐무드: 사만 왕조(999)와 사파르 왕조(1003)의 끝, 이란 서부 진출(1029)」(앞의 사건)에, 카라한이 부하라를 차지한 일은 「카라한 왕조의 부하라 점령과 호탄 정복(999~1008)」(앞의 사건)에 있다."
  subjects: [karakhanid-dynasty, ghaznavid-empire]
  tags: [politics, war, diplomacy]
  sources: ["C. Edmund Bosworth, The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994–1040 (Edinburgh University Press, 1963)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "W. Barthold, Turkestan Down to the Mongol Invasion, 4th ed. (Luzac, 1977)"]

- id: karakhanid-split-1041
  year: 1041
  endYear: 1089
  title:
    ko: "카라한 왕조의 동서 분열과 『쿠타드구 빌릭』, 말리크샤의 사마르칸트 점령(1041~1089)"
  summary:
    ko: "카라한 왕조는 칸이 둘로 나뉘어 서쪽과 동쪽을 맡는 이중 체제였고, 1041년 무렵 두 갈래가 따로 서면서 동서로 갈라졌다(사료마다 1040~1042년). 서쪽은 서카라한 왕조로 사마르칸트와 부하라를 중심으로 트란스옥시아나를, 동쪽은 동카라한 왕조로 발라사군과 카슈가르를 중심으로 세미레치예와 타림 분지 서쪽을 다스렸다. 서쪽의 첫 칸으로는 탐가치 칸 이브라힘(재위 1040 무렵~1068)을 꼽는 목록이 많고, 무함마드 아인 앗다울라(재위 1041~1052)를 이 갈래의 우두머리로 적는 서술도 있다. 이브라힘 뒤로는 샴스 알물크 나스르(재위 1068~1080), 히드르(재위 1080~1081), 아흐마드(재위 1081~1089)가 이었고, 동쪽은 아부 슈자 술레이만(재위 1042~1056), 무함마드 이븐 유수프(재위 1056~1057), 이브라힘 이븐 무함마드(재위 1057~1059), 마흐무드(재위 1059~1075), 우마르(재위 1075)를 거쳐 아부 알리 알하산(재위 1075~1102)이 다스렸다. 이 시대에 튀르크어 문헌이 나왔다. 발라사군 출신 유수프 하스 하지브는 1069~1070년 『쿠타드구 빌릭』을 써서 카슈가르의 탐가치 부그라 칸에게 바쳤다. 왕과 대신, 현자, 수도자 네 인물이 정의·행운·지성·마지막 운명을 나타내는 '군주의 거울'로, 이슬람 도시의 지혜와 튀르크 유목의 전통을 아우르려 했다. 카슈가르 출신 학자 마흐무드(1005 무렵 출생)는 1057년 무렵 바그다드로 옮겨 1072~1074년 『투르크어 사전』을 지었는데, 튀르크 부족의 말과 시, 속담과 튀르크 사람이 사는 땅을 그린 가장 오래된 지도를 담았다. 1087년과 1089년 두 차례 원정으로 셀주크의 술탄 말리크샤가 사마르칸트를 차지했고(칸 아흐마드는 1087년 사로잡혔다고 한다), 서카라한은 셀주크에 종속되어 1141년까지 약 반세기 동안 신하로 있었다. 셀주크 쪽 사정은 「알프 아르슬란과 말리크샤: 니잠 알물크의 셀주크 제국(1063~1092)」(뒤의 사건)에 있다."
  subjects: [karakhanid-dynasty, eastern-karakhanid, western-karakhanid, seljuk-empire]
  tags: [politics, culture]
  sources: ["Robert Dankoff, Wisdom of Royal Glory (Kutadgu Bilig): A Turko-Islamic Mirror for Princes (University of Chicago Press, 1983)", "Robert Dankoff and James Kelly, trans., Mahmud al-Kashgari, Compendium of the Turkic Dialects (Dīwān Lughāt at-Turk) (Harvard University, 1982–1985)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: karakhanid-cities-1068
  year: 1068
  endYear: 1127
  title:
    ko: "카라한 시대의 도시와 교역: 리바트 이 말리크에서 칼리안 미나레트까지(1068~1127)"
  summary:
    ko: "카라한 왕조 시대에 트란스옥시아나의 오아시스 도시는 튀르크계 칸의 도읍이 되었다. 왕조는 카슈가르·발라사군·우즈겐·사마르칸트를 큰 도시로 삼고 영역을 이들 도시를 중심으로 몫을 나누어 다스렸다. 서카라한은 사마르칸트와 부하라를, 동카라한은 카슈가르와 발라사군을 중심으로 삼았다. 사마르칸트는 중국과 인도를 잇는 길목에 있어 오래전부터 교역으로 번성한 도시였고, 이곳의 종이 산업은 8세기 무렵 시작되어 쿠란 필사에서 양피지를 밀어냈다(종이 만드는 법이 751년 탈라스에서 잡힌 중국 포로를 통해 왔다는 전승은 학자들이 의심한다). 부하라도 11세기 초부터 카라한의 도시가 되었다. 이른 시기의 화폐는 중국식 네모난 구멍 동전에 아랍 문자를 새긴 것이었다. 서카라한의 칸 샴스 알물크 나스르(재위 1068~1080)는 사마르칸트와 부하라 사이 길에 리바트 이 말리크를 지었다. 오랫동안 대상 숙소로 불렀으나 지금은 칸의 요새 겸 거처였다고 보며, 대상 숙소로 쓰인 것은 카라한이 무너진 13세기 초 뒤라는 견해가 있다. 1068년 건립이라는 설이 우세하고 1078~1079년으로 보던 옛 설도 있다. 이 건물은 1968년 지진으로 입구 문만 남았다. 부하라에서는 1127년 무함마드 아르슬란 칸(재위 1102~1129)이 칼리안 미나레트를 세웠다. 장인 바코가 지었고 높이 46~48미터가량에 밑지름 약 9미터에서 위로 갈수록 6미터로 좁아지며, 옆의 칼리안 사원과 다리로 이어진다. 13세기 몽골이 부하라를 무너뜨릴 때 이 탑만 남겼다는 이야기가 전한다. 이 건축물들은 이슬람으로 개종한 튀르크 왕조가 이란계 도시 문명 위에 세운 것이다."
  subjects: [western-karakhanid, eastern-karakhanid]
  tags: [culture, economy]
  sources: ["Jonathan M. Bloom, Paper Before Print: The History and Impact of Paper in the Islamic World (Yale University Press, 2001)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "S. Frederick Starr, Lost Enlightenment: Central Asia's Golden Age from the Arab Conquest to Tamerlane (Princeton University Press, 2013)"]

- id: eastern-karakhanid-qocho-1096
  year: 1096
  endYear: 1128
  title:
    ko: "동카라한과 고창 위구르의 오아시스 다툼: 악수·쿠차의 이전(1096~1128)"
  summary:
    ko: "고창 위구르 왕국은 투루판 분지를 중심으로 마니교와 불교를 함께 받들던 나라였고, 타림 분지 북쪽 오아시스(악수·툼슈크·쿠차)에서 서쪽의 동카라한과 맞닿았다. 동카라한은 이슬람을 받아들인 튀르크 왕조로 발라사군과 카슈가르를 중심에 두었다. 1096년 고창 위구르는 악수·툼슈크·쿠차를 동카라한에 잃었다(이 싸움의 경위는 자세히 전하지 않는다). 당시 동카라한의 칸은 아부 알리 알하산(재위 1075~1102)에 이어 아흐마드(재위 1102~1128)가 이었다. 고창 위구르의 이디쿠트는 알프 아르슬란 쿠틀룩 퀼 빌게 텡그리 칸(재위 1007~1024)을 비롯한 이들이 이었는데 왕의 목록은 사료에 따라 갈린다. 위구르 왕실의 신앙은 마니교에서 불교로 기울어 1008년에는 마니교 사원이 불교 사원으로 바뀌었다고 한다. 위구르 사람들은 소그드 문자를 바탕으로 세로로 쓰는 위구르 문자로 경전과 문서를 남겼고, 베제클리크 같은 석굴 사원은 위구르 불교도가 후원해 벽화로 꾸몄다. 경교(네스토리우스교) 신자도 있어서 시리아어와 위구르어를 함께 새긴 묘비가 남아 있다. 1123년 빌게가 즉위했고, 야율대석(예뤼 다스)이 서쪽으로 오자 고창 위구르는 서요(카라 키타이)의 종속국이 되었다. 위키백과 영어판 'Kingdom of Qocho' 문서는 이를 1128년으로 적지만, 서요 쪽 서술은 야율대석이 1131년 무렵 카슈가르 공격에 실패하고 고창으로 물러난 때를 전하여 해가 갈린다. 서요는 처음에는 느슨하게 다스리다 점차 무거운 세금을 거두었다고 한다. 서요가 세워진 일은 「예뤼 다스의 서진과 서요(카라 키타이)의 건국(1124~1143)」(뒤의 사건)에 있다."
  subjects: [eastern-karakhanid, qocho-uyghur-kingdom, qara-khitai]
  tags: [politics, religion]
  sources: ["Johan Elverskog, Buddhism and Islam on the Silk Road (University of Pennsylvania Press, 2010)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)"]

- id: yasawi-sufi-1100
  year: 1100
  endYear: 1166
  title:
    ko: "아흐마드 야사위와 튀르크 수피 교단(1100~1166 무렵)"
  summary:
    ko: "아흐마드 야사위는 11세기 말 시르다리야 중류의 사이람에서 태어나(1093년으로 적는 글이 많다) 1166년 무렵 일흔두세 살로 투르키스탄에서 죽은 수피 성자다. 그의 이름에는 전설이 많이 얽혀 사실과 전설을 가리기 어렵다. (아르슬란 바바가 영적 위임을 대추씨에 담아 전했다는 이야기는 전설이다) 아버지 이브라힘 셰이크가 일찍 죽어 일곱 살 무렵 아르슬란 바바 밑에서 자랐고, 부하라에서 유수프 하마다니에게 배웠다고 한다. 그는 야시(지금의 투르키스탄)에 자리 잡아 이 도시를 초원 서쪽의 학문 중심지로 키웠다. 그가 살던 땅은 카라한 왕조의 영역이었으나 어느 갈래의 땅인지는 사료가 분명히 말하지 않고, 1141년 카트완 싸움 뒤 서카라한은 서요(카라 키타이)에 신하의 예를 바쳤다. 그의 이름으로 전하는 『지혜의 책』(디반 이 히크메트)은 중기 튀르크어로 쓴 시 모음으로, 이슬람의 가르침과 신에 대한 사랑을 튀르크 유목민이 알아듣는 말과 가락으로 풀어냈다(전통은 그의 작품으로 여기나 직접 지었다고 확정하기는 어렵다). 그의 가르침을 따르는 이들은 최초의 튀르크 수피 교단인 야사위야를 이루었고, 이 교단은 튀르크어를 쓰는 땅으로 빠르게 퍼졌다. 야사위 계통은 뒤에 튀르키예의 유누스 엠레와 하지 벡타시 벨리, 코치카르 아타, 사르 살틱, 투르크멘의 시인 마흐툼굴리 피라기에게도 영향을 주었다고 한다. 야사위의 후손인 사이이드 아타 셰이크 가문은 19세기까지 부하라 궁정에서 높은 자리를 차지했다. 1389년 티무르는 그의 무덤 위에 큰 영묘를 짓게 했으나 1405년 티무르가 죽을 때까지 끝내지 못했고, 이 건물은 지금도 투르키스탄에 서 있다."
  subjects: [western-karakhanid, qara-khitai]
  tags: [religion, culture]
  sources: ["Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "Devin DeWeese, Islamization and Native Religion in the Golden Horde: Baba Tükles and Conversion to Islam in Historical and Epic Tradition (Pennsylvania State University Press, 1994)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: sanjar-samarkand-1102
  year: 1102
  endYear: 1141
  title:
    ko: "산자르와 서카라한: 무함마드 아르슬란 칸에서 카트완까지(1102~1141)"
  summary:
    ko: "서카라한의 무함마드 아르슬란 칸(재위 1102~1129)은 사마르칸트를 도읍으로 트란스옥시아나를 다스렸고 셀주크의 술탄 산자르의 장인이었다(산자르의 아내 투르칸 하툰이 그의 딸이다). 서카라한은 1089년 뒤로 셀주크에 종속되어 있었으므로 이 혼인은 종주와 신하를 잇는 끈이기도 했다. 무함마드 아르슬란 칸은 1127년 부하라에 칼리안 미나레트를 세웠다(「카라한 시대의 도시와 교역: 리바트 이 말리크에서 칼리안 미나레트까지(1068~1127)」, 앞의 사건). 1138년 산자르는 호라즘의 아트시즈를 하자라스프에서 이기고 호라즘을 조카 술레이만샤에게 맡겼다(「자마크샤리와 호라즘의 학문, 호라즘샤 아트시즈와 산자르(1120~1143)」, 뒤의 사건). 그가 죽은 1129년 뒤 칸 자리는 짧은 재위로 거듭 바뀌어 나스르(1129), 아흐마드 카디르 칸(1129~1130), 하산 잘랄 앗둔야(1130~1132), 이브라힘 룩눗둔야(1132), 마흐무드(1132~1141)로 이어졌다. 1130년 산자르는 도움을 청했던 서카라한의 칸이 자신의 암살을 꾀했다 하여 사마르칸트를 포위해 차지했다(위키백과 영어판 '산자르'는 이 칸을 아르슬란 칸이라 부른다). 한편 동쪽에서는 야율대석이 이끄는 서요(카라 키타이)가 일어나 1137년 호젠트 근처에서 서카라한 칸을 물리쳤다. 1141년 9월 서요가 카트완에서 산자르의 군대를 크게 무찔러 셀주크는 트란스옥시아나를 잃었고, 서카라한은 서요에 신하의 예를 바치게 되었다. 이 싸움은 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」(뒤의 사건)에, 서요의 서진은 「예뤼 다스의 서진과 서요(카라 키타이)의 건국(1124~1143)」(뒤의 사건)에 있다."
  subjects: [western-karakhanid, seljuk-empire, qara-khitai]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "W. Barthold, Turkestan Down to the Mongol Invasion, 4th ed. (Luzac, 1977)"]

- id: zamakhshari-khwarazm-1120
  year: 1120
  endYear: 1143
  title:
    ko: "자마크샤리와 호라즘의 학문, 호라즘샤 아트시즈와 산자르(1120~1143)"
  summary:
    ko: "아부 알카심 마흐무드 이븐 우마르 알자마크샤리는 1074년 3월 호라즘의 자마크샤르에서 태어나 1143년 7월 구르간지에서 죽었다(1144년으로 적는 글도 있다). 그는 중앙아시아와 호라산, 이스파한, 바그다드에서 공부했고 메카에서 여러 해를 보내 '신의 이웃(자르 알라)'이라 불렸다. 신학에서는 이성을 앞세운 무타질라파였다. 대표작은 쿠란 주석서 『알카샤프』이고, 1120~1122년 무렵 쓴 아랍어 문법서 『알무파살』(바스라학파와 쿠파학파의 문법을 아울러 정리했다), 낱말을 본뜻과 비유로 나누어 알파벳순으로 푼 사전 『아사스 알발라가』, 설교와 교훈을 모은 『마카마트』도 남겼다. 그가 학문을 닦은 때의 호라즘은 셀주크가 임명한 총독에서 자립한 호라즘샤 쿠틉 앗딘 무함마드(재위 1097~1127/1128)와 아들 아트시즈(재위 1127~1156)가 다스렸다. 아트시즈는 셀주크 술탄 산자르에게 맞섰다가 1138년 하자라스프에서 패해 호라즘을 빼앗겼고, 산자르는 호라즘을 조카 술레이만샤에게 맡겼다. 1141년 산자르가 카트완에서 서요에게 지자 아트시즈는 그 틈을 타 호라산으로 쳐들어가 메르브·니샤푸르 등을 차지했으나 1142년 산자르에게 쫓겨났고, 1143년 산자르가 우르겐치로 와서 아트시즈의 복속을 다시 받았다. 이 사건들은 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」(뒤의 사건)에 있다. 구르간지는 정치가 셀주크와 서요 사이에서 흔들리는 가운데에서도 아랍어와 이슬람 학문을 하는 이들이 모이는 도시였다. 『알카샤프』는 쿠란 구절의 비유 표현을 언어학으로 분석한 점이 특징이었고, 뒤 세대 이슬람 세계에서 널리 읽히며 논쟁을 일으켰다."
  subjects: [khwarazmian-empire, seljuk-empire]
  tags: [culture, religion]
  sources: ["Andrew Rippin, ed., The Blackwell Companion to the Qur'ān (Blackwell, 2006)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: qara-khitai-1124
  year: 1124
  endYear: 1143
  title:
    ko: "예뤼 다스의 서진과 서요(카라 키타이)의 건국(1124~1143)"
  summary:
    ko: "거란이 세운 요가 여진의 금에게 무너져 가던 1124년, 요의 황족 야율대석(예뤼 다스, 1087 또는 1094~1143)은 관리와 군사를 이끌고 서북쪽 케둔으로 옮겨 왕을 칭했다(1125년 요의 마지막 황제 천조제가 사로잡혀 요가 끝났다). 그는 1115년 진사에 오른 학자 출신 황족이었다. 1130년 3월 군사 2만이 안 되는 무리로 서쪽 길을 떠나 이밀강 유역에 터전을 잡았고, 1131년 여름 카슈가르를 쳤다가 져서 투루판의 고창 위구르로 물러났다. 1132년 구르칸('칸 중의 칸')을 칭하고 천우황제라 했다. 1134년 그는 발라사군의 동카라한 군주를 몰아내고 이 도시를 도읍으로 삼았으며 연호를 강국이라 했다. 1137년 5월 호젠트 근처에서 서카라한의 칸을 물리쳐 서카라한을 속국으로 삼았고, 고창 위구르도 서요의 종속국이 되어 있었다. 1141년 9월 9일 카트완에서 셀주크의 술탄 산자르를 크게 이겨 서요가 중앙아시아의 강자가 되었다. 그 싸움은 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」(뒤의 사건)에 있고, 유럽에서는 이 소식이 '사제왕 요한' 전설과 이어졌다(「제2차 십자군(1147~1149)과 '사제왕 요한' 소식」, 뒤의 사건). 이 전설은 1145년 독일의 오토 프라이징이 처음 기록했다. 1142년 호라즘의 아트시즈는 해마다 금화 3만 디나르를 바치기로 했다. 야율대석은 1143년 발라사군에서 죽었고, 황후 소탑불연이 어린 아들을 대신해 섭정했다. 서요의 중심은 이밀강 유역과 세미레치예의 발라사군이었고, 서쪽 시르다리야 도시들은 속국의 조공을 받는 가장자리였다. 동카라한과 서카라한, 고창 위구르는 이렇게 서요 아래로 들어갔다."
  subjects: [qara-khitai, liao, jin, eastern-karakhanid, western-karakhanid, qocho-uyghur-kingdom, seljuk-empire, khwarazmian-empire]
  links:
    - { from: qara-khitai, to: eastern-karakhanid, note: "발라사군을 차지함 (1134)" }
  tags: [politics, war]
  sources: ["Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "Karl A. Wittfogel and Feng Chia-sheng, History of Chinese Society: Liao (907–1125) (American Philosophical Society, 1949)", "Juvaini, Ata-Malik, The History of the World-Conqueror, trans. John Andrew Boyle (Manchester University Press, 1958)"]

- id: qara-khitai-rule-1143
  year: 1143
  endYear: 1208
  title:
    ko: "서요의 다스림: 구르칸의 계승과 속국, 불교·경교·이슬람(1143~1208)"
  summary:
    ko: "야율대석이 죽은 1143년 뒤 서요(카라 키타이)의 구르칸 자리는 어린 황제를 대신한 황후와 태후의 섭정을 자주 거쳤다. 황후 소탑불연(감천황후, 섭정 1143~1150)에 이어 아들 야율이열(재위 1150~1163/1164)이 직접 다스렸고, 그는 1150년대 호구 조사에서 약 8만 4천 5백 호를 헤아렸다. 그 뒤 야율보속완(승천 태후)이 1164년부터 1177/1178년까지 섭정했으나 정변으로 죽었고, 소알리랄이 세운 야율직로고가 1177/1178년부터 1211년까지 자리에 있었다(재위 끝은 사료에 따라 1218년이라고도 한다). 서요는 중국식 연호와 황제 칭호를 쓰는 거란 황실이 튀르크·이란계 속국을 거느린 나라였다. 중심은 이밀강 유역과 세미레치예의 발라사군이었고, 호라즘은 해마다 조공을 바쳤으며(1142년 정해진 금화 3만 디나르), 서카라한과 동카라한, 고창 위구르는 속국이었다. 고창 위구르는 처음에는 느슨하게 다스려지다 뒤에 무거운 세금을 물었다고 한다. 군인에게는 녹봉을 주었다. 거란 지배층은 불교를 믿었고 경교·도교·이슬람이 함께 있었으며 거란 사람들은 불을 섬기는 옛 풍습도 이었으나, 주민 대다수는 무슬림이었고 불교도와 경교도가 적지 않은 소수였다. 이 시기 서요의 힘은 1198년 호라즘과 함께 구르 왕조를 쳤으나 크게 진 일로, 또 1204년 호라즘의 무함마드 2세를 도운 일로 드러났다(「테키시의 즉위와 서요의 군대, 1198년 구르 침공(1172~1198)」·「무함마드 구리의 죽음과 구르 왕조의 끝, 안드후이 전투(1203~1215)」, 뒤의 사건). 그러나 호라즘이 1210년 무렵 시르다리야 도시들을 차지하면서 서요의 속국 체제는 서쪽에서 흔들렸다."
  subjects: [qara-khitai, khwarazmian-empire, western-karakhanid, eastern-karakhanid, qocho-uyghur-kingdom]
  tags: [politics, religion, society]
  sources: ["Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "Juvaini, Ata-Malik, The History of the World-Conqueror, trans. John Andrew Boyle (Manchester University Press, 1958)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)"]

- id: ghurid-rise-1149
  year: 1149
  endYear: 1175
  title:
    ko: "구르 왕조의 흥기: 가즈니를 불태운 알라 앗딘 후사인에서 헤라트 점령까지(1149~1175)"
  summary:
    ko: "구르는 헤라트와 가즈니 사이 힌두쿠시 서쪽 산악 지대로, 1011년 가즈니의 마흐무드에게 정복된 뒤 구르 가문은 가즈니의 신하로 점차 수니파 이슬람을 받아들였다. 12세기 초에는 이졷 앗딘 후사인(재위 1100~1146)이 셀주크에 신하의 예를 바쳤다. 1149년 가즈니의 바흐람 샤가 구르의 군주 쿠틉 앗딘 무함마드를 독살하자 아우 사이프 앗딘 수리가 복수하러 가즈니를 쳤으나 사로잡혀 처형되었다. 뒤를 이은 아우 바하 앗딘 삼 1세는 가즈니로 군대를 보내기 전 1149년 병으로 죽었고, 그 아우 알라 앗딘 후사인(재위 1149~1161)이 이어받아 가즈니를 1150년 무렵 공격해 이레 밤낮을 불태웠고(1151년으로 적는 글도 있다) '세상을 불사른 자(자한수즈)'라 불렸다. 1152년 그가 셀주크 술탄 산자르에게 조공을 거부하다 나브에서 져 2년 가까이 사로잡혀 있었으나, 1153년 산자르가 오구즈에게 사로잡히는 바람에 구르는 숨통을 틔웠다. 사이프 앗딘 무함마드(재위 1161~1163)에 이어 기야스 앗딘 무함마드(재위 1163~1203)와 아우 무이즈 앗딘 무함마드(무함마드 구리)가 함께 나라를 이끌었다. 1173년 무이즈 앗딘이 오구즈에게서 가즈니를 되찾았고(1169년에 가즈니를 얻었다는 서술도 있다), 1174~1175년 형 기야스 앗딘의 이름으로 잠 미나레트가 완성되었다. 1175년에는 셀주크에게서 헤라트를 얻고 인도 원정을 시작했다. 구르 왕조는 이렇게 산악 가문에서 가즈니와 헤라트를 거느린 나라로 자랐다. 1186년 라호르를 얻어 가즈니 왕조를 끝낸 일과 인도 진출은 「구르 왕조 무함마드 구리의 인도 진출: 물탄에서 라호르까지(1175~1186)」(뒤의 사건)에 있고, 가즈니가 구르에 밀려난 일은 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」(앞의 사건)에도 나온다."
  subjects: [ghurid-dynasty, ghaznavid-empire, seljuk-empire]
  tags: [politics, war]
  sources: ["C. E. Bosworth, 'The Early Islamic History of Ghur', Central Asiatic Journal 6 (1961)", "Minhaj-i Siraj Juzjani, Tabaqat-i Nasiri, trans. H. G. Raverty (Gilbert & Rivington, 1881)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: oghuz-khorasan-1153
  year: 1153
  endYear: 1173
  title:
    ko: "산자르의 패배와 오구즈의 호라산·가즈니(1153~1173)"
  summary:
    ko: "오구즈 튀르크멘은 발흐 근처에서 풀을 먹이며 살았고, 셀주크 술탄 산자르에게 정착의 대가로 해마다 양 2만 마리를 바쳤다. 그러나 그들은 오구즈를 조롱한 세금 징수관을 죽였고, 발흐 총독 아미르 쿠마치가 세금을 더 늘리자 갈등이 터졌다. 1153년 4월 산자르의 군대는 발흐 근처에서 오구즈에게 크게 져 산자르가 사로잡히고 쿠마치는 죽었다. 이 싸움을 무하람 전투라 부른다. 산자르의 아내 투르칸 하툰은 서카라한 칸의 딸이었다. 산자르는 3년 가까이 갇혀 있다가 1156년 가을 달아났으나 옛 권위를 되찾지 못했고, 1157년 5월 8일 메르브에서 일흔 살로 죽었다. 오구즈 무리는 호라산을 거침없이 휩쓸어 이 지방에 큰 피해를 입혔다고 전한다. 이 일로 호라산의 셀주크 권력이 무너졌고, 호라즘과 구르 같은 이웃 세력이 그 공백으로 파고들었다. 호라즘샤 테키시는 훗날 오구즈 튀르크멘과 킵차크 부족과 가깝게 지냈다. 오구즈는 가즈니에도 닿았다. 1161~1162년 무렵 오구즈 집단이 가즈니를 차지해 가즈니 왕조의 후스라우 말리크가 라호르로 물러났다(가즈니 왕조가 라호르로 중심을 옮긴 때를 1151년 구르의 공격 뒤로 적는 글도 있다). 구르의 사이프 앗딘 무함마드는 1163년 발흐의 오구즈와 싸우다 죽었으나, 기야스 앗딘과 무이즈 앗딘이 끝내 오구즈를 물리쳤고 1173년 가즈니를 되찾았다. 산자르의 패배는 「카트완 전투(1141)와 가즈니 왕조의 끝(1186)」(앞의 사건)에도 나오며, 구르 쪽의 사정은 「구르 왕조의 흥기: 가즈니를 불태운 알라 앗딘 후사인에서 헤라트 점령까지(1149~1175)」(앞의 사건)에 있다."
  subjects: [seljuk-empire, ghaznavid-empire]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "W. Barthold, Turkestan Down to the Mongol Invasion, 4th ed. (Luzac, 1977)"]

- id: khwarazm-qara-khitai-1172
  year: 1172
  endYear: 1198
  title:
    ko: "테키시의 즉위와 서요의 군대, 1198년 구르 침공(1172~1198)"
  summary:
    ko: "호라즘샤 일 아르슬란이 1172년 죽자 아들 테키시와 술탄샤가 자리를 다투었다. 서술에 따라 서요(카라 키타이)의 도움을 받은 쪽이 테키시라 하기도 하고 술탄샤라 하기도 한다. 테키시는 서요에 도움을 청해 군대를 얻어 1172년 12월 저항 없이 호라즘을 차지했고, 어머니 투르칸 하툰과 아우 술탄샤는 달아났다고 한다. 술탄샤는 호라산으로 달아나 그곳 군주의 보호를 받았고, 서요군이 그를 호라즘샤로 다시 세우려 했으나(테키시가 서요에 조공을 끊은 뒤의 일로 적는 서술이 있다), 테키시가 아무다리야강 물을 터뜨려 공격을 막았다. 서요군 대부분은 돌아갔지만 사령관은 군사 일부를 술탄샤 곁에 남겼다. 테키시와 술탄샤의 싸움은 「호라즘샤 왕조의 성장: 아누슈티긴에서 테키시까지(1077~1200)」(앞의 사건)에서 이어진다. 테키시는 오구즈 튀르크멘, 킵차크 부족과 가깝게 지내며 힘을 키웠다. 1198년 서요와 호라즘은 힘을 합쳐 구르 왕조의 영지를 쳤다. 테키시는 헤라트를, 서요의 구르칸 야율직로고는 구즈간을 쳤으나, 구르군이 곧 두 나라에 큰 패배를 안겼다. 서요가 보상을 요구했으나 테키시가 응하지 않고 자립을 선언했다는 서술이 있고, 구르에서 돈을 꾸어 갚았다는 서술도 있다. 서요는 호라즘의 종주였으나 호라즘이 이란 쪽으로 힘을 키우면서 그 관계는 바뀌었고, 호라즘은 서요의 힘을 빌리면서도 이를 벗어나려 했다. 서요의 구르칸 야율직로고는 1177/1178년에 즉위해 이때 재위 중이었다. 호라즘이 서요의 속국에서 독자 세력으로 자라는 과정에서 1204년 무함마드 2세가 구르를 물리칠 때에도 서요의 지원군이 함께했다. 1200년 테키시가 죽고 아들 무함마드 2세가 이었으며 그 뒤 일은 「무함마드 구리의 죽음과 구르 왕조의 끝, 안드후이 전투(1203~1215)」(뒤의 사건)에 있다."
  subjects: [khwarazmian-empire, qara-khitai, ghurid-dynasty]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)", "Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "Juvaini, Ata-Malik, The History of the World-Conqueror, trans. John Andrew Boyle (Manchester University Press, 1958)"]

- id: ghurid-end-1203
  year: 1203
  endYear: 1215
  title:
    ko: "무함마드 구리의 죽음과 구르 왕조의 끝, 안드후이 전투(1203~1215)"
  summary:
    ko: "구르 왕조는 1203년 3월 13일 기야스 앗딘 무함마드가 죽으면서 아우 무이즈 앗딘 무함마드(무함마드 구리)가 홀로 나라를 이끌게 되었다. 1200년 호라즘샤 테키시가 죽자 구르는 니샤푸르를 차지하는 등 호라산으로 다시 뻗었다. 1204년 안드후이 전투에서 무함마드 구리는 호라즘의 무함마드 2세와 서요(카라 키타이)의 연합군에게 크게 졌다. 호라즘 쪽 서술은 무함마드 2세가 먼저 아무다리야강에서 졌다가 하자라스프에서 서요의 지원군과 함께 이겼다고 전한다. 무함마드 구리는 1206년 3월 인도 쪽 인더스강 근처에서 암살되었다. 그가 죽자 인도의 구르 영토는 옛 맘루크 장수들 손에 흩어졌다(「구르 왕조 무함마드 구리의 인도 진출: 물탄에서 라호르까지(1175~1186)」(앞의 사건)). 1206년 무함마드 구리가 죽자 호라즘의 무함마드 2세가 구르의 호라산 땅으로 밀고 들어와 1208년 7월 헤라트를 차지했고, 기야스 앗딘 마흐무드(재위 1206~1212)와 바하 앗딘 삼 3세(재위 1212~1213), 알라 앗딘 아트시즈(재위 1213~1214), 알라 앗딘 알리(재위 1214~1215)는 호라즘의 신하로 있었다. 1215년 겨울 호라즘이 구르 본토(피루즈쿠흐)와 바미얀을 차지하면서 구르 왕조는 구르와 호라산에서 끝났다. 1193년 쿠틉 앗딘 아이바크가 델리를 차지한 뒤 인도의 구르 영토는 맘루크 장수들의 정권으로 이어졌다. 구르 왕조는 인도 정복의 발판이 되어 델리 술탄국으로 이어졌으나 중앙아시아·아프가니스탄 쪽에서는 호라즘에 흡수되었다. 호라즘의 무함마드 2세가 서요를 밀어내는 일은 「쿠츨루크의 찬탈과 서요의 끝, 오트라르 사건(1208~1218)」(뒤의 사건)에 있다. 호라즘과 이어지는 일은 「알라 앗딘 무함마드 2세의 호라즘 제국(1200~1220)」(앞의 사건)에도 있다."
  subjects: [ghurid-dynasty, khwarazmian-empire, qara-khitai]
  tags: [politics, war]
  sources: ["C. E. Bosworth, 'The Early Islamic History of Ghur', Central Asiatic Journal 6 (1961)", "Minhaj-i Siraj Juzjani, Tabaqat-i Nasiri, trans. H. G. Raverty (Gilbert & Rivington, 1881)", "C. Edmund Bosworth, The New Islamic Dynasties: A Chronological and Genealogical Manual (Columbia University Press, 1996)"]

- id: kuchlug-otrar-1208
  year: 1208
  endYear: 1218
  title:
    ko: "쿠츨루크의 찬탈과 서요의 끝, 오트라르 사건(1208~1218)"
  summary:
    ko: "나이만의 왕자 쿠츨루크는 타양 칸의 아들로, 1204년 테무진의 몽골에게 크게 지고 서쪽으로 달아났다. 1208년 다시 몽골에게 패해 세미레치예를 거쳐 발라사군의 서요(카라 키타이)에 몸을 맡겼다. 서요의 구르칸 야율직로고는 그를 받아들여 조언자로 삼고 공주와 혼인시켰으며 칸 칭호와 나이만 군대를 주었다. 1210년 서요가 사마르칸트의 반란을 다루는 사이 쿠츨루크는 우즈겐의 국고를 차지해 반란을 일으켰고, 호라즘의 무함마드 2세는 탈라스 근처에서 서요군을 물리쳤다. 1211년 쿠츨루크는 사냥 중 야율직로고를 사로잡아 태상황으로 삼고 실권을 쥐었다(야율직로고는 2년쯤 뒤 죽었다). 쿠츨루크는 네스토리우스교 집안에서 자랐으나 불교로 옮겼고, 지배는 무슬림 박해로 기억된다. 주민에게 개종하든 거란 옷을 입든 고르게 했고, 호탄의 이맘을 십자가에 못 박았다고 후대 사료가 전한다. 1211년 동카라한의 마지막 칸(아불 파트 무함마드, 재위 1205~1211)이 카슈가르에서 죽임을 당해 동카라한이 끝났고(위키백과 영어판은 이 왕자를 유수프라고도 적는다), 1214년 카슈가르의 반란 세력이 쿠츨루크에 항복해 카슈가르와 호탄이 그의 아래로 들어갔다. 1212년 무함마드 2세는 서카라한의 마지막 칸 우스만(재위 1202~1212)을 사마르칸트에서 처형했다(도읍을 사마르칸트로 옮긴 때는 1212년 또는 1218년 무렵으로 서술이 갈린다). 호라즘은 시르다리야 중류의 오트라르 같은 도시 띠를 쥐었고 시르다리야 위쪽에서는 쿠츨루크와 맞섰다. 1218년 칭기즈 칸이 제베를 보내 발라사군 근처에서 쿠츨루크의 군대 3만을 물리쳤고, 쿠츨루크는 카슈가르에서 민심을 잃고 파미르를 넘어 달아났다가 1218년 바다흐샨과 와칸 경계에서 사냥꾼에게 잡혀 몽골에게 넘겨져 목이 베였다. 이로써 서요의 땅은 몽골 제국에 들어갔다. 같은 1218년 겨울(1218~1219) 칭기즈 칸이 보낸 대상(무슬림 상인과 사절 약 450명)이 오트라르에 닿자 총독 이날추크가 첩자라며 죽이고 물건을 빼앗았다. 무함마드 2세의 책임을 두고 사료가 갈린다. 이 일은 「몽골의 호라즘 정복과 잘랄 앗딘(1219~1231)」(뒤의 사건)과 「몽골의 트란스옥시아나 점령과 다스림의 시작(1220~1227)」(뒤의 사건)으로 이어졌다."
  subjects: [qara-khitai, eastern-karakhanid, western-karakhanid, khwarazmian-empire, mongol-empire]
  links:
    - { from: khwarazmian-empire, to: western-karakhanid, note: "서카라한을 없애고 사마르칸트를 차지함 (1212)" }
  tags: [politics, war, religion]
  sources: ["Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "Juvaini, Ata-Malik, The History of the World-Conqueror, trans. John Andrew Boyle (Manchester University Press, 1958)", "W. Barthold, Turkestan Down to the Mongol Invasion, 4th ed. (Luzac, 1977)"]

- id: qocho-mongol-1209
  year: 1209
  endYear: 1211
  title:
    ko: "고창 위구르의 이디쿠트 바르축과 카를루크 아르슬란 칸의 몽골 복속(1209~1211)"
  summary:
    ko: "서요(카라 키타이)의 속국이던 고창 위구르 왕국은 서요에서 보낸 감독관의 무거운 세금과 간섭에 시달렸다. 1209년 이디쿠트 바르축 아르트 테긴(재위 시작이 1208년 또는 1229년으로 사료에 따라 갈린다)은 서요가 보낸 감독관을 죽이고 칭기즈 칸에게 보호를 청해 스스로 몽골 제국에 복속했고, 그 대가로 몽골 황실의 보호를 받게 되었다. 위구르의 복속은 몽골의 제국 운영에 큰 힘이 되었는데, 문자를 아는 위구르 관리들이 몽골의 행정을 맡았고 위구르 문자가 뒤에 몽골 문자의 바탕이 되었다는 설명이 있다. 고창 위구르의 몽골 종속은 1209년부터 1335년까지 이어졌다고 적는 서술이 있다. 서요는 1128년 무렵 고창 위구르를 종속시킨 때부터 감독관을 두어 세금을 거두었다. 한편 일리강 남쪽과 타르바가타이산맥 일대의 카를루크도 서요의 감독관을 죽이고 칭기즈 칸에게 충성을 선언했다. 카얄릭의 카를루크 아르슬란 칸은 1211년 복속했고(칭기즈 칸의 사위가 되었다고도 하며 군사 6천을 거느렸다고 한다), 알말릭의 우자르(주치 가문의 딸과 혼인했다)도 1211년 칭기즈 칸의 종주권을 인정했다고 전한다(알말릭의 복속을 1209년으로 적는 서술도 있다). 알말릭과 일리강 일대는 뒤에 칭기즈 칸의 둘째 아들 차가타이의 몫이 되었다는 서술이 있다. 우자르는 뒤에 쿠츨루크에게 죽임을 당했고, 알말릭 포위는 1218년 몽골이 서요로 쳐들어오는 구실이 되었다. 서요 쪽 사정은 「쿠츨루크의 찬탈과 서요의 끝, 오트라르 사건(1208~1218)」(앞의 사건)에, 위구르의 뒤 일은 「차가타이 울루스의 성립과 오고타이 가문 숙청, 알구의 독립(1227~1266)」(뒤의 사건)과 이어진다."
  subjects: [qocho-uyghur-kingdom, qara-khitai, mongol-empire]
  tags: [politics, diplomacy]
  sources: ["Michal Biran, The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World (Cambridge University Press, 2005)", "Juvaini, Ata-Malik, The History of the World-Conqueror, trans. John Andrew Boyle (Manchester University Press, 1958)", "Thomas T. Allsen, Mongol Imperialism: The Policies of the Grand Qan Möngke in China, Russia, and the Islamic World, 1251–1259 (University of California Press, 1987)"]
