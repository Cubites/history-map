# 중앙아시아 사건 3차 묶음 ca-02: 아랍 칼리프국과 카라한 왕조의 시대 — 서돌궐·투르기시·아랍 정복·사만·카라한·고창 위구르·가즈니·셀주크·서요·구르·호라즘 (600 ~ 1218년)
# 범위: 서돌궐 아래의 소그드·토하리스탄·페르가나·우스루샤나·호라즘·고창국과 소그드 상인의 문화·사마르칸트의 바르후만과 아프라시아브 벽화·아랍의 호라산 진출과 쿠타이바의 트란스옥시아나 정복·자불리스탄의 준빌·투르기시 카간국·데와슈티치의 항전·탈라스 뒤의 중앙아시아·무칸나의 봉기·토번의 타림 분지 진출·사만 가문의 트란스옥시아나·카라한 왕조의 등장과 이슬람 수용·고창 위구르 왕국·사만 시대의 문예·알프티긴의 가즈니·호라즘 마문 왕조·카라한의 부하라 점령과 호탄 정복(600~1017년, 앞 절반),
#   이븐 시나와 비루니·오구즈 튀르크와 셀주크의 남하·카라한과 가즈니 마흐무드의 다툼·카라한의 동서 분열과 『쿠타드구 빌릭』·카라한 시대의 도시·동카라한과 고창 위구르의 오아시스 다툼·아흐마드 야사위·산자르와 서카라한·자마크샤리와 호라즘의 학문·예뤼 다스의 서요 건국과 서요의 다스림·구르 왕조의 흥기와 끝·오구즈의 호라산 장악·테키시와 서요·쿠츨루크의 찬탈과 오트라르 사건·고창 위구르와 카를루크의 몽골 복속(1000~1218년, 뒤 절반).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 같은 일을 쪼개지 않고 작은 일은 큰 사건 안 한 문장으로 적었다. 항목이 없는 정권(오구즈·키르기스·티베트 밖의 소국·알리 테긴 가문 등)과 오아시스 도시는 글로만 다뤘다.
# 날짜: 출처 달력 그대로 적었다. 히즈라력은 쓰지 않았고, 확실하지 않은 날짜는 '무렵'으로, 학설이 갈리는 해는 범위나 한 구절로 적었다. 군주 재위는 위키백과 목록과 사료가 갈리는 곳이 있어 '목록에 따라'로 밝혔다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제를 따랐고, 서요는 첫 등장에서 '서요(카라 키타이)'로, 카라한 왕조·서카라한·동카라한·고창 위구르·이디쿠트·구르 왕조·호라즘샤로 적었다. 아랍의 정복·개종·반란 진압, 탈라스의 제지술 전설, 몽골·셀주크의 정복과 쿠츨루크의 무슬림 박해, 오트라르 사건처럼 민감한 내용은 일어난 일과 사료 사정만 적었고 숫자가 갈리면 범위로 적거나 싣지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(서돌궐의 분열, 현장의 인도 여행, 당의 서역 진출, 투르크 샤히와 아랍의 동진, 고선지의 탈라스 전투, 아바스 혁명, 야쿠브 이븐 알라이스, 사만 왕조의 호라산, 가즈니 왕조의 성립, 자야팔라의 힌두 샤히, 투그릴 베그와 셀주크, 알프 아르슬란과 말리크샤, 카트완 전투, 호라즘샤 왕조의 성장, 구르 왕조의 인도 진출, 알라 앗딘 무함마드 2세, 몽골의 호라즘 정복 등).
#   한국사와 닿는 점은 아프라시아브 벽화의 사절 가운데 고구려 사람으로 보는 견해와 요(거란)가 금에 무너지고 황족 야율대석이 서쪽으로 옮긴 일로 한정했다.

- id: oasis-states-600
  year: 600
  endYear: 640
  title:
    ko: "서돌궐 아래의 오아시스 나라들과 고창국(600~640)"
  summary:
    ko: "돌궐 카간국이 동서로 갈라지는 과정(「수의 이간책과 돌궐의 동서 분열: 사발략 카간에서 계민 카간까지(581~603)」(앞의 사건))에서 서쪽을 맡은 타르두가 603년에 죽자 서돌궐 카간국이 따로 섰다. 니리 카간을 거쳐 헤샤나(604~611)·시쿠이(611~618)·통엽호(618~628, 죽음을 630년으로 적는 글도 있다)가 카간에 올라 아무다리야 북쪽 소그디아나와 페르가나, 타림 분지 서부의 오아시스 나라들에 공물을 거두었다(통엽호 뒤는 「서돌궐의 분열과 소정방의 정복, 안서도호부의 구자 이전(628~659)」(뒤의 사건)). 통엽호는 아들을 토하리스탄의 야브구로 세웠다고 하며(625년 무렵), 에프탈 제후국들이 흩어져 있던 힌두쿠시 북쪽이 이때부터 토하리스탄 야브구국 아래 묶였다. 오아시스 나라들은 서돌궐에 복속하면서도 제 군주를 두었다. 사마르칸트는 이흐시드 칭호의 왕이 다스렸고 이름이 전하는 첫 왕은 시시피르(목록에 따라 재위 642~655)이며, 호라즘은 카트를 도읍으로 한 아프리그 왕조의 샤가 다스렸는데 600년 무렵의 아르사무흐 같은 이름만 전한다. 페르가나는 이흐시드 왕가, 우스루샤나는 아프신 가문이 맡았다. 카불과 간다라 쪽은 투르크 샤히의 땅이었다(「투르크 샤히와 아랍의 동진(665~745 무렵)」(뒤의 사건)). 동쪽 투루판 분지에는 국씨 왕가의 고창국이 있었다. 국문태(재위 623~640)는 서돌궐과 손잡고 당에 맞서면서도 629년 순례길의 현장을 정성껏 맞았고(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」(뒤의 사건)), 640년 당 태종이 보낸 후군집의 군대가 고창을 무너뜨려 그 땅이 서주가 되었다(「당의 서역 진출: 고창 멸망과 안서도호부, 구자 정복과 안서 4진(640~649)」(뒤의 사건)). 이 나라들의 상인과 종교 이야기는 「소그드 상인과 비단길의 종교·도시 문화(600~750 무렵)」(같은 해의 사건)에 있다."
  subjects: [western-turkic-khaganate, tokhara-yabghus, afrighid-dynasty, sogdian-city-states, ferghana-kingdom, ustrushana-afshins, qu-gaochang, tang]
  tags: [politics, society]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "M. S. Asimov and C. E. Bosworth, eds., History of Civilizations of Central Asia, vol. 4: The Age of Achievement, A.D. 750 to the End of the Fifteenth Century, Part One (UNESCO Publishing, 1998)"]

- id: sogdian-trade-culture-600
  year: 600
  endYear: 750
  title:
    ko: "소그드 상인과 비단길의 종교·도시 문화(600~750 무렵)"
  summary:
    ko: "사마르칸트·부하라·판자켄트 같은 소그디아나의 도시들은 7~8세기 비단길 교역의 중개를 맡았다. 소그드 상인은 중국의 비단과 서쪽의 은·향료·유리 같은 물건을 나르며 초원과 오아시스 사이를 이었고, 그들의 말인 소그드어는 상업어이자 외교어로 쓰였다. 중국 사서는 소그드 도시 출신을 도시 이름에서 딴 성(사마르칸트는 강, 부하라는 안, 타슈켄트는 석 따위)으로 불렀고, 안사의 난(755)을 일으킨 안녹산도 소그드 아버지와 튀르크 어머니 사이에서 났다고 전한다. 소그드 문자는 돌궐 사람들에게 퍼졌고 훗날 위구르도 소그드 문자와 마니교·불교를 받아들였다. 도시 안에는 조로아스터교 신전과 불교 사원이 있었고 마니교와 경교의 신자도 있었으며, 조로아스터교 신자들은 뼈를 추려 납골 용기에 담았다. 판자켄트 같은 곳의 집에는 신화와 서사시의 장면을 그린 벽화가 남아 있다. 도시에서는 은화를 찍어 썼고 그 가운데는 중국 동전을 본뜬 둥근 구멍 주화도 있었다. 소그드어 문서는 둔황과 투루판에서도 나왔다. 도시마다 왕이 따로 있어 하나의 나라를 이루지는 못했고, 서돌궐 카간국·당·아랍 사이에서 공물과 사절로 균형을 잡았다(정치 쪽은 「서돌궐 아래의 오아시스 나라들과 고창국(600~640)」(같은 해의 사건)). 판자켄트의 집과 신전터는 1946년 이후의 발굴로 알려졌다. 이 상인 공동체는 고향 밖에도 마을을 이루었으니, 장안과 고창국 등지의 소그드인 이야기는 「장안과 비단길: 소그드 상인, 경교·마니교·조로아스터교(635~845)」(뒤의 사건)에서 다룬다. 8세기 초 아랍의 정복이 닥친 뒤에도 소그드 상인의 교역망은 이어졌으나, 종교와 언어의 중심은 서서히 이슬람과 페르시아어 쪽으로 옮겨 갔다(「아랍의 호라산 진출과 아무다리야 너머의 첫 원정(651~704)」)."
  subjects: [sogdian-city-states, qu-gaochang, western-turkic-khaganate, tang]
  tags: [culture, economy, religion]
  sources: ["Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Étienne de la Vaissière et Éric Trombert 편, Les Sogdiens en Chine (École française d'Extrême-Orient, 2005)"]

- id: samarkand-afrasiab-650
  year: 650
  endYear: 670
  title:
    ko: "바르후만 왕의 사마르칸트와 아프라시아브 벽화(650~670 무렵)"
  summary:
    ko: "650년 무렵 사마르칸트의 왕은 이흐시드 칭호를 쓴 바르후만이었다. 중국 사서는 사마르칸트를 강국(康國)이라 하고 그를 불호만(拂呼縵)이라 적으며 당이 설치한 강거도독부의 도독으로 올렸고, 그 인정은 650~655년 무렵의 일로 전한다. 그의 재위는 목록마다 달라 655~696년으로 적기도 하고 650~670년 무렵으로 적기도 하는데, 여기서는 뒤를 따른다. 사마르칸트 북쪽 아프라시아브 언덕은 고대 마라칸다가 있던 터로, 1220년 몽골의 침입 뒤 사람들이 남쪽으로 옮겨 가 폐허가 되었다. 이 언덕의 한 저택에서 나온 '대사의 방' 벽화에는 바르후만을 알현하는 여러 나라의 사절이 그려져 있는데, 그림의 연대는 648~651년설, 655년 무렵설, 658년 뒤 장면설로 갈린다. 사절들 가운데 머리에 새 깃 두 개를 꽂은 사람들을 고구려 사람으로 보는 견해가 널리 알려졌으나 학설이 일치하지는 않는다. 같은 때 서돌궐 카간국은 마지막 카간 아시나 헤루(재위 651~658)에 이르렀다가 657년 당에 무너졌고(「서돌궐의 분열과 소정방의 정복, 안서도호부의 구자 이전(628~659)」(앞의 사건)), 아랍군은 651년 메르브를 차지해 아무다리야 가까이에 이르렀다(「아랍의 호라산 진출과 아무다리야 너머의 첫 원정(651~704)」). 소그디아나 도시 군주국의 군주는 시시피르(목록에 따라 642~655) 뒤 바르후만(650 무렵~670 무렵)과 우르크 바르트라무크를 거쳐 투카스파다크(696~698)·마스티크 우나시(698~700)·타르쿤(700~710)·구라크(710~738)·투르가르(738~755)로 이어졌다고 전하며, 사마르칸트는 이 사이 서돌궐에서 당으로, 다시 아랍으로 종주가 바뀌는 가운데 왕의 이름과 칭호를 지켰다."
  subjects: [sogdian-city-states, western-turkic-khaganate, tang]
  tags: [culture, politics, diplomacy]
  sources: ["Étienne de la Vaissière, Sogdian Traders: A History (Brill, 2005)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Boris Marshak, Legends, Tales, and Fables in the Art of Sogdiana (Bibliotheca Persica, 2002)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)"]

- id: arab-khorasan-651
  year: 651
  endYear: 704
  title:
    ko: "아랍의 호라산 진출과 아무다리야 너머의 첫 원정(651~704)"
  summary:
    ko: "651년 압둘라 이븐 아미르가 메르브를 차지하고 사산 왕조의 야즈데게르드 3세가 죽자 아랍군의 경계는 아무다리야에 닿았다(「니하반드 전투와 이란 정복, 야즈데게르드 3세의 죽음(642~651)」(앞의 사건)). 이듬해 아흐나프 이븐 카이스가 토하리스탄 야브구국의 땅에 쳐들어갔으나 아래쪽 토하리스탄 제후들이 힘을 모아 아랍군에 큰 피해를 입혔다. 656~661년 첫 내전 동안 원정은 끊겼다가 667~670년 알하캄 이븐 암르가 토하리스탄과 차가니얀까지 들어갔다. 671년 지야드 이븐 아비 수피얀이 호라산에 5만 가구로 전하는 아랍 전사와 가족을 정착시켜 이곳이 아랍 군대의 터전이 되었다. 673~674년 우바이둘라 이븐 지야드는 부하라를 쳐서 섭정 카툰에게서 막대한 공물을 받아 냈고, 676년 사이드 이븐 우스만이 사마르칸트와 티르미즈에서 이겼으며, 681년 살름 이븐 지야드는 샤시와 호라즘까지 닿아 공물을 매겼다. 683~692년 둘째 내전으로 정복이 다시 멈추자 호라산 총독 압둘라 이븐 하짐이 691년까지 호라산을 쥐었고, 이어 우마이야 이븐 압둘라(691~)가 696년 부하라에서 굴욕적인 화평을 맺었다. 702년 무합라브가 죽고 704년 우스만 이븐 마스우드가 티르미즈를 차지했다. 이 시기 아랍군의 원정은 약탈과 공물 징수가 중심이었다. 제후들은 군대가 이르면 공물을 내고 물러나면 다시 문을 닫는 일을 되풀이했고, 호라산에 주둔한 아랍 부족들 사이의 다툼도 원정을 자주 끊었다. 소그디아나 도시 군주국을 항구적으로 차지하는 정복은 705년 이후 쿠타이바 때 시작된다(「쿠타이바의 트란스옥시아나 정복과 데와슈티치의 항전(705~722)」). 사료는 아랍 쪽 기록이 대부분이라 제후국 쪽의 사정은 거의 전하지 않는다."
  subjects: [umayyad-caliphate, tokhara-yabghus, sogdian-city-states]
  tags: [war, politics]
  sources: ["H. A. R. Gibb, The Arab Conquests in Central Asia (Royal Asiatic Society, 1923)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "R. N. Frye, ed., The Cambridge History of Iran, vol. 4: The Period from the Arab Invasion to the Saljuqs (Cambridge University Press, 1975)", "Hugh Kennedy, The Great Arab Conquests (Weidenfeld & Nicolson, 2007)"]

- id: zunbil-kabul-680
  year: 680
  endYear: 870
  title:
    ko: "자불리스탄의 준빌 왕조와 아랍·사파르의 침공(680~870)"
  summary:
    ko: "카불의 투르크 샤히 왕의 형제나 친족이었던 루트빌(준빌)이 680년 무렵 자불리스탄에서 따로 왕이 되어 준빌 왕조가 열렸다(앞은 「투르크 샤히와 아랍의 동진(665~745 무렵)」(앞의 사건)). 준빌은 가즈니 둘레 힌두쿠시 남쪽의 산지를 거점으로 삼았고(714~715년 무렵의 가즈니 비문에 '가잔의 주인 알키스, 쿠라스의 아들'이 나오는데 준빌 가문으로 보나 확실하지 않다), 사산식 화폐를 본뜬 동전을 찍었으며, 카불의 투르크 샤히와는 때로 맞서고 때로 아랍에 함께 맞섰다. 우마이야 칼리프국 시스탄 총독의 원정은 늘 이곳에서 막혔다. 698년 우바이둘라 이븐 아비 바크라가 이끈 '파멸의 군대'는 준빌의 땅을 유린하려다 도리어 크게 패해 몸값과 인질을 내고 물러났다. 699년 이븐 알아시아스의 '공작의 군대'도 뒤이어 왔으나 내분으로 흩어졌고, 702~703년 무렵 준빌이 현물 공물을 바치기로 하고 아랍은 더 공격하지 않기로 하는 화의가 맺어졌다. 720년 당은 준빌 계통의 시기르(재위 738년 무렵까지로 전하는 중국 사료)를 인정했고, 726년과 727~728년 아랍의 원정이 되풀이되었는데 두 번째 원정에서 알아스파프의 군대가 크게 졌다. 769년 마안 이븐 자이다가 가즈니 부근에서 준빌을 이기고 공물을 되살렸으며, 815~822년 아바스 칼리프국의 알마문이 카불의 투르크 샤히를 꺾은 뒤에도 준빌은 큰 영향 없이 이어졌다. 870년 사파르 왕조의 야쿠브 이븐 알라이스가 시스탄에서 쳐들어와 가즈니를 포함한 준빌의 땅을 차지해 이 왕조는 끝났다(「야쿠브 이븐 알라이스와 사파르 왕조(861~902)」(뒤의 사건)). 준빌 왕이 이때 죽었는지는 사료가 확실하지 않다."
  subjects: [zunbils, turk-shahi, umayyad-caliphate, abbasid-caliphate, saffarid-dynasty, tang]
  tags: [politics, war]
  sources: ["C. Edmund Bosworth, Sistan under the Arabs: From the Islamic Conquest to the Rise of the Saffarids (Istituto Italiano per il Medio ed Estremo Oriente, 1968)", "C. Edmund Bosworth, ed., The Cambridge History of Iran, vol. 4 (Cambridge University Press, 1975)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: turgesh-khaganate-699
  year: 699
  endYear: 739
  title:
    ko: "투르기시 카간국: 오질·사갈·술루 카간과 아랍·당(699~739)"
  summary:
    ko: "투르기시는 서돌궐의 열 부족 가운데 한 갈래로, 수령 오질(재위 699~706)이 699년 서돌궐 계통을 아울러 홀로 서며 카간국이 열렸다. 중심지는 세미레치예의 수야브와 탈라스였고, 초원 전체를 다스린 것이 아니라 시르다리야 도시 띠와 이리 골짜기에 걸친 땅을 쥐었다. 오질의 아들 사갈(706~711)은 708~709년 쿠차를 공격해 당군을 꺾었다. 711~716년 사이는 목록에 비며 술루(재위 716~738, 선출을 714년으로 적기도 한다)가 카간이 되어 가장 이름을 떨쳤다. 술루는 우마이야 칼리프국과 싸우며 소그디아나 도시 군주국의 요청을 받았다(「쿠타이바의 트란스옥시아나 정복과 데와슈티치의 항전(705~722)」). 717년 아랍·토번과 함께 아크수와 우치투루판을 공격했다가 졌고, 721년 쿨 초르가 사마르칸트 부근에서 아랍군을 이겼으며, 724년 '갈증의 날'에 페르가나 원정에 실패한 호라산 총독 무슬림 이븐 사이드의 군대는 시르다리야 강가 호젠트 부근에서 술루의 기병에게 쫓기며 큰 피해를 입었고 잔군이 지휘권을 넘긴 채 사마르칸트로 돌아갔다. 728년 술루는 부하라를 차지했고, 731년 7월 협곡 전투에서 아랍군은 큰 피해를 입고 간신히 사마르칸트에 닿았으며(승패는 아랍 쪽의 '피로스의 승리'로 보는 글도 있다), 같은 해 가을 아랍군이 사마르칸트를 비운 뒤 투르기시도 물러났다. 아랍의 지배가 다시 사마르칸트까지 닿은 것은 739~741년 나스르 이븐 사야르 때다. 737년 12월 하리스탄 전투에서 아사드 이븐 압둘라 알카스리에게 연합이 크게 져 힘이 꺾였고, 술루는 이듬해 초 쿨 초르(바가 타르칸)가 꾸민 암살로 죽었다(당의 후원이 있었다고 본다). 술루의 아들 쿠트 초르(738~739)가 수야브에서 이었으나 739년 쿨 초르에게 져 당으로 보내졌고, 쿨 초르(739~744)가 카간이 되었다. 당은 자기 후보 아시나 셴을 밀었으나 쿨 초르가 이를 꺾고 인정을 받아 냈고, 742년 아시나 셴을 죽여 관계가 깨졌으며 744년 당 장군 부몽영찰에게 져 처형되었다(아랍 사료는 739년 처형으로 적기도 한다). 이후 카간국은 내분 속에 쇠퇴하여 766년 카를루크에게 넘어간다(「탈라스 뒤의 중앙아시아: 호라산·토하리스탄·투르기시의 끝(751~766)」)."
  subjects: [turgesh-khaganate, tang, umayyad-caliphate, sogdian-city-states, tibet]
  tags: [war, politics]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "H. A. R. Gibb, The Arab Conquests in Central Asia (Royal Asiatic Society, 1923)", "Peter B. Golden, An Introduction to the History of the Turkic Peoples (Harrassowitz, 1992)", "Denis Sinor, ed., The Cambridge History of Early Inner Asia (Cambridge University Press, 1990)"]

- id: arab-transoxiana-705
  year: 705
  endYear: 722
  title:
    ko: "쿠타이바의 트란스옥시아나 정복과 데와슈티치의 항전(705~722)"
  summary:
    ko: "705년 우마이야 칼리프국의 호라산 총독 쿠타이바 이븐 무슬림이 발흐를 되찾으면서 이 지역의 정복이 본격화했다. 차가니얀의 티시가 신하가 되었고 바드기스의 네자크도 항복했다. 706~709년 쿠타이바는 부하라를 놓고 싸워 부하라 왕 투그샤다의 땅을 와르다나의 와르단 후다트가 차지해 소그드 저항을 이끌었고, 바이칸드도 맞섰으나 꺾였다. 709년 부하라가 강습 끝에 함락되어 공물(20만 디르함)을 내게 되었고 쿠타이바는 투그샤다를 부하라 후다트로 되앉혔으며, 사마르칸트의 타르쿤도 공물을 바치는 신하가 되었다. 709~710년 네자크가 발흐와 아래쪽 토하리스탄을 이끌고 반란을 일으켰으나 진압되어 처형되고, 토하리스탄 야브구국의 야브구는 인질로 다마스쿠스에 보내졌다. 이후 야브구 가문은 바다크샨 쪽에서 버텼다. 710년 구라크가 타르쿤을 몰아내고 사마르칸트의 왕이 되었다가 712년 사마르칸트를 쿠타이바에 내주었고(사료에 따라 연대가 갈린다), 같은 해 호라즘에서는 아프리그 왕조 안의 내분을 틈탄 쿠타이바가 땅을 휩쓸어 아즈카주바르 2세가 죽었다. 713~715년 쿠타이바는 페르가나 골짜기로 갔고, 715년 아랍은 이흐시드를 몰아내고 알루타르를 세웠으나 당의 장효숭이 이흐시드를 되돌렸다. 715년 칼리프 교체 직후 쿠타이바는 그의 군대 안 반란으로 죽었다. 718년 구라크가 당에 도움을 청했으나 거절되었고, 720~722년 소그드 도시들이 투르기시 카간국과 손잡고 일어났으나 사이드 알하라시가 진압했다. 판자켄트의 군주 데와슈티치는 스스로 소그드 왕·사마르칸트 왕을 일컬으며 720년 반란을 이끌다 무그산 요새로 물러났으며, 722년 붙잡혀 처형되었다. 무그산에서 나온 소그드어 문서가 이 시기 도시 군주의 행정과 법을 전한다. 정복 이후 소그디아나 도시 군주국의 도시들은 곧바로 이슬람화하지 않았고, 개종은 몇 세기에 걸쳐 느리게 진행되었다."
  subjects: [tokhara-yabghus, sogdian-city-states, afrighid-dynasty, ferghana-kingdom, umayyad-caliphate, turgesh-khaganate, tang]
