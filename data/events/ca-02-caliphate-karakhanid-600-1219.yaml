- id: talas-aftermath-751
  year: 751
  endYear: 766
  title:
    ko: "탈라스 뒤의 중앙아시아: 호라산·토하리스탄·투르기시의 끝(751~766)"
  summary:
    ko: "아바스 혁명(「아바스 혁명과 우마이야 칼리프국의 몰락(747~750)」(앞의 사건))으로 호라산이 새 칼리프 가문의 근거지가 되었고, 아부 무슬림이 호라산을 쥐고 동쪽 일을 맡았다. 751년 7월 탈라스에서 아바스 군이 당군을 꺾자 당의 서쪽 진출은 멈추었다(「고선지의 서역 원정과 탈라스 전투(747~755)」(앞의 사건)). 이 싸움에서 카를루크 쪽이 당에서 갈라져 아바스 편에 섰다는 서술이 있다. 아바스 군은 지야드 이븐 살리흐가, 당군은 고선지가 이끌었다. 호라산을 쥐었던 아부 무슬림은 755년 무렵 칼리프 알만수르에게 죽임을 당했다. 이어 755년 안사의 난으로 당은 중앙아시아의 남은 군대를 거두어 갔다. 탈라스에서 잡힌 당 포로가 제지술을 전했다는 이야기는 후대 기록에 의존하는 전승이라 확정하기 어렵다. 사마르칸트의 마지막 이흐시드 투르가르(재위 738~755)는 755~757년 무렵 쫓겨난 것으로 보고, 아바스 혁명 뒤 소그드인이 이슬람으로 개종해야 했다는 서술이 있으나 사료로 확인하기 어렵다. 토하리스탄 야브구국은 아바스 칼리프국이 들어서고 호라산 총독이 힘을 더하는 가운데 758년 무렵 사라졌다. 북쪽 세미레치예에서는 투르기시 카간국이 텐그리 에르미시(753~755)와 아타 보일라 같은 카간 아래 흔들렸고, 766년 카를루크 부족들이 투르기시를 꺾고 수야브를 차지해 야브구를 우두머리로 한 카를루크 야브구국을 세웠다(앞은 「투르기시 카간국: 오질·사갈·술루 카간과 아랍·당(699~739)」(앞의 사건)). 카를루크는 이후 토번과 위구르 사이에서 움직였다(「토번의 타림 분지 진출과 위구르·카를루크(790~851)」(뒤의 사건))."
  subjects: [abbasid-caliphate, tang, tokhara-yabghus, turgesh-khaganate, karluk-yabgu-state]
  tags: [war, politics]
