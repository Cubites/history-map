- id: imjin-aftermath-1598
  year: 1598
  title:
    ko: 왜란의 영향
  summary:
    ko: "임진왜란으로 조선의 경지는 전쟁 전 약 170만 결에서 약 54만 결로 줄었고(『한국민족문화대백과사전』 '정유재란'은 경작지가 3분의 1로 줄었다고 요약한다) 인구도 크게 줄어 백성은 굶주림에 시달렸다. 경복궁·창덕궁·창경궁과 불국사 같은 사찰이 불탔고, 사고는 전주 사고만 남고 모두 불탔다(「실록 재간행과 5대 사고」). 노비문서가 없어지고 납속책이 시행되어 신분 질서가 흔들렸는데, 공명첩은 전쟁 중 군공을 세우거나 곡식을 바친 사람에게 대가로 주던 이름 없는 임명장에서 비롯되어 재정이나 군량이 모자랄 때 남발되었고 면역·면천용은 실제로 신분 상승의 효과가 있었다. 비변사는 1592년 전쟁 수행의 최고 기관이 되어 군정·민정·외교·재정 사무를 처리했고 전후에도 복구와 국방 재건을 위해 그대로 존속했으며, 인조 때 서인 정권이 비변사 제조당상을 겸임하며 정부 기구를 장악한 뒤 의정부는 유명무실해졌다(전쟁 중 비변사가 국정 전반을 다루게 되면서 의정부와 6조의 기능이 약해졌다고 보는 것이 통설이며, 비변사는 1864년 외교·국방·치안만 맡도록 줄었다가 1865년 폐지되었다). 일본으로 끌려간 피로인은 일본 학자가 2만~3만 명, 한국 학자가 10만~40만 명으로 크게 다르게 추산하며, 일본은 조선의 도공과 활자, 『퇴계집』 같은 서적을 가져가 도자기 산업과 문화를 발전시켰다. 뒤에 돌아온 사람은 쓰시마 사절 768명, 탐적사·회답 겸 쇄환사 4,885명, 통신사 14명으로 합계 5,667명이어서 6천 명을 넘지 않는다. 명은 대규모 원병으로 재정이 어지러워지고 그 틈에 여진이 성장해 명청 교체의 계기가 되었으며, 일본에서는 봉건 제후의 세력이 약해져 도쿠가와가 국내 정복을 쉽게 이룰 수 있었다. 전쟁 중 일어난 반란은 「송유진·이몽학의 난」이, 전후의 공신 책봉은 「선무·호성·청난 공신 책봉」이 다룬다."
  subjects: [joseon, japan, ming]
  links:
    - { from: joseon, to: japan, note: "도공·활자·서적 약탈, 성리학 전래" }
