- id: naseon-1654
  year: 1654
  endYear: 1658
  title:
    ko: 나선 정벌
  summary:
    ko: 청의 요청으로 조총 부대를 보내 흑룡강 일대에 내려온 러시아군과 싸웠다(1654·1658). 북벌을 위해 기른 군사력이 쓰인 사례이다.
  subjects: [joseon, qing, russia-tsardom]
  links:
    - { from: qing, to: joseon, note: "원병 요청" }
    - { from: joseon, to: qing, note: "조총 부대 파견" }
  tags: [war]
  sources: ["『효종실록』 효종 5년·9년", "신류, 『북정일기』"]
  places: [{ name: "1차 나선 정벌 (1654)", at: [129.9, 46.4] }, { name: "2차 나선 정벌 (1658)", at: [132.5, 47.9] }]

- id: yesong-1659
  year: 1659
  endYear: 1674
  title:
    ko: 예송 논쟁
  summary:
    ko: 효종과 효종 비가 죽었을 때 자의 대비가 상복을 얼마 동안 입을지를 두고 서인과 남인이 맞섰다. 기해예송(1659)에서는 서인이, 갑인예송(1674)에서는 남인이 이겼다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『현종실록』 현종 즉위년", "『현종실록』 현종 15년"]

- id: sanfan-taiwan-1673
  year: 1673
  endYear: 1683
  title:
    ko: 삼번의 난과 청의 타이완 정복
  summary:
    ko: "청 강희제가 번(藩)을 거두려 하자 오삼계 등 삼번이 반란을 일으켜(1673~1681) 한때 청의 남쪽이 크게 흔들렸다. 청은 이를 진압한 뒤 1683년 정성공의 후손이 다스리던 타이완을 항복시켰다(지도는 1683년부터 타이완을 청의 땅으로 그린다). 조선에서는 현종 말·숙종 초 청의 내란 소식이 전해지자 윤휴 등이 북벌을 다시 주장했으나(1674~1676), 1680년 경신환국으로 윤휴가 사사되며 힘을 잃었다."
  subjects: [qing, joseon]
  links:
    - { from: qing, to: joseon, note: "청의 내란, 북벌론 재론" }
  tags: [war, politics]
  sources: ["『청사고』 성조본기", "『숙종실록』"]

- id: sangpyeong-tongbo-1678
  year: 1678
  title:
    ko: 상평통보 전국 유통
  summary:
    ko: 상평통보를 법화로 정해 전국에 유통했다. 상품 화폐 경제가 발달하면서 동전이 널리 쓰였으나, 돈을 쌓아 두는 전황이 나타나기도 했다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『숙종실록』 숙종 4년"]

- id: hwanguk-1680
  year: 1680
  endYear: 1694
  title:
    ko: 숙종의 환국
  summary:
    ko: 숙종이 집권 붕당을 한꺼번에 바꾸는 환국을 되풀이했다. 경신환국(1680)으로 서인이, 기사환국(1689)으로 남인이, 갑술환국(1694)으로 다시 서인이 집권했다. 서인은 노론과 소론으로 나뉘고 일당 전제화가 나타났다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『숙종실록』 숙종 6년·15년·20년"]

- id: ogunyeong-1682
  year: 1682
  title:
    ko: 5군영 체제 완성
  summary:
    ko: "금위영이 설치되면서 훈련도감, 어영청, 총융청, 수어청과 함께 5군영 체제가 완성되었다. 훈련도감은 선조 때, 어영청·총융청·수어청은 인조 때 세워졌으며, 총융청은 경기 일대를, 수어청은 남한산성을 중심으로 수도 외곽을 지켰다."
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『숙종실록』 숙종 8년"]

- id: an-yongbok-1693
  year: 1693
  endYear: 1696
  title:
    ko: 안용복의 활동과 울릉도·독도
  summary:
    ko: 동래 어민 안용복이 울릉도에서 고기를 잡던 일본 어민과 다툰 뒤 일본에 건너가 울릉도와 독도가 조선 땅임을 주장했다. 1696년 에도 막부는 일본인의 울릉도 도해를 금지했다.
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "울릉도·독도 영유 주장" }
    - { from: japan, to: joseon, note: "울릉도 도해 금지" }
  tags: [diplomacy]
  sources: ["『숙종실록』 숙종 19년·22년"]

- id: qing-inner-asia-1691
  year: 1691
  endYear: 1724
  title:
    ko: 청의 외몽골·티베트·칭하이 복속
  summary:
    ko: "준가르의 갈단에게 밀린 외몽골(할하)의 부족들이 청에 의지하자 강희제는 1691년 돌론노르에서 회맹해 이들을 복속시켰고 1696~1697년 갈단을 물리쳤다. 1720년에는 청군이 준가르 세력을 몰아내고 라싸에 들어가 티베트를 영향 아래 두었으며, 옹정제 때인 1723~1724년 칭하이의 호쇼트부 롭상 단진의 반란을 진압해 칭하이를 병합했다(지도는 외몽골을 1691년, 티베트를 1720년, 칭하이를 1724년부터 청의 땅으로 그리고, 몽골 부족 항목은 1723년에 끝난다). 청은 러시아와 네르친스크 조약(1689)으로, 조선과는 백두산정계비(1712,)로 국경을 정리했다."
  subjects: [qing, mongols, russia-tsardom, joseon]
  links:
    - { from: qing, to: mongols, note: "외몽골·칭하이 복속" }
    - { from: qing, to: joseon, note: "국경 정리(1712)" }
  tags: [war, politics]
  sources: ["『청사고』 성조본기·세종본기", "『숙종실록』 숙종 38년"]

- id: daedongbeop-nationwide-1708
  year: 1708
  title:
    ko: 대동법 전국 확대
  summary:
    ko: "황해도에까지 대동법(황해도에서는 상정법이라는 이름으로 시행)을 시행하면서, 경기도에서 시작한 지 100년 만에 평안도·함경도·제주도를 뺀 전국에 대동법이 적용되었다. 앞서 효종 때 김육의 건의로 충청도(1651)와 전라도 해안 지역(1658)으로 확대되었다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『숙종실록』 숙종 34년"]

- id: baekdusan-stele-1712
  year: 1712
  title:
    ko: 백두산정계비 건립
  summary:
    ko: 조선과 청이 국경을 정하고 백두산에 정계비를 세웠다. 비문의 "서쪽은 압록, 동쪽은 토문"에서 토문강의 해석을 두고 뒤에 간도 귀속 문제가 일어났다.
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "국경 확정 요구" }
    - { from: joseon, to: qing, note: "정계비 건립" }
  tags: [diplomacy]
  sources: ["『숙종실록』 숙종 38년"]

# ── 영조·정조의 탕평 정치 ───────────────────────────────

- id: yeongjo-tangpyeong-1725
  year: 1725
  endYear: 1742
  title:
    ko: 영조의 탕평책
  summary:
    ko: "영조가 탕평의 뜻을 밝히고 붕당의 근거지인 서원을 정리했다. 이조 전랑의 후임자 추천권을 없애고 성균관 앞에 탕평비를 세웠다(1742). 영조의 탕평은 붕당의 옳고 그름을 따지지 않고 온건한 인물을 고루 쓰는 완론 탕평으로, 탕평파를 키워 정국을 이끌고 붕당의 정신적 지주였던 산림의 존재를 인정하지 않았다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 1년", "『영조실록』 영조 18년"]

- id: yi-injwa-1728
  year: 1728
  title:
    ko: 이인좌의 난
  summary:
    ko: 정권에서 밀려난 소론 강경파와 남인 일부가 영조의 정통성을 부정하며 난을 일으켰다. 진압 뒤 영조는 탕평을 더욱 강조했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 4년"]

- id: sokdaejeon-1746
  year: 1746
  title:
    ko: 『속대전』 편찬
  summary:
    ko: 『경국대전』 이후 바뀐 법령을 정리한 『속대전』을 펴냈다. 영조는 가혹한 형벌을 줄이고 신문고를 다시 설치하는 등 민생을 살폈다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 22년"]

- id: gyunyeokbeop-1750
  year: 1750
  title:
    ko: 균역법 실시
  summary:
    ko: 1년에 군포 2필을 내던 것을 1필로 줄였다. 부족한 재정은 지주에게 토지 1결당 쌀 2두를 걷는 결작, 일부 상류층의 선무군관포, 어장세·선박세 등으로 메웠다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『영조실록』 영조 26년"]

- id: jeongseon-1751
  year: 1751
  title:
    ko: 정선의 「인왕제색도」와 진경산수화
  summary:
    ko: 정선이 우리 산천을 직접 보고 그린 진경산수화를 발전시켰다. 「인왕제색도」와 「금강전도」가 대표작이다.
  subjects: [joseon]
  tags: [culture]
  sources: ["정선, 「인왕제색도」 화제"]

- id: imo-hwabyeon-1762
  year: 1762
  title:
    ko: 사도 세자의 죽음 (임오화변)
  summary:
    ko: 영조가 세자인 사도 세자를 뒤주에 가두어 죽게 했다. 이 일을 두고 세자를 동정하는 시파와 영조의 처분을 옳다고 보는 벽파가 나뉘었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 38년", "혜경궁 홍씨, 『한중록』"]

- id: gyujanggak-1776
  year: 1776
  title:
    ko: 정조 즉위와 규장각 설치
  summary:
    ko: "정조가 즉위하자 규장각을 설치해 정책 연구와 학문 기관으로 삼았다. 박제가, 유득공 등 서얼 출신을 검서관으로 등용하고, 젊은 관리를 다시 교육하는 초계문신제를 실시했다(1781). 정조는 옳고 그름을 분명히 가리는 준론 탕평을 폈고, 수령이 향약을 직접 주관하게 해 지방 사족의 영향력을 줄였다. 『동문휘고』·『탁지지』·『무예도보통지』(1790) 등도 펴냈다."
  subjects: [joseon]
  tags: [politics, culture]
  sources: ["『정조실록』 정조 즉위년", "『정조실록』 정조 5년"]

- id: bak-jiwon-1780
  year: 1780
  title:
    ko: 박지원의 『열하일기』와 북학
  summary:
    ko: "박지원이 청에 다녀와 『열하일기』를 쓰고 수레와 선박의 이용, 화폐 유통을 주장했다. 박제가는 『북학의』(1778)에서 소비를 늘려 생산을 자극해야 한다고 했다. 청의 문물을 배우자는 이들을 북학파(중상학파)라 한다. 박지원은 「양반전」·「허생전」·「호질」 등 한문 소설로 양반의 무능과 위선을 풍자했으며, 정조는 이런 새로운 문체를 문제 삼아 옛 문체로 돌아가게 하는 문체반정을 폈다(1792)."
  subjects: [joseon, qing]
  links:
    - { from: joseon, to: qing, note: "연행 사신 수행" }
    - { from: qing, to: joseon, note: "청 문물 수용 (북학)" }
  tags: [culture]
  sources: ["박지원, 『열하일기』", "박제가, 『북학의』"]

- id: seohak-1784
  year: 1784
  title:
    ko: 이승훈의 세례와 천주교 전파
  summary:
    ko: 서학으로 들어온 천주교를 연구하던 남인 학자 중 이승훈이 베이징에서 세례를 받고 돌아와 신앙 공동체를 만들었다. 평등 사상과 제사 거부로 정부와 갈등했다.
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "베이징을 통한 천주교 전래" }
  tags: [culture, religion]
  sources: ["『정조실록』", "황사영, 『황사영 백서』"]

- id: daejeon-tongpyeon-1785
  year: 1785
  title:
    ko: 『대전통편』 편찬
  summary:
    ko: 『경국대전』과 『속대전』 등을 하나로 모아 법전 『대전통편』을 펴냈다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『정조실록』 정조 9년"]

- id: sinhae-1791
  year: 1791
  title:
    ko: 신해통공과 신해박해
  summary:
    ko: 육의전을 뺀 시전 상인의 금난전권을 없애 자유로운 상업 활동을 허용했다(신해통공). 같은 해 윤지충이 어머니 제사를 거부하고 신주를 불태운 일로 처형되었다(신해박해).
  subjects: [joseon]
  tags: [economy, religion]
  sources: ["『정조실록』 정조 15년"]

- id: jangyongyeong-1793
  year: 1793
  title:
    ko: 장용영 설치
  summary:
    ko: 정조가 국왕 친위 부대인 장용영을 만들어 군사적 기반을 강화했다. 한양에 내영, 수원 화성에 외영을 두었다.
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『정조실록』 정조 17년"]

- id: hwaseong-1794
  year: 1794
  endYear: 1796
  title:
    ko: 수원 화성 축조
  summary:
    ko: "정조가 아버지 사도 세자의 묘를 옮긴 수원에 화성을 쌓았다. 정약용이 설계하고 거중기를 이용해 공사 기간을 줄였으며, 공사 과정을 『화성성역의궤』에 기록했다. 1795년에는 어머니 혜경궁 홍씨의 회갑을 맞아 한강에 배다리를 놓고 화성에 행차했으며, 그 과정을 『원행을묘정리의궤』에 남겼다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『정조실록』 정조 18년·20년", "『화성성역의궤』"]

# ── 세도 정치와 사회 변동 ───────────────────────────────

- id: sedo-1800
  year: 1800
  title:
    ko: 순조 즉위와 세도 정치
  summary:
    ko: "정조가 죽고 어린 순조가 즉위하면서 안동 김씨 등 몇몇 외척 가문이 권력을 독점하는 세도 정치가 시작되었다. 비변사가 권력의 중심이 되고 매관매직과 삼정(전정·군정·환곡)의 문란이 심해졌다. 19세기 들어 서양의 이양선이 자주 나타나고 『정감록』 같은 예언 사상이 퍼지는 등 사회 불안이 커졌다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『순조실록』"]

- id: sinyu-1801
  year: 1801
  title:
    ko: 공노비 해방과 신유박해
  summary:
    ko: 중앙 관청의 공노비 6만 6천여 명을 해방했다. 같은 해 천주교를 크게 탄압해 이승훈 등이 처형되고 정약용이 유배되었으며, 황사영 백서 사건이 일어났다.
  subjects: [joseon]
  tags: [society, religion]
  sources: ["『순조실록』 순조 1년"]

- id: tongsinsa-last-1811
  year: 1811
  title:
    ko: 마지막 통신사 파견
  summary:
    ko: 1607년부터 12차례 에도 막부에 보낸 통신사가 쓰시마에서 국서를 주고받는 것으로 끝났다. 통신사는 일본에 조선의 문화를 전하는 역할을 했다.
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "통신사 파견 (쓰시마)" }
  tags: [diplomacy]
  sources: ["『순조실록』 순조 11년"]

- id: hong-gyeongnae-1811
  year: 1811
  endYear: 1812
  title:
    ko: 홍경래의 난
  summary:
    ko: 몰락 양반 홍경래가 서북 지역민에 대한 차별과 세도 정치에 반발해 평안도 가산에서 봉기했다. 영세 농민, 광산 노동자 등이 가담해 청천강 이북을 차지했으나 정주성에서 진압되었다.
  subjects: [joseon]
  tags: [society]
  sources: ["『순조실록』 순조 11년·12년"]

- id: jeong-yakyong-1818
  year: 1817
  endYear: 1818
  title:
    ko: 정약용의 『경세유표』와 『목민심서』
  summary:
    ko: "강진에 유배된 정약용이 행정 기구 개편을 다룬 『경세유표』와 지방관의 도리를 다룬 『목민심서』를 지었다. 마을 단위로 토지를 함께 경작하고 노동량에 따라 나누는 여전론을 주장했다. 유형원·이익과 함께 중농학파(경세치용)로 꼽힌다. 『경세유표』에서는 정전제를 현실에 맞게 적용하자는 정전론도 제시했으며, 형벌을 신중히 다루도록 한 『흠흠신서』와 홍역 치료서 『마과회통』도 지었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정약용, 『여유당전서』"]

- id: kim-jeonghui-1816
  year: 1816
  title:
    ko: 김정희의 북한산비 고증
  summary:
    ko: 김정희가 북한산비가 신라 진흥왕 순수비임을 밝혀내 『금석과안록』에 정리했다. 추사체를 만들고 「세한도」를 그렸다.
  subjects: [joseon]
  tags: [culture]
  sources: ["김정희, 『금석과안록』"]

- id: gihae-bakhae-1839
  year: 1839
  title:
    ko: 기해박해
  summary:
    ko: 천주교를 다시 탄압해 프랑스 선교사들과 많은 신자가 처형되었다. 1846년에는 첫 조선인 신부 김대건이 순교했다.
  subjects: [joseon, france]
  tags: [religion]
  sources: ["『헌종실록』 헌종 5년"]

- id: donghak-1860
  year: 1860
  title:
    ko: 최제우의 동학 창시
  summary:
    ko: 최제우가 유·불·선과 민간 신앙을 합쳐 동학을 만들었다. 시천주와 인내천의 평등 사상을 내세웠으나, 정부는 세상을 어지럽힌다는 죄로 최제우를 처형했다(1864). 2대 교주 최시형이 『동경대전』과 『용담유사』를 펴냈다.
  subjects: [joseon]
  tags: [religion]
  sources: ["『고종실록』 고종 1년", "『동경대전』"]

- id: daedong-yeojido-1861
  year: 1861
  title:
    ko: 김정호의 「대동여지도」
  summary:
    ko: "김정호가 산줄기와 물줄기를 자세히 그리고 10리마다 눈금을 표시한 「대동여지도」를 목판으로 펴냈다. 22첩으로 나누어 접을 수 있게 만들었다. 앞서 18세기에 정상기는 처음으로 100리 척을 사용해 거리를 정확하게 나타낸 「동국지도」를 만들었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["김정호, 「대동여지도」"]

- id: imsul-uprising-1862
  year: 1862
  title:
    ko: 임술 농민 봉기
  summary:
    ko: 경상 우병사 백낙신의 수탈에 맞서 유계춘 등이 진주에서 봉기했고, 삼남 지방을 중심으로 전국으로 퍼졌다. 정부는 박규수를 안핵사로 보내고 삼정이정청을 설치했으나 효과가 적었다.
  subjects: [joseon]
  tags: [society]
  sources: ["『철종실록』 철종 13년", "『임술록』"]

# ── 흥선 대원군과 양요 ─────────────────────────────────

- id: daewongun-1863
  year: 1863
  endYear: 1873
  title:
    ko: 흥선 대원군의 개혁
  summary:
    ko: "고종이 어린 나이로 즉위하자 아버지 흥선 대원군이 권력을 잡았다. 비변사를 사실상 폐지하고 의정부와 삼군부를 되살렸으며(1865), 『대전회통』을 펴냈다. 양반에게도 군포를 걷는 호포제와 사창제를 실시하고, 47곳만 남기고 서원을 정리했다(1871). 또 명 황제를 제사하던 만동묘를 철폐해(1865) 유생들의 거센 반발을 샀다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 2년·8년"]

- id: gyeongbokgung-1865
  year: 1865
  endYear: 1868
  title:
    ko: 경복궁 중건
  summary:
    ko: 흥선 대원군이 임진왜란 때 불탄 경복궁을 다시 지었다. 비용을 마련하려 원납전을 걷고 당백전을 발행해 물가가 크게 올랐고, 백성을 동원해 원성을 샀다.
  subjects: [joseon]
  tags: [politics, economy]
  sources: ["『고종실록』 고종 2년·5년"]

- id: general-sherman-1866
  year: 1866
  title:
    ko: 제너럴셔먼호 사건
  summary:
    ko: 미국 상선 제너럴셔먼호가 대동강을 거슬러 평양까지 와 통상을 요구하며 약탈하자, 평안 감사 박규수와 평양 관민이 배를 불태웠다.
  subjects: [joseon, usa]
  links:
