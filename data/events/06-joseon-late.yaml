  sources: ["『선조실록』 선조 40년", "『광해군일기』 광해군 1년", "『광해군일기』 광해군 5년 5월 8일", "한국학중앙연구원 『한국민족문화대백과사전』 '기유약조'", "한국학중앙연구원 『한국민족문화대백과사전』 '통신사'", "한국학중앙연구원 『한국민족문화대백과사전』 '사대교린'", "한국학중앙연구원 『한국민족문화대백과사전』 '임진왜란 피로인'", "한국학중앙연구원 『한국민족문화대백과사전』 '왜관무역'"]

- id: donguibogam-1610
  year: 1610
  endYear: 1613
  title:
    ko: 허준의 『동의보감』
  summary:
    ko: "1596년 조선 선조의 명으로 허준이 양예수·이명원·김응탁·정예남·정작과 함께 의서 편찬을 시작했으나, 이듬해 정유재란으로 작업이 중단되었다. 1601년 선조는 편찬을 허준에게 맡겼고 이때부터 허준의 단독 집필이 이루어졌다. 대백과는 이 가운데 양예수·이명원·김응탁·정예남을 어의로, 정작을 민간의 유의로 적는다. 허준은 1604년 호성공신 3등으로 양평군에 봉해졌으나 선조가 죽은 뒤 탄핵을 받아 관직을 빼앗기고 의주로 유배되었고, 1609년 유배에서 풀려났다. 대백과는 그가 유배 중에도 집필을 이어 책의 절반 이상을 썼다고 적는다. 광해군은 1610년 음력 8월 6일 양평군 허준이 『동의보감』을 완성하자 선왕이 명한 책이 자기 즉위 뒤에 이루어진 데 비감을 드러내며 숙마 한 필을 내리게 하고, 내의원에 국을 두어 속히 인출해 널리 나누라고 지시했다. 이정구가 서문을 쓴 것은 1611년이라 하며, 간행은 1613년 내의원이 개주갑인자 목활자로 처음 펴냈다고 대백과 개설은 적는다. 같은 항목의 서지사항은 훈련도감 활자 초간본(1611~1613)이라 적어 간행 방식의 서술이 갈린다. 책은 25권 25책으로, 목차 2권과 내용 23권을 내경·외형·잡병·탕액·침구의 5편(각 4·4·11·3·1권)으로 나누었다. 병을 고치기보다 예방과 양생을 강조했고, 국산 약재의 이름을 조선에서 쓰던 이름으로 한글 표기한 것이 특징이다. 허준은 대백과 본문에 1539~1615년으로 적혀 있는데, 같은 쪽의 미디어 설명은 1546년생이라 하여 출생 해가 갈린다. 『언해태산집요』·『신찬벽온방』·『벽역신방』 등 8종의 의서도 남겼다. 『동의보감』은 중국에서 30여 차례, 일본에서 두 차례 출간되었고 2009년 7월 유네스코 세계기록유산에 올랐다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『광해군일기』 광해군 2년·5년", "『광해군일기』 광해군 2년 8월 6일", "한국학중앙연구원 『한국민족문화대백과사전』 '동의보감'", "한국학중앙연구원 『한국민족문화대백과사전』 '허준'"]

- id: gyechuk-oksa-1613
  year: 1613
  endYear: 1614
  title:
    ko: 계축옥사와 영창 대군의 죽음
  summary:
    ko: "1613년 음력 3월 조선의 문경 새재에서 상인을 죽이고 은 수백 냥을 빼앗은 강도 사건이 일어났다. 잡힌 일당은 박응서·심우영·서양갑·박치의·박치인·이경준·허홍인 등 서얼 일곱 명으로, 이들을 칠서라 부른다. 박응서는 국문 중 영창 대군을 추대하고 인목 대비의 수렴청정을 이루려는 거사의 자금을 마련하려던 것이었다고 털어놓았는데, 대백과는 이 자백이 이이첨·김개 등 대북파가 시킨 것이라고 풀이한다. 이를 빌미로 영창 대군의 외조부이자 연흥부원군인 김제남이 사사되었고 그의 세 아들도 화를 입었다. 『광해군일기』는 1613년 음력 6월 1일 김제남이 사약을 받아 서소문 안에서 죽었다고 적는데, 대백과 '인조반정' 항목은 그 해를 1614년으로 적는다. 영창 대군은 서인으로 강등되어 강화도에 위리안치되었다가 이듬해인 1614년 강화 부사 정항에게 목숨을 잃었다. 영창 대군은 1606년에 태어난 선조의 아들 가운데 유일한 정비 소생이었고, 대백과는 여덟 살 안팎의 어린아이로 그린다. 『광해군일기』는 굶겨 죽였거나 뜨겁게 달군 온돌에서 죽였다고 적고, 『인조실록』은 별장 이정표가 음식에 잿물을 넣어 죽였다고 적어 기록이 갈린다. 이 옥사로 대북파가 정권을 완전히 장악했고, 허균도 계축옥사 뒤 이이첨에 가담해 대북에 참여했다(「허균의 처형과 『홍길동전』」(뒤의 사건)). 인목 대비는 아버지와 아들을 잃고 뒤에 폐위에 이르렀다(「인목 대비 폐위(폐모론)」(뒤의 사건)). 1623년 인조반정 뒤 이 옥사는 대북이 전권을 잡으려고 강도범 박응서를 이용해 역모를 꾸민 무옥으로 규정되었고, 영창 대군을 죽인 일은 반정을 일으킨 서인이 광해군을 몰아내는 명분의 하나가 되었다(「인조반정」(뒤의 사건))."
  subjects: [joseon]
  tags: [politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '계축옥사'", "한국학중앙연구원 『한국민족문화대백과사전』 '영창대군'", "한국학중앙연구원 『한국민족문화대백과사전』 '허균'", "한국학중앙연구원 『한국민족문화대백과사전』 '인조반정'", "『광해군일기』 광해군 5년 6월 1일"]

