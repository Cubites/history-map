- id: choryang-waegwan-1678
  year: 1678
  title:
    ko: 초량 왜관 이전
  summary:
    ko: "조선 후기에는 일본 사절의 상경이 금지되어 부산의 왜관이 외교와 무역의 중심이 되었다. 임진왜란 직후 국교를 회복하는 과정에서(「일본과 국교 재개 (기유약조)」(앞의 사건)) 절영도에 임시 왜관이 설치되었고, 한국민족문화대백과 '왜관'에 따르면 이전 왜관터가 부산진성 안에 들어 군사기밀 지역이 되자 1607년(선조 40) 두모포에 왜관을 세웠다(같은 사전의 '중구(부산광역시)' 항목은 두모포 왜관이 1609년(광해군 1)에 있었다고 적는다). 두모포 왜관은 1678년(숙종 4) 초량으로 옮기기 전까지 약 70년 동안 운영되었는데, 장소가 좁고 선창의 수심이 얕으며 남풍을 정면으로 받아 배를 대기에 마땅치 않아 일본 쪽이 설치 초기부터 이관을 요구했다. 1640년(인조 18)부터 1673년(현종 14) 초량 이관이 결정되기까지 30여 년 동안 모두 여덟 차례 교섭이 있었다. 신축 공사는 1675년(숙종 1)에 시작해 1678년 4월에 끝났고 규모는 약 33만㎡(10만 평)로 두모포 왜관의 약 10배였다. 용두산을 중심으로 동관과 서관으로 나뉘었으며, 용두산 기슭의 관수가는 왜관을 총괄하는 관수의 관저였고, 동관에는 외교 교섭을 맡은 재판의 재판가, 조선과의 무역을 맡은 대관의 대관가, 개시 대청과 동향사 등이, 서관에는 객관으로 쓰인 동대청·중대청·서대청이 있었다. 건축 자재는 대체로 조선에서 댔으나 일본식 세공이 필요한 동관과 서관의 세 대청 같은 건물은 쓰시마에서 가져왔고, 일본 쪽 생활 건물의 경비는 일본 쪽이 마련했다. 왜관에는 보통 400~500명, 많을 때는 1,000여 명의 쓰시마 출신 성인 남성이 가족 없이 머물렀으며 통행 범위가 제한되고 출입이 엄격히 통제되었으나 일본인과 조선인의 접촉은 빈번했다. 개항 뒤 초량 왜관이 있던 일대는 일본인의 전관 거류지와 조계지로 바뀌었다."
  subjects: [joseon, japan]
  tags: [diplomacy, economy]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '왜관'", "한국학중앙연구원 『한국민족문화대백과사전』 '중구(부산광역시)'"]

- id: hwanguk-1680
  year: 1680
  endYear: 1694
  title:
    ko: 숙종의 환국
  summary:
    ko: 숙종이 집권 붕당을 한꺼번에 바꾸는 환국을 되풀이했다. 경신환국(1680)으로 서인이, 기사환국(1689)으로 남인이, 갑술환국(1694)으로 다시 서인이 집권했다. 서인은 노론과 소론으로 나뉘고 일당 전제화가 나타났다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『숙종실록』 숙종 6년·15년·20년"]

- id: ogunyeong-1682
  year: 1682
  title:
    ko: 5군영 체제 완성
  summary:
    ko: "금위영이 설치되면서 훈련도감, 어영청, 총융청, 수어청과 함께 5군영 체제가 완성되었다. 훈련도감은 선조 때, 어영청·총융청·수어청은 인조 때 세워졌으며, 총융청은 경기 일대를, 수어청은 남한산성을 중심으로 수도 외곽을 지켰다."
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『숙종실록』 숙종 8년"]

- id: noron-soron-1683
  year: 1683
  title:
    ko: 서인의 노론·소론 분당
  summary:
    ko: "1680년 경신환국으로 서인이 집권한 뒤(「숙종의 환국」(앞의 사건)) 조선의 서인은 송시열의 노선을 굳게 따르는 쪽과 현실과 실무를 중시하는 쪽으로 갈렸다. 송시열은 윤증의 스승이었고 윤증의 아버지 윤선거와는 김장생 문하의 동문이었는데, 송시열이 윤선거의 묘문을 성의 없이 지었다는 불만 등으로 사이가 벌어졌다. 1681년(숙종 7) 윤증이 송시열을 비판하는 편지를 보내려다 그만둔 것이 신유의서이며, 이 내용이 송시열의 사위이자 윤증의 사촌인 윤박을 통해 밖으로 알려졌다. 1684년(숙종 10) 음력 4월 송시열의 제자 최신이 이 편지를 근거로 윤증을 스승을 배반한 죄로 고발하면서 사사로운 불화가 정치 분쟁으로 번졌다. 이 회니시비 속에서 서인은 송시열을 따르는 노론과 윤증을 영수로 추대한 소론으로 나뉘었는데, 서인이 노론과 소론으로 갈라선 시점은 자료에 따라 다르며 1680년대 전반의 일로 본다. 윤증의 편지 초안에는 송시열이 의리와 이익을 함께 행하고 왕도와 패도를 병용했다는 비판이 담겼고, 송시열은 윤선거가 병자호란 때 강화도에서 죽지 않은 일을 비난한 적이 있었다. 노론은 대명의리와 송시열의 노선을 지키며 남인에게 강경했고, 소론은 시세 변화와 실무를 중시해 주화론에 기울고 다른 붕당에도 포용적이었으며 윤증·박세당·남구만 등이 이 쪽에 속했다. 1711년(숙종 37) 『가례원류』를 간행하며 송시열의 제자 정호가 발문에서 윤증을 비난해 물의가 일자 숙종은 정호를 파직하고 그 발문을 쓰지 못하게 했다. 1716년(숙종 42) 7월 숙종은 송시열에게는 잘못이 없고 윤증에게 잘못이 있다고 판정하는 병신처분을 내려 윤증을 선정으로 대접하지 못하게 하고 정호의 발문을 다시 넣도록 했으며, 이로써 노론이 정국의 주도권을 독점하게 되었다. 두 당의 충돌은 경종 때 「신임옥사 (신임사화)」(뒤의 사건)로 이어졌다."
  subjects: [joseon]
  tags: [politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '회니시비'", "한국학중앙연구원 『한국민족문화대백과사전』 '병신처분'", "한국학중앙연구원 『한국민족문화대백과사전』 '소론'"]

- id: kim-manjung-1687
  year: 1687
  endYear: 1692
  title:
    ko: 김만중의 유배와 『구운몽』·『사씨남정기』
  summary:
    ko: "조선의 문신 김만중은 1637년(인조 15) 아버지 김익겸이 정축호란 때 강화도에서 순절한 해에 유복자로 태어났고, 1665년 문과에 급제해 1686년 대제학이 되었다. 1687년(숙종 13) 장숙의 일가를 둘러싼 언사 사건에 연루되어 의금부에서 추국을 받고 하옥된 뒤 선천으로 유배되었다. 1688년 11월 풀려났으나 1689년 2월(대백과 본문 주석이 인용한 『숙종실록』은 윤3월 7일) 논핵으로 극변에 안치되었다가 곧 남해에 위리안치되었는데, 대백과는 그 사유를 인현 왕후 민씨와 관련된 앙화가 남아 있었기 때문이라고 설명하며 이 해는 「숙종의 환국」(앞의 사건)이 다루는 기사환국과 같은 해이다. 그는 1692년(숙종 18) 남해의 유배지에서 죽었고 1698년 관작이 회복되었다. 『구운몽』은 육관대사의 제자 성진이 팔선녀를 만나 속세의 부귀공명을 바라다 양소유로 태어나 높은 벼슬과 여러 여인과의 혼인으로 부귀를 누리다가 꿈에서 깨어나는 이야기이며, 어머니를 위로하려 귀양지에서 하룻밤 사이에 지었다는 이규경의 기록이 전한다. 창작 시기는 일본 천리대 소장 『서포연보』가 발견되면서 선천 유배기에 쓰기 시작해 남해 유배기에 완성했다고 추정하며, 주제는 유·불·선이 섞였다는 삼교 화합설과 『금강경』의 공사상이라는 설 등으로 갈리고 원작이 국문인지 한문인지도 학설이 나뉜다. 『사씨남정기』는 명나라를 배경으로 덕성을 갖춘 사정옥이 자식이 없자 남편 유연수에게 첩을 권하고, 들어온 교채란이 모함해 사씨를 쫓아내고 본처가 되었다가 유연수가 뒤늦게 잘못을 깨닫고 사씨를 되찾는 이야기로, 숙종이 인현 왕후를 내치고 희빈 장씨를 중전으로 세운 일이 배경이며 인현 왕후 폐출의 부당함을 깨우치려는 풍간소설이라는 평가가 있다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '김만중'", "한국학중앙연구원 『한국민족문화대백과사전』 '구운몽'", "한국학중앙연구원 『한국민족문화대백과사전』 '사씨남정기'"]

- id: an-yongbok-1693
