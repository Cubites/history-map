- id: jinju-1592
  year: 1592
  title:
    ko: 진주 대첩
  summary:
    ko: "1592년 음력 9월 24일 하세가와·나가오카 등이 이끈 일본군 약 2만 명이 김해를 떠나 진주로 향했고, 10월 5일부터 11일까지 7일 동안 진주성 싸움이 이어졌다. 진주 목사 김시민은 1578년 무과에 급제해 1591년 진주 판관으로 있다가 전쟁이 나자 전임 목사가 죽어 직무를 이어받았고, 성을 수리하고 군사를 조직하며 여러 차례 이겨 경상우도 병마절도사에 올랐다. 성을 지킨 조선군은 약 3,700명(『한국민족문화대백과사전』 '진주전투')에서 약 3,800명('김시민')으로 항목마다 값이 다르며, 곤양 군수 이광악의 약 100명이 보탰고 곽재우 의병 200여 명과 최경회·임계영의 구원병 약 2,000명도 합류했다. 일본군은 10월 8일 누대와 죽제를 세워 공격했으나 김시민이 물리쳤고, 10일 새벽 동문과 북문으로 몰려오는 사이 김시민이 이마에 탄환을 맞고 쓰러지자 이광악이 지휘를 이어받아 성을 지켰다. 김시민은 부상 며칠 뒤 숨졌고 1604년 선무공신 2등과 영의정으로 추증되었으며, 이 싸움은 일본군의 전라도 진출을 막은 것으로 평가되어 한산도 대첩·행주 대첩과 함께 임진왜란 3대첩으로 꼽힌다. 이듬해 2차 진주성 전투는 1593년 6월 20일부터 10일간 이어졌는데, 일본군은 전년의 패배를 갚으려 다시 대군으로 21일 진주성을 에워쌌고, 28일 큰비로 성벽이 무너지고 황진이 전사한 끝에 29일 일본군이 동문으로 들어와 백병전과 시가전이 벌어진 뒤 성이 함락되었다. 김천일·고종후·최경회는 촉석루 부근에서 자결했고 이종인·김준민 등은 전사했으며, 같은 항목은 성 안 주민을 6만~7만 명, 군사를 수천 명으로 적는다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "진주성 공격" }
  tags: [war]
  sources: ["『선조수정실록』 선조 25년", "한국학중앙연구원 『한국민족문화대백과사전』 '진주전투'", "한국학중앙연구원 『한국민족문화대백과사전』 '김시민'"]
