- id: hullyeon-dogam-1593
  year: 1593
  title:
    ko: 훈련도감 설치
  summary:
    ko: 유성룡의 건의로 포수·사수·살수의 삼수병으로 이루어진 훈련도감을 설치했다. 급료를 받는 직업 군인으로 구성되었다. 지방에는 양반부터 노비까지 편성한 속오군을 두었다.
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『선조실록』 선조 26년"]

- id: jeongyu-war-1597
  year: 1597
  endYear: 1598
  title:
    ko: 정유재란과 명량·노량 해전
  summary:
    ko: 휴전 협상이 깨지자 일본군이 다시 쳐들어왔다. 원균이 칠천량에서 패하자(7월) 일본군은 전라도를 거쳐 충청도 직산까지 올라왔으나 막혔고(9월), 다시 기용된 이순신이 13척으로 명량에서 승리했다(9월). 일본군은 순천·사천·울산 등 남해안과 동남 해안의 왜성으로 물러나 버텼다(지도는 1597년부터 일본군 점령지를 전라도 남해안의 순천까지 넓혀 그린다). 1598년 히데요시가 죽자 일본군이 물러났고, 이순신은 노량 해전에서 전사했다.
  subjects: [joseon, japan, ming, imjin-occupied]
  links:
    - { from: japan, to: joseon, note: "재침략" }
    - { from: joseon, to: japan, note: "명량·노량 해전" }
    - { from: ming, to: joseon, note: "명 수군의 참전" }
  tags: [war]
  sources: ["『선조실록』 선조 30년·31년", "이순신, 『난중일기』"]
  front: { war: imjin-war, date: 1597-09-16 }

- id: imjin-aftermath-1598
  year: 1598
  title:
    ko: 왜란의 영향
  summary:
    ko: "인구와 농경지가 크게 줄고 불국사, 경복궁, 사고 등이 불탔다. 재정을 메우려 공명첩을 팔아 신분제가 흔들렸다. 일본은 조선의 도공과 활자, 서적을 가져가 문화가 발전했고, 명은 국력이 약해져 여진이 성장하는 계기가 되었다. 전쟁 중 비변사가 군사뿐 아니라 국정 전반을 다루는 최고 기구가 되면서 의정부와 6조의 기능이 약해졌다."
  subjects: [joseon, japan, ming]
  links:
    - { from: joseon, to: japan, note: "도공·활자·서적 약탈, 성리학 전래" }
  tags: [society]
  sources: ["『선조실록』", "유성룡, 『징비록』"]

# ── 광해군과 호란 ───────────────────────────────────────

- id: daedongbeop-1608
  year: 1608
  title:
    ko: 대동법 실시 (경기도)
  summary:
    ko: "이원익의 건의로 공납을 특산물 대신 토지 1결당 쌀 16두(봄·가을 각 8두)로 거두는 대동법을 경기도에 처음 실시하고 선혜청을 두었다. 징수액은 대동법이 여러 도로 넓혀진 뒤 1결당 12두로 정해졌다. 관청에 물품을 대는 공인이 등장했다. 16세기부터 관리와 상인이 공물을 대신 바치고 농민에게 몇 배의 값을 받아 내는 방납의 폐단이 심해져 농민이 떠돌게 되었다. 임진왜란 중에는 유성룡의 건의로 공물을 쌀로 거두는 작미법을 잠시 시행하기도 했다(1594)."
  subjects: [joseon]
  tags: [economy]
  sources: ["『광해군일기』 광해군 즉위년"]

