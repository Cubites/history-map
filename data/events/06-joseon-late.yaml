- id: balhaego-1784
  year: 1784
  title:
    ko: 유득공의 『발해고』
  summary:
    ko: 규장각 검서관 유득공이 『발해고』를 써서 발해를 우리 역사로 보고, 신라와 발해가 함께 있던 시기를 '남북국'이라 불렀다. 고대사 인식의 범위를 만주까지 넓혔다.
  subjects: [joseon]
  tags: [culture]
  sources: ["유득공, 『발해고』 서문"]

