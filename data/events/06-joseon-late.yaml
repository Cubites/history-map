  sources: ["『선조실록』 선조 25년", "이순신, 『난중일기』"]
  front: { war: imjin-war, date: 1592-07-08 }

- id: righteous-army-1592
  year: 1592
  title:
    ko: 의병과 승병의 활약
  summary:
    ko: 곽재우(홍의장군), 조헌, 고경명, 정문부 등이 향토 지리를 이용해 의병을 일으켰고, 휴정(서산 대사)과 유정(사명 대사)은 승병을 이끌었다.
  subjects: [joseon]
