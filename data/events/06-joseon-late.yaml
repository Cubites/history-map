- id: junggang-chaekmun-1646
  year: 1646
  endYear: 1700
  title:
    ko: 중강 개시와 책문 후시
  summary:
    ko: "압록강 가의 중강에서 열리던 개시는 임진왜란 때인 1593년(선조 26) 유성룡의 건의로 시작되었고, 밀무역 등의 폐단으로 한때 폐지되었다가 재개되기를 되풀이하다 명 예부의 자문에 따라 1613년(광해군 5) 1월 26일 완전히 폐지되었다(예전에는 1609년 혁파로 알려졌으나 최근 연구는 1613년으로 본다). 정묘호란과 병자호란을 거쳐 중원을 차지한 청은 1646년(인조 24) 자문을 보내 중강 개시를 다시 열라고 요구했고, 개시일은 음력 3월 15일·9월 15일에서 농번기를 고려해 2월 15일·8월 15일로 조정되었다. 다시 열 때 서울·개성·황해도·평안도의 상인 232명이 참여했고, 조선은 농사용 소·소금·종이·해삼·면포·사기 등을 내놓았으며 청 상인은 특히 소와 소금을 중시했다. 사상의 잠입과 수말·인삼 교역은 금지되었으나 잘 지켜지지 않았고, 교역이 부진해지자 사상이 정부 허가 없이 거래하는 중강 후시가 약 50여 년 성행했다. 한편 1660년(현종 1)께부터는 구련성과 봉황성 사이 사신이 오가는 길목의 책문에서도 후시가 열렸는데, 의주 상인인 만상이 중심이 되어 사신 행렬의 마부와 짐꾼으로 가장해 청의 비단·약재 같은 물품을 사 들였고 이 때문에 중강 후시의 교역량이 줄었다. 1700년(숙종 26) 중강 개시에 조선 상인이 나오지 않자 청이 중강 후시 문제를 제기했고 조선이 자문을 보내 후시를 중단하기로 했다(『만기요람』은 1700년, 최근 연구는 『동문휘고』에 근거해 1701년으로 본다). 중강 개시는 그 뒤에도 유지되어 1882년 무역 장정이 맺어지기 전까지 이어진 것으로 파악되며, 18세기 청과의 무역은 「사상의 성장과 청·일본과의 무역」(뒤의 사건)으로 이어진다."
  subjects: [joseon, qing]
  tags: [economy, diplomacy]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '중강개시'", "한국학중앙연구원 『한국민족문화대백과사전』 '중강후시'", "한국학중앙연구원 『한국민족문화대백과사전』 '책문무역'"]

