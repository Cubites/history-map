- id: righteous-army-1592
  year: 1592
  title:
    ko: 의병과 승병의 활약
  summary:
    ko: "임진왜란이 일어나 관군이 무너지자 성리학의 대의명분을 익힌 조선의 사대부와 유생이 앞장서 향토 지리를 이용해 의병을 일으켰고, 일본군이 요충지에만 주둔한 고을이 저항의 거점이 되었다. 곽재우는 1592년 음력 4월 22일 경상도 의령에서 거병해 홍의장군으로 불렸고, 5월 하순 정암진을 건너려던 일본군을 막아 경상우도를 지키고 호남 진출을 저지했다. 경상도에서는 고령의 김면, 합천의 정인홍, 영천의 권응수가, 전라도에서는 고경명·김천일·임계영이, 황해도에서는 이정암이, 함경도에서는 정문부가 대표적인 의병장이며, 이정암은 의병 자원자의 명단을 만들고 8개조 군율을 정했다. 고경명은 전라좌도 의병대장으로 추대되어 대부대를 이끌다 금산 싸움에서 전사했고, 조헌은 승병장 영규와 함께 청주성 수복에 공을 세운 뒤 8월 18일 금산에서 700여 명과 함께 전사했다(칠백의총). 승병은 휴정(서산 대사)이 일흔이 넘은 나이에 8도 16종 도총섭이 되어 평안도 법흥사에서 전국의 의승군 5,000명을 일으켰고, 영규는 공주 청련암에서 승병 800명을 모았으며, 유정(사명 대사)은 평양 수복 때 모란봉 전투에서, 처영은 행주 대첩에서 승병을 이끌었다. 조정이 자발적 의병을 공식 군대로 인정하고 의병장에게 직첩을 주면서 참여가 늘었고, 의병은 일본군의 후방을 흔들고 유격전으로 전의를 꺾었다. 1593년 1월 명에 알린 의병의 총수는 약 2만 2,600명으로 관군의 4분의 1 수준이었는데, 이는 활동이 가장 활발했던 1592년보다 줄어든 값이다. 전쟁이 길어지며 이름뿐인 의병이 늘자 조정은 의병을 점차 해체하거나 관군에 흡수했고, 정유재란 때는 의병보다 향병 모집을 중시해 복수의병군은 뚜렷한 전과 없이 흐지부지되었다."
  subjects: [joseon]
  links:
    - { from: joseon, to: japan, note: "의병의 항전" }
  tags: [war]
  sources: ["『선조실록』 선조 25년", "『선조수정실록』 선조 25년", "한국학중앙연구원 『한국민족문화대백과사전』 '의병'", "한국학중앙연구원 『한국민족문화대백과사전』 '곽재우'"]
