- id: jibong-yuseol-1614
  year: 1614
  title:
    ko: "이수광의 『지봉유설』"
  summary:
    ko: "명에 세 차례 사신으로 다녀온 이수광이 보고 들은 것을 바탕으로 『지봉유설』을 지었다. 천문·지리·역사·풍속 등을 항목별로 정리한 백과사전식 저술로, 마테오 리치의 『천주실의』와 유럽 여러 나라의 사정을 소개해 서양 문물을 알렸다. 실학의 선구적 저술로 꼽히며, 그가 죽은 뒤 아들들이 간행했다(1634)."
  subjects: [joseon, ming]
  links:
    - { from: ming, to: joseon, note: "사행을 통한 서양 지식 전래" }
  tags: [culture]
