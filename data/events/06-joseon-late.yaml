- id: jang-hansang-1694
  year: 1694
  title:
    ko: 장한상의 울릉도 수토와 수토제
  summary:
    ko: "1694년(숙종 20) 삼척영장 장한상이 울릉도 수토관으로 울릉도를 조사했다. 장한상은 1656년(효종 7)에 태어나 1724년(경종 4)에 세상을 떠났고, 재상 남구만이 숙종에게 울릉도에 대한 국가 차원의 조사를 건의한 데 따라 1694년 9월 울릉도로 떠나 10월에 돌아왔다. 한국민족문화대백과 '울릉도외도'는 이 조사가 안용복 사건이 알려지면서 진행되었다고 설명하는데, 안용복의 활동은 「안용복의 활동과 울릉도·독도」(앞의 사건)에 있다. 장한상의 대백과 항목은 조사한 섬의 크기·지형·물산이나 일본인의 흔적은 적지 않고, 이 수토 자료가 울릉도 역사 연구와 독도 영유권 수호에서 중요하다고만 평가한다. 장한상의 수토를 시작으로 조선 말까지 울릉도에 대한 정기적인 수토가 시행되었다. '울릉도외도' 항목은 1697년(숙종 23) 울릉도 안쪽과 주변 해안을 3년에 한 번씩 살피는 수토정책으로 바뀌었다고 적으며, 수토를 마치면 울릉도 지도와 토산물을 진상했다고 한다. 다만 이 사전은 3년이라는 주기가 실제로 얼마나 엄격히 지켜졌는지는 밝히지 않는다. 1711년(숙종 37)에는 수토를 맡은 삼척영장 박석창이 올린 울릉도 지도가 「울릉도도형」이라는 이름으로 전한다. 1881년(고종 18) 수토관이 울릉도에서 도벌하던 일본인 7명을 적발하자 울릉도가 다시 주목받았고, 이듬해 이규원이 검찰사로 파견되어 4월 30일부터 5월 10일까지 11일 동안 머물며 「울릉도내도」와 「울릉도외도」 두 장의 지도를 만들었는데, 일본인의 왕래를 살피고 지형과 주변 섬을 조사하는 임무를 띤 것이었다. 이전의 울릉도 지도에는 죽도 자리에 우산도가 그려져 있었으나 「울릉도외도」에는 죽도가 제 위치에 정확히 묘사되어 의미가 있다고 대백과는 설명한다."
  subjects: [joseon]
  tags: [politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '장한상'", "한국학중앙연구원 『한국민족문화대백과사전』 '울릉도외도'"]

- id: eulbyeong-famine-1695
  year: 1695
  endYear: 1696
  title:
    ko: 을병 대기근
  summary:
    ko: "조선에서 1695년(숙종 21)과 1696년에 대흉작이 이어진 을해·병자년의 대기근을 을병 대기근이라 한다. 『숙종실록』 숙종 21년 음력 8월 3일 기사는 흉년으로 인한 궁가의 절수 문제를 의논했다고 적고, 8일 기사에는 영돈녕부사 윤지완이 민진장을 진휼청 당상으로 삼기를 청한 일이 실려 있고, 10일 기사에서는 비변사가 흉년이 들었으니 각 도의 연병·첨정 등의 일을 정지하자고 청했다. 신편 한국사는 1693~1696년을 인구가 줄어든 시기의 하나로 꼽는다. 진휼청은 이해 8월 현종 2년(1661)과 11년(1670)의 예에 따라 다시 설치되었고, 당상과 낭청은 상평청의 당상과 낭관이 겸임했는데 이는 대동법과 주전을 시행하면서 상평청과 긴밀한 관계를 유지하지 않으면 진휼 자본을 확보하기 어려웠기 때문이다. 우리역사넷은 진휼 대책으로 동전을 대량 주조해 동전 값이 폭락했다고 설명한다. 1678~1697년 관에서 주조한 동전은 약 450만 냥이었고(「상평통보 전국 유통」(앞의 사건)), 1698년 이후 약 30여 년 동안 주전이 중단되었으며, 대량 주전 뒤 10년 이내에 농촌에서도 동전이 토지와 노비 거래의 중심 수단이 되었다. 박만정은 1696년 3월 7일부터 5월 12일까지 황해도 암행어사로 나가 백성의 참상과 재정 운영을 위한 동전 유통 실태를 살폈는데, 대백과 본문은 이를 65일간이라 적는다. 이 기근과 앞서의 「경신 대기근」(앞의 사건)을 거치며 양역 변통론이 거세져 숙종 30년(1704) 전후 중앙 군영을 개편하며 역총 35,000명을 줄였고, 균역법 시행 직전까지 역총을 줄이거나 고정하고 규정 밖의 역총을 찾아내는 정책이 이어졌다."
  subjects: [joseon]
  tags: [society, economy]
  sources: ["『숙종실록』 숙종 21년 8월 3일", "국사편찬위원회 『신편 한국사』 30", "한국학중앙연구원 『한국민족문화대백과사전』 '박만정'", "우리역사넷 『한국문화사』 '동전의 보급'"]

- id: jang-gilsan-1696
  year: 1696
  title:
    ko: 장길산과 이영창의 거사 고변
  summary:
    ko: "장길산은 숙종 때 활동한 도적의 우두머리로 생몰년은 알 수 없으며, 한국민족문화대백과는 광대 출신으로 광대놀이를 잘하고 용맹해 무리를 모아 우두머리가 되었다고 전한다. 처음 황해도 일대에서 활동하자 조정이 황해도감사 신엽을 보내 체포하려 했으나 일부 무리만 잡히고 본인은 달아났고, 1692년(숙종 18) 무렵에는 평안남도 양덕 일대에서 포도청 장교에게 포위되었으나 놓쳐 양덕 현감이 파직되었다. 그 뒤 함경도 두만강 어귀의 서수라로 옮겨 활동한 것으로 보이며, 1696년 무렵에는 서수라와 벽동 등지에서 세력을 거느리고 말 장수를 가장하거나 운산의 군기를 빼앗았다고 한다. 대백과는 1696년 서얼 출신 이영창이 금강산 승려 운부, 장길산과 손잡고 승려 세력과 함께 봉기해 서울로 쳐들어갈 거사를 꾀한다는 역모가 고변되었다고 적는데, 『숙종실록』 숙종 23년(1697) 음력 1월 10일 기사는 이 사건의 처분(이절·유선기 등 복주, 이익화·장영우 등 귀양)을 적으며 이절과 유선기의 상변을 함께 풀어 쓴다. 이들은 이영창이 금강산에 머문 고령의 승려 운부를 거론하며 반란을 꾀했고 운부가 전국의 승려와 이어져 장길산의 무리와도 결탁했다고 진술했으며, 의형제를 맺고 진인을 내세워 나라를 세운다는 말을 했고 거사 날짜로 3월 21일이 거론되었다고 한다. 국청이 열려 여러 관련자가 형신 중 숨지고 송시한은 참형을 받았으며, 임금은 장길산을 오래 잡지 못한 극적이라 부르며 우려했고 국청의 건의에 따라 여러 도에 은밀히 정탐을 지시하고 군문과 포청에 후한 상을 내걸어 군사를 동원해 체포하기로 했다. 그러나 최종 처분에서는 고변한 이절과 유선기, 김경함이 오히려 복주되고 이익화와 장영우 등은 귀양을 갔으며 혜일 등은 풀려났다. 우리역사넷은 운부와 관련한 내용은 허위, 장길산과 관련한 내용은 과장으로 판명되었다고 설명하며 이 국청을 1697년의 일로 두는데, 대백과의 1696년은 고변 시점이라 단계가 다를 수 있다. 장길산은 끝내 체포되지 않았고, 숙종은 10년이 지나도록 잡지 못했다고 질책하며 각 관찰사와 병사에게 엄명을 내렸다. 이익의 『성호사설』은 장길산을 홍길동·임꺽정과 함께 조선의 3대 도둑으로 꼽았다."
  subjects: [joseon]
  tags: [society]
  sources: ["『숙종실록』 숙종 23년 1월 10일", "한국학중앙연구원 『한국민족문화대백과사전』 '장길산'", "국사편찬위원회 우리역사넷 『사료로 본 한국사』 '임꺽정과 장길산'"]

- id: seowon-ban-1703
  year: 1703
  endYear: 1714
  title:
    ko: 숙종의 서원 금령
  summary:
    ko: "조선의 서원은 중종~명종 때 19개소가 세워졌고 1550년 백운동서원이 사액서원의 효시가 되었으며, 선조 때에만 60여 개소가 세워져 현종 때까지 106년 동안 193개소가 설립되었다. 한국민족문화대백과 '서원'에 따르면 숙종 때는 서원 166개소(사액 105개소)가 건립되어 연평균 3.6개소로 앞 시기의 두 배를 넘었는데, 같은 사전의 '사액서원' 항목은 숙종 때 무려 131개소가 사액되는 남발 현상을 보였다고 적어 두 항목의 수치가 다르다. 사우는 1703년(숙종 29) 이후 서원 수를 넘어설 만큼 늘었다. 1703년 전라감사 민진원이 허가 없이 서원을 세운 지방관을 논죄하자고 상소했고 숙종이 이에 찬동하면서 서원 금령이 강제성을 띠게 되었다. 1707년(숙종 33)에는 원생 정원을 사액서원 20인, 비사액서원 15인으로 정했다. 1713년 말부터 1714년에 걸쳐 예조판서 민진후의 요청으로 1714년 이후의 첩설을 엄금하고 사액을 내리지 않기로 했으며, 1717~1719년에는 관찰사에게 1703년 금령 이후 세운 서원을 조사하게 했고 1719년부터는 숙종이 서원의 존폐를 하나씩 결정했다. 경상도에서는 훼철이 실제로 이루어졌으나 숙종이 죽으면서 중단되었다. 이 규제는 영조 17년(1741) 1714년 이후 세운 서원·사우·영당을 헐게 한 서원 철폐로 이어져 19개 서원을 포함해 모두 173개소가 훼철되었고, 그 뒤 서원의 첩설과 남설은 크게 둔화되었다. 대백과의 표는 전 시기에 세운 서원 417개소와 사우 492개소, 합계 909개소를 헤아리고, 1741년 무렵 서원과 사우 등을 합치면 1,000여 개소에 가깝다는 기록이 있다고 한다."
  subjects: [joseon]
  tags: [society, politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '서원'", "한국학중앙연구원 『한국민족문화대백과사전』 '사액서원'"]

- id: daebodan-1704
  year: 1704
  title:
    ko: 대보단 설치
  summary:
    ko: "1704년(숙종 30) 예조판서 민진후의 발의로 서울 창덕궁 후원의 옛 내빙고 터에 명 신종의 제사를 지내는 대보단이 설치되었다. 『숙종실록』은 숙종 30년 음력 12월 16일 기사에 대보단에서 악을 쓰는 일을 의논해 시행하게 했다고 적고, 12월 21일 기사에는 대보단이 준공되니 제사 지낼 때와 악의 사용, 단상의 장전 등을 의논했다고 적는다. 한국민족문화대백과 '대보단'에 따르면 공사는 1704년 9월 25일에 시작해 12월 24일에 끝났고 선공감 감역 김시택이 감독했으며, 호조를 비롯한 여섯 조의 당상이 돌아가며 지원하고 주로 5영의 군졸이 일했으며 일부는 민간에서 동원되었다. 한 변 150척(45m)의 정방형 담장 안에 한 변 25척(7.5m), 높이 5척(1.5m)의 단을 쌓고 계단 4개를 두었으며, 이름은 11월 24일 예문관이 정했다. 위판에는 대명신종이라 써 명의 국호를 밝혔다. 제사는 임금이 직접 지내는 것이 원칙이고 부득이하면 중신을 보내 대제를 지내게 했으며, 해마다 2월 상순에 날을 택해 한 번 지냈다. 팔일무 악을 쓰고 악장은 문묘의 악장을 썼으며 희생은 황우였다. 명이 망한 뒤 조선에서 명을 높이는 존명 의리와 소중화 의식이 강해졌다는 흐름(「명의 멸망과 청의 중국 지배」(앞의 사건)) 속에서 세워진 시설이다. 충청도 괴산 화양리의 만동묘는 송시열의 유명에 따라 권상하가 1703년 창건한 사당으로 명 신종과 의종의 신위를 모셨으며, 1865년(고종 2) 서울 대보단에서 명 황제를 제사하므로 개인 제사가 필요 없다는 이유로 철폐되었다. 대보단은 1884년 갑신정변 이후 제사가 중단되었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『숙종실록』 숙종 30년 12월 21일", "한국학중앙연구원 『한국민족문화대백과사전』 '대보단'", "한국학중앙연구원 『한국민족문화대백과사전』 '만동묘'"]

- id: daedongbeop-nationwide-1708
  year: 1708
  title:
    ko: 대동법 전국 확대
  summary:
    ko: "황해도에까지 대동법(황해도에서는 상정법이라는 이름으로 시행)을 시행하면서, 경기도에서 시작한 지 100년 만에 평안도·함경도·제주도를 뺀 전국에 대동법이 적용되었다. 앞서 효종 때 김육의 건의로 충청도(1651)와 전라도 해안 지역(1658)으로 확대되었다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『숙종실록』 숙종 34년"]

- id: bukhansanseong-1711
  year: 1711
  endYear: 1712
  title:
    ko: 북한산성 축조
  summary:
    ko: "조선의 북한산성은 임진왜란과 병자호란 이후 조정이 안정된 1711년(숙종 37)과 1712년(숙종 38)에 실질적으로 쌓았다. 『숙종실록』은 숙종 37년 음력 4월 5일 기사에 지평 유명함이 북한산의 축성을 논한 상소를 올렸다고 적고, 4월 29일 기사에는 북한 구관 당상 민진후의 관직을 삭탈해 문외 출송했다고 적는다. 대백과 '북한산성'은 1711년 4월 3일 고려 중흥산성을 수축하자는 신하들의 건의를 받아들여 공사를 시작했다고 하고, '북한치영' 항목은 이때 전국의 승려가 동원되어 성능이 감독했으며 9월에 마쳤다고 적는다. 그러나 '북한산성' 항목은 1712년 4월 숙종이 행차해 서문지 일대가 낮다고 보고 중성 축조를 지시했고 5월부터 총융청이 쌓았으며, 10월에 어영청과 금위영이 성랑·창고·문루·못·우물을 만드는 공사를 맡아 전체 축성이 마무리되었다고 적는다(「5군영 체제 완성」(앞의 사건)). 둘레는 1745년 『북한지』에 7,620보(21리 60보, 12.7km)로 적혀 있고, 성문은 14개소로 홍예식 성문 5개와 암문 9개를 합친 수이며, 장대는 동장대(금위영 관할)·남장대·북장대 세 곳이다. 축성 뒤 훈련도감·금위영·어영청이 감관을 보내 나누어 관리하다가, 산성 안에 비축한 군량미 5~6만 석을 보관하고 산성을 관리할 전담 관서가 필요하다는 의견에 따라 1712년 경리청이 설치되었다(대백과 '경리청'의 정보란은 1711년으로 적는다). 경리청에는 영의정이 겸하는 도제조 1인, 제조 1인, 낭청 1인, 현지의 북한관성장 1인, 파총 1인, 초관 5인을 두었고 1747년(영조 23) 총융청에 합속되었다. 1714년(숙종 40)에는 남한산성과 북한산성의 의승군 정원을 정하고 연 6차 교대로 입역하는 방번제를 시행해 북한산성의 방번승은 351인이었으며, 승군 병영으로 사찰 11개와 암자 2개가 쓰였다."
  subjects: [joseon]
  tags: [war, politics]
  sources: ["『숙종실록』 숙종 37년 4월 5일", "한국학중앙연구원 『한국민족문화대백과사전』 '북한산성'", "한국학중앙연구원 『한국민족문화대백과사전』 '경리청'", "한국학중앙연구원 『한국민족문화대백과사전』 '북한치영'"]

- id: sinmyo-tongsinsa-1711
  year: 1711
  title:
    ko: 신묘 통신사와 아라이 하쿠세키의 의례 개정
  summary:
    ko: "1709년 6월 6대 쇼군 도쿠가와 이에노부가 습직한 직후부터 아라이 하쿠세키가 외교 의례를 바꾸기 시작했는데, 쇼군의 권위를 높이고 천황에 준하는 제왕으로 세우려는 목적이었다고 설명한다. 『신편 한국사』에 따르면 막부는 쇼군의 외교 칭호를 인조 14년(1636) 병자 통신사 때부터 써 온 대군에서 일본국왕으로 되돌리도록 요구했고, 쇼군 후계자에게 보내던 예물을 중단했으며, 예조가 막부 로주에게 보내던 서계와 폐백을 중단했다. 막부 사자가 통신사의 객관을 찾더라도 통신사 일행이 계단 아래에서 맞고 보내도록 했고, 국휘 사용을 금지했으며 조선 국서를 정사에게 전달하게 하고 4배례를 요구했다. 이 변경은 조선과 사전 협의 없이 이루어졌다. 『숙종실록』은 1711년(숙종 37) 음력 5월 15일 기사에 통신사 정사 조태억, 부사 임수간, 종사관 이방언이 사폐했다고 적는다. 영의정 서종태 등 조정 일부는 대군호를 서로 이해하는 절차 없이 바꾸는 것은 조선을 지휘하려는 태도라며 엄중히 배척해야 한다고 주장했다. 숙종은 일본국왕이 무로마치 막부 시기에도 쓰던 옛 칭호이므로 굳이 문제 삼을 필요가 없다고 보았고, 처음에는 반대 의견이 많았으나 거절하면 일본과의 관계가 악화될 수 있다는 점과 제왕의 도를 명분으로 요구를 받아들였다. 이에 국서를 다시 지어 부산에서 대기하던 통신사에게 급히 전했다. 조태억 등은 귀국한 뒤 국체를 손상했다는 이유로 삭탈 관작 등의 처벌을 받았고, 일본 안에서도 아메노모리 호슈 등 명분론자가 칭호를 되돌린 일을 강하게 비판했다. 1719년(숙종 45) 8대 쇼군 도쿠가와 요시무네의 습직을 축하한 통신사 때는 옛 의례대로 빙례를 치렀다(「마지막 통신사 파견」(뒤의 사건))."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "쇼군 칭호 복원 등 의례 개정 요구" }
  tags: [diplomacy]
  sources: ["『숙종실록』 숙종 37년 5월 15일", "국사편찬위원회 『신편 한국사』 32"]

- id: baekdusan-stele-1712
  year: 1712
  title:
    ko: 백두산정계비 건립
  summary:
    ko: 조선과 청이 국경을 정하고 백두산에 정계비를 세웠다. 비문의 "서쪽은 압록, 동쪽은 토문"에서 토문강의 해석을 두고 뒤에 간도 귀속 문제가 일어났다.
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "국경 확정 요구" }
    - { from: joseon, to: qing, note: "정계비 건립" }
  tags: [diplomacy]
  sources: ["『숙종실록』 숙종 38년"]

- id: gyeongja-yangjeon-1720
  year: 1720
  title:
    ko: 삼남 경자양전과 경자양안
  summary:
    ko: "조선은 원칙적으로 20년마다 전국 양전을 실시해 군현 단위로 양안을 만들고 호조와 해당 도·읍에 한 부씩 보관하게 했지만, 호적이 3년마다 꾸준히 작성된 것과 달리 양전은 비용과 이해관계의 충돌 때문에 전국적으로 수십 년, 때로는 100여 년에 한 번꼴로 이루어졌다. 한국민족문화대백과 '양전'에 따르면 1634년(인조 12) 삼남 양전(「삼남 갑술양전」(앞의 사건)) 뒤 1663년(현종 4) 경기도, 1665년 함경도, 1669년 충청도 20읍과 황해도 4읍, 1701년(숙종 27) 황해도 3읍, 1709년 강원도 16읍에서 양전이 이루어졌고, 1719년과 이듬해 삼남 양전이 실시되었다. 『숙종실록』 숙종 46년(1720) 음력 1월 2일 기사에는 양전을 마치고 돌아온 전라도 균전사 김재로와 충청도 균전사 김운택이 세자에게 정안 작성과 송사 처리 같은 후속 절차를 아뢴 일이 실려 있다. 이 양전으로 만든 경자양안은 온전한 형태로 오늘날 전하는 가장 오래된 양안이다. 토지는 비옥도에 따라 6등급으로 나누고 결부법에 따라 등급별로 환산한 결부 수를 조세 부과의 기준으로 삼았다. 경자양안의 가경전은 앞의 갑술양안에 없던 땅, 곧 두 양전 사이 약 80여 년 동안 새로 개간된 땅을 가리키며 상단에 가(加) 자를 달아 구별했다. 새로 확보한 가경전에는 6등 최하 등급을 매기는 것을 기본 원칙으로 하되 비옥한 가경전은 주변 원전보다 1등을 낮추어 매겨 가경전을 최대한 많이 양안에 올리려 했고, 조선 후기 연구에서 가경전의 밭은 논의 2~3배에 이르는 경우가 많았다. 숙종 말년의 삼남 양전 뒤 영조 대 이후에는 전정 문란이 심한 지역에서만 미봉적인 양전이 수시로 이루어졌고 순조 때 세운 대대적 양전 계획은 대토지 소유자와 지방 권세가의 반대로 시행되지 못했으며, 전국 규모 양전은 1898년 대한제국의 광무양전에서야 다시 시작되었다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『숙종실록』 숙종 46년 1월 2일", "한국학중앙연구원 『한국민족문화대백과사전』 '양전'", "한국학중앙연구원 『한국민족문화대백과사전』 '양안'", "한국학중앙연구원 『한국민족문화대백과사전』 '가경전'"]

# ── 영조·정조의 탕평 정치 ───────────────────────────────

- id: yeongjo-tangpyeong-1725
  year: 1725
  endYear: 1742
  title:
    ko: 영조의 탕평책
  summary:
    ko: "영조가 탕평의 뜻을 밝히고 붕당의 근거지인 서원을 정리했다. 이조 전랑의 후임자 추천권을 없애고 성균관 앞에 탕평비를 세웠다(1742). 영조의 탕평은 붕당의 옳고 그름을 따지지 않고 온건한 인물을 고루 쓰는 완론 탕평으로, 탕평파를 키워 정국을 이끌고 붕당의 정신적 지주였던 산림의 존재를 인정하지 않았다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 1년", "『영조실록』 영조 18년"]

- id: yi-injwa-1728
  year: 1728
  title:
    ko: 이인좌의 난
  summary:
    ko: 정권에서 밀려난 소론 강경파와 남인 일부가 영조의 정통성을 부정하며 난을 일으켰다. 진압 뒤 영조는 탕평을 더욱 강조했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 4년"]

- id: sokdaejeon-1746
  year: 1746
  title:
    ko: 『속대전』 편찬
  summary:
    ko: 『경국대전』 이후 바뀐 법령을 정리한 『속대전』을 펴냈다. 영조는 가혹한 형벌을 줄이고 신문고를 다시 설치하는 등 민생을 살폈다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 22년"]

- id: gyunyeokbeop-1750
  year: 1750
  title:
    ko: 균역법 실시
  summary:
    ko: 1년에 군포 2필을 내던 것을 1필로 줄였다. 부족한 재정은 지주에게 토지 1결당 쌀 2두를 걷는 결작, 일부 상류층의 선무군관포, 어장세·선박세 등으로 메웠다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『영조실록』 영조 26년"]

- id: jeongseon-1751
  year: 1751
  title:
    ko: 정선의 「인왕제색도」와 진경산수화
  summary:
    ko: 정선이 우리 산천을 직접 보고 그린 진경산수화를 발전시켰다. 「인왕제색도」와 「금강전도」가 대표작이다.
  subjects: [joseon]
  tags: [culture]
  sources: ["정선, 「인왕제색도」 화제"]

- id: imo-hwabyeon-1762
  year: 1762
  title:
    ko: 사도 세자의 죽음 (임오화변)
  summary:
    ko: 영조가 세자인 사도 세자를 뒤주에 가두어 죽게 했다. 이 일을 두고 세자를 동정하는 시파와 영조의 처분을 옳다고 보는 벽파가 나뉘었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『영조실록』 영조 38년", "혜경궁 홍씨, 『한중록』"]

- id: gyujanggak-1776
  year: 1776
  title:
    ko: 정조 즉위와 규장각 설치
  summary:
    ko: "정조가 즉위하자 규장각을 설치해 정책 연구와 학문 기관으로 삼았다. 박제가, 유득공 등 서얼 출신을 검서관으로 등용하고, 젊은 관리를 다시 교육하는 초계문신제를 실시했다(1781). 정조는 옳고 그름을 분명히 가리는 준론 탕평을 폈고, 수령이 향약을 직접 주관하게 해 지방 사족의 영향력을 줄였다. 『동문휘고』·『탁지지』·『무예도보통지』(1790) 등도 펴냈다."
  subjects: [joseon]
  tags: [politics, culture]
  sources: ["『정조실록』 정조 즉위년", "『정조실록』 정조 5년"]

- id: bak-jiwon-1780
  year: 1780
  title:
    ko: 박지원의 『열하일기』와 북학
  summary:
    ko: "박지원이 청에 다녀와 『열하일기』를 쓰고 수레와 선박의 이용, 화폐 유통을 주장했다. 박제가는 『북학의』(1778)에서 소비를 늘려 생산을 자극해야 한다고 했다. 청의 문물을 배우자는 이들을 북학파(중상학파)라 한다. 박지원은 「양반전」·「허생전」·「호질」 등 한문 소설로 양반의 무능과 위선을 풍자했으며, 정조는 이런 새로운 문체를 문제 삼아 옛 문체로 돌아가게 하는 문체반정을 폈다(1792)."
  subjects: [joseon, qing]
  links:
    - { from: joseon, to: qing, note: "연행 사신 수행" }
    - { from: qing, to: joseon, note: "청 문물 수용 (북학)" }
  tags: [culture]
  sources: ["박지원, 『열하일기』", "박제가, 『북학의』"]

- id: seohak-1784
  year: 1784
  title:
    ko: 이승훈의 세례와 천주교 전파
  summary:
    ko: 서학으로 들어온 천주교를 연구하던 남인 학자 중 이승훈이 베이징에서 세례를 받고 돌아와 신앙 공동체를 만들었다. 평등 사상과 제사 거부로 정부와 갈등했다.
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "베이징을 통한 천주교 전래" }
  tags: [culture, religion]
  sources: ["『정조실록』", "황사영, 『황사영 백서』"]

- id: daejeon-tongpyeon-1785
  year: 1785
  title:
    ko: 『대전통편』 편찬
  summary:
    ko: 『경국대전』과 『속대전』 등을 하나로 모아 법전 『대전통편』을 펴냈다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『정조실록』 정조 9년"]

- id: sinhae-1791
  year: 1791
  title:
    ko: 신해통공과 신해박해
  summary:
    ko: 육의전을 뺀 시전 상인의 금난전권을 없애 자유로운 상업 활동을 허용했다(신해통공). 같은 해 윤지충이 어머니 제사를 거부하고 신주를 불태운 일로 처형되었다(신해박해).
  subjects: [joseon]
  tags: [economy, religion]
  sources: ["『정조실록』 정조 15년"]

- id: jangyongyeong-1793
  year: 1793
  title:
    ko: 장용영 설치
  summary:
    ko: 정조가 국왕 친위 부대인 장용영을 만들어 군사적 기반을 강화했다. 한양에 내영, 수원 화성에 외영을 두었다.
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『정조실록』 정조 17년"]

- id: hwaseong-1794
  year: 1794
  endYear: 1796
  title:
    ko: 수원 화성 축조
  summary:
    ko: "정조가 아버지 사도 세자의 묘를 옮긴 수원에 화성을 쌓았다. 정약용이 설계하고 거중기를 이용해 공사 기간을 줄였으며, 공사 과정을 『화성성역의궤』에 기록했다. 1795년에는 어머니 혜경궁 홍씨의 회갑을 맞아 한강에 배다리를 놓고 화성에 행차했으며, 그 과정을 『원행을묘정리의궤』에 남겼다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『정조실록』 정조 18년·20년", "『화성성역의궤』"]

# ── 세도 정치와 사회 변동 ───────────────────────────────

- id: sedo-1800
  year: 1800
  title:
    ko: 순조 즉위와 세도 정치
  summary:
    ko: "정조가 죽고 어린 순조가 즉위하면서 안동 김씨 등 몇몇 외척 가문이 권력을 독점하는 세도 정치가 시작되었다. 비변사가 권력의 중심이 되고 매관매직과 삼정(전정·군정·환곡)의 문란이 심해졌다. 19세기 들어 서양의 이양선이 자주 나타나고 『정감록』 같은 예언 사상이 퍼지는 등 사회 불안이 커졌다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『순조실록』"]

- id: sinyu-1801
  year: 1801
  title:
    ko: 공노비 해방과 신유박해
  summary:
    ko: 중앙 관청의 공노비 6만 6천여 명을 해방했다. 같은 해 천주교를 크게 탄압해 이승훈 등이 처형되고 정약용이 유배되었으며, 황사영 백서 사건이 일어났다.
  subjects: [joseon]
  tags: [society, religion]
  sources: ["『순조실록』 순조 1년"]

- id: tongsinsa-last-1811
  year: 1811
  title:
    ko: 마지막 통신사 파견
  summary:
    ko: 1607년부터 12차례 에도 막부에 보낸 통신사가 쓰시마에서 국서를 주고받는 것으로 끝났다. 통신사는 일본에 조선의 문화를 전하는 역할을 했다.
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "통신사 파견 (쓰시마)" }
  tags: [diplomacy]
  sources: ["『순조실록』 순조 11년"]

- id: hong-gyeongnae-1811
  year: 1811
  endYear: 1812
  title:
    ko: 홍경래의 난
  summary:
    ko: 몰락 양반 홍경래가 서북 지역민에 대한 차별과 세도 정치에 반발해 평안도 가산에서 봉기했다. 영세 농민, 광산 노동자 등이 가담해 청천강 이북을 차지했으나 정주성에서 진압되었다.
  subjects: [joseon]
  tags: [society]
  sources: ["『순조실록』 순조 11년·12년"]

- id: jeong-yakyong-1818
  year: 1817
  endYear: 1818
  title:
    ko: 정약용의 『경세유표』와 『목민심서』
  summary:
    ko: "강진에 유배된 정약용이 행정 기구 개편을 다룬 『경세유표』와 지방관의 도리를 다룬 『목민심서』를 지었다. 마을 단위로 토지를 함께 경작하고 노동량에 따라 나누는 여전론을 주장했다. 유형원·이익과 함께 중농학파(경세치용)로 꼽힌다. 『경세유표』에서는 정전제를 현실에 맞게 적용하자는 정전론도 제시했으며, 형벌을 신중히 다루도록 한 『흠흠신서』와 홍역 치료서 『마과회통』도 지었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정약용, 『여유당전서』"]

- id: kim-jeonghui-1816
  year: 1816
  title:
    ko: 김정희의 북한산비 고증
  summary:
    ko: 김정희가 북한산비가 신라 진흥왕 순수비임을 밝혀내 『금석과안록』에 정리했다. 추사체를 만들고 「세한도」를 그렸다.
  subjects: [joseon]
  tags: [culture]
  sources: ["김정희, 『금석과안록』"]

- id: gihae-bakhae-1839
  year: 1839
  title:
    ko: 기해박해
  summary:
    ko: 천주교를 다시 탄압해 프랑스 선교사들과 많은 신자가 처형되었다. 1846년에는 첫 조선인 신부 김대건이 순교했다.
  subjects: [joseon, france]
  tags: [religion]
  sources: ["『헌종실록』 헌종 5년"]

- id: donghak-1860
  year: 1860
  title:
    ko: 최제우의 동학 창시
  summary:
    ko: 최제우가 유·불·선과 민간 신앙을 합쳐 동학을 만들었다. 시천주와 인내천의 평등 사상을 내세웠으나, 정부는 세상을 어지럽힌다는 죄로 최제우를 처형했다(1864). 2대 교주 최시형이 『동경대전』과 『용담유사』를 펴냈다.
  subjects: [joseon]
  tags: [religion]
  sources: ["『고종실록』 고종 1년", "『동경대전』"]

- id: daedong-yeojido-1861
  year: 1861
  title:
    ko: 김정호의 「대동여지도」
  summary:
    ko: "김정호가 산줄기와 물줄기를 자세히 그리고 10리마다 눈금을 표시한 「대동여지도」를 목판으로 펴냈다. 22첩으로 나누어 접을 수 있게 만들었다. 앞서 18세기에 정상기는 처음으로 100리 척을 사용해 거리를 정확하게 나타낸 「동국지도」를 만들었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["김정호, 「대동여지도」"]

- id: imsul-uprising-1862
  year: 1862
  title:
    ko: 임술 농민 봉기
  summary:
    ko: 경상 우병사 백낙신의 수탈에 맞서 유계춘 등이 진주에서 봉기했고, 삼남 지방을 중심으로 전국으로 퍼졌다. 정부는 박규수를 안핵사로 보내고 삼정이정청을 설치했으나 효과가 적었다.
  subjects: [joseon]
  tags: [society]
  sources: ["『철종실록』 철종 13년", "『임술록』"]

# ── 흥선 대원군과 양요 ─────────────────────────────────

- id: daewongun-1863
  year: 1863
  endYear: 1873
  title:
    ko: 흥선 대원군의 개혁
  summary:
    ko: "고종이 어린 나이로 즉위하자 아버지 흥선 대원군이 권력을 잡았다. 비변사를 사실상 폐지하고 의정부와 삼군부를 되살렸으며(1865), 『대전회통』을 펴냈다. 양반에게도 군포를 걷는 호포제와 사창제를 실시하고, 47곳만 남기고 서원을 정리했다(1871). 또 명 황제를 제사하던 만동묘를 철폐해(1865) 유생들의 거센 반발을 샀다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 2년·8년"]

- id: gyeongbokgung-1865
  year: 1865
  endYear: 1868
  title:
    ko: 경복궁 중건
  summary:
    ko: 흥선 대원군이 임진왜란 때 불탄 경복궁을 다시 지었다. 비용을 마련하려 원납전을 걷고 당백전을 발행해 물가가 크게 올랐고, 백성을 동원해 원성을 샀다.
  subjects: [joseon]
  tags: [politics, economy]
  sources: ["『고종실록』 고종 2년·5년"]

- id: general-sherman-1866
  year: 1866
  title:
    ko: 제너럴셔먼호 사건
  summary:
    ko: 미국 상선 제너럴셔먼호가 대동강을 거슬러 평양까지 와 통상을 요구하며 약탈하자, 평안 감사 박규수와 평양 관민이 배를 불태웠다.
  subjects: [joseon, usa]
  links:
    - { from: usa, to: joseon, note: "통상 요구와 약탈" }
    - { from: joseon, to: usa, note: "평양 관민이 배를 불태움" }
  tags: [diplomacy, war]
  sources: ["『고종실록』 고종 3년"]
  places: [{ name: "대동강 (평양)", at: [125.75, 39.02] }]

- id: byeongin-yangyo-1866
  year: 1866
  title:
    ko: 병인박해와 병인양요
  summary:
    ko: 대원군이 프랑스 선교사 9명과 천주교 신자 수천 명을 처형했다(병인박해). 이를 구실로 프랑스 함대가 강화도를 침공했으나 한성근(문수산성)과 양헌수(정족산성)가 물리쳤다. 프랑스군은 물러나며 외규장각 의궤 등을 약탈했다.
  subjects: [joseon, france]
  links:
    - { from: france, to: joseon, note: "강화도 침공, 외규장각 도서 약탈" }
    - { from: joseon, to: france, note: "문수산성·정족산성 항전" }
  tags: [war, religion]
  sources: ["『고종실록』 고종 3년"]
  places: [{ name: "문수산성", at: [126.55, 37.72] }, { name: "정족산성", at: [126.49, 37.63] }]

- id: oppert-1868
  year: 1868
  title:
    ko: 오페르트 도굴 사건
  summary:
    ko: 통상을 거부당한 독일 상인 오페르트가 흥선 대원군의 아버지 남연군의 묘를 도굴하려다 실패했다. 서양에 대한 반감이 더욱 커졌다.
  subjects: [joseon]
  tags: [diplomacy]
  sources: ["『고종실록』 고종 5년"]

- id: meiji-1868
  year: 1868
  endYear: 1869
  title:
    ko: 메이지 유신과 서계 문제
  summary:
    ko: "1868년 메이지 정부가 세워지고 보신 전쟁이 일어났다. 1869년 하코다테에서 막부 잔존 세력(에조 공화국)이 항복했고 일본은 에조치를 홋카이도로 고쳐 개척사를 두었다(지도는 1869년부터 홋카이도를 일본 땅으로 그린다). 새 정부는 쓰시마 번을 통해 조선에 왕정 복고를 알리는 서계를 보냈으나 조선은 격식이 옛 관례와 다르다며 받지 않았다(1868~1869). 이 서계 문제는 뒤에 정한론(1873)과 운요호 사건(1875,)으로 이어졌다."
  subjects: [japan, joseon]
  links:
    - { from: japan, to: joseon, note: "왕정 복고를 알리는 서계(1868)" }
    - { from: joseon, to: japan, note: "서계 접수 거부" }
  tags: [diplomacy, politics]
  sources: ["『고종실록』 고종 5년", "『일본외교문서』 제1권"]

- id: sinmi-yangyo-1871
  year: 1871
  title:
    ko: 신미양요와 척화비
  summary:
    ko: 미국이 제너럴셔먼호 사건을 구실로 강화도를 침공해 초지진과 광성보를 점령했다. 어재연이 광성보에서 싸우다 전사했으나 조선이 통상을 거부하자 미군은 물러났다. 대원군은 전국에 척화비를 세웠다.
  subjects: [joseon, usa]
  links:
    - { from: usa, to: joseon, note: "강화도 침공" }
    - { from: joseon, to: usa, note: "광성보 항전, 통상 거부" }
  tags: [war]
  sources: ["『고종실록』 고종 8년"]
  places: [{ name: "초지진", at: [126.54, 37.61] }, { name: "광성보", at: [126.52, 37.67] }]

- id: gojong-rule-1873
  year: 1873
  title:
    ko: 흥선 대원군 하야와 고종의 친정
  summary:
    ko: 최익현이 대원군의 정책을 비판하는 상소를 올린 것을 계기로 대원군이 물러나고 고종이 직접 정치를 맡았다. 민씨 세력이 정권을 잡았다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 10년"]

- id: unyo-1875
  year: 1875
  title:
    ko: 운요호 사건
  summary:
    ko: "일본 군함 운요호가 강화도 초지진에 접근해 포격전을 벌이고 영종도를 공격했다. 일본은 이를 구실로 조선에 개항을 요구했다. 앞서 흥선 대원군 정권이 메이지 정부의 외교 문서(서계)가 격식에 어긋난다며 받지 않자(1868), 일본에서는 조선을 정벌하자는 정한론이 일어났다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "강화도 무력 시위" }
  tags: [war, diplomacy]
  sources: ["『고종실록』 고종 12년"]
  places: [{ name: "초지진", at: [126.54, 37.61] }, { name: "영종진", at: [126.52, 37.47] }]

- id: ganghwa-treaty-1876
  year: 1876
  title:
    ko: 강화도 조약 (조일 수호 조규)
  summary:
    ko: "조선이 일본과 맺은 첫 근대적 조약이자 불평등 조약이다. 조선을 자주국으로 규정해 청의 간섭을 막으려 했고, 부산 외 2개 항구 개항, 해안 측량권, 치외 법권(영사 재판권)을 인정했다. 개항 이후의 역사는 7번 묶음에서 다룬다. 최익현은 일본과 서양이 다르지 않다는 왜양일체론을 내세워, 도끼를 지고 궁궐 앞에 엎드려 개항에 반대했다(지부복궐척화의소). 조약에 따라 부산(1876)에 이어 원산(1880)과 인천(1883)이 열렸다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "개항 강요, 불평등 조약" }
  tags: [diplomacy]
  sources: ["『고종실록』 고종 13년"]

# ── 한국사능력검정시험(심화) 빈출 주제 보충 (2026-09-28) ────────────────

- id: taengniji-1751
  year: 1751
  title:
    ko: 이중환의 『택리지』
  summary:
    ko: 이중환이 전국을 답사해 각 지역의 자연환경·인물·풍속·물산을 적고 살기 좋은 곳의 조건을 논한 인문 지리서 『택리지』를 썼다.
  subjects: [joseon]
  tags: [culture]
  sources: ["이중환, 『택리지』"]

- id: folk-culture-1750
  year: 1750
  precision: century
  title:
    ko: 서민 문화의 발달 (풍속화·판소리·한글 소설)
  summary:
    ko: 상공업이 발달하고 서민의 경제력이 커지면서 서민 문화가 꽃피었다. 김홍도는 서민의 일상을, 신윤복은 양반과 부녀자의 생활을 풍속화로 그렸다. 판소리와 탈춤이 유행했고, 「홍길동전」·「춘향전」 같은 한글 소설과 사설시조가 널리 읽혔다. 민화도 유행했다.
  subjects: [joseon]
  tags: [culture, society]
  sources: ["국립중앙박물관 『단원 풍속도첩』 해설", "간송미술관 『혜원 전신첩』 해설"]

- id: balhaego-1784
  year: 1784
  title:
    ko: 유득공의 『발해고』
  summary:
    ko: 규장각 검서관 유득공이 『발해고』를 써서 발해를 우리 역사로 보고, 신라와 발해가 함께 있던 시기를 '남북국'이라 불렀다. 고대사 인식의 범위를 만주까지 넓혔다.
  subjects: [joseon]
  tags: [culture]
  sources: ["유득공, 『발해고』 서문"]

# ── 한국사능력검정시험(심화) 빈출 주제 보충 2 (2026-09-29): 시대별 조사 뒤 반박 검증을 거친 항목 ──

- id: jibong-yuseol-1614
  year: 1614
  title:
    ko: "이수광의 『지봉유설』"
  summary:
    ko: "명에 세 차례 사신으로 다녀온 이수광이 보고 들은 것을 바탕으로 『지봉유설』을 지었다. 천문·지리·역사·풍속 등을 항목별로 정리한 백과사전식 저술로, 마테오 리치의 『천주실의』와 유럽 여러 나라의 사정을 소개해 서양 문물을 알렸다. 실학의 선구적 저술로 꼽히며, 그가 죽은 뒤 아들들이 간행했다(1634)."
  subjects: [joseon, ming]
  links:
    - { from: ming, to: joseon, note: "사행을 통한 서양 지식 전래" }
  tags: [culture]
  sources: ["이수광, 『지봉유설』", "한국학중앙연구원 『한국민족문화대백과사전』 '지봉유설'"]

- id: multistory-temples-1626
  year: 1626
  endYear: 1702
  title:
    ko: "법주사 팔상전·금산사 미륵전·화엄사 각황전"
  summary:
    ko: "왜란과 호란으로 불탄 사찰을 다시 지으면서 규모가 큰 다층 불전이 세워졌다. 보은 법주사 팔상전(1626 완공)은 현재 남아 있는 우리나라 유일의 목조 5층탑이고, 김제 금산사 미륵전(1635)은 겉으로는 3층이지만 안은 하나로 트인 구조이다. 구례 화엄사 각황전(1702)도 이 시기의 대표적인 중층 건물이다. 이런 큰 불전을 지을 수 있었던 것은 양반 지주층이 경제력을 갖추고 불교계의 사회적 위상도 높아졌기 때문으로 풀이된다."
  subjects: [joseon]
  tags: [culture]
  sources: ["국가유산청 국가유산포털 '보은 법주사 팔상전' 해설", "국가유산청 국가유산포털 '김제 금산사 미륵전' 해설", "국가유산청 국가유산포털 '구례 화엄사 각황전' 해설"]

- id: patrilineal-family-1650
  year: 1650
  precision: century
  title:
    ko: "부계 중심 가족 제도의 확립"
  summary:
    ko: "17세기 중엽 이후 성리학적 예법이 사회에 뿌리내리면서 부계 중심의 가족 제도가 굳어졌다. 혼인한 뒤 곧 남자 집에서 사는 친영 제도가 자리 잡고, 재산 상속에서 큰아들을 우대했으며, 제사도 형제가 돌아가며 지내던 방식에서 큰아들이 맡는 방식으로 바뀌었다. 아들이 없으면 양자를 들이는 일이 일반화되고 부계 위주로 족보가 만들어졌다. 딸도 재산을 고르게 나누어 받고 제사를 돌아가며 지내던 조선 전기와 크게 달라진 모습이다."
  subjects: [joseon]
  tags: [society]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 사회)", "한국학중앙연구원 『한국민족문화대백과사전』 '친영'"]

- id: siheonryeok-1653
  year: 1653
  title:
    ko: "시헌력 채택"
  summary:
    ko: "청이 서양 선교사 아담 샬 등의 천문 계산법을 받아들여 만든 시헌력을 조선도 도입해 1653년부터 썼다. 인조 때(1645) 관상감 제조 김육이 역법을 바꾸자고 건의한 것이 받아들여진 결과였다. 해와 달의 움직임을 더 정확히 계산할 수 있게 되어, 서양 과학 지식이 조선에 영향을 준 사례로 꼽힌다."
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "서양식 역법(시헌력) 전래" }
  tags: [culture]
  sources: ["『인조실록』 인조 23년", "『효종실록』 효종 4년"]

- id: nongga-jipseong-1655
  year: 1655
  title:
    ko: "『농가집성』 편찬과 모내기법 확산"
  summary:
    ko: "신속이 『농사직설』·『금양잡록』 등을 모아 보완한 『농가집성』을 펴내 모내기법(이앙법)의 보급을 도왔다. 모내기법이 널리 퍼지면서 김매기 노동이 줄어 한 사람이 넓은 땅을 경작하는 광작이 가능해졌고, 벼와 보리의 이모작도 늘었다. 인삼·담배·면화 같은 상품 작물을 재배해 소득을 올리는 농민이 나타났으며, 18세기에는 일정한 액수를 지대로 내는 도조법도 확산되었다."
  subjects: [joseon]
  tags: [economy]
  sources: ["신속, 『농가집성』", "국사편찬위원회 『신편 한국사』 (조선 후기의 경제)"]

- id: bangye-surok-1670
  year: 1670
  title:
    ko: "유형원의 『반계수록』"
  summary:
    ko: "전라도 부안에 은거하던 유형원이 나라 제도 전반의 개혁안을 담은 『반계수록』을 완성했다. 관리·선비·농민에게 신분에 따라 토지를 차등 있게 나누어 주는 균전론을 내세워 자영농을 키우고 조세와 군역을 바로잡으려 했다. 양반 문벌과 과거제, 노비 세습의 폐단을 비판했으나 신분제 자체를 없애자고 하지는 않았다. 중농학파(경세치용 학파)의 출발점으로 평가되며 영조 때 간행되었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["유형원, 『반계수록』", "한국학중앙연구원 『한국민족문화대백과사전』 '반계수록'"]

- id: sabyeonnok-1703
  year: 1703
  title:
    ko: "박세당의 『사변록』과 사문난적 논란"
  summary:
    ko: "송시열을 비롯한 서인(노론)은 주자의 학설을 절대적인 기준으로 삼아, 이와 다르게 경전을 풀이하는 학자를 유교의 도리를 어지럽히는 사문난적으로 몰았다. 남인 윤휴가 독자적인 경전 해석으로 비판받았고, 소론 박세당은 『사변록』에서 주자의 주석을 비판했다가 1703년 사문난적으로 몰려 관직을 빼앗겼다. 성리학의 교조화에 대한 이러한 비판은 양명학과 실학이 성장하는 토양이 되었다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『숙종실록』 숙종 29년", "박세당, 『사변록』"]

- id: jeong-jedu-1709
  year: 1709
  title:
    ko: "정제두와 강화학파 (양명학)"
  summary:
    ko: "소론 학자 정제두가 강화도로 옮겨 살며(1709) 양명학을 깊이 연구하고 제자를 길러 강화학파를 이루었다. 마음이 곧 이치라는 심즉리, 앎과 행함이 하나라는 지행합일, 타고난 양지를 실현하자는 치양지를 내세워 형식화된 성리학을 비판했다. 양명학은 이단으로 배척받아 주로 집안과 제자를 통해 이어졌고, 뒤에 이건창·박은식·정인보 등에게 영향을 주었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정제두, 『하곡집』", "한국학중앙연구원 『한국민족문화대백과사전』 '강화학파'"]

- id: sinim-oksa-1721
  year: 1721
  endYear: 1722
  title:
    ko: "신임옥사 (신임사화)"
  summary:
    ko: "숙종의 뒤를 이은 경종이 병약하고 아들이 없자 노론은 연잉군(뒤의 영조)을 왕세제로 세우고 대리청정까지 추진했다(1721). 경종을 지지하던 소론은 이를 왕권을 위협하는 일로 몰아 노론을 조정에서 쫓아냈고, 이듬해 목호룡의 고변을 계기로 김창집 등 노론 4대신이 사사되는 등 노론이 큰 화를 입었다. 신축년과 임인년에 걸친 이 사건으로 노론과 소론의 대립이 극에 달했고, 뒤에 영조가 탕평을 내세우는 배경이 되었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『경종실록』 경종 1년·2년"]

- id: nobi-jongmo-1731
  year: 1731
  title:
    ko: "노비종모법 확정과 신분제의 동요"
  summary:
    ko: "영조가 아버지가 노비라도 어머니가 양인이면 자녀를 양인으로 삼는 노비종모법을 확정했다(1731). 현종 때 처음 시행된 뒤 집권 붕당에 따라 폐지와 부활을 되풀이하던 것을 굳혀, 군역을 질 양인을 늘리려 한 것이다. 이 무렵 재산을 모은 농민과 상인이 공명첩을 사거나 족보를 사고 위조해 양반이 되면서 양반 수가 크게 늘고 상민과 노비는 줄었다. 도망하는 노비도 많아져 노비제가 크게 흔들렸다."
  subjects: [joseon]
  tags: [society]
  sources: ["『현종실록』 현종 10년", "『영조실록』 영조 7년"]

- id: useo-1737
  year: 1737
  precision: decade
  title:
    ko: "유수원의 『우서』"
  summary:
    ko: "유수원이 『우서』를 지어 사농공상은 신분이 아니라 직업의 차이일 뿐이라며 직업의 평등과 전문화를 주장했다. 양반도 놀고먹지 말고 생산 활동에 나서야 한다고 했으며, 상인들이 자본을 합쳐 규모를 키우고 기술을 혁신해 상공업을 진흥해야 한다고 보았다. 뒤의 북학파(중상학파)로 이어지는 선구적인 주장으로 평가된다."
  subjects: [joseon]
  tags: [culture, economy]
  sources: ["유수원, 『우서』", "한국학중앙연구원 『한국민족문화대백과사전』 '우서'"]

- id: seongho-saseol-1740
  year: 1740
  precision: century
  title:
    ko: "이익의 『성호사설』과 한전론"
  summary:
    ko: "이익이 평생 공부하며 적은 글을 모은 『성호사설』에서 천문·지리·역사·제도 등을 폭넓게 논하고 사회 개혁을 주장했다. 한 가정이 살아가는 데 필요한 토지를 영업전으로 정해 사고팔지 못하게 하자는 한전론을 폈고, 노비제·과거제·양반 문벌·사치와 미신·승려·게으름을 나라를 좀먹는 여섯 가지 폐단(6좀)으로 꼽았다. 그의 학문은 안정복·정약용 등으로 이어져 성호학파를 이루었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["이익, 『성호사설』", "이익, 『곽우록』"]

- id: sasang-1750
  year: 1750
  precision: century
  title:
    ko: "사상의 성장과 청·일본과의 무역"
  summary:
    ko: "17세기 후반부터 정부의 허가를 받지 않은 사상(私商)이 크게 성장했다. 개성의 송상은 전국에 송방이라는 지점을 두고 인삼을 재배·가공해 팔았고, 한강을 근거지로 한 경강상인은 곡물·소금을 실어 나르며 배를 만들어 팔기도 했다. 의주의 만상은 청과, 동래의 내상은 일본과 무역했으며, 송상은 그 사이를 중계해 큰 이익을 얻었다. 청과는 국경의 공식 시장인 개시와 사사로운 무역인 후시(책문 후시 등)로, 일본과는 부산 왜관의 개시로 교역했다."
  subjects: [joseon, qing, japan]
  links:
    - { from: joseon, to: qing, note: "만상의 대청 무역 (개시·후시)" }
    - { from: joseon, to: japan, note: "내상의 대일 무역 (왜관 개시)" }
  tags: [economy, diplomacy]
  sources: ["『만기요람』 재용편", "국사편찬위원회 『신편 한국사』 (조선 후기의 경제)"]

- id: handicraft-mining-1750
  year: 1750
  precision: century
  title:
    ko: "민영 수공업과 광산 경영의 변화"
  summary:
    ko: "17세기 이후 관청에 소속된 장인이 줄고, 장인세만 내고 물건을 자유롭게 만들어 파는 민영 수공업이 발달했다. 상인이 원료와 자금을 미리 대 주고 제품을 넘겨받는 선대제가 널리 퍼졌으며, 18세기 후반에는 스스로 만들어 파는 독립 수공업자도 나타났다. 광업에서는 17세기 중엽 민간인의 채굴을 허용하고 세금을 거두는 설점수세제가 시행되었다. 18세기 말에는 상인 물주에게 자본을 받은 덕대가 노동자를 고용해 광산을 경영했고, 몰래 광물을 캐는 잠채도 성행했다."
  subjects: [joseon]
  tags: [economy]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 경제)", "한국학중앙연구원 『한국민족문화대백과사전』 '설점수세제'"]

- id: hyangjeon-1750
  year: 1750
  precision: century
  title:
    ko: "향촌 질서의 변화와 향전"
  summary:
    ko: "양반 수가 늘고 경제력을 갖춘 부농층이 성장하면서, 기존 사족(구향)과 새로 향촌에 진출한 세력(신향)이 향촌의 주도권을 놓고 다투는 향전이 곳곳에서 일어났다. 정부는 수령과 향리를 통해 직접 세금을 거두는 방식으로 향촌 지배를 강화했고, 사족들의 모임이던 향회는 수령의 세금 부과를 자문하는 기구로 바뀌었다. 힘이 약해진 사족은 동족 마을을 이루고 문중 중심의 서원·사우를 세워 지위를 지키려 했다."
  subjects: [joseon]
  tags: [society]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 사회)", "한국학중앙연구원 『한국민족문화대백과사전』 '향전'"]

- id: cheonggyecheon-1760
  year: 1760
  title:
    ko: "영조의 청계천 준설 (준천)"
  summary:
    ko: "영조가 비가 오면 자주 넘치던 한양의 개천(청계천) 바닥을 파내고 물길을 정비하는 준천 사업을 벌였다. 두 달 가까이 한양 백성과 인부 등 연인원 20만여 명이 동원되었고, 공사 뒤 준천사를 두어 개천을 관리하게 했다. 한양의 인구가 늘고 상업이 발달하면서 생긴 도시 문제를 해결하려는 사업이었다."
  subjects: [joseon]
  tags: [politics, society]
  sources: ["『영조실록』 영조 36년", "『준천사실』"]

- id: hong-daeyong-1765
  year: 1765
  endYear: 1766
  title:
    ko: "홍대용의 연행과 『의산문답』"
  summary:
    ko: "홍대용이 숙부를 따라 청에 다녀오면서(1765~1766) 베이징의 서양 선교사와 청의 학자들을 만나 교류했다. 뒤에 『의산문답』에서 지구가 하루에 한 바퀴씩 돈다는 지전설과 우주는 끝이 없다는 무한 우주론을 펴서, 중국이 세계의 중심이라는 생각을 비판했다. 혼천의를 만들어 개인 관측소에 두고 수학서 『주해수용』을 짓는 등 과학 연구에도 힘썼다."
  subjects: [joseon, qing]
  links:
    - { from: joseon, to: qing, note: "연행 사신 수행" }
    - { from: qing, to: joseon, note: "베이징에서 서양 천문학 접촉" }
  tags: [culture]
  sources: ["홍대용, 『담헌서』 (『의산문답』·『연기』)", "홍대용, 『을병연행록』"]

- id: dongguk-munheon-1770
  year: 1770
  title:
    ko: "『동국문헌비고』 편찬"
  summary:
    ko: "영조의 명으로 홍봉한 등이 우리나라의 역대 제도와 문물을 분야별로 정리한 『동국문헌비고』 100권을 펴냈다. 천문·지리·예악·군사·형벌·재정·호구·시장·과거·학교·관직 등 13개 부문으로 나누어 서술한 한국학 백과사전이다. 이후 여러 차례 보완되어 대한제국 때 『증보문헌비고』(1908)로 완성되었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『영조실록』 영조 46년", "『동국문헌비고』"]

- id: jangsi-1770
  year: 1770
  precision: century
  title:
    ko: "장시와 포구 상업의 발달"
  summary:
    ko: "18세기 중엽 전국의 장시가 1천여 곳에 이르렀고, 대개 5일마다 열려 인근 장시들과 하나의 지역 시장권을 이루었다. 보부상이 장시를 돌며 물건을 팔아 생산자와 소비자를 이어 주었다. 물자가 모이는 포구도 상업 중심지로 성장해 객주와 여각이 상품의 매매 중개는 물론 운송·보관·숙박·금융 업무까지 맡았다. 광주 송파장, 은진 강경장, 덕원 원산장처럼 전국적인 유통의 거점이 된 큰 장시도 나타났다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『동국문헌비고』 시적고", "서유구, 『임원경제지』 예규지"]

- id: dongsa-gangmok-1778
  year: 1778
  title:
    ko: "안정복의 『동사강목』"
  summary:
    ko: "이익의 제자 안정복이 고조선부터 고려 말까지의 역사를 강목체로 정리한 『동사강목』을 완성했다. 단군–기자–마한–통일 신라–고려로 이어지는 독자적인 정통론을 세웠고, 삼국은 정통이 없는 시기로 보았다. 여러 기록을 비교해 사실을 따지는 고증을 중시해 역사 연구의 수준을 높였다. 같은 무렵 이긍익은 조선의 야사를 사건별로 정리한 기사본말체 역사서 『연려실기술』을 지었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["안정복, 『동사강목』", "이긍익, 『연려실기술』"]

- id: jasan-eobo-1814
  year: 1814
  title:
    ko: "정약전의 『자산어보』"
  summary:
    ko: "신유박해로 흑산도에 유배된 정약전(정약용의 형)이 섬 주민 장창대의 도움을 받아 흑산도 근해의 물고기와 바다 생물을 직접 관찰하고 기록한 『자산어보』를 지었다. 생물의 이름·생김새·습성·쓰임새를 분류해 적은 어류학서로, 실학자들의 실증적인 자연 연구를 보여 준다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정약전, 『자산어보』 서문"]

- id: seoeol-tongcheong-1823
  year: 1823
  endYear: 1851
  title:
    ko: "서얼 허통과 중인의 통청 운동"
  summary:
    ko: "서얼들은 높은 관직에 오르지 못하게 한 제한을 풀어 달라고 거듭 상소했다. 정조 때 규장각 검서관으로 일부가 등용되었고, 순조 때(1823) 서얼 1만여 명이 함께 상소를 올렸으며, 철종 때(1851) 신해허통으로 청요직 진출이 허용되었다. 역관·의관 등 기술직 중인도 이에 자극받아 1851년 대규모 소청 운동을 벌였으나 뜻을 이루지 못했다. 중인들은 시사를 만들어 위항 문학을 이끌었고, 일부는 뒤에 개화사상 형성에 참여했다."
  subjects: [joseon]
  tags: [society]
  sources: ["『순조실록』 순조 23년", "『철종실록』 철종 2년"]

- id: wijeong-cheoksa-1866
  year: 1866
  endYear: 1876
  title:
    ko: "위정척사 운동 (척화주전론과 왜양일체론)"
  summary:
    ko: "성리학의 질서를 지키고(위정) 천주교와 서양 문물을 물리치자는(척사) 위정척사 사상이 서양 세력의 침략을 겪으며 운동으로 번졌다. 병인양요 무렵 이항로·기정진은 서양과 싸워야 한다는 척화주전론을 펴서 흥선 대원군의 통상 거부 정책을 뒷받침했다. 1876년 일본과 조약을 맺으려는 움직임이 일자 최익현은 일본도 서양 오랑캐와 다를 바 없다는 왜양일체론을 들어, 도끼를 지니고 궁궐 앞에 엎드려 개항 반대 상소를 올렸다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 3년·13년", "최익현, 『면암집』 「지부복궐척화의소」", "이항로, 『화서집』"]

- id: gaehwa-thought-1870
  year: 1870
  precision: decade
  title:
    ko: "통상 개화론과 개화사상의 형성"
  summary:
    ko: "북학파 박지원의 손자 박규수, 청을 오가며 『해국도지』·『영환지략』 같은 세계 지리서를 들여온 역관 오경석, 의관 유홍기(유대치) 등이 서양과 통상하고 기술을 받아들여 나라를 부강하게 해야 한다는 통상 개화론을 폈다. 박규수의 사랑방에는 김옥균·박영효·홍영식·유길준 등 젊은 양반 자제들이 드나들며 이들의 영향을 받았다. 이들은 뒤에 개화파를 이루어 개항 이후의 개화 정책을 이끌었다."
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "『해국도지』·『영환지략』 등 세계 정세서 전래" }
  tags: [politics, culture]
  sources: ["박규수, 『환재집』", "국사편찬위원회 『신편 한국사』 (서세 동점과 문호 개방)"]
