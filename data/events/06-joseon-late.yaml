- id: sillok-sago-1603
  year: 1603
  endYear: 1618
  title:
    ko: 실록 재간행과 5대 사고
  summary:
    ko: "임진왜란 때 조선의 사고 가운데 전주 사고를 뺀 세 곳이 전화를 입어 실록은 전주 사고본만 남았다. 1603년(선조 36) 7월 이를 저본으로 태조부터 명종까지의 실록을 다시 간행하는 일이 추진되어 1606년 봄에 재인쇄가 끝났는데, 새로 만든 정본 3질과 교정쇄본 1질에 전주 사고본 원본 1질을 합하면 모두 5질이었고 서울의 춘추관과 외사고 네 곳(마니산·태백산·오대산·묘향산)에 나누어 보관하는 방안이 추진되었다. 재정이 모자라 한 부는 최종 교정쇄본을 장정해 정본을 대신했다. 전란 뒤에는 사고를 산간이나 섬 같은 오지로 옮겨, 사고 자리를 고르는 기준이 이용과 관리의 편의에서 실록의 안전으로 바뀌었다. 오대산사고는 1606년 월정사 북쪽 10리 남호암 기슭에 설치되어 그해 교정쇄본이 봉안되었고, 월정사 주지가 실록수호총섭을 맡았으나 실제 수호는 암자 영감사가 맡았으며 1616년 『선조실록』, 1653년 『인조실록』 등이 차례로 봉안되었다. 북쪽의 묘향산사고는 후금의 위협과 관리 소홀로 장서가 사라질 우려가 있어, 1610년(광해군 2) 최현과 이유경의 요청으로 사관을 보내 적상산을 살피고 산성을 고치게 했다. 1614년 적상산성 안에 실록전을 세우고 1618년 9월부터 실록을 봉안하기 시작해 1633년까지 묘향산사고의 실록을 모두 옮겼다. 강화의 마니산사고는 1606년 또는 그 직후에 설치된 것으로 추정되는데, 이를 뒷받침하는 문헌이 재간행 『명종실록』 「부록」 기사뿐이고 강화부 읍지에도 기록이 없어 실재를 의심하는 견해가 있는 반면, 1606년의 「경외사고수직절목」과 『승정원일기』는 정족산으로 옮기기 전까지 강화부 읍내에 사고가 있었다고 적어 논란이 이어진다. 1653년 11월 사각에서 불이 나 서적이 불탄 뒤 정족산성 안에 새 사고를 지어 그 기능을 옮겼다."
  subjects: [joseon]
  tags: [culture]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '마니산사고'", "한국학중앙연구원 『한국민족문화대백과사전』 '오대산사고'", "한국학중앙연구원 『한국민족문화대백과사전』 '적상산사고'", "한국학중앙연구원 『한국민족문화대백과사전』 '태백산사고'"]

- id: gongsin-1604
  year: 1604
  title:
    ko: 선무·호성·청난 공신 책봉
  summary:
    ko: "1604년(선조 37) 음력 6월 25일 『선조실록』은 대대적으로 공신을 봉했으며 그 이름이 호성공신·선무공신·청난공신이라고 적는다. 호성공신은 임진왜란 때 선조를 따라 의주까지 피란한 조선 조정의 신하들로 모두 86명이었다. 1등은 이항복·정곤수 2명, 2등은 이원익·윤두수·윤근수·유성룡 등 31명이었으며, 3등 53명에는 내시 24명과 이마 6명, 허준·이공기 등 의관이 들었다. 선무공신은 전공을 세운 장수와 명에 군량을 청한 사신 등 18명으로 1등은 이순신·권율·원균 3명, 2등은 신점·권응수·김시민·이정암·이억기 5명, 3등은 정기원·권협·유사원·고언백·이광악·조경·권준·이순신(李純信)·기효근·이운룡 10명이다. 청난공신은 1596년 이몽학의 난을 진압한 5명으로 홍가신이 1등, 박명현·최호가 2등, 신경행·임득의가 3등이었고, 세 공신을 합치면 109명이다. 『한국민족문화대백과사전』은 영의정 이항복과 우의정 김명원의 제의로 이때 청난공신이 책록되었다고 적고, 이듬해인 1605년에는 청난원종공신이 책록되었다고 한다. 유성룡의 호성공신 교지는 1604년 10월에 내려졌다. 사관은 내시와 하급 수행자까지 공신에 든 것을 두고 이렇게 많은 사람에게 공을 인정할 수 있느냐고 논하며, 김응남·신점·정곤수·이호민과 이순신·원균·권율 정도만 합당하다고 평했다. 선무공신 1등의 이순신·권율·원균은 세 대장으로 일컬어졌으며 효충장의적의협력선무공신의 칭호를 받았고, 2등의 김시민은 이미 숨진 뒤 추증되었으며(「진주 대첩」), 호성공신 3등에 든 허준은 뒤에 『동의보감』을 완성한다(「허준의 『동의보감』」). 청난공신이 진압한 반란은 「송유진·이몽학의 난」이 다룬다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『선조실록』 선조 37년 6월 25일", "한국학중앙연구원 『한국민족문화대백과사전』 '선무공신'", "한국학중앙연구원 『한국민족문화대백과사전』 '호성공신'", "한국학중앙연구원 『한국민족문화대백과사전』 '청난공신'"]

# ── 광해군과 호란 ───────────────────────────────────────

- id: daedongbeop-1608
  year: 1608
  title:
    ko: 대동법 실시 (경기도)
  summary:
    ko: "16세기 이래 조선의 공납은 품목이 수백 가지에 이르고 부과 기준이 모호한 데다, 방납인이 지방 공물을 가로채 값을 몇 배에서 몇백 배까지 부풀리는 방납의 폐단이 커져 농민이 고향을 떠돌게 되었다. 이이가 1569년 대공수미법을 건의했고, 임진왜란 중인 1594년 유성룡의 주장으로 공물을 쌀로 거두는 이 법(작미법)이 시행되었으나 1년이 채 못 되어 폐지되었다. 광해군이 즉위한 1608년 음력 5월 7일 영의정 이원익의 건의로 선혜청을 두고 경기도에서 선혜법을 시행했다고 『광해군일기』는 적는다. 대백과는 호조참의 한백겸의 구상을 이원익이 경기도에서 시행한 것으로 풀이하며, 이 선혜법을 뒤의 대동법과 똑같이 볼 수는 없다고 한다. 경기에서는 토지 1결마다 봄·가을 각 8두씩 연 16두의 쌀을 선혜청에 내게 했고, 선혜청은 시세에 넉넉한 값을 쳐서 방납인에게 쌀을 주고 필요한 물품을 사 오게 했다. 16두 가운데 각 회 1두씩은 고을에 주어 수령의 공사 비용으로 쓰게 했다고 실록은 적는데, 대백과는 14두를 공인에게 물품 구입비로, 2두를 수령에게 지방 경비로 준 것으로 적어 두 기록이 서로 맞는다. 선혜청은 영의정이 도제조, 호조판서가 부제조를 겸하고 낭청 2명을 두는 꼴이었다. 실록은 수령이 법 밖의 추가 징수를 막지 못하는 일이 있었으나 경기의 전결 부담은 다소 가벼워졌다고 평가한다. 대동법은 강원(1623)·충청(1651)·전라 해읍(1658)·전라 산군(1662)·함경(1666)·경상(1678)·황해(1708) 순으로 넓어졌다고 대백과는 적는데, 같은 항목이 1625년 충청·전라에서 폐지되었다가 1654년 조익과 김육이 세칙을 보완해 충청도에서 다시 시행했다고도 적어 충청의 시행 연도는 1651년과 1654년으로 갈린다(「대동법 전국 확대」(뒤의 사건)). 확대된 대동법의 징수 원칙은 1결당 12두였고 거둔 쌀은 상납미·유치미·여미로 나뉘었다. 공인에게 값을 주어 물품을 조달하게 하면서 금납화와 상공업·시장의 발달이 촉진되었다는 평가가 있다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『광해군일기』 광해군 즉위년", "『광해군일기』 광해군 즉위년 5월 7일", "한국학중앙연구원 『한국민족문화대백과사전』 '대동법'"]

- id: giyu-treaty-1609
  year: 1607
  endYear: 1609
  title:
    ko: 일본과 국교 재개 (기유약조)
  summary:
    ko: "도쿠가와 이에야스가 정권을 잡은 일본이 조선에 통교를 요청했고, 이에 앞서 쓰시마 도주가 1599~1600년 사이 사신을 세 차례 보냈다. 조선은 일본 국왕 명의의 국서를 먼저 보낼 것, 선정릉을 파헤친 범인을 압송할 것, 끌려간 사람들을 돌려보낼 것을 조건으로 내걸었다. 쓰시마는 국서를 고쳐 쓰고 잡범을 범인으로 꾸며 넘기는 변칙으로 이 조건을 맞추었다(「국서 개작 사건」(뒤의 사건)). 이를 받아들인 조선은 1607년 에도 막부의 요청에 응해 회답 겸 쇄환사를 보냈다. 정사는 여우길, 부사는 경섬이었고 일행은 504명이었다. 조선은 막부를 통신국으로 인정하지 않았으므로 이 사행과 1617년(정사 오윤겸, 428명)·1624년(정사 정립, 460명)의 사행을 통신사가 아닌 회답 겸 쇄환사라 불렀고, 통신사라는 호칭은 1636년부터 다시 쓰였다. 1604년 이후 탐적사·회답 겸 쇄환사·통신사가 돌려보낸 피로인은 모두 5,667명으로 대백과는 적는데, 탐적사와 회답 겸 쇄환사의 몫이 합쳐 4,885명이라 1607년 한 번의 수는 알 수 없다. 1609년 조선은 쓰시마 도주와 기유약조를 맺었다. 『통문관지』를 따른 대백과의 13조 서술에 따르면 쓰시마 도주의 세견선은 20척이고 특송선 3척은 이 20척에 포함해 셈하며 도주에게는 세사미두 100석을 준다. 왜선은 도주의 문인을 지녀야 하고 문인이 없거나 부산포 밖에 닿은 자는 적으로 다루며, 왜관에 머무는 날수는 특송선 110일·세견선 85일·그 밖 55일로 정했다. 광해군은 1613년 명에 보낸 주본에서 이 약조를 만력 37년(1609)의 일로 설명하며 상선을 해마다 20척으로 묶고 부산에 관시를 허락했다고 밝혔다. 약조 뒤 부산의 왜관에서는 공무역·사무역·밀무역이 이루어졌고 사무역인 개시는 한 달에 여섯 번 열렸다. 에도 막부가 조선과의 외교와 무역을 쓰시마에 맡긴 까닭에 교역은 쓰시마 중심으로 전개되었다."
  subjects: [joseon, japan]
  links:
