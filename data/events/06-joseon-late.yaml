- id: hullyeon-dogam-1593
  year: 1593
  title:
    ko: 훈련도감 설치
  summary:
    ko: "임진왜란 중 조선은 급료를 받는 직업 군인으로 이루어진 중앙 군대 훈련도감을 설치했다. 16세기 말 오위 체제는 실제 기능이 허구가 되어 있었고 일본군에게 크게 패하자 급료병 중심의 상비군이 필요해졌다. 설치에는 비판이 많았으나 유성룡이 굳은 뜻으로 맡아 폐지되지 않았고, 도감 군사는 궁궐 숙위와 왕의 호종을 맡았다. 『한국민족문화대백과사전』은 1593년 7월 명 장수 낙상지의 진영에 화포 교습을 맡겨 포군을 기른 것이 출발점이었고 같은 해 8월 왕명으로 훈련도감이 설치되었다고 적는 반면, 『선조수정실록』은 환도한 뒤 훈련도감 설치를 명하고 유성룡을 도제조로 삼았다는 기사를 선조 27년(1594) 2월 1일에 싣는다. 유성룡은 환도 후 설치를 요청해 도제조를 맡았고 무신 조경이 대장, 병조 판서 이덕형이 유사당상이었으며, 이여송에게서 척계광의 『기효신서』를 구해 연구하고 그에 따라 도감을 세웠다. 굶주린 백성을 모아 큰 돌을 들고 한 길 담을 넘는 사람만 뽑아 수천 명을 포수·사수·살수의 삼수병으로 훈련했고, 『선조수정실록』 주석은 총병을 포수, 궁병을 사수, 창검병을 살수로 풀며 이 셋이 『기효신서』에 따른 훈련의 세 부문이었다고 적는다. 처음 약 1,000명이던 병력은 1602년 삼수미 징수 이후 약 2,000명이 되었고 병자호란 직전에는 5,000명을 넘었으며, 초기에는 한 달에 쌀 여섯 말을 받고 교대 없이 근무하는 장번 급료병이었다. 1594년 11월 군사가 5영으로 나뉘었고 뒤에 어영청·금위영과 함께 삼군문이 되어 도성을 방위했고 1746년 『속대전』에 상설 기구로 규정되어 1882년에 폐지되었으며(「5군영 체제 완성」), 지방에는 양반부터 노비까지 편성한 속오군을 두었다(「속오군 편성」)."
  subjects: [joseon]
  tags: [politics, war]
  sources: ["『선조수정실록』 선조 27년 2월 1일", "한국학중앙연구원 『한국민족문화대백과사전』 '훈련도감'", "한국학중앙연구원 『한국민족문화대백과사전』 '유성룡'"]

- id: sogogun-1594
  year: 1594
  endYear: 1596
  title:
    ko: 속오군 편성
  summary:
    ko: "임진왜란으로 지방군이 무너지자 조선은 척계광의 『기효신서』에 실린 속오법에 따라 새 지방군을 짜기로 하고, 1594년 음력 12월 지방군으로서 속오군의 설치를 시작했다(『한국민족문화대백과사전』 '진관관병편오책'). 속오군은 11명을 1대로 하고 3대를 1기, 3기를 1초, 5초를 1사, 5사를 1영으로 묶는 구조로, 1영은 약 2,500명이었다. 면·리·촌의 교련장에서 조직적으로 동원 훈련을 할 수 있었고 포수·살수·사수의 삼수병으로 편성되었으며, 거주지를 중심으로 고을별 단위 부대를 이루었다. 구성원은 양인과 공사천인이 섞인 혼성군이었고, 향촌에서 병사를 모아 재정 부담이 적었다. 편성은 황해도에서 시작해 1596년 말에는 거의 전국에 조직이 완성되었는데, 1596년 5월 관찰사 윤승길의 책임 아래 평안도 영변·안주·구성·의주 네 진관의 편성이 끝났고 그 병적이 『진관관병편오책』으로 전한다. 이 책에서 양인이 74%, 천인이 26%였으며 살수 가운데 천인은 45%, 사수 가운데는 9%였다. 전란이 끝나자 지방군에 대한 관심이 줄어 노약자로 채워졌고, 정묘호란 뒤 영장제가 확립되어 강화가 시도되었으나 큰 성과는 없었다. 병력은 1636년 평안도를 뺀 약 8만 6천여 명에서 1681년 20여만 명으로 늘었지만, 5군영이 확립되면서 수령 중심의 속오군은 구실이 약해졌고 영조 중엽부터는 양인이 빠지고 천인으로 채워져 『속대전』에 천예군으로 적혔다. 본역과 속오역을 함께 지는 일신양역의 부담 속에서 결국 포를 바치는 수포군으로 변해 유명무실해졌다. 중앙의 「훈련도감 설치」와 짝을 이루는 지방군 개편이며 뒤에 「5군영 체제 완성」으로 이어진다."
  subjects: [joseon]
  tags: [politics, war]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '속오군'", "한국학중앙연구원 『한국민족문화대백과사전』 '진관관병편오책'"]

- id: songyujin-imongak-1594
  year: 1594
  endYear: 1596
  title:
    ko: 송유진·이몽학의 난
  summary:
    ko: "임진왜란 중 조선에서는 전쟁의 혼란을 틈탄 반란이 이어졌다. 송유진은 천안·직산 일대를 근거지로 지리산·계룡산 일대까지 세력을 폈고 무리는 2,000여 명에 이르렀는데, 스스로 의병대장이라 일컫고 아산·평택의 병기를 빼앗았으며 서울의 수비가 허술한 것을 보고 1594년 정월 보름에 한성으로 진군하기로 약속했다. 그러나 오원종·홍근 등과 함께 그해 음력 정월 직산에서 충청 병사 변양준에게 붙잡혀 선조의 친국을 받은 뒤 사형되었다. 1596년 이몽학의 난은 더 크게 번졌다. 왕실의 서얼 출신인 이몽학은 충청도와 전라도를 떠돌다 임진왜란 때 모속관 한현의 휘하에서 활동했고, 친목회를 가장한 비밀 모임 동갑회로 사람을 모았다. 1596년 음력 7월 6일 밤 홍산현을 습격해 현감 윤영현을 붙잡고 임천군수 박진국을 납치한 뒤 정산·청양·대흥을 차례로 점령하고 9일 홍주성을 공격했으며, 처음 600~700명이던 무리는 수만 명에 이르렀다고 기록된다. 『선조실록』 7월 9일 기사에는 어사 이시발이 홍산에서 변란이 일어났음을 보고한 서장이 실려 있어, 거병한 날과 조정에 알려진 날이 다르다. 홍주 목사 홍가신은 거짓 투항으로 시간을 번 뒤 박명현·임득의 등을 기용하고 수사 최호와 함께 홍주성을 지켰고, 이몽학은 11일 새벽 덕산 쪽으로 달아나다 부하 김경창 등의 손에 목숨을 잃었다. 한현은 사로잡혀 서울로 압송되었고, 서울에서 33명, 지방에서 100여 명이 처형되었으나 연좌제는 특별한 경우에만 적용했다. 반란군의 진술로 김덕령·곽재우·홍계남·고언백 등이 무고하게 연루되어, 김덕령과 최담령은 혹독한 심문 끝에 숨졌고 김덕령은 뒤에 신원되었다. 진압의 공은 1604년 청난공신으로 책록되었다(「선무·호성·청난 공신 책봉」)."
  subjects: [joseon]
  tags: [society]
  sources: ["『선조실록』 선조 29년 7월 9일", "한국학중앙연구원 『한국민족문화대백과사전』 '송유진'", "한국학중앙연구원 『한국민족문화대백과사전』 '이몽학의 난'"]

- id: jeongyu-war-1597
  year: 1597
  endYear: 1598
  title:
    ko: 정유재란과 명량·노량 해전
  summary:
    ko: "1596년 9월 오사카 회견에서 명과 일본의 강화 교섭이 속임수였음이 드러나 결렬되었고, 도요토미 히데요시가 요구한 화평 조건 7개조에는 명 황녀를 후비로 보내고 조선 남부 4개 도를 일본에 넘기라는 것 등이 있었는데 명과 조선이 받아들일 수 없는 내용이었다(『한국민족문화대백과사전』 '임진왜란'은 같은 요구를 4개 조건으로 적는다). 휴전 협상이 깨지자 1597년 2월 21일 히데요시가 14만 병력(『한국민족문화대백과사전』 '임진왜란'은 약 14만 1,500명)을 편성해 재침을 명했고 첫 목표는 호남 장악이었다. 이순신이 원균의 모함과 일본군의 모략으로 옥에 갇히고 원균이 통제사가 되었는데, 원균이 칠천량에서 패해 전사하면서(7월 15일이라 적는 곳과 16일이라 적는 곳이 같은 항목 안에서도 갈린다) 조선 수군이 괴멸에 가깝게 무너졌다. 8월 16일 남원이 함락되어 명 부총병 양원은 겨우 빠져나왔고 전주도 싸움 없이 점령되었으며, 일본군은 충청도 직산까지 올라왔으나 9월 7일 소사평 전투에서 명군이 격퇴해 북상이 막혔다. 7월 22일 삼도수군통제사로 다시 임명된 이순신은 9월 16일 명량에서 배설이 칠천량에서 빼낸 12척에 백성이 가져온 1척을 더한 13척(같은 항목 요약에는 12척)으로 일본 전선 133척을 맞아 일자진으로 협수로를 막고 조류가 바뀌는 때를 이용해 31척을 깨뜨렸고, 투항한 일본인 준사가 가리킨 일본 장수 마다시를 베어 사기를 꺾었다. 일본군은 순천·사천·울산 등 남해안과 동남 해안의 왜성으로 물러나 일본군 점령지를 지키며 버텼고, 12월 명 양호의 4만여 명과 권율의 1만여 명이 울산 왜성(도산성)을 공격했으나 실패했다. 1598년 8월 18일 히데요시가 죽자 일본군이 철수를 시작했고, 명군은 울산·사천·순천의 세 왜성을 나누어 치는 사로병진 작전을 폈으나 성과를 내지 못했다. 11월 18~19일 이순신은 명의 진린과 이룬 연합함대로 노량 해전에서 철수하던 일본군을 크게 무찔렀으나 유탄에 맞아 전사했고, 명군은 1599년에 철수했다."
