  front: { war: imjin-war, date: 1592-10-10 }

- id: pyongyang-recapture-1593
  year: 1593
  title:
    ko: 조·명 연합군의 평양성 탈환과 행주 대첩
  summary:
    ko: 명의 이여송이 이끄는 원군과 조선군이 평양성을 되찾았다. 권율은 행주산성에서 일본군을 크게 물리쳤다. 일본군은 한양에서 물러나 남해안에 왜성을 쌓고 명과 휴전 협상에 들어갔다.
  subjects: [joseon, ming, japan]
