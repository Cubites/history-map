  tags: [politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '인목왕후'", "한국학중앙연구원 『한국민족문화대백과사전』 '계축옥사'", "한국학중앙연구원 『한국민족문화대백과사전』 '허균'", "한국학중앙연구원 『한국민족문화대백과사전』 '인조반정'"]

- id: heo-gyun-1618
  year: 1618
  title:
    ko: 허균의 처형과 『홍길동전』
  summary:
    ko: "조선의 문인 허균은 1569년에 태어나 1594년 정시 문과 을과에 급제하고 1597년 문과 중시에서 장원을 했다. 1606년에는 명 사신 주지번을 맞는 종사관으로 활약해 누이 허난설헌의 시가 중국에서 출판되는 계기를 만들었으나, 삼척 부사로 나갔다가 탄핵으로 쫓겨나는 등 파직과 유배를 되풀이했다. 1613년 계축옥사 뒤 이이첨에 가담해 대북에 참여했고(「계축옥사와 영창 대군의 죽음」(앞의 사건)), 1617년 좌참찬이 되어 폐모론을 주장했다. 폐모에 반대하다 길주로 유배된 영의정 기자헌의 아들 기준격이 아버지를 구하려고 허균의 죄상을 폭로하는 상소를 올렸고, 허균도 상소로 변명했다. 1618년 음력 8월 남대문에 격문이 붙었는데 허균의 심복 현응민이 붙인 것으로 드러났고, 허균은 기준격과 대질한 끝에 역모를 꾀했다고 판단되어 동료들과 함께 저자에서 능지처참되었다. 『홍길동전』을 허균이 지었다는 기록은 이식의 『택당집』에 있으며 이 기록이 작자 추정의 근거로 이어져 왔다. 그러나 『택당집』은 이식이 죽은 뒤 송시열이 교정·편찬했다는 점에서 신빙성이 떨어진다는 지적이 있고, 허균의 처형 죄목에 이 작품이 들어 있지 않다는 점도 의문의 근거로 거론된다. 대백과 '홍길동전'은 이식의 기록을 뒤집을 실증 자료가 없는 한 허균의 창작을 부정할 수 없다고 정리한다. 줄거리는 홍 판서의 시비 춘섬이 낳은 서자 길동이 재주가 뛰어나지만 집안의 위협으로 여겨져 집을 떠나 활빈당을 칭하는 도적의 우두머리가 되어 탐관오리의 재물을 빼앗아 백성에게 나누고, 병조판서 자리를 얻은 뒤 율도국의 왕이 되는 이야기다. 길동은 첩의 자식이라 아버지와 형을 부르지 못하는 설움을 겪는데, 이본에 따라 경판본은 서얼 차별을, 완판본은 사회 부조리에 대한 비판을 더 두드러지게 그린다. 현재 전하는 이본에는 17세기 말의 장길산이 나오므로 허균의 원작 그대로는 아니라고 본다. 허균이 편찬한 문집 『성소부부고』는 죽기 전 외손에게 맡겨졌다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '허균'", "한국학중앙연구원 『한국민족문화대백과사전』 '홍길동전'"]

- id: sarhu-1619
  year: 1619
  title:
    ko: 광해군의 중립 외교 (사르후 전투)
  summary:
    ko: 명의 요청으로 강홍립이 이끄는 군대를 보냈으나, 광해군은 형세를 보아 행동하게 해 사르후 전투에서 후금에 항복하게 했다. 명과 후금 사이에서 실리를 찾은 중립 외교였다.
