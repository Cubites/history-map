- id: multistory-temples-1626
  year: 1626
  endYear: 1702
  title:
    ko: "법주사 팔상전·금산사 미륵전·화엄사 각황전"
  summary:
    ko: "왜란과 호란으로 불탄 사찰을 다시 지으면서 규모가 큰 다층 불전이 세워졌다. 보은 법주사 팔상전(1626 완공)은 현재 남아 있는 우리나라 유일의 목조 5층탑이고, 김제 금산사 미륵전(1635)은 겉으로는 3층이지만 안은 하나로 트인 구조이다. 구례 화엄사 각황전(1702)도 이 시기의 대표적인 중층 건물이다. 이런 큰 불전을 지을 수 있었던 것은 양반 지주층이 경제력을 갖추고 불교계의 사회적 위상도 높아졌기 때문으로 풀이된다."
  subjects: [joseon]
  tags: [culture]
  sources: ["국가유산청 국가유산포털 '보은 법주사 팔상전' 해설", "국가유산청 국가유산포털 '김제 금산사 미륵전' 해설", "국가유산청 국가유산포털 '구례 화엄사 각황전' 해설"]

- id: patrilineal-family-1650
  year: 1650
  precision: century
  title:
    ko: "부계 중심 가족 제도의 확립"
  summary:
    ko: "17세기 중엽 이후 성리학적 예법이 사회에 뿌리내리면서 부계 중심의 가족 제도가 굳어졌다. 혼인한 뒤 곧 남자 집에서 사는 친영 제도가 자리 잡고, 재산 상속에서 큰아들을 우대했으며, 제사도 형제가 돌아가며 지내던 방식에서 큰아들이 맡는 방식으로 바뀌었다. 아들이 없으면 양자를 들이는 일이 일반화되고 부계 위주로 족보가 만들어졌다. 딸도 재산을 고르게 나누어 받고 제사를 돌아가며 지내던 조선 전기와 크게 달라진 모습이다."
  subjects: [joseon]
  tags: [society]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 사회)", "한국학중앙연구원 『한국민족문화대백과사전』 '친영'"]

- id: siheonryeok-1653
  year: 1653
  title:
    ko: "시헌력 채택"
  summary:
    ko: "청이 서양 선교사 아담 샬 등의 천문 계산법을 받아들여 만든 시헌력을 조선도 도입해 1653년부터 썼다. 인조 때(1645) 관상감 제조 김육이 역법을 바꾸자고 건의한 것이 받아들여진 결과였다. 해와 달의 움직임을 더 정확히 계산할 수 있게 되어, 서양 과학 지식이 조선에 영향을 준 사례로 꼽힌다."
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "서양식 역법(시헌력) 전래" }
  tags: [culture]
  sources: ["『인조실록』 인조 23년", "『효종실록』 효종 4년"]

- id: nongga-jipseong-1655
  year: 1655
  title:
    ko: "『농가집성』 편찬과 모내기법 확산"
  summary:
    ko: "신속이 『농사직설』·『금양잡록』 등을 모아 보완한 『농가집성』을 펴내 모내기법(이앙법)의 보급을 도왔다. 모내기법이 널리 퍼지면서 김매기 노동이 줄어 한 사람이 넓은 땅을 경작하는 광작이 가능해졌고, 벼와 보리의 이모작도 늘었다. 인삼·담배·면화 같은 상품 작물을 재배해 소득을 올리는 농민이 나타났으며, 18세기에는 일정한 액수를 지대로 내는 도조법도 확산되었다."
  subjects: [joseon]
  tags: [economy]
  sources: ["신속, 『농가집성』", "국사편찬위원회 『신편 한국사』 (조선 후기의 경제)"]

- id: bangye-surok-1670
  year: 1670
  title:
    ko: "유형원의 『반계수록』"
  summary:
    ko: "전라도 부안에 은거하던 유형원이 나라 제도 전반의 개혁안을 담은 『반계수록』을 완성했다. 관리·선비·농민에게 신분에 따라 토지를 차등 있게 나누어 주는 균전론을 내세워 자영농을 키우고 조세와 군역을 바로잡으려 했다. 양반 문벌과 과거제, 노비 세습의 폐단을 비판했으나 신분제 자체를 없애자고 하지는 않았다. 중농학파(경세치용 학파)의 출발점으로 평가되며 영조 때 간행되었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["유형원, 『반계수록』", "한국학중앙연구원 『한국민족문화대백과사전』 '반계수록'"]

- id: sabyeonnok-1703
  year: 1703
  title:
    ko: "박세당의 『사변록』과 사문난적 논란"
  summary:
    ko: "송시열을 비롯한 서인(노론)은 주자의 학설을 절대적인 기준으로 삼아, 이와 다르게 경전을 풀이하는 학자를 유교의 도리를 어지럽히는 사문난적으로 몰았다. 남인 윤휴가 독자적인 경전 해석으로 비판받았고, 소론 박세당은 『사변록』에서 주자의 주석을 비판했다가 1703년 사문난적으로 몰려 관직을 빼앗겼다. 성리학의 교조화에 대한 이러한 비판은 양명학과 실학이 성장하는 토양이 되었다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『숙종실록』 숙종 29년", "박세당, 『사변록』"]

- id: jeong-jedu-1709
  year: 1709
  title:
    ko: "정제두와 강화학파 (양명학)"
  summary:
    ko: "소론 학자 정제두가 강화도로 옮겨 살며(1709) 양명학을 깊이 연구하고 제자를 길러 강화학파를 이루었다. 마음이 곧 이치라는 심즉리, 앎과 행함이 하나라는 지행합일, 타고난 양지를 실현하자는 치양지를 내세워 형식화된 성리학을 비판했다. 양명학은 이단으로 배척받아 주로 집안과 제자를 통해 이어졌고, 뒤에 이건창·박은식·정인보 등에게 영향을 주었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정제두, 『하곡집』", "한국학중앙연구원 『한국민족문화대백과사전』 '강화학파'"]

- id: sinim-oksa-1721
  year: 1721
  endYear: 1722
  title:
    ko: "신임옥사 (신임사화)"
  summary:
    ko: "숙종의 뒤를 이은 경종이 병약하고 아들이 없자 노론은 연잉군(뒤의 영조)을 왕세제로 세우고 대리청정까지 추진했다(1721). 경종을 지지하던 소론은 이를 왕권을 위협하는 일로 몰아 노론을 조정에서 쫓아냈고, 이듬해 목호룡의 고변을 계기로 김창집 등 노론 4대신이 사사되는 등 노론이 큰 화를 입었다. 신축년과 임인년에 걸친 이 사건으로 노론과 소론의 대립이 극에 달했고, 뒤에 영조가 탕평을 내세우는 배경이 되었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『경종실록』 경종 1년·2년"]

- id: nobi-jongmo-1731
  year: 1731
  title:
    ko: "노비종모법 확정과 신분제의 동요"
  summary:
    ko: "영조가 아버지가 노비라도 어머니가 양인이면 자녀를 양인으로 삼는 노비종모법을 확정했다(1731). 현종 때 처음 시행된 뒤 집권 붕당에 따라 폐지와 부활을 되풀이하던 것을 굳혀, 군역을 질 양인을 늘리려 한 것이다. 이 무렵 재산을 모은 농민과 상인이 공명첩을 사거나 족보를 사고 위조해 양반이 되면서 양반 수가 크게 늘고 상민과 노비는 줄었다. 도망하는 노비도 많아져 노비제가 크게 흔들렸다."
  subjects: [joseon]
  tags: [society]
  sources: ["『현종실록』 현종 10년", "『영조실록』 영조 7년"]

- id: useo-1737
  year: 1737
  precision: decade
  title:
    ko: "유수원의 『우서』"
  summary:
    ko: "유수원이 『우서』를 지어 사농공상은 신분이 아니라 직업의 차이일 뿐이라며 직업의 평등과 전문화를 주장했다. 양반도 놀고먹지 말고 생산 활동에 나서야 한다고 했으며, 상인들이 자본을 합쳐 규모를 키우고 기술을 혁신해 상공업을 진흥해야 한다고 보았다. 뒤의 북학파(중상학파)로 이어지는 선구적인 주장으로 평가된다."
  subjects: [joseon]
  tags: [culture, economy]
  sources: ["유수원, 『우서』", "한국학중앙연구원 『한국민족문화대백과사전』 '우서'"]

- id: seongho-saseol-1740
  year: 1740
  precision: century
  title:
    ko: "이익의 『성호사설』과 한전론"
  summary:
    ko: "이익이 평생 공부하며 적은 글을 모은 『성호사설』에서 천문·지리·역사·제도 등을 폭넓게 논하고 사회 개혁을 주장했다. 한 가정이 살아가는 데 필요한 토지를 영업전으로 정해 사고팔지 못하게 하자는 한전론을 폈고, 노비제·과거제·양반 문벌·사치와 미신·승려·게으름을 나라를 좀먹는 여섯 가지 폐단(6좀)으로 꼽았다. 그의 학문은 안정복·정약용 등으로 이어져 성호학파를 이루었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["이익, 『성호사설』", "이익, 『곽우록』"]

- id: sasang-1750
  year: 1750
  precision: century
  title:
    ko: "사상의 성장과 청·일본과의 무역"
  summary:
    ko: "17세기 후반부터 정부의 허가를 받지 않은 사상(私商)이 크게 성장했다. 개성의 송상은 전국에 송방이라는 지점을 두고 인삼을 재배·가공해 팔았고, 한강을 근거지로 한 경강상인은 곡물·소금을 실어 나르며 배를 만들어 팔기도 했다. 의주의 만상은 청과, 동래의 내상은 일본과 무역했으며, 송상은 그 사이를 중계해 큰 이익을 얻었다. 청과는 국경의 공식 시장인 개시와 사사로운 무역인 후시(책문 후시 등)로, 일본과는 부산 왜관의 개시로 교역했다."
  subjects: [joseon, qing, japan]
  links:
    - { from: joseon, to: qing, note: "만상의 대청 무역 (개시·후시)" }
    - { from: joseon, to: japan, note: "내상의 대일 무역 (왜관 개시)" }
  tags: [economy, diplomacy]
  sources: ["『만기요람』 재용편", "국사편찬위원회 『신편 한국사』 (조선 후기의 경제)"]

- id: handicraft-mining-1750
  year: 1750
  precision: century
  title:
    ko: "민영 수공업과 광산 경영의 변화"
  summary:
    ko: "17세기 이후 관청에 소속된 장인이 줄고, 장인세만 내고 물건을 자유롭게 만들어 파는 민영 수공업이 발달했다. 상인이 원료와 자금을 미리 대 주고 제품을 넘겨받는 선대제가 널리 퍼졌으며, 18세기 후반에는 스스로 만들어 파는 독립 수공업자도 나타났다. 광업에서는 17세기 중엽 민간인의 채굴을 허용하고 세금을 거두는 설점수세제가 시행되었다. 18세기 말에는 상인 물주에게 자본을 받은 덕대가 노동자를 고용해 광산을 경영했고, 몰래 광물을 캐는 잠채도 성행했다."
  subjects: [joseon]
  tags: [economy]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 경제)", "한국학중앙연구원 『한국민족문화대백과사전』 '설점수세제'"]

- id: hyangjeon-1750
  year: 1750
  precision: century
  title:
    ko: "향촌 질서의 변화와 향전"
  summary:
    ko: "양반 수가 늘고 경제력을 갖춘 부농층이 성장하면서, 기존 사족(구향)과 새로 향촌에 진출한 세력(신향)이 향촌의 주도권을 놓고 다투는 향전이 곳곳에서 일어났다. 정부는 수령과 향리를 통해 직접 세금을 거두는 방식으로 향촌 지배를 강화했고, 사족들의 모임이던 향회는 수령의 세금 부과를 자문하는 기구로 바뀌었다. 힘이 약해진 사족은 동족 마을을 이루고 문중 중심의 서원·사우를 세워 지위를 지키려 했다."
  subjects: [joseon]
  tags: [society]
  sources: ["국사편찬위원회 『신편 한국사』 (조선 후기의 사회)", "한국학중앙연구원 『한국민족문화대백과사전』 '향전'"]

- id: cheonggyecheon-1760
  year: 1760
  title:
    ko: "영조의 청계천 준설 (준천)"
  summary:
    ko: "영조가 비가 오면 자주 넘치던 한양의 개천(청계천) 바닥을 파내고 물길을 정비하는 준천 사업을 벌였다. 두 달 가까이 한양 백성과 인부 등 연인원 20만여 명이 동원되었고, 공사 뒤 준천사를 두어 개천을 관리하게 했다. 한양의 인구가 늘고 상업이 발달하면서 생긴 도시 문제를 해결하려는 사업이었다."
  subjects: [joseon]
  tags: [politics, society]
  sources: ["『영조실록』 영조 36년", "『준천사실』"]

- id: hong-daeyong-1765
  year: 1765
  endYear: 1766
  title:
    ko: "홍대용의 연행과 『의산문답』"
  summary:
    ko: "홍대용이 숙부를 따라 청에 다녀오면서(1765~1766) 베이징의 서양 선교사와 청의 학자들을 만나 교류했다. 뒤에 『의산문답』에서 지구가 하루에 한 바퀴씩 돈다는 지전설과 우주는 끝이 없다는 무한 우주론을 펴서, 중국이 세계의 중심이라는 생각을 비판했다. 혼천의를 만들어 개인 관측소에 두고 수학서 『주해수용』을 짓는 등 과학 연구에도 힘썼다."
  subjects: [joseon, qing]
  links:
    - { from: joseon, to: qing, note: "연행 사신 수행" }
