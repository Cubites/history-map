- id: samhaksa-1637
  year: 1637
  title:
    ko: 척화 삼학사의 순절
  summary:
    ko: "홍익한(평양 서윤)·윤집(교리)·오달제는 1636년 청이 사신을 보내 조선을 속국처럼 대하는 조건을 내놓자 그 사신을 베어 모욕을 씻자고 주장한 척화론자였다. 인조가 삼전도에서 항복해 화의가 맺어진 뒤(「병자호란과 삼전도의 굴욕」(앞의 사건)) 청이 이들을 보내라고 요구했고, 세 사람은 봉림 대군과 함께 청으로 끌려가게 되었다. 홍익한은 청군이 돌아가던 1637년 음력 2월 초 평양에서 붙잡혀 2월 25일 심양에 닿았고, 윤집과 오달제는 청군의 후진에 섞여 가다 4월 15일 심양에 닿았다. 『인조실록』은 4월 19일 기사에 용골대가 재신과 강관을 아문으로 불러 두 사람을 심문했다고 적는다. 용골대는 화친을 끊자고 주장해 두 나라 사이를 갈라놓은 죄를 묻고 처자를 데려와 청에 머물면 목숨을 살려 주겠다고 했으나, 윤집은 처자의 생사조차 모른다며 형편을 보겠다고 답했고 오달제는 고국으로 돌아갈 수 없다면 사는 것이 죽는 것만 못하다며 바로 죽여 달라고 했다. 대백과는 청 태종이 직접 국문했고 세 사람이 끝내 회유를 거절했다고 적으며, 윤집과 오달제는 심양 서문 밖에서 처형되었다. 홍익한의 처형 시점은 윤집·오달제보다 앞선다는 설과 함께 처형되었다는 설로 갈린다. 당시 재신 박황과 궁관 이명웅은 오달제가 나이가 어리고 임금과 어버이를 그리는 마음에서 한 말이니 용서해 달라고 간청했으나 받아들여지지 않았고, 시신을 거두게 해 달라는 요청도 허락되지 않았다. 오달제는 끌려가던 중 노모와 형에게 보내는 절구 한 수를 지었고 이를 들은 사람들이 모두 눈물을 흘렸다고 『인조실록』은 전한다. 조정은 이들의 충절을 기려 정문을 내렸고 시호는 홍익한이 충정(忠正), 윤집이 충정(忠貞), 오달제가 충렬(忠烈)이다. 1688년(숙종 14)에는 경기도 광주의 남한산성에 세 사람을 모신 사당 현절사가 세워졌다."
  subjects: [joseon, qing]
  tags: [war, politics]
  sources: ["『인조실록』 인조 15년 4월 19일", "한국학중앙연구원 『한국민족문화대백과사전』 '척화 삼학사'"]

- id: pirogin-1637
  year: 1637
  endYear: 1637
  title:
    ko: 병자호란 피로인 속환
  summary:
    ko: "병자호란 때 청은 군대가 돌아가면서 많은 조선인을 끌고 갔다. 한국민족문화대백과 '속환'은 그 수를 약 50만 명으로 보지만, 실제로 몸값을 치르고 돌아온 사람은 2~3천 명 정도에 그쳤다고 평가한다. 앞선 정묘호란 때도 평안도와 황해도 주민이 상당수 끌려갔는데, 그때는 의주 건너편 중강이 속환시가 열리던 곳이었고 값이 청포 10필에서 65필, 때로 100필까지 올랐으며 특별한 사람은 은 1,000냥을 치르기도 했다. 속가는 정묘호란 뒤에는 청포의 필수로, 병자호란 뒤에는 은의 냥수로 셌다. 속환은 국가가 몸값을 내어 왕족과 참전 군인을 데려오는 공속과 가족이 개별로 몸값을 치르는 사속으로 나뉘었고, 심양 교외에는 주인과 가족이 모여 값을 흥정하는 속환시가 열렸다. 정묘호란 때 한 사람 값이 10여 필이었던 데 견주어 병자호란 뒤에는 은 10냥으로 시작해 평민은 40~50냥, 양반은 150~400냥, 때로는 1,500냥까지 올랐고, 부유한 양반이 자제를 먼저 데려오려고 거금을 내면서 가난한 사람은 길이 막혔다. 우의정 최명길은 1637년 음력 4월 21일 차자에서 값이 치솟는다며 한 사람당 100냥을 넘지 못하게 하자고 건의했고 인조가 이를 따랐으나(『인조실록』), 대백과는 이 상한이 지켜지지 않았다고 적는다. 4월에 좌의정 이성구 등이 사은사로 임명되어 심양에 갔고 5월 15일부터 속환이 시작되었으며, 6월에는 신계영이 속환사로 가서 16일 도착해 7월 7일 돌아올 때까지 활동했고, 11월에는 최명길이 사은사로 가서 780여 명을 데려왔다. 대규모 속환 사절은 모두 세 차례였고, 1637년 속환사가 데려온 사람은 600여 명이었으며 전체로는 2,000여 명이 되지 못했다고도 적어, 같은 항목 안에서도 2~3천 명과 값이 갈린다."
  subjects: [joseon, qing]
  tags: [society, diplomacy]
  sources: ["『인조실록』 인조 15년 4월 21일", "한국학중앙연구원 『한국민족문화대백과사전』 '속환'", "한국학중앙연구원 『한국민족문화대백과사전』 '속환시'"]

- id: samjeondo-stele-1639
  year: 1639
  title:
    ko: 삼전도비 건립
  summary:
    ko: "1627년 정묘호란으로 조선과 형제 관계를 맺은 후금이 1636년 국호를 청으로 바꾸고 군신 관계를 요구하자 조선 조정이 이를 거부했고, 그해 음력 12월 청 태종이 대군을 이끌고 침공했으며, 인조는 남한산성의 항전을 접고 백성의 안위를 위해 삼전도에서 항복했다(「병자호란과 삼전도의 굴욕」(앞의 사건)). 청 태종은 그곳에 머물며 항복받은 일을 기념하라고 강요했고, 그 압박으로 삼전도에 비를 세우게 되었다. 『인조실록』은 인조 16년(1638) 음력 2월 8일 기사에 장유와 이경석이 지은 비문 두 편을 청에 보내 고르게 했다고 적는데, 청의 범문정 등은 장유의 글은 인용이 적절하지 않고 이경석의 글은 쓸 만하나 덧붙일 말이 있다며 고쳐 쓰게 했고, 인조는 이경석에게 고치라고 명했다. 고친 비문은 1636년 겨울 청 태종의 출병과 인조의 남한산성 피신, 항복한 뒤 받은 은혜를 서술하고 삼전도의 단을 높이고 비를 세워 청 황제의 공덕을 영원히 기리겠다는 뜻을 담았다. 비는 1639년(인조 17) 세워졌고 비액은 대청황제공덕비이며, 글씨는 오준이 해서로 쓰고 전액은 여이징이 썼다. 앞면에는 왼쪽에 몽골 문자, 오른쪽에 만주 문자를 새기고 뒷면에는 한문 해서를 새겼는데, 같은 내용을 세 가지 문자로 담은 것은 이 비가 유일하다고 한다. 『인조실록』은 인조 17년 12월 5일 기사에 삼전도 비의 일을 끝냈다고 적으며, 공사를 맡은 감역관 등에게 등급에 따라 상을 내렸고 사관은 상을 받은 자들이 사대부의 마음을 가졌다면 이를 부끄럽게 여겼어야 한다는 취지로 비판했다. 항복의 치욕을 영원히 남기는 비를 청의 요구로 세워야 했던 일은 조선이 청과 군신 관계를 맺게 된 현실을 보여 주는 상징이었다."
  subjects: [joseon, qing]
  tags: [diplomacy]
  sources: ["『인조실록』 인조 16년 2월 8일", "『인조실록』 인조 17년 12월 5일", "한국학중앙연구원 『한국민족문화대백과사전』 '서울 삼전도비'", "『인조실록』 인조 5년 3월 3일"]

- id: qing-conquest-1644
  year: 1644
  title:
    ko: 명의 멸망과 청의 중국 지배
  summary:
    ko: "이자성의 반란군이 베이징을 함락해 명이 망하고, 청이 산해관을 넘어 베이징에 도읍했다. 조선에서는 명을 높이는 존명 의리와 소중화 의식이 강해졌다. 숙종 때(1704)에는 창덕궁 후원에 명 신종을 제사하는 대보단이, 충청도 괴산 화양동에 송시열의 뜻을 받든 만동묘가 세워졌다."
