  summary:
    ko: 누르하치가 임진왜란으로 명과 조선의 힘이 약해진 틈에 여진 부족을 통합하고 1615년 팔기 제도를 갖춘 뒤 1616년 후금을 세웠다. 1618년 명에 선전 포고하며 세력을 넓혔다.
  subjects: [hugeum, ming, jurchen]
