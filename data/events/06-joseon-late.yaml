  year: 1635
  title:
    ko: 영정법 실시
  summary:
    ko: 풍흉에 관계없이 전세를 토지 1결당 쌀 4~6두로 고정했다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『인조실록』 인조 13년"]

- id: byeongja-horan-1636
  year: 1636
  endYear: 1637
  title:
    ko: 병자호란과 삼전도의 굴욕
  summary:
    ko: 후금이 내몽골을 복속시키고(1635) 국호를 청으로 바꾸어(1636) 군신 관계를 요구하자 주화론(최명길)과 척화론(김상헌)이 맞섰다. 척화론에 따라 요구를 거부하자 청 태종이 쳐들어왔다. 인조는 남한산성에서 버티다 삼전도에서 항복했고, 소현 세자·봉림 대군과 척화론자(삼학사)가 청에 끌려갔다.
  subjects: [joseon, qing, hugeum, mongols]
  links:
