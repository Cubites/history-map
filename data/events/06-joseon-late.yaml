- id: pyongyang-recapture-1593
  year: 1593
  title:
    ko: 조·명 연합군의 평양성 탈환과 행주 대첩
  summary:
    ko: "1592년 음력 7월 명의 조승훈이 약 5,000명을 이끌고 먼저 들어왔으나 평양에서 크게 패했고, 12월 이여송이 약 4만 3,000명(『한국민족문화대백과사전』 '평양전투'는 5만)으로 압록강을 건너 전세를 바꾸는 발판이 되었다. 1593년 1월 6일 이른 아침 명군과 조선군이 평양성을 에워싸 오유충·사대수와 승군은 모란봉, 이여송과 장세작은 칠성문, 양원은 보통문, 조승훈·낙상지·이여백은 이일·김응서와 함께 함구문을 맡아 공격했고, 유정이 이끄는 승군은 모란봉 전투에서 일본군을 많이 쏘아 죽였다. 연광정 토굴에서 버티던 고니시 유키나가는 군량과 무기가 바닥나고 원군이 없자 이여송의 퇴각 제안을 받아들여 성을 내주었으며, 『선조실록』은 1월 9일 정오 무렵 승전 소식이 조정에 닿았다고 적으며(되찾은 날은 8일로 정리된다), 도체찰사 유성룡이 평양 수복을 장계로 보고하자 일본군이 물러나는 길목에서 수군이 수전을 준비하도록 지시했다고 적는다. 그러나 1월 27일 벽제관 전투에서 이여송이 패해 평양 쪽으로 물러났다. 2월 12일 권율은 처영의 승의병 1,000명을 포함해 1만이 채 안 되는 군사(변이중 1,000명과 선거이 4,000명은 금천·양천에 따로 있었고, 같은 사전의 '권율' 항목은 행주산성에 포진한 병력을 수천 명으로 적는다)로 행주산성을 지켜, 우키타 히데이에를 총대장으로 7개 부대로 나뉘어 공격해 온 일본군 3만여 명을 물리쳤다. 조선군은 화차·수차석포·진천뢰와 이중 목책, 재 주머니를 쓰고 권율이 직접 백병전을 지휘했으며, 일본군에서는 깃카와 부대 160명이 죽고 우키타 등이 다쳤고 관군이 벤 수급은 130급이다. 권율은 이 공으로 6월 도원수에 올랐고, 일본군은 4월 18일 한양에서 물러나 남쪽으로 내려가 남해안에 왜성을 쌓고 머물렀으며 명의 심유경이 강화 교섭을 맡았다."
  subjects: [joseon, ming, japan]
  links:
    - { from: ming, to: joseon, note: "명의 원군 파견" }
    - { from: joseon, to: japan, note: "평양성 탈환·행주 대첩" }
  tags: [war]
  sources: ["『선조실록』 선조 26년 1월 9일", "한국학중앙연구원 『한국민족문화대백과사전』 '평양전투'", "한국학중앙연구원 『한국민족문화대백과사전』 '행주대첩'", "유성룡, 『징비록』"]
