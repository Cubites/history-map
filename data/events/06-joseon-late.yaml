- id: yi-sunsin-1592
  year: 1592
  title:
    ko: 이순신의 해전 승리 (옥포·한산도 대첩)
  summary:
    ko: "이순신은 1591년 전라좌도 수군절도사로 부임해 전쟁에 대비했고, 1592년 음력 5월 7일 경상 우수사 원균과 합류해 거제 옥포에서 일본 전선 26척을 격파하며 첫 승리를 거두었다(『선조수정실록』은 같은 싸움에서 적선 30척을 만나 크게 격파했다고 적는다). 5월 29일 사천 해전에서는 거북선이 처음 실전에 나가 유인 작전으로 적선을 부쉈고, 6월 2일 당포 해전에서는 일본 장수 구루시마가 전사했다. 7월 8일 한산도 대첩에서는 이순신과 전라 우수사 이억기, 원균이 조선 전선 55척으로 와키자카 야스하루가 이끈 일본 전선 73척(대선 36·중선 24·소선 13)과 맞섰다. 조선 수군은 좁고 암초가 많은 견내량의 적을 넓은 한산섬 앞바다로 끌어낸 뒤 학익진으로 둘러싸고 포격하며 돌진했다. 『한국민족문화대백과사전』 '한산도대첩'은 일본 배 47척이 부서지거나 불타고 12척이 나포되었다고 적는 반면 같은 사전의 '이순신' 항목은 격파한 배를 59척으로 꼽아 값이 갈린다. 조선 쪽은 인명 사상은 있었으나 잃은 전선이 없었고, 일본 수군의 주력이 무너져 수륙병진 계획이 꺾이면서 조선이 남해의 제해권을 지켜 곡창 지대인 전라도를 보호했다. 한산도에서 살아남은 일본군 약 400명은 뭍으로 달아났고, 이순신은 1592년 5월부터 네 차례 출동해 옥포·합포·적진포·사천·당포·당항포·율포·한산도·안골포·부산포 등에서 잇달아 이겼다. 9월 1일 부산포 해전에서는 일본 배 100여 척을 깨뜨렸으나 녹도 만호 정운이 전사했으며, 한산도 대첩은 진주 대첩·행주 대첩과 함께 임진왜란의 3대첩으로 꼽히고 이 공으로 이순신은 정헌대부, 이억기와 원균은 가의대부 품계를 받았다."
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "조선 수군의 승리" }
  tags: [war]
  sources: ["『선조수정실록』 선조 25년 5월 1일", "한국학중앙연구원 『한국민족문화대백과사전』 '이순신'", "한국학중앙연구원 『한국민족문화대백과사전』 '한산도대첩'", "이순신, 『난중일기』"]
