- id: qing-conquest-1644
  year: 1644
  title:
    ko: 명의 멸망과 청의 중국 지배
  summary:
    ko: "이자성의 반란군이 베이징을 함락해 명이 망하고, 청이 산해관을 넘어 베이징에 도읍했다. 조선에서는 명을 높이는 존명 의리와 소중화 의식이 강해졌다. 숙종 때(1704)에는 창덕궁 후원에 명 신종을 제사하는 대보단이, 충청도 괴산 화양동에 송시열의 뜻을 받든 만동묘가 세워졌다."
  subjects: [qing, ming]
  links:
    - { from: qing, to: ming, note: "베이징 점령" }
  tags: [war, politics]
  sources: ["『인조실록』 인조 22년", "『청사고』"]

