- id: mao-wenlong-1621
  year: 1621
  endYear: 1629
  title:
    ko: 모문룡의 가도 주둔(동강진)
  summary:
    ko: "1621년 명의 장수 모문룡은 220여 명을 이끌고 진강아문을 점령했으나, 누르하치가 보낸 아민에게 진강을 빼앗기고 많은 한인과 함께 조선 땅으로 달아났다. 같은 해 12월 임반의 변으로 후금군이 다시 조선에 들어오자 광해군은 모문룡에게 섬으로 들어갈 것을 권했다. 1622년 6월 명 조정은 그를 평료총병관으로 올렸고 모문룡은 평안도 앞바다의 가도를 근거지로 삼았다. 모문룡을 구심점으로 한 동강진은 진강아문을 대신해 등래 순무와 이어지는 구실을 했고, 조선은 이 동강진이 연결한 바닷길로 산둥·톈진을 거쳐 베이징과 오갔다. 대신 조선은 막대한 부담을 졌다. 대백과는 모문룡의 죄목으로 도를 넘은 군량 요청과 조선에 대한 과도한 수탈을 든다. 1623년 반정으로 서인 정권이 들어서자 후금과 관계를 끊고 모문룡을 지원하는 친명배금 정책이 이어졌다(「인조반정」(뒤의 사건)). 후금은 모문룡 세력을 자기 후방의 위협으로 보았고, 이를 없애려는 것이 1627년 정묘호란의 한 원인이 되었다. 정묘호란 때 후금군의 일부가 가도의 모문룡을 쳐서 신미도로 몰아냈다. 대백과는 이 무렵 조선과 동강진이 후금 견제를 목표로 군사 협력을 꾀했지만 실제로는 서로 믿지 못했고 정묘호란 과정에서 그것이 드러났다고 한다. 모문룡은 전투를 피했고, 조선과 후금이 화친한 뒤에도 청천강 이북의 조선 사람을 거듭 약탈해 원성을 샀다. 1629년 6월 명의 독수 원숭환이 그를 불러 쌍도에서 처형했다. 죄목은 전공을 부풀린 일, 군량을 지나치게 요구한 일, 1626년 영원성 전투에서 협조하지 않은 일, 조선을 수탈한 일 등이었다(「숭정제의 즉위와 원숭환의 처형(1627~1630)」(뒤의 사건))."
  subjects: [joseon, ming, hugeum]
  tags: [war, diplomacy]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '가도사건'", "한국학중앙연구원 『한국민족문화대백과사전』 '정묘호란'", "한국학중앙연구원 『한국민족문화대백과사전』 '인조반정'"]

- id: injo-banjeong-1623
  year: 1623
  title:
    ko: 인조반정
  summary:
    ko: "조선의 광해군은 임해군을 제거했고, 칠서지옥을 계기로 영창 대군의 외조부 김제남을 죽이고 영창 대군을 강화에 가두었다가 숨지게 했다(「계축옥사와 영창 대군의 죽음」(앞의 사건)). 인조의 아우 능창군도 교동에서 살해되었다. 1617년 폐모론이 일어나 인목 대비의 존호를 폐하고 서궁에 가두었으며(「인목 대비 폐위(폐모론)」(앞의 사건)), 1622년에는 이이첨 세력이 대비를 해치려다 실패했다. 대외 정책에서도 명과 후금 사이의 중립 외교(「광해군의 중립 외교 (사르후 전투)」(앞의 사건))가 서인의 비판을 샀다. 이귀·김자점·김류·이괄·신경진·심기원·최명길 등 서인이 반정을 주도했고 대장은 김류가 맡았다. 『인조실록』은 무인 이서와 신경진이 먼저 큰 계획을 세우고 김류·이귀·최명길·장유·심기원·김자점 등이 모의에 참여했으며, 훈련대장 이흥립이 장유의 설득으로 내응을 약속했다고 적는다. 이이반의 고변으로 계획이 드러날 위기를 맞았으나 거사는 1623년 음력 3월 12~13일에 이어졌다. 대백과는 13일 밤의 거사라 하고 실록은 13일 새벽 창덕궁 진입으로 읽혀 시각이 갈린다. 병력은 장단에서 온 이서의 군사가 700여 명이었고 김류·이귀·심기원 등이 거느린 군사도 600~700명이었으며, 홍제원에는 처음에 수백 명만 모였다고 실록은 적는다. 능양군은 고양 연서역에서 이서와 합류해 창의문을 돌파하고 창덕궁으로 나아갔으며 창덕궁의 여러 전각이 불탔다. 능양군은 보새를 서궁의 대비에게 바쳐 즉위를 승인받았다. 광해군은 의관 안국신의 집에서 잡혀 강화로 귀양 갔고 서인으로 강등되었으며, 뒤에 태안·교동을 거쳐 제주로 옮겨져 1641년 그곳에서 죽었다. 이이첨·정인홍·이위경 등 대북파 수십 명이 처형되고 200명이 유배되었다. 『한국민족문화대백과사전』 '인조반정'은 이귀·김류 등 33명이 세 등급으로 정사공신에 책봉되었다고 적는데, 같은 사전의 '정사공신'은 53명을 녹훈했다고 적는다. 남인 이원익이 조정에 복귀해 남인이 제2세력을 이루었다. 서인 정권은 광해군의 대외 정책을 뒤집어 후금과 관계를 끊고 모문룡을 지원하는 친명배금 정책을 폈다. 논공이 공평하지 못해 서인 내부에 반목이 생겼고 이는 1년 뒤 「이괄의 난」(뒤의 사건)의 요인이 되었다. 『조선왕조실록』의 연차로 반정으로 즉위한 인조는 1623년이 1년이다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『인조실록』 인조 1년", "『인조실록』 인조 1년 3월 13일", "한국학중앙연구원 『한국민족문화대백과사전』 '인조반정'", "한국학중앙연구원 『한국민족문화대백과사전』 '인목왕후'"]

- id: yi-gwal-1624
  year: 1624
  title:
    ko: 이괄의 난
  summary:
    ko: "조선의 반정 공신 이괄은 인조반정에서 큰 공을 세워 정사공신 2등 가운데 첫째가 되었고, 한성부 판윤과 포도대장을 지낸 뒤 평안 병사 겸 부원수로 영변에 나가 군사 훈련과 성책 보수에 힘썼다. 난의 원인은 견해가 갈린다. 종래의 통설은 2등 공신 책봉과 외직 임명에 대한 앙심을 원인으로 보지만, 대백과 '이괄의 난'은 후금의 위협이 큰 때에 부원수 임명은 신중히 이루어진 인사였고 이괄도 임무에 충실했다며 집권층의 의구심이 빚은 우발적 사건으로 풀이한다. 1624년 1월 이괄과 한명련이 역모를 꾀한다는 고변이 있었으나 무고로 밝혀졌고, 집권층의 해임·압송 건의를 인조는 받아들이지 않았다. 그러나 조정이 군중에 있던 이괄의 아들 이전을 서울로 압송하려 하자 이괄은 조정의 사자를 죽이고 거병했다. 대백과는 이괄이 음력 1월 22일 영변을 떠났다고 적고, 『인조실록』은 24일 기사에 이괄이 금부도사 등을 죽이고 반란을 일으켰다는 보고와 이원익을 도체찰사로 삼은 조치를 함께 싣는다. 22일은 출발한 날이고 24일은 반란 소식이 조정에 닿아 기록된 날로 읽힌다. 항왜병 100여 명을 선봉으로 한 1만여 명이 한명련을 구출해 합류하고 도원수 장만이 있던 평양을 피해 샛길로 남하해, 황주 신교·마탄과 임진에서 관군을 연달아 깨뜨렸다. 대백과는 2월 11일 서울에 들어와 선조의 아들 흥안군 제를 왕으로 세웠고 지방의 반란군이 수도를 점령한 것은 이때가 처음이라고 적는다. 같은 날 『인조실록』에는 어가가 천안에 이르렀다는 기사와 관군이 안현에서 크게 이겼다는 기사도 있어 입성과 안현 싸움의 선후는 두 기록을 맞추어 보아야 한다. 장만의 관군이 길마재에 진을 쳤고 이괄군은 두 길로 나누어 공격했으나 크게 졌다. 인조는 공주로 피란했다. 2월 15일 밤 이괄과 한명련은 이천 묵방리에서 부하 장수들의 배반으로 목숨을 잃었고 수급이 공주의 임시 조정에 바쳐졌다. 인조는 22일 환도했고 장만·정충신·남이흥 등 32명이 진무공신이 되었다. 한명련의 아들 윤 등은 후금으로 달아나 조선의 불안한 정세를 알리며 남침을 부추겼고, 이것이 정묘호란의 원인이 되었다(「정묘호란」(뒤의 사건))."
  subjects: [joseon]
  tags: [politics]
  sources: ["『인조실록』 인조 2년", "『인조실록』 인조 2년 1월 24일", "『인조실록』 인조 2년 2월 11일", "『인조실록』 인조 2년 2월 15일", "한국학중앙연구원 『한국민족문화대백과사전』 '이괄의 난'", "한국학중앙연구원 『한국민족문화대백과사전』 '이괄'"]

- id: namhansanseong-1624
  year: 1624
  endYear: 1626
  title:
    ko: 남한산성 개축과 수어청
  summary:
    ko: "1624년 이괄의 난 때 인조가 공주로 피난하면서 도성 가까이 대피할 산성의 필요성이 제기되자, 조선의 인조가 총융사 이서에게 남한산성을 다시 고쳐 쌓게 했다. 각성을 도총섭으로 삼아 전국 8도의 승군을 동원했고, 승군을 부리고 보호하기 위해 장경사를 비롯한 절 일곱 곳을 새로 세웠다. 대백과 '남한산성'은 완공 연도를 적지 않고 명령 2년 뒤에 시설을 설치하고 광주읍의 치소를 산성 안으로 옮겼다고 하며, 우리역사넷은 1626년(인조 4) 11월에 축성을 마쳤다고 적는다. 그 무렵 설치 기록은 둘레 6,297보에 여장 1,897개, 옹성 3개, 암문 16곳, 문 4곳이라 적고, 『남한지』는 원성 안쪽 둘레를 6,290보, 바깥쪽을 7,295보로 적어 두 기록의 보수가 조금 다르다. 현대에 잰 원성 둘레는 7.545㎞, 부속 시설을 포함한 성벽 전체는 12.356㎞이다. 1624년에는 객관 인화관도 세워졌다. 수어청은 『속대전』이 1626년 남한산성을 수축하며 설치했다고 적지만, 대백과 '수어청'은 축성 당시의 기록에서 청을 세운 사실을 찾아볼 수 없다고 덧붙인다. 정묘호란 뒤인 1632년 무렵 수어사라는 직함이 생겼고 축성은 경기 병사 겸 총융사 이서가 주관했다. 병자호란을 거치며 1636년에는 수어사를 중심으로 한 남한산성 방어 체제가 갖추어졌다고 하며, 산성에 인조가 들어가 항전한 일은 「병자호란과 삼전도의 굴욕」(뒤의 사건)에서 다룬다. 1656년 무렵에는 인근 지방군이 산성에 들어가 지키는 속영 체제의 윤곽이 드러나 약 1,600명이 동원 대상이었다. 1704년에는 전·후·중의 3영과 좌·우의 2부 체제로 개편되어 군병이 약 1만 6,500명, 표하군과 군수노보까지 합치면 약 3만 2,000명에 이르렀고 주력은 경기의 속오군이었다. 수어청은 1795년 정조가 장용영을 설치하면서 폐지되어 이름만 남았다. 서울을 지키는 군영의 틀은 「5군영 체제 완성」(뒤의 사건)에서 다룬다."
  subjects: [joseon]
  tags: [politics, war]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '남한산성'", "한국학중앙연구원 『한국민족문화대백과사전』 '수어청'", "국사편찬위원회 우리역사넷 '남한산성 1624'"]

- id: jeongmyo-horan-1627
  year: 1627
  title:
    ko: 정묘호란
  summary:
    ko: "인조반정 뒤 조선의 서인 정권은 후금과 관계를 끊고 명에 가까운 친명배금 정책을 취했고, 명과 조선을 통한 교역이 막힌 후금은 물자 부족에 시달렸다. 가도의 모문룡도 후금에는 후방의 위협이었다(「모문룡의 가도 주둔(동강진)」(앞의 사건)). 여기에 「이괄의 난」(앞의 사건) 뒤 한명련의 아들 윤 등 이괄의 잔당이 후금으로 달아나 남침을 부추겼고, 대백과는 청 태종이 이를 계기로 침략 의지를 굳혔다고 적는다. 1627년 음력 1월 14일 아민이 3만 군사를 이끌고 압록강을 건너 의주를 함락했고 부윤 이완이 전사했다(신편 한국사는 의주 공격일을 13일로 적고, 『인조실록』 1월 17일 기사는 의주가 포위되어 싸우고 있으나 승패를 알 수 없다는 접반사의 보고를 싣는다). 후금군은 용천·선천을 거쳐 1월 21일 안주성을 함락했는데, 평안 병사 남이흥은 성이 무너지자 화약에 불을 붙여 스스로 죽었다. 후금군은 평양을 지나 황주까지 내려왔고 도원수 장만은 평산에서 개성으로 물러났다. 후금군 일부는 가도의 모문룡도 공격했다. 김상용이 유도대장으로 서울을 지켰고 소현 세자는 전주로 내려갔으며 인조는 강화도로 피란했다. 각지에서 일어난 의병이 후금군의 배후를 괴롭혔고 정봉수와 이립의 활약이 특히 두드러졌다. 후금군은 평산 이남으로는 내려가지 않았다. 3월 3일 강화에서 후금 사신과 맹약했다고 『인조실록』은 적는데 기사 제목은 '회맹'이다. 두 나라는 형제 관계를 맺고 조선은 명에 적대하지 않기로 했다. 전쟁은 1월 중순부터 3월 초까지로 대백과는 약 2개월이라 적는다. 맹약 뒤에도 용골산성의 정봉수는 3월 17일(음력) 묘시부터 신시까지 이어진 대규모 공격을 다섯 차례 막아 적의 선봉 수백 명을 물리쳤고 아군 사상자는 10여 명이었다고 보고했으며, 그 밑에는 용천·의주·철산의 주민 약 4천 명이 모였다. 정봉수는 후금에 항복해 용천 부사를 자칭한 미곶 첨사 장사준과 공모자 10여 명을 처단했고, 4월 5일 비변사의 건의로 용천 부사 겸 조방장이 되었다. 후금은 세폐와 중강 개시로 이득을 얻었으나 모문룡 세력을 없애지 못했고, 조선은 형제 관계를 굴욕으로 여겨 배금 경향이 굳어졌다. 양국의 관계는 더 나빠져 1636년 병자호란으로 이어졌다(「병자호란과 삼전도의 굴욕」(뒤의 사건))."
  subjects: [joseon, hugeum]
  links:
    - { from: hugeum, to: joseon, note: "후금의 침입" }
  tags: [war]
  sources: ["『인조실록』 인조 5년", "『인조실록』 인조 5년 3월 3일", "『인조실록』 인조 5년 4월 5일", "한국학중앙연구원 『한국민족문화대백과사전』 '정묘호란'"]
