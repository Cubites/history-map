- id: jinju-1592
  year: 1592
  title:
    ko: 진주 대첩
  summary:
    ko: 진주 목사 김시민이 적은 병력으로 진주성을 지켜 일본군의 전라도 진출을 막았다. 이듬해 2차 진주성 전투에서는 성이 함락되었다.
  subjects: [joseon, japan]
  links:
