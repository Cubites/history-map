- id: gyeongsin-famine-1670
  year: 1670
  endYear: 1671
  title:
    ko: 경신 대기근
  summary:
    ko: "현종 11년인 1670년 가을부터 전례 없는 강추위와 대기근이 닥치고 전염병이 맹위를 떨쳐, 현종 11~12년(1670~1671)의 재난은 뒷날 경신 대기근이라 불렸다. 우리역사넷의 『신편 한국사』는 이때 100만 명 이상의 인명 피해가 났다고 서술하는데 이는 출처 주석이 없는 추정이다. 같은 책의 호구 표에서 조선 정부가 파악한 호구는 1670년 1,342,074호·5,164,524구에서 1672년 1,205,866호·4,720,815구로 줄었고, 1669~1672년은 인구가 감소한 시기로 꼽힌다. 『현종개수실록』 현종 12년(1671) 음력 12월 30일 기사는 이달 각 도에서 전염병으로 죽은 사람이 1,160여 명이라고 적고, 같은 날 이해 구휼에 쓴 물자를 쌀 4만 2천 4백 석, 콩 6,570석, 좁쌀 11,200석, 보리 9,800석, 밀 900석, 은 66,800냥, 무명 45동, 포 280동, 소금 500석으로 헤아렸으며 각 고을이 따로 쓴 것은 이 셈에 들지 않는다고 덧붙였다. 같은 해 12월에는 관서 지방의 원회미를 이듬해 봄까지 서울로 옮겨 진휼하라는 명(2일)과 영남의 기근이 심하다는 보고(23일), 전라도 연해안의 굶주린 백성을 진구하라는 명(23일)이 『현종개수실록』에 잇따라 실려 있다. 기민 구제책으로 부역을 돈을 주고 사람을 부리는 방식으로 바꾸면서 서울에 품팔이 일자리가 늘어 유민이 몰려들었다고 보는 견해도 있다. 『신편 한국사』는 현종 11년(1670) 원군 13,700명과 보인 41,100명, 합쳐 54,800명 규모로 훈련별대가 만들어졌다고 적는데(대백과 '훈련도감'은 훈련별대 설치를 1669년(현종 10)으로 적는다) 군액이 늘었으나, 대기근 뒤에는 양역 변통론이 강하게 제기되어 군역을 지는 사람의 총수(역총, 약 100만 명)를 고정하거나 줄이는 정책이 이어졌다."
  subjects: [joseon]
  tags: [society, economy]
  sources: ["『현종개수실록』 현종 12년 12월 30일", "국사편찬위원회 『신편 한국사』 30", "한국학중앙연구원 『한국민족문화대백과사전』 '훈련도감'"]

- id: sanfan-taiwan-1673
  year: 1673
  endYear: 1683
  title:
    ko: 삼번의 난과 청의 타이완 정복
  summary:
    ko: "청 강희제가 번(藩)을 거두려 하자 오삼계 등 삼번이 반란을 일으켜(1673~1681) 한때 청의 남쪽이 크게 흔들렸다. 청은 이를 진압한 뒤 1683년 정성공의 후손이 다스리던 타이완을 항복시켰다(지도는 1683년부터 타이완을 청의 땅으로 그린다). 조선에서는 현종 말·숙종 초 청의 내란 소식이 전해지자 윤휴 등이 북벌을 다시 주장했으나(1674~1676), 1680년 경신환국으로 윤휴가 사사되며 힘을 잃었다."
  subjects: [qing, joseon]
  links:
    - { from: qing, to: joseon, note: "청의 내란, 북벌론 재론" }
  tags: [war, politics]
  sources: ["『청사고』 성조본기", "『숙종실록』"]

