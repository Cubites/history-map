  subjects: [joseon]
  tags: [culture]
  sources: ["이중환, 『택리지』"]

- id: folk-culture-1750
  year: 1750
  precision: century
  title:
    ko: 서민 문화의 발달 (풍속화·판소리·한글 소설)
  summary:
    ko: 상공업이 발달하고 서민의 경제력이 커지면서 서민 문화가 꽃피었다. 김홍도는 서민의 일상을, 신윤복은 양반과 부녀자의 생활을 풍속화로 그렸다. 판소리와 탈춤이 유행했고, 「홍길동전」·「춘향전」 같은 한글 소설과 사설시조가 널리 읽혔다. 민화도 유행했다.
  subjects: [joseon]
  tags: [culture, society]
