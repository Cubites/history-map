- id: pyemo-1618
  year: 1618
  title:
    ko: 인목 대비 폐위(폐모론)
  summary:
    ko: "조선의 인목 대비는 1584년에 태어나 1602년 선조의 계비가 되었고 1603년 정명공주를, 1606년 영창 대군을 낳았다. 1613년 계축옥사로 아버지 김제남과 형제들이 처형되고 영창 대군이 죽자 대비의 처지는 크게 흔들렸다(「계축옥사와 영창 대군의 죽음」(앞의 사건)). 대북 정권이 대비를 쫓아내자는 폐모론을 본격으로 일으킨 것은 1617년이다. 허균이 이해에 좌참찬으로 폐모론을 주장했다(「허균의 처형과 『홍길동전』」(뒤의 사건)). 대백과 '인조반정'은 1617년 폐모론이 일어나 대비의 존호를 폐하고 서궁에 가두었다고 적고, '인조' 항목은 1618년 대비를 폐서인으로 만들어 서궁(경운궁)에 유폐했다고 적는다. 반면 '인목왕후' 항목은 폐위와 서궁 유폐를 1613년의 계축옥사에 이어 서술하면서 1623년까지 서궁 생활이 10년이었다고 적어 폐위 시점이 갈린다. 대비를 쫓아내자는 논의는 1617년에 불거졌고, 대비를 서궁에 가두는 폐모 조치는 1618년에 실행되었다. 대비는 딸 정명공주와 함께 서궁에 갇혔다. 폐모에 맞선 기자헌 같은 관료는 유배되었고 대북파가 정권을 장악했다. 1622년에는 이이첨 세력이 대비를 해치려다 실패했다고 대백과는 적는다. 1623년 3월 13일 밤 반정에 성공한 능양군(뒤의 인조)이 신하를 보내 즉위의 승인을 청했으나 대비는 곧바로 응하지 않았다. 인조가 직접 서궁에 가 간청했고, 대비는 광해군을 엄히 벌하겠다는 약속을 받은 뒤 보새, 곧 국권을 상징하는 임금의 도장인 어보를 넘겨 서궁에서 인조를 즉위시켰다. 대비의 폐위와 유폐는 인조반정의 명분이 되었다(「인조반정」(뒤의 사건)). 대비는 복위해 대왕대비가 되었고 1632년 세상을 떠났다."
