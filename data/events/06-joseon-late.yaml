    - { from: joseon, to: usa, note: "평양 관민이 배를 불태움" }
  tags: [diplomacy, war]
  sources: ["『고종실록』 고종 3년"]
  places: [{ name: "대동강 (평양)", at: [125.75, 39.02] }]

- id: byeongin-yangyo-1866
  year: 1866
  title:
    ko: 병인박해와 병인양요
  summary:
    ko: 대원군이 프랑스 선교사 9명과 천주교 신자 수천 명을 처형했다(병인박해). 이를 구실로 프랑스 함대가 강화도를 침공했으나 한성근(문수산성)과 양헌수(정족산성)가 물리쳤다. 프랑스군은 물러나며 외규장각 의궤 등을 약탈했다.
  subjects: [joseon, france]
  links:
    - { from: france, to: joseon, note: "강화도 침공, 외규장각 도서 약탈" }
    - { from: joseon, to: france, note: "문수산성·정족산성 항전" }
  tags: [war, religion]
  sources: ["『고종실록』 고종 3년"]
  places: [{ name: "문수산성", at: [126.55, 37.72] }, { name: "정족산성", at: [126.49, 37.63] }]

- id: oppert-1868
  year: 1868
  title:
    ko: 오페르트 도굴 사건
  summary:
    ko: 통상을 거부당한 독일 상인 오페르트가 흥선 대원군의 아버지 남연군의 묘를 도굴하려다 실패했다. 서양에 대한 반감이 더욱 커졌다.
  subjects: [joseon]
  tags: [diplomacy]
  sources: ["『고종실록』 고종 5년"]

- id: meiji-1868
  year: 1868
  endYear: 1869
  title:
    ko: 메이지 유신과 서계 문제
  summary:
    ko: "1868년 메이지 정부가 세워지고 보신 전쟁이 일어났다. 1869년 하코다테에서 막부 잔존 세력(에조 공화국)이 항복했고 일본은 에조치를 홋카이도로 고쳐 개척사를 두었다(지도는 1869년부터 홋카이도를 일본 땅으로 그린다). 새 정부는 쓰시마 번을 통해 조선에 왕정 복고를 알리는 서계를 보냈으나 조선은 격식이 옛 관례와 다르다며 받지 않았다(1868~1869). 이 서계 문제는 뒤에 정한론(1873)과 운요호 사건(1875,)으로 이어졌다."
  subjects: [japan, joseon]
  links:
    - { from: japan, to: joseon, note: "왕정 복고를 알리는 서계(1868)" }
    - { from: joseon, to: japan, note: "서계 접수 거부" }
  tags: [diplomacy, politics]
  sources: ["『고종실록』 고종 5년", "『일본외교문서』 제1권"]

- id: sinmi-yangyo-1871
  year: 1871
  title:
    ko: 신미양요와 척화비
  summary:
    ko: 미국이 제너럴셔먼호 사건을 구실로 강화도를 침공해 초지진과 광성보를 점령했다. 어재연이 광성보에서 싸우다 전사했으나 조선이 통상을 거부하자 미군은 물러났다. 대원군은 전국에 척화비를 세웠다.
  subjects: [joseon, usa]
  links:
    - { from: usa, to: joseon, note: "강화도 침공" }
    - { from: joseon, to: usa, note: "광성보 항전, 통상 거부" }
  tags: [war]
  sources: ["『고종실록』 고종 8년"]
  places: [{ name: "초지진", at: [126.54, 37.61] }, { name: "광성보", at: [126.52, 37.67] }]

- id: gojong-rule-1873
  year: 1873
  title:
    ko: 흥선 대원군 하야와 고종의 친정
  summary:
    ko: 최익현이 대원군의 정책을 비판하는 상소를 올린 것을 계기로 대원군이 물러나고 고종이 직접 정치를 맡았다. 민씨 세력이 정권을 잡았다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 10년"]

- id: unyo-1875
  year: 1875
  title:
    ko: 운요호 사건
  summary:
    ko: "일본 군함 운요호가 강화도 초지진에 접근해 포격전을 벌이고 영종도를 공격했다. 일본은 이를 구실로 조선에 개항을 요구했다. 앞서 흥선 대원군 정권이 메이지 정부의 외교 문서(서계)가 격식에 어긋난다며 받지 않자(1868), 일본에서는 조선을 정벌하자는 정한론이 일어났다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "강화도 무력 시위" }
  tags: [war, diplomacy]
  sources: ["『고종실록』 고종 12년"]
  places: [{ name: "초지진", at: [126.54, 37.61] }, { name: "영종진", at: [126.52, 37.47] }]

- id: ganghwa-treaty-1876
  year: 1876
  title:
    ko: 강화도 조약 (조일 수호 조규)
  summary:
    ko: "조선이 일본과 맺은 첫 근대적 조약이자 불평등 조약이다. 조선을 자주국으로 규정해 청의 간섭을 막으려 했고, 부산 외 2개 항구 개항, 해안 측량권, 치외 법권(영사 재판권)을 인정했다. 개항 이후의 역사는 7번 묶음에서 다룬다. 최익현은 일본과 서양이 다르지 않다는 왜양일체론을 내세워, 도끼를 지고 궁궐 앞에 엎드려 개항에 반대했다(지부복궐척화의소). 조약에 따라 부산(1876)에 이어 원산(1880)과 인천(1883)이 열렸다."
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "개항 강요, 불평등 조약" }
  tags: [diplomacy]
  sources: ["『고종실록』 고종 13년"]

