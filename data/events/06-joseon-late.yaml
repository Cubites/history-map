- id: gukseo-gaejak-1635
  year: 1635
  title:
    ko: 국서 개작 사건
  summary:
    ko: "1609년 기유약조 뒤 조선은 쓰시마 도주를 통해 에도 막부와 간접으로 통교했다(「일본과 국교 재개 (기유약조)」(앞의 사건)). 조선이 국교 재개의 조건으로 일본 국왕 명의의 국서를 요구하자 쓰시마는 국서를 고쳐 쓰는 변칙으로 이를 맞추었는데, 1635년 조선 국왕의 국서를 위조하거나 고친 일이 드러났다. 대백과 '도서'는 쓰시마 도주가 쓴 것으로 추정되는 도서의 모조인 목인 14개(10종류)가 확인된다고 적고, 이것이 도주가 국서를 위조·개찬했음을 보여 주는 자료라고 설명한다. 이 사건으로 이정암송사를 맡던 승려 현방(겐포)이 유배되었다. 이정암송사는 임진왜란 뒤 국교 회복에 힘쓴 승려 현소에게 1611년부터 허가된 배였고, 현소가 죽은 뒤 제자 현방이 이어받았다. 1638년부터는 쓰시마 도주 소씨가 이 권한을 이어받았다. 유천송사도 사건이 드러난 뒤인 1640년부터 부특송사라는 이름으로 건너왔다. 조선이 통교 상대에게 내주던 도서의 사급 대상은 이 사건 뒤 쓰시마 도주로 한정되었다. 기유약조로 쓰시마 도주의 세견선 20척과 수직인선 5척·수도서선 5척이 해마다 오가던 연례송사는 겸대 제도가 시행되며 여덟 사절로 나뉘어 1·2·3·6·8월에 순번대로 건너오는 연례팔송사가 되었는데, 겸대의 시행 연도를 대백과 '팔송사'는 한 곳에서 1635년, 다른 곳에서 1637년으로 적어 서로 맞지 않는다. 대백과 '통신사'는 1636년 파견된 사행(정사 임광, 부사 김세렴, 478명)의 목적으로 명·청 교체에 따른 일본과의 연대감, 국서 개작 사건 뒤 쓰시마 도주의 옹호, 국정 탐색을 든다. 『신편 한국사』는 쓰시마 도주의 가신으로 막부와 가까웠던 야나가와(유천) 가문이 1635년 3월 이 일을 폭로했고, 막부가 도주 쪽을 택해 조선과의 통교 경로를 도주의 소씨 가문으로 일원화했으며 외교 문서를 맡았던 야나가와 가문과 이정암 승려들이 처벌을 받았다고 적는다. 막부는 이 뒤 교토 오산의 승려를 이정암에 2년씩 교대로 보내 조선과 주고받는 외교 문서의 작성과 검열을 맡겼다."
  subjects: [joseon, japan]
  tags: [diplomacy]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '도서'", "한국학중앙연구원 『한국민족문화대백과사전』 '팔송사'", "한국학중앙연구원 『한국민족문화대백과사전』 '통신사'", "국사편찬위원회 『신편 한국사』 32"]

- id: byeongja-horan-1636
  year: 1636
  endYear: 1637
  title:
    ko: 병자호란과 삼전도의 굴욕
  summary:
    ko: 후금이 내몽골을 복속시키고(1635) 국호를 청으로 바꾸어(1636) 군신 관계를 요구하자 주화론(최명길)과 척화론(김상헌)이 맞섰다. 척화론에 따라 요구를 거부하자 청 태종이 쳐들어왔다. 인조는 남한산성에서 버티다 삼전도에서 항복했고, 소현 세자·봉림 대군과 척화론자(삼학사)가 청에 끌려갔다.
