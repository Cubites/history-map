- id: jeong-duwon-1631
  year: 1631
  title:
    ko: 정두원의 서양 문물 도입
  summary:
    ko: "『인조실록』은 1631년 음력 7월 12일 기사에 조선의 진주사 정두원이 명의 서울에서 돌아와 천리경·서포·자명종·염초화·자목화 등을 바쳤다고 적고, 서포는 서양 사람 육약한, 곧 로드리게스가 중국에 와서 정두원에게 준 것이라고 덧붙인다. 대백과 '자명종'은 이 일을 1631년(인조 9) 7월 진주사로 간 정두원이 육약한에게서 자명종을 선물로 받아 왔다고 적고, 이를 우리나라에서 가장 오랜 자명종 전래 기록으로 소개한다. 대백과 '정두원'이 적은 물품은 기계로 화포·천리경·자명종, 서적으로 이마두, 곧 마테오 리치의 천문서와 『직방외기』·『서양국풍속기』·『천문도』·『홍이포제본』이며, 새로운 화약 제조법도 이때 전해졌다고 전한다. 서적에는 세계 지리와 서양 풍속을 소개한 책들이 들어 있었다. 정두원은 1581년생이고 몰년은 알려지지 않았다. 대백과 '정두원'은 그가 1631년 사신으로 가서 이듬해 돌아왔다고 적어 귀국 해가 실록 기사와 갈린다. 당시 조선은 후금이 요동을 압박하는 가운데 모문룡의 동강진이 이어 준 바닷길로 산둥과 톈진을 거쳐 베이징과 오갔다(「모문룡의 가도 주둔(동강진)」(앞의 사건)). 서양 문물은 이런 사행을 통해 중국에서 중개되어 들어왔다. 정두원은 이 문물 도입에 참여한 인물 가운데 이름이 알려진 최초의 인물로 평가된다. 자명종은 뒤에 1669년 송이영, 1715년 허원이 만들었다는 기록이 이어져 국내에서 제작이 이루어졌음을 알 수 있다. 이 사행과 천리경은 같은 무렵 유럽에서 망원경으로 천문학 논쟁이 벌어지던 시기와 겹친다(「갈릴레이의 종교 재판과 과학 혁명」(뒤의 사건)). 서양 천문·역법 지식은 청을 거쳐 시헌력의 채택으로 이어진다(「시헌력 채택」(뒤의 사건))."
  subjects: [joseon, ming]
  tags: [culture]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '정두원'", "한국학중앙연구원 『한국민족문화대백과사전』 '자명종'", "『인조실록』 인조 9년 7월 12일"]

- id: gapsul-yangjeon-1634
  year: 1634
  endYear: 1639
  title:
    ko: 삼남 갑술양전
  summary:
    ko: "1634년(인조 12) 8월 조선은 충청·전라·경상의 삼남 지방에서 양전, 곧 토지 조사를 실시했다. 대백과 '양전'은 이를 임진왜란으로 황폐해진 땅을 다시 파악하던 대표적 양전의 하나로 소개한다. 토지의 경계가 바르지 않아 세금 부담이 고르지 못했고 권세가가 땅을 겸병해 서민이 고통을 겪던 때였다. 충청도 양전사로 파견된 정기광(1579~1645)은 양전에서 빠진 결수를 남김없이 찾아내 부과를 더 무겁게 하여 백성의 원망을 샀다고 전한다. 대백과 '양전'은 이 양전을 1634년의 삼남 양전이라 적고 '삼정'은 1634~1639년의 갑술양전이라 적어 끝나는 해가 갈린다. '삼정'은 1601~1603년의 계묘양전, 1718~1720년의 경자양전과 함께 이를 삼남 지방을 중심으로 이루어진 세 차례의 국가 차원 양전으로 꼽고, 뒤에는 국가 차원의 양전이 열리지 못해 군현별로 읍양전을 추진했다고 한다. 1634년에는 양전의 기준 자도 다시 정해졌다. 1444년 세종 때에는 1등전 1파를 0.986㎡로 보았으나, 1634년에는 주척을 21.733㎝로 보아 1등전 1파를 약 1.081㎡로 계산했다(2등전 1파 1.272㎡, 6등전 1파 4.324㎡). 등급별 척은 1653년 효종 때 양전법을 고치면서 폐지되고 1등 전척으로 통일되었다. 양전은 세 부담에도 영향을 미쳤다. 삼수병을 기르려고 거두던 삼수미는 1602년 함경·평안을 뺀 6도에서 전 1결마다 2두 2승을 전세미에 더해 거두었는데, 1634년 양전 뒤 삼남에서는 1두를 영구히 줄여 1결당 1두 2승만 내게 했다. 경기도는 병자호란 뒤 아예 면제되었다. 이듬해에는 풍흉과 관계없이 전세를 고정하는 「영정법 실시」(뒤의 사건)가 이어졌다."
  subjects: [joseon]
  tags: [economy, politics]
  sources: ["한국학중앙연구원 『한국민족문화대백과사전』 '양전'", "한국학중앙연구원 『한국민족문화대백과사전』 '삼정'", "한국학중앙연구원 『한국민족문화대백과사전』 '정기광'", "한국학중앙연구원 『한국민족문화대백과사전』 '삼수미'", "한국학중앙연구원 『한국민족문화대백과사전』 '파'"]

