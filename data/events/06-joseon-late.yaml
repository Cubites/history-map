- id: dongguk-munheon-1770
  year: 1770
  title:
    ko: "『동국문헌비고』 편찬"
  summary:
    ko: "영조의 명으로 홍봉한 등이 우리나라의 역대 제도와 문물을 분야별로 정리한 『동국문헌비고』 100권을 펴냈다. 천문·지리·예악·군사·형벌·재정·호구·시장·과거·학교·관직 등 13개 부문으로 나누어 서술한 한국학 백과사전이다. 이후 여러 차례 보완되어 대한제국 때 『증보문헌비고』(1908)로 완성되었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『영조실록』 영조 46년", "『동국문헌비고』"]

- id: jangsi-1770
  year: 1770
  precision: century
  title:
    ko: "장시와 포구 상업의 발달"
  summary:
    ko: "18세기 중엽 전국의 장시가 1천여 곳에 이르렀고, 대개 5일마다 열려 인근 장시들과 하나의 지역 시장권을 이루었다. 보부상이 장시를 돌며 물건을 팔아 생산자와 소비자를 이어 주었다. 물자가 모이는 포구도 상업 중심지로 성장해 객주와 여각이 상품의 매매 중개는 물론 운송·보관·숙박·금융 업무까지 맡았다. 광주 송파장, 은진 강경장, 덕원 원산장처럼 전국적인 유통의 거점이 된 큰 장시도 나타났다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『동국문헌비고』 시적고", "서유구, 『임원경제지』 예규지"]

- id: dongsa-gangmok-1778
  year: 1778
  title:
    ko: "안정복의 『동사강목』"
  summary:
    ko: "이익의 제자 안정복이 고조선부터 고려 말까지의 역사를 강목체로 정리한 『동사강목』을 완성했다. 단군–기자–마한–통일 신라–고려로 이어지는 독자적인 정통론을 세웠고, 삼국은 정통이 없는 시기로 보았다. 여러 기록을 비교해 사실을 따지는 고증을 중시해 역사 연구의 수준을 높였다. 같은 무렵 이긍익은 조선의 야사를 사건별로 정리한 기사본말체 역사서 『연려실기술』을 지었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["안정복, 『동사강목』", "이긍익, 『연려실기술』"]

- id: jasan-eobo-1814
  year: 1814
  title:
    ko: "정약전의 『자산어보』"
  summary:
    ko: "신유박해로 흑산도에 유배된 정약전(정약용의 형)이 섬 주민 장창대의 도움을 받아 흑산도 근해의 물고기와 바다 생물을 직접 관찰하고 기록한 『자산어보』를 지었다. 생물의 이름·생김새·습성·쓰임새를 분류해 적은 어류학서로, 실학자들의 실증적인 자연 연구를 보여 준다."
  subjects: [joseon]
  tags: [culture]
  sources: ["정약전, 『자산어보』 서문"]

- id: seoeol-tongcheong-1823
  year: 1823
  endYear: 1851
  title:
    ko: "서얼 허통과 중인의 통청 운동"
  summary:
    ko: "서얼들은 높은 관직에 오르지 못하게 한 제한을 풀어 달라고 거듭 상소했다. 정조 때 규장각 검서관으로 일부가 등용되었고, 순조 때(1823) 서얼 1만여 명이 함께 상소를 올렸으며, 철종 때(1851) 신해허통으로 청요직 진출이 허용되었다. 역관·의관 등 기술직 중인도 이에 자극받아 1851년 대규모 소청 운동을 벌였으나 뜻을 이루지 못했다. 중인들은 시사를 만들어 위항 문학을 이끌었고, 일부는 뒤에 개화사상 형성에 참여했다."
  subjects: [joseon]
  tags: [society]
  sources: ["『순조실록』 순조 23년", "『철종실록』 철종 2년"]

- id: wijeong-cheoksa-1866
  year: 1866
  endYear: 1876
  title:
    ko: "위정척사 운동 (척화주전론과 왜양일체론)"
  summary:
    ko: "성리학의 질서를 지키고(위정) 천주교와 서양 문물을 물리치자는(척사) 위정척사 사상이 서양 세력의 침략을 겪으며 운동으로 번졌다. 병인양요 무렵 이항로·기정진은 서양과 싸워야 한다는 척화주전론을 펴서 흥선 대원군의 통상 거부 정책을 뒷받침했다. 1876년 일본과 조약을 맺으려는 움직임이 일자 최익현은 일본도 서양 오랑캐와 다를 바 없다는 왜양일체론을 들어, 도끼를 지니고 궁궐 앞에 엎드려 개항 반대 상소를 올렸다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『고종실록』 고종 3년·13년", "최익현, 『면암집』 「지부복궐척화의소」", "이항로, 『화서집』"]

- id: gaehwa-thought-1870
  year: 1870
  precision: decade
  title:
    ko: "통상 개화론과 개화사상의 형성"
  summary:
    ko: "북학파 박지원의 손자 박규수, 청을 오가며 『해국도지』·『영환지략』 같은 세계 지리서를 들여온 역관 오경석, 의관 유홍기(유대치) 등이 서양과 통상하고 기술을 받아들여 나라를 부강하게 해야 한다는 통상 개화론을 폈다. 박규수의 사랑방에는 김옥균·박영효·홍영식·유길준 등 젊은 양반 자제들이 드나들며 이들의 영향을 받았다. 이들은 뒤에 개화파를 이루어 개항 이후의 개화 정책을 이끌었다."
  subjects: [joseon, qing]
  links:
    - { from: qing, to: joseon, note: "『해국도지』·『영환지략』 등 세계 정세서 전래" }
  tags: [politics, culture]
  sources: ["박규수, 『환재집』", "국사편찬위원회 『신편 한국사』 (서세 동점과 문호 개방)"]
