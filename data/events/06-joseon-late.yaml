- id: sarhu-1619
  year: 1619
  title:
    ko: 광해군의 중립 외교 (사르후 전투)
  summary:
    ko: 명의 요청으로 강홍립이 이끄는 군대를 보냈으나, 광해군은 형세를 보아 행동하게 해 사르후 전투에서 후금에 항복하게 했다. 명과 후금 사이에서 실리를 찾은 중립 외교였다.
  subjects: [joseon, ming, hugeum]
  links:
