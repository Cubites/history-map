# 6번 묶음: 조선 후기 (1592 ~ 1876)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 2026-10-09(작업 C2): 동아시아 맥락 사건 3개를 더했다(삼번의 난과 청의 타이완 정복, 청의 외몽골·티베트·칭하이 복속, 메이지 유신과 서계 문제). 한국과 닿은 유럽 쪽 항목은 subjects로 이었다.
# 『조선왕조실록』의 왕 연차는 즉위 이듬해가 1년이다. 반정으로 즉위한 인조는 1623년이 1년이다.
# 1876년 강화도 조약은 이 묶음의 마지막 사건으로 넣고, 개항 이후는 7번 묶음에서 다룬다.
# 1592~1723년 구간에서 다시 쓰거나 새로 넣은 사건은 고교 세계사 본문급(글 800자 이상 1,600자 이하)으로 쓰고, 날짜는 실록의 음력 그대로 적어 사건마다 처음 한 번 '음력'을 밝힌다. 근거는 『조선왕조실록』 기사, 한국민족문화대백과사전, 신편 한국사 순으로 썼다.

# ── 임진왜란과 정유재란 (1592 ~ 1598) ───────────────────

- id: imjin-war-1592
  year: 1592
  title:
    ko: 임진왜란 발발
  summary:
    ko: "1592년 음력 4월 도요토미 히데요시가 보낸 일본군이 부산에 이르러 부산진을 함락했고 이튿날 동래성이 무너져 부산진 첨사 정발과 동래 부사 송상현이 전사했다. 일본군은 두 갈래로 나뉘어 김해·밀양 등을 차례로 떨어뜨렸고 병사 이각은 군사를 두고 먼저 달아났으며, 『선조실록』은 조선 백성이 200년간 전쟁을 겪지 않아 소문만 듣고도 무너졌다고 전한다. 『선조실록』은 부산진 함락을 4월 13일 기사에 싣고, 『한국민족문화대백과사전』은 고니시 유키나가의 선봉이 14일 부산 앞바다에 닿아 곧바로 공격했다고 적고 표에는 부산 함락을 4월 14일, 동래성 함락을 15일로 올려 개전일이 하루 갈린다. 히데요시는 전국을 통일한 뒤 쓰시마 도주 소 요시토시를 통해 조선에 통신을 요구하고 명을 치겠다며 길을 빌려 달라 했으나 조선이 거절했다. 1590년 통신사로 다녀온 황윤길과 김성일의 보고가 엇갈려 조정은 방비를 이어 가지 못했는데(「황윤길·김성일의 일본 사행」), 일본군은 9개 부대로 나뉜 육군 정규병이 약 15만 8,700명(같은 항목의 번대별 합산은 15만 8,000명)이었고 수군 약 9,000명이 따로 있었으며, 정규 전투 부대 밖 병력까지 합친 전체는 20여만 명, 일본이 침입할 때의 총병력은 30여만 명이라고 한다. 상주에서 이일이 패한 뒤 신립은 충주 탄금대에 배수진을 쳤으나 크게 져 물에 몸을 던졌는데, 이 싸움을 대백과사전은 4월 26일로 적는 데 비해 『선조실록』은 4월 28일 기사에 충주 패전의 보고와 선조가 처음 파천을 꺼낸 일, 광해군을 세자로 정한 일을 함께 싣는다. 선조는 4월 30일 새벽 큰비 속에 한양을 떠났는데 호종하는 종친과 문무관이 100명이 못 되었고 고니시는 5월 2일, 가토 기요마사는 5월 3일 한양에 들어갔다. 일본군은 6월에 평양을 차지했고 가토의 부대는 함경도 전체를 손에 넣어 일본군 점령지가 북쪽 끝까지 넓어졌으며, 선조는 평양을 거쳐 의주로 옮겨 명에 원군을 청했다."
  subjects: [joseon, japan, imjin-occupied]
