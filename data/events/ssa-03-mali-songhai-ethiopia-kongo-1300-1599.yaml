- id: funj-1504
  year: 1504
  endYear: 1504
  title:
    ko: "푼지 술탄국의 성립과 알로디아의 끝(1504)"
  summary:
    ko: "푼지 술탄국은 1504년 아마라 둔카스가 푸른 나일강 가에 센나르를 도읍으로 삼아 연 나라로 본다. 푼지는 남쪽에서 올라온 아랍화한 사람들로 기원이 분명하지 않고, 아마라는 이슬람으로 개종한 인물이었다. 19세기에 적힌 『푼지 연대기』는 아마라가 압달라브 부족 연합의 지도자 압달라 잠마와 손잡고 알로디아의 옛 도읍 소바를 쳤다고 전한다. 그러나 학자들은 압달라브가 그보다 앞서 스스로 소바를 차지했으리라 본다. 압달라 잠마는 15세기에 부족 연합을 세워 알로디아의 남은 세력을 없앴다고 전한다. 소바가 도읍 구실을 그친 것이 12세기라는 점을 들어 알로디아가 훨씬 일찍 무너졌다고 보는 견해도 있으나, 이 사건은 알로디아의 끝을 1504년으로 쓴다. 푼지 술탄국이 서자 압달라브 우두머리들은 술탄 아래 낮은 자리를 받아들였다. 술탄 계보는 자료마다 재위 해가 조금씩 달라 아마라는 1503년 또는 1504년부터 1533~1534년(이슬람력 940년)까지 자리에 있었고, 나일(~1550~1551), 압달 카디르 1세(~1557~1558), 아부 사키킨(~1568), 다킨(~1585~1586)이 차례로 이어진다. 18세기 여행가 제임스 브루스가 옮긴 이야기는 센나르 서쪽 아르바지 가까운 곳의 싸움을 건국의 계기로 전한다. 센나르가 도시로 자리 잡은 것은 라바트 1세(1616~1617년부터 1644~1645년)의 치세라는 설명도 있다. 센나르가 고정된 도읍이 되고 푼지 술탄국이 누비아와 동쪽 땅으로 힘을 뻗는 것은 17세기 이후의 일이다. 마쿠리아가 사라진 뒤 나일강 상류에 남아 있던 기독교 왕국은 이렇게 알로디아의 끝과 함께 무대에서 물러났다."
  subjects: [funj-sultanate, alodia]
  tags: [politics, religion]
  sources: ["R. S. O'Fahey and Jay Spaulding, Kingdoms of the Sudan (Methuen, 1974)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 센나르, at: [33.62, 13.55], year: 1504 }]

- id: afonso-kongo-1506
  year: 1506
  endYear: 1543
  title:
    ko: "아폰수 1세와 콩고 왕국의 기독교화, 노예 무역(1506~1543)"
  summary:
    ko: "콩고 왕국의 주앙 1세(은징가 아 은쿠우)가 1506년 숨지자 아들 아폰수와 이복형제 음판주 아 키티마가 왕위를 다퉜다. 아폰수는 이 짧은 내전에서 이겨 1509년 왕위에 올랐다. 아폰수의 연대기 작가들은 승리를 성 야고보의 기적 덕으로 돌렸다. 아폰수 1세는 기독교를 궁정과 지방에 퍼뜨렸고 귀족 자제가 글을 배우도록 학교를 두었다고 하며, 포르투갈 사람들은 도읍 음반자콩구를 상사우바도르라 불렀다고 한다. 아들 엔히크는 1518년 주교가 되어 1520년대 초부터 1531년 숨질 때까지 콩고에서 일했다. 포르투갈은 사제와 기술자, 총과 직물을 보냈으나 곧 노예 무역을 둘러싼 갈등이 커졌다. 아폰수는 1526년 포르투갈 왕에게 편지를 써, 불법으로 사람이 잡혀 팔려 간다고 항의하고 거래를 통제하게 해 달라고 청했다고 전한다. 이 편지는 주앙 3세 앞으로 보냈다고 알려져 있으나, 항의 뒤에도 거래는 이어졌다. 교황청이 엔히크를 주교로 올린 것은 콩고가 유럽 기독교 세계에서 인정받았음을 보여 준다. 이복형제 음판주 아 키티마는 음판주 아 은징가로도 불린다. 노예는 콩고 안에서도 오래 쓰이던 제도였으나 포르투갈 상인들이 상투메의 사탕수수 농장에 쓸 사람을 사 가며 수요가 크게 늘었다. 아폰수 1세는 1542년 말 또는 1543년 초에 숨졌고, 페드루 1세가 뒤를 이었으나 1545년 아폰수 1세의 손자 디오구에게 쫓겨났고, 디오구 1세는 1561년까지 다스렸다. 이 사이 포르투갈의 왕은 마누엘 1세에서 주앙 3세로 바뀌었다. 첫 만남의 경과는 「콩고 왕국의 성립과 포르투갈과의 첫 만남(1390 무렵~1491)」(앞의 사건)을 보라."
  subjects: [kongo-kingdom, portugal]
  tags: [politics, religion, trade]
  sources: ["John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "Anne Hilton, The Kingdom of Kongo (Clarendon Press, 1985)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: adal-war-1529
  year: 1529
  endYear: 1543
  title:
    ko: "아흐마드 그란의 침공과 아달–에티오피아 전쟁(1529~1543)"
  summary:
    ko: "아달 술탄국의 이맘 아흐마드 이븐 이브라힘 알가지, 곧 '그란'(왼손잡이)은 1528년 9월 바데케에서 에티오피아 군대와 부딪친 뒤 1529년 3월 심브라 쿠레에서 레브나 뎅겔의 군대를 꺾었다. 이 해를 전쟁의 시작으로 보며 전쟁은 1543년 2월까지 이어졌다. 아달 군은 1531년 2월(율리우스력) 안투키야와 3월 아이파르스에서 이긴 뒤 4~5월 황제의 도읍 바라라에 들어갔고, 고원 곳곳의 교회와 수도원이 약탈당했다. 레브나 뎅겔은 산악을 떠돌다 1540년 9월 데브레 다모에서 숨졌고, 아들 갈라우데오스가 뒤를 이었다. 도움을 청한 포르투갈은 1541년 2월 크리스토방 다가마가 이끄는 총병 400명가량을 마사와에 상륙시켰다. 1542년 4월 안탈로에서 아흐마드가 부상하자 예멘 자비드의 오스만 제국 군대가 대포 10문과 병사 700명을 보내 아달 군의 화력이 크게 강해졌다. 크리스토방 다가마는 1542년 8월 28일 붙잡혀 아흐마드의 명으로 처형되었고, 살아남은 포르투갈인들은 10월 갈라우데오스에 합류했다. 1543년 2월 21일 호수 타나 가까운 와이나 다가에서 아흐마드가 치명상을 입고 목이 베이자 아달 군은 흩어졌다. 아달이 점령한 땅과 약탈의 규모는 사료마다 다르게 적혀 있다. 이 전쟁 뒤 아달은 힘을 잃었고, 오로모 사람들의 이동으로 에티오피아 남부 고원을 잃는 일은 이후 수십 년에 걸쳐 진행되었다. 1544년 10월 와지에서 갈라우데오스가 재상 아바스를 꺾었다. 와이나 다가 전투의 날짜는 사료마다 갈리며, 에티오피아 연대기는 1529년을 박해가 시작된 해로 적는다. 아흐마드의 목을 벤 사람은 아즈마치 칼리테로 전한다."
  subjects: [ethiopia, portugal, ottoman]
  tags: [war, religion]
  sources: ["Richard Pankhurst, The Ethiopian Borderlands (Red Sea Press, 1997)", "Shihab ad-Din Ahmad bin Abd al-Qader, Futuh al-Habasha: The Conquest of Abyssinia (Tsehai, 2003)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: merina-1540
  year: 1540
  endYear: 1612
  title:
    ko: "이메리나 고원과 메리나 왕국의 성립(1540 무렵~1612)"
  summary:
    ko: "마다가스카르 중앙 고원에는 보르네오 남동부에서 배로 건너왔다고 하는 바짐바 사람들이 가장 먼저 살았다. 이들이 처음 산 때는 기원전 200년 무렵에서 기원후 300년 사이로 어림한다. 당시 고원은 마을마다 왕과 여왕이 따로 다스리는 작은 정치체들로 나뉘어 있었다. 15세기에는 동남쪽 해안에서 온 호바 사람들이 고원의 언덕 마을로 들어와 바짐바와 섞여 살았다. 전승은 바짐바 여왕의 아들이자 호바 아버지를 둔 안드리아만엘로를 이메리나의 창건자로 꼽으며, 그의 재위는 1540년에서 1575년으로 전한다. 안드리아만엘로는 바짐바를 눌러 복속시키고 귀족 신분 안드리아나를 두었으며 알라소라에 울타리를 두른 첫 왕궁 로바를 지었다고 한다. 그는 쇠 끝 창을 쓰고 저지대 늪에 둑을 쌓아 논으로 바꾸었다고 한다. 뒤를 이은 랄람보(1575~1612)는 영역을 이메리나라 이름 짓고 상비군과 인두세를 처음 두었다고 하며, 왕실 부적 삼피와 왕의 목욕 축제 판드로아나를 세웠다고 전한다. 랄람보 때 베치미사라카의 침입을 물리쳤다고도 한다. 이 이름이 랄람보 때부터 쓰였는지는 자료마다 갈린다. 아들 안드리안자카는 1612년 왕위에 올라 바짐바의 마지막 큰 거점 아날라만가 언덕을 차지하고 훗날 안타나나리보의 중심이 될 로바를 지었다고 전한다. 이 이야기는 모두 구술 전승에 기대어 연대는 뒤에 어림한 값이다. 이메리나라는 이름은 눈에 띄는 높은 곳을 차지했다는 뜻에서 왔다는 설명도 있고, 이를 처음 쓴 이가 18세기 말의 안드리아남포이니메리나라는 견해도 있다. 안드리아만엘로의 어머니는 라포히 또는 란기타로 전한다. 메리나 왕국이 고원 밖으로 뻗어 나가는 것은 18세기 말 이후의 일이다."
  subjects: [merina-kingdom]
  tags: [politics, society]
  sources: ["Pier M. Larson, History and Memory in the Age of Enslavement: Becoming Merina in Highland Madagascar (Heinemann, 2000)", "Mervyn Brown, A History of Madagascar (Markus Wiener, 2000)"]

- id: askia-daoud-1549
  year: 1549
  endYear: 1582
  title:
    ko: "아스키아 다우드와 송가이 제국(1549~1582)"
  summary:
    ko: "아스키아 무함마드가 1528년 쫓겨난 뒤 송가이에서는 아들 아스키아 무사를 비롯한 여러 아스키아가 이어지다 1539년 이샤크 1세가 평화롭게 뽑혔다. 이샤크 1세가 죽음을 앞둔 1549년 측근들은 팀북투 쪽 틴디르마에 있던 다우드를 가오로 불러들였다. 다우드는 아스키아 무함마드의 아들로, 앞서 제국의 서쪽 절반을 다스리는 쿠르미나파리를 맡고 있었고 1582년까지 다스렸다. 다우드는 1550년과 1558년 말리 제국을 쳤다. 1558년 원정은 그가 말리 만사의 딸과 혼인하는 것으로 끝났고, 말리의 기술자 집단을 가오로 데려왔다고 한다. 북쪽에서는 사하라의 소금 광산 타가자가 다툼의 땅이었다. 1556~1557년 마라케시 술탄 무함마드 앗샤이크의 군대가 타가자를 차지했다가 물러났고, 1578년 아흐마드 알만수르가 광산의 세금을 요구하자 다우드는 많은 금을 선물로 보냈다. 이렇게 송가이는 맞서기보다 달래는 길을 택했다. 모로코와의 긴장은 다우드의 마지막 해들에 높아졌고 「알카사르키비르 전투와 아흐마드 알만수르, 송가이 원정(1578~1603)」(뒤의 사건)으로 이어졌다. 다우드는 1582년 숨져 가오에 묻혔다. 1556~1557년 타가자를 차지한 마라케시의 술탄은 사드 왕조의 창시자로, 이 일은 뒤의 모로코 침공을 예고한 사건이었다. 1550년 원정은 말리 땅 깊이 들어갔다고 하나 세부는 전하지 않으며, 다우드는 팀북투 학자들을 후원했다고 전한다. 그의 치세는 송가이가 대체로 안정되었던 때로 평가한다. 다우드 뒤 아들들의 왕위 다툼을 거친 뒤의 일은 「톤디비 전투와 모로코의 송가이 정복(1591~1599)」(뒤의 사건)을 보라. 이 시기 송가이의 힘은 니제르강 굽이의 도시들과 소금·금 교역에 기대고 있었다."
  subjects: [songhai-empire, mali-empire]
  tags: [politics, war]
  sources: ["John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)", "Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: mutapa-portuguese-1561
  year: 1561
  endYear: 1575
  title:
    ko: "포르투갈의 잠베지 진출과 무타파: 실베이라의 죽음과 바헤투 원정(1561~1575)"
  summary:
    ko: "예수회 사제 곤살루 다 실베이라는 1560년 3월 11일(율리우스력) 소팔라에 닿아 코렌테스곶 가까운 오통궤로 갔다가 1561년 무타파 제국의 궁정에 이르렀다. 당시 무타파의 왕은 기록에 네고모로 나온다. 실베이라는 네고모가 주는 선물을 물리치고 성모 그림을 건넸고, 네고모가 그림에 관한 꿈을 꾸자 그와 그의 어머니를 2주가량 가르쳐 세례를 주었다. 네고모는 소 100마리를 바쳤고 실베이라는 이어서 쇼나 고위 인물 수백 명에게 세례를 주었다. 그러나 궁정의 종교 지도자와 이슬람 상인, 신하들이 그를 첩자이자 주술사라고 몰아세웠다. 1561년 3월 그는 음보코루메 일행에게 목 졸려 숨졌고 시신은 무센게지강에 던져졌다고 전한다. 죽은 날은 6일이라는 기록과 15~16일이라는 기록이 있다. 일부 학자는 이 일을 왕위 계승 의례 속에서 외래의 영혼으로 여겨진 그에게 일어난 일로 읽는다. 무타파의 금은 소팔라와 킬와를 거쳐 인도양으로 흘러 나갔고(「포르투갈의 동아프리카 해안 진출: 모잠비크·킬와·소팔라(1498~1510)」(앞의 사건)), 포르투갈은 이를 구실로 금광을 노렸고 1569년 프란시스쿠 바헤투가 모잠비크에서 잠베지강을 거슬러 올라가는 큰 원정을 이끌었다. 세나와 테테 같은 잠베지 강변 거점이 원정의 기지가 되었다. 바헤투의 원정은 병과 싸움에 시달리다 1572~1573년 무렵 실패로 끝났고, 후임 베스쿠 페르난드스 오멩이 1574~1575년 금광을 찾으려 했으나 차지하지 못했다고 전한다. 무타파의 성립은 「무타파 제국의 성립과 대짐바브웨의 쇠퇴(1430 무렵~1480 무렵)」(앞의 사건)을, 속국이 되는 1629년 이후의 일은 「포르투갈의 무타파 속국화와 로즈위의 반격(1629~1693)」(뒤의 사건)을 보라."
  subjects: [mutapa-empire, portuguese-mozambique, portugal]
  tags: [religion, politics, trade]
  sources: ["Malyn Newitt, A History of Mozambique (Hurst, 1995)", "Stanlake Samkange, Origins of Rhodesia (Heinemann, 1968)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: loango-1561
  year: 1561
  endYear: 1600
  title:
    ko: "로앙고 왕국의 등장과 콩고 북쪽 해안(1561 무렵~1600 무렵)"
  summary:
    ko: "로앙고 왕국의 가장 이른 기록은 1561년 무렵의 것이다. 사제 세바스티앙 드 소우투는 콩고 왕 디오구 1세(1545~1561)가 로앙고로 선교사를 보냈다고 적었다. 그전의 여행 기록에는 로앙고가 나오지 않고, 아폰수 1세가 1535년 내건 칭호에도 보이지 않는다. 그래서 왕국이 1550년 무렵 세워졌다고 어림하며, 창건자가 콩고에 딸린 카콩고의 은자리에서 왔다고 전한다. 이 사건은 첫 기록이 있는 1561년을 시작으로 삼았다. 그 기록이 콩고 왕의 사절을 전하므로 로앙고가 콩고 왕의 영향 아래 있었는지는 분명하지 않다. 로앙고 해안은 지금의 콩고 공화국 해안에 해당하고, 유럽 상인은 이 해안에서 구리를 찾았고, 직물 교역은 17세기 초 기록에서 보인다. 지배 집단은 콩고 사람의 한 갈래인 빌리 사람들이며, 이들은 바다와 강을 오가며 교역한 것으로 알려져 있다. 도읍은 부알리, 곧 음반사 로앙고였고, 구리와 직물이 주요 교역품이었다. 왕은 마로앙고라는 칭호로 불렸다고 한다. 로앙고는 남쪽 콩고 왕국과 가까웠으나 1561년 무렵에는 선교사를 받아들일 만큼 독자성을 지니고 있었다. 17세기 초 영국인 앤드루 배텔은 이곳에 머물며 현재 왕의 앞선 왕을 '젬베'라 적었는데, 이를 창건자의 이름으로 볼 수 있다는 견해가 있다. 로앙고가 한 사람의 왕 아래 어떻게 짜였는지는 이 시기 기록이 적어 분명하지 않다. 왕국은 1787년 왕 부아투가 숨질 때까지 이어졌고 그 뒤 왕위 이음은 분명하지 않다. 18세기에 노예 무역이 이 해안을 지배하는 모습은 「로앙고 해안의 노예 무역과 로앙고 왕국의 쇠퇴(1700 무렵~1787)」(뒤의 사건)을 보라."
  subjects: [loango-kingdom, kongo-kingdom]
  tags: [politics, trade]
  sources: ["Phyllis Martin, The External Trade of the Loango Coast 1576–1870 (Clarendon Press, 1972)", "John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)"]

- id: jaga-kongo-1568
  year: 1568
  endYear: 1574
  title:
    ko: "자가의 침입과 포르투갈의 콩고 개입(1568~1574)"
  summary:
    ko: "디오구 1세 뒤 아폰수 2세·베르나르두 1세·엔히크 1세를 거쳐, 의붓아버지 엔히크 1세가 동쪽 변경에서 싸우다 죽자 섭정이던 알바루 1세가 1568년 콩고 왕국의 왕위에 올랐다. 당대의 기록은 그가 모두의 동의를 얻어 왕이 되었다고 하지만, 일부 학자는 이 즉위를 찬탈로 여겼다고 본다. 그가 왕이 된 직후 자가가 콩고를 침입해 알바루 1세는 수도 음반자콩구를 버리고 콩고강의 한 섬으로 달아났다. 이 침입자는 대체로 임방갈라와 같은 집단이 아니라는 데 학자들이 동의하며, 얀 반시나와 데이비드 버밍엄은 두 집단이 모두 룬다 쪽에서 1550년과 1612년 사이에 나왔다고 가설을 세웠다. 알바루는 포르투갈에 도움을 청했고, 포르투갈은 프란시스쿠 드 고베이아 소투마이오르가 이끄는 600명가량의 병력을 보냈는데 대부분 상투메에서 모은 사람들이었다. 이 원정대는 1571년 무렵 도착했다고 하며 프란시스쿠 바르부다가 이끈 반대로 지시를 거의 지키지 못했다. 알바루 1세는 1587년까지 다스렸고 아들 알바루 2세가 뒤를 이었다. 알바루는 그 뒤 수도로 돌아왔다고 본다. 알바루는 그 대가로 포르투갈 사람들이 루안다에 자리 잡는 것을 허락했다. 침입의 규모와 기간은 포르투갈 쪽 기록에 기대어 가늠할 뿐 정확한 숫자는 전하지 않는다. 이 침입으로 도읍이 비워진 동안 많은 사람이 흩어져 콩고의 힘이 크게 꺾였다고 본다. 원정대가 대부분 상투메에서 모였으므로 그곳 상인들의 이해가 개입에 얽혀 있었다. 1574년 무렵까지 이어진 이 개입으로 콩고는 왕위를 지켰지만 포르투갈에 기대는 정도가 깊어졌다. 이 일의 앞뒤는 「아폰수 1세와 콩고 왕국의 기독교화, 노예 무역(1506~1543)」(앞의 사건)과 「루안다 건설과 포르투갈령 앙골라, 은동고와의 전쟁(1575~1599)」(뒤의 사건)을 보라."
  subjects: [kongo-kingdom, portugal]
  tags: [war, politics]
  sources: ["John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "Jan Vansina, Kingdoms of the Savanna (University of Wisconsin Press, 1966)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: idris-alooma-1570
  year: 1570
  endYear: 1603
  title:
    ko: "이드리스 알로마와 보르누의 전성(1570 무렵~1603)"
  summary:
    ko: "이드리스 알로마는 1570년 무렵부터 1603년까지 카넴-보르누를 다스린 왕으로, 재위 해는 1571~1603년, 1580~1603년 등 학자마다 다르고 기간도 32년에서 51년으로 갈린다. 수석 이맘 아흐마드 이븐 푸르투가 재위 첫 열두 해(1571~1583)를 연대기로 남겼다. 이드리스는 오스만 제국의 화승총을 들여 튀르크 군사 고문의 도움으로 총병을 훈련시켰고, 아므사카 공략에서는 높은 대 위에서 총을 쏘게 했다. 그는 1575년 아므사카를 한 번 치다 실패한 뒤 12월 4일(율리우스력) 포위해 도시를 무너뜨리고 주민을 죽이게 했다. 불랄라와는 오랜 싸움 끝에 조약을 맺었다가 뒤에 카넴을 합쳤다. 하우사 땅에도 군대를 보내 카노에까지 이르렀다고 전한다. 북쪽에서는 오스만의 트리폴리 총독부가 1577~1578년 페잔의 오아시스를 차지해 아와드 무함마드 왕조를 몰아냈다. 이드리스는 사절 알하지 유수프를 이스탄불에 보내 페잔 요새를 달라고 청했으나 무라드 3세는 이를 거절하고 보르누와 우호를 맺도록 명했다. 보르누는 1579년까지 사절을 더 보냈고, 1582~1585년 사이 페잔의 오스만 수비대가 무너져 아와드 무함마드가 돌아왔다. 이드리스의 군대에 관한 기록은 대부분 이븐 푸르투의 연대기에서 나와 승리를 드높이는 시각이 짙다. 알로마라는 이름은 그가 묻힌 알라우 호수에서 왔다는 설명이 있다. 페잔 수비대의 파괴는 이드리스가 꾸몄을 가능성을 역사가 레미 드위에르가 논한다. 오스만과의 교섭으로 보르누는 총과 이를 다룰 인력을 얻었다. 이 모든 일은 「사이파와 왕조의 보르누 이주와 은가자르가무(1380 무렵~1472)」(앞의 사건)에서 옮겨 온 도읍 은가자르가무를 중심으로 이루어졌다."
  subjects: [kanem-bornu, ottoman]
  tags: [war, politics]
  sources: ["Ahmad ibn Fartuwa, History of the First Twelve Years of the Reign of Mai Idris Alooma of Bornu (trans. H. R. Palmer, Government Printer, 1926)", "Louis Brenner, The Shehus of Kukawa (Clarendon Press, 1973)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: angola-ndongo-1575
  year: 1575
  endYear: 1599
  title:
    ko: "루안다 건설과 포르투갈령 앙골라, 은동고와의 전쟁(1575~1599)"
  summary:
    ko: "파울루 디아스 드 노바이스는 1575년 2월 11일(율리우스력) 지금 앙골라의 해안에 닿았다. 포르투갈 왕은 같은 해 그를 이곳의 세습 영주 격인 도나타리우로 임명했다. 그는 항해가 바르톨로메우 디아스의 손자로 알려져 있다. 도나타리우는 보통 정복한 땅을 직접 다스리고 세금과 재판권을 갖는 대신 정착민과 병력을 데려와야 했다. 그는 루안다섬 가까이에 상파울루드루안다를 세웠고, 이 도시가 포르투갈령 앙골라의 첫 거점이 되었다. 콩고 왕국의 알바루 1세는 포르투갈이 루안다에 자리 잡는 것을 허락했고 1577년 디아스 드 노바이스를 돕도록 병력을 보냈다. 은동고 왕은 반란자와 포로, 죄인을 노예로 포르투갈에 팔았다. 이 거래가 포르투갈이 앙골라에서 찾던 가장 큰 자원이었다. 그러나 콩고 왕이 은동고를 정복하려던 시도는 벵구강에서 실패했다. 디아스 드 노바이스는 1580년 무렵부터 은동고와 전쟁을 벌였고, 1580년대 초에는 콴자강을 따라 내륙으로 요새를 쌓아 올라갔다고 한다. 그는 1589년 5월 9일 마상가노에서 숨져 그곳 성당 앞에 묻혔다. 전쟁은 그 뒤에도 이어져 1590년대에 포르투갈과 은동고는 싸움과 교섭을 되풀이했다. 카밤베의 은광을 찾으려 했다는 이야기가 전하나 끝내 발견되지 않았다. 노예 수출은 17세기에 이르러 크게 불어나, 루안다는 대서양 노예 무역에서 가장 큰 항구의 하나가 된다. 노예 무역 자료(Trans-Atlantic Slave Trade Database)가 이 흐름을 항구별로 헤아린다. 콩고 쪽 사정은 「콩고 왕국의 성립과 포르투갈과의 첫 만남(1390 무렵~1491)」(앞의 사건)을, 1617년의 벵겔라 건설과 은징가의 시대는 17세기의 일이다."
  subjects: [portuguese-angola, portugal]
  tags: [war, trade]
  sources: ["John Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 루안다, at: [13.23, -8.84], year: 1576 }]

- id: cacheu-1588
  year: 1588
  endYear: 1600
  title:
    ko: "카셰우와 기니 해안의 포르투갈 상관(1588~1600 무렵)"
  summary:
    ko: "카셰우는 지금 기니비사우 북서부의 카셰우강 가에 있는 도시로, 이름은 바이누크 말에서 왔고 '우리가 쉬는 곳'이라는 뜻으로 풀이한다. 1588년 포르투갈은 이곳에 지휘관 관할구를 세우고 요새를 지었다고 한다. 1589년 상인들은 요새를 지을 허락을 얻었고, 1591년에는 현지 당국의 통제를 피해 목책 안으로 옮겨 갔다. 이곳에 자리 잡은 사람들은 카보베르데에서 온 상인과 포르투갈 모험가, 유배자였고 이들을 랑사두스와 데그레다두스라 불렀다. 카보베르데 상인은 이 해안을 오가며 사람과 물자를 거래했다. 이 섬들의 정착은 「포르투갈의 카보베르데·상투메 정착(1462~1493)」(앞의 사건)을 보라. 카셰우 일대에는 바이누크 말고도 발란타와 파펠 같은 사람들이 살았다. 상부 기니 해안은 세네감비아에서 시에라리온에 이르는 해안을 가리킨다. 카보베르데 상인은 1466년 왕의 칙허로 이 해안의 교역권을 얻었다. 랑사두스는 현지 통치자의 허락 아래 살며 현지 말을 익혀 교역을 중개했다고 알려져 있다. 카셰우강은 대서양에서 내륙으로 닿는 물길이어서 노예와 밀랍, 상아가 오갔다. 카셰우는 곧 상부 기니 해안의 중요한 노예 무역 거점이 되었다. 1598년에는 상주 사제가 임명되었고 1605년에는 포르투갈 왕이 시의 특허를 내렸으며, 지금 남아 있는 석조 요새는 1640년대에 새로 지은 것이다. 지금 나라 기니와 섞이지 않도록 말하면 이곳은 기니비사우에 속하며, 당시에는 포르투갈령 기니의 첫 터전이었다. 1879년의 분리 이후 일은 이 사건의 범위 밖이다. 카셰우는 이후 쇠퇴하여 볼라마와 비사우, 칸충고가 행정 중심지를 대신했다."
  subjects: [portuguese-guinea, portugal]
  tags: [trade, politics]
  sources: ["Walter Rodney, A History of the Upper Guinea Coast 1545–1800 (Clarendon Press, 1970)", "Toby Green, The Rise of the Trans-Atlantic Slave Trade in Western Africa 1300–1589 (Cambridge University Press, 2012)"]
  places: [{ name: 카셰우, at: [-16.17, 12.27], year: 1588 }]

- id: tondibi-1591
  year: 1591
  endYear: 1599
  title:
    ko: "톤디비 전투와 모로코의 송가이 정복(1591~1599)"
  summary:
    ko: "모로코 사드 왕조는 1590년 사하라 횡단 교역로를 쥐려고 송가이를 향해 원정대를 보냈다. 1591년 3월 13일(많은 자료가 이 날짜를 따른다) 두 군대는 가오 북쪽 톤디비 가까운 탄콘디보고에서 두 시간가량 맞붙었다. 모로코 군은 주데르 파샤가 이끌었다. 그는 스페인 출신으로 어려서 사로잡혀 모로코에서 자란 개종자였다. 병력은 경기병 1,500명과 보병 2,000~2,500명가량이었고 화승총과 대포 6~8문을 갖췄다. 송가이는 아스키아 이샤크 2세가 이끌었다. 병력은 자료마다 크게 갈려, 『타리크 알파타시』는 기병 1만 8천과 보병 9천 7백을 헤아리고 다른 추산은 기병 1만 2천 5백과 보병 3만을 든다. 송가이는 소 1,000마리를 몰아 모로코 전열을 무너뜨리려 했으나 총소리에 놀란 소가 오히려 자기 편으로 몰렸다고 전한다. 주데르 파샤는 이어 가오를 약탈하고 팀북투와 젠네로 나아가 니제르강 굽이의 큰 도시들에 자리 잡았다. 그러나 먼 거리와 보급 때문에 모로코는 단단한 지배를 세우지 못했다. 10년 가까이 산발적인 싸움이 이어졌고 송가이 땅은 수십 개의 작은 나라로 쪼개졌다. 1599년에는 말리 제국이 젠네를 노렸으나 모로코 수비대에 막혔다고 한다. 모로코 군은 사하라를 건너는 동안 많은 병력과 짐승을 잃었다고 전한다. 이샤크 2세는 달아났고 곧 숨졌다고 전한다. 점령군의 후손은 아르마라 불리며 팀북투 일대를 모로코를 대신해 다스렸다. 송가이는 동쪽 덴디로 옮겨 이후 두 세기 반 남짓 그 전통을 이었다. 모로코 쪽 경과는 「알카사르키비르 전투와 아흐마드 알만수르, 송가이 원정(1578~1603)」(앞의 사건)을 보라."
  subjects: [songhai-empire, saadi-sultanate, mali-empire]
  tags: [war, politics]
  sources: ["John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)", "Michel Abitbol, Tombouctou et les Arma (Maisonneuve et Larose, 1979)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
