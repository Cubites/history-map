- id: jolof-1360
  year: 1360
  endYear: 1549
  title:
    ko: "졸로프 제국의 성립과 단키 전투(1360 무렵~1549)"
  summary:
    ko: "세네갈강과 감비아강 사이의 졸로프 제국은 와알로·카요르·바올 세 중심 나라와 시네·살룸이 합쳐진 연합이었다. 볼로프(월로프)어로 전하는 전승은 시조 은디아디안 은디아이가 어머니가 노예와 재혼하자 집을 떠나 와알로를 다스리게 되고 시네의 왕에게도 인정받았다고 말한다. 이 인물은 신화 속 인물일 수 있다. 역사가들은 이 나라를 14세기에 일어난 일로 보고, 말리 제국의 계승 다툼을 틈타 독립한 때를 1360년 무렵으로 잡는다. 왕은 부르바(부르 비라오)라 불렀다. 15세기 중엽 비람 은젬 엘레르가 은남디루를 정복하고 타크루르까지 힘을 뻗쳤으며 도읍을 티옝으로 옮겼으나, 그가 죽은 뒤 1455년 무렵부터 1489년까지 다섯 부르바가 내전 속에서 왕위를 다퉜다. 1480년대 명목상 왕 비라이마 쿠란 칸을 대신해 동생 젤렌이 정사를 맡아 도읍을 포르투갈과의 교역에 유리한 해안으로 옮기자 다른 왕자들이 반발했다. 1489년 무렵 왕이 쫓겨나 살해되자 젤렌은 포르투갈로 피신해 리스본에서 주앙 2세와 선물을 나눴고 세례를 받았다. 포르투갈은 그를 복위시키려 원정대를 보냈으나, 원정대 지휘관이 다툼 끝에 젤렌을 죽여 뜻을 이루지 못했다. 1510년대 초(1513~1514년)에는 코리 텡겔라가 푸타토로를 차지했고, 1520년에는 시네와 살룸이 떨어져 나갔다. 1549년 단키 전투에서 카요르의 왕자 아마리 은고네 소벨 팔이 졸로프를 꺾고 독립했고, 와알로와 바올도 뒤따라 떠나 졸로프는 조공 왕국들의 연합 위에 선 제국에서 한 왕국으로 줄어들었다. 포르투갈 배는 1440년대부터 이 해안에 들러 교역했고 그 가운데 말 판매도 있었던 것으로 본다. 카요르·와알로·바올은 핵심 나라였고, 시네와 살룸은 14세기 말 이후 연합에 들어온 것으로 보며, 이들은 지도에 칠하지 않은 조공 왕국으로 글에서만 다룬다."
  subjects: [jolof-empire, portugal]
  links:
    - { from: portugal, to: jolof-empire, note: "1480년대 말 젤렌 왕자를 맞아 세례를 주고 복위 원정을 보냄" }
  tags: [politics, war]
  sources: ["Boubacar Barry, Senegambia and the Atlantic Slave Trade (Cambridge University Press, 1998)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)", "Jean Boulègue, Le Grand Jolof (XIIIe–XVIe siècle) (Éditions Façades, 1987)"]

- id: bornu-1380
  year: 1380
  endYear: 1472
  title:
    ko: "사이파와 왕조의 보르누 이주와 은가자르가무(1380 무렵~1472)"
  summary:
    ko: "차드호 동쪽 카넴에서 힘을 떨치던 사이파와 왕조는 14세기에 불랄라 사람들에게 밀렸다. 「카넴 왕국의 성립과 사이파와 왕조의 이슬람 수용(800 무렵~1100 무렵)」(앞의 사건) 이후 이 나라는 호수 동쪽에서 서쪽 보르누로 무게 중심을 옮기게 된다. 불랄라가 수도 은지미를 차지한 것은 1380년 무렵으로 보며, 마이(왕) 우마르 1세 이드리스미는 호수를 건너 한때 조공국이던 보르누로 옮겨 갔다. 왕조는 그곳에서 카넴에서와 같은 방식으로 다스렸으나, 이후 호수 동쪽 카넴은 16세기 초까지 사이파와의 손을 떠났다. 불랄라에게 카넴을 되찾으려던 싸움과 왕위 다툼이 이어져, 1390년 무렵부터 1470년 무렵까지 적어도 열다섯 마이가 잇달았다. 다웃 니칼레미의 후손(다우드계)과 이드리스 니칼레미의 후손(이드리스계)이 번갈아 왕위를 다퉜고, 왕은 한 곳에 오래 머물지 못해 가루키메 같은 곳에서 일곱 해 일곱 달을 지내기도 했다. 이 싸움을 이긴 알리 1세 가지가 1472년 무렵 요베강 가에 은가자르가무를 세워 첫 영속 도읍으로 삼았다. 이 시기의 왕 순서와 재위는 왕실 연대기 『기르감』에 기대는데, 판본마다 어긋나 해는 어림값이다. 이로써 카넴-보르누 제국의 중심이 보르누로 굳어졌다. 이드리스 3세 카타가르마베가 16세기 초 카넴을 되찾았다고 하나 정확한 해는 알려지지 않았다. 『기르감』은 구전으로 전해지다 19세기 중엽 유럽 학자가 처음 글로 옮겼고 앞부분에는 성서 속 인물이 섞여 있어, 나라의 시작은 800년 무렵으로 보며 600~900년 사이로 잡는 설도 있고, 사이파와 왕조는 11세기 후반 후마이가 열었다고 본다. 불랄라와의 싸움은 이후에도 이어졌다."
  subjects: [kanem-bornu]
  tags: [politics, war]
  sources: ["Dierk Lange, Le Diwan des sultans du Kanem-Bornu: Chronologie et histoire d'un royaume africain (Franz Steiner, 1977)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)", "Nehemia Levtzion & J. F. P. Hopkins, Corpus of Early Arabic Sources for West African History (Cambridge University Press, 1981)"]

- id: kongo-1390
  year: 1390
  endYear: 1491
  title:
    ko: "콩고 왕국의 성립과 포르투갈과의 첫 만남(1390 무렵~1491)"
  summary:
    ko: "콩고강 하류 남쪽, 지금의 앙골라 북서쪽에서 콩고 왕국은 1390년 무렵에 열렸다고 본다. 전승은 믐페바 카시와 붕구를 다스린 니마 아 은지마와 음바타 통치자의 딸 루케니 루 은산제의 정략결혼에서 시작되며, 그 아들 루케니 루아 니미(전승으로 1380년 무렵~1420년 무렵)가 이웃을 아우르며 왕국을 열었다고 한다. 이 시조 전승은 16세기 말에야 글로 옮겨졌고 시대에 따라 바뀌었다. 도읍은 음반자콩구(뒤의 상사우바도르)였고, 왕은 마니콩고, 나라는 믐페바·음바타·은순디·음밤바·소요·음팡구 같은 지방으로 나뉘어 있었다. 이 나라는 반투어를 쓰는 사회에서 구리·직물·상아와 조개 화폐 은짐부로 교역했다. 1482~1483년 포르투갈 항해자 디오구 캉이 콩고 해안에 닿아 콩고 귀족 몇 사람을 리스본으로 데려갔고, 1485년 무렵 이들을 데리고 다시 왔다. 1491년 포르투갈 사제와 병사를 실은 선단이 닿았을 때 왕 은징가 아 은쿠우가 세례를 받아 포르투갈 왕 주앙 2세의 이름을 따 주앙 1세가 되었다. 그는 1506년에 죽었다. 왕은 선출로 정해졌고, 소요 백작은 차츰 중앙에서 독립해 움직였다. 음바타의 통치자는 왕의 외할아버지라는 칭호를 지녔다고 한다. 1485년 무렵 캉이 귀환한 뒤 포르투갈과 콩고 사이에는 사절이 오갔다. 음반자콩구는 지금 앙골라 땅에 있으며, 포르투갈 사람들이 상사우바도르라 부른 이름은 16세기에 퍼졌다. 주앙 1세 뒤에는 1509년 아폰수 1세가 이복형제 음판주 아 키티마를 꺾고 왕위에 올라 가톨릭을 나라의 종교로 삼았다. 지방 통치자들은 왕이 임명했다고 한다. 구리와 상아, 훗날의 노예가 포르투갈과 교역의 중심이 되었다. 캉은 강 하구에 포르투갈 왕의 이름을 새긴 석주를 세웠다."
  subjects: [kongo-kingdom, portugal]
  links:
    - { from: portugal, to: kongo-kingdom, note: "1491년 사제와 병사를 보내 은징가 아 은쿠우에게 세례를 줌" }
  tags: [politics, religion, society]
  sources: ["John K. Thornton, A History of West Central Africa to 1850 (Cambridge University Press, 2020)", "Anne Hilton, The Kingdom of Kongo (Clarendon Press, 1985)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 음반자콩구, at: [14.25, -6.27], year: 1491 }]

- id: mutapa-1430
  year: 1430
  endYear: 1480
  title:
    ko: "무타파 제국의 성립과 대짐바브웨의 쇠퇴(1430 무렵~1480 무렵)"
  summary:
    ko: "잠베지강과 림포포강 사이 고원에서는 11세기 무렵부터 돌로 쌓은 담장 도시들이 이어졌고, 그 가운데 대짐바브웨는 13세기부터 15세기에 걸쳐 가장 큰 도시로 자랐다. 소 기르기와 금, 인도양 해안 교역으로 부를 쌓았으나 15세기에 쇠퇴했고, 그 까닭을 소금 부족으로 돌리는 쇼나어 전승이 있으나 이는 땅이 닳았거나 공동체의 자원이 바닥난 일을 비유한 말일 수 있다. 그 앞의 마푼구브웨는 13세기에 잠시 힘을 떨쳤다가 옮겨 간 도시로 본다. 무타파 제국의 성립은 14~15세기로 보는 학자가 많고, 이 글은 1430년 무렵으로 잡는다. 전승에 따르면 카랑가 사람 가운데 코끼리 사냥꾼 냐친구 무톰베(무토타)가 잠베지강 교역으로 이름을 얻고 단데에서 소금을 찾았으며, 자기 씨족인 은조 사만야앙가를 이끌고 단데를 정복해 치타코 창고냐 언덕에 돌담 궁정(짐바브웨)을 세웠다고 한다. 일부 학자는 무토타를 상징적 인물로 본다. 뒤를 이은 마토페(어떤 전승은 네만고로)는 베자에 짐바브웨를 짓고 타바라와 통가 사람들을 눌러 잠베지 교역로를 쥐었다고 한다. 마토페는 여러 왕의 치세를 겹쳐 놓은 이름일 수 있고, 1490년 무렵 이전 일은 몇 세대에 걸친다. 마토페의 아들 마브후라와 냐후마 무콤베로가 이었고, 무콤베로는 1490년 무렵 창기레 1세에게 죽었다고 1506년 알카소바의 기록이 전한다. 서쪽 부투아에서는 토르와 왕조가 갈라섰다고 보며, 창기레의 출신은 토르와와 이어졌다는 견해와 혼인으로 얽혔다는 견해, 칭호일 뿐이라는 견해로 갈린다. 나라 이름 무타파는 '정복한 땅의 주인'을 뜻하는 칭호 므웨네 무타파에서 비롯되었다고 한다."
  subjects: [mutapa-empire]
  tags: [politics, society]
  sources: ["Innocent Pikirayi, The Zimbabwe Culture: Origins and Decline of Southern Zambezian States (AltaMira Press, 2001)", "Stanlake Samkange, Origins of Rhodesia (Heinemann, 1968)", "S. I. G. Mudenge, A Political History of Munhumutapa c1400–1902 (James Currey, 1988)"]
  places: [{ name: 대짐바브웨, at: [30.93, -20.27], year: 1430 }]

- id: mali-decline-1433
  year: 1433
  endYear: 1545
  title:
    ko: "말리 제국의 쇠퇴: 팀북투의 상실에서 니아니 약탈까지(1433~1545)"
  summary:
    ko: "말리 제국은 만사 무사 이후 짧게 재위하거나 무능한 왕이 이어지면서 변경부터 떨어져 나갔다. 1433~1434년 아킬 아그아말와르가 이끈 투아레그 사람들이 팀북투를 빼앗았고, 1436~1437년 무렵에는 와라타도 투아레그의 손에 들어갔다. 1465년 송가이 제국이 오래된 속령 메마를 정복했고, 1468년에는 손니 알리가 투아레그에게서 팀북투를 빼앗았다. 1477년에는 모시의 왕 나바 나세레가 마시나와 옛 바가나(와가두) 땅을 차지했다. 1487년 만사 마흐무드 케이타 2세는 포르투갈 사절을 맞아 교류를 열었고, 1493년 말리의 사절이 텡겔라에 맞선 동맹을 제안했으나 열매를 맺지 못했다. 이 무렵 대서양 쪽 감비아강 유역은 포르투갈 상인과 직접 닿는 새 교역로로 바뀌고 있었다. 1510년대 초(1513~1514년)에는 텡겔라 가문의 데니안케 왕조가 타크루르에 서고 풀라니 세력이 말리의 남은 지방을 공격했다. 1544년 또는 1545년에는 훗날의 아스키아 다우드가 이끈 송가이군이 말리의 도읍을 약탈했다. 이런 상실로 말리는 만딩 핵심 지역만 지키는 나라로 줄었다. 1500년대 초 디아푸누를 잃은 일은 「아스키아 무함마드와 송가이 제국의 전성(1493~1528)」(뒤의 사건)에서 다룬다. 만사 무사의 아들 마간 1세와 형제 술레이만 뒤에는 짧게 재위하거나 무능한 왕들이 이어져 이름과 순서가 사료마다 어긋난다. 1599년 젠네에서 모로코군과 맞선 마지막 반격은 「톤디비 전투와 모로코의 송가이 정복(1591~1599)」(뒤의 사건)에서 다루고, 마흐무드 케이타 4세가 죽은 1610년 무렵을 제국의 끝으로 보는 견해도 있다. 이 흐름은 말리가 사하라 교역의 중심에서 밀려나는 과정이기도 했다."
  subjects: [mali-empire, songhai-empire]
  tags: [war, politics]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)", "John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)"]
  places: [{ name: 팀북투, at: [-3.0, 16.77], year: 1433 }]

- id: benin-ewuare-1440
  year: 1440
  endYear: 1480
  title:
    ko: "에와레와 베닌 왕국의 팽창(1440 무렵~1480 무렵)"
  summary:
    ko: "「베닌 왕국의 성립과 오바 왕조(1180 무렵~1300 무렵)」(앞의 사건) 이후 베닌 왕국(지금의 베냉 공화국과 다른 나라다)은 왕위 다툼으로 흔들렸다. 전승에 따르면 왕자 오군이 망명에서 돌아와 형 우와이파이콘을 쿠데타로 죽이고 불타는 도읍에서 왕위에 올랐으며, 에와레('분란이 그쳤다')라는 이름을 택했다. 그가 1440년부터 1473년(1474년이라는 견해도 있다)까지 다스린 것으로 본다. 오바 에와레는 베닌시티에 성벽과 해자, 넓은 대로를 두고 공예 구역을 나누었다고 하며, 고고학 증거로는 성벽이 여러 해에 걸쳐 쌓인 것으로 보인다. 그는 니제르강 서쪽의 에도 공동체와 아쿠레, 오워 같은 요루바 정착지로 군대를 보내 현지 엘리트를 자기에게 충성하는 족장들로 갈아 세웠고, 전승은 201번의 승리를 헤아리지만 숫자는 전승의 과장일 수 있다. 에와레의 등극을 둘러싼 이야기는 전하는 사람마다 달라, 에웨카판은 오군이 집에 숨었다 하고 에가레바판은 마른 우물에 숨었다 한다. 1472년 포르투갈 항해자 루이 드 세케이라가 도착해 오바와 포르투갈의 접촉이 시작되었고, 1480년대부터 교역이 크게 늘었다. 에와레 뒤에는 에조티가 14일 만에 암살된 뒤 올루아가 1480년 무렵까지 다스렸으나 귀족 반란으로 밀려났고, 오졸루아가 1483년 무렵 오바가 되었다고 한다. 에와레는 우자마라 불린 옛 귀족 가문들의 힘을 누르고 오바를 중심으로 한 관직 체계를 키웠다는 평가를 받으며, 오늘날 에도 사람들의 기억 속에서 '대왕'으로 불린다. 오졸루아의 재위를 1504년까지로 적은 왕 목록도 있어 해가 갈린다. 세케이라의 도착은 포르투갈 사람들이 베닌 해안을 알게 된 첫 기록으로 본다."
  subjects: [benin-kingdom, portugal]
  tags: [politics, war, society]
  sources: ["Alan Ryder, Benin and the Europeans 1485–1897 (Longmans, 1969)", "R. E. Bradbury, The Benin Kingdom and the Edo-Speaking Peoples of South-Western Nigeria (International African Institute, 1957)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 베닌시티, at: [5.63, 6.34], year: 1440 }]

- id: atlantic-islands-1462
  year: 1462
  endYear: 1493
  title:
    ko: "포르투갈의 카보베르데·상투메 정착(1462~1493)"
  summary:
    ko: "서아프리카 대서양 앞바다의 카보베르데 제도에는 포르투갈 사람이 오기 전까지 사람이 살지 않았다. 알비세 카다모스토와 안토니오토 우소디마레, 이름이 전하지 않는 포르투갈 선장이 1456년 일부 섬을 발견했고, 이어 디오구 고메스와 안토니우 드 놀리가 나머지를 찾았다고 한다. 1460년이라는 해를 쓰는 견해도 있다. 포르투갈은 1462년 산티아구섬에 히베이라그란드를 세웠는데, 열대에 세워진 첫 영구 유럽인 정착지로 일컬어진다. 1466년 아폰수 5세는 정착민들에게 아르긴을 뺀 서아프리카 교역권을 주었다가 몇 해 뒤 거두어들였다. 기니만 한가운데의 상투메섬은 1470~1471년 무렵 발견되었고, 1493년 알바루 드 카미냐가 정착을 시작해 사탕수수 농장의 바탕을 놓았다. 두 제도는 사람이 살지 않던 곳에서 포르투갈 국왕이 땅을 나눠 주고 노예 노동으로 농장을 일구는 방식의 첫 실험이었다. 16세기에 산티아구와 푸구섬은 사탕수수와 목화 농장을 운영하며 대서양 노예 무역의 중간 기지가 되었다. 포르투갈령 카보베르데와 상투메 프린시페는 이후 1975년까지 포르투갈 지배 아래 있었다. 프린시페는 1500년에 정착이 시작되었고, 상투메는 1522년 프린시페는 1573년 포르투갈 왕실이 직접 맡았으며, 두 섬은 16세기 중엽 아프리카에서 으뜸가는 설탕 수출지가 되었다고 한다. 카보베르데는 대서양을 건너는 배가 닿는 기착지이기도 했다. 1496년 마누엘 1세는 유대인을 상투메, 프린시페, 카보베르데로 추방했다. 섬에 정착한 포르투갈 사람과 아프리카에서 데려온 노예가 섞여 카보베르데의 크리올 말과 문화가 자라났다. 상투메의 사탕수수 재배는 뒤에 기니만의 노예 무역과 이어졌다."
  subjects: [portuguese-cape-verde, portuguese-sao-tome, portugal]
  links:
    - { from: portugal, to: portuguese-cape-verde, note: "1462년 산티아구섬에 히베이라그란드를 세움" }
    - { from: portugal, to: portuguese-sao-tome, note: "1493년 알바루 드 카미냐가 정착을 시작" }
  tags: [politics, trade, society]
  sources: ["António Carreira, The People of the Cape Verde Islands: Exploitation and Emigration (C. Hurst, 1982)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)", "Malyn Newitt, A History of Portuguese Overseas Expansion 1400–1668 (Routledge, 2005)"]
