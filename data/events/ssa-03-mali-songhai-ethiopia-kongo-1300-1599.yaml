# 사하라 이남 사건 2묶음 갈래 03: 말리·송가이·에티오피아·콩고 (1300 ~ 1599년)
# 범위: 서기 1300~1599(천문 연도도 같음). 오요·부간다의 성립, 말리·졸로프·송가이, 마쿠리아의 몰락, 에티오피아의 팽창, 콩고·무타파, 포르투갈의 해안 진출, 푼지 술탄국 등.
# 깊이: '본문' — summary 800~1,600자.
# 날짜: 1582년 앞 날짜는 율리우스력(날까지 쓰는 곳은 처음 한 번 밝힘). 확실하지 않은 해는 '무렵', 전승·구술·왕명록은 '전한다'로 근거의 성격을 밝혔다.
# 이름 규칙: 옛 나라는 '말리 제국'·'콩고 왕국'처럼 꼬리까지 처음 한 번 쓰고 지금 나라와 섞이지 않게 했다. 전승 속 인물과 기록 속 인물을 섞지 않았다.
# 지도 결정과의 관계: 학설이 갈리는 해(오요·부간다의 성립, 마쿠리아의 끝 1365, 콩고의 시작 1390)는 항목이 고른 해를 따르고 다른 학설은 한 구절로 밝혔다. 속국·조공 땅은 '조공'으로만 적었다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341), 이븐 바투타의 여행과 『여행기』(1325~1355).

- id: oyo-origin-1300
  year: 1300
  endYear: 1535
  title:
    ko: "오요의 성립과 누페의 침입(1300 무렵~1535 무렵)"
  summary:
    ko: "서아프리카 삼림과 사바나가 맞닿는 요루바 땅의 북쪽에서 오요는 도시 국가로 자라났다. 연대 기록이 없는 구술 전승만 남아 있어 성립 연대는 1300년 무렵으로 거슬러 어림한 값이다. 전승에 따르면 요루바 왕조의 시조 오두두와의 아들이자 이페의 왕자 오라니얀(오란미얀)이 북쪽 원정에 실패한 뒤 지금의 올드 오요에 터를 잡고 첫 알라핀(오요의 왕)이 되었다고 한다. 뒤를 이은 아자카는 호전적이지 못하다는 이유로 쫓겨났고, 동생 상고(샹고)가 잠시 다스린 뒤 뇌우의 신으로 모셔졌다고 전하며, 아자카가 복위한 뒤 코리가 오요 본토를 정복했다고 한다. 도읍 오요일레는 농사와 직물, 북쪽 사바나와의 교역으로 성장했다. 알라핀 오니보기 때 오요는 츠오에데가 이끄는 누페 사람들에게 거듭 패했다고 전한다. 1535년 무렵 누페 사람들이 오요일레를 차지하자 왕실은 북쪽 보르구로 피란했고, 이 망명이 80년가량 이어졌다고 본다. 오요이그보호에 새 도읍을 세워 기병과 갑옷을 갖추며 힘을 되찾은 것은 이 망명기의 일로 전한다. 망명이 끝나는 해는 1608년 무렵에서 1615년 무렵까지 학설이 갈린다. 오요 제국이 요루바 땅 전체로 팽창하는 때는 그 뒤의 일이다. 요루바 도시들은 이페를 신성한 기원으로 삼아 저마다 왕을 두었고, 오요의 알라핀은 그 가운데 북쪽 사바나 가장자리를 맡은 왕이었다. 오요이그보호가 도읍이던 때는 1550년 무렵부터 1615년 무렵까지로 보는 견해가 있으며, 뒤에 알라핀 아비파가 오요일레를 되살리고 에궁궁과 이파 의례를 세웠다고 전한다. 오요는 1578년에서 1608년 사이 베닌을 치려 했으나 에키티 산지에 기병이 막혀 이루지 못했다고 한다."
  subjects: [oyo-empire]
  tags: [politics, society]
  sources: ["Robin Law, The Oyo Empire c. 1600–c. 1836 (Clarendon Press, 1977)", "Samuel Johnson, The History of the Yorubas (Routledge, 1921)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 올드 오요(오요일레), at: [3.95, 8.82], year: 1300 }]

- id: buganda-great-lakes-1300
  year: 1300
  endYear: 1500
  title:
    ko: "대호수 지역 왕국들과 부간다의 성립(1300 무렵~1500 무렵)"
  summary:
    ko: "빅토리아호 북쪽 기슭에는 기원전 첫 천년기부터 반투어를 쓰는 사람들이 농사를 지었고, 우르웨 토기가 그 흔적이다. 부간다 왕국이 언제 세워졌는지는 12세기에서 14세기 사이의 어느 때로 갈리며, 이 사건은 1300년 무렵으로 잡았다. 간다 사람들의 전승은 카토 킨투를 시조로 꼽는다. 엘곤산 쪽 북동에서 와서 서른 명의 앞선 왕 가운데 마지막인 벰바 무소타를 꺾고 나라를 열었으며, 뒤에 홀연히 사라졌다고 전한다. 반면 부뇨로 쪽 구술사는 키타라 왕국을 다스리던 바츠웨지 왕조가 무너진 뒤 부뇨로에서 건너온 비토 왕조의 키메라가 셋째 왕이 되었다고 말하고, 간다 사학자들은 이를 받아들이지 않는다. 간다 왕명록은 킨투부터 끊김 없는 서른여섯 왕을 헤아리지만 연대는 전승에 기대 어림한 값이다. 처음의 부간다는 키아돈도·부시로·마워코타 세 군에 걸친 작은 나라였고, 왕은 카바카라 불렀다. 15세기까지는 이웃 부뇨로가 훨씬 큰 나라였으며, 부간다가 이웃을 잠식해 호수 지역의 강자로 올라서는 것은 그 뒤의 일이다. 16세기에는 부뇨로가 침입해 카바카 나키벵게를 죽였지만 부간다는 독립을 지켰다. 일부 학자는 북부 시로의 의례적 왕권이 기록된 전승보다 훨씬 오래되었으리라 보고, 키메라 시기의 이주는 1370년 무렵으로 어림하는 견해도 있다. 킨투의 정복은 1200년에서 1400년 사이로 어림한다. 호숫가의 비옥한 땅에서 바나나를 주식으로 삼는 농경 사회였고, 씨족 우두머리들이 왕을 둘러싸고 있었다. 소 기르기에는 알맞지 않은 땅이라 목축으로 힘을 키운 부뇨로와는 바탕이 달랐다. 부두와 부소가 일부 같은 곳을 정복하는 것은 그 뒤 몇 세기에 걸친 일이다."
  subjects: [buganda]
  tags: [politics, society]
  sources: ["Semakula Kiwanuka, A History of Buganda: From the Foundation of the Kingdom to 1900 (Longman, 1971)", "Christopher Wrigley, Kingship and State: The Buganda Dynasty (Cambridge University Press, 1996)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: mansa-musa-1312
  year: 1312
  endYear: 1337
  title:
    ko: "만사 무사의 치세와 메카 순례(1312~1337)"
  summary:
    ko: "만사 무사는 말리 제국의 왕으로, 앞선 만사 무함마드를 이어 1312년 무렵 즉위했다고 본다(1307년 무렵이라는 견해도 있다). 이슬람 학자들을 곁에 두고 나라를 넓혀, 사헬의 소금길과 금이 나는 남쪽 삼림 사이를 쥔 거대한 나라가 되었다. 무사는 1324년 수많은 수행원과 금을 싣고 메카 순례에 올라 7월에 카이로에 닿았고, 그곳에서 석 달가량 머물다 10월에 떠났다. 카이로에서는 맘루크 술탄 안나시르 무함마드를 만났고, 돌아오는 길에는 추위와 굶주림, 도적의 습격으로 말리 순례자 가운데 많은 이가 숨졌다고 한다. 수행 노예가 1만 2천 명에 이르렀다는 기록은 후대 아랍 문헌의 말이어서 과장으로 보는 학자가 많다. 그가 베푼 선물로 카이로의 금값이 떨어져 몇 해 동안 회복되지 않았다고 알우마리가 전하지만, 일부 학자는 평소의 변동 안이었다고 본다. 『타리크 알수단』은 무사가 돌아오는 길에 가오와 팀북투가 그에게 복속했다고 전한다. 안달루스 출신 시인 아부 이스하크 앗사힐리가 그를 따라 왔다고 하며, 팀북투의 상코레 사원 학문이 이때 자리 잡았고 징게레베르 사원은 1327년에 지은 것으로 전한다. 무사의 모습은 1375년 『카탈루냐 지도첩』에 왕관을 쓰고 금덩이를 든 군주로 그려졌다. 무사는 1337년 무렵 숨졌다고 보는 견해가 가장 널리 받아들여지고, 아들 마간 1세가 뒤를 이었다. 맘루크 술탄국과의 교류는 「안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341)」(앞의 사건)을, 말리를 찾은 이븐 바투타는 「이븐 바투타의 여행과 『여행기』(1325~1355)」(뒤의 사건)를 보라. 순례 길의 비용으로 카이로 상인 바누 쿠와이크에게 5만 디나르를 빌렸다고 이븐 할둔이 전한다. 팀북투는 1330년 모시의 침입을 받은 뒤 되찾았다고 한다."
  subjects: [mali-empire, mamluk-sultanate]
  links:
    - { from: mali-empire, to: mamluk-sultanate, note: "1324년 무사의 순례 길에 카이로에서 선물과 금을 풀어 교류" }
  tags: [politics, religion, trade]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "Nehemia Levtzion & J. F. P. Hopkins, Corpus of Early Arabic Sources for West African History (Cambridge University Press, 1981)", "John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)"]
  places: [{ name: 팀북투, at: [-3.0, 16.77], year: 1325 }]

- id: amda-seyon-1314
  year: 1314
  endYear: 1344
  title:
    ko: "아므다 시욘 1세와 이팟 정복(1314~1344)"
  summary:
    ko: "아므다 시욘 1세는 솔로몬 왕조의 황제로 1314년에 즉위해 1344년(1345년이라는 견해도 있다)까지 다스렸다. 아버지는 웨뎀 아라드로 알려져 있으나 즉위 때 출신을 둘러싼 논란이 있었다. 즉위 직후부터 고원의 남쪽과 서쪽으로 군대를 보내, 1316~1317년 무렵 다모트와 하디야를 누르고 많은 사람을 옮겨 살게 했으며 고잠도 쳤다. 1321~1322년 무렵 맘루크 술탄 안나시르 무함마드가 이집트의 콥트 교인을 박해하자 사절을 보내 나일 강물을 돌리겠다고 위협했다고 전하나 술탄은 응하지 않았다. 이팟 술탄 사브르 앗딘이 반란을 일으키자 1332년(1329년이라는 견해도 있다) 도읍을 부수고 항복한 그를 가두었으며, 이어 반기를 든 아달과 모라를 다스 전투에서 꺾고 아달의 도읍 탈라그를 빼앗았다. 이 원정으로 에티오피아의 통치가 처음으로 아와시강을 넘었고, 이팟·할라·하디야·아달·다와로·발레가 복속하거나 약탈당했다. 이 승전은 왕의 연대기 『영광스러운 승리』에 담겼는데, 지은이와 시기는 갈린다. 「자그웨 왕조의 끝과 솔로몬 왕조의 성립(1270~1285)」(앞의 사건) 이후 고원 기독교 왕국이 남동쪽으로 뻗은 첫 큰 걸음이었다. 이팟의 술탄 하크 앗딘 1세는 이 사절단의 한 사람을 가두어 죽였다고 한다. 무슬림 영역으로 뻗은 이 원정은 고원 교회와 왕실이 홍해 쪽 교역로를 쥐려는 움직임이기도 했다. 이 정복으로 에티오피아는 선대 황제들보다 훨씬 큰 나라가 되었다. 왕위는 아들 네와야 크레스토스가 이었다. 그의 이름 아므다 시욘은 '시온의 기둥'으로 풀이된다. 왕실은 정해진 도읍 없이 군대와 함께 옮겨 다녔다."
  subjects: [ethiopia, mamluk-sultanate]
  tags: [war, politics, religion]
  sources: ["Taddesse Tamrat, Church and State in Ethiopia 1270–1527 (Clarendon Press, 1972)", "G. W. B. Huntingford, The Glorious Victories of Amda Seyon, King of Ethiopia (Clarendon Press, 1965)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: makuria-fall-1317
  year: 1317
  endYear: 1365
  title:
    ko: "마쿠리아의 몰락(1317~1365)"
  summary:
    ko: "나일 중류의 기독교 왕국 마쿠리아는 13세기 후반부터 이집트의 맘루크에게 시달렸다. 1276년 맘루크군이 동골라를 무너뜨리고 다우드 왕을 쫓았으며, 뒤에 앉힌 왕을 곧 죽이는 일도 있었다. 왕위 다툼도 잦아 1311년 쿠단베스가 형제를 죽이고 왕위를 가로챘다. 1316년 개종한 압둘라 바르샴부가 처음으로 이슬람을 믿는 마쿠리아 왕이 되었고, 1317년에는 동골라 왕궁의 알현실이 사원으로 바뀌었다. 같은 해 칸즈 알다울라라 불린 반 카즈의 에미르 무함마드가 그를 죽이고 왕위에 올랐으며, 1323년 맘루크가 쿠단베스를 다시 앉히려다 군대가 물러나자 무함마드가 되찾아 조공을 바치는 조건으로 인정받았다. 1328~1331년 무렵부터 1333년 이후까지는 기독교 왕 시티가 있었다. 1347년 페스트가 이집트에 닿았고 누비아에도 번졌을 것으로 본다. 이 사건은 마쿠리아의 끝을 1365년으로 본다. 그해 내전으로 왕의 조카가 바누 자드의 도움을 받아 삼촌을 죽이고 동골라를 차지했고, 왕의 형제는 게벨 아다로 물러났다. 맘루크군이 게벨 아다는 구했으나 동골라는 되찾지 못해 동골라는 버려졌다. 이후 마쿠리아는 게벨 아다와 카스르 이브림 중심의 작은 나라로 줄었고 도도와라는 이름의 잔여 왕국이 이어졌다고도 하며, 마지막 알려진 왕은 1463년 문서의 요엘이다. 맘루크 쪽 사정은 「안나시르 무함마드의 세 번의 재위와 맘루크 술탄국의 안정(1293~1341)」(앞의 사건)을 보라. 1367년 맘루크는 게벨 아다의 아파키르와 카스르 이브림의 시하브 앗딘 마지드, 두 누비아 통치자에게 서한을 보냈다. 1397년에는 왕 나지르가 사촌에게 쫓겨 이집트로 달아났고, 1412~1413년 반 카즈는 아스완에서 쫓겨났다."
  subjects: [makuria, mamluk-sultanate]
  links:
    - { from: mamluk-sultanate, to: makuria, note: "1276년 동골라를 치고 이후 왕위 계승에 개입" }
