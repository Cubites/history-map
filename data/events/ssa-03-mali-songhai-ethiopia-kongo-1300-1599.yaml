- id: sonni-ali-1464
  year: 1464
  endYear: 1492
  title:
    ko: "손니 알리와 송가이 제국의 팽창(1464~1492)"
  summary:
    ko: "니제르강 굽이의 가오를 중심으로 한 송가이는 말리의 지배에서 벗어나 손니 왕조 아래 힘을 키웠다. 손니 알리는 이 왕조의 열다섯 번째 왕으로 1464년 무렵 즉위해 1492년까지 28년 다스렸다. 즉위 이듬해인 1465년 송가이는 말리의 오래된 속령 메마를 정복했고, 1468년 무렵 투아레그가 차지하고 있던 팀북투를 빼앗았다. 즉위 4년 만의 일이다. 팀북투의 지도자가 1469년 송가이의 보호를 청했다는 기록도 있어 해가 조금 갈린다. 팀북투를 쥔 투아레그와 이어졌다는 이유로 팀북투 학자들을 탄압했다고 『타리크 알수단』은 전한다. 젠네는 1473년 포위 끝에 굶주려 항복했다고 하며, 그 해를 1475년으로 보는 견해도 있다. 1477년에는 모시의 왕이 마시나와 옛 바가나 땅을 차지했고, 1483년 손니 알리는 운하 공사를 접고 모시의 침입을 막아야 했다. 손니 알리는 1492년 11월(율리우스력) 숨졌는데 사정은 추측에 맡겨진다. 『타리크 알수단』은 니제르강을 건너다 물에 빠졌다고 하고, 구술 전승은 누이의 아들 무함마드 투레, 곧 훗날의 아스키아가 죽였다고 한다. 군 지휘관들이 아들 손니 바루를 왕으로 세웠으나 무함마드가 도전해 끝내 권력을 잡았다. 이 시기의 사실은 『타리크 알수단』과 『타리크 알파타시』에 기대는데 두 책은 손니 알리를 보는 눈이 다르다. 손니 알리는 기병과 강 위의 선단을 함께 부려 니제르강 둘레의 도시를 차례로 눌렀다고 전한다. 송가이 사람들은 가오가 놓인 강굽이에서 물고기를 잡고 농사를 지으며 강 교역을 쥐었다. 손니 알리와 팀북투 학자들의 불화는 이후 아스키아 시대에 학문 전통이 되살아나는 배경이 되었다."
  subjects: [songhai-empire, mali-empire]
  tags: [war, politics]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 가오, at: [-0.04, 16.27], year: 1464 }]

- id: elmina-1471
  year: 1471
  endYear: 1482
  title:
    ko: "포르투갈의 황금 해안 도착과 엘미나 성(1471~1482)"
  summary:
    ko: "기니만 북쪽의 황금 해안은 15세기 중엽까지 내륙의 금이 해안 상인을 거쳐 사하라 이북으로 흘러가던 곳이었다. 포르투갈 사람들은 1471년 이 해안에 닿았고, 상인 페르낭 고메스는 이미 금 교역이 이루어지던 곳을 찾아 교역소를 열어 '광산'이라는 뜻의 아 미나로 불렀다. 이곳 사람들은 페투와 에과포 두 왕국 사이에 있던 판테 사람들로 본다. 주앙 2세는 1481년 교역을 지킬 요새를 짓도록 명했고, 디오구 드 아잠부자가 이끄는 함대가 1481년 12월 12일(율리우스력) 떠나 1482년 1월 19일 도착했다. 아잠부자는 통역을 거쳐 지방 추장 콰민 안사(통역이 '카라만사'로 옮긴 이름)를 만났고, 추장은 마지못해 승낙했다. 이튿날 아침 공사를 시작하자 집과 신성한 바위를 허물었다는 갈등이 일어났고, 주민이 공격하자 포르투갈 쪽은 마을 하나를 불태워 보복했다. 조립식 자재로 지은 요새는 상조르즈다미나라고 이름 붙였다. 포르투갈은 처음에는 직접 노예 사냥을 하지 않고 다른 나라의 포로를 사다 엘미나를 중간 기지로 삼아 실어 날랐다. 이 요새의 금 교역은 곧 포르투갈 국왕의 큰 수입이 되었고, 1600년대에는 포로 매매가 이 지역 교역을 지배했다. 1488년 바르톨로메우 디아스의 희망봉 통과는 「콜럼버스와 다가마, 신항로 개척」(뒤의 사건)을 보라. 황금 해안이라는 이름은 이 금 교역에서 비롯되었고, 포르투갈 사람들은 금을 사는 대가로 직물과 금속 그릇, 말을 팔았다고 한다. 이 함대에 훗날의 콜럼버스가 있었다고 보는 역사가도 있다. 엘미나는 지금 가나의 중부 해안에 있다. 교역소가 열린 뒤 금이 흘러드는 길목은 포르투갈 국왕이 직접 관리했다."
  subjects: [portugal]
  tags: [trade, politics]
  sources: ["Albert van Dantzig, Forts and Castles of Ghana (Sedco, 1980)", "Malyn Newitt, A History of Portuguese Overseas Expansion 1400–1668 (Routledge, 2005)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 엘미나 성, at: [-1.35, 5.08], year: 1482 }]

- id: askia-muhammad-1493
  year: 1493
  endYear: 1528
  title:
    ko: "아스키아 무함마드와 송가이 제국의 전성(1493~1528)"
  summary:
    ko: "손니 알리가 죽은 뒤 아들 손니 바루가 왕이 되었으나, 알리의 조카로 전해지는 무함마드 투레가 1493년 4월 가오 가까운 안파오 전투에서 바루를 꺾고 왕위에 올라 '아스키아'라는 칭호를 썼다. 새 왕조는 이슬람 학자들의 지지를 받았다. 무함마드는 1496년 메카 순례에 올라 두 해 가까이 걸려 돌아왔다(1497~1498년으로 적은 대목도 있다). 순례 뒤 '하지'와 '칼리프'라는 칭호를 얻었고, 『타리크 알수단』은 카이로에서 칼리프로 인정받았다고 전한다. 돌아온 뒤 모시를 상대로 원정을 벌였으나 해는 문서에 없다. 1501~1502년 무렵에는 만사 마흐무드 3세의 아들을 꺾고 디아푸누를 약탈해 차지했는데, 이는 말리의 쇠퇴를 더 앞당겼다. 카치나·자리아·고비르·카노 같은 하우사 도시들에도 군대가 닿았으나 해는 알려지지 않았다. 1504년 와라타에서 일어난 일을 계기로 투아레그와의 동맹이 소금 광산 타가자를 둘러싼 이해와 이어졌고, 1515년에는 아가데즈를 쳤다. 그는 영토를 지방 총독이 다스리는 체제로 정리하고 학자와 법관을 후원했다. 이 시기 송가이는 니제르강을 따라 서쪽 마시나에서 동쪽 하우사 땅까지 이른 큰 나라로 올라섰다. 무함마드는 1493년부터 35년 남짓 다스린 뒤 1528년 8월 아들 무사에게 강제로 물러나게 되었고, 그 뒤 왕위 다툼이 이어졌다. 이 무렵 팀북투는 이슬람 학문의 중심이었고 젠네의 상인들도 번성했다. 『타리크 알수단』은 순례 길에 막대한 금을 가져갔다고 전하나 그 양은 사료 속 주장이다. 군대는 기병과 강 선단이 중심이었다고 한다. 왕조의 정통성은 이슬람의 후원에 크게 기댔다."
  subjects: [songhai-empire, mali-empire]
  tags: [politics, war, religion]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "John O. Hunwick, Timbuktu and the Songhay Empire: Al-Sa'di's Ta'rikh al-Sudan down to 1613 (Brill, 1999)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
  places: [{ name: 안파오, at: [0.12, 16.2], year: 1493 }]

- id: portuguese-east-africa-1498
  year: 1498
  endYear: 1510
  title:
    ko: "포르투갈의 동아프리카 해안 진출: 모잠비크·킬와·소팔라(1498~1510)"
  summary:
    ko: "인도양 서쪽 스와힐리 해안에는 킬와를 비롯한 도시들이 금과 상아, 인도·페르시아·중국과의 교역으로 번성하고 있었다. 킬와는 13세기 말 예멘 출신 마흐달리 왕조가 장악한 뒤 14세기에 후수니 쿠브와 궁전을 지었고, 15세기에 전성기를 맞아 코렌테스곶에서 말린디까지 종주권을 주장했다. 킬와는 내륙 금이 모이는 소팔라를 손에 넣어 큰 금 수입을 얻었다. 이 도시들의 모습은 1331년 이븐 바투타가 킬와를 찾았을 때의 기록(「이븐 바투타의 여행과 『여행기』(1325~1355)」(앞의 사건))에도 보이고, 말린디는 1418년 무렵 정화 함대의 사절이 들른 곳이다(「정화의 항해(1405~1433)」(앞의 사건)). 1498년 바스쿠 다가마의 함대는 3월 모잠비크섬, 4월 몸바사와 말린디에 닿았는데 몸바사에서는 적의를 만났고 말린디의 통치자는 호의적이었다. 포르투갈은 이 항해로 인도로 가는 길을 익혔다. 1500년에는 카브랄의 함대가 모잠비크섬과 킬와에 들렀다. 1502년 다가마는 킬와에게서 조공을 받았고, 1505년 소팔라에 상관과 요새를 세웠다. 1505년에는 프란시스쿠 드 아우메이다가 군사 500명가량을 상륙시켜 킬와의 에미르 이브라힘을 몰아내고 산티아구 요새를 세운 뒤 수비대를 남겼고, 같은 해 몸바사도 쳤고 포르투갈에 협조하는 왕을 킬와에 세웠다. 모잠비크섬에도 요새를 쌓아 1507년 무렵 포르투갈의 거점으로 삼았다. 이로써 포르투갈은 동아프리카 해안의 금과 상아 교역로를 직접 쥐려 했다. 말린디에서는 인도 항로를 아는 길잡이를 태웠다고 한다. 마흐달리 계열 이후 킬와에서는 대신들이 왕을 세우는 혼란이 이어졌다."
  subjects: [portuguese-mozambique, portugal]
  links:
    - { from: portugal, to: portuguese-mozambique, note: "1498년 모잠비크섬에 닿고 1507년 무렵 요새를 쌓음" }
  tags: [trade, politics, war]
  sources: ["Malyn Newitt, A History of Mozambique (Hurst, 1995)", "Neville Chittick, Kilwa: An Islamic Trading City on the East African Coast (British Institute in Eastern Africa, 1974)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
