- id: kulikovo-1380
  year: 1359
  endYear: 1382
  title:
    ko: "킵차크 칸국의 대혼란과 쿨리코보 전투, 토크타미시의 모스크바 약탈"
  summary:
    ko: "1359년 베르디벡 칸이 죽어 바투 가계가 끊기자 킵차크 칸국은 20년 남짓 칸이 수십 번 바뀌는 대혼란에 빠졌다. 볼가강 서쪽에서는 군사 지도자 마마이가 1361년 무렵부터 꼭두각시 칸을 세워 크림과 돈강 일대를 쥐었다. 이 틈에 모스크바 대공 드미트리 이바노비치(돈스코이)는 1359년 아홉 살에 자리에 올라 1362년 블라디미르 대공 자리를 얻고 1367년 석조 크렘린을 쌓기 시작했다. 트베리와 리투아니아의 알기르다스가 손잡고 1368~1372년 모스크바를 쳤으나(앞의 사건) 드미트리는 버텨 1375년 트베리가 그를 형으로 인정하게 했다. 1378년 8월 보자강에서 마마이가 보낸 군대를 처음 크게 이겼다. 1380년 9월 8일 돈강 상류의 쿨리코보 들판에서 드미트리가 이끈 루스 연합군(세르푸호프의 블라디미르 안드레예비치 등 포함)이 마마이의 군대를 무찔렀다. 마마이는 제노바 보병을 고용했다고 전하며 리투아니아의 야기에우워와 랴잔의 올레그와 손잡으려 했으나 이들은 제때 오지 않았다. 양쪽 모두 큰 손실을 보았고, 병력 수치는 연대기가 부풀려 연구자들이 크게 낮추어 본다. 승리한 드미트리는 '돈스코이'라 불렸다. 그러나 마마이를 칼카강에서 꺾은 토크타미시(백오르다 출신)가 킵차크 칸국을 하나로 합치며 상황이 바뀌었다. 1382년 8월 토크타미시는 대공이 자리를 비운 사이 속임수로 모스크바에 들어가 약탈하고 불태웠다(사망자 수는 사료마다 크게 다르다). 모스크바는 다시 공물을 바쳐야 했고 드미트리의 아들 바실리가 몇 해 볼모로 잡혔다. 쿨리코보는 몽골의 지배를 끝낸 싸움이라기보다 모스크바가 루스의 중심으로 올라섰음을 알리는 상징으로 평가된다."
  subjects: [golden-horde, grand-duchy-of-moscow, tver, lithuania-grand-duchy, ryazan, genoa, novgorod-republic, rus-principalities]
  links:
    - { from: grand-duchy-of-moscow, to: golden-horde, note: "쿨리코보 승리 (1380)" }
    - { from: golden-horde, to: grand-duchy-of-moscow, note: "토크타미시의 모스크바 약탈 (1382)" }
