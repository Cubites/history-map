- id: templars-1307
  year: 1307
  endYear: 1314
  title:
    ko: "템플 기사단의 해체와 로도스의 병원 기사단"
  summary:
    ko: "1307년 10월 13일 금요일 새벽 프랑스 왕 필리프 4세의 관리들이 기욤 드 노가레의 지휘로 프랑스 전역에서 템플 기사단원을 한꺼번에 체포했다. 왕은 전쟁 비용으로 빚이 컸고 기사단에 큰 빚을 졌다. 혐의는 그리스도를 부인하고 십자가에 침을 뱉으며 우상을 숭배했다는 이단죄였고, 자백은 고문으로 받아 낸 것이 많았다. 교황 클레멘스 5세는 처음에 항의했으나 1307년 11월 다른 군주들에게도 체포를 명했다. 총장 자크 드 몰레도 자백했다가 뒤에 번복했다. 프랑스 밖의 재판은 훨씬 느슨해서 잉글랜드와 이베리아, 독일, 이탈리아 일부에서는 증거 부족으로 풀려난 사람이 많았고, 키프로스(기사단의 본부가 있던 곳)에서는 1308년에 체포가 있었다. 교황은 1311~1312년 비엔 공의회를 연 뒤 1312년 3월 칙서 〈Vox in excelso〉로 유죄 판결 없이 행정 조치로 기사단을 폐지했고, 5월 칙서 〈Ad providam〉으로 그 재산을 병원 기사단에 넘기라고 명했다(프랑스 왕은 비용이라며 상당 부분을 차지했다). 아라곤에서는 1317년 몬테사 기사단이, 포르투갈에서는 1319년 그리스도 기사단이 재산 일부를 이어받았다. 1314년 3월 파리에서 몰레와 노르망디 기사단장 조프루아 드 샤르네가 재발한 이단으로 몰려 센강의 섬에서 화형당했다. 병원 기사단은 1306년 로도스에 상륙해 1310년 8월 도시를 함락하고 로도스 기사단국을 세웠다."
