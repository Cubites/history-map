- id: ottoman-rumelia-1354
  year: 1354
  endYear: 1371
  title:
    ko: "오스만의 루멜리아 진출: 갈리폴리에서 마리차 전투까지"
  summary:
    ko: "1354년 3월 지진으로 갈리폴리 성벽이 무너지자 오르한의 아들 쉴레이만이 도시를 차지하고 튀르크 이주민을 들여앉혔다(앞의 사건). 아나톨리아에서는 오르한이 1354년 앙카라 일대를 차지했다. 이곳은 에레트나의 명목 종주권 아래 아히(길드형 종교·상인 조직) 세력이 다스리던 곳이었고, 지도에서는 이 땅이 에레트나 왕조의 영역에서 오스만으로 넘어간 것으로 그린다. 오르한이 죽은 뒤(1362 무렵) 무라드 1세(재위 1362~1389)는 하지 일베이, 랄라 샤힌 파샤 같은 변경 지휘관을 앞세워 트라키아를 정복했다. 디디모테이콘(1361 무렵)과 필리포폴리스(플로브디프)를 얻었고, 에디르네(아드리아노폴리스)는 정복 연도가 1361년설과 1369년설로 갈리나 1360년대 중반 이후 도읍이 되었다. 서유럽에서는 사보이아 백작 아마데오 6세가 1366년 8월 갈리폴리를 되찾아 요한네스 5세에게 넘겼다. 요한네스는 도움을 구하러 1366~1367년 헝가리에 가고 1369년 로마에서 가톨릭 신앙을 고백했으나 얻은 것이 없었고, 1370~1371년에는 베네치아에 빚으로 붙들렸다. 1371년 9월 26일 마리차강 가 체르노멘(지금의 오르메니오 부근)에서, 세르비아 왕 부카신 므르냐브체비치와 동생 요반 우글예샤가 이끈 마케도니아의 세르비아 영주 연합군이 오스만군에게 밤 기습을 당해 두 형제가 전사했다('세르비아인의 패주'). 그해 12월 세르비아 제국의 마지막 황제 우로시 5세도 죽어 네마니치 가가 끊겼다. 세르비아는 모라바강 유역의 라자르(모라바 세르비아)와 코소보의 부크 브란코비치, 제타의 발샤 가문 같은 영주들로 갈라졌고, 마케도니아의 영주들(프릴레프의 마르코 등)은 오스만의 신하가 되었다. 불가리아 차르 이반 시시만과 동로마 황제 요한네스 5세도 1370년대 초 무라드의 신하가 되어 공물을 바쳤다."
  subjects: [ottoman, byzantine-empire, serbian-empire, moravian-serbia, brankovic-lands, serbian-magnates, bulgaria-second, savoy-county, venice, hungary-kingdom, eretnids]
  links:
