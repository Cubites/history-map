- id: trecento-florence-1308
  year: 1308
  endYear: 1378
  title:
    ko: "단테·페트라르카·보카치오와 피렌체의 치옴피 봉기"
  summary:
    ko: "14세기 피렌체는 금화 플로린과 바르디·페루치 같은 은행, 모직물업으로 유럽에서 가장 부유한 도시에 들었고, 그 안에서 이탈리아어 문학이 꽃피었다. 단테 알리기에리(1265~1321)는 1302년 흰 겔프파로 몰려 추방된 뒤 망명 중에 『신곡』(지옥편은 1308년 무렵 시작, 전체는 1320년 무렵 완성)을 썼고 1321년 라벤나에서 죽었다. 프란체스코 페트라르카(1304~1374)는 아비뇽에서 자라 1341년 4월 로마의 캄피돌리오 언덕에서 계관시인으로 대관되었고, 시집 『칸초니에레』와 고전 필사본의 발굴로 인문주의의 길을 열었다. 조반니 보카치오(1313~1375)는 피렌체 또는 체르탈도 부근에서 나서 1320년대 후반 아버지를 따라 나폴리로 가 앙주 궁정 둘레에서 은행업과 교회법을 익힌 뒤 피렌체로 돌아와 1348년 흑사병이 휩쓴 도시를 배경 삼아 『데카메론』(1349~1353년 무렵)을 썼다(뒤의 사건). 정치는 불안했다. 아테네 공작 발테르 6세 드 브리엔(케피소스에서 죽은 발테르 5세의 아들)이 1342~1343년 독재를 세웠다가 쫓겨났고, 바르디와 페루치 은행은 잉글랜드 에드워드 3세의 채무 불이행 등으로 1340년대 중반에 파산했으며, 1348년 흑사병으로 인구가 크게 줄었다(추산이 연구자마다 다르나 절반 안팎). 1375~1378년에는 교황청의 이탈리아 지배에 맞선 '여덟 성인의 전쟁'을 치르다 교황에게 성무 금지령을 받았다. 1378년 7월에는 길드에 속하지 못한 양모 소모공(치옴피)과 하층 노동자가 시뇨리아 궁을 점거하고 미켈레 디 란도를 곤팔로니에레(수장)로 세워 새 길드 셋을 만들었다. 그러나 8월 말 큰 길드와 중간 길드의 반격으로 밀려났고, 1382년 길드 정권이 무너진 뒤 알비치 가문의 과두 지배가 이어졌다. 같은 시기 프랑스의 자크리(1358)와 잉글랜드의 와트 타일러(1381)가 일어난 것처럼 임금과 세금을 둘러싼 민중 봉기의 하나다."
  subjects: [florence, papal-states, naples-kingdom, milan-signoria]
  links:
    - { from: florence, to: papal-states, note: "여덟 성인의 전쟁 (1375~1378)" }
  tags: [culture, politics, society]
  sources: ["Gene A. Brucker, Florentine Politics and Society, 1343–1378 (1962)", "John M. Najemy, A History of Florence, 1200–1575 (2006)", "단테 알리기에리, 『신곡』(Divina Commedia)", "조반니 보카치오, 『데카메론』(Decameron)"]

- id: avignon-1309
  year: 1309
  endYear: 1377
  title:
    ko: "아비뇽 교황청"
  summary:
    ko: "프랑스 가스코뉴 출신 교황 클레멘스 5세(1305년 선출)는 로마의 귀족 파벌 싸움을 피해 프랑스에서 머물다 1309년 3월 아비뇽에 자리 잡았다. 아비뇽은 프로방스 백작을 겸한 나폴리 앙주 왕가의 땅이었고, 바로 이웃의 베네생 백작령은 1274년부터 교황이 가진 땅이었다. 1377년까지 일곱 교황이 모두 프랑스 남부 출신으로 아비뇽 일대에서 교회를 다스렸다(우르바누스 5세의 로마 체류 1367~1370 제외). 베네딕투스 12세(재위 1334~1342)는 교황궁을 짓기 시작했고, 클레멘스 6세는 1348년 6월 나폴리 여왕 조반나 1세에게서 아비뇽을 8만 플로린에 사들였다. 성직 임명 수수료와 십일조 같은 수입을 거두는 교황청 관료제가 크게 자랐고, 이를 비판한 페트라르카는 아비뇽을 '바빌론 유수'에 견주었다. 신성 로마 제국과는 요한 22세(재위 1316~1334)가 바이에른의 루트비히 4세를 1324년 파문하면서 부딪혔다. 루트비히는 1328년 로마에서 황제로 대관받았고, 파도바의 마르실리우스가 『평화의 수호자』(1324)로 교황권을 비판했으며, 선제후들은 1338년 렌제에서 황제는 교황의 승인 없이도 선출된다고 선언했다. 이탈리아에서 교황령이 흔들리자 에지디오 알보르노스 추기경이 1353년부터 군사와 외교로 되찾고 1357년 『에지디우스 헌법』을 정했다. 우르바누스 5세는 1367년 로마로 갔다가 1370년 아비뇽으로 돌아왔으나, 시에나의 카타리나 등의 설득을 받은 그레고리우스 11세가 1376년 9월 아비뇽을 떠나 1377년 1월 로마에 들어갔다. 이듬해 그가 죽자 교회 대분열이 시작되었다(뒤의 사건)."
  subjects: [papal-states, france, holy-roman-empire, naples-kingdom, provence]
  links:
    - { from: provence, to: papal-states, note: "조반나 1세의 아비뇽 매각 (1348)" }
  tags: [politics, diplomacy]
  sources: ["Guillaume Mollat, The Popes at Avignon, 1305–1378 (영역판, 1963)", "Yves Renouard, The Avignon Papacy, 1305–1403 (영역판, 1970)", "Joëlle Rollo-Koster, Avignon and Its Papacy, 1309–1417 (2015)"]

- id: uzbek-kalita-1313
  year: 1312
  endYear: 1341
  title:
    ko: "우즈베크 칸의 킵차크 칸국과 모스크바의 이반 칼리타"
  summary:
    ko: "킵차크 칸국(대오르다)은 우즈베크 칸(재위 1312년 또는 1313년~1341) 때 가장 번성했다. 우즈베크는 이슬람을 나라의 종교로 삼고 도읍 사라이를 크게 키웠으며, 제노바의 카파와 베네치아의 타나를 지나는 흑해 교역이 칸국의 부를 키웠다. 몽골 제국의 네 칸국은 1304년 원 황제의 수위를 이름뿐이나마 인정하는 화약을 맺은 바 있고, 교황 사절 조반니 다 마리뇰리 일행도 1338년 무렵 카파와 사라이를 거쳐 원의 도읍으로 갔다. 그보다 앞선 1314년 고려 충선왕은 원의 수도 연경(대도)에서 만권당을 열었다(한국사 사건 mangwondang-1314). 루스 공국들은 칸에게서 블라디미르 대공 자리의 허가장(야를릭)을 받아야 했고, 모스크바와 트베리가 이를 두고 다투었다. 모스크바 공 유리 다닐로비치는 1317년 우즈베크의 누이 콘차카와 혼인하고 대공 자리를 얻었으나, 트베리의 미하일 야로슬라비치가 그해 12월 보르테네보에서 그를 이겼다. 미하일은 1318년 칸의 궁정에서 처형되었고, 유리도 1325년 사라이에서 미하일의 아들 드미트리에게 죽임을 당했다. 동생 이반 1세(칼리타 '돈주머니', 재위 1325~1340)가 모스크바를 이었다. 1327년 8월 트베리에서 칸의 사신 쇼브칼이 살해되는 봉기가 일어나자 이반은 수즈달 공과 함께 칸이 보낸 타타르군을 이끌고 트베리를 쳤고, 그 대가로 1328년 대공 자리를 얻었다(수즈달의 알렉산드르와 나누다 1331년 무렵 홀로 차지함). 이반은 루스 땅의 공물을 거두어 칸에게 바치는 일을 맡아 부를 쌓았고 우글리치와 벨로오제로 같은 도시를 사들였으며, 1326년 무렵 정교회의 키예프 대주교가 모스크바로 옮겨 와 교회의 중심이 되었다. 모피 공물이 나는 북동쪽 대페름(카마강 상류의 코미·페름 사람들의 땅)은 1324년 무렵부터 러시아 연대기에 나오며 노브고로드와 모스크바가 공물을 두고 다투었다. 서쪽의 스몰렌스크 공국은 브랸스크 방면으로 땅을 넓혔고(지도에서는 1310년), 리투아니아의 게디미나스가 세력을 키우며 트베리와 손잡았다(뒤의 사건)."
  subjects: [golden-horde, grand-duchy-of-moscow, tver, novgorod-republic, great-perm, rus-principalities, smolensk-principality, lithuania-grand-duchy, yuan]
  links:
