  sources: ["Cemal Kafadar, Between Two Worlds: The Construction of the Ottoman State (1995)", "Halil İnalcık, The Ottoman Empire: The Classical Age, 1300–1600 (1973)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)"]
