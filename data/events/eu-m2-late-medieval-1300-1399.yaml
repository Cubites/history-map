- id: poland-reunification-1320
  year: 1308
  endYear: 1370
  title:
    ko: "폴란드의 재통일과 카지미에시 3세"
  summary:
    ko: "1138년 분열된 폴란드는 피아스트 가문의 여러 공국으로 갈라져 있었다. 브와디스와프 1세(별명 워키에테크)는 1306년 크라쿠프를, 1314년 대폴란드를 차지하고 1320년 1월 크라쿠프 바벨 성당에서 왕으로 대관했다. 그러나 1308년 11월 그단스크(단치히)가 브란덴부르크의 침공을 막으려 불러들인 튜턴 기사단에 넘어가 포메렐리아와 발트해 출구를 잃었고, 기사단은 1309년 본부를 마리엔부르크로 옮겼다. 1331년 9월 플로브체 전투는 양쪽이 이겼다고 주장했다. 아들 카지미에시 3세(재위 1333~1370)는 1335년 비셰그라드 회담으로 보헤미아 왕 요한의 폴란드 왕위 요구를 거두는 대신 슐레지엔을 포기했고, 1343년 7월 칼리시 화약으로 기사단에서 쿠야비아와 도브진을 돌려받는 대신 포메렐리아와 헤움노 땅의 요구를 접었다. 동쪽에서는 1340년 갈리치아-볼히니아의 마지막 군주가 죽자 군대를 보냈고, 1349년 리비우(르부프)를 차지해 붉은 루스(할리치 땅)를 얻었으며, 1366년 리투아니아와 맺은 합의로 볼히니아는 나누었다. 1351년 마조프셰 공들이 폴란드 왕의 신하가 되면서 지도의 폴란드 공국들(묶음)이 사라졌다. 카지미에시는 법령을 손질하고(1347년 비슬리차 법령) 1364년 크라쿠프 대학을 열었으며 유대인의 특권(1264년 칼리시 법령)을 1334년 확인했다. 1370년 11월 아들 없이 사냥 사고로 죽어 피아스트 왕가가 끝나고 앙주 가의 헝가리 왕 러요시 1세가 이었다(뒤의 사건)."
