# ── 1316 ~ 1349년: 리투아니아와 폴란드, 스칸디나비아, 아라곤, 세르비아 제국, 백년 전쟁의 시작 ──────

- id: lithuania-gediminas-1316
  year: 1316
  endYear: 1377
  title:
    ko: "게디미나스와 알기르다스의 리투아니아 확장"
  summary:
    ko: "리투아니아 대공 게디미나스(재위 1315년 무렵~1341)는 이교 국가를 지키면서 동슬라브의 땅으로 세력을 넓혔다. 그는 트라카이와 빌뉴스에 성을 쌓고 1323년 서유럽 도시와 교황에게 편지를 보내 독일 상인과 기술자, 수도사를 초청했다(빌뉴스가 도읍으로 처음 나옴). 튜턴 기사단과 리보니아 기사단의 십자군이 서쪽에서 끊임없이 쳐들어왔으나 그는 폴란드 왕 브와디스와프 1세와 손잡았고, 딸 알도나를 그의 아들 카지미에시(뒤의 카지미에시 3세)에게 시집보냈다(1325). 동쪽에서는 폴로츠크와 비텝스크, 핀스크 같은 땅에 가족을 앉혔고, 갈리치아-볼히니아 왕가의 대가 끊긴 1340년 무렵에는 아들 류바르타스가 볼히니아를 차지해 폴란드의 카지미에시 3세와 다투었다. 키예프를 얻었다는 이르핀강 전투(1320년대) 이야기는 사료가 약해 학자들이 의문을 제기한다. 게디미나스는 1341년 전투 중에 죽었고, 1345년 아들 알기르다스(올게르드)와 케스투티스가 동생 야우누티스를 몰아냈다. 알기르다스는 동쪽의 루스 땅을, 케스투티스는 서쪽 튜턴 기사단과의 국경을 맡았다. 알기르다스는 1362년 무렵(1363년설도 있음) 푸른 물(시니우하강)에서 타타르의 세 군대를 무찌르고 키예프와 포돌리아를 차지했다. 그는 트베리와 손잡고 1368·1370·1372년 모스크바를 쳤으나 이기지 못했다. 1370년 두 형제는 루다우에서 튜턴 기사단에 졌다. 1377년 알기르다스가 죽을 때 대공국은 발트해에서 흑해 쪽까지 뻗었고, 인구 대부분이 정교를 믿는 루스 사람이었다. 아들 요가일라(야기에우워)가 이었다(뒤의 사건)."
  subjects: [lithuania-grand-duchy, galicia-volhynia, poland-kingdom, teutonic-order, terra-mariana, golden-horde, grand-duchy-of-moscow, tver, smolensk-principality, rus-principalities]
  links:
