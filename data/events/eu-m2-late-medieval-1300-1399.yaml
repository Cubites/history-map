- id: nicopolis-1396
  year: 1395
  endYear: 1396
  title:
    ko: "니코폴리스 십자군"
  summary:
    ko: "1387년 헝가리 왕이 된 지기스문트(룩셈부르크 가문)는 오스만이 도나우강 가까이 이르자 서유럽에 십자군을 청했다. 프랑스와 부르고뉴(공작 필리프 2세의 아들 장, 뒷날의 용맹공이 대장), 잉글랜드, 독일, 로도스의 병원 기사단이 호응했고 베네치아와 제노바의 함대가 도나우 하구를 지켰다. 병력 추산은 연구자마다 크게 다르다. 1396년 9월 도나우강 가의 니코폴리스를 포위하다가 9월 25일 바예지트 1세가 이끈 오스만군에게 크게 졌다. 오스만군에는 스테판 라자레비치가 이끈 세르비아 중기병이 있었다. 프랑스 기사들이 지기스문트의 작전(보병을 앞에 내세우자는 안)을 따르지 않고 돌격해 오스만 방진에 갇혔다고 전한다. 바예지트는 많은 포로를 죽였고 신분이 높은 포로는 몸값(20만 두카트라고 전함)을 받고 풀어 주었다(장은 1397년 풀려남). 지기스문트는 배로 도나우강을 내려가 흑해를 거쳐 콘스탄티노폴리스로 피신했다. 비딘은 오스만에 점령되어 차르국이 사라졌다(1396). 이 패배로 서유럽은 오스만을 막을 힘이 없음을 보았고 콘스탄티노폴리스는 홀로 봉쇄를 견디게 되었다(1402년 앙카라 전투 때까지). 부르고뉴는 몸값을 마련하려고 무거운 세금을 걷었다."
  subjects: [ottoman, hungary-kingdom, france, burgundy, england, holy-roman-empire, knights-hospitaller, venice, genoa, wallachia, vidin-tsardom, moravian-serbia, byzantine-empire]
  links:
