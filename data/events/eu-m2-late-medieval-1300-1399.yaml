- id: ilkhanate-fall-1329
  year: 1329
  endYear: 1341
  title:
    ko: "일 칸국의 쇠퇴와 조지아의 재통일, 에레트나·둘카디르 베이국"
  summary:
    ko: "몽골의 이란 정권인 일 칸국은 1335년 마지막 유력 칸 아부 사이드가 후계 없이 죽자 무너졌다. 아나톨리아의 총독이던 위구르 출신 에레트나는 1335~1336년 시바스를 도읍으로 독자 정권을 세웠고(에레트나 왕조, 뒤에 카디 부르하네딘이 이음), 카라만·아이든·게르미얀 같은 베이국도 사실상 자립했다. 1337년 무렵에는 엘비스탄과 마라슈 일대에서 둘카디르 베이국이 일어나 이집트의 맘루크 술탄국에 의지했다. 이 틈에 오스만이 비티니아를 넓혔다(앞의 사건). 캅카스에서는 조지아의 조지 5세(빛나는 자, 재위 1314~1346)가 1329~1330년 서조지아(이메레티) 왕국을 합쳐 조지아를 다시 하나로 만들었고, 1330년대 중반 일 칸국이 무너지자 공물을 끊고 몽골 세력을 몰아냈다. 그의 치세는 조지아가 흑사병(1346년 이후)과 티무르의 침입(1386년부터)을 맞기 전 마지막 번영기로 꼽힌다."
  subjects: [georgia-kingdom, west-georgia-kingdom, eretnids, dulkadir-beylik, karaman-beylik, candar-beylik, anatolian-beyliks, ottoman]
