- id: jacquerie-1358
  year: 1358
  title:
    ko: "자크리: 프랑스 농민 봉기"
  summary:
    ko: "푸아티에의 패전으로 왕이 사로잡히고 귀족이 신망을 잃은 데다, 약탈하는 용병 무리와 전쟁세가 농민을 짓눌렀다. 1358년 5월 28일 보베 지방 생레데세랑에서 농민이 귀족을 죽이고 성을 불태운 봉기가 시작되어 피카르디·일드프랑스·샹파뉴로 번졌다. 귀족들은 농민을 '자크 봉옴(착한 자크)'이라 불렀고 여기서 자크리라는 이름이 나왔으며, 지도자는 기욤 칼(카를)이었다. 귀족 쪽 연대기(프루아사르 등)는 농민의 잔혹함을 강조하지만 실제 폭력의 규모는 부풀려졌다는 지적도 있다. 반란군은 한때 파리 시민군을 이끈 에티엔 마르셀과 손잡았다. 6월 9일 모에서 왕세자비와 귀족 부인들이 피신한 시장을 에워쌌다가 가스통 푀뷔스(푸아 백작)와 캅탈 드 뷔슈 같은 귀족 기사들에게 무너졌고, 6월 10일 나바라 왕 샤를 2세('악한 왕')가 멜로에서 협상을 하다 칼을 사로잡은 뒤 농민군을 무찔렀다. 이어진 보복으로 수천 명이 죽었다(수치는 사료마다 다르다). 봉기는 두 달이 못 되어 끝났다."
