# ── 1337 ~ 1350년: 백년 전쟁의 시작, 덴마크의 회복, 레콩키스타, 동로마 내전 ──────

- id: hundred-years-war-1337
  year: 1337
  endYear: 1350
  title:
    ko: "백년 전쟁의 시작: 슬로이스와 크레시, 칼레"
  summary:
    ko: "1328년 프랑스 왕 샤를 4세가 아들 없이 죽자 귀족들은 사촌인 발루아의 필리프(필리프 6세)를 왕으로 뽑았다. 샤를의 조카인 잉글랜드 왕 에드워드 3세(어머니 이저벨라가 샤를의 누이)는 1329년 아키텐(기옌) 영지에 대해 신하의 예를 바쳤다. 필리프 6세가 1337년 5월 기옌을 몰수하자 에드워드는 양모를 사야 하는 플랑드르 도시와 손잡고 1340년 1월 헨트에서 스스로 프랑스 왕이라 칭했다. 흔히 1337년의 아키텐 몰수를 백년 전쟁의 시작으로 본다. 1340년 6월 24일 슬로이스(츠빈) 앞바다에서 잉글랜드 함대가 프랑스·제노바 함대를 거의 없애 해협의 제해권을 쥐었다. 1341년 브르타뉴 공 존 3세가 죽자 계승 전쟁이 일어나 잉글랜드이 몽포르 가를, 프랑스가 블루아 가를 지원했다. 1346년 7월 에드워드는 코탕탱반도에 상륙해 노르망디를 가로질렀고, 8월 26일 크레시에서 장궁병이 프랑스 기사군을 무찔렀으며 눈먼 보헤미아 왕 요한이 전사했다. 병력은 잉글랜드군 1만 2천~1만 6천, 프랑스군 2만~4만이라는 추산이 있으나 연구자마다 다르다. 잉글랜드군은 이어 칼레를 포위해 1347년 8월 얻었고, 칼레는 1558년까지 잉글랜드령이었다. 프랑스를 편든 스코틀랜드는 1346년 10월 네빌스크로스에서 져서 데이비드 2세가 잡혔다. 흑사병(뒤의 사건)으로 전쟁은 한동안 쉬었다(1347년 휴전). 1349년 도피네 영주 윔베르 2세가 영지를 프랑스 왕의 손자 샤를에게 넘기면서 프랑스 왕위 계승자를 도팽이라 부르게 되었다. 필리프 6세는 1350년 8월 죽었고 아들 장 2세가 이었다."
  subjects: [france, england, flanders, brittany, scotland, genoa, bohemia-kingdom, dauphine, holy-roman-empire]
