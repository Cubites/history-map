- id: eastern-mediterranean-1344
  year: 1344
  endYear: 1375
  title:
    ko: "동지중해의 십자군: 스미르나, 알렉산드리아, 킬리키아 아르메니아의 멸망"
  summary:
    ko: "교황 클레멘스 6세는 튀르크 해적을 막으려 1343년 베네치아·키프로스·병원 기사단·교황청의 해군 연맹을 짰다. 연합 함대는 1344년 10월 아이든 베이국의 우무르 베이가 다스리던 스미르나(이즈미르) 항구를 점령했다(우무르는 1348년 1월 되찾으려다 전사). 항구는 병원 기사단과 교황청이 1402년 티무르에게 빼앗길 때까지 지켰다. 키프로스 왕 피에르 1세(재위 1359~1369)는 1360년 킬리키아 해안의 코리코스, 1361년 8월 안탈리아(아탈리아)를 점령해 아나톨리아 남해안에 거점을 얻었고, 서유럽에서 모은 십자군 함대로 1365년 10월 이집트 알렉산드리아를 사흘가량 약탈하고 물러났다. 이집트의 맘루크 술탄국은 보복으로 키프로스와 킬리키아를 위협했다. 피에르는 1369년 1월 귀족에게 암살되었고, 1373~1374년 제노바가 키프로스를 침공해 파마구스타를 차지했다(1464년까지). 킬리키아 아르메니아(1342년부터 키프로스 왕가 뤼지냥 출신 왕들이 다스림)는 맘루크의 공격으로 1375년 4월 수도 시스가 함락되고 마지막 왕 레온 5세가 카이로로 끌려가면서 사라졌다(레온은 1382년 풀려나 1393년 파리에서 죽음). 이로써 레반트·아나톨리아 쪽에 남은 십자군 국가는 키프로스 왕국과 병원 기사단뿐이 되었다."
  subjects: [cyprus-kingdom, cilician-armenia, knights-hospitaller, venice, genoa, anatolian-beyliks, karaman-beylik, papal-states]
