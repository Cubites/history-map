  sources: ["Aziz Suryal Atiya, The Crusade of Nicopolis (1934)", "Norman Housley, The Later Crusades, 1274–1580: From Lyons to Alcazar (1992)", "Pál Engel, The Realm of St Stephen (2001)"]
