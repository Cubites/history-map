- id: poitiers-bretigny-1355
  year: 1355
  endYear: 1360
  title:
    ko: "푸아티에 전투와 브레티니 조약"
  summary:
    ko: "1355년 잉글랜드 왕세자 흑태자 에드워드는 보르도에서 랑그도크를 가로질러 나르본까지 기마 약탈전(셰보셰)을 벌였다. 1356년 9월 19일 푸아티에 근처 모페르튀이에서 흑태자의 소군(약 6천~7천 명으로 추산)이 프랑스 왕 장 2세의 훨씬 큰 군대(약 1만 1천~1만 6천 명으로 추산)를 무찌르고 왕과 막내아들 필리프를 사로잡았다. 왕세자 샤를(열여덟 살)이 섭정을 맡자 삼부회와 파리 상인 대표 에티엔 마르셀이 왕권을 제한하는 개혁을 요구해(1357년 3월 대칙령) 충돌했고, 마르셀은 1358년 2월 정변을 일으켰다가 7월 31일 죽었다. 이 혼란 속에서 자크리가 일어났다(뒤의 사건). 잉글랜드은 1359년 11월 랭스를 노렸으나 얻지 못했고, 1360년 5월 8일 브레티니(샤르트르 근처)에서 협정을 맺었다. 잉글랜드은 아키텐을 신하의 예 없는 완전한 주권령으로, 푸아투·생통주·페리고르·리무쟁·케르시·루에르그 등과 함께 얻었고, 칼레와 기네, 퐁티외도 가지는 대신 에드워드 3세가 프랑스 왕위 요구를 접기로 했다(1360년 10월 칼레에서 재확인했으나 포기 문서의 교환은 미뤄져 끝내 이뤄지지 않았다). 장 2세의 몸값은 300만 에퀴였고, 이를 마련하려 1360년 프랑 금화를 처음 찍었다. 같은 때 유대인은 큰 입국세와 연 세금을 내는 조건으로 20년 기한으로 프랑스에 다시 들어올 수 있게 되었다(1306년 필리프 4세가 추방, 1315년 귀환, 1322년 다시 추방된 뒤). 장 2세는 1364년 4월 런던에서 죽었다. 이 무렵 고려에서는 공민왕이 1356년 반원 개혁을 시작했다(한국사 사건 gongmin-reform-1356)."
  subjects: [france, england, navarre, brittany]
  links:
