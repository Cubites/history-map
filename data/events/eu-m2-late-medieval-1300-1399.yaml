- id: louis-great-1342
  year: 1342
  endYear: 1382
  title:
    ko: "러요시 1세(대왕)의 헝가리"
  summary:
    ko: "1342년 카로이 로베르트가 죽자 열여섯 살 러요시 1세(재위 1342~1382, 폴란드 왕 1370~1382)가 이었다. 나폴리에서 동생 안드라시가 나폴리 여왕 조반나 1세의 남편이었다가 1345년 9월 아베르사에서 살해되자, 러요시는 복수를 내세워 1347년 말~1348년 나폴리를 점령했고 조반나는 프로방스로 달아났다. 흑사병으로 군대를 물렸다가 1350년 다시 갔으며 1352년 화약으로 나폴리에서 물러났다. 아드리아해에서는 1345~1346년 자다르를 포위했으나 베네치아에 막혔다가, 1356~1358년 전쟁 끝에 1358년 2월 자다르 조약으로 크바르네르에서 두러스에 이르는 달마티아를 넘겨받았고, 라구사(두브로브니크)는 헝가리의 보호 아래 자치 공화국이 되었다. 보스니아 공 스테판 2세 코트로마니치의 딸 엘리자베타와 1353년 혼인해 보스니아와 가까워졌고, 엘리자베타의 사촌 트브르트코 1세는 1353년부터 보스니아를 다스리다 세르비아 제국이 무너진 뒤 이웃 땅을 합쳐 1377년 10월 '세르비아와 보스니아의 왕'으로 대관되었다(장소는 밀레셰바 수도원이라는 설이 일반적)(보스니아 왕국의 성립, 보스니아 바나트의 끝). 불가리아 비딘 차르국의 이반 스라치미르는 1365년 러요시에게 잡혀 몇 해 갇혔다가 1369년 복위했다. 동쪽에서는 1345~1346년 몰다비아 땅에 군대를 보내 타타르를 몰아내고 변경 지방을 세웠으나, 1359년 무렵 지방 군주 보그단 1세가 반란을 일으켜 독립한 몰다비아 공국을 세웠다. 러요시는 1360년 유대인을 추방했다가 1364년 돌아오게 했다. 1370년 카지미에시 3세가 죽자 폴란드 왕위도 이었고, 1374년 코시체(커셔) 특권으로 귀족에게 세금을 줄여 주는 대신 딸의 왕위 계승을 인정받았다. 1382년 9월 죽자 딸 마리아가 헝가리를, 야드비가가 폴란드를 이었다(뒤의 사건)."
  subjects: [hungary-kingdom, naples-kingdom, provence, venice, ragusa, bosnia-kingdom, bosnian-banate, moldavia, vidin-tsardom, poland-kingdom, golden-horde, serbian-empire]
  links:
