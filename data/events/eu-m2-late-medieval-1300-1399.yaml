  sources: ["Jonathan Sumption, The Hundred Years War, Vol. 1: Trial by Battle (1990)", "Jonathan Sumption, The Hundred Years War, Vol. 2: Trial by Fire (1999)", "Anne Curry, The Hundred Years' War (2판, 2003)", "Clifford J. Rogers, War Cruel and Sharp: English Strategy under Edward III, 1327–1360 (2000)"]
