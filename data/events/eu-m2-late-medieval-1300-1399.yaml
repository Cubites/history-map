- id: catalan-company-1311
  year: 1303
  endYear: 1311
  title:
    ko: "카탈루냐 용병단과 아테네 공국"
  summary:
    ko: "1302년 8월 칼타벨로타 화약으로 시칠리아 만종 전쟁이 끝나, 프리드리히 3세가 평생 시칠리아(트리나크리아) 왕으로 인정받자 아라곤·카탈루냐 계통의 용병(알모가바르스)이 일자리를 잃었다. 템플 기사단 출신 모험가 로제르 데 플로르가 이끈 이 무리는 1303년 동로마 황제 안드로니코스 2세의 청으로 콘스탄티노폴리스에 와 아나톨리아의 튀르크를 막기로 했다. 라몬 무타네르의 연대기는 기병 1500명과 알모가바르스 4천 명 등 6천 명대라고 적었다. 1304년 키지코스에서 튀르크를 물리치고 필라델피아의 포위를 풀었으나, 그들은 동로마 백성도 약탈했다. 로제르는 카이사르 칭호까지 받았으나 1305년 4월 아드리아노폴리스에서 공동 황제 미카엘 9세의 알란 용병에게 살해되었고, 용병단은 갈리폴리를 거점으로 트라키아와 마케도니아를 휩쓸었다(카탈루냐의 복수). 1309년 무렵 테살리아에 이른 뒤 1310년 아테네 공작 발테르 5세 드 브리엔에게 고용되었다. 발테르가 보수를 주지 않고 쫓아내려 하자 1311년 3월 케피소스 강가에서 그의 기사군을 무찌르고 그를 죽였다(할미로스 전투라고도 부름). 용병단은 아테네 공국을 차지해 1312년 시칠리아 왕 프리드리히 3세의 아들을 공작으로 모셨고, 이 카탈루냐인의 공국은 1388년 피렌체 은행가 가문 아차이우올리에게 넘어갈 때까지 이어졌다."
  subjects: [byzantine-empire, sicily-kingdom, naples-kingdom, aragon, duchy-of-athens, thessaly, anatolian-beyliks]
  links:
    - { from: sicily-kingdom, to: duchy-of-athens, note: "프리드리히 3세 아들의 아테네 공작 즉위 (1312)" }
  tags: [war, politics]
  sources: ["Kenneth M. Setton, Catalan Domination of Athens, 1311–1388 (개정판, 1975)", "Ramon Muntaner, Crònica (Lady Goodenough 영역, 1920~1921)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)"]
