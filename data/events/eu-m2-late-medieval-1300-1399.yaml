  sources: ["Zigmantas Kiaupa·Jūratė Kiaupienė·Albinas Kunevičius, The History of Lithuania before 1795 (2000)", "S. C. Rowell, Lithuania Ascending: A Pagan Empire within East-Central Europe, 1295–1345 (1994)", "Janet Martin, Medieval Russia, 980–1584 (2판, 2007)"]
