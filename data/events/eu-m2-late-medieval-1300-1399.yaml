  sources: ["Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (2002)", "Elizabeth A. Zachariadou 엮음, The Ottoman Emirate (1300–1389) (1993)", "John V. A. Fine Jr., The Late Medieval Balkans (1987)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
