- id: charles-iv-1346
  year: 1346
  endYear: 1378
  title:
    ko: "카를 4세와 금인칙서"
  summary:
    ko: "룩셈부르크 가문의 카를 4세(1316년생)는 1346년 7월 교황 클레멘스 6세의 지지로 신성 로마 제국의 대립 왕으로 뽑혔고, 그해 8월 아버지인 보헤미아 왕 요한이 크레시에서 전사하자 보헤미아 왕이 되었다. 1347년 10월 바이에른의 루트비히 4세가 죽으면서 그의 지위가 굳어졌다. 프라하를 키워 1344년 대주교구를 세우고 1348년 중부 유럽 첫 대학(카를 대학)과 신시가를 만들었다. 1355년 4월 로마에서 황제로 대관되었다. 1356년 1월 뉘른베르크 제국 의회와 12월 메츠 의회에서 반포한 금인칙서는 왕을 뽑는 일곱 선제후(마인츠·쾰른·트리어의 대주교, 보헤미아 왕, 라인 궁중백, 작센 공, 브란덴부르크 변경백)를 정하고, 다수결로 뽑아 프랑크푸르트에서 선출하고 아헨에서 대관한다고 못 박았다. 교황의 승인은 필요 없게 되었고 선제후령은 장자 상속으로 나뉘지 않게 했다. 이 칙서는 1806년까지 제국의 기본법이 되었다. 합스부르크 공작 루돌프 4세는 이에 맞서 1358~1359년 위조 문서(대특권)로 '대공' 칭호와 특권을 주장했다. 카를은 1368년 하(下)라우지츠를 얻고 1373년 브란덴부르크를 사들여 룩셈부르크 가문의 영토를 넓혔고, 1376년 아들 벤체슬라우스를 로마 왕으로 뽑게 한 뒤 1378년 11월 죽었다."
