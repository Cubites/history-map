- id: charles-v-1364
  year: 1364
  endYear: 1380
  title:
    ko: "샤를 5세의 프랑스 회복"
  summary:
    ko: "샤를 5세(재위 1364~1380)는 푸아티에 이후 흔들린 프랑스를 되살렸다. 즉위 직후 1364년 5월 코슈렐에서 베르트랑 뒤 게클랭이 나바라·잉글랜드 편 군대를 무찔렀고, 9월 29일 오레에서 브르타뉴 계승 전쟁(1341~)을 가르는 싸움이 벌어졌다. 잉글랜드이 지원한 장 드 몽포르가 이기고 블루아 가의 샤를이 전사했으며 뒤 게클랭은 사로잡혔다. 1365년 4월 게랑드 조약에서 몽포르가 브르타뉴 공 장 4세로 인정되었다. 샤를은 약탈하는 용병단을 에스파냐로 보내(1366) 카스티야 내전에 끌어들였다(뒤의 사건). 흑태자가 아키텐에 무거운 세금을 매기자 가스코뉴 영주들이 1368~1369년 샤를 5세에게 호소했고, 샤를은 이를 받아들여 1369년 아키텐 몰수를 선언하며 전쟁을 다시 열었다. 그는 큰 전투를 피하고 성을 하나씩 되찾는 전략을 택했고, 1370년 대원수가 된 베르트랑 뒤 게클랭이 푸아투·생통주를 되찾았다. 흑태자는 1370년 9월 리모주를 약탈했으나 병으로 돌아갔다. 1372년 6월 라로셸 앞바다에서 제노바 출신 제독이 이끈 카스티야 함대가 잉글랜드 함대를 부수었다. 1373년 곤트의 존이 칼레에서 보르도까지 행군했으나 소득이 적었다. 1375년 브뤼허 휴전이 맺어졌고, 흑태자가 1376년, 에드워드 3세가 1377년 죽은 뒤 1380년 샤를이 죽을 때 잉글랜드에는 칼레와 보르도·바욘 일대 등 해안 거점만 남았다. 샤를은 상설 세금(원조세·소금세·호구세)을 자리잡게 하고 1370년 바스티유를 쌓기 시작했으며 루브르에 서재를 두었다."
  subjects: [france, england, brittany, castile, navarre, burgundy]
  links:
