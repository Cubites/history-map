# ── 1388 ~ 1396년: 티무르, 바예지트, 니코폴리스 ──────

- id: timur-tokhtamysh-1388
  year: 1388
  endYear: 1396
  title:
    ko: "티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편"
  summary:
    ko: "1388년 동쪽에서 명의 장군 남옥이 부이르 호에서 북원의 칸 토구스 테무르(쿠빌라이의 후손)를 크게 무찔렀다. 토구스 테무르는 서쪽으로 달아나다 그해 아릭 부케 가문의 예수데르에게 죽었고, 이로써 몽골 고원의 칸위는 쿠빌라이 가계를 떠났다(지도에서 북원은 1388년에 끝나고 몽골이 이어진다). 앞서 1387년 명은 만주의 나가추를 항복시켜 여진 지역까지 힘을 뻗었고, 1388년 철령 이북을 요구해 고려가 요동 정벌에 나섰다가 위화도 회군이 일어났다(한국사 사건 wihwado-1388). 서쪽에서는 티무르(사마르칸트에 도읍하고 중앙아시아·이란·이라크를 정복한 군주)가 칭기스 칸의 후손을 허수아비 칸으로 세우고 몽골 제국의 계승자를 자처했다. 그의 후원으로 올랐던 킵차크 칸 토크타미시는 1381년 무렵 칼카강에서 마마이를 꺾어 칸국을 합친 뒤(앞의 사건) 1385년 타브리즈를 공격하고 1387~1388년 트란스옥시아나를 침공하면서 티무르와 적이 되었다. 티무르는 1391년 6월 콘두르차강에서 토크타미시를 무찌르고, 토크타미시가 1394~1395년 캅카스를 넘어 다시 공격하자 1395년 4월 테레크강에서 크게 이긴 뒤 사라이, 아스트라한, 아조프(타나)의 제노바·베네치아 상관을 불태웠다. 이 타격으로 칸국은 흑해 교역의 중심 지위를 잃고 이전의 힘을 되찾지 못했다(15세기의 분열은 뒤의 사건 golden-horde-breakup-1437). 이 사이 모스크바 대공 바실리 1세는 1392년 사라이에서 니즈니노브고로드·무롬·타루사 등의 지배 허가를 얻어(1393년 합침) 루스 공국들의 마지막 큰 독립 영토를 흡수했고, 1397년에는 노브고로드의 베젯스크 베르흐와 볼로그다 같은 땅을 빼앗았다(드비나 땅은 이듬해 노브고로드가 되찾음). 몰다비아의 로만 1세도 칸국이 약해진 틈에 1392년 무렵 도나우 하구와 흑해 연안으로 땅을 넓혔다. 토크타미시는 1396년 리투아니아의 비타우타스에게 피신했다. 한편 티무르는 1395년 명이 보낸 사신 부안(傅安) 일행을 사마르칸트에 억류했다(1407년까지). 1399년 보르스클라강에서 토크타미시를 복위시키려던 비타우타스가 킵차크 칸 티무르 쿠틀루그의 실권자 에디게(토크타미시의 옛 장수, 대티무르와는 다른 사람)에게 크게 진 것도 이 결과의 하나다(뒤의 사건 vytautas-smolensk-1401)."
  subjects: [golden-horde, grand-duchy-of-moscow, rus-principalities, novgorod-republic, moldavia, ming, northern-yuan, mongols, jurchen, goryeo, genoa, venice]
