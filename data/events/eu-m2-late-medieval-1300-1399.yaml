- id: great-schism-1378
  year: 1378
  endYear: 1398
  title:
    ko: "교회 대분열과 위클리프"
  summary:
    ko: "1378년 3월 그레고리우스 11세가 로마에서 죽자 4월 소집된 콘클라베가 로마 군중의 압력 속에서 나폴리 출신 바르톨로메오 프리냐노를 우르바누스 6세로 뽑았다. 그가 추기경들을 거칠게 꾸짖자 프랑스 출신이 많은 추기경 13명이 아나니로 물러나 8월에 4월 선거가 무효라고 선언하고, 9월 20일 폰디에서 제네바의 로베르를 클레멘스 7세로 뽑았다. 클레멘스 7세는 1379년 6월 아비뇽으로 갔다(앞의 사건 아비뇽 교황청). 서유럽은 둘로 갈라졌다. 우르바누스를 따른 곳은 이탈리아 대부분과 잉글랜드, 신성 로마 제국, 헝가리, 폴란드, 보헤미아, 플랑드르, 스칸디나비아였고, 클레멘스를 따른 곳은 프랑스, 스코틀랜드, 나폴리(조반나 1세, 우르바누스가 폐위하고 1380년 두라초의 카를로 3세를 세움), 카스티야(1381), 아라곤(1387), 나바라였다. 양쪽은 파문과 전쟁을 주고받았다. 대학과 군주들이 해결책(둘 다 물러나기, 공의회)을 찾았으나, 1394년 클레멘스 7세가 죽자 아비뇽의 추기경들은 베네딕투스 13세(페드로 데 루나)를 뽑았다. 1398년 7월 프랑스 성직자 회의가 베네딕투스에 대한 복종을 거두었고 카스티야도 뒤따랐다. 분열은 1409년 피사 공의회가 세 번째 교황을 세우는 소동을 거쳐 1417년 콘스탄츠 공의회에서야 끝난다(뒤의 사건 constance-1414). 한편 옥스퍼드의 존 위클리프(1328년 무렵~1384)는 성경을 신앙의 유일한 기준으로 삼고 교황의 세속 권력과 성찬의 화체설을 비판했고, 1382년 5월 블랙프라이어스 회의에서 그의 주장 24개가 단죄되었다. 그는 두 교황의 다툼을 교황권의 타락으로 보았다. 그의 추종자 롤라드는 영어 성경을 퍼뜨렸다. 1382년 리처드 2세와 보헤미아의 안나의 혼인을 통해 위클리프의 저작이 프라하로 전해져 얀 후스로 이어졌다."
  subjects: [papal-states, france, england, holy-roman-empire, naples-kingdom, castile, aragon, scotland, bohemia-kingdom, hungary-kingdom, poland-kingdom, navarre]
  links:
