# 유럽 중세 사건 2차 묶음: 오스만의 시작에서 니코폴리스까지 (1302 ~ 1398, 작업 EVM2)
# 범위: 오스만 1세와 오르한, 카탈루냐 용병단, 스코틀랜드 독립 전쟁, 템플 기사단의 해체, 앙주 헝가리, 아비뇽 교황청과 교회 대분열, 킵차크 칸국과 모스크바의 칼리타,
#   스위스 동맹, 리투아니아의 확장, 스웨덴-노르웨이 동군, 폴란드 재통일, 아라곤의 사르데냐·마요르카, 스테판 두샨의 세르비아 제국, 백년 전쟁의 전반
#   (슬로이스·크레시·푸아티에·브레티니·샤를 5세), 흑사병과 유대인 학살, 자크리, 와트 타일러, 치옴피, 쿨리코보, 크레보 연합, 코소보, 티무르와 토크타미시,
#   바예지트의 확장, 니코폴리스, 칼마르 동맹, 비스콘티의 밀라노.
# 깊이: 고등학교 세계사 교과서 본문 수준에, 1300~1399년 지도에서 생기거나 끝난 항목(룸 술탄국 1308, 왈라키아·로도스 기사단국 1310, 대페름 1324, 서조지아 1330,
#   테살리아 1333, 에레트나 1335, 둘카디르 1337, 마요르카 1344, 몰다비아·세르비아 제국·도브루자 1346, 프스코프 1348, 모레아 1349, 갈리치아-볼히니아·도피네 1349,
#   폴란드 공국들 1351, 알바니아·제타 영주국들 1355, 비딘 1356, 라구사 1358, 부르고뉴 1363, 모라바 세르비아·브란코비치·세르비아 영주국들 1371, 킬리키아 아르메니아 1375,
#   보스니아 왕국 1377, 플랑드르 1384, 북원·몽골 1388, 루스 공국들 1392, 불가리아 제2제국 1393, 밀라노 1395, 칼마르 동맹·덴마크·노르웨이 1397, 에레트나 1398)를
#   모두 subjects로 이음(docs/REGION_GUIDE.md §5, 점검 방식은 EVD2·EVM1의 성립·소멸 점검과 같음). 지도의 큰 변화(1만 km² 넘는 버전 해)도 사건으로 이음.
# 한국사와 닿는 점: 원 간섭기의 고려 사건과 킵차크 칸국·원의 관계(우즈베크 칸 사건), 흑사병과 몽골 교역로(원을 subjects로, 고려의 반원 개혁은 서술로),
#   명의 건국과 북원의 끝, 위화도 회군의 배경(티무르 사건에서 명·북원·몽골·여진·고려를 subjects로)을 이었다. 04번 고려 파일에 있는 사건은 다시 만들지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 날짜: 1582년 10월 그레고리력 개정 전의 날짜는 당시 쓰던 율리우스력이라 양력(그레고리력)과 9~10일 차이가 나므로 달까지만 적거나 통설의 날짜를 적었다.
# places의 year: 기간이 있는 사건은 장소마다 싸운 해를 적어 그 해에만 전투 표시가 보이게 했다. 전투·포위가 없는 사건에는 places를 달지 않았다.
# 나이는 만 나이로 적었다(리처드 2세 열네 살, 샤를 6세 열세 살 등).
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서(한국어 번역본이 확인된 것만 번역본으로). 병력·사상자·인구는 연구자마다 크게 달라 범위와 '추산'으로 적었다. 운영자 검수 필요.

# ── 1302 ~ 1315년: 오스만의 시작, 카탈루냐 용병단, 스코틀랜드 독립 전쟁, 템플 기사단, 앙주 헝가리, 아비뇽 교황청 ──────

- id: osman-orhan-1302
  year: 1302
  endYear: 1337
  title:
    ko: "오스만 1세와 오르한: 비티니아의 정복과 안드로니코스 3세의 회복"
  summary:
    ko: "소아시아 북서부 비티니아 변경에서 오스만 1세가 이끈 튀르크 전사(가지) 집단이 약해진 동로마 국경을 잠식했다. 오스만의 생애는 한 세기 남짓 뒤의 연대기로만 전해 불확실하고, 1299년 무렵을 나라의 시작으로 삼는 것이 관례다. 1302년 7월 니코메디아 근처 바페우스에서 동로마 장군 게오르기오스 무잘론의 군대를 무찔렀다는 것이 첫 큰 승리로 꼽힌다. 룸 술탄국은 일 칸국의 속국으로 이름만 남아 있다가 1308년 무렵 마지막 술탄 마수드 2세가 죽으며 사라졌고, 아나톨리아는 카라만·잔다르 같은 베이국들로 갈라졌다. 오스만 1세의 아들 오르한(재위 1324년 무렵~1362)은 1326년 4월 긴 포위 끝에 부르사를 얻어 도읍으로 삼았고(오스만 1세는 이 무렵 죽었다고 전함), 1329년 6월 펠레카논에서 황제 안드로니코스 3세가 직접 이끈 동로마군을 물리친 뒤 1331년 니카이아(이즈니크), 1337년 니코메디아(이즈미트)를 차지해 비티니아를 모두 넘겨받았다. 한편 안드로니코스 3세(재위 1328~1341)는 아시아를 잃어 가는 가운데 유럽 쪽 땅을 되찾았다. 1329년 제노바인 마르티노 차카리아에게서 키오스를 되찾았고, 1333년 상속 다툼으로 무너진 테살리아(두카스 가문의 땅)를, 1337년 에피루스를 합쳤다. 펠로폰네소스의 동로마 땅(모레아)도 1320년대에 프랑크계 아카이아 공국의 땅을 얻어 넓어졌다. 이렇게 동로마의 아나톨리아 영토는 거의 사라지고 오스만은 마르마라해 연안에서 동로마와 바로 맞닿게 되었다."
  subjects: [ottoman, rum-sultanate, byzantine-empire, anatolian-beyliks, karaman-beylik, candar-beylik, thessaly, epirus-despotate, achaea]
  links:
