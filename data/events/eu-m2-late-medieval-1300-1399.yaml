- id: charles-robert-1308
  year: 1308
  endYear: 1342
  title:
    ko: "카로이 로베르트의 앙주 헝가리와 왈라키아의 독립"
  summary:
    ko: "아르파드 왕가의 남계가 1301년 끊긴 뒤 헝가리 왕위는 여러 후보가 다퉜다. 나폴리 왕 카를로 2세의 손자인 카로이 로베르트(카를 1세 로베르트)는 교황의 지지와 일부 귀족의 도움으로 1308년 11월 왕으로 뽑혔고, 1310년 8월 세케슈페헤르바르에서 성스러운 왕관으로 대관식을 치러 정통성을 굳혔다. 그는 북부의 대귀족과 오랜 싸움 끝에 1312년 6월 로즈고니(로자노프체)에서 아바 가문을 꺾었고(처크 마테는 1321년 죽을 때까지 버텼다) 왕령지와 성을 되찾았다. 1323년 궁정을 비셰그라드로 옮기고 1325년 금화 포린트(플로린)를 찍었으며, 크렘니차의 금광 수입을 왕이 관리해 서유럽에서 손꼽히는 재력을 쌓았다. 서남쪽에서는 보스니아 공 스테판 2세 코트로마니치가 1326년 세르비아 쪽에서 훔(자훔례) 땅을 차지해 아드리아해 쪽으로 뻗었다. 남동쪽에서는 킵차크 칸국(타타르)의 힘이 카르파티아 바깥 평원에서 약해져(지도에서는 1310년 무렵 도나우 하류 북쪽을 칸국 땅에서 뺌) 왈라키아의 군주 바사랍 1세(통설로는 1310년 무렵 즉위, 사료에는 1324년 헝가리 왕의 문서에 처음 나옴)가 헝가리의 종주권에서 벗어났다. 카로이는 바사랍이 세베린 지방을 차지하자 1330년 말 군대를 이끌고 갔다가 포사다 부근 산길에서 매복에 걸려 크게 졌고, 왕은 부하와 갑옷을 바꿔 입고 겨우 빠져나왔다. 이로써 왈라키아는 사실상 독립한 공국이 되었다. 1335년 비셰그라드에서 카로이는 보헤미아 왕 요한과 폴란드 왕 카지미에시 3세를 만나 요한이 폴란드 왕위 요구를, 카지미에시가 슐레지엔 요구를 접도록 중재했고, 1339년 비셰그라드 회담으로 카지미에시에게 아들이 없으면 헝가리 앙주 가문이 폴란드를 잇기로 했다. 카로이가 1342년 죽자 아들 러요시 1세가 이었다(뒤의 사건)."
  subjects: [hungary-kingdom, wallachia, naples-kingdom, bohemia-kingdom, poland-kingdom, bulgaria-second, bosnian-banate, golden-horde]
  links:
