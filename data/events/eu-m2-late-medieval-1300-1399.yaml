  sources: ["Jonathan Sumption, The Hundred Years War, Vol. 3: Divided Houses (2009)", "Françoise Autrand, Charles V (1994, 프랑스어)", "Richard Barber, Edward, Prince of Wales and Aquitaine (1978)"]
