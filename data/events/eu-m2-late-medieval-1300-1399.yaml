- id: scottish-independence-1314
  year: 1303
  endYear: 1328
  title:
    ko: "스코틀랜드 독립 전쟁: 배넉번과 아브로스 선언"
  summary:
    ko: "1303년 5월 파리 조약으로 프랑스 왕 필리프 4세가 가스코뉴를 에드워드 1세에게 돌려주고 스코틀랜드를 버리자 에드워드 1세는 스코틀랜드 정복에 힘을 쏟았고, 윌리엄 월러스는 1305년 8월 처형되었다. 1306년 2월 로버트 브루스가 경쟁자 존 커민을 교회에서 죽인 뒤 그해 3월 스콘에서 스코틀랜드 왕으로 즉위했다. 잉글랜드의 에드워드 1세가 1307년 7월 죽고 에드워드 2세가 이어받자 브루스는 성들을 하나씩 되찾았다(1314년 초 록스버러와 에든버러). 스털링 성이 1314년 6월 24일까지 구원받지 못하면 항복하기로 약속하자 에드워드 2세가 대군을 이끌고 왔으나, 6월 23~24일 배넉번에서 스코틀랜드 창병 진영이 잉글랜드 중기병을 막아 크게 이겼다. 스코틀랜드군이 수적으로 열세였다고 전하지만 연대기마다 수치가 크게 다르다. 브루스의 동생 에드워드는 1315년 아일랜드를 침공했으나 1318년 10월 전사했다(뒤의 사건 ireland-bruce-1315). 브루스는 같은 해 베릭을 되찾았다. 1320년 4월 6일 스코틀랜드 귀족들이 브루스를 파문했던 교황 요한 22세에게 보낸 편지(아브로스 선언)는 스코틀랜드가 오래된 독립 왕국임을 내세우고, 왕이 잉글랜드에 굴복하면 다른 왕을 세우겠다고 밝혔다. 교황은 1324년 브루스를 왕으로 불렀다. 1326년 프랑스와 새로 맺은 코르베유 조약은 오랜 동맹을 되살렸다. 1328년 3월 에든버러-노샘프턴 조약으로 잉글랜드는 스코틀랜드의 독립과 브루스의 왕위를 인정했고, 브루스의 아들 데이비드와 에드워드 3세의 누이 조앤이 혼인하기로 했다. 브루스는 이듬해 6월 죽었고 1332년에 제2차 독립 전쟁이 시작되어 백년 전쟁과 얽혔다(뒤의 사건)."
