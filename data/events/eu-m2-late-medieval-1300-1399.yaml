  tags: [war, politics]
  sources: ["Donald M. Nicol, The Reluctant Emperor: A Biography of John Cantacuzene, Byzantine Emperor and Monk, c. 1295–1383 (1996)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "게오르크 오스트로고르스키, 『비잔티움 제국사』(한정숙·김경연 옮김, 까치글방)"]
