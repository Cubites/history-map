- id: burgundy-flanders-1363
  year: 1363
  endYear: 1385
  title:
    ko: "필리프 2세(르 아르디)의 부르고뉴와 플랑드르 상속"
  summary:
    ko: "프랑스 왕 장 2세는 1361년 대가 끊긴 부르고뉴 공국을 왕령에 합친 뒤, 1363년 막내아들 필리프 2세(르 아르디, 1342년생)에게 부르고뉴 공작령을 영지로 주었다. 필리프는 푸아티에에서 아버지 곁에서 싸우다 함께 사로잡힌 인물이다. 샤를 5세는 잉글랜드 에드워드 3세가 아들 에드먼드를 플랑드르 상속녀 마르그리트와 혼인시키려던 계획을 막고 필리프와 짝지어 1369년 6월 헨트에서 혼인시켰다. 1384년 1월 플랑드르 백작 루이 2세가 죽자 필리프는 아내를 통해 플랑드르·아르투아·부르고뉴 백작령(프랑슈콩테)을 물려받았다. 그 앞서 1379년 헨트가 백작에 맞서 봉기했고, 야코프 반 아르테벨데의 아들 필리프가 1382년 5월 베버르후츠펠트에서 백작군을 이긴 뒤 브뤼허를 차지했다. 같은 해 11월 27일 로제베커에서 프랑스 왕 샤를 6세(열세 살)와 필리프 공의 기사군이 플랑드르 시민군을 무찌르고 반 아르테벨데가 죽었다. 헨트는 잉글랜드의 지원(1383년 노리치 주교 헨리 디스펜서의 십자군)을 받으며 버티다 1385년 12월 투르네 화약으로 필리프와 화해했다. 이렇게 부르고뉴 공국과 저지대 땅이 한 가문에 모이기 시작해, 15세기의 부르고뉴 국가(필리프 선량공의 저지대 통합, 뒤의 사건 burgundy-netherlands-1428)의 바탕이 되었다. 필리프는 샤를 6세의 어린 시절 섭정단의 일원으로 프랑스 정치도 좌우했다."
  subjects: [burgundy, flanders, france, england, holy-roman-empire]
  links:
    - { from: france, to: burgundy, note: "필리프에게 부르고뉴 공작령을 영지로 줌 (1363)" }
