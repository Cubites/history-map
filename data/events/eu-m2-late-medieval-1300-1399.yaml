- id: castile-trastamara-1366
  year: 1366
  endYear: 1391
  title:
    ko: "카스티야의 트라스타마라 왕조와 포르투갈의 아비스 왕조"
  summary:
    ko: "카스티야 왕 페드로 1세(재위 1350~1369)는 귀족과 아라곤 왕 페드로 4세와 싸우는 가운데(두 페드로의 전쟁, 1356~1375) 이복형제 엔리케 데 트라스타마라(알폰소 11세의 서자)의 반란을 맞았다. 프랑스의 샤를 5세가 뒤 게클랭이 이끄는 용병단을 보내 도우니 엔리케는 1366년 3월 왕으로 선포되어 부르고스(라스우엘가스)에서 대관되었다. 페드로는 흑태자에게 도움을 청했고 1367년 4월 3일 나헤라에서 흑태자와 잉글랜드·가스코뉴군이 엔리케군을 무찌르고 뒤 게클랭을 사로잡았다. 그러나 흑태자가 약속한 돈을 받지 못해 물러났고, 엔리케는 돌아와 1369년 3월 14일 몬티엘 전투에서 이기고 3월 23일 페드로를 죽였다. 엔리케 2세(재위 1369~1379)와 함께 트라스타마라 왕조가 시작되었다. 카스티야는 프랑스 편에 서서 잉글랜드과 싸웠고(앞의 사건 charles-v-1364), 곤트의 존은 페드로의 딸 콘스탄사와 1371년 혼인해 카스티야 왕위를 요구했다. 포르투갈에서는 페르난두 1세가 1383년 10월 죽으며 딸 베아트리스가 카스티야 왕 후안 1세와 혼인해 있었다. 리스본 시민과 상인은 카스티야가 포르투갈을 다스리는 것을 거부하고, 왕의 서자 이복형제인 아비스 기사단장 주앙을 1383년 12월 왕국의 수호자로 세웠다. 1385년 4월 코임브라 코르테스에서 주앙 1세로 뽑혔고, 8월 14일 알주바로타에서 주앙과 누누 알바르스 페레이라가 이끈 포르투갈군(잉글랜드 궁병이 거듦)이 수적으로 훨씬 우세한 카스티야군을 무찔렀다. 1386년 5월 윈저 조약으로 잉글랜드와 포르투갈이 동맹을 맺었고, 곤트의 존은 1386년 7월 갈리시아에 상륙했으나 1388년 바욘 조약으로 딸 카탈리나를 카스티야 왕세자(엔리케 3세)와 혼인시키고 요구를 거두었다. 이 시기 카스티야의 유대인들은 높아진 반감 속에서 큰 타격을 입었다. 1391년 6월 에시하 부주교 페란트 마르티네스의 설교에 선동된 군중이 세비야의 유대인 구역을 덮쳐 학살이 시작되었다. 학살은 카스티야와 아라곤의 여러 도시로 번졌고 많은 유대인이 죽거나 강제로 개종해 콘베르소가 되었다(사망자 수는 추산이 크게 다르다)."
  subjects: [castile, aragon, portugal, england, france, navarre]
