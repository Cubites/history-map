  tags: [war, politics]
  sources: ["Colin Imber, The Ottoman Empire, 1300–1650: The Structure of Power (2002)", "John V. A. Fine Jr., The Late Medieval Balkans (1987)", "Donald M. Nicol, The Last Centuries of Byzantium, 1261–1453 (2판, 1993)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
