- id: aragon-sardinia-1323
  year: 1323
  endYear: 1349
  title:
    ko: "아라곤 왕관령의 확장: 사르데냐 정복과 마요르카 병합"
  summary:
    ko: "아라곤 왕 하이메 2세는 1297년 교황 보니파시오 8세에게서 사르데냐-코르시카 왕국을 봉토로 받았으나 실제 정복은 1323년에야 시작되었다. 왕자 알폰소(뒤의 알폰소 4세)가 1323년 6월 섬 남서부에 상륙해 피사인의 땅을 공략했고(아르보레아의 판관이 도왔다), 1324년 2월 루코시스테르나에서 피사군을 이긴 뒤 1326년 칼리아리가 항복하면서 피사는 섬 남부를 내놓았다. 이때 사르데냐 왕국이 아라곤 왕관령에 들어왔으나, 아르보레아 판관국은 곧 아라곤에 등을 돌려 섬 대부분을 장악해 갔다(1353년 이후의 일은 뒤의 사건 aragon-succession-1409에서 이어진다). 아라곤 왕 페드로 4세(재위 1336~1387)는 마요르카 왕 하이메 3세에게 신하의 예를 요구하다 1343년 군대를 보내 발레아레스 제도를 합쳤고, 1344년 루시용과 세르다냐까지 차지해 마요르카 왕국을 없앴다. 하이메 3세는 1349년 4월 몽펠리에를 프랑스 왕에게 팔았고 그해 10월 마요르카를 되찾으려다 유크마조르(Llucmajor) 전투에서 죽었다. 한편 페드로는 1347년 발렌시아와 아라곤 귀족의 연합(우니오)이 일어나자 1348년 7월 에필라에서 이를 꺾고 특권을 거두었다. 이 시기 아라곤도 흑사병(1348년부터)에 시달렸다."
