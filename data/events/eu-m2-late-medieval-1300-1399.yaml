# ── 1315 ~ 1333년: 브루스의 아일랜드 침공과 얼스터 백작령의 붕괴 ──────

- id: ireland-bruce-1315
  year: 1315
  endYear: 1333
  title:
    ko: "아일랜드: 브루스의 침공에서 얼스터 백작령의 붕괴까지"
  summary:
    ko: "1315년 5월 스코틀랜드 왕 로버트 브루스의 동생 에드워드 브루스가 군대를 이끌고 북아일랜드에 상륙해 잉글랜드 왕의 지배(아일랜드 영주령)에 맞선 게일 영주들의 지지를 얻었다. 그는 1316년 5월 던독 부근에서 아일랜드 대왕으로 추대되었고 로버트도 1317년 직접 건너와 도왔으나, 1315~1317년의 대기근과 군대의 약탈로 민심을 잃었다. 에드워드는 1318년 10월 14일 던독 근처 포하트에서 존 드 버밍엄이 이끈 잉글랜드계 군대에게 죽었다. 침공은 이기지 못했으나 아일랜드 영주령의 잉글랜드계 정착민 사회를 크게 약하게 만들었다. 얼스터 백작령은 1326년 리처드 드 버그(붉은 백작)가 죽은 뒤 손자 윌리엄 돈 드 버그가 이었으나 1333년 6월 그가 신하들에게 살해되었다. 어린 딸이 상속하게 되자 코노트의 버크 가문 같은 친척들이 땅을 차지해 게일식 이름과 풍습을 받아들이며 독립했고, 잉글랜드 왕권이 실제로 미치는 땅은 더블린 둘레(훗날의 페일) 등으로 줄어들었다. 지도에서도 1333년에 아일랜드 영주령의 땅이 줄고 게일 영주들(묶음)의 땅이 늘어난다. 이 위축은 1366년 킬케니 법령(잉글랜드계 주민이 게일식 풍습·언어를 쓰는 것을 금지)으로도 막지 못했다."
  subjects: [lordship-of-ireland, gaelic-irish-lordships, scotland, england]
  links:
    - { from: scotland, to: lordship-of-ireland, note: "에드워드 브루스의 침공 (1315~1318)" }
