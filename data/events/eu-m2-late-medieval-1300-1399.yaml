# ── 1341 ~ 1360년: 동로마 내전, 앙주 헝가리, 동지중해 십자군, 카를 4세, 흑사병, 오스만의 유럽 진출, 푸아티에와 브레티니 ──────

- id: byzantine-civil-war-1341
  year: 1341
  endYear: 1354
  title:
    ko: "동로마 내전과 갈리폴리의 상실"
  summary:
    ko: "1341년 6월 안드로니코스 3세가 죽고 여덟 살 요한네스 5세가 이었다. 섭정 자리를 두고 황제의 오랜 측근 요한네스 6세 칸타쿠제노스와 황후 안나(사보이아 출신), 총대주교 요한네스 14세 칼레카스, 해군 제독 알렉시오스 아포카우코스가 맞섰고, 칸타쿠제노스는 1341년 10월 디디모테이콘에서 황제를 자칭했다. 1341~1347년의 내전에는 외국 세력이 얽혔다. 칸타쿠제노스는 아이든의 우무르 베이와 오스만의 오르한(1346년 칸타쿠제노스의 딸 테오도라와 혼인)을 끌어들였고, 반대편은 세르비아의 스테판 두샨과 불가리아의 도움을 받았다. 테살로니키에서는 1342~1349년 '젤롯' 당이 귀족을 내쫓고 도시를 다스렸다. 두샨은 이 틈에 마케도니아를 차지했다(앞의 사건). 불가리아 북동쪽 도브루자에서는 발리크와 도브로티차 같은 영주들이 자립해 흑해 연안 도시들을 다스렸다(1346년 무렵의 도브루자 전제공국). 1347년 2월 칸타쿠제노스가 콘스탄티노폴리스에 들어가 요한네스 5세와 공동 황제가 되었고, 아들 마누엘이 1349년 미스트라스의 모레아 전제공으로 갔다(이 지도에서는 모레아도 1452년까지 동로마 땅으로 칠함). 1352~1357년의 두 번째 내전은 요한네스 5세와 칸타쿠제노스 가문이 싸웠고 오르한의 아들 쉴레이만이 갈리폴리 반도에 처음 발을 붙였다. 1354년 3월 지진이 갈리폴리 성벽을 무너뜨리자 쉴레이만이 도시를 차지해 튀르크 이주민을 들여앉혔고, 칸타쿠제노스는 1354년 12월 물러나 수도사 요아사프가 되었다. 한편 그레고리오스 팔라마스의 헤시카즘(침묵 기도) 논쟁은 1341년, 1347년, 1351년 공의회를 거쳐 정통 교리로 인정되었다. 내전은 동로마를 약하게 만들었고 오스만에게 유럽의 발판을 주었다."
  subjects: [byzantine-empire, serbia-medieval, serbian-empire, bulgaria-second, ottoman, anatolian-beyliks, dobruja-despotate, morea-despotate]
  links:
