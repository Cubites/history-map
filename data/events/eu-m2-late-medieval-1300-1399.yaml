- id: valdemar-stralsund-1340
  year: 1340
  endYear: 1370
  title:
    ko: "발데마르 4세와 슈트랄준트 조약"
  summary:
    ko: "덴마크는 크리스토페르 2세가 죽은 1332년부터 왕이 없던 시기에 홀슈타인 백작들이 유틀란트를 다스리고 스코네 같은 땅이 스웨덴 왕에게 넘어가는 등 흩어졌다. 1340년 왕이 된 발데마르 4세(아테르다그, '다시 날이 밝다')는 저당 잡힌 땅을 되사거나 정복해 왕국을 하나로 합쳤다. 1343년 에스토니아에서 성 게오르기오스의 밤 봉기가 일어나자 그는 1346년 에스토니아 북부의 덴마크령을 튜턴 기사단에 은 1만 9천 마르크에 팔았다. 1360년에는 스웨덴 왕 마그누스의 손에 있던 스코네·블레킹에·할란드를 되찾고, 1361년 7월 고틀란드의 부유한 한자 도시 비스뷔를 쳐 몸값을 받았다. 한자 도시들이 1362년 헬싱보리를 공격했다가 졌으나, 1367년 한자 도시들과 메클렌부르크·홀슈타인·스웨덴 왕 알브레히트가 맺은 쾰른 연합이 덴마크를 쳐 1368년 코펜하겐을 점령했다. 발데마르는 외국으로 피했고, 1370년 5월 슈트랄준트 조약으로 한자는 스코네의 네 요새(스카뇌르·팔스테르보·말뫼·헬싱보리)를 15년간 맡아 그 수입의 대부분을 가졌고, 15년 동안 발데마르 후계자의 선출에 동의할 권리도 얻었다(1376년 올라프의 선출 때 적용되었다고 전함). 이 조약은 한자 동맹의 전성기를 알린다. 발데마르는 1375년 죽었고 딸 마르그레테의 아들 올라프가 이었다(뒤의 사건)."
