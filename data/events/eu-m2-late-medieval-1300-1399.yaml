- id: swiss-morgarten-1315
  year: 1315
  endYear: 1388
  title:
    ko: "모르가르텐에서 젬파흐까지: 스위스 동맹의 성장"
  summary:
    ko: "1291년 8월 우리·슈비츠·운터발덴의 세 숲 주가 맺은 맹약이 스위스 동맹의 시작으로 전한다(통설). 슈비츠는 이웃한 합스부르크 가문과 땅과 수도원 재산을 두고 다투었고, 합스부르크 공작 레오폴트 1세는 1315년 11월 15일 모르가르텐 고개 근처에서 숲 주 농민군의 매복에 걸려 기사군이 크게 졌다. 동맹은 그해 12월 브루넨에서 맹약을 새로 했다. 이어 루체른(1332), 취리히(1351), 글라루스와 추크(1352), 베른(1353)이 동맹에 들어와 '여덟 옛 주'가 되었다. 이 동맹은 하나의 나라가 아니라 여러 쌍방 맹약이 얽힌 것이었다. 레오폴트 3세는 고타르트 길목의 땅을 되찾으려 했으나 1386년 7월 9일 젬파흐에서 루체른과 숲 주 연합군에 크게 졌고 공작과 많은 귀족이 전사했다. 1388년 4월 네펠스에서도 글라루스인들이 합스부르크군을 막았다. 1393년 젬파흐 서약은 약탈 제한 같은 전쟁 규칙을 정했다. 이들은 신성 로마 제국의 일원이었으나 황제와 영주의 직접 지배를 벗어난 자치를 쌓아 갔다(1499년 뒤 사실상 독립, 1411년 뒤는 뒤의 사건)."
