- id: magnus-eriksson-1319
  year: 1306
  endYear: 1350
  title:
    ko: "마그누스 에릭손의 스웨덴·노르웨이 동군과 노브고로드 원정"
  summary:
    ko: "호콘 5세(재위 1299~1319) 때 노르웨이는 1306~1307년 최북단 바르되에 요새(바르되후스)를 쌓아 핀마르크 동쪽 끝까지 지배를 뻗었다(지도에서는 1307년 노르웨이의 북동 확장). 스웨덴에서는 1306~1310년 왕 비르게르와 아우들인 에리크·발데마르 공들이 싸웠고, 1310년 헬싱보리 평화로 나라를 나눠 가졌다. 스웨덴의 지배는 이 무렵 보트니아만 북서 해안(베스테르보텐)까지 넓어졌다(지도에서는 1314년). 1312년 에리크 공이 호콘의 딸 잉에보르와 혼인해 1316년 아들 마그누스 에릭손이 태어났다. 마그누스는 1319년 외할아버지인 노르웨이 왕 호콘 5세가 죽자 세 살의 나이로 노르웨이 왕(마그누스 7세)이 되었고, 같은 해 스웨덴 왕(마그누스 4세)으로도 뽑혀 두 나라가 한 왕을 모시는 동군이 생겼다(1319~1343). 어린 동안은 섭정이 다스렸다. 덴마크에 왕이 없던 시기(1332~1340)에 홀슈타인 백작들에게 저당 잡혀 있던 스코네·블레킹에·할란드를 1332년 넘겨받았다. 1335년 스웨덴에서 노예(트랄) 제도를 금지했고 1350년 무렵 전국에 적용되는 나라 법(란슬라그)을 정했다. 동쪽 국경은 1323년 노브고로드와 맺은 오레호베츠(파흐키나사리) 조약이 정했다. 1343년 노르웨이 귀족들이 따로 왕을 요구하자 마그누스는 어린 아들 호콘 6세를 노르웨이 왕으로 세워 동군이 끝났다(큰아들 에리크는 스웨덴을 잇기로 함). 1348년 그는 교황의 십자군 허락을 받아 노브고로드를 쳐 8월 네바강 상류의 오레셰크(노테보리)를 차지했으나, 이듬해 2월 노브고로드가 되찾았다. 노브고로드는 이에 앞서 1348년 볼로토보 조약으로 프스코프의 독립을 인정한 터였다. 1349년 흑사병이 베르겐으로 들어와 노르웨이에서 크게 번졌다. 마그누스는 아들과 귀족의 도전을 받다 1364년 조카 알브레히트 폰 메클렌부르크에게 스웨덴 왕위를 잃었다(뒤의 사건 kalmar-1397)."
  subjects: [sweden-medieval, norway-medieval, denmark-medieval, novgorod-republic, pskov-republic]
  links:
