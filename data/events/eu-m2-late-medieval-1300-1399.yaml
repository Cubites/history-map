- id: kalmar-1397
  year: 1375
  endYear: 1397
  title:
    ko: "마르그레테와 칼마르 동맹의 성립"
  summary:
    ko: "발데마르 4세가 1375년 죽자 딸 마르그레테(1353년생)와 노르웨이 왕 호콘 6세 사이의 어린 아들 올라프(발데마르 4세의 외손자)가 1376년 덴마크 왕으로 뽑혔고, 마르그레테가 섭정으로 나라를 이끌었다. 올라프는 1380년 호콘이 죽자 노르웨이 왕도 되었으나 1387년 열여섯에 죽었고, 마르그레테가 덴마크(1387)와 노르웨이(1388)의 통치자로 인정받았으며 양자 에리크(포메른의 에리크, 1382년생)를 후계로 삼았다. 스웨덴에서는 귀족들이 마그누스 에릭손을 몰아내고 그의 조카 메클렌부르크의 알브레히트를 1363~1364년 왕으로 모셨다. 그러나 알브레히트가 독일인 신하를 중용하고 귀족의 땅을 거두려 하자 귀족들이 마르그레테를 도왔다. 1389년 2월 팔셰핑 전투에서 마르그레테의 군대가 알브레히트를 사로잡았다. 스톡홀름은 한자 도시의 사략선 무리 '비탈리안 형제단'을 불러 버텼다(1391~1398). 1397년 6월 칼마르에서 열린 회의에서 에리크가 세 나라의 왕으로 대관되어 덴마크·노르웨이·스웨덴이 한 왕 아래 칼마르 동맹으로 묶였다. 동맹의 조건을 적은 문서(칼마르 연합 문서)는 서명 없는 초안에 가까워 효력이 불분명했고, 각국이 자기 법과 귀족 회의를 둔다고 했다. 마르그레테는 사실상 동맹을 다스리다 1412년에 죽었다. 동맹은 스웨덴의 되풀이된 이탈(뒤의 사건 kalmar-breakup-1439)로 흔들리다 1523년 끝났다."
  subjects: [denmark-medieval, norway-medieval, sweden-medieval, kalmar-union-three-kingdoms, holy-roman-empire]
  links:
