  sources: ["Walter Ullmann, The Origins of the Great Schism (1948)", "Joëlle Rollo-Koster·Thomas M. Izbicki 엮음, A Companion to the Great Western Schism (1378–1417) (2009)", "Anthony Kenny, Wyclif (1985)"]

- id: peasants-revolt-1381
  year: 1381
  title:
    ko: "와트 타일러의 난: 잉글랜드 농민 봉기"
  summary:
    ko: "흑사병으로 일손이 줄자 영주는 임금과 부역을 묶으려 노동자 조례(1349년, 1351년)를 만들었다. 백년 전쟁의 비용을 대려 1377년, 1379년, 1380년에 인두세가 거듭 걷혔고, 1380년에는 열다섯 살 이상 모두에게 12펜스씩(부자는 더) 매겼다. 1381년 5월 말 에식스의 포빙에서 세금 징수원을 쫓아내며 시작된 봉기는 켄트로 번져 와트 타일러가 지도자로 떠올랐다. 반란군은 메이드스톤 감옥에서 설교자 존 볼('아담이 땅을 갈고 이브가 길쌈할 때 누가 귀족이었던가?')을 구했다. 6월 13일 런던으로 들어가 왕의 숙부 곤트의 존의 사보이 궁을 불태웠고 플랑드르 직공들을 죽였다. 14일 열네 살 리처드 2세가 마일엔드에서 농노 신분의 폐지를 약속했고, 같은 날 반란군이 런던탑에 들어가 대주교 겸 대법관 사이먼 서드버리와 재무장관 로버트 헤일스를 죽였다. 6월 15일 스미스필드에서 타일러가 런던 시장 윌리엄 월워스에게 칼에 맞아 죽자 왕이 '내가 너희의 대장이다'라며 군중을 달래 흩어지게 했다. 이후 약속은 취소되었고 존 볼은 7월 15일 처형되었다. 동앙글리아에서는 노리치 주교 헨리 디스펜서가 6월 말 노스월섬에서 반란군을 꺾었다. 봉기는 실패했으나 인두세는 한동안 다시 걷히지 않았고 노동자 조례는 점차 힘을 잃었으며 장원의 농노제는 15세기에 걸쳐 사라졌다. 같은 시기 피렌체의 치옴피(1378, 앞의 사건)와 플랑드르의 헨트(1379~1385)에서도 민중 봉기가 있었다."
  subjects: [england, flanders]
  tags: [society, politics]
  sources: ["Rodney Hilton, Bond Men Made Free: Medieval Peasant Movements and the English Rising of 1381 (1973)", "Alastair Dunn, The Great Rising of 1381: The Peasants' Revolt and England's Failed Revolution (2002)", "Juliet Barker, England, Arise: The People, the King and the Great Revolt of 1381 (2014)"]
  places: [{ name: "런던", at: [-0.1, 51.51], year: 1381 }, { name: "노스월섬", at: [1.39, 52.82], year: 1381 }]

- id: krewo-union-1385
  year: 1381
  endYear: 1398
  title:
    ko: "크레보 연합: 야기에우워와 야드비가"
  summary:
    ko: "1377년 알기르다스가 죽은 뒤 아들 요가일라(야기에우워)가 대공이 되었으나 숙부 케스투티스와 사촌 비타우타스가 맞섰다. 1381년 말 내전이 일어났고 1382년 8월 케스투티스가 크레보 성에 갇혀 죽었다(교살설이 있음). 비타우타스는 탈출해 튜턴 기사단에 의지했다. 폴란드에서는 러요시 1세가 1382년 죽자 어린 딸 야드비가가 1384년 10월 폴란드 '왕'으로 대관되었다. 폴란드 귀족은 그녀를 리투아니아 대공 요가일라와 혼인시키는 쪽으로 기울었다. 1385년 8월 14일 크레보 성에서 요가일라는 가톨릭으로 개종해 리투아니아를 기독교화하고 야드비가와 혼인하며 땅을 폴란드 왕관에 합치겠다고 약속했다(문서를 합병으로 볼지 연합으로 볼지는 논쟁이 있다). 1386년 2월 크라쿠프에서 세례를 받고(이름 브와디스와프) 야드비가와 혼인해 3월 폴란드 왕으로 대관되었다. 1387년에는 리투아니아의 공식 개종이 시작되어 빌뉴스 주교구가 세워졌고, 같은 해 야드비가는 헝가리 관리가 쥐고 있던 붉은 루스(할리치)를 되찾았다. 비타우타스는 1390년 기사단과 함께 빌뉴스를 포위했으나 실패했고, 1392년 오스트루프 협정으로 요가일라가 그를 리투아니아의 통치자로 인정했다. 비타우타스는 1395년 스몰렌스크 일대를 손에 넣었고(1404년 병합, 뒤의 사건 vytautas-smolensk-1401), 1398년 10월 살리나스 조약으로 기사단에 사모기티아를 넘기는 대신 지원을 약속받았다. 이렇게 폴란드-리투아니아 동군이 시작되어 1410년 그룬발트(뒤의 사건 grunwald-1410)와 1569년 루블린 연합으로 이어진다. 튜턴 기사단은 이제 이교가 아닌 기독교 나라를 상대하게 되어 십자군의 명분을 잃었다."
  subjects: [lithuania-grand-duchy, poland-kingdom, teutonic-order, terra-mariana, hungary-kingdom]
  links:
    - { from: lithuania-grand-duchy, to: poland-kingdom, note: "크레보 연합, 개종과 혼인 약속 (1385)" }
    - { from: poland-kingdom, to: hungary-kingdom, note: "붉은 루스 탈환 (1387)" }
  tags: [politics, diplomacy]
  sources: ["Oscar Halecki, Jadwiga of Anjou and the Rise of East Central Europe (1991)", "Zigmantas Kiaupa·Jūratė Kiaupienė·Albinas Kunevičius, The History of Lithuania before 1795 (2000)", "William Urban, The Samogitian Crusade (1989)"]
