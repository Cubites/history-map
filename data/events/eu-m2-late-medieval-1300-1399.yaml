  sources: ["Jonathan Sumption, The Hundred Years War, Vol. 2: Trial by Fire (1999)", "Jonathan Sumption, The Hundred Years War, Vol. 3: Divided Houses (2009)", "Anne Curry, The Hundred Years' War (2판, 2003)"]
