- id: black-death-1346
  year: 1346
  endYear: 1353
  title:
    ko: "흑사병과 유대인 학살"
  summary:
    ko: "페스트 대유행은 중앙아시아에서 시작되었다고 보는 연구가 많다. 2022년 유전체 연구(스피루 등)는 키르기스스탄 이시크쿨 호 근처 묘지의 1338~1339년 희생자에게서 흑사병 균주의 조상형을 찾았다고 밝혔다. 병은 몽골 제국이 이은 초원 교역로를 타고 킵차크 칸국에 이르렀고, 1346년 킵차크 칸 자니벡이 흑해 연안의 제노바 도시 카파(페오도시야)를 에워쌌을 때 군대 사이에 퍼졌다고 전한다(시체를 성안에 던졌다는 가브리엘레 데 무시의 이야기는 사실 여부가 논쟁적이다). 제노바 갤리선을 타고 1347년 콘스탄티노폴리스와 시칠리아 메시나, 마르세유, 제노바로 번졌고, 1348년에는 이탈리아·프랑스·이베리아와 그해 여름 잉글랜드, 1349년 독일과 노르웨이, 1351~1353년에는 폴란드와 발트, 루스(프스코프·노브고로드·모스크바, 모스크바 대공 시메온도 1353년 죽음)에 이르렀다. 사망률은 지역마다 달라 연구자 추산도 갈리지만 유럽 인구의 3분의 1에서 절반 안팎(30~60%)이 죽은 것으로 본다. 베네치아는 1348년 처음 위생 위원회를 두었고 라구사는 1377년 항구 격리 제도를 처음 법으로 정했다. 노동력이 줄어 임금이 오르자 잉글랜드는 1349년 노동자 조례로 임금을 묶으려 했다. 공포 속에서 우물에 독을 풀었다는 소문이 유대인에게 씌워졌다. 이미 1348년 4월 툴롱(약 40명)에서 주민들이 유대인 구역을 덮쳤고 바르셀로나와 카탈루냐의 여러 도시에서도 공격이 있었다. 1348년 가을 사부아의 시용 성(레만 호반) 재판에서 고문으로 얻은 자백이 퍼지자, 1349년 1월 바젤, 2월 14일 스트라스부르(시의회가 며칠 전 길드 세력으로 바뀐 뒤 수백 명이 불탐, 채무 탕감과 재산 분배가 동기로 지적됨), 3월 에르푸르트, 8월 마인츠와 쾰른 등 독일어권 도시에서 주민과 시 당국이 유대인 공동체를 학살하거나 쫓아냈다. 교황 클레멘스 6세는 1348년 칙서로 유대인에게 죄가 없다고 선언하고 보호를 명했으나 막지 못했다. 뉘른베르크에서는 황제 카를 4세가 유대인 구역의 처분을 미리 허락한 문서가 있다. 폴란드에서는 카지미에시 3세가 유대인을 보호해 많은 유대인이 이주해 갔다고 전한다. 중국 쪽 기록에도 14세기 중엽 전염병이 나오지만 같은 병인지는 논쟁이 있다. 이 무렵 고려는 공민왕의 반원 개혁(1356, 한국사 사건 gongmin-reform-1356)과 홍건적·왜구 침입을 겪었으나 같은 전염병이 번졌다는 뚜렷한 기록은 알려져 있지 않다."
  subjects: [genoa, venice, golden-horde, yuan, france, england, holy-roman-empire, papal-states, sicily-kingdom, aragon, castile, florence, poland-kingdom, novgorod-republic]
