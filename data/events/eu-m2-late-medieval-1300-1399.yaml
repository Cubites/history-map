- id: dusan-empire-1330
  year: 1330
  endYear: 1360
  title:
    ko: "스테판 두샨과 세르비아 제국"
  summary:
    ko: "1330년 7월 벨바즈드(지금의 불가리아 키우스텐딜) 전투에서 세르비아 왕 스테판 우로시 3세 데찬스키와 아들 스테판 두샨이 불가리아 황제 미하일 시시만을 무찌르고 죽였다. 두샨은 1331년 아버지를 몰아내고 왕이 되었다(데찬스키는 그해 감옥에서 죽음). 그는 1334년까지 동로마 안드로니코스 3세에게서 오흐리드와 프릴레프 같은 마케도니아 서부를 얻었고, 1341년부터 동로마 내전(뒤의 사건)을 틈타 마케도니아와 알바니아 대부분을 차지했다(1345년 9월 세레스). 1346년 4월 16일 부활절에 스코페에서 '세르비아인과 그리스인(로마인)의 황제'로 대관되었는데, 이를 위해 세르비아 대주교를 총대주교로 올렸고 동로마 총대주교청은 이를 인정하지 않았고, 칼리스토스 1세가 1350년대 초에 두샨과 세르비아 총대주교를 파문했다(문서는 전하지 않고 연대는 1350~1354년 사이로 추정하며 1375년에 풀렸다). 1347~1348년에는 에피루스와 테살리아를 차지하고 이복형제 시메온을 그곳 통치자로 앉혔다. 1349년 스코페에서 반포하고 1354년 세레스에서 늘린 『두샨 법전』은 비잔티움 법과 세르비아 관습법을 합쳐 귀족과 교회, 농민의 지위, 재판을 정했다. 두샨은 불가리아·보스니아와는 혼인과 동맹으로, 헝가리와는 1350년대에 충돌했고, 1355년 12월 콘스탄티노폴리스 원정을 앞두고 죽었다. 아들 우로시 5세가 이었으나 귀족들이 제각기 독립하면서 제국은 흩어졌고, 알바니아의 토피아와 발샤 같은 영주들이 서쪽에서 자립했다(1355년 무렵 알바니아·제타 영주국들). 에피루스와 테살리아에서는 시메온 우로시가 칭호만 유지하다 1356년 돌아온 니케포로스 2세 오르시니에게 밀려났고, 니케포로스가 1359년 아켈로오스강 가에서 알바니아인과 싸우다 죽은 뒤 에피루스는 알바니아 영주들(로샤·부아 가문)과 시메온에게 갈라졌다. 세르비아 제국은 1371년 우로시의 죽음으로 끝난다(뒤의 사건 ottoman-rumelia-1354)."
