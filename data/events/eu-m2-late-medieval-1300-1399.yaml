# ── 1385 ~ 1398년: 코소보, 비스콘티의 밀라노, 티무르와 토크타미시, 바예지트의 확장, 니코폴리스 ──────

- id: kosovo-1389
  year: 1385
  endYear: 1389
  title:
    ko: "코소보 전투"
  summary:
    ko: "무라드 1세는 1385년 소피아(세르디카), 1386년 니시를 차지하며 모라바강 유역을 위협했다. 마케도니아의 동로마 땅도 잇따라 삼켜 1383년 세레스를 얻었고 1383~1387년 포위한 테살로니키를 1387년 차지했다. 세르비아 쪽은 1386~1387년 플로치니크에서 오스만 선봉대를 물리쳤고(연대에는 논쟁이 있다), 1388년 8월 빌레차에서 보스니아의 블라트코 부코비치가 오스만군을 무찔렀다. 1389년 6월 15일(율리우스력, 성 비투스 축일 비도브단) 코소보 들판에서 무라드 1세의 군대가 세르비아 공 라자르 흐레벨랴노비치의 군대와 맞섰다. 라자르 쪽에는 사위 부크 브란코비치와 보스니아 왕 트브르트코 1세가 보낸 블라트코 부코비치의 분견대 등이 있었고 알바니아·왈라키아 병사도 있었다고 전한다. 무라드 1세와 라자르는 모두 죽었다. 오스만 쪽 사료는 무라드가 세르비아 귀족(밀로시 오빌리치라는 전승)에게 암살되었다고 전하나 세부는 후대에 덧붙은 것이다. 승패는 분명하지 않았다. 트브르트코는 서유럽 도시에 승리를 알렸고(피렌체의 살루타티는 축하 편지를 썼다) 오스만 쪽도 이겼다고 했다. 병력은 양쪽 모두 1만에서 3만 사이로 추산하나 사료가 적다. 무라드의 아들 바예지트 1세가 군을 맡아 동생 야쿠브를 죽이고 술탄이 되었다. 세르비아는 라자르의 아들 스테판 라자레비치(어머니 밀리차가 섭정)가 오스만의 신하가 되어 공물과 군역을 맡았고, 라자르의 딸 올리베라가 바예지트의 부인이 되었다. 부크 브란코비치는 한동안 버티다 신하가 되었다. 코소보는 뒷날 세르비아 민족 서사의 중심 소재가 되었는데, 서사시는 15세기 이후의 구전이라 사실과 거리가 있다."
  subjects: [ottoman, byzantine-empire, moravian-serbia, brankovic-lands, serbian-magnates, bosnia-kingdom, hungary-kingdom, wallachia, albanian-principalities, bulgaria-second]
  links:
    - { from: ottoman, to: moravian-serbia, note: "코소보 전투, 라자르의 죽음과 신하 관계 (1389)" }
  tags: [war]
  sources: ["Thomas A. Emmert, Serbian Golgotha: Kosovo, 1389 (1990)", "John V. A. Fine Jr., The Late Medieval Balkans (1987)", "Sima Ćirković, The Serbs (2004)", "캐럴라인 핑클, 『오스만제국사: 창건부터 튀르키예공화국 수립까지』(이재황 옮김, 책과함께, 2025)"]
  places: [{ name: "소피아", at: [23.32, 42.7], year: 1385 }, { name: "빌레차", at: [18.43, 42.88], year: 1388 }, { name: "코소보 들판", at: [21.09, 42.72], year: 1389 }]

- id: visconti-milan-1385
  year: 1385
  endYear: 1402
  title:
    ko: "잔갈레아초 비스콘티와 밀라노 공국"
  summary:
    ko: "밀라노의 비스콘티 가문은 14세기 내내 롬바르디아를 넓혀 왔다. 1385년 5월 잔갈레아초 비스콘티가 공동 통치자인 삼촌 베르나보를 속여 사로잡고 단독 영주가 되었다. 그는 1387년 베로나와 비첸차(스칼라 가문의 땅), 1388년 파도바(카라라 가문)를 차지했고, 1390~1392년 볼로냐를 노려 피렌체와 싸웠다. 1395년 신성 로마 제국의 로마 왕 벤체슬라우스에게 거액(10만 플로린이라 전함)을 주고 밀라노 공작 칭호를 샀다(5월 임명, 9월 확인). 이 칭호가 밀라노 공국(1395~)의 법적 근거가 되었다. 그는 1399년 피사, 1399~1400년 시에나와 페루자, 1402년 6월 볼로냐를 차지해 중북부 이탈리아를 거의 하나로 묶을 듯했으나 1402년 9월 페스트로 죽었다. 피렌체의 인문주의자 콜루초 살루타티는 그를 이탈리아의 자유를 위협하는 전제군주라 비난하며 피렌체의 방어를 옹호했는데, 한스 바론은 이를 시민적 인문주의의 출발로 보았다(이 해석에는 반론이 많다). 그가 죽자 영토는 두 아들에게 나뉘어 흩어졌고, 밀라노의 재건과 베네치아와의 다툼은 뒤의 사건(lombardy-wars-1423)으로 이어진다."
  subjects: [milan-signoria, milan, florence, venice, papal-states, holy-roman-empire, italian-minor-states, siena]
  links:
    - { from: holy-roman-empire, to: milan, note: "벤체슬라우스의 공작 칭호 수여 (1395)" }
    - { from: milan-signoria, to: florence, note: "피렌체와의 전쟁 (1390~1392, 1397~1398, 1400~1402)" }
