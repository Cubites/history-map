- id: bayezid-expansion-1388
  year: 1388
  endYear: 1398
  title:
    ko: "바예지트 1세의 확장: 불가리아의 멸망과 아나톨리아 베이국의 병합"
  summary:
    ko: "무라드 1세의 아들 바예지트 1세('번개', 재위 1389~1402)는 아나톨리아와 발칸에서 동시에 영토를 넓혔다. 발칸에서는 도브루자 전제공국이 1388년 무렵 왈라키아의 미르체아에게 넘어갔고(이반코가 1392년 오스만의 도움으로 되찾았으며 오스만은 15세기 초에 편입했다고 전해 연대에 논란이 있고, 지도는 1395년부터 오스만 땅으로 그린다), 1393년 7월 불가리아 제2제국의 도읍 터르노보를 세 달 포위해 차지했다. 마지막 황제 이반 시시만은 니코폴리스로 물러났다가 1395년 무렵 죽어 불가리아는 오스만에 흡수되었고, 터르노보 총대주교 에우티미우스는 쫓겨났다. 비딘 차르국의 이반 스라치미르는 1396년 니코폴리스 전투 뒤 오스만에 정복되어 사라졌다(뒤의 사건). 왈라키아의 미르체아 1세는 1395년 5월 로비네에서 바예지트의 침공을 막았다. 이 전투에서 오스만 편의 세르비아 신하 마르코 크랄레비치와 콘스탄틴 드라가시가 전사했다. 왈라키아에서는 이 시기 군주들이 수도원에 로마(집시) 가족을 바친 문서가 남아 로마 예속 관계의 가장 이른 기록으로 꼽히나, 문서의 연대에는 논란이 있다. 세르비아 영주들(묶음)의 땅은 1395년 무렵까지 대부분 오스만의 신하이거나 직접 지배로 들어갔다. 그리스 중부에서는 지도에서 1394년 아테네 공국의 북쪽 땅(테살리아 남부, 네오파트라와 살로나 일대)이 오스만 쪽으로 넘어간 것으로 그린다. 바예지트는 1391년 마누엘 2세가 즉위하자 콘스탄티노폴리스 안에 튀르크 법관(카디)과 구역을 두게 했고 1394년부터 도시를 봉쇄했다. 아나톨리아에서는 1390년 아이든·사루한·게르미얀·메네셰·하미드 같은 서아나톨리아 베이국을 흡수했고(지도 1390년의 큰 변화), 1392년 흑해 쪽 잔다르 베이국을 꺾었으며, 1397년 카라만의 알라에딘 베이를 이겨 콘야를 차지했다. 1398년에는 에레트나 왕조를 이은 카디 부르하네딘이 아크 코윤루에게 죽은 틈에 시바스를 병합했다. 이렇게 두 대륙을 함께 다스리게 된 오스만은 1402년 동쪽에서 온 티무르에게 무너진다(뒤의 사건 ankara-1402)."
  subjects: [ottoman, anatolian-beyliks, candar-beylik, karaman-beylik, eretnids, bulgaria-second, vidin-tsardom, dobruja-despotate, wallachia, serbian-magnates, byzantine-empire, hungary-kingdom, duchy-of-athens]
  links:
