- id: salado-1340
  year: 1340
  endYear: 1344
  title:
    ko: "살라도 전투와 알헤시라스 점령"
  summary:
    ko: "1330년대 모로코의 마린 왕조 술탄 아부 알하산이 이베리아로 건너와 카스티야의 해협 지배를 흔들었다. 1340년 4월 해협 해전에서 마린·그라나다 연합 함대가 카스티야 함대를 무찔렀고(제독 알폰소 호프레 테노리오 전사), 술탄은 타리파를 포위했다. 1340년 10월 30일 카스티야 왕 알폰소 11세와 장인인 포르투갈 왕 아폰수 4세가 타리파 가까운 살라도강에서 마린·그라나다군을 무찔렀다(병력 추산은 연구자마다 크게 다르다). 이 승리 뒤로 북아프리카 이슬람 세력이 해협을 건너 대규모로 개입하는 일은 드물어졌다. 알폰소 11세는 1342년 7월부터 알헤시라스를 포위해 1344년 3월 항복을 받았다(포위전에서 화약 무기가 쓰였다는 기록이 있다). 이 포위전에는 아라곤과 제노바의 함대와 유럽 여러 곳의 기사들이 거들었다. 그라나다 에미르국은 카스티야에 공물을 바치는 신하가 되었다. 알폰소는 1349년 지브롤터를 포위하다 흑사병에 걸려 1350년 3월 죽었다. 지브롤터와 론다는 마린 왕조 손에 남았다(지브롤터는 1374년 그라나다로 넘어감)."
