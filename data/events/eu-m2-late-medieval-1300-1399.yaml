  sources: ["Pál Engel, The Realm of St Stephen: A History of Medieval Hungary, 895–1526 (2001)", "John V. A. Fine Jr., The Late Medieval Balkans (1987)", "Neagu Djuvara, A Brief Illustrated History of Romanians (2014)"]
