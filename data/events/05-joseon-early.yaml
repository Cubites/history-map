  summary:
    ko: "왜구가 배 70여 척으로 전라도 해안을 침입했다. 이를 계기로 비변사가 상설 기구가 되어 국방 문제를 맡았다. 을묘왜변을 전후해 방어 체제가 여러 고을의 군사를 한곳에 모으고 중앙에서 보낸 장수가 지휘하는 제승방략 체제로 바뀌어 갔는데, 이 체제는 임진왜란 초기 패전의 한 원인이 되었다."
