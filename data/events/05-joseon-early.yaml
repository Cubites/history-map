- id: cheonsang-yeolcha-1395
  year: 1395
  title:
    ko: "「천상열차분야지도」 제작"
  summary:
    ko: "태조 때 고구려 천문도의 탁본을 바탕으로, 별자리 위치를 당시 하늘에 맞게 고쳐 검은 돌에 새긴 천문도를 만들었다. 1,467개의 별을 새겼으며, 권근이 제작 내력을 적었다. 새 왕조가 하늘의 뜻을 받았음을 보이려는 뜻도 담겨 있다."
  subjects: [joseon]
  tags: [culture]
  sources: ["「천상열차분야지도」 각석 권근 발문", "국가유산청 국보 「천상열차분야지도 각석」 해설"]

- id: joseon-gwageo-1398
  year: 1398
  endYear: 1485
  title:
    ko: "조선의 교육 기관과 과거 제도"
  summary:
    ko: "태조 때 한양에 성균관을 세워(1398) 생원·진사를 가르치는 최고 교육 기관으로 삼았고, 서울에는 4부 학당을, 지방의 군현마다 향교를 두어 교수나 훈도를 보냈다. 과거에는 문관을 뽑는 문과, 무관을 뽑는 무과, 역관·의관 같은 기술관을 뽑는 잡과가 있었으며, 문과는 생원·진사를 뽑는 소과와 대과로 나뉘었다. 정기 시험인 식년시는 3년마다 열렸고, 나라에 경사가 있을 때에는 증광시 같은 별시도 치렀다. 음서의 대상은 공신과 2품 이상 고관의 자손 등으로 고려보다 줄었고, 고관이 되려면 대개 문과에 합격해야 했다."
  subjects: [joseon]
  tags: [politics, culture]
  sources: ["『태조실록』 태조 7년", "『경국대전』 예전 제과·이전 음자제", "국사편찬위원회 『신편 한국사』 23"]

- id: joseon-government-1400
  year: 1400
  endYear: 1485
  title:
    ko: "조선의 중앙·지방 통치 체제"
  summary:
    ko: "정종 때(1400) 고려의 도평의사사를 없애고 의정부를 두었으며, 이후 『경국대전』으로 통치 조직이 완성되었다. 의정부의 3정승이 나랏일을 총괄하고 6조가 실무를 나누어 맡았으며, 승정원은 왕명을 출납하고 의금부는 왕명에 따라 중죄인을 다스렸다. 사헌부·사간원·홍문관의 3사는 언론과 감찰로 권력의 독점을 견제했다. 지방은 8도에 관찰사를 두고 모든 부·목·군·현에 수령을 보냈으며, 수령이 자기 출신 지역에 부임하지 못하게 하는 상피제를 적용했다. 향리는 수령을 보좌하는 세습 아전으로 지위가 낮아졌고, 서울에는 경재소를 두어 지방의 유향소를 통제했다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『정종실록』 정종 2년 4월", "『경국대전』 이전", "국사편찬위원회 『신편 한국사』 23 조선 초기의 정치 구조"]

- id: jeohwa-1401
  year: 1401
  endYear: 1423
  title:
    ko: "저화와 조선통보 발행"
  summary:
    ko: "태종이 사섬서를 두고(1401) 이듬해부터 닥나무 껍질로 만든 종이돈 저화를 유통시켰다(1402). 세종은 동전인 조선통보를 만들었다(1423). 그러나 쌀과 무명이 여전히 화폐처럼 쓰여 두 화폐 모두 널리 유통되지 못했다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『태종실록』 태종 1년·2년", "『세종실록』 세종 5년"]

- id: joseon-status-1401
  year: 1401
  endYear: 1600
  precision: century
  title:
    ko: "조선의 신분 제도 (양천제와 반상제)"
  summary:
    ko: "조선은 법으로는 백성을 양인과 천인으로 나누는 양천제를 두었다. 양인은 과거를 보고 벼슬할 수 있었지만 조세·공납·역의 의무를 졌다. 그러나 실제로는 양반·중인·상민·천민으로 나뉘는 반상제가 굳어졌고, 양반은 관직을 차지하며 점차 군역에서도 빠지는 특권층이 되었다. 서얼은 문과에 응시하지 못하고 벼슬에도 한품서용의 제한을 받았으며, 기술관·향리 같은 중인도 높은 관직에 오르기 어려웠다. 천민의 대부분인 노비는 재산처럼 사고팔거나 물려주었고, 부모 가운데 한쪽만 노비여도 자식이 노비가 되는 일천즉천의 원칙이 적용되었다."
  subjects: [joseon]
  tags: [society]
  sources: ["『경국대전』 예전 제과·이전 한품서용·형전 천처첩자녀", "국사편찬위원회 『신편 한국사』 25 조선 초기의 사회와 신분 구조"]

- id: changdeokgung-1405
  year: 1405
  title:
    ko: "한양 재천도와 창덕궁 창건"
  summary:
    ko: "정종 때 개경으로 돌아갔던 도읍을 태종이 다시 한양으로 옮기고(1405), 이궁으로 창덕궁을 지었다. 산자락의 지형을 살려 전각을 배치했고 뒤쪽에 넓은 후원을 두었다. 임진왜란 때 불탄 뒤 광해군 때 다시 지어 조선 후기에 오랫동안 정궁 구실을 했으며, 1997년 유네스코 세계 유산이 되었다."
  subjects: [joseon]
  tags: [politics, culture]
  sources: ["『태종실록』 태종 5년", "국가유산청 창덕궁 해설"]

- id: taejo-sillok-1413
  year: 1413
  title:
    ko: "『태조실록』 편찬과 사고"
  summary:
    ko: "태종 때 하륜 등이 『태조실록』을 완성했다(1413). 이후 왕이 죽으면 실록청을 열어 사관이 쓴 사초와 시정기 등을 바탕으로 실록을 편찬했고, 왕도 사초를 마음대로 볼 수 없게 해 기록의 공정성을 지켰다. 세종 때 춘추관·충주·성주·전주의 4대 사고에 나누어 보관했는데, 임진왜란 때 전주 사고본만 살아남았다. 『조선왕조실록』은 1997년 유네스코 세계 기록 유산이 되었다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『태종실록』 태종 13년", "국사편찬위원회 『조선왕조실록』 해제"]

- id: aak-1430
  year: 1430
  title:
    ko: "박연의 아악 정비"
  summary:
    ko: "세종의 명으로 박연이 편경 등 악기를 만들고 『아악보』를 펴내(1430) 궁중 의식 음악인 아악을 정리했다. 세종은 음의 길이와 높낮이를 적는 정간보를 만들고 여민락, 정대업·보태평 등을 지었다. 정대업·보태평은 세조 때 종묘 제례악으로 쓰이기 시작해 오늘날까지 이어지며, 유네스코 인류 무형 문화유산이다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 세종 12년", "『세종실록』 악보", "『세조실록』 세조 10년"]

- id: samgang-haengsildo-1434
  year: 1434
  title:
    ko: "『삼강행실도』 편찬"
  summary:
    ko: "진주에서 아들이 아버지를 죽인 사건(1428)을 계기로 세종이 설순 등에게 명해, 우리나라와 중국의 충신·효자·열녀 이야기를 모아 그림을 곁들인 『삼강행실도』를 펴냈다(1434). 글을 모르는 백성도 알 수 있게 그림을 넣었고, 성종 때 한글로 풀이한 언해본이 나왔다. 성리학 윤리를 백성에게 퍼뜨리려는 교화서로, 중종 때 『이륜행실도』, 정조 때 『오륜행실도』로 이어졌다."
  subjects: [joseon]
  tags: [culture, society]
  sources: ["『세종실록』 세종 10년·16년", "국사편찬위원회 『신편 한국사』"]

- id: mongyu-dowondo-1447
  year: 1447
  title:
    ko: "안견의 「몽유도원도」"
  summary:
    ko: "안평 대군이 꿈에서 본 복숭아꽃 가득한 이상향 이야기를 듣고, 도화서 화원 안견이 사흘 만에 「몽유도원도」를 그렸다(1447). 현실 세계에서 꿈속 도원으로 이어지는 장면을 한 화폭에 펼쳤으며, 안평 대군과 박팽년·신숙주 등 당대 문인의 글이 함께 전한다. 지금은 일본 덴리 대학 도서관에 있다. 15세기에는 강희안이 선비의 여유를 그린 「고사관수도」도 나왔다."
  subjects: [joseon]
  tags: [culture]
  sources: ["「몽유도원도」 안평 대군 발문", "국사편찬위원회 『신편 한국사』"]

- id: buncheong-baekja-1450
  year: 1450
  endYear: 1550
  precision: century
  title:
    ko: "분청사기와 백자"
  summary:
    ko: "고려 말 상감 청자를 이어, 회색 흙으로 빚은 그릇에 흰 흙을 바르고 무늬를 넣은 분청사기가 15세기에 널리 만들어졌다. 소박하고 자유로운 무늬가 특징이다. 15세기 후반 경기도 광주에 관영 가마인 사옹원 분원이 자리 잡으면서 백자 생산이 늘었고, 16세기에는 깨끗하고 검소한 멋을 좋아한 사대부의 취향에 맞아 백자가 주류가 되었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["국립중앙박물관 분청사기·백자 해설", "국사편찬위원회 『신편 한국사』"]

- id: goryeosa-1451
  year: 1451
  endYear: 1452
  title:
    ko: "『고려사』와 『고려사절요』 편찬"
  summary:
    ko: "태조 때 정도전 등이 『고려국사』(1395)를 지었으나 서술을 두고 논란이 있어 세종 때부터 다시 고쳐 썼다. 문종 때 김종서·정인지 등이 기전체로 『고려사』를 완성했고(1451), 이듬해 편년체로 『고려사절요』를 펴냈다(1452). 『고려사』는 고려 왕의 기록을 '본기'가 아닌 '세가'에 실었다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『태조실록』 태조 4년", "『문종실록』 문종 1년·2년", "『고려사』 진고려사전"]

- id: sejong-jiriji-1454
  year: 1454
  title:
    ko: "『세종실록』 지리지와 우산·무릉 기록"
  summary:
    ko: "단종 때 『세종실록』을 완성하면서(1454) 세종 때 만든 『신찬팔도지리지』를 바탕으로 한 지리지를 덧붙였다. 각 고을의 연혁·인구·토지·특산물 등을 담았다. 강원도 울진현 조에는 우산과 무릉 두 섬이 멀지 않아 맑은 날 서로 바라볼 수 있다고 적어, 우산도(독도)와 무릉도(울릉도)를 조선 땅으로 인식했음을 보여 준다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 지리지 강원도 울진현", "『단종실록』 단종 2년"]

- id: jingwan-1457
  year: 1457
  title:
    ko: "진관 체제와 5위"
  summary:
    ko: "세조가 각 도에 병영을 두고, 그 아래 거진을 중심으로 여러 진을 묶어 지역마다 스스로 적을 막게 하는 진관 체제를 갖추었다(1457). 중앙군은 5위로 편성해 뒤에 5위도총부가 지휘하게 했다. 16세 이상 60세 이하 양인 남자가 군역을 졌으며, 정군과 이를 돕는 보인으로 나누는 보법을 실시했다(1464). 진관 체제는 작은 침입에는 효과적이었으나 큰 적을 막기 어려워 16세기에 제승방략 체제로 바뀌었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『세조실록』 세조 3년·10년", "『경국대전』 병전"]

- id: gangyeong-dogam-1461
  year: 1461
  endYear: 1467
  title:
    ko: "간경도감과 원각사지 10층 석탑"
  summary:
    ko: "세조는 불교를 보호해 『월인석보』를 펴내고(1459) 간경도감을 두어(1461) 불경을 한글로 풀어 간행했다. 한양에 원각사를 짓고 그 안에 대리석으로 10층 석탑을 세웠는데(1467), 고려 경천사지 10층 석탑의 양식을 이었다. 원각사지 10층 석탑은 지금 서울 탑골 공원에 있다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『세조실록』 세조 7년·10년·13년", "『월인석보』 권1 어제 서문"]

- id: jangsi-1470
  year: 1470
  precision: decade
  title:
    ko: "장시의 등장"
  summary:
    ko: "15세기 후반 전라도 무안 등지에서 백성들이 정해진 날에 모여 물건을 바꾸는 장문(장시)이 생겼다는 기록이 처음 나타났다(1470). 정부는 농민이 농사를 버리고 상업에 몰린다며 막으려 했으나, 16세기 중엽에는 전국으로 퍼졌다. 한편 한양에는 태종 때 종로 일대에 시전을 두고 경시서가 상거래를 감독했다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『성종실록』 성종 1년", "『태종실록』 태종 12년~14년"]

- id: gukjo-orye-1474
  year: 1474
  title:
    ko: "『국조오례의』 완성"
  summary:
    ko: "세종 때부터 정리해 온 국가 의례를 신숙주·정척 등이 길례·가례·빈례·군례·흉례의 다섯 가지로 나누어 『국조오례의』로 완성했다(1474). 제사·혼례·외교·군사·장례 등 나라의 의식을 유교 예법에 맞게 정한 것이다. 『경국대전』과 함께 성종 때 유교 통치 체제가 마무리되었음을 보여 준다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『성종실록』 성종 5년", "『국조오례의』 서문"]

- id: gunjeok-supo-1541
  year: 1541
  title:
    ko: "군적수포제 실시"
  summary:
    ko: "15세기 말부터 군역을 질 사람이 남을 대신 보내는 대립과, 군사를 돌려보내고 그 대가로 포를 받는 방군수포가 널리 퍼져 농민의 부담이 커지고 도망자가 늘었다. 중종은 지방관이 군적에 오른 사람에게서 1년에 군포 2필을 거두어 중앙에 보내고, 그것으로 군사를 고용하는 군적수포제를 실시했다(1541). 군역이 포를 내는 의무로 바뀌어 갔으나 농민의 부담은 줄지 않았고 군대의 전투력은 약해졌다."
  subjects: [joseon]
  tags: [economy, society]
  sources: ["『중종실록』 중종 36년"]

- id: munjeong-bou-1550
  year: 1550
  title:
    ko: "문정 왕후와 보우의 불교 중흥"
  summary:
    ko: "명종이 어린 나이에 즉위하자 어머니 문정 왕후가 수렴청정을 하며 불교를 적극 지원했다. 승려 보우를 중용해 선종과 교종을 다시 세우고(1550) 승과를 다시 실시했으며(1552), 이때 승과를 거친 휴정은 임진왜란 때 승병을 이끌었다. 문정 왕후가 죽은 뒤(1565) 보우는 제주도로 유배되어 죽임을 당하고 불교 중흥 정책도 끝났다."
  subjects: [joseon]
  tags: [culture, politics]
  sources: ["『명종실록』 명종 5년·7년·20년"]
