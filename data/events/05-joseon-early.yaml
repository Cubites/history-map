- id: hongmungwan-1478
  year: 1478
  title:
    ko: 홍문관 설치
  summary:
    ko: "성종이 집현전을 이어받은 학문 기관으로 홍문관을 두었다. 경연을 맡고 왕에게 자문했으며, 사헌부·사간원과 함께 3사로 불리며 언론 기능을 했다. 성종은 사림을 등용해 훈구 세력을 견제했다. 같은 해 서거정 등이 삼국 시대부터 조선 초까지의 뛰어난 시와 글을 가려 뽑은 『동문선』을 펴냈다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『성종실록』 성종 9년", "『경국대전』 이전"]

