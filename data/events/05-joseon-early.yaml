  summary:
    ko: 관리가 직접 조세를 거두던 것을 국가가 대신 거두어 나누어 주는 관수관급제로 바꾸어, 국가의 토지 지배력을 높였다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『성종실록』 성종 1년"]

