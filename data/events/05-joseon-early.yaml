  summary:
    ko: "주세붕이 풍기에 안향을 모신 백운동 서원을 세웠다(1543). 이황의 건의로 명종이 '소수 서원'이라는 편액을 내려 첫 사액 서원이 되었다(1550). 소수 서원을 비롯해 도산 서원·옥산 서원 등 9곳은 '한국의 서원'으로 2019년 유네스코 세계 유산에 올랐다."
