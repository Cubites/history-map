  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 세종 2년"]

- id: sampo-1426
  year: 1426
  title:
    ko: 3포 개항
  summary:
    ko: 일본의 무역 요구를 받아들여 부산포, 제포, 염포를 열고 왜관을 두어 제한된 무역을 허락했다.
