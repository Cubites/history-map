  summary:
    ko: 세조 때부터 편찬한 조선의 기본 법전 『경국대전』을 완성해 시행했다. 이·호·예·병·형·공전의 6전 체제로 통치 체제가 마무리되었다. 같은 해 역사서 『동국통감』도 완성되었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『성종실록』 성종 16년"]

- id: akhak-gwebeom-1493
  year: 1493
  title:
    ko: 『악학궤범』 편찬
  summary:
    ko: 성현 등이 음악의 원리와 악기, 무용, 의상을 그림과 함께 정리한 『악학궤범』을 펴냈다.
  subjects: [joseon]
  tags: [culture]
  sources: ["『성종실록』 성종 24년"]

