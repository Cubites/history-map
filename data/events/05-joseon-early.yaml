  summary:
    ko: 수조권 지급 제도인 직전법이 사실상 폐지되어, 관리는 녹봉만 받게 되었다. 이후 지주 전호제가 확산되었다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『명종실록』 명종 11년"]

