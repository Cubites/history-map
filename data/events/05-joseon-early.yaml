- id: hyangyak-jipseong-1433
  year: 1433
  title:
    ko: 『향약집성방』 편찬
  summary:
    ko: 세종의 명으로 우리 풍토에 맞는 약재(향약)와 치료법을 모아 『향약집성방』을 펴냈다. 1445년에는 의학 백과사전인 『의방유취』도 완성했다.
