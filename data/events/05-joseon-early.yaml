  tags: [culture]
  sources: ["『중종실록』 중종 38년", "『명종실록』 명종 5년"]

- id: eulsa-sahwa-1545
  year: 1545
  title:
    ko: 을사사화
  summary:
    ko: 명종이 즉위한 뒤 외척 윤원형 일파(소윤)가 윤임 일파(대윤)를 몰아내면서 여러 사림이 화를 입었다.
  subjects: [joseon]
