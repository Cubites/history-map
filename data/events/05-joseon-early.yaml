    ko: 중종이 등용한 조광조가 현량과 실시, 소격서 폐지, 향약 보급 등 개혁을 추진했다. 반정 공신의 공훈을 깎는 위훈 삭제를 주장하자 훈구 세력의 반발로 조광조 등이 제거되었다.
