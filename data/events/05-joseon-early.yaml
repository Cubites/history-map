- id: tongsinsa-1590
  year: 1590
  title:
    ko: 황윤길·김성일의 일본 사행
  summary:
    ko: 일본을 통일한 도요토미 히데요시의 동태를 살피러 통신사를 보냈다. 서인 황윤길은 침략 가능성을 경고했으나 동인 김성일은 그렇지 않다고 보고해, 조정은 대비를 소홀히 했다.
