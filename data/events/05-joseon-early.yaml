# 5번 묶음: 조선 전기 (1392 ~ 1592)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 『조선왕조실록』의 왕 연차는 대체로 즉위 이듬해를 1년으로 센다. 태조는 1392년, 반정으로 즉위한
# 세조는 1455년, 중종은 1506년이 1년이다.
# 임진왜란(1592)부터는 6번 묶음에서 다룬다.

# ── 건국과 체제 정비 (태조 ~ 태종) ───────────────────────

- id: hanyang-1394
  year: 1394
  title:
    ko: 한양 천도
  summary:
    ko: "태조가 도읍을 개경에서 한양으로 옮겼다. 정도전이 경복궁과 종묘·사직의 위치를 정하고 궁궐 전각의 이름을 지었다. 1395년 경복궁과 역대 왕의 신주를 모신 종묘를 완공했고, 이듬해부터 도성을 쌓아 숭례문 등 4대문을 두었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 3년"]

- id: jeong-dojeon-1394
  year: 1394
  title:
    ko: 정도전의 『조선경국전』
  summary:
    ko: "정도전이 조선의 통치 체제를 정리한 『조선경국전』을 지어 올렸다. 재상 중심의 정치를 내세우고 『불씨잡변』으로 불교를 비판했다. 이어 1397년에는 조준 등이 조선 최초의 통일 법전인 『경제육전』을 펴냈다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 3년", "정도전, 『삼봉집』"]

- id: prince-strife-1398
  year: 1398
  endYear: 1400
  title:
    ko: 왕자의 난
  summary:
    ko: "세자 책봉에 불만을 품은 이방원이 1차 왕자의 난(1398)으로 정도전과 세자 방석을 제거하고, 2차 왕자의 난(1400)에서 형 방간을 물리쳐 왕위에 오를 기반을 굳혔다. 이후 사병을 없애 군사권을 국가로 모았다. 이 무렵 정도전은 명과의 표전 문제로 관계가 나빠지자 요동 정벌을 준비하고 있었으나, 1차 왕자의 난으로 제거되면서 중단되었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 7년", "『정종실록』 정종 2년"]

- id: ming-investiture-1401
  year: 1401
  title:
    ko: 명의 책봉과 사대 관계
  summary:
    ko: 명이 태종을 조선 국왕으로 책봉하는 고명과 인장을 보내 조선과 명 사이에 책봉·조공 관계가 자리 잡았다. 조선은 정기적으로 사신을 보내 교류하며 선진 문물을 받아들였다.
  subjects: [joseon, ming]
  links:
    - { from: ming, to: joseon, note: "국왕 책봉" }
    - { from: joseon, to: ming, note: "조공 사신 파견" }
  tags: [diplomacy]
  sources: ["『태종실록』 태종 1년"]

- id: honil-gangni-1402
  year: 1402
  title:
    ko: 「혼일강리역대국도지도」 제작
  summary:
    ko: 김사형, 이무, 이회 등이 현재 남아 있는 동양에서 가장 오래된 세계 지도인 「혼일강리역대국도지도」를 만들었다. 중국과 조선을 크게 그리고 유럽과 아프리카까지 담았다.
  subjects: [joseon]
  tags: [culture]
  sources: ["「혼일강리역대국도지도」 권근 발문"]

- id: gyemija-1403
  year: 1403
  title:
    ko: 주자소 설치와 계미자
  summary:
    ko: "태종이 주자소를 설치하고 구리로 계미자를 만들어 책을 찍었다. 세종 때에는 경자자(1420)와 갑인자(1434)를 만들고 활자를 판에 고정하는 방법을 고쳐 인쇄 속도를 크게 높였다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『태종실록』 태종 3년"]

- id: taejong-reform-1413
  year: 1413
  endYear: 1414
  title:
    ko: 태종의 왕권 강화
  summary:
    ko: "전국을 8도로 나누고, 16세 이상 남자에게 호패를 차게 하는 호패법으로 인구를 파악했다. 6조의 판서가 의정부를 거치지 않고 왕에게 바로 보고하는 6조 직계제를 시행했다(1414). 앞서 신문고도 설치했다(1401). 또 사간원을 독립시켜 대신을 견제하게 하고(1401), 사원의 토지와 노비를 몰수해 국가 재정을 넓혔다(1406)."
  subjects: [joseon]
  tags: [politics]
  sources: ["『태종실록』 태종 13년·14년"]

# ── 세종 ─────────────────────────────────────────────────

- id: tsushima-1419
  year: 1419
  title:
    ko: 쓰시마 정벌 (기해동정)
  summary:
    ko: 왜구의 근거지를 없애려 이종무가 병선 200여 척을 이끌고 쓰시마를 정벌했다.
  subjects: [joseon, japan]
  links:
    - { from: japan, to: joseon, note: "왜구의 침입" }
    - { from: joseon, to: japan, note: "이종무의 쓰시마 정벌" }
  tags: [war]
  sources: ["『세종실록』 세종 1년"]
  places: [{ name: "쓰시마", at: [129.3, 34.4] }]

- id: jiphyeonjeon-1420
  year: 1420
  title:
    ko: 집현전 확대 개편
  summary:
    ko: 세종이 집현전을 학문 연구 기관으로 키워 학자를 기르고 정책 연구와 편찬 사업을 맡겼다.
  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 세종 2년"]

- id: sampo-1426
  year: 1426
  title:
    ko: 3포 개항
  summary:
    ko: 일본의 무역 요구를 받아들여 부산포, 제포, 염포를 열고 왜관을 두어 제한된 무역을 허락했다.
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "3포 개항 (교린)" }
  tags: [diplomacy, economy]
  sources: ["『세종실록』 세종 8년"]

- id: nongsa-jikseol-1429
  year: 1429
  title:
    ko: 『농사직설』 편찬
  summary:
    ko: 정초 등이 각 지방 농민의 경험을 모아 우리 풍토에 맞는 농법을 정리한 『농사직설』을 펴냈다.
  subjects: [joseon]
  tags: [culture, economy]
  sources: ["『세종실록』 세종 11년"]

- id: sagun-yukjin-1433
  year: 1433
  endYear: 1449
  title:
    ko: 4군 6진 개척
  summary:
    ko: 최윤덕이 압록강 상류의 여진을 몰아내고 4군을, 김종서가 두만강 유역에 6진을 설치했다. 남쪽 백성을 옮겨 살게 하는 사민 정책과 토관 제도로 지역을 안정시켜, 오늘날과 비슷한 압록강~두만강 국경이 확정되었다.
  subjects: [joseon, jurchen]
  links:
    - { from: joseon, to: jurchen, note: "여진 정벌, 4군 6진 설치" }
    - { from: jurchen, to: joseon, note: "여진의 침입" }
  tags: [war]
  sources: ["『세종실록』 세종 15년·16년", "『세종실록』 지리지"]
  places: [{ name: "4군", at: [126.3, 41.3] }, { name: "6진", at: [129.6, 42.4] }]

- id: uijeongbu-seosa-1436
  year: 1436
  title:
    ko: 의정부 서사제 시행
  summary:
    ko: 6조의 업무를 의정부가 먼저 심의한 뒤 왕에게 올리게 해, 왕권과 신권의 조화를 꾀했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『세종실록』 세종 18년"]

- id: science-1441
  year: 1441
  title:
    ko: 측우기 제작과 과학 기술 발달
  summary:
    ko: "강우량을 재는 측우기를 만들어 전국에 보냈다. 이 무렵 해시계(앙부일구), 물시계(자격루), 천체 관측 기구(혼천의) 등이 만들어졌고, 『칠정산』으로 우리 기준의 역법을 세웠다. 장영실·이천 등이 기구 제작을 이끌었으며, 『칠정산』은 원의 수시력과 아라비아의 회회력을 참고해 한양을 기준으로 천체 운동을 계산한 역법서다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 세종 23년·24년"]

- id: gyehae-treaty-1443
  year: 1443
  title:
    ko: 계해약조
  summary:
    ko: 쓰시마 도주와 약조를 맺어 1년에 세견선 50척, 세사미두 200석으로 무역량을 제한했다.
  subjects: [joseon, japan]
  links:
    - { from: joseon, to: japan, note: "제한된 무역 허용" }
  tags: [diplomacy]
  sources: ["『세종실록』 세종 25년"]

- id: hunminjeongeum-1443
  year: 1443
  endYear: 1446
  title:
    ko: 훈민정음 창제와 반포
  summary:
    ko: 세종이 백성이 쉽게 익혀 쓸 수 있는 문자인 훈민정음을 만들고(1443) 반포했다(1446). 『용비어천가』, 『월인천강지곡』 등을 한글로 펴냈다.
  subjects: [joseon]
  tags: [culture]
  sources: ["『세종실록』 세종 25년·28년", "『훈민정음』 해례본"]

- id: gongbeop-1444
  year: 1444
  title:
    ko: 공법 제정 (전분 6등법·연분 9등법)
  summary:
    ko: "토지를 비옥도에 따라 6등급으로, 그해 풍흉에 따라 9등급으로 나누어 세금을 거두는 공법을 정했다. 세종은 공법을 정하기 전에 관리와 농민 17만여 명의 의견을 묻고(1430), 전제상정소를 두어 1결당 최고 20두에서 최하 4두를 거두게 했다."
  subjects: [joseon]
  tags: [economy]
  sources: ["『세종실록』 세종 26년"]

# ── 세조 ~ 성종: 통치 체제의 완성 ───────────────────────

- id: gyeyu-jeongnan-1453
  year: 1453
  title:
    ko: 계유정난
  summary:
    ko: 수양 대군이 김종서, 황보인 등 재상들을 죽이고 권력을 잡았다. 1455년 단종에게서 왕위를 물려받아 세조가 되었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『단종실록』 단종 1년"]

- id: sayuksin-1456
  year: 1456
  title:
    ko: 사육신의 단종 복위 운동
  summary:
    ko: "성삼문, 박팽년 등이 단종을 다시 왕으로 세우려다 발각되어 처형되었다. 세조는 집현전과 경연을 없애고 6조 직계제를 다시 실시했다. 세조의 왕위 찬탈을 인정하지 않고 벼슬에 나가지 않은 김시습·남효온 등은 생육신으로 불리며, 김시습은 한문 소설 『금오신화』를 지었다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『세조실록』 세조 2년"]

- id: jikjeonbeop-1466
  year: 1466
  title:
    ko: 직전법 실시
  summary:
    ko: 토지가 부족해지자 과전법을 고쳐 현직 관리에게만 수조권을 주는 직전법을 실시했다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『세조실록』 세조 12년"]

- id: yi-siae-1467
  year: 1467
  title:
    ko: 이시애의 난
  summary:
    ko: "함길도의 토호 이시애가 중앙 집권 강화에 반발해 난을 일으켰다. 진압 후 유향소가 폐지되었다. 유향소는 성종 때(1488) 사림의 건의로 다시 설치되어 수령을 보좌하고 향리를 감찰하며 풍속을 바로잡았다."
  subjects: [joseon]
  tags: [politics]
  sources: ["『세조실록』 세조 13년"]

- id: gwansugwangeup-1470
  year: 1470
  title:
    ko: 관수관급제 실시
  summary:
    ko: 관리가 직접 조세를 거두던 것을 국가가 대신 거두어 나누어 주는 관수관급제로 바꾸어, 국가의 토지 지배력을 높였다.
  subjects: [joseon]
  tags: [economy]
  sources: ["『성종실록』 성종 1년"]

- id: haedong-jegukgi-1471
  year: 1471
  title:
    ko: 신숙주의 『해동제국기』
  summary:
    ko: 일본에 다녀온 신숙주가 일본과 류큐의 지리, 풍속, 외교 관례를 정리한 『해동제국기』를 지었다.
  subjects: [joseon]
  links:
    - { from: japan, to: joseon, note: "일본 사행 견문" }
  tags: [culture, diplomacy]
  sources: ["신숙주, 『해동제국기』"]

- id: dongguk-yeoji-1481
  year: 1481
  title:
    ko: 『동국여지승람』 편찬
  summary:
    ko: "노사신, 양성지 등이 전국의 지리, 풍속, 인물 등을 정리한 지리지 『동국여지승람』을 펴냈다. 중종 때 이를 보완해 『신증동국여지승람』(1530)을 펴냈다."
  subjects: [joseon]
  tags: [culture]
  sources: ["『성종실록』 성종 12년"]

- id: gyeongguk-daejeon-1485
  year: 1485
  title:
    ko: 『경국대전』 완성·시행
  summary:
    ko: 세조 때부터 편찬한 조선의 기본 법전 『경국대전』을 완성해 시행했다. 이·호·예·병·형·공전의 6전 체제로 통치 체제가 마무리되었다. 같은 해 역사서 『동국통감』도 완성되었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『성종실록』 성종 16년"]

- id: akhak-gwebeom-1493
  year: 1493
  title:
    ko: 『악학궤범』 편찬
  summary:
    ko: 성현 등이 음악의 원리와 악기, 무용, 의상을 그림과 함께 정리한 『악학궤범』을 펴냈다.
  subjects: [joseon]
  tags: [culture]
  sources: ["『성종실록』 성종 24년"]

# ── 사림의 성장과 사화 ─────────────────────────────────

- id: muo-sahwa-1498
  year: 1498
  title:
    ko: 무오사화
  summary:
    ko: 김종직이 쓴 「조의제문」을 김일손이 사초에 실은 것을 훈구 세력이 문제 삼아, 연산군이 김일손 등 사림을 처형하고 이미 죽은 김종직을 부관참시했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『연산군일기』 연산군 4년"]

- id: gapja-sahwa-1504
  year: 1504
  title:
    ko: 갑자사화
  summary:
    ko: 연산군이 어머니 폐비 윤씨의 죽음에 관련된 훈구와 사림을 함께 처벌했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『연산군일기』 연산군 10년"]

- id: jungjong-banjeong-1506
  year: 1506
  title:
    ko: 중종반정
  summary:
    ko: 폭정을 일삼은 연산군을 박원종, 성희안 등이 몰아내고 중종을 왕으로 세웠다.
  subjects: [joseon]
