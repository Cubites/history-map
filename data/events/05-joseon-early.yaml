    ko: 『동국여지승람』 편찬
  summary:
    ko: 노사신, 양성지 등이 전국의 지리, 풍속, 인물 등을 정리한 지리지 『동국여지승람』을 펴냈다.
  subjects: [joseon]
  tags: [culture]
