  year: 1467
  title:
    ko: 이시애의 난
  summary:
    ko: 함길도의 토호 이시애가 중앙 집권 강화에 반발해 난을 일으켰다. 진압 후 유향소가 폐지되었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『세조실록』 세조 13년"]

