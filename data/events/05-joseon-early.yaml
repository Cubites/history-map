# 5번 묶음: 조선 전기 (1392 ~ 1592)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 『조선왕조실록』의 왕 연차는 대체로 즉위 이듬해를 1년으로 센다. 태조는 1392년, 반정으로 즉위한
# 세조는 1455년, 중종은 1506년이 1년이다.
# 임진왜란(1592)부터는 6번 묶음에서 다룬다.

# ── 건국과 체제 정비 (태조 ~ 태종) ───────────────────────

- id: hanyang-1394
  year: 1394
  title:
    ko: 한양 천도
  summary:
    ko: 태조가 도읍을 개경에서 한양으로 옮겼다. 정도전이 경복궁과 종묘·사직의 위치를 정하고 궁궐 전각의 이름을 지었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 3년"]

- id: jeong-dojeon-1394
  year: 1394
  title:
    ko: 정도전의 『조선경국전』
  summary:
    ko: 정도전이 조선의 통치 체제를 정리한 『조선경국전』을 지어 올렸다. 재상 중심의 정치를 내세우고 『불씨잡변』으로 불교를 비판했다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 3년", "정도전, 『삼봉집』"]

- id: prince-strife-1398
  year: 1398
  endYear: 1400
  title:
    ko: 왕자의 난
  summary:
    ko: 세자 책봉에 불만을 품은 이방원이 1차 왕자의 난(1398)으로 정도전과 세자 방석을 제거하고, 2차 왕자의 난(1400)에서 형 방간을 물리쳐 왕위에 오를 기반을 굳혔다. 이후 사병을 없애 군사권을 국가로 모았다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『태조실록』 태조 7년", "『정종실록』 정종 2년"]

- id: ming-investiture-1401
  year: 1401
  title:
    ko: 명의 책봉과 사대 관계
  summary:
    ko: 명이 태종을 조선 국왕으로 책봉하는 고명과 인장을 보내 조선과 명 사이에 책봉·조공 관계가 자리 잡았다. 조선은 정기적으로 사신을 보내 교류하며 선진 문물을 받아들였다.
  subjects: [joseon, ming]
  links:
    - { from: ming, to: joseon, note: "국왕 책봉" }
    - { from: joseon, to: ming, note: "조공 사신 파견" }
  tags: [diplomacy]
  sources: ["『태종실록』 태종 1년"]

- id: honil-gangni-1402
  year: 1402
  title:
    ko: 「혼일강리역대국도지도」 제작
  summary:
    ko: 김사형, 이무, 이회 등이 현재 남아 있는 동양에서 가장 오래된 세계 지도인 「혼일강리역대국도지도」를 만들었다. 중국과 조선을 크게 그리고 유럽과 아프리카까지 담았다.
  subjects: [joseon]
  tags: [culture]
  sources: ["「혼일강리역대국도지도」 권근 발문"]

- id: gyemija-1403
  year: 1403
  title:
    ko: 주자소 설치와 계미자
  summary:
    ko: 태종이 주자소를 설치하고 구리로 계미자를 만들어 책을 찍었다.
  subjects: [joseon]
  tags: [culture]
  sources: ["『태종실록』 태종 3년"]

- id: taejong-reform-1413
  year: 1413
  endYear: 1414
  title:
    ko: 태종의 왕권 강화
  summary:
    ko: 전국을 8도로 나누고, 16세 이상 남자에게 호패를 차게 하는 호패법으로 인구를 파악했다. 6조의 판서가 의정부를 거치지 않고 왕에게 바로 보고하는 6조 직계제를 시행했다(1414). 앞서 신문고도 설치했다(1401).
  subjects: [joseon]
  tags: [politics]
  sources: ["『태종실록』 태종 13년·14년"]

# ── 세종 ─────────────────────────────────────────────────

