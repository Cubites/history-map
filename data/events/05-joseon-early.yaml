  endYear: 1575
  title:
    ko: 이황과 이이의 성리학
  summary:
    ko: 이황이 『성학십도』를 지어 선조에게 올리고(1568), 이이가 『성학집요』를 지어 올렸다(1575). 이황은 이(理)를, 이이는 기(氣)를 중시해 영남학파와 기호학파로 이어졌다.
