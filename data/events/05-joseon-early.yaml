- id: seongnihak-1568
  year: 1568
  endYear: 1575
  title:
    ko: 이황과 이이의 성리학
  summary:
    ko: "이황이 『성학십도』를 지어 선조에게 올리고(1568), 이이가 『성학집요』를 지어 올렸다(1575). 이황은 이(理)를, 이이는 기(氣)를 중시해 영남학파와 기호학파로 이어졌다. 이이는 공납의 폐단을 바로잡으려 특산물 대신 쌀로 거두는 수미법을 건의했다. 이 무렵 서경덕은 기를 중시한 학문을 세웠고, 조식은 경과 의를 내세워 실천을 강조했으며 그 제자들은 북인으로 이어졌다."
