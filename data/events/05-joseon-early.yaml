- id: geonjeoui-1591
  year: 1591
  title:
    ko: 건저의 사건과 남인·북인의 분열
  summary:
    ko: 서인 정철이 세자 책봉을 건의했다가 쫓겨났다. 정철의 처벌을 두고 동인이 온건파인 남인과 강경파인 북인으로 나뉘었다.
  subjects: [joseon]
  tags: [politics]
  sources: ["『선조수정실록』 선조 24년"]
