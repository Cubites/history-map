- id: canadian-confederation-1864
  year: 1864
  endYear: 1867
  title:
    ko: "샬럿타운·퀘벡 회의와 캐나다 연방(1864~1867)"
  summary:
    ko: "영국령 북아메리카는 1860년대 남북 전쟁 뒤 미국의 팽창에 대한 걱정과 철도의 필요, 캐나다주의 정치 막힘 속에서 연합을 찾았다. 1864년 9월 1~9일 프린스에드워드섬의 샬럿타운에서 노바스코샤·뉴브런즈윅·프린스에드워드섬이 연합을 논의할 자리에 캐나다주 대표가 끼어들었고, 10월 10~27일 퀘벡 회의에서 72개 결의로 연방의 틀이 짜였다. 앵글로폰의 존 A. 맥도널드와 프랑스계의 조르주에티엔 카르티에가 캐나다주의 연합을 이끌었고 노바스코샤에서는 조지프 하우 같은 반대가 거셌으며, 프린스에드워드섬과 뉴펀들랜드는 빠졌다. 1866년 미국에서 건너온 페니언 단체가 국경을 넘어 습격한 일도 연합의 필요를 키웠다. 1866년 12월 런던 회의를 거쳐 영국 의회가 1867년 3월 영국령 북아메리카법을 통과시켰고, 1867년 7월 1일 캐나다 연방(캐나다 자치령)이 노바스코샤·뉴브런즈윅과 둘로 나뉜 캐나다주(온타리오·퀘벡)의 네 주로 세워졌다. 이로써 캐나다주와 노바스코샤·뉴브런즈윅 식민지는 끝났고, 첫 총리는 맥도널드였다. 새 헌법은 연방 의회와 주 의회의 권한을 나누었고, 의회와 법정에서 영어와 프랑스어를 쓰게 했으며, 원주민과 그 보호지에 관한 일은 연방의 몫으로 두었다. 연방 의회는 하원과 상원으로 이루어졌고 영국 군주가 국가 원수로 남았다. 이어 1870년 루퍼츠랜드와 북서부 영토, 1871년 브리티시컬럼비아, 1873년 프린스에드워드섬이 연방에 더해진다(「루퍼츠랜드 이양과 레드강 저항, 브리티시컬럼비아의 연방 가입(1869~1873)」(뒤의 사건)). 연방의 수도는 1857년 빅토리아 여왕이 고른 오타와였다."
  subjects: [canada, nova-scotia, new-brunswick, province-of-canada, uk, usa]
  links:
