  sources: ["Michel Gobat, Empire by Invitation: William Walker and Manifest Destiny in Central America (Harvard University Press, 2018)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Leslie Bethell 편, Cambridge University Press, 1985)"]
