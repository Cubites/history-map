  sources: ["The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Leslie Bethell 편, Cambridge University Press, 1985)", "Thomas L. Whigham, The Paraguayan War, vol. 1: Causes and Early Conduct (University of Nebraska Press, 2002)"]

- id: reconstruction-1865
  year: 1865
  endYear: 1877
  title:
    ko: "남북 전쟁의 끝과 재건 시대(1865~1877)"
  summary:
    ko: "1865년 4월 14일 에이브러햄 링컨이 워싱턴의 포드 극장에서 존 윌크스 부스에게 총을 맞고 이튿날 숨져 부통령 앤드루 존슨이 대통령직을 이었다. 「남부 연합과 남북 전쟁(1861~1865)」(앞의 사건)에서 비준된 수정 헌법 13조가 노예제를 없애자 남부 주들은 해방 노예의 자유를 제한하는 흑인 단속법을 만들었다. 의회의 공화당 급진파는 1866년 시민권법과 1868년 수정 헌법 14조(시민권과 평등 보호)로 이에 맞섰고, 1867년 재건법은 남부를 군관구 다섯으로 나누어 군이 다스리게 했다. 존슨은 1868년 탄핵 심판에서 한 표 차로 면직을 면했고, 1870년 수정 헌법 15조는 인종을 이유로 선거권을 막지 못하게 했으며 해방 노예 출신 의원과 관료가 처음으로 남부 주 정부에 들어갔다. 이에 맞서 쿠클럭스클랜 같은 백인 우월주의 폭력 단체가 1865~1866년 무렵 생겨났고, 대통령 율리시스 그랜트(1869~1877)의 정부는 1870~1871년 시행법으로 이를 누르려 했다. 1876년 대선의 개표 분쟁 끝에 1877년 타협으로 러더퍼드 헤이스가 대통령이 되고 연방군이 남부에서 물러나 재건 시대가 끝났으며, 이후 남부에서 흑인의 선거권이 흑인 차별법(짐 크로 법)으로 막혔다. 같은 무렵 조선에서는 1866년 미국 상선 제너럴셔먼호가 평양에서 불탔고 1871년 미국 군함이 강화도를 공격했다(「제너럴셔먼호 사건」·「신미양요와 척화비」(뒤의 사건)). 연방 정부는 1865년 3월 해방민국을 두어 해방 노예에게 식량과 학교, 일자리 계약을 도왔다. 존슨의 재건 구상은 옛 남부 연합 지도자에게 너그러워 의회와 부딪쳤다. 1872년 사면법은 옛 남부 연합 지도자 대부분의 공직 금지를 풀어 주었다."
  subjects: [usa]
  links: []
  tags: [politics, society]
  sources: ["Eric Foner, Reconstruction: America's Unfinished Revolution, 1863–1877 (Harper & Row, 1988)", "James M. McPherson, Battle Cry of Freedom: The Civil War Era (Oxford University Press, 1988)"]

- id: plains-wars-1866
  year: 1866
  endYear: 1890
  title:
    ko: "대평원 전쟁: 리틀빅혼에서 운디드니까지(1866~1890)"
  summary:
    ko: "대평원은 라코타·샤이엔·아라파호·크로 같은 원주민의 땅이었고, 1851년 포트래러미 조약이 부족별 영역을 정했으나 남북 전쟁 뒤 철도와 금광을 따라 백인이 밀려들었다. 1866년 포트래러미 앞 보즈먼 길에 요새를 세우려 하자 라코타의 레드 클라우드가 이끈 연합이 12월 21일 페터먼 부대를 모조리 쓰러뜨렸고, 1868년 포트래러미 조약으로 미국은 길을 닫고 블랙힐스를 포함한 땅을 라코타의 큰 보호구로 인정했다(원주민 나라와 맺은 조약이었다). 그러나 1874년 조지 커스터의 탐사대가 블랙힐스에서 금을 알리자 광부가 몰렸고, 1876년 6월 25일 리틀빅혼에서 시팅 불·크레이지 호스가 이끈 라코타·샤이엔·아라파호 연합이 커스터의 제7기병대 가운데 약 260여 명을 쓰러뜨렸다. 크레이지 호스는 1877년 5월 항복했다가 9월 수용소에서 군인에게 찔려 숨졌고, 같은 해 10월 네즈퍼스의 조지프 추장은 캐나다 국경을 눈앞에 두고 항복했다. 1887년 도스법은 보호구를 개인 몫으로 쪼개 원주민의 땅이 1887년 약 1억 3,800만 에이커에서 1934년 약 4,800만 에이커로 줄었다. 1890년 12월 15일 시팅 불이 체포 중 숨졌고, 12월 29일 사우스다코타 운디드니에서 제7기병대가 라코타 약 250~300명을 쏘아 죽였다. 1980년 미국 대법원은 블랙힐스를 차지한 데 대해 라코타에게 보상해야 한다고 판결했다. 1864년 콜로라도의 샌드크리크에서 민병대가 샤이엔과 아라파호 마을을 덮쳐 대부분 노인과 여성, 어린이인 사람들이 숨진 일이 앞서 싸움을 키웠다. 의회는 1877년 2월 법으로 블랙힐스를 라코타 보호구에서 떼어 냈다."
  subjects: [usa]
  links: []
  tags: [war, society]
  sources: ["Dee Brown, Bury My Heart at Wounded Knee: An Indian History of the American West (Holt, Rinehart and Winston, 1970)", "Robert M. Utley, The Indian Frontier of the American West, 1846–1890 (University of New Mexico Press, 1984)"]
