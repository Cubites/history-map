- id: french-intervention-mexico-1861
  year: 1861
  endYear: 1867
  title:
    ko: "프랑스의 멕시코 개입과 막시밀리안 제국(1861~1867)"
  summary:
    ko: "개혁 전쟁(「개즈던 매입과 아유틀라 혁명, 개혁 전쟁(1853~1861)」(앞의 사건))으로 재정이 바닥난 베니토 후아레스 정부가 1861년 7월 외채 상환을 2년 미루자, 영국·프랑스·스페인이 10월 31일 런던 협약으로 함께 출병하기로 했다. 영국과 스페인은 1862년 초 협상에서 물러났지만 나폴레옹 3세의 프랑스는 그해 7월 약 3만 명의 병력을 더 보내며 멕시코 보수파와 손잡고 군대를 남겼고, 1862년 5월 5일 이그나시오 사라고사가 푸에블라에서 프랑스군을 막았다(5월 5일은 지금도 멕시코의 기념일이다). 프랑스군은 이듬해 6월 10일 멕시코시티에 들어갔고, 보수파의 명사회의가 오스트리아 대공 막시밀리안에게 제위를 권해 그는 1864년 멕시코 제2제국의 황제가 되었다. 후아레스는 북쪽으로 옮겨 가며 공화국 정부를 이어 갔다. 미국은 남북 전쟁(「남부 연합과 남북 전쟁(1861~1865)」(앞의 사건)) 중이라 맞서지 못하다 전쟁이 끝나자 국무 장관 윌리엄 수어드가 먼로 독트린을 들어 프랑스에 철수를 요구했고, 프랑스는 1866년부터 병력을 거두기 시작했다. 막시밀리안은 1867년 5월 케레타로에서 항복했고 6월 19일 미겔 미라몬 등과 함께 총살되었으며, 후아레스는 7월 멕시코시티로 돌아왔다. 프랑스군은 1863년 3월부터 약 두 달의 포위전 끝에 5월 17일 푸에블라를 얻었다. 막시밀리안은 교회 재산을 둘러싼 자유파의 개혁법을 되돌리지 않아 보수파 안에서도 지지가 약했고, 황후 샤를로트는 1866년 유럽으로 건너가 도움을 구했으나 얻지 못했다. 프랑스군의 마지막 부대는 1867년 3월 멕시코를 떠났다. 막시밀리안은 오스트리아 황제 프란츠 요제프의 동생이었다."
  subjects: [mexico, france, usa]
  links: []
  tags: [war, politics, diplomacy]
  sources: ["The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Leslie Bethell 편, Cambridge University Press, 1985)", "Jack Autrey Dabbs, The French Army in Mexico, 1861–1867 (Mouton, 1963)"]

- id: araucania-occupation-1861
  year: 1861
  endYear: 1883
  title:
    ko: "아라우카니아 점령과 마푸체 아라우카니아의 끝(1861~1883)"
  summary:
    ko: "마푸체는 스페인과 1641년 킬린 의회 이래 비오비오강 남쪽에서 독립을 지켰고, 칠레 공화국이 선 뒤에도 이 마푸체 아라우카니아는 칠레의 바깥이었다. 1861년 코르넬리오 사아베드라가 칠레 정부에 아라우카니아를 군사 거점으로 하나씩 점령하자는 계획을 냈고, 1861~1862년 물첸에 요새를 세운 데 이어 1862년 병력 약 800명으로 앙골 터에 다시 요새를 지었다. 1868년 4월~1869년 3월의 둘째 원정에서 칠레군은 가축 200만 마리 넘게 빼앗아 마푸체에게 기근이 닥쳤고, 1870년 5월 정부는 정식으로 전쟁을 선포했다. 1870년 무렵 칠레의 경계는 말레코강까지 내려왔다. 1871년 마푸체 지도자 킬라판이 평화를 청해 한동안 소강이 이어졌다. 칠레가 남아메리카 태평양 전쟁(「남아메리카 태평양 전쟁과 안콘 조약(1879~1884)」(뒤의 사건))으로 북쪽에 병력을 돌린 사이 마푸체의 봉기 준비가 퍼졌으나, 1881년 1월 리마 점령으로 북쪽 전선이 기울자 칠레군이 카우틴강까지 나아가 3월 28일 빅토리아를 세웠고, 11월 12일의 마푸체 봉기는 대부분 막혔다. 1883년 1월 1일 빌라리카를 다시 세워 점령이 끝났다. 전쟁과 천연두 같은 병으로 수천 명이 숨졌고, 마푸체는 땅 대부분을 잃어 약 3천 건의 소유 증서로 약 50만 ha의 작은 보호 구역(레둑시온)에 몰렸다. 점령 때의 대통령은 호아킨 페레스(1861~1871)·페데리코 에라수리스 사냐르투(1871~1876)·아니발 핀토(1876~1881)·도밍고 산타마리아(1881~1886)이다. 마푸체 안에서도 평지의 마푸체와 안데스 쪽 마푸체가 칠레와 협상할지 싸울지를 두고 갈렸고, 1867년 칠레가 연 회의에는 평지 쪽 약 1,000명이 나왔다. 칠레 정부는 점령한 땅을 경매에 부쳐 유럽 이민을 들였고 1886년까지 외국인 정착민이 약 3,500명으로 어림된다."
  subjects: [chile, mapuche-araucania]
  links:
    - { from: chile, to: mapuche-araucania, note: "아라우카니아를 점령해 병합 (1861~1883)" }
  tags: [war, society, politics]
  sources: ["The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Leslie Bethell 편, Cambridge University Press, 1985)", "Simon Collier, William F. Sater, A History of Chile, 1808–2002 (Cambridge University Press, 2nd ed., 2004)"]

- id: homestead-railroad-1862
  year: 1862
  endYear: 1869
  title:
    ko: "홈스테드법과 대륙 횡단 철도(1862~1869)"
  summary:
    ko: "남부 주들이 연방을 떠나 의회에서 빠지자 미국의 링컨 정부는 서부 개척을 돕는 법을 서둘러 통과시켰다. 1862년 5월 20일 홈스테드법은 21세 이상의 가장에게 서부 공유지 160에이커(약 65ha)를 5년간 살며 일구면 거의 공짜로 주었고, 7월 1일 태평양 철도법은 유니언 퍼시픽과 센트럴 퍼시픽 두 회사에 철도를 놓을 땅과 대출을 주었다. 홈스테드법으로 1934년까지 약 160만 건의 신청이 받아들여져 약 2억 7천만 에이커가 개인에게 넘어갔으나(합계는 문헌마다 갈린다), 그 땅은 대부분 원주민이 살던 곳이었다(「대평원 전쟁: 리틀빅혼에서 운디드니까지(1866~1890)」(뒤의 사건)). 유니언 퍼시픽은 네브래스카의 오마하에서 서쪽으로, 센트럴 퍼시픽은 캘리포니아의 새크라멘토에서 동쪽으로 놓였고, 노동자는 센트럴 퍼시픽에서는 대부분 중국인이었으며 유니언 퍼시픽에서는 아일랜드 이민자와 제대한 군인이 많았다. 1869년 5월 10일 유타 준주의 프로몬토리 서밋에서 두 선이 만났고, 대륙을 잇는 철도가 놓이자 대륙 서쪽의 이민과 목축·농업이 크게 늘었으며 들소 사냥꾼들이 몰려 1880년대에 들소 떼가 거의 사라졌다. 1862년 12월에는 미네소타에서 다코타 수 사람들의 봉기가 일어나 38명이 한꺼번에 교수형을 받았다. 1864년의 개정 태평양 철도법은 철도 회사에 주는 땅과 대출을 늘렸고, 센트럴 퍼시픽은 1863년 1월 새크라멘토에서, 유니언 퍼시픽은 같은 해 12월 오마하에서 공사를 시작했다. 철도 회사는 선로 양쪽의 땅을 받아 되팔며 이민을 끌어들였다. 철도는 시카고와 캔자스시티 같은 도시를 곡물과 가축이 모이는 곳으로 키웠다. 마지막 대못은 금으로 만든 것이어서 골든 스파이크라 불린다."
  subjects: [usa]
  links: []
  tags: [economy, society]
  sources: ["Eric Foner, Reconstruction: America's Unfinished Revolution, 1863–1877 (Harper & Row, 1988)", "Stephen E. Ambrose, Nothing Like It in the World: The Men Who Built the Transcontinental Railroad, 1863–1869 (Simon & Schuster, 2000)"]
