- id: fraser-gold-rush-1858
  year: 1858
  endYear: 1866
  title:
    ko: "프레이저강 골드러시와 브리티시컬럼비아 식민지(1858~1866)"
  summary:
    ko: "1857~1858년 프레이저강 협곡에서 금이 나오자 캘리포니아 등에서 1만~2만 명으로 어림되는 광부가 밀려들었다. 이곳은 허드슨 베이 회사가 1821년부터 독점 교역권을 쥔 북서부 영토에 속했고 원주민 나라들이 살던 땅이어서, 광부와 원주민 사이에 1858년 여름 무력 충돌이 일어났다. 영국 의회는 질서를 세우려 1858년 8월 2일 본토에 브리티시컬럼비아 식민지를 만들었고, 밴쿠버섬 식민지의 총독 제임스 더글러스가 두 식민지의 총독을 겸했다(「오리건 조약과 밴쿠버섬 식민지(1846~1849)」(앞의 사건)). 1859년 수도는 뉴웨스트민스터로 정해졌고, 1860년대 초 카리부의 금광이 둘째 열풍을 낳았다. 1862~1863년에는 천연두가 퍼져 원주민 인구가 크게 줄었다. 1862년 북쪽에 스티킨 준주가 따로 만들어졌다가 1863년 경계법으로 식민지가 북위 60도, 서경 120도까지 넓어지며 북서부 영토의 상당 부분이 브리티시컬럼비아에 들어왔다. 1864년 더글러스의 뒤를 프레더릭 시모어가 이었다. 금 열풍이 식자 재정이 어려워졌고, 영국은 1866년 8월 6일 두 식민지의 합병을 선포해 같은 해 11월 19일 밴쿠버섬 식민지를 끝내고 하나의 브리티시컬럼비아 식민지로 합쳤다. 미국인 광부가 많이 몰린 것도 영국이 이 땅에 서둘러 정식 지배를 세운 까닭의 하나였다. 미국과의 경계는 1846년 오리건 조약으로 북위 49도로 정해져 있었으나, 1859년 샌환섬에서 돼지 한 마리를 둘러싼 갈등으로 영국군과 미군이 맞서는 일이 벌어졌고 이 섬의 귀속은 독일 황제의 중재로 1872년 미국에 주는 것으로 풀렸다. 1862~1865년 광부를 위해 카리부 도로가 놓였고, 이 공사를 둘러싸고 1864년 칠코틴 전쟁이 일어나 원주민 지도자 다섯이 교수형을 받았다."
  subjects: [british-columbia, vancouver-island, north-western-territory, uk, usa]
  links:
    - { from: vancouver-island, to: british-columbia, note: "두 식민지가 합쳐져 하나의 브리티시컬럼비아 식민지가 됨 (1866)" }
  tags: [economy, politics, society]
  sources: ["Jean Barman, The West Beyond the West: A History of British Columbia (University of Toronto Press, 1991)", "The Oxford History of the British Empire, vol. 3: The Nineteenth Century (Andrew Porter 편, Oxford University Press, 1999)"]

- id: us-civil-war-1861
  year: 1861
  endYear: 1865
  title:
    ko: "남부 연합과 남북 전쟁(1861~1865)"
  summary:
    ko: "1860년 11월 노예제 확대에 반대한 공화당의 에이브러햄 링컨이 대통령에 뽑히자 사우스캐롤라이나가 12월 20일 연방 탈퇴를 선언했고, 남부 일곱 주가 1861년 2월 8일 앨라배마의 몽고메리에서 남부 연합을 세워 제퍼슨 데이비스를 대통령으로 뽑았다(남부 연합은 어느 나라에도 정식으로 승인받지 못했다). 4월 12일 찰스턴 항의 섬터 요새를 남부군이 포격하며 전쟁이 시작되었고, 링컨이 의용군을 부르자 버지니아·아칸소·노스캐롤라이나·테네시가 남부 연합에 가담해 모두 열한 주가 되었다. 1862년 9월 17일 앤티텀 전투는 하루에 미군 역사상 가장 많은 사상자를 냈고, 링컨은 1863년 1월 1일 노예 해방 선언으로 남부 연합 지역의 노예를 자유롭게 한다고 밝혀 흑인 병사의 입대를 열었다. 1863년 7월 1~3일 게티즈버그에서 로버트 리의 북버지니아군이 막혔고 7월 4일 율리시스 그랜트가 미시시피강의 빅스버그를 얻어 남부를 둘로 갈랐으며, 1864년 윌리엄 셔먼의 애틀랜타 점령과 바다로의 행진이 남부의 경제를 무너뜨렸다. 1865년 4월 9일 리가 버지니아의 애퍼매톡스에서 그랜트에게 항복했고 5월 초 남부 연합 정부는 흩어졌으며 데이비스는 5월 10일 붙잡혔다. 사망자는 군인만 62만~75만 명으로 추산되며 미국 전쟁 가운데 가장 큰 피해를 냈다. 링컨은 1863년 11월 19일 게티즈버그 국립묘지 봉헌식 연설에서 '자유의 새로운 탄생'을 말했다. 전쟁은 북부의 공업과 철도·전신을 키웠고 연방 정부의 권한을 크게 늘렸으며, 1865년 12월 수정 헌법 13조가 노예제를 없앴다(「남북 전쟁의 끝과 재건 시대(1865~1877)」(뒤의 사건))."
  subjects: [usa]
  links: []
  tags: [war, politics, society]
  sources: ["James M. McPherson, Battle Cry of Freedom: The Civil War Era (Oxford University Press, 1988)", "Eric Foner, Reconstruction: America's Unfinished Revolution, 1863–1877 (Harper & Row, 1988)"]
