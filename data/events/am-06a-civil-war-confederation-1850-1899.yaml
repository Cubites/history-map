- id: alaska-purchase-1867
  year: 1867
  endYear: 1867
  title:
    ko: "알래스카 매입(1867)"
  summary:
    ko: "러시아-아메리카 회사가 다스리던 러시아령 아메리카는 크림 전쟁(1853~1856)의 패배로 재정이 어려워진 러시아 제국에 쓸모가 줄었다. 모피 사냥으로 이익이 줄었고, 전쟁이 나면 영국령 캐나다가 이 땅을 쉽게 차지할 것이라는 걱정도 있었으며, 알렉산드르 2세는 이 땅을 미국에 파는 쪽을 택했다. 미국 국무 장관 윌리엄 수어드와 러시아 공사가 1867년 3월 30일 워싱턴에서 720만 달러(1에이커에 약 2센트)를 받고 알래스카를 넘기는 조약에 서명했고, 상원이 4월 9일 37 대 2로 비준했다. 약 150만 km²의 이 땅은 1825년 영국과 러시아의 협약선 그대로 서경 141도와 팬핸들 해안선이 캐나다 쪽 경계가 되었다(「먼로 독트린과 러시아령 아메리카의 경계 조약(1823~1825)」(앞의 사건)). 1867년 10월 18일 싯카(노보아르한겔스크)에서 인도식이 열려 러시아 깃발이 내려지고 미국 깃발이 올랐다. 틀링깃과 알류트 같은 원주민은 협상에 참여하지 못했고 조약은 원주민을 미국이 따로 정할 부족으로 다루었다. 알래스카 팬핸들의 경계는 1903년 영미 판정으로 다시 확정되었다. 미국 의회가 돈을 내주는 법은 1868년 7월에야 통과했다. 미국에서는 이 매입을 '수어드의 어리석은 짓'이라 비웃기도 했으나 1890년대 말 클론다이크와 놈의 금광 열풍이 값을 보여 주었다. 알래스카는 1884년 지구, 1912년 준주가 되었고 1959년 49번째 주가 되었다. 매입 뒤 알래스카는 처음에 미국 육군이 다스렸고, 러시아인 정착민 가운데 일부는 남고 일부는 러시아로 돌아갔다. 이 매입으로 러시아의 북아메리카 영토는 모두 끝났다."
  subjects: [usa, russian-america, russia]
  links:
    - { from: russia, to: usa, note: "알래스카를 720만 달러에 매각 (1867-03-30)" }
  tags: [diplomacy, politics]
  sources: ["Ronald J. Jensen, The Alaska Purchase and Russian-American Relations (University of Washington Press, 1975)", "Lydia T. Black, Russians in Alaska, 1732–1867 (University of Alaska Press, 2004)"]

- id: ten-years-war-1868
  year: 1868
  endYear: 1878
  title:
    ko: "쿠바 10년 전쟁(1868~1878)"
  summary:
    ko: "스페인의 쿠바 총사령부에서는 설탕과 노예제에 기대는 서부와 달리 동부의 크리올료 지주들이 높은 세금과 정치적 권리의 부족에 불만이 컸다. 1868년 10월 10일 동부 라데마하과 농장에서 카를로스 마누엘 데 세스페데스가 자기 노예를 풀어 주며 독립을 선언해(야라의 외침) 전쟁이 시작되었고, 1869년 4월 과이마로에서 헌법을 정해 세스페데스를 대통령으로 뽑았다. 반란군에는 도미니카 출신의 막시모 고메스와 쿠바 동부 출신 안토니오 마세오 같은 지휘관이 있었고, 스페인은 같은 해 본국에서 혁명(1868년 9월)을 겪으면서도 군대를 늘려 맞섰다. 세스페데스는 1873년 반란 정부에서 물러났고 1874년 2월 27일 스페인군에게 쓰러졌다. 전쟁은 동부를 황폐하게 했고, 1878년 2월 10일 산혼 협정으로 끝났다. 협정은 일부 사면과 자유 보장을 약속했으나 독립도 노예제 폐지도 담지 않았고, 3월 15일 마세오가 바라과에서 이를 받아들이지 않는다고 선언해 항의했다(바라과 항의). 1879~1880년 작은 전쟁이 이어진 뒤 스페인은 1880년 노예제를 단계적으로 없애는 법을 만들었고 1886년 10월 7일 노예 제도를 완전히 없앴다. 독립은 1895년의 전쟁에 이어진다(「호세 마르티와 쿠바 독립 전쟁(1895~1898)」(뒤의 사건)). 스페인은 반란군 지역을 막으려 큰 병력을 보내 쥐카로–모론 요새선을 쌓았고, 1870년 모레트 법으로 노예의 자유 태생 자녀와 60세 넘은 노예를 풀어 주었다. 1873년 10월 반란군에게 무기를 나르던 미국 배 비르지니우스호가 붙잡혀 선원 53명이 총살되자 미국과 스페인의 관계가 어려워졌다. 마세오와 고메스가 이끈 반란군에는 흑인과 혼혈 병사가 많았다."
  subjects: [cuba-captaincy-general, spain]
  links: []
  tags: [war, politics, society]
  sources: ["Louis A. Pérez Jr., Cuba: Between Reform and Revolution (Oxford University Press, 5th ed., 2015)", "Ada Ferrer, Insurgent Cuba: Race, Nation, and Revolution, 1868–1898 (University of North Carolina Press, 1999)"]

- id: red-river-1869
  year: 1869
  endYear: 1873
  title:
    ko: "루퍼츠랜드 이양과 레드강 저항, 브리티시컬럼비아의 연방 가입(1869~1873)"
  summary:
    ko: "허드슨 베이 회사는 1670년의 헌장으로 루퍼츠랜드를 가졌고 1821년부터 북서부 영토의 독점 교역권도 쥐었으나, 연방(「샬럿타운·퀘벡 회의와 캐나다 연방(1864~1867)」(앞의 사건))을 이룬 캐나다는 서쪽으로 넓히려 했다. 1869년 회사가 캐나다 정부에게서 약 30만 파운드를 받고 땅을 넘기기로 하자 캐나다는 윌리엄 맥두걸을 지사로 보냈고, 레드강 정착지의 메티스는 땅 권리가 보장되지 않은 채 측량이 이루어지는 데 항의해 1869년 11월 포트 개리를 차지했다. 12월 8일 임시 정부를 세운 루이 리엘은 12월 27일 대통령이 되었고, 1870년 3월 4일 임시 정부 재판에서 토머스 스콧이 총살되어 온타리오 쪽의 분노를 샀다. 1870년 5월 12일 매니토바법이 매니토바 주를 만들었고, 1870년 7월 15일 루퍼츠랜드와 북서부 영토가 영국 왕실에서 캐나다로 넘어가 남은 땅은 북서 준주가 되었다. 8월 24일 가넷 울즐리의 원정군이 포트 개리에 이르자 리엘은 미국으로 피했다. 1871년 7월 20일 브리티시컬럼비아 식민지가 대륙 횡단 철도를 약속받고 연방의 새 주로 가입했고, 1873년 7월 1일 프린스에드워드섬이 뒤를 이었다. 연방 총리는 존 A. 맥도널드(1867~1873)와 알렉산더 매켄지(1873~1878)였다. 메티스는 프랑스어를 쓰는 가톨릭 신자가 많은 들소 사냥꾼과 모피 교역 집안의 후손으로 레드강 둘레에 살았다. 이때 만들어진 매니토바는 지금보다 훨씬 작은 주였고, 매니토바법은 메티스 자녀를 위해 약 140만 에이커의 땅을 따로 두었으나 많은 메티스가 뒤에 땅을 잃고 서쪽으로 옮겨 갔다. 회사는 땅을 넘기는 대가로 농사짓기 좋은 땅의 20분의 1을 그대로 가졌다."
  subjects: [ruperts-land, north-western-territory, british-columbia, canada, uk]
  links:
