- id: conquest-of-desert-1878
  year: 1878
  endYear: 1885
  title:
    ko: "사막 정복과 칠레–아르헨티나 국경 조약(1878~1885)"
  summary:
    ko: "아르헨티나 팜파와 파타고니아 북부는 마푸체와 테우엘체 같은 원주민이 살던 곳으로, 1870년대 초 이들의 습격(말론)과 정부의 농장 확장이 부딪쳤다. 전쟁 장관 아돌포 알시나는 1876~1877년 길이 약 374km의 알시나 참호를 파 국경을 앞으로 옮기려 했으나 1877년 숨졌고, 뒤를 이은 전쟁 장관 훌리오 아르헨티노 로카가 1878~1879년 군대를 몰아 리오네그로강까지 나아갔다. 1879년 두 번째 소탕에서는 1,313명이 숨지고 1만 5천 명 넘게 포로가 되었다고 전한다(사막 정복). 로카는 1880년 10월 대통령이 되었고, 1881년 콘라도 비예가스의 군대가 네우켄을 차지했으며, 1884년 마지막 큰 싸움 뒤 이나칼과 포이엘이 이끈 3,000명 넘는 무리가 항복했다. 같은 해 베냐민 빅토리카가 이끈 차코 원정은 북쪽에서 원주민의 땅을 가로막았다. 원주민 가운데 일부는 노예로 부려졌고(원정 전체의 희생자 수는 문헌마다 갈린다), 점령한 땅은 대지주에게 팔렸다. 한편 칠레와는 1881년 7월 23일 국경 조약으로 안데스 분수령을 경계로 삼고 마젤란 해협은 칠레에 두되 중립으로 하며 티에라델푸에고는 둘로 나누었다. 칠레가 같은 때 남아메리카 태평양 전쟁(「남아메리카 태평양 전쟁과 안콘 조약(1879~1884)」(뒤의 사건))을 치르던 점이 이 타협을 쉽게 했다. 원정에는 레밍턴 소총과 전신이 쓰였고 정부는 비용을 대려고 1878년 땅을 담보로 한 공채를 발행했다. 아르헨티나 대통령은 니콜라스 아벨랴네다(1874~1880)에 이어 로카(1880~1886)였다. 사막이라는 이름은 사람이 살던 땅을 비어 있다고 본 말이라는 비판이 있다."
  subjects: [argentina, chile]
  links:
    - { from: argentina, to: chile, note: "1881년 국경 조약으로 안데스 분수령과 해협의 경계를 정함 (1881-07-23)" }
  tags: [war, society, diplomacy]
  sources: ["David Rock, Argentina 1516–1987: From Spanish Colonization to Alfonsín (University of California Press, 1985)", "The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)"]

- id: war-of-the-pacific-1879
  year: 1879
  endYear: 1884
  title:
    ko: "남아메리카 태평양 전쟁과 안콘 조약(1879~1884)"
  summary:
    ko: "1866년 경계 조약은 칠레와 볼리비아의 국경을 남위 24도로 정했고, 1874년 조약은 이를 지키되 볼리비아가 23~24도 사이의 칠레 기업에 25년 동안 세금을 올리지 않기로 했다. 페루와 볼리비아는 1873년 2월 칠레에 맞선 비밀 방어 동맹을 맺어 두었고, 볼리비아가 1878년 2월 칠레 회사의 초석 수출에 세금을 매기자 칠레는 조약 위반이라며 1879년 2월 14일 안토파가스타를 점령했다. 볼리비아가 3월 1일 칠레에, 칠레가 4월 5일 볼리비아와 페루에 전쟁을 선포했고(남아메리카 태평양 전쟁, 초석 전쟁), 1879년 10월 8일 앙가모스 해전에서 칠레가 페루의 함정 우아스카르를 붙잡아 바다를 쥐었다. 1880년 5월 타크나에서 이긴 뒤 볼리비아는 전쟁에서 물러났고 칠레군은 1881년 1월 리마를 차지했다. 페루는 마리아노 이그나시오 프라도가 1879년 12월 나라를 떠난 뒤 니콜라스 데 피에롤라, 프란시스코 가르시아 칼데론, 리사르도 몬테로, 미겔 이글레시아스로 이어지는 여러 정부로 갈라졌고, 이글레시아스가 1883년 10월 20일 안콘 조약에 서명해 타라파카를 칠레에 넘기고 타크나와 아리카를 10년 동안 칠레가 맡기로 했다(10년 뒤 주민 투표는 열리지 않았다). 볼리비아는 1884년 4월 4일 발파라이소 휴전으로 바다 쪽 땅(안토파가스타)을 잃었고 1904년 평화 조약으로 확정되었다. 사상자 수는 문헌마다 크게 갈려, 한 어림은 사상자 약 2만 5천 명과 포로 약 9천 명이다. 칠레는 대통령 아니발 핀토(1876~1881)와 도밍고 산타마리아(1881~1886)가, 볼리비아는 일라리온 다사와 나르시소 캄페로가 이끌었다."
  subjects: [chile, peru, bolivia]
  links:
    - { from: chile, to: bolivia, note: "안토파가스타를 점령 (1879-02-14)" }
    - { from: peru, to: chile, note: "안콘 조약으로 타라파카를 넘김 (1883-10-20)" }
  tags: [war, diplomacy, economy]
  sources: ["William F. Sater, Chile and the War of the Pacific (University of Nebraska Press, 1986)", "The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)"]
