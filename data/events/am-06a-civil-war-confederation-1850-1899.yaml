# 아메리카 사건 1묶음 갈래 06a(am-06a): 남북 전쟁과 남부 연합·캐나다 연방·태평양 전쟁(남아메리카) — 개즈던 매입과 멕시코 개혁 전쟁·워커와 모스키토 해안·브리티시컬럼비아·프랑스의 멕시코 개입·마푸체 아라우카니아의 끝·대륙 횡단 철도·파라과이 전쟁·재건 시대·대평원 전쟁·알래스카 매입·쿠바 10년 전쟁·루퍼츠랜드 이양·사막 정복·북극 제도 이양과 북서 반란·황금법·모스키토 보호구 병합·쿠바 독립 전쟁·푸나데아타카마 판정·히우브랑쿠의 국경 외교 (1853 ~ 1903년)
# 범위: 1850~1899년에 시작한 아메리카의 사건. 멕시코의 개혁 전쟁과 프랑스 개입, 중앙아메리카의 워커 침입과 모스키토 해안 조약, 영국령 북아메리카(브리티시컬럼비아·캐나다 연방·루퍼츠랜드 이양·북극 제도·북서 반란), 미국의 남북 전쟁과 재건·서부 개척·대평원 전쟁·알래스카 매입,
#   남아메리카의 파라과이 전쟁·아라우카니아 점령·사막 정복·남아메리카 태평양 전쟁·칠레–아르헨티나 국경 판정·브라질의 노예 해방과 공화국·국경 외교, 카리브의 쿠바 10년 전쟁과 독립 전쟁(사건 22개).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 한 사건이 여러 나라의 탭 칸·열쇠를 함께 채우므로 본문에 그 항목 이름을 모두 적었다.
# 날짜: 모두 그레고리력이다. 확실하지 않은 날짜는 '무렵'으로 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 위키백과 한국어판 표제, 저장소 기존 표기를 따랐다. 사망자·피해·이주 규모는 범위와 추산으로 적었고 한 숫자로 못 박지 않았다. 같은 이름이 겹치는 곳(캐나다 연방의 '캐나다'와 캐나다주, 쿠바 총사령부와 쿠바)은 처음에 풀어 썼다.
#   분쟁·민족 문제(대평원 전쟁과 원주민 땅의 상실, 아라우카니아 점령, 사막 정복, 파라과이 전쟁, 노예제와 재건)는 일어난 일과 숫자만 적었고 어느 쪽 시각도 따르지 않았다. 원주민은 부족 이름으로 적었다.
# 지도 결정과의 관계: 남부 연합(1861~1865)은 항목 없이 글로 적고 subjects는 미국으로 했다. 멕시코 제2제국(1864~1867)은 항목이 없어 글로만 적었다. 파라과이를 점령한 브라질군(1870~1876)과 원주민 조약(포트래러미 등)은 글로만 적었다.
#   루퍼츠랜드·북서부 영토의 이양(1870)과 북극 제도(1880)는 명목 지배와 실제 이양을 구분해 적었다. 영국령 온두라스의 경계는 글로만 적었다. 하와이 왕국의 1898년 병합은 오세아니아 몫이라 쓰지 않았다.
# 한국사와 닿는 점: 남북 전쟁 뒤 미국 배의 조선 접근(1866년 제너럴셔먼호, 1871년 신미양요)을 한 구절씩 적었다. 한국사 파일은 고치지 않는다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 출처는 표준 개설서의 원서 위주(한국어 번역본은 쓰지 않음).
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)).

- id: reform-war-1853
  year: 1853
  endYear: 1861
  title:
    ko: "개즈던 매입과 아유틀라 혁명, 개혁 전쟁(1853~1861)"
  summary:
    ko: "멕시코–미국 전쟁에서 진 멕시코(「멕시코–미국 전쟁과 과달루페이달고 조약(1846~1848)」(앞의 사건))에서 보수파가 1853년 4월 안토니오 로페스 데 산타 안나를 다시 불러 독재에 가까운 권력을 맡겼다. 미국은 남부를 가로지르는 철도에 알맞은 평탄한 길이 필요했고 산타 안나는 군대를 재건할 돈이 급해, 1853년 12월 30일 미국 공사 제임스 개즈던과 조약에 서명했다. 미국 상원이 1854년 4월 25일 땅을 줄여 비준했고, 멕시코는 1,000만 달러를 받고 오늘날 애리조나 남부와 뉴멕시코 남서부에 해당하는 약 7만 7천 km²를 미국에 넘겼다(개즈던 매입). 1854년 3월 게레로의 자유파 후안 알바레스와 이그나시오 코몬포르트가 아유틀라 계획을 내걸고 일어났고 산타 안나는 1855년 8월 나라를 떠났다. 알바레스와 코몬포르트의 자유파 정부는 1855년 11월 후아레스법으로 군인과 성직자의 특별 재판소를 없앴고 1856년 6월 레르도법으로 교회와 공동체가 가진 땅을 팔게 했다. 1857년 2월 5일 헌법은 이런 개혁을 담았으나 교회와 보수파가 반발했고, 코몬포르트가 그해 12월 헌법을 접으려 하다 1858년 1월 나라를 떠나자 대법원장 베니토 후아레스가 헌법에 따라 대통령직을 이어받았다. 보수파는 1858년 1월 펠릭스 소로아가를 앞세워 멕시코시티에 따로 정부를 세웠고(뒤에 미겔 미라몬이 이어받았다), 후아레스의 자유파 정부는 베라크루스로 옮겨 싸웠다(개혁 전쟁, 1858~1860). 1860년 12월 22일 칼풀랄파에서 자유파가 이겼고 후아레스는 1861년 1월 11일 멕시코시티로 돌아왔다. 후아레스는 1861년 대통령에 선출된 뒤 7월 외채 상환을 2년 미뤄 유럽의 개입을 불렀다(「프랑스의 멕시코 개입과 막시밀리안 제국(1861~1867)」(뒤의 사건)). 레르도법은 교회뿐 아니라 원주민 공동체의 공유지도 개인 소유로 바꾸어 많은 공동체 농민이 땅을 잃는 결과를 낳았다."
  subjects: [mexico, usa]
  links:
    - { from: mexico, to: usa, note: "개즈던 매입으로 힐라강 남쪽 땅을 넘김 (1853-12-30 서명, 1854 비준)" }
  tags: [politics, diplomacy, war]
  sources: ["Paul Neff Garber, The Gadsden Treaty (University of Pennsylvania Press, 1923)", "The Cambridge History of Latin America, vol. 3: From Independence to c. 1870 (Leslie Bethell 편, Cambridge University Press, 1985)"]

- id: walker-mosquito-1855
  year: 1855
  endYear: 1860
  title:
    ko: "윌리엄 워커의 니카라과 침입과 모스키토 해안 조약(1855~1860)"
  summary:
    ko: "1850년 4월 19일 클레이턴–불워 조약으로 영국과 미국은 어느 쪽도 중앙아메리카와 모스키토 해안을 독점하지 않기로 했으나 두 나라의 경쟁은 이어졌다. 1855년 미국인 윌리엄 워커가 니카라과 자유파의 초청을 받아 용병 수십 명을 이끌고 들어와 그라나다를 차지했고, 선거를 치러 1856년 7월 12일 스스로 니카라과 대통령에 취임했다. 미국의 프랭클린 피어스 정부는 1856년 5월 그의 정부를 승인했고, 워커는 영어를 공용어로 삼고 노예제를 되살렸다. 코스타리카의 후안 라파엘 모라 포라스가 앞장서 코스타리카·온두라스·엘살바도르·과테말라가 군대를 모아 맞섰고, 1857년 5월 1일 워커는 미국 해군 장교에게 항복했다. 그는 1860년 다시 중앙아메리카에 와서 영국 해군 장교 노월 새먼에게 붙잡혀 온두라스 당국에 넘겨졌고 9월 12일 트루히요에서 총살되었다. 1859년 영국과 과테말라는 벨리즈(영국령 온두라스)의 경계를 정했고, 영국은 1859년 11월 28일 와이크–크루스 조약으로 1852년 식민지로 삼았던 베이 제도를 돌려주고 모스키토 해안 북부를 온두라스에 넘겼다. 1860년 1월 28일 마나과 조약으로 영국은 해안의 나머지에 대한 종주권을 니카라과에 넘겼고, 모스키토 왕국은 모스키토 보호구라는 이름으로 자치를 이어 갔다. 워커의 침입 때 코스타리카군은 1856년 3월 산타로사에서 워커군과 싸웠고, 4월 11일 리바스 전투에서 병사 후안 산타마리아가 워커 쪽이 쓰던 건물에 불을 지르다 전사했다고 전해지며 지금 코스타리카에서 국민 영웅으로 기려진다. 워커는 1857년 항복 뒤 같은 해 말 다시 니카라과에 상륙하려다 미국 해군에게 붙잡혔다."
