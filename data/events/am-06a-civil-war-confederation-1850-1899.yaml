- id: golden-law-1888
  year: 1888
  endYear: 1889
  title:
    ko: "황금법과 브라질 공화국 선포(1888~1889)"
  summary:
    ko: "브라질은 아메리카에서 노예 제도를 가장 늦게 없앤 나라였다. 1850년 에우제비우 지 케이로스 법이 대서양 노예 무역을 끊었고, 1871년 9월 28일 히우브랑쿠 법은 노예의 자유 태생 자녀를 자유롭게 했으며, 1885년 60세 넘은 노예를 푸는 노인법이 뒤따랐다. 같은 때 노예 도망과 자유민의 노예 해방 운동이 커졌고 파울리스타 농장주들도 이민 노동력으로 눈을 돌렸다. 1888년 5월 13일 황제 페드루 2세가 유럽에 가 있는 동안 섭정을 맡은 딸 이자베우 공주가 두 줄짜리 황금법에 서명해 남아 있던 약 60만~70만 명으로 어림되는 노예를 보상 없이 풀었다. 농장주들은 보상을 받지 못한 데 분노해 제정에서 등을 돌렸고, 군은 1880년대 군인의 정치 발언을 막는 정부와 갈등을 겪었다. 1889년 11월 15일 데오도루 다 폰세카 장군이 군을 이끌고 리우데자네이루에서 제정을 무너뜨리고 공화국을 선포했으며 페드루 2세는 이틀 뒤 가족과 함께 유럽으로 떠났다. 데오도루는 임시 정부의 수반이었고 1891년 헌법으로 대통령이 되었다가 같은 해 물러났다. 이어 플로리아누 페이쇼투(1891~1894), 프루덴치 지 모라이스(1894~1898), 캄푸스 살리스(1898~1902)가 대통령을 지냈다. 풀려난 사람들은 땅과 교육을 얻지 못한 채 농장 노동자나 도시의 가난한 노동자가 되었다. 공화국의 이름은 브라질 합중국으로 정해졌고, 1890년대에는 상파울루의 커피 농장이 이탈리아 이민자를 많이 들였다. 페드루 2세는 1831년 어린 나이에 즉위해 58년 동안 재위했다. 노예 무역이 끊긴 뒤에는 노예 값이 올라 북동부의 노예가 남동부 커피 지대로 팔려 가는 일이 많았다."
  subjects: [brazil]
  links: []
  tags: [society, politics]
  sources: ["The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)", "Boris Fausto, A Concise History of Brazil (Cambridge University Press, 1999)"]

- id: mosquito-reincorporation-1894
  year: 1894
  endYear: 1894
  title:
    ko: "니카라과의 모스키토 보호구 병합(1894)"
  summary:
    ko: "1860년 마나과 조약(「윌리엄 워커의 니카라과 침입과 모스키토 해안 조약(1855~1860)」(앞의 사건))으로 해안 남부는 니카라과의 종주권 아래 모스키토 보호구가 되어 자치를 인정받았다. 보호구의 수도는 블루필즈였고 수장은 모스키토 왕국의 왕가가 이은 세습 수장이었으며(1861년 지방 헌법은 '왕' 대신 '세습 수장'으로 불렀다), 1865년 조지 오거스터스 프레더릭 2세가 숨지자 후계를 두고 니카라과와 분쟁이 이어졌다. 영국과 니카라과는 1881년 6월 2일 오스트리아 황제 프란츠 요제프의 중재를 받았고, 판정은 니카라과의 주권을 인정하되 모스키토의 자치를 대체로 지키는 쪽이었다. 1893년 대통령에 오른 호세 산토스 셀라야는 중앙 정부의 힘을 늘리려 이 보호구를 겨냥했고, 1894년 2월 니카라과 군대가 블루필즈에 들어갔다. 7월 6일부터 8월 7일까지는 미국 군대가 미국인의 이익을 지킨다며 블루필즈를 점령했고, 영국도 군함을 보내 상황을 지켜보았다. 1894년 11월 20일 모스키토 보호구는 셀라야 도로 니카라과에 편입되었다(재통합). 1905년 영국과 니카라과가 맺은 해리슨–알타미라노 조약은 영국이 이 편입을 받아들였다는 것을 확인했다. 해안의 모스키토 사람들은 이후에도 자치에 대한 요구를 이어 갔다. 보호구는 1861년 9월 13일 지방 헌법으로 모스키토 평의회가 다스렸고, 편입 뒤 블루필즈 일대에는 미국 회사의 바나나와 목재 사업이 커졌다. 셀라야는 1893년부터 1909년까지 자유당 정부를 이끌었다. 1881년 판정은 니카라과가 모스키토의 교역에 세금을 매기거나 규제하지 못하게 했다. 모스키토 사람들은 1849년부터 들어온 모라비아 교회의 영향으로 영어를 쓰는 기독교 공동체가 되어 있었다."
  subjects: [mosquito-kingdom, nicaragua, uk, usa]
  links:
    - { from: nicaragua, to: mosquito-kingdom, note: "보호구를 병합해 셀라야 도로 편입 (1894-11-20)" }
  tags: [politics, diplomacy]
  sources: ["The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)", "Charles R. Hale, Resistance and Contradiction: Miskitu Indians and the Nicaraguan State, 1894–1987 (Stanford University Press, 1994)"]

- id: cuban-independence-war-1895
  year: 1895
  endYear: 1898
  title:
    ko: "호세 마르티와 쿠바 독립 전쟁(1895~1898)"
  summary:
    ko: "10년 전쟁(「쿠바 10년 전쟁(1868~1878)」(앞의 사건))의 뒤 쿠바에서는 노예제가 사라졌으나 스페인의 지배와 설탕 값 폭락의 어려움은 그대로였다. 호세 마르티가 1892년 뉴욕에서 쿠바 혁명당을 만들고 막시모 고메스, 안토니오 마세오와 준비한 봉기는 1895년 2월 24일 시작되었고, 마르티는 4월 11일 고메스와 쿠바 동쪽 플라이타스에 상륙했으나 5월 19일 도스리오스 전투에서 전사했다. 고메스와 마세오의 군대는 1895년 10월부터 서쪽으로 진격해 1896년 1월 22일 섬 서쪽 끝에 닿았고, 마세오는 1896년 12월 7일 아바나 근처에서 전사했다. 스페인 총사령관 발레리아노 바일레르는 1896년 10월 21일 농민을 요새 지역에 모으는 재집중령을 내렸고, 이 때문에 굶주림과 병으로 민간인 15만 5천~17만 명(인구의 약 10%)이 숨진 것으로 어림된다. 스페인은 1897년 쿠바에 자치를 허용했으나 반란군은 독립만을 바랐다. 1898년 2월 15일 아바나 항에서 미국 군함 메인호가 폭발하자 4월 19일 미국 의회가 쿠바의 독립을 인정하며 병합할 뜻이 없다는 텔러 수정안을 의결했고 25일 전쟁을 선포했다(「미국–스페인 전쟁과 파리 조약, 미국령 필리핀(1898)」(뒤의 사건)). 7월 17일 산티아고데쿠바의 스페인군이 항복했고, 12월 10일 파리 조약으로 스페인은 쿠바 주권을 포기했으며, 1899년 1월 1일 미국 군정이 시작되어 쿠바 총사령부가 끝났다. 쿠바는 곧 이어 독립하지만 미국의 영향 아래 놓인다(「플랫 수정안과 쿠바 공화국의 출범(1901~1903)」(뒤의 사건)). 마르티는 시인이자 언론인으로 1895년 3월 25일 몬테크리스티 선언을 냈다."
  subjects: [cuba-captaincy-general, spain, usa]
  links: []
  tags: [war, politics]
  sources: ["Louis A. Pérez Jr., Cuba: Between Reform and Revolution (Oxford University Press, 5th ed., 2015)", "Ada Ferrer, Insurgent Cuba: Race, Nation, and Revolution, 1868–1898 (University of North Carolina Press, 1999)"]

- id: andes-arbitration-1899
  year: 1899
  endYear: 1902
  title:
    ko: "푸나데아타카마 판정과 칠레–아르헨티나 국경 판정(1899~1902)"
  summary:
    ko: "칠레와 아르헨티나는 1881년 조약(「사막 정복과 칠레–아르헨티나 국경 조약(1878~1885)」(앞의 사건))으로 안데스 분수령을 경계로 삼았으나 안데스 남쪽에서 분수령과 산마루가 달라 해석이 갈렸고, 북쪽의 푸나데아타카마 고원에서도 어느 쪽 땅인지 다투었다. 푸나는 칠레가 1879년 남아메리카 태평양 전쟁 때 차지한 땅의 이웃이었으며 볼리비아는 안토파가스타를 잃은 뒤 푸나를 협상 카드로 삼아 아르헨티나와 1889년 5월 10일 비밀 조약을, 칠레와 1891년 5월 19일 마타–레예스 의정서를 따로 맺어 두었다. 두 나라는 1898년 11월 2일 협정으로 분쟁을 미국 공사 윌리엄 부캐넌에게 맡기기로 했고, 1899년 부캐넌과 칠레 대표 엔리케 마시버, 아르헨티나 대표 호세 에바리스토 우리부루가 7만 5천 km²의 분쟁 땅 가운데 약 6만 4천 km²(85%)를 아르헨티나에, 약 1만 1천 km²(15%)를 칠레에 주었다. 파타고니아 쪽 분쟁은 1902년 5월 28일 협정(5월 협정)으로 영국 국왕 에드워드 7세에게 맡겨졌고, 토머스 홀딕 대령이 이끈 영국 조사단이 현지를 살핀 뒤 11월 20일 판정이 나와 분쟁 지대를 두 나라에 나누었다. 같은 협정은 두 나라가 군함을 줄이기로 해 전쟁 위기를 풀었고, 1904년 3월 13일 두 나라는 안데스 국경 고갯길에 평화의 징표로 그리스도상을 세웠다. 아르헨티나 대통령은 훌리오 아르헨티노 로카(1898~1904), 칠레 대통령은 페데리코 에라수리스 에차우렌(1896~1901)이었다. 푸나는 지금 아르헨티나의 후후이·살타·카타마르카에 이르는 고원이다. 아르헨티나는 1889년 조약에서 타리하에 대한 청구를 버리는 대가로 볼리비아의 푸나를 받기로 했다."
  subjects: [argentina, chile, bolivia]
  links: []
  tags: [diplomacy, politics]
  sources: ["Robert N. Burr, By Reason or Force: Chile and the Balancing of Power in South America, 1830–1905 (University of California Press, 1974)", "The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)"]

- id: rio-branco-1899
  year: 1899
  endYear: 1903
  title:
    ko: "히우브랑쿠의 국경 외교: 아마파 판정과 아크레, 페트로폴리스 조약(1899~1903)"
  summary:
    ko: "히우브랑쿠 남작 주제 마리아 다 시우바 파라뉴스 주니오르는 1895년 미국 대통령 그로버 클리블랜드의 중재로 아르헨티나와 다투던 미시오네스 땅을 브라질에 돌려받은 데 이어, 프랑스령 기아나와 아마파의 경계를 스위스 연방 정부의 판정에 맡겨 1900년 12월 1일 땅을 브라질 쪽으로 정하게 했다. 아크레는 볼리비아 땅이었으나 고무를 얻으러 브라질 사람이 대거 이주해 있었고, 1899년 볼리비아가 세관을 세우자 7월 14일 스페인 사람 루이스 가우베스가 아크레 공화국을 선포했다가 이듬해 3월 브라질에 의해 무너졌다. 볼리비아가 1901년 아크레의 개발을 미국 회사 볼리비아 신디케이트에 맡기자 브라질 고무 채취자들이 반발했고, 1902년 8월 6일 플라시두 지 카스트루가 33명의 소총수로 샤푸리의 볼리비아 거점을 쳐서 아크레 전쟁이 시작되었다. 같은 해 외무 장관에 오른 히우브랑쿠는 신디케이트에 보상을 하고 볼리비아와 협상해 1903년 11월 17일 페트로폴리스 조약을 맺었다. 볼리비아는 약 19만 1천 km²를 브라질에 넘기고 브라질은 마투그로수 땅 일부를 내주고 200만 파운드를 치르고 마데이라–마모레 철도를 놓기로 했으며 신디케이트는 11만 파운드를 받았다. 브라질은 1904년 4월 7일 대통령령으로 아크레를 자국 땅에 편입했다. 이 시기의 브라질 대통령은 캄푸스 살리스(~1902)와 호드리게스 아우베스(1902~1906)였다. 아크레로 이주한 브라질 사람 가운데에는 북동부의 가뭄을 피해 온 사람이 많았다. 볼리비아 대통령은 호세 마누엘 판도(1899~1904)였다. 히우브랑쿠는 1912년 죽을 때까지 외무 장관으로 일하며 이웃 나라와의 국경 대부분을 조약과 중재로 정리했다."
  subjects: [brazil, bolivia, french-guiana]
  links:
    - { from: bolivia, to: brazil, note: "페트로폴리스 조약으로 아크레를 넘김 (1903-11-17)" }
  tags: [diplomacy, politics]
  sources: ["E. Bradford Burns, The Unwritten Alliance: Rio-Branco and Brazilian-American Relations (Columbia University Press, 1966)", "The Cambridge History of Latin America, vol. 5: c. 1870 to 1930 (Leslie Bethell 편, Cambridge University Press, 1986)"]
