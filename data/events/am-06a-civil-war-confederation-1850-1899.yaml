- id: canadian-pacific-1880
  year: 1880
  endYear: 1885
  title:
    ko: "북극 제도 이양과 캐나다 태평양 철도, 북서 반란(1880~1885)"
  summary:
    ko: "1880년 7월 31일 영국의 추밀원령은 북아메리카에 있던 영국 영토 가운데 뉴펀들랜드를 뺀 나머지와 북극 제도를 캐나다에 넘긴다고 정했고, 9월 1일 효력이 시작되었다. 영국이 이 섬들을 명목상 청구하고 있었을 뿐 사람이 다스리지는 않았으므로 이 이양은 이름만의 넘김이었다. 앞서 캐나다 정부는 1871~1877년 크리와 오지브와 등 서부 원주민과 일곱 건의 번호 조약을 맺어 땅의 소유권을 넘겨받는 대신 보호구와 연금, 농기구를 약속했다. 총리 존 A. 맥도널드는 서부를 이을 철도를 1881년 캐나다 태평양 철도 회사에 맡겼고, 철도는 1885년 11월 7일 브리티시컬럼비아 크레이겔라키에서 마지막 못이 박혀 완성되었다. 들소가 사라지고 약속된 식량이 모자라자 서스캐처원의 메티스와 크리는 어려워졌고, 1884년 돌아온 루이 리엘이 1885년 3월 임시 정부를 세우며 북서 반란이 시작되었다. 3월 26일 덕 레이크에서 첫 충돌이 있었고 4월 2일 개구리 호수에서 크리 일부가 정착민을 죽였으며 5월 9~12일 바토슈에서 정부군이 메티스를 꺾었다. 리엘은 5월 15일 항복했고 11월 16일 리자이나에서 교수형을 받았는데, 프랑스계 퀘벡에서는 큰 분노가 일었다. 이어진 구간의 철도는 이 반란 때 군대를 빠르게 서쪽으로 보내는 데 쓰였다. 캐나다는 1870년 루퍼츠랜드와 북서부 영토를 먼저 넘겨받았고(「루퍼츠랜드 이양과 레드강 저항, 브리티시컬럼비아의 연방 가입(1869~1873)」(앞의 사건)), 철도는 1871년 브리티시컬럼비아에 한 약속을 지키는 일이기도 했다. 브리티시컬럼비아 구간 공사에는 중국인 노동자가 많이 쓰였다."
