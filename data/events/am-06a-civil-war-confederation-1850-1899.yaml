  tags: [politics, diplomacy]
  sources: ["P. B. Waite, The Life and Times of Confederation, 1864–1867 (University of Toronto Press, 1962)", "Donald Creighton, John A. Macdonald: The Young Politician (Macmillan, 1952)"]

- id: paraguayan-war-1864
  year: 1864
  endYear: 1870
  title:
    ko: "파라과이 전쟁(1864~1870)"
  summary:
    ko: "브라질이 우루과이 내전에 개입하자 파라과이의 프란시스코 솔라노 로페스 대통령은 1864년 11월 브라질 배 마르케스 지 올린다호를 붙잡고 외교 관계를 끊어 전쟁을 시작했고, 12월 브라질 마투그로수를 쳤다. 1865년 4월 파라과이군이 아르헨티나의 코리엔테스에 들어서자 5월 1일 부에노스아이레스에서 브라질·아르헨티나·우루과이가 삼국 동맹 조약을 맺었고, 우루과이에서는 브라질의 도움으로 집권한 베난시오 플로레스가 동맹에 들어갔다. 1866년 9월 쿠루파이티의 정면 공격에서 동맹군은 8,000명이 넘는 사상자를 냈으나 1868년 우마이타 요새가 무너지고 1869년 1월 1일 수도 아순시온이 점령되었다. 1869년 8월 피리베부이와 아코스타 뇨에서 소년병까지 동원한 파라과이군이 꺾였고, 1870년 3월 1일 솔라노 로페스는 세로코라에서 브라질군에게 전사했다. 전쟁 전 약 45만이던 파라과이 인구에서 17만 5천~30만 명이 숨졌다는 추산이 있다(더 낮은 추산도 있다). 브라질군과 아르헨티나군은 1876년까지 파라과이에 주둔했고, 파라과이는 청구하던 땅의 약 4할을 잃어 아피강 북쪽은 브라질로, 미시오네스와 필코마요강 남쪽은 아르헨티나로 넘어갔다. 브라질에서는 약 14만 6천 명이 싸웠고 그 가운데 지원병이 약 5만 6천 명, 국민군이 약 6만 명, 해방된 노예가 약 8,500명이었다. 필코마요강과 베르데강 사이 차코의 귀속은 1878년 미국 대통령 러더퍼드 헤이스의 중재로 파라과이 몫이 되었다. 동맹군의 첫 총사령관은 아르헨티나 대통령 바르톨로메 미트레였고, 전쟁이 끝난 뒤 파라과이는 1870년 새 헌법을 정했으나 남자가 크게 모자라 인구가 오래 회복되지 못했다."
  subjects: [paraguay, brazil, argentina, uruguay]
  links:
