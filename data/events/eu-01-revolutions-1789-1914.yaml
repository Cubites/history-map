- id: boxer-1900
  year: 1899
  endYear: 1901
  title:
    ko: 의화단 운동과 8개국 연합군
  summary:
    ko: "'부청멸양'을 내건 의화단이 산둥에서 일어나 크리스트교 교회와 철도를 공격하고 베이징의 외국 공사관 구역을 포위했다(1900). 청 조정까지 열강에 선전 포고하자 영국·러시아·일본·프랑스·독일·미국·오스트리아-헝가리·이탈리아의 8개국 연합군이 톈진을 거쳐 베이징을 점령했다. 청은 신축 조약(1901)으로 막대한 배상금을 물고 베이징에 외국 군대가 머무르는 것을 인정했다. 이 틈에 러시아는 만주를 점령하고 철수를 미뤘다. 이것이 영국과 일본이 영일 동맹(1902)을 맺는 계기가 되었고, 러시아가 압록강 하구의 용암포를 조차하려 하면서(1903) 러일 전쟁으로 이어졌다."
