- id: norway-independence-1905
  year: 1905
  title:
    ko: 노르웨이의 독립과 스웨덴-노르웨이 연합 해체
  summary:
    ko: "스웨덴-노르웨이 연합 왕국(1814~)에서 노르웨이는 헌법과 의회를 따로 가졌으나 외교와 영사 업무는 스웨덴이 맡았다. 해운업이 커진 노르웨이는 19세기 말부터 독자 영사관을 요구했고, 1905년 5월 국왕 오스카르 2세가 노르웨이 의회의 영사법에 거부권을 쓰자 노르웨이 내각이 총사퇴했다. 노르웨이 의회는 6월 7일 국왕이 정부를 꾸리지 못해 왕으로서의 기능을 잃었다며 연합 해체를 선언했다. 8월 국민 투표에서 해체 찬성이 압도적이었고(36만 8천여 표 대 184표), 양쪽이 국경 가까이에 군대를 두는 긴장 속에 카를스타드 협상(8~9월)에서 국경 요새 철거 등에 합의해 10월 스웨덴이 해체를 인정했다. 11월 국민 투표로 군주제를 택한 노르웨이는 덴마크 왕자 카를을 왕으로 맞았다(호콘 7세). 전쟁 없이 이루어진 이 분리는 평화로운 국가 분리의 사례로 꼽힌다."
