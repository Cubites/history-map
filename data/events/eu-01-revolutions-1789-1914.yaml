- id: anglo-russian-entente-1907
  year: 1907
  endYear: 1910
  title:
    ko: 영러 협상과 삼국 협상
  summary:
    ko: "러일 전쟁에서 진 러시아가 동아시아에서 물러서고 독일의 팽창이 두드러지자, 영국과 러시아가 오랜 대립(그레이트 게임)을 접고 협상을 맺었다(1907년 8월). 페르시아를 북쪽은 러시아, 남동쪽은 영국의 세력권으로 나누고 가운데를 중립 지대로 두었으며, 아프가니스탄은 영국의 세력권으로 인정하고, 티베트에는 서로 간섭하지 않기로 했다. 이로써 러시아-프랑스 동맹(1894), 영국-프랑스 협상(1904)과 함께 삼국 협상이 이루어져 독일·오스트리아-헝가리·이탈리아의 삼국 동맹과 맞서게 되었다. 같은 해 러시아는 일본과도 1차 러일 협약을 맺어, 비밀 조항으로 북만주와 외몽골은 러시아의, 남만주와 한국은 일본의 세력권으로 서로 인정했다. 일본은 2차 러일 협약(1910년 7월)을 거쳐 열강의 묵인 속에 한국을 병합했다."
