- id: sarajevo-1914
  year: 1914
  title:
    ko: 사라예보 사건과 1차 세계 대전의 시작
  summary:
    ko: "1914년 6월 28일 보스니아의 사라예보에서 오스트리아-헝가리의 황위 계승자 프란츠 페르디난트 부부가 보스니아 출신의 세르비아계 민족주의 청년 프린치프(청년 보스니아 단원)에게 암살되었다. 독일의 지지를 얻은 오스트리아-헝가리는 세르비아에 최후통첩을 보낸 뒤 선전 포고했고(7월 28일), 러시아가 총동원령을 내리자 독일이 러시아(8월 1일)와 프랑스(8월 3일)에 선전 포고했다. 독일이 프랑스를 치려고 중립국 벨기에를 침공하자 영국도 독일에 선전 포고해(8월 4일) 삼국 협상과 동맹국 사이의 세계 대전이 되었다. 삼국 동맹의 이탈리아는 처음에 중립을 지켰다. 일본은 영일 동맹을 내세워 독일에 선전 포고하고(8월 23일) 산둥반도의 칭다오와 적도 북쪽의 독일령 태평양 섬들을 차지했다."
  subjects: [austria-hungary, serbia, russia, german-empire, france, uk, belgium, japan]
