- id: kiel-1814
  year: 1814
  title:
    ko: 킬 조약과 스웨덴-노르웨이 연합
  summary:
    ko: "덴마크-노르웨이는 1807년 영국이 코펜하겐을 포격하고 함대를 빼앗아 간 뒤 나폴레옹 편에 섰다. 스웨덴은 러시아와의 전쟁(1808~1809)에 져 프레드릭스함 조약으로 핀란드를 러시아에 넘겼고, 프랑스 원수 베르나도트를 왕위 계승자로 맞아(1810) 나폴레옹에 맞선 동맹에 들어갔다. 나폴레옹이 라이프치히에서 진 뒤 스웨덴군에 밀린 덴마크는 1814년 1월 킬 조약으로 노르웨이를 스웨덴 왕에게 넘겼다(아이슬란드·그린란드·페로 제도는 덴마크에 남음). 그러자 노르웨이인들은 5월 17일 에이츠볼에서 헌법을 만들고 독립을 선언했으나, 여름의 짧은 전쟁 끝에 모스 협약을 맺고 11월 헌법과 의회를 지닌 채 스웨덴 왕을 함께 섬기는 연합 왕국이 되었다. 외교는 스웨덴이 맡았다(연합은 1905년 노르웨이의 독립으로 끝남)."
  subjects: [denmark-norway, sweden-kingdom, sweden-norway, uk, russia]
  links:
