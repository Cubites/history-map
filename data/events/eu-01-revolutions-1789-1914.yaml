- id: triple-alliance-1882
  year: 1882
  endYear: 1890
  title:
    ko: 비스마르크 체제와 삼국 동맹
  summary:
    ko: "비스마르크는 프랑스를 외교적으로 고립시키려 동맹망을 짰다. 독일·오스트리아-헝가리·러시아의 삼제 동맹(1873, 1881)과 독일-오스트리아 동맹(1879)에 이어, 프랑스의 튀니지 점령(1881)에 반발한 이탈리아를 끌어들여 독일·오스트리아-헝가리·이탈리아의 삼국 동맹을 맺었다(1882). 발칸 문제로 삼제 동맹이 흔들리자 러시아와 비밀리에 재보장 조약(1887)을 맺었다. 그러나 1888년 즉위한 빌헬름 2세는 비스마르크를 물러나게 하고(1890) 재보장 조약을 갱신하지 않았으며, '세계 정책'을 내세워 해군을 키우고 해외 팽창에 나섰다."
  subjects: [german-empire, austria-hungary, italy, russia, france]
  links:
