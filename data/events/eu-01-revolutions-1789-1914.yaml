- id: austerlitz-1805
  year: 1805
  endYear: 1806
  title:
    ko: 트라팔가르 해전과 아우스터리츠 전투
  summary:
    ko: "나폴레옹이 1805년 3월 이탈리아 공화국(옛 치살피나 공화국)을 왕국으로 바꿔 5월 밀라노에서 이탈리아 왕으로 즉위하고 6월 리구리아 공화국을 프랑스에 합치자, 4월 동맹을 맺은 영국·러시아에 오스트리아가 8월 가담해 제3차 대프랑스 동맹이 이루어졌다. 나폴레옹은 영국 상륙을 준비했으나, 넬슨이 이끄는 영국 함대가 트라팔가르에서 프랑스·에스파냐 연합 함대를 무찔렀다(1805년 10월). 대륙에서는 나폴레옹이 아우스터리츠에서 오스트리아·러시아 연합군을 크게 이겼고(12월, 세 황제의 전투), 오스트리아는 프레스부르크 조약으로 베네치아와 티롤 등을 내주었다. 이듬해 나폴레옹이 서·남독일 나라들을 묶어 라인 동맹을 만들자 1804년부터 오스트리아 황제를 겸하던 프란츠 2세가 신성 로마 황제 자리를 내려놓아 신성 로마 제국이 끝났다(1806)."
