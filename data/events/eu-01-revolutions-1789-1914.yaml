- id: entente-cordiale-1904
  year: 1904
  endYear: 1911
  title:
    ko: 영국-프랑스 협상과 모로코 위기
  summary:
    ko: "독일의 해군 확장과 세계 정책에 위협을 느낀 영국은 '영광스러운 고립'을 버리고 일본과 동맹을 맺은 데 이어(1902), 러일 전쟁이 시작된 직후 프랑스와 협상을 맺었다(1904년 4월). 이집트는 영국, 모로코는 프랑스의 세력권으로 서로 인정해 식민지 다툼을 끝냈다. 일본의 동맹국 영국과 러시아의 동맹국 프랑스가 러일 전쟁에 휘말리지 않으려는 뜻도 있었다. 독일은 빌헬름 2세의 탕헤르 방문(1905)과 아가디르 군함 파견(1911)으로 모로코 문제에 끼어들었으나, 알헤시라스 회의(1906)에서 영국이 프랑스를 지지하는 등 오히려 영불 협력만 굳어졌고 모로코는 프랑스의 보호국이 되었다(1912)."
