- id: congress-of-berlin-1878
  year: 1878
  title:
    ko: 베를린 회의
  summary:
    ko: "독일 재상 비스마르크가 '정직한 중개인'을 자처하며 베를린에서 열강 회의를 열어(1878년 6~7월) 산스테파노 조약을 고쳤다. 루마니아·세르비아·몬테네그로의 독립은 인정되었으나, 불가리아는 크게 줄어 오스만 아래의 자치 공국이 되고 남쪽은 동루멜리아 자치주로 나뉘었다. 오스트리아-헝가리는 보스니아 헤르체고비나를 점령·통치할 권리를 얻었고, 영국은 따로 오스만과 협정을 맺어 키프로스 관리권을 얻었다. 남하가 막힌 러시아는 독일에 불만을 품었고, 이후 중앙아시아와 동아시아 쪽으로 진출을 강화했다. 이는 거문도 사건(1885)과 러일 대립 같은 한반도 정세에도 영향을 준 것으로 본다."
  subjects: [german-empire, russia, uk, austria-hungary, ottoman, bulgaria, bosnia-occupied, eastern-rumelia, cyprus-british]
