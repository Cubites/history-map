- id: russian-revolution-1905
  year: 1905
  endYear: 1906
  title:
    ko: 발트 함대의 원정과 1905년 러시아 혁명
  summary:
    ko: "러일 전쟁에서 뤼순의 태평양 함대가 묶이자 러시아는 발트 함대를 극동으로 보냈다(1904년 10월). 함대는 출항 직후 북해 도거 뱅크에서 영국 어선을 일본 어뢰정으로 잘못 알고 포격해 영국과 전쟁 위기를 빚었고(국제 조사 위원회를 거쳐 러시아가 배상), 아프리카를 돌아 프랑스령 마다가스카르 등에서 쉬며 7개월 넘게 항해한 끝에 쓰시마 해전(1905년 5월)에서 거의 전멸했다. 그사이 상트페테르부르크에서 평화 행진에 군대가 발포한 '피의 일요일' 사건(1905년 1월)이 일어나 전국에 파업과 농민 봉기, 전함 포톰킨호의 반란이 번졌다. 니콜라이 2세는 미국의 중재로 포츠머스 조약을 맺어 전쟁을 끝내고(9월), 10월 선언으로 국회(두마) 개설과 시민의 자유를 약속했다. 그러나 곧 두마를 해산하며 전제 정치로 돌아갔고, 스톨리핀은 농촌 공동체를 해체하는 토지 개혁을 추진했다(1906~). 입헌국 일본이 유럽 강대국을 이긴 이 전쟁은 아시아의 민족 운동을 자극했다. 그러나 이긴 일본은 곧 한국을 보호국으로 만들었다(을사늑약, 1905)."
