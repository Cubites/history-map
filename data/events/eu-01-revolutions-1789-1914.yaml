- id: china-scramble-1898
  year: 1898
  endYear: 1899
  title:
    ko: 열강의 중국 분할
  summary:
    ko: "청일 전쟁으로 청의 약함이 드러나자 열강은 항구를 빌리고 세력 범위를 나눴다. 독일은 선교사 살해를 구실로 산둥반도의 자오저우만(칭다오)을 99년간 조차했고(1898), 러시아는 삼국 간섭으로 일본이 돌려준 랴오둥반도의 뤼순·다롄을 25년간 빌렸다. 영국은 웨이하이웨이와 주룽반도 북쪽(신계)을, 프랑스는 광저우만을 조차했다. 뒤늦은 미국은 문호 개방을 요구했다(1899). 러시아의 뤼순 조차는 일본의 강한 반발을 샀다. 같은 해 대한 제국에서는 독립 협회가 러시아의 절영도 조차 요구를 막았고, 러시아는 한국에서 군사·재정 고문을 거둬들이고 일본과 로젠-니시 협정(1898)을 맺어 한국에서 일본의 상공업 활동을 인정했다."
