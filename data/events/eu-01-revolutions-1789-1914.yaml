  title:
    ko: 발칸 전쟁
  summary:
    ko: "이탈리아-튀르크 전쟁(1911~1912)으로 오스만 제국이 리비아와 도데카니사 제도를 잃고 약해지자, 러시아의 후원으로 세르비아·불가리아·그리스·몬테네그로가 발칸 동맹을 맺고 오스만을 공격했다(1차 발칸 전쟁, 1912년 10월). 오스만은 쿠마노보 등에서 지고 아드리아노플(에디르네)까지 빼앗겨, 런던 조약(1913년 5월)으로 이스탄불 부근을 뺀 유럽 쪽 땅 대부분과 크레타섬을 내주었다(크레타는 그해 12월 그리스에 합쳐짐). 오스트리아-헝가리와 이탈리아의 주장으로 알바니아가 독립국이 되어(1912년 선언) 세르비아의 아드리아해 진출이 막혔다. 마케도니아를 두고 불가리아가 옛 동맹국을 공격했으나 루마니아와 오스만까지 가세한 2차 발칸 전쟁(1913년 6~8월)에서 져 부쿠레슈티 조약으로 땅을 잃었고, 오스만은 에디르네를 되찾았다. 커진 세르비아와 오스트리아-헝가리의 갈등, 복수를 노리는 불가리아의 독일 쪽 접근으로 발칸은 '유럽의 화약고'가 되었다."
