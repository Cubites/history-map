# ── 크림 전쟁과 통일 전쟁, 동아시아 진출 (1853 ~ 1871) ─

- id: crimean-war-1853
  year: 1853
  endYear: 1856
  title:
    ko: 크림 전쟁
  summary:
    ko: "예루살렘 성지의 관리권과 오스만 제국 안 정교도 보호를 구실로 러시아가 도나우강 하류의 몰다비아·왈라키아 공국을 점령하자 오스만 제국이 선전 포고했다(1853). 러시아의 남하를 막으려 영국과 프랑스가 오스만 편에 섰고, 사르데냐도 뒤에 참전했다(1855). 연합군은 크림반도의 세바스토폴 요새를 1년 가까이 포위한 끝에 함락했다(1855). 영국 간호사 나이팅게일은 야전 병원의 위생을 개선해 근대 간호의 기틀을 세웠다. 태평양에서도 영국·프랑스 함대가 캄차카반도의 페트로파블롭스크를 공격했다(1854). 파리 조약(1856)으로 흑해가 중립화되어 러시아의 남하가 막혔다. 두 공국은 러시아의 보호에서 벗어나 열강의 공동 보장 아래 놓였고, 1859년 같은 군주(쿠자)를 뽑아 하나로 합쳐 루마니아의 바탕이 되었다. 패전한 러시아는 농노 해방 등 개혁에 나섰다."
