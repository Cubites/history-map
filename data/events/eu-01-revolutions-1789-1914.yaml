- id: corn-laws-1846
  year: 1846
  endYear: 1849
  title:
    ko: 곡물법 폐지와 자유 무역
  summary:
    ko: "지주를 보호하려고 외국 곡물 수입을 막던 곡물법에 맞서 맨체스터의 코브던과 브라이트가 반곡물법 동맹(1838)을 만들어 값싼 식량과 자유 무역을 주장했다. 아일랜드에서 감자 역병으로 대기근이 일어나자(1845~) 보수당의 필 총리가 곡물법을 폐지했다(1846). 이어 항해법도 폐지되어(1849) 영국은 자유 무역 체제로 나아갔다. 대기근으로 아일랜드에서는 많은 사람이 굶어 죽거나 미국 등지로 떠났고, 영국 지배에 대한 반감이 깊어졌다."
  subjects: [uk]
  tags: [economy, politics]
  sources: ["「곡물법 폐지법(Importation Act 1846)」", "「1849년 항해법 폐지법」"]

- id: february-revolution-1848
  year: 1848
  endYear: 1852
  title:
    ko: 2월 혁명과 제2제정
  summary:
    ko: "선거권 확대를 요구하는 개혁 연회를 정부가 막자 파리 시민이 봉기해 루이 필리프를 몰아내고 제2공화정을 세웠다(1848년 2월). 임시 정부는 남성 보통 선거를 실시하고 실업자를 위한 국립 작업장을 열었으나, 국립 작업장을 닫자 노동자들이 일으킨 6월 봉기는 군대에 진압되었다. 12월 대통령 선거에서 나폴레옹의 조카 루이 나폴레옹이 당선되었고, 그는 쿠데타(1851년 12월)와 국민 투표를 거쳐 황제 나폴레옹 3세가 되었다(1852, 제2제정). 제2제정은 철도와 은행을 키우고 파리를 새로 꾸몄으며, 크림 전쟁·이탈리아 통일 전쟁에 나서고 인도차이나로 진출하는 등 대외 팽창을 꾀했다. 프랑스 함대의 강화도 침공(병인양요, 1866)도 이 시기의 일이다."
  subjects: [france]
  tags: [politics]
  sources: ["「1848년 프랑스 헌법」", "「1852년 프랑스 헌법」", "마르크스, 『루이 보나파르트의 브뤼메르 18일』"]

- id: march-revolutions-1848
  year: 1848
  endYear: 1849
  title:
    ko: 3월 혁명과 프랑크푸르트 국민 의회
  summary:
    ko: "2월 혁명의 소식이 퍼지자 빈에서 봉기가 일어나 메테르니히가 물러났고(3월), 베를린에서도 시가전 끝에 프로이센 왕이 헌법 제정을 약속했다. 독일 각국 대표가 모인 프랑크푸르트 국민 의회는 통일과 헌법을 논의하며 오스트리아를 넣을지(대독일주의) 뺄지(소독일주의)를 두고 갈렸다. 결국 소독일주의 헌법을 만들어 프로이센 왕을 황제로 추대했으나 프리드리히 빌헬름 4세가 거절해 실패했다(1849). 헝가리는 코슈트를 중심으로 독립을 선언했으나 러시아군의 도움을 받은 오스트리아에 진압되었고, 이탈리아와 보헤미아의 민족 운동도 꺾였다. 같은 해(1848) 마르크스와 엥겔스는 『공산당 선언』을 펴냈다. 혁명은 실패했으나 빈 체제는 무너졌다."
  subjects: [austria, prussia, german-states, russia, france]
