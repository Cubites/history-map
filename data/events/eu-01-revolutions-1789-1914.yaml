- id: primorye-1860
  year: 1858
  endYear: 1860
  title:
    ko: 러시아의 연해주 획득
  summary:
    ko: "동시베리아 총독 무라비요프가 이끄는 러시아는 청이 영국·프랑스와 싸우는 틈을 타 아이훈 조약(1858)으로 헤이룽강(아무르강) 북쪽을 얻었다. 이어 영국·프랑스와 청의 강화를 중재한 대가로 베이징 조약(1860년 11월, 청·러시아)을 맺어 우수리강 동쪽 땅(연해주)까지 차지했다. 러시아는 그해 블라디보스토크('동방을 지배하라')를 세워 태평양으로 나아갈 항구를 마련했다. 이로써 러시아는 두만강 하류에서 조선과 국경을 맞대게 되었고, 1860년대부터 함경도 농민들이 강을 건너 연해주로 옮겨 가 한인 마을이 생겼다. 두만강 하구의 녹둔도도 이때 러시아 쪽에 들어갔다(조약문에 이름은 없고, 조선은 1880년대에야 이를 알고 반환을 요구했다)."
