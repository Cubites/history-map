- id: continental-system-1806
  year: 1806
  endYear: 1807
  title:
    ko: 대륙 봉쇄령과 틸지트 조약
  summary:
    ko: "나폴레옹은 예나·아우어슈테트 전투에서 프로이센군을 무너뜨리고 베를린에 들어가(1806년 10월), 유럽 대륙과 영국의 무역을 막는 베를린 칙령(대륙 봉쇄령)을 내렸다. 프리틀란트에서 러시아군도 이긴 뒤 틸지트 조약(1807)을 맺어 프로이센의 땅을 절반 가까이 빼앗고 옛 폴란드 땅에 바르샤바 공국을 세웠으며, 러시아는 대륙 봉쇄에 참여하기로 했다. 그러나 영국과의 무역이 막혀 대륙의 경제가 어려워졌다. 패전한 프로이센에서는 슈타인과 하르덴베르크가 농노 해방(1807년 10월 칙령)과 행정·군제 개혁에 나섰고, 피히테는 「독일 국민에게 고함」 강연으로 국민 의식을 일깨웠다."
  subjects: [france, prussia, russia, uk, duchy-of-warsaw]
