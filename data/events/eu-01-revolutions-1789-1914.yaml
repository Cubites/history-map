- id: scramble-for-africa-1884
  year: 1884
  endYear: 1902
  title:
    ko: 아프리카 분할과 베를린 서아프리카 회의
  summary:
    ko: "수에즈 운하가 열린 뒤(1869) 영국은 운하 회사 주식을 사들이고(1875) 이집트를 점령했다(1882). 아프리카를 두고 열강의 경쟁이 치열해지자 비스마르크가 베를린에서 회의를 열어(1884~1885), 실제로 점령한 나라가 영유권을 갖는다는 원칙을 정하고 콩고를 벨기에 왕 레오폴드 2세의 개인 소유(콩고 자유국)로 인정했다(벨기에가 나라로 병합한 것은 1908년). 이후 20여 년 사이에 에티오피아와 라이베리아를 뺀 아프리카 거의 전부가 유럽 열강의 식민지가 되었다. 에티오피아는 아도와 전투(1896)에서 이탈리아를 물리쳐 독립을 지켰다. 카이로와 케이프타운을 잇는 영국의 종단 정책과 서아프리카에서 동쪽으로 뻗는 프랑스의 횡단 정책은 수단의 파쇼다에서 부딪쳤으나(1898) 프랑스가 물러났다. 독일도 1884년부터 서남아프리카·카메룬·동아프리카 등에 식민지를 얻었고, 영국은 남아프리카 전쟁(1899~1902)으로 보어인 나라들을 병합했다."
  subjects: [uk, france, german-empire]
  links:
    - { from: uk, to: france, note: "파쇼다 사건 (1898)" }
  tags: [diplomacy, politics]
  sources: ["「베를린 회의 일반 의정서」(1885)", "E. J. 홉스봄, 『제국의 시대』"]

- id: great-game-1885
  year: 1885
  endYear: 1887
  title:
    ko: 그레이트 게임과 판데 사건
  summary:
    ko: "19세기 영국과 러시아는 중앙아시아에서 세력을 다퉜다(그레이트 게임). 러시아가 타슈켄트(1865)를 점령하고 부하라(1868)·히바(1873)를 보호국으로, 코칸트(1876)를 병합하며 남쪽으로 내려오자, 인도를 지키려는 영국은 2차 아프가니스탄 전쟁(1878~1880)으로 아프가니스탄의 외교권을 쥐었다. 1885년 3월 러시아군이 아프가니스탄과 영유를 다투던 판데(지금 투르크메니스탄)에서 아프간군을 몰아내자 두 나라는 전쟁 직전까지 갔다. 이때 영국은 블라디보스토크의 러시아 함대를 견제할 기지로 조선의 거문도를 점령했다(거문도 사건, 1885~1887). 위기는 러시아가 판데를 갖는 선에서 국경 의정서(1887)로 가라앉았으나, 영국과 러시아의 대립은 동아시아로 이어졌다."
  subjects: [uk, russia]
  links:
