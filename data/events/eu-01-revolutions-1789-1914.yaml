- id: irish-union-1798
  year: 1798
  endYear: 1801
  title:
    ko: 아일랜드 연합파 봉기와 연합법
  summary:
    ko: "아일랜드는 잉글랜드(1707년부터 그레이트브리튼) 왕이 왕을 겸하고 더블린에 따로 의회를 둔 왕국이었으나, 인구 대부분인 가톨릭교도는 의원이 될 수 없었고(투표권은 1793년부터) 땅과 권력은 영국 국교회 신자 지주들이 쥐었다. 프랑스 혁명의 영향으로 1791년 신교도 울프 톤 등이 종교를 가리지 않는 의회 개혁과 독립을 내건 아일랜드 연합파를 만들었고, 1798년 5월 봉기를 일으켰다. 8월에는 프랑스군 1천여 명이 서부 킬랄라만에 상륙해 도왔으나 9월 항복했고, 봉기는 진압되었다. 정부군과 민병대는 봉기 지역에서 포로와 주민을 처형하고 고문했으며, 봉기군도 웩스퍼드의 스컬러보그 등에서 신교도 포로들을 죽여, 사망자는 1만~5만 명으로 추산된다(더 낮게 보는 연구도 있다). 영국의 피트 총리는 아일랜드를 직접 묶어 두려고 두 의회가 각각 연합법(1800)을 통과시키게 했고, 1801년 1월 1일 그레이트브리튼과 아일랜드는 연합 왕국이 되어 아일랜드 의원은 런던 의회에 나가게 되었다. 피트가 약속한 가톨릭교도 해방은 국왕 조지 3세의 반대로 미뤄졌다가 1829년에야 이루어졌다."
