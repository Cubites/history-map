- id: napoleonic-satellites-1807
  year: 1807
  endYear: 1812
  title:
    ko: 나폴레옹의 대륙 지배와 위성국
  summary:
    ko: "틸지트 조약(1807) 무렵 나폴레옹의 유럽 지배 체제가 완성되었다. 나폴레옹은 정복한 땅을 프랑스에 합치거나 가족과 장군에게 나라를 주어 다스리게 했다. 앞서 1805년에는 이탈리아 공화국(옛 치살피나 공화국)을 이탈리아 왕국으로 바꿔 스스로 왕이 되고 의붓아들 외젠을 부왕으로 두었으며, 리구리아 공화국을 프랑스에 합치고 누이 엘리자에게 루카·피옴비노 공국을 주었다. 1806년에는 부르봉 왕가를 시칠리아로 몰아내고 형 조제프를 나폴리 왕으로(1808년부터는 매제 뮈라), 동생 루이를 홀란트 왕으로 세웠고, 바이에른·뷔르템베르크 등 서·남독일 16개국으로 자신을 보호자로 하는 라인 동맹을 만들었다. 함부르크·브레멘·뤼베크 같은 한자 도시들은 11월 프랑스군에 점령되었다. 1807년 틸지트 조약으로는 프로이센이 분할로 얻은 폴란드 땅에 바르샤바 공국(작센 왕이 공작을 겸함)을, 단치히에 자유시를 세우고, 막내 동생 제롬에게 베스트팔렌 왕국을 주어 라인 동맹에 넣었다. 이오니아 제도의 셉틴슐라 공화국도 이때 프랑스에 넘어갔다. 같은 해 10월 에트루리아 왕국을 없애고(1808년 병합), 1808년 라구사 공화국을 폐지하고 파르마를 프랑스에 합쳤다. 대륙 봉쇄를 지키지 않은 동생 루이가 물러난 1810년에는 홀란트 왕국과 한자 도시들까지 합쳐, 프랑스 제국은 1811년 130개 도(데파르트망)로 가장 넓어졌다. 위성국에는 프랑스 민법전과 봉건적 특권 폐지가 퍼져 근대적 개혁이 이루어졌으나, 무거운 세금과 징병, 대륙 봉쇄로 인한 경제난이 커지면서 프랑스 지배에 맞서는 민족주의도 자라났다. 위성국 대부분은 나폴레옹이 몰락한 1813~1814년 무너졌고, 나폴리의 뮈라는 1815년 오스트리아에 져 쫓겨났다."
  subjects: [france, italy-napoleonic, naples-napoleonic, kingdom-of-holland, confederation-of-the-rhine, hanseatic-cities, duchy-of-warsaw, danzig, septinsular-republic, etruria, ragusa, parma-modena-lucca, prussia]
