- id: german-empire-1871
  year: 1871
  endYear: 1890
  title:
    ko: 독일 제국 선포와 비스마르크의 내정
  summary:
    ko: "1871년 1월 18일 베르사유 궁전 거울의 방에서 프로이센 왕 빌헬름 1세가 독일 황제로 즉위해 독일 제국이 세워졌다. 프랑크푸르트 조약(1871년 5월)으로 프랑스는 알자스와 로렌 일부를 넘기고 배상금 50억 프랑을 물었으며, 이 일은 프랑스의 복수심을 키웠다. 재상 비스마르크는 가톨릭 세력을 누르는 문화 투쟁을 벌이고 사회주의자 탄압법(1878)으로 사회 민주당을 억누르는 한편, 노동자를 끌어안으려 질병·재해·노령 보험(1883~1889)을 처음으로 만들었다. 제국 의회는 남성 보통 선거로 뽑았으나 실권은 황제와 재상에게 있었다. 독일은 1883년 조선과 수호 통상 조약을 맺었다."
  subjects: [german-empire, france, prussia]
  links:
    - { from: german-empire, to: france, note: "알자스-로렌 할양, 배상금 50억 프랑" }
  tags: [politics, diplomacy]
  sources: ["「프랑크푸르트 조약」(1871)", "「독일 제국 헌법」(1871)", "「사회주의자 탄압법」(1878)"]

- id: paris-commune-1871
  year: 1871
  title:
    ko: 파리 코뮌
  summary:
    ko: "패전과 굴욕적인 강화에 반발한 파리의 노동자와 국민 방위대가 정부군의 대포 회수에 맞서 봉기해(1871년 3월 18일) 자치 정부인 파리 코뮌을 세웠다. 코뮌은 선거로 뽑힌 평의회가 다스리며 정교 분리 등의 정책을 폈으나, 베르사유로 옮긴 티에르 정부의 군대가 파리에 들어와 '피의 주간'(5월 21~28일)에 진압했다. 수많은 시민이 죽거나 처형·유배되었다. 이후 제3공화정에서는 공화파가 왕당파를 누르고 1875년 헌법으로 공화정을 굳혔다."
