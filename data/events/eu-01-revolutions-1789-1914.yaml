    - { from: italy, to: france, note: "9월 협약, 수도 피렌체 이전 (1864~1865)" }
  tags: [politics]
  sources: ["「이탈리아 왕국 선포법」(1861)", "「9월 협약」(1864)", "크리스토퍼 듀건, 『미완의 통일 이탈리아사』(개마고원, 2001)"]

- id: ionian-union-1864
  year: 1862
  endYear: 1864
  title:
    ko: 그리스의 왕조 교체와 이오니아 제도의 통합
  summary:
    ko: "1815년부터 영국의 보호를 받아 온 이오니아 제도에서는 그리스와의 통합(에노시스)을 바라는 목소리가 컸다. 섬 의회는 1850년 통합을 결의했고, 1858~1859년 영국에서 특사로 온 글래드스턴이 개혁안을 내놓았으나 섬 의회는 이를 받아들이지 않고 통합을 요구했다. 그리스에서는 1862년 10월 군대의 봉기로 오톤 왕이 쫓겨나고, 이듬해 국민 의회가 덴마크 왕자를 왕(요르요스 1세)으로 맞았다. 영국은 새 왕을 뒷받침하려 섬들을 넘기기로 하고, 1864년 3월 영국·프랑스·러시아·그리스가 런던 조약을 맺었다. 5월 영국 고등 판무관의 포고로 이오니아 제도는 그리스에 합쳐졌다(6월 2일 인도). 독립 뒤 그리스가 처음으로 넓힌 땅이었다."
  subjects: [ionian-islands, greece, uk]
  links:
    - { from: uk, to: greece, note: "런던 조약으로 이오니아 제도 양도 (1864)" }
    - { from: ionian-islands, to: greece, note: "그리스와 통합 (1864.5~6)" }
  tags: [diplomacy, politics]
  sources: ["「런던 조약」(1864)", "Richard Clogg, A Concise History of Greece"]

- id: prussia-wars-1864
  year: 1864
  endYear: 1867
  title:
    ko: 비스마르크와 프로이센-오스트리아 전쟁
  summary:
    ko: "프로이센 총리 비스마르크는 독일 통일 문제는 연설과 다수결이 아니라 철과 피로 해결된다며(철혈 연설, 1862) 의회의 반대를 누르고 군비를 늘렸다. 먼저 오스트리아와 함께 덴마크와 싸워 슐레스비히·홀슈타인을 빼앗았고(1864), 그 관리 문제로 오스트리아와 전쟁을 벌였다(1866). 프로이센군은 철도와 신식 소총을 활용해 쾨니히그레츠(사도바) 전투에서 이겨 7주 만에 전쟁을 끝냈다. 프라하 조약으로 독일 연방이 해체되고, 프로이센은 하노버 등을 합병해 마인강 북쪽 나라들과 북독일 연방을 만들었다. 프로이센 편에 선 이탈리아는 베네치아를 얻었다. 독일에서 밀려난 오스트리아는 헝가리와 타협해 오스트리아-헝가리 이중 제국이 되었다(1867)."
  subjects: [prussia, austria, denmark, german-states, italy, north-german-confederation]
  links:
