- id: july-revolution-1830
  year: 1830
  endYear: 1831
  title:
    ko: 7월 혁명과 벨기에 독립
  summary:
    ko: "복고 왕정의 샤를 10세가 의회를 해산하고 언론을 묶는 칙령을 내리자 파리 시민이 사흘 동안 시가전을 벌여 왕을 몰아냈다(1830년 7월, 영광의 3일). 자유주의 성향의 루이 필리프가 왕이 되어 7월 왕정이 들어섰으나, 선거권은 부유한 사람에게만 주어졌다. 혁명의 영향으로 네덜란드 연합 왕국의 남부가 봉기해 벨기에가 독립했고(1830, 1839년 런던 조약으로 영세 중립 보장), 러시아가 다스리던 폴란드(11월 봉기)와 이탈리아 여러 곳에서도 봉기가 일어났으나 진압되었다."
  subjects: [france, netherlands, belgium, russia]
  links:
    - { from: france, to: belgium, note: "7월 혁명의 영향, 독립 봉기" }
    - { from: belgium, to: netherlands, note: "남부의 분리 독립" }
    - { from: france, to: russia, note: "혁명의 영향 (폴란드 11월 봉기)" }
  tags: [politics]
  sources: ["「7월 칙령」(1830)", "「런던 조약」(1839)"]

- id: reform-act-1832
  year: 1832
  endYear: 1833
  title:
    ko: 영국의 1차 선거법 개정
  summary:
    ko: "1832년 선거법 개정으로 인구가 거의 없는데도 의원을 뽑던 부패 선거구를 없애고, 맨체스터 같은 신흥 공업 도시에 의석을 주었으며, 일정한 재산을 가진 중산층으로 선거권을 넓혔다. 노동자는 여전히 선거권을 얻지 못했다. 앞서 심사법 폐지(1828)와 가톨릭교도 해방법(1829)으로 비국교도와 가톨릭교도도 공직에 나갈 수 있게 되었고, 1833년에는 영국 식민지의 노예제를 폐지하는 법이 만들어졌다(이듬해 시행)."
  subjects: [uk]
  tags: [politics]
  sources: ["「1832년 선거법 개정법(Representation of the People Act 1832)」", "「1829년 가톨릭교도 해방법」", "「1833년 노예제 폐지법」"]

- id: chartism-1838
  year: 1838
  endYear: 1848
  title:
    ko: 차티스트 운동
  summary:
    ko: "선거권에서 밀려난 노동자들이 「인민헌장」(1838)을 내걸고 남성 보통 선거, 비밀 투표, 의원의 재산 자격 폐지, 의원 세비 지급, 평등한 선거구, 매년 선거의 여섯 가지를 요구했다. 수백만 명이 서명한 청원을 세 차례(1839·1842·1848) 의회에 냈으나 모두 거부되었다. 운동은 실패했지만 매년 선거를 뺀 요구는 뒤의 선거법 개정과 비밀 투표법(1872) 등으로 대부분 이루어졌다."
  subjects: [uk]
  tags: [politics, society]
  sources: ["「인민헌장(People's Charter)」(1838)"]

- id: opium-war-1840
  year: 1840
  endYear: 1842
  title:
    ko: 아편 전쟁과 난징 조약
  summary:
    ko: "차 수입으로 은이 빠져나가자 영국은 인도산 아편을 청에 몰래 팔았다. 청의 린쩌쉬가 광저우에서 아편을 몰수해 없애자(1839) 영국이 군대를 보내 전쟁이 일어났다. 진 청은 난징 조약(1842)으로 홍콩섬을 넘기고, 광저우·샤먼·푸저우·닝보·상하이 5개 항구를 열고, 공행 무역을 폐지하고 배상금을 물었다. 이듬해 추가 조약으로 영국에 영사 재판권과 최혜국 대우를 주었고, 미국·프랑스와도 비슷한 조약을 맺었다(1844). 서양 세력이 동아시아에 본격적으로 밀려온 계기였다."
  subjects: [uk, qing]
  links:
    - { from: uk, to: qing, note: "아편 전쟁, 난징 조약" }
  tags: [war, diplomacy, economy]
  sources: ["「난징 조약」(1842)", "「후먼 조약」(1843)"]
