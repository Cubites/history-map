    - { from: uk, to: russia, note: "거문도 점령으로 견제" }
  tags: [diplomacy, war]
  sources: ["「영러 아프가니스탄 국경 의정서」(1887)", "『고종실록』 고종 22년", "피터 홉커크, 『그레이트 게임』(사계절, 2008)"]
