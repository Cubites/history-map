- id: franco-russian-alliance-1894
  year: 1891
  endYear: 1894
  title:
    ko: 러시아-프랑스 동맹
  summary:
    ko: "독일이 재보장 조약을 갱신하지 않자(1890) 고립을 걱정한 러시아는 프랑스와 가까워졌다. 프랑스 함대가 크론시타트를 방문하고(1891) 두 나라가 정치 협정을 맺은 데 이어, 독일의 공격에 함께 맞서기로 한 군사 협약(1892)이 1894년 초 발효되었다. 프랑스 자본은 러시아 국채를 사들여 시베리아 횡단 철도 건설 등 러시아의 공업화를 도왔다. 비스마르크가 짠 프랑스 고립 체제가 무너진 것이다. 두 나라는 이듬해 독일과 함께 일본에 랴오둥반도를 청에 돌려주라고 압박했다(삼국 간섭, 1895)."
  subjects: [russia, france, german-empire]
  links:
    - { from: france, to: russia, note: "차관, 군사 협약" }
    - { from: german-empire, to: russia, note: "재보장 조약 갱신 거부 (1890)" }
  tags: [diplomacy, economy]
  sources: ["「러시아-프랑스 군사 협약」(1892)", "George F. Kennan, The Fateful Alliance"]

- id: trans-siberian-1891
  year: 1891
  endYear: 1904
  title:
    ko: 시베리아 횡단 철도
  summary:
    ko: "러시아는 극동 진출을 위해 모스크바와 블라디보스토크를 잇는 철도를 놓기 시작했다(1891, 블라디보스토크 기공식에 황태자 니콜라이 참석). 재무 장관 비테가 프랑스 자본을 끌어들여 공사를 서둘렀다. 러시아는 삼국 간섭 뒤 청과 비밀 조약을 맺어(1896) 만주를 가로지르는 지름길인 동청 철도의 부설권을 얻었고, 하얼빈을 중심으로 철도를 놓아 1903년 운행을 시작했다. 뤼순·다롄을 빌린 뒤(1898)에는 남쪽으로 가는 지선도 놓았다. 바이칼호를 도는 구간이 러일 전쟁 중인 1904년 가을에 이어져(정식 운행은 1905년) 유럽에서 태평양까지 철도가 연결되었다. 철도는 러시아가 만주와 한반도로 세력을 뻗는 발판이 되어 영국과 일본의 경계를 샀고, 러일 전쟁의 한 원인이 되었다. 러시아 땅만 지나는 아무르 구간은 1916년에 완공되었다."
  subjects: [russia, qing, france]
  links:
    - { from: russia, to: qing, note: "동청 철도 부설권 (1896)" }
    - { from: france, to: russia, note: "철도 건설 자금" }
  tags: [economy, diplomacy]
  sources: ["「러청 밀약」(1896)", "Steven G. Marks, Road to Power: The Trans-Siberian Railroad and the Colonization of Asian Russia"]

- id: cretan-state-1898
  year: 1898
  title:
    ko: 그리스-튀르크 전쟁과 크레타 자치국
  summary:
    ko: "오스만 제국의 크레타섬에서는 그리스와의 통합을 바라는 기독교도 주민의 봉기가 되풀이되었다. 1897년 초 봉기가 다시 일어나 기독교도와 무슬림 주민이 서로 마을과 동네를 불태우고 공격하자, 그리스는 2월 군대를 상륙시켜 통합을 선언했다. 영국·프랑스·러시아·이탈리아 등 열강은 국제 함대를 보내 섬을 나눠 맡고 크레타의 자치를 약속하며 그리스군을 물러나게 했다. 이어 4월 그리스와 오스만 사이에 전쟁이 벌어졌으나 그리스군은 도모코스 등에서 져 한 달 만에 휴전했고(30일 전쟁), 강화 조약(1897년 12월)으로 테살리아 국경의 일부를 내주고 배상금을 물며 국제 재정 위원회의 감독을 받게 되었다. 1898년 9월 6일 이라클리오(칸디아)에서는 무슬림 주민 무리와 비정규군이 영국군과 기독교도 주민을 공격해 영국 군인 14명과 부영사 가족, 기독교도 수백 명(추산 500~800명)이 죽었다. 열강은 오스만군의 철수를 요구해 11월 철수를 받아냈고, 12월 그리스 왕자 요르요스를 고등 판무관으로 한 크레타 자치국이 세워졌다. 크레타는 오스만의 종주권 아래 남았고, 많은 무슬림 주민이 섬을 떠났다. 통합 요구는 계속되어 크레타는 1908년 그리스와의 통합을 선언했고 1913년 그리스에 합쳐졌다."
