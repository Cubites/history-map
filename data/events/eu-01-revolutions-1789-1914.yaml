# ── 비스마르크 체제와 제국주의 (1877 ~ 1900) ──────────

- id: russo-turkish-war-1877
  year: 1877
  endYear: 1878
  title:
    ko: 러시아-튀르크 전쟁과 산스테파노 조약
  summary:
    ko: "오스만 제국이 불가리아 봉기를 잔혹하게 진압하자(1876), 범슬라브주의를 내세운 러시아가 오스만에 선전 포고했다(1877). 러시아군은 플레벤 요새를 다섯 달 가까이 포위한 끝에 함락하고 이스탄불 가까이까지 나아갔으며, 루마니아·세르비아·몬테네그로도 러시아 편에서 싸웠다. 산스테파노 조약(1878년 3월)으로 세 나라가 독립하고 에게해까지 닿는 큰 불가리아 자치국이 생기게 되자, 러시아의 지중해 진출을 걱정한 영국과 발칸에 이해가 걸린 오스트리아-헝가리가 강하게 반발했다."
