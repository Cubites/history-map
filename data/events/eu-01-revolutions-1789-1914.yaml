- id: greek-independence-1821
  year: 1821
  endYear: 1830
  title:
    ko: 그리스 독립 전쟁
  summary:
    ko: "오스만 제국의 지배를 받던 그리스인이 독립 전쟁을 일으켰다(1821). 빈 체제는 민족 운동을 막으려 했으나 고대 그리스를 동경한 유럽 여론이 그리스를 도왔고(영국 시인 바이런도 참전했다가 병사), 영국·프랑스·러시아 연합 함대가 나바리노 해전(1827)에서 오스만·이집트 함대를 무찔렀다. 러시아-튀르크 전쟁 뒤 아드리아노플 조약(1829)을 거쳐 런던 의정서(1830)로 그리스의 독립이 국제적으로 인정되었다. 빈 체제가 처음으로 크게 흔들린 사건이었다."
  subjects: [ottoman, uk, france, russia, greece]
  links:
    - { from: uk, to: ottoman, note: "나바리노 해전" }
    - { from: france, to: ottoman, note: "나바리노 해전" }
    - { from: russia, to: ottoman, note: "나바리노 해전, 아드리아노플 조약" }
