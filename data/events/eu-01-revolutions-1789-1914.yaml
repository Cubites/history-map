- id: congress-of-vienna-1814
  year: 1814
  endYear: 1815
  title:
    ko: 빈 회의와 빈 체제
  summary:
    ko: "나폴레옹 전쟁 뒤의 질서를 정하려 유럽 각국 대표가 오스트리아 외무 장관 메테르니히의 주도로 빈에 모였다(1814년 9월~1815년 6월). 혁명 전의 왕조를 되돌리는 정통주의와 강대국 사이의 세력 균형을 원칙으로 삼았고, 프랑스에는 부르봉 왕조(루이 18세)가 돌아왔다. 러시아는 옛 바르샤바 공국 대부분을 폴란드 왕국으로 삼아 황제가 왕을 겸했고, 프로이센은 라인란트와 작센 북부를, 오스트리아는 나폴레옹의 이탈리아 왕국이 있던 롬바르디아와 베네치아를 얻고 토스카나·모데나·파르마 등 중부 이탈리아 공국들에 합스부르크 일가를 앉혔으며, 영국은 몰타와 케이프 식민지 등 바닷길의 요지를 확보했고, 영국·러시아·오스트리아·프로이센이 맺은 1815년 11월 파리 조약으로 이오니아 제도를 보호국으로 삼았다. 네덜란드는 옛 오스트리아령 네덜란드(벨기에)를 합쳐 네덜란드 연합 왕국이 되었고, 그 왕 빌럼 1세는 대공국이 된 룩셈부르크의 대공도 겸했다. 나폴리에는 1815년 뮈라가 쫓겨난 뒤 부르봉 왕가가 돌아왔다. 독일에는 39개 나라가 모인 독일 연방이 생기고, 스위스는 영세 중립국이 되었다. 러시아 황제 알렉산드르 1세가 제창한 신성 동맹과 4국 동맹이 이 질서를 지키며 자유주의·민족주의 운동을 억눌렀다(빈 체제)."
