- id: french-republic-1792
  year: 1792
  endYear: 1795
  title:
    ko: 혁명 전쟁과 제1공화정
  summary:
    ko: "혁명이 번질 것을 걱정한 오스트리아와 프로이센이 혁명에 간섭할 뜻을 밝히자(필니츠 선언, 1791), 프랑스는 1792년 4월 오스트리아에 선전 포고했다. 8월 파리 민중이 튀일리 궁을 습격해 왕권을 정지시켰고, 의용군이 발미에서 프로이센군을 막아 낸 직후 남성 보통 선거로 뽑힌 국민 공회가 왕정을 폐지하고 공화정을 선포했다(9월). 루이 16세가 처형되자(1793년 1월) 영국 등이 제1차 대프랑스 동맹을 맺었다. 로베스피에르가 이끄는 자코뱅파는 공안 위원회를 중심으로 징병제와 최고 가격제를 시행하고 반대파를 대거 처형하는 공포 정치를 폈으나, 테르미도르 반동(1794년 7월)으로 무너졌다. 그사이 혁명군은 벨기에를 점령하고 1795년 1월 네덜란드 공화국에 들어가, 총독 빌럼 5세가 영국으로 달아난 뒤 바타비아 공화국이 세워졌다. 프로이센(4월)과 에스파냐(7월)는 바젤 조약을 맺고 전쟁에서 빠졌다. 1795년 새 헌법에 따라 총재 정부가 들어섰다."
