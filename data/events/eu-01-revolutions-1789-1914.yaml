- id: north-german-confederation-1867
  year: 1867
  title:
    ko: 북독일 연방과 룩셈부르크 위기
  summary:
    ko: "프로이센-오스트리아 전쟁 뒤 프로이센은 1866년 8월 마인강 북쪽 나라들과 동맹 조약을 맺고, 이듬해 2월 남자 보통 선거로 뽑은 제헌 의회에서 헌법을 통과시켜(4월) 7월 1일 22개 나라로 된 북독일 연방을 출범시켰다. 연방의 우두머리는 프로이센 왕 빌헬름 1세, 연방 재상은 비스마르크였고, 각 나라 대표로 이루어진 연방 참의원과 보통 선거로 뽑는 연방 의회(라이히스타크)를 두었다. 마인강 남쪽의 바이에른·뷔르템베르크·바덴·헤센 대공국 남부는 독립을 지켰으나 1866년 프로이센과 비밀 군사 동맹을 맺었고, 관세 동맹 의회(1868)로 경제적으로도 묶였다. 1867년 봄에는 프랑스의 나폴레옹 3세가 네덜란드 왕에게서 룩셈부르크를 사들이려 하자 독일에서 거센 반발이 일어 두 나라가 전쟁 직전까지 갔다(룩셈부르크 위기). 5월 열강이 맺은 런던 조약으로 룩셈부르크는 열강이 함께 보장하는 영세 중립국이 되었고, 그곳에 있던 프로이센 수비대는 물러났으며 요새는 허물기로 했다(네덜란드 왕은 1890년까지 대공을 겸함). 프랑스와 프로이센의 불신은 깊어져 1870년 전쟁으로 이어졌다."
  subjects: [north-german-confederation, south-german-states, prussia, france, luxembourg, netherlands]
  links:
