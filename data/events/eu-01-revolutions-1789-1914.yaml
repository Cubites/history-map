# 유럽 1번 묶음: 혁명과 국민 국가, 제국주의 (1789 ~ 1914)
# 범위: 프랑스·영국·러시아·독일(프로이센 → 독일 제국)을 중심으로, 이 넷과 얽히는 오스트리아·이탈리아·오스만(발칸 전쟁 등은 발칸 나라들)까지.
# 깊이: 고등학교 세계사 교과서 본문 수준에 한국사와 닿는 사건(연해주 획득, 시베리아 횡단 철도, 러일 협약 등)을 더함 (docs/REGION_GUIDE.md §5).
# 서술은 새로 작성. 출처는 조약·법령 원문과 표준 개설서. 운영자 검수 필요.
# 한국사 묶음(06·07번)에 이미 있는 사건은 다시 만들지 않았다: 병인양요(1866), 조영·조독 수교(1883), 거문도 사건(1885),
#   조불 수교(1886), 삼국 간섭(1895), 아관파천(1896), 영일 동맹(1902), 러일 전쟁(1904), 가쓰라-태프트 밀약·포츠머스 조약(1905).
# 아시아 쪽 사건 4개(opium-war-1840, second-opium-war-1856, china-scramble-1898, boxer-1900)는 중국 권역 사건 파일이 생기면 그리로 옮긴다.
# 1차 세계 대전 본편은 다음 묶음(사건 2차)에서 다룬다. 이 파일의 sarajevo-1914는 대전 발발까지.
# 날짜는 양력(그레고리력). 러시아 국내 사건은 필요하면 구력을 함께 적는다.
# 나라 id는 그해에 있는 항목을 쓴다: 1804년 전 합스부르크 군주국 → 오스트리아 제국 → 1867년부터 오스트리아-헝가리,
#   1870년까지 북독일 연방·남독일 국가들 → 1871년부터 독일 제국(프로이센 왕국도 1918년까지 따로 있음), 1860년까지 사르데냐 → 1861년부터 이탈리아.
# 2026-10-05(작업 EV4): 지도에 있으나 사건이 없던 나라·지역 항목을 채우려 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.
# 2026-10-05(작업 EV5): 항목마다 그 나라가 생기고 끝난 내력을 다룬 사건이 있는지 다시 점검해, 빠진 곳에 사건을 더하고 기존 사건의 subjects를 넓힘(서술에 나오는 항목만). 운영자 검수 필요.

# ── 프랑스 혁명과 나폴레옹 (1789 ~ 1815) ──────────────

- id: french-revolution-1789
  year: 1789
  endYear: 1791
  title:
    ko: 프랑스 혁명과 인권 선언
  summary:
    ko: "재정 위기를 풀려고 루이 16세가 175년 만에 삼부회를 열자(1789년 5월), 표결 방식을 두고 맞선 제3신분 대표들이 국민 의회를 세우고 헌법을 만들 때까지 흩어지지 않겠다고 맹세했다(테니스코트의 서약). 왕이 군대를 모으자 파리 민중이 7월 14일 바스티유 감옥을 습격했고, 농민 봉기가 번지는 가운데 국민 의회는 봉건적 특권을 폐지했다(8월 4일). 이어 「인간과 시민의 권리 선언」으로 자유와 평등, 국민 주권, 소유권의 불가침을 밝혔다. 1791년 6월 국왕 일가가 국외로 달아나려다 붙잡히면서(바렌 도주 사건) 왕에 대한 신뢰가 무너진 가운데, 9월 입헌 군주제 헌법이 공포되었다."
  subjects: [france]
  tags: [politics, society]
  sources: ["「인간과 시민의 권리 선언」(1789)", "「1791년 프랑스 헌법」", "조르주 르페브르, 『프랑스 혁명』", "E. J. 홉스봄, 『혁명의 시대』"]

- id: polish-partitions-1791
  year: 1791
  endYear: 1795
  title:
    ko: 5월 3일 헌법과 폴란드 분할
  summary:
    ko: "폴란드-리투아니아 연방은 귀족들이 왕을 뽑고 의회에서 한 사람만 반대해도 결의가 무산되는(자유 거부권) 귀족 공화정이었다. 러시아의 간섭이 심해진 가운데 1772년 러시아·프로이센·오스트리아에 영토의 약 30%(인구의 약 3분의 1)를 빼앗기자(1차 분할), 개혁파는 1791년 5월 3일 자유 거부권을 없애고 선거 왕정을 세습 왕정으로 바꾸며 권력 분립을 담은 헌법을 만들었다. 유럽에서 처음 성문화된 근대 헌법으로 흔히 꼽힌다. 그러나 개혁에 반대하는 귀족들이 타르고비차 연맹을 만들어 러시아군을 불러들였고(1792), 러시아와 프로이센은 1793년 다시 넓은 땅을 나눠 가졌다(2차 분할). 1794년 코시치우슈코가 농민까지 동원해 봉기했으나 러시아·프로이센군에 진압되었고, 1795년 러시아·프로이센·오스트리아가 남은 땅을 모두 나눠 가지면서(3차 분할) 폴란드는 지도에서 사라졌다. 폴란드의 봉토였던 쿠를란트 공국도 같은 해 러시아에 합쳐졌다. 나라를 잃은 폴란드인 일부는 이탈리아에서 프랑스군과 함께 싸우는 폴란드 군단을 만들었고(1797), 나폴레옹이 세운 바르샤바 공국(1807)에 기대를 걸었다."
