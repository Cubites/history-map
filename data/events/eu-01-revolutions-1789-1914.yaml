- id: serbia-principality-1817
  year: 1817
  title:
    ko: 세르비아 봉기와 세르비아 공국의 자치
  summary:
    ko: "오스만 제국의 베오그라드 파샬리크에서는 술탄에게 반기를 든 예니체리 세력(다히예)이 세르비아인 유력자들을 죽이자, 1804년 2월 카라조르제가 이끄는 세르비아인이 봉기했다(1차 봉기). 봉기는 오스만 지배에 맞선 싸움으로 커져 러시아의 지원 속에 한때 베오그라드를 차지했으나, 나폴레옹의 침공을 앞둔 러시아가 부쿠레슈티 조약(1812)으로 오스만과 강화하자 1813년 진압되었다. 1815년 4월 밀로시 오브레노비치가 타코보에서 다시 봉기해(2차 봉기) 오스만 총독과의 협상으로 부분적인 자치를 얻었다. 밀로시는 1817년 돌아온 카라조르제를 자기 명령으로 죽게 한 뒤 그해 11월 세습 공으로 추대되었다. 세르비아는 오스만에 세금을 내고 베오그라드 등에 오스만 수비대를 둔 채 자치를 누렸고, 러시아가 아케르만 협약(1826)과 아드리아노플 조약(1829)으로 오스만을 압박하자 술탄은 1830년 칙령으로 세습 자치 공국을 공식 인정했다. 두 봉기 지도자의 가문(카라조르제비치·오브레노비치)은 이후 1903년까지 번갈아 나라를 다스리며 다투었다. 오스만 수비대는 1867년 물러났고, 세르비아는 베를린 회의(1878)에서 독립을 인정받았다."
  subjects: [serbia, ottoman, russia]
  links:
    - { from: ottoman, to: serbia, note: "세습 자치 공국 인정 (1830 칙령)" }
    - { from: russia, to: ottoman, note: "아케르만 협약·아드리아노플 조약으로 세르비아 자치 요구" }
