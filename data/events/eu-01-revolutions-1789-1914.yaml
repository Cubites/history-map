- id: second-opium-war-1856
  year: 1856
  endYear: 1860
  title:
    ko: 제2차 아편 전쟁과 베이징 조약
  summary:
    ko: "영국은 애로호 사건(1856)을, 프랑스는 선교사 살해를 구실로 연합군을 보내 광저우를 점령하고 톈진 조약(1858)을 맺었다. 청이 비준을 미루자 연합군은 베이징까지 쳐들어가 황제의 별궁인 원명원을 약탈하고 불태웠으며, 함풍제는 열하로 피란했다(1860). 베이징 조약으로 청은 톈진 조약을 비준하고 톈진을 더 열었으며, 주룽반도 남부를 영국에 넘겼다. 이로써 외국 공사의 베이징 상주, 내지 여행과 크리스트교 선교의 자유 등이 시행되었다. 베이징 함락 소식은 조선에도 큰 충격을 주었고, 조선은 열하의 황제에게 문안사를 보냈다(1861, 부사 박규수). 청에서는 이후 서양 기술을 받아들이는 양무운동이 시작되었다."
  subjects: [uk, france, qing, joseon]
  links:
