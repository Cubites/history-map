- id: napoleon-fall-1812
  year: 1812
  endYear: 1815
  title:
    ko: 러시아 원정과 나폴레옹의 몰락
  summary:
    ko: "에스파냐에서 민중의 저항(반도 전쟁)이 이어지는 가운데, 러시아가 대륙 봉쇄를 어기고 영국과 교역하자 나폴레옹은 처음 45만 명, 증원까지 60만 명 안팎의 대군으로 러시아에 쳐들어갔다(1812년 6월). 보로디노 전투 뒤 모스크바에 들어갔으나 도시가 불타고 러시아가 강화에 응하지 않아, 겨울 퇴각 길에 군대 대부분을 잃었다. 러시아·프로이센·오스트리아 등이 다시 동맹을 맺어 라이프치히 전투(1813년 10월, 여러 국민의 전투)에서 이겨 라인 동맹을 무너뜨렸고(바르샤바 공국은 그해 초 러시아군이 차지했다), 1814년 파리를 점령해 나폴레옹을 엘바섬으로 보냈다. 나폴레옹은 1815년 3월 파리로 돌아왔으나(백일천하) 6월 워털루에서 웰링턴의 영국 연합군과 블뤼허의 프로이센군에 져 세인트헬레나섬으로 유배되었다."
