- id: emancipation-1861
  year: 1861
  endYear: 1881
  title:
    ko: 러시아 농노 해방과 알렉산드르 2세의 개혁
  summary:
    ko: "데카브리스트 봉기(1825)를 누른 니콜라이 1세의 전제 정치 아래 뒤처진 러시아는 크림 전쟁에서 졌다. 알렉산드르 2세는 농노 해방령을 내려(1861년 3월, 러시아 구력 2월 19일) 농노에게 인격적 자유를 주었으나, 토지는 값을 치르고 받아야 했고 그 땅도 농촌 공동체(미르)에 묶여 농민의 삶은 크게 나아지지 않았다. 이어 지방 자치 기구 젬스트보 설치와 사법 개혁(1864), 국민 개병제(1874)가 이루어졌다. 폴란드 봉기(1863) 뒤 개혁이 움츠러들자 지식인들은 농민을 깨우치려 농촌으로 들어가는 브나로드('민중 속으로') 운동(1870년대)을 벌였다. 운동이 탄압받자 일부는 테러로 기울었고, 알렉산드르 2세는 '인민의 의지'파에게 암살되었다(1881). 1930년대 한국의 농촌 계몽 운동도 이 이름을 따 브나로드 운동이라 불렸다."
  subjects: [russia]
  tags: [politics, society]
  sources: ["「농노 해방 선언」(1861)", "Geoffrey Hosking, Russia: People and Empire 1552–1917"]

- id: kingdom-of-italy-1861
  year: 1861
  endYear: 1865
  title:
    ko: 이탈리아 왕국의 성립
  summary:
    ko: "1861년 1월 처음 뽑힌 이탈리아 의회가 토리노에 모여 3월 17일 사르데냐 왕 비토리오 에마누엘레 2세를 이탈리아 왕으로 선포했다. 사르데냐의 헌법(알베르토 헌장)과 행정 제도를 새 나라 전체에 넓혔으나 선거권은 인구의 2% 남짓에게만 주어졌고, 통일을 이끈 카보우르는 6월 숨졌다. 남부에서는 무거운 세금과 징병, 북부 중심의 통치에 대한 반발에 쫓겨난 부르봉 왕가 지지 세력이 더해져 무장 저항(산적 전쟁, 1861~1865)이 벌어졌다. 무장 무리는 군인과 주민을 습격했고, 정부군도 1861년 8월 폰텔란돌포 등의 마을을 불태우고 주민을 죽였으며, 정부는 대군을 보내고 피카법(1863)으로 군사 재판을 넓혀 저항을 진압했다. 남부와 북부의 격차(남부 문제)는 이후 이탈리아의 오랜 과제가 되었다. 프랑스군이 지키는 로마의 교황령은 새 나라에 들어오지 않았다. 1864년 9월 이탈리아는 프랑스와 협약을 맺어 로마를 공격하지 않는 대신 프랑스군을 2년 안에 철수시키기로 하고, 그 표시로 이듬해 수도를 토리노에서 피렌체로 옮겼다. 베네치아는 1866년, 로마는 1870년에야 합쳐졌다. 조선은 1884년 이탈리아와 수호 통상 조약을 맺었다."
  subjects: [italy, papal-states, france]
  links:
