- id: napoleon-consulate-1799
  year: 1799
  endYear: 1804
  title:
    ko: 나폴레옹의 집권과 프랑스 민법전
  summary:
    ko: "이탈리아 원정(1796~1797)과 이집트 원정으로 이름을 떨친 나폴레옹 보나파르트가 브뤼메르 18일 쿠데타(1799년 11월)로 총재 정부를 무너뜨리고 제1통령이 되었다. 이어 마렝고(1800년 6월)·호엔린덴(12월) 전투에서 오스트리아군을 물리쳐 뤼네빌 조약(1801)으로 라인강 왼쪽 땅을 확정하고 토스카나 대공국 자리에 에트루리아 왕국을 세우게 했으며, 영국과도 아미앵 화약(1802)을 맺어 잠시 전쟁을 멈추었다. 프랑스 은행을 세우고(1800), 교황과 정교 협약을 맺어(1801) 혁명기의 교회 갈등을 수습했으며, 법 앞의 평등과 사유 재산 보장을 담은 프랑스 민법전(나폴레옹 법전, 1804)을 펴냈다. 1804년 국민 투표를 거쳐 황제 나폴레옹 1세로 즉위해 제1제정을 열었다. 이에 맞서 합스부르크 왕가의 프란츠 2세도 같은 해 8월 오스트리아 황제를 칭했다(오스트리아 제국). 민법전은 정복지에 퍼져 근대 민법의 본보기가 되었다."
  subjects: [france, habsburg-monarchy, tuscany, etruria, austria]
  links:
