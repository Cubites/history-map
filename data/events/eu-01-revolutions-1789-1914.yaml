- id: railway-age-1825
  year: 1825
  endYear: 1833
  title:
    ko: 영국 산업 혁명과 철도 시대
  summary:
    ko: "18세기 후반 영국에서는 방적기·역직기와 와트가 개량한 증기 기관이 면직물 공업에 쓰이면서 공장제 기계 공업이 자리 잡았다. 석탄과 철이 풍부하고, 인클로저로 농촌의 노동력이 도시로 몰렸으며, 넓은 식민지 시장과 쌓인 자본이 바탕이 되었다. 1825년 스톡턴-달링턴 철도에서 스티븐슨의 증기 기관차가 달렸고, 1830년 리버풀-맨체스터 철도가 열리면서 철도 시대가 시작되었다. 맨체스터 같은 공업 도시가 커지고 산업 자본가와 노동자 계급이 생겼으나, 낮은 임금과 긴 노동 시간, 아동 노동, 도시 위생 같은 문제가 커졌다. 기계를 부수는 러다이트 운동(1811~1816)이 일어났고, 아동의 노동 시간을 제한하는 공장법(1833)이 만들어졌다."
  subjects: [uk]
  tags: [economy, society]
  sources: ["「1833년 공장법」", "T. S. 애슈턴, 『산업 혁명 1760~1830』", "E. J. 홉스봄, 『혁명의 시대』"]

- id: greece-kingdom-1830
  year: 1830
  endYear: 1832
  title:
    ko: 그리스 왕국의 성립
  summary:
    ko: "런던 의정서(1830년 2월)로 영국·프랑스·러시아는 그리스를 세 나라가 보호하는 독립국으로 정했다. 국민 의회가 뽑은 초대 총독 카포디스트리아스(1828년 취임)는 중앙 집권 개혁을 밀어붙이다 지방 유력자들과 부딪쳤고, 1831년 10월 나프플리오에서 마니 지방 유력 가문(마브로미칼리스가) 사람들에게 암살되어 나라가 혼란에 빠졌다. 세 보호국은 1832년 5월 런던 조약으로 그리스를 왕국으로 삼고 바이에른 왕자 오톤(오토)을 왕으로 정했으며, 7월 오스만 제국과 맺은 콘스탄티노폴리스 조약으로 아르타-볼로스선을 북쪽 국경으로 확정했다(오스만에는 보상금을 줌). 열일곱 살의 오톤은 1833년 초 나프플리오에 도착해 바이에른 출신 섭정단의 도움을 받아 다스렸고, 수도는 1834년 아테네로 옮겼다. 새 왕국 밖에 더 많은 그리스인이 살았기 때문에, 그리스인이 사는 땅을 모두 되찾자는 '위대한 이상(메갈리 이데아)'이 이후 그리스의 대외 정책을 이끌었다. 1843년 군인과 시민의 봉기로 헌법이 만들어졌고(1844), 오톤은 1862년 쫓겨났다. 한국과는 1961년 수교했다."
  subjects: [greece, ottoman, uk, france, russia]
  links:
