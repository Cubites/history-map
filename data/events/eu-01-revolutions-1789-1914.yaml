- id: bulgarian-unification-1885
  year: 1885
  endYear: 1886
  title:
    ko: 불가리아의 동루멜리아 통합과 세르비아-불가리아 전쟁
  summary:
    ko: "베를린 회의(1878)로 나뉜 불가리아 공국과 오스만 제국의 자치주 동루멜리아에서는 하나가 되자는 운동이 이어졌다. 1885년 9월 18일 동루멜리아의 중심 도시 플로브디프에서 통합을 바라는 세력이 봉기해 총독을 몰아내고 통합을 선포했고, 불가리아 공 알렉산다르(바텐베르크)가 이를 받아들였다. 베를린 회의 때 큰 불가리아를 밀었던 러시아는 자기 뜻을 따르지 않는 공에 반발해 불가리아군의 러시아 장교들을 불러들였다. 세력 균형이 깨질 것을 걱정한 세르비아는 11월 불가리아에 선전 포고했으나 슬리브니차 전투에서 져 오히려 불가리아군에 밀렸고, 오스트리아-헝가리가 불가리아에 진격을 멈추라고 요구해 전쟁이 끝났다. 1886년 3월 부쿠레슈티 조약은 전쟁 전 국경을 그대로 두었고, 4월 오스만과 맺은 톱하네 협정으로 불가리아 공이 동루멜리아 총독을 겸하는 방식으로 통합이 사실상 인정되었다. 알렉산다르 공은 그해 8월 친러시아 장교들의 쿠데타를 겪은 뒤 9월 물러났다."
  subjects: [bulgaria, eastern-rumelia, ottoman, serbia, russia, austria-hungary]
