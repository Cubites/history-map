- id: ausgleich-1867
  year: 1867
  title:
    ko: 오스트리아-헝가리 대타협
  summary:
    ko: "1848년 혁명 때 독립을 꾀하다 이듬해 오스트리아·러시아군에 진압된 헝가리는 그 뒤 빈의 중앙 집권 통치를 받았다. 이탈리아(1859)와 프로이센(1866)에 잇달아 진 오스트리아는 제국을 지키려 헝가리와 손을 잡기로 하고, 헝가리의 데아크 페렌츠와 협상해 1867년 대타협(아우스글라이히)을 맺었다(5월 헝가리 의회 비준). 오스트리아 황제 프란츠 요제프가 6월 부다에서 헝가리 왕으로 즉위해 두 나라가 한 군주를 섬기되, 헝가리는 안드라시를 총리로 한 자기 정부와 의회를 갖고 외교·군사와 그 재정만 공동 부처가 맡는 이중 제국(오스트리아-헝가리)이 되었다. 관세와 분담금 같은 경제 조건은 10년마다 다시 협상했고, 오스트리아 쪽은 12월 헌법으로 기본권과 의회 제도를 갖췄다. 그러나 대타협은 독일인과 마자르인이 나머지 민족을 다스리는 틀이어서, 체코인은 같은 지위를 요구하며 반발했고 크로아티아는 1868년 헝가리와 따로 타협해 제한된 자치를 얻었다. 헝가리 쪽에서는 슬로바키아인·루마니아인·세르비아인 등에 대한 마자르화 정책이 갈등을 키웠다. 조선은 1892년 오스트리아-헝가리와 수호 통상 조약을 맺었다."
  subjects: [austria, austria-hungary]
  tags: [politics]
  sources: ["「헝가리 1867년 법률 제12호(대타협법)」", "「오스트리아 12월 헌법」(1867)", "마틴 래디, 『합스부르크, 세계를 지배하다』(까치, 2022)"]

- id: reform-acts-1867
  year: 1867
  endYear: 1884
  title:
    ko: 영국의 2·3차 선거법 개정과 의회 정치
  summary:
    ko: "보수당 더비 내각의 2차 선거법 개정(1867, 법안은 재무 장관 디즈레일리가 주도)으로 도시 노동자가, 자유당 글래드스턴 내각의 3차 개정(1884)으로 농촌과 광산의 노동자가 선거권을 얻었다. 그 사이 초등 교육법(1870), 노동조합법(1871), 비밀 투표법(1872)이 만들어졌다. 두 정당이 번갈아 집권하는 의회 정치가 자리 잡았고, 빅토리아 여왕 시대(1837~1901)의 영국은 '세계의 공장'이자 가장 큰 식민 제국으로 번영했다. 아일랜드 자치 문제가 큰 쟁점이 되어 글래드스턴이 자치 법안을 냈으나(1886·1893) 통과되지 못했다."
  subjects: [uk]
  tags: [politics]
  sources: ["「1867년 선거법 개정법」", "「1872년 비밀 투표법」", "「1884년 선거법 개정법」"]

- id: franco-prussian-war-1870
  year: 1870
  endYear: 1871
  title:
    ko: 프로이센-프랑스 전쟁
  summary:
    ko: "에스파냐 왕위 계승 문제로 두 나라가 맞선 가운데, 비스마르크가 엠스에서 온 전보를 자극적으로 줄여 발표하자 프랑스가 선전 포고했다(1870년 7월). 남독일 나라들도 프로이센 편에 섰다. 프로이센군은 스당에서 프랑스군을 포위해 나폴레옹 3세를 사로잡았고(9월), 파리에서는 제2제정이 무너지고 공화정(제3공화정)이 선포되었다. 프로이센군은 메스를 함락하고 파리를 넉 달 넘게 포위했으며, 파리는 1871년 1월 항복했다. 이 틈에 이탈리아는 프랑스군이 지키던 로마를 점령했다. 1870년 11월 남독일 네 나라가 북독일 연방과 조약을 맺어 합류했고, 이듬해 1월 18일 베르사유 궁전에서 독일 제국이 선포되었다."
  subjects: [prussia, north-german-confederation, south-german-states, france, german-empire]
  links:
