- id: campo-formio-1797
  year: 1797
  title:
    ko: 나폴레옹의 이탈리아 원정과 캄포포르미오 조약
  summary:
    ko: "총재 정부는 1796년 젊은 장군 나폴레옹 보나파르트에게 이탈리아 방면군을 맡겼다. 나폴레옹은 사르데냐를 휴전으로 물러나게 하고(1796년 4월) 로디·아르콜레·리볼리 등에서 오스트리아군을 잇달아 물리쳐 롬바르디아를 차지했으며, 파르마·모데나와 교황령에서도 돈과 미술품을 거둬들였다. 1797년 4월 오스트리아와 레오벤 예비 조약을 맺은 뒤 5월 베네치아를 점령해 천 년 넘게 이어진 베네치아 공화국을 끝냈고, 6월에는 제노바 공화국을 리구리아 공화국으로 바꾸었다. 롬바르디아에는 밀라노를 수도로 한 치살피나 공화국이 세워졌고(6월), 7월 모데나와 교황령 북부(볼로냐·페라라·로마냐)가 여기에 합쳐졌다. 10월 캄포포르미오 조약으로 오스트리아는 벨기에(오스트리아령 네덜란드)를 프랑스에 넘기고 치살피나 공화국을 인정하는 대신 베네치아와 이스트리아·달마티아를 얻었고, 프랑스는 베네치아령이던 이오니아 제도를 가졌다. 1795년 네덜란드에 세운 바타비아 공화국에 이어 프랑스의 혁명 제도를 본뜬 '자매 공화국'들이 프랑스를 둘러쌌고, 1798년에는 스위스(헬베티아 공화국)와 로마(로마 공화국)에도 세워졌다. 이 원정으로 이름을 떨친 나폴레옹은 1799년 권력을 잡았다."
  subjects: [france, habsburg-monarchy, sardinia, papal-states, venice, genoa, ligurian-republic, cisalpine-republic, parma-modena-lucca, batavian-republic]
