- id: romania-union-1859
  year: 1859
  endYear: 1862
  title:
    ko: 몰다비아·왈라키아의 연합과 루마니아
  summary:
    ko: "크림 전쟁 뒤 파리 조약(1856)으로 러시아의 보호에서 벗어난 몰다비아·왈라키아 공국에서는 두 나라를 합치자는 운동이 커졌다. 프랑스의 나폴레옹 3세는 통합을 지지했으나 오스만 제국과 오스트리아가 반대해, 열강은 파리 협약(1858)으로 두 공국에 따로 공과 의회를 두고 오스만의 종주권 아래 남게 했다. 그러자 두 공국 의회는 1859년 1~2월 같은 사람인 알렉산드루 이오안 쿠자를 차례로 공으로 뽑아 사실상 하나가 되었다. 열강과 오스만이 이를 받아들여, 1862년 2월 5일 두 공국은 부쿠레슈티를 수도로 한 정부와 의회를 합쳐 '루마니아 연합 공국'이 되었다. 쿠자는 수도원 땅을 국유화하고(1863) 농민에게 땅을 나눠 주는 토지 개혁(1864)을 폈으나 독단적인 통치로 반발을 사 1866년 2월 쿠데타로 쫓겨났고, 독일의 호엔촐레른-지크마링겐 가문 출신 카롤(카롤 1세)이 공이 되었다. 같은 해 헌법에서 나라 이름을 루마니아로 정했고, 1878년 베를린 회의에서 독립을 인정받았다. 한국과는 1990년 수교했다."
  subjects: [romania, moldavia, wallachia, ottoman, france]
