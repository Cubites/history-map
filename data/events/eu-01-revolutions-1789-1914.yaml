- id: italian-unification-1859
  year: 1859
  endYear: 1870
  title:
    ko: 이탈리아 통일
  summary:
    ko: "마치니의 청년 이탈리아(1831) 같은 민족 운동이 실패한 뒤, 사르데냐 왕국의 재상 카보우르가 통일을 이끌었다. 그는 프랑스 나폴레옹 3세와 손잡고 오스트리아와 싸워(마젠타·솔페리노 전투, 1859) 롬바르디아를 얻었고, 중부 이탈리아 나라들을 주민 투표로 합쳤으며, 그 대가로 니스와 사부아를 프랑스에 넘겼다(1860). 같은 해 가리발디가 붉은 셔츠대(천인대)를 이끌고 시칠리아와 나폴리를 점령해 사르데냐 왕에게 바쳤고, 1861년 이탈리아 왕국이 세워졌다(국왕 비토리오 에마누엘레 2세). 이탈리아는 프로이센-오스트리아 전쟁 때 프로이센 편에 서서 베네치아를 얻고(1866), 프로이센-프랑스 전쟁으로 프랑스군이 물러나자 로마를 점령해(1870) 통일을 마무리했다. 솔페리노의 참상을 본 스위스인 뒤낭의 호소로 국제 적십자 위원회(1863)가 생겼다."
  subjects: [sardinia, france, austria, two-sicilies, papal-states, italian-duchies, italy]
