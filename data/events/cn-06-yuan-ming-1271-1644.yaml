- id: zhengde-liu-jin-1505
  year: 1505
  endYear: 1521
  title:
    ko: "정덕제와 환관 유근, 영왕 신호의 난(1505~1521)"
  summary:
    ko: "천순제(정통제)가 1464년 죽은 뒤 성화제(재위 1464~1487)가 올랐고, 홍치제(재위 1487~1505) 때는 비교적 안정된 정치가 이어졌고, 만 열세 살의 정덕제(주후조, 재위 1505~1521)가 뒤를 이었다. 어린 황제는 곁에 있던 환관 ‘팔호’ 가운데 유근에게 정무를 맡겼다. 유근은 반대하는 관료를 탄압하고 뇌물을 받으며 권력을 휘둘렀다. 1510년 음력 4월 안화왕 주치번이 유근을 치겠다며 반란을 일으켰으나 곧 진압되었고, 이 일을 계기로 유근의 비행이 드러나 같은 해 유근은 처형되었다. 몰수한 재산이 엄청났다고 전한다. 정덕제는 정무보다 놀이와 순행을 즐겨 황제의 역할을 소홀히 했다고 비판받는다. 변경 순행에 나섰고 1517년에는 몽골군과 맞붙은 응주 전투에 직접 나섰다고 한다. 1519년 음력 6월 장시 난창의 영왕 주신호가 반란을 일으켜 창장강을 따라 난징으로 내려가려 했으나, 왕양명이 한 달 남짓 만에 평정해 주신호를 사로잡았다(「왕양명의 양명학: 용장의 깨달음에서 치양지까지(1508~1529)」(뒤의 사건)). 정덕제는 직접 정벌하겠다며 남쪽으로 내려와 있다가 1521년 음력 3월 아들 없이 죽었다. 정덕제는 환관에 의존하는 정치를 펴면서도 서역 문화에 호기심이 있어 이슬람과 티베트 불교에 관심을 보였다고 한다. 황궁에 ‘표방’이라는 사적 거처를 짓고 연회와 사냥을 즐겼다. 이런 방탕한 이미지는 『명사』 서술의 영향이 크다고 보고, 응주 전투 같은 군사 활동을 재평가하는 연구도 있다. 영왕은 정덕제에게 아들이 없는 점을 노려 자기 아들을 황위 계승자로 세우려 했다고 전한다. 왕양명은 이 반란을 평정한 공이 있었음에도 정덕제의 측근들에게 시기를 받았다. 황실 계승이 흔들리자 황태후와 대신 양정화는 사촌 동생인 흥헌왕의 아들 주후총을 불러 올렸고, 그가 가정제이다(「가정제의 대례의와 엄숭의 전횡(1521~1567)」(뒤의 사건))."
  subjects: [ming]
  tags: [politics]
  sources: ["『명사』 무종본기", "『명사』 환관전 유근", "『명사』 제왕전", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: wang-yangming-1508
  year: 1508
  endYear: 1529
  title:
    ko: "왕양명의 양명학: 용장의 깨달음에서 치양지까지(1508~1529)"
  summary:
    ko: "왕수인(호는 양명, 1472~1529)은 저장성 위야오 출신으로 과거에 급제해 관료가 되었다. 1506년 환관 유근을 비판한 일로 곤장을 맞고 구이저우 용장으로 쫓겨났다. 그곳에서 1508년 ‘마음 밖에서 이치를 구할 필요가 없다’는 깨달음을 얻었다고 한다(용장의 깨달음). 이것이 주희의 격물치지, 곧 사물에 나아가 이치를 궁구하는 공부를 비판하고 마음이 곧 이치라는 심즉리를 내세우는 출발점이 되었다. 그는 아는 것과 행하는 것은 하나라는 지행합일을 가르쳤다. 1519년 영왕 주신호의 반란을 평정하는 등 군사에도 뛰어났고, 이 경험 뒤 1521년부터 사람이 본래 지닌 선악 판단 능력인 양지를 발휘하라는 ‘치양지’를 학문의 중심에 두었다. 강론을 모은 책이 제자들이 엮은 『전습록』이다. 광시의 반란을 평정하고 돌아오는 길에 1529년 병으로 죽었다. 양명학은 처음에는 비판을 받았으나 융경제 때 복권되고 뒤에 공자 사당에 모셔졌다. 제자들 가운데 왕간의 태주학파가 갈라져 나왔고, 그 영향을 받은 이지(이탁오) 같은 급진적인 사상가도 나와 명 후기 사상계를 흔들었다. 양명학은 조선에도 전해져 이황이 『전습록』을 비판하는 글을 썼고, 뒤에 정제두가 이를 받아들였다. 왕양명은 누구에게나 양지가 있으므로 신분이나 학식과 관계없이 성인이 될 수 있다고 가르쳤고, 이는 일반 사람도 학문의 주체가 될 수 있다는 생각을 퍼뜨렸다. 한편 마음을 지나치게 강조해 학문과 예법이 느슨해진다는 비판이 주자학자들에게서 나왔다. 그의 사상은 마음을 닦는 데 그치지 않고 세상에서 실천으로 옮길 것을 강조했다. 그는 지방관으로 일하며 향약을 시행하고 학교를 세워 지방 교화에도 힘썼다. 일본에서는 나카에 도주 같은 양명학자가 나왔다."
  subjects: [ming, joseon, japan]
  tags: [culture, religion]
  sources: ["『명사』 왕수인전", "왕수인, 『전습록』", "The Cambridge History of China, vol. 8: The Ming Dynasty, 1368–1644, Part 2 (Denis Twitchett·Frederick W. Mote 편, Cambridge University Press, 1998)"]

- id: jiajing-great-rites-1521
  year: 1521
  endYear: 1567
  title:
    ko: "가정제의 대례의와 엄숭의 전횡(1521~1567)"
  summary:
    ko: "1521년 정덕제가 죽자 대신 양정화는 황실에서 후사를 찾아 흥헌왕의 아들 주후총(만 열세 살, 가정제)을 세웠다. 가정제는 선대 홍치제(효종)·정덕제의 뒤를 이은 입장이었지만 생부 흥헌왕을 황제의 아버지로 높이려 했고, 양정화 등 대신은 효종을 아버지로 하고 생부는 숙부로 불러야 한다고 맞섰다. 이 예법 논쟁이 대례의(1521~1524)이다. 양정화는 1524년 초 물러났고, 그해 음력 7월 대신 수백 명이 좌순문 앞에서 항의하자 가정제는 이들을 체포해 곤장을 쳤으며 열일곱 명이 곤장에 맞아 죽었다고 한다(좌순문 사건). 이로써 황제는 관료의 반대를 누르고 생부를 황제로 높였다. 1542년에는 학대받던 궁녀들이 황제를 목 졸라 죽이려다 실패한 임인궁변이 일어났다. 이 일 뒤 가정제는 궁을 나와 서원에서 도교 수련과 불로장생의 의식에 빠져 정무를 소홀히 했다. 그 사이 엄숭이 1548년부터 1562년까지 수보로 정국을 좌우하며 뇌물과 파벌 정치가 극심해졌다. 엄숭은 1562년 서계 등의 공격으로 물러났고 아들 엄세번은 처형되었다(1565). 1566년 해서가 『치안소』를 올려 황제의 도교 탐닉과 실정을 직접 비판하다 투옥되었다. 가정제는 1566년 음력 12월(양력 1567년 1월) 죽었다. 대례의는 단순한 호칭 문제가 아니라 황제의 권위와 유교 관료의 예법 해석이 부딪친 사건이었다. 가정제는 이 승리로 황제의 권위를 높였으나 관료와의 신뢰는 깨졌다. 한편 도교 의식에 쓰는 ‘청사’라는 글을 잘 지으면 총애를 받았고 엄숭도 청사로 황제의 환심을 샀다고 한다. 가정제는 1530년 제사 규정을 고쳐 하늘과 땅에 따로 제사를 지내게 했다. 이 시기에는 북쪽의 알탄 칸과 남쪽 해안의 왜구가 한꺼번에 명을 흔들었다(「알탄 칸의 약탈과 경술의 변, 융경 화의(1542~1571)」(뒤의 사건))."
  subjects: [ming]
  tags: [politics]
  sources: ["『명사』 세종본기", "『명사』 양정화전", "『명사』 간신전 엄숭", "『명사』 해서전", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: altan-khan-gengxu-1542
  year: 1542
  endYear: 1571
  title:
    ko: "알탄 칸의 약탈과 경술의 변, 융경 화의(1542~1571)"
  summary:
    ko: "알탄 칸은 다얀 칸의 손자로, 내몽골 투메드부를 중심으로 몽골 우익을 이끌었다. 그는 말과 가축을 팔고 곡물과 비단을 사 올 수 있는 교역장(마시)을 열어 달라고 거듭 요구했으나 명은 이를 받아들이지 않았다. 알탄 칸은 1529·1530년과 1542년 등 장성을 넘어 북중국을 약탈했다. 1550년 경술년 음력 6월 알탄 칸은 다퉁을 노렸으나 방어가 단단해 동쪽으로 돌았고, 음력 8월 구베이커우로 장성을 넘어 베이징 교외까지 이르러 며칠 동안 약탈했다(경술의 변). 명군은 제대로 움직이지 않았고, 다퉁 총병 구란이 알탄 칸에게 뇌물을 주어 다퉁을 건드리지 말라고 했다고도 전한다. 조정에서는 엄숭이 책임을 피했고 병부상서 정여기가 처형되었다. 알탄 칸의 요구에 따라 명은 1551년 마시를 열었다가 곧 닫았다. 명은 장성 수축과 병력 증강에 힘썼지만 몽골 기병의 침입은 이어졌다. 1570년 알탄 칸의 손자 바한나지가 집안의 불화로 명에 귀순하자, 명은 이를 손자를 돌려보내는 대가로 교섭하는 계기로 삼았다. 이듬해인 1571년 융경제는 알탄 칸을 순의왕으로 책봉하고 장성 여러 곳에 마시를 열어 교역하게 했다(융경 화의). 알탄 칸은 뒤에 후허하오터 일대에 도성을 세웠고 명은 이를 귀화성이라 불렀다. 몽골의 시장 요구는 단순한 약탈이 아니라 필수품을 얻기 위한 교역 요구였다. 초원에서는 쇠로 만든 솥과 농기구, 곡식과 직물을 구하기 어려웠다. 알탄 칸의 주변에는 명에서 도망해 온 한인들이 모여 사는 마을(판승)이 있었고, 이들이 농사와 장인 일을 하며 몽골 사회에 정착했다. 융경 화의에서 명은 알탄 칸의 일족과 부하들에게도 관직을 주고 해마다 하사품을 보냈다. 이 화의로 북쪽 변방은 한동안 조용해졌고 몽골 사람들도 필요한 물자를 얻을 길을 찾았다."
  subjects: [ming, mongols]
  tags: [war, diplomacy]
  sources: ["『명사』 달단전", "『명사』 세종본기", "『명사』 목종본기", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]
  places: [{ name: 경술의 변 베이징 포위, at: [116.4, 39.91], year: 1550 }]

- id: wokou-maritime-ban-1523
  year: 1523
  endYear: 1567
  title:
    ko: "가정 연간의 왜구와 해금 완화(1523~1567)"
  summary:
    ko: "명은 홍무 해금으로 사사로운 무역을 막았으나 연해의 무역 수요는 줄지 않아 밀무역이 번졌다. 1523년 일본의 오우치씨 사신과 호소카와씨 사신이 감합 선박의 서열을 놓고 닝보에서 충돌해 관리를 죽이고 약탈했다(닝보의 난). 명은 이를 이유로 일본과의 조공 무역을 사실상 막았다. 이후 저장·푸젠 앞바다의 섬들은 일본인과 포르투갈인, 중국인 밀무역 상인의 근거지가 되었다. 1548년 명이 쌍서의 소굴을 소탕했으나 그 뒤 해적의 침입은 오히려 거세져 1550년대에 왜구의 약탈이 절정에 이르렀다. 『명사』 일본전은 1555년 침입한 한 무리를 두고 ‘진짜 왜인이 열에 셋, 따라 나선 자가 열에 일곱’이라고 적었다. 우두머리 가운데에는 왕직·서해 같은 중국인 상인이 있었다. 1555년에는 난징 가까이까지 왜구가 쳐들어왔다. 총독 호종헌은 왕직을 회유해 1557~1558년 무렵 붙잡았고, 왕직은 1559년 음력 12월 처형되었다. 척계광은 1553년 산둥에서 왜구 방어를 맡았다가 뒤에 저장으로 옮겨 이우의 농민과 광부를 모아 새 군대(척가군)를 길렀고, 1561년 타이저우 일대에서 크게 이겼다. 유대유도 활약했다. 1555년 조선 전라도를 습격한 왜구(「을묘왜변과 비변사 상설화」(뒤의 사건))도 같은 시기의 일이다. 1567년 즉위한 융경제는 푸젠 월항에서 중국 상인이 동남아시아로 나가 무역하는 것을 허가했으나 일본으로 가는 무역은 계속 막았다. 후기 왜구는 중국인 해상 세력의 사무역과 깊이 얽혀 있었다. 왕직은 일본 규슈의 히라도를 근거지로 삼아 활동했다. 왜구를 막는 병력으로는 저장 이우의 광부와 농민 등이 쓰였고, 척계광은 원앙진이라는 전술을 만들어 이들을 훈련시켰다. 가정 연간 왜구의 피해는 저장·장쑤·푸젠·광둥 연해에 널리 미쳤다. 닝보나 푸저우 같은 큰 도시도 포위되었고, 군사 비용을 대려 임시 세금이 더해졌다. 이 해금 완화 뒤 왜구의 피해는 잦아들었다."
  subjects: [ming, japan, joseon]
  tags: [war, economy]
  sources: ["『명사』 일본전", "『명사』 주환전", "『명사』 척계광전", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: ming-silver-economy-1436
  year: 1436
  endYear: 1640
  title:
    ko: "은 경제의 확산과 세계 은 교역(1436~1640)"
  summary:
    ko: "명 초에는 대명보초라는 지폐가 쓰였으나 남발로 가치가 떨어지자 15세기 중엽부터 은이 세금과 거래 수단으로 널리 쓰였다. 1436년 정통제 때 남쪽의 쌀 세금 일부를 은으로 거두기 시작한 금화은이 전환점으로 꼽힌다. 은 수요가 커지자 공급이 문제였다. 16세기에 일본의 이와미 은광(1526년 발견)에서 많은 은이 나왔고, 에스파냐가 1545년 포토시에서 은광을 발견한 뒤에는 아메리카 은이 마닐라를 거쳐 흘러들었다. 에스파냐는 1571년 필리핀에 마닐라를 세우고 아카풀코와 마닐라를 잇는 갈레온 무역으로 은을 중국의 생사·도자기와 바꾸었다. 포르투갈인은 1557년 마카오에서 머물 수 있게 되자 중국 생사와 일본 은을 오가게 하는 중개 무역을 했다. 은이 들어온 양은 추산에 차이가 있으나 해마다 수십~수백 톤이라는 추산이 있다. 은 중심의 경제는 조세 제도를 바꾸었다. 여러 세와 부역을 은으로 묶어 한꺼번에 거두는 일조편법(「장거정의 개혁과 일조편법(1572~1584)」(뒤의 사건))이 그 결과이다. 강남에서는 면직물과 견직물 생산이 발달해 쑤저우·항저우 같은 도시가 번성했고, 휘주 상인과 산시 상인이 전국 유통을 주도했다. 면화·뽕나무·차 같은 상품 작물이 늘어 농촌도 시장에 기대게 되었다. 남쪽 해안의 민간 상인은 해금 때문에 합법적으로는 갈 수 없었으나 마닐라 같은 동남아시아 항구에서 외국 상인과 거래했다. 마닐라에는 중국 상인이 모여 살았다. 17세기 초에는 네덜란드 동인도회사도 타이완을 거점으로 중국과의 무역을 시도했다. 은은 크기에 따라 무게를 달아 쓰는 화폐였다. 은 덩이를 잘라 무게로 거래했으므로 지역마다 품질과 저울이 달라 거래가 번거로웠다. 한편 1630년대 후반부터 은 유입이 줄고 기근이 겹치자 명 말의 재정 위기가 깊어졌다고 보는 연구가 있다."
  subjects: [ming, japan, spain, portugal]
  tags: [economy]
  sources: ["『명사』 식화지", "『명사』 외국전", "The Cambridge History of China, vol. 8: The Ming Dynasty, 1368–1644, Part 2 (Denis Twitchett·Frederick W. Mote 편, Cambridge University Press, 1998)"]

- id: zhang-juzheng-reform-1572
  year: 1572
  endYear: 1584
  title:
    ko: "장거정의 개혁과 일조편법(1572~1584)"
  summary:
    ko: "1572년 융경제가 죽고 만 여덟 살의 명 만력제(주익균)가 즉위하자 수보 고공이 밀려나고 장거정이 수보가 되었다. 만력제의 생모 이태후와 환관 풍보의 협조 아래 장거정은 1582년까지 실질적으로 정국을 이끌었다. 그는 먼저 관료 감독을 엄격히 하는 고성법(1573)을 시행해 관리의 임무와 기한을 정하고 그 이행을 점검하게 했다. 재정에서는 1578년 전국의 토지를 다시 재는 청장을 명했고 1581~1582년 무렵 전국에서 측량이 이뤄져 숨은 토지를 찾아내 세원을 늘렸고, 일조편법, 곧 여러 세와 부역을 합쳐 토지와 인구에 따라 은으로 한꺼번에 거두는 제도를 1581년 전국으로 넓혔다. 이 개혁으로 국고에 곡식과 은이 쌓여 재정이 한동안 나아졌다. 군사 면에서는 척계광을 북쪽 계주 방어에, 이성량을 요동에 두어 변경을 안정시켰고 몽골 알탄 칸과의 화의를 유지했다(「알탄 칸의 약탈과 경술의 변, 융경 화의(1542~1571)」(앞의 사건)). 황허강 치수에는 반계순을 기용했다. 그러나 장거정은 권력을 강하게 쥐고 비판자를 눌렀고, 1577년 부친상에도 관직을 떠나지 않는 일(탈정)로 비난을 받았다. 1582년 음력 6월 장거정이 병으로 죽자 만력제는 곧 그의 측근을 몰아냈고, 1584년 장거정은 관직 박탈과 재산 몰수를 당했으며 가족 일부가 비극적으로 죽었다. 장거정의 정책은 강한 통제를 낳기도 했다. 관리를 감시하는 고성법으로 관료는 늘 처벌의 위협을 느꼈고, 그는 서원을 정치 비판의 공간으로 보아 1579년 서원을 헐게 했다. 이런 억압이 그가 죽은 뒤 반발을 부른 배경이 되었다. 만력제를 엄격히 가르치던 스승이기도 했던 장거정에게 황제는 자라면서 반감을 품었다고 전한다. 개혁에는 황실 비용을 줄이고 역참 이용을 단속하는 조치도 들어 있었다. 개혁은 중단되었고 일조편법만 은 납부 제도로 남았다."
  subjects: [ming, mongols]
  tags: [politics, economy]
  sources: ["『명사』 장거정전", "『명사』 식화지", "Ray Huang, 1587, A Year of No Significance: The Ming Dynasty in Decline (Yale University Press, 1981)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: altan-sonam-gyatso-1577
  year: 1577
  endYear: 1601
  title:
    ko: "알탄 칸과 소남 갸초의 회견, 몽골의 겔룩파 수용(1577~1601)"
  summary:
    ko: "겔룩파는 15세기 초 쫑카파가 세운 티베트 불교의 한 갈래이다. 16세기 후반 겔룩파의 지도자 소남 갸초는 몽골 투메드부의 알탄 칸을 만났다. 알탄 칸은 앞서 1569년 소남 갸초를 초청했으나 오지 못했고, 소남 갸초는 1577년 티베트를 떠나 1578년 알탄 칸과 만났다. 알탄 칸은 이때 소남 갸초에게 ‘달라이’라는 칭호를 올렸다. 달라이는 몽골어로 ‘바다’를 뜻한다. 소남 갸초는 이 칭호를 자신의 앞선 두 전생에게까지 소급해 스스로 3대 달라이 라마가 되었다. 두 사람은 서로를 쿠빌라이와 파스파의 환생에 견주며 몽골 칸이 불교의 보호자 노릇을 하는 옛 관계(「쿠빌라이와 파스파: 티베트 불교와 파스파 문자(1253~1288)」(앞의 사건))를 되살리려 했다. 알탄 칸은 불교를 받아들였고, 사람이나 가축을 제물로 바치는 몽골의 옛 관습을 금지하는 법을 선포했다고 한다. 1579년에는 후허하오터에 큰 사원을 짓도록 명했다. 1587년 명도 소남 갸초에게 칭호를 내려 이 관계를 인정했다고 한다. 소남 갸초는 1588년 죽었고, 알탄 칸의 증손 욘텐 갸초가 1601년 4대 달라이 라마로 정해져 몽골과 티베트의 인연이 굳어졌다. 소남 갸초가 이 회견을 받아들인 배경에는 겔룩파의 처지가 있었다. 당시 티베트에서는 카르마파와 짱 지방의 왕가(짱파) 등 다른 세력이 강했고 겔룩파는 이들에 맞설 후원자를 찾았다. 알탄 칸은 칭하이와 티베트 쪽으로 세력을 넓히던 터라 정치적으로도 종교적으로도 이득이 있었다. 이후 몽골 여러 부가 불교에 귀의하면서 몽골에서 불교 사원이 늘고, 몽골어로 된 불경 번역과 간행도 이어졌다. 겔룩파는 노란 모자를 쓰는 데서 황모파라고도 불렸다. 회견 장소는 칭하이호 부근이라는 설이 널리 쓰이고, 투메드 땅이라는 설도 있다. 이로써 몽골 사회에 티베트 불교가 깊이 뿌리내렸다."
  subjects: [mongols, ming]
  tags: [religion, diplomacy]
  sources: ["『명사』 달단전", "『명사』 서역전 서번제위", "The Cambridge History of China, vol. 8: The Ming Dynasty, 1368–1644, Part 2 (Denis Twitchett·Frederick W. Mote 편, Cambridge University Press, 1998)"]

- id: wanli-three-campaigns-1592
  year: 1592
  endYear: 1600
  title:
    ko: "만력 3대 정벌: 닝샤·조선·파주(1592~1600)"
  summary:
    ko: "만력제 때 세 차례의 큰 원정이 있었고 이를 ‘만력 3대 정벌’이라 한다. 첫째는 1592년 닝샤의 난이다. 몽골 출신 장군 보바이가 처우에 불만을 품고 닝샤에서 반란을 일으키자 명은 이를 같은 해 음력 9월 진압했다. 둘째는 같은 해 시작된 임진왜란의 구원군 파병이다. 도요토미 히데요시의 일본군이 조선을 침략하자(「임진왜란 발발」(앞의 사건)) 명은 조선에 구원군을 보내 1593년 평양성을 되찾았고(「조·명 연합군의 평양성 탈환과 행주 대첩」(뒤의 사건)) 정유재란(「정유재란과 명량·노량 해전」(뒤의 사건))에도 다시 군대를 보냈다. 이 파병에는 이광도의 추산으로 명군 총 16만 6,700명과 은 1,700만 냥가량이 들었다고 하나 『명사』는 700여만 냥이라 적어 추산이 갈리며, 어느 쪽이든 명의 재정이 크게 흔들렸다. 전쟁은 1598년 도요토미가 죽고 일본군이 철수하며 끝났다. 셋째는 1599~1600년 당시 쓰촨에 속했던 파주(지금의 구이저우 쭌이 일대)의 토사 양응룡 토벌이다. 양응룡은 1600년 음력 6월 근거지 하이룽툰이 함락되자 스스로 목숨을 끊었다. 세 정벌로 명 재정이 바닥나자 만력제는 환관을 광산과 상세 징수에 내보냈다(「만력제의 국본 논쟁과 광세의 폐해(1586~1601)」(앞의 사건)). 닝샤의 난은 북쪽 변경 방어에 몽골 출신 병사를 쓰던 방식의 위험과 군사 부패를 드러냈다. 임진왜란 구원은 명이 책봉국 조선을 도와 제국의 체면을 지키는 일이기도 했으나, 평양 탈환 뒤 일본군과의 화의를 두고 명 조정의 의견이 갈렸다. 이 전쟁으로 요동의 병력과 물자가 조선으로 돌려져 후금에 대한 방비가 약해진 점이 뒤에 뼈아프게 작용했다고 평가한다. 명의 구원군에는 요동의 정예 기병과 남쪽 저장 출신 보병, 화포 부대가 섞여 있었다. 척계광의 전술을 익힌 남쪽 병사들은 평양 탈환에서 큰 몫을 했다고 한다. 요동 방어는 상대적으로 소홀해져 후금이 자라날 틈을 주었다(「누르하치의 여진 통일과 팔기, 후금의 건국(1583~1616)」(앞의 사건))."
  subjects: [ming, joseon, japan]
  tags: [war]
  sources: ["『명사』 신종본기", "『명사』 조선전", "『명사』 토사전", "Kenneth M. Swope, A Dragon's Head and a Serpent's Tail: Ming China and the First Great East Asian War, 1592–1598 (University of Oklahoma Press, 2009)", "Ray Huang, 1587, A Year of No Significance: The Ming Dynasty in Decline (Yale University Press, 1981)"]

- id: wanli-succession-mining-tax-1586
  year: 1586
  endYear: 1601
  title:
    ko: "만력제의 국본 논쟁과 광세의 폐해(1586~1601)"
  summary:
    ko: "장거정이 죽은 뒤 명의 만력제는 직접 정치에 나섰으나 점차 조정과 거리를 두었다. 관료들의 간쟁에 지친 데다 건강 문제도 겹쳐 1589년 무렵부터 조회에 나오지 않는 일이 늘었다. 황후에게 아들이 없어 후계 문제가 불거졌다. 만력제는 총애하던 정귀비의 아들 주상순을 세우고 싶어 했으나 대신들은 맏아들 주상락을 황태자로 세우라고 거듭 상소했다. 이 국본 논쟁(1586~1601)은 황제와 관료의 싸움으로 번져 많은 관료가 파면되거나 좌천되었고, 1601년에야 주상락이 황태자로 책봉되었다. 정치에서 한 발 물러선 황제는 빈 관직을 채우는 일도 미루어 행정이 막히는 일이 많았다. 한편 3대 정벌로 재정이 바닥나자(「만력 3대 정벌: 닝샤·조선·파주(1592~1600)」(뒤의 사건)) 1596년부터 환관을 광산 감독관과 세금 징수관으로 전국에 보내 광산 개발과 상세를 거두게 했다. 환관들은 정해진 액수를 넘겨 가렴했고 상인과 백성은 시달렸다. 1601년 쑤저우에서는 직조 노동자 갈성이 세금 징수관의 횡포에 맞서 폭동을 일으켰고 각지에서 비슷한 소요가 이어졌다. 만력제의 태업은 황제가 정무를 거부하는 방식으로 관료에 맞서는 소극적 저항이었다. 상소를 읽고도 답하지 않고 궁중에 묵히는 일이 늘어 관료는 황제의 결정을 기다리다 일을 멈추기 일쑤였다. 이 때문에 행정이 마비되었고 만력 후기에는 고위 관직이 많이 비었다. 광세 징수는 황실 재정을 위한 별도의 수입이었고, 이를 거두는 환관은 지방 관리와 충돌하는 일이 많았다. 대신들은 맏아들을 먼저 세우는 것이 예법이라는 원칙을 앞세웠고, 황제는 이 문제로 15년 가까이 대신들과 맞섰다. 이 싸움에서 황제의 뜻을 거스르는 상소를 올린 관료들이 파면되거나 유배되기도 했다. 황제와 관료의 불신이 깊어지면서 정쟁이 심해졌고 비판 세력이 커졌다(「동림당과 위충현(1604~1627)」(뒤의 사건))."
  subjects: [ming]
  tags: [politics, society]
  sources: ["『명사』 신종본기", "『명사』 환관전", "『명사』 식화지", "Ray Huang, 1587, A Year of No Significance: The Ming Dynasty in Decline (Yale University Press, 1981)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: donglin-wei-zhongxian-1604
  year: 1604
  endYear: 1627
  title:
    ko: "동림당과 위충현(1604~1627)"
  summary:
    ko: "1604년 고헌성과 고반룡 등이 장쑤성 우시의 동림서원을 다시 세우고 학문을 강론하며 정치를 논했다. 이들은 환관과 권신의 전횡을 비판하고 인재 등용과 정치 개혁을 요구했으며, 이를 지지하는 관료 집단을 동림당이라 불렀다. 이에 맞서 같은 지역 출신끼리 뭉친 관료 파벌과 환관 세력이 동림당을 공격해 당쟁이 심해졌다. 1620년 만력제가 죽고 태창제가 한 달 만에 죽은 뒤 만 열네 살의 천계제(주유교, 재위 1620~1627)가 즉위하자 동림 인사 양련·좌광두 등이 요직에 올랐다. 그러나 천계제는 정무에 관심이 적고 목공을 즐겼으며, 환관 위충현에게 정무를 맡겼다. 위충현은 황제의 유모 객씨와 결탁했고, 1624년 양련이 위충현의 24가지 죄를 탄핵하는 상소를 올렸으나 도리어 화를 불렀다. 위충현은 동창과 금의위를 동원해 동림 인사를 잡아들였고 1625년 양련 등 ‘6군자’가 옥중에서 죽었다. 1626년 주순창이 체포되자 쑤저우에서는 시민들이 관리를 둘러싸고 소요를 일으켰다. 이어 동림서원을 비롯한 서원들이 헐렸고 전국에 위충현의 생사당이 세워졌다. 1627년 숭정제가 즉위하자 위충현은 쫓겨나 그해 음력 11월 자결했고 동림 인사들은 복권되었다. 동림당은 정당이 아니라 도덕적 정치를 요구하는 관료와 서원 학자들의 느슨한 모임이었다. 이들은 군주와 관료가 모두 도덕을 따라야 한다고 주장했고, 이 때문에 정치적 반대자를 ‘소인’으로 몰았다는 비판도 받는다. 동림당과 환관 세력의 대립은 선악의 대결이라기보다 관료 파벌과 환관이 권력을 두고 싸운 면이 있다는 평가도 있다. 위충현은 『삼조요전』이라는 책을 만들어 동림당을 모함하는 데 이용했다. 그러나 당쟁은 이어졌고 명 후기의 관료 사회는 이미 깊은 상처를 입은 뒤였다."
  subjects: [ming]
  tags: [politics]
  sources: ["『명사』 환관전 위충현", "『명사』 고헌성전", "『명사』 양련전", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: ming-late-culture-1550
  year: 1550
  endYear: 1644
  title:
    ko: "명 후기의 도시와 출판, 소설·희곡과 실용 학문(1550~1644)"
  summary:
    ko: "16세기 중엽부터 은 경제와 상업이 퍼지며(「은 경제의 확산과 세계 은 교역(1436~1640)」(앞의 사건)) 강남의 도시가 커지고 인쇄·출판업이 번성했다. 책을 사 읽는 독자가 늘면서 소설과 희곡이 널리 퍼졌다. 『삼국지연의』와 『수호전』이 다듬어져 널리 읽혔고, 16세기 말에는 오승은의 작품으로 알려진 『서유기』가 간행되었으며, 17세기 초에는 세태를 그린 『금병매』가 유통되었다. 탕현조는 『모란정』(1598)에서 사랑의 감정을 앞세웠다. 사상에서는 양명학 좌파인 이지가 기존 도덕을 비판하는 글을 써 파장을 일으켰다(「왕양명의 양명학: 용장의 깨달음에서 치양지까지(1508~1529)」(앞의 사건)). 실용 학문도 발달했다. 이시진의 『본초강목』은 약재 1,800여 종을 정리해 1596년 간행되었고, 송응성의 『천공개물』(1637)은 농업과 수공업 기술을 그림과 함께 설명했다. 서광계는 마테오 리치에게 서양 수학과 천문학을 배우고 유클리드 기하학을 함께 옮겼으며 농서 『농정전서』를 집필했는데 이 책은 그가 죽은 뒤 1639년 간행되었다(「마테오 리치의 베이징 선교와 『천주실의』」(뒤의 사건)). 서하객은 전국을 돌며 지리와 산천을 기록한 『서하객유기』를 남겼다. 한편 이런 도시 문화와 출판의 번영은 소수 상층의 풍요에 가려졌다는 시각도 있다. 책 출판은 난징·쑤저우·항저우와 푸젠 젠양 등지에서 성했다. 민간 출판사는 소설에 삽화를 넣어 인기를 끌었고, 독자층이 상인과 도시의 하급 지식인으로 넓어졌다. 연극에서는 곤곡이라는 노래 형식이 쑤저우 일대에서 발전해 인기를 끌었다. 한편 과거는 팔고문이라는 정해진 형식의 글로 시험을 보아 문장이 틀에 박힌다는 비판이 있었다. 농촌의 빈곤과 세 부담은 여전히 컸고 도시 지식인의 위기감도 커졌다."
  subjects: [ming]
  tags: [culture, society]
  sources: ["『명사』 예문지", "이시진, 『본초강목』", "송응성, 『천공개물』", "The Cambridge History of China, vol. 8: The Ming Dynasty, 1368–1644, Part 2 (Denis Twitchett·Frederick W. Mote 편, Cambridge University Press, 1998)"]

- id: nurhaci-jurchen-unification-1583
  year: 1583
  endYear: 1616
  title:
    ko: "누르하치의 여진 통일과 팔기, 후금의 건국(1583~1616)"
  summary:
    ko: "명은 여진을 건주·해서·야인의 세 갈래로 나누어 불렀다. 명은 요동 총병 이성량을 앞세워 여진 여러 부를 서로 견제시키면서 마시를 열어 주었다. 누르하치는 건주 여진의 한 족장 가문에서 태어났다. 1583년 무렵(1582년이라는 기록도 있다) 명의 지원을 받은 니칸 와이란의 습격으로 할아버지 기오창가와 아버지 탁시를 잃자 갑옷 13벌로 거병했다고 전한다. 그는 1580년대 후반까지 건주 여진의 중심부를 하나로 모았다. 같은 시기 조선 북변에서는 여진 번호가 소란을 일으켰다(「니탕개의 난」(앞의 사건)). 1593년 구러산 전투에서 예허를 중심으로 한 해서 여진 9부 연합군을 꺾어 힘을 크게 키웠고, 이후 하다(1599~1603)·후이파(1607)·울라(1613)를 차례로 병합했다. 예허는 가장 마지막까지 버텼다. 1599년에는 몽골 문자를 바탕으로 만주 문자를 만들게 했다. 군사·행정 조직으로는 300명을 단위로 한 니루를 묶어 홍·황·람·백의 4기를 만들었고(1601), 1615년 테두리를 두른 4기를 더해 8기로 넓혔다. 팔기는 군대이자 호적이며 행정 단위로, 뒤에는 몽골인과 한인도 편입되어 몽골 8기와 한군 8기가 따로 만들어졌다. 조선은 임진왜란 중인 1595년 신충일을 건주에 보내 상황을 살폈고, 그가 남긴 보고서가 『건주기정도기』이다. 1616년 누르하치는 허투알라에서 칸에 올라 후금을 세웠다(「후금 건국」(뒤의 사건)). 이성량은 요동 총병으로 오래 있으면서 여진을 분열시키는 정책을 폈으나 건주 여진이 성장하는 것을 막지는 못했다. 누르하치는 마시에서 인삼과 모피를 팔아 얻은 은으로 군비를 마련했다고 한다. 그는 몽골 코르친 부와 혼인 동맹을 맺어 힘을 키웠고, 이것이 뒤에 후금의 몽골 정책의 바탕이 되었다. 명의 요동 방어는 임진왜란 파병으로 약해져 있었다."
  subjects: [jurchen, hugeum, ming, joseon]
  tags: [politics, war]
  sources: ["『청태조실록』", "신충일, 『건주기정도기』", "Mark C. Elliott, The Manchu Way: The Eight Banners and Ethnic Identity in Late Imperial China (Stanford University Press, 2001)", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)"]

- id: hugeum-liaodong-ningyuan-1618
  year: 1618
  endYear: 1626
  title:
    ko: "후금의 요동 공략과 영원 전투(1618~1626)"
  summary:
    ko: "1618년 음력 4월 누르하치는 ‘7대한’, 곧 명에 대한 일곱 가지 원한을 내세워 선전 포고하고 푸순을 점령했다. 명은 이듬해 요동 경략 양호의 지휘로 군대를 네 갈래로 나누어 후금의 도읍 허투알라를 치게 했다. 후금은 흩어진 명군을 차례로 무찔러 사르후 전투(1619)에서 크게 이겼다(조선군 강홍립 부대도 이 싸움에서 항복했다, 「광해군의 중립 외교 (사르후 전투)」(뒤의 사건)). 이어 카이위안과 톄링을 함락하고 같은 해 예허를 병합했다. 1621년에는 선양과 랴오양을 차지하고 랴오양을 도읍으로 삼았다가 1625년 선양으로 옮겼다. 요동을 얻은 후금은 한인에게 머리를 깎고 만주식 복색을 따르게 했고 한인 농민을 팔기에 딸린 노비로 삼기도 해 한인의 반발이 컸다. 명은 웅정필과 원응태를 경략으로 보내 방어를 맡겼으나 파벌 다툼으로 호흡이 맞지 않았고 1622년 광녕을 잃었다. 명의 모문룡은 1621년부터 조선 땅의 가도에 주둔하며 후금의 배후를 흔들었고, 이는 후금이 조선을 치는 이유의 하나가 되었다(「정묘호란」(뒤의 사건)). 1626년 음력 1월 원숭환은 영원성에서 누르하치의 대군을 맞아 서양식 대포(홍이포)로 막아 냈다. 사르후 전투에서 명군은 네 길로 나누어 진격했으나 후금은 안쪽 선으로 움직이는 이점을 살려 한 길씩 격파했다. 후금의 팔기 군대는 기병이 중심이었고 군령이 엄격했다. 이후 후금은 요동의 한인 지주와 투항한 명 장수를 활용했는데 뒤에 청의 중국 정복에 큰 역할을 하는 인물이 많았다. 원숭환의 영원 방어는 후금이 성을 정면으로 공격해서는 손실이 크다는 것을 보여 주었다. 영원에서 쓰인 포는 명이 마카오의 포르투갈인에게서 들여온 기술에 바탕을 두었다고 한다. 누르하치는 부상을 입은 채 그해 음력 8월 죽었고, 여러 버일러의 추대로 여덟째 아들 홍타이지가 뒤를 이었다."
  subjects: [hugeum, ming, joseon]
  links:
    - { from: hugeum, to: ming, note: "랴오양·선양 점령과 요동 장악 (1621)" }
  tags: [war, politics]
  sources: ["『청태조실록』", "『명사』 웅정필전", "『명사』 원숭환전", "The Cambridge History of China, vol. 9, Part 1: The Ch'ing Empire to 1800 (Willard J. Peterson 편, Cambridge University Press, 2002)", "Mark C. Elliott, The Manchu Way: The Eight Banners and Ethnic Identity in Late Imperial China (Stanford University Press, 2001)"]
