- id: chongzhen-yuan-chonghuan-1627
  year: 1627
  endYear: 1630
  title:
    ko: "숭정제의 즉위와 원숭환의 처형(1627~1630)"
  summary:
    ko: "1627년 천계제가 죽고 동생 숭정제(주유검)가 만 열여섯 살로 즉위했다. 그는 곧 위충현 세력을 정리했다(「동림당과 위충현(1604~1627)」(앞의 사건)). 숭정제는 요동 방어를 맡길 인물로 원숭환을 1628년 다시 기용했고, 원숭환은 ‘5년 안에 요동을 회복하겠다’고 장담했다. 한편 홍타이지는 1627년 조선을 쳐 배후를 다져 둔 터였다(「정묘호란」(앞의 사건)). 1629년 원숭환은 가도의 모문룡을 쌍도로 불러 처형했는데 월권이라는 비판도 컸다. 같은 해 가을 홍타이지는 영원·산해관의 방어선을 피해 몽골 땅을 우회해 장성을 넘었고, 후금군은 음력 10월 말 장성을 넘어 음력 11월 베이징 외곽에 이르렀다(기사의 변). 원숭환이 서둘러 달려가 후금군과 맞싸웠으나, 홍타이지가 원숭환이 후금과 내통했다는 소문을 퍼뜨렸고 숭정제는 이를 의심했다. 원숭환은 그해 음력 12월 체포되어 1630년 음력 8월 능지형으로 처형되었다. 이 반간계의 구체적인 경위는 사료에 따라 다르다. 후금군은 영평·쭌화 등 장성 안쪽의 4개 성을 점령하다가 물러났다. 숭정제는 의심이 많아 신하를 믿지 못했고, 뒤에는 재위 17년 동안 내각 수보를 수십 명이나 갈아 치웠다고 한다. 숭정제는 재정 위기와 농민 반란, 후금의 압박이라는 세 가지 문제를 동시에 안고 있었다. 그는 부지런했으나 결단을 서두르고 책임을 신하에게 돌리는 경향이 있어 원숭환 같은 장수가 의심받기 쉬웠다. 기사의 변은 장성 이북의 방어에 의존한 전략이 뚫릴 수 있음을 드러냈다. 원숭환은 광둥 출신 관료로서 서양 대포를 들여오고 포르투갈 사람의 도움을 얻는 데 적극적이었다. 숭정제는 뒤에 환관을 다시 군 감독으로 보내 장수를 감시하게 했다. 후세는 원숭환의 처형을 명이 마지막 방어 능력을 스스로 잃은 사건으로 평가한다."
  subjects: [ming, hugeum, joseon]
  tags: [war, politics]
  sources: ["『명사』 원숭환전", "『명사』 장렬제본기", "『청태종실록』", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: li-zicheng-1628
  year: 1628
  endYear: 1644
  title:
    ko: "명 말의 농민 반란과 이자성의 베이징 점령(1628~1644)"
  summary:
    ko: "17세기 전반 소빙기의 추위로 가뭄과 메뚜기, 역병이 겹쳐 특히 산시(陝西) 북부에서 굶주림이 심했다. 명은 요동 방어비를 메우려고 요향·초향·연향 같은 임시 세금을 더했고, 숭정제는 역참을 줄여 많은 역졸을 해고했다. 1628년 산시(陝西) 북부에서 굶주린 농민이 들고일어났고, 역참에서 일하던 이자성이 1630년 무렵 합류했다. 고영상이 ‘틈왕’이라 불렸는데 1636년 그가 사로잡혀 죽은 뒤 이자성이 ‘틈왕’을 이었다. 반란군은 산시·허난·후베이 일대를 떠돌며 명군과 싸웠고, 1641년 뤄양을 함락해 만력제가 아끼던 아들 복왕 주상순을 죽였다(「만력제의 국본 논쟁과 광세의 폐해(1586~1601)」(앞의 사건)). 1642년 카이펑을 에워싸는 과정에서 황허강 제방이 터져 도시가 물에 잠겨 인명 피해가 컸는데, 명군과 이자성군 가운데 누가 제방을 터뜨렸는지는 사료가 엇갈린다. 1643년 이자성은 샹양에서 신순왕을 칭하고 시안을 차지했으며, 1644년 정월 시안에서 나라 이름을 대순으로 정하고 연호를 영창으로 했다. 그는 산시(山西)를 거쳐 베이징으로 진격해 음력 3월 19일(양력 4월 25일) 베이징을 함락했고, 숭정제는 징산에서 목을 매 죽었다. 산해관을 지키던 오삼계가 청의 도르곤에게 도움을 청했고, 1644년 음력 4월 22일(양력 5월 27일) 산해관에서 이자성군은 오삼계·청 연합군에게 패했다. 이자성은 베이징으로 돌아와 음력 4월 29일(양력 6월 3일) 즉위식을 올린 뒤 서쪽으로 물러났다(「명의 멸망과 청의 중국 지배」(뒤의 사건)). 이자성의 반란군은 ‘토지를 고르게 나눈다’, ‘세금을 면제한다’는 구호로 농민의 지지를 얻었다고 한다. 그러나 점령지에서는 약탈과 부유층에 대한 가혹한 처벌이 이어져 반감을 사기도 했다. 베이징 점령 뒤에는 명의 관료와 환관에게서 은을 거두는 고문 징수로 민심을 잃었다. 이자성은 그 뒤 오래 버티지 못했고 죽음의 경위는 분명하지 않다."
  subjects: [ming, qing]
  tags: [war, society]
  sources: ["『명사』 유적전 이자성", "『명사』 장렬제본기", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]
