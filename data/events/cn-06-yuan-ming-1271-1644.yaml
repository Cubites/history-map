# 중국 사건 6차 묶음: 쿠빌라이의 즉위에서 명의 멸망까지 (1260 ~ 1644, 작업 cn-06)
# 범위: 쿠빌라이의 즉위와 아릭 부케 전쟁, 카이두와 칸국 분열, 원의 통치 체제·지폐·대운하와 해운·해외 원정·티베트 불교·동서 교류, 원 중기의 황위 분쟁, 수시력과 원곡,
#   황허강 치수와 홍건적의 난, 주원장의 입신과 북벌, 홍무제의 이갑제·위소제·호유용 옥사·북방 경략·해금, 정난의 변, 영락제의 통치·베이징 천도·몽골 원정·정화의 항해, 인선의 치,
#   토목의 변, 정덕제와 신호의 난, 왕양명, 가정제의 대례의와 엄숭, 알탄 칸과 경술의 변, 왜구와 해금 완화, 은 경제, 장거정의 개혁, 알탄 칸과 소남 갸초, 만력 3대 정벌,
#   국본 논쟁과 광세, 동림당과 위충현, 명 후기의 문화, 누르하치의 여진 통일과 후금의 요동 공략, 숭정제와 원숭환, 명 말의 농민 반란과 이자성의 베이징 점령.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 1260~1644년 지도에서 생기거나 끝난 항목(몽골 제국의 끝, 원, 명, 북원, 몽골, 후금)과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 원의 해외 원정에서 「여원 연합군의 일본 원정」, 원의 학술·문화 사건에서 「만권당 설치」, 홍건적의 난 사건에서 「홍건적의 침입」, 홍무제의 북방 경략 사건에서 「요동 정벌과 위화도 회군」·「공민왕의 요동 공략」,
#   해금 사건에서 「명의 책봉과 사대 관계」·「왜구의 본격적인 침입」, 영락제 사건에서 「명의 교지 지배와 람선 봉기」, 왕양명 사건에서 조선 양명학, 왜구 사건에서 「을묘왜변과 비변사 상설화」, 만력 3대 정벌 사건에서 임진왜란 파병,
#   누르하치 사건에서 「니탕개의 난」·「후금 건국」, 후금의 요동 공략 사건에서 「광해군의 중립 외교 (사르후 전투)」·「정묘호란」, 이자성 사건에서 「명의 멸망과 청의 중국 지배」를 가리켰다. 한국사 04·05·06번 파일의 사건
#   (원 국호 제정·명 건국·명의 윈난 평정·교지 지배·임진왜란·후금 건국·사르후·정묘호란·명의 멸망 등)과 유럽 파일의 「마르코 폴로의 동방 여행과 『세계의 서술』」·「마테오 리치의 베이징 선교와 『천주실의』」·
#   「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」은 다시 만들지 않고 글에서 이름만 가리켰다. 남송 정복(양양 포위·임안 함락·애산 전투)은 5대 10국·송 묶음의 몫이라 여기서는 다루지 않았다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 연도: 데이터에는 천문 연도로 넣고, 본문의 연도는 모두 서기이다.
# 달력: 1912년 앞 중국의 날짜는 음력이라, 달만 적은 것도 음력 달이다. 양력을 함께 적은 곳은 괄호에 '양력'이라고 밝혔다.
# 이름 규칙: 신해혁명(1911) 앞 인물은 한자음(주원장·영락제·장거정·원숭환), 옛 지명은 한자음(대도·상도·응천·응창·집경), 지금도 쓰는 지명은 중국어 표기(난징·베이징·뤄양·쑤저우·우시·취안저우),
#   몽골·만주 인명은 굳은 표기(쿠빌라이·아릭 부케·카이두·에센·알탄 칸·누르하치·홍타이지). 나라 이름은 항목 이름과 맞췄다.
# places: 싸움이 있는 사건도 위치가 학설로 갈리는 곳(토목보·사르후·산해관 등)은 달지 않았다.
# 서술은 새로 작성. 출처는 사료(『원사』 『명사』 『청태조실록』 등)와 표준 개설서. 병력·사상자·재정 숫자는 사료가 과장하는 일이 많아 '추산'이나 '전한다'로 적었다. 운영자 검수 필요.

- id: kubilai-ariq-boke-1260
  year: 1260
  endYear: 1272
  title:
    ko: "쿠빌라이의 즉위와 아릭 부케 전쟁, 대도 건설(1260~1272)"
  summary:
    ko: "1259년 몽케 칸이 쓰촨 원정 중 죽자 몽골 제국의 칸 자리가 비었다. 몽케의 동생 쿠빌라이는 남송의 요충 악주(지금의 우한 일대)를 포위하다가 소식을 듣고 군대를 돌렸고, 1260년 음력 3월 개평(뒤의 상도)에서 쿠릴타이를 열어 대칸에 올랐다. 한편 막내 동생 아릭 부케도 몽골 본토의 카라코룸에서 따로 쿠릴타이를 열어 칸으로 추대되면서 형제가 맞섰다. 쿠빌라이는 곡식 공급을 막아 아릭 부케를 약하게 만들었고, 아릭 부케는 1264년 항복했다. 그 사이 1262년에는 산둥 일대를 쥐고 있던 한인 군벌 이단이 쿠빌라이에게 맞서 반란을 일으켰다가 몇 달 만에 진압되었다. 이 일 뒤 쿠빌라이는 한인 군벌의 힘을 줄이고 군사와 행정을 나누어 맡기는 쪽으로 나아갔다. 쿠빌라이는 한인 참모 유병충 등의 조언을 받아 중국식 제도를 받아들였고, 1260년 중통이라는 연호를 쓴 데 이어 1264년 지원으로 고쳤다. 도읍도 몽골 초원의 카라코룸에서 남쪽으로 옮겼다. 여름 도읍으로는 상도를 두었고, 겨울 도읍으로는 금나라의 옛 도읍 중도(연경) 곁에 1260년대 후반부터 새 도성을 쌓았으며, 1272년 이 도성을 대도라 이름 붙였다. 한편 오고타이 가문의 카이두 같은 서쪽의 실력자는 쿠빌라이의 즉위를 인정하지 않았고, 킵차크 칸국은 대칸의 명령에서 벗어나 제 갈 길을 갔고, 쿠빌라이를 지지한 일 칸국도 사실상 독자적으로 움직였다. 1271년 쿠빌라이가 나라 이름을 대원으로 정한 일은 「원 국호 제정」(뒤의 사건)에서 다룬다. 쿠빌라이의 즉위는 몽골의 전통에 비추어 정통성이 의심받았다. 쿠릴타이가 몽골 본토인 카라코룸 일대가 아닌 개평에서 열렸고 참석자도 쿠빌라이를 지지하는 쪽에 치우쳤기 때문이다. 그래서 쿠빌라이는 중국식 연호와 제도로 자신의 지위를 뒷받침하려 했다. 항복한 아릭 부케는 쿠빌라이의 감시 아래 지내다 1266년 죽었다. 이렇게 몽골 제국은 한 명의 대칸 아래 있던 나라에서 중국을 중심에 둔 원과 서쪽의 칸국들로 갈라졌다."
  subjects: [mongol-empire, yuan, golden-horde, song]
  tags: [politics, war]
  sources: ["『원사』 세조본기", "『원사』 지리지", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: kaidu-mongol-khanates-1266
  year: 1266
  endYear: 1304
  title:
    ko: "카이두의 도전과 몽골 제국의 칸국 분열(1266~1304)"
  summary:
    ko: "카이두는 오고타이 칸의 손자로, 대칸 자리가 오고타이 가문에서 톨루이 가문으로 넘어간 데 불만을 품은 서쪽의 실력자였다. 쿠빌라이와 아릭 부케가 싸울 때 카이두가 아릭 부케를 지지했다는 설이 있으나 확실하지 않다. 쿠빌라이가 1266년 중앙아시아로 보낸 차가타이 가문의 바라크는 1268년 카이두를 공격해 처음에는 이겼으나, 카이두가 킵차크 칸국 멩구 테무르의 도움으로 바라크를 꺾었다. 탈라스의 쿠릴타이(『집사』는 1269년, 와사프는 1267년 무렵으로 적는다)에서 트란스옥시아나의 3분의 2는 바라크가, 나머지는 카이두와 멩구 테무르가 나누기로 했다. 바라크는 1270년 일 칸국의 아바카에게 헤라트에서 크게 지고 1271년 죽었으며, 카이두는 그해 탈라스에서 오고타이 가문의 군주로 추대되었다. 1282년에는 차가타이 가문의 두와를 칸으로 세워 손잡았다. 두 사람은 1286년 베슈발리크를 차지해 원의 군대를 위구르 땅과 타림 분지에서 밀어냈고, 1289년에는 카라코룸까지 들어갔다가 쿠빌라이가 직접 군대를 이끌고 나서자 물러났다. 1294년 쿠빌라이가 죽고 손자 테무르(성종)가 뒤를 잇자 원은 다시 큰 원정에 나섰고, 1300년 카이산(뒤의 무종)이 알타이산맥 서쪽에서 카이두를 격파했다. 카이두는 1301년 가을 전투에서 입은 부상으로 얼마 뒤 죽었다. 이후 두와와 카이두의 아들 차파르는 1303~1304년 원과 화의를 맺어 40년 가까이 이어진 다툼을 끝냈다. 이 화의로 서쪽 칸국들은 원의 대칸을 명목상 위에 두는 대신 사실상 독자적으로 움직이게 되었다. 카이두의 세력 기반은 오고타이 가문이 대대로 터를 잡은 에밀강 유역, 곧 지금의 카자흐스탄 동부와 신장 북부 일대였다. 카이두와 두와는 원의 서쪽 변경인 위구르 땅(지금의 투루판 일대)과 타림 분지를 두고 원군과 싸웠고, 원은 이 지역에 병력을 두고 둔전을 일구어 군량을 마련하며 맞섰다. 이 전쟁은 원이 중국 통치에 쏟아야 할 자원을 서쪽 변경으로 돌리게 하는 부담이 되었다. 이렇게 몽골 제국은 원, 차가타이 칸국, 킵차크 칸국, 일 칸국으로 나뉘어 이어졌다."
  subjects: [yuan, mongol-empire, golden-horde]
  tags: [war, politics]
  sources: ["『원사』 세조본기", "『원사』 성종본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-government-1271
  year: 1271
  endYear: 1315
  title:
    ko: "원의 통치 체제: 행성과 다루가치, 몽골인·색목인 우대와 과거의 부활(1271~1315)"
  summary:
    ko: "원은 쿠빌라이 때 몽골의 전통과 중국식 관제를 섞어 통치 틀을 짰다. 중앙에는 정무를 맡는 중서성, 군사를 맡는 추밀원, 감찰을 맡는 어사대를 두었고, 지방에는 중서성의 출장 기관인 행중서성(줄여서 행성)을 여럿 두어 넓은 영토를 나누어 다스렸다. 수도 둘레의 중서성 직할지는 ‘복리’라 불렀다. 몽골은 각 지방과 관청에 감독관인 다루가치를 보냈는데, 대체로 몽골인이나 색목인이 맡았다. 색목인은 위구르·무슬림 등 서역에서 온 사람들을 가리킨다. 백성은 군호·민호·장인호처럼 직업별로 호적을 따로 두고 대대로 그 일을 잇게 했다. 사람들은 흔히 몽골인, 색목인, 한인(옛 금나라 땅의 사람들), 남인(옛 남송 땅의 사람들)의 네 부류로 나뉘었다고 하며, 높은 벼슬은 몽골인과 색목인이 많이 차지하고 남인이 가장 낮게 대우받았다고 본다. 다만 이 네 구분이 모든 법과 제도에 일관되게 적용된 신분제였는지는 연구자 사이에 논쟁이 있다. 관리를 뽑는 과거는 오래 열리지 않아 유학자들의 벼슬길이 좁았다. 1313년 음력 11월 과거를 되살린다는 조서가 내렸고, 1314년 향시를 거쳐 1315년 회시와 전시가 열렸다. 회시의 정원은 100명으로 몽골인·색목인·한인·남인에 각각 25명이라 하며, 1315년 전시에서 진사가 된 사람은 56명이었다. 실제 행정은 서리 출신 관리가 맡는 일이 많았다고 한다. 원은 몽골 제국 때부터 이어진 만호·천호 제도로 군대를 짰고, 핵심 군사 지휘권은 몽골 귀족이 쥐었다. 지방은 로·부·주·현의 층으로 나누었는데 이 이름은 송과 금의 제도를 이은 것이다. 쿠빌라이는 한인 유학자를 참모로 삼고 1271년 국자학을 세우는 등 유학도 일정하게 우대했고, 과거를 되살리자는 주장은 이런 유학자들의 오랜 요구였다. 원은 황족과 공신에게 땅과 백성을 나누어 주는 투하 제도를 두어 일부 지방에 영지를 갖게 했다. 이렇게 원의 통치는 중국의 제도를 받아들이되 몽골인의 우위를 지키려는 절충이었다."
  subjects: [yuan]
  tags: [politics, society]
  sources: ["『원사』 백관지", "『원사』 선거지", "『원사』 식화지", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-paper-money-1260
  year: 1260
  endYear: 1294
  title:
    ko: "중통초와 지원초: 원의 지폐 제도(1260~1294)"
  summary:
    ko: "원은 동전보다 지폐를 화폐 제도의 중심에 두었다. 쿠빌라이는 1260년 중통원보교초를 찍어 내기 시작했는데, 처음에는 비단을 바탕으로 했으나 곧 은과 바꾸어 주겠다는 약속(은 본위)으로 정리되었다고 한다. 앞서 송에서도 회자·교자 같은 지폐가 쓰였으나, 원은 동전을 거의 만들지 않고 지폐로 세금을 거두고 지출을 하는 방식을 넓혔다. 정부는 소금 전매의 값도 지폐로 받아 지폐가 시장에서 통하게 했다. 남송을 정복한 뒤에는 강남에서 쓰던 옛 지폐를 중통초로 바꾸어 주는 방식으로 새 화폐를 퍼뜨렸다. 문제는 원정과 불교 사원 후원, 황실 비용이 늘면서 지폐를 많이 찍어 값어치가 떨어졌다는 점이다. 1287년 재정을 맡은 상가가 지원보초를 새로 내놓고 중통초 5관을 지원초 1관으로 바꾸게 하여 화폐 값을 다시 세우려 했다. 상가는 1291년 실각해 처형되었으나 지폐 제도는 이어졌다. 마르코 폴로는 뽕나무 껍질로 만든 종이돈이 금은처럼 쓰이는 데 놀랐다고 적었다(「마르코 폴로의 동방 여행과 『세계의 서술』」(뒤의 사건)). 지폐 중심 경제는 서쪽 칸국으로도 알려져 일 칸국이 1294년 지폐를 시험했다고 전한다. 송과 금에서도 지폐가 쓰였기 때문에 원의 지폐 제도는 이미 있던 전통 위에 선 것이었다. 원 정부는 지폐를 찍을 때 준비금으로 은을 쌓아 두는 평준행용고를 두어 지폐와 은의 교환을 보증하려 했다. 지폐를 위조하면 사형으로 다스렸고, 관청의 세금도 지폐로 받아 지폐의 쓰임을 유지했다. 가볍고 많은 돈을 운반하기 편하다는 점은 멀리 오가는 상인에게 큰 이점이었다. 다만 쿠빌라이는 해외 원정(「원의 일본·베트남·자와 원정(1275~1293)」(뒤의 사건))과 대규모 공사에 드는 비용을 지폐로 메우는 일이 많았다. 이 제도는 정부의 신용에 기대는 것이어서 재정이 무너지면 쉽게 물가를 뒤흔들었다."
  subjects: [yuan]
  tags: [economy]
  sources: ["『원사』 식화지", "『원사』 세조본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-canal-maritime-1282
  year: 1282
  endYear: 1293
  title:
    ko: "대운하의 새 물길과 해운(1282~1293)"
  summary:
    ko: "남송을 무너뜨린 원은 강남의 곡식과 물자를 북쪽의 도읍 대도로 실어 와야 했다. 수 양제 때 만든 대운하는 뤄양을 중심으로 동서로 놓여 있어 대도로 곧장 닿지 않았다. 그래서 원은 산둥을 가로질러 남북으로 곧게 뻗는 새 물길을 팠다. 1283년 제주하를 열었고 1289년 회통하를 이어 대운하의 옛 물길과 연결했으며, 1293년에는 곽수경이 설계한 통혜하가 완성되어 대도 안의 적수담까지 배가 들어올 수 있게 되었다. 이로써 항저우에서 대도로 곧바로 이어지는 남북 운하의 기본 골격이 갖추어졌다. 운하만으로는 물량이 모자랐으므로 1282년부터는 바닷길로 곡식을 나르는 해운도 시작했다. 창장강 하구의 항구에서 출발해 산둥 반도를 돌아 지금의 톈진 부근인 직고로 들어가는 항로였고, 이 항로를 개척한 사람으로 주청과 장훤이 알려져 있다. 해운이 나르는 곡식의 양은 해마다 늘어 운하와 함께 대도의 식량 공급을 떠받쳤다. 이 물길은 뒤 왕조도 이어서 썼다(「베이징 천도와 자금성(1403~1421)」(뒤의 사건)). 대도는 건조한 북쪽에 있어 인구가 늘수록 식량을 강남에서 끌어와야 했다. 대도 성안으로 배가 드는 적수담은 상인과 선박으로 붐비는 시장이 되었다. 곽수경은 대도 서북쪽 산지의 샘물을 끌어와 통혜하의 수량을 대는 방안을 세워 물이 마르지 않게 했다. 해운과 운하는 서로 보완하는 관계였다. 운하는 산둥 구간에서 수위가 낮아 짐을 옮겨 싣는 불편이 있었고, 그래서 해운이 꾸준히 이용되었다. 한편 운하 공사에 동원된 장정과 해운에 필요한 선원은 강남 백성에게 큰 부담이었다. 곽수경은 앞서 수시력을 만든 천문학자이자 수리 기술자였다. 운하에는 물높이를 맞추는 갑문이 여러 곳에 설치되었다. 다만 대운하는 황허강이 물길을 바꿀 때마다 막힐 위험이 있어 치수와 떼어 놓고 생각할 수 없었다."
  subjects: [yuan]
  tags: [economy]
  sources: ["『원사』 하거지", "『원사』 식화지", "『원사』 세조본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: yuan-overseas-campaigns-1275
  year: 1275
  endYear: 1293
  title:
    ko: "원의 일본·베트남·자와 원정(1275~1293)"
  summary:
    ko: "남송을 몰아붙이던 쿠빌라이는 바다 건너 이웃 나라에도 복속을 요구했다. 일본에는 1266년부터 사신을 보냈으나 가마쿠라 막부가 응하지 않았다. 1274년 고려의 배와 군사를 합친 원정군이 하카타만에 상륙했다가 물러났고(「여원 연합군의 일본 원정」(앞의 사건)), 1275년 원이 다시 보낸 사신 두세충 일행은 가마쿠라에서 처형되었다. 1281년 두 번째 원정군은 고려에서 출발한 군대와 강남에서 출발한 군대로 나뉘어 일본으로 갔으나 태풍으로 큰 피해를 입고 물러났다. 이 일에 고려는 배를 만들고 군량을 대는 부담을 졌다. 동남아시아에서도 원군은 싸움을 벌였다. 참파에는 1282년 소게투가 이끄는 군대를 보냈고, 베트남의 쩐 왕조 다이비엣은 1285년 쿠빌라이의 아들 토곤의 침입을 받았다. 1287~1288년 다시 쳐들어온 원군은 1288년 바익당강에서 쩐 흥다오가 강바닥에 말뚝을 박아 배를 막는 계략에 걸려 수군이 크게 졌다. 이후 쩐 왕조는 원에 조공을 바치는 형식으로 관계를 정리했다. 미얀마의 바간 왕국은 원군의 침입이 이어지는 가운데 1280년대 후반 무너졌다. 자와에서는 싱가사리 왕 크르타나가라가 쿠빌라이의 사신 맹기의 얼굴에 글자를 새겨 돌려보냈다고 하며(시기는 1289년이라는 서술과 1292년 초라는 서술이 갈린다), 쿠빌라이는 1292년 원정을 명했다. 그러나 원군이 도착하기 전 크르타나가라는 케디리의 자야카트왕에게 죽었고, 원군은 1293년 자와에 닿아 크르타나가라의 사위 라덴 위자야와 손잡고 자야카트왕을 쳤다. 이후 위자야가 동맹을 뒤집어 원군을 기습하자 원군은 철수했고, 위자야가 마자파힛 왕국을 세웠다. 원군이 실패한 이유로는 바다와 열대 기후에 익숙하지 않았던 점, 보급선이 길어진 점, 현지 세력의 끈질긴 저항이 꼽힌다. 원정에 필요한 배는 고려와 강남에서 만들었으므로 그 부담이 현지 백성에게 돌아갔고, 강남에서는 이런 징발에 맞선 반란이 이어졌다. 일본에서는 이 일을 ‘원구’라 부르며, 방어비와 공을 세운 무사들에 대한 보상 문제가 뒤에 가마쿠라 막부를 약하게 했다고 본다. 이렇게 해외 원정은 대부분 이루지 못한 채 막대한 비용과 사람의 희생만 남겼다."
  subjects: [yuan, japan, goryeo]
  tags: [war, diplomacy]
  sources: ["『원사』 일본전", "『원사』 외이전 안남·자와", "『원사』 세조본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-phagspa-tibetan-buddhism-1253
  year: 1253
  endYear: 1288
  title:
    ko: "쿠빌라이와 파스파: 티베트 불교와 파스파 문자(1253~1288)"
  summary:
    ko: "티베트 불교 사캬파의 승려 파스파는 1253년 쿠빌라이에게 불교 의식(관정)을 베풀며 인연을 맺었다. 쿠빌라이가 몽골 제국의 대칸에 오른 뒤 1260년 파스파를 국사로 삼았고, 파스파는 1269년 몽골어를 비롯한 여러 말을 적을 수 있는 새 문자를 만들어 올렸다. 이 파스파 문자는 티베트 문자를 바탕으로 한 소리글자로, 원 조정의 공식 문자로 반포되었다. 그러나 위구르 문자에서 나온 몽골 문자가 이미 널리 쓰였기 때문에 일상에는 정착하지 못했고, 원이 무너진 뒤에는 거의 쓰이지 않았다. 파스파는 1270년 제사(황제의 스승)로 올려졌고, 이후 사캬파 승려가 제사 자리를 이어 갔다. 원 조정은 티베트 불교를 후원하면서 불교와 티베트 지역 일을 맡을 관청도 두었다. 1260년대에 만든 총제원이 1288년 선정원으로 이름이 바뀌어 티베트의 행정과 군사까지 맡았다. 티베트 안에서는 사캬파 승려들이 원의 후원을 받아 지방 행정을 맡았고, 땅은 만호 단위로 나뉘어 다스려졌다. 원 황실은 도교·이슬람·기독교 등 다른 종교도 함께 대우했지만 티베트 불교를 특별히 높였다. 파스파는 원이 세운 불교 질서의 중심에 있었다. 쿠빌라이는 대도와 상도에 큰 사원을 세우고 승려에게 세금과 부역을 면제해 주었으며, 이 때문에 사원의 재산이 불어났다. 앞서 1258년에는 개평에서 불교와 도교 사이의 논쟁이 열려 도교 쪽이 졌고, 이 일로 도교는 한동안 큰 타격을 입었다. 이런 정책으로 티베트 불교의 승려는 원 황실과 가까워졌지만, 사원에 대한 면세와 후원이 재정에 부담이 된다는 비판도 나왔다. 파스파 문자는 글자 모양이 네모꼴이어서 ‘네모 글자’라 불렸고, 관인과 통행증, 비문 등에 새겨졌다. 파스파 문자와 조선의 훈민정음(「훈민정음 창제와 반포」(뒤의 사건))의 관계는 연구자마다 견해가 갈린다."
  subjects: [yuan, mongol-empire]
  tags: [religion, culture]
  sources: ["『원사』 석로전", "『원사』 세조본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-eurasian-exchange-1277
  year: 1277
  endYear: 1346
  title:
    ko: "원의 동서 교류: 취안저우의 무역과 가톨릭 선교, 이슬람 학술(1277~1346)"
  summary:
    ko: "원은 몽골 제국의 한 부분으로서 유라시아를 잇는 육로와 바닷길이 모두 열려 있었다. 동남 해안의 취안저우는 아랍·페르시아·인도 상인이 드나드는 큰 무역항이었고, 마르코 폴로는 이곳을 ‘자이툰’이라 불렀다(「마르코 폴로의 동방 여행과 『세계의 서술』」(앞의 사건)). 원 조정은 1277년 무렵 취안저우 등 해안 도시에 시박사를 두어 해외 무역을 관리하고 세금을 거두었다. 육로에서는 오르탁이라 불린 상인 조합이 몽골 황실과 귀족의 자금을 받아 장사했다. 몽골은 이슬람 세계의 학술도 받아들였다. 페르시아 출신 학자 자말 앗딘이 1267년 서역의 천문 기구를 만들어 바쳤고, 뒤에 곽수경 등이 만든 수시력에도 이슬람 천문학의 영향이 있었다고 보는 견해가 있다. 서쪽에서는 로마 교황청이 몽골과 접촉하려 했다. 이탈리아 프란치스코회 수사 조반니 다 몬테코르비노는 1290년대 중반 대도에 도착해 선교했고, 1307년 교황 클레멘스 5세에게서 대도 대주교로 임명되었다. 14세기 전반 대도를 찾은 오도릭 같은 수사들의 여행기도 서유럽에 전해졌다. 1340년대에는 모로코 출신의 이븐 바투타가 중국을 다녀왔다고 하나 그의 중국 여정 일부는 사실인지 의심받는다. 무슬림 상인과 학자는 원의 재정과 행정에서도 큰 역할을 했다. 원 조정은 서역의 천문 기구와 이슬람 의학을 받아들였고, 대도에는 이슬람 천문 기관인 회회사천대(1271)가 있었고 이슬람 의학을 맡은 관청도 두었다고 한다. 중국의 인쇄술과 도자기, 차는 서쪽으로 나아가 이란과 이슬람 세계에 알려졌다. 육상 교통은 역참 제도가 이어 주었다. 한편 이 교류망이 질병도 함께 실어 날랐다고 보아, 14세기 중반의 페스트 유행이 이 길을 따라 퍼졌다는 견해가 있다(「흑사병과 유대인 학살」(뒤의 사건))."
  subjects: [yuan, papal-states]
  tags: [economy, culture, religion]
  sources: ["『원사』 식화지", "『원사』 백관지", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: yuan-succession-disputes-1294
  year: 1294
  endYear: 1333
  title:
    ko: "쿠빌라이 이후의 황위 분쟁과 원 중기의 정치(1294~1333)"
  summary:
    ko: "1294년 쿠빌라이가 죽자 손자 테무르(성종, 재위 1294~1307)가 쿠릴타이에서 대칸에 올랐다. 이후 원의 황위는 몽골 귀족의 지지를 얻은 쪽이 차지하는 불안정한 계승이 이어졌다. 테무르의 조카 카이산(무종, 재위 1307~1311)은 동생 아유르바르와다를 황태자로 삼아 형제가 번갈아 잇기로 약속했다. 아유르바르와다(인종, 재위 1311~1320)는 1313년 과거를 되살렸으나 약속과 달리 아들 시데발라에게 황위를 물렸다. 시데발라(영종, 재위 1320~1323)는 개혁을 밀어붙이다 1323년 음력 8월 상도 가까운 남파에서 반대 귀족들에게 살해되었다(남파의 변). 이어 카이산의 사촌 예순 테무르(태정제, 재위 1323~1328)가 올랐다. 그가 1328년 상도에서 죽자 상도의 귀족들은 어린 라기바그(천순제)를 세웠고, 대도의 엘 테무르는 카이산의 아들 투그 테무르(문종)를 내세워 몇 달 동안 내전이 벌어졌다. 대도 쪽이 이기자 투그 테무르는 형 쿠살라(명종)에게 자리를 넘겼으나, 쿠살라는 1329년 즉위 몇 달 만에 죽었고(투그 테무르 쪽이 독살했다고 전한다) 투그 테무르가 다시 올라 1332년까지 다스렸다. 이어 쿠살라의 어린 아들 린첸발(녕종)이 1332년 몇 달 만에 죽고, 1333년 쿠살라의 맏아들 토곤 테무르(순제)가 열세 살로 즉위했다. 황위 분쟁이 잦았던 데에는 몽골 전통의 계승 방식이 영향을 미쳤다. 몽골에서는 칸을 쿠릴타이에서 귀족의 합의로 뽑았고 맏아들 상속이 확립되지 않았다. 원은 중국식으로 황태자를 세웠지만 두 방식이 충돌해 칸 선출을 둘러싸고 귀족 파벌이 끼어들 여지가 컸다. 이런 혼란은 황제의 힘을 약하게 했고 상도와 대도의 대립으로 번졌다. 이렇게 짧은 재위가 잇따르는 동안 권신과 몽골 귀족이 황제를 세우고 가르는 일이 되풀이되어 중앙의 통제력이 약해졌다."
  subjects: [yuan]
  tags: [politics]
  sources: ["『원사』 성종본기", "『원사』 무종본기", "『원사』 영종본기", "『원사』 문종본기", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)"]

- id: yuan-science-drama-1276
  year: 1276
  endYear: 1368
  title:
    ko: "수시력과 원곡, 문인화: 원의 학술과 문화(1276~1368)"
  summary:
    ko: "쿠빌라이는 남송이 항복한 1276년 곽수경·왕순·허형 등에게 새 역법 제작을 맡겼다. 곽수경은 간의 같은 새 관측 기구를 만들어 전국에서 관측했고, 1280년 완성해 1281년부터 시행한 수시력은 1년을 365.2425일로 잡았다. 이 값은 오늘날 쓰는 그레고리력의 평균 길이와 같다. 문학에서는 과거가 오래 열리지 않아 벼슬길이 좁아진 한인 문인 가운데 희곡을 쓰는 사람이 늘었다고 흔히 설명한다. 대도에서는 관한경이 『두아원』을, 왕실보가 『서상기』를, 마치원이 『한궁추』를 지어 원의 잡극이 꽃피었고, 노래만 읊는 산곡도 유행했다. 그림에서는 송 황실의 후손이면서 원 조정에 나아간 조맹부가 옛 서화의 법을 되살렸고, 황공망 등 이른바 원의 사대가가 문인화를 발전시켰다. 장시성 징더전에서는 원대에 청화백자 기술이 발전해 이슬람 세계로도 팔려 나갔다고 한다. 수시력을 만들기 위해 전국 곳곳에 관측소를 세우고 위도에 따른 차이를 쟀다고 전한다(관측소는 27곳이라 한다). 원 조정은 농서 『농상집요』(1273)를 펴내 농업 기술을 보급했고, 왕정은 『농서』(1313)에서 나무 활자로 책을 찍는 방법도 소개했다. 잡극은 보통 네 개의 막으로 이루어지고 한 사람의 주인공이 노래를 맡는 형식이었으며, 문어체 한문이 아닌 구어에 가까운 말을 써서 일반 관객도 즐길 수 있었다. 조맹부의 서체는 ‘송설체’라 불리며 고려와 조선에도 널리 퍼졌다. 황공망은 『부춘산거도』를 여러 해에 걸쳐 그려 1350년 무렵 완성했다고 한다. 한인 문인들은 몽골 지배층과 거리를 두면서 서화와 시문에서 개성을 드러냈다. 고려 충선왕이 대도(연경)에 세운 만권당에서는 조맹부 같은 원의 문인과 고려의 이제현이 교류했다(「만권당 설치」(뒤의 사건))."
  subjects: [yuan, goryeo]
  tags: [culture]
  sources: ["『원사』 역지", "『원사』 곽수경전", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "Morris Rossabi, Khubilai Khan: His Life and Times (University of California Press, 1988)"]

- id: red-turban-1351
  year: 1351
  endYear: 1360
  title:
    ko: "황허강 치수와 홍건적의 난(1351~1360)"
  summary:
    ko: "1344년 황허강이 크게 범람해 물길이 바뀌면서 화이허강 유역과 산둥 일대가 큰 피해를 입었다. 원 조정은 재상 토크토아의 주도로 1351년 음력 4월 농민 15만 명 안팎을 동원해 황허강을 옛 물길로 돌리고 대운하를 이으려 했다(가로의 치수). 지폐를 많이 찍어 물가가 오른 데다 부역까지 겹쳐 민심이 나빠졌고, 백련교 계열의 한산동은 ‘미륵불이 내려오고 명왕이 나타난다’는 말을 퍼뜨렸다. 공사장에서 눈이 하나뿐인 돌 사람이 나왔다는 소문도 돌았다고 전한다. 한산동은 곧 잡혀 처형되었지만 유복통 등이 한산동의 아들 한림아를 피신시키고 붉은 두건을 두르고 싸웠기에 홍건적이라 불렀다. 같은 1351년 후베이에서는 서수휘가 천완 정권을 세웠고, 1353년에는 소금을 밀매하던 장사성이 장쑤에서 일어나 가오유를 차지했다. 원 조정은 토크토아에게 장사성을 치게 했으나 이듬해(1354년) 토크토아가 가오유를 포위하다 해임되는 바람에 원군이 흩어졌다. 이후 원은 지방 군벌에 기대었고, 군벌끼리 다투면서 중앙의 힘은 약해졌다. 1355년 유복통 등은 한림아를 ‘소명왕’으로 세워 송이라는 나라를 열었고, 1360년 서수휘 쪽의 진우량은 서수휘를 죽이고 스스로 황제를 칭했다. 홍건군의 일부는 고려로도 밀려와 1359년 서경을 함락했다(「홍건적의 침입」(뒤의 사건)). 농민 반란은 황허강 치수만이 원인은 아니었다. 14세기 중반 원은 가뭄과 홍수, 역병이 잇따랐고 소금 전매 값과 지폐 남발로 물가가 올라 민생이 어려웠다. 원 조정이 황위 다툼과 권신 사이의 싸움으로 흔들려 대응이 늦은 것도 한몫했다. 홍건군이라는 이름은 같은 계열의 여러 무리를 묶어 부른 것으로, 지도부는 백련교의 종교 조직을 바탕으로 했으나 각 무리의 이념과 전략은 달랐다. 홍건군은 서로 다른 세력이 모인 집단이어서 하나의 정권으로 이어지지는 못했고, 이 가운데서 주원장이 나타났다."
  subjects: [yuan, goryeo]
  tags: [war, society]
  sources: ["『원사』 순제본기", "『원사』 하거지", "『원사』 식화지", "The Cambridge History of China, vol. 6: Alien Regimes and Border States, 907–1368 (Herbert Franke·Denis Twitchett 편, Cambridge University Press, 1994)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: zhu-yuanzhang-rise-1352
  year: 1352
  endYear: 1370
  title:
    ko: "주원장의 입신과 강남 평정, 북벌(1352~1370)"
  summary:
    ko: "주원장은 1328년 안후이 호주(지금의 펑양)의 가난한 농민 집안에서 태어났다. 1344년 가뭄과 역병으로 부모와 형을 잃고 절에 들어가 탁발승으로 떠돌았다. 1352년 호주를 차지한 홍건군 곽자흥 휘하에 들어갔고, 곽자흥의 양녀 마씨와 혼인했다. 곽자흥이 죽은 뒤 군대를 이어받은 주원장은 1356년 음력 3월 집경(지금의 난징)을 차지해 응천부로 이름 짓고 근거지로 삼았다. 이어 1363년 포양호에서 진우량의 큰 수군을 무찔러 창장강 중류를 얻었고, 1364년 오왕을 칭했으며, 1367년 장사성의 근거지 쑤저우를 함락했다. 그해 말 서달과 상우춘에게 북벌을 맡겼다. 주원장은 홍건군의 한림아 정권을 따르던 데서 벗어나 1368년 음력 정월 응천에서 황제 자리에 올라 나라 이름을 대명, 연호를 홍무로 정했다. 북벌군은 산둥과 허난을 차지하고 1368년 음력 8월 초 대도를 함락했다. 원 순제 토곤 테무르는 이에 앞서 대도를 버리고 상도로 달아났고, 1369년 명군이 상도를 차지하자 더 북쪽의 응창으로 물러나 1370년 그곳에서 죽었다. 주원장의 성공 요인으로는 근거지를 난징 일대의 곡창 지대에 두었다는 점이 꼽힌다. 그는 군대의 약탈을 단속하고 유기·송렴·이선장 같은 유학자 참모를 받아들여 점령지를 안정시켰다. 참모 주승이 ‘성을 높이 쌓고 곡식을 넉넉히 쌓으며 왕을 칭하는 것을 늦추라’고 조언했고 이를 따랐다고 전한다. 진우량과 장사성이 서로 견제하는 틈에 차례로 꺾은 것도 승리의 길이었다. 북벌 때 주원장은 북쪽 몽골을 쫓아내고 중화를 되찾는다는 구호를 걸었으나, 명은 항복한 몽골인 군인과 관리도 받아들였다. 이렇게 원의 중국 지배가 끝났고, 몽골 조정은 초원에서 북원으로 이어졌다(「명 건국과 원의 북쪽 이동」(뒤의 사건))."
  subjects: [yuan, ming, northern-yuan]
  tags: [war, politics]
  sources: ["『명사』 태조본기", "『원사』 순제본기", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: hongwu-lijia-weisuo-1368
  year: 1368
  endYear: 1398
  title:
    ko: "홍무제의 통치 체제: 이갑제와 위소제, 황책과 『대명률』(1368~1398)"
  summary:
    ko: "홍무제는 전란으로 줄어든 농민을 안정시키고 세금과 군역을 직접 거둘 틀을 짰다. 호구와 토지를 파악하려고 1381년 전국에 이갑제를 시행하고 호적과 세금 장부인 부역황책을 만들게 했다. 110호를 한 이(里)로 묶어 부유한 10호가 이장호가 되어 해마다 돌아가며 이 안의 세금과 부역을 책임지고, 나머지 100호는 10갑으로 나뉘었다. 황책은 10년마다 고쳐 썼고, 토지는 따로 어린도책에 그려 정리했다. 군사는 위소제로 운영했다. 전략 요지에 위(약 5,600명)를 두고 그 아래 천호소(1,120명)와 백호소(112명)를 두었으며, 병사는 군호로 등록되어 대대로 군역을 이었고 둔전을 일구어 군량을 스스로 마련했다. 이 제도는 주원장이 오왕이던 1364년에 구상되었고 홍무 연간에 전국으로 넓어져 1384년 요지마다 위를 두었다. 법은 1397년 『대명률』로 확정했다. 홍무제는 백성에게 효도와 질서를 가르치는 ‘육유’를 읽어 주게 했다. 호적은 민호·군호·장인호 등으로 나누어 직업을 세습하게 했는데, 이 점에서 원의 제도를 이어받은 면이 있다. 수도는 난징이었고, 한때 고향 가까운 펑양을 도읍으로 삼으려 했으나 1375년 그 계획을 버렸다. 홍무제는 농업 진흥에도 힘썼다. 전란으로 비어 있던 화북과 화이허강 유역에 인구가 많은 강남과 산시(山西)에서 백성을 옮겨 개간하게 했고, 개간한 땅은 개간한 사람의 소유로 인정했다. 또 수리 시설을 고치고 면화 재배를 장려해 농민 생활이 회복되도록 했다. 황책은 누런 표지를 써서 그렇게 불렀다. 홍무 연간의 장부에 올라 있는 인구는 6천만 명 안팎이었으나 세금과 부역을 피해 숨긴 인구가 많아 실제는 더 많았을 것으로 본다. 이 제도들은 가난한 농민 출신인 홍무제가 농촌 사회를 안정시키려는 구상이었으나 신분과 직업을 고정하는 면이 있어 뒤로 갈수록 제도와 현실이 어긋났다."
  subjects: [ming]
  tags: [politics, society]
  sources: ["『명사』 식화지", "『명사』 병지", "『명사』 형법지", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: hu-weiyong-purge-1380
  year: 1380
  endYear: 1393
  title:
    ko: "호유용 옥사와 재상제 폐지, 공신 숙청(1380~1393)"
  summary:
    ko: "홍무제는 즉위 뒤 중서성의 승상(재상)에게 정무를 맡겼으나 황제에게 권력이 모이기를 바랐다. 1380년 음력 1월 좌승상 호유용이 반란을 꾸몄다는 죄목으로 처형되었다. 홍무제는 이 일을 계기로 중서성과 승상 자리를 없애고 6부(이·호·예·병·형·공)를 황제 직속으로 두었다. 군사를 총괄하던 대도독부는 중·좌·우·전·후의 5군도독부로 나누었고 어사대도 고쳤다. 이후 재상을 다시 두자고 하는 신하는 엄벌하라는 뜻을 『황명조훈』에 남겼다고 전한다. 승상이 맡던 일을 황제 혼자 처리할 수 없어 곁에 대학사를 두어 문서를 돕게 했고, 이것이 뒤에 내각으로 자랐다(「영락제의 통치: 내각, 환관 기구, 『영락대전』, 안남 정복(1402~1424)」(뒤의 사건)). 호유용 사건은 한 사람의 처형으로 끝나지 않았다. 호유용과 가깝다는 혐의로 1390년 이선장이 처형되는 등 연루자가 이어져 죽은 사람이 3만~4만 명에 이른다는 추산이 있다. 1393년에는 북원 정벌에 공을 세운 명장 남옥이 모반 혐의로 죽고(남옥의 옥) 연루자 1만 5천 명 안팎이 처형되었다고 『명사』는 전한다. 이 두 사건으로 개국 공신 대부분이 사라졌다. 학자들은 이를 어린 후계자를 지키려고 공신을 미리 정리한 것으로 보기도 하고, 홍무제의 의심이 부른 학살로 보기도 한다. 홍무제가 모든 정무를 직접 처리하겠다고 한 결과 업무량이 폭증했다. 『명사』에 따르면 1384년 음력 9월 14일부터 8일 동안 접수한 문서가 1,660여 건, 정무가 3,391건이었다고 한다. 군사 체제에서도 황제만이 5군도독부와 병부를 통제해 장군이 군사권을 독점하지 못하게 했다. 군대를 부리는 권한은 병부가, 군대를 지휘하는 권한은 도독부가 나누어 가졌고, 전쟁이 나면 황제가 임시로 총병관을 임명해 지휘를 맡겼다. 죄상의 진위는 오늘날까지 불확실하다."
  subjects: [ming]
  tags: [politics]
  sources: ["『명사』 호유용전", "『명사』 남옥전", "『명사』 태조본기", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: hongwu-northern-frontier-1370
  year: 1370
  endYear: 1388
  title:
    ko: "홍무제의 북방 경략: 북원 추격과 요동 위소(1370~1388)"
  summary:
    ko: "토곤 테무르는 1368년 대도를 버리고 달아나 1370년 응창에서 죽었고, 아들 아유시리다라가 카라코룸으로 물러나 몽골 조정은 북원으로 이어졌다(「명 건국과 원의 북쪽 이동」(앞의 사건)). 명은 1370년 서달과 이문충을 보내 북원을 쳐 코케 테무르를 서북 지방에서 꺾고 응창을 차지했다. 그러나 1372년 세 길로 초원에 들어간 명군은 카라코룸 부근에서 코케 테무르의 반격으로 크게 졌다. 이후 명은 대규모 원정을 줄이고 장성 안쪽에서 방어에 중심을 두었다. 홍무제는 아들들을 북쪽 변방의 번왕으로 봉해(진왕 주강·연왕 주체 등) 몽골 방어를 맡겼다. 요동은 원의 요양행성이 다스리던 땅이었는데, 1371년 원의 관리 유익이 명에 귀순하자 명은 요동위지휘사사를 두었다. 그러나 원의 승상 나하추는 북원 세력으로 남아 만주 중서부에서 버텼고, 만주의 여진 여러 부도 나하추의 영향 아래 있었다. 1387년 명은 20만 명이라 전하는 대군을 보내 나하추의 항복을 받아 냈다. 이 무렵 명은 고려에 철령 이북 땅을 요구했고, 고려는 요동 정벌에 나섰다가 위화도에서 회군했다(「요동 정벌과 위화도 회군」(뒤의 사건), 앞서 공민왕도 1370년 요동을 공략한 적이 있다 「공민왕의 요동 공략」(앞의 사건)). 1388년에는 남옥이 부이르 호에서 북원의 토구스 테무르를 크게 무찔러 북원의 칸 자리가 쿠빌라이의 후손에게서 떠났다(「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」(뒤의 사건)). 홍무제가 몽골과의 대규모 전쟁을 줄인 데에는 군수 부담도 있었다. 명은 몽골 초원에서 보급이 어려워 장성 이북에 오래 머물 수 없었다. 그래서 장성 안쪽에 위소를 촘촘히 두어 방어하는 한편 몽골 귀족과 부족장을 회유해 명에 귀순시키기도 했다. 이로써 명은 요동에 안정된 방어선을 얻었지만 몽골 초원은 끝내 지배하지 못했다."
  subjects: [ming, northern-yuan, jurchen, goryeo]
  tags: [war, politics]
  sources: ["『명사』 태조본기", "『명사』 서달전", "『명사』 달단전", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: haijin-tribute-system-1371
  year: 1371
  endYear: 1404
  title:
    ko: "해금과 조공 무역: 홍무 해금에서 감합 무역까지(1371~1404)"
  summary:
    ko: "홍무제는 1371년 연해 백성이 바다로 나가 외국과 사사로이 오가는 것을 금했다. 이 해금은 장사성·방국진의 옛 잔당과 왜구가 해안을 어지럽혔던 사정에서 나왔다(「왜구의 본격적인 침입」(앞의 사건)). 외국과의 교역은 명이 인정한 나라의 사절이 황제에게 조공하고 그 대가로 하사품을 받는 형식으로만 허용했고, 이를 조공 체제라 부른다. 1374년에는 해상 무역을 관리하던 시박사를 폐지했다. 조공은 나라마다 횟수와 입항지를 정했고, 이를 확인하려고 감합이라는 증표를 쓰게 했다. 영락제는 즉위한 이듬해인 1403년 닝보·취안저우·광저우에 시박사를 다시 두어 조공 사절의 입항과 거래를 맡겼다. 일본의 무로마치 막부 쇼군 아시카가 요시미쓰도 사신을 보내 조공 관계를 맺었고, 1404년 영락제 때 감합을 쓰는 일본과의 무역이 갖추어졌다. 조선은 명에 사신을 보내 책봉과 조공의 관계를 맺었는데(「명의 책봉과 사대 관계」(뒤의 사건)), 이는 바닷길 무역과는 별개의 외교 관계였다. 해금은 민간 상인의 해외 무역을 막았으므로 오히려 밀무역과 해적을 키우는 원인이 되었다는 비판도 받는다. 조공 사절을 맞는 항구는 제한되어, 일본 사절은 닝보, 류큐 사절은 취안저우, 동남아시아와 서쪽 바다의 사절은 광저우로 들어오게 했다. 조공 무역에서는 명이 주는 하사품의 값이 바치는 공물보다 큰 경우가 많아 명의 재정에 부담이 되었다. 사절이 공물 말고 사사로이 가져온 물건은 관이 정한 값으로 사들이는 부대 무역이 따랐다. 해금의 효과는 의도와 달랐다. 연해 주민은 어업과 해상 무역으로 살아가는 사람이 많아 금지령에도 몰래 바다로 나갔고, 단속이 느슨할 때는 크게 번졌다. 이 모순은 뒤에 왜구 문제로 크게 터져 나온다(「가정 연간의 왜구와 해금 완화(1523~1567)」(뒤의 사건))."
  subjects: [ming, japan, joseon]
  tags: [diplomacy, economy]
  sources: ["『명사』 식화지", "『명사』 일본전", "『명사』 태조본기", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 8: The Ming Dynasty, 1368–1644, Part 2 (Denis Twitchett·Frederick W. Mote 편, Cambridge University Press, 1998)"]

- id: jingnan-campaign-1398
  year: 1398
  endYear: 1402
  title:
    ko: "건문제의 삭번과 정난의 변(1398~1402)"
  summary:
    ko: "홍무제는 맏아들 의문태자 주표가 1392년 먼저 죽자 손자 주윤문을 후계자로 삼았고, 1398년 예순아홉 살로 죽었다. 주윤문이 명의 두 번째 황제 건문제로 즉위했다. 젊은 황제는 제태·황자징 등의 건의에 따라 삭번, 곧 제후왕의 권력을 줄이는 일을 시작했다. 1399년 주왕·대왕·제왕·민왕 등이 차례로 폐위되었고 상왕은 불을 질러 자결했다. 홍무제의 넷째 아들로 북쪽 변방을 지키던 연왕 주체에게 이는 큰 위협이었다. 주체는 승려 요광효(도연)의 조언을 받아 1399년 음력 7월 북평(지금의 베이징)에서 황제를 흐리게 하는 간신을 없앤다며 군사를 일으켰다. 그의 군대는 이 거병을 ‘정난(난을 바로잡음)’이라 불렀다. 북방 방어로 단련된 군대는 허베이와 산둥에서 몇 해 동안 공방을 벌였고, 조정군은 병력이 많았으나 지휘가 흔들렸다. 1402년 연왕군은 대운하의 요새를 피해 양저우를 차지하고 창장강을 건너 난징으로 진격했다. 음력 6월 13일(양력 7월 13일) 금천문이 열려 난징이 함락되었고 궁궐에 불이 났다. 건문제는 불길 속에서 행방을 알 수 없게 되었는데, 궁에서 죽었다는 설과 승려로 달아났다는 설이 엇갈린다. 연왕 주체는 6월 17일(양력 7월 17일) 즉위해 연호를 영락으로 정했다. 방효유가 즉위 조서를 쓰기를 거부하다 처형되는 등 건문제의 신하 여럿이 죽었고, 건문이라는 연호는 기록에서 지워졌다. 건문제의 정책은 번왕의 힘을 줄이는 한편 홍무제의 가혹한 법을 누그러뜨리는 것이었다. 건문제는 세금을 줄이고 형벌을 완화했으며 유학자 신하를 중용했다. 그러나 번왕 문제를 급하게 다룬 것이 판단의 약점으로 꼽힌다. 연왕군의 승리에는 건문제 조정에서 홀대받은 환관 일부가 허술한 방비를 알려 주었다는 전승도 한몫했다. 정난의 변은 황실 안의 찬탈이었고, 이후 영락제의 정치는 베이징 천도와 환관 중용으로 이어졌다."
  subjects: [ming]
  tags: [war, politics]
  sources: ["『명사』 혜제본기", "『명사』 성조본기", "『명사』 방효유전", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: yongle-rule-1402
  year: 1402
  endYear: 1424
  title:
    ko: "영락제의 통치: 내각, 환관 기구, 『영락대전』, 안남 정복(1402~1424)"
  summary:
    ko: "영락제는 정난의 변 뒤 중앙 통치 구조를 손보았다. 즉위한 1402년 해진·양사기 등 한림원 학사를 뽑아 황제 곁에서 문서를 돕게 한 내각, 곧 대학사 제도를 정식으로 두었다. 이는 승상이 없는 상태에서 황제를 돕는 기구로 자라나 뒤에는 사실상 재상 구실을 하게 되었다(「호유용 옥사와 재상제 폐지, 공신 숙청(1380~1393)」(앞의 사건)). 한편 영락제는 환관을 믿고 써서 정화 같은 환관이 외국 사절과 군 감독에 나섰고, 1420년에는 황제 직속의 특수 정보·사찰 기구인 동창을 설치했다. 편찬 사업으로는 해진 등이 이끈 『영락대전』이 1407년에서 1408년 사이에 완성되었다. 2만 2천 권이 넘는 거대한 백과전서로, 지금은 일부만 전한다. 대외로는 쩐 왕조를 무너뜨린 호꾸이리 부자를 친다며 1406년 말 안남에 군대를 보내 1407년 교지를 두어 직접 다스렸다(「명의 교지 지배와 람선 봉기」(뒤의 사건)). 조선은 1401년 건문제의 책봉을 받았고(「명의 책봉과 사대 관계」(앞의 사건)), 영락제 때 조선과의 조공 관계가 이어졌다. 몽골 원정과 정화의 항해로 영락제는 조공 체제를 넓혀 나갔다. 1415년에는 대운하 정비가 끝나 강남의 곡식이 베이징까지 곧바로 오르게 되었다. 영락제는 유학 이념도 정비했다. 『오경대전』·『사서대전』·『성리대전』을 편찬해(1415) 과거의 표준 해석으로 삼았고, 이는 성리학이 국가 이념으로 자리 잡는 데 큰 역할을 했다. 이 책들은 조선에도 전해져 성리학 교육에 쓰였다. 영락제는 건문제 때의 신하 가운데 따르지 않는 이를 엄하게 처벌하는 한편 과거로 새 인재를 뽑아 정부를 채웠다. 영락제의 이런 정책은 막대한 재정이 들어 백성의 부담이 컸고, 정난의 변으로 황제가 된 정통성의 약점을 대외 팽창과 대규모 사업으로 덮으려 했다는 평가도 있다."
  subjects: [ming, joseon]
  tags: [politics, culture]
  sources: ["『명사』 성조본기", "『명사』 해진전", "『명사』 안남전", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: beijing-capital-1403
  year: 1403
  endYear: 1421
  title:
    ko: "베이징 천도와 자금성(1403~1421)"
  summary:
    ko: "베이징은 연왕 주체의 근거지 북평이었다. 영락제는 즉위한 이듬해인 1403년 북평을 베이징으로 올리고 북평부를 순천부로 고쳐 북쪽의 수도로 삼고 남쪽 난징과 더불어 두 수도 체제로 두었다. 북쪽 몽골의 위협을 가까이서 막고, 자신의 세력 기반을 도읍으로 삼으며, 대운하가 정비되면 강남의 곡식도 보낼 수 있다는 판단이 있었다. 1406년 건설을 준비하기 시작해 1417년 무렵부터 본격적으로 먼 산지에서 목재와 돌을 실어 와 궁성인 자금성을 짓고 1420년 마쳤다. 도성은 원의 대도 터에 기대어 새로 쌓았고, 남북으로 뻗은 중심축을 따라 궁성·황성·성곽을 겹겹이 두르는 틀을 갖추었다. 1421년 정월 베이징을 정식 수도로 삼고 새 궁에서 조회를 열었다. 같은 1421년 화재로 궁 안의 큰 전각이 불타 복구가 정통 연간까지 이어졌다. 난징은 배도로 남겨 6부 같은 관청을 두었다. 이 천도로 도읍이 강남에 가까운 난징에서 변방에 가까운 북쪽으로 옮겨졌다. 천도에는 반대도 있었다. 일부 신하는 북쪽 변방에 도읍을 두면 곡식과 물자를 나르는 부담이 크다고 보았다. 베이징 천도로 대운하의 중요성은 훨씬 커졌고, 해마다 수백만 석의 곡식이 강남에서 베이징으로 올라갔다. 궁성 공사에는 수십만 명의 장인과 부역 노동자가 동원되었다고 한다. 황제와 도읍이 변경 가까이 있으면 방어는 단단해지지만 몽골이 쳐들어올 때 도읍이 곧바로 위협받는 약점도 있었다. 실제로 뒤에 몽골군이 베이징 성 밖까지 이르렀다(「토목의 변과 베이징 방어전, 탈문의 변(1449~1457)」(뒤의 사건), 「알탄 칸의 약탈과 경술의 변, 융경 화의(1542~1571)」(뒤의 사건)). 황제가 몽골과 맞닿은 최전선에서 직접 방어를 맡는다는 뜻이 컸지만, 곡식과 군수 물자를 멀리서 실어 오는 비용과 부담도 커졌다."
  subjects: [ming, mongols]
  tags: [politics]
  sources: ["『명사』 성조본기", "『명사』 지리지", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: yongle-mongol-campaigns-1409
  year: 1409
  endYear: 1424
  title:
    ko: "영락제의 몽골 원정(1409~1424)"
  summary:
    ko: "북원이 무너진 1388년 뒤 몽골 초원에서는 동쪽의 타타르(달단)와 서쪽의 오이라트가 자리를 놓고 다투었고, 명은 이들을 번갈아 달래고 쳤다. 명은 오이라트의 마하무에게 왕 칭호를 주어 타타르를 견제하게 했다. 1409년 명 사신이 타타르 칸 본야시리에게 살해된 뒤 구복이 이끈 군대가 크게 지자, 영락제는 이듬해 직접 군대를 이끌고 나섰다. 1410년 봄 영락제는 오논강 부근에서 본야시리를 꺾었다. 이어 오이라트의 마하무가 힘을 키우자 1414년 두 번째 친정에서 툴라강 부근에서 그를 격파했다. 이후 1422년·1423년·1424년에는 타타르의 아루타이를 쫓아 세 차례 더 나섰으나 적을 결정적으로 꺾지 못했다. 몽골 군은 명군이 오면 초원 깊숙이 물러나 맞싸움을 피했고, 명군은 곡식을 멀리서 실어 와야 해서 군량 소모가 컸다. 영락제는 1424년 음력 7월 마지막 원정에서 돌아오던 길에 위무촨에서 죽었다. 몽골은 명과 싸우는 한편 조공과 교역을 통해 필요한 물자를 얻으려 했고, 이 때문에 전쟁과 교섭이 번갈아 되풀이되었다. 몽골 쪽 사정도 복잡했다. 타타르 칸 본야시리는 칭기즈 칸 가계의 계승자로 인정받고 있었고 오이라트는 칸 가계가 아닌 세력이었다. 영락제는 힘이 커진 쪽을 번갈아 치는 방식으로 균형을 유지하려 했다. 원정마다 막대한 병력과 수레가 동원되었고 민간의 부담이 컸다. 한편 동북에서는 영락제가 여진 여러 부에 위소를 두어 명의 관직을 주었다. 1409년에는 헤이룽강 하류에 노아간도사를 설치했고, 환관 이시하가 이곳으로 거듭 파견되었다. 영락제는 친정에서 화기를 쓰는 신기영과 기병을 함께 편성했다. 결국 이 원정은 몽골의 위협을 영구히 없애지 못한 채 재정 부담만 남겼고, 그 뒤 명의 북쪽 방어는 공격에서 장성 안쪽의 수비로 기울어 갔다."
  subjects: [ming, mongols]
  tags: [war]
  sources: ["『명사』 성조본기", "『명사』 달단전", "『명사』 와랄전", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: zheng-he-voyages-1405
  year: 1405
  endYear: 1433
  title:
    ko: "정화의 항해(1405~1433)"
  summary:
    ko: "정화는 윈난 출신의 무슬림으로, 어린 나이에 연왕 주체의 휘하에 들어온 환관이다. 정난의 변 때 공을 세워 정씨 성을 받았다고 전한다. 그는 영락제의 명으로 1405년 음력 6월 쑤저우 부근 류자강에서 첫 항해를 떠났다. 『명사』에 따르면 첫 함대는 큰 배 62척에 2만 7,800여 명이 탔다. 이후 1433년까지 모두 일곱 차례의 항해가 이어졌다. 함대는 참파·자와·시암을 거쳐 말라카 해협, 스리랑카, 인도 서해안의 캘리컷, 페르시아만 입구의 호르무즈, 아프리카 동안까지 닿았다. 1407년 팔렘방에서는 화교 해적 진조의를 사로잡았고, 스리랑카에서는 현지 왕과 부딪쳐 알라케슈바라 왕을 붙잡아 명으로 데려왔다. 항해의 목적은 영락제의 위세를 알리고 여러 나라의 조공을 받는 것이었다고 흔히 설명한다. 건문제를 찾으려 했다는 설도 있으나 확실하지 않다. 함대는 식민지를 세우는 대신 조공 사절을 이끌고 오는 외교·무역 사절단의 성격이 컸다. 통역으로 따라간 마환은 『영애승람』(1416년 서문)을 남겨 각지의 풍속을 기록했다. 보물선의 크기는 소설에는 길이 100m를 훌쩍 넘는다고 나오지만 학자들은 60~75m 안팎으로 본다. 홍희제가 1424년 항해를 멈추게 했으나 선덕제가 1430년 마지막 항해를 명해 함대가 그해 윤12월(양력 1431년 1월) 떠나 1433년 돌아왔다. 정화는 1433년 무렵 돌아오는 길에 캘리컷 부근에서 죽었다는 설이 있으나 그 뒤에도 얼마간 더 살았다는 설도 있다. 항해에는 나침반과 천문 항법, 물이 새어도 배가 가라앉지 않게 칸막이를 친 구조 같은 기술이 쓰였다고 한다. 함대는 계절풍에 맞추어 겨울에 인도양으로 건너가 이듬해 여름에 돌아오는 일정을 따랐다. 기록으로는 마환의 책 외에 비신의 『성사승람』, 공진의 『서양번국지』가 있다. 항해가 이어지지 못한 이유로는 재정 부담과 북방 방어를 먼저 하자는 주장, 유학자 관료들의 반대가 꼽힌다."
  subjects: [ming]
  tags: [diplomacy, economy]
  sources: ["『명사』 정화전", "『명사』 성조본기", "마환, 『영애승람』", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: hongxi-xuande-1424
  year: 1424
  endYear: 1435
  title:
    ko: "홍희제와 선덕제의 치세: 인선의 치(1424~1435)"
  summary:
    ko: "영락제가 죽은 뒤 맏아들 주고치가 홍희제로 즉위했으나 이듬해인 1425년 음력 5월 병으로 죽었다. 재위는 1년이 채 못 되었지만 그는 정화의 항해를 멈추게 하고 세금을 줄이고 백성을 구휼하는 정책을 폈다고 평가받는다. 맏아들 주첨기가 선덕제(재위 1425~1435)로 즉위했다. 1426년 숙부 한왕 주고후가 반란을 일으키자 선덕제는 직접 군대를 이끌고 가서 곧 평정했다. 1427년에는 베트남의 레러이가 이끄는 람선 봉기에 밀려 교지에서 물러났다(「명의 교지 지배와 람선 봉기」(앞의 사건)). 북방에서는 영락제처럼 몽골 깊숙이 쳐들어가지 않고 장성 안쪽의 방어를 중시했으며, 1430년 개평위를 남쪽으로 물렸다. 내각의 대학사 양사기·양영·양부(삼양)가 정무를 도왔다. 환관에게 글을 가르치는 내서당이 1426년 설치되어, 글을 아는 환관이 황제의 문서 처리를 거들 바탕이 되었다. 선덕제는 1435년 서른다섯 살로 죽었고, 만 일곱 살의 어린 아들 주기진이 정통제로 즉위했다. 홍희제는 황태자로서 영락제가 출정한 동안 감국을 맡아 정무를 보았다. 즉위 직후 건문제의 충신 가족을 사면하고 영락제 때 억울하게 처벌된 신하들을 풀어 주었으며 국고를 풀어 구휼했다. 베이징에서 난징으로 도읍을 되돌리려는 뜻도 보였다고 한다. 선덕제는 서화에 뛰어나 직접 그림을 그렸고 선덕로로 이름난 공예도 발전했다. 어린 정통제가 즉위했을 때에는 장태황태후와 삼양이 나라를 이끌었다. 선덕제는 어려서부터 영락제의 총애를 받아 황태손으로 길러졌고, 홍희제는 황태자 시절부터 문신 양사기 등과 정무를 의논했다. 이 시기를 흔히 ‘인선의 치’(홍희제와 선덕제 치세)라 부르며 안정과 번영의 시기로 평가하지만, 환관의 권한이 커지고 대외 팽창이 멈추는 전환점이기도 했다."
  subjects: [ming]
  tags: [politics]
  sources: ["『명사』 인종본기", "『명사』 선종본기", "Edward L. Dreyer, Early Ming China: A Political History, 1355–1435 (Stanford University Press, 1982)", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]

- id: tumu-crisis-1449
  year: 1449
  endYear: 1457
  title:
    ko: "토목의 변과 베이징 방어전, 탈문의 변(1449~1457)"
  summary:
    ko: "15세기 중엽 몽골 초원 서쪽의 오이라트를 이끈 에센 타이시는 동쪽의 타타르와 여진, 서쪽의 하미까지 세력을 넓혔다. 에센은 조공 사절의 규모를 부풀려 하사품과 말값을 더 받으려 했고, 명이 사절 수와 하사품을 줄인 데다 아들과 공주의 혼인 요청까지 거절당하자 이를 불씨로 1449년 음력 7월 명을 침공했다. 정통제는 환관 왕진의 권유로 직접 군대를 이끌고 나섰다. 『명사』는 50만 명이라 하나 실제 규모는 훨씬 작았을 것으로 본다. 정통제는 다퉁에서 되돌아오던 중 토목보에서 포위되었다. 1449년 음력 8월 15일(양력 9월 1일) 명군은 크게 무너지고 왕진은 죽었으며 정통제는 포로가 되었다. 명 조정은 정통제의 동생을 경태제로 세웠고, 병부시랑 우겸이 남쪽으로 도읍을 옮기자는 주장을 물리쳤고, 곧 병부상서가 되어 베이징을 지켰다. 에센은 정통제를 앞세워 음력 10월 11일(양력 10월 27일) 베이징 성 밖에 이르렀으나 닷새 가까이 이어진 공방에서 이기지 못하고 물러났다. 에센은 1450년 정통제를 놓아 주었고, 정통제는 궁에 갇혀 지냈다. 에센은 1453년 칭기즈 칸 가계가 아니면서 스스로 칸을 칭하다 반발을 사서 1454~1455년 무렵 살해되었다. 1457년 음력 1월 경태제가 병든 틈에 장군들이 정통제를 다시 세우는 탈문의 변이 일어나 정통제는 천순제로 복위했고 우겸은 처형되었다. 토목의 변 직전 명군은 오랜 평화 속에서 군기가 풀려 있었고, 황제와 환관의 독단으로 준비 없이 출정했다. 퇴각 길을 두고 왕진이 계획을 바꾸는 바람에 행군이 지체되어 오이라트군에 따라잡혔다는 이야기가 전하고, 고향 울주(지금의 허베이성 위셴)를 들르려 했다는 설도 있다. 우겸은 정통제를 인질로 한 협박을 막으려 새 황제를 세웠고, 성문을 닫고 민병과 지방군을 모아 베이징 방어를 이끈 점으로 높이 평가받는다. 토목의 변은 명이 북방에서 공세를 접고 장성을 쌓고 수비하는 쪽으로 기우는 계기가 되었다."
  subjects: [ming, mongols]
  tags: [war, politics]
  sources: ["『명사』 영종전기·후기", "『명사』 와랄전", "『명사』 우겸전", "The Cambridge History of China, vol. 7: The Ming Dynasty, 1368–1644, Part 1 (Frederick W. Mote·Denis Twitchett 편, Cambridge University Press, 1988)"]
