- id: paris-1763
  year: 1763
  endYear: 1764
  title:
    ko: "1763년 파리 조약과 퀘벡 주·영국령 플로리다(1763~1764)"
  summary:
    ko: "1763년 2월 10일 파리에서 영국·프랑스·스페인이 7년 전쟁을 끝내는 조약을 맺었다(포르투갈도 같은 날 합의했고 유럽 쪽은 「외교 혁명과 7년 전쟁」(앞의 사건)을 본다). 프랑스는 캐나다와 케이프브레턴섬, 미시시피강 동쪽 루이지애나(뉴올리언스 섬은 빼고)를 영국에 넘겼고, 이로써 누벨프랑스 캐나다와 프랑스령 루이지애나는 사라졌다. 스페인은 플로리다를 영국에 넘겼고, 프랑스는 뉴펀들랜드 연안 어업권과 생피에르·미클롱을 지켰으며 과들루프·마르티니크에 더해 생뤼시도 되찾았고, 영국은 그레나다 말고도 도미니카·세인트빈센트·토바고를 얻었다. 가톨릭 신앙은 영국 법이 허락하는 범위에서 인정되었고 프랑스계 주민은 18개월 안에 떠날 수 있었으나 떠난 이는 적었다. 영국 하원은 1762년 12월 9일 윌리엄 피트의 반대에도 예비 조약을 319 대 65(자료에 따라 64)로 받아들였다. 폰티악 전쟁의 시작은 「1763년 선언과 폰티악 전쟁, 스탠윅스 요새 조약(1763~1768)」(뒤의 사건)을 본다. 같은 해 10월 7일 선언은 새 영토를 나누어 퀘벡 주(세인트로렌스강 둘레의 좁은 땅)와 동플로리다·서플로리다로 이루어진 영국령 플로리다, 그레나다를 세웠고 래브라도 해안을 뉴펀들랜드 총독의 관할에 두었다. 1764년 8월 제임스 머리가 퀘벡 주의 첫 민정 총독으로 부임했고, 플로리다에 살던 스페인 주민 3천 명 안팎은 쿠바로 떠났다. 한편 미시시피강 서쪽 땅은 이름뿐 프랑스 몫으로 남았으나 이미 1762년 비밀 조약으로 스페인에 넘겨진 뒤였다. 그 일은 「영국의 아바나 점령과 퐁텐블로 조약(1762~1763)」(앞의 사건)을 본다."
  subjects: [new-france-canada, french-louisiana, province-of-quebec, british-florida, newfoundland, uk, france, spain]
