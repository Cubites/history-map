# 아메리카 사건 2묶음 갈래 04b: 제국의 재편과 7년 전쟁, 열세 식민지의 끝 (1712 ~ 1775년)
# 범위: 크로자의 특허와 뉴올리언스, 누에바그라나다 부왕령의 설치·폐지·재설치, 그린란드의 덴마크-노르웨이 식민, 모스키토 왕국, 베링의 알래스카 항해, 후안 산토스의 봉기, 마드리드 조약과 과라니 전쟁, 스페인의 북쪽 변경, 폼발의 아마존 개혁, 오하이오 영토와 올버니 회의, 아카디아인 추방과 루이스버그, 퀘벡 함락, 카를로스 3세의 개혁, 아바나 점령과 퐁텐블로 조약, 1763년 파리 조약, 1763년 선언, 포클랜드 제도, 인지세법에서 보스턴 학살까지, 보스턴 차 사건에서 대륙 회의까지, 퀘벡 법(1712~1775 전체).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자).
# 날짜: 1582년 10월 개력 뒤라 스페인·포르투갈·프랑스 날짜는 모두 그레고리력이다. 영국과 영국 식민지의 1752년 앞 날짜는 위키백과 정보 상자를 따랐고 확실하지 않은 날은 달까지만 적었다. 러시아 날짜(베링)는 율리우스력이라 그렇게 밝혔다. 확실하지 않은 날짜는 '무렵', 원주민 구전·학설이 갈리는 숫자는 '추산'으로 적었다.
# 이름 규칙: 항목 이름(누에바그라나다 부왕령·모스키토 왕국·마라냥 주·퀘벡 주·영국령 플로리다·스페인령 루이지애나·인디언 보호지·열한 식민지 등)을 본문에 그대로 썼다. 이름이 바뀐 나라(그랑파라·마라냥 주 → 마라냥 주)는 처음에 함께 밝혔다.
# 지도 결정과의 관계: 점령(아바나 1762~1763 등)은 글로만 다뤘고, 분쟁 띠와 원주민 땅(오하이오·애팔래치아 서쪽)은 일어난 일을 사실대로 적었으며, 로드아일랜드·델라웨어는 항목이 없어 이름만 적었다.
# 한국사와 닿는 점: 없음.
# 가리킨 기존 사건: 「위트레흐트 조약과 라슈타트 조약」, 「오스트리아 왕위 계승 전쟁」, 「외교 혁명과 7년 전쟁」, 「미국 독립 혁명과 유럽」, 「하프르스피오르(872 무렵)에서 그린란드(985 무렵)까지: 노르웨이 왕국과 북대서양의 정착」, 「콜럼버스와 다가마, 신항로 개척」.

- id: louisiana-crozat-1712
  year: 1712
  endYear: 1722
  title:
    ko: "크로자의 특허와 미시시피 회사, 뉴올리언스 건설(1712~1722)"
  summary:
    ko: "1712년 9월 루이 14세는 부유한 금융가 앙투안 크로자에게 15년 동안 루이지애나의 무역을 독점하는 특허를 주었다. 특허가 가리킨 땅은 미시시피강 유역과 일리노이 땅까지 아우르는 프랑스령 루이지애나였으나 이주민은 수백 명에 그쳐 크로자는 이익을 거의 얻지 못했다. 1713년 앙투안 로메 드 라모트 카디야크가 총독으로 건너와 1716년까지 일했고(그 뒤 장바티스트 르무안 드 비엔빌이 1716~1717년, 장미셸 드 레피네가 1717~1718년, 비엔빌이 다시 1718~1724년 총독이었다), 1714년 루이 쥐셰로 드 생드니는 레드강 가에 지금 루이지애나주에서 가장 오래된 정착지 나치토치스를 세워 스페인령 텍사스와 교역하는 길을 열었다. 프랑스의 서쪽 진출을 경계한 누에바에스파냐 부왕령은 1716년 도밍고 라몬의 원정대를 보내 동텍사스에 선교 마을을 다시 세웠고, 같은 해 비엔빌은 미시시피강 가 나체즈 사람들의 땅에 로잘리 요새를 세웠다. 크로자는 1717년 특허를 국왕에게 돌려주었고, 스코틀랜드 출신 금융가 존 로가 이끈 서방 회사(1719년 인도 회사로 합쳐져 흔히 미시시피 회사라 부른다)가 25년 독점권을 받았다. 1718년 비엔빌은 강이 크게 휘어 홍수를 피하기 좋은 곳에 뉴올리언스를 세웠고, 1719년 6월 첫 아프리카 노예선들(오로르호·뒤크뒤멘호)이 닿아 이 땅의 노예제가 시작되었다(오로르호는 200명가량을 내렸다). 회사 주식에 몰린 투기는 1719~1720년 '미시시피 거품'으로 부풀었다가 1720년 무너졌고 총독부는 1720년 빌럭시로, 1722년(자료에 따라 1723년) 뉴올리언스로 옮겼다. 이 땅에는 나체즈·초크토·치카소 같은 원주민이 살았고 프랑스는 이들과 동맹·교역·충돌로 얽혔다. 앞의 일은 「마르케트·졸리와 라살의 미시시피강, 프랑스령 루이지애나의 시작(1673~1699)」(앞의 사건)을 본다."
  subjects: [french-louisiana, new-spain-viceroyalty, france]
  links:
    - { from: france, to: french-louisiana, note: "1712년 크로자에게 15년 무역 독점 특허를 주고 식민지 경영을 맡김" }
  tags: [politics, economy, society]
  sources: ["W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)", "Marcel Giraud, A History of French Louisiana, vol. 1: The Reign of Louis XIV, 1698–1715 (Louisiana State University Press, 1974)", "Daniel H. Usner Jr., Indians, Settlers, and Slaves in a Frontier Exchange Economy (University of North Carolina Press, 1992)"]

- id: new-granada-1717
  year: 1717
  endYear: 1723
  title:
    ko: "누에바그라나다 부왕령의 첫 설치와 폐지(1717~1723)"
  summary:
    ko: "1717년 5월 27일 스페인 왕 펠리페 5세는 칙령으로 누에바그라나다 부왕령을 세워 수도를 보고타(산타페데보고타)에 두었다. 이 부왕령은 지금의 콜롬비아와 에콰도르, 아마존 쪽 마이나스 지방을 아울러 리마의 페루 부왕령에 속하던 북쪽 땅을 따로 떼어 낸 것이었다. 스페인 왕위 계승 전쟁(1701~1714)을 이긴 부르봉 왕가의 펠리페 5세가 식민지 행정을 손보던 때였고, 카리브해 연안의 밀무역과 외국 선박의 위협을 막고 먼 리마를 거쳐야 하던 행정을 줄이려는 뜻이 있었다고 본다. 부왕령에는 1549년에 세워진 산타페데보고타 아우디엔시아와 키토 아우디엔시아가 속했고, 이 가운데 보고타의 아우디엔시아는 1723년부터 1739년까지 다시 페루 부왕령 아래에 있었다. 이 땅에는 안티오키아와 초코의 금광, 카르타헤나 항구, 보고타 고원의 오랜 원주민 마을이 있었고 아프리카에서 끌려온 노예가 금광과 항구에서 일했다. 첫 부왕 안토니오 이그나시오 데 라 페드로사 이 게레로는 1718년 6월 13일 자리에 올랐고 호르헤 데 비야롱가가 1719년 11월 25일 이어받았다. 그러나 이 새 부왕령은 재정이 모자라 운영하기 어려웠고 1723년 11월 5일 폐지되어 땅은 다시 페루 부왕령의 관할로 돌아갔다(한 목록은 비야롱가의 임기를 1724년 5월까지로 적어 마무리가 이듬해까지 이어졌음을 보여 준다). 같은 때 리마의 페루 부왕령에서 북쪽 땅이 떼어졌고, 멕시코시티의 누에바에스파냐 부왕령과는 카리브해 쪽에서 이웃했다. 부왕령이 다시 서는 것은 1739년의 일로, 「누에바그라나다 부왕령의 재설치와 카르타헤나 포위(1739~1741)」(뒤의 사건)에서 다룬다."
  subjects: [new-granada-viceroyalty, peru-viceroyalty, new-spain-viceroyalty]
  links:
    - { from: spain, to: new-granada-viceroyalty, note: "1717년 칙령으로 부왕령을 세움" }
  tags: [politics, society]
  sources: ["Anthony McFarlane, Colombia before Independence: Economy, Society, and Politics under Bourbon Rule (Cambridge University Press, 1993)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "John Lynch, Bourbon Spain 1700–1808 (Basil Blackwell, 1989)"]

- id: egede-1721
  year: 1721
  endYear: 1736
  title:
    ko: "한스 에게데와 덴마크-노르웨이의 그린란드 식민(1721~1736)"
  summary:
    ko: "노르웨이 목사 한스 에게데는 오래전부터 그린란드에 가서 옛 노르드 사람들의 후손을 찾고 선교하겠다는 계획을 덴마크-노르웨이 왕 프레데리크 4세에게 올렸고, 베르겐 상인들이 돈을 대고 왕이 허락해 1721년 5월 2일 베르겐을 떠나 7월 3일 지금의 누크 가까운 만에 닿았다. 그는 가족과 함께 캉에크섬에 희망 식민지를 세웠지만 찾던 노르드 사람들은 만나지 못했고, 그곳에 살던 원주민 이누이트와 만났다. 이누이트는 바다표범과 고래를 사냥하며 살았고 17세기부터 네덜란드 등의 포경선과 연안에서 물물교환을 해 온 터라 유럽 사람이 아주 낯설지는 않았다. 에게데는 선교와 함께 교역소를 열어 고래 기름·모피와 유럽 물건을 맞바꾸게 하려 했으나 장사는 오래 적자였다. 중세 노르드 사람들의 정착지는 15세기 초 무렵 기록이 끊겼다(「하프르스피오르(872 무렵)에서 그린란드(985 무렵)까지: 노르웨이 왕국과 북대서양의 정착」(앞의 사건)을 본다). 에게데는 1723년 옛 동쪽 정착지의 폐허를 보았으나 서쪽 정착지로 잘못 알았다. 1728년 클라우스 파르스 소령의 왕실 원정대가 식민지를 본토로 옮겨 고트호브 요새를 세웠고 이곳이 지금의 누크가 되었다. 1730년 왕이 군대를 거두어 가자 식민지는 위태로워졌다. 1733년 배가 천연두를 싣고 와 1734년 이누이트 사이에 번졌고 아내 거트루드 라스크도 1735년 병으로 죽었다. 에게데는 1736년 아내의 시신을 안고 덴마크로 돌아갔다. 이렇게 덴마크-노르웨이는 그린란드 서남 해안에 선교와 모피·고래 교역의 거점을 두었고, 이 땅은 오늘날까지 덴마크 왕국과 이어진 그린란드 역사의 첫머리가 되었다."
  subjects: [greenland, denmark-norway]
  links:
    - { from: denmark-norway, to: greenland, note: "1721년 에게데의 선교·무역 식민지를 세워 그린란드 서남 해안을 차지하기 시작함" }
  tags: [society, religion, trade]
  sources: ["Finn Gad, The History of Greenland, vol. 2: 1700–1782 (C. Hurst, 1973)", "Hans Egede, A Description of Greenland (1745)", "Kirsten A. Seaver, The Last Vikings (I. B. Tauris, 2010)"]

- id: new-granada-restored-1739
  year: 1739
  endYear: 1741
  title:
    ko: "누에바그라나다 부왕령의 재설치와 카르타헤나 포위(1739~1741)"
  summary:
    ko: "스페인은 1739년 8월 20일 누에바그라나다 부왕령을 다시 세우고 이번에는 파나마의 감독권을 보고타에 맡겼다. 이때 파나마는 페루 부왕령에서 떨어져 나와 보고타에 묶였고, 오늘날 베네수엘라 지방도 누에바에스파냐 부왕령 쪽 산토도밍고 아우디엔시아의 감독에서 벗어나 한동안 보고타에 맡겨졌다는 설명이 있다. 폐지 뒤 16년 사이 카리브해의 밀무역과 영국의 압박이 더 커졌기 때문이다. 1731년 영국 선장 로버트 젠킨스가 스페인 해안경비대에 귀를 잘렸다는 이야기가 의회에서 되살아나 1739년 가을 영국이 스페인에 선전포고를 하면서 젠킨스의 귀 전쟁이 시작되었고, 에드워드 버넌 제독의 함대가 11월 포르토벨로를 빼앗았다. 새 부왕 세바스티안 데 에슬라바는 1740년 4월 자리에 올랐다. 1741년 3월부터 5월까지 버넌은 군함과 수송선 124척 안팎, 병력 2만 7천여 명(육군 약 1만 2천 명)을 이끌고 카르타헤나데인디아스를 포위했으나, 해군 사령관 블라스 데 레소와 에슬라바가 이끈 수비군은 보카치카 요새 등 도시의 요새와 풍토병의 도움을 받아 버텼다. 영국군은 보카치카 어귀를 뚫고 상륙했으나 산펠리페 요새 공격에 실패했고 우기가 오면서 황열병과 이질이 퍼졌다. 수비군은 3천~6천 명 추산이었고 정규군 외에 민병대·수병·원주민 궁수가 섞였다. 영국군에는 북아메리카 식민지에서 모집한 지원병도 수천 명 있었고, 버지니아의 로런스 워싱턴(조지 워싱턴의 이복형)은 버넌 제독 밑에서 싸운 뒤 자기 농장을 마운트버넌이라 이름 지었다. 영국 쪽은 사망 9,500~11,500명(대부분 질병)이라는 큰 피해를 입고 물러났고 스페인 쪽 전사자는 800명 안팎이었다. 이 전쟁은 유럽에서 「오스트리아 왕위 계승 전쟁」(뒤의 사건)에 합쳐졌다."
