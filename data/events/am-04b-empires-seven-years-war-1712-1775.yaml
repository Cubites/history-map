- id: falklands-1764
  year: 1764
  endYear: 1771
  title:
    ko: "포클랜드 제도의 세 정착과 1770년 위기(1764~1771)"
  summary:
    ko: "1764년 프랑스 항해가 루이앙투안 드 부갱빌은 아카디아 출신 이주민을 포함한 가족들과 함께 포클랜드 제도 동쪽 섬에 포르생루이를 세웠다. 이 섬들에는 그전까지 사람이 살지 않았고 바다표범과 고래를 잡는 어부들이 드나들 뿐이었다. 이듬해 영국 해군의 존 바이런이 서쪽 섬을 영국 땅으로 선언했고, 1766년 존 매브라이드가 이곳에 해군성 장관 에그먼트 백작의 이름을 딴 포트에그먼트를 짓고 영국 정착지를 열었다. 같은 해 프랑스는 스페인과 맺은 부르봉 가문 협약에 따라 이 섬들을 스페인 몫으로 돌리기로 하고 부갱빌은 스페인에서 보상을 받았으며, 1767년 스페인이 포르생루이를 넘겨받아 푸에르토솔레다드라 이름 붙이고 부에노스아이레스 총독 아래 총독을 두어 스페인령 포클랜드 제도가 시작되었다. 두 나라는 서로 상대 정착지의 존재를 한동안 몰랐다. 1770년 6월 10일 부에노스아이레스 총독 프란시스코 데 부카렐리의 명령으로 후안 이그나시오 데 마다리아가가 군함 다섯 척과 병력 1,400명을 이끌고 포트에그먼트로 가 영국 정착민을 내보냈다. 영국과 스페인은 1770년 7월부터 1771년 1월 22일까지 노스 경의 내각이 전쟁 여부로 갈린 채 전쟁 직전까지 갔고, 프랑스가 스페인을 도울 생각이 없자 스페인은 포트에그먼트를 돌려주기로 했다(섬의 주권 문제는 따로 남겼다). 1771년 영국은 포트에그먼트를 다시 차지했으나 1774년 비용을 줄이려 식민지를 거두기로 하고 1776년 5월 명판을 남기고 떠났다. 스페인은 푸에르토솔레다드를 1811년까지 지켰다. 이 다툼은 7년 전쟁 뒤 먼 남대서양의 섬에서도 열강의 경쟁이 거세졌음을 보여 준다."
  subjects: [spanish-falkland-islands, uk, spain, france]
  tags: [diplomacy, exploration]
  sources: ["Julius Goebel, The Struggle for the Falkland Islands: A Study in Legal and Diplomatic History (Yale University Press, 1927)", "Peter J. Beck, The Falkland Islands as an International Problem (Routledge, 1988)"]

- id: stamp-act-1765
  year: 1765
  endYear: 1770
  title:
    ko: "인지세법과 타운센드법, 보스턴 학살(1765~1770)"
  summary:
    ko: "7년 전쟁이 끝나자 영국은 국가 빚이 크게 늘었고 북아메리카에 둔 군대의 비용도 컸다. 영국 의회는 1764년 설탕법에 이어 1765년 3월 인지세법을 통과시켜 신문·법률 문서·카드 같은 종이에 인지(세금 도장)를 붙이게 했고, 영국 의회가 식민지 의회의 동의 없이 식민지에 세금을 매길 수 있느냐는 물음이 처음으로 크게 터졌다. 버지니아에서는 5월 패트릭 헨리가 반대 결의를 이끌었고, 8월 매사추세츠만 식민지의 보스턴에서는 '자유의 아들들'이 인지세 관리의 집과 부총독 토머스 허친슨의 집을 부쉈다. 10월 뉴욕 식민지의 뉴욕시에서 열린 인지세법 회의에는 아홉 식민지 대표가 모여 의회의 과세에 반대한다고 밝혔다. 영국 상인들도 식민지의 불매로 손해를 보자 의회는 1766년 3월 인지세법을 폐지하면서 같은 날 의회가 어떤 경우에도 식민지를 위한 법을 만들 권리가 있다는 선언법을 통과시켰고, 식민지는 폐지 소식에 환호했으나 권리를 둘러싼 물음은 풀리지 않았다. 1767년 재무장관 찰스 타운센드의 이름을 딴 법들이 유리·납·종이·차에 수입 관세를 매겼고 이를 식민지 사람들은 새 세금으로 받아들여 다시 불매 운동으로 맞섰다. 1768년 영국은 보스턴에 군대를 보내 주둔시켰고, 1770년 3월 5일 밤 보스턴에서 영국 병사들이 군중에게 총을 쏘아 다섯 명이 숨졌다(보스턴 학살). 병사들의 변호는 훗날 대통령이 되는 존 애덤스가 맡았다. 영국 의회는 1770년 차 관세만 남기고 나머지 관세를 없앴다. 이 갈등의 뒤는 「보스턴 차 사건에서 대륙 회의로: 열세 식민지의 끝(1773~1776)」(뒤의 사건)과 「미국 독립 혁명과 유럽」(뒤의 사건)을 본다."
  subjects: [massachusetts-bay, province-of-new-york, uk]
  tags: [politics, economy]
  sources: ["Edmund S. Morgan and Helen M. Morgan, The Stamp Act Crisis: Prologue to Revolution (University of North Carolina Press, 1953)", "Gordon S. Wood, The American Revolution: A History (Modern Library, 2002)", "Alan Taylor, American Revolutions: A Continental History, 1750–1804 (W. W. Norton, 2016)"]

- id: boston-tea-party-1773
  year: 1773
  endYear: 1776
  title:
    ko: "보스턴 차 사건에서 대륙 회의로: 열세 식민지의 끝(1773~1776)"
  summary:
    ko: "1773년 5월 영국 의회는 동인도 회사의 재고를 덜어 주려고 식민지에 회사가 직접 차를 팔게 하는 차세법을 만들었고, 식민지 상인과 밀수 차를 팔던 이들은 이에 반발했다. 12월 16일 보스턴에서 새뮤얼 애덤스를 비롯한 급진파 시민들이 모호크 사람으로 꾸미고 배 세 척의 차 342상자를 바다에 던졌다. 영국 의회는 1774년 보스턴 항 폐쇄법을 비롯한 법들(식민지에서는 '참을 수 없는 법'이라 불렀다)로 매사추세츠만 식민지를 누르고 군 사령관 토머스 게이지를 총독으로 앉혔다. 이에 맞서 9월 5일부터 10월 26일까지 필라델피아에서 첫 대륙 회의가 열려 조지아 식민지를 뺀 열두 식민지의 대표가 영국 상품 불매를 결의했다. 식민지 의회는 왕의 총독을 밀어내고 스스로 모이는 지방 의회로 바뀌어 갔고, 1775년 4월 렉싱턴·콩코드에서 충돌이 터지자(「미국 독립 혁명과 유럽」(뒤의 사건)을 본다) 버지니아 식민지의 던모어 백작과 노스캐롤라이나 식민지의 조사이어 마틴 같은 총독이 차례로 달아났다. 1775년 3월 트랜실베이니아 회사의 리처드 헨더슨은 시카모어숄스에서 체로키 사람들과 켄터키와 테네시 일부 땅을 사는 계약을 맺었으나(드래깅카누 등은 서명을 거부했고 뒷날 버지니아와 노스캐롤라이나가 무효로 했다), 노스캐롤라이나 식민지는 지금의 테네시 땅을 자기 몫으로 주장했다. 1776년 1월 뉴햄프셔 식민지가 첫 주 헌법을 만들었고 3월 사우스캐롤라이나 식민지, 6월 버지니아 식민지가 뒤를 이었다. 매사추세츠만 식민지·코네티컷 식민지·뉴욕 식민지·뉴저지 식민지·펜실베이니아 식민지·메릴랜드 식민지·조지아 식민지도 왕의 총독이 없는 정부로 넘어가, 영국령 열세 식민지(위의 열한 곳에 로드아일랜드와 델라웨어를 더한 곳)는 1776년 안에 영국 왕 아래 식민지로서는 끝났다. 7월 4일의 독립 선언은 「독립 선언에서 요크타운까지(1776~1781)」(뒤의 사건)을 본다."
  subjects: [massachusetts-bay, connecticut-colony, new-hampshire, province-of-new-york, province-of-new-jersey, province-of-pennsylvania, maryland-colony, virginia-colony, north-carolina, south-carolina, province-of-georgia, uk]
