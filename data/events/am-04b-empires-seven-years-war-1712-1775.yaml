- id: north-frontier-1747
  year: 1747
  endYear: 1775
  title:
    ko: "누에보산탄데르에서 알타칼리포르니아까지: 스페인의 북쪽 변경(1747~1775)"
  summary:
    ko: "1740년대 스페인은 멕시코 북동쪽 해안 평원이 영국이나 프랑스의 손에 들어갈까 걱정했다. 누에바에스파냐 부왕령의 레비야히헤도 백작(1746~1755 재임)은 군인 호세 데 에스칸돈에게 이 땅의 식민을 맡겼고, 에스칸돈은 1747년부터 군대와 이주민 가족을 이끌고 들어가 1748년 누에보산탄데르 식민지를 세웠다. 1755년까지 스무 곳 남짓의 마을이 서고 요새(프레시디오)와 소수의 선교 마을이 그 사이를 지켰다. 그 땅에 살던 여러 원주민 사회는 자리를 내주거나 선교 마을로 모였고, 서쪽과 북쪽에서는 아파치와 코만치의 습격이 이어졌다. 1767년 예수회가 스페인 왕국과 식민지에서 추방되자(「카를로스 3세의 개혁과 예수회 추방(1759~1775)」(뒤의 사건)을 본다) 바하칼리포르니아의 선교 마을은 프란시스코회 사제 주니페로 세라에게 넘어갔다. 감찰관 호세 데 갈베스는 알래스카 쪽에서 러시아 모피 상인이 내려온다는 소문과 영국의 접근을 걱정해 몬터레이만까지 거점을 세우기로 했다. 1769년 군인 가스파르 데 포르톨라와 세라가 이끈 육지와 바다의 원정대가 바하칼리포르니아에서 북쪽으로 떠나 7월 16일 지금의 샌디에이고에 선교 마을을 세웠고, 1770년 6월 3일 몬터레이에 프레시디오와 선교 마을을 세웠다. 1774년 후안 바우티스타 데 안사는 소노라에서 콜로라도강을 건너 사막을 가로지르는 길을 열었고, 1775년 가을 이주민을 이끌고 다시 출발했다(샌프란시스코만 도착은 1776년의 일이다). 선교 마을은 원주민을 모아 가톨릭 교리를 가르치고 농사와 노동을 시키는 체제였고 유럽에서 들어온 질병으로 해안의 원주민 인구가 크게 줄었다. 이 사이 누에바에스파냐 부왕은 레비야히헤도 백작에서 여러 부왕을 거쳐 크루아 후작(1766~1771)과 부카렐리(1771~1779)로 바뀌었다."
  subjects: [new-spain-viceroyalty]
  tags: [colonization, religion, society]
  sources: ["David J. Weber, The Spanish Frontier in North America (Yale University Press, 1992)", "John Francis Bannon, The Spanish Borderlands Frontier, 1513–1821 (Holt, Rinehart and Winston, 1970)", "Alan Taylor, American Colonies (Viking, 2001)"]

- id: pombal-1751
  year: 1751
  endYear: 1775
  title:
    ko: "폼발의 아마존 개혁과 그랑파라·마라냥(1751~1775)"
  summary:
    ko: "1750년 마드리드 조약이 아마존 유역에서 포르투갈 사람들이 이미 차지한 땅을 인정하자(「마투그로수·고이아스와 마드리드 조약, 과라니 전쟁(1746~1756)」(앞의 사건)을 본다), 포르투갈 왕 주제 1세의 외무·전쟁 담당 국무장관 세바스치앙 주제 드 카르발류 이 멜루(훗날 폼발 후작)는 이 북쪽 땅을 직접 다스리기로 했다. 마라냥 주는 1751년 7월 31일 그랑파라·마라냥 주(마라냥 주의 1751년 이름)로 새로 편성되어 1616년 포르투갈이 세운 벨렝에 수도를 두고 리스본에 곧바로 보고했다. 초대 총독은 폼발의 동생 프란시스쿠 샤비에르 드 멘동사 푸르타두(1751~1759)였다. 1755년 6월 원주민을 노예로 삼는 것을 막는 법이 선포되었고 같은 해 그랑파라·마라냥 무역 회사가 세워져 이 땅의 교역과 아프리카 노예 수입을 독점하고 카카오·쌀·면화를 유럽에 내다 팔았다. 1757년 디레토리우(원주민 감독법)는 예수회 선교 마을을 왕이 보낸 감독관이 다스리는 마을로 바꾸고 포르투갈어 사용을 강제했으며, 원주민은 왕의 신민이라고 선언되었으나 실제로는 노동 동원이 이어졌다. 1759년 포르투갈은 예수회를 추방해 아마존의 선교 마을은 모두 세속 사제의 손으로 넘어갔다. 1763년 포르투갈령 브라질의 수도는 사우바도르에서 리우데자네이루로 옮겨졌다. 1772년 8월 20일 이 주는 그랑파라·히우네그루 주와 마라냥·피아우이 주로 나뉘도록 정해졌고(시행은 1774년), 1775년 두 주가 포르투갈령 브라질 쪽 체제에 들어가면서 이 이름의 마라냥 주는 사라졌다. 폼발의 개혁은 왕권을 세우고 원주민을 포르투갈 사회에 편입하려는 계몽 전제 정치의 한 모습이었으나 그 과정에서 원주민의 말과 마을 체제가 크게 무너졌다."
  subjects: [state-of-maranhao, portuguese-brazil, portugal]
  tags: [politics, society, religion]
  sources: ["Kenneth Maxwell, Pombal: Paradox of the Enlightenment (Cambridge University Press, 1995)", "Dauril Alden, Royal Government in Colonial Brazil (University of California Press, 1968)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: ohio-1753
  year: 1753
  endYear: 1755
  title:
    ko: "오하이오 영토의 요새와 올버니 회의(1753~1755)"
  summary:
    ko: "1753년 프랑스는 누벨프랑스 캐나다에서 이리호 남쪽을 지나 오하이오강 상류 쪽으로 내려와 프레스크일과 르뵈프에 요새를 세웠다. 이 땅은 이로쿼이 연맹과 쇼니·레나페(델라웨어)·세네카계 밍고 같은 원주민이 사는 곳이었고, 영국 쪽에서는 버지니아 식민지의 대지주들이 만든 오하이오 회사(1747년 설립, 1749년 왕에게서 20만 에이커의 땅을 받음)가 이 땅의 개척권을 노렸다. 1752년에는 프랑스 동맹 원주민이 영국 상인과 교역하던 마이애미 사람들의 마을 피카윌라니를 공격했다. 버지니아 부총독 로버트 딘위디는 그해 가을 만 21세의 민병대 소령 조지 워싱턴을 보내 프랑스군에게 물러나라는 서한을 전하게 했고 프랑스 쪽은 거절했다. 1754년 4월 프랑스는 오하이오강 합류점에서 영국 쪽이 짓던 요새를 빼앗아 총독 뒤켄 후작(1752~1755)의 이름을 딴 뒤켄 요새를 세웠다. 5월 28일 워싱턴의 부대가 프랑스 사절 주몽빌을 죽인 충돌이 일어났고 7월 3일 네세서티 요새에서 워싱턴은 항복했다. 그 사이 6월 19일부터 7월 11일까지 올버니에서 영국 식민지 일곱 곳의 대표와 이로쿼이가 모인 올버니 회의에서 벤저민 프랭클린이 식민지 연합 방안을 내놓았으나 식민지 의회들이 받아들이지 않았다. 1755년 7월 9일 영국군 사령관 에드워드 브래독이 이끈 약 2천 2백 명 가운데 앞선 1,300명 안팎이 뒤켄 요새로 가다가 모논가헬라강 가에서 프랑스군과 원주민 연합군 900명 안팎에게 크게 졌고 브래독은 며칠 뒤 숨졌으며 영국 쪽 사망자는 450명 안팎이었다. 이 싸움은 1756년 유럽으로 번진 7년 전쟁의 북아메리카 쪽 시작이었고, 유럽 쪽은 「외교 혁명과 7년 전쟁」(뒤의 사건)을 본다."
  subjects: [new-france-canada, virginia-colony, uk, france]
  tags: [war, politics]
  sources: ["Fred Anderson, Crucible of War: The Seven Years' War and the Fate of Empire in British North America, 1754–1766 (Alfred A. Knopf, 2000)", "Alan Taylor, American Colonies (Viking, 2001)", "W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)"]
