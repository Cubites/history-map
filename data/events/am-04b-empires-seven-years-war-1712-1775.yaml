  sources: ["Fred Anderson, Crucible of War: The Seven Years' War and the Fate of Empire in British North America, 1754–1766 (Alfred A. Knopf, 2000)", "Alan Taylor, American Colonies (Viking, 2001)", "W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)"]

- id: proclamation-1763
  year: 1763
  endYear: 1768
  title:
    ko: "1763년 선언과 폰티악 전쟁, 스탠윅스 요새 조약(1763~1768)"
  summary:
    ko: "영국은 1763년 파리 조약으로 오대호와 오하이오의 옛 프랑스 요새를 넘겨받았으나 프랑스와 손잡았던 원주민은 협상에 끼지 못했고, 영국 총사령부는 선물과 화약 공급을 줄였다. 1763년 5월 오타와 지도자 폰티악이 디트로이트 요새를 에워싸면서 오대호와 오하이오의 여러 원주민 사회가 영국 요새를 잇달아 공격했고(폰티악 전쟁), 8월 헨리 부케의 영국군이 부시런에서 이들을 막았으나 전쟁은 1766년 폰티악이 영국 쪽 감독관 윌리엄 존슨과 강화를 맺을 때까지 이어졌다. 이런 가운데 1763년 10월 7일 영국 왕의 선언은 애팔래치아산맥 분수령 서쪽을 식민지 사람들이 정착하거나 개인이 원주민에게서 땅을 사지 못하는 땅으로 묶어 두었다. 이 땅은 인디언 보호지라 부른다. 선언은 원주민이 동의 없이는 땅을 팔지 않게 하려는 뜻이었으나 식민지 투기꾼과 개척민은 서쪽으로 향한 길이 막혔다고 불평했다. 1764년 왕은 코네티컷강 서쪽의 뉴햄프셔 그랜트가 뉴욕 식민지 땅이라 판정했고(훗날 버몬트가 된 곳이다), 이 지역 개척민은 이후 오래 다툼을 벌였다. 1768년 10월 14일 하드레이버에서 영국 남부 감독관 존 스튜어트가 체로키와 경계선을 정했고, 11월 5일 포트스탠윅스에서 북부 감독관 윌리엄 존슨이 이로쿼이 연맹(여섯 나라)과 오하이오강 남쪽, 지금의 웨스트버지니아와 켄터키 땅의 권리를 사들이는 조약을 맺어 선을 서쪽으로 옮겼고, 이 땅은 버지니아 식민지의 몫으로 여겨졌다. 그러나 켄터키에는 쇼니와 체로키가 사냥터로 쓰며 살았고(쇼니와 레나페는 교섭에 참석했으나 서명하지 않았다) 이로쿼이는 그 땅을 실제로 쥐지 못한 터라 이 조약은 뒷날 다툼의 씨앗이 되었다. 인디언 보호지의 북쪽 땅은 1774년 퀘벡 법으로 퀘벡 주에 넘어가 사라진다(「퀘벡 법과 인디언 보호지의 끝(1774~1775)」(뒤의 사건)을 본다)."
  subjects: [indian-reserve, province-of-new-york, virginia-colony, uk]
  tags: [politics, war, society]
  sources: ["Colin G. Calloway, Scratch of a Pen: 1763 and the Transformation of North America (Oxford University Press, 2006)", "Fred Anderson, Crucible of War: The Seven Years' War and the Fate of Empire in British North America, 1754–1766 (Alfred A. Knopf, 2000)", "Gregory Evans Dowd, War under Heaven: Pontiac, the Indian Nations, and the British Empire (Johns Hopkins University Press, 2002)"]
