- id: acadian-expulsion-1755
  year: 1755
  endYear: 1758
  title:
    ko: "아카디아인 추방과 루이스버그 함락(1755~1758)"
  summary:
    ko: "1713년 위트레흐트 조약으로 영국령 노바스코샤가 된 아카디아 반도에는 제방을 쌓아 갯벌을 밭으로 바꾸어 살던, 프랑스어를 쓰는 가톨릭 아카디아인 약 1만 4천 명이 살았다(앞의 일은 「앤 여왕 전쟁과 위트레흐트 조약의 북아메리카: 아카디아에서 노바스코샤로(1701~1714)」(앞의 사건)을 본다). 이들은 영국 왕에 대한 무조건의 충성 서약을 오래 미루었고, 프랑스는 이웃 일루아얄(케이프브레턴섬)에 요새 도시 루이스버그를 두고 있었다. 1755년 영국이 보세주르 요새를 차지했고, 7월 28일 노바스코샤 총독 찰스 로런스와 평의회가 아카디아인을 내쫓기로 결정했으며 8월 10일 무렵 추방이 시작되었다. 추방당한 사람들은 짐을 거의 가져가지 못했고 가족이 서로 다른 배에 나뉘어 타는 일이 많았다. 추방은 1764년까지 이어져 약 1만 1천 5백 명이 배에 태워졌고(추산) 열세 식민지로 약 7천 명, 프랑스로 3천 5백 명, 영국 본토로 8백여 명이 흩어졌으며 약 5천 명이 병과 굶주림, 난파로 죽었다고 본다. 그 가운데 1758년 생장섬에서 프랑스로 가던 배 세 척(듀크윌리엄호·바이올릿호·루비호)이 가라앉아 약 1천 명이 죽었다. 1758년 7월 26일 루이스버그가 항복하면서 일루아얄은 영국에 넘어가 노바스코샤에 합쳐졌고, 케이프브레턴섬과 생장섬의 아카디아인이 프랑스로 보내지는 두 번째 물결이 일었다. 1764년 7월 11일 영국 정부는 무조건 충성 서약을 하면 소수씩 돌아와도 좋다고 허락했고, 그때 노바스코샤에 남은 아카디아인은 2,600명이었다. 비워진 농지에는 뉴잉글랜드에서 온 이주민이 들어왔고, 일부 아카디아인은 그 뒤 루이지애나로 옮겨 가 훗날 케이전(카준)이라 불렸다. 프랑스와 동맹을 맺었던 미크맥 사람들도 이 전쟁 속에서 땅과 교역을 잃었다."
  subjects: [ile-royale, nova-scotia, uk, france]
  tags: [war, society, migration]
  sources: ["Naomi E. S. Griffiths, From Migrant to Acadian: A North American Border People, 1604–1755 (McGill-Queen's University Press, 2005)", "Geoffrey Plank, An Unsettled Conquest: The British Campaign against the Peoples of Acadia (University of Pennsylvania Press, 2001)", "John Mack Faragher, A Great and Noble Scheme: The Tragic Story of the Expulsion of the French Acadians from Their American Homeland (W. W. Norton, 2005)"]
