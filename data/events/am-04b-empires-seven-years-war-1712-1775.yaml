- id: carlos-iii-1759
  year: 1759
  endYear: 1775
  title:
    ko: "카를로스 3세의 개혁과 예수회 추방(1759~1775)"
  summary:
    ko: "1759년 스페인 왕 페르난도 6세가 죽자 나폴리 왕이던 이복동생 카를로스 3세가 스페인 왕이 되었다. 그는 1762년 영국에 아바나를 잃은 일(「영국의 아바나 점령과 퐁텐블로 조약(1762~1763)」(뒤의 사건)을 본다)을 겪으며 식민지를 방어하고 재정을 늘리는 개혁에 나섰다. 아바나에는 1763년부터 라카바냐 요새가 새로 지어졌고 상비군과 민병대가 늘었으며, 1764년 쿠바에 첫 인텐덴트(왕이 보낸 재정·행정 관리)를 두었다. 1765년 칙령은 카리브해 섬 몇 곳의 항구가 스페인 안 여러 항구와 직접 교역하게 허락해 세비야와 카디스가 쥐던 독점을 허물기 시작했다. 호세 데 갈베스는 1765년부터 1771년까지 누에바에스파냐 감찰관으로 일하며 세금 징수를 손보고 담배 전매를 키웠다. 같은 시기 키토에서는 1765년 술 전매와 판매세에 맞선 반란(바리오스 반란)이 일어났다. 1766년 마드리드에서 일어난 에스킬라체 폭동의 책임이 예수회에 돌려져 1767년 2월 왕은 예수회를 추방하라 명했고, 누에바에스파냐에서는 6월에 집행되었다. 파라과이의 과라니 선교 마을(30곳 안팎)도 다른 수도회의 손에 넘어갔다. 당시 누에바에스파냐 부왕령은 크루아 후작(1766~1771)이, 페루 부왕령은 마누엘 데 아마트(1761~1776)가 다스렸다. 왕은 아메리카의 주요 관직에 스페인 본국 출신을 늘려 앉혔고, 이 개혁은 세금과 관직을 두고 아메리카에서 태어난 크리오요의 불만을 키웠다. 1776년 뒤의 일은 「리오데라플라타 부왕령의 설치와 산일데폰소 조약(1776~1778)」(뒤의 사건)과 「부르봉 개혁과 베네수엘라·칠레 총사령부(1777~1789)」(뒤의 사건)을 본다."
  subjects: [spain, new-spain-viceroyalty, peru-viceroyalty]
  tags: [politics, economy, religion]
  sources: ["John Lynch, Bourbon Spain 1700–1808 (Basil Blackwell, 1989)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)", "Allan J. Kuethe and Kenneth J. Andrien, The Spanish Atlantic World in the Eighteenth Century: War and the Bourbon Reforms, 1713–1796 (Cambridge University Press, 2014)"]

- id: havana-fontainebleau-1762
  year: 1762
  endYear: 1763
  title:
    ko: "영국의 아바나 점령과 퐁텐블로 조약(1762~1763)"
  summary:
    ko: "1761년 스페인은 프랑스와 부르봉 가문 협약을 맺었고 1762년 1월 영국에 맞서 7년 전쟁에 뛰어들었다. 영국은 곧 쿠바로 눈을 돌렸다. 1762년 6월 6일 조지 포콕 제독의 함대와 앨버말 백작 조지 케펠의 육군(합쳐 약 3만 1천 명 추산)이 아바나 앞바다에 나타나 이튿날 상륙했고, 7월 30일 모로성이 무너지며 지휘관 루이스 비센테 데 벨라스코가 치명상을 입고 죽었다. 쿠바 총사령부의 총독 후안 데 프라도는 8월 13일 항복했고 영국군은 14일 입성했다(프라도는 사형을 선고받았다가 감형되어 옥중에서 죽었다). 스페인은 군함 열 척과 상선 100척 안팎을 잃었다. 포위 중 영국 쪽은 10월까지 병으로만 4,700명 넘게 죽었다. 영국은 약 열 달 동안 아바나를 차지하며 아프리카에서 온 노예 3천 2백 명 안팎을 들여 와 설탕 산업을 키우는 자극을 주었고, 1763년 파리 조약으로 아바나는 스페인에 돌려졌다(영국이 얻은 플로리다와 맞바꿈). 스페인은 쿠바 민병대를 7천 5백 명으로 늘리고 군사 개혁을 시작했다. 전쟁이 끝나기 전인 1762년 11월 3일 프랑스와 스페인은 비밀리에 퐁텐블로 조약을 맺어 프랑스령 루이지애나 가운데 미시시피강 서쪽과 뉴올리언스를 스페인에 넘겼다(동쪽을 영국에 잃게 될 스페인에 대한 보상). 이 사실은 1764년 4월에야 프랑스 총독 다바디에게 알려졌다. 스페인의 안토니오 데 우요아가 1766년 뉴올리언스에 왔으나 1768년 주민 반란으로 쫓겨났고, 1769년 알레한드로 오레일리의 군대가 와서야 스페인령 루이지애나의 실효 지배가 시작되었다. 이 전쟁의 평화는 「1763년 파리 조약과 퀘벡 주·영국령 플로리다(1763~1764)」(뒤의 사건)을 본다."
