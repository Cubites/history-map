- id: quebec-act-1774
  year: 1774
  endYear: 1775
  title:
    ko: "퀘벡 법과 인디언 보호지의 끝(1774~1775)"
  summary:
    ko: "1763년 선언으로 세워진 퀘벡 주는 세인트로렌스강 둘레의 좁은 땅이었고, 가톨릭을 믿는 프랑스계 주민 약 9만 명에게 영국의 법과 선출 의회를 그대로 적용하기는 어려웠다. 총독 가이 칼턴은 이들의 협력이 필요하다고 보고 법을 바꾸자고 건의했다. 1774년 6월 22일 영국 왕의 재가를 받은 퀘벡 법은 퀘벡 주의 경계를 오하이오강과 미시시피강, 허드슨 베이 회사 땅(루퍼츠랜드)의 경계까지 넓혀 오대호 둘레의 땅을 퀘벡 주에 넣었고 래브라도 해안과 몇몇 섬도 뉴펀들랜드에서 퀘벡 주로 옮겼다. 민사에는 프랑스 민법을, 형사에는 영국법을 쓰게 했고, 가톨릭 교회에 십일조를 걷는 권리를 인정했으며 선출 의회 없이 임명 평의회가 다스리게 했으며, 공직에 오르려면 가톨릭을 부정하는 선서를 해야 하던 규정을 없애 가톨릭 신자도 관직에 오를 수 있게 했다. 프랑스계 성직자와 영주의 협력을 얻어 7년 전쟁 뒤 퀘벡의 민심을 가라앉히려는 조치였다. 이 법은 1775년 5월 1일 시행되었다. 이로써 인디언 보호지의 오하이오강 북쪽 땅은 퀘벡 주로 넘어가 인디언 보호지는 1775년 사라졌다. 열세 식민지의 사람들은 이 법을 가톨릭 확대와 서쪽 땅의 봉쇄로 받아들여 '참을 수 없는 법'에 넣었다(「보스턴 차 사건에서 대륙 회의로: 열세 식민지의 끝(1773~1776)」(앞의 사건)을 본다). 같은 1774년 버지니아 식민지 총독 던모어 백작이 쇼니 사람들과 벌인 던모어 전쟁은 10월 포인트플레전트 전투를 거쳐 쇼니가 오하이오강 남쪽 켄터키 땅의 권리를 내놓는 것으로 끝났다. 1775년 대륙군은 몬트리올을 차지하고 퀘벡을 공격했으나 12월 31일 실패했다. 앞의 일은 「1763년 선언과 폰티악 전쟁, 스탠윅스 요새 조약(1763~1768)」(앞의 사건)을 본다."
