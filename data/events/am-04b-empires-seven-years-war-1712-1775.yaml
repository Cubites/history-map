- id: mosquito-1740
  year: 1740
  endYear: 1749
  title:
    ko: "영국의 모스키토 해안 보호와 모스키토 왕국(1740~1749)"
  summary:
    ko: "중앙아메리카 카리브해 연안(지금의 니카라과 동쪽에서 온두라스 동쪽)에는 미스키토 사람들이 살았고, 영국인은 이들의 왕국을 모스키토 왕국이라 불렀다. 스페인은 1543년 이 해안을 과테말라 아우디엔시아(뒷날 과테말라 총사령부)의 관할로 두었으나 실제로 이곳을 다스린 것은 미스키토 사람들이었다. 미스키토 지도자는 1638년 영국의 프로비던스섬 회사와 손잡았고, 17세기 내내 영국 상인·사략선과 총·철물을 교환하며 이웃 원주민을 사로잡아 팔았다고 전한다. 1740년 미스키토 왕 에드워드 1세는 영국과 우호와 동맹의 조약을 맺어 영국의 보호를 받아들였고, 같은 해 영국은 스페인과 젠킨스의 귀 전쟁 중이라 스페인의 뒷마당에 동맹을 두려 했다. 미스키토 사람들은 17세기에 난파한 배에서 달아난 아프리카계 사람들과 섞였다고 전하며, 영국의 총을 받아 스페인 쪽 마을을 습격하기도 했다고 한다. 1742년 블랙강 일대에 영국인 정착민에게 땅이 주어졌고, 1749년 자메이카 총독이 로버트 호지슨을 해안 감독관으로 보냈다(호지슨 1749~1759). 감독관의 일은 영국인 정착민과 미스키토 왕 사이를 중재하고 영국의 교역을 지키는 것이었고, 스페인은 이 해안을 과테말라 총사령부의 땅이라 주장해 영국의 보호를 받아들이지 않았다. 영국의 모스키토 왕국 보호는 그 뒤 벌목꾼(베이맨)의 정착과 맞물려 스페인과의 다툼 거리가 되었다. 1786년 런던 협약으로 영국은 모스키토 해안의 정착민을 철수하기로 했고(철수는 1787년), 벨리즈 쪽 일은 「세인트조지스 케이 전투와 벨리즈의 베이맨 정착지(1798)」(뒤의 사건)을 본다. 이 해안은 문서로만 스페인 땅이었고 미스키토 사람들이 스스로 다스렸다."
  subjects: [mosquito-kingdom, guatemala-captaincy, uk]
  links:
    - { from: uk, to: mosquito-kingdom, note: "1740년 미스키토 왕과 동맹을 맺어 보호하기 시작함" }
  tags: [politics, society, trade]
  sources: ["Robert A. Naylor, Penny Ante Imperialism: The Mosquito Shore and the Bay of Honduras, 1600–1914 (Fairleigh Dickinson University Press, 1989)", "Mary W. Helms, Asang: Adaptations to Culture Contact in a Miskito Community (University of Florida Press, 1971)"]

- id: bering-1741
  year: 1741
  endYear: 1742
  title:
    ko: "베링과 치리코프의 알래스카 항해(1741~1742)"
  summary:
    ko: "러시아 제국의 표트르 1세는 아시아와 아메리카가 이어졌는지 알고자 덴마크 출신 해군 장교 비투스 베링에게 탐험을 맡겼다. 베링은 1725년 2월 상트페테르부르크를 떠나(1차 캄차카 탐험) 1728년 아시아와 아메리카 사이 바다를 지났으나 아메리카 땅은 보지 못했다. 1733년부터 이어진 2차 탐험(대북방 원정)은 시베리아를 가로질러 오호츠크에서 배를 만들고 1741년 봄 캄차카의 페트로파블롭스크에서 성 베드로호(베링)와 성 바오로호(알렉세이 치리코프)를 띄웠다. 두 배는 안개 속에서 갈라졌고 7월 중순 무렵(율리우스력 16일, 신력으로는 7월 27일) 베링 쪽은 지금의 알래스카 남쪽 해안 세인트일라이어스산을 보았으며 치리코프 쪽은 지금의 알렉산더 제도에 이르렀다. 이 바다와 해안에는 알류트와 틀링깃 같은 원주민이 이미 오래 살고 있었다. 대북방 원정은 수천 명이 참가한 큰 사업이었다. 성 베드로호에는 독일 출신 박물학자 게오르크 슈텔러가 타고 있었고, 그는 베링섬에서 바다소와 해달 같은 짐승을 기록했다(슈텔러바다소는 몇십 년 안에 사냥으로 사라졌다). 치리코프는 배를 나눠 해안에 보낸 선원 열다섯 명이 돌아오지 않아 가을에 먼저 돌아왔다. 돌아오는 길에 알류샨 열도를 처음 확인한 베링의 배는 괴혈병으로 선원들이 쓰러진 채 지금의 베링섬에 얹혀 갇혔고 베링은 1741년 12월 19일(율리우스력) 숨졌다. 성 베드로호의 77명 가운데 46명이 살아남아 새 배를 만들어 1742년 8월 캄차카로 돌아왔다. 이들이 가져온 해달 가죽이 중국 시장에서 높은 값을 받는다는 것이 알려지면서 러시아 모피 상인들이 알류샨 열도로 건너갔다. 그 뒤의 러시아 식민은 「러시아-아메리카 회사와 러시아령 아메리카(1799~1812)」(뒤의 사건)을 본다."
  subjects: [russia]
  tags: [exploration, trade]
  sources: ["Orcutt W. Frost, Bering: The Russian Discovery of America (Yale University Press, 2003)", "Raisa V. Makarova, Russians on the Pacific, 1743–1799 (Limestone Press, 1975)"]

- id: juan-santos-1742
  year: 1742
  endYear: 1752
  title:
    ko: "후안 산토스 아타우알파의 봉기(1742~1752)"
  summary:
    ko: "1742년 5월 아마존 쪽 중부 고지(셀바 센트랄)의 그란파하날 고원 근처 프란시스코회 선교 마을 키소판고 가까이에 후안 산토스 아타우알파라 이름한 사람이 나타났다. 선교 마을의 강제 노동과 전염병, 상인들의 강제 판매(레파르토)가 불만을 키우던 때였다. 그는 자신이 잉카 황제 아타우알파의 환생이라 밝히고 스페인 사람들을 몰아내자고 호소했다. 이 땅의 아샤닌카 사람들이 중심이었고 아무에샤·노마치겡가 사람들이 함께했으며 뒤에는 시피보 사람과 프란시스코회가 부리던 아프리카계 노예도 합류했다. 며칠 만에 세로데라살과 찬차마요 일대 선교 마을 여섯이 버려졌고, 중부 밀림의 선교 마을 23곳 가운데 21곳이 버려지거나 비워졌다. 페루 부왕령은 반격에 나서 1742년 9월 정규군 두 부대, 같은 해 타르마에서 온 구원군, 1743년 키미리에 세운 요새를 보냈으나 모두 막히거나 매복에 무너졌고, 1746년 약 1천 명이 들어갔다가 비와 밀림에 지고, 1750년 원정도 게릴라에 막혔다. 1746년 6월 24일 모노밤바가 봉기군 손에 들어갔고 마지막 선교 마을 소노모로가 1751년 비워졌다. 1752년 8월 산토스는 안다마르카를 사흘 동안 차지했다가 물러났고 그 뒤 기록에서 사라졌다. 스페인 쪽 자료는 그의 죽음을 1755~1756년 무렵으로 적지만 날짜와 사정은 알려져 있지 않다. 부왕 빌라가르시아 후작(1736~1745)과 수페룬다 백작(1745~1761)은 끝내 이 지역을 되찾지 못했고, 스페인은 1788년에야 비토크와 우추밤바에 요새를 지었으며 이 지방의 정착은 1868년 라메르세드 건설까지 거의 다시 시작되지 못했다."
  subjects: [peru-viceroyalty]
  tags: [rebellion, society, religion]
  sources: ["Fernando Santos-Granero and Frederica Barclay, Selva Central: History, Economy, and Land Use in Peruvian Amazonia (Smithsonian Institution Press, 1998)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]

- id: madrid-1746
  year: 1746
  endYear: 1756
  title:
    ko: "마투그로수·고이아스와 마드리드 조약, 과라니 전쟁(1746~1756)"
  summary:
    ko: "18세기 초 상파울루의 반데이란치가 서쪽 내륙에서 금을 찾으면서(쿠이아바의 금은 1718~1719년 무렵 발견, 앞서 1690년대에는 미나스제라이스에서 금이 나왔다) 포르투갈령 브라질의 땅은 1494년 토르데시야스 조약이 그은 선을 훌쩍 넘었다(조약은 「콜럼버스와 다가마, 신항로 개척」(앞의 사건)을 본다). 포르투갈은 1744년 고이아스, 1748년 마투그로수에 카피타니아를 두어 상파울루에서 떼어 냈다. 1750년 1월 13일 스페인과 포르투갈은 마드리드 조약을 맺어 실제로 차지한 땅은 그 나라 것으로 인정한다는 원칙(우티 포시데티스)을 세웠다. 포르투갈은 라플라타강의 콜로니아델사크라멘토를 스페인에 넘기고, 스페인은 우루과이강 동쪽의 일곱 선교 마을을 포르투갈에 넘기기로 했다. 이 일곱 마을은 예수회가 이끌고 과라니 사람들이 사는 곳으로, 약 2만 6천~3만 명(예수회 조사로 일곱 마을 인구 2만 6천여 명)이 마을을 떠나야 했다. 과라니 사람들은 오랜 마을과 밭을 떠나기를 거부했고 예수회가 훈련시킨 과라니 민병은 총기를 다룰 줄 알았다. 1754년 싸움이 시작되었고, 리우데자네이루 총독 고메스 프레이리 드 안드라드와 스페인 쪽 부에노스아이레스 총독 호세 데 안도나에기가 힘을 합쳤다. 1756년 2월 7일 과라니 지도자 세페 티아라주가 죽고 사흘 뒤 카이바테 전투에서 과라니 약 1,500명이 죽고 150여 명이 붙잡혔으며 연합군 사망자는 소수였다. 스페인에서 카를로스 3세가 1759년 즉위한 뒤 두 나라는 1761년 엘 파르도 조약으로 마드리드 조약을 무효로 돌렸다. 이후 경계는 1777년 산일데폰소 조약에서 다시 정해졌고 이는 「리오데라플라타 부왕령의 설치와 산일데폰소 조약(1776~1778)」(뒤의 사건)을 본다."
  subjects: [portuguese-brazil, spain, portugal]
  links:
    - { from: portugal, to: spain, note: "1750년 콜로니아델사크라멘토를 넘기기로 약속함(실제로 넘기지 못하고 1761년 무효)" }
  tags: [diplomacy, war, society]
  sources: ["Barbara Ganson, The Guaraní under Spanish Rule in the Río de la Plata (Stanford University Press, 2003)", "Dauril Alden, Royal Government in Colonial Brazil (University of California Press, 1968)", "The Cambridge History of Latin America, vol. 2 (Cambridge University Press, 1984)"]
