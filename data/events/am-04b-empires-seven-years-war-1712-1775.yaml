- id: quebec-fall-1759
  year: 1759
  endYear: 1760
  title:
    ko: "퀘벡 함락과 몬트리올 항복(1759~1760)"
  summary:
    ko: "1758년 영국은 루이스버그에 이어 프롱트나크 요새와 뒤켄 요새를 차지해 프랑스의 서쪽 보급선을 끊었고, 이듬해 세인트로렌스강을 거슬러 올라 퀘벡(도시)을 공격했다. 제임스 울프가 이끈 영국군(정규군 약 7천 명, 장교·포병을 더해 7천 7백 명 안팎)은 6월 말 오를레앙섬에 자리 잡고 몇 달 동안 퀘벡을 포격하며 강가 마을들을 불태웠으나 요새를 뚫지 못했다. 9월 13일 새벽 영국군은 벼랑을 올라 도시 서쪽 아브라함 평원에 진을 쳤고, 루이조제프 드 몽칼름의 프랑스군은(식량이 모자라던 때였다) 나아가 싸웠다가 몇십 분 만에 흩어졌다. 양쪽 병력은 모두 4천여 명 안팎이었다. 서른두 살의 울프는 전장에서, 몽칼름은 이튿날 죽었고 퀘벡은 9월 18일 항복했다. 이듬해 4월 28일 프랑수아가스통 드 레비가 이끈 프랑스군이 생트푸아에서 제임스 머리의 영국군을 이겼으나 영국 함대가 먼저 도착해 퀘벡을 구했고, 9월 8일 총독 보드뢰유 후작(피에르 드 리고, 1755~1760)이 세 방향에서 몬트리올에 모인 제프리 애머스트의 영국군 앞에서 항복했다. 항복 문서는 주민의 재산과 가톨릭 신앙을 지켜 주기로 했고, 휴런-웬닷 사람들은 9월 5일 머리와 따로 조약을 맺어 신앙·관습·교역의 자유를 인정받았다. 당시 누벨프랑스 캐나다의 프랑스계 주민은 7만 명 안팎이었고, 머리는 1763년까지 군정 총독으로 퀘벡을 다스렸다. 영국군은 겨울이 오면 강이 얼어 함대가 떠나야 해서 서둘러 싸움을 끝내려 했다. 이 전쟁의 유럽 쪽은 「외교 혁명과 7년 전쟁」(앞의 사건)을 보고, 평화는 「1763년 파리 조약과 퀘벡 주·영국령 플로리다(1763~1764)」(뒤의 사건)을 본다."
  subjects: [new-france-canada, uk, france]
  tags: [war, politics]
  sources: ["Fred Anderson, Crucible of War: The Seven Years' War and the Fate of Empire in British North America, 1754–1766 (Alfred A. Knopf, 2000)", "W. J. Eccles, The French in North America, 1500–1783 (Michigan State University Press, 1998)", "C. P. Stacey, Quebec, 1759: The Siege and the Battle (Macmillan, 1959)"]
