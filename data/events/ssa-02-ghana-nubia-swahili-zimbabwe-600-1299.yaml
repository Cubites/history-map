# 사하라 이남 사건 2묶음 갈래 02: 가나, 누비아, 에티오피아, 카넴, 베닌, 말리의 성립 (600 ~ 1299년)
# 범위: 600~1299년(천문 연도도 같음). 마쿠리아의 노바티아 합병, 아랍의 누비아 원정과 바크트, 카넴 왕국과 사이파와 왕조, 가나 제국, 바그다드 방문과 파티마·아이유브 시대 마쿠리아, 알로디아와 소바, 악숨의 끝과 구디트 전승, 알모라비드와 가나, 자그웨 왕조, 베닌 왕국, 둔나마 디발레미, 순디아타와 말리, 솔로몬 왕조, 사쿠라의 정변, 맘루크의 누비아 개입. 스와힐리 해안·대짐바브웨 등 항목이 없는 주제는 따로 세우지 않았다.
# 깊이: 본문(summary 800~1,600자).
# 달력: 1582년 앞 날짜는 율리우스력이며 이 파일은 해·달까지만 적었다. 확실하지 않은 해는 '무렵', 전승·왕명록은 '전한다'로 근거의 성격을 밝혔다.
# 이름 규칙: 항목 이름(노바티아·마쿠리아·알로디아·악숨 왕국·가나 제국·카넴-보르누 제국)을 그대로 쓰고, 지금 나라 가나와 옛 가나 제국을 구별했다.
# 지도 결정과의 관계: 노바티아 합병은 7세기 전반(620년대 무렵)으로 보는 견해를 고르고 다른 학설을 한 구절 밝혔다. 가나는 830년 무렵 성립으로 쓰고 4세기 기원설과 1076년 정복설의 논란을 한 구절로 밝혔다. 악숨의 끝은 960년 무렵으로 썼다.
# 한국사와 닿는 점: 없음. 가리킨 기존 사건: 「아므르 이븐 알아스의 이집트 정복과 푸스타트(639~647)」, 「알모라비드의 안달루스 지배(1086~1147)와 타이파의 부활」.

- id: makuria-nobatia-600
  year: 600
  endYear: 710
  title:
    ko: "마쿠리아의 노바티아 합병(600 무렵~710 무렵)"
  summary:
    ko: "6세기 말 나일강 중류에는 북쪽의 노바티아, 가운데의 마쿠리아, 남쪽의 알로디아 세 기독교 왕국이 늘어서 있었다(「쿠시 뒤의 누비아: 노바티아·마쿠리아·알로디아의 성립(350 무렵~550 무렵)」(앞의 사건)). 노바티아는 400년 무렵 노바족이 제1 폭포와 제3 폭포 사이에 세웠고 도읍은 파라스(파코라스)였다. 마쿠리아는 그 남쪽 동골라를 도읍으로 삼았다. 동골라는 5세기 말 한 마쿠리아 왕이 세운 요새에서 출발해 제3 폭포와 제4 폭포 사이 강변의 큰 도시로 자랐고, 마쿠리아의 본래 땅은 제3 폭포에서 모그라트 섬 둘레까지였다. 마쿠리아가 노바티아를 합친 때는 사료에 못 박혀 있지 않아 학설이 여럿이다. 사산 제국이 이집트를 차지한 7세기 초 뒤, 곧 620년대 무렵 아랍이 나타나는 642년 앞에 합쳐졌다고 보는 견해가 많아 이 글도 7세기 전반으로 본다. 더 늦게, 7세기 말~8세기 초 왕 메르쿠리오스 때 합쳐졌다고 보는 학설도 있다. 합병 뒤에도 노바티아는 사라지지 않았다. 북쪽 지방으로 남아 '에파르코스'라는 총독이 다스렸고, 이 총독 아래에서 어느 정도 자치를 누렸다. 합쳐진 마쿠리아는 제1 폭포 가까운 북쪽 변경에서 동골라까지 이어지는 긴 강변을 하나로 묶고 이집트와 직접 맞닿는 나라가 되었다. 신앙은 처음에 비잔티움 제국의 칼케돈파 선교를 따랐으나, 543년 단성론(콥트)파 선교로 기독교를 받아들인 노바티아와 합쳐지고 메르쿠리오스 때 단성론파가 나라의 신앙으로 자리 잡았다. 메르쿠리오스의 아들 자카리아스는 왕위를 내놓았으면서도 후계자를 지명할 권리를 지녔다고 전한다. 이 합쳐진 마쿠리아가 641~652년 사이 이집트에서 올라온 아랍군을 막아 냈다(「아랍의 누비아 원정과 바크트 조약(641~652)」(뒤의 사건))."
  subjects: [nobatia, makuria]
  links:
    - { from: makuria, to: nobatia, note: "7세기 전반 노바티아를 합쳐 한 나라로 만듦" }
  tags: [politics]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]

- id: nubia-baqt-641
  year: 641
  endYear: 652
  title:
    ko: "아랍의 누비아 원정과 바크트 조약(641~652)"
  summary:
    ko: "아랍군이 이집트를 차지한 뒤(「아므르 이븐 알아스의 이집트 정복과 푸스타트(639~647)」(앞의 사건)) 눈길은 남쪽 누비아로 향했다. 641년 또는 642년에 첫 원정군이 마쿠리아로 들어갔으나 물러났다. 651년 또는 652년(이슬람력 31년)에는 이집트 총독 압둘라 이븐 사드 이븐 아비 사르흐가 정통 칼리프국의 군대를 이끌고 나일강을 따라 마쿠리아의 도읍 동골라까지 올라가 도시를 에워쌌다. 무슬림 사료는 누비아 궁수의 솜씨를 칭찬하며, 마쿠리아는 성채를 지켜 냈고 아랍군은 성벽을 뚫지 못했다. 이때 마쿠리아의 왕은 아랍 사료에 칼리두루트로 적혀 있는데, 이름인지 칭호인지 분명하지 않다. 두 쪽은 싸움을 멈추는 협정을 맺었고, 이 협정이 훗날 바크트로 불렸다. 낱말은 그리스어 '파크톤'(약정)에서 왔다고 설명된다. 원본은 전하지 않고 가장 이른 사본도 몇 세기 뒤의 것이라 내용이 사본마다 다르다. 널리 받아들여지는 내용은 이렇다. 서로 치지 않고 상대 나라 사람의 통행과 교역을 보장하며, 누비아 쪽이 해마다 노예 360명을 이집트로 보내고 그 대가로 이집트가 밀과 렌즈콩 같은 물품을 보낸다. 거기에 40명을 더해 이집트의 유력자들에게 나눠 주었다는 전승도 있다. 이 밖에 누비아에 눌러앉는 이민 금지, 달아난 노예와 도망자의 인도, 누비아가 무슬림을 위한 모스크를 유지하는 일이 들어 있었다. 오늘날 학자들은 마쿠리아의 독립을 인정한 대등한 교환으로 보는 쪽과 복속의 한 꼴로 보는 쪽으로 갈린다. 무슬림 법학자들 사이에서도 이슬람의 땅을 넓힐 의무를 어겼다는 논란이 있었다. 바크트는 서로의 약탈로 이따금 끊기면서도 육백 년 넘게 이어지다 14세기 중엽 이 지역의 질서가 무너지면서 끝났다. 835년의 재협상은 「게오르기오스 1세의 바그다드 방문과 바크트 재협상(835~836)」(뒤의 사건)에서 다룬다."
  subjects: [makuria, rashidun-caliphate]
  links:
    - { from: rashidun-caliphate, to: makuria, note: "652년 동골라를 에워쌌다가 싸움을 멈추는 바크트를 맺음" }
  tags: [war, politics, trade]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]
  places: [{ name: 동골라 포위, at: [30.75, 18.22], year: 652 }]

- id: kanem-800
  year: 800
  endYear: 1100
  title:
    ko: "카넴 왕국의 성립과 사이파와 왕조의 이슬람 수용(800 무렵~1100 무렵)"
  summary:
    ko: "차드호 북동쪽의 카넴은 800년 무렵 나라 모습을 갖춘 것으로 보며, 600~900년 사이로 잡는 설도 있다. 바탕은 엔네디 고원에서 내려온 것으로 보이는 목축 사람들이었고, 아랍 사료는 이들을 자가와 사람과 이어 적었는데 뒷날 이 땅 사람들은 카넴부(카누리)로 불렸다. 872년 알야쿠비가 카넴을 적은 것이 가장 이른 글 기록이다. 첫 도읍은 차드호 동쪽의 은지미로 보지만 그 자리는 아직 찾지 못했다. 카넴은 차드호와 사하라 북쪽의 페잔·북아프리카를 잇는 길목이어서 이 길로 소금과 노예 같은 물품이 오갔다고 본다. 왕은 마이로 불렸다. 이 나라를 오래 다스린 가문은 세 번째 왕 두구의 이름을 따 두구와 왕조라 불린다. 뒷날 전승은 첫 왕을 수삼이라 하고, 왕들의 계보를 적은 『기르감』은 19세기 중엽 유럽 학자들이 옮겨 적기까지 입으로만 전해졌고 앞부분에는 성서 속 인물도 끼어 있으며 판본마다 모순이 있어도 왕 이름과 재위 햇수는 대체로 맞는다. 11세기에는 후 또는 하와라 불린 왕이 첫 무슬림 왕이 되었고, 그가 여성이었을 수도 있다는 견해가 있다. 후와 셀레마 1세는 이바디파였을 수 있다. 11세기 후반 후마이(훔메)가 셀레마 1세를 몰아내고 사이파와 왕조를 열었다. 사이파와는 수니파였고 1085년 무렵 이슬람 수용을 굳혔으며, 스스로 예멘의 전설적 인물 사이프 이븐 디 야잔의 후손이라 내세웠다. 실제로는 카넴부 출신이었다고 본다. 전승은 학자 무함마드 빈 마니가 이들을 개종시켰다고 전한다. 이 나라는 뒷날 서쪽 보르노로 중심을 옮겨 카넴-보르누 제국으로 이어지며, 사이파와 왕조는 1846년까지 이어졌다."
  subjects: [kanem-bornu]
  links: []
  tags: [politics, religion]
  sources: ["Dierk Lange, Ancient Kingdoms of West Africa (Dettelbach: J.H. Röll, 2004)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)", "Nehemia Levtzion and Randall L. Pouwels, The History of Islam in Africa (Ohio University Press, 2000)"]

- id: ghana-wagadu-830
  year: 830
  endYear: 1054
  title:
    ko: "가나 제국(와가두)과 사하라 횡단 금 교역(830 무렵~1054)"
  summary:
    ko: "서아프리카 사헬의 가나 제국은 지금 나라 가나와 다른 옛 나라로, 소닌케 사람들이 와가두라 부른 땅에 있었다. '가나'는 본래 이 나라 왕을 가리키는 칭호였다고 한다. 세운 때는 분명하지 않다. 4세기 무렵 일어났다고 보는 설이 있고 선행 문화로 티치트 문화를 꼽기도 하지만, 이 글은 아랍 사료에 왕조와 나라 모습이 뚜렷해지는 830년 무렵부터로 본다. 가나가 처음 언급된 것은 8세기 말(788~793년)의 기록이고, 830년 알화리즈미가 왕조를 적었다. 알파자리는 가나를 '금의 나라'라 불렀고 872년에는 알야쿠비도 가나를 적었다. 이 나라는 남쪽 삼림 지대의 금 산지를 직접 다스리지는 않았으나, 남쪽의 금과 북쪽 사하라의 소금이 오가는 교역로를 쥐고 세금을 거두어 힘을 키웠다. 1068년 알바크리는 『길과 왕국의 책』에서 소금이 들어올 때 금 1디나르, 나갈 때 2디나르를 거둔다고 적었다. 도읍은 흔히 모리타니 남동부의 쿰비살레 유적으로 보나 확실하지는 않다. 알바크리는 약 10km 떨어진 두 도시를 묘사했는데 그 사이에 집이 이어져 훗날 하나로 합쳐졌을 수 있다고 본다. 왕의 도시 쪽에는 왕궁과 성소가 있었고, 무슬림 상인들은 모스크를 갖춘 다른 도시에 살았다고 한다. 알바크리는 금덩이는 모두 왕의 것이고 백성은 사금 가루만 쓴다는 이야기도 전했다. 알바크리가 적은 왕 텐카메닌(툰카 마닌)은 1063년부터 다스렸고 알모라비드의 유수프 이븐 타슈핀과 편지를 주고받았다. 쿰비살레는 15세기에 버려졌다. 1054년 사하라 남쪽 거점 아우다고스트를 알모라비드가 차지하면서 이 나라의 교역과 힘에 균열이 났다(「알모라비드의 사하라 진출과 가나 제국의 쇠퇴(1054~1100 무렵)」(뒤의 사건))."
  subjects: [ghana-empire]
  links: []
  tags: [trade, politics]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)", "알바크리, 『길과 왕국의 책』"]

- id: makuria-baghdad-835
  year: 835
  endYear: 836
  title:
    ko: "게오르기오스 1세의 바그다드 방문과 바크트 재협상(835~836)"
  summary:
    ko: "830년대 아바스 칼리프국의 내분기에 마쿠리아는 바크트의 노예 공납을 멈추었다(문서마다 이오아네스 또는 자카리아스 3세의 일로 적는다)(바크트의 내용은 「아랍의 누비아 원정과 바크트 조약(641~652)」(앞의 사건)). 아바스가 이집트를 다시 장악하자 칼리프의 동생 이브라힘이 이집트를 맡아 바크트를 되살리고 밀린 열네 해 몫을 모두 내라고 요구했다. 이는 노예 5천 명이 넘는 양이었고, 내지 않으면 전쟁을 하겠다는 위협이 따랐다. 835년 이오아네스가 숨지고 자카리아스 3세가 이은 때 아바스 사신이 도착하자 자카리아스는 아들 게오르기오스 1세를 급히 왕으로 세워 위신을 높인 뒤, 스무 살 안팎이던 그를 바그다드로 보내 협상하게 했다. 게오르기오스는 알렉산드리아의 콥트 총대주교 요셉 1세와 함께 새 합의를 이끌어 냈다. 밀린 몫은 없던 일이 되었고 바크트는 해마다 내던 것을 3년에 한 번 내는 것으로 바뀌었다. 그는 836년 말이나 837년 초에 동골라로 돌아왔고, 이어 동골라에 큰 십자형 교회(비잔티움 영향을 받은 높이 28m 안팎의 건물)가 세워진 것으로 본다. 아버지가 856년 앞에 숨진 뒤 게오르기오스 1세는 856년 무렵부터 887년 무렵까지 홀로 다스렸고, 카이사르라는 칭호를 썼을 수 있다. 뒷날 아랍 모험가 아부 알라흐만 알우마리가 사설 군대를 거느리고 아부하마드 쪽 금광 둘레에 자리 잡아 나일강변 땅을 차지했다. 이를 막지 못한 그의 사위(다른 기록은 조카) 니우티가 반란을 일으켰고, 아들 자카리아스가 알우마리와 손잡고 니우티를 없앤 뒤 알우마리를 사막으로 내몰았다. 887년 6월의 장례 비문이 게오르기오스 1세의 죽음을 증언한다."
  subjects: [makuria, abbasid-caliphate]
  links: []
  tags: [diplomacy, politics]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]

- id: alodia-soba-900
  year: 900
  endYear: 1100
  title:
    ko: "알로디아와 소바(900 무렵~1100 무렵)"
  summary:
    ko: "알로디아는 청나일강과 백나일강이 만나는 곳을 낀 게지라 땅의 기독교 왕국으로, 도읍은 소바였다. 북쪽은 아부하마드 둘레까지, 남쪽은 센나르 둘레까지 닿았다고 보지만 남쪽 경계는 분명하지 않고, 동쪽 사막을 건너 홍해 기슭까지 힘이 미쳤을 수도 있다. 쿠시 왕국이 기운 350년 무렵 뒤에 생긴 것으로 보며, 569년 에페소스의 요한이 이 나라를 처음 적었다. 세 누비아 왕국 가운데 마지막으로 580년 선교사 롱기누스가 보내져 왕과 귀족이 세례를 받은 뒤 알렉산드리아 콥트 총대주교 아래에 들었다. 9세기부터 12세기 사이가 한창때였을 것으로 본다. 9세기 알야쿠비는 알로디아가 마쿠리아보다 힘이 세다고 적었고, 10세기 중엽 이븐 하우칼은 여러 민족이 어울려 번영하는 나라로 그렸다. 943년 알마수디와 이븐 하우칼은 알로디아와 마쿠리아 가운데 어느 쪽이 위에 있는지를 두고 다르게 적었다. 두 왕가는 서로 깊이 이어져 있었다. 10세기 후반 파티마 칼리프국의 사신으로 마쿠리아에 갔다가 알로디아까지 간 이븐 셀림 알아스와니는 소바의 교회가 금과 정원으로 가득하고, 왕이 절대 권력을 쥐고 지방 총독을 임명한다고 전했다. 알려진 왕으로는 에우세비오스(938~955년 무렵)와 스테파노스(955년 무렵)가 있으나 왕의 목록은 거의 비어 있다. 12세기 아부 알마카림은 교회가 400개나 있었다고 주장했으나 지금까지 확인된 것은 일곱 곳이고 그 가운데 다섯이 소바에 있다. 알로디아는 바크트 협정에 들지 않았다. 소바는 12세기부터 쇠퇴의 흔적을 보이고, 이 나라는 1504년 무렵 푼지 술탄국에 무너졌다(「푼지 술탄국의 성립과 알로디아의 끝(1504)」(뒤의 사건))."
  subjects: [alodia]
  links: []
  tags: [politics, religion]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]

- id: aksum-decline-900
  year: 900
  endYear: 980
  title:
    ko: "악숨 왕국의 끝과 구디트 전승(900 무렵~980 무렵)"
  summary:
    ko: "악숨 왕국은 홍해 교역으로 번성했으나 7세기에 기운이 꺾였다. 사산 제국의 이집트·시리아 점령과 정통 칼리프국의 등장으로 홍해 교역이 흐트러졌고, 7세기 안에 또는 8세기 초에 금은동 화폐 주조도 끊겼다. 이 나라는 615년 메카에서 건너온 첫 무슬림 이주민을 받아들였던 바 있다. 7세기 말 무렵에는 베자 사람들이 가시바르카 골짜기를 거쳐 에리트레아 고원으로 들어와 홍해 항구와의 연결을 끊었다고 한다. 사람들은 고원 안쪽으로 옮겨 갔고 악숨은 도읍 자리를 잃었다. 800년 무렵 뒤 새 도읍은 쿠바르로 불리나 위치는 알려지지 않았고 티그라이 남부나 앙고트 쪽으로 짐작한다. 9세기에는 기근이 들었다는 기록이 있으며 콥트 총대주교 야고보(819~830)와 요셉(830~849)은 전쟁과 역병, 부족한 비를 탓했다. 왕국은 960년 무렵 분명치 않은 사정으로 무너졌다. 마지막 왕으로 딜 나오드(917년 또는 940~960)가 꼽힌다. 지역 전승은 960년 무렵 구디트(요디트, 에사토로도 부름) 여왕이 악숨을 쳐서 교회와 책을 불태웠다고 전하지만 전승일 뿐이며, 그의 존재를 의심하는 학자도 있다. 구디트가 유대인이었다는 이야기는 주로 18세기 제임스 브루스의 글에서 나왔고 카를로 콘티 로시니는 이에 반대했다. 교회가 불타고 침입이 있었다는 증거는 이 무렵에 있다. 980년 무렵 이븐 하우칼은 아비시니아의 여왕이 서른 해 동안 다스렸고 왕을 죽였다고 썼는데 구디트와 같은 사람으로 본다. 전승은 구디트 다음으로 다그나잔(안바사 우뎀)이 왕이 되었다고 한다. 이 전승은 1137년 마라 타클라 하이마노트가 이 왕조를 몰아내고 자그웨 왕조를 열었다고 이어진다(「자그웨 왕조와 랄리벨라의 암굴 교회(1137 무렵~1225 무렵)」(뒤의 사건))."
  subjects: [aksum]
  links: []
  tags: [politics, trade]
  sources: ["Stuart Munro-Hay, Aksum: An African Civilisation of Late Antiquity (Edinburgh University Press, 1991)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]

- id: makuria-fatimid-969
  year: 969
  endYear: 1173
  title:
    ko: "파티마·아이유브 왕조와 마쿠리아의 전성(969 무렵~1173)"
  summary:
    ko: "10세기 중엽 마쿠리아는 이집트의 이흐시드 왕조가 약해진 틈을 타 북쪽으로 올라갔다. 951년 하르가 오아시스를 치고 956년 아스완을 약탈하며 카스르 이브림을 차지했고, 962~964년에는 아크밈까지 올라가 상이집트 일부를 몇 해 쥔 것으로 보이나 사료는 이 원정을 이끈 왕의 이름을 밝히지 않는다. 969년 파티마 칼리프국이 이집트를 차지하자 사신 이븐 셀림 알아스와니가 왕 게오르기오스 3세에게 보내졌다. 게오르기오스는 바크트를 되살리는 데 동의했으나 이슬람으로 개종하라는 요구는 거절했고, 도리어 파티마 총독에게 기독교를 믿으라고 권했으며 알아스와니가 동골라 밖에서 북과 나팔을 울리며 이드 알아드하 축제를 지내는 것도 허락했다고 한다. 파티마는 수니파에 맞설 동맹이 필요했으므로 관계는 평화로웠다(파티마와 아이유브가 히자즈에 미친 종주권은 「메카 샤리프국과 히자즈: 파티마와 아이유브의 종주권 아래(967~1200)」(앞의 사건)). 게오르기오스 3세는 콥트 총대주교 필로테우스와 에티오피아의 왕 사이를 중재하기도 했다. 이 시기 마쿠리아의 예술이 꽃폈다. 파라스 대성당은 모래에 묻혀 벽화가 보존되었다가 1960년대 초 아스완 댐 건설에 앞선 유네스코 발굴에서 되살아났고, 비잔티움·콥트·팔레스타인의 영향을 받은 벽화는 8세기 말~9세기 초의 성녀 안나부터 11세기 전반의 주교 마리아노스와 성모자까지 이어진다. 지금까지 스물다섯 곳에서 650점 안팎의 벽화가 기록되었다. 동골라 둘레에는 강을 따라 요새가 잇달아 세워져 도시화를 이끌었다고 본다. 11세기에는 대주교 게오르기오스 때 누비아어 문자와 토착 성인을 장려하는 개혁이 있었고 반가나르티 성당이 세워졌다. 동골라의 옥좌실은 9세기 비잔티움 영향을 받은 궁전 건물이었고, 1317년 이슬람 왕 압둘라 바르샴부가 모스크로 바꾸었다. 1171년 살라딘이 파티마를 무너뜨리고 아이유브 왕조를 열자 관계가 바뀌었다. 이듬해 마쿠리아군이 아스완을 약탈했고, 1173년 1월 살라딘의 아우 투란샤가 카스르 이브림을 차지해 약탈하고 교회를 모스크로 바꿨다고 한다. 바크트는 아이유브 시대에 사이가 나빠졌으며, 압박은 맘루크 시대에 더 거세졌다(「맘루크 술탄국의 누비아 개입(1272~1317)」(뒤의 사건))."
  subjects: [makuria, fatimid-caliphate, ayyubid-dynasty]
  links: []
  tags: [diplomacy, art, religion]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]

- id: almoravid-ghana-1054
  year: 1054
  endYear: 1100
  title:
    ko: "알모라비드의 사하라 진출과 가나 제국의 쇠퇴(1054~1100 무렵)"
  summary:
    ko: "알모라비드는 사하라 서부의 상하자 베르베르 가운데 람투나 사람들이 일으킨 종교·군사 운동이다. 학자 압둘라 이븐 야신이 수스의 와가그 이븐 잘루의 청으로 구달라 사람들에게 갔다가 1040년대 쫓겨난 뒤 람투나가 그를 받아들였고, 1050년대 초 람투나의 지도자 야히야 이븐 우마르와 이븐 야신 아래에서 스스로 알모라비드라 불렀다. 1054년 또는 1055년 이들은 북쪽 사하라 교역 도시 시질마사와 같은 해 가나 제국 북쪽의 교역 거점 아우다고스트를 차지했다. 이븐 야신은 1058년 또는 1059년 바르가와타와 싸우다 숨졌고, 남쪽 알모라비드는 아부 바크르 이븐 우마르가, 북쪽은 사촌 유수프 이븐 타슈핀이 이끌었다. 1068년 코르도바의 알바크리는 『길과 왕국의 책』에 가나 왕의 부와 도읍을 적었는데, 그가 직접 가 본 곳은 아니고 전해 들은 이야기를 모은 것이다. 아랍 전승은 아부 바크르가 1076~1077년 무렵 가나를 정복했다고 전하며, 그 원정을 아들 야히야가 이끌었다고 보는 학자도 있다. 반대로 콘래드와 피셔, 마소넨은 이 정복이 아랍 사료를 잘못 읽어 생긴 전설에 가깝다고 보고, 티모시 인솔은 고고학 증거에 파괴의 흔적이 없다고 한다. 랑게는 군사 침입은 받아들이되 정치적 영향도 함께 본다. 가나 왕이 이 무렵 이슬람으로 개종했다는 점은 대체로 받아들여진다. 아부 바크르는 1087년 11월 타간트에서 싸움에서 입은 부상으로 숨졌다. 이 글은 1076년 무렵을 가나 제국의 끝으로 보되, 13세기까지 이어졌다고 보는 견해도 있다. 1086년 이후 알모라비드의 안달루스 지배는 「알모라비드의 안달루스 지배(1086~1147)와 타이파의 부활」(뒤의 사건)에서 다룬다."
  subjects: [ghana-empire, almoravids]
  links: []
  tags: [war, religion, trade]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "Nehemia Levtzion and J.F.P. Hopkins, Corpus of Early Arabic Sources for West African History (Cambridge University Press, 1981)", "The Cambridge History of Africa, vol. 2 (Cambridge University Press, 1978)"]


- id: zagwe-1137
  year: 1137
  endYear: 1225
  title:
    ko: "자그웨 왕조와 랄리벨라의 암굴 교회(1137 무렵~1225 무렵)"
  summary:
    ko: "악숨이 무너진 뒤 에티오피아 북부 고원에서 일어난 자그웨 왕조는 아가우 사람들의 기독교 왕조로, 도읍은 아데파였고 이곳이 오늘날의 랄리벨라다. 세운 때는 1137년 무렵으로 보는 설이 많고 930년 무렵으로 보는 설도 있다. 전승은 창건자 마라 타클라 하이마노트가 1137년 앞 왕조의 마지막 왕을 몰아냈다고 하며, 또 다른 전승은 장인 딜 나오드를 몰아냈다고 한다. 왕명록은 판본마다 갈려 다섯 왕을 올린 짧은 목록(마라 타클라 하이마노트, 이엠레하나 크리스토스, 랄리벨라, 나아쿠에토 라압, 하르바이)과 열한 왕 또는 열여섯 왕을 올린 긴 목록이 있어 재위 햇수가 맞지 않으므로, 이 글은 특정 목록의 연대를 따르지 않고 알려진 왕만 든다. 긴 목록은 나아쿠에토 라압 뒤에 예트바라크, 마이라리, 마지막 하르바이를 올리고, 목록마다 왕의 재위를 마흔 해씩 같은 햇수로 적는 일이 많다. 도읍 아데파는 라스타 산지의 높은 고원에 있었다. 랄리벨라는 12세기 말~13세기 초 왕으로, 그가 내린 땅 기부 문서가 1204년과 1225년에 전한다. 그가 라스타 산지의 바위를 깎아 만든 교회 열한 채로 이름난 랄리벨라의 암굴 교회는 도시의 배치와 지명이 예루살렘을 본떴다고 보는 견해가 있다. 자그웨는 지중해 세계와는 이집트와 예루살렘 밖에 거의 교류가 없었고, 이집트 성 안토니오 수도원에서 12세기 중엽~13세기 중엽의 게즈 사본이 나왔다. 예루살렘에 에티오피아 공동체가 있었음을 확인해 주는 가장 이른 사료는 13세기 후반의 것이다. 이 왕조는 1270년 예쿠노 암라크에게 마지막 왕이 져서 끝났다(「자그웨 왕조의 끝과 솔로몬 왕조의 성립(1270~1285)」(뒤의 사건))."
  subjects: [zagwe-dynasty]
  links: []
  tags: [politics, religion, art]
  sources: ["Taddesse Tamrat, Church and State in Ethiopia 1270-1527 (Clarendon Press, 1972)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: benin-oba-1180
  year: 1180
  endYear: 1300
  title:
    ko: "베닌 왕국의 성립과 오바 왕조(1180 무렵~1300 무렵)"
  summary:
    ko: "니제르강 삼각주 서쪽 숲 지대의 에도 사람들이 세운 베닌 왕국은 지금 나라 베냉과는 다른 옛 왕국이다. 이 땅의 처음 왕조는 오기소('하늘의 왕')라 불린 왕들의 시대로, 이그도미고도라 불린 나라가 900년 무렵부터 1180년 무렵까지 이어졌다고 보며 오기소의 수는 사료에 따라 갈린다. 이 앞서 이그보-우쿠에서는 9~10세기 청동 공예가 나타났고, 이페에서는 12~15세기의 청동·테라코타 조각이 만들어져 이웃한 서아프리카 숲 지대의 기술을 보여 준다. 베닌시티에는 850년 무렵부터 도시를 둘러싼 흙 방벽이 이어졌고 1200~1300년 무렵 도시가 번성했음을 발굴이 보여 준다. 마지막 오기소 오워도 때의 혼란 끝에 에도 사람들은 에비안이라는 대지의 사제 겸 족장을 뽑아 나라를 맡겼다고 전한다. 공식 전승은 에도 원로들이 요루바의 도읍 이페에 도움을 청했고, 이페의 시조 오두두와의 아들 오라니얀이 와서 왕조를 세웠으며 에도 여인 에린뮈데와의 사이에 아들 에웨카 1세가 났다고 말한다. 이 이야기는 이페의 영향력을 정당화하는 틀로 쓰였고, 1970년대에 기록된 다른 전승은 창건자가 오워도의 아들 또는 손자로 이페에 망명한 에도 사람이었다고 하나 학자들은 최근에 만들어진 이야기로 본다. 에웨카 1세가 즉위한 때는 1180년 무렵과 1200년 무렵으로 갈린다. 넷째 왕으로 꼽히는 에웨도는 궁을 옮기고 나라 이름을 우비니라 불렀으며, 이 우비니 시대는 1255년 무렵부터 1440년 무렵으로 본다. 오바 에와레가 1440년 무렵 나라를 크게 넓히고 도시가 1470년 무렵 에도로 이름을 바꾼 일은 뒤의 시대에 속한다. 궁정은 놋쇠·철·상아 공예로 이름났고 청동판과 오바의 두상을 만들었다."
  subjects: [benin-kingdom]
  links: []
  tags: [politics, art]
  sources: ["Robert Home, City of Blood Revisited: A New Look at the Benin Expedition of 1897 (Rex Collings, 1982)", "Paula Girshick Ben-Amos, The Art of Benin (British Museum Press, 1995)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: dunama-kanem-1221
  year: 1221
  endYear: 1259
  title:
    ko: "둔나마 디발레미와 카넴의 팽창(1221 무렵~1259)"
  summary:
    ko: "13세기 카넴의 마이(왕) 둔나마 디발레미는 셀레마 2세(압드 알잘릴)와 어머니 디발라 사이에서 태어났다. 재위는 흔히 1221년 무렵부터 1259년 무렵으로 잡으나 사료에 따라 크게 갈려 1210~1224년, 1210~1254년으로 보는 이도 있고 40년 재위로 보는 학자도 있다. 그는 기병 3만~4만 명을 길러 중앙아프리카에 기병을 들여왔다고 하며, 사하라 북쪽 페잔까지 힘을 뻗었고 투부 사람들과 오랜 전쟁을 치렀다. 후대 전승은 이 전쟁이 7년 7개월 7일 걸렸다고 말한다. 남쪽으로는 사오 사람들과 싸우며 오늘날 나이지리아 보르노주의 마포니까지 나아갔고, 이 싸움은 지하드로 정당화되었다. 차드호에는 함대도 두었다고 한다. 그는 독실한 무슬림으로 두 번 메카 순례를 했고 앞선 왕들보다 더 곧바로 개종을 밀어붙였다. 후대 전승은 그가 성물 무네를 '열었다'고 전하며 이 일은 해로웠다고 널리 여겨졌으나 무네가 어떤 물건인지는 분명치 않다. 아이유브 왕조의 이집트와 사이가 좋아 카이로에 카넴 순례자와 학생을 위한 숙소를 대었고, 1257년 튀니지의 하프스 왕조 술탄 무함마드 1세 알무스탄시르에게 사신과 기린을 보냈다. 그는 보르노의 잠탐에서 숨졌고 아들 카데 1세가 이었으나 아들들이 반쯤 독립한 총독이 되어 오랜 왕위 다툼이 이어졌다. 그의 이름은 무함마드 또는 아흐마드로도 전하고, 권력이 나일강과 니제르강까지 닿았다는 주장은 논란이 있다. 카이로의 숙소는 이븐 라시크 마드라사라 불렸다. 뒷날 카넴-보르누 제국의 전성기를 이끈 왕으로 기억되며, 왕명록은 그를 '불보다 뜨거운 전사'라 불렀다. 1380년 무렵 보르노 이주는 다음 시대의 일이다."
  subjects: [kanem-bornu, ayyubid-dynasty]
  links: []
  tags: [war, religion, diplomacy]
  sources: ["Dierk Lange, Le Dīwān des sultans du Kanem-Bornū (Franz Steiner, 1977)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)", "Nehemia Levtzion and Randall L. Pouwels, The History of Islam in Africa (Ohio University Press, 2000)"]

- id: sundiata-1235
  year: 1235
  endYear: 1255
  title:
    ko: "순디아타 케이타와 키리나 전투, 말리 제국의 성립(1235~1255)"
  summary:
    ko: "말리 제국의 시조 순디아타 케이타(1217년 무렵~1255년 무렵)에 관한 사료는 대부분 만딩카 사람의 구전이다. 이야기를 전하는 사람은 이야기꾼이자 왕의 스승이며 의례 담당자이던 그리오로, 순디아타의 서사시도 이들이 대를 이어 외워 전한 것이다. 전승에 따르면 가나 제국이 무너진 뒤(「알모라비드의 사하라 진출과 가나 제국의 쇠퇴(1054~1100 무렵)」(앞의 사건)) 사헬 서쪽에서는 소소의 왕이자 주술사 수망구루(소우마오로 칸테)가 1203년 무렵부터 힘을 얻어 만덴 땅을 눌렀다. 순디아타는 북쪽과 남쪽 만덴의 세력을 모아 맞섰고 1235년 무렵 키리나에서 소소군을 꺾었다고 전한다. 이 승리로 만덴의 여러 족장국이 하나로 묶여 말리 제국의 틀이 생겼다. 같은 1235년으로 잡히는 쿠루칸 푸가, 곧 만덴 헌장은 29개 씨족의 대표가 모인 첫 회의에서 정해졌다고 전하며, 포로와 노예를 함부로 대하지 못하게 하고 흔한 물품의 교환 비율을 정하는 규칙이 들어 있었다고 한다. 다만 이것이 얼마나 오래된 법인지는 전승에 기댄 것이어서 학설이 갈린다. 도읍으로 흔히 꼽는 곳은 지금 기니의 니아니인데, 이는 델라포스와 니아네의 설을 따른 것이며 최근 학자들은 전성기의 고고학 증거가 없다며 반대하고 칸가바, 다카잘란, 마니코로를 말하거나 고정된 도읍이 없었다고도 한다. 순디아타는 1255년 무렵 죽었는데, 상카라니강을 건너다 물에 빠져 죽었다는 설이 가장 널리 받아들여지고 화살에 맞았다거나 암살당했다는 이야기도 전한다. 일부 전승에 따르면 아들 예렐링콩(아랍어로 와리)이 뒤를 이었고, 이어 아들 둘과 손자가 다스리다 1285년 노예 출신 장군 사쿠라가 군사 정변으로 권력을 잡았다. 1312년 무렵 만사 무사가 왕위에 오르는 때에 이르러 제국은 사헬의 큰 나라가 되었다."
  subjects: [mali-empire]
  links: []
  tags: [war, politics]
  sources: ["Djibril Tamsir Niane, Soundjata ou l'épopée mandingue (Présence Africaine, 1960)", "Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: solomonic-1270
  year: 1270
  endYear: 1285
  title:
    ko: "자그웨 왕조의 끝과 솔로몬 왕조의 성립(1270~1285)"
  summary:
    ko: "예쿠노 암라크는 오랜 암하라 가문 출신으로, 하이크 호수 둘레 게셴과 암바셀을 다스리던 지방 지도자였고 이스티파노스 수도원에서 교육을 받았다. 즉위한 뒤에는 타스파 이야수스라는 이름도 썼다. 전승에 따르면 그는 자그웨 왕조의 마지막 왕 자일마크눈에게 말로트산에 갇혔다가 달아나 암하라와 셰와에서 지지를 모았고, 셰와의 이슬람 술탄국의 도움도 받았다. 1270년 8월 안사타 전투에서 자그웨 왕을 꺾어 왕조를 끝내고 솔로몬 왕조를 열었다. 마지막 왕의 이름은 사료마다 갈려 타데세 탐라트는 예트바라크로, 게타체우 메코넨 하센은 나아쿠에토 라압으로 보며, 자일마크눈은 솔로몬 왕조가 승리한 뒤 붙인 가명일 수 있다. 훗날의 성인전은 수도사 테클레 하이마노트가 예쿠노 암라크를 길러 자그웨를 무너뜨리는 일을 도왔다고 하고, 더 이른 성인전은 이스티파노스 수도원장 이야수스 모아의 몫으로 돌린다. 어느 쪽도 당대 기록이 아니다. 훗날의 글은 예쿠노 암라크가 악숨 왕가를 거쳐 솔로몬 왕의 후손이라고 주장해 이 왕조가 솔로몬 혈통을 '되찾았다'고 내세웠는데, 이 주장을 담은 『케브라 나가스트』는 14세기에 엮였고 예쿠노 암라크 자신이 이를 내세운 것은 아니다. 이 혈통은 1955년 에티오피아 헌법에도 못 박혔다. 그는 1270년 8월부터 1285년 6월까지 다스렸고 아들 야그베우 세욘(솔로몬 1세로도 불림)이 뒤를 이었다. 유해는 처음 다른 곳에 묻혔다가 먼 후손 바에다 마리암 1세가 아트론사 마리암에 다시 묻었다. 이 왕조는 1974년까지 이어졌다. 야그베우 세욘 뒤 왕들의 이야기와 아므다 시욘 1세(1314~)의 정복은 다음 시대에 속한다."
  subjects: [ethiopia, zagwe-dynasty]
  links: []
  tags: [war, politics, religion]
  sources: ["Taddesse Tamrat, Church and State in Ethiopia 1270-1527 (Clarendon Press, 1972)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: mali-after-sundiata-1255
  year: 1255
  endYear: 1312
  title:
    ko: "순디아타 뒤의 말리: 사쿠라의 정변과 대서양 항해 전승(1255~1312)"
  summary:
    ko: "순디아타 케이타가 1255년 무렵 죽은 뒤 말리 제국의 왕위는 케이타 가문 안에서 오갔다. 일부 구전은 아들 예렐링콩(아랍어로 와리)이 뒤를 이었다고 하고, 이븐 할둔이 적은 왕 순서에는 와리, 와티, 칼리프, 아부 바크르가 차례로 나오며 이름과 순서는 사료마다 갈린다. 이 글은 그 사이 몇몇 왕을 '…를 거쳐'로 건너뛴다. 와리는 메카 순례를 한 왕으로 적힌다. 왕 칼리프를 몰아내고 아부 바크르를 세운 정변에 사쿠라가 끼었다는 추측도 있다. 1285년 무렵(델라포스의 추정) 케이타 가문이 아닌 사쿠라가 왕위를 차지했다. 이븐 할둔은 그를 '마울라'(보호받는 사람)로 부르고 전승은 '작은 노예'라는 뜻의 조니로 불러 해방 노예 출신으로 본다. 사쿠라는 나라를 안정시키고 영토를 넓혔으며 북아프리카와의 교역을 늘렸다. 이븐 할둔은 그가 서쪽 대양과 동쪽 타크루르까지 말리의 힘을 뻗었다고 썼으나, 가오 정복의 공이 사쿠라인지 뒷날의 만사 무사인지는 사료마다 다르다. 사쿠라는 1300년 무렵 메카 순례에서 돌아오는 길에 죽임을 당했는데, 장소는 트리폴리 가까운 타주라가 가장 유력하다고 본다. 전승은 순디아타의 손자 콘 마마디(쿠)가 딸의 도움으로 그를 죽였다고 전한다. 뒤를 이은 왕은 쿠 또는 가오라 하며 1300~1305년 무렵 케이타 가문의 지배를 되살렸다. 그의 아들 무함마드는 대서양 항해를 두 차례 시도해 첫 번째가 실패하자 직접 두 번째 배에 올라 무사를 대리인으로 세우고 떠났으며, 돌아오지 않자 무사가 1312년 무렵 만사로 인정받았다고 한다. 이 항해 이야기는 무사가 카이로에서 알우마리에게 전한 말에 기댄 것이다. 무사의 즉위 뒤 일은 다음 시대에 속한다."
  subjects: [mali-empire]
  links: []
  tags: [politics]
  sources: ["Nehemia Levtzion, Ancient Ghana and Mali (Methuen, 1973)", "Nehemia Levtzion and J.F.P. Hopkins, Corpus of Early Arabic Sources for West African History (Cambridge University Press, 1981)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]

- id: mamluk-nubia-1272
  year: 1272
  endYear: 1317
  title:
    ko: "맘루크 술탄국의 누비아 개입(1272~1317)"
  summary:
    ko: "13세기 중엽 아이유브 왕조를 이어 이집트를 차지한 맘루크 술탄국은 마쿠리아에 압박을 더했다. 1265년 맘루크군이 동골라 근처까지 남하해 습격했다는 이야기가 있으나 분명하지 않다. 1268년 또는 1269년 다우드가 마쿠리아의 왕위를 빼앗았고, 다우드가 1272년 홍해의 항구 아이자브를 약탈하자 맘루크 술탄 바이바르스는 대군을 보냈다. 1276년 1월 20일(율리우스력)에 원정군이 길을 나섰고, 맘루크군은 동골라에서 누비아군을 크게 꺾고 도시를 약탈했다. 다우드는 남쪽으로 달아났다가 붙잡혀 바이바르스에게 넘겨져 카이로에 갇혔다. 그해 6월 4일 맘루크는 마슈쿠다를 왕으로 앉히고 충성을 맹세시켜 마쿠리아를 맘루크의 속국으로 만들었으나, 마슈쿠다는 얼마 뒤 암살당했다. 1276년 맘루크는 마슈쿠다에게 지즈야(비무슬림에게 물리는 인두세)를 걷게 하는 조건을 걸었으나 실제로는 시행되지 않았을 것으로 보며, 13세기 옛 동골라에서 확인되는 소 떼의 대량 도살은 마쿠리아의 경제를 흔들려던 맘루크의 행위와 이어 본다. 그 뒤 몇 왕을 거쳐 1286년 무렵에는 시마문이 왕권을 쥐고 있었고, 1311년에는 쿠단베스가 왕위를 차지했다. 맘루크는 곧 압둘라 바르샴부를 왕으로 앉혔고 그는 1316년에 마쿠리아의 첫 무슬림 왕이 되었으나 1317년 말 반 카즈 에미르 무함마드에게 죽임을 당했다. 이때 압둘라 바르샴부는 동골라의 옥좌실을 모스크로 바꿨다. 이후 마쿠리아는 이따금 무슬림 왕이 다스렸으나 백성 대부분은 기독교도로 남았다. 14세기 중엽 순례자 니콜로 다 포지본시는 맘루크 술탄이 라틴 기독교인의 누비아 출입을 막았다고 적었는데, 그들이 누비아 사람을 부추겨 전쟁에 나서게 할까 두려워해서라고 한다. 바크트로 이어진 평화는 맘루크 시대에 사이가 매우 나빠져 끝내 전면전으로 번졌다. 1317년 뒤 마쿠리아의 몰락은 「마쿠리아의 몰락(1317~1365)」(뒤의 사건)에서 다룬다."
  subjects: [makuria, mamluk-sultanate]
  links:
