  tags: [war, politics]
  sources: ["Derek A. Welsby, The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the Middle Nile (British Museum Press, 2002)", "The Cambridge History of Africa, vol. 3 (Cambridge University Press, 1977)"]
