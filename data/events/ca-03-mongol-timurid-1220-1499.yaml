# 중앙아시아 사건 3차 묶음(ca-03): 몽골의 침입·차가타이 칸국·카르트와 수피 왕조, 티무르 시대와 모굴리스탄·카자흐 칸국의 성립·티무르 왕조의 갈라짐 — 사마르칸트·헤라트·하미·투루판·칸다하르·페르가나 (1220 ~ 1499년)
# 범위: 몽골의 부하라·사마르칸트 점령과 다스림의 시작·구처기의 서행·차가타이 울루스·카르트 왕조·바라크와 카이두·고창 위구르 왕국과 원·차가타이 칸국·두와의 재건·케벡과 타르마시린·낙슈반디 교단·이븐 바투타·추강 골짜기의 역병·카자간과 모굴리스탄의 분리·호라즘의 수피 왕조·일리야스 호자의 사마르칸트 포위(1220~1369), 티무르의 사마르칸트와 모굴리스탄 원정·히지르 호자의 투루판 정복과 하미의 카라델·클라비호의 사행과 티무르의 죽음·계승 전쟁·명의 서역 사행·와이스 칸과 에센 부카 2세·아부 알카이르와 유목 우즈베크·오이라트의 서진·아부 사이드와 호자 아흐라르·유누스 칸·카자흐 칸국의 성립·후사인 바이카라의 헤라트·투루판과 명의 하미 다툼·둘눈 아르군과 칸다하르·바부르의 페르가나(1370~1499).
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(오고타이 울루스·킵차크 칸국 아래의 호라즘 북부·유목 우즈베크·오이라트·티무르 왕조의 페르가나·발흐·카불 갈래 등)은 글로만 다뤘다.
# 날짜: 출처 달력 그대로 적었다. 히즈라력·명 연호는 쓰지 않았고, 확실하지 않은 날짜는 '무렵'으로, 학설이 갈리는 해는 범위나 한 구절로 적었다. 차가타이 칸들의 재위는 목록과 정보 상자·본문이 한두 해씩 달라 갈리는 쪽을 괄호로 함께 적었다.
# 이름 규칙: 인명·지명은 표기 사전과 저장소 기존 표기를 따랐고, 항목이 있는 나라는 항목 이름으로 적었다. 몽골·티무르의 도시 파괴·강제 개종·장인 이주 같은 민감한 내용은 일어난 일과 사료 사정만 적었고, 숫자는 과장으로 보는 학계 평가를 함께 적거나 싣지 않았다.
# 사건 연도 규칙: subjects의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다. 한국사와 닿는 점은 이 구간에서는 따로 두지 않았다.

- id: mongol-transoxiana-1220
  year: 1220
  endYear: 1227
  title:
    ko: "몽골의 트란스옥시아나 점령과 다스림의 시작(1220~1227)"
  summary:
    ko: "1218년 오트라르의 총독 이날추크가 몽골의 상인 사절단을 붙잡아 죽이고 호라즘의 무함마드 2세가 그를 벌하지 않자, 칭기즈 칸은 1219년 가을 대군을 이끌고 시르다리야를 건넜다. 오트라르는 다섯 달가량 버텼으나 무너졌고 이날추크는 처형되었다. 1220년 2월 몽골군은 키질쿰 사막을 가로질러 부하라에 이르렀고, 도시는 함락되어 주민 상당수가 노예가 되거나 죽었으며 큰불로 시가지 대부분이 탔다. 같은 해 3월 칭기즈 칸이 직접 사마르칸트 앞에 이르러 거짓 후퇴와 위조 편지로 수비군을 갈라놓았고, 항복 조건이 깨진 뒤 남은 수비병이 처형되었다. 아무다리야 하류의 호라즘 도읍 우르겐치(구르간지)는 조치와 아우들의 불화로 공략이 한동안 어긋나 이 원정에서 가장 힘든 싸움이 되었고, 오고타이가 지휘를 맡아 싸움을 끝냈으며 도시는 물에 잠겼다. 톨루이가 이끈 군은 호라산의 메르브(1221년 2월)·니샤푸르·헤라트를 쳤고, 헤라트는 뒤에 반란을 일으켰다가 1222년 6월 장군 엘지기데이(일치기다이)의 군에게 다시 약탈당했다. 사료는 우르겐치에서 120만 명, 니샤푸르에서 170만 명 하는 식의 숫자를 적지만 학자들은 대체로 과장으로 본다. 정복이 끝나자 몽골은 점령한 도시마다 다루가치(감독관)를 두고, 호라즘 출신 상인 관료인 마흐무드 얄라바치에게 트란스옥시아나의 행정을 맡겨 세금과 장인을 거두었다. 이 땅은 칭기즈 칸이 죽은 뒤 차가타이의 몫이 된다. 전쟁 전체의 줄거리와 잘랄 앗딘의 저항은 「몽골의 호라즘 정복과 잘랄 앗딘(1219~1231)」(앞의 사건)에, 정복에 앞선 서요의 끝은 「쿠츨루크의 찬탈과 서요의 끝, 오트라르 사건(1208~1218)」(앞의 사건)에 있고, 차가타이 가문이 이 땅을 다스린 일은 「차가타이 울루스의 성립과 오고타이 가문 숙청, 알구의 독립(1227~1266)」(뒤의 사건)에서 이어진다."
  subjects: [mongol-empire, khwarazmian-empire, chagatai-khanate]
  tags: [war, politics]
  sources: ["Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Juvaini, Genghis Khan: The History of the World Conqueror, trans. J. A. Boyle (Manchester University Press, 1958)", "Michal Biran, Chinggis Khan (Oneworld, 2007)", "David Morgan, The Mongols, 2nd ed. (Blackwell, 2007)"]

- id: qiu-chuji-travel-1221
  year: 1221
  endYear: 1224
  title:
    ko: "구처기의 서행과 『장춘진인서유기』(1221~1224)"
  summary:
    ko: "전진교(全眞敎)의 도사 구처기(호는 장춘자)는 1219년 5월 칭기즈 칸이 보낸 초청 편지를 받고, 1220년 2월 산둥을 떠나 옌징(지금의 베이징)에서 겨울을 났다. 칭기즈 칸이 서쪽 원정길에 오른 뒤라 1221년 2월에야 다시 길을 떠나 몽골 고원의 오치긴 진영 곁을 지나 알타이를 넘고 일리강 골짜기 쪽으로 내려왔다. 그는 발라사군·탈라스·타슈켄트 일대를 거쳐 시르다리야를 건너 사마르칸트에 닿았고, 이 도시에서 몇 달을 머물렀다. 1222년에는 아무다리야를 건너 발흐와 아프가니스탄 북부를 지나 힌두쿠시 가까이 있던 칭기즈 칸의 진영에 이르렀다. 이때 칭기즈 칸은 호라즘의 마지막 저항을 이끈 잘랄 앗딘을 쫓는 중이었다(「몽골의 호라즘 정복과 잘랄 앗딘(1219~1231)」, 앞의 사건). 1223년 봄 구처기가 작별하자 칭기즈 칸은 전진교의 도관에 세금과 부역을 면제하는 칙서를 내렸고, 구처기는 1224년 1월 말 옌징으로 돌아왔다. 제자 이지상이 이 여행을 적은 『장춘진인서유기』는 만리장성에서 카불에 이르는 길의 산천과 사람들을 생생하게 그린 드문 기록으로, 몽골 사람들과 사마르칸트 주민의 모습을 스케치한 대목도 있다. 정복으로 큰 상처를 입은 도시들을 한 승려가 직접 지나며 남긴 이 글은 같은 시기 페르시아어 사료와는 다른 눈으로 쓰여, 몽골 제국이 종교인에게 세금과 부역을 면제하는 방침을 정복지 안팎에 두루 적용했음을 보여 준다. 이 길은 칭기즈 칸이 호라즘을 무너뜨린 직후 몽골 고원과 트란스옥시아나가 하나의 길로 이어졌음을 알려 주는 증거이기도 하다. 이 땅의 다스림이 어떻게 시작되었는지는 「몽골의 트란스옥시아나 점령과 다스림의 시작(1220~1227)」(앞의 사건)에 있다."
  subjects: [mongol-empire]
  tags: [culture, religion]
  sources: ["Arthur Waley, The Travels of an Alchemist: The Journey of the Taoist Ch'ang-Ch'un from China to the Hindukush at the Summons of Chingiz Khan (Routledge, 1931)", "Michal Biran, Chinggis Khan (Oneworld, 2007)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)"]

- id: chagatai-ulus-1227
  year: 1227
  endYear: 1266
  title:
    ko: "차가타이 울루스의 성립과 오고타이 가문 숙청, 알구의 독립(1227~1266)"
  summary:
    ko: "칭기즈 칸은 둘째 아들 차가타이에게 옛 서요 땅 일대, 곧 트란스옥시아나와 타림 분지에 걸친 울루스를 나누어 주었고, 1227년 칭기즈 칸이 죽자 차가타이 울루스(차가타이 칸국)가 섰다. 차가타이는 대칸이 있는 카라코룸의 명령을 따르면서 1242년 죽을 때까지 칸 자리에 있었다. 이 칸국의 정주 지역 행정은 몽골 귀족이 아니라 호라즘 출신 관료 마흐무드 얄라바치와 아들 마수드 벡이 맡았고, 마수드 벡은 1238년 부하라에서 터진 타라비의 봉기를 이듬해 진압했다고 한다. 차가타이가 죽은 뒤 손자 카라 훌라구가 칸이 되었으나 1246년 차가타이의 아들 예수 몽케로 바뀌었다. 1251년 몽케가 대칸에 오르자 오고타이 가문과 차가타이 가문의 왕자들이 모반을 꾀했다는 이유로 처형되거나 유배되었고(처형자는 77명에서 300명 사이로 추산된다) 예수 몽케도 이때 죽었다. 몽케는 카라 훌라구를 칸 자리에 돌려보냈으나 그가 곧 죽어, 아내 오르가나 카툰이 어린 아들 무바라크 샤를 대신해 섭정했다(1252~1260). 몽케는 1253년 무렵 마수드 벡을 투르키스탄 행정의 책임자로 다시 세웠다. 몽케가 죽은 뒤 쿠빌라이와 아릭 부케가 대칸 자리를 다투자(1260), 아릭 부케가 알구를 차가타이 울루스의 칸으로 세웠는데 알구는 곧 그에게 맞서 독립했고, 사마르칸트·부하라를 차지하고 블루 호르드의 옛 땅을 흡수했다고 전한다(재위 1260~1266, 1265년 죽음으로 적는 서술도 있다). 이어 무바라크 샤가 다시 칸이 되었는데, 이슬람으로 개종한 첫 차가타이 칸으로 전한다. 그는 곧 바라크에게 밀려난다(「바라크의 트란스옥시아나와 카이두(1266~1271)」, 뒤의 사건). 이 시기 차가타이의 유목 귀족은 대부분 텡그리 신앙과 불교를 믿었고 트란스옥시아나의 도시민은 이슬람을 믿어, 이 차이가 뒷날 칸국이 갈라지는 바탕이 된다."
  subjects: [chagatai-khanate, mongol-empire]
  tags: [politics]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Thomas T. Allsen, Mongol Imperialism: The Policies of the Grand Qan Möngke in China, Russia, and the Islamic Lands, 1251–1259 (University of California Press, 1987)", "Juvaini, Genghis Khan: The History of the World Conqueror, trans. J. A. Boyle (Manchester University Press, 1958)"]

- id: kart-herat-1245
  year: 1245
  endYear: 1381
  title:
    ko: "헤라트의 카르트 왕조(1245~1381)"
  summary:
    ko: "카르트 왕조는 구르 왕조에게 속하던 가문이 몽골 제국 아래에서 헤라트를 다스리며 일어선 왕조로, 샴스 앗딘 무함마드(1245~1277)가 몽골에 복속해 헤라트의 통치를 인정받으며 시작되었다. 그는 몽케 칸을 찾아가 충성을 맹세했고, 일 칸국의 아바카가 그를 의심해 타브리즈에서 독살했다고 전한다(1277년 또는 1278년 1월). 아들 루큰 앗딘(1277~1295)부터 군주들은 '말리크' 칭호를 썼다. 1280년대에는 일 칸국이 칸다하르·자불리스탄·헬만드 쪽을 카르트 가문 몫으로 인정해, 영역이 헤라트에서 아프가니스탄 남부까지 넓어졌다고 한다. 이어 파흐르 앗딘(1295~1308)은 문예를 후원한 독실한 군주로, 1306년 일 칸국이 보낸 1만 병력을 헤라트에서 물리쳤으나 1307년 죽은 뒤 울제이투가 헤라트를 정복했다. 기야스 앗딘(1308~1329)은 1320년 메카 순례를 다녀왔고 차가타이 가문 야사우르의 침입을 일 칸국 군의 도움으로 막았으며, 1327년 아부 사이드의 압박에 못 이겨 초판을 처형했다. 샴스 앗딘 2세(1329~1330)와 학자 하피즈(1330~1332)를 거쳐 무이즈 앗딘 후사인(1332~1370)이 가장 큰 세력을 이루었다. 그는 1342년 자바에서 사르바다르 왕조를 꺾었고 일 칸국이 무너진 뒤 1349년 독립한 술탄을 칭했으며, 젊은 티무르를 곁에 두었다고 한다. 카자간이 이끈 연합군이 헤라트를 약탈한 해는 1351년으로도, 1358년 무렵으로도 적는다. 기야스 앗딘 피르 알리(1370~1389)는 1375~1376년 무렵 니샤푸르를 얻고 티무르의 조카딸과 아들을 혼인시켰으나, 티무르에게 복속하지 않아 1381년 4월 헤라트가 무너졌다. 도시의 성벽은 허물어지고 학자들이 사마르칸트로 끌려갔다. 1382년 헤라트의 말리크들이 일으킨 반란에 피르 알리가 가담했다가 1383년 무렵 가족과 함께 처형되었고, 남은 카르트 일족은 1396년 미란 샤의 연회에서 살해되어 왕조가 끝났다. 이 정복은 「티무르의 이란 정복: 호라산에서 시라즈까지(1381~1393)」(뒤의 사건)에서 이어진다."
  subjects: [kart-dynasty, mongol-empire, ilkhanate, chagatai-khanate, timurid-empire]
  tags: [politics]
  sources: ["Lawrence G. Potter, The Kart Dynasty of Herat: Religion and Politics in Medieval Iran (Columbia University dissertation, 1992)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)"]

- id: baraq-chagatai-1266
  year: 1266
  endYear: 1271
  title:
    ko: "바라크의 트란스옥시아나와 카이두(1266~1271)"
  summary:
    ko: "차가타이의 증손 바라크(기야스 앗딘)는 1266년 9월 무바라크 샤를 몰아내고 차가타이 울루스의 칸이 되었고, 이슬람으로 개종해 기야스 앗딘이라는 이름을 썼다. 그는 타림 분지를 두고 쿠빌라이와 부딪쳤고, 오고타이 가문의 카이두와도 싸웠다. 카이두는 킵차크 칸국의 멩구 테무르의 도움으로 바라크를 후잔트 근처에서 꺾었고, 바라크는 도시를 약탈해 군대를 다시 일으켜야 했다. 두 사람은 탈라스에서 만나 화해했는데, 『집사』는 이를 1269년 봄이라 하고 다른 사료는 1267년 무렵 사마르칸트 남쪽이라고 적어 해와 장소가 엇갈린다. 이 화해로 트란스옥시아나는 바라크와 카이두, 멩구 테무르가 나누어 갖기로 했다고 전한다. 바라크는 서쪽의 일 칸국으로 눈을 돌려 1269년 또는 1270년 호라산을 쳤으나 1270년 7월 22일 헤라트 앞에서 일 칸 아바카의 군에게 크게 졌다. 그는 이듬해인 1271년 8월 9일 죽었다. 카이두의 군이 바라크의 진영에 이르렀을 때는 이미 숨진 뒤였고, 한 사료는 카이두가 독을 썼다고 적는다. 카이두는 그달 안에 오고타이 가문의 칸으로 추대되었고, 그 뒤 죽을 때까지 차가타이 칸을 마음대로 세웠다. 바라크 뒤로는 네구베이(재위 1271~1272)가 카이두의 뜻으로 칸이 되었고 부카 테무르(재위 1272~1282 무렵)가 이었으나 칸의 힘은 약했다. 이 일은 몽골 제국이 칸국들로 갈라지는 과정과 겹치며, 일 칸국 쪽 사정은 「일 칸국의 정비: 아바카에서 아르군·가이하투·바이두까지(1265~1295)」(앞의 사건)에 있고, 원과 칸국들의 다툼은 「카이두의 도전과 몽골 제국의 칸국 분열(1266~1304)」(같은 해의 사건)에 있고 두와가 칸이 된 뒤의 재건은 「두와와 차가타이 칸국의 재건, 원과의 화의(1282~1309)」(뒤의 사건)에 있다."
  subjects: [chagatai-khanate, ilkhanate, golden-horde]
  tags: [politics, war]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "David Morgan, The Mongols, 2nd ed. (Blackwell, 2007)"]

- id: qocho-yuan-chagatai-1270
  year: 1270
  endYear: 1335
  title:
    ko: "고창 위구르 왕국과 원·차가타이 칸국 사이(1270~1335)"
  summary:
    ko: "고창 위구르 왕국의 이디쿠트(왕) 바우르추크 아르트 테긴은 1209년 서요의 감독관을 죽이고 칭기즈 칸에게 복속했고, 이 왕국은 그 뒤 몽골 제국과 원의 속국으로 1335년까지 이어졌다. 위구르 사람들은 몽골 제국 안에서 서기와 관료로 일했다. 1270년대에 원과 카이두·두와 사이의 다툼이 투루판 분지로 번지면서 이 왕국은 전쟁터가 되었다. 카이두는 1275년 우루무치를 침입해 복속을 요구했으나 불교도인 이디쿠트가 맞섰고, 쿠빌라이가 구원군을 보내 카이두를 몰아냈다. 한 사료는 두와가 아우 부즈마와 함께 군사 12만으로 고창성을 여섯 달 에워쌌으나 점령하지 못했고, 이디쿠트 쾨스카르(재위 1266~1276 또는 1280)가 딸을 두와에게 시집보내 포위를 풀게 했다고 전한다. 쾨스카르는 1276년 카이두군과 싸우다 죽었다는 설도 있어 연대가 사료마다 어긋난다. 원은 1278년 베슈발리크에 수비대를 두었고 1280년 이후에는 제공직이 이끌게 했다. 쾨스카르 뒤의 이디쿠트 노렌 테긴(재위 1276 또는 1280~1318)은 전쟁 속에서 1280년대 중반(1283~1284년 무렵) 투루판을 떠나 하미를 거쳐 간쑤의 영창 쪽으로 옮겨 원의 보호를 구했다고 한다. 1308년 원 조정은 노렌 테긴에게 고창왕의 칭호를 내렸다. 이 사이 투루판과 하미는 차가타이 칸국의 영향 아래 들어갔고, 1295년 무렵 차지했다는 연표도 있으나 확실하지 않다. 이디쿠트 가문은 1318년 무렵 이후에도 토무르 부카(재위 1318 또는 1322~1327 또는 1330)와 1335년 즉위한 월루테무르(재위 1335~1353)를 거쳐 1350년대의 칭 티무르까지 이름이 전한다. 종교로는 마니교가 11세기 초까지 왕가의 믿음이었으나 960년대부터 불교가 힘을 얻어 1008년께 마니교 사원이 불교 사원으로 바뀌었고, 경교와 이슬람 신도도 함께 살았다. 이 왕국의 끝은 「히지르 호자의 투루판 정복과 고창 위구르 왕국의 끝, 하미의 카라델(1388~1406)」(뒤의 사건)에 있다."
  subjects: [qocho-uyghur-kingdom, yuan, chagatai-khanate, mongol-empire]
  tags: [politics, religion]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Thomas T. Allsen, Culture and Conquest in Mongol Eurasia (Cambridge University Press, 2001)", "Nicola Di Cosmo, Allen J. Frank, Peter B. Golden, eds., The Cambridge History of Inner Asia: The Chinggisid Age (Cambridge University Press, 2009)"]

- id: duwa-chagatai-1282
  year: 1282
  endYear: 1309
  title:
    ko: "두와와 차가타이 칸국의 재건, 원과의 화의(1282~1309)"
  summary:
    ko: "1282년 카이두는 바라크 아들들과의 다툼을 끝내려고 두와를 차가타이 칸국의 칸으로 세웠다. 두와는 카이두의 곁에서 원과 싸우며 칸국을 다시 일으켜 세웠고, 이 시기에 칸국이 가장 힘이 셌다고 평가한다. 1295년 초 두와는 일 칸국의 군이 계승 다툼으로 흩어진 틈을 타 호라산과 마잔다란을 침입해 여덟 달가량 마잔다란에 머물다가 카이두의 부름으로 물러났고, 푸샨을 빼앗았으나 쿠수이 공략은 실패했다. 1298년부터는 원의 변경을 자주 건드렸고, 1301년 카이두와 함께 카라코룸을 공격했으나 카이두가 그 싸움 뒤 죽었다. 두와는 카이두가 고른 후계자 오루스를 외면하고 카이두의 맏아들 차파르를 앞세워 1303년 즉위시켰으며, 곧 차파르에게 원의 테무르 칸에게 복속하라고 몰아쳤다. 1303~1304년 무렵 원과 서쪽 칸국들 사이에 화의가 이루어져 40년 가까이 이어진 다툼이 끝났다(「카이두의 도전과 몽골 제국의 칸국 분열(1266~1304)」, 앞의 사건). 1305~1306년 두와와 차파르 사이에 싸움이 터졌고, 두와는 화해를 청하는 척하다가 차파르가 아우들을 물린 뒤 공격했다. 1306년 원의 카이산(뒤의 무종)이 보낸 군이 두와를 돕고 부하 장수들이 떠나자 차파르는 1307년 초 항복했고, 두와는 차파르를 물리고 양기차르를 세웠다. 원은 두와의 동북쪽 땅 일부를 얻었고 테무르 칸이 선물을 보내 두 나라 사이가 풀렸다. 두와는 1307년 죽었고 아들 쾬체크가 이었으나 1308년까지 한 해 남짓, 이어 탈리쿠(1308~1309)가 칸이 되고 케벡이 에센 부카를 세우는 등 칸 자리가 빠르게 바뀌었다. 두와가 칸국을 다시 모은 일은 칸국이 이슬람 도시 사회와 가까워지는 길을 열었고, 두와의 아들 케벡이 이를 이어 간다(「케벡의 개혁과 타르마시린의 이슬람 수용(1318~1334)」, 뒤의 사건)."
  subjects: [chagatai-khanate, yuan, ilkhanate]
  tags: [politics, war]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "David Morgan, The Mongols, 2nd ed. (Blackwell, 2007)"]

- id: kebek-tarmashirin-1318
  year: 1318
  endYear: 1334
  title:
    ko: "케벡의 개혁과 타르마시린의 이슬람 수용(1318~1334)"
  summary:
    ko: "차가타이 칸국은 1309년 케벡이 탈리쿠를 죽이고 형 에센 부카 1세를 칸으로 세웠고(재위 1310~1318, 목록에 따라 케벡의 짧은 재위 1309~1310을 따로 세기도 한다), 에센 부카는 케벡에게 일 칸국 원정을 맡겼다. 케벡은 1314년 아무다리야를 건너 무르가브 싸움에서 이기고 헤라트까지 나아갔다가 동쪽에서 원이 쳐들어오자 물러났다. 1318년 케벡이 다시 칸이 되었고(1319년으로 적는 서술도 있다), 1320년 6월 일 칸국으로 돌아선 야사우르를 죽였다. 케벡은 칸국 전체에 통하는 화폐를 만들기 시작한 칸으로 꼽히며(늦어도 그의 시대에는 시작되었다), 옛 유목 칸들과 달리 도시에 도읍을 두려 해 카르시가 그의 시대에 칸국의 도읍이 되었다. 한편 원 황제 영종과의 국경 충돌이 있던 1323년에는 곧 항복하고 해마다 공물을 바쳤으며, 황실 공주 둘과 혼인해 원과 다투는 일을 피했다. 케벡은 1325년 또는 1326년에 죽었고 아우 엘지기데이(차가타이 칸, 1326~1329)와 두와 테무르(1329~1330)가 이었다. 이어 칸이 된 타르마시린(재위 1331~1334, 1326년부터로 적는 목록도 있다)은 이슬람으로 개종해 알라 앗딘이라는 이름을 썼고, 대부분 텡그리 신앙과 불교를 믿던 몽골 귀족의 반감을 샀다. 그는 유목 생활보다 트란스옥시아나의 도시에 머물기를 즐겼고, 칭기즈 칸의 법(야사)을 저버렸다는 비난을 받았다. 인도 북서부를 침입했다는 기록(1327~1329 무렵)도 전하지만 델리 술탄국 쪽 사료와 해가 엇갈린다. 결국 그는 매년 열리는 쿠릴타이에서 쫓겨나 사마르칸트 가까이로 달아나다가 1334년 동쪽 차가타이 왕자들에게 죽었다. 이븐 바투타가 타르마시린의 궁정을 찾은 일은 「이븐 바투타가 본 트란스옥시아나와 힌두쿠시(1333)」(뒤의 사건)에 있다. 이 시기 칸국 서쪽은 이슬람 도시 사회로, 동쪽은 유목 사회로 기울어, 두 쪽의 틈이 뒷날 칸국이 갈라지는 바탕이 되었다."
  subjects: [chagatai-khanate, ilkhanate, yuan]
  tags: [politics, religion, economy]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)"]

- id: naqshbandi-order-1318
  year: 1318
  endYear: 1389
  title:
    ko: "바하웃딘 낙슈반드와 낙슈반디 교단(1318~1389)"
  summary:
    ko: "낙슈반디 교단은 트란스옥시아나의 이슬람 신비주의 교단으로, 이 교단의 이름이 된 바하웃딘 낙슈반드는 1318년 3월 부하라 가까운 카스르 이 힌두반에서 태어난 페르시아어 사용자다. 태어난 지 사흘 만에 호자간 교단의 스승 바바 무함마드 삼마시의 영적 아들로 받아들여졌고, 뒤에 아미르 쿨랄에게서 배웠다. 호자간은 중앙아시아의 이슬람 신비주의 전통으로, 낙슈반드의 교단은 이 흐름에서 갈라져 나왔다. '낙슈반드'라는 이름의 유래는 분명하지 않으나, 끊임없는 기도로 신의 이름이 마음에 새겨진다는 뜻으로 뒤에 풀이했다. 그가 살던 때 차가타이 칸국의 서쪽인 트란스옥시아나는 타르마시린의 죽음 뒤 칸들이 흔들리고(「타르마시린 뒤의 칸들과 차가타이 울루스의 흔들림(1334~1346)」, 뒤의 사건) 카자간 같은 부족 아미르들이 실권을 쥐다가 1370년 티무르의 손으로 넘어간 격동기였다. 이런 때에도 카스르 이 힌두반은 순례자와 제자가 찾아오는 곳이 되어, 그가 1389년 3월 2일 죽은 뒤에는 '아는 이들의 성'이라는 뜻의 카스르 이 아리판으로 이름이 바뀌었다. 그의 가르침은 소리 내지 않고 마음속으로 신을 기억하는 수행(소리 없는 지크르)과 사람들 속에서 생업에 종사하며 마음은 늘 신 곁에 두는 생활을 강조한 것으로 알려져 있어, 수도원에 머물던 이전 수피들과 달리 도시의 장인과 상인 사이에서 퍼지기 쉬웠다. 그의 무덤은 부하라에 있고, 부하라의 수호성인으로 받들어진다. 낙슈반디 교단은 그가 죽은 뒤 세 세대 안에 중앙아시아 튀르크 사람들 사이에 지지를 얻었고, 15세기에는 호자 아흐라르 같은 지도자를 통해 티무르 왕조 궁정에까지 영향을 미쳤으며, 이 교단은 그 뒤 오스만과 인도로 퍼져 세계에서 가장 큰 수니파 수피 교단의 하나가 되었다. 이 흐름은 근세 중앙아시아의 호자 가문들과 이어진다."
  subjects: [chagatai-khanate]
  tags: [religion, culture]
  sources: ["Hamid Algar, 'Nakshbandiyya', Encyclopaedia of Islam, 2nd ed. (Brill)", "Jo-Ann Gross, Asom Urunbaev, The Letters of Khwāja ʿUbayd Allāh Aḥrār and His Associates (Brill, 2002)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)"]

- id: ibn-battuta-1333
  year: 1333
  endYear: 1334
  title:
    ko: "이븐 바투타가 본 트란스옥시아나와 힌두쿠시(1333)"
  summary:
    ko: "모로코 탕헤르 출신 이븐 바투타는 1325년 고향을 떠나 이슬람 세계를 돌았고, 킵차크 칸국의 우즈베크 칸(재위 1313~1341)의 궁정을 거쳐 콘스탄티노폴리스에 이르렀다(그곳에 닿은 해를 1332년 말이나 1334년으로 적어 연대가 갈린다). 되돌아와 아스트라한에서 우즈베크 칸에게 여행담을 아뢴 뒤 카스피해와 아랄해 쪽으로 길을 잡아 부하라와 사마르칸트에 닿았다. 이 길에서 그는 차가타이 칸국의 칸 타르마시린의 궁정을 찾았다. 타르마시린은 이슬람으로 개종한 칸으로, 이슬람 세계에서 온 여행자를 궁정에서 맞았다(「케벡의 개혁과 타르마시린의 이슬람 수용(1318~1334)」, 앞의 사건). 이븐 바투타는 사마르칸트를 가장 아름다운 도시의 하나로 꼽으면서도 1220년 몽골 침공과 그 뒤의 내전으로 성벽이 무너져 있었다고 적었다(「몽골의 트란스옥시아나 점령과 다스림의 시작(1220~1227)」, 앞의 사건). 사마르칸트에서 남쪽으로 아프가니스탄을 지나 힌두쿠시를 넘어 파르완에 이르렀는데, 이 산맥의 이름을 인도에서 끌려온 노예들이 추위에 많이 죽은 데서 왔다고 풀어 적었다. 그는 1333년 9월 12일 인더스강에 닿았고 델리로 들어갔다. 그의 여정은 킵차크 칸국에서 차가타이 칸국, 델리 술탄국으로 이어지는 이슬람 군주들의 후원 속에서 이루어졌고, 일부 구간은 직접 가 보지 않고 전해 들은 이야기를 섞었다는 의심도 받는다. 그의 여행기 『리흘라』는 1355년 이븐 주자이가 받아 적은 책으로, 칭기즈 칸의 정복 한 세기 뒤 트란스옥시아나의 도시들이 어떻게 살아 있었는지를 보여 주는 드문 현지 사료다. 이 책에 담긴 길은 몽골 평화 아래 유지된 대상로가 이슬람 도시들과 인도를 이었음을 알려 준다."
  subjects: [chagatai-khanate, golden-horde]
  tags: [culture, society]
  sources: ["Ibn Battuta, The Travels of Ibn Battuta, A.D. 1325–1354, trans. H. A. R. Gibb, Hakluyt Society (Cambridge University Press, 1958–2000)", "Ross E. Dunn, The Adventures of Ibn Battuta: A Muslim Traveler of the Fourteenth Century (University of California Press, 1986)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)"]

- id: chagatai-decline-1334
  year: 1334
  endYear: 1346
  title:
    ko: "타르마시린 뒤의 칸들과 차가타이 울루스의 흔들림(1334~1346)"
  summary:
    ko: "1334년 타르마시린이 죽은 뒤 차가타이 칸국은 칸이 해마다 바뀌다시피 했다. 부잔(재위 1334~1335)과 찬시(1335~1338)에 이어 예순 테무르(1338~1342, 1340년까지로 적는 목록도 있다), 알리 술탄(1342), 무함마드 이븐 풀라드(1342~1343)가 차례로 칸이 되었다. 이는 서쪽 도시 사회와 동쪽 유목 사회가 어느 칸을 받들지를 두고 갈라진 결과로, 칸의 즉위와 폐위는 늘 유목 귀족과 아미르들의 쿠릴타이가 결정했다. 알리 술탄 시대에 알말릭에서는 가톨릭 프란치스코회 선교사들이 죽임을 당했다고 전한다(1339년 무렵, 1342년으로 적은 기록도 있다). 이슬람과 유목 전통을 둘러싼 대립이 칸들의 성격에 따라 바뀌었음을 보여 주는 일로, 타르마시린의 개종 뒤 불교·경교·가톨릭 신자에게 불리한 분위기가 퍼졌다는 풀이가 있으나 사료가 적어 단정하기 어렵다. 동쪽에서는 타르마시린을 죽인 왕자들의 유목 귀족이 힘을 쥐어 알말릭 일대가 서쪽 도시 지역과 따로 움직이기 시작했고, 이것이 1347년 모굴리스탄이 서는 바탕이 된다. 1343년 즉위한 카잔 칸 이븐 야사우르(재위 1343~1346)는 트란스옥시아나 서쪽의 아미르들에게 기대어 카르시 가까이에서 지냈고. 이 무렵 일 칸국이 1335년 이후 무너져 서아시아의 칸위도 아미르들의 손에 달리게 된 것과 같은 흐름이 이곳에서도 진행되었다. 1345년 카라우나스 부족의 아미르 카자간이 카잔에게 반란을 일으켰다가 졌으나, 이듬해 1346년 카잔을 죽이는 데 성공했다. 이 일로 차가타이 칸들은 이름뿐인 존재가 되었고, 실권은 아미르들이 쥐었다. 이 뒤의 일은 「카자간의 트란스옥시아나와 모굴리스탄의 분리(1347~1370)」(뒤의 사건)에서 이어진다."
  subjects: [chagatai-khanate, ilkhanate]
  tags: [politics]
  sources: ["Michal Biran, The Empire of the Qaidu and the Making of Mongol Central Asia (Curzon Press, 1997)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)"]

- id: issyk-kul-plague-1338
  year: 1338
  endYear: 1339
  title:
    ko: "추강 골짜기의 경교도 묘비와 1338~1339년의 역병(1338~1339)"
  summary:
    ko: "지금의 키르기스스탄 북부 이시크쿨 호수 가까운 추강 골짜기에는 14세기 전반 경교(동방교회) 신자의 묘지가 남아 있다. 이곳의 비석에는 사람의 이름과 죽은 해, 그리고 흔히 죽은 까닭이 적혀 있는데, 1338~1339년에는 '역병'으로 죽었다는 기록이 눈에 띄게 늘어난다. 이 골짜기는 당시 차가타이 칸국의 동부 지역에 속했고, 초원길과 오아시스길이 이어지는 곳으로, 경교 신자가 다른 믿음의 사람들과 함께 살았다. 일부 역사가와 유행병학자는 이 비석이 흑사병의 시작을 알리는 증거라고 본다. 2022년 연구진은 이 지역 카라지가치와 부라나 유적의 유해 일곱 구의 치아를 분석해 이 가운데 일부에서 페스트균(예르시니아 페스티스)의 DNA를 확인했고, 이 키르기스스탄의 균주가 뒷날 1346~1347년 유럽과 중동을 덮친 흑사병 균주의 직접 조상이라고 발표했다. 그러나 이 논의는 아직 끝나지 않았다. 1338~1339년의 유행이 크지 않은 일회성 발병이었다는 견해도 있고, 중국과 중앙아시아에서 흑사병이 퍼져 나갔음을 보여 주는 문헌 기록이 부족하다는 반론도 있으며, 시작을 카스피해 북서쪽이나 쿠르디스탄으로 보는 학자도 있다. 연구진은 비석에 적힌 해와 DNA를 얻은 유해의 시기가 맞는다고 보았고, 이 묘지의 비석은 19세기 후반부터 러시아 학자들이 조사해 왔다. 페스트가 중국에서 중앙아시아를 거쳐 퍼졌다고 보는 데 반대하는 연구자는 실크로드가 이미 1325~1340년 무렵 어지러웠다는 점을 든다. 지금 분명한 것은 이 묘비가 1330년대 말 추강 골짜기에서 전염병이 돌았음을 알려 준다는 점이다. 이 병이 초원길을 따라 퍼져 유럽에 이른 과정은 「흑사병과 유대인 학살」(뒤의 사건)에 있다."
  subjects: [chagatai-khanate]
  tags: [society, religion]
  sources: ["Maria A. Spyrou et al., 'The source of the Black Death in fourteenth-century central Eurasia', Nature 606 (2022)", "Peter Jackson, The Mongols and the Islamic World: From Conquest to Conversion (Yale University Press, 2017)", "Philip Slavin, 'The Great Bovine Pestilence and its economic and environmental consequences in England and Wales, 1318–50', Economic History Review 65 (2012)"]

- id: chagatai-split-1347
  year: 1347
  endYear: 1370
  title:
    ko: "카자간의 트란스옥시아나와 모굴리스탄의 분리(1347~1370)"
  summary:
    ko: "카잔을 죽이고 차가타이 울루스의 실권을 쥔 카자간(?~1357 또는 1358)은 스스로는 칸을 칭하지 않고 아미르로 남아, 칭기즈 칸의 후손을 이름뿐인 칸으로 앉혔다(다니슈멘지 1346~1348, 바얀 쿨리 1348~1358). 1350~1351년 무렵 델리의 무함마드 빈 투글루크를 돕는 군을 보내기도 했고, 헤라트의 카르트 왕조를 친 연합군을 이끌어 헤라트를 약탈했다(1351년이라는 서술과 1358년 무렵이라는 서술이 갈린다). 그는 1357년 또는 1358년 부로르다이의 아들에게 살해되었고 아들 압둘라가 그 뒤를 이었으며, 샤 테무르(1358)가 칸 자리에 잠깐 앉았다. 한편 동쪽에서는 1347년 두글라트 부족의 아미르 불라지가 투글루크 티무르를 칸으로 올려 세웠고, 이로써 일리강·세미레치예와 타림 분지 쪽에 모굴리스탄이 섰다. 투글루크 티무르는 한 이슬람 학자 아르샤드 앗딘의 권유로 이슬람으로 개종했다(해는 1350년 또는 1354년 등 사료마다 다르다). 그는 1360년 3월 트란스옥시아나를 침입해 하지 베그를 달아나게 했고, 바를라스 부족의 티무르에게 이 지역을 맡겼다. 1361년 다시 이 땅에 들어와 부얀 술두스 등을 처형하고 아미르 후세인을 쳐부순 뒤, 아들 일리야스 호자를 총독으로 남기고 돌아갔다. 1363년 투글루크 티무르가 알말릭에서 죽자 서쪽 아미르 사이에 다툼이 일었다. 일리야스 호자는 칸이 되었으나 1365년 트란스옥시아나에서 크게 졌고(「일리야스 호자의 사마르칸트 포위와 시민들의 항전(1365)」, 뒤의 사건), 1368년께 죽었다. 트란스옥시아나는 후사인과 티무르의 몫이 되었고 칸으로는 카불 샤(1364~1370 무렵)가 이름만 있었다. 1370년 4월 티무르가 발흐에서 후사인을 꺾고 지배자로 올랐다. 그의 즉위와 이후는 「티무르의 즉위와 트란스옥시아나의 장악(1370~1380)」(뒤의 사건)에 있다. 이처럼 1347~1370년 차가타이 칸국은 서쪽의 아미르 정권과 동쪽의 모굴리스탄 칸국으로 갈라져, 서쪽에서는 아미르의 정치가 굳어졌다."
  subjects: [chagatai-khanate, moghulistan, kart-dynasty]
  tags: [politics, war]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "Michal Biran, 'The Chaghadaids and Islam: The Conversion of Tarmashirin Khan', Journal of the American Oriental Society 122 (2002)", "Mirza Haidar Dughlat, Tarikh-i-Rashidi, trans. Wheeler M. Thackston (Harvard University, 1996)"]

- id: sufi-khwarazm-1361
  year: 1361
  endYear: 1388
  title:
    ko: "호라즘의 수피 왕조와 티무르의 우르겐치 원정(1361~1388)"
  summary:
    ko: "호라즘은 아무다리야 하류의 오아시스로, 우르겐치(구르간지)가 1221년 몽골군에게 무너진 뒤 조치 가문의 울루스, 곧 뒤의 킵차크 칸국 아래에 들어가 있었다. 14세기 중엽 킵차크 칸국이 흔들리자 쿵그라트 부족 출신의 후사인 수피가 1361년 무렵 우르겐치에서 자립해 호라즘 북부를 차지했다. 수피 가문은 우즈베크 칸 시대에 군직을 버리고 수피가 되어 호라즘에 자리잡은 몽골 귀족 나그데이 비의 후손으로 전하며, 이 왕조는 호라즘샤 칭호를 쓰지 않았다. 후사인 수피(재위 1361~1372)는 카트와 히바까지 손에 넣었으나 이 땅은 이미 트란스옥시아나에서 일어난 티무르가 노리던 곳이었다. 티무르는 1372년 호라즘을 쳤고 후사인은 우르겐치 포위 중 죽었다. 아우 유수프 수피(재위 1372~1379)가 이어받았으나 1373년 티무르가 다시 우르겐치를 치자 카트와 히바에 대한 티무르의 종주권을 받아들이고 딸을 티무르의 아들 자한기르에게 시집보내 화의를 맺었다(1372년의 일로 적는 서술도 있다). 그러나 1379년 우르겐치가 함락되어 불탔으며 유수프는 포위 중 죽었다고 한다. 이 왕조는 1379년에 끝났다고 보는 서술도 있으나, 수피 가문의 술레이만 수피는 킵차크 칸국의 토크타미시와 손잡고 1387년 반란을 일으켰다가 티무르에게 진압되었고, 1388년 티무르는 우르겐치를 다시 쳐서 도시를 무너뜨렸다(「티무르와 토크타미시, 부이르 호 전투: 몽골 세계의 재편」, 뒤의 사건). 수피 가문은 그 뒤에도 티무르 왕조 아래에서 총독으로 호라즘을 다스렸고, 1505년 샤이반 왕조의 우즈베크가 호라즘을 얻을 때까지 이름이 전한다. 티무르가 호라즘을 여러 차례 공격한 일은 「티무르의 즉위와 트란스옥시아나의 장악(1370~1380)」(뒤의 사건)에도 나온다."
  subjects: [sufi-dynasty, golden-horde, timurid-empire]
  tags: [politics, war]
  sources: ["Yuri Bregel, An Historical Atlas of Central Asia (Brill, 2003)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)"]

- id: sarbadars-samarkand-1365
  year: 1365
  endYear: 1366
  title:
    ko: "일리야스 호자의 사마르칸트 포위와 시민들의 항전(1365)"
  summary:
    ko: "1363년 투글루크 티무르가 죽은 뒤 모굴리스탄의 칸이 된 아들 일리야스 호자는 트란스옥시아나를 되찾으려고 1365년 군을 이끌고 왔다. 그해 5월 타슈켄트 쪽의 진창이 많은 땅에서 아미르 후세인과 티무르의 군은 일리야스 호자에게 크게 졌고, 이 싸움은 사료에 '진창 전투'로 전한다. 이긴 일리야스 호자는 사마르칸트로 군을 몰았으나 주민들이 성문을 열지 않았다. 사마르칸트의 학자와 시민이 만든 민병 조직 '사르바다르'가 도시를 지켰다고 전하며, 이 사르바다르는 페르시아어로 '교수대 위에서도 물러서지 않는 사람'이라는 뜻의 말로 호라산의 사르바다르 정권과 이름이 같다(사료마다 사마르칸트의 지도자 이름과 경과가 다르다). 모굴군은 포위에 실패했고, 말 사이에 퍼진 전염병까지 겹쳐 트란스옥시아나를 떠났다. 후사인은 티무르의 처남으로 한때 티무르와 손잡았고, 티무르는 1360년 투글루크 티무르의 원정 때 그에게 합류해 트란스옥시아나 일부를 맡았던 인물이다. 항전이 끝난 뒤 후사인이 사마르칸트에 들어가 사르바다르 지도자 대부분을 처형했다고 전한다. 일리야스 호자는 얼마 뒤 모굴리스탄으로 돌아갔다가 1368년께 죽었는데(1369년으로 적는 서술도 있다), 그를 죽인 것으로 짐작되는 두글라트 가문의 카마르 앗딘이 칸 자리를 가로챘다(「티무르의 모굴리스탄 원정과 카마르 앗딘의 몰락(1370~1390)」, 뒤의 사건). 일리야스의 아우 히지르 호자는 몸을 숨겨 살아남았다가 뒷날 모굴리스탄을 되찾는다. 후사인과 티무르는 이 위기 뒤 서로 다투다가 1370년 티무르가 후사인을 꺾고 트란스옥시아나의 지배자가 되었다. 이 항전은 도시와 학자 계층이 차가타이 칸 가문의 권위가 흔들리던 때 자기 도시를 직접 지키려 한 사례로, 뒤이은 티무르 시대 사마르칸트의 번영이 도시민의 협력 위에 서 있었음을 짐작하게 한다."
  subjects: [chagatai-khanate, moghulistan]
  tags: [war, society]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Mirza Haidar Dughlat, Tarikh-i-Rashidi, trans. Wheeler M. Thackston (Harvard University, 1996)", "Ali Yazdi (Sharaf al-Din Ali Yazdi), Zafarnama"]

- id: timur-samarkand-1370
  year: 1370
  endYear: 1405
  title:
    ko: "티무르의 사마르칸트: 수도 건설과 장인 이주(1370~1405)"
  summary:
    ko: "티무르는 1370년 아미르 후세인을 꺾고 트란스옥시아나의 실권을 쥔 뒤 사마르칸트를 도읍으로 삼았고, 이 일은 「티무르의 즉위와 트란스옥시아나의 장악(1370~1380)」에 있다. 칭기즈 칸의 후손이 아니었던 그는 칸이 아니라 아미르라는 칭호를 썼고, 차가타이 가문의 칸(수유르가트미시 1370~1388, 마흐무드 1388~1402)을 명목상 위에 세워 두었다. 사마르칸트는 그의 원정이 이어지는 동안 전리품과 포로가 모이는 곳이 되었다. 1400년 다마스쿠스를 친 일은 「티무르의 이라크·시리아 원정과 죽음(1393~1405)」에 있는데, 이때 그곳의 장인들을 사마르칸트로 옮겼다는 기록이 있고 델리·시라즈·바그다드 같은 도시에서도 학자와 기술자를 데려왔다고 전한다. 옮겨 온 사람의 수는 사료마다 크게 달라 알 수 없다. 도시 안팎에는 이들이 지은 건물이 들어섰다. 샤히진다에는 티무르 가문 사람들의 영묘가 14세기 후반부터 늘어섰고, 인도 원정(1398~1399)을 마친 뒤에는 거대한 금요 모스크(비비하눔 모스크로 부르는 건물)를 1399년 무렵부터 1404년 무렵까지 지었다. 1403년 숨진 손자 무함마드 술탄을 위한 구르아미르 영묘도 이 무렵에 세워졌다. 성 밖에는 정복한 도시 이름을 딴 마을(카이로·다마스쿠스·바그다드·시라즈 등)과 정원이 만들어졌다고 클라비호는 전한다. 이 도시의 학문은 뒤에 울루그 베그의 천문학으로 이어지니, 「울루그 베그와 사마르칸트의 천문학(1417~1449)」(뒤의 사건)에 있다. 한편 도시를 짓는 데는 정복지에서 옮겨 온 장인과 포로의 손이 많이 들어갔다고 클라비호는 적었다. 후대의 궁정 연대기 『자파르나마』는 이 도시 건설을 티무르의 영광으로 그렸다."
  subjects: [timurid-empire]
  tags: [politics, culture]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Lisa Golombek and Donald Wilber, The Timurid Architecture of Iran and Turan (Princeton University Press, 1988)", "Ruy González de Clavijo, Embassy to Tamerlane 1403–1406, trans. Guy Le Strange (Routledge, 1928)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: timur-moghulistan-1370
  year: 1370
  endYear: 1390
  title:
    ko: "티무르의 모굴리스탄 원정과 카마르 앗딘의 몰락(1370~1390)"
  summary:
    ko: "차가타이 칸국이 트란스옥시아나와 모굴리스탄으로 갈라진 일은 「카자간의 트란스옥시아나와 모굴리스탄의 분리(1347~1370)」(앞의 사건)에 있다. 모굴리스탄의 투글루크 티무르(재위 1347~1363)가 죽은 뒤 아들 일리야스 호자(재위 1363~1368)가 뒤를 이었으나, 도글라트 부족의 아미르 카마르 앗딘이 반란을 일으켜 일리야스 호자를 죽이게 했다고 알려져 있다. 카마르 앗딘은 칭기즈 칸의 후손이 아니면서도 스스로 칸을 일컬었고, 많은 아미르가 따르지 않았으나 1368년부터 1390년까지 모굴리스탄의 실권을 쥐었다. 티무르는 트란스옥시아나를 굳히자(「티무르의 즉위와 트란스옥시아나의 장악(1370~1380)」, 같은 해의 사건) 동쪽의 이 이웃을 되풀이해 쳤고, 1370년대 초부터 1390년까지 적어도 다섯 차례 원정군을 보냈다. 그러나 모굴 군은 초원으로 물러나 싸움을 피할 수 있었고, 티무르는 번번이 결정적 승리를 얻지 못했다. 1390년의 원정 때 카마르 앗딘은 자취를 감추었고, 이 틈에 투글루크 티무르의 막내아들로 오랫동안 숨어 지낸 히지르 호자가 칸의 자리를 차지했다. 이 일은 「히지르 호자의 투루판 정복과 고창 위구르 왕국의 끝, 하미의 카라델(1388~1406)」(뒤의 사건)로 이어진다. 카마르 앗딘의 조카 후다이다드는 이후 도글라트 가문의 어른으로서 칸을 세우고 물리는 실력자가 되었고, 악수·호탄·카슈가르·야르칸드 같은 타림 분지 서쪽 오아시스를 일가 사람들에게 나누어 맡겼다. 명이 서역 교역을 열어 칸들이 대상에게서 거둔 세금(자카트)으로 힘을 보탠 것도 이 시기의 일이라고 한다. 이 일련의 싸움은 티무르의 정복 가운데 늘 이어진 변방전이었고, 그가 가장 크게 쓴 군사력은 서쪽과 남쪽 원정에 들어갔다."
  subjects: [timurid-empire, moghulistan]
  tags: [war, politics]
  sources: ["Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: khizr-khoja-turfan-1389
  year: 1388
  endYear: 1406
  title:
    ko: "히지르 호자의 투루판 정복과 고창 위구르 왕국의 끝, 하미의 카라델(1388~1406)"
  summary:
    ko: "고창 위구르 왕국의 앞 일은 「고창 위구르 왕국의 성립과 마니교·불교(866~984 무렵)」(앞의 사건)에 있다. 몽골 제국과 원에 복속했던 투루판의 위구르는 불교를 중심으로 마니교와 경교가 함께 남은 사회였는데, 1380년대 후반 모굴리스탄의 히지르 호자(재위 1389 또는 1390~1399)가 이곳을 쳐서 차지하고 주민에게 이슬람을 받아들이게 했다. 고창 위구르 왕국이 이때 끝났다고 보는 해는 1388년과 1389~1390년 무렵 사이에서 갈린다. 히지르 호자는 티무르와 화약을 맺고 1397년 딸 투칼 하눔을 티무르에게 시집보냈으며, 1399년 죽은 뒤 아들 샴스 이 자한(재위 1399~1408)이 뒤를 이었다. 투루판 동쪽의 하미(쿠물)에서는 원의 차가타이 가문 왕자 구나시리가 1380년대 후반 북원에서 떨어져 나와 독실한 불교 신자로서 주로 위구르 사람들을 다스렸다. 명은 1390년 무렵 이곳을 압박해 복속을 받았으나 직접 다스리거나 세금을 거두지는 않았다. 구나시리의 뒤는 아우 안케 티무르가 이었다고 하며, 1404년 명이 그를 충순왕에 봉했고 1406년 하미위를 두었다(중국 사서의 해). 이후 하미는 명의 서쪽 문밖에서 투루판·오이라트 사이에 낀 땅이 되어 이 일련의 다툼은 「투루판과 명의 하미 다툼(1473~1499)」(뒤의 사건)으로 이어진다. 한편 투루판의 불교 사원과 벽화는 이슬람화 뒤에도 한동안 남았고, 명 사신 진성은 1414년 투루판에서 불상과 사원을 보았다고 적었다. 하미가 공식으로 이슬람 땅이 된 것은 1513년의 일로 뒤에 온다. 투루판은 이 뒤 모굴리스탄 칸들의 땅으로 남아 15세기 후반 투루판 칸국의 바탕이 되었다(「유누스 칸의 모굴리스탄 재통합과 타슈켄트 획득, 칸국의 분열(1462~1503)」, 뒤의 사건)."
  subjects: [moghulistan, qocho-uyghur-kingdom, kara-del, ming, timurid-empire]
  tags: [politics, religion]
  sources: ["Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Morris Rossabi, Ming China and Turfan, 1406–1517, Central Asiatic Journal 16 (1972)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: clavijo-timur-death-1403
  year: 1403
  endYear: 1405
  title:
    ko: "클라비호의 사마르칸트 사행과 티무르의 죽음(1403~1405)"
  summary:
    ko: "카스티야 왕 엔리케 3세의 사절이 1402년 앙카라에서 티무르가 오스만의 바예지트 1세를 꺾을 때(「앙카라 전투와 오스만 공백기」) 이미 그의 진중에 있었고, 티무르가 답례 사절을 보내자 엔리케 3세는 이에 응해 루이 곤살레스 데 클라비호가 이끄는 사절단을 보냈다. 사절단은 1403년 5월 22일 카디스를 떠나 콘스탄티노폴리스·트라브존·타브리즈와 호라산을 거쳐 1404년 9월 4일 사마르칸트 가까이에 닿았다. 클라비호는 사마르칸트를 정원과 궁전·시장이 이어진 큰 도시로 그렸고, 티무르가 사절을 큰 과수원의 천막 궁전에서 맞았으며 잔치와 선물이 이어졌다고 적었다. 그가 남긴 여행기 『티무르 사행기』(스페인어 원제 Embajada a Tamorlán, 1582년 간행)은 티무르의 궁정을 외부인이 직접 본 드문 기록이다. 사절단이 1404년 11월 21일 떠난 지 엿새 뒤 티무르는 명을 치기 위한 원정에 나섰다. 그가 원정으로 원의 영광을 되살리려 했다고 보는 이도 있으나 속뜻은 사료가 알려 주지 않는다. 그러나 겨울 행군 도중 병이 들어 1405년 2월 17일이나 18일 시르다리야 쪽 파라브 근처에서 죽었다. 사절단은 1406년 3월 24일 카스티야 궁정에 돌아왔다. 티무르의 시신은 사마르칸트로 옮겨져 구르아미르에 묻혔다. 클라비호는 사마르칸트에 정복지에서 데려온 장인과 포로가 많이 살았다고 적었고, 명의 사절도 와 있었는데 티무르가 카스티야 사절을 그들보다 윗자리에 앉혔다고 전했다. 티무르의 죽음과 앞서의 원정은 「티무르의 이라크·시리아 원정과 죽음(1393~1405)」에, 그 뒤 일은 「티무르 사후의 계승 전쟁과 샤 루흐의 사마르칸트 입성(1405~1409)」(뒤의 사건)에 있다."
  subjects: [timurid-empire, ming]
  tags: [diplomacy, politics]
  sources: ["Ruy González de Clavijo, Embassy to Tamerlane 1403–1406, trans. Guy Le Strange (Routledge, 1928)", "Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: timur-succession-war-1405
  year: 1405
  endYear: 1409
  title:
    ko: "티무르 사후의 계승 전쟁과 샤 루흐의 사마르칸트 입성(1405~1409)"
  summary:
    ko: "티무르가 1405년 2월 죽자 그가 후계자로 정했다고 전하는(사료에 따라 갈린다) 손자 피르 무함마드는 곧 밀려나 1407년 부하에게 살해되었고, 셋째 아들 미란 샤의 아들 할릴 술탄(1384년생)이 티무르가 쌓아 둔 재물을 풀어 지지를 구하며 사마르칸트를 차지해 아홉 살 난 무함마드 자한기르를 명목상 칸으로 세웠다. 할릴은 1402년 페르가나를 다스리도록 맡겨졌던 인물로, 그의 즉위는 티무르 가문 안에서 곧 도전을 받았다. 한편 헤라트에서는 막내 아들 샤 루흐가 호라산을 쥐고 있었고, 서쪽 이란에서는 다른 후손들이 다투었다(「티무르 사후의 서부 이란: 카라 유수프의 아제르바이잔·이라크 장악(1405~1410)」, 같은 해의 사건). 후대의 역사가 콴다미르는 옛 스승 후다이다드(도글라트 가문)가 내란을 일으켜 할릴을 붙잡아 모굴리스탄의 샴스 이 자한(재위 1399~1408)에게 넘겼으나 샴스 이 자한이 후다이다드를 처형하고 할릴의 영지를 돌려주었다고 전한다(연대는 불분명). 결국 1409년 5월 13일 샤 루흐가 사마르칸트에 저항 없이 들어왔고 할릴의 통치는 끝났다. 샤 루흐는 이후 헤라트를 도읍으로 삼았다. 샤 루흐는 트란스옥시아나를 아들 울루그 베그에게 맡겼고, 할릴은 항복해 아내를 되찾고 레이의 총독이 되었으며 1411년 11월 3일 죽었다. 이븐 아랍샤는 독살이라 썼으나 근대 연구는 병사로 보고 샤 루흐의 가담도 없었다고 본다. 이 사건 뒤의 티무르 왕조는 헤라트(샤 루흐)와 사마르칸트(울루그 베그)가 짝을 이루는 체제로 굳었고, 이 일은 「샤 루흐의 헤라트와 티무르 왕조의 문예 부흥(1409~1447)」(뒤의 사건)에 있다."
  subjects: [timurid-empire, moghulistan]
  tags: [politics, war]
  sources: ["Beatrice Forbes Manz, The Rise and Rule of Tamerlane (Cambridge University Press, 1989)", "Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)", "Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)"]

- id: ming-western-envoys-1413
  year: 1413
  endYear: 1420
  title:
    ko: "명의 서역 사행과 진성의 『서역행정기』(1413~1420)"
  summary:
    ko: "영락제의 명은 바다로 「정화의 항해(1405~1433)」를 보내는 한편 육로로도 서역과 사신을 오갔다. 이는 몽골·티무르 이후 비단길의 교역과 말 공급이라는 이익이 걸린 일이었다. 진성(陳誠)은 1413~1414년 무렵부터 하미와 투루판 등 카라델과 모굴리스탄 지역을 거쳐 샤 루흐의 티무르 왕조 궁정(헤라트·사마르칸트)에 이르렀고, 1416년과 1420년에도 사행을 이었다. 그는 투루판에서 불상과 사원을 보았고, 길에서 본 나라들의 지리와 풍속을 『서역행정기』와 『서역번국지』에 남겼다. 진성의 사행기는 지나간 오아시스 나라들의 위치와 풍속을 짧게 적은 지리지 성격이 강하다. 이 기록은 15세기 초 서역 오아시스 나라들의 사정을 알려 주는 몇 안 되는 명 쪽 사료다. 샤 루흐도 답례 사절을 보냈는데, 기야스 앗딘 낙카시가 1420년 무렵부터 1422년 사이 명 궁정에 다녀온 여정을 일기로 남겼고, 이 일기는 뒤에 하페즈 아브루의 역사서에 옮겨져 전한다. 오간 사절은 말·옥·약재 같은 진상품을 바치고 명이 비단·도자기를 내리는 조공 형식을 따랐다. 하미는 이 길의 첫 관문이었고 투루판 분지를 거쳐 톈산 남북의 오아시스로 이어지는 길목이었으며, 명이 1406년 하미위를 세워 두고 충순왕을 통해 서역 사신을 중계한 것도 이 때문이다. 하미에서는 안케 티무르 뒤로 토토(1405~1411)와 면력 티무르(1411~1425)가 이어졌다. 모굴리스탄의 칸들은 이 시기 낙쉬 자한(재위 1415 무렵~1418)과 와이스 칸으로 이어졌다. 그러나 이 사행은 명이 서역에 직접 군사를 두려는 것이 아니라 조공 관계로 변경을 안정시키려는 성격이어서, 15세기 중반 오이라트가 압박해 오자 이 길은 흔들렸다."
  subjects: [ming, timurid-empire, kara-del, moghulistan]
  tags: [diplomacy, economy]
  sources: ["Morris Rossabi, China and Inner Asia: From 1368 to the Present Day (Thames and Hudson, 1975)", "Morris Rossabi, Ming China and Turfan, 1406–1517, Central Asiatic Journal 16 (1972)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)"]

- id: uwais-esen-buqa-moghulistan-1418
  year: 1418
  endYear: 1462
  title:
    ko: "와이스 칸과 에센 부카 2세의 모굴리스탄, 오이라트의 압박(1418~1462)"
  summary:
    ko: "히지르 호자(1399년 죽음)의 뒤를 샴스 이 자한(재위 1399~1408)·무함마드 칸(1408 무렵~1415 무렵)·낙쉬 자한(1415 무렵~1418)이 차례로 이었고, 그 사이 칸의 힘은 도글라트 가문의 아미르들이 크게 눌렀다. 1418년 와이스 칸(재위 1418~1421)이 올라 모굴 칸권을 다시 세웠다. 셰르 무함마드(1421~1425)를 사이에 두고 와이스는 1425년 무렵 복위해 1428년 무렵(1430년으로 적는 서술도 있다)까지 칸이었다. 이 시기 모굴리스탄은 톈산 북쪽의 일리강·이식쿨 초원과 남쪽 타림 분지 서쪽 오아시스를 함께 걸쳐, 유목 칸과 오아시스를 맡은 도글라트 아미르 사이의 긴장이 늘 있었다. 그러나 동쪽에서는 오이라트가 커졌다. 에센 타이시가 1420년대 동쪽 모굴리스탄에 여러 차례 원정해 와이스를 두 번 사로잡았다가 풀어 주었고, 오이라트의 영향이 베슈발리크까지 닿았다. 와이스가 죽을 무렵 열세 살쯤이던 맏아들 유누스는 에센 부카(2세)에게 밀려 울루그 베그에게 도망갔다가 갇혔고, 뒤에 샤 루흐가 그를 받아들여 야즈드에서 학문을 배우게 했다. 에센 부카 2세(재위 1428 또는 1429~1462)는 티무르 왕조의 영토를 되풀이해 노략했다. 그가 다스린 땅 가운데 카슈가르·야르칸드·호탄 같은 타림 분지 서쪽 오아시스는 도글라트 가문의 아미르들이 칸의 이름 아래 나누어 맡았다. 1456년 아부 사이드가 유누스를 모굴리스탄에 보내 에센 부카에 맞서게 했으나 유누스는 카슈가르에서 졌고, 이식쿨 근처를 영지로 받았다. 1457년 유누스는 카슈가르에 들어갔다. 에센 부카는 1462년 죽었고, 뒤는 도스트 무함마드가 이었다. 이 땅의 정치는 「유누스 칸의 모굴리스탄 재통합과 타슈켄트 획득, 칸국의 분열(1462~1503)」(뒤의 사건)로 이어진다."
  subjects: [moghulistan, timurid-empire]
  tags: [politics, war]
  sources: ["Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)"]

- id: abul-khayr-uzbeks-1428
  year: 1428
  endYear: 1468
  title:
    ko: "아부 알카이르 칸과 유목 우즈베크(1428~1468)"
  summary:
    ko: "칭기즈 칸의 장남 주치의 후손 가운데 샤이반 가문의 아부 알카이르 칸(1412 무렵~1468)은 1428년 지금의 시베리아 서쪽 투라강 둘레에서 유목민을 모아 칸이 되었고, 이들이 유목 우즈베크라 불렸다. 1430~1431년 호라즘을 쳐 우르겐치를 차지했으나 곧 물러났고, 1435~1436년에도 호라즘을 쳤다. 1446년부터는 시르다리야 쪽으로 내려와 티무르 왕조의 땅을 일부 빼앗았으며, 시그낙을 도읍으로 삼았다. 1451년에는 아부 사이드를 도와 압둘라를 물리치게 했으나 아부 사이드가 곧 사마르칸트에서 그의 군대를 내보냈다(「아부 사이드와 사마르칸트의 티무르 왕조, 호자 아흐라르(1451~1500)」). 그는 울루그 베그의 딸 라비야 술탄 베김을 아내로 맞았다. 1457년 무렵 오이라트(칼미크)에게 크게 졌다고 전하며, 이후 자니베크과 케레이가 그의 지배에서 떨어져 모굴리스탄으로 이주해 카자흐 칸국의 바탕을 이루었는데 이것이 「자니베크과 케레이, 카자흐 칸국의 성립(1465~1480 무렵)」이다. 아부 알카이르는 1468년(1469~1470년으로 적는 사료도 있다) 죽었다. 아들 샤이흐 하이다르가 뒤를 이었으나 곧 힘을 잃었고(모굴 군에게 졌다는 설과 시비르 칸 이박에게 1471년 무렵 죽었다는 설이 갈린다) 우즈베크는 분열했다. 아부 알카이르의 손자가 무함마드 샤이바니이며, 그는 1490년대부터 시르다리야 쪽에서 세력을 모으고 부룬둑 칸과 영역을 나누기로 합의했다(1495~1496 무렵). 이후 그는 1500년 사마르칸트를 차지했다. 이 일은 「무함마드 샤이바니의 트란스옥시아나 정복과 샤이반 왕조(1500~1510)」(뒤의 사건)에 있다."
  subjects: [timurid-empire, kazakh-khanate, moghulistan]
  tags: [politics, war]
  sources: ["Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)"]

- id: oirat-west-1440
  year: 1440
  endYear: 1457
  title:
    ko: "에센 타이시의 오이라트와 하미·투루판(1440~1457)"
  summary:
    ko: "서몽골의 오이라트는 토곤 타이시(1434 무렵~1438 사망)와 아들 에센 타이시의 시대에 몽골 초원의 강자가 되었다. 에센은 1438년 타이시 칭호를 이어받아 사실상 몽골의 지배자가 되었고, 1420년대 이미 동쪽 모굴리스탄을 쳐 와이스 칸을 사로잡은 적이 있었다. 1443년과 1445년에는 하미를 쳐서 왕자(카라델의 지배자)의 어머니와 아내를 끌고 갔고, 하미 왕자는 마침내 1448년 오이라트 쪽에 가담했다. 명이 1446년 하미 사람 1,230명을 옮겨 놓았다는 기록도 있다(전하는 숫자). 1445~1446년 간쑤의 사주·적근 쪽 부족장들도 에센이 내린 칭호를 받아야 했다. 1448~1449년 교역 분쟁이 커져 에센은 명을 쳤고, 1449년 토목에서 명 군을 무너뜨리고 정통제를 사로잡았다. 이 일은 「토목의 변과 베이징 방어전, 탈문의 변(1449~1457)」(뒤의 사건)에 있다. 에센은 1451~1452년 투루판 분지에서 몽골의 칸 타이순을 꺾어 죽였고, 1453년 스스로 대칸을 칭했으나 1454~1455년 내부 반란으로 죽었다. 이 틈에 서쪽에서는 아부 알카이르의 우즈베크가 1457년 무렵 오이라트(칼미크)에게 크게 졌다고 전한다. 에센의 죽음으로 오이라트는 몽골 초원의 패권을 잃었다. 한편 에센이 투루판 분지까지 진출한 일은 오이라트의 서쪽 끝이 베슈발리크에서 하미에 이르렀음을 보여 준다. 오이라트는 유목 연합의 성격이 강해 에센이 죽자 영향권이 곧 흩어졌다. 1469~1470년 무렵 오이라트와 관련된 키르기스가 톈산으로 옮겨 오기 시작한 일도 이 압박의 뒤끝으로 설명된다. 이 일련의 일로 하미·투루판은 모굴리스탄·몽골·명 사이에서 늘 끼인 땅이 되었다."
  subjects: [mongols, ming, kara-del, moghulistan]
  tags: [war, politics]
  sources: ["Morris Rossabi, China and Inner Asia: From 1368 to the Present Day (Thames and Hudson, 1975)", "Morris Rossabi, Ming China and Turfan, 1406–1517, Central Asiatic Journal 16 (1972)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: abu-said-timurid-1451
  year: 1451
  endYear: 1500
  title:
    ko: "아부 사이드와 사마르칸트의 티무르 왕조, 호자 아흐라르(1451~1500)"
  summary:
    ko: "울루그 베그(재위 1447~1449)가 아들 압둘 라티프에게 1449년 죽임을 당한 뒤 압둘 라티프(1449~1450)·압둘라 미르자(1450~1451)가 짧게 이어졌다. 1451년 6월 티무르의 증손 아부 사이드가 아부 알카이르 칸의 도움으로 압둘라를 꺾고 사마르칸트에 들어가 티무르 왕조의 자리를 주장했다. 그는 낙슈반디 교단의 어른 호자 우바이둘라 아흐라르(1490년 죽음)의 영향 아래 사마르칸트와 부하라에서 샤리아를 되살리고 농지와 세제를 정비했다고 전한다. 1450년대 말(1456~1459로 출처마다 갈린다) 자한 샤가 호라산에서 물러나자 아부 사이드는 호라산을 다시 합쳐 헤라트를 도읍으로 삼았다. 1468~1469년 아크코윤루의 우준 하산을 치러 갔다가 카라바그 싸움에서 져서 사로잡혔고, 1469년 2월 5일 야드가르 무함마드의 손에 처형되었다(「우준 하산의 아크코윤루: 카라코윤루 정복과 오틀룩벨리(1467~1478)」). 헤라트는 후사인 바이카라가 차지했고(「후사인 바이카라의 헤라트와 나바이·자미·비흐자드(1469~1506)」), 아부 사이드의 아들들이 땅을 나누었다. 아흐마드 미르자는 사마르칸트를 1469년부터 1494년까지, 마흐무드는 히사르와 바다크샨을 1495년까지, 우마르 샤이크는 페르가나를 1494년까지, 울루그 베그 2세는 카불과 가즈니를 1502 무렵까지 맡았다. 아흐마드 뒤 사마르칸트는 바이순코르 미르자(1495~1497) 뒤에 바부르가 1497~1498년 잠시 차지했고(「바부르의 페르가나 즉위와 사마르칸트 쟁탈(1494~1504)」) 이어 알리 미르자가 다스렸으며, 1500~1501년 샤이바니가 차지하면서 끝났다. 이 일의 후속은 「무함마드 샤이바니의 트란스옥시아나 정복과 샤이반 왕조(1500~1510)」(뒤의 사건)에 있다."
  subjects: [timurid-empire, aq-qoyunlu]
  tags: [politics, religion]
  sources: ["Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)", "Jo-Ann Gross and Asom Urunbaev, The Letters of Khwaja Ubayd Allah Ahrar and His Associates (Brill, 2002)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: yunus-khan-moghulistan-1462
  year: 1462
  endYear: 1503
  title:
    ko: "유누스 칸의 모굴리스탄 재통합과 타슈켄트 획득, 칸국의 분열(1462~1503)"
  summary:
    ko: "유누스 칸(1416 무렵 출생, 재위 1462~1487)은 와이스 칸의 아들로 1428년 에센 부카에게 밀려 울루그 베그에게 도망갔다가 샤 루흐 밑에서 야즈드에 머물며 자랐다. 1456년 아부 사이드가 그를 모굴리스탄에 보냈으나 카슈가르에서 졌고, 1457년 카슈가르에 들어갔으며, 1462년 에센 부카가 죽은 뒤 도스트 무함마드(1469년 무렵 죽음)가 올랐다가 둘로 갈라졌던 땅을 유누스가 다시 합쳤다. 1468~1469년 도스트 무함마드가 죽자 유누스는 악수를 차지했고, 1472년에는 샤이크 자말 칸이 한때 그를 사로잡았으나 유목 생활을 하겠다는 약속으로 풀려났다. 『타리히 라시디』는 유누스가 학문과 도시 생활에 익숙해 유목 생활을 즐기지 않았다고 전하는데, 1472년 약속의 배경이 여기 있다. 유누스는 1475년 딸 쿠틀루크 니가르를 티무르 가문의 우마르 샤이크 미르자에게 시집보냈는데, 그 아들이 뒤의 바부르다(「바부르의 페르가나 즉위와 사마르칸트 쟁탈(1494~1504)」). 1484년 무렵(1482~1484) 그는 티무르 왕조의 타슈켄트를 차지했고, 1487년 타슈켄트에서 병으로 죽었다. 아들 마흐무드가 서쪽 타슈켄트에서 이었고, 아흐마드 알라크(재위 1487~1503 무렵)는 동쪽 투루판을 맡아 투루판 칸국의 터를 열었다. 둘은 1503년 샤이바니에게 져서 서쪽 모굴 세력은 꺾였다. 유누스 때 모굴 칸권은 마지막으로 하나의 얼굴을 보였고, 같은 때 키르기스가 톈산으로 퍼졌으나 그 시기와 경위는 사료가 갈린다. 그 뒤는 「모굴 칸들의 투루판과 야르칸드 칸국, 『타리히 라시디』(1500~1570)」(뒤의 사건)에 있다."
  subjects: [moghulistan, timurid-empire, turfan-khanate]
  tags: [politics, war]
  sources: ["Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)", "Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)"]

- id: kazakh-khanate-1465
  year: 1465
  endYear: 1480
  title:
    ko: "자니베크과 케레이, 카자흐 칸국의 성립(1465~1480 무렵)"
  summary:
    ko: "카자흐 칸국의 성립 해는 사료와 학설에 따라 1456~1465년 무렵이나 1470~1471년 무렵으로 갈린다. 카자흐 사학은 모굴 칸 에센 부카의 허락으로 자니베크과 케레이가 아부 알카이르 칸의 우즈베크를 떠나 모굴리스탄 서쪽(추강과 코지바시 일대)에 자리 잡은 1465년 무렵을 건국으로 보며, 이 설명은 『타리히 라시디』에서 나왔다. 반면 러시아 쪽 학설은 아부 알카이르가 죽은 1470~1471년 무렵 뒤로 본다. 카자흐 전승은 자니베크과 케레이가 아부 알카이르의 가혹한 통치를 피해 떠난 것으로 기억한다. 자니베크과 케레이는 칭기즈 칸의 장남 주치의 후손이어서 차가타이 계통인 모굴 칸들과는 가문이 달랐다. 두 사람은 칭기즈 칸의 후손으로 아부 알카이르의 지배를 받아들이지 않은 술탄들이었고, 이들을 따라 나선 사람들이 카자흐('떠도는 자유인')라 불렸다. 이때 이주한 사람의 수는 알 수 없다. 새로 생긴 이 무리는 모굴리스탄과 아부 알카이르의 유목 우즈베크 사이의 완충지가 되었다. 아부 알카이르가 1468년 죽고 우즈베크가 분열하자 이 무리는 힘을 키웠다. 처음에는 케레이가 주로 권력을 쥐었고, 1473년 케레이가 죽은 뒤 자니베크(재위 1473~1480)이 홀로 다스렸으며 그다음은 부룬둑(재위 1480~1511)가 이었다고 한국어 문헌은 정리한다. 이 시기 카자흐는 샤이바니의 우즈베크와 초원을 두고 맞섰다. 아부 알카이르의 우즈베크와의 앞 일은 「아부 알카이르 칸과 유목 우즈베크(1428~1468)」에, 카자흐가 세미레치예를 차지해 가는 일은 「카심 칸의 카자흐 칸국 확장과 그 뒤의 칸들(1511~1538)」(뒤의 사건)에 있다."
  subjects: [kazakh-khanate, moghulistan]
  tags: [politics, society]
  sources: ["Mirza Muhammad Haidar Dughlat, Tarikh-i-Rashidi: A History of the Khans of Moghulistan, trans. Wheeler M. Thackston (Harvard University, 1996)", "Martha Brill Olcott, The Kazakhs (Hoover Institution Press, 1995)", "Peter B. Golden, Central Asia in World History (Oxford University Press, 2011)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: husayn-bayqara-herat-1469
  year: 1469
  endYear: 1506
  title:
    ko: "후사인 바이카라의 헤라트와 나바이·자미·비흐자드(1469~1506)"
  summary:
    ko: "아부 사이드가 1469년 2월 죽은 뒤, 티무르의 고손 후사인 바이카라는 1469년 3월 24일 헤라트를 차지해 호라산의 지배자가 되었다. 같은 해 9월 15일 체나란에서 아크코윤루의 우준 하산이 밀던 야드가르 무함마드(「우준 하산의 아크코윤루: 카라코윤루 정복과 오틀룩벨리(1467~1478)」)를 꺾었으나, 야드가르가 1470년 7월 헤라트에 들어가자 후사인은 여섯 주쯤 뒤 되찾았다. 이후 1506년 5월 4일 바바 일라히에서 죽을 때까지 헤라트를 다스렸다. 그의 궁정에는 튀르크어(차가타이어) 시인 알리셰르 나바이(1501년 죽음)와 페르시아 시인 자미(1492년 죽음), 세밀화가 비흐자드가 있었다. 나바이는 1498년 헤라트 대모스크의 장식을 직접 지휘했고 튀르크어의 문학어로서 가치를 옹호하는 글(『두 언어의 비교』, 1499)을 썼다. 이 도시는 그의 시대에 티무르 왕조 문예의 중심이 되었다. 한편 후사인은 아들들의 반란에 시달렸다. 후사인의 아들 바디 알자만은 자기 아들 무함마드 무민이 아스타라바드를 얻지 못한 일로 반란을 일으켰고, 후사인은 두 사람을 꺾은 뒤 손자 무함마드 무민을 처형하고 아들과는 화해했다. 그러나 휴전이 깨져 바디 알자만은 1499년 헤라트를 포위하기도 했다. 1479년 무렵 둘눈 아르군을 칸다하르 총독으로 보낸 일은 「둘눈 아르군과 칸다하르의 아르군 왕조(1479~1522)」에 있다. 1506년 그가 죽자 계승은 바디 알자만과 무자파르 후사인이 나누어 맡는 형태로 흘렀고, 샤이바니가 1507년 헤라트를 차지해 호라산의 티무르 왕조는 끝났다. 앞 시대 헤라트의 일은 「샤 루흐의 헤라트와 티무르 왕조의 문예 부흥(1409~1447)」에, 샤이바니의 정복은 「무함마드 샤이바니의 트란스옥시아나 정복과 샤이반 왕조(1500~1510)」(뒤의 사건)에 있다."
  subjects: [timurid-empire, aq-qoyunlu]
  tags: [politics, culture]
  sources: ["Maria E. Subtelny, Timurids in Transition: Turko-Persian Politics and Acculturation in Medieval Iran (Brill, 2007)", "Beatrice Forbes Manz, Power, Politics and Religion in Timurid Iran (Cambridge University Press, 2007)", "Lisa Golombek and Donald Wilber, The Timurid Architecture of Iran and Turan (Princeton University Press, 1988)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: turfan-hami-1473
  year: 1473
  endYear: 1499
  title:
    ko: "투루판과 명의 하미 다툼(1473~1499)"
  summary:
    ko: "하미(카라델)는 명이 충순왕으로 인정한 구나시리 가문의 땅이었으나 15세기 후반에는 왕위 다툼과 투루판의 압박 사이에서 흔들렸다. 명 사료에 따르면 바타무르(1466~1472)에 이어 한선이 1472년 11월부터 1488년까지 왕이었고, 1473년 투루판의 지배자 술탄 알리(아리)가 하미를 쳐서 한동안 차지했다고 한다(연대는 명 쪽 사료에 의존). 명은 하미를 서쪽 변경의 완충지로 삼아 인장을 내려 왕위 계승을 승인했고 왕을 다시 세우기도 했으며, 하미는 투루판에서 간쑤로 이어지는 길목이라 이 길이 막히면 서역 사행이 끊겼다. 1488년 안케 볼라가 이었으나 1497년 12월까지만 자리에 있었다. 이 사이 투루판에서는 1487년 유누스 칸이 죽은 뒤 아흐마드 알라크(재위 1487~1503 무렵)가 모굴리스탄 동쪽 투루판에서 칸국의 터를 열어 하미를 압박했다(「유누스 칸의 모굴리스탄 재통합과 타슈켄트 획득, 칸국의 분열(1462~1503)」). 샴바(陝巴)는 1492년 2월~1493년 4월 한 번 왕이 되었다가 1497년 12월부터 1505년까지 다시 왕이었고, 그다음은 바이야지(1505~1513)가 이었다. 명은 투루판과 하미 문제로 교역을 막거나 군을 보내는 등 되풀이해 대응했으나 결정적인 해결을 얻지 못했다. 이 문제는 1513년 만수르 칸이 하미를 차지하는 일로 이어지며 「모굴 칸들의 투루판과 야르칸드 칸국, 『타리히 라시디』(1500~1570)」(뒤의 사건)에 있다. 투루판과 하미를 둘러싼 이런 다툼은 서쪽 오이라트의 압박(「에센 타이시의 오이라트와 하미·투루판(1440~1457)」)이 걷힌 뒤 다시 모굴 칸국과 명이 맞서는 구도로 이어진 것이다."
  subjects: [kara-del, ming, turfan-khanate, moghulistan]
  tags: [war, diplomacy]
  sources: ["Morris Rossabi, Ming China and Turfan, 1406–1517, Central Asiatic Journal 16 (1972)", "Morris Rossabi, China and Inner Asia: From 1368 to the Present Day (Thames and Hudson, 1975)", "James A. Millward, Eurasian Crossroads: A History of Xinjiang (Columbia University Press, 2007)"]

- id: arghun-kandahar-1479
  year: 1479
  endYear: 1522
  title:
    ko: "둘눈 아르군과 칸다하르의 아르군 왕조(1479~1522)"
  summary:
    ko: "아르군 가문은 일 칸국의 아르군 칸에서 갈라져 나왔다고 하는 튀르크·몽골계 가문으로, 티무르 왕조의 후원을 받았다. 둘눈 베그 아르군(재위 1479 무렵~1507)은 후사인 바이카라가 칸다하르 총독으로 보냈으나 헤라트의 권위를 곧 무시했고, 발루치스탄 쪽의 피신·샬·마스퉁을 차지하며 세력을 넓혔다. 칸다하르는 헤라트와 카불·인도 쪽을 잇는 길목의 도시로, 둘눈의 세력은 이 요충을 바탕으로 했다. 그의 칸다하르는 티무르 왕조의 변방 속국으로 시작했으나 사실상 자립했다. 아르군 가문이 칸다하르에서 쌓은 힘은 훗날 신드로 옮겨 가 새 터전을 세우는 밑천이 되었다. 둘눈의 아들 무킴은 1501~1502년 무렵 카불을 얻었으나 1504년 가을 바부르에게 빼앗겼고, 바부르의 카불 왕국이 이곳에서 시작되었다. 이 일은 「바부르의 카불 왕국과 사마르칸트 재점령(1504~1526)」(뒤의 사건)에 있다. 둘눈 아르군은 1507년 샤이바니의 우즈베크와 싸우다 죽었다고 하며, 두 아들 샤 베그(샤 슈자, 재위 1507~1524)와 무킴이 뒤를 이었다. 형제는 바부르의 압박을 샤이바니에게 복속해 피했다. 1510년 샤이바니가 메르브에서 죽은 뒤 사정이 바뀌었고, 샤 베그는 1520년 신드를 쳐 삼마 왕조의 지배를 끝냈으며 1520~1521년 무렵부터 칸다하르를 비웠다. 1522년 바부르가 칸다하르를 얻자 샤 베그는 신드의 북쿠르를 도읍으로 삼았다. 그 뒤 신드에서의 아르군·타르칸 왕조는 「아르군·타르칸 왕조의 신드와 물탄, 무굴의 신드 병합(1527~1593)」(뒤의 사건)에 있다. 이 일련의 일은 티무르 왕조 변방이 해체되는 과정과 맞물려 있다."
  subjects: [arghun-kandahar, timurid-empire, babur-kabul-kingdom]
  tags: [politics, war]
  sources: ["Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)", "Stephen Frederic Dale, The Garden of the Eight Paradises: Babur and the Culture of Empire in Central Asia, Afghanistan and India (1483–1530) (Brill, 2004)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]

- id: babur-ferghana-1494
  year: 1494
  endYear: 1504
  title:
    ko: "바부르의 페르가나 즉위와 사마르칸트 쟁탈(1494~1504)"
  summary:
    ko: "바부르(1483년 2월 14일 안디잔 출생)는 티무르의 5대손이며 어머니 쿠틀루크 니가르 하눔은 유누스 칸의 딸이다. 아버지 우마르 샤이크 미르자가 1494년 비둘기장이 있던 절벽에서 떨어지는 사고로 죽자 열두 살(만 열한 살)로 페르가나의 지배자가 되었다. 페르가나는 시르다리야 상류의 비옥한 분지로 안디잔·악시·마르길란 같은 도시가 있었고 티무르 가문의 젊은 왕자들이 서로 다투는 무대였다. 형제 자한기르를 밀던 숙부들과 귀족이 도전했으나 외할머니 아이산 다울라트 베김의 도움으로 자리를 지켰다. 바부르는 1497년 일곱 달 포위 끝에 사마르칸트를 차지했으나 그동안 페르가나를 잃었고 곧 사마르칸트도 술탄 알리 미르자에게 잃어 100일쯤 다스렸을 뿐이다. 1500년 다시 사마르칸트를 얻었으나 1501년 사르이풀에서 무함마드 샤이바니에게 져 사마르칸트에서 포위당했고, 누이 한자다를 샤이바니에게 시집보내는 조건으로 물러났다. 이어 페르가나를 되찾으려 했으나 뜻을 이루지 못했다. 1502년 무렵 모굴리스탄의 칸인 외삼촌 마흐무드가 다스리던 타슈켄트로 갔으나 푸대접을 받았고 회고록에 나라도 희망도 없다고 썼다. 1504년 10월 힌두쿠시를 넘어 카불을 차지해 새 터전을 얻었다. 그의 회고록 『바부르나마』는 투르크어로 쓰였고 이 시기를 페르가나의 풍경과 사람까지 상세히 적었다. 그 뒤 일은 「바부르의 카불 왕국과 사마르칸트 재점령(1504~1526)」(뒤의 사건)에 있고, 샤이바니의 부상은 「무함마드 샤이바니의 트란스옥시아나 정복과 샤이반 왕조(1500~1510)」(뒤의 사건)에 있다. 이 사건은 칭기즈 칸 가문이 아닌 티무르 가문의 마지막 세대가 트란스옥시아나에서 밀려나는 과정이었다."
  subjects: [timurid-empire, moghulistan]
  tags: [politics, war, culture]
  sources: ["Zahir al-Din Muhammad Babur, The Baburnama: Memoirs of Babur, Prince and Emperor, trans. Wheeler M. Thackston (Modern Library, 2002)", "Stephen Frederic Dale, The Garden of the Eight Paradises: Babur and the Culture of Empire in Central Asia, Afghanistan and India (1483–1530) (Brill, 2004)", "Svat Soucek, A History of Inner Asia (Cambridge University Press, 2000)"]
