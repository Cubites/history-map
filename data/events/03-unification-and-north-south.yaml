  year: 756
  precision: decade
  title:
    ko: 문왕의 체제 정비
  summary:
    ko: 문왕이 당의 제도를 받아들여 3성 6부의 중앙 조직을 갖추고 상경으로 도읍을 옮겼다. 당·일본과 활발히 교류하고 신라도를 통해 신라와도 오갔다.
  subjects: [balhae]
