- id: wonhyo-uisang-660
  year: 660
  precision: decade
  title:
    ko: 원효와 의상의 불교
  summary:
    ko: 원효는 일심 사상과 화쟁 사상을 내세우고, 나무아미타불만 외면 극락에 갈 수 있다는 아미타 신앙으로 불교를 대중화했다. 의상은 당에서 화엄종을 배우고 돌아와 부석사를 세우고(676) 관음 신앙을 널리 폈다.
  subjects: [silla]
  links:
    - { from: tang, to: silla, note: "의상의 당 유학, 화엄종 전래" }
  tags: [culture]
  sources: ["『삼국유사』 권4 원효불기·의상전교", "『송고승전』 원효전·의상전"]

- id: balhae-heishui-726
  year: 726
  title:
    ko: 발해 무왕의 흑수말갈 정벌 추진
  summary:
    ko: 당이 흑수말갈과 손잡고 발해를 견제하자 무왕은 흑수말갈 정벌을 추진했다. 이에 반대한 동생 대문예가 당으로 망명하면서 발해와 당의 대립이 깊어졌다.
  subjects: [balhae, tang]
  links:
    - { from: tang, to: balhae, note: "흑수말갈과 연결해 발해 견제" }
    - { from: balhae, to: tang, note: "당과 대립, 이후 등주 공격(732)" }
  tags: [war, diplomacy]
  sources: ["『신당서』 발해전"]

- id: hyecho-727
  year: 727
  title:
    ko: 혜초의 『왕오천축국전』
  summary:
    ko: 신라 승려 혜초가 인도와 중앙아시아를 여행하고 당의 안서도호부로 돌아와 그 기록을 『왕오천축국전』으로 남겼다.
  subjects: [silla, tang]
  tags: [culture]
  sources: ["혜초, 『왕오천축국전』"]

- id: an-lushan-755
  year: 755
  endYear: 763
  title:
    ko: 안사의 난
  summary:
    ko: 당의 절도사 안녹산과 사사명이 일으킨 반란으로 당이 크게 약해졌다. 이후 당의 요동 지배가 사실상 끝났다.
  subjects: [tang]
  tags: [war]
  sources: ["『구당서』 현종본기 천보 14재"]

- id: daegong-768
  year: 768
  title:
    ko: 96각간의 난 (대공의 난)
  summary:
    ko: 혜공왕 때 대공 형제의 반란을 시작으로 전국에서 진골 귀족들이 서로 싸웠다. 왕권이 약해지고 귀족들의 왕위 다툼이 시작되었다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 혜공왕 4년"]

- id: seongdeok-bell-771
  year: 771
  title:
    ko: 성덕대왕 신종 완성
  summary:
    ko: 경덕왕이 아버지 성덕왕을 기리려 만들기 시작한 종을 혜공왕 때 완성했다. 에밀레종이라고도 부른다.
  subjects: [silla]
  tags: [culture]
  sources: ["성덕대왕 신종 명문", "『삼국유사』 권3 황룡사종·분황사약사·봉덕사종"]

- id: hadae-780
  year: 780
  title:
    ko: 혜공왕 피살과 신라 하대의 시작
  summary:
    ko: 김지정의 난 중에 혜공왕이 죽고 김양상(선덕왕)이 왕위에 올랐다. 무열왕 직계의 왕위 계승이 끊기고, 왕위 다툼이 잦은 신라 하대가 시작되었다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 혜공왕 16년"]

- id: samdaemok-888
  year: 888
  title:
    ko: 『삼대목』 편찬
  summary:
    ko: 진성여왕의 명으로 각간 위홍과 승려 대구화상이 향가를 모아 『삼대목』을 펴냈다. 지금은 전하지 않는다.
  subjects: [silla]
  tags: [culture]
  sources: ["『삼국사기』 신라본기 진성왕 2년"]

- id: choe-chiwon-894
  year: 894
  title:
    ko: 최치원의 시무 10여 조
  summary:
    ko: 당에서 빈공과에 합격하고 돌아온 6두품 최치원이 진성여왕에게 개혁안인 시무 10여 조를 올렸으나 받아들여지지 않았다.
  subjects: [silla]
  links:
    - { from: tang, to: silla, note: "당 유학(빈공과 합격)" }
  tags: [politics]
  sources: ["『삼국사기』 열전 최치원"]

- id: gyeonhwon-surrender-935
  year: 935
  title:
    ko: 견훤의 고려 투항
  summary:
    ko: 왕위 계승 다툼으로 아들 신검에게 쫓겨나 금산사에 갇혔던 견훤이 탈출해 고려에 투항했다. 이듬해 고려가 후백제를 공격하는 길잡이가 되었다.
  subjects: [hubaekje, goryeo]
  links:
    - { from: hubaekje, to: goryeo, note: "견훤의 투항" }
  tags: [politics]
  sources: ["『삼국사기』 열전 견훤", "『고려사』 세가 태조 18년"]
