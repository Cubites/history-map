  summary:
    ko: 백제 무왕 때 익산에 미륵사를 세웠다. 목탑 양식을 본뜬 석탑에서 나온 사리봉영기에 따르면 639년에 사리를 모셨다.
  subjects: [baekje]
  tags: [culture]
  sources: ["익산 미륵사지 석탑 금제 사리봉영기"]

- id: hwangnyongsa-645
  year: 645
  title:
    ko: 황룡사 9층 목탑 건립
  summary:
    ko: 자장의 건의로 주변 9개 나라의 침략을 막기를 바라며 황룡사에 9층 목탑을 세웠다. 몽골 침입 때 불타 없어졌다.
