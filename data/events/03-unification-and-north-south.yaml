  summary:
    ko: 관리에게 토지에서 조세만 거둘 수 있는 관료전을 지급했다.
  subjects: [silla]
  tags: [economy]
  sources: ["『삼국사기』 신라본기 신문왕 7년"]

- id: nogeup-abolished-689
  year: 689
  title:
    ko: 녹읍 폐지
  summary:
    ko: 귀족이 토지와 그 땅의 백성까지 지배하던 녹읍을 없애 귀족의 경제 기반을 약화시켰다.
  subjects: [silla]
  tags: [economy]
  sources: ["『삼국사기』 신라본기 신문왕 9년"]

- id: jeongjeon-722
  year: 722
  title:
    ko: 정전 지급
  summary:
    ko: 성덕왕이 백성에게 정전을 지급했다.
  subjects: [silla]
  tags: [economy]
  sources: ["『삼국사기』 신라본기 성덕왕 21년"]

- id: paegang-735
  year: 735
  title:
    ko: 당, 패강 이남 신라 영토 인정
  summary:
    ko: 발해를 견제하려는 당이 패강(대동강) 이남의 땅을 신라의 영토로 공식 인정했다.
  subjects: [silla, tang]
  links:
    - { from: tang, to: silla, note: "패강 이남 영토 인정" }
  tags: [diplomacy]
  sources: ["『삼국사기』 신라본기 성덕왕 34년"]

- id: bulguksa-751
  year: 751
  title:
    ko: 불국사와 석굴암 창건
  summary:
    ko: 김대성이 불국사와 석불사(석굴암)를 짓기 시작했다. 통일 신라 불교문화의 대표 유산이다.
  subjects: [silla]
  tags: [culture]
  sources: ["『삼국유사』 권5 효선 대성효이세부모"]

- id: nogeup-restored-757
  year: 757
  title:
    ko: 녹읍 부활
  summary:
    ko: 귀족의 반발로 녹읍이 다시 생겨 왕권이 약해지기 시작했다.
  subjects: [silla]
  tags: [economy]
  sources: ["『삼국사기』 신라본기 경덕왕 16년"]

- id: dokseo-788
  year: 788
  title:
    ko: 독서삼품과 실시
  summary:
    ko: 원성왕이 유교 경전을 읽은 수준에 따라 관리를 뽑는 독서삼품과를 실시했다. 진골 귀족의 반대로 제대로 시행되지 못했다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 원성왕 4년"]

- id: kim-heonchang-822
  year: 822
  title:
    ko: 김헌창의 난
  summary:
    ko: 웅천주 도독 김헌창이 아버지가 왕이 되지 못한 것에 불만을 품고 반란을 일으켰다. 신라 하대 왕위 다툼과 지방 세력 성장을 보여 준다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 헌덕왕 14년"]

- id: cheonghaejin-828
  year: 828
  title:
    ko: 청해진 설치
  summary:
    ko: 장보고가 완도에 청해진을 설치해 해적을 소탕하고 당·신라·일본을 잇는 해상 무역을 장악했다.
  subjects: [silla]
  links:
    - { from: silla, to: tang, note: "해상 무역" }
    - { from: silla, to: japan, note: "해상 무역" }
  tags: [economy]
  sources: ["『삼국사기』 신라본기 흥덕왕 3년"]

- id: jang-bogo-846
  year: 846
  title:
    ko: 장보고 피살
  summary:
    ko: 딸을 왕비로 들이려다 귀족의 반대에 부딪힌 장보고가 암살되었고, 이후 청해진이 없어졌다. 『삼국사기』는 846년, 일본 기록은 841년으로 전한다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 문성왕 8년", "『속일본후기』 조와 9년"]

- id: wonjong-aeno-889
  year: 889
  title:
    ko: 원종·애노의 난
  summary:
    ko: 진성여왕 때 세금 독촉에 반발한 농민들이 사벌주(상주)에서 봉기했다. 이후 전국에서 농민 봉기가 이어졌다.
  subjects: [silla]
  tags: [society]
  sources: ["『삼국사기』 신라본기 진성왕 3년"]

# ── 발해 (698 ~ 926) ────────────────────────────────────

- id: balhae-founded-698
  year: 698
  title:
    ko: 발해 건국
  summary:
    ko: 고구려 장수 출신 대조영이 고구려 유민과 말갈인을 이끌고 동모산에서 발해를 세웠다. 발해는 스스로 고구려를 계승했다고 밝혔다.
  subjects: [balhae, malgal]
  links:
