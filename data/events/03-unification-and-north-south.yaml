  tags: [culture]
  sources: ["『삼국사기』 신라본기 선덕왕 14년", "『삼국유사』 권3 황룡사구층탑"]

- id: jindeok-reform-650
  year: 650
  endYear: 651
  title:
    ko: 진덕여왕의 체제 정비
  summary:
    ko: 당의 연호를 쓰고 당 황제를 칭송하는 태평송을 보내 나당 관계를 굳혔다. 이듬해 왕명을 받드는 최고 기구인 집사부를 설치해 왕권을 강화했다.
