    - { from: balhae, to: silla, note: "신라도를 통한 교류" }
  tags: [politics]
  sources: ["『신당서』 발해전"]

- id: balhae-seonwang-818
  year: 818
  endYear: 830
  title:
    ko: 선왕과 해동성국
  summary:
    ko: 선왕이 말갈 부족을 복속시키고 요동 방면으로 진출해 발해의 영토가 가장 넓어졌다. 당은 이 무렵의 발해를 해동성국이라 불렀다.
  subjects: [balhae]
  links:
    - { from: balhae, to: tang, note: "해동성국이라 불림" }
  tags: [politics]
  sources: ["『신당서』 발해전"]

- id: balhae-falls-926
  year: 926
  title:
    ko: 발해 멸망
  summary:
    ko: 거란(요)의 야율아보기가 발해의 수도 상경을 함락해 발해가 멸망했다. 세자 대광현 등 많은 유민이 고려로 넘어왔다.
  subjects: [balhae, liao, goryeo]
  links:
