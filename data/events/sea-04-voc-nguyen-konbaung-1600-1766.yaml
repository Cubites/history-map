# 동남아 사건 2묶음 갈래 04(se-04): 근세 후기 동남아 — 응우옌 주와 찐–응우옌 전쟁, 막 왕조의 끝, 네덜란드 동인도 회사의 말루쿠·바타비아·말라카·마카사르·자와 개입, 아체의 전성과 말레이 반도의 술탄국들, 냥얀 왕조와 몬의 봉기·콘바웅 왕조의 성립, 란쌍의 분열, 아유타야의 일본인 마을·나라이 왕과 함락 (1600 ~ 1766년)
# 범위: 시작 해가 1600~1766년인 사건 29개를 맡는다. 1767년 뒤에 시작하는 일은 sea-05 몫이라 새로 쓰지 않았다.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자). 긴 과정은 한 사건에 묶고 실제 과정의 기간만 잡았다. 항목이 없는 정권(토파스·샨 국·마니푸르 등)은 글로만 다뤘다.
# 날짜: 1582년 앞은 율리우스력이지만 이 시기 사건은 대부분 그레고리력 기록을 따른 날짜이고, 유럽 기록과 현지 기록이 갈리는 날짜는 '무렵'이나 해만 적었다. 베트남·버마 연대기의 연대는 '전한다'로 밝혔다. 불기·자와력·히즈라력은 쓰지 않았다.
# 이름 규칙: 표기 사전을 따라 콘바웅 왕조·말라카·응우옌 호앙·찐 뚱·술탄 아궁·얀 피터르스존 쿤·이스칸다르 무다·하사누딘·싱뷰싱·알라웅브야·하띠엔으로 적었고, 베트남 인명은 성조 없이 띄어 썼다. 학설이 갈리는 해(수리야웡사의 죽음 1694/1695, 술루의 사바 동쪽 1704/1658/1673, 트렝가누의 성립 1708/1724/1725, 우테이 2세 1757/1758, 마하다마라자 디파디의 죽음 1752/1754)는 지도의 해를 본문 해로 두고 다른 해를 괄호로 병기했다. 희생자·병력은 '추산'과 범위로 적었다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다. 영토가 없는 정권은 글로만 다뤘다.
#   다른 파일의 사건은 다시 쓰지 않고 「제목」으로 가리켰다(네덜란드 동인도 회사의 설립, 외교 혁명과 7년 전쟁, 삼번 철폐와 삼번의 난, 샤자한의 병과 계승 전쟁, 건륭제의 십전무공). 한국사와 닿는 점은 이 시기에 억지로 잇지 않았다.

- id: nguyen-lords-1600
  year: 1600
  endYear: 1627
  title:
    ko: "응우옌 호앙의 자립과 응우옌 주(1600~1627)"
  summary:
    ko: "찐 뚱이 1592년 탕롱을 되찾고 후 레 왕조의 황제를 다시 세운 뒤(「막 당 중의 찬탈과 남북조 전쟁(1527~1592)」(앞의 사건)), 레 왕조 안에서 가장 힘센 두 집안은 북쪽의 찐 씨와 남쪽의 응우옌 씨였다. 응우옌 호앙은 1558년 투언화 진수로 남쪽에 내려가 지내다 찐 뚱과 함께 탕롱에서 군사를 이끌었는데, 1600년 레 낀 똥(재위 1600~1619)이 즉위한 해 남쪽 변경을 살피겠다는 구실로 군대를 거느리고 투언화로 돌아와 다시 북쪽으로 올라가지 않았다. 이로써 호앙은 북쪽 조정과 관계를 끊고 남쪽에서 자립했다. 호앙의 집안은 레 황제를 받든다는 명분을 버리지 않아 스스로 왕을 칭하지는 않았고, 이 정권은 흔히 응우옌 주라 부른다. 호앙은 1613년까지 다스리며(재위 1558~1613) 투언화에서 꽝남·꽝응아이·빈딘으로 세력을 넓혔고, 1611년 무렵에는 참파의 북쪽 땅인 푸옌 일대까지 군대를 보냈다고 전한다. 아들 응우옌 푹 응우옌(재위 1613~1635)이 뒤를 이어 호이안 같은 항구를 열어 일본 주인선 상인과 중국 상인을 끌어들였고, 이 무역과 포르투갈에서 사 온 대포가 남쪽 정권의 재정과 군사력을 받쳤다. 푹 응우옌은 찐 짱(찐 뚱의 아들, 1623년부터 찐 주)의 소환과 조공 요구를 1620년 무렵부터 거부했고, 1627년 찐 씨가 처음으로 남쪽을 공격하면서 오랜 전쟁이 시작되었다(「찐–응우옌 전쟁과 알렉상드르 드 로드(1627~1672)」(뒤의 사건)). 이 사건은 남진해 온 베트남이 참파와 캄보디아의 땅으로 나아가는 길을 열었다. 호앙은 1558년 투언화를, 1570년 무렵에는 꽝남 진수까지 아울러 두 지역을 근거지로 삼았다고 하며, 이 땅이 뒷날 베트남 중부의 '당쫑(안쪽)'이라 불린 응우옌 주의 바탕이 되었다."
  subjects: [nguyen-lords, later-le-dynasty]
  links:
    - { from: nguyen-lords, to: later-le-dynasty, note: "북쪽 조정과 관계를 끊고 투언화에서 자립함 (1600)" }
  tags: [politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: ayutthaya-japanese-1600
  year: 1600
  endYear: 1630
  title:
    ko: "아유타야의 일본인 마을과 야마다 나가마사(1600~1630)"
  summary:
    ko: "1600년 세키가하라 전투가 끝나자 패한 쪽의 낭인이 일본 바깥으로 흩어졌고, 도쿠가와 정권이 해외 무역선에 허가장(주인장)을 내주던 17세기 초에는 일본 상인이 동남아의 항구에 정착촌을 이루었다. 아유타야에서는 나레수안(재위 1590~1605)과 에까톳사롯(1610년까지)을 이은 왕들 밑에서 일본인 마을이 커졌고, 이 마을의 주민은 1천 명 안팎이었고 상인과 가톨릭 개종자, 낭인이 섞여 있었다고 한다. 시즈오카 누마즈 출신으로 1590년에 태어난 야마다 나가마사는 1612년 무렵 아유타야에 자리를 잡았고, 1617년부터 일본인 마을을 이끌었다. 그는 송탐 왕(재위 1611~1628)의 군사 활동을 돕는 일본인 의용대를 거느려 관직을 올렸고, 1630년 리고르(나콘시탐마랏)의 장관으로 보내져 낭인 3백 명을 이끌고 갔다. 그는 같은 해 리고르에서 숨졌으며, 쁘라삿텅 왕(재위 1629~1656)의 사주로 독살되었다는 설은 확실하지 않다. 송탐이 1628년 죽은 뒤 왕위 다툼 끝에 쁘라삿텅이 아팃타야웡을 허수아비로 세웠다가 처형하고 1629년 왕위에 올랐고, 야마다가 죽은 뒤 쁘라삿텅의 군대가 일본인 마을을 공격해 약 5백 명이 죽었다고 전한다. 마을은 얼마 뒤(1633년 무렵) 돌아온 사람들이 다시 세웠으나, 도쿠가와 정권이 1630년대에 해외 도항과 귀국을 막으면서 규모가 줄었다. 이 일본인 마을은 아유타야가 중국·일본·유럽 상인이 드나드는 바닷길 무역의 항구였음을 보여 준다. 아유타야에는 일본인 마을 말고도 포르투갈·중국·말레이·페르시아 상인의 거주지가 따로 있었고, 네덜란드 상인도 17세기 초부터 상관을 열었다. 시암 왕이 일본에 사절과 국서를 보내 무역을 청한 일도 전한다."
  subjects: [ayutthaya-kingdom, japan]
  tags: [society, politics]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)"]

- id: voc-ambon-1605
  year: 1605
  endYear: 1623
  title:
    ko: "네덜란드 동인도 회사의 암본 점령과 반다 제도 정복, 암본 사건(1605~1623)"
  summary:
    ko: "「네덜란드 동인도 회사의 설립」(앞의 사건) 뒤 이 회사의 첫 목표는 정향·육두구·메이스를 내는 말루쿠를 포르투갈에서 빼앗아 독점하는 것이었다. 1605년 2월 제독 스테번 판 데르 하헌이 이끄는 함대가 암본의 포르투갈 요새를 넘겨받아 이름을 빅토리아로 바꾸었고, 이곳이 회사의 말루쿠 근거지가 되었다. 육두구와 메이스의 유일한 산지인 반다 제도에서는 1609년 5월 제독 피터르 페르휘프가 요새를 쌓으려다 반다 지도자들의 매복에 걸려 장교들과 46명과 함께 죽었다. 이에 앙갚음하려 총독 얀 피터르스존 쿤이 1621년 반다네이라와 룬타르를 점령하고 일본인 용병을 시켜 오랑 카야 약 마흔 명의 목을 베었다. 정복 앞의 인구는 1만 3천~1만 5천 명으로 추산되며, 죽은 사람이 약 2천 8백 명이라는 서술과 살아남아 섬에 남은 사람이 1천 명 안팎이라는 서술이 있다. 많은 사람이 크이 제도 같은 이웃 섬으로 달아났고 일부는 노예가 되어 바타비아로 보내졌다. 회사는 땅을 68개 필지로 나누어 네덜란드인 농장주에게 주었다. 영국 동인도 회사와의 경쟁도 이어졌다. 1623년 3월(영국 쪽 율리우스력으로 2월 말) 암본에서는 일본인 용병이 요새를 살피다 붙들린 일을 계기로 총독 헤르만 판 스푸일트의 법정이 영국인 열 명과 일본인 아홉 명, 포르투갈인 한 명을 처형했다(모두 21명이라고 적는 서술이 있으나 나열한 수의 합은 20명이라 한 명이 어긋난다). 영국은 이후 말루쿠 향료 무역에서 물러났다. 회사는 정향 값을 지키려고 암본 밖의 정향나무를 베는 순찰 원정(호옹이 원정)을 해마다 보냈다고 전하며, 이는 값을 지키는 대신 섬 주민의 생계를 빼앗았다. 반다의 룬 섬은 영국이 오래 영유를 주장하다 1667년 브레다 조약으로 권리를 내려놓았다."
  subjects: [voc, portugal]
  tags: [war, economy]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: anaukpetlun-1605
  year: 1605
  endYear: 1628
  title:
    ko: "아나욱펫룬의 시리암 탈환과 하버마 회복(1605~1628)"
  summary:
    ko: "바인나웅의 제국은 1581년 뒤 무너졌고, 1599년 아라칸과 따웅우의 연합군이 바고를 함락하고 난다바인을 사로잡았다. 이 무렵 바인나웅의 아들 냥얀 민(재위 1599~1605)은 아바에서 왕조를 다시 세웠고, 이 왕조를 냥얀 왕조라 부른다. 하버마의 항구 시리암(탄린)은 아라칸(므라우우 왕국)이 세운 포르투갈 용병 필리프 드 브리투가 차지해 다스리고 있었다. 1605년 냥얀 민이 죽자 아들 아나욱펫룬이 올랐다(재위 1605~1628). 그는 프롬과 따웅우를 되찾은 뒤 1613년 시리암을 에워싸 함락시키고 드 브리투를 처형했다고 전한다. 이로써 상버마와 하버마가 1613년 다시 한 나라가 되었다. 아나욱펫룬은 이어 샨 지역과 란나로 군대를 보냈고, 란나가 이 왕조 아래 든 때는 1622년 무렵까지로 보며 자료마다 갈린다. 아나욱펫룬은 1628년 암살당했고(음모는 아들 민예 데입바가 꾸몄다고 한다), 민예 데입바가 올랐으나(재위 1628~1629), 그해를 넘기지 못하고 동생 탈룬(재위 1629~1648)에게 자리를 넘겨주었다. 탈룬은 도읍을 아바로 옮기고 행정과 세금 장부를 정비했다. 이 왕조는 핀달레(재위 1648~1661)·페(1661~1672)·나라와라(1672~1673)·민예 짜우틴(1673~1698)·사나이(1698~1714)·타닌가웨(1714~1733)를 거쳐 마하다마라자 디파디(재위 1733~1752)가 마지막이었다. 한편 아라칸은 하버마에서 물러난 뒤 벵골만 연안에서 세력을 지켰다(「샤 슈자의 망명과 무굴의 치타공 점령(1660~1666)」(뒤의 사건)). 포로가 된 포르투갈 사람과 그 후손은 상버마의 마을에 집단으로 정착해 포병이나 호위로 쓰였다고 전한다. 이 무렵 아라칸의 왕은 민라자지(재위 1593~1612)로, 그의 군대는 1599년 바고를 약탈한 뒤 대부분 물러났다."
  subjects: [toungoo-dynasty, mrauk-u, portugal]
  links:
    - { from: toungoo-dynasty, to: mrauk-u, note: "아라칸이 점령한 하버마를 되찾음 (1613)" }
  tags: [war, politics]
  sources: ["Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Victor B. Lieberman, Strange Parallels: Southeast Asia in Global Context, c. 800–1830, vol. 1 (Cambridge University Press, 2003)"]

- id: iskandar-muda-1607
  year: 1607
  endYear: 1636
  title:
    ko: "이스칸다르 무다와 아체의 전성(1607~1636)"
  summary:
    ko: "아체 술탄국은 16세기에 수마트라 북단에서 후추 무역으로 성장했고, 포르투갈이 1511년 차지한 말라카를 피해 오가는 이슬람 상인의 중심이 되었다. 1583년 무렵 태어난 이스칸다르 무다는 삼촌 알리 리아야트 샤 3세와 불화해 갇혔다가 1606년 포르투갈 함대의 침입을 막는 데 공을 세워 풀려났고, 1607년 삼촌이 죽자 술탄이 되었다(재위 1607~1636). 그는 1612년 델리, 1613년 아루와 조호르, 1617년 파항, 1619년 크다, 1620년 페락, 1624~1625년 니아스를 차례로 쳐서 말라카 해협 양쪽의 후추 산지를 장악했다. 1614년에는 빈탄 앞바다에서 포르투갈 함대를 쳐부수었다. 안으로는 지방 유력자인 오랑 카야의 힘을 누르고 이슬람 법에 따라 법제를 손질했으며, 아체를 이슬람 학문의 중심으로 키웠다. 그러나 1629년 말라카를 노린 대규모 원정은 크게 졌고, 그가 끝내 해협의 패권을 쥐지는 못했다. 그가 자기 아들 므우라 푸목을 처형했다는 서술도 있다. 1636년 12월 그가 죽자 사위 이스칸다르 타니(재위 1636~1641)가 이었고, 그가 죽은 뒤에는 이스칸다르 무다의 딸 사피아투딘이 여왕으로 즉위해(재위 1641~1675) 여성 술탄이 이어지는 시기가 열렸다. 아체의 팽창은 말라카를 지키려던 포르투갈과 조호르를 거듭 싸우게 했다(「조호르·아체·포르투갈의 삼각 전쟁과 조호르의 파항 합병(1613~1641)」(뒤의 사건)). 아체의 후추와 금 거래에는 인도 구자라트·타밀 상인과 아랍 상인이 얽혔고, 1613년 네덜란드 동인도 회사 상인이 아체에 도착한 일과 1615년 영국 왕 제임스 1세에게 보낸 편지가 보여 주듯 술탄은 유럽 상인과도 교류했다."
  subjects: [aceh-sultanate, johor-sultanate, portuguese-malacca]
  links:
    - { from: aceh-sultanate, to: johor-sultanate, note: "조호르를 쳐서 도읍을 함락함 (1613)" }
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: johor-aceh-1613
  year: 1613
  endYear: 1641
  title:
    ko: "조호르·아체·포르투갈의 삼각 전쟁과 조호르의 파항 합병(1613~1641)"
  summary:
    ko: "1511년 말라카를 잃은 술탄 가문은 1528년 조호르 술탄국을 세웠으나, 포르투갈과 아체 사이에 끼어 도읍을 여러 번 옮겨야 했다. 1613년 아체의 이스칸다르 무다가 조호르의 도읍 바투사왈을 쳐서 술탄 알라웃딘 리아야트 샤 3세를 사로잡아 데려갔다(「이스칸다르 무다와 아체의 전성(1607~1636)」(앞의 사건)). 이 일로 조호르는 한동안 아체에 눌렸고, 1617년 아체는 파항에도 군대를 보냈다. 알라웃딘 리아야트 샤 3세(재위 1597~1615)에 이어 압둘라 마아얏 샤(재위 1615~1623)가 올랐고, 그가 죽은 1623년 압둘 잘릴 샤 3세(재위 1623~1677)가 조호르 술탄에 올랐다. 그는 파항을 함께 다스리는 군주로, 이때부터 조호르와 파항이 한 군주 아래 합쳐졌다. 조호르는 네덜란드 동인도 회사와 1606년 이래 말라카를 함께 공격하자는 약속을 이어 갔지만, 1629년 아체가 말라카를 공격했을 때에는 포르투갈을 도와 아체 함대를 물리쳤다고 전한다. 이렇게 조호르는 아체·포르투갈·네덜란드 사이에서 가까이 두는 쪽을 바꾸며 살아남았다. 이 균형은 1641년 네덜란드 동인도 회사와 손잡고 포르투갈의 말라카를 무너뜨리면서 끝났다(「네덜란드 동인도 회사와 조호르의 말라카 함락(1640~1641)」(뒤의 사건)). 말라카 해협은 이 시기에 아체·포르투갈·조호르 세 쪽의 힘겨루기에서 네덜란드가 끼어드는 구도로 넘어갔다. 조호르는 17세기에 리아우 항이 번성한 황금기를 누렸으나, 이웃 잠비의 공격으로 1673년 바투사왈이 약탈당하는 등 도읍을 여러 번 옮겨야 했다. 압둘 잘릴 샤 3세는 그때 파항으로 달아났고 1677년 죽었다. 아체가 1629년 말라카에서 크게 진 일은 그 뒤 해협에서 아체의 팽창이 멈추는 계기가 되었다."
  subjects: [johor-sultanate, aceh-sultanate, portuguese-malacca]
  links:
    - { from: aceh-sultanate, to: johor-sultanate, note: "도읍 바투사왈을 함락하고 술탄을 데려감 (1613)" }
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: sultan-agung-1613
  year: 1613
  endYear: 1645
  title:
    ko: "술탄 아궁과 마타람 술탄국의 확장(1613~1645)"
  summary:
    ko: "마타람 술탄국은 1584~1586년 무렵 세나파티가 중부 자와에서 세운 나라로, 그가 죽은 뒤 아들 세다 잉 크라피악(마스 졸랑, 재위 1601~1613)이 이었다. 1613년 그의 아들 술탄 아궁이 즉위해 1645년까지 다스렸다. 아궁은 동쪽과 해안으로 힘을 넓혀 1615년 위라사바, 1616년 라셈, 1617년 파수루안, 1619년 투반을 차지했고, 1622년에는 보르네오 서남부의 수카다나까지 군대를 보냈다. 1624년 마두라를 정복했으며, 5년 가까이 싸운 끝에 1625년 동자와 최대의 항구 수라바야를 항복시켰다. 이로써 동자와의 해안 항구들이 마타람에 들어왔다. 수라바야 함락의 해는 서술에 따라 갈리나, 이 글은 1625년으로 보는 서술을 따른다. 서쪽에서는 1619년 자야카르타를 차지하고 바타비아를 세운 네덜란드 동인도 회사와 맞섰다. 아궁은 1628년과 1629년 두 차례 바타비아를 에워쌌으나 보급선이 불타고 해군이 없어 실패했다(「얀 피터르스존 쿤과 바타비아(1619~1629)」(뒤의 사건)). 파장(1617)·파티(1627) 같은 가신의 반란과 기근이 이어지면서 확장은 1625년 이후 느려졌다. 아궁은 1641년 메카의 이맘에게서 술탄 압둘라 무함마드 마울라나라는 칭호를 받았다고 하며, 영지를 아디파티가 다스리는 행정 구역(카디파텐)으로 나누는 제도를 만들었다. 1645년 죽어 이모기리에 묻혔고 아들 아망쿠랏 1세가 이었다. 그가 1633년 무렵 자와의 사카력을 이슬람 음력의 달 계산에 맞춰 고쳤다고 전하는데, 이는 자와 궁정의 전통을 이슬람 질서와 이으려는 시도였다. 그의 치세에 마타람은 중부와 동부 자와를 아우르는 자와 최대의 나라가 되었다."
  subjects: [mataram-sultanate, voc]
  tags: [war, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: batavia-coen-1619
  year: 1619
  endYear: 1629
  title:
    ko: "얀 피터르스존 쿤과 바타비아(1619~1629)"
  summary:
    ko: "얀 피터르스존 쿤(1587~1629)은 1618년 네덜란드 동인도 회사의 총독이 되어 회사의 아시아 본부를 서자와에 두려 했다. 그 자리는 반튼 술탄국에 매인 자야카르타 항구였고, 이곳에는 네덜란드와 영국의 상관이 나란히 있었다. 1619년 쿤은 영국과 자야카르타 영주를 몰아내고 도시를 점령한 뒤 그 터에 요새와 시가를 세워 바타비아라 이름 붙였다. 바타비아는 중국 상인과 자와 농산물을 끌어들이는 회사의 본부가 되어 1799년 회사가 해산할 때까지 이어졌다. 쿤은 1621년 반다 제도를 정복하고(「네덜란드 동인도 회사의 암본 점령과 반다 제도 정복, 암본 사건(1605~1623)」(앞의 사건)) 1623년 총독에서 물러났다가 1627년 다시 총독에 올랐다(재위 1618~1623·1627~1629). 두 번째 임기에 마타람의 술탄 아궁(「술탄 아궁과 마타람 술탄국의 확장(1613~1645)」(앞의 사건))이 바타비아를 두 차례 에워쌌다. 1628년 마타람군은 도시 가까이 이르렀지만 쿤의 부대가 보급 창고를 불태웠고, 1629년 두 번째 공격 때에도 회사가 보급을 끊어 물러났다. 쿤은 1629년 9월 21일 바타비아에서 콜레라로 보이는 병에 걸려 숨졌다. 반튼은 후추 무역에서 바타비아와 맞서는 경쟁자로 남아 이후 반세기 동안 회사와 부딪혔다. 오늘날 쿤은 반다 학살 같은 폭력 때문에 크게 비판받는다. 회사는 새 도시에 중국 이주민을 불러 모았고, 1619년 중국 상인 소 빙콩을 중국인 대표(카피탄)로 세웠다고 전한다. 쿤은 또 반튼 앞바다를 봉쇄해 후추 거래를 바타비아로 돌리려 했고, 반튼과의 분쟁은 1620년대 내내 이어졌다."
  subjects: [voc, banten-sultanate, mataram-sultanate]
  tags: [politics, economy]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: trinh-nguyen-war-1627
  year: 1627
  endYear: 1672
  title:
    ko: "찐–응우옌 전쟁과 알렉상드르 드 로드(1627~1672)"
  summary:
    ko: "1600년 응우옌 호앙이 투언화에서 자립한 뒤(「응우옌 호앙의 자립과 응우옌 주(1600~1627)」(앞의 사건)) 북쪽의 찐 짱(찐 주 재위 1623~1657)은 응우옌 푹 응우옌에게 조공과 소환을 요구했고, 거부당하자 1627년 처음으로 남쪽을 공격했다. 이후 1672년까지 찐 쪽이 모두 일곱 차례 큰 원정을 보냈으나 번번이 막혔다. 응우옌은 도읍 쪽에 방벽을 쌓고 포르투갈에서 배운 대포를 갖춘 데다, 잔강 어귀의 지형을 이용했다. 이 때문에 꽝빈 일대의 잔강이 남북 경계로 굳었다. 찐 쪽은 네덜란드 상인에게서 무기를 구했다고 전한다. 1673년에 휴전이 이루어졌고 전쟁이 1673년에 끝났다고 보는 서술이 많다. 이 글은 1672년의 마지막 원정을 끝으로 본다. 찐 짱이 1657년 죽은 뒤에는 아들 찐 딱(재위 1657~1682)이 전쟁을 이어받았다. 후 레 왕조의 황제는 두 집안 사이에서 허수아비로 남았다. 이 시기 예수회 선교사 알렉상드르 드 로드(1591~1660)는 1620년대 후반 통킹에서 포교했으나 1630년 찐 씨에게 추방되었고 이후 남쪽에서 선교했다. 그는 1651년 로마에서 베트남어를 라틴 문자로 적은 사전을 펴냈으며, 이것이 오늘날 베트남어 표기의 바탕이 되었다. 두 정권 모두 상업에 힘썼지만 전쟁 부담은 농민에게 지워졌다. 응우옌 주는 북쪽을 막은 사이 남쪽의 참파와 캄보디아로 영토를 넓혔다(「판두랑가의 종속과 자딘부 설치(1693~1698)」(뒤의 사건)). 응우옌 쪽 책사 도안 주 뜨가 1630년대 초 동허이에 이중 방벽을 쌓았다고 전하며, 이 방벽은 이후 찐 군대의 남진을 거듭 막았다. 남북 분단은 1774~1775년 찐 씨가 후에를 점령할 때까지 이어졌다."
  subjects: [later-le-dynasty, nguyen-lords]
  links:
    - { from: later-le-dynasty, to: nguyen-lords, note: "찐 주가 남쪽을 거듭 공격했으나 잔강 경계를 넘지 못함 (1627~1672)" }
  tags: [war, politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: voc-malacca-1640
  year: 1640
  endYear: 1641
  title:
    ko: "네덜란드 동인도 회사와 조호르의 말라카 함락(1640~1641)"
  summary:
    ko: "포르투갈이 1511년 차지한 말라카(「포르투갈의 말라카 점령(1511~1526)」(앞의 사건))는 한 세기 넘게 아체와 조호르, 네덜란드의 공격을 받으면서도 버텼다. 네덜란드 동인도 회사는 1606년 조호르와 맺은 약속에 따라 말라카를 함께 치기로 했고, 이 약속에서 네덜란드가 말라카를 차지하되 말레이 왕국들의 영토를 노리거나 그들과 전쟁하지 않는다고 못박았다. 1640년 중반 바타비아 총독 안토니 판 디먼(재임 1636~1645)이 보낸 회사의 함대와 군대가 말라카를 바다와 땅에서 에워쌌고, 조호르 술탄 압둘 잘릴 샤 3세(재위 1623~1677)는 병력 5백~6백 명을 보태 도왔다(「조호르·아체·포르투갈의 삼각 전쟁과 조호르의 파항 합병(1613~1641)」(앞의 사건)). 포위는 반년 가까이 이어졌고 도시 안에서는 굶주림과 병으로 많은 사람이 죽었다고 전한다. 1641년 1월 14일(네덜란드 쪽 기록의 날짜) 도시가 무너져 포르투갈령 말라카가 끝났다. 네덜란드는 조호르가 바랐던 말라카를 넘겨받지 않고 회사의 영토로 삼았다. 그러나 회사는 바타비아를 아시아 본부로 삼았으므로 말라카를 무역의 중심으로 키우지 않았고, 말라카는 예전 같은 중계 항구의 구실을 되찾지 못했다. 이 일로 해협에서 포르투갈의 힘이 줄고 네덜란드 동인도 회사가 이를 대신하게 되었다. 포르투갈이 차지한 말라카는 도시와 그 근교에 한정된 작은 땅이어서 점령 뒤 회사가 얻은 땅도 이 범위였다. 회사는 1606년 코르넬리스 마텔리프의 말라카 포위가 라셰도곶 해전으로 끝나 실패한 적이 있었고, 35년 만에 목적을 이룬 셈이다. 도시를 지키던 포르투갈 쪽은 파모사 요새에 의지했으나 바깥의 도움을 받지 못했다."
  subjects: [voc, johor-sultanate, portuguese-malacca]
  links:
    - { from: voc, to: portuguese-malacca, note: "조호르와 함께 말라카를 에워싸 점령함 (1640~1641)" }
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)"]

- id: timor-kupang-1653
  year: 1653
  endYear: 1702
  title:
    ko: "쿠팡과 리파우: 티모르의 네덜란드와 포르투갈(1653~1702)"
  summary:
    ko: "티모르는 백단향을 얻으려는 상인이 몰려드는 섬이었고, 포르투갈 사람들은 1515년 이 섬에 이르렀으며 1556년 도미니크회 수사들이 자리를 잡았다. 17세기에는 말루쿠와 말라카를 차지한 네덜란드 동인도 회사가 이 섬에 들어왔다. 회사는 1653년 서티모르의 쿠팡에 거점을 세워 백단향 무역과 인근 소왕국에 대한 영향력을 키웠다. 그러나 섬 안에는 플로레스의 라란투카를 근거지로 삼은 토파스(포르투갈 사람과 현지인의 후손으로 가톨릭을 믿는 집단)가 있어, 포르투갈 왕권과 거리를 둔 채 독자적으로 소왕국의 충성을 거두었다. 이 때문에 네덜란드는 쿠팡에서 섬 전체를 지배할 수 없었다. 포르투갈 쪽은 동티모르의 리파우에 근거를 두었고, 1702년 안토니우 코엘류 게헤이루가 처음으로 총독으로 임명되어 리파우가 포르투갈령 티모르의 도읍이 되었다. 새 총독의 권위는 토파스 세력 앞에서 약했고, 포르투갈의 실제 지배는 해안 몇 곳에 한정되었다. 도읍은 1769년 딜리로 옮겨졌다. 이렇게 티모르는 서쪽의 네덜란드 동인도 회사와 동쪽의 포르투갈로 갈렸고, 이 경계는 1851년·1854년·1859년 조약을 거쳐 20세기에 확정되었다. 백단향은 숲이 줄면서 점차 줄었고 19세기에는 커피가 주된 수출품이 되었다. 티모르의 백단향은 중국 시장에서 값이 높아 포르투갈은 마카오에서, 네덜란드는 바타비아에서 이 섬의 거래를 겨뤘다. 토파스 지도자 가운데는 호르나이 가문과 다 코스타 가문이 이름이 높았다. 쿠팡의 회사 거점은 서티모르 소왕국들과의 계약으로 세력을 넓혔고, 이 거점은 훗날 네덜란드령 동인도의 티모르 통치 중심이 되었다. 동쪽 포르투갈 영역과의 경계는 한참 뒤에야 조약으로 정해졌다."
  subjects: [voc, portuguese-timor]
  links:
    - { from: voc, to: portuguese-timor, note: "서티모르 쿠팡에 거점을 세워 섬을 둘로 나눔 (1653)" }
  tags: [politics, economy]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)", "M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)"]

- id: narai-1656
  year: 1656
  endYear: 1688
  title:
    ko: "나라이 왕의 대외 교류와 1688년 혁명(1656~1688)"
  summary:
    ko: "쁘라삿텅 왕(재위 1629~1656)이 죽자 아들 차이가 잠시 올랐으나 곧 삼촌 시 수탐마라차(재위 1656)가 몰아냈고, 그를 다시 폐위한 조카 나라이가 1656년 10월 왕위에 올랐다(재위 1656~1688). 이 정변은 네덜란드와 페르시아 출신 관료가 뒷받침했다고 한다. 나라이의 치세는 아유타야 시대 가운데 가장 번영한 때로 꼽히며, 코랏에 성을 쌓은 것도 1656년으로 전한다. 1664년 네덜란드가 모피 독점을 요구하며 아유타야 앞바다를 봉쇄하자 그는 롭부리로 도읍을 옮기고 예수회의 도움으로 새 궁전을 지었다. 그리스 모험가 콘스탄틴 폴콘은 1675년 도착해 1681년 궁정에 소개된 뒤 나라이의 가장 가까운 조언자가 되어 네덜란드를 견제할 프랑스와의 교류를 밀었다. 나라이는 1684년 프랑스에 사절을 보냈고 루이 14세는 1685년 쇼몽을 답례 사절로 보냈다. 1686년 시암 사절이 베르사유에 갔고, 1687년 라 루베르와 예수회 사제가 돌아오는 길에 프랑스군이 메르귀와 방콕에 들어왔다. 궁정과 불교 승단은 이를 반기지 않았다. 나라이가 병들자 코끼리 연대를 이끈 페트라차가 1688년 5월 18일 정변을 일으켜 양자 프라 피를 처형하고 폴콘을 6월에 처형했으며, 방콕의 프랑스군을 에워쌌다. 나라이가 7월에 죽자 페트라차가 왕위에 올라(재위 1688~1703) 프랑스 세력을 밀어냈다. 이후 시암은 유럽과의 교류를 크게 줄였다. 나라이는 페르시아·인도 상인을 궁정 관료로 받아들였고, 마카사르 전쟁(1666~1669)에서 쫓긴 마카사르 사람들도 아유타야에 정착해 이 도시는 국제도시의 면모를 띠었다. 1686년에는 이들 마카사르 피난민이 반란을 일으켰다가 진압되었다."
  subjects: [ayutthaya-kingdom, france]
  tags: [politics, society]
  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)"]

- id: brunei-sulu-1660
  year: 1660
  endYear: 1704
  title:
    ko: "브루나이 내전과 술루의 보르네오 동북부(1660~1704)"
  summary:
    ko: "브루나이는 15세기 말 볼키아 시대에 사라왁과 사바 서쪽까지 영향력을 뻗쳤으나, 17세기 중반 왕위를 둘러싼 내전으로 크게 흔들렸다. 이 싸움을 1661~1673년으로 적는 서술이 있고 1660년을 시작으로 보는 서술도 있다. 술탄 무함마드 알리가 암살된 뒤 압둘 하쿨 무빈이 술탄을 칭했고, 이에 맞서 무히딘이 스스로 다음 술탄을 선언했다. 무히딘 편에는 케다얀과 바자우 사람들이 섰고 술루 술탄국이 군대를 보냈으며, 잠비는 화약을 댔다. 압둘 하쿨 무빈이 죽고 무히딘이 이겨 1673년 술탄에 올랐다. 술루는 브루나이가 도움을 청하며 보르네오 동북부(사바 동부)를 보답으로 주겠다고 약속했다고 주장했으나, 역사가들은 무히딘이 실제로 도움을 청했는지 확신하지 못한다. 넘긴 해도 자료마다 갈려, 술루 쪽 이야기를 따라 1658년이나 1673년으로 적기도 하고 브루나이 쪽에서는 넘기지 않았다고 보기도 한다. 이 글은 1704년에 사바 동쪽이 술루의 영향 아래 들어갔다고 보는 서술을 따른다. 술루는 1578년 브루나이에서 독립했다고 하는 술탄국으로, 이후 사바 동쪽의 해안과 다툼이 얽힌 지역을 오래 다스렸다고 주장했다. 이 일은 오늘날 사바 동쪽의 영유권 논쟁으로 이어지고 있다. 무히딘은 압둘 하쿨 무빈이 궁을 체르민 섬으로 옮긴 뒤 스스로 술탄임을 선언했고, 앞의 술탄 무함마드 알리는 목 졸려 죽었다. 잠비가 화약을 댄 일은 내전이 말레이 세계의 무역 연결망과 얽혀 있었음을 보여 준다. 이 내전 뒤 브루나이는 술탄 무히딘(재위 1673~1690) 아래에서 다시 안정을 찾았으나, 15~16세기의 팽창기와 같은 힘을 되찾지 못했다."
  subjects: [brunei, sulu-sultanate]
  links:
    - { from: brunei, to: sulu-sultanate, note: "내전 때 받은 도움의 대가로 보르네오 동북부를 넘겼다고 전함 (1704)" }
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)", "Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: mughal-chittagong-1660
  year: 1660
  endYear: 1666
  title:
    ko: "샤 슈자의 망명과 무굴의 치타공 점령(1660~1666)"
  summary:
    ko: "샤자한의 둘째 아들 샤 슈자는 벵골 총독으로 있다가 계승 전쟁에서 아우랑제브에게 졌다(「샤자한의 병과 계승 전쟁: 다라 시코와 아우랑제브(1657~1659)」(앞의 사건)). 그는 1660년 4월 6일 탄다를 떠나 12일 다카에 이르렀고, 5월 12일 아라칸 왕이 보낸 배를 타고 부루아에서 치타공을 거쳐 8월 26일 아라칸의 도읍 므라우우에 닿았다. 아라칸 왕 산다 투담마는 그의 가족을 메카로 보낼 배를 마련하겠다고 약속했으나 여덟 달 동안 핑계만 댔고, 슈자의 딸을 아내로 달라고 요구했다가 거절당하자 사흘 안에 떠나라고 명했다. 식량이 끊긴 슈자는 병사 2백 명으로 왕을 치려 했지만 미리 들켜 도시에 불을 지르고 달아났고, 밀림에서 붙들려 처형되었다(1661년 2월 7일로 적는 서술이 있다). 이듬해 왕은 슈자의 아들들을 목 베고 딸들을 굶겨 죽였다. 아우랑제브는 이를 앙갚음하려 벵골 총독 샤이스타 칸에게 치타공 원정을 맡겼고, 무굴군은 1666년 1월 치타공을 점령해 지명을 이슬라마바드로 바꾸었다. 포르투갈 해적과 아라칸의 선단이 벵골 해안을 노략하던 근거를 무굴이 없앤 셈이다. 이 일로 므라우우는 치타공을 잃어 벵골만 동안의 무역과 세력이 크게 줄었고 왕조는 점차 기울었다. 아라칸은 1784년 콘바웅 왕조에 정복될 때까지 이어졌다. 아라칸은 17세기 초부터 포르투갈 용병과 함께 벵골 동부와 트리푸라를 약탈하고 붙잡은 사람을 노예로 삼았고, 치타공은 그 근거지였다. 1638년의 정변과 포르투갈과의 불화로 이미 흔들리던 왕조가 치타공까지 잃은 것이다. 점령 뒤 치타공은 무굴의 벵골 총독부에 속해 벵골 동부 해안 무역의 항구가 되었고, 포르투갈 해적이 강을 따라 올라와 벌이던 약탈도 크게 줄었다."
  subjects: [mrauk-u, mughal-empire]
  links:
    - { from: mughal-empire, to: mrauk-u, note: "치타공을 점령함 (1666)" }
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)", "Michael Charney, A History of Modern Burma (Cambridge University Press, 2009)"]

- id: bongaya-1666
  year: 1666
  endYear: 1669
  title:
    ko: "마카사르 전쟁과 봉가야 조약(1666~1669)"
  summary:
    ko: "술라웨시 남부의 고와–탈로(마카사르)는 16세기 말부터 향료 무역의 중심으로 성장했고(「고와–탈로 연합과 마카사르의 성장(1512~1593)」(앞의 사건)), 술탄 하사누딘(재위 1653~1669)은 네덜란드 동인도 회사의 독점에 맞서 외국 상인에게 항구를 열어 두었다. 보네의 왕자 아룽 팔라카는 1660년 고와에 맞선 봉기가 진압되자 바타비아로 달아났고, 회사는 그를 앞세워 마카사르를 치기로 했다. 코르넬리스 스페일만이 이끄는 네덜란드 선원 818명·병사 578명·암본과 부기스 병사 395명을 비롯해 모두 1,860명 안팎의 원정대가 1666년 말 바타비아를 떠났고 트르나테에서 전투용 카누를 보탰다. 1667년 11월 18일 서명된 봉가야 조약으로 고와는 회사의 무역 독점을 받아들이고 포르투갈과 영국 상인을 쫓아내며 일부 땅을 회사에 넘기고 요새를 허물기로 했다. 하사누딘은 곧 싸움을 다시 벌였고, 1668년 4~7월 병으로 2,360~4,360명이 죽는 피해도 있었다. 1669년 6월 회사군이 수마오푸 성벽 밑에 터널을 파 폭약으로 무너뜨렸고 그달 안에 전쟁이 끝났다(날짜는 자료마다 12일~24일로 갈린다). 스페일만은 수마오푸를 허물고 그 자리에 로테르담 요새를 세웠다. 이로써 고와–탈로는 소멸했고 보네가 1672년부터 술라웨시 남부의 으뜸 왕국이 되었으며, 아룽 팔라카가 가장 큰 권력자가 되었다. 하사누딘은 1669년 물러나 이듬해 죽었다고 전한다. 마카사르는 포르투갈·영국·덴마크·중국·말레이 상인이 모이던 자유항이었으므로, 이 전쟁은 회사가 향료 독점 질서를 세우는 일이기도 했다. 조약에는 회사가 마카사르의 요새를 차지하고 고와가 보네와 그 밖의 속령에 대한 지배권을 내려놓는 조건도 들어 있었다."
  subjects: [gowa-tallo, voc]
  links:
    - { from: voc, to: gowa-tallo, note: "보네와 손잡고 마카사르를 꺾고 조약을 맺게 함 (1667~1669)" }
  tags: [war, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: trunajaya-1674
  year: 1674
  endYear: 1680
  title:
    ko: "트루나자야의 반란과 네덜란드 동인도 회사의 개입(1674~1680)"
  summary:
    ko: "마타람의 아망쿠랏 1세(재위 1646~1677)는 아버지 술탄 아궁이 이룬 나라를 이었으나 궁정의 숙청과 해안 상인에 대한 억압으로 불만을 샀다(「술탄 아궁과 마타람 술탄국의 확장(1613~1645)」(앞의 사건)). 마두라 왕자 트루나자야의 아버지는 1656년 아망쿠랏 1세에게 처형당했다. 1669년 마카사르가 무너진 뒤 흩어진 마카사르 사람들은 자와 북쪽 해안을 노략했고(「마카사르 전쟁과 봉가야 조약(1666~1669)」(앞의 사건)), 1675년 트루나자야와 손잡았다. 반군은 1676년 게고독에서 더 큰 왕군을 물리치고 북쪽 해안 대부분을 차지했으며 1677년 6월 도읍 플레레드를 함락했다. 아망쿠랏 1세는 퇴각하던 7월에 죽었고, 아들 아망쿠랏 2세가 회사와 손잡았다. 그는 땅과 수입의 양보를 약속했고 1677년 9월 제파라로 옮겼다. 코르넬리스 스페일만이 이끄는 회사군은 1677년 수라바야를 되찾고 1678년 11월 트루나자야의 새 근거지 케디리를 함락했다. 트루나자야는 1679년 12월 항복했고 1680년 아망쿠랏 2세에게 죽임을 당했다. 왕의 동생 푸게르 왕자는 1681년까지 맞서다 굴복했다. 아망쿠랏 2세는 도읍을 카르타수라로 옮겼으며 1680년 무렵 서자와의 프리앙안이 회사의 영향 아래 들어갔다. 1679년 술라웨시 북쪽 미나하사와 회사가 맺은 조약도 같은 시기 회사의 북쪽 확장을 보여 준다. 회사는 자와 군주의 후원자가 되어 양보를 얻는 선례를 만들었지만, 아망쿠랏이 진 빚은 회사의 재정을 압박했다. 아망쿠랏 1세는 퇴각하던 길에 죽으면서 아들에게 푸게르 왕자를 경계하고 회사에 의지하라는 뜻을 남겼다고 전한다."
  subjects: [mataram-sultanate, voc]
  links:
    - { from: voc, to: mataram-sultanate, note: "반란 진압을 돕고 서자와 땅(프리앙안)의 영향권을 얻음 (1677~1680)" }
  tags: [war, politics]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: mac-end-1677
  year: 1677
  title:
    ko: "찐 주의 까오방 점령과 막 왕조의 끝(1677)"
  summary:
    ko: "막 당 중은 1527년 레 왕조의 황제를 몰아내고 즉위했으나(「막 당 중의 찬탈과 남북조 전쟁(1527~1592)」(앞의 사건)), 1592년 찐 뚱이 탕롱을 탈환하면서 막 마우 헙이 붙들려 죽었다. 막 왕조는 명의 보호 아래 북쪽 변경 까오방만 지켰다. 막 마우 헙의 아들 막 또안(재위 1592~1593)이 이었다. 막 낀 찌는 찐 뚱의 군대를 한 번 이겼으나 1593년 그의 군대가 무너졌고, 그의 형제 막 낀 꿍이 까오방으로 물러나 1593년부터 그곳에서 다스리며 찐 씨의 땅을 노략했다. 명은 1598년 까오방의 막 씨를 지방 관리로 인정했다. 1627년 레·찐 군대가 까오방을 쳐서 막 낀 코안(재위 1623~1638)이 항복하고 레의 작위를 받아 공이 되면서 막 씨의 땅은 공국으로 줄었다. 남명이 무너진 뒤 청이 레와 막의 분쟁에 끼어들어 1667년 강희제는 찐 딱에게 까오방을 막 씨에게 돌려주라고 명했으나, 1673년 무렵 청은 이 일에 흥미를 잃었다. 1677년 청이 삼번의 난(「삼번 철폐와 삼번의 난, 강희제의 평정(1673~1681)」)을 겪던 중 레 쪽은 막이 반란군에 가담했다고 청에 알렸고, 청이 레와 손잡았다. 까오방 전투에서 막 낀 부(재위 1638~1677)는 광시로 달아났고, 강희제가 그를 붙잡는 데 동의하면서 막 왕조는 끝났다. 이로써 레 왕조의 북쪽 땅이 한 정권 아래 이어졌다. 까오방은 명·청과 국경을 맞댄 산악 지대여서 막 씨는 중국의 인정과 조공 관계를 방패로 삼았다. 당시 후 레 왕조의 황제는 허수아비였고 찐 짱의 아들 찐 딱(찐 주 재위 1657~1682)이 실권을 쥐고 있었으며, 청은 오삼계 등과 싸우느라 북부 변경에 힘을 쏟을 수 없었다. 막 낀 부가 달아난 뒤 까오방은 레·찐 정권의 직접 지배에 들어갔고, 레 왕조는 북쪽 국경을 청과 맞대게 되었다."
  subjects: [mac-dynasty, later-le-dynasty, qing]
  links:
    - { from: later-le-dynasty, to: mac-dynasty, note: "까오방을 점령해 막 씨 정권을 끝냄 (1677)" }
  tags: [war, politics]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: voc-vassals-1680
  year: 1680
  endYear: 1684
  title:
    ko: "반튼 내전과 트르나테의 종속(1680~1684)"
  summary:
    ko: "반튼 술탄국은 16세기 중엽 순다 왕국의 도읍을 차지하며 세워진 후추 무역의 중심이었다(「반튼 술탄국의 성립과 순다 왕국의 끝(1527~1579)」(앞의 사건)). 술탄 아궁 티르타야사(재위 1651~1683)는 배를 늘리고 관개 농지를 넓혀 아시아 전역과 교역했고, 바타비아와 마타람 사이에서 부딪혔다. 그러나 아들 술탄 하지와의 왕위 다툼이 터지자 하지는 1680년 무렵 네덜란드 동인도 회사에 도움을 청했다. 회사는 1682년 아들 쪽에 서서 도읍 수로소완을 되찾게 도왔고 영국 상관을 내쫓았다. 티르타야사는 한때 물러났다가 1683년 붙잡혔고, 이후 반튼은 회사의 보호를 받는 종속국이 되었다. 1684년 조약으로 반튼은 후추 거래를 회사에 맡기고 람풍을 포함한 땅의 일부를 내주었다. 한편 트르나테 술탄국은 1257년 건국 이래 정향 산지를 거느린 말루쿠의 강국이었으나, 마카사르 전쟁(「마카사르 전쟁과 봉가야 조약(1666~1669)」(앞의 사건)) 때 회사에 전투용 카누를 대 주며 가까워졌다. 1683년 조약으로 트르나테는 회사의 종주권을 받아들이고 정향 독점을 인정했으며, 이로써 술탄국의 자주는 사라졌다. 이렇게 1680년대에 반튼과 트르나테가 같은 방식으로 회사의 속국이 되어 자와와 말루쿠의 향신료 무역이 회사의 손에 모였다. 아궁 티르타야사는 1692년 바타비아에서 죽었다고 전한다. 트르나테는 1486년 이슬람을 받아들였고 1575년 포르투갈을 쫓아낸 적이 있는 술탄국이었는데, 그런 나라가 회사의 종주권 아래 들어간 것이다. 조약 뒤 회사는 반튼 항에 요새와 상관을 두어 후추 수출을 감독했고, 술탄은 회사의 허락 없이 외국 상인과 거래할 수 없었다."
  subjects: [banten-sultanate, ternate-sultanate, voc]
  links:
    - { from: voc, to: banten-sultanate, note: "술탄 하지를 도와 아궁 티르타야사를 꺾고 종주권을 얻음 (1682~1684)" }
    - { from: voc, to: ternate-sultanate, note: "조약으로 종주권과 정향 독점을 얻음 (1683)" }
  tags: [politics, war]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: nguyen-mekong-1693
  year: 1693
  endYear: 1698
  title:
    ko: "판두랑가의 종속과 자딘부 설치(1693~1698)"
  summary:
    ko: "응우옌 푹 쭈(재위 1691~1725)가 다스리던 응우옌 주는 북쪽 찐 씨와 휴전(「찐–응우옌 전쟁과 알렉상드르 드 로드(1627~1672)」(앞의 사건)) 뒤 남쪽으로 눈을 돌렸다. 참파는 1471년 비자야를 잃은 뒤 판랑 일대의 판두랑가만 남았고, 1693년 참파의 지도부가 응우옌의 지배에 굴복했다고 본다. 이 해에 판두랑가가 응우옌 주의 속국이 되었고, 1832년 민망이 마지막 자치 정권을 없애 영토로 편입했다. 메콩 삼각주의 동쪽에서는 17세기 내내 베트남 이주민과 명이 망한 뒤 건너온 중국 사람들이 개간을 하고 있었고, 1623년 베트남인이 프레이노코르(뒷날 사이공)에 정착하도록 허락받았다고 한다. 이 땅은 캄보디아가 시암과 베트남 사이에서 내란을 겪으며 지키기 어려웠다. 1698년 응우옌 흐우 까인이 응우옌 주의 명을 받아 이 일대에 군현을 설치하고 사이공 쪽에 자딘부를 두어 베트남인 이주민의 호구를 파악했다. 이로써 메콩 삼각주 동쪽이 응우옌 주의 땅이 되고 캄보디아는 그 땅을 잃었다. 이 일대는 쌀을 내는 땅으로 자라 응우옌 주의 식량 기반이 되었다. 이 확장은 이후 하띠엔과 서쪽 삼각주로 이어지는 남진의 바탕이었다(「막 끄우·막 티엔 뜨와 하띠엔, 메콩 삼각주의 응우옌 편입(1708~1757)」(뒤의 사건)). 1653년에는 푸옌 남쪽 카우타라(카인호아)가 응우옌 주에 병합되었다. 1679년에는 명 유신인 쩐 트엉 쑤옌과 즈엉 응안 지크가 병사와 가족을 이끌고 응우옌 주에 와 비엔호아와 미토 일대에 정착했다고 전한다. 이 개척은 응우옌 주가 17세기 초 참파 북쪽을 차지한 뒤 한 세기 가까이 남쪽으로 한 걸음씩 나아간 과정의 한 단계였다."
  subjects: [nguyen-lords, champa, cambodia]
  links:
    - { from: nguyen-lords, to: champa, note: "판두랑가를 속국으로 삼음 (1693)" }
    - { from: nguyen-lords, to: cambodia, note: "메콩 삼각주 동쪽에 자딘부를 두어 차지함 (1698)" }
  tags: [politics, war]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "David Chandler, A History of Cambodia (Westview Press, 2008)"]

- id: lan-xang-split-1694
  year: 1694
  endYear: 1713
  title:
    ko: "란쌍 왕국의 분열: 루앙프라방·비엔티안·참파삭(1694~1713)"
  summary:
    ko: "란쌍 왕국은 파응움이 1353년 세운 뒤(「파응움과 란쌍 왕국의 건국(1353~1373)」(앞의 사건)) 1560년 비엔티안으로 도읍을 옮겼고, 수리야웡사(재위 1637~1694)의 오랜 평화 시기에 법과 불교 승단, 무역이 자리를 잡았다. 수리야웡사가 죽은 해는 1694년으로 보는 서술이 많고 1695년으로 적는 자료도 있다. 수리야웡사가 죽자 재상 출신 티안 탈라가 반년 남짓(1694~1695) 왕위를 찬탈했고, 뒤이어 난타랏(재위 1695~1698)과 수리야웡사의 조카 셋타티랏 2세가 왕위를 다투며 비엔티안을 차지했다 잃기를 되풀이했다. 이 틈에 대월과 시암, 버마의 영향이 번갈아 미쳤다. 1707년(1706년으로 적는 자료도 있다) 손자 낑낏사랏이 북쪽에서 스스로 왕을 칭하고 루앙프라방에 따로 왕국을 세웠고, 비엔티안에는 셋타티랏 2세가 왕위에 머물러 라오의 중심이 둘이 되었다. 1713년에는 남부의 참파삭에서 수리야웡사의 손자로 전해지는 노깟사드(소이시사뭇 푸타웡)가 따로 왕을 칭하면서 라오가 세 왕국으로 갈렸다. 참파삭은 메콩 오른쪽 기슭의 이산 일부를 포함하는 남쪽 땅을 거느렸고, 비엔티안은 이 분리로 남부를 잃었다. 시앙쿠앙(무앙푸안)은 대월과 라오 양쪽에 조공을 바쳐 왔다고 전하나, 분열 뒤 어느 왕국에 매였는지는 사료마다 갈리고 이 글에서 확정하지 못했다. 세 왕국은 서로 다투다가 18세기 후반 시암과 버마의 압력에 차례로 놓였다. 란쌍이라는 이름은 1707년 이후로는 옛 통일 왕국을 가리키는 말로만 남았다. 수리야웡사 시대인 1641년에는 네덜란드 동인도 회사의 사절 헤릿 판 베이스트호프가 비엔티안을 찾아와 무역을 협의했다. 비엔티안 왕 셋타티랏 2세는 대월의 지원을 받은 인물로 전해지며, 이는 라오 왕위 계승에 대월이 영향을 미친 한 보기다."
  subjects: [lan-xang, luang-prabang-kingdom, vientiane-kingdom, champasak-kingdom]
  tags: [politics]
  sources: ["Martin Stuart-Fox, A History of Laos (Cambridge University Press, 1997)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)"]

- id: johor-bendahara-1699
  year: 1699
  endYear: 1722
  title:
    ko: "조호르의 븐다하라 왕조와 트렝가누(1699~1722)"
  summary:
    ko: "말라카 왕가의 후손이 세운 조호르 술탄국(「말라카 왕가의 갈라짐: 조호르와 페락(1528~1540)」(앞의 사건))은 압둘 잘릴 샤 3세(재위 1623~1677), 이브라힘 샤(1677~1685)를 거쳐 마흐무드 샤 2세(재위 1685~1699)에 이르렀다. 마흐무드 샤 2세는 어린 나이에 올라 어머니와 븐다하라(재상)가 섭정했고, 1697년 븐다하라가 죽은 뒤 변덕스럽고 잔인해져 상인이 항구를 피할 만큼 나라가 흔들렸다. 그는 1699년 궁정 귀족들에게 살해되었고, 이로써 말라카 왕가의 직계가 끊겼다. 븐다하라 압둘 잘릴이 스스로 술탄이 되어(압둘 잘릴 4세, 재위 1699~1718) 븐다하라 왕조가 시작되었다. 같은 시기 동해안에서는 븐다하라 가문의 툰 자이날 아비딘이 트렝가누를 이끌었고, 이 지역은 1708년 무렵 술탄국으로 서기 시작해 1724년 독립, 1725년 즉위로 적는 서술도 있다. 1718년 마흐무드 샤 2세의 아들이라 주장한 수마트라의 라자 크칠이 조호르를 공격해 도읍을 차지했고, 압둘 잘릴 4세는 파항으로 달아났다. 1722년 부기스 사람들의 도움을 받은 압둘 잘릴 4세의 아들 술라이만(술탄 술라이만 바드룰 알람 샤, 재위 1722~1760)이 도읍을 되찾았고, 부기스 지도자들은 야무안 무다(부왕)의 자리를 차지해 이후 조호르 궁정에서 큰 힘을 쥐었다. 라자 크칠은 같은 해 시악 술탄국을 세웠다. 이 과정에서 조호르는 리아우를 중심으로 한 해양 왕국이 되었다. 이 시기 조호르는 파항·리아우·링가 제도를 아울렀고, 도읍은 코타팅기에서 리아우 쪽으로 옮겨 갔다. 압둘 잘릴 4세는 파항에서 라자 크칠이 보낸 자객에게 살해되었다고 전하며(해는 1719~1721년으로 자료마다 갈린다), 조호르 왕가는 이후 부기스와 말레이 세력의 균형에 매였다."
  subjects: [johor-sultanate, terengganu-sultanate]
  tags: [politics, war]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: ha-tien-1708
  year: 1708
  endYear: 1757
  title:
    ko: "막 끄우·막 티엔 뜨와 하띠엔, 메콩 삼각주의 응우옌 편입(1708~1757)"
  summary:
    ko: "중국 광둥 출신 막 끄우는 청에 맞섰던 세력이 무너지자 1671년 레이저우에서 달아나 캄보디아로 와서, 캄보디아 왕에게 크메르 관직을 받고 중국인 이주민의 도시를 세웠다. 1708년 막 끄우가 응우옌 푹 쭈(재위 1691~1725)에게 사절을 보내 귀속을 청하고 하띠엔 총병의 직위를 받아 하띠엔 땅을 응우옌 주의 지배 아래 두었다고 전한다(1715년에는 캄보디아 왕이 시암의 지원으로 하띠엔을 공격해 막 끄우가 달아났다). 그의 아들 막 티엔 뜨(재위 1735~1777)가 이끄는 하띠엔은 무역으로 크게 번성했다. 응우옌 푹 코앗(재위 1738~1765)은 1744년 왕(브엉)을 칭하며 남쪽 정권을 더욱 굳혔고, 1755년에는 캄보디아에 군대를 보내 하띠엔 쪽 항구를 확보했다. 캄보디아에서는 왕 앙똔이 죽은 1757년 무렵 왕위 다툼 속에서 서쪽 메콩 삼각주 남은 땅이 응우옌 주에 넘어갔고(막 티엔 뜨의 지지로 앙똔의 손자 우테이 2세가 즉위한 해는 1758년이다), 이로써 삼각주 전체가 응우옌 주의 땅이 되었다. 이 사이 북쪽에서는 레 황제가 찐 씨의 허수아비로 남았고 1740~1750년대에 농민 봉기가 이어졌다. 응우옌 주의 남진은 1771년 시암군의 하띠엔 습격으로 막 씨가 큰 피해를 입고 떠이선 봉기로 정권이 무너지기 전까지 이어졌다(「떠이선 봉기와 응우옌 주의 몰락(1771~1785)」(뒤의 사건)). 막 티엔 뜨는 한시를 짓는 문인이기도 해서 하띠엔에 문인 모임 '쭈옹당'을 열었다고 전한다. 1739년 무렵부터 하띠엔은 크메르와 베트남, 시암 사이에서 독자적인 외교를 펼치며 중국인 항구 공국의 성격을 띠었다. 하띠엔은 캄보디아에도 조세를 바쳤다고 하여 두 나라에 이중으로 매인 땅이었다."
  subjects: [nguyen-lords, cambodia]
  links:
    - { from: cambodia, to: nguyen-lords, note: "남은 서쪽 메콩 삼각주를 넘김 (1757)" }
  tags: [politics, society]
  sources: ["Keith W. Taylor, A History of the Vietnamese (Cambridge University Press, 2013)", "David Chandler, A History of Cambodia (Westview Press, 2008)"]

- id: mon-revolt-1740
  year: 1740
  endYear: 1752
  title:
    ko: "몬의 봉기와 후기 항따와디, 아바 함락(1740~1752)"
  summary:
    ko: "냥얀 왕조(「아나욱펫룬의 시리암 탈환과 하버마 회복(1605~1628)」(앞의 사건))의 마지막 왕들인 사나이(재위 1698~1714), 타닌가웨(1714~1733), 마하다마라자 디파디(1733~1752) 시기에 상버마는 마니푸르 기병의 약탈과 세금 부담으로 지쳐 있었다. 하버마의 몬 사람들은 무거운 징세와 아바의 통제에 불만이 컸고, 1740년 바고(페구)에서 몬이 봉기해 아바가 보낸 관리와 따웅우 쪽 충성파를 몰아냈다. 궁정은 그해 말 스민도 부다케티를 왕으로 세웠고(재위 1740~1747), 새 왕국을 항따와디 왕국(후기 항따와디)이라 부른다. 1745년까지 하버마 대부분과 상버마 일부를 장악했으나, 스민도는 승려 출신의 왕이었고 후계가 길게 이어지지 않았다. 1747년 비냐 달라(재위 1747~1757)가 올랐고, 1751년 상버마로 총공세를 벌였다. 1752년 3월 23일 항따와디군이 아바를 함락해 마하다마라자 디파디를 사로잡았고, 이로써 1510년 독립해 1752년까지 이어진 따웅우 왕조가 끝났다. 마하다마라자 디파디가 죽은 해는 1752년으로 보는 서술이 있고 1754년으로 적는 계보도 있다. 몬 왕국은 곧 알라웅브야의 반격에 놓인다(「알라웅브야와 콘바웅 왕조의 성립, 페구 함락(1752~1757)」(뒤의 사건)). 이 봉기는 몬이 처음으로 버마 중심에서 벗어나 나라를 되찾은 일이자 마지막 시도였다. 마니푸르 기병의 약탈은 1720년대부터 친드윈강 유역을 괴롭혀 왔고 1740년대에 더 거세졌다. 새 왕국의 도읍은 바고였고, 몬 왕들은 포르투갈·프랑스 상인과도 무역을 벌였다. 몬의 봉기는 아바 조정이 하버마의 세금과 관직을 모두 상버마 사람이 차지한 데 대한 반발이기도 했다."
  subjects: [hanthawaddy-kingdom, toungoo-dynasty]
  links:
    - { from: hanthawaddy-kingdom, to: toungoo-dynasty, note: "아바를 함락하고 왕조를 끝냄 (1752)" }
  tags: [war, politics]
  sources: ["Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Michael Charney, A History of Modern Burma (Cambridge University Press, 2009)"]

- id: batavia-massacre-1740
  year: 1740
  endYear: 1743
  title:
    ko: "바타비아의 중국인 학살과 자와 전쟁, 북해안 할양(1740~1743)"
  summary:
    ko: "바타비아는 설탕 가격 폭락 뒤 실업자가 된 중국인 노동자가 늘었고, 총독 아드리안 팔컨니르는 1740년 9월 반란이 일어나면 무력으로 누르라고 명했다. 1740년 10월 9일부터 22일까지 시내에서 중국인 학살이 벌어졌다. 팔컨니르가 10월 11일 사면을 선언했으나 살육은 이어지다가 22일 중단되었다. 희생자는 성 안에서만 1만 명이 넘는다는 서술이 많으며, 살아남은 사람의 수를 600명에서 3,431명으로 어림하는 추산도 있다. 팔컨니르는 얼마 뒤 소환되어 1744년 사형을 선고받았지만 1751년 옥중에서 숨졌고 사형 선고는 1755년 취소되었다. 학살을 피한 중국인은 중부 자와로 도망쳐 네덜란드 동인도 회사의 상관을 공격했고, 1741년부터 1743년까지 자와 전체에서 중국인과 자와 군주들이 회사와 싸우는 전쟁으로 번졌다. 마타람의 파쿠부워노 2세는 처음에는 반란에 가담했고, 반란군이 1742년 도읍 카르타수라를 점령하자 회사 쪽으로 돌아섰다. 반란은 1743년 회사가 누르고 도읍을 되찾았다. 대가로 파쿠부워노 2세는 1743년 북쪽 해안(파시시르)과 마두라를 회사에 넘겼고, 자와 내륙은 1755년 기얀티 조약 때까지 마타람의 땅으로 남았다. 파쿠부워노 2세는 1749년 나머지 왕국마저 회사에 넘긴 것으로 본다(「마타람의 양도와 기얀티 조약(1749~1757)」(뒤의 사건)). 이 사건은 마타람 군주의 영토와 권위가 회사의 손에 넘어가는 시작이 되었다. 반란군은 1742년 카르타수라에서 마스 가렌디(순안 쿠닝)를 왕으로 세웠다고 전한다. 이 사건은 회사가 자와에서 중국인 상인층을 억누른 한편 자와 군주의 내분에 깊이 끼어든 계기로도 해석된다."
  subjects: [voc, mataram-sultanate]
  links:
    - { from: mataram-sultanate, to: voc, note: "북쪽 해안과 마두라를 넘김 (1743)" }
  tags: [war, society]
  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: mataram-partition-1749
  year: 1749
  endYear: 1757
  title:
    ko: "마타람의 양도와 기얀티 조약(1749~1757)"
  summary:
    ko: "마타람의 파쿠부워노 2세는 1743년 북쪽 해안과 마두라를 네덜란드 동인도 회사에 넘긴 데 이어(「바타비아의 중국인 학살과 자와 전쟁, 북해안 할양(1740~1743)」(앞의 사건)), 1749년 병이 깊어지자 나머지 왕국의 주권마저 회사에 맡기고 숨졌다. 회사는 그의 아들 파쿠부워노 3세를 세웠지만, 1746년부터 왕에게 맞서 온 왕의 동생 망쿠부미 왕자가 이를 인정하지 않고 싸움을 이어 갔다. 1749년부터 1757년까지 이어진 이 제3차 자와 왕위 계승 전쟁에는 라덴 마스 사이드(뒷날 망쿠네가라 1세)의 반란도 얽혀 있었다. 회사의 총독 니콜라스 하르팅은 1754년 9월 망쿠부미와 협상해 합의문을 만들었고, 파쿠부워노 3세가 그해 11월 이를 승인했다. 1755년 2월 13일 기얀티 조약으로 마타람이 둘로 갈려, 동쪽은 파쿠부워노 3세가 수라카르타에서, 서쪽은 망쿠부미가 하멩쿠부워노 1세라는 이름으로 욕야카르타에서 다스렸다. 회사는 해안 영토를 유지했고 술탄에게 해마다 보수를 주기로 했다. 사이드는 1757년 회사와 살라티가에서 따로 화해해 망쿠네가란이라는 영지를 얻었다. 한편 자와 서쪽 끝의 반튼에서는 술탄 후계를 둘러싼 불만이 터져 1750~1752년 반란이 일어났고, 회사는 1752년 람풍을 병합해 술탄국을 더 옥죄었다. 이렇게 마타람은 1755년 사라졌고, 자와 중부는 수라카르타와 욕야카르타, 영지들로 나뉘어 회사의 통제 아래 놓였다. 망쿠부미는 1746년 무렵부터 파쿠부워노 2세에 맞서 일어났고, 기얀티 조약으로 갈린 욕야카르타는 1755년 이후 새 도시로 건설되었다. 회사는 두 궁정과 망쿠네가란 영지 모두를 감독하며 자와 중부를 한 세기 가까이 통제했다."
  subjects: [mataram-sultanate, voc, banten-sultanate]
  links:
    - { from: mataram-sultanate, to: voc, note: "주권을 넘기고 조약으로 둘로 갈림 (1749~1755)" }
    - { from: voc, to: banten-sultanate, note: "람풍을 병합함 (1752)" }
