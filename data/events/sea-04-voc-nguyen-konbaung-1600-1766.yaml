  sources: ["David K. Wyatt, Thailand: A Short History (Yale University Press, 1984)", "Chris Baker and Pasuk Phongpaichit, A History of Thailand (Cambridge University Press, 2005)", "Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)"]
