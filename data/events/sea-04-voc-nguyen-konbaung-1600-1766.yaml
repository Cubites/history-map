  sources: ["M. C. Ricklefs, A History of Modern Indonesia since c. 1200 (Stanford University Press, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: alaungpaya-1752
  year: 1752
  endYear: 1757
  title:
    ko: "알라웅브야와 콘바웅 왕조의 성립, 페구 함락(1752~1757)"
  summary:
    ko: "항따와디군이 1752년 3월 아바를 함락하자(「몬의 봉기와 후기 항따와디, 아바 함락(1740~1752)」(앞의 사건)) 상버마의 촌장 아웅제야는 새 왕조를 세우기로 하고 스스로 왕을 칭했다. 1714년에 태어난 그는 알라웅브야라는 이름으로 목소보(셰보)에 근거를 두고 1752년부터 1760년까지 다스렸다(재위 1752~1760). 알라웅브야는 주변 마을을 모아 항따와디군을 막았고 상버마에서 그들을 몰아냈으며 1754년 1월 17세의 아들 싱뷰싱을 보내 아바를 되찾게 했다(1753년 말부터 반격이 시작되었다). 같은 해 항따와디의 북진을 막은 뒤 1755년 하버마를 정복하러 나섰다. 그는 달라(다곤)를 점령해 양곤(싸움의 끝)이라 이름 붙였고, 1756년 7월 14개월의 포위 끝에 시리암(탄린)을 함락했으며, 1757년 5월 6일 항따와디의 도읍 바고(페구)를 차지했다. 이로써 항따와디 왕국이 무너졌고 비냐 달라(재위 1747~1757)의 나라가 끝났다. 몬 수천 명이 시암으로 달아났고, 하버마의 몬 사회는 이후 동화와 이주를 겪으며 소수가 되었다. 알라웅브야는 마니푸르·샨 지역과 영국 동인도 회사의 네그레이스 곶 기지에도 군대를 보냈다. 1759년 시암을 침공했으나 아유타야 포위 중 병이 들어 돌아오다 1760년 죽었고, 맏아들 나웅도지가 이었다. 알라웅브야는 흩어진 중앙 권력을 되살린 왕으로 평가되지만, 몬 민족주의 역사가들은 하버마에서의 그의 민족 정책을 비판한다. 이 왕조는 콘바웅 왕조(1752~1885)라 불린다. 아웅제야의 근거지 목소보는 뒷날 쉐보라 불리며 도읍이 되었다. 알라웅브야는 '부처가 될 사람'이라는 뜻의 칭호로 쓰였다."
  subjects: [konbaung-dynasty, hanthawaddy-kingdom]
  links:
    - { from: konbaung-dynasty, to: hanthawaddy-kingdom, note: "바고를 함락하고 하버마를 차지함 (1757)" }
  tags: [war, politics]
  sources: ["Michael Aung-Thwin and Maitrii Aung-Thwin, A History of Myanmar since Ancient Times: Traditions and Transformations (Reaktion Books, 2012)", "Thant Myint-U, The River of Lost Footsteps: Histories of Burma (Faber and Faber, 2006)"]

- id: kelantan-selangor-1760
  year: 1760
  endYear: 1766
  title:
    ko: "클란탄과 슬랑오르: 18세기의 새 말레이 술탄국(1760~1766)"
  summary:
    ko: "조호르의 븐다하라 왕조와 부기스 세력이 얽힌 지난 반세기(「조호르의 븐다하라 왕조와 트렝가누(1699~1722)」(앞의 사건)) 뒤 말레이 반도 동서 해안에서는 조호르에서 떨어져 나온 새 정권이 자리를 잡았다. 동해안 클란탄은 오래 말라카·파타니·트렝가누 사이에 낀 땅이었고, 1760년 무렵 클란탄이 한 지도자 아래 모였다가 1763~1764년 무렵 롱 유누스가 권력을 잡으면서 독자적인 술탄국의 틀이 갖춰졌다고 전한다. 자료에 따라 롱 유누스의 즉위를 1760년대 초반으로 적기도 한다. 서해안 슬랑오르에서는 부기스 지도자의 아들인 라자 루무가 1766년 페락 술탄에게서 술탄 칭호를 받아 살레후딘이라는 이름으로 즉위했고, 쿠알라슬랑오르를 도읍으로 삼았다. 그의 가문은 조호르 궁정의 부기스 야무안 무다와 이어졌다. 슬랑오르는 1528년부터 조호르 영역으로 묶여 있었으므로 이 즉위는 조호르의 서해안 지배가 사실상 끝났음을 알린다. 한편 내륙의 느그리슴빌란에서는 미낭카바우 이주민이 조호르의 권위를 빌려 아홉 지역을 연합했고, 1773년 라자 믈레와르가 왕으로 추대되었다고 하는데 그 해는 전승이어서 확실하지 않다. 클란탄과 트렝가누가 시암에 조공을 바친 시작은 1780년대 이후로 보며, 그 앞의 관계는 이 글에서 확인하지 못했다. 두 술탄국은 19세기 시암과 영국의 갈림길에서 중요한 위치에 놓인다. 라자 루무는 부기스 지도자 다엥 첼락의 아들로 전해지며, 쿠알라슬랑오르는 1784년 네덜란드의 공격을 받아 한때 함락되었다. 두 술탄국이 서는 동안 말레이 세계에서는 영국 동인도 회사가 페낭(1786)에 이르기 전의 무역 질서가 바뀌고 있었다. 롱 유누스는 쿠방 라부 요새를 근거지로 삼았다."
  subjects: [kelantan-sultanate, selangor-negeri-sembilan, johor-sultanate]
  tags: [politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Malaysia (Palgrave Macmillan, 2001)", "Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)"]

- id: manila-british-1762
  year: 1762
  endYear: 1764
  title:
    ko: "영국의 마닐라 점령(1762~1764)"
  summary:
    ko: "7년 전쟁(「외교 혁명과 7년 전쟁」(앞의 사건))에 스페인이 1762년 프랑스 편으로 참전하자 영국은 인도 마드라스에서 윌리엄 드레이퍼가 이끄는 육군과 새뮤얼 코니시의 함대를 보내 필리핀을 쳤다. 영국 함대는 1762년 9월 24일 마닐라만에 들어왔고, 10월 5~6일 성벽을 무너뜨려 10월 6일 마닐라를 차지했다. 대주교 마누엘 로호 이 비에이라(1708~1764)가 임시로 총독 대리가 되어 항복 조건에 서명했다. 사이먼 데 안다 이 살라자르는 포로가 되는 것을 피해 불라칸과 바콜로르에서 저항 정부를 이끌며 대주교의 합의를 인정하지 않았다. 영국의 지배는 마닐라와 카비테 항구 둘레에 그쳤고, 지방은 안다의 부대와 현지 봉기가 맞섰다. 일로코스의 디에고 실랑은 이 혼란을 틈타 봉기해 스페인 관리의 부당함을 호소했으나 영국과 손잡으려 한 일 때문에 1763년 친구들에게 암살되었다. 영국은 술루의 술탄 아짐 웃딘 1세를 마닐라 요새 감옥에서 풀어 주고 동맹을 맺었으며 1764년 철수 때 함께 데려갔다. 7년 전쟁을 끝낸 파리 조약은 1763년 2월 10일 서명되었으나 소식이 늦어 점령이 이어졌다. 영국군은 1764년 3월 29일 영국의 마닐라 총독 드레이크가 떠난 뒤 4월 첫 주 마닐라와 카비테에서 철수했다. 영국의 점령은 약 1년 반 만에 끝났고 스페인의 지배를 일시적으로 흔들었을 뿐 영토 변화는 남기지 않았다. 영국은 마닐라를 돌려주는 대가로 배상금 4백만 스페인 달러를 요구했으나 영국군이 떠날 때까지 약 4분의 1만 치러져 분쟁이 되었다고 전한다. 필리핀 사람 가운데 일부는 영국과 손잡고 스페인에 맞서기도 했다."
  subjects: [spanish-philippines, uk, sulu-sultanate]
  tags: [war, politics]
  sources: ["Barbara Watson Andaya and Leonard Y. Andaya, A History of Early Modern Southeast Asia, 1400–1830 (Cambridge University Press, 2015)", "Nicholas Tarling 편, The Cambridge History of Southeast Asia, vol. 2 (Cambridge University Press, 1992)"]

- id: hsinbyushin-ayutthaya-1763
  year: 1763
  endYear: 1767
  title:
    ko: "싱뷰싱의 아유타야 원정과 함락(1763~1767)"
  summary:
    ko: "알라웅브야가 1759년 아유타야를 포위하다 병들어 1760년 돌아오다 죽은 뒤(「알라웅브야와 콘바웅 왕조의 성립, 페구 함락(1752~1757)」(앞의 사건)), 맏아들 나웅도지(재위 1760~1763)에 이어 동생 싱뷰싱이 1763년 즉위했다(재위 1763~1776). 란나의 치앙마이는 1558년 버마에 정복당한 뒤 1727년 독립을 되찾았으나 다시 콘바웅 왕조에 매였고, 1761년 시암의 부추김으로 일으킨 반란은 1763년 1월 나웅도지 치하의 버마군에 눌렸다. 그 뒤 총독이 들어섰고 란나 다섯 도가 버마의 직할 지배로 들어갔다. 싱뷰싱은 치앙마이와 하버마 두 방향에서 대군을 보냈다. 1765년 한 갈래가 치앙마이에서, 다른 갈래가 다웨이(타보이)에서 출발해 아유타야로 모였고, 루앙프라방과 비엔티안 등 라오 왕국들에도 압력이 가해졌다고 전한다. 아유타야 왕은 에까탓(재위 1758~1767)이었고, 에까탓의 아우 우툼폰이 1758년 잠시 왕위에 올랐다가 승려가 되었고 1760년 버마 침공 때 다시 정사를 맡았다가 물러난 터라 궁정은 갈라져 있었다. 포위는 1766년 초부터 14개월 가까이 이어졌고, 도성은 1767년 4월 7일 함락되었다. 이 시기 청과 버마의 전쟁(1765~1769)이 겹쳐 싱뷰싱은 병력을 나누어 써야 했다(「건륭제의 십전무공(1747~1792)」(앞의 사건)). 이 글은 아유타야 함락까지만 다루며, 함락 뒤 딱신이 시암을 되찾는 일은 「아유타야의 함락과 딱신의 톤부리 왕국(1767~1770)」(뒤의 사건)이 이어서 다룬다. 아유타야 함락 때 버마군이 포로로 끌고 간 사람은 수만 명으로 추산되며, 왕족과 기술자들이 아바로 보내졌다. 아유타야의 불상과 문헌, 공예품도 불타거나 약탈당해 이 왕조 문화의 유산이 크게 사라졌다. 싱뷰싱의 군대는 아유타야 둘레의 마을도 약탈했다."
  subjects: [konbaung-dynasty, lan-na, ayutthaya-kingdom, luang-prabang-kingdom, vientiane-kingdom]
  links:
    - { from: konbaung-dynasty, to: lan-na, note: "치앙마이를 재정복해 다섯 도를 직할로 삼음 (1763)" }
    - { from: konbaung-dynasty, to: ayutthaya-kingdom, note: "포위 끝에 도성을 함락함 (1767)" }
