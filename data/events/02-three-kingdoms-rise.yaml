  year: 396
  title:
    ko: 광개토대왕의 백제 공격
  summary:
    ko: 광개토대왕이 백제를 공격해 한강 이북의 58성을 빼앗았다. 백제 아신왕은 항복하고 영원히 신하가 되겠다고 맹세했다.
  subjects: [goguryeo, baekje]
  links:
    - { from: goguryeo, to: baekje, note: "58성 700촌 정복" }
  tags: [war]
  sources: ["광개토대왕릉비 영락 6년조"]
  places: [{ name: "백제 한성", at: [127.12, 37.52] }]

- id: gwanggaeto-silla-400
  year: 400
  title:
    ko: 광개토대왕의 신라 구원
  summary:
    ko: 신라 내물왕의 요청으로 광개토대왕이 5만 군대를 보내 신라에 쳐들어온 왜를 물리치고, 임나가라(금관가야)까지 추격했다. 이후 고구려군이 신라에 머물며 내정에 간섭했고, 금관가야가 쇠퇴해 가야 연맹의 중심이 대가야로 옮겨 갔다. 경주 호우총에서 나온 호우명 그릇이 두 나라의 관계를 보여 준다.
  subjects: [goguryeo, silla, wa, gaya]
  links:
    - { from: goguryeo, to: silla, note: "구원군 파견, 내정 간섭" }
    - { from: goguryeo, to: wa, note: "왜 격퇴" }
    - { from: goguryeo, to: gaya, note: "임나가라 추격" }
    - { from: wa, to: silla, note: "왜의 침입" }
  tags: [war]
  sources: ["광개토대왕릉비 영락 10년조", "호우명 그릇 명문"]
  places: [{ name: "종발성 (김해)", at: [128.88, 35.23] }]

- id: liaodong-405
  year: 402
  endYear: 405
  title:
    ko: 고구려의 요동 확보
  summary:
    ko: 광개토대왕이 후연의 숙군성을 공격하는 등 후연과 싸워 요동 지역을 차지했다. 405년 후연이 요동성을 공격했으나 막아 냈다.
  subjects: [goguryeo, later-yan]
  links:
    - { from: goguryeo, to: later-yan, note: "숙군성 공격, 요동 차지" }
    - { from: later-yan, to: goguryeo, note: "요동성 공격" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 광개토왕 11년·14년"]
  places: [{ name: "요동성", at: [123.17, 41.27] }]

- id: gwanggaeto-stele-414
  year: 414
  title:
    ko: 광개토대왕릉비 건립
  summary:
    ko: "장수왕이 아버지 광개토대왕의 업적을 기려 국내성(지안)에 비를 세웠다. 고구려의 건국 신화와 광개토대왕의 정복 활동이 새겨져 있다. 비문 끝부분에는 왕릉을 지키는 수묘인의 수와 관리 규정을 적었다. 이른바 신묘년(391) 기사는 일본이 임나일본부설의 근거로 내세웠으나, 글자 판독과 해석을 두고 논란이 이어지고 있다."
  subjects: [goguryeo]
  tags: [culture]
  sources: ["광개토대왕릉비"]

- id: pyongyang-427
  year: 427
  title:
    ko: 장수왕의 평양 천도
  summary:
    ko: 장수왕이 도읍을 국내성에서 평양으로 옮기고 남진 정책을 폈다. 북위와 남조 송에 모두 사신을 보내는 양면 외교로 중국을 견제했다.
  subjects: [goguryeo, northern-wei, liu-song]
  links:
    - { from: goguryeo, to: northern-wei, note: "사신 파견" }
    - { from: goguryeo, to: liu-song, note: "사신 파견" }
  tags: [politics, diplomacy]
  sources: ["『삼국사기』 고구려본기 장수왕 15년"]

- id: najae-alliance-433
  year: 433
  title:
    ko: 나제 동맹
  summary:
    ko: 고구려의 남진에 맞서 신라 눌지왕과 백제 비유왕이 동맹을 맺었다. 눌지왕 때 신라는 왕위의 부자 상속을 확립하고 고구려의 간섭에서 벗어나려 했다.
  subjects: [silla, baekje]
  links:
    - { from: baekje, to: silla, note: "동맹 요청" }
    - { from: silla, to: baekje, note: "동맹 수락" }
  tags: [diplomacy]
  sources: ["『삼국사기』 신라본기 눌지 마립간 17년", "『삼국사기』 백제본기 비유왕 7년"]

- id: northern-yan-436
  year: 436
  title:
    ko: 북연 왕 풍홍의 고구려 망명
  summary:
    ko: 북위의 공격을 받은 북연의 왕 풍홍이 고구려로 망명했다. 북연이 멸망하면서 북위가 화북을 통일해 가는 가운데, 장수왕은 북위와 맞서지 않으면서 실리를 챙겼다.
  subjects: [goguryeo, northern-yan, northern-wei]
  links:
    - { from: northern-wei, to: northern-yan, note: "북연 정복" }
    - { from: northern-yan, to: goguryeo, note: "풍홍의 망명" }
  tags: [diplomacy]
  sources: ["『삼국사기』 고구려본기 장수왕 24년", "『위서』"]

- id: gaero-letter-472
  year: 472
  title:
    ko: 개로왕의 북위 국서
  summary:
    ko: 백제 개로왕이 북위에 국서를 보내 고구려를 함께 치자고 요청했으나 북위는 응하지 않았다.
  subjects: [baekje, northern-wei]
  links:
    - { from: baekje, to: northern-wei, note: "고구려 공격 요청" }
  tags: [diplomacy]
  sources: ["『삼국사기』 백제본기 개로왕 18년", "『위서』 백제전"]

- id: hanseong-falls-475
  year: 475
  title:
    ko: 한성 함락과 웅진 천도
  summary:
    ko: "장수왕이 백제의 한성을 함락하고 개로왕을 죽였다. 백제 문주왕은 웅진(공주)으로 도읍을 옮겼다. 고구려는 한강 유역을 차지하고 아산만에서 죽령·영일만에 이르는 지역까지 세력을 넓혔으며, 이 시기에 충주 고구려비(중원 고구려비)를 세웠다. 충주 고구려비에는 고구려 왕이 신라 왕(매금)과 신하들에게 옷을 내려 주었다는 내용이 있어 두 나라의 상하 관계를 보여 준다. 다만 비를 세운 때는 5세기 중엽설과 후반설 등으로 학설이 갈린다."
  subjects: [goguryeo, baekje]
  links:
    - { from: goguryeo, to: baekje, note: "한성 함락, 개로왕 전사" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 장수왕 63년", "『삼국사기』 백제본기 개로왕 21년·문주왕 원년", "충주 고구려비"]
  places: [{ name: "한성", at: [127.12, 37.52] }]

- id: daegaya-479
  year: 479
  title:
    ko: 대가야의 남제 사신 파견
  summary:
    ko: 고령의 대가야(가라국) 왕 하지가 남제에 사신을 보내 관작을 받았다. 5세기 후반 대가야가 후기 가야 연맹을 이끌었다.
  subjects: [gaya, southern-qi]
  links:
    - { from: gaya, to: southern-qi, note: "사신 파견" }
    - { from: southern-qi, to: gaya, note: "보국장군 본국왕 책봉" }
  tags: [diplomacy]
  sources: ["『남제서』 동남이전 가라국"]

- id: marriage-alliance-493
  year: 493
  title:
    ko: 백제와 신라의 결혼 동맹
  summary:
    ko: "백제 동성왕이 신라 소지 마립간에게 혼인을 청해, 이찬 비지의 딸과 결혼하며 나제 동맹을 강화했다. 소지 마립간은 사방에 우역을 두고 관도를 고쳤으며(487), 수도에 시장을 열어 사방의 물건이 오가게 했다(490)."
  subjects: [baekje, silla]
  links:
    - { from: baekje, to: silla, note: "혼인 요청" }
    - { from: silla, to: baekje, note: "이찬 비지의 딸을 보냄" }
  tags: [diplomacy]
  sources: ["『삼국사기』 백제본기 동성왕 15년", "『삼국사기』 신라본기 소지 마립간 15년"]

- id: buyeo-falls-494
  year: 494
  title:
    ko: 부여의 고구려 복속
  summary:
    ko: 물길에 쫓긴 부여 왕실이 고구려 문자명왕에게 항복해 부여가 완전히 사라졌다. 고구려는 최대 영토를 이루었다.
  subjects: [buyeo, goguryeo, mulgil]
  links:
    - { from: mulgil, to: buyeo, note: "물길의 공격" }
    - { from: buyeo, to: goguryeo, note: "왕실의 항복" }
  tags: [politics]
  sources: ["『삼국사기』 고구려본기 문자명왕 3년"]

# ── 6세기: 백제의 중흥과 신라의 발전 ────────────────────

- id: jijeung-503
  year: 502
  endYear: 509
  title:
    ko: 지증왕의 체제 정비
  summary:
    ko: 신라 지증왕이 소를 이용한 우경을 장려하고 순장을 금지했다(502). 국호를 '신라'로 정하고 '마립간' 대신 '왕'이라는 칭호를 썼다(503). 지방에 주·군을 설치하고 실직주에 이사부를 군주로 보냈으며(505), 수도에 시장을 감독하는 동시전을 두었다(509).
  subjects: [silla]
  tags: [politics, economy]
  sources: ["『삼국사기』 신라본기 지증 마립간 3년·4년·6년·10년"]

- id: usanguk-512
  year: 512
  title:
    ko: 이사부의 우산국 정복
  summary:
    ko: 하슬라주(강릉) 군주 이사부가 나무 사자를 배에 싣고 가 우산국(울릉도)을 복속시켰다. 신라는 동해안을 따라 강릉까지 세력을 넓혔다.
  subjects: [silla]
  tags: [war]
  sources: ["『삼국사기』 신라본기 지증 마립간 13년", "『삼국사기』 열전 이사부"]
  places: [{ name: "우산국", at: [130.87, 37.5] }]

- id: muryeong-521
  year: 521
  title:
    ko: 무령왕의 양 교류와 22담로
  summary:
    ko: "백제 무령왕이 지방에 22담로를 두고 왕족을 보내 다스렸다. 양에 사신을 보내 \"다시 강국이 되었다\"고 알리고 영동대장군 칭호를 받았다. 공주의 무령왕릉은 양의 영향을 받은 벽돌무덤이다. 1971년 공주 송산리 고분군(지금의 무령왕릉과 왕릉원)에서 발견된 무령왕릉은 무덤 주인을 밝힌 지석이 나와 주인이 확실한 드문 삼국 시대 왕릉이 되었으며, 진묘수와 금제 관꾸미개 등이 출토되었다."
  subjects: [baekje, liang]
  links:
    - { from: baekje, to: liang, note: "사신 파견" }
    - { from: liang, to: baekje, note: "영동대장군 책봉, 벽돌무덤 양식" }
  tags: [diplomacy, culture]
  sources: ["『삼국사기』 백제본기 무령왕 21년", "『양서』 백제전", "무령왕릉 지석"]

- id: beopheung-520
  year: 517
  endYear: 520
  title:
    ko: 법흥왕의 율령 반포
  summary:
    ko: "신라 법흥왕이 병부를 설치하고(517) 율령을 반포하며 백관의 공복을 정했다(520). 골품제가 정비되고, 531년에는 귀족 회의를 이끄는 상대등을 두었다. 관등에 따라 공복 색을 자색·비색·청색·황색으로 나누었는데, 자색을 입는 대아찬 이상은 진골만 오를 수 있었고 6두품은 아찬까지만 오를 수 있었다. 법흥왕 때 세운 울진 봉평리 신라비(524)에는 율령에 따라 죄인에게 곤장을 친 내용이 있어 율령 반포를 뒷받침한다."
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 법흥왕 4년·7년·18년"]

- id: ichadon-527
  year: 527
  endYear: 528
  title:
    ko: 이차돈의 순교와 불교 공인
  summary:
    ko: "이차돈의 순교를 계기로 신라가 불교를 공인했다. 불교는 왕즉불 사상 등으로 왕권 강화를 뒷받침했다. 이보다 앞서 눌지 마립간 때 고구려의 승려 묵호자가 일선군(구미)의 모례 집에 머물며 불교를 전했으나 공인되지는 못했다."
  subjects: [silla]
  tags: [culture, religion]
  sources: ["『삼국사기』 신라본기 법흥왕 15년", "『삼국유사』 원종흥법 염촉멸신"]

- id: geumgwan-532
  year: 532
  title:
    ko: 금관가야 병합
  summary:
    ko: 금관가야의 김구해가 신라 법흥왕에게 항복했다. 신라는 낙동강 하류로 진출했고, 김구해의 후손인 김무력·김유신은 진골 귀족이 되었다.
  subjects: [silla, gaya]
  links:
    - { from: silla, to: gaya, note: "금관가야 병합" }
  tags: [war, politics]
  sources: ["『삼국사기』 신라본기 법흥왕 19년"]

- id: geonwon-536
  year: 536
  title:
    ko: 신라의 '건원' 연호 사용
  summary:
    ko: 법흥왕이 처음으로 '건원'이라는 독자적인 연호를 써서 중국과 대등한 국가임을 나타냈다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 법흥왕 23년"]

- id: sabi-538
  year: 538
  title:
    ko: 성왕의 사비 천도
  summary:
    ko: "백제 성왕이 도읍을 사비(부여)로 옮기고 국호를 남부여로 바꾸었다. 중앙에 22부의 관청을 두고 수도를 5부, 지방을 5방으로 정비했다. 귀족들은 호암사의 정사암이라는 바위에서 재상을 뽑았다고 전한다(정사암 회의). 사비 도읍기에 세운 부여 정림사지 5층 석탑은 목탑 양식을 이은 백제 석탑으로, 백제 멸망 뒤 당의 소정방이 여기에 백제 정벌을 기념하는 글을 새겼다."
  subjects: [baekje]
  tags: [politics]
  sources: ["『삼국사기』 백제본기 성왕 16년"]

- id: guksa-545
  year: 545
  title:
    ko: 거칠부의 『국사』 편찬
  summary:
    ko: 신라 진흥왕이 거칠부에게 역사서 『국사』를 편찬하게 했다.
  subjects: [silla]
  tags: [culture]
  sources: ["『삼국사기』 신라본기 진흥왕 6년"]

- id: han-river-551
  year: 551
  title:
    ko: 나제 연합의 한강 유역 회복
  summary:
    ko: "백제 성왕과 신라 진흥왕이 함께 고구려를 공격해 백제는 한강 하류의 6군을, 신라는 한강 상류의 10군을 차지했다. 신라는 단양 적성비를 세워 이 지역의 민심을 달랬다. 이 무렵 대가야의 우륵이 가야금을 가지고 신라로 망명했다. 진흥왕은 이 해부터 '개국'이라는 연호를 썼다."
  subjects: [baekje, silla, goguryeo]
  links:
    - { from: baekje, to: goguryeo, note: "한강 하류 6군 탈환" }
