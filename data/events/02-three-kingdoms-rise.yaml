  sources: ["『삼국사기』 신라본기 진흥왕 12년", "『삼국사기』 열전 거칠부", "단양 신라 적성비"]

- id: buddhism-japan-552
  year: 552
  title:
    ko: 백제의 불교 일본 전파
  summary:
    ko: "백제 성왕이 노리사치계를 보내 왜에 불상과 불경을 전했다. 아직기·왕인(한문, 『논어』·『천자문』) 등에 이어 백제는 왜의 고대 문화 발전에 큰 영향을 주었다. 무령왕 때(513) 오경박사 단양이를 보낸 뒤로 백제는 오경박사·역박사·의박사 등을 교대로 왜에 보내 유학·역법·의학을 전했다."
  subjects: [baekje, wa]
  links:
    - { from: baekje, to: wa, note: "불교 전파" }
  tags: [culture, religion]
  sources: ["『일본서기』 긴메이 13년"]

