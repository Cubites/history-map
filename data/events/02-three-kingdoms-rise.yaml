- id: geunchogo-369
  year: 369
  title:
    ko: 근초고왕의 마한 정복
  summary:
    ko: 백제 근초고왕이 마한의 남은 세력을 정복해 전라도 남해안까지 영토를 넓히고, 가야에 영향력을 행사했다. 같은 해 치양에서 고구려군을 물리쳤다. 영산강 유역은 이때 백제가 차지했다고 보는 교과서의 견해와 달리 대형 옹관묘를 쓰는 독자적인 문화가 5세기 말까지 이어져 마한 세력이 남아 있었다고 보는 견해도 있어, 지도는 영산강 유역을 369년부터 498년 무렵까지 귀속 논쟁 지역으로 그린다.
  subjects: [baekje, mahan, gaya, goguryeo, yeongsan-disputed]
  links:
