- id: daegaya-falls-562
  year: 562
  title:
    ko: 대가야 멸망
  summary:
    ko: "신라 진흥왕이 이사부와 사다함을 보내 대가야를 정복했다. 가야 연맹이 완전히 사라지고 신라가 낙동강 유역 전체를 차지했다. 가야는 끝내 여러 소국의 연맹 단계에 머물러 중앙 집권 국가로 성장하지 못한 채 백제와 신라의 압박 속에 흡수되었다."
