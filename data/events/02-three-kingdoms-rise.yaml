- id: geonwon-536
  year: 536
  title:
    ko: 신라의 '건원' 연호 사용
  summary:
    ko: 법흥왕이 처음으로 '건원'이라는 독자적인 연호를 써서 중국과 대등한 국가임을 나타냈다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 법흥왕 23년"]

- id: sabi-538
  year: 538
  title:
    ko: 성왕의 사비 천도
  summary:
    ko: 백제 성왕이 도읍을 사비(부여)로 옮기고 국호를 남부여로 바꾸었다. 중앙에 22부의 관청을 두고 수도를 5부, 지방을 5방으로 정비했다.
  subjects: [baekje]
  tags: [politics]
  sources: ["『삼국사기』 백제본기 성왕 16년"]

- id: guksa-545
  year: 545
  title:
    ko: 거칠부의 『국사』 편찬
  summary:
    ko: 신라 진흥왕이 거칠부에게 역사서 『국사』를 편찬하게 했다.
  subjects: [silla]
  tags: [culture]
  sources: ["『삼국사기』 신라본기 진흥왕 6년"]

- id: han-river-551
  year: 551
  title:
    ko: 나제 연합의 한강 유역 회복
  summary:
    ko: 백제 성왕과 신라 진흥왕이 함께 고구려를 공격해 백제는 한강 하류의 6군을, 신라는 한강 상류의 10군을 차지했다. 신라는 단양 적성비를 세워 이 지역의 민심을 달랬다. 이 무렵 대가야의 우륵이 가야금을 가지고 신라로 망명했다.
