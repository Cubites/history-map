  title:
    ko: 고구려 건국
  summary:
    ko: 부여에서 내려온 주몽이 졸본(환인)에서 고구려를 세웠다. 5부족 연맹체로 출발했으며, 산간 지역이라 식량이 부족해 주변 지역을 정복하며 성장했다.
  subjects: [goguryeo, buyeo]
  links:
