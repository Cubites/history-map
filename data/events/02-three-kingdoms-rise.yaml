  year: 532
  title:
    ko: 금관가야 병합
  summary:
    ko: 금관가야의 김구해가 신라 법흥왕에게 항복했다. 신라는 낙동강 하류로 진출했고, 김구해의 후손인 김무력·김유신은 진골 귀족이 되었다.
