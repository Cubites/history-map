- id: three-kingdoms-buddha-501
  year: 501
  endYear: 650
  precision: century
  title:
    ko: "삼국의 불상 (연가 7년명 불상·서산 마애 삼존상·반가 사유상)"
  summary:
    ko: "경남 의령에서 나온 금동 연가 7년명 여래 입상은 광배 뒷면에 고구려에서 만들었다는 글이 새겨져 있어, 고구려 불상이 신라 땅까지 전해졌음을 보여 준다. 충남 서산 용현리의 마애 여래 삼존상은 바위에 새긴 부처의 부드러운 웃음 때문에 '백제의 미소'로 불린다. 생각에 잠긴 모습의 금동 미륵보살 반가 사유상은 삼국 불상을 대표하는 작품이며, 일본 고류사의 목조 반가 사유상과 매우 닮아 삼국의 불교 문화가 일본에 영향을 주었음을 보여 준다."
  subjects: [goguryeo, baekje, silla]
  tags: [culture]
  sources: ["금동 연가7년명 여래입상 광배 명문", "국가유산청 국가유산포털 '서산 용현리 마애여래삼존상' 해설", "국립중앙박물관 금동 반가사유상 해설"]

- id: hwangnyongsa-553
  year: 553
  endYear: 574
  title:
    ko: "황룡사 창건"
  summary:
    ko: "진흥왕이 월성 동쪽에 새 궁궐을 짓다가 그곳에 황룡이 나타나자 절로 고쳐 짓게 하고 황룡사라 이름 붙였다(553). 절은 566년에 완공되었고, 574년에는 구리 3만 5천여 근을 들여 장육존상을 만들었다. 장육존상은 선덕여왕 때의 9층 목탑, 진평왕의 천사옥대와 함께 신라의 세 보물로 일컬어졌다. 진흥왕은 고구려에서 온 승려 혜량을 승통으로 삼아 교단을 정비하는 등 불교로 왕권을 뒷받침하려 했다."
  subjects: [silla]
  tags: [culture, politics]
  sources: ["『삼국사기』 신라본기 진흥왕 14년·27년·35년", "『삼국사기』 열전 거칠부", "『삼국유사』 탑상 황룡사장육"]

- id: neungsansa-567
  year: 567
  title:
    ko: "능산리 절터와 백제 금동대향로"
  summary:
    ko: "위덕왕 때 사비 도성의 동쪽 나성 바깥, 왕릉이 모인 능산리에 절을 세웠다. 목탑 터에서 나온 석조 사리감에 창왕(위덕왕) 13년 정해년(567)에 공주가 사리를 모셨다는 글이 새겨져 있어, 관산성 전투에서 전사한 성왕의 명복을 빌던 왕실 사찰로 본다. 1993년 이 절터에서 발굴된 백제 금동대향로는 용이 받친 연꽃 위에 신선이 사는 산과 악사, 봉황을 정교하게 새겨 불교와 도교 사상이 어우러진 백제 공예의 걸작으로 꼽힌다."
  subjects: [baekje]
  tags: [culture]
  sources: ["부여 능산리 사지 창왕명 석조 사리감 명문", "국립부여박물관 백제 금동대향로 해설"]

- id: jinpyeong-581
  year: 581
  endYear: 591
  title:
    ko: "진평왕의 관청 정비와 남산신성비"
  summary:
    ko: "진평왕이 관리의 인사를 맡는 위화부를 처음 두었다(581). 이어 공물과 부세를 맡는 조부, 수레를 맡는 승부(584), 의례를 맡는 예부(586)를 설치해 중앙 관청을 늘렸고, 584년에는 '건복'이라는 연호를 썼다. 591년에는 경주 남산에 신성을 쌓으면서 지방민을 동원하고, 쌓은 성이 3년 안에 무너지면 벌을 받겠다는 맹세를 새긴 남산신성비를 세웠다."
  subjects: [silla]
  tags: [politics, society]
  sources: ["『삼국사기』 신라본기 진평왕 3년·6년·8년·13년", "『삼국사기』 잡지 직관 상", "경주 남산신성비"]

- id: goguryeo-tax-581
  year: 581
  endYear: 600
  precision: century
  title:
    ko: "고구려의 조세 제도"
  summary:
    ko: "『수서』에 따르면 고구려는 사람마다 베 5필과 곡식 5섬을 세금으로 거두고, 유인(遊人)은 3년에 한 번 10명이 함께 고운 베 1필을 내게 했다. 조(租)는 집(호)을 재산에 따라 상·중·하로 나누어 1섬·7말·5말씩 거두었다. 삼국은 이처럼 곡물과 베를 거두는 조세와 함께 지역 특산물을 공물로 받고, 15세 이상의 백성을 성과 저수지를 쌓는 일에 동원했다."
  subjects: [goguryeo]
  tags: [economy]
  sources: ["『수서』 동이전 고려조", "『주서』 이역전 고려조"]
