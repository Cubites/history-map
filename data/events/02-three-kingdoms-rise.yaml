- id: former-qin-351
  year: 351
  endYear: 376
  title:
    ko: 저족 부건의 전진과 부견의 화북 통일
  summary:
    ko: "저족 출신 부건이 351년 후조가 무너진 혼란 속에 장안에서 천왕을 칭해 전진이 섰고 이듬해 황제를 칭했다. 부건(재위 351~355)과 부생(355~357)을 거쳐 357년 즉위한 부견은 왕맹을 등용해 나라를 정비하고, 370년 전연을, 376년 전량과 대(代)를 차례로 멸망시켜 화북을 통일했다. 전연의 태부 모용평이 고구려로 달아나자 고구려는 그를 붙잡아 전진에 보냈다(370). 전진은 372년 고구려 소수림왕에게 승려 순도와 불상을 보냈고(`sosurim-372`), 382년에는 신라도 고구려를 통해 전진에 사신을 보냈다(`naemul-356`). 지도는 전진을 351~369년에는 관중 등 서북부, 370년부터 화북 전체로 그린다."
  subjects: [former-qin, former-yan, goguryeo, silla]
  links:
    - { from: former-qin, to: former-yan, note: "전연 멸망(370)" }
    - { from: former-qin, to: goguryeo, note: "승려 순도와 불상(372)" }
  tags: [politics, war]
  sources: ["『진서』 부건재기·부견재기", "『삼국사기』 고구려본기 고국원왕 40년", "『자치통감』 진기"]

