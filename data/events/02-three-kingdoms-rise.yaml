  sources: ["『삼국사기』 고구려본기 미천왕 12년·14년·15년"]
  places: [{ name: "낙랑군", at: [125.75, 38.98] }]

- id: tuyuhun-329
  year: 329
  title:
    ko: 선비 모용부에서 갈라진 토욕혼
  summary:
    ko: "토욕혼은 선비 모용부 우두머리 모용섭귀의 서자로 모용외의 서형이다. 아버지가 죽은 뒤 두 부의 말이 싸운 일로 모용외와 틀어져 서쪽으로 떠나 음산에 의지했다가 영가 연간(307~313)의 혼란 무렵 농산을 넘어 서쪽으로 옮겨 갔다고 『진서』는 전한다. 그 무리는 칭하이 일대에 자리를 잡았고, 아들 토연을 거쳐 손자 엽연(재위 329~351)이 '공손의 아들은 할아버지의 자(字)를 씨로 삼을 수 있다'는 예에 따라 토욕혼을 씨(나라 이름)로 삼았다. 지도는 엽연이 즉위한 329년부터 칭하이호 일대를 토욕혼으로 그린다. 서역으로 가는 길목을 쥐고 번영한 이 나라는 수 양제(609)와 당 태종(635)에게 눌렸고 663년 토번에 멸망했다. 수와 당은 고구려를 치기 전에 서쪽의 토욕혼부터 쳤다(`tang-borders-618`, `tibet-tuyuhun-662`)."
  subjects: [xianbei, tuyuhun, goguryeo]
  tags: [politics]
  sources: ["『진서』 사이열전 토욕혼", "『구당서』 토욕혼전"]

- id: former-yan-337
  year: 337
  endYear: 352
  title:
    ko: 모용황의 연왕 칭호와 전연의 화북 진출
  summary:
    ko: "선비 모용부는 모용외 때 요서에 자리를 잡았고, 모용외가 333년 죽자 아들 모용황이 이었다. 모용황은 337년(함강 3년) 연왕을 칭해 전연을 세웠고, 341년 용성을 쌓기 시작해 342년 도읍을 옮겼고 그해 겨울 고구려를 쳐 환도성을 함락했으며(`former-yan-342`), 346년에는 아들 모용준을 보내 부여를 쳤다. 모용황이 348년 죽고 모용준이 이어, 후조가 무너진 틈을 타 350년 계(지금의 베이징)를 차지하고 352년 염위를 멸망시킨 뒤 황제를 칭했다. 지도는 전연을 337~351년에는 요서·요동만, 352년부터 하북까지 그린다. 전연은 357년 업으로 도읍을 옮겼고, 모용준이 360년 죽은 뒤 아들 모용위가 이었으나 370년 전진에 멸망했다."
  subjects: [xianbei, former-yan, goguryeo, buyeo, former-qin]
  links:
    - { from: former-yan, to: goguryeo, note: "환도성 함락(342)" }
    - { from: former-yan, to: buyeo, note: "부여 공격(346)" }
  tags: [politics, war]
  sources: ["『진서』 모용황재기·모용준재기", "『자치통감』 진기"]

