- id: jinheung-stele-555
  year: 555
  endYear: 568
  title:
    ko: 진흥왕 순수비
  summary:
    ko: 진흥왕이 넓힌 영토를 돌아보며 북한산비(555), 창녕비(561), 황초령비·마운령비(568)를 세웠다. 신라는 함경도 남부까지 진출했다. 북한산비는 조선 후기 김정희가 진흥왕 순수비임을 밝혔다.
  subjects: [silla]
  tags: [culture, politics]
