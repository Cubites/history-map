    ko: 상대등 설치와 화백 회의
  summary:
    ko: 법흥왕이 귀족 회의를 이끄는 최고 관직인 상대등을 두었다. 신라의 귀족들은 화백 회의에서 나라의 중요한 일을 만장일치로 결정했으며, 왕의 즉위와 폐위에도 영향을 주었다.
