- id: wa-gold-seal-57
  year: 57
  title:
    ko: 후한 광무제가 왜의 노국왕에게 금인을 내림
  summary:
    ko: "『후한서』에 따르면 57년 왜의 노국이 후한에 사신을 보내 조공하자 광무제가 인수(도장과 끈)를 내렸다. 1784년 일본 후쿠오카현 시카노시마에서 '한위노국왕(漢委奴國王)'이라 새긴 금도장이 나와 이 기록과 이어진다. 107년에는 왜국왕 수승 등이 생구(노비) 160명을 바치고 알현을 청했다. 『후한서』는 무제가 조선을 멸망시킨 뒤 한과 사신을 주고받은 왜의 나라가 30여 곳이라고도 적는다. 이 무렵 변한은 철을 낙랑과 왜에 수출했다(`samhan`). 지도는 왜를 57년부터 그린다."
  subjects: [eastern-han, wa]
  links:
    - { from: eastern-han, to: wa, note: "광무제의 금인 하사(57)" }
  tags: [diplomacy]
  sources: ["『후한서』 광무제기·동이열전 왜", "시카노시마 금인(후쿠오카시박물관 소장)"]

- id: xiongnu-north-91
  year: 89
  endYear: 91
  title:
    ko: 북흉노의 서쪽 이동과 선비의 초원 장악
  summary:
    ko: "흉노는 48년 남북으로 갈라졌고 남흉노는 후한에 붙었다. 후한 화제 때 대장군 두헌이 89년 계락산에서 북흉노를 크게 무찔렀고, 91년 우교위 경기가 금미산에서 북선우를 쳐 북선우가 달아나 행방을 알 수 없게 되자(서쪽으로 옮겨 갔다고 본다) 선비가 그 땅으로 옮겨 왔다. 『후한서』는 남은 흉노 10여만 락도 스스로 선비라 불러 선비가 점차 강성해졌다고 적는다. 2세기 후반 단석괴는 흉노의 옛 땅을 모두 차지했다고 하며 광화 연간(178~184)에 마흔다섯 살로 죽었다. 지도는 흉노를 90년까지로 두고 91년부터 몽골 초원을 선비로 그린다. 선비는 뒤에 요서·요동으로도 내려와 부여와 고구려를 압박했다(`buyeo-xianbei-285`, `former-yan-342`)."
  subjects: [xiongnu, xianbei, eastern-han, goguryeo, buyeo]
  links:
    - { from: eastern-han, to: xiongnu, note: "북흉노 격파(89~91)" }
  tags: [war]
  sources: ["『후한서』 화제기·남흉노열전·오환선비열전", "『삼국지』 위서 오환선비동이전 선비"]

- id: taejo-liaodong-105
  year: 105
  endYear: 107
  title:
    ko: 태조왕의 요동 공격과 현도군의 이동
  summary:
    ko: "고구려 태조왕이 한의 요동에 쳐들어가 6현을 약탈했으나 요동 태수 경기에게 격파되었다. 고구려의 압박이 거세지자 한은 107년 무렵 현도군을 신빈 일대에서 서쪽 무순 방면으로 물리고(제3현도군), 요동군의 고현·후성·요양현을 떼어 현도군에 붙였다. 고구려는 이 뒤에도 118년 예맥과 함께 현도를 치는 등 요동·현도를 계속 공격했다."
  subjects: [goguryeo, eastern-han, hyeondo]
  links:
    - { from: goguryeo, to: eastern-han, note: "요동 6현 약탈" }
    - { from: goguryeo, to: hyeondo, note: "압박, 현도군 이동" }
  tags: [war]
  sources: ["『후한서』 동이열전 고구려", "『삼국사기』 고구려본기 태조대왕 53년·66년", "『후한서』 군국지 현도군"]

- id: jindaebeop-194
  year: 194
  title:
    ko: 고국천왕의 진대법
  summary:
    ko: 을파소의 건의로 봄에 곡식을 빌려주고 가을에 갚게 하는 진대법을 실시해 농민이 노비가 되는 것을 막았다. 고국천왕 때 부족적 5부가 행정적 5부로 바뀌고 왕위의 부자 상속이 확립되었다.
  subjects: [goguryeo]
  tags: [economy, politics]
  sources: ["『삼국사기』 고구려본기 고국천왕 16년"]

- id: cao-cao-wuhuan-207
  year: 206
  endYear: 207
  title:
    ko: 조조의 오환 정벌과 선비, 요동의 공손씨
  summary:
    ko: "후한 말 요서의 오환은 원소와 손잡았고, 원소가 죽자(202) 그 아들 원상·원희는 조조에게 쫓겨 205년 오환의 답돈에게 몸을 의탁했다. 조조가 북쪽으로 원정해 207년 8월 백랑산에서 답돈을 베고 오환을 무찔러, 항복한 무리를 중원으로 옮기고 오환 기병을 군대에 넣었다. 요동으로 달아난 원상·원희는 공손강이 목을 베어 조조에게 보냈다. 지도는 오환을 206년까지 그리고 207년부터 그 땅(요서 북쪽)을 선비로 그린다. 요동의 공손씨는 건안 연간(공손강이 요동을 이은 204년 무렵 이후)에 낙랑군 남쪽에 대방군을 두어 한반도 서북부까지 다스렸으며, 238년 위의 사마의에게 멸망했다."
  subjects: [wuhuan, xianbei, eastern-han, nangnang]
  links:
    - { from: eastern-han, to: wuhuan, note: "조조의 오환 정벌(207)" }
  tags: [war]
  sources: ["『삼국지』 위서 무제기·오환선비동이전 오환", "『후한서』 오환선비열전", "『삼국지』 위서 동이전 한"]

