# ── 4세기: 고구려의 도약과 백제의 전성기 ────────────────

- id: yongjia-eastern-jin-311
  year: 311
  endYear: 317
  title:
    ko: 영가의 난과 서진의 멸망, 동진의 성립
  summary:
    ko: "서진은 혜제 때 팔왕의 난(291~306)으로 약해졌고, 흉노 출신 유연이 304년 한(漢, 뒤의 전조)을 세워 맞섰다. 311년 한군이 낙양을 함락해 회제를 사로잡았고(영가의 난), 회제가 죽은(313) 뒤 장안에서 이은 민제가 316년 항복해 서진이 멸망했다. 이듬해 317년 낭야왕 사마예가 건강(난징)에서 진왕에 올랐고 318년 황제(동진 원제)가 되었다. 화북에는 북방 민족의 나라가 번갈아 서는 오호십육국 시대가 이어졌다. 이 혼란 속에 고구려 미천왕이 낙랑군을 몰아냈고(`michcheon-313`), 요서의 선비 모용부는 영가 초 요동의 반란을 눌러 요동군을 세웠고, 평주자사 최비가 고구려·우문부·단부와 짜고 맞서다 고구려로 달아난 319년 무렵 요동 지배를 굳혔다. 지도는 317~336년의 요서·요동을 선비(모용부)로 그린다."
  subjects: [western-jin, eastern-jin, xianbei, goguryeo, nangnang]
  tags: [politics]
  sources: ["『진서』 회제기·민제기·원제기·모용외재기", "『자치통감』 진기", "『삼국사기』 고구려본기 미천왕"]

- id: michcheon-313
  year: 313
  title:
    ko: 미천왕의 낙랑군 축출
  summary:
    ko: 고구려 미천왕이 낙랑군을 몰아내 대동강 유역을 차지했다. 이듬해 대방군도 몰아내어 한 군현이 한반도에서 사라졌다. 앞서 311년에는 요동의 서안평을 차지했다. 낙랑군 동쪽 해안의 동예는 멸망 시기가 분명하지 않으나 지도는 313년 무렵 고구려에 흡수된 것으로 그린다.
  subjects: [goguryeo, nangnang, western-jin, dongye]
  links:
