- id: northern-yan-407
  year: 407
  endYear: 409
  title:
    ko: 후연의 멸망과 북연의 성립
  summary:
    ko: "모용보(396~398)·모용성(398~401)을 거쳐 즉위한 후연의 마지막 황제 모용희(재위 401~407)가 용성에서 407년 정변으로 죽자 풍발 등이 고운을 천왕으로 세워 나라 이름을 연(북연)이라 했다. 고운은 『진서』에 '고구려의 지서(支庶)'로 적힌 고구려계 사람으로, 후연의 모용보에게 양자로 들어가 모용운이라 불렸다. 409년 고운이 측근에게 살해되자 풍발이 천왕에 올랐고(재위 409~430), 그 동생 풍홍(재위 430~436)이 이었다. 북연의 성립을 풍발이 즉위한 409년으로 보기도 하나 지도는 407년부터 그린다. 북연은 436년 북위의 공격으로 무너지고 풍홍은 고구려로 망명했다(`northern-yan-436`)."
  subjects: [later-yan, northern-yan, goguryeo, northern-wei]
  tags: [politics]
  sources: ["『진서』 모용희재기·모용운재기", "『위서』 해이풍발전", "『자치통감』 진기 의희 3년·5년"]

- id: gwanggaeto-stele-414
  year: 414
  title:
    ko: 광개토대왕릉비 건립
  summary:
    ko: "장수왕이 아버지 광개토대왕의 업적을 기려 국내성(지안)에 비를 세웠다. 고구려의 건국 신화와 광개토대왕의 정복 활동이 새겨져 있다. 비문 끝부분에는 왕릉을 지키는 수묘인의 수와 관리 규정을 적었다. 이른바 신묘년(391) 기사는 일본이 임나일본부설의 근거로 내세웠으나, 글자 판독과 해석을 두고 논란이 이어지고 있다."
  subjects: [goguryeo]
  tags: [culture]
  sources: ["광개토대왕릉비"]

- id: liu-song-420
  year: 420
  endYear: 421
  title:
    ko: 동진에서 송으로, 고구려·백제·왜의 책봉
  summary:
    ko: "420년 동진의 공제(재위 418~420)가 유유(송 무제, 재위 420~422)에게 선양해 동진이 끝나고 송(남조)이 섰다. 『송서』에 따르면 송 무제는 즉위하자 주변국 왕의 관작을 올려, 고구려 장수왕(『송서』의 고련)을 정동장군에서 정동대장군으로, 백제 전지왕(여영)을 진동장군에서 진동대장군으로 높였다(전지왕의 죽음을 『삼국사기』는 420년이라 하나 『송서』 백제국전에는 여영이 424년(소제 경평 2년) 사신을 보내고 425년 문제(재위 424~453)가 진동대장군 백제왕 여영에게 조서를 내린 것으로 나와 연대에 이견이 있다). 421년에는 왜왕 찬에게도 관작을 내렸는데, 이때부터 왜의 다섯 왕이 송에 사신을 보냈다. 고구려는 뒤에 북위와 송 양쪽에 사신을 보내 균형을 잡았다(`pyongyang-427`)."
  subjects: [eastern-jin, liu-song, goguryeo, baekje, wa, northern-wei]
  links:
    - { from: liu-song, to: goguryeo, note: "장수왕을 정동대장군에 올림(420)" }
    - { from: liu-song, to: baekje, note: "전지왕을 진동대장군에 올림(420)" }
    - { from: liu-song, to: wa, note: "왜왕 찬에게 관작(421)" }
  tags: [diplomacy]
  sources: ["『송서』 무제기·이만전 고구려국·백제국·왜국", "『삼국사기』 백제본기 전지왕 16년"]

- id: pyongyang-427
  year: 427
  title:
    ko: 장수왕의 평양 천도
  summary:
    ko: 장수왕이 도읍을 국내성에서 평양으로 옮기고 남진 정책을 폈다. 북위와 남조 송에 모두 사신을 보내는 양면 외교로 중국을 견제했다.
  subjects: [goguryeo, northern-wei, liu-song]
  links:
    - { from: goguryeo, to: northern-wei, note: "사신 파견" }
    - { from: goguryeo, to: liu-song, note: "사신 파견" }
  tags: [politics, diplomacy]
  sources: ["『삼국사기』 고구려본기 장수왕 15년"]

- id: najae-alliance-433
  year: 433
  title:
    ko: 나제 동맹
  summary:
    ko: 고구려의 남진에 맞서 신라 눌지왕과 백제 비유왕이 동맹을 맺었다. 눌지왕 때 신라는 왕위의 부자 상속을 확립하고 고구려의 간섭에서 벗어나려 했다.
  subjects: [silla, baekje, goguryeo]
  links:
    - { from: baekje, to: silla, note: "동맹 요청" }
    - { from: silla, to: baekje, note: "동맹 수락" }
  tags: [diplomacy]
  sources: ["『삼국사기』 신라본기 눌지 마립간 17년", "『삼국사기』 백제본기 비유왕 7년"]

- id: northern-yan-436
  year: 436
  title:
    ko: 북연 왕 풍홍의 고구려 망명
  summary:
    ko: 북위의 공격을 받은 북연의 왕 풍홍이 고구려로 망명했다. 북연이 멸망하면서 북위가 화북을 통일해 가는 가운데, 장수왕은 북위와 맞서지 않으면서 실리를 챙겼다.
  subjects: [goguryeo, northern-yan, northern-wei]
  links:
    - { from: northern-wei, to: northern-yan, note: "북연 정복" }
    - { from: northern-yan, to: goguryeo, note: "풍홍의 망명" }
  tags: [diplomacy]
  sources: ["『삼국사기』 고구려본기 장수왕 24년", "『위서』"]

- id: northern-wei-439
  year: 439
  title:
    ko: 북위 태무제의 화북 통일과 남북조 시대
  summary:
    ko: "선비 탁발부의 북위는 탁발규(도무제) 때 섰고, 명원제(재위 409~423)를 거쳐 태무제 탁발도(재위 423~452) 때 전성기를 맞았다. 태무제는 427년 하(夏)의 도읍 통만성을 빼앗고(하는 431년 멸망) 429년 막북으로 나아가 유연을 크게 무찔렀으며, 436년 북연을 무너뜨리고(`northern-yan-436`) 439년 북량을 멸망시켜 화북을 통일했다. 이로써 강남의 송과 맞서는 남북조 대치가 이루어졌다(남북조 시대의 시작을 송이 선 420년으로 보기도 한다). 고구려 장수왕은 북위와 송 양쪽에 사신을 보내며 평양 천도(427) 뒤 남쪽으로 힘을 키웠다(`pyongyang-427`). 지도는 북위를 439년부터 화북 전체로 그린다."
  subjects: [northern-wei, liu-song, rouran, goguryeo]
  links:
    - { from: northern-wei, to: rouran, note: "앞서 막북 원정(429)" }
  tags: [politics, war]
  sources: ["『위서』 세조기", "『자치통감』 송기 원가 16년"]

- id: eupru-mulgil-449
  year: 449
  endYear: 475
  title:
    ko: 읍루에서 물길로
  summary:
    ko: "『위서』는 물길을 '고구려 북쪽의 옛 숙신국'이라 하고, 연흥 연간(471~476)에 사신 을력지를 보내 북위에 조공했다고 적는다(물길의 가장 이른 기록). 물길은 읍루를 이은 세력(숙신의 후예)으로 본다. 지도는 이를 앞당겨 읍루를 449년까지, 물길을 450년부터 그린다. 물길은 뒤에 부여를 압박해 494년 부여 왕실이 고구려에 항복하게 했고(`buyeo-falls-494`), 6세기 중엽부터 말갈이라 불렸다(`northern-dynasties-534`)."
  subjects: [eupru, mulgil, northern-wei, goguryeo, buyeo]
  links:
    - { from: mulgil, to: northern-wei, note: "을력지의 조공(연흥 연간)" }
  tags: [society, diplomacy]
  sources: ["『위서』 물길국전", "『삼국지』 위서 동이전 읍루", "『북사』 물길전"]

- id: gaero-letter-472
  year: 472
  title:
    ko: 개로왕의 북위 국서
  summary:
    ko: 백제 개로왕이 북위에 국서를 보내 고구려를 함께 치자고 요청했으나 북위는 응하지 않았다.
  subjects: [baekje, northern-wei, goguryeo]
  links:
    - { from: baekje, to: northern-wei, note: "고구려 공격 요청" }
  tags: [diplomacy]
  sources: ["『삼국사기』 백제본기 개로왕 18년", "『위서』 백제전"]

- id: hanseong-falls-475
  year: 475
  title:
    ko: 한성 함락과 웅진 천도
  summary:
    ko: "장수왕이 백제의 한성을 함락하고 개로왕을 죽였다. 백제 문주왕은 웅진(공주)으로 도읍을 옮겼다. 고구려는 한강 유역을 차지하고 아산만에서 죽령·영일만에 이르는 지역까지 세력을 넓혔다. 충주 고구려비(중원 고구려비)를 이 시기에 세운 것으로 보기도 한다. 충주 고구려비에는 고구려 왕이 신라 왕(매금)과 신하들에게 옷을 내려 주었다는 내용이 있어 두 나라의 상하 관계를 보여 준다. 다만 비를 세운 때는 5세기 중엽설과 후반설 등으로 학설이 갈린다. 섬진강 유역(남원·장수·구례·순천 등 호남 동부)에서는 5세기 후반의 대가야 양식 무덤이 나와 이곳이 대가야의 세력권이었다고 보는 견해가 있고 백제 영역으로 보는 견해도 있어, 지도는 475년부터 512년까지 귀속 논쟁 지역으로 그린다."
  subjects: [goguryeo, baekje, silla, seomjin-disputed, gaya]
  links:
    - { from: goguryeo, to: baekje, note: "한성 함락, 개로왕 전사" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 장수왕 63년", "『삼국사기』 백제본기 개로왕 21년·문주왕 원년", "충주 고구려비"]
  places: [{ name: "한성", at: [127.12, 37.52] }]

