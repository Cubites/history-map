- id: southern-dynasties-479
  year: 479
  endYear: 502
  title:
    ko: 남조의 송·제·양 교체와 고구려·백제·대가야의 책봉
  summary:
    ko: "479년 소도성이 송 순제의 선양을 받아 제를 세웠고, 502년 소연(양 무제)이 제의 선양을 받아 양을 세웠다. 새 왕조는 즉위하면 주변국 왕에게 관작을 내려 주었다. 제는 고구려 장수왕을 표기대장군에 올렸고(『남제서』는 479년, 『삼국사기』는 480년으로 적는다. 대가야의 하지도 479년 남제에 사신을 보내 관작을 받았다), 양은 고구려 문자명왕과 백제 왕의 관작을 높여 주었다(502, 백제의 동성왕은 이미 501년에 죽은 뒤였다). 고구려와 백제는 남조와 함께 북위에도 사신을 보내 외교의 균형을 잡았다."
  subjects: [liu-song, southern-qi, liang, northern-wei, goguryeo, baekje, gaya]
  links:
