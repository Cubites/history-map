- id: sosurim-372
  year: 372
  endYear: 373
  title:
    ko: 소수림왕의 불교 수용과 체제 정비
  summary:
    ko: "고구려 소수림왕이 전진에서 온 승려 순도를 통해 불교를 받아들이고, 국립 교육 기관인 태학을 세웠다. 이듬해 율령을 반포해 국가 체제를 정비했다. 지방에는 청소년이 글을 읽고 활쏘기를 익히던 경당이 있었다고 중국 역사서에 전하나, 세운 시기는 분명하지 않다."
  subjects: [goguryeo, former-qin]
  links:
