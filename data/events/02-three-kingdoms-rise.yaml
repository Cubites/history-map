- id: northern-dynasties-534
  year: 534
  endYear: 560
  title:
    ko: 북위의 분열과 동위·서위, 북제·북주의 성립
  summary:
    ko: "534년 북위 효무제가 실권자 고환을 피해 우문태에게 달아나자 고환이 효정제를 세워 업으로 옮기면서 동위가 섰고, 이듬해 우문태가 문제를 세워 서위가 되었다(535). 동위는 550년 고양(북제 문선제)에게, 서위는 557년 우문각(북주 효민제)에게 넘어가 북제와 북주가 되었다. 남조에서는 후경의 난(548~552)을 겪은 양이 554년 서위에 강릉을 빼앗기고 원제가 죽었으며(서위는 그 땅에 서량(後梁)을 세웠다) 557년 진패선에게 선양해 진이 섰다. 고구려는 동위와 북제에도 사신을 보냈다. 동북의 물길은 6세기 중엽부터 말갈이라는 이름으로 북제에 조공했다(지도는 560년부터 말갈로 그린다)."
  subjects: [northern-wei, eastern-wei, western-wei, northern-qi, northern-zhou, liang, chen, mulgil, malgal, goguryeo]
