    ko: 신라의 한강 하류 차지
  summary:
    ko: 진흥왕이 백제가 차지한 한강 하류까지 빼앗고 신주를 설치했다. 나제 동맹이 깨졌고, 신라는 서해 당항성을 통해 중국과 직접 교류할 수 있게 되었다.
