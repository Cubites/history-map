  tags: [war]
  sources: ["『삼국사기』 신라본기 진흥왕 23년", "『삼국사기』 열전 사다함"]

- id: northern-qi-565
  year: 565
  title:
    ko: 북제의 진흥왕 책봉
  summary:
    ko: 신라 진흥왕이 북제에 사신을 보내 책봉을 받았다. 한강 유역 확보 이후 신라는 중국 왕조와 직접 교류하기 시작했다.
  subjects: [silla, northern-qi]
  links:
    - { from: silla, to: northern-qi, note: "사신 파견" }
    - { from: northern-qi, to: silla, note: "신라왕 책봉" }
  tags: [diplomacy]
  sources: ["『삼국사기』 신라본기 진흥왕 26년", "『북제서』"]

- id: hwarang-576
  year: 576
  title:
    ko: 화랑도의 국가 조직화
  summary:
    ko: 원화 제도를 고쳐 청소년 수련 단체인 화랑도를 국가 조직으로 개편했다. 계층 간 대립을 조절하고 인재를 길러 삼국 통일의 원동력이 되었다. 뒤에 원광이 세속 5계를 지어 주었다.
  subjects: [silla]
  tags: [society]
  sources: ["『삼국사기』 신라본기 진흥왕 37년"]

- id: sui-unification-589
  year: 589
  title:
    ko: 수의 중국 통일
  summary:
    ko: 북주를 이은 수가 남조의 진을 무너뜨려 약 300년 만에 중국을 통일했다. 수의 팽창은 고구려에 큰 위협이 되었다.
  subjects: [sui, chen]
  links:
    - { from: sui, to: chen, note: "진 정복" }
  tags: [war]
  sources: ["『수서』 고조기"]

