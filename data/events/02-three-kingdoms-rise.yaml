- id: goguryeo-customs-201
  year: 201
  endYear: 300
  precision: century
  title:
    ko: "고구려 초기의 제가 회의와 풍속"
  summary:
    ko: "『삼국지』 위서 동이전에 따르면 초기 고구려에서는 왕 아래 상가·고추가 같은 대가들이 저마다 사자·조의·선인이라는 관리를 거느렸고, 감옥이 없는 대신 중대한 죄인은 제가 회의에서 논의해 사형하고 그 처자를 노비로 삼았다. 해마다 10월에는 동맹이라는 제천 행사를 열고, 나라 동쪽의 큰 굴(수혈)에 모신 수신(隧神)을 맞아 제사했다. 혼인이 정해지면 신부 집 뒤에 서옥이라는 작은 집을 지어 사위가 머물다가 자식이 자라면 아내를 데리고 돌아가는 서옥제가 있었고, 집집마다 부경이라는 작은 창고를 두었다. 산이 많아 농토가 부족했기 때문에 하호가 멀리서 곡식·생선·소금을 날라 와 지배층을 먹여 살렸다."
  subjects: [goguryeo]
  tags: [society, politics]
  sources: ["『삼국지』 위서 동이전 고구려조", "『후한서』 동이열전 고구려"]

- id: gaya-iron-201
  year: 201
  endYear: 562
  precision: century
  title:
    ko: "가야의 철기 문화와 고분군"
  summary:
    ko: "가야는 질 좋은 철을 많이 생산해 덩이쇠를 화폐처럼 쓰고 낙랑·대방과 왜에 수출했으며, 철로 만든 판갑옷·말 투구·무기를 무덤에 많이 껴묻었다. 금관가야 지배층이 묻힌 김해 대성동 고분군과, 여러 사람을 함께 묻은 순장의 흔적이 남은 대가야 왕릉인 고령 지산동 고분군이 대표적이다. 가야 토기는 일본에 전해져 스에키 토기의 발전에 영향을 주었다. 2023년 김해 대성동·함안 말이산·고령 지산동 등 가야 고분군 7곳이 유네스코 세계유산으로 등재되었다."
  subjects: [gaya, wa]
  links:
    - { from: gaya, to: wa, note: "철 수출, 토기 제작 기술 전파" }
  tags: [culture, economy]
  sources: ["『삼국지』 위서 동이전 변진조", "유네스코 세계유산 '가야고분군'(2023 등재)", "국립김해박물관 가야 문화 해설"]

- id: jiaozhi-revolt-263
  year: 263
  endYear: 271
  title:
    ko: 교지의 여흥 반란과 오의 교지 회복
  summary:
    ko: "오는 지금의 광시·광둥과 베트남 북부(교지·구진·일남)를 다스렸다. 263년 교지군의 관리 여흥이 오의 태수 손서를 죽이고 구진과 함께 위에 붙었는데, 오는 이 반란 때문에 같은 해 위가 촉을 칠 때 촉을 돕지 못했다. 위와 그 뒤를 이은 서진은 교지에 관리를 보냈고, 오는 268년부터 군대를 보내 두 번 물러난 끝에 271년 교지의 항구와 큰 고을을 되찾았다. 지도는 촉을 쓰촨·충칭·한중과 남중(윈난·구이저우)까지로, 광시는 내내 오로 그리고, 베트남 북부는 263~270년 위·서진에, 그 앞뒤로는 오에 넣는다."
  subjects: [wu, cao-wei, western-jin, shu]
  links:
    - { from: cao-wei, to: wu, note: "교지의 여흥이 위에 붙음 (263)" }
    - { from: wu, to: western-jin, note: "교지를 되찾음 (271)" }
  tags: [war, politics]
  sources: ["『삼국지』 오서 삼사주전", "『진서』 도황전"]

- id: buyeo-xianbei-285
  year: 285
  title:
    ko: "선비족 모용외의 부여 침입"
  summary:
    ko: "선비족 모용부의 우두머리 모용외가 부여를 기습하자 부여 왕 의려가 스스로 목숨을 끊고, 왕의 자제들은 옥저 지역으로 달아났다. 이듬해 의라가 서진 동이교위의 도움을 받아 나라를 되찾았으나 부여는 크게 약해졌다. 346년에는 전연의 모용황이 세자 모용준을 보내 부여를 쳐서 왕 현과 5만여 명을 사로잡아 갔으며, 이후 쇠퇴를 거듭한 부여는 494년 고구려에 완전히 편입되었다."
  subjects: [buyeo, xianbei, western-jin, goguryeo]
  links:
    - { from: xianbei, to: buyeo, note: "모용외의 기습, 왕 의려 자결" }
    - { from: western-jin, to: buyeo, note: "동이교위가 군대를 보내 의라의 복국 지원" }
  tags: [war]
  sources: ["『진서』 사이열전 부여국", "『자치통감』 진기 영화 2년(346)"]

- id: goguryeo-tombs-301
  year: 301
  endYear: 600
  precision: century
  title:
    ko: "고구려의 돌무지무덤과 고분 벽화"
  summary:
    ko: "고구려는 돌을 쌓아 만든 돌무지무덤을 오래 만들었는데, 다듬은 돌을 7층 계단 모양으로 쌓은 지안(국내성)의 장군총이 대표적이다. 4세기 무렵부터는 돌로 방을 짜고 널길을 낸 뒤 흙으로 덮은 굴식 돌방무덤이 퍼졌다. 이 무덤은 입구가 있어 도굴되기 쉬웠으나 벽과 모줄임 천장에 그린 벽화가 남아, 안악 3호분의 행렬도, 무용총의 사냥 그림(수렵도)과 춤 그림, 각저총의 씨름 그림에서 귀족의 생활과 풍속을 엿볼 수 있다. 후기로 가면 강서대묘의 사신도처럼 도교 색채를 띤 그림이 중심이 되었다."
  subjects: [goguryeo]
  tags: [culture]
  sources: ["안악 3호분 묵서명", "유네스코 세계유산 '고구려 고분군'(2004 등재)", "국사편찬위원회 『신편 한국사』 삼국의 문화"]

- id: silla-tombs-401
  year: 401
  endYear: 550
  precision: century
  title:
    ko: "신라의 돌무지덧널무덤"
  summary:
    ko: "마립간 시기 경주의 왕족과 귀족은 나무 덧널을 놓고 그 둘레와 위에 냇돌을 쌓은 뒤 흙으로 크게 덮은 돌무지덧널무덤을 만들었다. 입구가 없어 도굴이 어려웠기 때문에 금관·금제 허리띠·귀걸이 같은 껴묻거리가 많이 남았다. 천마총에서는 말다래에 그린 천마도가, 황남대총에서는 금관과 서역 계통의 유리그릇이 나와 활발한 대외 교류를 보여 준다. 6세기 중엽 이후에는 고구려·백제처럼 굴식 돌방무덤을 만들게 되었다."
  subjects: [silla]
  tags: [culture]
