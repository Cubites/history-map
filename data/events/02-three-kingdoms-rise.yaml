  tags: [diplomacy, culture]
  sources: ["『삼국사기』 백제본기 무령왕 21년", "『양서』 백제전", "무령왕릉 지석"]

- id: beopheung-520
  year: 517
  endYear: 520
  title:
    ko: 법흥왕의 율령 반포
  summary:
    ko: 신라 법흥왕이 병부를 설치하고(517) 율령을 반포하며 백관의 공복을 정했다(520). 골품제가 정비되고, 531년에는 귀족 회의를 이끄는 상대등을 두었다.
  subjects: [silla]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 법흥왕 4년·7년·18년"]

- id: ichadon-527
  year: 527
  endYear: 528
  title:
    ko: 이차돈의 순교와 불교 공인
  summary:
    ko: 이차돈의 순교를 계기로 신라가 불교를 공인했다. 불교는 왕즉불 사상 등으로 왕권 강화를 뒷받침했다.
  subjects: [silla]
  tags: [culture, religion]
  sources: ["『삼국사기』 신라본기 법흥왕 15년", "『삼국유사』 원종흥법 염촉멸신"]

- id: geumgwan-532
  year: 532
  title:
    ko: 금관가야 병합
  summary:
    ko: 금관가야의 김구해가 신라 법흥왕에게 항복했다. 신라는 낙동강 하류로 진출했고, 김구해의 후손인 김무력·김유신은 진골 귀족이 되었다.
