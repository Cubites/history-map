# 2번 묶음: 삼국의 성립과 발전 (기원전 57 ~ 600)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 2026-10-09(작업 C2): 동아시아 맥락 사건 4개를 더했다(남조의 송·제·양 교체, 백제의 영산강·섬진강 진출, 북위의 분열과 북제·북주, 북주의 화북 통일과 수의 건국). 기존 사건의 연도·subjects도 넓혔다.
# 2026-10-11(작업 G): 476년 전 동아시아 맥락 사건 14개를 더했다(숙신에서 읍루로, 후한의 금인과 왜, 북흉노와 선비, 조조의 오환 정벌, 영가의 난과 동진, 토욕혼, 전연·전진, 비수 전투와 후연·북위, 거란·실위·유연, 북연, 동진에서 송으로, 북위의 화북 통일, 읍루에서 물길로). 기존 사건의 subjects·기간도 넓혔다.
# 연도는 천문 연도: 기원전 57년 = -56. 『삼국사기』는 즉위한 해를 원년으로 센다.
# 광개토대왕 관련 연도는 『삼국사기』보다 1년 앞서는 광개토대왕릉비의 영락 연호를 따른다.
# 600년 이후는 3번 묶음에서 다룬다.

# ── 삼국의 건국 ─────────────────────────────────────────

- id: silla-founded
  year: -56
  title:
    ko: 신라 건국
  summary:
    ko: 박혁거세가 진한의 사로국을 세웠다. 초기에는 박·석·김의 세 성씨가 번갈아 왕위를 이었고, 왕의 칭호는 거서간·차차웅·이사금으로 바뀌었다.
  subjects: [silla, jinhan]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 혁거세 거서간 원년"]

- id: goguryeo-founded
  year: -36
  title:
    ko: 고구려 건국
  summary:
    ko: 부여에서 내려온 주몽이 졸본(환인)에서 고구려를 세웠다. 5부족 연맹체로 출발했으며, 산간 지역이라 식량이 부족해 주변 지역을 정복하며 성장했다. 고구려는 예맥 계통으로 여겨진다(중국 기록은 부여의 별종이라 하고, 압록강 가의 소수맥을 고구려의 한 갈래로 적는다). 지도는 고구려가 선 기원전 37년부터 청천강 북쪽의 평안북도·자강도 일대를 낙랑군에서 고구려로 넘겨 그린다.
  subjects: [goguryeo, buyeo, yemaek, nangnang]
  links:
    - { from: buyeo, to: goguryeo, note: "주몽의 남하" }
  tags: [politics]
  sources: ["『삼국사기』 고구려본기 동명성왕 원년", "광개토대왕릉비", "『삼국지』 위서 동이전 고구려"]

- id: baekje-founded
  year: -17
  title:
    ko: 백제 건국
  summary:
    ko: "고구려에서 내려온 온조가 한강 유역의 위례성에서 백제를 세웠다. 고구려 계통의 유이민과 한강 유역의 토착민이 결합했으며, 건국 초기의 돌무지무덤(서울 석촌동)이 고구려와 비슷하다. 서울 송파의 풍납동 토성과 몽촌토성은 한성 도읍기 백제의 왕성으로 여겨진다."
  subjects: [baekje, goguryeo, mahan]
  links:
    - { from: goguryeo, to: baekje, note: "온조 집단의 남하" }
  tags: [politics]
  sources: ["『삼국사기』 백제본기 온조왕 원년"]

- id: sushen-eupru-0
  year: 0
  endYear: 100
  precision: century
  title:
    ko: 숙신에서 읍루로, 중국 기록에 나오는 예맥
  summary:
    ko: "숙신은 『국어』에서 주 무왕에게 호시와 석노를 바친 만주 동북부의 민족으로 나온다. 『후한서』 동이열전은 같은 곳의 읍루를 '옛 숙신의 나라'라 하고, 부여 동북쪽 천여 리의 바닷가에 살며 한이 일어난 뒤 부여에 복속했다고 적는다(『진서』는 숙신씨를 '일명 읍루'라 한다). 『삼국지』 위서 동이전은 부여가 조세를 무겁게 매기자 읍루가 황초 연간(220~226)에 부여를 배반했다고 전한다. 지도는 숙신을 기원전 1년까지, 읍루를 서기 1년부터 그린다(이름이 바뀐 때가 분명하지 않아 기원전후로 맞춘 근사). 예맥(濊貊)은 중국 기록이 만주 남부와 한반도 북부 사람들을 부른 이름으로, 고조선·부여·고구려·옥저·동예가 예맥 계통으로 여겨진다. 지도는 예맥을 55년까지 그리고, 고구려가 옥저를 정복하고 압록강 유역을 장악하는 56년(`taejo-okjeo-56`)부터 고구려·부여·옥저 바깥의 만주 동부를 읍루의 땅으로 넓혀 그린다."
  subjects: [sushen, eupru, yemaek, buyeo, goguryeo, okjeo, dongye]
  tags: [society]
  sources: ["『국어』 노어하", "『후한서』 동이열전 읍루", "『삼국지』 위서 동이전 읍루", "『진서』 사이열전 숙신씨"]

