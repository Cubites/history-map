# 2번 묶음: 삼국의 성립과 발전 (기원전 57 ~ 600)
# 깊이: 한국사능력검정시험(심화) 수준. 서술은 새로 작성, 출처는 해당 기록이 실린 사료. 운영자 검수 필요.
# 연도는 천문 연도: 기원전 57년 = -56. 『삼국사기』는 즉위한 해를 원년으로 센다.
# 광개토대왕 관련 연도는 『삼국사기』보다 1년 앞서는 광개토대왕릉비의 영락 연호를 따른다.
# 600년 이후는 3번 묶음에서 다룬다.

# ── 삼국의 건국 ─────────────────────────────────────────

- id: silla-founded
  year: -56
  title:
    ko: 신라 건국
  summary:
    ko: 박혁거세가 진한의 사로국을 세웠다. 초기에는 박·석·김의 세 성씨가 번갈아 왕위를 이었고, 왕의 칭호는 거서간·차차웅·이사금으로 바뀌었다.
  subjects: [silla, jinhan]
  tags: [politics]
  sources: ["『삼국사기』 신라본기 혁거세 거서간 원년"]

- id: goguryeo-founded
  year: -36
  title:
    ko: 고구려 건국
  summary:
    ko: 부여에서 내려온 주몽이 졸본(환인)에서 고구려를 세웠다. 5부족 연맹체로 출발했으며, 산간 지역이라 식량이 부족해 주변 지역을 정복하며 성장했다.
  subjects: [goguryeo, buyeo]
  links:
    - { from: buyeo, to: goguryeo, note: "주몽의 남하" }
  tags: [politics]
  sources: ["『삼국사기』 고구려본기 동명성왕 원년", "광개토대왕릉비"]

- id: baekje-founded
  year: -17
  title:
    ko: 백제 건국
  summary:
    ko: 고구려에서 내려온 온조가 한강 유역의 위례성에서 백제를 세웠다. 고구려 계통의 유이민과 한강 유역의 토착민이 결합했으며, 건국 초기의 돌무지무덤(서울 석촌동)이 고구려와 비슷하다.
  subjects: [baekje, goguryeo, mahan]
  links:
    - { from: goguryeo, to: baekje, note: "온조 집단의 남하" }
  tags: [politics]
  sources: ["『삼국사기』 백제본기 온조왕 원년"]

- id: gungnaeseong-3
  year: 3
  title:
    ko: 유리왕의 국내성 천도
  summary:
    ko: 고구려 유리왕이 도읍을 졸본에서 압록강 가의 국내성(지안)으로 옮겼다.
  subjects: [goguryeo]
  tags: [politics]
  sources: ["『삼국사기』 고구려본기 유리명왕 22년"]

- id: gaya-founded
  year: 42
  title:
    ko: 금관가야 건국
  summary:
    ko: 김수로가 김해에서 금관가야를 세웠다고 전한다. 변한의 소국들이 가야 연맹으로 발전했으며, 풍부한 철을 낙랑과 왜에 수출했다.
  subjects: [gaya, byeonhan]
  tags: [politics]
  sources: ["『삼국유사』 가락국기"]

- id: taejo-okjeo-56
  year: 56
  title:
    ko: 고구려 태조왕의 옥저 정복
  summary:
    ko: 태조왕이 동옥저를 정복해 성읍으로 삼았다. 이 무렵 고구려는 계루부 고씨가 왕위를 독점 세습하며 중앙 집권 국가의 기틀을 마련했다.
  subjects: [goguryeo, okjeo]
  links:
    - { from: goguryeo, to: okjeo, note: "정복" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 태조대왕 4년"]

- id: jindaebeop-194
  year: 194
  title:
    ko: 고국천왕의 진대법
  summary:
    ko: 을파소의 건의로 봄에 곡식을 빌려주고 가을에 갚게 하는 진대법을 실시해 농민이 노비가 되는 것을 막았다. 고국천왕 때 부족적 5부가 행정적 5부로 바뀌고 왕위의 부자 상속이 확립되었다.
  subjects: [goguryeo]
  tags: [economy, politics]
  sources: ["『삼국사기』 고구려본기 고국천왕 16년"]

- id: gwanggugeom-244
  year: 244
  endYear: 245
  title:
    ko: 위 관구검의 고구려 침입
  summary:
    ko: 동천왕이 요동의 서안평을 공격하자, 위의 관구검이 쳐들어와 환도성을 함락했다. 동천왕은 옥저 방면으로 피란했고, 밀우·유유의 활약으로 위군을 물리쳤다.
  subjects: [goguryeo, cao-wei]
  links:
    - { from: goguryeo, to: cao-wei, note: "서안평 공격" }
    - { from: cao-wei, to: goguryeo, note: "관구검의 환도성 함락" }
  tags: [war]
  sources: ["『삼국지』 위서 관구검전", "『삼국사기』 고구려본기 동천왕 20년"]

- id: goi-260
  year: 260
  title:
    ko: 백제 고이왕의 체제 정비
  summary:
    ko: 고이왕이 한강 유역을 완전히 장악하고 6좌평과 16관등제를 마련했으며, 관리의 공복을 자주색·붉은색·푸른색으로 정했다.
  subjects: [baekje, mahan]
  tags: [politics]
  sources: ["『삼국사기』 백제본기 고이왕 27년"]

# ── 4세기: 고구려의 도약과 백제의 전성기 ────────────────

- id: michcheon-313
  year: 313
  title:
    ko: 미천왕의 낙랑군 축출
  summary:
    ko: 고구려 미천왕이 낙랑군을 몰아내 대동강 유역을 차지했다. 이듬해 대방군도 몰아내어 한 군현이 한반도에서 사라졌다. 앞서 311년에는 요동의 서안평을 차지했다.
  subjects: [goguryeo, nangnang, western-jin]
  links:
    - { from: goguryeo, to: nangnang, note: "낙랑군 축출" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 미천왕 12년·14년·15년"]

- id: former-yan-342
  year: 342
  title:
    ko: 전연의 고구려 침입
  summary:
    ko: 전연의 모용황이 쳐들어와 환도성을 함락하고 미천왕의 무덤을 파헤쳐 시신과 왕모·왕비를 끌고 갔다.
  subjects: [goguryeo, former-yan]
  links:
    - { from: former-yan, to: goguryeo, note: "환도성 함락" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 고국원왕 12년", "『진서』 모용황재기"]

- id: naemul-356
  year: 356
  title:
    ko: 내물 마립간 즉위
  summary:
    ko: 신라 내물왕이 즉위해 김씨가 왕위를 독점 세습하고, 대군장을 뜻하는 마립간이라는 칭호를 썼다. 진한 지역 대부분을 차지했으며, 382년에는 고구려를 통해 전진에 사신을 보냈다.
  subjects: [silla, jinhan]
  links:
    - { from: silla, to: jinhan, note: "진한 지역 차지" }
  tags: [politics]
  sources: ["『삼국사기』 신라본기 내물 이사금 원년", "『삼국유사』 왕력"]

- id: geunchogo-369
  year: 369
  title:
    ko: 근초고왕의 마한 정복
  summary:
    ko: 백제 근초고왕이 마한의 남은 세력을 정복해 전라도 남해안까지 영토를 넓히고, 가야에 영향력을 행사했다. 같은 해 치양에서 고구려군을 물리쳤다.
  subjects: [baekje, mahan, gaya, goguryeo]
  links:
    - { from: baekje, to: mahan, note: "마한 정복" }
    - { from: baekje, to: gaya, note: "가야에 영향력 행사" }
    - { from: goguryeo, to: baekje, note: "고구려의 침입 (치양)" }
  tags: [war]
  sources: ["『일본서기』 신공기 49년", "『삼국사기』 백제본기 근초고왕 24년"]

- id: pyongyang-371
  year: 371
  title:
    ko: 백제의 평양성 공격과 고국원왕 전사
  summary:
    ko: 근초고왕과 태자 근구수가 고구려 평양성을 공격해 고국원왕을 전사시켰다. 백제는 황해도 일부까지 차지했다.
  subjects: [baekje, goguryeo]
  links:
    - { from: baekje, to: goguryeo, note: "평양성 공격, 고국원왕 전사" }
  tags: [war]
  sources: ["『삼국사기』 백제본기 근초고왕 26년", "『삼국사기』 고구려본기 고국원왕 41년"]

- id: geunchogo-diplomacy-372
  year: 372
  endYear: 375
  title:
    ko: 근초고왕의 대외 교류와 칠지도
  summary:
    ko: 근초고왕이 동진에 사신을 보내고, 요서·산둥 방면과 왜로 이어지는 교역로를 확보했다. 왜에 칠지도를 보냈다고 전한다. 박사 고흥이 역사서 『서기』를 편찬했고(375), 부자 상속으로 왕위를 이었다.
  subjects: [baekje, eastern-jin, wa]
  links:
    - { from: baekje, to: eastern-jin, note: "사신 파견" }
    - { from: baekje, to: wa, note: "칠지도 전달, 문물 전파" }
  tags: [diplomacy, culture]
  sources: ["『삼국사기』 백제본기 근초고왕 27년·30년", "『일본서기』 신공기 52년", "칠지도 명문"]

- id: sosurim-372
  year: 372
  endYear: 373
  title:
    ko: 소수림왕의 불교 수용과 체제 정비
  summary:
    ko: 고구려 소수림왕이 전진에서 온 승려 순도를 통해 불교를 받아들이고, 국립 교육 기관인 태학을 세웠다. 이듬해 율령을 반포해 국가 체제를 정비했다.
  subjects: [goguryeo, former-qin]
  links:
    - { from: former-qin, to: goguryeo, note: "순도가 불상·경문을 전함" }
  tags: [culture, politics]
  sources: ["『삼국사기』 고구려본기 소수림왕 2년·3년"]

- id: baekje-buddhism-384
  year: 384
  title:
    ko: 백제의 불교 수용
  summary:
    ko: 침류왕 때 동진에서 온 승려 마라난타를 통해 불교를 받아들였다.
  subjects: [baekje, eastern-jin]
  links:
    - { from: eastern-jin, to: baekje, note: "마라난타의 불교 전래" }
  tags: [culture]
  sources: ["『삼국사기』 백제본기 침류왕 원년"]

# ── 광개토대왕과 장수왕 ─────────────────────────────────

- id: gwanggaeto-391
  year: 391
  title:
    ko: 광개토대왕 즉위와 영락 연호
  summary:
    ko: 광개토대왕이 즉위해 '영락'이라는 독자적인 연호를 썼다. 북쪽으로 거란(비려)과 숙신을 정벌하고, 410년에는 동부여를 복속했다.
  subjects: [goguryeo]
  tags: [politics]
  sources: ["광개토대왕릉비", "『삼국사기』 고구려본기 광개토왕 원년"]

- id: gwanggaeto-baekje-396
  year: 396
  title:
    ko: 광개토대왕의 백제 공격
  summary:
    ko: 광개토대왕이 백제를 공격해 한강 이북의 58성을 빼앗았다. 백제 아신왕은 항복하고 영원히 신하가 되겠다고 맹세했다.
  subjects: [goguryeo, baekje]
  links:
    - { from: goguryeo, to: baekje, note: "58성 700촌 정복" }
  tags: [war]
  sources: ["광개토대왕릉비 영락 6년조"]

- id: gwanggaeto-silla-400
  year: 400
  title:
    ko: 광개토대왕의 신라 구원
  summary:
    ko: 신라 내물왕의 요청으로 광개토대왕이 5만 군대를 보내 신라에 쳐들어온 왜를 물리치고, 임나가라(금관가야)까지 추격했다. 이후 고구려군이 신라에 머물며 내정에 간섭했고, 금관가야가 쇠퇴해 가야 연맹의 중심이 대가야로 옮겨 갔다. 경주 호우총에서 나온 호우명 그릇이 두 나라의 관계를 보여 준다.
  subjects: [goguryeo, silla, wa, gaya]
  links:
    - { from: goguryeo, to: silla, note: "구원군 파견, 내정 간섭" }
    - { from: goguryeo, to: wa, note: "왜 격퇴" }
    - { from: goguryeo, to: gaya, note: "임나가라 추격" }
    - { from: wa, to: silla, note: "왜의 침입" }
  tags: [war]
  sources: ["광개토대왕릉비 영락 10년조", "호우명 그릇 명문"]

- id: liaodong-405
  year: 402
  endYear: 405
  title:
    ko: 고구려의 요동 확보
  summary:
    ko: 광개토대왕이 후연의 숙군성을 공격하는 등 후연과 싸워 요동 지역을 차지했다. 405년 후연이 요동성을 공격했으나 막아 냈다.
  subjects: [goguryeo, later-yan]
  links:
    - { from: goguryeo, to: later-yan, note: "숙군성 공격, 요동 차지" }
    - { from: later-yan, to: goguryeo, note: "요동성 공격" }
  tags: [war]
  sources: ["『삼국사기』 고구려본기 광개토왕 11년·14년"]

- id: gwanggaeto-stele-414
  year: 414
  title:
    ko: 광개토대왕릉비 건립
  summary:
    ko: 장수왕이 아버지 광개토대왕의 업적을 기려 국내성(지안)에 비를 세웠다. 고구려의 건국 신화와 광개토대왕의 정복 활동이 새겨져 있다.
  subjects: [goguryeo]
  tags: [culture]
  sources: ["광개토대왕릉비"]

- id: pyongyang-427
  year: 427
  title:
    ko: 장수왕의 평양 천도
  summary:
    ko: 장수왕이 도읍을 국내성에서 평양으로 옮기고 남진 정책을 폈다. 북위와 남조 송에 모두 사신을 보내는 양면 외교로 중국을 견제했다.
  subjects: [goguryeo, northern-wei, liu-song]
  links:
    - { from: goguryeo, to: northern-wei, note: "사신 파견" }
    - { from: goguryeo, to: liu-song, note: "사신 파견" }
  tags: [politics, diplomacy]
  sources: ["『삼국사기』 고구려본기 장수왕 15년"]

- id: najae-alliance-433
  year: 433
  title:
    ko: 나제 동맹
  summary:
    ko: 고구려의 남진에 맞서 신라 눌지왕과 백제 비유왕이 동맹을 맺었다. 눌지왕 때 신라는 왕위의 부자 상속을 확립하고 고구려의 간섭에서 벗어나려 했다.
  subjects: [silla, baekje]
  links:
    - { from: baekje, to: silla, note: "동맹 요청" }
    - { from: silla, to: baekje, note: "동맹 수락" }
  tags: [diplomacy]
  sources: ["『삼국사기』 신라본기 눌지 마립간 17년", "『삼국사기』 백제본기 비유왕 7년"]

- id: northern-yan-436
  year: 436
  title:
    ko: 북연 왕 풍홍의 고구려 망명
  summary:
    ko: 북위의 공격을 받은 북연의 왕 풍홍이 고구려로 망명했다. 북연이 멸망하면서 북위가 화북을 통일해 가는 가운데, 장수왕은 북위와 맞서지 않으면서 실리를 챙겼다.
  subjects: [goguryeo, northern-yan, northern-wei]
  links:
    - { from: northern-wei, to: northern-yan, note: "북연 정복" }
