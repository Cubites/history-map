- id: goi-260
  year: 234
  endYear: 262
  title:
    ko: 백제 고이왕의 체제 정비
  summary:
    ko: "234년 즉위한 고이왕은 마한 소국들을 아우르며 마한의 중심 세력으로 올라섰고(지도는 234년부터 한강 유역과 경기·충청 북부를 백제 땅으로 그린다) 『삼국사기』에 따르면 260년 6좌평과 16관등제를 마련했으며(후대 제도를 소급한 기록으로 보는 견해가 많다), 관리의 공복을 자주색·붉은색·푸른색으로 정했다. 262년에는 뇌물을 받거나 재물을 훔친 관리에게 3배를 물리고 평생 벼슬하지 못하게 하는 법을 정했는데, 이를 고이왕 때의 율령 반포로 보기도 한다."
  subjects: [baekje, mahan]
