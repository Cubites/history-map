  summary:
    ko: "백제 성왕이 노리사치계를 보내 왜에 불상과 불경을 전했다. 아직기·왕인(한문, 『논어』·『천자문』) 등에 이어 백제는 왜의 고대 문화 발전에 큰 영향을 주었다. 무령왕 때(513) 오경박사 단양이를 보낸 뒤로 백제는 오경박사·역박사·의박사 등을 교대로 왜에 보내 유학·역법·의학을 전했다."
