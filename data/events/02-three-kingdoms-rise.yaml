- id: marriage-alliance-493
  year: 493
  title:
    ko: 백제와 신라의 결혼 동맹
  summary:
    ko: 백제 동성왕이 신라 소지 마립간에게 혼인을 청해, 이찬 비지의 딸과 결혼하며 나제 동맹을 강화했다.
