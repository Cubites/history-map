- id: muryeong-521
  year: 521
  title:
    ko: 무령왕의 양 교류와 22담로
  summary:
    ko: "백제 무령왕이 지방에 22담로를 두고 왕족을 보내 다스렸다. 양에 사신을 보내 \"다시 강국이 되었다\"고 알리고 영동대장군 칭호를 받았다. 공주의 무령왕릉은 양의 영향을 받은 벽돌무덤이다. 1971년 공주 송산리 고분군(지금의 무령왕릉과 왕릉원)에서 발견된 무령왕릉은 무덤 주인을 밝힌 지석이 나와 주인이 확실한 드문 삼국 시대 왕릉이 되었으며, 진묘수와 금제 관꾸미개 등이 출토되었다."
  subjects: [baekje, liang]
  links:
    - { from: baekje, to: liang, note: "사신 파견" }
    - { from: liang, to: baekje, note: "영동대장군 책봉, 벽돌무덤 양식" }
