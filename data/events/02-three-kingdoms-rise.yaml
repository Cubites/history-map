  title:
    ko: 선비의 초원 이탈과 거란·실위·유연의 등장
  summary:
    ko: "몽골 초원을 차지했던 선비는 모용부(전연·후연)와 탁발부(북위)처럼 부(部)별로 중원에 나라를 세우며 초원을 떠났고, 지도는 선비를 401년으로 끝낸다. 『위서』 태조기는 388년(등국 3년) 북위가 고막해를 쳤다고 적고 거란국전은 등국 연간(386~396)에 북위군이 거란을 크게 깨뜨려 고막해와 갈라졌다고 적는데, 지도는 이를 바탕으로 거란을 388년부터 그리고, 『위서』 실위국전에 처음 보이는 실위(첫 사신은 동위 때인 544년)는 지도가 400년 무렵으로 앞당겨 그린다. 거란은 시라무렌강 일대에 살던 유목 민족으로, 선비 우문부 계통으로 보는 고막해와 같은 갈래(『위서』의 '이종동류')로 본다. 초원은 402년 무렵 사륜이 고차의 땅 깊숙이 들어가 여러 부를 아우르고 스스로 구두벌가한을 칭한 유연이 차지했다. 고구려 광개토대왕은 즉위 뒤 거란(비려)을 쳤고(`gwanggaeto-391`), 479년 고구려가 유연과 몰래 짜고 지두우를 나누려 하자 거란의 부족장 하물우가 부락을 이끌고 북위에 귀부해 백랑수 동쪽에 머물렀다(『위서』 거란국전)."
  subjects: [xianbei, khitan, shiwei, rouran, northern-wei, goguryeo, later-yan]
  links:
    - { from: northern-wei, to: khitan, note: "거란 격파 기록(등국 연간, 388년 무렵)" }
  tags: [politics]
  sources: ["『위서』 태조기·거란국전·실위국전·연연전", "『후한서』 오환선비열전"]

# ── 광개토대왕과 장수왕 ─────────────────────────────────

- id: gwanggaeto-391
  year: 391
  title:
    ko: 광개토대왕 즉위와 영락 연호
  summary:
    ko: 광개토대왕이 즉위해 '영락'이라는 독자적인 연호를 썼다. 북쪽으로 거란(비려)과 숙신을 정벌하고, 410년에는 동부여를 복속했다.
  subjects: [goguryeo, khitan]
  tags: [politics]
  sources: ["광개토대왕릉비", "『삼국사기』 고구려본기 광개토왕 원년"]

- id: gwanggaeto-gwanmi-392
  year: 392
  title:
    ko: 광개토대왕의 석현성·관미성 공격
  summary:
    ko: "광개토대왕이 4만 군사로 백제 북쪽 변경을 쳐 석현성 등 10여 성을 빼앗고, 10월에는 사방이 절벽이고 바닷물이 둘러싼 요새 관미성을 일곱 길로 나누어 20일 만에 함락했다. 백제는 한수 북쪽의 여러 부락을 잃어, 근초고왕 때 차지한 예성강~임진강 사이 황해도 남부를 내주었다. 아신왕이 관미성을 되찾으려 했으나(393) 실패하고 수곡성(394)·패수(395)에서도 졌다. 관미성의 위치는 강화 교동도설(이병도), 파주 오두산성설(윤일녕), 개성 부근설 등이 있고, 석현성도 개풍 청석령설·곡산설(『대동지지』) 등이 갈린다."
  subjects: [goguryeo, baekje]
  links:
    - { from: goguryeo, to: baekje, note: "석현성 등 10여 성·관미성 함락" }
  tags: [war]
  sources: ["『삼국사기』 백제본기 진사왕 8년·아신왕 2년~4년", "『삼국사기』 고구려본기 광개토왕 원년"]
  places: [{ name: "관미성 (교동도설)", at: [126.27, 37.78] }]

- id: gwanggaeto-baekje-396
  year: 396
  title:
    ko: 광개토대왕의 백제 공격
  summary:
    ko: 광개토대왕이 백제를 공격해 한강 이북의 58성을 빼앗았다. 백제 아신왕은 항복하고 영원히 신하가 되겠다고 맹세했다.
  subjects: [goguryeo, baekje]
