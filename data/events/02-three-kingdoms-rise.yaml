  sources: ["『삼국사기』 신라본기 진흥왕 12년", "『삼국사기』 열전 거칠부", "단양 신라 적성비"]

- id: buddhism-japan-552
  year: 552
  title:
    ko: 백제의 불교 일본 전파
  summary:
    ko: 백제 성왕이 노리사치계를 보내 왜에 불상과 불경을 전했다. 아직기·왕인(한문, 『논어』·『천자문』) 등에 이어 백제는 왜의 고대 문화 발전에 큰 영향을 주었다.
