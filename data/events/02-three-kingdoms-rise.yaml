  summary:
    ko: 장수왕이 백제의 한성을 함락하고 개로왕을 죽였다. 백제 문주왕은 웅진(공주)으로 도읍을 옮겼다. 고구려는 한강 유역을 차지하고 아산만에서 죽령·영일만에 이르는 지역까지 세력을 넓혔으며, 이 시기에 충주 고구려비(중원 고구려비)를 세웠다.
