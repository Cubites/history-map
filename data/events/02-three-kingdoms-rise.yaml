    - { from: northern-wei, to: later-yan, note: "참합피 전투와 하북 점령(395~397)" }
  tags: [war, politics]
  sources: ["『진서』 부견재기·모용수재기", "『위서』 태조기", "『삼국사기』 고구려본기 고국양왕 2년"]

