- id: baekje-south-497
  year: 497
  endYear: 513
  title:
    ko: 백제의 영산강·섬진강 유역 진출
  summary:
    ko: "5세기 말 백제는 남쪽으로 세력을 넓혔다. 동성왕은 498년 무진주(광주)까지 내려와 탐라가 사죄하자 정벌을 그쳤고, 이 무렵부터 영산강 유역에 대한 백제의 영향이 커졌다(직접 지배 시기는 5세기 말~6세기 중반으로 학설이 갈린다. 지도는 498년부터 영산강 유역과 남해안을 백제 땅으로 그린다). 이어 무령왕 때 섬진강 유역의 기문·대사를 두고 대가야와 다툰 끝에 기문을 차지했다(513). 『일본서기』에는 512년 왜가 임나 4현을 백제에 넘겨주었다고 하나 그 위치와 사실 여부는 논쟁이 있다."
  subjects: [baekje, yeongsan-disputed, seomjin-disputed, gaya, tamna, wa]
  links:
