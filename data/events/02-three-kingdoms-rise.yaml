- id: fei-river-383
  year: 383
  endYear: 398
  title:
    ko: 비수 전투와 전진의 붕괴, 후연·북위의 성립
  summary:
    ko: "376년 화북을 통일한 전진의 부견은 383년 보병 60여만·기병 27만이라 전하는 대군(『진서』, 과장으로 본다)을 이끌고 동진을 쳤으나 비수에서 사현 등에게 크게 패했다. 이를 계기로 전진이 무너져, 선비 모용부의 모용수는 384년 연왕을 칭해 후연을 세웠고(386년 황제), 같은 386년 선비 탁발부의 탁발규가 대왕에 올랐다가 위왕이 되어 북위를 열었다. 부견은 385년 후진을 세운 강족 요장에게 죽었고, 전진은 부비(385~386)와 부등(386~394)을 거쳐 394년 부등이 죽고 아들 부숭이 곧 패해 사라졌다. 고구려 고국양왕은 385년 6월 요동·현도를 차지했으나 그해 11월 후연의 모용농이 되찾았다. 후연은 395년 참합피에서 북위에 크게 패했고(396년 모용수가 죽고 모용보가 이었다) 397년부터 하북을 북위에 빼앗기고 용성으로 물러났으며, 탁발규는 398년 평성에서 황제(도무제)를 칭했다. 지도는 후연을 385~396년에는 하북과 요동, 397년부터 요서·요동만으로 그리고, 북위는 397년부터 하북·산시 북부로 넓혀 그린다."
  subjects: [former-qin, eastern-jin, later-yan, northern-wei, xianbei, goguryeo]
  links:
