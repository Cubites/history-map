- id: buyeo-falls-494
  year: 494
  title:
    ko: 부여의 고구려 복속
  summary:
    ko: 물길에 쫓긴 부여 왕실이 고구려 문자명왕에게 항복해 부여가 완전히 사라졌다. 고구려는 최대 영토를 이루었다.
  subjects: [buyeo, goguryeo]
  links:
