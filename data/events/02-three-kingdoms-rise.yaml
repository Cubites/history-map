- id: baekje-founded
  year: -17
  title:
    ko: 백제 건국
  summary:
    ko: "고구려에서 내려온 온조가 한강 유역의 위례성에서 백제를 세웠다. 고구려 계통의 유이민과 한강 유역의 토착민이 결합했으며, 건국 초기의 돌무지무덤(서울 석촌동)이 고구려와 비슷하다. 서울 송파의 풍납동 토성과 몽촌토성은 한성 도읍기 백제의 왕성으로 여겨진다."
  subjects: [baekje, goguryeo, mahan]
  links:
    - { from: goguryeo, to: baekje, note: "온조 집단의 남하" }
  tags: [politics]
  sources: ["『삼국사기』 백제본기 온조왕 원년"]

