- id: tang-tibet-710
  year: 710
  endYear: 822
  title:
    ko: "당과 토번의 화친과 전쟁: 금성공주의 혼인에서 장경 회맹까지(710~822)"
  summary:
    ko: "670년 대비천에서 토번에 크게 졌던 당은 토번과 서역의 4진을 두고 다투었고(「토번의 토욕혼 병합과 대비천 전투」(앞의 사건)), 692년 왕효걸이 4진을 되찾았다. 710년 중종은 양녀 금성공주를 토번 왕 티데축첸에게 시집보냈다. 이때 중종은 하서의 황허강 굽이(구곡) 땅을 공주의 화장료로 토번에 내주었다고 『구당서』는 적는다. 금성공주는 약 30년을 살다 739년 죽었다. 755년 안사의 난이 일어나 하서·농우의 병력이 중원으로 빠지자(「안사의 난」(뒤의 사건)) 토번은 이 지역으로 밀고 들어왔다. 763년 음력 10월 토번군은 장안을 점령해 광무왕 이승굉을 허수아비 황제로 세웠다가 15일 만에 물러났고, 이어 양주(涼州)·감주·숙주를 차지했으며 사주(둔황)도 780년대 중반에 점령했다. 당은 해마다 가을이면 서북 변경에 수만 명의 방추병을 보내 토번의 침입에 대비해야 했다. 783년 청수 맹약으로 경계를 정했으나 787년 평량 맹약 때 토번이 당의 사절을 습격해 깨졌다. 794년에는 남조가 토번을 신천에서 쳐 당과 화친했다(「남조의 성장: 피라각의 통일에서 정매사의 찬탈까지(738~902)」(뒤의 사건)). 지치고 불안한 두 나라는 821년 음력 10월 장안에서, 이듬해 라싸에서 다시 맹약했다(장경 회맹, 당번회맹). 이때 토번 왕은 랄파첸(재위 815~838)이었다. 두 나라가 현재의 경계를 지키고 서로 침범하지 않는다는 내용이며, 비문은 양국의 군주를 외삼촌과 조카(구생) 사이로 일컬었다. 한문과 티베트어를 나란히 새긴 비석이 라싸 조캉 사원 앞에 지금도 남아 있다. 얼마 뒤 토번에서 내분이 일어나 이 맹약은 오래가지 못했다(「랑다르마와 토번의 분열, 장의조의 사주 수복(838~851)」(뒤의 사건))."
  subjects: [tang, tibet]
  tags: [war, diplomacy]
  sources: ["『구당서』 토번전", "『신당서』 토번전", "『자치통감』 당기", "Christopher I. Beckwith, The Tibetan Empire in Central Asia (Princeton University Press, 1987)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: changan-silk-635
  year: 635
  endYear: 845
  title:
    ko: "장안과 비단길: 소그드 상인, 경교·마니교·조로아스터교(635~845)"
  summary:
    ko: "당의 수도 장안은 인구가 100만 명에 가까웠다고 추산되는 동아시아 최대의 국제 도시였다. 성곽은 동서 약 9.7킬로미터, 남북 약 8.6킬로미터에 바둑판처럼 거리가 나 있었고 동시와 서시 두 시장이 있었다. 서역 상인 가운데 소그드인(속특, 사마르칸트 일대 출신)이 비단길 교역의 중심이었다. 서시에는 이란계 상인과 술집, 호희(胡姬)의 춤과 음악이 있었고, 소그드 공동체는 살보(薩寶)라는 우두머리가 이끌었다. 호선무와 호복, 격구(폴로)가 장안에서 유행했고, 당삼채 도기에는 낙타와 서역인의 모습이 많이 남아 있다. 안녹산도 소그드 아버지와 돌궐 어머니 사이에서 태어났다고 전한다. 종교도 들어왔다. 635년 아라본이 장안에 와서 그리스도교 네스토리우스파(경교, 景敎)를 전했고, 638년 장안에 사원이 세워졌다(뒤에 대진사로 불렀다). 781년 건립한 「대진경교유행중국비」는 이 역사를 한문과 시리아어로 새긴 비석으로, 지금 시안의 비림박물관에 있다. 마니교는 694년 전해졌고 762년 위구르 카간이 이를 받아들였으며, 768년 장안에 마니교 사원 대운광명사가 세워졌다. 조로아스터교(현교)도 장안과 뤄양에 사원이 있었다. 신라·일본·발해 등에서 유학생과 승려가 모여들어 국자감에서 공부했다. 840년에는 당이 신라 유학생 105명을 한꺼번에 돌려보냈다고 『삼국사기』는 적고, 최치원도 874년 빈공과에 급제했다. 이런 개방성은 회창 연간에 바뀌었다. 843년 마니교를 금했고, 845년에는 대진(경교)과 목호(조로아스터교) 승려 3,000여 명을 환속시켰다고 『구당서』는 적는다(「회창 폐불: 무종의 불교 탄압과 엔닌의 목격(842~847)」(뒤의 사건)). 안사의 난 이후 서역과 길이 막히면서 육로 교역은 위축되었다."
  subjects: [tang, uyghur, silla, balhae, japan]
  tags: [culture, religion, economy]
  sources: ["「대진경교유행중국비」", "『구당서』 무종기", "Edward H. Schafer, The Golden Peaches of Samarkand (University of California Press, 1963)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: guangzhou-trade-714
  year: 714
  endYear: 879
  title:
    ko: "당의 바닷길 무역과 시박사: 광저우의 번방과 황소의 광저우 점령(714~879)"
  summary:
    ko: "당은 육로뿐 아니라 바닷길로도 서아시아와 연결되었다. 714년(개원 2년) 광저우에 시박사(市舶使)가 처음 기록에 나오는데, 외국 선박의 입항을 감독하고 물품을 거두어들였고, 입항한 배에서는 박각이라는 세금을 받았다. 아랍과 페르시아 상인은 광저우의 번방(蕃坊)이라는 외국인 거주 구역에 살며 자치를 허락받았다. 번방에는 외국인 우두머리(번장)를 두어 공동체를 이끌게 했고, 아랍 문헌은 광저우를 칸푸라 불렀다. 광저우뿐 아니라 양저우 등에도 외국 상인이 드나들었다. 당 후기에는 양저우와 명주(明州, 지금의 닝보)도 일본과 신라로 가는 배의 출발지였다. 항해는 계절풍에 맞췄다. 여름에는 남서풍을 타고 동남아시아에서 광저우로 오고 겨울에는 북동풍을 타고 돌아갔다. 중국에서는 도자기·비단·차가 나가고, 동남아시아와 인도양에서는 향료와 상아·유리가 들어왔다. 8세기 말 가탐은 광저우에서 인도양과 페르시아만으로 가는 바닷길을 기록했고, 9세기 전반 인도양을 오가던 배의 잔해가 1998년 인도네시아 벨리퉁 앞바다에서 발견되었는데 창사의 가마(창사요)에서 구운 도자기 6만 점 남짓이 실려 있었다. 851년에는 아랍 상인 술라이만의 견문을 엮은 『중국과 인도 소식』이 나왔다. 신라 상인도 이 바닷길에서 활약했다. 758년에는 아랍·페르시아 상인이 광저우를 약탈한 일이 있었고, 760년 양저우에서는 난리 중에 수천 명의 외국 상인이 죽었다고 한다. 해상 무역은 안사의 난으로 육로가 막힌 뒤 더욱 중요해졌고 당의 재정에도 도움이 되었다. 그러나 879년 황소의 반란군이 광저우를 점령했을 때 외국 상인이 큰 피해를 입었고, 아랍 쪽 기록은 희생자를 12만 명이라 적지만 과장으로 보는 견해가 많다(「황소의 난(874~884)」(뒤의 사건))."
  subjects: [tang, silla]
  tags: [economy, society]
  sources: ["『신당서』 지리지·식화지", "Edward H. Schafer, The Vermilion Bird: T'ang Images of the South (University of California Press, 1967)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: tang-poetry-712
  year: 712
  endYear: 770
  title:
    ko: "성당의 시: 이백·두보·왕유(712~770)"
  summary:
    ko: "당은 시의 시대로 불린다. 근체시(율시와 절구)의 형식이 갖추어졌고 진사과에서도 시부가 중요해지면서 시가 정치와 사교의 도구가 되었다. 시는 교방과 이원에서 노래로도 불려 음악과 한데 어울렸다. 후대 시론은 당시를 초당·성당·중당·만당으로 나누는데, 초당의 왕발·노조린 같은 이들이 길을 닦았고, 개원·천보 연간의 성당에는 맹호연·왕창령·고적·잠참 등이 있었다. 이백(701~762)은 쓰촨에서 자라 자유롭고 호방한 시풍으로 ‘시선(詩仙)’이라 불렸다. 서역의 쇄엽에서 태어났다는 설이 있으며, 742년 현종의 부름을 받아 한림공봉이 되었으나 장안을 오래 지키지 못하고 떠돌며 술과 달을 노래했다. 「장진주」「정야사」 같은 시가 널리 알려졌고, 현종과 양귀비 앞에서 「청평조」를 지었다는 일화가 전한다. 안사의 난 뒤 영왕 이린의 난에 연루되어 귀양 갔다가 풀려났고 762년 무렵 죽었다. 왕유(699 또는 701~759 또는 761)는 시와 그림, 음악에 능했고 불교적 정취의 자연시를 썼다. 두보(712~770)는 허난 출신으로 과거에 낙방한 뒤 장안에서 오래 곤궁하게 지냈고, ‘시성(詩聖)’이라 불리며 안사의 난 속 백성의 고통과 사회 현실을 율시로 담았다. 744년 뤄양에서 이백을 만났고, 756년 반란군에 붙잡혀 장안에 갇혀 있던 757년 봄 「춘망」을 지었으며, 청두에서 초당을 짓고 지냈다(760). 770년 후난 일대의 배 위에서 죽었다고 전한다. 청 대의 『전당시』(1705~1707)에는 2,200여 명의 시 4만 8,900여 수가 실렸다. 중당의 한유·백거이 등은 「한유·유종원의 고문 운동과 당 후기 문학(768~846)」(뒤의 사건)에서 다룬다. 신라에서도 당에 유학한 문인들이 시와 문장으로 이름을 얻었다(「최치원의 시무 10여 조」(뒤의 사건))."
  subjects: [tang, silla]
  tags: [culture]
  sources: ["『전당시』", "Stephen Owen, The Great Age of Chinese Poetry: The High T'ang (Yale University Press, 1981)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: li-linfu-734
  year: 734
  endYear: 756
  title:
    ko: "현종 후기의 정치: 이임보 독주와 양귀비·양국충(734~756)"
  summary:
    ko: "개원 후반 현종은 정치에서 점차 멀어졌고 734년 재상이 된 이임보(李林甫)가 조정을 쥐었다. 이임보는 ‘입에는 꿀이 있고 배에는 칼이 있다’는 평을 들었을 만큼 경쟁자를 모함으로 내쳤고, 궁중의 환관과 후궁과도 교분을 맺어 황제의 뜻을 살폈다. 736년 음력 11월 장구령이 쫓겨나 직언하는 분위기가 사라졌다고 평가된다. 이임보는 문신이 변경 장군을 거쳐 재상으로 올라오는 길을 막으려 번장을 절도사로 쓰게 했다(「절도사의 등장과 10절도사 체제(710~755)」(앞의 사건)). 742년 연호를 천보(天寶)로 바꾼 현종은 갈수록 향락에 기울었고 도교를 믿어 노자를 높이는 일에도 열심이었다. 745년 현종은 양옥환(양귀비)을 귀비로 책봉했다. 양귀비의 자매들도 한국·괵국·진국 부인에 봉해져 양씨 일가의 권세가 커졌다. 그 일가인 양국충은 748년 어사로 오르고, 이임보가 죽은 752년 음력 11월 뒤 재상 자리에 올라 안녹산과 대립하며 그가 반란을 꾀한다고 거듭 아뢰었다. 양국충은 이임보가 모반을 꾸몄다는 고발을 받아들여 관작을 빼앗고 자손을 유배 보냈다. 변경 전쟁도 잦아 751년 안녹산이 거란 원정에서 크게 졌고, 탈라스 전투 패배로 서역에서 후퇴한 당은(「고선지의 서역 원정과 탈라스 전투(747~755)」(뒤의 사건)) 같은 해 남조에도 크게 졌다(「남조와 당의 천보 전쟁」(뒤의 사건)). 남조 원정을 위한 대규모 징병은 민심을 어지럽혔다. 755년 음력 11월 안녹산이 양국충 토벌을 내세워 범양에서 반란을 일으켰다(「안사의 난」(뒤의 사건)). 756년 음력 6월 현종은 촉으로 피난하던 길에 마외역에서 군사들의 요구로 양국충을 죽이고 양귀비에게 자결을 명했다. 태자 이형은 영무에서 즉위했다(숙종, 756~762)."
  subjects: [tang]
  tags: [politics]
  sources: ["『구당서』 이임보전·양귀비전", "『자치통감』 당기 개원~천보", "Edwin G. Pulleyblank, The Background of the Rebellion of An Lu-shan (Oxford University Press, 1955)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: gao-xianzhi-talas-747
  year: 747
  endYear: 755
  title:
    ko: "고선지의 서역 원정과 탈라스 전투(747~755)"
  summary:
    ko: "고선지(高仙芝)는 고구려 유민 출신으로 안서 4진의 장군이 된 인물이다. 아버지 고사계를 따라 안서에서 자란 그는 젊은 나이에 장군이 되었다. 747년 그는 약 1만 명의 군대를 이끌고 3,000미터 넘는 파미르의 고개를 넘어 토번이 장악한 소발률(길기트 방면)을 공략해 서역 길을 다시 열었다. 군사를 세 길로 나눠 파미르 고원의 연운보에서 만나게 한 이 원정은 토번 쪽으로 기울던 서역 소국들을 당에 붙들어 두는 구실을 했다. 750년에는 타슈켄트(석국)를 쳤고, 항복한 왕을 약속과 달리 장안으로 끌고 가 죽였다는 기록이 있다. 석국 왕의 아들은 서쪽으로 달아나 아바스 칼리프국에 도움을 청했다. 아바스 조는 750년 우마이야 조를 무너뜨리고 일어난 새 이슬람 제국이었다. 751년 여름(천보 10재, 서양 연구는 양력 7월로 본다) 고선지의 당군과 지야드 이븐 살리흐가 이끈 아바스군이 탈라스강(지금의 카자흐스탄 타라즈 부근으로 추정)에서 맞붙어 닷새를 맞섰다. 당군은 한인과 카를룩 등 번병을 합쳐 사료마다 2만~3만(많게는 6만) 안팎이었는데, 이 가운데 카를룩이 전투 닷새째에 아바스 쪽으로 돌아서 뒤를 쳐서 당군이 크게 졌고, 고선지는 간신히 달아났다. 아바스군은 서양의 추산으로 3만 안팎이나 중국 사료는 20만으로 적는다. 이 패배로 당은 중앙아시아 서부에서 물러났다. 753년 봉상청이 발률 일대에서 당의 세력을 되살렸으나 755년 안사의 난 이후 서역 지배가 무너졌고, 그 뒤에도 아바스 쪽과 사절이 오갔다고 『구당서』는 적는다. 탈라스에서 잡힌 중국인 포로를 통해 제지술이 이슬람 세계에 전해졌다는 이야기가 널리 알려졌으나 학계는 의심하며, 종이는 그 전부터 중앙아시아에서 쓰였다. 고선지는 755년 말 안사의 난 초기에 섬주를 버리고 동관으로 물러났다는 이유로 동관에서 처형되었다(「안사의 난」(뒤의 사건))."
  subjects: [tang, tibet]
  tags: [war]
  sources: ["『구당서』 고선지전", "『신당서』 고선지전", "『자치통감』 당기 천보", "Christopher I. Beckwith, The Tibetan Empire in Central Asia (Princeton University Press, 1987)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: nanzhao-738
  year: 738
  endYear: 902
  title:
    ko: "남조의 성장: 피라각의 통일에서 정매사의 찬탈까지(738~902)"
  summary:
    ko: "윈난의 얼하이호 일대에는 여섯 개의 조(詔)가 있었는데 그 가운데 남쪽의 몽사조가 이웃을 하나씩 아울렀다. 얼하이호를 둘러싼 비옥한 평야에서 쌀농사로 힘을 길렀다. 피라각이 738년 여섯 조를 하나로 합치자 당은 그를 운남왕으로 책봉했고, 이듬해 도읍을 태화성으로 옮겼다. 748년 즉위한 각라봉은 당과 사이가 나빠져 750~754년 천보 전쟁에서 두 차례 당군을 물리쳤고(「남조와 당의 천보 전쟁」(뒤의 사건)), 이때 토번과 형제의 맹약을 맺어 ‘아우(찬보종)’로 대접받았다고 한다. 당군은 남조와 싸우다 수만 명에서 십만 명이 넘는 병사를 잃었다고 사료는 적는다. 779년 즉위한 이모심은 도읍을 양저미성(지금의 다리)으로 옮겼고, 794년(793년설도 있다) 신천에서 토번군을 쳐서 당과 화친했다. 점창산에서 당 사신 최좌시와 맹약을 맺고 토번이 준 금인을 바쳤으며, 795년 당의 남조왕 책봉을 받았다고 전한다. 남조는 한문을 공식 문자로 썼고 불교가 번성해 다리의 숭성사 삼탑이 이 무렵 세워졌다. 이모심(779~808) 뒤 심각권·권룡성·권리성 등을 거쳐 권풍우(재위 823~859) 때 힘을 키운 남조가 829년 청두 부근을 공격해 장인과 주민 수만 명을 끌고 갔다가 이듬해 물러났다. 859년 즉위한 세륭(世隆, 『신당서』는 추룡酋龍으로 적는다)은 이듬해(859년설도 있다) 황제를 칭하며 나라 이름을 대례(大禮)라 했다. 863~866년 남조는 지금의 베트남 하노이 일대인 안남을 차지했으나 당의 고변이 되찾았다. 869년에는 청두를 포위했다. 거듭된 원정으로 나라가 지쳐 877년 세륭이 죽고 아들 융순이 이었으나 힘이 크게 떨어졌고, 897년 정매사가 왕을 죽이고 어린 순화정을 세웠다가 902년 왕족을 몰아내고 대장화를 세워 남조는 끝났다. 남조의 영토는 한때 윈난에서 지금의 미얀마 북부와 베트남 북부, 쓰촨 남부에 걸쳤다. 남조 지배층이 오늘날 바이족·이족 가운데 어느 쪽에 가까운지는 학계에서도 논쟁이 이어지는 문제이다."
  subjects: [tang, tibet]
  tags: [war, politics]
  sources: ["『구당서』 남만전", "『신당서』 남조전", "Charles Backus, The Nan-chao Kingdom and T'ang China's Southwestern Frontier (Cambridge University Press, 1981)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: fanzhen-763
  year: 763
  endYear: 786
  title:
    ko: "번진의 할거와 건중의 난: 하삭 3진과 환관의 신책군(763~786)"
  summary:
    ko: "763년 음력 1월 사사명의 아들 사조의가 자살하며 안사의 난은 끝났다(「안사의 난」(앞의 사건)). 그러나 당은 반란군에서 항복한 장수들을 처벌할 힘이 없어 하삭(황허강 북쪽) 지방의 절도사 자리를 그대로 인정했다. 위박의 전승사, 성덕의 이보신, 노룡(幽州)의 이회선이 그들로, 위박은 지금의 허베이 다밍 일대, 성덕은 정딩, 노룡은 유주(幽州, 지금의 베이징)를 중심으로 했다. 이 하삭 3진은 자기 군대를 두고 세금을 중앙에 보내지 않았으며 자리를 아들과 부하에게 물려주었고, 특히 위박의 아군(牙軍)은 절도사를 갈아치우기도 할 만큼 힘이 컸다. 조정은 세습을 막지 못해 뒤늦게 절도사 임명장을 내려 주는 데 그쳤다. 반란 평정에 공을 세운 장수에게 땅과 군대를 맡기면서 번진(藩鎭)은 내지에도 늘어 곧 40여 곳 안팎이 되었다. 중앙의 군대는 약해졌다. 763년 토번이 장안까지 쳐들어오자(「당과 토번의 화친과 전쟁: 금성공주의 혼인에서 장경 회맹까지(710~822)」(앞의 사건)) 숙종(756~762)을 이은 대종(762~779)이 피난했고, 이때 환관 어조은이 거느린 신책군이 황제를 호위하며 환관의 군권이 커졌다. 779년 즉위한 덕종은 번진을 누르려 했으나 781년부터 하삭 번진이 저항했고 782년 음력 11월에는 넷이 왕을 칭했다. 783년 음력 10월에는 장안에 주둔하던 경원군 병사들이 보상에 불만을 품고 일으킨 반란에서 주자(朱泚)가 황제를 칭했고 덕종이 봉천으로 피난했다. 덕종은 784년 음력 1월 죄를 자책하는 조서를 내려 반란군 일부를 달랬고, 주자가 음력 6월 죽은 뒤 7월 장안에 돌아왔다. 회서의 이희열은 784년 초 황제를 칭했으나 786년 부하에게 살해되면서 건중의 난은 끝났다. 환관이 신책군 지휘를 쥐는 일은 덕종 때 굳어졌다. 번진을 무력으로 없애는 길은 막혔고, 당은 번진과 공존하는 체제로 돌아갔다."
  subjects: [tang, tibet]
  tags: [politics, war]
  sources: ["『구당서』 덕종본기·전승사전", "『신당서』 번진열전", "『자치통감』 당기 대력~건중", "Charles A. Peterson, 'Court and Province in Mid- and Late T'ang', in The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)", "Edwin G. Pulleyblank, The Background of the Rebellion of An Lu-shan (Oxford University Press, 1955)"]

- id: two-tax-780
  year: 780
  endYear: 781
  title:
    ko: "양세법의 시행(780)"
  summary:
    ko: "당의 조용조는 모든 정남이 비슷한 땅을 가진다는 가정 위에 있었으나, 땅이 큰 세력가에게 쏠리고 농민이 호적에서 빠져나가면서 이미 무너져 있었다. 안사의 난으로 호적 자체가 어지러워졌고 번진이 세금을 중앙에 보내지 않아(「번진의 할거와 건중의 난: 하삭 3진과 환관의 신책군(763~786)」(앞의 사건)) 조정의 수입은 줄었다. 호적에 오른 호는 755년 약 890만 호에서 760년대에는 200만~300만 호 안팎으로 줄었다고 『통전』은 적는데, 사망만이 아니라 호적을 파악하는 힘이 무너진 탓이 크다. 780년 정월 덕종 아래 재상 양염(楊炎)의 건의로 양세법(兩稅法)이 시행되었다. 이 법은 사람이 아니라 지금 사는 곳과 가진 재산을 기준으로 삼았다. 도망 농민과 이주민(객호)도 현재 사는 곳에서 호적에 올려 세금을 매겼다. 거주지의 호는 재산의 많고 적음에 따라 9등으로 나누어 호세(戶稅)를 돈으로 내게 했고, 소유한 땅에는 면적에 따라 지세(地稅)를 곡식으로 부과했다. 여름과 가을, 곧 6월과 11월까지 두 번 나누어 거두었기에 양세라 했다. 또 먼저 해마다 쓸 돈을 계산하고 이에 맞추어 징수액을 정했다. 세금이 토지·재산 단위로 바뀌며 균전제는 사실상 막을 내렸다(「당의 균전제·조용조·부병제와 그 무너짐(624~749)」(앞의 사건)). 다만 호세를 돈으로 내게 하자 동전이 모자라 물건값이 떨어지는 현상(전중화경)이 나타나, 농민은 같은 세액을 내려면 곡식과 베를 더 많이 팔아야 했다. 거둔 세금은 중앙과 절도사, 주·현이 나누었는데 하삭 번진은 중앙에 내지 않아 조정은 강남의 세수에 크게 의존했다. 양염은 781년 모함으로 좌천되었다. 이 방식은 명 대 일조편법까지 800년 가까이 큰 틀로 이어졌다."
  subjects: [tang]
  tags: [economy, politics]
  sources: ["『구당서』 양염전·식화지", "『신당서』 식화지", "Denis Twitchett, Financial Administration under the T'ang Dynasty (2판, Cambridge University Press, 1970)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: yuanhe-805
  year: 805
  endYear: 821
  title:
    ko: "영정 혁신과 원화 중흥: 번진 억제의 시도(805~821)"
  summary:
    ko: "805년 음력 1월 덕종이 죽고 중풍을 앓던 순종이 즉위하자, 왕숙문과 왕비(王伾) 등이 정치를 맡아 ‘영정 혁신’을 벌였다. 이들은 백성을 괴롭히던 궁시(宮市)를 없애고 환관이 쥔 신책군의 군권을 되찾으려 했다. 궁시는 궁중 물자를 산다는 구실로 환관이 시장에서 헐값에 물건을 빼앗던 일로, 백거이의 「매탄옹」이 이를 풍자했다. 왕숙문은 신책군 사령관에 원로 장수 범희조를 앉히려 했으나 환관이 군 지휘부에 명령을 따르지 말라 일렀고, 환관과 번진의 반발로 개혁은 몇 달 만에 실패했다. 순종은 805년 음력 8월 아들 헌종에게 양위했고 왕숙문은 이듬해 사사되었으며, 유종원·유우석 등 참여자 여덟 명은 지방 사마로 좌천되었다. 헌종은 번진을 누르려 힘을 쏟았다. 806년 서천의 유벽, 807년 진해의 이기를 평정했고, 817년에는 회서 번진의 오원제를 재상 배도 등이 이끄는 군대로 쳐서 없앴다. 이소가 눈 오는 밤 채주를 기습해 오원제를 사로잡았고, 한유는 이를 기려 「평회서비」를 지었다. 819년 음력 2월에는 산둥의 평로 번진 이사도를 평정했다. 이 기세에 하삭 3진 가운데 노룡·성덕·위박이 땅과 아들을 바치며 조정의 명령을 따랐고(821년까지), 이를 원화(元和) 중흥이라 부른다. 헌종은 819년 법문사의 부처 손가락뼈를 궁으로 모시려다 한유의 비판을 샀다(「한유·유종원의 고문 운동과 당 후기 문학(768~846)」(앞의 사건)). 그러나 헌종은 820년 음력 1월 환관 진홍지에게 살해되었고, 하삭의 번진은 821~822년 사이 다시 중앙에서 떨어져 나가 자립했다. 번진을 무력으로 누르는 일은 끝내 이루어지지 못했다."
  subjects: [tang]
  tags: [politics, war]
  sources: ["『구당서』 헌종본기·배도전", "『신당서』 왕숙문전·번진열전", "『자치통감』 당기 정원~장경", "Charles A. Peterson, 'Court and Province in Mid- and Late T'ang', in The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: eunuchs-ganlu-808
  year: 808
  endYear: 850
  title:
    ko: "환관의 전횡과 우이당쟁, 감로의 변(808~850)"
  summary:
    ko: "당 후기 환관은 신책군을 쥐고 황제의 폐립까지 좌우했다. 신책군을 거느린 환관 우두머리는 좌·우 중위로서 황제 곁의 북사(北司)를 이끌며 재상 중심의 남아(南衙)와 맞섰고, 지방에서도 감군사로 절도사를 감시했다. 820년 헌종이 환관에게 살해된 뒤 목종·경종·문종·무종이 차례로 환관의 손으로 올랐고, 826년 음력 12월에는 경종이 환관 유극명 등에게 죽임을 당했다. 조정 안에서는 관료가 갈라져 싸웠다. 808년 제과(制科)에서 우승유와 이종민이 재상 이길보를 비판하는 답안을 써서 합격했다가 이길보의 미움을 사 시험관들이 쫓겨나고 두 사람도 오래 관직에서 밀려났는데, 이 일에서 비롯된 다툼은 과거 출신 신진 관료의 우승유·이종민 일파와 귀족 출신으로 이길보의 아들인 이덕유 일파가 849년까지 겨룬 우이당쟁(牛李黨爭)으로 알려졌다. 835년 음력 11월 문종은 재상 이훈과 봉상 절도사 정주를 앞세워 환관 우두머리 구사량 등을 없애려 했다. 금오 청사 나무에 감로(甘露)가 내렸다고 속여 환관을 유인하려 했으나 환관이 휘장 뒤의 병사를 발견하면서 계획이 들통났다. 구사량은 신책군을 풀어 이훈과 재상, 관원과 그 가족 1,000여 명을 죽였다. 이를 감로의 변(甘露之變)이라 하며, 문종은 이 뒤 스스로 가노에게 제압당한다고 한탄했다고 전한다. 840년 문종이 죽자 구사량은 문종의 동생을 세워 무종으로 삼았고, 무종(840~846) 때는 재상 이덕유가 번진 소의군을 누르고 위구르 잔여 세력을 물리쳤다. 이덕유는 849년 선종 때 쫓겨나 이듬해 유배지에서 죽었다. 환관 세력의 마지막은 「주전충과 이극용: 번진 전쟁과 당 조정의 장악(883~905)」(뒤의 사건)에서 다룬다."
  subjects: [tang]
  tags: [politics]
  sources: ["『구당서』 문종본기·구사량전", "『신당서』 환자전·이덕유전", "『자치통감』 당기", "Charles A. Peterson, 'Court and Province in Mid- and Late T'ang', in The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: uyghur-tang-744
  year: 744
  endYear: 840
  title:
    ko: "위구르 칸국과 당: 비단과 말의 교역, 마니교(744~840)"
  summary:
    ko: "철륵 계통의 회흘(위구르)은 744년 골력배라(쿠툴룩 빌게 퀼)가 후돌궐을 무너뜨리고 카간에 올라 몽골 초원을 차지하면서 칸국이 되었다(「후돌궐의 멸망과 위구르 칸국」(앞의 사건)). 도읍은 오르콘강변의 오르두발릭(카라발가순)이었고, 소그드 상인과 승려가 이곳에 모였다. 위구르 문자는 소그드 문자를 바탕으로 만들어졌고, 카라발가순 비문은 한문·소그드문·돌궐문으로 새겨졌다. 위구르는 마니교 승려와 소그드인을 통해 정주 도시 문화를 받아들였다. 755년 안사의 난이 터지자 위구르는 당을 도왔다. 747년 골력배라의 아들 마연철 카간이 이었고, 그가 보낸 기병은 757년 음력 가을 당군과 함께 장안과 뤄양을 되찾았다. 759년 마연철의 아들 보고 카간이 오르고 762년 그의 군대가 뤄양을 약탈해 당을 괴롭혔다. 보고 카간은 이때 뤄양에서 마니교 승려를 만나 이를 받아들여 위구르의 국교로 삼았다. 당은 도움의 대가로 해마다 비단을 건넸고, 위구르는 말을 비단과 맞바꾸는 교역을 요구했는데 말 한 마리에 비단 40필을 쳤다고 한다. 당은 거의 언제나 위구르의 요구에 응해야 했고, 당 사료는 위구르 사신이 장안에서 행패를 부리는 일이 잦았다고 적는다. 위구르는 이 교역을 반란 진압을 도운 대가로 여겼다. 영국공주·함안공주·태화공주 같은 당의 공주가 카간에게 시집갔는데, 821년 태화공주를 맞은 카간이 숭덕 카간이다. 779년(일설 780년) 보고 카간이 살해된 뒤 카간의 계승이 어지러워졌고, 788년 회흘은 이름을 회골(回鶻)로 고쳤다. 위구르는 790년대 베시발리크 등지에서 토번과 서역의 지배를 놓고 다투었다. 839년 큰 눈과 가축 전염병이 겹쳐 흔들리던 중 840년 키르기스가 오르두발릭을 불태웠다(「위구르의 붕괴와 토번의 해체」(뒤의 사건)). 위구르 사람들은 간쑤의 감주와 투루판 등으로 흩어져 새 나라를 세운다."
  subjects: [uyghur, tang]
  tags: [diplomacy, economy]
  sources: ["『신당서』 회흘전", "『구당서』 회흘전", "Colin Mackerras, The Uighur Empire According to the T'ang Dynastic Histories: A Study in Sino-Uighur Relations, 744–840 (Australian National University Press, 1972)", "Michael R. Drompp, Tang China and the Collapse of the Uighur Empire: A Documentary History (Brill, 2005)"]

- id: tibet-split-838
  year: 838
  endYear: 851
  title:
    ko: "랑다르마와 토번의 분열, 장의조의 사주 수복(838~851)"
  summary:
    ko: "토번은 821~822년 장경 회맹 때의 왕 랄파첸(재위 815~838) 때 가장 넓은 영역을 차지했다. 랄파첸은 불교를 후원해 승려를 우대하고 불전 번역에 쓰는 용어를 통일하는 사업을 벌였으며 승려를 부양하는 가호를 정해 주었다. 이에 귀족과 뵌교 쪽 세력의 불만이 쌓였다고 전한다. 랑다르마가 불교를 박해했다는 이야기는 주로 후대 불교 쪽 전승이어서 과장이 섞였다고 본다. 838년 랄파첸이 살해되었고 동생 랑다르마(우돔첸)가 왕위에 올랐다. 전승에 따르면 랑다르마는 불교 사원을 닫고 승려를 억압했다. 842년(일설 841년·846년) 랑다르마도 승려의 손에 암살되었다고 전하며, 이후 왕위를 두고 아들들이 다투어 왕실이 갈라졌다(「위구르의 붕괴와 토번의 해체」(뒤의 사건)). 왕통은 외숭계와 윤땐계로 나뉘었고 뒤에 서쪽 아리 지방에 왕국이 선다. 중앙의 힘이 약해지자 변경 점령지의 한인과 소수 민족이 일어났다. 토번 지배기(786년, 일설 781년~848년)의 둔황에서는 티베트어 사경과 한문 불경의 번역이 활발했고 그 문서가 지금 전한다. 토번은 760년대부터 820년대까지 하서와 농우, 서역 일부를 아울러 가장 넓은 영역을 차지했다. 848년 사주(둔황)의 한인 호족 장의조가 토번 수비대를 몰아내고 사주를 되찾은 뒤 곧 과주 등 인근 주로 넓혀 당에 바쳤고, 당은 851년 그를 귀의군 절도사로 삼았다. 위구르가 840년 무너진 데 이어 토번마저 갈라지자 당의 서북 변경에는 감주 위구르·귀의군 같은 작은 정권이 들어선다. 티베트 중심부에서는 10세기 말 이후 불교가 다시 퍼지기까지 교단이 크게 흔들렸다고 전한다. 토번의 해체는 당 후기 서북 변경의 위협을 줄였지만, 당은 이를 되찾을 힘이 부족했다."
  subjects: [tibet, tang]
  tags: [politics]
  sources: ["『신당서』 토번전", "Christopher I. Beckwith, The Tibetan Empire in Central Asia (Princeton University Press, 1987)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: huichang-845
  year: 842
  endYear: 847
  title:
    ko: "회창 폐불: 무종의 불교 탄압과 엔닌의 목격(842~847)"
  summary:
    ko: "당의 불교 사원은 면세 특권과 넓은 토지, 많은 승려와 노비를 갖고 있어 국가 재정을 갉아먹는다는 비판을 받았다. 한유 같은 유학자는 불교를 외래의 가르침이라 비판했고(「한유·유종원의 고문 운동과 당 후기 문학(768~846)」(앞의 사건)), 무종(재위 840~846)은 도사 조귀진을 가까이하며 도교를 믿었다. 무종은 842년부터 승려의 규율을 단속하다 843년 마니교를 막고, 845년부터 본격적으로 불교 사원 정리에 나섰다. 이 일은 연호를 따서 회창 폐불이라 부른다. 『구당서』는 이 해 사찰 4,600여 곳과 작은 암자 4만여 곳을 헐고 승려와 비구니 26만 500명을 환속시켰다고 적는다. 사원의 노비 15만 명은 양세호로 올렸다. 장안과 뤄양에는 사찰을 각각 4곳씩만, 주마다 1곳씩 남겼다. 불상을 녹인 구리로는 동전을 만들어 뒷면에 주조한 곳의 이름을 새겼고(회창개원통보), 철 불상은 농기구로 바꾸었다. 경교와 조로아스터교 신자도 환속시켰다(「장안과 비단길: 소그드 상인, 경교·마니교·조로아스터교(635~845)」(앞의 사건)). 때마침 당에 머물던 일본 승려 엔닌은 이 폐불을 직접 보고 『입당구법순례행기』에 기록했다. 그는 산둥의 신라인 마을과 사원 적산법화원의 도움을 받으며 847년 귀국했다. 무종이 846년 죽고 선종이 즉위하자 폐불은 풀렸다. 무종은 장생을 위해 단약을 먹다 병이 들어 죽었다는 이야기가 전한다. 중국 역사에서 이 일을 북위 태무제, 북주 무제, 후주 세종의 폐불과 함께 ‘삼무일종’의 법난이라 일컫는다. 큰 사원과 경전에 의지하던 교종은 크게 타격을 입었고, 경전보다 마음을 중시하는 선종은 비교적 타격이 적었다."
  subjects: [tang, japan, silla]
  tags: [religion, politics]
  sources: ["『구당서』 무종기", "『신당서』 무종기", "엔닌, 『입당구법순례행기』", "Stanley Weinstein, Buddhism under the T'ang (Cambridge University Press, 1987)", "Edwin O. Reischauer, Ennin's Diary: The Record of a Pilgrimage to China in Search of the Law (Ronald Press, 1955)"]

- id: salt-tea-758
  year: 758
  endYear: 879
  title:
    ko: "소금과 차의 전매, 당 후기의 재정(758~879)"
  summary:
    ko: "안사의 난으로 호적과 토지에서 거두는 세금이 크게 줄자 당은 소금에서 재정의 길을 찾았다. 758년 제오기가 염철사로서 소금을 국가가 사들여 파는 전매를 시작했다. 이때 소금값은 한 말에 10전에서 110전으로 올랐다고 한다. 763년 유안은 이를 고쳐 소금 생산자에게서 관이 사들인 소금을 상인에게 넘기고 상인이 팔게 해 유통을 민간에 맡겼다. 유안은 소금이 나는 곳마다 감독 기관(염감)과 순원을 두고, 상평법으로 곡식값을 조절하며 강남의 곡식을 장안으로 실어 나르는 조운도 정비했다. 그러나 780년 재상 양염의 모함으로 죽임을 당했다. 『신당서』는 대력 연간 천하 수입의 절반이 소금 이익에서 나왔다고 적는다. 창장강 하류 양저우에 염철전운사의 관청을 두고 강남에서 나는 소금·곡물을 뤄양과 장안에 날랐다. 소금은 바닷물을 졸이거나 소금 호수와 우물에서 얻었고 해염의 생산지는 강회 일대에 몰려 있었다. 소금은 모든 백성이 사야 하는 물건이어서 사실상 간접세 구실을 했다. 이 재정은 양세법과 나란히 당 후기 조정을 지탱했다(「양세법의 시행(780)」(뒤의 사건)). 793년 차에도 10분의 1의 세금을 매겼고, 9세기 전반 차 전매를 시도했다. 차는 선승 사이에 퍼지고 육우가 『다경』을 쓰면서 널리 마시게 되었다. 그러나 소금값이 높아지자 몰래 소금을 팔아 이익을 얻는 밀매가 늘었고, 큰 이익을 노린 무장한 밀매상 집단이 생겼다. 관의 판매가 부진하면 단속하는 관리가 오히려 부패해 소금값이 오르곤 했다. 874년 봉기한 왕선지와 이듬해 따로 일어나 손잡은 황소 모두 소금 밀매와 관계가 깊은 인물이었다(「황소의 난(874~884)」(뒤의 사건))."
  subjects: [tang]
  tags: [economy]
  sources: ["『신당서』 식화지", "『구당서』 식화지·유안전", "Denis Twitchett, Financial Administration under the T'ang Dynasty (2판, Cambridge University Press, 1970)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: huangchao-874
  year: 874
  endYear: 884
  title:
    ko: "황소의 난(874~884)"
  summary:
    ko: "선종(846~859)과 의종(859~873)을 거쳐 873년 어린 희종이 즉위한 당은 번진과 환관의 다툼 속에서 흉작과 세금 부담이 겹쳐 민심이 흔들렸다. 874년 소금 밀매상 왕선지가 장원(지금의 허난 창위안)에서 봉기해 복주(濮州)·조주(曹州)를 차지했고, 이듬해 같은 소금 밀매 출신의 황소(黃巢)가 산둥에서 따로 일어나 왕선지와 손잡았다. 황소는 조주(曹州) 원구현 사람으로 과거에 여러 번 떨어져 불만이 컸다고 전한다. 왕선지는 ‘천보평균대장군’을 칭했고, 878년 왕선지가 전사하자 황소가 ‘황왕’으로서 ‘충천대장군’을 칭하고 연호를 왕패(王霸)라 하며 창장강 중하류를 휩쓸고 남쪽으로 내려갔다. 강서·절동·복건을 거쳐 879년 광저우를 점령하며 외국 상인에게 큰 피해를 입혔다(「당의 바닷길 무역과 시박사: 광저우의 번방과 황소의 광저우 점령(714~879)」(앞의 사건)). 880년 북쪽으로 올라올 때 회남 절도사 고변은 싸우지 않고 관망했다. 황소는 음력 11월 뤄양을 차지하고 12월 장안에 들어갔으며(양력으로는 881년 1월 무렵), 황제를 칭해 국호를 대제(大齊), 연호를 금통(金統)이라 했다. 희종은 청두로 피난했고, 장안은 약탈과 불로 큰 피해를 입었으며 황소군은 당의 종실과 고관을 죽였다. 그러나 황소군은 식량 조달과 통치에 실패했고, 882년 부하 주온(뒤의 주전충)이 당에 항복했다(「주전충과 이극용: 번진 전쟁과 당 조정의 장악(883~905)」(뒤의 사건)). 881년 회남 절도사 고변의 막료였던 신라인 최치원이 황소를 꾸짖는 격문을 써서 이름을 떨쳤다고 『삼국사기』는 전한다(「최치원의 시무 10여 조」(뒤의 사건)). 883년 음력 4월 사타 돌궐 출신 이극용이 장안을 되찾았고, 황소는 동쪽으로 달아나 884년 음력 6월 산둥 태산 부근의 낭호곡에서 죽었다. 당은 이 반란을 가까스로 눌렀으나 이를 평정한 절도사들이 힘을 키워 조정은 허수아비가 되어 갔다."
  subjects: [tang, silla]
  tags: [war, society]
  sources: ["『구당서』 희종본기·황소전", "『신당서』 황소전", "『자치통감』 당기 건부~중화", "『삼국사기』 열전 최치원", "Howard S. Levy, Biography of Huang Ch'ao (University of California Press, 1955)"]

- id: zhu-wen-883
  year: 883
  endYear: 905
  title:
    ko: "주전충과 이극용: 번진 전쟁과 당 조정의 장악(883~905)"
  summary:
    ko: "황소의 부하였다가 882년 당에 항복한 주온은 희종에게 ‘전충’이라는 이름을 받아 이듬해 변주(지금의 카이펑)를 근거로 선무 절도사가 되었다(주전충). 같은 883년 황소 토벌에 공을 세운 사타 돌궐 출신으로 본래 성이 주사(朱邪)였다가 당에서 이씨 성을 받은 이극용은 하동 절도사가 되었는데, 애꾸눈이라 ‘독안룡’으로 불렸다. 이극용은 검은 옷의 기병 아군(鴉軍)을 거느렸다. 두 사람은 884년 음력 5월 변주의 상원역에서 부딪친 뒤 앙숙이 되었다. 주전충은 하남의 군웅을 하나씩 누르고 하북의 번진까지 굴복시켜 황허강 중하류를 장악했다. 조정은 환관과 재상이 갈려 싸웠다. 888년 희종이 죽고 동생 소종이 즉위했다. 900년 환관 유계술이 소종을 가두고 아들 이유를 황제에 세웠고, 901년 재상 최윤이 주전충을 불러 환관을 치게 해 소종이 복위했다. 그러나 같은 901년 환관 한전회가 소종을 데리고 봉상의 이무정에게 갔고, 주전충이 봉상을 포위해 903년 음력 1월 소종을 장안으로 데려왔으며, 환관 수백 명을 죽이고 지방에 나가 있던 감군도 처형했다. 904년 음력 1월 주전충은 소종과 백관, 백성을 뤄양으로 옮기게 하며 장안의 궁궐과 민가를 헐었는데, 헐어 낸 목재는 웨이허강과 황허강에 띄워 뤄양으로 보냈다고 한다. 그해 음력 8월 소종이 주전충의 부하에게 살해되고 아들 애제가 세워졌다. 905년 음력 6월 백마역에서 재상 배추 등 30여 명이 살해되어 황허강에 던져졌다(‘백마의 화’). 이진이 ‘청류를 탁류에 던지자’고 부추겼다고 전한다. 주전충에게 대항할 수 있는 상대는 이극용의 하동 정도였다. 907년 주전충이 선양을 받아 후량을 세운다(「당의 멸망과 오대의 시작, 후삼국의 대중 외교」(뒤의 사건))."
  subjects: [tang]
  tags: [politics, war]
  sources: ["『구오대사』 양서 태조기", "『신오대사』 양본기", "『자치통감』 당기·후량기", "Wang Gungwu, The Structure of Power in North China during the Five Dynasties (Stanford University Press, 1963)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: tang-buddhism-650
  year: 650
  endYear: 845
  title:
    ko: "당의 불교: 화엄·선·정토·밀교, 의정의 구법(650~845)"
  summary:
    ko: "당은 불교가 가장 번성한 시대였다. 현장이 가져온 유식학은 제자 규기를 거쳐 법상종으로 정리되었다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」(앞의 사건)). 화엄종은 법장(643~712)이 무후의 후원 아래 체계를 세웠다. 선종은 달마에서 오조 홍인을 거쳐 신수의 북종과 혜능의 남종으로 갈렸고, 혜능(638~713)의 가르침을 담은 『육조단경』은 즉각 깨달음(돈오)을 강조하며 혜능이 글을 모르는 나무꾼이었다고 전한다. 8세기 후반 이후 마조 도일과 백장 회해가 선원의 규율(청규)을 세웠다. 정토종은 선도(613~681)가 장안에서 아미타불의 이름을 부르면 정토에 태어난다고 널리 퍼뜨렸다. 8세기에는 선무외·금강지·불공이 인도 등지에서 와 밀교 경전을 번역했다. 의정(635~713)은 671년 광저우에서 바닷길로 인도에 가서 20여 년 동안 여러 나라를 돌아보고 695년 뤄양으로 돌아와 수많은 경전을 번역했으며, 인도와 동남아의 불교를 기록한 『남해기귀내법전』을 남겼다. 사찰은 변문을 풀어 설법하는 대중 강당 구실도 했고, 불교 미술에서는 둔황 막고굴과 룽먼 석굴이 당 대에 크게 넓어졌다. 불교는 국가의 보호를 받아 사원이 넓은 토지와 노비를 얻었으나, 이것이 도리어 반발을 불러 회창 연간의 탄압(「회창 폐불: 무종의 불교 탄압과 엔닌의 목격(842~847)」(뒤의 사건))을 낳았다. 신라 승려들도 당에 유학하거나 수행하며 불교를 배웠다. 의상은 661년 당에 건너가 종남산 지엄에게 화엄을 배우고 671년 돌아와 신라 화엄종의 바탕을 닦았고(「원효와 의상의 불교」(뒤의 사건)), 선종은 신라 하대에 구산선문으로 퍼져 나갔다(「선종의 확산 (9산 선문)」(뒤의 사건))."
  subjects: [tang, silla]
  tags: [religion, culture]
  sources: ["『송고승전』", "의정, 『남해기귀내법전』", "『육조단경』", "Stanley Weinstein, Buddhism under the T'ang (Cambridge University Press, 1987)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: guwen-768
  year: 768
  endYear: 846
  title:
    ko: "한유·유종원의 고문 운동과 당 후기 문학(768~846)"
  summary:
    ko: "당 중기에는 4자와 6자의 대구를 맞추고 전고(典故)로 꾸미는 변려문이 문장의 주류였다. 한유(768~824)와 유종원(773~819)은 한 대 이전의 소박한 산문을 되살리자는 고문(古文) 운동을 주창해 뜻을 분명히 전하는 글을 썼다. 한유는 「원도」에서 요·순에서 공자와 맹자로 이어지는 유교의 도통을 내세웠는데, 이 생각은 송 대 성리학의 선구가 되었다. 「사설」에서는 스승의 도를 중시하며 후학을 가르쳤으니, 고문 운동은 문체를 고치는 일이자 불교·도교에 맞서 유교의 도를 세우려는 운동이기도 했다. 819년 헌종이 법문사에 모신 부처의 손가락뼈를 궁궐로 모시려 하자 한유는 「논불골표」를 올려 불교를 비판하다가 광둥의 조주(潮州)로 쫓겨났고, 그곳에서 악어를 꾸짖는 글도 지었다. 유종원은 영정 혁신에 참여했다가 영주(永州)와 유주(柳州)로 좌천되어 산수를 그린 글을 남겼고(「영정 혁신과 원화 중흥: 번진 억제의 시도(805~821)」(뒤의 사건)), 「포사자설」에서는 뱀을 잡아 세금을 내는 사람의 사연으로 가혹한 세금을 비판했다. 시에서는 백거이(772~846)가 쉬운 말로 사회를 풍자하는 시와 현종과 양귀비를 노래한 「장한가」(806)를 지었고, 그와 원진은 ‘원백’으로 나란히 불렸다. 전기(傳奇) 소설도 이 무렵 자리를 잡아 원진의 『앵앵전』이 대표로 꼽힌다. 만당에는 두목과 이상은이 이름을 날렸다. 고문은 만당에 변려문이 되살아나며 한동안 밀렸으나 북송 중기에 구양수가 이를 다시 이끌었고, 한유와 유종원은 구양수·소식 등과 함께 ‘당송 8대가’로 불렸다. 8대가 가운데 당 사람은 이 둘뿐이다. 과거로 오른 신진 관료가 늘며 글쓰기의 기준이 바뀌고 있었다."
  subjects: [tang]
  tags: [culture]
  sources: ["『구당서』 한유전·유종원전·백거이전", "『신당서』 한유전", "한유, 『한창려집』", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: kentoshi-630
  year: 630
  endYear: 894
  title:
    ko: "견당사와 일본의 당 교류: 아베노 나카마로·구카이·엔닌(630~894)"
  summary:
    ko: "630년 왜는 첫 견당사를 당에 보냈다. 이에 앞서 수에 견수사를 보냈던 왜는 당을 본보기 삼아 율령 국가를 만들려 했다. 7세기 후반 백제를 돕다 백강에서 진 뒤에도 교류는 이어졌고(「백강 전투」(뒤의 사건)), 701년 다이호 율령으로 일본이 율령 체제를 갖춘 뒤 견당사가 다시 파견되었다(「다이호 율령과 국호 '일본'」(뒤의 사건)). 견당사는 해마다 가는 것이 아니라 십여 차례 파견되었다. 7세기에는 한반도 서해안을 따르는 북로를 택했으나 신라와 사이가 나빠진 8세기 이후에는 동중국해를 곧장 건너는 길을 택했다. 사절단은 수백 명이었고 여러 척의 배에 나눠 타 위험이 컸다. 717년에는 기비노 마키비와 유학생 아베노 나카마로(조형)가 당에 건너갔다. 기비노 마키비는 735년 돌아와 당의 학문과 제도를 전했고, 아베노 나카마로는 당의 과거에 급제해 관직에 올라 이백·왕유와도 사귀었다. 그는 753년 귀국하다 표류해 돌아오지 못하고 당에서 죽었으며, 고향의 달을 그리워하며 지었다는 와카가 전한다. 같은 해 귀국선을 탄 감진이 여러 번 실패한 끝에 일본에 닿아 율종을 전했다. 804년의 견당사 편에 구카이와 사이초가 입당해 밀교와 천태를 들여왔고, 838년의 마지막 견당사 때는 엔닌이 따라갔다(「회창 폐불: 무종의 불교 탄압과 엔닌의 목격(842~847)」(뒤의 사건)). 신라 상인의 배도 일본과 당 사이를 오갔다. 894년 스가와라노 미치자네가 당의 혼란과 항해의 위험을 이유로 건의해 견당사 파견은 중지되었다. 일본의 헤이조쿄와 헤이안쿄는 장안을 본떴고, 756년 쇼무 천황의 유품을 모신 쇼소인에는 서역과 당에서 온 물품이 지금도 남아 있다."
  subjects: [wa, japan, tang, silla]
  tags: [diplomacy, culture]
  sources: ["『일본서기』", "『속일본기』", "『구당서』 동이전 일본", "엔닌, 『입당구법순례행기』", "Edwin O. Reischauer, Ennin's Travels in T'ang China (Ronald Press, 1955)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]
