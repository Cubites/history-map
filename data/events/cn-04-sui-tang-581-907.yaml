# 중국 사건 4차 묶음: 수의 건국에서 당 말 황소의 난과 주전충의 대두까지 (581 ~ 905, 작업 cn-04)
# 범위: 수 문제의 건국과 개황의 제도(율령·3성 6부·주현제·대흥성)와 균전제·부병제·과거의 시작, 돌궐의 동서 분열과 계민 카간, 수 양제의 즉위와 대운하, 서역 경영과 토욕혼 정복,
#   수 말의 반란과 이연의 거병, 당의 통일 전쟁, 현무문의 변, 정관의 치, 당의 율령격식·3성 6부, 균전제·조용조·부병제, 이정의 동돌궐 정복과 천가한, 현장의 인도 여행, 송첸감포와 토번,
#   설연타, 고창 멸망·안서도호부·서돌궐 정복, 기미부주와 6도호부, 무후의 부상과 무주 혁명, 개원의 치, 절도사의 등장, 후돌궐과 오르콘 비문, 당·토번의 화친과 전쟁,
#   장안의 국제 교류(소그드·경교·마니교), 광저우의 바닷길 무역, 성당의 시, 이임보와 양귀비, 고선지와 탈라스 전투, 남조, 번진의 할거와 건중의 난, 양세법, 영정 혁신과 원화 중흥,
#   환관·우이당쟁·감로의 변, 위구르 칸국, 토번의 분열과 장의조, 회창 폐불, 소금·차 전매, 당의 불교, 한유의 고문 운동, 견당사, 황소의 난, 주전충과 이극용.
# 깊이: 고등학교 세계사 교과서 본문 수준(summary 800~1,600자)에, 581~907년 지도에서 생기거나 끝난 항목(수·당·돌궐·토번·설연타 등)과 1만 km²를 넘게 바뀐 버전 해를 ±2년 기준으로 subjects에 이음.
# 한국사와 닿는 점: 수 양제 사건에서 고구려 원정(`salsu-612`)과 왜의 견수사, 이정 사건에서 동돌궐 멸망(`eastern-turks-fall-630`), 설연타 사건에서 연개소문의 연합 시도(`tang-borders-618`),
#   기미부주 사건에서 웅진도독부·안동도호부(`goguryeo-falls-668`), 토번 사건에서 `tibet-tuyuhun-662`, 후돌궐·위구르 사건에서 `second-turks-679`·`turks-uyghur-743`·`uyghur-collapse-839`,
#   남조 사건에서 `tianbao-war-750`, 현종 후기와 번진 사건에서 `an-lushan-755`, 현장 사건에서 `hyecho-727`, 황소 사건에서 최치원(`choe-chiwon-894`), 견당사 사건에서 `wa-japan-700`을 가리켰다.
#   한국사 02·03번 파일의 중국 사건(수의 통일·당 건국·안사의 난·당 멸망 등)은 다시 만들지 않았고 사건 글에서는 「제목」으로 가리킨다.
# 사건 연도 규칙: subjects·links의 나라는 사건 기간(year~endYear)과 존재 기간이 겹치면 된다(DATA_GUIDE.md §3).
# 달력: 1912년 앞 중국의 날짜는 음력이다. 월·일 앞에 '음력'을 붙였고 해만 쓴 곳은 음력 연호의 해를 서기로 옮긴 것이다. 음력 11~12월은 양력으로 이듬해 초일 수 있어 달만 적었다.
# 이름 규칙: 신해혁명(1911) 앞 인물은 한자음(이세민·측천무후·주전충), 옛 지명은 한자음(장안·대흥성·강도·송주), 지금도 쓰는 지명은 중국어 표기(뤄양·청두·광저우·투루판), 돌궐·위구르·토번 인명은 굳은 표기(힐리 카간·송첸감포·랑다르마).
# places: 탈라스 등 위치가 학설로 갈리는 싸움은 달지 않았다. 이 시대 중국의 큰 전투는 한국사 파일 사건과 겹쳐 지도 표시 없이 글로만 두었다.
# 서술은 새로 작성. 출처는 사료(『수서』 『구당서』 『신당서』 『자치통감』 등)와 표준 개설서. 병력·사상자·인구는 사료가 과장하는 일이 많아 범위와 '추산'으로 적었다. 운영자 검수 필요.

- id: sui-kaihuang-581
  year: 581
  endYear: 583
  title:
    ko: "수 문제의 건국과 개황의 제도 정비: 율령, 3성 6부, 주현제, 대흥성(581~583)"
  summary:
    ko: "579년 북주 선제가 어린 정제에게 제위를 넘기고 물러났다가 580년 죽자 황후의 아버지 양견이 대승상으로 실권을 쥐었고 울지형 등의 반란을 눌렀다. 581년 음력 2월 정제가 양견에게 제위를 넘겨 수가 섰다(「북주의 화북 통일과 수의 건국」(앞의 사건)). 양견은 수 문제로 즉위해 연호를 개황(開皇)이라 했다. 부인 독고황후와 정사를 의논해 두 사람을 ‘이성(二聖)’이라 불렀다고 하며, 문제는 검소한 생활을 내세워 궁중의 비용을 줄였다고 전한다. 문제는 북주 말의 번잡한 관제와 가혹한 형벌을 손질했다. 먼저 북제의 율을 바탕으로 율령을 새로 정해 태·장·도·유·사의 오형(五刑)을 갖추고, 사형은 교수와 참수 두 가지만 남겨 거열·효수 같은 가혹한 형을 없앴다. 이 율은 개황 3년(583)에 다시 다듬어져 『수서』 형법지는 12편 500조라고 적는다. 중앙에는 상서·문하·내사의 3성을 두고 상서성 밑에 이부·예부·병부·공부와 탁지·도관을 합쳐 6부로 삼았다(탁지는 뒤에 민부로, 도관은 형부로 이름이 바뀐다). 이 3성 6부 체제는 당이 이어받아 완성한다. 지방은 주·군·현의 3단계가 번잡하다는 건의에 따라 583년 군을 없애고 주와 현의 2단계로 줄였다. 도읍은 한 대 장안성이 낡았다 하여 582년 그 동남쪽에 우문개의 설계로 새 도성 대흥성(大興城)을 짓기 시작해 이듬해 옮겨 갔다. 이 성이 당의 장안이 된다. 화폐는 581년 오수전(五銖錢)을 새로 주조해 통일하고 민간의 사사로운 주조를 금했다. 이렇게 틀을 세운 수는 돌궐의 침입을 달래면서(「수의 이간책과 돌궐의 동서 분열: 사발략 카간에서 계민 카간까지(581~603)」(같은 해의 사건)) 남쪽 진을 칠 채비를 갖추었고, 589년 진을 무너뜨린 뒤(「수의 중국 통일」(뒤의 사건)) 이 제도를 남쪽까지 넓혀 하나의 제국에 적용했다."
  subjects: [sui, northern-zhou]
  tags: [politics]
  sources: ["『수서』 고조기", "『수서』 형법지·백관지·식화지", "Arthur F. Wright, The Sui Dynasty: The Unification of China, A.D. 581–617 (Alfred A. Knopf, 1978)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: sui-land-exam-583
  year: 583
  endYear: 609
  title:
    ko: "수의 균전제·부병제와 인재 선발: 호적 정비, 의창, 과거의 시작(583~609)"
  summary:
    ko: "수는 북위 이래의 균전제를 이어받아 성인 남자(정남)에게 곡식을 심는 땅과 상속이 되는 땅을 나누어 주고, 그 대가로 곡식(조租)·베나 비단(조調)·노역(용庸)을 거두었다. 북제 이래의 기준은 정남에게 노전 80무와 영업전 20무를 주는 것이었다. 문제는 583년 정남의 나이를 18세에서 21세로 올리고 해마다 지는 노역을 20일로 줄여 백성의 부담을 덜었다(당시의 세는 나이). 호구를 숨기는 일이 많아 585년 용모를 대조하는 호구 조사(대색모열)를 벌이고, 세액을 정하는 기준(수적법)을 마련해 호적을 바로잡았다. 같은 해 장손평의 건의로 흉년에 쓸 곡식을 쌓아 두는 의창(義倉)을 두었는데, 해마다 가을에 집집이 소출에 따라 곡식을 거두어 마을 창고에 쌓았다. 병역은 서위의 우문태가 만든 부병제를 이었다. 병사는 일반 호적과 따로 군적에 올라 있었는데, 590년 군인과 가족도 주현의 호적에 올려 농사를 지으며 번갈아 복무하게 했다. 관리 선발에서는 문벌을 따지던 구품중정제 대신 중앙이 사람을 뽑는 쪽으로 나아갔다. 587년 각 주에서 해마다 세 사람을 추천하게 했고, 598년(일설 599년)에는 5품 이상 관원과 총관·자사에게 품행과 재간이 뛰어난 사람을 천거하라는 조서를 내렸다. 다만 문제는 601년 국자학 한 곳(학생 72명, 70여 명이라는 서술도 있다)만 남기고 학교를 줄여 유학 교육에는 소극적이었다는 평가도 있다. 수 양제는 607년 열 과목으로 사람을 천거하게 했는데, 진사과가 이때 생겼다는 설(605년설도 있다)이 널리 알려졌으나 시기는 학설이 갈린다. 시험으로 사람을 뽑는 과거(科擧)의 뿌리가 이 무렵에 놓였고, 당에서 틀을 갖추어 1905년까지 이어진다. 호구는 대업 5년(609)에 약 890만 호로 늘었다고 『수서』 지리지는 적는다."
  subjects: [sui]
  tags: [politics, economy]
  sources: ["『수서』 식화지·고조기·양제기", "『수서』 지리지", "Arthur F. Wright, The Sui Dynasty: The Unification of China, A.D. 581–617 (Alfred A. Knopf, 1978)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: turks-split-581
  year: 581
  endYear: 603
  title:
    ko: "수의 이간책과 돌궐의 동서 분열: 사발략 카간에서 계민 카간까지(581~603)"
  summary:
    ko: "돌궐은 552년 부민 카간이 몽골 초원의 유연을 무너뜨리고 세운 유목 제국으로, 동쪽은 카간이 직접 다스리고 서쪽은 부민의 동생 이스테미 계통이 맡아 중앙아시아까지 뻗었다. 572년 즉위한 타스파르 카간 때 돌궐은 북주와 북제가 다투어 바치는 비단 덕에 풍족했다. 581년 타스파르가 죽자 아들 안라(庵羅)와 조카 대라편(뒷날 아파 카간)이 맞섰고, 안라가 힘센 섭도(攝圖)에게 자리를 넘겨 섭도가 사발략(沙鉢略) 카간이 되었다. 서쪽의 달두(達頭) 카간은 아파를 도왔다. 사발략은 아내인 북주의 천금공주를 내세워 복수를 구실로 수를 공격했다. 수는 장손성의 계책에 따라 먼 곳과 손잡고 강한 쪽을 갈라놓는 이간책을 썼다. 장손성은 북주 때 천금공주를 호송하러 돌궐에 다녀온 적이 있어 돌궐 지도자들의 불화를 잘 알았다. 사발략은 582년 수를 크게 침입했으나 달두 카간이 이간책에 넘어가 군사를 물리자 흔들렸고, 583년 음력 4월 백도에서 수군에게 패했다. 583년 사발략이 아파의 진영을 공격하자 아파는 달두에게로 달아났다. 이렇게 583년 무렵 동·서 두 세력이 갈라졌는데(동돌궐의 시작), 599년 달두가 전체 카간을 자처하다 603년 몰락한 뒤에야 분열이 굳어졌다고 보기도 한다. 사발략은 585년 수에 신하를 칭하며 화친을 구했다. 사발략이 587년 죽자 아우 막하(처라후)가, 이어 사발략의 아들 도람이 588년부터 이었다. 수는 597년 종실 여인 안의공주를 염간에게 시집보낸 뒤 599년 염간(이전 칭호 돌리 카간, 629년의 돌리 카간과는 다른 사람)을 계민(啓民) 카간으로 책봉했다. 의성공주가 그 아내가 되었고 계민 카간은 수의 보호 아래 오르도스 북쪽에 자리 잡았다. 달두 카간은 600년 무렵 수에 맞섰으나 603년 철륵의 반란으로 무너지고 서쪽으로 사라졌다. 수는 이 이간책 덕에 북쪽 위협을 줄이고 589년 진을 정복하는 데 힘을 모을 수 있었다. 서돌궐은 그 뒤에도 카간이 이어지며 중앙아시아 오아시스 도시들을 거느렸다(「서돌궐의 분열과 소정방의 정복, 안서도호부의 구자 이전(628~659)」(뒤의 사건))."
  subjects: [gokturk, eastern-turks, sui]
  tags: [diplomacy, war]
  sources: ["『수서』 돌궐전·장손성전", "『북사』 돌궐전", "Pan Yihong, Son of Heaven and Heavenly Qaghan: Sui-Tang China and Its Neighbors (Western Washington University, 1997)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: grand-canal-605
  year: 604
  endYear: 610
  title:
    ko: "수 양제의 즉위와 뤄양 건설, 대운하(604~610)"
  summary:
    ko: "604년 음력 7월 문제가 죽자 둘째 아들 양광(楊廣)이 즉위했다. 그는 600년 형 양용이 태자에서 쫓겨난 뒤 태자가 된 사람이었다. 수 양제는 이듬해부터 연호를 대업(大業)으로 쓰며 대규모 공사를 벌였다. 문제 때 호구가 늘고 창고가 가득 찬 것이 그 밑천이었다. 문제도 584년 장안과 황허강을 잇는 광통거를 파서 웨이허강으로 곡식을 날랐다. 양제는 605년 뤄양에 새 도성을 짓게 해 한 달에 200만 명을 부렸다고 『자치통감』은 적고, 이듬해 완성된 이곳을 동경으로 삼아 정치의 무게를 동쪽에 두었다. 같은 605년 황허강에서 화이허강으로 통하는 통제거(通濟渠)를 파고 화이허강에서 창장강으로 이어지는 한구를 손보았다. 한구는 춘추 시대 오 왕 부차가 처음 팠다고 전하는 물길이다. 사료는 이 공사에 하남·화이허강 북쪽 백성 100여만 명이 동원되었다고 쓴다. 608년에는 하북의 남녀 100여만 명을 불러 황허강에서 탁군(지금의 베이징 부근)에 이르는 영제거(永濟渠)를 파고, 610년 창장강 남쪽의 경구에서 여항(지금의 항저우)에 이르는 강남하를 열었다. 이렇게 뤄양을 가운데 두고 북쪽 탁군과 남쪽 항저우를 잇는 물길이 이어져 황허강·화이허강·창장강·첸탕강의 수계가 하나로 묶였다. 양제는 605년 용선을 타고 강도(지금의 양저우)까지 내려가 유람하기도 했다. 운하 양쪽에는 길을 내고 버드나무를 심게 했다고 전한다. 남쪽의 곡식을 북쪽으로 나르는 길이 열려 이 운하는 훗날 당·송·원·명 시대에도 고쳐 쓰였고, 당 후기에는 강남의 세금과 소금이 이 길로 장안과 뤄양에 올랐다. 그러나 공사에 동원된 백성의 사망이 많았다고 사료는 전하며, 거듭된 징발과 노역은 원망을 샀다."
  subjects: [sui]
  tags: [politics, economy]
  sources: ["『수서』 양제기·식화지", "『자치통감』 수기", "Victor Cunrui Xiong, Emperor Yang of the Sui Dynasty: His Life, Times, and Legacy (SUNY Press, 2006)", "Arthur F. Wright, The Sui Dynasty: The Unification of China, A.D. 581–617 (Alfred A. Knopf, 1978)"]

- id: sui-west-607
  year: 607
  endYear: 610
  title:
    ko: "수 양제의 서역 경영과 토욕혼 정복, 주변국과의 교섭(607~610)"
  summary:
    ko: "수 양제는 즉위 뒤 사방으로 영향력을 넓혔다. 서역 사정에 밝은 배구(裴矩)는 서역 44개국의 산천과 풍속, 물산을 그림으로 그린 『서역도기』를 양제에게 바쳤다. 배구는 장예에서 서역 상인을 만나 정보를 모으는 일도 맡았다. 양제는 이를 보고 교역로를 열려 했고, 토욕혼이 그 길목을 막고 있었다. 토욕혼의 카간 복윤(伏允)은 칭하이 일대를 차지한 선비계 유목 국가를 이끌었다. 608~609년 수군이 복윤을 쳤고 609년 양제가 직접 서쪽으로 나서자 복윤은 사막으로 달아났다. 이오(지금의 하미)도 이 무렵 수에 복속했다. 수는 그 땅에 서해·하원·차말·선선의 4군을 두었다. 이로써 수의 영역은 칭하이호에서 지금의 신장 남부(차말·선선)까지 이르렀다. 같은 해 양제는 장예(張掖)에서 서역 27개국의 사절을 만나 큰 연회를 열었다고 한다. 이 일은 훗날 비단길 교역이 번성하는 바탕이 되었다. 복윤은 뒤에 수 말의 혼란을 틈타 옛 땅을 되찾았다. 동쪽과 남쪽에서도 팽창은 이어졌다. 605년 임읍(지금의 베트남 중남부)을 치고 607년부터 유구를 원정했다(유구가 지금의 타이완인지 오키나와인지는 설이 갈린다). 607년 왜의 사신 오노노 이모코가 가져온 국서에 ‘해 뜨는 곳의 천자가 해 지는 곳의 천자에게 글을 보낸다’는 구절이 있자 양제는 격식에 어긋난다며 불쾌해했지만, 이듬해 답례 사절을 보냈다고 『수서』는 적는다. 같은 607년 양제는 동돌궐 계민 카간의 장막에서 고구려 사신을 보고 고구려 왕의 입조를 요구했고, 이것이 612년 이후의 고구려 원정(「살수 대첩」(뒤의 사건))으로 이어졌다. 수의 영역은 609년 무렵 서쪽으로 가장 넓었다. 그러나 이런 대외 사업은 나라의 재정과 백성에게 큰 짐이 되었고, 지배는 오래 이어지지 못했다."
  subjects: [sui, tuyuhun, eastern-turks, wa, goguryeo]
  links:
    - { from: sui, to: tuyuhun, note: "토욕혼 정복과 4군 설치(609)" }
  tags: [war, diplomacy]
  sources: ["『수서』 양제기·서역전·동이전 왜국", "『수서』 배구전", "『자치통감』 수기", "Victor Cunrui Xiong, Emperor Yang of the Sui Dynasty: His Life, Times, and Legacy (SUNY Press, 2006)"]

- id: sui-collapse-611
  year: 611
  endYear: 618
  title:
    ko: "수 말의 반란과 이연의 거병: 왕박·와강군·두건덕에서 양제 시해까지(611~618)"
  summary:
    ko: "대운하와 뤄양 건설에 이어 고구려 원정까지 거듭되자 징발과 노역에 시달린 농민이 일어났다. 611년 산둥의 왕박(王薄)이 장백산에서 봉기하며 원정에 가지 말라는 노래를 퍼뜨렸고, 큰 홍수와 기근이 겹쳐 봉기가 하북·산둥·화이허강 일대로 번졌다. 원정에서 정예를 잃은 수는 곳곳의 반란을 누를 병력이 모자랐다. 612년 정월 출정한 고구려 원정군은 『수서』가 113만여 명이라 적는데 과장이 섞였다고 본다. 양제는 614년까지 세 번 고구려를 쳤지만 이기지 못했다(「살수 대첩」(뒤의 사건)). 613년에는 예부상서 양현감이 원정 중인 양제의 뒤에서 뤄양을 노리고 반란을 일으켰다가 졌고, 양제는 원정을 접고 돌아왔다. 616년 양제는 강도(양저우)로 내려가 뤄양과 장안으로 돌아오지 못했다. 617년 적양과 이밀의 와강군(瓦崗軍)이 뤄양 곁의 낙구창을 차지해 곡식을 풀었고, 하북에서는 두건덕이 세력을 키웠다. 한편 타이위안 유수 이연은 617년 음력 5월 차남 이세민 등과 군사를 일으켜 동돌궐과 화친해 후방을 다진 뒤 그해 음력 11월 장안을 차지했다. 이연은 양제를 상황으로 올리고 양제의 손자 양유(공제)를 세웠다. 이연은 수의 관직을 지낸 귀족 가문 출신이었다. 618년 음력 3월 강도에서 우문화급이 정변을 일으켜 양제를 죽였고, 뤄양에서는 또 다른 손자 양동이 황제에 올랐다. 음력 5월 이연은 공제의 선양을 받아 당을 세웠다(「수 멸망과 당 건국」(뒤의 사건)). 이밀은 뤄양을 압박하다 왕세충에게 크게 져서 그해 당에 투항했다. 수는 문제가 세운 지 40년이 안 되어 무너졌다. 이 짧은 왕조가 닦은 제도와 운하는 거의 그대로 당에 넘어갔다."
  subjects: [sui, tang, goguryeo, eastern-turks]
  tags: [war, politics]
  sources: ["『수서』 양제기·양현감전", "『구당서』 고조본기", "『자치통감』 수기", "Victor Cunrui Xiong, Emperor Yang of the Sui Dynasty: His Life, Times, and Legacy (SUNY Press, 2006)"]

- id: tang-unification-618
  year: 618
  endYear: 628
  title:
    ko: "당의 통일 전쟁: 설거·유무주·왕세충·두건덕에서 양사도까지(618~628)"
  summary:
    ko: "618년 음력 5월 이연(고조)이 즉위해 연호를 무덕(武德)이라 했으나 당의 땅은 관중(지금의 산시陝西)과 산시山西 일부뿐이었고, 각지에는 수 말에 일어난 세력이 남아 있었다. 전쟁은 둘째 아들 진왕 이세민이 주로 이끌었다. 진숙보·위지경덕 같은 투항 장수가 이세민 밑에서 활약했고, 당은 항복한 군웅과 그 부하를 후하게 대우해 관직을 주었다. 먼저 금성(지금의 간쑤 란저우)에서 서진의 패왕을 칭한 설거(薛擧)가 618년 음력 8월에 죽고, 아들 설인고가 같은 해 음력 11월 천수원(淺水原)에서 크게 져서 항복했다. 이어 동돌궐의 도움을 받아 한때 산시(山西) 대부분과 타이위안까지 차지했던 마읍의 유무주(劉武周)를 620년 산시에서 몰아냈다. 619년 수의 월왕 양동을 폐위하고 정(鄭)을 세운 뤄양의 왕세충(王世充)을 621년 포위하자, 하북에서 618년 하(夏)를 세웠던 두건덕이 군대를 이끌고 구원에 나섰다. 이세민은 음력 5월 호뢰에서 두건덕을 사로잡았고 왕세충도 항복했으며, 두 사람은 장안에 보내졌다. 두건덕의 옛 부하 유흑달이 621년 가을 하북에서 다시 일어나 622년 봄 한동왕을 칭했다. 이세민에게 한 번 져 돌궐로 달아났다가 돌궐군과 돌아왔으나, 이건성과 이원길의 공격에 보급이 끊겨 623년 봄 사로잡혀 처형되었다. 강남에서는 이효공이 621년 양(梁)을 칭하며 강릉에 도읍한 소선을 무너뜨린 데 이어, 623년 가을 단양에서 송을 칭하며 일어난 보공석을 624년 평정했다. 마지막으로 동돌궐의 도움을 받던 삭방의 양사도(梁師都)가 628년 음력 4월에 무너져 당은 통일을 마쳤다. 이 과정에서 이세민은 많은 인재를 막하에 모았고 군대도 직접 거느리게 되어 형 이건성과의 갈등이 깊어졌다. 갈등은 626년의 정변(「현무문의 변과 당 태종의 즉위(626)」(뒤의 사건))으로 이어진다. 한편 당은 통일 전쟁 내내 북쪽의 동돌궐에게 신하를 칭하거나 선물을 주며 침입을 막아야 했다."
  subjects: [tang, sui, eastern-turks]
  tags: [war]
  sources: ["『구당서』 고조본기·태종본기", "『신당서』 고조본기", "『자치통감』 당기", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: xuanwu-gate-626
  year: 626
  title:
    ko: "현무문의 변과 당 태종의 즉위(626)"
  summary:
    ko: "당 고조 이연의 맏아들 이건성은 태자였고, 둘째 이세민은 통일 전쟁의 공으로 진왕이 되어 막료와 군대를 거느렸다. 이세민은 621년 천책상장이라는 높은 직함을 받았고 문학관을 열어 18학사를 비롯한 인재를 모았다. 넷째 이원길은 태자 편에 섰다. 태자와 이원길은 궁중의 후궁과 대신을 끌어들여 이세민을 견제했고, 이세민의 막료 방현령과 두여회도 쫓아냈다. 626년 돌궐이 쳐들어오자 이세민 휘하의 정예를 원길 밑으로 돌려 힘을 빼려 했다. 이세민은 장손무기·위지경덕 등과 먼저 손을 쓰기로 했다. 태자가 이세민에게 독이 든 술을 먹이려 했다는 이야기도 전하나 사료의 신빙성은 의문이다. 『자치통감』에 따르면 이세민은 먼저 고조에게 태자와 원길의 비행을 아뢰었고, 고조는 이튿날 세 아들을 불러 따지겠다고 했다. 626년 음력 6월 4일 이세민은 궁궐 북문인 현무문 부근에서 입궐하던 이건성과 이원길을 죽였다. 이세민이 건성을 활로 쏘았고 위지경덕이 원길을 쏘아 죽였다고 전한다. 건성과 원길의 아들들도 죽임을 당했으나 그 밑에 있던 사람들은 곧 사면되어, 건성의 참모였던 위징도 태종에게 중용되었다. 고조는 이세민을 태자로 세웠고, 음력 8월 상황으로 물러나 이세민이 즉위했다(당 태종). 이 무렵 동돌궐의 힐리 카간이 웨이허강 가까이까지 쳐들어오자 태종은 웨이허강의 편교에서 화친을 맺어 물러가게 했다. 연호는 이듬해(627) 정관(貞觀)으로 바뀐다. 이 사건의 기록은 태종 때 사관이 정리한 것이라 건성과 원길을 나쁘게 쓰고 태종의 행동을 정당화했다는 의심이 있다. 태종의 치세는 「정관의 치: 위징과 재상들, 정관 연간의 통치와 『정관정요』(627~649)」(뒤의 사건)로 이어진다."
  subjects: [tang, eastern-turks]
  tags: [politics]
  sources: ["『구당서』 태종본기·건성원길전", "『자치통감』 당기 무덕 9년", "Howard J. Wechsler, Mirror to the Son of Heaven: Wei Cheng at the Court of T'ang T'ai-tsung (Yale University Press, 1974)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: zhenguan-627
  year: 627
  endYear: 649
  title:
    ko: "정관의 치: 위징과 재상들, 정관 연간의 통치와 『정관정요』(627~649)"
  summary:
    ko: "정관(貞觀)은 태종이 즉위한 이듬해인 627년부터 649년까지 쓴 연호다. 태종은 신하의 간언을 잘 들은 군주로 이름났다. 곁에는 직언을 서슴지 않은 위징(魏徵)이 있었고, 방현령과 두여회가 재상으로서 국정을 맡았다(두여회는 630년에 죽었다). 처남 장손무기도 중용되었다. 태종은 위징이 643년 죽자 구리 거울로 의관을, 옛일로 흥망을, 사람으로 잘잘못을 안다며 거울 하나를 잃었다고 탄식했다고 한다. 627년 천하를 산천의 형세에 따라 10도로 나누어 감찰의 단위로 삼았고, 637년에는 정관율령을 정비하고 도교를 불교보다 앞세우라는 조서를 내렸다. 공영달 등은 유교 경전의 해석을 통일한 『오경정의』를 짓기 시작해 고종 때 완성했고, 이 책은 과거 시험의 기준이 되었다. 『자치통감』은 정관 4년(630) 천하에서 사형을 집행한 사람이 29명뿐이었고 곡식값이 한 말에 서너 푼으로 떨어질 만큼 풍년이 이어졌다고 적는다. 대외로는 630년 동돌궐을 무너뜨려 ‘천가한’으로 추대되었고(「이정의 동돌궐 정복과 ‘천가한’(629~630)」(뒤의 사건)), 641년 문성공주를 토번에 시집보냈다(「송첸감포와 토번의 통일, 문성공주의 혼인(629~650)」(뒤의 사건)). 만년에는 태자 승건이 643년 모반에 연루되어 폐위되었고, 645년의 고구려 원정은 안시성을 넘지 못하고 돌아왔다(「안시성 전투」(뒤의 사건)). 태종은 649년 죽고 아들 고종이 뒤를 이었다. 태종과 신하의 문답을 엮은 『정관정요』는 오긍(吳兢)이 8세기 초에 편찬해 뒷날 군주의 본보기로 읽혔으나, 정관의 치를 이상화한 면이 있다는 평가가 있다. 『자치통감』에는 태종이 사관이 쓴 자신의 기록을 보려다 간관의 반대로 물러났고, 뒤에 방현령이 실록을 올릴 때 현무문의 변에 관한 부분을 고쳐 쓰게 했다는 이야기도 실려 있다(「현무문의 변과 당 태종의 즉위(626)」(앞의 사건))."
  subjects: [tang, goguryeo]
  tags: [politics]
  sources: ["『구당서』 태종본기·위징전", "『자치통감』 당기", "오긍, 『정관정요』", "Howard J. Wechsler, Mirror to the Son of Heaven: Wei Cheng at the Court of T'ang T'ai-tsung (Yale University Press, 1974)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: tang-law-624
  year: 624
  endYear: 737
  title:
    ko: "당의 율령격식과 3성 6부: 무덕율령에서 개원 25년 개정까지(624~737)"
  summary:
    ko: "당은 법을 율(형법)·령(제도의 규정)·격(황제의 칙을 모은 것)·식(시행 세칙)의 네 가지로 나누어 다스렸다. 618년부터 배적 등이 편찬을 맡아 624년 고조가 무덕 연간의 율령을 반포했고, 정관 11년(637)에 다시 정비했으며, 고종 때인 651년 영휘 율령을 고치고 653년 장손무기 등이 조문마다 주석을 단 『영휘율소』를 냈다. 이것이 오늘 전하는 『당률소의』(30권 12편 502조)의 바탕이다. 형벌은 태·장·도·유·사의 5형으로 나누었는데, 태는 회초리 10~50대, 장은 60~100대, 도는 1~3년의 노역, 유는 2,000~3,000리 밖 유배였고 사형은 교수와 참수였다. 모반이나 불효 같은 가장 무거운 죄 열 가지(십악)는 따로 정했다. 마지막 대규모 개정은 개원 25년(737)에 있었다. 중앙의 행정은 3성 6부 체제로 돌아갔다. 중서성이 황제의 뜻을 받아 조칙의 초안을 짓고, 문하성이 이를 심의해 잘못이 있으면 돌려보냈으며, 상서성이 이부·호부·예부·병부·형부·공부의 6부를 거느리고 집행했다. 상서성의 최고 장관인 상서령은 태종이 즉위 전에 맡았던 자리라 비워 두었고, 부장관인 좌·우복야가 실제 우두머리 구실을 했다. 재상은 중서령·시중을 중심으로 한 합의체였고, 다른 관원도 ‘동중서문하평장사’ 같은 직함을 더해 재상의 일에 참여시켰다. 관리 선발은 이부(문관)와 병부(무관)가 맡았고, 후보자를 용모·말씨·글씨·판단력(신언서판)으로 평가했다. 지방은 주와 현을 기본 단위로 하고 그 위에 감찰용의 도(道)를 두었다. 당률은 일본의 율령(「다이호 율령과 국호 '일본'」(뒤의 사건))과 신라·발해, 뒷날 베트남의 법에도 본보기가 되었다."
  subjects: [tang, japan, silla, balhae]
  tags: [politics]
  sources: ["『당률소의』", "『신당서』 백관지·형법지", "『구당서』 형법지", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: tang-land-army-624
  year: 624
  endYear: 749
  title:
    ko: "당의 균전제·조용조·부병제와 그 무너짐(624~749)"
  summary:
    ko: "624년 고조는 균전제와 조용조의 법을 반포했다. 규정으로는 성인 남자(정남) 한 사람에게 100무를 주되 20무는 대를 이어 가질 수 있는 영업전, 나머지 80무는 죽으면 나라에 돌려주는 구분전이었다. 관리는 품계에 따라 더 많은 영업전을 받았고, 땅이 모자란 좁은 지방(협향)에서는 규정량의 절반만 받았다. 그 대가로 조(곡식 2석)·조(調, 비단 2장과 솜 3량 또는 이에 상당한 베와 삼)·용(노역 20일, 대신 비단으로 낼 수 있었다)을 냈다. 병역은 전국에 설치한 절충부(折衝府)의 부병이 맡았다. 부병은 평소에 농사를 짓다가 순번을 정해 수도의 숙위를 서고 전쟁에는 나갔으며, 무기와 식량을 스스로 마련했고 가호는 조용조를 면제받았다. 절충부는 관중 일대에 특히 많았다. 균전제도 전국에 일률적으로 시행된 것은 아니어서 투루판 같은 곳과 중원의 사정이 달랐다. 영업전은 원칙적으로 사고팔 수 없었으나 이사나 장례처럼 사정이 있을 때는 팔 수 있어 실제로는 매매가 흔해졌다. 7세기 말부터 세력가가 땅을 사들이고 농민이 도망해 호적에서 빠지면서 나눠 줄 땅이 모자랐고, 투루판에서 나온 문서에도 규정대로 땅을 받지 못한 사례가 보인다. 721년 우문융은 호적에서 빠진 호를 찾아내는 괄호(括戶) 정책을 폈다. 국경이 길어지자 부병의 복무가 길어져 도망이 늘었다. 이에 723년 장열의 건의로 장정을 모집해 수도에 두었고, 737년에는 변경의 군인도 모집하기로 했다. 749년에는 절충부에 징발할 병사가 없는 지경이 되었다고 『자치통감』은 적는다. 땅을 나눠 주고 세금과 병역을 지우는 이 틀은 무너졌고, 780년 양세법(「양세법의 시행(780)」(뒤의 사건))이 이를 대신한다."
  subjects: [tang]
  tags: [economy, society]
  sources: ["『구당서』 식화지·병지", "『신당서』 식화지·병지", "『자치통감』 당기", "Denis Twitchett, Financial Administration under the T'ang Dynasty (2판, Cambridge University Press, 1970)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: turks-heaven-khagan-629
  year: 629
  endYear: 630
  title:
    ko: "이정의 동돌궐 정복과 ‘천가한’(629~630)"
  summary:
    ko: "620년 형 처라 카간(619~620)의 뒤를 이은 힐리 카간은 해마다 당의 변경을 침범했다. 627~628년 철륵 여러 부가 동돌궐에서 떨어져 나가고 폭설로 가축이 크게 죽는 가운데 내부 불만이 쌓였고, 카간의 조카 돌리 카간(시필 카간의 아들)도 등을 돌려 당에 붙었다. 당 태종은 629년 음력 11월 이정과 이적(이세적), 시소 등에게 10여만의 군사를 맡겨 북쪽으로 보냈다. 630년 음력 정월 이정이 정양을 밤에 기습하고 철산에서 힐리 카간을 무너뜨려 음력 3월 붙잡아 장안으로 보냈다(전투는 「동돌궐 멸망」(뒤의 사건)에서 다룬다). 『자치통감』에 따르면 이 승리 뒤 서북의 여러 족장이 태종을 ‘천가한’(하늘의 카간)으로 받들었고, 태종은 이후 중국 황제와 유목민의 카간을 겸한 지위로 불렸다. 이 칭호는 이후 당 황제가 사방의 군장에게 보내는 국서에도 쓰였다. 당은 투항한 돌궐인을 장성 안팎에 흩어 살게 하고 부족장 상당수를 장군과 관리로 썼는데, 『자치통감』은 5품 이상에 오른 돌궐인이 100여 명으로 조정 관원의 절반에 가까웠다고 적는다. 돌리 카간은 순주 도독에 임명되었고, 장안에 들어와 산 돌궐인이 1만 가구 가까이에 이르렀다고 『자치통감』은 적지만 『구당서』는 수천 가구로 적는다. 힐리는 634년 장안에서 죽었고, 이정은 이 공으로 뒷날 위국공에 봉해졌다. 이 원정에 참여한 이적은 668년 고구려를 멸망시킨 당군의 총사령이기도 하다(「고구려 멸망」(뒤의 사건)). 초원의 북쪽은 철륵계 설연타가 차지했다(「설연타의 흥기와 철륵 제부의 귀속: 이남 카간에서 연연도호부까지(628~647)」(앞의 사건)). 돌궐은 50년 남짓 뒤 골돌록 아래에서 다시 일어난다(「후돌궐의 성립과 거란의 난」(뒤의 사건))."
  subjects: [tang, eastern-turks, xueyantuo]
  links:
    - { from: tang, to: eastern-turks, note: "동돌궐 정복(630)" }
  tags: [war, diplomacy]
  sources: ["『구당서』 돌궐전·이정전", "『자치통감』 당기 정관 3~4년", "Pan Yihong, Son of Heaven and Heavenly Qaghan: Sui-Tang China and Its Neighbors (Western Washington University, 1997)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: xuanzang-629
  year: 629
  endYear: 664
  title:
    ko: "현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)"
  summary:
    ko: "현장(玄奘)은 뤄양 부근에서 태어나 13세에 출가했고 뤄양·청두·장안 등을 돌며 공부하다 불교 경전의 번역과 해석이 어긋나는 데 의문을 품어 인도에 가서 원전을 구하기로 했다. 국경을 넘는 일이 금지되어 있었으나 629년(일설 627년) 몰래 장안을 떠났다. 투루판의 고창국 왕 국문태가 소개 서신과 여비를 주어 도왔고, 쇄엽(옛 토카마크)에서는 서돌궐의 통엽호 카간이 서신을 써 주어 중앙아시아 여러 나라를 지나기가 쉬웠다. 현장은 간다라를 거쳐 인도에 닿아 나란다 사원에서 계현에게 5년 가까이 유식학을 배웠고, 카나우지에서 열린 계일왕(하르샤)의 큰 법회에서 이름을 떨쳤다고 전한다. 645년 음력 정월 불상과 경전 657부를 가지고 장안에 돌아오자 방현령 등이 맞이했고, 고구려 원정을 준비하던 태종은 뤄양에서 그를 만났다. 경전은 말 스무 마리에 실을 만큼 많았다고 한다. 불법 출국을 문제 삼기는커녕 태종은 그를 극진히 대접하며 환속해 관직에 나서라고 권했으나 현장은 사양하고 번역에 전념했다. 태종의 요청으로 제자 변기와 함께 직접 다닌 110개국과 전해 들은 28개국을 기록한 『대당서역기』 12권을 646년에 완성했다. 이 책은 바미얀 석불 같은 유적을 포함해 7세기 인도와 중앙아시아 연구의 기본 사료이고, 훗날 소설 『서유기』의 바탕이 되기도 했다. 현장은 홍복사(弘福寺)·대자은사에서 번역에 힘써 664년 죽기까지 70여 부 1,300여 권을 옮겼는데, 구마라습의 옛 번역과 구별해 신역(新譯)이라 부른다. 652년에는 경전을 보관할 대안탑이 세워졌다. 그의 제자로 신라 승려 원측이 알려져 있다. 한국사에서는 약 90년 뒤 혜초가 인도를 여행했다(「혜초의 『왕오천축국전』」(뒤의 사건))."
  subjects: [tang, silla]
  tags: [culture, religion]
  sources: ["현장·변기, 『대당서역기』", "혜립·언종, 『대당대자은사삼장법사전』", "Li Rongxi 옮김, The Great Tang Dynasty Record of the Western Regions (Numata Center for Buddhist Translation and Research, 1996)", "Sally Hovey Wriggins, Xuanzang: A Buddhist Pilgrim on the Silk Road (Westview Press, 1996)"]

- id: songtsen-gampo-629
  year: 629
  endYear: 650
  title:
    ko: "송첸감포와 토번의 통일, 문성공주의 혼인(629~650)"
  summary:
    ko: "티베트 고원 남동쪽 야룽 계곡의 야룽 왕가는 7세기 초 나므리 송첸 때 쑴파 등 이웃을 아우르며 힘을 키웠다. 나므리 송첸이 죽자 아들 송첸감포가 왕위에 올랐다(즉위를 618년 또는 629년으로 보는 학설이 갈린다). 송첸감포는 장중 등 고원의 여러 세력을 아울러 토번을 세우고 근거지를 라싸 일대에 두었다. 전승은 대신 퉁미 삼보타가 인도 문자를 바탕으로 티베트 문자를 만들었다고 전하지만 후대 전설이 섞여 있다고 본다. 토번 초기의 연대는 둔황에서 나온 티베트어 『연대기』 같은 문서로 전해진다. 토번은 634년 당에 처음 사신을 보냈고, 송첸감포는 토욕혼과도 부딪쳤다. 토욕혼은 635년 당에 복속했다. 638년 무렵 당의 송주(지금의 쓰촨 쑹판)를 공격했다가 물러난 그는 640년 대신 가르 퉁첸을 장안에 보내 혼인을 청했고, 641년 태종은 종실 여인 문성공주를 시집보내 강하왕 이도종이 호송했다. 『구당서』는 당이 처음 혼인을 거절하자 송첸감포가 송주를 공격했다고 적고, 가르 퉁첸은 금 5,000냥과 보물을 예물로 가져갔다고 한다. 송첸감포는 하원에서 직접 신부를 맞이했다고 하며, 『구당서』는 그가 당 황실의 사위로서 예를 갖췄다고 적는다. 문성공주와 함께 불교와 중국의 기술·문물이 들어왔다고 전하며, 네팔 공주 브리쿠티와의 혼인과 조캉 사원 건립도 전승되나 사료에 따라 사정이 갈린다. 송첸감포는 649년 또는 650년 죽었고, 고종은 즉위 직후 그를 부마도위 서해군왕에 봉했다고 『구당서』는 적는다. 아들 궁송궁첸이 먼저 죽어(일설 640년 무렵) 손자 망송망첸이 뒤를 이었고, 문성공주는 라싸에서 약 40년을 살다 680년 죽었다. 토번은 이 뒤 토욕혼을 병합하고 당과 서역을 다투는 큰 나라로 자랐다(「토번의 토욕혼 병합과 대비천 전투」(뒤의 사건))."
  subjects: [tibet, tang, tuyuhun]
  tags: [politics, diplomacy]
  sources: ["『구당서』 토번전", "『신당서』 토번전", "Christopher I. Beckwith, The Tibetan Empire in Central Asia (Princeton University Press, 1987)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: xueyantuo-628
  year: 628
  endYear: 647
  title:
    ko: "설연타의 흥기와 철륵 제부의 귀속: 이남 카간에서 연연도호부까지(628~647)"
  summary:
    ko: "설연타는 철륵 계통 연타 부를 중심으로 설 부 등이 합쳐진 유목 집단으로, 수 말부터 동돌궐에 눌려 지냈다. 627년 철륵 여러 부가 동돌궐에 맞서 일어나자 연타의 추장 이남(夷男)이 추대되었다. 이남은 당 태종의 책봉을 받아 진주비가 카간이 되었고(즉위 연도는 628년 무렵으로 본다), 태종은 북과 큰 깃발을 내려 책봉했다. 당은 설연타를 책봉해 동돌궐을 견제하려 했다. 근거지는 울독군산(지금의 몽골 항가이산맥 부근) 곁이었다. 『신당서』에 따르면 영역이 동쪽은 말갈, 서쪽은 서돌궐, 남쪽은 사막, 북쪽은 한해(바이칼 호 일대)에 이르렀고 병력이 20만이라 불렸다. 630년 동돌궐이 무너지자(「이정의 동돌궐 정복과 ‘천가한’(629~630)」(뒤의 사건)) 설연타는 몽골 초원 북부를 차지해 당 북쪽의 새 강국이 되었다. 당은 이남의 강성을 경계해 혼인을 허락하는 듯하다 거두어 틈이 벌어졌다. 641년 이남의 아들 대도설이 20만의 대군으로 사막 남쪽을 노렸으나 당군에 패했다. 이남이 645년 죽자 아들 발작(拔灼)과 예망이 다투었고, 발작이 예망을 죽이고 다미 카간(645~646)이 되었다. 646년 이도종·아사나사이 등이 이끈 당군이 치고 회흘 추장 토미도의 철륵 부족이 반란해 발작을 죽였으며, 남은 무리가 세운 돌마지(이특물실 카간)도 당에 항복해 설연타가 무너졌다. 이보다 앞서 645년 고구려의 연개소문이 설연타와 손잡으려다 실패했다(「당의 주변 정리와 고구려 원정 준비」(앞의 사건)). 철륵 추장들은 646년 영주(靈州)에서 태종을 만나 630년에 이어 다시 ‘천가한’으로 높였다고 한다. 철륵의 회흘·복골·동라·발야고 등 여러 부는 647년 당에 귀속해 부족마다 주(州)가 되었고, 당은 회흘 추장 토미도를 한해 도독에 임명했다. 이 부들은 연연도호부(뒤의 안북도호부)가 다스렸다. 철륵 계통의 회흘은 뒷날 위구르 칸국을 세운다."
  subjects: [xueyantuo, eastern-turks, tang, anbuk-dohobu, goguryeo]
  links:
    - { from: tang, to: xueyantuo, note: "설연타 멸망(646)" }
    - { from: tang, to: anbuk-dohobu, note: "연연도호부 설치(646~647)" }
  tags: [war, politics]
  sources: ["『구당서』 철륵전·설연타전", "『신당서』 회흘전·설연타전", "『자치통감』 당기 정관 15년·20년·21년", "Pan Yihong, Son of Heaven and Heavenly Qaghan: Sui-Tang China and Its Neighbors (Western Washington University, 1997)"]

- id: tang-west-640
  year: 640
  endYear: 649
  title:
    ko: "당의 서역 진출: 고창 멸망과 안서도호부, 구자 정복과 안서 4진(640~649)"
  summary:
    ko: "서역으로 가는 길목의 투루판 분지에는 한인 이주민이 세운 고창국(국씨)이 있었다. 국씨는 6세기 초부터 이곳을 다스리며 한인 문화의 전통을 이었다. 고창의 왕 국문태는 당과 교역하면서도 서돌궐과 손잡고 서역 사절의 길을 막았다고 한다. 640년 당 태종은 후군집에게 군사를 주어 고창을 쳤고, 국문태는 당군이 오기도 전에 죽고 아들 국지성이 항복했다. 당은 그 땅에 서주(西州)를 두고 교하성(지금의 야르호타 유적)에 안서도호부를 세워 서역 경영의 거점으로 삼았다. 서주에는 한인과 소그드인 마을이 섞여 있었고, 투루판 아스타나 고분에서 나온 문서는 서주의 호적과 세금, 군사 사정, 그리고 균전제와 부병제가 시행되었음을 알려 준다. 상인이 오갈 때는 통행 증서(과소)가 필요했다. 이어 서쪽의 언기를 644년에 쳤는데, 언기 왕이 서돌궐과 가까워 당에 조공을 소홀히 한 것이 이유였다. 당에 신하로 굴복했던 구자(쿠차)도 서돌궐 쪽으로 기울자 648년 아사나사이가 이끈 원정군이 언기를 다시 치고 구자를 포위했으며, 구자는 음력 정관 22년 12월(양력으로는 649년 1월)에 항복해 왕이 사로잡혀 장안으로 보내졌다. 이 승리로 당은 649년 구자·우전·소륵·언기에 군진을 두는 안서 4진 체제를 갖추었다(679년 무렵부터는 언기 대신 쇄엽을 꼽는다). 안서 4진을 둘러싼 토번과의 다툼은 이곳이 비단길의 요충이었기 때문이다. 안서도호부는 658년 다시 구자로 옮겨 서역 경영의 중심이 되었으나(「서돌궐의 분열과 소정방의 정복, 안서도호부의 구자 이전(628~659)」(앞의 사건)), 670년 토번이 4진을 빼앗는 등(「토번의 토욕혼 병합과 대비천 전투」(뒤의 사건)) 서역의 지배는 토번과의 다툼 속에 오르내렸다. 현장은 고창이 무너지기 전에 이곳을 지나갔다(「현장의 인도 여행과 경전 번역: 『대당서역기』(629~664)」(앞의 사건))."
  subjects: [tang, tibet]
  tags: [war]
  sources: ["『구당서』 서융전 고창·구자", "『신당서』 서역전", "『자치통감』 당기 정관 13~22년", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)", "Valerie Hansen, The Silk Road: A New History (Oxford University Press, 2012)"]

- id: western-turks-657
  year: 628
  endYear: 659
  title:
    ko: "서돌궐의 분열과 소정방의 정복, 안서도호부의 구자 이전(628~659)"
  summary:
    ko: "583년 돌궐이 동서로 갈라지고 603년 달두 카간이 무너진 뒤에도(「수의 이간책과 돌궐의 동서 분열: 사발략 카간에서 계민 카간까지(581~603)」(앞의 사건)) 서쪽에서 이어진 서돌궐은 통엽호 카간(재위 618년 무렵~628) 때 가장 강성해 천산과 중앙아시아의 오아시스 도시들을 거느렸다. 통엽호는 소그드와 이란계 상인을 보호해 비단길 교역으로 막대한 부를 쌓았다. 통엽호가 628년 살해된 뒤 쿨룩 시비르, 사 야브구, 돌륙 카간, 이슈바라 톨리스, 유쿠크 샤드, 이르비스 세귀 등이 차례로 올랐으나 내란이 이어졌고, 부족은 노실필(弩失畢)과 돌륙(咄陸)의 십성으로 나뉘어 다투었다. 당은 이 틈에 일부 카간을 책봉하며 영향력을 넓혔다. 651년 아사나하로(阿史那賀魯)가 당에서 받은 관직을 버리고 사발라 카간을 칭하며 독립하자 당은 657년 정월 소정방을 이려도 행군대총관으로 삼아 보냈다. 소정방은 657년 이르티시강 일대에서 하로의 군대를 크게 격파했고, 석국으로 달아난 하로는 석국 쪽이 넘겨 소사업이 사로잡았다. 이 원정에는 위구르 등 철륵 부족의 병사도 참가했다. 하로는 658년 음력 11월 장안에서 태종의 소릉에 바쳐졌고 곧 죽었다. 당은 서돌궐의 옛 땅에 곤릉·몽지 도호부를 두고 아사나 가문의 미사와 보진을 도호로 삼았는데, 곤릉도호부는 돌륙 5부를, 몽지도호부는 노실필 5부를 맡았다(설치 연도는 657~659년으로 갈린다). 658년에는 안서도호부를 다시 서주(고창)에서 구자로 옮겨 서역 4진을 통솔하게 했다. 당의 영향은 파미르 너머 이란계 나라들에도 미쳐 661년 무렵 그곳에 도독부를 설치했다고 한다. 이때가 당의 영역이 가장 넓었던 시기로 꼽히지만, 670년 토번이 안서 4진을 빼앗는 등(「토번의 토욕혼 병합과 대비천 전투」(뒤의 사건)) 이 지배는 오래 이어지지 못했다. 소정방은 660년 백제 정벌군의 총사령이기도 했다(「백제 멸망」(뒤의 사건))."
  subjects: [tang, tibet]
  tags: [war]
  sources: ["『구당서』 소정방전·서돌궐전", "『신당서』 돌궐전 하", "『자치통감』 당기 영휘 2년~현경 4년", "Pan Yihong, Son of Heaven and Heavenly Qaghan: Sui-Tang China and Its Neighbors (Western Washington University, 1997)"]

- id: kimi-protectorates-630
  year: 630
  endYear: 702
  title:
    ko: "당의 기미부주와 6도호부(630~702)"
  summary:
    ko: "당은 군현을 직접 두기 어려운 주변 지역을 기미(羈縻)로 다스렸다. 그 지역의 부족장이나 왕을 도독·자사로 임명하고 부족을 그대로 주(州)로 삼아 세습을 허용하되, 당의 호적과 세금을 면제해 주고 군대를 낼 의무를 지게 하는 방식이었다. 도독과 자사는 당 조정의 책봉을 받아야 정통성이 인정되었고, 군장에게는 당의 관직과 인수, 비단을 내리며 해마다 사절을 오가게 했다. 630년 동돌궐이 무너진 뒤 투항한 부족에 주와 도독부를 설치한 것이 대표적이다. 『신당서』 지리지는 이런 기미주를 수백 곳 적는다. 도독부와 주를 묶어 관할하는 기구가 도호부(都護府)였다. 640년 고창을 얻어 설치한 안서도호부(「당의 서역 진출: 고창 멸망과 안서도호부, 구자 정복과 안서 4진(640~649)」(뒤의 사건)), 646~647년 철륵 지역에 둔 연연도호부(뒤의 안북도호부, 「설연타의 흥기와 철륵 제부의 귀속: 이남 카간에서 연연도호부까지(628~647)」(앞의 사건)), 650년 운주에 처음 두고 663년 운중도호부로 고쳤다가 664년 선우대도호부가 된 선우도호부, 668년 평양에 둔 안동도호부(「고구려 멸망」(뒤의 사건)), 679년 안남도호부, 702년 북정도호부가 이어서 설치되어 이른바 6대 도호부를 이루었다. 660년 백제 땅에는 웅진도독부를 두었다(「백제 멸망」(뒤의 사건)). 그러나 679년부터 돌궐이 일어나(「후돌궐의 성립과 거란의 난」(뒤의 사건)) 682년 후돌궐이 서자 안북도호부는 몽골 초원에서 물러났다. 신라가 676년까지 나당 전쟁에서 이겨 웅진도독부와 안동도호부는 한반도에서 밀려났고, 안동도호부는 이후 요동으로 옮겨 가다 안사의 난 무렵 사실상 사라졌다(「안사의 난」(뒤의 사건)). 이 제도는 당의 위상을 높였으나 실질적 지배력은 약해 반란과 이탈이 잦았다."
  subjects: [tang, anbuk-dohobu, andong-dohobu, ungjin-dodokbu, eastern-turks]
  tags: [politics, diplomacy]
