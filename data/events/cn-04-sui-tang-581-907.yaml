- id: wu-rise-655
  year: 649
  endYear: 683
  title:
    ko: "고종 때 측천무후의 부상: 황후 책립에서 이성(二聖)과 천후까지(649~683)"
  summary:
    ko: "649년 태종이 죽고 아들 고종(이치)이 즉위하자, 태종의 후궁이었던 무조(武照), 곧 뒷날의 측천무후가 궁에 돌아와 고종의 총애를 받았다. 무조는 어린 나이에 태종의 재인(才人)으로 입궁했다가 태종이 죽자 감업사의 비구니가 되었던 사람이다. 655년 음력 10월 고종은 왕황후와 소숙비를 폐하고 무조를 황후로 세웠다. 폐위된 두 사람은 얼마 뒤 죽임을 당했다. 장손무기·저수량·한원 같은 원로는 반대했고 허경종·이의부·이적(李勣)은 찬성했다. 이 다툼은 태종 때부터 조정을 쥔 관롱 귀족과 과거로 오른 신진 관료 사이의 대립이기도 했다고 본다. 저수량은 655년 일찍 좌천되어 658년 귀양지 애주에서 죽었고 한원도 657년 쫓겨났다. 659년에는 장손무기가 모반 혐의로 유배되어 자결을 강요받았고, 그 뒤 재상 자리는 대체로 무후를 지지하는 인물들로 채워졌다. 660년 고종이 두통과 어지럼증으로 정무를 보기 어려워지자 무후가 문서를 처리하며 국정에 깊이 관여했고, 665년 무렵부터 두 사람은 ‘이성’(二聖)으로 불렸다. 이 무렵 당은 660년 백제, 668년 고구려를 무너뜨렸다(「백제 멸망」(뒤의 사건), 「고구려 멸망」(뒤의 사건)). 666년 태산 봉선 의식에는 황후인 무후가 처음으로 제사에 참여했다. 674년 고종은 천황, 무후는 천후라 칭했고 무후는 그해 농업 장려와 세금 경감 같은 12조의 건의를 올리기도 했다. 이듬해 완성된 룽먼 석굴 봉선사의 대불은 무후가 화장 비용 2만 관을 내놓았다고 한다. 무후는 북문학사라 불린 문사들을 곁에 두고 『신궤』 같은 책을 짓게 해 자신의 입장을 알렸다. 무후의 맏아들 태자 이홍이 675년 죽고 그 아우 이현(李賢)이 680년 모반 혐의로 폐위되자 셋째 이현(李顯, 677년 이철로 이름을 고쳤다)이 태자가 되었다. 683년 음력 12월 고종이 죽고 이철(중종)이 즉위했으나, 무후는 황태후로서 조정을 장악했다."
  subjects: [tang]
  tags: [politics]
  sources: ["『구당서』 고종본기·측천황후본기", "『신당서』 측천황후전", "『자치통감』 당기", "Richard W. L. Guisso, Wu Tse-t'ien and the Politics of Legitimation in T'ang China (Western Washington University, 1978)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: wu-zhou-684
  year: 684
  endYear: 705
  title:
    ko: "측천무후의 집권과 주(周)의 건국, 신룡 혁명(684~705)"
  summary:
    ko: "684년 음력 2월 중종이 장인 위현정을 재상으로 쓰려 하자 무후는 그를 폐위하고 아우 예종을 세웠으며, 자신은 황태후로서 조정을 맡았다. 같은 해 음력 9월 이경업(서경업)이 양저우에서 병사를 일으켰고 낙빈왕의 격문이 널리 읽혔으나 두 달 남짓에 평정되었다. 688년에는 당 종실인 월왕 이정(李貞)과 낭야왕 이충이 일어났다가 무너졌고, 이어 종실과 대신의 숙청이 이어졌다. 밀고를 장려해 내준신·주흥 같은 혹리가 공포를 불렀으나, 내준신 등은 697년 무렵 숙청되어 공포 정치는 막을 내렸다. 무후는 690년 음력 9월 예종을 물러나게 하고 국호를 주(周)라 하여 스스로 황제에 올랐으며(성신황제), 불경 『대운경』을 근거로 정통성을 내세웠다. ‘조(曌)’ 자를 비롯해 새 글자 십여 자를 만들게 했고, 뤄양(신도)을 도읍으로 삼아 장안과 함께 두 수도 체제로 운영했다. 692년 왕효걸이 안서 4진을 되찾아 서역의 당 지배를 이었다(「당과 토번의 화친과 전쟁: 금성공주의 혼인에서 장경 회맹까지(710~822)」(뒤의 사건)). 무후는 과거를 넓히고 황제가 직접 수험생을 시험하는 전시(殿試)를 처음 열었다고 하며, 적인걸 같은 인재를 썼다. 호구는 고종 때 380만 호에서 705년 615만 호로 늘었다고 한다. 696년 거란의 이진충이 일으킨 난은 동북의 당 통치를 흔들었다(「후돌궐의 성립과 거란의 난」(앞의 사건)). 698년에는 조카 무삼사를 후계로 삼으려던 계획을 접고 쫓아냈던 아들 이철(중종)을 다시 불러 황태자로 세웠다. 말년에는 장역지·장창종 형제를 가까이했는데, 705년 음력 1월 재상 장간지 등이 신룡 혁명을 일으켜 두 사람을 죽이고 무후를 물러나게 했다. 중종이 복위해 국호를 당으로 되돌렸고, 무후는 그해 음력 11월에 죽었다."
  subjects: [tang, khitan]
  tags: [politics]
  sources: ["『구당서』 측천황후본기·중종본기", "『신당서』 측천황후전", "『자치통감』 당기 수공~신룡", "Richard W. L. Guisso, Wu Tse-t'ien and the Politics of Legitimation in T'ang China (Western Washington University, 1978)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: kaiyuan-710
  year: 710
  endYear: 741
  title:
    ko: "개원의 치와 현종: 위후 제거에서 개원 연호의 끝까지(710~741)"
  summary:
    ko: "705년 복위한 중종은 위황후와 안락공주에게 휘둘렸고, 710년 중종이 갑자기 죽자 위황후가 어린 이중무(소제)를 세워 섭정하며 정권을 쥐려 했다. 같은 해 음력 6월 임치왕 이융기가 태평공주와 우림군 장수들과 손잡고 정변을 일으켜 위황후와 안락공주 일파를 제거하고 소제를 물러나게 한 뒤 아버지 예종을 복위시켰다. 712년 음력 8월 예종이 양위해 이융기가 즉위했고(현종), 713년 음력 7월 고모 태평공주 일파를 제거해 실권을 쥐었다. 현종은 연호를 개원(開元)으로 고쳐 741년까지 썼다. 개원 초 요숭은 정치의 열 가지 원칙(십사요설)을 올렸고, 요숭이 불필요한 관직을 줄이고 가짜 승려를 가려내 714년 1만 2,000여 명을 환속시켰다(『자치통감』). 뒤이어 송경, 장열·장구령 등 문신 재상이 정치를 이끌었는데, 과거로 오른 신진 관료인 이들이 귀족 출신과 겨루며 두각을 나타냈다. 이 시기 사회는 안정되어 『통전』에 따르면 호구는 이 번영이 이어진 끝에 755년(천보 14재)에 약 890만 호, 5,290만 명에 이르렀다. 725년에는 태산에서 봉선(封禪) 제사를 올렸고, 733년 배요경이 조운을 고쳐 강남의 곡식을 장안과 뤄양으로 나르기 쉬워졌다. 현종은 이원(梨園)이라는 음악 교습소를 두어 궁중 음악을 키웠다. 713년 현종은 고구려 유민의 나라 발해의 대조영을 발해군왕으로 책봉했다(「당, 대조영을 발해군왕으로 책봉」(뒤의 사건)). 그러나 번영의 이면에서 균전제와 부병제는 무너져 갔고(「당의 균전제·조용조·부병제와 그 무너짐(624~749)」(앞의 사건)) 변경에는 절도사가 늘었다(「절도사의 등장과 10절도사 체제(710~755)」(같은 해의 사건)). 개원 후반 정치는 점차 이임보에게 기울었다(「현종 후기의 정치: 이임보 독주와 양귀비·양국충(734~756)」(뒤의 사건))."
  subjects: [tang, balhae]
  tags: [politics]
  sources: ["『구당서』 현종본기·요숭전", "『신당서』 현종본기", "『자치통감』 당기 개원", "『통전』 식화전", "Denis Twitchett, Financial Administration under the T'ang Dynasty (2판, Cambridge University Press, 1970)", "Mark Edward Lewis, China's Cosmopolitan Empire: The Tang Dynasty (Harvard University Press, 2009)"]

- id: jiedushi-711
  year: 710
  endYear: 755
  title:
    ko: "절도사의 등장과 10절도사 체제(710~755)"
  summary:
    ko: "당은 변경에 도독 등을 두어 군대를 지휘하게 했으나 7세기 말 이후 토번·돌궐·거란의 침입이 잦아지면서 한 지역에 오래 머물며 군정을 맡는 장관이 필요해졌다. 710년 또는 711년(자료마다 갈린다) 하서 지방에 처음 절도사(節度使)를 두었다고 한다. 절도라는 이름은 황제가 내린 부절과 도끼(절월)로 군사를 지휘할 권한을 위임받은 데서 왔다. 부병제가 무너지자(「당의 균전제·조용조·부병제와 그 무너짐(624~749)」(앞의 사건)) 변경 방위는 모집한 직업 군인이 맡았고, 절도사는 임기가 정해지지 않은 채 그 군대와 둔전, 지역의 재정까지 쥐어 지휘관과 병사의 개인적 결속이 깊어졌다. 742년 무렵에는 안서·북정·하서·삭방·하동·범양·평로·농우·검남·영남의 10절도사가 변경을 지켰고, 『자치통감』에 따르면 병력은 49만 명, 말은 8만 필가량이었다. 안서는 구자, 북정은 지금의 신장 북부, 하서는 양주(涼州), 삭방은 영주(靈州), 하동은 타이위안, 범양은 유주(幽州), 평로는 영주(營州), 농우는 선주, 검남은 청두, 영남은 광저우에 본거지를 두었다. 가장 큰 상대는 서쪽의 토번이었고, 북쪽의 돌궐(후돌궐)과 동북의 거란·해도 상대했다. 변경에 병력이 쏠려 중앙이 약한 ‘외중내경’이 문제로 꼽힌다. 이임보 등은 문신 재상이 변경 장군으로 나갔다가 재상이 될까 꺼려 안녹산·고선지 같은 번장(蕃將)을 절도사로 쓰게 했다. 이 때문에 당의 변경군에는 이민족 장수와 병사가 많았다. 안녹산은 742년 평로, 744년 범양, 751년 하동의 절도사를 겸했고, 그가 맡은 세 진의 병력은 전체의 3분의 1에 가까웠다는 평가가 있다. 755년 이 군대가 반란을 일으켜 당의 체제를 흔들었다(「안사의 난」(뒤의 사건))."
  subjects: [tang, tibet, second-turks, khitan]
  tags: [politics, war]
  sources: ["『구당서』 직관지·현종본기", "『신당서』 병지·방진표", "『자치통감』 당기 천보 원년", "Edwin G. Pulleyblank, The Background of the Rebellion of An Lu-shan (Oxford University Press, 1955)", "The Cambridge History of China, vol. 3: Sui and T'ang China, 589–906, Part I (Denis Twitchett 편, Cambridge University Press, 1979)"]

- id: turks-orkhon-682
  year: 682
  endYear: 735
  title:
    ko: "후돌궐의 전성기와 오르콘 비문: 골돌록에서 빌게 카간까지(682~735)"
  summary:
    ko: "682년 골돌록(일테리시 카간)이 당의 지배에서 벗어나 돌궐을 다시 세웠다(「후돌궐의 성립과 거란의 난」(앞의 사건)). 그는 당에 귀순해 있던 돌궐 귀족 출신으로, 흩어진 수백 명을 모아 일어났다고 한다. 후돌궐은 몽골 초원의 오르콘강 유역 외튀켄 산지를 중심으로 삼았다. 골돌록이 죽은 뒤 동생 묵철이 691년 무렵 카간이 되어 당과 싸우며 영토를 넓혔고, 696년 거란의 이진충이 영주(營州)를 점령했을 때는 당의 요청에 응해 거란의 뒤를 쳤다. 묵철은 698년 당의 하북을 침입해 큰 피해를 주기도 했다. 묵철이 716년 무렵 철륵 부족의 반란을 진압하다 살해된 뒤 그 아들 이닐 카간(716~717)이 올랐으나, 퀼 테긴이 그를 죽이고 형 빌게를 카간으로 세웠다. 빌게 카간은 734년까지 나라를 다스렸다. 빌게 카간은 독살되었다는 기록이 있다. 빌게 카간 곁에서 동생 퀼 테긴(궐특근)이 군대를, 재상 톤유쿠크가 정치를 도왔는데, 톤유쿠크는 당에서 교육을 받은 인물로 세 카간을 섬겼다. 당과는 720년대 이후 화친으로 돌아섰고 비단을 말과 맞바꾸는 교역이 이어졌다. 퀼 테긴이 731년 죽자 현종은 사절을 보내 조문하고 비문과 석공의 일을 도왔다. 퀼 테긴 비의 한문 면에는 현종이 지은 글이 새겨졌다. 732년 세운 퀼 테긴 비와 735년 세운 빌게 카간 비는 돌궐 문자로 쓴 가장 오래된 긴 기록이다. 비석은 지금의 몽골 호쇼차이담에 있고, 돌궐 문자는 룬 문자와 닮아 돌궐 룬 문자라 부른다. 비문에는 당의 달콤한 말과 비단에 속아 나라를 잃지 말고 초원의 질서를 지키라는 경고가 새겨져 있다. 이 문자는 1893년 덴마크의 톰센이 해독했다. 후돌궐은 빌게 카간이 죽은 뒤 아들들과 뒤이은 카간들이 잇따라 암살되거나 쫓겨나는 내분을 겪다 744년 위구르와 카를룩 등에게 무너졌다(「후돌궐의 멸망과 위구르 칸국」(뒤의 사건))."
  subjects: [second-turks, tang, khitan]
  tags: [politics, culture]
