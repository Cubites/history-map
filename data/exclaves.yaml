# 대개 국경 생성기(scripts/geo/areas/의 권역 파일)의 직선 경계가 만·반도·해협을 가로질러 생긴 부산물이므로 생성기를 고친다.
# 역사적으로 실제 떨어져 있던 영토만 근거와 함께 적는다. at: 그 조각 안의 한 점 (면적이 아니라 위치로 허용한다)

