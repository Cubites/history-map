# 실제로 본토와 떨어져 있던 영토 (DESIGN.md §5.5)
# 빌드의 월경지 검사는 같은 육지 덩어리 위에서 본토와 떨어진 영토 조각을 찾는다. 이 목록에 없는 떨어진 조각은
# 대개 국경 생성기(scripts/generate-geo.mjs)의 직선 경계가 만·반도·해협을 가로질러 생긴 부산물이므로 생성기를 고친다.
# 역사적으로 실제 떨어져 있던 영토만 근거와 함께 적는다. at: 그 조각 안의 한 점 (면적이 아니라 위치로 허용한다)

- entity: joseon
  from: 1592
  to: 1593
  at: [127.07, 35.27]
  reason: 임진왜란 첫해 일본군이 부산~한양~평양 축을 장악해 의주 행재소와 전라도가 육로로 끊겼다. 이순신 수군과 웅치·이치 전투로 전라도를 지켰다
  sources: ["『선조실록』 선조 25년", "유성룡, 『징비록』"]

- entity: russia
  from: 1898
  to: 1905
  at: [121.99, 39.3]
  reason: 여대조지조약(1898)으로 조차한 관동주(뤼순·다롄). 포츠머스 조약(1905)으로 일본에 넘어갔다
  sources: ["여대조지조약(1898)", "포츠머스 조약(1905)"]

- entity: occupied-china
  from: 1938
  to: 1946
  at: [113.0, 23.3]
  reason: 광둥 작전(1938년 10월)으로 생긴 화남 점령지. 1944년 이치고 작전 전까지 화북·화중 점령지와 떨어져 있었다
  sources: ["일본 방위청 방위연수소 전사실, 『전사총서』 광둥 작전"]

- entity: occupied-china
  from: 1937
  to: 1938
  at: [120.3, 31.57]
  reason: 1937년 말 상하이~난징~항저우 일대와 창장 북안(푸커우~추셴, 양저우, 징장)의 화중 점령지. 화북 점령지(남쪽 끝 지난·타이안)와는 쉬저우·벙부 일대를 사이에 두고 약 450km 떨어져 있었고, 1938년 5월 쉬저우 점령으로 이어졌다
  sources: ["국사편찬위원회 우리역사넷 『한국사 연대기』 중일전쟁", "일본 방위청 방위연수소 전사실, 『전사총서』 지나사변 육군작전 1·2"]

- entity: usa
  from: 1867
  to: null
  at: [-147.7, 64.8]
  reason: 1867년 러시아에서 사들인 알래스카. 캐나다를 사이에 두고 본토와 떨어져 있다
  sources: ["알래스카 매입 조약(1867)", "영러 조약(1825)"]
