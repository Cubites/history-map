# 일부러 뺀 것: 아크바르 ↔ 악바르·샤자한 ↔ 샤 자한(위키와 교과서가 갈림), 하르샤 ↔ 하르사(하르사크누트에 걸림), 간디 ↔ 간지(간지 '干支' 낱말에 걸림), 부다 ↔ 붓다(부다페스트에 걸림), 팀부 ↔ 팀푸·무지부르 라만 ↔ 라흐만(자료마다 갈림).

