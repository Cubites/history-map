# 정밀도 구역 파일 (docs/guides/standards.md 2절 '정밀도 등급과 끝 기준', 11절 '등급 다각형')
# 읽는 곳: test:geo islands·gaps·lines (scripts/test-geo/zones.ts), scripts/area-geo.ts(npm run area:geo), 인계 폴더 tools/approx-check.mjs
# 읽는 모듈이 형식을 검사한다. 틀리면 이유를 한국어로 보이고 test:geo는 종료 코드 2로 멈춘다(등급 이름 오타, 닫히지 않은 다각형, 모르는 칸 이름 등).
#
# ── 칸의 뜻 ─────────────────────────────────────────────────────────────
# grades        끝 기준: '고칠지'를 정하는 값. 구역의 등급이 고른다 (standards.md 2절 표와 같아야 함)
#   label       화면에 보이는 이름
#   landKm2     땅(잘못 칠함·빈 땅)을 고칠 최소 넓이 km²
#   shift       해 어긋남: [[최소 넓이 km², 햇수], ...] — 그 넓이 이상이 사료와 그 햇수보다 더 다를 때만 고침. 위에서부터 먼저 맞는 쌍
#   lineMeanKm  손그림 선의 평균 거리 끝 기준 km
#   lineMaxKm   손그림 선의 최대 거리 끝 기준 km
#   islandKm2   고칠 섬의 최소 넓이 km². 0이면 크기 무관(한국 섬 전부 — 한국 섬 크기 무관은 grades.core.islandKm2: 0 한 곳에서 정한다)
# defaultGrade  어느 구역에도 들지 않는 곳의 등급
# tests         test:geo가 쓰는 '검사 값'(끝 기준이 아니라 검사의 감도). 구역의 tests가 항목별로 덮어쓴다. 코드에 박아 두었던 값과 같게 둔다
#   islandKm2   [최소, 최대] km²: 이 범위의 land-50m 섬만 '사라진 섬' 검사에 넣는다(섬 안쪽 점이 든 구역의 값)
#   gapMinKm2   '빈 땅' 검사가 세는 조각의 최소 넓이 km². 칸(구역 gapZone, 해안으로 자른 도형) 하나에는 그 도형과 겹치는 모든 구역(도형이 구역들 바깥으로도 나가면 위쪽 기본 tests도)의
#               gapMinKm2 가운데 가장 작은(엄격한) 값을 쓴다. 캐시 열쇠에 들어감 — 바꾸면 gaps 캐시를 새로 계산
#   gapGrowKm2  빈 땅 총넓이가 기준선보다 이만큼 넘게 늘면 실패 (gapMinKm2와 같은 규칙: 겹치는 구역들 가운데 가장 작은 값)
#               ※ 유럽처럼 시기마다 큰 gapZone 하나가 넓게 걸치는 곳에서는 구역 하나의 값이 그 칸 전체에 영향을 준다(느슨하게 못 만들고 엄격하게만 된다).
#               ※ npm run check:gaps(scripts/check-gaps.ts)는 500 고정이라 구역 값을 바꾸면 두 명령의 결과가 갈린다.
#   lineTolKm   손그림 선 기본 허용 km, 강·해안 따로 (선의 첫 꼭짓점 — `구간 i-j`가 있으면 그 구간 첫 점 — 이 든 구역의 값)
# zones         정밀도 구역 목록. 위에서부터 먼저 맞는 구역 하나만 쓴다(점 기준, 짝홀 판정)
#   id          구역 이름 (영문 소문자·숫자·-). 겹치지 않게
#   grade       grades의 키
#   note        메모(선택)
#   polygon     [[경도, 위도], ...] 닫힌 고리(처음 점 = 끝 점), 도 단위. 스스로 겹치면 안 됨
#   tests       이 구역만 다른 검사 값(선택). 위 tests와 같은 칸 이름, 적은 칸만 덮어씀
#
# ── 우선순위 (값을 정하는 순서) ─────────────────────────────────────────
#   선 꼬리표의 허용(`// @기준선 ... 허용 N km`) > 구역 tests > 위쪽 기본 tests
#   (꼬리표에 허용이 적혀 있으면 늘 그 값. 없을 때만 구역 파일.)
#
# ── 구역을 더하는 법 ────────────────────────────────────────────────────
#   zones 목록에 id·grade·polygon을 가진 항목을 더한다. 겹치는 곳은 위에 적은 구역이 이긴다 → 좁은 구역(핵심)을 위에, 넓은 구역(주변)을 아래에.
#   새 지역은 일반(normal)이 기본값이므로 중심부는 구역을 더하지 않아도 된다. 가장자리(한국사와 닿는 시기만 그리는 곳)에는 grade: edge 구역을 더한다.
#   검사 값(islandKm2 등)을 바꿔야 할 때만 그 구역에 tests를 적는다.
#
# ── 지금 있는 구역 ──────────────────────────────────────────────────────
#   korea-core 한 개(핵심), 서아시아·북아프리카의 주변(edge) 두 개(arabia-interior·sahara-interior, 2026-10-29 0단계). 그 밖은 기본 일반.
#   새 지역을 추가할 때 그 가장자리에 grade: edge 구역을 더한다.

grades:
  core: { label: 핵심, landKm2: 2500, shift: [[50000, 3], [10000, 10]], lineMeanKm: 5, lineMaxKm: 10, islandKm2: 0 }
  normal: { label: 일반, landKm2: 10000, shift: [[50000, 3], [10000, 10]], lineMeanKm: 10, lineMaxKm: 25, islandKm2: 1000 }
  edge: { label: 주변, landKm2: 50000, shift: [[250000, 3], [50000, 10]], lineMeanKm: 25, lineMaxKm: 50, islandKm2: 5000 }

defaultGrade: normal

tests:
  islandKm2: [5, 30000]
  gapMinKm2: 500
  gapGrowKm2: 500
  lineTolKm: { 강: 3, 해안: 2 }

zones:
  # 한반도·제주·독도, 만주(헤이룽장·지린·랴오닝·네이멍구 동부)와 연해주 남부(하바롭스크 시내까지), 일본 열도(홋카이도~규슈)·류큐(아마미~요나구니)를 덮는 거친 다각형(꼭짓점 23개).
  # 북쪽은 아무르·아르군강을 따라 그은 선, 서쪽은 랴오시 회랑(약 119.3E)·네이멍구 동부(약 117~118E)에서 끊어 화북 평원(허베이 내륙·산둥)·몽골 고원은 뺐다. 경계는 ±1°(약 100km) 정도로 거칠다.
  # 바다는 넓게 포함한다(황해·동해·동중국해 북부). 사할린·쿠릴 북부·오가사와라는 포함하지 않는다.
  - id: korea-core
    grade: core
    note: 한반도·만주·일본 열도·류큐
    polygon:
      - [117.4, 49.6]   # 만저우리 (헤이룽장·네이멍구 북서쪽 모서리)
      - [120.0, 52.2]   # 아르군강 (러시아 국경 따라)
      - [122.4, 53.7]   # 모허 (북쪽 끝)
      - [126.0, 53.2]   # 아무르강
      - [127.9, 50.0]   # 헤이허 (아무르강 굽이)
      - [135.5, 48.9]   # 연해주 북쪽 끝 (하바롭스크 시내(약 135.1E 48.5N)는 이 선보다 남쪽이라 다각형 안에 든다 — 우수리 유역이라 포함해도 무방)
      - [138.8, 47.4]   # 연해주 북동 바다 쪽
      - [138.6, 45.9]
      - [146.0, 45.9]   # 홋카이도 북쪽 바다 (사할린 남단은 걸치는 정도)
      - [146.0, 41.2]   # 홋카이도 동쪽 (구나시리 포함)
      - [143.5, 35.0]   # 혼슈 동쪽 바다
      - [135.0, 32.4]   # 기이반도 남쪽 바다
      - [131.8, 30.0]   # 규슈 남쪽 (다네가시마·야쿠시마 포함)
      - [129.5, 26.5]   # 아마미~오키나와 동쪽 바다
      - [126.0, 23.7]   # 미야코 남쪽
      - [122.3, 23.6]   # 요나구니·하테루마 남쪽 (타이완 동해안은 빼려고 122.3E)
      - [123.5, 31.5]   # 동중국해 (상하이·저우산 바깥, 제주는 안)
      - [122.9, 38.0]   # 황해 북부 (산둥 반도 동쪽 끝은 밖)
      - [121.0, 38.5]   # 랴오둥 반도 남쪽
      - [119.3, 39.4]   # 보하이 만 (산하이관·친황다오 쪽은 안)
      - [118.4, 42.0]   # 랴오시 회랑 서쪽 (청더는 밖, 츠펑 안)
      - [117.3, 43.5]   # 네이멍구 동부 서쪽 가장자리
      - [118.0, 47.5]   # 몽골 국경 근처 (몽골 고원은 밖)
      - [117.4, 49.6]   # 닫는 점 (처음 점과 같음)

  # ── 서아시아·북아프리카 주변 구역 (2026-10-29, docs/middle-east/00-scope.md 3절) ──
  # 일반(기본): 비옥한 초승달(레반트·메소포타미아·시리아 사막 가장자리)·나일강 골짜기와 삼각주·이란 고원·마그레브 해안과 아틀라스·히자즈·예멘·오만 해안.
  # 주변: 아래 두 다각형(아라비아 내륙, 사하라 내륙). 경계는 ±1°(약 100km) 정도로 거칠고 바다를 조금 덮어도 된다.
  # 사하라 다각형의 남쪽 변은 리비아·알제리·서사하라 남쪽 국경을 대강 따라 말리·니제르·차드·모리타니·수단(5묶음 사하라 이남)은 넣지 않았다.
  - id: arabia-interior
    grade: edge
    note: 아라비아 내륙(나지드·나푸드·룹알할리), 히자즈·아시르·예멘·오만·걸프 해안은 밖
    polygon:
      - [38.5, 31.5]    # 북쪽 (요르단·사우디 국경 남쪽, 시리아 사막은 밖)
      - [44.0, 29.8]    # 이라크·사우디 국경 (유프라테스 하류는 밖)
      - [47.0, 28.5]    # 쿠웨이트 서쪽
      - [48.8, 26.5]    # 걸프 해안 안쪽 (카티프는 밖)
      - [49.0, 24.0]    # 알아흐사(호푸프 약 49.6E)는 밖
      - [51.5, 23.2]    # 카타르·아랍에미리트 남쪽
      - [54.5, 22.8]
      - [55.5, 20.5]    # 오만 내륙 (하자르산맥·해안은 밖)
      - [53.0, 18.0]    # 도파르 북쪽
      - [49.0, 17.3]    # 하드라마우트 북쪽
      - [45.0, 17.3]    # 예멘 북쪽 (사나·마리브는 밖)
      - [43.0, 19.0]    # 아시르 동쪽 (아브하는 밖)
      - [41.5, 21.0]    # 메카·타이프 동쪽
      - [40.8, 25.0]    # 메디나(약 39.6E) 동쪽
      - [39.0, 27.5]
      - [37.8, 29.5]
      - [38.5, 31.5]    # 닫는 점

  - id: sahara-interior
    grade: edge
    note: 사하라 내륙(서사하라·알제리·튀니지·리비아 남부, 이집트 서부 사막), 마그레브 해안·아틀라스·나일 골짜기·파이윰은 밖
    polygon:
      - [-13.0, 28.5]   # 타르파야 북쪽 (서사하라는 통째로 안)
      - [-9.5, 29.3]    # 안티아틀라스 남쪽 (수스·아가디르는 밖)
      - [-5.5, 30.0]    # 드라 골짜기
      - [-2.0, 31.5]    # 피기그 남쪽
      - [1.0, 32.6]     # 사하라 아틀라스 남쪽
      - [3.5, 33.3]
      - [6.0, 34.0]     # 비스크라·오레스 남쪽
      - [8.0, 33.8]     # 토죄르 둘레
      - [10.0, 33.3]    # 가베스 남쪽 (해안은 밖)
      - [11.5, 32.2]    # 나푸사 산지 남쪽
      - [13.5, 31.6]
      - [16.5, 30.6]    # 시르테만 안쪽
      - [19.5, 30.3]
      - [21.0, 31.8]    # 키레나이카 제벨 아흐다르 남쪽
      - [23.5, 31.8]
      - [25.0, 31.0]    # 이집트 국경
      - [28.5, 30.6]    # 알알라메인 안쪽
      - [30.2, 29.6]    # 파이윰 서쪽 (나일 삼각주·파이윰은 밖)
      - [30.3, 28.0]    # 민야 서쪽
      - [30.7, 27.0]    # 아시우트 서쪽
      - [32.0, 25.6]    # 룩소르 서쪽
      - [32.5, 24.0]    # 아스완 서쪽
      - [32.5, 22.0]    # 이집트·수단 국경 (나세르호는 밖)
      - [25.0, 22.0]    # 이집트·리비아·수단 세 나라 점
      - [24.0, 19.5]    # 리비아 남동쪽 끝
      - [16.0, 23.45]   # 리비아·니제르·차드 세 나라 점
      - [12.0, 23.5]    # 알제리·리비아·니제르
      - [4.2, 19.1]     # 알제리·니제르·말리
      - [-4.8, 25.0]    # 알제리·말리·모리타니
      - [-8.7, 26.0]    # 알제리·서사하라·모리타니 둘레
      - [-12.0, 26.0]
      - [-12.0, 23.4]
      - [-13.0, 21.3]
      - [-17.2, 21.3]   # 서사하라 남쪽 끝 (누아디부 반도 둘레)
      - [-17.5, 24.0]   # 바다
      - [-15.0, 27.0]   # 바다
      - [-13.0, 28.5]   # 닫는 점
