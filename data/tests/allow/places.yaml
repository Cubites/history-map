# test:geo places 허용 목록: 알려진 예외를 이유와 함께 적는다(검사가 낸 항목의 열쇠와 맞으면 실패로 세지 않음).
# 형식(목록): key(검사 항목 열쇠, 끝에 `*` 하나는 앞부분 일치), reason(이유, 필수), decided(누가·어느 세션이 정했는지, 선택).
# 열쇠 꼴: 평소 지도 `<해> <이름> [<경도>,<위도>]` (좌표는 소수 2자리), 전쟁 보기 `<전쟁 id>/<전역 id> <날짜> <이름> [<경도>,<위도>]`.
# 맞는 항목이 하나도 없는 줄은 보고서에 '낡음'으로 나온다(지워도 되는지 확인).
# 예:
# - key: '1592 서울 [126.98,37.57]'
#   reason: 임진왜란 중 왜군 점령 기간이라 조선이 아님(의도)
#   decided: 세션 I1 결과노트
