# test:geo 허용 목록: 사건 연결(events) — 의도하여 사건과 이어 두지 않은 것 (검사 d, scripts/test-geo/checks/events.ts)
# 한 항목: key(검사가 내는 열쇠 `<해> <id> 성립|소멸|버전`), reason(이유), decided(누가 언제 정했는가). key 끝 `*` 하나는 앞부분이 같은 모든 열쇠를 허용.
# 아무 항목에도 맞지 않는 줄은 요약에서 '낡은 허용 줄'로 알린다(이유가 사라졌으면 지울 것).
# 첫 내용은 설계 때 전 범위(-2400~2026)에서 실제로 연결되지 않던 10건이다. 앞 4건은 운영자가 정했고, 뒤 6건은 476년 이전이라 세션 G·E 범위 밖이어서 그대로 둔다.

