  decided: 운영자 결정 (세션 C2, 인계 노트 기록)
- key: '1848 usa 버전'
  reason: 미국 1848은 첫 버전이라 앞 버전과의 대칭차가 크게 나옴 (1만 km² 이상이어도 사건을 잇지 않기로 함)
  decided: 운영자 결정 (세션 C2, 인계 노트 기록)

