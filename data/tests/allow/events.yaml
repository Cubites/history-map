# test:geo 허용 목록: 사건 연결(events) — 의도하여 사건과 이어 두지 않은 것 (검사 d, scripts/test-geo/checks/events.ts)
# 한 항목: key(검사가 내는 열쇠 `<해> <id> 성립|소멸|버전`), reason(이유), decided(누가 언제 정했는가). key 끝 `*` 하나는 앞부분이 같은 모든 열쇠를 허용.
# 아무 항목에도 맞지 않는 줄은 요약에서 '낡은 허용 줄'로 알린다(이유가 사라졌으면 지울 것).
# 첫 내용은 설계 때 전 범위(-2400~2026)에서 실제로 연결되지 않던 10건이다. 앞 4건은 운영자가 정했고, 뒤 6건은 476년 이전이라 세션 G·E 범위 밖이어서 그대로 둔다.

# ── 운영자 결정 ──
- key: '935 zubu 소멸'
  reason: 소멸 해 935는 지도 약속 해라서 사건과 이을 수 없음
  decided: 운영자 결정 (세션 C2, 인계 노트 기록)
- key: '1104 tamna 소멸'
  reason: 탐라가 탐라군이 된 사건(tamna-county-1105)의 subjects에 tamna가 없어 소멸(1104)과 이어지지 않음. 운영자가 그대로 두기로 함
  decided: 운영자 결정 (세션 C2, 인계 노트 기록)
- key: '1509 mongols 버전'
  reason: 몽골 1509는 첫 버전이 아니다(data/geo의 mongols 버전은 1388·1509·1636·1691). 1만 km² 넘는 변화이지만 그 해 변화가 이어질 사건이 없어, 운영자가 사건을 잇지 않고 남기기로 함
  decided: 운영자 결정 (세션 C2, 인계 노트 기록)
- key: '1848 usa 버전'
  reason: 미국 1848은 첫 버전이라 앞 버전과의 대칭차가 크게 나옴 (1만 km² 이상이어도 사건을 잇지 않기로 함)
  decided: 운영자 결정 (세션 C2, 인계 노트 기록)

