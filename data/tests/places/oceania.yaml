# oceania 권역 국경 지점 정답표 (평소 지도, 0단계 new:area가 만든 틀 — 오세아니아 M1 뼈대 2026-11-17이 칸 머리를 둠)
# 읽는 곳: scripts/test-geo (npm run test:geo -- --only places). 꼴은 docs/DATA_GUIDE.md의 정답표 절을 따른다. 나라·시대마다 몇 점인지는 칸 지시문이 정한다(standards.md 9절 10, 00-scope 8절 — 나라마다 수도 1점 + 바뀌는 해 앞뒤, 동경 141° 양쪽·하와이·날짜변경선 양쪽(람바사 179.34·라우 −178.7·채텀 −176.55)).
# 지점은 칸 머리 아래 - name: …로 적는다(주석만 있는 파일은 빈 목록으로 읽힘). 해는 천문 연도, 경도는 −180~180(필터 범위의 236 꼴은 쓰지 않음), 새 지점은 url을 반드시 단다.

