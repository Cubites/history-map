# 유럽 국경 지점 정답표 (평소 지도: 해마다 이 지점을 덮는 항목)
# 읽는 곳: scripts/test-geo (npm run test:geo -- --only places). 꼴은 docs/DATA_GUIDE.md의 정답표 절을 따른다.
# 만든 방법: 세션 FIX5a·FIX5b·D2(AN4)·I1(돈강·테르스키 해안·킬리아) 결과 노트의 '지점 판정' 표에서 좌표와 승인된 소속을 옮기고,
#   data/geo 원자료로 다시 판정해 지금 지도와 같은 것만 넣었다(다른 것은 검토 대기).
# 기대값 expect = 항목 id. range는 양끝 포함(그 안에서 주인이 바뀌는 해마다 확인). url이 '필요'이면 legacy: true(근거를 나중에 채움).
# expect: none 지점은 region(europe|east-asia)을 함께 적는다(--region 거르기에 걸리려면 필요). 새 지점은 url을 반드시 달 것. 해는 천문 연도(기원전 N년 = 1-N).

