<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 밝은·어두운 화면을 사이트가 직접 지원함을 브라우저에 미리 알린다(2026-11-27). CSS(:root의 color-scheme)에만 있으면 늦게 읽혀,
         삼성 브라우저처럼 밝은 사이트를 스스로 어둡게 덧칠하는 브라우저가 지도는 밝게 두고 단추·글자만 어둡게 바꿔 색이 어긋났다 -->
    <!-- 2026-11-27 실험: "light dark"로는 삼성 브라우저의 덧칠이 멈추지 않아 only를 붙여 본다(이 색 구성만 쓰고 브라우저가 바꾸지 말라는 뜻).
         어두운 화면일 때는 styles.css의 :root가 only dark로 바꾼다 -->
    <meta name="color-scheme" content="only light" />
    <title>역사 지도</title>
    <!-- 삼성 브라우저 표시(2026-11-27): 그 브라우저의 강제 어둡게 덧칠에 맞춘 색 차이를 주기 위해 html에 .samsung을 붙인다(styles.css 끝) -->
    <script>
      if (/SamsungBrowser/.test(navigator.userAgent)) document.documentElement.classList.add('samsung');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
